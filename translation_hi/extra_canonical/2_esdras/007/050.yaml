  yaml_path: translation/extra_canonical/2_esdras/007/050.yaml
  text: For this reason the Most High did not make one age, but two.
translation:
  language: hi
  text: इसी कारण परमप्रधान ने एक युग नहीं, बल्कि दो युग बनाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Propter hoc
  choice: इसी कारण
  rationale: यह पूर्ववर्ती कथन से स्पष्ट कारणात्मक संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त सर्वोच्चता-सूचक उपाधि का औपचारिक और प्रचलित हिन्दी रूप है।
- source_word: saeculum
  choice: युग
  rationale: इस प्रसंग में शब्द वर्तमान और आने वाले दो युगों की धारणा व्यक्त करता है; इसलिए ‘संसार’ या केवल ‘समय’ की अपेक्षा ‘युग’ अधिक सटीक है।
- source_word: fecit
  choice: बनाए
  rationale: ‘दो युग’ के साथ हिन्दी में बहुवचन क्रिया स्वाभाविक है और लैटिन क्रिया के मूल अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: दो युगों का स्वरूप
  choice: ‘एक युग नहीं, बल्कि दो युग’—बिना अतिरिक्त व्याख्या के
  alternative: ‘यह संसार और आने वाला संसार’
  rationale: मूल पाठ केवल दो युगों की संख्या बताता है; उनकी पहचान जोड़ना पाठ की अंतर्निहित संक्षिप्तता और संभावित व्याख्यात्मक खुलापन समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘नहीं, बल्कि’ से लैटिन विरोधात्मक संरचना unum… sed duo स्वाभाविक हिन्दी में व्यक्त होती है।
