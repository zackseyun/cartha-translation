  footnotes:
  - marker: a
    text: लैटिन में ‘नहीं’ पिछले पद के अंत में है और यहाँ ‘प्रवेश करेंगे’ क्रिया को निषेधित करता है।
    reason: पद-विभाजन के आर-पार फैली वाक्य-रचना स्पष्ट करने और भ्रामक सकारात्मक अर्थ से बचाने के लिए।
lexical_decisions:
- source_word: ingredientur
  choice: वे प्रवेश ... करेंगे
  rationale: यह भविष्यकालीन क्रिया पिछले पद के अंत में आए non से निषेधित है; हिन्दी में अर्थ स्पष्ट रखने के लिए ‘नहीं’ को क्रिया के साथ रखा गया है।
- source_word: uagantes erunt
  choice: भटकते रहेंगे
  rationale: यह चलती रहने वाली, दिशाहीन दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: amodo
  choice: अब से
  rationale: समय के उस बिंदु से आगे जारी रहने वाली दशा का सीधा अर्थ।
- source_word: in cruciamentis
  choice: यातनाओं में
  rationale: cruciamenta की पीड़ादायक दंड अथवा कष्ट की प्रबल भावना सुरक्षित रहती है।
- source_word: dolentes semper et tristes
  choice: सदा दुःखी और उदास
  rationale: दोनों भाववाचक विशेषणों का भेद बनाए रखते हुए सहज और गरिमापूर्ण हिन्दी दी गई है।
theological_decisions:
- issue: पद 80 के non का पद 81 की ingredientur पर प्रभाव
  choice: मुख्य पाठ में ‘नहीं’ को ‘प्रवेश करेंगे’ के साथ रखा गया
  alternative: पद की लैटिन सीमा का यांत्रिक अनुसरण करते हुए केवल ‘प्रवेश करेंगे’ कहना
  rationale: लैटिन वाक्य पद-विभाजन के आर-पार चलता है; non को छोड़ने पर अर्थ उलटकर सकारात्मक हो जाता। पादटिप्पणी पाठकीय पारदर्शिता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘भटकते रहेंगे’ निरंतर दशा को और ‘यातनाओं’ मूल की तीव्रता को बनाए रखता है।
