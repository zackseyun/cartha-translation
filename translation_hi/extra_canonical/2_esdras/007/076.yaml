translation:
  language: hi
  text: वे समय आएँ[क], जिनमें आप सृष्टि का नवीनीकरण करना आरम्भ करेंगे, या क्या हम अभी से यातना भोग रहे हैं?” और उसने मुझे उत्तर दिया, “मैं तुम्हें यह भी दिखाऊँगा; पर तुम उनके साथ न मिलना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “और उसने मुझे उत्तर दिया, ‘मैं तुम्हें यह भी दिखाऊँगा; पर अपने को उन लोगों के साथ न मिलाना जिन्होंने तिरस्कार किया है, और अपने को यातना भोगनेवालों में न गिनना।’”
    reason: पूर्ववर्ती अनुवाद-पद्धति/पद-सीमा का वैकल्पिक पाठ; यह वर्तमान लातीनी 7:76 के पाठ का अनुवाद नहीं है, क्योंकि उस वैकल्पिक रूप में अगले पद की सामग्री सम्मिलित है।
lexical_decisions:
- source_word: ueniant tempora illa
  choice: वे समय आ जाएँ
  rationale: लातीनी वर्तमान संभावनार्थक रूप यहाँ अपेक्षित/भावी समयों के आने का भाव देता है। पद पिछले वाक्य के बीच से आरम्भ होता है, इसलिए हिन्दी में स्वाभाविक निरन्तरता रखते हुए इसे अनावश्यक आज्ञार्थक अर्थ नहीं दिया गया।
- source_word: creaturam renouare
  choice: सृष्टि को नया करना
  rationale: creatura के व्यापक अर्थ और renouare के नवीकरण-भाव को सरल, वर्तमान हिन्दी में सुरक्षित रखता है।
- source_word: amodo cruciamur
  choice: हमें अभी से यातना सहनी पड़ती है
  rationale: amodo का ‘अभी से/अब से’ और cruciamur का वर्तमान निष्क्रिय यातना-भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ostendam tibi et hoc
  choice: मैं तुम्हें यह भी दिखाऊँगा
  rationale: भविष्यकाल तथा et hoc के ‘यह भी’ दोनों को सीधे सुरक्षित रखा गया है।
- source_word: tu autem noli commisceri cum eis
  choice: पर तुम अपने को उनके साथ न मिलाना
  rationale: tu autem के बलाघात को ‘पर तुम’ से रखा गया है और eis का अस्पष्ट पूर्वपद ‘उनके’ के रूप में अनसुलझा छोड़ा गया है।
theological_decisions:
- issue: वक्ता को सम्बोधित करने में सर्वनाम
  choice: आप
  alternative: तू/तुम
  rationale: incipies में एकवचन सम्बोधन है, पर सम्मान-स्तर निर्दिष्ट नहीं है। आधुनिक मानक हिन्दी में प्रश्न के सम्मानपूर्ण स्वर के लिए ‘आप’ चुना गया; इससे कोई साम्प्रदायिक व्याख्या नहीं जोड़ी जाती।
- issue: eis का संदर्भ
  choice: उनके
  alternative: उन लोगों के जिन्होंने तिरस्कार किया
  rationale: इस पद के लातीनी पाठ में eis का स्पष्ट संज्ञात्मक पूर्वपद नहीं है। अगले पद की सामग्री को इस पद में आयात न करके मूल अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरम्भ को वाक्यांशात्मक ही रहने दिया गया है क्योंकि उपलब्ध लातीनी पद पिछले प्रश्न के बीच से शुरू होता है। प्रत्यक्ष संवाद में प्रश्नकर्ता द्वारा सम्मानसूचक ‘आप’ और उत्तरदाता द्वारा ‘तुम’ का प्रयोग प्रसंगानुकूल है।
