id: 2ES.7.72
reference: 2 Esdras 7:72
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Qui ergo commorantes sunt in terra, hinc cruciabuntur, quoniam sensum habentes iniquitatem fecerunt, et mandata accipientes non seruauerunt ea, et legem consecuti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/072.yaml
  text: Therefore those who dwell on the earth will be tormented for this reason, because though they had understanding they committed iniquity, and though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it.
translation:
  language: hi
  text: 'इसलिए जो लोग पृथ्वी पर रहते हैं, वे इसी कारण यातना पाएँगे: समझ-बूझ होते हुए भी उन्होंने अधर्म किया; आज्ञाएँ पाकर भी उनका पालन नहीं किया; और व्यवस्था पाकर भी उसके साथ छल किया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए लैटिन स्रोत-पाठ का अंश “और व्यवस्था पाकर…” (et legem consecuti) पर अधूरा समाप्त होता है। अंतिम शब्द “उसके साथ छल किया” परामर्श-पाठ में संरक्षित वाक्य की पूर्णता के अनुसार दिए गए हैं।
    reason: प्रस्तुत मूल-भाषा साक्ष्य की पाठगत अपूर्णता को छिपाए बिना पाठक को अंतिम उपवाक्य के आधार से अवगत कराना।
lexical_decisions:
- source_word: commorantes sunt in terra
  choice: जो लोग पृथ्वी पर रहते हैं
  rationale: यह वर्तमान निवास का स्वाभाविक और सीधा हिन्दी रूप है; लैटिन अभिव्यक्ति के व्यापक मानवीय संदर्भ को बनाए रखता है।
- source_word: cruciabuntur
  choice: यातना पाएँगे
  rationale: भविष्यकाल और दंडजन्य पीड़ा—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: sensum habentes
  choice: समझ-बूझ होते हुए भी
  rationale: sensum को केवल बौद्धिक ज्ञान तक सीमित न करके नैतिक समझ की क्षमता सहित व्यक्त करता है; concessive force संदर्भ से स्पष्ट की गई है।
- source_word: iniquitatem fecerunt
  choice: उन्होंने अधर्म किया
  rationale: iniquitas के नैतिक अर्थ को dignified, familiar biblical Hindi में व्यक्त करता है।
- source_word: mandata accipientes non seruauerunt ea
  choice: आज्ञाएँ पाकर भी उनका पालन नहीं किया
  rationale: seruare का यहाँ आशय आज्ञाओं को मानना/पालन करना है; यह हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: legem consecuti
  choice: व्यवस्था पाकर भी
  rationale: lex के लिए बाइबिलीय किन्तु सामान्यतः बोधगम्य 'व्यवस्था' चुना गया है; consecuti का अर्थ यहाँ प्राप्त करना है।
theological_decisions:
- issue: दंड का कारण और मानवीय उत्तरदायित्व
  choice: ‘इसी कारण’ के बाद समझ, आज्ञाओं और व्यवस्था के बावजूद किए गए अधर्म को कारण के रूप में रखा गया
  alternative: वाक्य को इस प्रकार ढालना कि दंड केवल व्यवस्था-भंग के कारण हो
  rationale: लैटिन तीन समानांतर आधारों द्वारा उत्तरदायित्व स्थापित करता है; अनुवाद इस तनाव और क्रम को बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
- issue: lex का अनुवाद
  choice: व्यवस्था
  alternative: कानून / मूसा की व्यवस्था
  rationale: ‘व्यवस्था’ स्रोत के सामान्य शब्द को बनाए रखता है; ‘मूसा की’ जोड़ना स्रोत से अधिक विशिष्ट होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सहज। तीनों विरोधसूचक उपवाक्यों में ‘होते हुए भी/पाकर भी’ द्वारा लैटिन के participial constructions का नैतिक-विरोधी बल स्वाभाविक हिन्दी में व्यक्त किया गया है।
