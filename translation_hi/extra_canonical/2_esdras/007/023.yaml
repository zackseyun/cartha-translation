  text: and set before themselves schemes of sins, and even said that the Most High does not exist, and they did not know his ways.
translation:
  language: hi
  text: और उन्होंने अपने सामने पाप करने की युक्तियाँ रखीं। उन्होंने यहाँ तक कहा कि परमप्रधान का अस्तित्व ही नहीं है, और उन्होंने उसके मार्गों को नहीं जाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: circumventiones delictorum
  choice: पाप के छलपूर्ण उपाय
  rationale: ‘circumventiones’ में चाल, छल या फँसाने वाली युक्तियों का भाव है; ‘delictorum’ को सामान्य और स्पष्ट रूप में ‘पाप’ कहा गया है।
- source_word: superdixerunt
  choice: उन्होंने तो यहाँ तक कहा
  rationale: यह साधारण ‘कहा’ से अधिक, पिछली अवज्ञा पर एक और गंभीर कथन जोड़ने का भाव व्यक्त करता है।
- source_word: Altissimum
  choice: परमप्रधान
  rationale: लैटिन उपाधि का प्रतिष्ठित और अर्थ-सटीक हिन्दी रूप।
- source_word: vias eius
  choice: उसके मार्गों
  rationale: ‘मार्ग’ परमेश्वर की इच्छा, आचरण और जीवन-पद्धति की रूपकात्मक व्यापकता बनाए रखता है।
theological_decisions:
- issue: परमप्रधान के विषय में कथन का स्वरूप
  choice: कि परमप्रधान का अस्तित्व ही नहीं है
  alternative: कि परमप्रधान नहीं है
  rationale: लैटिन ‘non esse’ अस्तित्व का निषेध करता है; ‘अस्तित्व ही नहीं है’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है, बिना अतिरिक्त धर्मवैचारिक व्याख्या जोड़े।
- issue: ‘मार्गों को न जानने’ की संभावित नैतिक या बौद्धिक अस्पष्टता
  choice: उन्होंने उसके मार्गों को नहीं जाना
  alternative: उन्होंने उसके मार्गों को नहीं पहचाना
  rationale: स्रोत का सीधा अर्थ रखा गया है और यह तय नहीं किया गया कि अज्ञान केवल बौद्धिक था या जानबूझकर नैतिक अस्वीकृति।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। स्रोत की समानांतर वाक्य-रचना और आरोपों की बढ़ती तीव्रता को बनाए रखा गया है।
