  yaml_path: translation/extra_canonical/2_esdras/007/010.yaml
  text: And I said[a], “So it is, Lord.” And he said to me, “So also is Israel’s portion.”
translation:
  language: hi
  text: और मैंने कहा, “ऐसा ही है, प्रभु।” तब उसने मुझसे कहा, “इस्राएल का भाग भी ऐसा ही है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sic
  choice: ऐसा ही है / ऐसा ही
  rationale: पहले प्रयोग में स्वतंत्र पुष्टि के रूप में ‘ऐसा ही है’ और दूसरे में इस्राएल के भाग की पूर्ववर्णित स्थिति से तुलना के लिए ‘ऐसा ही’ स्वाभाविक तथा स्रोत-संगत है।
- source_word: domine
  choice: प्रभु
  rationale: सीधे संबोधन में Latin vocative का dignified और प्रचलित हिन्दी समतुल्य।
- source_word: Israhel pars
  choice: इस्राएल का भाग
  rationale: Latin संबंध को औपचारिक रूप से सुरक्षित रखता है; ‘भाग’ यहाँ हिस्से, नियत दशा या प्राप्त अंश की संभावित अर्थ-व्याप्ति को खुला रखता है।
theological_decisions:
- issue: ‘इस्राएल का भाग’ का आशय
  choice: अर्थ को ‘भाग’ के रूप में खुला रखा
  alternative: इस्राएल की नियति / इस्राएल को मिलने वाला हिस्सा
  rationale: pars स्वयं संक्षिप्त और संदर्भ-निर्भर है; अधिक स्पष्ट विकल्प व्याख्या को मूल पाठ में जोड़ देते।
- issue: domine में संबोधित व्यक्ति की पहचान
  choice: ‘प्रभु’
  alternative: ‘स्वामी’
  rationale: दूत अथवा दिव्य वक्ता की सटीक पहचान इस पद में स्पष्ट नहीं की गई; ‘प्रभु’ सम्मानसूचक संबोधन को बनाए रखता है, बिना अतिरिक्त पहचान जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण प्रत्यक्ष संवाद। Latin की पुनरावृत्ति और दूसरे वाक्य की तुलनात्मक संरचना सुरक्षित रखी गई है।
