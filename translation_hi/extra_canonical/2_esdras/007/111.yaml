id: 2ES.7.111
reference: 2 Esdras 7:111
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si ergo modo, quando corruptibile increvit et iniustitia multiplicata est, exoraverunt iusti pro impiis quare et tunc sic non erit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/111.yaml
  text: If then now[a], when corruption has increased and unrighteousness has multiplied, the righteous prayed for the ungodly, why will it not also be so then?”
translation:
  language: hi
  text: यदि अब, जब भ्रष्टता बढ़ गई है और अधर्म बहुत बढ़ गया है, धर्मियों ने अभक्तों के लिए प्रार्थना की, तो उस समय भी ऐसा क्यों नहीं होगा?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो उस समय ऐसा क्यों नहीं होगा?”
    reason: लैटिन et को यहाँ योगात्मक ‘भी’ के बजाय सामान्य संयोजक के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: corruptibile
  choice: भ्रष्टता
  rationale: लैटिन का नपुंसकलिंगी विशेषण यहाँ संज्ञा के रूप में वर्तमान नाशवान/भ्रष्ट दशा को सूचित करता है; प्रसंग में स्वाभाविक हिन्दी के लिए ‘भ्रष्टता’ चुना गया।
- source_word: iniustitia
  choice: अधर्म
  rationale: यह अन्यायपूर्ण और धार्मिकता-विरोधी आचरण दोनों को समेटता है तथा सामान्य धार्मिक हिन्दी में स्पष्ट है।
- source_word: exoraverunt
  choice: प्रार्थना की
  rationale: यहाँ क्रिया impiis के लिए निवेदन या विनती करने का भाव देती है; ‘के लिए प्रार्थना की’ सहज रूप से मध्यस्थ प्रार्थना व्यक्त करता है।
- source_word: impiis
  choice: भक्तिहीनों
  rationale: शब्द उन लोगों को दर्शाता है जो परमेश्वर के प्रति श्रद्धाहीन हैं; ‘भक्तिहीन’ इस धार्मिक अर्थ को केवल सामान्य नैतिक बुराई तक सीमित नहीं करता।
- source_word: et tunc
  choice: उस समय भी
  rationale: et का योगात्मक बल वर्तमान और भावी समय की तुलना पर है; ‘भी’ उसी बल को सुरक्षित रखता है।
theological_decisions:
- issue: क्या धर्मियों की प्रार्थना का उल्लेख वर्तमान मध्यस्थता को भावी न्याय की अवस्था पर लागू करता है?
  choice: पाठ के प्रश्नात्मक तर्क को बिना निष्कर्ष जोड़े ज्यों का त्यों रखा गया।
  alternative: इसे भावी मध्यस्थता की स्पष्ट पुष्टि या निषेध के रूप में प्रस्तुत करना।
  rationale: लैटिन वाक्य स्वयं प्रश्न उठाता है; वह इस पद में उसका धर्मशास्त्रीय समाधान नहीं देता।
- issue: et का अर्थ
  choice: योगात्मक अर्थ ‘भी’ मुख्य पाठ में रखा गया।
  alternative: इसे केवल संयोजक मानकर ‘तो उस समय ऐसा क्यों नहीं होगा?’ कहना।
  rationale: वर्तमान और उस समय के बीच स्पष्ट तुलना के कारण योगात्मक अर्थ अधिक संभावित है, पर वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘तो’ से लंबे शर्तवाचक वाक्य की संरचना स्पष्ट होती है, और प्रश्नात्मक धर्मशास्त्रीय तनाव सुरक्षित रहता है।
