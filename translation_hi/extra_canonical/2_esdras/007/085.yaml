  text: 'The fifth way: they see the dwelling place of the others guarded by angels[a]'
translation:
  language: hi
  text: 'पाँचवाँ मार्ग यह है: वे दूसरों के निवास-स्थान को स्वर्गदूतों द्वारा सुरक्षित रखा हुआ देखते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinta uia
  choice: पाँचवाँ मार्ग यह है
  rationale: क्रमसूचक संरचना को स्वाभाविक आधुनिक हिन्दी में रखा गया है; ‘मार्ग’ पूर्ववर्ती और अनुवर्ती अवस्थाओं की शृंखला का संकेत बनाए रखता है।
- source_word: aliorum
  choice: दूसरों के
  rationale: लैटिन में केवल ‘अन्यों/दूसरों’ का उल्लेख है; उनकी पहचान को पाठ से अधिक स्पष्ट नहीं किया गया।
- source_word: habitaculum
  choice: निवास-स्थान
  rationale: एकवचन habitaculum को एकवचन में रखा गया है और उसके सामूहिक आशय को अनावश्यक रूप से बहुवचन नहीं बनाया गया।
- source_word: ab angelis conseruari
  choice: स्वर्गदूतों द्वारा सुरक्षित रखा हुआ
  rationale: लैटिन कर्मवाच्य वर्तमान infinitive का भाव व्यक्त करता है कि निवास-स्थान स्वर्गदूतों की निगरानी/रक्षा में कायम और सुरक्षित है।
theological_decisions:
- issue: ‘दूसरों’ की पहचान
  choice: दूसरों के
  alternative: धर्मियों के
  rationale: इस अंश में aliorum उनकी धार्मिक पहचान स्पष्ट नहीं करता; व्यापक संदर्भ से संभावित पहचान को मुख्य पाठ में आयात नहीं किया गया।
- issue: स्वर्गदूतों की भूमिका
  choice: सुरक्षित रखा हुआ
  alternative: पहरा दिया जाता हुआ
  rationale: conseruari का अर्थ केवल पहरा देना नहीं, बल्कि रक्षा करके सुरक्षित रखना भी है; चुना गया रूप इस व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली। स्रोत के एकवचन ‘habitaculum’ को सुरक्षित रखा गया है; इसलिए अंग्रेज़ी परामर्श-पाठ की बहुवचन-वैकल्पिक पादटिप्पणी हिन्दी मसौदे में नहीं अपनाई गई।
