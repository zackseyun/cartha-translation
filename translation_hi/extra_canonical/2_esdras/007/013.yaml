base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/013.yaml
  text: For the entrances of the greater age are broad and secure[a], and they produce the fruit of immortality.
translation:
  language: hi
  text: क्योंकि महानतर युग के प्रवेश-मार्ग चौड़े और सुरक्षित हैं[a], और वे अमरता का फल देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु महानतर युग के प्रवेश-मार्ग चौड़े और सुरक्षित हैं।”
    reason: पूर्ववर्ती वैकल्पिक अनुवाद में nam को विरोधसूचक ‘परन्तु’ के रूप में लिया गया था।
lexical_decisions:
- source_word: nam
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; इसलिए कारणसूचक हिन्दी स्वाभाविक और सटीक है।
- source_word: maioris saeculi
  choice: महानतर युग के
  rationale: प्रस्तुत लैटिन पाठ के तुलनात्मक maioris को बनाए रखते हुए saeculum को इस अपोकैलिप्टिक संदर्भ में ‘युग’ कहा गया है।
- source_word: introitus
  choice: प्रवेश-मार्ग
  rationale: बहुवचन introitus केवल प्रवेश की क्रिया नहीं, भीतर जाने के मार्गों या द्वारों का बोध कराता है; ‘प्रवेश-मार्ग’ प्रसंग में स्पष्ट है।
- source_word: spatiosi et securi
  choice: चौड़े और सुरक्षित
  rationale: दोनों विशेषणों का सीधा और सहज हिन्दी रूप, प्रवेश-मार्गों की विशालता और निरापदता दोनों को बनाए रखता है।
- source_word: facientes inmortalitatis fructum
  choice: अमरता का फल उत्पन्न करते हैं
  rationale: facientes की सक्रिय अर्थवत्ता को ‘उत्पन्न करते हैं’ से और inmortalitatis fructum को स्वाभाविक रूप से ‘अमरता का फल’ से व्यक्त किया गया है।
theological_decisions:
- issue: maioris saeculi का युग-संबंधी अर्थ
  choice: महानतर युग
  alternative: आनेवाला युग
  rationale: अन्य प्राचीन भाषाई साक्ष्यों के आधार पर ‘आनेवाला युग’ का पाठ प्रस्तावित किया गया है, पर दिए गए मूल लैटिन पाठ में maioris स्पष्टतः ‘महानतर’ है। अतः मुख्य पाठ लैटिन साक्ष्य का अनुसरण करता है और अपोकैलिप्टिक ‘युग’ की संकल्पना को बिना विस्तार दिए सुरक्षित रखता है।
- issue: nam का संबंधसूचक बल
  choice: क्योंकि
  alternative: परन्तु
  rationale: लैटिन nam सामान्यतः कारण या स्पष्टीकरण देता है, विरोध नहीं। फिर भी पूर्ववर्ती अनुवाद की जानकारी को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘महानतर युग’ कुछ असामान्य होते हुए भी लैटिन के तुलनात्मक रूप को सुरक्षित रखता है; ‘प्रवेश-मार्ग’ बहुवचन और स्थानगत बिंब दोनों स्पष्ट करता है।
