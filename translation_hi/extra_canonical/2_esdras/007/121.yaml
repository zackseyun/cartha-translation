  text: Et quoniam reposita sunt habitacula sanitatis et securitatis, nos vero male conversati sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/121.yaml
  text: And if dwellings of health and safety have been laid up, but we have conducted ourselves wickedly?
translation:
  language: hi
  text: और जब स्वास्थ्य और सुरक्षा के निवास-स्थान रख छोड़े गए हैं, तो हमने फिर भी बुरा आचरण क्यों किया है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reposita sunt
  choice: रख छोड़े गए हैं
  rationale: यह पूर्ण निष्क्रिय क्रिया भावी उपयोग के लिए सुरक्षित रखे जाने का अर्थ देती है; हिंदी में यह स्वाभाविक रूप से उसी भाव को व्यक्त करती है।
- source_word: habitacula
  choice: निवास-स्थान
  rationale: यह बहुवचन संज्ञा रहने के स्थानों को सूचित करती है; ‘निवास-स्थान’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: sanitatis et securitatis
  choice: स्वास्थ्य और सुरक्षा
  rationale: दोनों संबंधवाचक संज्ञाओं को सीधे और अलग-अलग रखा गया है, ताकि मूल का समांतर भाव बना रहे।
- source_word: male conversati sumus
  choice: हमने बुरा आचरण किया है
  rationale: conversari यहाँ जीवन-व्यवहार या चालचलन को सूचित करता है; ‘बुरा आचरण’ केवल ‘बुरे ढंग से जीने’ की अपेक्षा नैतिक व्यवहार का भाव अधिक स्पष्टता से रखता है।
theological_decisions:
- issue: प्रश्न का तर्क-संबंध
  choice: ‘और जब ... तब भी ... क्यों’
  alternative: ‘और यदि ... तो’
  rationale: Latin quoniam सामान्यतः स्थापित कारण या तथ्य (‘क्योंकि/जब’) बताता है, न कि अनिश्चित शर्त। संदर्भानुकूल प्रश्नात्मक हिंदी में ‘जब ... तब भी ... क्यों’ उस तनाव को स्वाभाविक रूप से व्यक्त करता है।
- issue: निवास-स्थानों के लाभार्थी
  choice: ‘हमारे लिए’ को स्पष्ट किया गया
  alternative: लाभार्थी को अनकहा छोड़ना
  rationale: reposita sunt में किसके लिए रखे गए हैं यह व्याकरणतः अनकहा है, पर वक्ता के ‘हम’ और प्रश्न के तर्क से लाभार्थी निहित है। हिंदी में इसे स्पष्ट करने से वाक्य सहज बनता है, बिना किसी सांप्रदायिक व्याख्या को जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी; प्रश्नात्मक, आत्मदोष स्वीकार करने वाला और गरिमापूर्ण स्वर। ‘निवास-स्थान’ मूल के बहुवचन को बनाए रखता है और ‘स्वास्थ्य और सुरक्षा’ को अमूर्त गुणों के रूप में सुरक्षित रखता है।
