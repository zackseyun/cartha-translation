  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam haec est via, quam Moyses dixit cum viveret ad populum dicens: elige tibi vitam ut vivas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/129.yaml
  text: For this is the way that Moses spoke of to the people while he lived, saying, ‘Choose life for yourself, that you may live.’
translation:
  language: hi
  text: क्योंकि यही वह मार्ग है जिसके विषय में मूसा ने अपने जीवनकाल में लोगों से कहा था, “अपने लिए जीवन को चुनो, ताकि तुम जीवित रहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: via
  choice: मार्ग
  rationale: ‘मार्ग’ मूल के प्रत्यक्ष अर्थ को बनाए रखता है और नैतिक/जीवन-पथ के भाव के लिए स्वाभाविक तथा गरिमापूर्ण है।
- source_word: cum viveret
  choice: अपने जीवनकाल में
  rationale: यह लैटिन के कालगत अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसमें अतिरिक्त धर्मवैचारिक अर्थ जोड़े।
- source_word: elige tibi vitam
  choice: अपने लिए जीवन को चुनो
  rationale: ‘tibi’ के आत्मसंबंधी बल और ‘vitam’ के स्पष्ट कर्मभाव—दोनों को सुरक्षित रखा गया है।
- source_word: ut vivas
  choice: ताकि तुम जीवित रहो
  rationale: उद्देश्य सूचक ‘ut’ और ‘vivas’ के जीवन-संबंधी शब्द-प्रतिध्वनि को यथासंभव बनाए रखता है।
theological_decisions:
- issue: ‘मार्ग’ और ‘जीवन चुनने’ के बीच संबंध
  choice: मूल कथन की संरचना और तनाव को यथावत रखा गया
  alternative: ‘यही जीवन का मार्ग है’ कहकर दोनों को स्पष्ट रूप से एक कर देना
  rationale: लैटिन में ‘haec est via’ के बाद मूसा की उक्ति आती है, पर वह सीधे ‘जीवन का मार्ग’ नहीं कहता; इसलिए निहित संबंध को व्याख्या द्वारा अधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूसा के वचन की पुनरुक्ति—‘जीवन’/‘जीवित’—जानबूझकर सुरक्षित रखी गई है।
