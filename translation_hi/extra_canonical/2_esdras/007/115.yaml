id: 2ES.7.115
reference: 2 Esdras 7:115
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tunc ergo nemo poterit misereri eius qui in iudicio victus fuerit, neque demergere eum qui vicerit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/115.yaml
  text: Therefore no one will then be able to have mercy on one who has been defeated in the judgment[a], nor to cast down one who has prevailed.
translation:
  language: hi
  text: इसलिए उस समय कोई भी उस व्यक्ति पर दया नहीं कर सकेगा जो न्याय में हार गया हो,[a] और न उस व्यक्ति को नीचे गिरा सकेगा जो जीत गया हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय में पराजित हो गया हो’।
    reason: victus का अर्थ ‘हारा हुआ’ या ‘पराजित’ है; वैधानिक संदर्भ में इससे मुकदमा हारने का भाव भी निकलता है।
lexical_decisions:
- source_word: Tunc ergo
  choice: इसलिए उस समय
  rationale: निष्कर्षसूचक ergo और कालसूचक tunc दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: misereri eius
  choice: उस व्यक्ति पर दया करना
  rationale: लैटिन misereri का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: in iudicio victus fuerit
  choice: न्याय में हार गया हो
  rationale: victus को दंडित या दोषी ठहराया गया कहने के बजाय मुकदमे/न्याय के प्रसंग में हारने के अर्थ में रखा गया है, जिससे स्रोत की वैधानिक तथा विजय-पराजय संबंधी शब्दावली बनी रहती है।
- source_word: demergere
  choice: नीचे गिराना
  rationale: मूल क्रिया में नीचे धकेलने या गिराने का भाव है; इसे किसी अधिक विशिष्ट दंड-संबंधी अर्थ में सीमित नहीं किया गया।
- source_word: qui vicerit
  choice: जो जीत गया हो
  rationale: न्यायिक संदर्भ में इसका आशय पक्ष में निर्णय पाकर विजयी होने से है; सरल हिन्दी में ‘जीत गया’ victus/vicerit के शब्दगत विरोध को भी बनाए रखता है।
theological_decisions:
- issue: अंतिम न्याय में दया और न्याय-निर्णय की अपरिवर्तनीयता
  choice: पद के स्पष्ट कथन को बिना नरम किए रखा गया कि उस समय हारे हुए पर कोई दया नहीं कर सकेगा और जीते हुए को कोई गिरा नहीं सकेगा।
  alternative: ‘दोषी ठहराए गए’ और ‘निर्दोष ठहराए गए’ जैसे स्पष्ट व्याख्यात्मक शब्द
  rationale: ऐसे शब्द न्यायिक आशय को स्पष्ट करते, पर victus/vicerit की विजय-पराजय वाली वास्तविक रूपकात्मकता और संभावित अर्थ-विस्तार को संकरा कर देते।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत के निकट शैली। ‘न्याय में हार गया’ तथा ‘जीत गया’ के समानांतर प्रयोग से लैटिन victus/vicerit का विरोध सुरक्षित है।
