  text: and Joshua after him for Israel in the days of Achar[a], and Samuel in the days of Saul,
translation:
  language: hi
  text: और उसके बाद आखार के दिनों में इस्राएल के लिए यहोशू[a], और शाऊल के दिनों में शमूएल,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में यहाँ Iesus है, वही रूप जो यहोशू और यीशु—दोनों नामों के लिए प्रयुक्त होता है। पुराने नियम के इस प्रसंग में नून के पुत्र यहोशू का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Iesus
  choice: यहोशू
  rationale: लैटिन रूप Iesus यहोशू और यीशु दोनों के लिए प्रयुक्त हो सकता है; पुराने नियम के इस प्रसंग में नून के पुत्र यहोशू अभिप्रेत हैं।
- source_word: Achar
  choice: आखार
  rationale: स्रोत-पाठ के Achar का निकट देवनागरी लिप्यंतरण रखा गया है; इसे परिचित नाम ‘आकान’ में बदलकर पाठांतर को चुपचाप नहीं सुलझाया गया।
- source_word: pro Israhel
  choice: इस्राएल के लिए
  rationale: लैटिन संबंध को सीधे और स्वाभाविक ढंग से व्यक्त करता है, बिना ‘प्रार्थना की’ जैसी क्रिया जोड़कर आशय सीमित किए।
theological_decisions:
- issue: Iesus की पहचान
  choice: यहोशू
  alternative: यीशु
  rationale: आखार/आकान से जुड़ा पुराने नियम का संदर्भ स्पष्ट रूप से नून के पुत्र यहोशू की ओर संकेत करता है।
- issue: Achar नाम का पाठ
  choice: आखार
  alternative: आकान
  rationale: उपलब्ध लैटिन स्रोत में Achar है; मुख्य पाठ में उसी रूप को सुरक्षित रखना स्रोत-साक्ष्य के प्रति अधिक निष्ठावान है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत की अपूर्ण वाक्य-संरचना के अनुरूप अनुवाद; यह पद आगे-पीछे की सूची का अंश है, इसलिए अंत में अल्पविराम रखा गया है।
