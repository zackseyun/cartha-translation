  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tinebit futuram saeculi iocunditatem facere, multis autem tormenta. Increuit enim in nos cor malum, quod nos abalienauit ab his, et deduxit nos in corruptionem, et in itinera mortis, ostendit nobis semitas perditionis et longe fecit nos a uita; et hoc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/048.yaml
  text: For an evil heart has grown in us[a], which has alienated us from these things and led us into corruption and into the ways of death, shown us the paths of perdition, and taken us far from life; and this not for a few, but for almost all who have been created.”
translation:
  language: hi
  text: “क्योंकि हमारे भीतर एक दुष्ट हृदय पनप उठा है, जिसने हमें इन बातों से[a] अलग कर दिया, हमें भ्रष्टता और मृत्यु के मार्गों पर ले गया, हमें विनाश की पगडंडियाँ दिखाईं, और हमें जीवन से बहुत दूर कर दिया। और ऐसा थोड़े-से लोगों के साथ नहीं, बल्कि लगभग उन सभी के साथ हुआ है जो सृजे गए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अन्य प्राचीन भाषाओं के पाठों में “उससे,” अर्थात परमेश्वर से। लातीनी पाठ में “इन बातों से” है।
    reason: लातीनी *ab his* और अन्य प्राचीन संस्करणों के ‘उससे’ के बीच महत्वपूर्ण पाठांतर को दर्ज करना।
lexical_decisions:
- source_word: cor malum
  choice: एक बुरा हृदय
  rationale: लातीनी पद का सीधा और स्वाभाविक रूप; ‘हृदय’ यहाँ मनुष्य की भीतरी नैतिक प्रवृत्ति को व्यक्त करता है, पर अनुवाद में इसकी व्याख्या जोड़कर अर्थ सीमित नहीं किया गया।
- source_word: Increuit enim in nos
  choice: क्योंकि हमारे भीतर ... बढ़ गया है
  rationale: in nos को स्वाभाविक हिन्दी में ‘हमारे भीतर’ और increuit को पूर्ण क्रिया ‘बढ़ गया है’ से व्यक्त किया गया है।
- source_word: abalienauit
  choice: अलग कर दिया
  rationale: दूर या पराया कर देने के भाव को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: corruptionem
  choice: भ्रष्टता
  rationale: नैतिक और नाशशील—दोनों संभावित आयामों को खुला रखने वाला व्यापक शब्द।
- source_word: itinera mortis
  choice: मृत्यु के मार्गों
  rationale: मूल के बहुवचन और मार्ग-रूपक को बनाए रखता है।
- source_word: semitas perditionis
  choice: विनाश की पगडंडियाँ
  rationale: semitas के अपेक्षाकृत संकरे रास्तों के बिंब को ‘पगडंडियाँ’ और perditionis को ‘विनाश’ से सुरक्षित रखा गया है।
- source_word: longe fecit nos a uita
  choice: जीवन से बहुत दूर कर दिया
  rationale: लातीनी वाक्य की दूरी और जीवन-विरोधी परिणाम, दोनों को सीधे व्यक्त करता है।
- source_word: fere omnibus qui creati sunt
  choice: सृजे गए लगभग सभी लोगों
  rationale: सृष्टि-संबंधी निष्क्रिय रूप और ‘लगभग सभी’ की सावधान सीमा को बनाए रखता है।
theological_decisions:
- issue: ab his का पाठ और उसका संदर्भ
  choice: मुख्य पाठ में ‘इन बातों से’
  alternative: ‘उससे’, अर्थात परमेश्वर से
  rationale: दिए गए लातीनी आधार-पाठ में स्पष्टतः ab his (‘इनसे/इन बातों से’) है। फिर भी सीरियाई, इथियोपिक, अरबी और आर्मेनियाई प्राचीन रूपों में ‘उससे’ मिलता है, जिसका संदर्भ परमेश्वर हो सकता है; इसलिए इस महत्वपूर्ण पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है, न कि चुपचाप निर्णीत किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। मूल के ‘हृदय’, ‘मार्ग’, ‘पगडंडियाँ’, ‘मृत्यु’, ‘विनाश’ और ‘जीवन’ वाले रूपकों को बनाए रखा गया है।
