base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/027.yaml
  text: And everyone who is delivered from the evils foretold will see my wonders[a].
translation:
  language: hi
  text: और जो कोई पहले बताई गई विपत्तियों से छुड़ाया जाएगा, वही मेरे अद्भुत कामों को देखेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: liberatus est
  choice: छुड़ाया जाएगा
  rationale: लातीनी पूर्ण निष्क्रिय रूप यहाँ भावी उद्धार के संदर्भ में है; हिन्दी में निष्क्रिय भविष्य इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: praedictis malis
  choice: पहले बताई गई विपत्तियों
  rationale: praedictis का अर्थ ‘पहले कही/बताई गई’ है और malis इस प्रलय-संबंधी संदर्भ में सामान्य नैतिक ‘बुराइयों’ से अधिक ‘विपत्तियों’ को सूचित करता है।
- source_word: ipse
  choice: वही
  rationale: सम्बन्धवाचक कर्ता के बाद आए बलसूचक पुनरुक्त सर्वनाम का जोर बनाए रखता है, पर हिन्दी में अस्वाभाविक वाक्य-विन्यास नहीं लाता।
- source_word: mirabilia mea
  choice: मेरे अद्भुत कामों
  rationale: mirabilia केवल विस्मयकारी वस्तुओं ही नहीं, परमेश्वर के किए हुए आश्चर्यजनक कार्यों को भी दर्शाता है; ‘अद्भुत काम’ आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: उद्धार और अद्भुत कामों को देखने के बीच सम्बन्ध
  choice: ‘वही’ के द्वारा ipse का बल सुरक्षित रखा गया
  alternative: बलसूचक शब्द हटाकर केवल ‘वह मेरे अद्भुत कामों को देखेगा’
  rationale: मूल पाठ विपत्तियों से छुड़ाए गए व्यक्ति को विशेष बल के साथ आगामी दर्शन का सहभागी बताता है; अनुवाद इस जोर को बनाए रखता है, बिना उसके धर्मवैज्ञानिक अर्थ को विस्तार देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल के बलसूचक ipse को ‘वही’ से व्यक्त किया गया है।
