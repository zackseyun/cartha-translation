base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/094.yaml
  text: 'The third order: seeing the testimony that he who formed them bore concerning them[a], that while they lived they kept the law that was entrusted to them.'
translation:
  language: hi
  text: 'तीसरा क्रम: वे उस गवाही को देखते हैं जो उन्हें रचनेवाले ने उनके विषय में[a] दी थी—कि अपने जीवनकाल में उन्होंने उस व्यवस्था का पालन किया था जो उन्हें सौंपी गई थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उन्हें रचनेवाले ने उन्हें दी थी।” लैटिन दातृकारक eis का अर्थ गवाही उनके विषय में दी गई थी या उन्हें दी गई थी—दोनों हो सकता है।
    reason: eis के दातृकारक प्रयोग में वास्तविक व्याकरणिक अस्पष्टता है।
lexical_decisions:
- source_word: Tertius ordo
  choice: तीसरा क्रम
  rationale: यह पद आत्माओं के अनुभवों की क्रमबद्ध सूची का तीसरा बिंदु है; ‘क्रम’ सूचीगत संरचना को स्पष्ट और संक्षिप्त रूप से बनाए रखता है।
- source_word: uidentes
  choice: वे ... देखते हैं
  rationale: लैटिन में कारणसूचक उपवाक्य के बजाय वर्तमान कृदंत है; इसलिए इसे ‘क्योंकि’ बनाकर संरचनात्मक बदलाव को मिटाया नहीं गया।
- source_word: testimonium quod testificatus est
  choice: वह गवाही ... दी थी
  rationale: एक ही धातु की लैटिन पुनरुक्ति का शाब्दिक अनुकरण हिन्दी में अस्वाभाविक होता; ‘गवाही दी’ अर्थ को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: qui plasmauit eas
  choice: उन्हें रचनेवाले
  rationale: plasmare में आकार देकर रचने का भाव है; ‘रचनेवाला’ सृष्टिकर्ता का संकेत रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: uiuentes
  choice: अपने जीवनकाल में
  rationale: शाब्दिक ‘जीते हुए’ की अपेक्षा यह हिन्दी में उसी कालगत अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: serua-
  choice: पालन किया था
  rationale: उपलब्ध लैटिन अंश शब्द के बीच में कटता है, पर परामर्श-पाठ और पद की पुनर्स्थापित निरंतरता इसे व्यवस्था के पालन के रूप में प्रस्तुत करती है।
theological_decisions:
- issue: eis का संबंध और गवाही की दिशा
  choice: उनके विषय में
  alternative: उन्हें
  rationale: लैटिन dative eis व्याकरणतः ‘उन्हें’ हो सकता है, पर संदर्भ में गवाही का विषय उन्हीं आत्माओं का पूर्व जीवन और उनका व्यवस्था-पालन है। मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है और वास्तविक व्याकरणिक संभावना पादटिप्पणी में सुरक्षित है।
- issue: व्यवस्था का सौंपा जाना
  choice: जो उन्हें सौंपी गई थी
  alternative: जो विश्वास में दी गई थी
  rationale: ‘सौंपी गई’ उत्तरदायित्व और संरक्षण हेतु दिए जाने का भाव व्यक्त करता है, बिना ‘विश्वास’ को ऐसी स्पष्ट धार्मिक संकल्पना बनाने के जिसका उपलब्ध लैटिन अंश में प्रत्यक्ष प्रमाण नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। सूची की संरचना बनाए रखने के लिए आरंभ में ‘तीसरा क्रम:’ रखा गया है और कृदंत uidentes को कारणसूचक वाक्य में नहीं बदला गया।
