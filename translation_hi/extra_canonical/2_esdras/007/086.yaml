  text: 'The sixth way: they see how some of them will pass over into torment[a].'
translation:
  language: hi
  text: 'छठा मार्ग: वे देखते हैं कि उनमें से कुछ किस प्रकार यातना में चले जाएँगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे स्वयं यातना में चले जाएँगे।’ लातीनी de eis का सामान्य अर्थ ‘उनमें से’ है; इसलिए मुख्य पाठ में अंशवाचक अर्थ लिया गया है।
    reason: de eis के दर्ज वैकल्पिक अर्थ को एंकर पर पारदर्शी रखते हुए मुख्य पाठ के स्रोत-आधारित अंशवाचक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: Sexta uia
  choice: छठा मार्ग यह है
  rationale: क्रमसूचक रूप और ‘मार्ग’ की मूल उपमा को रखते हुए हिन्दी में स्वाभाविक वाक्य बनाया गया है।
- source_word: uidentes
  choice: वे देखते हैं
  rationale: वर्तमान कृदंत को प्रसंगानुकूल मुख्य क्रिया के रूप में व्यक्त किया गया है।
- source_word: quemadmodum
  choice: किस प्रकार
  rationale: यह देखने की रीति या प्रक्रिया पर मूल पाठ के बल को सुरक्षित रखता है।
- source_word: de eis
  choice: उनमें से कुछ
  rationale: लातीनी पदबंध अंशवाचक है—‘उनमें से’ या ‘उनके बीच से’; हिन्दी में निहित कर्ता स्पष्ट करने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: pertransient in cruciamentum
  choice: यातना में चले जाएँगे
  rationale: भविष्यकालीन गति और एकवचन ‘यातना’ को सुरक्षित रखा गया है; ‘पार होकर जाना’ का अत्यधिक शाब्दिक रूप यहाँ हिन्दी में अस्पष्ट होता।
theological_decisions:
- issue: यातना में जाने वालों की पहचान
  choice: ‘उनमें से कुछ’—अंशवाचक अर्थ
  alternative: ‘वे स्वयं’
  rationale: de eis का सामान्य अर्थ अंशवाचक है; ‘वे स्वयं’ के लिए ipsi जैसे बलसूचक रूप की अपेक्षा होती। इसलिए किसी व्यापक धर्मवैचारिक निष्कर्ष के बिना केवल स्रोत का व्याकरण व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘यातना’ एकवचन में है, जैसा स्रोत में cruciamentum से संकेत मिलता है।
