source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod difficile est, gaudet super eum, qui uabet abundantiam ; Sic et a me repromissa creatura, iocundabor enim super paucis et qui saluabuntur, propterea quod ipsi sunt qui gloriam meam nunc dominatiorem fecerunt, et per quos nunc nomen meum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/060.yaml
  text: 'So also with the creation promised by me: I will rejoice over the few who will be saved[a], because they are the ones who have now made my glory more dominant, and through whom my name is now named.'
translation:
  language: hi
  text: 'वह सृष्टि जिसकी मैंने प्रतिज्ञा की है, उसके साथ भी ऐसा ही है: मैं उन थोड़े-से लोगों के कारण आनन्दित होऊँगा जो बचाए जाएँगे[a], क्योंकि वे ही हैं जिन्होंने अब मेरी महिमा को और अधिक प्रभुत्वशाली बनाया है और जिनके द्वारा अब मेरा नाम लिया जाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो बचाए जाते हैं।”
    reason: लातीनी saluabuntur भविष्यकालीन कर्मवाच्य है; मुख्य पाठ उसका काल और वाच्य बनाए रखता है। वैकल्पिक वर्तमान-सदृश पाठ भी कर्मवाच्य में दिया गया है।
lexical_decisions:
- source_word: repromissa creatura
  choice: मेरे द्वारा प्रतिज्ञा की गई सृष्टि
  rationale: लातीनी पदबंध का औपचारिक अर्थ सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है; repromissa में निहित प्रतिज्ञा का भाव स्पष्ट रखा गया है।
- source_word: iocundabor
  choice: मैं ... आनन्दित होऊँगा
  rationale: भविष्यकाल और हर्ष के अर्थ, दोनों को सुरक्षित रखता है।
- source_word: paucis ... qui saluabuntur
  choice: उन थोड़े-से लोगों ... जो बचाए जाएँगे
  rationale: saluabuntur के भविष्यकालीन कर्मवाच्य को यथावत रखा गया है; हिन्दी में paucis का मानवीय संदर्भ स्पष्ट किया गया है।
- source_word: gloriam meam ... dominatiorem fecerunt
  choice: मेरी महिमा को और अधिक प्रभावशाली बनाया है
  rationale: तुलनात्मक dominatiorem के ‘और अधिक’ भाव को बचाता है। ‘प्रभावशाली’ असामान्य शाब्दिक ‘अधिक प्रभुत्वशाली’ की अपेक्षा स्वाभाविक है, फिर भी प्रभुत्व/प्रभाव के आशय को अनावश्यक रूप से हल नहीं करता।
- source_word: nomen meum ... nominatur
  choice: मेरा नाम पुकारा जाता है
  rationale: नाम के उच्चारण अथवा आह्वान—दोनों संभावित धार्मिक अर्थों को खुला रखने वाला स्वाभाविक बाइबलीय हिन्दी प्रयोग है।
theological_decisions:
- issue: उद्धार का काल और वाच्य
  choice: जो बचाए जाएँगे
  alternative: जो बचाए गए हैं / जो बचते हैं
  rationale: लातीनी saluabuntur स्पष्टतः भविष्यकालीन कर्मवाच्य है; भावी उद्धार को वर्तमान दशा में नहीं बदला गया।
- issue: ‘नाम’ के प्रयोग का अर्थ
  choice: जिनके द्वारा अब मेरा नाम पुकारा जाता है
  alternative: जिनके द्वारा अब मेरा नाम प्रसिद्ध होता है
  rationale: nomen ... nominatur का आह्वान, उच्चारण या नामकरण-संबंधी तनाव सुरक्षित रखा गया है; ‘प्रसिद्ध’ कहने से अर्थ को केवल ख्याति तक सीमित कर दिया जाता।
- issue: महिमा को ‘अधिक प्रभावशाली’ बनाना
  choice: उन्होंने अब मेरी महिमा को और अधिक प्रभावशाली बनाया है
  alternative: उन्होंने अब मेरी महिमा को प्रबल किया है
  rationale: मूल के असामान्य तुलनात्मक dominatiorem को पूरी तरह समतल किए बिना समझने योग्य हिन्दी दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय पर सामान्य पाठक के लिए सुबोध। मूल की असामान्य अभिव्यक्ति ‘महिमा को और अधिक प्रभावशाली बनाया’ जानबूझकर कुछ हद तक सुरक्षित रखी गई है। उपलब्ध लातीनी अंश अंत में वाक्य को अपूर्ण छोड़ता है; प्रस्तुत पाठ परामर्श-परत में दिए गए पूर्ण वाक्य के अनुसार समाप्त होता है।
