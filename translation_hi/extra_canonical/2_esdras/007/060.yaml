  to: 'वह सृष्टि जिसकी मैंने प्रतिज्ञा की है, उसके साथ भी ऐसा ही है: मैं उन थोड़े-से लोगों के कारण आनन्दित होऊँगा जो बचाए जाएँगे[a], क्योंकि वे ही हैं जिन्होंने अब मेरी महिमा को और अधिक प्रभुत्वशाली बनाया है और जिनके द्वारा अब मेरा नाम लिया जाता है।'
