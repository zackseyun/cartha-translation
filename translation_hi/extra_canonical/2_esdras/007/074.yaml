  text: For how long has the Most High shown long-suffering to those who inhabit the age—not for their sake, but because of the times that he has foreseen! And I answered and said, “If I have found favor
translation:
  language: hi
  text: वे अंतिम समयों में कैसे उत्तर देंगे? क्योंकि परमप्रधान कितने लंबे समय से इस युग में रहनेवालों के प्रति धीरज धरता आया है—उनके कारण नहीं, बल्कि उन समयों के कारण जिन्हें उसने पहले से देख लिया है![a] और मैंने उत्तर देकर कहा, “यदि मुझे अनुग्रह मिला है
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पहले से देख लिया है” के स्थान पर “जिसका उसने पहले से प्रबंध किया है” या “जिन्हें उसने पहले से ठहराया है” भी संभव है; लातीनी शब्द दोनों अर्थ दे सकता है।
    reason: prouidit में ‘पूर्व से देखना’ और ‘पूर्व से प्रबंध/निर्धारण करना’ दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: modo respondebunt
  choice: तब वे ... कैसे उत्तर देंगे
  rationale: यह पद पिछले कथन से जुड़ा हुआ प्रतीत होता है; उपलब्ध पाठ का modo संभवतः quomodo (‘कैसे’) का बचा हुआ अंश है। ‘तब’ प्रसंगगत संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: in nouissimis temporibus
  choice: अंतिम समयों में
  rationale: बहुवचन temporibus और अंतकाल-संबंधी अर्थ, दोनों को बनाए रखा गया है।
- source_word: longanimitatem habuit
  choice: धीरज धरता आया है
  rationale: लंबे समय तक सहते रहने के भाव को वर्तमान, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: his qui inhabitant saeculum
  choice: इस युग में रहनेवालों के प्रति
  rationale: saeculum को यहाँ अंतकालीन संदर्भ में ‘युग’ माना गया है, न कि बिना संकेत के केवल ‘संसार’।
- source_word: ea quae prouidit tempora
  choice: उन समयों ... जिन्हें उसने पहले से देख रखा है
  rationale: prouidit के पूर्वदृष्टि वाले अर्थ को चुना गया है और tempora के बहुवचन को सुरक्षित रखा गया है।
- source_word: si inueni gratiam
  choice: यदि मुझे अनुग्रह मिला है
  rationale: लातीनी मुहावरे ‘अनुग्रह पाना’ का सहज आधुनिक हिन्दी रूप; स्रोत की अधूरी अगली बात को पूरा नहीं किया गया।
theological_decisions:
- issue: परमप्रधान के धीरज का आधार
  choice: ‘उनके कारण नहीं, बल्कि उन समयों के कारण’ को स्पष्ट विरोध के साथ रखा गया
  alternative: इसे लोगों को पश्चात्ताप का अवसर देने के रूप में समझाकर अनुवाद करना
  rationale: स्रोत धीरज को पूर्वनिर्धारित/पूर्वदेखे गए समयों से जोड़ता है; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: prouidit का अर्थ
  choice: ‘पहले से देख रखा है’
  alternative: ‘पहले से ठहराया/प्रबंध किया है’
  rationale: लातीनी शब्द दोनों अर्थ दे सकता है; मुख्य पाठ में पूर्वदृष्टि का अर्थ है और विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। स्रोत के प्रश्न, विस्मय, विरोध और अंत में अधूरे उद्धरण को बनाए रखा गया है।
