source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iocundentur. Multum enim melius est illis quam nobis, non enim sperant iudicium,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/066.yaml
  text: For it is much better for them than for us, for they do not expect judgment, nor do they know torments or the salvation promised after death.
translation:
  language: hi
  text: क्योंकि उनकी दशा हमारी दशा से कहीं अच्छी है; वे न तो न्याय की प्रतीक्षा करते हैं, न यातनाओं को जानते हैं, और न उस उद्धार को, जिसकी प्रतिज्ञा मृत्यु के बाद के लिए की गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Multum enim melius est illis quam nobis
  choice: क्योंकि उनकी दशा हमारी दशा से कहीं अच्छी है
  rationale: लैटिन के तुलनात्मक भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘उनके लिए...हमारे लिए’ की शाब्दिक रचना की अपेक्षा ‘उनकी दशा...हमारी दशा’ अधिक स्पष्ट है।
- source_word: sperant iudicium
  choice: न्याय की प्रतीक्षा करते हैं
  rationale: sperare यहाँ किसी अनुकूल परिणाम की ‘आशा’ रखने के बजाय आने वाले न्याय की अपेक्षा या प्रतीक्षा करने का भाव देता है।
- source_word: tormenta
  choice: यातनाओं
  rationale: बहुवचन और दंडजन्य पीड़ा का गंभीर भाव सुरक्षित रखा गया है।
- source_word: salutem post mortem repromissam
  choice: उस उद्धार को, जिसकी प्रतिज्ञा मृत्यु के बाद के लिए की गई है
  rationale: salus का धार्मिक अर्थ ‘उद्धार’ रखा गया है और प्रतिज्ञा का संबंध मृत्यु के बाद प्राप्त होने वाले उद्धार से स्पष्ट किया गया है।
theological_decisions:
- issue: न्याय, यातना और उद्धार के विषय में अज्ञान या अनुभव
  choice: ‘न तो ... प्रतीक्षा करते हैं, न ... जानते हैं’ के समानांतर वाक्य-विन्यास को बनाए रखा
  alternative: ‘उन्हें न न्याय का भय है, न यातना या उद्धार का ज्ञान’
  rationale: वैकल्पिक रूप ‘भय’ जोड़कर अर्थ की व्याख्या कर देता। प्रस्तुत रूप स्रोत के sperant और sciunt के भेद तथा उसके धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: मृत्यु के बाद की प्रतिज्ञा का संबंध
  choice: प्रतिज्ञा को उद्धार से जोड़ा गया
  alternative: मृत्यु के बाद की गई प्रतिज्ञा
  rationale: लैटिन वाक्यांश का आशय मृत्यु के बाद प्राप्त होने के लिए प्रतिज्ञात उद्धार है, न कि ऐसी प्रतिज्ञा जो मृत्यु के बाद की गई हो।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए स्पष्ट शैली। दिए गए स्रोतांश में आरम्भिक ‘iocundentur’ पिछले वाक्य का अंत प्रतीत होता है, इसलिए इसे इस पद के मुख्य पाठ में शामिल नहीं किया गया। उपलब्ध अंग्रेज़ी परामर्श-पाठ में सुरक्षित पूर्ण वाक्य के अनुरूप न्याय, यातनाओं और मृत्यु के बाद प्रतिज्ञात उद्धार की त्रिक संरचना रखी गई है।
