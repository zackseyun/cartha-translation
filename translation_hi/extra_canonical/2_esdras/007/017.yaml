  text: 'et respondi et dixi: dominator domine, ecce disposuisti in lege tua, quoniam iusti hereditabunt haec, impii autem peribunt.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/017.yaml
  text: Then I answered and said[a], “O sovereign Lord, behold, you have ordained in your law that the righteous will inherit these things[b], but the ungodly will perish.
translation:
  language: hi
  text: तब मैंने उत्तर देकर कहा, “हे सर्वाधिपति प्रभु, देखिए, आपने अपनी व्यवस्था में यह ठहराया है कि धर्मी ये सब विरासत में पाएँगे, पर अधर्मी नाश हो जाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: हे सर्वाधिपति प्रभु
  rationale: दोनों शब्द सम्बोधन में हैं और मिलकर परमेश्वर की प्रभुता व्यक्त करने वाली औपचारिक उपाधि बनाते हैं; यह अनुवाद हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: ecce
  choice: देखिए
  rationale: यह एज्रा के अगले कथन की ओर ध्यान खींचने वाला संवादात्मक संकेत है; इसे छोड़ने के बजाय स्वाभाविक हिन्दी में स्पष्ट रखा गया है।
- source_word: disposuisti in lege tua
  choice: आपने अपनी व्यवस्था में यह ठहराया है
  rationale: disposuisti यहाँ विधिपूर्वक निर्धारित या ठहराए जाने का भाव देता है; 'व्यवस्था' धार्मिक-कानूनी संदर्भ को बनाए रखती है।
- source_word: iusti hereditabunt haec
  choice: धर्मी ये सब विरासत में पाएँगे
  rationale: hereditabunt के विरासत पाने के अर्थ को सुरक्षित रखते हुए haec को संदर्भसूचक 'ये सब' से व्यक्त किया गया है, जो हिन्दी में 'इन वस्तुओं के वारिस होंगे' से अधिक स्वाभाविक है।
- source_word: impii autem peribunt
  choice: पर अधर्मी नाश हो जाएँगे
  rationale: autem का विरोध 'पर' से और impii का नैतिक-धार्मिक अर्थ 'अधर्मी' से व्यक्त किया गया है; peribunt के विनाश के भाव को बिना अतिरिक्त व्याख्या के रखा गया है।
theological_decisions:
- issue: धर्मियों की विरासत और अधर्मियों के नाश के बीच विरोध
  choice: वाक्य के स्पष्ट विरोध को ज्यों का त्यों रखा गया है
  alternative: नाश को किसी विशिष्ट प्रकार के दंड या अंतिम अवस्था के रूप में व्याख्यायित करना
  rationale: लातीनी पाठ केवल विरासत और नाश का विरोध प्रस्तुत करता है; वह यहाँ नाश की प्रकृति या अवधि स्पष्ट नहीं करता, इसलिए अनुवाद में कोई अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सर्वाधिपति प्रभु’ औपचारिक सम्बोधन की शक्ति बनाए रखता है, जबकि शेष वाक्य सहज आधुनिक हिन्दी में है।
