source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: hic sermo meus primus et novissimus, quoniam melius erat non dare terramAdam vel, cum iam dedisset, coercereeum ut non peccaret.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/116.yaml
  text: 'And I answered and said[a], “This is my first and last word: it would have been better not to give the earth to Adam, or else, when it had already been given, to restrain him so that he would not sin.”'
translation:
  language: hi
  text: 'और मैंने उत्तर देकर कहा, “यह मेरा पहला और आखिरी कथन है: बेहतर होता कि पृथ्वी आदम को उत्पन्न न करती, या उसके उत्पन्न हो जाने पर, उसे रोका जाता ताकि वह पाप न करे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dare
  choice: उत्पन्न करना
  rationale: यहाँ ‘terram’ को infinitive ‘dare’ का कर्ता और अविकारी नाम ‘Adam’ को उसका कर्म समझा गया है। 4 एज्रा की सृष्टि-संबंधी भाषा में धरती का आदम को ‘देना’ अर्थात उत्पन्न करना/उपजाना एक स्वाभाविक अर्थ है।
- source_word: coercere
  choice: रोकना
  rationale: शब्द का अर्थ काबू में रखना या रोक देना है; ‘रोकती’ सरल और प्रसंगानुकूल है तथा पाप को असंभव कर देने की सीमा से अधिक कुछ नहीं जोड़ता।
- source_word: sermo
  choice: कथन
  rationale: यहाँ इसका अर्थ भाषण या वार्ता नहीं, वक्ता की अंतिम कही हुई बात/दलील है; ‘कथन’ गरिमापूर्ण और स्पष्ट है।
theological_decisions:
- issue: क्या धरती ने आदम को उत्पन्न किया, या धरती आदम को दी गई?
  choice: मुख्य पाठ में धरती को आदम उत्पन्न करने वाली माना गया है।
  alternative: ‘आदम को पृथ्वी न दी जाती, या जब वह उसे दी जा चुकी थी...’
  rationale: ‘Adam’ अविकारी होने के कारण लैटिन व्याकरण दोनों पाठों की अनुमति देता है। फिर भी ‘cum iam dedisset ... eum’ में उसी निहित कर्ता के बने रहने और पुस्तक की सृष्टि-भाषा के आधार पर ‘पृथ्वी ने आदम को उत्पन्न किया’ अधिक संगत प्रतीत होता है। वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: आदम को पाप से रोकने वाला कौन है?
  choice: मुख्य वाक्य-रचना में ‘पृथ्वी’ को पिछले उपवाक्य का कर्ता बनाए रखा गया है।
  alternative: निहित कर्ता परमेश्वर हो सकता है, जिसने पृथ्वी आदम को दी और फिर उसे रोक सकता था।
  rationale: लैटिन में कर्ता स्पष्ट नहीं है; चुने हुए व्याकरणिक विश्लेषण के अनुरूप स्त्रीलिंग ‘रोकती’ रखा गया है, जबकि वैकल्पिक विश्लेषण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘उत्पन्न ही न करती’ और ‘कर ही दिया था’ से लैटिन की प्रतिकल्पित तथा पूर्ण हो चुकी क्रिया का बल व्यक्त होता है।
