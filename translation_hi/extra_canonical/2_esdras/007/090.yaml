  text: 'खतरा—कि वे व्यवस्था देनेवाले की व्यवस्था का पूरी तरह पालन करें। इसलिए उनके विषय में यह है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: periculum
  choice: खतरे को
  rationale: लैटिन पद खंडित पूर्ववर्ती वाक्य की कर्म-संरचना का भाग प्रतीत होता है; इसलिए ‘खतरे को’ रखा गया है और पाठ की विखंडित प्रकृति को सहज रूप से नहीं मिटाया गया।
- source_word: custodirent
  choice: पालन करें
  rationale: व्यवस्था के संदर्भ में ‘पालन करना’ आधुनिक हिन्दी में स्वाभाविक है और ‘सुरक्षित रखना/रक्षा करना’ की अपेक्षा अभिप्रेत आज्ञापालन को स्पष्ट करता है।
- source_word: perfecte
  choice: पूरी तरह
  rationale: ‘पूर्ण रूप से’ की अपेक्षा अधिक सहज आधुनिक हिन्दी, जबकि पूर्णता के बल को बनाए रखता है।
- source_word: legislatoris legem
  choice: व्यवस्था देनेवाले की व्यवस्था
  rationale: मूल की पुनरुक्ति और legislator के व्यक्तिगत संदर्भ को सुरक्षित रखा गया है; ‘विधाता’ अनचाहे दार्शनिक या दैवी अर्थ ला सकता था।
- source_word: Propter quod hic de his
  choice: इसलिए उनके विषय में यह है
  rationale: अपूर्ण/संक्रमणकारी लैटिन वाक्यांश के निकट रहते हुए उसकी अस्पष्टता को बनाए रखा गया है; ‘शिक्षा’ जैसा अस्रोत शब्द नहीं जोड़ा गया।
theological_decisions:
- issue: ‘व्यवस्था देनेवाला’ की पहचान
  choice: उपाधि को सामान्य रूप में रखा गया
  alternative: इसे स्पष्टतः ‘परमेश्वर’ कहना
  rationale: इस अंश में स्रोत केवल legislatoris कहता है; स्पष्ट पहचान जोड़ना मूल से आगे जाकर धर्मवैचारिक तनाव को सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। उपलब्ध लैटिन अंश दोनों सिरों पर संदर्भगत रूप से अपूर्ण है, इसलिए अनुवाद ने न तो आरंभिक कर्म-संबंध को स्वतंत्र वाक्य बनाया, न अंतिम ‘यह’ की विषयवस्तु अनुमान से जोड़ी।
