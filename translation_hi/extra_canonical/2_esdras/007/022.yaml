source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hii autem non sunt persuasi et contradixerunt ei. et constituerunt sibi cogitamenta vanitatis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/022.yaml
  text: But they were not persuaded and contradicted him[a], and they formed for themselves vain thoughts[b],
translation:
  language: hi
  text: परन्तु वे नहीं माने और उन्होंने उसका विरोध किया,[a] और अपने मन में व्यर्थ विचार गढ़ लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी बात का खंडन किया।”
    reason: लातीनी contradixerunt प्रतिवाद करने या विरोध करने—दोनों अर्थ दे सकता है।
  - marker: b
    text: अधिक शाब्दिक रूप में, “अपने लिए व्यर्थता के विचार बना लिए।”
    reason: लातीनी वाक्यांश constituerunt sibi cogitamenta vanitatis की संरचना और अर्थ-छाया को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: non sunt persuasi
  choice: वे नहीं माने
  rationale: लातीनी निष्क्रिय अभिव्यक्ति का स्वाभाविक हिन्दी रूप; प्रसंग में इसका अर्थ आज्ञा या समझाइश को स्वीकार न करना है।
- source_word: contradixerunt ei
  choice: उन्होंने उसका विरोध किया
  rationale: contradicere में कथन का प्रतिवाद और व्यक्ति के विरुद्ध खड़े होने—दोनों का भाव हो सकता है; इस प्रसंग में ‘विरोध किया’ अवज्ञापूर्ण प्रतिरोध की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: constituerunt sibi
  choice: अपने मन में … गढ़ लिए
  rationale: विचारों के साथ constituerunt का शब्दशः ‘स्थापित किया’ हिन्दी में अस्वाभाविक है; ‘गढ़ लिए’ जानबूझकर विचार बना लेने का भाव देता है, जबकि sibi को ‘अपने मन में’ से व्यक्त किया गया है।
- source_word: cogitamenta vanitatis
  choice: व्यर्थ विचार
  rationale: गुणवाचक संबंधकारक vanitatis को स्वाभाविक हिन्दी विशेषण ‘व्यर्थ’ से व्यक्त किया गया है; इससे खालीपन, निष्फलता या भ्रम का भाव बना रहता है।
theological_decisions:
- issue: ईश्वर के प्रति प्रतिक्रिया की तीव्रता
  choice: उसका विरोध किया
  alternative: उसकी बात का खंडन किया
  rationale: मुख्य पाठ में प्रसंगगत विद्रोह या प्रतिरोध का भाव रखा गया है, पर पाद-टिप्पणी में contradixerunt का अधिक शाब्दिक वाचिक अर्थ सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वे नहीं माने’ और ‘विरोध किया’ के बीच क्रम मूल के दो अलग कथनों को बनाए रखता है; ‘व्यर्थ विचार गढ़ लिए’ शाब्दिक अनुवाद की कृत्रिमता से बचते हुए मूल अर्थ देता है।
