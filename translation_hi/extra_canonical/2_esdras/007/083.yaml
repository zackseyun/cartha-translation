  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uersionem bonam facere ut uiuant. Tertia uia, uident repositam mercedem his qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/083.yaml
  text: 'The third way: they see the reward laid up for those who have trusted the covenants of the Most High.'
translation:
  language: hi
  text: 'तीसरा मार्ग यह है: वे उन लोगों के लिए रखा हुआ प्रतिफल देखते हैं जिन्होंने परमप्रधान की वाचाओं पर भरोसा किया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tertia uia
  choice: तीसरा मार्ग
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक रूप; यहाँ क्रमबद्ध ‘मार्गों’ का वर्णन है।
- source_word: uident
  choice: वे…देखते हैं
  rationale: मूल के वर्तमानकाल और प्रत्यक्ष अवलोकन के भाव को बनाए रखता है।
- source_word: repositam mercedem
  choice: रखा हुआ प्रतिफल
  rationale: repositam में भविष्य के लिए सुरक्षित रखे जाने का भाव है और mercedem के लिए ‘प्रतिफल’ प्रसंगानुकूल, गरिमापूर्ण शब्द है।
- source_word: testamentis Altissimi crediderunt
  choice: परमप्रधान की वाचाओं पर भरोसा किया है
  rationale: प्रदत्त लातीनी अंश के बाद की पाठ-साक्ष्यपरक निरंतरता को दर्शाता है; testamentis का बहुवचन ‘वाचाओं’ और crediderunt का संबंधपरक भाव ‘भरोसा किया’ से व्यक्त होता है।
theological_decisions:
- issue: testamentis का अर्थ
  choice: वाचाओं
  alternative: विधानों / प्रतिज्ञाओं
  rationale: ‘वाचा’ धार्मिक संदर्भ में testamentum के संबंधपरक और प्रतिज्ञाबद्ध अर्थ को सबसे अच्छी तरह सुरक्षित रखता है; बहुवचन को भी बनाए रखा गया है।
- issue: crediderunt का आशय
  choice: भरोसा किया है
  alternative: विश्वास किया है / आज्ञा मानी है
  rationale: ‘भरोसा’ विश्वास के भाव को व्यक्त करता है, पर उसे केवल बौद्धिक स्वीकृति या आज्ञापालन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत के निकट शैली। दिए गए साफ किए हुए लातीनी उद्धरण का अंत ‘his qui’ पर हो जाता है; वाक्य की शेष सामग्री अंग्रेज़ी POB में संरक्षित परामर्श-पाठ और इस पद की लातीनी पाठ-परंपरा के अनुसार प्रस्तुत की गई है।
