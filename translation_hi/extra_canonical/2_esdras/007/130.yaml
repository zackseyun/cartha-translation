  text: But they did not believe him, nor the prophets after him, nor even me, who spoke to them.
translation:
  language: hi
  text: पर उन्होंने उसकी बात पर विश्वास नहीं किया, न उसके बाद के भविष्यद्वक्ताओं की बात पर, न मुझ पर विश्वास किया—मैंने उनसे बात की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: crediderunt ... ei
  choice: उस पर विश्वास नहीं किया
  rationale: लातीनी वाक्यांश का स्वाभाविक हिन्दी रूप; व्यक्ति की बात पर भरोसा करने और उस पर विश्वास करने, दोनों अर्थों को खुला रखता है।
- source_word: post eum prophetis
  choice: उसके बाद आए भविष्यद्वक्ताओं पर
  rationale: post eum के कालक्रमिक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: mihi qui locutus sum ad eos
  choice: मुझ पर, जिसने उनसे बात की
  rationale: स्रोत के प्रथम-पुरुष वक्ता और संबंधवाचक उपवाक्य को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: ‘उस’ और ‘मुझ’ की पहचान
  choice: सर्वनामों को स्रोत की तरह अनिर्दिष्ट रखा गया
  alternative: संदर्भ के आधार पर व्यक्तियों के नाम जोड़ना
  rationale: इस पद में नाम नहीं दिए गए हैं; उन्हें जोड़ने से स्रोत की वास्तविक संदर्भ-निर्भरता और संभावित तनाव अनावश्यक रूप से सुलझ जाता।
