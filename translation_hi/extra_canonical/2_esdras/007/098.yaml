source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: incipient stellarum adsimilarí lumini, amodo non corrupti. Septimus ordo, qui est omnibus supradictis maior, quoniam exultabunt cum fiducia et quoniam confidebunt non confusi, et gaudebunt non reuerentes, festinant enim uidere uultum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/098.yaml
  text: 'The seventh order[a], which is greater than all the orders mentioned above: they will exult with confidence, and trust without being put to shame, and rejoice without fear, for they hasten to see the face of him whom they served while living, and from whom they, being glorified, are to receive their reward.'
translation:
  language: hi
  text: 'सातवीं अवस्था, जो ऊपर बताई गई सभी अवस्थाओं से महान है: वे पूरे भरोसे के साथ उल्लास करेंगे, विश्वास रखेंगे और लज्जित नहीं होंगे, तथा बिना भय के आनन्दित होंगे; क्योंकि वे उसका मुख देखने को आतुर हैं, जिसकी उन्होंने अपने जीवनकाल में सेवा की थी और जिससे वे महिमान्वित होकर अपना प्रतिफल प्राप्त करने वाले हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Septimus ordo
  choice: सातवीं अवस्था
  rationale: यहाँ ordo मृत्यु के बाद धर्मी आत्माओं के अनुभव की क्रमिक अवस्था या श्रेणी को दर्शाता है। सामान्य हिन्दी में ‘अवस्था’ प्रसंग को ‘क्रम’ की अपेक्षा अधिक स्पष्ट करती है।
- source_word: exultabunt cum fiducia
  choice: पूरे भरोसे के साथ आनन्द मनाएँगे
  rationale: fiducia के आश्वस्त भरोसे और exultabunt के उल्लास, दोनों को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: confidebunt non confusi
  choice: विश्वास रखेंगे और लज्जित नहीं होंगे
  rationale: यह अनुवाद confidebunt को भरोसा/विश्वास रखने और confusi को निराश होकर लज्जित किए जाने के भाव में प्रस्तुत करता है; इसे केवल ‘नहीं घबराएँगे’ बनाकर तनाव को सरल नहीं किया गया।
- source_word: gaudebunt non reuerentes
  choice: बिना भय के मगन होंगे
  rationale: इस प्रसंग में reverentes भय या संकोच का भाव रखता है; ‘बिना भय के’ अंग्रेज़ी परामर्श-पाठ और लैटिन अर्थ दोनों के अनुरूप है।
- source_word: festinant uidere uultum
  choice: उसका मुख देखने को आतुर हैं
  rationale: festinant का शाब्दिक ‘जल्दी करते हैं’ यहाँ तीव्र अभिलाषा व्यक्त करता है; ‘आतुर हैं’ आधुनिक हिन्दी में वही भाव स्वाभाविक रूप से देता है।
- source_word: gloriosi
  choice: महिमा पाकर
  rationale: यह कर्ता, अर्थात धर्मी जनों, की महिमामय दशा बताता है; इसे प्रतिफल का विशेषण नहीं बनाया गया।
- source_word: mercedem
  choice: प्रतिफल
  rationale: merces के पारिश्रमिक/इनाम के भाव के लिए धार्मिक साहित्य में परिचित और गरिमापूर्ण शब्द।
theological_decisions:
- issue: gloriosi का व्याकरणिक संबंध
  choice: ‘महिमा पाकर’ धर्मी जनों की अवस्था को बताता है
  alternative: ‘महिमामय प्रतिफल’
  rationale: लैटिन gloriosi कर्ता के साथ कर्तृवाचक बहुवचन में है, जबकि mercedem कर्मकारक एकवचन है; इसलिए महिमा धर्मी जनों की है, प्रतिफल की नहीं।
- issue: परमेश्वर के मुख का दर्शन
  choice: ‘उसका मुख देखने’ की प्रत्यक्ष भाषा बनाए रखी
  alternative: ‘उसकी उपस्थिति में आने’
  rationale: मूल का uultum ‘मुख’ है। इसके धर्मवैज्ञानिक अर्थ को व्याख्यात्मक रूप से बदलने के बजाय मूल बिंब सुरक्षित रखा गया।
- issue: सेवा और प्रतिफल का संबंध
  choice: ‘जिसकी...सेवा की थी और जिससे...प्रतिफल’
  alternative: सेवा को प्रतिफल कमाने का स्पष्ट कारण बताना
  rationale: मूल संबंध बताता है, पर प्रतिफल की धर्मवैज्ञानिक प्रणाली स्पष्ट नहीं करता; इसलिए कारणात्मक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘अवस्था’, ‘लज्जित’, ‘मुख’ और ‘प्रतिफल’ जैसे परिचित धार्मिक शब्दों का प्रयोग किया गया है। उपलब्ध लैटिन उद्धरण के आरम्भ का ‘incipient stellarum adsimilarí lumini, amodo non corrupti’ पिछली अवस्था/पिछले पद का अधूरा अंतिम अंश प्रतीत होता है, इसलिए 7:98 के मुख्य पाठ में शामिल नहीं किया गया। अंग्रेज़ी परामर्श-पाठ में सुरक्षित उत्तरार्ध को उसके स्रोत-समीक्षित व्याकरणिक निर्णय—विशेषतः gloriosi का धर्मी जनों से संबंध—के अनुसार प्रस्तुत किया गया है।
