  text: of the glory of the Most High[a], by which all will begin to see what has been set before them[b]. A period
translation:
  language: hi
  text: परमप्रधान की महिमा का, जिससे सभी अपने सामने रखी हुई बातों को देखना आरम्भ करेंगे। एक अवधि
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: claritatis
  choice: महिमा
  rationale: यहाँ संबंधकारक रूप में परमप्रधान की दीप्तिमान महिमा का अर्थ देता है; खंड पिछले वाक्यांश से जुड़ा हुआ है, इसलिए हिन्दी में भी ‘का’ बनाए रखा गया है।
- source_word: Altissimi
  choice: परमप्रधान
  rationale: लातीनी विशेषण का संज्ञात्मक, परमेश्वर-सूचक प्रयोग है; ‘परमप्रधान’ इसका प्रचलित और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: unde
  choice: जिससे
  rationale: यह पूर्ववर्ती ‘महिमा’ को उस माध्यम या आधार के रूप में जोड़ता है जिसके द्वारा सब देखने लगेंगे; ‘जहाँ से’ भी व्याकरणतः संभव है, पर संदर्भ में माध्यमसूचक अर्थ अधिक स्वाभाविक है।
- source_word: quae anteposita sunt
  choice: अपने सामने रखी हुई बातों को
  rationale: anteposita का मूल भाव ‘सामने रखी गई’ है। ‘बातों’ से नपुंसकलिंग बहुवचन quae को बिना अनावश्यक रूप से ‘वस्तुएँ’ या ‘कर्म’ निश्चित किए स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: Spatium
  choice: एक अवधि
  rationale: समय-संबंधी प्रसंग में spatium का अर्थ ‘अवधि’ है। स्रोत स्वयं इसी शब्द पर कटता है, इसलिए अनुवाद को भी आगे का वाक्य पूरा किए बिना छोड़ा गया है।
theological_decisions:
- issue: unde का संबंध और अर्थ
  choice: 'महिमा को देखने का माध्यम माना गया: ‘जिससे’'
  alternative: स्थानसूचक ‘जहाँ से’
  rationale: लातीनी unde दोनों अर्थ दे सकता है, पर ‘परमप्रधान की महिमा’ के बाद माध्यमसूचक संबंध अर्थ और हिन्दी प्रवाह—दोनों में बेहतर बैठता है; इससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
- issue: incipiant का भाव
  choice: भविष्यसूचक ‘देखना आरम्भ करेंगे’
  alternative: उद्देश्य/संभावना सूचक ‘देखना आरम्भ करें’
  rationale: इस कथात्मक, भविष्य-दर्शी संदर्भ में आश्रित उपवाक्य का स्वाभाविक हिन्दी रूप भविष्यकाल है, जबकि आरम्भ होने की प्रक्रिया का भाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। आरम्भ का ‘का’ और अंत का ‘एक अवधि’ जानबूझकर अपूर्ण रखे गए हैं, क्योंकि दिया गया लातीनी स्रोत स्वयं एक बड़े वाक्य के बीच से आरम्भ होकर अगले वाक्यांश के बीच में समाप्त होता है। उपलब्ध अंग्रेज़ी पादटिप्पणियाँ इस प्रदान किए गए लातीनी अंश के बजाय आस-पास के अनुपस्थित पाठ से संबंधित हैं, इसलिए भ्रामक पादटिप्पणी-चिह्न नहीं जोड़े गए।
