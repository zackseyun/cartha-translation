id: 2ES.7.117
reference: 2 Esdras 7:117
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim prodest omnibus in praesenti vivere in tristitia et mortuos sperare punitionem?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/117.yaml
  text: For what does it profit all to live in sorrow in the present and[a], when dead, to expect punishment?
translation:
  language: hi
  text: क्योंकि इससे सबको क्या लाभ है कि वे वर्तमान में[a] दुःख में जिएँ और मर जाने पर दण्ड की प्रतीक्षा करें?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वर्तमान युग में’।
    reason: ‘in praesenti’ वर्तमान समय के साथ-साथ वर्तमान युग या व्यवस्था का संकेत भी दे सकता है।
lexical_decisions:
- source_word: omnibus
  choice: सबको
  rationale: यह ‘prodest’ के साथ सम्प्रदान कारक है और बिना अनावश्यक विस्तार के ‘सभी को’ का भाव देता है।
- source_word: in praesenti
  choice: वर्तमान में
  rationale: यह केवल ‘अब’ नहीं, वर्तमान अवस्था या युग और आनेवाले न्याय के बीच निहित विरोध को भी बनाए रखता है।
- source_word: in tristitia
  choice: दुःख में
  rationale: लैटिन के शोक या दुःख की दशा में जीने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: mortuos
  choice: मर जाने पर
  rationale: शाब्दिक ‘मृत होकर’ की अपेक्षा स्वाभाविक हिन्दी है, जबकि मृत्यु के बाद की अवस्था का आशय सुरक्षित रहता है।
- source_word: sperare punitionem
  choice: दण्ड की प्रतीक्षा करें
  rationale: यहाँ ‘sperare’ वांछित आशा नहीं, भावी दण्ड की अपेक्षा या बाट जोहने के अर्थ में है।
theological_decisions:
- issue: ‘in praesenti’ का कालगत या युगगत अर्थ
  choice: मुख्य पाठ में ‘वर्तमान में’, और पादटिप्पणी में ‘वर्तमान युग में’
  alternative: ‘अब’
  rationale: ‘अब’ सरल है, पर इस प्रसंग में वर्तमान व्यवस्था और भावी न्याय के युगान्तकारी विरोध को कम कर सकता है।
- issue: मृत्यु और दण्ड के बीच संबंध
  choice: ‘मर जाने पर दण्ड की प्रतीक्षा करें’
  alternative: ‘मृत होकर दण्ड की प्रतीक्षा करें’
  rationale: मूल का आशय बनाए रखते हुए हिन्दी को स्वाभाविक रखा गया है; पाठ यह निर्धारित नहीं करता कि दण्ड मृत्यु के तुरन्त बाद आरम्भ होता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। प्रश्नात्मक वाक्य की निराशापूर्ण तीव्रता तथा वर्तमान दुःख और भावी दण्ड के बीच तनाव को बनाए रखा गया है।
