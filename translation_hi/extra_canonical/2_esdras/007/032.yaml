id: 2ES.7.32
reference: 2 Esdras 7:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et terra reddet qui in eam dormiunt, et pulvis qui in eo silentio habitant, et promptuaria reddent quae eis commendatae sunt animae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/032.yaml
  text: And the earth will give back those who sleep in it[a], and the dust those who dwell in it in silence, and the storehouses will give back the souls entrusted to them.
translation:
  language: hi
  text: और पृथ्वी उन लोगों को लौटा देगी जो उसमें सोए हुए हैं, और धूल उन लोगों को लौटा देगी जो उसमें मौन में रहते हैं; और भंडार उन आत्माओं को लौटा देंगे जिन्हें उनके सुपुर्द किया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terra reddet
  choice: पृथ्वी ... लौटा देगी
  rationale: ‘reddet’ के भविष्यकाल और किसी को वापस सौंपने/देने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: qui in eam dormiunt
  choice: उसमें सोए हुओं को
  rationale: मृतकों के लिए प्रयुक्त निद्रा-रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: pulvis
  choice: धूल
  rationale: लैटिन शब्द का सीधा और बाइबिलीय रूप से परिचित समतुल्य।
- source_word: qui in eo silentio habitant
  choice: उसमें मौन वास करने वालों को
  rationale: ‘habitant’ और ‘silentio’ दोनों को बनाए रखते हुए पिछले खंड की समानांतर रचना दर्शाता है।
- source_word: promptuaria
  choice: भंडार
  rationale: आत्माओं को सुरक्षित रखे जाने के स्थानों के लिए स्रोत के बहुवचन भंडार-चित्र को बनाए रखता है।
- source_word: commendatae sunt animae
  choice: उन्हें सौंपी गई आत्माओं को
  rationale: ‘commendatae’ में निहित सुपुर्दगी और सुरक्षित संरक्षण का भाव व्यक्त करता है; ‘eis’ का संदर्भ भंडारों से स्पष्ट करता है।
theological_decisions:
- issue: मृतकों का पुनरुत्थान और आत्माओं के भंडार
  choice: शरीरों से संबंधित पृथ्वी/धूल और सौंपी गई आत्माओं से संबंधित भंडार—दोनों चित्रों को ज्यों का त्यों रखा गया है।
  alternative: इसे किसी विशिष्ट मध्यावस्था, स्वर्ग, अधोलोक या पुनर्मिलन-सिद्धांत के अनुसार स्पष्ट करना।
  rationale: स्रोत स्वयं प्रतीकात्मक भंडार-भाषा का प्रयोग करता है और उसकी ठीक प्रकृति नहीं बताता; अनुवाद को इस धर्मवैज्ञानिक तनाव को खुला रखना चाहिए।
- issue: दो समानांतर संबंधवाचक खंडों का विभाजन
  choice: ‘पृथ्वी’ के साथ ‘सोए हुए’ और ‘धूल’ के साथ ‘मौन वास करने वाले’ जोड़े गए हैं।
  alternative: ‘सोए हुए’ और ‘मौन वास करने वाले’ को एक ही समूह का संयुक्त वर्णन मानना।
  rationale: प्राप्त लैटिन पाठ की व्याकरणिक समानांतरता यही विभाजन सुझाती है, यद्यपि अर्थगत निकटता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। ‘मौन वास’ कुछ काव्यात्मक है, पर मृत्यु की निस्तब्धता और लैटिन ‘silentio habitant’ की छवि दोनों सुरक्षित रखता है। मुख्य पाठ में कोई पाद-टिप्पणी चिह्न आवश्यक नहीं है, क्योंकि लैटिन की उपलब्ध रचना अंग्रेज़ी पाद-टिप्पणी वाले वैकल्पिक संयोजन का पर्याप्त आधार नहीं देती।
