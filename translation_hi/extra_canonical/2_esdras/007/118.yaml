source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: O tu quid fecisti, Adam? si enim tu peccasti, non est factum solius tuus casus sed etnostrum qui ex te advenimus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/118.yaml
  text: O Adam[a], what have you done? For if you sinned, your fall was not yours alone, but also ours, we who have come from you.
translation:
  language: hi
  text: हे आदम, तुमने यह क्या किया? क्योंकि यदि तुमने पाप किया, तो तुम्हारा पतन केवल तुम्हारा नहीं था, बल्कि हमारा भी था—हमारा, जो तुमसे उत्पन्न हुए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: O tu quid fecisti, Adam?
  choice: हे आदम, तुमने यह क्या किया?
  rationale: लातीनी संबोधन और विस्मयपूर्ण प्रश्न को स्वाभाविक, गरिमापूर्ण आधुनिक हिन्दी में रखा गया है; emphatic 'tu' को 'तुमने' से व्यक्त किया गया है।
- source_word: si enim tu peccasti
  choice: क्योंकि यदि तुमने पाप किया
  rationale: '''si'' का सीधा अर्थ ''यदि'' रखा गया है ताकि स्रोत की वास्तविक शर्तात्मक/संभावित रियायतपूर्ण अस्पष्टता बनी रहे; ''tu'' का बल ''तुमने'' में सुरक्षित है।'
- source_word: casus
  choice: पतन
  rationale: आदम के पाप और उसके परिणाम के धार्मिक-साहित्यिक संदर्भ में 'पतन' उपयुक्त है और केवल सामान्य दुर्घटना का अर्थ नहीं देता।
- source_word: qui ex te advenimus
  choice: हम, जो तुमसे उत्पन्न हुए हैं
  rationale: '''ex te'' को वंशगत उद्गम के रूप में स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है; ''advenimus'' की पूर्ण हुई स्थिति को ''उत्पन्न हुए हैं'' से दर्शाया गया है।'
theological_decisions:
- issue: '''si'' को शर्तात्मक या रियायतपूर्ण समझना'
  choice: यदि तुमने पाप किया
  alternative: यद्यपि तुमने ही पाप किया
  rationale: संदर्भ रियायतपूर्ण अर्थ की अनुमति देता है, पर लातीनी 'si' को सीधे 'यदि' कहना स्रोत के रूप और उसकी संभावित अर्थगत तन्यता को अधिक निकटता से सुरक्षित रखता है; पाठ आदम के पाप का निषेध नहीं कर रहा।
- issue: आदम के पतन में वंशजों की भागीदारी
  choice: तुम्हारा पतन केवल तुम्हारा ही नहीं हुआ, बल्कि हमारा भी
  alternative: तुम्हारे पाप का दोष हम पर भी आया
  rationale: स्रोत 'casus' और स्वामित्व की साझा भाषा बोलता है, पर दोष के आरोपण की कोई विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं देता; इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन गरिमापूर्ण किंतु सहज है। वाक्य की भावात्मक तीव्रता और आदम के एकल कर्म बनाम सामूहिक परिणाम का विरोध सुरक्षित रखा गया है।
