  yaml_path: translation/extra_canonical/2_esdras/007/041.yaml
  text: neither air nor darkness nor evening nor morning[a], neither summer nor spring nor heat nor winter, neither frost nor cold nor hail,
translation:
  language: hi
  text: न हवा, न अँधेरा, न साँझ, न सुबह[a]; न ग्रीष्म ऋतु, न वसंत, न ताप, न शीत ऋतु; न पाला, न ठंड, न ओले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले के पाठ में “हवा” नहीं था और “वर्षा” तथा “ओस” को इसी पद में रखा गया था। यहाँ उपलब्ध लातीनी स्रोत के पद-विभाजन का अनुसरण किया गया है; “वर्षा” और “ओस” अगले पद में आते हैं।
    reason: previous_rendering
lexical_decisions:
- source_word: aerem
  choice: हवा
  rationale: लातीनी ‘aer’ का सामान्य और सहज हिन्दी रूप; इस पद की सूची में इसे स्पष्ट रूप से बनाए रखा गया है।
- source_word: sero
  choice: साँझ
  rationale: समय-सूचक विरोधी युग्म ‘साँझ—सुबह’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: aestatem
  choice: ग्रीष्म ऋतु
  rationale: आगे आए ‘aestum’ अर्थात ‘ताप’ से भेद बनाए रखने के लिए ऋतु का स्पष्ट उल्लेख किया गया है।
- source_word: aestum
  choice: ताप
  rationale: यहाँ ऋतु नहीं, गरमी या तपन का बोध है; ‘ग्रीष्म ऋतु’ से आवश्यक भेद सुरक्षित रहता है।
- source_word: hiemem
  choice: शीत ऋतु
  rationale: ऋतु को दर्शाता है और आगे के ‘gelu’ तथा ‘frigus’ से अलग अर्थ बनाए रखता है।
- source_word: gelu
  choice: पाला
  rationale: जमाव अथवा तुषार की ठिठुरन का ठोस प्राकृतिक रूप, जिसे ‘ठंड’ से अलग रखा जा सकता है।
- source_word: frigus
  choice: ठंड
  rationale: सामान्य शीत या ठंडक का स्वाभाविक हिन्दी रूप।
- source_word: grandinem
  choice: ओले
  rationale: खंडित पंक्ति-अंत ‘grandi-’ का पूर्ण शब्द ‘grandinem’ है, जिसका अर्थ ओले है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बार-बार आए लातीनी ‘neque’ को प्रत्येक पद के पहले ‘न’ से व्यक्त किया गया है, और समानार्थी दिखने वाले ऋतु, ताप, पाला तथा ठंड के शब्दों का भेद सुरक्षित रखा गया है।
