  text: factus est de puluere, sicut et cetera creatura! Melius enim erat ipsum pulverem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/063.yaml
  text: For it would have been better if the dust itself had not come into being, so that understanding might not have come from it.
translation:
  language: hi
  text: क्योंकि यह अधिक अच्छा होता कि धूल स्वयं अस्तित्व में ही न आती, ताकि उससे समझ उत्पन्न न होती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pulvis / pulverem
  choice: धूल
  rationale: मनुष्य की भौतिक उत्पत्ति के संकेत को बनाए रखते हुए लैटिन शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: factus est / come into being
  choice: अस्तित्व में आती
  rationale: धूल के संदर्भ में ‘जन्म लेती’ की अपेक्षा सृष्टि या अस्तित्व में आने का भाव अधिक ठीक और स्वाभाविक है।
- source_word: intelligentia / understanding (consultation layer)
  choice: समझ
  rationale: साधारण आधुनिक पाठक के लिए स्पष्ट है और विचार-बोध की क्षमता का व्यापक अर्थ बनाए रखता है।
theological_decisions:
- issue: मनुष्य की सृष्टि और समझ के विषय में प्रतिकूल कामना
  choice: कथन की तीखी प्रतिकूल-कल्पना को बिना नरम किए रखा गया है
  alternative: इसे केवल दुःख या पश्चात्ताप की सामान्य अभिव्यक्ति बनाना
  rationale: पद का तनाव इसी दावे में है कि धूल का अस्तित्व में न आना और उससे समझ का उत्पन्न न होना अधिक अच्छा होता; इसे व्याख्यात्मक रूप से हल्का करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘ताकि’ मूल/परामर्श-पाठ में निहित परिणाम अथवा उद्देश्य की संभावित अस्पष्टता को पूरी तरह समाप्त किए बिना वाक्य को स्वाभाविक बनाता है।
