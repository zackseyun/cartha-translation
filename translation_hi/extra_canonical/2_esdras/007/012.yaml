  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। समानांतर विशेषणों और संकट-मार्ग के रूपक को बनाए रखा गया है; मुख्य पाठ में पादटिप्पणी चिह्न [a] उपस्थित है।
