base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/012.yaml
  text: And the entrances of this age became narrow and painful and laborious[a], few and evil, full of dangers and burdened with great hardships.
translation:
  language: hi
  text: और इस युग के प्रवेश-मार्ग सँकरे, पीड़ादायक[a] और दुष्कर हो गए, संख्या में कम और बुरे, खतरों से भरे हुए और बड़े कष्टों से लदे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दुःखपूर्ण।’
    reason: ‘dolentes’ में पीड़ा पहुँचाने वाले और दुःख से चिह्नित होने—दोनों अर्थ-छायाएँ संभव हैं; मुख्य पाठ प्रसंगानुकूल कारक अर्थ लेता है।
lexical_decisions:
- source_word: introitus huius saeculi
  choice: इस युग के प्रवेश-मार्ग
  rationale: ‘introitus’ को केवल ‘प्रवेश’ कहने के बजाय ‘प्रवेश-मार्ग’ से उस मार्ग-संबंधी रूपक को स्पष्ट और स्वाभाविक रखा गया है; ‘saeculum’ का प्रसंगानुकूल अर्थ ‘युग’ है।
- source_word: dolentes
  choice: पीड़ादायक
  rationale: निर्जीव प्रवेश-मार्गों के लिए यह रूप उन्हें स्वयं दुःखी बताने के बजाय पीड़ा पहुँचाने वाला बताता है, जो लैटिन विशेषण के यहाँ अभिप्रेत कारक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: laboriosi
  choice: दुष्कर
  rationale: यह उन मार्गों के श्रमसाध्य और कठिन होने का भाव संक्षेप में व्यक्त करता है तथा आगे के ‘बड़े-बड़े कष्टों’ से अनावश्यक शब्दगत पुनरावृत्ति घटाता है।
- source_word: paucae autem et malae
  choice: वे थोड़े और बुरे हैं
  rationale: लैटिन के असहज लिंग-परिवर्तन के पीछे निहित प्रवेश-मार्गों को ही संदर्भ मानते हुए ‘few and evil/bad’ दोनों गुणों को बिना नरम किए रखा गया है।
- source_word: periculorum plenae et laborum magnorum fultae
  choice: खतरों से भरे हुए और बड़े-बड़े कष्टों से लदे हुए
  rationale: ‘plenae’ को सीधे ‘भरे हुए’ और प्रसंग में ‘fultae’ को भार उठाने/लदे होने के अर्थ में प्रस्तुत किया गया है; इससे संकटपूर्ण मार्ग का चित्र बना रहता है।
theological_decisions: []
