  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कराए गए लातीनी स्रोत का अंश “तू सोना उत्पन्न करती है और…” पर अधूरा समाप्त होता है; शेष वस्तुओं की सूची परामर्श-पाठ के अनुसार दी गई है।
    reason: स्रोतांश की अपूर्णता को पारदर्शी रखना और अनुपलब्ध लातीनी पाठ का अनुमान लगाकर प्रस्तुत न करना।
