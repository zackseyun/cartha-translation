  text: but we will not enter[a], for we have lived in ungrateful places?
translation:
  language: hi
  text: पर क्या हम प्रवेश नहीं करेंगे, क्योंकि हम अप्रिय[a] स्थानों में रहे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘असुखद’ अथवा ‘मन को न भाने वाले’।
    reason: लैटिन ingratis के अर्थ-क्षेत्र को दिखाने के लिए; स्थानों के संदर्भ में इसका अर्थ ‘कृतघ्न’ नहीं, बल्कि अप्रिय या अस्वीकार्य होने की ओर है।
lexical_decisions:
- source_word: ingrediemur
  choice: हम प्रवेश करेंगे
  rationale: लैटिन का भविष्यत्काल क्रियापद है; कर्म या गंतव्य मूल पाठ में व्यक्त नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: ingratis
  choice: अप्रिय
  rationale: स्थानों के संदर्भ में ingratus का अर्थ ‘अप्रिय’, ‘असुखद’ या ‘मन को न भाने वाला’ है। ‘कृतघ्न’ इसका अधिक शाब्दिक किंतु यहाँ अस्वाभाविक अर्थ होगा।
- source_word: locis conversati sumus
  choice: "स्थान\uFEFFों में रहे हैं"
  rationale: यह वाक्यांश उन स्थानों में रहने या जीवन बिताने को व्यक्त करता है; सरल हिन्दी में ‘रहे हैं’ स्वाभाविक है।
theological_decisions:
- issue: नकारात्मक प्रश्न की व्याख्या
  choice: क्या हम प्रवेश नहीं करेंगे ...?
  alternative: क्या हम प्रवेश न करेंगे ...?
  rationale: मूल nos vero non ingrediemur प्रश्न के रूप में नकारात्मक भविष्यत्काल रखता है। हिन्दी में ‘क्या हम प्रवेश नहीं करेंगे’ उसकी प्रश्नात्मकता और अनिश्चित अपेक्षा को बनाए रखता है, बिना उत्तर या धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की प्रश्नात्मक संरचना तथा प्रवेश के अव्यक्त गंतव्य को सुरक्षित रखा गया है।
