  yaml_path: translation/extra_canonical/2_esdras/007/137.yaml
  text: For if he does not multiply them[a], the age will not be given life with those who dwell in it.
translation:
  language: hi
  text: क्योंकि यदि वह वृद्धि न करे, तो युग को उसमें रहने वालों समेत जीवन नहीं दिया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicaverit
  choice: उनकी संख्या न बढ़ाए
  rationale: लैटिन क्रिया का अर्थ ‘बहुगुणित करना/संख्या बढ़ाना’ है। आधुनिक हिन्दी में ‘उनकी संख्या बढ़ाना’ स्वाभाविक है; कर्म मूल वाक्य में निहित है, इसलिए अस्पष्टता को पादटिप्पणी में बताया गया है।
- source_word: vivificabitur
  choice: जीवन नहीं दिया जाएगा
  rationale: यह भविष्यकालीन कर्मवाच्य है। यह रूप लैटिन के कर्मवाच्य अर्थ को बनाए रखते हुए हिन्दी में ‘जीवित नहीं किया जाएगा’ से अधिक स्वाभाविक है।
- source_word: saeculum
  choice: युग
  rationale: यहाँ saeculum को भावी या वर्तमान काल-व्यवस्था के अर्थ में ‘युग’ कहना उपयुक्त है; ‘संसार’ कहने से मूल का कालगत अर्थ दब सकता है।
- source_word: cum his qui habitant in eo
  choice: उसमें रहने वालों समेत
  rationale: यह मूल के ‘उसमें निवास करने वालों के साथ’ का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: saeculum का आशय
  choice: युग
  alternative: संसार
  rationale: ‘युग’ मूल के कालगत और युगान्त-संबंधी तनाव को सुरक्षित रखता है, जबकि ‘संसार’ इसे केवल स्थानगत अर्थ दे सकता है।
- issue: भविष्यकालीन शर्त
  choice: यदि वह … न बढ़ाए, तो … जीवन नहीं दिया जाएगा
  alternative: यदि उसने … न बढ़ाया होता, तो … जीवन न दिया जाता
  rationale: Latin multiplicaverit और vivificabitur भविष्य से संबंधित वास्तविक/तार्किक शर्त व्यक्त करते हैं, न कि अतीत की अवास्तविक शर्त।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘युग को … जीवन नहीं दिया जाएगा’ में मूल का कर्मवाच्य तथा भविष्यकालीन तर्क सुरक्षित है।
