id: 2ES.7.35
reference: 2 Esdras 7:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et opus subsequetur et merces ostendetur. et iustitiae vigilabunt et iniustitiae non dormibunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/035.yaml
  text: And the deed will follow, and the reward will be shown, and acts of righteousness will keep watch, and acts of unrighteousness will not sleep.
translation:
  language: hi
  text: और कर्म पीछे-पीछे आएगा, और प्रतिफल प्रकट किया जाएगा। धार्मिकता के काम जागते रहेंगे, और अधर्म के काम सोए न रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus
  choice: कर्म
  rationale: एकवचन और न्याय-संदर्भ में किए हुए कार्य के अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: subsequetur
  choice: पीछे-पीछे आएगा
  rationale: भविष्यकाल और पीछे आने/अनुसरण करने की छवि को स्पष्ट रूप से व्यक्त करता है।
- source_word: merces
  choice: प्रतिफल
  rationale: न्याय में मिलने वाले फल या बदले को तटस्थ रखता है; इसे केवल पुरस्कार तक सीमित नहीं करता।
- source_word: ostendetur
  choice: प्रकट किया जाएगा
  rationale: लैटिन के भविष्यकालीन कर्मवाच्य को सुरक्षित रखता है।
- source_word: iustitiae
  choice: धार्मिकता के काम
  rationale: बहुवचन अमूर्त संज्ञा यहाँ धार्मिक आचरणों की ओर संकेत करती है; हिन्दी में अर्थ स्पष्ट करने के लिए 'के काम' जोड़ा गया है।
- source_word: vigilabunt
  choice: जागते रहेंगे
  rationale: जागने और चौकस रहने की रूपकात्मक छवि को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: iniustitiae
  choice: अधर्म के काम
  rationale: विपरीत समानांतरता को सुरक्षित रखते हुए अन्यायपूर्ण या अधार्मिक कर्मों का व्यापक अर्थ देता है।
- source_word: non dormibunt
  choice: सोए न रहेंगे
  rationale: मूल की निद्रा-विरोधी छवि और भविष्यकाल को अक्षुण्ण रखता है।
theological_decisions:
- issue: merces का मूल्यात्मक अर्थ
  choice: प्रतिफल
  alternative: पुरस्कार
  rationale: मूल शब्द संदर्भानुसार अनुकूल या प्रतिकूल बदले का संकेत दे सकता है; 'प्रतिफल' इस अस्पष्टता को बनाए रखता है।
- issue: iustitiae/iniustitiae को अमूर्त गुण या कर्म मानना
  choice: धार्मिकता के काम / अधर्म के काम
  alternative: धार्मिकताएँ / अधार्मिकताएँ
  rationale: इस बहुवचन प्रयोग में कार्यों का अर्थ अधिक स्वाभाविक है और अगले जागने/न सोने वाले मानवीकरण के साथ मेल खाता है, फिर भी न्याय-संबंधी रूपक सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और लयात्मक वाक्य-विन्यास। दोनों अंतिम उपवाक्यों की समानांतर संरचना तथा जागने और सोने का मानवीकरण बनाए रखा गया है।
