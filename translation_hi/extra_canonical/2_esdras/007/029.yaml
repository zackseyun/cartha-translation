  text: And after these years, my Son the Messiah will die, and all who have human breath.
translation:
  language: hi
  text: और उन वर्षों के बाद मेरा पुत्र, मसीह, और वे सभी जिनमें मानवीय श्वास है, मर जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filius meus Christus
  choice: मेरा पुत्र, मसीह
  rationale: ‘Filius meus’ को संबंधसूचक ‘मेरा पुत्र’ और ‘Christus’ को उपाधि ‘मसीह’ के रूप में रखा गया है; अल्पविराम हिंदी में दोनों के समानाधिकरण संबंध को स्पष्ट करता है।
- source_word: morietur
  choice: मर जाएगा
  rationale: भविष्यकालीन लैटिन क्रिया का सहज और सीधा हिंदी रूप।
- source_word: omnes qui spiramentum habent hominis
  choice: वे सभी भी जिनमें मनुष्य का श्वास है
  rationale: ‘भी’ से यह स्पष्ट होता है कि दूसरी मृत्यु-कथन भी उसी क्रिया के अंतर्गत है। ‘मनुष्य का श्वास’ स्रोत की असामान्य परंतु अर्थपूर्ण रचना को बनाए रखता है और इसका आशय सभी नश्वर मनुष्यों से है।
theological_decisions:
- issue: ‘Filius meus Christus’ में पुत्र और मसीह का संबंध
  choice: मेरा पुत्र, मसीह
  alternative: मेरा पुत्र मसीह
  rationale: समानाधिकरण को विराम-चिह्न से स्पष्ट किया गया है, बिना किसी अतिरिक्त मसीही व्याख्या को पाठ में जोड़ने के।
- issue: मसीह की मृत्यु के साथ सार्वभौमिक मानवीय मृत्यु
  choice: मर जाएगा, और वे सभी भी जिनमें मनुष्य का श्वास है
  alternative: मर जाएगा और वे सभी जिनमें मानवीय श्वास है
  rationale: स्रोत में एक ही भविष्यकालीन क्रिया दोनों कर्ताओं पर लागू होती है। हिंदी में ‘भी’ इस व्याकरणिक संबंध को स्वाभाविक रूप से प्रकट करता है, जबकि मृत्यु के क्रम या कारण के बारे में कुछ नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘श्वास’ ने पद की शास्त्रीय गंभीरता और लैटिन ‘spiramentum’ की शाब्दिक छवि को सुरक्षित रखा है।
