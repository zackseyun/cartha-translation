  text: runt Altissimi ordo est hic, quando incipient seruari a uaso corruptibili. In eo tempore commoratae seruierunt cum labore Altissimo, et omni hora sustinuerunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/089.yaml
  text: This is the order of the Most High, when they began to be kept from the corruptible vessel. In that time they dwelt in it, they served the Most High with labor, and every hour they endured danger, so that they might perfectly keep the law of the Lawgiver.
translation:
  language: hi
  text: परमप्रधान का यह क्रम उस समय का है, जब वे नाशवान पात्र[a] से बचाकर रखे जाने लगेंगे। जिस समय वे उसमें रहते थे, उन्होंने परिश्रम के साथ परमप्रधान की सेवा की और हर घड़ी संकट सहा, ताकि वे विधिदाता की व्यवस्था का पूरी तरह पालन कर सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाशवान पात्र’ संभवतः इस नश्वर देह की ओर संकेत करता है।
    reason: मूल का पात्र-रूपक बनाए रखते हुए उसके प्रसंगानुकूल संदर्भ को अनिश्चितता सहित स्पष्ट करना।
lexical_decisions:
- source_word: Altissimi
  choice: परमप्रधान
  rationale: यह परंपरागत और सहज हिन्दी पदवी लैटिन के सर्वोच्चता-सूचक संबोधन को ठीक रूप से व्यक्त करती है।
- source_word: ordo
  choice: ठहराया हुआ क्रम
  rationale: केवल ‘क्रम’ की अपेक्षा यह वाक्यांश यहाँ निर्धारित व्यवस्था या प्रक्रिया का भाव स्पष्ट करता है, बिना किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को आरोपित किए।
- source_word: vaso corruptibili
  choice: नाशवान पात्र
  rationale: ‘पात्र’ के मूल रूपक को बनाए रखा गया है और corruptibili का नश्वरता-सूचक अर्थ ‘नाशवान’ से व्यक्त किया गया है।
- source_word: seruari a
  choice: से बचाकर रखे जाने
  rationale: प्रस्तुत लैटिन पाठ के seruari और उसके साथ आए a का सीधा अर्थ व्यक्त किया गया है; इसे अनुमान के आधार पर separari (‘अलग किए जाने’) नहीं बनाया गया।
- source_word: cum labore
  choice: कठिन परिश्रम के साथ
  rationale: सेवा में लगे श्रम और कठिनाई दोनों का स्वाभाविक आधुनिक हिन्दी में संप्रेषण होता है।
- source_word: legislatoris legem
  choice: विधिदाता की व्यवस्था
  rationale: legislator के लिए ‘विधिदाता’ और lex के धार्मिक-संदर्भित अर्थ के लिए ‘व्यवस्था’ मूल शब्द-खेल और अर्थ-संबंध को यथासंभव सुरक्षित रखते हैं।
theological_decisions:
- issue: नाशवान पात्र की पहचान
  choice: मुख्य पाठ में रूपक ‘नाशवान पात्र’ रखा गया और पादटिप्पणी में देह की ओर संकेत किया गया।
  alternative: सीधे ‘नाशवान देह’ कहना।
  rationale: मूल रूपक को हटाने से उसकी साहित्यिक और धर्मवैज्ञानिक खुलावट घट जाती; पादटिप्पणी सामान्य आशय समझने में सहायता देती है।
- issue: seruari और संभावित separari पाठ के बीच तनाव
  choice: दिए गए लैटिन seruari के अनुसार ‘बचाकर रखे जाने’ का अनुवाद किया गया।
  alternative: अंग्रेज़ी परामर्श-पाठ अथवा संभावित पाठ-संशोधन के अनुसार ‘अलग किए जाने’ कहना।
  rationale: प्रस्तुत मूल-भाषा साक्ष्य को प्राथमिकता दी गई और बिना प्रत्यक्ष पांडुलिपीय प्रमाण के मौन पाठ-संशोधन नहीं किया गया।
- issue: विधि के पूर्ण पालन का भाव
  choice: ‘व्यवस्था का पूरी तरह पालन कर सकें’
  alternative: ‘व्यवस्था को सिद्ध रूप से सुरक्षित रखें’
  rationale: यह सामान्य आधुनिक हिन्दी में आज्ञापालन का आशय स्पष्ट करता है और पूर्णता के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की भावी प्रक्रिया के लिए incipient को ‘लगेंगे’ से व्यक्त किया गया है; बीते जीवन और सेवा के लिए भूतकाल रखा गया है। उपलब्ध लैटिन पंक्ति आरंभ और अंत में खंडित प्रतीत होती है, इसलिए संकट तथा विधिदाता की व्यवस्था वाला समापन लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ की सहायता से प्रस्तुत किया गया है।
