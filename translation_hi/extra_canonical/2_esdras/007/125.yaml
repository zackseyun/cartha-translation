id: 2ES.7.125
reference: 2 Esdras 7:125
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam super stellas fulgebunt facies eorum qui abstinentiam habuerunt, nostrae vero facies super tenebras nigrae?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/125.yaml
  text: And because the faces of those who practiced self-control will shine above the stars[a], but our faces will be blacker than darkness?
translation:
  language: hi
  text: और क्योंकि जिन लोगों ने आत्म-संयम रखा, उनके चेहरे तारों से भी अधिक चमकेंगे, पर हमारे चेहरे अंधकार से भी अधिक काले होंगे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: क्योंकि
  rationale: कारणसूचक अर्थ को सीधे सुरक्षित रखता है और प्रश्न के पूर्ववर्ती संदर्भ से जुड़े होने का संकेत देता है।
- source_word: abstinentiam habuerunt
  choice: आत्म-संयम रखा
  rationale: लैटिन पद का व्यापक नैतिक अर्थ व्यक्त करता है; इसे केवल उपवास या किसी एक प्रकार के परहेज़ तक सीमित नहीं करता।
- source_word: super stellas fulgebunt
  choice: तारों से भी अधिक चमकेंगे
  rationale: समानांतर 'super tenebras nigrae' के साथ तुलनात्मक संरचना को सुरक्षित रखते हुए super को यहाँ तुलना के अर्थ में प्रस्तुत करता है।
- source_word: super tenebras nigrae
  choice: अंधकार से भी अधिक काले
  rationale: असामान्य किंतु प्रभावशाली तुलनात्मक बिंब को बिना नरम किए बनाए रखता है।
theological_decisions:
- issue: आत्म-संयम का आशय
  choice: व्यापक नैतिक आत्म-संयम
  alternative: तपस्या, उपवास या यौन-संयम जैसे किसी विशिष्ट अभ्यास का उल्लेख
  rationale: abstinentia अकेले किसी एक विशिष्ट धार्मिक अभ्यास को अनिवार्य नहीं करती; व्यापक अनुवाद मूल की अर्थ-सीमा और अस्पष्टता बचाता है।
- issue: super stellas का संबंध
  choice: तारों से अधिक चमकने की तुलना
  alternative: तारों के ऊपर स्थानगत रूप से चमकना
  rationale: दूसरे खंड के super tenebras के साथ संतुलित तुलनात्मक समानांतरता इस अर्थ का समर्थन करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्वाभाविक और सामान्य पाठक के लिए स्पष्ट शैली। मूल का कारणसूचक आरंभ, भविष्यकाल और विस्मय-वेदना से भरा प्रश्नवाचक रूप बनाए रखा गया है।
