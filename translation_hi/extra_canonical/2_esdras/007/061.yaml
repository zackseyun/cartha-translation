id: 2ES.7.61
reference: 2 Esdras 7:61
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nominatum est; Et non contristabor super multitudinem eorum qui perierunt, ipsi enim sunt qui uapori assimilati sunt et flammae, fumo adaequati sunt et exarserunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/061.yaml
  text: And I will not grieve over the multitude of those who have perished[a], for they are the ones who have been made like vapor and likened to flame, compared to smoke, and have burned up.
translation:
  language: hi
  text: और जो नष्ट हो चुके हैं, उनकी बड़ी संख्या पर मैं शोक नहीं करूँगा, क्योंकि वे ही हैं जो वाष्प और ज्वाला के समान बनाए गए, धुएँ के तुल्य ठहराए गए और भभककर जल गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contristabor
  choice: मैं शोक नहीं करूँगा
  rationale: लैटिन के भविष्यत्काल और दुःख/शोक करने के भाव को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: multitudinem eorum qui perierunt
  choice: जो नष्ट हो चुके हैं, उनकी बड़ी संख्या
  rationale: perierunt के पूर्ण भूतकाल और multitudo के सामूहिक संख्यात्मक भाव—दोनों को बनाए रखता है।
- source_word: uapori assimilati sunt et flammae
  choice: वाष्प और ज्वाला के समान बनाए गए
  rationale: दोनों संज्ञाओं को assimilati sunt के साथ जोड़ने वाली लैटिन वाक्य-रचना और कर्मवाच्य को सुरक्षित रखता है।
- source_word: fumo adaequati sunt
  choice: धुएँ के तुल्य ठहराए गए
  rationale: adaequati sunt के तुलना/समतुल्यता के भाव और कर्मवाच्य को स्पष्ट रखता है।
- source_word: exarserunt
  choice: भभककर जल गए
  rationale: क्रिया के तीव्रता से जल उठने के भाव को बिना 'राख' या 'बुझने' जैसी अस्रोत धारणाएँ जोड़े व्यक्त करता है।
theological_decisions:
- issue: नष्ट हुए लोगों के प्रति वक्ता का शोक न करना
  choice: कथन को सीधे रूप में रखा गया है
  alternative: इसे दया, न्याय या अंतिम दंड की किसी विशिष्ट धर्मवैज्ञानिक व्याख्या से स्पष्ट करना
  rationale: लैटिन पाठ कारण बताता है, पर उसके धर्मवैज्ञानिक निहितार्थ को व्यवस्थित रूप से नहीं खोलता; इसलिए मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-सन्निकट शैली। आरम्भिक “nominatum est;” को इस पद में शामिल नहीं किया गया, क्योंकि यह साफ किए गए स्रोत में पिछले वाक्य/पद का शेषांश प्रतीत होता है और परामर्श-पाठ भी पद 61 को “Et non contristabor” से आरम्भ करता है।
