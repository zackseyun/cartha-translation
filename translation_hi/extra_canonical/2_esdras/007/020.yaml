  yaml_path: translation/extra_canonical/2_esdras/007/020.yaml
  text: For let many of those now present perish[a], rather than the law of God that has been set forth be neglected.
translation:
  language: hi
  text: क्योंकि परमेश्वर की वह व्यवस्था, जो सामने रखी गई है, उपेक्षित हो जाए, इससे अच्छा है कि अभी उपस्थित बहुत-से लोग नष्ट हो जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अभी जीवित बहुत-से लोग नष्ट हो जाएँ।”
    reason: praesentes का अर्थ संदर्भानुसार ‘अभी उपस्थित’ या व्यापक रूप से ‘अभी जीवित’ समझा जा सकता है।
lexical_decisions:
- source_word: enim
  choice: क्योंकि
  rationale: यह पिछले कथन से व्याख्यात्मक/कारणसूचक संबंध बनाए रखता है।
- source_word: multi praesentes
  choice: अभी उपस्थित बहुत-से लोग
  rationale: praesentes का निकट अर्थ ‘उपस्थित’ है; ‘अभी’ वर्तमान संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: pereant
  choice: नष्ट हो जाएँ
  rationale: लैटिन संभावनार्थक/आज्ञार्थक रूप की कठोरता को बिना नरम किए व्यक्त करता है।
- source_word: anteposita est
  choice: सामने रखी गई है
  rationale: व्यवस्था के प्रस्तुत या सामने रखे जाने का भाव रखता है और किसी अनुल्लिखित कर्म (‘उनके’) को नहीं जोड़ता।
- source_word: neglegatur
  choice: उपेक्षित हो
  rationale: व्यवस्था की अनदेखी या अवहेलना किए जाने का निष्क्रिय भाव सुरक्षित रखता है।
theological_decisions:
- issue: बहुतों के नष्ट होने और परमेश्वर की व्यवस्था की उपेक्षा के बीच तुलना
  choice: ‘इससे अच्छा है कि’ द्वारा कठोर वरीयता को स्पष्ट रखा गया
  alternative: ‘इसके बजाय’ या ‘न कि’
  rationale: quam के तुलनात्मक भाव को स्वाभाविक हिंदी में व्यक्त करते हुए कथन का धर्मवैचारिक तनाव नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; गंभीर और गरिमापूर्ण शैली। वाक्य-विन्यास को स्वाभाविक बनाने के लिए लैटिन की ‘rather than’ तुलना को ‘इससे अच्छा है कि’ के रूप में रखा गया है।
