  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'temporibus. Nam de morte sermo est: quando profectus fuerit terminus sententiae ab Altissimo ut homo moriatur, recedente inspiratione de corpore ut dimittatur iterum'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/078.yaml
  text: 'Concerning death, the matter is this: when the decree has gone forth from the Most High that a man should die, as the breath departs from the body so that it may be sent back again,'
translation:
  language: hi
  text: 'मृत्यु के विषय में बात यह है: जब परमप्रधान की ओर से यह आदेश जारी हो चुका होता है कि कोई मनुष्य मरे, तब श्वास शरीर से निकल जाती है, ताकि उसे फिर वापस भेज दिया जाए,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sermo est
  choice: बात यह है
  rationale: यह स्वाभाविक हिन्दी में विषय के कथन को प्रस्तुत करता है और इसे औपचारिक ‘शिक्षा’ या सिद्धान्त नहीं बनाता।
- source_word: terminus sententiae
  choice: निर्णय
  rationale: सन्दर्भ में यह परमप्रधान के उस निर्णायक आदेश को सूचित करता है जिसके अनुसार मनुष्य को मरना है; शाब्दिक ‘निर्णय की सीमा/अन्त’ हिन्दी में अस्पष्ट और अस्वाभाविक होता।
- source_word: Altissimo
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस सर्वोच्चता-सूचक उपाधि का प्रचलित और गरिमापूर्ण हिन्दी रूप।
- source_word: homo
  choice: कोई मनुष्य
  rationale: यहाँ सामान्य मानव व्यक्ति का बोध है, न केवल पुरुष का।
- source_word: inspiratione
  choice: श्वास
  rationale: लैटिन शब्द यहाँ शरीर से निकलने वाली जीवन-श्वास को दर्शाता है; ‘आत्मा’ कहने से स्रोत की अपेक्षा अधिक निश्चित तात्त्विक अर्थ जुड़ सकता है।
- source_word: dimittatur iterum
  choice: उसे फिर वापस भेज दिया जाए
  rationale: निष्क्रिय प्रयोजन-वाक्य और गन्तव्य के अनकहे रहने को सुरक्षित रखता है।
theological_decisions:
- issue: inspiratio को ‘श्वास’ या ‘आत्मा’ के रूप में समझना
  choice: श्वास
  alternative: आत्मा/प्राण
  rationale: स्रोत का शब्द जीवन-श्वास के अर्थ की अनुमति देता है और इस अंश में अलग अस्तित्व वाली आत्मा को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए कम व्याख्यात्मक विकल्प चुना गया।
- issue: श्वास को कहाँ या किसके पास वापस भेजा जाता है
  choice: गन्तव्य को अनकहा रखा गया
  alternative: उसे देने वाले के पास वापस
  rationale: प्रस्तुत लैटिन में गन्तव्य या देने वाले का उल्लेख नहीं है; उसे जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और स्रोत के अधूरे, आगे जारी रहने वाले वाक्य के अनुरूप अन्त में अल्पविराम सहित रखी गई है।
