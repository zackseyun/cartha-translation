  to: 'मृत्यु के विषय में बात यह है: जब परमप्रधान की ओर से यह आदेश जारी हो चुका होता है कि कोई मनुष्य मरे, तब श्वास शरीर से निकल जाती है, ताकि उसे फिर वापस भेज दिया जाए,'
