  text: और मैंने उत्तर देकर कहा, “यदि मैंने तेरी दृष्टि में अनुग्रह पाया है, तो मुझे, अपने सेवक को, यह भी दिखा कि क्या उस दिन
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respondi et dixi
  choice: मैंने उत्तर देकर कहा
  rationale: लातीनी द्विक अभिव्यक्ति का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: si inueni gratiam ante oculos tuos
  choice: यदि तेरी दृष्टि में मुझ पर अनुग्रह हुआ है
  rationale: शाब्दिक बिंब ‘तेरी आँखों के सामने’ को मुहावरेदार ‘तेरी दृष्टि में’ से व्यक्त किया, जबकि अनुग्रह पाने का भाव सुरक्षित रखा।
- source_word: demonstra mihi adhuc seruo tuo
  choice: अपने सेवक मुझ पर यह भी प्रकट कर
  rationale: mihi और seruo tuo दोनों को बनाए रखते हुए हिन्दी में संबोधन-संबंध स्पष्ट किया; adhuc को यहाँ ‘यह भी’ के रूप में लिया।
- source_word: si in die
  choice: कि क्या उस दिन
  rationale: si को अप्रत्यक्ष प्रश्न में ‘क्या’ और in die को ‘उस दिन’ किया; स्रोत के अधूरे वाक्य को बिना पूर्ति के अधूरा रखा।
theological_decisions:
- issue: खंडित स्रोत-पाठ का अंत
  choice: वाक्य को ‘कि क्या उस दिन’ पर अधूरा छोड़ा
  alternative: न्याय के दिन और धर्मियों की विनती संबंधी बाद का आशय जोड़ना
  rationale: दिए गए लातीनी अंश में केवल si in die तक पाठ है; अनुपस्थित निरंतरता जोड़ने से स्रोत से परे धार्मिक सामग्री आ जाती।
