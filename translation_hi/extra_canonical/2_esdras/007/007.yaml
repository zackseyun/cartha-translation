  yaml_path: translation/extra_canonical/2_esdras/007/007.yaml
  text: But its entrance is narrow and set on a precipice, so that on the right there is fire and on the left deep water.
translation:
  language: hi
  text: पर उसका प्रवेश-द्वार सँकरा है और खड़ी ढलान पर स्थित है; उसके दाहिनी ओर आग है और बाईं ओर गहरा पानी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  choice: प्रवेश-द्वार
  rationale: यहाँ किसी स्थान में प्रवेश करने के संकरे मार्ग या द्वार का अर्थ है; ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: angustus
  choice: सँकरा
  rationale: लैटिन विशेषण प्रवेश की सीमित चौड़ाई बताता है।
- source_word: in praecipiti positus
  choice: खड़ी ढलान पर स्थित
  rationale: praeceps/praecipitium दुर्गम, तीव्र ढलान या कगार का बोध कराता है। ‘खड़ी ढलान’ मूल स्थलाकृतिक खतरे को स्पष्ट रखता है, बिना अनावश्यक रूप से केवल ‘खाई’ अर्थ चुनने के।
- source_word: a dextris quidem ignis
  choice: उसके दाहिनी ओर आग
  rationale: दिशा और खतरे को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: a sinistris vero aqua alta
  choice: बाईं ओर गहरा पानी
  rationale: aqua alta का आशय गहरे पानी से है; ‘गहरा पानी’ साधारण पाठक के लिए सहज है और जोखिम का भाव बनाए रखता है।
