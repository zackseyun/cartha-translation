  yaml_path: translation/extra_canonical/2_esdras/007/067.yaml
  text: for they do not know torments[a], nor the salvation promised to them after death. But as for us,
translation:
  language: hi
  text: क्योंकि वे न तो यातनाओं[a] को जानते हैं, न उस उद्धार को, जिसकी प्रतिज्ञा उनके लिए मृत्यु के बाद की गई है। परन्तु हम—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पूर्व अनुवाद में यह अंश था: “पर हमें इससे क्या लाभ कि हम जीवित बचाए जाएँगे, यदि हमें यातना देकर पीड़ित किया जाएगा?”'
    reason: यह वाक्य पूर्व अनुवाद में पद-विभाजन की त्रुटि के कारण इस पद से जोड़ा गया था; यह निर्दिष्ट लैटिन स्रोत का इस पद का पाठांतर नहीं है।
lexical_decisions:
- source_word: cruciamenta
  choice: यातनाओं
  rationale: बहुवचन लैटिन संज्ञा का सीधा और स्वाभाविक अर्थ; दण्ड से जुड़ी पीड़ा का भाव बनाए रखता है।
- source_word: salutem
  choice: उद्धार
  rationale: धार्मिक संदर्भ में लैटिन salus का प्रचलित, व्यापक हिन्दी समतुल्य।
- source_word: repromissam sibi
  choice: जिसकी प्रतिज्ञा उनके लिए ... की गई है
  rationale: निष्क्रिय कृदन्त और sibi के हितार्थक/सम्बन्धसूचक भाव को स्पष्ट रखते हुए सहज हिन्दी दी गई है।
- source_word: post mortem
  choice: मृत्यु के बाद
  rationale: कालगत अर्थ का सीधा अनुवाद।
- source_word: Nobis autem
  choice: परन्तु हम—
  rationale: खंड के अधूरे संक्रमण को अगले पद की ओर खुला रखने के लिए दीर्घ विराम लगाया गया है; इसे कृत्रिम रूप से पूर्ण वाक्य नहीं बनाया।
theological_decisions:
- issue: मृत्यु के बाद प्रतिज्ञात उद्धार का सम्बन्ध
  choice: उनके लिए प्रतिज्ञात उद्धार
  alternative: उन्हें प्रतिज्ञात उद्धार
  rationale: sibi का सन्दर्भ निकटवर्ती बहुवचन कर्ता से जोड़ते हुए मूल की कथनगत अस्पष्टता और तनाव सुरक्षित रखा गया है।
- issue: पद के अंत का अधूरा विरोधसूचक संक्रमण
  choice: परन्तु हम—
  alternative: परन्तु हमारे लिए
  rationale: Nobis autem अगले कथन की भूमिका है। मूल स्रोत इसी स्थान पर अधूरा समाप्त होता है, इसलिए अनुवाद भी उसे पूरा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। मुख्य पाठ निर्दिष्ट लैटिन का निकट और स्वाभाविक अनुवाद है। पदांत की अपूर्णता को दीर्घ विराम से सुरक्षित रखा गया है।
