lexical_decisions:
- source_word: munificus
  choice: उदार
  rationale: यह स्वाभाविक आधुनिक हिन्दी में उदारतापूर्वक देने के भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: donare
  choice: देना
  rationale: संदर्भ में उपहारस्वरूप देने का अर्थ है; हिन्दी में सहजता के लिए सामान्य क्रिया ‘देना’ उपयुक्त है।
- source_word: exigere
  choice: माँगना
  rationale: यहाँ देने के विपरीत किसी से कुछ अपेक्षित या माँगने का भाव है; ‘वसूल करना’ अनावश्यक रूप से ऋण या दंड का अर्थ जोड़ सकता है।
- source_word: quidem
  choice: ही
  rationale: ‘देना ही चाहता है’ में निश्चयात्मक बल स्वाभाविक हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वर की उदारता और माँग के बीच विरोध
  choice: ‘माँगने के बजाय देना’
  alternative: ‘लेने के बजाय देना’
  rationale: लैटिन exigere का मूल भाव माँगना या अपेक्षा करना है; ‘लेना’ पाठ को अधिक सामान्य बनाकर स्रोत की विशिष्टता घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यह अंश वाक्य की पूर्ववर्ती विशेषण-श्रृंखला का भाग है, इसलिए आरंभ में ‘और’ तथा अंत में अल्पविराम रखा गया है।
