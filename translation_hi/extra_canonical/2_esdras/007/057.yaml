source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: æramentum, plumbum super ferrum, et fictile super plumbum. Aestima et tu, quæ sint pretiosa et desiderabilia, quod multiplicatur aut quod rarum nascitur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/057.yaml
  text: 'So judge for yourself which things are precious and desirable: what is abundant, or what is born rare?'
translation:
  language: hi
  text: इसलिए तुम स्वयं आँको कि कौन-सी वस्तुएँ बहुमूल्य और वांछनीय हैं—जो बहुतायत में होती हैं, या जो विरले ही उत्पन्न होती हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Aestima
  choice: विचार करो
  rationale: लैटिन क्रिया का अर्थ यहाँ वस्तुओं के तुलनात्मक मूल्य को आँकना या परखना है; सामान्य हिन्दी में ‘विचार करो’ स्वाभाविक है और स्वयं निर्णय करने का भाव रखता है।
- source_word: pretiosa et desiderabilia
  choice: बहुमूल्य और चाहने योग्य
  rationale: 'दोनों विशेषणों का अलग-अलग अर्थ सुरक्षित रखा गया है: मूल्यवान होना और वांछनीय होना।'
- source_word: quod multiplicatur
  choice: जो बहुतायत में होती हैं
  rationale: शाब्दिक ‘जो बढ़ती/बहुगुणित होती हैं’ के बजाय प्रसंगानुसार प्रचुर उपलब्धता का भाव व्यक्त किया गया है।
- source_word: quod rarum nascitur
  choice: जो विरली ही उत्पन्न होती हैं
  rationale: nascitur के उत्पन्न होने के बिंब और rarum की दुर्लभता—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: बहुलता और दुर्लभता के बीच अलंकारिक तुलना
  choice: प्रश्न को खुला रखा गया है
  alternative: स्पष्ट रूप से कहना कि दुर्लभ वस्तु ही अधिक बहुमूल्य है
  rationale: मूल पाठ उत्तर को सीधे नहीं बताता, बल्कि पाठक से निर्णय करने को कहता है; इसलिए निहित निष्कर्ष को अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। स्रोत में आरम्भिक ‘æramentum… fictile super plumbum’ पिछले वाक्य/पद की सूची का अंश है; इस पद के लिए अंग्रेज़ी POB की सत्यापित सीमा के अनुरूप अनुवाद ‘Aestima et tu…’ से किया गया है।
