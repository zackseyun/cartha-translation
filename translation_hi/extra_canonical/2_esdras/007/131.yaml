id: 2ES.7.131
reference: 2 Esdras 7:131
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam non esset tristitia in perditione eorum, sicut et futurum est gaudium super eos quibus persuasa est salus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/131.yaml
  text: For there should be no grief over their destruction[a], just as there will be joy over those to whom salvation has been promised.”
translation:
  language: hi
  text: क्योंकि उनके विनाश पर शोक नहीं होना चाहिए, ठीक वैसे ही उनके विषय में आनन्द होगा जिन्हें उद्धार का आश्वासन दिया गया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें उद्धार का भरोसा दिलाया गया है”; कुछ अर्थानुवादों में, “जिनसे उद्धार की प्रतिज्ञा की गई है।”
    reason: लैटिन persuasa est का quibus के साथ प्रयोग आश्वासन, भरोसा दिलाने या—कुछ व्याख्याओं में—प्रतिज्ञा का भाव दे सकता है।
lexical_decisions:
- source_word: quoniam
  choice: क्योंकि
  rationale: यह कारणसूचक संयोजक है; ‘इसलिए’ के बजाय ‘क्योंकि’ लैटिन के अर्थ को ठीक रखता है।
- source_word: tristitia in perditione eorum
  choice: उनके विनाश पर शोक
  rationale: ‘शोक’ यहाँ tristitia का स्वाभाविक हिन्दी रूप है, और ‘विनाश पर’ in perditione के प्रसंगगत अर्थ को व्यक्त करता है।
- source_word: persuasa est salus
  choice: उद्धार का आश्वासन दिया गया है
  rationale: persuasa est का quibus के साथ प्रयोग उद्धार के विषय में भरोसा या निश्चय दिलाने का भाव देता है। हिन्दी में यह वाक्यांश स्वाभाविक है और असहज शाब्दिक अनुवाद से बचता है।
theological_decisions:
- issue: persuasa est salus में उद्धार के आश्वासन और प्रतिज्ञा के बीच अर्थ-छाया
  choice: उद्धार का आश्वासन दिया गया है
  alternative: उद्धार की प्रतिज्ञा की गई है
  rationale: लैटिन में प्रतिज्ञा के लिए सामान्यतः प्रयुक्त शब्द नहीं है; persuasa est भरोसा दिलाने या निश्चित कराने के अधिक निकट है। पाठ की सम्भावित अर्थ-छाया पादटिप्पणी में सुरक्षित रखी गई है।
- issue: esset का विध्यर्थक/सम्भावनार्थक बल
  choice: शोक नहीं होना चाहिए
  alternative: शोक नहीं होता
  rationale: अपूर्ण भूतकालीन subjunctive को सपाट भविष्य या वर्तमान कथन बनाने के बजाय ‘होना चाहिए’ उसके विध्यर्थक बल को बेहतर व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘ठीक वैसे ही’ तुलना को स्पष्ट करता है, जबकि ‘उद्धार’ धार्मिक प्रसंग का परिचित और व्यापक शब्द है।
