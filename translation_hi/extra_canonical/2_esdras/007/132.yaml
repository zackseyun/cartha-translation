  text: 'Et respondi et dixi: scio, domine, quoniam nunc vocatus est Altissimus misericors, in eo quod misereatur qui nondum in saeculo advenerunt,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/132.yaml
  text: And I answered and said[a], “I know, Lord, that the Most High is now called merciful because he has mercy on those who have not yet come into the age,”
translation:
  language: hi
  text: मैंने उत्तर देकर कहा, “हे प्रभु, मैं जानता हूँ कि परमप्रधान को अब दयालु कहा जाता है, क्योंकि वह उन पर दया करता है जो अभी तक संसार में नहीं आए हैं[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युग में।”
    reason: लैटिन ‘in saeculo’ का अधिक शाब्दिक वैकल्पिक अनुवाद; इस प्रसंग में पूरे मुहावरे का आशय अभी जन्म लेकर संसार में न आना है।
lexical_decisions:
- source_word: nunc vocatus est
  choice: अब ... कहा जाता है
  rationale: लैटिन के वर्तमान निष्क्रिय भाव को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का प्रचलित, गरिमापूर्ण हिन्दी रूप।
- source_word: misericors / misereatur
  choice: दयालु / दया करता है
  rationale: संज्ञेय गुण और उससे संबंधित क्रिया के बीच लैटिन का शब्द-संबंध बनाए रखा गया है।
- source_word: qui nondum in saeculo advenerunt
  choice: जो अभी तक संसार में नहीं आए हैं
  rationale: इस प्रसंग में in saeculo advenire जन्म लेकर मानव संसार में आने का मुहावरा है; शाब्दिक ‘युग में आना’ हिन्दी में अर्थ को अस्पष्ट करता।
theological_decisions:
- issue: saeculum को ‘संसार’ या ‘युग’ समझना
  choice: संसार
  alternative: युग
  rationale: यद्यपि इस ग्रंथ में saeculum का अर्थ प्रायः ‘युग’ हो सकता है, यहाँ nondum ... advenerunt के साथ यह उन लोगों का संकेत है जो अभी जन्म लेकर संसार में नहीं आए। इससे कथन की कालगत और धर्मवैचारिक असहजता को अतिरिक्त व्याख्या द्वारा नहीं सुलझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में ‘हे प्रभु’ और ईश्वरीय उपाधि ‘परमप्रधान’ से गरिमापूर्ण किन्तु सहज शैली रखी गई है। लैटिन के दोहरे कथन ‘उत्तर दिया और कहा’ को स्वाभाविक हिन्दी में केवल ‘उत्तर दिया’ किया गया है।
