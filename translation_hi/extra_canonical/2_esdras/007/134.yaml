source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et longanimis, quoniam longanimitatem praestat his qui peccaverunt quasi suis operibus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/134.yaml
  text: and long-suffering, because he shows long-suffering toward those who have sinned, as toward his own works,
translation:
  language: hi
  text: और वह बहुत धीरज रखनेवाला है, क्योंकि वह उन लोगों के प्रति धीरज रखता है जिन्होंने पाप किया है, मानो वे उसकी अपनी कृतियाँ हों,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: longanimis / longanimitatem praestat
  choice: धीरजवन्त है / धीरज रखता है
  rationale: लैटिन में विशेषण और उसी मूल से बनी संज्ञात्मक अभिव्यक्ति की पुनरावृत्ति है। हिन्दी में ‘धीरजवन्त’ और ‘धीरज रखता है’ उस संबंध को स्वाभाविक ढंग से बनाए रखते हैं और दीर्घ सहनशीलता का भाव व्यक्त करते हैं।
- source_word: his qui peccaverunt
  choice: पाप करनेवालों के प्रति
  rationale: पूर्ण हो चुके peccaverunt को हिन्दी में सामान्य और स्पष्ट कृदन्तीय अभिव्यक्ति से प्रस्तुत किया गया है; ‘के प्रति’ praestat के संबंध को स्वाभाविक बनाता है।
- source_word: quasi suis operibus
  choice: मानो वे उसकी अपनी कृतियाँ हों
  rationale: quasi की तुलना और संभाव्य भाव को ‘मानो ... हों’ से सुरक्षित रखा गया है। opera के लिए ‘कृतियाँ’ सृष्ट की हुई वस्तुओं/प्राणियों के व्यापक अर्थ को खुला रखता है।
theological_decisions:
- issue: पापियों को परमेश्वर की अपनी कृतियों के समान देखने वाली तुलना
  choice: मानो वे उसकी अपनी कृतियाँ हों
  alternative: अपनी ही रचनाओं के प्रति जैसा
  rationale: लैटिन quasi को स्पष्ट तुलना के रूप में रखा गया है; इसे पहचान के कठोर कथन या किसी विशिष्ट सृष्टि-सिद्धान्त में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। स्रोत की समान-मूल पुनरावृत्ति और ‘quasi’ की वास्तविक अस्पष्टता सुरक्षित रखी गई है। पद खंडरूप है, इसलिए अंत में अल्पविराम रखा गया है।
