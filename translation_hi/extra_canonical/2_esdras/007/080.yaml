base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/080.yaml
  text: these spirits will not enter habitations[a], but will wander from now on in torments, always grieving and sad, in seven ways.
translation:
  language: hi
  text: ये आत्माएँ निवास-स्थानों[a] में प्रवेश नहीं करेंगी, बल्कि अब से सात प्रकार की यातनाएँ सहती हुई भटकती रहेंगी और सदा शोकाकुल और उदास रहेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठिकानों।”
    reason: लैटिन habitationes के लिए अधिक सामान्य हिन्दी विकल्प।
lexical_decisions:
- source_word: Haec inspirationes
  choice: ये आत्माएँ
  rationale: ‘Haec’ को निकट संकेतवाचक ‘ये’ और ‘inspirationes’ को इस मरणोत्तर संदर्भ में स्वाभाविक ‘आत्माएँ’ के रूप में दिया गया है।
- source_word: habitationes
  choice: निवास-स्थान
  rationale: यह बहुवचन ‘निवासों/ठिकानों’ का अर्थ रखता है; ‘निवास-स्थान’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: per septem vias
  choice: सात प्रकार से
  rationale: शाब्दिक ‘सात मार्गों से’ हिन्दी में भ्रामक हो सकता है; यहाँ आगे गिनाए जाने वाले यातना के सात रूपों की संरचनात्मक भूमिका को स्पष्ट रखा गया है।
theological_decisions:
- issue: मृत्यु के बाद आत्माओं के निवास और यातना का वर्णन
  choice: पाठ के कथन को सीधे रखा गया है कि ये आत्माएँ निवास-स्थानों में प्रवेश नहीं करेंगी और यातनाओं में भटकेंगी।
  alternative: ‘निवास-स्थान’ को किसी विशिष्ट सिद्धान्तगत स्वर्ग, अधोलोक या मध्यावस्था के नाम से पहचानना।
  rationale: लैटिन पाठ स्वयं उस स्थान की संप्रदायगत पहचान नहीं करता; अतः उसकी व्यापकता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए स्पष्ट, किंतु मरणोत्तर न्याय-वर्णन के अनुरूप गरिमापूर्ण शैली। ‘सात प्रकार से’ अगले पदों में आने वाली सातfold गणना की भूमिका को स्वाभाविक हिन्दी में बनाए रखता है।
