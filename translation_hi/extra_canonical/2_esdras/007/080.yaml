  verdict: revise
  source_fidelity: 'The draft preserves the principal elements attested by the supplied Latin and audit trail: the demonstrative “these,” spirits, exclusion from habitations, ongoing wandering in torments, continual grief/sadness, and the essential sevenfold structural qualifier. Rendering inspirationes as “आत्माएँ” is suitable in this postmortem context and does not impose a sectarian identification.'
  naturalness: “सात प्रकार से” at the end is understandable, but it is syntactically detached in Hindi and can sound as though it modifies only “उदास.” Moving it next to “यातनाएँ” makes the intended sevenfold characterization clear and provides a natural lead-in to the following enumeration.
  terminology: “निवास-स्थानों” is accurate and appropriately neutral, though somewhat formal; the footnote’s “ठिकानों” supplies a natural alternative. “यातनाएँ,” “शोकाकुल,” and “उदास” retain the grave register without adding theological interpretation.
  issues:
  - severity: low
    issue: The placement of “सात प्रकार से” is syntactically loose.
    rationale: The phrase is structurally crucial because it introduces the subsequent sevenfold list. In the draft it follows “उदास रहेंगी,” where its scope is less immediately clear. Associating it directly with the torments improves clarity without changing the meaning.
