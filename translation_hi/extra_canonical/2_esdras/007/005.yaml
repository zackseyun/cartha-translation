  to: क्योंकि यदि कोई समुद्र में प्रवेश करना, उसे देखना या उस पर अधिकार करना चाहता है, तो वह सँकरे स्थान से गुज़रे बिना खुले स्थान में कैसे पहुँच सकेगा?
