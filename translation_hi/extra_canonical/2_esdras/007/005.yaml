id: 2ES.7.5
reference: 2 Esdras 7:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si quis enim volens voluerit ingredi mare videre eum vel dominari eius, si non transierit angustum, in latitudinem venire quomodo poterit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/005.yaml
  text: For if anyone desires to enter the sea[a], to see it or to master it, how will he be able to come into the broad place unless he passes through the narrow place?
translation:
  language: hi
  text: क्योंकि यदि कोई समुद्र में प्रवेश करना, उसे देखना या उस पर अधिकार करना चाहता है, तो वह सँकरे स्थान से गुज़रे बिना खुले स्थान में कैसे पहुँच सकेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: volens voluerit
  choice: चाहता है
  rationale: दोहराव इच्छा पर बल देता है, पर आधुनिक हिन्दी में कृत्रिम पुनरुक्ति के बजाय स्वाभाविक क्रिया पर्याप्त है।
- source_word: ingredi mare
  choice: समुद्र में प्रवेश करके
  rationale: लैटिन में mare, ingredi का कर्म है; यह अनुवाद उस संबंध को स्पष्ट रखता है और आगे के infinitives से सहजता से जुड़ता है।
- source_word: videre eum
  choice: उसे देखना
  rationale: eum का स्वाभाविक पूर्वपद समुद्र है; स्रोत की सर्वनामिक संरचना सुरक्षित रखी गई है।
- source_word: dominari eius
  choice: उस पर अधिकार करना
  rationale: dominari के शासन अथवा वश में करने के भाव को सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: angustum
  choice: सँकरा मार्ग
  rationale: लैटिन विशेषण संज्ञा के बिना प्रयुक्त है; प्रसंग में स्थान अथवा रास्ते का भाव है, इसलिए हिन्दी में निहित संज्ञा जोड़ी गई है।
- source_word: in latitudinem venire
  choice: खुले स्थान में पहुँचना
  rationale: latitudo का विरोध angustum से है; 'विस्तार' की अपेक्षा 'खुला स्थान' चित्र को अधिक स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: quomodo poterit
  choice: कैसे पहुँच सकेगा
  rationale: poterit की सामर्थ्यसूचकता को 'सकेगा' से स्पष्ट रखा गया है।
theological_decisions:
- issue: समुद्र पर अधिकार करने की छवि
  choice: उस पर अधिकार करना
  alternative: उसे वश में करना
  rationale: स्रोत में dominari की व्यापकता बनी रहती है और किसी विशेष धार्मिक व्याख्या को आरोपित नहीं किया जाता।
- issue: सँकरे और खुले स्थान की रूपकात्मकता
  choice: रूपक को बिना व्याख्या के यथावत रखना
  alternative: इसे स्पष्टतः उद्धार या जीवन-मार्ग से जोड़ना
  rationale: इस पद में रूपक का धर्मवैचारिक आशय प्रत्यक्ष रूप से नहीं खोला गया है; अनुवाद उसे समय से पहले निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। प्रश्नवाचक संरचना तथा सँकरे स्थान से खुले स्थान तक पहुँचने का मूल विरोध सुरक्षित रखा गया है।
