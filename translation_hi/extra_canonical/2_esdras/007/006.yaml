  text: 'Again, another example: a city is built and set in a plain, and it is full of every good thing.'
translation:
  language: hi
  text: 'फिर, एक और उदाहरण: एक नगर बनाया गया है और समतल स्थान में स्थित किया गया है, और वह हर अच्छी वस्तु से भरा है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: item aliud
  choice: फिर एक और उदाहरण लो
  rationale: लातीनी वाक्यांश शाब्दिक रूप से ‘फिर एक और’ है; प्रसंग में यह नया दृष्टांत प्रस्तुत करता है, इसलिए सहज हिन्दी में ‘उदाहरण लो’ जोड़ा गया।
- source_word: civitas
  choice: नगर
  rationale: ‘नगर’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: in loco campestri
  choice: समतल भूमि पर
  rationale: campestris खुले, मैदानी अथवा समतल स्थान को दर्शाता है; यहाँ नगर की स्थिति के लिए ‘समतल भूमि’ स्वाभाविक है।
- source_word: plena omnium bonorum
  choice: हर प्रकार की अच्छी वस्तुओं से भरा
  rationale: bonorum का अर्थ व्यापक रूप से अच्छी या लाभदायक वस्तुएँ है; इसे केवल धन-संपत्ति तक सीमित नहीं किया गया।
