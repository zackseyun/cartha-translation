  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बनाया गया है’ और ‘बसाया गया है’ से मूल के aedificata तथा posita, दोनों क्रियात्मक पक्ष सुरक्षित रहते हैं।
