  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मूल लातीनी वाक्य की प्रत्युत्तरात्मक संरचना और ‘समझ हमारे साथ बढ़ती है’ की स्वाभाविक अस्पष्टता सुरक्षित रखी गई है।
