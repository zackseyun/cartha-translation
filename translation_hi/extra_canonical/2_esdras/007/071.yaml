source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et nunc de sermonibus tuis intellege, quoniam dixisti, quia nobiscum crescit sensus;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/071.yaml
  text: And now understand from your own words, because you said that understanding grows with us.
translation:
  language: hi
  text: और अब अपनी ही बातों से समझो, क्योंकि तुमने कहा था कि समझ हमारे साथ बढ़ती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de sermonibus tuis
  choice: अपनी ही बातों से
  rationale: लातीनी पदबंध का स्वाभाविक हिन्दी रूप; ‘से’ यहाँ कही हुई बातों के आधार पर निष्कर्ष समझने का भाव व्यक्त करता है। ‘ही’ वक्ता के प्रत्युत्तर में उन्हीं बातों पर बल देता है।
- source_word: intellege
  choice: समझो
  rationale: एकवचन आज्ञार्थक क्रिया का सीधा, वर्तमान मानक हिन्दी रूप।
- source_word: sensus
  choice: समझ
  rationale: यहाँ sensus बोध अथवा समझने की क्षमता को सूचित करता है; ‘समझ’ सहज है और अनावश्यक दार्शनिक विशिष्टता नहीं जोड़ता।
- source_word: nobiscum crescit
  choice: हमारे साथ बढ़ती है
  rationale: मूल की स्थानिक-सहवर्ती अभिव्यक्ति को बनाए रखता है और इस अस्पष्टता का निर्णय नहीं करता कि समझ उम्र, अनुभव या व्यक्ति के विकास के साथ कैसे बढ़ती है।
