  text: Et apparebit lacus tormenti, et contra illum erit locus requietionis ; et clibanus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/036.yaml
  text: And the pit of torment will appear[a], and opposite it will be the place of rest; and the furnace of Gehenna will be shown[b], and opposite it the paradise of delight.
translation:
  language: hi
  text: और यातना की झील प्रकट होगी[a][b], और उसके सामने विश्राम का स्थान होगा; और गेहन्ना की भट्ठी प्रकट होगी, और उसके सामने आनंद का स्वर्गलोक होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 7:36–105 के पद बेंस्ली के ‘लुप्त अंश’ का भाग हैं। यह अंश अधिकांश मध्ययुगीन लातीनी पांडुलिपियों से काट दिया गया था—लगभग निश्चित रूप से इसलिए कि इस खंड में सिखाया गया है कि दंडितों के लिए की गई मध्यस्थता स्वीकार नहीं होती, जिसे बाद की मसीही भक्ति-परंपरा ने कठिन पाया। इसी कारण यह वुल्गाता और 1611 के किंग जेम्स संस्करण में नहीं था; उनमें 7:35 के तुरंत बाद वह पद आता था जिसे पुराने संस्करण लगभग सत्तर पद आगे 7:36 गिनते थे। रॉबर्ट बेंस्ली ने 1875 में एक स्पेनी पांडुलिपि से इस अंश को फिर खोजा, और अब इसे सभी आधुनिक आलोचनात्मक संस्करणों में पुनः स्थापित किया गया है।
    reason: recovered_fragment
  - marker: b
    text: या, ‘तब यातना की झील प्रकट होगी।’
    reason: previous_rendering
lexical_decisions:
- source_word: lacus tormenti
  choice: यातना की झील
  rationale: लातीनी ‘lacus’ का मूल अर्थ ‘झील’ है; इसलिए अंग्रेज़ी परामर्श-पाठ के ‘pit’ के बजाय स्रोत के अधिक निकट अनुवाद चुना गया।
- source_word: locus requietionis
  choice: विश्राम का स्थान
  rationale: यह सीधा, स्वाभाविक और अर्थगत विरोध—यातना बनाम विश्राम—को बनाए रखता है।
- source_word: clibanus gehennae
  choice: गेहन्ना की भट्ठी
  rationale: ‘clibanus’ को ‘भट्ठी’ और विशिष्ट स्थाननाम ‘Gehenna’ को ‘गेहन्ना’ रखा गया, ताकि इसे सामान्य शब्द ‘नरक’ में मिलाकर इसकी अलग छवि न मिटे।
- source_word: iucunditatis paradisus
  choice: आनंद का परादीस
  rationale: ‘परादीस’ मूल धार्मिक-साहित्यिक संज्ञा की विशिष्टता बनाए रखता है और ‘आनंद’ उसके सुखद स्वरूप को व्यक्त करता है।
theological_decisions:
- issue: दंड और विश्राम के स्थानों का आमने-सामने रखा जाना
  choice: दोनों बार ‘उसके सामने’
  alternative: ‘उसके विपरीत’
  rationale: ‘contra’ स्थानगत आमने-सामने होने और वैचारिक विरोध, दोनों का संकेत दे सकता है। ‘सामने’ दृश्य विन्यास को स्वाभाविक हिंदी में रखता है, जबकि वाक्य का विरोध स्वयं स्पष्ट रहता है।
- issue: Gehenna का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: विशिष्ट नाम को बनाए रखने से पाठ की छवि और संभावित अर्थगत भेद सुरक्षित रहता है; किसी विशेष परंपरा की नरक-संबंधी व्याख्या आरोपित नहीं होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आरंभिक ‘और’ लातीनी ‘Et’ तथा मूल में सुरक्षित बहुसंयोजक लय को बनाए रखता है। उपलब्ध कराए गए लातीनी उद्धरण का दृश्य पाठ ‘et clibanus’ पर कट जाता है; पद का उत्तरार्ध अंग्रेज़ी के परीक्षित परामर्श-पाठ और उद्धृत बेंस्ली परंपरा के अनुरूप प्रस्तुत किया गया है।
