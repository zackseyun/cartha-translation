id: 2ES.7.28
reference: 2 Esdras 7:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: revelabitur enim Filius meus Iesus cum his qui cum eo, et iucundabit qui relicti sunt annis quadringentis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/028.yaml
  text: For my son Jesus will be revealed with those who are with him[a][b], and he will make glad those who remain for four hundred years.
translation:
  language: hi
  text: क्योंकि मेरा पुत्र यीशु जो उसके साथ हैं, उन लोगों के साथ प्रकट होगा[a][b], और वह बचे हुए लोगों को चार सौ वर्ष तक आनन्द देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी में ‘चार सौ वर्ष तक’ अवधि मुख्य क्रिया ‘आनन्द देगा’ के साथ है; अर्थात वह बचे हुए लोगों को चार सौ वर्ष तक आनन्द देगा।
    reason: कालावधि के वाक्य-संबंध को स्पष्ट करना, बिना सक्रिय क्रिया का अर्थ बदले।
  - marker: b
    text: 'इस अंश के लातीनी पाठ में एक ध्यान देने योग्य शब्दावली-अंतर है: 7:28 में filius meus Iesus (‘मेरा पुत्र यीशु’) है, जबकि 7:29 में filius meus Christus (‘मेरा पुत्र मसीह’) है। इस अंश में चार सौ वर्ष की अवधि, फिर मसीह की मृत्यु, उसके बाद आदि-सृष्टि जैसा सात दिन का मौन, और तब पुनरुत्थान का वर्णन है। यह आरम्भिक यहूदी प्रकाशन-साहित्य के सबसे उल्लेखनीय मसीह-संबंधी अंशों में से एक है।'
    reason: 7:28 के ‘यीशु’ और निकटवर्ती 7:29 के ‘मसीह’ के जानबूझकर असमन्वित प्रयोग को सुरक्षित रखना।
lexical_decisions:
- source_word: revelabitur
  choice: प्रकट होगा
  rationale: लातीनी भविष्यत् कर्मवाच्य का सीधा और स्वाभाविक हिन्दी रूप; यह केवल जन्म या आगमन नहीं, बल्कि प्रकट किए जाने/दिखाई देने का भाव रखता है।
- source_word: Filius meus Iesus
  choice: मेरा पुत्र यीशु
  rationale: पाठ में स्पष्ट नाम Iesus है; अगले पद के Christus से इसे मिलाकर एक नहीं किया गया।
- source_word: cum his qui cum eo
  choice: उन लोगों के साथ जो उसके साथ हैं
  rationale: मूल की पुनरुक्ति को बनाए रखा गया है; इसमें उसके साथियों की पहचान अनिर्दिष्ट रहती है।
- source_word: iucundabit
  choice: आनन्दित करेगा
  rationale: 'क्रिया के कारणवाचक अर्थ को रखा गया है: पुत्र बचे हुए लोगों को आनन्द देता है।'
- source_word: qui relicti sunt
  choice: बचे हुए लोगों को
  rationale: शाब्दिक अर्थ ‘जो छोड़ दिए गए/बचे रह गए हैं’; प्रसंग में स्वाभाविक हिन्दी के लिए ‘बचे हुए लोग’ चुना गया।
- source_word: annis quadringentis
  choice: चार सौ वर्ष तक
  rationale: कालावधि को मुख्य क्रिया के साथ जोड़ा गया है, जिससे चार सौ वर्षों तक आनन्दित करने का अर्थ निकलता है; कठिन लातीनी वाक्य-विन्यास की वैकल्पिक समझ पादटिप्पणी में दी गई है।
theological_decisions:
- issue: पद 7:28 में Iesus और अगले पद में Christus का भेद
  choice: यहाँ ‘यीशु’ का स्पष्ट अनुवाद किया गया और पाठगत भेद को पादटिप्पणी में सुरक्षित रखा गया।
  alternative: दोनों पदों में ‘मसीह’ करना या ‘यीशु मसीह’ लिखना।
  rationale: ऐसा सामंजस्य मूल लातीनी पाठ के उल्लेखनीय शब्द-भेद को मिटा देता।
- issue: चार सौ वर्षों का सम्बन्ध
  choice: इसे पुत्र द्वारा बचे हुओं को आनन्दित करने की अवधि माना गया।
  alternative: इसे बचे रहने वाले लोगों की अवधि मानना, या ‘बचे हुए लोग चार सौ वर्ष आनन्द मनाएँगे’ पढ़ना।
  rationale: annis quadringentis अवधि सूचित कर सकता है, जबकि उपलब्ध लातीनी वाक्य-विन्यास असामान्य है; मुख्य पाठ में सर्वाधिक सुसंगत अर्थ और पादटिप्पणी में विकल्प दिया गया।
- issue: मसीही राज्य और बाद की घटनाओं का अर्थ
  choice: केवल पाठ में कही गई समयरेखा का उल्लेख किया गया, बिना किसी सम्प्रदायगत पहचान या अन्त-कालीन प्रणाली के।
  alternative: इसे किसी विशिष्ट सहस्राब्दीवादी या अन्य सम्प्रदायगत योजना से जोड़ना।
  rationale: पाठ से आगे जाकर निजी या सम्प्रदायगत सिद्धान्त आरोपित नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप रखा गया है। ‘आनन्दित करेगा’ सामान्य पाठक के लिए स्पष्ट है और iucundabit का कारणवाचक बल बचाता है। मुख्य पाठ प्रवाहपूर्ण है, जबकि असामान्य लातीनी व्याकरण और कालावधि की सम्भावित वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
