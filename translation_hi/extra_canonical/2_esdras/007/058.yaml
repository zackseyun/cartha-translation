  yaml_path: translation/extra_canonical/2_esdras/007/058.yaml
  text: And I said[a], “O Lord, ruler, what is more abundant is of less value[b], for what is rarer is more precious.”
translation:
  language: hi
  text: और मैंने कहा, “हे शासक, हे प्रभु, जिसकी मात्रा अधिक होती है, उसका मूल्य कम होता है, क्योंकि जो अधिक दुर्लभ होता है, वह अधिक बहुमूल्य होता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: हे प्रभु, हे शासक
  rationale: दोनों संबोधनात्मक उपाधियों को अलग-अलग रखते हुए लैटिन की पुनरुक्त, औपचारिक संबोधन-शैली सुरक्षित रखी गई है।
- source_word: quod abundat
  choice: जो अधिक मात्रा में होता है
  rationale: abundat की प्रचुरता और अगले तुलनात्मक पद rarius के साथ उसके विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: uilius
  choice: उसका मूल्य कम होता है
  rationale: यहाँ व्यापारिक ‘सस्ता’ की अपेक्षा मूल्य या महत्त्व में कमी का व्यापक अर्थ संदर्भ के अधिक अनुकूल है।
- source_word: rarius pretiosius
  choice: जो अधिक दुर्लभ होता है, वह अधिक बहुमूल्य होता है
  rationale: दोनों तुलनात्मक रूपों को स्पष्ट रूप से बनाए रखते हुए सूक्ति का संतुलित विरोध सुरक्षित रखा गया है।
theological_decisions:
- issue: dominator domine में दो ईश्वरीय उपाधियों का संबंध
  choice: हे प्रभु, हे शासक
  alternative: हे प्रभु परमेश्वर / हे सार्वभौम प्रभु
  rationale: स्रोत में उपस्थित दोनों अलग संबोधनात्मक संज्ञाओं को बिना किसी विशिष्ट धर्मवैज्ञानिक समानीकरण के प्रत्यक्ष रूप से रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी; वाक्य की सूक्तिपरक समानांतर रचना और तुलनात्मक बल को सुरक्षित रखा गया है।
