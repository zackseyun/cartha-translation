source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'gehennae ostendetur, et contra eum iocunditatis paradisus. Et dicet tunc Altissimus ad excitatas gentes : uidete et intellegite quem negastis, uel cui non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/037.yaml
  text: And then the Most High will say to the awakened nations[a], “Look and understand whom you denied, or whom you did not serve, or whose ways you despised.
translation:
  language: hi
  text: और तब परमप्रधान जाग उठी हुई जातियों[a] से कहेगा, “देखो और समझो कि तुमने किसका इनकार किया, किसकी सेवा नहीं की, और किसके मार्गों को तुच्छ समझा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुनर्जीवित की गई जातियाँ।”
    reason: लैटिन excitatas का मूल अर्थ जागृत या जगाई हुई है; संदर्भ में इसे पुनरुत्थान के अर्थ में भी समझा जा सकता है।
lexical_decisions:
- source_word: Altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का अर्थ और गरिमापूर्ण धार्मिक शैली दोनों सुरक्षित रहते हैं।
- source_word: excitatas gentes
  choice: जगाई गई जातियाँ
  rationale: excitatas का मूल जागने-जगाने का बिंब है; यह निकटवर्ती पुनरुत्थान और न्याय के संदर्भ में निष्क्रिय भाव को भी बनाए रखता है।
- source_word: uidete et intellegite
  choice: देखो और समझो
  rationale: दोनों समन्वित आज्ञार्थक क्रियाओं को सीधे और स्वाभाविक हिंदी में अलग-अलग रखा गया है।
- source_word: quem negastis
  choice: तुमने किसका इनकार किया
  rationale: quem को व्यक्ति-सूचक ‘किसका’ और negastis को उसके सीधे अर्थ ‘इनकार किया’ से व्यक्त किया गया है।
theological_decisions:
- issue: excitatas में जागरण और पुनरुत्थान का संबंध
  choice: मुख्य पाठ में ‘जगाई गई’
  alternative: ‘जिलाई गई’
  rationale: मुख्य पाठ लैटिन के जागने-जगाने वाले रूपक को स्पष्ट रखता है और उसे केवल शारीरिक पुनरुत्थान तक सीमित नहीं करता; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: तीन आरोपों का संबंध
  choice: हिंदी में ‘कि... किसकी... और किसके...’ के रूप में समानांतर प्रश्नसूचक संरचना
  alternative: हर खंड से पहले ‘या’ रखना
  rationale: यह सामान्य हिंदी में अधिक सहज है और इनकार, सेवा न करने तथा मार्गों को तुच्छ जानने—तीनों आरोपों को बिना किसी धर्मवैज्ञानिक समानीकरण के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक वाचन के योग्य शैली। ‘परमप्रधान’ पारंपरिक धार्मिक उपाधि है, जबकि शेष वाक्यरचना सामान्य पाठक के लिए सीधी रखी गई है।
