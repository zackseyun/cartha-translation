  text: न बादल, न गर्जन, न बिजली, न हवा, न पानी,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nubem
  choice: बादल
  rationale: लैटिन संज्ञा का सहज और सीधा आधुनिक हिन्दी समतुल्य।
- source_word: tonitruum
  choice: गर्जन
  rationale: यह मेघ-गर्जन अथवा गरज की ध्वनि को व्यक्त करता है; सूची की संक्षिप्त शैली के लिए ‘गर्जन’ उपयुक्त है।
- source_word: coruscationem
  choice: बिजली
  rationale: प्रसंग में आकाशीय चमक या विद्युत्-दीप्ति अभिप्रेत है; सामान्य पाठक के लिए ‘बिजली’ स्वाभाविक है।
- source_word: uentum
  choice: हवा
  rationale: ‘वायु’ की अपेक्षा अधिक सहज आधुनिक शब्द, जबकि अर्थ ‘wind’ सुरक्षित रहता है।
- source_word: aquam
  choice: पानी
  rationale: सामान्य और स्पष्ट हिन्दी समतुल्य; सूची के प्राकृतिक प्रवाह से मेल खाता है।
