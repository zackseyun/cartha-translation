  yaml_path: translation/extra_canonical/2_esdras/007/073.yaml
  text: They have defrauded her whom they received. And what will they have to say in the judgment[a], or how will they answer in the last times?
translation:
  language: hi
  text: उन्होंने उसे धोखा दिया है, जिसे उन्होंने प्राप्त किया था। और न्याय में उनके पास कहने को क्या होगा, या अंतिम समयों में वे कैसे उत्तर देंगे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fraudauerunt
  choice: धोखा दिया है
  rationale: यह क्रिया छल या विश्वासघात करने का भाव व्यक्त करती है; वर्तमान परिणाम का संकेत देने के लिए पूर्ण पक्ष रखा गया है।
- source_word: eam quam acceperunt
  choice: उसे, जिसे उन्होंने ग्रहण किया था
  rationale: लैटिन के स्त्रीलिंग सर्वनाम को बिना अस्पष्ट पूर्वपद की पहचान तय किए सर्वनाम के रूप में बनाए रखा गया है; ‘ग्रहण किया’ acceperunt के औपचारिक भाव को दर्शाता है।
- source_word: Et quid habebunt dicere
  choice: और ... उनके पास कहने को क्या होगा
  rationale: Et को उसके सामान्य संयोजक अर्थ ‘और’ में रखा गया है और habebunt dicere की भावी अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: in iudicio
  choice: न्याय के समय
  rationale: यह न्यायिक निर्णय के अवसर को सूचित करता है; केवल स्थानवाचक ‘न्याय में’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है।
- source_word: in novissimis temporibus
  choice: अन्तिम समयों में
  rationale: बहुवचन ‘समयों’ को बनाए रखा गया है और युगान्त-संबंधी अभिव्यक्ति को किसी विशेष धर्मवैज्ञानिक प्रणाली के अनुसार सीमित नहीं किया गया।
theological_decisions:
- issue: eam के पूर्वपद की पहचान
  choice: ‘उसे’ के रूप में अस्पष्टता बनाए रखी
  alternative: पूर्वपद को अनुमान से ‘व्यवस्था’, ‘जीवन’ या किसी स्त्रीवाचक संज्ञा के रूप में स्पष्ट करना
  rationale: दिए गए अंश में पूर्वपद उपस्थित नहीं है; उसकी पहचान जोड़ना स्रोत से आगे जाना होता।
- issue: in iudicio का आशय
  choice: ‘न्याय के समय’
  alternative: ‘न्याय में’ या ‘दण्ड के समय’
  rationale: ‘न्याय’ मूल के व्यापक न्यायिक और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है तथा परिणाम को पहले से ‘दण्ड’ नहीं मानता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की समांतर प्रश्नात्मक संरचना और आरम्भिक ‘और’ को सुरक्षित रखा गया है। उपलब्ध लैटिन अंश ‘uel quo-’ पर कटता है; शेष वाक्य के लिए दिए गए परीक्षित अंग्रेज़ी परामर्श-पाठ का सहारा लिया गया है।
