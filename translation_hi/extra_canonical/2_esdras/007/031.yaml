source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post dies septem, et excitabitur qui nondum vigilat saeculum et morietur corruptum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/031.yaml
  text: And after seven days, the age that is not yet awake will be awakened, and what is corrupt will die.
translation:
  language: hi
  text: और सात दिनों के बाद, वह युग जो अभी तक जागा नहीं है, जगाया जाएगा, और जो भ्रष्ट है वह मर जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: युग
  rationale: लातीनी शब्द यहाँ आने वाले काल या विश्व-युग को सूचित करता है; ‘युग’ मूल की व्यापकता और व्यक्तिकरण दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: excitabitur
  choice: जगाया जाएगा
  rationale: यह कर्मवाच्य रूप है; अनकहे कर्ता को जोड़े बिना मूल का भाव सुरक्षित रहता है।
- source_word: corruptum
  choice: जो भ्रष्ट है
  rationale: मूल में यह नपुंसकलिंग विशेषण संज्ञा की तरह प्रयुक्त है और किसी निश्चित संज्ञा को स्पष्ट नहीं करता; यह अनिश्चितता हिन्दी में भी रखी गई है।
- source_word: morietur
  choice: मर जाएगा
  rationale: यह मूल क्रिया का सीधा और स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: जगाए जाने वाले ‘युग’ का व्यक्तिकरण
  choice: ‘वह युग ... जगाया जाएगा’ के रूप में व्यक्तिकरण बनाए रखा गया।
  alternative: इसे ‘आने वाला संसार प्रकट होगा’ जैसे व्याख्यात्मक रूप में कहना।
  rationale: मूल पाठ saeculum को जागने वाली सत्ता के रूप में प्रस्तुत करता है; व्याख्यात्मक विस्तार इस असामान्य किंतु सार्थक रूपक को मिटा देता।
- issue: corruptum का संदर्भ
  choice: ‘जो भ्रष्ट है’ कहकर संदर्भ खुला रखा गया।
  alternative: ‘भ्रष्ट संसार’, ‘नश्वर शरीर’ या ‘भ्रष्ट वस्तुएँ’ कहना।
  rationale: लातीनी पाठ किसी संज्ञा को स्पष्ट नहीं करता, इसलिए किसी विशेष धर्मवैज्ञानिक संदर्भ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘अभी तक जागा नहीं है’ मूल nondum vigilat की कालगत सूक्ष्मता को स्पष्ट करता है; कर्मवाच्य ‘जगाया जाएगा’ मूल की संरचना बनाए रखता है।
