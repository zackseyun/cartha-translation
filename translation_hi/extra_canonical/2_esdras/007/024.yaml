id: 2ES.7.24
reference: 2 Esdras 7:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et legem eius spreverunt et sponsiones eius abnegaverunt et legitimis eius fidem non habuerunt et opera eius non perfecerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/024.yaml
  text: They despised his law and denied his promises[a], and they did not keep faith with his statutes and did not perform his works.
translation:
  language: hi
  text: उन्होंने उसकी व्यवस्था को तुच्छ जाना, उसके वादों[a] को नकार दिया, उसकी विधियों के प्रति विश्वासयोग्य नहीं रहे और उसके कामों को पूरा नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी वाचाओं को नकार दिया।”
    reason: अंग्रेज़ी POB audit trail में sponsiones के लिए दिया गया वैकल्पिक अनुवाद; मुख्य पाठ में स्रोत-संगत ‘वादों’ रखा गया है।
lexical_decisions:
- source_word: legem eius
  choice: उसकी व्यवस्था
  rationale: यहाँ lex divina के लिए हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्वाभाविक और अर्थ-सटीक है।
- source_word: sponsiones eius
  choice: उसके वादों
  rationale: sponsiones प्रतिज्ञाओं या आश्वासनों को सूचित करता है; इस ग्रंथ में वाचा के लिए प्रयुक्त विशिष्ट शब्दावली से इसे अलग रखते हुए ‘वादों’ चुना गया है।
- source_word: legitimis eius
  choice: उसकी विधियों
  rationale: legitima का आशय ठहराए हुए नियमों या विधानों से है; ‘विधियों’ इस बहुवचन कानूनी अर्थ को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: fidem non habuerunt
  choice: विश्वास नहीं किया
  rationale: लातीनी पदबंध का सीधा अर्थ विश्वास या भरोसा न रखना है; ‘विधियों पर विश्वास नहीं किया’ मूल की कुछ असामान्य किन्तु अर्थपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: opera eius non perfecerunt
  choice: उसके कामों को पूरा नहीं किया
  rationale: perficere में पूरा करने या संपन्न करने का भाव है; यह अनुवाद केवल ‘किया नहीं’ कहने की अपेक्षा उस पक्ष को सुरक्षित रखता है।
theological_decisions:
- issue: sponsiones को वादे या वाचाएँ समझना
  choice: वादों
  alternative: वाचाओं
  rationale: लातीनी sponsio प्रतिज्ञा/वादा बताता है, जबकि ‘वाचा’ के लिए सामान्यतः अलग शब्दावली अपेक्षित है; अतः यहाँ वादे अधिक स्रोत-संगत हैं।
- issue: opera eius का आशय
  choice: उसके कामों को पूरा नहीं किया
  alternative: उसकी आज्ञाओं के अनुसार काम नहीं किए
  rationale: मूल में opera eius ही है; व्याख्यात्मक रूप से इसे आज्ञापालन में बदलने के बजाय संभावित धर्मवैचारिक तनाव और अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और स्रोत-सन्निकट रूप। समानांतर चार क्रियात्मक खंड बनाए गए हैं; अनावश्यक व्याख्या या सांप्रदायिक शब्दावली नहीं जोड़ी गई।
