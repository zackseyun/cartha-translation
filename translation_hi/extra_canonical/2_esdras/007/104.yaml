  text: 'si fideles pro carissimis. [Et respondit ad me et dixit: quoniam inueniisti gratiam ante oculos meos, et hoc demonstrabo tibi: dies iudicii dies decretorius est, et omnibus signaculum ueritatis ostendet; quemadmodum enim non mittit pater filium, uel filius patrem, uel dominus seruum], uel fidus carissimum, ut pro'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/104.yaml
  text: 'And he answered me and said[a], “Because you have found favor before my eyes, I will show you this also: the day of judgment is a decisive day and will display to all the seal of truth. For just as a father does not send a son, or a son a father, or a master a servant, or a friend a beloved one[b], to speak on his behalf in the judgment'
translation:
  language: hi
  text: 'और उसने मुझे उत्तर दिया और कहा[a], “क्योंकि तुमने मेरी दृष्टि में अनुग्रह पाया है, इसलिए मैं तुम्हें यह भी दिखाऊँगा: न्याय का दिन निर्णय का दिन है, और वह सबको सत्य की मुहर प्रकट करेगा[b]। क्योंकि जैसे कोई पिता अपने पुत्र को, पुत्र अपने पिता को, स्वामी अपने सेवक को, या कोई मित्र अपने प्रियजन को न्याय में अपनी ओर से बोलने के लिए नहीं भेजता—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का एक भाग उस पुनःप्राप्त प्राचीन अंश से है जो अधिकांश मध्ययुगीन लैटिन पांडुलिपियों में नहीं मिलता। ये उदाहरण सामान्य जीवन की उन स्थितियों को सामने रखते हैं जिनमें एक व्यक्ति का दायित्व दूसरे को नहीं सौंपा जा सकता; इसी से अंतिम न्याय की तुलना की गई है।
    reason: recovered_fragment
  - marker: b
    text: 'पहले के एक अनुवाद में: “और वह सबके सामने सत्य की मुहर प्रकट करती है। क्योंकि जैसे अब कोई पिता…”'
    reason: previous_rendering
lexical_decisions:
- source_word: gratiam ante oculos meos
  choice: मेरी दृष्टि में अनुग्रह
  rationale: यह लैटिन मुहावरे के रूप और अर्थ दोनों को बनाए रखता है तथा आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: dies decretorius
  choice: निर्णय का दिन
  rationale: decretorius न्याय के अंतिम और निर्णायक स्वरूप को व्यक्त करता है; यह अनुवाद अनावश्यक व्याख्या जोड़े बिना उस बल को रखता है।
- source_word: signaculum ueritatis
  choice: सत्य की मुहर
  rationale: मूल रूपक को सीधे सुरक्षित रखा गया है; इसे केवल ‘सत्य’ या ‘सत्य का प्रमाण’ कहकर रूपक को समतल नहीं किया गया।
- source_word: dominus seruum
  choice: स्वामी अपने सेवक को
  rationale: dominus और servus के सामाजिक संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘दास’ की तुलना में ‘सेवक’ यहाँ सामान्य पाठक के लिए अधिक सहज है।
- source_word: fidus carissimum
  choice: कोई मित्र अपने प्रियजन को
  rationale: लैटिन पद संक्षिप्त और कुछ असामान्य है। परामर्श-पाठ के अनुसार संबंधपरक अर्थ रखा गया है, जबकि ‘प्रियजन’ carissimum की आत्मीयता को व्यक्त करता है।
- source_word: ostendet
  choice: प्रकट करेगा
  rationale: लैटिन भविष्यकाल को स्पष्ट रूप से भविष्यकाल में रखा गया है, न कि वर्तमानकाल में।
theological_decisions:
- issue: अंतिम न्याय में किसी दूसरे व्यक्ति द्वारा प्रतिनिधित्व की असंभवता
  choice: न्याय में अपनी ओर से बोलने के लिए नहीं भेजता
  alternative: अपनी ओर से मध्यस्थता करने के लिए नहीं भेजता
  rationale: ‘बोलने’ वाला रूप उपलब्ध खंडित लैटिन ut pro और परामर्श-पाठ के अधिक निकट है। ‘मध्यस्थता’ अधिक धर्मवैज्ञानिक अर्थ जोड़ सकती है, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
- issue: dies decretorius का बल
  choice: न्याय का दिन निर्णय का दिन है
  alternative: न्याय का दिन निर्णायक दिन है
  rationale: संज्ञात्मक पुनरुक्ति मूल लैटिन की गंभीर, घोषणात्मक शैली को बचाती है और यह संकेत देती है कि उस दिन निर्णय स्थिर होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य के अंत में दीर्घ विराम-चिह्न यह दर्शाता है कि उपलब्ध स्रोत-पंक्ति ‘ut pro’ पर अधूरी है और विचार आगे जारी रहता है। सभी मूल संबंधपरक उदाहरण क्रम से सुरक्षित रखे गए हैं।
