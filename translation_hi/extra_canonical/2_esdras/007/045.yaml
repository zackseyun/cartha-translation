  rationale: ‘ostendi’ को प्रथम पुरुष पूर्ण क्रिया के रूप में रखते हुए स्वाभाविक हिन्दी में वर्तमान-संबद्ध पूर्णता व्यक्त की गई है।
- source_word: respondi ... et dixi
