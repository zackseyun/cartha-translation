  rationale: लैटिन की युग्मित अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: tunc ... et nunc dico
  choice: मैंने तब भी कहा था और अब भी कहता हूँ
  rationale: ‘tunc’ और ‘nunc’ के अलंकारिक विरोध को स्पष्ट रखा गया है; अन्य प्राचीन भाषाई साक्ष्य भी इसी आशय का समर्थन करते हैं।
