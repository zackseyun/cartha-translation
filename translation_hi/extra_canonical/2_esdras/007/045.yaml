  choice: 'इसे वक्ता की पूर्व और वर्तमान बात के विरोध से जोड़ा गया: ‘मैंने तब भी कहा था और अब भी कहता हूँ’'
  alternative: ‘तब मैंने उत्तर दिया और कहा, “प्रभु, और अब मैं कहता हूँ’
