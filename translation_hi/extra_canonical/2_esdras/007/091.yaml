  text: 'sermo: Imprimis uident cum exultatione multa gloriam eius qui suscipit eas,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/091.yaml
  text: First[a], they see with great joy the glory of him who receives them.
translation:
  language: hi
  text: सबसे पहले,[a] वे बड़े आनन्द के साथ उसकी महिमा देखते हैं, जो उन्हें ग्रहण करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पुराने पाठ-विन्यास में आगे यह भी जोड़ा गया था: “क्योंकि वे सात श्रेणियों में विश्राम करेंगे”; परन्तु यह वाक्य स्रोत-पाठ में अगले पद से आरम्भ होता है।'
    reason: पूर्व प्रस्तुति और वर्तमान स्रोत-आधारित पद-विभाजन के अंतर को स्पष्ट करना।
lexical_decisions:
- source_word: Imprimis
  choice: सबसे पहले
  rationale: यह क्रम की पहली अवस्था को सूचित करता है; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: uident
  choice: देखते हैं
  rationale: लातीनी क्रिया का सीधा वर्तमानकालीन अर्थ सुरक्षित रखा गया है।
- source_word: cum exultatione multa
  choice: बड़े आनन्द के साथ
  rationale: तीव्र उल्लास का अर्थ सहज, गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: gloriam eius
  choice: उसकी महिमा
  rationale: संबंधवाचक संरचना और धर्मवैचारिक खुलापन दोनों बने रहते हैं।
- source_word: qui suscipit eas
  choice: जो उन्हें ग्रहण करता है
  rationale: suscipit के स्वागत/स्वीकार करने के भाव को औपचारिक किन्तु बोधगम्य हिन्दी में रखा गया है; eas का स्त्रीलिंग संदर्भ हिन्दी में 'उन्हें' से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: ‘उसकी’ और ‘जो’ का संदर्भ
  choice: स्रोत की तरह व्यक्तित्व को अनाम रखते हुए ‘उसकी…जो’
  alternative: स्पष्ट रूप से ‘परमेश्वर की महिमा, जो उन्हें ग्रहण करता है’
  rationale: लातीनी पाठ eius qui कहता है और नाम नहीं जोड़ता; अनुवाद में संदर्भ को धर्मवैचारिक व्याख्या द्वारा अधिक स्पष्ट नहीं किया गया।
- issue: अगले पद की पंक्ति को इस पद में शामिल करना
  choice: ‘क्योंकि वे सात श्रेणियों में विश्राम करेंगे’ को शामिल नहीं किया
  alternative: पूर्व प्रस्तुति के अनुसार उसे पद 91 के अंत में जोड़ना
  rationale: प्रदत्त लातीनी स्रोत में वह उपवाक्य पद 91 का भाग नहीं है और स्रोत-विभाजन के अनुसार पद 92 में आता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और स्रोत के निकट है। ‘ग्रहण करता है’ में स्वागत और स्वीकार—दोनों संभावित भाव खुले रहते हैं।
