  text: and Hezekiah for the people in the days of Sennacherib, and many for many?
translation:
  language: hi
  text: और क्या सनहेरीब के दिनों में हिजकिय्याह ने लोगों के लिए, और बहुतों ने बहुतों के लिए विनती की थी?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pro
  choice: के लिए मध्यस्थता की
  rationale: खंड के प्रश्नात्मक और उदाहरण-सूची वाले संदर्भ में लैटिन ‘pro’ का आशय किसी के पक्ष में विनती करना है; स्वाभाविक हिन्दी के लिए निहित क्रिया स्पष्ट की गई है।
- source_word: populo
  choice: लोगों
  rationale: सामान्य समूहवाचक अर्थ को आधुनिक, सहज हिन्दी में रखा गया है।
- source_word: in diebus Sennacherib
  choice: सनहेरीब के दिनों में
  rationale: काल-सूचक सेमिटिक शैली को गरिमापूर्ण और परिचित हिन्दी रूप में सुरक्षित रखा गया है।
- source_word: multi pro multis
  choice: बहुतों ने बहुतों के लिए
  rationale: मूल की जानबूझकर की गई पुनरावृत्ति और व्यापकता को बनाए रखा गया है।
theological_decisions:
- issue: ‘pro’ में निहित कार्य
  choice: मध्यस्थता करना
  alternative: के लिए होना/कार्य करना
  rationale: पद में क्रिया लुप्त है और पूर्ववर्ती उदाहरणों से समझी जाती है; ‘मध्यस्थता’ लोगों की ओर से की गई प्रार्थनापूर्ण विनती को व्यक्त करती है, बिना उसके प्रभाव के बारे में अतिरिक्त सिद्धांत जोड़ने के।
- issue: प्रश्न का बल
  choice: ‘नहीं की थी?’ वाला आलंकारिक प्रश्न
  alternative: साधारण ‘की थी?’
  rationale: लैटिन प्रश्न और उदाहरणों की शृंखला अपेक्षित सकारात्मक उत्तर की ओर संकेत करती है; हिन्दी में आलंकारिक बल स्वाभाविक ढंग से व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; बाइबलीय नामों के प्रचलित रूप ‘हिजकिय्याह’ और ‘सनहेरीब’ अपनाए गए हैं। वाक्य पिछले संदर्भ से जुड़ा खंड है, इसलिए आरंभिक ‘और’ सुरक्षित रखा गया है।
