  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid prodest, quoniam salutati saluabimur, si tormento tormentabimur? Omnes enim qui nati sunt, conmixti sunt iniquitatibus, et pleni sunt peccatis, et grauidi delictis;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/068.yaml
  text: What does it profit that we will be saved[a], if we will be tormented? For all who have been born are mixed with iniquities, and are full of sins and burdened with transgressions.
translation:
  language: hi
  text: इस बात से क्या लाभ कि हमारा उद्धार होगा[a], यदि हमें यातना दी जाएगी? क्योंकि जितने भी लोग जन्मे हैं, वे अधर्म से मिले-जुले, पापों से भरे और अपराधों से बोझिल हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “क्योंकि जितने भी लोग जन्मे हैं, वे अधर्म से मिले-जुले, पापों से भरे और अपराधों से लदे हुए हैं।”
    reason: अंग्रेज़ी POB audit trail में दिए गए previous_rendering नोट और उसके एंकर को हिंदी में सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: quid prodest
  choice: इस बात से क्या लाभ
  rationale: लाभ के विषय में पूछे गए आलंकारिक प्रश्न को स्वाभाविक और निकट हिंदी में रखा गया है।
- source_word: salutati saluabimur
  choice: हमारा उद्धार होगा
  rationale: पाठ के असामान्य रूप के बावजूद भावी निष्क्रिय अर्थ को सुरक्षित रखा गया है; लैटिन में स्पष्ट रूप से न दिए गए निश्चयवाचक बल को नहीं जोड़ा गया।
- source_word: tormento tormentabimur
  choice: हमें यातना दी जाएगी
  rationale: संज्ञा और उसी मूल की क्रिया वाले लैटिन प्रयोग को कृत्रिम हिंदी पुनरुक्ति के बिना भावी निष्क्रिय रूप में व्यक्त किया गया है।
- source_word: conmixti sunt iniquitatibus
  choice: अधर्म से मिले-जुले
  rationale: conmixti के मिश्रित होने के रूपक को बनाए रखा गया है और इसे अधिक व्याख्यात्मक ‘फँसे’ या ‘दूषित’ में नहीं बदला गया।
- source_word: pleni sunt peccatis
  choice: पापों से भरे
  rationale: मूल के परिपूर्णता-सूचक रूपक और बहुवचन को सीधे तथा सहज ढंग से व्यक्त करता है।
- source_word: grauidi delictis
  choice: अपराधों से बोझिल
  rationale: grauidi में निहित भारीपन के रूपक को सुरक्षित रखता है और delicta को peccata से अलग शब्द देता है।
theological_decisions:
- issue: उद्धार और उसके बाद यातना के बीच कथन का तनाव
  choice: दोनों भावी निष्क्रिय कथनों को बिना सामंजस्य बैठाए यथावत रखा गया है।
  alternative: यातना को उद्धार से पहले की शुद्धि या केवल संभावित परिणाम के रूप में स्पष्ट करना।
  rationale: स्रोत स्वयं इस संबंध की व्याख्या नहीं करता; अनुवाद में किसी विशिष्ट धर्मवैज्ञानिक समाधान को जोड़ना उचित नहीं होगा।
- issue: salutati saluabimur और tormento tormentabimur में संभावित सामी बल
  choice: ‘निश्चय ही’ या ‘घोर’ जैसे तीव्रतासूचक शब्द नहीं जोड़े गए।
  alternative: ‘हम निश्चय ही बचाए जाएँगे’ और ‘हमें घोर यातना दी जाएगी’।
  rationale: उपलब्ध लैटिन पाठ में ऐसे बल को अनिवार्य करने वाला स्पष्ट स्वतंत्र शब्द नहीं है; अतः अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘उद्धार’, ‘यातना’, ‘अधर्म’, ‘पाप’ और ‘अपराध’ पाठ के गंभीर धार्मिक और प्रलय-विषयक स्वर को बनाए रखते हैं।
