  yaml_path: translation/extra_canonical/2_esdras/007/019.yaml
  text: And he said to me[a], “You are not a judge over the Lord, nor one who understands over the Most High.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “तुम न तो प्रभु से बढ़कर न्यायाधीश हो, न परमप्रधान से अधिक समझदार।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudex super Dominum
  choice: प्रभु से बढ़कर न्याय करनेवाले
  rationale: यहाँ super को तुलनात्मक अर्थ में लिया गया है। इससे प्रभु के न्याय की तुलना में मनुष्य के न्याय की सीमा स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: intellegens super Altissimum
  choice: परमप्रधान से अधिक समझ रखनेवाले
  rationale: समानांतर दूसरे खंड में super का वही तुलनात्मक अर्थ रखा गया है; intellegens को संज्ञात्मक भाव के साथ सहज हिन्दी में व्यक्त किया गया है।
- source_word: Altissimum
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त पारंपरिक और अर्थ-सटीक हिन्दी उपाधि है।
theological_decisions:
- issue: दोनों बार आए super का अर्थ
  choice: 'दोनों खंडों में तुलनात्मक अर्थ: ‘से बढ़कर/से अधिक’'
  alternative: 'अधिकार-सूचक अर्थ: ‘प्रभु के ऊपर न्यायाधीश’ और ‘परमप्रधान के ऊपर समझ रखनेवाला’'
  rationale: दोनों समानांतर खंड मनुष्य की योग्यता की तुलना प्रभु और परमप्रधान से करते प्रतीत होते हैं। तुलनात्मक अनुवाद समानांतरता तथा कथन का आशय स्पष्ट रखते हुए किसी अतिरिक्त साम्प्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘न तो…न…’ से लैटिन neque की नकारात्मक समानांतर संरचना सुरक्षित रखी गई है।
