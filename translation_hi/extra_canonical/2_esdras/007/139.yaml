source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et iudex, si non ignoverit his qui creati sunt verbo eius et deleverit multitudinem contemptionum, non fortassis derelinquenturinnumerabilem multitudinem nisi pauci valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/139.yaml
  text: And if the Judge did not forgive those who were created by his word and blot out the multitude of acts of contempt[b][a], perhaps only a very few would be left from an innumerable multitude.
translation:
  language: hi
  text: और यदि न्यायाधीश उन लोगों को क्षमा न करे, जो उसके वचन से सृजे गए हैं, और तिरस्कार के असंख्य कृत्यों को मिटा न दे, तो शायद उस अनगिनत जनसमूह में से केवल बहुत थोड़े ही बचे रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudex
  choice: न्यायाधीश
  rationale: यह पद न्याय करने वाले व्यक्ति को सूचित करता है; ‘न्यायी’ कहने से केवल धार्मिकता का गुण समझा जा सकता है।
- source_word: verbo eius
  choice: उसके वचन से
  rationale: करणवाचक Latin ablative को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: contemptionum
  choice: तिरस्कार के ... कृत्यों
  rationale: यह सामान्य पाप या अपराध से अधिक स्पष्ट रूप से तिरस्कार, उपेक्षा अथवा उद्दंड अवज्ञा का भाव रखता है।
- source_word: innumerabilem multitudinem
  choice: अनगिनत जनसमूह
  rationale: मूल में संख्या से परे विशाल समुदाय का बोध है; ‘जनसमूह’ मनुष्यों के संदर्भ को स्पष्ट रखता है।
- source_word: pauci valde
  choice: बहुत थोड़े
  rationale: Latin में ‘अत्यंत कम’ का बल है, जिसे सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: क्षमादान और तिरस्कार के कृत्यों को मिटाने का संबंध
  choice: दोनों क्रियाओं को एक ही नकारात्मक शर्त के अंतर्गत रखा गया
  alternative: पहली क्रिया को नकारात्मक और दूसरी को सकारात्मक पढ़ना
  rationale: Latin ‘si non ignoverit ... et deleverit’ का आशय प्रसंग और परिणाम के अनुसार यह है कि यदि न्यायाधीश क्षमा न करे और मिटा न दे, तो बहुत थोड़े बचेंगे; हिन्दी में साझा नकार को स्पष्ट करना आवश्यक है।
- issue: आरंभिक et iudex की वाक्यरचना
  choice: ‘और यदि न्यायाधीश...’
  alternative: ‘और वह न्यायाधीश है; यदि वह...’
  rationale: उपलब्ध Latin पाठ संक्षिप्त और कुछ असमतल है। अंग्रेज़ी परामर्श-पाठ के अनुरूप iudex को शर्तीय उपवाक्य का कर्ता माना गया है, पर कारणवाचक ‘क्योंकि’ मूल पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘सृजे गए’ सृष्टि-संबंधी प्रसंग को संक्षेप में व्यक्त करता है; ‘केवल बहुत थोड़े ही’ मूल के प्रबल अल्पसंख्या-बोध को बनाए रखता है।
