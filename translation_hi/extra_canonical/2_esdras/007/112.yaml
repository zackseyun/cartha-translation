  yaml_path: translation/extra_canonical/2_esdras/007/112.yaml
  text: And he answered me and said[a], “The present age is not the end; glory does not remain in it continually. Therefore those who were able prayed for the weak.
translation:
  language: hi
  text: और उसने मुझे उत्तर दिया, “वर्तमान युग अन्त नहीं है; उसमें महिमा निरन्तर नहीं बनी रहती।[a] इसी कारण जो समर्थ थे, उन्होंने निर्बलों के लिए प्रार्थना की।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें महिमा प्रायः नहीं बनी रहती।”
    reason: Latin frequens का अधिक शाब्दिक अर्थ ‘प्रायः/अक्सर’ भी सम्भव है; शब्दक्रम निषेध के सही दायरे को स्पष्ट करता है।
lexical_decisions:
- source_word: praesens saeculum
  choice: वर्तमान युग
  rationale: यह युग-संबंधी और युगान्तकारी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: finis
  choice: अन्त
  rationale: सन्दर्भ में वर्तमान युग के अन्त अथवा चरम परिणति का संकेत है; मूल की संक्षिप्तता बनाए रखी गई है।
- source_word: gloria
  choice: महिमा
  rationale: धार्मिक और युगान्तकारी सन्दर्भ में Latin gloria का सीधा, प्रतिष्ठित हिन्दी समतुल्य।
- source_word: non frequens manet
  choice: निरन्तर बनी नहीं रहती
  rationale: frequens यहाँ स्थायी अथवा लगातार बने रहने के अभाव को सूचित कर सकता है; manet के लिए 'बनी रहती' स्वाभाविक है। 'प्रायः' वाला शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: qui potuerunt
  choice: जो समर्थ थे
  rationale: potuerunt की क्षमता को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है, बिना क्षमता के प्रकार को अनावश्यक रूप से निश्चित किए।
- source_word: invalidis
  choice: निर्बलों
  rationale: शारीरिक अक्षमता तक अर्थ सीमित किए बिना कमज़ोर अथवा असमर्थ लोगों का व्यापक अर्थ बनाए रखता है।
theological_decisions:
- issue: वर्तमान युग और अन्त का सम्बन्ध
  choice: “वर्तमान युग अन्त नहीं है”
  alternative: “यह वर्तमान संसार अन्त नहीं है”
  rationale: saeculum को 'युग' कहना कालगत और युगान्तकारी तनाव को बनाए रखता है; 'संसार' इसे केवल स्थानगत अर्थ दे सकता है।
- issue: frequens का अर्थ
  choice: “निरन्तर”
  alternative: “प्रायः”
  rationale: सन्दर्भ वर्तमान युग की अस्थिर महिमा और आने वाली परिणति के बीच भेद करता प्रतीत होता है। फिर भी Latin frequens का 'अक्सर/प्रायः' अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज धार्मिक गद्य। वाक्य-संरचना मूल Latin के तर्कक्रम को बनाए रखती है, जबकि ‘जो समर्थ थे’ और ‘निर्बलों’ जैसे पद सामान्य पाठक के लिए स्पष्ट रखे गए हैं।
