  text: And he said to me, “Rise, Ezra, and hear the words that I have come to speak to you.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “उठ, एज्रा, और वे वचन सुन जो मैं तुझसे कहने आया हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: surge
  choice: उठ
  rationale: लातिनी आज्ञार्थक क्रिया का सीधा, स्वाभाविक और एकवचन संबोधन सुरक्षित रखता है।
- source_word: sermones
  choice: वचनों
  rationale: यहाँ बोले जाने वाले संदेश या कथनों का बोध है; ‘वचन’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में स्वाभाविक है।
- source_word: veni loqui ad te
  choice: जिन्हें सुनाने के लिए मैं तेरे पास आया हूँ
  rationale: लातिनी अभिव्यक्ति के प्रयोजन और आगमन—दोनों को सहज हिन्दी में व्यक्त करता है; शाब्दिक ‘तुझसे बोलने’ की अपेक्षा संदर्भ में संदेश सुनाने का अर्थ अधिक स्वाभाविक है।
