base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/087.yaml
  text: The seventh way is greater than all the ways mentioned above[a], because they will waste away in confusion and be consumed in horrors and wither in fears, seeing the glory of the Most High, before whom they sinned while they lived[b], and before whom they will begin to be judged in the last times.
translation:
  language: hi
  text: सातवाँ मार्ग ऊपर बताए गए सभी मार्गों से बढ़कर है[a], क्योंकि वे उलझन में क्षीण होते जाएँगे, आतंक के बीच नष्ट हो जाएँगे और डर के मारे मुरझा जाएँगे, परमप्रधान की महिमा को देखते हुए, जिसके सामने उन्होंने जीवित रहते हुए पाप किया था[b], और जिसके सामने अंतिम समयों में उनका न्याय आरम्भ होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के कई शब्द लैटिन पाठ-परंपरा में कठिन या संदिग्ध हैं। फिर भी मुख्य आशय पर्याप्त स्पष्ट है: दुष्ट लोग परमप्रधान की उस महिमा के सामने आने पर अत्यन्त कठोर व्यथा सहेंगे, जिसके सामने उन्होंने पाप किया था।'
    reason: textual_variant
  - marker: b
    text: 'वाक्य को इस प्रकार भी विराम दिया जा सकता है: “सातवाँ मार्ग, ऊपर बताए गए सभी मार्गों से बढ़कर: वे उलझन में क्षीण होते जाएँगे, आतंक के बीच नष्ट हो जाएँगे और डर के मारे मुरझा जाएँगे, क्योंकि वे परमप्रधान की महिमा देखेंगे—उसके सामने उन्होंने जीवित रहते हुए पाप किया था और उसी के सामने अंतिम समयों में उनका न्याय आरम्भ होगा।”'
    reason: previous_rendering
lexical_decisions:
- source_word: Septima uia
  choice: सातवाँ मार्ग
  rationale: ‘uia’ के मूल रूपक को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: maior
  choice: बढ़कर
  rationale: यहाँ तुलनात्मक अर्थ है—सातवाँ मार्ग पहले बताए मार्गों की अपेक्षा अधिक बड़ा या गंभीर है। ‘बढ़कर’ सामान्य हिन्दी में इस तुलना को स्पष्ट रखता है।
- source_word: detabescent in confusione
  choice: उलझन में घुलते जाएँगे
  rationale: भविष्यकाल तथा धीरे-धीरे क्षीण होने के चित्रात्मक भाव को बनाए रखा गया है; ‘confusio’ को बिना अनावश्यक रूप से ‘लज्जा’ में बदलने के ‘उलझन’ कहा गया है।
- source_word: consumentur in horroribus
  choice: भयावहताओं में नष्ट हो जाएँगे
  rationale: ‘horroribus’ का अर्थ आतंक या भयावह अनुभव है, ‘लज्जा’ नहीं; ‘नष्ट हो जाएँगे’ लैटिन के निष्क्रिय भविष्यकाल को व्यक्त करता है।
- source_word: maerescent/marcescent in timoribus
  choice: डर के मारे मुरझा जाएँगे
  rationale: पाठ का रूप कुछ विकृत है, पर साक्ष्य क्षीण या मुरझाने के भाव की ओर संकेत करता है; हिन्दी मुहावरा भय और क्षय दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: gloriam Altissimi
  choice: परमप्रधान की महिमा
  rationale: यह स्थापित, सुबोध और स्रोत के उच्च ईश्वर-संबंधी पद को सटीक रूप से व्यक्त करने वाला अनुवाद है।
- source_word: incipient iudicari
  choice: उनका न्याय आरम्भ होगा
  rationale: ‘incipient’ के आरम्भ होने के अर्थ को छोड़ा नहीं गया और निष्क्रिय न्याय-क्रिया को स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: सातवें मार्ग की अपेक्षात्मक गंभीरता
  choice: ‘सभी मार्गों से बढ़कर’
  alternative: ‘सभी मार्गों से बड़ा’
  rationale: ‘बढ़कर’ मात्रा से अधिक गंभीरता और तीव्रता का संकेत देता है, पर कोई अतिरिक्त दार्शनिक श्रेणी आरोपित नहीं करता।
- issue: परमप्रधान की महिमा के सामने पाप और न्याय
  choice: दोनों उपवाक्यों को समान ‘जिसके सामने’ संरचना में रखा गया
  alternative: दूसरे उपवाक्य को स्वतंत्र न्याय-वाक्य बनाना
  rationale: यह स्रोत की पुनरुक्त संरचना और पाप किए जाने तथा न्याय होने के बीच के धर्मवैचारिक तनाव को बनाए रखता है।
- issue: न्याय का समय
  choice: ‘अंतिम समयों में’
  alternative: ‘अन्त के समय में’
  rationale: बहुवचन लैटिन अभिव्यक्ति का स्वर सुरक्षित रखा गया है और उसे किसी विशिष्ट सांप्रदायिक अंत-काल क्रम में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण लेकिन सामान्य पाठक के लिए सुबोध स्तर रखा गया है। भविष्यकाल के तीनों क्रमिक क्रियाचित्र सुरक्षित हैं। ‘भयावहताओं’ कुछ असामान्य होते हुए भी लैटिन बहुवचन horroribus का अर्थ स्पष्ट रखता है और उसे गलत रूप से ‘लज्जा’ नहीं बनाता। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
