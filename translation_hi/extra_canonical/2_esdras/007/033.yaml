source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et revelabitur Altissimus super sedem iudicii, et pertransibunt misericordiae, et longanimitas congregabitur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/033.yaml
  text: And the Most High will be revealed upon the seat of judgment[a], and mercies will pass away, and long-suffering will be gathered up,
translation:
  language: hi
  text: और परमप्रधान न्याय के सिंहासन पर प्रकट होगा; दयाएँ बीत जाएँगी, और सहनशीलता समेट ली जाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “इकट्ठी की जाएगी”; यहाँ आशय “हटा ली जाएगी” भी हो सकता है।'
    reason: लैटिन congregabitur सीधे संग्रह किए जाने को व्यक्त करता है, जबकि इस प्रलयकालीन संदर्भ में उसका अर्थ वापस ले लिया जाना भी हो सकता है।
lexical_decisions:
- source_word: Altissimus
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त इस लैटिन उपाधि का प्रचलित, गरिमापूर्ण और अर्थ-सटीक हिन्दी रूप है।
- source_word: sedem iudicii
  choice: न्याय के सिंहासन
  rationale: sedes का मूल अर्थ आसन है, पर न्याय और परमप्रधान के संदर्भ में ‘सिंहासन’ स्वाभाविक रूप से राजकीय तथा न्यायिक भाव दोनों व्यक्त करता है।
- source_word: misericordiae
  choice: दयाएँ
  rationale: लैटिन में बहुवचन को बनाए रखा गया है। हिन्दी में यह कुछ काव्यात्मक है, पर ‘दया समाप्त हो जाएगी’ कहने की अपेक्षा स्रोत की व्याकरणिक बनावट और उसकी तीव्रता को अधिक निकटता से सुरक्षित रखता है।
- source_word: longanimitas
  choice: सहनशीलता
  rationale: यह दीर्घकाल तक सहने और दंड रोककर रखने के भाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: congregabitur
  choice: समेट ली जाएगी
  rationale: शाब्दिक ‘इकट्ठी की जाएगी’ से अधिक स्वाभाविक रहते हुए ‘एकत्र करने’ की मूल छवि और प्रसंग में उसके हटा लिए जाने के भाव, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: न्याय के समय दया और सहनशीलता का अंत
  choice: स्रोत के तीखे कथन को ‘दयाएँ जाती रहेंगी’ और ‘सहनशीलता समेट ली जाएगी’ के रूप में यथावत रखा गया है।
  alternative: इसे स्पष्ट करके ‘दया पाने का अवसर समाप्त हो जाएगा’ कहना।
  rationale: वैकल्पिक रूप संभावित आशय बताता है, पर स्रोत में निहित दया के बहुवचन और सहनशीलता के समेटे जाने की छवि को व्याख्यात्मक ढंग से सीमित कर देता है।
- issue: congregabitur में संग्रह या वापसी का भाव
  choice: मुख्य पाठ में ‘समेट ली जाएगी’ रखा गया है।
  alternative: ‘इकट्ठी की जाएगी’ या ‘हटा ली जाएगी’।
  rationale: ‘समेट ली जाएगी’ मूल क्रिया की संग्रह-छवि और अंततः उपलब्ध न रहने के प्रसंगगत भाव के बीच की वास्तविक अर्थगत तनातनी को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शास्त्रीय किंतु सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। समांतर उपवाक्यों और भविष्यकाल को स्रोत के अनुरूप बनाए रखा गया है।
