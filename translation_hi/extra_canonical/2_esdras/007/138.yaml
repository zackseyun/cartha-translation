source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et donator, quoniam si non donaverit de bonitate sua, ut adleventur hii qui iniquitates fecerunt de suis iniquitatibus, non poterit decies millesima pars hominum vivificari,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/138.yaml
  text: And he is generous[a], because if he did not give from his goodness, so that those who have committed iniquities might be relieved of their iniquities, not even a ten-thousandth part of mankind could be made alive,
translation:
  language: hi
  text: और वह उदार है, क्योंकि यदि वह अपनी भलाई से यह न देता कि अधर्म करनेवालों के अधर्मों का बोझ हल्का हो सके[a], तो मनुष्यों का दस-हज़ारवाँ भाग भी जीवित नहीं किया जा सकता,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने अधर्मों से छुटकारा पाएँ।”
    reason: लातीनी adleventur ... de suis iniquitatibus को अधर्मों का बोझ हल्का होने या उनसे मुक्त होने—दोनों ढंग से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: donator
  choice: उदार
  rationale: लातीनी शब्द का मूल अर्थ ‘देनेवाला’ है; इस विधेयात्मक संदर्भ में ‘उदार’ स्वाभाविक हिन्दी है और आगे आनेवाले donaverit तथा bonitate के साथ देने की उदारता व्यक्त करता है।
- source_word: adleventur ... de suis iniquitatibus
  choice: उनके अधर्मों का बोझ हल्का किया जाए
  rationale: adleventur में हल्का किए जाने या बोझ घटाए जाने का भाव है। यह रूपक को बनाए रखता है और इसे सीधे ‘क्षमा’ कहकर अर्थ को संकीर्ण नहीं करता।
- source_word: decies millesima pars
  choice: दस-हज़ारवाँ भाग
  rationale: लातीनी संख्यात्मक पद का सीधा अर्थ ‘दस-हज़ारवाँ भाग’ है।
- source_word: vivificari
  choice: जीवित किया जा सकता
  rationale: लातीनी कर्मवाच्य का अर्थ ‘जीवित किया जाना’ है; अनुवाद कर्मवाच्य तथा जीवन दिए जाने के धर्मवैचारिक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: अधर्मों से राहत का आशय
  choice: अधर्मों का बोझ हल्का किया जाए
  alternative: अधर्मों से छुटकारा दिया जाए / अधर्म क्षमा किए जाएँ
  rationale: मूल पाठ राहत या हल्का किए जाने की भाषा इस्तेमाल करता है, पर यह स्पष्ट नहीं करता कि आशय क्षमा, दंड में कमी, या अधर्म के प्रभाव से मुक्ति है। इसलिए व्यापक रूपक को बनाए रखा गया है।
- issue: vivificari में जीवन का स्वरूप
  choice: जीवित किया जा सकता
  alternative: उद्धार पाया जा सकता / पुनर्जीवित किया जा सकता
  rationale: मूल क्रिया जीवन दिए जाने की बात करती है, लेकिन इस वाक्य में उसके स्वरूप को स्पष्ट नहीं करती। ‘उद्धार’ या ‘पुनरुत्थान’ चुनना अनावश्यक व्याख्या जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। मूल पाठ का वाक्य आगे जारी रहने के कारण अंतिम अल्पविराम सुरक्षित रखा गया है।
