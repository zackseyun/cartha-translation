source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mandans enim mandavit Dominus venientibus quando venerunt, quid facientes viverent, et quid observantes non punirentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/021.yaml
  text: For the Lord indeed commanded those who came, when they came, what they should do to live, and what they should observe so as not to be punished.
translation:
  language: hi
  text: क्योंकि प्रभु ने जो आए थे, उन्हें—जब वे आए थे—निश्चय ही आज्ञा दी कि वे क्या करें जिससे जीवित रहें, और किन बातों का पालन करें जिससे वे दंडित न हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mandans enim mandavit
  choice: क्योंकि ... सचमुच ... आज्ञा दी थी
  rationale: लातीनी धातु-पुनरुक्ति को अप्राकृतिक रूप से दोहराने के बजाय उसके कारणसूचक और बलाघाती भाव को स्वाभाविक हिन्दी में रखा गया है।
- source_word: venientibus quando venerunt
  choice: आनेवालों को, जब वे आए
  rationale: मूल की कुछ असामान्य पुनरुक्ति और कालगत कथन को हटाए बिना स्पष्ट हिन्दी में प्रस्तुत करता है।
- source_word: quid facientes viverent
  choice: वे क्या करें जिससे जीवित रहें
  rationale: facientes और viverent के साधन-परिणाम संबंध को सीधे व्यक्त करता है, बिना यह तय किए कि जीवन केवल शारीरिक है या व्यापक अर्थ में।
- source_word: quid observantes non punirentur
  choice: किन बातों का पालन करें जिससे दण्ड न पाएँ
  rationale: observantes के लिए ‘पालन करें’ आज्ञाओं या निर्धारित बातों को मानने का स्वाभाविक हिन्दी रूप है; non punirentur का निष्क्रिय अर्थ सुरक्षित है।
theological_decisions:
- issue: ‘जीवित रहें’ का आशय
  choice: जीवित रहें
  alternative: जीवन पाएँ
  rationale: मूल vivere की अस्पष्टता बनाए रखी गई है; ‘जीवन पाएँ’ परलोक या उद्धार का अधिक विशिष्ट अर्थ आरोपित कर सकता था।
- issue: आज्ञापालन और दण्ड से बचने का संबंध
  choice: जिससे दण्ड न पाएँ
  alternative: ताकि उन्हें दण्ड न दिया जाए
  rationale: मूल का उद्देश्य/परिणाम संबंध और निष्क्रिय भाव संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है, बिना किसी विशिष्ट दण्ड-सिद्धान्त को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘आनेवालों को, जब वे आए’ की पुनरुक्ति मूल लातीनी वाक्य की वास्तविक संरचना को सुरक्षित रखने के लिए जानबूझकर रखी गई है।
