source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui speruerunt, neque connumeres te cum his qui cruciantur. Etenim est tibi thesaurus operum repositus apud Altissimum, sed non tibi demonstrabitur usque in nouissimis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/077.yaml
  text: who have shown contempt[a], and do not count yourself among those who are tormented. For a treasury of works is laid up for you with the Most High, but it will not be shown to you until the last times.
translation:
  language: hi
  text: जिन्होंने तिरस्कार किया है, और अपने को उन लोगों में मत गिन जो यातना भोगते हैं। क्योंकि तुम्हारे लिए परमप्रधान के पास कर्मों का खज़ाना संचित है, परंतु वह अंतिम समयों तक तुम्हें दिखाया नहीं जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: speruerunt
  choice: तिरस्कार किया है
  rationale: लैटिन क्रिया spernere का अर्थ तुच्छ जानना या ठुकराना है; यहाँ पूर्व पद से जुड़े बहुवचन कर्ता के लिए अर्थ को बिना अतिरिक्त वस्तु जोड़े रखा गया है।
- source_word: connumeres te
  choice: अपने आप को ... में मत गिन
  rationale: लैटिन निषेध और आत्मवाचक रचना का निकट, स्वाभाविक हिन्दी रूप।
- source_word: cruciantur
  choice: यातना भोगते हैं
  rationale: निष्क्रिय भाव में पीड़ा या यातना दिए जाने को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: thesaurus operum
  choice: कर्मों का खज़ाना
  rationale: thesaurus के ठोस रूपक को बनाए रखते हुए opera को धार्मिक व्याख्या जोड़े बिना 'कर्मों' के रूप में दिया गया है।
- source_word: repositus apud Altissimum
  choice: परमप्रधान के पास ... संचित है
  rationale: 'apud और repositus दोनों का अर्थ सुरक्षित रखता है: खज़ाना परमप्रधान के पास जमा करके रखा गया है।'
- source_word: nouissimis
  choice: अन्तिम समय
  rationale: लैटिन के बहुवचन विशेषण का प्रसंगगत कालवाचक अर्थ है; हिन्दी में 'अन्तिम समय' स्वाभाविक है और अन्तकालीन संकेत बनाए रखता है।
theological_decisions:
- issue: कर्मों के खज़ाने का आशय
  choice: कर्मों का खज़ाना
  alternative: पुण्य का भंडार / प्रतिफल का खज़ाना
  rationale: मूल में केवल operum है; 'पुण्य' या 'प्रतिफल' कहने से निहित धार्मिक निष्कर्ष को स्पष्ट कथन बना दिया जाता।
- issue: खज़ाना किसके लिए और कहाँ है
  choice: तेरे लिए परमप्रधान के पास ... संचित है
  alternative: तेरे कर्म परमप्रधान के यहाँ जमा हैं
  rationale: मूल के रूपक, लाभार्थी और स्थान—तीनों को बनाए रखा गया है; इसे केवल कर्मों के अभिलेख में नहीं बदला गया।
- issue: प्रारम्भिक संबंधवाचक खंड की अपूर्णता
  choice: जिन्होंने तिरस्कार किया है
  alternative: उन लोगों ने तिरस्कार किया है
  rationale: qui पूर्ववर्ती पद से जुड़ा संबंधवाचक खंड है। पद-सीमा पर उसकी व्याकरणिक निर्भरता को संरक्षित किया गया है, न कि स्वतंत्र वाक्य बनाकर अस्पष्टता मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए स्पष्ट। परमप्रधान के संबोधन में एकवचन 'तेरे/तुझे' रखा गया है, क्योंकि प्रसंग एक व्यक्ति को संबोधित करता है। आरम्भिक अंश पिछले पद पर निर्भर होने के कारण जानबूझकर खंडात्मक रखा गया है।
