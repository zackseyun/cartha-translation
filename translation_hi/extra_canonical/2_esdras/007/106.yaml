  text: And I answered and said[a], “How then do we now find that first Abraham prayed for the Sodomites, and Moses for the fathers who sinned in the wilderness,
translation:
  language: hi
  text: तब मैंने उत्तर दिया, “तो अब हम यह कैसे पाते हैं कि सबसे पहले अब्राहम ने सदोमवासियों के लिए विनती की, और मूसा ने उन पूर्वजों के लिए जिन्होंने वीराने में पाप किया था,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: rogavit
  choice: विनती की
  rationale: यहाँ प्रसंग दूसरों की ओर से निवेदन करने का है; ‘विनती की’ सामान्य आधुनिक हिन्दी में इस मध्यस्थतापूर्ण प्रार्थना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: primus Abraham
  choice: सबसे पहले अब्राहम ने
  rationale: लैटिन ‘primus’ कर्ता ‘Abraham’ के साथ है और मध्यस्थों की क्रमिक सूची में अब्राहम को पहला बताता है; यह अनुवाद उसी क्रम को सामने रखता है।
- source_word: Sodomitas
  choice: सदोमवासियों
  rationale: यह सदोम नगर के लोगों के लिए प्रयुक्त जातिवाचक रूप का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: patribus
  choice: पूर्वजों
  rationale: प्रसंग में यह मरुभूमि में पाप करनेवाली पिछली इस्राएली पीढ़ी को सूचित करता है; आधुनिक हिन्दी में ‘पूर्वज’ स्पष्ट है।
- source_word: in deserto
  choice: वीराने में
  rationale: ‘वीराना’ निर्जन प्रदेश के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और केवल रेतीले रेगिस्तान का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: अब्राहम और मूसा की प्रार्थना का स्वरूप
  choice: ‘विनती की’ के द्वारा दूसरों के पक्ष में निवेदन का भाव रखा गया
  alternative: ‘प्रार्थना की’ या ‘मध्यस्थता की’
  rationale: ‘प्रार्थना की’ अपेक्षाकृत व्यापक है, जबकि ‘मध्यस्थता की’ अधिक तकनीकी और धर्मवैचारिक लग सकती है; ‘विनती की’ स्रोत के rogavit और प्रसंग दोनों के अनुकूल है।
- issue: primus का संबंध
  choice: अब्राहम को सूची में सबसे पहला बताया गया
  alternative: अब्राहम ने सदोमवासियों के लिए अपनी अन्य प्रार्थनाओं से पहले प्रार्थना की
  rationale: लैटिन में primus कर्ता Abraham के साथ कर्तृवाचक रूप में है; इसलिए इसे क्रिया के साधारण क्रियाविशेषण की तरह नहीं समझा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक द्विरुक्ति ‘उत्तर दिया और कहा’ को स्वाभाविक हिन्दी में ‘उत्तर दिया’ किया गया है। पद आगे जारी रहने के कारण अंत में अल्पविराम रखा गया है।
