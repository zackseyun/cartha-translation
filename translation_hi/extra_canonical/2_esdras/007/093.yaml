  text: seducat a uita in mortem. Secundus ordo, quoniam uident complicationem, in qua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/093.yaml
  text: 'The second order: because they see the entanglement in which the souls of the ungodly wander[a], and the punishment that awaits them.'
translation:
  language: hi
  text: 'दूसरा क्रम यह है: वे उस उलझाव को देखते हैं जिसमें अधर्मियों की आत्माएँ भटकती हैं[a], और उस दंड को भी जो उनकी प्रतीक्षा कर रहा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दुविधा’।
    reason: complicatio का एक संभावित मानसिक/अमूर्त अर्थ; किंतु ‘जिसमें ... भटकती हैं’ के कारण मुख्य पाठ में स्थानगत जटिल फँसाव का भाव रखा गया है।
lexical_decisions:
- source_word: Secundus ordo
  choice: दूसरी अवस्था
  rationale: यहाँ ordo क्रम में आने वाली दूसरी दशा या अवस्था को दर्शाता है; ‘दूसरा क्रम’ हिन्दी में कम स्वाभाविक और अस्पष्ट होता।
- source_word: complicationem
  choice: उलझाव
  rationale: लैटिन शब्द में आपस में उलझने या जटिल फँसाव का भाव है। आगे के स्थानवाचक प्रयोग—‘जिसमें ... भटकती हैं’—के साथ ‘उलझाव’ केवल मानसिक दुविधा की अपेक्षा अधिक उपयुक्त है।
- source_word: uagantur
  choice: भटकती हैं
  rationale: यह चयन दिशाहीन घूमने या रास्ता न पाने के स्थानवाचक भाव को बनाए रखता है।
- source_word: poena
  choice: दंड
  rationale: यह अपेक्षित दंडात्मक परिणाम को सीधे और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दंड की प्रतीक्षा किसके लिए है
  choice: ‘उनकी’ सर्वनाम के द्वारा अधर्मियों की आत्माओं से संबंध खुला रखा गया है
  alternative: स्पष्ट रूप से ‘अधर्मियों की आत्माओं को मिलनेवाला दंड’ कहना
  rationale: सर्वनाम स्रोत/प्रमाणित परामर्श-पाठ की संरचना और हल्की संदर्भगत अस्पष्टता को बनाए रखता है; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। वाक्य की क्रमसूचक शैली को बनाए रखते हुए अनावश्यक सांप्रदायिक या व्याख्यात्मक शब्दावली से बचा गया है।
