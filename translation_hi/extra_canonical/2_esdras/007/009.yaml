id: 2ES.7.9
reference: 2 Esdras 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem data dabitur civitas homini in hereditatem, si non heres antepositum periculum pertransierit, quomodo accipiet hereditatem suam?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/009.yaml
  text: If a city is given to a man for an inheritance[a], if the heir does not pass through the danger set before him, how will he receive his inheritance?
translation:
  language: hi
  text: परन्तु यदि कोई नगर किसी मनुष्य को विरासत में दिया जाए, और यदि वारिस अपने सामने रखे गए संकट को पार न करे, तो वह अपनी विरासत कैसे पाएगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: data dabitur
  choice: दिया जाए
  rationale: लातीनी निष्क्रिय अभिव्यक्ति को स्वाभाविक हिन्दी की शर्तसूचक रचना में रखा गया है; शब्द-दोहराव को अलग से बलसूचक शब्द जोड़कर नहीं उभारा गया।
- source_word: civitas
  choice: नगर
  rationale: यहाँ अर्थ किसी व्यक्ति को विरासत के रूप में मिलने वाले नगर का है; ‘नगर’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: in hereditatem
  choice: विरासत में
  rationale: यह उस उद्देश्य या हैसियत को व्यक्त करता है जिसमें नगर दिया जाता है।
- source_word: heres
  choice: वारिस
  rationale: यह उत्तराधिकार पाने वाले व्यक्ति के लिए सहज आधुनिक हिन्दी शब्द है और उसी वाक्य में ‘विरासत’ से अर्थगत संबंध बनाए रखता है।
- source_word: antepositum periculum
  choice: अपने सामने रखे गए संकट
  rationale: antepositum के ‘सामने रखा/निर्धारित’ भाव और periculum के वास्तविक संकट या जोखिम—दोनों को सुरक्षित रखा गया है।
- source_word: pertransierit
  choice: पार न करे
  rationale: यह बाधा या संकट से होकर निकलने की स्थानिक उपमा को बनाए रखता है।
- source_word: accipiet
  choice: पाएगा
  rationale: विरासत प्राप्त करने के संदर्भ में यह स्वाभाविक हिन्दी है और मूल के भविष्यसूचक प्रश्न को बनाए रखता है।
theological_decisions:
- issue: विरासत पाने से पहले संकट पार करने की शर्त
  choice: शर्त और परिणाम के संबंध को ज्यों का त्यों रखा गया है
  alternative: इसे नैतिक योग्यता, उद्धार कमाने, या किसी विशिष्ट धार्मिक परीक्षा के रूप में स्पष्ट करना
  rationale: पद स्वयं केवल वारिस, सामने रखे संकट और विरासत के बीच उपमा प्रस्तुत करता है; उसका सिद्धान्तगत अर्थ यहाँ अतिरिक्त रूप से निर्धारित नहीं किया गया।
- issue: data dabitur में संभावित बल
  choice: अलग बलसूचक शब्द नहीं जोड़ा गया
  alternative: ‘निश्चय ही दिया जाए’ या ‘अवश्य दिया जाए’
  rationale: लातीनी दोहरी रचना बल का संकेत हो सकती है, पर उपलब्ध पाठ में उसका बल इतना निश्चित नहीं कि हिन्दी में ‘अवश्य’ जोड़कर अर्थ को अधिक दृढ़ किया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘परन्तु’ से autem का पूर्ववर्ती तर्क के साथ विरोधात्मक संबंध व्यक्त किया गया है, जबकि दूसरे si को हिन्दी में सहज समन्वय के लिए ‘और’ के साथ प्रस्तुत किया गया है। प्रश्नात्मक उपमा और मूल की शर्तसूचक संरचना सुरक्षित हैं।
