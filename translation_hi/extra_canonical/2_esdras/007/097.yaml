  text: et spatiosum, [quod incipient] recipere fruniscentes et immortales. Sextus ordo, quando eis ostendetur, quomodo incipiet uultus eorum fulgere sicut sol, et quomodo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/097.yaml
  text: 'The sixth order: when it will be shown to them how their face will begin to shine like the sun, and how they will begin to be made like the light of the stars, being from then on incorruptible.'
translation:
  language: hi
  text: 'छठा क्रम यह है: जब उन्हें दिखाया जाएगा कि उनका मुख सूर्य के समान कैसे चमकने लगेगा, और वे तारों के प्रकाश के समान कैसे बनाए जाने लगेंगे; तब से वे अविनाशी होंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sextus ordo
  choice: छठा क्रम
  rationale: ‘क्रम’ दर्शन में बताई जा रही क्रमिक अवस्था को सरल और औपचारिक ढंग से व्यक्त करता है।
- source_word: ostendetur
  choice: दिखाया जाएगा
  rationale: लैटिन के भविष्यकालीन कर्मवाच्य अर्थ को स्पष्ट रूप से बनाए रखता है।
- source_word: uultus eorum
  choice: उनका मुख
  rationale: मूल के एकवचन सामूहिक/वितरणात्मक प्रयोग को सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
- source_word: fulgere sicut sol
  choice: सूर्य के समान चमकने
  rationale: उपमा और चमकने की आरंभिक प्रक्रिया दोनों को सीधे व्यक्त करता है।
- source_word: stellis adsimilari luminis
  choice: तारों के प्रकाश के समान बनाए जाने
  rationale: उपलब्ध पाठ-परंपरा और परामर्श-पाठ में निहित तारकीय प्रकाश से समानता तथा कर्मवाच्य भाव को बनाए रखता है।
- source_word: non corrupturi
  choice: अविनाशी होंगे
  rationale: आगे से भ्रष्टता/क्षय के अधीन न रहने की भावी अवस्था को संक्षेप और गरिमा से व्यक्त करता है।
theological_decisions:
- issue: महिमामय रूपांतरण का कर्ता
  choice: कर्मवाच्य ‘बनाए जाने लगेंगे’
  alternative: ‘समान होने लगेंगे’
  rationale: मूल का कर्मवाच्य भाव बनाए रखकर कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
- issue: अविनाशिता का आरंभ
  choice: ‘तब से वे अविनाशी होंगे’
  alternative: ‘और आगे कभी नष्ट नहीं होंगे’
  rationale: कालगत आरंभ को स्पष्ट रखते हुए ‘अविनाशी’ के व्यापक अर्थ को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। वाक्य की भविष्यकालीन दृष्टि, क्रमिक आरंभ (‘लगेंगे’) और कर्मवाच्य रूप को जानबूझकर सुरक्षित रखा गया है।
