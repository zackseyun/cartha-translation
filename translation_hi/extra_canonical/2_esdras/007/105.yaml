source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eo intellegat, aut dormiat, aut manducet, aut curetur; Sic nunquam nemo pro aliquo rogabit, omnes enim portabunt unusquisque tunc iniustitias suas aut iustitias.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/105.yaml
  text: or a friend who is most dear[a], that he may understand, or sleep, or eat, or be healed for him; so no one will ever pray for another, for all will then bear, each one, his own unrighteousnesses or righteousnesses.”
translation:
  language: hi
  text: या कोई अत्यंत प्रिय मित्र[a], जो उसके लिए समझ सके, सो सके, खा सके या चंगा हो सके; इस प्रकार कोई भी कभी किसी दूसरे के लिए विनती नहीं करेगा, क्योंकि तब सभी लोग, हर एक अपने-अपने अधर्मों या धर्मों का भार उठाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस प्रकार फिर कोई भी किसी दूसरे के लिए विनती नहीं करेगा, बल्कि हर एक अपने-अपने अधर्मों या धर्मों का भार उठाएगा।”
    reason: अंग्रेज़ी POB audit trail में दिए गए previous_rendering footnote का अनुवाद; यह आधार-पाठ की मुख्य rendering को नहीं बदलता।
lexical_decisions:
- source_word: intellegat
  choice: समझे
  rationale: लातीनी क्रिया का सीधा अर्थ रखा गया है; संदर्भ असामान्य होने पर भी इसे अधिक व्याख्यात्मक शब्द से नहीं बदला गया।
- source_word: curetur
  choice: चंगा हो
  rationale: निष्क्रिय रूप और आरोग्य का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: rogabit
  choice: विनती करेगा
  rationale: यहाँ किसी दूसरे के पक्ष में की जाने वाली प्रार्थना/याचना का भाव है; ‘विनती’ धार्मिक और सामान्य दोनों पाठकों के लिए सहज है।
- source_word: iniustitias suas aut iustitias
  choice: अपने-अपने अधर्म या धर्म का भार
  rationale: लातीनी बहुवचन अमूर्त नैतिक अवस्थाओं/कर्मों को सूचित कर सकता है। हिन्दी में शाब्दिक बहुवचन अस्वाभाविक होता, इसलिए विरोधी युग्म और ‘भार उठाने’ की छवि सुरक्षित रखी गई है।
- source_word: omnes ... unusquisque
  choice: सभी लोग, हर एक अपने-अपने
  rationale: सार्वभौमिकता और प्रत्येक व्यक्ति की अलग जवाबदेही, दोनों पर लातीनी बल को बनाए रखा गया है।
theological_decisions:
- issue: अंतिम न्याय में दूसरे के लिए विनती की असंभवता
  choice: कोई भी कभी किसी दूसरे के लिए विनती नहीं करेगा
  alternative: कोई भी तब किसी दूसरे के लिए प्रार्थना नहीं करेगा
  rationale: ‘कभी’ nunquam को और भविष्यकाल rogabit को स्पष्ट रखता है; tunc को अगली उपवाक्य में portabunt के साथ रखा गया है।
- issue: न्याय में व्यक्तिगत नैतिक उत्तरदायित्व
  choice: क्योंकि तब सभी लोग, हर एक अपने-अपने अधर्म या धर्म का भार उठाएँगे
  alternative: पर हर एक अपने अधर्म या धर्म को उठाएगा
  rationale: enim का कारणसूचक ‘क्योंकि’, tunc का अगली क्रिया से संबंध, और omnes तथा unusquisque दोनों का बल सुरक्षित रखा गया है; विरोधसूचक ‘पर’ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरंभिक ‘या कोई मित्र…’ उपलब्ध अंग्रेज़ी परामर्श-पाठ से लिया गया है, क्योंकि प्रदत्त लातीनी अंश मध्य-वाक्य ‘eo’ से आरंभ होता है और उसका पूर्वपद उसी में संरक्षित है। विराम-चिह्न से लंबी वाक्य-श्रृंखला स्पष्ट की गई है।
