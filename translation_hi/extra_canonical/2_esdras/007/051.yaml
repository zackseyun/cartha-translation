  text: One age, but two. For you have said that the righteous are not many, but few,
translation:
  language: hi
  text: एक युग, पर दो। क्योंकि तुमने कहा है कि धर्मी बहुत नहीं, बल्कि थोड़े हैं,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: युग
  rationale: यहाँ लैटिन शब्द काल या युग के अर्थ में है; ‘युग’ संक्षिप्त है और प्रसंग की काल-संबंधी अस्पष्टता बनाए रखता है।
- source_word: iustos
  choice: धर्मी
  rationale: नैतिक और धार्मिक रूप से सही ठहरने वाले लोगों के लिए प्रचलित, गरिमापूर्ण बाइबलीय शब्द।
- source_word: paucos
  choice: थोड़े
  rationale: ‘बहुत नहीं’ के विपरीत मूल के सीधे और स्वाभाविक बल को बनाए रखता है।
theological_decisions:
- issue: ‘एक युग, पर दो’ का असामान्य और संदर्भ-निर्भर कथन
  choice: एक युग, पर दो।
  alternative: एक संसार, पर दो।
  rationale: मूल पाठ की संक्षिप्तता और वास्तविक अस्पष्टता को बिना व्याख्यात्मक शब्द जोड़े सुरक्षित रखा गया है; saeculum के लिए यहाँ ‘युग’ अधिक स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट भाषा। पद के अंत में अल्पविराम रखा गया है क्योंकि उपलब्ध स्रोत-वाक्य आगे जारी रहता है।
