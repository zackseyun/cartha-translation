- source_word: miserator / miseretur
  choice: करुणामय / करुणा करता है
  rationale: संज्ञात्मक विशेषण और उसी धातु से बने क्रियापद की पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: conversionem faciunt
