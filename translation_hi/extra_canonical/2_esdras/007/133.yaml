  rationale: लैटिन वाक्यांश दिशा बदलकर वापस आने या मन फिराने का भाव देता है; यहाँ अगले पदबंध के साथ ‘व्यवस्था की ओर लौटते हैं’ सरल और स्रोत-संगत है।
- source_word: in lege eius
  choice: उसकी व्यवस्था की ओर
  rationale: ‘conversionem’ के साथ ‘in’ लक्ष्य की दिशा व्यक्त करता है; ‘व्यवस्था’ धार्मिक-कानूनी अर्थ को सुरक्षित रखती है।
