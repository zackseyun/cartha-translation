source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'seruiuistis, uel cuius diligentias spreuistis. Uidete contra et in contra: hic iocunditas et requies, et ibi ignis et tormenta; haec autem loqueris dicens ad eos in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/038.yaml
  text: 'Look on this side and on that: here are delight and rest, and there are fire and torments. These are the words he will speak to them on the day of judgment.'
translation:
  language: hi
  text: 'इस ओर भी देखो और उस ओर भी: यहाँ आनन्द और विश्राम हैं, और वहाँ आग और यातनाएँ हैं। न्याय के दिन वह उनसे ये बातें कहेगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Uidete contra et in contra
  choice: इस ओर भी देखो और उस ओर भी
  rationale: लातीनी अभिव्यक्ति दोनों विपरीत पक्षों को देखने का आह्वान करती है; यह हिन्दी में उस तुलना को स्वाभाविक और स्पष्ट रखता है।
- source_word: iocunditas et requies
  choice: आनन्द और विश्राम
  rationale: ‘iocunditas’ के सुख/हर्ष और ‘requies’ के विश्राम/चैन के अर्थ को गरिमापूर्ण, सामान्य हिन्दी में व्यक्त करता है।
- source_word: ignis et tormenta
  choice: आग और यातनाएँ
  rationale: बहुवचन ‘tormenta’ को बनाए रखते हुए दण्ड और पीड़ा की तीव्रता व्यक्त करता है।
- source_word: haec autem loqueris dicens ad eos
  choice: वह उनसे ये बातें कहेगा
  rationale: प्रदत्त साफ किए गए लातीनी अंश में रूप असंगत/खंडित प्रतीत होता है; अंग्रेज़ी परामर्श-पाठ के अनुरूप वाक्य का अभिप्रेत भविष्यकालीन कथन स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: न्याय के बाद के दो विपरीत परिणाम
  choice: आनन्द और विश्राम बनाम आग और यातनाएँ
  alternative: इन परिणामों की अवधि या सटीक प्रकृति की व्याख्या जोड़ना
  rationale: स्रोत केवल विरोध प्रस्तुत करता है; अवधि, स्थान या दण्ड-सिद्धान्त के विषय में कोई साम्प्रदायिक निष्कर्ष नहीं जोड़ा गया।
- issue: वक्ता का संदर्भ
  choice: ‘वह’ को अनिर्दिष्ट रखा
  alternative: परमेश्वर, मसीह या स्वर्गदूत के रूप में स्पष्ट पहचान देना
  rationale: दिए गए खंड में कर्ता की स्पष्ट पहचान नहीं है, इसलिए वास्तविक संदर्भगत अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। पद का आरम्भ पिछले वाक्य के अवशेष से होता है और अंत भी अगले अंश में जाता है; अंग्रेज़ी POB की पुनर्स्थापित पूर्ण-पद संरचना को परामर्श के रूप में लेते हुए मुख्य विरोध और न्याय-दिवस के कथन को स्पष्ट रखा गया है।
