lexical_decisions:
- source_word: pondera
  choice: भार
  rationale: लातीनी बहुवचन का निकट और स्वाभाविक रूप; यहाँ विचारों के गंभीर या वजनी होने का रूपक बना रहता है।
- source_word: in te stant
  choice: तेरे भीतर है
  rationale: दूषित या कठिन पाठ को यथासंभव निकटता से प्रस्तुत करता है और अनिश्चित वाक्य को स्पष्ट आज्ञा में नहीं बदलता।
- source_word: quæ cogitasti
  choice: जिन बातों पर तूने विचार किया है
  rationale: संबंधवाचक संरचना और पूर्ण हो चुके चिंतन का भाव स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: quoniam qui habet
  choice: क्योंकि जिसके पास है—
  rationale: दिए गए स्रोत का वाक्य इसी स्थान पर अधूरा है; डैश पाठ की अपूर्णता दिखाता है, बिना अनुपस्थित सामग्री जोड़ने के।
theological_decisions:
- issue: कठिन पाठ को अर्थानुसार सुधारने या यथावत रखने का प्रश्न
  choice: ‘उनका भार तेरे भीतर है’ के रूप में कठिन रूपक सुरक्षित रखा गया
  alternative: ‘अपने भीतर उन बातों को तौल’
  rationale: लातीनी पाठ संभवतः दूषित है, पर आज्ञार्थक ‘तौल’ स्रोत में स्पष्ट नहीं है; इसलिए वास्तविक अस्पष्टता को दबाया नहीं गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी। संवाद की प्राचीनता बनाए रखने के लिए ‘तू/तेरे’ का प्रयोग किया गया है। स्रोत जहाँ अधूरा समाप्त होता है, वहाँ दीर्घ डैश रखा गया है।
