id: 2ES.7.1
reference: 2 Esdras 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum finissem loqui verba haec, et missus est ad me angelus, qui missus fuerat ad me primis noctibus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/001.yaml
  text: And it happened, when I had finished speaking these words, that the angel who had been sent to me in the first nights was sent to me again,
translation:
  language: hi
  text: और ऐसा हुआ कि जब मैं ये बातें कह चुका, तब वही स्वर्गदूत फिर मेरे पास भेजा गया, जो पहली रातों में मेरे पास भेजा गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est
  choice: और ऐसा हुआ कि
  rationale: लातिनी कथात्मक सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: cum finissem loqui verba haec
  choice: जब मैं ये बातें कह चुका
  rationale: शाब्दिक ‘इन शब्दों को बोलना समाप्त कर चुका’ की अपेक्षा सहज हिन्दी है और पूर्ण हो चुकी क्रिया का भाव सुरक्षित रखता है।
- source_word: angelus
  choice: स्वर्गदूत
  rationale: सामान्य आधुनिक हिन्दी में angelus का स्पष्ट और प्रचलित धार्मिक पर्याय।
- source_word: primis noctibus
  choice: पहली रातों में
  rationale: मूल के बहुवचन noctibus को बनाए रखता है और किसी अधिक विशिष्ट काल-संदर्भ को आरोपित नहीं करता।
theological_decisions:
- issue: क्या स्वर्गदूत के दोबारा भेजे जाने को स्पष्ट किया जाए
  choice: ‘फिर’ जोड़कर पुनः भेजे जाने का आशय व्यक्त किया
  alternative: ‘तब वह स्वर्गदूत मेरे पास भेजा गया’
  rationale: लातिनी वाक्य में उसी स्वर्गदूत के पहले भी भेजे जाने का संबंधसूचक उपवाक्य है; ‘फिर’ हिन्दी में इस पुनरावृत्ति को स्वाभाविक रूप से स्पष्ट करता है, बिना अतिरिक्त धर्मवैचारिक अर्थ जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, सहज और गरिमापूर्ण शैली। मूल वाक्य की पुनरुक्ति को हिन्दी में कुछ संक्षिप्त किया गया है, पर स्वर्गदूत के पहले और अब भेजे जाने—दोनों का अर्थ सुरक्षित है।
