  text: But its entrance will be set in a narrow place[b][a], so that it would be like a river.
translation:
  language: hi
  text: परन्तु उसका प्रवेश एक सँकरी जगह में रखा जाएगा, ताकि वह नदी के समान हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  choice: प्रवेश
  rationale: यहाँ शब्द प्रवेश करने के स्थान या मार्ग को सूचित करता है; ‘प्रवेश’ संक्षिप्त है और संदर्भ की स्थानगत छवि बनाए रखता है।
- source_word: in angusto loco
  choice: एक सँकरी जगह में
  rationale: लैटिन पदबंध का सीधा और स्वाभाविक स्थानगत अर्थ; ‘सँकरी’ सीमित चौड़ाई को व्यक्त करता है।
- source_word: similis fluminis
  choice: नदी के समान
  rationale: सम्बन्धकारक fluminis के साथ similis की तुलना को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: erit ... positus का काल और वाच्य
  choice: रखा जाएगा
  alternative: रखा हुआ है
  rationale: erit के भविष्यकाल और positus के निष्क्रिय भाव को बनाए रखा गया है; वर्तमानकाल का विकल्प मूल के कालांतर को समतल कर देता।
- issue: ut esset का भाव
  choice: ताकि वह ... हो
  alternative: जिससे वह ... होता
  rationale: ut के प्रयोजन/परिणाम और esset के संभाव्य-अपूर्ण भाव को हिन्दी में स्वाभाविक ‘ताकि ... हो’ से व्यक्त किया गया है; पद को साधारण तथ्यवाचक ‘है’ नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘परन्तु’ विरोधसूचक autem को व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
