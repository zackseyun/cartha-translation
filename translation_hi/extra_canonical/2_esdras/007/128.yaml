translation:
  language: hi
  text: यदि वह हार जाए, तो उसे वह सहना पड़ेगा जो तुमने कहा है; लेकिन यदि वह जीत जाए, तो उसे वह मिलेगा जो मैं कहता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: victus fuerit
  choice: वह हार गया
  rationale: यह लैटिन के पूर्ण निष्क्रिय भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: patiatur
  choice: उसे सहना पड़ेगा
  rationale: यह परिणामस्वरूप दुःख या दंड भुगतने के अर्थ को सहज हिन्दी में रखता है।
- source_word: vicerit
  choice: वह जीत गया
  rationale: यह victus fuerit के साथ मूल का स्पष्ट विरोध बनाए रखता है।
- source_word: recipiet
  choice: उसे मिलेगा
  rationale: यह ‘प्राप्त करेगा’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है और मूल अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ‘जो तुमने कहा’ और ‘जो मैं कहता हूँ’ का अनिर्दिष्ट आशय
  choice: दोनों वाक्यांशों को मूल की तरह अनिर्दिष्ट रखा गया
  alternative: संदर्भ के आधार पर दंड या प्रतिफल को स्पष्ट कर देना
  rationale: लैटिन पद स्वयं विषय-वस्तु नहीं बताता; उसे जोड़ना वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
