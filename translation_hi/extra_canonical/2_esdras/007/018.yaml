base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/018.yaml
  text: But the righteous will endure narrow things[a], hoping for broad things[b]; for those who have acted ungodly have both suffered narrowness and not seen the broad things.
translation:
  language: hi
  text: परन्तु धर्मी संकरी अवस्थाएँ सहेंगे[a] और खुले विस्तारों की आशा रखेंगे[b]; क्योंकि जिन्होंने अधर्म किया है, उन्होंने संकरी अवस्था भी सही है और खुले विस्तारों को भी नहीं देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘संकरी बातें’ या ‘संकरी अवस्थाएँ’; यहाँ कठिन और सीमित दशा का स्थानगत रूपक है।
    reason: लैटिन के विशेषण-से-संज्ञा बने बहुवचन angusta की असामान्य परंतु महत्वपूर्ण छवि स्पष्ट करना।
  - marker: b
    text: शाब्दिक रूप से ‘विस्तृत बातें’ या ‘विस्तृत अवस्थाएँ’; यह ‘संकरी’ के विपरीत है।
    reason: spatiosa की समानांतर स्थानगत छवि और मूल पाठ की अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: iusti
  choice: धर्मी
  rationale: यह शब्द नैतिक रूप से सही ठहरने और धर्मपरायण होने का सामान्य, गरिमापूर्ण हिन्दी पद है।
- source_word: ferent
  choice: सहेंगे
  rationale: भविष्यकालीन लैटिन क्रिया में कठिन परिस्थिति को उठाने या सहने का भाव है; हिन्दी में ‘सहेंगे’ स्वाभाविक है।
- source_word: angusta / angustiam
  choice: संकरेपन
  rationale: दोनों रूपों में जानबूझकर प्रयुक्त स्थानगत रूपक और उनकी शब्दगत संगति बनाए रखने के लिए एक ही मूल पद चुना गया है।
- source_word: spatiosa
  choice: खुले विस्तार
  rationale: यह ‘संकरेपन’ के विपरीत विशाल और खुली अवस्था का स्थानगत रूपक सुरक्षित रखता है; दोनों occurrences में समान अनुवाद रखा गया है।
- source_word: impie gesserunt
  choice: अधर्म किया
  rationale: यह अभक्तिपूर्ण या दुष्ट आचरण के व्यापक नैतिक अर्थ को सरल और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: et ... et ...
  choice: भी ... और ... भी नहीं
  rationale: लैटिन की सहसंबंधी संरचना को बनाए रखते हुए अधर्मियों की दोहरी विडंबना पर बल दिया गया है।
theological_decisions:
- issue: ‘संकरेपन’ और ‘खुले विस्तार’ का आशय
  choice: स्थानगत रूपक को मुख्य पाठ में बनाए रखा गया
  alternative: इन्हें सीधे ‘कष्ट’ और ‘सुख’ या ‘उद्धार’ के रूप में समझाकर अनुवाद करना
  rationale: स्रोत स्वयं रूपक का अर्थ पूरी तरह नहीं खोलता; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को आरोपित करने के बजाय उसकी वास्तविक अस्पष्टता और विरोध सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘संकरेपन’ और ‘खुले विस्तार’ की पुनरावृत्ति जानबूझकर रखी गई है, ताकि लैटिन का केंद्रीय विरोध और अधर्मियों के विषय में et...et... का दोहरा बल बना रहे।
