id: 2ES.7.70
reference: 2 Esdras 7:70
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: et quando Altissimus faciens faciebat saeculum, Adam et omnes qui cum eo uenerunt, primum praeparauit iudicium et quae sunt iudicii.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/070.yaml
  text: And he answered me and said[a], “When the Most High was making the age, he first prepared judgment and the things of judgment for Adam and all who came with him.”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया और कहा, “जब परमप्रधान युग की रचना कर रहा था, तब उसने आदम और उन सबके लिए जो उसके साथ आए थे[a], सबसे पहले न्याय और न्याय से संबंधित बातों को तैयार किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कुछ अन्य पाठ-परंपराओं के अनुसार, “उससे उत्पन्न हुए थे।”
    reason: लैटिन आधार-पाठ में ‘उसके साथ’ है, जबकि वैकल्पिक पाठ-परंपरा/पूर्व रूप में आदम से उत्पत्ति का अर्थ मिलता है; मुख्य पाठ स्रोत-पाठ का अनुसरण करता है।
lexical_decisions:
- source_word: Altissimus
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त लैटिन उपाधि का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: saeculum
  choice: युग
  rationale: लैटिन शब्द काल, युग या संसार का बोध करा सकता है; यहाँ अंग्रेज़ी परामर्श-पाठ के अनुरूप ‘युग’ रखा गया है, जिससे मूल की कालगत धारणा बनी रहती है।
- source_word: cum eo uenerunt
  choice: उसके साथ आए थे
  rationale: यह लैटिन cum eo का सीधा अर्थ ‘उसके साथ’ सुरक्षित रखता है और ‘उससे उत्पन्न’ अर्थ को मुख्य पाठ में नहीं थोपता।
- source_word: iudicium et quae sunt iudicii
  choice: न्याय और न्याय से संबंधित बातें
  rationale: यह जानबूझकर दोहराए गए लैटिन पदबंध को समझने योग्य हिन्दी में रखता है, बिना यह तय किए कि दूसरी अभिव्यक्ति विशेषतः दंड, प्रक्रिया या परिणाम को दर्शाती है।
- source_word: primum praeparauit
  choice: सबसे पहले ... तैयार किया
  rationale: यह primum की प्राथमिकता और praeparauit की पूर्व-तैयारी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आदम और अन्य लोगों का संबंध
  choice: जो उसके साथ आए थे
  alternative: जो उससे उत्पन्न हुए थे
  rationale: मूल लैटिन में cum eo स्पष्टतः ‘उसके साथ’ है। वंशजों का अर्थ अधिक सहज लग सकता है, पर उसे मुख्य पाठ में रखने के लिए अलग पाठ या अर्थ-संशोधन आवश्यक होगा।
- issue: iudicium के साथ जुड़े दूसरे पदबंध की सीमा
  choice: न्याय से संबंधित बातें
  alternative: न्याय की व्यवस्थाएँ / न्याय के परिणाम
  rationale: मूल quae sunt iudicii व्यापक और कुछ अस्पष्ट है; अनुवाद किसी विशिष्ट न्यायशास्त्रीय या धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है, जबकि ‘युग’, ‘न्याय’ और ‘उसके साथ आए’ जैसी मूल की अर्थगत विशेषताएँ सुरक्षित रखी गई हैं।
