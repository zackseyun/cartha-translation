lexical_decisions:
- source_word: dominus meus
  choice: मेरे प्रभु
  rationale: यह संबोधन के आदर और स्वामी-सूचक अर्थ, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: mare positum est
  choice: समुद्र ... रखा गया है
  rationale: लातीनी निष्क्रिय रचना को सुरक्षित रखा गया है; कर्ता का अनुमान नहीं लगाया गया।
- source_word: spatioso loco
  choice: एक विस्तृत स्थान में
  rationale: spatiosus के चौड़े और फैले हुए स्थान-सूचक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: altum et inmensum
  choice: गहरा और अथाह
  rationale: altum यहाँ समुद्र की गहराई बताता है; inmensum का आशय ऐसी विशालता से है जिसे मापा न जा सके, जिसके लिए ‘अथाह’ स्वाभाविक और प्रसंगानुकूल है।
