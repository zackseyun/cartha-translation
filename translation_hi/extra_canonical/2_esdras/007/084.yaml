  text: 'The fourth way: they consider for themselves in the last times the torment laid up for them.'
translation:
  language: hi
  text: 'चौथा मार्ग यह है: अन्तिम समय में वे अपने लिए उस यातना पर विचार करेंगे, जो उनके लिए रखी गई है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quarta uia
  choice: चौथा मार्ग
  rationale: क्रमबद्ध कथन और ‘मार्ग’ की मूल उपमा को सीधे बनाए रखता है।
- source_word: considerabunt sibi
  choice: वे स्वयं…विचार करेंगे
  rationale: भविष्यकाल और आत्म-संबंधी sibi—अर्थात उनका स्वयं अपने संबंध में विचार करना—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; असहज दोहरे ‘अपने लिए’ से बचता है।
- source_word: in nouissimis
  choice: अन्तिम समय में
  rationale: अन्तकाल-संबंधी बहुवचन अभिव्यक्ति का सामान्य और गरिमापूर्ण हिन्दी रूप है।
- source_word: repo-
  choice: जो उनके लिए रखी गई है
  rationale: प्रस्तुत लैटिन पंक्ति शब्द के बीच में कटी हुई है; उपलब्ध संपादित पाठ-संदर्भ और परीक्षित अंग्रेज़ी परामर्श-पाठ के आधार पर संचित/रखी हुई यातना का भाव सुरक्षित रखा गया है।
theological_decisions:
- issue: sibi का संबंध
  choice: ‘स्वयं’ द्वारा आत्म-संबंधी बल बनाए रखा गया, जबकि यातना को ‘उनके लिए’ रखा हुआ कहा गया
  alternative: ‘वे अपने लिए…विचार करेंगे’ कहकर sibi को क्रिया के साथ शब्दशः रखना
  rationale: लैटिन की आत्म-संबंधी छाया और उनके लिए सुरक्षित यातना—दोनों को रखा गया है, पर हिन्दी को अनावश्यक रूप से अस्वाभाविक नहीं बनाया गया।
- issue: in nouissimis का कालगत अर्थ
  choice: अन्तिम समय में
  alternative: अन्तिम दिनों में
  rationale: मूल अभिव्यक्ति की अन्तकालीन व्यापकता को किसी अधिक विशिष्ट काल-योजना में बदले बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘यातना’ न्याय-संबंधी गंभीरता को बनाए रखती है।
