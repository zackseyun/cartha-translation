source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quare non accepisti in corde tuo quod futurum, sed quod in praesenti?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/016.yaml
  text: And why have you not taken to heart what is to come, rather than what is present?”
translation:
  language: hi
  text: और तुमने वर्तमान की बात के बजाय आनेवाली बात को अपने हृदय में क्यों नहीं ग्रहण किया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: accepisti in corde tuo
  choice: अपने हृदय में अपनाया
  rationale: यह लैटिन मुहावरा किसी बात को गंभीरता से ग्रहण करने या मन में बसाने का भाव देता है; यह रूपक को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: quod futurum
  choice: आनेवाली बात
  rationale: भविष्य में होनेवाली वास्तविकता का संकेत देता है और मूल की संक्षिप्तता तथा व्यापकता बनाए रखता है।
- source_word: quod in praesenti
  choice: वर्तमान की
  rationale: मूल में निहित ‘वर्तमान बात/स्थिति’ को संक्षिप्त हिन्दी में व्यक्त करता है; पहले पदबंध से ‘बात’ अर्थतः यहाँ भी लागू है।
theological_decisions:
- issue: भविष्य और वर्तमान के बीच तुलना
  choice: ‘वर्तमान की नहीं, बल्कि आनेवाली बात’
  alternative: ‘जो आनेवाला है, उसे वर्तमान की अपेक्षा’
  rationale: लैटिन वाक्य-विन्यास में ‘sed’ स्पष्ट विरोध दर्शाता है। चुना हुआ पाठ इस विरोध को सुरक्षित रखता है, बिना भविष्य के स्वरूप को किसी विशिष्ट धर्मवैज्ञानिक अर्थ तक सीमित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘हृदय में अपनाया’ मूल रूपक को बनाए रखता है।
