  text: For it will last like a week of years. This is my judgment and its ordinance,
translation:
  language: hi
  text: क्योंकि यह वर्षों के एक सप्ताह के समान समय तक बना रहेगा। यह मेरा निर्णय और उसका विधान है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ebdomada annorum
  choice: वर्षों के एक सप्ताह
  rationale: लैटिन की सामी-प्रभावित अभिव्यक्ति को निकटता से सुरक्षित रखा गया है; इसका आशय सात वर्षों की अवधि है, पर मूल रूपक को मुख्य पाठ में स्पष्ट करके सीमित नहीं किया गया।
- source_word: iudicium
  choice: न्याय
  rationale: यहाँ ईश्वरीय निर्णय और न्याय—दोनों अर्थों की संभावना बनाए रखने वाला स्वाभाविक हिन्दी शब्द है।
- source_word: constitutio
  choice: विधान
  rationale: निर्धारित व्यवस्था या ठहराए हुए नियम का भाव व्यक्त करता है और औपचारिक धार्मिक प्रसंग के अनुकूल है।
theological_decisions:
- issue: ‘वर्षों के एक सप्ताह’ की अवधि
  choice: रूपक को यथावत रखा गया
  alternative: सात वर्ष
  rationale: मूल पाठ की विशिष्ट अभिव्यक्ति और उसकी संभावित प्रतीकात्मकता को सीधे अर्थ में बदलकर समाप्त नहीं किया गया।
- issue: ‘उसका’ का संबंध
  choice: लैटिन eius के सर्वनाम-संबंध को ‘उसका’ के रूप में खुला रखा गया
  alternative: इस न्याय का विधान
  rationale: स्रोत में सर्वनाम का संदर्भ पूरी तरह स्पष्ट नहीं है; अनुवाद में उसे चुपचाप निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और स्रोत-सन्निकट शैली। खंड के अंत का अल्पविराम रखा गया है, क्योंकि वाक्य अगले पद में जारी होने का संकेत देता है।
