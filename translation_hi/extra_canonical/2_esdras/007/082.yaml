  text: 'The second way: because they cannot now make a good repentance so as to live[a].'
translation:
  language: hi
  text: 'दूसरा मार्ग यह है: क्योंकि वे ऐसा सच्चा पश्चाताप नहीं कर सकते जिससे वे जीवित रहें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Secunda via
  choice: दूसरा मार्ग यह है
  rationale: ‘via’ का मूल अर्थ ‘मार्ग’ रखते हुए हिन्दी में कथन को स्वाभाविक बनाने के लिए ‘यह है’ जोड़ा गया है।
- source_word: reuersionem bonam facere
  choice: सच्चा पश्चाताप करना
  rationale: ‘reuersio’ यहाँ मन-फिराव या पश्चाताप का भाव रखता है। शाब्दिक ‘अच्छा पश्चाताप’ अस्वाभाविक है; ‘सच्चा पश्चाताप’ आशय को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ut vivant
  choice: जिससे वे जीवित रहें
  rationale: उद्देश्य अथवा परिणाम की संभावित सूक्ष्मता को ‘जिससे’ द्वारा खुला रखा गया है।
theological_decisions:
- issue: क्या अनुवाद में ‘अब’ जोड़ा जाए
  choice: ‘अब’ नहीं जोड़ा गया
  alternative: ‘अब वे ... नहीं कर सकते’
  rationale: उपलब्ध लैटिन में nunc या iam जैसा कोई स्पष्ट कालवाचक शब्द नहीं है। मरणोत्तर प्रसंग से समय का संकेत मिल सकता है, पर उसे मुख्य पाठ में जोड़ना मूल कथन से अधिक स्पष्टता थोपेगा।
- issue: vivant का अर्थ
  choice: ‘जीवित रहें’
  alternative: ‘जीवन पाएँ’
  rationale: ‘जीवित रहें’ लैटिन क्रिया vivant के अधिक निकट है और उद्धार-संबंधी अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। उपलब्ध स्रोत-पंक्ति अंत में कटी हुई है, इसलिए पूर्ण वाक्य का आधार दिए गए पाठ के साथ समीक्षा-सामग्री में उद्धृत लैटिन पुनर्निर्माण और परामर्श-अनुवाद है।
