source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: requiescent enim per septem ordines. Ordo primus, quoniam cum labore multo certati sunt, ut uincerent cum eis plasmatum cogitamentum malum, ut non eas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/092.yaml
  text: 'The first order: because with much struggle they have fought to overcome the evil thought formed with them, so that it might not lead them astray from life into death.'
translation:
  language: hi
  text: 'क्योंकि वे सात क्रमों के अनुसार विश्राम करेंगी। पहला क्रम यह है: उन्होंने बहुत परिश्रम से उनके साथ गढ़े गए उस बुरे विचार पर विजय पाने के लिए संघर्ष किया, ताकि वह उन्हें जीवन से भटकाकर मृत्यु की ओर न ले जाए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: requiescent
  choice: विश्राम करेंगी
  rationale: भविष्यकाल और विश्राम के मूल अर्थ को बनाए रखा गया है; स्त्रीलिंग बहुवचन का संबंध प्रसंग में निहित आत्माओं से है।
- source_word: per septem ordines
  choice: सात क्रमों में
  rationale: ordines की क्रमबद्ध अवस्थाओं की धारणा को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: cum labore multo certati sunt
  choice: बहुत संघर्ष करके ... लड़ाई लड़ी
  rationale: मूल में परिश्रम और संघर्ष दोनों पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: plasmatum cogitamentum malum
  choice: वह बुरा विचार ... जो ... रचा गया था
  rationale: plasmatum के ‘गढ़े/रचे गए’ भाव और cogitamentum के ‘विचार’ अर्थ को बनाए रखता है।
- source_word: a vita in mortem
  choice: जीवन से भटकाकर मृत्यु की ओर
  rationale: स्रोत में निहित जीवन से मृत्यु की दिशा और पथभ्रष्ट करने के भाव को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: बुरे विचार की उत्पत्ति और मनुष्य से उसका संबंध
  choice: जो उनके साथ ही रचा गया था
  alternative: जो उनके भीतर उत्पन्न हुआ था
  rationale: cum eis plasmatum की असामान्य और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति को सुरक्षित रखा गया है; इसे केवल आंतरिक उत्पत्ति मानकर अर्थ सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘क्रम’ और ‘रचा गया’ जैसे शब्द स्रोत की विशिष्ट भाषा और अस्पष्टता को बनाए रखते हैं।
