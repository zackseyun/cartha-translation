  text: 'dixisti ? Et dixit : septem diebus erit libertas earum, ut uideant qui praedicti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/101.yaml
  text: And he said[a], “For seven days they will have freedom, so that they may see the things that were foretold.”
translation:
  language: hi
  text: और उसने कहा[a], “सात दिनों तक उन्हें स्वतंत्रता मिलेगी, ताकि वे उन बातों को देख सकें जिनकी पहले से घोषणा की गई थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसने मुझसे कहा, ‘सात दिनों तक उन्हें स्वतंत्रता मिलेगी, ताकि वे उन बातों को देख सकें जिनके विषय में तुम्हें बताया गया है; और इसके बाद वे अपने निवास-स्थानों में एकत्र की जाएँगी।’”
    reason: पूर्ववर्ती पाठ-रूप और पद-विभाजन को दर्ज करता है; उपलब्ध उद्धृत लैटिन में ‘मुझसे’ और अंतिम वाक्यांश नहीं हैं।
lexical_decisions:
- source_word: libertas
  choice: स्वतंत्रता
  rationale: यह लैटिन संज्ञा के अर्थ को सीधे बनाए रखता है और आत्माओं को सात दिनों तक मिली छूट या स्वतंत्र अवस्था को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: praedicti
  choice: जिनकी पहले से घोषणा की गई थी
  rationale: यह पूर्वकथन के निष्क्रिय भाव को सुरक्षित रखता है; केवल ‘तुम्हें बताया गया था’ कहने से जो प्रत्यक्ष संबोधन जुड़ जाता, उससे बचा गया है।
theological_decisions:
- issue: इस स्वतंत्रता का स्वरूप
  choice: ‘स्वतंत्रता’ को अस्पष्ट ही रखा गया है
  alternative: ‘भटकने की छूट’ या ‘स्वतंत्र रूप से रहने का अवसर’
  rationale: स्रोत इस स्वतंत्रता की प्रकृति स्पष्ट नहीं करता; अधिक विशिष्ट अनुवाद परलोक-संबंधी अर्थ को अनावश्यक रूप से निश्चित कर देगा।
- issue: किसे पूर्वघोषणा की गई थी
  choice: निष्क्रिय और अवैयक्तिक रचना रखी गई है
  alternative: ‘जिनके विषय में तुम्हें बताया गया था’
  rationale: लैटिन praedicti में ‘तुम्हें’ स्पष्ट नहीं है, इसलिए उस संबंध को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण रूप अपनाया गया है। ‘उसने’ का संदर्भ पूर्ववर्ती प्रसंग से स्पष्ट माना गया है; स्रोत की संक्षिप्तता और अस्पष्टता बनाए रखी गई है।
