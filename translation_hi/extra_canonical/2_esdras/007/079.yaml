translation:
  language: hi
  text: उस व्यक्ति के पास, जिसने उसे दिया था, सबसे पहले परमप्रधान की महिमा की आराधना करने के लिए। और यदि वह वास्तव में उन लोगों में से हो जिन्होंने परमप्रधान के मार्ग को ठुकराया और उसका पालन नहीं किया, और उन लोगों में से जिन्होंने व्यवस्था का तिरस्कार किया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad eum qui dedit
  choice: उसके पास जिसने उसे दिया था
  rationale: खंड पिछले वाक्य की निरंतरता है। लैटिन में निहित कर्म/स्त्रीलिंग संदर्भ को हिन्दी में स्वाभाविक सर्वनाम ‘उसे’ से रखा गया है, बिना संदर्भ से अधिक स्पष्ट किए।
- source_word: adorare
  choice: आराधना करने
  rationale: धार्मिक संदर्भ में ‘आराधना’ आधुनिक, गरिमापूर्ण और लैटिन infinitive का सीधा अर्थ व्यक्त करता है।
- source_word: gloriam Altissimi
  choice: परमप्रधान की महिमा
  rationale: Altissimus के पारंपरिक और अर्थ-सटीक हिन्दी रूप ‘परमप्रधान’ को अपनाया गया है।
- source_word: primum
  choice: सबसे पहले
  rationale: क्रम अथवा प्राथमिकता के वास्तविक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: spreuerunt
  choice: ठुकराया
  rationale: यह केवल उपेक्षा नहीं, बल्कि जानबूझकर अस्वीकार या तिरस्कार करने की तीव्रता व्यक्त करता है।
- source_word: non seruauerunt uiam
  choice: मार्ग ... का पालन नहीं किया
  rationale: सेमिटिक धार्मिक मुहावरे में ‘मार्ग को मानना/बनाए रखना’ का स्वाभाविक हिन्दी अर्थ ‘मार्ग का पालन करना’ है।
- source_word: contempserunt legem
  choice: व्यवस्था का तिरस्कार किया
  rationale: contemnere की अवमानना को बनाए रखता है; lex के लिए धार्मिक साहित्य में परिचित ‘व्यवस्था’ प्रयुक्त है।
theological_decisions:
- issue: प्रारंभिक खंड का पिछले पद से संबंध
  choice: अपूर्ण वाक्यांश के रूप में प्रस्तुत किया गया
  alternative: इसे स्वतंत्र, पूर्ण वाक्य बनाना
  rationale: दिया गया लैटिन पाठ पद-विभाजन के कारण पिछले पद के अंत से आरंभ होता है; अनुवाद स्रोत की वास्तविक अपूर्ण वाक्य-संरचना को नहीं छिपाता।
- issue: ‘व्यवस्था’ के स्वामी का उल्लेख
  choice: केवल ‘व्यवस्था’
  alternative: ‘उसकी व्यवस्था’
  rationale: दिए गए लैटिन में legem के साथ स्वत्ववाचक सर्वनाम नहीं है; इसलिए धार्मिक संबंध स्पष्ट होने पर भी उसे पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण धार्मिक शैली। स्रोत-पाठ स्वयं आरंभ और अंत दोनों ओर वाक्यखंड है, इसलिए हिन्दी में भी उसका अधूरापन और अंतिम अल्पविराम सुरक्षित रखा गया है।
