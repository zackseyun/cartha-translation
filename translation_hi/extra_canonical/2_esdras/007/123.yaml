  yaml_path: translation/extra_canonical/2_esdras/007/123.yaml
  text: And because paradise will be shown, whose fruit remains incorruptible, in which there is fullness and healing,
translation:
  language: hi
  text: और क्योंकि परादीस प्रकट किया जाएगा, जिसका फल अविनाशी बना रहता है, और जिसमें तृप्ति और चंगाई है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: paradisus
  choice: स्वर्गलोक
  rationale: यहाँ भावी प्रतिफल के स्थान के रूप में ‘परादीस’ अभिप्रेत है; ‘स्वर्गलोक’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है तथा इसे सामान्य ‘बगीचे’ तक सीमित नहीं करता।
- source_word: ostendetur
  choice: प्रकट किया जाएगा
  rationale: लैटिन के भविष्यत् कर्मवाच्य का सीधा और स्वाभाविक रूप।
- source_word: fructus incorruptus perseverat
  choice: उसका फल कभी नष्ट नहीं होता
  rationale: ‘incorruptus’ की अविनाशी/अक्षय अवस्था और ‘perseverat’ की निरंतरता दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: saturitas
  choice: तृप्ति
  rationale: पूर्ण संतोष अथवा भरपूरी के भाव को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: medella
  choice: चंगाई
  rationale: लैटिन शब्द उपचार या आरोग्य का बोध देता है; ‘चंगाई’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: quoniam
  choice: क्योंकि
  rationale: कारणसूचक अर्थ को सुरक्षित रखता है; इसे शर्तसूचक ‘यदि’ नहीं बनाया गया।
theological_decisions:
- issue: ‘paradisus’ का स्वरूप
  choice: स्वर्गलोक
  alternative: परादीस / वाटिका
  rationale: पाठ इसे भावी रूप से प्रकट होने वाले, अविनाशी फल और चंगाई से युक्त स्थान के रूप में प्रस्तुत करता है। ‘स्वर्गलोक’ इस पारलौकिक अर्थ को स्पष्ट रखता है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़ने के।
- issue: ‘incorruptus’ का अर्थ
  choice: कभी नष्ट नहीं होता
  alternative: अविनाशी बना रहता है
  rationale: पाठ फल की स्थायी अक्षयता बताता है। चयनित रूप सामान्य हिन्दी में सहज है और मूल दावे की शक्ति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। वाक्य मूल की अपूर्ण, अगले पद से जुड़ती संरचना को अंत के दीर्घ विराम-चिह्न द्वारा बनाए रखता है।
