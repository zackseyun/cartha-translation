id: 2ES.7.113
reference: 2 Esdras 7:113
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dies enim iudicii erit finis temporis huius et initium futuri inmortalistemporis, in quo pertransivit corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/113.yaml
  text: For the day of judgment will be the end of this time and the beginning of the immortal time to come[a], in which corruption has passed away,
translation:
  language: hi
  text: क्योंकि न्याय का दिन इस वर्तमान समय का अंत और आने वाले अमर समय[a] का आरम्भ होगा, जिसमें नाशशीलता समाप्त हो चुकी होगी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भविष्य का अमर समय’।
    reason: लैटिन ‘futuri inmortalis temporis’ का अधिक शाब्दिक वैकल्पिक रूप सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: Dies enim iudicii
  choice: क्योंकि न्याय का दिन
  rationale: ‘Dies iudicii’ का सीधा और स्वाभाविक हिन्दी रूप ‘न्याय का दिन’ है; ‘enim’ पिछले कथन से कारणसूचक संबंध जोड़ता है।
- source_word: temporis huius
  choice: इस वर्तमान समय
  rationale: ‘huius’ का अर्थ ‘इस’ है; ‘वर्तमान’ जोड़ने से इस समय और आनेवाले समय का स्रोत-पाठ में निहित विरोध सामान्य हिन्दी में स्पष्ट होता है।
- source_word: futuri inmortalis temporis
  choice: आनेवाले अमर समय
  rationale: यह पदबंध भविष्य में आनेवाले, अमर समय को दर्शाता है और अपोकैलिप्टिक ‘आनेवाले समय’ की ध्वनि बनाए रखता है।
- source_word: corruptela
  choice: नाशशीलता
  rationale: यहाँ शब्द वर्तमान व्यवस्था के क्षय, विनाश और भ्रष्ट हो जाने की दशा को सूचित करता है; ‘नाशशीलता’ इस व्यापक अर्थ को नैतिक भ्रष्टता तक सीमित नहीं करती।
- source_word: pertransivit
  choice: बीत चुकी होगी
  rationale: लैटिन पूर्ण भूत ‘बीत चुकी है’ कहता है, पर भविष्य के अमर समय के भीतर से वर्णित स्थिति को हिन्दी में भविष्य-पूर्ण रूप स्वाभाविक और अर्थनिष्ठ ढंग से व्यक्त करता है।
theological_decisions:
- issue: दो समयों का युगान्तकारी विरोध
  choice: ‘इस वर्तमान समय’ और ‘आनेवाले अमर समय’
  alternative: ‘इस युग’ और ‘आनेवाले अमर युग’
  rationale: स्रोत में दोनों स्थानों पर ‘tempus’ है, इसलिए ‘समय’ बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘युग’ नहीं बनाया गया।
- issue: corruptela का आशय
  choice: नाशशीलता
  alternative: भ्रष्टता
  rationale: ‘भ्रष्टता’ नैतिक पाप का अर्थ अधिक प्रमुख कर सकती है, जबकि प्रसंग में क्षय और मृत्यु के अधीन अवस्था का अंत अभिप्रेत हो सकता है; ‘नाशशीलता’ उस तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और युगान्तकारी लहजा। वाक्य के अंत में अल्पविराम रखा गया है, क्योंकि स्रोत-पाठ आगे जारी रहता है।
