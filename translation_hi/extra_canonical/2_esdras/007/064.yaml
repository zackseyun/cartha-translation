  yaml_path: translation/extra_canonical/2_esdras/007/064.yaml
  text: But now understanding grows with us[a], and because of this we are tormented, because we perish knowing it.
translation:
  language: hi
  text: पर अब समझ हमारे साथ-साथ बढ़ती है, और इसी कारण हम यातना सहते हैं, क्योंकि हम अपने नाश को जानते हुए नाश होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sensus
  choice: समझ
  rationale: यहाँ sensus केवल इंद्रिय-बोध नहीं, बल्कि अपने अस्तित्व और आसन्न नाश की चेतन समझ को दर्शाता है।
- source_word: nobiscum crescit
  choice: हमारे साथ-साथ बढ़ती है
  rationale: लैटिन की संग-साथ बढ़ने की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: torquemur
  choice: हम यातना सहते हैं
  rationale: मानसिक और अस्तित्वगत पीड़ा के अर्थ को स्पष्ट करता है, बिना उसे केवल शारीरिक यातना तक सीमित किए।
- source_word: perimus scientes
  choice: हम अपने नाश को जानते हुए नाश होते हैं
  rationale: 'scientes को परिस्थितिवाचक रीति में लिया गया है: मनुष्य अपने नाश से अवगत रहते हुए नाश होते हैं; इसे रियायती अर्थ ‘जानते हुए भी’ नहीं दिया गया।'
theological_decisions:
- issue: क्या ज्ञान को उद्धार में विफल साधन या नाश की चेतना माना जाए
  choice: नाश की चेतना
  alternative: जानते हुए भी हम नाश होते हैं
  rationale: प्रसंग का तर्क यह है कि sensus मनुष्य को अपने विनाश का बोध कराता है और यही बोध पीड़ा का कारण बनता है; रियायती ‘भी’ इस संबंध को बदल देता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने नाश को जानते हुए’ कारणगत चेतना को स्पष्ट करता है और मूल की theological tension को अनावश्यक रूप से नहीं सुलझाता।
