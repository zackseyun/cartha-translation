  source_fidelity: The draft correctly conveys the conditional, the temporal phrase “after death,” and the uncertainty of fortassis (“perhaps”). However, “न्याय के सामने आनेवाले” is not the most accurate idiomatic rendering of Latin in iudicio venientes (“coming/appearing in judgment”); it can sound like appearing before an abstract ‘judgment’ rather than appearing for judicial judgment.
  naturalness: “मृत्यु के बाद न्याय के सामने आनेवाले न होते” is understandable but somewhat stiff and calqued. “न्याय के लिए उपस्थित न होना होता” is modern, dignified Hindi and keeps the counterfactual construction natural.
  terminology: “न्याय” appropriately retains the judicial-theological breadth of iudicium without importing the narrower sense of punishment. No doctrinal interpretation is added.
