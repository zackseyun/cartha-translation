  text: And if after death we were not coming into judgment, perhaps it would have been better for us.”
translation:
  language: hi
  text: और यदि हमें मृत्यु के बाद न्याय के लिए उपस्थित न होना होता, तो शायद हमारे लिए अच्छा होता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post mortem
  choice: मृत्यु के बाद
  rationale: लातीनी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: in iudicio uenientes
  choice: न्याय के सामने आनेवाले
  rationale: न्यायिक उपस्थिति के भाव को बनाए रखता है और केवल दंड पाने का अर्थ आरोपित नहीं करता।
- source_word: melius fortassis nobis uenisset
  choice: तो शायद हमारे लिए बेहतर होता
  rationale: लातीनी अनिश्चितता ‘fortassis’ को ‘शायद’ से और प्रतिकल्पित लाभ की स्वाभाविक हिन्दी अभिव्यक्ति से प्रस्तुत करता है।
theological_decisions:
- issue: मृत्यु के बाद न्याय का स्वरूप
  choice: न्याय के सामने आना
  alternative: न्याय-दंड पाना
  rationale: मूल ‘in iudicio uenientes’ न्याय में उपस्थित होने की बात कहता है; वह अपने-आप दंडादेश निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; मूल के प्रतिकल्पित कथन और ‘शायद’ द्वारा व्यक्त अनिश्चितता सुरक्षित रखी गई है।
