id: 2ES.7.122
reference: 2 Esdras 7:122
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam incipiet gloria Altissimi protegere eos qui caste conversati sunt, nos autem pessimis viis ambulavimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/122.yaml
  text: And since the glory of the Most High will begin to protect those who have conducted themselves chastely[a], but we have walked in the most evil ways?
translation:
  language: hi
  text: और क्योंकि परमप्रधान की महिमा उन लोगों की रक्षा करने लगेगी जिन्होंने पवित्रता से जीवन बिताया है[a], जबकि हम सबसे बुरे मार्गों पर चले हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिनका आचरण पवित्र रहा है’।
    reason: caste conversati sunt का वैकल्पिक, अधिक औपचारिक और आचरण-केंद्रित निरूपण देता है।
lexical_decisions:
- source_word: quoniam
  choice: क्योंकि
  rationale: यह कारणसूचक अर्थ को बनाए रखता है; इसे शर्तसूचक ‘यदि’ नहीं बनाया गया।
- source_word: gloria Altissimi
  choice: परमप्रधान की महिमा
  rationale: Altissimi के पारंपरिक और स्वाभाविक धार्मिक पदनाम तथा gloria के प्रत्यक्ष अर्थ को सुरक्षित रखता है।
- source_word: protegere
  choice: रक्षा करने
  rationale: मूल क्रिया के व्यापक अर्थ ‘बचाना/संरक्षण देना’ को सीधे व्यक्त करता है।
- source_word: caste conversati sunt
  choice: पवित्रता से जीवन बिताया है
  rationale: caste को केवल यौन-संयम तक सीमित न करके व्यापक नैतिक और धार्मिक शुद्धता के अर्थ में प्रस्तुत करता है; conversati sunt जीवन-आचरण को सूचित करता है।
- source_word: pessimis viis ambulavimus
  choice: हम अत्यन्त बुरे मार्गों पर चले हैं
  rationale: मार्ग पर चलने के मूल रूपक और pessimis की तीव्रता दोनों को बनाए रखता है।
theological_decisions:
- issue: caste का अर्थ-क्षेत्र
  choice: पवित्रता से
  alternative: संयमपूर्वक / शुद्धता से
  rationale: संदर्भ में इसका विरोध ‘अत्यन्त बुरे मार्गों’ से है, इसलिए व्यापक धर्मनिष्ठ और नैतिक पवित्रता अभिप्रेत है; केवल यौन शुचिता नहीं।
- issue: वाक्य का प्रश्नात्मक और विरोधात्मक तनाव
  choice: ‘क्योंकि ... जबकि ...?’ की संरचना बनाए रखी
  alternative: इसे पूर्ण कथन या स्पष्ट निष्कर्ष में बदलना
  rationale: लैटिन पाठ का यह अंश प्रश्न-श्रृंखला का भाग है और स्वयं कुछ असामान्य/अपूर्ण-सा है; अनुवाद में निहित तर्क को कृत्रिम रूप से पूरा नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, साधारण पाठकों के लिए बोधगम्य शैली। ‘पवित्रता’ व्यापक नैतिक-धार्मिक शुद्धता बताती है, और ‘मार्गों पर चले’ मूल बाइबिलीय रूपक को बनाए रखता है।
