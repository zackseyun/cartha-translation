  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et propter hoc torquemur, quoniam scientes perimus. Lugeat hominum genus, et agrestes bestiae laetentur, lugeant omnes qui nati sunt, quadripedia uero et pecora
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/065.yaml
  text: And because of this we are tormented, because though we know, we perish. Let the race of man mourn, and let the beasts of the field rejoice; let all who have been born lament, but let the four-footed animals and the cattle be glad.
translation:
  language: hi
  text: और इसी कारण हम यातना सहते हैं, क्योंकि जानते हुए भी हम नाश हो जाते हैं। मानव जाति शोक करे और जंगली पशु आनंद मनाएँ; जितने भी जन्मे हैं, वे सब विलाप करें, पर चौपाए और मवेशी प्रसन्न हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: torquemur
  choice: हम यातना सहते हैं
  rationale: लैटिन क्रिया का अर्थ पीड़ा या यातना झेलना है; यह चयन उसके प्रबल भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: scientes
  choice: जानते हुए भी
  rationale: 'वर्तमान कृदंत के concessive तनाव को व्यक्त करता है: ज्ञान होने पर भी विनाश होता है।'
- source_word: perimus
  choice: हम नाश हो जाते हैं
  rationale: ‘नष्ट होना/नाश होना’ के अर्थ को बनाए रखता है और प्रसंग की गंभीरता के अनुरूप है।
- source_word: hominum genus
  choice: मानव जाति
  rationale: समस्त मनुष्य-समुदाय के लिए संक्षिप्त और प्रतिष्ठित आधुनिक हिन्दी।
- source_word: agrestes bestiae
  choice: वन-पशु
  rationale: जंगली अथवा खुले प्रदेश के पशुओं को सहज हिन्दी में व्यक्त करता है।
- source_word: quadripedia uero et pecora
  choice: पर चौपाए और पालतू पशु
  rationale: uero के विरोधसूचक बल को ‘पर’ से और pecora को पशुधन/घरेलू पशुओं के सामान्य अर्थ में व्यक्त किया गया है।
theological_decisions:
- issue: ज्ञान और विनाश के बीच संबंध
  choice: ‘क्योंकि जानते हुए भी हम नाश हो जाते हैं’
  alternative: ‘क्योंकि हम जानते हैं कि हम नाश होते हैं’
  rationale: लैटिन scientes की पूरक वस्तु स्पष्ट नहीं है। स्रोत की संक्षिप्तता और तनाव को बनाए रखते हुए ज्ञान के बावजूद विनाश का स्वाभाविक पाठ चुना गया; यह किसी विशिष्ट सैद्धांतिक अर्थ को नहीं जोड़ता।
- issue: मनुष्यों के शोक और पशुओं के आनन्द का विरोध
  choice: आज्ञार्थक शैली को यथावत रखा गया
  alternative: इसे कारणात्मक या भविष्यवाचक कथन बनाना
  rationale: lugeat/laetentur/lugeant के लैटिन subjunctive को ‘शोक करे/आनन्द मनाएँ/विलाप करें’ से दर्शाया गया है, बिना यह तय किए कि ये कामना, आह्वान या अलंकारिक घोषणा हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर और काव्यात्मक किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर वाक्य-रचना और मनुष्य-पशु विरोध को संरक्षित किया गया है।
