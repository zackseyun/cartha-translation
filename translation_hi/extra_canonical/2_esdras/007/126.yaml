id: 2ES.7.126
reference: 2 Esdras 7:126
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non enim cogitavimus viventes quando iniquitatem faciebamus, quidincipientes post mortem pati.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/126.yaml
  text: For while we lived and committed iniquity[a], we did not consider what we would begin to suffer after death.”
translation:
  language: hi
  text: क्योंकि जब हम जीवित थे और अधर्म करते थे, तब हमने यह नहीं सोचा कि मरने के बाद हम क्या सहना शुरू करेंगे।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध लैटिन पाठ व्याकरण की दृष्टि से कठिन है; आशय संभवतः ‘हम क्या सहना शुरू करेंगे’ है।
    reason: प्रेषित पाठ में incipientes का रूप वाक्य-संरचना से असंगत प्रतीत होता है, जबकि साक्ष्य और संदर्भ आरंभात्मक क्रिया के भाव का समर्थन करते हैं।
lexical_decisions:
- source_word: iniquitatem faciebamus
  choice: अधर्म करते थे
  rationale: ‘अधर्म’ iniquitas के नैतिक और धार्मिक अर्थ को बनाए रखता है, और ‘करते थे’ लैटिन के अपूर्ण भूतकाल में व्यक्त जारी/अभ्यस्त आचरण को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: post mortem
  choice: मरने के बाद
  rationale: यह शाब्दिक अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: incipientes … pati
  choice: सहना शुरू करेंगे
  rationale: पाठ में निहित आरंभात्मक भाव (‘सहना शुरू करना’) को सुरक्षित रखा गया है; इसे बाध्यता (‘सहना पड़ेगा’) में नहीं बदला गया।
theological_decisions:
- issue: मृत्यु के बाद दुःख के आरंभ का आरंभात्मक भाव
  choice: ‘क्या सहना शुरू करेंगे’
  alternative: ‘क्या सहना पड़ेगा’
  rationale: लैटिन पाठ दुःख के आरंभ पर बल देता है, केवल उसकी अनिवार्यता पर नहीं; इस भेद का परलोक-विषयक आशय हो सकता है, इसलिए उसे समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कारणसूचक ‘क्योंकि’ और कालगत ‘जब…तब’ से लैटिन वाक्य का संबंध स्पष्ट किया गया है, बिना उसके परलोक-विषयक तनाव को कम किए।
