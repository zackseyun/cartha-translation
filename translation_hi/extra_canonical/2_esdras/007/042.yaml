source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nem, neque pluuiam, neque rorem, Neque meridiem, neque noctem, neque ante lucem, neque nitorem, neque claritatem, neque lucem, nisi solummodo splendorem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/042.yaml
  text: neither rain nor dew, neither noon nor night nor dawn, neither brightness nor splendor nor light, but only the radiance of the glory of the Most High, by which all will begin to see what has been set before them.
translation:
  language: hi
  text: न वर्षा होगी, न ओस; न दोपहर, न रात, न भोर; न चमक, न उज्ज्वलता, न प्रकाश—केवल परमप्रधान की महिमा की दीप्ति होगी[a], जिसके द्वारा सब लोग अपने सामने रखी हुई वस्तुओं को देखने लगेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कराए गए लैटिन अंश का पाठ यहाँ ‘केवल दीप्ति’ पर समाप्त हो जाता है; ‘परमप्रधान की महिमा’ और इसके बाद का वाक्य परामर्श-पाठ में संरक्षित है, इसलिए पूर्ण लैटिन संस्करण से इसकी पुनः जाँच अपेक्षित है।
    reason: दिए गए मूल-भाषा अंश और अंग्रेज़ी परामर्श-पाठ की सीमा में अंतर को पारदर्शी रूप से बताना आवश्यक है।
lexical_decisions:
- source_word: pluuiam ... rorem
  choice: वर्षा ... ओस
  rationale: दोनों प्राकृतिक जल-संबंधी पदों को अलग-अलग और सीधे रूप में रखा गया है; संशोधित अंग्रेज़ी परामर्श-पाठ में भी इनका पुनर्स्थापन हुआ है।
- source_word: meridiem ... noctem ... ante lucem
  choice: दोपहर ... रात ... भोर
  rationale: meridiem का सामान्य अर्थ ‘दोपहर’ और ante lucem का प्रसंगानुकूल प्राकृतिक अर्थ ‘भोर’ है।
- source_word: nitorem ... claritatem ... lucem
  choice: चमक ... उज्ज्वलता ... प्रकाश
  rationale: तीनों निकटार्थी शब्दों का भेद बनाए रखने के लिए अलग हिंदी पद चुने गए हैं; उन्हें एक ही शब्द में समेटा नहीं गया।
- source_word: nisi solummodo splendorem
  choice: केवल ... दीप्ति
  rationale: nisi solummodo के अपवादात्मक बल को सहज हिंदी में ‘केवल’ से व्यक्त किया गया है; splendorem के लिए ‘दीप्ति’ गरिमापूर्ण और स्वाभाविक है।
- source_word: claritatis Altissimi
  choice: परमप्रधान की महिमा
  rationale: यह पद दिए गए लैटिन अंश में प्रत्यक्षतः नहीं है, पर परामर्श-पाठ की ‘glory of the Most High’ को स्वाभाविक बाइबिलीय हिंदी में प्रस्तुत करता है।
- source_word: per quod incipient omnes videre quae proposita sunt
  choice: जिसके द्वारा सब लोग अपने सामने रखी हुई वस्तुओं को देखने लगेंगे
  rationale: अंग्रेज़ी परामर्श-पाठ में संरक्षित आशय को स्पष्ट हिंदी में रखा गया है, साथ ही ‘क्या’ देखा जाएगा इसे अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: प्रकाश का एकमात्र स्रोत
  choice: केवल परमप्रधान की महिमा की दीप्ति
  alternative: परमप्रधान की महिमा का प्रकाश मात्र
  rationale: ‘दीप्ति’ और ‘महिमा’ को अलग रखकर निकटवर्ती प्रकाश-संबंधी पदों तथा परमप्रधान की महिमा के बीच संबंध सुरक्षित रहता है।
- issue: ‘सामने रखी हुई वस्तुओं’ की पहचान
  choice: सामने रखी हुई वस्तुओं
  alternative: उनके लिए ठहराई गई बातें
  rationale: मूल अभिव्यक्ति की अस्पष्टता बनाए रखी गई है; इसे न्याय, प्रतिफल या दंड जैसे किसी एक धर्मवैज्ञानिक अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज पाठ। समानार्थी प्रकाश-पदों की क्रमिकता बनाए रखने के लिए ‘चमक, उज्ज्वलता, प्रकाश, दीप्ति’ का प्रयोग किया गया है। ‘होगी’ जोड़कर सूची को स्वाभाविक हिंदी वाक्य बनाया गया है।
