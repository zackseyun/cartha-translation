  text: 'And he answered and said[a], “This is the thought of the struggle that the man born on the earth has fought:'
translation:
  language: hi
  text: तब उसने उत्तर दिया, “यह उस संघर्ष का विचार है, जिसे पृथ्वी पर जन्मे मनुष्य ने लड़ा है:[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह उस संघर्ष का विचार है, जिसे पृथ्वी पर जन्मे मनुष्य को लड़ना है:”
    reason: पूर्ववर्ती कर्तव्यसूचक अनुवाद को दर्ज करता है; पर उपलब्ध लातीनी certavit पूर्ण भूतकाल है, जिसका सीधा अर्थ ‘लड़ा है’ है।
lexical_decisions:
- source_word: cogitamentum
  choice: विचार
  rationale: लातीनी शब्द का सीधा अर्थ ‘विचार’ या ‘चिंतन’ है; ‘अर्थ’ कहना व्याख्यात्मक होता।
- source_word: certaminis ... certavit
  choice: संघर्ष ... किया है
  rationale: संज्ञा और उसी मूल की क्रिया के संबंध को यथासंभव बनाए रखते हुए स्वाभाविक हिन्दी दी गई है; क्रिया का पूर्ण भूतकाल भी सुरक्षित है।
- source_word: homo
  choice: मनुष्य
  rationale: यहाँ शब्द सामान्य मानव के लिए है; ‘मनुष्य’ किसी विशिष्ट पुरुष या व्यक्ति का अनावश्यक संकेत नहीं देता।
- source_word: super terram natus est
  choice: पृथ्वी पर जन्मे
  rationale: स्थान-संबंधी अर्थ को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: certavit का काल और भाव
  choice: ने किया है
  alternative: को करना है / करना पड़ता है
  rationale: उपलब्ध लातीनी पाठ में certavit पूर्ण भूतकाल है, न कि अनिवार्यता बताने वाला रूप। फिर भी पाठ-परंपरा में कर्तव्यसूचक समझ पाए जाने के कारण विकल्प पादटिप्पणी में रखा गया है।
- issue: homo की व्यापकता
  choice: मनुष्य
  alternative: वह मनुष्य
  rationale: लातीनी वाक्य की व्याकरणिक निश्चितता के बावजूद संदर्भ सामान्य मानव-अनुभव की ओर संकेत कर सकता है; हिन्दी में ‘मनुष्य’ इस व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘उत्तर दिया और कहा’ की लातीनी पुनरुक्ति को स्वाभाविक हिन्दी में ‘उत्तर दिया’ किया गया है। पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित है।
