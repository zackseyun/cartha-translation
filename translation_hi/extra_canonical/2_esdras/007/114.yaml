  text: self-indulgence has been ended, unbelief has been cut off, but righteousness has grown and truth has arisen.
translation:
  language: hi
  text: असंयम समाप्त कर दिया गया है, अविश्वास काट डाला गया है; पर धार्मिकता बढ़ी है और सत्य उदित हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: intemperantia
  choice: असंयम
  rationale: यह लैटिन शब्द आत्म-नियंत्रण के अभाव और अनियंत्रित प्रवृत्ति को व्यक्त करता है; ‘असंयम’ आधुनिक हिन्दी में संक्षिप्त और व्यापक है।
- source_word: soluta est
  choice: समाप्त कर दिया गया है
  rationale: शाब्दिक अर्थ ‘खोल दिया गया’ भी हो सकता है, पर इस संदर्भ में किसी बुराई के निष्प्रभावी या समाप्त होने का भाव अधिक स्वाभाविक है।
- source_word: incredulitas
  choice: अविश्वास
  rationale: यह विश्वास न करने की अवस्था को सीधे व्यक्त करता है और आवश्यक अस्पष्टता बनाए रखता है।
- source_word: abscisa est
  choice: काट डाला गया है
  rationale: मूल के सशक्त छेदन-रूपक को बनाए रखा गया है।
- source_word: iustitia
  choice: धार्मिकता
  rationale: यह नैतिक और ईश्वर-संबंधी सही अवस्था, दोनों के लिए प्रचलित बाइबलीय हिन्दी पद है।
- source_word: orta est
  choice: उदित हुआ है
  rationale: मूल में उगने, प्रकट होने या उदय होने का भाव है; ‘उदित’ सत्य के प्रकट होने को गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: iustitia का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ अमूर्त सद्गुणों की समानांतर सूची है; इसलिए ‘धार्मिकता’ ‘न्याय’ की अपेक्षा व्यापक अर्थ बनाए रखती है।
- issue: soluta est की व्याख्या
  choice: समाप्त कर दिया गया है
  alternative: खोल दिया गया है / मुक्त कर दिया गया है
  rationale: ‘असंयम को मुक्त कर दिया गया’ संदर्भ में विपरीत अर्थ दे सकता है; इसलिए विनाश या अंत का प्रसंगानुकूल भाव चुना गया, बिना किसी विशिष्ट सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और संक्षिप्त शैली। पहले दो खंडों में निष्क्रिय क्रिया और बाद के दो खंडों में वृद्धि तथा उदय की छवियाँ सुरक्षित रखी गई हैं।
