id: 2ES.7.95
reference: 2 Esdras 7:95
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uerunt quae per fidem data est lex. Quartus ordo, intellegentes requiem quam nunc in promptuariis congregati requiescent cum silentio multo ab angelis conseruati, †atque in nouissimis eorum manentem gloriam.† Quintus ordo, exultantes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/095.yaml
  text: 'The fourth order: they understand the rest in which[a], now gathered in their storehouses, they will rest in great silence, guarded by angels, and the glory that remains for them in the last times.'
translation:
  language: hi
  text: 'चौथा क्रम: वे उस विश्राम को समझते हैं जिसमें वे अब भंडारों में एकत्र किए गए होकर, स्वर्गदूतों की सुरक्षा में, गहरे मौन से विश्राम करेंगे, और उस महिमा को भी जो अंतिम समय में उनके लिए बनी हुई है[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम समय में धर्मियों के लिए बनी हुई महिमा से संबंधित लैटिन वाक्यांश का पाठ अनिश्चित है; फिर भी अभी सुरक्षित विश्राम और बाद की महिमा का समग्र भाव स्पष्ट है।
    reason: textual_variant
lexical_decisions:
- source_word: Quartus ordo
  choice: चौथा क्रम
  rationale: आत्माओं की अवस्थाओं की क्रमबद्ध सूची को औपचारिक और स्पष्ट रूप से व्यक्त करता है।
- source_word: requiem ... requiescent
  choice: विश्राम ... विश्राम करेंगे
  rationale: संज्ञा और संबंधित क्रिया की लैटिन पुनरुक्ति को बनाए रखते हुए requiescent का भविष्यकाल व्यक्त करता है।
- source_word: promptuariis
  choice: भंडारों
  rationale: मूल के संग्रह अथवा सुरक्षित रखे जाने के स्थान वाले ठोस रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: cum silentio multo
  choice: गहरे मौन में
  rationale: शाब्दिक 'बहुत मौन' के स्थान पर आधुनिक हिन्दी में स्वाभाविक किंतु अर्थ-संगत अभिव्यक्ति है।
- source_word: ab angelis conseruati
  choice: स्वर्गदूतों द्वारा सुरक्षित रखे जाकर
  rationale: निष्क्रिय कृदंत और संरक्षक स्वर्गदूतों की भूमिका दोनों को स्पष्ट रखता है।
- source_word: manentem gloriam
  choice: महिमा ... बनी हुई है
  rationale: manentem के 'कायम/शेष रहने' के अर्थ को व्यक्त करता है और केवल 'प्रतीक्षा करने' जैसा मानवीकरण नहीं जोड़ता।
- source_word: in nouissimis
  choice: अंतिम समय में
  rationale: अंतकालीन संकेत को स्वाभाविक हिन्दी में रखता है; लैटिन बहुवचन का यांत्रिक अनुवाद नहीं करता।
theological_decisions:
- issue: वर्तमान एकत्रीकरण, भावी विश्राम और अंतिम महिमा का काल-संबंध
  choice: अभी भंडारों में इकट्ठे किए गए हैं; विश्राम करेंगे; अंतिम समय में महिमा बनी हुई है
  alternative: वे अभी भंडारों में विश्राम करते हैं और बाद में महिमा पाएँगे
  rationale: मूल में congregati वर्तमान/पूर्ण अवस्था और requiescent भविष्य को संकेत करता है। पाठ की अस्थिरता के बावजूद वर्तमान सुरक्षा और भावी पूर्णता के तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। 'भंडारों' का असामान्य किंतु मूल-आधारित रूपक जानबूझकर सुरक्षित रखा गया है।
