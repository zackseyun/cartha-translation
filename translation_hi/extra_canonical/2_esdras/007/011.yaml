  yaml_path: translation/extra_canonical/2_esdras/007/011.yaml
  text: For their sake I made the world[a], and when Adam transgressed my ordinances, what had been made was judged.
translation:
  language: hi
  text: क्योंकि मैंने संसार उनके लिए बनाया[a]; और जब आदम ने मेरी विधियों का उल्लंघन किया, तब जो बनाया गया था, उसका न्याय हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैंने उनके लिए युग बनाया’।
    reason: लैटिन saeculum का अर्थ संदर्भ के अनुसार ‘संसार’ अथवा ‘युग’ हो सकता है।
lexical_decisions:
- source_word: propter eos
  choice: उन्हीं के लिए
  rationale: यहाँ वाक्यांश सृष्टि के प्रयोजन अथवा लाभार्थ को व्यक्त करता है—संसार उनके लिए बनाया गया—न कि केवल कारण को। ‘उन्हीं’ पूर्ववर्ती संदर्भित लोगों पर बल बनाए रखता है।
- source_word: saeculum
  choice: संसार
  rationale: यद्यपि saeculum का अर्थ ‘युग’ भी हो सकता है, यहाँ feci (‘मैंने बनाया’) का कर्म और quod factum est (‘जो बनाया गया था’) का संदर्भ होने के कारण सृजित संसार अभिप्रेत है। पाठगत संभावना पादटिप्पणी में सुरक्षित है।
- source_word: constitutiones meas
  choice: मेरी विधियों
  rationale: constitutiones यहाँ परमेश्वर द्वारा निर्धारित नियमों/आदेशों को सूचित करता है; ‘विधियाँ’ औपचारिकता और बहुवचन दोनों बनाए रखता है।
- source_word: iudicatum est
  choice: उसका न्याय हुआ
  rationale: लैटिन के कर्मवाच्य और न्याय-संबंधी अर्थ को बनाए रखा गया है; इसे ‘दोषी ठहराया गया’ कहकर परिणाम को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: आदम के उल्लंघन के बाद न्याय का विषय
  choice: जो बनाया गया था, उसका न्याय हुआ
  alternative: सृष्टि दोषी ठहराई गई
  rationale: मूल quod factum est व्यापक और कुछ हद तक अस्पष्ट है। अनुवाद उसी अस्पष्टता तथा कर्मवाच्य को बनाए रखता है और न्याय के परिणाम को नहीं जोड़ता।
- issue: saeculum का आशय
  choice: मुख्य पाठ में ‘संसार’
  alternative: ‘युग’
  rationale: इस पद में सृष्टि-क्रिया और बाद के ‘जो बनाया गया था’ से ‘संसार’ अधिक स्वाभाविक है, पर ‘युग’ की वास्तविक शब्दार्थगत संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘उल्लंघन’, ‘विधियाँ’ और ‘न्याय हुआ’ मूल के औपचारिक तथा न्यायिक स्वर को बनाए रखते हैं।
