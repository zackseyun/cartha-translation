base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/099.yaml
  text: '[him][a], whom the living serve and from whom the glorious begin to receive their reward. This is the order of the souls of the righteous, as it is now announced; [and these are] the previously described ways of torment, which'
translation:
  language: hi
  text: '[उसकी][a], जिसकी जीवित जन सेवा करते हैं और जिससे महिमावान जन अपना प्रतिफल प्राप्त करना आरम्भ करते हैं। धर्मियों की आत्माओं का यह क्रम है, जैसा अब से बताया जा रहा है; [और ये हैं] यातना के वे पहले बताए गए मार्ग, जिन्हें…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी’ लातीनी संस्करण में भी संपादकीय पूर्ति के रूप में कोष्ठकों में है।
    reason: दिए गए स्रोत में [eius] को पूरित पाठ के रूप में चिह्नित किया गया है; हिन्दी में संबंधकारक रूप लातीनी रूप के अनुरूप रखा गया है।
lexical_decisions:
- source_word: seruiunt
  choice: सेवा करते हैं
  rationale: लातीनी क्रिया का सामान्य धार्मिक अर्थ स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: gloriosi
  choice: महिमा प्राप्त लोग
  rationale: ‘महिमावान’ की अपेक्षा यह आत्माओं को मिली हुई महिमा का भाव अधिक स्पष्ट करता है, जबकि यह तय नहीं करता कि महिमा किस प्रकार मिली।
- source_word: mercedem
  choice: प्रतिफल
  rationale: पुरस्कार या मजदूरी में से किसी एक अर्थ को अनावश्यक रूप से निश्चित किए बिना न्यायोचित फल का व्यापक भाव बनाए रखता है।
- source_word: ordo
  choice: क्रम
  rationale: धर्मी आत्माओं के अनुभव के व्यवस्थित क्रम या विधान—दोनों संभावित भावों के लिए उपयुक्त है।
- source_word: a modo
  choice: अब से
  rationale: इस पदबंध के आरम्भ-बिंदु से आगे की ओर संकेत करने वाले कालगत बल को बनाए रखता है।
- source_word: cruciatus
  choice: यातना
  rationale: शारीरिक या मानसिक पीड़ा को सीमित किए बिना तीव्र दुःख का अर्थ देता है।
theological_decisions:
- issue: gloriosi की पहचान
  choice: महिमा प्राप्त लोग
  alternative: महिमावान लोग
  rationale: पाठ इन्हें किस प्रक्रिया से महिमा मिली, यह नहीं बताता; चुना हुआ रूप प्राप्त अवस्था को व्यक्त करता है और अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: खंडित अंतिम उपवाक्य
  choice: ‘जिन्हें…’ पर वाक्य अधूरा रखा गया
  alternative: अगले पद की सामग्री जोड़कर वाक्य पूरा करना
  rationale: दिए गए लातीनी स्रोत का अन्त ‘quas’ पर होता है और विचार अगले पाठ में जारी रहता है; इसलिए स्रोत की अपूर्णता सुरक्षित रखी गई है।
- issue: praedictae uiae cruciatus का वाक्यगत सम्बन्ध
  choice: नए, लुप्त क्रियापद वाले खंड के रूप में ‘[और ये हैं]’ जोड़ा
  alternative: इसे धर्मी आत्माओं के क्रम से सीधे जोड़ना
  rationale: अर्थ और अंग्रेज़ी परामर्श-पाठ नए विपरीत खंड की ओर संकेत करते हैं, पर जोड़े गए शब्दों को कोष्ठकों में रखकर पाठगत पूर्ति स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अब से’ द्वारा a modo का कालगत बल बचाया गया है। वर्ग कोष्ठक स्रोत या अनुवाद में पूरित शब्द दर्शाते हैं, और दीर्घविराम स्रोत के अधूरे अंतिम उपवाक्य को सुरक्षित रखता है।
