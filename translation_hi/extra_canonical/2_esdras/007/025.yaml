  text: Therefore, Ezra, empty things are for the empty, and full things for the full.
translation:
  language: hi
  text: इसलिए, एज्रा, खाली चीज़ें खाली लोगों के लिए हैं, और भरी हुई चीज़ें भरे हुए लोगों के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: इसलिए
  rationale: लैटिन कारण-परिणाम सूचक पद का स्वाभाविक और संक्षिप्त हिन्दी रूप।
- source_word: vacua vacuis
  choice: खाली चीज़ें खाली लोगों के लिए
  rationale: नपुंसकलिंग बहुवचन vacua को ‘खाली चीज़ें’ और बहुवचन संप्रदान vacuis को ‘खाली लोगों के लिए’ रूप में रखते हुए मूल की संक्षिप्त, रहस्यपूर्ण समानांतरता बचाई गई है।
- source_word: plena plenis
  choice: भरी हुई चीज़ें भरे हुए लोगों के लिए
  rationale: plena और plenis की शब्द-पुनरावृत्ति तथा vacua vacuis के साथ उनका विरोधी समानांतर विन्यास यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘खाली’ और ‘भरे हुए’ का आशय
  choice: रूपक को बिना व्याख्या जोड़े खुला रखा गया
  alternative: इन्हें सांसारिक/आत्मिक वस्तुओं या अयोग्य/योग्य व्यक्तियों के रूप में स्पष्ट करना
  rationale: लैटिन वाक्य स्वयं संदर्भगत और धार्मिक अर्थ को स्पष्ट नहीं करता; किसी एक व्याख्या को पाठ में जोड़ना वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त और गरिमापूर्ण शैली। ‘एज्रा’ नाम का प्रचलित हिन्दी रूप रखा गया है। मूल के सूत्रात्मक विरोध—खाली/भरी हुई—और उसकी जानबूझकर बनी रहस्यमयता को सुरक्षित रखा गया है।
