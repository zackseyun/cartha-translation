source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: beati praesentes et obseruantes quae a te constituta sunt; Sed et [de] quibus erat oratio mea, quis enim est de praesentibus, qui non peccauit, uel quis natus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/046.yaml
  text: Blessed are those who are present and keep what has been established by you. But as for those about whom my prayer was made, who indeed is there among those now present who has not sinned, or what one born has not transgressed your covenant?
translation:
  language: hi
  text: धन्य हैं वे जो अभी जीवित हैं और जो कुछ तूने ठहराया है, उसे मानते हैं। पर जिन लोगों के विषय में मेरी प्रार्थना थी—अभी जीवित लोगों में ऐसा कौन है जिसने पाप नहीं किया, या कौन-सा जन्मा हुआ मनुष्य है जिसने तेरी वाचा का उल्लंघन नहीं किया?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दिए गए लैटिन स्रोत-पाठ का उद्धरण ‘या कौन जन्मा हुआ’ पर अधूरा समाप्त होता है। अंतिम उपवाक्य प्रचलित लैटिन पाठ की निरंतरता के अनुसार दिया गया है: ‘जिसने तेरी वाचा का उल्लंघन नहीं किया?’'
    reason: उद्धृत मूल-पाठ की अपूर्णता और अनुवाद में सम्मिलित प्रचलित पाठ की निरंतरता को पारदर्शी बनाना।
lexical_decisions:
- source_word: beati
  choice: धन्य हैं
  rationale: लैटिन विशेषण का स्वाभाविक और गरिमापूर्ण बाइबिलीय हिन्दी रूप।
- source_word: praesentes
  choice: अभी जीवित
  rationale: संदर्भ में इसका आशय उस समय विद्यमान या जीवित लोगों से है; केवल ‘उपस्थित’ कहने से किसी सभा में शारीरिक उपस्थिति का अनपेक्षित अर्थ निकल सकता है।
- source_word: obseruantes
  choice: पालन करते हैं
  rationale: आदेशों को मानने और आचरण में रखने, दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: quae a te constituta sunt
  choice: तेरे ठहराए हुए आदेशों
  rationale: constituta की स्थापित या निर्धारित बातों की धारणा को प्रसंगानुकूल संज्ञात्मक रूप में रखा गया है; ‘तेरे’ से परमेश्वर को किया गया सीधा संबोधन बना रहता है।
- source_word: de quibus erat oratio mea
  choice: जिन लोगों के विषय में मेरी प्रार्थना थी
  rationale: oratio को प्रसंग के अनुसार ‘प्रार्थना’ माना गया है और quibus के व्यक्तिवाचक संदर्भ को स्पष्ट, किंतु बिना अतिरिक्त व्याख्या के, व्यक्त किया गया है।
- source_word: testamentum tuum
  choice: तेरी वाचा
  rationale: यहाँ testamentum परमेश्वर और मनुष्यों के बीच की covenant को दर्शाता है; ‘वाचा’ उसका मानक और धर्मवैज्ञानिक रूप से तटस्थ हिन्दी पद है।
theological_decisions:
- issue: क्या पद मनुष्य के सार्वभौमिक पाप को कथन के रूप में घोषित करता है या प्रश्न के रूप में रखता है?
  choice: दो अलंकारिक प्रश्नों का रूप बनाए रखा गया है।
  alternative: ‘सभी ने पाप किया और तेरी वाचा तोड़ी है’ जैसा प्रत्यक्ष कथन।
  rationale: लैटिन quis enim... qui non और quis... qui non की प्रश्नात्मक संरचना को बनाए रखने से मूल की वाक्पटुता और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
- issue: परमेश्वर द्वारा स्थापित बातों का स्वरूप
  choice: ‘आदेशों’ कहा गया है।
  alternative: ‘व्यवस्थाओं’ या ‘विधानों’ कहा जा सकता था।
  rationale: मूल quae व्यापक है; ‘आदेश’ आज के पाठक के लिए स्वाभाविक है और किसी विशिष्ट संहितागत या सांप्रदायिक अर्थ को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। परमेश्वर को सीधे संबोधन में एकवचन ‘तेरे/तेरी’ रखा गया है। लंबे वाक्य को मूल की तर्कगत गति के अनुसार रखा गया है और डैश से प्रार्थना के विषय से अलंकारिक प्रश्नों की ओर संक्रमण स्पष्ट किया गया है।
