  text: Before you[a], Lord, show your servant, Lord, whether after death, or now when each of us gives up his soul, whether, if we are kept, we will be kept in rest until
translation:
  language: hi
  text: आपके सामने[a], हे प्रभु, अपने सेवक को, हे प्रभु, यह प्रकट कीजिए कि मृत्यु के बाद, या अब, जब हममें से हर एक अपना प्राण सौंपता है, यदि हम सुरक्षित रखे गए हों, तो क्या हम विश्राम में तब तक सुरक्षित रखे जाएँगे, जब तक—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी अंश “आपके सामने” से आरम्भ होता है; इसलिए वाक्य का आरम्भ अधूरा है।
    reason: coram te से पहले का वाक्यांश उपलब्ध स्रोत-अंश में नहीं है।
lexical_decisions:
- source_word: coram te
  choice: आपके सामने
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक हिन्दी रूप; खंडित वाक्य-संरचना को मूल के अनुरूप बनाए रखता है।
- source_word: demonstra
  choice: प्रकट कीजिए
  rationale: सेवक को अज्ञात बात स्पष्ट करके दिखाने के अर्थ में आदरपूर्ण निवेदन।
- source_word: seruo tuo
  choice: अपने सेवक को
  rationale: मूल के संबंध और विनम्र आत्म-संदर्भ को सुरक्षित रखता है।
- source_word: quando reddimus unusquisque animam suam
  choice: जब हममें से हर एक अपना प्राण सौंपता है
  rationale: reddere animam के मृत्यु-सूचक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और unusquisque की व्यक्तिगत व्यापकता बनाए रखता है।
- source_word: si conseruati conseruabimur
  choice: यदि हम सुरक्षित रखे गए, तो क्या हमें ... सुरक्षित रखा जाएगा
  rationale: कृदंत और भविष्यकालीन क्रिया की पुनरुक्त, कुछ असामान्य संरचना तथा संभाव्य/शर्तीय तनाव को बिना अनावश्यक रूप से सुलझाए सुरक्षित रखता है।
- source_word: in requie
  choice: विश्राम में
  rationale: मरणोत्तर अवस्था के लिए मूल का सामान्य और धर्मवैचारिक रूप से अनिर्णीत शब्द बनाए रखता है।
- source_word: donec
  choice: जब तक—
  rationale: स्रोत अंश यहीं अधूरा समाप्त होता है; दीर्घ विराम आगे अपेक्षित कथन का संकेत देता है।
theological_decisions:
- issue: conseruati conseruabimur में मरणोत्तर संरक्षण की निश्चितता या शर्त
  choice: यदि हम सुरक्षित रखे गए, तो क्या हमें ... सुरक्षित रखा जाएगा
  alternative: क्या हमें निश्चय ही ... सुरक्षित रखा जाएगा
  rationale: उपलब्ध लातीनी पाठ में si स्पष्ट है। पुनरुक्ति में जोर हो सकता है, पर शर्तीय रूप मिटाना उचित नहीं; इसलिए अस्पष्टता और तनाव दोनों रखे गए हैं।
- issue: anima का अर्थ
  choice: प्राण
  alternative: आत्मा
  rationale: प्राण सौंपना मृत्यु के समय जीवन छोड़ने का स्वाभाविक हिन्दी मुहावरा है और यहाँ शरीर-आत्मा संबंध पर अतिरिक्त सिद्धांत आरोपित नहीं करता।
- issue: uel का संबंध
  choice: मृत्यु के बाद, अर्थात अब जब...
  alternative: मृत्यु के बाद, या अब जब...
  rationale: संदर्भ में 'अब जब प्रत्येक अपना प्राण सौंपता है' मृत्यु के क्षण की व्याख्या करता प्रतीत होता है; फिर भी मूल का uel असामान्य है, इसलिए पाठ-टिप्पणी में वैकल्पिक समन्वयी अर्थ दर्ज किया गया है।
translation_notes:
  register: आदरपूर्ण, आधुनिक और धर्मग्रंथोचित हिन्दी। दोहराया गया “हे प्रभु” जानबूझकर रखा गया है। स्रोत अंश के अधूरे अंत को पूरा नहीं किया गया; अंतिम दीर्घ विराम इसी का संकेत है।
