translation:
  language: hi
  text: और एलिय्याह ने उन लोगों के लिए जिन्हें वर्षा मिली, और उस मृत व्यक्ति के लिए प्रार्थना की कि वह जीवित हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Helias
  choice: एलिय्याह
  rationale: यह नबी Elijah के लिए प्रचलित और पहचानने योग्य हिन्दी बाइबलीय नाम है।
- source_word: pro his qui pluviam acceperunt
  choice: उन लोगों के लिए ... जिन्हें वर्षा मिली
  rationale: लैटिन की संबंधवाचक संरचना और बहुवचन को सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: pro mortuo
  choice: उस मरे हुए मनुष्य के लिए
  rationale: mortuo के एकवचन और व्यक्ति-संदर्भ को स्पष्ट करते हुए किसी अतिरिक्त पहचान को नहीं जोड़ा गया।
- source_word: ut viveret
  choice: कि वह जीवित हो जाए
  rationale: लैटिन के आशय/परिणाम की संभावनायुक्त उपवाक्य-रचना को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मूल अंश में मुख्य क्रिया का लोप
  choice: प्रार्थना की
  alternative: विनती की / केवल ‘और एलिय्याह उन लोगों के लिए…’
  rationale: यह पद मध्यवर्ती सूची का अंश है, जहाँ ‘प्रार्थना/विनती’ पूर्ववर्ती संदर्भ से समझी जाती है। पूर्ण और सुबोध हिन्दी वाक्य के लिए इसे स्पष्ट किया गया, पर एलिय्याह को स्वतंत्र रूप से वर्षा या जीवन देने वाला नहीं बताया गया।
- issue: ut viveret का संबंध
  choice: इसे मरे हुए मनुष्य से जोड़ा गया
  alternative: व्यापक परिणामार्थक अर्थ
  rationale: निकटतम एकवचन mortuo और vivere का अर्थ स्पष्टतः उस मृत व्यक्ति के जीवित होने की ओर संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वर्षा’ औपचारिक बाइबलीय संदर्भ के अनुकूल है, जबकि वाक्य-विन्यास आधुनिक है।
