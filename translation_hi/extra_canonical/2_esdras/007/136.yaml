source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et multae misericordiae, quoniam multiplicat magis misericordias his qui praesentes sunt et qui praeterierunt et qui futuri sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/136.yaml
  text: and of great mercy[a], because he multiplies mercies for those who are present and those who have passed away and those who are to come.
translation:
  language: hi
  text: और वह बहुत दयालु है,[a] क्योंकि वह उन लोगों के लिए दयाएँ बहुत बढ़ाता है जो अभी हैं, जो बीत चुके हैं, और जो आने वाले हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह दया से भरपूर है।”
    reason: लातीनी multae misericordiae को ‘बहुत दयालु’ या, अधिक शाब्दिक रूप से, ‘दया से भरपूर’ कहा जा सकता है।
lexical_decisions:
- source_word: multae misericordiae
  choice: बड़ी दया वाला
  rationale: लातीनी संबंधकारक पदबंध का स्वाभाविक हिन्दी रूप; यह ‘बहुतायत की दया’ का भाव रखता है, पर अनावश्यक रूप से ‘दया में धनी’ जैसी व्याख्यात्मक भाषा नहीं जोड़ता।
- source_word: multiplicat magis misericordias
  choice: अपनी दया बहुत बढ़ाता है
  rationale: multiplicat का अर्थ ‘बढ़ाता/बहुगुणित करता है’ और magis का तीव्रतासूचक भाव ‘बहुत’ से व्यक्त किया गया है; ‘और अधिक बढ़ाता जाता है’ जैसी प्रगतिशील व्याख्या से बचा गया है।
- source_word: praesentes ... praeterierunt ... futuri sunt
  choice: जो अभी हैं ... जो बीत चुके हैं ... जो आने वाले हैं
  rationale: तीनों कालगत समूहों को स्पष्ट और समानांतर आधुनिक हिन्दी में रखा गया है; praeterierunt की अस्पष्टता को ‘मर चुके हैं’ कहकर सीमित नहीं किया गया।
theological_decisions:
- issue: दया के प्राप्तकर्ताओं का कालगत विस्तार
  choice: जो अभी हैं, जो बीत चुके हैं और जो आने वाले हैं
  alternative: जीवित, मृत और अजन्मे लोग
  rationale: मूल पाठ कालगत भाषा प्रयोग करता है और सीधे जीवन-मृत्यु की धर्मवैज्ञानिक श्रेणियाँ नहीं बनाता; इसलिए उसकी व्यापकता और अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। पद संभवतः पहले से चल रहे गुण-वर्णन की कड़ी है, इसलिए आरम्भिक ‘और’ बनाए रखा गया है।
