  text: But judgment alone will remain, and truth will stand, and faith will grow strong.
translation:
  language: hi
  text: परन्तु केवल न्याय ही शेष रहेगा; सत्य स्थिर रहेगा और विश्वास दृढ़ होता जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicium
  choice: न्याय
  rationale: यहाँ लैटिन शब्द अंतिम न्याय अथवा न्यायिक निर्णय की धारणा रख सकता है; ‘न्याय’ इस संक्षिप्त कथन में उस व्यापकता को बनाए रखता है।
- source_word: solum remanebit
  choice: केवल ... ही शेष रहेगा
  rationale: ‘solum’ के विशिष्ट बल और ‘remanebit’ के भविष्यकालीन अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: veritas stabit
  choice: सत्य स्थिर रहेगा
  rationale: ‘stabit’ का शाब्दिक अर्थ ‘खड़ा रहेगा’ है, पर सत्य के विषय में ‘स्थिर रहेगा’ आधुनिक हिन्दी में स्वाभाविक है और उसके टिके रहने का भाव देता है।
- source_word: fides convalescet
  choice: विश्वास दृढ़ होता जाएगा
  rationale: ‘convalescet’ में बलवान या सुदृढ़ होने की प्रक्रिया का भाव है; ‘दृढ़ होता जाएगा’ उस क्रमिक सुदृढ़ता को व्यक्त करता है।
theological_decisions:
- issue: fides का अर्थ
  choice: विश्वास
  alternative: निष्ठा
  rationale: ‘fides’ विश्वास और निष्ठा दोनों का अर्थ दे सकता है। इस न्याय-विषयक संदर्भ में ‘विश्वास’ सहज और पारंपरिक है, पर वाक्य इसे किसी विशिष्ट सिद्धान्त तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। लैटिन की तीन समानांतर भविष्यकालीन घोषणाओं को हिन्दी में स्पष्ट लय के साथ प्रस्तुत किया गया है।
