id: 2ES.10.23
reference: 2 Esdras 10:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quod omnium maius, signaculum Sion, quoniam resignata est de gloria sua nunc et tradita est in manibus eorum qui nos oderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/023.yaml
  text: And what is greatest of all[a][23], the seal of Zion—for now she has been unsealed from her glory and handed over into the hands of those who hate us.
translation:
  language: hi
  text: और सबसे बढ़कर है सिय्योन की मुहर[23]—क्योंकि अब वह अपनी महिमा से अलग कर दी गई है[a] और उन लोगों के हाथों में सौंप दी गई है जो हमसे घृणा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: '23'
    text: ‘सिय्योन की मुहर’ पदबंध कठिन है। इसका संकेत सिय्योन की विशिष्ट महिमा, उसकी प्रमाणित स्थिति या सम्मान के किसी प्रतीकात्मक चिह्न की ओर हो सकता है; लातीनी बिंब को सरल व्याख्या से बदलने के बजाय यहाँ सुरक्षित रखा गया है।
    reason: lexical_alternative
  - marker: a
    text: या, ‘अब उससे उसकी महिमा छीन ली गई है।’ लातीनी क्रिया में ‘मुहर खोलने’ का बिंब भी निहित हो सकता है।
    reason: previous_rendering
lexical_decisions:
- source_word: signaculum Sion
  choice: सिय्योन की मुहर
  rationale: लातीनी ‘signaculum’ के मुहर-वाले कठिन और बहुअर्थी बिंब को सरल व्याख्या से बदलने के बजाय ज्यों का त्यों सुरक्षित रखा गया है।
- source_word: resignata est de gloria sua
  choice: उसकी महिमा की मुहर खोल दी गई है
  rationale: ‘resignata’ में निहित ‘मुहर खोलने’ के बिंब को स्वाभाविक हिन्दी में रखा गया है। लातीनी स्त्रीलिंग क्रिया का आशय सिय्योन से है; हिन्दी में वाक्य को समझने योग्य बनाने के लिए उसकी महिमा पर लगी मुहर के रूप में अभिव्यक्त किया गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: tradita est in manibus eorum
  choice: वह उन लोगों के हाथों में सौंप दी गई है
  rationale: ‘हाथों में सौंपना’ स्रोत का प्रचलित रूपक है और सिय्योन को स्त्रीलिंग एकवचन कर्ता के रूप में स्पष्ट रखता है।
- source_word: qui nos oderunt
  choice: जो हमसे घृणा करते हैं
  rationale: ‘oderunt’ के प्रबल भाव को आधुनिक, गरिमापूर्ण और सीधी हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘सिय्योन की मुहर’ का तात्पर्य
  choice: मुहर के मूल बिंब को मुख्य पाठ में बनाए रखा गया
  alternative: इसे सिय्योन की विशिष्ट महिमा, प्रमाणित स्थिति या सम्मान-चिह्न के रूप में स्पष्ट करके अनुवाद करना
  rationale: स्रोत स्वयं इस पदबंध का आशय निश्चित नहीं करता; किसी एक धर्मवैचारिक व्याख्या को मुख्य पाठ में आरोपित करना उचित नहीं होगा।
- issue: ‘resignata’ और महिमा का संबंध
  choice: मुहर खोले जाने का बिंब रखा गया
  alternative: ‘उससे उसकी महिमा छीन ली गई है’
  rationale: मुख्य पाठ लातीनी शब्द-चित्र को सुरक्षित रखता है, जबकि संभावित भावार्थ को [a] में दर्ज करने से वास्तविक अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। ‘सिय्योन’, ‘मुहर’ और ‘हाथों में सौंप दी गई’ जैसे परिचित बाइबलीय पदों को रखा गया है; कठिन लातीनी मुहर-बिंब को मिटाने के बजाय पादटिप्पणी से स्पष्ट किया गया है।
