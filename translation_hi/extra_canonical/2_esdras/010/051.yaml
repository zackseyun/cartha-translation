  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ठहरे रहो’ निर्देश की निरंतरता व्यक्त करता है।
