  text: propterea enim dixi tibi, ut maneres in campo, ubi domus non est aedificata.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/051.yaml
  text: For this reason I told you to remain in the field where no house has been built[a].
translation:
  language: hi
  text: इसी कारण मैंने तुमसे उस मैदान में ठहरे रहने को कहा था, जहाँ कोई घर नहीं बनाया गया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जहाँ कोई घर नहीं बनाया गया था।’
    reason: लैटिन पूर्ण कर्मवाच्य रूप का प्रसंगानुसार भूतकालीन वर्णन भी संभव है, यद्यपि मुख्य पाठ वर्तमान परिणामी अवस्था को अधिक सीधे व्यक्त करता है।
lexical_decisions:
- source_word: propterea enim
  choice: इसी कारण
  rationale: कारणसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ enim पिछले कथन की व्याख्या देता है, इसलिए अलग से ‘क्योंकि’ जोड़ना अस्वाभाविक होता।
- source_word: maneres
  choice: ठहरे रहो
  rationale: अप्रत्यक्ष आदेश में आए imperfect subjunctive का आशय उस स्थान पर बने रहने का निर्देश है।
- source_word: in campo
  choice: उस मैदान में
  rationale: campus के खुले, अनिर्मित स्थान का सामान्य और प्रसंगानुकूल हिन्दी रूप ‘मैदान’ है।
- source_word: ubi domus non est aedificata
  choice: जहाँ कोई घर नहीं बनाया गया है
  rationale: est aedificata पूर्ण कर्मवाच्य रूप होकर वर्तमान परिणामी अवस्था दर्शाता है; ‘नहीं बनाया गया है’ उस अर्थ और काल-संबंध को बनाए रखता है।
theological_decisions: []
