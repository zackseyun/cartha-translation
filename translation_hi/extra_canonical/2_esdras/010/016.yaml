source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si enim iustificaveris terminum Dei, et filium tuum recipies in tempore et in mulieribus conlaudaberis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/016.yaml
  text: For if you acknowledge the justice of God’s decree, you will receive your son in due time and will be praised among women.
translation:
  language: hi
  text: क्योंकि यदि तुम परमेश्वर के निर्णय को न्यायपूर्ण मानोगी, तो नियत समय पर तुम अपने पुत्र को पाओगी और स्त्रियों के बीच तुम्हारी प्रशंसा होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustificaveris
  choice: न्यायपूर्ण मानोगी
  rationale: लैटिन क्रिया का आशय परमेश्वर के निर्णय को उचित या न्यायसंगत स्वीकार करना है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके न्याय-संबंधी अर्थ को बनाए रखती है।
- source_word: terminum Dei
  choice: परमेश्वर के निर्णय
  rationale: terminus यहाँ केवल सीमा या अंत नहीं, बल्कि परमेश्वर द्वारा ठहराए गए निर्णय अथवा विधान की ओर संकेत करता है। प्रसंगानुकूल हिन्दी में ‘निर्णय’ स्पष्ट और गरिमापूर्ण है।
- source_word: recipies
  choice: फिर मिल जाएगा
  rationale: पुत्र को वापस पाने का भाव व्यक्त करने के लिए ‘फिर मिल जाएगा’ स्वाभाविक हिन्दी है और recipere के पुनः प्राप्ति-संबंधी अर्थ को सामने लाता है।
- source_word: in tempore
  choice: नियत समय पर
  rationale: यह केवल किसी समय नहीं, उचित या निर्धारित समय का संकेत देता है।
- source_word: in mulieribus conlaudaberis
  choice: स्त्रियों के बीच तुम्हारी प्रशंसा होगी
  rationale: लैटिन की सामुदायिक तुलना या प्रतिष्ठा का भाव बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के terminus को स्वीकार करने का स्वरूप
  choice: परमेश्वर के निर्णय को न्यायपूर्ण मानना
  alternative: परमेश्वर के विधान को सही ठहराना
  rationale: ‘सही ठहराना’ हिन्दी में ऐसा लग सकता है मानो मनुष्य परमेश्वर को न्यायी घोषित करके वैधता देता हो। ‘न्यायपूर्ण मानना’ मनुष्य द्वारा उसके न्याय को स्वीकार करने का भाव अधिक स्वाभाविक ढंग से व्यक्त करता है।
- issue: पुत्र की पुनः प्राप्ति का अर्थ
  choice: अपना पुत्र फिर मिल जाएगा
  alternative: अपने पुत्र को वापस पाओगी
  rationale: दोनों संभव हैं; चुना गया रूप पुनर्मिलन का भाव रखता है, पर पुनरुत्थान या किसी विशिष्ट सिद्धान्त को स्पष्ट रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संबोधित स्त्री के अनुसार स्त्रीलिंग क्रियारूप। वाक्य ने मूल लैटिन की शर्त, प्रतिज्ञा और स्त्रियों के बीच प्रशंसा—तीनों को सुरक्षित रखा है।
