source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelus qui in principio uenerat ad me, et uidit me, Et ecce eram positus ut mortuus, et intellectus meus alienatus erat, et tenuit dexteram meam et confortauit me et statuit me super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/030.yaml
  text: And behold, I was lying there like a dead man, and my understanding had been taken away; and he took my right hand and strengthened me and set me on my feet,
translation:
  language: hi
  text: और देखो, जो स्वर्गदूत आरम्भ में मेरे पास आया था, उसने मुझे देखा। मैं मरे हुए मनुष्य के समान पड़ा था, और मेरी सुध-बुध खो गई थी। तब उसने मेरा दाहिना हाथ पकड़ा, मुझे बल दिया और मुझे खड़ा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: angelus qui in principio uenerat ad me
  choice: जो स्वर्गदूत आरम्भ में मेरे पास आया था
  rationale: लैटिन पाठ में उपस्थित कर्ता को बनाए रखा गया है, यद्यपि परामर्शार्थ अंग्रेज़ी पाठ में यह अंश नहीं है। ‘आरम्भ में’ in principio का सीधा और स्वाभाविक रूप है।
- source_word: positus ut mortuus
  choice: मरे हुए मनुष्य के समान पड़ा था
  rationale: शाब्दिक भाव ‘मृतक के समान रखा/पड़ा हुआ’ है; प्रसंग में ‘पड़ा था’ स्वाभाविक हिन्दी है और उपमा को अक्षुण्ण रखता है।
- source_word: intellectus meus alienatus erat
  choice: मेरी सुध-बुध जाती रही थी
  rationale: alienatus का भाव चेतना या समझ का व्यक्ति से दूर हो जाना है। यह मुहावरेदार हिन्दी उस अवस्था को व्यक्त करती है, बिना उसे केवल बेहोशी या केवल बुद्धि-हानि तक सीमित किए।
- source_word: tenuit dexteram meam
  choice: उसने मेरा दाहिना हाथ पकड़ा
  rationale: dexteram का स्पष्ट अर्थ ‘दाहिना हाथ’ है; मूल पाठ में यह दूत का नहीं, वक्ता का दाहिना हाथ है।
- source_word: confortauit me
  choice: मुझे बल दिया
  rationale: शारीरिक और आंतरिक सुदृढ़ता—दोनों की सम्भावना खुली रखता है।
- source_word: statuit me super
  choice: मुझे खड़ा किया
  rationale: उपलब्ध लैटिन अंश में super के बाद अपेक्षित पूरक अनुपस्थित है, पर statuit me super का प्रसंगगत अर्थ उठाकर खड़ा करना है। अंग्रेज़ी परामर्श पाठ के ‘on my feet’ को अर्थ में व्यक्त किया गया है, पर ‘पैरों पर’ को मूल में स्पष्ट शब्द न होने के कारण नहीं जोड़ा गया।
theological_decisions:
- issue: दूत की पहचान और भूमिका
  choice: मूल लैटिन के अनुसार आरम्भ में आए स्वर्गदूत को स्पष्ट कर्ता रखा गया
  alternative: अंग्रेज़ी परामर्श पाठ की तरह केवल ‘उसने’ से आरम्भ करना
  rationale: स्रोत-साक्ष्य में angelus वाला उपवाक्य स्पष्ट है; इसे हटाने से पद का कथात्मक संबंध और कर्ता अस्पष्ट हो जाते।
- issue: intellectus की अवस्था
  choice: ‘सुध-बुध जाती रही थी’
  alternative: ‘मेरी समझ मुझसे अलग हो गई थी’ या ‘मैं होश खो बैठा था’
  rationale: पहला अत्यधिक शाब्दिक और अस्वाभाविक है, जबकि दूसरा अर्थ को केवल चेतनाहीनता तक सीमित कर सकता है। चुना हुआ रूप मूल की व्यापक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कथात्मक प्रवाह के लिए छोटे वाक्य रखे गए हैं। स्रोत में उपलब्ध आरम्भिक कर्ता अंग्रेज़ी POB से अधिक पूर्ण होने के कारण अनुवाद में शामिल किया गया है।
