  text: et quod tibi dixit quoniam nutrivi eum cum labore, haec erat habitatio Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/047.yaml
  text: And as for what she said to you[a], ‘I nourished him with toil,’ this was the dwelling of Jerusalem.
translation:
  language: hi
  text: और उसने तुमसे जो कहा, ‘मैंने कष्ट उठाकर उसका पालन-पोषण किया,’ वह यरूशलेम के आबाद रहने की अवस्था थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह यरूशलेम का निवास था।”
    reason: लैटिन ‘habitatio Hierusalem’ निवास/बसावट की स्थिति तथा ‘यरूशलेम’ के साथ उसके संबंध को संक्षेप में और कुछ हद तक अस्पष्ट रूप में व्यक्त करता है। मुख्य पाठ भवन-सूचक अर्थ से बचने के लिए ‘आबाद रहने की अवस्था’ कहता है; वैकल्पिक रूप अधिक शाब्दिक संरचना सुरक्षित रखता है।
lexical_decisions:
- source_word: nutrivi eum cum labore
  choice: मैंने कष्ट उठाकर उसका पालन-पोषण किया
  rationale: ‘nutrivi’ के पोषण और देखभाल के अर्थ को ‘पालन-पोषण किया’ व्यक्त करता है; ‘cum labore’ को स्वाभाविक हिन्दी में ‘कष्ट उठाकर’ रखा गया है।
- source_word: habitatio Hierusalem
  choice: यरूशलेम के आबाद रहने का समय
  rationale: ‘habitatio’ यहाँ किसी मकान की अपेक्षा बसने, निवास करने या आबाद रहने की अवस्था/अवधि बताता है। ‘समय’ प्रसंगगत अवधि को स्पष्ट करता है, जबकि सम्बन्धवाचक ‘Hierusalem’ की कुछ अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: स्त्री के कथन और यरूशलेम के बीच प्रतीकात्मक सम्बन्ध
  choice: दोनों को ‘यह ... था’ द्वारा जोड़ा गया है, पर प्रतीक का अतिरिक्त अर्थ नहीं समझाया गया
  alternative: ‘यह यरूशलेम में निवास को दर्शाता था’
  rationale: लैटिन का सीधा विधेयात्मक रूप ‘haec erat’ है। ‘दर्शाता था’ अर्थ को स्पष्ट करता, पर स्रोत में निहित प्रतीकात्मक पहचान को व्याख्या बनाकर प्रस्तुत करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘आबाद रहने का समय’ भौतिक भवन का भ्रामक अर्थ टालता है; मुख्य पाठ में पाद-टिप्पणी चिह्न [a] उपस्थित है।
