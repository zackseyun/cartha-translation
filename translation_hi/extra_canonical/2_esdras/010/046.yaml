  text: Three things Solomon built in the city and offered offerings; then it was that the barren woman bore a son. And what it told you, that
translation:
  language: hi
  text: सुलैमान ने नगर में तीन चीज़ें बनाईं और भेंटें चढ़ाईं; तब ऐसा हुआ कि बाँझ स्त्री ने एक पुत्र को जन्म दिया। और उसने तुमसे जो कहा कि—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tres
  choice: तीन चीज़ें
  rationale: लैटिन में केवल स्त्रीलिंग बहुवचन ‘तीन’ है और उसकी गिनी जाने वाली वस्तुओं का नाम इस अंश में नहीं है; इसलिए अनिर्दिष्टता बनाए रखने के लिए ‘तीन चीज़ें’ रखा गया।
- source_word: aedificauit
  choice: बनवाईं
  rationale: सुलैमान जैसे राजा के निर्माण कार्य के लिए स्वाभाविक हिन्दी में प्रेरणार्थक रूप उपयुक्त है, जबकि निर्माण का अर्थ बना रहता है।
- source_word: obtulit oblationes
  choice: भेंटें चढ़ाईं
  rationale: यह उपासना-संबंधी अर्पण को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: sterilis
  choice: बाँझ स्त्री
  rationale: लैटिन विशेषण यहाँ स्त्री के लिए संज्ञा की तरह प्रयुक्त है; हिन्दी में अर्थ स्पष्ट करने हेतु ‘स्त्री’ जोड़ा गया।
- source_word: Et quod tibi dixit quoniam
  choice: और उसने तुमसे जो यह कहा कि—
  rationale: मूल का वाक्य अगले पद में पूरा होता है; दीर्घ विराम अधूरे कथन और आगे जारी रहने को दर्शाता है।
theological_decisions:
- issue: बाँझ स्त्री के पुत्र-जन्म का कथन
  choice: ‘उसी समय बाँझ स्त्री ने एक पुत्र को जन्म दिया’ के रूप में सीधा कथन
  alternative: किसी विशिष्ट बाइबिलीय स्त्री या घटना की पहचान जोड़ना
  rationale: इस पद में स्त्री की पहचान नहीं दी गई है; किसी विशेष धर्मवैज्ञानिक पहचान को आरोपित करना उचित नहीं होगा।
- issue: अंतिम कथन में बोलने वाले का संदर्भ
  choice: ‘उसने’
  alternative: ‘उस स्त्री ने’ या ‘दर्शन ने’
  rationale: लैटिन में निहित कर्ता का स्पष्ट नाम नहीं है; सर्वनाम मूल की संदर्भगत अनिश्चितता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत का आरंभ व्याकरण की दृष्टि से असामान्य है, इसलिए अंग्रेज़ी परामर्श-पाठ के अनुरूप ‘तीन चीज़ें’ रखा गया है; वस्तुओं की पहचान नहीं जोड़ी गई। अंतिम खंड जानबूझकर अधूरा छोड़ा गया है क्योंकि मूल पाठ भी अगले पद की ओर बढ़ता है।
