  text: campo, ubi domus non est aedificata. Sciebam enim ego quoniam altissimus incipiebat tibi ostendere haec. Propterea dixi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/052.yaml
  text: For I knew that the Most High was beginning to show you these things[a]. Therefore I said
translation:
  language: hi
  text: ऐसे मैदान में, जहाँ कोई घर न बना हो। क्योंकि मैं जानता था कि परमप्रधान तुम्हें ये बातें दिखाना आरम्भ कर रहा था।[a] इसलिए मैंने कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमप्रधान तुम्हें ये बातें दिखाने ही वाला था।”
    reason: incipiebat के यहाँ किसी कार्य के आरम्भ होने या उसके निकट होने—दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: campo, ubi domus non est aedificata
  choice: ऐसे मैदान में, जहाँ कोई घर न बना हो
  rationale: खंडित लैटिन वाक्यांश को उसके स्थान-सूचक अर्थ सहित रखा गया है; यह पिछले प्रसंग से व्याकरणिक रूप से जुड़ता है।
- source_word: altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का अर्थ और गरिमामय धार्मिक प्रयोग दोनों सुरक्षित रहते हैं।
- source_word: incipiebat ... ostendere
  choice: दिखाना आरम्भ कर रहा था
  rationale: लैटिन के अपूर्ण भूतकाल और incipio + infinitive के सीधे आरम्भिक अर्थ को व्यक्त करता है, जबकि वैकल्पिक भावी अर्थ फुटनोट में सुरक्षित है।
- source_word: Propterea dixi
  choice: इसलिए मैंने कहा,
  rationale: कारण-परिणाम संबंध को स्पष्ट रखता है और आगे आने वाले कथन की ओर संकेत करने के लिए अल्पविराम दिया गया है।
theological_decisions:
- issue: incipiebat ostendere का कालगत भाव
  choice: परमप्रधान ... दिखाना आरम्भ कर रहा था
  alternative: परमप्रधान ... दिखाने ही वाला था
  rationale: मुख्य पाठ में लैटिन के सामान्य प्रगतिशील/आरम्भिक अर्थ को रखा गया है; अनुवादगत पृष्ठभूमि में संभव निकट-भविष्य अर्थ को बिना निर्णायक रूप से थोपे फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमामय हिन्दी। आरम्भिक स्थान-सूचक खंड तथा अंतिम अधूरा कथन स्रोत की वाक्यगत निरंतरता के अनुसार सुरक्षित रखे गए हैं।
