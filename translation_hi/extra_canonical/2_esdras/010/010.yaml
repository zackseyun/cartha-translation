  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/010.yaml
  text: From her all have had their beginnings, and others come; and behold, nearly all walk to destruction and to extermination.
translation:
  language: hi
  text: उसी से सबका आरम्भ हुआ है, और दूसरे आते हैं; और देखो, लगभग सभी विनाश और सर्वनाश की ओर चलते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex ipsa
  choice: उसी से
  rationale: स्त्रीलिंग एकवचन संकेत को प्रसंगानुसार बनाए रखता है, बिना उसके संदर्भ को अनावश्यक रूप से स्पष्ट किए।
- source_word: initia omnes nacti
  choice: सबने अपना आरम्भ पाया है
  rationale: लातीनी अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप; सबकी उत्पत्ति उसी से होने का भाव सुरक्षित है।
- source_word: alii ueniunt
  choice: दूसरे भी आते रहते हैं
  rationale: नए लोगों के निरंतर आते जाने का स्वाभाविक भाव व्यक्त करता है; केवल एक बार आने की धारणा से बचाता है।
- source_word: pene omnes
  choice: लगभग सभी
  rationale: pene का परिमाण-सूचक अर्थ ठीक-ठीक बनाए रखता है।
- source_word: in perditionem ... et in exterminium
  choice: विनाश और सर्वनाश की ओर
  rationale: दोनों निकटार्थी किन्तु पृथक लातीनी पदों की तीव्रता और समानांतरता बनाए रखता है।
theological_decisions:
- issue: ‘उसी’ के संदर्भ की पहचान
  choice: स्त्रीलिंग/पूर्वसंदर्भ को ‘उसी’ के रूप में अनिर्दिष्ट रखा गया
  alternative: ‘पृथ्वी से’ या किसी अन्य स्पष्ट संज्ञा का प्रयोग
  rationale: इस पदांश में ipsa का संदर्भ पूर्ववर्ती प्रसंग पर निर्भर है; पाठ में संज्ञा जोड़ना मूल की अपेक्षा अधिक व्याख्यात्मक होता।
- issue: perditio और exterminium का संबंध
  choice: दो समांतर गंतव्यों के रूप में अनूदित
  alternative: एक ही संयुक्त परिणाम के रूप में अर्थ-संक्षेप
  rationale: लातीनी पाठ दोनों पदों को et से जोड़ता है; अतः उनके बीच की वास्तविक पुनरुक्तिपूर्ण तीव्रता को बनाए रखा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘देखो’ ने ecce की प्रत्यक्ष ध्यानाकर्षक शक्ति बनाए रखी है। उपलब्ध स्रोत की आरम्भिक खंडित ध्वनि ‘germinantium.’ को पिछले वाक्य का अवशेष मानकर इस पद के मुख्य पाठ में शामिल नहीं किया गया।
