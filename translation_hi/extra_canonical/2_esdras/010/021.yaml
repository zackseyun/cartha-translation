source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: vides enim, quoniam sanctificatio nostra deserta effecta est et altare nostrum demolitum est et templum nostrum destructum est,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/021.yaml
  text: For you see that our sanctuary has been laid waste, our altar has been torn down, and our temple has been destroyed.
translation:
  language: hi
  text: क्योंकि तुम देखती हो कि हमारा पवित्रस्थान उजाड़ कर दिया गया है, हमारी वेदी ढा दी गई है और हमारा मंदिर नष्ट कर दिया गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sanctificatio nostra
  choice: हमारा पवित्रस्थान
  rationale: लातीनी शब्द का मूल अर्थ ‘पवित्रीकरण/पवित्रता’ हो सकता है, पर इस प्रसंग में वेदी और मंदिर के समानांतर यह पवित्र स्थान अथवा धर्मस्थान को सूचित करता है; ‘पवित्रस्थान’ स्वाभाविक और संदर्भानुकूल है।
- source_word: deserta effecta est
  choice: उजाड़ दिया गया है
  rationale: विनाश और परित्यक्त अवस्था दोनों का भाव व्यक्त करता है तथा कर्मवाच्य संरचना बनाए रखता है।
- source_word: altare nostrum
  choice: हमारी वेदी
  rationale: बलिदान की वेदी के लिए मानक और स्पष्ट हिन्दी शब्द।
- source_word: demolitum est
  choice: ढा दी गई है
  rationale: संरचना को गिराए जाने का ठोस भाव देता है और ‘नष्ट’ से स्रोत में मौजूद शब्दभेद सुरक्षित रखता है।
- source_word: templum nostrum
  choice: हमारा मंदिर
  rationale: templum का सीधा, सामान्य और प्रसंगानुकूल हिन्दी रूप।
- source_word: destructum est
  choice: नष्ट कर दिया गया है
  rationale: मंदिर के पूर्ण विध्वंस को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: sanctificatio को अमूर्त ‘पवित्रता/पवित्रीकरण’ या ठोस ‘पवित्रस्थान’ के रूप में प्रस्तुत करना
  choice: पवित्रस्थान
  alternative: हमारी पवित्रता / हमारा पवित्रीकरण
  rationale: वेदी और मंदिर के साथ त्रिपदी समानांतरता इसे किसी ठोस पवित्र परिसर या धर्मस्थान के अर्थ में पढ़ने का प्रबल आधार देती है; फिर भी अनावश्यक रूप से इसे केवल ‘मंदिर’ नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। संबोधन स्त्रीलिंग ‘देखती हो’ रखा गया है, क्योंकि प्रसंग में एज्रा शोक करती हुई स्त्री से बोल रहा है। तीनों कर्मवाच्य खंडों की समानांतर संरचना सुरक्षित रखी गई है।
