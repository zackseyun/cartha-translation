  text: Now therefore, keep your grief within yourself, and bravely bear the misfortunes that have happened to you.
translation:
  language: hi
  text: इसलिए अब अपना दुःख अपने भीतर ही थामे रखो और जो विपत्तियाँ तुम पर आ पड़ी हैं, उन्हें साहस के साथ सहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: retine apud temet ipsam dolorem tuum
  choice: अपना दुःख अपने भीतर ही थामे रखो
  rationale: ‘retine’ के रोककर/थामकर रखने और ‘apud temet ipsam’ के अपने भीतर रखने—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है। स्त्रीलिंग ‘ipsam’ का अलग रूप हिन्दी क्रिया में प्रकट नहीं होता, पर संबोधन का आशय नहीं बदला गया।
- source_word: fortiter fer
  choice: साहस के साथ सहो
  rationale: ‘fortiter’ के साहसपूर्वक और ‘fer’ के सहने/झेलने के अर्थ को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: quae tibi contigerunt casus
  choice: जो विपत्तियाँ तुम पर आ पड़ी हैं
  rationale: ‘casus’ यहाँ प्रतिकूल घटनाओं या दुर्भाग्यों को दर्शाता है; ‘विपत्तियाँ’ प्रसंगानुकूल है, और ‘contigerunt’ को ‘आ पड़ी हैं’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन एकवचन अनौपचारिक ‘तुम’ में रखा गया है। वाक्य गरिमापूर्ण और सीधा है तथा लैटिन के निष्कर्षसूचक ‘nunc ergo’ को ‘इसलिए अब’ से व्यक्त करता है।
