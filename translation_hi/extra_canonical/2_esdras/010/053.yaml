base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/053.yaml
  text: Therefore I told you to come into the field[a], where there is no foundation of a building.
translation:
  language: hi
  text: इसीलिए मैंने तुमसे कहा था कि तुम उस खेत[a] में जाओ, जहाँ किसी भवन की नींव नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खुले भू-भाग’।
    reason: agrum का अर्थ खेत के साथ किसी भू-भाग या खुले स्थान के रूप में भी लिया जा सकता है, यद्यपि प्रसंग विशिष्ट खेत का समर्थन करता है।
lexical_decisions:
- source_word: agrum
  choice: खेत
  rationale: लैटिन agrum किसी खेत या निश्चित भू-भाग को सूचित करता है। प्रसंग में यह एज्रा को बताए गए विशिष्ट, निर्माणरहित स्थान से जुड़ा है; इसलिए व्यापक अर्थ वाले ‘देहात’ के बजाय ‘खेत’ उपयुक्त है।
- source_word: fundamentum aedificii
  choice: किसी भवन की नींव
  rationale: यह लैटिन संबंध-वाक्यांश का स्वाभाविक हिन्दी रूप है और उस स्थान पर भवन की नींव न होने का अर्थ स्पष्ट रखता है।
- source_word: propterea dixi tibi
  choice: इसीलिए मैंने तुमसे कहा था
  rationale: propterea का कारणसूचक बल ‘इसीलिए’ से और पूर्व में दिए गए निर्देश का भाव ‘कहा था’ से स्वाभाविक रूप में व्यक्त होता है।
