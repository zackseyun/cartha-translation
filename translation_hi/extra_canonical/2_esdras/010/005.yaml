  text: Then I left off the words in which I had still been engaged, and I answered in anger and said,
translation:
  language: hi
  text: तब जिन बातों में मैं अभी तक लगा हुआ था, उन्हें मैंने छोड़ दिया, और क्रोध में उत्तर दिया और कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: मैंने छोड़ दिया
  rationale: यह लैटिन क्रिया आरम्भ किए हुए कथन को रोक देने या उससे हट जाने का भाव देती है; सहज हिन्दी में ‘छोड़ दिया’ उपयुक्त है।
- source_word: sermones
  choice: बातें
  rationale: यहाँ संदर्भ बोले जा रहे कथनों का है; ‘बातें’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: in quibus adhuc eram
  choice: जो ... मैं अभी कह ही रहा था
  rationale: लैटिन का शाब्दिक अर्थ ‘जिनमें मैं अब तक था’ है; प्रसंग में इसका अर्थ उन बातों में अभी लगे होने से है। ‘कह ही रहा था’ जारी वचन की स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: respondi
  choice: मैंने ... उत्तर दिया
  rationale: लैटिन के सामान्य अर्थ को सीधे बनाए रखा गया है; स्रोत में उत्तर पाने वाले के लिए कोई सर्वनाम नहीं है।
- source_word: cum
  choice: क्रोध में
  rationale: प्रदत्त लैटिन पाठ ‘cum’ पर अपूर्ण समाप्त होता है, जबकि परामर्श-पाठ अगले भाव को ‘in anger’ के रूप में सुरक्षित रखता है। पद की स्वीकृत वाक्य-सीमा के अनुसार इसे रखा गया है, पर स्रोतगत अपूर्णता को टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: उत्तर पाने वाले व्यक्ति की पहचान
  choice: किसी कर्म-सर्वनाम को नहीं जोड़ा गया
  alternative: ‘उसे उत्तर दिया’
  rationale: प्रदत्त लैटिन में ‘her’ या उसके समान कोई कर्म-सर्वनाम नहीं है; इसलिए किसी स्त्री को स्पष्ट रूप से जोड़ना स्रोत से आगे जाना होता।
- issue: पद के अंत में क्रोध का उल्लेख
  choice: ‘क्रोध में’ रखा गया
  alternative: पद को ‘और मैंने उत्तर दिया, जब...’ जैसे अपूर्ण रूप में छोड़ना
  rationale: मुद्रित स्रोत-अंश ‘cum’ पर कटता हुआ प्रतीत होता है, पर अंग्रेज़ी परामर्श-पाठ इस पद की परंपरागत पूर्ति ‘in anger and said’ देता है। पठनीय पद प्रस्तुत करते हुए इस पाठगत स्थिति को टिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। ‘कह ही रहा था’ से चल रही बात के अचानक रोक दिए जाने का भाव आता है। कोई ऐसा सर्वनाम नहीं जोड़ा गया जो लैटिन स्रोत में उपस्थित नहीं है।
