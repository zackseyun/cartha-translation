  text: audire. Tu autem beatus es prae multis, et uocatus es apud
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/057.yaml
  text: But you are blessed above many[a], and you have been called by the Most High, as only a few have been.
translation:
  language: hi
  text: पर तुम बहुतों से बढ़कर धन्य हो, और परमप्रधान के समक्ष बुलाए गए हो[a], जैसे कि थोड़े ही लोग बुलाए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमप्रधान के द्वारा बुलाए गए हो।”
    reason: लैटिन apud मूलतः ‘के पास/के समक्ष’ का अर्थ देता है, पर इस प्रसंग में इसे बुलाने वाले कर्ता की ओर संकेत मानना भी संभव है।
lexical_decisions:
- source_word: beatus ... prae multis
  choice: बहुतों से बढ़कर धन्य
  rationale: 'यह तुलनात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है: एज्रा बहुत-से अन्य लोगों की अपेक्षा विशेष रूप से धन्य है।'
- source_word: uocatus es
  choice: बुलाए गए हो
  rationale: लैटिन के पूर्ण कर्मवाच्य रूप का सीधा और स्वाभाविक हिन्दी प्रतिरूप।
- source_word: apud
  choice: के सामने
  rationale: apud सामान्यतः निकटता, उपस्थिति या किसी के समक्ष होने का बोध कराता है; इसलिए इसे सीधे कर्ता-सूचक ‘के द्वारा’ न बनाकर उपस्थिति का अर्थ सुरक्षित रखा गया है।
- source_word: sicut pauci
  choice: जैसे थोड़े ही लोग बुलाए गए हैं
  rationale: ‘थोड़े ही’ विशिष्टता और दुर्लभता का भाव देता है; ‘बुलाए गए हैं’ जोड़ने से हिन्दी में तुलना स्पष्ट और पूर्ण होती है।
theological_decisions:
- issue: परमप्रधान बुलाने वाला है या वह जिसकी उपस्थिति में बुलाया गया है
  choice: परमप्रधान के सामने बुलाए गए हो
  alternative: परमप्रधान के द्वारा बुलाए गए हो
  rationale: प्राप्त लैटिन में apud है, ab नहीं; अतः उपस्थिति/समक्षता का अर्थ व्याकरण की दृष्टि से अधिक प्रत्यक्ष है। फिर भी प्रसंग में परमप्रधान को बुलाने वाला समझना संभव है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमप्रधान’ ईश्वर के लिए प्रचलित बाइबिलीय पद है। तुलना की समानांतरता स्पष्ट करने के लिए अंतिम उपवाक्य में ‘बुलाए गए हैं’ दोहराया गया है।
