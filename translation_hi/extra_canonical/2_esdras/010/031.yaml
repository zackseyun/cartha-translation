source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'pedes meos et dixit mihi: Quid tibi est, et quare conturbaris, et quid conturbatus est intellectus tuus et sensus cordis tui ? et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/031.yaml
  text: and said to me, “What is the matter with you? And why are you troubled? And why are your understanding and the perception of your heart troubled?”
translation:
  language: hi
  text: और उसने मुझसे कहा, “तुम्हें क्या हुआ है? तुम क्यों व्याकुल हो? और तुम्हारी समझ और तुम्हारे हृदय की अनुभूति क्यों विचलित हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris / conturbatus est
  choice: व्याकुल हो / व्याकुल हैं
  rationale: यह शब्द मानसिक और भावनात्मक अशांति को व्यक्त करता है; ‘व्याकुल’ दोनों प्रश्नों में स्वाभाविक और गरिमापूर्ण है।
- source_word: intellectus tuus
  choice: तुम्हारी बुद्धि
  rationale: ‘बुद्धि’ यहाँ समझने और विचार करने की क्षमता को संक्षेप में व्यक्त करती है।
- source_word: sensus cordis tui
  choice: तुम्हारे हृदय की समझ
  rationale: शाब्दिक ‘हृदय की अनुभूति/बोध’ के आशय को साधारण आधुनिक हिन्दी में स्पष्ट रखते हुए हृदयगत ग्रहण-बोध को व्यक्त करता है।
theological_decisions:
- issue: अंतिम प्रश्न में दो समन्वित मानसिक/आंतरिक क्षमताओं का संबंध
  choice: ‘तुम्हारी बुद्धि और तुम्हारे हृदय की समझ’ को दो संयुक्त कर्ताओं के रूप में रखा गया है
  alternative: दोनों को मिलाकर केवल ‘तुम्हारा मन’ कहना
  rationale: मूल पाठ के intellectus और sensus cordis के भेद तथा उसकी अंतर्निहित अर्थ-तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य प्रश्नात्मक शैली। दिए गए अंश का आरंभ ‘pedes meos’ पिछले वाक्यांश की समाप्ति प्रतीत होता है; परामर्श-पाठ की पद-सीमा के अनुसार अनुवाद ‘और उसने मुझसे कहा’ से आरंभ किया गया है।
