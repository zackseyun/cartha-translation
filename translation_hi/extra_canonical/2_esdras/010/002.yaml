  yaml_path: translation/extra_canonical/2_esdras/010/002.yaml
  text: Then we all put out the lamps[a], and all my fellow citizens rose up to comfort me, and I rested until the next day, until night.
translation:
  language: hi
  text: तब हम सबने दीपक बुझा दिए, और मेरे सभी नगरवासी मुझे सांत्वना देने के लिए उठ खड़े हुए। फिर मैंने अगले दिन रात होने तक विश्राम किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evertimus
  choice: बुझा दिए
  rationale: दीपकों के संदर्भ में लैटिन क्रिया का स्वाभाविक आशय उन्हें बुझाना है।
- source_word: omnes
  choice: हम सबने
  rationale: omnes कर्ता का पुल्लिंग/स्त्रीलिंग कर्तृकारक बहुवचन है; यह lumina का विशेषण नहीं है।
- source_word: cives mei
  choice: मेरे सभी नगरवासी
  rationale: cives का सीधा अर्थ एक ही नगर के नागरिक या नगरवासी है; 'साथी नागरिक' की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: ad consolandam me
  choice: मुझे सांत्वना देने के लिए
  rationale: लैटिन उद्देश्यवाचक रचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: quievi
  choice: मैंने ... विश्राम किया
  rationale: quiescere यहाँ शांत रहने की अपेक्षा विश्राम करने को व्यक्त करता है।
- source_word: usque in alium diem usque noctem
  choice: अगले दिन रात होने तक
  rationale: दोनों usque पदों की सीमा-सूचक शक्ति बनाए रखते हुए हिन्दी में समयावधि को सहज रूप से व्यक्त करता है।
