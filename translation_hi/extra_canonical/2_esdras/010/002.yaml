  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। मूल में omnes का संबंध कर्ता से होने के कारण 'हम सबने' किया गया है; अंग्रेज़ी परत का दीपकों संबंधी वैकल्पिक फुटनोट लैटिन व्याकरण से समर्थित नहीं होने के कारण नहीं रखा गया।
