id: 2ES.10.48
reference: 2 Esdras 10:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'nutriuit eum cum labore, haec erat habitatio Hierusalem : Et quoniam dixit tibi quod filius meus ueniens in suo thalamo mortuus esset et contigisset ei casus, haec erat quae facta est ruina Hierusalem. Et ecce uidisti similitudinem eius, quomodo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/048.yaml
  text: And as for her saying to you[a], ‘My son, when he entered his bridal chamber, died, and disaster befell him,’ this was the ruin that came upon Jerusalem.
translation:
  language: hi
  text: और उसने तुमसे जो कहा था[a], ‘मेरा बेटा जब अपने विवाह-कक्ष में गया, तो मर गया, और उस पर विपत्ति आ पड़ी,’ यह यरूशलेम का विनाश था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि मेरा बेटा जब अपने विवाह-कक्ष में आया, तो मर गया और उस पर विपत्ति आ पड़ी।”
    reason: quod को प्रत्यक्ष कथन आरंभ कराने वाला पद या परोक्ष कथन सूचक ‘कि’—दोनों प्रकार से समझा जा सकता है।
lexical_decisions:
- source_word: thalamo
  choice: विवाह-कक्ष
  rationale: लातीनी शब्द विवाह या दांपत्य से जुड़े कक्ष को दर्शाता है; यह चयन प्रसंग की वैवाहिक छवि को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: casus
  choice: विपत्ति
  rationale: यहाँ शब्द किसी अनिष्ट या दुर्भाग्यपूर्ण घटना को सूचित करता है; 'विपत्ति' जानबूझकर घटना का सटीक स्वरूप अनिर्धारित रखता है।
- source_word: ruina Hierusalem
  choice: यरूशलेम का विनाश
  rationale: यह यरूशलेम पर आए पतन और तबाही को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: quod filius meus को प्रत्यक्ष कथन या परोक्ष कथन मानना
  choice: 'स्त्री के प्रथम-पुरुष कथन के रूप में प्रत्यक्ष उद्धरण: ‘मेरा बेटा…’'
  alternative: ‘कि मेरा बेटा…’ के रूप में परोक्ष कथन
  rationale: filius meus में प्रथम पुरुष 'मेरा' वक्ता स्त्री की आवाज़ को सुरक्षित रखता है; प्रत्यक्ष उद्धरण से यह भ्रम नहीं होता कि स्वर्गदूत अपने पुत्र की बात कर रहा है।
- issue: contigisset ei casus की अनिश्चितता
  choice: ‘उस पर विपत्ति आ पड़ी’
  alternative: किसी विशिष्ट दुर्घटना या दैवी दंड के रूप में स्पष्ट करना
  rationale: मूल पाठ केवल अनिष्ट घटने की बात कहता है; उसका प्रकार या कारण निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज है। ‘विवाह-कक्ष’ वैवाहिक बिंब को बनाए रखता है और ‘विपत्ति’ मूल की अस्पष्टता सुरक्षित रखती है।
