  text: या मेरा मन धोखा खा रहा है, और मेरी आत्मा सपना देख रही है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fallitur
  choice: धोखा खा रहा है
  rationale: लातीनी निष्क्रिय क्रिया का अर्थ ‘धोखे में होना/भ्रमित होना’ है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल प्रश्न की अनिश्चितता बनाए रखता है।
- source_word: anima mea
  choice: मेरी आत्मा
  rationale: ‘anima’ के लिए ‘आत्मा’ मन से उसका स्पष्ट भेद बनाए रखता है और धार्मिक-साहित्यिक प्रसंग के अनुरूप है।
- source_word: somniatur
  choice: सपना देख रही है
  rationale: यह मूल के स्वप्न देखने के भाव को साधारण, स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभिक ‘या’ पिछले कथन के साथ मूल के वैकल्पिक प्रश्न-संबंध को बनाए रखता है; ‘मन’ और ‘आत्मा’ का भेद भी सुरक्षित है।
