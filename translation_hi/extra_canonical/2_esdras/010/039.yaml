  text: rectam uiam tuam, quoniam sine intermissione contristabaris pro populo tuo et ualde lugebas propter Sion. Hic ergo intel-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/039.yaml
  text: For he has seen your upright way[a], because you were grieving without ceasing for your people and mourning greatly for Zion.
translation:
  language: hi
  text: क्योंकि उसने तुम्हारा खरा आचरण[a] देखा है, क्योंकि तुम अपने लोगों के लिए निरंतर शोक करते रहे और सिय्योन के लिए बहुत विलाप करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तुम्हारा सीधा मार्ग’; अर्थात्, तुम्हारा खरा आचरण।
    reason: लैटिन मार्ग-रूपक (rectam uiam) को दर्ज करते हुए उसके संदर्भगत नैतिक आशय को स्पष्ट करता है।
lexical_decisions:
- source_word: rectam uiam tuam
  choice: तुम्हारा सीधा मार्ग
  rationale: यह पदबंध नैतिक रूप से सही आचरण का रूपक है। ‘सीधा मार्ग’ हिन्दी में उस रूपक को बनाए रखते हुए धर्मनिष्ठ जीवन-चाल का स्वाभाविक संकेत देता है।
- source_word: sine intermissione contristabaris
  choice: तुम निरंतर शोक करते रहे
  rationale: यह अनवरत दुःख की जारी अवस्था व्यक्त करता है; ‘निरंतर’ sine intermissione का संक्षिप्त और सहज समतुल्य है।
- source_word: ualde lugebas
  choice: बहुत विलाप करते रहे
  rationale: ualde तीव्रता और lugebas गहरे मातम अथवा विलाप को व्यक्त करता है; अपूर्ण भूतकाल की निरंतरता ‘करते रहे’ से प्रकट होती है।
- source_word: propter Sion
  choice: सिय्योन के कारण
  rationale: propter का कारणसूचक अर्थ सुरक्षित रखा गया है और Sion का प्रचलित हिन्दी बाइबलीय रूप ‘सिय्योन’ लिया गया है।
theological_decisions:
- issue: rectam uiam का नैतिक या भौतिक अर्थ
  choice: मुख्य पाठ में ‘सीधा मार्ग’ रखकर नैतिक जीवन-चाल का रूपक संरक्षित किया गया।
  alternative: ‘खरा आचरण’ या ‘धर्ममय चालचलन’।
  rationale: संदर्भ एज्रा के अपने लोगों और सिय्योन के लिए निरंतर शोक को सराहनीय आचरण के रूप में प्रस्तुत करता है; फिर भी ‘मार्ग’ के मूल रूपक को मिटाना उचित नहीं।
- issue: quoniam का संबंध
  choice: ‘क्योंकि’ द्वारा कारणसूचक संबंध रखा गया।
  alternative: ‘कि’ द्वारा व्याख्यात्मक संबंध।
  rationale: लैटिन quoniam यहाँ उसके सीधे मार्ग को देखने का कारण आगे के शोक और विलाप में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबलीय गद्य। ‘सिय्योन’ पारंपरिक नाम-रूप है; ‘शोक’ और ‘विलाप’ मूल के निकटवर्ती भावों के बीच अंतर बनाए रखते हैं।
