  text: Therefore I beg you to show your servant the meaning of this departure.” And he answered me and[a]
translation:
  language: hi
  text: इसलिए मैं तुझसे विनती करता हूँ कि तू अपने दास को इस प्रस्थान का अर्थ बता।” तब उसने मुझे उत्तर दिया और[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस विस्मयावस्था का अर्थ बता।”
    reason: लैटिन excessus का अर्थ ‘प्रस्थान’ के साथ-साथ सामान्य अवस्था या चेतना से बाहर होने की असाधारण अवस्था भी हो सकता है; यह विकल्प उस व्यापक संदर्भगत अर्थ को बिना किसी विशिष्ट धार्मिक साधना का संकेत जोड़े व्यक्त करता है।
lexical_decisions:
- source_word: demonstres
  choice: अर्थ बता
  rationale: लैटिन संभावनार्थक क्रिया यहाँ विनती के आशय में है; हिन्दी में ‘अर्थ बता’ स्वाभाविक रूप से अनुरोध और व्याख्या—दोनों को व्यक्त करता है।
- source_word: seruo tuo
  choice: अपने दास को
  rationale: मूल का प्रत्यक्ष सेवक-दास संबंध बनाए रखा गया है और संबोधन में ‘तू’ के साथ संगति रखता है।
- source_word: excessu hoc
  choice: इस प्रस्थान
  rationale: excessus का मूल अर्थ बाहर निकलना या प्रस्थान है। संदर्भ में यह किसी सामान्य अवस्था से बाहर चले जाने अथवा दृश्य में हुए लोप की ओर संकेत कर सकता है; इसलिए मुख्य पाठ में औपचारिक समतुल्य रखा गया है और वैकल्पिक दर्शनीय अर्थ पादटिप्पणी में दिया गया है।
- source_word: Et respondit ad me et
  choice: तब उसने मुझे उत्तर दिया और
  rationale: मूल पाठ का अधूरा संयोजक खंड जानबूझकर सुरक्षित रखा गया है, क्योंकि वाक्य अगले पद में जारी रहता है। आरंभिक Et को हिन्दी कथानक में स्वाभाविक ‘तब’ से व्यक्त किया गया है।
theological_decisions:
- issue: excessus का अर्थ—प्रस्थान या भावसमाधि/दृष्टि-अवस्था
  choice: मुख्य पाठ में ‘प्रस्थान’
  alternative: ‘इस भावसमाधि का अर्थ’
  rationale: लैटिन शब्द दोनों अर्थ दे सकता है। मुख्य पाठ उसके प्रत्यक्ष ‘बाहर जाने’ वाले अर्थ को सुरक्षित रखता है, जबकि पादटिप्पणी उस संभावित भविष्यदर्शी अवस्था को सामने रखती है जिसे लैटिन excessus प्रायः यूनानी ἔκστασις के अनुरूप व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सुबोध हिन्दी। परमेश्वरदत्त स्वर्गदूत से प्रत्यक्ष संबोधन में पारंपरिक एकवचन ‘तू’ रखा गया है। पद के अंत का ‘और’ स्रोत की जानबूझकर सुरक्षित रखी गई अपूर्णता है और अगले पद से जुड़ता है।
