id: 2ES.10.54
reference: 2 Esdras 10:54
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tibi ut uenires in agrum, ubi non est fundamentum aedificii. Nec enim poterat opus aedificii hominis sustinere in loco ubi incipiebat altissimi ciuitas ostendi. Tu ergo noli timere, neque expauescat cor tuum, sed ingredere et uide splendorem et magnitudinem aedificii, quantum capax est tibi uisus oculorum uidere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/054.yaml
  text: For no work of human building could endure in the place where the city of the Most High was beginning to be shown.
translation:
  language: hi
  text: क्योंकि जिस स्थान पर परमप्रधान का नगर प्रकट होना आरम्भ हुआ था, वहाँ मनुष्य का कोई निर्माण-कार्य टिक नहीं सकता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus aedificii hominis
  choice: मनुष्य के बनाए किसी भी भवन का काम
  rationale: लातीनी पदबंध में मानवीय निर्माण-कार्य का भाव है। यह अनुवाद उसे स्वाभाविक हिन्दी में व्यक्त करता है और इसे केवल एक खास भवन तक सीमित नहीं करता।
- source_word: sustinere
  choice: टिक नहीं सकता था
  rationale: यहाँ क्रिया का अर्थ उस दिव्य नगर के प्रकट होने वाले स्थान में बने रहने या स्थिर रह सकने से है; ‘टिकना’ आधुनिक हिन्दी में इस भाव को सहजता से व्यक्त करता है।
- source_word: altissimi ciuitas
  choice: परमप्रधान का नगर
  rationale: ‘Altissimi’ परमेश्वर के लिए प्रयुक्त सर्वोच्चता-सूचक उपाधि है; ‘परमप्रधान’ उसका प्रतिष्ठित और अर्थ-सटीक हिन्दी रूप है।
- source_word: incipiebat ... ostendi
  choice: प्रकट होना आरम्भ हुआ था
  rationale: लातीनी निष्क्रिय क्रिया और आरम्भिक अवस्था दोनों सुरक्षित रखी गई हैं; नगर को कौन दिखा रहा था, यह अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: मानवीय निर्माण और परमप्रधान के नगर के बीच संबंध
  choice: मानवीय भवन का काम उस स्थान पर टिक नहीं सकता था
  alternative: मानवीय भवन उस नगर को सहारा नहीं दे सकता था
  rationale: ‘in loco’ स्थानगत अर्थ को पुष्ट करता है। पाठ यह नहीं कहता कि मनुष्य का भवन दिव्य नगर को संरचनात्मक सहारा देने में असमर्थ था, बल्कि उस प्रकट होने के स्थान में मानवीय निर्माण टिक नहीं सकता था।
- issue: नगर के प्रकट किए जाने का कर्ता
  choice: कर्ता को अनिर्दिष्ट रखा गया
  alternative: परमेश्वर अपना नगर दिखाने लगा था
  rationale: मूल में ‘ostendi’ निष्क्रिय है और कर्ता व्यक्त नहीं है; इसलिए धार्मिक अनुमान जोड़ने के बजाय वास्तविक अस्पष्टता बनाए रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। वाक्य मूल पद की कारणसूचक भूमिका बनाए रखने के लिए ‘क्योंकि’ से आरम्भ होता है।
