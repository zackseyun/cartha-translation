source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem contristaris in uno filio. Interroga enim terram et dicet tibi, quoniam haec est quae debeat lugere tantorum super eam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/009.yaml
  text: But you are grieving over one son. For ask the earth[a], and it will tell you that it is she who ought to mourn for so many upon her.
translation:
  language: hi
  text: पर तुम अपने एक ही पुत्र के लिए शोक कर रही हो। क्योंकि पृथ्वी से पूछो, और वह तुम्हें बताएगी कि उस पर इतने लोगों के लिए शोक तो उसी को करना चाहिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contristaris
  choice: शोक कर रही हो
  rationale: लैटिन का वर्तमानकालीन, प्रत्यक्ष कथन है; संबोधित स्त्री के अनुसार स्त्रीलिंग रूप रखा गया है।
- source_word: in uno filio
  choice: अपने एक ही पुत्र के लिए
  rationale: '''एक ही'' उस एक पुत्र और पृथ्वी पर उपस्थित अनेक लोगों के बीच स्रोत के विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।'
- source_word: Interroga ... terram
  choice: पृथ्वी से पूछो
  rationale: आज्ञार्थक क्रिया और कर्म को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: lugere
  choice: शोक ... करना
  rationale: मातृ-विलाप के प्रसंग के अनुकूल, dignified और सामान्य हिन्दी शब्द।
- source_word: tantorum super eam
  choice: उस पर जो इतने लोग हैं, उनके लिए
  rationale: लैटिन में व्यक्तियों का संज्ञा-लोप है; हिन्दी में अर्थ-बोध के लिए 'लोग' जोड़ा गया, पर उनके जन्मने या मरने जैसी कोई अतिरिक्त धारणा नहीं जोड़ी गई।
theological_decisions:
- issue: पृथ्वी का मानवीकरण
  choice: वह तुम्हें बताएगी ... उसी को करना चाहिए
  alternative: यह तुम्हें बताएगी ... इसी को करना चाहिए
  rationale: लैटिन 'quae' पृथ्वी को मानवीकृत स्त्रीलिंग कर्ता के रूप में प्रस्तुत करता है; हिन्दी में 'वह/उसी' इस चित्र को सुरक्षित रखता है।
- issue: '''tantorum'' का निहित संदर्भ'
  choice: इतने लोग
  alternative: इतनों
  rationale: स्रोत केवल 'इतने [लोगों]' कहता है; स्पष्टता के लिए सामान्य संज्ञा दी गई है, बिना यह तय किए कि वे जीवित हैं, मृत हैं, या पृथ्वी से उत्पन्न हुए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर किंतु साधारण पाठक के लिए सुबोध। लैटिन की वाक्य-सीमा, 'पर/क्योंकि' संबंध, पृथ्वी का मानवीकरण और 'एक' बनाम 'अनेक' का तनाव सुरक्षित रखा गया है।
