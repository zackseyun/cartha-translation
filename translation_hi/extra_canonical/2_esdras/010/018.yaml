translation:
  language: hi
  text: पर उसने मुझसे कहा, “मैं ऐसा नहीं करूँगी और न नगर में जाऊँगी, बल्कि यहीं मर जाऊँगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non faciam
  choice: मैं ऐसा नहीं करूँगी
  rationale: स्त्री वक्ता के पूर्ववर्ती संदर्भित आग्रह या कार्य को स्वाभाविक हिन्दी में व्यक्त करता है; लैटिन में कर्म अनुक्त है, इसलिए ‘ऐसा’ उस संदर्भ-सापेक्षता को बनाए रखता है।
- source_word: neque ingrediar civitatem
  choice: और न नगर में जाऊँगी
  rationale: ingrediar का मूल भाव नगर में प्रवेश करना है; सामान्य आधुनिक हिन्दी में ‘नगर में जाना’ सहज है और आशय सुरक्षित रखता है।
- source_word: sed hic moriar
  choice: बल्कि यहीं मर जाऊँगी
  rationale: sed के स्पष्ट विरोध को ‘बल्कि’ और hic के स्थानिक बल को ‘यहीं’ से व्यक्त किया गया है।
