  text: whom I bore with sorrows and brought forth with pains; but the earth, according to the way of the earth, goes away, as does the multitude now present in it’—
translation:
  language: hi
  text: जिसे मैंने शोकों के साथ जन्म दिया और पीड़ाओं के साथ जना; परन्तु पृथ्वी, पृथ्वी की रीति के अनुसार, चली गई है, और उसी तरह वह जनसमूह भी जो वर्तमान में उसमें है’—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quem
  choice: जिसे
  rationale: सम्बन्धवाचक सर्वनाम को पूर्ववर्ती पुत्र से जोड़ते हुए लैटिन के कर्मकारक रूप को सुरक्षित रखा गया है।
- source_word: cum meroribus peperi
  choice: मैंने शोक के साथ गर्भ में धारण किया
  rationale: peperio के इस प्रयोग में गर्भ धारण करने का भाव है; ‘शोक के साथ’ meroribus की भावात्मक तीव्रता बनाए रखता है।
- source_word: cum doloribus genui
  choice: पीड़ाओं के साथ जन्म दिया
  rationale: genui को प्रसव के समानांतर स्वाभाविक हिन्दी में व्यक्त किया गया है और doloribus का बहुवचन भाव ‘पीड़ाओं’ से रखा गया है।
- source_word: Terra autem
  choice: परन्तु पृथ्वी
  rationale: autem का विरोधसूचक बल ‘परन्तु’ से व्यक्त किया गया है।
- source_word: secundum uiam terrae
  choice: पृथ्वी की रीति के अनुसार
  rationale: शाब्दिक ‘पृथ्वी के मार्ग के अनुसार’ की अपेक्षा यह हिन्दी में स्वाभाविक है और पृथ्वी के नियत ढंग या क्रम का अर्थ खुला रखता है।
- source_word: abiit
  choice: चली जाती है
  rationale: लैटिन पूर्णकाल को प्रसंगगत सामान्य सत्य के रूप में समझते हुए वर्तमानकालीन हिन्दी दी गई है, अंग्रेज़ी परामर्श-पाठ के अनुरूप।
- source_word: quae in ea multitudo praesens
  choice: वह जनसमूह भी जो इस समय उसमें है
  rationale: असामान्य/कठिन लैटिन वाक्यरचना को अंग्रेज़ी परामर्श-पाठ के आधार पर पृथ्वी के साथ जनसमूह के चले जाने के समानांतर संबंध में स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: ‘पृथ्वी की रीति’ और उसमें उपस्थित जनसमूह के चले जाने का संबंध
  choice: पृथ्वी और वर्तमान जनसमूह—दोनों के चले जाने को समानांतर रूप में व्यक्त किया गया
  alternative: केवल जनसमूह को मुख्य कर्ता मानना, या उसके आने और जाने की तुलना करना
  rationale: प्राप्त साफ़ किए हुए लैटिन पाठ और लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ में Terra को abiit का कर्ता तथा जनसमूह को समानांतर रूप से जाने वाला माना गया है; अतिरिक्त आगमन-भाव पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद एक जारी वाक्य का अंश है, इसलिए आरम्भ में सम्बन्धवाचक ‘जिसे’ और अन्त में उद्धरण-चिह्न तथा दीर्घ विराम सुरक्षित हैं।
