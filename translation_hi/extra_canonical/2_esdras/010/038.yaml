  text: And he said, “Listen to me, and I will teach you, and I will tell you about the things you fear, because the Most High has revealed many mysteries to you.
translation:
  language: hi
  text: उसने कहा, “मेरी सुनो। मैं तुम्हें सिखाऊँगा और जिन बातों से तुम डरते हो, उनके विषय में तुम्हें बताऊँगा, क्योंकि परमप्रधान ने तुम्हें बहुत-से रहस्य प्रकट किए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: audi me
  choice: मेरी सुनो
  rationale: यह सरल और स्वाभाविक हिन्दी में लैटिन आज्ञार्थक अभिव्यक्ति का सीधा अर्थ देता है।
- source_word: doceam te
  choice: मैं तुम्हें सिखाऊँगा
  rationale: इस प्रसंग में लैटिन संभावनार्थक रूप वक्ता के आगामी शिक्षण का आश्वासन देता है; भविष्यकाल हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: de quibus times
  choice: उन बातों के विषय में…जिनसे तुम डरते हो
  rationale: लैटिन में भय की वस्तुएँ अनिर्दिष्ट हैं; अनुवाद उसी व्यापकता को बनाए रखता है।
- source_word: altissimus
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त सर्वोच्चता-सूचक उपाधि का प्रचलित, गरिमापूर्ण हिन्दी रूप है।
- source_word: mysteria multa
  choice: बहुत-से रहस्य
  rationale: यह मात्रा और रहस्योद्घाटन दोनों को बिना अतिरिक्त धार्मिक व्याख्या जोड़े व्यक्त करता है।
- source_word: reuelauit tibi
  choice: तुम पर…प्रकट किए हैं
  rationale: हिन्दी में रहस्य किसी व्यक्ति पर प्रकट किए जाने की अभिव्यक्ति स्वाभाविक है और लैटिन के पूर्ण भूतकाल का वर्तमान-संबद्ध परिणाम बनाए रखती है।
theological_decisions:
- issue: परमेश्वर की उपाधि altissimus
  choice: परमप्रधान
  alternative: सर्वोच्च परमेश्वर
  rationale: मूल पाठ केवल उपाधि देता है; ‘परमप्रधान’ बिना किसी अतिरिक्त संज्ञा या सांप्रदायिक विशिष्टता के उसे सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रारंभिक dixit का अनुवाद केवल ‘उसने कहा’ किया गया है; मूल में निहित न होने के कारण ‘उसने मुझे उत्तर दिया’ नहीं जोड़ा गया। स्रोत के अंत में आया अधूरा ‘Vidit enim’ अगले पाठांश की शुरुआत है, इसलिए इस पद के पूर्ण वाक्य में शामिल नहीं किया गया।
