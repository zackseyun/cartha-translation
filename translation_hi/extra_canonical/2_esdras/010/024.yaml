id: 2ES.10.24
reference: 2 Esdras 10:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu ergo excute tuam multam tristitiam, et depone abs te multitudinem dolorum, ut tibi repropitietur fortis, et requiem faciat tibi altissimus, requietionem laborum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/024.yaml
  text: Therefore shake off your great sadness, and put away from yourself the multitude of sorrows, so that the Mighty One may again be gracious to you, and the Most High may give you rest, relief from your labors.”
translation:
  language: hi
  text: इसलिए तुम अपनी बड़ी उदासी को झटक दो और अपने से दुखों की बहुतायत दूर कर दो, ताकि सामर्थी फिर से तुम पर अनुग्रह करे और परमप्रधान तुम्हें विश्राम दे, तुम्हारे परिश्रमों से राहत दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excute
  choice: झटक दो
  rationale: लातीनी क्रिया में किसी चिपकी या भारी वस्तु को झटककर दूर करने का सजीव भाव है; यह उदासी को सक्रिय रूप से त्यागने की आज्ञा को स्वाभाविक हिन्दी में रखता है।
- source_word: multitudinem dolorum
  choice: दुखों का अंबार
  rationale: शाब्दिक ‘दुखों की बहुतायत’ की अपेक्षा यह आधुनिक हिन्दी में अनेक और संचित दुखों का भाव स्पष्ट करता है।
- source_word: fortis
  choice: सामर्थी
  rationale: यहाँ विशेषण संज्ञा के रूप में परमेश्वर की उपाधि है; ‘सामर्थी’ उस रूप और धार्मिक गरिमा को बनाए रखता है।
- source_word: repropitietur
  choice: फिर से तुम पर अनुग्रह करे
  rationale: re- उपसर्ग से पुनः कृपालु होने का भाव आता है; ‘अनुग्रह करे’ propitius के कृपापूर्ण रुख को व्यक्त करता है, बिना किसी विशिष्ट प्रायश्चित्त-सिद्धांत को आरोपित किए।
- source_word: requiem ... requietionem laborum
  choice: विश्राम दे—तुम्हारे परिश्रमों से राहत
  rationale: मूल में निकटार्थी शब्दों की पुनरावृत्ति है। हिन्दी में ‘विश्राम’ और ‘राहत’ द्वारा इसे पठनीय रखते हुए श्रमों से छुटकारे का स्पष्टीकरण सुरक्षित है।
theological_decisions:
- issue: fortis और altissimus का संदर्भ
  choice: ‘सामर्थी’ और ‘परमप्रधान’ को अलग-अलग ईश्वरीय उपाधियों के रूप में रखा गया
  alternative: दोनों को केवल ‘परमेश्वर’ कहना
  rationale: मूल पाठ की समानांतर उपाधियाँ अलंकारिक और धर्मवैचारिक अर्थ रखती हैं; उन्हें समतल करना उचित नहीं।
- issue: repropitietur में पुनः कृपा का भाव
  choice: ‘फिर से तुम पर अनुग्रह करे’
  alternative: ‘तुमसे प्रसन्न हो’ या केवल ‘तुम पर कृपा करे’
  rationale: यह चुनाव पुनर्स्थापित कृपा की संभावना को बनाए रखता है, पर यह निर्धारित नहीं करता कि कृपा किस धार्मिक प्रक्रिया से मिलती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष संबोधन। ‘अपने मन से’ abs te का स्वाभाविक अर्थ प्रस्तुत करता है; वाक्य की काव्यात्मक समानांतरता और ईश्वरीय उपाधियाँ सुरक्षित रखी गई हैं।
