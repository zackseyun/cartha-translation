  text: And I said, “Speak, my lord; only do not forsake me, lest I die for nothing.
translation:
  language: hi
  text: तब मैंने कहा, “हे मेरे स्वामी, बोलिए; बस मुझे त्याग न दीजिए, कहीं ऐसा न हो कि मैं व्यर्थ ही मर जाऊँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquere
  choice: त्याग न दीजिए
  rationale: लातीनी क्रिया में छोड़ देने या असहाय त्याग देने का भाव है; आदरसूचक निषेध हिंदी में विनती का स्वर बनाए रखता है।
- source_word: frustra
  choice: व्यर्थ ही
  rationale: यह मृत्यु के निष्फल या निरर्थक हो जाने का भाव सीधे व्यक्त करता है।
- source_word: moriar
  choice: मैं … मर जाऊँ
  rationale: संभावित आशंका के संदर्भ में यह आधुनिक हिंदी का स्वाभाविक रूप है।
theological_decisions:
- issue: वक्ता द्वारा संबोधित व्यक्ति के लिए सम्मानसूचक पद
  choice: हे मेरे स्वामी
  alternative: हे मेरे प्रभु
  rationale: ‘स्वामी’ अंग्रेज़ी consultation layer के ‘my lord’ का सम्मानपूर्ण, किंतु अनावश्यक रूप से ईश्वरीय पहचान तय न करने वाला अनुवाद है।
- issue: ut non frustra moriar का संबंध
  choice: कहीं ऐसा न हो कि मैं व्यर्थ ही मर जाऊँ
  alternative: ताकि मैं व्यर्थ न मरूँ
  rationale: इस प्रसंग में वाक्यांश विनती से जुड़ी आशंका व्यक्त करता है; चुना गया रूप उस आशय को स्वाभाविक हिंदी में रखता है, बिना परिणाम को निश्चित बताए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उपलब्ध लातीनी अंश पद-सीमा पर टूटा हुआ है; ‘Quoniam uidi quae non’ को अंग्रेज़ी POB की पद-सीमा के अनुरूप इस पद में शामिल नहीं किया गया।
