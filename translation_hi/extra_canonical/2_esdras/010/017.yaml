    reason: source_ambiguity
lexical_decisions:
- source_word: ingredere
  choice: चली जा
  rationale: यह एकवचन आज्ञार्थक रूप है। संबोधित व्यक्ति अपने पति के पास जाने वाली स्त्री है, इसलिए स्वाभाविक हिन्दी में स्त्रीलिंग प्रयोग किया गया है।
- source_word: ergo
  choice: इसलिए अब
  rationale: निष्कर्षसूचक अर्थ ‘इसलिए’ से व्यक्त होता है; ‘अब’ प्रसंग में तत्काल आगे बढ़ने के आग्रह को सहज बनाता है।
- source_word: in civitatem
  choice: नगर में
  rationale: लैटिन में गति की दिशा है; हिन्दी में ‘नगर में ... चली जा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ad virum tuum
  choice: अपने पति के पास
  rationale: virum यहाँ संबोधित स्त्री के पति को दर्शाता है; आत्मवाचक ‘अपने’ हिन्दी में संबंध स्पष्ट करता है।
- source_word: Et dixit ad me
  choice: तब उसने मुझसे कहा
  rationale: dixit का कर्ता लैटिन रूप में लिंग से चिह्नित नहीं है। हिन्दी का ‘उसने’ इस अस्पष्टता को बनाए रखता है, और ‘तब’ कथानक-संबंध को स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘Et dixit ad me’ के वक्ता का लिंग
  choice: लिंग-निरपेक्ष ‘उसने’
  alternative: ‘उसने [स्त्री ने]’ या ‘उसने [पुरुष ने]’ के रूप में लिंग स्पष्ट करना
  rationale: लैटिन dixit स्वयं वक्ता का लिंग नहीं बताता। प्रसंग स्त्री की प्रतिक्रिया का संकेत दे सकता है, पर पाठ में निहित व्याकरणिक अस्पष्टता को अनावश्यक रूप से समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। प्रत्यक्ष संबोधन में ‘चली जा’ प्रसंगानुकूल है; अंतिम द्विबिंदु अगले पद में आने वाले कथन की भूमिका दर्शाता है।
