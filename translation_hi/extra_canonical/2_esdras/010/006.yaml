lexical_decisions:
- source_word: iracundia ad eam
  choice: उस पर क्रोधित होकर
  rationale: लातीनी पदबंध के क्रोध और उसके लक्ष्य—उस स्त्री—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Stulta super omnes mulieres
  choice: सब स्त्रियों में सबसे मूर्ख स्त्री
  rationale: तुलनात्मक तीव्रता को बनाए रखते हुए संबोधन को स्पष्ट और आधुनिक हिन्दी में स्वाभाविक रखता है।
- source_word: non
  choice: क्या तू … नहीं देखती?
  rationale: अगले कथन से जुड़ने वाले लातीनी नकारात्मक प्रश्न को हिन्दी की स्वाभाविक प्रश्न-रचना में रखा गया है; उपलब्ध अंग्रेज़ी परामर्श-पाठ से वाक्य की निरंतरता स्पष्ट होती है।
