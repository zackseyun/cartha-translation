  text: And it happened, when all had stopped comforting me so that I might rest, that I rose by night and fled and came, as you see, into this field.
translation:
  language: hi
  text: और ऐसा हुआ कि जब सब लोग मुझे सांत्वना देना बंद कर चुके थे, ताकि मैं विश्राम कर सकूँ, तब मैं रात में उठी, भागी और, जैसा कि आप देख रहे हैं, इस मैदान में आ गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quievissent
  choice: रुक गए
  rationale: यहाँ क्रिया का अर्थ लोगों का सांत्वना देने से रुक जाना है; सरल और स्वाभाविक हिन्दी में इसे स्पष्ट किया गया है।
- source_word: ut me consolarentur
  choice: मुझे सांत्वना देते-देते
  rationale: लैटिन की सांत्वना देने की क्रिया को बनाए रखते हुए पूर्ववर्ती ‘रुक गए’ के साथ स्वाभाविक हिन्दी संरचना बनाई गई है।
- source_word: ut quiescerem
  choice: ताकि मैं विश्राम करूँ
  rationale: उद्देश्यसूचक ut को ‘ताकि’ से और quiescerem को गरिमापूर्ण सामान्य शब्द ‘विश्राम करूँ’ से व्यक्त किया गया है।
- source_word: fugi et veni
  choice: भागकर यहाँ आ गया
  rationale: क्रमिक क्रियाओं ‘भागा और आया’ को स्वाभाविक हिन्दी में संयुक्त किया गया है; ‘यहाँ’ निकटवर्ती hoc campo से संदर्भित है।
- source_word: in hoc campo
  choice: इस मैदान में
  rationale: campus का सीधा और संदर्भानुकूल अर्थ ‘मैदान’ रखा गया है।
