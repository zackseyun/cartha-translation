  yaml_path: translation/extra_canonical/2_esdras/010/008.yaml
  text: She has been humbled; mourn most bitterly. And now[a], since we all mourn and are sad, since we are all grieved—but you
translation:
  language: hi
  text: वह अपमानित की गई है; अत्यन्त विलाप करो। और अब, क्योंकि हम सब विलाप कर रहे हैं और तुम सब उदास हो, क्योंकि हम सभी दुःखी हैं—पर तू…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी स्रोत इस पद में ‘पर तू’ पर ही समाप्त हो जाता है; अगला विचार यहाँ सुरक्षित नहीं है।
    reason: खंडित स्रोत और अचानक समाप्त होते वाक्य को स्पष्ट करना, बिना अनुपस्थित शब्द जोड़कर उसे पूरा किए।
lexical_decisions:
- source_word: humiliata est
  choice: वह दीन कर दी गई है
  rationale: लातीनी निष्क्रिय पूर्णकाल का अर्थ है कि स्त्रीलिंग कर्ता को नीचा या दीन किया गया है; यह ‘वह विलाप करती है’ नहीं है।
- source_word: lugete ualidissime
  choice: अत्यन्त विलाप करो
  rationale: lugete बहुवचन आज्ञार्थक है और ualidissime विलाप की तीव्रता को सर्वोच्च स्तर पर व्यक्त करता है। हिंदी में यह संक्षिप्त और स्वाभाविक है।
- source_word: tristes estis
  choice: तुम सब उदास हो
  rationale: estis द्वितीय पुरुष बहुवचन है। स्रोत में आसपास के प्रथम पुरुष बहुवचन से असंगति होने पर भी उसे चुपचाप सुधारा नहीं गया।
- source_word: tu
  choice: पर तू
  rationale: अंत में एकवचन और बलाघाती संबोधन आता है। उपलब्ध स्रोत यहीं टूटता है, इसलिए वाक्य को पूरा नहीं किया गया।
theological_decisions:
- issue: सिय्योन और शोक करती स्त्री के बीच संभावित संबंध
  choice: ‘वह’ को अनिर्दिष्ट रखा गया
  alternative: ‘सिय्योन’ या ‘वह स्त्री’ स्पष्ट रूप से जोड़ना
  rationale: इस अंश में संज्ञा उपस्थित नहीं है; उसे जोड़ने से संदर्भ की व्याख्या अनावश्यक रूप से पाठ में आ जाती।
- issue: व्यक्ति-वचन की असंगति
  choice: ‘हम… तुम सब… हम… तू’ का क्रम सुरक्षित रखा गया
  alternative: सभी क्रियाओं को प्रथम पुरुष बहुवचन बनाकर पाठ को समरूप करना
  rationale: लातीनी पाठ में वास्तविक तनाव/संभावित पाठ-विकृति है। उपलब्ध प्रमाण के आधार पर उसे बिना पांडुलिपीय समर्थन के ठीक करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप रखा गया है। ‘तुम सब’ और ‘तू’ का अचानक परिवर्तन स्रोत के बहुवचन से एकवचन की ओर बदलाव को जानबूझकर सुरक्षित रखता है।
