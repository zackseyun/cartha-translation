id: 2ES.10.29
reference: 2 Esdras 10:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum essem loquens ego haec, et ecce venit ad me angelus qui in principio venerat ad me et vidit me,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/029.yaml
  text: And while I was speaking these things, behold, the angel who had come to me at the beginning came to me and saw me.
translation:
  language: hi
  text: जब मैं ये बातें कह रहा था, तो देखो, वह स्वर्गदूत, जो आरम्भ में मेरे पास आया था, मेरे पास आया और उसने मुझे देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et cum essem loquens ego haec
  choice: जब मैं ये बातें कह ही रहा था
  rationale: लैटिन की समकालिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘ही’ चल रही क्रिया पर हल्का बल देता है।
- source_word: et ecce
  choice: तभी देखो
  rationale: अचानक घटित दृश्य की ओर ध्यान खींचने वाले ‘ecce’ का बल बनाए रखता है।
- source_word: angelus
  choice: स्वर्गदूत
  rationale: धार्मिक साहित्य में प्रचलित और सामान्य पाठक के लिए स्पष्ट हिन्दी समतुल्य।
- source_word: qui in principio venerat ad me
  choice: जो आरम्भ में मेरे पास आया था
  rationale: ‘in principio’ की अपेक्षाकृत खुली कालगत अभिव्यक्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: et vidit me
  choice: और उसने मुझे देखा
  rationale: मूल के स्पष्ट कथन को ज्यों का त्यों रखता है और इसे ‘मुझे पाया’ या ‘मेरी दशा देखी’ जैसे व्याख्यात्मक अर्थ में नहीं बदलता।
theological_decisions:
- issue: ‘आरम्भ में’ किस आरम्भ का संकेत है
  choice: आरम्भ में
  alternative: पहले दर्शन के आरम्भ में / सबसे पहले
  rationale: मूल पाठ संदर्भ को स्पष्ट नहीं करता; इसलिए कालगत अस्पष्टता बनाए रखी गई है।
- issue: स्वर्गदूत के ‘देखने’ का अर्थ
  choice: उसने मुझे देखा
  alternative: उसने मेरी दशा देखी / उसने मुझे पाया
  rationale: ‘vidit me’ का सीधा अर्थ रखा गया है और किसी विशेष आध्यात्मिक या भावनात्मक आशय को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल कथात्मक शैली। वाक्य में मूल लैटिन की पुनरुक्ति (‘मेरे पास आया’) सुरक्षित रखी गई है, क्योंकि वही पहले आए स्वर्गदूत की पहचान स्पष्ट करती है।
