    issue: Cumbersome introductory construction
    rationale: '"और उसने तुमसे जो कहा..." is more idiomatic and retains the same source meaning.'
  - severity: low
    issue: Temporal relationship can be stated more naturally
    rationale: '"संसार में तीन हज़ार वर्ष ऐसे बीते थे, जिनके दौरान..." clearly expresses the period before offerings began and avoids the slightly awkward "बीत चुके थे, जब तक".'
