id: 2ES.10.45
reference: 2 Esdras 10:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fuit annis triginta, propter quod erant anni saeculo tres, quando non erat in ea adhuc oblatio oblata. Et factum est post annos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/045.yaml
  text: And as for her saying to you that she had been barren for thirty years[a][45], this is because there were three thousand years in the world when no offering had yet been offered in her.
translation:
  language: hi
  text: और उसने तुमसे जो कहा कि वह तीस वर्ष तक बाँझ रही थी, उसका अर्थ यह है कि संसार में[a] तीन हज़ार वर्ष[45] ऐसे बीते थे, जिनके दौरान उसमें अभी तक कोई भेंट नहीं चढ़ाई गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युग में।”
    reason: previous_rendering
  - marker: '45'
    text: “तीन हज़ार वर्ष” के पीछे का लैटिन वाक्यांश संक्षिप्त और कठिन है। यह अर्थ इस अध्याय की प्रतीकात्मक कालगणना के अनुसार है, जिसमें स्त्री के तीस वर्ष उस कहीं बड़े कालखंड के अनुरूप हैं जब सिय्योन में भेंटें चढ़ाई नहीं गई थीं।
    reason: textual_variant
lexical_decisions:
- source_word: saeculo
  choice: संसार में
  rationale: यहाँ शब्द विश्व-इतिहास की कालावधि को दर्शाता है; आधुनिक हिन्दी में ‘संसार में’ इस ऐतिहासिक अर्थ को सहज रूप से व्यक्त करता है, जबकि ‘युग में’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: oblatio oblata
  choice: कोई भेंट चढ़ाई नहीं गई थी
  rationale: लैटिन की संज्ञा और उसी मूल की क्रिया की पुनरुक्ति को स्वाभाविक हिन्दी में धार्मिक चढ़ावे की क्रिया के रूप में व्यक्त किया गया है।
- source_word: annis triginta
  choice: तीस वर्ष तक
  rationale: स्त्री के बाँझ रहने की बताई गई अवधि को सीधे और स्पष्ट रूप में रखा गया है।
- source_word: anni ... tres
  choice: तीन हज़ार वर्ष
  rationale: लैटिन पाठ अत्यंत संक्षिप्त और कठिन है; अध्याय की प्रतीकात्मक कालगणना में स्त्री के तीस वर्ष सिय्योन में भेंट आरम्भ होने से पहले के तीन हज़ार वर्षों के अनुरूप हैं।
theological_decisions:
- issue: स्त्री के बाँझपन और सिय्योन के इतिहास का प्रतीकात्मक संबंध
  choice: ‘उसका अर्थ यह है’ द्वारा प्रतीकात्मक व्याख्या को स्पष्ट रखा गया
  alternative: दोनों अवधियों को बिना व्याख्यात्मक संबंध के केवल साथ रख देना
  rationale: आस-पास का प्रसंग स्त्री को नगर के प्रतीक के रूप में समझाता है; फिर भी पाठ से आगे बढ़कर किसी विशिष्ट सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
- issue: ‘उसमें’ का संदर्भ
  choice: स्त्रीलिंग प्रतीक/नगर के लिए ‘उसमें’ बनाए रखा गया
  alternative: स्पष्ट रूप से ‘सिय्योन में’ कहना
  rationale: मूल की सांकेतिक भाषा और संदर्भगत तनाव को सुरक्षित रखने के लिए निहित स्थान का नाम मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाँझ’, ‘भेंट चढ़ाई’ और ‘संसार’ जैसे परिचित शब्द मूल की धार्मिक तथा प्रतीकात्मक प्रकृति को बिना अनावश्यक तकनीकी शब्दावली के व्यक्त करते हैं।
