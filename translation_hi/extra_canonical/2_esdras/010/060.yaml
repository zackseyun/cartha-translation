  text: And I slept that night and another, as he had told me.
translation:
  language: hi
  text: और जैसा उसने मुझसे कहा था, मैं उस रात और एक दूसरी रात सोया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dormivi
  choice: मैं…सोया
  rationale: लातीनी क्रिया का सरल भूतकाल और प्रथम पुरुष एकवचन स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: illam noctem et aliam
  choice: उस रात और एक दूसरी रात
  rationale: ‘aliam’ का अर्थ ‘दूसरी/एक और’ है; पाठ यह स्पष्ट नहीं करता कि वह अनिवार्य रूप से ठीक अगली रात थी, इसलिए उस अस्पष्टता को बनाए रखा गया है।
- source_word: sicut dixerat mihi
  choice: जैसा उसने मुझसे कहा था
  rationale: पूर्वकालिक ‘dixerat’ के लिए ‘कहा था’ और ‘mihi’ के लिए ‘मुझसे’ स्वाभाविक तथा अर्थ-संगत हैं।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए आदेश-संबंधी उपवाक्य पहले रखा गया है; मूल अर्थ और ‘एक दूसरी रात’ की अनिश्चितता सुरक्षित है।
