source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixi: Quoniam derelinquens dereliquisti me: ego quidem feci secundum sermones tuos et exiui in campum et ecce uidi et uideo quod non possum enarrare. et dixit ad me: Sta ut uir et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/032.yaml
  text: And I said, “Because you have utterly forsaken me. For I did according to your words and went out into the field, and behold, I saw and still see what I am not able to describe.”
translation:
  language: hi
  text: मैंने कहा, “क्योंकि आपने मुझे पूरी तरह छोड़ दिया है। मैंने तो आपके वचनों के अनुसार किया और मैदान में गया। और देखिए, मैंने देखा और अब भी देख रहा हूँ कि मैं उसका वर्णन नहीं कर सकता।” तब उसने मुझसे कहा, “पुरुष की तरह खड़े हो जाओ और—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लैटिन पाठ में यह पद ‘और’ पर समाप्त होता है; कथन अगले पद में जारी रहता है।
    reason: लैटिन पाठ ‘Sta ut uir et’ पर समाप्त होता है; हिन्दी में अपूर्ण वाक्य और पादटिप्पणी इस पाठ-सीमा को दर्शाते हैं।
lexical_decisions:
- source_word: derelinquens dereliquisti
  choice: पूरी तरह छोड़ दिया
  rationale: लैटिन में एक ही धातु की पुनरुक्ति तीव्रता व्यक्त करती है; स्वाभाविक हिन्दी में ‘पूरी तरह’ उस बल को संप्रेषित करता है।
- source_word: secundum sermones tuos
  choice: आपके वचनों के अनुसार
  rationale: ‘sermones’ यहाँ पहले दिए गए निर्देशों या कथनों को सूचित करता है; ‘वचन’ गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: exiui in campum
  choice: मैदान में निकल गया
  rationale: ‘campus’ का सीधा अर्थ खुला मैदान है और ‘exire’ बाहर निकलने की गति बनाए रखता है।
- source_word: ecce
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; आधुनिक आदरसूचक संवाद में ‘देखिए’ स्वाभाविक है।
- source_word: uidi et uideo
  choice: मैंने कुछ ऐसा देखा—और अब भी देख रहा हूँ—
  rationale: भूतकाल और वर्तमानकाल के जानबूझकर किए गए विरोध को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: enarrare
  choice: वर्णन करना
  rationale: यह देखी हुई बात को विस्तार से कह पाने की असमर्थता व्यक्त करता है।
- source_word: Sta ut uir
  choice: एक पुरुष की तरह खड़े हो जाओ
  rationale: लैटिन का रूपक साहस और दृढ़ता का आह्वान करता है; स्रोत की लैंगिक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के रखा गया है।
theological_decisions:
- issue: वक्ता द्वारा परित्याग का आरोप
  choice: ‘आपने मुझे पूरी तरह छोड़ दिया है’ को सीधे कथन के रूप में रखा
  alternative: इसे केवल अनुभूति बनाना, जैसे ‘मुझे लगा कि आपने मुझे छोड़ दिया’
  rationale: स्रोत वास्तविक आरोप की तीव्रता रखता है; उसे मनोवैज्ञानिक अनुभूति में बदलना तनाव को अनावश्यक रूप से हल कर देता।
- issue: पद के अंत में अगले कथन का आरंभ
  choice: ‘तब उसने...’ वाला अपूर्ण अंश शामिल किया
  alternative: अंग्रेज़ी परामर्श-पाठ की तरह इसे छोड़ देना
  rationale: दिए गए लैटिन स्रोत में यह अंश स्पष्ट रूप से उपस्थित है; डैश और पादटिप्पणी पाठ की खंडित सीमा को ईमानदारी से दर्शाते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक संबोधन और गरिमापूर्ण कथात्मक शैली अपनाई गई है। भूतकाल ‘देखा’ और वर्तमान ‘अब भी देख रहा हूँ’ का तनाव सुरक्षित रखा गया है।
