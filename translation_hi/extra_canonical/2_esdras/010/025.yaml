  text: Et factum est cum loquebar ad eam, et ecce facies eius fulgebat ualde subito et species coruscus fiebat uultus eius, ut etiam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/025.yaml
  text: And it happened[25], while I was speaking to her, that behold, her face suddenly shone exceedingly, and the appearance of her face became flashing[a], so that even [I was greatly afraid of her].
translation:
  language: hi
  text: और ऐसा हुआ कि जब मैं उससे बात कर रहा था, तो देखो, उसका चेहरा अचानक बहुत तेज़ चमक उठा, और उसके चेहरे की आभा कौंधने लगी,[a] यहाँ तक कि [मैं उससे बहुत डर गया]।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका चेहरा अचानक बहुत तेज़ चमक उठा, और उसके चेहरे का रूप कौंधने लगा।”
    reason: previous_rendering
  - marker: b
    text: उपलब्ध लैटिन पाठ इस स्थान पर ut etiam (“यहाँ तक कि”) के बाद टूट जाता है। कोष्ठकों के शब्द प्राचीन सीरियाई और इथियोपियाई साक्ष्यों के आधार पर आशय पूरा करते हैं; उनमें भय का उल्लेख है, पर एक परम्परा इसे उसके पास जाने के भय के रूप में व्यक्त करती है।
    reason: textual_variant
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: दृश्य के अचानक और विस्मयकारी प्रकट होने को चिह्नित करने वाला मूल उद्गार सुरक्षित रखा गया है।
- source_word: fulgebat ualde subito
  choice: अचानक अत्यन्त चमक उठा
  rationale: subito, ualde और fulgebat—तीनों के समय, तीव्रता और प्रकाश के भाव को स्वाभाविक हिन्दी में रखा गया है।
- source_word: species coruscus fiebat uultus eius
  choice: उसके मुख का रूप बिजली-सा दमकने लगा
  rationale: लैटिन की कुछ असामान्य बनावट को अर्थ-संगत हिन्दी में व्यक्त किया गया है; species और vultus को दो अलग शारीरिक विषयों के रूप में नहीं बाँटा गया, और coruscus की चमकती/कौंधती गुणवत्ता सुरक्षित है।
- source_word: ut etiam
  choice: यहाँ तक कि
  rationale: खंडित लैटिन में सुरक्षित परिणाम-सूचक वाक्यांश का स्पष्ट अनुवाद है।
theological_decisions:
- issue: खंडित लैटिन के बाद आशय की पूर्ति
  choice: '[मैं उससे बहुत डर गया]'
  alternative: वाक्य को ‘यहाँ तक कि…’ पर अधूरा छोड़ना, अथवा ‘मैं उसके पास जाने से डर गया’ पढ़ना
  rationale: मुख्य लैटिन साक्ष्य ut etiam पर टूट जाता है। पुत्री-भाषा संस्करण भय की प्रतिक्रिया सुरक्षित रखते हैं, पर उसके सटीक रूप में भिन्नता है; इसलिए न्यूनतम पूर्ति को कोष्ठकों में रखकर पाठगत अनिश्चितता स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सर्वसुलभ रूप अपनाया गया है। ‘देखो’ से अपोकैलिप्टिक आकस्मिकता, ‘बिजली-सा दमकने’ से coruscus की कौंध, और कोष्ठकों व पादटिप्पणी से पाठ की वास्तविक अपूर्णता तथा पुत्री-संस्करणों की भिन्नता सुरक्षित रखी गई है।
