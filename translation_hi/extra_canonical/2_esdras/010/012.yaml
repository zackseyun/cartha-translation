  text: uno doles ? Si autem dices mihi, quoniam non est similis planctus meus terrae, quoniam ego fructum uentris mei perdidi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/012.yaml
  text: But if you say to me, ‘My lament is not like the earth’s, because I have lost the fruit of my womb,’
translation:
  language: hi
  text: पर यदि तुम मुझसे कहो, ‘मेरा विलाप पृथ्वी के विलाप जैसा नहीं है, क्योंकि मैंने अपने गर्भ का फल खो दिया है,’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: planctus
  choice: विलाप
  rationale: यह शब्द गहरे शोक की मुखर अभिव्यक्ति को दर्शाता है और प्रसंग में स्त्री तथा पृथ्वी के विलाप की तुलना को बनाए रखता है।
- source_word: terrae
  choice: पृथ्वी के विलाप
  rationale: लैटिन में केवल ‘पृथ्वी’ कहा गया है, पर तुलना में ‘विलाप’ निहित है; हिन्दी में स्पष्ट और स्वाभाविक तुलना के लिए इसे दोहराया गया है।
- source_word: fructum uentris mei
  choice: अपने गर्भ का फल
  rationale: स्रोत के रूपक को निकटता से सुरक्षित रखते हुए यह संतान के लिए प्रयुक्त गरिमापूर्ण और बोधगम्य अभिव्यक्ति है।
theological_decisions:
- issue: uno doles? का पद-विभाजन
  choice: मुख्य पाठ में शामिल नहीं किया
  alternative: ‘क्या तुम केवल एक के लिए शोक करती हो?’ को आरम्भ में जोड़ना
  rationale: यह वाक्यांश अर्थ और वाक्य-संरचना की दृष्टि से पिछले कथन का समापन है; परामर्श-पाठ और प्रचलित पद-विभाजन में 10:12 ‘Si autem dices mihi’ से आरम्भ होता है। इसे जोड़ने से पिछले पद की अंतिम बात इस पद में दोहराई जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली रखी गई है। स्त्री को संबोधन करते हुए भी ‘तुम’ का रूप यहाँ लिंग-निरपेक्ष है; उद्धरण की अधूरी शर्तीय संरचना और अंतिम अल्पविराम को बनाए रखा गया है, क्योंकि वाक्य अगले पद में आगे बढ़ता है।
