- source_word: thalamo suo
  choice: अपनी विवाह-शय्या के कक्ष में
  rationale: लातीनी ‘thalamus’ यहाँ विवाह के अवसर से जुड़ा निजी कक्ष अथवा दुल्हन-कक्ष है। ‘विवाह-शय्या का कक्ष’ इस वैवाहिक संदर्भ को स्पष्ट रखते हुए केवल आधुनिक ‘शयनकक्ष’ से अधिक सटीक है।
- source_word: cecidit
  choice: गिर पड़ा
  rationale: क्रिया के साधारण और आकस्मिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; स्रोत यह नहीं बताता कि गिरने का कारण क्या था।
- source_word: mortuus est
  choice: मर गया
  rationale: मूल का सीधा, सामान्य कथन; प्रसंग की आकस्मिकता और शोक को बिना अतिरिक्त व्याख्या के बनाए रखता है।
