- from: और देखो, तुमने उसका रूप देखा कि वह अपने पुत्र का शोक कैसे मना रही थी; और जो कुछ हुआ था, उसके विषय में तुम उसे सांत्वना देने लगे। ये बातें तुम पर प्रकट की जानी थीं।[a]
  to: और देखो, तुमने उसका प्रतिरूप देखा—कि वह अपने पुत्र के लिए शोक कर रही थी; और जो कुछ हुआ था, उसके विषय में तुम उसे सांत्वना देने लगे। ये बातें तुम्हें प्रकट की जानी थीं।[a]
  rationale: ‘तुम पर’ को Latin dative tibi के अनुरूप और प्राकृतिक हिन्दी ‘तुम्हें’ से बदला गया है। ‘प्रतिरूप’ similitudinem की दृश्य-रूपकात्मक भाषा को बेहतर सुरक्षित रखता है। शेष वाक्य संरचना आरम्भसूचक inchoasti और प्रकाशनात्मक aperienda को बनाए रखती है।
