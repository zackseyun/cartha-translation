  text: filium luget, et tu inchoasti consolare eam de his quae contigerunt †haec erant tibi aperienda†. Et nunc uidens altissimus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/049.yaml
  text: And behold[a], you saw her likeness, how she mourns for her son, and you began to comfort her concerning what had happened. These things had to be revealed to you.
translation:
  language: hi
  text: और देखो, तुमने उसका प्रतिरूप देखा—कि वह अपने पुत्र के लिए शोक कर रही थी; और जो कुछ हुआ था, उसके विषय में तुम उसे सांत्वना देने लगे। ये बातें तुम्हें प्रकट की जानी थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये बातें तुम्हारे लिए खोली जानी थीं।”
    reason: aperienda के अधिक शाब्दिक ‘खोले जाने’ के रूपक को सुरक्षित रखने के लिए; मुख्य पाठ संदर्भानुकूल ‘प्रकट’ देता है।
lexical_decisions:
- source_word: luget
  choice: शोक मना रही थी
  rationale: Latin वर्तमान काल में शोक करने की क्रिया दिखाता है; हिन्दी कथानक में ‘मना रही थी’ उस चल रही अवस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: inchoasti consolare
  choice: तुम उसे सांत्वना देने लगे
  rationale: inchoasti आरम्भ करने का भाव देता है; ‘देने लगे’ आधुनिक हिन्दी में इसे संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: de his quae contigerunt
  choice: जो कुछ हुआ था, उसके विषय में
  rationale: contigerunt बीती घटनाओं को सूचित करता है; यह चयन अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: aperienda
  choice: प्रकट की जानी थीं
  rationale: इस प्रकाशनात्मक संदर्भ में aperienda का आशय केवल भौतिक रूप से ‘खोलना’ नहीं, बल्कि बातें प्रकट या उद्घाटित करना है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: aperienda में ‘खोलने’ और ‘प्रकट करने’ का द्विअर्थ
  choice: मुख्य पाठ में ‘प्रकट की जानी थीं’
  alternative: ‘तुम्हारे लिए खोली जानी थीं’
  rationale: दर्शन और प्रकाशन के प्रसंग में ‘प्रकट’ अभिप्रेत अर्थ को स्पष्ट करता है, जबकि Latin रूपक की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पुत्र’, ‘शोक’ और ‘सांत्वना’ धार्मिक-साहित्यिक संदर्भ के अनुरूप हैं, पर भाषा सामान्य पाठक के लिए स्पष्ट रखी गई है।
