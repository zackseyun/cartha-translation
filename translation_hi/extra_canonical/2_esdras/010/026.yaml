  footnotes:
  - marker: a
    text: 'या, ‘देखो’ को पिछले वाक्य से जोड़कर पढ़ें: ‘और अचानक उसने भय से भरी एक बड़ी चीख मारी, जिसकी ध्वनि से धरती काँप उठी।’'
    reason: लातीनी ‘et ecce subito’ में ‘देखो’ की कथात्मक संबद्धता और विराम-निर्धारण की संभावित अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: लातीनी उद्गार की ओर ध्यान खींचने वाली शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: emisit sonum vocis magnum
  choice: एक बड़ी चीख मारी
  rationale: शाब्दिक रूप से ‘आवाज़ की बड़ी ध्वनि निकाली’; प्रसंग में यह भयपूर्ण ऊँची पुकार या चीख है, जिसके लिए यह सहज हिन्दी अभिव्यक्ति है।
- source_word: timore plenum
  choice: भय से भरी
  rationale: ध्वनि/चीख को भय से परिपूर्ण बताने वाले लातीनी वाक्यांश का सीधा अर्थ सुरक्षित रखता है।
- source_word: ut commoveretur terra a sono
  choice: जिससे उसकी आवाज़ के कारण धरती काँप उठी
  rationale: परिणामसूचक ut और ध्वनि को धरती के हिलने का कारण बताने वाले a sono—दोनों को स्पष्ट रखता है।
- source_word: et vidi
  choice: फिर मैंने देखा
  rationale: vidi का दृश्य-बोध ‘देखा’ से ठीक व्यक्त होता है; ‘फिर’ कथा की अगली दृष्टि की ओर सहज संक्रमण देता है, और अंतिम अल्पविराम अगले पद में जारी वाक्य को दर्शाता है।
