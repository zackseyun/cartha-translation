id: 2ES.10.28
reference: 2 Esdras 10:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vbi est Vriel angelus, qui a principio uenit ad me ? quoniam ipse me fecit uenire in multitudinem excessus mentis huius, et factus est finis meus in corruptione, et oratio mea in inproperium. Et cum essem loquens ego haec, et ecce uenit ad me
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/028.yaml
  text: “Where is Uriel the angel[28], who came to me at the beginning? For it was he who brought me into this great bewilderment of mind, and my end has become corruption[a], and my prayer a reproach.”
translation:
  language: hi
  text: “स्वर्गदूत ऊरीएल कहाँ है, जो आरम्भ में मेरे पास आया था? क्योंकि उसी ने मुझे मन की इस घोर विक्षुब्ध अवस्था[a] में पहुँचा दिया है; मेरा अन्त विनाश[b] हो गया है और मेरी प्रार्थना अपमान में बदल गई है।” जब मैं ये बातें कह रहा था, तभी देखो, वह मेरे पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी पद का अधिक शाब्दिक रूप है, ‘मन के इस उन्मेष/सामान्य स्थिति से बाहर हो जाने की अवस्था की अत्यधिकता में।’ आशय केवल साधारण उलझन नहीं, बल्कि दर्शन से उत्पन्न अभिभूत कर देने वाली चेतनावस्था है।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्षय’ अथवा ‘बरबादी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: multitudinem excessus mentis huius
  choice: मन के इस प्रबल विभ्रम
  rationale: लातीनी पद मन के सामान्य भ्रम से अधिक, चेतना के अपने सामान्य स्थान से हट जाने जैसी तीव्र और अभिभूत कर देने वाली दर्शनीय अवस्था बताता है। ‘परमानन्द’ आधुनिक हिन्दी में सुख का संकेत देता, जो प्रसंग के आतंक और व्याकुलता के विपरीत होता।
- source_word: corruptione
  choice: विनाश
  rationale: यहाँ corruptio का अर्थ नैतिक भ्रष्टता से अधिक नाश, क्षय या बरबादी है; ‘विनाश’ एज्रा की आशंकित परिणति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: inproperium
  choice: अपमान
  rationale: शब्द निन्दा, तिरस्कार या लज्जा का भाव रखता है। विधेयात्मक और कुछ असामान्य वाक्य-तनाव बनाए रखने के लिए ‘मेरी प्रार्थना अपमान’ रखा गया है।
- source_word: Et cum essem loquens ego haec, et ecce uenit ad me
  choice: जब मैं ये बातें कह ही रहा था, तो देखो, वह मेरे पास आया
  rationale: प्रदत्त लातीनी स्रोत में यह कथात्मक वाक्य भी सम्मिलित है। ‘कह ही रहा था’ समकालिकता और ‘देखो’ ecce की आकस्मिकता को सुरक्षित रखते हैं।
theological_decisions:
- issue: ऊरीएल की पहचान
  choice: वह स्वर्गदूत ऊरीएल
  alternative: ऊरीएल स्वर्गदूत
  rationale: लातीनी angelus को स्पष्ट रूप से बनाए रखा गया है, पर पाठ से परे उसके पद, वर्ग या भूमिका के विषय में कोई सांप्रदायिक विस्तार नहीं जोड़ा गया।
- issue: एज्रा के कथन ‘मेरा अन्त विनाश’ का आशय
  choice: कथन को उसकी तीखी और अस्पष्ट विलापात्मकता सहित रखा गया
  alternative: इसे शारीरिक मृत्यु, आत्मिक दोष या अनन्त दण्ड के रूप में स्पष्ट करना
  rationale: लातीनी पाठ परिणाम की ठीक प्रकृति निश्चित नहीं करता; अतः किसी एक धर्मवैज्ञानिक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली। ‘प्रबल विभ्रम’ द्वारा दर्शनीय चेतनावस्था की तीव्रता रखी गई है और सुखसूचक ‘परमानन्द’ से बचा गया है। अन्तिम कथात्मक खण्ड प्रदत्त मूल-पाठ में होने के कारण अनूदित किया गया है।
