review_pass:
  verdict: revise
  source_fidelity: The draft correctly treats quid ... casus Sion as an abrupt exclamatory parenthesis rather than attaching it causally to the following command. However, rendering enim as “क्योंकि” incorrectly turns the parenthesis into a causal statement, contrary to its emphatic/rhetorical function in this context.
  naturalness: The Hindi is generally clear and suitably elevated. “समझाए जाने के लिए राज़ी हो जाओ” is understandable and preserves the passive infinitive, though “तैयार हो जाओ” is more idiomatic in this exhortation.
  terminology: “सिय्योन,” “यरूशलेम,” “पतन,” “दुःख,” and “सांत्वना” are appropriate standard biblical Hindi forms. No doctrinally loaded terminology has been introduced.
  issues:
  - severity: medium
    issue: “क्योंकि” misrepresents the parenthetical quid enim casus Sion.
    rationale: The Latin phrase is an emphatic, rhetorical exclamation (“how great is Zion’s downfall!”), not a causal clause. The Hindi causal connective changes its syntactic and rhetorical relation to the surrounding commands.
  revised_text: “यह बात मत कहो, बल्कि समझाए जाने के लिए तैयार हो जाओ—सिय्योन का पतन कितना बड़ा है!—और यरूशलेम के दुःख के कारण सांत्वना पाओ।”
