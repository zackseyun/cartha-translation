id: 2ES.10.20
reference: 2 Esdras 10:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: noli facere sermonem hunc, sed consenti persuaderi – quid enim casus Sion – et consolare propter dolorem Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/020.yaml
  text: Do not say this[a], but consent to be persuaded—for how great is Zion’s downfall!—and be comforted because of Jerusalem’s sorrow.
translation:
  language: hi
  text: “यह बात मत कहो, बल्कि समझाए जाने के लिए तैयार हो जाओ—सिय्योन का पतन कितना बड़ा है!—और यरूशलेम के दुःख के कारण सांत्वना पाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: noli facere sermonem hunc
  choice: ऐसी बात मत कहो
  rationale: शाब्दिक रूप से ‘यह कथन मत करो’; आधुनिक हिन्दी में ‘ऐसी बात मत कहो’ अधिक स्वाभाविक है और निषेध का अर्थ बनाए रखता है।
- source_word: consenti persuaderi
  choice: समझाए जाने के लिए राज़ी हो जाओ
  rationale: लैटिन की निष्क्रिय रचना और सहमति देने के भाव, दोनों को सुरक्षित रखा गया है; इसे केवल ‘मान जाओ’ कहने से मूल की बनावट और तनाव कम हो जाता।
- source_word: quid enim casus Sion
  choice: क्योंकि सिय्योन का पतन कितना बड़ा है!
  rationale: quid को विस्मयात्मक परिमाणसूचक ‘कितना बड़ा’ माना गया है और enim को ‘क्योंकि’ से व्यक्त किया गया है; वाक्यांश की आकस्मिक, कोष्ठकीय विस्मयात्मकता डैशों से बनाए रखी गई है।
- source_word: consolare
  choice: सांत्वना पाओ
  rationale: मूल आज्ञार्थक रूप का सीधा और गरिमापूर्ण हिन्दी प्रतिरूप।
- source_word: propter dolorem Hierusalem
  choice: यरूशलेम के दुःख के कारण
  rationale: propter के कारणसूचक अर्थ और dolor के दुःख/पीड़ा के भाव को स्पष्ट रूप से रखा गया है।
theological_decisions:
- issue: सिय्योन के पतन वाले वाक्यांश का संबंध
  choice: इसे एक विस्मयात्मक मध्यवर्ती कथन के रूप में रखा गया है
  alternative: इसे ‘सिय्योन की विपत्तियों के कारण’ जैसा कारणसूचक पदबंध मानना
  rationale: लैटिन quid enim casus Sion में ऐसा कोई स्पष्ट कारणसूचक अव्यय नहीं है जो इसे अगले आदेश का कारण बनाए; अतः वास्तविक वाक्यगत आकस्मिकता और जोर सुरक्षित रखा गया है।
- issue: यरूशलेम के दुःख और सांत्वना का तनाव
  choice: ‘दुःख के कारण सांत्वना पाओ’ का विरोधाभासी-सा संबंध यथावत रखा गया है
  alternative: ‘यरूशलेम के दुःख में सांत्वना पाओ’ या अर्थ स्पष्ट करने वाला विस्तृत रूप
  rationale: propter सामान्यतः कारणसूचक है; कठिन धार्मिक/अलंकारिक तनाव को व्याख्यात्मक रूप से सहज नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य शैली। ‘सिय्योन’ और ‘यरूशलेम’ प्रचलित बाइबलीय नामरूप हैं। मूल के अचानक आए विस्मयात्मक खंड को दीर्घ डैशों और विस्मयादिबोधक चिह्न से दर्शाया गया है।
