- from: “ऐसी बात मत कहो, बल्कि समझाए जाने के लिए राज़ी हो जाओ—क्योंकि सिय्योन का पतन कितना बड़ा है!—और यरूशलेम के दुःख के कारण सांत्वना पाओ।”
  to: “यह बात मत कहो, बल्कि समझाए जाने के लिए तैयार हो जाओ—सिय्योन का पतन कितना बड़ा है!—और यरूशलेम के दुःख के कारण सांत्वना पाओ।”
