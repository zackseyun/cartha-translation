  text: जिस स्त्री को तुमने देखा, वह सिय्योन है, जिसे तुम अब एक बने हुए नगर के रूप में देख रहे हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ciuitatem
  choice: नगर
  rationale: लैटिन शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य; प्रसंग में सिय्योन का नगर-रूप अभिप्रेत है।
- source_word: aedificatam
  choice: बनते हुए
  rationale: रूपांतरण के दृश्य को वर्तमान प्रक्रिया के रूप में व्यक्त करता है और परामर्श-पाठ के ‘being built’ अर्थ को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: स्त्री और सिय्योन की पहचान
  choice: स्त्री को स्पष्ट रूप से सिय्योन कहा गया है
  alternative: सिय्योन को केवल स्त्री का प्रतीक कहना
  rationale: परामर्श-पाठ में प्रत्यक्ष पहचान है; ‘प्रतीक’ जोड़ने से व्याख्यात्मक तत्व अनावश्यक रूप से पाठ में आ जाता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। दो छोटे वाक्यों में कथन रखा गया है ताकि पहचान और नगर में रूपांतरण दोनों सहजता से समझ में आएँ।
