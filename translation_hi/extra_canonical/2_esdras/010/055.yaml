  text: tu ergo noli timere neque expavescat cor tuum, sed ingredere et vide splendorem vel magnitudinem aedificii, quantum capax est tibi visu oculorum videre.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/055.yaml
  text: Therefore do not fear, and do not let your heart be terrified, but go in and see the splendor or the greatness of the building, as much as your eyes are able to see.
translation:
  language: hi
  text: इसलिए तुम मत डरो, और तुम्हारा हृदय भयभीत न हो। बल्कि भीतर जाओ और उस भवन का वैभव या उसकी विशालता उतनी देखो, जितनी तुम्हारी आँखें देख सकती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: noli timere
  choice: मत डरो
  rationale: लैटिन निषेधात्मक आज्ञा का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: neque expavescat cor tuum
  choice: तुम्हारा हृदय भयभीत न हो
  rationale: हृदय की भीतरी घबराहट पर बल देने वाली मूल अभिव्यक्ति को बनाए रखता है।
- source_word: ingredere
  choice: भीतर जाओ
  rationale: संदर्भ में भवन के भीतर प्रवेश करने की आज्ञा को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: splendorem vel magnitudinem aedificii
  choice: उस भवन का वैभव या उसकी विशालता
  rationale: splendor और magnitudo के भेद तथा vel की वास्तविक वैकल्पिक अस्पष्टता को सुरक्षित रखता है।
- source_word: quantum capax est tibi visu oculorum videre
  choice: उतनी देखो, जितनी तुम्हारी आँखें देख सकती हैं
  rationale: कुछ असहज लैटिन वाक्य-विन्यास का अर्थ सहज हिन्दी में देता है, बिना दृष्टि की सीमा मिटाए।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज संबोधन रखा गया है। एकवचन अनौपचारिक ‘तुम’ मूल लैटिन के एकवचन संबोधन के अनुरूप है। vel को ‘या’ से अनूदित कर पाठ की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
