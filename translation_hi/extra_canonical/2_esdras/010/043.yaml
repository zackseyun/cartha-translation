  text: This woman whom you saw is Zion[a], whom you now see
translation:
  language: hi
  text: यह स्त्री, जिसे तुमने देखी थी, सिय्योन है, जिसे अब तुम देख रहे हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Haec mulier
  choice: यह स्त्री
  rationale: Latin demonstrative and noun are represented directly and naturally in Hindi.
- source_word: quam uidisti
  choice: जिसे तुमने देखा था
  rationale: The relative clause and completed past action are preserved; ‘था’ naturally distinguishes the earlier vision from what is being seen now.
- source_word: haec est Sion
  choice: सिय्योन है
  rationale: The repeated Latin demonstrative is not separately reproduced because ‘यह स्त्री ... सिय्योन है’ conveys the identification naturally without awkward redundancy.
- source_word: quam nunc conspicis
  choice: जिसे अब तुम देख रहे हो
  rationale: Preserves the relative construction, the temporal force of nunc, and the present act of seeing.
theological_decisions:
- issue: Identification of the woman with Zion
  choice: The woman is directly identified as ‘सिय्योन’.
  alternative: Explain Zion as Jerusalem or the people/city of God.
  rationale: The source simply says Sion and does not resolve the precise symbolic scope in this clause, so the proper name and its ambiguity are retained.
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के निकट। इस पद में कोई पादटिप्पणी आवश्यक नहीं, क्योंकि अंग्रेज़ी [a] की सामग्री पिछले, अब सुधारे जा चुके पद-विभाजन की पुरानी प्रस्तुति है और वर्तमान लैटिन पाठ का वैकल्पिक अर्थ नहीं है।
