  yaml_path: translation/extra_canonical/2_esdras/010/007.yaml
  text: see our mourning and what has happened to us? For Zion[a], the mother of us all, is grieving in sorrow and humiliation
translation:
  language: hi
  text: क्या तुम्हें हमारा शोक और हमारे साथ जो कुछ हुआ है, वह दिखाई देता है? क्योंकि सिय्योन, हम सबकी माता, दुःख और अपमान में शोकित है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uides
  choice: क्या तुम्हें ... दिखाई देता है?
  rationale: लातीनी वर्तमानकालीन प्रश्न का स्वाभाविक हिन्दी रूप; इससे सम्बोधित व्यक्ति के लिंग के बारे में अनावश्यक निर्णय भी नहीं किया गया।
- source_word: luctum nostrum
  choice: हमारा शोक
  rationale: luctus के व्यक्तिगत और सामुदायिक मातम/शोक के भाव को संक्षेप में बनाए रखता है।
- source_word: quae nobis contigerunt
  choice: हमारे साथ जो कुछ हुआ है
  rationale: बहुवचन quae और contigerunt का सहज सामूहिक अर्थ व्यक्त करता है, बिना घटनाओं का स्वरूप जोड़े।
- source_word: Sion mater nostra omnium
  choice: सिय्योन, हम सबकी माता
  rationale: वाक्य-विन्यास के अनुसार Sion के साथ appositional mater nostra omnium को रखा गया है; ‘हमारी माता’ को दोहराया नहीं गया।
- source_word: in tristitia contristatur et humilitate
  choice: दुःख और अपमान में शोकित है
  rationale: tristitia, contristatur और humilitate के दुःख, शोक और अपमान—तीनों भावों को सुरक्षित रखता है तथा अगले पद के humiliata est (‘नीचा किया गया’) को इस पद में नहीं खींचता।
theological_decisions:
- issue: सिय्योन का मातृरूप में व्यक्तिकरण
  choice: सिय्योन, हम सबकी माता
  alternative: हमारी माता सिय्योन, हम सबकी माता
  rationale: लातीनी पाठ में सिय्योन को समुदाय की माता कहा गया है, पर ‘माता’ की अनावश्यक पुनरावृत्ति पाठ में नहीं है।
- issue: humilitate का अर्थ
  choice: अपमान में
  alternative: दीनता में / बहुत नीची दशा में
  rationale: यहाँ humilitas को सार्वजनिक दुर्दशा और अपमान के अर्थ में लिया गया है; क्रियात्मक ‘नीचा कर दी गई है’ अगले पद की भाषा को पहले लाता और इस पद की सीमा बिगाड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामुदायिक विलाप के अनुकूल शैली। पहले प्रश्न में लिंग-निरपेक्ष रचना अपनाई गई है; दूसरे वाक्य में सिय्योन के स्त्रीलिंग मातृ-व्यक्तिकरण को स्पष्ट रखा गया है।
