id: 2ES.10.22
reference: 2 Esdras 10:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et psalterium nostrum humiliatum est et hymnus noster conticuit et exultatio nostra dissoluta est, et lumen candelabri nostri extinctum est et arca testamenti nostri direpta est et sancta nostra contaminata sunt, et nomen quod nominatumest super nos paene profanatum est, et liberi nostri contumeliam passi sunt, et sacerdotes nostri succensi sunt et Levitae nostri in captivitate abierunt, et virgines nostrae coinquinatae sunt et mulieres nostrae vim passae sunt, et iusti nostri rapti sunt et parvuli nostri proditisunt, et iuvenes nostri servierunt et fortes nostri invalidi facti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/022.yaml
  text: Our harp has been brought low[a], our hymn has fallen silent, our rejoicing has been dissolved, the light of our lampstand has been extinguished, the ark of our covenant has been plundered, our holy things have been defiled, and the name that was called over us has been almost profaned. Our children have suffered insult, our priests have been burned, our Levites have gone into captivity, our virgins have been defiled, our women have suffered violence, our righteous men have been carried off, our little ones have been betrayed, our young men have been enslaved[b], and our strong men have become weak.
translation:
  language: hi
  text: हमारी वीणा को नीचा किया गया है[a], हमारा स्तुतिगान मौन हो गया है, हमारा हर्ष समाप्त हो गया है, हमारे दीपाधार का प्रकाश बुझ गया है, हमारी वाचा का सन्दूक लूट लिया गया है, हमारी पवित्र वस्तुएँ अपवित्र की गई हैं, और वह नाम जो हमारे ऊपर पुकारा गया है, लगभग अपवित्र कर दिया गया है। हमारे बच्चों का अपमान हुआ है, हमारे याजक जला दिए गए हैं, हमारे लेवी बंदी बनाकर ले जाए गए हैं, हमारी कुंवारियाँ अपवित्र की गई हैं, हमारी स्त्रियों ने हिंसा सही है, हमारे धर्मी जन उठा लिए गए हैं, हमारे नन्हे बच्चे सौंप दिए गए हैं[b], हमारे जवान दास बना लिए गए हैं, और हमारे वीर निर्बल हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारी वीणा अपमानित की गई है।”
    reason: लैटिन humiliatum est का अधिक शाब्दिक अर्थ सुरक्षित रखने के लिए।
  - marker: b
    text: या, “हमारे नन्हे बच्चों के साथ विश्वासघात हुआ है।”
    reason: लैटिन proditi sunt में ‘सौंप दिए गए’ और ‘विश्वासघात के शिकार हुए’ दोनों अर्थ सम्भव हैं।
lexical_decisions:
- source_word: psalterium
  choice: वीणा
  rationale: यह तार वाला वाद्य है; हिंदी में ‘वीणा’ स्वाभाविक और बाइबलीय गरिमा वाला निकटतम सामान्य शब्द है।
- source_word: humiliatum est
  choice: गिरा दी गई है
  rationale: वाद्य के संदर्भ में शाब्दिक ‘दीन/अपमानित’ अस्वाभाविक होता; ‘गिरा दी गई’ विनाश और अवनति की मूर्त छवि बनाए रखता है।
- source_word: hymnus
  choice: स्तुतिगान
  rationale: धार्मिक प्रशंसा के गीत को सामान्य ‘गीत’ से अधिक स्पष्टता से व्यक्त करता है।
- source_word: arca testamenti
  choice: वाचा का सन्दूक
  rationale: testamentum यहाँ covenant के अर्थ में है; स्थापित बाइबलीय पदावली अपनाई गई है।
- source_word: coinquinatae sunt
  choice: भ्रष्ट की गई हैं
  rationale: यह अपवित्र या दूषित किए जाने का अर्थ रखता है; निकटवर्ती स्त्रियों पर हिंसा वाले वाक्यांश से अनावश्यक रूप से एकरूप नहीं किया गया।
- source_word: vim passae sunt
  choice: के साथ बलात्कार हुआ है
  rationale: इस युद्ध-विनाश संदर्भ में स्त्रियों द्वारा झेली गई vis यौन हिंसा को इंगित करती है; अस्पष्ट ‘हिंसा सही’ हिंदी में आशय को जरूरत से अधिक धुँधला करती।
- source_word: proditi sunt
  choice: शत्रु के हाथ सौंप दिए गए हैं
  rationale: prodo का अर्थ सौंप देना या धोखे से पकड़वा देना दोनों हो सकता है। मुख्य पाठ में घेराबंदी और बन्दीकरण के अनुकूल व्यापक अर्थ रखा गया, तथा विश्वासघात की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: servierunt
  choice: दास बना लिए गए हैं
  rationale: यह केवल सेवा करने के बजाय पराधीन दासत्व में जाने का भाव व्यक्त करता है।
theological_decisions:
- issue: ‘हम पर रखा गया नाम’ की पहचान
  choice: वह नाम जो हम पर रखा गया था
  alternative: परमेश्वर का वह नाम जिससे हम कहलाते थे
  rationale: लैटिन नाम को स्पष्ट रूप से परमेश्वर का नाम नहीं कहता; पारंपरिक वाचाई संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया।
- issue: कुँवारियों के coinquinatae और स्त्रियों के vim passae के बीच भेद
  choice: ‘भ्रष्ट की गई हैं’ और ‘के साथ बलात्कार हुआ है’
  alternative: दोनों को ‘अपवित्र/हिंसा की शिकार’ कहना
  rationale: मूल के अलग-अलग पदों और उनकी बढ़ती हुई तीव्रता को बनाए रखा गया, जबकि पहले पद को अनिवार्यतः बलात्कार तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में शोकगीत की लय और क्रमिक समानान्तरता रखी गई है। ‘सन्दूक’, ‘वाचा’, ‘याजक’, ‘लेवी’ और ‘दीपाधार’ जैसी प्रचलित बाइबलीय पदावली का उपयोग किया गया है; भाषा को न तो अत्यधिक संस्कृतनिष्ठ बनाया गया है, न बोलचाल की।
