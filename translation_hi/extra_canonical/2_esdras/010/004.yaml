  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भावनात्मक कथन। मूल पाठ के दृढ़ निश्चय को स्पष्ट रखा गया है। अंग्रेज़ी परामर्श-पाठ का [a] चिह्न उसके पुराने, अब अस्वीकार किए गए पाठांतर से जुड़ा है; लातीनी स्रोत में यहाँ वास्तविक पाठगत अस्पष्टता न होने के कारण हिन्दी मसौदे में पादटिप्पणी नहीं रखी गई।
