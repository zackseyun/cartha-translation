source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ueni, sicut uides, in hoc campo. Et cogito iam non reuerti in ciuitate sed hic consistere, et neque manducabo neque bibam, sed sine intermissione lugere et ieiunare usque dum moriar.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/004.yaml
  text: And I have come[a], as you see, into this field. I intend to return to the city no more, but to stay here; and I will neither eat nor drink, but without ceasing I will mourn and fast until I die.”
translation:
  language: hi
  text: और जैसा तुम देख रहे हो, मैं इस मैदान में आ गई हूँ। मैंने ठान लिया है कि अब नगर नहीं लौटूँगी, बल्कि यहीं रहूँगी; और न कुछ खाऊँगी, न पीऊँगी, बल्कि बिना रुके विलाप और उपवास करती रहूँगी, जब तक मर न जाऊँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ueni
  choice: मैं ... आ गई हूँ
  rationale: लातीनी perfect वर्तमान तक पहुँची हुई क्रिया को व्यक्त करता है; वक्ता स्त्री है, इसलिए स्त्रीलिंग रूप स्वाभाविक है।
- source_word: cogito
  choice: मैंने ठान लिया है
  rationale: infinitive के साथ cogito यहाँ केवल विचार करने के बजाय दृढ़ इरादा या निश्चय व्यक्त करता है।
- source_word: iam non reuerti
  choice: अब नगर नहीं लौटूँगी
  rationale: iam non का भाव ‘अब और नहीं’ है; भविष्य-संदर्भित हिन्दी रूप वक्ता के निश्चय को सहज रूप से व्यक्त करता है।
- source_word: hic consistere
  choice: यहीं रहूँगी
  rationale: इस प्रसंग में consistere का अर्थ स्थान पर टिके या ठहरे रहना है।
- source_word: sine intermissione lugere et ieiunare
  choice: बिना रुके विलाप और उपवास करती रहूँगी
  rationale: दोनों निरंतर क्रियाओं और sine intermissione के अविराम भाव को सुरक्षित रखा गया है।
theological_decisions: []
