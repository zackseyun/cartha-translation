translation:
  language: hi
  text: 'तो, इस दर्शन की व्याख्या यह है: वह स्त्री जो थोड़ी देर पहले तुम्हें दिखाई दी थी, जिसे'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lectus uisionis
  choice: इस दर्शन की व्याख्या
  rationale: संदर्भ और परामर्श-पाठ के अनुसार इसे दर्शन के अर्थ-निर्वचन के रूप में प्रस्तुत किया गया है; ‘व्याख्या’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: mulier
  choice: वह स्त्री
  rationale: लैटिन के निश्चित संदर्भ को सहज हिन्दी में बनाए रखता है।
- source_word: apparuit
  choice: दिखाई दी थी
  rationale: दर्शन में प्रकट होने के भाव को सामान्य, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ante paululum
  choice: थोड़ी देर पहले
  rationale: निकट भूतकाल के लैटिन कालगत वाक्यांश का सीधा और स्वाभाविक रूप।
- source_word: Quam
  choice: जिसे
  rationale: स्रोत का अधूरा संबंधवाचक उपवाक्य सुरक्षित रखा गया है, क्योंकि वाक्य अगले पद में जारी रहता है।
