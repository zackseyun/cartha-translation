id: 2ES.10.11
reference: 2 Esdras 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fit multitudo eorum. Quis ergo debet lugere magis nisi haec quae tam magnam multitudinem perdidit, quam tu quae pro
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/011.yaml
  text: Who then ought to mourn more, if not she who has lost so great a multitude, rather than you, who grieve for one?
translation:
  language: hi
  text: तो फिर किसे अधिक शोक करना चाहिए—उस स्त्री को, जिसने इतने बड़े जनसमूह को खो दिया है, या तुम्हें, जो एक के लिए शोक करती हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugere
  choice: शोक करना
  rationale: यह लैटिन क्रिया मृत्यु अथवा भारी हानि पर गहरे दुःख और विलाप को व्यक्त करती है; ‘शोक करना’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: multitudinem
  choice: जनसंख्या
  rationale: यहाँ एक नगर के बहुत-से लोगों के सामूहिक रूप से खो जाने का भाव है; ‘जनसंख्या’ उस सामूहिक मानवीय संदर्भ को स्पष्ट रखती है।
- source_word: perdidit
  choice: खो दी है
  rationale: ‘खोना’ हानि का स्वाभाविक हिन्दी रूप है और मूल में हानि के कर्ता या कारण को अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: ‘haec’ के स्त्रीलिंग एकवचन संकेत का संदर्भ
  choice: ‘उसे’ के रूप में स्त्रीलिंग संदर्भ बनाए रखा, पर पद के भीतर उसकी पहचान नहीं जोड़ी
  alternative: ‘इस स्त्री’ या ‘सिय्योन/नगर’ कहना
  rationale: लैटिन में संकेतवाचक स्त्रीलिंग है, किंतु दिए गए पदांश में उसकी स्पष्ट पहचान नहीं है; इसलिए संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
- issue: तुलना की वाक्य-संरचना
  choice: पहले ‘तुम्हें’ और फिर ‘उसे’ रखकर स्पष्ट तुलनात्मक प्रश्न बनाया
  alternative: मूल क्रम में ‘उसे ... बजाय तुम्हें’
  rationale: हिन्दी में प्रश्न को सहज बनाने के लिए क्रम बदला गया, जबकि आशय—एक व्यक्ति के लिए शोक बनाम बड़ी जनसमूह की हानि—अपरिवर्तित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रश्नवाचक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। उपलब्ध लैटिन पाठ अंतिम ‘quam tu quae pro’ पर कटता है; ‘एक के लिए शोक करती हो’ अंग्रेज़ी परामर्श-पाठ और प्रसंग से पुनर्निर्मित आशय है।
