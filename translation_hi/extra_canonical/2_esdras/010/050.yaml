  text: For because you were grieved from your soul, and because you suffer for her from your whole heart, he showed you the splendor of her glory and the beauty of her majesty. Therefore I told you to remain in
translation:
  language: hi
  text: क्योंकि तुम मन से दुःखी हुए और उसके लिए पूरे हृदय से पीड़ा सहते हो, इसलिए उसने तुम्हें उसकी महिमा का तेज और उसके वैभव की सुंदरता दिखाई। इसलिए ही मैंने तुमसे कहा कि तुम ठहरे रहो—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex animo contristatus es
  choice: तुम अपनी आत्मा से बहुत दुःखी हुए
  rationale: ‘आत्मा से’ मूल के ex animo को दृश्यमान रखता है, जबकि ‘बहुत दुःखी हुए’ contristatus es की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ex toto corde pateris pro ea
  choice: उसके लिए पूरे हृदय से पीड़ा सहते हो
  rationale: वर्तमानकाल pateris और ‘उसके लिए’ के संबंध को बनाए रखते हुए मूल की हृदयगत पीड़ा को निकटता से व्यक्त करता है।
- source_word: claritatem gloriae eius
  choice: उसकी महिमा का तेज
  rationale: claritas के प्रकाश और दीप्ति-संबंधी अर्थ को ‘तेज’ से तथा gloria को ‘महिमा’ से अलग-अलग सुरक्षित रखा गया है।
- source_word: pulchritudinem decoris eius
  choice: उसके वैभव की सुंदरता
  rationale: pulchritudo को ‘सुंदरता’ और decor को ‘वैभव’ कहना मूल के दोहरे सौंदर्यात्मक पदबंध को बिना अनावश्यक पुनरावृत्ति के बनाए रखता है।
- source_word: ut maneres in
  choice: कि तुम बने रहो—
  rationale: खंडित लैटिन वाक्य के अधूरेपन को पूरा किए बिना maneres का स्थायित्व व्यक्त किया गया है; डैश अगले अंश में जारी वाक्य का संकेत देता है।
theological_decisions:
- issue: ostendit में निहित कर्ता की पहचान
  choice: उसने
  alternative: परमप्रधान ने
  rationale: इस अंश में कर्ता व्याकरणतः निहित है; नाम जोड़ना स्रोत से अधिक स्पष्टता थोपता। इसलिए सर्वनाम रखकर संदर्भगत अस्पष्टता सुरक्षित की गई है।
- issue: स्त्रीलिंग सर्वनाम ea/eius का संदर्भ
  choice: उसके लिए / उसकी
  alternative: नगर के लिए / नगर की
  rationale: स्रोत केवल स्त्रीलिंग सर्वनाम देता है। ‘नगर’ स्पष्ट रूप से जोड़ने के बजाय सर्वनाम बनाए रखने से मूल का संदर्भ-संबंध और साहित्यिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। पद स्रोत में ‘in’ पर अधूरा समाप्त होता है; हिन्दी में इसे कृत्रिम रूप से पूरा नहीं किया गया।
