  text: 'non speciem mulieris uides, sed apparuit tibi ciuitas aedificari; Et quoniam enarrabat tibi de casu filii sui, haec absolutio est:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/042.yaml
  text: 'You no longer see the form of a woman[a], but a city appeared to you being built. And as for her telling you about the misfortune of her son, this is the interpretation:'
translation:
  language: hi
  text: 'तुम स्त्री का रूप नहीं देखते, बल्कि तुम्हें एक नगर बनता हुआ दिखाई दिया। और उसने तुम्हें अपने पुत्र पर आई विपत्ति के बारे में जो बताया था, उसका अर्थ यह है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: speciem mulieris
  choice: स्त्री का रूप
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक अर्थ; दृश्य आकृति की ओर संकेत बनाए रखता है।
- source_word: ciuitas aedificari
  choice: एक नगर बनता हुआ
  rationale: निर्माणाधीन नगर के प्रकट होने का भाव सुरक्षित रखता है, न कि पहले से बने नगर का।
- source_word: casu filii sui
  choice: अपने पुत्र पर आई विपत्ति
  rationale: casus यहाँ पुत्र के साथ घटी दुःखद घटना को दर्शाता है; ‘विपत्ति’ मृत्यु या अन्य दुर्भाग्य के बीच अनावश्यक रूप से निर्णय नहीं करती।
- source_word: absolutio
  choice: अर्थ
  rationale: इस दर्शन की व्याख्या या समाधान के अर्थ में सहज हिन्दी; प्रसंग में आगे आने वाली प्रतीकात्मक व्याख्या का परिचय देता है।
theological_decisions:
- issue: पुत्र के casus की विशिष्ट प्रकृति
  choice: विपत्ति
  alternative: मृत्यु / पतन
  rationale: स्रोत का शब्द व्यापक है; अनुवाद उसे किसी एक धर्मवैचारिक या घटनात्मक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण किंतु सामान्य पाठक के लिए सहज शैली। ‘तुम/तुम्हें’ का प्रयोग एकवचन संबोधन को स्वाभाविक रूप में व्यक्त करता है; वाक्यांत का द्विबिंदु अगले पद में आने वाली व्याख्या से जोड़ता है।
