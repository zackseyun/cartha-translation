  text: And behold[a], the woman no longer appeared to me, but a city was being built, and a place with great foundations was being revealed. Then I was afraid and cried out with a loud voice and said,
translation:
  language: hi
  text: और देखो, वह स्त्री मुझे फिर दिखाई नहीं दी; बल्कि एक नगर बनाया जा रहा था, और विशाल नींवों वाला एक स्थान दिखाया जा रहा था। तब मैं डर गया और ऊँचे स्वर से पुकारकर बोला,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et ecce
  choice: और देखो
  rationale: दृश्य के अचानक परिवर्तन पर ध्यान खींचने वाले लैटिन उद्गार का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: amplius ... non conparebat mihi
  choice: मुझे फिर दिखाई नहीं दी
  rationale: यहाँ amplius non का अर्थ ‘अब आगे/फिर नहीं’ है और conparebat mihi प्रत्यक्ष दिखाई देने को व्यक्त करता है।
- source_word: civitas aedificabatur
  choice: एक नगर बनाया जा रहा था
  rationale: अपूर्ण भूतकालीन कर्मवाच्य से चल रही निर्माण-क्रिया सुरक्षित रहती है।
- source_word: locus ... de fundamentis magnis
  choice: विशाल नींवों वाला एक स्थान
  rationale: उत्तरकालीन/अनुवादात्मक लैटिन में de + अपादान गुण अथवा वर्णन को व्यक्त कर सकता है; यह रूप नींवों को उस स्थान की विशेषता बताता है और अस्वाभाविक ‘नींवों से’ से बचता है।
- source_word: demonstrabatur
  choice: प्रकट किया जा रहा था
  rationale: कर्मवाच्य और क्रमशः दिखाए/प्रकट किए जाने का भाव बनाए रखता है।
- source_word: clamavi voce magna
  choice: ऊँचे स्वर से पुकारकर
  rationale: लैटिन मुहावरे का सहज हिन्दी रूप, जिसमें आवाज़ की तीव्रता बनी रहती है।
