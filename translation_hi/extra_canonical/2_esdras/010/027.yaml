  register: आधुनिक मानक हिन्दी में सहज, दृश्यात्मक और गरिमापूर्ण शैली रखी गई है। नगर के बनते रहने और स्थान के प्रकट किए जाते रहने के लिए अपूर्ण कर्मवाच्य संरचना सुरक्षित है। ‘de fundamentis magnis’ को गुण-वर्णन मानकर अनूदित किया गया है; इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं समझी गई।
