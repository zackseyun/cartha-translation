  yaml_path: translation/extra_canonical/2_esdras/010/035.yaml
  text: For I knew[a], and I hear what I do not know; or is my understanding
translation:
  language: hi
  text: क्योंकि मैं जानता था, और जो मैं नहीं जानता उसे सुनता हूँ; या क्या मेरी समझ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sciebam
  choice: मैं जानता था
  rationale: लातीनी अपूर्ण भूतकाल को सीधे व्यक्त करता है और स्रोत में प्रयुक्त ‘जानना’ की पुनरावृत्ति बनाए रखता है।
- source_word: audio
  choice: सुनता हूँ
  rationale: वर्तमानकाल का स्वाभाविक हिन्दी रूप; भूतकाल ‘जानता था’ और वर्तमान ‘सुनता हूँ’ के बीच स्रोत का काल-विरोध सुरक्षित रहता है।
- source_word: quae non scio
  choice: जो मैं नहीं जानता उसे
  rationale: scio को फिर ‘जानना’ ही अनूदित करके स्रोत की अर्थपूर्ण पुनरावृत्ति बनाए रखी गई है; इसे ‘समझता’ कहना अनावश्यक अर्थ-परिवर्तन होता।
- source_word: sensus meus
  choice: मेरी समझ
  rationale: इस संदर्भ में sensus मानसिक बोध या समझ को दर्शाता है; ‘मेरी इन्द्रिय’ अस्वाभाविक और अत्यधिक शाब्दिक होता।
theological_decisions:
- issue: अंतिम उपवाक्य स्रोत में अधूरा है
  choice: ‘या क्या मेरी समझ—’ के रूप में अधूरापन बनाए रखा
  alternative: अगले अंश का अनुमान लगाकर वाक्य पूरा करना
  rationale: उपलब्ध लातीनी पाठ Aut numquid sensus meus पर समाप्त होता है; डैश पाठ की अपूर्णता दिखाता है, बिना किसी अनुपलब्ध आशय को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सरल शैली रखी गई है। स्रोत की असामान्य वाक्यरचना, काल-विरोध और अंतिम अधूरापन को सहज हिन्दी की सीमा में सुरक्षित रखा गया है।
