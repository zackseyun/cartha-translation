source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: futura est manebis hic, Et ostendet tibi altissimus eas uisiones somniorum quae faciet altissimus his qui habitant super terram in nouissimis diebus. Et dormiui illam noctem et aliam sicut praecepit mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/059.yaml
  text: and the Most High will show you those dream-visions that the Most High will bring about for those who dwell on the earth in the last days.”[a]
translation:
  language: hi
  text: तुम यहीं ठहरे रहोगे। परमप्रधान तुम्हें वे स्वप्न-दर्शन दिखाएगा जिनमें वह प्रकट करेगा कि अंतिम दिनों में पृथ्वी पर रहनेवालों के साथ वह क्या करेगा।[a] तब मैं उस रात और अगली रात सोया, जैसा उसने मुझे आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “परमप्रधान तुम्हें उन बातों के स्वप्न-दर्शन दिखाएगा जो वह अंतिम दिनों में पृथ्वी पर रहनेवालों के लिए करेगा।”'
    reason: लैटिन के दत्तिव पद his qui habitant का अर्थ ‘उनके साथ/उन पर’ या ‘उनके लिए’ हो सकता है; मुख्य पाठ कार्रवाई की दिशा को खुला रखता है।
lexical_decisions:
- source_word: manebis hic
  choice: तुम यहीं ठहरे रहोगे
  rationale: भविष्यकाल और स्थान पर बने रहने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: altissimus
  choice: परमप्रधान
  rationale: ईश्वर के इस शीर्षक का प्रतिष्ठित, अर्थ-सटीक और संप्रदाय-निरपेक्ष हिन्दी रूप।
- source_word: uisiones somniorum
  choice: स्वप्न-दर्शन
  rationale: ‘स्वप्नों के दर्शन’ की लैटिन संरचना को संक्षिप्त और स्वाभाविक हिन्दी में रखता है, साथ ही प्रकाशनात्मक दर्शन का भाव बचाता है।
- source_word: quae faciet
  choice: जिनमें वह प्रकट करेगा कि ... वह क्या करेगा
  rationale: ‘quae’ को केवल ‘दर्शनों’ का स्त्रीलिंग संबंधवाचक मानने के बजाय, जिन बातों को परमप्रधान घटित करेगा उनका आशय स्पष्ट करता है; ‘दर्शन करना’ जैसी अस्वाभाविक अभिव्यक्ति से बचता है।
- source_word: his qui habitant super terram
  choice: पृथ्वी पर रहनेवालों के साथ
  rationale: दत्तिव कारक को हिन्दी में ‘के साथ’ द्वारा व्यक्त कर क्रिया के उन लोगों की ओर निर्देशित होने का भाव रखता है, पर अनिवार्यतः हितकारी या दंडात्मक अर्थ नहीं थोपता।
- source_word: in nouissimis diebus
  choice: अंतिम दिनों में
  rationale: अपोकैलिप्टिक काल-सूचक पद का सीधा और प्रचलित हिन्दी रूप।
- source_word: illam noctem et aliam
  choice: उस रात और अगली रात
  rationale: शाब्दिक ‘उस रात और दूसरी’ की अपेक्षा प्रसंगानुकूल और स्वाभाविक हिन्दी।
theological_decisions:
- issue: पृथ्वी के निवासियों की ओर परमप्रधान की कार्रवाई का स्वरूप
  choice: उनके ‘साथ’ वह क्या करेगा
  alternative: उनके ‘लिए’ वह क्या करेगा / उनके ‘साथ न्याय में’ क्या करेगा
  rationale: लैटिन दत्तिव ‘his’ हित, हानि या केवल संबद्धता को अपने आप निश्चित नहीं करता। ‘के साथ’ मूल की खुली हुई अर्थ-सीमा और प्रलय-साहित्य के तनाव को बनाए रखता है।
- issue: ‘quae’ का संबंध
  choice: दर्शनों में दिखाई जानेवाली भावी बातों से संबंध
  alternative: 'सीधे ‘स्वप्न-दर्शनों’ से संबंध: ‘वे स्वप्न-दर्शन जिन्हें परमप्रधान करेगा’'
  rationale: ‘स्वप्न-दर्शन करना’ अर्थगत रूप से अस्वाभाविक है और संभवतः अंतर्निहित यूनानी नपुंसकलिंग बहुवचन ‘वे बातें जो’ का प्रतिबिंब यहाँ है। चुना हुआ रूप इस आशय को स्पष्ट करता है, बिना घटनाओं का स्वरूप तय किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘परमप्रधान’ की पुनरावृत्ति मूल में है, पर हिन्दी में अनावश्यक बोझ से बचने के लिए दूसरी बार सर्वनाम ‘वह’ रखा गया है। उपलब्ध लैटिन की आरंभिक खंडित अभिव्यक्ति ‘futura est’ स्पष्टतः पिछले वाक्य का अवशेष जान पड़ती है; स्वतंत्र वाक्य न बन पाने के कारण इस पद में उसका अनुमानित पूर्वपद जोड़कर अनुवाद नहीं किया गया।
