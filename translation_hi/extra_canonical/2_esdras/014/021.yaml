  text: For your law has been burned, and therefore no one knows the things done by you
translation:
  language: hi
  text: क्योंकि आपकी व्यवस्था जला दी गई है; इसलिए कोई नहीं जानता कि आपने क्या-क्या किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lex tua
  choice: आपकी व्यवस्था
  rationale: ‘lex’ के लिए ‘व्यवस्था’ शास्त्रीय और स्वाभाविक हिन्दी है; ‘आपकी’ परमेश्वर को किए जा रहे संबोधन का सम्मानपूर्ण रूप है।
- source_word: incensa est
  choice: जला दी गई है
  rationale: यह कर्मवाच्य अर्थ को सुरक्षित रखता है और कर्ता को अनिर्दिष्ट रहने देता है।
- source_word: quae a te
  choice: आपने क्या-क्या किया है
  rationale: लैटिन वाक्यांश का पाठ अधूरा या संक्षिप्त प्रतीत होता है; उपलब्ध अंग्रेज़ी परामर्श-पाठ के अनुरूप इसे परमेश्वर द्वारा किए गए कार्यों के रूप में व्यक्त किया गया है, बिना उन कार्यों को और निर्दिष्ट किए।
theological_decisions:
- issue: ‘quae a te’ में निहित संदर्भ
  choice: आपने क्या-क्या किया है
  alternative: आपकी ओर से जो बातें हैं
  rationale: स्रोत-पाठ में अपेक्षित क्रिया या संज्ञा स्पष्ट नहीं है। मुख्य पाठ पठनीय बनाया गया है, जबकि ‘क्या-क्या’ संदर्भ की अनिश्चित व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण ईश्वरीय संबोधन रखा गया है। वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है।
