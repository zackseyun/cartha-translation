translation:
  language: hi
  text: 'चालीस दिनों तक। पर तुम अपने लिए बहुत-सी लेखन-पट्टियाँ[a] तैयार कर लो और इन पाँच व्यक्तियों को अपने साथ ले लो: सारेआ, दाब्रिया, सेलेमिया, एथन और असीएल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन शब्द ‘buxos’ का शाब्दिक संकेत बॉक्सवुड की बनी पट्टियों की ओर है। यहाँ उनका उपयोग लिखने के लिए होना अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: diebus XL
  choice: चालीस दिनों तक
  rationale: खंडित लैटिन वाक्यांश के कालावधि-संबंधी अर्थ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: buxos multos
  choice: बहुत-सी लेखन-पट्टियाँ
  rationale: ‘buxos’ का शाब्दिक संकेत बॉक्सवुड की पट्टियों की ओर है; प्रसंग में उनका कार्य लिखने की पट्टियों का है, इसलिए मुख्य पाठ में कार्यगत अर्थ दिया गया है और पदार्थ-संबंधी जानकारी पादटिप्पणी में रखी गई है।
- source_word: praepara tibi
  choice: अपने लिए … तैयार कर लो
  rationale: लैटिन के आत्मवाचक भाव और आदेश दोनों को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: accipe tecum
  choice: अपने साथ ले लो
  rationale: लैटिन आदेश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: quinque
  choice: इन पाँच जनों को
  rationale: लैटिन में सूची के बाद आए ‘quinque’ को हिन्दी में सूची से पहले रखा गया है, ताकि आशय स्पष्ट और वाक्य स्वाभाविक रहे तथा कोई शब्द न छूटे।
- source_word: Saream, Dabriam, Selemiam, Ethanum et Asihel
  choice: सारेआ, दाब्रिया, सेलेमिया, एतान और असीहेल
  rationale: व्यक्तिनामों को उपलब्ध लैटिन रूपों के निकट देवनागरी में लिप्यंतरित किया गया है; कारकांत रूपों को नाम का मूल रूप मानकर हिन्दी में स्वाभाविक बनाया गया है।
