lexical_decisions:
- source_word: reuiuiscemus
  choice: हम फिर जीवित होंगे
  rationale: लैटिन क्रिया के प्रथम पुरुष बहुवचन और पुनः जीवन पाने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: iustorum nomen
  choice: धर्मियों का नाम
  rationale: मूल के एकवचन सामूहिक संज्ञा-विन्यास को बनाए रखता है; इसे ‘पहचान’ या ‘यश’ बनाकर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: impiorum facta
  choice: भक्तिहीनों के काम
  rationale: impiorum के धार्मिक-अधार्मिक आशय को ‘भक्तिहीन’ और facta को सामान्य, सहज ‘काम’ से व्यक्त किया गया है।
- source_word: ostendentur
  choice: उजागर किए जाएँगे
  rationale: निष्क्रिय रूप और छिपे कर्मों के सामने लाए जाने का भाव सुरक्षित रहता है।
- source_word: accedat
  choice: पास न आए
  rationale: संदर्भ में किसी व्यक्ति का वक्ता के निकट आना अभिप्रेत है; यह सहज और सीधा हिन्दी प्रयोग है।
theological_decisions:
- issue: iustorum nomen का आशय
  choice: धर्मियों का नाम
  alternative: धर्मियों की पहचान / धर्मियों का यश
  rationale: मूल पाठ ‘नाम’ कहता है और यह स्पष्ट नहीं करता कि आशय पहचान, प्रतिष्ठा या अभिलेखित नाम से है; इसलिए अस्पष्टता संरक्षित की गई है।
- issue: reuiuiscemus में पुनर्जीवन का स्वरूप
  choice: हम फिर जीवित होंगे
  alternative: हम पुनर्जीवित किए जाएँगे / हम जी उठेंगे
  rationale: मूल कथन पुनः जीवित होने की बात करता है, पर उसके सटीक साधन या धर्मवैज्ञानिक स्वरूप को नहीं खोलता; चयन उसी सीमा में रहता है।
- issue: neque पर अधूरा समापन
  choice: न ही—
  alternative: और न
  rationale: स्रोत अंश neque पर टूटता है। डैश पाठ की अपूर्ण निरंतरता दिखाता है और अगले पद की सामग्री का अनुमान नहीं लगाता।
