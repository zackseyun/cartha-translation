source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: XII enim partibus diuisum est saeculum, et transierunt eius X iam et dimidium xmae partis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/011.yaml
  text: For the age has been divided into twelve parts[a], and ten of its parts have already passed, and half of the tenth part.
translation:
  language: hi
  text: क्योंकि युग बारह भागों में बाँटा गया है; उसके दस[a] भाग बीत चुके हैं, और दसवें भाग का आधा भी बीत चुका है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी आधार-पाठ में ‘दस’ है। अन्य प्राचीन भाषा-साक्ष्य ‘नौ’ पढ़ते हैं; यह पाठ ‘दसवें भाग का आधा’ और अगले पद में ढाई भाग शेष रहने की गणना से मेल खाता है।
    reason: लातीनी आधार-पाठ के ‘दस’ को मुख्य पाठ में रखते हुए महत्त्वपूर्ण वैकल्पिक पाठ और उसके प्रसंगगत समर्थन को दर्ज करना।
lexical_decisions:
- source_word: saeculum
  choice: यह युग
  rationale: यहाँ शब्द वर्तमान विश्व-युग या कालखंड को दर्शाता है; ‘युग’ इस समय-संबंधी अर्थ को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: XII partibus diuisum est
  choice: बारह भागों में बाँटा गया है
  rationale: लातीनी पूर्ण कर्मवाच्य का अर्थ और रूपक सीधे बनाए रखे गए हैं।
- source_word: dimidium xmae partis
  choice: दसवें भाग का आधा भी
  rationale: क्रमवाचक संख्या और अंश दोनों को स्पष्ट रखा गया है; ‘भी’ बीते हुए नौ भागों में इस अतिरिक्त आधे भाग के जुड़ने का भाव देता है।
theological_decisions:
- issue: 'बीते हुए भागों की संख्या: पांडुलिपि का X बनाम प्राचीन अनुवादों और प्रसंग से समर्थित IX'
  choice: नौ
  alternative: दस
  rationale: उपलब्ध साफ़ किए गए लातीनी पाठ में X (‘दस’) है, पर उसी वाक्य में ‘दसवें भाग का आधा’ और अगले पद में ढाई भाग शेष रहने की गणना, दोनों IX (‘नौ’) की ओर संकेत करते हैं। सीरियाई, इथियोपियाई, अरबी और आर्मीनियाई साक्ष्य भी ‘नौ’ का समर्थन करते हैं। पाठ की कठिनाई छिपाई नहीं गई, बल्कि पादटिप्पणी में लातीनी पाठ सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और गणनात्मक रूपक के प्रति निकट भाषा अपनाई गई है। अर्धविराम वाक्य के दो संबंधित खंडों को स्पष्ट करता है।
