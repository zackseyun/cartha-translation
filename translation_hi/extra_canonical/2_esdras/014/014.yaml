id: 2ES.14.14
reference: 2 Esdras 14:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dimitte abs te mortales cogitationes, et proice abs te pondera humana, et exue te iam infirmam naturam, et repone in unam partem molestissima tibi cogitamenta, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/014.yaml
  text: And put away from yourself mortal thoughts, and cast off from yourself human burdens, and strip off now your weak nature, and set aside the thoughts that are most grievous to you,
translation:
  language: hi
  text: और नश्वर विचारों को अपने से दूर कर दे, मानवीय बोझों को उतार फेंक, अब अपने दुर्बल स्वभाव को उतार फेंक, और उन विचारों को, जो तुझे अत्यन्त कष्ट देते हैं, एक ओर रख दे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortales cogitationes
  choice: नश्वर विचारों
  rationale: ‘mortales’ का मूल अर्थ ‘नश्वर/मरणशील’ है; ‘नश्वर विचार’ स्रोत की असामान्य पर अर्थपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: pondera humana
  choice: मनुष्य के बोझों
  rationale: ‘मानवीय बोझ’ की अपेक्षा यह सामान्य पाठक के लिए अधिक स्वाभाविक है और मानव जीवन से जुड़े बोझों का अर्थ खुला रखता है।
- source_word: exue te
  choice: त्याग दे
  rationale: लैटिन में वस्त्र उतारने का रूपक है; हिन्दी में ‘स्वभाव को उतार दे’ असहज होता, इसलिए रूपक की त्याग-वाचक शक्ति को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: infirmam naturam
  choice: दुर्बल स्वभाव
  rationale: ‘natura’ के लिए ‘स्वभाव’ और ‘infirmam’ के लिए ‘दुर्बल’ स्रोत के मानवीय/शारीरिक दुर्बलता संबंधी अर्थ को बिना अधिक व्याख्या के रखते हैं।
- source_word: molestissima tibi cogitamenta
  choice: जो चिंताएँ तुझे सबसे अधिक व्यथित करती हैं
  rationale: ‘molestissima tibi’ की तीव्रता को ‘सबसे अधिक व्यथित’ से और ‘cogitamenta’ को प्रसंगानुकूल ‘चिंताएँ’ से व्यक्त किया गया है।
- source_word: repone in unam partem
  choice: एक ओर रख दे
  rationale: लैटिन मुहावरे का स्वाभाविक हिन्दी समतुल्य, जिसका अर्थ अलग रख देना है।
theological_decisions:
- issue: ‘दुर्बल स्वभाव को त्यागने’ का आशय
  choice: मूल रूपक को संक्षिप्त और खुला रखा गया है
  alternative: इसे पापी स्वभाव, नश्वर शरीर, या मानवीय कमजोरी के रूप में स्पष्ट करना
  rationale: स्रोत केवल ‘infirmam naturam’ कहता है; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को जोड़ना मूल की संभावित व्यापकता को सीमित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधे संबोधन वाला वाक्य। एकवचन आदेशों में ‘कर दे/फेंक/त्याग दे’ स्रोत की अनौपचारिक एकवचन आज्ञार्थक शैली को बनाए रखते हैं। पद का अंतिम अल्पविराम अगले पद में वाक्य जारी रहने का संकेत देता है।
