source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'eius ut ignis similis. Et accepi et bibi, et in eo cum bibissem cor meum eructuabat intellectum et in pectus meum increscebat sapientia, nam spiritus meus conseruabat memoriam : Et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/040.yaml
  text: And I took it and drank[a], and when I had drunk it, my heart poured forth understanding, and wisdom increased in my breast, for my spirit retained memory.
translation:
  language: hi
  text: और मैंने उसे लिया और पी लिया। जब मैं उसे पी चुका था, तो मेरा हृदय समझ-बूझ उंडेलने लगा, और मेरे अंतर्मन में बुद्धि बढ़ती गई, क्योंकि मेरी आत्मा स्मृति को सुरक्षित रखती थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आत्मा अपनी स्मृति बनाए रखती थी।”
    reason: अंग्रेज़ी POB के वैकल्पिक पाठ “kept its memory” को दर्शाता है। मुख्य पाठ लैटिन «conseruabat memoriam» के अधिक सीधे अर्थ, ‘स्मृति को सुरक्षित रखती थी,’ को रखता है।
lexical_decisions:
- source_word: cor meum eructuabat intellectum
  choice: मेरा हृदय समझ उंडेलने लगा
  rationale: ‘eructuabat’ का मूल भाव भीतर से प्रचुरता के साथ बाहर निकालना है; ‘उंडेलने लगा’ इस सजीव रूपक को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: in pectus meum increscebat sapientia
  choice: मेरे भीतर बुद्धि बढ़ती गई
  rationale: ‘pectus’ का शाब्दिक अर्थ छाती है, पर यहाँ यह अंतर्मन का संकेत देता है; ‘मेरे भीतर’ आधुनिक हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: spiritus meus conseruabat memoriam
  choice: मेरी आत्मा स्मृति को बनाए रखती थी
  rationale: ‘conseruabat’ निरंतर सुरक्षित रखने या बनाए रखने का बोध देता है, और ‘memoriam’ को उसके प्रत्यक्ष कर्म ‘स्मृति’ के रूप में रखा गया है।
theological_decisions:
- issue: ‘spiritus meus’ का अर्थ
  choice: मेरी आत्मा
  alternative: मेरी चेतना / मेरा मन
  rationale: लैटिन ‘spiritus’ को अधिक ठोस रूप से ‘आत्मा’ कहना स्रोत की आध्यात्मिक भाषा और मनुष्य के भीतरी पक्ष के संकेत—दोनों को खुला रखता है।
- issue: ‘memoriam’ का आशय
  choice: स्मृति
  alternative: याद रखने की शक्ति / स्मरण
  rationale: स्रोत यह स्पष्ट नहीं करता कि आशय स्मरण-शक्ति है या स्मृति में सुरक्षित विषय-वस्तु; ‘स्मृति’ इस संभावित द्विअर्थता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हृदय द्वारा ‘समझ उंडेलने’ का स्रोत-रूपक सुरक्षित है, जबकि ‘in pectus meum’ को अप्राकृतिक ‘मेरी छाती में’ के बजाय प्रसंगानुकूल ‘मेरे भीतर’ कहा गया है। आरम्भ और अन्त में जुड़े पिछले/अगले वाक्य के खंड को इस पद के पाठ में शामिल नहीं किया गया।
