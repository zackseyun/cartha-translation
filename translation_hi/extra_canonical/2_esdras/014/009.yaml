source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu enim reciperis ab hominibus, et conuerteris residuum cum filio meo et cum similibus tuis usquequo finiantur tempora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/009.yaml
  text: For you will be taken up from among men[a], and you will remain with my son and with those like you until the times are finished.
translation:
  language: hi
  text: क्योंकि तुम्हें मनुष्यों के बीच से उठा लिया जाएगा, और तुम शेष काल मेरे पुत्र और अपने जैसे लोगों के साथ रहोगे[a], जब तक कि समय समाप्त न हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पुत्र के साथ निवास करोगे।”
    reason: conuerteris यहाँ साथ रहने या निवास करने का भाव दे सकता है; यह अंग्रेज़ी audit trail के वैकल्पिक पाठ का संदर्भ स्पष्ट रखता है।
lexical_decisions:
- source_word: reciperis ab hominibus
  choice: तुम्हें मनुष्यों के बीच से उठा लिया जाएगा
  rationale: लातीनी निष्क्रिय क्रिया reciperis को उसके इस प्रसंगगत अर्थ में रखा गया है कि एज्रा को मानव समाज से अलग कर ऊपर उठा लिया जाएगा; वाक्य यह स्पष्ट नहीं करता कि उठाने वाला कौन है।
- source_word: conuerteris residuum
  choice: तुम शेष काल ... रहोगे
  rationale: residuum शेष अवधि को व्यक्त करता है। conuerteris का शाब्दिक अर्थ व्यापक है, पर इस संदर्भ में साथ बने रहने या निवास करने का भाव स्वाभाविक है।
- source_word: cum similibus tuis
  choice: अपने जैसे लोगों के साथ
  rationale: यह similibus की जानबूझकर अनिश्चित अभिव्यक्ति को बनाए रखता है और यह तय नहीं करता कि समानता किस दृष्टि से है।
- source_word: usquequo finiantur tempora
  choice: जब तक कि वे समय पूरे न हो जाएँ
  rationale: tempora के बहुवचन को बनाए रखा गया है और finiantur को समाप्ति अथवा पूर्णता के अर्थ में स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: ‘मेरे पुत्र’ की पहचान
  choice: मेरे पुत्र
  alternative: मसीहा अथवा परमेश्वर का पुत्र
  rationale: मूल पाठ केवल filio meo कहता है; अनुवाद किसी विशिष्ट मसीही या सम्प्रदायगत पहचान को स्पष्ट करके नहीं जोड़ता।
- issue: एज्रा को मनुष्यों के बीच से लिए जाने की रीति
  choice: उठा लिया जाएगा
  alternative: ग्रहण कर लिया जाएगा / हटा लिया जाएगा
  rationale: यह असाधारण रूप से ले लिए जाने का भाव देता है, पर मृत्यु, स्वर्गारोहण या किसी अन्य निश्चित प्रक्रिया का दावा नहीं करता।
- issue: ‘अपने जैसे लोगों’ का संदर्भ
  choice: अनिर्दिष्ट रखा गया
  alternative: भविष्यद्वक्ता / धर्मी जन
  rationale: similibus tuis यह नहीं बताता कि वे लोग किस गुण में एज्रा जैसे हैं; इसलिए किसी खास वर्ग की पहचान नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘शेष काल’ से residuum की वह सूक्ष्मता सुरक्षित रहती है जो केवल ‘रहोगे’ कहने पर छूट सकती थी; ‘वे समय’ मूल के बहुवचन को दर्शाता है।
