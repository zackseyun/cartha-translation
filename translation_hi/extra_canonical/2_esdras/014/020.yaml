id: 2ES.14.20
reference: 2 Esdras 14:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem iterum nati fuerint, quis commonebit ? Positum est enim saeculum in tenebris, et qui inhabitant in eo sine lumine ;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/020.yaml
  text: But those who will be born afterward—who will warn them? For the age lies in darkness[a], and those who dwell in it are without light.
translation:
  language: hi
  text: लेकिन जो लोग बाद में जन्म लेंगे, उन्हें कौन चेतावनी देगा? क्योंकि यह युग अंधकार में पड़ा है,[a] और इसमें रहनेवाले प्रकाश से वंचित हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रखा गया है’।
    reason: लैटिन positum est का अधिक शाब्दिक कर्मवाच्य रूप संभव है, यद्यपि प्रसंग में स्थितिवाचक अर्थ अधिक स्वाभाविक है।
lexical_decisions:
- source_word: autem iterum nati fuerint
  choice: लेकिन जो लोग बाद में जन्म लेंगे
  rationale: खंडित संदर्भ में iterum का आशय आगे या बाद में जन्म लेनेवालों से है; स्वाभाविक हिन्दी में यही समयगत अर्थ स्पष्ट किया गया है।
- source_word: quis commonebit
  choice: उन्हें कौन चेतावनी देगा?
  rationale: commonebit स्मरण दिलाने, सचेत करने या चेतावनी देने का भाव रखता है; अंधकार और प्रकाश के प्रसंग में ‘चेतावनी देगा’ सहज और उपयुक्त है।
- source_word: saeculum
  choice: यह युग
  rationale: saeculum यहाँ वर्तमान विश्व-युग या काल-व्यवस्था को सूचित करता है, केवल ‘संसार’ को नहीं।
- source_word: positum est ... in tenebris
  choice: अंधकार में पड़ा है
  rationale: positum est और स्थानसूचक पदबंध का यहाँ स्थितिवाचक अर्थ है—युग अंधकार में स्थित या पड़ा है—न कि अनिवार्यतः किसी कर्ता द्वारा वहाँ रखे जाने की क्रिया।
- source_word: sine lumine
  choice: प्रकाश से वंचित हैं
  rationale: शाब्दिक ‘प्रकाश के बिना’ का स्वाभाविक, गरिमापूर्ण हिन्दी रूप, जो मूल की दशा को बनाए रखता है।
theological_decisions:
- issue: positum est में सक्रिय रूप से अंधकार में रखे जाने का संभावित संकेत
  choice: स्थितिवाचक ‘अंधकार में पड़ा है’
  alternative: ‘अंधकार में रख दिया गया है’
  rationale: लैटिन में pono का पूर्ण कर्मवाच्य, स्थानसूचक पूरक के साथ, प्रायः वर्तमान स्थिति बताता है। सक्रिय अनुवाद अनावश्यक रूप से किसी कर्ता—विशेषतः परमेश्वर—की प्रत्यक्ष क्रिया का संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य विन्यास सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखा गया है। ‘युग’, ‘अंधकार’ और ‘प्रकाश’ जैसे मूल रूपकों को बनाए रखा गया है।
