  text: From the beginning[a], our fathers sojourned in Egypt, and they were delivered.
translation:
  language: hi
  text: हमारे पूर्वज आरम्भ से ही[a] मिस्र में परदेशी होकर रहे, और वे छुड़ाए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आरम्भ में हमारे पूर्वज मिस्र में परदेशी होकर रहे।”
    reason: लैटिन ab initio का संबंध ‘परदेशी होकर रहे’ से ‘आरम्भ से’ के अर्थ में या इस ऐतिहासिक क्रम के आरम्भिक चरण से ‘आरम्भ में’ के अर्थ में समझा जा सकता है।
lexical_decisions:
- source_word: patres nostri
  choice: हमारे पूर्वज
  rationale: यह स्वाभाविक आधुनिक हिन्दी में सामुदायिक पुरखों को व्यक्त करता है और ‘पिता’ के अनावश्यक शाब्दिक अर्थ से बचता है।
- source_word: grinati sunt
  choice: परदेशी होकर रहे
  rationale: उपलब्ध लैटिन पाठ का यह रूप प्रवास या परदेश में निवास के अर्थ में समझा जाता है; हिन्दी वाक्यांश उस स्थिति को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: liberati sunt
  choice: वे छुड़ाए गए
  rationale: लैटिन के कर्मवाच्य को बनाए रखता है और छुड़ाने वाले को वहाँ स्पष्ट नहीं करता जहाँ स्रोत भी उसका नाम नहीं बताता।
- source_word: ab initio
  choice: आरम्भ से ही
  rationale: लैटिन के निरंतरता-सूचक संभावित अर्थ को निकटता से व्यक्त करता है; वैकल्पिक कालगत संबंध पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: छुटकारा देने वाले की पहचान
  choice: कर्मवाच्य ‘वे छुड़ाए गए’ रखा गया
  alternative: ‘परमेश्वर ने उन्हें छुड़ाया’
  rationale: संदर्भ में परमेश्वर अभिप्रेत हो सकते हैं, पर इस पद के लैटिन पाठ में कर्ता स्पष्ट नहीं है; उसे जोड़ना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘परदेशी होकर रहे’ सामान्य पाठक के लिए बोधगम्य है, जबकि कर्मवाच्य स्रोत की संक्षिप्तता और अनिर्दिष्ट कर्ता को सुरक्षित रखता है।
