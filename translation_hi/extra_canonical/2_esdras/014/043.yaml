  yaml_path: translation/extra_canonical/2_esdras/014/043.yaml
  text: They wrote by day, but at night they ate bread. As for me, I spoke by day, and at night I was not silent.
translation:
  language: hi
  text: वे दिन में लिखते थे और रात में रोटी खाते थे; पर मैं दिन में बोलता था और रात में चुप नहीं रहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: per diem scribebant
  choice: दिन में लिखते थे
  rationale: लातीनी कालगत वाक्यांश और अपूर्ण भूतकाल की निरंतर क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: manducabant panem
  choice: रोटी खाते थे
  rationale: शाब्दिक अर्थ ‘रोटी खाते थे’ है; यहाँ सामान्य भोजन का संभावित भाव रहते हुए मूल की ठोस संज्ञा सुरक्षित रखी गई है।
- source_word: per diem loquebar
  choice: दिन में बोलता था
  rationale: मूल के loquebar को बिना ‘बुलवाता’ या ‘पढ़ाता’ जैसी व्याख्या जोड़े सीधे व्यक्त करता है।
- source_word: nocte non [tacebam]
  choice: रात में चुप नहीं रहता था
  rationale: प्राप्त पाठ का अंतिम non संदर्भतः लुप्त/अध्याहृत tacebam से पूर्ण होता है; अंग्रेज़ी परामर्श-पाठ भी इसी प्राचीन पाठगत समझ को दर्शाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘पर मैं’ से लेखक और लिखने वालों के बीच मूल का स्पष्ट विरोध बनाए रखा गया है। पद के आरम्भ में स्रोत-पंक्ति में दिखने वाला ‘XL diebus’ सम्भवतः पिछले वाक्य/पद से संबद्ध है, इसलिए इस पद के अंग्रेज़ी लेखा-पाठ के अनुरूप मुख्य पाठ में नहीं जोड़ा गया।
