translation:
  language: hi
  text: क्योंकि वह न्यायाधीश है, उसने उचित समय पर तुमसे वह वापस ले लिया जो कुछ उसने दिया था। और
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudex
  choice: न्यायी
  rationale: यहाँ संज्ञा ‘न्याय करने वाला’ के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; दिए गए लैटिन में ‘धर्मी’ के लिए अलग शब्द नहीं है।
- source_word: cum sit
  choice: क्योंकि वह ... है
  rationale: इस संदर्भ में लैटिन का कारणसूचक भाव है।
- source_word: abstulit a uobis
  choice: उसने ... तुमसे ... वापस ले लिया
  rationale: abstulit के ले लेने/हटा लेने के भाव को व्यक्त करता है; ‘वापस’ उस वस्तु के पहले उसी के द्वारा दिए जाने के संदर्भ से स्वाभाविक है।
- source_word: in tempore
  choice: उचित समय पर
  rationale: शाब्दिक ‘समय पर’ की अपेक्षा प्रसंगानुकूल नियत या उपयुक्त अवसर का भाव स्पष्ट करता है, बिना ‘due’ को अत्यधिक सिद्धान्तगत बनाने के।
- source_word: quod donauerat
  choice: वह जो उसने दिया था
  rationale: पूर्वकालिक क्रिया को हिन्दी के पूर्ण भूतकाल से सुरक्षित रखा गया है।
- source_word: Et
  choice: और
  rationale: स्रोत के अंत में उपस्थित संयोजक को रखा गया है, यद्यपि वाक्य अगले पद में पूरा होता है।
theological_decisions:
- issue: न्यायकर्ता के लिए अतिरिक्त नैतिक विशेषण
  choice: केवल ‘न्यायी’
  alternative: ‘धर्मी न्यायी’
  rationale: प्रस्तुत लैटिन खंड में iustus नहीं है; अतः ‘धर्मी’ जोड़ना स्रोत से आगे जाना होगा। ‘न्यायी’ iudex का स्वाभाविक संज्ञात्मक अनुवाद है।
- issue: ले लेने का दैवी समय
  choice: ‘उचित समय पर’
  alternative: ‘ठीक समय पर’ या ‘नियत समय पर’
  rationale: यह अनुवाद समय की उपयुक्तता व्यक्त करता है, पर ऐसा कोई अतिरिक्त सिद्धान्तगत दावा नहीं जोड़ता कि समय पूर्वनियत था।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। बहुवचन ‘तुमसे’ लैटिन uobis को दर्शाता है। अंतिम ‘और’ जानबूझकर रखा गया है क्योंकि स्रोत खंड Et पर समाप्त होता है और विचार अगले पद में जारी रहता है।
