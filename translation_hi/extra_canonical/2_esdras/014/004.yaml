  text: And I sent him, and he led my people out of Egypt, and I brought him up onto Mount Sinai, and I kept him with me many days.
translation:
  language: hi
  text: और मैंने उसे भेजा, और वह मेरी प्रजा को मिस्र से बाहर निकालकर ले गया। फिर मैं उसे सीनै पर्वत पर चढ़ाकर ले गया और बहुत दिनों तक उसे अपने पास रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misi eum
  choice: मैंने उसे भेजा
  rationale: लैटिन की क्रिया और पुरुषवाचक कर्म को सीधे और स्वाभाविक ढंग से सुरक्षित रखा गया है।
- source_word: eduxit populum meum de Aegypto
  choice: वह मेरी प्रजा को मिस्र से बाहर ले आया
  rationale: ‘educere’ में बाहर निकालकर ले आने का भाव है; ‘ले आया’ वक्ता परमेश्वर की दृष्टि से स्वाभाविक है।
- source_word: adduxi eum super montem Sina
  choice: मैं उसे सीनै पर्वत पर ऊपर ले गया
  rationale: ‘super montem’ के आरोहण-भाव को ‘पर ऊपर’ से व्यक्त किया गया है और कर्ता के ‘मैं’ को बनाए रखा गया है।
- source_word: detinui eum apud me diebus multis
  choice: बहुत दिनों तक उसे अपने पास रखा
  rationale: ‘apud me’ का निकटता-संबंधी भाव और ‘diebus multis’ की अवधि सहज आधुनिक हिन्दी में संरक्षित हैं।
theological_decisions:
- issue: मूसा की पहचान
  choice: पद में केवल ‘उसे/वह’ रखा गया
  alternative: स्पष्टता के लिए ‘मूसा’ जोड़ना
  rationale: स्रोत पाठ सर्वनाम का प्रयोग करता है; नाम जोड़ने से निहित संदर्भ स्पष्ट होता, पर वह इस पद में उपस्थित नहीं है।
- issue: निर्गमन में कर्तृत्व
  choice: ‘वह मेरी प्रजा को...ले आया’
  alternative: ‘उसने मेरी प्रजा को...निकाला’
  rationale: स्रोत में मूसा व्याकरणिक कर्ता है; अनुवाद उसी मानवीय माध्यमिक कर्तृत्व को बनाए रखता है, बिना परमेश्वर के व्यापक कर्तृत्व को नकारे।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। वाक्य को पठनीयता के लिए दो वाक्यों में विभाजित किया गया है। कोई पादटिप्पणी आवश्यक नहीं।
