  yaml_path: translation/extra_canonical/2_esdras/014/012.yaml
  text: But two of its parts remain after the middle of the tenth part[a].
translation:
  language: hi
  text: परन्तु दसवें भाग के मध्य के बाद उसके दो भाग शेष रह जाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दो भाग शेष रह जाते हैं।’
    reason: कुछ प्रस्तुतियों में लातीनी ‘eius’ (‘उसके’) को हिन्दी में व्यक्त नहीं किया जाता; यह संक्षिप्त वैकल्पिक पाठ उसी संभावना को दर्शाता है।
lexical_decisions:
- source_word: Superant
  choice: शेष रह जाते हैं
  rationale: लातीनी क्रिया का अर्थ ‘बाकी रहना’ है; वर्तमानकाल को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: autem
  choice: परन्तु
  rationale: यह पिछले कथन के साथ विरोध अथवा संक्रमण का संबंध दिखाता है।
- source_word: eius
  choice: उसके
  rationale: मूल पाठ के संबंधवाचक सर्वनाम को बनाए रखा गया है; इसका संकेत पिछले पद में उल्लिखित युग की ओर है।
- source_word: duae ... partis
  choice: दो भाग
  rationale: रूपगत असंगति के बावजूद आशय ‘दो भाग’ है, जैसा पाठ-परंपरा और वाक्य-संदर्भ से स्पष्ट होता है।
- source_word: post medium decimae partis
  choice: दसवें भाग के मध्य के बाद
  rationale: मूल के असामान्य परंतु अर्थपूर्ण काल-विभाजन को बिना सरल बनाकर मिटाए निकटता से प्रस्तुत करता है।
theological_decisions:
- issue: ‘eius’ का संबंध
  choice: ‘उसके’ को स्पष्ट रूप से बनाए रखा गया
  alternative: सर्वनाम छोड़कर केवल ‘दो भाग शेष रह जाते हैं’
  rationale: मूल लातीनी पाठ युग के विभाजनों से प्रत्यक्ष संबंध स्थापित करता है; इसे हटाना अर्थ की एक सूक्ष्मता खो देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समय-विभाजन की मूल, कुछ असामान्य संरचना को जानबूझकर सुरक्षित रखा गया है।
