source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'contigisse mala, iterum horum deteriora facientur : Quantum enim inualidum fit saeculum a senectute, tantum multiplicabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/016.yaml
  text: —worse things than these will happen again. For the weaker the age becomes through old age[a], the more evils will multiply.
translation:
  language: hi
  text: —इनसे भी बुरी बातें फिर घटेंगी। क्योंकि यह युग[a] बुढ़ापे के कारण जितना निर्बल होता जाता है, उतनी ही बुराइयाँ बढ़ती जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संसार’।
    reason: लैटिन saeculum का अर्थ प्रसंग के अनुसार ‘युग’ या ‘संसार’ हो सकता है।
lexical_decisions:
- source_word: deteriora
  choice: और भी बुरी बातें
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ बनाए रखता है; इसे केवल ‘विपत्तियाँ’ कहकर अनावश्यक रूप से सीमित नहीं करता।
- source_word: facientur
  choice: घटेंगी
  rationale: लैटिन भविष्यकालीन कर्मवाच्य का यहाँ स्वाभाविक अर्थ ‘होंगी/घटेंगी’ है, न कि ‘करेंगी’ या ‘उत्पन्न करेंगी’।
- source_word: saeculum
  choice: युग
  rationale: इस अपोकैलिप्टिक प्रसंग में ‘युग’ समय-व्यवस्था के बूढ़े और निर्बल होने की छवि को स्वाभाविक रूप से व्यक्त करता है; ‘संसार’ वैकल्पिक अर्थ है।
- source_word: a senectute
  choice: बुढ़ापे के कारण
  rationale: कारणसूचक प्रयोग और युग के वृद्ध होने की मूल रूपकात्मक छवि दोनों सुरक्षित रहते हैं।
- source_word: multiplicabunt
  choice: बुराइयाँ बढ़ती जाएँगी
  rationale: क्रिया का निहित बहुवचन कर्ता पूर्ववर्ती mala (‘बुराइयाँ’) है; हिन्दी में उसे स्पष्ट करना आवश्यक है।
theological_decisions:
- issue: facientur में निहित कर्तृत्व
  choice: ‘घटेंगी’ द्वारा घटना को कर्मकर्ता बताए बिना व्यक्त किया गया
  alternative: वर्तमान बुराइयाँ इससे भी बुरी बातें उत्पन्न करेंगी
  rationale: मूल में deteriora कर्ता है और facientur का अर्थ ‘घटित होंगी’ है; पाठ किसी मानवीय या प्राकृतिक कर्ता को स्पष्ट नहीं करता, इसलिए सम्भावित दैवी/अंतकालीन कर्मवाच्य को खुला रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। आरम्भिक दीर्घ विराम-चिह्न पिछले पद के वाक्य से निरन्तरता दिखाता है। ‘जितना…उतनी ही…’ संरचना Latin quantum…tantum के अनुपात को बनाए रखती है।
