  rationale: लातीनी अंश पिछले वाक्य से जुड़ा हुआ और आरम्भ में खंडित है। हिन्दी में निहित कर्ता को स्पष्ट करते हुए उद्देश्य/सम्भावना का भाव बनाए रखा गया है।
