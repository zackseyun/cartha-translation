translation:
  language: hi
  text: तुम जीवित रखे जाओगे, और मृत्यु के बाद दया पाओगे। क्योंकि न्याय मृत्यु के बाद आएगा, जब फिर से
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiui conseruati eritis
  choice: तुम जीवित बचाए जाओगे
  rationale: लैटिन में द्वितीय पुरुष बहुवचन भविष्यत् कर्मवाच्य है; यह जीवित रखे अथवा बचाए जाने का भाव व्यक्त करता है।
- source_word: misericordiam consequemini
  choice: दया पाओगे
  rationale: consequemini का अर्थ प्राप्त करना है; misericordiam के लिए सहज और गरिमापूर्ण हिन्दी ‘दया’ है।
- source_word: Iudicium
  choice: न्याय
  rationale: यहाँ शब्द मरणोत्तर न्याय अथवा न्यायिक निर्णय की घटना को सूचित करता है; ‘न्याय’ संक्षिप्त और संदर्भानुकूल है।
- source_word: quando iterum
  choice: जब फिर से
  rationale: स्रोत-अंश इसी अधूरे संयोजक पद पर समाप्त होता है; अगले पद का क्रियापद जोड़कर वाक्य को कृत्रिम रूप से पूरा नहीं किया गया।
theological_decisions:
- issue: मृत्यु के बाद misericordia की प्राप्ति
  choice: ‘मृत्यु के बाद दया पाओगे’ को बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: इसे अंतिम उद्धार या क्षमा के किसी विशिष्ट सिद्धान्त के रूप में स्पष्ट करना।
  rationale: लैटिन केवल दया प्राप्त होने की बात कहता है; उसका सैद्धान्तिक स्वरूप निर्धारित नहीं करता।
- issue: पद का अपूर्ण अंत
  choice: ‘जब फिर से’ पर अनुवाद समाप्त किया गया।
  alternative: अगले पद से reuiuiscemus लेकर ‘जब हम फिर जीवित होंगे’ कहना।
  rationale: दिए गए लैटिन स्रोत-खंड की पद-विभाजन सीमा सुरक्षित रखनी है; संबंधित क्रिया अगले पद में आती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली अपनाई गई है। स्रोत की द्वितीय पुरुष बहुवचन संरचना और पदांत की जानबूझकर बनी अपूर्णता सुरक्षित रखी गई है।
