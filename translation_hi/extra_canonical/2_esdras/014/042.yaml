base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/042.yaml
  text: And the Most High gave understanding to the five men[a], and they wrote in succession the things that were spoken, in characters that they did not know[b]. And they sat there forty days.
translation:
  language: hi
  text: मेरा मुँह खुल गया और फिर बंद नहीं हुआ। तब परमप्रधान ने उन पाँच पुरुषों को समझ दी, और जो बातें कही जा रही थीं, उन्हें वे बारी-बारी से[a] ऐसे चिह्नों में लिखते गए जिन्हें वे नहीं जानते थे[b]। और वे बैठे रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्रमशः।” यहाँ आशय संभवतः पाँचों पुरुषों के एक के बाद एक लिखने से है।
    reason: lexical_alternative
  - marker: b
    text: ये अपरिचित लिपि-चिह्न, आशुलिपि या परमेश्वर की दी हुई किसी लेखन-पद्धति के संकेत हो सकते हैं; केवल लैटिन पाठ इससे अधिक स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: apertum est os meum et non est clausum amplius
  choice: मेरा मुँह खुल गया और फिर बंद नहीं हुआ
  rationale: लैटिन के कर्मवाच्य और निरंतर अवस्था को सरल, स्वाभाविक हिन्दी में यथासंभव निकटता से व्यक्त करता है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त लैटिन सर्वोच्चता-सूचक उपाधि का प्रचलित और गरिमापूर्ण हिन्दी रूप।
- source_word: dedit intellectum
  choice: समझ दी
  rationale: intellectus को यहाँ लेखकों को मिली समझ अथवा क्षमता के व्यापक अर्थ में रखा गया है; इसे किसी अधिक विशिष्ट चमत्कारी वरदान के रूप में सीमित नहीं किया गया।
- source_word: ex successione
  choice: बारी-बारी से
  rationale: यह व्यक्तियों के क्रमशः कार्य करने को दर्शाता है, न कि अनिवार्यतः लिखी गई सामग्री को विषयानुसार क्रमबद्ध करने को।
- source_word: notis
  choice: चिह्नों
  rationale: notae लिपि-चिह्न, संकेत या आशुलिपि जैसे लेखन-रूपों को सूचित कर सकता है; ‘चिह्न’ मूल की व्यापकता बनाए रखता है।
- source_word: quas non sciebant
  choice: जिन्हें वे नहीं जानते थे
  rationale: अपरिचित लेखन-चिह्नों के आश्चर्यजनक विवरण को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: et sederunt
  choice: और वे बैठे रहे
  rationale: दिए गए लैटिन स्रोत का वाक्यांश यहीं समाप्त होता है; इसलिए अनुल्लिखित अवधि को मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: पाँच पुरुषों को दी गई समझ का स्वरूप
  choice: केवल ‘समझ दी’ कहा गया
  alternative: ‘अलौकिक लेखन-शक्ति दी’
  rationale: मूल intellectum कहता है और शक्ति के सटीक स्वरूप को स्पष्ट नहीं करता; इसलिए चमत्कारी प्रक्रिया को अधिक निश्चित नहीं बनाया गया।
- issue: अज्ञात चिह्नों का अर्थ
  choice: अर्थ को खुला रखा गया
  alternative: उन्हें निश्चित रूप से आशुलिपि या दिव्य लिपि कहना
  rationale: लैटिन notae किसी एक विशिष्ट लेखन-पद्धति को निर्णायक रूप से नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘पुरुषों’ स्रोत के uiris को स्पष्ट रखता है। दिए गए लैटिन पाठ में आरंभिक ‘मेरा मुँह…’ और अंतिम अपूर्ण-सा ‘और वे बैठे रहे’ दोनों सम्मिलित हैं; परामर्शी अंग्रेज़ी में आया ‘चालीस दिन’ उपलब्ध लैटिन अंश में नहीं है, इसलिए उसे नहीं जोड़ा गया।
