  text: upon those who dwell in it. For truth will withdraw farther away, and falsehood will draw near. For already the eagle that you saw in the vision is hastening to come.”
translation:
  language: hi
  text: और उसमें रहने वालों पर विपत्तियाँ आएँगी। क्योंकि सत्य और भी दूर हट जाएगा और झूठ निकट आ जाएगा। जिस उकाब को तुमने दर्शन में देखा था, वह अब आने की जल्दी में है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: विपत्तियाँ
  rationale: बहुवचन नपुंसकलिंग का अर्थ यहाँ संसार के निवासियों पर आनेवाली बुराइयाँ या संकट है; प्रसंग में स्वाभाविक और गरिमापूर्ण हिन्दी के लिए ‘विपत्तियाँ’ चुना गया।
- source_word: Prolongabit enim magis ueritas
  choice: क्योंकि सत्य और भी दूर हट जाएगा
  rationale: लैटिन पदबंध शाब्दिक रूप से सत्य के और दूर खिंचने का संकेत देता है। परामर्श-पाठ के अनुरूप दूरी की छवि को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: adpropinquabit mendacium
  choice: झूठ निकट आ जाएगा
  rationale: ‘adpropinquabit’ की निकट आने की स्थानिक छवि को बनाए रखा गया है, जो सत्य के दूर हटने के साथ विरोध रचती है।
- source_word: aquila
  choice: उकाब
  rationale: दर्शनीय प्रतीक के लिए ‘उकाब’ आधुनिक बाइबलीय हिन्दी में गरिमापूर्ण और स्पष्ट पक्षी-नाम है।
- source_word: festinat ... uenire
  choice: अभी से आने को उतावला है
  rationale: ‘festinat’ की शीघ्रता और आसन्नता को व्यक्त करता है; ‘iam’ का बल ‘अभी से’ में सुरक्षित है।
theological_decisions:
- issue: सत्य के दूर होने और झूठ के निकट आने का मानवीकरण
  choice: स्थानिक और मानवीकृत भाषा को यथावत रखा गया
  alternative: इसे सत्य के कम प्रभावी और झूठ के अधिक प्रभावी होने के रूप में व्याख्यायित करना
  rationale: मूल पाठ की काव्यात्मक तनावपूर्ण छवि को किसी विशेष धर्मवैचारिक व्याख्या में सीमित नहीं किया गया।
- issue: उकाब का प्रतीकात्मक अर्थ
  choice: केवल ‘उकाब’ कहा गया
  alternative: उसे किसी साम्राज्य या शासक के रूप में पाठ में ही पहचान देना
  rationale: इस पद में प्रतीक की व्याख्या नहीं की गई है; इसलिए दर्शन की वास्तविक अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखे गए हैं। आरंभिक खंड के स्रोत में संक्षिप्तता के कारण हिन्दी में निहित क्रिया ‘आएँगी’ जोड़ी गई है, जिससे वाक्य स्वाभाविक बनता है; अंतिम उद्धरण-चिह्न व्यापक संवाद की निरंतरता दर्शाता है।
