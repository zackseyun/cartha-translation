  text: 'Et ecce uox exiuit contra me de rubo et dixit : Ezra, Ezra ! et dixi: ecce ego, domine. et surrexi super pedes meos, et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/002.yaml
  text: 'And behold, a voice came to me from a bush and said, “Ezra, Ezra!” And I said, “Here I am, Lord.” And I stood on my feet, and it said to me:'
translation:
  language: hi
  text: 'और देखो, झाड़ी में से एक आवाज़ मेरी ओर आई और बोली, “एज्रा, एज्रा!” मैंने कहा, “प्रभु, मैं यहाँ हूँ।” तब मैं अपने पैरों पर खड़ा हो गया, और उसने मुझसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: वर्णन में अचानक घटित दृश्य की ओर ध्यान खींचने वाले लैटिन संकेत को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: uox exiuit contra me de rubo
  choice: झाड़ी में से एक आवाज़ मेरी ओर आई
  rationale: de rubo के स्रोत-बोध और contra me के दिशा-बोध को स्पष्ट रखते हुए हिन्दी में अस्वाभाविक शाब्दिकता से बचता है।
- source_word: ecce ego
  choice: मैं यहाँ हूँ
  rationale: बुलावे के उत्तर का स्वाभाविक हिन्दी मुहावरा है और उपस्थित होकर उत्तर देने का भाव व्यक्त करता है।
- source_word: surrexi super pedes meos
  choice: मैं अपने पैरों पर खड़ा हो गया
  rationale: लैटिन अभिव्यक्ति को निकटता से रखते हुए सहज आधुनिक हिन्दी देता है।
theological_decisions:
- issue: आवाज़ बोलने वाले की पहचान
  choice: अंत में सर्वनाम “उसने” रखा गया
  alternative: “आवाज़ ने” या “प्रभु ने”
  rationale: लैटिन et dixit ad me में कर्ता निहित है; “उसने” पिछले बोलने वाले की ओर संकेत करता है और उसे स्पष्ट रूप से प्रभु ठहराकर स्रोत की अंतर्निहितता से आगे नहीं जाता।
- issue: domine का संबोधन
  choice: “प्रभु”
  alternative: “हे प्रभु” या “स्वामी”
  rationale: ईश्वर-संबोधन की संभावित धार्मिक गंभीरता बनाए रखता है, जबकि “प्रभु, मैं यहाँ हूँ” आधुनिक हिन्दी में स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। दोहराए गए नाम और अगले कथन की भूमिका बताने वाला अंतिम द्विबिंदु सुरक्षित रखा गया है।
