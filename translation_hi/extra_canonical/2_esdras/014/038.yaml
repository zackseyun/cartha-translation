  text: and behold[a], a voice called me, saying, “Ezra, open your mouth and drink what I am giving you.” And I opened my mouth, and behold, a full cup
translation:
  language: hi
  text: और देखो[a], एक आवाज़ ने मुझे पुकारा और कहा, “एज्रा, अपना मुँह खोलो और जो मैं तुम्हें पीने को दे रहा हूँ, उसे पी लो।” और मैंने अपना मुँह खोला, और देखो, एक भरा हुआ प्याला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अगले दिन ऐसा हुआ कि, देखो, एक आवाज़ ने मुझे पुकारा और कहा, ‘एज्रा, अपना मुँह खोलो और जो मैं तुम्हें पीने को देता हूँ, उसे पी लो।’ और मैंने अपना मुँह खोला, और देखो, एक भरा हुआ प्याला मेरी ओर बढ़ाया गया।”
    reason: पूर्ववर्ती, पद-सीमा से विस्तृत अनुवाद को दर्ज करने वाला अंग्रेज़ी POB audit-trail नोट; वर्तमान मुख्य पाठ दिए गए लैटिन पदांश की सीमाओं का पालन करता है।
lexical_decisions:
- source_word: uox uocauit me
  choice: एक आवाज़ ने मुझे पुकारकर कहा
  rationale: लातीनी अभिव्यक्ति में आवाज़ के पुकारने और फिर कहने, दोनों को सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: bibe quod te potiono
  choice: जो मैं तुम्हें पिला रहा हूँ, उसे पी लो
  rationale: potiono का कारक अर्थ ‘पिलाना’ है; वर्तमानकालिक क्रिया को स्वाभाविक हिन्दी में प्रगतिशील रूप दिया गया है।
- source_word: calix plenus
  choice: एक भरा हुआ प्याला
  rationale: calix के लिए प्रसंगानुकूल ‘प्याला’ और plenus के लिए ‘भरा हुआ’ चुना गया; स्रोत की अपूर्ण अंतिम पदावली को पूरा करने हेतु कोई क्रिया नहीं जोड़ी गई।
theological_decisions:
- issue: पिलाने वाले की पहचान
  choice: कर्ता को ‘मैं’ ही रखा गया
  alternative: ‘परमेश्वर’ या ‘स्वर्गदूत’ स्पष्ट करना
  rationale: लातीनी स्रोत वक्ता की पहचान इस पद में स्पष्ट नहीं करता; इसलिए व्याख्यात्मक पहचान नहीं जोड़ी गई।
- issue: अंतिम वाक्यांश की अपूर्णता
  choice: ‘एक भरा हुआ प्याला’ पर पद को अपूर्ण ही छोड़ा गया
  alternative: ‘मेरी ओर बढ़ाया गया’ जैसी क्रिया जोड़ना
  rationale: दिया गया स्रोत इसी संज्ञा-वाक्यांश पर समाप्त होता है; क्रिया अगले पद के पाठ से आती है और यहाँ जोड़ना पद-सीमा का उल्लंघन होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ ने ecce की कथात्मक आकस्मिकता सुरक्षित रखी है। स्रोत के असामान्य, अपूर्ण अंत को जानबूझकर नहीं सँवारा गया।
