translation:
  language: hi
  text: जैसा तूने मुझे आज्ञा दी है, वैसा ही मैं करूँगा, और इस समय जीवित लोगों को फटकारूँगा, जो
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sicut praecepisti mihi
  choice: जैसा तूने मुझे आज्ञा दी है, वैसा ही मैं करूँगा
  rationale: लैटिन अंश शाब्दिक रूप से ‘जैसा तूने मुझे आज्ञा दी’ है; प्रसंग और वाक्य की स्वाभाविक हिन्दी में निहित क्रिया को ‘वैसा ही मैं करूँगा’ से व्यक्त किया गया है।
- source_word: corripiam
  choice: समझाऊँगा
  rationale: इस क्रिया में सुधार के उद्देश्य से डाँटने, चेताने या ताड़ना देने का भाव है। ‘समझाऊँगा’ सामान्य पाठक के लिए स्वाभाविक है और सुधारात्मक आशय रखता है।
- source_word: praesentem populum
  choice: इस समय जीवित लोगों को
  rationale: अगली पंक्ति में बाद में जन्म लेने वालों से विरोध होने के कारण praesens का आशय स्थानिक उपस्थिति नहीं, वर्तमान जीवित पीढ़ी है।
- source_word: qui
  choice: जो
  rationale: स्रोत-पाठ इसी संबंधवाचक सर्वनाम पर अधूरा समाप्त होता है; अगले पद से वाक्य जुड़ने की संरचना सुरक्षित रखी गई है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर को संबोधन के प्रसंग के अनुरूप एकवचन ‘तू’ रखा गया है। उपलब्ध लैटिन अंश में अंग्रेज़ी पाठ का आरंभिक ‘Behold’ नहीं है, इसलिए उसे नहीं जोड़ा गया। पद के अंत का ‘जो’ जानबूझकर रखा गया है, क्योंकि स्रोत-पाठ अगले पद में जारी रहता है।
