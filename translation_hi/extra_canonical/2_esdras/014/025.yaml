  text: these five, because they are ready to write quickly. And you shall come here, and I will kindle in your heart a lamp of understanding that will not be extinguished until the things that you begin to write are finished.
translation:
  language: hi
  text: इन पाँचों को ले आना, क्योंकि ये तेज़ी से लिखने के लिए तैयार हैं। फिर तुम यहाँ आना, और मैं तुम्हारे हृदय में समझ का एक दीपक जलाऊँगा, जो तब तक नहीं बुझेगा, जब तक वे बातें पूरी न हो जाएँ जिन्हें तुम लिखना आरम्भ करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hos
  choice: इन पाँचों को
  rationale: लातीनी सर्वनाम का आशय पिछले संदर्भ में बताए गए पाँच व्यक्तियों से है; स्पष्टता के लिए संख्या को बनाए रखा गया है।
- source_word: scribendum uelociter
  choice: तेज़ी से लिखने के लिए
  rationale: क्रियावाचक रूप और क्रिया-विशेषण का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: accendam in corde tuo lucernam intellectus
  choice: तुम्हारे हृदय में समझ का एक दीपक जलाऊँगा
  rationale: मूल रूपक, उसके आंतरिक स्थान और बोध-संबंधी अर्थ को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: quoadusque finiantur
  choice: तब तक नहीं बुझेगा, जब तक ... पूरी न हो जाएँ
  rationale: समय-सीमा और कर्मवाच्य भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: quae incipies scribere
  choice: जिन्हें तुम लिखना आरम्भ करोगे
  rationale: भविष्यकाल और लेखन आरम्भ करने की क्रिया दोनों को निकटता से सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘समझ का दीपक’ रूपक की व्याख्या
  choice: रूपक को यथावत रखा गया
  alternative: इसे ‘अलौकिक ज्ञान’ या ‘प्रेरणा’ कहकर स्पष्ट करना
  rationale: मूल पाठ केवल lucerna intellectus कहता है; किसी विशेष प्रेरणा-सिद्धांत को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘हृदय’ और ‘दीपक’ मूल के साहित्यिक-बाइबिलीय रूपक को बनाए रखते हैं। आरम्भिक आदेश में संदर्भगत क्रिया ‘ले आना’ जोड़ी गई है, क्योंकि उपलब्ध अंश ‘इन पाँचों को’ से शुरू होता है और वाक्य का शासक क्रियापद पूर्ववर्ती संदर्भ में निहित है।
