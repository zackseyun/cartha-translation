translation:
  language: hi
  text: इन समयों से चले जाने में देर न कर; क्योंकि जो बातें तूने अभी देखी हैं
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festina
  choice: जल्दी कर
  rationale: लातीनी आज्ञार्थक क्रिया की तात्कालिकता को सहज और सीधे ढंग से व्यक्त करता है।
- source_word: transmigrare
  choice: निकल जाने
  rationale: संदर्भ में वर्तमान युग/समयों से प्रस्थान का भाव है; ‘निकल जाना’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को बनाए रखता है।
- source_word: a temporibus his
  choice: इन समयों से
  rationale: बहुवचन temporibus और संकेतवाचक his का निकट, औपचारिक रूप से अनुरूप अनुवाद।
- source_word: Quae enim uidisti nunc
  choice: क्योंकि जो बातें तूने अभी देखी हैं
  rationale: अपूर्ण संबंधवाचक उपवाक्य को उसी तरह खुला रखा गया है, क्योंकि उसका विधेय अगले पद में आता है; ‘बातें’ quae के नपुंसकलिंग बहुवचन को स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: ‘इन समयों से’ प्रस्थान का अर्थ
  choice: रूपक या शाब्दिक अर्थ को अनिर्णीत रखते हुए ‘निकल जाने’ का प्रयोग
  alternative: ‘इस युग से विदा होने’
  rationale: मूल transmigrare तथा temporibus his में मृत्यु, स्थानांतरण या वर्तमान काल-व्यवस्था से प्रस्थान की संभावित अर्थ-छायाएँ हैं; अधिक व्याख्यात्मक अनुवाद अनावश्यक रूप से इन्हें सीमित करता।
- issue: पद के अंत में अपूर्ण वाक्य
  choice: ‘जो बातें तूने अभी देखी हैं’ पर उपवाक्य खुला छोड़ना
  alternative: अगले पद से ‘बुराइयाँ’ और ‘घटित होना’ जोड़कर वाक्य पूरा करना
  rationale: दिए गए लातीनी पद में केवल Quae enim uidisti nunc है। अगले पद के शब्द यहाँ लाने से पद-सीमा और स्रोत-साक्ष्य का उल्लंघन होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी। संबोधन के लिए ‘तू’ रखा गया है, जो एकवचन आज्ञार्थक festina के अनुरूप बाइबिलीय प्रत्यक्ष संबोधन को व्यक्त करता है। अर्धविराम मूल में जुड़े हुए खंडों और अगले पद तक जारी रहने वाले वाक्य को दर्शाता है।
