  verdict: revise
  source_fidelity: The draft accurately reflects the main Latin clauses, including the explanatory enim ("क्योंकि") and the unfinished final phrase. However, Latin future indicatives facies and trades are better represented by Hindi future forms than by infinitival/imperatival "करना ... सौंप देना." The connective Et before profectus sum is "और," not specifically temporal "तब."
  naturalness: The revised future forms are natural in a solemn modern Hindi instruction. "बुद्धिमानों" is understandable and suitably formal. The final "सभी को" intentionally remains syntactically open in accordance with the truncated source.
  terminology: '"सार्वजनिक," "गुप्त रूप से," and "बुद्धिमानों" preserve the source’s distinctions without identifying the unspecified items or defining the wise as a particular religious group.'
  issues:
  - severity: medium
    issue: Future verbs rendered as infinitival commands
    rationale: Facies and trades are future indicatives, coordinated with incipies. Hindi "सार्वजनिक करोगे ... सौंप दोगे" retains this grammatical and discourse-level parallelism more closely than "करना ... सौंप देना."
  - severity: low
    issue: Et rendered as "तब"
    rationale: The Latin simply coordinates the narrative continuation (Et profectus sum); "और" is the more direct equivalent. The temporal inference is possible but not expressed by the conjunction itself.
