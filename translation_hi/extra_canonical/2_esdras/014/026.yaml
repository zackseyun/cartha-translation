lexical_decisions:
- source_word: palam facies
  choice: सार्वजनिक करना
  rationale: लैटिन का अर्थ है कुछ सामग्री को खुले रूप में सबके सामने उपलब्ध कराना; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: sapientibus
  choice: बुद्धिमानों को
  rationale: यह dative plural का सीधा और गरिमापूर्ण अनुवाद है।
- source_word: absconse trades
  choice: गुप्त रूप से ... सौंप देना
  rationale: absconse गोपनीय ढंग को और trades सुपुर्द करने के भाव को व्यक्त करता है।
- source_word: in crastinum enim hac hora
  choice: क्योंकि कल इसी समय
  rationale: enim के व्याख्यात्मक संबंध और hac hora के निश्चित समय-संकेत, दोनों को बनाए रखता है।
- source_word: incipies scribere
  choice: लिखना आरम्भ करोगे
  rationale: आरम्भसूचक लैटिन क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: congregaui omnem
  choice: मैंने सभी को इकट्ठा किया
  rationale: उपलब्ध अंश यहीं अधूरा समाप्त होता है; omnem के आशय को अगले पद से पूरा किए बिना हिन्दी में भी वाक्य को जानबूझकर खुला रखा गया है।
theological_decisions:
- issue: सार्वजनिक और गुप्त लेखों का भेद
  choice: कुछ बातें सार्वजनिक, कुछ गुप्त रूप से बुद्धिमानों को सौंपना
  alternative: गुप्त पुस्तकों या किसी निश्चित धार्मिक वर्ग का स्पष्ट उल्लेख
  rationale: स्रोत केवल quaedam और sapientibus कहता है; सामग्री अथवा समूह की पहचान को अधिक निश्चित करना स्रोत से आगे जाना होता।
- issue: अंतिम अधूरी पद-सीमा
  choice: ‘सभी को’ पर अंश को अधूरा रहने देना
  alternative: अगले पद से अनुमान लगाकर कर्म को पूरा करना
  rationale: दिए गए लैटिन स्रोत का अंतिम वाक्य अधूरा है; अनुवाद में अगले पद की सामग्री आयात नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। आज्ञार्थक संरचना में ‘करना/सौंप देना’ का प्रयोग स्वाभाविक मौखिक निर्देश के रूप में किया गया है। उद्धरण स्रोत के भाषण-समापन पर बंद होता है; अंतिम वाक्य दिए गए स्रोत की तरह अगले पद में जारी रहने के लिए खुला है।
