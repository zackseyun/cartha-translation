  text: Quoniam saeculum perdidit iuuentutem suam, et tempora adpropinquant senescere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/010.yaml
  text: For the age has lost its youth, and the times are drawing near to old age.
translation:
  language: hi
  text: क्योंकि युग ने अपनी जवानी खो दी है, और समय वृद्ध होने के निकट आ रहे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: यह युग
  rationale: यहाँ शब्द वर्तमान विश्व-युग या काल को व्यक्त करता है; ‘यह युग’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: iuuentutem
  choice: जवानी
  rationale: युग के जीवन-चक्र का मानवीकरण बनाए रखने के लिए सीधा और सहज शब्द चुना गया है।
- source_word: tempora
  choice: समय
  rationale: लैटिन बहुवचन को हिन्दी में सामूहिक अर्थ वाले स्वाभाविक रूप ‘समय’ से व्यक्त किया गया है।
- source_word: adpropinquant senescere
  choice: बुढ़ापे के निकट आ रहे हैं
  rationale: यह अभिव्यक्ति मूल के वृद्ध होने की ओर बढ़ने वाले रूपक को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखती है।
theological_decisions:
- issue: युग और समयों का मानवीकरण
  choice: जवानी खोने और बुढ़ापे के निकट आने की मूल रूपकात्मक भाषा बनाए रखी गई।
  alternative: अंत के निकट आने के रूप में अर्थ स्पष्ट करना
  rationale: मूल पाठ सीधे ‘अंत’ नहीं कहता, इसलिए उसकी युग-वृद्धावस्था संबंधी छवि और संभावित अर्थगत तनाव को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी; मूल लैटिन की समानांतर संरचना और मानवीकरण सुरक्षित रखा गया है।
