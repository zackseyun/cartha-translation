  text: the inheritance in the land of Zion, and you and your fathers committed iniquity and did not keep the ways that the Most High commanded you; the Righteous One
translation:
  language: hi
  text: सिय्योन की भूमि में भाग; और तुमने और तुम्हारे पितरों ने अधर्म किया और उन मार्गों का पालन नहीं किया, जिनका पालन करने की आज्ञा परमप्रधान ने तुम्हें दी थी; धर्मी[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी स्रोत यहाँ केवल ‘धर्मी’ (Iustus) पर समाप्त होता है। यह पुल्लिंग एकवचन रूप है, पर उपलब्ध पाठ में इससे जुड़ी संज्ञा या आगे का वाक्य नहीं है; इसलिए इसका आशय पूरा नहीं किया गया है।
    reason: अंतिम अपूर्ण शब्द की व्याकरणिक स्थिति और पाठीय अपूर्णता स्पष्ट करना, बिना उसके संदर्भ या कर्ता को निश्चित किए।
lexical_decisions:
- source_word: sortem
  choice: मिला भाग
  rationale: लातीनी ‘sortem’ किसी को बाँटे या ठहराए गए हिस्से को दर्शाता है। ‘मिला भाग’ मूल के अर्थ को सहज हिन्दी में व्यक्त करता है और पद के आरम्भ की खंडित वाक्य-रचना को अनावश्यक रूप से पूरा नहीं करता।
- source_word: iniquitatem fecistis
  choice: अधर्म किया
  rationale: यह मुहावरा नैतिक और धार्मिक दोष करने को व्यक्त करता है; ‘अधर्म किया’ संक्षिप्त, गरिमापूर्ण और स्रोत के निकट है।
- source_word: non seruastis uias
  choice: उन मार्गों पर नहीं चले
  rationale: शाब्दिक ‘मार्गों को नहीं माना/सुरक्षित रखा’ की अपेक्षा हिन्दी में आज्ञापालन के अर्थ वाला स्वाभाविक बाइबिलीय प्रयोग चुना गया है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त सर्वोच्चता-सूचक उपाधि का प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: Iustus
  choice: धर्मी जन
  rationale: पुल्लिंग एकवचन कर्तृकारक विशेषण यहाँ संज्ञा की तरह भी समझा जा सकता है। ‘धर्मी जन’ उस रूप को बनाए रखता है, जबकि अगले लुप्त अंश के आधार पर ‘न्यायी’ या कोई पूरा वाक्य नहीं गढ़ता।
theological_decisions:
- issue: ‘Iustus’ किसके लिए प्रयुक्त है और वाक्य में उसकी भूमिका क्या है
  choice: इसे ‘धर्मी जन…’ के रूप में अधूरा रखा गया है
  alternative: ‘धर्मी परमेश्वर’ या ‘क्योंकि वह धर्मी न्यायी है’
  rationale: उपलब्ध लातीनी पाठ केवल ‘Iustus’ पर समाप्त होता है। संदर्भतः यह परमप्रधान की ओर संकेत कर सकता है, पर स्रोत में संज्ञा और शेष कथन अनुपस्थित हैं; इसलिए पहचान और वाक्यार्थ को चुपचाप पूरा नहीं किया गया।
- issue: ‘sortem’ को विरासत या बाँटे गए भाग के रूप में प्रस्तुत करना
  choice: ‘मिला भाग’
  alternative: ‘विरासत’
  rationale: ‘विरासत’ अंग्रेज़ी परामर्श-पाठ के अनुरूप है, पर लातीनी ‘sors/sortem’ का प्रत्यक्ष भाव बाँटे या नियत किए गए हिस्से का है। चुना हुआ रूप वंशगत उत्तराधिकार का अतिरिक्त अर्थ आरोपित करने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठकों के लिए स्पष्ट किंतु गरिमापूर्ण। आरम्भ और अन्त में स्रोत की खंडित संरचना को बनाए रखा गया है; विरामचिह्न केवल पठनीयता के लिए हैं।
