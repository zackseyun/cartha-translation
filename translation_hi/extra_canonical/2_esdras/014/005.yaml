  text: And I told him many wonders, and I showed him the secrets of the times and the end of the times, and I commanded him, saying,
translation:
  language: hi
  text: 'और मैंने उसे बहुत-सी अद्भुत बातें बताईं, और उसे समयों के रहस्य और समयों का अंत दिखाया, और उसे यह आज्ञा दी:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mirabilia multa
  choice: बहुत-से अद्भुत काम
  rationale: लातीनी पद का अर्थ अनेक आश्चर्यजनक या विस्मयकारी कृत्य/बातें है; ‘अद्भुत काम’ स्वाभाविक हिन्दी में इस व्यापकता को बनाए रखता है।
- source_word: temporum secreta
  choice: समयों के रहस्य
  rationale: बहुवचन temporum को बनाए रखा गया है और secreta के लिए ‘रहस्य’ मूल की गूढ़ता को स्पष्ट रूप से व्यक्त करता है।
- source_word: temporum finem
  choice: समयों का अंत
  rationale: मूल में फिर से बहुवचन temporum है; इसलिए एकवचन ‘समय का अंत’ के बजाय शाब्दिक तनाव और समानांतरता सुरक्षित रखी गई है।
- source_word: praecepi ei dicens
  choice: 'फिर मैंने उसे यह आज्ञा दी:'
  rationale: लातीनी कथन-सूत्र का स्वाभाविक हिन्दी रूप; द्विबिंदु आगे आने वाली आज्ञा का संकेत देता है और अनावश्यक ‘कहते हुए’ से बचता है।
