source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nunc ergo dispone domum tuam, et corripe populum tuum, et consolare humiles eorum, et renuntia iam corruptae uitae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/013.yaml
  text: Therefore now set your house in order[a], and reprove your people, and comfort their humble ones, and renounce the corruptible life now.
translation:
  language: hi
  text: इसलिए अब अपने घर की व्यवस्था कर, अपनी प्रजा को डाँटकर सुधार, उनमें जो दीन हैं उन्हें सांत्वना दे, और इस नाशवान जीवन[a] को अब त्याग दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भ्रष्ट जीवन।”
    reason: लैटिन corruptae का अर्थ क्षय अथवा नाश के अधीन होने के साथ नैतिक भ्रष्टता भी हो सकता है।
lexical_decisions:
- source_word: dispone domum tuam
  choice: अपने घर की व्यवस्था कर
  rationale: यह मुहावरे का स्वाभाविक हिन्दी रूप है और घर अथवा घराने के मामलों को व्यवस्थित करने का आशय खुला रखता है।
- source_word: corripe populum tuum
  choice: अपनी प्रजा को डाँटकर सुधार
  rationale: corripe में फटकारने और सुधारने दोनों का भाव हो सकता है; संयुक्त अभिव्यक्ति केवल कठोर डाँट या केवल सामान्य सुधार तक अर्थ को सीमित नहीं करती।
- source_word: humiles eorum
  choice: उनमें जो दीन हैं
  rationale: शाब्दिक ‘उनके दीन जन’ की तुलना में यह आधुनिक हिन्दी में अधिक स्वाभाविक है और eorum का संबंध प्रजा के लोगों से स्पष्ट करता है।
- source_word: corruptae uitae
  choice: नाशवान जीवन
  rationale: निकटवर्ती संदर्भ में मृत्युशीलता और क्षयशील मानवीय दशा प्रमुख है; ‘नाशवान’ उस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि नैतिक भ्रष्टता की संभावित छाया पादटिप्पणी में सुरक्षित है।
- source_word: renuntia
  choice: त्याग दे
  rationale: यह दत्तिवाचक प्रयोग में किसी वस्तु से नाता तोड़ने अथवा उसे छोड़ देने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: corruptae uitae का आशय नैतिक भ्रष्टता है या मृत्यु और क्षय के अधीन जीवन
  choice: मुख्य पाठ में ‘नाशवान जीवन’
  alternative: ‘भ्रष्ट जीवन’
  rationale: अगले पद के मृत्युशील विचारों, मानवीय बोझों और दुर्बल प्रकृति वाले संदर्भ के कारण क्षयशीलता मुख्य आशय जान पड़ती है; फिर भी लैटिन corruptae नैतिक भ्रष्टता भी जता सकता है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध एकवचन आज्ञार्थक संबोधन अपनाया गया है। प्रारंभिक Nunc और अंतिम iam की पुनरावृत्ति को दोनों स्थानों पर ‘अब’ रखकर सुरक्षित किया गया है।
