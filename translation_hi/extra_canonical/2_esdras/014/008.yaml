  text: The signs that I have shown[a], and the dreams that you have seen, and the interpretations that you have heard—store them up in your heart.
translation:
  language: hi
  text: जो चिन्ह मैंने तुम्हें दिखाए हैं, और जो स्वप्न तुमने देखे हैं, और जो व्याख्याएँ तुमने सुनी हैं—उन्हें अपने हृदय में सँजोकर रखो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Signa
  choice: चिन्ह
  rationale: यह दृश्य संकेतों अथवा अलौकिक निशानियों के लिए स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: interpretationes
  choice: अर्थ
  rationale: स्वप्नों और दर्शनों के समझाए हुए अभिप्राय के लिए सामान्य पाठक को सहज समझ आने वाला शब्द; यहाँ बहुवचन का आशय समन्वित वाक्य में बना रहता है।
- source_word: in corde tuo repone ea
  choice: उन्हें अपने हृदय में सँजोकर रखो
  rationale: लातीनी आदेश का भाव केवल स्मरण करने का नहीं, भीतर सुरक्षित रखने का है; वस्तुओं को पहले रखकर बाद में ‘उन्हें’ कहना मूल की पुनरुक्त-सर्वनाम वाली वाक्यरचना भी बचाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण शैली अपनाई गई है। तीन कर्म-पदों को आदेश से पहले रखकर मूल लातीनी की विषय-प्रमुख, क्रमिक वाक्यरचना और बल को सुरक्षित रखा गया है।
