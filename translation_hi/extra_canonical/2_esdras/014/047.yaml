id: 2ES.14.47
reference: 2 Esdras 14:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tradas eos sapientibus de populo tuo; In his enim est uena intellectus et sapientiae fons et scientiae flumen.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/047.yaml
  text: you may hand them over to the wise among your people. For in them is the vein of understanding[a], the fountain of wisdom, and the river of knowledge.”
translation:
  language: hi
  text: तुम उन्हें अपने लोगों में से बुद्धिमानों को सौंप देना; क्योंकि उनमें समझ की शिरा[a], बुद्धि का सोता और ज्ञान की नदी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझ का स्रोत।”
    reason: लैटिन uena का मूल अर्थ ‘शिरा/नस’ है, पर रूपक में इसका अर्थ किसी वस्तु का स्रोत या भंडार भी हो सकता है।
lexical_decisions:
- source_word: tradas
  choice: सौंप देना
  rationale: यह आश्रित आज्ञार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंगगत ‘ताकि’ पिछले पद से जुड़ा है।
- source_word: sapientibus de populo tuo
  choice: अपने लोगों में से बुद्धिमानों को
  rationale: लैटिन de populo tuo के चयनात्मक अर्थ ‘अपने लोगों में से’ को स्पष्ट रूप से बनाए रखता है।
- source_word: uena intellectus
  choice: समझ की शिरा
  rationale: uena का मूल बिंब ‘शिरा/नस’ है। ‘शिरा’ ज्ञान-संपदा की भीतर बहती धारा या भंडार का रूपक बनाए रखता है और इसे fons से अलग करता है।
- source_word: sapientiae fons
  choice: बुद्धि का सोता
  rationale: fons के जल-स्रोत वाले बिंब को सहज हिन्दी में सुरक्षित रखता है।
- source_word: scientiae flumen
  choice: ज्ञान की नदी
  rationale: flumen का सीधा और स्वाभाविक रूपकात्मक अनुवाद है।
theological_decisions:
- issue: पुस्तकों के भीतर समझ, बुद्धि और ज्ञान होने का रूपक
  choice: ‘उनमें’ को पुस्तकों के संदर्भ में बनाए रखा गया और तीनों रूपक अलग रखे गए।
  alternative: भावार्थ के रूप में ‘उनसे समझ, बुद्धि और ज्ञान मिलता है’ कहना।
  rationale: मूल पाठ वस्तुओं के भीतर इन संपदाओं की उपस्थिति का सशक्त काव्यात्मक दावा करता है; इसे व्याख्यात्मक गद्य में समतल नहीं किया गया।
- issue: uena की अर्थगत अस्पष्टता
  choice: मुख्य पाठ में ‘शिरा’, पादटिप्पणी में ‘स्रोत’ की संभावना।
  alternative: मुख्य पाठ में केवल ‘स्रोत’।
  rationale: शाब्दिक बिंब को प्राथमिकता देते हुए अर्थगत विकल्प भी सुरक्षित रखा गया है; इससे vena और अगले fons का भेद बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक गद्य। ‘बुद्धिमानों’, ‘समझ’, ‘बुद्धि’ और ‘ज्ञान’ जैसे सामान्य शब्द रखे गए हैं। अर्धविराम मूल के खंड-विभाजन को दर्शाता है, और अंतिम उद्धरण-चिह्न उपलब्ध पाठ के अनुसार बनाए रखा गया है।
