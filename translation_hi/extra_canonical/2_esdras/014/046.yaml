  text: But keep the last seventy[a], so that you may hand them over to the wise among your people.
translation:
  language: hi
  text: परन्तु अन्तिम सत्तर पुस्तकों को सुरक्षित रखना[a], ताकि तुम उन्हें अपने लोगों में से बुद्धिमानों को सौंप सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन अन्तिम सत्तर पुस्तकों को एज्रा के लोगों में से बुद्धिमानों के लिए सुरक्षित रखे गए गूढ़ ज्ञान के रूप में प्रस्तुत किया गया है। गुप्त रहस्योद्घाटन के 4 एज्रा के चित्रण में यह रचना की एक प्रमुख विशेषता है।
    reason: compositional_layer
lexical_decisions:
- source_word: Nouissimos ... LXX
  choice: अन्तिम सत्तर पुस्तकें
  rationale: ‘Nouissimos’ का अर्थ क्रम में सबसे अन्तिम है; प्रसंग में ‘LXX’ उन सत्तर लिखी गई पुस्तकों को सूचित करता है, इसलिए स्वाभाविक हिन्दी में ‘पुस्तकें’ स्पष्ट किया गया है।
- source_word: conseruabis
  choice: सुरक्षित रखना
  rationale: भविष्य/आज्ञार्थक भाव वाले इस रूप को प्रसंगानुकूल निर्देश के रूप में रखा गया है; इसमें इन पुस्तकों को बचाकर अलग रखने का भाव बना रहता है।
- source_word: ut ... tradas prudentibus de populo tuo
  choice: ताकि तुम उन्हें अपने लोगों में से बुद्धिमानों को सौंप सको
  rationale: उपलब्ध लैटिन अंश ‘ut’ पर रुकता है; वाक्य की ज्ञात अगली धारा और परामर्श-पाठ के आधार पर उद्देश्य-वाचक अर्थ को सहज हिन्दी में पूरा किया गया है।
theological_decisions:
- issue: सत्तर पुस्तकों की सीमित उपलब्धता
  choice: ‘अपने लोगों में से बुद्धिमानों’ को सौंपना
  alternative: सभी लोगों को देना
  rationale: पद इन अन्तिम सत्तर पुस्तकों और पहले उल्लिखित सार्वजनिक पुस्तकों के बीच जानबूझकर भेद रखता है; अनुवाद उस गुप्त/सीमित प्रकाशन के तनाव को बनाए रखता है, उसका सिद्धान्तगत विस्तार नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। ‘अन्तिम सत्तर पुस्तकें’ प्रसंग से निहित संज्ञा को स्पष्ट करता है, जबकि [a] पद में ठीक उसी स्थान पर दिया गया है जहाँ इन पुस्तकों की विशेष स्थिति सामने आती है।
