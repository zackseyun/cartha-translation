  yaml_path: translation/extra_canonical/2_esdras/014/003.yaml
  text: I revealed myself in the bush[a], and I spoke to Moses when my people were serving in Egypt.
translation:
  language: hi
  text: मैंने झाड़ी के पास अपने आपको प्रकट किया[a] और मूसा से उस समय बात की, जब मेरी प्रजा मिस्र में दास बनाई हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में एक ही मूल-शब्द की पुनरुक्ति है; अर्थ यह भी हो सकता है, “मैंने अपने आपको स्पष्ट रूप से प्रकट किया।”
    reason: लैटिन Reuelans reuelatus sum की असामान्य पुनरुक्ति सम्भावित सेमिटिक बलाघात को सुरक्षित रखती है, जिसे हिन्दी मुख्य पाठ में हूबहू दोहराना अस्वाभाविक होगा।
lexical_decisions:
- source_word: Reuelans reuelatus sum
  choice: मैंने ... अपने आपको प्रकट किया
  rationale: लैटिन में एक ही मूल की पुनरुक्ति सम्भवतः सेमिटिक बलाघात को दर्शाती है। हिन्दी में कृत्रिम दोहराव या अनावश्यक ‘निश्चय ही’ जोड़ने के बजाय स्वाभाविक आत्मवाचक अभिव्यक्ति रखी गई; पाठगत बलाघात की सम्भावना पादटिप्पणी में बताई गई है।
- source_word: super rubum
  choice: झाड़ी में
  rationale: यह मूसा के सामने जलती झाड़ी में परमेश्वर के प्रकट होने का संकेत है। लैटिन super का शाब्दिक अर्थ ‘झाड़ी पर’ भी हो सकता है, पर प्रसंग में हिन्दी ‘झाड़ी में’ स्वाभाविक है।
- source_word: locutus sum Moysi
  choice: मूसा से ... बात की
  rationale: लैटिन में dative Moysi संबोधित व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘मूसा से बात की’ सहज और सटीक है।
- source_word: seruiebat in Aegypto
  choice: मिस्र में दासता कर रही थी
  rationale: servire का सामान्य अर्थ ‘सेवा करना’ है, पर मिस्र में इस्राएल की दशा के प्रसंग में इसका आशय अधीन होकर दासता करना है।
theological_decisions:
- issue: दोहरी क्रिया Reuelans reuelatus sum का बलाघात
  choice: मुख्य पाठ में स्वाभाविक ‘अपने आपको प्रकट किया’; पादटिप्पणी में बलाघात का संकेत
  alternative: ‘मैंने निश्चय ही अपने आपको प्रकट किया’
  rationale: मूल की पुनरुक्ति में बलाघात सम्भव है, किन्तु हिन्दी में ‘निश्चय ही’ कथन को विवादात्मक निश्चितता का रंग दे सकता है। पादटिप्पणी मूल की सम्भावित तीव्रता को सुरक्षित रखती है।
- issue: मिस्र में प्रजा की स्थिति
  choice: दासता कर रही थी
  alternative: सेवा कर रही थी
  rationale: निर्गमन-प्रसंग में serviebat सामान्य सेवा नहीं, बल्कि मिस्र के अधीन दासत्व को सूचित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘मेरी प्रजा’ और ‘दासता कर रही थी’ सामान्य पाठक के लिए स्पष्ट हैं।
