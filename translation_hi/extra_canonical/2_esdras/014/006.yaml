translation:
  language: hi
  text: तुम इन वचनों को सार्वजनिक करोगे, और इन्हें छिपाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Haec ... uerba
  choice: इन वचनों को
  rationale: ‘uerba’ का अर्थ यहाँ कहे या लिखे गए ‘वचन’ है; ‘इन’ से दोनों निर्देशों में उसी समूह की ओर संकेत बना रहता है।
- source_word: in palam facies
  choice: प्रकट करना
  rationale: लातीनी मुहावरे का आशय सार्वजनिक रूप से उपलब्ध या ज्ञात कराना है; ‘प्रकट करना’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: abscondes
  choice: छिपाकर रखना
  rationale: यह भविष्यकालीन आदेशात्मक कथन है और सामग्री को सार्वजनिक न करने का भाव देता है; ‘छिपाकर रखना’ स्थायी संरक्षण/गोपनीयता के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दोनों बार ‘haec’ का संभावित संदर्भ
  choice: दोनों खंडों में ‘इन’ रखा गया
  alternative: पहले ‘इन वचनों’ और दूसरे में ‘उन वचनों’ कहना
  rationale: लातीनी पाठ दोनों बार समान संकेतवाचक ‘haec’ रखता है। पद स्वयं यह स्पष्ट नहीं करता कि वचनों के कौन-से अलग समूह अभिप्रेत हैं, इसलिए अनुवाद ने संदर्भगत अस्पष्टता को नहीं सुलझाया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल मानक हिन्दी। ‘करना/रखना’ की रचना भविष्यकाल में व्यक्त आदेश या निर्देश के लातीनी भाव को स्वाभाविक हिन्दी में बनाए रखती है।
