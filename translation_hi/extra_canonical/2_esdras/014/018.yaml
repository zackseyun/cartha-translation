  text: तब मैंने तेरे सामने उत्तर दिया और कहा, “हे प्रभु, देख, मैं जाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram te
  choice: तेरे सामने
  rationale: यह लातीनी पदबंध का सीधा और स्वाभाविक अर्थ है तथा उत्तर देने की स्थिति को स्पष्ट रखता है।
- source_word: Ecce
  choice: देख
  rationale: वक्ता के अगले कथन पर ध्यान खींचने वाले उद्गार को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: enim
  choice: अवश्य
  rationale: यहाँ enim सामान्य कारणसूचक ‘क्योंकि’ की अपेक्षा कथन को पुष्ट करने वाला बलसूचक प्रतीत होता है; ‘अवश्य’ हिन्दी में उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: abibo
  choice: मैं ... जाऊँगा
  rationale: भविष्यकालीन प्रथम पुरुष क्रिया का सीधा अर्थ सुरक्षित रखा गया है; प्रसंग से अधिक विशिष्ट गंतव्य या आशय नहीं जोड़ा गया।
