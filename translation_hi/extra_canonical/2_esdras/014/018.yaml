  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। परमेश्वर के लिए ‘तेरे’ का प्रयोग निकट और पारंपरिक एकवचन संबोधन बनाए रखता है। लातीनी ‘उत्तर दिया और कहा’ की दोहरी अभिव्यक्ति स्रोत-संगति के लिए सुरक्षित रखी गई है।
