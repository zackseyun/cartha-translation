source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc uos hic estis, et fratres uestri introrsum uestrum sunt. Si ergo imperaueritis sensui uestro et erudieritis cor uestrum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/033.yaml
  text: Now you are here[a], and your brothers are within you. If, therefore, you will command your mind and instruct your heart,
translation:
  language: hi
  text: अब तुम यहाँ हो, और तुम्हारे भाई तुम्हारे भीतर हैं[a]। इसलिए यदि तुम अपनी बुद्धि को वश में रखोगे और अपने हृदय को शिक्षा दोगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे भाई तुमसे और भीतर की ओर हैं,” अर्थात देश के भीतरी भाग में। लातीनी वाक्यांश का अर्थ अनिश्चित है।
    reason: introrsum uestrum शाब्दिक रूप से ‘तुम्हारे भीतर’ हो सकता है, पर संदर्भ में भौगोलिक रूप से ‘तुमसे और भीतर की ओर’ भी समझा जा सकता है।
lexical_decisions:
- source_word: introrsum uestrum
  choice: तुम्हारे भीतर
  rationale: लातीनी पद का निकट अर्थ ‘तुम्हारे भीतर/अंदर की ओर’ है। संदर्भ में इसका भौगोलिक अर्थ ‘तुमसे और भीतर की ओर’ भी हो सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: imperaueritis sensui uestro
  choice: अपनी बुद्धि को वश में रखोगे
  rationale: imperare का अर्थ आज्ञा देना अथवा शासन करना है और sensus यहाँ मन-बुद्धि को दर्शाता है। ‘वश में रखना’ आधुनिक हिन्दी में इस आत्म-अनुशासन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: erudieritis cor uestrum
  choice: अपने हृदय को शिक्षा दोगे
  rationale: erudire का अर्थ सिखाना या प्रशिक्षित करना है। ‘हृदय को शिक्षा देना’ मूल रूपक और उसकी नैतिक-आध्यात्मिक व्यापकता को बनाए रखता है।
theological_decisions:
- issue: शर्तवाचक वाक्य का अपूर्ण रहना
  choice: पद का अंत अल्पविराम पर किया गया है
  alternative: अगले पद के परिणाम-वाक्य को इस पद में जोड़ना
  rationale: दिए गए लातीनी स्रोत में केवल शर्त है; उसका परिणाम अगले पद में आता है। अतः पद-सीमा को स्रोत के अनुसार सुरक्षित रखा गया है।
- issue: introrsum uestrum का संदिग्ध आशय
  choice: मुख्य पाठ में शाब्दिक अर्थ ‘तुम्हारे भीतर’
  alternative: ‘तुमसे और भीतर की ओर’ अर्थात देश के भीतरी भाग में
  rationale: लातीनी वाक्यांश असामान्य और बहुअर्थी है। मुख्य पाठ निकट शब्दार्थ रखता है और संभावित भौगोलिक अर्थ को पादटिप्पणी में स्पष्ट करता है, बिना तनाव को चुपचाप सुलझाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बुद्धि को वश में रखना’ और ‘हृदय को शिक्षा देना’ मूल के समानांतर नैतिक रूपकों को बनाए रखते हैं।
