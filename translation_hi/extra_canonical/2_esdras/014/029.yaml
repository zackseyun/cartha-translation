theological_decisions:
- issue: ‘जीवन की व्यवस्था’ में संबंध का प्रकार
  choice: जीवन की व्यवस्था
  alternative: जीवन देने वाली व्यवस्था
  rationale: लैटिन संबंधकारक की वास्तविक अस्पष्टता को बनाए रखा गया है और यह अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया कि व्यवस्था स्वयं जीवन प्रदान करती है।
- issue: दो संबंधवाचक उपवाक्यों का संबंध
  choice: ‘जिसका’ को दोहराकर दोनों उपवाक्य उसी व्यवस्था से जोड़े गए
