  yaml_path: translation/extra_canonical/2_esdras/014/030.yaml
  text: And you transgressed after them. And the land was given to you in the land of Zion[a], but both you and your fathers committed iniquity and did not keep the ways that the Most High commanded you.
translation:
  language: hi
  text: और उनके बाद तुमने भी अपराध किया। तुम्हें सिय्योन देश में भूमि दी गई, पर तुम और तुम्हारे पूर्वज—दोनों ने अधर्म किया और उन मार्गों का पालन नहीं किया जिनका पालन करने की आज्ञा परमप्रधान ने तुम्हें दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: transgressi estis
  choice: व्यवस्था का उल्लंघन किया
  rationale: लातीनी क्रिया का अर्थ सीमा या आदेश का उल्लंघन करना है; प्रसंग में यह परमप्रधान की आज्ञाओं के विरुद्ध जाने को दर्शाती है। हिंदी में कर्म को स्पष्ट करने के लिए ‘व्यवस्था का’ जोड़ा गया है।
- source_word: terra
  choice: भूमि / देश
  rationale: पहले प्रयोग में दी गई भूमि अभिप्रेत है, जबकि ‘terra Sion’ स्थानसूचक पद है; स्वाभाविक हिंदी के लिए क्रमशः ‘भूमि’ और ‘सिय्योन देश’ रखा गया है।
- source_word: et uos et patres uestri
  choice: तुम और तुम्हारे पुरखा—दोनों
  rationale: दोहरे लातीनी et की सहसंबंधी शक्ति को ‘दोनों’ से व्यक्त किया गया है, जिससे वर्तमान पीढ़ी और पुरखाओं की साझा दोषिता बनी रहती है।
- source_word: iniquitatem fecistis
  choice: अधर्म किया
  rationale: यह नैतिक और वाचा-संबंधी गलत आचरण का संक्षिप्त, गरिमापूर्ण हिंदी रूप है।
- source_word: non custodistis vias
  choice: उन मार्गों पर नहीं चले
  rationale: शाब्दिक ‘मार्गों की रक्षा नहीं की’ हिंदी में अस्वाभाविक होगा; बाइबिलीय मार्ग-रूपक को बनाए रखते हुए आशय स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: Altissimus
  choice: परमप्रधान
  rationale: ईश्वर के इस सर्वोच्चता-सूचक पद का प्रचलित और संप्रदाय-निरपेक्ष हिंदी रूप।
theological_decisions:
- issue: वर्तमान पीढ़ी और पुरखाओं की साझा दोषिता
  choice: ‘तुम और तुम्हारे पुरखा—दोनों’ कहकर दोनों समूहों पर दोष स्पष्ट रखा गया है।
  alternative: केवल ‘तुम और तुम्हारे पुरखाओं ने’
  rationale: लातीनी correlative et...et का बल बनाए रखना आवश्यक है; इससे किसी एक पीढ़ी का दोष कम नहीं होता।
- issue: ‘मार्गों’ का अर्थ
  choice: रूपक को बनाए रखते हुए ‘जिन पर चलने की आज्ञा’ कहा गया है।
  alternative: ‘जिन नियमों का पालन करने की आज्ञा’
  rationale: वैकल्पिक रूप अर्थ खोल देता, पर मूल का ‘मार्ग’ रूपक मिटा देता; वर्तमान रूप अर्थ और चित्रात्मक भाषा दोनों बचाता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पुरखा’, ‘अधर्म’ और ‘परमप्रधान’ जैसे परिचित बाइबिलीय शब्द प्रयुक्त हैं। उपलब्ध लातीनी उद्धरण अंतिम ‘in’ पर कटता है; शेष वाक्य के लिए साथ दिए गए परीक्षित अंग्रेज़ी परामर्श-पाठ और संशोधन-साक्ष्य का सावधानी से उपयोग किया गया है।
