lexical_decisions:
- source_word: populum
  choice: लोगों को
  rationale: लैटिन में यह कर्मकारक है और पहले से चले आ रहे, यहाँ अनुपस्थित क्रियापद से जुड़ा है; इसलिए खंडित वाक्य-विन्यास को बनाए रखा गया है।
- source_word: Audi, Israel
  choice: हे इस्राएल, ... सुन
