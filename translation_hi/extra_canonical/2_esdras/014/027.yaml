- source_word: uerba haec
  choice: ये वचन
  rationale: uerba के लिए धार्मिक संदर्भ में प्रचलित, किंतु सामान्य पाठक के लिए बोधगम्य ‘वचन’ चुना गया है।
- source_word: Peregrinantes pere-
  choice: परदेशी, परदेशी—
  rationale: उपलब्ध लैटिन पंक्ति के पूर्ण शब्द और फिर कटे हुए पुनरारंभ को अंग्रेज़ी परामर्श-पाठ के अनुरूप जानबूझकर अधूरा रखा गया है।
