translation:
  language: hi
  text: या वे बातें जो घटित होने वाली हैं। क्योंकि यदि मैंने तेरे सामने अनुग्रह पाया है, तो मुझ में पवित्र आत्मा भेज; और संसार[a] के आरम्भ से जो कुछ हुआ है और जो बातें तेरी व्यवस्था में लिखी थीं, वह सब मैं लिखूँगा, ताकि लोग मार्ग पा सकें और जो चाहें—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘युग में’।
    reason: लैटिन saeculum का अर्थ ‘संसार’ और ‘युग’ दोनों हो सकता है; ‘आरम्भ से’ के साथ यहाँ ‘संसार’ अधिक स्वाभाविक है।
lexical_decisions:
- source_word: incipient operari
  choice: घटित होने वाली हैं
  rationale: लैटिन पदबंध का आशय उन घटनाओं से है जो आगे होने वाली हैं; शाब्दिक ‘कार्य करना आरम्भ करेंगी’ हिन्दी में अस्वाभाविक होगा।
- source_word: inmitte in me spiritum sanctum
  choice: पवित्र आत्मा को मेरे भीतर भेज
  rationale: ‘in me’ की भीतर आने की दिशा को स्पष्ट रखा गया है और ‘spiritum sanctum’ का प्रचलित, गरिमापूर्ण हिन्दी रूप लिया गया है।
- source_word: in saeculo ab initio
  choice: संसार के आरम्भ से
  rationale: यहाँ ‘ab initio’ के साथ saeculum सृष्टि से अब तक के संसार और उसके इतिहास को सूचित करता है; फिर भी ‘युग’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: lege tua
  choice: तेरी व्यवस्था
  rationale: धार्मिक-साहित्यिक प्रसंग में lex के लिए ‘व्यवस्था’ स्वाभाविक है और केवल सामान्य ‘कानून’ से अधिक उपयुक्त है।
- source_word: semitam
  choice: मार्ग
  rationale: ‘पगडंडी’ का अत्यधिक मूर्त अर्थ लेने के बजाय यहाँ जीवन अथवा सत्य की राह के रूपक को सहज हिन्दी में रखा गया है।
theological_decisions:
- issue: spiritum sanctum का व्यक्तिवाचक या सामान्य अर्थ
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा/पवित्र आत्मिक सामर्थ्य को सामान्य संज्ञा की तरह लिखना
  rationale: प्रार्थना में परमेश्वर से भीतर भेजे जाने वाले ‘पवित्र आत्मा’ का उल्लेख है; प्रचलित धर्मग्रन्थीय पद रखा गया है, बिना अतिरिक्त त्रिएकवादी व्याख्या जोड़े।
- issue: saeculum का स्थानगत या कालगत अर्थ
  choice: संसार
  alternative: युग
  rationale: ‘आरम्भ से जो कुछ हुआ’ समस्त सृष्टि-इतिहास की ओर संकेत करता है; स्रोत की वैकल्पिक कालगत छाया पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सुबोध हिन्दी रखी गई है। परमेश्वर को संबोधन में निकटता और स्रोत के एकवचन को बनाए रखने के लिए ‘तेरी/तेरे’ रूप प्रयुक्त हैं। पद आरम्भ और अन्त दोनों ओर अधूरा है; अन्त का डैश अगले पद में वाक्य जारी रहने का संकेत देता है।
