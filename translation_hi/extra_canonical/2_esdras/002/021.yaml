source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: inridere noli, tutare mancum et caecum ad uisionem claritatis meae admitte, Senem et iuuenem intra muros tuos serua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/021.yaml
  text: Do not mock; shelter the lame and the blind[a], admit them to the sight of my glory. Keep the old and the young within your walls.
translation:
  language: hi
  text: उपहास मत करो; विकलांग व्यक्ति की रक्षा करो और अंधे को मेरी महिमा के दर्शन के लिए प्रवेश दो। वृद्ध और युवा को अपनी दीवारों के भीतर सुरक्षित रखो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inridere noli
  choice: ठट्ठा मत करो
  rationale: लातीनी निषेध को सीधे और स्वाभाविक ढंग से व्यक्त करता है। इस पद में कर्म स्पष्ट नहीं है; इसलिए पिछले पद से ‘लंगड़े’ को बिना टिप्पणी के जोड़ने के बजाय मूल की संक्षिप्तता और अस्पष्टता रखी गई है।
- source_word: tutare mancum
  choice: अपंग की रक्षा करो
  rationale: mancus शारीरिक रूप से अंगहीन, विकलांग या अपंग व्यक्ति को सूचित कर सकता है; ‘अपंग’ आधुनिक हिन्दी में व्यापक और सहज है, जबकि tutare का आशय संरक्षण देना है।
- source_word: caecum ad uisionem claritatis meae admitte
  choice: अंधे को मेरी महिमा का दर्शन करने दो
  rationale: शाब्दिक संरचना ‘मेरी दीप्ति/महिमा के दर्शन में प्रवेश देना’ है। ‘महिमा का दर्शन करने दो’ हिन्दी में स्वाभाविक रहते हुए धार्मिक अर्थ को बनाए रखता है।
- source_word: Senem et iuuenem
  choice: वृद्ध और युवक
  rationale: दोनों आयु-वर्गों को एकवचन सामूहिक रूप में रखता है, जैसा लातीनी पाठ में है।
- source_word: intra muros tuos serua
  choice: अपनी शहरपनाह के भीतर सुरक्षित रखो
  rationale: muri नगर की रक्षात्मक दीवारें हैं; ‘शहरपनाह’ इस अर्थ को साधारण ‘दीवारों’ की अपेक्षा अधिक स्पष्ट करती है, और serua के संरक्षणार्थ को ‘सुरक्षित रखो’ व्यक्त करता है।
theological_decisions:
- issue: claritas का अनुवाद
  choice: महिमा
  alternative: तेज / दीप्ति
  rationale: बाइबिलीय लातीनी में claritas ईश्वरीय तेज और महिमा दोनों का बोध करा सकता है। ‘महिमा’ प्रसंग में स्वाभाविक है और दर्शन-संबंधी धार्मिक तनाव बनाए रखती है।
- issue: inridere noli का अनुल्लिखित कर्म
  choice: कर्म जोड़े बिना ‘ठट्ठा मत करो’
  alternative: ‘लंगड़े का ठट्ठा मत करो’
  rationale: प्रदत्त पद में क्रिया का कर्म नहीं है; संभवतः वह पिछले पद के claudum से ग्रहण होता है। मुख्य पाठ में किसी एक पाठ-विभाजन को निर्णायक रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और आदेशात्मक शैली। ‘शहरपनाह’ कुछ साहित्यिक है, पर नगर की रक्षात्मक दीवारों का सटीक और सुबोध बोध देता है।
