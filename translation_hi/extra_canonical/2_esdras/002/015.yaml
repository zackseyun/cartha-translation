source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Mater, complectere filios tuos, educa illos cum laetitia sicut columba, confirma pedes eorum, quoniam te elegi, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/015.yaml
  text: Mother, embrace your children; bring them up with gladness like a dove; strengthen their feet, for I have chosen you, says the Lord.
translation:
  language: hi
  text: हे माता, अपने बच्चों को गले लगा; कबूतरी की तरह आनंद से उनका पालन-पोषण कर; उनके पाँवों को मजबूत कर, क्योंकि मैंने तुझे चुना है, प्रभु कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater
  choice: हे माता
  rationale: प्रत्यक्ष सम्बोधन को स्पष्ट और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: complectere
  choice: गले लगा
  rationale: यह क्रिया स्नेहपूर्वक बाँहों में लेने का भाव व्यक्त करती है; ‘आलिंगन कर’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है।
- source_word: educa
  choice: पालन-पोषण कर
  rationale: सन्दर्भ में बच्चों को बड़ा करने और सँभालने का अर्थ है, जिसे यह प्रचलित हिन्दी पदबंध ठीक से व्यक्त करता है।
- source_word: cum laetitia
  choice: आनन्द के साथ
  rationale: लैटिन में रीति या भाव की संगति है; इसे बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: sicut columba
  choice: कबूतरी की तरह
  rationale: columba स्त्रीलिंग रूप है और मातृ-सम्बोधन के साथ उपमा स्त्री कबूतर की ओर संकेत करती है; इसलिए ‘कबूतरी’ चुना गया है।
- source_word: confirma pedes eorum
  choice: उनके पाँव दृढ़ कर
  rationale: मूल का शारीरिक रूपक ज्यों का त्यों रखा गया है; इसे ‘उन्हें स्थिर कर’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: te elegi
  choice: मैंने तुझे चुना है
  rationale: पूर्ण हुई क्रिया के वर्तमान परिणाम को स्वाभाविक हिन्दी पूर्णकाल से व्यक्त किया गया है।
theological_decisions:
- issue: ‘माता’ की पहचान
  choice: सम्बोधन को केवल ‘हे माता’ रखा गया है
  alternative: इसे किसी विशेष समुदाय, नगर या धार्मिक संस्था के रूप में स्पष्ट करना
  rationale: पद स्वयं माता की पहचान स्पष्ट नहीं करता; अतः सम्भावित सामुदायिक या प्रतीकात्मक अर्थ को अनिर्णीत रखा गया है।
- issue: ‘पाँव दृढ़ कर’ रूपक का अर्थ
  choice: मूल रूपक सुरक्षित रखा गया है
  alternative: ‘उन्हें विश्वास में स्थिर कर’ या ‘उन्हें सही मार्ग पर चला’
  rationale: ऐसी व्याख्याएँ सम्भव हो सकती हैं, पर लैटिन पाठ उनमें से किसी एक को स्पष्ट रूप से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक शैली। एकवचन स्त्रीलिंग सम्बोधन के अनुरूप ‘लगा’, ‘कर’ और ‘तुझे’ रखा गया है। ‘प्रभु कहता है’ ने लैटिन dicit dominus की शब्द-व्यवस्था और औपचारिक भविष्यवाणी-सूत्र का स्वर बनाए रखा है।
