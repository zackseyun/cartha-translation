  text: Filios tuos dormientes memorare, quoniam ego eos educam de
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/030.yaml
  text: Remember your sleeping children, for I will bring them out from the hidden places of the earth,
translation:
  language: hi
  text: अपने सोए हुए बच्चों को याद कर, क्योंकि मैं उन्हें धरती के छिपे हुए स्थानों से बाहर निकालूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कराए गए लैटिन पाठ का अंश de (‘से’) पर समाप्त हो जाता है; ‘धरती के छिपे हुए स्थानों’ का पूरक पाठ संरक्षित अंग्रेज़ी परामर्श-पाठ के आधार पर दिया गया है।
    reason: प्रदत्त मूल-भाषा साक्ष्य के भौतिक रूप से अपूर्ण होने और पूरक शब्दों के आधार को स्पष्ट करना।
lexical_decisions:
- source_word: Filios tuos
  choice: अपने ... बच्चों को
  rationale: लैटिन में संबोधित व्यक्ति के अपने पुत्रों/संतानों का उल्लेख है। प्रसंग में समावेशी और स्वाभाविक आधुनिक हिन्दी के लिए ‘बच्चों’ चुना गया।
- source_word: dormientes
  choice: सोए हुए
  rationale: वर्तमान कृदंत का सीधा अर्थ सुरक्षित रखा गया है; यह मृत्यु के रूपक की ओर संकेत कर सकता है, पर अनुवाद में उस अर्थ को स्पष्ट करके तनाव समाप्त नहीं किया गया।
- source_word: memorare
  choice: स्मरण रख
  rationale: आज्ञार्थक बल को एकवचन संबोधन में रखा गया; ‘स्मरण रख’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: quoniam
  choice: क्योंकि
  rationale: अगले कथन को आज्ञा का आधार बताने वाला कारणसूचक संबंध स्पष्ट करता है।
- source_word: ego eos educam
  choice: मैं उन्हें ... बाहर निकालूँगा
  rationale: ego के बल को ‘मैं’ से और educam की भविष्यकालीन, बाहर ले आने की क्रिया को ‘बाहर निकालूँगा’ से व्यक्त किया गया।
- source_word: de
  choice: से
  rationale: उपलब्ध लैटिन अंश इसी पूर्वसर्ग पर समाप्त होता है; उसके अपूर्ण पूरक को परामर्श-पाठ के आधार पर कोष्ठकीय पाठ के रूप में दिया गया है।
theological_decisions:
- issue: ‘सोए हुए’ का आशय
  choice: मृत्यु के संभावित रूपक को ‘सोए हुए’ ही रहने दिया गया
  alternative: ‘मरे हुए बच्चों’
  rationale: dormientes सचमुच ‘सोए हुए’ कहता है; इसे सीधे ‘मरे हुए’ करना स्रोत की रूपकीय अभिव्यक्ति और उसकी वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: उपलब्ध लैटिन स्रोत का अपूर्ण अंत
  choice: परामर्श-पाठ में प्रमाणित वाक्यांश को मुख्य पाठ में रखा और पादटिप्पणी से स्थिति बताई
  alternative: पद को केवल ‘से’ पर अधूरा छोड़ देना
  rationale: प्रदत्त लैटिन ‘de’ पर कट जाता है, जबकि अंग्रेज़ी परामर्श-पाठ ‘धरती के छिपे हुए स्थानों से’ संरक्षित करता है। पठनीय पद देने के साथ स्रोत-साक्ष्य की सीमा पारदर्शी रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज एकवचन संबोधन रखा गया है। ‘सोए हुए’ स्रोत की रूपकीय सम्भावना को बिना व्याख्यात्मक विस्तार के बचाता है।
