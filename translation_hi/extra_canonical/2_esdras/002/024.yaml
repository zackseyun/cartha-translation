  source_fidelity: The translation preserves the direct addresses, collective singular possessive in “मेरी प्रजा … तेरा विश्राम,” future force of veniet, and the maternal-care imagery of Nutrix bona, nutri. “उनके पैरों को दृढ़ कर” accurately retains the literal strengthening image reflected in the English audit trail, without interpretive expansion.
