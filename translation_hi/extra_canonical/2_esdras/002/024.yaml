  text: populus meus, quia ueniet requies tua. Nutrix bona, nutri
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/024.yaml
  text: My people, for your rest will come. Good nurse, nourish your children, and strengthen their feet.
translation:
  language: hi
  text: हे मेरी प्रजा, क्योंकि तेरा विश्राम आएगा। हे अच्छी धाय, अपने बच्चों का पालन-पोषण कर और उनके पैरों को दृढ़ कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populus meus
  choice: हे मेरी प्रजा
  rationale: सम्बोधन और सामूहिक एकवचन को बनाए रखते हुए यह स्वाभाविक तथा गरिमापूर्ण हिन्दी है।
- source_word: requies tua
  choice: तेरा विश्राम
  rationale: लैटिन के एकवचन अधिकारवाचक रूप और ‘विश्राम’ के व्यापक अर्थ को सुरक्षित रखा गया है।
- source_word: Nutrix bona
  choice: हे अच्छी धाय
  rationale: ‘धाय’ स्त्रीलिंग परिचारिका अथवा बच्चों का पालन करने वाली स्त्री को व्यक्त करता है और मूल के सीधे सम्बोधन को बनाए रखता है।
- source_word: nutri
  choice: पालन-पोषण कर
  rationale: यह केवल भोजन देने के बजाय देखभाल करके बढ़ाने के व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: confirma pedes illorum
  choice: उनके पैरों को दृढ़ कर
  rationale: अंग्रेज़ी परामर्श-पाठ में सुरक्षित शेष वाक्य के अनुरूप, शारीरिक बिंब को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
theological_decisions:
- issue: ‘विश्राम’ का आशय
  choice: विश्राम
  alternative: मुक्ति या अनन्त विश्राम
  rationale: मूल requies को किसी विशिष्ट परलोक-संबंधी या उद्धार-संबंधी व्याख्या तक सीमित नहीं किया गया।
- issue: ‘पैरों को दृढ़ करने’ का बिंब
  choice: शाब्दिक बिंब बनाए रखा
  alternative: उन्हें विश्वास में स्थिर कर
  rationale: मूल बिंब की सम्भावित रूपकात्मकता को पाठ में समझाकर उसकी अर्थ-सीमा संकुचित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा सम्बोधन रखा गया है। ‘धाय’ अपेक्षाकृत साहित्यिक है, पर nutrix के स्त्रीलिंग पालनकर्ता अर्थ को संक्षेप में सटीक रूप से व्यक्त करता है। उपलब्ध साफ किए गए लैटिन अंश का अंत nutri पर होता है; वाक्य का शेष भाग अंग्रेज़ी के परीक्षित परामर्श-पाठ में संरक्षित रूप के आधार पर प्रस्तुत है।
