source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: alii plorabunt et tristes erunt, tu autem hilaris et copiosa eris. Zelabunt gentes et nihil aduersus te poterunt, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/027.yaml
  text: Others will weep and be sorrowful[a], but you will be cheerful and abundant. The nations will be jealous, and they will be able to do nothing against you, says the Lord.
translation:
  language: hi
  text: दूसरे लोग रोएँगे और दुःखी होंगे, पर तू प्रसन्न और समृद्ध होगी। जातियाँ तुझसे ईर्ष्या करेंगी, और तेरे विरुद्ध कुछ न कर सकेंगी, प्रभु कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: alii
  choice: दूसरे लोग
  rationale: यह अनिश्चित बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है और आगे आने वाली ‘जातियाँ’ से इसे अनावश्यक रूप से एक नहीं मानता।
- source_word: hilaris
  choice: प्रसन्न
  rationale: लैटिन शब्द के हर्षित और आनंदित भाव को सहज, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: copiosa
  choice: समृद्ध
  rationale: स्त्रीलिंग संबोधन के संदर्भ में भरपूरी या प्रचुरता की अवस्था बताता है; ‘बहुतायत से भरी’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: Zelabunt
  choice: ईर्ष्या करेंगी
  rationale: यहाँ zelare का भाव दूसरे की समृद्धि देखकर डाह करना है; स्त्रीलिंग क्रिया ‘जातियाँ’ के अनुरूप है।
- source_word: nihil aduersus te poterunt
  choice: तेरे विरुद्ध कुछ न कर सकेंगी
  rationale: शाब्दिक अर्थ ‘तेरे विरुद्ध कुछ भी करने में समर्थ न होंगी’ को संक्षिप्त और स्वाभाविक रूप देता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन संबोधन की पहचान
  choice: ‘तू ... होगी’ के द्वारा स्त्रीलिंग सामूहिक संबोधन सुरक्षित रखा गया
  alternative: संबोधित सत्ता को स्पष्ट रूप से ‘सिय्योन’, ‘माता’ या ‘नगर’ कहना
  rationale: लैटिन में tu तथा स्त्रीलिंग hilaris/copiosa हैं, पर इस पद में संबोधित सत्ता का नाम नहीं दिया गया; इसलिए व्याख्यात्मक पहचान नहीं जोड़ी गई।
- issue: dicit dominus की वाक्य-स्थिति
  choice: ‘प्रभु कहता है’
  alternative: ‘यह प्रभु का वचन है’
  rationale: प्रत्यक्ष लैटिन कथन-रूप को बनाए रखता है और अधिक सूत्रबद्ध धार्मिक अभिव्यक्ति आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। मूल के स्त्रीलिंग एकवचन संबोधन के कारण ‘तू/होगी’ रखा गया है। अंग्रेज़ी परामर्श-पाठ की [a] टिप्पणी वर्तमान लैटिन पाठ की वास्तविक पाठगत भिन्नता नहीं, बल्कि पहले के अपूर्ण पद-विभाजन का अवशेष है; इसलिए हिन्दी मसौदे में पाद-टिप्पणी नहीं जोड़ी गई।
