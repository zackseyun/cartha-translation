  yaml_path: translation/extra_canonical/2_esdras/002/002.yaml
  text: The mother who bore them says to them, “Go, children, for I am a widow and forsaken.”
translation:
  language: hi
  text: वह माता जिसने उन्हें जन्म दिया, उनसे कहती है, “जाओ, बच्चो, क्योंकि मैं विधवा और परित्यक्त हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater, quae eos generauit
  choice: जिस माता ने उन्हें जन्म दिया
  rationale: लातीनी संबंधवाचक संरचना और मातृत्व के स्पष्ट अर्थ को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: ite, filii
  choice: जाओ, बच्चो
  rationale: बहुवचन आज्ञा और प्रत्यक्ष संबोधन को रखा गया है; स्रोत में स्वामित्वसूचक शब्द न होने के कारण ‘मेरे’ नहीं जोड़ा गया।
- source_word: uidua
  choice: विधवा
  rationale: लातीनी शब्द का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: derelicta
  choice: त्यागी हुई
  rationale: स्त्रीलिंग वक्ता के परित्यक्त होने की अवस्था को स्पष्ट करता है और ‘विधवा’ से अलग दूसरा भाव बनाए रखता है।
theological_decisions:
- issue: माता की पहचान
  choice: पद में केवल ‘माता’ रखा गया
  alternative: माता को किसी विशिष्ट समुदाय या प्रतीक के रूप में स्पष्ट करना
  rationale: इस पद में पहचान स्पष्ट नहीं की गई है; व्याख्यात्मक पहचान जोड़ने से स्रोत की अंतर्निहित अस्पष्टता मिट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बच्चो’ संबोधन का मानक सम्बोधन-रूप है; उद्धरण और स्त्रीलिंग क्रियारूप स्रोत के अनुरूप हैं।
