revisions:
- from: वे प्रभु के नाम के लिए साहस के साथ दृढ़ खड़े रहे। तब स्वर्गदूत ने मुझसे कहा, “जा, मेरी प्रजा को बता कि तूने प्रभु परमेश्वर के कैसे और कितने महान आश्चर्यकर्म देखे हैं।”
  to: वे प्रभु के नाम के लिए साहसपूर्वक दृढ़ रहे। तब स्वर्गदूत ने मुझसे कहा, “जा, मेरी प्रजा को उन अद्भुत कार्यों के विषय में बता जो तूने प्रभु परमेश्वर के देखे हैं—वे किस प्रकार के और कितने महान हैं।”
  rationale: The revision retains the verse's meaning and formal register while expressing qualia et quanta mirabilia as two parallel questions about the character and greatness of the wondrous works. It also avoids making mirabilia narrower than the Latin warrants.
