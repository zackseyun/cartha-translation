  yaml_path: translation/extra_canonical/2_esdras/002/048.yaml
  text: They stood boldly for the name of the Lord. Then the angel said to me[a], “Go, announce to my people what and how great are the wonders of the Lord God that you have seen.”
translation:
  language: hi
  text: वे प्रभु के नाम के लिए साहसपूर्वक दृढ़ रहे। तब स्वर्गदूत ने मुझसे कहा, “जा, मेरी प्रजा को उन अद्भुत कार्यों के विषय में बता जो तूने प्रभु परमेश्वर के देखे हैं—वे किस प्रकार के और कितने महान हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortiter ... steterunt
  choice: साहस के साथ दृढ़ खड़े रहे
  rationale: ‘fortiter’ के साहसपूर्ण भाव और ‘steterunt’ के अडिग खड़े रहने—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: pro nomine domini
  choice: प्रभु के नाम के लिए
  rationale: लातीनी ‘pro’ के पक्ष/हित में खड़े होने के भाव को जानबूझकर व्यापक रखता है।
- source_word: adnuntia
  choice: बता
  rationale: आज्ञार्थक ‘जा, ... बता’ आधुनिक हिन्दी में स्वाभाविक है और सार्वजनिक रूप से घोषित करने का आशय संदर्भ में व्यक्त करता है।
- source_word: qualia et quanta mirabilia
  choice: कैसे और कितने महान आश्चर्यकर्म
  rationale: ‘qualia’ और ‘quanta’ की समानांतर रचना को बनाए रखते हुए आश्चर्यकर्मों के प्रकार और महानता दोनों को व्यक्त करता है।
- source_word: domini dei
  choice: प्रभु परमेश्वर
  rationale: दोनों लातीनी पदों का पारंपरिक और स्पष्ट हिन्दी प्रतिरूप।
theological_decisions:
- issue: ‘प्रभु के नाम के लिए’ का आशय
  choice: प्रभु के नाम के लिए
  alternative: प्रभु के नाम की खातिर / प्रभु के नाम के पक्ष में
  rationale: मूल ‘pro nomine domini’ में कारण, निष्ठा अथवा पक्ष में खड़े होने की संभावनाएँ हैं; चुना हुआ पाठ इस व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- issue: ‘mirabilia’ का स्वरूप
  choice: आश्चर्यकर्म
  alternative: अद्भुत बातें / चमत्कार
  rationale: यह शब्द परमेश्वर के विस्मयकारी कार्यों को दर्शाता है; ‘आश्चर्यकर्म’ धार्मिक अर्थ को स्पष्ट करता है, बिना यह तय किए कि प्रत्येक घटना तकनीकी अर्थ में चमत्कार थी।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। एकवचन संबोधन में ‘जा/तूने’ रखा गया है, क्योंकि स्वर्गदूत सीधे दृष्टा से बात करता है। कोई पादटिप्पणी आवश्यक नहीं; अंग्रेज़ी में दिया गया पूर्व पादटिप्पणी-वाक्य वास्तव में मुख्य पाठ की वैकल्पिक शब्दावली था और संशोधित स्रोत-पाठ में उसका आधार नहीं बचता।
