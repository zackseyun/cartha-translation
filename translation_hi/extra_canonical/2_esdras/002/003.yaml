  text: I raised you with gladness, and I lost you with mourning and sorrow,
translation:
  language: hi
  text: मैंने आनन्द के साथ तुम्हारा पालन-पोषण किया, और शोक और उदासी के साथ तुम्हें खो दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Educaui
  choice: पालन-पोषण किया
  rationale: लातीनी क्रिया यहाँ बच्चों को पालने-बढ़ाने का भाव रखती है; आधुनिक हिन्दी में ‘पालन-पोषण किया’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: cum laetitia
  choice: आनन्द के साथ
  rationale: यह पालन-पोषण के साथ जुड़ी प्रसन्नता को बिना अर्थ बढ़ाए व्यक्त करता है।
- source_word: amisi
  choice: खो दिया
  rationale: मूल का सीधा अर्थ ‘गँवा दिया/खो दिया’ है; ‘खो दिया’ सम्बन्धगत पीड़ा और मूल की संक्षिप्तता दोनों बनाए रखता है।
- source_word: cum luctu et tristitia
  choice: शोक और उदासी में
  rationale: ‘luctus’ के लिए ‘शोक’ और ‘tristitia’ के लिए ‘उदासी’ रखकर मूल के दो अलग किन्तु निकट भावों को सुरक्षित रखा गया है।
theological_decisions:
- issue: वक्ता द्वारा सम्बोधित जनों को ‘खो देने’ का अर्थ
  choice: तुम्हें खो दिया
  alternative: तुमसे वंचित हो गई
  rationale: मूल ‘amisi uos’ यह स्पष्ट नहीं करता कि हानि मृत्यु, त्याग, निर्वासन या सम्बन्ध-विच्छेद से हुई; इसलिए अनिश्चितता को बनाए रखते हुए कोई विशिष्ट धर्मवैचारिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भावपूर्ण गद्य; सामूहिक सम्बोधन के लिए ‘तुम्हारा/तुम्हें’ का प्रयोग किया गया है।
