  text: My hands will cover you, so that your children may not see Gehenna. Rejoice,
translation:
  language: hi
  text: मेरे हाथ तुम्हें ढाँप लेंगे, ताकि तुम्हारे बच्चे गेहन्ना को न देखें। आनन्दित हो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Manus meae
  choice: मेरे हाथ
  rationale: लैटिन के बहुवचन और प्रत्यक्ष देहात्मक बिंब को बनाए रखा गया है।
- source_word: tegent te
  choice: तुम्हें ढाँप लेंगे
  rationale: भविष्यकाल तथा संरक्षणसूचक ‘ढाँपने’ के बिंब को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: filii tui
  choice: तुम्हारे बच्चे
  rationale: filii यहाँ संतानों के व्यापक सामूहिक अर्थ में हो सकता है; ‘बच्चे’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: gehennam
  choice: गेहन्ना
  rationale: विशिष्ट पारंपरिक स्थान/दण्ड-संज्ञा का लिप्यंतरण किया गया है, उसे व्याख्यात्मक रूप से ‘नरक’ में विलीन नहीं किया गया।
- source_word: Iocundare
  choice: आनन्द मनाओ
  rationale: एकवचन आज्ञार्थक क्रिया को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: गेहन्ना की पहचान
  choice: गेहन्ना
  alternative: नरक
  rationale: मूल के विशिष्ट शब्द को बनाए रखने से उसके स्थानवाचक और अंतिम दण्ड से जुड़े अर्थों के बीच की सम्भावित तनावपूर्ण व्यापकता सुरक्षित रहती है।
- issue: ‘न देखें’ का आशय
  choice: शाब्दिक दृष्टि-संबंधी अभिव्यक्ति बनाए रखी
  alternative: गेहन्ना का अनुभव न करें / उसमें न जाएँ
  rationale: मूल पाठ केवल ‘देखने’ की बात कहता है; उसे अनुभव या प्रवेश के अर्थ में स्पष्ट करना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। वाक्य के अंत का अल्पविराम सुरक्षित रखा गया है, क्योंकि ‘आनन्द मनाओ,’ अगले पद में जारी संबोधन या वाक्यांश का आरम्भ प्रतीत होता है।
