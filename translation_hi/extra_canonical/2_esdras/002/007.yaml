source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: generatio eorum fiat. Dispergantur in gentes, nomina eorum deleantur a terra, quoniam spreuerunt testamentum meum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/007.yaml
  text: May their offspring cease. Let them be scattered among the nations; let their names be blotted out from the earth, because they despised my covenant.
translation:
  language: hi
  text: उनकी संतति मिट जाए।[a] वे राष्ट्रों में तितर-बितर कर दिए जाएँ; पृथ्वी पर से उनके नाम मिटा दिए जाएँ, क्योंकि उन्होंने मेरी वाचा को तुच्छ जाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी पाठ का शाब्दिक रूप है, “उनकी पीढ़ी हो जाए।” सम्भवतः पाठ में कोई शब्द लुप्त है; सन्दर्भ इसे उनकी संतति के मिट जाने की कामना के रूप में समझने का संकेत देता है।
    reason: उपलब्ध लातीनी पाठ और सन्दर्भगत अर्थ के बीच वास्तविक पाठगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: generatio eorum fiat
  choice: उनकी सन्तति मिट जाए
  rationale: सन्दर्भ में इसे सन्तति के समाप्त हो जाने की अभिशापात्मक कामना के रूप में व्यक्त किया गया है। उपलब्ध लातीनी वाक्यांश असामान्य और सम्भवतः अपूर्ण है, इसलिए उसकी शाब्दिक अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: Dispergantur in gentes
  choice: वे जाति-जाति के लोगों में तितर-बितर कर दिए जाएँ
  rationale: लातीनी कर्मवाच्य और विभिन्न जातियों के बीच बिखेर दिए जाने का भाव स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: nomina eorum deleantur a terra
  choice: पृथ्वी पर से उनके नाम मिटा दिए जाएँ
  rationale: नामों के मिटाए जाने की तीव्र स्मृति-विलोपन सम्बन्धी छवि को सीधे बनाए रखता है।
- source_word: spreuerunt testamentum meum
  choice: उन्होंने मेरी वाचा को तुच्छ जाना है
  rationale: spreverunt का अर्थ केवल अस्वीकार करना नहीं, बल्कि अवमानना करना है; testamentum के लिए बाइबलीय और प्रचलित शब्द ‘वाचा’ चुना गया है।
theological_decisions:
- issue: आरम्भिक लातीनी वाक्यांश की अस्पष्टता
  choice: मुख्य पाठ में सन्तति के मिट जाने की अभिशापात्मक कामना
  alternative: ‘उनकी पीढ़ी हो जाए’ अथवा ‘उनकी सन्तति उत्पन्न हो’ जैसा शाब्दिक अनुवाद
  rationale: उपलब्ध पाठ में generatio eorum fiat का शाब्दिक अर्थ सकारात्मक प्रतीत होता है, परन्तु अगले अभिशापात्मक वाक्यों और परामर्श-पाठ के अनुसार यहाँ सन्तति के अन्त की कामना अभिप्रेत लगती है। पाठगत तनाव को छिपाने के बजाय पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। अभिशापात्मक विधिलिंग के लिए ‘मिट जाए’ और ‘कर दिए जाएँ’ प्रयुक्त हुए हैं; ‘वाचा’ बाइबलीय प्रसंग में व्यापक रूप से समझा जाने वाला शब्द है।
