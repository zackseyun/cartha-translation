  text: filios tuos. Viduam iustifica, pupillo iudica, egenti da, orfanum tuere, nudum uesti, Confractum et debilem cura, claudum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/020.yaml
  text: Vindicate the widow, judge for the orphan, give to the needy, protect the fatherless, clothe the naked, care for the broken and the weak, the lame
translation:
  language: hi
  text: विधवा को न्याय दिला, अनाथ के पक्ष में न्याय कर, ज़रूरतमंद को दे, माता-पिता-विहीन की रक्षा कर, नंगे को कपड़े पहना, टूटे हुए और निर्बल की देखभाल कर, लँगड़े को[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी पाठ में पद यहाँ “लँगड़े को” पर अधूरा टूटता है; आगे की आज्ञा अगले पाठांश में पूरी होती है।
    reason: स्रोत की वाक्यगत अपूर्णता को पाठक के लिए स्पष्ट करना और अनूदित पाठ में कोई क्रिया अनुमान से न जोड़ना।
lexical_decisions:
- source_word: Viduam iustifica
  choice: विधवा को न्याय दिला
  rationale: ‘iustifica’ का यहाँ आशय विधवा के अधिकार को सही ठहराने या उसे न्याय दिलाने से है; यह हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: pupillo iudica
  choice: अनाथ के पक्ष में न्याय कर
  rationale: लातीनी वाक्यांश का शाब्दिक अर्थ ‘अनाथ के लिए न्याय कर’ है; ‘के पक्ष में’ उसके हित में न्याय करने का भाव स्पष्ट करता है।
- source_word: egenti da
  choice: ज़रूरतमंद को दे
  rationale: ‘egens’ अभावग्रस्त या ज़रूरतमंद व्यक्ति है; संक्षिप्त आज्ञार्थक रूप सुरक्षित रखा गया है।
- source_word: orfanum tuere
  choice: माता-पिता-विहीन की रक्षा कर
  rationale: ‘orfanum’ को पहले आए ‘pupillo’ से हिंदी में अलग पहचान देने और स्रोत की पुनरुक्ति बनाए रखने के लिए यह रूप चुना गया है।
- source_word: nudum uesti
  choice: नंगे को कपड़े पहना
  rationale: यह मूल की सीधी आज्ञा का सहज आधुनिक हिंदी रूप है।
- source_word: Confractum et debilem cura
  choice: टूटे हुए और निर्बल की देखभाल कर
  rationale: ‘confractum’ शारीरिक या आंतरिक रूप से टूटे व्यक्ति का व्यापक बिंब रखता है; ‘debilem’ के लिए ‘निर्बल’ मूल की व्यापकता बनाए रखता है।
- source_word: claudum
  choice: लँगड़े को भी—
  rationale: यह कर्मकारक शब्द उपलब्ध अंश में अधूरा रह जाता है; डैश द्वारा वाक्य की अपूर्णता को ईमानदारी से सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘iustifica’ को धार्मिक अर्थ में ‘धर्मी ठहरा’ या सामाजिक-न्याय संबंधी अर्थ में प्रस्तुत करना
  choice: विधवा को न्याय दिला
  alternative: विधवा को निर्दोष ठहरा
  rationale: आसपास की आज्ञाएँ असहाय लोगों की रक्षा और सहायता से संबंधित हैं, इसलिए न्याय दिलाने का अर्थ अधिक प्रसंगानुकूल है; इसे धार्मिक ‘धर्मी ठहराने’ की शिक्षा नहीं बनाया गया।
- issue: ‘pupillus’ और ‘orfanus’ की निकटार्थक पुनरुक्ति
  choice: अनाथ / माता-पिता-विहीन
  alternative: दोनों स्थानों पर ‘अनाथ’
  rationale: स्रोत में दो अलग लातीनी शब्द और दो अलग आज्ञाएँ हैं; हिंदी में भेद रखते हुए किसी अतिरिक्त संस्थागत या धर्मसांप्रदायिक अर्थ को नहीं जोड़ा गया।
translation_notes:
  register: एकवचन आज्ञार्थक शैली रखी गई है। भाषा आधुनिक, सहज और गरिमापूर्ण है। समानांतर संक्षिप्त आज्ञाओं की लय तथा अंतिम अपूर्ण पदबंध दोनों सुरक्षित रखे गए हैं।
