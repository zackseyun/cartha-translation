id: 2ES.2.4
reference: 2 Esdras 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam peccastis coram domino deo et quod malum est coram me fecistis. Modo autem quid faciam uobis? ego enim uidua sum et derelicta: ite, filii, et petite a domino'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/004.yaml
  text: because you sinned before the Lord God and did what is evil before me. But now what shall I do for you? For I am a widow and forsaken. Go, my children, and ask the Lord.
translation:
  language: hi
  text: क्योंकि तुमने प्रभु परमेश्वर के सामने पाप किया और वह किया जो मेरे सामने बुरा है। पर अब मैं तुम्हारे लिए क्या करूँ? क्योंकि मैं विधवा और परित्यक्त हूँ। हे मेरे बच्चों, जाओ और प्रभु से माँगो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram domino deo
  choice: प्रभु परमेश्वर के सामने
  rationale: स्थान-सूचक लैटिन अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए परमेश्वर के समक्ष उत्तरदायित्व का भाव सुरक्षित किया।
- source_word: quod malum est coram me
  choice: वह किया जो मेरी दृष्टि में बुरा है
  rationale: coram me का शाब्दिक स्थानार्थ हिन्दी में असहज होता; ‘मेरी दृष्टि में’ स्रोत का मूल्यांकनात्मक भाव स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: uidua sum et derelicta
  choice: मैं विधवा और त्यागी हुई हूँ
  rationale: दोनों समानांतर विशेषणों को अलग-अलग बनाए रखा; derelicta में उपेक्षा अथवा परित्याग का भाव है, इसलिए अर्थ को केवल ‘अकेली’ तक सीमित नहीं किया।
- source_word: filii
  choice: हे मेरे बच्चो
  rationale: सम्बोधन और आत्मीय मातृभाव को स्पष्ट किया; सन्दर्भ में यह सामूहिक सम्बोधन है।
- source_word: petite a domino
  choice: प्रभु से माँगो
  rationale: petite का कर्म स्रोत में व्यक्त नहीं है। ‘दया’ जैसी अनुपस्थित वस्तु जोड़े बिना इस अपूर्णता को सुरक्षित रखा; a domino को ‘प्रभु से’ के रूप में व्यक्त किया।
theological_decisions:
- issue: petite के अनकहे कर्म का अनुवाद
  choice: प्रभु से माँगो
  alternative: प्रभु से दया माँगो
  rationale: लैटिन में ‘दया’ नहीं है। किसी सम्भावित धार्मिक आशय को पाठ में जोड़ने के बजाय स्रोत की खुली अभिव्यक्ति बनाए रखी।
- issue: वक्ता के स्त्रीलिंग रूपक की प्रस्तुति
  choice: मैं विधवा और त्यागी हुई हूँ
  alternative: मैं विधवा होकर असहाय छोड़ दी गई हूँ
  rationale: uidua और derelicta को सीधे स्त्रीलिंग में रखा, ताकि वक्ता की रूपकात्मक पहचान और दोनों पदों का तनाव सुरक्षित रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘तुम’ बहुवचन समुदाय के लिए है; ‘हे मेरे बच्चो’ मातृवत सम्बोधन को स्पष्ट करता है। स्रोत में कोई पाठांतर या आवश्यक व्याख्यात्मक टिप्पणी न होने के कारण पादटिप्पणी नहीं दी गई।
