  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Qui respondens dixit mihi: hi sunt qui mortalem tunicam deposuerunt et inmortalem sumpserunt et confessi sunt nomen dei: modo coronantur et accipiunt palmas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/045.yaml
  text: He answered and said to me, “These are the ones who have put off the mortal garment and put on the immortal, and they have confessed the name of God. Now they are being crowned and receiving palms.”
translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “ये वे लोग हैं जिन्होंने नश्वर वस्त्र उतार दिया और अमर वस्त्र पहन लिया, और परमेश्वर के नाम का अंगीकार किया। अब उन्हें मुकुट पहनाए जा रहे हैं और वे खजूर की डालियाँ पा रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortalem tunicam
  choice: नश्वर वस्त्र
  rationale: ‘tunica’ का मूल अर्थ अंगरखा है, पर यहाँ देहधारी नश्वर अवस्था के रूपक के लिए स्वाभाविक और गरिमापूर्ण ‘वस्त्र’ उपयुक्त है।
- source_word: inmortalem
  choice: अमर वस्त्र
  rationale: लैटिन में संज्ञा लुप्त है और पहले आए ‘tunicam’ से समझी जाती है; हिन्दी में रूपक स्पष्ट रखने के लिए ‘वस्त्र’ दोहराया गया है।
- source_word: confessi sunt nomen dei
  choice: परमेश्वर के नाम को स्वीकार किया
  rationale: ‘confiteri’ यहाँ सार्वजनिक रूप से अंगीकार/स्वीकार करने का भाव रखता है; ‘स्वीकार किया’ सामान्य पाठक के लिए सुबोध है और दोष-स्वीकार का अनचाहा अर्थ टालता है।
- source_word: coronantur
  choice: उन्हें मुकुट पहनाए जा रहे हैं
  rationale: वर्तमानकालीन कर्मवाच्य और सम्मान अथवा विजय के मुकुट का चित्र सुरक्षित रखा गया है।
- source_word: accipiunt palmas
  choice: वे खजूर की डालियाँ पा रहे हैं
  rationale: ‘palmae’ विजय के चिह्न रूप में खजूर की डालियाँ हैं; केवल ‘हथेलियाँ’ या अस्पष्ट ‘डालियाँ’ कहना भ्रामक होता।
theological_decisions:
- issue: नश्वर और अमर वस्त्र का रूपक
  choice: रूपक को यथावत रखा गया
  alternative: नश्वर शरीर त्यागकर अमर शरीर धारण किया
  rationale: मूल पाठ ‘वस्त्र’ की प्रतिमा प्रस्तुत करता है; उसे सीधे ‘शरीर’ कहने से निहितार्थ की एक व्याख्या निश्चित हो जाती।
- issue: परमेश्वर के नाम का अंगीकार
  choice: ‘नाम को स्वीकार किया’
  alternative: ‘नाम का अंगीकार किया’ या ‘नाम की गवाही दी’
  rationale: मूल के स्वीकारोक्ति/अंगीकार के भाव को रखा गया, पर ‘गवाही’ जोड़कर शहादत या किसी विशिष्ट धार्मिक सूत्र को अनिवार्य नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। लैटिन के वर्तमान कर्मवाच्य ‘coronantur’ और वर्तमान ‘accipiunt’ को क्रमशः ‘पहनाए जा रहे हैं’ और ‘पा रहे हैं’ से व्यक्त किया गया है।
