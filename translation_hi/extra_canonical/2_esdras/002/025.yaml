lexical_decisions:
- source_word: filios tuos
  choice: तेरे बच्चों को
  rationale: लैटिन में यह कर्मकारक खंड है और पूर्ववर्ती वाक्य से जुड़ा हुआ प्रतीत होता है; पद-सीमा पर उसके अपूर्ण स्वरूप को यथावत रखा गया है।
- source_word: confirma
  choice: दृढ़ कर
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: pedes eorum
  choice: उनके पाँव
  rationale: शाब्दिक बिंब को बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘मार्ग’ या ‘विश्वास’ नहीं बनाया गया।
- source_word: Seruos
  choice: सेवक
  rationale: servus के सामान्य अर्थ को दर्शाता है और अनावश्यक रूप से ‘दास’ की सामाजिक बारीकी आरोपित नहीं करता।
- source_word: quos tibi dedi
  choice: जिन्हें मैंने तुझे दिया है
  rationale: सम्बन्धवाचक संरचना और पूर्ण क्रिया के भाव को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: ‘उनके पाँव दृढ़ कर’ का रूपकात्मक आशय
  choice: रूपक को बिना व्याख्या किए ज्यों का त्यों रखा गया
  alternative: उन्हें स्थिर कर / उनके विश्वास को दृढ़ कर
  rationale: स्रोत केवल pedes कहता है; आध्यात्मिक अर्थ स्पष्ट करके जोड़ना मूल की अर्थगत खुली जगह को समाप्त कर देता।
- issue: पद के अंत में अपूर्ण सम्बन्धवाचक खंड
  choice: अल्पविराम सहित अपूर्णता बनाए रखी गई
  alternative: अगले पद की सामग्री जोड़कर वाक्य पूरा करना
  rationale: दिए गए लैटिन स्रोतांश की पद-सीमा ‘जिन्हें मैंने तुझे दिया है’ पर समाप्त होती है; अगले पद को इसमें मिलाना अनुचित होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और स्रोत-सन्निकट हिन्दी। एकवचन अनौपचारिक/शास्त्रीय संबोधन के लिए ‘तेरे/तुझे’ रखा गया है। आरम्भिक खंड पिछले पद से व्याकरणतः जुड़ा है, इसलिए उसकी खंडित पद-सीमा को सुधारा नहीं गया।
