  yaml_path: translation/extra_canonical/2_esdras/002/013.yaml
  text: Ask[13], and you will receive; pray that your few days may be shortened. The kingdom is already prepared for you[a]; keep watch.
translation:
  language: hi
  text: माँगो[13], और तुम्हें मिलेगा; प्रार्थना करो कि तुम्हारे ये थोड़े दिन घटा दिए जाएँ। राज्य तुम्हारे लिए पहले ही तैयार है[a]; जागते रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: '13'
    text: ‘थोड़े दिनों’ को घटाने की प्रार्थना वाला लातीनी वाक्य कठिन है। संभवतः इसका आशय अपने जीवन को छोटा करने की इच्छा नहीं, बल्कि वर्तमान युग या वर्तमान संकट की अवधि घटाए जाने से है।
    reason: lexical_alternative
  - marker: a
    text: 'एक अन्य अनुवाद: ‘प्रार्थना करो कि तुम्हारे दिन थोड़े हों और घटा दिए जाएँ।’'
    reason: previous_rendering
lexical_decisions:
- source_word: Petite
  choice: माँगो
  rationale: लातीनी क्रिया यहाँ सामान्य आग्रह या याचना को व्यक्त करती है; अगले पदबंध ‘और तुम्हें मिलेगा’ के साथ ‘माँगो’ स्वाभाविक और सीधा है।
- source_word: rogate
  choice: प्रार्थना करो
  rationale: यहाँ आग्रह परमेश्वर से किया जा रहा है, इसलिए ‘प्रार्थना करो’ प्रसंगानुकूल है और petite से भेद भी बनाए रखता है।
- source_word: dies paucos ut minorentur
  choice: कि तुम्हारे ये थोड़े दिन घटा दिए जाएँ
  rationale: 'dies paucos को ut-वाक्य के प्रत्याशित कर्ता के रूप में समझा गया है: दिन पहले से ‘थोड़े’ हैं और उनके घटाए जाने की प्रार्थना है। कर्मवाच्य अभिव्यक्ति मूल के minorentur को बनाए रखती है तथा यह तय नहीं करती कि अवधि वर्तमान युग, संकट या जीवनकाल है।'
- source_word: iam paratum est uobis regnum
  choice: राज्य तुम्हारे लिए पहले ही तैयार है
  rationale: iam का कालगत बल ‘पहले ही’ से और uobis का लाभार्थक अर्थ ‘तुम्हारे लिए’ से स्पष्ट होता है।
- source_word: uigilate
  choice: जागते रहो
  rationale: आज्ञार्थक बहुवचन निरंतर चौकसी की अपील करता है; ‘जागते रहो’ आधुनिक हिन्दी में स्वाभाविक और बाइबलीय चेतावनी के अनुरूप है।
theological_decisions:
- issue: ‘थोड़े दिनों’ को घटाने का आशय
  choice: पाठ में केवल दिनों के घटाए जाने की प्रार्थना रखी गई है; अवधि की पहचान खुली छोड़ी गई है।
  alternative: इसे स्पष्ट रूप से वर्तमान युग, वर्तमान संकट या व्यक्ति के जीवनकाल को छोटा करने की प्रार्थना कहना।
  rationale: लातीनी पाठ स्वयं यह नहीं बताता कि ‘दिन’ किस अवधि के हैं। किसी एक व्याख्या को मुख्य पाठ में रखने से वास्तविक अपोकैलिप्टिक अस्पष्टता और तनाव मिट जाएगा।
- issue: राज्य की तैयारी का कालगत बल
  choice: ‘पहले ही तैयार है’
  alternative: ‘अब तैयार है’
  rationale: iam पूर्ण तैयारी की वर्तमान स्थिति पर बल दे सकता है; ‘पहले ही’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, बिना राज्य के प्रकट होने के समय पर अतिरिक्त दावा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आज्ञार्थक शैली रखी गई है। ‘राज्य’ जैसे स्थापित बाइबलीय पद को बनाए रखा गया है। मुख्य पाठ में स्रोत की कठिन वाक्यरचना को सहज किया गया है, पर ‘दिन’ किस अवधि को सूचित करते हैं, यह जानबूझकर अनिर्णीत छोड़ा गया है।
