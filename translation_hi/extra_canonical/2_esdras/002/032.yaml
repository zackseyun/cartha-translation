  text: tuos usque dum uenio et praedica illis misericordiam, quoniam exuberant fontes mei, et gratia mea non deficiet. Ego Ezra accepi praeceptum a domino in monte Choreb,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/032.yaml
  text: Embrace your children until I come[a], and proclaim mercy to them, because my springs overflow and my grace will not fail.
translation:
  language: hi
  text: अपने बच्चों को तब तक गले लगाओ, जब तक मैं आऊँ, और उन्हें दया की घोषणा करो; क्योंकि मेरे सोते उमड़ रहे हैं, और मेरा अनुग्रह समाप्त नहीं होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuos
  choice: अपने बच्चों को
  rationale: यह शब्द ‘अपने लोगों/अपनों’ के अर्थ में विशेषण का संज्ञात्मक प्रयोग है; निकटवर्ती संदर्भ और परामर्श-पाठ इसे बच्चों के रूप में स्पष्ट करते हैं।
- source_word: praedica illis misericordiam
  choice: उन्हें दया का संदेश सुनाओ
  rationale: praedica सार्वजनिक रूप से घोषणा या प्रचार करने को और misericordiam दया को व्यक्त करता है; यह हिंदी में स्वाभाविक और अर्थपूर्ण रूप है।
- source_word: fontes mei
  choice: मेरे सोते
  rationale: fontes का मूल अर्थ जल के स्रोत या सोते हैं; रूपक को समझाकर सपाट बनाने के बजाय सुरक्षित रखा गया है।
- source_word: exuberant
  choice: उमड़ रहे हैं
  rationale: वर्तमानकालीन क्रिया प्रचुरता से बहने या छलकने का भाव देती है।
- source_word: gratia mea non deficiet
  choice: मेरा अनुग्रह कभी समाप्त नहीं होगा
  rationale: deficiet भविष्यकाल है और अनुग्रह के आगे चलकर न चुकने या विफल न होने की प्रतिज्ञा व्यक्त करता है।
theological_decisions:
- issue: gratia का अर्थ
  choice: अनुग्रह
  alternative: कृपा
  rationale: दोनों संभव हैं; ‘अनुग्रह’ धार्मिक संदर्भ में ईश्वर की उदार कृपा को स्पष्ट रखता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: non deficiet का काल
  choice: कभी समाप्त नहीं होगा
  alternative: समाप्त नहीं होता
  rationale: लैटिन deficiet भविष्यकालीन निर्देशार्थक रूप है, इसलिए भविष्य की प्रतिज्ञा सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सोते उमड़ रहे हैं’ मूल जल-रूपक तथा वर्तमानकाल को बनाए रखता है, जबकि ‘समाप्त नहीं होगा’ लैटिन के भविष्यकाल को स्पष्ट रूप से व्यक्त करता है। दिए गए स्रोत के अंत में ‘मैं एज्रा...’ अगली आयत का आरंभ है, इसलिए उसे इस आयत में शामिल नहीं किया गया।
