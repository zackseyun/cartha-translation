  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domini compleuerunt. Filiorum tuorum, quos optabas, plenus est numerus, roga imperium domini, ut sanctificetur populus tuus, qui uocatus est ab initio.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/041.yaml
  text: The number of your children[a], whom you desired, is complete. Ask for the Lord’s authority, that your people, who were called from the beginning, may be sanctified.
translation:
  language: hi
  text: तेरी उन संतानों की संख्या पूरी हो गई है, जिनकी तू इच्छा करता था। प्रभु की सत्ता की याचना कर कि तेरी प्रजा, जिसे आरम्भ से बुलाया गया है, पवित्र की जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filiorum tuorum
  choice: तेरी ... संतानों
  rationale: ‘संतान’ यहाँ सामूहिक और स्वाभाविक हिन्दी है तथा filii के स्त्री-पुरुष दोनों को समेट सकने वाले अर्थ को व्यक्त करती है।
- source_word: quos optabas
  choice: जिनकी तू इच्छा करता था
  rationale: optabas का सीधा अर्थ इच्छा या अभिलाषा करना है; इसे अधिक भावात्मक ‘तरसना’ बनाकर अर्थ नहीं बढ़ाया गया।
- source_word: plenus est numerus
  choice: संख्या पूरी हो गई है
  rationale: लातीनी मुहावरे ‘संख्या भर गई है’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: roga imperium domini
  choice: प्रभु के अधिकार से विनती कर
  rationale: imperium का मूल भाव अधिकार, प्रभुत्व या शासन-सत्ता है। लातीनी रचना असामान्य है, इसलिए उसकी संरचना को पूरी तरह किसी अधिक व्याख्यात्मक अर्थ में नहीं बदला गया।
- source_word: sanctificetur
  choice: पवित्र की जाए
  rationale: निष्क्रिय संभावनार्थक क्रिया का रूप बनाए रखा गया है, जिससे प्रार्थना या अपेक्षित परिणाम का भाव आता है।
- source_word: qui uocatus est ab initio
  choice: जिसे आरम्भ से बुलाया गया है
  rationale: एकवचन सम्बन्धवाचक वाक्यांश populus (‘प्रजा’) से जुड़ा है; ‘बुलाया गया’ vocatus की धर्मवैचारिक गुंजाइश को बिना ‘चुना गया’ में बदलकर सुरक्षित रखता है।
theological_decisions:
- issue: imperium domini का आशय
  choice: प्रभु के अधिकार
  alternative: प्रभु की सामर्थ्य / प्रभु की प्रभुता
  rationale: ‘अधिकार’ imperium के न्यायिक-शासकीय अर्थ को बनाए रखता है। ‘सामर्थ्य’ अधिक सहज है, पर शब्द को शक्ति तक सीमित कर सकता है; ‘प्रभुता’ हिन्दी में यहाँ कम स्वाभाविक लगती है।
- issue: आरम्भ से बुलाए जाने का सम्बन्ध
  choice: सम्बन्धवाचक उपवाक्य को ‘तेरी प्रजा’ से जोड़ा गया
  alternative: इसे पवित्र किए जाने के बाद रखकर सम्बन्ध को ढीला छोड़ना
  rationale: लातीनी qui uocatus est व्याकरणतः populus tuus से स्पष्ट रूप से सहमत है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन सम्बोधन के अनुरूप ‘तेरी/तू’ रखा गया है। आरम्भ का ‘domini compleuerunt’ व्याकरणतः पिछले वाक्य का खंडित अन्त प्रतीत होता है और अंग्रेज़ी परामर्श-पाठ भी इसे इस पद में नहीं रखता; इसलिए प्रकाशन-पाठ में सम्मिलित नहीं किया गया।
