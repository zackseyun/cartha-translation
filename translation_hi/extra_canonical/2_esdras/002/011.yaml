  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/011.yaml
  text: And I will take for myself their glory[a], and I will give them everlasting tabernacles[b],
translation:
  language: hi
  text: और मैं उन लोगों की महिमा अपने लिए ले लूँगा और इन्हें अनन्त तंबू दूँगा,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में “उन लोगों की” और “इन्हें” के लिए अलग-अलग सर्वनाम हैं; वे सम्भवतः दो अलग समूहों की ओर संकेत करते हैं।
    reason: स्रोत में उपस्थित सर्वनामगत अंतर और उसकी वास्तविक व्याख्यात्मक अनिश्चितता को स्पष्ट करना।
lexical_decisions:
- source_word: gloriam
  choice: महिमा
  rationale: यह लैटिन शब्द के सम्मान, वैभव और गौरव से जुड़े व्यापक अर्थ को बनाए रखता है।
- source_word: illorum … eis
  choice: उन लोगों की … इन्हें
  rationale: लैटिन में दो अलग सर्वनाम हैं। यह रूप उनके बीच का संकेतात्मक अंतर बनाए रखता है और दोनों को अनायास एक ही समूह नहीं ठहराता।
- source_word: tabernacula aeterna
  choice: सदा रहनेवाले डेरे
  rationale: बहुवचन और तम्बू/डेरे की ठोस छवि सुरक्षित रहती है, जबकि आधुनिक हिन्दी में वाक्य स्वाभाविक और बोधगम्य बनता है।
theological_decisions:
- issue: ‘illorum’ और ‘eis’ किन समूहों की ओर संकेत करते हैं
  choice: मुख्य पाठ में ‘उन लोगों की … इन्हें’ के द्वारा अंतर बनाए रखा गया है।
  alternative: ‘उनकी … उन्हें’, जिससे दोनों सर्वनाम एक ही समूह के लिए समझे जा सकते हैं।
  rationale: स्रोत के अलग-अलग लैटिन सर्वनाम सम्भावित समूह-विरोध को संकेत करते हैं; अनुवाद को उस तनाव को मिटाना नहीं चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिन्दी। ‘डेरे’ ने tabernacula की मूर्त छवि तथा बहुवचन बनाए रखा है। स्रोत के अंत में अल्पविराम होने के कारण पद को आगे जारी रहनेवाले वाक्यांश की तरह विराम दिया गया है।
