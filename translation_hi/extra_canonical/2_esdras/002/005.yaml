id: 2ES.2.5
reference: 2 Esdras 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: misericordiam. Ego autem te, pater, testem inuoco super matrem filiorum, quia noluerunt testamentum meum seruare,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/005.yaml
  text: But I call on you[a], Father, as a witness against the mother of the children, because they were unwilling to keep my covenant,
translation:
  language: hi
  text: परन्तु हे पिता, मैं तुझे बच्चों की माता के विरुद्ध गवाह के रूप में बुलाता हूँ,[a] क्योंकि उन्होंने मेरी वाचा का पालन करना नहीं चाहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच्चों की माता के विषय में गवाह के रूप में बुलाता हूँ।”
    reason: लातीनी super का सामान्यतः ‘के विषय में/के ऊपर’ अर्थ भी हो सकता है, यद्यपि यहाँ न्यायिक सन्दर्भ ‘के विरुद्ध’ का समर्थन करता है।
lexical_decisions:
- source_word: testem inuoco
  choice: गवाह ठहराता हूँ
  rationale: यह न्यायिक सन्दर्भ में किसी को साक्षी के रूप में बुलाने का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: super matrem filiorum
  choice: बच्चों की माता के विरुद्ध
  rationale: न्यायिक प्रयोग और अगले पद के प्रतिकूल भाव के कारण यहाँ super का अर्थ ‘के विरुद्ध’ है; filiorum में संकेतवाचक ‘इन’ नहीं है।
- source_word: testamentum meum seruare
  choice: मेरी वाचा का पालन करना
  rationale: testamentum यहाँ परमेश्वर की वाचा को दर्शाता है और seruare उसके प्रति आज्ञाकारी बने रहने या उसका पालन करने का भाव देता है।
- source_word: noluerunt
  choice: करना नहीं चाहा
  rationale: यह केवल पालन न करने की घटना नहीं, बल्कि इच्छा या तत्परता के अभाव को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: ‘बच्चों की माता’ की पहचान
  choice: स्रोत की रूपकात्मक और सामूहिक अभिव्यक्ति को बिना पहचान स्पष्ट किए बनाए रखा गया।
  alternative: इसे किसी विशेष नगर, जाति या धार्मिक समुदाय के नाम से स्पष्ट करना।
  rationale: इस पद में माता की पहचान प्रत्यक्ष रूप से नहीं दी गई; अनुवाद में किसी विशिष्ट व्याख्या को आरोपित नहीं करना चाहिए।
- issue: न्यायिक सम्बन्ध में super
  choice: ‘के विरुद्ध’
  alternative: ‘के ऊपर/के विषय में’
  rationale: testem invoco के न्यायिक सूत्र और आगे आने वाले दण्ड के सन्दर्भ में प्रतिकूल कानूनी भाव अधिक सम्भाव्य है, फिर भी वैकल्पिक व्याकरणिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबलीय शैली रखी गई है। ‘तुझे’ एकवचन सम्बोधन और ‘हे पिता’ मूल के प्रत्यक्ष सम्बोधन को दर्शाते हैं; वाक्य को सहज बनाने के लिए हिन्दी की स्वाभाविक शब्द-क्रम व्यवस्था अपनाई गई है।
