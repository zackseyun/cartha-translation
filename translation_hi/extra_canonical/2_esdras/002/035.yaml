id: 2ES.2.35
reference: 2 Esdras 2:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia lux perpetua lucebit uobis per aeternitatem temporis. Fugite umbram saeculi huius, accipite iocunditatem gloriae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/035.yaml
  text: For everlasting light will shine for you through all eternity. Flee the shadow of this age; receive the joy of glory.
translation:
  language: hi
  text: क्योंकि अनन्त ज्योति युगानुयुग तुम्हारे लिए चमकेगी। इस युग की छाया से भागो; महिमा का आनन्द ग्रहण करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lux perpetua
  choice: अनन्त ज्योति
  rationale: ‘सदा बनी रहने वाली ज्योति’ का भाव संक्षिप्त, स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: per aeternitatem temporis
  choice: युगानुयुग
  rationale: समय की अनन्त अवधि को सहज बाइबलीय हिन्दी में व्यक्त करता है और पूर्ववर्ती ‘अनन्त’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: Fugite
  choice: भागो
  rationale: लैटिन बहुवचन आज्ञार्थक की तीव्रता को सीधे बनाए रखता है।
- source_word: umbram saeculi huius
  choice: इस युग की छाया
  rationale: saeculum के कालगत अर्थ ‘युग’ और मूल रूपक ‘छाया’ दोनों को सुरक्षित रखता है।
- source_word: accipite iocunditatem gloriae
  choice: महिमा का आनन्द ग्रहण करो
  rationale: accipite को ‘ग्रहण करो’ और संबंधवाचक gloriae को बिना व्याख्यात्मक विस्तार के ‘महिमा का’ रखा गया है।
theological_decisions:
- issue: ‘महिमा का आनन्द’ में संबंध की अस्पष्टता
  choice: महिमा का आनन्द
  alternative: महिमा से मिलने वाला आनन्द
  rationale: लैटिन iocunditatem gloriae यह स्पष्ट नहीं करता कि महिमा आनन्द का स्रोत है, विषय है या उससे जुड़ी अवस्था; इसलिए मूल अस्पष्टता बनाए रखी गई है।
- issue: अनन्त प्रकाश की अवधि
  choice: अनन्त ज्योति युगानुयुग… चमकेगी
  alternative: सदा रहने वाली ज्योति समय की अनन्तता तक… चमकेगी
  rationale: मूल के lux perpetua और per aeternitatem temporis दोनों को अर्थतः सुरक्षित रखते हुए हिन्दी में बोझिल दोहराव से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और आदेशात्मक लहजा। ‘ज्योति’, ‘युगानुयुग’ और ‘ग्रहण करो’ पाठ के उच्च साहित्यिक-बाइबलीय स्वर को बनाए रखते हैं, पर वाक्यरचना सामान्य पाठक के लिए स्पष्ट है।
