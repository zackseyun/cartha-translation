  text: Vae tibi, Assur, qui abscondis iniquos penes te! gens mala,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/008.yaml
  text: Woe to you[a], Assyria, who hide the unrighteous with you! O evil nation,
translation:
  language: hi
  text: हाय तुझ पर, हे अश्शूर! तू अधर्मियों को अपने यहाँ[a] छिपाता है। हे दुष्ट जाति,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने बीच” अथवा “अपने अधिकार में।”
    reason: लातिनी penes te स्थान, संगति, संरक्षण या अधिकार का भाव दे सकता है; मुख्य पाठ किसी एक सूक्ष्म अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
lexical_decisions:
- source_word: Vae tibi
  choice: हाय तुझ पर
  rationale: यह न्याय और विनाश की भविष्यवाणी करने वाला शोकसूचक वाक्य है; यह हिन्दी में मूल की तीव्रता बनाए रखता है।
- source_word: Assur
  choice: अश्शूर
  rationale: लातिनी नाम को उसके प्रचलित बाइबलीय हिन्दी रूप में रखा गया है; यहाँ इससे अश्शूर राष्ट्र अभिप्रेत है।
- source_word: iniquos
  choice: अधर्मियों
  rationale: यह नैतिक अन्याय और दुष्टता करने वालों को सूचित करता है; ‘अधर्मी’ मूल के व्यापक नैतिक अर्थ को बनाए रखता है।
- source_word: penes te
  choice: अपने यहाँ
  rationale: इसका अर्थ केवल भौतिक निकटता नहीं, बल्कि अश्शूर के बीच या उसके संरक्षण/अधिकार में होना भी हो सकता है। ‘अपने यहाँ’ स्वाभाविक हिन्दी है और इस अर्थ-सीमा को खुला रखता है।
- source_word: gens mala
  choice: हे दुष्ट जाति
  rationale: gens mala संबोधन है और अगले कथन की ओर बढ़ता है; ‘हे’ उसके संबोधनात्मक बल को स्पष्ट करता है।
