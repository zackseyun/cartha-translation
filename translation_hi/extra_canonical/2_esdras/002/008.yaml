  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी-संबंधी चेतावनी के अनुरूप रखी गई है। एकवचन ‘तुझ/तू’ मूल के सीधे संबोधन को बनाए रखता है। अंतिम अल्पविराम इसलिए रखा गया है कि ‘हे दुष्ट जाति’ अगले पद में जारी संबोधन का आरंभ है।
