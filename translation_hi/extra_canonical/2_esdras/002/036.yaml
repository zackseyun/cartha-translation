  yaml_path: translation/extra_canonical/2_esdras/002/036.yaml
  text: Flee the shadow of this age; receive the gladness of your glory[a]. I openly call my Savior to witness.
translation:
  language: hi
  text: इस युग की छाया से भागो; अपनी महिमा का आनंद ग्रहण करो। मैं सबके सामने अपने उद्धारकर्ता को साक्षी ठहराता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ego testor palam saluatorem meum
  choice: मैं सबके सामने अपने उद्धारकर्ता को साक्षी ठहराता हूँ
  rationale: लातीनी testor के साथ व्यक्ति-वाचक कर्म saluatorem meum का अर्थ उस व्यक्ति को साक्षी के रूप में पुकारना या ठहराना है, न कि उसके विषय में गवाही देना। palam को स्वाभाविक आधुनिक हिन्दी में “सबके सामने” कहा गया है।
- source_word: uestrae
  choice: अपनी महिमा का
  rationale: दिया गया लातीनी अंश केवल संबंधकारक “तुम्हारी/अपनी” के अंतिम शब्द को सुरक्षित रखता है; परामर्श-पाठ और पद-संदर्भ के आधार पर इसे “अपनी महिमा का” के साथ जोड़ा गया है।
theological_decisions:
- issue: उद्धारकर्ता के संबंध में testor का आशय
  choice: उद्धारकर्ता को साक्षी ठहराना
  alternative: उद्धारकर्ता के विषय में गवाही देना
  rationale: व्यक्ति-वाचक द्वितीया के साथ लातीनी प्रयोग एक गंभीर साक्षी-आह्वान व्यक्त करता है। वैकल्पिक अनुवाद व्याकरणिक संबंध बदल देता और कथन को उद्धारकर्ता के विषय में सामान्य गवाही बना देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “इस युग की छाया” की रूपकात्मकता और आदेशात्मक लहजा सुरक्षित हैं; “सबके सामने” palam का सहज सार्वजनिक अर्थ देता है।
