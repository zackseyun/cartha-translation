id: 2ES.2.34
reference: 2 Esdras 2:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae auditis et intellegitis: expectate pastorem uestrum, requiem aeternitatis dabit uobis, quoniam in proximo est ille, qui in finem saeculi adueniet. Parati estote ad praemia regni,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/034.yaml
  text: 'Therefore I say to you[a], Gentiles who hear and understand: await your shepherd; he will give you eternal rest, because he is near—the one who will come at the end of the age. Be ready for the rewards of the kingdom,'
translation:
  language: hi
  text: 'इसलिए मैं तुमसे कहता हूँ, हे अन्यजातियो[a], जो सुनते और समझते हो: अपने चरवाहे की बाट जोहो; वह तुम्हें अनन्त विश्राम देगा, क्योंकि वह निकट है—वही जो युग के अन्त में आएगा। राज्य के पुरस्कारों के लिए तैयार रहो,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे राष्ट्रो, जो सुनते और समझते हो’।
    reason: लातीनी gentes का सामान्य अर्थ ‘राष्ट्र/जातियाँ’ भी हो सकता है, यद्यपि इस सन्दर्भ में ‘अन्यजाति’ अधिक सम्भावित है।
lexical_decisions:
- source_word: gentes (consultation text/context; the supplied excerpt resumes with quae)
  choice: अन्यजातियो
  rationale: पिछले पद में इस्राएल के साथ विरोध और आरम्भिक मसीही लातीनी प्रयोग के कारण यहाँ ‘अन्यजाति’ धार्मिक-सामाजिक भेद को ‘राष्ट्र’ से अधिक स्पष्ट रखता है। पाठ की सीमा में gentes न होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: expectate pastorem uestrum
  choice: अपने चरवाहे की बाट जोहो
  rationale: expectate की प्रतीक्षापूर्ण आज्ञा और pastorem के चरवाही रूपक—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: requiem aeternitatis
  choice: अनन्त विश्राम
  rationale: शाब्दिक ‘अनन्तकाल का विश्राम’ की अपेक्षा यह अधिक स्वाभाविक है और स्थायी, युगातीत विश्राम का भाव सुरक्षित रखता है।
- source_word: in finem saeculi
  choice: युग के अन्त में
  rationale: saeculum का यहाँ कालिक-अन्तकालिक अर्थ है; ‘संसार के अन्त’ कहने से सम्भावित अर्थ-संकुचन होता।
- source_word: praemia regni
  choice: राज्य के पुरस्कारों
  rationale: बहुवचन praemia को सुरक्षित रखते हुए regni को ‘राज्य के’ रूप में खुला रखा गया है, बिना पुरस्कारों की प्रकृति निर्धारित किए।
theological_decisions:
- issue: gentes का आशय
  choice: अन्यजाति
  alternative: राष्ट्र/जातियाँ
  rationale: निकटवर्ती सन्दर्भ में इस्राएल से भिन्न समूह अभिप्रेत है; फिर भी सामान्य ‘राष्ट्र’ अर्थ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: चरवाहे की पहचान
  choice: केवल ‘तुम्हारा चरवाहा’; किसी व्यक्ति का नाम नहीं जोड़ा
  alternative: स्पष्ट रूप से ‘मसीह’ कहना
  rationale: पाठ चरवाहे को नाम से नहीं पहचानता; अनुवाद उसकी अन्तकालिक भूमिका को रखता है, पर पहचान को व्याख्या द्वारा निश्चित नहीं करता।
- issue: राज्य के पुरस्कार
  choice: बहुवचन और अनिर्दिष्ट रखा
  alternative: एकवचन ‘प्रतिफल’ या ‘स्वर्गीय पुरस्कार’
  rationale: मूल का बहुवचन बनाए रखा गया है और ‘स्वर्गीय’ जैसी अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संबोधनात्मक शैली रखी गई है। ‘बाट जोहो’ प्रतीक्षा की आज्ञा को सहज और साहित्यिक ढंग से व्यक्त करता है। मुख्य पाठ में पादटिप्पणी चिह्न [a] सम्मिलित है।
