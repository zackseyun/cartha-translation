source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: transtulerunt, splendidas tunicas a domino acceperunt. Recipe, Sion, numerum tuum et conclude candidatos tuos, qui legem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/040.yaml
  text: Receive your number[40], Zion, and gather in your white-robed ones[a], who have fulfilled the law of the Lord.
translation:
  language: hi
  text: हे सिय्योन, अपनी संख्या को स्वीकार कर और अपने श्वेत-वस्त्रधारियों को एकत्र कर[a], जिन्होंने प्रभु की व्यवस्था को पूरा किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी शब्द कैंडिडातोस श्वेत या उजले वस्त्र से संबंधित है और सामान्य लातीनी में ‘उम्मीदवार’ भी अर्थ दे सकता है। यहाँ दर्शन के प्रसंग में श्वेत-वस्त्र की छवि अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Recipe
  choice: स्वीकार कर
  rationale: लातीनी क्रिया का सीधा अर्थ ‘ग्रहण कर/स्वीकार कर’ है; आज्ञार्थक भाव बनाए रखते हुए ‘स्वीकार कर’ स्वाभाविक हिन्दी है।
- source_word: numerum tuum
  choice: अपनी गिनी हुई संख्या
  rationale: शाब्दिक अर्थ ‘अपनी संख्या’ है। ‘गिनी हुई’ जोड़ने से दर्शन में निर्धारित लोगों की संख्या का भाव स्पष्ट होता है, पर संख्या को केवल ‘लोगों’ में बदलकर मूल रूपक मिटाया नहीं गया।
- source_word: conclude
  choice: एकत्र कर
  rationale: यहाँ क्रिया का भाव किसी समूह को अपने घेरे में समेटने या इकट्ठा करने का है; ‘एकत्र कर’ प्रसंगानुकूल और सहज है।
- source_word: candidatos tuos
  choice: उजले वस्त्र पहने अपने लोगों
  rationale: candidatos का संबंध candidus, अर्थात चमकीले/उजले श्वेत रंग, से है और यह श्वेत वस्त्रधारी लोगों को सूचित कर सकता है। हिन्दी में वस्त्र-चित्र को स्पष्ट रखते हुए आधुनिक राजनीतिक अर्थ ‘उम्मीदवार’ से बचा गया है।
- source_word: legem domini
  choice: प्रभु की व्यवस्था
  rationale: धार्मिक संदर्भ में lex के लिए ‘व्यवस्था’ प्रतिष्ठित और अर्थपूर्ण हिन्दी पद है; ‘प्रभु’ domini का स्वाभाविक रूप है।
theological_decisions:
- issue: व्यवस्था को पूरा करने का अर्थ
  choice: जिन्होंने प्रभु की व्यवस्था पूरी की है
  alternative: जिन्होंने प्रभु की व्यवस्था का पालन किया है
  rationale: ‘पूरी की है’ मूल के पूर्णता-संबंधी भाव और सम्भावित धार्मिक तनाव को बनाए रखता है; इसे केवल सामान्य आज्ञापालन के अर्थ में सीमित नहीं किया गया।
- issue: candidatos की पहचान
  choice: उजले वस्त्र पहने अपने लोगों
  alternative: अपने उम्मीदवारों / अपने वस्त्रधारियों
  rationale: पाठ स्वयं इन लोगों को नवबपतिस्मा पाए हुए, शहीद या किसी अन्य विशिष्ट वर्ग के रूप में साफ़-साफ़ नहीं पहचानता। इसलिए श्वेत-वस्त्र की दृश्य छवि रखी गई है, पर कोई संप्रदायगत पहचान नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सिय्योन को सीधे संबोधन और दोनों आज्ञार्थक क्रियाओं को एकवचन रूप में रखा गया है।
