    reason: खंडित स्रोत के कारण वाक्य की वास्तविक अपूर्णता स्पष्ट करना।
lexical_decisions:
- source_word: Mortuos
  choice: मृत लोग
  rationale: लैटिन बहुवचन संज्ञात्मक विशेषण का सीधा और सहज अर्थ; संदर्भ में मिले हुए शवों या मृत व्यक्तियों को सूचित करता है।
- source_word: ubi inueneris
  choice: जहाँ कहीं तुम्हें ... मिलें
  rationale: ubi के स्थानवाचक व्यापक भाव और inueneris के अनिश्चित भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: signans
  choice: उन पर चिह्न लगाकर
  rationale: signare के मूल अर्थ ‘चिह्नित करना’ को बनाए रखता है; पाठ यह स्पष्ट नहीं करता कि चिह्न किस प्रकार का है।
- source_word: commenda sepulchro
  choice: उन्हें कब्र में सौंप देना
  rationale: commendare के ‘सौंपना/हवाले करना’ और sepulchrum के दफ़न-स्थान संबंधी अर्थ को औपचारिक पर सुबोध हिन्दी में व्यक्त करता है।
- source_word: et dabo
  choice: और मैं दूँगा—
  rationale: खंडित स्रोत में क्रिया का कर्म आगे अनुपस्थित है; हिन्दी में अधूरे वाक्य को पूरा किए बिना उसी रूप में रखा गया है।
theological_decisions:
- issue: signans में धार्मिक संस्कार या विशिष्ट चिह्न का संभावित संकेत
  choice: सामान्य ‘चिह्न लगाकर’
  alternative: ‘क्रूस का चिह्न लगाकर’ या कोई विशेष धार्मिक रीति
  rationale: उपलब्ध लैटिन में चिह्न का स्वरूप निर्दिष्ट नहीं है; किसी सांप्रदायिक प्रथा को पाठ में जोड़ना अनुचित होगा।
- issue: et dabo का अपूर्ण वचन
  choice: ‘और मैं दूँगा—’ के रूप में अपूर्णता सुरक्षित रखी
  alternative: अगले पद या अनुमान से कर्म जोड़कर वाक्य पूरा करना
  rationale: प्रदान किया गया स्रोत इसी स्थान पर समाप्त होता है; जो दिया जाएगा उसे अनुमान से निर्धारित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘कब्र में सौंप देना’ मूल की औपचारिक अंत्येष्टि-संबंधी अभिव्यक्ति को बनाए रखता है।
