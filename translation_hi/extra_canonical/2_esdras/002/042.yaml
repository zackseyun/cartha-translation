translation:
  language: hi
  text: मैं, एज्रा, ने सिय्योन पर्वत पर एक बड़ी भीड़ देखी, जिसे मैं गिन नहीं सका; और वे सब गीतों के साथ प्रभु की स्तुति कर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ego Ezra
  choice: मैं, एज्रा ने
  rationale: लैटिन में कर्ता पर दिए गए बल को बनाए रखते हुए स्वाभाविक हिन्दी वाक्य-विन्यास अपनाया गया है।
- source_word: in monte Sion
  choice: सिय्योन पर्वत पर
  rationale: स्थानवाचक अर्थ को स्पष्ट और प्रचलित बाइबिलीय नाम-रूप के साथ व्यक्त करता है।
- source_word: turbam magnam
  choice: एक बड़ी भीड़
  rationale: मूल के परिमाण और समूहवाचक अर्थ का सीधा, सहज अनुवाद।
- source_word: quam numerare non potui
  choice: जिसे मैं गिन नहीं सका
  rationale: एज्रा की व्यक्तिगत असमर्थता को मूल के अनुसार बनाए रखता है।
- source_word: canticis conlaudabant dominum
  choice: गीत गाकर प्रभु की स्तुति कर रहे थे
  rationale: canticis के साधनात्मक भाव और conlaudabant की सामूहिक स्तुति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
