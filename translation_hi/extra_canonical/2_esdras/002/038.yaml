  text: उसने स्वर्गीय राज्यों को बुलाया। उठो, खड़े हो जाओ, और संख्या देखो
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: caelestia regna
  choice: स्वर्गीय राज्यों
  rationale: विशेषण और बहुवचन संज्ञा को यथासंभव सीधे बनाए रखा गया है; संदर्भ के अभाव में इसे एकवचन ‘स्वर्गीय राज्य’ नहीं किया गया।
- source_word: uocauit
  choice: उसने ... बुलाया है
  rationale: लातीनी पूर्णकाल को वर्तमान-सम्बद्ध पूर्ण क्रिया से व्यक्त किया गया; कर्ता मूल में अंतर्निहित पुल्लिंग एकवचन है।
- source_word: Surgite et state
  choice: उठो, खड़े हो जाओ
  rationale: दोनों बहुवचन आज्ञार्थक क्रियाओं का क्रम और अलग-अलग बल सुरक्षित रखा गया।
- source_word: uidete numerum
  choice: संख्या देखो
  rationale: खंड जहाँ समाप्त होता है वहाँ ‘संख्या’ के आगे कोई असमर्थित पूरक नहीं जोड़ा गया।
theological_decisions:
- issue: ‘caelestia regna’ का अर्थ और वचन
  choice: स्वर्गीय राज्यों
  alternative: स्वर्गीय राज्य / स्वर्ग का राज्य
  rationale: मूल पाठ में ‘regna’ व्याकरणतः बहुवचन है। प्रचलित धर्मशास्त्रीय पद ‘स्वर्ग का राज्य’ चुनने से मूल का बहुवचन और उसकी संभावित अस्पष्टता मिट जाती।
- issue: ‘uocauit’ में अंतर्निहित कर्ता
  choice: उसने
  alternative: परमेश्वर ने / प्रभु ने
  rationale: लातीनी क्रिया पुल्लिंग/स्त्रीलिंग का भेद नहीं बताती, पर हिन्दी में स्वाभाविक वाक्य के लिए सर्वनाम आवश्यक है; स्पष्ट नाम जोड़ना स्रोत से परे होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और संक्षिप्त हिन्दी। आज्ञार्थक बहुवचन के लिए सामान्य ‘उठो/देखो’ रूप रखे गए हैं। यह पाठ अगले अंश में जारी होने वाला अपूर्ण वाक्य प्रतीत होता है, इसलिए अंत में पूर्णविराम नहीं जोड़ा गया।
