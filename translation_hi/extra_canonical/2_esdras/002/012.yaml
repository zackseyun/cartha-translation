  text: quae praeparaueram illis. Lignum uitae erit illis in odorem unguenti, et non laborabunt neque fatigabuntur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/012.yaml
  text: which I had prepared for them. The tree of life shall be for them as the fragrance of perfume[a], and they shall neither labor nor grow weary.
translation:
  language: hi
  text: जिन्हें मैंने उनके लिए तैयार किया था। जीवन का वृक्ष उनके लिए सुगंधित तेल की महक बन जाएगा[a], और वे न परिश्रम करेंगे, न थकेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीवन का वृक्ष उनके लिए सुगंधित लेप की महक के समान होगा।”
    reason: ‘unguenti’ का अर्थ ‘सुगंधित तेल/इत्र’ के साथ ‘लेप’ भी हो सकता है, और वाक्यांश को तुलनात्मक रूप में समझने की पुरानी परंपरा भी है।
lexical_decisions:
- source_word: quae praeparaueram illis
  choice: जिन्हें मैंने उनके लिए तैयार किया था
  rationale: लैटिन के अपूर्ण संबंधवाचक खंड को पिछले संदर्भ से जोड़ते हुए रखा गया है; स्त्रीलिंग बहुवचन का स्वाभाविक हिन्दी रूप संदर्भगत वस्तुओं के लिए ‘जिन्हें’ है।
- source_word: Lignum uitae
  choice: जीवन का वृक्ष
  rationale: यह स्थापित, स्पष्ट और स्रोत के निकट पदबंध है।
- source_word: in odorem unguenti
  choice: सुगंधित तेल की महक बन जाएगा
  rationale: ‘in odorem’ के परिणाम अथवा विधेयार्थ को ‘बन जाएगा’ से व्यक्त किया गया है; ‘unguentum’ यहाँ सुगंधित तेल/इत्र-सदृश द्रव्य को दर्शाता है, इसलिए केवल औषधीय ‘मलहम’ कहना अनावश्यक रूप से संकीर्ण होता।
- source_word: non laborabunt neque fatigabuntur
  choice: वे न परिश्रम करेंगे, न थकेंगे
  rationale: दोनों निषेधों और सक्रिय कार्य बनाम उससे उत्पन्न थकान के भेद को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: जीवन के वृक्ष और सुगंध के बीच संबंध
  choice: महक बन जाएगा
  alternative: महक के समान होगा
  rationale: लैटिन ‘in odorem’ में स्पष्ट तुलनासूचक शब्द नहीं है; इसलिए मुख्य पाठ परिणाम/विधेय का बल रखता है, जबकि संभावित तुलनात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। आरंभ का अपूर्ण संबंधवाचक खंड जानबूझकर सुरक्षित रखा गया है, क्योंकि स्रोत पद पिछले वाक्य से जुड़ा हुआ है।
