source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et resuscitabo mortuos de locis suis et de monumentis educam illos, quoniam cognoui nomen meum in illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/016.yaml
  text: And I will raise the dead from their places[16], and I will bring them out from the tombs[a], because I have known my name in them.
translation:
  language: hi
  text: और मैं मरे हुओं को उनके स्थानों से जिलाऊँगा और उन्हें कब्रों से बाहर निकालूँगा, क्योंकि मैंने उनमें अपना नाम पहचाना है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी वाक्य का शाब्दिक अर्थ ‘क्योंकि मैंने उनमें अपना नाम जाना है’ भी हो सकता है। कथन असामान्य है; इसे ‘क्योंकि उनमें मेरा नाम जाना जाता है’ या अनुमानित पाठ-संशोधन के आधार पर ‘क्योंकि उन्होंने मेरा नाम जाना है’ भी समझा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: resuscitabo
  choice: जिलाऊँगा
  rationale: भविष्यकालीन प्रथम पुरुष क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और मृतकों को फिर जीवन देने का अर्थ सुरक्षित रखता है।
- source_word: de locis suis
  choice: उनके स्थानों से
  rationale: लातीनी बहुवचन और संबंधवाचक भाव को बिना अनावश्यक व्याख्या के निकटता से बनाए रखता है।
- source_word: monumentis
  choice: कब्रों
  rationale: इस प्रसंग में monumenta मृतकों के दफन-स्थानों या समाधियों को सूचित करता है; ‘कब्रों’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: cognoui
  choice: मैंने ... पहचाना है
  rationale: लातीनी पूर्णकाल cognoui के पूर्ण क्रियाभाव को बनाए रखते हुए ‘अपने नाम को उनमें पहचानना’ वाला संभव अर्थ देता है; यह असामान्य वाक्य को पलटकर ‘उन्होंने मेरे नाम को जाना’ नहीं बनाता।
theological_decisions:
- issue: परमेश्वर द्वारा ‘अपना नाम’ लोगों में जानने/पहचानने का असामान्य कथन
  choice: क्योंकि मैंने उनमें अपने नाम को पहचाना है
  alternative: क्योंकि उनमें मेरा नाम जाना जाता है; अथवा क्योंकि उन्होंने मेरे नाम को जाना है
  rationale: उपलब्ध लातीनी पाठ का कर्ता प्रथम पुरुष परमेश्वर है और कर्म ‘मेरा नाम’ है। मुख्य पाठ इसी व्याकरणिक तनाव को सुरक्षित रखता है तथा अधिक सुगम वैकल्पिक अर्थों को चुपचाप आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और स्रोत के निकट है। ‘कब्रों’ को सामान्य बोधगम्यता के लिए चुना गया है। अंतिम उपवाक्य की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी में सुरक्षित रखी गई है।
