  yaml_path: translation/extra_canonical/2_esdras/002/047.yaml
  text: He answered and said to me[47], “He is the Son of God, whom they confessed in the age.” Then I began to magnify those who had stood bravely for the name of the Lord.
translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “वह परमेश्वर का पुत्र है, जिसका उन्होंने संसार में अंगीकार किया था।”[a] तब मैं उन लोगों की प्रशंसा करने लगा, जो प्रभु के नाम के लिए साहस से डटे रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मुकुटधारी व्यक्ति की ‘परमेश्वर का पुत्र’ के रूप में यह स्पष्ट पहचान इस अध्याय की बाद की मसीही रचनात्मक परत की एक विशेषता है। इसलिए इसे अध्याय 3–14 के यहूदी प्रकाशन-साहित्य में बिना आलोचनात्मक सावधानी के वापस नहीं पढ़ना चाहिए।
    reason: compositional_layer
lexical_decisions:
- source_word: filius dei
  choice: परमेश्वर का पुत्र
  rationale: लातीनी पद का सीधा और स्वाभाविक हिन्दी रूप; व्यक्तित्व और संबंध—दोनों को स्पष्ट रखता है।
- source_word: in saeculo
  choice: इस युग में
  rationale: saeculum के काल-संबंधी अर्थ को सुरक्षित रखता है; इसे बिना आवश्यकता केवल ‘संसार में’ नहीं बनाता।
- source_word: confessi sunt
  choice: स्वीकार किया था
  rationale: यहाँ उन लोगों द्वारा परमेश्वर के पुत्र को खुले रूप से मानने/स्वीकार करने का भाव है; ‘अंगीकार किया’ भी संभव है, पर ‘स्वीकार किया’ सामान्य पाठक के लिए अधिक सहज है।
- source_word: magnificare
  choice: प्रशंसा करने
  rationale: व्यक्तियों के संदर्भ में ‘महिमा बढ़ाने’ की अपेक्षा ‘प्रशंसा करने’ स्वाभाविक हिन्दी है और सम्मान प्रकट करने का आशय देता है।
- source_word: fortiter steterunt
  choice: साहस से डटे रहे थे
  rationale: स्थिर खड़े रहने और वीरतापूर्वक सहने—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मुकुटधारी व्यक्ति की पहचान
  choice: ‘परमेश्वर का पुत्र’ को स्पष्ट कथन के रूप में रखा गया है
  alternative: इसे किसी सामान्य ‘परमेश्वर के जन’ या मसीही उपाधि से नरम करना
  rationale: स्रोत में ipse est filius dei स्पष्ट है; अनुवाद को इस पहचान को न तो कमजोर करना चाहिए, न उससे आगे कोई सांप्रदायिक व्याख्या जोड़नी चाहिए।
- issue: confessi sunt का धार्मिक भाव
  choice: ‘स्वीकार किया था’
  alternative: ‘जिसका उन्होंने अंगीकार किया था’
  rationale: दोनों संभव हैं; चुना हुआ रूप सार्वजनिक विश्वास-स्वीकार के भाव को साधारण आधुनिक हिन्दी में रखता है, बिना बाद की धर्मशास्त्रीय शब्दावली थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। उपलब्ध उद्धृत लातीनी पाठ अंतिम qui पर कट जाता है; अंतिम उपवाक्य का अनुवाद समीक्षित अंग्रेज़ी पाठ और पद के प्रमाणित पूर्ण लातीनी पाठ ‘qui pro nomine Domini fortiter steterunt’ के अनुरूप रखा गया है।
