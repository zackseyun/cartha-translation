  text: fructibus Et totidem fontes fluentes lac et mel et montes inmensos septem habentes rosam et lilium, in quibus gaudio replebo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/019.yaml
  text: and as many springs flowing with milk and honey[a], and seven mighty mountains having roses and lilies, in which I will fill your children with joy.
translation:
  language: hi
  text: और फल, तथा दूध और मधु से बहते हुए उतने ही सोते, और गुलाब और सोसन वाले सात विशाल पर्वत होंगे; उनमें मैं आनन्द से भर दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fontes fluentes lac et mel
  choice: सोते होंगे, जिनमें दूध और मधु बहेंगे
  rationale: ‘fontes’ के लिए सहज आधुनिक हिन्दी ‘सोते’ है; ‘fluentes’ को संबंधवाचक उपवाक्य में रखकर दूध और मधु के बहने का चित्र स्पष्ट रखा गया है।
- source_word: montes inmensos septem
  choice: सात विशाल पर्वत
  rationale: ‘inmensos’ का स्वाभाविक और गरिमापूर्ण समतुल्य ‘विशाल’ है।
- source_word: rosam et lilium
  choice: गुलाब और सोसन
  rationale: लैटिन एकवचन यहाँ वनस्पतियों के सामूहिक अर्थ में है, इसलिए हिन्दी में जातिवाचक रूप स्वाभाविक है; ‘lilium’ के लिए बाइबलीय हिन्दी में परिचित ‘सोसन’ चुना गया है।
- source_word: gaudio replebo
  choice: आनन्द से भर दूँगा
  rationale: लैटिन के साधन/वस्तु-सूचक ablative ‘gaudio’ और क्रिया ‘replebo’ का सीधा, स्वाभाविक प्रतिरूप है।
theological_decisions:
- issue: ‘habentes rosam et lilium’ का संबंध
  choice: मुख्य पाठ में इसे सात पर्वतों से जोड़ा गया है
  alternative: इसे सोतों और पर्वतों दोनों से, अथवा केवल सोतों से, संबंधित समझना
  rationale: निकटतम पूर्वपद ‘montes inmensos septem’ है, इसलिए पर्वतों से संबंध सबसे स्वाभाविक है; फिर भी लैटिन के बहुवचन ‘habentes’ के कारण व्याकरणिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘in quibus’ का पूर्वपद
  choice: ‘उनमें’ द्वारा पर्वतों की ओर संकेत
  alternative: इसे पूरे पूर्ववर्ती दृश्य या सोतों की ओर संकेत मानना
  rationale: निकटतम संगत बहुवचन पूर्वपद ‘montes’ है; हिन्दी में ‘उनमें’ मूल की स्थानवाचक अस्पष्टता को अत्यधिक व्याख्यायित किए बिना बनाए रखता है।
- issue: लैटिन स्रोत में ‘तुम्हारी सन्तानों को’ का स्पष्ट अभाव
  choice: अंग्रेज़ी परामर्श-पाठ और पद के पाठ-संदर्भ के आधार पर मुख्य पाठ में रखा, पर पादटिप्पणी से पारदर्शी बनाया
  alternative: 'कर्म को केवल निहित छोड़ना: ‘मैं आनन्द से भर दूँगा’'
  rationale: दिए गए लैटिन अंश में ‘replebo’ का कर्म नहीं है और वाक्य अधूरा लगता है; परामर्श-पाठ ‘your children’ को सुरक्षित रखता है। स्रोतगत स्थिति छिपाने के बजाय पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘सन्तानों’ से संबोधन का व्यापक पारिवारिक अर्थ और बाइबलीय स्वर दोनों बने रहते हैं; ‘सोसन’ पारंपरिक बाइबलीय पुष्प-नाम है।
