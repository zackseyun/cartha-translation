source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nemo ex eis interiet, ego enim eos requiram de numero tuo, Noli satagere, cum uenerit enim dies pressurae et angustiae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/026.yaml
  text: None of them will perish[a], for I will require them from your number. Do not be anxious, for when the day of distress and anguish comes,
translation:
  language: hi
  text: उनमें से कोई भी नष्ट नहीं होगा,[a] क्योंकि मैं तेरी गिनती में से उन्हें माँगूँगा। चिंता मत कर, क्योंकि जब संकट और व्यथा का दिन आएगा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मैं तेरी गिनती में से उन्हें माँगूँगा” का अनुवाद “मैं तेरी गिनती में से उन्हें ढूँढ़ निकालूँगा” भी किया जा सकता है।
    reason: Latin requiram में ‘माँगना/दावा करना’ और ‘ढूँढ़ना’ दोनों संभावित हैं; मुख्य पाठ में संदर्भानुकूल पहले अर्थ को रखा गया है।
lexical_decisions:
- source_word: interiet
  choice: नाश न होगा
  rationale: Latin interire का अर्थ ‘नष्ट होना/नाश होना’ है; यहाँ भविष्यकाल और निषेध को स्पष्ट रखा गया है।
- source_word: requiram
  choice: खोजूँगा
  rationale: requirere यहाँ ‘ढूँढ़ना, खोजकर देखना’ का भाव दे सकता है। ‘माँगूँगा’ या ‘हिसाब लूँगा’ भी संभव हैं, इसलिए अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: de numero tuo
  choice: तेरी गिनती में
  rationale: Latin पदबंध का निकट और संदर्भ-संगत रूप; यह उन लोगों के समूह की ओर संकेत करता है जो संबोधित व्यक्ति की गिनती में हैं।
- source_word: pressurae et angustiae
  choice: संकट और व्यथा
  rationale: दोनों निकटार्थक Latin संज्ञाओं का अलग-अलग भार बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: Noli satagere
  choice: चिन्ता मत कर
  rationale: मुहावरे का आशय अत्यधिक व्याकुल या चिंतित न होने की आज्ञा है।
theological_decisions:
- issue: ego enim eos requiram de numero tuo में जवाबदेही या खोज का भाव
  choice: मैं उन्हें तेरी गिनती में खोजूँगा
  alternative: मैं उन्हें तेरी गिनती में से माँगूँगा / मैं उनका हिसाब तुझसे लूँगा
  rationale: Latin requiram बहुअर्थी है। मुख्य पाठ में खोजने का सीधा भाव रखा गया है और अधिक न्यायिक अर्थ को अनिवार्य नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिन्दी; एकवचन निकट संबोधन के लिए ‘तेरी’ और ‘कर’ रखा गया है। पद स्रोत के अनुसार अधूरे वाक्य पर समाप्त होता है, इसलिए अंत में अल्पविराम बनाए रखा गया है।
