  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et in medio eorum erat iuuenis statura celsus, eminentior omnibus illis, et singulis eorum capitibus inponebat coronas, et magis exaltabatur: ego autem miracul[o] tenebar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/043.yaml
  text: And in the midst of them was a young man of lofty stature, taller than all the rest, and he was placing crowns on the heads of each one of them, and he was more exalted still; and I was held in wonder.
translation:
  language: hi
  text: और उनके बीच एक ऊँचे कद का युवक था, जो उन सब से अधिक ऊँचा था। वह उनमें से हर एक के सिर पर मुकुट रख रहा था, और उसे और भी अधिक ऊँचा किया जा रहा था। मैं विस्मय से भर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuuenis
  choice: युवक
  rationale: लैटिन शब्द का सीधा और आधुनिक हिन्दी समतुल्य।
- source_word: statura celsus
  choice: ऊँचे कद का
  rationale: शारीरिक कद की ऊँचाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: eminentior omnibus illis
  choice: उन सब से अधिक ऊँचा
  rationale: तुलनात्मक अर्थ को बनाए रखता है और निकटवर्ती कद-वर्णन के अनुरूप है।
- source_word: singulis eorum capitibus inponebat coronas
  choice: उनमें से हर एक के सिर पर मुकुट रख रहा था
  rationale: singulis का प्रत्येक व्यक्ति वाला भाव और capitibus का वितरणात्मक अर्थ स्पष्ट रूप से व्यक्त होता है।
- source_word: magis exaltabatur
  choice: स्वयं और भी अधिक ऊँचा दिखाई दे रहा था
  rationale: exaltabatur की अस्पष्टता—ऊँचा होना, ऊँचा उठना या महिमान्वित दिखना—को किसी विशिष्ट धर्मवैज्ञानिक अर्थ में सीमित किए बिना दृश्य वर्णन के रूप में रखा गया है।
- source_word: miraculo tenebar
  choice: विस्मय से भर गया
  rationale: शाब्दिक ‘विस्मय से पकड़ा गया’ की अपेक्षा आधुनिक हिन्दी का स्वाभाविक प्रयोग, जबकि प्रबल आश्चर्य का भाव सुरक्षित है।
theological_decisions:
- issue: magis exaltabatur का आशय
  choice: स्वयं और भी अधिक ऊँचा दिखाई दे रहा था
  alternative: उसकी महिमा और भी बढ़ती जाती थी
  rationale: लैटिन exaltabatur शारीरिक ऊँचाई और प्रतिष्ठा/महिमा दोनों का संकेत दे सकता है। प्रसंग में कद का उल्लेख निकट है, इसलिए दृश्य अर्थ रखा गया, पर ‘दिखाई दे रहा था’ के द्वारा इसे कठोर रूप से केवल शारीरिक परिवर्तन नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए लैटिन के लंबे वाक्य को तीन वाक्यों में बाँटा गया है।
