base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/029.yaml
  text: Mother, with your children, because I will deliver you, says the Lord.
translation:
  language: hi
  text: “हे माँ, अपने बच्चों के साथ, क्योंकि मैं तुझे छुड़ाऊँगा,” प्रभु कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mater
  choice: हे माँ
  rationale: लैटिन में यह संबोधन है; ‘हे माँ’ आधुनिक, सहज और मूल के संबोधन-भाव के अनुरूप है।
- source_word: filiis tuis
  choice: अपने बच्चों
  rationale: filiis का अर्थ संदर्भ में संतान/बच्चे है; ‘बच्चों’ में पुत्र-पुत्रियाँ दोनों स्वाभाविक रूप से सम्मिलित हो सकते हैं।
- source_word: eripiam
  choice: छुड़ाऊँगा
  rationale: यह भविष्यकालीन उद्धार या संकट से निकालने का भाव व्यक्त करता है, बिना संकट का स्वरूप जोड़े।
- source_word: dominus
  choice: प्रभु
  rationale: ईश्वरीय उपाधि dominus का प्रचलित और गरिमापूर्ण हिन्दी समतुल्य।
theological_decisions:
- issue: वाक्य का अपूर्ण या खंडित रूप
  choice: मूल के ‘हे माँ, अपने बच्चों के साथ’ को बिना कोई आज्ञा या क्रिया जोड़े रखा गया
  alternative: ‘हे माँ, अपने बच्चों के साथ आनन्द मना’ अथवा कोई अन्य निहित क्रिया जोड़ना
  rationale: प्रदत्त लैटिन पाठ में ऐसी क्रिया नहीं है। मूल की वास्तविक अपूर्णता को चुपचाप पूरा करना पाठ में ऐसी बात जोड़ देता जो स्रोत में नहीं है।
- issue: द्वितीय पुरुष एकवचन का संकेत
  choice: ‘तुझे’
  alternative: ‘तुम्हें’ या ‘तुम लोगों को’
  rationale: te एकवचन है और सीधे ‘माँ’ को संबोधित करता है; ‘तुझे’ उस व्याकरणिक संबंध को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल और गरिमापूर्ण रखी गई है। स्रोत-वाक्य की असामान्य खंडित संरचना जानबूझकर सुरक्षित है; कोई अप्राप्त क्रिया, जैसे ‘आनन्द मना’, नहीं जोड़ी गई।
