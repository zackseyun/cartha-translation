  text: and I will show mercy to them, because I am merciful, says the Lord Almighty.
translation:
  language: hi
  text: और मैं उन पर दया करूँगा, क्योंकि मैं दयालु हूँ, सर्वशक्तिमान प्रभु कहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misericordiam cum illis faciam
  choice: मैं उन पर दया करूँगा
  rationale: लातीनी मुहावरे ‘उनके साथ दया करना’ का स्वाभाविक हिन्दी रूप; भविष्यकाल को सुरक्षित रखा गया है।
- source_word: misericors
  choice: दयालु
  rationale: परमेश्वर के करुणामय स्वभाव को सरल, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: dominus omnipotens
  choice: सर्वशक्तिमान प्रभु
  rationale: दोनों उपाधियों का सीधा और प्रचलित हिन्दी प्रतिरूप।
theological_decisions:
- issue: दया के कार्य और दयालु स्वभाव के बीच कारण-संबंध
  choice: ‘क्योंकि मैं दयालु हूँ’
  alternative: ‘इसलिए कि मैं करुणामय हूँ’
  rationale: quoniam के स्पष्ट कारण-संबंध और misericordiam/misericors की शब्दगत पुनरावृत्ति को यथासंभव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठकों के लिए सहज, पर शास्त्रीय गरिमा युक्त। उपलब्ध लातीनी अंश के आरंभिक ‘latibulis terrae et’ और अंतिम ‘Amplectere natos’ को पद-सीमा से बाहर मानकर शामिल नहीं किया गया, जैसा परामर्श-पाठ की सीमा से भी पुष्ट होता है।
