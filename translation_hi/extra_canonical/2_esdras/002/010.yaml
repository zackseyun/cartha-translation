translation:
  language: hi
  text: 'प्रभु एज्रा से यह कहता है: “मेरी प्रजा को यह घोषणा कर कि मैं उन्हें यरूशलेम का राज्य दूँगा, जिसे मैं इस्राएल को देने वाला था।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntia
  choice: घोषणा कर
  rationale: लैटिन क्रिया का सार्वजनिक रूप से संदेश सुनाने का भाव स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: populo meo
  choice: मेरी प्रजा
  rationale: वाचा-संबंधी सामूहिक अर्थ को आधुनिक, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: regnum Hierusalem
  choice: यरूशलेम का राज्य
  rationale: स्रोत की असामान्य किंतु स्पष्ट पदावली को बिना उसकी संभावित अस्पष्टता मिटाए निकटता से प्रस्तुत करता है।
- source_word: quod daturus eram
  choice: जिसे मैं ... देने वाला था
  rationale: परिधीय अपूर्ण भूतकालीन रचना के आशयित अतीत के इरादे को सीधे बनाए रखता है।
theological_decisions:
- issue: ‘मेरी प्रजा’ और ‘इस्राएल’ के बीच संबंध
  choice: दोनों पदों को स्रोत के अनुसार अलग रखा गया है
  alternative: ‘मेरी प्रजा अर्थात इस्राएल’ कहकर दोनों की पहचान स्पष्ट करना
  rationale: मूल पाठ इनके संबंध को स्पष्ट नहीं करता; इसलिए उसकी वास्तविक धर्मवैचारिक तनातनी और अस्पष्टता को सुलझाया नहीं गया।
- issue: ‘यरूशलेम का राज्य’ का अर्थ
  choice: शाब्दिक-सुगम रूप ‘यरूशलेम का राज्य’
  alternative: ‘यरूशलेम में राज्य’ या ‘यरूशलेम का राज’
  rationale: मूल संबंधकारक संरचना को सुरक्षित रखा गया है और किसी विशिष्ट व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गरिमापूर्ण भविष्यद्वाणी-संबंधी कथन। ईश्वरीय वचन के लिए उद्धरण-चिह्न जोड़े गए हैं, पर अर्थ में कोई विस्तार नहीं किया गया।
