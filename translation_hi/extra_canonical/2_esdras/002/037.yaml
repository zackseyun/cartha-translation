base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/037.yaml
  text: Receive the joy of your glory from the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.
translation:
  language: hi
  text: प्रभु से अपनी महिमा का आनंद ग्रहण करो[a] और आनंदित होओ; उसका धन्यवाद करो, जिसने तुम्हें स्वर्गीय राज्यों के लिए बुलाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लैटिन अंश वाक्य के बीच से, “प्रभु का/से … ग्रहण करो,” आरम्भ होता है; ग्रहण की जाने वाली वस्तु के शब्द उसमें सुरक्षित नहीं हैं। “अपनी महिमा का आनंद” निकटवर्ती संदर्भ और परामर्श-पाठ के आधार पर दिया गया है।
    reason: उपलब्ध मूल-पाठ की अपूर्णता और उससे उत्पन्न वास्तविक पाठगत अनिश्चितता को पाठक के सामने रखना।
lexical_decisions:
- source_word: domini
  choice: प्रभु से
  rationale: प्राप्ति के संबंध को स्वाभाविक हिन्दी में स्रोत/दाता के रूप में व्यक्त किया गया है; पर उपलब्ध लैटिन अंश वाक्य के बीच से आरम्भ होता है, इसलिए निकटवर्ती लुप्त शब्दों पर पाठ-संदेह बना रहता है।
- source_word: accipite
  choice: पाओ
  rationale: बहुवचन आज्ञार्थक ‘ग्रहण करो/प्राप्त करो’ का सहज आधुनिक हिन्दी रूप; ‘आनंद’ के साथ ‘पाओ’ अधिक स्वाभाविक है।
- source_word: iocundamini
  choice: मगन हो जाओ
  rationale: ‘आनंदित होओ’ की अपेक्षा बोलचाल में समझ आने वाला, पर गरिमापूर्ण बहुवचन आज्ञार्थक रूप।
- source_word: gratias agentes ei
  choice: उसका धन्यवाद करो
  rationale: लैटिन कृदन्तीय वाक्यांश का स्वाभाविक हिन्दी आज्ञार्थक रूप, जो मुख्य आज्ञा के साथ चल रही कृतज्ञता को व्यक्त करता है।
- source_word: ad [caelestia regna]
  choice: स्वर्गीय राज्यों में
  rationale: दिए गए लैटिन का अंतिम ‘ad’ आगे आने वाले लक्ष्य को सूचित करता है; परामर्श-पाठ में सुरक्षित शेष वाक्यांश के आधार पर बहुवचन ‘स्वर्गीय राज्यों’ रखा गया है।
theological_decisions:
- issue: बुलाहट का लक्ष्य
  choice: स्वर्गीय राज्यों में बुलाया है
  alternative: स्वर्गीय राज्य के लिए बुलाया है
  rationale: परामर्श-पाठ और संभावित लैटिन ‘regna’ के बहुवचन को बनाए रखा गया है; इसे किसी एक व्यवस्थित धर्मवैज्ञानिक धारणा में नहीं बदला गया।
- issue: प्राप्त की जाने वाली वस्तु
  choice: अपनी महिमा का आनंद
  alternative: प्रभु की सौंपी हुई वस्तु/प्रभु का वरदान
  rationale: दिया गया लैटिन अंश ‘domini accipite’ से पहले का कर्म छोड़ देता है। अंग्रेज़ी परामर्श-पाठ और नवीन पाठ-समीक्षा ‘अपनी महिमा का आनंद’ का समर्थन करते हैं, किंतु अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक संबोधन रखा गया है। ‘आनंद पाओ’ और ‘मगन हो जाओ’ अर्थ की पुनरावृत्ति को बनाए रखते हैं, क्योंकि लैटिन में भी ग्रहण करने और आनंदित होने की अलग-अलग क्रियाएँ हैं।
