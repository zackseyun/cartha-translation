id: 2ES.2.18
reference: 2 Esdras 2:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Mittam tibi adiutorium pueros meos Isaiam et Hieremiam, ad quorum consilium sanctificaui et paraui tibi arbores xii grauatās uariis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/018.yaml
  text: I will send you help—my servants Isaiah and Jeremiah. By their counsel I have sanctified and prepared for you twelve trees laden with various fruits,
translation:
  language: hi
  text: मैं तेरी सहायता के लिए अपने सेवकों यशायाह और यिर्मयाह को भेजूँगा। उनकी सलाह से मैंने तेरे लिए भाँति-भाँति के फलों से लदे बारह वृक्ष पवित्र ठहराकर और तैयार किए हैं,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adiutorium
  choice: सहायता के लिए
  rationale: लैटिन में भाववाचक संज्ञा है; प्रसंग में यशायाह और यिर्मयाह को भेजना सहायता का साधन है। हिंदी में यह प्रयोग स्वाभाविक रहते हुए मूल अर्थ बनाए रखता है।
- source_word: pueros meos
  choice: अपने सेवकों
  rationale: puer यहाँ केवल आयु-सूचक ‘बालक’ नहीं, अधीनस्थ सेवक या परिचारक का अर्थ देता है; यशायाह और यिर्मयाह के लिए ‘सेवक’ अधिक उपयुक्त और गरिमापूर्ण है।
- source_word: ad quorum consilium
  choice: उनकी सम्मति के अनुसार
  rationale: ad के साथ consilium का संबंध उद्देश्य, निर्देशन या परामर्शानुसार होने का भाव दे सकता है। ‘सम्मति के अनुसार’ इस संबंध को अनावश्यक रूप से अधिक स्पष्ट किए बिना व्यक्त करता है।
- source_word: sanctificaui
  choice: पवित्र करके
  rationale: sanctificare का धार्मिक अर्थ सुरक्षित रखा गया है; इसे केवल ‘अलग किया’ या ‘समर्पित किया’ कहकर धर्मवैचारिक तनाव को हल नहीं किया गया।
- source_word: paraui tibi
  choice: तेरे लिए ... तैयार किए हैं
  rationale: पूर्ण क्रिया का हिंदी में स्वाभाविक परिणामात्मक रूप है और हितार्थक tibi स्पष्ट रहता है।
- source_word: arbores xii grauatās uariis
  choice: भाँति-भाँति के फलों से लदे बारह वृक्ष
  rationale: उपलब्ध लैटिन पंक्ति uariis पर अपूर्ण प्रतीत होती है, जबकि अंग्रेज़ी परामर्श-पाठ और वाक्य-संदर्भ में ‘विभिन्न फलों’ का आशय है। ‘लदे’ gravatas का दृश्य और भार-सूचक भाव बनाए रखता है।
theological_decisions:
- issue: यशायाह और यिर्मयाह की भूमिका
  choice: उनकी सम्मति के अनुसार
  alternative: उनके परामर्श के लिए
  rationale: मूल ad quorum consilium संबंध में कुछ लचीलापन रखता है। चुना हुआ रूप उन्हें वृक्षों को पवित्र करने वाले स्वतंत्र कर्ता नहीं बनाता, और न ही उनके परामर्श की प्रकृति को सिद्धान्तगत रूप से तय करता है।
- issue: वृक्षों का पवित्रीकरण
  choice: मैंने ... पवित्र करके तैयार किए हैं
  alternative: मैंने ... अलग करके तैयार किए हैं
  rationale: मूल में परमेश्वर कर्ता है और sanctificaui स्पष्ट धार्मिक शब्द है; इसलिए ‘पवित्र’ को बनाए रखना अधिक स्रोत-संगत है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। एकवचन संबोधन के लिए ‘तेरी/तेरे’ रखा गया है। पद अगले वाक्यांश में जारी होने के कारण अंत में अल्पविराम रखा गया है।
