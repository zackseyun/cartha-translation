  text: Those who have passed over from the shadow of the age have received splendid garments from the Lord[a].
translation:
  language: hi
  text: जो लोग युग[a] की छाया से निकल गए, उन्होंने प्रभु से उज्ज्वल वस्त्र पाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘संसार’। लैटिन शब्द का अर्थ ‘युग’ या ‘संसार’ दोनों हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Qui
  choice: जो लोग
  rationale: यह संबंधवाचक पद पूरे उपवाक्य को मुख्य क्रिया का कर्ता बनाता है; हिन्दी में स्वतंत्र वाक्य के रूप में ‘जो लोग… उन्होंने…’ स्वाभाविक और व्याकरणसम्मत है।
- source_word: se ... transtulerunt
  choice: पार निकल गए हैं
  rationale: शाब्दिक अर्थ ‘अपने आपको स्थानांतरित किया’ है, पर छाया से बाहर आने या पार जाने की गति को वर्तमान हिन्दी में यह रूप स्वाभाविक ढंग से व्यक्त करता है।
- source_word: umbra saeculi
  choice: इस युग की छाया
  rationale: ‘saeculum’ का प्राथमिक अर्थ यहाँ ‘युग’ रखा गया है; ‘छाया’ रूपक की अस्पष्टता और धार्मिक तनाव को ज्यों का त्यों बनाए रखती है।
- source_word: splendidas tunicas
  choice: उज्ज्वल वस्त्र
  rationale: ‘splendidas’ की चमक और गौरव दोनों का संकेत ‘उज्ज्वल’ देता है; ‘tunicas’ को सामान्य पाठक के लिए संकीर्ण परिधान-नाम के बजाय ‘वस्त्र’ कहा गया है।
- source_word: a domino acceperunt
  choice: प्रभु से ... पाए हैं
  rationale: लैटिन में प्रभु वस्त्रों का स्रोत/दाता है। ‘पाए हैं’ हिन्दी में प्राप्ति को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘saeculi’ का अर्थ
  choice: युग
  alternative: संसार
  rationale: दोनों अर्थ संभव हैं। मुख्य पाठ में ‘युग’ मूल शब्द के काल-संबंधी अर्थ और अंग्रेज़ी परामर्श-पाठ के अनुरूप है; वैकल्पिक अर्थ फुटनोट में सुरक्षित रखा गया है।
- issue: वाक्य की स्वतंत्रता
  choice: इसे स्वतंत्र कथन के रूप में प्रस्तुत किया गया है
  alternative: पिछले वाक्य से जोड़कर ‘और जिन्होंने...’
  rationale: ‘Qui ... transtulerunt’ मुख्य क्रिया ‘acceperunt’ का कर्ता है; मूल में जोड़ने वाला ‘और’ नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जो लोग… उन्होंने…’ संरचना लैटिन के संबंधवाचक कर्ता और स्वतंत्र मुख्य वाक्य को स्पष्ट करती है; रूपक को समझाकर समाप्त नहीं किया गया है।
