  source_fidelity: 'The Hindi accurately follows the Latin: the Lord brought this people out of slavery, gave them commandments through his prophetic servants, they refused to hear those prophets, and they rendered his consilia ineffective. The explicit repetition of “उन नबियों” correctly preserves quos as referring to the prophets.'
