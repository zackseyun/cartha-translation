id: 2ES.2.1
reference: 2 Esdras 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus : ego eduxi populum istum de seruitute, quibus mandata dedi per pueros meos prophetas, quos audire noluerunt, sed irrita fecerunt mea consilia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/001.yaml
  text: 'Thus says the Lord: I brought this people out of slavery[a], and I gave them commandments through my servants the prophets, whom they were unwilling to hear, but they made my counsels void.'
translation:
  language: hi
  text: 'प्रभु यह कहता है: मैं इस प्रजा को दासता से निकाल लाया और मैंने अपने सेवक नबियों के द्वारा उन्हें आज्ञाएँ दीं। वे उन नबियों की सुनना नहीं चाहते थे, बल्कि उन्होंने मेरी योजनाओं को निष्फल कर दिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruitute
  choice: दासता
  rationale: लैटिन शब्द बंधुआ अधीनता या गुलामी की अवस्था को दर्शाता है; ‘दासता’ आधुनिक, गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: pueros meos prophetas
  choice: अपने सेवक नबियों
  rationale: यहाँ pueros संबंधसूचक धार्मिक प्रयोग में परमेश्वर के सेवकों को दर्शाता है; ‘सेवक’ हिन्दी में इस भूमिका को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘दास’ इस लैटिन पद के संदर्भगत अर्थ को अनावश्यक रूप से संकुचित कर सकता है।
- source_word: quos audire noluerunt
  choice: वे उन नबियों की सुनना नहीं चाहते थे
  rationale: quos का स्पष्ट संबंध नबियों से है। हिन्दी में संज्ञा को दोहराने से यह संबंध साफ रहता है और मूल का सक्रिय अनिच्छा-बोध सुरक्षित रहता है।
- source_word: irrita fecerunt mea consilia
  choice: उन्होंने मेरी योजनाओं को निष्फल कर दिया
  rationale: consilia यहाँ संकल्पों, योजनाओं या परामर्शों का द्योतक हो सकता है। ‘योजनाएँ’ प्रसंग में स्वाभाविक है और irrita fecerunt की विफल या निष्फल करने वाली शक्ति को बनाए रखता है।
theological_decisions:
- issue: मनुष्यों द्वारा परमेश्वर की योजनाओं को निष्फल करने का कथन
  choice: मूल के सीधे कथन ‘मेरी योजनाओं को निष्फल कर दिया’ को बनाए रखा गया।
  alternative: ‘मेरी सलाह को ठुकरा दिया’ या ‘मेरे निर्देशों की उपेक्षा की’
  rationale: वैकल्पिक रूप theological tension को कम कर देते और irrita fecerunt की शक्ति को नरम कर देते। अनुवाद मूल कथन को किसी व्यवस्थित धर्मवैज्ञानिक निष्कर्ष के अनुसार नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण भविष्यद्वक्तीय शैली रखी गई है। लंबे लैटिन वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, पर कारण-क्रम और sed का विरोधात्मक बल ‘बल्कि’ द्वारा सुरक्षित है।
