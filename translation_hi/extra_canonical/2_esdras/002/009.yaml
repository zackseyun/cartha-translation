id: 2ES.2.9
reference: 2 Esdras 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'memorare quid fecerim Sodomae et Gomorrae, Quorum terra iacet in picis glebis et aggeribus cinerum: sic dabo eos qui me non audierunt, dicit dominus omnipotens.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/009.yaml
  text: Remember what I did to Sodom and Gomorrah[a], whose land lies in clods of pitch and heaps of ashes. So I will give those who did not listen to me, says the Lord Almighty.
translation:
  language: hi
  text: याद करो कि मैंने सदोम और अमोरा के साथ क्या किया था, जिनकी भूमि तारकोल के ढेलों और राख के ढेरों में पड़ी है। सर्वशक्तिमान प्रभु कहता है, जिन्होंने मेरी बात नहीं सुनी, उनके साथ भी मैं ऐसा ही करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: memorare
  choice: याद करो
  rationale: लातीनी आज्ञार्थक का सीधा, स्वाभाविक और वर्तमान हिन्दी रूप।
- source_word: Sodomae et Gomorrae
  choice: सदोम और अमोरा का
  rationale: यहाँ fecerim के साथ नगरों पर किए गए कार्य का भाव है; हिन्दी में ‘का क्या किया था’ इस संरचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: picis glebis
  choice: तारकोल के ढेलों
  rationale: pix के काले, ज्वलनशील तारकोल/डामर-सदृश पदार्थ और glebae के ढेलों का ठोस विनाश-दृश्य सुरक्षित रहता है।
- source_word: aggeribus cinerum
  choice: राख के ढेरों
  rationale: aggeres के संचित ढेर और cinerum की राख का स्पष्ट, मूर्त अनुवाद।
- source_word: sic dabo eos
  choice: उनके साथ भी मैं ऐसा ही करूँगा
  rationale: शाब्दिक ‘मैं उन्हें ऐसा दूँगा’ हिन्दी में अस्वाभाविक और अस्पष्ट है। उत्तरकालीन लातीनी dare के facere-सदृश प्रयोग तथा पहले आए quid fecerim के समानांतर विनाशकारी कार्रवाई को यह रूप स्वाभाविक ढंग से व्यक्त करता है।
- source_word: qui me non audierunt
  choice: जो मेरी नहीं सुनते
  rationale: audire यहाँ केवल ध्वनि सुनने के बजाय बात मानने/ध्यान देने के अर्थ में है; ‘मेरी नहीं सुनते’ हिन्दी में दोनों पहलुओं को समेटता है।
- source_word: dominus omnipotens
  choice: सर्वशक्तिमान प्रभु
  rationale: परंपरागत, स्पष्ट और गरिमापूर्ण समतुल्य।
theological_decisions:
- issue: sic dabo eos में दैवी कार्रवाई का स्वरूप
  choice: उनके साथ भी मैं ऐसा ही करूँगा
  alternative: मैं उन्हें ऐसा ही दे दूँगा / मैं उन्हें ऐसा ही कर दूँगा
  rationale: पाठ दंड की तुलना सदोम और अमोरा के विनाश से करता है। चुना हुआ रूप दंड के ठीक साधन या अंतिम दशा को अनावश्यक रूप से निर्धारित किए बिना समान कार्रवाई का अर्थ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, किंतु विनाश और दैवी घोषणा की गरिमा बनाए रखने वाला रूप। वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए पुनर्गठित किया गया है।
