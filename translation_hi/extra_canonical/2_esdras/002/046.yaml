  yaml_path: translation/extra_canonical/2_esdras/002/046.yaml
  text: And I said to the angel[a], “Who is that young man who places crowns on them and palms in their hands?”
translation:
  language: hi
  text: और मैंने स्वर्गदूत से कहा[a], “वह युवक कौन है, जो उन्हें मुकुट पहनाता है और उनके हाथों में खजूर की डालियाँ रखता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तब मैंने कहा।’
    reason: पूर्व अंग्रेज़ी प्रस्तुतीकरण में ‘Then’ था; पर लैटिन Et का सामान्य अर्थ ‘और’ है।
lexical_decisions:
- source_word: iuuenis
  choice: जवान
  rationale: लैटिन शब्द एक युवा पुरुष को सूचित करता है; ‘जवान’ आधुनिक, सहज और प्रसंगानुकूल है।
- source_word: coronas inponit
  choice: मुकुट पहनाता
  rationale: शाब्दिक अर्थ ‘मुकुट रखता है’ है, पर सिर पर मुकुट रखने की क्रिया के लिए स्वाभाविक हिन्दी ‘मुकुट पहनाता’ है।
- source_word: palmas
  choice: खजूर की डालियाँ
  rationale: यहाँ palma विजय या सम्मान के चिह्न के रूप में हाथ में दी जाने वाली खजूर की डालियों को दर्शाता है; केवल ‘हथेलियाँ’ कहना अर्थभ्रम पैदा करेगा।
- source_word: in manus
  choice: उनके हाथों में
  rationale: लैटिन की स्थानवाचक अभिव्यक्ति को सीधे और स्वाभाविक ढंग से प्रस्तुत करता है।
