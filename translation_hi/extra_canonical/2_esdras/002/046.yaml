  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। एक ही लैटिन क्रिया inponit दोनों वस्तुओं से जुड़ी है, पर हिन्दी में अर्थ स्पष्ट और स्वाभाविक रखने के लिए ‘मुकुट पहनाता’ तथा ‘डालियाँ देता’ कहा गया है।
