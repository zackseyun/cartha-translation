  text: Then I asked the angel and said, “Who are these, lord?”
translation:
  language: hi
  text: तब मैंने स्वर्गदूत से पूछा, “प्रभु, ये कौन हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: angelum
  choice: स्वर्गदूत
  rationale: लैटिन में यह उस स्वर्गीय संदेशवाहक को सूचित करता है जिससे वक्ता प्रश्न करता है; ‘स्वर्गदूत’ आधुनिक हिन्दी का स्वाभाविक और प्रतिष्ठित बाइबलीय पद है।
- source_word: domine
  choice: प्रभु
  rationale: यह प्रत्यक्ष संबोधन है। ‘प्रभु’ आदरसूचक संबोधन को बनाए रखता है और स्रोत में अनुपस्थित ‘मेरे’ को नहीं जोड़ता।
- source_word: qui sunt hi
  choice: ये कौन हैं?
  rationale: लैटिन बहुवचन प्रश्न का सीधा, स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: domine से संबोधित व्यक्ति की पहचान
  choice: ‘प्रभु’ को स्वर्गदूत के प्रत्यक्ष संबोधन के रूप में रखा गया
  alternative: ‘हे स्वामी’ या ‘मेरे प्रभु’
  rationale: वाक्य-विन्यास में संबोधन स्वर्गदूत की ओर है। ‘मेरे’ स्रोत में नहीं है, जबकि ‘प्रभु’ संबोधन की गरिमा और संभावित अर्थ-तनाव दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। लैटिन के ‘पूछा और कहा’ को हिन्दी में केवल ‘पूछा’ किया गया है, क्योंकि प्रत्यक्ष प्रश्न के साथ ‘पूछकर कहा’ अनावश्यक रूप से भारी लगता है और अर्थ नहीं बदलता।
