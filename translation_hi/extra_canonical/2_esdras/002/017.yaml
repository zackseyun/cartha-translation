translation:
  language: hi
  text: “मत डर, हे बच्चों की माँ, क्योंकि मैंने तुझे चुन लिया है,” प्रभु कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Noli timere
  choice: मत डर
  rationale: लैटिन निषेधात्मक आज्ञा का स्वाभाविक और सीधा हिन्दी रूप; एकवचन संबोधन के अनुरूप।
- source_word: mater filiorum
  choice: हे पुत्रों की माता
  rationale: संबोधन को ‘हे’ से स्पष्ट किया गया है और filiorum के पुल्लिंग बहुवचन अर्थ ‘पुत्रों’ को सुरक्षित रखा गया है।
- source_word: quoniam
  choice: क्योंकि
  rationale: यह चुनाव के कारण को व्यक्त करने वाले लैटिन कारणसूचक संयोजक का सहज हिन्दी समतुल्य है।
- source_word: te elegi
  choice: मैंने तुझे चुन लिया है
  rationale: elegi के पूर्ण किए गए चुनाव को ‘चुन लिया है’ से व्यक्त किया गया है; te के एकवचन आत्मीय संबोधन को ‘तुझे’ रखा गया है।
- source_word: dicit dominus
  choice: प्रभु कहता है
  rationale: लैटिन वचन-सूत्र की शब्द-व्यवस्था और वर्तमानकालीन रूप को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: ‘माता’ की पहचान
  choice: पाठ में पहचान को अनिर्दिष्ट रखा गया है
  alternative: इसे किसी विशेष समुदाय, नगर या धार्मिक संस्था के रूप में स्पष्ट करना
  rationale: इस पद में संबोधित ‘माता’ की पहचान स्पष्ट नहीं की गई; किसी विशिष्ट धर्मवैज्ञानिक पहचान को जोड़ना स्रोत से आगे जाना होगा।
- issue: filiorum का लिंगगत अर्थ
  choice: ‘पुत्रों’
  alternative: ‘संतानों’ या ‘बच्चों’
  rationale: लैटिन filiorum व्याकरणतः पुल्लिंग बहुवचन है; इसलिए मूल रूप को बनाए रखा गया, यद्यपि व्यापक संदर्भ में सामूहिक अर्थ संभव हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रत्यक्ष वाणी। ‘मत डर’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘हे’ संबोधन की काव्यात्मक-भविष्यवाणीपरक गरिमा बनाए रखता है।
