translation:
  language: hi
  text: कि तू उन्हें लज्जा के हवाले कर दे और उनकी माता को लूट के हवाले कर दे, ताकि
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusionem
  choice: लज्जा
  rationale: लातीनी शब्द यहाँ अपमान या लज्जाजनक दशा का बोध कराता है; ‘लज्जा’ वाक्य को स्वाभाविक रखते हुए इस अर्थ को व्यक्त करता है।
- source_word: matrem eorum
  choice: उनकी माता
  rationale: मूल के संबंधसूचक पद को सीधे सुरक्षित रखा गया है; संदर्भ से बाहर ‘माता’ की पहचान को अधिक स्पष्ट नहीं किया गया।
- source_word: in direptionem
  choice: लूट के लिए
  rationale: यह पद लूटे जाने या लूट के हवाले किए जाने का अर्थ देता है; ‘लूट के लिए सौंप दे’ हिंदी में लक्ष्य और समर्पण दोनों को स्पष्ट करता है।
- source_word: ne
  choice: ताकि
  rationale: अंश अगले वाक्यांश पर निर्भर उद्देश्यसूचक संयोजक पर समाप्त होता है; दिए गए खंड और परामर्श-पाठ के अनुरूप इसे ‘ताकि’ रखा गया है।
theological_decisions:
- issue: ‘उनकी माता’ की पहचान
  choice: रूपक या ऐतिहासिक पहचान बताए बिना ‘उनकी माता’
  alternative: किसी नगर, जाति या धार्मिक समुदाय के रूप में स्पष्ट करना
  rationale: इस अपूर्ण पद में मूल पाठ स्वयं पहचान नहीं बताता; अतः संभावित धार्मिक या ऐतिहासिक व्याख्या को अनुवाद में नहीं जोड़ा गया।
- issue: des eis confusionem का संबंध
  choice: ‘उन्हें लज्जा के हवाले कर दे’
  alternative: ‘उन्हें लज्जित कर दे’ अथवा ‘उन्हें लज्जा दे’
  rationale: चुना हुआ रूप विनाशकारी न्याय के संदर्भ में सौंपे जाने की लातीनी अभिव्यक्ति को सुरक्षित रखता है, बिना यह तय किए कि लज्जा केवल भावना है या सार्वजनिक अपमान की दशा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। एकवचन संबोधन के लिए ‘तू’ रखा गया है, क्योंकि क्रिया ‘des’ एकवचन है और बाइबलीय प्रत्यक्ष संबोधन में यह स्वाभाविक है। पद खंडित रूप में ‘ताकि’ पर समाप्त होता है, जैसा स्रोत में है।
