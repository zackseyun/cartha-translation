source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ut irem ad Israel; ad quos cum uenirem, reprobauerunt me et respuerunt mandatum domini. Ideoque uobis dico, gentes,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/033.yaml
  text: I[a], Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and spurned the commandment of the Lord. Therefore I say to you, O nations,
translation:
  language: hi
  text: मुझे[a], एज्रा को, होरेब पर्वत पर प्रभु से यह आज्ञा मिली कि मैं इस्राएल के पास जाऊँ; पर जब मैं उनके पास पहुँचा, तो उन्होंने मुझे अस्वीकार कर दिया और प्रभु की आज्ञा को ठुकरा दिया। इसलिए, हे जातियो, मैं तुमसे कहता हूँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के उपलब्ध कराए गए लैटिन अंश का आरम्भ “कि मैं इस्राएल के पास जाऊँ” से होता है; “मुझे, एज्रा को, होरेब पर्वत पर प्रभु से यह आज्ञा मिली” वाला आरम्भ संपादित पाठ-परंपरा के आधार पर दिया गया है।
    reason: supplied_source_fragment
lexical_decisions:
- source_word: reprobauerunt me
  choice: उन्होंने मुझे अस्वीकार कर दिया
  rationale: ‘reprobare’ यहाँ किसी व्यक्ति को नामंज़ूर या अस्वीकार करने का भाव देता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: respuerunt mandatum domini
  choice: प्रभु की आज्ञा को ठुकरा दिया
  rationale: ‘respuere’ केवल मन में तुच्छ समझने के बजाय सक्रिय और प्रबल अस्वीकृति दर्शाता है; ‘ठुकरा दिया’ इस बल को बनाए रखता है।
- source_word: gentes
  choice: हे जातियो
  rationale: प्रत्यक्ष संबोधन में बहुवचन ‘gentes’ को बाइबिलीय गरिमा और व्यापक गैर-इस्राएली समुदायों के अर्थ सहित प्रस्तुत करता है।
- source_word: Ideoque uobis dico
  choice: इसलिए ... मैं तुमसे कहता हूँ
  rationale: कारणसूचक संबंध और बहुवचन संबोधन दोनों को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएल द्वारा दूत और प्रभु की आज्ञा—दोनों का अस्वीकार
  choice: 'दो अलग क्रियाओं के रूप में रखा: ‘मुझे अस्वीकार कर दिया’ और ‘आज्ञा को ठुकरा दिया’'
  alternative: दोनों को सामान्यतः ‘नहीं माना’ कहना
  rationale: लैटिन में व्यक्ति और आज्ञा के प्रति अस्वीकृति अलग-अलग व्यक्त की गई है; इस तनाव को समतल नहीं किया गया।
- issue: gentes का आशय
  choice: ‘जातियो’
  alternative: ‘अन्यजातियो’
  rationale: ‘अन्यजाति’ एक अधिक व्याख्यात्मक धार्मिक पद हो सकता है; ‘जातियो’ मूल के व्यापक और कुछ हद तक खुले अर्थ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘ठुकरा दिया’ ने लैटिन respuerunt की सक्रिय, प्रबल अस्वीकृति को व्यक्त किया है। पद अगले कथन की ओर खुलते अल्पविराम पर समाप्त होता है।
