source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Testare, testare caelum et terram, omisi enim malum et creaui bonum, quia uiuo ego, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/014.yaml
  text: Bear witness[a], bear witness, O heaven and earth, for I have put away evil and created good, because I live, says the Lord.
translation:
  language: hi
  text: हे आकाश और पृथ्वी, गवाही दो[a], गवाही दो, क्योंकि मैंने बुराई को दूर कर दिया है और भलाई की सृष्टि की है; क्योंकि मैं जीवित हूँ, प्रभु कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश और पृथ्वी को साक्षी बनाओ।”
    reason: लैटिन *testare* की सम्भव सकर्मक व्याख्या और पूर्व प्रचलित अनुवाद को दर्ज करता है।
lexical_decisions:
- source_word: Testare, testare
  choice: गवाही दो, गवाही दो
  rationale: दोहराए गए लैटिन आज्ञार्थक का जोर और तात्कालिकता बनाए रखता है; आकाश और पृथ्वी को सीधे संबोधित करना हिन्दी में स्वाभाविक है।
- source_word: omisi
  choice: दूर कर दिया
  rationale: यहाँ अर्थ बुराई को छोड़ देने या हटा देने का है; 'दूर कर दिया' प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: creaui
  choice: सृष्टि की है
  rationale: लैटिन creare के सृजनात्मक बल को बनाए रखता है, केवल 'बनाया' से अधिक सटीक।
- source_word: bonum
  choice: भलाई
  rationale: malum के समानांतर अमूर्त नैतिक अर्थ को व्यक्त करता है।
- source_word: quia uiuo ego
  choice: मेरे जीवन की शपथ!
  rationale: दिव्य शपथ-सूत्र का स्वाभाविक हिन्दी रूप; शब्दशः 'क्योंकि मैं जीवित हूँ' हिन्दी में आशय को अस्पष्ट कर सकता है।
theological_decisions:
- issue: परमेश्वर द्वारा भलाई की सृष्टि और बुराई को दूर करने का कथन
  choice: मैंने बुराई को दूर कर दिया और भलाई की सृष्टि की है
  alternative: मैंने बुराई को छोड़ दिया और भलाई को रचा है
  rationale: मूल के प्रत्यक्ष दावे और उसके धर्मवैचारिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- issue: दिव्य जीवन-शपथ quia uiuo ego
  choice: मेरे जीवन की शपथ!
  alternative: क्योंकि मैं जीवित हूँ
  rationale: वाक्यांश को कथन के कारण के बजाय शपथ-सूत्र के रूप में प्रस्तुत करना सामी प्रभाव वाले लैटिन प्रयोग के अनुकूल और आधुनिक हिन्दी में बोधगम्य है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संबोधन में 'हे' और दोहराई गई आज्ञा मूल की गंभीर, घोषणात्मक शैली को बनाए रखते हैं।
