  source_fidelity: लातीनी «Et iudicasti terram non [cum veritate]» के अनुसार द्वितीय पुरुष एकवचन भूतकाल, ‘पृथ्वी/धरती’ का कर्म, और सत्य के अनुरूप न होने वाला न्याय—तीनों सुरक्षित हैं। उपलब्ध पाठांश में «cum veritate» कटा हुआ है, पर अंग्रेज़ी audit trail और पद की पुनर्स्थापित निरंतरता से ‘सच्चाई से नहीं’ समर्थित है।
