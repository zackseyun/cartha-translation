  text: And you judged the earth not with truth.
translation:
  language: hi
  text: और तूने पृथ्वी का न्याय सच्चाई से नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicasti
  choice: तूने…न्याय…किया
  rationale: लातीनी क्रिया द्वितीय पुरुष एकवचन भूतकाल में है; हिन्दी में कर्ता और क्रिया को स्वाभाविक वाक्य-विन्यास में रखा गया है।
- source_word: terram
  choice: पृथ्वी
  rationale: यहाँ इसका आशय संसार/धरती से है; ‘पृथ्वी’ मूल के व्यापक अर्थ और गरिमापूर्ण शैली को बनाए रखता है।
- source_word: non [cum veritate]
  choice: सच्चाई से नहीं
  rationale: दिया गया लातीनी अंश ‘non’ पर कटता है, जबकि परामर्श-पाठ और पद की अभिप्रेत निरंतरता ‘सच्चाई से नहीं’ का समर्थन करते हैं; यह न्याय की सत्यनिष्ठा के अभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अन्यायी शासन पर प्रत्यक्ष आरोप
  choice: 'नकारात्मक कथन को स्पष्ट और बिना नरमी के रखा गया: ‘न्याय सच्चाई से नहीं किया।’'
  alternative: ‘न्यायपूर्वक न्याय नहीं किया’ या ‘निष्पक्षता से न्याय नहीं किया’
  rationale: ‘सच्चाई’ सत्य के मूल भाव को सुरक्षित रखती है और ‘निष्पक्षता’ जैसी अधिक व्याख्यात्मक धारणा नहीं जोड़ती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी। द्वितीय पुरुष एकवचन के लिए ‘तू’ मूल के एकवचन संबोधन को स्पष्ट रखता है और भविष्यवाणी-सदृश प्रत्यक्ष भर्त्सना के अनुरूप है।
