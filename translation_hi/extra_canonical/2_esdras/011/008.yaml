- source_word: dormite unusquisque in loco suo
  choice: हर एक अपने-अपने स्थान पर सोए
  rationale: unusquisque और in loco suo का व्यक्तिगत-वितरक भाव ‘हर एक अपने-अपने स्थान पर’ से स्पष्ट होता है।
- source_word: per tempus uigilate
  choice: कुछ समय तक पहरा दे
  rationale: per tempus अवधि को सूचित करता है; इसलिए ‘बारी-बारी से’ जैसी स्रोत में अनकही व्यवस्था जोड़ने के बजाय ‘कुछ समय तक’ चुना गया है।
