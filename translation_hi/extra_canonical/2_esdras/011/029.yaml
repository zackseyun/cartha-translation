translation:
  language: hi
  text: जो बीच में था, वह जाग उठा, क्योंकि वह उन दोनों सिरों से बड़ा था। और मैंने देखा कि उसने उन दोनों सिरों को अपने साथ समेट लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod erat medium
  choice: जो बीच में था
  rationale: लैटिन के संबंधवाचक वाक्यांश को स्वाभाविक हिन्दी में रखा गया है; संदर्भ से इसका संकेत बीच वाले सिर की ओर है, पर स्रोत की अभिव्यक्ति को अनावश्यक रूप से अधिक स्पष्ट नहीं किया गया।
- source_word: euigilabat
  choice: जाग उठा
  rationale: क्रिया का मूल अर्थ जागना या सचेत होना है; प्रसंग में आरंभ हुई क्रिया के लिए ‘जाग उठा’ सहज है।
- source_word: maius
  choice: बड़ा
  rationale: यहाँ आकार या महानता दोनों की हल्की संभाव्यता है, पर सिरों की तुलना में सामान्य और संदर्भानुकूल अर्थ ‘बड़ा’ है।
- source_word: conplexa est duo capita secum
  choice: उसने उन दोनों सिरों को अपने साथ समेट लिया
  rationale: conplector में आलिंगन करने, घेरने या अपने में लेने की अर्थ-छाया है। ‘अपने साथ समेट लिया’ इस व्यापकता को बनाए रखता है और केवल ‘जोड़ लिया’ जैसी संकीर्ण व्याख्या से बचता है।
