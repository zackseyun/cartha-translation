  text: gerere et iterum nusquam conparere. Et uidi et ecce in tempore sequentes pennae erigebantur et ipsae a dextera parte, ut tenerent principatum; et ex his erant quae tenebant, sed
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/020.yaml
  text: And I looked[a], and behold, in due time the following wings also rose up on the right side, to hold rule; and among them were some that held it, but
translation:
  language: hi
  text: और मैंने देखा, और देखो, समय आने पर अगले पंख भी दाहिनी ओर उठने लगे, ताकि शासन करें; और उनमें से कुछ शासन कर रहे थे, परन्तु—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in tempore
  choice: समय आने पर
  rationale: लातीनी पद समयानुकूल या नियत अवसर पर घटित होने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए उस अर्थ को बनाए रखता है।
- source_word: sequentes pennae
  choice: अगली पाँखें
  rationale: sequentes क्रम में पीछे आने वाली पाँखों को सूचित करता है; 'अगली' प्रसंग के अनुक्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: erigebantur
  choice: उठ खड़ी हुईं
  rationale: यह उठने या ऊपर होने की क्रिया व्यक्त करता है; कथात्मक प्रसंग में पूर्ण घटना के रूप में स्वाभाविक हिन्दी चुनी गई है।
- source_word: et ipsae
  choice: भी
  rationale: ipsae के साथ et इस बात पर बल देता है कि ये पाँखें भी पहले वाली पाँखों के समान उठीं; नवीनतम स्रोत-समीक्षा के अनुसार यह सूक्ष्मता स्पष्ट रखी गई है।
- source_word: a dextera parte
  choice: दाहिनी ओर
  rationale: मूल के स्थान-सूचक अर्थ का सीधा और स्वाभाविक अनुवाद।
- source_word: tenerent principatum
  choice: शासन अपने हाथ में लें
  rationale: principatum यहाँ प्रधान सत्ता या शासन को दर्शाता है; मुहावरेदार हिन्दी उद्देश्य और अधिकार-ग्रहण दोनों को स्पष्ट करती है।
- source_word: quae tenebant
  choice: कुछ ने शासन अपने हाथ में लिया
  rationale: पूर्ववर्ती principatum को अर्थतः दोहराकर अस्पष्ट सर्वनाम से बचा गया है और वास्तव में सत्ता धारण करने का भाव रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। आरम्भ का अधूरा खंड पिछले पद से संबंधित मानकर शामिल नहीं किया गया। अंतिम sed के कारण वाक्य को जानबूझकर अपूर्ण रखते हुए डैश लगाया गया है, क्योंकि विचार अगले पद में जारी है। अंग्रेज़ी परत की पादटिप्पणी स्रोतगत वैकल्पिक पाठ नहीं, पूर्व अनुवाद-संबंधी टिप्पणी है; संशोधित मुख्य पाठ में उसका आशय समाहित होने के कारण हिन्दी में अलग पादटिप्पणी नहीं रखी गई।
