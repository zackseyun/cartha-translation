    issue: Aspect of quae tenebant
    rationale: The source has an imperfect, describing some wings as holding rule, not specifically as having taken it. "कुछ ने ... लिया" supplies a completed acquisition absent from the Latin.
  - severity: low
    issue: Modern Hindi wording for pennae
    rationale: '"पंख" is the standard modern Hindi term; "पाँखें" is comparatively marked and less natural for the target variant.'
  - severity: low
    issue: Added hand-based idiom
    rationale: '"अपने हाथ में लें" is not required by tenerent and is stylistically incongruous with wings. A direct governance verb is clearer and closer.'
