review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inclusive force of "et ipsae" with "भी," the right-side location, and the deliberately unfinished "sed" clause. However, "कुछ ने शासन अपने हाथ में लिया" turns the imperfect "quae tenebant" ('were holding rule') into a completed act of taking power. The revision retains the ongoing sense. "उठने लगे" idiomatically represents the imperfect "erigebantur" while retaining the English audit trail's sense that the wings rose.
  naturalness: '"पाँखें" is less natural in modern standard Hindi than "पंख." The expression "शासन अपने हाथ में लें" is intelligible but introduces a hand-based idiom into an image whose subjects are wings. "शासन करें" is direct, natural, and preserves the personified imagery without added idiom.'
  terminology: '"शासन" appropriately renders "principatum" in this context. The revision uses "पंख" and masculine agreement consistently, while preserving the vision''s personification.'
  issues:
