reference: 2 Esdras 11:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Propterea non apparens non appareas tu aquila et alae tuae horribiles et pennacula tua pessima et capita tua maligna et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/045.yaml
  text: Therefore may you never appear again—you[a], eagle, and your dreadful wings and your most wicked pinions and your evil heads and your wicked claws and all your worthless body—
translation:
  language: hi
  text: इसलिए, हे उकाब, तू फिर कभी दिखाई न दे[a]—न तेरे भयानक पंख, न तेरे अत्यन्त दुष्ट पर, न तेरे दुष्ट सिर, न तेरे दुष्ट पंजे, और न तेरा सारा निकम्मा शरीर—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दिखाई न देता हुआ, तू दिखाई न दे”; यह पुनरुक्ति निषेध पर बल देती है।
    reason: लैटिन की असामान्य बलसूचक पुनरुक्ति और उसके अधिक शाब्दिक रूप को सुरक्षित करना।
lexical_decisions:
- source_word: non apparens non appareas
  choice: तू फिर कभी दिखाई न दे
  rationale: शाब्दिक पुनरुक्ति को स्वाभाविक हिन्दी में एक बलयुक्त अभिशाप/कामना के रूप में व्यक्त करता है; इसका आशय केवल किसी क्षण ओझल होना नहीं, बल्कि आगे फिर प्रकट न होना है।
- source_word: aquila
  choice: उकाब
  rationale: विशाल शिकारी पक्षी के लिए प्रचलित, गरिमापूर्ण बाइबलीय हिन्दी शब्द।
- source_word: alae tuae horribiles
  choice: तेरे भयानक पंख
  rationale: alae के सामान्य अर्थ ‘पंख’ और horribiles के भय उत्पन्न करने वाले भाव को सीधे रखता है।
- source_word: pennacula tua pessima
  choice: तेरे अत्यन्त दुष्ट पर
  rationale: pennacula को बड़े पंखों के अलग-अलग परों/पंख-पिच्छों के रूप में अलग रखा गया है; pessima की अतिशयता ‘अत्यन्त दुष्ट’ से व्यक्त होती है।
- source_word: capita tua maligna
  choice: तेरे बुरे सिर
  rationale: बहुवचन capita को बनाए रखते हुए maligna का नैतिक रूप से नकारात्मक अर्थ सहज हिन्दी में दिया गया है।
- source_word: omne corpus tuum vanum
  choice: तेरा सारा निकम्मा शरीर
  rationale: vanum यहाँ खोखलेपन अथवा मूल्यहीनता का अपमानसूचक भाव रखता है; ‘निकम्मा’ सामान्य हिन्दी में इसे प्रभावी ढंग से व्यक्त करता है।
theological_decisions:
- issue: non apparens non appareas की पुनरुक्त संरचना
  choice: इसे बलयुक्त कामना/अभिशाप के रूप में ‘फिर कभी दिखाई न दे’ अनूदित किया गया।
  alternative: ‘पूरी तरह लुप्त हो जा’ अथवा शाब्दिक ‘दिखाई न देता हुआ, दिखाई न दे’।
  rationale: लैटिन की अस्वाभाविक पुनरुक्ति संभवतः अनुवाद-भाषा की बलसूचक संरचना को सुरक्षित रखती है। चुना हुआ पाठ उसके निषेधात्मक और भविष्याभिमुख बल को स्वाभाविक हिन्दी में देता है, जबकि पादटिप्पणी शाब्दिक रूप को सामने रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और अभिशापात्मक भविष्यवाणी के अनुकूल रखी गई है। ‘न’ की पुनरावृत्ति से उकाब के प्रत्येक अंग पर उद्घाटन का निषेध लागू होना स्पष्ट होता है। उपलब्ध लैटिन अंश अंतिम et पर रुकता है; पंजों और पूरे शरीर वाला शेष वाक्य लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ के आधार पर रखा गया है।
