  text: And I looked, and behold, on the right side one wing rose up and reigned over all the earth.
translation:
  language: hi
  text: और मैंने देखा, और देखो, दाहिनी ओर एक पंख उठा और सारी पृथ्वी पर राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: और मैंने देखा, और देखो
  rationale: दर्शन-वर्णन की क्रमिकता और ‘ecce’ के ध्यान आकर्षित करने वाले बल को सुरक्षित रखा गया है।
- source_word: a dextera parte
  choice: दाहिनी ओर से
  rationale: लैटिन में दिशा और उद्गम—दोनों का भाव है; यह स्वाभाविक हिन्दी में दोनों को व्यक्त करता है।
- source_word: una penna
  choice: एक पंख
  rationale: ‘penna’ का सीधा अर्थ रखा गया है और प्रतीक की व्याख्या पाठ में नहीं जोड़ी गई।
- source_word: surrexit
  choice: उठा
  rationale: दर्शन में पंख के प्रकट होकर सत्ता ग्रहण करने की गति को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: regnauit super omnem terram
  choice: सारी पृथ्वी पर राज्य किया
  rationale: ‘regnare super’ के शासन-संबंधी अर्थ और ‘omnem terram’ की व्यापकता को बनाए रखता है।
theological_decisions:
- issue: पंख की प्रतीकात्मक पहचान
  choice: पंख को केवल ‘पंख’ कहा गया है
  alternative: इसे किसी राजा, राज्य या साम्राज्य के रूप में स्पष्ट करना
  rationale: मूल पद प्रतीक की पहचान यहाँ नहीं खोलता; अनुवाद उस अस्पष्टता को सुरक्षित रखता है।
- issue: ‘सारी पृथ्वी’ का दायरा
  choice: सारी पृथ्वी
  alternative: सारा देश या समूचा संसार
  rationale: ‘omnem terram’ की भौगोलिक व्यापकता को बिना सीमित या व्याख्यायित किए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी; दर्शन-साहित्य की उद्घोषणात्मक शैली बनाए रखने हेतु ‘और देखो’ रखा गया है।
