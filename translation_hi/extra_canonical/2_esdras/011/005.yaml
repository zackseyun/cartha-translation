source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce aquila uolauit in pennis suis ut regnaret super terram et super eos qui habitant in ea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/005.yaml
  text: And I looked, and behold, the eagle flew on its wings to reign over the earth and over those who dwell in it.
translation:
  language: hi
  text: तब मैंने देखा—और देखो, वह उकाब अपने पंखों पर उड़ चला, ताकि पृथ्वी पर और उसमें रहनेवालों पर राज्य करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aquila
  choice: उकाब
  rationale: यह बड़े शिकारी पक्षी ‘eagle’ के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: uolauit in pennis suis
  choice: अपने पंखों पर उड़ चला
  rationale: लातीनी अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए उड़ने की क्रिया और अपने ही पंखों का स्पष्ट उल्लेख सुरक्षित रखा गया है।
- source_word: ut regnaret
  choice: ताकि ... राज्य करे
  rationale: उद्देश्यसूचक ut और regnaret के राजकीय शासन-भाव को सीधे व्यक्त करता है।
- source_word: super terram et super eos qui habitant in ea
  choice: पृथ्वी पर और उसमें रहनेवालों पर
  rationale: दोहराए गए super का शासनाधिकार-संबंधी ‘पर’ से अनुवाद किया गया है और ea का संदर्भ पृथ्वी से स्पष्ट रूप में जोड़ा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। ‘और देखो’ ने ecce की दर्शनात्मक आकस्मिकता बनाए रखी है; कोई व्याख्यात्मक पहचान या सांप्रदायिक अर्थ नहीं जोड़ा गया।
