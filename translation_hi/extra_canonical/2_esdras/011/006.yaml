id: 2ES.11.6
reference: 2 Esdras 11:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi quomodo subiecti erant ei omnia sub caelo, et nemo illi contradicebat neque unus de creatura, quae est super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/006.yaml
  text: And I saw how everything under heaven was subjected to it[a], and no one contradicted it, not even one creature that is upon the earth.
translation:
  language: hi
  text: और मैंने देखा कि आकाश के नीचे की सभी वस्तुएँ उसके अधीन थीं, और कोई भी उसका विरोध नहीं करता था—पृथ्वी पर रहनेवाले प्राणियों में से एक भी नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subiecti erant ei omnia sub caelo
  choice: आकाश के नीचे की सभी वस्तुएँ उसके अधीन थीं
  rationale: यह रूप लैटिन के सार्वभौमिक कथन और अधीनता के भाव को स्वाभाविक हिन्दी में बनाए रखता है। नपुंसकलिंग बहुवचन omnia के लिए संदर्भानुकूल ‘सभी वस्तुएँ’ लिया गया है।
- source_word: nemo illi contradicebat
  choice: कोई भी उसका विरोध नहीं करता था
  rationale: contradicere का मूल अर्थ प्रतिवाद करना हो सकता है, पर सार्वभौमिक अधीनता के इस राजनीतिक-दर्शनात्मक संदर्भ में ‘विरोध करना’ मौखिक असहमति और सक्रिय प्रतिरोध—दोनों की गुंजाइश रखते हुए अधिक स्वाभाविक है।
- source_word: neque unus de creatura, quae est super terram
  choice: पृथ्वी पर रहनेवाले प्राणियों में से एक भी नहीं
  rationale: लैटिन का शाब्दिक रूप असहज है; यह हिन्दी प्रतिपादन पृथ्वी पर विद्यमान सृष्ट प्राणियों में किसी एक के भी अपवाद न होने का आशय स्पष्ट रखता है।
theological_decisions:
- issue: उकाब के लिए सर्वनाम और सार्वभौमिक प्रभुत्व का वर्णन
  choice: ‘उसके’ और ‘उसका’ द्वारा संदर्भित सत्ता को अनिर्दिष्ट रखना
  alternative: उकाब का नाम दोहराना या उसे स्पष्ट रूप से साम्राज्य कहना
  rationale: पद का लैटिन केवल सर्वनाम illi/ei प्रयोग करता है। व्याख्यात्मक पहचान को मूल पाठ में जोड़ना दर्शन की प्रतीकात्मक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘रहनेवाले’ का संयुक्त रूप अपनाया गया है। वाक्य के अंतिम बलाघात को स्वाभाविक बनाने के लिए डैश का प्रयोग किया गया है।
