reference: 2 Esdras 11:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ungues tui pessimi et omne corpus tuum uanum, Vti refrigeret omnis terra et releuetur liberata de tua ui et speret iudicium et misericordiam eius qui fecit eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/046.yaml
  text: and your wicked claws and your whole worthless body[a], so that the whole earth may be refreshed and relieved, freed from your violence, and may hope for the judgment and mercy of him who made it.”
translation:
  language: hi
  text: और तेरे अत्यन्त दुष्ट पंजे और तेरा सारा निकम्मा शरीर—ताकि सारी पृथ्वी ताज़गी पाए और राहत पाए, तेरी हिंसा से मुक्त होकर उस के न्याय और दया की आशा रखे जिसने उसे बनाया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ungues tui pessimi
  choice: तेरे अत्यन्त दुष्ट पंजे
  rationale: ungues पक्षी-सदृश उकाब के नखों/पंजों को दर्शाता है; हिन्दी में इस प्रसंग में ‘पंजे’ स्वाभाविक है। pessimi की तीव्रता ‘अत्यन्त दुष्ट’ से व्यक्त की गई है।
- source_word: omne corpus tuum uanum
  choice: तेरा सारा निकम्मा शरीर
  rationale: uanum यहाँ व्यर्थ, निष्फल या मूल्यहीन होने का भाव देता है; ‘निकम्मा’ सामान्य आधुनिक हिन्दी में कठोर निन्दात्मक अर्थ बनाए रखता है।
- source_word: refrigeret
  choice: शीतल हो
  rationale: शाब्दिक रूप से ठंडक/ताज़गी पाने का भाव है; इसे केवल ‘विश्राम पाए’ बनाना अर्थ को संकुचित कर देता।
- source_word: releuetur
  choice: राहत पाए
  rationale: भार या कष्ट से हल्का किए जाने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: liberata de tua ui
  choice: तेरी हिंसा से मुक्त होकर
  rationale: uis यहाँ अत्याचारी बल या हिंसा है; liberata को आश्रित कृदन्त के रूप में ‘मुक्त होकर’ रखा गया है।
- source_word: speret iudicium et misericordiam
  choice: न्याय और दया की आशा रखे
  rationale: दोनों संज्ञाओं को समान रूप से speret से जोड़ा गया है; स्रोत में उपस्थित न्याय-दया के तनाव को बनाए रखा गया है।
- source_word: eius qui fecit eam
  choice: अपने सृष्टिकर्ता के
  rationale: ‘जिसने उसे बनाया’ का स्वाभाविक और संक्षिप्त हिन्दी रूप; ‘अपने’ का संकेत पृथ्वी की ओर है।
theological_decisions:
- issue: न्याय और दया का संयुक्त आशा-विषय
  choice: ‘न्याय और दया की आशा रखे’
  alternative: ‘उसके दयापूर्ण न्याय की आशा रखे’
  rationale: Latin में iudicium और misericordiam अलग, समन्वित पद हैं; उन्हें एक-दूसरे में मिलाना स्रोत की धार्मिक अर्थ-बहुलता को घटाता।
- issue: आरम्भिक खंड में निहित क्रिया
  choice: ‘नष्ट हो जाएँ’ की पूर्ति
  alternative: 'क्रियारहित खंड: ‘और तेरे... शरीर,’'
  rationale: दिया गया पद पिछले वाक्य से व्याकरणिक रूप से जुड़ा अंश है और इस अंश में क्रिया प्रत्यक्ष नहीं है। स्वतंत्र हिन्दी पद को सुबोध बनाने के लिए प्रसंगानुकूल विनाश की क्रिया पूरी की गई, बिना पंजों और शरीर को अगले उद्देश्यवाचक खंड का कर्ता बनाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में एकवचन ‘तेरा/तेरी’ स्रोत के tuus का सीधा रूप है। शैली गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। पद पूर्ववर्ती वाक्य का व्याकरणिक विस्तार है, इसलिए आरम्भ में ‘और’ सुरक्षित रखा गया है।
