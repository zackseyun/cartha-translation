revisions:
- from: और तेरे अत्यन्त दुष्ट पंजे और तेरा सारा निकम्मा शरीर नष्ट हो जाएँ, ताकि सारी पृथ्वी शीतल हो और राहत पाए, तेरी हिंसा से मुक्त होकर अपने सृष्टिकर्ता के न्याय और दया की आशा रखे।”
  to: और तेरे अत्यन्त दुष्ट पंजे और तेरा सारा निकम्मा शरीर—ताकि सारी पृथ्वी ताज़गी पाए और राहत पाए, तेरी हिंसा से मुक्त होकर उस के न्याय और दया की आशा रखे जिसने उसे बनाया।”
  rationale: The revision removes the unstated verb of destruction and marks the verse-opening phrase as a continuation of the prior sentence. It renders refrigeret as “ताज़गी पाए,” retains the coordinated relief and liberation language, and translates the final relative clause explicitly as “जिसने उसे बनाया,” preserving its reference to the earth’s maker.
