source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nam capita eius erant quiescentia, et medium caput erat maius aliorum capitum, sed et ipsa quiescebat cum eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/004.yaml
  text: For its heads were at rest[a], and the middle head was larger than the other heads, yet it too was at rest with them.
translation:
  language: hi
  text: क्योंकि उसके सिर स्थिर थे, और बीच का सिर दूसरे सिरों से बड़ा था; फिर भी वह भी उनके साथ स्थिर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  choice: क्योंकि
  rationale: लैटिन संयोजक यहाँ पिछले कथन का कारण या स्पष्टीकरण देता है; इसे विरोधसूचक ‘परन्तु’ के रूप में नहीं लिया गया।
- source_word: quiescentia / quiescebat
  choice: स्थिर थे / स्थिर था
  rationale: संदर्भ में सिरों के निष्क्रिय या बिना गति के रहने का भाव है; एक ही मूल की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया।
- source_word: medium caput
  choice: बीच का सिर
  rationale: यह तीन सिरों में स्थान की दृष्टि से मध्यवर्ती सिर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: maius
  choice: बड़ा
  rationale: तुलनात्मक आकार का सीधा और असंदिग्ध रूप।
- source_word: sed et ipsa
  choice: फिर भी वह भी
  rationale: sed की विरोधसूचकता और et ipsa के समावेशी-बलाघात, दोनों को सुरक्षित रखता है।
