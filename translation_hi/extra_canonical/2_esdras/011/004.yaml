  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और स्रोत-सन्निकट भाषा। ‘सिर’ का व्याकरणिक लिंग हिन्दी के अनुसार पुल्लिंग रखा गया है। स्रोत में वास्तविक पाठांतर या ऐसी अस्पष्टता नहीं मिली जिसके लिए पाद-टिप्पणी आवश्यक हो।
