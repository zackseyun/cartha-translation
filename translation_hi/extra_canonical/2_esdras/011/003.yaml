- from: और मैंने देखा कि उसके पंखों से विपरीत पंख उग रहे थे, और वे छोटे-छोटे, मामूली पर बन गए।
  to: और मैंने देखा कि उसके पंखों से विपरीत पंख उग रहे थे, और वे छोटे और मामूली पंख बनते गए।
  rationale: The revision corrects the malformed final noun phrase, explicitly rendering pennaculis as “पंख,” and uses “बनते गए” for the imperfect fiebant. It otherwise retains the draft’s source-faithful terminology and its preservation of the ambiguity in contrariae.
