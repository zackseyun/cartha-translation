  text: And I looked[a], and from its wings there grew opposite wings, and these became little pinions, small and slight.
translation:
  language: hi
  text: और मैंने देखा कि उसके पंखों से विपरीत पंख उग रहे थे, और वे छोटे और मामूली पंख बनते गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennis ... pennae
  choice: पंखों ... पंख
  rationale: एक ही लैटिन संज्ञा penna के दोनों रूपों को एक ही शब्द से प्रस्तुत किया गया है; इस गरुड़-दर्शन में संदर्भ पंखों का है।
- source_word: contrariae
  choice: विपरीत
  rationale: यह शब्द स्थानगत ‘सामने/दूसरी ओर’ और विरोधी स्वभाव—दोनों का संकेत दे सकता है; ‘विपरीत’ इस अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: nascebantur
  choice: उग रहे थे
  rationale: दर्शन में पंखों से नए पंख निकलने की सजीव छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: pennaculis minutis et modicis
  choice: छोटे-छोटे, मामूली पर
  rationale: pennaculum के लघुतासूचक अर्थ और minutis et modicis के छोटे तथा अल्प/साधारण होने के भाव को संक्षेप में बनाए रखता है।
