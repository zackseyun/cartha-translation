lexical_decisions:
- source_word: non conparuit
  choice: ओझल हो गया
  rationale: इस प्रसंग में इसका अर्थ केवल ‘दिखाई नहीं दिया’ नहीं, बल्कि दृश्य से लुप्त हो जाना है; ‘ओझल हो गया’ स्वाभाविक हिन्दी में यही भाव व्यक्त करता है।
- source_word: uelocius quam prior
  choice: पहले वाले से अधिक जल्दी
  rationale: तुलनात्मक अर्थ को सीधे और स्पष्ट रूप से सुरक्षित रखता है।
- source_word: Et uidi et ecce
  choice: फिर मैंने देखा, और देखो
  rationale: दर्शन-वर्णन के क्रम और ‘ecce’ के ध्यान आकर्षित करने वाले बल—दोनों को बनाए रखता है।
- source_word: duae quae
  choice: वे दो जो
  rationale: लैटिन अंश अगले वाक्य में अधूरा जारी रहता है; हिन्दी में भी उस अपूर्णता को बिना अनुमान से पूरा किए सुरक्षित रखा गया है।
