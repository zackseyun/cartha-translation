  text: और मैंने देखा, और देखो, एक आवाज़ उसके सिरों से नहीं, बल्कि उसके शरीर के बीच से निकल रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: फिर मैंने देखा कि
  rationale: दर्शन-वर्णन की निरंतरता और आकस्मिक ध्यान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘देखो’ जोड़ना यहाँ वाक्य को असहज बनाता।
- source_word: uox
  choice: एक आवाज़
  rationale: लैटिन में कोई निश्चित उपपद नहीं है; इसलिए अनिश्चित ‘एक आवाज़’ प्रसंगानुकूल है।
- source_word: non exiebat ... sed
  choice: से नहीं, बल्कि ... से ... निकल रही थी
  rationale: लैटिन के स्पष्ट निषेध-विरोध को सुरक्षित रखते हुए हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: de capitibus eius
  choice: उसके सिरों से
  rationale: बहुवचन capitibus को ‘सिरों’ के रूप में बनाए रखा गया है।
- source_word: de medietate corporis eius
  choice: उसके शरीर के बीच से
  rationale: medietate का स्थान-सूचक अर्थ सहज हिन्दी में व्यक्त होता है और ‘मध्य भाग’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है।
