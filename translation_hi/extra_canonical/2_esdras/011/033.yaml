- source_word: et hoc sicut alae
  choice: ठीक वैसे ही जैसे पंख गायब हुए थे
  rationale: लातीनी वाक्यांश संक्षिप्त और लुप्त क्रिया वाला है; पूर्ववर्ती क्रिया को दोहराकर अर्थ स्पष्ट किया गया है, बिना तुलना को बदलने के।
