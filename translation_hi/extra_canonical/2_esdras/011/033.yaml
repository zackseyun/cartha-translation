  choice: मध्य वाला सिर
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक अर्थ; यह तीन सिरों में बीच के सिर को दर्शाता है।
- source_word: subito non conparuit
  choice: अचानक गायब हो गया
