  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce expandebat alas suas in omnem terram, et omnes uenti caeli insufflabant ad eam et [nubes ad eam] colligebantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/002.yaml
  text: And I looked[a], and behold, it spread its wings over all the earth, and all the winds of heaven were blowing upon it[b], and the clouds were gathering to it.
translation:
  language: hi
  text: और मैंने देखा, और देखो, वह अपने पंख सारी पृथ्वी पर फैला रही थी। आकाश की सभी हवाएँ उसकी ओर[a] बह रही थीं, और बादल उसकी ओर इकट्ठे हो रहे थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “उसके चारों ओर” भी किया गया है; लैटिन ad eam का अधिक सीधा अर्थ “उसकी ओर” है।
    reason: previous_rendering
  - marker: b
    text: “और बादल उसकी ओर इकट्ठे हो रहे थे” वाला अंश संशोधित बेंस्ली लैटिन पाठ में मिलता है, पर उसे पाठ की दृष्टि से अनिश्चित मानकर कोष्ठकों में रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: expandebat alas suas
  choice: अपने पंख ... फैला रही थी
  rationale: लैटिन अपूर्ण भूतकाल में जारी क्रिया को व्यक्त करता है; स्त्रीलिंग रूप प्रसंग की उकाब के अनुरूप है।
- source_word: in omnem terram
  choice: सारी पृथ्वी पर
  rationale: यह पंखों के व्यापक फैलाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: omnes uenti caeli
  choice: आकाश की सभी हवाएँ
  rationale: शाब्दिक अर्थ और दर्शनात्मक दृश्य दोनों सुरक्षित रहते हैं।
- source_word: insufflabant ad eam
  choice: उसकी ओर बह रही थीं
  rationale: ad के दिशासूचक बल को ‘उसकी ओर’ से सुरक्षित रखा गया है; insufflabant को प्रसंगानुकूल निरंतर बहने के रूप में व्यक्त किया गया है।
- source_word: ad eam colligebantur
  choice: उसकी ओर इकट्ठे हो रहे थे
  rationale: ad का अर्थ ‘की ओर’ है, जबकि colligebantur बादलों के एकत्र होने की जारी प्रक्रिया बताता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “और मैंने देखा—वह...” से लैटिन Et uidi et ecce की दर्शनात्मक तत्क्षणता व्यक्त होती है। पाठगत अनिश्चितता को मुख्य पाठ हटाए बिना पादटिप्पणी में स्पष्ट किया गया है।
