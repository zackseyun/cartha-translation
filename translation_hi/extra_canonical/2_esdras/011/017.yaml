  yaml_path: translation/extra_canonical/2_esdras/011/017.yaml
  text: 'I announce this to you before you begin to disappear: after you, no one will hold it for as long, not even half as long.”'
translation:
  language: hi
  text: '“इससे पहले कि तुम ओझल होने लगो, मैं तुम्हें यह घोषित करता हूँ: तुम्हारे बाद कोई भी उतने समय तक सत्ता में नहीं रहेगा—तुम्हारी अवधि के आधे समय तक भी नहीं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: annuntio
  choice: बता देता हूँ
  rationale: यहाँ भाव किसी बात को पहले से स्पष्ट रूप से घोषित करने का है; आधुनिक हिन्दी में यह प्रयोग स्वाभाविक है और भविष्यसूचक गंभीरता को बनाए रखता है।
- source_word: antequam incipias non parere
  choice: इससे पहले कि तुम ओझल होने लगो
  rationale: लैटिन वाक्यांश का आशय दिखाई देना बंद करने या लुप्त होने लगने से है। ‘ओझल होना’ उस चित्रात्मक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Nemo post te
  choice: तुम्हारे बाद कोई भी
  rationale: मूल की संक्षिप्त और स्पष्ट उत्तराधिकार-संबंधी अभिव्यक्ति को सीधे रखा गया है।
- source_word: hold it for as long
  choice: उतने लंबे समय तक अधिकार नहीं रखेगा
  rationale: अंग्रेज़ी परामर्श-पाठ में निहित शासन अथवा अधिकार की अवधि को हिन्दी में स्पष्ट और स्वाभाविक बनाया गया है; केवल ‘उसे थामे रखना’ इस संदर्भ में अस्पष्ट और असहज होता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन में ‘तुम’ चुना गया है, ताकि व्यक्तिकरण बना रहे लेकिन अनावश्यक रूप से कठोर या तिरस्कारपूर्ण स्वर न आए। अंतिम खंड में शासन की अवधि का भाव व्यक्त किया गया है, बिना किसी विशिष्ट ऐतिहासिक या सांप्रदायिक पहचान को पाठ में जोड़ने के।
