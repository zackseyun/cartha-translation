source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: regnare in saeculo meo, et ut per ea ueniret finis temporum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/039.yaml
  text: Are you not the one that remains of the four beasts which I had made to reign in my age[a], so that through them the end of my times might come?
translation:
  language: hi
  text: क्या तू वही नहीं है जो उन चार पशुओं में से शेष रह गया है, जिन्हें मैंने अपने युग में राज्य करने के लिए बनाया था, ताकि उनके द्वारा कालों का अंत आ सके?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् चार पशुओं के समूह में से शेष रहने वाला पशु; इसका अर्थ यह नहीं कि वह दूसरे पशुओं के किसी खतरे से बच निकला।
    reason: लैटिन के partitive अर्थ को स्पष्ट करता है और ‘बच निकलने’ के संभावित अर्थभ्रम को रोकता है।
lexical_decisions:
- source_word: regnare
  choice: राज्य करने के लिए
  rationale: लैटिन क्रिया का प्रयोजनात्मक भाव स्वाभाविक और स्पष्ट हिन्दी में व्यक्त होता है।
- source_word: in saeculo meo
  choice: मेरे युग में
  rationale: saeculum यहाँ काल या युग को सूचित करता है; ‘मेरे युग में’ मूल के संबंध और कालगत अर्थ दोनों को बनाए रखता है।
- source_word: per ea
  choice: उनके द्वारा
  rationale: नपुंसकलिंग बहुवचन सर्वनाम का संबंध चार पशुओं से है और यह माध्यम का अर्थ देता है।
- source_word: finis temporum
  choice: समयों का अंत
  rationale: बहुवचन temporum को बनाए रखा गया है, ताकि मूल की युगांत-संबंधी अभिव्यक्ति को एकवचन ‘समय’ में न समेटा जाए।
theological_decisions:
- issue: चार पशुओं में से अंतिम बचे हुए पशु की पहचान
  choice: जो उन चार पशुओं में से बचा रह गया है
  alternative: जो चार पशुओं से बच निकला है
  rationale: अंश के व्यापक लैटिन संदर्भ में partitive अर्थ है—वह चारों के समूह में से शेष है; यह अर्थ नहीं कि वह उन पशुओं के आक्रमण से बच निकला।
- issue: अंत आने में पशुओं की भूमिका
  choice: ताकि उनके द्वारा समयों का अंत आ जाए
  alternative: और इस प्रकार समयों का अंत आ जाए
  rationale: per ea पशुओं को माध्यम के रूप में प्रस्तुत करता है; अनुवाद इस तनाव को बनाए रखता है और उनकी भूमिका को केवल कालक्रम में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यदर्शी संबोधन रखा गया है। ‘तू’ एकवचन प्रत्यक्ष संबोधन को बनाए रखता है; ‘पशु’, ‘युग’ और ‘समयों का अंत’ मूल के प्रतीकात्मक तथा युगांत-संबंधी स्वर को सुरक्षित रखते हैं।
