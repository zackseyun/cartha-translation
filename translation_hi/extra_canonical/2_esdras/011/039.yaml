review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the partitive sense of the preceding Latin context (the one remaining from the four beasts), the purposive infinitive regnare, the temporal possessive in saeculo meo, and per ea as means. The subjunctive force of ueniret is better represented by “आ सके” than by the more definite “आ जाए.”
  naturalness: “बचा रह गया है” is understandable but somewhat redundant in this context. “शेष रह गया है” is more idiomatic. “कालों का अंत” is a more natural elevated Hindi rendering of finis temporum than “समयों का अंत,” while retaining the Latin plural.
  terminology: “पशु,” “राज्य करने,” “युग,” and “कालों का अंत” appropriately preserve the prophetic register without importing an interpretive identification of the beasts.
  issues:
  - severity: low
    issue: The phrase “बचा रह गया है” is slightly redundant and can momentarily evoke escape from danger.
    rationale: The Latin construction has a partitive ‘remaining from/among’ sense. “शेष रह गया है” states this directly; the retained note preserves the distinction explicitly.
  - severity: low
    issue: “समयों का अंत” is less idiomatic in elevated modern Hindi.
    rationale: “कालों का अंत” naturally conveys the plural temporum and fits the apocalyptic register.
  - severity: low
    issue: “अंत आ जाए” slightly overstates the contingent/purposive verbal force.
    rationale: “अंत आ सके” better conveys ut ... ueniret (‘so that ... might come’) without altering the intended outcome.
