  text: the twelve wings and the two little pinions disappeared. And nothing remained on the eagle’s body except the three resting heads and six little pinions.
translation:
  language: hi
  text: बारह पंख और दो छोटे पंख दिखाई दिए। और उकाब के शरीर पर शांत पड़े तीन सिरों और छह छोटे पंखों के सिवा कुछ भी नहीं बचा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवाद संदर्भ के आधार पर पहले वाक्य का अर्थ “बारह पंख और दो छोटे पंख गायब हो गए” देते हैं; पर उपलब्ध लैटिन पाठ का शाब्दिक अर्थ “दिखाई दिए” है।
    reason: दिए गए लैटिन स्रोत और अंग्रेज़ी परामर्श-पाठ के बीच महत्त्वपूर्ण पाठगत/अर्थगत अंतर को छिपाए बिना पाठक के सामने रखना।
lexical_decisions:
- source_word: conparuerunt
  choice: दिखाई दिए
  rationale: उपलब्ध लैटिन पाठ में क्रिया का सीधा अर्थ ‘प्रकट हुए/दिखाई दिए’ है। अंग्रेज़ी परामर्श-पाठ का ‘disappeared’ संभवतः पाठगत या संदर्भगत सुधार को दर्शाता है, पर दिए गए मूल-पाठ से उसका सीधा समर्थन नहीं होता।
- source_word: pennae
  choice: पंख
  rationale: उकाब के बड़े पंखों के लिए सहज और सामान्य हिन्दी शब्द।
- source_word: pennacula
  choice: छोटे पंख
  rationale: लैटिन का लघुतासूचक रूप है; ‘छोटे पंख’ अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: quiescentia
  choice: शांत पड़े
  rationale: सिरों की स्थिर, निष्क्रिय अवस्था को दर्शाता है और ‘विश्राम करते हुए’ की असहज सजीवता से बचता है।
- source_word: superauit
  choice: बचा
  rationale: इस प्रसंग में शेष रह जाने का भाव है; अतः ‘बचा’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘उकाब’ बाइबलीय संदर्भ में eagle के लिए प्रचलित और विशिष्ट शब्द है।
