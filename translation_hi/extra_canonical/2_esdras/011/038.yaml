  text: Are you not the one who prevailed over the four beasts that I had made[a]
translation:
  language: hi
  text: क्या तू वही नहीं है, जो मेरे बनाए हुए चार पशुओं में से बचा रह गया था?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nonne tu es
  choice: क्या तू वही नहीं है
  rationale: नकारात्मक प्रश्न की बलपूर्ण संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: superasti de
  choice: में प्रबल हुआ था
  rationale: superasti के ‘प्रबल होना/बढ़ निकलना’ भाव और de quattuor के समूह-संबंध को साथ रखता है; इसे सीधे ‘चारों को पराजित किया’ कहना मूल से अधिक निश्चित होता।
- source_word: quattuor animalibus
  choice: चार पशुओं
  rationale: दर्शन-साहित्य के animalia के लिए ‘पशु’ स्पष्ट, सामान्य और प्रसंगानुकूल है।
- source_word: quae feceram
  choice: मेरे बनाए हुए
  rationale: कर्ता के प्रथम पुरुष और पूर्ण किए गए सृजन-कर्म को संक्षिप्त तथा स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: चार पशुओं के साथ संबद्धता और superasti का आशय
  choice: चार पशुओं में प्रबल हुआ था
  alternative: चार पशुओं में से बचा रहा था / चार पशुओं पर प्रबल हुआ था
  rationale: लैटिन superasti ‘प्रबल हुआ’, ‘आगे निकल गया’ या ‘बचा रहा’ दर्शा सकता है, और de quattuor animalibus समूह में से/समूह के संबंध में होने का भाव दे सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी उत्तरजीविता वाला संभावित अर्थ बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली हिन्दी; ‘तू’ दर्शन में परमप्रधान द्वारा संबोधित प्रतीकात्मक पशु के लिए मूल के एकवचन निकट संबोधन को दर्शाता है।
