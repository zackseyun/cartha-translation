- source_word: comedit
  choice: निगल लिया
  rationale: लातीनी क्रिया का मूल अर्थ ‘खा गया/भस्म कर गया’ है; पक्षी-दर्शन के संदर्भ में ‘निगल लिया’ स्वाभाविक और प्रबल है।
- source_word: duas subalares
  choice: उन दोनों अधीनस्थ पंखों को
  rationale: subalares उन पंखों को सूचित करता है जो मुख्य पंखों के नीचे या अधीन हैं। ‘अधीनस्थ पंख’ इस संबंध को संक्षेप में बनाए रखता है; स्त्रीलिंग duas का हिन्दी में स्वाभाविक रूप ‘दोनों’ है।
- source_word: cogitabant regnare
  choice: जो राज्य करने की सोच रहे थे
  rationale: यह अभिव्यक्ति उनके शासन करने के विचार या इरादे को बताती है; ‘सोच रहे थे’ मूल की संभावित अस्पष्टता को किसी निश्चित योजना या दावे में नहीं बदलता।
