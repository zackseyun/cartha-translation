  text: The head on the right side devoured the one on the left. And I heard a voice saying to me, “Look before you, and—”
translation:
  language: hi
  text: दाहिनी ओर के सिर ने बाईं ओर के सिर को निगल लिया। और मैंने एक आवाज़ सुनी, जो मुझसे कह रही थी, “अपने सामने देखो, और—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: caput a dextera parte
  choice: दाहिनी ओर का सिर
  rationale: लैटिन पदबंध का स्वाभाविक और सटीक हिन्दी रूप; यह उकाब के दाहिनी ओर स्थित सिर को सूचित करता है।
- source_word: illud quod est a laeua
  choice: बाईं ओर का सिर
  rationale: लैटिन में संज्ञा दोहराई नहीं गई, पर हिन्दी में संदर्भ स्पष्ट रखने के लिए ‘सिर’ दोहराया गया है।
- source_word: deuorauit
  choice: निगल लिया
  rationale: ‘खा गया’ की अपेक्षा यह हिंसक पूर्ण भक्षण के अर्थ को अधिक निकटता से व्यक्त करता है और दर्शन-वर्णन के गरिमापूर्ण स्वर के अनुकूल है।
- source_word: conspice contra te
  choice: अपने सामने देखो
  rationale: शाब्दिक दिशा-बोध बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक आज्ञार्थक अभिव्यक्ति।
