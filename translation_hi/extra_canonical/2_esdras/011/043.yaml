  text: qui te non nocuerunt. Et ascendit contumelia tua ad altissimum et superbia tua ad fortem. Et respexit altissimus super sua tempora, et ecce finita sunt, et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/043.yaml
  text: who did not harm you. And your insolence has gone up to the Most High, and your pride to the Mighty One. And the Most High has looked upon his times, and behold, they are ended, and his ages are completed.
translation:
  language: hi
  text: जिन्होंने तुम्हें कोई हानि नहीं पहुँचाई। तुम्हारी धृष्टता परमप्रधान तक और तुम्हारा घमंड शक्तिमान तक पहुँच गया है। परमप्रधान ने अपने समयों पर दृष्टि की, और देखो, वे समाप्त हो गए हैं, और उसके युग पूरे हो चुके हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contumelia
  choice: धृष्टता
  rationale: यहाँ शब्द अपमानजनक उद्दंडता और निरंकुश व्यवहार का भाव देता है; ‘धृष्टता’ इस अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: altissimum
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का प्रतिष्ठित और अर्थ-सटीक हिन्दी रूप।
- source_word: superbia
  choice: घमण्ड
  rationale: अहंकारी आत्म-उत्कर्ष के मूल भाव को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: fortem
  choice: सामर्थी
  rationale: ईश्वर की उपाधि के रूप में ‘बलवान’ की अपेक्षा अधिक गरिमापूर्ण और स्वाभाविक संज्ञात्मक रूप।
- source_word: tempora
  choice: ठहराए हुए समयों
  rationale: संदर्भ में केवल कालखंड नहीं, शासन के लिए नियत अवधियाँ अभिप्रेत हैं; यह रूप उस भाव को स्पष्ट करता है।
- source_word: saecula
  choice: युग
  rationale: दीर्घ, निर्धारित कालखंडों के अर्थ को हिन्दी बाइबलीय शैली में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: super sua tempora में सर्वनाम का संकेत
  choice: उसके ठहराए हुए समयों
  alternative: अपने समयों
  rationale: लैटिन sua व्याकरणतः वाक्य के कर्ता ‘परमप्रधान’ की ओर लौट सकता है, पर संदर्भ में संबोधित सत्ता के नियत समयों का समाप्त होना अधिक संगत है। हिन्दी ‘उसके’ इस संदर्भगत अर्थ को व्यक्त करता है, जबकि ‘ठहराए हुए’ यह संकेत देता है कि परमप्रधान ने वे समय नियत किए थे।
- issue: eius का पूर्वपद
  choice: उसके युग
  alternative: परमप्रधान के युग
  rationale: निकटवर्ती संदर्भ में इसका संकेत संबोधित राज्य या सत्ता की अवधि की ओर समझना अधिक स्वाभाविक है; ईश्वर के युगों के समाप्त होने का अर्थ प्रसंग से मेल नहीं खाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। आरम्भिक खंड पिछले पद के वाक्य को पूरा करता है, इसलिए स्रोत के अनुसार उसे खंड-वाक्य के रूप में बनाए रखा गया है। ‘और’ की अत्यधिक पुनरावृत्ति घटाकर हिन्दी प्रवाह सुधारा गया है, जबकि मूल क्रम और उद्घोषात्मक ‘देखो’ सुरक्षित हैं।
