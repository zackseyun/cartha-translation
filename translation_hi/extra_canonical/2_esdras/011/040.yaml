base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/040.yaml
  text: And the fourth that came overcame all the beasts that had passed before[a], and held the age by its power with great trembling, and the whole world with most grievous oppression[b], and for so long inhabited the world with deceit.
translation:
  language: hi
  text: और जो चौथा आया, उसने उन सब पशुओं को पराजित कर दिया जो उससे पहले आए थे[a]। उसने अपनी शक्ति के बल पर युग को बड़े भय में और सारे संसार को घोर उत्पीड़न में जकड़े रखा[b], और बहुत लंबे समय तक छल करते हुए संसार में बना रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का लैटिन पाठ कुछ स्थानों पर विकृत और कठिन है। अनुवाद उसके संभावित आशय का अनुसरण करता है: चौथे पशु ने पहले के पशुओं को पराजित किया और युग तथा संसार को भय, उत्पीड़न और छल के अधीन रखा।'
    reason: textual_variant
  - marker: b
    text: या, “उसने युग को बड़े भय में और सारे संसार को घोर उत्पीड़न में थामे रखा।”
    reason: previous_rendering
lexical_decisions:
- source_word: animalia
  choice: पशुओं
  rationale: दर्शन के प्रतीकात्मक प्राणियों के लिए सरल और स्वाभाविक शब्द; संदर्भ में ये पहले आए पशु हैं।
- source_word: potentatu tenens
  choice: अपनी शक्ति से ... दबाए रखा
  rationale: potentatu में व्यक्त साधन या प्रभुत्व को स्पष्ट रखते हुए tenens के निरंतर नियंत्रण का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: saeculum
  choice: युग
  rationale: लैटिन saeculum का कालगत विस्तार सुरक्षित रखता है और इसे बिना आधार केवल ‘संसार’ में नहीं मिलाता।
- source_word: cum tremore multo
  choice: भारी भय में
  rationale: शाब्दिक ‘बहुत काँपने के साथ’ के बजाय शासन से उत्पन्न व्यापक भय और आतंक का स्वाभाविक हिन्दी बोध देता है।
- source_word: cum labore pessimo
  choice: घोर उत्पीड़न में
  rationale: यहाँ labor केवल परिश्रम नहीं, बल्कि कठोर कष्ट और दमन का भाव रखता है; राजनीतिक पशु के संदर्भ में ‘उत्पीड़न’ उपयुक्त है।
- source_word: inhabitabant ... tot
  choice: इतने लंबे समय तक ... संसार में बना रहा
  rationale: प्राप्त लैटिन पाठ व्याकरणतः विकृत और अपूर्ण है; परामर्श-पाठ में संरक्षित apparent sense को सहज हिन्दी में व्यक्त किया गया है, बिना अत्यधिक निश्चितता जताए।
theological_decisions:
- issue: चौथे पशु और उसके शासन का स्वरूप
  choice: पाठ के प्रतीकात्मक और दमनकारी चित्रण को ज्यों का त्यों रखा गया
  alternative: इसे किसी विशिष्ट साम्राज्य या धार्मिक-ऐतिहासिक सत्ता का नाम देना
  rationale: इस पद में सत्ता की स्पष्ट पहचान नहीं दी गई; किसी खास व्याख्यात्मक परंपरा को अनुवाद में जोड़ना अनुचित होता।
- issue: saeculum का आशय
  choice: ‘युग’
  alternative: ‘संसार’ या ‘संसार-व्यवस्था’
  rationale: अगले समानांतर खंड में omnem orbem स्पष्टतः ‘सारा संसार’ है; दोनों को अलग रखकर मूल की अर्थगत तनाव और समानांतरता बचती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘दबाए रखा’ शासन के दमनकारी स्वरूप को सहजता से व्यक्त करता है। स्रोत की पाठगत कठिनाई को मुख्य पाठ में कृत्रिम रूप से हल करने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
