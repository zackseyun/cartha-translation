    rationale: The singular ‘loco suo’ may denote the group’s place rather than an individual place for each of the four.
  - severity: low
    issue: ‘फिर’ adds an unnecessary sequential inference.
    rationale: The source conjunction ‘Et’ is adequately and more closely represented by ‘और’.
  - severity: low
    issue: ‘अधोपंख’ is less idiomatic as a Hindi technical compound.
    rationale: ‘अधःपंख’ is a clearer standard Sanskritic formation for ‘under-wing’ while preserving the source image.
