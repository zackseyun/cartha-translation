  source_fidelity: '‘चार’ correctly preserves the Latin’s implicit noun, and the draft appropriately does not supply material beyond the excerpt. ‘अपने-अपने स्थान’ slightly overstates the distributive sense: Latin ‘in loco suo’ can naturally refer to their (shared) place. ‘फिर’ adds a sequential nuance not required by ‘Et’.'
