  text: वह तेरे समय की अवधि तक बना रहेगा, पर उसके आधे समय तक भी नहीं। तब तीसरा उठा और उसने पहले वालों की तरह शासन किया; फिर वह दिखाई नहीं दिया, और
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tenebit tempus tuum
  choice: तेरे शासनकाल जितने समय तक अधिकार रखेगा
  rationale: शाब्दिक अर्थ ‘तेरा समय धारण करेगा’ हिन्दी में अस्पष्ट और अस्वाभाविक है। प्रसंग शासकों के अधिकार की अवधि का है, इसलिए ‘शासनकाल जितने समय तक अधिकार रखेगा’ tempus और tenebit दोनों का स्वाभाविक रूप से संप्रेषण करता है।
- source_word: sed nec dimidium eius
  choice: पर उसके आधे समय तक भी नहीं
  rationale: sed का विरोधसूचक बल और nec का ‘भी नहीं’ वाला जोर सुरक्षित रखा गया है; eius का संबंध अभी उल्लिखित शासनकाल की अवधि से स्पष्ट किया गया है।
- source_word: leuauit se tertia
  choice: तब तीसरा उठा
  rationale: Latin में tertia स्त्रीलिंग है क्योंकि प्रसंगगत संज्ञा भी स्त्रीलिंग है; आधुनिक हिन्दी में गिने जा रहे शासक/पंख के लिए सहज क्रमसूचक रूप ‘तीसरा’ रखा गया है। leuauit se का सीधा और स्वाभाविक अनुवाद ‘उठा’ है।
- source_word: tenuit principatum
  choice: शासन किया
  rationale: principatus यहाँ प्रधान अधिकार या शासन को सूचित करता है; ‘शासन किया’ सामान्य पाठक के लिए स्वाभाविक है और अनावश्यक संस्थागत अर्थ नहीं जोड़ता।
- source_word: non apparuit
  choice: दिखाई नहीं दिया
  rationale: यह Latin का निकट अनुवाद है और ‘लुप्त हो गया’ जैसी अधिक व्याख्यात्मक भाषा के बजाय मूल की संभावित अस्पष्टता बनाए रखता है।
