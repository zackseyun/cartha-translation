  yaml_path: translation/extra_canonical/2_esdras/011/044.yaml
  text: And the Most High has looked upon his times, and behold, they have ended, and his ages are complete.
translation:
  language: hi
  text: और परमप्रधान ने अपने समयों पर दृष्टि की, और देखो, वे समाप्त हो गए हैं और उसके युग पूरे हो गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Altissimus
  choice: परमप्रधान
  rationale: यह ईश्वर के लिए प्रयुक्त लैटिन उपाधि का प्रचलित, गरिमापूर्ण और अर्थ-सटीक हिन्दी रूप है।
- source_word: respexit ... super
  choice: '... पर दृष्टि की'
  rationale: यह मूल की ओर ध्यान देने अथवा निरीक्षण करने की छवि को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: tempora
  choice: समयों
  rationale: बहुवचन को सुरक्षित रखा गया है और इसे आगे के 'वे' का स्पष्ट पूर्वपद बनाया गया है।
- source_word: saecula
  choice: युग
  rationale: यहाँ बहुवचन रूप दीर्घ कालखंडों अथवा नियत युगों को व्यक्त करता है; 'संसार' की अपेक्षा 'युग' प्रसंगानुकूल है।
- source_word: conpleta sunt
  choice: पूरे हो गए हैं
  rationale: यह पूर्णता अथवा निर्धारित अवधि के भर जाने का भाव देता है और 'समाप्त हो गए हैं' के साथ अनावश्यक शब्दगत पुनरावृत्ति से बचता है।
theological_decisions:
- issue: suorum सर्वनाम का संबंध
  choice: '''उसके समयों'' और ''उसके युग''—दोनों को उसी एकवचन पुरुष से संबद्ध रखा गया है जिसका उल्लेख प्रसंग में है।'
  alternative: सर्वनाम को परमप्रधान से संबद्ध समझकर 'अपने समयों/अपने युगों' कहना।
  rationale: लैटिन sua और eius का व्याकरणिक संदर्भ प्रसंगाधीन है; उपलब्ध अंग्रेज़ी परामर्श-पाठ दोनों को 'his' रखता है। हिन्दी में 'उसके' मूल की संदर्भगत अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है, जबकि 'अपने' निर्णायक रूप से परमप्रधान की ओर संकेत करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी वाक्य-रचना रखी गई है। 'और देखो' से मूल के et ecce का बल और भविष्यदर्शी शैली सुरक्षित रहती है।
