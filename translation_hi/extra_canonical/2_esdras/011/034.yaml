  text: auerunt autem duo capita quae et ipsa regnauerunt super terram et super eos qui inhabitant in ea. Et uidi et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/034.yaml
  text: But two heads remained, and they too reigned over the earth and over those who dwell in it. And I saw, and behold,
translation:
  language: hi
  text: परन्तु दो सिर बचे रहे, और उन्होंने भी पृथ्वी और उसके निवासियों पर शासन किया। फिर मैंने देखा, और देखो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auerunt
  choice: बचे रहे
  rationale: संदर्भ और अंग्रेज़ी परामर्श-पाठ के आधार पर यह रूप संभवतः Latin ‘remanserunt’ या समानार्थी पाठ का विकृत/अपूर्ण रूप है; ‘बचे रहे’ दो सिरों के शेष रहने का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: capita
  choice: सिर
  rationale: दर्शन में उकाब के अंगों के लिए प्रयुक्त ठोस रूपक को बनाए रखा गया है।
- source_word: regnauerunt
  choice: शासन किया
  rationale: राजकीय अधिकार और प्रभुत्व का सामान्य, गरिमापूर्ण हिन्दी रूप।
- source_word: super terram et super eos qui inhabitant in ea
  choice: पृथ्वी और उसके निवासियों पर
  rationale: दोनों Latin ‘super’ का साझा ‘पर’ के अंतर्गत संक्षिप्त और स्वाभाविक निरूपण; पृथ्वी तथा उसमें रहनेवालों दोनों पर शासन का अर्थ सुरक्षित है।
- source_word: Et uidi et ecce
  choice: फिर मैंने देखा, और देखो,
  rationale: दर्शन-वर्णन की सूत्रात्मक अभिव्यक्ति और अगले पद की ओर खुला संक्रमण बनाए रखा गया है; आरम्भिक ‘Et’ को हिन्दी कथानक में स्वाभाविक ‘फिर’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और दृश्यात्मक शैली। पद का अंतिम अधूरा सूत्र ‘और देखो,’ जानबूझकर बनाए रखा गया है, क्योंकि Latin पाठ अगले कथन की ओर बढ़ता है।
