  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। दर्शन के प्रतीक ‘सिर’ और ‘पंख’ की व्याख्या पाठ में नहीं जोड़ी गई। अंतिम वाक्यांश को स्रोत की तरह अगले पद की ओर खुला छोड़ा गया है।
