  text: And this head held sway over the whole earth and ruled those who inhabited it with much oppression, and it held dominion over the inhabited world more than all the wings that had been before it. And I saw after these things, and behold,
translation:
  language: hi
  text: और उस सिर ने सारी पृथ्वी को अपने अधीन रखा और उसमें रहनेवालों पर बहुत दमन करके शासन किया। उसने उससे पहले के सभी पंखों से बढ़कर संसार पर प्रभुत्व बनाए रखा। इसके बाद मैंने देखा, और देखो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: caput
  choice: सिर
  rationale: दर्शन के प्रतीकात्मक अंग के लिए लैटिन का सीधा और स्वाभाविक समतुल्य।
- source_word: percontinuit
  choice: अधिकार बनाए रखा
  rationale: दुर्लभ लैटिन रूप का आशय लगातार नियंत्रण या वर्चस्व रखने का है; हिंदी में इसे सहज और संदर्भानुकूल रूप दिया गया है।
- source_word: cum labore multo
  choice: बड़ी कठोरता से
  rationale: शाब्दिक अर्थ ‘बहुत परिश्रम/कष्ट के साथ’ हो सकता है, पर शासित निवासियों के संदर्भ में यह भारी कष्ट या दमनकारी शासन को सूचित करता है; ‘कठोरता’ उस बल को बिना अनावश्यक विस्तार के व्यक्त करती है।
- source_word: potentatum tenuit
  choice: प्रभुत्व बनाए रखा
  rationale: सत्ता या वर्चस्व को धारण किए रहने का अर्थ सुरक्षित रहता है और पहले खंड की निरंतरता से मेल खाता है।
- source_word: orbis terrarum
  choice: संसार
  rationale: आबाद जगत/विश्व के सामान्य अर्थ को आधुनिक, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: alas
  choice: पंखों
  rationale: दर्शन की प्रतीकात्मक शब्दावली को सीधे सुरक्षित रखा गया है।
- source_word: Et uidi post haec et ecce
  choice: इसके बाद मैंने देखा, और देखो,
  rationale: अगले दर्शन की ओर ले जाने वाले अधूरे संक्रमण और ‘ecce’ के आकस्मिक ध्यानाकर्षण को बनाए रखा गया है।
