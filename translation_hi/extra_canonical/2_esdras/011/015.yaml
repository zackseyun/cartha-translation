lexical_decisions:
- source_word: ueniebat finis eius
  choice: उसका अंत निकट आ रहा था
  rationale: लातीनी वाक्यांश का स्वाभाविक हिन्दी रूप; अपूर्ण भूतकाल आने की जारी प्रक्रिया बताता है और eius के संदर्भ को अनिर्दिष्ट रहने देता है।
- source_word: ut non appareret
  choice: ताकि वह ... दिखाई न दे
  rationale: appareret का सीधा अर्थ ‘दिखाई दे/प्रकट हो’ है; इसे ‘लुप्त हो जाए’ बनाकर परिणाम को अधिक निश्चित नहीं किया गया।
- source_word: sicut prior
  choice: पहलेवाले के समान
  rationale: prior का संदर्भ प्रसंग से समझा जाता है; हिन्दी में पुल्लिंग एकवचन रूप तुलना को बनाए रखता है।
- source_word: Et ecce uox
  choice: और देखो, एक आवाज़
  rationale: ecce की ध्यान आकर्षित करने वाली शक्ति और पद के अधूरे वाक्यांश को सुरक्षित रखा गया है।
