  text: और मैंने देखा, और देखो, उन छह छोटे पंखों में से दो अलग हो गए और उस सिर के नीचे बने रहे जो दाहिनी ओर था; क्योंकि
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennaculis
  choice: छोटे पंखों
  rationale: लैटिन के लघुतावाचक बहुवचन को सरल और स्वाभाविक हिन्दी में व्यक्त करता है तथा बड़े पंखों से इनकी भिन्नता बनाए रखता है।
- source_word: diuisa sunt
  choice: अलग हो गए
  rationale: यह कर्मवाच्य अर्थ को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है, बिना यह बताए कि उन्हें किसने अलग किया।
- source_word: manserunt
  choice: ठहरे रहे
  rationale: इन दो छोटे पंखों के उस स्थान पर बने रहने का भाव सुरक्षित रखता है।
- source_word: ad dexteram partem
  choice: दाहिनी ओर
  rationale: स्थानसूचक लैटिन पदबंध का स्पष्ट और वर्तमान हिन्दी रूप।
- source_word: nam
  choice: क्योंकि
  rationale: कारणसूचक संयोजक का अर्थ सुरक्षित रखता है; पद अगले वचन में जारी रहने वाला अधूरा वाक्य है।
