lexical_decisions:
- source_word: ipsa
  choice: वह
  rationale: यह स्त्रीलिंग सर्वनाम पिछले संदर्भ की सत्ता/इकाई की ओर संकेत करता है; हिन्दी में स्वाभाविक रूप से ‘वह’ रखा गया है।
- source_word: multum ... tempus
  choice: बहुत समय तक
  rationale: लंबी अवधि का सीधा और सहज हिन्दी रूप।
- source_word: tenuit
  choice: सत्ता में रही
  rationale: यहाँ tenere को शासनाधिकार बनाए रखने के अर्थ में समझा गया है; ‘सत्ता में रही’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: Et factum est
  choice: और ऐसा हुआ कि
  rationale: लैटिन कथात्मक सूत्र का औपचारिक किंतु सहज हिन्दी समतुल्य।
- source_word: cum regnaret
  choice: जब वह राज्य कर रही थी
  rationale: अपूर्णकालिक subjunctive का प्रसंगगत समय-संबंध बनाए रखता है और वाक्य के अगले पद के लिए खुला रहता है।
