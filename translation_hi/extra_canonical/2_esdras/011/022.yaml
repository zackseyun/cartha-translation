    issue: Ability nuance in “शासन नहीं कर पाए”
    rationale: Latin non tenebant is a simple negation of holding/exercising rule, not an assertion that the subjects tried and failed or lacked ability. Hindi “नहीं कर पाए” commonly carries that additional nuance.
