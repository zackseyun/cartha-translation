  source_fidelity: The draft correctly preserves the sequence, first-person vision report, and the deliberately incomplete final Latin negation. However, “शासन नहीं कर पाए” introduces an ability/failed-attempt nuance (“were unable to rule”) that is not expressed by Latin non tenebant principatum (“did not hold the rule/sovereignty”).
