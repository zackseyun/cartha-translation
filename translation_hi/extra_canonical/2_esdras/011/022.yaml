lexical_decisions:
- source_word: tenebant principatum
  choice: शासन नहीं कर पाए
  rationale: लातीनी पद का अर्थ सत्ता अथवा शासन को धारण किए रहना है; संदर्भ में स्वाभाविक हिन्दी के लिए ‘शासन नहीं कर पाए’ चुना गया।
- source_word: Et uidi post haec
  choice: इसके बाद मैंने देखा
  rationale: दर्शन-वर्णन की क्रमिकता और प्रथम पुरुष को सीधे बनाए रखता है।
- source_word: et ecce
  choice: और देखो
  rationale: लातीनी ecce का ध्यान आकर्षित करने वाला कथात्मक बल सुरक्षित रखता है।
- source_word: non
  choice: नहीं—
  rationale: स्रोत-पाठ इसी निषेध-वाचक शब्द पर अधूरा समाप्त होता है; ‘नहीं’ को बनाए रखकर डैश से अगले पद में जारी वाक्य का संकेत दिया गया है।
