source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cum ueritate ; Tribulasti enim mansuetos et laesisti quiescentes, odisti uerum dicentes et dilexisti mendaces, et destruxisti habitationes eorum qui fructificabant, et humiliasti muros eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/042.yaml
  text: For you afflicted the meek and injured the peaceable; you hated those who spoke truth and loved liars; you destroyed the dwellings of those who bore fruit, and humbled their walls.
translation:
  language: hi
  text: क्योंकि तूने नम्र लोगों को सताया और शांतिपूर्वक रहने वालों को हानि पहुँचाई; तूने सत्य बोलने वालों से घृणा की और झूठों से प्रेम किया; तूने फल देने वालों के निवास-स्थान नष्ट कर दिए और उनकी दीवारों को नीचा कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mansuetos
  choice: नम्र लोगों
  rationale: लैटिन शब्द नम्र, विनीत या कोमल स्वभाव वाले लोगों को सूचित करता है; ‘नम्र’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: quiescentes
  choice: शांतिप्रिय लोगों
  rationale: शाब्दिक अर्थ ‘शांति से रहने वाले’ है; यहाँ अत्याचार न करने वाले, शांत लोगों के लिए सहज हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: uerum dicentes
  choice: सच बोलने वालों
  rationale: मूल की सक्रिय अभिव्यक्ति को सीधे और सामान्य आधुनिक हिन्दी में रखा गया है।
- source_word: mendaces
  choice: झूठ बोलने वालों
  rationale: ‘झूठे लोगों’ की तुलना में यह उन लोगों के आचरण पर मूल के समान स्पष्ट बल देता है।
- source_word: habitationes
  choice: घर
  rationale: यह निवास-स्थानों को दर्शाता है; ‘घर’ साधारण पाठक के लिए स्वाभाविक है और अर्थ को अनावश्यक रूप से तकनीकी नहीं बनाता।
- source_word: fructificabant
  choice: फल लाने वालों
  rationale: मूल की फल उत्पन्न करने वाली रूपकात्मक अथवा वास्तविक भाषा को बिना व्याख्यात्मक सीमांकन के सुरक्षित रखा गया है।
- source_word: humiliasti muros eorum
  choice: उनकी शहरपनाहों को नीचा कर दिया
  rationale: ‘दीवारों को दीन किया’ हिन्दी में अस्वाभाविक होता। ‘नीचा कर दिया’ मूल क्रिया का चित्र बनाए रखता है और संदर्भ में प्रतिरक्षा-दीवारों को गिराने या घटाने का भाव देता है; ‘शहरपनाह’ से यहाँ सामुदायिक रक्षात्मक दीवारें स्पष्ट होती हैं।
theological_decisions:
- issue: fructificabant का आशय
  choice: फल लाने वालों
  alternative: उपज देने वालों / फलवन्त लोगों
  rationale: यह भाषा भौतिक उत्पादकता और नैतिक या आध्यात्मिक फलवन्तता, दोनों की संभावना रखती है; अनुवाद उस वास्तविक अस्पष्टता को बनाए रखता है।
- issue: humiliasti का रूपक
  choice: नीचा कर दिया
  alternative: ढा दिया
  rationale: ‘ढा दिया’ विनाश को अधिक निश्चित बना देता, जबकि लैटिन क्रिया का मूल भाव नीचा या अपमानित करना है; चुना गया रूप भौतिक और रूपकात्मक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एकवचन शासक को संबोधन के लिए ‘तूने’ मूल की प्रत्यक्ष और अभियोगात्मक तीव्रता बनाए रखता है। आरंभिक ‘cum ueritate’ उपलब्ध अंश में पिछले वाक्य का अंतिम पद है और इस पद के स्वतंत्र वाक्य से नहीं जोड़ा गया; इसलिए मुख्य पाठ ‘Tribulasti enim’ से आरंभ किया गया है।
