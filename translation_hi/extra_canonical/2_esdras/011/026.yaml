  text: तब मैंने देखा, और देखो, एक उठी, पर वह तुरंत गायब हो गई; फिर दूसरी, और यह भी…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लैटिन पाठ यहाँ अधूरा टूट जाता है।
    reason: पाठ के अचानक समाप्त होने को स्रोत-साक्ष्य की वास्तविक स्थिति के रूप में बताना।
lexical_decisions:
- source_word: erecta est
  choice: उठ खड़ा हुआ
  rationale: लातीनी निष्क्रिय रूप का स्वाभाविक हिन्दी रूप दिया गया है; प्रसंग में इसका अर्थ सत्ता ग्रहण करने के लिए उठना है, पर पाठ में निहित अर्थ से अधिक स्पष्टता नहीं जोड़ी गई।
- source_word: statim non conparuit
  choice: तुरंत गायब हो गया
  rationale: ‘तुरंत दिखाई नहीं दिया’ के शाब्दिक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Et secunda
  choice: फिर दूसरा उठा
  rationale: लातीनी पाठ में क्रिया पूर्ववर्ती वाक्य से अध्याहृत है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘उठा’ दोहराया गया है।
theological_decisions:
- issue: खंडित अंतिम वाक्य
  choice: ‘और यह भी…’ पर वाक्य को अधूरा रखा गया
  alternative: बाद की पाठ-परंपरा के आधार पर कोई परिणाम जोड़ना
  rationale: उपलब्ध लातीनी स्रोत ‘Et secunda, et haec’ पर टूट जाता है; इसलिए अनुपलब्ध शब्दों से आशय पूरा करना उचित नहीं है।
translation_notes:
