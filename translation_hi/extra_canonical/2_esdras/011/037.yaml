  text: 'roaring; and I heard how it sent out a human voice to the eagle and said[a], saying: “Hear, and I will speak to you; the Most High says to you:'
translation:
  language: hi
  text: 'गरजते हुए; और मैंने सुना कि उसने उकाब से मनुष्य की-सी आवाज़ में यह कहते हुए बोला: “सुन, मैं तुझसे बोलूँगा; परमप्रधान तुझसे कहता है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mugiens
  choice: गरजते हुए
  rationale: यह वर्तमान कृदन्त पिछले पद से जुड़े हुए सिंह-सदृश प्राणी की गर्जना को व्यक्त करता है और स्रोत की पद-सीमा बनाए रखता है।
- source_word: emisit uocem hominis
  choice: मनुष्य की-सी आवाज़ निकाली
  rationale: लैटिन में शाब्दिक अर्थ ‘मनुष्य की आवाज़ निकाली’ है; ‘मनुष्य की-सी’ हिन्दी में स्वाभाविक रूप से आवाज़ के मानवीय स्वरूप को बताता है।
- source_word: aquilam
  choice: उकाब
  rationale: aquila के लिए प्रचलित, गरिमापूर्ण और स्पष्ट हिन्दी पक्षी-नाम।
- source_word: dixit dicens
  choice: कहा—कहते हुए
  rationale: स्रोत में संरक्षित सामी शैली की पुनरुक्ति को असामान्य होते हुए भी जानबूझकर बनाए रखा गया है।
- source_word: Audi tu
  choice: सुन
  rationale: एकवचन प्रत्यक्ष आज्ञा है; पृथक tu का बल हिन्दी के सीधे संबोधन में निहित है।
- source_word: altissimus
  choice: परमप्रधान
  rationale: ईश्वर के इस विशेषण/उपाधि का स्थापित और अर्थ-सटीक हिन्दी रूप।
theological_decisions:
- issue: ‘परमप्रधान’ के कथन और बोलने वाले प्राणी की आवाज़ का संबंध
  choice: “परमप्रधान तुझसे कहता है” को सीधे कथन के रूप में रखा
  alternative: इसे ‘परमप्रधान की ओर से’ या प्राणी को स्वयं परमप्रधान की आवाज़ बताना
  rationale: लैटिन केवल dicit altissimus tibi कहता है; अनुवाद दूतत्व या वक्ता की पहचान पर अतिरिक्त धर्मवैचारिक निष्कर्ष नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्रोत-सन्निकट शैली। पद पिछले पद के कृदन्त ‘गरजते हुए’ से आरम्भ होता है, इसलिए आरम्भिक खंड की अपूर्णता जानबूझकर सुरक्षित है। ‘कहा—कहते हुए’ असामान्य है, पर dixit dicens की सामी पुनरुक्ति को बनाए रखता है।
