  text: And it happened on the second night that I saw a dream, and behold, an eagle was coming up from the sea, and it had twelve feathered wings and three heads.
translation:
  language: hi
  text: और ऐसा हुआ कि दूसरी रात मैंने एक स्वप्न देखा। और देखो, समुद्र से एक उकाब ऊपर उठ रहा था, जिसके बारह पंखदार डैने और तीन सिर थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: secunda nocte
  choice: दूसरी रात
  rationale: लातीनी पद का सीधा और स्वाभाविक काल-सूचक अनुवाद।
- source_word: somnium
  choice: स्वप्न
  rationale: गरिमापूर्ण और सामान्य आधुनिक हिन्दी में समझा जाने वाला शब्द।
- source_word: aquila
  choice: उकाब
  rationale: बड़े शिकारी पक्षी के लिए प्रचलित बाइबलीय हिन्दी शब्द, जो aquila के अर्थ को व्यक्त करता है।
- source_word: ascendebat de mari
  choice: समुद्र से ... ऊपर उठ रहा था
  rationale: अपूर्ण भूतकाल की जारी क्रिया और de mari की दिशा दोनों को सुरक्षित रखता है।
- source_word: duodecim alae pennarum
  choice: बारह पंखदार डैने
  rationale: असामान्य लातीनी अभिव्यक्ति alae pennarum को बिना संख्या या दृश्यात्मकता खोए स्वाभाविक हिन्दी में रखता है।
- source_word: capita tria
  choice: तीन सिर
  rationale: मूल की संख्या और बहुवचन का सीधा अनुवाद।
