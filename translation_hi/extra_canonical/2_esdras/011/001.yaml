  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक शैली रखी गई है। मूल के ‘और ऐसा हुआ’ तथा ‘और देखो’ जैसे दर्शन-वृत्तांत के संकेत सुरक्षित हैं; किसी प्रतीक का अर्थ व्याख्या के रूप में पाठ में नहीं जोड़ा गया।
