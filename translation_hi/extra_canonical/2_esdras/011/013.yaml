id: 2ES.11.13
reference: 2 Esdras 11:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum regnaret et uenit ei finis et non apparuit, ita ut non appareret locus eius; et sequens exsurrexit et regnauit et ipsa multum tenuit tempus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/013.yaml
  text: And it happened that when it reigned, its end came and it did not appear, so that its place did not appear; then the next rose up and reigned, and it held power for a long time.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह राज्य कर रही थी, तब उसका अन्त आ गया और वह दिखाई नहीं दी—यहाँ तक कि उसका स्थान भी दिखाई नहीं दिया। फिर अगली उठ खड़ी हुई और उसने राज्य किया, और वह बहुत समय तक सत्ता में बनी रही।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnaret / regnauit
  choice: राज्य कर रही थी / उसने राज्य किया
  rationale: लातीनी क्रिया का राजकीय शासन-संबंधी अर्थ सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: non apparuit ... non appareret locus eius
  choice: वह दिखाई नहीं दी ... उसका स्थान भी दिखाई नहीं दिया
  rationale: मूल में ‘दिखाई न देने’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है; इसे ‘गायब हो गई’ या ‘स्थान देखा नहीं जा सका’ जैसे अधिक व्याख्यात्मक रूप में नहीं बदला गया।
- source_word: sequens exsurrexit
  choice: अगली उठ खड़ी हुई
  rationale: sequens के स्त्रीलिंग क्रमवाची संकेत और exsurrexit की उभरने/उठने की छवि दोनों बनाए रखे गए हैं।
- source_word: ipsa multum tenuit tempus
  choice: वह बहुत समय तक सत्ता में बनी रही
  rationale: शाब्दिक ‘बहुत समय थामे रही’ हिन्दी में अस्वाभाविक है; शासन के प्रसंग में इसका आशय दीर्घकाल तक अधिकार में बने रहना है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। स्त्रीलिंग सर्वनाम मूल लातीनी स्त्रीलिंग कर्ता और निकटवर्ती प्रतीक के अनुरूप रखा गया है। ‘दिखाई नहीं दी’ की असामान्य पुनरावृत्ति मूल की अस्पष्टता और शैली को सुरक्षित रखने के लिए बनी हुई है।
