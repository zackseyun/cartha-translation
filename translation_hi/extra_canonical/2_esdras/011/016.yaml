translation:
  language: hi
  text: 'उसके पास यह कहते हुए भेजी गई: “सुन, तू जिसने इस पूरे समय पृथ्वी को अपने अधिकार में रखा है,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emissa est illi
  choice: उसके पास … भेजी गई
  rationale: लातीनी स्त्रीलिंग एकवचन कर्मवाच्य और अप्रत्यक्ष कर्म को यथासंभव सुरक्षित रखता है; कर्ता पिछले प्रसंग से समझा जाता है, इसलिए यहाँ नया संज्ञापद नहीं जोड़ा गया।
- source_word: dicens
  choice: यह कहते हुए
  rationale: वर्तमान कृदन्त का संबंध भेजी गई स्त्रीलिंग सत्ता से बनाए रखता है और अगले प्रत्यक्ष कथन से स्वाभाविक रूप से जोड़ता है।
- source_word: Audi tu
  choice: सुन, तू
  rationale: एकवचन आज्ञार्थक और स्पष्ट, बलयुक्त संबोधन दोनों को बनाए रखता है।
- source_word: toto tempore
  choice: इस पूरे समय
  rationale: अर्थ ‘पूरे समय/इस सारे समय’ है, न कि केवल अवधि की लंबाई पर बल देने वाला ‘इतने लंबे समय से’।
- source_word: tenuisti terram
  choice: पृथ्वी को अपने अधिकार में रखा है
  rationale: tenere के यहाँ शासन अथवा आधिपत्य-सूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; केवल भौतिक रूप से ‘पकड़े रखना’ संदर्भ में भ्रामक होता।
