  text: Then I saw, and behold, something like a lion roused from the forest.
translation:
  language: hi
  text: तब मैंने देखा—और देखो, मानो जंगल से जगाया गया एक सिंह था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et vidi et ecce
  choice: तब मैंने देखा—और देखो
  rationale: दृष्टान्त-वर्णन की प्रगति और ‘ecce’ के विस्मयकारी, ध्यान खींचने वाले बल—दोनों को बनाए रखता है।
- source_word: sicut leo
  choice: मानो ... एक सिंह
  rationale: ‘sicut’ की उपमात्मक अनिश्चितता को सुरक्षित रखता है; दृश्य को सीधे सिंह घोषित नहीं करता।
- source_word: suscitatus
  choice: जगाया गया
  rationale: लातीनी निष्क्रिय कृदन्त का स्वरूप बनाए रखता है और यह अस्पष्टता नहीं मिटाता कि सिंह को किसने या किस बात ने जगाया।
- source_word: de silua
  choice: जंगल से
  rationale: ‘silva’ का स्वाभाविक आधुनिक हिन्दी रूप और स्रोत से निकलने का भाव व्यक्त करता है।
theological_decisions:
- issue: सिंह की पहचान और प्रतीकात्मकता
  choice: उपमा को ‘मानो’ के द्वारा खुला रखा गया
  alternative: ‘एक सिंह जंगल से उठ खड़ा हुआ’
  rationale: स्रोत का ‘sicut’ दर्शन में दिखाई देने वाली आकृति और उसकी वास्तविक पहचान के बीच तनाव बनाए रखता है; पद स्वयं उसकी प्रतीकात्मक पहचान स्पष्ट नहीं करता।
- issue: suscitatus में कर्ता की अस्पष्टता
  choice: ‘जगाया गया’ निष्क्रिय रूप
  alternative: ‘जागकर उठा’
  rationale: सक्रिय अथवा आत्मप्रेरित जागने का अर्थ जोड़ने के बजाय लातीनी निष्क्रियता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। डैश ‘देखो’ के आकस्मिक दृश्यात्मक बल को उभारता है। उपलब्ध अंश का आरम्भ ‘sidera quod uides’ से होता है, जो पिछले वाक्य का अवशेष प्रतीत होता है; इसलिए इस पद का अनुवाद ‘Et vidi’ से किया गया है।
