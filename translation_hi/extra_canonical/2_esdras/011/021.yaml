lexical_decisions:
- source_word: statim non conparescebant
  choice: वे तुरन्त गायब हो गईं
  rationale: शाब्दिक अर्थ ‘वे तुरन्त दिखाई नहीं देती थीं/दिखना बन्द हो गईं’ है; ‘गायब हो गईं’ आधुनिक हिन्दी में इसी दृश्य परिणाम को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: Nam et
  choice: क्योंकि … और भी
  rationale: ‘Nam’ के व्याख्यात्मक संबंध और ‘et’ के योगात्मक बल—दोनों को बनाए रखा गया है; केवल ‘और’ कहने से यह सूक्ष्मता खो जाती।
- source_word: aliquae ex eis
  choice: उनमें से कुछ
  rationale: लैटिन के स्त्रीलिंग बहुवचन अनिश्चित सर्वनाम का सहज हिन्दी रूप; क्रिया का स्त्रीलिंग पूर्ववर्ती स्त्रीलिंग संज्ञा की ओर संकेत बनाए रखता है।
- source_word: erigebantur
  choice: उठ खड़ी हुईं
  rationale: यह रूप ऊपर उठने या उठाए जाने की छाया रख सकता है। प्रसंगानुकूल मध्यवाची अर्थ ‘उठ खड़ी हुईं’ चुना गया है, जो सक्रिय कर्ता को अनावश्यक रूप से नहीं जोड़ता।
