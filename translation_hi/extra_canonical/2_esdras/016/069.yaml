base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/069.yaml
  text: For behold[a], a burning wrath is kindled against you, a great multitude[b], and they will seize some of you and feed them with meat sacrificed to idols.
translation:
  language: hi
  text: क्योंकि देखो, एक बड़ी भीड़ का क्रोध तुम्हारे विरुद्ध भड़क उठा है।[a] वे तुममें से कुछ लोगों को पकड़ लेंगे और उन्हें मूर्तियों को चढ़ाए गए बलि-पशुओं का मांस खिलाएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त लैटिन में यहाँ की व्याकरणिक रचना असामान्य है। इसका अर्थ बड़ी भीड़ का भड़का हुआ क्रोध हो सकता है; इसे ‘तुम्हारे विरुद्ध भड़कता हुआ क्रोध—एक बड़ी भीड़’ भी समझा जा सकता है।
    reason: textual_ambiguity
  - marker: b
    text: लैटिन का अंतिम वाक्यांश संक्षिप्त और कठिन है। संभवतः आशय यह है कि पकड़े गए लोगों को मूर्तियों को चढ़ाए गए बलि-पशुओं का मांस जबरन खिलाया जाएगा। एक दूसरा संभव अर्थ यह है कि उन्हें मारकर मूर्तियों के लिए भोजन के रूप में दे दिया जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ecce enim
  choice: क्योंकि देखो
  rationale: ‘Ecce’ के ध्यान आकर्षित करने वाले बल को ‘देखो’ से और ‘enim’ के कारणसूचक संबंध को ‘क्योंकि’ से रखा गया है।
- source_word: incenditur ardor super uos
  choice: क्रोध तुम्हारे विरुद्ध भड़क उठा है
  rationale: ‘incenditur’ और ‘ardor’ की अग्नि-संबंधी छवि को स्वाभाविक हिन्दी में ‘भड़क उठा’ से रखा गया; शत्रुतापूर्ण ‘super vos’ के लिए ‘तुम्हारे विरुद्ध’ चुना गया।
- source_word: turba copiosae
  choice: एक बड़ी भीड़ का
  rationale: प्राप्त लैटिन वाक्यांश व्याकरण की दृष्टि से कठिन है; संदर्भानुसार इसे उस बड़ी भीड़ के रूप में लिया गया है जिसका क्रोध भड़कता है।
- source_word: rapient
  choice: पकड़ लेंगे
  rationale: यह बलपूर्वक धर लेने या उठा ले जाने का भाव देता है; आगे ‘तुममें से कुछ लोगों को’ के साथ ‘पकड़ लेंगे’ सहज और स्पष्ट है।
- source_word: cibabunt idolis occisam
  choice: मूर्तियों को बलि किए गए पशुओं का मांस खिलाएँगे
  rationale: परंपरागत रूप से प्रमाणित विस्तृत पाठ के संक्षिप्त और कठिन वाक्यांश को मूर्तियों के लिए वध किए गए बलि-पशु के मांस के रूप में व्यक्त किया गया है, जो सताव के प्रसंग में बलि का मांस जबरन खिलाने का अर्थ देता है।
theological_decisions:
- issue: मूर्तिपूजा से जुड़े अंतिम वाक्यांश का आशय
  choice: पकड़े गए लोगों को मूर्तियों को बलि किए गए पशुओं का मांस खिलाया जाएगा
  alternative: उन्हें मारकर मूर्तियों के आगे भोजन के रूप में डाल दिया जाएगा
  rationale: वाक्यांश संक्षिप्त और कठोर है, पर ‘occisam’ को निहित बलि-पशु अथवा उसके मांस से जोड़ना लैटिन के संभावित आशय और सताव के ऐतिहासिक प्रसंग से बेहतर मेल खाता है; दूसरी संभावना को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मूर्तियों को बलि किए गए पशुओं का मांस’ कहकर निहित ‘मांस’ को स्पष्ट किया गया है, जबकि कठिन लैटिन की दूसरी संभावित व्याख्या पाद-टिप्पणी में सुरक्षित है।
