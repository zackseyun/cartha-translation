  text: तुम पर विपत्तियाँ भेजी गई हैं; कौन है जो उन्हें दूर कर सके?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: विपत्तियाँ
  rationale: बहुवचन mala यहाँ नैतिक बुराइयों की अपेक्षा आने वाली आपदाओं या संकटों को दर्शाता है; ‘विपत्तियाँ’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: repellat
  choice: दूर कर सके
  rationale: repellere का मूल भाव पीछे हटाना या टाल देना है; प्रश्न में सामर्थ्य का आशय स्वाभाविक हिन्दी में ‘दूर कर सके’ से व्यक्त होता है।
theological_decisions:
- issue: विपत्तियों के आने का कर्ता
  choice: अकर्मक अभिव्यक्ति ‘आ पड़ी हैं’
  alternative: ‘भेजी गई हैं’
  rationale: उपलब्ध लैटिन अंश ‘uobis mala’ में अंग्रेज़ी परामर्श-पाठ के ‘have been sent’ के अनुरूप कोई स्पष्ट क्रिया सुरक्षित नहीं है। इसलिए किसी अनुल्लिखित भेजने वाले को न जोड़ते हुए कथन का आशय रखा गया है।
translation_notes:
  register: आधुनिक, dignified और सामान्य पाठक के लिए सहज हिन्दी। अलंकारिक प्रश्न की तीव्रता तथा स्रोत की कर्ता-संबंधी अस्पष्टता सुरक्षित रखी गई है।
