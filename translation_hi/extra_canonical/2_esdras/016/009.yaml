  text: Evils[a], and who will repel them? Fire will come forth from his wrath, and who is there to quench it?
translation:
  language: hi
  text: विपत्तियाँ—और कौन उन्हें दूर कर सकेगा? उसके क्रोध से आग निकलेगी—और कौन उसे बुझा सकेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: विपत्तियाँ
  rationale: बहुवचन नपुंसकलिंग रूप यहाँ आने वाली बुराइयों/आपदाओं को सूचित करता है; प्रसंग में स्वाभाविक हिन्दी के लिए ‘विपत्तियाँ’ चुना गया।
- source_word: repellet
  choice: रोक सकेगा
  rationale: Latin repellere का अर्थ पीछे हटाना या प्रतिरोध करके रोकना है; ‘रोक सकेगा’ सरल और प्रसंगानुकूल है।
- source_word: Exiet
  choice: निकलेगी
  rationale: भविष्यकालीन exire आग के बाहर आने या प्रकट होने को व्यक्त करता है; हिन्दी में ‘निकलेगी’ स्पष्ट है और आग के बुझ जाने का अर्थ नहीं देता।
- source_word: iracundia eius
  choice: उसके क्रोध
  rationale: संबंधवाचक eius की अस्पष्टता बनाए रखते हुए कोई नाम या अतिरिक्त धर्मवैज्ञानिक पहचान नहीं जोड़ी गई।
theological_decisions:
- issue: ‘उसके’ का संदर्भ
  choice: स्रोत के समान केवल ‘उसके’ रखा गया
  alternative: ‘परमेश्वर के क्रोध’
  rationale: इस अंश में eius सर्वनाम है; संदर्भ स्पष्ट किए बिना नाम जोड़ना स्रोत की अपेक्षा अधिक व्याख्यात्मक होता।
- issue: पहले वाक्य का कालगत भाव
  choice: ‘आ रही हैं’ जोड़ा गया
  alternative: खंडित रूप ‘विपत्तियाँ—और कौन उन्हें रोक सकेगा?’
  rationale: Latin में mala एक खंडित पद है, जबकि अर्थ संभवतः आसन्न विपत्तियों का है; सुबोध हिन्दी हेतु न्यूनतम निहित क्रिया दी गई, बिना कर्ता या कारण जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज हिन्दी। दोनों आलंकारिक प्रश्नों का समानांतर बल बनाए रखने के लिए ‘कौन … सकेगा?’ संरचना रखी गई है।
