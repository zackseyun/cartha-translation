- source_word: dolete eos
  choice: उनके लिए शोक करो
  rationale: लातीनी बहुवचन आज्ञार्थक dolete शोक करने का आदेश देता है और eos पूर्वोक्त पुरुषवाचक बहुवचन समूह की ओर संकेत करता है। स्वाभाविक हिन्दी में ‘उनके लिए शोक करो’ इस संबंध को स्पष्ट रखता है।
- source_word: contritio vestra
