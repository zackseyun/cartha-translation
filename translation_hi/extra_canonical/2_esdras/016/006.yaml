  text: Can anyone beat back a hungry lion in the forest, or quench a fire when straw has been set ablaze?
translation:
  language: hi
  text: क्या कोई जंगल में भूखे सिंह को पीछे हटा सकता है, या जब पुआल में आग लग चुकी हो, तब उस आग को बुझा सकता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: recutiet
  choice: पीछे हटा सकता है
  rationale: यह क्रिया भूखे सिंह के आक्रमण को रोककर उसे पीछे धकेलने या खदेड़ने का भाव देती है; आधुनिक हिन्दी में यह स्वाभाविक और प्रसंगानुकूल है।
- source_word: leonem esurientem
  choice: भूखे सिंह
  rationale: मूल के संक्षिप्त विशेषण-संज्ञा संबंध को सीधे और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: stramen
  choice: पुआल
  rationale: लैटिन शब्द सूखे तिनकों या बिछावन के पुआल को सूचित करता है; ‘पुआल’ आग के तेजी से फैलने की छवि को स्पष्ट रखता है।
- source_word: incensum fuerit
  choice: आग लग चुकी हो
  rationale: 'पूर्ण हो चुकी अवस्था का भाव सुरक्षित है: पुआल केवल सुलगने वाला नहीं, पहले ही प्रज्वलित हो चुका है।'
- source_word: extinguet ignem
  choice: उस आग को बुझा सकता है
  rationale: ‘उस’ जोड़ने से हिन्दी में संदर्भ स्पष्ट और वाक्य स्वाभाविक होता है, जबकि मूल अर्थ अपरिवर्तित रहता है।
