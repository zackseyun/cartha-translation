  register: आधुनिक मानक हिन्दी में अलंकारिक प्रश्नों की समानांतर संरचना बनाए रखी गई है। भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज है; किसी व्याख्यात्मक या सांप्रदायिक अर्थ को नहीं जोड़ा गया।
