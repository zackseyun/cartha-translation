source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non funditus conteretur a facie ipsius? Terra tremuit et fundamenta eius, mare fluctuatur de profundo, et fluctus eius disturbabuntur et pisces eius a facie domini et a gloria uirtutis eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/012.yaml
  text: Will not the earth be utterly crushed before him? The earth quakes[a], and its foundations; the sea surges from the deep, and its waves and its fish will be troubled before the Lord and before the glory of his power.
translation:
  language: hi
  text: क्या पृथ्वी उसके सामने पूरी तरह चूर न हो जाएगी? पृथ्वी काँप उठी, और उसकी नींवें भी; समुद्र गहराई से उफनता है, और उसकी लहरें और मछलियाँ प्रभु के सामने और उसके सामर्थ्य की महिमा के सामने उथल-पुथल में पड़ जाएँगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: funditus conteretur
  choice: पूरी तरह चूर न हो जाएगी
  rationale: ‘funditus’ सम्पूर्णता और ‘conteretur’ भविष्यकालीन कर्मवाच्य में कुचले या चूर किए जाने का भाव देता है।
- source_word: mare fluctuatur de profundo
  choice: समुद्र की गहराई से लहरें उमड़ती हैं
  rationale: लातीनी कथन समुद्र के गहरे भाग से उथल-पुथल या तरंगित होने का चित्र देता है; हिन्दी में यह स्वाभाविक और सजीव रूप है।
- source_word: disturbabuntur
  choice: व्याकुल हो जाएँगी
  rationale: भविष्यकालीन कर्मवाच्य को सुरक्षित रखते हुए लहरों और मछलियों दोनों के विचलित या अस्त-व्यस्त होने का व्यापक भाव व्यक्त करता है।
- source_word: gloria uirtutis eius
  choice: उसके सामर्थ्य की महिमा
  rationale: ‘uirtus’ यहाँ शक्ति या सामर्थ्य है और ‘gloria’ उसकी प्रकट महिमा; दोनों संज्ञाओं का संबंध बनाए रखा गया है।
theological_decisions:
- issue: आरंभिक प्रश्न में कर्ता का संकेत
  choice: ‘वह’ स्त्रीलिंग द्वारा पृथ्वी की ओर संकेत
  alternative: संज्ञा ‘पृथ्वी’ को प्रश्न में स्पष्ट रूप से दोहराना
  rationale: लातीनी पाठ में निहित स्त्रीलिंग कर्ता निकटवर्ती संदर्भ की पृथ्वी है; सर्वनाम मूल की संक्षिप्तता और प्रश्नगत तनाव बनाए रखता है।
- issue: ‘प्रभु के सामने’ और ‘उसके सामर्थ्य की महिमा के सामने’ का संबंध
  choice: दोनों समानांतर वाक्यांश सुरक्षित रखे गए
  alternative: दोनों को मिलाकर ‘प्रभु के महिमामय सामर्थ्य के सामने’ कहना
  rationale: मूल पाठ में ‘a facie domini et a gloria uirtutis eius’ दो अलग पदबंध हैं; उन्हें मिलाने से मूल की वाक्यरचना और बल घटता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। प्रलयदर्शी चित्रात्मकता, भविष्यकालीन ‘disturbabuntur’, और मूल के समानांतर पदबंध सुरक्षित रखे गए हैं।
