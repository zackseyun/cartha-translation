id: 2ES.16.34
reference: 2 Esdras 16:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugebunt virgines non habentes sponsos, lugebunt mulieres non habentes viros, lugebunt filiae earum non habentes adiutorium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/034.yaml
  text: Virgins will mourn, having no bridegrooms; women will mourn, having no husbands; their daughters will mourn, having no help.
translation:
  language: hi
  text: कुमारियाँ विलाप करेंगी, क्योंकि उनके दूल्हे नहीं होंगे; स्त्रियाँ विलाप करेंगी, क्योंकि उनके पति नहीं होंगे; और उनकी बेटियाँ विलाप करेंगी, क्योंकि उनका कोई सहारा नहीं होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: virgines
  choice: कुमारियाँ
  rationale: लैटिन शब्द अविवाहित युवतियों को सूचित करता है; ‘कुमारियाँ’ इस अर्थ को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: sponsos
  choice: दूल्हे
  rationale: sponsus विवाह के लिए ठहराए गए पुरुष अथवा दूल्हे को सूचित करता है; समानांतर पद viros (‘पति’) से इसका भेद बनाए रखा गया है।
- source_word: mulieres
  choice: स्त्रियाँ
  rationale: सामान्य वयस्क स्त्रियों के लिए स्वाभाविक आधुनिक हिन्दी शब्द।
- source_word: viros
  choice: पति
  rationale: यहाँ स्त्रियों के संबंध में vir का वैवाहिक अर्थ स्पष्ट है।
- source_word: adiutorium
  choice: सहारा
  rationale: शाब्दिक ‘सहायता’ की अपेक्षा ‘कोई सहारा नहीं’ संकट में मानवीय सहायता और संरक्षण के अभाव को अधिक स्वाभाविक हिन्दी में व्यक्त करता है, बिना सहायक की पहचान निश्चित किए।
theological_decisions:
- issue: adiutorium में सहायता के स्रोत की अस्पष्टता
  choice: उनका कोई सहारा नहीं होगा
  alternative: उनकी सहायता करने वाला कोई नहीं होगा
  rationale: मूल पाठ केवल सहायता/सहारे के अभाव की बात करता है और यह नहीं बताता कि सहायक कौन होता; चुना हुआ अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। तीनों समानांतर खंडों में ‘विलाप करेंगी’ की पुनरावृत्ति मूल की वक्तृता और तीव्रता को सुरक्षित रखती है; कारणसूचक ‘क्योंकि’ हिन्दी में participial संरचना को स्पष्ट और स्वाभाविक बनाता है।
