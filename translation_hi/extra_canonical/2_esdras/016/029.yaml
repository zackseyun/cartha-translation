  text: For ten will be left from a city[a], and two from the countryside, who have hidden themselves in the forest and in clefts of the rocks.
translation:
  language: hi
  text: क्योंकि किसी नगर में से दस और देहात में से दो लोग बचे रहेंगे, जो वन और चट्टानों की दरारों में छिपे होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: relinquentur
  choice: बचे रहेंगे
  rationale: लैटिन का भाव है कि व्यापक विनाश के बाद कुछ लोग शेष रह जाएँगे; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: de civitate
  choice: नगर में से
  rationale: de यहाँ किसी समूह या स्थान में से बचे लोगों का स्रोत बताता है।
- source_word: ex agro
  choice: देहात में से
  rationale: ager यहाँ नगर के विपरीत ग्रामीण क्षेत्र को सूचित करता है; 'देहात' साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: silva
  choice: वन
  rationale: silva का सीधा अर्थ वन या जंगल है; इसमें 'घना' जैसा अस्रोत विशेषण नहीं जोड़ा गया।
- source_word: fissuras petrarum
  choice: चट्टानों की दरारों
  rationale: यह लैटिन बहुवचन का निकट, स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: absconderint se
  choice: छिपे होंगे
  rationale: लैटिन पूर्ण उपवाचक रूप सापेक्ष उपवाक्य में उन बचे लोगों की अवस्था बताता है; हिन्दी में भविष्य-संदर्भ के अनुरूप यह सहज रूप है।
