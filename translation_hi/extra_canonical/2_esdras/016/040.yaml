  text: so also the evils will not delay to come forth upon the earth, and the age will groan, and pains will surround it.
translation:
  language: hi
  text: एक ही क्षण में, इसी प्रकार विपत्तियाँ पृथ्वी पर प्रकट होने में देर नहीं करेंगी; युग[a] कराहेगा, और पीड़ाएँ उसे चारों ओर से घेर लेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार।”
    reason: लातीनी saeculum का अर्थ ‘युग’ भी हो सकता है और इस प्रसंग में ‘संसार’ भी।
lexical_decisions:
- source_word: uno puncto
  choice: एक ही क्षण में
  rationale: लातीनी पद का निकट और स्वाभाविक अर्थ; स्रोत में यह आरंभिक खंड अलग-सा है, इसलिए उसे हटाया या अगले कथन में कृत्रिम रूप से नहीं मिलाया गया।
- source_word: mala
  choice: विपत्तियाँ
  rationale: बहुवचन mala यहाँ पृथ्वी पर आने वाली बुराइयों/आपदाओं को सूचित करता है; ‘विपत्तियाँ’ प्रसंगगत अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: ad prodiendum super terram
  choice: पृथ्वी पर प्रकट होने में
  rationale: prodire के ‘बाहर आना/प्रकट होना’ और super terram के ‘पृथ्वी पर’ भाव को बनाए रखता है।
- source_word: saeculum
  choice: युग
  rationale: saeculum का मूल कालगत अर्थ सुरक्षित है; इसे बिना आवश्यकता केवल ‘संसार’ नहीं बनाया गया।
- source_word: circumtenent
  choice: चारों ओर से घेर लेंगी
  rationale: क्रिया के चारों ओर घेरने के अर्थ को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है और भविष्यसूचक संदर्भ के अनुरूप काल रखता है।
theological_decisions:
- issue: saeculum का संदर्भ
  choice: मुख्य पाठ में ‘युग’
  alternative: ‘संसार’
  rationale: लातीनी शब्द ‘युग/काल’ और उससे जुड़े जगत—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में अधिक शाब्दिक ‘युग’ रखा गया और अर्थगत विकल्प को पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी। स्रोत की आरंभिक खंडित अभिव्यक्ति ‘uno puncto’ को स्वतंत्र वाक्यांश के रूप में सुरक्षित रखा गया है; अर्धविराम समानांतर भविष्यसूचक कथनों को जोड़ता है।
