  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/059.yaml
  text: He who hung the earth upon the water by his word[a], and stretched out the heaven like a vault;
translation:
  language: hi
  text: जिसने अपने वचन से पृथ्वी को जल के ऊपर लटका दिया, और आकाश को मेहराब के समान तान दिया;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super aquam
  choice: जल के ऊपर
  rationale: लैटिन में aquam एकवचन है; इसलिए एकवचन भाव रखा गया है।
- source_word: uerbo suo
  choice: अपने वचन से
  rationale: साधनसूचक अर्थ और possessive suo दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: extendit
  choice: तान दिया
  rationale: आकाश को फैलाने/खींचकर विस्तृत करने की सृष्टि-छवि को सहज हिन्दी में व्यक्त करता है।
- source_word: caelum
  choice: आकाश
  rationale: आधुनिक मानक हिन्दी में सामान्य और गरिमापूर्ण समतुल्य।
- source_word: quasi cameram
  choice: मेहराब के समान
  rationale: camera यहाँ कक्ष नहीं, मेहराबदार छत या vault की छवि देता है; ‘मेहराब’ उस स्थापत्य-रूप को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: आरम्भिक Qui का वाक्य-संबंध
  choice: जिसने
  alternative: वह जिसने
  rationale: Qui पूर्ववर्ती स्तुतिपरक वाक्य-शृंखला से जुड़ा संबंधवाचक रूप है; ‘जिसने’ इस अधीनस्थ निरंतरता को बनाए रखता है।
- issue: पृथ्वी का जल के ऊपर लटकाया जाना
  choice: छवि को शाब्दिक रूप में सुरक्षित रखा
  alternative: पृथ्वी को जल पर स्थापित किया
  rationale: मूल पाठ की ब्रह्मांड-वर्णनात्मक काव्य-छवि को किसी आधुनिक व्याख्या से नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उपलब्ध लैटिन अंश को प्राथमिक आधार बनाया गया है; पूर्व अंग्रेज़ी पादटिप्पणी का वैकल्पिक पाठ इस दिए हुए अंश में प्रमाणित न होने के कारण शामिल नहीं किया गया।
