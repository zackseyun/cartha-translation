  text: So in those days, three or four will remain from those who search their houses with the sword.
translation:
  language: hi
  text: इस प्रकार, उन दिनों उनके घरों को तलवार लिए खँगालनेवालों से तीन या चार ही बचे रहेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन वाक्यरचना अस्पष्ट है। “तलवार लिए खँगालनेवालों से” का संबंध “बचे रहेंगे” से अलगाव के रूप में समझा गया है; इसे “अपने घरों को तलवार लिए खँगालनेवालों में से” भी समझा जा सकता है।
    reason: ab scrutantibus domos eorum in romphea का remanebunt से संबंध और eorum का निर्देश पूरी तरह स्पष्ट नहीं है। फुटनोट बिना असमर्थित कर्ता-परिवर्तन के वास्तविक वाक्यगत अस्पष्टता सुरक्षित रखता है।
lexical_decisions:
- source_word: sic
  choice: इस प्रकार
  rationale: यह पिछले कथन के परिणाम या उसके अनुरूप स्थिति को जोड़ता है।
- source_word: remanebunt
  choice: बच रहेंगे
  rationale: लैटिन क्रिया का अर्थ ‘शेष रहना’ या संकट के बाद ‘बचे रहना’ है; प्रसंग में ‘बच रहेंगे’ स्वाभाविक है।
- source_word: tres vel quattuor
  choice: तीन या चार लोग ही
  rationale: व्यक्तियों की संख्या स्पष्ट करने के लिए ‘लोग’ और अत्यल्प शेष संख्या पर स्वाभाविक बल देने के लिए ‘ही’ रखा गया है।
- source_word: scrutantibus domos eorum
  choice: उनके घरों को … छाननेवालों
  rationale: scrutari गहराई से खोजने या छानने का भाव देता है; ‘घर खोजना’ की अपेक्षा ‘घरों को छानना’ अधिक स्वाभाविक और सशक्त है।
- source_word: in romphea
  choice: तलवार लेकर
  rationale: romphea एक बड़ी तलवार का शब्द है; यहाँ हथियार के साधन या साथ होने का भाव है, जिसे सहज हिन्दी में ‘तलवार लेकर’ व्यक्त किया गया है।
