  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। हिंसक तलाशी का दृश्य ‘तलवार लेकर घरों को छानना’ से स्पष्ट होता है, और मूल लैटिन की वास्तविक वाक्यगत अस्पष्टता फुटनोट में संरक्षित है।
