translation:
  language: hi
  text: वे विवाह करते हैं, मानो विधुर हों; इसलिए जो परिश्रम करते हैं, वे बिना किसी कारण के परिश्रम करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nubunt
  choice: वे विवाह करते हैं
  rationale: लैटिन वर्तमानकाल के बहुवचन क्रियापद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: sic quasi uidui
  choice: मानो विधुर हों
  rationale: uidui पुल्लिंग बहुवचन है और शाब्दिक अर्थ ‘विधुर’ है; उपमा की असामान्यता को स्पष्ट किए बिना ज्यों का त्यों सुरक्षित रखा गया है।
- source_word: Propter quod
  choice: इसलिए
  rationale: पूर्ववर्ती कथन से निकाले गए परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: qui laborant
  choice: जो परिश्रम करते हैं
  rationale: laborant की पुनरावृत्ति बनाए रखते हुए श्रम करने वालों का सामान्य संदर्भ सुरक्षित है।
- source_word: sine causa
  choice: बिना किसी प्रयोजन के
  rationale: causa यहाँ कारण, आधार या प्रयोजन का अर्थ दे सकता है; ‘प्रयोजन’ निरर्थक परिश्रम का भाव देता है, पर ‘व्यर्थ’ की अपेक्षा स्रोत की अभिव्यक्ति के निकट रहता है।
