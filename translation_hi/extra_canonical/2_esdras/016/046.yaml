  source_fidelity: The draft preserves both clauses, the simile, and the repeated labor verb. However, “बिना किसी प्रयोजन के” narrows Latin “sine causa” (‘without cause/reason’) toward purpose or utility.
  naturalness: The Hindi is clear, grammatical, and suitably dignified. “मानो विधुर हों” appropriately retains the source’s striking and context-dependent comparison.
