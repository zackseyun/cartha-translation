id: 2ES.16.54
reference: 2 Esdras 16:54
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam carbones ignis conburet super caput eius qui dicit: non peccaui coram deo et gloria ipsius. Ecce dominus cognoscit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/054.yaml
  text: For coals of fire will burn upon the head of the one who says[a], “I have not sinned before God and his glory.” Behold, the Lord knows.
translation:
  language: hi
  text: क्योंकि जो यह कहता है, “मैंने परमेश्वर और उसकी महिमा के सामने पाप नहीं किया,” उसके सिर पर वह[a] आग के अंगारे दहकाएगा। देखो, प्रभु जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में इस क्रिया का कर्ता व्यक्त नहीं है; संदर्भ में प्रभु अभिप्रेत हो सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: carbones ignis
  choice: आग के अंगारे
  rationale: लैटिन पद का सीधा और स्वाभाविक हिन्दी रूप; ‘ignis’ अंगारों की अग्निमय प्रकृति बताता है।
- source_word: conburet
  choice: दहकाएगा
  rationale: यह तृतीय पुरुष एकवचन भविष्यकालीन सकर्मक क्रिया है; इसलिए अंगारों को कर्म और निहित एकवचन कर्ता को बनाए रखा गया है।
- source_word: coram deo et gloria ipsius
  choice: परमेश्वर और उसकी महिमा के सामने
  rationale: असामान्य किंतु स्पष्ट लैटिन समन्वय को धर्मवैचारिक रूप से सरल किए बिना सुरक्षित रखता है।
- source_word: Ecce dominus cognoscit
  choice: देखो, प्रभु जानता है
  rationale: ‘Ecce’ के ध्यानाकर्षक बल और ‘cognoscit’ के वर्तमानकाल को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: conburet का निहित कर्ता
  choice: मुख्य पाठ में ‘वह’ और पादटिप्पणी में अस्पष्टता
  alternative: स्पष्ट रूप से ‘प्रभु’ या ‘परमेश्वर’ कहना
  rationale: लैटिन क्रिया एकवचन है, पर उसका कर्ता इस वाक्यांश में व्यक्त नहीं है। निकट संदर्भ प्रभु की ओर संकेत कर सकता है, फिर भी मुख्य पाठ में नाम जोड़ना मूल की अस्पष्टता को मिटा देता।
- issue: ‘परमेश्वर और उसकी महिमा’ का संबंध
  choice: दोनों को ‘के सामने’ से संबद्ध रखा
  alternative: ‘महिमामय परमेश्वर के सामने’
  rationale: वैकल्पिक रूप लैटिन के ‘et’ को विशेषणात्मक अर्थ देकर मूल की धर्मवैचारिक तनावपूर्ण अभिव्यक्ति को हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार बदला गया, जबकि भविष्यकाल, सकर्मक क्रिया और मूल की कर्ता-संबंधी अस्पष्टता सुरक्षित रखी गई है।
