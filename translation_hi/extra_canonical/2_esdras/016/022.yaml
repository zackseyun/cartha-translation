base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/022.yaml
  text: 'Behold[a], grain will soon be cheap upon the earth, so that they will think peace has been secured for them[b]. Then evils will spring up upon the earth: sword and famine.'
translation:
  language: hi
  text: 'देखो[a], शीघ्र ही पृथ्वी पर अनाज सस्ता हो जाएगा, जिससे लोग समझेंगे कि उनके लिए शांति सुनिश्चित कर दी गई है[b]। तब पृथ्वी पर विपत्तियाँ फूट निकलेंगी: तलवार और अकाल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अध्याय की लैटिन पाठ-परम्परा में पद 22–35 के आसपास सामग्री का एक खंड दोहराया गया है। यहाँ विस्तृत क्रम को एक ही बार प्रस्तुत किया गया है, उन्हीं न्याय-वचनों को दोबारा नहीं दोहराया गया।
    reason: compositional_layer
  - marker: b
    text: 'या, “पृथ्वी पर अनाज सस्ता होगा, जिससे वे समझेंगे कि उनके लिए शांति स्थापित कर दी गई है; और तब पृथ्वी पर विपत्तियाँ फूट निकलेंगी: तलवार, अकाल और बड़ा उपद्रव।”'
    reason: previous_rendering
lexical_decisions:
- source_word: annonae vilitas
  choice: अनाज सस्ता हो जाएगा
  rationale: यह लैटिन पद अनाज अथवा खाद्यान्न की कम कीमत को दर्शाता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: in brevi
  choice: शीघ्र ही
  rationale: स्रोत में विद्यमान निकट भविष्य के काल-संकेत को स्पष्ट रूप से बनाए रखता है।
- source_word: directam pacem
  choice: शान्ति सुनिश्चित हो गई है
  rationale: शाब्दिक ‘सीधी कर दी गई’ के बजाय प्रसंगानुकूल भाव व्यक्त करता है कि लोग शान्ति को अपने लिए स्थिर और सुरक्षित मानेंगे, जबकि उनके भ्रम का स्वर भी बना रहता है।
- source_word: superflorescent mala
  choice: विपत्तियाँ उमड़ पड़ेंगी
  rationale: क्रिया में अचानक और प्रचुर रूप से फूट निकलने का बिंब है; ‘उमड़ पड़ेंगी’ प्राकृतिक हिन्दी में उसकी तीव्रता व्यक्त करता है।
- source_word: gladius et famis
  choice: तलवार और अकाल
  rationale: ‘तलवार’ युद्ध अथवा हिंसक विनाश का मूल बिंब बनाए रखती है और ‘अकाल’ famis का प्रसंगानुकूल हिन्दी रूप है।
theological_decisions:
- issue: समृद्धि के आभास और आने वाले न्याय के बीच तनाव
  choice: लोगों की धारणा को ‘समझेंगे’ द्वारा व्यक्त किया गया है और उसके बाद विपत्तियों को निश्चित कथन के रूप में रखा गया है।
  alternative: शान्ति वास्तव में स्थापित हो गई थी, ऐसा कहना।
  rationale: लैटिन ut putent लोगों की धारणा बताता है, उसकी सत्यता की पुष्टि नहीं करता; इसलिए पाठ में निहित विडम्बना और तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज पर गरिमापूर्ण रखी गई है। ‘देखो’, ‘तलवार’ और ‘अकाल’ भविष्यवाणी-संबंधी शैली को बनाए रखते हैं; वाक्य-विन्यास सामान्य पाठकों के लिए सीधा है।
