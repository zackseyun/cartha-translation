  text: क्योंकि देखो, अभी थोड़ा ही समय और है, और अधर्म धरती पर से हटा दिया जाएगा, और
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quoniam
  choice: क्योंकि
  rationale: यह कारणसूचक संयोजक है और पिछले कथन से इस अधूरे वाक्य का संबंध बनाए रखता है।
- source_word: ecce
  choice: देखो
  rationale: लैटिन के ध्यान आकर्षित करने वाले उद्गार को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: adhuc pusillum
  choice: अभी थोड़ा ही समय और है
  rationale: लैटिन में समय का संकेत संक्षिप्त और कुछ हद तक लुप्त है; हिन्दी में उसका स्वाभाविक अर्थ व्यक्त किया गया है, बिना अवधि निश्चित किए।
- source_word: iniquitas
  choice: अधर्म
  rationale: यह नैतिक बुराई और अन्याय दोनों का व्यापक भाव रखता है।
- source_word: tolletur
  choice: हटा दिया जाएगा
  rationale: मूल के भविष्यत्कालीन कर्मवाच्य को बनाए रखता है और कर्ता को अनकहा छोड़ता है।
- source_word: a terra
  choice: धरती पर से
  rationale: terra का व्यापक भौगोलिक अर्थ सुरक्षित रहता है; इसे किसी खास देश तक सीमित नहीं किया गया।
theological_decisions:
- issue: अधर्म को हटाने वाले कर्ता की पहचान
  choice: कर्मवाच्य रखा गया—“हटा दिया जाएगा”
  alternative: “परमेश्वर अधर्म को हटा देगा”
  rationale: मूल पाठ कर्ता का नाम नहीं बताता; स्पष्ट धार्मिक कर्ता जोड़ना मूल की अभिव्यक्ति से आगे जाता।
- issue: terra का विस्तार
  choice: “धरती”
  alternative: “देश” या “भूमि”
  rationale: संदर्भ के अभाव में मूल शब्द का व्यापक अर्थ बनाए रखना उचित है और किसी सीमित भूभाग का निष्कर्ष नहीं निकाला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अंतिम “और” जानबूझकर रखा गया है, क्योंकि उपलब्ध लैटिन अंश भी संयोजक पर समाप्त होता है और वाक्य अगले पद में जारी रहता है।
