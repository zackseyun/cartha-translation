  text: Then the testing of my chosen ones will appear[a][b], like gold that is tested by fire.
translation:
  language: hi
  text: तब मेरे चुने हुओं की परख प्रकट होगी[a], जैसे आग से परखा जाने वाला सोना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘परख’ का अर्थ परखे जाने की प्रक्रिया भी हो सकता है और उस परख से प्रमाणित खराई भी। वैकल्पिक अनुवाद: ‘तब मेरे चुने हुओं की परखी हुई खराई प्रकट होगी।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: probatio
  choice: परख
  rationale: लातीनी शब्द परीक्षा या परखे जाने की प्रक्रिया के साथ-साथ उससे प्रमाणित खराई का भी बोध करा सकता है। ‘परख’ इस अर्थ-विस्तार को संक्षेप में बनाए रखता है।
- source_word: parebit
  choice: प्रकट होगी
  rationale: यह भविष्यकाल में किसी बात के दिखाई या स्पष्ट हो जाने को व्यक्त करता है।
- source_word: electorum meorum
  choice: मेरे चुने हुओं
  rationale: यह मूल के संबंधकारक बहुवचन और परमेश्वर द्वारा चुने गए लोगों के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: probatur ab igne
  choice: आग से परखा जाने वाला
  rationale: यह निष्क्रिय क्रिया और आग को परखने के साधन के रूप में सुरक्षित रखता है तथा probatio के साथ मूल की शब्दगत कड़ी बनाए रखता है।
theological_decisions:
- issue: परख की प्रक्रिया बनाम उससे सिद्ध हुई खराई
  choice: मुख्य पाठ में ‘परख’ रखा गया और अर्थगत द्विविधा पादटिप्पणी में स्पष्ट की गई।
  alternative: ‘परखी हुई खराई’ या ‘परीक्षा’
  rationale: संदर्भ सताव के बीच चल रही परीक्षा की ओर संकेत करता है, पर probatio उसके परिणामस्वरूप प्रमाणित असलियत या खराई को भी सूचित कर सकता है; इसलिए किसी एक अर्थ को निर्णायक रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘चुने हुओं’ तथा ‘परख’ सामान्य पाठक के लिए बोधगम्य हैं और मूल की धार्मिक तथा अर्थगत अनिश्चितता को बनाए रखते हैं।
