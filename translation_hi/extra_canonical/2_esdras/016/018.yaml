id: 2ES.16.18
reference: 2 Esdras 16:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in illis diebus? Initium dolorum et multi gemitus, initium famis et multi interient, initium bellorum et formidabunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/018.yaml
  text: 'In those days: the beginning of pains and much groaning, the beginning of famine and many will perish, the beginning of wars and they will be afraid, the beginning of evils and all will tremble.'
translation:
  language: hi
  text: 'उन दिनों: पीड़ाओं का आरम्भ और बहुत विलाप; अकाल का आरम्भ और बहुत-से लोग मर जाएँगे; युद्धों का आरम्भ और वे भयभीत होंगे; विपत्तियों का आरम्भ और सभी काँप उठेंगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कराए गए लैटिन अंश का पाठ ‘वे भयभीत होंगे’ पर समाप्त होता है; ‘विपत्तियों का आरम्भ और सभी काँप उठेंगे’ वाला अंतिम वाक्यांश परामर्श-पाठ में सुरक्षित है।
    reason: प्रस्तुत मूल-भाषा अंश और परामर्श-पाठ की सीमा में अंतर को पारदर्शी बनाना।
lexical_decisions:
- source_word: dolorum
  choice: पीड़ाओं
  rationale: बहुवचन ‘दुःखों/पीड़ाओं’ का सीधा और स्वाभाविक अर्थ; प्रसंग की शारीरिक तथा व्यापक विपत्ति—दोनों की संभावना खुली रखता है।
- source_word: multi gemitus
  choice: बहुत कराहना
  rationale: यहाँ multi को सामूहिक परिमाण के रूप में लिया गया है; इससे अस्वाभाविक ‘बहुत-सी कराहें’ की अपेक्षा सहज हिन्दी बनती है।
- source_word: famis
  choice: अकाल
  rationale: fames भूख और अकाल दोनों कह सकता है; सामूहिक विनाश के इस प्रसंग में ‘अकाल’ अधिक स्वाभाविक है।
- source_word: interient
  choice: नाश हो जाएँगे
  rationale: क्रिया का अर्थ मरना या नष्ट होना है; ‘नाश हो जाएँगे’ उसके व्यापक और गंभीर भाव को बनाए रखता है।
- source_word: bellorum
  choice: युद्धों
  rationale: लैटिन बहुवचन को यथावत रखा गया है।
- source_word: formidabunt
  choice: वे भयभीत होंगे
  rationale: लैटिन में कर्ता स्पष्ट संज्ञा के रूप में नहीं दिया गया; इसलिए किसी विशेष समूह, जैसे शासकों, को नहीं जोड़ा गया।
- source_word: malorum
  choice: विपत्तियों
  rationale: संदर्भ में mala नैतिक बुराइयों की अपेक्षा आनेवाली आपदाओं या विपत्तियों को सूचित करता है।
- source_word: contremiscent
  choice: काँप उठेंगे
  rationale: तीव्र भय से काँपने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: formidabunt के अनिर्दिष्ट कर्ता की पहचान
  choice: ‘वे भयभीत होंगे’ कहकर कर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘शासक भयभीत होंगे’ अथवा किसी अन्य समूह का नाम देना
  rationale: उपलब्ध लैटिन पाठ किसी विशिष्ट समूह का उल्लेख नहीं करता; उसे जोड़ना व्याख्यात्मक विस्तार होता।
- issue: malorum का नैतिक या आपदात्मक अर्थ
  choice: ‘विपत्तियों’
  alternative: ‘बुराइयों’
  rationale: अकाल, युद्ध और सार्वभौमिक कंपकंपी की श्रृंखला आपदात्मक अर्थ को अधिक संभावित बनाती है, फिर भी यह अनुवाद किसी विशेष धर्मवैज्ञानिक योजना को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। मूल की लगातार दोहराई गई ‘आरम्भ’ संरचना और भविष्यसूचक लय को अर्धविरामों द्वारा सुरक्षित रखा गया है।
