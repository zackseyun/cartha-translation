  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/062.yaml
  text: He formed man, and put a heart in the midst of the body, and gave him spirit and life and understanding,
translation:
  language: hi
  text: उसने मनुष्य को रचा, उसके शरीर के बीच में हृदय रखा, और उसे आत्मा, जीवन और समझ दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: medio corporis
  choice: शरीर के बीच में
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक अर्थ; संदर्भ में यह हृदय के शरीर के भीतर रखे जाने का स्थान बताता है।
- source_word: spiritum
  choice: आत्मा
  rationale: यहाँ जीवन के साथ दी गई अभौतिक देन के लिए सामान्य, गरिमापूर्ण हिन्दी शब्द; अर्थ को केवल ‘साँस’ तक सीमित नहीं करता।
- source_word: uitam
  choice: जीवन
  rationale: लातीनी शब्द का सीधा समतुल्य।
- source_word: intellectum
  choice: समझ
  rationale: साधारण पाठक के लिए स्वाभाविक शब्द, जो बोध और विचार-क्षमता दोनों को व्यक्त करता है।
- source_word: misit ei
  choice: उसे … दी
  rationale: शाब्दिक ‘उसमें रखा’ की अपेक्षा हिन्दी में इन तीनों देनों के साथ ‘दी’ अधिक स्वाभाविक है और आशय बनाए रखता है।
theological_decisions:
- issue: spiritum का अर्थ
  choice: आत्मा
  alternative: प्राण / श्वास
  rationale: लातीनी ‘spiritum’ में आत्मा, प्राण या श्वास की अर्थ-छायाएँ हो सकती हैं। ‘जीवन’ अलग से उल्लिखित होने के कारण ‘आत्मा’ भेद को बेहतर बनाए रखता है, बिना किसी विशिष्ट सांप्रदायिक मानव-विज्ञान को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रवाहपूर्ण वाक्य। उपलब्ध लातीनी अंश ‘medio corporis’ से आरम्भ होता है; आरम्भिक कथन और ‘हृदय’ निकटवर्ती पाठ-साक्ष्य तथा परीक्षित अंग्रेज़ी परामर्श-पाठ के अनुसार सुरक्षित रखे गए हैं।
