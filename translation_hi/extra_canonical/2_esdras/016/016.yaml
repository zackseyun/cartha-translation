  yaml_path: translation/extra_canonical/2_esdras/016/016.yaml
  text: As an arrow shot by a strong archer does not return, so the evils that have been sent upon the earth will not return.
translation:
  language: hi
  text: जैसे किसी शक्तिशाली धनुर्धर का छोड़ा हुआ तीर वापस नहीं लौटता, वैसे ही पृथ्वी पर भेजी गई विपत्तियाँ भी वापस नहीं लौटेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagitta missa a sagittario ualido
  choice: किसी शक्तिशाली धनुर्धर का छोड़ा हुआ तीर
  rationale: यह वाक्यांश कर्ता और क्रिया-संबंध को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखते हुए मूल उपमा के बल को बनाए रखता है।
- source_word: mala
  choice: विपत्तियाँ
  rationale: यहाँ बहुवचन mala संदर्भ में आने वाली आपदाओं या अनिष्टकारी घटनाओं को सूचित करता है; ‘विपत्तियाँ’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: non reuertentur
  choice: वापस नहीं लौटेंगी
  rationale: लातिनी भविष्यकाल और तीर के न लौटने पर आधारित समानांतरता, दोनों को सीधे सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीर और विपत्तियों के बीच मूल समानांतर संरचना को स्पष्ट रूप से बनाए रखा गया है।
