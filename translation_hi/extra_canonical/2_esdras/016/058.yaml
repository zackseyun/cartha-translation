source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: thesauros illorum, qui metitus est mare et conceptum eius; Qui conclusit mare in medio aquarum et suspendit terram
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/058.yaml
  text: He searches the deep and its treasures; he has measured the sea and what it contains; he has enclosed the sea in the midst of the waters and suspended the earth.
translation:
  language: hi
  text: वह अथाह गहराई और उसके खज़ानों की खोज करता है; उसी ने समुद्र और उसके भीतर जो कुछ है, उसे नापा है; उसी ने समुद्र को जलराशियों के बीच घेर रखा है और पृथ्वी को लटका रखा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: thesauros illorum
  choice: उसके खज़ानों
  rationale: लैटिन पद का शाब्दिक अर्थ ‘उनके खज़ाने’ है, पर उपलब्ध अंश वाक्य के बीच से आरम्भ होता है; अंग्रेज़ी परामर्श-पाठ में सुरक्षित पूर्ववर्ती संदर्भ के अनुसार इसे अथाह गहराई से संबद्ध स्वाभाविक हिन्दी में रखा गया है।
- source_word: metitus est mare
  choice: समुद्र ... को नापा है
  rationale: ‘metiri’ के मापने वाले ठोस बिंब को ज्यों का त्यों बनाए रखता है।
- source_word: conceptum eius
  choice: उसमें समाई हुई हर वस्तु
  rationale: यह समुद्र के भीतर समाई या समाविष्ट सामग्री को व्यक्त करता है और मूल की व्यापकता को किसी विशेष वस्तु तक सीमित नहीं करता।
- source_word: conclusit mare
  choice: समुद्र को ... बाँध रखा है
  rationale: ‘concludere’ में घेरने, सीमित करने और रोककर रखने का भाव है; ‘बाँध रखा है’ इस संदर्भ में सहज हिन्दी है।
- source_word: in medio aquarum
  choice: जलराशियों के बीच
  rationale: ‘waters’ के बहुवचन और विशाल जल-समूहों के काव्यात्मक भाव को सुरक्षित रखता है।
- source_word: suspendit terram
  choice: पृथ्वी को लटका रखा है
  rationale: ‘suspendere’ के ब्रह्मांड-वर्णनात्मक बिंब को बिना आधुनिक वैज्ञानिक व्याख्या जोड़े सीधे व्यक्त करता है।
theological_decisions:
- issue: सृष्टि पर कर्ता का नियंत्रण
  choice: ‘उसी ने’ की पुनरावृत्ति द्वारा एक ही कर्ता के मापने, बाँधने और लटकाने के कार्य स्पष्ट किए गए हैं।
  alternative: हर उपवाक्य में केवल ‘उसने’ रखना।
  rationale: यह मूल के संबंधवाचक विन्यास को स्वाभाविक हिन्दी में स्पष्ट करता है, पर कर्ता की पहचान में कोई अतिरिक्त संप्रदायगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अथाह गहराई’, ‘जलराशियों’ और ‘पृथ्वी को लटका रखा है’ मूल के काव्यात्मक-ब्रह्मांडीय बिंब को बनाए रखते हैं।
