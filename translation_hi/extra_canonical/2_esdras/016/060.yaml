base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/060.yaml
  text: He stretched out heaven like a vaulted chamber, and founded it upon the waters; who placed springs of waters in the desert.
translation:
  language: hi
  text: उसने उसे जल के ऊपर स्थापित किया; उसी ने मरुभूमि में जल के सोते रखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fundauit
  choice: स्थापित किया
  rationale: लातीनी क्रिया का अर्थ नींव डालना या दृढ़ता से स्थापित करना है; यहाँ कर्म के साथ स्वाभाविक हिन्दी के लिए ‘स्थापित किया’ चुना गया।
- source_word: super aquas
  choice: जल के ऊपर
  rationale: स्थान-संबंधी अर्थ को सीधे सुरक्षित रखा गया है।
- source_word: in deserto
  choice: मरुभूमि में
  rationale: desertum के निर्जन और शुष्क भूभाग के अर्थ को dignified आधुनिक हिन्दी में व्यक्त करता है।
- source_word: fontes aquarum
  choice: जल के सोते
  rationale: प्राकृतिक जलस्रोतों के लिए सामान्य और बाइबिलीय हिन्दी अभिव्यक्ति; बहुवचन भी सुरक्षित है।
- source_word: eum
  choice: उसे
  rationale: मूल अंश में सर्वनाम का पूर्वपद नहीं दिया गया है। अंग्रेज़ी परामर्श-पाठ इसे ‘आकाश’ मानता है, पर उपलब्ध लातीनी स्रोत में निहित अस्पष्टता को बनाए रखा गया है।
theological_decisions:
- issue: eum का पूर्वपद
  choice: ‘उसे’ कहकर सर्वनाम की अस्पष्टता सुरक्षित रखी
  alternative: ‘आकाश को’
  rationale: प्रस्तुत लातीनी पाठ में केवल पुल्लिंग एकवचन सर्वनाम eum है; इससे पहले का अपेक्षित संदर्भ इस उद्धृत स्रोत में अनुपस्थित है। इसलिए अंग्रेज़ी परामर्श-पाठ का स्पष्ट किया हुआ ‘heaven’ मुख्य पाठ में आयात नहीं किया गया।
- issue: Qui का वाक्य-संबंध
  choice: ‘उसी ने’
  alternative: ‘जिसने’
  rationale: अंश स्वतंत्र पद के रूप में पढ़ा जा रहा है; ‘उसी ने’ कर्ता की निरंतरता बनाए रखते हुए हिन्दी में अधूरा संबंधवाचक वाक्य बनने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट अनुवाद। उपलब्ध लातीनी पाठ में अंग्रेज़ी POB के ‘He stretched out heaven like a vaulted chamber’ के अनुरूप शब्द नहीं हैं, इसलिए वह वाक्यांश शामिल नहीं किया गया।
