id: 2ES.16.13
reference: 2 Esdras 16:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quoniam fortis dextera eius quae arcum tendit : sagittae eius acutae quae ab ipso mittuntur, non deficient cum coeperint mitti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/013.yaml
  text: For mighty is his right hand that bends the bow; his arrows that are shot by him are sharp[a], and they will not fail when they begin to be shot.
translation:
  language: hi
  text: क्योंकि उसका दाहिना हाथ, जो धनुष तानता है, शक्तिशाली है; उसके तीर, जो उसी के द्वारा छोड़े जाते हैं, पैने हैं[a], और जब वे छोड़े जाने लगेंगे, तो विफल नहीं होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके छोड़े हुए तीर पैने हैं।”
    reason: मुख्य पाठ लैटिन के कर्मवाच्य संबंधवाचक उपवाक्य quae ab ipso mittuntur को स्पष्ट रूप से व्यक्त करता है; वैकल्पिक रूप वही अर्थ अधिक संक्षेप में देता है। non deficient और आगे के वाक्यांश मुख्य पाठ में अपरिवर्तित रहते हैं।
lexical_decisions:
- source_word: fortis dextera eius
  choice: उसकी दाहिनी भुजा ... सामर्थी है
  rationale: लैटिन में dextera शाब्दिक रूप से ‘दाहिना हाथ’ है, पर धनुष चढ़ाने की शारीरिक छवि में ‘दाहिनी भुजा’ स्वाभाविक और गरिमापूर्ण है; fortis को ‘सामर्थी’ से व्यक्त किया गया है।
- source_word: arcum tendit
  choice: धनुष चढ़ाती है
  rationale: tendere का अर्थ धनुष को तानना/चढ़ाना है; ‘धनुष चढ़ाना’ आधुनिक हिन्दी में प्रत्यंचा खींचकर तैयार करने की स्पष्ट धनुर्विद्या-संबंधी अभिव्यक्ति है।
- source_word: sagittae eius acutae
  choice: उसके ... तीर पैने हैं
  rationale: acutae का सीधा अर्थ ‘तीखे/पैने’ है; तीरों के लिए ‘पैने’ सहज है।
- source_word: quae ab ipso mittuntur
  choice: उसके छोड़े हुए
  rationale: mittuntur कर्मवाच्य वर्तमान रूप है—‘जो उसी के द्वारा छोड़े जाते हैं’; हिन्दी में संक्षिप्त ‘उसके छोड़े हुए’ कर्ता-संबंध और धनुर्विद्या की छवि दोनों रखता है।
- source_word: non deficient
  choice: निष्फल नहीं होंगे
  rationale: deficient का मूल भाव ‘विफल/अपर्याप्त न होना’ है। ‘निष्फल नहीं होंगे’ सामान्य विफलता और लक्ष्य तक न पहुँचने की धनुर्विद्या-संबंधी छाया को बनाए रखता है, बिना इसे निश्चित रूप से केवल ‘चूकना’ मान लेने के।
- source_word: cum coeperint mitti
  choice: जब वे चलने लगेंगे
  rationale: शाब्दिक अर्थ ‘जब वे छोड़े जाने लगेंगे’ है। तीरों के लिए ‘चलने लगेंगे’ स्वाभाविक हिन्दी है और आरंभसूचक coeperint को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय प्रहार की अचूकता बनाम सामान्य विफलता
  choice: निष्फल नहीं होंगे
  alternative: चूकेंगे नहीं
  rationale: संदर्भ अचूक प्रहार का संकेत देता है, किंतु Latin non deficient अधिक व्यापक है। इसलिए अनुवाद ने इसे संकीर्ण करके केवल निशाना न चूकने तक सीमित नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। धनुष और तीर की ठोस छवि बनाए रखी गई है। मुख्य पाठ में फुटनोट चिह्न [a] उपस्थित है।
