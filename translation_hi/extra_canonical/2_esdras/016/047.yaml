source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborant; Fructus enim illorum alienigenae metent et substantiam illorum rapient et domus euertent et filios eorum captiuabunt, quia in captiuitate et fame generant natos suos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/047.yaml
  text: for foreigners will reap their fruits and plunder their goods and overturn their houses and take their children captive[a], because in captivity and famine they beget their children.
translation:
  language: hi
  text: वे कष्ट उठाते हैं; क्योंकि परदेशी उनकी उपज काटेंगे, उनकी संपत्ति लूट लेंगे, उनके घर ढा देंगे[a] और उनके बच्चों को बंदी बना लेंगे, क्योंकि वे बंदीवास और अकाल में अपने बच्चों को जन्म देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके घर उजाड़ देंगे।”
    reason: लातीनी evertere का घरों के संदर्भ में मुख्य अर्थ ‘ढा देना’ है, पर इसका व्यापक अर्थ उजाड़ना या नष्ट करना भी हो सकता है।
lexical_decisions:
- source_word: laborant
  choice: वे मेहनत करते हैं
  rationale: वर्तमानकालीन बहुवचन क्रिया का सीधा और स्वाभाविक हिन्दी रूप; स्रोत में वाक्यांश पिछले प्रसंग से जुड़ा हुआ प्रतीत होता है, इसलिए उसका खंडात्मक तनाव बनाए रखा गया है।
- source_word: Fructus ... metent
  choice: उनकी उपज काटेंगे
  rationale: यहाँ fructus खेती की पैदावार और metere फसल काटने को व्यक्त करता है; ‘फल’ की अपेक्षा ‘उपज’ प्रसंग में अधिक स्वाभाविक है।
- source_word: substantiam ... rapient
  choice: उनकी सम्पत्ति लूट लेंगे
  rationale: substantia यहाँ जीवन-निर्वाह के साधनों अथवा माल-मत्ता का बोध कराती है और rapere बलपूर्वक छीनने का; ‘सम्पत्ति लूट लेंगे’ दोनों अर्थों को संक्षेप में रखता है।
- source_word: domus euertent
  choice: उनके घर उजाड़ देंगे
  rationale: evertere घरों के सन्दर्भ में ढा देने, नष्ट करने या उजाड़ने का अर्थ दे सकता है। ‘उजाड़ देंगे’ भौतिक विनाश और गृहस्थ जीवन के ध्वंस—दोनों की सम्भावना खुली रखता है।
- source_word: filios eorum captiuabunt
  choice: उनके बच्चों को बंदी बना लेंगे
  rationale: filii सन्दर्भानुसार सन्तान/बच्चों के लिए प्रयुक्त हो सकता है; captivare का अर्थ बंदी बनाना है।
- source_word: in captiuitate et fame
  choice: बंधुआई और अकाल के बीच
  rationale: captivitas को केवल व्यक्तिगत कैद तक सीमित न करके सामूहिक पराधीनता/निर्वासन की दशा के रूप में ‘बंधुआई’ से व्यक्त किया गया है; fames यहाँ व्यापक अकाल अथवा घोर अभाव है।
- source_word: generant natos suos
  choice: अपने बच्चों को जन्म देते हैं
  rationale: मूल की सक्रिय अभिव्यक्ति और वर्तमानकाल बनाए रखा गया है; nati को स्वाभाविक हिन्दी में ‘बच्चे’ कहा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पद के आरम्भ में आए laborant को छोड़ा नहीं गया, यद्यपि वह पूर्ववर्ती प्रसंग का समापन प्रतीत हो सकता है। दो बार आए quia को दोनों स्थानों पर ‘क्योंकि’ रखकर मूल की कारणसूचक संरचना और उसका सम्भावित तनाव सुरक्षित रखा गया है।
