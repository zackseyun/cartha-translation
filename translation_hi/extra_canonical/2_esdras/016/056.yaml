  text: He who said, “Let heaven be made,” and it was made; and by his word the stars were founded.
translation:
  language: hi
  text: जिसने कहा, “आकाश बन जाए,” और आकाश बन गया; और उसके वचन से तारे स्थापित हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fiat caelum
  choice: आकाश बन जाए
  rationale: लातीनी आज्ञार्थक अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; सृष्टि की दिव्य आज्ञा का भाव सुरक्षित रहता है।
- source_word: factum est
  choice: वह बन गया
  rationale: मूल के संक्षिप्त निष्पन्न कर्म को सीधे व्यक्त करता है और ‘आकाश’ की ओर स्पष्ट संकेत रखता है।
- source_word: in uerbo illius
  choice: उसी के वचन से
  rationale: लातीनी in यहाँ साधन का भाव देता है; ‘उसी’ कर्ता के साथ संबंध को स्पष्ट रखता है।
- source_word: stellae fundatae
  choice: तारे स्थापित हुए
  rationale: fundatae के आधार देने/दृढ़ता से कायम करने के रूपक को ‘स्थापित’ सुरक्षित रखता है; केवल ‘बनाए गए’ कहकर अर्थ को सामान्य नहीं करता।
theological_decisions:
- issue: सृष्टि में वचन की भूमिका
  choice: उसी के वचन से तारे स्थापित हुए
  alternative: उसके वचन में तारे स्थापित हुए
  rationale: लातीनी in uerbo में साधनात्मक अर्थ संदर्भानुकूल है, पर ‘वचन’ को किसी विशिष्ट बाद की धर्मवैचारिक पहचान से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल की समानांतर, संक्षिप्त संरचना के निकट। कोई पादटिप्पणी आवश्यक नहीं।
