  text: earum non habentes adiutorium. Sponsi earum in bello consumentur, et uiri earum in fame exterentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/035.yaml
  text: Not having help, their bridegrooms will be consumed in war, and their husbands will perish by famine.
translation:
  language: hi
  text: उनके पास कोई सहायता न होगी। उनके दूल्हे युद्ध में नष्ट हो जाएँगे, और उनके पति अकाल से मिट जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adiutorium
  choice: सहायक
  rationale: यहाँ लैटिन शब्द सहायता या सहारा देने वाले साधन/व्यक्ति को सूचित कर सकता है। प्रसंग में स्त्रियों के असहाय रह जाने का भाव स्वाभाविक हिन्दी में ‘कोई सहायक न होगा’ से व्यक्त होता है।
- source_word: sponsi
  choice: दूल्हे
  rationale: sponsi का अर्थ विवाह के लिए ठहराए गए पुरुष या दूल्हे है; इसे बाद के uiri (‘पति’) से अलग रखा गया है।
- source_word: consumentur
  choice: नष्ट हो जाएँगे
  rationale: युद्ध में पूरी तरह विनष्ट होने का निष्क्रिय भाव सुरक्षित रहता है, बिना मृत्यु की रीति को अनावश्यक रूप से विशिष्ट बनाए।
- source_word: uiri
  choice: पति
  rationale: earum के संबंध में uiri यहाँ विवाहित पुरुषों, अर्थात उनके पतियों, को दर्शाता है।
- source_word: in fame exterentur
  choice: अकाल से मिट जाएँगे
  rationale: fames अकाल/भुखमरी और exterentur घिसकर समाप्त या विनष्ट किए जाने का प्रबल भाव देता है; ‘अकाल से मिट जाएँगे’ उस कठोरता को संक्षेप में बनाए रखता है।
