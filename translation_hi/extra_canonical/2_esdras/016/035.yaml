  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। लैटिन के खंडवत आरंभ को हिन्दी में पूर्ण वाक्य बनाया गया है, और ‘दूल्हे’ तथा ‘पति’ का स्रोत-पाठ वाला भेद सुरक्षित रखा गया है।
