  text: The grape will yield itself for the vintage[a], and who will gather it? For there will be great desolation in places.
translation:
  language: hi
  text: और अंगूर कटाई के लिए अपने आपको सौंप देगा, पर उसे कौन बटोरेगा? क्योंकि बहुत-से स्थानों में बड़ा उजाड़ होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uva
  choice: अंगूर की फसल
  rationale: लैटिन में एकवचन सामूहिक अर्थ दे सकता है; हिन्दी में ‘अंगूर की फसल’ प्रसंग के कृषि-संबंधी भाव को स्वाभाविक रूप से व्यक्त करती है।
- source_word: tradet se ad vindemiam
  choice: फसल कटने के लिए अपने आप को सौंप देगी
  rationale: मूल के आत्मवाचक मानवीकरण (‘अपने आप को सौंप देगी’) को बनाए रखते हुए vindemia को अंगूर की कटाई के रूप में स्पष्ट किया गया है।
- source_word: adligabit
  choice: इकट्ठा करेगा
  rationale: मूल क्रिया का आधारभूत अर्थ बाँधना/एकत्र करना है; अंगूर की फसल के संदर्भ में ‘इकट्ठा करना’ सहज है और गलत अर्थ ‘रौंदना’ से बचाता है।
- source_word: locis desertio multa
  choice: बहुत-से स्थान उजाड़ हो जाएँगे
  rationale: शाब्दिक संज्ञात्मक रचना ‘स्थानों में बहुत उजाड़पन होगा’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और व्यापक स्थानीय वीरानी का अर्थ सुरक्षित रखती है।
