  yaml_path: translation/extra_canonical/2_esdras/016/024.yaml
  text: And the dead will be cast out like dung[a], and they will have no one to comfort them, and the earth will be left desolate, and its cities will be demolished.
translation:
  language: hi
  text: और मरे हुए लोग मल के समान फेंक दिए जाएँगे, और उन्हें सांत्वना देने वाला कोई न होगा, और धरती उजाड़ छोड़ दी जाएगी, और उसके नगर ढा दिए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: stercora
  choice: खाद
  rationale: लैटिन शब्द का मूल अर्थ मल/गोबर है; इस उपमा में ‘खाद’ स्वाभाविक और गरिमापूर्ण हिंदी में तिरस्कारपूर्वक फेंके जाने का भाव बनाए रखता है।
- source_word: consolentur
  choice: सांत्वना देने वाला
  rationale: यह शोक या विपत्ति में दिलासा देने के अर्थ को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: deserta
  choice: उजाड़
  rationale: भूमि के निर्जन और वीरान हो जाने का सीधा अर्थ देता है।
- source_word: demolientur
  choice: ढा दिए जाएँगे
  rationale: नगरों को गिराकर नष्ट किए जाने का अर्थ आधुनिक और सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: non habent का काल और संबंध
  choice: उन्हें सांत्वना देने वाला कोई न होगा
  alternative: उन्हें सांत्वना देने वाला कोई नहीं है
  rationale: व्याकरणतः लैटिन वर्तमानकाल है, पर पूरा वाक्य भविष्यवाणी के भविष्यकालीन क्रम में है; हिंदी में भविष्यकाल संदर्भगत काल-सामंजस्य और आशय को स्वाभाविक रूप से व्यक्त करता है।
- issue: अंतिम उपवाक्य का संबंध
  choice: 'स्वतंत्र समन्वित वाक्य: ‘धरती उजाड़ छोड़ दी जाएगी’'
  alternative: 'कारणसूचक संबंध: ‘क्योंकि धरती…’'
  rationale: स्रोत में केवल et है; कारणसूचक संबंध जोड़ना स्रोत से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गंभीर और भविष्यवाणी के विनाशकारी स्वर के अनुरूप। ‘मरे हुए लोग’ सामान्य पाठक के लिए स्पष्ट है, जबकि निष्क्रिय क्रियाएँ लैटिन की संरचना को पर्याप्त रूप से सुरक्षित रखती हैं।
