  text: And they will lose their lives upon the earth[a], and the sword will scatter those who survive the famine.
translation:
  language: hi
  text: और वे पृथ्वी पर अपने प्राण गँवा देंगे[a], और तलवार उन लोगों को तितर-बितर कर देगी जो अकाल से बच जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य पाठानुसार: “क्योंकि पृथ्वी पर रहने वालों में से बहुत-से लोग अकाल से मर जाएँगे, और जो अकाल से बचेंगे उन्हें तलवार नष्ट कर देगी।”'
    reason: यह पहले प्रचलित लातीनी पाठ और पूर्व अनुवाद को दर्ज करता है, जबकि मुख्य पाठ उपलब्ध आलोचनात्मक स्रोत का अनुसरण करता है।
lexical_decisions:
- source_word: aporiant vitam
  choice: उनके प्राण जाते रहेंगे
  rationale: लातीनी पाठ का रूप असामान्य है, पर इसका भाव जीवन से वंचित होने या प्राण खोने का है। इस अनिश्चितता को सहज हिन्दी में व्यक्त किया गया है, बिना अकाल से मृत्यु को मुख्य पाठ में जोड़ने के।
- source_word: super terram
  choice: पृथ्वी पर
  rationale: मूल के स्थान-सूचक पद का सीधा और स्वाभाविक अनुवाद।
- source_word: gladius dispersit
  choice: तलवार ... तितर-बितर कर देगी
  rationale: dispersit को दिए गए पाठ और भविष्यसूचक संदर्भ के अनुसार 'तितर-बितर कर देगी' रखा गया है; इसे अधिक प्रचलित पाठ की तरह 'नष्ट कर देगी' नहीं बनाया गया।
- source_word: quae superaverint a fame
  choice: जो अकाल से बच जाएँगे
  rationale: अकाल के बाद जीवित बचने वालों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
