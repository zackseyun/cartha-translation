  text: They will be like madmen[a], sparing no one, plundering and ravaging those who still fear the Lord.
translation:
  language: hi
  text: वे उन्मत्त लोगों के समान होंगे और किसी को नहीं छोड़ेंगे। वे उन लोगों को लूटेंगे और तबाह करेंगे जो अब भी प्रभु का भय मानते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quasi insani
  choice: पागलों के समान
  rationale: ‘quasi’ की उपमा और ‘insani’ की उन्मत्त, विवेकहीन दशा—दोनों को सीधे और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: neminem parcentes
  choice: किसी को नहीं छोड़ेंगे
  rationale: ‘parcere’ का भाव यहाँ किसी पर दया करके उसे हानि से बचाने का है; यह मुहावरेदार हिन्दी उसी निर्मम व्यापकता को व्यक्त करती है।
- source_word: ad diripiendum et deuastandum
  choice: लूटेंगे और उजाड़ेंगे
  rationale: 'दोनों लैटिन क्रियार्थक रूपों के अलग अर्थ सुरक्षित हैं: ‘diripere’ लूटना और ‘devastare’ उजाड़ना/तबाह करना।'
- source_word: adhuc timentes dominum
  choice: जो अब भी प्रभु का भय मानते हैं
  rationale: ‘adhuc’ को उसके निकटवर्ती ‘timentes’ के साथ जोड़ा गया है; इससे सताव के बीच भी प्रभु का भय मानते रहने का भाव स्पष्ट होता है।
theological_decisions:
- issue: ‘प्रभु का भय मानना’ का अर्थ
  choice: प्रभु का भय मानते हैं
  alternative: प्रभु से डरते हैं
  rationale: बाइबलीय धार्मिक अर्थ—श्रद्धापूर्ण भय और निष्ठा—को सुरक्षित रखने के लिए प्रचलित पदबंध चुना गया है, बिना इसे केवल आतंक के अर्थ में सीमित किए।
- issue: ‘adhuc’ का संबंध
  choice: ‘अब भी’ को प्रभु का भय मानने वालों से जोड़ा गया
  alternative: ‘अब भी लूटेंगे और उजाड़ेंगे’
  rationale: लैटिन शब्दक्रम ‘deuastandum adhuc timentes dominum’ में ‘adhuc’ निकटवर्ती कृदंत ‘timentes’ को विशेषित करता है; इसलिए यह विश्वासी लोगों की बनी हुई निष्ठा को दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। दो वाक्यों में विभाजन हिन्दी की स्वाभाविकता बढ़ाता है और मूल के अर्थ-संबंध को नहीं बदलता।
