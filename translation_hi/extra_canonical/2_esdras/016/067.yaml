  text: What will you do? Or how will you hide your sins before God
translation:
  language: hi
  text: तुम क्या करोगे? या परमेश्वर के सामने अपने पापों को कैसे छिपाओगे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: facietis
  choice: तुम क्या करोगे
  rationale: द्वितीय पुरुष बहुवचन भविष्यकाल के सीधे प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: abscondetis
  choice: छिपाओगे
  rationale: भविष्यकाल और द्वितीय पुरुष बहुवचन को बनाए रखते हुए मूल क्रिया ‘छिपाना’ का सीधा अर्थ देता है।
- source_word: peccata uestra
  choice: अपने पापों को
  rationale: uestra के आत्म-संबंधी आशय को हिन्दी के स्वाभाविक ‘अपने’ से और peccata के बहुवचन को ‘पापों’ से व्यक्त किया गया है।
- source_word: coram deo
  choice: परमेश्वर के सामने
  rationale: coram का अर्थ उपस्थिति अथवा सम्मुखता है; ‘के सामने’ स्पष्ट और सहज हिन्दी है।
theological_decisions:
- issue: परमेश्वर से पाप छिपाने की संभावना
  choice: प्रश्न को मूल की चुनौतीपूर्ण आलंकारिक शैली में रखा गया है
  alternative: ‘तुम परमेश्वर से अपने पाप नहीं छिपा सकते’ जैसा स्पष्ट कथन
  rationale: मूल पाठ निष्कर्ष को सीधे घोषित नहीं करता, बल्कि प्रश्न के रूप में नैतिक और धर्मवैचारिक तनाव बनाए रखता है।
- issue: पाठ की समाप्ति
  choice: वाक्य ‘परमेश्वर के सामने’ पर समाप्त किया गया है
  alternative: ‘और उसके स्वर्गदूतों के सामने’ जोड़ना
  rationale: प्रदान किए गए लैटिन स्रोत में अतिरिक्त पदबंध नहीं है, इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘तुम’ मूल के द्वितीय पुरुष बहुवचन को प्रसंगानुकूल सामूहिक संबोधन के रूप में प्रस्तुत करता है।
