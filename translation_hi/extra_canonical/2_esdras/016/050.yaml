  text: the more I will be zealous against them for their sins, says the Lord. How
translation:
  language: hi
  text: मैं उनके पापों के कारण उनके विरुद्ध और भी अधिक जोश दिखाऊँगा, प्रभु कहता है। कैसे
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magis
  choice: और भी अधिक
  rationale: यह तुलना अथवा बढ़ती हुई तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है; पद पिछले वाक्य से जुड़ा हुआ अंश है।
- source_word: adzelabor
  choice: जोश दिखाऊँगा
  rationale: दुर्लभ लैटिन क्रिया में उत्साह या प्रबल तत्परता का भाव है। ‘उनके विरुद्ध’ के साथ यह उसके प्रतिकूल अभिमुख भाव को बनाए रखता है, बिना इसे केवल ‘क्रोध’ बना देने के।
- source_word: super peccata
  choice: पापों के कारण
  rationale: यहाँ super का संबंध उनके पापों को उस प्रतिकूल जोश का आधार या कारण बताने से है; हिन्दी में ‘के कारण’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: Quomodo
  choice: कैसे
  rationale: स्रोत में अगले वाक्य का आरंभ इसी शब्द से होता है; इसे छोड़े बिना खंडित सीमा को यथावत रखा गया है।
theological_decisions:
- issue: प्रभु की प्रतिक्रिया को क्रोध या उत्साह के रूप में प्रस्तुत करना
  choice: जोश दिखाऊँगा
  alternative: क्रोधित होऊँगा
  rationale: adzelabor सीधे तौर पर केवल क्रोध नहीं बताता। चुना हुआ रूप ईश्वरीय विरोध की तीव्रता बनाए रखते हुए स्रोत के ‘zeal’ संबंधी अर्थ को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पद स्रोत की तरह अगले वाक्य के आरंभिक ‘कैसे’ पर समाप्त होता है; पाठ-सीमा पूरी रखने के लिए उसे हटाया या आगे का वाक्य जोड़कर पूरा नहीं किया गया।
