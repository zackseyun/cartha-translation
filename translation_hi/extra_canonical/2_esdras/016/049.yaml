- source_word: ciuitates
  choice: नगरों
  rationale: लैटिन बहुवचन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: domus
  choice: घरों
  rationale: सूची की समानान्तर संरचना और बहुवचन को बनाए रखता है।
- source_word: possessiones
  choice: सम्पत्तियों
  rationale: मालिकाना वस्तुओं और जायदाद के व्यापक अर्थ को व्यक्त करता है।
- source_word: personas suas
  choice: स्वयं उनके शरीरों को
  rationale: इस प्रसंग में अपनी देह/व्यक्ति की बाहरी सज्जा की ओर संकेत सम्भव है; ‘शरीरों’ सामान्य हिन्दी पाठक के लिए मूर्त है, जबकि ‘स्वयं’ लैटिन suas की आत्मवाचकता को बनाए रखता है।
- source_word: Tanto
  choice: उतना ही अधिक
  rationale: अगले वाक्यांश से जुड़ने वाले अपूर्ण तुलनात्मक संकेत को बिना पूरा किए सुरक्षित रखता है।
