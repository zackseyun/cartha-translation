  yaml_path: translation/extra_canonical/2_esdras/016/020.yaml
  text: Behold, famine and plague and tribulation have been sent as scourges for correction.
translation:
  language: hi
  text: जब विपत्तियाँ आएँगी, तब वे क्या करेंगे? देखो, अकाल, महामारी और क्लेश![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कराए गए लैटिन पाठ का अंत “अकाल, महामारी और क्लेश” पर होता है। कुछ परंपरागत रूपों में इसके बाद सुधार के लिए दंड भेजे जाने का भाव मिलता है; वह वाक्यांश यहाँ दिए गए लैटिन स्रोत में नहीं है। लैटिन plaga का अर्थ “प्रहार” या “विपत्ति” भी हो सकता है।
    reason: स्रोत-पाठ की सीमा और plaga की वास्तविक अर्थगत व्यापकता स्पष्ट करना।
lexical_decisions:
- source_word: mala
  choice: विपत्तियाँ
  rationale: संदर्भ में mala नैतिक बुराइयों के बजाय आनेवाली आपदाओं या संकटों को दर्शाता है; इसलिए ‘विपत्तियाँ’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: fames
  choice: अकाल
  rationale: यहाँ fames व्यापक भूख के संकट को दर्शाता है; ‘अकाल’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: plaga
  choice: महामारी
  rationale: plaga का अर्थ प्रहार, विपत्ति या महामारी हो सकता है। अकाल और क्लेश की सूची में ‘महामारी’ उपयुक्त है, पर इसकी व्यापक अर्थ-छाया पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: tribulatio
  choice: क्लेश
  rationale: ‘क्लेश’ गंभीर संकट और पीड़ा—दोनों अर्थों को संक्षेप में व्यक्त करता है और गरिमापूर्ण आधुनिक धार्मिक गद्य में समझने योग्य है।
theological_decisions:
- issue: दिए गए लैटिन स्रोत से आगे के दंडात्मक उद्देश्य का कथन
  choice: ‘सुधार के लिए कोड़ों के रूप में भेजे गए हैं’ को मुख्य पाठ में शामिल नहीं किया गया
  alternative: अंग्रेज़ी POB के अनुसार उस वाक्यांश को जोड़ना
  rationale: प्रस्तुत लैटिन पाठ facient, cum uenerint mala? Ecce fames et plaga et tribulatio में भेजे जाने या सुधार हेतु दंड का कथन नहीं है। मूल-स्रोत साक्ष्य को प्राथमिकता देते हुए उस धर्मवैचारिक विस्तार को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज अभिव्यक्ति। लैटिन में निहित बहुवचन कर्ता को ‘वे’ से व्यक्त किया गया है और विस्मयात्मक Ecce को ‘देखो’ रखा गया है।
