translation:
  language: hi
  text: इसलिए प्रभु उनके सभी कामों को जाँचेगा और तुम सबको उजागर कर देगा। और तुम
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinabit
  choice: जाँचेगा
  rationale: लैटिन क्रिया का अर्थ ध्यानपूर्वक जाँच-पड़ताल करना है; सरल आधुनिक हिन्दी में ‘जाँचेगा’ स्वाभाविक और सटीक है।
- source_word: omnia opera eorum
  choice: उनके सभी कामों को
  rationale: ‘opera’ को नैतिक संदर्भ में व्यापक ‘काम’ से व्यक्त किया गया है, और ‘eorum’ का तृतीय पुरुष बहुवचन स्पष्ट रखा गया है।
- source_word: traducet
  choice: उजागर कर देगा
  rationale: इस संदर्भ में लैटिन शब्द सार्वजनिक रूप से प्रकट या बेनकाब करने का भाव देता है; ‘उजागर कर देगा’ दोष सिद्ध करने जैसी अतिरिक्त धारणा जोड़े बिना इसे व्यक्त करता है।
- source_word: Et uos
  choice: और तुम
  rationale: स्रोत का यह अधूरा वाक्यांश अगले पद में जारी होता है; पद-सीमा और अपूर्णता दोनों सुरक्षित रखी गई हैं।
theological_decisions:
- issue: ‘प्रभु’ कर्ता के रूप में अंग्रेज़ी परामर्श-पाठ में है, पर दिए गए लैटिन अंश में प्रत्यक्ष संज्ञा नहीं दिखती
  choice: प्रभु
  alternative: वह
  rationale: scrutinabit और traducet का निहित कर्ता पूर्ववर्ती संदर्भ से आता है; परामर्श-पाठ के अनुसार ‘प्रभु’ रखने से हिन्दी में संदर्भ स्पष्ट रहता है, जबकि कार्यों के दैवी न्याय का भाव किसी अतिरिक्त सांप्रदायिक व्याख्या के बिना सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। अंतिम ‘और तुम’ को जानबूझकर अधूरा रखा गया है, क्योंकि लैटिन स्रोत भी इसी स्थान पर ‘Et uos’ के साथ अगले पद की ओर बढ़ता है।
