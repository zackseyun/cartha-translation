  rationale: लातीनी क्रिया यहाँ सीधे ‘खरीदना’ व्यक्त करती है।
- source_word: perditurus
  choice: उसे खोना ही है
  rationale: भावी कृदंत आसन्न या निश्चित हानि का भाव देता है; यह हिंदी में स्वाभाविक रहते हुए उस बल को बनाए रखता है।
- source_word: mercatur
