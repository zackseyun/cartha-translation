  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक ‘और’ स्रोत के ‘et’ को सुरक्षित रखता है तथा पद के पूर्ववर्ती संदर्भ से संबंध दिखाता है।
