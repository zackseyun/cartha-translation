  text: He placed pools upon the mountain tops[a], to send forth rivers from the heights so that the earth might drink.
translation:
  language: hi
  text: और उसने पहाड़ों की चोटियों पर जलाशय बनाए, ताकि ऊँचाई से नदियाँ निकलें और पृथ्वी जल पी सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lacus
  choice: जलाशय
  rationale: यहाँ बहुवचन संज्ञा पर्वत-शिखरों पर संचित जल के स्रोतों को दर्शाती है; ‘जलाशय’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: ad emittendum flumina
  choice: ताकि ... नदियाँ निकलें
  rationale: लैटिन उद्देश्यसूचक रचना को सहज हिन्दी में उद्देश्यवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: ab eminenti
  choice: ऊँचाई से
  rationale: लैटिन एकवचन पद को उसके सामान्य, सामूहिक अर्थ में रखा गया है; इससे ऊँचे पर्वतीय स्थानों से नदियों के निकलने का चित्र बना रहता है।
- source_word: ut potaret terra
  choice: और पृथ्वी जल पी सके
  rationale: ‘terra’ कर्ता है और ‘potaret’ पीने की क्रिया; इसलिए पृथ्वी के पीने वाले काव्यात्मक मानवीकरण को सुरक्षित रखा गया है।
theological_decisions: []
