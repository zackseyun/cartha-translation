  text: हाय मुझ पर, हाय मुझ पर! मुझे कौन छुड़ाएगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae mihi
  choice: हाय मुझ पर
  rationale: लातीनी शोक-उद्गार का सीधा और स्वाभाविक हिन्दी रूप; इसकी पुनरावृत्ति मूल की तीव्र व्यथा को बनाए रखती है।
- source_word: quis me liberabit
  choice: मुझे कौन छुड़ाएगा?
  rationale: भविष्यकालीन liberabit और व्यक्तिगत me को स्पष्ट रखते हुए प्रश्न की अनिश्चितता को ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: उद्धारकर्ता की पहचान
  choice: प्रश्न को अनिर्णीत रखा गया है
  alternative: किसी विशेष दैवी या मानवीय उद्धारकर्ता का संकेत जोड़ना
  rationale: मूल पाठ केवल पूछता है कि कौन छुड़ाएगा; वह उद्धारकर्ता की पहचान नहीं बताता।
- issue: समय-सूचक पद
  choice: “उन दिनों” नहीं जोड़ा गया
  alternative: अंग्रेज़ी POB के अनुसार “उन दिनों” जोड़ना
  rationale: दिए गए लातीनी स्रोत में इस पद के अनुरूप कोई शब्द नहीं है; इसलिए स्रोत से असमर्थित विस्तार से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और विलापपूर्ण शैली अपनाई गई है। “हाय मुझ पर” सामान्य पाठक के लिए बोधगम्य रहते हुए लातीनी vae mihi की संरचना और भाव दोनों को निकटता से व्यक्त करता है।
