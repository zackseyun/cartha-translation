  text: For a man will long to see another man[a], or at least to hear his voice.
translation:
  language: hi
  text: क्योंकि मनुष्य किसी दूसरे मनुष्य को देखने के लिए तरसेगा, या कम-से-कम उसकी आवाज़ सुनने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: concupiscet
  choice: तरसेगा
  rationale: यह भविष्यकालीन क्रिया तीव्र लालसा व्यक्त करती है; इस अभावपूर्ण संदर्भ में ‘तरसेगा’ स्वाभाविक और प्रभावी है।
- source_word: homo hominem
  choice: मनुष्य किसी दूसरे मनुष्य को
  rationale: दो अलग व्यक्तियों का संबंध स्पष्ट करता है और लैटिन की पुनरुक्ति को अर्थपूर्ण ढंग से बनाए रखता है।
- source_word: vel certe
  choice: या कम-से-कम
  rationale: यह पहले विकल्प से घटकर एक न्यूनतम या अंतिम सहारे के रूप में दूसरा विकल्प प्रस्तुत करता है, न कि अधिक तीव्र विकल्प।
- source_word: vocem eius audire
  choice: उसकी आवाज़ सुनने के लिए
  rationale: लैटिन पदबंध का सीधा, स्वाभाविक हिंदी रूप।
