reference: 2 Esdras 16:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dominus: Ecce adpropinquant mala et non tardantur. Quemadmodum praegnans in nono mense filium suum, adpropinquante hora partus eius, ante horas duas uel tres gementes dolores circum uentrem eius, et prodiente infante de uentre non tardabit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/038.yaml
  text: Behold, evils are drawing near and are not delayed, just as a pregnant woman in the ninth month with her child, when the hour of her delivery draws near, for two or three hours great pains surround her womb, and when the child comes forth from the womb, it will not delay.
translation:
  language: hi
  text: 'प्रभु कहता है, “देखो, विपत्तियाँ निकट आ रही हैं और वे देर नहीं करेंगी। जैसे कोई गर्भवती स्त्री अपने बच्चे को गर्भ में लिए हुए नौवें महीने में हो: जब उसके प्रसव का समय निकट आता है, तो दो या तीन घंटे पहले कराहों से भरी प्रसव-पीड़ाएँ उसकी कोख को घेर लेती हैं; और जब बच्चा कोख से निकल आता है, तो देर नहीं होती।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: विपत्तियाँ
  rationale: इस प्रलय-विषयक संदर्भ में बहुवचन mala आने वाली बुराइयों की अपेक्षा आने वाले संकटों या विपत्तियों को सूचित करता है; ‘विपत्तियाँ’ स्वाभाविक हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: non tardantur
  choice: वे देर नहीं करेंगी
  rationale: लातीनी अभिव्यक्ति के आसन्न और अविलंब घटित होने के भाव को सरल, वर्तमान हिन्दी में रखा गया है।
- source_word: gementes dolores
  choice: कराह उठाने वाली प्रसव-पीड़ाएँ
  rationale: gementes में निहित कराहने के तीव्र अनुभव और प्रसव-संदर्भ, दोनों को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: circum ventrem eius
  choice: उसके पेट को घेर लेती हैं
  rationale: मूल के स्थान-संबंधी बिंब को शब्दशः कठोर बनाए बिना सुरक्षित रखा गया है।
- source_word: prodiente infante de ventre
  choice: जब बच्चा गर्भ से निकलने लगता है
  rationale: infante को लिंग-निरपेक्ष ‘बच्चा’ से और वर्तमान कृदंत prodiente को आरंभ होती क्रिया से व्यक्त किया गया है।
theological_decisions:
- issue: आने वाली विपत्तियों की आसन्नता
  choice: ‘निकट आ रही हैं और वे देर नहीं करेंगी’ कहकर कथन की तीव्र निश्चितता बनाए रखी गई है।
  alternative: इसे सामान्य भविष्यवाणी के रूप में नरम करना, जैसे ‘शीघ्र आ सकती हैं।’
  rationale: मूल पाठ adpropinquant और non tardantur के द्वारा आसन्नता और विलंब न होने—दोनों पर जोर देता है; अनिश्चित भाषा इस तनाव को घटा देती।
- issue: अंतिम वाक्य में ‘वह’ का संदर्भ
  choice: मूल की एकवचन संरचना के अनुरूप ‘वह देर नहीं करता’ रखा गया है।
  alternative: ‘प्रसव में देर नहीं लगती’ कहकर संदर्भ को स्पष्ट कर देना।
  rationale: लातीनी non tardabit का निहित कर्ता पूरी तरह स्पष्ट नहीं है; वह निकलते हुए बच्चे अथवा जन्म की घटना की ओर संकेत कर सकता है। अनुवाद ने इस वास्तविक अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रसव का सजीव रूपक और मूल वाक्य का क्रम सुरक्षित है; किसी संप्रदायगत व्याख्या को नहीं जोड़ा गया।
