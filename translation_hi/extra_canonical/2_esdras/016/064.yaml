  yaml_path: translation/extra_canonical/2_esdras/016/064.yaml
  text: Woe to those who sin and want to hide their sins!
translation:
  language: hi
  text: हाय उन लोगों पर जो पाप करते हैं और अपने पापों को छिपाना चाहते हैं!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uae peccantibus
  choice: हाय उन लोगों पर जो पाप करते हैं
  rationale: लैटिन ‘uae’ की चेतावनी और विलाप—दोनों की ध्वनि को स्वाभाविक हिन्दी के ‘हाय ... पर’ से व्यक्त किया गया है; ‘peccantibus’ को वर्तमान क्रिया ‘पाप करते हैं’ से रखा गया है।
- source_word: uolentibus occultare peccata sua
  choice: अपने पापों को छिपाना चाहते हैं
  rationale: ‘uolentibus’ इच्छा या चाह को और ‘occultare’ छिपाने को दर्शाता है; ‘sua’ का आत्मवाचक अर्थ ‘अपने’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘uae’ का स्वर
  choice: ‘हाय ... पर’ के रूप में न्यायसूचक चेतावनी और विलाप की संयुक्त ध्वनि बनाए रखी गई।
  alternative: ‘धिक्कार है’
  rationale: ‘धिक्कार’ मुख्यतः निंदा की ध्वनि देता है, जबकि ‘uae’ में आसन्न विपत्ति की चेतावनी और शोक भी निहित हो सकते हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रस्तुत पाठ केवल इस पद के पूर्ण वाक्य ‘uae ... sua’ का अनुवाद करता है; आरंभ का ‘et quae cogitatis in cordibus uestris’ पिछले पद से और अंत का ‘Propter quod dominus scrutinando’ अगले वाक्य से जुड़ा हुआ प्रतीत होता है।
