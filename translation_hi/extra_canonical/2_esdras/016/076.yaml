  yaml_path: translation/extra_canonical/2_esdras/016/076.yaml
  text: Do not fear or hesitate, for God is your guide.
translation:
  language: hi
  text: मत डरो और न हिचकिचाओ, क्योंकि परमेश्वर तुम्हारा मार्गदर्शक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: timeatis
  choice: डरो
  rationale: लैटिन क्रिया का सीधा और स्वाभाविक हिन्दी समतुल्य; निषेध के साथ आज्ञार्थक भाव बनाए रखता है।
- source_word: haesitemini
  choice: हिचकिचाओ
  rationale: यहाँ अर्थ ‘संदेह करना’ से अधिक ‘हिचकना/अनिर्णय में रुकना’ है; इसलिए संशोधित अंग्रेज़ी परामर्श-पाठ के अनुरूप भी है।
- source_word: dux
  choice: मार्गदर्शक
  rationale: dux का मूल अर्थ अगुआ या नेतृत्व करने वाला है; इस प्रसंग में ‘मार्गदर्शक’ सहज हिन्दी में दिशा और नेतृत्व दोनों व्यक्त करता है।
theological_decisions:
- issue: Deus का हिन्दी रूप
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: ‘परमेश्वर’ सामान्य हिन्दी बाइबिलीय शैली में स्वाभाविक और गरिमापूर्ण है तथा किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: dux में नेतृत्व और मार्गदर्शन की अर्थ-छाया
  choice: मार्गदर्शक
  alternative: अगुआ
  rationale: ‘मार्गदर्शक’ पद के सांत्वनापूर्ण संदर्भ में स्वाभाविक है; यद्यपि ‘अगुआ’ नेतृत्व की अर्थ-छाया अधिक प्रत्यक्ष रूप से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज वाक्य। संयुक्त निषेध ‘मत… और न…’ लैटिन के दो समानांतर निषेधों को स्पष्ट रूप से सुरक्षित रखता है।
