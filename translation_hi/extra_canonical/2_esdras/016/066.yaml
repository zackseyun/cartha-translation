source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: confusi eritis, cum processerint peccata uestra coram hominibus, et iniquitates erint quae accusatores stabunt in die illo. Quid
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/066.yaml
  text: And you will be put to shame when your sins come forth before men[a], and your iniquities will stand as accusers on that day.
translation:
  language: hi
  text: जब तुम्हारे पाप लोगों के सामने निकल आएँगे, तब तुम लज्जित होगे; और उस दिन तुम्हारे अधर्म ही आरोप लगानेवालों के रूप में खड़े होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusi eritis
  choice: तुम लज्जित होगे
  rationale: यह पद पापों के सार्वजनिक रूप से सामने आने पर होनेवाली लज्जा व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: processerint
  choice: निकल आएँगे
  rationale: क्रिया में केवल प्रकट होने के बजाय आगे या बाहर आने की गतिशील छवि है; ‘निकल आएँगे’ उस भाव को सहज हिन्दी में बनाए रखता है।
- source_word: iniquitates
  choice: अधर्म
  rationale: यह ‘peccata’ से शब्दगत भेद रखते हुए अन्यायपूर्ण या दुष्ट कर्मों का व्यापक नैतिक अर्थ व्यक्त करता है।
- source_word: accusatores stabunt
  choice: आरोप लगानेवालों के रूप में खड़े होंगे
  rationale: यह न्यायिक दृश्य और अपराधों के स्वयं आरोपकर्ता बनकर खड़े होने की मानवीकरणयुक्त छवि दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: अधर्मों का आरोपकर्ता के रूप में मानवीकरण
  choice: ‘तुम्हारे अधर्म ही ... आरोप लगानेवालों के रूप में खड़े होंगे’
  alternative: ‘तुम्हारे अधर्म उस दिन तुम्हें दोषी ठहराएँगे’
  rationale: वैकल्पिक रूप अर्थ को समझाता है, पर स्रोत की ‘खड़े होंगे’ वाली न्यायालय-सदृश छवि मिटा देता है। ‘ही’ लैटिन के बलाघाती संबंधवाचक विन्यास का स्वाभाविक हिन्दी प्रतिनिधित्व करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गंभीर रखी गई है। ‘लोगों’ को ‘मनुष्यों’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक माना गया, जबकि अर्धविराम पद के दो निकट जुड़े न्याय-दृश्यों को अलग करता है। स्रोत के अंत का ‘Quid’ अगले वाक्य का आरंभ जान पड़ता है, इसलिए इस पद में शामिल नहीं किया गया।
