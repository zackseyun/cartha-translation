  text: Audite uerbum, plebs mea, parate uos in pugnam et in malis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/041.yaml
  text: 'Hear the word, my people: prepare yourselves for battle, and in the midst of evils be like strangers on the earth.'
translation:
  language: hi
  text: मेरी प्रजा, वचन सुनो! युद्ध के लिए तैयार हो जाओ, और विपत्तियों के बीच पृथ्वी पर परदेशियों के समान रहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए लातीनी अंश का पाठ “और विपत्तियों में” पर समाप्त हो जाता है; “पृथ्वी पर परदेशियों के समान रहो” अंग्रेज़ी परामर्श-पाठ में सुरक्षित पूर्ण वाक्य के अनुसार दिया गया है।
    reason: उपलब्ध मूल-भाषा उद्धरण और परामर्श-पाठ की सीमा में अंतर को पारदर्शी रखना।
lexical_decisions:
- source_word: Audite uerbum
  choice: वचन सुनो
  rationale: लातीनी आज्ञार्थक बहुवचन को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: plebs mea
  choice: मेरी प्रजा
  rationale: plebs यहाँ संबोधित सामुदायिक जनसमूह है; ‘प्रजा’ गरिमापूर्ण और सामान्य हिन्दी विकल्प है।
- source_word: parate uos in pugnam
  choice: युद्ध के लिए तैयार हो जाओ
  rationale: शाब्दिक अर्थ और आज्ञार्थक बल दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: in malis
  choice: विपत्तियों के बीच
  rationale: बहुवचन mala का अर्थ यहाँ नैतिक ‘बुराइयों’ की अपेक्षा आने वाले संकटों या विपत्तियों से अधिक मेल खाता है।
- source_word: be like strangers on the earth
  choice: पृथ्वी पर परदेशियों के समान रहो
  rationale: यह अंतिम विचार अंग्रेज़ी परामर्श-पाठ में है; ‘परदेशी’ अस्थायी निवास और इस संसार से अनासक्ति—दोनों संकेतों को बिना अधिक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: ‘पृथ्वी पर परदेशियों’ की धार्मिक व्याख्या
  choice: रूपक को यथावत रखा गया
  alternative: इसे ‘संसार से अलग रहो’ जैसे व्याख्यात्मक कथन में बदलना
  rationale: मूल रूपक की संभावित सामाजिक, नैतिक और परलोक-संबंधी परतों में से किसी एक को निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में गरिमा और तात्कालिकता रखी गई है। छोटे आज्ञार्थक वाक्य युद्ध और संकट की चेतावनी का बल बनाए रखते हैं।
