translation:
  language: hi
  text: और वे तुममें से कुछ लोगों को मूर्तियों को चढ़ाया हुआ भोजन[a] खिलाएँगे। जो लोग उनकी बात मान लेंगे, वे उनके लिए उपहास, अपमान और पैरों तले रौंदे जाने का पात्र बनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन पाठ का रूप व्याकरण की दृष्टि से असामान्य है; आशय संभवतः ‘मूर्तियों को चढ़ाया हुआ मांस’ या सामान्य रूप से ‘मूर्तियों को चढ़ाया हुआ भोजन’ है।
    reason: textual_lexical_ambiguity
lexical_decisions:
- source_word: quosdam ex uobis
  choice: तुममें से कुछ लोगों को
  rationale: यह कर्मकारक पद है और cibabunt का कर्म बनता है; इसलिए इसे अस्पष्ट अलग वाक्यांश न रखकर उसी क्रिया से जोड़ा गया है।
- source_word: cibabunt
  choice: खिलाएँगे
  rationale: लैटिन क्रिया का सीधा अर्थ भोजन कराना या खिलाना है।
- source_word: idolis occisam
  choice: मूर्तियों के लिए बलि किया हुआ भोजन
  rationale: पाठ व्याकरण की दृष्टि से कुछ असामान्य है और संभवतः लुप्त ‘मांस/भोजन’ को मानता है; संदर्भ में आशय मूर्तियों को चढ़ाए गए बलि-भोजन से है।
- source_word: consenserint eis
  choice: उनकी बात मान लेंगे
  rationale: सहमति देने या उनके कहे के अनुसार चलने का स्वाभाविक आधुनिक हिन्दी रूप; केवल बौद्धिक सहमति तक अर्थ को सीमित नहीं करता।
- source_word: in derisum et in inproperium et in conculcationem
  choice: उपहास, अपमान और पैरों तले रौंदे जाने का पात्र
  rationale: तीनों लैटिन संज्ञात्मक पदों की क्रमिक तीव्रता और समानांतर संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: मूर्तियों को बलि किए भोजन के प्रति सहमति
  choice: ‘उनकी बात मान लेंगे’ के रूप में खुला रखा गया
  alternative: ‘वह भोजन खा लेंगे’
  rationale: लैटिन eis का संदर्भ सताने वालों से है और पाठ स्पष्ट रूप से सहमति को केवल भोजन खाने के कार्य तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘उपहास, अपमान और पैरों तले रौंदे जाने’ की त्रिक संरचना मूल पाठ के बल और क्रम को बनाए रखती है।
