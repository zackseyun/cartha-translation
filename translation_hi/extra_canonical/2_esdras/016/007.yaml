  text: या क्या कोई बलवान धनुर्धर के छोड़े हुए तीर को लौटा सकता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: recutiet
  choice: लौटा सकता है
  rationale: यह क्रिया छोड़े जा चुके तीर को वापस मोड़ने या लौटा देने का भाव रखती है; सहज हिन्दी में ‘लौटा सकता है’ प्रश्न की असंभवता को स्पष्ट रखते हुए मूल रूपक को बचाता है।
- source_word: sagittam inmissam
  choice: छोड़े हुए तीर
  rationale: ‘inmissam’ प्रक्षेपित या चला दिए जाने को दर्शाता है; धनुर्विद्या के संदर्भ में ‘छोड़े हुए’ स्वाभाविक और सटीक है।
- source_word: a sagittario forte
  choice: बलवान धनुर्धर के
  rationale: ‘forte’ यहाँ ‘sagittario’ का विशेषण है; ‘बलवान’ शारीरिक सामर्थ्य का सीधा संकेत देता है और अंग्रेज़ी परामर्श-पाठ के ‘strong’ के अनुरूप है।
