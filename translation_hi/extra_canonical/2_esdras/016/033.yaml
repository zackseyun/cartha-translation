  yaml_path: translation/extra_canonical/2_esdras/016/033.yaml
  text: And the land will be left desolate[a], and its fields will grow old, and its roads and all its paths will sprout thorns, because sheep will not pass through them.
translation:
  language: hi
  text: और भूमि उजाड़ छोड़ दी जाएगी; उसके खेत पुराने पड़ जाएँगे[a], और उसकी सड़कों तथा सभी पगडंडियों पर काँटे उग आएँगे, क्योंकि उस भूमि से होकर भेड़ें नहीं गुज़रेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पूर्ववर्ती अनुवाद में: “उसके खेत काँटों से भर जाएँगे, और उसकी सड़कें तथा सभी पगडंडियाँ झाड़ियाँ उगाएँगी।”'
    reason: अंग्रेज़ी POB audit trail में दिया गया previous_rendering; इसे स्रोत-पाठ के वैकल्पिक अर्थ के बजाय पूर्ववर्ती अनुवाद के रूप में स्पष्ट किया गया है।
