  rationale: यह छोड़े हुए और निर्जन भूभाग की दशा को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: agri
  choice: खेत
  rationale: कृषि-भूमि के लिए साधारण और सटीक हिन्दी शब्द।
- source_word: inveteraverunt
  choice: पुराने पड़ जाएँगे
  rationale: लातीनी क्रिया का मूल भाव ‘पुराना पड़ना/दीर्घकाल से उपेक्षित हो जाना’ है। असामान्य रूपक को मिटाकर केवल ‘उजड़ना’ या ‘काँटों से भरना’ कहना उचित नहीं होगा।
- source_word: viae ... semitae
  choice: सड़कें ... पगडंडियाँ
  rationale: viae के व्यापक मार्ग और semitae के छोटे, संकरे रास्तों के बीच का अंतर बनाए रखता है।
- source_word: germinabunt spinas
  choice: पर काँटे उग आएँगे
  rationale: शाब्दिक अर्थ ‘काँटे अंकुरित करेंगे’ है; हिन्दी में स्थानसूचक रचना अधिक स्वाभाविक है और काँटों के उगने का अर्थ अक्षुण्ण रखती है।
- source_word: oves
  choice: भेड़ें
  rationale: बहुवचन का सीधा और सामान्य अनुवाद।
- source_word: per eam
  choice: उस भूमि से होकर
  rationale: स्त्रीलिंग एकवचन सर्वनाम eam का निकटतम संगत पूर्वपद terra है, इसलिए इसे बहुवचन सड़कों-पगडंडियों से न जोड़कर भूमि से जोड़ा गया है।
