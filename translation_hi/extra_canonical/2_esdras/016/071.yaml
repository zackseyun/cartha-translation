  text: For there will be much uprising in place after place and in the neighboring cities.
translation:
  language: hi
  text: क्योंकि जगह-जगह और पड़ोसी नगरों में बहुत विद्रोह होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: locis locus
  choice: जगह-जगह
  rationale: लैटिन की असामान्य पुनरुक्ति को स्वाभाविक हिन्दी में स्थान-दर-स्थान होने के अर्थ के साथ व्यक्त करता है।
- source_word: in uicinas ciuitates
  choice: पड़ोसी नगरों में
  rationale: uicinas का अर्थ निकटवर्ती या पड़ोसी और ciuitates का अर्थ यहाँ नगर है; हिन्दी में स्थानसूचक प्रयोग के लिए ‘में’ स्वाभाविक है।
- source_word: exsurrectio multa
  choice: बहुत विद्रोह
  rationale: exsurrectio यहाँ उठ खड़े होने या उपद्रव के अर्थ में है; ‘विद्रोह’ प्रसंगानुकूल और सामान्य पाठक के लिए स्पष्ट है, जबकि multa उसकी व्यापक मात्रा दर्शाता है।
theological_decisions:
- issue: विद्रोह के लक्ष्य या पक्ष की पहचान
  choice: किसी लक्ष्य या समूह का उल्लेख नहीं जोड़ा गया
  alternative: ‘प्रभु का भय मानने वालों के विरुद्ध’ जैसी व्याख्यात्मक वृद्धि
  rationale: लैटिन स्रोत इस विद्रोह का लक्ष्य नहीं बताता; इसलिए किसी धार्मिक समूह को जोड़ना स्रोत से असमर्थित होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य; ‘जगह-जगह’ मूल की पुनरुक्ति को स्वाभाविक ढंग से बनाए रखता है।
