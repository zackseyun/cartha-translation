  text: 'Behold, the word of the Lord: receive it; do not disbelieve what the Lord says.'
translation:
  language: hi
  text: देखो, प्रभु का वचन! उसे ग्रहण करो; प्रभु जो कहता है, उस पर अविश्वास मत करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: verbum Domini
  choice: प्रभु का वचन
  rationale: बाइबलीय प्रयोग को बनाए रखते हुए Latin पदबंध का सीधा अर्थ देता है।
- source_word: excipite eum
  choice: उसे ग्रहण करो
  rationale: eum का संबंध verbum से मानते हुए, excipite में निहित स्वीकार करने और अपनाने का भाव व्यक्त करता है।
- source_word: ne discredatis
  choice: अविश्वास मत करो
  rationale: निषेधात्मक आदेश को सीधे व्यक्त करता है और विश्वास न करने के अर्थ को सुरक्षित रखता है।
- source_word: de quibus dicit Dominus
  choice: प्रभु जो कहता है, उस पर
  rationale: Latin पाठ का अंतिम पदबंध व्याकरण की दृष्टि से कुछ असहज है; यह रूप प्रसंगानुकूल अर्थ को स्वाभाविक हिन्दी में देता है और अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
theological_decisions:
- issue: ‘प्रभु का वचन’ को व्यक्तिगत सत्ता या बोले गए संदेश के रूप में समझना
  choice: व्याकरणिक रूप से संदेश की ओर संकेत करने वाला ‘उसे’ रखा गया
  alternative: ‘वचन’ को स्पष्ट रूप से व्यक्तिवाचक बनाना
  rationale: Latin में eum पुल्लिंग verbum की ओर सामान्य व्याकरणिक संकेत है; यहाँ व्यक्तिवाचक या मसीह-संबंधी अर्थ को अनावश्यक रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, आज्ञात्मक और गरिमापूर्ण शैली। ‘ग्रहण करो’ बाइबलीय गंभीरता बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है।
