  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। आज्ञार्थक बहुवचन ‘आओ/जाओ’ सामूहिक संबोधन को दर्शाता है। उपलब्ध पाठ के आरंभ का ‘angelis eius?’ संभवतः पिछले वाक्य का खंड या पाठ-संदेह है, इसलिए अंग्रेज़ी परामर्श-पाठ के समान इस पद के मुख्य अनुवाद में सम्मिलित नहीं किया गया।
