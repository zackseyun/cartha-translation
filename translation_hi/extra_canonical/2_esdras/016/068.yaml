source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelis eius? Ecce iudex deus, timete eum; desinite a peccatis uestris et obliuiscimini iniquitates uestras iam agere eas sempiterno, et deus educabit uos et liberabit de omni tribulatione.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/068.yaml
  text: Behold[a], God is judge; fear him. Cease from your sins, and forget your iniquities, never to practice them again; and God will lead you out and deliver you from every tribulation.
translation:
  language: hi
  text: देखो, परमेश्वर न्यायाधीश है; उससे डरो। अपने पापों से बाज़ आओ और अपने अधर्मों को भूल जाओ; उन्हें फिर कभी न करो[a]। और परमेश्वर तुम्हें बाहर ले जाएगा और हर संकट से छुड़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हें सदा के लिए फिर कभी न करने के लिए।’
    reason: लैटिन ‘obliuiscimini ... iam agere eas sempiterno’ का विन्यास कठिन है। मुख्य पाठ स्वाभाविक हिन्दी में उसके स्थायी निषेध के भाव को व्यक्त करता है; यह विकल्प उसके अधिक निकट, किंतु हिन्दी में कम सहज, विन्यास को दर्शाता है।
lexical_decisions:
- source_word: Ecce
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले लैटिन उद्गार का सहज और सीधा हिन्दी रूप।
- source_word: iudex deus
  choice: परमेश्वर न्यायी है
  rationale: लैटिन विधेय संज्ञा का अर्थ सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक वाक्य; इसका आशय है कि परमेश्वर न्याय करने वाला है।
- source_word: timete eum
  choice: उससे डरो
  rationale: आज्ञार्थक बहुवचन और धार्मिक भय/श्रद्धामिश्रित भय की तीव्रता को सीधे बनाए रखता है।
- source_word: desinite a peccatis uestris
  choice: अपने पापों से बाज़ आओ
  rationale: desinere a की ‘छोड़ देना/रुक जाना’ की शक्ति को सामान्य, प्रभावी हिन्दी में व्यक्त करता है।
- source_word: obliuiscimini iniquitates uestras iam agere eas sempiterno
  choice: अपने अधर्म के कामों को भूल जाओ, ताकि उन्हें फिर कभी न करो
  rationale: अटपटे लैटिन विन्यास का आशय है उन अधर्मों को सदा के लिए करना छोड़ देना; ‘भूल जाओ’ की मूल छवि और स्थायी निषेध दोनों सुरक्षित हैं।
- source_word: educabit uos
  choice: तुम्हें निकाल ले जाएगा
  rationale: e-ducere में संकट की स्थिति से बाहर ले आने का भाव है, जिसे अगले ‘छुड़ाएगा’ से अलग रखा गया है।
- source_word: liberabit de omni tribulatione
  choice: हर संकट से छुड़ाएगा
  rationale: tribulatio के दुःख, दबाव और विपत्ति संबंधी व्यापक भाव के लिए ‘संकट’ सहज है।
theological_decisions:
- issue: परमेश्वर के न्यायी होने और उद्धार के बीच संबंध
  choice: ‘तब’ के द्वारा पश्चात्ताप की आज्ञा के बाद उद्धार का आश्वासन प्रस्तुत किया गया
  alternative: ‘और’ रखकर केवल क्रमसूचक संयोजन
  rationale: लैटिन et को प्रसंग में परिणामसूचक ढंग से समझना स्वाभाविक है, पर अनिवार्य कारण-फल सिद्धांत नहीं जोड़ा गया।
- issue: iudex deus की व्याख्या
  choice: ‘परमेश्वर न्यायी है’
  alternative: ‘परमेश्वर न्यायाधीश है’
  rationale: ‘न्यायी’ वर्तमान हिन्दी में स्वाभाविक है और परमेश्वर के न्याय करने वाले होने का अर्थ देता है; किसी विशिष्ट अंतिम-न्याय सिद्धांत का अतिरिक्त विवरण नहीं जोड़ता।
