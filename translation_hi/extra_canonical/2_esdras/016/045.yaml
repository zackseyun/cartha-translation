  text: Those who marry[a], as though they will have no children; and those who do not marry, as widowers.
translation:
  language: hi
  text: जो विवाह करते हैं, वे ऐसे रहें मानो उनके बच्चे नहीं होंगे; और जो विवाह नहीं करते, वे विधुरों के समान रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui nubunt
  choice: जो विवाह करते हैं
  rationale: यह सामान्य और स्वाभाविक आधुनिक हिन्दी है तथा लैटिन के बहुवचन संबंधवाचक खंड को बनाए रखता है।
- source_word: sic quasi filios non facturi
  choice: वे ऐसे रहें मानो उनके बच्चे नहीं होंगे
  rationale: ‘facturi’ भावी सक्रिय कृदन्त है; यहाँ इसका अर्थ संतान उत्पन्न करने की संभावना से है। प्रसंग में पद 42 के आज्ञार्थक भाव पर निर्भर दीर्घ अंडाकार शृंखला को हिन्दी में स्पष्ट करने के लिए ‘रहें’ जोड़ा गया है।
- source_word: qui non nubunt
  choice: जो विवाह नहीं करते
  rationale: ‘non nubunt’ का सीधा, तटस्थ अनुवाद; इससे ब्रह्मचर्य या किसी विशिष्ट धार्मिक स्थिति का अतिरिक्त अर्थ नहीं जोड़ा जाता।
- source_word: sic quasi vidui
  choice: वे विधुरों के समान रहें
  rationale: ‘vidui’ पुल्लिंग बहुवचन है और यहाँ विवाह न करने वालों की तुलना विधुरों से करता है; ‘विधुर’ स्रोत के व्याकरणिक रूप को सुरक्षित रखता है।
theological_decisions:
- issue: पद 42 से जारी आज्ञार्थक भाव
  choice: दोनों खंडों में ‘रहें’ को स्पष्ट किया गया
  alternative: 'शाब्दिक अंडाकार रचना: ‘जो विवाह करते हैं, मानो उनके बच्चे नहीं होंगे; और जो विवाह नहीं करते, मानो विधुर’'
  rationale: लैटिन में आज्ञार्थक क्रिया पिछले पद से समझी जाती है। अकेले उद्धृत हिन्दी पद में अर्थ और लय स्पष्ट रखने के लिए निहित आज्ञार्थक भाव प्रकट करना आवश्यक है।
- issue: ‘quasi’ की तुलना और काल्पनिक भाव
  choice: पहले खंड में ‘मानो’, दूसरे में ‘के समान’
  alternative: दोनों स्थानों पर ‘मानो’ या ‘जैसे’
  rationale: पहले खंड में आने वाली भावी क्रिया के साथ ‘मानो’ स्वाभाविक है, जबकि संज्ञा ‘विधुरों’ के साथ ‘के समान’ अधिक सहज है; दोनों ही ‘quasi’ का तुलनात्मक/काल्पनिक बल बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पिछले पद से नियंत्रित अंडाकार आज्ञार्थक संरचना को हिन्दी में ‘रहें’ द्वारा व्यक्त किया गया है।
