  yaml_path: translation/extra_canonical/2_esdras/016/008.yaml
  text: A strong archer has shot an arrow; who will turn it back? The Lord God sends evils, and who will drive them away?
translation:
  language: hi
  text: बलवान धनुर्धर के छोड़े हुए तीर को कौन वापस मोड़ सकता है? प्रभु परमेश्वर विपत्तियाँ[a] भेजता है; उन्हें कौन दूर कर सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन शब्द का अर्थ “बुराइयाँ,” “संकट,” या “विपत्तियाँ” हो सकता है।
    reason: मूल शब्द mala की व्यापक अर्थ-सीमा और कथन में निहित धर्मवैचारिक तनाव को पाठक के सामने बनाए रखने के लिए।
lexical_decisions:
- source_word: sagittam a sagittario forti missam
  choice: बलवान धनुर्धर का छोड़ा हुआ तीर
  rationale: लैटिन के कर्मवाच्य पदबंध को स्वाभाविक हिन्दी में रखा गया है, जबकि बलवान धनुर्धर और छोड़े गए तीर की छवि पूरी तरह बनी रहती है।
- source_word: revocabit
  choice: लौटा सकता है
  rationale: तीर के संदर्भ में इसका आशय उसके चल जाने के बाद उसे वापस मोड़ने या लौटा लाने की असंभवता है; यह हिन्दी प्रयोग उस भाव को स्पष्ट और संक्षिप्त रखता है।
- source_word: Dominus deus
  choice: प्रभु परमेश्वर
  rationale: दोनों उपाधियों को अलग और गरिमापूर्ण रूप में सुरक्षित रखा गया है।
- source_word: mala
  choice: विपत्तियाँ
  rationale: इस न्याय-वर्णन के संदर्भ में बहुवचन mala नैतिक बुराइयों के बजाय आने वाली हानियों, संकटों या विपत्तियों को सूचित करता है; इसलिए ‘विपत्तियाँ’ स्वाभाविक है, और व्यापक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: expellet
  choice: दूर कर सकता है
  rationale: भेजी गई विपत्तियों को हटा देने या टाल देने का भाव सरल आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: परमेश्वर द्वारा mala भेजे जाने का कथन
  choice: प्रभु परमेश्वर विपत्तियाँ भेजता है
  alternative: प्रभु परमेश्वर बुराइयाँ भेजता है
  rationale: संदर्भ दैवी न्याय के रूप में आने वाली आपदाओं का है। ‘विपत्तियाँ’ नैतिक बुराई को परमेश्वर से जोड़ने की अनावश्यक धारणा से बचता है, लेकिन मूल शब्द की अर्थ-व्याप्ति को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों आलंकारिक प्रश्नों की समानांतर संरचना तथा न्याय की अपरिवर्तनीयता पर उनका बल सुरक्षित है। उपलब्ध लैटिन पंक्ति स्पष्टतः संक्षिप्त/खंडित रूप में दी गई है; पूर्ण वाक्य-संरचना के लिए परीक्षित अंग्रेज़ी परामर्श-पाठ और उससे प्रमाणित पुनर्स्थापित खंड का सहारा लिया गया है।
