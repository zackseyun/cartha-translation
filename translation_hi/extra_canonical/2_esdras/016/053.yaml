  text: righteousness will reign over us[a]. Let not the sinner say that he has not sinned,
translation:
  language: hi
  text: धार्मिकता हम पर राज्य करेगी। पापी यह न कहे कि उसने पाप नहीं किया है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iusticia
  choice: धार्मिकता
  rationale: लातीनी शब्द यहाँ नैतिक और न्यायपूर्ण सही अवस्था को व्यक्त करता है; ‘धार्मिकता’ इस धार्मिक संदर्भ में स्वाभाविक और अर्थपूर्ण है।
- source_word: regnabit
  choice: राज्य करेगी
  rationale: भविष्यकाल और शासन करने की रूपकात्मक शक्ति—दोनों को सुरक्षित रखता है।
- source_word: in nos
  choice: हम पर
  rationale: लातीनी प्रयोग का स्वाभाविक हिन्दी रूप, जिसमें धार्मिकता के हम पर प्रभुत्व का भाव बना रहता है।
- source_word: Non dicat
  choice: यह न कहे
  rationale: निषेधात्मक आदेश/उपदेश के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: peccator
  choice: पापी
  rationale: व्यक्ति को पाप करनेवाले के रूप में सीधे दर्शाता है और स्रोत की धार्मिक शब्दावली बनाए रखता है।
- source_word: non se peccasse
  choice: कि उसने पाप नहीं किया है
  rationale: अप्रत्यक्ष कथन और पूर्व में किए गए पाप के निषेध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: iusticia का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: दोनों अर्थ संभव हैं, पर यहाँ ‘पापी’ और ‘पाप किया’ के निकट संदर्भ में नैतिक धार्मिकता अधिक उपयुक्त है; फिर भी शासन का रूपक न्याय का भाव भी साथ रखता है।
- issue: regnabit in nos में संबंध
  choice: हम पर राज्य करेगी
  alternative: हममें राज्य करेगी
  rationale: लातीनी ‘in nos’ दिशा/प्रभुत्व का अर्थ दे सकता है। ‘हम पर’ शासन के रूपक के साथ अधिक स्वाभाविक है, जबकि ‘हममें’ आंतरिक नैतिक परिवर्तन की अधिक विशिष्ट व्याख्या कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और स्रोत के खंडित वाक्य-विन्यास के अनुरूप। अंतिम अल्पविराम इसलिए रखा गया है क्योंकि दिया गया स्रोत आगे जारी होने वाले वाक्य का अंश है।
