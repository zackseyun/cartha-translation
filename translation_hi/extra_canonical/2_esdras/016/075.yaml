source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite, electi mei, dicit dominus, ecce adsunt dies tribulationis, et de his liberabo uos. Ne timeatis nec haesitemini,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/075.yaml
  text: 'Hear, my chosen ones, says the Lord: behold, days of tribulation are here, and from them I will deliver you. Do not fear or hesitate,'
translation:
  language: hi
  text: “हे मेरे चुने हुओ, सुनो,” प्रभु कहता है, “देखो, संकट के दिन आ पहुँचे हैं, और मैं तुम्हें उनसे छुड़ाऊँगा। मत डरो और न हिचकिचाओ,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electi mei
  choice: मेरे चुने हुओ
  rationale: लैटिन संबोधन का अर्थ और बहुवचन बनाए रखते हुए स्वाभाविक हिन्दी रूप चुना गया।
- source_word: adsunt
  choice: आ पहुँचे हैं
  rationale: यह केवल निकटता नहीं, बल्कि दिनों के उपस्थित हो जाने को व्यक्त करता है।
- source_word: dies tribulationis
  choice: संकट के दिन
  rationale: ‘tribulatio’ के कष्ट और विपत्ति के व्यापक भाव को साधारण, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: liberabo uos
  choice: मैं तुम्हें ... छुड़ाऊँगा
  rationale: भविष्यकालीन दैवी उद्धार का सीधा अर्थ सुरक्षित रखा गया।
- source_word: haesitemini
  choice: हिचकिचाओ
  rationale: भय के साथ आने वाली अनिश्चितता या डगमगाहट को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: संकट से छुड़ाए जाने का आशय
  choice: मैं तुम्हें उनसे छुड़ाऊँगा
  alternative: मैं तुम्हें उनके बीच सुरक्षित रखूँगा
  rationale: लैटिन ‘de his liberabo uos’ में ‘इनसे’ छुटकारे का स्पष्ट भाव है; पाठ यह निर्धारित नहीं करता कि छुटकारा संकट से पहले, उसके दौरान या उसके बाद होगा, इसलिए समय-संबंधी व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रत्यक्ष संबोधन और भविष्यवाणीय, आश्वस्तकारी गरिमा बनाए रखी गई है। अंतिम अल्पविराम इसलिए रखा गया है कि पद अगले वाक्य से जुड़ता है।
