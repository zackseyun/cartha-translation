reference: 2 Esdras 16:77
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam deus dux uester est. Et qui seruatis mandata et praecepta mea, dicit dominus deus, ne praeponderent uos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/077.yaml
  text: For God is your guide. And you who keep my commandments and my ordinances, says the Lord God, do not let your sins weigh you down, nor let your iniquities prevail over you.
translation:
  language: hi
  text: क्योंकि परमेश्वर तुम्हारा मार्गदर्शक है। प्रभु परमेश्वर कहता है, “और तुम, जो मेरी आज्ञाओं और निर्देशों का पालन करते हो, तुम पर कुछ भी भारी न पड़े।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिया गया लैटिन पाठ यहाँ अधूरा जान पड़ता है। ‘तुम पर भारी न पड़ें’ के लिए क्रिया बहुवचन में है, पर उसका कर्ता उपलब्ध अंश में नहीं दिया गया है। परामर्श-पाठ में आगे ‘तुम्हारे पापों’ और ‘तुम्हारे अधर्म’ का उल्लेख है, लेकिन वे शब्द इस उपलब्ध लैटिन अंश में नहीं हैं।
    reason: उपलब्ध लैटिन में अव्यक्त कर्ता और परामर्श-पाठ के अतिरिक्त विस्तार—दोनों को स्पष्ट करता है, बिना मुख्य पाठ में अनुमानित शब्द जोड़े।
lexical_decisions:
- source_word: dux
  choice: मार्गदर्शक
  rationale: यहाँ ‘dux’ उस व्यक्ति को दर्शाता है जो राह दिखाता और अगुवाई करता है; ‘मार्गदर्शक’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक सैन्य अर्थ नहीं जोड़ता।
- source_word: mandata et praecepta
  choice: आज्ञाओं और विधियों
  rationale: दो निकटार्थी लैटिन पदों का भेद बनाए रखने के लिए अलग हिन्दी शब्द रखे गए हैं।
- source_word: seruatis
  choice: पालन करते हो
  rationale: लैटिन का अर्थ केवल सुरक्षित रखने का नहीं, बल्कि आज्ञाओं के अनुसार चलने का है।
- source_word: ne praeponderent uos
  choice: किसी बात को अपने ऊपर भारी न पड़ने दो
  rationale: दिए गए लैटिन में बहुवचन क्रिया का कर्ता व्यक्त नहीं है और अंश इसी स्थान पर टूट जाता है। हिन्दी वाक्य को संभव बनाते हुए अस्पष्टता बनाए रखी गई है; ‘पाप’ या ‘अधर्म’ को मुख्य पाठ में जोड़ना उपलब्ध लैटिन से आगे जाता।
theological_decisions:
- issue: अव्यक्त कर्ता को ‘पाप’ या ‘अधर्म’ मानना
  choice: मुख्य पाठ में कर्ता को सामान्य और अनिर्दिष्ट रखा गया
  alternative: “अपने पापों को अपने ऊपर भारी न पड़ने दो, और अपने अधर्म को अपने ऊपर प्रबल न होने दो”
  rationale: परामर्श हेतु दिए गए अंग्रेज़ी पाठ में यह विस्तार है, पर प्रस्तुत लैटिन ‘ne praeponderent uos’ पर समाप्त हो जाता है। स्रोत-साक्ष्य से अनुपस्थित धर्मवैचारिक शब्दों को बिना संकेत जोड़ा नहीं गया।
- issue: दिव्य वचन के उद्धरण की सीमा
  choice: “प्रभु परमेश्वर कहता है” को उसके बाद आने वाले उपदेश का परिचायक बनाया
  alternative: इसे वाक्य के बीच कोष्ठकीय कथन की तरह रखना
  rationale: लैटिन शब्दक्रम दोनों ढंग संभव करता है; चुना हुआ रूप हिन्दी में अधिक सहज है और अर्थ नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। उपलब्ध लैटिन की अपूर्णता को मुख्य पाठ में अनुमान से भरने के बजाय पाद-टिप्पणी में स्पष्ट किया गया है।
