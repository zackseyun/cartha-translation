review_pass:
  verdict: revise
  source_fidelity: ‘ante horas duas vel tres’ is correctly rendered as temporal priority (‘दो या तीन घंटे पहले’), not as a duration. However, ‘ventrem’ denotes the abdomen/womb area, and ‘गर्भ के चारों ओर’ is anatomically and idiomatically imprecise. ‘आने लगता है’ adds an inceptive nuance not required by ‘prodiente’.
  naturalness: The opening ‘गर्भवती स्त्री के नौवें महीने में’ is understandable but less natural than saying that the woman is in her ninth month. The revised wording is fluent modern standard Hindi while retaining the extended simile and its final comma.
  terminology: ‘प्रसव का समय’ and ‘प्रसव-पीड़ाएँ’ are suitable, dignified modern Hindi. ‘पेट’ appropriately represents the physical sense of Latin ‘venter’ in this childbirth image. The final pronoun follows the English audit trail’s construal; the compressed Latin syntax does not warrant doctrinal or interpretive expansion.
  issues:
  - severity: medium
    issue: ‘उसके गर्भ के चारों ओर प्रसव-पीड़ा उठती है’ renders ‘circum ventrem eius’ imprecisely and uses a singular pain with a plural-source expression.
    rationale: Latin ‘ventrem’ refers to the belly/womb region, not the fetus-containing गर्भ as such; ‘dolores’ is plural. ‘उसके पेट को ... घेर लेती हैं’ is both closer and natural.
  - severity: low
    issue: ‘शिशु गर्भ से बाहर आने लगता है’ introduces ‘begins to’.
    rationale: ‘Prodiente’ means the child coming/forthgoing; ‘बाहर निकलता है’ conveys this without adding an inceptive aspect.
  - severity: low
    issue: The initial phrase is slightly unnatural Hindi.
    rationale: ‘जब कोई गर्भवती स्त्री अपने नौवें महीने में होती है’ directly and idiomatically expresses pregnancy in the ninth month.
  revised_text: जैसे जब कोई गर्भवती स्त्री अपने नौवें महीने में होती है और उसके प्रसव का समय निकट आता है, तो दो या तीन घंटे पहले कराहने पर मजबूर करने वाली प्रसव-पीड़ाएँ उसके पेट को घेर लेती हैं; और जब शिशु गर्भ से बाहर निकलता है, तो वह एक क्षण भी देर नहीं करता,
