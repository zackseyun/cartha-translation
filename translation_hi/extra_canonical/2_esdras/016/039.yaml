  to: जैसे जब कोई गर्भवती स्त्री अपने नौवें महीने में होती है और उसके प्रसव का समय निकट आता है, तो दो या तीन घंटे पहले कराहने पर मजबूर करने वाली प्रसव-पीड़ाएँ उसके पेट को घेर लेती हैं; और जब शिशु गर्भ से बाहर निकलता है, तो वह एक क्षण भी देर नहीं करता,
