translation_notes:
  register: 'आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली। मूल की लंबी उपमात्मक वाक्य-रचना तथा अंत का अल्पविराम बनाए रखा गया है, क्योंकि पद अगले कथन की ओर बढ़ता है। कोई पादटिप्पणी आवश्यक नहीं: अंग्रेज़ी की पुरानी वैकल्पिक व्याख्या ‘दो या तीन घंटे तक’ लैटिन ante के अनुरूप नहीं है।'
