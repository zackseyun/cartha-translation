  text: quemadmodum praegnans in nono mense filium suum inadpropinquante hora partus eius, ante horas duas vel tres gementes dolores circum ventrem eius, et prodiente infante de ventre non tardabit uno puncto,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/039.yaml
  text: As when a pregnant woman in the ninth month[a], when the hour of her delivery draws near, two or three hours beforehand labor pains surround her womb, and when the child comes forth from the womb, it does not delay a single moment,
translation:
  language: hi
  text: जैसे जब कोई गर्भवती स्त्री अपने नौवें महीने में होती है और उसके प्रसव का समय निकट आता है, तो दो या तीन घंटे पहले कराहने पर मजबूर करने वाली प्रसव-पीड़ाएँ उसके पेट को घेर लेती हैं; और जब शिशु गर्भ से बाहर निकलता है, तो वह एक क्षण भी देर नहीं करता,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnans in nono mense
  choice: गर्भवती स्त्री के नौवें महीने में
  rationale: लैटिन के गर्भावस्था के नौवें महीने के स्पष्ट काल-संदर्भ को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: inadpropinquante hora partus eius
  choice: जब उसके प्रसव का समय निकट आता है
  rationale: शाब्दिक अर्थ ‘उसके प्रसव की घड़ी निकट आने पर’ है; ‘समय’ सामान्य हिन्दी में अधिक स्वाभाविक है।
- source_word: ante horas duas vel tres
  choice: दो या तीन घंटे पहले
  rationale: ante पूर्वता बताता है, अवधि नहीं; इसलिए ‘दो या तीन घंटे तक’ नहीं।
- source_word: gementes dolores circum ventrem eius
  choice: उसके गर्भ के चारों ओर प्रसव-पीड़ा उठती है
  rationale: पाठ प्रसव से जुड़ी कराह उत्पन्न करने वाली पीड़ाओं का वर्णन करता है। ventrem का मूल अर्थ पेट/गर्भ-प्रदेश हो सकता है; प्रसंग में ‘गर्भ’ सहज है।
- source_word: prodiente infante de ventre
  choice: जब शिशु गर्भ से बाहर आने लगता है
  rationale: वर्तमान कृदंत prodiente शिशु के बाहर आने की क्रिया को दर्शाता है; ‘आने लगता है’ हिन्दी में उस गतिशीलता को रखता है।
- source_word: non tardabit uno puncto
  choice: वह एक क्षण भी देर नहीं करता
  rationale: punctum यहाँ समय के अति सूक्ष्म बिंदु अर्थात क्षण का बोध देता है। भविष्यत् लैटिन को सामान्य उपमा की हिन्दी शैली में वर्तमानकाल से व्यक्त किया गया है।
