base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/036.yaml
  text: But hear these things and know them, servants of the Lord. Behold, the word of the Lord; receive it; do not disbelieve the things he speaks.
translation:
  language: hi
  text: तो इन बातों को सुनो और जान लो, प्रभु के दासो। देखो, प्रभु का वचन है; उसे[a] ग्रहण करो; जिन बातों की वह बात करता है, उन पर अविश्वास न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'लैटिन में ‘उसे’ के लिए पुल्लिंग सर्वनाम है, जबकि ‘वचन’ (verbum) नपुंसकलिंग है। इसलिए इसका संदर्भ व्याकरण की दृष्टि से स्पष्ट नहीं है: अर्थ के अनुसार यह ‘प्रभु के वचन’ की ओर संकेत कर सकता है, पर ‘प्रभु’ की ओर संकेत भी संभव है।'
    reason: eum के पूर्वपद की लैटिन व्याकरणिक अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: cognoscite
  choice: जान लो
  rationale: लैटिन क्रिया का मूल अर्थ ‘जानना/पहचानना’ है; यहाँ आज्ञार्थक ‘जान लो’ स्वाभाविक है और इसे केवल ‘समझो’ तक सीमित नहीं करता।
- source_word: serui domini
  choice: प्रभु के दासो
  rationale: serui स्वामित्व और अधीनता व्यक्त करता है। बाइबलीय हिन्दी में ‘प्रभु के दास’ गरिमापूर्ण और स्रोत के निकट है।
- source_word: Ecce uerbum domini
  choice: देखो, यह प्रभु का वचन है
  rationale: Ecce की ध्यान आकर्षित करने वाली शक्ति को ‘देखो’ से और संज्ञात्मक कथन को स्वाभाविक हिन्दी वाक्य से व्यक्त किया गया है।
- source_word: excipite
  choice: ग्रहण करो
  rationale: यहाँ अर्थ संदेश को स्वीकार करने का है; ‘ग्रहण करो’ औपचारिकता और बोधगम्यता दोनों बनाए रखता है।
- source_word: ne discredatis
  choice: अविश्वास न करो
  rationale: निषेधात्मक आशय को सीधे रखा गया है और स्रोत की विश्वास/अविश्वास संबंधी शब्दावली सुरक्षित है।
theological_decisions:
- issue: serui को ‘सेवक’ या ‘दास’ कहना
  choice: दास
  alternative: सेवक
  rationale: ‘दास’ लैटिन serui की अधीनता को अधिक स्पष्टता से बनाए रखता है, बिना किसी संप्रदायगत अर्थ को जोड़े।
- issue: eum का संदर्भ
  choice: इसे—अर्थात प्रभु के वचन को—ग्रहण करो
  alternative: उसे—अर्थात प्रभु को—ग्रहण करो
  rationale: वाक्य का निकटतम अर्थगत पूर्वपद ‘प्रभु का वचन’ है और परामर्श-पाठ भी यही समझता है; फिर भी लैटिन में सर्वनाम और verbum के व्याकरणिक लिंग का मेल न होने के कारण अस्पष्टता को पादटिप्पणी में बताया गया है।
- issue: अंतिम ‘वह’ का संदर्भ
  choice: सर्वनाम को अनिर्दिष्ट ही रखा गया
  alternative: स्पष्ट रूप से ‘प्रभु’ या ‘वचन’ जोड़ना
  rationale: लैटिन dicit का निहित कर्ता संदर्भ से प्रभु समझा जा सकता है, पर स्रोत उसे संज्ञा से दोहराता नहीं; हिन्दी ‘वह’ मूल की हल्की अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबलीय शैली रखी गई है। ‘दासो’, ‘वचन’, ‘ग्रहण करो’ और ‘अविश्वास न करो’ स्रोत के औपचारिक स्वर के अनुरूप हैं, जबकि वाक्यरचना साधारण पाठक के लिए स्पष्ट रखी गई है।
