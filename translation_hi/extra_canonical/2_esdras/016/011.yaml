lexical_decisions:
- source_word: tonabit
  choice: वह गरजेगा
  rationale: लातीनी क्रिया भविष्यकाल में गर्जन करने को व्यक्त करती है; ‘गरजेगा’ उसकी ध्वनि और भयकारी प्रभाव दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: horrebit
  choice: काँपेगा
  rationale: यहाँ भय से सिहरने या काँपने का भाव है; ‘काँपेगा’ प्रश्न की समानांतर और सहज अभिव्यक्ति है।
- source_word: Dominus
  choice: प्रभु
  rationale: ईश्वर के लिए प्रयुक्त पारंपरिक किंतु वर्तमान मानक हिन्दी में सुबोध संबोधन।
- source_word: comminabitur
  choice: धमकी देगा
  rationale: क्रिया का सीधा अर्थ धमकाना या धमकी देना है; स्रोत में इसके आगे किसी विशेष दंड या परिणाम का उल्लेख नहीं है।
theological_decisions:
- issue: गरजने वाले कर्ता की पहचान
  choice: ‘वह’ रखा गया
  alternative: ‘प्रभु गरजेगा’
  rationale: पहली क्रिया में लातीनी पाठ कर्ता को संज्ञा से स्पष्ट नहीं करता; अगले उपवाक्य में ‘प्रभु’ आता है। अनुवाद ने संभावित संबंध को खुला रखते हुए व्याकरणिक अस्पष्टता नहीं मिटाई।
- issue: खंडित अंतिम प्रश्न
  choice: ‘और कौन—’ के साथ अपूर्णता सुरक्षित रखी
  alternative: अगले संभावित विचार या दंड को जोड़कर वाक्य पूरा करना
  rationale: दिए गए स्रोत का अंत ‘et quis’ पर होता है। असमर्थित पूर्ति न करके पाठ की वास्तविक खंडित अवस्था दिखाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और काव्यात्मक प्रश्न-विन्यास रखा गया है। ‘गरजेगा’ और ‘काँपेगा’ ध्वन्यात्मक समानांतरता देते हैं; अंतिम दीर्घ विराम स्रोत की खंडित समाप्ति दर्शाता है।
