  text: the breath of God Almighty[a], who made all things and searches out hidden things in hidden places. Surely he knows your devising.
translation:
  language: hi
  text: सर्वशक्तिमान परमेश्वर का श्वास[a]—उस परमेश्वर का जिसने सब कुछ बनाया है और छिपे हुए स्थानों में छिपी बातों की छानबीन करता है। निश्चय ही वह तुम्हारी युक्ति जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘श्वास’ के लिए प्रयुक्त लातीनी शब्द जीवनदायी साँस या प्राण का भाव भी दे सकता है।
    reason: spiramentum की अर्थ-सीमा स्पष्ट करना, बिना इसे निश्चित रूप से ‘आत्मा’ ठहराए।
lexical_decisions:
- source_word: spiramentum
  choice: श्वास
  rationale: लातीनी शब्द का मूल अर्थ साँस या श्वास है; इसे ‘आत्मा’ कहना spiritus के साथ अनावश्यक समानता पैदा करता और अर्थ को अधिक निश्चित कर देता।
- source_word: scrutatur
  choice: छानबीन करता है
  rationale: यह केवल देखने नहीं, ध्यानपूर्वक जाँचने और खोज निकालने का भाव व्यक्त करता है।
- source_word: absconsa in absconsis
  choice: छिपे स्थानों में छिपी बातें
  rationale: मूल पाठ की जानबूझकर की गई पुनरुक्ति और स्थान-संबंधी अस्पष्टता को बनाए रखता है।
- source_word: adinuentionem
  choice: युक्ति
  rationale: एकवचन को सुरक्षित रखते हुए सोची या गढ़ी हुई योजना का भाव देता है, पर उसे अनिवार्य रूप से ‘षड्यंत्र’ जैसा दुष्ट नहीं ठहराता।
theological_decisions:
- issue: spiramentum का अर्थ
  choice: श्वास
  alternative: आत्मा
  rationale: यहाँ प्रयुक्त लातीनी शब्द साँस/जीवनदायी श्वास को अधिक सीधे व्यक्त करता है; ‘आत्मा’ अनुवाद संभावित अर्थ को अनुचित रूप से संकीर्ण कर सकता है।
- issue: पद का आरंभ व अंत
  choice: दिए गए लातीनी पद की खंडात्मक वाक्य-रचना और सीमाएँ बनाए रखी गईं
  alternative: पिछले पद का ‘और’ तथा अगले पद का ‘और जो तुम अपने हृदयों में सोचते हो’ जोड़ना
  rationale: वे शब्द इस पद के दिए गए मूल-पाठ में नहीं हैं और समीपवर्ती पदों से संबंधित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आरंभ मूल लातीनी की तरह एक वाक्यांश है, क्योंकि यह विचार पिछले पद से आगे बढ़ता है; पद-सीमा ठीक रखने के लिए आरंभ में ‘और’ नहीं जोड़ा गया।
