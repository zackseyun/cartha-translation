  text: Will there be anyone to extinguish him? He will flash forth, and who will not fear?
translation:
  language: hi
  text: क्या कोई है जो उसे बुझा सके? वह बिजली-सा चमकेगा, और कौन नहीं डरेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: extinguat
  choice: बुझा सके
  rationale: लैटिन क्रिया का मूल अर्थ आग या प्रकाश को बुझाना है; संभावनार्थक रूप को ‘सके’ से व्यक्त किया गया है।
- source_word: Coruscabit
  choice: बिजली-सा चमकेगा
  rationale: यह क्रिया तीव्र, कौंधते हुए प्रकाश का बोध कराती है; ‘बिजली-सा चमकेगा’ आधुनिक हिन्दी में उस दृश्य तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: timebit
  choice: डरेगा
  rationale: लैटिन का सीधा और सामान्य अर्थ ‘डरना’ है; अलंकारिक प्रश्न को यथावत रखा गया है।
theological_decisions:
- issue: eum और coruscabit के पुरुषवाचक संदर्भ की निरंतरता
  choice: दोनों के लिए ‘उसे/वह’
  alternative: इसे/यह या प्रसंग का कोई स्पष्ट संज्ञापद जोड़ना
  rationale: स्रोत में पुरुषवाचक सर्वनाम और निहित कर्ता हैं। संदर्भ को किसी विशिष्ट सत्ता या वस्तु के रूप में व्याख्यायित किए बिना वही अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। दोनों अलंकारिक प्रश्नों की शक्ति तथा स्रोत में निहित सर्वनाम-संदर्भ सुरक्षित रखा गया है।
