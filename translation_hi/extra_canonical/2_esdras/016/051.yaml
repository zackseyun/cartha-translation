id: 2ES.16.51
reference: 2 Esdras 16:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: zelatur fornicariam mulierem idonea et bona ualde, Sic zela bitur iusticia iniquitatem cum exornat se, et accusat eam in faciem, cum uenerit qui defendat exquirentem omnem peccatum super terram. Propterea nolite similari eam nec operibus eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/051.yaml
  text: As a respectable and very beautiful woman is indignant toward a prostitute[a], so righteousness will be indignant toward iniquity when it adorns itself, and will accuse it to its face when he comes who defends the one who searches out every sin upon the earth[b]. Therefore do not be like it or its works.
translation:
  language: hi
  text: जैसे एक प्रतिष्ठित और अत्यन्त सुन्दर स्त्री किसी वेश्या से रुष्ट होती है,[a] वैसे ही धार्मिकता दुष्टता पर उस समय रोष करेगी जब वह अपने को सजाती-सँवारती है; और जब वह आएगा जो पृथ्वी पर हर पाप की खोज करनेवाले का बचाव करता है, तब धार्मिकता दुष्टता के सामने उस पर आरोप लगाएगी।[b] इसलिए न उसके जैसी बनो, न उसके कामों के जैसी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह लैटिन वाक्य कठिन और बहुत संक्षिप्त है। चित्र सम्भवतः प्रतिष्ठित और अत्यन्त सुन्दर स्त्री तथा वेश्या के विरोध के द्वारा धार्मिकता और दुष्टता को व्यक्त करता है।
    reason: textual_variant
  - marker: b
    text: 'या, सर्वनामों को स्त्रीरूप व्यक्तिकरण के अनुसार स्पष्ट करते हुए: “...जब वह आएगा जो पृथ्वी पर हर पाप की खोज करनेवाले का बचाव करता है, तब वह उसके सामने उस पर आरोप लगाएगी।” “हर पाप की खोज करनेवाले का बचाव करता है” वाला वाक्यांश लैटिन में कठिन है; इसे आनेवाले व्यक्ति को ही पापों का खोजी मान लेना निश्चित नहीं है।'
    reason: translation_ambiguity
lexical_decisions:
- source_word: zelatur / zelabitur
  choice: रोष करती है / रोष करेगी
  rationale: लैटिन क्रिया ईर्ष्या, आक्रोश या तीव्र अप्रसन्नता व्यक्त कर सकती है; प्रसंग में नैतिक विरोध को दिखाने के लिए ‘रोष’ चुना गया, जबकि अस्पष्ट ईर्ष्याभाव नहीं जोड़ा गया।
- source_word: mulierem idonea et bona ualde
  choice: एक प्रतिष्ठित और अत्यन्त सुन्दर स्त्री
  rationale: दूषित और संक्षिप्त लैटिन पदावली में idonea सम्मानयोग्य/उपयुक्त और bona भली या सुन्दर का बोध करा सकती है; यहाँ तुलना की सामाजिक और दृश्य छवि को बनाए रखा गया है।
- source_word: fornicariam
  choice: वेश्या
  rationale: यह लैटिन संज्ञा यौन व्यवसाय या व्यभिचार से जुड़ी स्त्री को सीधे सूचित करती है; आधुनिक हिन्दी में ‘वेश्या’ स्पष्ट और संक्षिप्त है।
- source_word: iusticia
  choice: धार्मिकता
  rationale: यहाँ अमूर्त नैतिक सत्यनिष्ठा को व्यक्तित्व दिया गया है; ‘धार्मिकता’ बाइबिलीय और सहज हिन्दी में उस अर्थ को बनाए रखती है।
- source_word: iniquitatem
  choice: दुष्टता
  rationale: ‘अन्याय’ सम्भव है, पर सजने-सँवरने और दोष लगाए जाने की व्यक्तिकृत छवि में व्यापक नैतिक बुराई के लिए ‘दुष्टता’ अधिक स्वाभाविक है।
- source_word: exornat se
  choice: अपने को सजाती-सँवारती है
  rationale: लैटिन में स्वयं को अलंकृत करने का भाव है; दोहरी हिन्दी अभिव्यक्ति दिखावटी सजावट को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: accusat eam in faciem
  choice: उसके मुँह पर उस पर दोष लगाएगी
  rationale: खुले, आमने-सामने अभियोग का अर्थ सुरक्षित रखा गया है; इसे केवल ‘डाँटेगी’ कहकर कानूनी/अभियोगात्मक बल कम नहीं किया गया।
- source_word: nolite similari eam nec operibus eius
  choice: उसके या उसके कामों जैसे न बनो
  rationale: लैटिन की समानता वाली निषेधाज्ञा को संक्षिप्त आधुनिक हिन्दी में रखा गया है और कर्मों में सहभागिता जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: धार्मिकता और दुष्टता का स्त्रीरूप व्यक्तिकरण
  choice: हिन्दी व्याकरण के अनुसार दोनों के लिए स्त्रीलिंग सर्वनाम और क्रियाएँ रखी गईं
  alternative: दुष्टता को नपुंसक भाव में ‘वह वस्तु/यह’ जैसे शब्दों से व्यक्त करना
  rationale: लैटिन में iusticia और iniquitas स्त्रीलिंग हैं और स्त्री-छवि के साथ तुलना होती है; हिन्दी में भी ‘धार्मिकता’ और ‘दुष्टता’ स्त्रीलिंग होने से व्यक्तिकरण स्वाभाविक रूप से सुरक्षित रहता है।
- issue: qui defendat exquirentem का संबंध
  choice: ‘वह आएगा जो ... खोज करनेवाले की रक्षा करता है’
  alternative: ‘वह दिव्य जाँचकर्ता आएगा जो पृथ्वी के हर पाप को खोजता है’
  rationale: लैटिन व्याकरण सतही रूप से आनेवाले व्यक्ति और पाप खोजनेवाले व्यक्ति के बीच रक्षा का संबंध बताता है। कठिन पाठ को धर्मवैज्ञानिक अनुमान से एक ही दिव्य जाँचकर्ता में विलीन नहीं किया गया।
- issue: अंतिम सर्वनाम का संकेत
  choice: ‘उसके’ को निकटतम व्यक्तिकृत ‘दुष्टता’ की ओर संकेत करने दिया गया
  alternative: ‘दुष्टता या उसके कामों जैसे न बनो’ कहकर संकेत को पूर्णतः स्पष्ट करना
  rationale: मूल में सर्वनाम है; मुख्य संभावित संकेत स्पष्ट रहते हुए उसकी औपचारिक अनिश्चितता को अनावश्यक रूप से समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। ‘रोष’, ‘धार्मिकता’, ‘दुष्टता’ और ‘दोष लगाएगी’ जैसे शब्द नैतिक तथा न्यायिक गंभीरता बनाए रखते हैं। मूल लैटिन की असामान्य रचना को मुख्य पाठ में यथासम्भव सुरक्षित रखते हुए कठिनाइयों को पादटिप्पणियों में बताया गया है।
