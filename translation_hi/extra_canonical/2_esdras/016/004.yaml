  text: Fire has been sent upon you, and who is there to quench it?
translation:
  language: hi
  text: तुम पर आग भेजी गई है—कौन है जो उसे बुझा सके?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uobis
  choice: तुम पर
  rationale: लैटिन बहुवचन संबोधन को सीधे और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ignis
  choice: आग
  rationale: लैटिन में बिना अनिश्चित उपपद के आए सामान्य तथा न्यायसूचक बिंब को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: extinguat
  choice: बुझा सके
  rationale: 'मूल के संभावनार्थक प्रश्न का भाव सुरक्षित रखता है: चुनौती यह है कि इसे बुझाने में कौन समर्थ है।'
- source_word: Inmissa sunt
  choice: भेजी गई है
  rationale: उपलब्ध पाठखंड में पद-सीमा पर दिखाई देने वाला रूप असंगत/खंडित है; संदर्भ और परामर्श-पाठ के अनुरूप ignis के साथ निष्क्रिय भाव रखा गया है, बिना किसी प्रेषक का नाम जोड़े।
theological_decisions:
- issue: आग भेजने वाले की पहचान
  choice: 'निष्क्रिय वाक्य रखा गया: “भेजी गई है”'
  alternative: “परमेश्वर ने आग भेजी है”
  rationale: मूल वाक्य प्रेषक का स्पष्ट नाम नहीं लेता; उसे जोड़ने से निहित अर्थ को अनावश्यक रूप से निश्चित कर दिया जाता।
- issue: अलंकारिक प्रश्न में सामर्थ्य का भाव
  choice: “कौन है जो उसे बुझा सके?”
  alternative: “कौन उसे बुझाएगा?”
  rationale: यह प्रश्न केवल भविष्य की क्रिया नहीं, बल्कि बुझाने की असमर्थता को रेखांकित करता है; इसलिए संभावनार्थक रूप अधिक उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। डैश न्याय-घोषणा और उसके बाद आने वाली अलंकारिक चुनौती के बीच स्वाभाविक बल देता है।
