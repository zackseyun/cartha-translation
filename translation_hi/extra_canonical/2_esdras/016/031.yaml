  text: or as in a harvested vineyard an exposed cluster remains from those who carefully search the vintage,[a]
translation:
  language: hi
  text: या जैसे अंगूर की कटाई हो चुकी बारी में, एक खुला पड़ा अंगूर का गुच्छा उन लोगों से बचा रह जाता है जो कटाई की उपज को ध्यान से खोजते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अंगूर की कटाई के बाद बारी में एक खुला पड़ा गुच्छा उन लोगों से बचा रह जाता है जो कटाई की उपज को ध्यान से खोजते हैं।’
    reason: vindemiata को समयसूचक वाक्यांश (‘कटाई के बाद’) के रूप में व्यक्त करने वाला वैकल्पिक हिन्दी रूप; racemus का एकवचन, patens का ‘खुला पड़ा,’ और scrutantibus ... diligenter का स्पष्ट कर्तृ-संबंध बनाए रखता है।
lexical_decisions:
- source_word: vinea vindemiata
  choice: अंगूरों की कटाई हो चुकी बारी
  rationale: यह पूर्ण हो चुकी कटाई का भाव बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: subremanet
  choice: बचा रह जाता है
  rationale: क्रिया के ‘शेष रह जाने’ के अर्थ को सीधे व्यक्त करता है।
- source_word: racemus
  choice: एक ... गुच्छा
  rationale: लैटिन के एकवचन को सुरक्षित रखता है।
- source_word: patens
  choice: खुला पड़ा
  rationale: ‘खुला, प्रकट, दिखाई देता हुआ’ अर्थ को बनाए रखता है; इससे सावधानी से खोजे जाने के बावजूद गुच्छे के बचे रहने का मूल तनाव भी बना रहता है।
- source_word: scrutantibus vindemiam diligenter
  choice: अंगूर की उपज को ध्यान से खोजनेवालों से
  rationale: vindemiam को vineam (‘बारी’) न मानकर कटाई की उपज के अर्थ में लिया गया है और diligenter का सावधानीपूर्ण खोज से संबंध रखा गया है।
