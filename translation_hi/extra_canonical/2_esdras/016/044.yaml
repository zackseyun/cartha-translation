review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders seminat, metat, putat, and vindemiare in their agricultural/viticultural senses. However, its phrasing “फसल काटने वाला न हो” and “अंगूर इकट्ठे करने वाला न हो” turns the Latin comparative expectation into an unnatural description of a person rather than the expected future action. The revised wording retains the source’s “as though [he] will not …” force.
  naturalness: “वह ऐसे बोए/करे” is understandable, but “इस तरह ... मानो वह ... न करेगा” is more idiomatic modern Hindi and makes the parallelism clear. “अंगूर की कटनी” is a natural concise equivalent for grape harvest.
  terminology: “दाखलताओं की छँटाई” accurately conveys putat in this viticultural context. “कटनी” and “अंगूर की कटनी” retain the agricultural register without adding interpretation.
  issues:
  - severity: medium
    issue: Comparative clauses are expressed as nominal descriptions.
    rationale: “मानो फसल काटने वाला न हो” and “मानो अंगूर इकट्ठे करने वाला न हो” do not naturally express the source’s sense that the sower/pruner acts as if he will not reap/harvest. Recasting them as future actions preserves the intended comparison.
  revised_text: और जो बोता है, वह इस तरह बोए मानो वह कटनी न करेगा; इसी तरह जो दाखलताओं की छँटाई करता है, वह इस तरह करे मानो वह अंगूर की कटनी न करेगा।
  revised_footnotes: []
  revision_rationale: The revision preserves the two supplied clauses and their agricultural imagery while replacing awkward agent-noun constructions with natural Hindi future-action comparisons corresponding to non metat and non uindemiaturus.
