translation:
  language: hi
  text: और जो बोता है, वह इस तरह बोए मानो वह कटनी न करेगा; इसी तरह जो दाखलताओं की छँटाई करता है, वह इस तरह करे मानो वह अंगूर की कटनी न करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminat
  choice: बोता है
  rationale: लातीनी क्रिया का सीधा और स्वाभाविक हिन्दी प्रतिरूप; कृषि-संदर्भ स्पष्ट रहता है।
- source_word: metat
  choice: फसल काटने वाला
  rationale: कटनी करने के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: putat
  choice: दाखलताओं की छँटाई करता है
  rationale: यहाँ putare का कृषिगत अर्थ बेलों को छाँटना है; केवल ‘छाँटता है’ कहने की अपेक्षा कर्म स्पष्ट किया गया है।
- source_word: uindemiaturus
  choice: अंगूर इकट्ठे करने वाला
  rationale: vindemiare दाख की उपज बटोरने/अंगूर की कटनी करने को दर्शाता है; सहज हिन्दी में ‘अंगूर इकट्ठे करना’ चुना गया।
