lexical_decisions:
- source_word: sic
  choice: इसलिए
  rationale: यह पिछले संदर्भ से निष्कर्ष अथवा निर्देश की कड़ी व्यक्त करता है; हिन्दी में ‘इसलिए’ स्वाभाविक है।
- source_word: aduenae terrae
  choice: इस देश में परदेशियों
  rationale: aduenae अस्थायी रूप से रहनेवाले बाहरी लोगों को दर्शाता है। संबंधवाचक लैटिन रूप का स्वाभाविक हिन्दी रूप ‘इस देश में परदेशियों’ रखा गया है।
- source_word: Qui uendit
  choice: जो बेचता है
  rationale: स्रोत के सामान्य और अनिश्चित कर्ता को सीधे बनाए रखता है।
- source_word: quasi qui fugiet
  choice: ऐसे रहे मानो भाग जानेवाला हो
  rationale: quasi की तुलना और fugiet के भविष्य-बोध—आगामी पलायन—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
