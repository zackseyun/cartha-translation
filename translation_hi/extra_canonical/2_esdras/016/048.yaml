  yaml_path: translation/extra_canonical/2_esdras/016/048.yaml
  text: And those who conduct business do so for plunder[a], as long as they adorn themselves;
translation:
  language: hi
  text: और जो लोग व्यापार करते हैं, वे लूट के लिए[a] व्यापार करते हैं, जब तक वे सजाते-सँवारते रहते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो लोग व्यापार करते हैं, उनका व्यापार लूट का माल बनता है।”
    reason: लैटिन ‘in rapina’ संक्षिप्त और अर्थगत रूप से अस्पष्ट है; संदर्भ में यह व्यापार के लूटे जाने की ओर संकेत कर सकता है, न कि व्यापारियों द्वारा लूट करने की ओर।
  - marker: b
    text: लैटिन में यह नहीं बताया गया कि वे किसे या किस वस्तु को सजाते-सँवारते हैं।
    reason: मूल पाठ में ‘exornant’ का कर्म नहीं दिया गया; इसलिए ‘अपने को’ जैसे किसी विशेष कर्म को मुख्य पाठ में नहीं जोड़ा गया।
lexical_decisions:
- source_word: negociantur
  choice: व्यापार करते हैं
  rationale: लैटिन क्रिया का सीधा और आधुनिक हिन्दी समतुल्य; इसकी पुनरावृत्ति मूल वाक्य की जोरदार संरचना को बनाए रखती है।
- source_word: in rapina
  choice: लूट के लिए
  rationale: यह वाक्यांश व्यापार और आसन्न लूट के संबंध को बनाए रखता है, बिना यह अनावश्यक रूप से तय किए कि व्यापारी स्वयं लुटेरे हैं या उनका व्यापार लूट का माल बन जाएगा।
- source_word: quamdiu
  choice: जब तक
  rationale: अवधि अथवा जारी परिस्थिति का मूल अर्थ सुरक्षित रखता है।
- source_word: exornant
  choice: सजाते-सँवारते रहते हैं
  rationale: क्रिया के अलंकरण/सजाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; लैटिन में कर्म न होने के कारण मुख्य पाठ में कोई कर्म नहीं जोड़ा गया।
theological_decisions:
- issue: व्यापारियों और लूट का संबंध
  choice: लूट के लिए व्यापार करते हैं
  alternative: व्यापार करते हैं, पर उनका व्यापार लूट लिया जाएगा
  rationale: वैकल्पिक पाठ संदर्भगत अर्थ को स्पष्ट करता है, पर लैटिन में निष्क्रिय भविष्यवाचक शब्द नहीं हैं; इसलिए मूल की संक्षिप्तता और तनाव बनाए रखा गया।
- issue: exornant का निहित कर्म
  choice: कर्म को अनिर्दिष्ट रखा गया
  alternative: अपने को सजाते-सँवारते हैं
  rationale: लैटिन क्रिया बहुवचन कर्तृवाच्य है, पर इस उद्धृत पाठ में उसका कर्म व्यक्त नहीं है; ‘अपने को’ जोड़ने से अस्पष्टता अनावश्यक रूप से समाप्त हो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की पुनरावृत्ति तथा दोनों वास्तविक अस्पष्टताएँ—लूट का संबंध और सजाने का कर्म—सुरक्षित रखी गई हैं।
