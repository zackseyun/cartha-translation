  text: By his word the stars were established, and he knows the number of the stars.
translation:
  language: hi
  text: उसके वचन से तारे स्थापित हुए हैं, और वह तारों की संख्या जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sunt
  choice: स्थापित हुए हैं
  rationale: उपलब्ध लैटिन अंश का आरम्भ पिछले पदांश के अंत में केवल ‘sunt’ से होता है; परामर्श-पाठ में सुरक्षित पूर्ण आशय के अनुसार इसे स्वाभाविक हिन्दी में पूरा किया गया है।
- source_word: novit
  choice: जानता है
  rationale: लैटिन क्रिया पूर्ण और प्रत्यक्ष ज्ञान व्यक्त करती है; सामान्य वर्तमानकालीन हिन्दी इसका स्वाभाविक रूप है।
- source_word: numerum stellarum
  choice: तारों की संख्या
  rationale: लैटिन संबंधवाचक पदबंध का सीधा और सहज हिन्दी रूप।
theological_decisions:
- issue: तारों का परमेश्वर के वचन से स्थापित होना
  choice: उसके वचन से तारे स्थापित हुए हैं
  alternative: उसके वचन से तारे बनाए गए हैं
  rationale: ‘स्थापित’ सृष्टि के साथ-साथ व्यवस्थित और स्थिर किए जाने का भाव बनाए रखता है तथा परामर्श-पाठ के अर्थ के निकट है; ‘बनाए गए’ अर्थ को अनावश्यक रूप से केवल उत्पत्ति तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी; वाक्य की समानांतर संरचना और ईश्वर के ज्ञान पर दिए गए बल को बनाए रखा गया है।
