  text: 'omnia opera hominis et adinuentiones illorum et cogitatum illorum et corda illorum. Qui dixit: fiat terra, et facta est :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/055.yaml
  text: all the works of men and their devices and their thoughts and their hearts. He who said[a], “Let the earth be made,” and it was made;
translation:
  language: hi
  text: मनुष्यों के सब कामों, उनकी युक्तियों, उनके विचारों और उनके हृदयों को।[a] उसी ने कहा, “पृथ्वी बन जाए,” और वह बन गई;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, प्रभु मनुष्यों के सब कामों, उनकी युक्तियों, उनके विचारों और उनके हृदयों को जानता है।”
    reason: अंग्रेज़ी POB audit trail में दर्ज पूर्ववर्ती पद-सीमा वाला वैकल्पिक अनुवाद। वर्तमान लातीनी स्रोत-खंड के अनुसार यह वाक्यांश इस पद के मुख्य पाठ में नहीं जोड़ा गया है।
lexical_decisions:
- source_word: opera hominis
  choice: मनुष्यों के सब कामों
  rationale: लातीनी पद का सीधा और स्वाभाविक बहुवचन अर्थ; यहाँ hominis सामूहिक अर्थ में मानवजाति को सूचित करता है।
- source_word: adinventiones illorum
  choice: उनकी युक्तियों
  rationale: adinventiones योजनाओं, उपायों या गढ़ी हुई युक्तियों का बोध कराता है; ‘युक्तियाँ’ संदर्भ की नैतिक अस्पष्टता बनाए रखता है।
- source_word: cogitatum illorum
  choice: उनके विचारों
  rationale: स्रोत में रूप असामान्य है, पर आशय मनुष्यों के विचार/चिंतन हैं; आधुनिक हिन्दी में ‘विचारों’ सहज है।
- source_word: corda illorum
  choice: उनके हृदयों
  rationale: बाइबलीय मानव-अंतरंग के अर्थ को बनाए रखने के लिए ‘हृदय’ चुना गया, न कि व्याख्यात्मक ‘मन’।
- source_word: Qui dixit
  choice: उसी ने कहा
  rationale: संबंधवाचक वाक्यांश पूर्ववर्ती प्रसंग के प्रभु की ओर संकेत करता है; ‘उसी ने’ हिन्दी में खंडित पद-सीमा के भीतर संबंध स्पष्ट करता है, बिना नया कर्ता जोड़ने के।
- source_word: fiat terra
  choice: पृथ्वी बन जाए
  rationale: लातीनी आज्ञार्थक/इच्छार्थक fiat को स्वाभाविक हिन्दी में इच्छार्थक रूप से व्यक्त किया गया है।
- source_word: facta est
  choice: वह बन गई
  rationale: fiat के शब्दगत प्रतिध्वनि को बनाए रखते हुए पृथ्वी के अस्तित्व में आ जाने को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: वचन की शुरुआत पिछले पद से जुड़ी हुई है
  choice: 'आरंभ को कर्मकारक खंड के रूप में रखा: ‘मनुष्यों के सब कामों ... उनके हृदयों को।’'
  alternative: ‘देखो, प्रभु जानता है’ जोड़कर पूर्ण वाक्य बनाना
  rationale: Ecce dominus cognoscit पिछले स्रोत-खंड में है। इस पद की निर्धारित सीमा का सम्मान करते हुए उसे यहाँ दोहराया नहीं गया, भले ही हिन्दी में आरंभ जानबूझकर पिछले पद पर निर्भर रहता है।
- issue: Qui का कर्ता
  choice: ‘उसी ने’
  alternative: ‘वह जो’ या स्पष्ट रूप से ‘प्रभु ने’
  rationale: संदर्भगत दैवी कर्ता बना रहता है, पर स्रोत में इस खंड पर अनुपस्थित ‘प्रभु’ को फिर से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। पद की स्रोत-निर्धारित सीमा के कारण आरंभ पिछले पद के क्रियापद पर निर्भर है। अंत का अर्धविराम अगले पद से निरंतरता दिखाता है।
