  text: No farmer will be left to till the earth and to sow it[a].
translation:
  language: hi
  text: ऐसा कोई किसान नहीं बचेगा, जो भूमि को जोते और उसमें बीज बोए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि को जोतने और उसमें बीज बोने वाला कोई नहीं बचेगा।”
    reason: लातीनी वाक्य की निषेधात्मक संबंधवाचक रचना को हिन्दी में सामान्यीकृत रूप में भी समझा जा सकता है; मुख्य पाठ agricola के विशिष्ट अर्थ ‘किसान’ को स्पष्ट रूप से बनाए रखता है।
lexical_decisions:
- source_word: agricola
  choice: किसान
  rationale: लातीनी शब्द का अर्थ विशेष रूप से ‘किसान/खेती करने वाला’ है; इसलिए सामान्य ‘कोई व्यक्ति’ के बजाय ‘किसान’ रखा गया है।
- source_word: colit terram
  choice: भूमि को जोते
  rationale: खेती के संदर्भ में colere terram का स्वाभाविक हिन्दी अर्थ ‘भूमि जोतना/खेती करना’ है; ‘जोते’ संक्षिप्त और सामान्य पाठक के लिए स्पष्ट है।
- source_word: seminat eam
  choice: उसमें बीज बोए
  rationale: लातीनी सर्वनाम eam का संबंध terram से है। हिन्दी में भूमि के लिए ‘उसे बोए’ अस्वाभाविक होता, इसलिए अर्थ को स्पष्ट करते हुए ‘उसमें बीज बोए’ चुना गया है।
