source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: peccata uestra, nec supereleuent iniquitates uestrae. Vae qui constringuntur a peccatis suis et obteguntur ab iniquitatibus suis, quemadmodum ager constringitur a silua et spinis tegitur semina eius, per quem non transit homo, et excluditur et mittitur ad deuorationem ignis.
