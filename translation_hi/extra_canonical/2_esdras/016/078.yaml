base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/078.yaml
  text: your sins[a], nor let your iniquities prevail over you. Woe to those who are bound fast by their sins and covered over by their iniquities, just as a field is hemmed in by a forest and its seed is covered by thorns, through which no man passes; it is shut off and given over to be devoured by fire.
translation:
  language: hi
  text: तुम्हारे पाप[a]—और तुम्हारे अधर्म तुम पर हावी न हों। धिक्कार है उन लोगों पर जो अपने पापों से कसकर जकड़े हुए और अपने अधर्मों से ढके हुए हैं! वे उस खेत के समान हैं जो वन से घिरा हो और जिसका बीज काँटों से ढका हो; उसमें से होकर कोई मनुष्य नहीं जाता। वह बंद कर दिया जाता है और आग से भस्म किए जाने के लिए सौंप दिया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद पिछले पद से चले आ रहे वाक्य के बीच में आरंभ होता है; इसलिए आरंभिक शब्द अपने आप में पूरा वाक्य नहीं बनाते।
    reason: verse_boundary
lexical_decisions:
- source_word: supereleuent
  choice: हावी हों
  rationale: क्रिया में ऊपर उठने या प्रबल हो जाने का भाव है; प्रसंग में ‘हावी होना’ स्वाभाविक हिन्दी में पाप के प्रभुत्व को व्यक्त करता है।
- source_word: constringuntur
  choice: कसकर जकड़े हुए
  rationale: बंधन और कसे होने—दोनों भावों को बनाए रखता है।
- source_word: obteguntur
  choice: ढके हुए
  rationale: लैटिन रूपक को सीधे और स्पष्ट रूप में सुरक्षित रखता है।
- source_word: ager constringitur a silua
  choice: खेत ... वन से घिरा हो
  rationale: शाब्दिक ‘वन से जकड़ा’ हिन्दी में अस्वाभाविक है; ‘घिरा’ खेत की दुर्गम अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: semina eius
  choice: जिसका बीज
  rationale: लैटिन बहुवचन रूप यहाँ सामूहिक अर्थ में है; हिन्दी में ‘बीज’ सामूहिक रूप से सहज है।
- source_word: ad deuorationem ignis
  choice: आग के हवाले ... कि वह उसे भस्म कर दे
  rationale: आग द्वारा निगल लिए जाने की तीव्र छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: पाप और अधर्म को बाँधने तथा ढकने वाली शक्तियों के रूप में चित्रित करना
  choice: व्यक्तिवाचक रूपक को यथावत रखा गया
  alternative: इसे केवल दोष या दंड के अमूर्त कथन के रूप में सरल करना
  rationale: मूल पाठ मनुष्य को अपने पापों से जकड़ा और अधर्मों से ढका हुआ बताता है; इस नैतिक और न्याय-संबंधी तनाव को हल्का नहीं किया गया।
- issue: आरंभिक खंड का पिछले पद से व्याकरणिक संबंध
  choice: खंडित आरंभ को डैश और पादटिप्पणी सहित सुरक्षित रखा गया
  alternative: पिछले पद से अनुमानित क्रिया जोड़कर पूरा स्वतंत्र वाक्य बनाना
  rationale: दिए गए लैटिन पद की सीमा वाक्य के बीच में आरंभ होती है; अनुपस्थित शब्द जोड़ना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘धिक्कार’, ‘जकड़े’, ‘हावी’ और ‘भस्म’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य हैं और मूल की गंभीर चेतावनी तथा कृषि-अग्नि रूपक को बनाए रखते हैं।
