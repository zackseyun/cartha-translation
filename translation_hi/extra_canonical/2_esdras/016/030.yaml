translation:
  language: hi
  text: जैसे जैतून के बाग में तीन या चार जैतून बचे रह जाते हैं,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quemadmodum
  choice: जैसे
  rationale: यह उपमा का स्वाभाविक और सटीक हिन्दी संकेत है।
- source_word: in oliveto
  choice: जैतून के बाग में
  rationale: लैटिन पद पूरे जैतून के बाग को दर्शाता है; इसमें ‘हर पेड़ पर’ नहीं कहा गया है।
- source_word: tres vel quattuor olivae
  choice: तीन या चार जैतून
  rationale: संख्या और विकल्पसूचक ‘या’ को सीधे सुरक्षित रखा गया है।
- source_word: relinquentur
  choice: बचे रह जाते हैं
  rationale: निष्क्रिय भाव को सहज आधुनिक हिन्दी में व्यक्त करता है और अत्यल्प अवशेष का बोध बनाए रखता है।
theological_decisions:
- issue: अत्यन्त अभाव को व्यक्त करने वाली प्रलय-संबंधी उपमा
  choice: पूरे बाग में केवल तीन या चार जैतून बचे होने का स्रोत-संगत अर्थ बनाए रखा गया
  alternative: ‘हर पेड़ पर’ तीन या चार जैतून जोड़ना
  rationale: ‘हर पेड़ पर’ लैटिन स्रोत में नहीं है और उसे जोड़ने से उपमा में निहित भीषण अभाव कम हो जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के संक्षिप्त उपमात्मक रूप के निकट। पद के अगले अंश से जुड़ाव दिखाने के लिए अंत में अल्पविराम रखा गया है।
