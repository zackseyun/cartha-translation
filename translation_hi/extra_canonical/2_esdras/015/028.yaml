translation:
  language: hi
  text: देखो, एक भयानक दर्शन! उसका मुख पूर्व दिशा से है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले लैटिन उद्गार का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: visio horribilis
  choice: एक भयानक दर्शन
  rationale: visio के लिए ‘दर्शन’ और horribilis के लिए ‘भयानक’ मूल अर्थ और भविष्यदर्शी संदर्भ दोनों को बनाए रखते हैं।
- source_word: facies illius
  choice: उसका मुख
  rationale: facies का सीधा अर्थ ‘मुख’ है; इसे केवल ‘रूप’ या ‘दिखाई देना’ कहने से मूल की सजीव और कुछ हद तक रहस्यमय अभिव्यक्ति कम हो जाती।
- source_word: ab oriente
  choice: पूर्व की ओर से
  rationale: ab स्रोत अथवा दिशा का बोध करा सकता है; ‘पूर्व की ओर से’ इस अस्पष्टता को अनावश्यक रूप से नहीं मिटाता।
theological_decisions:
- issue: दर्शन के ‘मुख’ और पूर्व से उसके संबंध की अस्पष्ट छवि
  choice: उसका मुख पूर्व की ओर से है
  alternative: उसका मुख पूर्व की ओर है / उसका रूप पूर्व से प्रकट होता है
  rationale: मूल पाठ असामान्य ढंग से facies और ab oriente को जोड़ता है। चुना गया रूप दिशा और उद्गम के बीच की वास्तविक अस्पष्टता को सुरक्षित रखता है और व्याख्यात्मक विस्तार से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, भविष्यदर्शी और गरिमापूर्ण शैली। विस्मयादिबोधक चिह्न प्रारंभिक उद्घोष और उसके बाद आने वाली छवि को स्वाभाविक हिन्दी में अलग करता है।
