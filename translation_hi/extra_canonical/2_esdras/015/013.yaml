base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/013.yaml
  text: Let those who cultivate the land mourn, because their seed will fail, and their trees will be laid waste by blight and hail and by a dreadful star.
translation:
  language: hi
  text: भूमि की खेती करनेवाले लोग विलाप करें, क्योंकि उनकी बुवाई निष्फल हो जाएगी, और उनके पेड़ झुलसा रोग, ओलों और एक भयंकर तारे से उजाड़ दिए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cultores operantes terram
  choice: जो लोग भूमि जोतते हैं
  rationale: यह पदबंध भूमि पर खेती करनेवालों को दर्शाता है। यह अनावश्यक पुनरुक्ति के बिना मूल के ‘cultores’ और ‘operantes terram’ दोनों भावों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: deficient semina eorum
  choice: उनके बीज नष्ट हो जाएँगे
  rationale: ‘deficient’ के विफल होने अथवा न रह जाने के भाव को खेती के संदर्भ में सहज रूप से व्यक्त किया गया है; इसका अर्थ केवल अंकुरण न होना नहीं ठहराया गया।
- source_word: ligna eorum
  choice: उनके पेड़
  rationale: इस कृषि-संदर्भ में ‘ligna’ का अर्थ लकड़ी की वस्तुओं के बजाय पेड़ लेना अधिक स्वाभाविक है।
- source_word: uredine
  choice: झुलसा रोग
  rationale: लैटिन शब्द फसल या वृक्ष को झुलसाकर नष्ट करनेवाले रोग अथवा तुषार-सदृश क्षति का संकेत दे सकता है। ‘झुलसा रोग’ कृषि-संदर्भ में स्पष्ट है और किसी अत्यधिक विशिष्ट रोग की पहचान नहीं थोपता।
- source_word: sidus terribile
  choice: एक भयंकर तारे
  rationale: मूल के आकाशीय ‘sidus’ और उसके भयावह स्वरूप को सीधे रखा गया है; इसे उल्का, धूमकेतु या अन्य विशिष्ट खगोलीय घटना नहीं बनाया गया।
theological_decisions:
- issue: ‘भयंकर तारे’ की पहचान
  choice: इसे अनिर्दिष्ट आकाशीय चिन्ह के रूप में ‘एक भयंकर तारा’ रखा गया
  alternative: इसे धूमकेतु, उल्का या किसी प्रतीकात्मक शक्ति के रूप में स्पष्ट करना
  rationale: मूल पाठ स्वयं इसकी पहचान नहीं करता; अतः उसकी वास्तविक अस्पष्टता और प्रलयकारी तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विलाप करें’ भविष्यवाणी-संबंधी गंभीरता बनाए रखता है, जबकि ‘भूमि जोतते हैं’ कृषि-कर्म को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
