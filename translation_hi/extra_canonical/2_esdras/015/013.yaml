review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the summons to mourn, the agricultural setting, the three agents of devastation, and the deliberately unspecified dreadful celestial phenomenon. However, “बीज नष्ट हो जाएँगे” makes deficient semina sound like physical destruction, whereas the source more directly conveys failed seed/sowing.
  naturalness: The wording is generally clear and appropriately grave. “भूमि की खेती करनेवाले” is more idiomatic and encompasses both cultivating and working the land without narrowing the action to plowing alone. “बुवाई निष्फल हो जाएगी” is natural agricultural Hindi.
  terminology: “झुलसा रोग” is a suitable non-overly-specific rendering of uredine in this context. “एक भयंकर तारे” preserves sidus terribile without identifying it as a comet or meteor. “पेड़” is appropriate for ligna in this agricultural context.
  issues:
  - severity: medium
    issue: “उनके बीज नष्ट हो जाएँगे” overstates deficient semina.
    rationale: Deficient here denotes that the seed will fail, rather than explicitly that it will be destroyed. Rendering it as failed sowing retains the agricultural consequence without adding a mechanism of destruction.
  - severity: low
    issue: “भूमि जोतते हैं” narrows the agricultural activity.
    rationale: The Latin identifies cultivators who work the land; “भूमि की खेती करनेवाले” more fully and naturally represents this description.
  revised_text: भूमि की खेती करनेवाले लोग विलाप करें, क्योंकि उनकी बुवाई निष्फल हो जाएगी, और उनके पेड़ झुलसा रोग, ओलों और एक भयंकर तारे से उजाड़ दिए जाएँगे।
  revised_footnotes: []
  revision_rationale: The revision more closely reflects the source’s description of land cultivators and its statement that their seed will fail. It retains the source’s ominous but undefined celestial reference and the formal prophetic register.
