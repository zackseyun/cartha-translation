translation:
  language: hi
  text: और वे लूट का माल पाएँगे और तेरे मुख की शोभा को मिटा देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praeda habebunt
  choice: वे लूट का माल पाएँगे
  rationale: लातीनी पदबंध का सीधा अर्थ ‘वे लूट/लूटा हुआ माल प्राप्त करेंगे’ है। ‘लूट का माल’ आधुनिक हिन्दी में आशय स्पष्ट करता है और मूल में उपस्थित, पहले छूट चुके पदबंध को सुरक्षित रखता है।
- source_word: gloriam faciei tuae
  choice: तेरे मुख की शोभा
  rationale: gloria यहाँ मुख की दिखाई देने वाली शोभा, गरिमा या तेज का संकेत दे सकता है। ‘शोभा’ स्वाभाविक हिन्दी है और केवल धार्मिक ‘महिमा’ तक अर्थ को सीमित नहीं करती।
- source_word: exterminabunt
  choice: मिटा देंगे
  rationale: क्रिया का अर्थ नष्ट कर देना या पूरी तरह समाप्त कर देना है। ‘मिटा देंगे’ मुख की शोभा के साथ स्वाभाविक बैठता है और विनाश की तीव्रता बनाए रखता है।
theological_decisions:
- issue: ‘मुख की महिमा/शोभा’ का आशय
  choice: शोभा
  alternative: महिमा
  rationale: संदर्भ के अभाव में पदबंध रूप-सौंदर्य, प्रतिष्ठा या तेज—एक से अधिक अर्थ दे सकता है। ‘शोभा’ दृश्य और गरिमामय दोनों अर्थों के लिए खुला रहता है तथा कोई अतिरिक्त धर्मवैज्ञानिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, dignified और मूल लातीनी वाक्य-संरचना के निकट। एकवचन संबोधन के अनुरूप ‘तेरे’ रखा गया है।
