  yaml_path: translation/extra_canonical/2_esdras/015/011.yaml
  text: but I will lead them out with a mighty hand and an uplifted arm, and I will strike Egypt with plagues as before, and I will destroy all its land.
translation:
  language: hi
  text: परन्तु मैं शक्तिशाली हाथ और ऊँची उठी भुजा से उसे बाहर निकाल लाऊँगा। मैं मिस्र पर पहले की तरह विपत्ति[a] डालूँगा और उसकी सारी भूमि को नष्ट कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: प्रहार। लातीनी शब्द एकवचन में है, पर यहाँ इसका सामूहिक अर्थ भी हो सकता है—‘विपत्तियाँ’।'
    reason: मूल शब्द plaga की अर्थ-सीमा और व्याकरणिक एकवचन को सुरक्षित रखते हुए प्रसंगानुसार बहुवचन अर्थ की संभावना बताना।
lexical_decisions:
- source_word: educam eum
  choice: उसे बाहर निकाल लाऊँगा
  rationale: लातीनी पाठ के एकवचन सर्वनाम eum को बनाए रखते हुए educam के बाहर ले आने के भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: in manu potenti et brachio excelso
  choice: शक्तिशाली हाथ और ऊँची उठी भुजा से
  rationale: निर्गमन-संबंधी पारंपरिक बिंब और दोनों समानांतर अंगों को यथासंभव औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: plaga
  choice: विपत्ति
  rationale: यह शब्द प्रहार, महामारी अथवा दैवी विपत्ति का अर्थ दे सकता है; यहाँ मिस्र पर दंड के प्रसंग में व्यापक और स्वाभाविक ‘विपत्ति’ चुना गया है।
- source_word: corrumpam terram omnem eius
  choice: उसकी सारी भूमि को नष्ट कर दूँगा
  rationale: corrumpam की तीव्रता और terram omnem eius की समग्रता को सीधे रूप में व्यक्त किया गया है।
