lexical_decisions:
- source_word: non parcam illis
  choice: मैं उन पर दया नहीं करूँगा
  rationale: parcere का अर्थ किसी को दण्ड या विनाश से बख्शना है; यह हिन्दी में स्वाभाविक ढंग से उसी कठोर घोषणा को व्यक्त करता है।
- source_word: discedite
  choice: दूर हो जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक रूप; इसमें स्थान छोड़ने या परमेश्वर की उपस्थिति से हट जाने का भाव बना रहता है।
- source_word: filii apostatae
  choice: हे धर्मत्यागी सन्तानो
  rationale: apostatae में विश्वास या निष्ठा छोड़ देने का भाव है। सम्बोधन और बहुवचन को स्पष्ट रखा गया है।
- source_word: sanctificationem meam
  choice: मेरी पवित्रता
  rationale: अमूर्त लैटिन संज्ञा का निकटतम हिन्दी रूप चुना गया है, ताकि इसे बिना पर्याप्त आधार केवल 'पवित्रस्थान' न बना दिया जाए।
- source_word: contaminare
  choice: अशुद्ध करना
  rationale: पवित्रता को दूषित या अपवित्र करने का धार्मिक-सांस्कृतिक भाव स्पष्ट और सहज हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: sanctificationem meam का आशय
  choice: मेरी पवित्रता
  alternative: मेरा पवित्रस्थान / मेरी पवित्र वस्तु
  rationale: मूल पाठ का पद अमूर्त भी समझा जा सकता है और किसी पवित्र वस्तु या स्थान का ठोस संकेत भी हो सकता है। मुख्य पाठ में मूल की व्यापकता रखी गई और वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
