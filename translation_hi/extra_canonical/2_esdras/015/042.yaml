  text: And they will tear down cities and walls, mountains and hills, trees of the forests and grass of the meadows.
translation:
  language: hi
  text: और वे नगरों और दीवारों, पर्वतों और पहाड़ियों, जंगलों के पेड़ों और मैदानों की घास को नष्ट कर देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demolient
  choice: नष्ट कर देंगे
  rationale: शाब्दिक अर्थ ‘ढा देंगे’ है, पर एक ही क्रिया नगरों, पर्वतों, पेड़ों और घास—सभी पर लागू होती है; इसलिए व्यापक और स्वाभाविक ‘नष्ट कर देंगे’ चुना गया।
- source_word: ciuitates et muros
  choice: नगरों और दीवारों
  rationale: दोनों संज्ञाओं को बिना संबंधसूचक शब्द जोड़े स्वतंत्र रूप से रखा गया है, जैसा लैटिन में है।
- source_word: montes et colles
  choice: पर्वतों और पहाड़ियों
  rationale: बड़े और छोटे ऊँचे भूभागों के बीच मूल पाठ का भेद बनाए रखा गया है।
- source_word: ligna siluarum
  choice: जंगलों के पेड़ों
  rationale: यहाँ ligna का आशय वन के वृक्षों से है; ‘लकड़ी’ की अपेक्षा ‘पेड़’ विनाश के दृश्य में अधिक स्वाभाविक है।
- source_word: fena
  choice: मैदानों की घास
  rationale: fena घास या सूखी घास को सूचित करता है; परामर्श-पाठ के ‘grass of the meadows’ के अनुरूप, सामान्य पाठक के लिए स्वाभाविक रूप चुना गया।
theological_decisions: []
