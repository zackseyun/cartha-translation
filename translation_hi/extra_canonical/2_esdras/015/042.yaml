  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। उपलब्ध लैटिन की आरंभिक पंक्ति ‘campi et omnes ruii plenitudine aquarum illarum’ पिछले वाक्य/पद की निरंतरता प्रतीत होती है; इस पद का अनुवाद स्पष्ट नए वाक्य ‘Et demolient…’ से किया गया है, जैसा परामर्श-पाठ में भी है।
