  yaml_path: translation/extra_canonical/2_esdras/015/026.yaml
  text: God knows those who sin against him[a]; therefore he will hand them over to death and slaughter.
translation:
  language: hi
  text: परमेश्वर उन लोगों को जानता है जो उसके विरुद्ध पाप करते हैं[a]; इसलिए वह उन्हें मृत्यु और वध के हवाले कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर उन लोगों को जानता है जो उसके विरुद्ध पाप करते हैं;”
    reason: पूर्व प्रचलित पाठ में आरंभिक कारणसूचक संबंध को व्यक्त करने वाला वैकल्पिक पाठ; लातीनी मूल में ‘क्योंकि’ के लिए कोई स्पष्ट शब्द नहीं है।
lexical_decisions:
- source_word: novit
  choice: जानता है
  rationale: लातीनी क्रिया का सीधा और स्वाभाविक वर्तमानकालीन अनुवाद।
- source_word: qui peccant in eum
  choice: जो उसके विरुद्ध पाप करते हैं
  rationale: यहाँ in eum विरोध या लक्ष्य का भाव देता है; ‘उसके विरुद्ध’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: tradet eos
  choice: वह उन्हें ... के हवाले कर देगा
  rationale: tradere के सौंप देने या अधीन कर देने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: in mortem et in occisionem
  choice: मृत्यु और संहार के हवाले
  rationale: दोनों लातीनी संज्ञाओं का अलग अर्थ बनाए रखते हुए occisio की हिंसक सामूहिक हत्या की छाया को ‘संहार’ से व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर का पापियों को जानना
  choice: ‘जानता है’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘पहचानता है’ या ‘भली-भाँति जानता है’
  rationale: मूल novit केवल जानने की बात कहता है; न्यायिक पहचान या सर्वज्ञता का अतिरिक्त अर्थ पाठ में नहीं जोड़ा गया।
- issue: दंड में परमेश्वर की भूमिका
  choice: ‘हवाले कर देगा’
  alternative: ‘मार डालेगा’
  rationale: मूल tradet प्रत्यक्ष वध के बजाय सौंपे जाने को व्यक्त करता है; इसी धर्मवैचारिक तनाव को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गंभीर और सहज रखी गई है। ‘मृत्यु और संहार’ मूल के दोहरे दंड-वाक्यांश को बनाए रखता है।
