  text: 'Behold, I am bringing evils upon the world, says the Lord: sword and famine and death and destruction,'
translation:
  language: hi
  text: '“देखो, प्रभु कहता है, मैं संसार पर विपत्तियाँ ला रहा हूँ: तलवार, अकाल, मृत्यु और विनाश।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्घोष को सरल और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: induco
  choice: ला रहा हूँ
  rationale: वर्तमानकालीन प्रथम-पुरुष क्रिया के सक्रिय और आसन्न भाव को व्यक्त करता है।
- source_word: super orbem terrarum
  choice: संसार पर
  rationale: पूरी पृथ्वी/मानव-जगत के व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: mala
  choice: विपत्तियाँ
  rationale: यहाँ आगे गिनाई गई तलवार, अकाल, मृत्यु और विनाश जैसी आपदाओं के संदर्भ में सामान्य ‘बुराइयाँ’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: gladium
  choice: तलवार
  rationale: युद्ध और हिंसक संहार के स्रोत-रूपक को अक्षुण्ण रखता है।
- source_word: famem
  choice: अकाल
  rationale: भोजन की व्यापक घोर कमी के अर्थ को सटीक रूप से व्यक्त करता है।
- source_word: mortem et interitum
  choice: मृत्यु और विनाश
  rationale: दोनों निकटार्थी संज्ञाओं को अलग रखकर मूल की संचयी तीव्रता संरक्षित करता है।
theological_decisions:
- issue: विपत्तियों के कर्ता के रूप में परमेश्वर का प्रत्यक्ष कथन
  choice: मैं संसार पर विपत्तियाँ ला रहा हूँ
  alternative: संसार पर विपत्तियाँ आने दे रहा हूँ
  rationale: लैटिन induco प्रत्यक्ष रूप से ‘मैं ला रहा हूँ’ कहता है; ‘आने दे रहा हूँ’ कारणता को नरम करके पाठ की धर्मवैचारिक तनावशीलता को अनुचित रूप से हल कर देता।
translation_notes:
