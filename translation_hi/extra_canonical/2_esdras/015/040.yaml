source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exaltabuntur nubes magnae et validae plenaeirae et sidus, ut exterant omnem terram et inhabitantes eam, et fundent super omnemaltum et eminentem sidus terribile.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/040.yaml
  text: And great and mighty clouds full of wrath[a], and a star, will be lifted up to destroy all the earth and those who dwell in it, and they will pour out a dreadful star upon every high and lofty place.
translation:
  language: hi
  text: और क्रोध से भरे बड़े और शक्तिशाली बादल और एक तारा ऊपर उठाए जाएँगे, ताकि वे सारी पृथ्वी और उसके निवासियों को नष्ट कर दें; और वे हर ऊँचे और उन्नत स्थान[a] पर एक भयंकर तारा उँडेल देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्थान’ अर्थ स्पष्ट करने के लिए जोड़ा गया है; लैटिन में यहाँ संज्ञा व्यक्त नहीं की गई है।
    reason: source_ellipsis
lexical_decisions:
- source_word: nubes magnae et validae
  choice: बड़े और शक्तिशाली बादल
  rationale: विशेषणों के आकार और सामर्थ्य—दोनों अर्थों को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: plenae irae
  choice: क्रोध से भरे
  rationale: लैटिन plenae के साथ संबंधकारक irae का अर्थ है कि बादल क्रोध से भरे हैं; sidus को इसका दूसरा पूरक नहीं बनाया गया।
- source_word: sidus
  choice: तारा
  rationale: इस पद में दोनों बार आए sidus के सामान्य खगोलीय अर्थ को रखा गया है, यद्यपि अंतिम बिंब असामान्य है।
- source_word: exaltabuntur
  choice: ऊपर उठाए जाएँगे
  rationale: लैटिन के भविष्यत्कालीन कर्मवाच्य को सुरक्षित रखा गया है और कर्ता को अनिर्दिष्ट रहने दिया गया है।
- source_word: exterant
  choice: नष्ट कर दें
  rationale: संदर्भ में सारी पृथ्वी और उसके निवासियों के विनाश का प्रबल अर्थ व्यक्त होता है।
- source_word: fundent
  choice: उँडेल देंगे
  rationale: लैटिन क्रिया के ठोस ‘बहा देना/उँडेलना’ बिंब को सहज हिन्दी में बनाए रखा गया है, भले ही तारे को उँडेलना जानबूझकर विचित्र प्रतीत हो।
- source_word: terribile
  choice: भयंकर
  rationale: भय उत्पन्न करने वाले विनाशकारी तारे का भाव संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: बादलों और तारे का क्रोध तथा विनाशकारी कार्य
  choice: क्रोध को बादलों से जोड़ा गया और तारे को उनके साथ अलग कर्ता रखा गया
  alternative: ‘क्रोध और तारे से भरे बादल’ समझना
  rationale: plenae संबंधकारक irae को ग्रहण करता है, जबकि sidus नपुंसकलिंग कर्ताकारक है और nubes के साथ exaltabuntur का सह-कर्ता है; इसलिए किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के बिना लैटिन व्याकरण का अनुसरण किया गया।
- issue: ऊपर उठाए जाने का अनिर्दिष्ट कर्ता
  choice: कर्मवाच्य बनाए रखा गया
  alternative: परमेश्वर उन्हें ऊपर उठाएगा
  rationale: मूल पाठ कार्य करने वाले का नाम नहीं बताता; उसे स्पष्ट रूप से परमेश्वर कहना पाठ में निहित बात से आगे बढ़ना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रलय-दर्शन के अनुकूल स्वर रखा गया है। मूल के असामान्य बिंब—‘भयंकर तारा उँडेल देंगे’—को सामान्य बनाकर बदलने के बजाय सुरक्षित रखा गया है।
