review_pass:
  verdict: revise
  source_fidelity: The draft preserves the feminine singular address, the passive sense of inebriata es, the personified 'harlot' in fornicariae, and the image of wages being held in the addressee's bosom. However, 'बदला' tends toward retaliatory revenge, whereas redditionem is more neutrally repayment/recompense in this clause.
  naturalness: '''मतवाली की गई'' is grammatically possible but stiff in modern Hindi. ''तुझे कब नशे में धुत किया गया था?'' is more idiomatic while retaining the unspecified passive agent. ''चेहरे की शोभा बढ़ा'' changes the imperative from adorning to enhancing; ''चेहरे की शोभा सँवार'' better conveys Exorna.'
  terminology: '''वेश्या'' correctly retains the source''s feminine personal metaphor rather than abstracting it as ''वेश्यावृत्ति.'' ''गोद'' is an acceptable contextual rendering of sinus. ''प्रतिफल'' is preferable to ''बदला'' for redditionem.'
  issues:
  - severity: medium
    issue: '''बदला'' for redditionem'
    rationale: In modern Hindi, 'बदला' commonly denotes revenge. The Latin denotes repayment/recompense and should not unnecessarily specify a retaliatory sense.
  - severity: low
    issue: '''मतवाली की गई'' is overly awkward'
    rationale: The passive and feminine personification should remain, but a more natural Hindi passive can express the same meaning.
  - severity: low
    issue: '''शोभा बढ़ा'' weakens Exorna'
    rationale: The source commands adornment/embellishment, not merely improvement or increase.
  revised_text: तुझे कब नशे में धुत किया गया था? अपने चेहरे की शोभा सँवार! वेश्या की कमाई तेरी गोद में है; इसलिए तुझे प्रतिफल मिलेगा।
