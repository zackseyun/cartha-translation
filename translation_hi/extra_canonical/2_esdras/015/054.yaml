  text: cum inebriata es? Exorna speciem uultus tui! Merces fornicariae in sinus tuos, propterea redditionem recipies. Sicut facies electis meis, dicit dominus, sic faciet tibi deus et tradet te in malis. Et nati tui fame interient, et tu rumphea cades, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/054.yaml
  text: When were you made drunk? Adorn the beauty of your face! The wages of a harlot are in your bosom[a]; therefore you will receive repayment.
translation:
  language: hi
  text: तुझे कब नशे में धुत किया गया था? अपने चेहरे की शोभा सँवार! वेश्या की कमाई तेरी गोद में है; इसलिए तुझे प्रतिफल मिलेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inebriata es
  choice: मतवाली की गई
  rationale: लैटिन के स्त्रीलिंग पूर्ण कर्मवाच्य को सुरक्षित रखता है और संबोधित नगर के स्त्री-रूपक को बनाए रखता है।
- source_word: Exorna speciem uultus tui
  choice: अपने चेहरे की शोभा बढ़ा
  rationale: शाब्दिक अर्थ ‘अपने चेहरे के रूप/शोभा को सजा’ है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए सजाने-सँवारने की आज्ञा व्यक्त करता है।
- source_word: Merces fornicariae
  choice: वेश्या की कमाई
  rationale: fornicariae को स्त्री-व्यक्ति ‘वेश्या’ के रूप में रखता है, न कि अमूर्त ‘वेश्यावृत्ति’ के रूप में; merces के लिए ‘कमाई’ प्रसंगानुकूल और सहज है।
- source_word: in sinus tuos
  choice: तेरी गोद में
  rationale: sinus का यहाँ अर्थ आँचल, छाती के पास का भाग या गोद हो सकता है; ‘गोद में’ धन को अपने पास रखे होने का स्वाभाविक चित्र देता है।
- source_word: redditionem recipies
  choice: तुझे उसका बदला मिलेगा
  rationale: redditionem प्रतिदान अथवा प्रत्युत्तर में मिलने वाले फल को दर्शाता है; न्यायात्मक संदर्भ में ‘बदला’ स्पष्ट है, जबकि वाक्य में निहित प्रतिफल को ‘उसका’ से जोड़ा गया है।
theological_decisions:
- issue: स्त्रीलिंग संबोधन और वेश्या का रूपक
  choice: स्त्रीलिंग एकवचन ‘तू/तेरी’ और ‘वेश्या’ बनाए रखा
  alternative: अमूर्त ‘वेश्यावृत्ति’ या सामान्य बहुवचन
  rationale: स्रोत संबोधित नगर को स्त्री और वेश्या के रूप में व्यक्त करता है; इसे अमूर्त करने से भविष्यद्वाणी का व्यक्तिकरण कमजोर पड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रत्यक्ष, गंभीर और भविष्यद्वाणी-संबंधी लहजा रखा गया है। ‘तू’ स्रोत के एकवचन, तीखे संबोधन के अनुरूप है। आरंभिक कर्मवाच्य हिन्दी में कुछ औपचारिक है, पर स्रोत की अनिर्दिष्ट कर्ता वाली रचना और वास्तविक अस्पष्टता को सुरक्षित रखता है।
