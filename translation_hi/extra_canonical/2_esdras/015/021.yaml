id: 2ES.15.21
reference: 2 Esdras 15:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'sicut faciunt usque hodie electis meis, sic faciam et reddam in sinum ipsorum. haec dicit Dominus Deus:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/021.yaml
  text: 'As they have done to my chosen ones to this day[a], so I will do and repay into their lap. Thus says the Lord God:'
translation:
  language: hi
  text: 'जैसा वे आज तक मेरे चुने हुओं के साथ करते आए हैं, वैसा ही मैं करूँगा और उनकी झोली में बदला डाल दूँगा।[a] प्रभु परमेश्वर यह कहता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उनकी गोद, अर्थात् वस्त्र की तह, में बदला दूँगा।”'
    reason: लैटिन ‘in sinum ipsorum’ के ठोस रूपक को स्पष्ट करता है; ‘sinus’ यहाँ वस्त्र की तह या झोली को सूचित करता है।
lexical_decisions:
- source_word: electis meis
  choice: मेरे चुने हुओं
  rationale: यह पदबंध परमेश्वर द्वारा चुने गए लोगों को सूचित करता है; यह अनुवाद मूल के संबंध और बहुवचन दोनों को बनाए रखता है।
- source_word: reddam
  choice: उसका बदला डाल दूँगा
  rationale: यहाँ क्रिया प्रतिफल या प्रत्युत्तर में किए जाने का भाव रखती है। ‘बदला’ न्यायपूर्ण प्रत्युपकार के नकारात्मक संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: in sinum ipsorum
  choice: उनकी झोली में
  rationale: लैटिन ‘sinus’ यहाँ वस्त्र की उस तह या झोली का चित्र प्रस्तुत करता है जिसमें कुछ डाला जाता था। ‘झोली’ आधुनिक पाठक के लिए इस ठोस रूपक को ‘वक्ष’ की अपेक्षा अधिक स्पष्टता से बनाए रखती है।
- source_word: haec dicit Dominus Deus
  choice: प्रभु परमेश्वर यह कहता है
  rationale: यह मूल के भविष्यद्वाणी-सूत्र की औपचारिकता और शब्दक्रम को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: प्रतिशोध या प्रतिफल की कर्ता-संबंधी समानता
  choice: वैसा ही मैं भी उनके साथ करूँगा
  alternative: वैसा ही मैं करूँगा
  rationale: लैटिन ‘sicut … sic’ तुलना को स्पष्ट करता है। हिन्दी में ‘भी’ इस सहसंबंध को स्वाभाविक बनाता है; इसे किसी अतिरिक्त धर्मवैज्ञानिक दावे के रूप में नहीं, बल्कि तुलना के भाषिक संकेत के रूप में रखा गया है।
- issue: प्रत्युपकार के रूपक का अर्थ
  choice: झोली में उसका बदला डाल दूँगा
  alternative: उनकी गोद में लौटा दूँगा
  rationale: मूल न्यायपूर्ण प्रत्युपकार को वस्त्र की तह में डाले जाने के चित्र से व्यक्त करता है। मुख्य पाठ अर्थ और रूपक दोनों को साथ रखता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। वाक्य में न्यायपूर्ण प्रत्युपकार का कठोर स्वर और वस्त्र की झोली वाला मूल रूपक सुरक्षित रखा गया है।
