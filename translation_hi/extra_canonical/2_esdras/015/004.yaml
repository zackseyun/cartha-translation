translation:
  language: hi
  text: क्योंकि हर अविश्वासी अपने अविश्वास में मर जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnis incredulus
  choice: हर अविश्वासी
  rationale: ‘omnis’ की सार्वभौमिकता और ‘incredulus’ के व्यक्ति-संज्ञात्मक अर्थ को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: in incredulitate sua
  choice: अपने अविश्वास में
  rationale: लातीनी ‘in’ की जानबूझकर बनी हुई अस्पष्टता को बनाए रखता है; यह अविश्वास की अवस्था या दशा में मरने का अर्थ दे सकता है, बिना कारण या दंड का अर्थ जोड़ने के।
- source_word: morietur
  choice: मर जाएगा
  rationale: भविष्यकालीन एकवचन क्रिया का आधुनिक, सहज और अर्थनिष्ठ हिन्दी रूप।
theological_decisions:
- issue: अविश्वास और मृत्यु के बीच संबंध
  choice: ‘अपने अविश्वास में मर जाएगा’
  alternative: ‘अपने अविश्वास के कारण मर जाएगा’
  rationale: मूल पाठ ‘in’ कहता है, स्पष्ट कारणसूचक पद नहीं; इसलिए अनुवाद अविश्वास को मृत्यु का प्रत्यक्ष कारण घोषित किए बिना मूल की धार्मिक तनाव और अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गंभीर और सामान्य पाठक के लिए स्पष्ट। मूल लातीनी वाक्य की पुनरुक्ति—‘अविश्वासी/अविश्वास’—जानबूझकर सुरक्षित रखी गई है।
