id: 2ES.15.60
reference: 2 Esdras 15:60
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: allident ciuitatem otiosam et exterent aliquam portionem terrae tuae et partem gloriae tuae exterminabunt rursum reuertentes a Babylonia subuersa. Et demolita eris illis pro stipula et ipsi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/060.yaml
  text: They will strike the idle city and lay waste some portion of your land, and they will destroy part of your glory, returning again from devastated Babylon. And you will be broken down by them like stubble, and they will be to you like fire.
translation:
  language: hi
  text: वे उस निश्चिंत नगर पर प्रहार करेंगे और तुम्हारे देश के कुछ भाग को उजाड़ देंगे; वे तुम्हारी महिमा के एक भाग को नष्ट कर देंगे और उजड़ी हुई बाबुल से फिर लौटेंगे। तब तुम उनके हाथों भूसे के समान ढहा दी जाओगी, और वे तुम्हारे लिए आग के समान होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ciuitatem otiosam
  choice: निश्चिंत नगर
  rationale: otiosam का मूल भाव निष्क्रिय, बेपरवाह या सुरक्षा के भ्रम में निश्चिंत होने का हो सकता है। ‘निश्चिंत’ इस संभावित निंदात्मक संकेत को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: exterent
  choice: उजाड़ देंगे
  rationale: भूमि के किसी भाग को रौंदकर नष्ट करने के अर्थ को सहज और सशक्त हिन्दी में व्यक्त करता है।
- source_word: gloriae tuae
  choice: तुम्हारी महिमा
  rationale: gloria का व्यापक और जानबूझकर अनिर्दिष्ट अर्थ सुरक्षित रखा गया है; इसे धन, वैभव या प्रतिष्ठा तक सीमित नहीं किया गया।
- source_word: demolita eris
  choice: ढहा दी जाओगी
  rationale: नगर को संबोधित स्त्रीलिंग निष्क्रिय रूप और ध्वंस के चित्र दोनों को सुरक्षित रखता है।
- source_word: pro stipula
  choice: भूसे के समान
  rationale: stipula खेत में बची सूखी डंठल या ठूँठ भी हो सकती है; आग के अगले बिंब के संदर्भ में सामान्य पाठक के लिए ‘भूसा’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: दूसरे पुरुष स्त्रीलिंग संबोधन का संदर्भ
  choice: तुम/तुम्हारी और स्त्रीलिंग ‘दी जाओगी’ बनाए रखा
  alternative: नगर या देश का नाम जोड़कर संदर्भ स्पष्ट करना
  rationale: लैटिन में संबोधित सत्ता स्त्रीलिंग है, पर इस पद में उसका नाम स्पष्ट नहीं है। अनिर्दिष्टता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया।
- issue: ‘महिमा’ का आशय
  choice: महिमा
  alternative: वैभव, प्रतिष्ठा या गौरव
  rationale: मूल के अर्थ-क्षेत्र को संकीर्ण करने और किसी विशेष ऐतिहासिक अथवा धार्मिक व्याख्या को आरोपित करने से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। समानांतर भविष्यकालीन क्रियाओं और विनाश के काव्यात्मक बिंब को बनाए रखा गया है। उपलब्ध लैटिन अंश अंत में ‘et ipsi’ पर रुकता है; ‘वे तुम्हारे लिए आग के समान होंगे’ अंग्रेज़ी परामर्श-पाठ में संरक्षित आगे के पाठ-साक्ष्य के अनुसार रखा गया है।
