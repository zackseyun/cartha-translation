id: 2ES.15.56
reference: 2 Esdras 15:56
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut facies electis meis, dicit Dominus, sic faciet tibi Deus et tradet te in malis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/056.yaml
  text: As you do to my chosen ones[a], says the Lord, so God will do to you and will hand you over to evils.
translation:
  language: hi
  text: “जैसा तू मेरे चुने हुओं[a] के साथ करेगा,” प्रभु कहता है, “वैसा ही परमेश्वर तेरे साथ करेगा और तुझे विपत्तियों के हवाले कर देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पहले का पाठ: “तेरे नगर चूर-चूर किए जाएँगे, और खेत में तेरे सभी लोग तलवार से मारे जाएँगे।”'
    reason: previous_rendering
lexical_decisions:
- source_word: sicut facies ... sic faciet
  choice: जैसा तू ... करेगा, वैसा ही ... करेगा
  rationale: दोनों लैटिन क्रियाएँ भविष्यकाल में हैं और ‘जैसा...वैसा ही’ प्रतिफल की समानता को स्पष्ट रूप से बनाए रखता है।
- source_word: electis meis
  choice: मेरे चुने हुओं
  rationale: यह बहुवचन विशेषण का संज्ञात्मक प्रयोग है; ‘चुने हुओं’ चुनाव के भाव को बिना अतिरिक्त धर्मशास्त्रीय व्याख्या के सुरक्षित रखता है।
- source_word: tradet te
  choice: तुझे ... के हवाले कर देगा
  rationale: tradere का यहाँ स्वाभाविक अर्थ किसी को प्रतिकूल शक्तियों या परिस्थितियों के अधीन सौंप देना है।
- source_word: in malis
  choice: विपत्तियों के हवाले
  rationale: बहुवचन malis संदर्भ में अमूर्त नैतिक ‘बुराइयों’ की अपेक्षा आने वाली विपत्तियों या संकटों को सूचित करता है; ‘विपत्तियाँ’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: वक्ता ‘प्रभु’ और कर्ता ‘परमेश्वर’ के बीच संबंध
  choice: 'दोनों पदों को स्रोत के अनुसार अलग-अलग रखा गया: ‘प्रभु कहता है’ और ‘परमेश्वर ... करेगा’।'
  alternative: दोनों स्थानों पर ‘प्रभु’ या दोनों पर ‘परमेश्वर’ कहना।
  rationale: Latin dicit Dominus और Deus faciet के शब्दगत अंतर को मिटाना उचित नहीं; पाठ की संभावित आलंकारिक या धर्मशास्त्रीय तनाव को सुरक्षित रखा गया है।
- issue: प्रतिफल का स्वरूप
  choice: ‘जैसा...वैसा ही’ द्वारा समानुपाती दैवी प्रतिफल व्यक्त किया गया।
  alternative: ‘उसका बदला परमेश्वर तुझसे लेगा’।
  rationale: ‘बदला’ स्रोत से अधिक व्याख्यात्मक और भावात्मक होता; स्रोत कर्म और प्रत्युत्तर की समानता पर बल देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी भविष्यवाणी-शैली अपनाई गई है। ‘तू/तेरे/तुझे’ एकवचन संबोधन को सुरक्षित रखता है और न्यायसूचक वचन के तीखेपन के अनुकूल है।
