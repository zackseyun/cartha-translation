lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: populus meus
  choice: मेरी प्रजा
  rationale: स्वामित्व और सामुदायिक पहचान, दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: quasi grex
  choice: झुंड के समान
  rationale: मूल उपमा को बिना पशु-प्रकार जोड़े बनाए रखता है, क्योंकि Latin में केवल grex है।
- source_word: ad occisionem ducitur
  choice: वध के लिए ले जाए जा रहे
  rationale: उद्देश्य और निष्क्रिय रूप दोनों को व्यक्त करता है; प्रजा सामूहिक संज्ञा होने के कारण हिन्दी में अर्थानुसार बहुवचन क्रिया स्वाभाविक है।
- source_word: iam non patiar
  choice: अब मैं ... और अधिक ... नहीं दूँगा
  rationale: iam non और भविष्यसूचक patiar का स्वाभाविक हिन्दी रूप, जिसमें सहने या अनुमति देने की समाप्ति व्यक्त होती है।
- source_word: habitare in terra Aegypti
  choice: मिस्र देश में ... रहने
  rationale: terra Aegypti को प्रचलित बाइबलीय किन्तु आधुनिक रूप में प्रस्तुत करता है।
