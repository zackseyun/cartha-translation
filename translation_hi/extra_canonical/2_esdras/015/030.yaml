  text: Carmonii insanientes in ira exient de silva et advenient in virtute magna et constabunt in pugnam cum illis et vastabunt portionem terrae Assyriorum in dentibus suis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/030.yaml
  text: The Carmonians[a], raging in wrath, will come out from the forest, and they will come with great force and stand for battle against them, and they will lay waste the portion of the land of the Assyrians with their teeth.
translation:
  language: hi
  text: करमोनियाई लोग[a], क्रोध में उन्मत्त होकर, वन से निकलेंगे और बड़ी शक्ति के साथ आएँगे; वे उनके विरुद्ध युद्ध के लिए मोर्चा लेंगे और अपने दाँतों से अश्शूरियों के देश के एक भाग को उजाड़ देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः ‘करमानियाई लोग’; लैटिन पाठ में Carmonii है, जिसे कुछ विद्वान करमानिया प्रदेश के लोगों का नाम मानते हैं।
    reason: जाति-संज्ञा के लैटिन पाठ-रूप तथा उसकी संभावित ऐतिहासिक पहचान के बीच की अनिश्चितता बनाए रखता है।
lexical_decisions:
- source_word: Carmonii
  choice: करमोनियों
  rationale: लैटिन पाठ की जाति-संज्ञा Carmonii का निकट देवनागरी लिप्यंतरण रखा गया है। इसे अनुमान के आधार पर ‘करमानियों’ में सामान्यीकृत नहीं किया गया, ताकि उपलब्ध स्रोत-पाठ का रूप सुरक्षित रहे।
- source_word: insanientes in ira
  choice: का क्रोध भड़क उठेगा
  rationale: मुहावरे का अर्थ उग्र और अनियंत्रित क्रोध में होना है; यह हिन्दी में स्वाभाविक तथा भविष्यकालीन भविष्यवाणी के अनुरूप है।
- source_word: silva
  choice: वन
  rationale: ‘जंगल’ की अपेक्षा ‘वन’ संक्षिप्त, गरिमापूर्ण और सहज आधुनिक हिन्दी है।
- source_word: in virtute magna
  choice: बड़ी शक्ति के साथ
  rationale: virtus यहाँ नैतिक सद्गुण नहीं, सैन्य बल या सामर्थ्य दर्शाता है।
- source_word: constabunt in pugnam cum illis
  choice: उनके विरुद्ध युद्ध के लिए डट जाएँगे
  rationale: constabunt की स्थिर होकर मोर्चा लेने की छाया ‘डट जाएँगे’ से व्यक्त होती है; illis का अस्पष्ट पूर्वसंदर्भ ‘उनके’ में सुरक्षित है।
- source_word: portionem terrae Assyriorum
  choice: अश्शूरियों के देश के एक भाग को
  rationale: portio को अनिश्चित ‘एक भाग’ के रूप में रखा गया है और Assyriorum को लोगों से संबंधित देश के रूप में व्यक्त किया गया है।
- source_word: in dentibus suis
  choice: अपने दाँतों से
  rationale: स्रोत की तीखी और संभवतः रूपकात्मक छवि को बिना व्याख्यात्मक नरमी के अक्षरशः सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘अपने दाँतों से’ की छवि का अर्थ
  choice: छवि को ज्यों का त्यों रखा गया
  alternative: इसे ‘निर्दयता से’ या ‘अपनी हिंसक शक्ति से’ समझाकर अनूदित करना
  rationale: लैटिन अभिव्यक्ति वास्तविक या रूपकात्मक हिंसा—दोनों की संभावना रखती है; अनुवाद में इस अस्पष्टता को नहीं सुलझाया गया।
- issue: Carmonii की ऐतिहासिक पहचान
  choice: करमोनियों के रूप में स्रोत-पाठानुसार लिप्यंतरण
  alternative: करमानियों के रूप में ऐतिहासिक सामान्यीकरण
  rationale: प्राप्त लैटिन में Carmonii है और संशोधन-इतिहास परस्पर विरोधी है; इसलिए मुख्य पाठ स्रोत के प्रत्यक्ष रूप का अनुसरण करता है तथा पादटिप्पणी में संभावित पहचान बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-संबंधी शैली रखी गई है। वाक्य को स्वाभाविक प्रवाह देने के लिए पहले खंड को ‘का क्रोध भड़क उठेगा’ बनाया गया है, जबकि युद्ध, विनाश और ‘दाँतों’ की कठोर मूल छवियाँ सुरक्षित हैं।
