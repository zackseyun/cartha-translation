lexical_decisions:
- source_word: primaria
  choice: प्रधान बनकर
  rationale: लैटिन primaria स्त्रीलिंग एकवचन है और संबोधित स्त्रीलिंग सत्ता के लिए ‘प्रमुख/प्रधान’ होने का भाव देता है। ‘प्रधान बनकर’ हिन्दी में इस विधेयात्मक प्रयोग को स्वाभाविक रूप से व्यक्त करता है, यद्यपि ‘सबसे पहले’ का अर्थ भी संभव है।
- source_word: rursum accipies mala
  choice: फिर विपत्तियाँ पाएगी
  rationale: mala बहुवचन में बुराइयों, कष्टों या विपत्तियों को सूचित कर सकता है; प्रसंग में प्राप्त होने वाले संकटों के लिए ‘विपत्तियाँ’ स्पष्ट और स्वाभाविक है। accipies का सीधा भाव ‘पाएगी/प्राप्त करेगी’ रखा गया है।
- source_word: Et in transitu
  choice: और जाते समय—
  rationale: यह अगले वाक्य की अपूर्ण शुरुआत है। ‘जाते समय’ transitus के मार्ग से गुजरने/प्रस्थान करने के भाव को स्वाभाविक हिन्दी में रखता है; दीर्घ विराम-चिह्न पाठ के खंडित बने रहने को दिखाता है।
