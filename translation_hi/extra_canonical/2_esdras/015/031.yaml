source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et post haec supervalescet draco nativitatis memoria suae, et si converterint se conspirantes in virtute magna ad persequendos eos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/031.yaml
  text: And after this the dragon[a], mindful of its origin, will prevail; and if they turn, conspiring in great force to pursue them[b],
translation:
  language: hi
  text: और इसके बाद वह अजगर[a], अपनी उत्पत्ति को स्मरण रखते हुए, प्रबल हो जाएगा; और यदि वे मुड़कर बड़े बल के साथ एकजुट हों और उनका पीछा करें[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अजगर, अपनी उत्पत्ति को स्मरण रखते हुए’ वाला खंड पाठ की दृष्टि से अस्पष्ट है। अनुवाद ने इस विचित्र छवि को किसी अधिक सहज अनुमान से नहीं बदला है।
    reason: textual_variant
  - marker: b
    text: या, ‘यदि वे अपने को फेरें और बड़े बल के साथ मिलकर उनका पीछा करें।’
    reason: previous_rendering
lexical_decisions:
- source_word: supervalescet
  choice: प्रबल हो जाएगा
  rationale: भविष्यकालीन क्रिया के बढ़कर प्रभावी या शक्तिशाली होने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: draco
  choice: अजगर
  rationale: लातीनी apocalyptic प्रतीक के रूप में बड़े सर्पाकार प्राणी की छवि बनाए रखता है; यहाँ सामान्य आधुनिक हिन्दी में 'ड्रैगन' की अपेक्षा बाइबिलीय 'अजगर' अधिक उपयुक्त है।
- source_word: nativitatis memoria suae
  choice: अपनी उत्पत्ति को स्मरण रखते हुए
  rationale: असामान्य और कुछ अस्पष्ट वाक्यांश को सुधारे बिना उसके मूल/जन्म और स्मरण—दोनों तत्व सुरक्षित रखता है।
- source_word: conspirantes
  choice: एकजुट हों
  rationale: सैन्य प्रसंग में साथ मिलकर दल बाँधने का भाव देता है और आधुनिक हिन्दी में गुप्त षड्यंत्र का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ad persequendos eos
  choice: उनका पीछा करें
  rationale: उद्देश्यसूचक gerundive संरचना का स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अजगर की उत्पत्ति को स्मरण रखने वाले अस्पष्ट कथन की व्याख्या
  choice: छवि और अस्पष्टता को यथावत रखा गया
  alternative: इसे किसी विशेष राष्ट्र, शासक या वंश के स्पष्ट संकेत के रूप में खोलना
  rationale: स्रोत-पाठ स्वयं पहचान स्पष्ट नहीं करता; किसी निश्चित ऐतिहासिक या सांप्रदायिक व्याख्या को पाठ में जोड़ना अनुचित होगा।
- issue: converterint se conspirantes का संबंध और अर्थ
  choice: मुड़कर एकजुट होने और पीछा करने की संभाव्य क्रमिक क्रिया
  alternative: ‘अपने को फेरें, षड्यंत्र करते हुए’ जैसा अत्यधिक शाब्दिक रूप
  rationale: लातीनी वाक्य विन्यास की वास्तविक अनिश्चितता रखते हुए सैन्य प्रसंग में बोधगम्य हिन्दी दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद स्रोत की तरह अगले वाक्य की ओर बढ़ता हुआ अल्पविराम पर समाप्त होता है; असामान्य apocalyptic छवि को जानबूझकर सरल बनाकर नहीं बदला गया।
