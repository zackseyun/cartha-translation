  yaml_path: translation/extra_canonical/2_esdras/015/055.yaml
  text: The wages of a prostitute are in your bosom[a]; therefore you will receive repayment.
translation:
  language: hi
  text: वेश्या की कमाई तेरी गोद में है[a]; इसलिए तुझे प्रतिदान मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेश्या की कमाई तेरे आँचल में है।”
    reason: लैटिन sinus गोद, वक्षस्थल, या वस्त्र की तह/आँचल को सूचित कर सकता है।
lexical_decisions:
- source_word: merces fornicariae
  choice: वेश्या की कमाई
  rationale: fornicariae संबंधकारक एकवचन है और किसी वेश्या को सूचित करता है, न कि अमूर्त ‘व्यभिचार’; merces के लिए प्रसंगानुकूल और स्वाभाविक ‘कमाई’ चुना गया है।
- source_word: in sinus tuos
  choice: तेरी गोद में
  rationale: sinus का शाब्दिक बिंब गोद/वक्षस्थल अथवा वस्त्र की तह का है; ‘गोद में’ मूल रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: redditionem percipies
  choice: तुझे उसका प्रतिफल मिलेगा
  rationale: redditionem में लौटाकर दिए जाने या कर्मानुसार बदले का भाव है; ‘प्रतिफल’ इस न्यायात्मक अर्थ को बिना अनावश्यक रूप से ‘दंड’ निश्चित किए व्यक्त करता है।
theological_decisions:
- issue: प्रतिदान का स्वरूप
  choice: प्रतिफल
  alternative: बदला / दंड
  rationale: लैटिन redditionem प्रतिदान को व्यक्त करता है, पर इसी वाक्य में उसका स्वरूप स्पष्टतः ‘दंड’ नहीं कहा गया; इसलिए मूल की व्यापकता और न्यायात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में एकवचन अनौपचारिक/प्रत्यक्ष ‘तेरी/तुझे’ रखा गया है, जो भविष्यद्वाणी की तीखी वाणी के अनुकूल है। भाषा सरल, गरिमापूर्ण और स्रोत के संक्षिप्त न्याय-वचन के निकट है।
