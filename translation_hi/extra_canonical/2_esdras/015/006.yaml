  yaml_path: translation/extra_canonical/2_esdras/015/006.yaml
  text: because iniquity has spread over the whole earth[a], and their deeds have been filled up.
translation:
  language: hi
  text: क्योंकि अधर्म सारी पृथ्वी पर छा गया है, और उनके कर्म पूरे हो चुके हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter quod
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताने वाला संबंधसूचक पद है; दिए गए संदर्भ और परामर्श-पाठ के अनुरूप सरल कारणवाचक रूप रखा गया है।
- source_word: superposuit iniquitas omnem terram
  choice: अधर्म सारी पृथ्वी पर छा गया है
  rationale: superponere का मूल भाव ऊपर फैलने या ढक लेने का है। ‘छा गया है’ आधुनिक हिन्दी में इस व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: operationes eorum
  choice: उनके कर्म
  rationale: operationes का अर्थ यहाँ उनके किए हुए काम या कर्म हैं। स्रोत में ‘हानिकारक’ जैसा कोई विशेषण नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: adimpletae sunt
  choice: पूरे हो चुके हैं
  rationale: लैटिन निष्प्रयोज्य रूप पूर्णता या भर जाने को दर्शाता है। यह अनुवाद उस न्याय-संबंधी तनाव को बनाए रखता है और ‘कर्मों की गिनती’ या ‘पाप का घड़ा’ जैसी अस्रोत कल्पना नहीं जोड़ता।
theological_decisions:
- issue: कर्मों के ‘पूरे होने’ का आशय
  choice: उनके कर्म पूरे हो चुके हैं
  alternative: उनके कर्मों का घड़ा भर चुका है
  rationale: वैकल्पिक हिन्दी अधिक मुहावरेदार है, पर वह ‘घड़े’ का रूपक जोड़ती है जो लैटिन में नहीं है। चुना हुआ रूप यह खुला रखता है कि बात कर्मों की पूर्णता, सीमा पूरी होने या न्याय के लिए उनके परिपक्व होने की है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अधर्म’ और ‘कर्म’ सामान्य धार्मिक-साहित्यिक हिन्दी में व्यापक रूप से समझे जाते हैं। वाक्य की दूसरी पंक्ति में स्रोत की जानबूझकर बनी हुई अर्थगत असहजता को पूरी तरह व्याख्यायित नहीं किया गया।
