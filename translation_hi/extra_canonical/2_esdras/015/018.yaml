  yaml_path: translation/extra_canonical/2_esdras/015/018.yaml
  text: For because of their pride the cities will be thrown into confusion, the houses will be destroyed, and men will be afraid.
translation:
  language: hi
  text: क्योंकि उनके घमंड के कारण नगरों में उथल-पुथल मच जाएगी, घर नष्ट कर दिए जाएँगे और लोग डरेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superbiam
  choice: घमंड
  rationale: यह लैटिन शब्द अहंकार या दंभ को व्यक्त करता है; सामान्य आधुनिक हिन्दी में ‘घमंड’ स्वाभाविक और स्पष्ट है।
- source_word: civitates turbabuntur
  choice: नगरों में उथल-पुथल मच जाएगी
  rationale: शाब्दिक अर्थ नगरों के व्याकुल या अस्त-व्यस्त किए जाने का है; यह रूप सामुदायिक अव्यवस्था का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: domus exterentur
  choice: घर नष्ट कर दिए जाएँगे
  rationale: संदर्भ में क्रिया विनाश या उजाड़े जाने को सूचित करती है; कर्मवाच्य रूप मूल की संरचना और तीव्रता को बनाए रखता है।
- source_word: homines metuent
  choice: लोग डरेंगे
  rationale: ‘homines’ यहाँ सामान्यतः मनुष्यों/लोगों के लिए है; ‘लोग’ आधुनिक हिन्दी में समावेशी और सहज है।
