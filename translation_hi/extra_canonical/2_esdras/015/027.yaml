source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam enim venerunt super orbem terrarum mala, et manebitis in illis; non enim liberabit vos Deus, propter quod peccastis in eum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/027.yaml
  text: For already evils have come upon the world, and you will remain in them; for God will not deliver you, because you have sinned against him.
translation:
  language: hi
  text: क्योंकि विपत्तियाँ पहले ही संसार पर आ पड़ी हैं, और तुम उन्हीं में पड़े रहोगे; क्योंकि परमेश्वर तुम्हें नहीं छुड़ाएगा, क्योंकि तुमने उसके विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: विपत्तियाँ
  rationale: यहाँ बहुवचन mala संदर्भ में संसार पर आने वाली बुराइयों या आपदाओं को दर्शाता है। ‘विपत्तियाँ’ प्राकृतिक हिन्दी में दंडात्मक संकट का भाव स्पष्ट करता है, बिना उसे किसी एक प्रकार की आपदा तक सीमित किए।
- source_word: orbem terrarum
  choice: संसार
  rationale: लातीनी पद का अर्थ पूरी बसी हुई पृथ्वी या जगत है; आधुनिक हिन्दी में ‘संसार’ संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: manebitis in illis
  choice: तुम उन्हीं में पड़े रहोगे
  rationale: शाब्दिक अर्थ ‘तुम उनमें बने रहोगे’ है। विपत्तियों के संदर्भ में ‘पड़े रहोगे’ निरंतर फँसे या घिरे रहने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: liberabit
  choice: छुड़ाएगा
  rationale: यह क्रिया संकट से बचाने या मुक्त करने को व्यक्त करती है; ‘छुड़ाएगा’ दोनों अर्थों को सहज हिन्दी में समेटता है।
- source_word: peccastis in eum
  choice: तुमने उसके विरुद्ध पाप किया है
  rationale: लातीनी in eum यहाँ अपराध की दिशा या लक्ष्य बताता है। ‘उसके विरुद्ध’ परमेश्वर के प्रति किए गए पाप को स्पष्ट और औपचारिक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर द्वारा न छुड़ाने और लोगों के पाप के बीच संबंध
  choice: 'दोनों कारणसूचक उपवाक्यों को स्पष्ट रूप से बनाए रखा गया: परमेश्वर नहीं छुड़ाएगा, क्योंकि उन्होंने उसके विरुद्ध पाप किया है।'
  alternative: वाक्य को नरम करके केवल यह कहना कि पाप के कारण वे विपत्तियों में रहेंगे।
  rationale: मूल पाठ परमेश्वर के न छुड़ाने को सीधे पाप से जोड़ता है। अनुवाद इस कठोर धर्मवैचारिक तनाव को न तो कम करता है, न उसके आगे कोई स्थायी या सार्वभौमिक निष्कर्ष जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और चेतावनीपूर्ण रखी गई है। ‘परमेश्वर’ तथा ‘पाप’ जैसे व्यापक रूप से समझे जाने वाले बाइबिलीय शब्द प्रयुक्त हैं। कोई पादटिप्पणी आवश्यक नहीं है।
