  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/034.yaml
  text: Behold, clouds from the east and from the north as far as the south, and their appearance is very dreadful, full of wrath and storm.
translation:
  language: hi
  text: देखो, पूर्व और उत्तर से दक्षिण तक बादल हैं, और उनका रूप बहुत भयावह है, क्रोध और तूफ़ान से भरा हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले लैटिन उद्गार का स्वाभाविक और प्रतिष्ठित हिन्दी रूप।
- source_word: nubs
  choice: बादल
  rationale: यहाँ पाठ में संभवतः ‘nubes’ का वर्तनीगत रूप है; बहुवचन का संकेत आगे के ‘illorum’ से भी मिलता है।
- source_word: ab oriente et a septentrione usque ad meridianum
  choice: पूर्व और उत्तर दिशा से लेकर दक्षिण तक
  rationale: दिशाओं और विस्तार की मूल संरचना को स्पष्ट, सहज हिन्दी में बनाए रखता है।
- source_word: facies illorum horrida valde
  choice: उनका रूप अत्यन्त भयानक है
  rationale: ‘facies’ को सामूहिक दृश्य रूप और ‘horrida valde’ को तीव्र भयावहता के रूप में व्यक्त किया गया है।
- source_word: plena irae et procellae
  choice: वे क्रोध और आँधी से भरे हैं
  rationale: ‘ira’ की व्यक्तिकारी भाषा को सुरक्षित रखते हुए ‘procella’ के लिए तीव्र तूफ़ानी हवा का सहज शब्द चुना गया है।
theological_decisions:
- issue: बादलों को क्रोध से भरा बताने वाली व्यक्तिकारी भाषा
  choice: क्रोध और आँधी से भरे हैं
  alternative: प्रकोप और तूफ़ान से भरे हैं
  rationale: ‘irae’ का सीधा अर्थ ‘क्रोध’ रखकर मूल की सजीव और तनावपूर्ण छवि को किसी विशिष्ट दैवी व्याख्या में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ भविष्यसूचक दृश्य की तात्कालिकता बनाए रखता है।
