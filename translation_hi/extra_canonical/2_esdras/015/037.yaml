  text: et horrebunt qui videbunt iram illam, et tremor adprehendet illos. et post haec movebuntur nimbi copiosi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/037.yaml
  text: And those who see that wrath will shudder[a], and trembling will seize them. And after this, abundant storm-clouds will be stirred up.
translation:
  language: hi
  text: और जो उस प्रकोप को देखेंगे, वे सिहर उठेंगे[a], और थरथराहट उन्हें आ घेरेगी। और इसके बाद बहुत-से तूफ़ानी बादल उमड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पुराने पद-विभाजन के अनुसार: “और पृथ्वी पर बड़ा भय और कम्पन होगा; और जो उस प्रकोप को देखेंगे, वे सिहर उठेंगे, और थरथराहट उन्हें आ घेरेगी। इसके बाद बहुत-से तूफ़ानी बादल उमड़ेंगे।”'
    reason: previous_rendering
lexical_decisions:
- source_word: iram
  choice: प्रकोप
  rationale: यहाँ आने वाले दैवी क्रोध की तीव्रता व्यक्त करने के लिए स्वाभाविक और गरिमापूर्ण शब्द।
- source_word: horrebunt
  choice: सिहर उठेंगे
  rationale: लैटिन क्रिया भय से काँपने या सिहरने का भाव देती है; यह आधुनिक हिन्दी में सहज है।
- source_word: tremor adprehendet illos
  choice: थरथराहट उन्हें आ घेरेगी
  rationale: मूल के व्यक्तिकरण और किसी के वश में आ जाने के भाव को बनाए रखता है।
- source_word: nimbi copiosi
  choice: घने बादल
  rationale: nimbi वर्षा या तूफ़ान से भरे बादलों को और copiosi उनकी प्रचुरता/सघनता को दर्शाता है; हिन्दी में 'घने बादल' स्वाभाविक रूप से दोनों का संकेत देता है।
- source_word: movebuntur
  choice: उमड़ पड़ेंगे
  rationale: बादलों के गतिशील या उकसाए जाने के भाव का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: iram का संदर्भ
  choice: प्रकोप
  alternative: क्रोध
  rationale: दैवी न्याय का संदर्भ संकेतित है, पर मूल से अधिक स्पष्ट धार्मिक व्याख्या नहीं जोड़ी गई।
- issue: पद 36 के अंतिम वाक्यांश की पुरानी पद-विभाजन परंपरा
  choice: मुख्य पाठ में सम्मिलित नहीं किया
  alternative: आरंभ में 'और पृथ्वी पर बड़ा भय और कम्पन होगा' जोड़ना
  rationale: दिए गए साफ किए हुए लैटिन स्रोत में वह वाक्यांश पद 36 का अंत है; पद 37 में जोड़ना दोहराव और गलत पद-विभाजन होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। समानार्थी 'काँपना' की पुनरावृत्ति से बचते हुए horrebunt और tremor का अंतर क्रमशः 'सिहर उठेंगे' और 'थरथराहट' से व्यक्त किया गया है।
