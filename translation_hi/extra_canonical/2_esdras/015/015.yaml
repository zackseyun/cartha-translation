source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia adpropinquavit gladius et extritio illorum, et exsurget gens contra gentem ad pugnam, et romphea in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/015.yaml
  text: For the sword and their destruction have drawn near[a], and nation will rise against nation for battle, and broadswords will be in their hands.
translation:
  language: hi
  text: क्योंकि तलवार और उनका विनाश निकट आ पहुँचे हैं[a]; एक जाति दूसरी जाति के विरुद्ध युद्ध करने उठ खड़ी होगी, और उनके हाथों में चौड़ी तलवारें होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक अनुवाद: “उनकी तलवार और उनका कुचला जाना निकट है।”'
    reason: पूर्व प्रचलित अनुवाद को वैकल्पिक अनुवाद के रूप में दर्ज करता है; यह पाठभेद नहीं, बल्कि लातीनी पदों के संबंध और extritio के अर्थ की वैकल्पिक व्याख्या है।
lexical_decisions:
- source_word: adpropinquavit
  choice: निकट आ पहुँचे हैं
  rationale: लातीनी पूर्णकाल निकट आ चुके संकट को व्यक्त करता है; संयुक्त कर्ताओं के कारण हिन्दी में स्वाभाविक बहुवचन रखा गया है।
- source_word: extritio illorum
  choice: उनका विनाश
  rationale: illorum को extritio के साथ वस्तुगत अर्थ में लिया गया है—अर्थात उनका होने वाला विनाश—न कि gladius के स्वामित्व-सूचक विशेषण के रूप में।
- source_word: gens contra gentem
  choice: एक जाति दूसरी जाति के विरुद्ध
  rationale: gens के सामूहिक अर्थ और आमने-सामने के संघर्ष को आधुनिक, बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: ad pugnam
  choice: युद्ध करने
  rationale: उद्देश्यसूचक ad को स्पष्ट और स्वाभाविक हिन्दी क्रियात्मक पदबंध में व्यक्त किया गया है।
- source_word: romphea
  choice: चौड़ी तलवारें
  rationale: यह साधारण gladius से भिन्न बड़ी या चौड़े फल वाली तलवार का संकेत देता है; इसलिए दोनों शब्दों का भेद बनाए रखा गया है।
theological_decisions:
- issue: illorum का संबंध
  choice: इसे ‘विनाश’ से जोड़कर ‘उनका विनाश’ किया गया है।
  alternative: ‘उनकी तलवार और कुचला जाना’
  rationale: लातीनी पदक्रम और अर्थ के अनुसार illorum का स्वाभाविक संबंध extritio से है; तलवार न्याय के साधन के रूप में निकट आती है, उनकी संपत्ति के रूप में नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तलवार’ और ‘चौड़ी तलवारें’ से मूल के gladius और romphea का शब्दगत भेद सुरक्षित है।
