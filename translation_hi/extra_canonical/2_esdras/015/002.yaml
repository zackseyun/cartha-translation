translation:
  language: hi
  text: जिन्हें मैं तुम्हारे मुँह में डालूँगा, प्रभु कहता है, उन्हें एक पन्ने पर लिखवा दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quos inmisero in os tuum
  choice: जिन्हें मैं तुम्हारे मुँह में डालूँगा
  rationale: लैटिन की सापेक्ष रचना और वचन को मुँह में रखने की भविष्यवाणी-संबंधी छवि को यथासंभव बनाए रखा गया है।
- source_word: dicit dominus
  choice: प्रभु कहता है
  rationale: सूत्रात्मक लैटिन अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: fac ut ... [scribantur]
  choice: लिखवा दो
  rationale: fac ut की प्रयोजक शक्ति को व्यक्त करता है; साफ किए गए अंश में निहित लेखन-क्रिया को अंग्रेज़ी परामर्श-पाठ और वाक्य-संदर्भ के अनुसार स्पष्ट किया गया है।
- source_word: carta
  choice: पत्र
  rationale: carta लेखन-सामग्री या लिखित पन्ने को सूचित कर सकता है। 'पत्र' मूल की सामान्यता को 'चर्मपत्र' या 'पुस्तक' की अपेक्षा बेहतर बनाए रखता है।
theological_decisions:
- issue: वचन का दैवी स्रोत
  choice: मैं तुम्हारे मुँह में डालूँगा
  alternative: मैं तुम्हें बोलने के लिए दूँगा
  rationale: मूल की मूर्त भविष्यवाणी-संबंधी छवि को सुरक्षित रखा गया है, बिना उसकी प्रेरणा-प्रक्रिया को अधिक व्याख्यायित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और अपेक्षाकृत औपचारिक शैली। यह पद पिछले पद से जुड़ा खंड है, इसलिए आरंभ में ‘जिन्हें’ और अंत में अल्पविराम रखा गया है।
