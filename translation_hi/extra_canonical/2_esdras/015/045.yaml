- source_word: subremanserint
  choice: शेष रहेंगे
  rationale: यह भविष्य में बचे या शेष रह जाने वालों को व्यक्त करता है, बिना यह अनावश्यक रूप से जोड़ने के कि वे किसी विनाश से जीवित बचेंगे।
- source_word: servient
  choice: सेवा करेंगे
  rationale: लातीनी क्रिया का सीधा अर्थ अधीन होकर सेवा करना है; हिन्दी में यह भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: exteruerunt
  choice: आतंकित किया था
  rationale: यहाँ अर्थ नष्ट करना नहीं, बल्कि अत्यन्त भयभीत या आतंकित करना है।
- source_word: eam
  choice: उसे
  rationale: स्त्रीलिंग सर्वनाम पूर्ववर्ती स्त्रीलिंग संदर्भ की ओर संकेत करता है; हिन्दी सर्वनाम उस संदर्भगत संबंध को खुला रखता है।
