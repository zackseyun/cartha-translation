source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exiit ignis ab ira eius et devoravit fundamenta terrae et peccatores quasi stramen incensum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/023.yaml
  text: And fire went out from his wrath and devoured the foundations of the earth[a], and sinners like straw set ablaze.
translation:
  language: hi
  text: और उसके क्रोध से आग निकली और पृथ्वी की नींवों को निगल गई[a], और पापियों को धधकते भूसे के समान भस्म कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और उसके क्रोध से आग निकली और पृथ्वी की नींवों और पापियों को जलते हुए भूसे के समान निगल गई।”'
    reason: लातीनी वाक्य में एक ही क्रिया ‘निगल गई’ दोनों कर्मों पर लागू होती है और मूल पाठ में विराम-चिह्न से उपमा का दायरा निश्चित नहीं किया गया है।
lexical_decisions:
- source_word: exiit ignis ab ira eius
  choice: उसके क्रोध से आग निकली
  rationale: लातीनी अभिव्यक्ति को निकटता से रखते हुए स्वाभाविक हिन्दी दी गई है; आग को क्रोध से निकलती हुई बताया गया है।
- source_word: devoravit
  choice: निगल गई … भस्म कर दिया
  rationale: पहले कर्म के साथ मूल रूपक ‘निगल गई’ रखा गया है, जबकि पापियों और जलते भूसे की उपमा को सहज हिन्दी में व्यक्त करने के लिए ‘भस्म कर दिया’ प्रयुक्त है। दोनों क्रियाएँ उसी आग के विनाशकारी कार्य को बताती हैं।
- source_word: fundamenta terrae
  choice: पृथ्वी की नींवों
  rationale: बहुवचन fundamenta और उसके विश्वव्यापी, आधारभूत अर्थ को बनाए रखा गया है।
- source_word: peccatores quasi stramen incensum
  choice: पापियों को धधकते भूसे के समान
  rationale: peccatores को ‘पापियों’ और incensum को आग पकड़कर तीव्रता से जलते भूसे के चित्र के रूप में ‘धधकते भूसे’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘जलते भूसे के समान’ उपमा का व्याकरणिक संबंध
  choice: मुख्य पाठ में उपमा को पापियों से जोड़ा गया है
  alternative: उपमा को ‘पृथ्वी की नींवों और पापियों’ दोनों पर लागू समझना
  rationale: लातीनी शब्दक्रम में quasi stramen incensum ठीक peccatores के बाद आता है, इसलिए निकटतम और सबसे स्वाभाविक संबंध पापियों से है; फिर भी विराम-चिह्नरहित संरचना का अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पृथ्वी की नींवों’ और ‘धधकते भूसे’ जैसे सशक्त काव्यात्मक चित्र मूल के प्रलय-संबंधी स्वर को बनाए रखते हैं।
