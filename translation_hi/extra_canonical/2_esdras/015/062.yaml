lexical_decisions:
- source_word: Filios tuos
  choice: तेरे बच्चों को
  rationale: लैटिन filios का अर्थ प्रसंग में संतान/बच्चे है; आधुनिक हिन्दी में ‘बच्चों’ स्वाभाविक और समावेशी है।
- source_word: captiuos ducent
  choice: बंदी बनाकर ले जाएँगे
  rationale: यह अनुवाद बंदी बनाए जाने और दूर ले जाए जाने—दोनों भावों को स्पष्ट रूप से व्यक्त करता है।
- source_word: censum tuum
  choice: तेरी संपत्ति
  rationale: census यहाँ कर या जनगणना नहीं, बल्कि किसी की आंकी हुई संपदा/धन-संपत्ति को सूचित करता है।
- source_word: '[implied predication after censum tuum]'
  choice: लूट लेंगे
  rationale: दिए गए लैटिन अंश का वाक्य ‘censum tuum’ पर अधूरा समाप्त होता है; प्रमाणित अंग्रेज़ी परामर्श-पाठ और विनाश/बंदीकरण के प्रसंग के अनुसार संपत्ति को लूट के रूप में ले जाने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
