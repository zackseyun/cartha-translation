  yaml_path: translation/extra_canonical/2_esdras/015/035.yaml
  text: And they will strike one another and pour out an abundant storm upon the earth[a], their storm[b]; and there will be blood from the sword up to the horse's belly.
translation:
  language: hi
  text: और वे एक-दूसरे पर प्रहार करेंगे और पृथ्वी पर प्रचुर आँधी[a] उँडेलेंगे—उनकी आँधी; और तलवार से लेकर घोड़े के पेट तक लहू बहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'लैटिन sidus का सामान्य अर्थ ‘तारा’ भी हो सकता है। वैकल्पिक रूप से: “पृथ्वी पर एक प्रचुर तारा उँडेलेंगे—उनका तारा।” किंतु यहाँ क्रिया और प्रसंग के कारण ‘आँधी’ का अर्थ अधिक संभावित है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: conlident se invicem
  choice: एक-दूसरे से टकराएँगे
  rationale: परस्पर हिंसक भिड़ंत का अर्थ रखते हुए लैटिन की संरचना के निकट और स्वाभाविक हिन्दी।
- source_word: effundent
  choice: उँडेलेंगे
  rationale: मूल के ‘बहा/उँडेल देना’ वाले सशक्त रूपक को बनाए रखता है।
- source_word: sidus copiosum ... sidus illorum
  choice: प्रचुर आँधी ... अपनी आँधी
  rationale: sidus का सामान्य अर्थ ‘तारा’ है, किंतु यहाँ effundent, copiosum और प्रसंग तूफ़ान/आँधी वाले अर्थ का प्रबल समर्थन करते हैं; पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: a gladio usque ad ventrem equi
  choice: तलवार से इतना खून बहेगा कि वह घोड़े के पेट तक पहुँचेगा
  rationale: शाब्दिक संबंध और भयावह ऊँचाई की छवि को सुबोध आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: sidus की प्रलय-संबंधी छवि
  choice: मुख्य पाठ में ‘आँधी’, पादटिप्पणी में ‘तारा’ की संभावना
  alternative: ‘प्रचुर तारा ... उनका तारा’
  rationale: क्रिया और विशेषण के साथ ‘आँधी’ अधिक संगत है, पर मूल शब्द की वास्तविक बहुअर्थकता को पादटिप्पणी में सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण और प्रलयदर्शी है। मूल की पुनरावृत्ति तथा हिंसक अतिशयोक्तिपूर्ण दृश्य को बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सहज बनाया गया है।
