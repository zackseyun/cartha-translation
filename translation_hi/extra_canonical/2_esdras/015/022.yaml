  yaml_path: translation/extra_canonical/2_esdras/015/022.yaml
  text: My right hand will not spare the sinners[a], nor will the sword cease against those who shed innocent blood upon the earth.
translation:
  language: hi
  text: मेरा दाहिना हाथ पाप करने वालों को नहीं बख्शेगा, और तलवार पृथ्वी पर निर्दोषों का लहू बहाने वालों के विरुद्ध थमेगी नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dextera mea
  choice: मेरा दाहिना हाथ
  rationale: मूल के शाब्दिक और न्याय-संबंधी बिंब को बनाए रखता है; इसे केवल ‘मेरी शक्ति’ कहकर अर्थ नहीं खोला गया।
- source_word: peccantes
  choice: पाप करनेवाले
  rationale: लातीनी वर्तमान कृदंत का कर्मप्रधान भाव बनाए रखता है और सामान्य पाठक के लिए सहज है।
- source_word: romphea
  choice: तलवार
  rationale: यह यूनानी मूल से आया न्याय की तलवार का सामान्य शब्द है; ‘चौड़ी तलवार’ जैसा अनावश्यक ऐतिहासिक-शस्त्रीय विशेषीकरण नहीं जोड़ा गया।
- source_word: effundentes sanguinem innocuum
  choice: निर्दोषों का लहू बहानेवाले
  rationale: ‘लहू बहाना’ हत्या के लिए स्वाभाविक हिन्दी मुहावरा है। ‘निर्दोष लहू’ की अपेक्षा ‘निर्दोषों का लहू’ आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: super
  choice: के विरुद्ध
  rationale: तलवार के न्यायकारी प्रहार के लक्ष्य को प्रसंगानुकूल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: super terram
  choice: पृथ्वी पर
  rationale: मूल स्थान-सूचक वाक्यांश को सीधे बनाए रखता है और निकटतम क्रिया ‘लहू बहाने’ से जोड़ता है।
theological_decisions:
- issue: ‘दाहिने हाथ’ के ईश्वरीय बिंब को कैसे व्यक्त किया जाए
  choice: मेरा दाहिना हाथ
  alternative: मेरी शक्ति
  rationale: मूल का मानवरूपी बिंब जानबूझकर सुरक्षित रखा गया है; उसे अमूर्त व्याख्या में नहीं बदला गया।
- issue: तलवार के न थमने का भाव
  choice: तलवार ... के विरुद्ध थमेगी नहीं
  alternative: तलवार ... को मारना बंद नहीं करेगी
  rationale: मूल में हत्या या प्रहार की क्रिया स्पष्ट रूप से नहीं जोड़ी गई; संक्षिप्त रूप न्याय की तीव्रता बनाए रखते हुए अतिव्याख्या से बचता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लहू बहाना’ बाइबिलीय गंभीरता तथा सामान्य हिन्दी की सहजता दोनों बनाए रखता है। वाक्य की समानांतर न्याय-घोषणा को दो निकटवर्ती उपवाक्यों में सुरक्षित रखा गया है।
