translation:
  language: hi
  text: और मनुष्य की जाँघ और ऊँट के पिछले पैर का जोड़।[a] और पृथ्वी पर बहुत भय और थरथराहट होगी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मनुष्य की जाँघ तक और ऊँट के पिछले पैर के जोड़ तक।”
    reason: पिछले वाक्य से संबंध और निहित दिशा/सीमा को लेकर पाठ की वाक्यगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: femur hominis
  choice: मनुष्य की जाँघ
  rationale: लातीनी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: suffraginem cameli
  choice: ऊँट के पिछले पैर का जोड़
  rationale: suffraginem पशु के पिछले पैर के जोड़, विशेषतः टखने/हॉक, को दर्शाता है; सामान्य पाठक के लिए केवल तकनीकी उधार-शब्द की अपेक्षा यह वर्णन अधिक स्पष्ट है।
- source_word: timor et tremor multus
  choice: बहुत भय और थरथराहट
  rationale: दोनों समानांतर संज्ञाओं को बनाए रखता है और multus के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: super terram
  choice: पृथ्वी पर
  rationale: स्थानसूचक लातीनी अभिव्यक्ति का सटीक और प्रचलित हिन्दी रूप।
