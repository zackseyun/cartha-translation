  text: vindicans vindicabo illos, dicit Dominus, et accipiam omnem sanguinem innocuum ex illis ad me.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/009.yaml
  text: I will surely avenge them[a], says the Lord, and I will require from them all innocent blood for myself.
translation:
  language: hi
  text: प्रभु कहते हैं, “मैं निश्चय ही उनका बदला लूँगा[a], और मैं उनसे निर्दोषों का सारा खून अपने लिए माँगूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बदला लेते हुए मैं उनका बदला लूँगा।”
    reason: मूल लैटिन की बलसूचक पुनरुक्ति का अधिक शाब्दिक रूप।
lexical_decisions:
- source_word: vindicans vindicabo
  choice: मैं निश्चय ही उनका बदला लूँगा
  rationale: सजातीय कृदंत और क्रिया की पुनरुक्ति यहाँ प्रतिशोध की निश्चितता और तीव्रता पर बल देती है; स्वाभाविक हिन्दी में ‘निश्चय ही’ उस बल को व्यक्त करता है।
- source_word: accipiam ... sanguinem innocuum ex illis ad me
  choice: उनसे सारे निर्दोषों के खून का हिसाब अपने लिए लूँगा
  rationale: शाब्दिक ‘निर्दोष खून को अपने पास लूँगा’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा। प्रसंग में निर्दोष रक्त बहाने वालों से जवाबदेही और प्रतिदण्ड लेने का भाव है; ‘खून का हिसाब लेना’ इसे स्वाभाविक रूप से व्यक्त करता है, जबकि ‘अपने लिए’ ad me को सुरक्षित रखता है।
- source_word: sanguinem innocuum
  choice: निर्दोषों का खून
  rationale: लैटिन पद का शाब्दिक अर्थ ‘निर्दोष रक्त’ है, पर हिन्दी में ‘निर्दोषों का खून’ स्पष्ट करता है कि यह निर्दोष लोगों का बहाया गया रक्त है।
theological_decisions:
- issue: प्रतिशोध का कर्ता और अधिकार
  choice: वक्ता प्रभु स्वयं बदला लेने और रक्त का हिसाब लेने की घोषणा करते हैं।
  alternative: इसे केवल सामान्य न्याय या मानवीय प्रतिशोध के रूप में नरम करना।
  rationale: dicit Dominus तथा प्रथम पुरुष क्रियाएँ ईश्वरीय प्रतिशोध और जवाबदेही को स्पष्ट रूप से प्रभु से जोड़ती हैं; अनुवाद इस तनाव को बनाए रखता है।
- issue: ad me का अर्थ
  choice: ‘अपने लिए’ को मुख्य पाठ में बनाए रखा गया।
  alternative: इसे छोड़ देना या केवल ‘मुझ तक’ कहना।
  rationale: लैटिन में यह वाक्यांश उपस्थित है और रक्त के हिसाब पर प्रभु के अपने दावे का संकेत देता है; इसका सटीक संबंध कुछ असामान्य है, इसलिए इसे अत्यधिक व्याख्यायित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘खून का हिसाब लेना’ न्यायिक जवाबदेही और प्रतिदण्ड दोनों का स्वाभाविक बोध देता है।
