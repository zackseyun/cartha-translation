id: 2ES.15.41
reference: 2 Esdras 15:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ignem et grandinem et rompheas volantes et aquas multas, ut etiam impleantur omnes campi et omnes rivi a plenitudine aquarum illarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/041.yaml
  text: fire and hail and flying swords and many waters[b][a], so that even all the fields and all the rivers will be filled from the abundance of those waters.
translation:
  language: hi
  text: आग और ओले, उड़ती हुई तलवारें[a] और बहुत-सा जल, ताकि उस जल की भरमार से यहाँ तक कि सभी मैदान और सभी नाले भर जाएँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उड़ती हुई चौड़ी तलवारें’।
    reason: मूल romphaea एक बड़ी या चौड़ी तलवार को भी सूचित कर सकता है।
  - marker: b
    text: या ‘ताकि सभी मैदान और सभी नाले भी भर जाएँ।’
    reason: लातीनी etiam के बलाघात को हिन्दी में एक से अधिक स्वाभाविक ढंग से रखा जा सकता है।
lexical_decisions:
- source_word: rompheas volantes
  choice: उड़ती हुई तलवारें
  rationale: लातीनी पद का स्वाभाविक और प्रसंगानुकूल अर्थ; ‘चौड़ी तलवारें’ जैसा अधिक तकनीकी रूप सर्वनाश-संबंधी चित्र को अनावश्यक रूप से सीमित करता है।
- source_word: aquas multas
  choice: बहुत-सा जल
  rationale: बहुवचन लातीनी अभिव्यक्ति जल की बड़ी मात्रा बताती है; हिन्दी में ‘बहुत-सा जल’ इसका स्वाभाविक सामूहिक रूप है।
- source_word: omnes campi
  choice: सभी मैदान
  rationale: campi का मूल अर्थ खुले मैदान या समतल भूभाग है; ‘खेत’ कहना अर्थ को केवल कृषि-भूमि तक सीमित कर सकता है।
- source_word: omnes rivi
  choice: सभी नाले
  rationale: rivi छोटी जलधाराओं या नालों को सूचित करता है; ‘नदियाँ’ मूल शब्द से अनावश्यक रूप से बड़ी जलधाराओं का बोध कराता है।
- source_word: a plenitudine aquarum illarum
  choice: उस जल की भरमार से
  rationale: कारण या स्रोत का भाव बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
theological_decisions:
- issue: etiam के बलाघात का स्थान
  choice: यहाँ तक कि सभी मैदान और सभी नाले
  alternative: सभी मैदान और सभी नाले भी
  rationale: etiam को स्पष्ट रूप से व्यक्त किया गया है और जल की असाधारण अधिकता पर बल रखा गया है, बिना किसी अतिरिक्त धर्मवैचारिक व्याख्या के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। सर्वनाश-संबंधी चित्रों को ठोस रखा गया है; तकनीकी शस्त्र-शब्दावली और अनावश्यक व्याख्या से बचा गया है।
