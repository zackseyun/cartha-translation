base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/012.yaml
  text: Let Egypt mourn[a], and its foundations, because of the plague of blows and scourging that the Lord will bring upon it.
translation:
  language: hi
  text: मिस्र और उसकी नींवें प्रहार और कोड़े लगाने की उस विपत्ति के कारण विलाप करें, जिसे प्रभु लाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugeat
  choice: शोक करें
  rationale: लैटिन क्रिया का सीधा अर्थ शोक करना या विलाप करना है; बहुवचनीय संयुक्त कर्ता के अनुसार हिन्दी में बहुवचन रूप स्वाभाविक है।
- source_word: fundamenta eius
  choice: उसकी नींवें
  rationale: मिस्र की बुनियादों के रूपक को व्याख्यात्मक विस्तार दिए बिना अक्षुण्ण रखा गया है।
- source_word: plaga
  choice: विपत्ति
  rationale: यहाँ शब्द उस प्रहारकारी संकट को समेटता है जिसे प्रभु लाएगा; केवल रोग-सूचक ‘महामारी’ अर्थ को अनुचित रूप से सीमित कर देता।
- source_word: verberati et mastigati
  choice: मार और कोड़े
  rationale: दोनों संज्ञाएँ शारीरिक प्रहार की तीव्र, संचयी छवि देती हैं; ‘दण्ड’ जैसे सामान्य शब्द से इस बल को नरम नहीं किया गया।
- source_word: inducet
  choice: लाएगा
  rationale: प्रभु द्वारा विपत्ति लाए जाने का सरल और स्वाभाविक भाव व्यक्त करता है, बिना लैटिन में अनुपस्थित अतिरिक्त विवरण जोड़े।
theological_decisions:
- issue: विपत्ति का कर्ता
  choice: जिसे प्रभु लाएगा
  alternative: जो आ पड़ेगी
  rationale: मूल पाठ स्पष्ट रूप से Dominus को inducet का कर्ता बनाता है; दैवी कर्तृत्व को निष्क्रिय भाषा में धुंधला नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और प्रलय-साहित्य के अनुरूप तीव्र भाषा रखी गई है। अंग्रेज़ी परामर्श-पाठ की ‘chastisement’ वाली वैकल्पिक टिप्पणी lugeat के लैटिन अर्थ से समर्थित नहीं है, इसलिए उसे शामिल नहीं किया गया।
