source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et a territorio Assyriorum subsessor subsedebiteos et consumet unum ex illis, et erit timor et tremor in exercitum illorum et inconstabilitio in regno illorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/033.yaml
  text: And from the territory of the Assyrians an ambusher will lie in wait for them and consume one of them, and there will be fear and trembling in their army and instability in their kingdom.
translation:
  language: hi
  text: और अश्शूरियों के क्षेत्र से एक घात लगाने वाला उनके विरुद्ध घात लगाए बैठेगा और उनमें से एक को नष्ट कर देगा। तब उनकी सेना में भय और कंपकंपी होगी, और उनके राज्य में अस्थिरता होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: territorio Assyriorum
  choice: अश्शूरियों के क्षेत्र से
  rationale: लातीनी संबंधवाचक बहुवचन और भौगोलिक अर्थ को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: subsessor subsedebit eos
  choice: एक घात लगानेवाला उनके लिए घात लगाए बैठेगा
  rationale: ‘subsessor’ में घात लगाकर आक्रमण करनेवाले व्यक्ति का भाव है; ‘subsedebit’ के प्रतीक्षा में छिपे रहने के पक्ष को स्पष्ट रखा गया है।
- source_word: consumet
  choice: नष्ट कर देगा
  rationale: यहाँ क्रिया किसी व्यक्ति के विनाश का संकेत देती है; ‘भस्म करेगा’ अनावश्यक रूप से अग्नि का बिंब जोड़ता।
- source_word: inconstabilitio
  choice: अस्थिरता
  rationale: दुर्लभ लातीनी संज्ञा का आशय स्थिरता के अभाव से है, जिसे संक्षिप्त आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘unum ex illis’ का संदर्भ
  choice: उनमें से एक को
  alternative: उनमें से किसी एक को
  rationale: मूल में unum निश्चित रूप से ‘एक’ कहता है, पर उसका परिचय नहीं देता। इसलिए अस्पष्ट संदर्भ को बनाए रखा गया है और किसी राजा या सेनानायक की पहचान नहीं जोड़ी गई।
- issue: एकवचन ‘regno’ का अर्थ
  choice: उनके राज्य में
  alternative: उनके शासन में
  rationale: ‘regnum’ का सामान्य अर्थ ‘राज्य’ रखा गया है; इसे केवल शासन-व्यवस्था तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध भविष्यदर्शी कथन। ‘भय और कंपकंपी’ मूल के युग्म timor et tremor को बनाए रखता है।
