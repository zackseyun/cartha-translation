  yaml_path: translation/extra_canonical/2_esdras/015/039.yaml
  text: And the winds from the east will grow strong and shut it in[a], along with the cloud that he raised up in wrath; and the star appointed to bring destruction will be violently assailed by the east wind, the south wind[b], and the west wind.
translation:
  language: hi
  text: और पूरब से चलने वाली हवाएँ प्रबल होंगी और उसे तथा उस बादल को, जिसे उसने क्रोध में उठाया था, घेरकर बंद कर देंगी[a]; और विनाश करने के लिए ठहराए गए तारे पर पूर्वी, दक्षिणी[b] और पश्चिमी हवाओं द्वारा हिंसक आक्रमण किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद इस अध्याय के सबसे कठिन लैटिन पाठों में से एक है। यहाँ ब्रह्माण्डीय शक्तियों को घेरकर रोक दिए जाने और अव्यवस्था में पड़ने का सम्भावित अर्थ दिया गया है, पर वाक्य-रचना और सर्वनामों के संकेत अनिश्चित हैं।
    reason: textual_variant
  - marker: b
    text: 'एक अन्य सम्भव अनुवाद है: “और उस बादल को, जिसे उसने क्रोध में उठाया था, तथा पूरब और पश्चिम की ओर विनाश करने के लिए ठहराए गए तारे को अव्यवस्था में डाल दिया जाएगा।”'
    reason: previous_rendering
lexical_decisions:
- source_word: superinvalescent
  choice: प्रबल होंगी
  rationale: क्रिया का भाव हवाओं के अत्यन्त शक्तिशाली हो उठने का है; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: recludent
  choice: घेरकर बंद कर देंगी
  rationale: लैटिन पद का अर्थ संदर्भ में भीतर रोकने या बंद कर देने का है; ‘घेरकर’ ब्रह्माण्डीय शक्तियों द्वारा अवरोध का बोध स्पष्ट करता है, पर अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: nubem quam suscitavit in ira
  choice: उस बादल को, जिसे उसने क्रोध में उठाया था
  rationale: nubem को recludent का दूसरा कर्म माना गया है और सम्बन्धवाचक उपवाक्य की अस्पष्ट कर्तृ-संज्ञा ‘उसने’ के रूप में सुरक्षित है।
- source_word: sidus ad faciendam exteritionem
  choice: विनाश करने के लिए ठहराया गया तारा
  rationale: उद्देश्यसूचक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘ठहराया गया’ नियुक्त उद्देश्य का भाव देता है।
- source_word: violabitur
  choice: प्रचण्ड आघात सहेगा
  rationale: शाब्दिक ‘अपमानित/उल्लंघित किया जाएगा’ इस ब्रह्माण्डीय प्रसंग में अस्वाभाविक है; यहाँ हिंसक आक्रमण या विक्षोभ का अर्थ ग्रहण किया गया है।
- source_word: ab orientalem notum et occidentem
  choice: पूरबी, दक्षिणी और पश्चिमी हवाओं के
  rationale: उत्तरकालीन लैटिन में ab के साथ अनियमित कारक-प्रयोग मानते हुए इसे करण/स्रोत और orientalem, notum, occidentem को तीन दिशागत हवाएँ समझा गया है।
theological_decisions:
- issue: क्रोध में बादल उठाने वाले का अनिर्दिष्ट संदर्भ
  choice: ‘उसने’ को बिना स्पष्ट नाम दिए रखा गया
  alternative: ‘परमेश्वर ने’
  rationale: स्रोत में कर्ता सर्वनाम से निहित है; उसे स्पष्ट रूप से परमेश्वर कहना सम्भव अर्थ है, पर पाठ से अधिक निश्चितता जोड़ देगा।
- issue: तारे का विनाशकारी उद्देश्य
  choice: ‘विनाश करने के लिए ठहराया गया’
  alternative: ‘विनाश लाने वाला’
  rationale: यह उद्देश्य/नियुक्ति का भाव सुरक्षित रखता है, पर यह निश्चित नहीं करता कि नियुक्त करने वाला कौन है या विनाश नैतिक रूप से किस प्रकार समझा जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। कठिन लैटिन वाक्य-विन्यास को मुख्य पाठ में पठनीय बनाया गया है, जबकि वास्तविक पाठगत अनिश्चितता पादटिप्पणियों में स्पष्ट रूप से सुरक्षित है।
