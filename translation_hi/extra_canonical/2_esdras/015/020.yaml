  text: ecce ego convoco, dicit Deus, omnes reges terrae ad movendum, qui sunt a borea et a noto et ab euro et a libano, ad convertendos in se et reddere quae dederunt illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/020.yaml
  text: Behold[a], I am summoning, says God, all the kings of the earth to stir up, those who are from the north and the south and the east and Lebanon, to turn against one another and repay what they gave them.
translation:
  language: hi
  text: देखो, परमेश्वर कहता है, मैं पृथ्वी के सभी राजाओं को उकसाने के लिए बुला रहा हूँ—उन राजाओं को जो उत्तर, दक्षिण, पूर्व और दक्षिण-पश्चिम[a] से हैं—ताकि वे एक-दूसरे के विरुद्ध हो जाएँ और जो कुछ उन्होंने उन्हें दिया है, उसे उन्हें लौटा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन पाठ में यहाँ शाब्दिक रूप से ‘लबानोन’ है; सम्भवतः यह दक्षिण-पश्चिमी पवन अथवा दिशा के नाम का प्राचीन पाठ-भ्रंश है।
    reason: पांडुलिपीय पाठ और चार दिशाओं/पवनों की प्रसंगगत सूची से सम्भावित मूल अर्थ—दोनों को पारदर्शी रूप से सुरक्षित रखना।
lexical_decisions:
- source_word: ecce
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले लैटिन उद्घोष का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: convoco
  choice: बुला रहा हूँ
  rationale: वर्तमानकालीन प्रथम पुरुष क्रिया और व्यापक रूप से एकत्र बुलाने के भाव को व्यक्त करता है।
- source_word: ad movendum
  choice: भड़काने के लिए
  rationale: संदर्भ में राजाओं को संघर्ष के लिए उकसाने या सक्रिय करने का भाव है; केवल ‘हिलाने’ का शाब्दिक रूप हिन्दी में अस्पष्ट और अस्वाभाविक होता।
- source_word: a borea et a noto et ab euro et a libano
  choice: उत्तर, दक्षिण, पूर्व और दक्षिण-पश्चिम से
  rationale: पहले तीन पद दिशासूचक पवनों के नाम हैं। ‘a libano’ को पाठ-भ्रंश मानकर अपेक्षित चौथी दिशा, दक्षिण-पश्चिम, दी गई है; पांडुलिपीय रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ad convertendos in se
  choice: ताकि वे एक-दूसरे के विरुद्ध हो जाएँ
  rationale: पारस्परिक विरोध की दिशा में मुड़ने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: reddere quae dederunt illis
  choice: जो कुछ उन्होंने उन्हें दिया था, वही उन्हें लौटा दें
  rationale: मूल के ‘देने’ और ‘लौटाने’ के शब्द-खेल तथा सर्वनामों की अस्पष्टता को बिना किसी पक्ष की पहचान तय किए बनाए रखता है।
theological_decisions:
- issue: परमेश्वर द्वारा राजाओं को संघर्ष के लिए बुलाना
  choice: कारणात्मक और न्यायसूचक तनाव को यथावत रखा गया
  alternative: इसे केवल परमेश्वर की अनुमति या निष्क्रिय पूर्वजानकारी के रूप में प्रस्तुत करना
  rationale: लैटिन में परमेश्वर स्वयं ‘मैं बुलाता हूँ’ कहता है; अनुवाद को इस कथन की तीक्ष्णता कम नहीं करनी चाहिए।
- issue: प्रतिदान पाने और देने वाले पक्षों की पहचान
  choice: ‘उन्होंने’ और ‘उन्हें’ की अस्पष्टता बनाए रखी गई
  alternative: किसी विशेष राष्ट्र, राजा या शत्रु को स्पष्ट रूप से कर्ता या प्राप्तकर्ता बनाना
  rationale: लैटिन सर्वनाम संदर्भगत रूप से अस्पष्ट हैं; धर्मवैचारिक या ऐतिहासिक अनुमान जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यवाणी-संबंधी उद्घोष की गरिमा बनाए रखते हुए वाक्य को सामान्य पाठक के लिए स्पष्ट रखा गया है। दिशाओं की सूची को डैश से अलग किया गया है, और अंतिम खंड में मूल के सर्वनामगत तनाव को जानबूझकर नहीं सुलझाया गया।
