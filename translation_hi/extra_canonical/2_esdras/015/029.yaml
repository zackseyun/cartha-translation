  text: et exient nationes draconum Arabum in curris multis, et sibilatus eorum a die itinerisfertur super terram, ut etiam timeant et trepidentur omnes qui illos audient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/029.yaml
  text: And nations of Arabian dragons will come out with many chariots[a], and their hissing is carried over the earth from a day's journey away[b], so that all who hear them will fear and tremble.
translation:
  language: hi
  text: और अरबी अजगरों की जातियाँ बहुत-से रथों में निकलेंगी[a], और उनकी फुफकार एक दिन की यात्रा की दूरी से धरती भर में फैल जाएगी[b], ताकि वे सब जो उन्हें सुनेंगे भयभीत होकर काँप उठें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अरबी अजगरों की जातियाँ” कठिन लैटिन पदबंध nationes draconum Arabum का निकट अनुवाद है। यह चित्र प्रतीकात्मक, दैत्याकार या किसी जातीय समूह से संबंधित हो सकता है, पर केवल उपलब्ध लैटिन के आधार पर इसका आशय पूरी तरह निश्चित नहीं किया जा सकता।
    reason: textual_variant
  - marker: b
    text: अर्थात उनकी फुफकार एक दिन में तय की जाने वाली यात्रा की दूरी से सुनाई देती है। कुछ पुराने अनुवादों में इसे “उनके कूच के दिन से” समझा गया है।
    reason: previous_rendering
lexical_decisions:
- source_word: nationes draconum Arabum
  choice: अरबी अजगरों की जातियाँ
  rationale: कठिन लैटिन पदबंध की संरचना और उसकी अनिश्चित प्रतीकात्मक, दैत्याकार अथवा जातीय छवि को निकटता से बनाए रखता है।
- source_word: in curris multis
  choice: बहुत-से रथों के साथ
  rationale: लैटिन में रथों की बहुलता और उनके साथ निकलने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: sibilatus eorum
  choice: उनकी फुफकार
  rationale: अजगर-संबंधी प्रसंग में sibilatus के सीटी-जैसे भयावह ध्वनि-बिंब को सहज हिन्दी में रखता है।
- source_word: a die itineris
  choice: एक दिन की यात्रा जितनी दूरी से
  rationale: इसे समय-सूचक 'उनकी यात्रा के दिन से' न मानकर दूरी की प्रचलित माप, अर्थात एक दिन की यात्रा की दूरी, के रूप में प्रस्तुत करता है।
- source_word: timeant et trepidentur
  choice: भयभीत होकर काँप उठें
  rationale: दोनों समांतर भय-सूचक क्रियाओं की तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अरबी अजगरों की पहचान
  choice: अस्पष्ट छवि को शाब्दिक निकटता से बनाए रखा गया
  alternative: इसे किसी निश्चित ऐतिहासिक जाति, सेना या अलौकिक प्राणी के रूप में स्पष्ट करना
  rationale: लैटिन पाठ अकेले इस छवि की प्रकृति निश्चित नहीं करता; इसलिए किसी संप्रदायगत या निजी व्याख्या को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण और भविष्यवाणी-सदृश है। कठिन मूल छवि को सरल बनाकर निश्चित अर्थ नहीं दिया गया। “सुनाई देगी” लैटिन fertur super terram का स्वाभाविक प्रसंगानुकूल रूप है।
