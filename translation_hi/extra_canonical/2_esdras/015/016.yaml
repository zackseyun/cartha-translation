source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erit enim constabilitio hominibus, alisalios supervalescentes non curabunt regem suum et principem megestanorum suorum in potentia sua.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/016.yaml
  text: For there will be instability among men; overpowering one another[a], they will pay no attention to their king or to the chief of their nobles, in their power.
translation:
  language: hi
  text: क्योंकि लोगों में अस्थिरता होगी; वे एक-दूसरे पर हावी होते हुए अपने राजा और अपने कुलीनों के प्रधान की परवाह नहीं करेंगे, अपनी शक्ति में।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में “अपनी शक्ति में” वाक्य के अंत में है; इसका संबंध “एक-दूसरे पर हावी होते हुए” से भी हो सकता है।
    reason: अंतिम पदबंध in potentia sua का व्याकरणिक संबंध अस्पष्ट है; हिन्दी में उसके असामान्य किंतु निकटस्थ वाक्यांत-स्थान को रखकर अस्पष्टता सुरक्षित की गई है।
lexical_decisions:
- source_word: constabilitio
  choice: अस्थिरता
  rationale: इस असामान्य लैटिन रूप को प्रसंग और उपलब्ध पाठ-परंपरा के अनुसार सामाजिक अव्यवस्था या अस्थिरता के अर्थ में लिया गया है।
- source_word: alii alios supervalescentes
  choice: एक-दूसरे पर हावी होते हुए
  rationale: परस्पर एक-दूसरे से अधिक बलवान होने या दबाने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: non curabunt
  choice: परवाह नहीं करेंगे
  rationale: लैटिन क्रिया यहाँ राजा और प्रधान के अधिकार की उपेक्षा करने का भाव देती है।
- source_word: principem megestanorum suorum
  choice: अपने सामंतों के प्रधान
  rationale: principem की एकवचनता और megestanorum के कुलीन अथवा उच्च पदस्थ सामंतों वाले अर्थ—दोनों को सुरक्षित रखता है।
- source_word: in potentia sua
  choice: अपनी ही शक्ति के बल पर
  rationale: वाक्यांत के इस पदबंध को हिन्दी में बोधगम्य रखते हुए आत्मबल पर निर्भर होकर अधिकार की उपेक्षा करने का भाव दिया गया है; इसके व्याकरणिक संबंध की अस्पष्टता पाद-टिप्पणी में बताई गई है।
