  text: They will be fire to you. And they will devour you and your cities, your land and your mountains; all your forests and your fruitful trees they will burn with fire.
translation:
  language: hi
  text: वे तेरे लिए आग होंगे। वे तुझे और तेरे नगरों को, तेरे देश और तेरे पहाड़ों को निगल जाएँगे; तेरे सारे जंगलों और फलदार पेड़ों को वे आग से जला देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erunt tibi ignis
  choice: वे तेरे लिए आग बन जाएँगे
  rationale: लातीनी विधेय-वाक्य की तीखी रूपकात्मकता को बनाए रखते हुए इसे स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: deuorabunt
  choice: निगल जाएँगे
  rationale: ‘खा जाना/भक्षण करना’ के विनाशकारी रूपक को ‘निगल जाना’ स्वाभाविक और प्रभावशाली हिन्दी में सुरक्षित रखता है।
- source_word: ciuitates tuas
  choice: तेरे नगरों को
  rationale: बहुवचन और द्वितीय पुरुष एकवचन संबंधवाचक रूप को सीधे सुरक्षित रखा गया है।
- source_word: terram
  choice: तेरे देश
  rationale: इस विनाश-सूची में ‘भूमि’ की अपेक्षा ‘देश’ अधिक स्वाभाविक है और संबोधित समुदाय के भूभाग का अर्थ देता है।
- source_word: fruitful trees
  choice: फलदार पेड़ों
  rationale: परामर्श-पाठ में सुरक्षित शेष पदांश के अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त किया गया है।
