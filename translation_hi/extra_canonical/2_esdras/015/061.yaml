translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यसूचक और विनाशसूचक स्वर को गरिमापूर्ण किंतु सहज रखा गया है। संबोधन मूल के एकवचन ‘tibi/tuas’ के अनुरूप ‘तेरे’ से किया गया है। उपलब्ध लातीनी उद्धरण ‘terram’ पर कटता है; आगे का पदांश लेखापरीक्षित अंग्रेज़ी परामर्श-पाठ के आधार पर प्रस्तुत है।
