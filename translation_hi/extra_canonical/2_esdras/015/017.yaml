translation:
  language: hi
  text: क्योंकि मनुष्य किसी नगर में जाना चाहेगा, और जा नहीं सकेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enim
  choice: क्योंकि
  rationale: यह पिछले कथन से कारणात्मक/व्याख्यात्मक संबंध जोड़ता है और लैटिन संयोजक को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: homo
  choice: मनुष्य
  rationale: यह सामान्य, अनिर्दिष्ट व्यक्ति के अर्थ को स्वाभाविक और समावेशी ढंग से व्यक्त करता है।
- source_word: in civitatem ire
  choice: किसी नगर में जाना
  rationale: अनिर्दिष्ट लैटिन civitatem को हिन्दी में स्वाभाविक रूप से ‘किसी नगर’ कहा गया है; in के गंतव्य-सूचक अर्थ को ‘में जाना’ व्यक्त करता है।
- source_word: concupiscet
  choice: चाहेगा
  rationale: संदर्भ में यह किसी गंतव्य तक जाने की प्रबल इच्छा को बताता है; ‘चाहेगा’ आधुनिक हिन्दी में सहज है और अनावश्यक रूप से कामना की नैतिक छाया नहीं जोड़ता।
- source_word: non poterit
  choice: जा नहीं सकेगा
  rationale: लैटिन में निहित पूरक क्रिया ire को हिन्दी में दोहराने से असमर्थता का आशय स्पष्ट और स्वाभाविक बनता है।
