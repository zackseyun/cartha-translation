id: 2ES.15.51
reference: 2 Esdras 15:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: exsurget ardor qui emissus est super te. Et infirmaberis et paupera a plaga et mastigata a uulneribus, ut non possis tuos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/051.yaml
  text: The burning that has been sent out against you will rise up[a], and you will be weakened and made poor by the blow, and scourged by wounds, so that you will not be able to receive your own.
translation:
  language: hi
  text: तुम पर भेजी गई ज्वाला भड़क उठेगी। तुम निर्बल हो जाओगी, प्रहार से दयनीय हो जाओगी और घावों से पीटी जाओगी, यहाँ तक कि तुम अपनों को ग्रहण न कर सकोगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लैटिन पाठ ‘ताकि तुम अपनों को … न कर सको’ पर समाप्त होता है; ‘ग्रहण’ पाठ को अर्थपूर्ण बनाने के लिए जोड़ी गई पूरक क्रिया है।
    reason: मूल लैटिन possis tuos पर खंडित है; tuos के बाद अपेक्षित क्रिया उपलब्ध नहीं है।
lexical_decisions:
- source_word: ardor
  choice: ज्वाला
  rationale: यहाँ शब्द दंडस्वरूप भेजी गई दहकती आग या ताप को व्यक्त करता है; ‘ज्वाला भड़क उठेगी’ हिन्दी में exsurget के साथ स्वाभाविक और सजीव है।
- source_word: paupera a plaga
  choice: प्रहार से दीन
  rationale: paupera केवल आर्थिक निर्धनता नहीं, प्रहार के कारण हुई दयनीय और असहाय दशा भी बता सकता है; plaga को निकटवर्ती शारीरिक दंड की छवि के अनुसार ‘प्रहार’ रखा गया है।
- source_word: mastigata a uulneribus
  choice: घावों से ताड़ित
  rationale: mastigata में कोड़े मारने या कठोर दंड देने का भाव है और uulneribus घावों को दर्शाता है; अनगढ़ शाब्दिकता से बचते हुए दोनों तत्व सुरक्षित रखे गए हैं।
- source_word: tuos
  choice: अपनों को
  rationale: यह बहुवचन विशेषण संज्ञा के बिना प्रयुक्त है और आशय ‘तुम्हारे अपने लोग’ है; ‘अपनों’ से उसका खुलापन बना रहता है।
theological_decisions:
- issue: दंड की छवि
  choice: आग, प्रहार और शारीरिक ताड़ना की परस्पर जुड़ी छवियाँ बनाए रखी गईं।
  alternative: plaga को ‘महामारी’ और paupera को आर्थिक ‘कंगाल’ समझना।
  rationale: निकटवर्ती mastigata और uulneribus शारीरिक प्रहार और घाव की छवि का समर्थन करते हैं; महामारी का अर्थ यहाँ अनावश्यक रूप से अलग रूपक लाता।
- issue: खंडित अंतिम वाक्यांश
  choice: अर्थपूर्ण हिन्दी के लिए ‘ग्रहण’ क्रिया दी गई और पाठ की अपूर्णता पादटिप्पणी में स्पष्ट की गई।
  alternative: 'वाक्य को असंपूर्ण छोड़ देना: ‘ताकि तुम अपने... न कर सको।’'
  rationale: उपलब्ध लैटिन possis tuos पर टूटता है और अपेक्षित क्रिया लुप्त है; मुख्य पाठ को पठनीय रखते हुए पूर्ति को निश्चित मूल-पाठ न मानना वास्तविक पाठगत अनिश्चितता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्त्रीलिंग क्रियाएँ उस स्त्रीलिंग संबोधित सत्ता—संभवतः नगर या साम्राज्य—के अनुरूप हैं।
