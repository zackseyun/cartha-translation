translation:
  language: hi
  text: “क्या मैं तुम्हारे विषय में इस प्रकार ईर्ष्यालु होऊँगा[a]?” प्रभु कहता है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं तुम्हारे विषय में इस प्रकार उत्साहपूर्ण रोष दिखाऊँगा?” लातीनी zelabo में ईर्ष्या/जलन और उत्कट उत्साह का अर्थ-तनाव है; निकट प्रसंग में बाद वाला अर्थ न्यायिक रोष का संकेत दे सकता है।
    reason: zelabo के अर्थगत विस्तार को सुरक्षित रखते हुए मुख्य पाठ में लातीनी के प्रत्यक्ष-कर्म संबंध को बनाए रखना।
lexical_decisions:
- source_word: zelabo
  choice: प्रचण्ड न हो उठूँगा
  rationale: लातीनी भविष्यकालीन क्रिया यहाँ शहीदों के रक्त के प्रतिशोध और न्याय के प्रसंग में तीव्र उत्साहपूर्ण रोष व्यक्त करती है। आधुनिक हिन्दी में ‘ईर्ष्या करना’ भ्रामक हो सकता है; ‘प्रचण्ड हो उठना’ भाव और न्यायिक तीव्रता को स्वाभाविक ढंग से रखता है।
- source_word: te
  choice: तुम्हारे विरुद्ध
  rationale: द्वितीय पुरुष एकवचन को सुरक्षित रखते हुए प्रसंगानुसार विरोधात्मक संबंध व्यक्त किया गया है।
- source_word: Numquid
  choice: क्या ... न
  rationale: लातीनी प्रश्नवाचक कण अपेक्षित नकारात्मक उत्तर की ओर संकेत करता है; हिन्दी का ‘क्या ... न’ उस आलंकारिक बल को बनाए रखता है।
- source_word: sic
  choice: इस प्रकार
  rationale: मूल के ढंग अथवा मात्रा-सूचक अर्थ को औपचारिक किंतु सहज हिन्दी में रखा गया है।
theological_decisions:
- issue: zelabo में ‘उत्साहपूर्ण रोष’ और ‘ईर्ष्या’ की अर्थ-संभावना
  choice: मुख्य पाठ में ‘प्रचण्ड न हो उठूँगा’
  alternative: ‘तुम्हारे विरुद्ध ऐसा ईर्ष्यालु न होऊँगा’
  rationale: न्याय और प्रतिशोध का निकट प्रसंग प्रचण्ड रोष के अर्थ का समर्थन करता है, फिर भी पारंपरिक ‘ईर्ष्या’ वाली व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण और आलंकारिक है। प्रश्न की भविष्यकालीन दिशा तथा मूल की अर्थगत तनातनी सुरक्षित रखी गई है। उपलब्ध लातीनी उद्धरण में ‘प्रभु कहता है’ नहीं दिखता, पर परामर्श-पाठ में संरक्षित वचन-सूत्र के रूप में इसे रखा गया है।
