language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'deus: Inmittam tibi mala, uiduitatem, paupertatem et famem et gladium et pestem ad deuastandas domus tuas, ad uiolationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/049.yaml
  text: 'I will send evils upon you: widowhood and poverty and famine and sword and pestilence[a], to lay waste your houses, for violation'
translation:
  language: hi
  text: परमेश्वर कहता है, “मैं तुझ पर विपत्तियाँ भेजूँगा—विधवा हो जाना, निर्धनता, अकाल, तलवार और महामारी—तेरे घरों को उजाड़ने के लिए, उल्लंघन के लिए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी «uiolatio» का अर्थ ‘उल्लंघन’, ‘अपवित्रीकरण’ या संदर्भानुसार ‘विध्वंस’ हो सकता है। यहाँ इसका सटीक संबंध और आशय अनिश्चित है; यह अगले पद के साथ भी वाक्यात्मक रूप से जुड़ सकता है।
    reason: «ad uiolationem» को स्रोत के समानांतर उद्देश्य-वाक्यांश के रूप में रखते हुए उसके अनिश्चित अर्थ और पद-विभाजन की सम्भावना सुरक्षित रखता है।
lexical_decisions:
- source_word: Inmittam tibi mala
  choice: मैं तुझ पर विपत्तियाँ भेजूँगा
  rationale: लातीनी वाक्य का प्रत्यक्ष और स्वाभाविक हिन्दी रूप; बहुवचन mala को सामान्य ‘बुराइयाँ’ के बजाय प्रसंगानुकूल ‘विपत्तियाँ’ कहा गया है।
- source_word: uiduitatem
  choice: विधवापन
  rationale: यह अमूर्त संज्ञा widowhood को दर्शाती है; ‘विधवा होना’ की अपेक्षा सूची में ‘विधवापन’ अधिक समानांतर है।
- source_word: paupertatem et famem et gladium et pestem
  choice: निर्धनता, अकाल, तलवार और महामारी
  rationale: चारों विपत्तियों को स्रोत के क्रम में रखा गया है; ‘तलवार’ युद्धजनित हिंसा का पारंपरिक रूपक भी बनाए रखती है।
- source_word: ad deuastandas domus tuas
  choice: ताकि तेरे घर उजाड़े जाएँ
  rationale: उद्देश्यसूचक ad और gerundive को स्पष्ट उद्देश्य-वाक्य में व्यक्त किया गया है।
- source_word: ad uiolationem
  choice: और उनका अपमान हो
  rationale: दूसरे समानांतर ad-वाक्यांश को अलग उद्देश्य के रूप में रखा गया है; violatio के उल्लंघन, अपमान या अपवित्रीकरण के अर्थक्षेत्र को देखते हुए ‘अपमान’ चुना गया है।
theological_decisions:
- issue: विपत्तियों का कर्ता
  choice: परमेश्वर स्वयं कहता है, ‘मैं ... भेजूँगा’
  alternative: निष्क्रिय रूप में कहना कि विपत्तियाँ आने दी जाएँगी
  rationale: स्रोत में Inmittam प्रथम पुरुष सक्रिय क्रिया है; उसे नरम करके केवल अनुमति देना पाठ में नहीं जोड़ा गया।
- issue: ad uiolationem का संबंध
  choice: इसे घर उजाड़ने के समानांतर दूसरा उद्देश्य माना गया
  alternative: इसे ‘उल्लंघन के साथ’ जैसा रीति-सूचक वाक्यांश मानना
  rationale: दोनों ad-वाक्यांशों की समानांतर रचना अलग-अलग उद्देश्य का समर्थन करती है; अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वाणी-सदृश शैली रखी गई है। एकवचन tibi/tuas के लिए ‘तुझ/तेरे’ चुना गया है। स्रोत में पद के अंत की वाक्यरचना अगले पद से जुड़ सकती है; फिर भी उपलब्ध इकाई को हिन्दी में पठनीय वाक्य बनाया गया है और मुख्य अनिश्चितता पादटिप्पणी में दी गई है।
