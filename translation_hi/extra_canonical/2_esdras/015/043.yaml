  text: उनके चरागाहों और उनके अनाज को। और वे लगातार आगे बढ़ेंगे, जहाँ तक—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pratorum
  choice: चरागाहों
  rationale: यह pratum के संबंधकारक बहुवचन का स्वाभाविक हिन्दी रूप है; खंडित वाक्य में पिछले पद से इसका व्याकरणिक संबंध बना रहता है।
- source_word: frumenta
  choice: अनाज
  rationale: संदर्भ में बहुवचन लैटिन शब्द खेत की उपज अथवा अन्न को सामूहिक रूप से दर्शाता है; आधुनिक हिन्दी में ‘अनाज’ सहज है।
- source_word: transibunt
  choice: आगे बढ़ते हुए
  rationale: यहाँ क्रिया किसी भूभाग से होकर लगातार आगे जाने का भाव देती है; अगले ‘usque’ के साथ गंतव्य अभी अधूरा है।
- source_word: constanter
  choice: दृढ़ता से
  rationale: क्रिया-विशेषण निरंतर और अडिग ढंग से आगे बढ़ने का भाव रखता है; ‘दृढ़ता से’ उस बल को संक्षेप में सुरक्षित रखता है।
- source_word: usque
  choice: जहाँ तक
  rationale: लैटिन अंश इसी शब्द पर टूटता है और आगे सीमा या गंतव्य अपेक्षित है; ‘जहाँ तक—’ उस अपूर्णता को स्पष्ट रखता है।
theological_decisions:
- issue: अपूर्ण स्रोत-पाठ और अगले गंतव्य का अभाव
  choice: वाक्य को ‘जहाँ तक—’ पर खुला और अपूर्ण रखा गया
  alternative: अगले संदर्भ से ‘बाबुल तक’ अथवा विनाश का कथन जोड़ना
  rationale: दिए गए लैटिन स्रोत में गंतव्य या विनाश का कथन नहीं है; उसे जोड़ना स्रोत से परे जाकर अर्थ पूरा करना होता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। यह पद आरंभ और अंत दोनों ओर वाक्य-खंड है; विराम और दीर्घ डैश द्वारा स्रोत की वास्तविक अपूर्णता बनाए रखी गई है।
