translation:
  language: hi
  text: और मृत्यु। फिर तेरे सामर्थ्य का वैभव फूल के समान मुरझा जाएगा, जब
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gloria
  choice: वैभव
  rationale: यहाँ शक्ति से प्राप्त गौरव और प्रतिष्ठा का भाव है; ‘वैभव’ इस न्याय-संदर्भ और काव्यात्मक उपमा, दोनों में स्वाभाविक है।
- source_word: uirtutis tuae
  choice: तेरे सामर्थ्य का
  rationale: इस प्रसंग में uirtus नैतिक ‘सद्गुण’ से अधिक शक्ति या सामर्थ्य को दर्शाता है।
- source_word: siccabitur
  choice: मुरझा जाएगा
  rationale: शाब्दिक अर्थ ‘सूख जाएगा’ है, पर फूल की उपमा के साथ आधुनिक हिन्दी में ‘मुरझा जाएगा’ अधिक स्वाभाविक और अर्थनिष्ठ है।
- source_word: cum
  choice: जब
  rationale: लैटिन अंश इसी अधूरे कालवाचक संयोजक पर समाप्त होता है; अनुवाद भी अगले वाक्यांश की प्रतीक्षा बनाए रखता है।
