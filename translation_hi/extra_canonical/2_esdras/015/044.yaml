source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Babylonem et exterent eam. Conuenient ad ipsam et circuibunt eam et effundent sidus et omnem iram super eam, et subibit puluis et fumus usque ad caelum, et omnes in circuitu lugebunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/044.yaml
  text: Babylon[a], and they will destroy her. They will gather against her and surround her and pour out a storm and all wrath upon her, and dust and smoke will rise up to heaven, and all around her will mourn.
translation:
  language: hi
  text: बाबुल को वे नष्ट कर देंगे। वे उसके विरुद्ध इकट्ठे होंगे, उसे चारों ओर से घेर लेंगे और उस पर तूफ़ान[a] और सारा क्रोध उँडेल देंगे। धूल और धुआँ आकाश तक उठेगा, और उसके आस-पास के सब लोग विलाप करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तारा’ या ‘नक्षत्र’।
    reason: Latin sidus का सामान्य अर्थ आकाशीय पिंड है, यद्यपि इस विनाशकारी और ‘उँडेलने’ वाले संदर्भ में ‘तूफ़ान’ अर्थानुकूल है।
lexical_decisions:
- source_word: Babylonem
  choice: बाबुल तक
  rationale: यह कर्मकारक रूप पिछले पद के अंत में आए Latin 'usque ad' (‘तक’) से जुड़ता है। हिन्दी में पद-विभाजन के बावजूद अर्थ स्पष्ट रखने के लिए ‘तक पहुँचेंगे’ किया गया है।
- source_word: exterent
  choice: नष्ट कर देंगे
  rationale: Latin क्रिया का भाव पूरी तरह मिटा देने या नष्ट कर देने का है।
- source_word: Conuenient ad ipsam
  choice: उसके विरुद्ध इकट्ठे होंगे
  rationale: ad ipsam का यहाँ शत्रुतापूर्ण दिशा में उसके पास/विरुद्ध जुटना अभिप्रेत है।
- source_word: circuibunt eam
  choice: उसे चारों ओर से घेर लेंगे
  rationale: शाब्दिक ‘उसके चारों ओर जाएँगे’ को युद्ध-संदर्भ में स्वाभाविक हिन्दी ‘घेर लेंगे’ से व्यक्त किया गया है।
- source_word: sidus
  choice: तूफ़ान
  rationale: sidus का मूल अर्थ तारा/नक्षत्र है, पर मौसम-संबंधी विस्तारित अर्थ और ‘उँडेलने’ के संदर्भ में ‘तूफ़ान’ अधिक संगत है; मूल शब्द की असामान्यता पादटिप्पणी में सुरक्षित है।
- source_word: omnem iram
  choice: अपना सारा क्रोध
  rationale: ‘सारा क्रोध’ स्रोत के अनुरूप है; हिन्दी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपना’ जोड़ा गया है।
- source_word: omnes in circuitu
  choice: उसके चारों ओर रहनेवाले सब लोग
  rationale: स्थान-सूचक वाक्यांश को स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना यह जोड़ने के कि वे अनिवार्यतः नगर के भीतर रहते थे।
- source_word: lugebunt
  choice: विलाप करेंगे
  rationale: यह शोक मनाने और विलाप करने दोनों का भाव रखता है; विनाश के संदर्भ में ‘विलाप’ उपयुक्त है।
theological_decisions:
- issue: sidus की संदिग्ध छवि
  choice: मुख्य पाठ में ‘तूफ़ान’
  alternative: ‘तारा’ या ‘नक्षत्र’
  rationale: Latin sidus सामान्यतः आकाशीय पिंड है, किन्तु मौसम/तूफ़ान का अर्थ भी ले सकता है। ‘उँडेल देंगे’ और प्रलयकारी विनाश के संदर्भ में ‘तूफ़ान’ अर्थपूर्ण है, जबकि पादटिप्पणी मूल की अस्पष्टता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। पद के आरंभ में पिछले पद से जुड़े Latin वाक्यांश को हिन्दी में पूरा और स्वाभाविक बनाने के लिए ‘बाबुल तक पहुँचेंगे’ रखा गया है।
