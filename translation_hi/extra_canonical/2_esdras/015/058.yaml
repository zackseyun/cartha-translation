  yaml_path: translation/extra_canonical/2_esdras/015/058.yaml
  text: and drink their own blood because of hunger for bread and thirst for water[a]. Unhappy one, as the foremost you will come[b], and again you will receive evils.
translation:
  language: hi
  text: और रोटी की भूख तथा पानी की प्यास के कारण अपना ही लहू पिएँगे। हे अभागिनी, तू सबसे प्रमुख के रूप में आएगी[a], और फिर विपत्तियाँ पाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रधान के रूप में।” यहाँ प्रयुक्त लैटिन शब्द का अर्थ पद या प्रतिष्ठा में “प्रमुख” अथवा “सर्वप्रथम” हो सकता है; सटीक भाव अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: sanguinem bibent
  choice: अपना ही लहू पिएँगे
  rationale: ‘लहू पिएँगे’ लैटिन की कठोर और भयावह छवि को सीधे बनाए रखता है; ‘ही’ आत्मवाचक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: a fame panis et siti aquae
  choice: रोटी की भूख तथा पानी की प्यास के कारण
  rationale: कारणसूचक a को ‘के कारण’ से व्यक्त किया गया है और panis/aquae की समानांतर संरचना सुरक्षित रखी गई है।
- source_word: Infelix
  choice: हे अभागी
  rationale: यह संबोधन स्त्रीलिंग में व्यक्ति के रूप में प्रस्तुत सत्ता को लक्ष्य करता है; ‘अभागी’ दुःख और आने वाले अनिष्ट दोनों का भाव देता है।
- source_word: primaria
  choice: सबसे प्रमुख
  rationale: इस कठिन स्त्रीलिंग विशेषण का मूल भाव पद अथवा प्रतिष्ठा में अग्रता है; स्रोत में स्पष्ट तुलना-समूह न होने के कारण ‘स्त्रियों में’ नहीं जोड़ा गया।
- source_word: mala
  choice: विपत्तियाँ
  rationale: इस न्याय-वाणी के प्रसंग में सामान्य ‘बुराइयाँ’ की अपेक्षा आने वाले संकटों के लिए ‘विपत्तियाँ’ अधिक स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अकाल की कठोर छवि को नरम नहीं किया गया। उपलब्ध लैटिन अंश आरम्भ में खंडित है, इसलिए अनुवाद भी ‘और’ से आरम्भ होकर पूर्ववर्ती कथन से जुड़ता है। primaria की वास्तविक अस्पष्टता को मुख्य पाठ और पाद-टिप्पणी में सुरक्षित रखा गया है।
