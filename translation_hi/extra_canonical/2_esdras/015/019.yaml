id: 2ES.15.19
reference: 2 Esdras 15:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non miserebitur homo proximo suo ad irritum faciendum in domos eorum in gladium, ad diripiendas substantias eorum propter famem panis et tribulationem multam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/019.yaml
  text: A man will have no pity on his neighbor, but will rush upon their houses with the sword, plundering their possessions because of hunger for bread and great distress.
translation:
  language: hi
  text: मनुष्य अपने पड़ोसी पर दया नहीं करेगा, बल्कि तलवार लेकर उनके घरों पर टूट पड़ेगा और रोटी की भूख तथा भारी संकट के कारण उनकी संपत्ति लूट लेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non miserebitur
  choice: दया नहीं करेगा
  rationale: लैटिन में भविष्यकालीन निषेध और करुणा के अभाव को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: proximo suo
  choice: अपने पड़ोसी पर
  rationale: proximus यहाँ निकटवर्ती व्यक्ति या पड़ोसी का सामान्य अर्थ देता है; नैतिक निकटता का भाव भी बना रहता है।
- source_word: in domos eorum in gladium
  choice: तलवार लेकर उनके घरों पर टूट पड़ेगा
  rationale: पाठ की असहज लैटिन रचना हिंसक ढंग से घरों पर चढ़ आने का संकेत देती है; यह अनुवाद उसी बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ad diripiendas substantias eorum
  choice: उनकी संपत्ति लूट लेगा
  rationale: diripere हिंसक लूट और substantiae माल-असबाब या संपत्ति को सूचित करता है।
- source_word: propter famem panis
  choice: रोटी की भूख के कारण
  rationale: शाब्दिक संरचना को बनाए रखते हुए भोजन की घोर कमी का स्पष्ट और साधारण बोध देता है।
- source_word: tribulationem multam
  choice: भारी संकट
  rationale: बहुत बड़े क्लेश या दबाव को संक्षिप्त, dignified और संदर्भानुकूल हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एकवचन कर्ता और बहुवचन संबंधसूचक सर्वनाम
  choice: “मनुष्य” को सामान्य एकवचन रखा और “उनके घरों/उनकी संपत्ति” में स्रोत का बहुवचन बनाए रखा
  alternative: 'पूरे वाक्य को बहुवचन करना: “लोग अपने पड़ोसियों…”'
  rationale: स्रोत के homo और suo के सामान्य एकवचन को मिटाए बिना eorum के वास्तविक बहुवचन को सुरक्षित रखता है; संभावित पाठगत असंगति को चुपचाप समतल नहीं करता।
- issue: हिंसा का वर्णन
  choice: इसे भावी संकट में मानव आचरण के वर्णन के रूप में रखा
  alternative: इसे ईश्वरीय आदेश या अनुमोदन के रूप में स्पष्ट करना
  rationale: लैटिन पाठ केवल होने वाली निर्दय हिंसा का वर्णन करता है; उसमें कोई स्पष्ट ईश्वरीय आदेश नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गंभीर भविष्यवाणी-सदृश लहजा। वाक्य सामान्य पाठक के लिए सहज रखा गया है, जबकि मूल के एकवचन “मनुष्य/पड़ोसी” और बहुवचन “उनके” के बीच तनाव सुरक्षित है।
