  text: then these will be thrown into confusion and fall silent because of their strength[a], and they will turn their feet to flight.
translation:
  language: hi
  text: तब ये लोग विचलित हो जाएँगे और उनकी सामर्थ्य के कारण चुप हो जाएँगे,[a] और अपने पाँव मोड़कर भाग जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी सामर्थ्य के सामने चुप हो जाएँगे।”
    reason: लैटिन in virtute illorum को कारणसूचक “के कारण” के अतिरिक्त उनकी सामर्थ्य के सम्मुख होने की प्रतिक्रिया के रूप में भी समझा जा सकता है; silebunt सक्रिय ही रहता है।
lexical_decisions:
- source_word: turbabuntur
  choice: घबरा जाएँगे
  rationale: लैटिन का भाव उलझन, व्याकुलता और भय से उत्पन्न घबराहट है; यह आधुनिक हिन्दी में स्वाभाविक रूप से वही प्रभाव देता है।
- source_word: silebunt
  choice: चुप हो जाएँगे
  rationale: यह भविष्यत् सक्रिय रूप है—‘चुप हो जाएँगे’, न कि कर्मवाच्य ‘चुप करा दिए जाएँगे’।
- source_word: in virtute illorum
  choice: उनकी सामर्थ्य के कारण
  rationale: यहाँ in का प्रसंगगत अर्थ कारणसूचक है; illorum का बहुवचन संबंधवाचक अर्थ ‘उनकी’ रखा गया है।
- source_word: convertent pedes suos in fugam
  choice: अपने पाँव भागने के लिए मोड़ लेंगे
  rationale: मूल के देहगत मुहावरे को बनाए रखते हुए हिन्दी में पलायन की ओर मुड़ने का अर्थ स्पष्ट किया गया है।
