source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam non silebo impietates eorum quae inreligiose agunt, nec sustinebo in his quae inique exercent. ecce sanguis innoxius et iustus clamat ad me, et animae iustorum clamant perseveranter.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/008.yaml
  text: I will no longer keep silent about their impieties[a], which they commit irreligiously, nor will I endure the things they carry out unjustly. Behold, innocent and righteous blood cries out to me, and the souls of the righteous cry out continually.
translation:
  language: hi
  text: अब मैं उनके अधर्मी कामों के विषय में चुप नहीं रहूँगा, जिन्हें वे अधार्मिक रीति से करते हैं; और जो कुछ वे अन्याय से करते हैं, उसे मैं सहन नहीं करूँगा। देखो, निर्दोष और धर्मियों का लहू मुझे पुकारता है, और धर्मियों की आत्माएँ लगातार पुकारती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impietates
  choice: अधर्म के काम
  rationale: बहुवचन संज्ञा का नैतिक और धार्मिक बल बनाए रखते हुए इसे आधुनिक हिन्दी में स्वाभाविक और स्पष्ट रखा गया है।
- source_word: inreligiose agunt
  choice: भक्तिहीन होकर करते हैं
  rationale: inreligiose केवल धार्मिक आचरण की कमी नहीं, बल्कि श्रद्धा-विरुद्ध रीति से किए गए कामों को दर्शाता है; ‘भक्तिहीन होकर’ इस धार्मिक-नैतिक बल को संक्षेप में रखता है।
- source_word: sustinebo
  choice: सहन नहीं करूँगा
  rationale: यहाँ क्रिया का अर्थ अन्याय को आगे सहते या बरदाश्त करते रहने से इनकार करना है।
- source_word: sanguis innoxius et iustus
  choice: निर्दोष और धर्मी जनों का लहू
  rationale: लैटिन में विशेषण सीधे ‘लहू’ के साथ हैं, पर आशय उन निर्दोष और धर्मी लोगों के लहू से है जिनके विरुद्ध हिंसा हुई; हिन्दी में यह रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: perseveranter
  choice: लगातार
  rationale: निरंतर और दृढ़तापूर्वक जारी पुकार का मूल भाव सरल आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: लहू और आत्माओं की पुकार
  choice: दोनों को वास्तविक कर्ता के रूप में ‘पुकार रहा/रही हैं’ कहा गया
  alternative: इसे केवल रूपक बताकर ‘न्याय की माँग करता है’ कहना
  rationale: स्रोत की सजीव और न्याय-विषयक छवि को बिना व्याख्यात्मक विस्तार या धर्मवैज्ञानिक समाधान के सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’ से ecce का आकस्मिक और जोरदार संकेत सुरक्षित है; वाक्य की समानांतर संरचना भी यथासंभव बनाए रखी गई है।
