  text: tuis qui te cupierunt semper. Fornicarian odibilem imitata es in omnibus operibus eius et adinuentionibus eius; propterea dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/048.yaml
  text: 'You have imitated that hateful prostitute in all her works and devices; therefore God says:'
translation:
  language: hi
  text: 'तूने उस घृणित वेश्या का उसके सभी कामों और युक्तियों में अनुकरण किया है; इसलिए परमेश्वर[a] कहता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में यहाँ केवल “कहता है” है; “परमेश्वर” प्रसंग से समझा गया कर्ता है।
    reason: मूल में निहित कर्ता को हिन्दी में स्पष्ट करने की संपादकीय पूर्ति बताना।
lexical_decisions:
- source_word: Fornicarian odibilem
  choice: उस घृणित वेश्या
  rationale: लैटिन पद एक स्त्रीलिंग कर्मकारक संज्ञा-विशेषण युग्म है। ‘घृणित वेश्या’ मूल के नैतिक आक्रोश को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: imitata es
  choice: तूने … उसका अनुकरण किया है
  rationale: यह स्त्रीलिंग एकवचन संबोधन है। ‘अनुकरण’ केवल समानता नहीं, जान-बूझकर उसके ढंग पर चलने का भाव व्यक्त करता है।
- source_word: in omnibus operibus eius
  choice: उसके हर काम … में
  rationale: ‘हर काम’ omnibus की व्यापकता को सहज हिन्दी में व्यक्त करता है।
- source_word: adinuentionibus eius
  choice: उसकी हर चाल
  rationale: इस प्रसंग में adinventiones का आशय आविष्कार नहीं, रची हुई युक्तियों या कुटिल उपायों से है; ‘चाल’ यह नकारात्मक भाव संक्षेप में रखता है।
- source_word: propterea
  choice: इसलिए
  rationale: पूर्ववर्ती आरोप और आगामी दैवी घोषणा के बीच परिणामसूचक संबंध को सीधे व्यक्त करता है।
theological_decisions:
- issue: dicit में कर्ता का लोप
  choice: परमेश्वर कहता है
  alternative: वह कहता है / कहा जाता है
  rationale: दिए गए लैटिन अंश में dicit का कर्ता प्रत्यक्ष रूप से नहीं लिखा है, पर वाक्य आगामी दैवी वचन का परिचय देता है और परामर्श-पाठ भी कर्ता को God समझता है। पारदर्शिता के लिए इसे पादटिप्पणी से चिह्नित किया गया है।
translation_notes:
  register: स्त्रीलिंग एकवचन सत्ता/नगर को सीधे संबोधित करने के लिए ‘तू’ रखा गया है। भाषा आधुनिक और स्पष्ट है, पर भविष्यद्वाणी के कठोर, न्यायसूचक स्वर को नरम नहीं किया गया। प्रारम्भिक शब्द ‘tuis qui te cupierunt semper’ संभवतः पिछले पद का शेष अंश हैं और अंग्रेज़ी परामर्श-पाठ की तरह इस पद में सम्मिलित नहीं किए गए।
