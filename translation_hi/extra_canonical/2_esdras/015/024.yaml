  text: vae eis qui peccant et non observant mandata mea, dicit Dominus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/024.yaml
  text: Woe to those who sin and do not keep my commandments, says the Lord.
translation:
  language: hi
  text: “हाय उन पर जो पाप करते हैं और मेरी आज्ञाओं का पालन नहीं करते!” प्रभु कहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vae eis
  choice: हाय उन पर
  rationale: लैटिन के शोक और न्यायसूचक उद्गार को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: qui peccant
  choice: जो पाप करते हैं
  rationale: peccant का सीधा और प्रचलित धार्मिक अर्थ व्यक्त करता है।
- source_word: non observant mandata mea
  choice: मेरी आज्ञाओं का पालन नहीं करते
  rationale: observant में निहित मानने और आचरण में रखने के भाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: dicit Dominus
  choice: प्रभु कहते हैं
  rationale: भविष्यद्वाणी-सूत्र को वर्तमानकालीन प्रत्यक्ष कथन के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ‘vae’ में शोक और दण्ड-घोषणा का संयुक्त भाव
  choice: हाय उन पर
  alternative: धिक्कार है उन पर
  rationale: ‘हाय’ मूल की अर्थगत व्यापकता बनाए रखता है और केवल निन्दा तक सीमित नहीं करता।
- issue: mandata की वचन-संख्या
  choice: आज्ञाओं
  alternative: आज्ञा
  rationale: लैटिन mandata नपुंसकलिंग बहुवचन है, इसलिए बहुवचन सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और भविष्यद्वाणी-सदृश लहजा। उद्धरण-चिह्न प्रभु के कथन की सीमा स्पष्ट करते हैं; किसी पाद-टिप्पणी की आवश्यकता नहीं है।
