  text: dicit dominus, Nisi occidisses electos meos in omni tempore, exultans percussione manuum et dicens super mortem eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/053.yaml
  text: says the Lord[a], "If you had not killed my chosen ones all along, exulting with the striking of your hands and speaking over their death
translation:
  language: hi
  text: प्रभु कहता है, “यदि तूने हर समय मेरे चुने हुओं की हत्या न की होती, उनकी मृत्यु पर ताली बजाकर आनन्द न मनाते हुए और उनके बारे में बातें न कहते हुए—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वाक्य अगले पद में पूरा होता है। कुछ पुराने रूपान्तरणों में अगले पद के “जब तू मतवाली थी?” शब्द भी इसी पद के अन्त में रखे गए हैं।
    reason: पद-सीमा और अधूरी शर्त को स्पष्ट करना तथा पिछले रूपान्तरण से उत्पन्न सम्भावित भ्रम बताना।
lexical_decisions:
- source_word: dicit dominus
  choice: प्रभु कहता है
  rationale: लातीनी कथन का सीधा और स्वाभाविक रूप; वक्ता की पहचान पद के आरम्भ में सुरक्षित है।
- source_word: Nisi occidisses
  choice: यदि तूने ... न मारा होता
  rationale: nisi और भूतपूर्व संभावनार्थक occidisses को अधूरी शर्त के रूप में रखा गया है, क्योंकि वाक्य अगले पद में जारी रहता है।
- source_word: electos meos
  choice: मेरे चुने हुओं
  rationale: electos का व्यापक अर्थ सुरक्षित है; किसी विशेष धार्मिक पदवी को नहीं जोड़ा गया।
- source_word: in omni tempore
  choice: लगातार
  rationale: शाब्दिक ‘हर समय’ की अपेक्षा प्रसंग में निरन्तर/बार-बार किए गए उत्पीड़न को सहज हिन्दी में व्यक्त करता है।
- source_word: exultans percussione manuum
  choice: हाथ पीट-पीटकर आनन्द न मनाया होता
  rationale: percussione manuum में हाथों को मारने/पीटने की क्रिया तथा exultans में दुर्भावनापूर्ण उल्लास दोनों व्यक्त हैं; केवल ‘तालियाँ बजाकर’ कहने से स्रोत की व्यापक छवि संकुचित हो सकती थी।
- source_word: dicens super mortem eorum
  choice: उनके मारे जाने पर ... बातें न कही होतीं
  rationale: super mortem eorum को ‘उनकी मृत्यु पर/उनके मारे जाने पर’ और dicens को जानबूझकर सामान्य रखा गया है, क्योंकि कही गई बातों की विषयवस्तु इस पद में नहीं दी गई।
theological_decisions:
- issue: चुने हुओं की पहचान
  choice: ‘मेरे चुने हुओं’ को अनिर्दिष्ट रखा गया
  alternative: इसे किसी खास समुदाय या सिद्धान्तगत श्रेणी के रूप में स्पष्ट करना
  rationale: स्रोत केवल electos meos कहता है और इस पद में उनकी पहचान सीमित नहीं करता।
- issue: अधूरी शर्त का स्वरूप
  choice: वाक्य को दीर्घ विराम-चिह्न के साथ अगले पद की ओर खुला रखा गया
  alternative: इस पद में प्रश्न या निष्कर्ष जोड़कर वाक्य पूरा करना
  rationale: लातीनी स्रोत यहाँ dicens super mortem eorum पर रुकता है; अगले पद का पाठ इस पद में आयात नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। स्त्रीलिंग एकवचन संबोधन का संकेत इस खंड के व्यापक प्रसंग से हो सकता है, पर इस पद के उपलब्ध लातीनी क्रियारूप में लिंग प्रत्यक्ष नहीं है; इसलिए हिन्दी में ‘तूने’ स्वाभाविक रूप से अस्पष्ट रहता है।
