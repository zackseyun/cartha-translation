  yaml_path: translation/extra_canonical/2_esdras/015/046.yaml
  text: And you[a], Asia, partner in the splendor of Babylon and in the glory of her person—
translation:
  language: hi
  text: और हे एशिया[a], तू बाबुल के वैभव और उसके स्वरूप की महिमा में सहभागी है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एशिया को बाबुल की सहभागी कहकर संबोधित करना 4 एज्रा के यहूदी मूल-भाग से अलग एक रचनात्मक परत को दर्शाता है। यहाँ की भाषा बाद में जुड़े उस लैटिन मसीही परिशिष्ट की है जिसे सामान्यतः 6 एज्रा कहा जाता है।
    reason: compositional_layer
lexical_decisions:
- source_word: Asia
  choice: एशिया
  rationale: स्थान-नाम को आधुनिक मानक हिन्दी में प्रचलित रूप में रखा गया है; प्रत्यक्ष संबोधन दिखाने के लिए ‘हे’ जोड़ा गया है।
- source_word: consors
  choice: सहभागी
  rationale: यह शब्द साझेदारी अथवा किसी वस्तु में हिस्सा रखने का भाव देता है; ‘सहभागी’ इस संबंध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: species (specie)
  choice: वैभव
  rationale: इस संदर्भ में species बाहरी शोभा, प्रभावशाली रूप या ठाठ का संकेत दे सकता है। ‘वैभव’ बाबुल की दृश्य भव्यता का भाव देता है, जबकि अगला पद persona से अलग रहता है।
- source_word: gloria
  choice: महिमा
  rationale: धार्मिक-साहित्यिक संदर्भ में gloria का स्वाभाविक और व्यापक हिन्दी समतुल्य ‘महिमा’ है।
- source_word: persona (personae)
  choice: स्वरूप
  rationale: persona यहाँ व्यक्ति, रूप या प्रकट पहचान की ओर संकेत कर सकता है। ‘स्वरूप’ अनिश्चितता को बनाए रखता है और एशिया को शाब्दिक मानव-व्यक्तित्व देने से बचता है।
theological_decisions:
- issue: एशिया को बाबुल की सहभागी के रूप में संबोधित करने वाले कथन की रचनात्मक परत
  choice: मुख्य पाठ में संबोधन और आरोप को बिना व्याख्यात्मक विस्तार के यथावत रखा गया है; पादटिप्पणी में बाद की साहित्यिक परत की जानकारी दी गई है।
  alternative: मुख्य पाठ में ही इसे रोमी एशिया अथवा किसी विशिष्ट साम्राज्यवादी शक्ति के रूप में स्पष्ट करना।
  rationale: मूल लैटिन केवल ‘एशिया’ कहता है। किसी विशेष ऐतिहासिक या धार्मिक पहचान को मुख्य पाठ में जोड़ना स्रोत की वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रत्यक्ष संबोधन के कारण काव्यात्मक और भविष्यवाणी-सदृश गरिमा के साथ रखी गई है। एकवचन ‘तू’ प्राचीन नगर अथवा भूभाग के मानवीकरण वाले संबोधन को स्पष्ट करता है और अपमानसूचक नहीं है। अंतिम दीर्घ विराम-चिह्न अगले पद में वाक्य के जारी रहने को दर्शाता है।
