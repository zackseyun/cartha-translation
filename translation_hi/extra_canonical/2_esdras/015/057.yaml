source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ciuitates tuae conterentur, et omnes tui in campo gladio cadent; Et qui sunt in montibus fame peribunt, et manducabunt carnes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/057.yaml
  text: Your cities will be shattered[a], and all your people in the field will fall by the sword. And those in the mountains will perish by famine and will eat flesh.
translation:
  language: hi
  text: तुम्हारे नगर चकनाचूर कर दिए जाएँगे, और तुम्हारे सभी लोग जो मैदान में हैं, तलवार से मारे जाएँगे। जो पहाड़ों में हैं, वे भूख से मर जाएँगे और मांस खाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अगले पद के आरंभिक शब्द को इसके साथ पढ़ने पर: “अपना ही मांस खाएँगे।”'
    reason: लैटिन में carnes इस पद के अंत में और suas (‘अपना’) अगले पद के आरंभ में है; पादटिप्पणी पदों को साथ पढ़ने पर बनने वाला अर्थ बताती है।
lexical_decisions:
- source_word: conterentur
  choice: चकनाचूर कर दिए जाएँगे
  rationale: लैटिन निष्क्रिय क्रिया नगरों के कुचले, तोड़े या नष्ट किए जाने का प्रबल बिंब देती है; यह हिंदी में उस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: omnes tui
  choice: तुम्हारे सभी लोग
  rationale: शाब्दिक अर्थ ‘तुम्हारे सभी’ है; हिंदी में निहित संज्ञा को ‘लोग’ के रूप में स्पष्ट करना स्वाभाविक और अर्थानुकूल है।
- source_word: in campo
  choice: जो मैदान में हैं
  rationale: स्थानसूचक वाक्यांश को लोगों से जोड़कर अनुवाद किया गया है, जिससे लैटिन का आशय स्पष्ट रहता है।
- source_word: gladio cadent
  choice: तलवार से मारे जाएँगे
  rationale: शाब्दिक ‘तलवार से गिरेंगे’ युद्ध में मारे जाने का मुहावरा है; हिंदी में अर्थ स्पष्ट करने वाला स्वाभाविक समतुल्य चुना गया है।
- source_word: fame peribunt
  choice: भूख से मर जाएँगे
  rationale: ‘अकाल/भूख के कारण नष्ट हो जाएँगे’ के अर्थ को साधारण आधुनिक हिंदी में सीधा व्यक्त करता है।
- source_word: manducabunt carnes
  choice: मांस खाएँगे
  rationale: दिए गए पद की लैटिन पाठ-सीमा में केवल ‘मांस’ है; ‘अपना’ अगले पद के आरंभिक शब्द suas से आता है, इसलिए उसे मुख्य पाठ में समय से पहले नहीं जोड़ा गया।
theological_decisions:
- issue: क्या carnes के साथ ‘अपना ही’ जोड़ा जाए
  choice: मुख्य पाठ में केवल ‘मांस खाएँगे’ रखा गया
  alternative: ‘अपना ही मांस खाएँगे’
  rationale: इस पद के दिए गए लैटिन पाठ का अंत carnes पर होता है, जबकि suas (‘अपना’) अगले पद की पाठ-सीमा में है। पद-सीमा का सम्मान करते हुए संभावित संयुक्त पठन को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर, भविष्यवाणी-सदृश और सहज बोधगम्य गद्य। विनाश की तीव्रता बनाए रखी गई है, पर अनावश्यक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
