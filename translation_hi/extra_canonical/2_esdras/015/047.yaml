id: 2ES.15.47
reference: 2 Esdras 15:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eius, Vae tibi, misera, propter quod adsimilasti ei, ornasti filias tuas in fornicatione ad placendum et gloriandum in amatoribus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/047.yaml
  text: Woe to you, miserable one, because you made yourself like her and adorned your daughters for prostitution, to please and glory in your lovers.
translation:
  language: hi
  text: हाय तुझ पर, हे अभागी! क्योंकि तूने अपने आपको उसके समान बना लिया और अपनी बेटियों को वेश्यावृत्ति के लिए सजाया, अपने प्रेमियों को प्रसन्न करने और उन पर गर्व करने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae tibi, misera
  choice: हाय तुझ पर, हे अभागी!
  rationale: ‘Vae tibi’ की धिक्कार और आसन्न विपत्ति की घोषणा को ‘हाय तुझ पर’ से, तथा स्त्रीलिंग ‘misera’ की दयनीय-अभागी स्थिति को संबोधन ‘हे अभागी’ से व्यक्त किया गया है।
- source_word: adsimilasti ei
  choice: तूने अपने आपको उसके समान बना लिया
  rationale: लैटिन में कर्म निहित है; संदर्भानुसार आत्मवाचक अर्थ स्वाभाविक है। ‘ei’ का स्त्रीलिंग संदर्भ ‘उसके’ में जानबूझकर अनिर्दिष्ट रखा गया है।
- source_word: ornasti filias tuas in fornicatione
  choice: अपनी बेटियों को वेश्यावृत्ति के लिए सजाया
  rationale: ‘ornasti’ का ठोस अर्थ ‘सजाया’ और ‘fornicatio’ का स्पष्ट सार्वजनिक/यौन अर्थ ‘वेश्यावृत्ति’ सुरक्षित रखा गया है; ‘के लिए’ उद्देश्यगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ad placendum et gloriandum in amatoribus
  choice: ताकि वे तेरे प्रेमियों को प्रसन्न करें और तू उन पर घमंड करे
  rationale: दोनों gerund रूपों का उद्देश्यात्मक बल ‘ताकि’ से व्यक्त है। अर्थगत कर्ता लैटिन में अस्पष्ट है; हिन्दी में निकटतम स्वाभाविक पाठ के अनुसार प्रसन्न करने का कार्य बेटियों और घमंड करने का कार्य संबोधित स्त्री से जोड़ा गया है। ‘amatores’ के लिए संबंधपरक ‘प्रेमी’ चुना गया है।
theological_decisions:
- issue: placendum और gloriandum के निहित कर्ता
  choice: बेटियाँ प्रेमियों को प्रसन्न करती हैं; संबोधित स्त्री उन पर घमंड करती है
  alternative: 'दोनों क्रियाएँ संबोधित स्त्री से संबंधित हों: ‘ताकि तू अपने प्रेमियों को प्रसन्न करे और उन पर घमंड करे’'
  rationale: लैटिन infinitival gerund-निर्माण कर्ता स्पष्ट नहीं करता। ‘अपनी बेटियों को ... सजाया’ के बाद ‘प्रसन्न करें’ को बेटियों से जोड़ना हिन्दी में निकटतम और सहज है, जबकि ‘तेरे प्रेमियों’ तथा ‘घमंड करे’ को संबोधित स्त्री से जोड़ना वाक्य की निंदा का बल बनाए रखता है। यह व्याकरणगत विवेचन है, कोई सांप्रदायिक व्याख्या नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वाणी-सदृश धिक्कार का स्वर रखा गया है। ‘तू/तेरे’ कठोर एकवचन संबोधन को सुरक्षित रखते हैं; भाषा स्पष्ट और गरिमापूर्ण है।
