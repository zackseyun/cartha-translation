  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si propter nos creatum est saeculum, quare non hereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/059.yaml
  text: And if the world was created for our sake, why do we not possess our world as an inheritance? How long will this be?”
translation:
  language: hi
  text: और यदि संसार हमारे लिए रचा गया है, तो हम अपने संसार को विरासत में क्यों नहीं पाते? यह कब तक चलेगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: संसार
  rationale: यहाँ saeculum सृष्ट जगत/युग की ओर संकेत करता है; प्रसंग और अंग्रेज़ी परामर्श-पाठ के अनुरूप ‘संसार’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: hereditatem possidemus
  choice: विरासत में पाते
  rationale: लातीनी पदबंध में विरासत के रूप में अधिकार या प्राप्ति का भाव है; यह हिंदी में सहज रहते हुए मूल रूपक को बनाए रखता है।
- source_word: usquequo haec
  choice: यह कब तक चलेगा?
  rationale: शाब्दिक रूप से संक्षिप्त ‘कब तक ये बातें/यह?’ है; हिंदी में शिकायत और प्रतीक्षा का निहित भाव स्पष्ट करने के लिए स्वाभाविक वाक्यांश चुना गया है।
theological_decisions:
- issue: ‘हमारे लिए’ रचे गए संसार पर विरासत का दावा
  choice: दावे और प्रश्न के तनाव को यथावत रखा गया
  alternative: इसे भविष्य के राज्य अथवा किसी विशिष्ट समुदाय की सुनिश्चित विरासत के रूप में स्पष्ट करना
  rationale: मूल पाठ वक्ता का प्रश्न प्रस्तुत करता है, उसका सिद्धान्तगत समाधान नहीं; इसलिए कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और प्रश्नवाचक व्यथा के अनुरूप है। कोई पाद-टिप्पणी आवश्यक नहीं।
