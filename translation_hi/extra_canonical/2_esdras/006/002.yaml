base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/002.yaml
  text: and before the voices of the thunders sounded, and before the flashes of the lightnings shone, and before the foundations of paradise were established,
translation:
  language: hi
  text: और इससे पहले कि गर्जनों की आवाज़ें सुनाई देतीं, और इससे पहले कि बिजलियों की चमकें कौंधतीं, और इससे पहले कि परादीस की नींवें स्थापित की जातीं,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: voces tonitruum
  choice: गर्जनों की आवाज़ें
  rationale: लैटिन के बहुवचन और श्रव्य बिंब को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: nitores coruscuum
  choice: बिजलियों की चमकें
  rationale: चमक तथा बिजली के बहुवचन बिंब को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: paradisi
  choice: स्वर्गलोक
  rationale: यहाँ paradisi सृष्टि से पहले स्थापित किए जाने वाले परादीस को दर्शाता है; ‘स्वर्गलोक’ साधारण पाठक के लिए स्पष्ट है और इसे केवल बगीचे तक सीमित नहीं करता।
- source_word: confirmarentur
  choice: दृढ़ की जातीं
  rationale: क्रिया के निष्क्रिय भाव और नींवों को स्थिर अथवा सुदृढ़ किए जाने की मूल छवि को सुरक्षित रखता है।
theological_decisions:
- issue: paradisi का आशय
  choice: स्वर्गलोक
  alternative: परादीस / अदन-वाटिका
  rationale: मूल शब्द की व्यापक धार्मिक-सृष्टिगत धारणा को बनाए रखने और किसी विशिष्ट भौतिक स्थान या केवल अदन की वाटिका से अनावश्यक रूप से न बाँधने के लिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, लयात्मक और सामान्य पाठक के लिए सुबोध शैली। पद के तीनों ‘इससे पहले कि’ खंडों की समानांतर संरचना तथा अपूर्ण वाक्य के अंत का अल्पविराम सुरक्षित रखा गया है।
