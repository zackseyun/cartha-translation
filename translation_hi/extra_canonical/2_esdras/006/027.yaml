  language: hi
  text: क्योंकि बुराई मिटा दी जाएगी[a], और छल का अंत कर दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पूर्ववर्ती अनुवाद में गलती से अगला वाक्य जोड़ दिया गया था: “परन्तु विश्वासयोग्यता फूले-फलेगी, और भ्रष्टता पर विजय पाई जाएगी।” यह प्रस्तुत लैटिन पद का अनुवाद नहीं है।'
    reason: पूर्ववर्ती अनुवाद में अगले वाक्य के अनुचित समावेश की सूचना देना; इसे पाठ-रूप या इस लैटिन पद का वैकल्पिक अनुवाद नहीं बताना।
lexical_decisions:
- source_word: delebitur
  choice: मिटा दी जाएगी
  rationale: लैटिन क्रिया का अर्थ मिटा देने अथवा लोप कर देने का है; कर्मवाच्य और भविष्यकाल सुरक्षित रखे गए हैं।
- source_word: malum
  choice: बुराई
  rationale: यहाँ नपुंसकलिंग एकवचन संज्ञात्मक प्रयोग नैतिक बुराई को सूचित करता है।
- source_word: extinguetur
  choice: बुझा दिया जाएगा
  rationale: क्रिया का मूल बिंब किसी आग या प्रकाश को बुझाने का है; हिन्दी में यही बिंब स्वाभाविक और सशक्त है।
- source_word: dolus
  choice: छल
  rationale: dolus के कपट, धोखे और छल के अर्थों में ‘छल’ संक्षिप्त तथा व्यापक है।
theological_decisions:
- issue: बुराई और छल का अंत
  choice: दोनों कर्मवाच्य भविष्यकाल में रखे गए हैं
  alternative: उन्हें स्वयं समाप्त होने वाली घटनाओं के रूप में अनुवाद करना
  rationale: लैटिन के दोनों भविष्यत् कर्मवाच्य रूप बाहरी अथवा दैवी कर्तृत्व की संभावना खुली रखते हैं, पर कर्ता का नाम नहीं बताते।
