  verdict: revise
  source_fidelity: ‘बुराई मिटा दी जाएगी’ accurately represents Latin *delebitur enim malum* with its future passive force. For *extinguetur dolus*, ‘छल बुझा दिया जाएगा’ follows the literal image but is not idiomatic Hindi, since ‘छल’ is not naturally described as being extinguished. ‘छल का अंत कर दिया जाएगा’ communicates the Latin’s decisive future passive sense naturally, without specifying an agent.
  naturalness: The verse is otherwise clear, dignified, and modern. Replacing ‘छल बुझा दिया जाएगा’ with ‘छल का अंत कर दिया जाएगा’ removes an unnatural collocation while retaining the parallel future-passive construction.
  terminology: '‘बुराई’ for *malum* and ‘छल’ for *dolus* are appropriate, broad, nonsectarian equivalents. The note should not call the excluded material an ‘old textual form’: the supplied audit trail identifies it as a mistakenly carried-over following clause in a previous rendering, not as a textual variant of the cited Latin verse.'
  issues:
  - severity: medium
    issue: ‘छल बुझा दिया जाएगा’ is an unnatural Hindi collocation.
    rationale: Although *extinguetur* literally evokes extinguishing, Hindi normally uses ‘बुझाना’ for fire, flame, or light, not for deceit. ‘छल का अंत कर दिया जाएगा’ is idiomatic and preserves the passive, future, eliminative meaning.
  - severity: medium
    issue: The footnote inaccurately describes the omitted sentence as belonging to ‘एक पुराने पाठ-रूप’.
    rationale: The audit trail says that the faithfulness/corruption clause was material carried over from the following Latin clause in an earlier rendering. It is not presented as a variant reading of the quoted Latin text. The note should describe it as a previous translation error.
