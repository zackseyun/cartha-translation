  yaml_path: translation/extra_canonical/2_esdras/006/057.yaml
  text: And now, Lord, behold, these nations, which have been reckoned as nothing, rule over us and devour us.
translation:
  language: hi
  text: और अब, हे प्रभु, देख, ये जातियाँ, जो कुछ भी नहीं मानी गई थीं, हम पर शासन करती हैं और हमें निगलती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: देख
  rationale: लैटिन के ध्यान आकर्षित करने वाले प्रत्यक्ष संबोधन को संक्षिप्त और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: gentes
  choice: जातियाँ
  rationale: यहाँ सामूहिक विदेशी जनसमूहों/राष्ट्रों का बोध है; ‘जातियाँ’ बाइबिलीय संदर्भ में अर्थ को खुला रखता है।
- source_word: in nihilum deputatae sunt
  choice: कुछ भी नहीं समझी गई थीं
  rationale: मूल के निष्क्रिय मूल्यांकन और तुच्छ माने जाने के भाव को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: dominari nostri
  choice: हम पर शासन करती
  rationale: प्रसंगानुसार लैटिन का आशय ‘हम पर प्रभुता करना’ है; आधुनिक हिंदी में ‘शासन करना’ सहज और स्पष्ट है।
- source_word: devorare nos
  choice: हमें निगलती हैं
  rationale: मूल के तीखे भक्षण-रूपक को शाब्दिक रूप में सुरक्षित रखता है।
theological_decisions:
- issue: जातियों को ‘कुछ भी नहीं’ समझे जाने का आशय
  choice: मूल्यांकन को निष्क्रिय और अनिर्दिष्ट रखा गया—‘समझी गई थीं’
  alternative: ‘तेरी दृष्टि में कुछ नहीं मानी गई थीं’
  rationale: लैटिन पंक्ति स्वयं मूल्यांकनकर्ता को स्पष्ट नहीं करती; परमेश्वर को कर्ता बनाना संभव व्याख्या है, पर उसे मुख्य पाठ में जोड़ना मूल की अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी; प्रार्थनात्मक और गरिमामय स्वर। ‘हे प्रभु’ संबोधन तथा ‘निगलती हैं’ का सशक्त रूपक बनाए रखा गया है।
