  text: And it happened on the eighth night that my heart was troubled again within me, and I began to speak before the Most High.
translation:
  language: hi
  text: और ऐसा हुआ कि आठवीं रात को मेरा हृदय फिर मेरे भीतर व्याकुल हो उठा, और मैं परमप्रधान के सामने बोलने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in octava nocte
  choice: आठवीं रात को
  rationale: लैटिन के क्रमवाचक और काल-सूचक वाक्यांश का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: cor meum iterato turbabatur in me
  choice: मेरा हृदय फिर मेरे भीतर व्याकुल हो उठा
  rationale: ‘cor’ के लिए ‘हृदय’ और ‘iterato’ के लिए ‘फिर’ रखते हुए आंतरिक व्याकुलता को स्पष्ट किया गया है; ‘हो उठा’ प्रसंग में आरम्भ हुई अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: coram Altissimo
  choice: परमप्रधान के सामने
  rationale: ‘Altissimus’ की पारंपरिक ईश्वरीय उपाधि को ‘परमप्रधान’ से और ‘coram’ को ‘के सामने’ से व्यक्त किया गया है।
