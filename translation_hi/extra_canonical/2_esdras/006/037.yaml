  yaml_path: translation/extra_canonical/2_esdras/006/037.yaml
  text: For my spirit was greatly inflamed, and my soul was distressed.
translation:
  language: hi
  text: क्योंकि मेरी आत्मा भीतर से बहुत जल उठी थी, और मेरा मन व्याकुल था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiritus meus
  choice: मेरी आत्मा
  rationale: लातीनी ‘spiritus’ का सीधा और गरिमापूर्ण समतुल्य; अगले पदांश के ‘anima’ से भेद बनाए रखने के लिए यहाँ ‘आत्मा’ रखा गया है।
- source_word: inflammabatur valde
  choice: भीतर से बहुत जल उठी थी
  rationale: आग लगने/प्रज्वलित होने के रूपक को सुरक्षित रखते हुए स्वाभाविक हिन्दी में तीव्र आंतरिक उद्वेग व्यक्त करता है।
- source_word: anima mea
  choice: मेरा मन
  rationale: इस समानांतर वाक्य में ‘anima’ व्यक्ति के अंतर्मन और भावनात्मक जीवन को सूचित करता है; ‘मन’ हिन्दी में स्वाभाविक है और ‘spiritus’ से lexical distinction बनाए रखता है।
- source_word: anxiabatur
  choice: व्याकुल था
  rationale: चिंता, क्लेश और आंतरिक बेचैनी के भाव को संक्षिप्त तथा सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: spiritus और anima का संबंध
  choice: ‘आत्मा’ और ‘मन’ के रूप में अलग शब्द रखे गए
  alternative: दोनों को ‘आत्मा’ कहना, या ‘आत्मा’ और ‘प्राण’ कहना
  rationale: मूल के दो अलग शब्दों को यथासंभव प्रतिबिंबित किया गया है, पर इससे मनुष्य की संरचना पर कोई विशिष्ट सिद्धान्त आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और भावात्मक है। मूल के समानांतर विन्यास तथा प्रज्वलन के रूपक को बनाए रखा गया है।
