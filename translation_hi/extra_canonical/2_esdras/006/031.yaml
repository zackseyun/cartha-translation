id: 2ES.6.31
reference: 2 Esdras 6:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'haec ueni tibi ostendere †et uentura† nocte. Si ergo iterum rogaueris et iterum ieiunaueris septem diebus, iterum tibi renuntiabo horum maiora per diem. Quoniam auditu audita est uox tua apud altissimum ; uidit enim fortis directionem tuam et prouidit pudicitiam quam a iuuentute tua habuisti. Et propter hoc misit me demonstrare tibi haec omnia et dicere tibi : confide et noli timere, Et noli festinare in prioribus temporibus cogitare uana, ut non properes in nouissimis temporibus. Et factum est post haec, et fleui iterum et similiter ieiunaui septem diebus, ut supplerem tres ebdomadas quae dictae sunt mihi. Et factum est in octaua nocte et cor meum iterato turbabatur in me, et coepi loqui coram altissimo ; Inflammabatur enim spiritus meus ualde, et anima mea anxiabatur. Et dixi : O domine, loquens locutus es ab initio creaturae, in primo die dicens : fiat caelum et terra, et tuum uerbum opus perfecit. Et erat tunc spiritus uolans, et tenebrae circumferebantur et silentium, sonus
    uocis hominis nondum erat abs te. Tunc dixisti de thesauris tuis proferri lumen aliquod luminis ut apparerent tunc opera tua. Et die secundo iterum creasti spiritum firmamenti et imperasti ei ut diuidcret et diuisionem faceret inter aquas, ut pars quidem sursum recederet, pars uero deorsum maneret. Et tertio die imperasti aquis congregari in septima parte terrae, sex uero partes siccasti et conseruasti ut ex his sint'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/031.yaml
  text: Therefore, if you pray again and fast again for seven days, I will again declare to you greater things than these by day.
translation:
  language: hi
  text: इसलिए यदि तुम फिर प्रार्थना करोगे और फिर सात दिन उपवास करोगे, तो मैं दिन में तुम्हें इनसे भी बड़ी बातें फिर बताऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: rogaueris
  choice: प्रार्थना करोगे
  rationale: लैटिन क्रिया का अर्थ यहाँ परमेश्वर से विनती या प्रार्थना करना है; प्रसंगानुसार ‘प्रार्थना’ स्वाभाविक और स्पष्ट है।
- source_word: ieiunaueris septem diebus
  choice: सात दिन उपवास करोगे
  rationale: अवधि और धार्मिक क्रिया दोनों को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: renuntiabo
  choice: बताऊँगा
  rationale: इसका आशय संदेश देना या घोषित करना है; स्वर्गदूत द्वारा एज्रा को प्रकाशन देने के इस प्रसंग में ‘बताऊँगा’ सहज है और अनावश्यक औपचारिकता से बचता है।
- source_word: horum maiora
  choice: इनसे भी बड़ी बातें
  rationale: तुलनात्मक अर्थ को स्पष्ट रखते हुए पूर्व में दिखाई या बताई गई बातों की ओर संकेत सुरक्षित रखा गया है।
- source_word: per diem
  choice: दिन के समय
  rationale: लैटिन पदबंध का प्रत्यक्ष कालगत अर्थ रखा गया है; इसे अगले सात दिनों की अवधि में विलीन नहीं किया गया।
theological_decisions:
- issue: rogaueris में प्रार्थना और सामान्य पूछने का भेद
  choice: प्रार्थना करोगे
  alternative: फिर पूछोगे / फिर विनती करोगे
  rationale: परमप्रधान से संबोधित धार्मिक प्रसंग और उपवास के साथ इसका प्रयोग प्रार्थना का संकेत देता है, यद्यपि मूल क्रिया में माँगने या पूछने का व्यापक भाव भी हो सकता है।
- issue: per diem का संदर्भ
  choice: दिन के समय
  alternative: हर दिन / दिन के दौरान
  rationale: मूल का संक्षिप्त कालगत पदबंध कुछ अस्पष्ट है; अनुवाद ने उसे किसी निश्चित वितरणात्मक अर्थ (‘हर दिन’) में नहीं बदला।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन एकवचन अनौपचारिक ‘तुम’ में है, जो इस संवाद की निकटता और मूल के एकवचन रूप को स्वाभाविक ढंग से व्यक्त करता है। भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है।
