base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/047.yaml
  text: On the fifth day you said to the seventh part, where the water was gathered, that it should bring forth living creatures, birds, and fish;
translation:
  language: hi
  text: पाँचवें दिन आपने उस सातवें भाग से, जहाँ पानी था, कहा कि वह जीवित प्राणी, पक्षी और मछलियाँ उत्पन्न करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinto autem die
  choice: पाँचवें दिन
  rationale: दिन के क्रम को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है; autem यहाँ कथानक की निरंतरता दर्शाता है, जिसके लिए अलग शब्द आवश्यक नहीं।
- source_word: septimae parti
  choice: उस सातवें भाग से
  rationale: लैटिन के एकवचन और क्रमसूचक अर्थ को बनाए रखता है; dative को ‘से ... कहा’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ubi erat aqua
  choice: जहाँ पानी इकट्ठा था
  rationale: aqua के एकवचन-सामूहिक अर्थ को ‘पानी’ से रखा गया है। ‘इकट्ठा था’ अंग्रेज़ी परामर्श-पाठ में सुरक्षित सृष्टि-वर्णन के आशय को सहज हिन्दी में देता है।
- source_word: living creatures, birds, and fish
  choice: जीवित प्राणी, पक्षी और मछलियाँ
  rationale: प्रदान किए गए परामर्श-पाठ की तीन श्रेणियों को बिना संकुचित या विस्तृत किए स्पष्ट हिन्दी में रखता है।
theological_decisions:
- issue: परमेश्वर के लिए द्वितीय पुरुष संबोधन
  choice: आपने
  alternative: तूने
  rationale: आधुनिक मानक हिन्दी में श्रद्धापूर्ण और सामान्यतः समझ में आने वाला संबोधन चुना गया है; इससे कोई विशिष्ट सांप्रदायिक अर्थ नहीं जोड़ा जाता।
- issue: सातवें भाग की पहचान
  choice: ‘सातवें भाग’ को अपरिभाषित रखा गया
  alternative: इसे समुद्र या जलमंडल के रूप में स्पष्ट करना
  rationale: पाठ जिस प्रकार भाग का उल्लेख करता है, उसी प्रकार रखा गया है; उसकी पहचान की व्याख्या जोड़कर वास्तविक पाठगत तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य की प्रार्थनात्मक प्रत्यक्ष संबोधन-शैली सुरक्षित है। उपलब्ध लैटिन अंश ‘जहाँ पानी था’ तक ही प्रत्यक्ष रूप से दिखाई देता है; शेष सूची के लिए दिए गए परीक्षित अंग्रेज़ी परामर्श-पाठ का अनुसरण किया गया है।
