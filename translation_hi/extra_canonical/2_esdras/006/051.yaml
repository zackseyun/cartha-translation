  text: And you gave Behemoth one part, which was dried up on the third day, to dwell in it, where there are a thousand mountains;
translation:
  language: hi
  text: और तूने बेहेमोथ को एक भाग दिया, जो तीसरे दिन सूख गया था, ताकि वह उसमें रहे, जहाँ एक हज़ार पहाड़ हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dedisti
  choice: तूने ... दिया
  rationale: लैटिन का द्वितीय पुरुष एकवचन सीधे संबोधन में है; परमेश्वर से संबोधन की संख्या और प्रत्यक्षता बनाए रखने के लिए ‘तूने’ चुना गया।
- source_word: Behemoth
  choice: बेहेमोथ
  rationale: इस विशिष्ट प्राणी के नाम का अर्थ लगाकर अनुवाद करने के बजाय लैटिन रूप का स्पष्ट देवनागरी लिप्यंतरण किया गया।
- source_word: unam partem
  choice: एक भाग
  rationale: ‘partem’ के स्थान अथवा हिस्से—दोनों संभावित भावों को समेटने वाला स्वाभाविक और निकट अनुवाद।
- source_word: quae siccata est tertio
  choice: जो तीसरे दिन सुखाया गया था
  rationale: स्त्रीलिंग संबंधवाचक ‘quae’ का संबंध ‘partem’ से रखा गया। ‘तीसरे’ में निहित ‘दिन’ को संदर्भानुसार स्पष्ट किया गया, जैसा परामर्श-पाठ में भी है।
- source_word: ut habitet in ea
  choice: ताकि वह उसमें रहे
  rationale: उद्देश्यसूचक भाव और उसी दिए गए भाग में निवास करने का अर्थ स्वाभाविक हिन्दी में सुरक्षित रखा गया।
- source_word: ubi sunt montes mille
  choice: जहाँ एक हज़ार पहाड़ हैं
  rationale: स्थानसूचक उपवाक्य और संख्या को सीधे, सहज हिन्दी में व्यक्त किया गया।
theological_decisions: []
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी रखी गई है। परमेश्वर के लिए एकवचन प्रत्यक्ष संबोधन ‘तू’ लैटिन की व्याकरणिक संख्या को बनाए रखता है; बेहेमोथ को किसी विशेष धार्मिक व्याख्या से नहीं जोड़ा गया। उपलब्ध लैटिन अंश ‘tertio’ पर कटता है, जबकि परामर्श-पाठ में पद का शेष आशयसंगत वाक्यांश संरक्षित है; अनुवाद में पूर्ण पद प्रस्तुत किया गया है।
