  yaml_path: translation/extra_canonical/2_esdras/006/001.yaml
  text: And he said to me[a], “At the beginning of the earthly world, before the ends of the age were established, and before the gatherings of the winds blew,
translation:
  language: hi
  text: और उसने मुझसे कहा, “पार्थिव जगत के आरम्भ में—युग के छोरों के स्थिर होने से पहले[a], पवनों के समूहों के बहने से पहले, गर्जनों की आवाज़ें गूँजने से पहले, बिजलियों की कौंधें चमकने से पहले, और वे दृढ़ किए जाते, उससे पहले…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार के निकास-द्वारों के कायम होने से पहले”; लातीनी पद का अर्थ “युग के छोर” या ब्रह्माण्ड की स्थानगत सीमाएँ अथवा निकास-द्वार हो सकता है।
    reason: ‘exitus saeculi’ की वास्तविक कालगत-स्थानगत और रूपकगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: initium terreni orbis
  choice: पार्थिव जगत के आरम्भ में
  rationale: ‘terreni orbis’ पृथ्वी से संबंधित जगत को सूचित करता है; यह पदबंध आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की ब्रह्माण्डीय भाषा बनाए रखता है।
- source_word: exitus saeculi
  choice: युग के छोर
  rationale: ‘exitus’ के ‘छोर/सीमाएँ/निकास’ और ‘saeculum’ के ‘युग/संसार’ अर्थों में वास्तविक अस्पष्टता है। मुख्य पाठ में शाब्दिक और अर्थपूर्ण ‘युग के छोर’ रखा गया है; स्थानगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: starent
  choice: स्थिर होने
  rationale: लातीनी क्रिया का मूल अर्थ ‘खड़े होना/कायम होना’ है; ब्रह्माण्ड की सीमाओं के संदर्भ में ‘स्थिर होना’ स्वाभाविक है और केवल बाहरी कर्ता द्वारा ‘स्थापित किए जाने’ का अर्थ नहीं थोपता।
- source_word: conuentiones uentorum
  choice: पवनों के समूह
  rationale: ‘conuentiones’ का अर्थ एकत्रीकरण या समूह है; असामान्य ब्रह्माण्डीय बिंब को सरल बनाकर मिटाने के बजाय बनाए रखा गया है।
- source_word: spirarent
  choice: बहने
  rationale: पवनों के लिए ‘बहना’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है और लातीनी ‘श्वास लेना/फूँकना’ का प्रसंगगत भाव देता है।
- source_word: uoces tonitruum
  choice: गर्जनों की आवाज़ें
  rationale: मूल के बहुवचन और ‘आवाज़ों’ वाले ठोस श्रव्य बिंब को सुरक्षित रखा गया है।
- source_word: nitores coruscuum
  choice: बिजलियों की कौंधें
  rationale: पाठ का आशय बिजली की चमक या दीप्ति है; ‘कौंधें’ संक्षिप्त, स्वाभाविक और दृश्य बिंब के अनुकूल है।
- source_word: confirmarentur
  choice: दृढ़ किए जाने
  rationale: उपलब्ध स्रोत-पाठ इस निष्क्रिय क्रिया पर अपूर्ण रूप से समाप्त होता है और यह नहीं बताता कि क्या दृढ़ किया गया; हिन्दी में भी उस अपूर्णता को बनाए रखा गया है।
theological_decisions:
- issue: ‘exitus saeculi’ का कालगत या स्थानगत अर्थ
  choice: मुख्य पाठ में ‘युग के छोर’
  alternative: ‘संसार के निकास-द्वार’ या ‘संसार की सीमाएँ’
  rationale: लातीनी पद दोनों दिशाओं में समझा जा सकता है। मुख्य चयन औपचारिक समानता और अंग्रेज़ी परामर्श-पाठ के अंतिम संशोधन के निकट है, जबकि यहूदी प्रलय-साहित्य में संभावित ब्रह्माण्डीय-स्थानगत अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अंतिम अपूर्ण वाक्यांश
  choice: अपूर्णता को दीर्घविराम से बनाए रखना
  alternative: अगले प्रसंग से अनुमानित संज्ञा जोड़कर वाक्य पूरा करना
  rationale: प्रदत्त मूल पाठ ‘confirmarentur’ पर रुकता है। किसी अनुमानित वस्तु, जैसे ‘स्वर्ग की नींवें’, को जोड़ना उपलब्ध स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। समानांतर ‘…से पहले’ संरचना मूल की लय बनाए रखती है। स्रोत-पाठ का अंतिम खंड व्याकरणतः अधूरा है, इसलिए अनुवाद भी दीर्घविराम पर समाप्त होता है और समापन उद्धरण-चिह्न नहीं जोड़ा गया।
