  text: 'et dixi: o Domine, loquens locutus es ab initio creaturae in primo die dicens: fiat caelum et terra, et tuum verbum opus perfecit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/038.yaml
  text: And I said[a], “O Lord, from the beginning of creation, on the first day, you spoke, saying, ‘Let heaven and earth be made,’ and your word accomplished the work.”
translation:
  language: hi
  text: और मैंने कहा, “हे प्रभु, सृष्टि के आरम्भ में, पहले दिन आपने सचमुच कहा था[a], ‘आकाश और पृथ्वी हो जाएँ,’ और आपके वचन ने वह कार्य पूरा कर दिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बोलते हुए आपने कहा था”; लैटिन में यह पुनरुक्ति कथन पर बल देती है।
    reason: loquens locutus es की असामान्य बलसूचक संरचना और उसके अधिक शाब्दिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: ab initio creaturae
  choice: सृष्टि के आरम्भ में
  rationale: लैटिन पदबंध का स्वाभाविक और काल-सूचक हिन्दी रूप; इसे अगले पदबंध ‘पहले दिन’ से अलग बनाए रखता है।
- source_word: loquens locutus es
  choice: आपने सचमुच कहा था
  rationale: लैटिन की ‘बोलते हुए बोले’ जैसी बलसूचक पुनरुक्ति को अस्वाभाविक शब्दशः दोहराव के बजाय हिन्दी में ‘सचमुच’ से व्यक्त किया गया है।
- source_word: fiat caelum et terra
  choice: आकाश और पृथ्वी हो जाएँ
  rationale: fiat की सृजनात्मक आज्ञा को संक्षिप्त, गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: verbum
  choice: वचन
  rationale: यहाँ प्रभु के बोले हुए प्रभावकारी शब्द के लिए प्रचलित, संदर्भानुकूल और धर्मशास्त्रीय रूप से अनावश्यक विस्तार से मुक्त शब्द।
- source_word: opus perfecit
  choice: वह कार्य पूरा कर दिया
  rationale: लैटिन में निश्चित उपपद न होने पर भी संदर्भ में यह उसी सृष्टि-कार्य की ओर संकेत करता है; ‘वह’ हिन्दी में संदर्भ स्पष्ट करता है।
theological_decisions:
- issue: सृष्टि को पूरा करने वाले ‘वचन’ का स्वरूप
  choice: ‘आपके वचन ने वह कार्य पूरा कर दिया’—वचन को कर्ता बनाए रखा गया
  alternative: इसे केवल ‘आपने अपने वचन से वह कार्य पूरा किया’ कहना
  rationale: स्रोत में tuum verbum व्याकरणिक कर्ता है। अनुवाद इस व्यक्तिकरण अथवा संभावित धर्मशास्त्रीय संकेत को न तो मिटाता है, न उससे आगे जाकर उसकी व्याख्या करता है।
- issue: loquens locutus es का बल
  choice: मुख्य पाठ में ‘सचमुच’ द्वारा बल व्यक्त किया गया
  alternative: साधारण ‘आपने कहा था’ या शब्दशः ‘बोलते हुए आपने कहा था’
  rationale: लैटिन की पुनरुक्त संरचना सम्भवतः सेमिटिक बलसूचक प्रयोग को सुरक्षित रखती है; साधारण रूप बल खो देता, जबकि शब्दशः रूप आधुनिक हिन्दी में कृत्रिम होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, श्रद्धापूर्ण और गरिमापूर्ण रूप अपनाया गया है। प्रभु के लिए सम्मानसूचक ‘आप’ रखा गया है। वाक्य-संरचना स्रोत के क्रम के निकट है, पर हिन्दी की स्वाभाविकता के लिए सीमित समायोजन किया गया है।
