source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et anniculi infantes loquentur uocibus suis, et praegnantes immaturos parient infantes trium et quatuor mensium et uiuent
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/021.yaml
  text: And year-old infants will speak with their voices[a], and pregnant women will give birth to premature infants of three and four months[b], and they will live.
translation:
  language: hi
  text: और एक वर्ष के शिशु अपनी आवाज़ में बोलेंगे, और गर्भवती स्त्रियाँ तीन और चार महीने के अपरिपक्व शिशुओं को जन्म देंगी, और वे जीवित रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: anniculi infantes
  choice: एक वर्ष के शिशु
  rationale: ‘anniculi’ लगभग एक वर्ष की आयु और ‘infantes’ शिशुओं को सूचित करता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: loquentur uocibus suis
  choice: अपनी ही आवाज़ में बोलेंगे
  rationale: ‘loquentur’ का अर्थ ‘बोलेंगे’ और ‘uocibus suis’ का शाब्दिक अर्थ ‘अपनी आवाज़ों में’ है। ‘ही’ असामान्य चिह्न को उभारता है, बिना स्रोत में नया अर्थ जोड़े।
- source_word: praegnantes
  choice: गर्भवती स्त्रियाँ
  rationale: लैटिन विशेषण यहाँ स्त्री-वाचक संज्ञा के रूप में प्रयुक्त है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘स्त्रियाँ’ जोड़ा गया है।
- source_word: immaturos ... infantes trium et quatuor mensium
  choice: तीन और चार महीने के समय से पहले जन्मे शिशुओं को
  rationale: ‘immaturos’ अपरिपक्व अथवा समयपूर्व जन्म को बताता है और ‘trium et quatuor mensium’ तीन तथा चार महीने की अवस्था को। हिन्दी में ‘समय से पहले जन्मे’ अधिक स्वाभाविक है।
- source_word: et uiuent
  choice: और वे जीवित रहेंगे
  rationale: स्रोत का सीधा भाव सुरक्षित रखा गया है; कर्ता निकटवर्ती समयपूर्व जन्मे शिशु हैं।
theological_decisions:
- issue: समयपूर्व जन्मे शिशुओं का जीवित रहना
  choice: और वे जीवित रहेंगे
  alternative: और वे जीएँगे
  rationale: ‘जीवित रहेंगे’ इस अपूर्व संकेत का आशय स्पष्ट करता है और ‘uiuent’ के भाव के भीतर रहता है। किसी अतिरिक्त गतिविधि या चमत्कार का विवरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गंभीर और भविष्यसूचक शैली के अनुरूप है। अंग्रेज़ी परामर्श-पाठ की पहली पादटिप्पणी स्रोत लैटिन से मेल नहीं खाती, इसलिए उछलने या सक्रिय रूप से हिलने का कोई भाव न पाठ में जोड़ा गया है, न पादटिप्पणी में।
