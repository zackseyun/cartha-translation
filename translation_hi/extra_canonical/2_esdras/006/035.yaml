  text: And it happened after this that I wept again, and likewise I fasted seven days, so that I might complete the three weeks that had been spoken to me.
translation:
  language: hi
  text: इसके बाद ऐसा हुआ कि मैं फिर रोया और उसी प्रकार सात दिन तक उपवास करता रहा, ताकि मैं उन तीन सप्ताहों को पूरा कर सकूँ जिनके विषय में मुझसे कहा गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: flevi iterum
  choice: मैं फिर रोया
  rationale: यह लैटिन क्रिया और पुनरावृत्ति-सूचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: similiter ieiunavi septem diebus
  choice: उसी प्रकार सात दिन तक उपवास करता रहा
  rationale: similiter को पूर्ववर्ती उपवास की रीति से जोड़ते हुए रखा गया है; सात दिनों तक जारी क्रिया के लिए ‘करता रहा’ स्वाभाविक है।
- source_word: ut suppleam tres ebdomadas
  choice: ताकि वे तीन सप्ताह पूरे करूँ
  rationale: suppleam यहाँ निर्धारित कुल अवधि को पूरा करने का भाव देता है।
- source_word: quae dictae sunt mihi
  choice: जिनके विषय में मुझसे कहा गया था
  rationale: dictae sunt mihi का वाणी-संबंधी अर्थ सुरक्षित है; ‘ठहराए गए’ जैसा अधिक व्याख्यात्मक अर्थ नहीं लिया गया।
theological_decisions:
- issue: तीन सप्ताहों के बारे में कही गई बात का स्वरूप
  choice: जिनके विषय में मुझसे कहा गया था
  alternative: जो मेरे लिए ठहराए गए थे
  rationale: लैटिन dictae sunt mihi केवल ‘मुझसे कहे गए’ का संकेत करता है; इसे नियुक्ति या दैवी आदेश के रूप में अधिक निश्चित करना मूल से आगे जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप; मूल की क्रमिकता, शोक, उपवास और उद्देश्य-संबंध सुरक्षित रखे गए हैं।
