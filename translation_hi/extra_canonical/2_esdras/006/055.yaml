id: 2ES.6.55
reference: 2 Esdras 6:55
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: haec autem omnia dixi coram te, Domine, quoniam dixisti quia propter nos creasti primogenitum saeculum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/055.yaml
  text: But I have said all these things before you[a], Lord, because you said that for our sake you created the first world.
translation:
  language: hi
  text: परन्तु हे प्रभु, मैंने ये सब बातें आपके सामने इसलिए कही हैं कि आपने कहा था कि आपने हमारे लिए प्रथम संसार की सृष्टि की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रथम संसार’ का शाब्दिक अनुवाद ‘पहिलौठा संसार’ भी हो सकता है। अन्य प्राचीन भाषाई परम्पराओं में यहाँ ‘यह संसार’ मिलता है।
    reason: लातीनी primogenitum saeculum असामान्य है और प्राचीन अनुवाद-परम्पराओं में पाठांतर मिलता है; पाठगत तथा अर्थगत अनिश्चितता बताना आवश्यक है।
lexical_decisions:
- source_word: autem
  choice: परन्तु
  rationale: यह पिछले कथन से संक्रमण और हल्का विरोध प्रकट करता है; इसलिए इसे स्पष्ट रूप से अनूदित किया गया है।
- source_word: coram te
  choice: आपके सामने
  rationale: लातीनी पदबंध का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: propter nos
  choice: हमारे लिए
  rationale: यह सृष्टि के उद्देश्य अथवा मनुष्यों के हित का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: primogenitum saeculum
  choice: प्रथम संसार
  rationale: primogenitum का शाब्दिक अर्थ ‘पहिलौठा’ है, पर saeculum के साथ ‘प्रथम संसार’ अधिक बोधगम्य है और उपलब्ध लातीनी पाठ के क्रमगत अर्थ को बनाए रखता है।
theological_decisions:
- issue: primogenitum saeculum का ब्रह्माण्ड-संबंधी अर्थ
  choice: प्रथम संसार
  alternative: यह संसार; पहिलौठा संसार
  rationale: मुख्य पाठ उपलब्ध लातीनी साक्ष्य को ‘प्रथम संसार’ के रूप में प्रस्तुत करता है। अन्य प्राचीन भाषाई परम्पराओं में ‘यह संसार’ का पाठ मिलता है, जबकि ‘पहिलौठा संसार’ अधिक शाब्दिक पर कम स्वाभाविक है; इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। प्रभु के लिए आदरसूचक ‘आप’ रखा गया है और वाक्य की लातीनी तर्क-रचना को स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
