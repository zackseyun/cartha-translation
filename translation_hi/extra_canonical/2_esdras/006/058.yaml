source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos autem populus tuus quem vocasti primogenitum, unigenitum, aemulatorem, carissimum, traditi sumus in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/058.yaml
  text: But we[a], your people, whom you have called your firstborn, your only one, your beloved, your dear one[b], have been handed over into their hands.
translation:
  language: hi
  text: परन्तु हम, आपकी प्रजा, जिसे आपने अपना पहलौठा, अपना इकलौता, अपना उत्साही[a] और अपना परम प्रिय कहा है, उनके हाथों में सौंप दिए गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उत्साही’ के लिए प्रयुक्त लैटिन शब्द कठिन है; उसका अर्थ ‘अनुकरण करनेवाला’ या ‘प्रतिद्वंद्वी’ भी हो सकता है। यहाँ इस्राएल के लिए वाचा-संबंधी सम्मानसूचक उपाधियाँ एक के बाद एक रखी गई हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनके हाथों में दे दिए गए हैं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: primogenitum
  choice: पहलौठा
  rationale: यह ‘पहले जन्मे’ की वाचा-संबंधी उपाधि को स्वाभाविक और परिचित हिन्दी में व्यक्त करता है।
- source_word: unigenitum
  choice: इकलौता
  rationale: यहाँ यह प्रजा के लिए प्रयुक्त सम्मानसूचक उपाधि है; ‘इकलौता’ उसके विशिष्ट और अद्वितीय संबंध को सहज हिन्दी में बनाए रखता है।
- source_word: aemulatorem
  choice: उत्साही
  rationale: लैटिन शब्द कठिन और बहुअर्थी है; इसका अर्थ उत्साह या अनुराग रखनेवाला, अनुकरण करनेवाला, अथवा प्रतिद्वंद्वी तक हो सकता है। ‘उत्साही’ प्रसंग के वाचा-संबंधी सम्मानसूचक पदों के बीच सबसे कम बाधक अर्थ देता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: carissimum
  choice: परम प्रिय
  rationale: यह carissimum की उच्चतम स्नेहात्मक तीव्रता को dignified और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: traditi sumus in manibus eorum
  choice: उनके हाथों में सौंप दिए गए हैं
  rationale: यह trado के साधारण ‘देने’ से अधिक प्रबल अर्थ—किसी दूसरे के अधिकार या नियंत्रण में सौंप देना—को और मूल के ‘हाथों में’ मुहावरे को सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएल के लिए एक के बाद एक प्रयुक्त सम्मानसूचक उपाधियाँ
  choice: 'चारों उपाधियों को अलग-अलग बनाए रखा गया: ‘पहलौठा’, ‘इकलौता’, ‘उत्साही’, ‘परम प्रिय’।'
  alternative: उन्हें मिलाकर ‘आपकी विशेष प्रिय प्रजा’ जैसा सहज भावानुवाद करना।
  rationale: मूल पाठ जानबूझकर वाचा-संबंधी उपाधियों का संचय करता है; इन्हें समतल करने से शिकायत का धार्मिक और भावात्मक तनाव घट जाता।
- issue: traditi sumus में दैवी अनुमति अथवा सक्रिय परित्याग का प्रश्न
  choice: कर्मवाच्य ‘सौंप दिए गए हैं’ रखा गया, बिना कर्ता बताए।
  alternative: ‘आपने हमें उनके हाथों में सौंप दिया है’ या ‘हम उनके वश में पड़ गए हैं’।
  rationale: लैटिन में कर्ता व्यक्त नहीं है। अनुवाद यह निर्धारित नहीं करता कि सौंपनेवाला सीधे परमेश्वर है या परिस्थिति को सामान्य रूप से वर्णित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण ईश्वर-संबोधन (‘आप/आपकी’) रखा गया है। वाक्य की औपचारिक शिकायत-भंगिमा और उपाधियों की क्रमिकता सुरक्षित रखी गई है; साथ ही ‘उनके हाथों में सौंप दिए गए’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
