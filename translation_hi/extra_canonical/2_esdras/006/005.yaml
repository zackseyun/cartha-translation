reference: 2 Esdras 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Sion, Et antequam inuestigarentur praesentes anni, et antequam abalienarentur eorum qui nunc peccant adinuentiones, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/005.yaml
  text: and before the present years were searched out[a], and before the devices of those who now sin were estranged, and before those who have stored up faith were sealed—
translation:
  language: hi
  text: और वर्तमान वर्षों की छानबीन किए जाने से पहले, और उन लोगों की युक्तियाँ अलग कर दी जाने से पहले[a] जो अब पाप करते हैं, और विश्वास को संचित करनेवालों पर मुहर लगाए जाने से पहले—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘अलग या दूर कर दी जाने से पहले’; लैटिन अभिव्यक्ति असामान्य है।
    reason: ‘अलग कर दी जाने’ की स्रोतगत अस्पष्टता स्पष्ट करना, बिना मुख्य पाठ में उसका अर्थ निर्णायक रूप से तय किए।
lexical_decisions:
- source_word: inuestigarentur
  choice: छानबीन किए जाने
  rationale: लातीनी क्रिया का अर्थ खोजबीन या जाँच-पड़ताल करना है; कर्मवाच्य रूप को बनाए रखा गया है।
- source_word: praesentes anni
  choice: वर्तमान वर्ष
  rationale: शाब्दिक अर्थ ‘वर्तमान/मौजूदा वर्ष’ है; मूल की असामान्य काल-संबंधी अभिव्यक्ति को सरल करके मिटाया नहीं गया।
- source_word: abalienarentur
  choice: पराई कर दिए जाने
  rationale: इसका मूल अर्थ अलग, दूर या पराया कर देना है। संदर्भ अस्पष्ट है, इसलिए अधिक व्याख्यात्मक ‘निष्फल’ या ‘अस्वीकृत’ नहीं चुना गया।
- source_word: adinւentiones
  choice: युक्तियाँ
  rationale: यहाँ शब्द आविष्कारों के बजाय मन में गढ़ी गई योजनाओं या उपायों को सूचित करता है।
- source_word: fidem thesaurizaverunt
  choice: विश्वास संचित करनेवालों
  rationale: ‘विश्वास को खजाने की तरह जमा करना’ वाली मूल रूपकात्मक भाषा को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखा गया।
- source_word: consignarentur
  choice: मुहर लगाए जाने
  rationale: लातीनी कर्मवाच्य और ‘मुहर लगाने’ की धार्मिक-प्रतीकात्मक छवि दोनों बनाए गए हैं।
theological_decisions:
- issue: तीनों उपवाक्यों का antequam (‘से पहले’) के अधीन होना
  choice: हर उपवाक्य में ‘से पहले’ दोहराया गया
  alternative: 'अंतिम उपवाक्य को स्वतंत्र कथन बनाना: ‘और विश्वास संचित करनेवालों पर मुहर लगाई गई’'
  rationale: consignarentur का व्याकरणिक रूप पहले के antequam-क्रम को जारी रखता है; स्वतंत्र कथन बनाने से काल-संबंध और आशय बदल जाएगा।
- issue: पाप करनेवालों की युक्तियों का ‘पराया किया जाना’
  choice: मूल की अस्पष्टता बनाए रखी गई
  alternative: इसे ‘निष्फल की गईं’, ‘अस्वीकृत की गईं’ या ‘दूर की गईं’ कहना
  rationale: इन विकल्पों में से प्रत्येक एक विशिष्ट व्याख्या थोपता है, जबकि लातीनी अभिव्यक्ति स्वयं असामान्य और अर्थतः खुली है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। लंबे वाक्य और अंत का डैश मूल में जारी ‘से पहले’ वाले क्रम को दर्शाते हैं। उपलब्ध लातीनी अंश के आरंभ का ‘Sion’ पिछले वाक्य का अंतिम शब्द प्रतीत होता है और अंग्रेज़ी परामर्श-पाठ में भी इस पद का भाग नहीं है, इसलिए इसे सम्मिलित नहीं किया गया।
