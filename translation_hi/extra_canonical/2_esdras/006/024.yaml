reference: 2 Esdras 6:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et erit in illo tempore debellabunt amici amicos ut inimici, et expauescet terra cum his qui inhabitant eam, et uenae fontium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/024.yaml
  text: 'And it will be in that time: friends will make war on friends like enemies[a], and the earth will be terrified along with those who dwell in it, and the channels of the springs will stand still so as not to run for three hours.'
translation:
  language: hi
  text: 'और उस समय ऐसा होगा: मित्र अपने ही मित्रों से शत्रुओं की तरह युद्ध करेंगे; धरती और उसके निवासी भय से काँप उठेंगे, और सोतों की धाराएँ तीन घंटे तक ठहरी रहेंगी और नहीं बहेंगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: debellabunt amici amicos ut inimici
  choice: मित्र अपने ही मित्रों से शत्रुओं की तरह युद्ध करेंगे
  rationale: यह लैटिन के मित्रों द्वारा मित्रों के विरुद्ध शत्रुओं जैसा युद्ध करने के अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: expauescet terra cum his qui inhabitant eam
  choice: धरती और उसके निवासी भय से काँप उठेंगे
  rationale: 'यहाँ cum साहचर्य बताता है: धरती और उसमें रहनेवाले दोनों भयभीत होंगे; हिन्दी में संयुक्त कर्ता इस अर्थ को अस्पष्टता के बिना व्यक्त करता है।'
- source_word: uenae fontium
  choice: सोतों की धाराएँ
  rationale: uenae का शाब्दिक बिंब ‘नसें’ है, पर जलस्रोतों के संदर्भ में इसका आशय बहने वाली धाराओं या जल-मार्गों से है; ‘सोतों की धाराएँ’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: stabunt ut non decurrant in horis tribus
  choice: तीन घंटे तक ठहरी रहेंगी और नहीं बहेंगी
  rationale: प्रदत्त लैटिन अंश uenae fontium पर कट गया है; वाक्य का यह शेष भाग परामर्श हेतु दिए गए, स्रोत-साक्ष्य पर आधारित अंग्रेज़ी पाठ के अनुसार रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यवाणी-संबंधी शैली रखी गई है। ‘अपने ही’ मित्रों के परस्पर विश्वासघात को स्पष्ट करता है, जबकि ‘धरती और उसके निवासी’ लैटिन cum के साहचर्य अर्थ को स्वाभाविक रूप से व्यक्त करता है। अंग्रेज़ी परत का [a] पिछले अंग्रेज़ी रूपांतरण से जुड़ा संपादकीय अवशेष है, कोई वास्तविक पाठांतर नहीं; इसलिए हिन्दी मुख्य पाठ में फुटनोट नहीं जोड़ा गया।
