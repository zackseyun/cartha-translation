  text: And the trumpet will sound, and when all hear it, they will suddenly be terrified.
translation:
  language: hi
  text: और तुरही बजेगी, और जब सभी उसे सुनेंगे, तो वे अचानक भयभीत हो जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuba
  choice: तुरही
  rationale: यह सामान्य और गरिमापूर्ण हिन्दी शब्द है, जो घोषणा अथवा अंतिम संकेत देने वाले वाद्य का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: canet cum sono
  choice: बजेगी
  rationale: लैटिन पदबंध का शाब्दिक रूप ‘ध्वनि के साथ बजेगी’ हिन्दी में अनावश्यक पुनरुक्ति होता; ‘बजेगी’ में ध्वनि निकलने का भाव पहले से निहित है।
- source_word: cum omnes audierint
  choice: उसे सुनते ही सभी
  rationale: यहाँ cum के कालगत संबंध और audierint की पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी अतिरिक्त कारणात्मक अर्थ के।
- source_word: subito expavescent
  choice: अचानक भयभीत हो जाएँगे
  rationale: subito के आकस्मिकता-भाव और expavescent के तीव्र भय में पड़ने के भाव—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
