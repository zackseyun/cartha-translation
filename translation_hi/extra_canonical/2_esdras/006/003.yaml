  choice: मुख्य पाठ में व्यापक ‘गतियाँ’
  alternative: ‘भूकम्प’ या ‘हलचलें’
  rationale: लातीनी शब्द बहुअर्थी है। प्रसंग में भूकम्प सम्भव है, पर उपलब्ध स्रोत अकेले उस अर्थ को निश्चित नहीं करता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
