  text: And he said to me[a], “From Abraham to Abraham, because from him Jacob and Esau were born; for Jacob’s hand held Esau’s heel from the beginning. For Esau is the end of this age[b], and the beginning
translation:
  language: hi
  text: और उसने मुझसे कहा, “अब्राहम से अब्राहम तक[a], क्योंकि उसी से याकूब और एसाव उत्पन्न हुए; क्योंकि आरम्भ से ही याकूब का हाथ एसाव की एड़ी पकड़े हुए था। क्योंकि एसाव इस युग का अन्त है, और आरम्भ[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लातीनी साक्ष्य में “अब्राहम से अब्राहम तक” है, पर यह पाठ कठिन और सम्भवतः दूषित है; क्योंकि आगे कहा गया है कि “उसी से” याकूब और एसाव उत्पन्न हुए। कुछ अन्य प्राचीन भाषान्तरों में “अब्राहम से इसहाक तक” मिलता है।
    reason: textual_variant
  - marker: b
    text: वाक्य अगले पद में पूरा होता है।
    reason: verse_boundary
lexical_decisions:
- source_word: saeculi
  choice: युग
  rationale: लातीनी शब्द यहाँ वर्तमान विश्व-व्यवस्था या काल को सूचित करता है; ‘युग’ सहज हिन्दी में इस कालगत अर्थ को बनाए रखता है।
- source_word: calcaneum
  choice: एड़ी
  rationale: यह याकूब द्वारा एसाव की एड़ी पकड़े जाने के उत्पत्ति-वृत्तांत का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: tenebat
  choice: पकड़े हुए था
  rationale: यह अपूर्ण भूतकाल के निरन्तर भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ab initio
  choice: आरम्भ से ही
  rationale: लातीनी वाक्यांश के बल और कालगत संकेत, दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘ab Abraham usque ad Abraham’ का कठिन पाठ
  choice: मुख्य पाठ में ‘अब्राहम से अब्राहम तक’ रखा गया
  alternative: ‘अब्राहम से इसहाक तक’
  rationale: प्रदान किए गए लातीनी साक्ष्य को मुख्य पाठ में ज्यों का त्यों प्राथमिकता दी गई है। साथ का वाक्य इसे कठिन या दूषित पाठ बनाता है, इसलिए अन्य प्राचीन भाषान्तरों में सुरक्षित सम्भावित पाठ को पादटिप्पणी में बताया गया है, न कि चुपचाप मूल पाठ में बैठाया गया।
- issue: पद के अन्त में अधूरा वाक्य
  choice: ‘और आरम्भ—’ के बाद दीर्घ विराम-चिह्न लगाया गया
  alternative: अगले पद के आशय को जोड़कर वाक्य पूरा करना
  rationale: दिए गए स्रोतांश का वाक्य इसी स्थान पर अधूरा समाप्त होता है। अगले पद की सामग्री को इस पद में आयात किए बिना उसकी निरन्तरता स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-संरचना स्रोत के तर्क और पद-सीमा के निकट है, जबकि ‘पकड़े हुए था’ जैसे रूप स्वाभाविक हिन्दी प्रवाह देते हैं।
