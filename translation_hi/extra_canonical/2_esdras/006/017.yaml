  yaml_path: translation/extra_canonical/2_esdras/006/017.yaml
  text: And it happened, when I heard, that I stood upon my feet and listened, and behold, a voice was speaking, and its sound was like the sound of many waters.
translation:
  language: hi
  text: जब मैंने यह सुना, तब मैं अपने पैरों पर खड़ा हुआ और सुनने लगा। और देखो, एक आवाज़ बोल रही थी, और उसकी ध्वनि बहुत-से जलों की ध्वनि के समान थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est cum audissem
  choice: जब मैंने यह सुना, तो ऐसा हुआ कि
  rationale: लातीनी कथात्मक सूत्र और पूर्वकालिक क्रिया का अर्थ बनाए रखते हुए स्वाभाविक हिन्दी वाक्य दिया गया है।
- source_word: surrexi super pedes meos
  choice: मैं अपने पैरों पर खड़ा हो गया
  rationale: शाब्दिक बिंब को स्पष्ट और सामान्य आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: audiui
  choice: ध्यान से सुनने लगा
  rationale: संदर्भ में यह पहले सुनाई देने के बाद सचेत होकर सुनने की क्रिया है; केवल ‘सुना’ कहने से लातीनी वाक्य में आया क्रम अस्पष्ट हो सकता था।
- source_word: ecce
  choice: देखो
  rationale: दृश्य अथवा कथात्मक ध्यान आकर्षित करने वाले उद्गार को पारंपरिक किंतु सहज हिन्दी में रखा गया है।
- source_word: uox loquens
  choice: एक आवाज़ बोल रही थी
  rationale: लातीनी कृदंत-रचना का सीधा अर्थ रखा गया है, बिना वक्ता की पहचान जोड़े।
- source_word: sonus aquarum multarum
  choice: बहुत-से जलों की ध्वनि
  rationale: मूल के बहुवचन ‘aquarum’ और उसके प्रबल बिंब को सुरक्षित रखा गया है; इसे व्याख्यात्मक रूप से ‘प्रचंड जलप्रवाह’ नहीं बनाया गया।
theological_decisions:
- issue: बोलने वाली आवाज़ की पहचान
  choice: वक्ता को केवल ‘एक आवाज़’ कहा गया
  alternative: इसे परमेश्वर, स्वर्गदूत या किसी अन्य विशिष्ट वक्ता की आवाज़ बताना
  rationale: इस पद के उपलब्ध मूल पाठ में वक्ता की पहचान स्पष्ट नहीं है, इसलिए उस अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उपलब्ध पद-सीमा अंग्रेज़ी परामर्श-पाठ के अनुसार ‘बहुत-से जलों’ पर समाप्त की गई है; स्रोत में इसके बाद अगले कथन की आरंभिक, कटी हुई पंक्ति है।
