base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/016.yaml
  text: Because the speech concerns them[a], they will tremble and be shaken, for they know that their end must be changed.”
translation:
  language: hi
  text: क्योंकि यह बात उनके विषय में है,[a] वे काँपेंगे और हिल उठेंगे, क्योंकि वे जानते हैं कि उनका अंत बदला जाना अवश्य है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि बात उनसे संबंधित है, वे काँपेंगे और हिल उठेंगे, क्योंकि वे जानते हैं कि उनका अंत बदला जाना अवश्य है।”
    reason: ‘उनके विषय में’ और ‘उनसे संबंधित’ sermo के संबंध को व्यक्त करने वाले निकटवर्ती, संदर्भानुकूल विकल्प हैं; वैकल्पिक वाक्य को पूर्ण रूप में दिया गया है।
lexical_decisions:
- source_word: sermo (consultation text; supplied Latin excerpt is truncated before “bitur”)
  choice: वचन
  rationale: यह ‘वाणी/कथन/बात’ के अर्थ को गरिमापूर्ण और सहज रूप में व्यक्त करता है। उपलब्ध लैटिन अंश पद के आरंभ को सुरक्षित नहीं रखता, इसलिए अंग्रेज़ी परामर्श-पाठ से पुनर्निर्मित संदर्भ को सावधानी से रखा गया है।
- source_word: commutari
  choice: बदलना
  rationale: लैटिन क्रिया का मूल अर्थ ‘बदला जाना/परिवर्तित होना’ है; इसे किसी विशेष प्रकार के विनाश या उद्धार के रूप में नहीं समझाया गया।
- source_word: oportet
  choice: अवश्य है
  rationale: यह आवश्यकता या अनिवार्यता को व्यक्त करता है, मात्र संभावना को नहीं।
- source_word: finem eorum
  choice: उनके अंत
  rationale: ‘अंत’ की संदर्भगत अस्पष्टता—समाप्ति, परिणाम या नियत दशा—को बनाए रखता है।
theological_decisions:
- issue: ‘उनके अंत का बदलना’ किस प्रकार के परिवर्तन को दर्शाता है
  choice: परिवर्तन को अनिर्दिष्ट रखा गया
  alternative: इसे विनाश, न्याय या उद्धार के रूप में स्पष्ट करना
  rationale: लैटिन केवल इतना कहता है कि उनका अंत बदला जाना आवश्यक है; परिवर्तन की प्रकृति बताना पाठ से आगे जाना होता।
- issue: लैटिन ‘scit’ का वचन और कर्ता
  choice: अंग्रेज़ी परामर्श-पाठ के अनुसार बहुवचन ‘वे जानते हैं’
  alternative: एकवचन ‘वह जानता है’ अथवा ‘वचन जानता है’
  rationale: प्रदत्त लैटिन अंश खंडित है और ‘scit’ एकवचन है, पर सुरक्षित संदर्भ अस्पष्ट है। परामर्श-पाठ बहुवचन समूह को कर्ता मानता है; मुख्य पाठ में वही स्वाभाविक पुनर्निर्माण रखा गया, जबकि इस व्याकरणिक तनाव को निर्णय में दर्ज किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली। “काँपेंगे और हिल उठेंगे” दो निकटवर्ती क्रियाओं की तीव्रता बनाए रखता है। स्रोत-पंक्ति आरंभ में खंडित (“bitur”) और अंत में अगले वाक्य का “Et” लिए हुए है; इसलिए मुख्य पाठ अंग्रेज़ी के जाँचे हुए परामर्श-पाठ और उपलब्ध लैटिन प्रमाण, दोनों के आधार पर प्रस्तुत है।
