  text: Then you commanded that light should be brought forth from your treasuries, so that your works might then appear.
translation:
  language: hi
  text: तब आपने आज्ञा दी कि आपके भंडारों से प्रकाश निकाला जाए, ताकि उस समय आपके कार्य प्रकट हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन पाठ में “प्रकाश” के बाद quod luminis शब्द आते हैं, जिनका यहाँ अर्थ और व्याकरण अस्पष्ट है; कुछ पाठ-परंपराएँ इस स्थान को अलग रूप में प्रस्तुत करती हैं।
    reason: प्रदत्त लैटिन स्रोत में वास्तविक पाठगत कठिनाई है। मुख्य पाठ में संदर्भ के स्पष्ट अर्थ को रखा गया है और अनिश्चित शब्दों को चुपचाप कोई निश्चित अर्थ नहीं दिया गया।
lexical_decisions:
- source_word: dixisti
  choice: आपने आज्ञा दी
  rationale: शाब्दिक अर्थ ‘आपने कहा’ है, पर सृष्टि के इस प्रसंग में यह प्रभावकारी दैवी आदेश को व्यक्त करता है; इसलिए स्वाभाविक हिन्दी में ‘आज्ञा दी’ चुना गया।
- source_word: de thesauris tuis
  choice: आपके भंडारों से
  rationale: thesauri का मूल बिंब सुरक्षित रखते हुए ऐसी सामान्य हिन्दी चुनी गई है जो प्रकाश के दैवी भंडारों का संकेत देती है।
- source_word: proferri lumen
  choice: प्रकाश निकाला जाए
  rationale: निष्क्रिय infinitive proferri (‘बाहर लाया/निकाला जाना’) को हिन्दी में स्वाभाविक कर्मवाच्य रूप में रखा गया है।
- source_word: apparerent ... opera tua
  choice: आपके कार्य प्रकट हों
  rationale: apparere का अर्थ दिखाई देना या प्रकट होना है; ‘प्रकट हों’ दृश्यता और सृष्टि-कार्यों के सामने आने—दोनों भावों को बनाए रखता है।
theological_decisions:
- issue: दिव्य वचन का आदेशात्मक स्वर
  choice: ‘आपने आज्ञा दी’
  alternative: ‘आपने कहा’
  rationale: लैटिन dixisti अपने आप में ‘कहा’ है, किंतु प्रकाश को अस्तित्व में बुलाने वाले सृष्टि-वर्णन में आदेश का भाव निहित है। यह चयन किसी विशिष्ट सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: opera tua की अभिव्यक्ति
  choice: ‘आपके कार्य’
  alternative: ‘आपकी रचनाएँ’
  rationale: ‘कार्य’ लैटिन opera की व्यापकता बनाए रखता है और उसे केवल सृजी हुई वस्तुओं तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरार्थक दिव्य संबोधन रखा गया है। वाक्य सरल और गरिमापूर्ण है तथा मूल के भंडार, प्रकाश और प्रकट होने के बिंबों को सुरक्षित रखता है।
