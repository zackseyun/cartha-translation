  choice: उन्हें ‘जीवधारी’ कहा गया और उनके नाम ज्यों के त्यों रखे गए।
  alternative: उन्हें दैत्य, पौराणिक पशु या प्रतीक कहना।
  rationale: पाठ उन्हें animalia कहता है, लेकिन उनकी ठीक प्रकृति तय नहीं करता; इसलिए अनुवाद किसी विशेष व्याख्या को आरोपित नहीं करता।
