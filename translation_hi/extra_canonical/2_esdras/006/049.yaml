    text: बेहेमोथ और लिव्यातान आदिकालीन जीव हैं, जिनका उल्लेख यहूदी धर्मग्रंथों और बाद की यहूदी परंपरा में मिलता है। यहाँ एज्रा के सृष्टि-वर्णन में उनका उल्लेख सुरक्षित रखे गए प्राणियों के रूप में है।
    reason: cross_reference
lexical_decisions:
- source_word: conseruasti
  choice: सुरक्षित रखा
  rationale: यह क्रिया दोनों जीवधारियों को सृष्टि के समय बचाकर या अलग रखे जाने का भाव स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: duo animalia
  choice: दो जीवधारियों
  rationale: ‘जीवधारी’ लैटिन animalia के व्यापक अर्थ को व्यक्त करता है और इन्हें केवल सामान्य पशु मान लेने से बचाता है।
- source_word: Behemoth
  choice: बेहेमोथ
  rationale: मूल नाम का ध्वन्यात्मक लिप्यंतरण रखा गया है; इसका अर्थ लगाकर अनुवाद नहीं किया गया।
- source_word: Leviathan
  choice: लिव्यातान
  rationale: परंपरा में पहचाने जाने वाले मूल नाम का हिन्दी लिप्यंतरण रखा गया है।
theological_decisions:
