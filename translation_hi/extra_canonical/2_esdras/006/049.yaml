  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। परमेश्वर को संबोधित करते हुए आदरसूचक ‘आपने’ प्रयोग किया गया है। उपलब्ध लैटिन अंश ‘et’ पर कट जाता है; दूसरे जीव के नाम वाला वाक्यांश परामर्श-पाठ में संरक्षित पूर्ण पाठ के अनुसार प्रस्तुत किया गया है।
