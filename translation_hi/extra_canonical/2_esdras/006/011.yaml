lexical_decisions:
- source_word: ante oculos tuos
  choice: आपकी दृष्टि में
  rationale: शाब्दिक अर्थ ‘आपकी आँखों के सामने’ है, पर अनुग्रह पाने के मुहावरे में ‘आपकी दृष्टि में’ स्वाभाविक और अर्थनिष्ठ हिन्दी है।
- source_word: demonstres
  choice: दिखाएँ
  rationale: लैटिन क्रिया का सीधा और स्वाभाविक अर्थ सुरक्षित रखता है।
- source_word: seruo tuo
  choice: अपने सेवक को
  rationale: ईश्वर को संबोधित विनती में possessive संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: finem signorum
  choice: चिन्हों का अंत
  rationale: ‘finem’ और ‘signorum’ की अस्पष्टता तथा प्रलय-संबंधी तनाव को व्याख्यात्मक विस्तार के बिना बनाए रखता है।
theological_decisions:
- issue: ‘चिन्हों के अंत’ का आशय
  choice: चिन्हों का अंत
  alternative: चिन्हों की अंतिम परिणति / अंतिम चिन्ह
  rationale: स्रोत यह स्पष्ट नहीं करता कि आशय चिन्हों की समाप्ति, उनकी सीमा, या अंतिम चरण से है; इसलिए औपचारिक अस्पष्टता सुरक्षित रखी गई है।
- issue: खंडित पाठ का पूर्ववर्ती वाक्य से संबंध
  choice: मुख्य पाठ को उपलब्ध लैटिन खंड के अनुसार रखा
  alternative: पिछले पाठ-रूप के आधार पर पूरा संबोधन जोड़ना
  rationale: दिए गए स्रोत में केवल ‘आपकी दृष्टि में…’ से आरम्भ होने वाला खंड है; अनुपस्थित सामग्री को मुख्य पाठ में पुनर्निर्मित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। पद स्रोत में वाक्य का मध्यांश प्रतीत होता है, इसलिए हिन्दी में भी आरम्भिक खंडितता बनाए रखी गई है।
