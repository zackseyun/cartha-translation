  rationale: लैटिन के दोहरे संबोधन और dominator के अधिकार-सूचक भाव को बिना किसी सम्प्रदायगत विशेषार्थ के बनाए रखता है।
- source_word: si inueni gratiam
  choice: यदि मुझ पर अनुग्रह हुआ है
  rationale: लैटिन मुहावरे ‘यदि मैंने अनुग्रह पाया है’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; वाक्य स्रोत की तरह यहाँ अधूरा रहता है।
