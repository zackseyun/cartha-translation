  rationale: यह ‘कुछ और/अन्य बात’ का स्वाभाविक हिन्दी रूप है और आगे या अतिरिक्त पूछने, दोनों की संभावित छाया बनाए रखता है।
- source_word: noli querere
  choice: मत पूछो
  rationale: निषेधात्मक आज्ञा का सीधा और स्वाभाविक रूप।
- source_word: dominator domine
