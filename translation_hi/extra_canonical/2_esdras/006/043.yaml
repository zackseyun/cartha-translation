translation:
  language: hi
  text: क्योंकि आपका वचन निकला, और काम तुरंत हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध लातीनी स्रोत-अंश में इस पद के आरंभ का केवल “क्योंकि वचन…” भाग सुरक्षित है; शेष अनुवाद संरक्षित पाठ-परंपरा और परामर्श-पाठ के आधार पर दिया गया है।
    reason: दिया गया लातीनी अंश “Verbum enim” पर समाप्त होता है; इसलिए पाठक को इस पद के शेष भाग के प्रत्यक्ष लातीनी साक्ष्य की सीमा बताना आवश्यक है।
lexical_decisions:
- source_word: Verbum
  choice: वचन
  rationale: लातीनी शब्द का अर्थ यहाँ सृष्टिकर्ता की प्रभावकारी आज्ञा/वाणी है; ‘वचन’ इस अर्थ को गरिमापूर्ण और संक्षिप्त रूप में बनाए रखता है।
- source_word: enim
  choice: क्योंकि
  rationale: यह अव्यय पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: went forth
  choice: निकलते ही
  rationale: उपलब्ध लातीनी अंश में संबंधित क्रिया अनुपस्थित है, पर परामर्श-पाठ के भाव ‘went forth’ और कार्य की तत्कालता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: the work was immediately done
  choice: काम तुरंत पूरा हो गया
  rationale: ‘काम’ सामान्य पाठक के लिए सहज है और ‘पूरा हो गया’ सृष्टिकारी आदेश के तत्काल सिद्ध होने का भाव देता है।
theological_decisions:
- issue: ‘वचन’ को व्यक्ति-संज्ञा या केवल आज्ञा मानना
  choice: ‘आपका वचन’ के रूप में अस्पष्टता बनाए रखी गई
  alternative: ‘आपकी आज्ञा’ या व्यक्तिवाचक ‘वचन’
  rationale: संदर्भ सृष्टिकारी वाणी की ओर संकेत करता है, पर पाठ स्वयं किसी विशेष बाद की धर्मवैज्ञानिक पहचान को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘निकलते ही’ और ‘तुरंत’ से मूल कथन की तत्कालता स्पष्ट रहती है।
