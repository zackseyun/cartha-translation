source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et sciritabuntur, Et subito apparebunt seminata loca non seminata, et plena prumptuaria subito inuenientur uacua, Et tuba canet cum sono, quam cum omnes audierint subito expauescent.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/022.yaml
  text: And suddenly places sown will appear unsown, and full storehouses will suddenly be found empty, and the trumpet will sound, which when all hear, they will suddenly be terrified.
translation:
  language: hi
  text: और अचानक बोए हुए खेत बिना बोए हुए दिखाई देंगे, और भरे हुए भंडारगृह अचानक खाली पाए जाएँगे; और तुरही ध्वनि के साथ बजेगी, जिसे सुनते ही सभी लोग अचानक भयभीत हो जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminata loca
  choice: बोए हुए खेत
  rationale: शाब्दिक अर्थ ‘बोए हुए स्थान’ है; कृषि-संदर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करने के लिए ‘खेत’ चुना गया।
- source_word: non seminata
  choice: बिना बोए हुए
  rationale: 'स्रोत के विरोधाभासी चिह्न को बनाए रखता है: जो खेत बोए गए हैं, वे ऐसे दिखाई देंगे मानो उनमें बुवाई न हुई हो।'
- source_word: plena prumptuaria
  choice: भरे हुए भंडार
  rationale: prumptuaria संग्रह-स्थलों या भंडारगृहों को दर्शाता है; ‘भंडार’ सरल, व्यापक और प्रसंगानुकूल है।
- source_word: tuba canet cum sono
  choice: तुरही बजेगी
  rationale: ‘तुरही’ tuba का पारंपरिक और स्पष्ट हिन्दी प्रतिशब्द है; बजने में ध्वनि का भाव स्वाभाविक रूप से निहित है।
- source_word: subito expauescent
  choice: अचानक भयभीत हो जाएँगे
  rationale: expavescere तीव्र भय या आतंक से भर जाने को दर्शाता है; यह चयन स्रोत की अकस्मात प्रतिक्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: तुरही की पहचान और उसका युगांत-संबंधी अर्थ
  choice: केवल ‘तुरही’ कहा गया, उसकी पहचान या उद्देश्य नहीं समझाया गया।
  alternative: इसे ‘अंतिम तुरही’ या न्याय की तुरही कहना।
  rationale: लैटिन पाठ केवल tuba कहता है; अधिक विशिष्ट व्याख्या पाठ में संप्रदायगत या बाहरी धर्मवैज्ञानिक निष्कर्ष जोड़ देती।
- issue: बोए हुए स्थानों का बिना बोया दिखाई देना
  choice: पाठ के विस्मयकारी विरोधाभास को ज्यों का त्यों रखा गया।
  alternative: इसे फसल न उगने, खेत उजड़ने या उपज गायब होने के रूप में स्पष्ट करना।
  rationale: स्रोत परिणाम की व्याख्या नहीं करता; genuine ambiguity और अपशकुनी तनाव बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और घोषणात्मक शैली रखी गई है। लंबे लैटिन वाक्य को दो वाक्यों में बाँटकर पठनीयता बढ़ाई गई, जबकि तीनों संकेतों का क्रम और दो बार आने वाला ‘अचानक’ सुरक्षित रखा गया।
