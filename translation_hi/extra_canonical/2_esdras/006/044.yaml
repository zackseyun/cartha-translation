source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuum processit, et opus statim fiebat. Processit enim subito fructus multitudinis inmensus et concupiscentia gustus multiformis et flores colore inimitabiles et odores odoramentis inuestigabiles. die tertio haec facta sunt. Quarto autem die imperasti fieri solis splendorem, lunae lumen, stellarum dispositionem, Et imperasti eis ut deseruirent futuro plasmato
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/044.yaml
  text: For at once there came forth fruit in immeasurable abundance[a], and manifold delights of taste, and flowers of inimitable color, and scents of unsearchable fragrance. These things were made on the third day.
translation:
  language: hi
  text: क्योंकि अचानक ही असीम बहुतायत में फल उत्पन्न हुए, स्वादों के विविध आनंद[a], अनुपम रंगों के फूल, और खोज से परे सुगंधें। ये सब तीसरे दिन बनाए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “विविध स्वाद की अभिलाषा।”
    reason: लातीनी concupiscentia gustus multiformis की शाब्दिक अभिव्यक्ति असामान्य है। संदर्भ में यह सृजित वनस्पति की स्वाद-संबंधी रमणीयता या आनंद को सूचित कर सकती है, जबकि शाब्दिक रूप ‘अभिलाषा’ का अर्थ भी संभव रखता है।
lexical_decisions:
- source_word: fructus multitudinis inmensus
  choice: अथाह बहुतायत में फल
  rationale: लातीनी पदबंध फल की अपरिमित प्रचुरता बताता है; यह हिंदी में अर्थ और बल दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: concupiscentia gustus multiformis
  choice: नाना प्रकार के मनभावने स्वाद
  rationale: शाब्दिक ‘नाना प्रकार के स्वाद की अभिलाषा’ यहाँ सृजी गई वनस्पति के बजाय किसी व्यक्ति की मानसिक इच्छा का आभास दे सकती है। संदर्भ में यह विविध स्वादों की मनोहरता या आनंददायकता को व्यक्त करता है; मूल की असामान्य शब्दावली पादटिप्पणी में सुरक्षित है।
- source_word: flores colore inimitabiles
  choice: ऐसे रंगों के फूल जिनकी बराबरी नहीं की जा सकती
  rationale: inimitabiles का अर्थ अनुपम या जिसकी नकल/बराबरी न हो; सरल आधुनिक हिंदी में वर्णनात्मक रूप अधिक स्पष्ट है।
- source_word: odores odoramentis inuestigabiles
  choice: ऐसी सुगंधें जिनकी थाह नहीं पाई जा सकती
  rationale: दोहरावयुक्त लातीनी अभिव्यक्ति सुगंध की अगम अथवा अपरिमेय विशेषता पर बल देती है; हिंदी में अनावश्यक कृत्रिम पुनरुक्ति से बचते हुए उसका बल रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सृष्टि-वर्णन की काव्यात्मक तीव्रता के लिए ‘अचानक ही’, ‘अथाह बहुतायत’ और समानांतर वर्णनात्मक पदों का प्रयोग किया गया है।
