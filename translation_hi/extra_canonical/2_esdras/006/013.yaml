  text: And he answered and said to me[a], “Stand upon your feet, and you will hear a full, resounding voice.
translation:
  language: hi
  text: और उसने मुझे उत्तर दिया, “अपने पैरों पर खड़े हो जाओ; तब तुम एक भरपूर, गूँजती हुई आवाज़ सुनोगे[a]।”
  philosophy: optimal-equivalence
