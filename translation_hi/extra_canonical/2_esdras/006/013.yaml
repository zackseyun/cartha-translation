lexical_decisions:
- source_word: uocem plenissimam sonus
  choice: एक भरपूर, गूँजती हुई आवाज़
  rationale: लैटिन पाठ का शब्दक्रम और व्याकरण असामान्य है, पर उसका आशय ऐसी आवाज़ से है जो ध्वनि से पूरी तरह भरी और प्रबलता से गूँजने वाली हो। यह हिंदी अभिव्यक्ति plenissimam की तीव्रता और sonus के श्रव्य प्रभाव—दोनों को स्वाभाविक ढंग से रखती है।
- source_word: sta super pedes tuos
  choice: अपने पैरों पर खड़े हो जाओ
  rationale: आज्ञार्थक अभिव्यक्ति का सीधा, स्वाभाविक और गरिमापूर्ण हिंदी रूप।
- source_word: audies
  choice: तब तुम…सुनोगे
  rationale: भविष्यकालीन प्रतिज्ञा को स्पष्ट रखता है; ‘तब’ आज्ञा और उसके परिणाम का स्वाभाविक संबंध दिखाता है।
