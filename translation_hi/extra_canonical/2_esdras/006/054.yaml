id: 2ES.6.54
reference: 2 Esdras 6:54
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et super his Adam quem constituisti ducem super omnibus factis quae fecisti, et ex eo educimur nos omnes quem elegisti populum. Haec autem omnia dixi coram te, domine, quoniam dixisti quia propter nos creasti primogenitum saeculum. Residuas autem gentes ab Adam natas dixisti eas nihil esse et quoniam saliuae adsimilatae sunt et sicut stillicidium de uaso similasti habundantiam eorum. Et nunc, domine, ecce istae gentes quae in nihilum deputatae sunt dominantur nostri et deuorant nos. Nos autem populus tuus quem uocasti primogenitum, unigenitum, aemulatorem, carissimum traditi sumus in manibus eorum. Et si propter nos creatum est saeculum, quare non haereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/054.yaml
  text: And over these is Adam[a], whom you appointed ruler over all the works that you made; and from him we all have come, the people whom you have chosen.
translation:
  language: hi
  text: और इन सबके ऊपर आदम है, जिसे तूने अपनी बनाई हुई सारी वस्तुओं पर प्रधान ठहराया; और उसी से हम सब[a] निकले हैं—जिस प्रजा को तूने चुना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसी से हम सब निकले हैं, और वह प्रजा जिसे तूने चुना है।”
    reason: लैटिन वाक्यरचना को इस प्रकार भी समझा जा सकता है कि ‘हम सब’ और ‘वह प्रजा’ दो समन्वित पद हैं, यद्यपि मुख्य पाठ उन्हें समानाधिकरण मानता है।
lexical_decisions:
- source_word: super his
  choice: इन सबके ऊपर
  rationale: सृष्टि की पहले उल्लिखित वस्तुओं पर आदम की स्थापित प्रधानता को सीधे व्यक्त करता है।
- source_word: ducem
  choice: प्रधान
  rationale: यहाँ शब्द का अर्थ अगुआ अथवा शासक है; ‘प्रधान’ अधिकार और नेतृत्व दोनों को स्वाभाविक हिन्दी में समेटता है।
- source_word: ex eo educimur
  choice: उसी से हम सब निकले हैं
  rationale: आदम से वंशगत उत्पत्ति का भाव बनाए रखता है और लैटिन के वर्तमान रूप को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: populum
  choice: प्रजा
  rationale: चुने हुए सामूहिक जनसमुदाय के लिए गरिमापूर्ण और प्रसंगानुकूल शब्द है।
theological_decisions:
- issue: ‘nos omnes’ और ‘quem elegisti populum’ का संबंध
  choice: ‘हम सब’ को ‘वह प्रजा जिसे तूने चुना है’ के समानाधिकरण में रखा गया
  alternative: ‘हम सब और वह प्रजा जिसे तूने चुना है’ को दो अलग समूह मानना
  rationale: लैटिन में ‘populum’ सापेक्ष उपवाक्य के भीतर होने पर भी ‘nos omnes’ का समानाधिकरण प्रतीत होता है; इससे वक्ता के समुदाय की पहचान चुनी हुई प्रजा के रूप में बनी रहती है। वैकल्पिक व्याकरणिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर को संबोधन में एकवचन ‘तू’ रखा गया है। भाषा गरिमापूर्ण पर सहज है, और लंबे लैटिन वाक्य का संबंध अर्धविराम तथा डैश से स्पष्ट किया गया है।
