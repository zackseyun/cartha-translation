id: 2ES.6.39
reference: 2 Esdras 6:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erat tunc spiritus volans, et tenebrae circumferebantur et silentium, sonus vocis hominis nondum erat abs te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/039.yaml
  text: And at that time the spirit was moving[a], and darkness and silence were surrounding everything; the sound of a human voice was not yet from you.
translation:
  language: hi
  text: और उस समय आत्मा चल रही थी,[a] और अंधकार तथा निस्तब्धता चारों ओर फैले हुए थे; मनुष्य की वाणी का स्वर अभी तक तेरी ओर से नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उड़ रही थी’; अथवा, ‘मंडरा रही थी’।
    reason: लातीनी volans का शाब्दिक अर्थ ‘उड़ती हुई’ है; सृष्टि-संदर्भ में ‘मंडराना’ भी संभव है। मुख्य पाठ का ‘चल रही थी’ गति को व्यक्त करता है, पर उसकी प्रकृति निश्चित नहीं करता।
lexical_decisions:
- source_word: spiritus
  choice: आत्मा
  rationale: लातीनी शब्द का सीधा और संदर्भतः उपयुक्त समतुल्य; यहाँ सृष्टि-वर्णन में निहित संभावित धार्मिक अर्थ को बनाए रखता है।
- source_word: volans
  choice: गतिमान थी
  rationale: शाब्दिक अर्थ ‘उड़ रही थी’ है, पर यहाँ गति का व्यापक भाव अधिक स्वाभाविक है और ‘मंडरा रही थी’ जैसी अधिक विशिष्ट व्याख्या को आरोपित नहीं करता।
- source_word: tenebrae
  choice: अंधकार
  rationale: सृष्टि-पूर्व दशा के लिए स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य।
- source_word: silentium
  choice: निस्तब्धता
  rationale: ‘मौन’ की अपेक्षा वातावरण में ध्वनि के पूर्ण अभाव को अधिक स्पष्ट करता है और dignified आधुनिक हिन्दी में स्वाभाविक है।
- source_word: circumferebantur
  choice: चारों ओर छाए हुए थे
  rationale: मूल के चारों ओर व्याप्त या फैले होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; कर्मवाच्य की कृत्रिमता से बचता है।
- source_word: sonus vocis hominis
  choice: मनुष्य की वाणी का स्वर
  rationale: sonus और vox दोनों को पृथक रूप से दर्शाता है, जबकि हिन्दी में अर्थग्राह्य रहता है।
- source_word: nondum erat abs te
  choice: तब तक तेरी ओर से नहीं हुआ था
  rationale: abs te के उद्गम अथवा कर्तृत्व-सूचक अस्पष्ट भाव को बनाए रखता है; ‘उत्पन्न नहीं किया गया था’ जैसी अधिक निर्णायक व्याख्या नहीं करता।
theological_decisions:
- issue: spiritus का आशय
  choice: आत्मा
  alternative: वायु / श्वास
  rationale: सृष्टि-वर्णन में ‘आत्मा’ संभावित दिव्य संकेत को सुरक्षित रखता है, पर बड़े अक्षर जैसी आधुनिक संपादकीय युक्ति से व्यक्तित्व को निर्णायक रूप से निर्धारित नहीं करता।
- issue: volans की गति का प्रकार
  choice: गतिमान थी
  alternative: मंडरा रही थी / उड़ रही थी
  rationale: मूल participle गति बताता है, पर उसकी ठीक प्रकृति को निश्चित नहीं करता; इसलिए तटस्थ अभिव्यक्ति चुनी गई।
- issue: abs te में उद्गम या कर्तृत्व
  choice: तेरी ओर से नहीं हुआ था
  alternative: तूने उत्पन्न नहीं किया था
  rationale: मूल वाक्यांश उद्गम और कर्तृत्व दोनों की छाया रख सकता है; चुना हुआ पाठ इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ईश्वर को संबोधन के लिए ‘तेरी’ रखा गया है, जो इस प्रत्यक्ष संबोधन की निकटता और एकवचन को स्पष्ट करता है। मुख्य पाठ में मूल की असामान्य अंतिम अभिव्यक्ति को अत्यधिक व्याख्यायित किए बिना स्वाभाविक बनाने का प्रयास किया गया है।
