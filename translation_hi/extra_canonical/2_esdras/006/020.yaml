id: 2ES.6.20
reference: 2 Esdras 6:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quando suppleta fuerit humilitas Sion, Et cum supersignabitur saeculum quod incipiet pertransire, haec signa faciam: libri aperientur ante faciem firmamenti, et omnes uidebunt simul,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/020.yaml
  text: 'when the humiliation of Zion is completed[a], and when the age that is beginning to pass away is marked out, I will perform these signs: the books will be opened before the face of the firmament, and all will see together.'
translation:
  language: hi
  text: 'जब सिय्योन का अपमान समाप्त हो जाएगा, और जब वह युग, जिसका बीतना आरंभ हो रहा है, चिह्नित कर दिया जाएगा[a], तब मैं ये चिन्ह करूँगा: आकाशमंडल के सामने पुस्तकें खोली जाएँगी, और सब लोग एक साथ देखेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुहरबंद कर दिया जाएगा।”
    reason: लातीनी supersignabitur का अर्थ ‘ऊपर से चिह्नित’ अथवा ‘मुहरबंद’ समझा जा सकता है।
lexical_decisions:
- source_word: suppleta fuerit humilitas Sion
  choice: सिय्योन के अपमान का समय पूरा हो जाएगा
  rationale: शाब्दिक ‘सिय्योन का अपमान पूरा होगा’ हिन्दी में अस्वाभाविक है; ‘का समय’ जोड़कर humilitas की अपमानित अवस्था और suppleta fuerit की पूर्णता को स्पष्ट, स्वाभाविक रूप दिया गया है।
- source_word: supersignabitur
  choice: चिह्नित कर दिया जाएगा
  rationale: यह दुर्लभ क्रिया मुहर लगाने या ऊपर से चिह्न अंकित करने का भाव दे सकती है। मुख्य पाठ में अपेक्षाकृत व्यापक ‘चिह्नित’ रखा गया है और ‘मुहरबंद’ को पादटिप्पणी में दिया गया है।
- source_word: saeculum quod incipiet pertransire
  choice: वह युग, जिसका बीतना आरंभ हो रहा है
  rationale: saeculum को ‘युग’ और pertransire को ‘बीतना’ कहा गया है; वाक्यांश के आरंभिक और क्रमिक पक्ष को बनाए रखा गया है।
- source_word: haec signa faciam
  choice: मैं ये चिन्ह घटित करूँगा
  rationale: faciam का अर्थ ‘करूँगा’ है, ‘दिखाऊँगा’ नहीं। ‘चिन्ह घटित करूँगा’ हिन्दी में इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ante faciem firmamenti
  choice: आकाशमंडल के सामने
  rationale: firmamentum के पारंपरिक ब्रह्मांडीय अर्थ के लिए ‘आकाशमंडल’ और ante faciem के लिए स्वाभाविक ‘के सामने’ चुना गया है।
- source_word: omnes uidebunt simul
  choice: सब लोग एक साथ देखेंगे
  rationale: omnes की सार्वभौमिकता और simul की समकालिकता दोनों सुरक्षित रखी गई हैं।
theological_decisions:
- issue: अंतिम युग पर लगाए जाने वाले चिह्न का स्वरूप
  choice: मुख्य पाठ में ‘चिह्नित कर दिया जाएगा’
  alternative: ‘मुहरबंद कर दिया जाएगा’
  rationale: supersignabitur का सटीक आशय अनिश्चित है। व्यापक अनुवाद मुख्य पाठ में रखकर अधिक विशिष्ट मुहरबंदी की छवि को पादटिप्पणी में सुरक्षित किया गया है, ताकि पाठ किसी एक अंत-कालीन व्याख्या तक सीमित न हो।
- issue: ‘पुस्तकों’ की पहचान
  choice: केवल ‘पुस्तकें’
  alternative: ‘न्याय की पुस्तकें’ या कोई अन्य व्याख्यात्मक विस्तार
  rationale: स्रोत केवल libri कहता है; दानिय्येल-सदृश न्याय-दृश्य संभव है, पर उसे स्पष्ट करके जोड़ना मूल की अपेक्षा अधिक व्याख्यात्मक होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आकाशमंडल’ apocalyptic दृश्य की ऊँची शैली बनाए रखता है, जबकि वाक्य-विन्यास सहज हिन्दी में है।
