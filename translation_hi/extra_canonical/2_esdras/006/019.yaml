  text: and when I begin to inquire of those who have unjustly harmed others by their injustice[a], and
translation:
  language: hi
  text: और मैं उन लोगों से पूछताछ करना आरम्भ करूँगा, जिन्होंने अपने ही अन्याय के द्वारा अन्यायपूर्वक हानि पहुँचाई[a], और
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं उन लोगों से लेखा माँगना आरम्भ करूँगा, जिन्होंने अपने ही अन्याय के द्वारा अन्यायपूर्वक हानि पहुँचाई, और”।
    reason: inquirere न्यायिक प्रसंग में केवल पूछताछ करने के बजाय जवाबदेही ठहराने या लेखा माँगने का भाव भी रख सकता है।
lexical_decisions:
- source_word: inquirere
  choice: पूछताछ करना
  rationale: यह लैटिन क्रिया के जाँचने या प्रश्न करने के मूल भाव को सीधे व्यक्त करता है; न्यायिक संदर्भ में इसका अर्थ लेखा माँगना भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: iniuste ... iniustitia sua
  choice: अपने ही अन्याय से अन्यायपूर्वक
  rationale: मूल पाठ में क्रियाविशेषण और संज्ञा की जानबूझकर की गई पुनरुक्ति को बनाए रखता है। ‘ही’ sua के आत्म-संबंधी बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: nocuerunt
  choice: हानि पहुँचाई है
  rationale: क्रिया के सामान्य अर्थ को बनाए रखता है और मूल में अनुक्त कर्म को जोड़कर सीमित नहीं करता।
- source_word: et
  choice: और
  rationale: पद के अंत में अधूरे संयोजन को सुरक्षित रखता है, क्योंकि वाक्य अगले पद में जारी रहता है।
theological_decisions:
- issue: inquirere का न्यायिक बल
  choice: मुख्य पाठ में ‘पूछताछ करना’
  alternative: ‘लेखा माँगना’
  rationale: ‘पूछताछ’ लैटिन के व्यापक अर्थ के अधिक निकट है और अंतिम न्याय के संदर्भ को अनावश्यक रूप से अधिक निश्चित नहीं बनाता; प्रबल न्यायिक अर्थ पादटिप्पणी में दिया गया है।
- issue: हानि पाने वाले कर्म का अभाव
  choice: कर्म को अनुक्त रखा गया
  alternative: ‘दूसरों को हानि पहुँचाई’
  rationale: लैटिन में nocuerunt का कर्म व्यक्त नहीं है; ‘दूसरों को’ जोड़ने से अर्थ स्वाभाविक तो होता, पर स्रोत से अधिक विशिष्ट हो जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल लैटिन की पुनरुक्ति तथा पद के अंत का अधूरा ‘और’ जानबूझकर सुरक्षित रखा गया है; अंग्रेज़ी परामर्श-पाठ का ‘when’ मूल उद्धृत लैटिन में न होने के कारण नहीं जोड़ा गया।
