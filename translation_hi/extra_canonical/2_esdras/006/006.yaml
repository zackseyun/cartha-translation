  text: 'consignarentur qui fidem thesaurizauerunt: Tunc cogitaui et facta sunt haec per me et non per alium, ut et finis per me et non per alium. Et respondi et dixi : quae erit separatio tem-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/006.yaml
  text: Then I considered, and these things were made through me and not through another, so also the end will be through me and not through another.”
translation:
  language: hi
  text: तब मैंने विचार किया, और ये सब मेरे ही द्वारा बनाए गए, किसी और के द्वारा नहीं; इसी प्रकार अंत भी मेरे ही द्वारा होगा, किसी और के द्वारा नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogitaui
  choice: मैंने विचार किया
  rationale: लातीनी क्रिया का सीधा और स्वाभाविक अर्थ रखा गया है; कर्म को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: facta sunt haec per me
  choice: ये सब मेरे ही द्वारा बनाए गए
  rationale: सृष्टिकर्ता के कथन के संदर्भ में facta sunt को निष्क्रिय सृजनार्थक रूप में व्यक्त किया गया है और per me के बल को ‘मेरे ही द्वारा’ से सुरक्षित रखा गया है।
- source_word: finis
  choice: अंत
  rationale: मूल के व्यापक और धर्मवैचारिक रूप से खुलापन रखने वाले शब्द को किसी अधिक विशिष्ट व्याख्या, जैसे ‘जगत का अंत’, में सीमित नहीं किया गया।
theological_decisions:
- issue: आरंभ और अंत—दोनों के एक ही कर्ता द्वारा होने पर बल
  choice: ‘मेरे ही द्वारा ... किसी और के द्वारा नहीं’ दोनों खंडों में बनाए रखा
  alternative: दूसरे खंड को केवल ‘मैं ही अंत करूँगा’ कहना
  rationale: मूल की समानांतर संरचना और दैवी एकमात्र कर्तृत्व पर दिए गए स्पष्ट बल को सुरक्षित रखा गया है।
- issue: finis का आशय
  choice: ‘अंत’
  alternative: ‘संसार का अंत’ अथवा ‘पूर्णता’
  rationale: लातीनी पाठ स्वयं आशय को अधिक स्पष्ट नहीं करता, इसलिए वास्तविक अर्थगत व्यापकता को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास। ‘मेरे ही द्वारा’ मूल के विरोधात्मक बल को व्यक्त करता है; कोई पाद-टिप्पणी आवश्यक नहीं।
