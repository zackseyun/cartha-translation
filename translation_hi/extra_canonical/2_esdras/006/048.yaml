translation:
  language: hi
  text: 'वह एकत्र हुआ[a], ताकि पशु, पक्षी और मछलियाँ उत्पन्न कर सके; और ऐसा ही हुआ: मूक और प्राणरहित जल ने जीवित प्राणियों को उत्पन्न किया, जैसा उसे आदेश दिया गया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य पिछले पद से जुड़ता है; आशय है कि जल एकत्र हुआ।
    reason: लातिनी पाठ congregata से आरम्भ होता है और उसका संज्ञा-संदर्भ पिछले पद के aqua से मिलता है।
lexical_decisions:
- source_word: congregata
  choice: वह इकट्ठा हुआ
  rationale: यह स्त्रीलिंग रूप पिछले संदर्भ के ‘जल’ (aqua) से जुड़ता है। हिन्दी में पिछले पद से संबंध बनाए रखते हुए सर्वनाम रखा गया है।
- source_word: procrearet
  choice: उत्पन्न करे
  rationale: सृष्टि-वर्णन में जन्म देने या अस्तित्व में लाने के व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: animalia, uolatilia et pisces
  choice: पशु, पक्षी और मछलियाँ
  rationale: तीनों जीव-श्रेणियों को स्पष्ट और सामान्य आधुनिक हिन्दी में रखा गया है।
- source_word: aqua muta et sine anima
  choice: मूक और प्राणरहित जल
  rationale: मूल के असामान्य मानवीकरण और निर्जीवता के विरोधाभास को सरल किए बिना सुरक्षित रखता है।
- source_word: animalia
  choice: जीवित प्राणियों
  rationale: अंतिम animalia को केवल ‘पशु’ कहने के बजाय व्यापक अर्थ में रखा गया है, जिससे प्राणरहित जल और उससे निकले सजीव प्राणियों का विरोध उभरता है।
- source_word: quod ei iubebatur
  choice: जैसी उसे आज्ञा दी गई थी
  rationale: लातिनी पाठ की संक्षिप्त और कुछ अनगढ़ रचना का आशय यही है कि जल ने आदेश के अनुसार प्राणी उत्पन्न किए।
theological_decisions:
- issue: सृष्टि में जल की भूमिका
  choice: जल ने आज्ञा के अनुसार जीवित प्राणियों को उत्पन्न किया
  alternative: परमेश्वर ने जल से जीवित प्राणी उत्पन्न किए
  rationale: मूल पाठ जल को व्याकरणिक कर्ता बनाता है और उसे मिली आज्ञा का उल्लेख करता है; स्पष्ट निहित कर्ता ‘परमेश्वर’ जोड़ना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘मूक और प्राणरहित जल’ मूल की काव्यात्मक तथा धर्मवैचारिक तनावपूर्ण अभिव्यक्ति को जानबूझकर बनाए रखता है।
