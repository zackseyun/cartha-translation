  text: do not be terrified, because the word concerns the end, and the foundations of the earth will tremble and be shaken, because the discourse is about them.
translation:
  language: hi
  text: भयभीत मत हो, क्योंकि यह वचन अंत के विषय में है; और पृथ्वी की नींवें काँपेंगी और हिलाई जाएँगी, क्योंकि चर्चा उन्हीं के विषय में है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: expauescas
  choice: घबरा
  rationale: यह क्रिया तीव्र भय या आतंक व्यक्त करती है। उपलब्ध आलोचनात्मक संदर्भ और परामर्श-पाठ के अनुसार निषेध के साथ ‘मत घबरा’ किया गया है।
- source_word: de fine uerbum
  choice: यह वचन अंत के विषय में है
  rationale: ‘uerbum’ को प्रसंग में संदेश/कथन के अर्थ में ‘वचन’ और ‘de fine’ को बिना अतिरिक्त व्याख्या के ‘अंत के विषय में’ रखा गया है।
- source_word: fundamenta terrae
  choice: पृथ्वी की नींवें
  rationale: मूल रूपक को यथासंभव सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: tremescet et commoue-
  choice: थरथराएँगी और हिलाई जाएँगी
  rationale: खंडित रूप के पीछे स्पष्टतः काँपने और हिलाए जाने की दोहरी गति है; दोनों क्रियाओं को बनाए रखा गया है।
- source_word: de ipsis sermo
  choice: यह बात उन्हीं के विषय में है
  rationale: ‘ipsis’ के बलाघात को ‘उन्हीं’ से और ‘sermo’ को यहाँ स्वाभाविक ‘बात’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘अंत’ का आशय
  choice: ‘अंत’ को अनिर्दिष्ट रखा गया
  alternative: ‘संसार का अंत’ या ‘अंत समय’
  rationale: मूल में केवल ‘fine’ है; किसी विशिष्ट युगांत-संबंधी व्याख्या को जोड़ना उचित नहीं।
- issue: पृथ्वी की नींवों का चित्रण
  choice: मूल रूपक को शाब्दिक रूप से बनाए रखा
  alternative: ‘सारी पृथ्वी काँप उठेगी’
  rationale: विस्तृत भावानुवाद मूल के विशिष्ट ‘नींवें’ वाले चित्र को मिटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। आदेशात्मक एकवचन ‘मत घबरा’ प्रसंग की सीधी संबोधन-शैली रखता है; ‘थरथराएँगी’ स्त्रीलिंग बहुवचन ‘नींवें’ के अनुरूप है।
