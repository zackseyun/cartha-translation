review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the accepted audit-trail construal of the difficult, syntactically dislocated Latin: the message concerns the end; the earth’s foundations will tremble and be shaken; and the discourse concerns those foundations. It appropriately retains the unqualified ‘end’ and the foundation imagery. ‘हिलाई जाएँगी’ accurately reflects the passive force of commovebuntur.'
  naturalness: The text is generally clear and dignified. ‘मत घबरा’ is understandable but somewhat colloquial for the elevated direct address of this passage. ‘भयभीत मत हो’ gives a more fitting modern-standard biblical register. ‘काँपेंगी’ is more direct than ‘थरथराएँगी’ while retaining the sense of tremescere.
  terminology: ‘वचन’ is an acceptable rendering of verbum in this context, and ‘पृथ्वी की नींवें’ faithfully preserves fundamenta terrae. Replacing the final generic ‘यह बात’ with ‘चर्चा’ better distinguishes sermo and makes the referent of ‘उन्हीं’ explicit without adding interpretation.
  issues:
  - severity: low
    issue: Register of the opening prohibition
    rationale: ‘मत घबरा’ is more conversational than the passage’s solemn address. ‘भयभीत मत हो’ is natural modern Hindi and closer to the intensity of expauescas.
  - severity: low
    issue: Final rendering of sermo
    rationale: ‘यह बात’ is possible, but ‘चर्चा’ more specifically represents sermo (‘discourse/discussion’) and reduces repetition of ‘वचन’ without changing meaning.
  revised_text: भयभीत मत हो, क्योंकि यह वचन अंत के विषय में है; और पृथ्वी की नींवें काँपेंगी और हिलाई जाएँगी, क्योंकि चर्चा उन्हीं के विषय में है।
