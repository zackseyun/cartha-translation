reference: 2 Esdras 6:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: stabunt ut non decurrant in horis tribus. Et erit omnis qui derelictus fuerit ex omnibus istis quibus praedixi tibi, ipse saluabitur et uidebit salutare meum et finem saeculi mei. Et uidebunt qui recepti sunt homines, qui mortem non gustauerunt a natiuitate sua, et mutabitur cor inhabitantium et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/025.yaml
  text: And it will be that everyone who is left from all these things that I have foretold to you will be saved and will see my salvation and the end of my age[a].
translation:
  language: hi
  text: और ऐसा होगा कि इन सब बातों से, जिनके विषय में मैंने तुझे पहले से बताया है, जो कोई बचा रह जाएगा[a], वह बचाया जाएगा और मेरा उद्धार तथा मेरे युग का अन्त देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन सब घटनाओं के बाद जो कोई बचा रह जाएगा।”
    reason: Latin ex omnibus istis का अर्थ इन बातों ‘से’ बच निकलना अथवा इनके घटने ‘के बाद’ शेष रहना—दोनों प्रकार से समझा जा सकता है।
lexical_decisions:
- source_word: derelictus fuerit ex omnibus istis
  choice: इन सब बातों से ... बचा रह जाएगा
  rationale: यह चयन विनाशकारी घटनाओं के बीच शेष बचे रहने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, साथ ही Latin ex की कुछ अस्पष्टता बनाए रखता है।
- source_word: saluabitur
  choice: बचाया जाएगा
  rationale: Latin का कर्मवाच्य रूप सुरक्षित रखा गया है और उद्धारकर्ता को पाठ में अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: salutare meum
  choice: मेरा उद्धार
  rationale: salutare यहाँ परमेश्वर द्वारा प्रकट किए जाने वाले उद्धार को दर्शाता है; ‘उद्धार’ धार्मिक और प्रलय-संबंधी संदर्भ में स्वाभाविक है।
- source_word: finem saeculi mei
  choice: मेरे युग का अन्त
  rationale: saeculum के कालगत अर्थ को ‘युग’ से व्यक्त किया गया है; इसे बिना आधार ‘संसार’ बनाकर अर्थ सीमित नहीं किया गया।
theological_decisions:
- issue: saluabitur में उद्धार के कर्ता की पहचान
  choice: कर्मवाच्य ‘बचाया जाएगा’
  alternative: ‘परमेश्वर उसे बचाएगा’
  rationale: मूल Latin कर्ता को स्पष्ट नहीं करता; कर्मवाच्य अनुवाद उसी अंतर्निहित तनाव को बनाए रखता है।
- issue: saeculum का अर्थ
  choice: युग
  alternative: संसार
  rationale: ‘युग’ काल की समाप्ति का सीधा अर्थ देता है और ब्रह्मांड के भौतिक विनाश को अनिवार्य मानकर पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तुझे’ एकवचन संबोधन और मूल की भविष्यवाणी-संबंधी शैली को सुरक्षित रखता है।
