lexical_decisions:
- source_word: pinquare incipio
  choice: मैं…निकट आने लगूँगा
  rationale: पाठ में संभवतः अपूर्ण/भ्रष्ट रूप है, जिसे संदर्भानुसार ‘appropinquare incipio’ समझा गया है; यह आरम्भ और निकट आने—दोनों भावों को बचाता है।
- source_word: uisitem
  choice: हाल जानने के लिए
  rationale: Latin ‘visito’ में भेंट करने, निरीक्षण करने और न्यायपूर्ण हस्तक्षेप के लिए आने की व्यापकता है; सहज हिन्दी में ‘हाल जानना’ इस अस्पष्टता को काफी हद तक बनाए रखता है।
- source_word: habitantes in terra
  choice: पृथ्वी के निवासियों
  rationale: मूल के स्थानवाचक भाव ‘पृथ्वी पर रहनेवाले’ को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Et quando
  choice: और जब…
  rationale: स्रोत अंश अगले वाक्य में अधूरा कटता है; दीर्घविराम इस अपूर्ण निरंतरता को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय ‘visit’ का अर्थ
  choice: हाल जानने के लिए
  alternative: दण्ड देने / न्याय करने के लिए
  rationale: मूल क्रिया अपने आप केवल दण्ड या न्याय निश्चित नहीं करती; किसी विशिष्ट धर्मवैज्ञानिक अर्थ को थोपने के बजाय उसकी व्यापकता रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सुबोध हिन्दी। उपलब्ध Latin अंश मध्य-वाक्य से आरम्भ और ‘Et quando’ पर अधूरा समाप्त होता है; अनूदित पाठ ने दोनों सीमाओं को नहीं छिपाया। अंग्रेज़ी परामर्श-पाठ का आरम्भ (‘And it said, Behold, days are coming…’) दिए गए Latin अंश में उपस्थित नहीं है, इसलिए उसे शामिल नहीं किया गया।
