source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'die, ut inhabitet in ea, ubi sunt montes mille; Leuiathan autem dedisti septimam partem humidam: et seruasti ea ut fiant in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/052.yaml
  text: but Leviathan you gave the moist seventh part, and you have kept it to be food for whom you wish and when you wish.
translation:
  language: hi
  text: परन्तु लिव्यातान को आपने जलमय सातवाँ भाग दिया; और उन दोनों को सुरक्षित रखा है, ताकि वे जिसे आप चाहें और जब चाहें, उसका भोजन बनें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लैटिन में ‘उन्हें’ और ‘वे बनें’ बहुवचन हैं। संदर्भ में इसका संकेत बहेमोथ और लिव्यातान, दोनों की ओर समझा जाता है।
    reason: लैटिन के बहुवचन ea … fiant को स्पष्ट करता है, बिना यह कहे कि ‘दोनों’ शब्द लैटिन में प्रत्यक्षतः मौजूद है।
lexical_decisions:
- source_word: septimam partem humidam
  choice: जलमय सातवाँ भाग
  rationale: यह उस सातवें भूभाग को दर्शाता है जिसमें जल इकट्ठा था; यहाँ humidam का अर्थ केवल ‘नम’ नहीं, बल्कि जल से भरा या जलमय है।
- source_word: seruasti
  choice: सुरक्षित रखा है
  rationale: क्रिया का अर्थ इन जीवों को भावी प्रयोजन के लिए बचाकर रखना है।
- source_word: ea … fiant
  choice: उन दोनों को … वे … बनें
  rationale: लैटिन ea और बहुवचन fiant का स्वाभाविक संदर्भ पहले उल्लिखित बहेमोथ और लिव्यातान, दोनों जीव हैं।
theological_decisions:
- issue: भोजन बनने के लिए सुरक्षित रखे गए जीवों की संख्या
  choice: बहेमोथ और लिव्यातान दोनों—‘उन दोनों … वे’
  alternative: केवल लिव्यातान या जलमय सातवाँ भाग—‘उसे … वह’
  rationale: यद्यपि निकटतम वाक्य में लिव्यातान और जलमय सातवें भाग का उल्लेख है, ea के साथ बहुवचन fiant स्पष्टतः पहले बताए गए दोनों जीवों की ओर लौटता है। इससे पाठ में निहित परमेश्वर के भावी प्रयोजन को बिना किसी अतिरिक्त सिद्धान्त के यथावत रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। प्रार्थनात्मक संबोधन में आदरसूचक ‘आप’ अपनाया गया है। ‘जलमय’ सृष्टि-वर्णन के भौगोलिक संदर्भ में ‘नम’ से अधिक स्पष्ट है।
