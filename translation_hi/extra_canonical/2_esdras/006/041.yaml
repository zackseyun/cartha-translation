source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et in die secundo iterum creasti spiritum firmamenti et imperasti ei, ut divideret et divisionem faceret inter aquas, ut pars quidem sursum recederet, pars vero deorsum maneret.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/041.yaml
  text: And again[a], on the second day, you created the spirit of the firmament, and commanded it to divide and make a division between the waters, so that one part might recede upward and the other part remain below.
translation:
  language: hi
  text: और फिर,[a] दूसरे दिन तूने आकाशमंडल की आत्मा को रचा और उसे आज्ञा दी कि वह जल को बाँटे और जल के बीच विभाजन करे, ताकि एक भाग ऊपर हट जाए और दूसरा भाग नीचे बना रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और दूसरे दिन फिर तूने रचा।”
    reason: लैटिन 'iterum' को पिछले कथन से जोड़कर पढ़ा जा सकता है, या उसे 'रचा' के साथ रखा जा सकता है।
lexical_decisions:
- source_word: spiritum firmamenti
  choice: आकाशमंडल की आत्मा
  rationale: लैटिन में 'spiritum' स्पष्ट रूप से उपस्थित है; इसे केवल 'आकाशमंडल' बनाकर छोड़ने के बजाय 'आत्मा' के रूप में बनाए रखा गया है, ताकि स्रोत का असामान्य और संभावित रूप से सजीवकारी भाव सुरक्षित रहे।
- source_word: divideret et divisionem faceret
  choice: जल को बाँटे और जल के बीच विभाजन करे
  rationale: स्रोत की क्रिया और उसी मूल से बनी संज्ञा—दोनों को बनाए रखते हुए हिन्दी में अर्थ स्पष्ट किया गया है।
- source_word: recederet
  choice: हट जाए
  rationale: ऊपर की ओर अलग होकर पीछे हटने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: maneret
  choice: बना रहे
  rationale: नीचे स्थित भाग के वहीं टिके रहने या बने रहने का भाव स्वाभाविक हिन्दी में सुरक्षित है।
theological_decisions:
- issue: spiritum firmamenti का संदर्भ
  choice: आकाशमंडल की आत्मा
  alternative: आकाशमंडल की वायु / आकाशमंडल
  rationale: स्रोत के 'spiritum' को मिटाए बिना उसकी वास्तविक अस्पष्टता और धर्मवैचारिक तनाव बनाए रखा गया है; इसे न तो निश्चित रूप से पवित्र आत्मा माना गया है, न मात्र हवा।
- issue: iterum का वाक्यगत संबंध
  choice: और फिर, दूसरे दिन
  alternative: और दूसरे दिन तूने फिर रचा
  rationale: '''फिर'' को कथानक की अगली कड़ी के रूप में रखा गया है, ताकि यह अर्थ न निकले कि उसी वस्तु को दूसरी बार रचा गया।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। परमेश्वर को संबोधन में एकवचन 'तू' रखा गया है, जो प्रार्थनात्मक बाइबलीय शैली के अनुकूल है।
