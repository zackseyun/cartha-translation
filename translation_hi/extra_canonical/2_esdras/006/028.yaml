translation:
  language: hi
  text: और वह सत्य प्रकट किया जाएगा, जो इतने लंबे समय से निष्फल रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendebitur
  choice: प्रकट किया जाएगा
  rationale: लातीनी भविष्यत् कर्मवाच्य का अर्थ और बल बनाए रखता है; केवल ‘प्रकट होगा’ कहने से कर्मवाच्य सूक्ष्मता मिट सकती थी।
- source_word: ueritas
  choice: सत्य
  rationale: मूल संज्ञा का सीधा, स्वाभाविक और प्रसंगानुकूल हिन्दी रूप।
- source_word: sine fructu fuit
  choice: निष्फल रहा है
  rationale: ‘फल के बिना रहा’ की रूपक-छवि और लंबे समय तक प्रभावहीन रहने का भाव संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: tantis temporibus
  choice: इतने लंबे समय से
  rationale: लातीनी अभिव्यक्ति की दीर्घ अवधि को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: सत्य के ‘निष्फल’ रहने का आशय
  choice: रूपक को ‘निष्फल’ के रूप में खुला रखा गया
  alternative: ‘जिसका इतने लंबे समय से कोई प्रभाव नहीं हुआ’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि सत्य अनसुना, अप्रभावी या अनुपयोगी रहा; इसलिए किसी एक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट वाक्य। समापन उद्धरण-चिह्न प्रसंगगत प्रत्यक्ष कथन के अंत को बनाए रखता है।
