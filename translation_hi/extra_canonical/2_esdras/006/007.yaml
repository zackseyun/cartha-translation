  text: Then I answered and said[a], “What will be the dividing of the times? Or when will be the end of the former and the beginning of the one that follows?”
translation:
  language: hi
  text: तब मैंने उत्तर देकर कहा, “समयों का विभाजन क्या होगा? अथवा पहले वाले का अंत और उसके बाद वाले का आरंभ कब होगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prioris
  choice: पहले वाले का
  rationale: यह संबंधवाचक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और पहले युग अथवा समय को दर्शाता है; यह चयन उसके समानांतर sequentis को भी बनाए रखता है।
- source_word: sequentis
  choice: उसके बाद आने वाले का
  rationale: यह संज्ञावत् प्रयुक्त कृदन्त है, जिसका संकेत अगले युग अथवा समय की ओर है; अनावश्यक रूप से 'अगला समय' जोड़ने के बजाय मूल की अंतर्निहित संज्ञा को खुला रखा गया है।
- source_word: dividing of the times (source context; extant clause reflected in witnesses)
  choice: समयों का विभाजन
  rationale: प्रश्न की प्रलय-विषयक भाषा और कालखंडों के बीच सीमा के भाव को औपचारिक किन्तु सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: पहले और बाद में आने वाले से अभिप्रेत वस्तु
  choice: ‘पहले वाले’ और ‘उसके बाद आने वाले’ कहकर अन्तर्निहित संदर्भ खुला रखा गया
  alternative: ‘पहले युग’ और ‘अगले युग’
  rationale: संदर्भ में युगों का संकेत संभव है, पर उपलब्ध लैटिन शब्द ‘युग’ को स्पष्ट रूप से नहीं दोहराते; इसलिए अनुवाद ने स्रोत की संक्षिप्तता और अस्पष्टता सुरक्षित रखी है।
