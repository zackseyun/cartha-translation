source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: deuorationem quibus uis et quando uis. Sexto autem die imperasti terrae ut crearet coram te iumenta et bestias et reptilia
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/053.yaml
  text: And on the sixth day you commanded the earth to create before you livestock and beasts and creeping things;
translation:
  language: hi
  text: और छठे दिन तूने पृथ्वी को आज्ञा दी कि वह तेरे सामने पालतू पशु, जंगली जानवर और रेंगनेवाले जीव उत्पन्न करे;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sexto autem die
  choice: और छठे दिन
  rationale: ‘autem’ यहाँ क्रम को आगे बढ़ाता है; आधुनिक हिन्दी में ‘और’ स्वाभाविक है।
- source_word: imperasti terrae
  choice: तूने पृथ्वी को आज्ञा दी
  rationale: लैटिन की आज्ञा-संरचना और एकवचन संबोधन को स्पष्ट तथा प्रत्यक्ष रखा गया है।
- source_word: crearet
  choice: उत्पन्न करे
  rationale: ‘सृजे’ की अपेक्षा यह साधारण पाठकों के लिए अधिक सहज है और पृथ्वी द्वारा जीवों को सामने लाने का भाव बनाए रखता है।
- source_word: coram te
  choice: तेरे सामने
  rationale: स्थान/उपस्थिति के मूल भाव का सीधा अनुवाद।
- source_word: iumenta
  choice: पालतू पशु
  rationale: यहाँ मनुष्य के उपयोग या सेवा में रहनेवाले घरेलू पशुओं की श्रेणी अभिप्रेत है; केवल ‘मवेशी’ कहने से अर्थ अनावश्यक रूप से संकरा हो सकता है।
- source_word: bestias
  choice: जंगली जानवर
  rationale: iumenta से भेद स्पष्ट करने के लिए ‘जंगली’ जोड़ा गया है; इस सृष्टि-सूची में bestiae की श्रेणी का स्वाभाविक हिन्दी रूप।
- source_word: reptilia
  choice: रेंगनेवाले जीव
  rationale: रेंगनेवाले प्राणियों की व्यापक श्रेणी को आधुनिक और सुबोध हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पृथ्वी को जीव उत्पन्न करने की आज्ञा
  choice: पृथ्वी को आज्ञा दी कि वह…उत्पन्न करे
  alternative: तूने…पालतू पशु आदि बनाए
  rationale: मूल पाठ पृथ्वी को आज्ञा दिए जाने और उसी के कर्ता होने की व्याकरणिक संरचना रखता है; इसे प्रत्यक्ष दैवी निर्माण में बदलना उचित नहीं।
- issue: ईश्वर के लिए संबोधन
  choice: तूने / तेरे
  alternative: आपने / आपके
  rationale: मूल में एकवचन निकट संबोधन है; बाइबलीय प्रार्थना की हिन्दी परंपरा में ‘तू’ आदरहीन नहीं, बल्कि प्रत्यक्ष और घनिष्ठ संबोधन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद के आरंभ का ‘और’ पूर्ववर्ती सृष्टि-वर्णन से इसका संबंध बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं है।
