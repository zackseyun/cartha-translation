  rationale: प्राप्त पाठ व्याकरण की दृष्टि से विकृत प्रतीत होता है; स्वीकृत पाठ-सुधार ‘hac ventura nocte’ के आधार पर आने वाली निकटतम रात का स्वाभाविक हिन्दी रूप चुना गया है।
