source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nomen secundi uocasti Leuiathan, Et separasti ea ab alterutro, non enim poterat septima pars ubi erat aqua congregata capere
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/050.yaml
  text: the name of the second you called Leviathan. And you separated them from each other[a], for the seventh part where the water had been gathered could not hold them.
translation:
  language: hi
  text: दूसरे का नाम आपने लिव्यातान रखा। और आपने उन दोनों को एक-दूसरे से अलग कर दिया,[a] क्योंकि सातवाँ भाग, जहाँ जल इकट्ठा किया गया था, उन्हें समा नहीं सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और आपने उन दोनों को एक-दूसरे से अलग कर दिया, क्योंकि सातवाँ भाग, जहाँ जल इकट्ठा किया गया था, उन दोनों को समा नहीं सकता था।”
    reason: अंतिम ‘उन्हें’ का आशय दोनों पूर्वोक्त जीवों से समझा जा सकता है, यद्यपि लैटिन में वहाँ ‘दोनों’ स्पष्ट नहीं है।
lexical_decisions:
- source_word: nomen secundi uocasti Leuiathan
  choice: दूसरे का नाम आपने लिव्यातान रखा
  rationale: लैटिन वाक्यांश का सीधा और स्वाभाविक अनुवाद; ‘दूसरे’ का संदर्भ पिछले पद में उल्लिखित दूसरे जीव से है।
- source_word: separasti ea ab alterutro
  choice: आपने उन दोनों को एक-दूसरे से अलग कर दिया
  rationale: ea और alterutro दो पूर्वोक्त जीवों की ओर संकेत करते हैं; हिन्दी में ‘उन दोनों’ इस पारस्परिक अलगाव को स्पष्ट और स्वाभाविक बनाता है।
- source_word: septima pars ubi erat aqua congregata
  choice: सातवाँ भाग, जहाँ जल इकट्ठा किया गया था
  rationale: सृष्टि-वर्णन की स्थानगत भाषा और लैटिन की निष्क्रिय रचना को यथासंभव सुरक्षित रखता है।
- source_word: capere
  choice: समा नहीं सकता था
  rationale: यहाँ अर्थ है किसी स्थान का जीवों को अपने भीतर धारण करने योग्य होना; ‘समा नहीं सकता था’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: क्या अंतिम उपवाक्य में ‘दोनों’ जोड़ा जाए
  choice: मुख्य पाठ में ‘उन्हें’
  alternative: ‘उन दोनों को’
  rationale: लैटिन में अंतिम स्थान पर केवल निहित बहुवचन कर्म है; ‘दोनों’ अर्थ से संभव है, पर स्पष्ट रूप से लिखा नहीं है। इसीलिए मुख्य पाठ स्रोत की संक्षिप्तता रखता है और वैकल्पिक स्पष्टता पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण द्वितीय पुरुष ‘आपने’ रखा गया है। शैली dignified किंतु सामान्य पाठक के लिए सहज है; ‘लिव्यातान’ नाम का प्रचलित बाइबिलीय लिप्यंतरण अपनाया गया है।
