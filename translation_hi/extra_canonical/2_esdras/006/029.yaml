  text: 'Et factum est cum loqueretur mihi, et ecce paulatim mouebatur locus super quem stabam super eum. Et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/029.yaml
  text: 'And it happened[a], while he was speaking to me, behold, the place on which I was standing was gradually moving. And he said to me:'
translation:
  language: hi
  text: 'जब वह मुझसे बात कर रहा था, तब ऐसा हुआ कि देखो, जिस स्थान पर मैं खड़ा था, वह धीरे-धीरे हिल रहा था[a]। तब उसने मुझसे कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह धीरे-धीरे हिलाया जा रहा था।”
    reason: लातीनी ‘mouebatur’ को तटस्थ/अकर्मक ‘हिल रहा था’ या कर्मवाच्य ‘हिलाया जा रहा था’ समझा जा सकता है।
lexical_decisions:
- source_word: paulatim mouebatur
  choice: धीरे-धीरे हिलने लगा
  rationale: ‘paulatim’ क्रमिक गति को और ‘mouebatur’ गति या हिलाए जाने को व्यक्त करता है। यह अनुवाद संदर्भ में सहज रहते हुए मूल की अपेक्षाकृत तटस्थ गति को बनाए रखता है।
- source_word: locus super quem stabam super eum
  choice: जिस स्थान पर मैं खड़ा था
  rationale: लातीनी वाक्यांश में ‘super eum’ पुनरुक्तिपूर्ण है; हिन्दी में उसका अलग अनुवाद अस्वाभाविक होगा, इसलिए स्थान-संबंध को एक स्वाभाविक उपवाक्य में व्यक्त किया गया है।
- source_word: Et dixit ad me
  choice: तब उसने मुझसे कहा
  rationale: इस स्रोत-खंड के अंतिम कथन को शामिल किया गया है; ‘तब’ कथानक के अगले चरण को स्वाभाविक हिन्दी में जोड़ता है।
