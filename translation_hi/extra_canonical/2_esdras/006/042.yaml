source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tertio die imperasti aquis congregari in septima parte terrae, sex vero partes siccasti et conservasti, ut ex his sint coram te ministrantia seminata adeo et culta.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/042.yaml
  text: And on the third day you commanded the waters to be gathered into the seventh part of the earth, but six parts you dried up and preserved, so that from these there might be before you things sown and cultivated, serving you.
translation:
  language: hi
  text: और तीसरे दिन आपने आज्ञा दी कि जल पृथ्वी के सातवें भाग में इकट्ठा हो जाए। पर छह भागों को आपने सुखाकर सुरक्षित रखा, ताकि उनसे बोई और खेती की गई वस्तुएँ आपके सम्मुख आपकी सेवा करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in septima parte terrae
  choice: पृथ्वी के सातवें भाग में
  rationale: लातीनी वाक्यांश पृथ्वी के उस एक भाग को बताता है जिसमें जल इकट्ठा किया गया; सहज आधुनिक हिन्दी में इसे ‘सातवें भाग में’ कहा गया है।
- source_word: sex vero partes siccasti et conservasti
  choice: पर छह भागों को आपने सुखाकर सुरक्षित रखा
  rationale: ‘vero’ के विरोधार्थक बल को ‘पर’ से, तथा दोनों क्रियाओं को क्रमशः ‘सुखाकर सुरक्षित रखा’ से व्यक्त किया गया है।
- source_word: seminata adeo et culta
  choice: बोई और उगाई गई चीज़ें
  rationale: पाठ का आशय बोई हुई और खेती द्वारा विकसित वस्तुओं से है। ‘चीज़ें’ मूल में निहित अनिर्दिष्ट बहुवचन को बनाए रखता है, जबकि ‘उगाई गई’ सामान्य हिन्दी में culta का स्वाभाविक कृषि-संदर्भित रूप है।
- source_word: coram te ministrantia
  choice: आपके सामने आपकी सेवा करती रहें
  rationale: ‘coram te’ और ‘ministrantia’ दोनों को स्पष्ट रखा गया है; इससे सृष्टि की उपज के परमेश्वर के सम्मुख सेवा करने का व्यक्तिकरण सुरक्षित रहता है।
theological_decisions:
- issue: बोई और उगाई गई वस्तुओं द्वारा परमेश्वर की सेवा
  choice: 'व्यक्तिकरण को यथावत रखा गया: ‘आपके सामने आपकी सेवा करती रहें’'
  alternative: ‘आपके उपयोग के लिए उपज देती रहें’
  rationale: वैकल्पिक रूप अर्थ को व्यावहारिक उपयोग तक सीमित कर देता। मूल का ministrantia सेवा का अधिक सजीव और धर्मवैचारिक रूपक रखता है, इसलिए उसे अनिर्णीत रूप में संरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली। प्रार्थनात्मक संबोधन के लिए आदरसूचक ‘आप’ रखा गया है। पद में कोई पादटिप्पणी आवश्यक नहीं है।
