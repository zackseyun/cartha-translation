  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/045.yaml
  text: On the fourth day you commanded the brightness of the sun[a], the light of the moon, and the arrangement of the stars to be made,
translation:
  language: hi
  text: चौथे दिन आपने आज्ञा दी कि सूर्य की चमक, चाँद की रोशनी और तारों की व्यवस्था बनाई जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quarta autem die
  choice: चौथे दिन
  rationale: ‘autem’ यहाँ कथानक को आगे बढ़ाने वाला हल्का संयोजक है; स्वाभाविक हिन्दी में अलग से ‘परन्तु’ कहना अनावश्यक और भ्रामक होगा।
- source_word: imperasti
  choice: आपने आज्ञा दी
  rationale: द्वितीय पुरुष एकवचन संबोधन को आदरपूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: solis splendorem
  choice: सूर्य की चमक
  rationale: ‘splendor’ के प्रकाशमान तेज/चमक के सामान्य अर्थ को सहज और गरिमापूर्ण हिन्दी में रखता है।
- source_word: lunae lumen
  choice: चाँद की रोशनी
  rationale: ‘lumen’ का सीधा, सर्वसुलभ अर्थ; ‘सूर्य की चमक’ से स्रोत में मौजूद शब्दगत भेद भी बना रहता है।
- source_word: stellarum dispositionem
  choice: तारों की व्यवस्था
  rationale: ‘dispositio’ तारों के क्रमबद्ध विन्यास या व्यवस्था को सूचित करता है; यह स्रोत की संभावित व्यापकता बनाए रखता है।
- source_word: fieri
  choice: बनाई जाए
  rationale: लैटिन infinitive पूरे त्रिपदीय कर्म-समूह पर लागू है; हिन्दी में अंत में रखा गया संयुक्त निष्क्रिय प्रयोग तीनों वस्तुओं को समान रूप से नियंत्रित करता है।
theological_decisions:
- issue: सृष्टि-क्रिया का तीनों पदों से संबंध
  choice: ‘बनाई जाए’ को सूची के अंत में रखकर सूर्य की चमक, चाँद की रोशनी और तारों की व्यवस्था—तीनों पर लागू किया गया।
  alternative: क्रिया को केवल ‘सूर्य की चमक’ के तुरंत बाद रखना।
  rationale: लैटिन ‘fieri’ पूरे accusative-सूची समूह को नियंत्रित करता है; वर्तमान रचना इस संबंध को स्पष्ट करती है और किसी एक तत्व को अलग नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण द्वितीय पुरुष और सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘चाँद’ सामान्य पाठक के लिए ‘चन्द्रमा’ से अधिक स्वाभाविक है, जबकि वाक्य का औपचारिक संतुलन बना रहता है।
