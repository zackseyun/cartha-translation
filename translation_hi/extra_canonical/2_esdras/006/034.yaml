  text: et noli festinare in prioribus temporibus cogitare vana, ut non properes a novissimis temporibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/034.yaml
  text: and do not hasten to think vain thoughts about the former times[a][b], so that you may not be hasty concerning the last times.’”
translation:
  language: hi
  text: और पहले के समयों के विषय में व्यर्थ विचार करने में जल्दी मत कर[a][b], ताकि तू अन्तिम समयों के विषय में जल्दी न करे।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि तू अन्तिम समयों से दूर जाने में जल्दी न करे।’”
    reason: previous_rendering
  - marker: b
    text: यह चेतावनी पाठ की दृष्टि से कठिन है। सम्भावित अर्थ पहले के समयों के बारे में अधीर, व्यर्थ विचार करने से मना करना है, ताकि अन्तिम समयों के विषय में उतावली न हो।
    reason: textual_variant
lexical_decisions:
- source_word: festinare ... cogitare
  choice: सोचने की उतावली मत कर
  rationale: लैटिन निषेध की शीघ्रता/अधीरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: vana
  choice: व्यर्थ बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण का संज्ञार्थक प्रयोग है; यह निरर्थक या खोखले विचारों को सूचित करता है।
- source_word: prioribus temporibus
  choice: पहले के समयों के विषय में
  rationale: समय-संबंधी बहुवचन को स्पष्ट और सामान्य हिन्दी में बनाए रखता है।
- source_word: novissimis temporibus
  choice: अन्तिम समयों
  rationale: अन्तकाल-संबंधी बहुवचन और पहले/अन्तिम समयों की समानांतरता सुरक्षित रखता है।
- source_word: properes
  choice: उतावला न हो
  rationale: एज्रा की अधीरता के संदर्भ में शीघ्रता के बजाय उतावलेपन का भाव अधिक स्वाभाविक है।
theological_decisions:
- issue: a novissimis temporibus में ‘a’ का अर्थ
  choice: अन्तिम समयों के विषय में
  alternative: अन्तिम समयों से दूर
  rationale: यहाँ ‘a’ को ‘के संबंध में’ मानना prioribus temporibus के समानांतर बैठता है और अन्त के लिए एज्रा की अधीरता के प्रसंग को सुरक्षित रखता है; फिर भी पाठगत कठिनाई को पादटिप्पणी में रखा गया है।
- issue: ut खंड का संबंध
  choice: ताकि
  alternative: जिससे
  rationale: उद्देश्य/परिणाम की लैटिन अस्पष्टता में ‘ताकि’ चेतावनी का आशय सहज रूप से व्यक्त करता है, बिना किसी विशिष्ट सिद्धान्त को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तू’ रखा गया है, क्योंकि यह प्रत्यक्ष, व्यक्तिगत संबोधन है; भाषा को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
