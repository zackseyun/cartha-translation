id: 2ES.6.56
reference: 2 Esdras 6:56
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: residuas autem gentes ab Adam natas dixisti eas nihil esse, et quoniam salivae adsimilatae sunt, et sicut stillicidium de vaso similasti abundantiam eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/056.yaml
  text: But the rest of the nations, which have come from Adam, you said are nothing, and that they are like spittle; and you compared their abundance to a drop from a vessel.
translation:
  language: hi
  text: परन्तु आदम से उत्पन्न हुई शेष जातियों के विषय में तूने कहा कि वे कुछ भी नहीं हैं, कि वे थूक के समान हैं; और उनकी बहुतायत की तुलना तूने किसी पात्र से टपकती हुई बूँद से की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: residuas autem gentes
  choice: परन्तु ... शेष जातियों
  rationale: ‘autem’ का विरोधसूचक भाव ‘परन्तु’ से और ‘residuas gentes’ का अर्थ सहज, औपचारिक हिन्दी में ‘शेष जातियों’ से व्यक्त किया गया है।
- source_word: ab Adam natas
  choice: आदम से उत्पन्न हुई
  rationale: लैटिन ‘natas’ जन्म या उत्पत्ति का बोध कराता है; ‘उत्पन्न हुई’ सभी जातियों के आदम से आने का अर्थ स्पष्ट रखता है।
- source_word: nihil esse
  choice: कुछ भी नहीं हैं
  rationale: मूल का कठोर मूल्यांकन बिना नरम किए प्रत्यक्ष रूप में सुरक्षित रखा गया है।
- source_word: salivae adsimilatae sunt
  choice: थूक के समान हैं
  rationale: ‘saliva’ के लिए सामान्य और प्रभावशाली आधुनिक हिन्दी ‘थूक’ मूल उपमा की तीक्ष्णता बनाए रखती है।
- source_word: stillicidium de vaso
  choice: किसी पात्र से टपकती हुई बूँद
  rationale: ‘stillicidium’ टपकने वाली बूँद को दर्शाता है; यह रूप स्रोत की गतिशील छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: abundantiam eorum
  choice: उनकी बहुतायत
  rationale: ‘abundantia’ की मात्रात्मक व्यापकता को ‘बहुतायत’ औपचारिक और संक्षिप्त रूप में व्यक्त करता है।
theological_decisions:
- issue: शेष जातियों के ‘कुछ भी नहीं’ होने का कथन
  choice: कथन को वक्ता द्वारा परमेश्वर से कही गई पूर्व घोषणा के रूप में ज्यों का त्यों रखा गया
  alternative: इसे जातियों के कम महत्त्वपूर्ण या तुच्छ होने के रूप में नरम करना
  rationale: मूल पाठ का ‘nihil esse’ जानबूझकर तीखा है। अनुवाद इसे न तो सार्वभौमिक धर्मसिद्धान्त बनाता है, न इसकी तीव्रता घटाता है; ‘तूने कहा’ इसकी प्रार्थनात्मक/संवादी संरचना बनाए रखता है।
- issue: ‘बहुतायत’ और एक बूँद के बीच तनाव
  choice: विरोधाभासी तुलना को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया
  alternative: ‘उनकी विशाल संख्या भी केवल एक बूँद है’ कहकर निहित अर्थ स्पष्ट करना
  rationale: स्रोत की संक्षिप्त और तनावपूर्ण उपमा को पाठ में ही खुला रखना अधिक निष्ठावान है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और शास्त्रीय प्रसंग के अनुकूल रूप अपनाया गया है। परमेश्वर को संबोधन होने के कारण एकवचन ‘तूने’ रखा गया है; भाषा को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
