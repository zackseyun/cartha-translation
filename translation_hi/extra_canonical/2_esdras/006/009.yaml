source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: finis enim huius saeculi Esau, et principium sequentis Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/009.yaml
  text: For Esau is the end of this age[a], and Jacob is the beginning of the one that follows.
translation:
  language: hi
  text: क्योंकि इस युग का अंत एसाव है, और इसके बाद आने वाले युग का आरंभ याकूब है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculi
  choice: युग
  rationale: यहाँ saeculum वर्तमान विश्व-काल या युग को दर्शाता है; आधुनिक बाइबलीय हिन्दी में ‘युग’ संक्षिप्त और स्वाभाविक है।
- source_word: finis
  choice: अंत
  rationale: यह पद 6:7 के ‘अंत’ और ‘आरंभ’ वाले प्रश्न का सीधा उत्तर देता है; इसलिए समानांतर संरचना बनाए रखी गई है।
- source_word: sequentis
  choice: इसके बाद आने वाले युग का
  rationale: लैटिन में संज्ञा saeculi दूसरी उपवाक्य में लुप्त है, पर आशय पूर्वोक्त युग के बाद आने वाले युग से है। हिन्दी में अर्थ स्पष्ट और स्वाभाविक रखने के लिए संज्ञा दोहराई गई है।
- source_word: principium
  choice: आरंभ
  rationale: finis के साथ मूल का स्पष्ट विरोध और पद 6:7 से उसका संबंध बनाए रखता है।
theological_decisions:
- issue: एसाव और याकूब का युगों के अंत और आरंभ से समीकरण
  choice: ‘इस युग का अंत एसाव है ... अगले युग का आरंभ याकूब है’ के रूप में सीधा रूपकात्मक समीकरण बनाए रखा गया।
  alternative: ‘एसाव अंत का प्रतीक है’ या ‘याकूब नए युग का प्रतिनिधि है’ जैसी व्याख्यात्मक भाषा।
  rationale: मूल पाठ केवल समीकरण प्रस्तुत करता है और उसके प्रतीकात्मक आशय की व्याख्या नहीं करता; अनुवाद में उस धर्मवैचारिक तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाक्य। ‘अंत ... आरंभ’ की समानांतरता और मूल का विषय-क्रम सुरक्षित रखा गया है।
