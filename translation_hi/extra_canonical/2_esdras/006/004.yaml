id: 2ES.6.4
reference: 2 Esdras 6:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: colligerentur innumerabiles militiae angelorum, Et antequam extollerentur altitudines aerum, et antequam nominarentur mensurae firmamentorum, et antequam aestimaretur scabellum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/004.yaml
  text: and before the heights of the air were lifted up[a], and before the measures of the firmaments were named, and before the footstool was measured,
translation:
  language: hi
  text: और इससे पहले कि वायु की ऊँचाइयाँ उठाई जातीं, और इससे पहले कि आकाशमंडलों के मापों के नाम रखे जाते, और इससे पहले कि पाँव रखने की चौकी को मापा जाता,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altitudines aerum
  choice: वायु की ऊँचाइयाँ
  rationale: बहुवचन altitudines और aerum को यथासंभव बनाए रखते हुए सृष्टि-वर्णन की गरिमा और अस्पष्टता सुरक्षित रखी गई है।
- source_word: extollerentur
  choice: उठाई जातीं
  rationale: इस कर्मवाच्य क्रिया का सीधा और स्वाभाविक हिन्दी रूप; इसे ‘तौली जातीं’ कहना लैटिन से समर्थित नहीं है।
- source_word: mensurae firmamentorum
  choice: आकाशमंडलों के माप
  rationale: दोनों संज्ञाओं के बहुवचन को बनाए रखा गया है; firmamentum के लिए आधुनिक पाठक-बोध और पारंपरिक सृष्टि-संदर्भ के अनुकूल ‘आकाशमंडल’ चुना गया।
- source_word: nominarentur
  choice: नाम रखे जाते
  rationale: शाब्दिक ‘नामित किए जाते’ की अपेक्षा आधुनिक और स्वाभाविक हिन्दी, जबकि नाम दिए जाने का मूल अर्थ बना रहता है।
- source_word: scabellum
  choice: पाँव रखने की चौकी
  rationale: लैटिन का सामान्य अर्थ ‘footstool’ है; स्रोत में अनुपस्थित ‘सिय्योन’ नहीं जोड़ा गया।
- source_word: aestimaretur
  choice: माप आँका जाता
  rationale: aestimare में आँकने/मूल्य निर्धारित करने का भाव है। प्रसंग में मापन की धारणा को रखते हुए ‘माप आँकना’ केवल ‘मापा जाना’ से अधिक सटीक और ‘तौला जाना’ से कम भ्रामक है।
theological_decisions:
- issue: scabellum की पहचान
  choice: पाँव रखने की चौकी
  alternative: सिय्योन की पाँव रखने की चौकी
  rationale: लैटिन पाठ scabellum कहता है और उसका संदर्भ स्पष्ट नहीं करता; इसलिए किसी विशिष्ट पवित्र स्थान की पहचान जोड़कर अस्पष्टता को समाप्त नहीं किया गया।
- issue: aestimaretur में मापन या स्थापना
  choice: माप आँका जाता
  alternative: स्थापित किया जाता
  rationale: ‘स्थापित’ संभव पुनर्निर्मित मूल-पाठ पर निर्भर होगा, पर उपलब्ध लैटिन में उसका स्पष्ट आधार नहीं है; extant source की अर्थ-सीमा सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, लयात्मक और सामान्य पाठक के लिए समझने योग्य शैली। पद दिए गए अंश के बीच से आरम्भ होता है, इसलिए आरम्भिक ‘और’ तथा अंत का अल्पविराम बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि वैकल्पिक ‘तौला जाता’ aestimaretur का बेहतर अर्थ नहीं है।
