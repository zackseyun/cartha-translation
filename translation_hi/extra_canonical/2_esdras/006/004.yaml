  naturalness: The draft is generally dignified and natural. However, ‘पाँव रखने की चौकी का माप आँका जाता’ is cumbersome and semantically repetitive in modern Hindi. ‘पाँव रखने की चौकी को मापा जाता’ is idiomatic and preserves the intended sense.
  terminology: ‘आकाशमंडल’ is suitable in this elevated cosmological register. ‘पाँव रखने की चौकी’ is an understandable modern equivalent of ‘footstool.’ No doctrinal specification is added.
