  text: conuertetur in sensum alium. Delebitur enim malum et extinguetur dolus. Florebit autem fides, et uincetur corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/026.yaml
  text: It will be turned into another understanding[a]. For evil will be blotted out, and deceit will be extinguished. But faith will flourish, and corruption will be overcome[b],
translation:
  language: hi
  text: वह एक दूसरी समझ में परिवर्तित हो जाएगा। क्योंकि बुराई मिटा दी जाएगी और छल समाप्त कर दिया जाएगा। पर विश्वास फले-फूलेगा और भ्रष्टता पर विजय पाई जाएगी,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sensum alium
  choice: दूसरी समझ
  rationale: यह ‘एक अन्य समझ/मनःस्थिति’ का सीधा और सहज अनुवाद है; लैटिन में निहित मानसिक अर्थ को किसी विशेष धार्मिक व्याख्या तक सीमित नहीं करता।
- source_word: delebitur
  choice: मिटा दी जाएगी
  rationale: क्रिया के भविष्यकालीन कर्मवाच्य और पूरी तरह मिटाए जाने के भाव को सुरक्षित रखता है।
- source_word: dolus
  choice: छल
  rationale: धोखे और कपट दोनों के व्यापक अर्थ को संक्षिप्त, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: extinguetur
  choice: अंत कर दिया जाएगा
  rationale: शाब्दिक ‘बुझा दिया जाएगा’ हिन्दी में छल के साथ अस्वाभाविक लगता; यह विनाश/समाप्ति के आशय को स्वाभाविक ढंग से देता है।
- source_word: fides
  choice: विश्वास
  rationale: ‘विश्वास’ सामान्य और धार्मिक दोनों संदर्भों में fides के अर्थ को वहन करता है; यहाँ ‘निष्ठा’ भी संभव है।
- source_word: florebit
  choice: फले-फूलेगा
  rationale: फलने-फूलने की रूपकात्मक छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: corruptela
  choice: भ्रष्टता
  rationale: नैतिक पतन या बिगाड़ के व्यापक भाव को सुरक्षित रखता है, बिना इसे केवल शारीरिक क्षय तक सीमित किए।
- source_word: uincetur
  choice: पर विजय पाई जाएगी
  rationale: लैटिन कर्मवाच्य ‘परास्त की जाएगी’ का स्वाभाविक हिन्दी रूप है और विजय की छवि बनाए रखता है।
theological_decisions:
- issue: conuertetur का अनिर्दिष्ट कर्ता
  choice: वह बदलकर दूसरी समझ का हो जाएगा
  alternative: उसकी मनःस्थिति बदल जाएगी
  rationale: दिए गए लैटिन अंश में कर्ता स्पष्ट नहीं है। ‘वह’ इस अनिश्चितता को बनाए रखता है; किसी व्यक्ति, हृदय या समुदाय को अनुवाद में स्पष्ट रूप से जोड़ना स्रोत से आगे जाना होता।
- issue: fides का अर्थ-क्षेत्र
  choice: विश्वास
  alternative: निष्ठा
  rationale: संदर्भ विश्वास और सत्यनिष्ठा दोनों की ओर खुला रह सकता है। मुख्य पाठ में अधिक व्यापक और परिचित ‘विश्वास’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। कर्मवाच्य संरचनाएँ लैटिन के भाव को बनाए रखती हैं। अंतिम अल्पविराम स्रोत में वाक्य के आगे जारी रहने का संकेत सुरक्षित रखता है।
