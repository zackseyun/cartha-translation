  to: क्योंकि परमप्रधान के सामने तुम्हारी आवाज़ सचमुच सुनी गई है; सर्वशक्तिमान ने तुम्हारा आचरण देखा है और उस शुचिता पर ध्यान दिया है जो तुम्हारे पास युवावस्था से रही है।
