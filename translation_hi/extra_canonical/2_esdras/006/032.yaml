id: 2ES.6.32
reference: 2 Esdras 6:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam auditu audita est vox tua apud Altissimum. vidit enim Fortis directionem tuam et providit pudicitiam quam a iuventute tua habuisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/032.yaml
  text: For your voice has indeed been heard before the Most High; for the Mighty One has seen your conduct and has taken note of the purity that you have had from your youth.
translation:
  language: hi
  text: क्योंकि परमप्रधान के सामने तुम्हारी आवाज़ सचमुच सुनी गई है; सर्वशक्तिमान ने तुम्हारा आचरण देखा है और उस शुचिता पर ध्यान दिया है जो तुम्हारे पास युवावस्था से रही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auditu audita est vox tua
  choice: तुम्हारी आवाज़ सचमुच सुनी गई है
  rationale: लातीनी धातु की पुनरुक्ति सुन लिए जाने पर बल देती है; स्वाभाविक हिन्दी में इसे “सचमुच” से व्यक्त किया गया है।
- source_word: apud Altissimum
  choice: परमप्रधान के सामने
  rationale: apud यहाँ परमप्रधान की उपस्थिति या उनके समक्ष सुने जाने का भाव रखता है।
- source_word: Fortis
  choice: सर्वशक्तिमान
  rationale: ईश्वर के लिए प्रयुक्त उपाधि Fortis उनके सामर्थ्य को दर्शाती है; “सर्वशक्तिमान” आधुनिक धार्मिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: directionem tuam
  choice: तुम्हारा आचरण
  rationale: इस प्रसंग में directionem व्यक्ति के जीवन-व्यवहार या चाल-चलन की ओर संकेत करता है; इसे किसी विशिष्ट नैतिक निर्णय तक सीमित नहीं किया गया।
- source_word: providit pudicitiam
  choice: पवित्रता पर ध्यान दिया है
  rationale: providit में देखने और संज्ञान लेने का भाव है, जबकि pudicitiam नैतिक/यौन शुचिता को व्यक्त करता है; सामान्य पाठक के लिए “पवित्रता” स्वाभाविक है।
- source_word: quam a iuventute tua habuisti
  choice: जो तुमने अपनी युवावस्था से बनाए रखी है
  rationale: शाब्दिक “जो तुम्हारे पास थी” की अपेक्षा यह हिन्दी में उस निरंतर गुण को अधिक स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: Fortis को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: सर्वशक्तिमान
  alternative: सामर्थी
  rationale: पद में यह परमप्रधान के समानांतर ईश्वर की उपाधि है। “सर्वशक्तिमान” अर्थ स्पष्ट करता है, बिना किसी संप्रदायगत विशिष्टता के।
- issue: pudicitiam का अर्थ-क्षेत्र
  choice: पवित्रता
  alternative: शील / शुचिता
  rationale: मूल में संयम और नैतिक शुचिता का भाव संभव है। “पवित्रता” व्यापकता बनाए रखती है और अनावश्यक रूप से केवल यौन अर्थ तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की दो कारणसूचक धाराएँ और मूल का ईश्वरीय उपाधियों वाला औपचारिक स्वर सुरक्षित रखा गया है।
