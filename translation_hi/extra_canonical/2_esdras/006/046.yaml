  text: and you commanded them to serve the man who was to be formed.
translation:
  language: hi
  text: और आपने उन्हें आज्ञा दी कि वे उस मनुष्य की सेवा करें, जिसे रचा जाना था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deservirent
  choice: सेवा करें
  rationale: लातीनी क्रिया यहाँ अधीन होकर सेवा करने का भाव रखती है; सहज हिन्दी में ‘सेवा करें’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: futuro plasmato homini
  choice: उस मनुष्य की, जिसे रचा जाना था
  rationale: यह भावी कर्मवाच्य अर्थ को बनाए रखता है और plasmato के ‘गढ़े/रचे जाने’ के सृष्टि-संबंधी भाव के लिए dignified तथा सामान्य हिन्दी ‘रचा’ चुनता है।
theological_decisions:
- issue: मनुष्य की भावी रचना और प्राणियों की उसके प्रति सेवा
  choice: ‘जिसे रचा जाना था’ के साथ कालगत और कर्मवाच्य अर्थ सुरक्षित रखा गया
  alternative: ‘भावी रचे हुए मनुष्य’ या ‘बनाए जानेवाले मनुष्य’
  rationale: मूल पाठ मनुष्य की रचना को उस समय भविष्य में रखता है; अनुवाद इस क्रम को बनाए रखता है और सेवा के स्वरूप में कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक संबोधन के अनुरूप ‘आपने’; भाषा सरल, गरिमापूर्ण और मूल लातीनी वाक्य के निकट रखी गई है।
