base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/004.yaml
  text: He says, ‘You are thinking rightly and truly; for it was necessary for you, as a servant of God, to walk in truth, and not to let an evil conscience dwell with the spirit of truth, nor to bring grief upon the holy and true Spirit.’ ‘Never,’ I say, ‘sir, have I heard such words clearly.’
translation:
  language: hi
  text: वह कहता है, “तुम ठीक और सच्चा विचार रखते हो; क्योंकि परमेश्वर के सेवक के रूप में तुम्हें सत्य में चलना चाहिए था, और सत्य की आत्मा[a] के साथ दुष्ट अंतःकरण में नहीं रहना चाहिए था, न उस गरिमामय और सच्ची आत्मा को दुःख पहुँचाना चाहिए था।” मैंने कहा, “स्वामी, मैंने ऐसी बातें पहले कभी इतनी स्पष्टता से नहीं सुनीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी शब्द का अर्थ “आत्मा” है। प्रसंग इसे परमेश्वर द्वारा मनुष्य के शरीर में बसाई गई आत्मा से जोड़ता है, पर यह स्पष्ट नहीं करता कि अभिप्राय सीधे पवित्र आत्मा से है या परमेश्वर से मिली मनुष्य की आत्मा।
    reason: मूल पाठ की धार्मिक और व्याकरणिक अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: καλῶς καὶ ἀληθῶς φρονεῖς
  choice: तुम ठीक और सच्चाई से सोचते हो
  rationale: दोनों क्रियाविशेषणों—‘ठीक’ और ‘सच्चाई से’—को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ὡς Θεοῦ δοῦλον
  choice: परमेश्वर के सेवक के रूप में
  rationale: δοῦλος का मूल अर्थ दास भी हो सकता है, पर परमेश्वर से संबंध के इस नैतिक प्रसंग में ‘सेवक’ आधुनिक हिन्दी में अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐν ἀληθείᾳ πορεύεσθαι
  choice: सत्य के मार्ग पर चलना
  rationale: ‘सत्य में चलना’ की सामी-यूनानी अभिव्यक्ति को अर्थ स्पष्ट करने वाली, किंतु रूपक बनाए रखने वाली हिन्दी में प्रस्तुत किया गया है।
- source_word: πονηρὰν συνείδησιν
  choice: बुरी अंतरात्मा
  rationale: συνείδησις यहाँ नैतिक चेतना या अंतःकरण है; ‘अंतरात्मा’ सामान्य पाठक के लिए सहज है।
- source_word: σεμνῷ καὶ ἀληθεῖ
  choice: गरिमामय और सच्चे
  rationale: σεμνός का अर्थ आदरणीय, गंभीर या गरिमामय है; इसे ἅγιος के समान सीधे ‘पवित्र’ नहीं बनाया गया।
- source_word: ἀκριβῶς
  choice: इतनी स्पष्टता से
  rationale: यहाँ वक्ता का आशय इन बातों को स्पष्ट और ठीक रीति से सुनने से है; वर्तमान हिन्दी में यह अभिव्यक्ति स्वाभाविक है।
theological_decisions:
- issue: πνεῦμα को दिव्य ‘पवित्र आत्मा’ मानना या सामान्य ‘आत्मा’
  choice: मुख्य पाठ में ‘आत्मा’, बिना ‘पवित्र’ जोड़े
  alternative: ‘पवित्र आत्मा’ या ‘मनुष्य की आत्मा’
  rationale: यूनानी पाठ πνεῦμα कहता है और इस वाक्य में ἅγιον नहीं है। निकटवर्ती प्रसंग इसे परमेश्वर द्वारा देह में बसाए गए आत्मा से जोड़ता है, पर इसकी सटीक पहचान को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गंभीर और उपदेशात्मक स्वर रखा गया है। संबोधन κύριε के लिए ‘स्वामी’ चुना गया है, क्योंकि वक्ता आज्ञा देने वाले दिव्य दूत-सदृश पात्र को आदर से संबोधित कर रहा है।
