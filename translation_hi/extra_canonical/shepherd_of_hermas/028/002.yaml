base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/002.yaml
  text: Therefore those who lie reject the Lord and become defrauders of the Lord, not handing back to him the deposit that they received. For they received from him a spirit without falsehood. If they return it false, they have defiled the command of the Lord and have become defrauders.
translation:
  language: hi
  text: इसलिए जो लोग झूठ बोलते हैं, वे प्रभु को ठुकराते हैं और प्रभु का हक मारनेवाले[a] बन जाते हैं, क्योंकि उसके द्वारा उन्हें सौंपी गई धरोहर को वे प्रभु को वापस नहीं सौंपते। उन्हें उससे झूठ से रहित आत्मा मिली थी। यदि वे उस आत्मा को झूठा बनाकर लौटाते हैं, तो वे प्रभु की आज्ञा को दूषित कर चुके हैं और उसका हक मारनेवाले बन गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु को उसकी देय वस्तु से वंचित करनेवाले”; यूनानी शब्द में किसी का हक रोक लेने या दबा लेने का भाव है।
    reason: ἀποστερηταί के विशिष्ट अर्थ और धरोहर न लौटाने से उसके संबंध को स्पष्ट करना।
lexical_decisions:
- source_word: ἀθετοῦσι
  choice: ठुकराते हैं
  rationale: क्रिया में अस्वीकार करने और निष्ठा तोड़ने का भाव है; ‘ठुकराते हैं’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποστερηταὶ
  choice: हक मारनेवाले
  rationale: शब्द उस व्यक्ति को सूचित करता है जो किसी को उसकी देय वस्तु से वंचित करता या उसे दबा लेता है। यह चयन केवल सामान्य ‘धोखेबाज़’ कहने के बजाय प्रभु को उसकी देय धरोहर न लौटाने के प्रसंग को बनाए रखता है।
- source_word: παρακαταθήκην
  choice: धरोहर
  rationale: यह सौंपी गई अमानत या सुरक्षित रखी जानेवाली वस्तु है। ‘धरोहर’ आगे आत्मा को लौटाने की भाषा के साथ स्वाभाविक बैठती है।
- source_word: πνεῦμα ἄψευστον
  choice: झूठ से रहित आत्मा
  rationale: यह मूल की स्पष्ट विशेषता को बनाए रखता है और यह पूर्वनिर्धारित नहीं करता कि आशय ‘सच्ची’, ‘निष्कपट’ अथवा ‘झूठ बोलने में असमर्थ’ आत्मा से है।
- source_word: ἐμίαναν
  choice: दूषित करते हैं
  rationale: मूल क्रिया अपवित्र या कलुषित करने का अर्थ देती है; ‘दूषित’ नैतिक और धार्मिक गंभीरता को सुरक्षित रखता है।
theological_decisions:
- issue: मनुष्य द्वारा परमेश्वर से मिली आत्मा को ‘झूठी बनाकर लौटाने’ का कथन
  choice: 'रूपक को सीधे बनाए रखा गया: ‘उस आत्मा को झूठी बनाकर लौटाते हैं’'
  alternative: इसे व्याख्यात्मक रूप से ‘उस आत्मा का उपयोग झूठ बोलने में करते हैं’ कहना
  rationale: मूल पाठ धरोहर पाने और उसे बदली हुई दशा में लौटाने का तनावपूर्ण रूपक प्रस्तुत करता है। अनुवाद ने आत्मा के स्वरूप, मानव आत्मा और पवित्र आत्मा के संबंध, या लौटाने की प्रक्रिया पर कोई सांप्रदायिक निष्कर्ष नहीं थोपा।
- issue: ἀποστερηταὶ τοῦ Κυρίου का संबंध
  choice: ‘प्रभु का हक मारनेवाले’
  alternative: ‘प्रभु से वंचित हो जाते हैं’ या ‘प्रभु को धोखा देनेवाले’
  rationale: व्याकरण और धरोहर न लौटाने का निकट संदर्भ प्रभु को उसकी देय वस्तु से वंचित करने का अर्थ समर्थित करता है; फिर भी पद की अर्थ-सीमा पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘धरोहर’, ‘झूठ से रहित आत्मा’ और ‘लौटाते हैं’ मूल के अमानत-वाले रूपक को सुरक्षित रखते हैं। पद-संख्या पाठ में नहीं जोड़ी गई, क्योंकि प्रस्तुत इकाई स्वयं 28:2 है।
