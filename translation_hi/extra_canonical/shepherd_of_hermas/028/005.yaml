base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/005.yaml
  text: ‘Now then,’ he says, ‘you are hearing; keep them, so that even the former lies that you spoke in your dealings, if these are found true, those also may become credible; for those too can become credible. If you keep these and from now on speak all truth, you will be able to gain life for yourself. And whoever hears this command and abstains from the most evil lie will live to God.’
translation:
  language: hi
  text: “तो अब,” वह कहता है, “तुम सुन रहे हो; इन बातों का पालन करो, ताकि अपने लेन-देन में तुमने पहले जो झूठ बोले थे, इन बातों के सत्य पाए जाने पर वे भी विश्वसनीय ठहरें; क्योंकि वे भी विश्वसनीय ठहर सकते हैं। यदि तुम इन बातों का पालन करोगे और अब से हर बात सच बोलोगे, तो तुम अपने लिए जीवन प्राप्त कर सकोगे। और जो कोई इस आज्ञा को सुनेगा और इस अत्यंत बुरे झूठ से दूर रहेगा, वह परमेश्वर के लिए जीवित रहेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε αὐτά / ταῦτα φυλάξῃς
  choice: इन बातों का पालन करो / पालन करोगे
  rationale: क्रिया में केवल याद रखने नहीं, दी गई शिक्षा को मानने और आचरण में उतारने का भाव है।
- source_word: ἐν ταῖς πραγματείαις σου
  choice: अपने लेन-देन में
  rationale: πραγματεία यहाँ व्यवहार, कारोबार या व्यावहारिक लेन-देन को सूचित कर सकता है; ‘लेन-देन’ प्रसंग के नैतिक और सामाजिक दोनों आयाम बनाए रखता है।
- source_word: πιστὰ γένηται
  choice: विश्वसनीय ठहरें
  rationale: πιστός का यहाँ अर्थ ‘सच्चा’ भी हो सकता है, पर पूर्व कथनों के लोगों द्वारा माने जाने के संदर्भ में ‘विश्वसनीय’ अधिक स्वाभाविक है और स्रोत की कठिन अभिव्यक्ति को मिटाता नहीं।
- source_word: ζήσεται τῷ Θεῷ
  choice: परमेश्वर के लिए जीवित रहेगा
  rationale: समर्पणसूचक dative को बनाए रखा गया है; इसे केवल ‘जीवन पाएगा’ या ‘परमेश्वर के साथ जीवित रहेगा’ बनाकर संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: पूर्व में बोले गए झूठों का बाद में ‘विश्वसनीय’ ठहरना
  choice: स्रोत की असहज और तनावपूर्ण अभिव्यक्ति को यथावत रखा गया
  alternative: इसे इस अर्थ में समझाकर लिखना कि बाद की सत्यनिष्ठा पुराने झूठों का प्रायश्चित या सुधार कर देगी
  rationale: यूनानी वाक्य वास्तव में कहता है कि वर्तमान बातें सत्य पाई जाने पर पहले की बातें भी πιστά हो सकती हैं; अनुवाद में इस कठिनाई को किसी विशेष नैतिक या प्रायश्चित-सिद्धांत से हल नहीं किया गया।
- issue: ζήσεται τῷ Θεῷ का संबंध
  choice: ‘परमेश्वर के लिए जीवित रहेगा’
  alternative: ‘परमेश्वर के साथ जीवित रहेगा’ या ‘परमेश्वर से जीवन पाएगा’
  rationale: मूल dative बहुअर्थी है; चुना गया रूप उद्देश्य/समर्पण का सीधा अर्थ देता है और परलोक अथवा उद्धार की अधिक निश्चित व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। संवाद की पुनरावृत्ति तथा मूल के नैतिक तनाव को संक्षिप्त व्याख्या जोड़कर समतल नहीं किया गया।
