review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the address, the command to love truth, God's causing the spirit to dwell in the flesh, the purpose clause, and the final affirmation that no falsehood is with the Lord. However, πᾶσα ἀλήθεια ('all/whole truth') is narrowed by 'केवल सत्य ही' ('only truth'), and the predicate for आत्मा should agree grammatically in the feminine.
  naturalness: The Hindi is generally fluent and suitably dignified. 'सच्चा पाया जाए' is a conspicuous gender-agreement error because आत्मा is feminine in Hindi. 'महिमान्वित होगा' more directly and naturally represents the passive 'will be glorified' than the impersonal 'महिमा होगी.'
  terminology: ‘सत्य,’ ‘आत्मा,’ ‘देह,’ and ‘प्रभु’ are appropriate and retain the source's theological restraint. The spirit is not identified beyond what the Greek states. No footnote is needed for this short segment.
  issues:
  - severity: medium
    issue: πᾶσα ἀλήθεια is rendered as ‘केवल सत्य ही.’
    rationale: ‘केवल’ emphasizes exclusion ('only') but does not represent the source's distributive/totalizing πᾶσα ('all, whole'). ‘पूरा सत्य’ retains the sense that truth spoken is not partial or deceptive.
  - severity: medium
    issue: ‘वह आत्मा ... सच्चा पाया जाए’ has incorrect Hindi gender agreement.
    rationale: आत्मा is grammatically feminine in standard Hindi; the predicate must be ‘सच्ची पाई जाए.’
  - severity: low
    issue: ‘प्रभु की महिमा होगी’ is less direct than the Greek passive.
    rationale: δοξασθήσεται has the Lord as its grammatical subject. ‘प्रभु ... महिमान्वित होगा’ preserves this more explicitly without altering meaning.
  revised_text: वह फिर मुझसे कहता है, “सत्य से प्रेम करो, और तुम्हारे मुँह से पूरा सत्य निकले, ताकि वह आत्मा, जिसे परमेश्वर ने इस देह में वास कराया है, सब लोगों के सामने सच्ची पाई जाए। इस प्रकार तुम्हारे भीतर वास करनेवाला प्रभु महिमान्वित होगा; क्योंकि प्रभु अपने हर वचन में सच्चा है, और उसमें कोई झूठ नहीं है।”
