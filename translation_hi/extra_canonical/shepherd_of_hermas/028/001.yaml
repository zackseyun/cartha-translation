base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/001.yaml
  text: 'Again he says to me: “Love truth, and let all truth go forth from your mouth, so that the spirit which God has caused to dwell in this flesh may be found true before all people, and thus the Lord who dwells in you will be glorified; for the Lord is true in every word, and there is no falsehood with him.'
translation:
  language: hi
  text: वह फिर मुझसे कहता है, “सत्य से प्रेम करो, और तुम्हारे मुँह से पूरा सत्य निकले, ताकि वह आत्मा, जिसे परमेश्वर ने इस देह में वास कराया है, सब लोगों के सामने सच्ची पाई जाए। इस प्रकार तुम्हारे भीतर वास करनेवाला प्रभु महिमान्वित होगा; क्योंकि प्रभु अपने हर वचन में सच्चा है, और उसमें कोई झूठ नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν ἀγάπα
  choice: सत्य से प्रेम करो
  rationale: यूनानी पद का सीधा और स्वाभाविक हिन्दी रूप; सत्य को केवल बोलने नहीं, उससे प्रेम करने की आज्ञा सुरक्षित रहती है।
- source_word: πᾶσα ἀλήθεια
  choice: केवल सत्य
  rationale: शाब्दिक ‘समस्त सत्य’ हिन्दी में अस्वाभाविक और अर्थ की दृष्टि से संदिग्ध लगता; प्रसंग का आशय है कि मुँह से जो निकले वह पूरी तरह सत्य हो।
- source_word: τὸ πνεῦμα
  choice: वह आत्मा
  rationale: मूल में ‘आत्मा’ की पहचान स्पष्ट रूप से निर्धारित नहीं की गई है; इसलिए ‘पवित्र आत्मा’ जोड़कर अस्पष्टता को संप्रदायगत ढंग से नहीं सुलझाया गया।
- source_word: κατῴκισεν
  choice: वास कराया है
  rationale: 'कारक भाव को बनाए रखता है: परमेश्वर ने आत्मा को इस देह में बसाया।'
- source_word: ἐν τῇ σαρκὶ ταύτῃ
  choice: इस देह में
  rationale: यहाँ σάρξ का स्वाभाविक हिन्दी रूप ‘देह’ है; ‘मांस’ अनावश्यक रूप से भौतिक और अप्राकृतिक लगेगा।
- source_word: ἀληθὲς εὑρεθῇ
  choice: सच्चा पाया जाए
  rationale: नपुंसकलिंग πνεῦμα के साथ प्रयुक्त विशेषण का भाव सुरक्षित रखते हुए हिन्दी में आत्मा के अनुसार स्वाभाविक व्याकरण अपनाया गया।
- source_word: δοξασθήσεται
  choice: महिमा होगी
  rationale: निष्क्रिय क्रिया का सहज हिन्दी रूप, जिसका अर्थ है कि प्रभु महिमान्वित होगा।
- source_word: παρ’ αὐτῷ
  choice: उसमें
  rationale: ईश्वर के संबंध में ‘उसके पास कोई झूठ नहीं’ की अपेक्षा हिन्दी में ‘उसमें कोई झूठ नहीं’ अधिक स्वाभाविक है और नैतिक अभिप्राय स्पष्ट रखता है।
theological_decisions:
- issue: इस देह में वास करनेवाली आत्मा की पहचान
  choice: ‘वह आत्मा’—बिना ‘पवित्र’ जोड़े
  alternative: ‘पवित्र आत्मा’
  rationale: यूनानी पाठ केवल τὸ πνεῦμα कहता है। निकट संदर्भ इसे परमेश्वर से मिली सत्य आत्मा के रूप में प्रस्तुत करता है, पर इस खंड में स्पष्ट पदवी ‘पवित्र आत्मा’ नहीं देता; अतः मूल की संभावित व्यापकता और तनाव सुरक्षित रखा गया।
- issue: ‘तुम्हारे भीतर वास करनेवाले प्रभु’ और पहले उल्लिखित आत्मा का संबंध
  choice: दोनों अभिव्यक्तियों को मूल की तरह अलग रखा
  alternative: दोनों को स्पष्टतः एक ही सत्ता बताना
  rationale: मूल पाठ संबंध का संकेत देता है, पर उसे व्यवस्थित धर्मशास्त्रीय कथन में नहीं बदलता। अनुवाद ने न तो उन्हें मिला दिया, न अलग-अलग सत्ताएँ घोषित किया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सहज। वाक्य-विन्यास मूल के तर्कक्रम को बनाए रखते हुए अत्यधिक यूनानी शैली से मुक्त रखा गया है। पाठ केवल reader segment 1 (28:1) का अनुवाद है; उपलब्ध विस्तृत मूल संदर्भ का उपयोग अर्थ निर्धारण के लिए किया गया।
