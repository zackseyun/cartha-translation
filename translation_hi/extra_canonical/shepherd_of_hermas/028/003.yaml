  text: So when I heard these things, I wept greatly. But seeing me weeping, he says, ‘Why are you weeping?’ ‘Because, sir,’ I say, ‘I do not know whether I can be saved.’ ‘Why?’ he says. ‘For,’ I say, ‘sir, never yet in my life have I spoken a true word, but I have always lived deceitfully with everyone, and I made my lie appear true before all people; and no one ever contradicted me, but my word was believed. How then,’ I say, ‘sir, can I live, having done these things?’
translation:
  language: hi
  text: यह सब सुनकर मैं बहुत रोया। मुझे रोते देखकर वह मुझसे कहता है, “तुम क्यों रो रहे हो?” मैंने कहा, “स्वामी, इसलिए कि मैं नहीं जानता कि मेरा उद्धार हो सकता है या नहीं।” वह कहता है, “क्यों?” मैंने कहा, “क्योंकि, स्वामी, मैंने अपने जीवन में अब तक कभी एक भी सच्ची बात नहीं कही, बल्कि मैं सदा सब लोगों के साथ छल-कपट से जीता रहा और अपने झूठ को सभी लोगों के सामने सच के रूप में दिखाया। किसी ने कभी मेरा खंडन नहीं किया, बल्कि लोगों ने मेरी बात पर विश्वास किया। तो फिर, स्वामी,” मैंने कहा, “ये सब काम करने के बाद मैं कैसे जी सकता हूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωθῆναι
  choice: मेरा उद्धार हो सकता है
  rationale: ग्रीक निष्क्रिय क्रिया का उद्धार-संबंधी अर्थ बनाए रखता है और यह तय नहीं करता कि उद्धार का साधन या कर्ता यहाँ कैसे समझा जाए।
- source_word: πανοῦργος ἔζησα
  choice: छल-कपट से जीता रहा
  rationale: यह केवल कभी-कभार झूठ बोलने के बजाय लगातार धूर्त और कपटपूर्ण जीवन-व्यवहार को व्यक्त करता है।
- source_word: τὸ ψεῦδός μου ἀληθὲς ἐπέδειξα
  choice: अपने झूठ को ... सच करके दिखाया
  rationale: ἐπέδειξα के प्रदर्शन या प्रमाणित करके दिखाने के भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀντεῖπεν
  choice: मेरा खंडन नहीं किया
  rationale: कथन का विरोध करने या उसे झुठलाने के अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ζῆσαι
  choice: जीवन पा सकता हूँ
  rationale: संदर्भ में यह मात्र जीवित रहने से आगे उद्धारमय जीवन की ओर संकेत कर सकता है; ‘जीवन पा सकता हूँ’ उस तनाव को बिना पूरी तरह स्पष्ट किए बनाए रखता है।
theological_decisions:
- issue: σωθῆναι और अंतिम ζῆσαι का संबंध
  choice: पहले को ‘उद्धार’, अंतिम को ‘जीवन पाना’ कहा गया
  alternative: दोनों को ‘बचना/जीना’ या दोनों को स्पष्टतः ‘उद्धार पाना’ कहना
  rationale: मूल पाठ अलग क्रियाएँ प्रयोग करता है। अनुवाद उस शब्दभेद और उनके संभावित धर्मवैचारिक संबंध दोनों को बनाए रखता है।
- issue: स्वीकारोक्ति की व्यापकता
  choice: ‘कभी एक भी सच्ची बात नहीं कही’ के पूर्ण कथन को यथावत रखा
  alternative: इसे अतिशयोक्ति मानकर ‘बहुधा सच नहीं बोला’ करना
  rationale: वक्ता की तीव्र आत्म-दोषस्वीकृति मूल पाठ में जानबूझकर निरपेक्ष है; उसे नरम करना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; संवाद का वर्तमानकालीन कथन-ढाँचा (‘कहता है’) ग्रीक की जीवंत ऐतिहासिक वर्तमान शैली के अनुरूप रखा गया है। ‘स्वामी’ κύριε के सम्मानसूचक संबोधन को दर्शाता है, बिना इसे अनिवार्यतः ईश्वरीय उपाधि ठहराए।
