base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/002.yaml
  text: I knew that I would escape it, if your heart becomes pure and without blemish, and if for the remaining days of your life you serve the Lord blamelessly. Cast your cares upon the Lord, and he himself will direct them.
translation:
  language: hi
  text: मैं जानती हूँ कि तुम उससे बच निकलोगे, यदि तुम्हारा हृदय शुद्ध और निष्कलंक हो जाए और तुम अपने जीवन के शेष दिनों में निर्दोषता से प्रभु की सेवा करो। अपनी चिंताएँ प्रभु पर डाल दो, और वह स्वयं उनकी व्यवस्था कर देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: मैं समझ गई
  rationale: क्रिया का अर्थ ‘मैंने जाना/समझा’ है; प्रसंग में बोलने वाली कुमारी है, इसलिए हिन्दी में स्त्रीलिंग रखा गया।
- source_word: ἐκφυγεῖν αὐτήν
  choice: उससे बच निकलोगे
  rationale: ἐκφεύγω संकट से बच निकलने को व्यक्त करता है; αὐτήν निकटवर्ती स्त्रीलिंग विपत्ति/संकट की ओर संकेत करता है।
- source_word: καθαρὰ καὶ ἄμωμος
  choice: शुद्ध और निर्दोष
  rationale: दोनों विशेषणों का अलग नैतिक बल बनाए रखा गया है—स्वच्छता और दोषरहितता।
- source_word: δουλεύσητε τῷ Κυρίῳ
  choice: प्रभु की सेवा करो
  rationale: δουλεύω का मूल भाव अधीन होकर सेवा करना है; सहज आधुनिक हिन्दी में ‘सेवा करो’ उपयुक्त है।
- source_word: ἀμέμπτως
  choice: निर्दोष रीति से
  rationale: यह क्रियाविशेषण सेवा करने के ढंग को ‘निन्दा/दोष से परे’ बताता है।
- source_word: ἐπιρίψατε τὰς μερίμνας
  choice: अपनी चिंताएँ ... पर डाल दो
  rationale: मूल के सजीव रूपक ‘ऊपर फेंक देना/सौंप देना’ को बनाए रखता है।
- source_word: κατορθώσει αὐτάς
  choice: उन्हें सँभाल देगा
  rationale: κατορθόω का अर्थ ठीक करना, सफलतापूर्वक व्यवस्थित करना या सही दिशा देना हो सकता है; यहाँ चिंताओं के साथ स्वाभाविक हिन्दी ‘सँभाल देगा’ है।
theological_decisions:
- issue: हृदय की शुद्धता और निर्दोष सेवा की शर्त
  choice: ‘यदि ... और ...’ के रूप में स्पष्ट शर्त बनाए रखी गई
  alternative: इसे केवल सामान्य प्रोत्साहन या निश्चित प्रतिज्ञा के रूप में प्रस्तुत करना
  rationale: ἐὰν के कारण मूल पाठ वास्तविक शर्त व्यक्त करता है; उसके नैतिक और धार्मिक तनाव को नरम नहीं किया गया।
- issue: κατορθώσει में प्रभु की क्रिया
  choice: ‘वह स्वयं उन्हें सँभाल देगा’
  alternative: ‘वह तुम्हारी योजनाएँ सफल करेगा’ या ‘वह उन्हें सही दिशा देगा’
  rationale: सर्वनाम αὐτάς व्याकरणतः ‘चिंताओं’ को संदर्भित करता है; अनुवाद सफलता की ऐसी प्रतिज्ञा नहीं जोड़ता जो पाठ में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन में बहुवचन/आदरार्थक ‘तुम’ का भाव मूल के ὑμῶν और δουλεύσητε के अनुसार रखा गया है। प्रारंभिक वाक्य में वक्ता कुमारी होने के कारण ‘समझ गई’ प्रयुक्त है।
