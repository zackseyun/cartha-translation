base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/001.yaml
  text: After the beast had passed by me and I had gone forward about thirty feet, behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was with a turban, and her hair was white.
translation:
  language: hi
  text: जब वह पशु मेरे पास से गुजर गया और मैं लगभग तीस फुट आगे बढ़ा, तब देखो, एक कुँवारी मेरे सामने आई। वह ऐसी सजी हुई थी, मानो विवाह-कक्ष से निकलकर आ रही हो। वह पूरी तरह सफेद वस्त्रों में थी और सफेद सैंडल पहने हुए थी। उसने माथे तक घूँघट ओढ़ रखा था; उसका आवरण मस्तक-पट्टी के रूप में था[a], और उसके बाल सफेद थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उसका आवरण पगड़ी के रूप में था” या “उसका आवरण एक पट्टी से बँधा था।” यूनानी शब्द μίτρα सिर पर बाँधे जाने वाले आवरण, पट्टी या पगड़ी के लिए प्रयुक्त हो सकता है।'
    reason: μίτρα के सटीक रूप के विषय में वास्तविक शब्दार्थगत अनिश्चितता है; इसलिए मुख्य पाठ में अपेक्षाकृत तटस्थ शब्द और पादटिप्पणी में विकल्प रखे गए हैं।
lexical_decisions:
- source_word: θηρίον
  choice: पशु
  rationale: यह सामान्यतः जंगली या भयावह पशु को सूचित करता है; संदर्भ के प्रतीकात्मक अर्थ को अनावश्यक रूप से तय किए बिना ‘पशु’ स्वाभाविक है।
- source_word: παρθένος
  choice: कुँवारी
  rationale: यूनानी शब्द के कौमार्य-संबंधी अर्थ को सीधे बनाए रखता है; केवल ‘युवती’ कहने से यह अर्थ खो जाता।
- source_word: νυμφῶνος
  choice: विवाह-कक्ष
  rationale: यह विवाह या दुल्हन से जुड़े कक्ष का संकेत देता है; आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: μίτρᾳ
  choice: पगड़ी के रूप में
  rationale: μίτρα सिर पर बाँधे जाने वाले आवरण, पट्टी या पगड़ी का बोध करा सकता है; मुख्य पाठ में दृश्य रूप स्पष्ट किया गया है और विकल्प पादटिप्पणी में रखा गया है।
- source_word: πόδας τριάκοντα
  choice: तीस फुट
  rationale: मूल में शाब्दिक रूप से ‘तीस पाँव’ लंबाई की माप है; हिन्दी पाठक के लिए प्रचलित माप-शब्द ‘फुट’ रखा गया है।
theological_decisions:
- issue: कुँवारी की प्रतीकात्मक पहचान
  choice: उसे केवल ‘एक कुँवारी’ कहा गया है
  alternative: उसे कलीसिया या किसी विशिष्ट स्वर्गीय व्यक्तित्व के रूप में पहचानना
  rationale: इस वाक्य में स्वयं उसकी पहचान स्पष्ट नहीं की गई; अनुवाद बाद की व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण वर्णन रखा गया है। यूनानी के जीवंत ‘देखो’ को बनाए रखा गया है, जबकि लंबे मूल वाक्य को पठनीयता के लिए छोटे वाक्यों में विभाजित किया गया है।
