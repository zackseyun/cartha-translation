base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/003.yaml
  text: Believe in the Lord, you double-minded, because he is able to do all things and turns his anger away from you, but sends plagues upon you who are double-minded. Woe to those who have heard these words and disobeyed; it would have been better for them not to have been born.
translation:
  language: hi
  text: हे दो-मन वाले लोगो, प्रभु पर विश्वास करो, क्योंकि वह सब कुछ कर सकता है; वह अपना क्रोध तुमसे दूर करता है और तुम दो-मन वालों पर दंड के प्रहार भेजता है। धिक्कार है उन पर जिन्होंने ये वचन सुने और फिर भी उनकी अवज्ञा की; उनके लिए जन्म न लेना अधिक अच्छा होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχοι / διψύχοις
  choice: दुचित्ते / दुचित्तों
  rationale: शाब्दिक अर्थ ‘दो मन वाला’ है; ‘दुचित्ता’ विश्वास में बँटे और डाँवाडोल मन को संक्षेप में बनाए रखता है।
- source_word: μάστιγας
  choice: विपत्तियाँ
  rationale: मूल शब्द का अर्थ कोड़े, दंडात्मक प्रहार या महामारियाँ हो सकता है। इस संदर्भ में व्यापक ‘विपत्तियाँ’ दैवी दंड का भाव रखता है और किसी एक प्रकार की आपदा तक अर्थ सीमित नहीं करता।
- source_word: παρακούσασιν
  choice: अवज्ञा की
  rationale: यह केवल न सुनने के बजाय सुनकर न मानने या आज्ञा न मानने का भाव व्यक्त करता है।
- source_word: αἱρετώτερον
  choice: यही अच्छा होता
  rationale: तुलनात्मक अर्थ ‘अधिक वांछनीय/बेहतर’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀποστρέφει और ἐξαποστέλλει के बीच संबंध
  choice: ‘हटा भी सकता है ... भेज भी सकता है’
  alternative: ‘अपना क्रोध हटा देता है, पर विपत्तियाँ भेजता है’
  rationale: ग्रीक में दोनों क्रियाएँ καί से जुड़ी हैं; वाक्य में प्रभु की सामर्थ्य के अंतर्गत दया और दंड दोनों की संभावना का तनाव है। ‘भी...भी’ इसे सुरक्षित रखता है और अंग्रेज़ी परामर्श-पाठ के प्रतिकूल ‘पर’ को अनिवार्य नहीं मानता।
- issue: πάντα δύναται का आशय
  choice: ‘वह सब कुछ कर सकता है’
  alternative: ‘वह सर्वशक्तिमान है’
  rationale: प्रत्यक्ष ग्रीक अभिव्यक्ति को रखा गया है; धर्मशास्त्रीय पद ‘सर्वशक्तिमान’ जोड़ने से बचा गया है।
- issue: जन्म न लेने का कथन
  choice: ‘वे जन्मे ही न होते’
  alternative: ‘उनका जन्म ही न हुआ होता’
  rationale: कठोर चेतावनी को बिना नरम किए सरल, स्वाभाविक हिन्दी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष उपदेशात्मक और गरिमापूर्ण शैली। ‘हे दुचित्ते लोगो’ संबोधन की तीव्रता बनाए रखता है; वाक्य सामान्य पाठक के लिए स्पष्ट रखे गए हैं।
