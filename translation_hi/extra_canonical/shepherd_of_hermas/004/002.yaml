  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/002.yaml
  text: Then she called me over, touched my chest, and said to me, "Did my reading please you?" And I said to her, "Lady, these last things please me, but the earlier things are hard and harsh." But she said to me, "These last things are for the righteous, but the earlier are for the nations and for the apostates."
translation:
  language: hi
  text: फिर उसने मुझे अपने पास बुलाया, मेरी छाती को छुआ और मुझसे कहा, “क्या तुम्हें मेरा वाचन अच्छा लगा?” मैंने उससे कहा, “हे स्वामिनी, अंत की ये बातें मुझे अच्छी लगीं, पर पहले की बातें कठिन और कठोर हैं।” तब उसने मुझसे कहा, “अंत की ये बातें धर्मियों के लिए हैं, पर पहले की बातें अन्यजातियों और धर्मत्यागियों के लिए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεῖται
  choice: अपने पास बुलाया
  rationale: मध्यम वाच्य का स्वाभाविक हिन्दी रूप; प्रसंग में स्त्री हरमास को निकट बुलाती है।
- source_word: ἥψατο τοῦ στήθους μου
  choice: मेरी छाती को छुआ
  rationale: यूनानी क्रिया और शरीर-संज्ञा का सीधा, सहज अनुवाद।
- source_word: ἡ ἀνάγνωσίς μου
  choice: मेरा पाठ
  rationale: यह उसके द्वारा अभी किए गए वाचन को सूचित करता है; ‘पाठ’ आधुनिक हिन्दी में पढ़ी गई सामग्री और उसके वाचन दोनों के लिए स्वाभाविक है।
- source_word: τὰ ἔσχατα
  choice: ये बाद की बातें
  rationale: यहाँ स्थानिक या युगांत-संबंधी अर्थ के बजाय पढ़े गए पाठ के अंतिम अंशों का संदर्भ है।
- source_word: τὰ πρότερα
  choice: पहली बातें
  rationale: पाठ में पहले पढ़ी गई बातों के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: χαλεπὰ καὶ σκληρά
  choice: कठिन और कठोर
  rationale: 'दोनों विशेषणों का भेद बनाए रखा गया है: समझने/सहने में कठिन तथा स्वर या विषय में कठोर।'
- source_word: τοῖς ἔθνεσιν
  choice: अन्यजातियों
  rationale: आरंभिक यहूदी-ईसाई प्रयोग में गैर-यहूदी राष्ट्रों/लोगों के लिए प्रचलित और संक्षिप्त हिन्दी पद; ‘राष्ट्रों’ की शाब्दिक सम्भावना को संदर्भ के अनुसार नहीं चुना गया।
- source_word: τοῖς ἀποστάταις
  choice: धर्मत्यागियों
  rationale: उन लोगों का संकेत जो विश्वास या निष्ठा से हट गए हैं; पद की धार्मिक गंभीरता बनी रहती है।
theological_decisions:
- issue: τοῖς ἔθνεσιν का आशय
  choice: अन्यजातियों
  alternative: राष्ट्रों
  rationale: धर्मियों और धर्मत्यागियों के साथ रखे जाने पर यह नैतिक-धार्मिक समुदायों की ओर संकेत करता है; फिर भी अनुवाद कोई अतिरिक्त दंड-विवरण नहीं जोड़ता।
- issue: ἀποστάταις की पहचान
  choice: धर्मत्यागियों
  alternative: विद्रोहियों / भटक गए लोगों
  rationale: मूल शब्द निष्ठा या विश्वास से अलग होने का अर्थ रखता है। यह अनुवाद उनकी सटीक सामुदायिक पहचान या अंतिम दशा को अनावश्यक रूप से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन Κυρία के लिए ‘हे स्वामिनी’ चुना गया है, ताकि सम्मान और स्त्रीलिंग संबोधन दोनों स्पष्ट रहें; ‘महोदया’ की आधुनिक औपचारिकता और ‘मालकिन’ के घरेलू/स्वामित्वपरक भाव से बचा गया है। प्रत्यक्ष कथन और मूल के समानांतर विरोधों को संरक्षित रखा गया है।
