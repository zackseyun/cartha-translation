translation_notes:
  register: आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण कथात्मक शैली। यूनानी वाक्यक्रम को जहाँ आवश्यक था वहाँ हिन्दी की स्वाभाविकता के अनुसार व्यवस्थित किया गया है, पर घटनाक्रम और अस्पष्ट संदर्भों को यथावत रखा गया है।
