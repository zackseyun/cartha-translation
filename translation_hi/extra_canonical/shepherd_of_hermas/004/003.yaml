  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/003.yaml
  text: While she was speaking with me, two men appeared, lifted her by the elbows, and went away to where the chair also was, toward the east. She went away cheerful, and as she was going she said to me, "Take courage, Hermas."
translation:
  language: hi
  text: जब वह मुझसे बात कर रही थी, तभी दो पुरुष दिखाई दिए। उन्होंने उसे उसकी कोहनियों से उठाया और उस स्थान की ओर चले गए जहाँ आसन भी था—पूर्व दिशा की ओर। वह प्रसन्न होकर चली गई और जाते-जाते मुझसे बोली, “हिम्मत रखो, हेरमास।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀγκώνων
  choice: कोहनियों से
  rationale: यूनानी बहुवचन का सीधा अर्थ सुरक्षित रखा गया है; प्रसंग में दोनों पुरुषों द्वारा उसे कोहनियों के पास थामकर उठाना अभिप्रेत है।
- source_word: ἱλαρά
  choice: प्रसन्न होकर
  rationale: यह शब्द हर्षित या प्रसन्न भाव को व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक क्रियाविशेषणीय रूप चुना गया।
- source_word: Ἀνδρίζου
  choice: हिम्मत रखो
  rationale: आज्ञार्थक क्रिया साहसी या दृढ़ बने रहने का आह्वान करती है; बोलचाल में सहज किंतु गरिमापूर्ण रूप चुना गया।
- source_word: καθέδρα
  choice: आसन
  rationale: पूर्व प्रसंग के बैठने के स्थान को दर्शाने के लिए गरिमापूर्ण और सामान्यतः बोधगम्य शब्द चुना गया।
- source_word: πρὸς τὴν ἀνατολήν
  choice: पूर्व दिशा की ओर
  rationale: दिशासूचक यूनानी वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी रूप।
