  text: So when she had finished reading and had risen from the chair, four young men came, lifted the chair, and went away toward the east.
translation:
  language: hi
  text: जब वह पढ़ना समाप्त करके आसन से उठी, तब चार युवक आए। वे आसन को उठाकर पूर्व दिशा की ओर चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγινώσκουσα
  choice: पढ़ना
  rationale: वर्तमान कृदंत का अर्थ यहाँ पहले से चल रही पाठ-क्रिया है; स्वाभाविक हिन्दी वाक्य में इसे ‘पढ़ना समाप्त करके’ कहा गया है।
- source_word: καθέδρα
  choice: आसन
  rationale: यह बैठने की वस्तु को दर्शाता है। ‘आसन’ गरिमापूर्ण और व्यापक है तथा अनावश्यक रूप से आधुनिक ‘कुर्सी’ की छवि आरोपित नहीं करता।
- source_word: νεανίαι
  choice: युवक
  rationale: युवा पुरुषों के लिए सीधा और वर्तमान मानक हिन्दी शब्द।
- source_word: πρὸς τὴν ἀνατολήν
  choice: पूर्व दिशा की ओर
  rationale: दिशासूचक यूनानी पद का स्पष्ट और स्वाभाविक हिन्दी रूप।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। यूनानी οὖν को अलग से ‘इसलिए/अतः’ नहीं रखा गया, क्योंकि इस खंड को स्वतंत्र पाठक-खंड के रूप में प्रस्तुत करने पर ‘जब’ ही घटनाक्रम का संबंध स्वाभाविक रूप से व्यक्त करता है।
