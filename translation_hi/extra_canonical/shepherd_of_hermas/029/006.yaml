base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/006.yaml
  text: “I therefore,” he says, “do not give an occasion for this practice to be carried through in this way, but so that the one who has sinned may no longer sin. But with regard to his former sin, there is One who is able to give healing—for he is the One who has authority over all.”
translation:
  language: hi
  text: “इसलिए,” वह कहता है, “मैं ऐसा अवसर नहीं देता कि यह आचरण इस प्रकार किया जाए, बल्कि इसलिए कि जिसने पाप किया है वह फिर पाप न करे। पर उसके पहले के पाप के विषय में, एक ऐसा है जो चंगाई दे सकता है—क्योंकि सब पर अधिकार उसी का है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφορμήν
  choice: अवसर
  rationale: मूल शब्द किसी कार्य के लिए मौका या आधार देने का भाव रखता है; ‘अवसर’ इस अर्थ को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πρᾶξις
  choice: आचरण
  rationale: यहाँ शब्द किसी एक क्षणिक काम से अधिक उस व्यवहार की ओर संकेत करता है जिसके चलते रहने की आशंका है।
- source_word: συντελῆται
  choice: चलता रहे
  rationale: संदर्भ में आशय इस व्यवहार को जारी रहने या अपने परिणाम तक पहुँचने देने से है; आधुनिक हिन्दी में ‘चलता रहे’ इसे सहजता से व्यक्त करता है।
- source_word: ἴασιν δοῦναι
  choice: चंगाई दे सकता है
  rationale: ‘चंगाई देना’ पाप से उपचार या पुनर्स्थापन की रूपकात्मक भाषा को बनाए रखता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह सामर्थ्य मात्र नहीं, बल्कि वैध प्रभुत्व और अधिकार का बोध कराता है।
theological_decisions:
- issue: पहले किए गए पाप की चंगाई देने वाले की पहचान
  choice: ‘एक है जो चंगाई दे सकता है’ कहकर पहचान को निहित रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर’ या ‘प्रभु’ जोड़ना
  rationale: यूनानी पाठ कर्ता का नाम नहीं देता, यद्यपि संदर्भ उसका दिव्य संकेत स्पष्ट करता है; अनुवाद मूल की निहितता को बनाए रखता है।
- issue: वक्ता की शिक्षा को पाप जारी रखने की अनुमति समझने की संभावना
  choice: ‘ऐसा अवसर देने के लिए नहीं’ और ‘फिर पाप न करे’
  alternative: इसे केवल विवाह-विच्छेद या पुनर्विवाह की स्पष्ट निषेधाज्ञा के रूप में विस्तार देना
  rationale: मूल पाठ का सामान्य नैतिक कथन सुरक्षित रखा गया है और संदर्भ से आगे कोई सांप्रदायिक वैवाहिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संवादसूचक विन्यास और ‘वह कहता है’ मूल कथन-शैली को बनाए रखते हैं।
