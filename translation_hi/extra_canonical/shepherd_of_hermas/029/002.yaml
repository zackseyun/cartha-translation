base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/002.yaml
  text: '“For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a servant of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”'
translation:
  language: hi
  text: “क्योंकि यदि यह विचार तुम्हारे हृदय में उठे, तो तुम पाप करोगे; और यदि ऐसी ही दूसरी बुरी बातें उठें, तो तुम पाप करते हो। परमेश्वर के सेवक के लिए ऐसा विचार एक बड़ा पाप है; और यदि कोई यह बुरा काम कर डाले, तो वह अपने ऊपर मृत्यु ले आता है। इसलिए अपने आप पर ध्यान दो और इस विचार से दूर रहो; क्योंकि जहाँ पवित्र मर्यादा वास करती है, वहाँ अधर्म को किसी धर्मी मनुष्य के हृदय में नहीं उठना चाहिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνθύμησις
  choice: विचार
  rationale: यह शब्द मन में उठने वाले विचार या मनन को दर्शाता है; प्रसंग में अनुचित यौन-विचार अभिप्रेत है, पर अनुवाद में मूल की सामान्य अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: διαμαρτήσεις
  choice: अपराध करोगे
  rationale: यहाँ क्रिया नैतिक सीमा लाँघने का अर्थ देती है; इसे निकटवर्ती ἁμαρτία के ‘पाप’ से शब्दगत भेद रखते हुए प्रस्तुत किया गया है।
- source_word: ἐργάζῃ / ἐργάσηται
  choice: करते हो / कर डाले
  rationale: पहला प्रयोग पाप करने के लिए और दूसरा बुरे कार्य को वास्तव में अंजाम देने के लिए है; हिन्दी में इस प्रगति को स्पष्ट रखा गया है।
- source_word: σεμνότης
  choice: पवित्र मर्यादा
  rationale: शब्द में गरिमा, नैतिक शालीनता और पवित्र आचरण का भाव है; केवल ‘लज्जा’ या ‘शील’ से इसका पूरा आशय व्यक्त नहीं होता।
- source_word: ἀνομία
  choice: अधर्म
  rationale: शाब्दिक भाव व्यवस्था-विरोध या नियमहीनता है; नैतिक-धार्मिक प्रसंग में ‘अधर्म’ स्वाभाविक और व्यापक समतुल्य है।
- source_word: θάνατον ἑαυτῷ κατεργάζεται
  choice: अपने लिए मृत्यु उत्पन्न करता है
  rationale: मूल की कारणात्मक और आत्म-संबंधी अभिव्यक्ति को बिना यह तय किए सुरक्षित रखा गया है कि मृत्यु शारीरिक है, आत्मिक है या न्याय-संबंधी।
theological_decisions:
- issue: बुरे विचार और पूरे किए गए बुरे कर्म के बीच संबंध
  choice: विचार को ‘बड़ा पाप’ और कार्य को अपने लिए मृत्यु उत्पन्न करना कहा गया है
  alternative: विचार को केवल प्रलोभन मानना और पाप को केवल बाहरी कर्म तक सीमित करना
  rationale: यूनानी पाठ स्वयं विचार को μεγάλη ἁμαρτία कहता है और फिर पूरे किए गए कर्म के परिणाम को अधिक तीखे ढंग से व्यक्त करता है।
- issue: ‘मृत्यु’ का स्वरूप
  choice: ‘मृत्यु’ को बिना व्याख्यात्मक विशेषण के रखा गया है
  alternative: ‘आत्मिक मृत्यु’ या ‘अनन्त मृत्यु’
  rationale: स्रोत इस स्थान पर मृत्यु का प्रकार निर्धारित नहीं करता; अतः उसकी धर्मवैज्ञानिक व्यापकता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘हृदय में उठना’ मूल के रूपक को स्वाभाविक हिन्दी में बनाए रखता है। यूनानी वाक्य में ‘और यदि ऐसी ही दूसरी बुरी बातें’ के बाद क्रिया लुप्त है; हिन्दी में प्रसंग से ‘उठें’ की पूर्ति की गई है, बिना अर्थ को किसी विशिष्ट पाप तक सीमित किए।
