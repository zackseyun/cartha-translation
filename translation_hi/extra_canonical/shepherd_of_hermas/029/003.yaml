base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/003.yaml
  text: I say to him, “Sir, allow me to ask you a few things.” “Speak,” he says. “Sir,” I say, “if someone has a wife who is faithful in the Lord, and he finds her in some adultery, does the husband sin by living together with her?”
translation:
  language: hi
  text: मैं उससे कहता हूँ, “स्वामी, मुझे आपसे कुछ बातें पूछने की अनुमति दीजिए।” वह कहता है, “कहो।” मैं कहता हूँ, “स्वामी, यदि किसी पुरुष की पत्नी प्रभु में विश्वास रखने वाली हो और वह उसे किसी व्यभिचार में लिप्त पाए, तो क्या पति उसके साथ रहना जारी रखकर पाप करता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: स्वामी
  rationale: यहाँ संबोधित व्यक्ति के प्रति आदरसूचक संबोधन है; ‘प्रभु’ रखने से उसी वाक्य में आए ‘ἐν Κυρίῳ’ के दैवी संदर्भ के साथ भ्रम हो सकता था।
- source_word: πιστὴν ἐν Κυρίῳ
  choice: प्रभु में विश्वासयोग्य
  rationale: πιστός का अर्थ ‘विश्वासी’ या ‘विश्वासयोग्य’ दोनों हो सकता है। ‘प्रभु में विश्वासयोग्य’ मूल की अभिव्यक्ति और उसकी कुछ अस्पष्टता बनाए रखता है।
- source_word: ἐν μοιχείᾳ τινί
  choice: व्यभिचार करते
  rationale: शाब्दिक ‘किसी व्यभिचार में’ हिन्दी में अस्वाभाविक है; यह चयन स्त्री को व्यभिचार की दशा या कृत्य में पाए जाने का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συνζῶν μετ᾿ αὐτῆς
  choice: उसके साथ रहते रहने से
  rationale: क्रिया साथ जीवन बिताने या सहवास जारी रखने को दर्शाती है; ‘रहते रहने’ से प्रश्न में निहित निरंतरता स्पष्ट होती है, बिना यौन संबंध तक अर्थ सीमित किए।
- source_word: ἆρα ἁμαρτάνει ὁ ἀνήρ
  choice: तो क्या ... वह पति पाप करता है?
  rationale: प्रश्नवाचक बल तथा ἀνήρ के वैवाहिक संदर्भ को सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘प्रभु में विश्वासयोग्य पत्नी’ का आशय
  choice: विश्वासयोग्य
  alternative: विश्वासी
  rationale: मूल πιστή चरित्रगत निष्ठा और धार्मिक विश्वास—दोनों अर्थ दे सकता है। अनुवाद ने इसे केवल चर्च-सदस्यता या धर्मांतरण के अर्थ में सीमित नहीं किया।
- issue: व्यभिचार के बाद साथ रहने से पति के पाप का प्रश्न
  choice: प्रश्न को बिना व्याख्यात्मक निष्कर्ष के ज्यों का त्यों खुला रखा गया
  alternative: साथ रहने को तत्काल दोष-साझेदारी या वैवाहिक संबंध बनाने के रूप में स्पष्ट करना
  rationale: इस पाठखंड में केवल प्रश्न है; उत्तर अगले खंड में आता है। यहाँ किसी नैतिक या वैवाहिक सिद्धांत को पहले से आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और आदरपूर्ण रखी गई है। संवाद की पुनरुक्त संरचना (‘मैं कहता हूँ’, ‘वह कहता है’) मूल यूनानी की कथात्मक शैली के अनुरूप सुरक्षित है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
