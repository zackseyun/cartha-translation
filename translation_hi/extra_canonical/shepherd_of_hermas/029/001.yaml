review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the command, the heart/thought imagery, the gravity of sin, and the concluding assurance. However, «व्यभिचार» can denote adultery specifically, whereas πορνεία here is broader sexual immorality; «बुरी बात» also substantially weakens ὁμοιωμάτων πονηρῶν (“evil likenesses/images”).
  naturalness: The Hindi is fluent and appropriately dignified. The revised wording remains natural while more closely retaining the source’s sequence and imagery.
  terminology: «यौन अनैतिकता» is used for πορνεία to avoid narrowing the term to adultery. «बुरी छवियाँ» retains the image/likeness component of ὁμοιωμάτων without attempting an interpretively specific expansion. «पवित्रता» is a clear modern rendering of ἁγνεία in this context.
  issues:
  - severity: medium
    issue: «व्यभिचार» for πορνεία
    rationale: In modern Hindi, «व्यभिचार» is commonly understood as adultery or an extramarital sexual relationship. The Greek term is broader and should not be restricted in this sentence.
  - severity: medium
    issue: «ऐसी ही किसी बुरी बात» for ὁμοιωμάτων πονηρῶν
    rationale: The draft omits the source term’s image/likeness nuance and turns it into an unspecific “bad thing.” «ऐसी ही बुरी छवियों» preserves the wording’s ambiguity more faithfully.
  revised_text: वह कहता है, “मैं तुम्हें आज्ञा देता हूँ कि तुम अपनी पवित्रता की रक्षा करो। किसी पराई स्त्री, किसी यौन अनैतिकता, या ऐसी ही बुरी छवियों के बारे में कोई विचार तुम्हारे हृदय में न उठे। क्योंकि ऐसा करके तुम बड़ा पाप करते हो। पर यदि तुम सदा अपनी पत्नी को ध्यान में रखोगे, तो कभी पाप नहीं करोगे।”
