base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/001.yaml
  text: “I am commanding you,” he says, “to guard chastity, and do not let a thought about another man’s wife, or about any fornication, or about any such evil likenesses, rise up upon your heart. For in doing this you commit a great sin. But if you remember your own wife always, you will never transgress.
translation:
  language: hi
  text: वह कहता है, “मैं तुम्हें आज्ञा देता हूँ कि तुम अपनी पवित्रता की रक्षा करो। किसी पराई स्त्री, किसी यौन अनैतिकता, या ऐसी ही बुरी छवियों के बारे में कोई विचार तुम्हारे हृदय में न उठे। क्योंकि ऐसा करके तुम बड़ा पाप करते हो। पर यदि तुम सदा अपनी पत्नी को ध्यान में रखोगे, तो कभी पाप नहीं करोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁγνείαν
  choice: शुद्धता
  rationale: यहाँ शब्द विशेष रूप से यौन आचरण और विचार की पवित्रता को सूचित करता है; ‘शुद्धता’ आधुनिक पाठक के लिए स्वाभाविक है और अर्थ को केवल बाहरी संयम तक सीमित नहीं करता।
- source_word: γυναικὸς ἀλλοτρίας
  choice: पराई स्त्री
  rationale: यूनानी पद का शाब्दिक अर्थ ऐसी स्त्री है जो अपनी नहीं है; ‘पराई स्त्री’ वैवाहिक संदर्भ को स्वाभाविक रूप से व्यक्त करता है, बिना मूल से अधिक स्पष्टता जोड़ने के।
- source_word: πορνείας
  choice: व्यभिचार
  rationale: संदर्भ में यह व्यापक यौन अनैतिकता को दर्शाता है। ‘व्यभिचार’ सामान्य हिन्दी धार्मिक भाषा में समझने योग्य है, यद्यपि इसका अर्थ कभी-कभी विशेष रूप से विवाहेतर संबंध भी लिया जाता है।
- source_word: ὁμοιωμάτων πονηρῶν
  choice: ऐसी ही किसी बुरी बात
  rationale: शाब्दिक ‘बुरी समानताओं/रूपों’ के स्थान पर प्रसंगानुकूल स्वाभाविक अभिव्यक्ति चुनी गई है, जो समान प्रकार की बुरी कल्पनाओं या विषयों की व्यापकता बनाए रखती है।
- source_word: ἀναβαινέτω ... ἐπὶ τὴν καρδίαν
  choice: अपने हृदय में न उठने दो
  rationale: मूल के ‘हृदय पर चढ़ आने’ वाले रूपक को सहज हिन्दी में यथासंभव बनाए रखा गया है।
- source_word: διαμαρτήσεις
  choice: पाप नहीं करोगे
  rationale: प्रसंग में यह नैतिक अपराध या उल्लंघन है; निकटवर्ती ἁμαρτία के साथ अर्थगत संबंध स्पष्ट रखने के लिए ‘पाप’ चुना गया है।
theological_decisions:
- issue: पापपूर्ण विचार और इच्छा के बीच संबंध
  choice: ‘विचार ... न उठने दो’
  alternative: ‘उसकी लालसा न करो’
  rationale: मूल पाठ हृदय में किसी विचार के उठने की भाषा इस्तेमाल करता है। अनुवाद इसे केवल जानबूझकर पोषित वासना तक सीमित नहीं करता और न ही अनचाहे विचारों के विषय में अतिरिक्त धर्मशास्त्रीय स्पष्टीकरण जोड़ता है।
- issue: अपनी पत्नी को स्मरण रखने का आश्वासन
  choice: ‘कभी पाप नहीं करोगे’
  alternative: ‘इस मामले में कभी पाप नहीं करोगे’
  rationale: मूल में सीमा स्पष्ट रूप से नहीं कही गई है। अनुवाद उसके व्यापक कथन को बनाए रखता है, यद्यपि तत्काल प्रसंग यौन शुद्धता का है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सरल रखी गई है। संवादात्मक ढाँचे में ‘वह कहता है’ रखा गया है। किसी फुटनोट की आवश्यकता नहीं समझी गई, इसलिए मुख्य पाठ में कोई फुटनोट-चिह्न नहीं है।
