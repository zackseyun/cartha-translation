base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/005.yaml
  text: “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not repent, keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be repentance.
translation:
  language: hi
  text: वह कहता है, “व्यभिचार केवल यही नहीं है कि कोई अपने शरीर को अशुद्ध करे, बल्कि जो कोई अन्यजातियों के समान प्रतिमाएँ बनाता है, वह भी व्यभिचार करता है। इसलिए ऐसे कामों में यदि कोई लगा रहे और पश्चाताप न करे, तो उससे अलग रहो और उसके साथ मत रहो; नहीं तो तुम भी उसके पाप में सहभागी हो। इसी कारण तुम्हें, चाहे पुरुष हों या स्त्रियाँ, अपने-अपने अलग रहने की आज्ञा दी गई है, क्योंकि ऐसे मामलों में पश्चाताप हो सकता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεία / μοιχᾶται
  choice: व्यभिचार / व्यभिचार करता है
  rationale: यौन बेवफाई के साथ-साथ रूपकात्मक धार्मिक बेवफाई के लिए भी वही शब्द रखकर यूनानी पाठ की जानबूझकर की गई अर्थ-संगति सुरक्षित रखी गई है।
- source_word: μιάνῃ
  choice: अशुद्ध करे
  rationale: शरीर को दूषित या अपवित्र करने का भाव देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὰ ὁμοιώματα
  choice: मूर्तियाँ
  rationale: यहाँ राष्ट्रों के ढंग पर बनाई जाने वाली प्रतिमाओं/रूपों और रूपकात्मक व्यभिचार का प्रसंग मूर्तिपूजा की ओर संकेत करता है; ‘मूर्तियाँ’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों
  rationale: प्राचीन यहूदी-ईसाई संदर्भ में ἔθνη का आशय अन्यजातीय लोगों से है; यह चयन ‘राष्ट्रों’ की आधुनिक राजनीतिक ध्वनि से बचता है।
- source_word: ἀπέχου ἀπ᾽ αὐτοῦ
  choice: उससे अलग रहो
  rationale: संबंधित व्यक्ति से दूरी बनाए रखने की आज्ञा को सहज हिन्दी में व्यक्त करता है।
- source_word: μὴ συνζῆθι αὐτῷ
  choice: उसके साथ मत रहो
  rationale: साथ जीवन बिताने या सहवास करने के व्यापक अर्थ को बनाए रखता है, बिना उसे केवल यौन अर्थ तक सीमित किए।
- source_word: ἐφ᾽ ἑαυτοῖς μένειν
  choice: अकेले रहने
  rationale: पति या पत्नी से अलग रहकर पुनर्विवाह न करने के निकटवर्ती प्रसंग में इसका स्वाभाविक अर्थ प्रस्तुत करता है।
theological_decisions:
- issue: मूर्ति-निर्माण को व्यभिचार कहना
  choice: ‘व्यभिचार’ शब्द को शाब्दिक और रूपकात्मक दोनों प्रयोगों में समान रखा गया
  alternative: दूसरे प्रयोग में ‘परमेश्वर से बेवफाई’ कहना
  rationale: स्रोत स्वयं दोनों बातों के लिए एक ही शब्द-परिवार का उपयोग करता है; उसे स्पष्ट व्याख्या में बदलना मूल की अलंकारिक तीक्ष्णता और संभावित तनाव को घटा देता।
- issue: अलग रहने की आज्ञा और पश्चाताप की संभावना
  choice: दोनों कथनों को बिना सामंजस्यकारी व्याख्या जोड़े साथ रखा गया
  alternative: स्पष्ट करना कि अलगाव केवल अस्थायी है या पुनर्मिलन अनिवार्य है
  rationale: इस खंड में अलग रहने का निर्देश पश्चाताप की संभावना से जुड़ा है, पर उसकी अवधि और परिणति यहाँ पूरी तरह नहीं बताई गई; अनुवाद उस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्रत्यक्ष कथन की संरचना और नैतिक-धार्मिक तर्क की क्रमबद्धता सुरक्षित रखी गई है। पाठ में कोई पादटिप्पणी-चिह्न आवश्यक नहीं पाया गया।
