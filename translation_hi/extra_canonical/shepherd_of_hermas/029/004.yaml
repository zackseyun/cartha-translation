  text: “As long as he is ignorant,” he says, “he does not sin; but if the husband comes to know her sin, and the wife does not repent but persists in her fornication, and the husband lives together with her, he becomes guilty of her sin and a sharer in her adultery. "What then, sir," I say, "should the husband do, if the wife persists in this passion?" "Let him divorce her," he says, "and let the husband remain by himself; but if, after divorcing his wife, he marries another, he himself also commits adultery." "If then, sir," I say, "after the wife is divorced, she repents and wishes to return to her own husband, will she not be received?" "Indeed," he says, "if the husband does not receive her, he sins and brings a great sin upon himself; rather, the one who has sinned and is repenting must be received—but not repeatedly—for to the servants of God repentance is one. Because of repentance, then, the man ought not to marry. This rule is laid upon both woman and man.
translation:
  language: hi
  text: 'उसने कहा, “जब तक पति अनजान है, तब तक वह पाप नहीं करता। लेकिन यदि पति को अपनी पत्नी के पाप का पता चल जाए और पत्नी पश्चाताप न करे, बल्कि अपने व्यभिचार में लगी रहे, और पति उसके साथ रहता रहे, तो वह उसके पाप का दोषी और उसके व्यभिचार में सहभागी हो जाता है।”


    मैंने कहा, “तो फिर, स्वामी, यदि पत्नी इस दुष्प्रवृत्ति में लगी रहे, तो पति क्या करे?”


    उसने कहा, “वह उसे अलग कर दे और स्वयं अकेला रहे। लेकिन यदि अपनी पत्नी को अलग करने के बाद वह दूसरी स्त्री से विवाह कर ले, तो वह भी व्यभिचार करता है।”


    मैंने कहा, “तो स्वामी, यदि अलग किए जाने के बाद पत्नी पश्चाताप करे और अपने पति के पास लौटना चाहे, तो क्या पति उसे स्वीकार न करे?”


    उसने कहा, “निश्चय ही करे! यदि पति उसे स्वीकार नहीं करता, तो वह पाप करता है और अपने ऊपर बड़ा पाप लाता है। जो पाप कर चुका है और पश्चाताप कर रहा है, उसे स्वीकार करना चाहिए—लेकिन बार-बार नहीं; क्योंकि परमेश्वर के सेवकों के लिए पश्चाताप एक ही है।[a] इसलिए उसके पश्चाताप की संभावना के कारण पति को दूसरी शादी नहीं करनी चाहिए। यही नियम स्त्री और पुरुष दोनों पर लागू होता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ का शाब्दिक भाव है, “परमेश्वर के सेवकों के लिए पश्चाताप एक है।” इससे ठीक पहले के “बार-बार नहीं” का अर्थ है कि यहाँ बारंबार पाप करके हर बार पुनः स्वीकार किए जाने की बात नहीं की जा रही।
    reason: कठिन और धर्मवैज्ञानिक रूप से तनावपूर्ण कथन के शाब्दिक रूप तथा प्रसंगगत संबंध को स्पष्ट करना, बिना उसे किसी बाद की सिद्धांत-व्यवस्था से सुलझाए।
lexical_decisions:
- source_word: ἄχρι τῆς ἀγνοίας
  choice: जब तक पति अनजान है
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप; आशय यह है कि पत्नी के पाप की जानकारी होने से पहले पति दोषी नहीं ठहरता।
- source_word: πορνεία
  choice: व्यभिचार
  rationale: इस वैवाहिक प्रसंग में यह पत्नी के विवाहेतर यौन आचरण को सूचित करता है और निकटवर्ती μοιχεία से संदर्भगत रूप से मेल खाता है।
- source_word: συνζῇ
  choice: उसके साथ रहता रहे
  rationale: शाब्दिक अर्थ ‘साथ जीवन बिताना’ है; यहाँ वैवाहिक सहजीवन जारी रखने का आशय है।
- source_word: ἀπολυσάτω
  choice: उसे अलग कर दे
  rationale: शब्द का अर्थ विदा करना या वैवाहिक संबंध से अलग करना हो सकता है। ‘तलाक दे’ की अपेक्षा यह चयन प्राचीन प्रसंग की विधिक अस्पष्टता को सुरक्षित रखता है।
- source_word: πάθος
  choice: वासना
  rationale: यहाँ किसी सामान्य दुःख या भाव के बजाय लगातार चल रहे अनैतिक यौन आवेग का संकेत है।
- source_word: δεχθῆναι
  choice: स्वीकार करना
  rationale: पश्चातापी जीवनसाथी को वापस ग्रहण करने के संबंधपरक आशय को व्यक्त करता है।
- source_word: πρᾶξις
  choice: नियम
  rationale: इस संदर्भ में ‘व्यवस्था/आचरण का सिद्धांत’ अभिप्रेत है; आधुनिक पाठक के लिए ‘नियम’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: पश्चाताप की संख्या संबंधी कथन
  choice: परमेश्वर के सेवकों के लिए पश्चाताप एक ही है
  alternative: परमेश्वर के सेवकों को केवल एक बार पश्चाताप का अवसर मिलता है
  rationale: यूनानी μετάνοιά ἐστιν μία को निकटता से रखा गया है और उसके कठोर धार्मिक तनाव को किसी व्यवस्थित सिद्धांत द्वारा नरम या विस्तृत नहीं किया गया।
- issue: पश्चातापी जीवनसाथी को फिर स्वीकार करना
  choice: उसे स्वीकार करना चाहिए
  alternative: उससे फिर मेल-मिलाप करना चाहिए
  rationale: मूल पाठ का δεχθῆναι ‘स्वीकार करना’ कहता है; ‘मेल-मिलाप’ संभावित परिणाम है, पर मूल से अधिक व्याख्यात्मक होता।
- issue: दूसरे विवाह का निषेध
  choice: उसके पश्चाताप की संभावना के कारण पति को दूसरी शादी नहीं करनी चाहिए
  alternative: पश्चाताप के कारण पुरुष को विवाह नहीं करना चाहिए
  rationale: प्रसंग स्पष्ट करता है कि पूर्व पत्नी के संभावित पश्चाताप और वापसी के लिए पति को अविवाहित रहना है; फिर भी इसे सार्वभौमिक विवाह-विरोधी कथन नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संवादात्मक रूप रखा गया है। ‘स्वामी’ से κύριε के गुरु-संबोधन का भाव व्यक्त किया गया है। वैवाहिक अलगाव के लिए ‘अलग कर दे’ चुना गया है ताकि आधुनिक कानूनी ‘तलाक’ की पूरी अवधारणा मूल पर न थोपी जाए। उपलब्ध यूनानी स्रोत में पद 5 के बीच से पद 8 के बीच तक पाठ लुप्त/कटित है; उस अंश की पुनर्रचना प्रस्तुत अंग्रेज़ी परामर्श-पाठ और अनुभाग के प्रचलित यूनानी पाठ-साक्ष्य के अनुरूप की गई है।
