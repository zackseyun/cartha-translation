  revised_text: 'उसने कहा, “जब तक पति अनजान है, तब तक वह पाप नहीं करता। लेकिन यदि पति को अपनी पत्नी के पाप का पता चल जाए और पत्नी पश्चाताप न करे, बल्कि अपने व्यभिचार में लगी रहे, और पति उसके साथ रहता रहे, तो वह उसके पाप का दोषी और उसके व्यभिचार में सहभागी हो जाता है।”


