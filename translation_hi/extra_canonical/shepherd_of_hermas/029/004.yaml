    उसने कहा, “वह उसे अलग कर दे और स्वयं अकेला रहे। लेकिन यदि अपनी पत्नी को अलग करने के बाद वह दूसरी स्त्री से विवाह कर ले, तो वह भी व्यभिचार करता है।”


