base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/002.yaml
  text: But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen you and establish you in his glory. Only do not be slothful, but take heart and strengthen your household. For, as the blacksmith hammering his work masters the thing he intends, so also the righteous word spoken daily prevails over every wickedness. Do not, therefore, cease admonishing your children; for I know that if they repent with their whole heart, they will be written in the books of life with the holy ones.
translation:
  language: hi
  text: पर प्रभु की अपार करुणा ने तुम पर और तुम्हारे घराने पर दया की है। वह तुम्हें सामर्थ्य देगा और अपनी महिमा में दृढ़ता से स्थापित करेगा। बस तुम ढीले न पड़ना, बल्कि साहस रखो और अपने घराने को दृढ़ करो। क्योंकि जैसे लोहार अपनी बनाई हुई वस्तु पर हथौड़ा चलाकर उसे अपने मनचाहे रूप में ढाल लेता है, वैसे ही प्रतिदिन कहा गया धर्ममय वचन हर प्रकार की बुराई पर विजय पाता है। इसलिए अपने बच्चों को समझाना कभी मत छोड़ो; क्योंकि मैं जानती हूँ कि यदि वे पूरे मन से पश्चाताप करें, तो उनके नाम पवित्र जनों के साथ जीवन की पुस्तकों में लिखे जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολυσπλαγχνία
  choice: अपार करुणा
  rationale: यह शब्द प्रभु की अत्यंत गहरी और व्यापक दया को व्यक्त करता है; आधुनिक हिन्दी में यह सहज और गरिमापूर्ण है।
- source_word: οἶκόν σου
  choice: तुम्हारा घराना
  rationale: यहाँ अर्थ केवल भवन नहीं, बल्कि परिवार और गृहस्थ समुदाय है।
- source_word: ῥαθυμήσῃς
  choice: ढीले न पड़ना
  rationale: मूल में आलस्य, उदासीनता या कर्तव्य में शिथिलता का भाव है; यह प्रयोग उस व्यापक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: εὐψύχει
  choice: साहस रखो
  rationale: आज्ञार्थक क्रिया मनोबल बनाए रखने और हिम्मत बाँधने का भाव देती है।
- source_word: ὁ λόγος ὁ καθημερινὸς ὁ δίκαιος
  choice: प्रतिदिन कहा गया धर्ममय वचन
  rationale: शब्द-क्रम की कुछ अस्पष्टता बनाए रखते हुए λόγος को ‘वचन’, καθημερινός को दैनिक पुनरावृत्ति और δίκαιος को नैतिक रूप से सही या धर्ममय रूप में व्यक्त किया गया है।
- source_word: περιγίνεται
  choice: विजय पाता है
  rationale: लोहार के रूपक में इसका अर्थ लक्ष्य साध लेने या वश में कर लेने का है, और बुराई के संदर्भ में ‘विजय पाता है’ सर्वाधिक स्वाभाविक है।
- source_word: βίβλους τῆς ζωῆς
  choice: जीवन की पुस्तकों
  rationale: मूल यूनानी में βίβλους बहुवचन है, इसलिए हिन्दी में भी बहुवचन सुरक्षित रखा गया है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों
  rationale: यह बहुवचन संज्ञात्मक विशेषण है और पवित्र लोगों के समुदाय को सूचित करता है।
theological_decisions:
- issue: पश्चाताप और जीवन की पुस्तकों में लिखे जाने के बीच संबंध
  choice: ‘यदि वे पूरे मन से पश्चाताप करें, तो उनके नाम ... लिखे जाएँगे’
  alternative: इसे केवल पहले से निश्चित उद्धार के प्रमाण के रूप में समझाकर अनुवाद करना
  rationale: मूल पाठ की स्पष्ट शर्तात्मक रचना ἐὰν ... μετανοήσωσιν को ज्यों का त्यों रखा गया है; किसी विशिष्ट उद्धार-सिद्धांत से इसे नहीं समझाया गया।
- issue: ‘अपनी महिमा में’ स्थापित करना
  choice: ‘अपनी महिमा में दृढ़ता से स्थापित करेगा’
  alternative: ‘अपनी महिमामय अवस्था में पहुँचाएगा’
  rationale: ἐν τῇ δόξῃ αὐτοῦ में सहभागिता, क्षेत्र या स्थिति की संभावित व्यापकता है; ‘में स्थापित करेगा’ मूल रूपक और उसकी धार्मिक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली रखी गई है। संबोधन में एकवचन ‘तुम’ मूल के अनुरूप है। लोहार के रूपक को शब्दशः कठोर बनाने के बजाय उसका दृश्य और तर्क दोनों स्वाभाविक हिन्दी में व्यक्त किए गए हैं।
