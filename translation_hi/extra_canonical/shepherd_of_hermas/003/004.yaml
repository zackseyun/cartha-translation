base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/004.yaml
  text: “Behold, the God of hosts, who by his invisible and mighty power and by his great understanding created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty word fixed the heaven and founded the earth upon the waters, and by his own wisdom and providence created his holy church, which also he blessed—behold, he is moving the heavens and the mountains and the hills and the seas, and all things become level for his elect, in order that he may give to them the promise which he promised with much glory and joy, if they keep the statutes of God which they received with great faith.”
translation:
  language: hi
  text: “देखो, सेनाओं का परमेश्वर, जिसने अपनी अदृश्य और प्रबल सामर्थ्य तथा अपनी महान समझ से संसार की सृष्टि की; जिसने अपनी महिमामय योजना से अपनी सृष्टि को सुंदरता से सजाया; जिसने अपने सामर्थी वचन से आकाश को स्थिर किया और पृथ्वी की नींव जल के ऊपर रखी; और जिसने अपनी ही बुद्धि और दूरदर्शिता से अपनी पवित्र कलीसिया की सृष्टि की और उसे आशीष भी दी—देखो, वही आकाशों, पर्वतों, पहाड़ियों और समुद्रों को हटा रहा है, और उसके चुने हुओं के लिए सब कुछ समतल हो रहा है, ताकि वह उन्हें वह प्रतिज्ञा दे, जो उसने बड़ी महिमा और आनंद के साथ की थी—यदि वे परमेश्वर के उन विधानों का पालन करें जिन्हें उन्होंने बड़े विश्वास के साथ ग्रहण किया था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν δυνάμεων
  choice: सेनाओं का परमेश्वर
  rationale: यह पारंपरिक बाइबलीय पदवी है; δυνάμεων का आशय यहाँ स्वर्गीय सेनाओं/शक्तियों से जुड़ा है, इसलिए केवल ‘सर्वशक्तिमान’ कहना पदवी की विशिष्टता मिटा देता।
- source_word: ἀοράτῳ δυνάμει καὶ κραταιᾷ
  choice: अपनी अदृश्य और प्रबल सामर्थ्य से
  rationale: दोनों विशेषण एक ही ‘सामर्थ्य’ का वर्णन करते हैं; हिन्दी में स्वाभाविक क्रम रखते हुए दोनों गुण सुरक्षित किए गए।
- source_word: τῇ μεγάλῃ συνέσει
  choice: अपनी महान समझ से
  rationale: σύνεσις बोध, समझ और विवेक का भाव देता है; ‘समझ’ सामान्य पाठक के लिए स्पष्ट और मूल के निकट है।
- source_word: τῇ ἐνδόξῳ βουλῇ
  choice: अपनी महिमामय योजना के अनुसार
  rationale: βουλή में परामर्श, संकल्प या योजना का भाव हो सकता है; सृष्टि-संदर्भ में ‘योजना’ स्वाभाविक है और उद्देश्यपूर्ण दिव्य अभिकल्पना व्यक्त करती है।
- source_word: τὴν εὐπρέπειαν
  choice: सुंदरता
  rationale: शोभा, सौंदर्य और भव्यता के अर्थों में यहाँ सृष्टि को सजाने के साथ ‘सुंदरता’ सहज बैठता है।
- source_word: πήξας τὸν οὐρανόν
  choice: आकाश को स्थिर किया
  rationale: πήγνυμι का भाव गाड़ने, दृढ़ करने या स्थिर करने का है; ‘स्थिर किया’ प्राचीन ब्रह्मांड-वर्णन को अनावश्यक रूप से आधुनिक बनाए बिना स्पष्ट करता है।
- source_word: προνοίᾳ
  choice: दूरदर्शिता
  rationale: πρόνοια में पूर्वचिंता, देखभाल और providence का विस्तार है; ‘दूरदर्शिता’ मूल का योजनापूर्ण पूर्वविचार व्यक्त करती है, बिना बाद की व्यवस्थित धर्मशास्त्रीय शब्दावली थोपे।
- source_word: μεθίστησιν
  choice: उनके स्थान से हटा रहा है
  rationale: क्रिया स्थानांतरित करने या जगह से हटाने का संकेत देती है; वर्तमानकालीन और सक्रिय चित्र सुरक्षित रखा गया।
- source_word: ὁμαλά
  choice: समतल
  rationale: स्थलाकृतिक बिंब को सीधे रखा गया; अर्थ यह है कि चुने हुओं के मार्ग की बाधाएँ दूर होती हैं।
- source_word: τοῖς ἐκλεκτοῖς αὐτοῦ
  choice: उसके चुने हुओं
  rationale: ἐκλεκτοί के चुनाव-संबंधी अर्थ को सुरक्षित रखा गया और किसी विशेष संप्रदायगत व्याख्या से नहीं जोड़ा गया।
- source_word: τὰ νόμιμα
  choice: विधान
  rationale: νόμιμα स्थापित दैवी नियमों या विधियों को दर्शाता है; ‘विधान’ गरिमापूर्ण और व्यापक है।
theological_decisions:
- issue: पवित्र कलीसिया की ‘सृष्टि’
  choice: अपनी पवित्र कलीसिया की सृष्टि की
  alternative: अपनी पवित्र कलीसिया को बनाया/स्थापित किया
  rationale: मूल में κτίσας वही सृष्टि-संबंधी क्रिया है जो पहले संसार के लिए आई है। इसकी धर्मवैचारिक असहजता को हल्का करने के बजाय मूल की पुनरावृत्ति और तनाव बनाए रखा गया।
- issue: प्रतिज्ञा का सशर्त प्रदान किया जाना
  choice: यदि वे ... विधानों का पालन करें
  alternative: क्योंकि वे ... विधानों का पालन करते हैं
  rationale: ἐὰν τηρήσωσιν स्पष्ट शर्त रखता है। अनुग्रह और आज्ञापालन के संबंध को किसी सिद्धांत-विशेष के अनुसार पुनर्व्याख्यायित नहीं किया गया।
- issue: ‘प्रतिज्ञा देना’ की पुनरुक्ति
  choice: वह प्रतिज्ञा पूरी करके दे, जो उसने उनसे की थी
  alternative: वह प्रतिज्ञा उन्हें दे, जिसकी उसने प्रतिज्ञा की थी
  rationale: ἀποδῷ और ἐπηγγείλατο की पुनरुक्ति हिन्दी में अक्षरशः बोझिल होती; ‘पूरी करके दे’ प्रतिज्ञा के फल को सौंपने और पूर्व-वचन दोनों को व्यक्त करता है।
- issue: ‘बड़ी महिमा और आनंद के साथ’ का संबंध
  choice: प्रतिज्ञा पूरी करके देने से जोड़ा
  alternative: पहले प्रतिज्ञा करने से जोड़ा
  rationale: यूनानी वाक्य-विन्यास में यह वाक्यांश निकटतः ἐπηγγείλατο से भी जुड़ सकता है, पर अर्थ की दृष्टि से प्रतिज्ञा की भावी पूर्ति के साथ इसका संबंध अधिक स्वाभाविक है। अस्पष्टता को अत्यधिक व्याख्यात्मक विस्तार से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, श्रव्य और सामान्य पाठक के लिए सुलभ शैली रखी गई है। लंबे यूनानी आवर्त वाक्य की लय अर्धविरामों से संरक्षित की गई, जबकि मुख्य उद्घोषणा ‘देखो’ की पुनरावृत्ति बनाए रखी गई। ‘कलीसिया’ को आरंभिक मसीही समुदाय के तकनीकी, व्यापक रूप से पहचाने जाने वाले शब्द के रूप में चुना गया।
