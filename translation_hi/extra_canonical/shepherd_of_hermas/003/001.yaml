base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/001.yaml
  text: But it is not for this that God is angry with you, but so that you may turn back your household, which has sinned against the Lord and against us, their parents. Yet, being fond of your children, you did not admonish your household, but you let it be grievously ruined; for this the Lord is angry with you. But he will heal all the past evils in your household; for because of their sins and lawless deeds you yourself were ruined by worldly affairs.
translation:
  language: hi
  text: परन्तु परमेश्वर इस कारण तुमसे क्रोधित नहीं है, बल्कि इसलिए कि तुम अपने घराने को, जिसने प्रभु के विरुद्ध और हमारे विरुद्ध—जो उसके माता-पिता हैं—पाप किया है, लौटा लाओ। किन्तु तुम अपनी सन्तानों से प्रेम रखते हो, इसलिए अपने घराने को नहीं चेताते, बल्कि तुमने उसे बुरी तरह बिगड़ जाने दिया। इसी कारण प्रभु तुमसे क्रोधित है। फिर भी वह तुम्हारे घराने में पहले हो चुकी सभी बुरी बातों को चंगा कर देगा; क्योंकि उनके पापों और अधर्म के कामों के कारण तुम स्वयं सांसारिक काम-काज से नष्ट हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν οἶκόν σου
  choice: अपने घराने को
  rationale: यहाँ οἶκος भवन नहीं, हर्मास का परिवार/गृहस्थ समुदाय है; ‘घराना’ इस सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπιστρέψῃς
  choice: फेर लाओ
  rationale: क्रिया का आशय पाप से वापस मोड़ना है; ‘फेर लाओ’ इस प्रेरक भाव को बनाए रखता है, बिना स्पष्टतः ‘मन फिरवाना’ जोड़कर अर्थ सीमित किए।
- source_word: φιλότεκνος
  choice: अपनी सन्तानों से अत्यधिक प्रेम करने के कारण
  rationale: शब्द का मूल अर्थ सन्तान-प्रेमी होना है, पर प्रसंग में ऐसा लाड़ निहित है जिसने अनुशासन रोका; ‘अत्यधिक’ उस प्रसंगगत आलोचना को स्पष्ट करता है।
- source_word: ἐνουθέτεις
  choice: चेतावनी नहीं देते थे
  rationale: νουθετέω में समझाना, सावधान करना और सुधार हेतु चेताना सम्मिलित है; यहाँ ‘चेतावनी देना’ सरल और प्रसंगानुकूल है।
- source_word: καταφθαρῆναι δεινῶς
  choice: बुरी तरह बिगड़ जाने दिया
  rationale: ग्रीक में गंभीर विनाश/भ्रष्टता का भाव है। परिवार के नैतिक पतन के संदर्भ में ‘बिगड़ जाने’ स्वाभाविक है और ‘बुरी तरह’ δεινῶς को व्यक्त करता है।
- source_word: ἰάσεταί
  choice: चंगा कर देगा
  rationale: मूल पाठ उपचार का रूपक रखता है; उसे ‘सुधार देगा’ बनाकर समतल नहीं किया गया।
- source_word: τῶν βιωτικῶν πράξεων
  choice: सांसारिक काम-काज में
  rationale: यह अभिव्यक्ति जीवन-निर्वाह अथवा लौकिक व्यवहारों/कारोबार को सूचित कर सकती है; व्यापक ‘सांसारिक काम-काज’ इस अर्थ-क्षेत्र को खुला रखता है।
theological_decisions:
- issue: परमेश्वर के क्रोध का उद्देश्य
  choice: ‘इसलिए कि ... फेर लाओ’
  alternative: ‘इस बात पर ... कि तुमने नहीं फेरा’
  rationale: ἵνα सामान्यतः उद्देश्य व्यक्त करता है। अनुवाद परमेश्वर के क्रोध को परिवार को वापस लाने के अनुशासनात्मक उद्देश्य से जोड़ता है और वाक्य की कठिन धार्मिक तनावशीलता को बनाए रखता है।
- issue: पूर्व की बुराइयों का उपचार
  choice: ‘सभी बुरी बातों को चंगा कर देगा’
  alternative: ‘सभी पाप क्षमा कर देगा’
  rationale: मूल में θεραπεία-संबंधी ἰάσεται है, क्षमा का स्पष्ट शब्द नहीं; इसलिए उपचार के रूपक को रखा गया है।
- issue: सन्तानों के पाप और हर्मास की सांसारिक बरबादी का संबंध
  choice: प्रत्यक्ष कारण-संबंध को ज्यों का त्यों रखा
  alternative: इसे केवल भावनात्मक कष्ट या दंड के रूप में स्पष्ट करना
  rationale: διὰ ... σὺ κατεφθάρης स्पष्ट कारण-संबंध देता है, पर उसके स्वरूप को नहीं समझाता; अनुवाद कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। ‘परन्तु/किन्तु/फिर भी’ से ग्रीक के विरोधसूचक क्रम को स्पष्ट किया गया है। सम्बोधन के लिए एकवचन आदररहित ‘तुम’ मूल संवाद की निकटता के अनुरूप है। कोई फुटनोट आवश्यक नहीं समझा गया।
