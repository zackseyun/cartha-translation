base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/003.yaml
  text: 'After she had stopped these words, she says to me, “Do you wish to hear me reading?” And I say, “I do, Lady.” She says to me, “Become a hearer, and hear the glories of God.” I heard great and wondrous things which I was not able to remember; for all the words were terrifying—things a human being is not able to bear. So I remembered the last words, for they were beneficial and gentle for us:'
translation:
  language: hi
  text: 'जब उसने ये बातें कहनी बंद कीं, तो वह मुझसे बोली, “क्या तुम मुझे पढ़ते हुए सुनना चाहते हो?” मैंने कहा, “हाँ, स्वामिनी।” उसने मुझसे कहा, “श्रोता बनो और परमेश्वर की महिमाएँ सुनो।” मैंने महान और अद्भुत बातें सुनीं, जिन्हें मैं स्मरण नहीं रख सका; क्योंकि वे सभी वचन इतने भयावह थे कि मनुष्य उन्हें सह नहीं सकता। इसलिए मैंने अंतिम वचन स्मरण रखे, क्योंकि वे हमारे लिए लाभदायक और सौम्य थे:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυρία
  choice: स्वामिनी
  rationale: यह स्त्री संबोधन में आदर और अधिकार दोनों व्यक्त करता है; ‘देवी’ अनावश्यक धार्मिक अर्थ ला सकता था और ‘महोदया’ प्रसंग के लिए अधिक आधुनिक-औपचारिक होता।
- source_word: Γενοῦ ἀκροατὴς
  choice: ध्यान से सुनो
  rationale: शाब्दिक ‘श्रोता बनो’ हिन्दी में अस्वाभाविक है; यह रूप आज्ञा के आशय—एकाग्र होकर सुनने—को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰς δόξας τοῦ Θεοῦ
  choice: परमेश्वर की महिमाओं के विषय में
  rationale: बहुवचन ‘महिमाओं’ को सुरक्षित रखा गया है और ‘के विषय में’ ἀκούω के कर्म-संबंध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔκφρικτα
  choice: भयावह
  rationale: शब्द विस्मय और आतंक उत्पन्न करने वाली बातों को सूचित करता है; ‘भयानक’ की तुलना में ‘भयावह’ गरिमापूर्ण और संदर्भानुकूल है।
- source_word: βαστάσαι
  choice: सह नहीं सकता
  rationale: यहाँ अर्थ शारीरिक रूप से उठाने के बजाय वचनों का भार सहने का है।
- source_word: σύμφορα καὶ ἥμερα
  choice: लाभदायक और सौम्य
  rationale: 'दोनों विशेषणों का भेद बनाए रखा गया है: पहला हितकारी होने को, दूसरा कोमल/अनुकूल स्वरूप को बताता है।'
theological_decisions:
- issue: ‘परमेश्वर की महिमाओं’ का बहुवचन
  choice: बहुवचन बनाए रखा
  alternative: ‘परमेश्वर की महिमा’
  rationale: यूनानी पाठ में δόξας स्पष्टतः बहुवचन है; इसे एक व्यवस्थित धर्मवैज्ञानिक अवधारणा में समेटना स्रोत की अभिव्यक्ति को अनावश्यक रूप से संकुचित करता।
- issue: असह्य वचनों का स्वरूप
  choice: ‘इतने भयावह थे कि मनुष्य उन्हें सह नहीं सकता’
  alternative: ‘मनुष्य उन्हें समझ नहीं सकता’
  rationale: मूल में βαστάσαι ‘सहना/वहन करना’ है, ‘समझना’ नहीं; इसलिए रहस्योद्घाटन के मानसिक या आध्यात्मिक भार की अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। कथन के वर्तमानकालीन वर्णन (‘बोली’, ‘कहा’ के बजाय ग्रीक ऐतिहासिक वर्तमान के अनुरूप मिश्रित रूप) को हिन्दी में प्रवाह हेतु स्वाभाविक भूतकाल में प्रस्तुत किया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, अतः मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
