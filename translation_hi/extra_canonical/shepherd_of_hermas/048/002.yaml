  text: '‘How so, sir?’ I say. ‘Make it known to me.’ ‘Listen,’ he says: ‘The rich man has much money, but toward the Lord he is poor, being distracted about his wealth, and he has very little confession and intercession toward the Lord; and what he has is small and feeble, and has no power to go up above. When, therefore, the rich man goes to the needy and supplies him with what is necessary, believing that what he does for the needy he will be able to find as his reward from God—for the needy is rich in intercession [and in confession], and his intercession has great power with God—the rich man supplies the needy with everything without hesitation. And the needy, being supplied by the rich, intercedes for him, giving thanks to God on behalf of the one who gives to him. And that one is still more eager concerning the needy, so that he may be unceasing in his life; for he knows that the intercession of the needy is acceptable and rich before God. Therefore both complete the work: the needy
    performs the intercession in which he is rich, [which he received from the Lord;] this he renders to the Lord for the one who supplies him. And likewise the rich man without hesitation provides to the needy the wealth which he received from the Lord. And this is a great work and acceptable with God, because he understood concerning his wealth and worked for the needy out of the gifts of the Lord and fulfilled the Lord’s ministry rightly. Therefore, among people the elm seems not to bear fruit; and they do not know nor understand that, if there should be a drought, the elm, having water, nourishes the vine, and the vine, having unceasing water, gives double fruit, both for itself and for the elm. In the same way also the needy, interceding with the Lord on behalf of the rich...'
translation:
  language: hi
  text: '“कैसे, स्वामी?” मैंने कहा। “मुझे समझाइए।”


    उसने कहा, “सुनो। धनी मनुष्य के पास बहुत धन होता है, पर वह प्रभु के प्रति निर्धन है, क्योंकि वह अपने धन की चिंताओं में उलझा रहता है। प्रभु के सामने उसकी स्वीकारोक्ति और विनती बहुत थोड़ी होती है; और जितनी होती भी है, वह थोड़ी और निर्बल होती है और उसमें ऊपर पहुँचने की शक्ति नहीं होती। इसलिए जब धनी मनुष्य किसी दरिद्र के पास जाकर उसकी आवश्यकताएँ पूरी करता है, तो वह विश्वास करता है कि दरिद्र के लिए जो कुछ वह करेगा, उसका प्रतिफल वह परमेश्वर के यहाँ पाएगा। क्योंकि दरिद्र विनती [और स्वीकारोक्ति][a] में धनी है, और उसकी विनती परमेश्वर के सामने बड़ी सामर्थी है। इसलिए धनी मनुष्य बिना हिचकिचाए दरिद्र को सब कुछ देता है।


    और धनी से सहायता पाने वाला दरिद्र उसके लिए विनती करता है और उसे देने वाले के लिए परमेश्वर को धन्यवाद देता है। उधर धनी उस दरिद्र की और भी अधिक चिंता करता है, ताकि वह अपने जीवन में निरंतर बना रहे; क्योंकि वह जानता है कि दरिद्र की विनती परमेश्वर के सामने ग्रहणयोग्य और समृद्ध है।


    इस प्रकार दोनों मिलकर वह कार्य पूरा करते हैं। दरिद्र उस विनती का कार्य करता है जिसमें वह धनी है—[जो उसने प्रभु से पाई है][b]—और अपने सहायक के लिए उसे प्रभु को अर्पित करता है। इसी प्रकार धनी भी प्रभु से पाया हुआ धन बिना हिचकिचाए दरिद्र को देता है। यह परमेश्वर के सामने महान और ग्रहणयोग्य कार्य है, क्योंकि उसने अपने धन के विषय में समझ रखी, प्रभु की दी हुई वस्तुओं से दरिद्र की भलाई की और प्रभु की सेवा ठीक रीति से पूरी की।


    इसलिए लोगों को ऐसा लगता है कि एल्म वृक्ष[c] फल नहीं देता। वे न तो जानते हैं, न समझते हैं कि जब सूखा पड़ता है, तब एल्म के पास जल होता है और वह अंगूर की बेल को पोषित करता है; और बेल निरंतर जल पाकर दुगुना फल देती है—अपने लिए भी और एल्म के लिए भी। इसी प्रकार दरिद्र भी धनियों के लिए प्रभु से विनती करते हुए…”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-साक्ष्यों में “और स्वीकारोक्ति” शब्द नहीं हैं।
    reason: कोष्ठकयुक्त स्रोत-पाठ का वास्तविक पाठांतर दिखाना आवश्यक है।
  - marker: b
    text: कुछ प्राचीन पाठ-साक्ष्यों में “जो उसने प्रभु से पाई है” वाक्यांश नहीं है।
    reason: कोष्ठकयुक्त स्रोत-पाठ का वास्तविक पाठांतर दिखाना आवश्यक है।
  - marker: c
    text: एल्म एक बड़ा छायादार वृक्ष है। इस दृष्टांत में एल्म, जल होने के कारण, अंगूर की बेल को पोषित करता है, जबकि बेल फल देती है।
    reason: भारतीय सामान्य पाठक के लिए वृक्ष की पहचान और दृष्टांत की छवि स्पष्ट करना उपयोगी है, बिना स्रोत से परे विवरण जोड़े।
lexical_decisions:
- source_word: κύριε
  choice: स्वामी
  rationale: संवाद में सम्मानसूचक संबोधन है; यहाँ वक्ता उस व्यक्ति को संबोधित कर रहा है, सीधे परमेश्वर को नहीं।
- source_word: πτωχός / πένης
  choice: दरिद्र
  rationale: आर्थिक अभावग्रस्त व्यक्ति का dignified और स्पष्ट आधुनिक हिंदी रूप; ‘भिखारी’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: ἐξομολόγησις
  choice: स्वीकारोक्ति
  rationale: शब्द स्वीकार करने, अंगीकार करने या स्तुति की ओर संकेत कर सकता है; ‘स्वीकारोक्ति’ मूल की व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: ἔντευξις
  choice: विनती
  rationale: परमेश्वर के समक्ष निवेदन, विशेषकर दूसरे के लिए प्रार्थना, इस प्रसंग में प्रमुख है।
- source_word: ἐπιχορηγέω / χορηγέω
  choice: आवश्यकताएँ पूरी करना / सहायता देना
  rationale: सिर्फ एक बार का दान नहीं, बल्कि आवश्यक संसाधनों की उदार और सतत आपूर्ति का भाव व्यक्त करता है।
- source_word: μισθός
  choice: प्रतिफल
  rationale: ईश्वर से मिलने वाले परिणाम या पुरस्कार का सामान्य धार्मिक अर्थ, बिना उसकी प्रकृति को अधिक निश्चित किए।
- source_word: διακονία
  choice: सेवा
  rationale: सामान्य पाठक के लिए सहज और प्रसंगानुकूल; इसे किसी संस्थागत पद के रूप में सीमित नहीं किया गया।
- source_word: πτελέα
  choice: एल्म वृक्ष
  rationale: वनस्पति की पहचान को लिप्यंतरित नाम से रखा गया और फुटनोट में स्पष्ट किया गया।
- source_word: ἀδιάλειπτος γένηται ἐν τῇ ζωῇ αὐτοῦ
  choice: उसके जीवन में कोई कमी न रहे
  rationale: कठिन यूनानी वाक्यांश का प्रसंगानुकूल अर्थ यह है कि सहायता के द्वारा दरिद्र का जीवन/जीविका बनी रहे; मूल की कुछ अस्पष्टता स्वीकार की गई है।
theological_decisions:
- issue: दरिद्र की प्रार्थना और धनी के प्रतिफल का संबंध
  choice: पाठ के पारस्परिक सहयोग और परमेश्वर के यहाँ प्रतिफल पाने के विश्वास को यथावत रखा गया
  alternative: इसे केवल मानवीय कृतज्ञता या स्वतः उद्धार दिलाने वाली योग्यता के रूप में समझाना
  rationale: मूल पाठ न तो इस संबंध को मात्र सामाजिक कृतज्ञता बनाता है, न किसी व्यवस्थित उद्धार-सिद्धांत का स्पष्ट प्रतिपादन करता है।
- issue: ἐξομολόγησις का धार्मिक अर्थ
  choice: ‘स्वीकारोक्ति’
  alternative: ‘पाप-स्वीकार’ या ‘स्तुति’
  rationale: यूनानी शब्द दोनों दिशाओं में अर्थ दे सकता है; किसी एक संप्रदायगत या संकीर्ण अर्थ को थोपने से बचा गया।
- issue: प्रार्थना की ‘ऊपर पहुँचने की शक्ति’
  choice: मूल की स्थानिक और सामर्थ्य-संबंधी भाषा संरक्षित की गई
  alternative: इसे ‘परमेश्वर नहीं सुनता’ के रूप में सपाट करना
  rationale: मूल धनी की विनती को छोटी, निर्बल और ऊपर न पहुँचने वाली कहता है; सुनवाई के विषय में अधिक निर्णायक कथन नहीं जोड़ना चाहिए।
- issue: धनी और दरिद्र दोनों द्वारा एक कार्य पूरा करना
  choice: पारस्परिक सेवा को संयुक्त कार्य के रूप में रखा गया
  alternative: एक पक्ष को आध्यात्मिक रूप से श्रेष्ठ या दूसरे को केवल साधन बताना
  rationale: दृष्टांत दोनों के प्रभु से पाए दानों और दोनों के योगदान पर बल देता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संवाद को स्वाभाविक रखा गया है। ‘प्रभु’ और ‘परमेश्वर’ का प्रयोग स्रोत के Κύριος और Θεός के अनुरूप किया गया है। अंश स्रोत की तरह अपूर्ण वाक्य पर समाप्त होता है, इसलिए अंत में दीर्घविराम रखा गया है।
