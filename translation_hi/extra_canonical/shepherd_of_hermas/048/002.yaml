    और धनी से सहायता पाने वाला दरिद्र उसके लिए विनती करता है और उसे देने वाले के लिए परमेश्वर को धन्यवाद देता है। उधर धनी उस दरिद्र की और भी अधिक देखभाल करता है, ताकि उसके जीवन में कोई कमी न रहे; क्योंकि वह जानता है कि दरिद्र की विनती परमेश्वर के सामने ग्रहणयोग्य और समृद्ध है।


    इस प्रकार दोनों मिलकर वह कार्य पूरा करते हैं। दरिद्र उस विनती का कार्य करता है जिसमें वह धनी है—[जो उसने प्रभु से पाई है][b]—और अपने सहायक के लिए उसे प्रभु को अर्पित करता है। इसी प्रकार धनी भी प्रभु से पाया हुआ धन बिना हिचकिचाए दरिद्र को देता है। यह परमेश्वर के सामने महान और ग्रहणयोग्य कार्य है, क्योंकि उसने अपने धन का सही अर्थ समझा, प्रभु की दी हुई वस्तुओं से दरिद्र की भलाई की और प्रभु की सेवा ठीक रीति से पूरी की।


    इसलिए लोगों को ऐसा लगता है कि एल्म वृक्ष[c] फल नहीं देता। वे न तो जानते हैं, न समझते हैं कि जब सूखा पड़ता है, तब एल्म अपने भीतर का जल देकर अंगूर की बेल को पोषित करता है; और बेल निरंतर जल पाकर दुगुना फल देती है—अपने लिए भी और एल्म के लिए भी। इसी प्रकार दरिद्र भी धनियों के लिए प्रभु से विनती करते हुए…”'
