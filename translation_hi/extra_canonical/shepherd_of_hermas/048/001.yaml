base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/048/001.yaml
  text: For to this end the Master has made you rich, that you might carry out these ministries for him; it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it. This luxury is good and cheerful, having no grief nor fear, but having joy. So do not practice the luxury of the nations; for it is unprofitable for you, the servants of God. Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable. But the luxury of the nations is bitter and harsh. This parable, then, is set before the servants of God, for the poor and the rich.
translation:
  language: hi
  text: क्योंकि स्वामी ने तुम्हें इसी उद्देश्य से धनी बनाया है कि तुम उसके लिए ये सेवाकार्य पूरे करो। ऐसे खेत, [और संपत्तियाँ][a] और घर मोल लेना कहीं अधिक अच्छा है—वे तुम्हें अपने नगर में तब मिलेंगे, जब तुम वहाँ पहुँचोगे। यह विलास अच्छा और आनंदमय है; इसमें न दुःख है, न भय, बल्कि आनंद है। इसलिए अन्यजातियों जैसा विलास मत अपनाओ, क्योंकि परमेश्वर के सेवकों के रूप में वह तुम्हारे लिए लाभदायक नहीं है। इसके बजाय अपना वह विलास अपनाओ, जिसमें तुम आनंदित हो सकते हो, क्योंकि इस प्रकार का हर विलास लाभदायक है। पर अन्यजातियों का विलास कड़वा और कठोर है। अतः यह दृष्टान्त परमेश्वर के सेवकों—निर्धन और धनी दोनों—के लिए प्रस्तुत किया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘और संपत्तियाँ’ शब्द कुछ पाठ-साक्ष्यों में कोष्ठकबद्ध हैं और संभवतः मूल पाठ का भाग नहीं हैं।
    reason: स्रोत संस्करण में καὶ κτήματα संपादकीय कोष्ठकों में है; पाठगत अनिश्चितता पाठक के सामने रखना आवश्यक है।
lexical_decisions:
- source_word: δεσπότης
  choice: स्वामी
  rationale: यह शब्द अधिकार और स्वामित्व दोनों व्यक्त करता है; ‘प्रभु’ संभव है, पर यहाँ ‘स्वामी’ मूल की विशिष्ट शब्दावली बनाए रखता है।
- source_word: διακονίας
  choice: सेवाकार्य
  rationale: सिर्फ पद या संस्थागत ‘सेवकाई’ नहीं, बल्कि सौंपे गए सेवा के कार्य अभिप्रेत हैं।
- source_word: πολυτέλεια
  choice: विलास
  rationale: मूल एक ही शब्द को अच्छे और अन्यजातीय—दोनों प्रकार के विलास के लिए प्रयोग करता है; इसी नैतिक तनाव को एकसमान शब्द से सुरक्षित रखा गया है।
- source_word: ἐπιδημήσῃς
  choice: वहाँ पहुँचोगे
  rationale: शाब्दिक अर्थ किसी स्थान पर आने या निवास करने का है; सहज हिन्दी में गंतव्य तक पहुँचने का भाव रखा गया है, बिना ‘नगर’ की पहचान निश्चित किए।
- source_word: ἔθνη
  choice: अन्यजातियाँ
  rationale: यह धार्मिक-सामुदायिक संदर्भ में परमेश्वर के लोगों से बाहर की जातियों को सूचित करता है; ‘राष्ट्र’ यहाँ कम उपयुक्त होता।
- source_word: δούλοι τοῦ Θεοῦ
  choice: परमेश्वर के सेवक
  rationale: ‘दास’ अधिक शाब्दिक है, लेकिन आधुनिक हिन्दी में ‘सेवक’ समर्पण और अधीनता का अर्थ स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: ‘अपने नगर’ की पहचान
  choice: अपने नगर
  alternative: स्वर्गीय नगर / आने वाला नगर
  rationale: मूल τῇ πόλει σου नगर को पाठक का नगर कहता है, पर उसे स्पष्ट रूप से स्वर्गीय नहीं कहता; अनुवाद उस सांकेतिक और परलोक-संबंधी संभाव्यता को खुला रखता है।
- issue: धन और अच्छे ‘विलास’ का संबंध
  choice: मूल की विरोधाभासी भाषा को बनाए रखा गया
  alternative: ‘उदारता’ या ‘परोपकार’ कहकर अर्थ स्पष्ट करना
  rationale: लेखक πολυτέλεια को नया नैतिक अर्थ देता है। इसे ‘परोपकार’ बना देना मूल के अलंकार और तनाव को समय से पहले सुलझा देता।
- issue: निर्धन और धनी दोनों को संबोधन
  choice: दोनों वर्गों को समान रूप से दृष्टान्त के श्रोता रखा गया
  alternative: केवल धनियों के लिए शिक्षा के रूप में प्रस्तुत करना
  rationale: मूल स्पष्टतः εἰς πτωχὸν καὶ πλούσιον कहता है; इसलिए शिक्षा को केवल धनी की जिम्मेदारी तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मुख्य रूपक को बचाने के लिए ‘विलास’ शब्द बार-बार समान रूप में रखा गया है। वाक्य-विन्यास को हिन्दी के अनुरूप बनाया गया है, पर नगर, धन और प्रतिफल से जुड़ी सांकेतिक अस्पष्टता का विस्तार या सांप्रदायिक अर्थ-निर्धारण नहीं किया गया।
