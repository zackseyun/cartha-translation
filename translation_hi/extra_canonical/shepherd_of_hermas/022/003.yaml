base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/003.yaml
  text: So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give repentance to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.
translation:
  language: hi
  text: इसलिए, अकेले चलते हुए, मैं प्रभु से विनती कर रहा था कि वह उन प्रकटीकरणों और दर्शनों को पूरा करे जो उसने अपनी पवित्र कलीसिया के द्वारा मुझे दिखाए थे, ताकि वह मुझे दृढ़ करे और अपने उन सेवकों को पश्चाताप प्रदान करे जो ठोकर खा चुके हैं, जिससे उसके महान और महिमामय नाम की महिमा हो, क्योंकि उसने मुझे अपने अद्भुत काम दिखाने के योग्य समझा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιῶ
  choice: विनती कर रहा था
  rationale: यहाँ क्रिया प्रार्थनापूर्वक आग्रह करने का भाव रखती है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: τελειώσῃ
  choice: पूरा करे
  rationale: मूल में इन प्रकाशनों और दर्शनों को पूर्णता तक पहुँचाने का विचार है; अनावश्यक व्याख्या जोड़े बिना ‘पूरा करे’ इसे सुरक्षित रखता है।
- source_word: διὰ τῆς ἁγίας Ἐκκλησίας αὐτοῦ
  choice: अपनी पवित्र कलीसिया के द्वारा
  rationale: διά के माध्यम-सूचक अर्थ और Ἐκκλησία के प्रारम्भिक मसीही सामुदायिक-संस्थागत अर्थ को बनाए रखता है।
- source_word: ἰσχυροποιήσῃ
  choice: सामर्थ्य दे
  rationale: वक्ता को दृढ़ या बलवान बनाने का भाव सरल आधुनिक हिन्दी में व्यक्त होता है।
- source_word: μετάνοιαν
  choice: पश्चाताप का अवसर
  rationale: ‘पश्चाताप दे’ हिन्दी में अस्वाभाविक हो सकता है; यह चयन ईश्वर द्वारा पश्चाताप की संभावना प्रदान करने का भाव व्यक्त करता है, बिना परिणाम को अनिवार्य ठहराए।
- source_word: τοῖς ἐσκανδαλισμένοις
  choice: जो ठोकर खा चुके हैं
  rationale: मूल रूपक को बनाए रखते हुए नैतिक या विश्वासगत विचलन की वास्तविक अस्पष्टता सुरक्षित रहती है।
- source_word: τὰ θαυμάσια αὐτοῦ
  choice: अपने अद्भुत कार्य
  rationale: यह अभिव्यक्ति आश्चर्यजनक ईश्वरीय बातों या कार्यों दोनों की ओर संकेत कर सकती है; हिन्दी में ‘अद्भुत कार्य’ प्रसंगानुकूल और सुबोध है।
theological_decisions:
- issue: पश्चाताप देने में ईश्वर और मनुष्य की भूमिका
  choice: ‘पश्चाताप का अवसर दे’
  alternative: ‘पश्चाताप दे’
  rationale: यह हिन्दी में स्वाभाविक है और मूल कथन की ईश्वर-केंद्रित पहल को बनाए रखते हुए किसी विशिष्ट कृपा-सिद्धान्त को आरोपित नहीं करता।
- issue: पवित्र कलीसिया के द्वारा दर्शन दिखाए जाने का अर्थ
  choice: माध्यम-सूचक वाक्यांश को यथावत रखा
  alternative: कलीसिया को दर्शन देने वाली व्यक्ति-सत्ता मानकर स्पष्ट करना
  rationale: मूल यूनानी में संबंध व्याख्यात्मक रूप से खुला है; अनुवाद इसे चुपचाप किसी एक धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
- issue: ठोकर खाने का स्वरूप
  choice: रूपकात्मक ‘ठोकर खा चुके हैं’
  alternative: ‘पाप में गिर चुके हैं’ या ‘विश्वास से भटक गए हैं’
  rationale: अधिक स्पष्ट विकल्प मूल की व्यापकता को संकुचित कर देते; चुना गया रूप नैतिक, आध्यात्मिक और सामुदायिक आयामों की संभावना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। लंबे यूनानी वाक्य की कारण और उद्देश्य-संबंधी संरचना को स्पष्ट रखा गया है। ‘कलीसिया’ प्रारम्भिक मसीही साहित्य के पारंपरिक अर्थ के लिए चुना गया है। कोई पादटिप्पणी आवश्यक नहीं; अतः मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
