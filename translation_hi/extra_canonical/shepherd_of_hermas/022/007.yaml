base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/007.yaml
  text: 'I began to weep and to ask the Lord that he would deliver me from it. And I remembered the word that I had heard: “Do not be double-minded, Hermas.”'
translation:
  language: hi
  text: 'तब मैं रोने लगा और प्रभु से विनती करने लगा कि वह मुझे उस पशु से छुड़ाए। फिर मुझे वह वचन याद आया जो मैंने सुना था: “हे हेरमास, दुविधा में मत पड़ना।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτᾶν
  choice: विनती करने लगा
  rationale: यहाँ प्रभु से छुटकारे की प्रार्थना का भाव है; सामान्य ‘पूछना’ प्रसंगानुकूल नहीं है।
- source_word: λυτρώσηται
  choice: छुड़ाए
  rationale: क्रिया संकट और पशु के खतरे से मुक्ति को व्यक्त करती है; सरल और स्वाभाविक हिन्दी।
- source_word: ἐξ αὐτοῦ
  choice: उस पशु से
  rationale: यूनानी सर्वनाम का संदर्भ पिछले वाक्य का विशाल पशु है; हिन्दी में संदर्भ स्पष्ट रखने के लिए संज्ञा दोहराई गई।
- source_word: ῥήματος
  choice: वचन
  rationale: यह पहले सुनी गई विशिष्ट उक्ति को सूचित करता है और गरिमापूर्ण धार्मिक गद्य में स्वाभाविक है।
- source_word: διψυχήσεις
  choice: दुविधा में मत पड़ना
  rationale: διψυχέω का अर्थ मन में बँटना, संदेह करना या डगमगाना हो सकता है; यह चयन उस मानसिक अस्थिरता को सहज हिन्दी में रखता है, बिना उसे केवल बौद्धिक संदेह तक सीमित किए।
theological_decisions:
- issue: διψυχέω में संदेह और विभाजित मन के बीच अर्थ-तनाव
  choice: दुविधा में मत पड़ना
  alternative: संदेह मत करना / दो मन का मत होना
  rationale: चयन भय के प्रसंग में विश्वास से डगमगाने और मन के बँटने—दोनों भावों के लिए कुछ गुंजाइश रखता है तथा हिन्दी पाठक के लिए स्वाभाविक है।
- issue: छुटकारे की याचना में कर्ता
  choice: वह मुझे उस पशु से छुड़ाए
  alternative: मुझे उससे छुटकारा मिले
  rationale: यूनानी पाठ स्पष्ट रूप से प्रभु को छुटकारा देने वाले कर्ता के रूप में रखता है; इसे बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। प्रत्यक्ष वचन में संबोधन ‘हे हेरमास’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं।
