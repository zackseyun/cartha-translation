base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/005.yaml
  text: I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to say within myself, “Perhaps cattle are coming and stirring up dust?” For it was about a stadion away from me.
translation:
  language: hi
  text: भाइयो, मैं थोड़ा और आगे बढ़ा, और देखो, मुझे धूल का गुबार मानो आकाश तक उठता दिखाई दिया। मैं मन ही मन कहने लगा, “कहीं पशुओं का झुंड तो नहीं आ रहा और धूल उड़ा रहा है?” क्योंकि वह मुझसे लगभग एक स्टेडियन[a] दूर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक स्टेडियन प्राचीन दूरी की इकाई थी; यहाँ लगभग 185 मीटर।
    reason: आधुनिक पाठक के लिए प्राचीन माप को समझाना, जबकि मूल इकाई को मुख्य पाठ में सुरक्षित रखना।
lexical_decisions:
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: प्रत्यक्ष संबोधन और समुदायगत आत्मीयता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: κονιορτὸν
  choice: धूल का गुबार
  rationale: केवल ‘धूल’ की अपेक्षा उठते हुए घने धूल-समूह का दृश्य अधिक स्पष्ट करता है।
- source_word: κτήνη
  choice: पशुओं का झुंड
  rationale: ग्रीक बहुवचन का आशय घरेलू या बड़े पशुओं से हो सकता है; ‘झुंड’ प्रसंग में धूल उड़ने का कारण स्वाभाविक बनाता है, बिना किसी खास पशु-जाति को निर्धारित किए।
- source_word: στάδιον
  choice: स्टेडियन
  rationale: प्राचीन दूरी की इकाई को आधुनिक माप में अनिश्चित रूप से बदलने के बजाय लिप्यंतरित किया गया है और पादटिप्पणी में अनुमानित दूरी दी गई है।
