translation_notes:
  register: वर्णन को जीवंत, सहज और गरिमापूर्ण रखा गया है। ‘और देखो’ से ग्रीक ἰδοὺ की आकस्मिक दृश्यात्मकता बनी रहती है; वर्तमानकालीन ‘मुझे ... दिखाई दिया’ के माध्यम से मूल के दृष्टि-वर्णन की जीवंतता व्यक्त की गई है।
