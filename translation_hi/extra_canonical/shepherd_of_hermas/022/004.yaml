base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/004.yaml
  text: 'And while I was glorifying and giving thanks to him, something like the sound of a voice answered me: “Do not be double-minded, Hermas.” I began to reason within myself and say, “What do I have to be double-minded about, being so firmly established by the Lord and having seen glorious things?”'
translation:
  language: hi
  text: जब मैं उसकी महिमा कर रहा था और उसे धन्यवाद दे रहा था, तब मानो किसी आवाज़ की ध्वनि ने मुझे उत्तर दिया, “हे हेरमास, दो मन के मत बनो।” तब मैं अपने मन में विचार करने लगा और कहने लगा, “मैं किस बात में दो मन का होऊँ, जबकि प्रभु ने मुझे इतनी दृढ़ नींव पर स्थापित किया है और मैंने गौरवपूर्ण बातें देखी हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζοντός μου
  choice: जब मैं उसकी महिमा कर रहा था
  rationale: ग्रीक कृदंत की समकालिक क्रिया और परमेश्वर की स्तुति करने का भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ὡς ἦχος φωνῆς
  choice: आवाज़ जैसी किसी ध्वनि
  rationale: ὡς की तुलनात्मक और कुछ अनिश्चित अभिव्यक्ति को बनाए रखा गया है; इसे सीधे ‘एक आवाज़’ नहीं बनाया गया।
- source_word: Μὴ διψυχήσεις
  choice: दो मन का न होना
  rationale: διψυχέω का शाब्दिक रूपक—मन का बँटा होना, संदेह या डगमगाहट—सुरक्षित है, बिना किसी एक अर्थ तक सीमित किए।
- source_word: ἐν ἐμαυτῷ ... διαλογίζεσθαι
  choice: अपने मन में विचार करने
  rationale: आंतरिक तर्क-विचार को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: τεθεμελιωμένος ὑπὸ τοῦ Κυρίου
  choice: प्रभु ने मुझे इतनी दृढ़ता से स्थापित किया है
  rationale: नींव डाले जाने के रूपक का आशय सुरक्षित रखते हुए हिन्दी में स्वाभाविक कर्तृवाच्य प्रयोग किया गया है।
- source_word: ἔνδοξα πράγματα
  choice: महिमामय बातें
  rationale: ἔνδοξα की महिमा/वैभव संबंधी भाषा को बनाए रखता है और ‘अद्भुत’ जैसे अधिक व्याख्यात्मक विकल्प से बचता है।
theological_decisions:
- issue: διψυχέω में संदेह, हिचकिचाहट और विभाजित निष्ठा की संभावित अर्थ-सीमा
  choice: दो मन का होना
  alternative: संदेह करना / डगमगाना
  rationale: मूल की अर्थगत व्यापकता और नैतिक-आध्यात्मिक तनाव को सुरक्षित रखने के लिए परिचित बाइबिलीय रूपक चुना गया है।
- issue: ὑπὸ τοῦ Κυρίου में कर्ता
  choice: प्रभु ने मुझे ... स्थापित किया है
  alternative: मैं प्रभु के द्वारा ... स्थापित किया गया हूँ
  rationale: प्रभु की सक्रिय भूमिका स्पष्ट रहती है, जबकि वाक्य आधुनिक हिन्दी में अधिक स्वाभाविक बनता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सहज शैली। प्रत्यक्ष वचन में मूल की आत्म-परीक्षणात्मक लय और ‘दो मन’ की जानबूझकर रखी गई अर्थगत व्यापकता सुरक्षित है।
