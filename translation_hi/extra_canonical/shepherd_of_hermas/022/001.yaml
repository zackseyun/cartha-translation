base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/001.yaml
  text: The vision that I saw, brothers, came twenty days after the former vision; it was as a pattern of the tribulation that is coming.
translation:
  language: hi
  text: भाइयो, मैंने यह दर्शन पहले हुए दर्शन के बीस दिन बाद देखा; यह आने वाले क्लेश के प्रतिरूप के रूप में था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρασις
  choice: दर्शन
  rationale: यह शब्द अलौकिक रूप से दिखाई गई दृश्यात्मक अनुभूति को दर्शाता है; हिन्दी धार्मिक साहित्य में ‘दर्शन’ स्वाभाविक और सुस्पष्ट है।
- source_word: τύπος
  choice: प्रतीक
  rationale: यहाँ दर्शन आनेवाले क्लेश को चित्रात्मक और पूर्वसूचक रूप में प्रस्तुत करता है। ‘प्रतीक’ अर्थ को स्पष्ट रखता है, बिना यह निर्धारित किए कि वह केवल रूपक था या सटीक भविष्य-प्रतिरूप।
- source_word: θλῖψις
  choice: क्लेश
  rationale: यह दबाव, संकट और दुःख की व्यापक धारणा को बनाए रखता है तथा आधुनिक हिन्दी धार्मिक गद्य में समझा जाता है।
- source_word: ἐπερχομένη
  choice: आनेवाले
  rationale: वर्तमान कृदंत भावी संकट के निकट आने या घटित होने की ओर संकेत करता है; ‘आनेवाले’ इस कालगत बल को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दर्शन और आनेवाले क्लेश के बीच संबंध
  choice: ‘एक प्रतीक था’
  alternative: ‘एक प्रतिरूप था’ / ‘आनेवाले क्लेश का नमूना था’
  rationale: τύπος को ‘प्रतीक’ कहना दर्शन के पूर्वसूचक संबंध को व्यक्त करता है, पर किसी विशिष्ट अंतकालीन या संप्रदायगत व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। यूनानी वाक्य की अग्रस्थापित संबंधवाचक संरचना को स्वाभाविक हिन्दी के दो वाक्यों में व्यक्त किया गया है। ‘भाइयो’ संबोधन की आत्मीयता बनाए रखता है।
