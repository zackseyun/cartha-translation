revisions:
- from: इसलिए, भाइयो, प्रभु का विश्वास धारण करके और उन महान बातों को स्मरण करके जो उसने मुझे सिखाई थीं, मैंने साहस बाँधा और अपने आपको उस पशु के सामने कर दिया। वह पशु ऐसी गर्जना के साथ आ रहा था कि वह एक नगर को उजाड़ सकता था।
  to: इसलिए, भाइयो, प्रभु का विश्वास धारण करके और उन महान बातों को स्मरण करके जो उसने मुझे सिखाई थीं, मैंने साहस बाँधा और अपने आपको उस पशु के सामने प्रस्तुत कर दिया। वह पशु इतने प्रचंड शोर के साथ आ रहा था कि वह एक नगर को उजाड़ सकता था।
  rationale: The revision corrects an awkward expression for Hermas’s courageous self-exposure to the beast and avoids over-specifying the beast’s sound. It otherwise preserves the draft’s rendering of the Lord-genitive as phrased, the instructional sense of ἐδίδαξέν, and the potential ‘could destroy’ force.
