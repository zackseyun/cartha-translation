base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/008.yaml
  text: So then, brothers, having put on the faith of the Lord and having remembered the mighty deeds that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming with such a roar that it could destroy a city.
translation:
  language: hi
  text: इसलिए, भाइयो, प्रभु का विश्वास धारण करके और उन महान बातों को स्मरण करके जो उसने मुझे सिखाई थीं, मैंने साहस बाँधा और अपने आपको उस पशु के सामने प्रस्तुत कर दिया। वह पशु इतने प्रचंड शोर के साथ आ रहा था कि वह एक नगर को उजाड़ सकता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδυσάμενος
  choice: धारण करके
  rationale: मूल का शाब्दिक बिंब ‘पहन लेने’ का है; हिन्दी में विश्वास के साथ ‘धारण करना’ स्वाभाविक और गरिमापूर्ण है तथा उसी रूपक को पर्याप्त रूप से बनाए रखता है।
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: प्रभु का विश्वास
  rationale: ग्रीक संबंधकारक में ‘प्रभु पर विश्वास’ और ‘प्रभु से संबंधित विश्वास’ की कुछ गुंजाइश है; ‘प्रभु का विश्वास’ इस संबंध को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μεγαλείων
  choice: महान बातों
  rationale: यहाँ उन प्रभावशाली या महान बातों का संकेत है जिन्हें प्रभु ने उसे सिखाया था; ‘महान कार्यों’ कहने से कर्मों का अर्थ अनावश्यक रूप से आरोपित होता।
- source_word: θαρσήσας
  choice: मैंने साहस बाँधा
  rationale: यह क्रिया भय के बीच हिम्मत पाने या साहसी होने को व्यक्त करती है; यह हिन्दी मुहावरा प्रसंग के अनुकूल है।
- source_word: εἰς τὸ θηρίον ἐμαυτὸν ἔδωκα
  choice: अपने आपको उस पशु के सामने कर दिया
  rationale: शाब्दिक अर्थ ‘अपने आपको पशु की ओर/के हवाले कर दिया’ है। ‘सामने कर दिया’ भय का सामना करने का भाव देता है, बिना यह कहे कि उसने स्वयं को पशु के वश में सौंप दिया।
- source_word: ῥοίζῳ
  choice: गर्जना
  rationale: शब्द तीव्र सनसनाहट, गड़गड़ाहट या प्रचंड ध्वनि सूचित कर सकता है; विशाल पशु के प्रसंग में ‘गर्जना’ स्वाभाविक है, यद्यपि ध्वनि की प्रकृति पूर्णतः निश्चित नहीं है।
- source_word: λυμᾶναι
  choice: उजाड़ सकता था
  rationale: क्रिया का अर्थ नष्ट करना, बरबाद करना या भारी क्षति पहुँचाना है; ‘उजाड़ना’ नगर के संदर्भ में सशक्त और स्वाभाविक है।
theological_decisions:
- issue: ‘प्रभु का विश्वास’ में संबंधकारक का अर्थ
  choice: प्रभु का विश्वास
  alternative: प्रभु पर विश्वास
  rationale: मूल τὴν πίστιν τοῦ Κυρίου संबंध को खुला रखता है। अधिक सहज विकल्प ‘प्रभु पर विश्वास’ है, पर वह वस्तुनिष्ठ संबंध को निश्चित कर देता; मुख्य पाठ में मूल की संरचना और संभावित तनाव सुरक्षित रखा गया है।
- issue: μεγαλείων का संदर्भ
  choice: महान बातें जो उसने मुझे सिखाई थीं
  alternative: महान कार्य जो उसने मुझे दिखाए थे
  rationale: ἐδίδαξέν का सामान्य अर्थ ‘सिखाया’ है। संदर्भ में दर्शन और चमत्कारिक बातें हो सकती हैं, फिर भी ‘दिखाया’ या ‘कार्य’ कहना मूल से अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण। ‘भाइयो’ प्रत्यक्ष संबोधन को बनाए रखता है। वाक्य-रचना को हिन्दी में स्वाभाविक किया गया है, जबकि विश्वास धारण करने और पशु का सामना करने के मूल बिंब सुरक्षित हैं।
