  text: 'The beast had four colors on its head: black, then fiery and blood-red, then golden, then white.'
translation:
  language: hi
  text: 'उस पशु के सिर पर चार रंग थे: काला, फिर आग जैसा और रक्त जैसा, फिर सुनहरा, और फिर सफेद।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: पशु
  rationale: दर्शन में आए भयावह प्राणी के लिए सहज और गरिमापूर्ण शब्द; निकटवर्ती κῆτος के बावजूद यहाँ सामान्य संज्ञा θηρίον ही है।
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: आग जैसा और रक्त जैसा
  rationale: दोनों समन्वित विशेषणों की अलग-अलग छवियाँ सुरक्षित रखता है; इन्हें एक संयुक्त रंग ‘अग्निमय रक्त-लाल’ में नहीं मिलाता।
- source_word: χρυσοῦν
  choice: सुनहरा
  rationale: रंग-सूची के प्रसंग में स्वाभाविक आधुनिक हिन्दी; ‘सोने का’ पदार्थ का अर्थ दे सकता था।
- source_word: λευκόν
  choice: सफेद
  rationale: सामान्य आधुनिक हिन्दी में रंग का स्पष्ट और सहज नाम।
theological_decisions: []
