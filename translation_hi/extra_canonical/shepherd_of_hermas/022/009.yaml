base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/009.yaml
  text: I came near it, and that huge sea monster stretched itself out on the ground and did nothing except thrust out its tongue; it did not move at all until I had passed by it.
translation:
  language: hi
  text: मैं उसके निकट पहुँचा, और वह अत्यंत विशाल दैत्याकार प्राणी भूमि पर फैल गया और अपनी जीभ बाहर निकालने के अतिरिक्त कुछ नहीं किया। जब तक मैं उसे पार कर न गया, तब तक वह बिल्कुल भी नहीं हिला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχομαι ἐγγὺς αὐτοῦ
  choice: मैं उसके पास पहुँचा
  rationale: यूनानी का वर्तमानकालीन कथन दृश्य को सजीव बनाता है; हिंदी में स्वाभाविक आख्यान के लिए पूर्ण भूतकाल चुना गया।
- source_word: τὸ τηλικοῦτο κῆτος
  choice: वह इतना विशाल समुद्री दैत्य
  rationale: κῆτος किसी बहुत बड़े समुद्री जीव या दैत्य को सूचित करता है; संदर्भ के भयावह प्राणी को व्यक्त करते हुए उसकी निश्चित जैविक पहचान नहीं ठहराई गई।
- source_word: ἐκτείνει ἑαυτὸ χαμαί
  choice: भूमि पर लंबा होकर लेट गया
  rationale: शाब्दिक अर्थ ‘अपने आपको भूमि पर फैला दिया’ है; चुना गया वाक्यांश शरीर पसारकर निष्क्रिय पड़े रहने की छवि को सहज हिंदी में रखता है।
- source_word: τὴν γλῶσσαν προέβαλλεν
  choice: अपनी जीभ बाहर निकालने
  rationale: क्रिया का सीधा अर्थ जीभ को आगे या बाहर निकालना है; इसे अनावश्यक व्याख्या के बिना रखा गया।
- source_word: ὅλως οὐκ ἐκινήθη
  choice: तनिक भी नहीं हिला
  rationale: ὅλως पूर्ण निषेध पर बल देता है; ‘तनिक भी’ वही जोर स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: μέχρις ὅτου παρῆλθον αὐτό
  choice: जब तक मैं उसके पास से निकल नहीं गया
  rationale: παρέρχομαι का यहाँ अर्थ प्राणी के पास से सुरक्षित आगे निकल जाना है।
