translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज आख्यान। भयावह प्रतीकात्मकता को बनाए रखा गया है, पर प्राणी की जाति या दर्शन के अर्थ की अतिरिक्त व्याख्या नहीं जोड़ी गई।
