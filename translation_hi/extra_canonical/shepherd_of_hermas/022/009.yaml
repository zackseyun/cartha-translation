review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys Hermas's approach, the creature's prostration, its tongue being thrust out, and its complete immobility until he passed it. However, «κῆτος» is a huge/monstrous creature and need not be specified as marine in this immediate scene; «विशाल दैत्याकार प्राणी» preserves the term's breadth without imposing a habitat.
  naturalness: The draft is generally natural, but «अपनी जीभ बाहर निकालने के सिवा उसने» is syntactically awkward, and «भूमि पर लंबा होकर लेट गया» is somewhat colloquial and less direct than the Greek image of stretching itself on the ground.
  terminology: «दैत्याकार प्राणी» suitably renders the frightening but non-taxonomically defined κῆτος. No theological terminology or footnote anchors are involved.
  issues:
  - severity: medium
    issue: «समुद्री दैत्य» narrows κῆτος to a marine being.
    rationale: Although κῆτος can denote a sea monster, the Greek here functions as a term for an enormous monster/creature in a land-based vision. A broader Hindi rendering better preserves the source's referential latitude.
  - severity: low
    issue: The clause concerning the tongue is awkwardly ordered in Hindi.
    rationale: Reordering it as «अपनी जीभ बाहर निकालने के अतिरिक्त कुछ नहीं किया» is clearer while retaining the exclusive force of οὐδὲν εἰ μὴ.
  revised_text: मैं उसके निकट पहुँचा, और वह अत्यंत विशाल दैत्याकार प्राणी भूमि पर फैल गया और अपनी जीभ बाहर निकालने के अतिरिक्त कुछ नहीं किया। जब तक मैं उसे पार कर न गया, तब तक वह बिल्कुल भी नहीं हिला।
