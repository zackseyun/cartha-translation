base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/006.yaml
  text: As the dust grew greater and greater, I supposed it was something divine. The sun shone out a little, and behold, I see a very great beast, like some sea monster, and from its mouth fiery locusts were coming out. The beast was about a hundred feet in length, and its head was like a jar.
translation:
  language: hi
  text: जब धूल का गुबार बढ़ता ही गया, तो मैंने समझा कि यह कोई दैवी चीज़ है। सूर्य थोड़ी देर के लिए निकल आया, और देखो, मैंने एक अत्यन्त विशाल पशु देखा, मानो कोई समुद्री दैत्य हो; उसके मुँह से अग्निमय टिड्डियाँ निकल रही थीं। वह पशु लगभग सौ फुट लम्बा था, और उसका सिर मिट्टी के घड़े जैसा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘मिट्टी के घड़े जैसा’: यूनानी κέραμος का व्यापक अर्थ पकी मिट्टी की वस्तु है; संदर्भ में इसे प्रायः ‘घड़ा’ समझा जाता है। इसके अन्य संभावित अर्थों में मिट्टी का बर्तन या छत की टाइल शामिल हैं।'
    reason: κέραμος का सटीक आकार या वस्तु निश्चित नहीं है। मुख्य पाठ में संदर्भानुकूल ‘घड़ा’ रखा गया है, और पादटिप्पणी अन्य शाब्दिक संभावनाओं को सुरक्षित करती है।
lexical_decisions:
- source_word: κονιορτοῦ
  choice: धूल का गुबार
  rationale: यह शब्द हवा में उठी हुई धूल के घने बादल या गुबार को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक और दृश्यात्मक है।
- source_word: τι θεῖον
  choice: कोई दैवी घटना
  rationale: यूनानी पद अनिश्चित है और किसी दैवी वस्तु, संकेत या घटना का बोध करा सकता है; ‘घटना’ प्रसंगानुकूल है, जबकि ‘कोई’ मूल की अनिश्चितता बनाए रखता है।
- source_word: θηρίον μέγιστον
  choice: अत्यन्त विशाल पशु
  rationale: θηρίον किसी जंगली या भयावह जीव को दर्शाता है; ‘पशु’ आगे बार-बार आने वाले इसी पद के लिए स्पष्ट और संगत है।
- source_word: ὡσεὶ κῆτός τι
  choice: मानो कोई समुद्री दैत्य हो
  rationale: κῆτος विशाल समुद्री जीव या समुद्री दैत्य के लिए प्रयुक्त हो सकता है; तुलना और अनिश्चितता को ‘मानो कोई’ से सुरक्षित रखा गया है।
- source_word: ἀκρίδες πύριναι
  choice: आग जैसी टिड्डियाँ
  rationale: πύριναι का अर्थ आग से बनी, अग्निमय या आग जैसी हो सकता है; ‘आग जैसी’ दृश्यात्मक अर्थ को रखते हुए पदार्थगत दावा नहीं करती।
- source_word: ποδῶν ἑκατόν
  choice: सौ फुट
  rationale: मूल में ‘सौ पाँव’ की प्राचीन माप है; हिन्दी पाठक के लिए ‘फुट’ उसी निकट माप-इकाई को सरलता से व्यक्त करता है।
- source_word: κεράμου
  choice: मिट्टी की बड़ी पटिया
  rationale: κέραμος पकी मिट्टी, छत की टाइल या मिट्टी की पटिया को सूचित करता है। अंग्रेज़ी परामर्श-पाठ का ‘jar’ मूल का अपेक्षित अर्थ नहीं है; ‘मिट्टी की बड़ी पटिया’ सिर के आकार की तुलना को अधिक सम्भव रूप से व्यक्त करती है।
theological_decisions:
- issue: τι θεῖον में दैवीता का स्वरूप
  choice: कोई दैवी घटना
  alternative: कोई दैवी वस्तु
  rationale: दृष्टान्त के प्रसंग में कथाकार उठते गुबार को अलौकिक संकेत या घटना समझता है। मूल की अनिश्चितता बनाए रखने के लिए इसे परमेश्वर की प्रत्यक्ष क्रिया या किसी विशिष्ट सत्ता के रूप में नहीं पहचाना गया।
- issue: πύριναι का अर्थ
  choice: आग जैसी
  alternative: अग्निमय
  rationale: मूल विशेषण वास्तविक आग, अग्निसदृश रूप या चमक का संकेत दे सकता है। ‘आग जैसी’ अनावश्यक रूप से यह तय नहीं करता कि टिड्डियाँ सचमुच आग से बनी थीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘और देखो’ से ἰδού की आकस्मिकता तथा प्रथम-पुरुष ‘मुझे ... दिखाई दिया’ से यूनानी के वर्तमानकालीन जीवंत वर्णन को स्वाभाविक हिन्दी में व्यक्त किया गया है। केवल आवश्यक पाठगत-शब्दार्थगत अस्पष्टता पर पादटिप्पणी दी गई है।
