  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। स्थान-संबंधी वाक्य को स्वाभाविक हिन्दी में व्यक्त किया गया है और प्राचीन माप को मूल पाठ में सुरक्षित रखा गया है।
