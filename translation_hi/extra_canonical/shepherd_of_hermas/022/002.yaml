  text: I was going into the countryside by the Campanian road. It is about ten stadia from the public road, and the place is easy to travel.
translation:
  language: hi
  text: मैं कम्पानिया मार्ग से देहात की ओर जा रहा था। वह स्थान सार्वजनिक सड़क से लगभग दस स्टेडिया[a] दूर है, और वहाँ तक आसानी से पहुँचा जा सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक स्टेडियन लगभग 180 मीटर के बराबर था; अतः दस स्टेडिया लगभग 1.8 किलोमीटर होते हैं।
    reason: प्राचीन दूरी की इकाई आधुनिक पाठकों के लिए अपरिचित हो सकती है; मूल इकाई को पाठ में रखते हुए उसका अनुमानित आधुनिक माप दिया गया है।
lexical_decisions:
- source_word: ἀγρός
  choice: देहात
  rationale: यहाँ शब्द किसी विशिष्ट खेत के बजाय नगर से बाहर के ग्रामीण क्षेत्र का संकेत देता है; सहज आधुनिक हिन्दी में ‘देहात’ उपयुक्त है।
- source_word: ὁδὸς ἡ Καμπανή
  choice: कैम्पानिया जाने वाली सड़क
  rationale: विशेषण Καμπανή को केवल अस्पष्ट नाम के रूप में लिप्यंतरित करने के बजाय उसके भौगोलिक संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ὁδὸς ἡ δημοσία
  choice: मुख्य सड़क
  rationale: δημοσία सार्वजनिक राजमार्ग या प्रधान मार्ग को सूचित करता है; ‘मुख्य सड़क’ सामान्य पाठक के लिए स्वाभाविक और प्रसंगानुकूल है।
- source_word: ὁδεύεται ὁ τόπος
  choice: वहाँ तक आसानी से जाया जा सकता है
  rationale: यूनानी निष्प्रयोज्य अभिव्यक्ति का भाव सुबोध हिन्दी में रखा गया है, बिना यह जोड़ने के कि यात्रा पैदल थी या किसी अन्य साधन से।
theological_decisions: []
