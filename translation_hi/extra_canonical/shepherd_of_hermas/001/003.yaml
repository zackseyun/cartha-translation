base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/003.yaml
  text: '"Their souls will repent—those who have no hope, but have despaired of themselves and of their life. But you—pray to God, and he will heal your sins, and those of your whole household, and of all the holy ones."'
translation:
  language: hi
  text: “जिनके पास कोई आशा नहीं है, बल्कि जो अपने आप से और अपने जीवन से निराश हो चुके हैं, उनकी आत्माएँ पश्चाताप करेंगी। पर तुम परमेश्वर से प्रार्थना करो, और वह तुम्हारे, तुम्हारे पूरे घराने के, और सभी पवित्र जनों के पापों को चंगा करेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσουσιν
  choice: पश्चाताप करेंगी
  rationale: भविष्यकाल और मन-परिवर्तन/पश्चाताप के मूल अर्थ को बनाए रखता है; प्रसंग में देर से होने वाले पछतावे की छाया संभव है, पर उसे मुख्य पाठ में निर्णायक रूप से नहीं थोपा गया।
- source_word: ἑαυτοὺς ἀπηγνώκασι καὶ τὴν ζωὴν αὐτῶν
  choice: अपने और अपने जीवन के विषय में सारी आशा छोड़ दी है
  rationale: ἀπαγινώσκω के निराश हो जाने अथवा आशा छोड़ देने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἰάσεται τὰ ἁμαρτήματά
  choice: पापों को ... चंगा करेगा
  rationale: ἰάομαι के स्पष्ट उपचार-रूपक को सुरक्षित रखता है; इसे केवल ‘क्षमा करेगा’ कहना स्रोत की विशिष्ट छवि को मिटा देता।
- source_word: ὅλου τοῦ οἴκου σου
  choice: तुम्हारे पूरे घराने
  rationale: οἶκος यहाँ केवल भवन नहीं, व्यक्ति के समूचे परिवार/गृहस्थ समुदाय को सूचित करता है।
- source_word: πάντων τῶν ἁγίων
  choice: सभी पवित्र जनों
  rationale: ἅγιοι के सामुदायिक अर्थ को साधारण और धर्मशास्त्रीय रूप से तटस्थ हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पापों को ‘चंगा करने’ का अर्थ
  choice: उपचार की मूल रूपकात्मक भाषा को ज्यों का त्यों रखा गया
  alternative: ‘पापों को क्षमा करेगा’
  rationale: यूनानी पाठ क्षमा के सामान्य क्रिया-पद के बजाय ἰάομαι प्रयोग करता है; अनुवाद को उस धर्मवैचारिक छवि का मौन प्रतिस्थापन नहीं करना चाहिए।
- issue: निराश लोगों की आत्माओं का भावी पश्चाताप
  choice: भविष्यकाल ‘पश्चाताप करेंगी’ रखा गया
  alternative: ‘पछताएँगी’ या पश्चाताप को निष्फल/मरणोत्तर घोषित करना
  rationale: अंश समय और परिणाम को स्पष्ट नहीं करता; इसलिए वास्तविक अस्पष्टता तथा तनाव को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली। ‘पर तुम’ से यूनानी ἀλλὰ σύ का बल उभरता है। स्रोत की उपचार-संबंधी असामान्य अभिव्यक्ति को जानबूझकर बनाए रखा गया है।
