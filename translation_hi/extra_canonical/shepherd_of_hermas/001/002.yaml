base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/002.yaml
  text: She laughed and says to me, "Evil desire has risen up into your heart. Or does it not seem to you to be a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his glory is established in the heavens, and he has the Lord readily reconciled in every matter of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves, who exult in their wealth, and who do not hold fast to the good things that are coming.
translation:
  language: hi
  text: वह हँसकर मुझसे कहती है, “तुम्हारे हृदय में दुष्ट अभिलाषा उठी है। या क्या तुम्हें नहीं लगता कि यदि किसी धर्मी मनुष्य के हृदय में दुष्ट अभिलाषा उठे, तो यह बुरी बात है? यह निश्चय ही पाप है—और बड़ा पाप,” वह कहती है। “क्योंकि धर्मी मनुष्य धर्मी बातों का विचार करता है। इसलिए, उसके धर्मी बातों का विचार करने में उसकी महिमा स्वर्गों में स्थिर होती है, और वह अपने हर काम में प्रभु को अपने प्रति सहज ही अनुकूल पाता है। पर जो अपने हृदयों में बुरी बातें सोचते हैं, वे अपने ऊपर मृत्यु और बन्धुआई ले आते हैं—विशेषकर वे जो इस वर्तमान युग को अपने लिए सुरक्षित करते हैं, अपनी धन-सम्पत्ति पर घमण्ड करते हैं और आनेवाली भली वस्तुओं को थामे नहीं रहते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία τῆς πονηρίας / ἡ πονηρὰ ἐπιθυμία
  choice: दुष्ट अभिलाषा
  rationale: यह मन में उठने वाली नैतिक रूप से बुरी लालसा को व्यक्त करता है और पाठ में उसकी पुनरावृत्ति बनाए रखता है।
- source_word: δίκαιος / δίκαια
  choice: धर्मी / धर्म की बातें
  rationale: व्यक्ति की धार्मिकता और उसके न्यायोचित-विचारों के बीच यूनानी शब्द-संबंध को यथासंभव स्पष्ट रखा गया है।
- source_word: κατορθοῦται
  choice: दृढ़ होती है
  rationale: क्रिया के स्थापित, सफल या सुनिश्चित किए जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐκατάλλακτον
  choice: सहज अनुकूल
  rationale: प्रभु के मेल-मिलाप या अनुग्रह के लिए तत्पर होने के भाव को किसी विशिष्ट प्रायश्चित्त-सिद्धान्त में सीमित किए बिना व्यक्त करता है।
- source_word: αἰχμαλωσίαν
  choice: बन्धुआई
  rationale: मूल के कैद या पराधीनता के ठोस भाव को बनाए रखता है।
- source_word: τὸν αἰῶνα τοῦτον περιποιούμενοι
  choice: इस वर्तमान युग को अपना बनाने में लगे हैं
  rationale: वर्तमान युग को प्राप्त करने, सुरक्षित रखने या अपना लाभ बनाने की कुछ असामान्य यूनानी अभिव्यक्ति को अत्यधिक स्पष्ट किए बिना प्रस्तुत करता है।
- source_word: ἀντεχόμενοι
  choice: थामे रहते
  rationale: आनेवाली भली वस्तुओं से दृढ़ता से लगे रहने के रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: हृदय में उठी दुष्ट अभिलाषा को पाप कहना
  choice: 'कथन को बिना नरम किए सीधे रखा गया है: “यह निश्चय ही पाप है—और बड़ा पाप।”'
  alternative: इसे केवल प्रलोभन या पाप की सम्भावना कहना
  rationale: मूल पाठ स्पष्ट रूप से ἁμαρτία और μεγάλη कहता है; अनुवाद को बाद की धार्मिक व्यवस्थाओं के आधार पर इस तनाव को कम नहीं करना चाहिए।
- issue: प्रभु का εὐκατάλλακτον होना
  choice: “प्रभु को अपने प्रति सहज अनुकूल पाता है”
  alternative: “प्रभु को आसानी से मना लेता है” या “प्रभु से तुरन्त मेल करा लेता है”
  rationale: चुना गया रूप परमेश्वर के अनुग्रहपूर्ण अनुकूल भाव को रखता है, पर ऐसा नहीं दर्शाता कि मनुष्य प्रभु को चालाकी या यांत्रिक रीति से मना लेता है।
- issue: धर्मी विचार और स्वर्गीय महिमा का संबंध
  choice: कारणात्मक संरचना को मूल के अनुसार बनाए रखा गया है
  alternative: इसे केवल धर्मी चरित्र के सामान्य परिणाम के रूप में ढीला करना
  rationale: ἐν τῷ ... βουλεύεσθαι पाठ में धर्मी बातें सोचने और महिमा के दृढ़ होने के बीच स्पष्ट संबंध बनाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “धर्मी,” “हृदय,” “वर्तमान युग,” और “आनेवाली भली वस्तुएँ” जैसे पद आरम्भिक मसीही नैतिक-वाणी का स्वर बनाए रखते हैं। प्रत्यक्ष कथन में मूल की पुनरावृत्तियों और विचारगत कठोरता को जानबूझकर सुरक्षित रखा गया है।
