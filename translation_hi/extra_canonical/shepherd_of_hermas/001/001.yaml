base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/001.yaml
  text: '"Did I speak? Did I not always regard you as a goddess? Did I not always respect you as a sister? Why do you falsely accuse me, woman, of these wicked and unclean things?"'
translation:
  language: hi
  text: “क्या मैंने ऐसी बात कही? क्या मैंने सदा तुम्हें देवी के समान नहीं माना? क्या मैंने सदा बहन के समान तुम्हारा आदर नहीं किया? हे स्त्री, तुम मुझ पर इन बुरी और अशुद्ध बातों का झूठा आरोप क्यों लगाती हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησα
  choice: क्या मैंने ऐसी बात कही?
  rationale: क्रिया का शाब्दिक अर्थ ‘मैंने कहा/बोला’ है। प्रसंग में आरोपित अशुद्ध बात की ओर संकेत स्पष्ट करने के लिए ‘ऐसी बात’ स्वाभाविक हिन्दी है, पर कथन की प्रश्नात्मक संक्षिप्तता बनी रहती है।
- source_word: ὡς θεὰν ἡγησάμην
  choice: तुम्हें देवी के समान ... माना
  rationale: ὡς तुलना सूचित करता है; ‘देवी के समान’ मूल की उपमा को बचाता है और उसे वास्तविक उपासना का दावा बनाकर अधिक स्पष्ट नहीं करता।
- source_word: ἐνετράπην
  choice: आदर किया
  rationale: यहाँ क्रिया संकोच, मान और श्रद्धापूर्ण सम्मान का भाव देती है। आधुनिक हिन्दी में ‘आदर किया’ प्रसंगानुकूल और सहज है।
- source_word: καταψεύδῃ
  choice: झूठा आरोप लगाती हो
  rationale: क्रिया किसी के विरुद्ध असत्य कहने या झूठी गवाही देने का अर्थ रखती है; केवल ‘झूठ बोलती हो’ की अपेक्षा यह आरोपात्मक भाव को अधिक ठीक व्यक्त करता है।
- source_word: τὰ πονηρὰ ταῦτα καὶ ἀκάθαρτα
  choice: इन बुरी और अशुद्ध बातों
  rationale: दोनों नैतिक विशेषणों को अलग रखा गया है। नपुंसक बहुवचन का सन्दर्भ आरोपित बातों/कृत्यों से हो सकता है; हिन्दी में ‘बातों’ स्वाभाविक है और अनावश्यक विशिष्टता से बचता है।
- source_word: ὦ γύναι
  choice: हे स्त्री
  rationale: सम्बोधन को औपचारिक और प्रत्यक्ष रूप में रखा गया है। ‘औरत’ अधिक बोलचाल का और कभी-कभी तिरस्कारपूर्ण हो सकता है।
theological_decisions:
- issue: ὡς θεὰν में देवी-संबंधी भाषा
  choice: ‘देवी के समान’
  alternative: ‘देवी समझकर’
  rationale: मूल में ὡς उपमात्मक है। चुना हुआ रूप सम्मान की अतिशयोक्तिपूर्ण तुलना को बनाए रखता है और यह दावा नहीं करता कि वक्ता ने उसे सचमुच देवी माना या पूजा।
- issue: अशुद्धता के आरोप का स्वरूप
  choice: ‘बुरी और अशुद्ध बातों’ को सामान्य रखा
  alternative: ‘बुरे और अशुद्ध कर्मों’
  rationale: ग्रीक नपुंसक बहुवचन आरोपों की विषयवस्तु को खुला रखता है। ‘कर्मों’ कहने से पाठ की अपेक्षा अधिक निश्चित अर्थ आ सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष संवाद। प्रश्नों की पुनरावृत्ति और बढ़ती भावात्मक तीव्रता को बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
