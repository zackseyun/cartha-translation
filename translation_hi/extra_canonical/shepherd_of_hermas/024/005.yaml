  text: Having said these things, she went away, and I did not see to what place she went; for a noise occurred. And I turned around in fear, thinking that the beast was coming.
translation:
  language: hi
  text: ये बातें कहकर वह चली गई, और मैंने नहीं देखा कि वह किस जगह चली गई; क्योंकि एक ध्वनि हुई। तब मैं डरकर पीछे मुड़ा, यह सोचते हुए कि पशु आ रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψόφος
  choice: आहट
  rationale: यह शब्द किसी सुनाई देने वाली ध्वनि या शोर को सूचित करता है। प्रसंग में ऐसी ध्वनि अभिप्रेत है जिससे हेरमास को पशु के आने का भय हुआ; इसलिए स्वाभाविक हिन्दी में ‘आहट’ उपयुक्त है।
- source_word: θηρίον
  choice: पशु
  rationale: दर्शन में पहले वर्णित प्रतीकात्मक beast के लिए ‘पशु’ गरिमापूर्ण और सुसंगत शब्द है; ‘जानवर’ अधिक बोलचाल का होता और ‘हिंस्र पशु’ मूल से अधिक विशिष्ट होता।
- source_word: δοκῶν
  choice: मुझे लगा
  rationale: यह कृदन्त वक्ता की धारणा या आशंका व्यक्त करता है, निश्चित ज्ञान नहीं। ‘मुझे लगा’ इस अनिश्चितता को सहज हिन्दी में बनाए रखता है।
