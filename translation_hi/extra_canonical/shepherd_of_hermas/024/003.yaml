  text: '"But the white portion is the age that is coming, in which the elect of God will dwell; because those chosen by God for eternal life will be spotless and pure.'
translation:
  language: hi
  text: “और सफ़ेद भाग आने वाला युग है, जिसमें परमेश्वर के चुने हुए निवास करेंगे; क्योंकि अनन्त जीवन के लिए परमेश्वर द्वारा चुने गए लोग निष्कलंक और शुद्ध होंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ λευκὸν μέρος
  choice: सफ़ेद भाग
  rationale: रंग और पशु के सिर पर दिखाई देने वाले हिस्से—दोनों को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ αἰὼν ὁ ἐπερχόμενος
  choice: आने वाला युग
  rationale: αἰών के कालगत और युगान्त-संबंधी अर्थ को बनाए रखता है; इसे केवल ‘संसार’ या ‘जीवन’ नहीं बनाता।
- source_word: οἱ ἐκλεκτοὶ τοῦ θεοῦ
  choice: परमेश्वर के चुने हुए
  rationale: ἐκλεκτοί का सहज हिन्दी रूप है और चुनाव की धार्मिक धारणा को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: κατοικήσουσιν
  choice: निवास करेंगे
  rationale: भविष्यकाल और स्थायी रूप से रहने के भाव को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄσπιλοι καὶ καθαροί
  choice: निष्कलंक और शुद्ध
  rationale: 'दोनों विशेषणों का भेद बनाए रखता है: ἄσπιλος दाग या कलंक से रहित, और καθαρός शुद्ध होने का बोध देता है।'
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए
  rationale: εἰς के लक्ष्य अथवा नियति-सूचक अर्थ को खुला रखते हुए मूल वाक्य-रचना के निकट रहता है।
theological_decisions:
- issue: परमेश्वर का चुनाव और अनन्त जीवन
  choice: ‘अनन्त जीवन के लिए परमेश्वर द्वारा चुने गए’
  alternative: ‘जिन्हें परमेश्वर ने अनन्त जीवन पाने के लिए चुना है’
  rationale: मूल के निष्क्रिय कृदन्त ἐκλελεγμένοι और लक्ष्य-सूचक εἰς ζωὴν αἰώνιον को निकटता से रखता है, बिना चुनाव के क्रम, आधार या साधन पर कोई अतिरिक्त सिद्धान्त आरोपित किए।
- issue: चुने हुओं की भावी दशा
  choice: ‘निष्कलंक और शुद्ध होंगे’
  alternative: ‘निष्कलंक और शुद्ध हैं’
  rationale: ἔσονται भविष्यकाल है और आने वाले युग में उनकी दशा का वर्णन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘सफ़ेद’ वर्तमान प्रचलित वर्तनी में, जबकि ‘निवास’, ‘निष्कलंक’ और ‘अनन्त जीवन’ पाठ की धार्मिक तथा दर्शनात्मक गरिमा बनाए रखते हैं।
