base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/004.yaml
  text: '"You, therefore, do not cease speaking in the ears of the holy ones. You also have the pattern of the great tribulation that is coming; but if you are willing, it will be nothing. Remember the things written beforehand."'
translation:
  language: hi
  text: इसलिए तुम पवित्र जनों को बताते रहो। आने वाले महान क्लेश का प्रतिरूप भी तुम्हारे पास है। पर यदि तुम चाहो, तो कुछ भी न होगा।[a] पहले से लिखी हुई बातों को याद रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या संभवतः: “तो वह तुम्हारा कुछ नहीं बिगाड़ेगा।” यूनानी वाक्य संक्षिप्त है और यह स्पष्ट नहीं करता कि «कुछ भी» किस बात को सूचित करता है।'
    reason: «οὐδὲν ἔσται» के अनिर्दिष्ट परिणाम को सुरक्षित रखने और एक संभावित संदर्भगत समझ बताने के लिए।
lexical_decisions:
- source_word: μὴ διαλίπῃς λαλῶν εἰς τὰ ὦτα
  choice: यह बात सुनाते रहो
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘कानों में बोलना बंद न करो’ है; हिन्दी में निरंतर घोषणा करने का भाव स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἅγιοι
  choice: पवित्र जन
  rationale: यहाँ संज्ञा के रूप में प्रयुक्त शब्द विश्वासियों के समुदाय को दर्शाता है; ‘पवित्र जन’ अर्थ को स्पष्ट और गैर-सांप्रदायिक रखता है।
- source_word: τύπος
  choice: नमूना
  rationale: शब्द किसी प्रतिरूप, उदाहरण या पूर्व-संकेत को दर्शा सकता है। संदर्भ में पशु से हुई मुठभेड़ आने वाले क्लेश का नमूना है; ‘नमूना’ इस संबंध को अनावश्यक रूप से निश्चित किए बिना बनाए रखता है।
- source_word: θλίψεως
  choice: क्लेश
  rationale: यह दबाव, संकट और पीड़ा को समेटने वाला पारंपरिक किंतु आज भी बोधगम्य धार्मिक शब्द है।
- source_word: τὰ προγεγραμμένα
  choice: पहले से लिखी हुई बातें
  rationale: यह अनिश्चित रखा गया है कि संकेत इसी पुस्तक में पहले लिखी बातों की ओर है या पूर्ववर्ती लिखित चेतावनियों की ओर।
theological_decisions:
- issue: ἐὰν δὲ ὑμεῖς θελήσητε, οὐδὲν ἔσται का अनिर्दिष्ट परिणाम
  choice: यदि तुम लोग चाहो, तो वह कुछ भी न होगा
  alternative: यदि तुम लोग चाहो, तो वह तुम्हारा कुछ नहीं बिगाड़ेगा
  rationale: यूनानी वाक्य यह नहीं बताता कि ‘कुछ नहीं’ किस अर्थ में होगा। मुख्य पाठ मूल की संक्षिप्तता और तनाव को बनाए रखता है; अधिक व्याख्यात्मक विकल्प को पाठ में नहीं जोड़ा गया।
- issue: एकवचन से बहुवचन में परिवर्तन
  choice: पहले ‘तुम’, फिर ‘तुम्हारे/तुम लोग’
  alternative: पूरे वाक्यांश में केवल एकवचन ‘तुम’
  rationale: मूल में पहले हरमास को एकवचन में आदेश दिया गया है, फिर समुदाय को बहुवचन में संबोधित किया गया है; अनुवाद इस बदलाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘क्लेश’ जैसे स्थापित धार्मिक शब्द को बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक हिन्दी में ढाला गया है।
