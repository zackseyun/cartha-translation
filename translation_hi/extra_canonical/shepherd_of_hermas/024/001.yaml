  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/001.yaml
  text: I asked her about the four colors that the beast had on its head. But she answered me and says, "Again you are curious about such matters." "Yes, my Lady," I say; "make known to me what these things are."
translation:
  language: hi
  text: मैंने उससे उन चार रंगों के विषय में पूछा, जो उस पशु के सिर पर थे। पर उसने मुझे उत्तर दिया, “तुम फिर ऐसी बातों के बारे में कुछ ज़्यादा ही जिज्ञासा दिखा रहे हो।” मैंने कहा, “हाँ, स्वामिनी; मुझे बताइए कि ये क्या हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: पशु
  rationale: दर्शन में दिखाई देने वाले भयानक जीव के लिए सामान्य और गरिमापूर्ण शब्द; ‘जानवर’ की अपेक्षा साहित्यिक संदर्भ में अधिक उपयुक्त।
- source_word: περίεργος
  choice: बहुत पूछताछ कर रहे हो
  rationale: यहाँ शब्द जिज्ञासु होने के साथ ऐसी बातों की टोह लेने का हल्का उलाहना देता है; केवल ‘जिज्ञासु’ कहने से यह भाव कम स्पष्ट होता।
- source_word: κυρία
  choice: स्वामिनी
  rationale: सम्मानसूचक संबोधन और स्त्रीलिंग lord/lady-संबंधी अर्थ को बनाए रखता है, बिना पात्र की पहचान में अतिरिक्त व्याख्या जोड़े।
- source_word: γνώρισόν μοι
  choice: मुझे बताइए
  rationale: शाब्दिक ‘मुझे ज्ञात कराइए’ की अपेक्षा आधुनिक हिन्दी में स्वाभाविक, जबकि प्रकट करने/समझाने का आशय सुरक्षित है।
- source_word: τί ἐστιν ταῦτα
  choice: इनका अर्थ क्या है
  rationale: चार प्रतीकात्मक रंगों के आशय की माँग है; हिन्दी में प्रसंगानुकूल और स्पष्ट अभिव्यक्ति।
theological_decisions:
- issue: स्त्री पात्र के अधिकारपूर्ण संबोधन κυρία का अनुवाद
  choice: स्वामिनी
  alternative: महोदया
  rationale: ‘स्वामिनी’ मूल के अधिकार और आदर दोनों को बनाए रखता है; ‘महोदया’ केवल शिष्टाचार का भाव दे सकता है।
- issue: प्रतीकात्मक रंगों के प्रश्न को अर्थ-संबंधी बनाना
  choice: इनका अर्थ क्या है
  alternative: ये क्या हैं
  rationale: अगले खंड में रंगों की प्रतीकात्मक व्याख्या आती है; फिर भी अनुवाद किसी विशिष्ट धर्मवैज्ञानिक अर्थ को पहले से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। वर्तमानकालीन संवाद (‘कहती है’, ‘कहता हूँ’) को हिन्दी में अस्वाभाविक लगने से बचाने के लिए कथानक और संवाद-परिचय को भूतकाल में रखा गया है।
