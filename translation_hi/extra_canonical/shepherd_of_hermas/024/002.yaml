  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष संबोधन में बहुवचन ‘तुम’ मूल के सामुदायिक संबोधन को व्यक्त करता है। सोने को तपाने, मैल उतारने और मीनार बनाने की परस्पर जुड़ी उपमाएँ यथासंभव समान शब्दावली के साथ सुरक्षित रखी गई हैं।
