base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/002.yaml
  text: 'She says, "Listen: the black is this world, in which you dwell. And the fiery and blood-red is because this world must be destroyed by blood and fire. But the golden portion is you who have escaped this world. For just as gold is tested by fire and becomes useful, so also you are being tested in them. Therefore, those who remain and are burned by it will be purified. Just as gold casts off its dross, so also you will cast off every grief and distress, and you will be purified and will be useful for the building of the tower.'
translation:
  language: hi
  text: वह कहती है, “सुनो। काला रंग यह संसार है, जिसमें तुम रहते हो। अग्नि-जैसा और रक्त-जैसा रंग यह बताता है कि इस संसार का रक्त और आग के द्वारा नाश होना आवश्यक है। और सुनहरा भाग तुम हो, जो इस संसार से बच निकले हो। क्योंकि जैसे सोना आग के द्वारा परखा जाता है और उपयोगी बनता है, वैसे ही तुम भी उनमें रहते हुए परखे जा रहे हो।[a] इसलिए जो टिके रहेंगे और उसके द्वारा दग्ध किए जाएँगे, वे शुद्ध किए जाएँगे। जैसे सोना अपना खोट छोड़ देता है, वैसे ही तुम भी हर शोक और संकट को छोड़ दोगे; तुम शुद्ध किए जाओगे और मीनार के निर्माण के लिए उपयोगी होगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “रहते हुए” शब्दों की पाठ-परंपरा अनिश्चित है। “उनमें” और अगले वाक्य में “उसके द्वारा” किनकी ओर संकेत करते हैं, यह भी स्पष्ट नहीं है।
    reason: कोष्ठक में मिले, पाठगत रूप से अनिश्चित शब्दों तथा सर्वनामों के अस्पष्ट पूर्वपदों को बिना निश्चित व्याख्या थोपे दर्शाना।
