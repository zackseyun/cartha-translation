base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/005.yaml
  text: 5. “And the white and round ones that do not fit into the building—who are they, Lady?” She answered me, saying, “How long will you be foolish and without understanding, asking about everything and understanding nothing? These are those who have faith, but also have the wealth of this age. When affliction comes, because of their wealth and their business dealings they deny their Lord.”
translation:
  language: hi
  text: 5. “और जो सफेद और गोल पत्थर भवन में लगाने योग्य नहीं हैं, वे कौन हैं, हे स्वामिनी?” उसने मुझे उत्तर दिया, “तुम कब तक मूर्ख और नासमझ बने रहोगे—हर बात पूछते हो, फिर भी कुछ नहीं समझते? ये वे लोग हैं जिनमें विश्वास तो है, पर इस युग का धन भी है। जब क्लेश आता है, तो वे अपने धन और व्यापारिक काम-काज के कारण अपने प्रभु का इनकार कर देते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λευκοὶ καὶ στρογγύλοι
  choice: सफेद और गोल पत्थर
  rationale: संदर्भ में ये भवन के लिए जाँचे जा रहे पत्थर हैं; हिंदी में संज्ञा स्पष्ट करने से रूपक सहज समझ आता है।
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: भवन में लगाने योग्य नहीं हैं
  rationale: ἁρμόζω यहाँ निर्माण में ठीक बैठने या जोड़े जाने का भाव रखता है; यह हिंदी वाक्य निर्माण-रूपक को स्वाभाविक रूप से बनाए रखता है।
- source_word: κυρία
  choice: हे स्वामिनी
  rationale: स्त्री संबोधन और सम्मान को सुरक्षित रखते हुए प्राचीन, गरिमापूर्ण प्रसंग के अनुकूल शब्द चुना गया है।
- source_word: πίστιν
  choice: विश्वास
  rationale: सामान्य आरंभिक मसीही धार्मिक अर्थ को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: πλοῦτον τοῦ αἰῶνος τούτου
  choice: इस युग का धन
  rationale: αἰών के युग-संबंधी भाव को बनाए रखा गया है; इसे केवल ‘सांसारिक धन’ कहने से मूल की शब्दावली बदल जाती।
- source_word: θλῖψις
  choice: क्लेश
  rationale: दबाव, संकट और उत्पीड़न की व्यापक संभाव्यता को बनाए रखने वाला प्रचलित धार्मिक हिंदी शब्द है।
- source_word: πραγματείας
  choice: व्यापारिक काम-काज
  rationale: यह व्यापार, कारोबार अथवा व्यावसायिक उलझनों का संकेत दे सकता है; संयुक्त अभिव्यक्ति अर्थ-क्षेत्र को संकुचित नहीं करती।
- source_word: ἀπαρνοῦνται
  choice: इनकार कर देते हैं
  rationale: यह स्पष्ट अस्वीकार या त्याग का भाव देता है और प्रभु से संबंध नकारने की गंभीरता बनाए रखता है।
theological_decisions:
- issue: विश्वास रखने वालों द्वारा प्रभु का इनकार
  choice: ‘जिनमें विश्वास तो है’ और बाद में ‘अपने प्रभु का इनकार कर देते हैं’—दोनों कथनों को साथ रखा गया है।
  alternative: उनके विश्वास को आरंभ से ही झूठा या नाममात्र का बताना।
  rationale: मूल पाठ वास्तविक तनाव प्रस्तुत करता है और इस पद में उनके विश्वास की प्रकृति पर अतिरिक्त निर्णय नहीं देता।
- issue: क्लेश का स्वरूप
  choice: व्यापक शब्द ‘क्लेश’ रखा गया है।
  alternative: विशेष रूप से ‘उत्पीड़न’ या ‘आर्थिक संकट’।
  rationale: θλῖψις का अर्थ संदर्भ में दबाव या उत्पीड़न हो सकता है, पर मूल इसे किसी एक प्रकार तक सीमित नहीं करता।
- issue: धन और व्यापार की नैतिक भूमिका
  choice: उन्हें प्रभु का इनकार करने का कारण बताया गया है, अपने-आप में सर्वथा पाप घोषित नहीं किया गया।
  alternative: धन या व्यापार को intrinsically evil अर्थ में प्रस्तुत करना।
  rationale: पद का आरोप संकट के समय धन और व्यावसायिक हितों के कारण प्रभु को नकारने पर केंद्रित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और प्रत्यक्ष शैली अपनाई गई है। प्रश्नोत्तर का लहजा तथा स्वामिनी की तीखी फटकार सुरक्षित रखी गई है। निर्माण-संदर्भ स्पष्ट करने के लिए ‘पत्थर’ जोड़ा गया है, जो निकटवर्ती यूनानी संदर्भ में निहित है।
