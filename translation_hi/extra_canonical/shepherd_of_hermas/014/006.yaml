base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/006.yaml
  text: 6. And I answered her, “Lady, when then will they become fit for the building?” She said, “When their wealth that ensnares them has been cut away, then they will be useful to God. For just as a round stone, unless it is cut and casts off something from itself, cannot become square, so also those who are rich in this age, unless their wealth is cut away, cannot become useful to the Lord.
translation:
  language: hi
  text: 6. मैंने उसे उत्तर दिया, “स्वामिनी, तो वे निर्माण में उपयोगी कब होंगे?” उसने कहा, “जब उनका वह धन, जो उन्हें मोहित किए रहता है, काटकर दूर कर दिया जाएगा, तब वे परमेश्वर के लिए उपयोगी होंगे। क्योंकि जैसे कोई गोल पत्थर, जब तक उसे काटकर उसका कुछ भाग हटा न दिया जाए, चौकोर नहीं हो सकता, वैसे ही इस युग के धनी लोग भी, जब तक उनका धन काटकर दूर न कर दिया जाए, प्रभु के लिए उपयोगी नहीं हो सकते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυρία
  choice: स्वामिनी
  rationale: स्त्री संबोधन और अधिकार-सम्मान दोनों को बनाए रखता है; प्रसंग में दर्शन देने वाली स्त्री के लिए स्वाभाविक है।
- source_word: εὔχρηστοι εἰς τὴν οἰκοδομήν
  choice: भवन के निर्माण के योग्य
  rationale: पत्थरों और मीनार-निर्माण के रूपक को स्पष्ट रखते हुए उपयोग-योग्यता का भाव देता है।
- source_word: ὁ πλοῦτος ὁ ψυχαγωγῶν αὐτούς
  choice: उनका वह धन, जो उन्हें बहकाता है
  rationale: ψυχαγωγέω यहाँ धन द्वारा मन को मोहित करके भटका देने का नकारात्मक भाव रखता है; केवल ‘मन बहलाता’ कहना प्रसंग की चेतावनी को कमजोर करता।
- source_word: περικοπῇ
  choice: काटकर दूर कर दिया जाएगा
  rationale: पत्थर काटने के विस्तृत रूपक से शाब्दिक संबंध बनाए रखता है और धन के घटाए अथवा हटाए जाने का भाव व्यक्त करता है।
- source_word: τετράγωνος
  choice: चौकोर
  rationale: निर्माण में लगने योग्य काटे गए पत्थर की आकृति का सीधा और सामान्य हिन्दी रूप।
- source_word: εὔχρηστοι τῷ Θεῷ / τῷ Κυρίῳ
  choice: परमेश्वर के काम आएँगे / प्रभु के काम नहीं आ सकते
  rationale: ‘उपयोगी’ के अपेक्षाकृत निर्जीव प्रयोग की जगह स्वाभाविक हिन्दी में वही सेवायोग्यता व्यक्त होती है, साथ ही Θεός और Κύριος का भेद सुरक्षित रहता है।
theological_decisions:
- issue: धन हटाए जाने और परमेश्वर के योग्य होने का संबंध
  choice: मूल के सशर्त कथन को सीधे रखा गया है
  alternative: इसे स्वैच्छिक दान, निर्धनता की अनिवार्यता, या किसी विशेष तपस्वी सिद्धांत के रूप में स्पष्ट करना
  rationale: यूनानी पाठ यह नहीं बताता कि धन किस प्रकार काटा जाता है; इसलिए अनिश्चितता और रूपकात्मक तनाव को बनाए रखना उचित है।
- issue: ‘परमेश्वर के काम आना’ का अर्थ
  choice: सेवा अथवा निर्माण में उपयोग-योग्यता का व्यापक भाव
  alternative: उद्धार प्राप्त करना या कलीसियाई पद के योग्य होना
  rationale: इस पद में εὔχρηστος निर्माण-रूपक के भीतर है और इसे किसी संकीर्ण सिद्धांत से समान ठहराने का आधार नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथन। पत्थर काटने और धन काटे जाने की जानबूझकर की गई पुनरावृत्ति सुरक्षित रखी गई है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
