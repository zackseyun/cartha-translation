base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/002.yaml
  text: '2. “And the others you saw—many lying there, not going into the building—these are the scabby ones: they came to know the truth, but did not remain in it, nor did they join themselves to the saints; therefore they are useless.'
translation:
  language: hi
  text: 2. “और जिन बहुत-से दूसरे पत्थरों को तुमने वहाँ पड़े देखा था, जो भवन में नहीं लगाए जा रहे थे—वे पपड़ीदार पत्थर हैं। उन्होंने सत्य को जान तो लिया, पर उसमें बने नहीं रहे और न पवित्र लोगों से जुड़े। इसलिए वे किसी काम के नहीं हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: पपड़ीदार पत्थर
  rationale: शब्द का अर्थ खुजली या पपड़ी से ग्रस्त होना है। भवन और पत्थरों के रूपक को स्पष्ट रखते हुए ‘पपड़ीदार पत्थर’ मूल बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπιμείναντες
  choice: बने नहीं रहे
  rationale: यह सत्य में टिके रहने या निरंतर बने रहने को व्यक्त करता है।
- source_word: κολλώμενοι
  choice: जुड़े
  rationale: मूल क्रिया का अर्थ चिपकना या घनिष्ठ रूप से जुड़ना है; यहाँ समुदाय के पवित्र लोगों से संबंध का भाव है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र लोगों
  rationale: बहुवचन विशेषण यहाँ व्यक्तियों के लिए संज्ञा की तरह प्रयुक्त है; यह चयन किसी विशिष्ट संस्थागत पदनाम को आरोपित नहीं करता।
- source_word: ἄχρηστοι
  choice: किसी काम के नहीं
  rationale: भवन-निर्माण के संदर्भ में अनुपयोगी होने का सीधा और सामान्य हिन्दी रूप।
theological_decisions:
- issue: ‘पवित्र लोगों’ की पहचान
  choice: सामान्य रूप से ‘पवित्र लोगों’
  alternative: ‘संतों’
  rationale: मूल पाठ समुदाय के पवित्र जनों का उल्लेख करता है, पर उनकी कोई बाद की औपचारिक या विशिष्ट धार्मिक श्रेणी निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी; पत्थरों और भवन के विस्तृत रूपक को स्पष्ट रखा गया है। ‘जान तो लिया’ मूल के सत्य-ज्ञान और उसके बाद न टिकने के विरोध को स्वाभाविक ढंग से उभारता है।
