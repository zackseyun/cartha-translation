base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/001.yaml
  text: “Do you want to know about those who are being cut down and thrown far from the tower? These are the sons of lawlessness; they believed in hypocrisy, and no wickedness departed from them. For this reason they have no salvation, because they are not fit for the building on account of their wicked deeds. Therefore they were cut down and thrown far away because of the anger of the Lord, because they provoked him.
translation:
  language: hi
  text: “क्या तुम उन लोगों के विषय में जानना चाहते हो जिन्हें टुकड़े-टुकड़े किया जा रहा है और मीनार से बहुत दूर फेंका जा रहा है? ये अधर्म की संतान हैं। इन्होंने कपट से विश्वास किया, और उनसे कोई भी दुष्टता नहीं छूटी। इसी कारण इनके लिए उद्धार नहीं है, क्योंकि अपनी बुराइयों के कारण ये निर्माण के काम के योग्य नहीं हैं। इसलिए उन्हें टुकड़े-टुकड़े कर दिया गया और बहुत दूर फेंक दिया गया, प्रभु के क्रोध के कारण, क्योंकि उन्होंने उसे क्रोधित किया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακοπτομένους / συνεκόπησαν
  choice: काट-काटकर / काट-काटकर ... फेंक दिया गया
  rationale: क्रिया में काटने या टुकड़े करने की तीव्रता है; पुनरुक्ति पत्थरों के रूपक और यूनानी बल दोनों को स्वाभाविक हिन्दी में रखती है।
- source_word: υἱοὶ τῆς ἀνομίας
  choice: अधर्म की संतान
  rationale: सेमिटिक संबंधसूचक अभिव्यक्ति को बनाए रखता है और ἀνομία को केवल सामान्य ‘बुराई’ में नहीं मिलाता।
- source_word: ἐν ὑποκρίσει
  choice: कपट से
  rationale: विश्वास की निष्कपटता के अभाव को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘ढोंग में’ की अस्वाभाविकता से बचता है।
- source_word: πονηρία / πονηρίας
  choice: बुराई / बुराइयों
  rationale: पहले प्रयोग में समष्टिगत दुष्टता और दूसरे में उनके अनेक बुरे आचरण/गुणों की व्यापकता को संदर्भानुसार व्यक्त करता है।
- source_word: εὔχρηστοι εἰς οἰκοδομήν
  choice: निर्माण के काम के योग्य
  rationale: मीनार-निर्माण के ठोस रूपक को स्पष्ट रखते हुए ‘उपयोगी’ के यांत्रिक भाव से बचता है।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: आरंभिक मसीही धार्मिक संदर्भ में स्थापित और अर्थपूर्ण हिन्दी शब्द है।
- source_word: ὀργὴν τοῦ Κυρίου
  choice: प्रभु का क्रोध
  rationale: मूल के प्रत्यक्ष ईश्वरीय क्रोध को नरम किए बिना सुरक्षित रखता है।
- source_word: παρώργισαν
  choice: क्रोधित किया
  rationale: 'कारणात्मक अर्थ को सीधे रखता है: उनके आचरण ने प्रभु को क्रोध दिलाया।'
theological_decisions:
- issue: कपटी विश्वास और उद्धार का अभाव
  choice: ‘इन्होंने कपट से विश्वास किया ... इसी कारण इनके लिए उद्धार नहीं है’
  alternative: ‘वे केवल विश्वास करने का दिखावा करते थे ... वे बच नहीं सकते’
  rationale: मूल ἐπίστευσαν वास्तव में ‘विश्वास किया’ कहता है और उसके साथ कपट की योग्यता जोड़ता है; यह तनाव बनाए रखा गया है, न तो विश्वास को स्वतः असत्य घोषित किया गया है, न उद्धार-विषयक कथन को किसी व्यवस्थित सिद्धांत में बदला गया है।
- issue: ईश्वरीय क्रोध की कालगत अभिव्यक्ति
  choice: ‘प्रभु का क्रोध इन पर था’
  alternative: ‘प्रभु के क्रोध के कारण’
  rationale: διὰ τὴν ὀργήν का कारणात्मक अर्थ रखा गया है और हिन्दी में संदर्भ स्पष्ट किया गया है, बिना दंड की किसी अतिरिक्त प्रक्रिया को जोड़ने के।
- issue: ‘अधर्म की संतान’ का स्वरूप
  choice: रूपकात्मक संबंधसूचक पद को यथावत रखना
  alternative: ‘अधर्मी लोग’
  rationale: मूल की पहचान-सूचक तीव्रता और बाइबिलीय/आरंभिक मसीही मुहावरा बचता है; इसे जैविक वंश या किसी विशिष्ट सिद्धांत के रूप में नहीं समझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मीनार और निर्माण से जुड़े पत्थर-रूपक को ठोस रखा गया है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है, पर मूल की कठोर नैतिक और धर्मवैचारिक भाषा को नरम नहीं किया गया।
