  text: 4. “And the mutilated ones—these are those who have believed and have the greater part in righteousness, but have certain parts of lawlessness. For this reason they are mutilated and not whole.
translation:
  language: hi
  text: 4. “और जो पत्थर खंडित हैं, वे ऐसे लोग हैं जिन्होंने विश्वास किया है और जिनमें अधिकांश धार्मिकता है, पर उनमें अधर्म के कुछ अंश भी हैं। इसी कारण वे खंडित हैं और पूरे नहीं हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεκολοβωμένοι / κολοβοί
  choice: कटे-छँटे / अधूरे
  rationale: पत्थरों के रूपक में पहला पद उनकी कटी हुई दशा को मूर्त रूप देता है; बाद में ‘अधूरे’ उसी रूपक का मानवीय आशय स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: πεπιστευκότες
  choice: जिन्होंने विश्वास ... किया है
  rationale: पूर्णकालिक कृदंत को ऐसे विश्वास के रूप में प्रस्तुत किया गया है जिसका वर्तमान चरित्र पर प्रभाव बना हुआ है।
- source_word: τὸ πλεῖον μέρος ἔχοντες ἐν τῇ δικαιοσύνῃ
  choice: जिनका अधिकांश जीवन धार्मिकता में है
  rationale: शाब्दिक ‘अधिकांश भाग धार्मिकता में’ हिन्दी में अस्वाभाविक है; यह अनुवाद मात्रा और नैतिक जीवन—दोनों भाव सुरक्षित रखता है।
- source_word: ἀνομία
  choice: अधर्म
  rationale: यह शब्द व्यवस्था-विरोधी और नैतिक दुष्टता के व्यापक भाव को संक्षेप में व्यक्त करता है।
- source_word: οὐχ ὁλοτελεῖς
  choice: पूर्ण नहीं
  rationale: मूल के संपूर्णता-अभाव को सीधे और रूपक के अनुरूप व्यक्त करता है।
theological_decisions:
- issue: विश्वास, धार्मिकता और शेष अधर्म के बीच तनाव
  choice: विश्वास को वास्तविक रूप में कहा गया है, जबकि व्यक्ति में अधर्म के अंश बने रहने की बात भी यथावत रखी गई है।
  alternative: उनके विश्वास को झूठा या केवल नाममात्र का बताना।
  rationale: यूनानी पाठ πεπιστευκότες में विश्वास की पुष्टि करता है और साथ ही धार्मिकता व अधर्म की मिली-जुली दशा बताता है; पाठ इस तनाव का कोई संप्रदायगत समाधान नहीं देता।
- issue: ‘अधिकांश भाग धार्मिकता में’ का आशय
  choice: इसे ‘अधिकांश जीवन धार्मिकता में’ कहा गया है।
  alternative: इसे धार्मिकता में किसी न्यायिक हिस्सेदारी या दर्जे के रूप में स्पष्ट करना।
  rationale: मूल में मात्रा का रूपक है, पर सटीक धर्मवैज्ञानिक तंत्र निर्दिष्ट नहीं; अनुवाद नैतिक संदर्भ को स्पष्ट रखते हुए अतिरिक्त सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और पत्थरों के निर्माण-संबंधी रूपक से जुड़ी भाषा। ‘कटे-छँटे’ दृश्य रूपक को बनाए रखता है, जबकि ‘अधूरे, पूर्ण नहीं’ निष्कर्ष को सामान्य पाठक के लिए स्पष्ट करता है।
