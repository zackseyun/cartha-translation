base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/003.yaml
  text: 3. “And those that have cracks—who are they? These are the ones who harbor things against one another in their hearts and are not at peace among themselves, but have a face of peace; yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks that the stones have.
translation:
  language: hi
  text: 3. “और जिन पत्थरों में दरारें हैं, वे कौन हैं?” “ये वे लोग हैं जो अपने मन में एक-दूसरे के प्रति दुर्भाव रखते हैं और आपस में शांति से नहीं रहते। वे शांति का भाव दिखाते हैं, पर जब वे एक-दूसरे से अलग होते हैं, तब उनकी बुराइयाँ उनके मन में बनी रहती हैं। तो ये ही वे दरारें हैं जो उन पत्थरों में हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς σχισμὰς
  choice: दरारें
  rationale: पत्थरों के रूपक में σχίσματα का ठोस अर्थ ‘दरारें’ है; यह आगे वर्णित आपसी मनमुटाव और भीतरी विभाजन को भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατ᾿ ἀλλήλων ἐν ταῖς καρδίαις ἔχοντες
  choice: अपने मन में एक-दूसरे के विरुद्ध बैर रखते हैं
  rationale: यूनानी वाक्य में कर्म अनुक्त है और अर्थ है किसी के विरुद्ध मन में दुर्भाव रखना। ‘बैर’ इस आशय को सामान्य हिन्दी में स्पष्ट करता है, बिना किसी खास अपराध को जोड़ने के।
- source_word: μὴ εἰρηνεύοντες ἐν ἑαυτοῖς
  choice: आपस में शांति से नहीं रहते
  rationale: यह परस्पर मेल और शांतिपूर्ण संबंध के अभाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πρόσωπον εἰρήνης ἔχοντες
  choice: ऊपर से तो शांतिपूर्ण दिखाई देते हैं
  rationale: शाब्दिक ‘शांति का चेहरा रखते हैं’ हिन्दी में अस्वाभाविक होता; चयन बाहरी शांति के दिखावे और भीतरी बैर के विरोध को सुरक्षित रखता है।
- source_word: αἱ πονηρίαι αὐτῶν
  choice: उनकी बुराइयाँ
  rationale: बहुवचन और नैतिक व्यापकता को बनाए रखा गया है; इसे केवल ‘बुरे विचार’ या ‘द्वेष’ तक सीमित नहीं किया गया।
- source_word: ἐμμένουσιν
  choice: बनी रहती हैं
  rationale: यह हृदय में बुराइयों के टिके या जमे रहने का निरंतर भाव देता है।
theological_decisions:
- issue: भीतरी वैमनस्य और बाहरी शांति के बीच तनाव
  choice: बैर को मन में बनाए रखने और ऊपर से शांतिपूर्ण दिखने—दोनों को स्पष्ट रखा गया है।
  alternative: इसे सामान्य ‘कपट’ या ‘पाखंड’ कहकर संक्षिप्त करना।
  rationale: मूल पाठ विशेष रूप से संबंधों की दो अवस्थाओं का विरोध करता है; व्यापक धार्मिक पद लगाने से उसका ठोस नैतिक चित्र धुँधला पड़ता।
- issue: पत्थरों की दरारों का रूपक
  choice: अंतिम वाक्य में दरारों को लोगों की वर्णित आंतरिक दशा से सीधे जोड़ा गया है।
  alternative: ‘दरारें आपसी फूट का प्रतीक हैं’ जैसी व्याख्यात्मक भाषा।
  rationale: मूल रूपक को व्याख्या में बदले बिना सुरक्षित रखना अधिक स्रोत-संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। प्रश्नोत्तर का रूप और पत्थरों की दरारों का मूल रूपक बनाए रखा गया है। अनुक्त यूनानी कर्म को हिन्दी में स्वाभाविक बनाने के लिए ‘बैर’ चुना गया है; कोई पादटिप्पणी आवश्यक नहीं।
