base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/007.yaml
  text: '7. “Learn first from yourself: when you were rich, you were useless; but now you are useful and beneficial for life. Become useful to God; for you yourself also are used from the same stones.”'
translation:
  language: hi
  text: '7. “पहले अपने ही अनुभव से समझो: जब तुम धनी थे, तब किसी काम के नहीं थे; पर अब तुम जीवन के लिए उपयोगी और लाभदायक हो। परमेश्वर के काम आओ, क्योंकि तुम स्वयं भी इन्हीं पत्थरों में से एक के रूप में काम में लाए जाते हो।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ [δὲ] σεαυτοῦ πρῶτον γνῶθι
  choice: पहले अपने ही अनुभव से समझो
  rationale: शाब्दिक ‘पहले अपने आप से जानो’ का स्वाभाविक हिन्दी रूप; यह हर्मास को अपनी स्थिति से शिक्षा लेने को कहता है। कोष्ठकित δὲ अर्थ के लिए अनिवार्य नहीं है।
- source_word: ἄχρηστος / εὔχρηστος
  choice: किसी काम के नहीं / उपयोगी; परमेश्वर के काम आओ
  rationale: यहाँ निर्माण में पत्थरों की उपयोगिता का रूपक चलता है। अलग प्रसंगों में स्वाभाविक हिन्दी रखते हुए मूल शब्द-युग्म का विरोध सुरक्षित किया गया है।
- source_word: ὠφέλιμος τῇ ζωῇ
  choice: जीवन के लिए ... लाभदायक
  rationale: समर्पणवाचक τῇ ζωῇ को उसके स्वाभाविक अर्थ में रखा गया है; ‘जीवन’ को बिना पर्याप्त आधार ‘अनन्त जीवन’ नहीं बनाया गया।
- source_word: χρᾶσαι ἐκ τῶν αὐτῶν λίθων
  choice: तुम स्वयं भी इन्हीं पत्थरों में से एक के रूप में काम में लाए जाते हो
  rationale: पाठ का रूप असामान्य है, पर सन्दर्भ में हर्मास का उन्हीं पत्थरों में गिना जाना और उपयोग में लाया जाना अभिप्रेत है। हिन्दी अनुवाद निर्माण-रूपक को स्पष्ट रखता है।
theological_decisions:
- issue: धन और परमेश्वर के लिए उपयोगिता का सम्बन्ध
  choice: कथन को हर्मास के अपने अनुभव और निर्माण-रूपक तक सीमित रखा गया
  alternative: इसे धनवान होने की सार्वभौमिक और निरपेक्ष निन्दा बनाना
  rationale: निकटवर्ती सन्दर्भ में बाधक धन के काटे जाने की उपमा है; पद स्वयं हर्मास की पहले और अब की दशा की तुलना करता है।
- issue: τῇ ζωῇ में ‘जीवन’ का आशय
  choice: जीवन
  alternative: अनन्त जीवन या उद्धार
  rationale: मूल पाठ केवल ζωή कहता है; धार्मिक विस्तार जोड़ने से वास्तविक अर्थ-व्याप्ति अनावश्यक रूप से संकीर्ण हो जाती।
- issue: अन्तिम वाक्य का कर्तृवाच्य/कर्मवाच्य अर्थ
  choice: काम में लाए जाते हो
  alternative: तुम स्वयं इन्हीं पत्थरों का उपयोग करते हो
  rationale: पत्थरों और निर्माण के पूरे सन्दर्भ तथा εὔχρηστος की पुनरावृत्ति में हर्मास का उपयोगी पत्थर होना अधिक सुसंगत है, यद्यपि ग्रीक रूप पाठगत/व्याकरणिक कठिनाई रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किन्तु सहज शैली। ‘धनी’, ‘उपयोगी’, ‘लाभदायक’ और ‘काम में लाए जाते हो’ जैसे शब्द सामान्य पाठक के लिए स्पष्ट हैं तथा निर्माण में प्रयुक्त पत्थरों का विस्तृत रूपक बनाए रखते हैं।
