base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/004.yaml
  text: “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful. But they are being admonished by the angels to do good, because evil was found in them.”
translation:
  language: hi
  text: “और जिन्हें लाकर भवन में रखा जा रहा है, वे कौन हैं?” “वे विश्वास में नए हैं और विश्वासयोग्य हैं। पर स्वर्गदूत उन्हें भलाई करने की नसीहत दे रहे हैं, क्योंकि उनमें बुराई पाई गई थी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγόμενοι καὶ τιθέμενοι
  choice: लाकर ... लगाया जा रहा है
  rationale: पत्थरों को निर्माण-स्थल तक लाने और भवन में रखने की दोनों क्रियाओं को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Νέοι ... ἐν τῇ πίστει
  choice: विश्वास में नए
  rationale: ग्रीक वाक्यांश का सीधा और सहज अर्थ है कि उन्होंने हाल ही में विश्वास ग्रहण किया है।
- source_word: πιστοί
  choice: विश्वासयोग्य
  rationale: निकटवर्ती πίστις से भेद रखते हुए विशेषण का अर्थ ‘निष्ठावान/विश्वासयोग्य’ व्यक्त करता है; केवल ‘विश्वासी’ करने से शब्द-भेद धुँधला पड़ता।
- source_word: νουθετοῦνται
  choice: सीख दे रहे हैं
  rationale: नैतिक सुधार के लिए समझाने, चेताने और निर्देश देने का भाव साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀγαθοποιεῖν
  choice: भलाई करने
  rationale: क्रिया के सक्रिय नैतिक अर्थ ‘अच्छा करना’ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πονηρία
  choice: बुराई
  rationale: यहाँ व्यापक नैतिक दोष का सामान्य अर्थ उपयुक्त है; अधिक विशिष्ट ‘दुष्टता’ मूल से अधिक तीखा हो सकता है।
theological_decisions:
- issue: विश्वास में नए लोगों को एक साथ πιστοί कहना
  choice: ‘विश्वास में नए हैं और विश्वासयोग्य हैं’—दोनों कथनों को साथ रखा गया
  alternative: ‘नए विश्वासी हैं’ कहकर दोनों को मिला देना
  rationale: मूल पाठ नएपन और निष्ठा को अलग-अलग गुणों के रूप में रखता है; उसकी संभावित तनावपूर्णता को मिटाना उचित नहीं।
- issue: स्वर्गदूतों की νουθεσία का स्वरूप
  choice: नैतिक सीख/समझाइश के रूप में अनुवाद
  alternative: दंड देना या केवल शिक्षा देना
  rationale: νουθετέω सुधारात्मक चेतावनी और निर्देश दोनों समेटता है, पर अपने आप में दंड का अर्थ नहीं देता।
- issue: उनमें पाई गई πονηρία
  choice: ‘बुराई पाई गई थी’
  alternative: ‘वे दुष्ट थे’ या ‘उनमें दुर्भावना थी’
  rationale: मूल उनके पूरे चरित्र को दुष्ट घोषित नहीं करता, बल्कि उनके भीतर मिले नैतिक दोष की बात करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। भवन और पत्थरों के विस्तृत रूपक के अनुरूप ‘भवन में लगाया’ रखा गया है। संवाद-रचना और मूल की संक्षिप्त प्रश्नोत्तर शैली सुरक्षित है।
