base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/003.yaml
  text: “I want to know who the other stones are that are being carried from the dry land, lady.” She said, “Those that go into the building without being hewn—the Lord approved these, because they walked in the uprightness of the Lord and kept his commandments.”
translation:
  language: hi
  text: “हे स्वामिनी, मैं जानना चाहता हूँ कि वे दूसरे पत्थर कौन हैं जिन्हें सूखी भूमि से लाया जा रहा है।” उसने कहा, “जो पत्थर बिना तराशे ही निर्माण में लगाए जाते हैं, उन्हें प्रभु ने परखकर स्वीकार किया है, क्योंकि वे प्रभु के सीधे मार्ग पर चले और उन्होंने उसकी आज्ञाओं का पालन किया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυρία
  choice: हे स्वामिनी
  rationale: स्त्री संबोधन और आदर को बनाए रखता है; प्रसंग में वक्ता उस महिला को अधिकारपूर्ण सम्मान से संबोधित करता है।
- source_word: ἀπὸ τῆς ξηρᾶς
  choice: सूखी भूमि से
  rationale: ξηρά का ठोस, दृश्य अर्थ सुरक्षित रखा गया है और पत्थरों के रूपक से स्वाभाविक रूप से जुड़ता है।
- source_word: μὴ λατομουμένους
  choice: बिना तराशे
  rationale: शाब्दिक अर्थ ‘पत्थर की खान में काटे/गढ़े बिना’ है; हिन्दी में पत्थरों के संदर्भ में ‘बिना तराशे’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἐδοκίμασεν
  choice: परखकर स्वीकार किया है
  rationale: क्रिया में जाँचने और जाँच के बाद अनुमोदित मानने, दोनों का भाव है; संयुक्त अभिव्यक्ति दोनों पक्षों को सुरक्षित रखती है।
- source_word: ἐν τῇ εὐθύτητι τοῦ Κυρίου
  choice: प्रभु की सीधाई के मार्ग पर
  rationale: εὐθύτης की नैतिक सीधाई/खराई को रखता है; ‘के मार्ग पर’ चलने की क्रिया के साथ हिन्दी में स्वाभाविक संबंध बनाता है।
- source_word: κατωρθώσαντο τὰς ἐντολὰς αὐτοῦ
  choice: उन्होंने उसकी आज्ञाओं का पालन किया
  rationale: मुहावरे का आशय आज्ञाओं को ठीक रीति से पूरा करना है; सामान्य आधुनिक हिन्दी में ‘पालन किया’ स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: प्रभु द्वारा अनुमोदन और मानवीय आज्ञाकारिता का संबंध
  choice: कारणसूचक ‘क्योंकि’ को स्पष्ट रखते हुए दोनों कथनों को यथावत रखा गया
  alternative: अनुग्रह या योग्यता की किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था के अनुसार संबंध की व्याख्या करना
  rationale: यूनानी पाठ अनुमोदन को उनके सीधे आचरण और आज्ञापालन से जोड़ता है, पर उसका व्यापक धर्मवैज्ञानिक तंत्र नहीं बताता; अनुवाद इस तनाव को बिना अतिरिक्त सिद्धांत जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पत्थरों और निर्माण के रूपक को ठोस रखा गया है। स्त्री वक्ता के लिए ‘उसने कहा’ और संबोधन के लिए ‘हे स्वामिनी’ प्रयुक्त है।
