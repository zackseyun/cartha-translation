base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/002.yaml
  text: “And the ones drawn up from the deep and set into the building and fitting together at their joints with the other stones already built—who are they?” “These are the ones who suffered on account of the name of the Lord.”
translation:
  language: hi
  text: “और जो पत्थर गहराई से खींचे जाते हैं, निर्माण में रखे जाते हैं, और जिनके जोड़ पहले से बने हुए दूसरे पत्थरों के जोड़ों से मेल खाते हैं—वे कौन हैं?” “ये वे हैं जिन्होंने प्रभु के नाम के कारण दुःख सहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυθοῦ
  choice: गहरे जल
  rationale: यह शब्द गहराई अथवा जल की अथाह गहराई को दर्शाता है; दृश्य में पत्थरों को जल से खींचकर निकालने की छवि बनाए रखने के लिए ‘गहरे जल’ स्वाभाविक और स्पष्ट है।
- source_word: ἑλκόμενοι
  choice: खींचकर निकाले गए
  rationale: निष्क्रिय कृदंत पत्थरों को गहराई से ऊपर खींचे जाने का भाव देता है।
- source_word: οἰκοδομήν
  choice: भवन
  rationale: संदर्भ में मीनार के निर्माणाधीन ढाँचे का संकेत है; ‘भवन’ हिंदी में वस्तु और निर्माण-कार्य दोनों के संदर्भ को सहज रखता है।
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς
  choice: अपने जोड़ ठीक बैठाते हैं
  rationale: शाब्दिक सहमति के बजाय पत्थरों के जोड़ों के परस्पर मेल खाने की स्थापत्य छवि को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: παθόντες
  choice: दुःख सहा है
  rationale: ग्रीक में सामान्यतः कष्ट या पीड़ा सहने का अर्थ है; मूल पाठ स्पष्ट रूप से मृत्यु या शहादत नहीं कहता, इसलिए व्यापक अर्थ सुरक्षित रखा गया है।
- source_word: ἕνεκεν τοῦ ὀνόματος τοῦ Κυρίου
  choice: प्रभु के नाम के कारण
  rationale: मूल के कारणसूचक वाक्यांश और आरंभिक मसीही धार्मिक अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: οἱ παθόντες को शहीदों के रूप में समझना
  choice: जिन्होंने दुःख सहा है
  alternative: जो शहीद हुए हैं
  rationale: मूल शब्द कष्ट सहने को कहता है, मृत्यु को अनिवार्य नहीं बनाता; अतः अनुवाद वास्तविक अस्पष्टता को बनाए रखता है।
- issue: ‘प्रभु के नाम’ का विस्तार
  choice: प्रभु के नाम के कारण
  alternative: प्रभु पर विश्वास करने के कारण
  rationale: मूल की धार्मिक अभिव्यक्ति को ज्यों का त्यों रखा गया है और उसका व्याख्यात्मक विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज संवादात्मक शैली रखी गई है। स्थापत्य रूपक को स्पष्ट करने के लिए ‘जोड़ ठीक बैठाते हैं’ चुना गया है। कोई पादटिप्पणी आवश्यक नहीं है।
