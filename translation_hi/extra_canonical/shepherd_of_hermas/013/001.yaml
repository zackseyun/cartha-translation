base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/001.yaml
  text: “Listen now about the stones that go into the building. The stones, then, that are square and white and that fit together at their joints—these are the apostles and bishops and teachers and deacons, who walked in the reverent dignity of God and who oversaw and taught and served God’s elect with purity and reverence—some have fallen asleep, and some are still alive. They were always in agreement with one another, had peace among themselves, and listened to each other; for this reason their joints fit in the building of the tower.
translation:
  language: hi
  text: “अब उन पत्थरों के विषय में सुनो जो इमारत में लगाए जाते हैं। वे पत्थर जो चौकोर और सफेद हैं और जिनके जोड़ आपस में ठीक बैठते हैं—ये वे प्रेरित, पर्यवेक्षक, शिक्षक और सेवक हैं, जो परमेश्वर की गरिमा के अनुसार चले और जिन्होंने परमेश्वर के चुने हुओं की देखरेख की, उन्हें शिक्षा दी और पवित्रता तथा गरिमा के साथ उनकी सेवा की। उनमें से कुछ सो चुके हैं और कुछ अब भी जीवित हैं। वे सदा एक-दूसरे के साथ सहमत रहे, उनके बीच शांति रही और उन्होंने एक-दूसरे की बात सुनी। इसी कारण मीनार की इमारत में उनके जोड़ ठीक बैठते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκοδομήν
  choice: भवन / निर्माण
  rationale: पहले प्रयोग में निर्मित संरचना का संकेत है, जबकि अंतिम वाक्य में निर्माण-कार्य का; हिंदी में प्रसंगानुसार दोनों रूप स्वाभाविक हैं।
- source_word: ἐπίσκοποι
  choice: अध्यक्ष
  rationale: आरंभिक मसीही समुदाय में निगरानी और नेतृत्व करनेवाले पद का अपेक्षाकृत तटस्थ हिंदी रूप; आधुनिक सांप्रदायिक पदनाम थोपने से बचाता है।
- source_word: διάκονοι / διακονήσαντες
  choice: सेवक / सेवा की
  rationale: संज्ञा और संबंधित क्रिया के अर्थगत संबंध को बनाए रखता है तथा संस्थागत और सामान्य सेवा—दोनों संकेतों को खुला रखता है।
- source_word: σεμνότης / σεμνῶς
  choice: गरिमा / गरिमा के साथ
  rationale: श्रद्धापूर्ण, सम्माननीय और गंभीर आचरण का भाव व्यक्त करता है; केवल ‘भक्ति’ कहने पर नैतिक गरिमा का पहलू कम हो जाता।
- source_word: ἁγνῶς
  choice: पवित्रता के साथ
  rationale: निष्कलंक और शुद्ध रीति से सेवा करने का नैतिक-धार्मिक भाव सहज हिंदी में देता है।
- source_word: κεκοιμημένοι
  choice: सो चुके हैं
  rationale: मृत्यु के लिए मूल पाठ के रूपक को बनाए रखता है और आरंभिक मसीही भाषा की भाव-छाया सुरक्षित रखता है।
- source_word: ἁρμογαί
  choice: जोड़
  rationale: पत्थरों के जुड़ने वाले हिस्सों और पारस्परिक सामंजस्य के चित्र को स्पष्ट तथा प्राकृतिक हिंदी में बनाए रखता है।
theological_decisions:
- issue: τοῦ Θεοῦ का संबंध ‘गरिमा’ से
  choice: परमेश्वर की गरिमा के अनुरूप चले
  alternative: परमेश्वर के प्रति श्रद्धापूर्ण गरिमा से चले
  rationale: यूनानी पदबंध का औपचारिक संबंध परमेश्वर से है, पर उसका सटीक आशय कुछ असामान्य है। चुना हुआ रूप संबंध को सुरक्षित रखते हुए इसे परमेश्वर के चरित्र/मानक के अनुरूप आचरण के रूप में स्वाभाविक बनाता है।
- issue: τοῖς ἐκλεκτοῖς τοῦ Θεοῦ के साथ तीनों सेवाकार्य
  choice: परमेश्वर के चुने हुओं की देखरेख की, उन्हें शिक्षा दी और ... उनकी सेवा की
  alternative: परमेश्वर के चुने हुओं के लिए देखरेख, शिक्षा और सेवा की
  rationale: यूनानी में एक ही अप्रत्यक्ष कर्म तीनों क्रियाओं से जुड़ा है; हिंदी में प्रत्येक संबंध स्पष्ट किया गया है, बिना किसी अतिरिक्त कलीसियाई सिद्धांत को जोड़े।
- issue: पद-सूची की संस्थागत व्याख्या
  choice: प्रेरित, अध्यक्ष, शिक्षक और सेवक
  alternative: प्रेरित, बिशप, शिक्षक और डीकन
  rationale: मूल में समुदाय की पहचानी जानेवाली भूमिकाएँ हैं, पर बाद के विशिष्ट सांप्रदायिक पदानुक्रम को स्वतः आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। पत्थरों, जोड़ और मीनार के विस्तृत रूपक को दृश्यमान रखा गया है। वाक्य-विन्यास को हिंदी में स्पष्ट करने के लिए लंबी यूनानी अवधि को कई वाक्यों में बाँटा गया है।
