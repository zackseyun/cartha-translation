  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/005.yaml
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
translation:
  language: hi
  text: “और जिन्हें वे निकालकर फेंक रहे थे, वे कौन हैं?” “ये वे लोग हैं जिन्होंने पाप किया है और पश्चाताप करना चाहते हैं। इसी कारण उन्हें मीनार के बाहर बहुत दूर नहीं फेंका गया, क्योंकि यदि वे पश्चाताप करें, तो वे निर्माण के काम आएँगे। इसलिए जो लोग पश्चाताप करने जा रहे हैं, यदि वे पश्चाताप करें, तो वे विश्वास में दृढ़ होंगे—यदि वे अभी, जब मीनार का निर्माण हो रहा है, पश्चाताप करें। पर यदि निर्माण पूरा हो गया, तो फिर उनके लिए कोई स्थान नहीं रहेगा, बल्कि उन्हें निकाल फेंका जाएगा। उनके पास केवल इतना ही रहेगा कि वे मीनार के पास पड़े रहें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέβαλλον καὶ ἔριττον
  choice: निकालकर एक ओर फेंक रहे थे
  rationale: दोनों क्रियाओं के निष्कासन और फेंकने के संयुक्त चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μετανοῆσαι / μετανοήσωσιν
  choice: पश्चाताप करना / पश्चाताप करें
  rationale: मन-परिवर्तन और पाप से लौटने के धार्मिक अर्थ के लिए प्रचलित, स्पष्ट हिन्दी पद।
- source_word: εὔχρηστοι ... εἰς τὴν οἰκοδομήν
  choice: निर्माण के काम आएँगे
  rationale: पत्थरों के रूपक में उपयोगी होने का ठोस अर्थ सहज हिन्दी में व्यक्त करता है।
- source_word: ἰσχυροὶ ... ἐν τῇ πίστει
  choice: विश्वास में दृढ़
  rationale: ἰσχυροί की शक्ति को विश्वास-संबंधी स्थिरता के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔκβολοι
  choice: बाहर फेंके हुए
  rationale: निर्माण-रूपक और बहिष्कृत दशा, दोनों को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
- source_word: παρὰ τῷ πύργῳ κεῖσθαι
  choice: मीनार के पास पड़े रहें
  rationale: κεῖσθαι के स्थानगत और निष्क्रिय चित्र को यथासंभव सीधे रूप में रखता है।
theological_decisions:
- issue: पश्चाताप की समय-सीमा
  choice: ‘अभी, जब मीनार बनाई जा रही है’ और निर्माण पूरा होने के बाद स्थान न रहने की चेतावनी को स्पष्ट रूप से बनाए रखा
  alternative: इसे सामान्य जीवनकाल या किसी निश्चित अंत-कालीन सिद्धांत के रूप में समझाकर अनूदित करना
  rationale: यूनानी पाठ रूपक के भीतर समयगत आग्रह करता है, पर उसकी सटीक धर्मवैज्ञानिक पहचान नहीं बताता; अतः अस्पष्टता सुरक्षित रखी गई है।
- issue: οἱ μέλλοντες μετανοεῖν का अर्थ
  choice: जो पश्चाताप करने वाले हैं
  alternative: जो भविष्य में पश्चाताप करेंगे / जिन्हें पश्चाताप करना नियत है
  rationale: μέλλω भविष्य की प्रवृत्ति या संभावना बता सकता है; अनुवाद किसी पूर्वनियति-संबंधी निष्कर्ष को नहीं थोपता।
- issue: मीनार के पास पड़े रहने की अंतिम दशा
  choice: चित्र को शाब्दिक रूप में रखा
  alternative: इसे उद्धार, आंशिक सहभागिता या स्थायी दंड के रूप में स्पष्ट करना
  rationale: मूल पाठ इस प्रतीक की पूर्ण धर्मवैज्ञानिक व्याख्या नहीं देता; तनाव को अनसुलझा रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मीनार और निर्माण से जुड़े ठोस रूपक को निरंतर रखा गया है। मूल के दोहराव—विशेषतः पश्चाताप की शर्त और उसकी तात्कालिकता—को जानबूझकर सुरक्षित रखा गया है।
