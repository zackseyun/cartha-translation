  text: 4. “But the Gentiles and the sinners—like the dry trees you saw—will be found such, dry and fruitless in that age, and as …”
translation:
  language: hi
  text: 4. परन्तु अन्यजातियाँ और पापी—जैसे वे सूखे पेड़ जिन्हें तुमने देखा था—उस युग में वैसे ही सूखे और निष्फल पाए जाएँगे, और जैसे…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध स्रोत-पाठ यहाँ अपूर्ण है; वाक्य का शेष भाग प्रस्तुत अंश में नहीं मिलता।
    reason: पाठक को बताता है कि दीर्घविराम शैलीगत नहीं, बल्कि प्रदत्त स्रोत के कटे होने को दर्शाता है।
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: अन्यजातियाँ
  rationale: बहुवचन का सामूहिक अर्थ बनाए रखता है और आरम्भिक मसीही साहित्य में गैर-यहूदी जातियों के लिए प्रचलित, गरिमापूर्ण पद है।
- source_word: οἱ ἁμαρτωλοί
  choice: पापी
  rationale: नैतिक और धार्मिक अर्थ को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ξηροὶ καὶ ἄκαρποι
  choice: सूखे और निष्फल
  rationale: पेड़ों के रूपक को बनाए रखते हुए ξηροί और ἄκαρποι दोनों विशेषणों का स्पष्ट अनुवाद करता है।
- source_word: ἐν ἐκείνῳ τῷ αἰῶνι
  choice: उस युग में
  rationale: आने वाले युग के संदर्भ को संक्षिप्त रूप से बनाए रखता है; इसे संसार या अनन्तता कहकर अर्थ को अधिक निर्धारित नहीं करता।
- source_word: εὑρεθήσονται
  choice: पाए जाएँगे
  rationale: यूनानी भविष्यकालीन कर्मवाच्य का औपचारिक तथा स्वाभाविक समतुल्य है।
theological_decisions:
- issue: τὰ ἔθνη की पहचान
  choice: अन्यजातियाँ
  alternative: राष्ट्र / जातियाँ
  rationale: संदर्भ में यह पद पापियों के साथ न्याय के समय प्रकट होने वाले एक धार्मिक-सामुदायिक वर्ग को सूचित करता है; फिर भी अनुवाद उनके अंतिम भाग्य के बारे में अधूरे स्रोत से आगे कोई निष्कर्ष नहीं जोड़ता।
- issue: अधूरे वाक्य का निर्वाह
  choice: अंत में ‘और जैसे…’ रखकर अपूर्णता दिखाई गई
  alternative: अनुमान से वाक्य पूरा करना या अंतिम खंड हटा देना
  rationale: प्रदत्त यूनानी स्रोत ξ पर कट जाता है और अंग्रेज़ी परामर्श-पाठ भी वाक्य को अपूर्ण रखता है; इसलिए अनुमानित पाठ जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। वृक्ष-रूपक और आने वाले युग की भाषा को यथासंभव सीधे रखा गया है।
