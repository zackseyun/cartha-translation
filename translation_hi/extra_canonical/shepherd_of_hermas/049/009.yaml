  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/009.yaml
  text: 1. He showed me again many trees, some sprouting and others dry, and he says to me, “Do you see these trees?” “I see,” I say, “sir, some sprouting and others dry.”
translation:
  language: hi
  text: 1. उसने मुझे फिर बहुत-से पेड़ दिखाए—कुछ में कोंपलें निकल रही थीं और कुछ सूखे थे। वह मुझसे कहता है, “क्या तुम इन पेड़ों को देखते हो?” मैंने कहा, “जी, स्वामी; कुछ में कोंपलें निकल रही हैं और कुछ सूखे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: जिनमें कोंपलें निकल रही थीं
  rationale: वर्तमान कृदंत पेड़ों में दिखाई दे रही नई वृद्धि को व्यक्त करता है; यह केवल सामान्य ‘हरे-भरे’ होने से अधिक सटीक और स्वाभाविक है।
- source_word: ξηρά
  choice: सूखे
  rationale: पेड़ों की विपरीत अवस्था के लिए सरल और प्रत्यक्ष समानार्थी, जो आगे के रूपक को भी बनाए रखता है।
- source_word: κύριε
  choice: स्वामी
  rationale: यहाँ संबोधन आदरपूर्ण है और आवश्यक नहीं कि ईश्वर के लिए प्रयुक्त उपाधि हो; ‘स्वामी’ उस अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: κύριε को दिव्य उपाधि मानना या आदरपूर्ण मानवीय संबोधन
  choice: स्वामी
  alternative: प्रभु
  rationale: वक्ता दर्शन समझाने वाले पात्र को संबोधित कर रहा है; यूनानी शब्द दोनों अर्थ दे सकता है, इसलिए ऐसा शब्द चुना गया जो अनावश्यक रूप से उसकी दिव्यता निश्चित न करे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। यूनानी वर्तमान-कालीन संवाद ‘कहता है/कहा’ का हिन्दी में स्वाभाविक मिश्रण रखते हुए दृश्य की जीवंतता और उत्तर की सहजता सुरक्षित की गई है।
