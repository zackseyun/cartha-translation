base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/010.yaml
  text: 2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be made manifest.”
translation:
  language: hi
  text: 2. उसने कहा, “ये कोंपलें निकालने वाले पेड़ वे धर्मी लोग हैं जो आने वाले युग में निवास करेंगे; क्योंकि आने वाला युग धर्मियों के लिए ग्रीष्म ऋतु है, पर पापियों के लिए शीत ऋतु। इसलिए जब प्रभु की दया चमक उठेगी, तब परमेश्वर की सेवा करने वाले प्रकट हो जाएँगे, और सभी प्रकट हो जाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: फूटते हुए
  rationale: पेड़ों में नई कोंपलें निकलने और जीवन प्रकट होने का स्वाभाविक चित्र बनाए रखता है।
- source_word: οἱ δίκαιοι
  choice: धर्मी लोग
  rationale: नैतिक और धार्मिक अर्थ को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ αἰὼν ὁ ἐρχόμενος
  choice: आने वाला युग
  rationale: αἰών के युग-संबंधी अर्थ को बनाए रखता है और उसे केवल ‘संसार’ या ‘अनन्त जीवन’ मानकर सीमित नहीं करता।
- source_word: θέρος
  choice: ग्रीष्म ऋतु
  rationale: χειμών के साथ ऋतु-विरोध को स्पष्ट रखता है; प्रसंग में यही वह समय है जब पेड़ों का जीवन और फल पहचाने जाते हैं।
- source_word: χειμών
  choice: शीत ऋतु
  rationale: पेड़ों के सूखे और निष्प्राण दिखने की उपमा के अनुरूप औपचारिक किंतु सहज पद।
- source_word: ἐπιλάμψῃ
  choice: चमक उठेगी
  rationale: दया के प्रकाश की मूल रूपकात्मक भाषा को सुरक्षित रखता है।
- source_word: φανερωθήσονται
  choice: प्रकट हो जाएँगे
  rationale: निष्क्रिय रूप और छिपी वास्तविकता के उजागर होने की धारणा दोनों को व्यक्त करता है।
theological_decisions:
- issue: आने वाले युग में धर्मियों का निवास
  choice: जो आने वाले युग में निवास करेंगे
  alternative: जो आने वाले युग में निवास करने वाले हैं
  rationale: μέλλοντες κατοικεῖν की भविष्याभिमुखता रखी गई है, बिना यह तय किए कि कथन पूर्वनियति, पात्रता या केवल भावी घटना पर बल देता है।
- issue: प्रभु की दया का चमकना
  choice: जब प्रभु की दया चमक उठेगी
  alternative: जब प्रभु की करुणा का प्रकाश फैलेगा
  rationale: मूल रूपक को सीधे बनाए रखा गया है और इसे न्याय, आगमन या किसी विशिष्ट अंतकालीन घटना के रूप में व्याख्यायित नहीं किया गया।
- issue: ‘सभी’ की सीमा
  choice: और सभी प्रकट हो जाएँगे
  alternative: और वे सब प्रकट हो जाएँगे
  rationale: πάντες की अस्पष्ट व्यापकता सुरक्षित रखी गई है; इसे केवल सेवकों या पूरी मानवता तक स्पष्ट रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ऋतुओं तथा पेड़ों की उपमा को शाब्दिक रूप से स्पष्ट रखा गया है।
