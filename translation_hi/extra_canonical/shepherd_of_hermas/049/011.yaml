  text: 3. “For just as in summer the fruits of each tree become visible and are recognized for what they are, so also the fruits of the righteous will be visible, and all will be known, [those who are least] being flourishing in that age.”
translation:
  language: hi
  text: 3. “क्योंकि जैसे गरमी के मौसम में हर पेड़ के फल प्रकट हो जाते हैं और मालूम हो जाता है कि वे किस प्रकार के हैं, वैसे ही धर्मियों के फल भी प्रकट होंगे, और सभी पहचाने जाएँगे—[जो सबसे छोटे हैं][a], वे उस युग में हरे-भरे होंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जो सबसे छोटे हैं” शब्द यूनानी पाठ में पाठगत रूप से अनिश्चित हैं।
    reason: मूल संस्करण में οἱ ἐλάχιστοι ὄντες को कोष्ठकों में रखा गया है।
lexical_decisions:
- source_word: θέρος
  choice: गरमी का मौसम
  rationale: यहाँ शीत ऋतु के विपरीत वह मौसम अभिप्रेत है जिसमें पेड़ों के फल दिखाई देते हैं; ‘गरमी का मौसम’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: ποταποί
  choice: वे कैसे हैं
  rationale: फल किस प्रकार या गुणवत्ता के हैं—इस सामान्य अर्थ को बनाए रखता है, बिना उसे केवल ‘अच्छे-बुरे’ तक सीमित किए।
- source_word: οἱ καρποὶ
  choice: फल
  rationale: पेड़ों के वास्तविक फल और धर्मियों के जीवन/कर्मों के रूपकात्मक फल, दोनों के बीच मूल पाठ का शब्द-संबंध बनाए रखा गया है।
- source_word: εὐθαλεῖς
  choice: हरे-भरे
  rationale: विकसित, समृद्ध और जीवन से भरपूर होने की वृक्ष-संबंधी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: धर्मियों के ‘फलों’ की पहचान
  choice: ‘धर्मियों के फल भी प्रकट होंगे’
  alternative: ‘धर्मियों के काम भी प्रकट होंगे’
  rationale: मूल रूपक को बनाए रखा गया है और ‘फल’ का अर्थ केवल कर्मों तक सीमित नहीं किया गया।
- issue: οἱ ἐλάχιστοι ὄντες की संदिग्ध पाठ-स्थिति
  choice: शब्दों को कोष्ठकों में रखते हुए पाद-टिप्पणी दी गई
  alternative: उन्हें बिना संकेत के मुख्य पाठ में मिला देना या पूरी तरह हटा देना
  rationale: स्रोत संस्करण स्वयं इन शब्दों को कोष्ठकों में देता है; इसलिए पाठगत अनिश्चितता को छिपाया नहीं गया।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी; पेड़ों, फलों और हरे-भरे होने की विस्तृत रूपक-श्रृंखला सुरक्षित रखी गई है।
