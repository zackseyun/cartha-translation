  text: 9. Thus both become partners in the work of the righteous one. Therefore the one who does these things will not be abandoned by God, but will be inscribed in the books of the living.
translation:
  language: hi
  text: 9. इस प्रकार दोनों धर्मी के कार्य में सहभागी बनते हैं। इसलिए जो व्यक्ति ये काम करता है, उसे परमेश्वर त्याग नहीं देगा, बल्कि वह जीवितों की पुस्तकों में अंकित होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “धर्मी के कार्य” का अनुवाद “धार्मिकता के कार्य” या “धर्ममय कार्य” भी हो सकता है।
    reason: यूनानी τοῦ δικαίου में व्यक्ति-सूचक और गुण/कार्य-सूचक अर्थ की वास्तविक अस्पष्टता है।
lexical_decisions:
- source_word: ἀμφότεροι
  choice: दोनों
  rationale: संदर्भ में निर्धन और धनी—इन दोनों पक्षों को समान रूप से समेटता है।
- source_word: κοινωνοὶ
  choice: सहभागी
  rationale: साझी भागीदारी का भाव व्यक्त करता है, केवल सहायता या लाभ पाने का नहीं।
- source_word: τοῦ ἔργου τοῦ δικαίου
  choice: धर्मी के कार्य में
  rationale: τοῦ δικαίου को व्यक्तिवाचक विशेषण मानते हुए अंग्रेज़ी परामर्श-पाठ के अनुरूप अनुवाद किया गया है; यूनानी में वैकल्पिक अर्थ की संभावना को पादटिप्पणी में रखा गया है।
- source_word: οὐκ ἐγκαταλειφθήσεται
  choice: त्याग नहीं देगा
  rationale: दैवी परित्याग से सुरक्षित रहने का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐπιγεγραμμένος εἰς τὰς βίβλους τῶν ζώντων
  choice: उसका नाम जीवितों की पुस्तकों में लिखा जाएगा
  rationale: नामांकन का आशय स्पष्ट करने के लिए हिन्दी में स्वाभाविक रूप से ‘उसका नाम’ जोड़ा गया है; मूल का बहुवचन ‘पुस्तकों’ सुरक्षित रखा गया है।
theological_decisions:
- issue: τοῦ δικαίου का आशय
  choice: धर्मी के कार्य
  alternative: धार्मिकता के कार्य / धर्ममय कार्य
  rationale: रूप व्याकरणतः ‘धर्मी जन’ और ‘धार्मिक/न्यायपूर्ण वस्तु या कार्य’ के बीच कुछ अस्पष्टता रखता है। मुख्य पाठ व्यक्ति-सूचक पाठ ग्रहण करता है, पर वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: जीवितों की पुस्तकों में लिखा जाना
  choice: उसका नाम जीवितों की पुस्तकों में लिखा जाएगा
  alternative: वह जीवितों की पुस्तकों में अंकित होगा
  rationale: दोनों रूप मूल अर्थ देते हैं; चुना हुआ रूप आधुनिक हिन्दी पाठक के लिए अधिक सहज है और किसी अतिरिक्त उद्धार-सिद्धांत को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और वाचनयोग्य शैली रखी गई है। ‘सहभागी’, ‘त्याग’ और ‘जीवितों की पुस्तकें’ जैसे पद मूल की धार्मिक छवि और अर्थ को बनाए रखते हैं।
