  text: 10. Blessed are those who have and understand that they are made rich by the Lord; for those who think this way will be able to do some good.
translation:
  language: hi
  text: 10. धन्य हैं वे जिनके पास धन है और जो समझते हैं कि प्रभु ही उन्हें धनी बनाता है; क्योंकि जो ऐसा सोचते हैं, वे भलाई का कुछ काम कर सकेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἔχοντες
  choice: जिनके पास धन है
  rationale: शाब्दिक अर्थ ‘जिनके पास है’ है; निकटवर्ती संदर्भ में विषय धनवानों और उनके धन का है, इसलिए हिन्दी में आशय स्पष्ट किया गया है।
- source_word: παρὰ τοῦ Κυρίου πλουτίζονται
  choice: उन्हें प्रभु ने धनी बनाया है
  rationale: वाक्यांश धन का स्रोत प्रभु को बताता है; सहज हिन्दी में कर्मवाच्य भाव को स्पष्ट कर्तृवाच्य रूप दिया गया है।
- source_word: ταῦτα φρονοῦντες
  choice: जो ऐसी समझ रखते हैं
  rationale: φρονέω यहाँ केवल विचार करने के बजाय एक मान्यता या अंतर्दृष्टि को मन में धारण करने का भाव रखता है।
- source_word: ἀγαθόν τι ἐργάζεσθαι
  choice: कोई भला काम कर सकेंगे
  rationale: τι की अनिश्चितता ‘कोई’ से और ἀγαθόν के नैतिक-सकारात्मक अर्थ को ‘भला’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: धन का स्रोत और उसका नैतिक उपयोग
  choice: धन को प्रभु से मिला मानने की समझ भला काम करने की क्षमता से जोड़ी गई है।
  alternative: इसे सांसारिक समृद्धि की सार्वभौमिक प्रतिज्ञा के रूप में व्यक्त करना।
  rationale: यूनानी पाठ वर्तमान धनवानों से संबंधित है और उनका ध्यान धन के प्रभु-प्रदत्त होने तथा उससे भलाई करने पर लगाता है; वह सभी के लिए धन की प्रतिज्ञा नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। संदर्भ के कारण अस्पष्ट ‘जिनके पास है’ को ‘जिनके पास धन है’ किया गया है, जबकि ‘कोई भला काम’ में मूल की अनिश्चितता बनाए रखी गई है।
