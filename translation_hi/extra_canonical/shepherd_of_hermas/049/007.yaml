base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/007.yaml
  text: 3. “For just as in winter the trees, having cast off their leaves, are alike, and it is not apparent which are dry or which are living, so in this age neither the righteous nor the sinners are apparent, but all are alike.”
translation:
  language: hi
  text: 3. “क्योंकि जैसे सर्दी में पत्ते झाड़ चुके पेड़ एक-जैसे दिखाई देते हैं, और यह पता नहीं चलता कि कौन-से सूखे हैं और कौन-से जीवित, वैसे ही इस युग में न तो धर्मी पहचाने जाते हैं, न पापी; बल्कि सभी एक-जैसे दिखाई देते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμών
  choice: सर्दी
  rationale: पेड़ों के पत्ते झड़ने के प्राकृतिक रूपक के संदर्भ में यह सामान्य और सहज आधुनिक हिन्दी है।
- source_word: ἀποβεβληκότα τὰ φύλλα
  choice: पत्ते झाड़ चुके
  rationale: ग्रीक पूर्ण कृदंत पत्तों के पहले ही झड़ जाने से बनी वर्तमान दशा को व्यक्त करता है।
- source_word: οὐ φαίνονται
  choice: पहचाने जाते
  rationale: यहाँ आशय केवल दिखाई देने से नहीं, बाहरी रूप से धर्मी और पापी का भेद प्रकट न होने से है।
- source_word: ὅμοιά / ὅμοιοί
  choice: एक-जैसे दिखाई देते हैं
  rationale: रूपक में प्रत्यक्ष बाहरी समानता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: αἰών
  choice: युग
  rationale: समय-व्यवस्था और वर्तमान संसार-काल, दोनों अर्थों की धर्मवैचारिक व्यापकता बनाए रखता है।
- source_word: δίκαιοι
  choice: धर्मी
  rationale: नैतिक और धार्मिक अर्थ वाला प्रचलित बाइबलीय हिन्दी शब्द।
- source_word: ἁμαρτωλοί
  choice: पापी
  rationale: ग्रीक संज्ञा का सीधा, स्पष्ट और प्रचलित समतुल्य।
theological_decisions:
- issue: वर्तमान युग में धर्मियों और पापियों का अप्रकट भेद
  choice: “न तो धर्मी पहचाने जाते हैं, न पापी”
  alternative: “न तो धर्मी दिखाई देते हैं, न पापी”
  rationale: वाक्य का अर्थ उनके अस्तित्व या दृश्यता का निषेध नहीं, बल्कि दोनों वर्गों के बीच भेद का अभी स्पष्ट न होना है; ‘पहचाने जाते’ इस तनाव को बिना भविष्य के न्याय का अतिरिक्त विवरण जोड़े सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वृक्षों के रूपक और वर्तमान युग में नैतिक पहचान की अस्पष्टता को स्पष्ट किया गया है, पर पाठ से बाहर की धर्मवैचारिक व्याख्या नहीं जोड़ी गई।
