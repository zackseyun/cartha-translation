  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/001.yaml
  text: …they make their wealth complete, and in turn the rich, by supplying the poor with the things they need, make their souls complete.
translation:
  language: hi
  text: …वे अपने धन को पूर्ण करते हैं, और फिर धनी लोग निर्धनों को उनकी आवश्यक वस्तुएँ उपलब्ध कराकर अपने प्राणों को पूर्ण करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληροφοροῦσι
  choice: पूर्ण करते हैं
  rationale: क्रिया दोनों खंडों में दोहराई गई है और यहाँ किसी कमी को पूरा करने अथवा पूर्णता तक पहुँचाने का भाव रखती है; एक ही हिन्दी अभिव्यक्ति रखकर मूल का समानांतर विन्यास सुरक्षित किया गया है।
- source_word: πλοῦτον
  choice: धन
  rationale: यह πλοῦτος का सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: χορηγοῦντες
  choice: देकर
  rationale: संदर्भ में इसका अर्थ आवश्यक वस्तुओं को उदारतापूर्वक उपलब्ध कराना है; सहज हिन्दी के लिए संक्षिप्त रूप चुना गया है।
- source_word: τοῖς πένησι
  choice: निर्धनों को
  rationale: πένης ऐसे व्यक्ति को दर्शाता है जिसके पास आवश्यक साधनों की कमी है; ‘निर्धन’ dignified और स्पष्ट है।
- source_word: τὰ δέοντα
  choice: उनकी आवश्यक वस्तुएँ
  rationale: शाब्दिक भाव ‘जो आवश्यक है’ है; हिन्दी में संदर्भ के अनुसार आवश्यक सामग्री/वस्तुओं का अर्थ स्पष्ट किया गया है।
- source_word: τὰς ψυχὰς αὐτῶν
  choice: अपने प्राणों को
  rationale: ψυχή की व्यापक मानवीय और धार्मिक अर्थच्छाया को बनाए रखने के लिए ‘प्राण’ चुना गया है; ‘आत्माओं’ कहने से बाद की दार्शनिक धारणा अनावश्यक रूप से आरोपित हो सकती थी।
theological_decisions:
- issue: धन और प्राण को ‘पूर्ण’ करने का पारस्परिक संबंध
  choice: दोनों स्थानों पर ‘पूर्ण करते हैं’ रखा गया है।
  alternative: पहले ‘धन की कमी पूरी करते हैं’ और दूसरे ‘अपने प्राणों को तृप्त करते हैं’।
  rationale: मूल में एक ही क्रिया πληροφοροῦσι दोनों कर्मों के साथ प्रयुक्त है। अलग-अलग व्याख्यात्मक क्रियाएँ चुनने से लेखक का जानबूझकर रखा गया पारस्परिक और कुछ हद तक रहस्यमय समानांतर संबंध मिट जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। आरंभ का दीर्घविराम स्रोत-खंड के पिछले वाक्य से जुड़े होने को दर्शाता है। मूल की पुनरावृत्ति और अर्थगत तनाव को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
