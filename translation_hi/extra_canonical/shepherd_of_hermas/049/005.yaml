base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/005.yaml
  text: 1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir, that they are alike and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age.”
translation:
  language: hi
  text: 1. उसने मुझे बहुत-से पेड़ दिखाए जिन पर पत्ते नहीं थे, पर वे मुझे सूखे-से दिखाई दिए, क्योंकि वे सब एक जैसे थे। उसने मुझसे कहा, “क्या तुम इन पेड़ों को देखते हो?” मैंने कहा, “मैं देखता हूँ, स्वामी; वे सभी एक जैसे और सूखे हैं।” उसने मुझे उत्तर दिया, “ये पेड़, जिन्हें तुम देखते हो, वे लोग हैं जो इस युग में रहते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρα
  choice: पेड़
  rationale: सामान्य आधुनिक हिन्दी में सहज और स्पष्ट; रूपक की ठोस छवि बनाए रखता है।
- source_word: ὡσεὶ ξηρά
  choice: सूखे हुए-से
  rationale: ὡσεὶ की तुलनात्मक अनिश्चितता को बनाए रखता है; पेड़ वक्ता को सूखे प्रतीत होते हैं, उन्हें अभी निर्णायक रूप से मृत नहीं बताया गया।
- source_word: κύριε
  choice: स्वामी
  rationale: दृष्टान्त में सम्मानपूर्ण संबोधन है; यहाँ इसे सीधे परमेश्वर के लिए प्रयुक्त उपाधि मानकर धार्मिक अर्थ थोपना उचित नहीं।
- source_word: ὁ αἰὼν οὗτος
  choice: यह युग
  rationale: αἰών के कालगत और धर्मवैचारिक अर्थ को ‘संसार’ की अपेक्षा अधिक ठीक रूप से सुरक्षित रखता है।
- source_word: οἱ κατοικοῦντες
  choice: वे लोग जो ... रहते हैं
  rationale: निवास करने के सामान्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सूखे पेड़ों की स्थिति
  choice: ‘सूखे हुए-से लगे’
  alternative: ‘सूखे थे’
  rationale: मूल में ὡσεὶ और ἐδόκει μοι दोनों दृश्य-प्रतीति दर्शाते हैं; आगे धर्मियों और पापियों का अभी अलग न दिखाई देना इसी तनाव पर निर्भर है।
- issue: αἰών का अनुवाद
  choice: ‘युग’
  alternative: ‘संसार’
  rationale: ‘युग’ वर्तमान काल-व्यवस्था और आने वाले युग के अंतर्निहित विरोध को सुरक्षित रखता है, बिना उसे केवल भौतिक संसार बना देने के।
- issue: κύριε की पहचान
  choice: ‘स्वामी’
  alternative: ‘प्रभु’
  rationale: संवाद में संबोधित व्यक्ति की पहचान को इस वाक्य में आवश्यकता से अधिक निश्चित नहीं किया गया; ‘स्वामी’ सम्मान और कथात्मक अस्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। प्रत्यक्ष संवाद को सहज हिन्दी क्रम में प्रस्तुत किया गया है, जबकि यूनानी मूल की पुनरुक्ति और पेड़ों के ‘एक-जैसे’ दिखने पर दिया गया बल सुरक्षित रखा गया है।
