base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/006.yaml
  text: 2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous nor the sinners are visible in this age, but they are alike; for this age is winter for the righteous, and they are not visible while dwelling among sinners.”
translation:
  language: hi
  text: 2. मैंने कहा, “तो फिर, स्वामी, ये सूखे-से और एक जैसे क्यों हैं?” उन्होंने उत्तर दिया, “क्योंकि इस युग में न तो धर्मी पहचाने जाते हैं, न पापी; वे एक जैसे दिखाई देते हैं। दरअसल, यह युग धर्मियों के लिए शीत ऋतु है, और पापियों के बीच रहते हुए वे पहचाने नहीं जाते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: प्रभु
  rationale: संबोधन में आदर और स्वामी-सदृश अधिकार दोनों व्यक्त होते हैं; इस रचना के दर्शन-संवाद में यह स्वाभाविक है।
- source_word: ὡσεὶ ξηρά
  choice: सूखे-से
  rationale: ὡσεὶ की तुलनात्मक अनिश्चितता बनाए रखता है; पेड़ देखने में सूखे लगते हैं, आवश्यक नहीं कि वास्तव में मृत हों।
- source_word: φαίνονται
  choice: पहचाने जाते हैं / दिखाई देते हैं
  rationale: यहाँ आशय केवल दृष्टिगोचर होने का नहीं, धर्मी और पापी के रूप में प्रकट या पहचाने जाने का है। हिंदी में प्रसंगानुसार दोनों अभिव्यक्तियाँ प्रयुक्त हैं।
- source_word: αἰών
  choice: युग
  rationale: वर्तमान विश्व-व्यवस्था और काल—दोनों अर्थों को समेटने वाला प्रचलित धार्मिक-साहित्यिक शब्द।
- source_word: χειμών
  choice: शीत ऋतु
  rationale: पेड़ों के रूपक को स्पष्ट रखता है और अगले वाक्य में धर्मियों के अप्रकट रहने का आधार बनता है।
theological_decisions:
- issue: इस युग में धर्मियों और पापियों का अप्रकट भेद
  choice: “न तो धर्मी पहचाने जाते हैं, न पापी; वे एक जैसे दिखाई देते हैं”
  alternative: “न धर्मी दिखाई देते हैं, न पापी”
  rationale: ग्रीक φαίνονται का शाब्दिक अर्थ ‘दिखाई देते हैं’ है, पर लोग स्वयं अदृश्य नहीं हैं; रूपक में उनका वास्तविक नैतिक स्वरूप अलग से पहचाना नहीं जाता। अनुवाद इस तनाव को स्पष्ट करता है, बिना अंतिम न्याय या उद्धार के विषय में अतिरिक्त दावा जोड़े।
- issue: धर्मियों का पापियों के साथ निवास
  choice: “पापियों के बीच रहते हुए”
  alternative: “पापियों के साथ रहते हुए”
  rationale: μετὰ τῶν ἁμαρτωλῶν दोनों की सह-अवस्थिति बताता है; ‘बीच’ आधुनिक हिंदी में इस संसार में मिले-जुले निवास के भाव को स्वाभाविक रूप से व्यक्त करता है और संगति या सहभागिता का अनावश्यक संकेत नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्नोत्तर की मौखिक लय बनाए रखी गई है। पेड़ों के शीतकालीन रूपक के कारण ‘सूखे-से’, ‘एक जैसे’ और ‘शीत ऋतु’ को प्रत्यक्ष रखा गया है।
