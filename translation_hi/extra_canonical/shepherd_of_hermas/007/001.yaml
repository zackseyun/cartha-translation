base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/001.yaml
  text: But you, Hermas, no longer bear a grudge against your children, nor allow your sister to continue, so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline, if you do not bear a grudge against them. Bearing a grudge produces death. But you, Hermas, have had great personal tribulations because of the transgressions of your household, because you did not care for them, but neglected them and became entangled in your wicked business dealings.
translation:
  language: hi
  text: परन्तु हे हेरमास, अब अपने बच्चों के प्रति मन में बैर न रखना, और न अपनी बहन को उसके हाल पर छोड़ना, ताकि वे अपने पिछले पापों से शुद्ध किए जाएँ। क्योंकि यदि तुम उनके प्रति मन में बैर नहीं रखोगे, तो उन्हें न्यायसंगत अनुशासन दिया जाएगा। मन में बैर रखना मृत्यु को जन्म देता है। परन्तु हे हेरमास, तुमने अपने घराने के अपराधों के कारण बड़े व्यक्तिगत कष्ट सहे हैं, क्योंकि तुमने उनकी परवाह नहीं की, बल्कि उनकी उपेक्षा की और अपने बुरे कारोबारों में उलझ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησικακήσῃς / μνησικακία
  choice: मन में बैर रखना
  rationale: यह क्रिया और संज्ञा पुराने अपकार को याद रखकर द्वेष पालने का भाव व्यक्त करती हैं; समान हिन्दी अभिव्यक्ति की पुनरावृत्ति मूल के शब्द-संबंध को बनाए रखती है।
- source_word: τὴν ἀδελφήν σου ἐάσῃς
  choice: अपनी बहन को यूँ ही छोड़ देना
  rationale: ἐάω का अर्थ यहाँ किसी को उसके वर्तमान आचरण में बिना हस्तक्षेप जारी रहने देना हो सकता है। मूल में कर्म के बाद पूरक क्रिया अनकही है, इसलिए अनुवाद उस अस्पष्टता को पूरी तरह नहीं भरता।
- source_word: παιδευθήσονται ... παιδείᾳ δικαίᾳ
  choice: उन्हें न्यायपूर्ण अनुशासन दिया जाएगा
  rationale: παιδεύω/παιδεία में शिक्षा, सुधार और दंडात्मक अनुशासन का संयुक्त भाव है; ‘अनुशासन’ इस दायरे को अपेक्षाकृत सुरक्षित रखता है।
- source_word: ἰδιωτικὰς
  choice: निजी
  rationale: यह विशेषण क्लेशों को हेरमास के व्यक्तिगत या घरेलू जीवन से संबंधित बताता है; ‘निजी’ संक्षिप्त और स्वाभाविक है।
- source_word: παρενεθυμήθης
  choice: उपेक्षा की
  rationale: दुर्लभ क्रिया का प्रसंगगत आशय ध्यान न देना या उपेक्षित करना है; यह पहले आए ‘परवाह नहीं की’ को तीव्र करता है।
- source_word: πραγματείαις ... πονηραῖς
  choice: बुरे कारोबारों
  rationale: πραγματεία व्यापारिक या सांसारिक लेन-देन को सूचित कर सकता है और πονηρός उसे नैतिक रूप से बुरा ठहराता है; ‘कारोबार’ आधुनिक पाठक के लिए सहज है।
- source_word: συνανεφύρης
  choice: उलझे रहे
  rationale: क्रिया घुल-मिल जाने या अपने को उलझा लेने का भाव देती है; प्रसंग में अनैतिक व्यावसायिक व्यस्तता से फँस जाना अभिप्रेत है।
theological_decisions:
- issue: परिवार की शुद्धि और हेरमास के द्वेष-त्याग का संबंध
  choice: ‘ताकि वे ... शुद्ध किए जाएँ’ और ‘यदि तुम ... बैर नहीं रखोगे’ को मूल के शर्त/उद्देश्य संबंध सहित रखा गया
  alternative: इसे इस प्रकार स्पष्ट करना कि हेरमास स्वयं उन्हें क्षमा करके पापमुक्त करता है
  rationale: यूनानी कर्मवाच्य में शुद्ध करने और अनुशासन देने वाले कर्ता का उल्लेख नहीं है। अनुवाद किसी विशिष्ट प्रायश्चित्त या क्षमादान-सिद्धांत को आरोपित नहीं करता।
- issue: ‘न्यायपूर्ण अनुशासन’ का स्वरूप
  choice: सुधारात्मक और दंडात्मक दोनों संभावनाओं वाला ‘अनुशासन’
  alternative: ‘न्यायोचित दंड’ या केवल ‘शिक्षा’
  rationale: παιδεία का अर्थ-क्षेत्र दोनों को समेटता है; किसी एक पहलू को निर्णायक बनाना मूल की व्यापकता घटा देता।
- issue: ‘मन में बैर रखना मृत्यु को जन्म देता है’
  choice: ‘मृत्यु’ को बिना व्याख्यात्मक विशेषण के रखा गया
  alternative: ‘आत्मिक मृत्यु’ या ‘अनन्त मृत्यु’
  rationale: मूल केवल θάνατον कहता है; उसका सटीक धार्मिक विस्तार यहाँ स्पष्ट नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ शैली अपनाई गई है। सम्बोधन में ‘हे हेरमास’ मूल के प्रत्यक्ष संबोधन को दर्शाता है। यूनानी की पुनरावृत्ति, कारण-सूचक वाक्य-क्रम और कर्मवाच्य जहाँ संभव था सुरक्षित रखे गए हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
