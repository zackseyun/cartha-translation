    issue: ‘यूँ ही छोड़ देना’
    rationale: This phrasing is colloquial and underspecifies the contextual force of ἐάσῃς. The source leaves the sister’s precise conduct unstated, but the prohibition concerns allowing her to remain as she is; ‘उसके हाल पर छोड़ना’ expresses this without inventing the conduct.
