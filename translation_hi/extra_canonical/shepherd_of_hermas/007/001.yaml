review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the addressed prohibition, the purpose of cleansing from former sins, the conditional righteous discipline, the death-producing character of grudge-bearing, and Hermas's household-related troubles. The object-only Greek expression concerning the sister is deliberately elliptical; “यूँ ही” adds a colloquial nuance not present in the source and does not clearly convey the likely sense of leaving her to continue in her present state.
  naturalness: The Hindi is generally fluent and appropriately dignified. “अपनी बहन को उसके हाल पर न छोड़ना” is more natural than “यूँ ही छोड़ देना” while retaining the source’s unexpressed detail. “न्यायसंगत अनुशासन” is idiomatic modern Hindi and preserves the broad corrective/disciplinary range of παιδεία.
  terminology: “मन में बैर रखना” consistently represents μνησικακέω/μνησικακία well. “शुद्ध किए जाएँ,” “अनुशासन,” “अपराध,” and “बुरे कारोबार” are suitable and do not impose a doctrinal interpretation. No footnotes are needed for this reader segment.
  issues:
