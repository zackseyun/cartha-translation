  text: Blessed are all who practice righteousness; they will never be destroyed.
translation:
  language: hi
  text: धन्य हैं वे सभी जो धार्मिकता का आचरण करते हैं; वे कभी नष्ट नहीं होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह आशीर्वचन की पारंपरिक और स्वाभाविक हिन्दी अभिव्यक्ति है; इसमें परमेश्वर की दृष्टि में अनुगृहीत और सुखी होने का भाव बना रहता है।
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: जो धार्मिकता के काम करते हैं
  rationale: ἐργάζομαι के सक्रिय आचरण और δικαιοσύνη के नैतिक-धार्मिक अर्थ दोनों को स्पष्ट रखता है; केवल ‘धर्मी हैं’ कहने से कर्म का पहलू खो जाता।
- source_word: οὐ διαφθαρήσονται
  choice: नष्ट न होंगे
  rationale: भविष्यकालीन निषेध और ‘विनाश/भ्रष्ट होकर मिट जाने’ के मूल भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἕως αἰῶνος
  choice: सदा तक
  rationale: दीर्घ अथवा अनंत काल तक बने रहने का अर्थ देता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: धार्मिकता के कर्म और अंतिम अविनाश के बीच संबंध
  choice: मूल वाक्य की सीधी प्रतिज्ञा को बनाए रखा गया है।
  alternative: इसे केवल विश्वास, अनुग्रह, या किसी विशिष्ट उद्धार-सिद्धांत की व्याख्यात्मक शर्त से सीमित करना।
  rationale: यूनानी पाठ ऐसी अतिरिक्त शर्त स्पष्ट नहीं करता; इसलिए उसके नैतिक आग्रह और धर्मवैज्ञानिक तनाव को बिना सांप्रदायिक विस्तार के सुरक्षित रखा गया है।
- issue: ἕως αἰῶνος की कालगत सीमा
  choice: ‘सदा तक’
  alternative: ‘इस युग के अंत तक’ या ‘अनंत काल तक’
  rationale: यह चयन मूल मुहावरे की व्यापकता बनाए रखता है और उस पर अत्यधिक निश्चित काल-सिद्धांत नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण आशीर्वचन-शैली। ‘धार्मिकता के काम करते हैं’ सामान्य पाठक के लिए स्पष्ट है और यूनानी के सक्रिय नैतिक अर्थ को सुरक्षित रखता है।
