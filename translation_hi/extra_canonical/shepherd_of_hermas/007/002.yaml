base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/002.yaml
  text: But what saves you is that you did not depart from the living God, and your simplicity and great self-control. These have saved you, if you continue in them, and they save all who do such things and who walk in innocence and simplicity. These prevail over all wickedness and remain unto eternal life.
translation:
  language: hi
  text: परन्तु जीवित परमेश्वर से न हटना, तुम्हारी निष्कपटता और तुम्हारा बहुत संयम तुम्हें बचाते हैं। यदि तुम इनमें स्थिर बने रहो, तो इन्हीं ने तुम्हें बचाया है; और ये उन सबको बचाते हैं जो ऐसे काम करते हैं और निर्दोषता तथा निष्कपटता में चलते हैं। वे हर प्रकार की बुराई पर विजय पाते हैं और अनन्त जीवन तक स्थिर रहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μὴ ἀποστήναι σε ἀπὸ Θεοῦ ζῶντος
  choice: तुम जीवित परमेश्वर से दूर नहीं हुए
  rationale: ἀφίστημι यहाँ परमेश्वर को त्यागने अथवा उससे विमुख होने का भाव रखता है; ‘दूर नहीं हुए’ सहज हिन्दी में इस संबंधपरक अर्थ को बनाए रखता है।
- source_word: ἁπλότης
  choice: निष्कपटता
  rationale: यहाँ सरल, अखंड और छलरहित चरित्र अभिप्रेत है; ‘निष्कपटता’ आधुनिक हिन्दी में नैतिक आशय को स्पष्ट रखती है।
- source_word: ἐγκράτεια
  choice: संयम
  rationale: शब्द आत्म-नियंत्रण या इन्द्रिय-संयम को सूचित करता है; ‘संयम’ व्यापक अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ἀκακία
  choice: निर्दोषता
  rationale: ἀκακία बुराई या दुर्भाव से रहित होने का भाव देती है; ‘निर्दोषता’ पठनीय है और साथ आए ἁπλότης से भिन्नता भी रखती है।
- source_word: κατισχύουσιν
  choice: विजय पाते हैं
  rationale: क्रिया प्रबल होने या परास्त करने का अर्थ देती है; बुराई पर ‘विजय पाते हैं’ स्वाभाविक और सशक्त हिन्दी है।
- source_word: παραμένουσιν εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए बने रहते हैं
  rationale: εἰς की दिशात्मक/परिणामी अस्पष्टता को ‘के लिए’ कुछ हद तक सुरक्षित रखा गया है; इसे सीधे ‘अनन्त जीवन पाते हैं’ नहीं बनाया गया।
theological_decisions:
- issue: मानवीय आचरण और उद्धार के बीच संबंध
  choice: ‘इन्हीं बातों ने तुम्हें बचाया है ... और ये ... बचाती हैं’
  alternative: ‘इनके कारण तुम सुरक्षित रहे हो’ अथवा केवल आध्यात्मिक संरक्षण के रूप में अनुवाद
  rationale: ग्रीक σῴζει/σέσωκεν स्पष्ट रूप से ‘बचाना’ कहता है और पाठ स्वयं परमेश्वर से न हटने, निष्कपटता तथा संयम को इस बचाव से जोड़ता है। संभावित धर्मवैज्ञानिक तनाव को समझाकर हल नहीं किया गया।
- issue: शर्तसूचक ἐὰν ἐμμένῃς
  choice: ‘यदि तुम इनमें स्थिर बने रहो’
  alternative: ‘जब तक तुम इनमें स्थिर रहोगे’
  rationale: मूल में वास्तविक शर्त है; ‘यदि’ उस शर्त और निरंतरता की आवश्यकता दोनों को बनाए रखता है।
- issue: अनन्त जीवन से संबंध
  choice: ‘अनन्त जीवन के लिए बने रहते हैं’
  alternative: ‘अनन्त जीवन तक बने रहते हैं’ या ‘अनन्त जीवन में बने रहते हैं’
  rationale: ग्रीक εἰς ζωὴν αἰώνιον लक्ष्य, परिणाम या प्रवेश की दिशा सूचित कर सकता है। चुना गया रूप किसी एक व्यवस्थित धर्मवैज्ञानिक अर्थ को कठोरता से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निष्कपटता’, ‘संयम’ और ‘निर्दोषता’ जैसे नैतिक पदों के बीच मूल की अर्थगत भिन्नता बनाए रखी गई है।
