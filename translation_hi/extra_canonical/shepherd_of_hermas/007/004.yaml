base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/004.yaml
  text: 'And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny again. The Lord is near to those who turn to him, as it is written in Eldad and Modat, who prophesied to the people in the wilderness.'
translation:
  language: hi
  text: और मैक्सिमस से कहना, “देखो, क्लेश आने वाला है—यदि तुम्हें फिर से इनकार करना ही ठीक लगे।” प्रभु उन लोगों के निकट है जो उसकी ओर मुड़ते हैं, जैसा एलदाद और मोदात में लिखा है—उन्होंने निर्जन प्रदेश में लोगों से भविष्यवाणी की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψις
  choice: क्लेश
  rationale: यह शब्द आने वाली पीड़ा, संकट या उत्पीड़न की व्यापकता बनाए रखता है और धार्मिक साहित्य में स्वाभाविक है।
- source_word: ἀρνεῖσθαι
  choice: इनकार करना
  rationale: ग्रीक में कर्म स्पष्ट नहीं है; अनुवाद भी यह नहीं जोड़ता कि इनकार किसका किया जाएगा। प्रसंगतः विश्वास का त्याग संभव है, पर उसे पाठ में आरोपित नहीं किया गया।
- source_word: τοῖς ἐπιστρεφομένοις
  choice: जो उसकी ओर फिरते हैं
  rationale: ἐπιστρέφω के मुड़ने/लौटने के भाव और पश्चात्ताप-संबंधी संकेत दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: ἐρήμος का अर्थ जंगल नहीं, बल्कि उजाड़ या निर्जन भूभाग है; यह आधुनिक पाठक के लिए अधिक सटीक है।
- source_word: τῷ λαῷ
  choice: लोगों के लिए
  rationale: ग्रीक दत्तिव को भविष्यवाणी के संबोधित समुदाय के रूप में लिया गया है; 'लोगों से' भी संभव है।
theological_decisions:
- issue: ἐάν सοι δοκῇ πάλιν ἀρνεῖσθαι की शर्त और व्यंग्यात्मक धार
  choice: यदि तुम्हें फिर से इनकार करना ही ठीक लगे
  alternative: यदि तुम फिर से इनकार करने का निश्चय करो
  rationale: शाब्दिक रूप से 'यदि तुम्हें उचित/अच्छा लगे' है। चुना हुआ रूप चेतावनी की तीखी, संभवतः व्यंग्यात्मक धार बचाता है और इसे केवल तटस्थ निर्णय में नहीं बदलता।
- issue: प्रभु के निकट होने का संबंध
  choice: जो उसकी ओर फिरते हैं
  alternative: जो मन फिराते हैं
  rationale: मूल में लौटने की दिशा निहित है, जबकि 'मन फिराना' पश्चात्ताप को स्पष्ट करता पर स्थानिक/संबंधात्मक बिंब को कुछ घटाता।
- issue: Eldad and Modat का ग्रंथ-संदर्भ
  choice: जैसा एलदाद और मोदात में लिखा है
  alternative: जैसा एलदाद और मोदात के ग्रंथ में लिखा है
  rationale: मूल केवल नामों के साथ 'में' कहता है और किसी ग्रंथ-प्रकार को स्पष्ट नहीं करता; इसलिए 'ग्रंथ' नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। प्रत्यक्ष वचन में चेतावनी की तीव्रता रखी गई है। नामों का लिप्यंतरण ग्रीक रूप Ἐλδὰδ καὶ Μωδὰτ के अनुसार 'एलदाद और मोदात' किया गया है।
