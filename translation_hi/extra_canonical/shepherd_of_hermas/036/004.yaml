base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/004.yaml
  text: Therefore cleanse your heart from all the vanities of this age and from the words previously spoken to you, and ask from the Lord; and you will receive everything, and you will lack nothing in any of your petitions, if you ask from the Lord without doubting.
translation:
  language: hi
  text: इसलिए अपने हृदय को इस युग की सारी व्यर्थताओं और उन बातों से शुद्ध करो जो तुमसे पहले कही गई हैं। प्रभु से माँगो, और तुम्हें सब कुछ मिलेगा; यदि तुम प्रभु से बिना संदेह किए माँगोगे, तो तुम्हारी कोई भी विनती अधूरी नहीं रहेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ματαιωμάτων
  choice: व्यर्थ बातों
  rationale: यह बहुवचन इस युग की खोखली, निष्फल और ध्यान भटकाने वाली वस्तुओं या चिंताओं को समेटता है; सामान्य पाठक के लिए ‘व्यर्थ बातों’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: αἰτοῦ / αἰτημάτων
  choice: माँगो / विनती
  rationale: क्रिया के लिए सहज ‘माँगो’ और संज्ञा के लिए प्रार्थनापरक संदर्भ में ‘विनती’ रखा गया है।
- source_word: ἀνυστέρητος
  choice: अधूरी नहीं रहेगी
  rationale: शाब्दिक भाव ‘वंचित/रहित न होना’ है; संदर्भ में इसका आशय है कि माँगी हुई बातों में कोई विनती अपूर्ण या निष्फल न रहे।
- source_word: ἀδιστάκτως
  choice: बिना संदेह किए
  rationale: यहाँ शब्द हृदय के डगमगाने या दुविधा में पड़ने के विपरीत निश्चयपूर्ण माँगने को दर्शाता है।
theological_decisions:
- issue: ‘सब कुछ मिलेगा’ और प्रार्थना की प्रतिज्ञा की व्यापकता
  choice: मूल कथन की व्यापकता को ज्यों का त्यों रखा गया
  alternative: इसे ‘परमेश्वर की इच्छा के अनुसार सब कुछ’ कहकर सीमित करना
  rationale: ग्रीक पाठ इस पद में ऐसी स्पष्ट सीमा नहीं जोड़ता; इसलिए किसी बाद की धर्मवैचारिक व्याख्या को अनुवाद में नहीं मिलाया गया।
- issue: ‘पहले कही गई बातें’ का संदर्भ
  choice: अनिर्दिष्ट संदर्भ बनाए रखा गया
  alternative: इसे विशेष रूप से पूर्ववर्ती आज्ञाओं, चेतावनियों या संदेहपूर्ण विचारों के रूप में पहचानना
  rationale: τῶν προειρημένων σοί ῥημάτων स्वयं अस्पष्ट है; अनुवाद ने इस वास्तविक अस्पष्टता को सुरक्षित रखा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। संबोधन एकवचन ‘तुम’ रखा गया है, क्योंकि यूनानी में संबोधन एकवचन है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए लंबे यूनानी वाक्य को दो वाक्यों में बाँटा गया है।
