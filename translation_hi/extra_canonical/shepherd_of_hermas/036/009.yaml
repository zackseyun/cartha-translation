base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/009.yaml
  text: 'Look at this double-mindedness: for it is evil and senseless, and it uproots many from the faith, even those who are very faithful and strong. For this double-mindedness is a daughter of the devil, and it acts very wickedly toward the servants of God.'
translation:
  language: hi
  text: 'इस दुचित्तेपन को देखो: यह दुष्ट और विवेकहीन है, और बहुतों को विश्वास से जड़ समेत उखाड़ देता है—यहाँ तक कि ऐसे लोगों को भी जो विश्वास में बहुत दृढ़ और मजबूत हैं। क्योंकि यह दुचित्तापन शैतान की बेटी है और परमेश्वर के सेवकों के विरुद्ध बहुत दुष्टता से काम करता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: दुचित्तापन
  rationale: यह शब्द मन के दो ओर बँटे होने, संशय और अस्थिरता का भाव रखता है। ‘दुचित्तापन’ मूल रूपक को बनाए रखते हुए प्रसंग में समझने योग्य है।
- source_word: ἀσύνετος
  choice: विवेकहीन
  rationale: यह केवल बौद्धिक मूर्खता नहीं, बल्कि समझ और उचित निर्णय के अभाव को व्यक्त करता है।
- source_word: ἐκριζοῖ
  choice: जड़ समेत उखाड़ देता है
  rationale: क्रिया के सशक्त कृषि-रूपक को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: λίαν πιστοὺς καὶ ἰσχυρούς
  choice: अत्यन्त विश्वासयोग्य और दृढ़ लोगों
  rationale: πιστούς का अर्थ यहाँ विश्वास में पक्के अथवा विश्वासयोग्य दोनों हो सकता है; यह चुनाव मूल की प्रशंसात्मक शक्ति को रखता है, जबकि ‘दृढ़’ ἰσχυρούς को प्रसंगानुकूल व्यक्त करता है।
- source_word: πονηρεύεται εἰς
  choice: के विरुद्ध बहुत दुष्टता से काम करता है
  rationale: यह अभिव्यक्ति लक्षित दुष्ट आचरण का संकेत देती है; अनावश्यक रूप से ‘षड्यंत्र’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: दुचित्तेपन का ‘शैतान की बेटी’ होना
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: ‘शैतान से उत्पन्न है’
  rationale: मूल पाठ दुचित्तेपन को व्यक्तित्व देकर θυγάτηρ (‘बेटी’) कहता है। इसे सामान्यीकृत करने से पाठ की तीव्रता और साहित्यिक छवि घट जाती।
- issue: विश्वास से उखाड़े जाने वाले दृढ़ विश्वासी
  choice: पाठ के तनाव को यथावत रखा गया
  alternative: इसे केवल ऊपर से विश्वासी दिखने वालों तक सीमित करना
  rationale: मूल स्पष्ट रूप से ‘अत्यन्त विश्वासयोग्य और दृढ़’ लोगों का उल्लेख करता है; किसी धर्मवैचारिक निष्कर्ष के लिए इस कथन को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, चेतावनीपूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘दुचित्तापन’ मुख्य पारिभाषिक शब्द के रूप में लगातार रखा गया है; रूपक और धर्मवैचारिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
