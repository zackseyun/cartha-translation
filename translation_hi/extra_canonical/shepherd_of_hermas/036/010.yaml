base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/010.yaml
  text: Therefore despise double-mindedness and master it in every matter, having put on the strong and mighty faith. For faith promises all things and accomplishes all things, but double-mindedness, because it does not trust, fails in all the works that it does.
translation:
  language: hi
  text: इसलिए दुविधा को तुच्छ जानो और हर मामले में उस पर प्रभुत्व करो; दृढ़ और सामर्थी विश्वास को धारण कर लो। क्योंकि विश्वास सब कुछ का वचन देता है और सब कुछ पूरा करता है; पर दुविधा, जो अपने ही ऊपर भरोसा नहीं रखती, अपने किए हुए सभी कामों में असफल रहती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: दुविधा
  rationale: शाब्दिक अर्थ ‘दो मन का होना’ है; यहाँ प्रार्थना और विश्वास में डगमगाहट तथा अनिर्णय को व्यक्त करने के लिए ‘दुविधा’ स्वाभाविक और सुसंगत है।
- source_word: κατακυρίευσον
  choice: अपने वश में रखो
  rationale: क्रिया का अर्थ प्रभुत्व जमाना या पूरी तरह नियंत्रित करना है; यह आधुनिक हिन्दी में आदेश की शक्ति बनाए रखता है।
- source_word: ἐνδυσάμενος
  choice: धारण कर लो
  rationale: मूल रूपक वस्त्र पहनने का है; ‘धारण करना’ हिन्दी में उस रूपक को गरिमापूर्ण और बोधगम्य ढंग से सुरक्षित रखता है।
- source_word: ἰσχυρὰν καὶ δυνατήν
  choice: दृढ़ और सामर्थी
  rationale: 'दोनों विशेषणों की संयुक्त तीव्रता बनाए रखी गई है: पहला स्थिर मजबूती और दूसरा प्रभावी शक्ति पर बल देता है।'
- source_word: ἐπαγγέλλεται
  choice: प्रतिज्ञा करता है
  rationale: मूल क्रिया के ‘वचन देना/प्रतिज्ञा करना’ अर्थ को सुरक्षित रखा गया है; इसे ‘संभव बनाता है’ कहकर व्याख्यात्मक रूप से नहीं बदला गया।
- source_word: τελειοῖ
  choice: पूरा करता है
  rationale: यहाँ अर्थ कार्य को सिद्धि या पूर्णता तक पहुँचाना है; ‘पूरा करता है’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ἀποτυγχάνει
  choice: असफल रहती है
  rationale: मूल में लक्ष्य चूकने या सफलता न पाने का भाव है; सजीव रूप में प्रस्तुत ‘दुविधा’ के लिए यह उपयुक्त है।
theological_decisions:
- issue: विश्वास द्वारा ‘सब’ की प्रतिज्ञा और पूर्ति
  choice: मूल के व्यापक कथन ‘सब बातों की प्रतिज्ञा करता और सब कुछ पूरा करता है’ को यथावत रखा गया।
  alternative: इसे केवल परमेश्वर की इच्छा के अनुकूल प्रार्थनाओं या उचित कार्यों तक स्पष्ट रूप से सीमित करना।
  rationale: इस इकाई में ऐसी सीमा प्रत्यक्ष रूप से नहीं कही गई है; अनुवाद में बाहरी धर्मवैचारिक शर्त जोड़ना मूल की तीव्रता को कम कर देता।
- issue: दुविधा का अपने ऊपर भरोसा न रखना
  choice: व्यक्तिवाची रूपक को ‘जो अपने ही ऊपर भरोसा नहीं रखती’ के रूप में सुरक्षित रखा गया।
  alternative: इसे ‘जो परमेश्वर पर भरोसा नहीं रखती’ कहना।
  rationale: यूनानी पाठ में स्पष्ट रूप से प्रतिवाची ἑαυτῇ (‘अपने आप पर’) है; निकटवर्ती प्रसंग परमेश्वर पर विश्वास की बात करता है, फिर भी इस वाक्य को चुपचाप बदलना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदेशात्मक किंतु गरिमापूर्ण रखी गई है। ‘दुविधा’ और ‘विश्वास’ को मूल की तरह व्यक्तिवाची शक्तियों के रूप में प्रस्तुत किया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
