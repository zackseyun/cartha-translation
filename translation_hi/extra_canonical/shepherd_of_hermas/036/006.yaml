revisions:
- from: पर जो विश्वास में पूरी तरह दृढ़ हैं, वे प्रभु पर भरोसा रखकर सब कुछ माँगते हैं और पाते हैं, क्योंकि वे बिना संदेह किए माँगते हैं और दो मन के नहीं होते। क्योंकि हर दो मन वाला मनुष्य, यदि वह मन न फिराए, तो कठिनाई से उद्धार पाएगा।
  to: पर जो विश्वास में पूर्ण हैं, वे प्रभु पर भरोसा रखकर सब कुछ माँगते हैं और पाते हैं, क्योंकि वे बिना हिचकिचाए माँगते हैं और दो मन के नहीं होते। क्योंकि हर दो मन वाला मनुष्य, यदि वह मन न फिराए, तो कठिनाई से उद्धार पाएगा।
  rationale: 'The revision makes only two lexical adjustments: it restores the source’s wholeness/completeness language for ὁλοτελεῖς and renders ἀδιστάκτως as non-hesitant asking. The broad “सब कुछ,” the double-minded metaphor, the conditional repentance clause, and the difficult-yet-future salvation statement remain unsoftened and free of added theological qualifications.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:11:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of trust in the Lord, asking, receiving, undivided-mindedness, repentance, and difficult salvation. However, “पूरी तरह दृढ़” renders ὁλοτελεῖς chiefly as firmness, whereas the Greek denotes being complete/whole in faith. The repeated contrast concerns wholeness versus double-mindedness, so that lexical link should be retained.
  naturalness: The Hindi is generally clear and suitably dignified. “विश्वास में पूर्ण” is both natural enough in this register and closer to the source. “बिना हिचकिचाए” expresses ἀδιστάκτως (without wavering/hesitation) idiomatically and avoids making it merely an intellectual doubt, while “दो मन के नहीं” continues to convey διψυχοῦντες.
  terminology: '“प्रभु,” “भरोसा,” “दो मन,” and “उद्धार पाएगा” are appropriate. No footnote is needed: the source text supplied presents no textual ambiguity requiring one in this unit.'
  issues:
  - severity: medium
    issue: ὁλοτελεῖς is translated as “पूरी तरह दृढ़.”
    rationale: This narrows “complete/whole in faith” to being firm. In this mandate, wholeness in faith is deliberately contrasted with being δίψυχος, “double-minded”; “विश्वास में पूर्ण” better preserves that contrast without claiming sinlessness.
  - severity: low
    issue: ἀδιστάκτως is translated as “बिना संदेह किए.”
    rationale: The expression includes non-wavering or non-hesitating prayer. “बिना हिचकिचाए” is a more direct modern Hindi equivalent, while the following “दो मन के नहीं होते” retains the explicit divided-mindedness imagery.
  revised_text: पर जो विश्वास में पूर्ण हैं, वे प्रभु पर भरोसा रखकर सब कुछ माँगते हैं और पाते हैं, क्योंकि वे बिना हिचकिचाए माँगते हैं और दो मन के नहीं होते। क्योंकि हर दो मन वाला मनुष्य, यदि वह मन न फिराए, तो कठिनाई से उद्धार पाएगा।
