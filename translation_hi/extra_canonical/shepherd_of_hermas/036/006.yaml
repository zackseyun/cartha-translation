base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/006.yaml
  text: But those who are complete in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he repents, will be saved with difficulty.
translation:
  language: hi
  text: पर जो विश्वास में पूर्ण हैं, वे प्रभु पर भरोसा रखकर सब कुछ माँगते हैं और पाते हैं, क्योंकि वे बिना हिचकिचाए माँगते हैं और दो मन के नहीं होते। क्योंकि हर दो मन वाला मनुष्य, यदि वह मन न फिराए, तो कठिनाई से उद्धार पाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁλοτελεῖς ὄντες ἐν τῇ πίστει
  choice: विश्वास में पूरी तरह दृढ़ हैं
  rationale: ὁλοτελεῖς की समग्रता/पूर्णता को स्वाभाविक हिन्दी में व्यक्त करते हुए इसे नैतिक निष्पापता के दावे की तरह पढ़े जाने से बचाया गया है।
- source_word: πεποιθότες ἐπὶ τὸν κύριον
  choice: प्रभु पर भरोसा रखकर
  rationale: पूर्ण कृदन्त का आशय प्रभु पर स्थापित भरोसा है; यह हिन्दी में कारण और मनोभाव दोनों को सहज रूप से व्यक्त करता है।
- source_word: ἀδιστάκτως
  choice: बिना संदेह किए
  rationale: यहाँ शब्द प्रार्थना में हिचकिचाहट अथवा संशय के अभाव को दर्शाता है।
- source_word: μηδὲν διψυχοῦντες / δίψυχος
  choice: दो मन के नहीं होते / दो मन वाला
  rationale: 'मूल के प्रमुख रूपक को बनाए रखा गया है: भीतर से बँटा हुआ, अस्थिर या संशयी होना। दोनों प्रयोगों में एक ही शब्द-परिवार रखा गया है।'
- source_word: δυσκόλως σωθήσεται
  choice: कठिनाई से उद्धार पाएगा
  rationale: भविष्यकालीन कर्मवाच्य और मूल के असुविधाजनक धर्मवैचारिक तनाव को बिना नरम किए सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘सब कुछ माँगते हैं और पाते हैं’ की व्यापकता
  choice: मूल के निरपेक्ष कथन को यथावत रखा गया
  alternative: इसे ‘जो कुछ परमेश्वर की इच्छा के अनुसार माँगते हैं’ बनाकर सीमित करना
  rationale: इस खंड में ऐसी स्पष्ट सीमा मूल यूनानी में नहीं है; उसे जोड़ना व्याख्यात्मक धर्मशास्त्र आयात करता।
- issue: ‘कठिनाई से उद्धार पाएगा’ का अर्थ
  choice: स्पष्ट किन्तु तनावपूर्ण कथन को ज्यों का त्यों रखा गया
  alternative: ‘शायद उद्धार न पाए’ या ‘उसके लिए उद्धार पाना कठिन होगा’
  rationale: δυσκόλως σωθήσεται उद्धार की कठिनता कहता है, उसकी असंभवता या अनिश्चितता नहीं; कर्मवाच्य ‘उद्धार पाएगा’ भी सुरक्षित है।
- issue: μετανοήσῃ का अनुवाद
  choice: मन न फिराए
  alternative: पश्चाताप न करे
  rationale: ‘मन फिराना’ दिशा और आचरण के परिवर्तन को समेटता है तथा केवल भावनात्मक खेद तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘दो मन’ का रूपक संदर्भ की केंद्रीय शब्दावली बनाए रखने के लिए संरक्षित है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
