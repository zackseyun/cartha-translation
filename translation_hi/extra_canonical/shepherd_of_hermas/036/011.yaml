  text: “You see then,” he says, “that faith is from above, from the Lord, and it has great power; but double-mindedness is an earthly spirit from the devil, having no power.
translation:
  language: hi
  text: वह कहता है, “तो तुम देखते हो कि विश्वास ऊपर से, प्रभु की ओर से है और उसमें बड़ी सामर्थ्य है; पर दोमनापन शैतान की ओर से एक सांसारिक आत्मा है, जिसमें कोई सामर्थ्य नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ परमेश्वर पर भरोसे और निष्ठापूर्ण विश्वास का सामान्य धार्मिक अर्थ है; आधुनिक हिन्दी में ‘विश्वास’ स्वाभाविक और व्यापक रूप से समझा जाता है।
- source_word: διψυχία
  choice: दुविधा
  rationale: शाब्दिक अर्थ ‘दो मन वाला होना’ है। प्रसंग में यह प्रार्थना करते समय मन का डाँवाडोल होना और भरोसा न करना दर्शाता है; ‘दुविधा’ इसे सहज हिन्दी में व्यक्त करती है।
- source_word: ἄνωθεν
  choice: ऊपर से
  rationale: मूल की स्थानिक तथा ईश्वरीय-उद्गम संबंधी भाषा को बनाए रखता है; आगे का ‘प्रभु की ओर से’ इसका आशय स्पष्ट करता है।
- source_word: δύναμιν μεγάλην
  choice: बड़ी सामर्थ्य
  rationale: δύναμις की प्रभावकारी शक्ति को dignified धार्मिक हिन्दी में व्यक्त करता है।
- source_word: ἐπίγειον πνεῦμα
  choice: सांसारिक आत्मा
  rationale: मूल के ‘पृथ्वी-संबंधी/धरती का आत्मिक प्रभाव’ को निकटता से रखता है और विश्वास के ‘ऊपर से’ होने के साथ विरोध बनाए रखता है।
- source_word: διάβολος
  choice: शैतान
  rationale: हिन्दी पाठकों के लिए स्वाभाविक और प्रचलित पद; यहाँ व्यक्तिगत दुष्ट सत्ता का संकेत है।
theological_decisions:
- issue: विश्वास और दुविधा के स्रोतों का विरोध
  choice: विश्वास को ‘ऊपर से, प्रभु की ओर से’ और दुविधा को ‘शैतान की ओर से’ आने वाला सांसारिक आत्मा कहा गया है।
  alternative: इसे केवल अच्छे और बुरे मानसिक रुझानों के रूप में ढीला अनुवाद करना।
  rationale: मूल पाठ दोनों को स्पष्ट रूप से परालौकिक स्रोतों से जोड़ता है; इस तनाव को कम नहीं किया गया।
- issue: दुविधा में सामर्थ्य का निषेध
  choice: ‘जिसमें कोई सामर्थ्य नहीं है’
  alternative: ‘जो निर्बल है’
  rationale: μὴ ἔχουσα δύναμιν का स्पष्ट निषेध सुरक्षित रहता है, भले ही पिछले वाक्यों में दुविधा का हानिकारक प्रभाव बताया गया हो; इस प्रत्यक्ष तनाव को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ग्रीक की प्रत्यक्ष वाणी और ‘ऊपर से/सांसारिक’ विरोध को बनाए रखा गया है। इस इकाई में किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
