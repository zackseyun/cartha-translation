base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/007.yaml
  text: Cleanse, then, your heart from double-mindedness, and put on faith, because it is strong, and believe God, that all your requests which you ask you will receive. And if ever, after asking some request from the Lord, you receive it more slowly, do not be double-minded because you did not quickly receive the request of your soul; for surely it is because of some testing or some transgression, which you do not know, that you receive your request more slowly.
translation:
  language: hi
  text: इसलिए अपने हृदय को दुविधा से शुद्ध करो और विश्वास को धारण करो, क्योंकि वह सामर्थी है। परमेश्वर पर विश्वास करो कि तुम उससे जो कुछ माँगते हो, वह सब तुम्हें मिलेगा। और यदि कभी प्रभु से कुछ माँगने के बाद तुम्हें वह मिलने में देर हो, तो इस कारण दुविधा में मत पड़ो कि तुम्हारी आत्मा की याचना तुम्हें शीघ्र नहीं मिली; क्योंकि निश्चय ही किसी परीक्षा या किसी ऐसे अपराध के कारण, जिससे तुम अनजान हो, तुम्हारी याचना मिलने में देर होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: दुविधा
  rationale: शाब्दिक अर्थ ‘दो मन वाला होना’ है; यहाँ प्रार्थना में संदेह और बँटे हुए मन की स्थिति अभिप्रेत है। ‘दुविधा’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंगगत अर्थ बनाए रखती है।
- source_word: ἔνδυσαι
  choice: धारण करो
  rationale: वस्त्र पहनने के रूपक को हिन्दी के स्वाभाविक धार्मिक-नैतिक प्रयोग ‘धारण करो’ से सुरक्षित रखा गया है।
- source_word: ἰσχυρά
  choice: सामर्थी
  rationale: विश्वास को शक्तिशाली बताने वाले व्यक्तिकृत कथन को बनाए रखता है।
- source_word: τὸ αἴτημα τῆς ψυχῆς σου
  choice: तुम्हारे मन की माँग
  rationale: ψυχή का यहाँ आशय भीतर से उठी याचना है; ‘मन की माँग’ सामान्य पाठक के लिए सहज है और इसे केवल औपचारिक निवेदन तक सीमित नहीं करती।
- source_word: πειρασμόν
  choice: परीक्षा
  rationale: ग्रीक शब्द परीक्षा या प्रलोभन दोनों अर्थ दे सकता है; इस प्रसंग में विलंब के कारण के रूप में तटस्थ ‘परीक्षा’ उपयुक्त है।
- source_word: παράπτωμά
  choice: अपराध
  rationale: चूक, पतन या अपराध के अर्थक्षेत्र को संक्षेप में व्यक्त करता है और नैतिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: माँगी हुई हर वस्तु मिलने का प्रतिज्ञात्मक कथन
  choice: ‘तुम उससे जो कुछ माँगते हो, वह सब तुम्हें मिलेगा’ के रूप में कथन को बिना अतिरिक्त शर्त जोड़े रखा गया।
  alternative: इसे ‘यदि उसकी इच्छा हो’ जैसी व्याख्यात्मक शर्त से सीमित करना।
  rationale: इस इकाई के यूनानी पाठ में ऐसी शर्त स्पष्ट नहीं है; धर्मवैचारिक तनाव को अनुवाद में मौन रूप से हल नहीं किया गया।
- issue: प्रार्थना के उत्तर में विलंब का कारण
  choice: पाठ के अनुसार परीक्षा या अज्ञात अपराध—दोनों संभावनाएँ रखी गईं।
  alternative: विलंब को केवल परमेश्वर की इच्छा या केवल प्रार्थी के पाप से जोड़ना।
  rationale: ἢ द्वारा दिए गए विकल्प और वक्ता के निश्चयात्मक स्वर, दोनों को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। आज्ञार्थक वाक्यों और विश्वास को वस्त्र की तरह धारण करने के रूपक को बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
