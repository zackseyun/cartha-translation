base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/008.yaml
  text: So do not cease asking for the request of your soul, and you will receive it. But if you grow weary and become double-minded while asking, blame yourself and not the one who gives to you.
translation:
  language: hi
  text: इसलिए अपने मन की इच्छा के लिए माँगते रहना न छोड़ो, और वह तुम्हें मिल जाएगी। लेकिन यदि माँगते-माँगते तुम हिम्मत हार जाओ और दो मन के हो जाओ[a], तो अपने आप को दोष देना, उसे नहीं जो तुम्हें देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “दो मनवाले हो जाओ”; अर्थात विश्वास और संदेह के बीच बँट जाओ।'
    reason: διψυχήσῃς की ‘दो मन’ वाली छवि तथा उसके संदर्भगत अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: τὸ αἴτημα τῆς ψυχῆς σου
  choice: अपने मन की विनती
  rationale: यह यूनानी पद व्यक्ति की भीतरी, गहरी विनती को व्यक्त करता है। हिंदी में ‘अपने मन की विनती’ स्वाभाविक है और केवल किसी वस्तु की माँग तक अर्थ को सीमित नहीं करता।
- source_word: μὴ διαλίπῃς αἰτούμενος
  choice: विनती करना न छोड़ो
  rationale: निरंतर माँगते रहने की आज्ञा को सहज और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ἐκκακήσῃς
  choice: हिम्मत हार जाओ
  rationale: यहाँ अर्थ माँगते हुए थककर निरुत्साहित हो जाने का है; ‘हिम्मत हारना’ आधुनिक हिंदी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διψυχήσῃς
  choice: दुविधा में पड़ जाओ
  rationale: संदर्भ में यह विश्वास और अविश्वास के बीच बँटे मन से संदेह करने को दर्शाता है। मुख्य पाठ में सहज हिंदी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: τὸν διδόντα σοι
  choice: उसे नहीं जो तुम्हें देता है
  rationale: यूनानी में परमेश्वर का नाम दोहराया नहीं गया, बल्कि ‘देनेवाले’ का उल्लेख है; अनुवाद उसी अप्रत्यक्ष अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: ‘और तुम उसे पाओगे’ के वचन का स्वरूप
  choice: और वह तुम्हें मिल जाएगी
  alternative: यदि परमेश्वर की इच्छा हुई तो वह तुम्हें मिल जाएगी
  rationale: मूल पाठ यहाँ प्रतिज्ञा को बिना किसी जोड़ी गई शर्त के कहता है। व्यापक धर्मशास्त्रीय समन्वय के लिए कोई अतिरिक्त शर्त जोड़ना इस वाक्य के बल को बदल देता।
- issue: दोष किसे दिया जाए
  choice: दोष अपने आप को देना, उसे नहीं जो तुम्हें देता है
  alternative: दोष अपने अविश्वास को देना, परमेश्वर को नहीं
  rationale: मूल पाठ व्यक्ति को स्वयं उत्तरदायी ठहराता है और देनेवाले का उल्लेख अप्रत्यक्ष रूप से करता है; अनुवाद इसे अधिक स्पष्ट धर्मशास्त्रीय कथन में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। संबोधन एकवचन ‘तुम’ में है, जैसा यूनानी पाठ में है। ‘माँगते-माँगते’ निरंतर प्रार्थना के दौरान थक जाने की स्थिति को बोलचाल की सहजता के साथ व्यक्त करता है।
