base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/002.yaml
  text: Do not reason about these things, but turn to the Lord with your whole heart, and ask from him without doubting; and you will come to know his great compassion, because he will certainly not abandon you, but will fulfill the request of your soul.
translation:
  language: hi
  text: इन बातों पर विचार मत करो, बल्कि अपने पूरे हृदय से प्रभु की ओर लौटो और बिना संदेह किए उससे माँगो। तब तुम उसकी अपार करुणा को जानोगे, क्योंकि वह तुम्हें कभी नहीं छोड़ेगा, बल्कि तुम्हारी आत्मा की विनती पूरी करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλογίζου ταῦτα
  choice: इन बातों को मन में मत तौलते रहो
  rationale: संदर्भ में यह अपने पापों के कारण परमेश्वर से माँगने की योग्यता पर भीतर ही भीतर संदेहपूर्ण विचार करते रहने को दर्शाता है; यह हिंदी में स्वाभाविक रहते हुए मूल का मानसिक-विमर्श भाव रखता है।
- source_word: ἐξ ὅλης τῆς καρδίας σου ἐπίστρεψον ἐπὶ τὸν κύριον
  choice: अपने पूरे हृदय से प्रभु की ओर लौटो
  rationale: ἐπίστρεψον का लौटने/फिरने का भाव और समग्र हृदय की भाषा दोनों सुरक्षित रखे गए हैं।
- source_word: ἀδιστάκτως
  choice: बिना संदेह किए
  rationale: इस आदेश के व्यापक संदर्भ में διστάζω और διψυχία का मुख्य भाव परमेश्वर से माँगते समय संदेह अथवा डाँवाडोल होना है।
- source_word: πολλὴν εὐσπλαγχνίαν
  choice: अपार करुणा
  rationale: εὐσπλαγχνία गहरी दयालु करुणा को व्यक्त करता है; ‘अपार’ πολλήν की प्रबलता को सहज हिंदी में दर्शाता है।
- source_word: τὸ αἴτημα τῆς ψυχῆς σου πληροφορήσει
  choice: तुम्हारे मन की विनती पूरी करेगा
  rationale: πληροφορέω यहाँ विनती को पूर्ण करने का भाव देता है; ψυχή का शाब्दिक ‘प्राण’ इस मुहावरे में अस्वाभाविक होता, इसलिए आंतरिक अभिलाषा के अर्थ में ‘मन’ चुना गया है।
theological_decisions:
- issue: प्रार्थना की विनती पूरी होने का आश्वासन
  choice: ‘वह तुम्हें कभी नहीं छोड़ेगा, बल्कि तुम्हारे मन की विनती पूरी करेगा’ के रूप में स्पष्ट और प्रबल प्रतिज्ञा रखी गई है।
  alternative: इस कथन को शर्तों या परमेश्वर की इच्छा संबंधी व्याख्यात्मक शब्दों से सीमित करना।
  rationale: मूल पद οὐ μή की प्रबल निषेधात्मक भाषा और πληροφορήσει की सकारात्मक प्रतिज्ञा देता है; इस इकाई में अनुपस्थित धर्मशास्त्रीय शर्तें जोड़कर तनाव को हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘प्रभु’ और ‘करुणा’ जैसे परिचित धार्मिक शब्द मूल के स्वर को बनाए रखते हैं; कोई पादटिप्पणी आवश्यक नहीं समझी गई।
