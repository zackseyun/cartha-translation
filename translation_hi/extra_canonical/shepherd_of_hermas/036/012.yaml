base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/012.yaml
  text: Therefore serve faith, which has power, and keep away from double-mindedness, which has no power, and you will live to God—and all who think these things will live to God.”
translation:
  language: hi
  text: इसलिए उस विश्वास की सेवा करो जिसमें सामर्थ्य है, और उस दुविधा से दूर रहो जिसमें कोई सामर्थ्य नहीं है। तब तुम परमेश्वर के लिए जीवित रहोगे; और जो ऐसा सोचते हैं, वे सब परमेश्वर के लिए जीवित रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ विश्वास को सामर्थ्य रखने वाली और जिसकी सेवा की जानी है ऐसी सजीव सत्ता के रूप में प्रस्तुत किया गया है; इसलिए मूल के मानवीकरण को बनाए रखा गया।
- source_word: διψυχία
  choice: दुविधा
  rationale: शाब्दिक अर्थ ‘दो मन की दशा’ है, पर प्रसंग में यह परमेश्वर से माँगते समय संदेह और मन के बँटाव को दर्शाता है। ‘दुविधा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस भाव को व्यक्त करती है।
- source_word: ἀπόσχου
  choice: दूर रहो
  rationale: यह संयमपूर्वक अलग रहने या अपने को बचाए रखने की आज्ञा है; ‘दूर रहो’ सहज और स्पष्ट हिन्दी है।
- source_word: ζήσῃ τῷ θεῷ
  choice: परमेश्वर के लिए जीवित रहोगे
  rationale: यूनानी दत्तिवाचक पद परमेश्वर की ओर उन्मुख या परमेश्वर के लिए जीवन का भाव देता है; अनुवाद ने इसे केवल शारीरिक रूप से जीवित रहने तक सीमित नहीं किया।
- source_word: οἱ ταῦτα φρονοῦντες
  choice: जो भी ऐसा मन रखते हैं
  rationale: φρονεῖν केवल बौद्धिक रूप से सोचने के बजाय मनोवृत्ति या दृष्टिकोण रखने का संकेत दे सकता है; यह चयन उस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: विश्वास और दुविधा का मानवीकरण
  choice: ‘विश्वास की सेवा करो’ और ‘दुविधा से दूर रहो’
  alternative: ‘विश्वासी बने रहो और संदेह मत करो’
  rationale: वैकल्पिक रूप अर्थ समझाता है, पर मूल में विश्वास और दुविधा को विरोधी शक्तियों या स्वामियों की तरह प्रस्तुत किए जाने की अलंकारिक और धार्मिक तीव्रता मिटा देता है।
- issue: ‘परमेश्वर के लिए जीवित रहना’ का अर्थ
  choice: मूल की संबंधपरक अभिव्यक्ति को बनाए रखा
  alternative: ‘परमेश्वर तुम्हें जीवन देगा’ या ‘तुम उद्धार पाओगे’
  rationale: मूल पाठ न तो स्पष्ट रूप से जीवन का कर्ता बताता है, न यहाँ ‘उद्धार’ शब्द का प्रयोग करता है; इसलिए संभावित धर्मवैज्ञानिक अर्थ को संकुचित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सेवा करो’ मूल के असामान्य किंतु जानबूझकर किए गए मानवीकरण को सुरक्षित रखता है; ‘सामर्थ्य’ इस धार्मिक-उपदेशात्मक प्रसंग में δύναμις के लिए स्वाभाविक है।
