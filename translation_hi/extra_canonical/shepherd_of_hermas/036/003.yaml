base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/003.yaml
  text: For God is not like human beings who remember wrongs; rather, he does not remember wrongs, and he has compassion on what he has made.
translation:
  language: hi
  text: क्योंकि परमेश्वर उन मनुष्यों के समान नहीं है जो बैर मन में रखते हैं; बल्कि वह बैर नहीं रखता और अपनी सृष्टि पर करुणा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησικακοῦντες
  choice: बैर मन में रखते हैं
  rationale: यह कृदंत बीती बुराई को याद रखकर द्वेष या वैर पालने का भाव व्यक्त करता है; आधुनिक हिन्दी में यह अर्थ स्वाभाविक और स्पष्ट है।
- source_word: ἀμνησίκακός
  choice: बैर नहीं रखता
  rationale: यह μνησικακοῦντες का प्रतिलोम है। अनुवाद में उसी शब्दावली को दोहराने से यूनानी पाठ का स्पष्ट विरोध सुरक्षित रहता है और इसे केवल मानसिक विस्मरण के अर्थ में नहीं लिया जाता।
- source_word: σπλαγχνίζεται
  choice: करुणा करता है
  rationale: क्रिया गहरी, अंतरंग दया और सहानुभूति व्यक्त करती है; ‘करुणा करता है’ dignified आधुनिक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: ποίησιν
  choice: सृष्टि
  rationale: संज्ञा का शाब्दिक अर्थ ‘बनाई हुई वस्तु/रचना’ है; परमेश्वर के संदर्भ में ‘अपनी सृष्टि’ संक्षिप्त, स्वाभाविक और व्यापक है।
theological_decisions:
- issue: परमेश्वर के ‘बुराइयाँ याद न रखने’ का अर्थ
  choice: बैर नहीं रखता
  alternative: बुराइयों को याद नहीं रखता
  rationale: ἀμνησίκακός का आशय अपराधों के प्रति द्वेष या प्रतिशोध पालना नहीं है। ‘बैर नहीं रखता’ स्रोत का नैतिक संबंधपरक अर्थ बनाए रखता है और परमेश्वर के ज्ञान के विषय में अनावश्यक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मनुष्य’ के बहुवचन के लिए ‘मनुष्यों’ और परमेश्वर की बनाई हुई समस्त रचना के लिए ‘अपनी सृष्टि’ का प्रयोग किया गया है।
