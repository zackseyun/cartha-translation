base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/001.yaml
  text: 'He says to me: Remove double-mindedness from yourself, and do not at all be double-minded when asking anything from God, saying within yourself, “How am I able to ask from the Lord and receive, I who have sinned so much against him?”'
translation:
  language: hi
  text: वह मुझसे कहता है, “अपने भीतर से दुविधा दूर कर दे, और परमेश्वर से कुछ माँगते समय तनिक भी संदेह न कर। अपने मन में यह मत कह, ‘मैं प्रभु से कैसे माँग सकता हूँ और कैसे पा सकता हूँ, जबकि मैंने उसके विरुद्ध इतने पाप किए हैं?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: दुविधा / संदेह करना
  rationale: शाब्दिक अर्थ ‘दो-मनापन’ है; यहाँ परमेश्वर से माँगते समय भीतर बँटे होने और विश्वास न कर पाने की अवस्था अभिप्रेत है। स्वाभाविक हिन्दी के लिए संज्ञा में ‘दुविधा’ और क्रिया में ‘संदेह करना’ रखा गया।
- source_word: αἰτήσασθαί
  choice: माँगना
  rationale: प्रार्थना में परमेश्वर से किसी वस्तु या सहायता की याचना करने का सामान्य और स्पष्ट हिन्दी रूप।
- source_word: ἡμαρτηκὼς ... εἰς αὐτόν
  choice: उसके विरुद्ध ... पाप किए
  rationale: εἰς αὐτόν पाप के लक्ष्य या जिसके विरुद्ध पाप हुआ उसे व्यक्त करता है; ‘उसके विरुद्ध’ इसे स्पष्ट रखता है।
theological_decisions:
- issue: पाप के कारण प्रार्थना करने की योग्यता पर वक्ता का प्रश्न
  choice: प्रश्न को आत्म-संदेह के रूप में यथावत रखा गया
  alternative: इसे परमेश्वर की क्षमा या प्रार्थना की निश्चित स्वीकृति के सिद्धान्तात्मक कथन में बदलना
  rationale: मूल वाक्य व्यक्ति के भीतर उठने वाले प्रश्न को उद्धृत करता है; वह इस खंड में स्वयं उसका व्यवस्थित धर्मवैज्ञानिक समाधान नहीं देता।
- issue: διψυχία का अर्थ
  choice: परमेश्वर से माँगते समय दुविधा और संदेह
  alternative: पाखंड, दोहरा चरित्र, या धर्मत्याग
  rationale: निकट संदर्भ में यह माँगने और पाने के विषय में हिचक तथा अविश्वास से जुड़ा है; व्यापक या सांप्रदायिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। प्रत्यक्ष कथन में ‘कर दे/मत कह’ का एकवचन रूप मूल यूनानी के संबोधन के अनुरूप रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
