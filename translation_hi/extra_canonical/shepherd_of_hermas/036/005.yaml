base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/005.yaml
  text: But if you waver in your heart, you will by no means receive anything of your petitions. For those who doubt with respect to God—these are the double-minded—and they do not at all obtain their petitions.
translation:
  language: hi
  text: पर यदि तुम अपने मन में संदेह करोगे, तो अपनी किसी भी याचना का उत्तर कदापि नहीं पाओगे। क्योंकि जो परमेश्वर के विषय में संदेह करते हैं, वे दो मन वाले हैं, और वे अपनी याचनाओं में से कोई भी बात बिल्कुल प्राप्त नहीं करते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διστάσῃς / διστάζοντες
  choice: संदेह करोगे / संदेह करते हैं
  rationale: यहाँ क्रिया प्रार्थना करते समय परमेश्वर पर भरोसे में हिचकने या संदेह करने को व्यक्त करती है; आधुनिक हिन्दी में ‘संदेह’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: δίψυχοι
  choice: दुविधाग्रस्त लोग
  rationale: शाब्दिक अर्थ ‘दो मन वाले’ है। ‘दुविधाग्रस्त’ मन के बँटे होने और अस्थिर भरोसे का भाव देता है, पर इसे केवल सामान्य अनिर्णय तक सीमित नहीं करता।
- source_word: αἰτημάτων
  choice: प्रार्थनाओं में माँगी हुई वस्तुएँ
  rationale: संदर्भ परमेश्वर से माँगने का है। केवल ‘याचनाएँ’ की अपेक्षा यह अभिव्यक्ति साधारण पाठक के लिए अधिक स्पष्ट है और माँगी गई बातों/वस्तुओं को सूचित करती है।
- source_word: ἐπιτυγχάνουσι
  choice: मिलती
  rationale: माँगी हुई बात के प्राप्त होने के संदर्भ में स्वाभाविक हिन्दी; ग्रीक के ‘प्राप्त करना/सफल होना’ का आशय सुरक्षित रहता है।
theological_decisions:
- issue: परमेश्वर के प्रति संदेह और प्रार्थना की प्राप्ति का संबंध
  choice: 'मूल कथन की कठोर, निरपेक्ष भाषा को बनाए रखा गया है: ‘कदापि नहीं’ और ‘बिल्कुल नहीं’।'
  alternative: इसे नरम करके ‘शायद न मिले’ या नैतिक अपवाद जोड़ना।
  rationale: οὐδὲν οὐ μὴ और οὐδὲν ὅλως प्रबल निषेध हैं। इस इकाई में लेखक के धर्मवैचारिक तनाव को बिना व्याख्यात्मक शमन के सुरक्षित रखना आवश्यक है।
- issue: δίψυχοι की व्याख्या
  choice: ‘दुविधाग्रस्त लोग’
  alternative: ‘दो मन वाले’ या ‘दोहरे मन वाले’
  rationale: ‘दो मन वाले’ अधिक शाब्दिक है, पर आधुनिक हिन्दी में कृत्रिम या नैतिक दोहरेपन का संकेत दे सकता है। संदर्भगत अर्थ भरोसे में बँटे और डगमगाते मन का है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। यूनानी पदक्रम के बल को ‘वे ही’ से रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में कोई चिह्न नहीं है।
