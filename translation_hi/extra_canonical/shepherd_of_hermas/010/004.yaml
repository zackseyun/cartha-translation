  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/004.yaml
  text: 4. And again she took hold of my hand, raised me up, and seated me on the bench on the left; and she herself sat on the right. And, lifting up a certain bright rod, she says to me, “Do you see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,] look—do you not see opposite you a great tower being built upon the waters with square, shining stones?”
translation:
  language: hi
  text: 4. तब उसने फिर मेरा हाथ पकड़ा, मुझे उठाया और बाईं ओर के आसन पर बैठाया; और वह स्वयं दाईं ओर बैठ गई। फिर एक चमकीली छड़ी उठाकर उसने मुझसे कहा, “क्या तुम्हें कोई बड़ी बात दिखाई देती है?” मैंने उससे कहा, “हे स्वामिनी, मुझे कुछ भी दिखाई नहीं देता।” उसने मुझसे कहा, “[तुम][a] देखो! क्या तुम्हें अपने सामने जल पर चौकोर, चमकीले पत्थरों से बनती हुई एक विशाल मीनार दिखाई नहीं देती?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी संस्करण में “तुम” को कोष्ठकों में रखा गया है, जो पाठगत अनिश्चितता दर्शाता है।
    reason: मूल स्रोत में [Σὺ] संपादकीय कोष्ठकों में है; इस अनिश्चितता को मुख्य पाठ और टिप्पणी दोनों में सुरक्षित रखा गया है।
lexical_decisions:
- source_word: συμπλέσιον
  choice: आसन
  rationale: यह बैठने के लिए बने बेंच या लंबे आसन को सूचित करता है; ‘आसन’ आधुनिक हिन्दी में स्वाभाविक है और वस्तु के रूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ῥάβδον τινα λαμπράν
  choice: एक चमकीली छड़ी
  rationale: ῥάβδος के सामान्य अर्थ ‘छड़ी/दंड’ को रखा गया है और λαμπράν की दृश्य चमक को ‘चमकीली’ से व्यक्त किया गया है।
- source_word: μέγα πρᾶγμα
  choice: कोई बड़ी बात
  rationale: यूनानी पद जानबूझकर व्यापक है; इसे ‘अद्भुत दृश्य’ कहने से अर्थ अधिक निश्चित हो जाता, इसलिए उसकी अस्पष्टता बनाए रखी गई है।
- source_word: πύργον μέγαν
  choice: एक विशाल मीनार
  rationale: πύργος के ऊँचे, दुर्गनुमा निर्माण के अर्थ को साधारण पाठक के लिए स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ ὑδάτων
  choice: जल पर
  rationale: बहुवचन यूनानी रूप सामूहिक जलराशि को सूचित कर सकता है; हिन्दी में ‘जल पर’ अधिक स्वाभाविक है और निर्माण के जल के ऊपर स्थित होने की छवि रखता है।
theological_decisions:
- issue: मीनार की प्रतीकात्मक पहचान
  choice: केवल दृश्य का वर्णन किया गया है; मीनार को इस पद में किसी धर्मवैचारिक सत्ता के रूप में स्पष्ट नहीं किया गया।
  alternative: मीनार को सीधे ‘कलीसिया’ कहना।
  rationale: इस अंश में प्रतीक की व्याख्या अभी नहीं दी गई है; अनुवाद में बाद की व्याख्या को पहले से आरोपित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। संवाद में ‘हे स्वामिनी’ संबोधन सम्मान और प्राचीन परिवेश दोनों को व्यक्त करता है। बाएँ और दाएँ की स्थानिक समानांतरता को स्पष्ट रखा गया है।
