  text: 3. After she had said these things, she wanted to depart; but I fell at her feet and asked her by the Lord to show me the vision that she had promised me.
translation:
  language: hi
  text: 3. ये बातें कहकर वह जाने लगी; पर मैं उसके पैरों पर गिर पड़ा और प्रभु का वास्ता देकर उससे विनती की कि वह मुझे वह दर्शन दिखाए, जिसका उसने मुझसे वादा किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν ἀπελθεῖν
  choice: जाने लगी
  rationale: यह प्रसंग में उसके जाने के इरादे और आरम्भिक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πεσὼν ... πρὸς τοὺς πόδας
  choice: उसके पैरों पर गिर पड़ा
  rationale: विनय और तीव्र आग्रह के शारीरिक भाव को सीधे बनाए रखता है।
- source_word: ἠρώτησα
  choice: विनती की
  rationale: यहाँ निवेदन साधारण प्रश्न नहीं, बल्कि आग्रहपूर्ण अनुरोध है।
- source_word: κατὰ τοῦ Κυρίου
  choice: प्रभु की शपथ देकर
  rationale: इस असामान्य यूनानी पदबंध का आशय प्रभु का वास्ता देकर या शपथपूर्वक आग्रह करना है; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: ἐπιδείξῃ
  choice: दिखाए
  rationale: वादा किए गए दर्शन को प्रत्यक्ष कराने का सरल और सटीक रूप।
- source_word: ὅραμα
  choice: दर्शन
  rationale: दिव्य या प्रकट किए गए दृश्य के लिए स्थापित, सहज धार्मिक शब्दावली।
theological_decisions:
- issue: κατὰ τοῦ Κυρίου में प्रभु के नाम पर आग्रह का स्वर
  choice: प्रभु की शपथ देकर
  alternative: प्रभु का वास्ता देकर
  rationale: मूल में आग्रह को प्रभु के प्राधिकार से बाँधने का प्रबल भाव है। 'शपथ देकर' इसे औपचारिक और स्पष्ट रखता है, बिना यह बताए कि शपथ किस कथन की पुष्टि करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्य की यूनानी संरचना और आग्रह की तीव्रता को बनाए रखते हुए अनावश्यक प्राचीनता से बचा गया है।
