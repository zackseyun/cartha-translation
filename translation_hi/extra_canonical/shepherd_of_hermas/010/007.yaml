  text: 7. But of the other stones being brought from the dry land, some they were rejecting, and some they were putting into the building; others they were cutting and throwing far from the tower.
translation:
  language: hi
  text: 7. परन्तु स्थल से लाए जा रहे दूसरे पत्थरों में से कुछ को वे अलग कर देते थे, और कुछ को निर्माण में लगा देते थे; अन्य पत्थरों को वे काटकर मीनार से बहुत दूर फेंक देते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξηρᾶς
  choice: सूखी भूमि
  rationale: यह यूनानी शब्द जल अथवा गहराई के विपरीत स्थल-भाग को दर्शाता है; संदर्भ में ‘सूखी भूमि’ इस विरोध को स्पष्ट रखता है।
- source_word: ἀπέβαλλον
  choice: अस्वीकार कर देते थे
  rationale: निर्माण के लिए अनुपयुक्त पत्थरों को अलग कर देने का भाव है; ‘अस्वीकार’ चयन और अनुपयुक्तता दोनों व्यक्त करता है।
- source_word: οἰκοδομήν
  choice: भवन
  rationale: यहाँ शब्द निर्माणाधीन संरचना को सूचित करता है; निकट संदर्भ में वह संरचना मीनार है, पर मूल की शब्द-विविधता बनाए रखने के लिए ‘भवन’ चुना गया है।
- source_word: κατέκοπτον
  choice: काटकर
  rationale: क्रिया पत्थरों को काटने या टुकड़े करने का अर्थ देती है; मूल पाठ यह नहीं बताता कि उन्हें आकार दिया गया या नष्ट किया गया, इसलिए सरल ‘काटकर’ अस्पष्टता बचाता है।
- source_word: πύργου
  choice: मीनार
  rationale: निर्माणाधीन ऊँची संरचना के लिए आधुनिक और सहज हिन्दी शब्द।
theological_decisions:
- issue: पत्थरों के अस्वीकार और काटे जाने का प्रतीकात्मक अर्थ
  choice: अनुवाद में केवल दृश्य क्रिया का वर्णन रखा गया है
  alternative: पत्थरों को लोगों या विश्वासियों के रूप में स्पष्ट करना
  rationale: इस पद में प्रतीक का अर्थ अभी प्रत्यक्ष रूप से नहीं समझाया गया है; व्याख्या जोड़ना मूल की कथात्मक और धर्मवैचारिक खुली स्थिति को समय से पहले सीमित कर देता।
translation_notes:
  register: सरल, गरिमापूर्ण आधुनिक मानक हिन्दी। अपूर्ण भूतकाल की पुनरावृत्त क्रियाओं को ‘कर देते थे/लगा देते थे/फेंक देते थे’ से व्यक्त किया गया है। कोई पादटिप्पणी आवश्यक नहीं है।
