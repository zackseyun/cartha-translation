base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/009.yaml
  text: 9. And I saw other stones being thrown far from the tower and coming into the road, and not remaining in the road but rolling into the wasteland; others falling into fire and being burned; others falling near waters and not being able to roll into the water, though they wanted to roll and come into the water.
translation:
  language: hi
  text: 9. फिर मैंने दूसरे पत्थरों को मीनार से बहुत दूर फेंके जाते और मार्ग में आते देखा; वे मार्ग में टिके नहीं, बल्कि लुढ़ककर निर्जन प्रदेश में चले गए। कुछ आग में गिरकर जल रहे थे। कुछ जल के पास गिरे, पर जल में लुढ़क नहीं सके, यद्यपि वे लुढ़ककर जल में जाना चाहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύργος
  choice: मीनार
  rationale: दर्शन में निर्माणाधीन ऊँची संरचना के लिए सामान्य और सहज हिन्दी शब्द।
- source_word: ὁδός
  choice: मार्ग
  rationale: यह भौतिक रास्ते के साथ प्रतीकात्मक अर्थ भी रख सकता है; ‘मार्ग’ दोनों संभावनाएँ बनाए रखता है।
- source_word: ἀνοδία
  choice: निर्जन प्रदेश
  rationale: शब्द का अर्थ मार्गहीन या उजाड़ भूभाग है; ‘निर्जन प्रदेश’ स्वाभाविक हिन्दी में उस दृश्य को व्यक्त करता है, बिना प्रतीकात्मक अर्थ को निश्चित किए।
- source_word: πῦρ
  choice: आग
  rationale: सरल, वर्तमान और प्रत्यक्ष समतुल्य।
- source_word: ὕδωρ
  choice: जल
  rationale: गरिमापूर्ण सामान्य शैली बनाए रखता है और दर्शन की प्रतीकात्मक संभावना को खुला छोड़ता है।
theological_decisions:
- issue: पत्थरों की क्रियाशील इच्छा
  choice: ‘वे ... जाना चाहते थे’ कहकर मानवीकरण बनाए रखा गया
  alternative: इसे केवल उनके जल की ओर लुढ़कने की भौतिक प्रवृत्ति के रूप में कहना
  rationale: यूनानी participle θελόντων स्पष्टतः इच्छा व्यक्त करता है; पाठ आगे इसका धार्मिक अर्थ खोल सकता है, इसलिए यहाँ उसे कमज़ोर नहीं किया गया।
- issue: मार्ग और जल का प्रतीकात्मक अर्थ
  choice: किसी धार्मिक पहचान या संस्कार से स्पष्ट रूप से नहीं जोड़ा गया
  alternative: मार्ग को विश्वास और जल को बपतिस्मा कहना
  rationale: इस इकाई में प्रतीकों की व्याख्या नहीं दी गई है; अनुवाद को वास्तविक अस्पष्टता और आगे आने वाली व्याख्या के लिए खुला रहना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। दृश्य के क्रम और पुनरावृत्ति को रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
