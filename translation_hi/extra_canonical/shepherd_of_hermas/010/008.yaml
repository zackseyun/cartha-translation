  register: आधुनिक मानक हिन्दी; दृश्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। यूनानी सूची की चारों श्रेणियाँ और उनके बीच का अंतर सुरक्षित रखा गया है।
