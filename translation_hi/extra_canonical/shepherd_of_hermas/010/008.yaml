base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/008.yaml
  text: 8. Many other stones lay around the tower, and they were not using them for the building—for some of them were scabby, others had cracks, others were mutilated, others were white and round, not fitting for the building.
translation:
  language: hi
  text: 8. मीनार के चारों ओर और भी बहुत-से पत्थर पड़े थे, और निर्माण में उनका उपयोग नहीं किया जा रहा था; क्योंकि उनमें से कुछ पपड़ीदार थे, कुछ में दरारें थीं, कुछ खंडित थे, और कुछ सफेद और गोल थे, जो निर्माण में लगाने योग्य नहीं थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύργου
  choice: मीनार
  rationale: दृश्य में निर्मित हो रही ऊँची संरचना के लिए सामान्य और स्पष्ट हिन्दी शब्द।
- source_word: ἐψωριακότες
  choice: पपड़ीदार
  rationale: पत्थरों की सतह पर खुजली-जैसी खराबी या पपड़ी होने के रूपक को निकटता से व्यक्त करता है।
- source_word: σχισμὰς ἔχοντες
  choice: दरारें थीं
  rationale: पत्थरों में फटन या चीर होने का स्वाभाविक हिन्दी वर्णन।
- source_word: κεκολοβωμένοι
  choice: अधूरे कटे हुए
  rationale: शब्द का भाव काटकर छोटा, विकृत या अपूर्ण कर दिए जाने का है; यह विकल्प पत्थर की आकृति के संदर्भ में अर्थ स्पष्ट रखते हुए अनावश्यक विशिष्टता से बचता है।
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: भवन में लगाने योग्य नहीं थे
  rationale: शाब्दिक 'निर्माण में ठीक नहीं बैठते थे' का सहज हिन्दी रूप, जिसमें संरचना के लिए अनुपयुक्त होने का अर्थ सुरक्षित है।
