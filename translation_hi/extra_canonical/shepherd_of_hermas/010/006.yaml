base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/006.yaml
  text: 6. The stones hauled up from the deep they set, every one, into the building just as they were; for they were fitted and matched the joining with the other stones, and so were joined to one another, so that their joint was not visible. The construction of the tower appeared as if it had been built from a single stone.
translation:
  language: hi
  text: 6. गहरे जल से ऊपर खींचे गए उन सभी पत्थरों को उन्होंने ज्यों-का-त्यों निर्माण में लगा दिया; क्योंकि वे ठीक से जुड़े हुए थे और अन्य पत्थरों के साथ उनका संधान मेल खाता था। इस प्रकार वे आपस में जुड़ गए कि उनका संधान दिखाई नहीं देता था। मीनार का निर्माण ऐसा दिखाई देता था, मानो वह एक ही पत्थर से बनाया गया हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυθοῦ
  choice: गहरे जल
  rationale: दृश्य के संदर्भ में यह जल की गहराई अथवा तल को दर्शाता है; ‘गहरे जल’ सामान्य पाठक के लिए स्वाभाविक है और स्रोत का स्थान-बोध बनाए रखता है।
- source_word: οἰκοδομήν / οἰκοδομὴ
  choice: भवन / बनावट
  rationale: पहले प्रयोग में निर्माणाधीन संरचना में पत्थर लगाए जाने का भाव है, इसलिए ‘भवन’; दूसरे में मीनार की निर्मित संरचना का रूप, इसलिए ‘बनावट’।
- source_word: ἡρμοσμένοι
  choice: ठीक नाप के थे
  rationale: पत्थरों के पहले से उपयुक्त ढंग से तराशे और फिट होने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: συνεφώνουν τῇ ἁρμογῇ
  choice: जोड़ के साथ पूरी तरह मेल खाते थे
  rationale: शाब्दिक ‘सहमति’ के बजाय स्थापत्य-संदर्भ में अनुकूलता और सटीक मेल का अर्थ देता है।
- source_word: ἐκολλῶντο ἀλλήλοις
  choice: आपस में इस तरह जुड़ गए
  rationale: पत्थरों के घनिष्ठता से सटकर एक हो जाने का अर्थ देता है, बिना आधुनिक चिपकाने वाले पदार्थ का संकेत किए।
- source_word: πύργου
  choice: मीनार
  rationale: दृश्य में निर्मित ऊँची संरचना के लिए आधुनिक मानक हिन्दी का स्पष्ट और स्वाभाविक शब्द।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और दृश्यात्मक हिन्दी रखी गई है। स्थापत्य संबंधी पुनरुक्तियों को पूरी तरह हटाया नहीं गया, ताकि यूनानी पाठ में जोड़, मेल और एकरूपता पर दिया गया बल बना रहे। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
