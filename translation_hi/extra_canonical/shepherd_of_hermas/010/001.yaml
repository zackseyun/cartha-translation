base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/001.yaml
  text: '1. “What,” I said, “did they endure?” She says, “Listen: scourges, imprisonments, great afflictions, crosses, wild beasts—for the sake of the Name. For this reason the right-hand parts of the sanctuary belong to them, and to whoever suffers because of the Name; but the left-hand parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts are the same and the promises the same—only those on the right sit there and have some glory.”'
translation:
  language: hi
  text: '1. मैंने पूछा, “उन्होंने क्या-क्या सहा?” उसने कहा, “सुनो: कोड़े, कैद, बड़े क्लेश, क्रूस और जंगली पशु—नाम के कारण। इसी कारण पवित्रस्थान के दाहिने भाग उनके लिए हैं, और हर उस व्यक्ति के लिए भी जो नाम के कारण दुःख सहता है; पर शेष लोगों के लिए बाएँ भाग हैं। फिर भी दोनों के लिए—दाहिनी ओर बैठनेवालों और बाईं ओर बैठनेवालों के लिए—वरदान एक ही हैं और प्रतिज्ञाएँ भी एक ही हैं। केवल वे दाहिनी ओर बैठते हैं और उन्हें कुछ महिमा प्राप्त है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπήνεγκαν
  choice: सहा
  rationale: क्रिया में उत्पीड़न और कष्ट को धैर्यपूर्वक झेलने का भाव है; आधुनिक हिन्दी में ‘सहा’ स्वाभाविक और सटीक है।
- source_word: μάστιγας
  choice: कोड़े
  rationale: यहाँ बहुवचन यातनात्मक कोड़े मारे जाने का संकेत देता है; संक्षिप्त सूची में ‘कोड़े’ उपयुक्त है।
- source_word: φυλακάς
  choice: कैद
  rationale: संदर्भ में कारावास या बंदीकरण अभिप्रेत है; ‘कैद’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: σταυρούς
  choice: क्रूस
  rationale: बहुवचन उत्पीड़न के साधन अथवा क्रूस पर चढ़ाए जाने के अनुभवों को सूचीबद्ध करता है; हिन्दी मसीही साहित्य में ‘क्रूस’ स्थापित शब्द है।
- source_word: εἵνεκεν τοῦ ὀνόματος / διὰ τὸ ὄνομα
  choice: नाम के कारण
  rationale: मूल पाठ की जानबूझकर की गई अनिर्दिष्टता को बनाए रखा गया है; ‘नाम’ को किसी स्पष्ट नाम से प्रतिस्थापित नहीं किया गया।
- source_word: ἁγιάσματος
  choice: पवित्रस्थान
  rationale: शब्द पवित्र या समर्पित स्थान को सूचित करता है; ‘पवित्रस्थान’ स्थानिक अर्थ और धार्मिक गरिमा दोनों बनाए रखता है।
- source_word: δόξαν τινά
  choice: कुछ विशेष महिमा
  rationale: τινά की सीमित/अनिश्चित मात्रा को ‘कुछ’ से और संदर्भगत सम्मानभेद को ‘विशेष महिमा’ से व्यक्त किया गया है, बिना वरदानों की समानता मिटाए।
theological_decisions:
- issue: ‘नाम’ की पहचान
  choice: ‘नाम’ को बिना विस्तार के रखा गया
  alternative: ‘प्रभु के नाम’ या ‘यीशु के नाम’
  rationale: यूनानी पाठ केवल τὸ ὄνομα कहता है। पाठक संदर्भ से पहचान ग्रहण कर सकता है, पर अनुवाद में उसे स्पष्ट करना मूल की अभिव्यक्ति से आगे जाता।
- issue: दाहिनी और बाईं ओर बैठनेवालों का प्रतिफल
  choice: समान वरदान और प्रतिज्ञाएँ, किंतु दाहिनी ओर वालों को कुछ विशेष महिमा
  alternative: दाहिनी ओर वालों को श्रेष्ठ प्रतिफल
  rationale: मूल पाठ समानता और सम्मानगत भेद दोनों को साथ रखता है। अनुवाद ने इस धार्मिक तनाव को बिना समतल किए सुरक्षित रखा है।
- issue: क्रूसों का आशय
  choice: सूची में ‘क्रूस’ रखा गया
  alternative: ‘क्रूस पर मृत्यु’ या ‘क्रूस उठाना’
  rationale: σταυρούς स्वयं संक्षिप्त और बहुअर्थ-संभावी है; स्पष्ट व्याख्या जोड़ने से मूल की सीमा पार होती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। संवाद का वर्तमानकालीन ‘उसने कहा’ यूनानी φησίν की कथात्मक सजीवता को दर्शाता है। उत्पीड़नों की सूची संक्षिप्त रखी गई है और मूल की पुनरुक्ति—‘वरदान एक ही… प्रतिज्ञाएँ भी एक ही’—को बल देने के लिए बनाए रखा गया है।
