base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/002.yaml
  text: 2. “But you are eager to sit on the right with them; yet your shortcomings are many. Still, you will be cleansed from your shortcomings, and all who are not double-minded will be cleansed from all their sins up to this day.”
translation:
  language: hi
  text: 2. “पर तुम उनके साथ दाहिनी ओर बैठने के लिए बहुत लालायित हो, लेकिन तुम में बहुत-सी कमियाँ हैं। फिर भी, तुम्हें अपनी कमियों से शुद्ध किया जाएगा; और वे सब जो दो मन के नहीं हैं[a], इस दिन तक के अपने सभी पापों से शुद्ध किए जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “दो आत्माओं वाले”; आशय ऐसे लोगों से है जो संदेह या आंतरिक अस्थिरता में बँटे हुए हैं।
    reason: मूल यूनानी रूपक और उसके अर्थ-क्षेत्र को स्पष्ट करना।
lexical_decisions:
- source_word: κατεπίθυμος
  choice: बहुत लालायित
  rationale: यह शब्द बैठने की प्रबल इच्छा को व्यक्त करता है; ‘बहुत लालायित’ उसके बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑστερήματα
  choice: कमियाँ
  rationale: यहाँ बहुवचन शब्द नैतिक या आत्मिक अभावों/दोषों की ओर संकेत करता है। ‘कमियाँ’ उस व्यापकता को बनाए रखता है और उसे केवल ‘पाप’ का समानार्थी नहीं बनाता।
- source_word: διψυχοῦντες
  choice: दो मन वाले
  rationale: यूनानी अभिव्यक्ति का शाब्दिक बिंब सुरक्षित रखा गया है; इसका आशय संदेह, आंतरिक विभाजन या अस्थिरता से हो सकता है।
- source_word: καθαρισθήσῃ / καθαρισθήσονται
  choice: शुद्ध किए जाओगे / शुद्ध किए जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य रूपों को सुरक्षित रखा गया है, बिना कर्ता को पाठ से बाहर स्पष्ट किए।
theological_decisions:
- issue: शुद्ध किए जाने का कर्ता
  choice: कर्मवाच्य रूप रखा गया है
  alternative: ‘परमेश्वर तुम्हें शुद्ध करेगा’
  rationale: मूल पाठ कर्ता का नाम नहीं लेता; इसलिए हिन्दी में भी उसे जोड़ा नहीं गया।
- issue: εἰς ταύτην τὴν ἡμέραν का संबंध
  choice: ‘आज तक के अपने सभी पापों’ से जोड़ा गया है
  alternative: ‘आज के दिन तक शुद्ध किए जाएँगे’
  rationale: वाक्य-विन्यास में यह पद ‘सभी पापों’ की समय-सीमा बताने के रूप में स्वाभाविक है, यद्यपि समयगत संबंध में कुछ व्याकरणिक अस्पष्टता संभव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाहिनी ओर’ पूर्ववर्ती प्रसंग की स्थान-संबंधी भाषा को बनाए रखता है, जबकि ‘कमियाँ’ और ‘पाप’ के बीच मूल पाठ का भेद सुरक्षित है।
