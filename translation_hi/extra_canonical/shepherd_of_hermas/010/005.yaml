base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/005.yaml
  text: 5. The tower was being built in a square by the six young men who had come with her; and myriads of other men were bringing stones, some from the deep and others from the land, and were handing them to the six young men. They would take them and build.
translation:
  language: hi
  text: 5. मीनार का निर्माण वर्गाकार रूप में वे छह युवक कर रहे थे, जो उसके साथ आए थे। और मनुष्यों की असंख्य अन्य टोलियाँ पत्थर ला रही थीं—कुछ जल की गहराई से और कुछ धरती से—और उन्हें उन छह युवकों को दे रही थीं। वे उन्हें लेकर निर्माण करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύργος
  choice: मीनार
  rationale: दृश्य में निर्मित ऊँची संरचना के लिए सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी शब्द।
- source_word: ἐν τετραγώνῳ
  choice: चौकोर आकार में
  rationale: यूनानी पद संरचना के वर्गाकार रूप को बताता है; यह हिन्दी में सहज रहते हुए उस अर्थ को सुरक्षित रखता है।
- source_word: μυριάδες ἀνδρῶν
  choice: असंख्य दूसरे लोग
  rationale: यहाँ μυριάδες अत्यंत बड़ी संख्या का बोध कराता है; 'असंख्य' स्वाभाविक हिन्दी है और ἀνδρῶν को इस सामूहिक श्रम-दृश्य में अनावश्यक रूप से लिंग-विशिष्ट नहीं बनाता।
- source_word: ἐκ τοῦ βυθοῦ
  choice: गहरे जल से
  rationale: βυθός जल की गहराई अथवा तल का संकेत देता है; व्यापक दृश्य के अनुसार अस्पष्टता बनाए रखते हुए 'गहरे जल' चुना गया।
- source_word: ἐκ τῆς γῆς
  choice: धरती से
  rationale: γῆ का सीधा और स्वाभाविक प्रतिरूप, जो जल की गहराई के साथ मूल विरोध को बनाए रखता है।
- source_word: ᾠκοδόμουν
  choice: निर्माण में लगा देते थे
  rationale: केवल 'बनाते थे' की पुनरावृत्ति से बचते हुए यह स्पष्ट करता है कि युवक प्राप्त पत्थरों को मीनार के निर्माण में लगाते थे।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वर्णनात्मक शैली रखी गई है। मूल के क्रम, अपूर्णकालीन निरंतर क्रिया और पत्थरों के दो स्रोतों को स्पष्ट रूप से सुरक्षित रखा गया है।
