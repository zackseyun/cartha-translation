base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/026/001.yaml
  text: First of all, believe that God is one—the one who created and ordered all things, and made all things out of nonexistence into being, and who contains all things, while he alone is uncontainable. Therefore believe him and fear him; and having feared, exercise self-control. Keep these things, and you will cast off all wickedness from yourself and put on every virtue of righteousness, and you will live to God, if you keep this command.
translation:
  language: hi
  text: सबसे पहले यह विश्वास करो कि परमेश्वर एक है—वही जिसने सब कुछ रचा और सुव्यवस्थित किया, और सब कुछ को जो अस्तित्व में नहीं था, वहाँ से अस्तित्व में लाकर बनाया। वह सब कुछ को अपने में समेटे हुए है, पर अकेला वही है जो स्वयं किसी में समा नहीं सकता।[a] इसलिए उस पर विश्वास रखो और उसका भय मानो; और उसका भय मानकर आत्म-संयम रखो। इन बातों का पालन करो, तब तुम अपने भीतर से सारी दुष्टता उतार फेंकोगे और धार्मिकता के हर सद्गुण को धारण करोगे। यदि तुम इस आज्ञा का पालन करोगे, तो परमेश्वर के लिए जीवित रहोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ ऐसे शब्दों का प्रयोग है जिनमें ‘समाना’, ‘धारण करना’ और ‘सीमा में न समा सकना’ के भाव जुड़े हैं। इसलिए वाक्य का अर्थ यह भी हो सकता है: ‘वह सब वस्तुओं को धारण करता है, पर स्वयं किसी सीमा में धारण नहीं किया जा सकता।’'
    reason: χωρῶν और ἀχώρητος के शब्द-खेल और अर्थ-विस्तार को सुरक्षित रखता है, बिना मुख्य पाठ के धारण/असीमता संबंधी विरोध को बदलने के।
lexical_decisions:
- source_word: καταρτίσας
  choice: सुव्यवस्थित किया
  rationale: यह शब्द सृष्टि को व्यवस्थित, तैयार या उचित क्रम में स्थापित करने का भाव देता है; ‘सुव्यवस्थित किया’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι
  choice: जो नहीं था उसे अस्तित्व में लाकर
  rationale: यूनानी के ‘न होने से होने में’ के दार्शनिक-सृष्टिगत भाव को स्पष्ट रखते हुए हिन्दी में सहज बनाया गया है।
- source_word: πάντα χωρῶν, μόνος δὲ ἀχώρητος ὤν
  choice: वह सबको अपने में समाता है, पर अकेला वही है जिसे कोई अपने में नहीं समा सकता
  rationale: χωρέω/ἀχώρητος के परस्पर-विरोधी शब्द-खेल और परमेश्वर की सर्वव्यापकता तथा असीमता के तनाव को बनाए रखता है।
- source_word: φοβήθητι αὐτόν
  choice: उसका भय मानो
  rationale: ‘भय’ को केवल आतंक या केवल श्रद्धा में सीमित किए बिना मूल की धार्मिक-नैतिक गंभीरता सुरक्षित रखी गई है।
- source_word: ἐγκράτευσαι
  choice: आत्म-संयम रखो
  rationale: यह क्रिया इच्छाओं और आचरण पर नियंत्रण का संकेत देती है; ‘आत्म-संयम’ इसका प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: ζήσῃ τῷ θεῷ
  choice: परमेश्वर के लिए जीवित रहोगे
  rationale: सम्प्रदान कारक के खुले अर्थ को बनाए रखता है; इसे ‘परमेश्वर में’ या ‘परमेश्वर के सामने’ कहकर अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर द्वारा सबको समाने और स्वयं न समाए जा सकने का कथन
  choice: स्थानिक और रूपक—दोनों संभावनाओं को खुला रखने वाली भाषा
  alternative: ‘वह सब कुछ समझता है, पर कोई उसे पूरी तरह नहीं समझ सकता’
  rationale: यूनानी χωρέω में समाना, धारण करना या ग्रहण करना जैसे अर्थ संभव हैं। केवल ज्ञान-संबंधी अर्थ चुनने से मूल की व्यापकता और शब्द-युग्म का तनाव घट जाता।
- issue: ‘परमेश्वर के लिए जीवित रहना’
  choice: मूल के सम्प्रदान संबंध को सीधे बनाए रखा
  alternative: ‘परमेश्वर में जीवित रहोगे’
  rationale: ‘में’ कहना किसी विशिष्ट रहस्यवादी या पौलुसी अर्थ को आयात कर सकता था; ‘के लिए’ नैतिक समर्पण का स्वाभाविक अर्थ देता है और मूल के निकट है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञार्थक वाक्यों की सीधी नैतिक शक्ति बनाए रखी गई है। ‘उतार फेंकोगे’ और ‘धारण करोगे’ द्वारा यूनानी के वस्त्र-संबंधी विरोधी रूपक को यथासंभव सुरक्षित रखा गया है।
