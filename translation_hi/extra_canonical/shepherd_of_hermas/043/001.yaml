  text: “I wanted,” I said, “sir, to know in what ways I must serve desire…”
translation:
  language: hi
  text: मैंने कहा, “स्वामी, मैं जानना चाहता था कि मुझे किन तरीकों से अभिलाषा की सेवा करनी चाहिए…”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: स्वामी
  rationale: यह सम्मानपूर्ण संबोधन है और संवाद में वक्ता तथा संबोधित व्यक्ति के संबंध को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ποίοις τρόποις
  choice: किन तरीकों से
  rationale: यूनानी बहुवचन और रीति अथवा उपाय संबंधी प्रश्न को सीधे बनाए रखता है।
- source_word: δεῖ
  choice: चाहिए
  rationale: आवश्यकता अथवा कर्तव्य का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δουλεῦσαι
  choice: सेवा करनी
  rationale: क्रिया के मूल सेवकत्व-संबंधी अर्थ को सुरक्षित रखता है; इसे केवल ‘मानना’ या ‘पूरा करना’ कहकर अर्थ को हल्का नहीं किया गया।
- source_word: ἐπιθυμίᾳ
  choice: अभिलाषा
  rationale: शब्द इच्छा या लालसा को सूचित कर सकता है; ‘अभिलाषा’ अपेक्षाकृत तटस्थ है और इस अपूर्ण अंश में उसे स्वतः बुरी वासना नहीं ठहराता।
theological_decisions:
- issue: ‘अभिलाषा की सेवा’ का असामान्य और संभावित रूप से तनावपूर्ण कथन
  choice: अभिलाषा की सेवा करनी
  alternative: अच्छी अभिलाषा के अनुसार चलना
  rationale: दिए गए यूनानी अंश में विशेषण उपलब्ध नहीं है और पाठ अंत में खंडित है। इसलिए किसी नैतिक विशेषण को जोड़कर तनाव को चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण संवाद-शैली रखी गई है। स्रोत-पाठ के अधूरे अंत को दीर्घविराम से दिखाया गया है; अनुपलब्ध शब्दों की पूर्ति नहीं की गई।
