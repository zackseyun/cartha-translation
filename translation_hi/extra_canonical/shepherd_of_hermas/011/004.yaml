  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/004.yaml
  text: I say to her, "Lady, since once for all you considered me worthy for everything to be revealed to me, reveal it." She says to me, "Whatever can be revealed to you will be revealed. Only let your heart be toward God, and do not be double-minded in whatever you see."
translation:
  language: hi
  text: मैं उससे कहता हूँ, “मालकिन, जब आपने एक बार मुझे सब कुछ प्रकट करने के योग्य समझा है, तो प्रकट कीजिए।” वह मुझसे कहती है, “जो कुछ तुम पर प्रकट किया जा सकता है, वह प्रकट किया जाएगा। बस तुम्हारा हृदय परमेश्वर की ओर रहे, और जो कुछ तुम देखो उसके विषय में संदेह में मत पड़ना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: हे देवी
  rationale: यहाँ स्त्री-रूप में प्रकट कलीसिया के लिए सम्मानपूर्ण संबोधन है; ‘देवी’ आधुनिक हिन्दी में स्त्री के प्रति आदरसूचक संबोधन का भाव रखता है, बिना उसे ईश्वर ठहराए।
- source_word: ἠξίών με ἠγήσω
  choice: आपने मुझे इस योग्य समझा
  rationale: यूनानी पदबंध का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप, जिसमें वक्ता को योग्य माने जाने का भाव सुरक्षित है।
- source_word: ἐνδέχηταί σοι ἀποκαλυφθῆναι
  choice: तुम पर प्रकट किया जा सकता है
  rationale: ἐνδέχομαι की संभावना अथवा अनुमति की अस्पष्टता को किसी एक अर्थ में सीमित किए बिना रखा गया है।
- source_word: ἡ καρδία σου πρὸς τὸν Θεὸν ἤτω
  choice: तुम्हारा हृदय परमेश्वर की ओर लगा रहे
  rationale: दिशा और स्थिर अभिमुखता—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μὴ διψυχήσῃς
  choice: दुविधा में न पड़ो
  rationale: शाब्दिक ‘दो मन वाला’ के बजाय संदेह अथवा आंतरिक विभाजन का स्वाभाविक हिन्दी भाव देता है।
theological_decisions:
- issue: प्रकाशित किए जा सकने की सीमा
  choice: जो कुछ तुम पर प्रकट किया जा सकता है
  alternative: जो कुछ तुम्हारे लिए प्रकट करना उचित है
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि सीमा संभावना, अनुमति या पात्रता से आती है; अनुवाद इस तनाव को खुला रखता है।
- issue: διψυχέω का अर्थ
  choice: दुविधा में न पड़ो
  alternative: संदेह न करो / दो मन के न होओ
  rationale: ‘दुविधा’ दर्शन के विषय में संदेह और मन के बँटे होने—दोनों संभावित भावों को समेटती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संवादात्मक शैली रखी गई है। ‘आप’ से स्त्री-रूप कलीसिया के प्रति हरमास का सम्मान और उत्तर में ‘तुम’ से उसके अधिकारपूर्ण, आत्मीय संबोधन को व्यक्त किया गया है।
