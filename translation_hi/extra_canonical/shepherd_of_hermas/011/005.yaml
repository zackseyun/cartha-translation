  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/005.yaml
  text: 'I asked her, "Why has the tower been built upon the waters, lady?" She says, "I told you before also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower has been built upon the waters—listen: because your life was saved through water and will be saved. And the tower has been founded by the word of the almighty and glorious Name, and is held fast by the unseen power of the Master."'
translation:
  language: hi
  text: 'मैंने उससे पूछा, “हे स्वामिनी, यह मीनार पानी के ऊपर क्यों बनाई गई है?” उसने कहा, “मैंने तुम्हें पहले भी बताया था, और तुम लगन से खोजते हो; इसलिए खोजने से तुम सत्य पाते हो। तो फिर सुनो कि मीनार पानी के ऊपर क्यों बनाई गई है: क्योंकि तुम्हारा जीवन पानी के द्वारा बचाया गया था और बचाया जाएगा। मीनार की नींव सर्वशक्तिमान और महिमामय नाम के वचन द्वारा रखी गई है, और वह स्वामी की अदृश्य सामर्थ्य से थामी हुई है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύργος
  choice: मीनार
  rationale: निर्माणाधीन ऊँची संरचना के लिए सहज और प्रसंगानुकूल आधुनिक हिन्दी शब्द।
- source_word: ἐπὶ ὑδάτων
  choice: पानी के ऊपर
  rationale: बहुवचन यूनानी रूप यहाँ जल-क्षेत्र का बोध कराता है; स्वाभाविक हिन्दी में ‘पानी के ऊपर’ अर्थ को स्पष्ट रखता है।
- source_word: ἐκζητεῖς ἐπιμελῶς
  choice: लगन से खोजते हो
  rationale: क्रिया में गहन खोज और क्रियाविशेषण में तत्परता/परिश्रम—दोनों को संक्षेप में व्यक्त करता है।
- source_word: διὰ ὕδατος
  choice: पानी के द्वारा
  rationale: माध्यमसूचक διά को बनाए रखता है और संभावित बपतिस्माई संकेत को व्याख्या में बदले बिना सुरक्षित रखता है।
- source_word: ῥῆμα
  choice: वचन
  rationale: दैवी कथन या आदेश का गरिमापूर्ण और प्रचलित हिन्दी प्रतिरूप।
- source_word: δεσπότης
  choice: स्वामी
  rationale: प्रभुत्व और अधिकार का भाव देता है, जबकि ‘मालिक’ की अपेक्षा धार्मिक-साहित्यिक गरिमा रखता है।
- source_word: κρατεῖται
  choice: स्थिर बनी हुई है
  rationale: अदृश्य सामर्थ्य द्वारा थामे, संभाले और दृढ़ रखे जाने का निष्क्रिय भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पानी के द्वारा जीवन का उद्धार
  choice: “तुम्हारा जीवन पानी के द्वारा बचाया गया था और बचाया जाएगा”
  alternative: इसे स्पष्ट रूप से ‘बपतिस्मा के द्वारा उद्धार’ कहना
  rationale: मूल पाठ केवल ὕδωρ कहता है; संभावित बपतिस्माई अर्थ को खुला रखते हुए ऐसी विशिष्ट व्याख्या नहीं जोड़ी गई जो शब्दशः उपस्थित नहीं है।
- issue: सर्वशक्तिमान और महिमामय नाम का व्याकरणिक संबंध
  choice: “सर्वशक्तिमान के वचन और उसके महिमामय नाम के द्वारा”
  alternative: “सर्वशक्तिमान और महिमामय नाम के वचन के द्वारा”
  rationale: यूनानी τῷ ῥήματι τοῦ παντοκράτορος καὶ ἐνδόξου ὀνόματος की संरचना कुछ संकुचित और संभावित रूप से अस्पष्ट है। हिन्दी में सर्वशक्तिमान को व्यक्ति और महिमामय नाम को उससे संबद्ध रखते हुए अर्थपूर्ण वाक्य बनाया गया, बिना नाम की अलग सत्ता सुझाए।
- issue: भूत और भविष्य उद्धार
  choice: 'दोनों कालों को स्पष्ट रखा गया: “बचाया गया था और बचाया जाएगा”'
  alternative: सामान्य वर्तमान कथन, जैसे “बचता है”
  rationale: ἐσώθη और σωθήσεται का कालगत तनाव मूल में महत्वपूर्ण है और उसे समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, संवादात्मक पर गरिमापूर्ण शैली। ‘हे स्वामिनी’ से संबोधन की सम्मानसूचकता और प्राचीन दर्शनात्मक परिवेश बना रहता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
