base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/003.yaml
  text: '"The tower that you see being built, I am the Church, the one shown to you both now and before. Whatever, therefore, you wish to ask about the tower, I will reveal to you, so that you may rejoice with the saints."'
translation:
  language: hi
  text: “जो मीनार तुम बनते हुए देख रहे हो, वह मैं ही हूँ—कलीसिया, जो तुम्हें अब और पहले भी दिखाई दी थी। इसलिए मीनार के विषय में तुम जो कुछ पूछना चाहो, पूछो; मैं तुम्हें प्रकट करूँगी, ताकि तुम पवित्र जनों के साथ आनन्दित हो सको।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύργος
  choice: मीनार
  rationale: यह निर्माणाधीन ऊँची संरचना के लिए स्वाभाविक और सामान्य आधुनिक हिन्दी शब्द है तथा पूरे दर्शन के प्रमुख रूपक को स्पष्ट रखता है।
- source_word: ἡ Ἐκκλησία
  choice: कलीसिया
  rationale: यह प्राचीन मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में परिचित शब्द है और यहाँ बोलने वाली स्त्री के रूप में कलीसिया के व्यक्तित्वकरण को बनाए रखता है।
- source_word: ἡ ὀφθεῖσά σοι
  choice: जो तुम्हें ... दिखाई दी थी
  rationale: निष्क्रिय कृदन्त का अर्थ स्वाभाविक हिन्दी में व्यक्त करते हुए पहले हुए दर्शन का संकेत सुरक्षित रखा गया है।
- source_word: ἐπερωτᾷν
  choice: पूछना
  rationale: सन्दर्भ में इसका अर्थ मीनार के विषय में प्रश्न करना है; सरल क्रिया आधुनिक पाठक के लिए सहज है।
- source_word: ἀποκαλύψω
  choice: प्रकट करूँगी
  rationale: यह रहस्योद्घाटन के भाव को बनाए रखता है और केवल सामान्य ‘बताना’ से अधिक निकट है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों
  rationale: यह विशेषण के संज्ञात्मक बहुवचन को दर्शाता है और ‘संतों’ से जुड़ी बाद की संकीर्ण संस्थागत ध्वनि से बचता है।
theological_decisions:
- issue: मीनार और कलीसिया की पहचान
  choice: “वह मैं हूँ—कलीसिया”
  alternative: “वह कलीसिया हूँ मैं” अथवा “वह कलीसिया है”
  rationale: ग्रीक ἐγώ εἰμι ἡ Ἐκκλησία में बोलने वाली स्त्री स्वयं को मीनार और कलीसिया दोनों के रूप में पहचानती है। अनुवाद इस प्रत्यक्ष व्यक्तित्वकरण को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: τῶν ἁγίων का आशय
  choice: “पवित्र जनों के साथ”
  alternative: “संतों के साथ”
  rationale: मूल यह निर्धारित नहीं करता कि किसी औपचारिक रूप से मान्य विशिष्ट वर्ग का संकेत है; इसलिए व्यापक सामुदायिक अर्थ को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज संवाद-शैली अपनाई गई है। स्त्री वक्ता के कारण ‘प्रकट करूँगी’ रखा गया है। मूल के आदेशात्मक ἐπερώτα को स्पष्ट करने के लिए दूसरे ‘पूछो’ का प्रयोग किया गया है; इससे वाक्य हिन्दी में पूर्ण और स्वाभाविक बनता है। कोई पादटिप्पणी आवश्यक नहीं है।
