  text: After showing me these things, she wanted to go away. I say to her, "Lady, what profit is it to me to have seen these things and not know what the matters are?" Answering me, she says, "You are a cunning man, wanting to know the things concerning the tower." "Yes, lady," I say, "so that I may report them to the brothers, and that, becoming more cheerful and hearing these things, they may know the Lord in much glory."
translation:
  language: hi
  text: ये बातें मुझे दिखाने के बाद वह चली जाना चाहती थी। मैंने उससे कहा, “महोदया, इन बातों को देखकर भी, यदि मैं न जानूँ कि ये बातें क्या हैं, तो मुझे क्या लाभ?” उसने मुझे उत्तर दिया, “तुम बहुत चालाक आदमी हो, जो मीनार से संबंधित बातें जानना चाहते हो।” मैंने कहा, “हाँ, महोदया, ताकि मैं भाइयों को ये बातें बताऊँ, और वे अधिक प्रसन्न हों, और ये बातें सुनकर बहुत महिमा में प्रभु को जानें।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और वे अधिक प्रसन्न हों, और ये बातें”—दिए गए यूनानी संस्करण में यह पाठांश कोष्ठकों में है, जो इसके पाठ के बारे में अनिश्चितता का संकेत देता है।
    reason: यूनानी पाठ में ἱλαρώτεροι γένωνται, καὶ ταῦτα को कोष्ठकों में रखा गया है। अनुवाद में इसे रखा गया है और संपादकीय पाठ-अनिश्चितता की सूचना दी गई है।
lexical_decisions:
- source_word: Κυρία
  choice: देवी
  rationale: यहाँ सम्मानपूर्वक संबोधन के रूप में प्रयुक्त स्त्रीलिंग पद है; दर्शन में प्रकट स्त्री के लिए ‘देवी’ स्वाभाविक और गरिमापूर्ण है, यद्यपि इसका आशय किसी पृथक देवता की घोषणा करना नहीं है।
- source_word: Πανοῦργος
  choice: बड़े चतुर
  rationale: शब्द में ‘चालाक/धूर्त’ का रंग हो सकता है, पर प्रसंग में यह हल्की झिड़की के साथ उसकी जिज्ञासु सूझ-बूझ को बताता है; ‘बड़े चतुर’ उस द्विअर्थी लहजे को सहज हिंदी में रखता है।
- source_word: τὰ περὶ τὸν πύργον
  choice: मीनार के विषय में
  rationale: यह मीनार से संबंधित बातों या उसके अर्थ की ओर संकेत करता है; अनावश्यक व्याख्या जोड़े बिना व्यापक अभिव्यक्ति रखी गई है।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: आरंभिक मसीही समुदाय के सामुदायिक संबोधन का सीधा और पारंपरिक हिंदी रूप।
- source_word: ἐν πολλῇ δόξῃ
  choice: महान महिमा में
  rationale: यूनानी पदबंध की संभावित अर्थगत असहजता और खुलापन सुरक्षित रखा गया है; इसे ‘प्रभु की महान महिमा जानें’ बनाकर चुपचाप नहीं सुलझाया गया।
theological_decisions:
- issue: ‘प्रभु को महान महिमा में जानें’ का संबंध
  choice: ‘प्रभु को महान महिमा में जानें’
  alternative: ‘प्रभु की महान महिमा को जानें’
  rationale: मूल में कर्म ‘प्रभु’ है और ‘महान महिमा में’ क्रियाविशेषणीय पदबंध है। वैकल्पिक अनुवाद अधिक सहज है, पर व्याकरणिक संबंध बदल देता और मूल की वास्तविक अस्पष्टता मिटा देता।
- issue: दर्शन की स्त्री को Κυρία कहकर संबोधित करना
  choice: ‘देवी’ को सम्मानसूचक संबोधन के रूप में रखा
  alternative: ‘स्वामिनी’ या ‘महोदया’
  rationale: प्राचीन धार्मिक-दर्शनात्मक संदर्भ और स्त्री पात्र की गरिमा को व्यक्त करने हेतु ‘देवी’ चुना गया है; इससे उसके विषय में कोई अतिरिक्त दैवी सिद्धांत स्थापित नहीं किया गया।
