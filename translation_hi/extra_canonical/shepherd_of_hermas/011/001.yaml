  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण संवाद-शैली। ऐतिहासिक वर्तमान (‘मैंने कहा’ के स्थान पर मूल में ‘मैं कहता हूँ’) को स्वाभाविक हिंदी कथन-प्रवाह के लिए भूतकाल में रूपांतरित किया गया है। ‘मीनार’ को सामान्य पाठक के लिए सहज वास्तु-शब्द के रूप में चुना गया है।
