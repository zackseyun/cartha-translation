base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/002.yaml
  text: She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and repent, they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."
translation:
  language: hi
  text: उसने कहा, “बहुत लोग सुनेंगे; और सुनकर उनमें से कुछ आनन्दित होंगे, पर कुछ रोएँगे। लेकिन ये भी, यदि सुनें और पश्चाताप करें, तो आनन्दित होंगे। इसलिए मीनार के दृष्टान्त सुनो, क्योंकि मैं तुम्हें सब कुछ प्रकट करूँगी। और प्रकटीकरणों के विषय में अब मुझे और कष्ट न दो, क्योंकि इन प्रकटीकरणों की एक सीमा है; वे पूरे हो चुके हैं। पर तुम प्रकटीकरण माँगना नहीं छोड़ोगे, क्योंकि तुम निर्लज्ज हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραβολὰς
  choice: दृष्टान्त
  rationale: यहाँ मीनार के विभिन्न अंगों और उनके अर्थ के बीच प्रतीकात्मक तुलना और व्याख्या अभिप्रेत है; ‘दृष्टान्त’ इस साहित्यिक और धार्मिक प्रयोग को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποκαλύψεις
  choice: प्रकाशन
  rationale: शब्द का आशय दिव्य रूप से प्रकट की गई बातों या दर्शनों से है। ‘प्रकाशन’ इस पुनरावृत्त तकनीकी शब्द को बनाए रखता है और इसे केवल सामान्य ‘बताने’ तक सीमित नहीं करता।
- source_word: μετανοήσωσιν
  choice: पश्चाताप करें
  rationale: यह मन और आचरण के परिवर्तन की धार्मिक धारणा को व्यक्त करने वाला प्रचलित तथा स्रोत-संगत हिन्दी पद है।
- source_word: ἀναιδὴς
  choice: निर्लज्ज
  rationale: यूनानी शब्द में संकोचहीन, हठीली माँग का कठोर भाव है; ‘निर्लज्ज’ कथन की फटकार को नरम किए बिना सुरक्षित रखता है।
- source_word: κόπους πάρεχε
  choice: कष्ट न दो
  rationale: मुहावरे का अर्थ किसी को परेशानी या श्रम देना है; ‘कष्ट न दो’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: रोने वालों के आनन्द की शर्त
  choice: “यदि ये भी सुनें और पश्चाताप करें”
  alternative: “यदि वे ध्यान से सुनकर पश्चाताप करें”
  rationale: स्रोत में ἀκούσωσιν और μετανοήσωσιν दो समन्वित क्रियाएँ हैं। अनुवाद ने ‘सुनने’ में ‘ध्यान से’ जैसी व्याख्यात्मक वृद्धि नहीं की और पश्चाताप को स्पष्ट शर्त के रूप में बनाए रखा।
- issue: प्रकाशनों का अन्त और उनका पूरा होना
  choice: 'दोनों कथनों को रखा गया: “अन्त आ गया है; वे पूरे हो चुके हैं”'
  alternative: दोनों को मिलाकर “प्रकाशन पूरे हो गए हैं”
  rationale: स्रोत τέλος ἔχουσιν और πεπληρωμέναι εἰσιν को अलग-अलग कारणात्मक कथनों में रखता है। सम्भावित अर्थगत तनाव और जोर को बनाए रखने के लिए दोनों अभिव्यक्तियाँ सुरक्षित रखी गईं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण है। स्त्री वक्ता के कारण ‘प्रकट करूँगी’ रखा गया है। प्रत्यक्ष कथन का कठोर और कुछ हद तक हास्यपूर्ण समापन ‘तुम निर्लज्ज हो’ के रूप में बिना नरम किए अनूदित है।
