base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/001.yaml
  text: Foremost of all is desire for another’s wife or husband, and for the luxury of wealth, and for many vain foods and drunken drinks, and for many other foolish indulgences; for every indulgence is foolish and empty for the servants of God.
translation:
  language: hi
  text: सबसे बढ़कर, किसी और की स्त्री या पुरुष की लालसा, धन-संपत्ति के विलास की लालसा, बहुत-से व्यर्थ व्यंजनों और मतवाले करने वाले पेयों की लालसा, और बहुत-से अन्य मूर्खतापूर्ण भोग-विलासों की लालसा है; क्योंकि हर भोग-विलास परमेश्वर के सेवकों के लिए मूर्खतापूर्ण और खोखला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντων προέχουσα
  choice: सबसे बढ़कर
  rationale: यूनानी पदबंध की प्रधानता या प्रमुखता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना तुलना का कोई अनिर्दिष्ट समूह जोड़कर अर्थ को सीमित किए।
- source_word: γυναικὸς ἀλλοτρίας ἢ ἀνδρός
  choice: पराई स्त्री या पराए पुरुष की
  rationale: ἀλλοτρίας का वैवाहिक-अनधिकार संबंधी भाव ‘पराई’ से आता है; ἀνδρός को स्त्री के समांतर ‘पुरुष’ रखा गया है, ताकि इसे केवल ‘पति’ तक सीमित न किया जाए।
- source_word: πολυτελείας πλούτου
  choice: धन-दौलत की विलासिता
  rationale: πλοῦτος के धन-संपत्ति और πολυτέλεια के महँगे ठाठ-विलास के भाव को संक्षिप्त, आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐδεσμάτων πολλῶν ματαίων
  choice: बहुत-से व्यर्थ व्यंजनों
  rationale: ἐδέσματα के लिए ‘व्यंजन’ और μάταιος के खोखले/निष्फल भाव के लिए ‘व्यर्थ’ चुना गया है।
- source_word: μεθυσμάτων
  choice: नशीले पेय पदार्थों
  rationale: शब्द का आशय ऐसे पेय से है जो मतवाला करते हैं; यह ‘मतवाले पेय’ जैसे अस्वाभाविक शब्दशः अनुवाद से अधिक स्पष्ट है।
- source_word: τρυφῶν / τρυφὴ
  choice: भोग-विलासों / भोग-विलास
  rationale: τρυφή में ऐश, लाड़-प्यार और इंद्रिय-सुख का भाव है; ‘भोग-विलास’ इस नैतिक संदर्भ में सहज और पर्याप्त व्यापक है।
- source_word: κενή
  choice: खोखला
  rationale: यहाँ ‘रिक्त’ की अपेक्षा ‘खोखला’ नैतिक निरर्थकता को सामान्य आधुनिक हिन्दी में अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δούλοις τοῦ Θεοῦ
  choice: परमेश्वर के सेवकों
  rationale: धार्मिक हिन्दी में प्रचलित और गरिमापूर्ण रूप है; ‘दास’ की शाब्दिकता की अपेक्षा सेवा और अधीनता दोनों को पठनीय ढंग से व्यक्त करता है।
theological_decisions:
- issue: γυναικὸς ἀλλοτρίας ἢ ἀνδρός में ἀνδρός का दायरा
  choice: पराई स्त्री या पराए पुरुष
  alternative: दूसरे की पत्नी या पति
  rationale: ἀνήρ का अर्थ संदर्भानुसार ‘पुरुष’ या ‘पति’ हो सकता है। यूनानी में दूसरे पद के साथ ‘पराया’ विशेषण दोहराया नहीं गया, पर समांतरता से उसका भाव लागू होता है। ‘पुरुष’ मूल की व्यापकता और लैंगिक समांतरता को बनाए रखता है।
- issue: इच्छा की सूची का नैतिक मूल्यांकन
  choice: ‘लालसा’ और अंतिम कारण-वाक्य द्वारा नकारात्मक स्वर
  alternative: आरंभ में ‘बुरी लालसा’ जोड़ना
  rationale: इस पाठ-खंड में πονηρά शब्द नहीं है; वह अगले वाक्य में आता है। इसलिए यहाँ उसे स्पष्ट रूप से जोड़ने के बजाय मूल की क्रमिक प्रस्तुति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठकों के लिए स्पष्ट किन्तु गरिमापूर्ण। सूची की यूनानी संरचना को हिन्दी में बार-बार ‘लालसा’ रखकर स्पष्ट किया गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
