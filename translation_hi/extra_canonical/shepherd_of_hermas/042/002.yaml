base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/002.yaml
  text: 2. These, then, are evil desires, putting the servants of God to death. For this evil desire is the devil’s daughter. Therefore one must abstain from evil desires, so that, by abstaining, you may live to God.
translation:
  language: hi
  text: 2. तो ये लालसाएँ बुरी हैं, जो परमेश्वर के सेवकों को मार डालती हैं। क्योंकि यह बुरी लालसा शैतान की बेटी है। इसलिए बुरी लालसाओं से दूर रहना चाहिए, ताकि उनसे दूर रहकर तुम परमेश्वर के लिए जीवित रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμίαι / ἐπιθυμία
  choice: लालसाएँ / लालसा
  rationale: यहाँ शब्द का संदर्भ अनुचित और विनाशकारी इच्छाओं से है; ‘लालसा’ उस तीव्र, नैतिक रूप से दूषित चाह को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: θανατοῦσαι
  choice: मार डालती हैं
  rationale: यूनानी वर्तमान कृदंत का घातक प्रभाव सीधा और सशक्त है; इसे केवल ‘मृत्यु की ओर ले जाती हैं’ कहकर हल्का नहीं किया गया।
- source_word: ἀπέχεσθαι
  choice: दूर रहना
  rationale: यह बुरी लालसाओं से संयमपूर्वक अलग रहने का भाव देता है और सामान्य पाठक के लिए सहज है।
- source_word: ζήσητε τῷ Θεῷ
  choice: तुम परमेश्वर के लिए जीवित रहो
  rationale: सम्प्रदान कारक τῷ Θεῷ का उद्देश्य/सम्बन्ध वाला खुला अर्थ बनाए रखा गया है; इसे अधिक व्याख्यात्मक धार्मिक पदावली में नहीं बदला गया।
theological_decisions:
- issue: बुरी लालसा को ‘शैतान की बेटी’ कहना
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: ‘शैतान से उत्पन्न है’
  rationale: मूल पाठ में स्पष्ट पारिवारिक रूपक θυγάτηρ है; उसकी तीव्रता और व्यक्तिकरण को व्याख्या में बदलना उचित नहीं।
- issue: ‘परमेश्वर के लिए जीवित रहो’ का अर्थ
  choice: मूल की संक्षिप्त और सम्भावित बहुअर्थी अभिव्यक्ति बनाए रखी
  alternative: ‘परमेश्वर की संगति में जीवित रहो’ या ‘परमेश्वर के अनुसार जीवन बिताओ’
  rationale: यूनानी वाक्यांश जीवन के उद्देश्य, सम्बन्ध या समर्पण की ओर संकेत कर सकता है; अनुवाद किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गंभीर और उपदेशात्मक शैली रखी गई है। बहुवचन ‘ये बुरी लालसाएँ’ पिछले अनुच्छेद में गिनाई गई इच्छाओं से सम्बन्ध बनाए रखता है, जबकि अगले वाक्य का एकवचन मूल पाठ के सामूहिक व्यक्तिकरण को सुरक्षित रखता है।
