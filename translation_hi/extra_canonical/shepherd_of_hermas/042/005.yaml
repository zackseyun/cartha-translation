base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/005.yaml
  text: 5. So then, having been crowned against it, come to the desire for righteousness, and, handing over to it the victory you received, serve it as it wills. If you serve the good desire and submit to it, you will be able to master the evil desire and to subject it as you wish.
translation:
  language: hi
  text: 5. इसलिए, उसके विरुद्ध विजय का मुकुट पाकर, धार्मिकता की अभिलाषा के पास आओ; और जो विजय तुम्हें मिली है, उसे उसे सौंपकर, जैसा वह चाहे उसकी सेवा करो। यदि तुम अच्छी अभिलाषा की सेवा करोगे और उसके अधीन रहोगे, तो बुरी अभिलाषा पर प्रभुत्व पा सकोगे और उसे अपनी इच्छा के अनुसार अधीन कर सकोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στεφανωθεὶς κατ᾽ αὐτῆς
  choice: उस पर विजय का मुकुट पाकर
  rationale: मूल में मुकुट पहनाए जाने की विजय-संबंधी छवि है; ‘विजय का मुकुट’ इसे स्वाभाविक हिन्दी में स्पष्ट रखते हुए रूपक को सुरक्षित रखता है।
- source_word: ἐπιθυμίαν τῆς δικαιοσύνης
  choice: धार्मिकता की अभिलाषा
  rationale: ἐπιθυμία को पूरे खंड में नैतिक रूप से अच्छी या बुरी प्रबल इच्छा के अर्थ में लिया गया है; ‘अभिलाषा’ इस पुनरावृत्ति और व्यक्ति-रूप चित्रण को बनाए रखती है।
- source_word: δούλευσον / δουλεύσῃς
  choice: सेवा करो / सेवा करोगे
  rationale: क्रिया का शाब्दिक बल दास की तरह सेवा करना है, पर आधुनिक हिन्दी में ‘सेवा करना’ व्यक्ति-रूप अभिलाषा के प्रति निष्ठापूर्ण अधीनता को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: κατακυριεῦσαι
  choice: अधिकार कर सकोगे
  rationale: यह प्रभुत्व या स्वामित्व स्थापित करने का अर्थ देता है और अगले ὑποτάξαι (‘अधीन करना’) से पर्याप्त भिन्नता बनाए रखता है।
- source_word: καθὼς βούλει
  choice: अपनी इच्छा के अनुसार
  rationale: ग्रीक में कर्ता ‘तुम’ है; अनुवाद इस बात को स्पष्ट रखता है कि बुरी अभिलाषा को व्यक्ति अपनी इच्छा के अनुसार अधीन कर सकता है।
theological_decisions:
- issue: धार्मिकता की अभिलाषा और अच्छी अभिलाषा का संबंध
  choice: मूल के दोनों अलग पदबंधों को क्रमशः ‘धार्मिकता की अभिलाषा’ और ‘अच्छी अभिलाषा’ रखा गया है।
  alternative: दोनों स्थानों पर एक ही पदबंध, जैसे ‘अच्छी अभिलाषा’, इस्तेमाल करना।
  rationale: लेखक संभवतः एक ही सद्गुणी अभिलाषा की बात कर रहा है, फिर भी मूल की शब्दगत भिन्नता को मिटाना उचित नहीं।
- issue: मानवीय अधीनता और बुरी अभिलाषा पर अधिकार
  choice: 'शर्तात्मक कथन को उसके पूरे बल के साथ रखा गया है: अच्छी अभिलाषा के अधीन रहने पर बुरी अभिलाषा पर अधिकार संभव है।'
  alternative: इसे केवल बाहरी सहायता या तत्काल निष्पापता की प्रतिज्ञा के रूप में विस्तार देना।
  rationale: मूल नैतिक आज्ञा और क्षमता का संबंध बताता है, पर उस क्षमता की दार्शनिक या सिद्धान्तगत व्याख्या नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; उपदेशात्मक, गरिमापूर्ण और सहज। मूल के विस्तृत व्यक्ति-रूपक—अभिलाषा के पास जाना, उसे विजय सौंपना, उसकी सेवा करना और दूसरी अभिलाषा को अधीन करना—को बनाए रखा गया है।
