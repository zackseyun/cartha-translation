base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/004.yaml
  text: 4. But you—put on the desire for righteousness, and, having armed yourself with the fear of the Lord, resist them. For the fear of God dwells in the good desire. If the evil desire sees you armed with the fear of God and resisting it, it will flee far away from you, and it will no longer appear to you, being afraid of your weapons.
translation:
  language: hi
  text: 4. लेकिन तुम धार्मिकता की अभिलाषा को धारण कर लो और प्रभु के भय से लैस होकर उनका सामना करो। क्योंकि परमेश्वर का भय अच्छी अभिलाषा में वास करता है। यदि बुरी अभिलाषा तुम्हें परमेश्वर के भय से लैस और उसका विरोध करते हुए देखेगी, तो वह तुमसे बहुत दूर भाग जाएगी और तुम्हारे हथियारों से डरकर फिर कभी तुम्हें दिखाई नहीं देगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδυσαι
  choice: पहन लो
  rationale: वस्त्र धारण करने के यूनानी रूपक को सीधे और स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐπιθυμίαν τῆς δικαιοσύνης
  choice: धार्मिकता की अभिलाषा
  rationale: ἐπιθυμία की प्रबल इच्छा और δικαιοσύνη के नैतिक अर्थ—दोनों को व्यक्त करता है; निकटवर्ती ‘बुरी अभिलाषा’ के साथ शब्दगत समानता भी बनी रहती है।
- source_word: καθοπλισάμενος τὸν φόβον τοῦ Κυρίου
  choice: प्रभु के भय को हथियार बनाकर
  rationale: मध्यवाच्य कृदन्त और युद्ध-संबंधी रूपक को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀντίστηθι αὐταῖς
  choice: उनका सामना करो
  rationale: बहुवचन सर्वनाम को पिछले अनुच्छेद की बुरी अभिलाषाओं से जोड़ता है और सक्रिय प्रतिरोध का भाव देता है।
- source_word: κατοικεῖ
  choice: वास करता है
  rationale: ‘निवास करने’ के मूल अर्थ और गरिमामय धार्मिक शैली को सुरक्षित रखता है।
- source_word: ὀφθήσεται
  choice: दिखाई नहीं देगी
  rationale: निष्क्रिय रूप ‘देखी जाएगी/प्रकट होगी’ का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: φόβος τοῦ Κυρίου और φόβος τοῦ Θεοῦ का भेद
  choice: क्रमशः ‘प्रभु का भय’ और ‘परमेश्वर का भय’
  alternative: दोनों स्थानों पर ‘परमेश्वर का भय’
  rationale: मूल पाठ के Κυρίου/Θεοῦ भेद को बिना समतल किए सुरक्षित रखा गया है।
- issue: ἐπιθυμία का नैतिक मूल्य
  choice: ‘अभिलाषा’ को अच्छी और बुरी दोनों के लिए समान रखा
  alternative: अच्छी के लिए ‘लालसा’ और बुरी के लिए ‘वासना’
  rationale: यूनानी पाठ में वही संज्ञा दोनों दिशाओं में प्रयुक्त है; अलग शब्द लेने से पाठ का जानबूझकर रखा गया विरोध और मानवीय इच्छा की नैतिक दिशा का तनाव धुंधला पड़ता।
- issue: बुरी अभिलाषा का व्यक्तिकरण
  choice: स्त्रीलिंग एकवचन ‘वह’ और भय/भागने की क्रियाएँ बनाए रखीं
  alternative: इसे अमूर्त भाव में पुनर्लिखना
  rationale: मूल यूनानी में बुरी अभिलाषा को प्रतिद्वंद्वी की तरह व्यक्त किया गया है; युद्ध-रूपक की एकता के लिए इसे बनाए रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु साधारण पाठक के लिए स्पष्ट। ‘धार्मिकता’, ‘अभिलाषा’, ‘वास करता है’ जैसे परिचित धार्मिक पदों के साथ वाक्य-संरचना सरल रखी गई है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
