  text: 3. But all who are overmastered by them and do not resist them will die utterly; for these desires are deadly.
translation:
  language: hi
  text: 3. परन्तु जो लोग उनके वश में हो जाएँगे और उनका प्रतिरोध नहीं करेंगे, वे अंततः मर जाएँगे; क्योंकि ये अभिलाषाएँ प्राणघातक हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριευθῶσιν
  choice: वश में आ जाएँगे
  rationale: यह क्रिया किसी के द्वारा प्रभुत्व में कर लिए जाने का भाव रखती है; सहज हिन्दी में ‘वश में आना’ वही अर्थ स्पष्ट करता है।
- source_word: ἀντισταθῶσιν
  choice: सामना नहीं करेंगे
  rationale: मूल अर्थ विरोध में खड़े होने या प्रतिरोध करने का है; ‘सामना करना’ सामान्य पाठक के लिए स्वाभाविक और सक्रिय अभिव्यक्ति है।
- source_word: ἀποθανοῦνται εἰς τέλος
  choice: अन्ततः मर जाएँगे
  rationale: εἰς τέλος की तीव्रता और अंतिम परिणाम को बनाए रखता है, बिना यह तय किए कि यहाँ शारीरिक, आत्मिक या परम मृत्यु में से कौन-सा आशय है।
- source_word: θανατώδεις
  choice: प्राणघातक
  rationale: ऐसी अभिलाषाओं को दर्शाता है जो मृत्यु की ओर ले जाती हैं; हिन्दी में संक्षिप्त और प्रभावी समतुल्य।
- source_word: ἐπιθυμίαι
  choice: अभिलाषाएँ
  rationale: संदर्भ में बुरी इच्छाओं या लालसाओं की ओर संकेत है; ‘अभिलाषाएँ’ मूल की व्यापकता को बनाए रखता है और निकटवर्ती खंडों की अच्छी तथा बुरी इच्छा के विरोध के लिए उपयुक्त है।
theological_decisions:
- issue: ‘मर जाएँगे’ का स्वरूप
  choice: मृत्यु के प्रकार को अनिर्दिष्ट रखा गया
  alternative: ‘आत्मिक रूप से मर जाएँगे’ या ‘सदा के लिए नष्ट हो जाएँगे’
  rationale: यूनानी पाठ केवल ἀποθανοῦνται कहता है और यहाँ मृत्यु की प्रकृति स्पष्ट नहीं करता; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को जोड़ना उचित नहीं।
- issue: εἰς τέλος की व्याख्या
  choice: ‘अन्ततः’
  alternative: ‘पूरी तरह’ या ‘सदा के लिए’
  rationale: वाक्यांश अंतिम या पूर्ण परिणाम का बोध करा सकता है। ‘अन्ततः’ इस बल को व्यक्त करता है, पर शाश्वत दण्ड या पूर्ण विनाश को अनिवार्य रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली dignified किन्तु सरल रखी गई है। पूर्ववर्ती संदर्भ की ‘बुरी अभिलाषाएँ’ के लिए सर्वनाम ‘उनके’ सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं।
