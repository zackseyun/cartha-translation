base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/001.yaml
  text: He says, “I commanded you in the first commandment to keep faith and fear and self-control.” “Yes, lord,” I say. “But now,” he says, “I also want to make known to you their powers, so that you may understand what power and activity each of them has. For their activities are twofold; so they are set over the righteous and the unrighteous. So you—trust the righteous, but do not trust the unrighteous; for righteousness has a straight path, but unrighteousness a crooked one. But you, walk on the straight [and level] path, and leave the crooked.
translation:
  language: hi
  text: उसने कहा, “पहली आज्ञा में मैंने तुम्हें आदेश दिया था कि तुम विश्वास, भय और आत्म-संयम को बनाए रखो।” मैंने कहा, “हाँ, प्रभु।” उसने कहा, “पर अब मैं तुम्हें उनकी शक्तियाँ भी बताना चाहता हूँ, ताकि तुम समझ सको कि उनमें से हर एक की क्या शक्ति और कैसी क्रियाशीलता है। क्योंकि उनकी क्रियाशीलताएँ दो प्रकार की हैं; इसलिए वे धर्मी और अधर्मी के ऊपर नियुक्त हैं। अतः धर्मी पर भरोसा करो, पर अधर्मी पर भरोसा मत करो; क्योंकि धर्मी का मार्ग सीधा है, पर अधर्मी का मार्ग टेढ़ा है। लेकिन तुम सीधे [और समतल][a] मार्ग पर चलो और टेढ़े मार्ग को छोड़ दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठ-साक्ष्यों में “और समतल” शब्द नहीं मिलते।
    reason: यूनानी स्रोत में καὶ ὁμαλῇ को कोष्ठकों में दिया गया है, जो पाठगत अनिश्चितता दर्शाता है।
lexical_decisions:
- source_word: πίστιν
  choice: विश्वास
  rationale: यहाँ गुण के रूप में ‘विश्वास’ स्वाभाविक है और आगे πιστεύω (‘विश्वास करना’) के साथ मूल पाठ का शब्द-संबंध बनाए रखता है।
- source_word: φόβον
  choice: भय
  rationale: मूल का सामान्य और जानबूझकर अस्पष्ट अर्थ सुरक्षित रखा गया है; इसे व्याख्यात्मक रूप से ‘परमेश्वर का भय’ नहीं बनाया गया।
- source_word: ἐγκράτειαν
  choice: आत्म-संयम
  rationale: आधुनिक हिन्दी में स्पष्ट और सहज अभिव्यक्ति, जो इच्छाओं और आचरण पर नियंत्रण का भाव देती है।
- source_word: δυνάμεις / δύναμιν
  choice: सामर्थ्य
  rationale: दोनों प्रयोगों में एक ही शब्द रखकर मूल की पुनरावृत्ति और वैचारिक संबंध सुरक्षित रखा गया है।
- source_word: ἐνέργειαν / ἐνέργειαι
  choice: सक्रियता / सक्रियताएँ
  rationale: यह ‘कार्य’ से अधिक उस प्रभावी क्रियाशीलता को व्यक्त करता है जिसकी पहचान आगे उसके फल या कार्यों से होती है।
- source_word: τὸ δίκαιον / τὸ ἄδικον
  choice: जो धर्मी है / जो अधर्मी है
  rationale: यूनानी नपुंसकलिंगी विशेषणों की अस्पष्टता बनाए रखी गई है; पाठ इन्हें व्यक्ति, सिद्धांत या नैतिक पक्ष के रूप में पूरी तरह स्पष्ट नहीं करता।
- source_word: ὀρθὴν / στρεβλήν
  choice: सीधा / टेढ़ा
  rationale: मार्ग-रूपक की सरल, ठोस और स्वाभाविक हिन्दी अभिव्यक्ति।
theological_decisions:
- issue: ‘भय’ का आशय
  choice: सिर्फ ‘भय’
  alternative: ‘परमेश्वर का भय’ या ‘श्रद्धापूर्ण भय’
  rationale: इस वाक्य में यूनानी पाठ केवल φόβος कहता है; संबंध को स्पष्ट करना अनुवाद में अतिरिक्त व्याख्या जोड़ देता।
- issue: धर्मी और अधर्मी की पहचान
  choice: ‘जो धर्मी है’ और ‘जो अधर्मी है’
  alternative: ‘धार्मिकता’ और ‘अधार्मिकता’, अथवा ‘धर्मी व्यक्ति’ और ‘अधर्मी व्यक्ति’
  rationale: मूल व्याकरण नैतिक वस्तु/पक्ष और व्यक्तिकृत सत्ता के बीच कुछ अस्पष्टता रखता है; चयन उसे यथासंभव खुला रखता है।
- issue: κύριε का संबोधन
  choice: ‘प्रभु’
  alternative: ‘स्वामी’ या ‘महोदय’
  rationale: प्राचीन धार्मिक संवाद के गरिमापूर्ण संबोधन को बनाए रखता है, बिना संबोधित व्यक्ति को परमेश्वर के रूप में निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। संवाद के बार-बार आने वाले ‘उसने कहा/मैंने कहा’ को मूल की संरचना के निकट रखा गया है। ‘बनाए रखो’ से φυλάξῃς का संरक्षण/पालन भाव व्यक्त किया गया है।
