  text: 'So when you recognize his works, withdraw from him and put no trust in him, because his works are wicked and harmful to God’s servants. You therefore have the activities of both angels; understand them, and trust the angel of righteousness. But withdraw from the angel of wickedness, because his teaching is wicked in every deed. For if someone is a faithful man, and the thought of this angel rises up in his heart, that man or woman must commit some sin. But if again some man or woman is very wicked, and the works of the angel of righteousness rise up in his or her heart, that person must of necessity do something good. You see then,” he says, “that it is good to follow the angel of righteousness, and to renounce the angel of wickedness. As to faith, this commandment makes it clear: that you should trust the works of the angel of righteousness, and, having done them, live to God. But believe that the works of the angel of wickedness are grievous; so by not doing them, you will live
    to God.”'
translation:
  language: hi
  text: 'इसलिए उसके कामों को पहचानकर उससे दूर हो जाओ और उस पर तनिक भी भरोसा न करो, क्योंकि उसके काम बुरे हैं और परमेश्वर के सेवकों के लिए हानिकारक हैं। तुम्हारे सामने दोनों दूतों की गतिविधियाँ हैं; उन्हें समझो और धार्मिकता के दूत पर भरोसा रखो। पर दुष्टता के दूत से दूर रहो, क्योंकि उसकी शिक्षा हर काम के लिए दुष्ट है। यदि कोई पुरुष विश्वासयोग्य हो, और इस दूत का विचार उसके हृदय में उठे, तो वह पुरुष या स्त्री कोई न कोई पाप कर बैठेगा। दूसरी ओर, यदि कोई पुरुष या स्त्री अत्यंत दुष्ट हो, और धार्मिकता के दूत के काम उसके हृदय में उठें, तो वह निश्चय ही कोई भला काम करेगा।


    वह कहता है, “तो तुम देखते हो कि धार्मिकता के दूत के पीछे चलना और दुष्टता के दूत को त्याग देना अच्छा है। विश्वास के विषय में यह आज्ञा यह स्पष्ट करती है: धार्मिकता के दूत के कामों पर भरोसा रखो और उन्हें करके परमेश्वर के लिए जीवित रहो। पर यह मानो कि दुष्टता के दूत के काम कठिन हैं; इसलिए उन्हें न करके परमेश्वर के लिए जीवित रहो।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: कार्य करने के ढंग
  rationale: यहाँ शब्द केवल अलग-अलग ‘कामों’ को नहीं, दोनों दूतों की सक्रियता और प्रभाव के पहचाने जाने योग्य ढंग को सूचित करता है।
- source_word: πίστευε / πιστεύσῃς
  choice: भरोसा रखो
  rationale: दत्तिव के साथ क्रिया का भाव किसी कथन को मात्र सत्य मानना नहीं, बल्कि संबंधित दूत और उसके कामों पर भरोसा करना है।
- source_word: ἄγγελος τῆς δικαιοσύνης
  choice: धार्मिकता का दूत
  rationale: संबंधवाचक यूनानी पदबंध को सीधा और धार्मिक रूप से तटस्थ रखा गया है।
- source_word: ἄγγελος τῆς πονηρίας
  choice: दुष्टता का दूत
  rationale: πονηρία को व्यक्तिगत ‘दुष्ट’ की बजाय नैतिक बुराई/दुष्टता के रूप में व्यक्त किया गया है।
- source_word: ἀποτάξασθαι
  choice: त्याग देना
  rationale: इसमें केवल दूरी बनाने से अधिक, संबंध और निष्ठा छोड़ देने का भाव है।
- source_word: χαλεπά
  choice: अनिष्टकारी
  rationale: संदर्भ में इसका अर्थ केवल ‘कठिन’ नहीं, बल्कि हानिकर और संकटकारी नैतिक परिणाम वाला है।
- source_word: ζήσῃ τῷ Θεῷ
  choice: परमेश्वर के लिए जीवित रहो
  rationale: दत्तिव की संक्षिप्त धार्मिक अभिव्यक्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
theological_decisions:
- issue: दूत के विचार के उठने पर पाप या भला काम करने की अनिवार्यता
  choice: ‘कोई न कोई पाप कर बैठेगा’ और ‘निश्चय ही कोई भला काम करेगा’
  alternative: ‘उसे अवश्य पाप/भला काम करना ही पड़ेगा’
  rationale: मूल के δεῖ और ἐξ ἀνάγκης की प्रबल अनिवार्यता बनाए रखी गई है, पर ऐसा शब्दांकन नहीं चुना गया जो व्यक्ति की नैतिक जवाबदेही के विषय में मूल से आगे बढ़कर कोई व्यवस्थित सिद्धांत स्थापित करे।
- issue: धार्मिकता और दुष्टता के दूतों की प्रकृति
  choice: उन्हें पाठ की तरह ‘दूत’ ही कहा गया है
  alternative: उन्हें अंतःकरण, प्रवृत्ति या आत्मिक शक्तियों के रूप में व्याख्यायित करना
  rationale: मूल पाठ उन्हें ἄγγελος कहता है; उनकी सत्ता या मनोवैज्ञानिक अर्थ के प्रश्न को अनावश्यक रूप से हल नहीं किया गया।
- issue: विश्वास का आशय
  choice: धार्मिकता के दूत के कामों पर भरोसा और उनके अनुसार आचरण
  alternative: किसी बाद की मत-पद्धति के अनुसार ‘विश्वास’ को परिभाषित करना
  rationale: अनुच्छेद स्वयं विश्वास को कामों की पहचान, उन पर भरोसा और उन्हें करने से जोड़ता है; उसी आंतरिक तर्क को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘धार्मिकता’, ‘दुष्टता’, ‘विश्वासयोग्य’ और ‘परमेश्वर के लिए जीवित रहो’ जैसे पद मूल की नैतिक-धार्मिक शब्दावली को सुरक्षित रखते हैं। लिंग-संदर्भ में मूल के ‘पुरुष या स्त्री’ को स्पष्ट रखा गया है।
