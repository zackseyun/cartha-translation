base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/002.yaml
  text: For the crooked path has no tracks, but pathless places and many stumbling blocks; and it is rough and thorny. Therefore it is harmful. But hear also the works of the other way. First of all, if there should come upon you a quick temper or bitterness, know that he is in you. Then come desire for many activities, and extravagance in many foods and drinks, and many drunken sprees, and various luxuries, and things that are not fitting; and desire for women, and greed, and arrogance, and boastfulness, and whatever things are akin and similar to these. Therefore, whenever these things rise up in your heart, know that the angel of wickedness is with you.
translation:
  language: hi
  text: क्योंकि टेढ़े मार्ग पर कोई पगडंडी नहीं होती, बल्कि बेरास्ते स्थान और बहुत-सी ठोकरें होती हैं; वह ऊबड़-खाबड़ और काँटों से भरा होता है। इसलिए वह हानिकारक है। अब दूसरे मार्ग के काम भी सुनो। सबसे पहले, यदि तुम पर अचानक क्रोध या कड़वाहट आ पड़े, तो जान लो कि वह तुम्हारे भीतर है। फिर बहुत-से कामों की लालसा, बहुत-से खाने-पीने की विलासिता, बार-बार नशा और उच्छृंखल मद्य-मौज, तरह-तरह के भोग-विलास और अनुचित बातें, स्त्रियों के प्रति वासना, लोभ, घमंड, डींग मारना, और इनसे मिलती-जुलती सभी बातें आती हैं। इसलिए, जब भी ये बातें तुम्हारे हृदय में उठें, तो जान लो कि दुष्टता का दूत तुम्हारे साथ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ στρεβλὴ ὁδός
  choice: टेढ़ा मार्ग
  rationale: नैतिक रूपक को बनाए रखते हुए στρεβλός के ‘टेढ़े/विकृत’ अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τρίβους
  choice: बनी हुई पगडंडी
  rationale: शब्द का अर्थ चलने से बना या पहचाना हुआ रास्ता है; आगे के ἀνοδίας के साथ इसका विरोध स्पष्ट रहता है।
- source_word: ἀνοδίας
  choice: रास्ताविहीन जगहें
  rationale: शाब्दिक रूप से जहाँ कोई मार्ग नहीं है; स्वाभाविक हिन्दी में अर्थ स्पष्ट किया गया है।
- source_word: προσκόμματα
  choice: ठोकर के कारण
  rationale: मार्ग के वास्तविक अवरोध और नैतिक ठोकर, दोनों अर्थों की गुंजाइश बनाए रखता है।
- source_word: ἐνέργειαι / ἔργα
  choice: काम
  rationale: इस प्रसंग में किसी मार्ग या दूत से उत्पन्न व्यवहार और प्रभाव का संकेत देता है; साधारण पाठक के लिए सहज है।
- source_word: ἡ πικρία
  choice: कड़वाहट
  rationale: आंतरिक कटुता या द्वेष के भाव को सीधे व्यक्त करता है।
- source_word: πολυτέλεια
  choice: फिजूलखर्ची
  rationale: खाने-पीने पर अत्यधिक और विलासी व्यय के भाव को प्रसंगानुकूल व्यक्त करता है।
- source_word: μεθυσμάτων καὶ κραιπαλῶν
  choice: बार-बार मदहोश होना
  rationale: नशे और उससे जुड़ी उच्छृंखल मौज-मस्ती के युग्म को संक्षिप्त, स्वाभाविक हिन्दी में देता है।
- source_word: ἐπιθυμία γυναικῶν
  choice: स्त्रियों की वासना
  rationale: स्त्रियों के प्रति कामुक लालसा का स्पष्ट अर्थ देता है, बिना इसे सामान्य आकर्षण या विवाह की इच्छा बनाकर नरम किए।
- source_word: ὁ ἄγγελος τῆς πονηρίας
  choice: दुष्टता का दूत
  rationale: ‘angel/messenger of wickedness’ की संरचना और नैतिक व्यक्तिकरण दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ‘वह तुम्हारे भीतर है’ में सर्वनाम का संदर्भ
  choice: अस्पष्ट सर्वनाम ‘वह’ को बनाए रखा
  alternative: ‘दुष्टता का दूत तुम्हारे भीतर है’ लिखकर संदर्भ स्पष्ट करना
  rationale: प्राप्त पाठ और परामर्श-पाठ में सर्वनाम है; अगले वाक्य में दुष्टता के दूत की स्पष्ट पहचान आती है। मूल की शैलीगत प्रगति को समय से पहले नहीं खोला गया।
- issue: दो मार्गों और दूत के कामों का संबंध
  choice: ‘दूसरे मार्ग के काम’ रखा
  alternative: ‘दुष्टता के दूत के काम’
  rationale: इस बिंदु पर वक्ता मार्ग-रूपक से दूत की पहचान की ओर बढ़ता है। अनुवाद उस क्रम और संभावित तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मार्ग-रूपक को ठोस शब्दावली—पगडंडी, रास्ताविहीन जगहें, ठोकर, ऊबड़-खाबड़, काँटे—से बनाए रखा गया है। स्रोत के उपलब्ध OCR में इस खंड के बीच कुछ पाठ लुप्त/विकृत है; दिए गए यूनानी संदर्भ, वाक्य-प्रवाह और परीक्षित अंग्रेज़ी परामर्श-पाठ के सहारे लक्षित पाठ प्रस्तुत किया गया है।
