  terminology: ‘पवित्र आत्मा,’ ‘उद्धार,’ ‘पश्चात्ताप,’ ‘दुविधा,’ और ‘देह’ उपयुक्त हैं। ‘उदासी’ λύπη के लिए स्वीकार्य है, यद्यपि यह व्यापक दुःख/मनस्ताप को संदर्भानुसार व्यक्त करती है। ‘क्रोधी स्वभाव’ की जगह ‘जल्दी क्रोध’ अधिक स्वाभाविक है और आगे दोनों प्रसंगों में संगत रखा गया है।
