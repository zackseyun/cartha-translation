base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/038/001.yaml
  text: '“Listen, then,” he says, “foolish one, how sorrow wears down the Holy Spirit and then again saves. Whenever the double‑minded person undertakes some action and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered, again sorrow enters into the heart of the person who became quick‑tempered, and he is grieved over the deed that he did and repents, because he did what is evil. This sorrow, then, seems to bring salvation, because after doing what is evil he repented. Therefore both things grieve the Spirit: double‑mindedness, because it did not attain its purpose; and quick temper grieves the Spirit, because it did what is evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you,
    lest it appeal to God and depart from you. For the Spirit of God that was given to this flesh does not endure sorrow or distress.”'
translation:
  language: hi
  text: '“तो सुन, हे नासमझ,” वह कहता है, “उदासी किस प्रकार पवित्र आत्मा को क्षीण करती है और फिर बचाती है। जब कोई दुविधाग्रस्त व्यक्ति कोई काम करने का बीड़ा उठाता है और अपनी दुविधा के कारण उसमें असफल हो जाता है, तो यह उदासी उस व्यक्ति के भीतर प्रवेश करती है, पवित्र आत्मा को दुःखी करती है और उसे क्षीण कर देती है। फिर, जब किसी बात पर किसी व्यक्ति को जल्दी क्रोध आ जाए और वह बहुत कड़वाहट से भर जाए, तो उदासी फिर उस क्रोधित व्यक्ति के हृदय में प्रवेश करती है। वह अपने किए हुए काम पर दुःखी होता है और पश्चात्ताप करता है, क्योंकि उसने बुराई की। इसलिए यह उदासी उद्धार लाती हुई प्रतीत होती है, क्योंकि बुराई करने के बाद उसने पश्चात्ताप किया। अतः दोनों ही बातें आत्मा को दुःखी करती हैं: दुविधा इसलिए कि वह अपने काम में सफल नहीं हुई, और जल्दी क्रोध इसलिए कि उसने बुराई की। इस प्रकार दुविधा और जल्दी क्रोध—दोनों पवित्र आत्मा के लिए दुःखद हैं। इसलिए अपने भीतर से उदासी को निकाल दे और अपने भीतर वास करने वाले पवित्र आत्मा को दुःखी न कर, कहीं ऐसा न हो कि वह परमेश्वर से विनती करे और तुझसे चला जाए। क्योंकि परमेश्वर
    का आत्मा, जो इस देह को दिया गया है, उदासी या घुटन सहन नहीं करता।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπη
  choice: उदासी
  rationale: यहाँ शब्द निरंतर भीतर रहने वाले दुःख/मनोव्यथा को दर्शाता है; ‘उदासी’ सामान्य पाठक के लिए स्वाभाविक है और पश्चात्तापजनित दुःख तथा हानिकारक विषाद—दोनों संदर्भों को खुला रखता है।
- source_word: ἐκτρίβει
  choice: क्षीण करती है
  rationale: मूल अर्थ घिस डालने या थका देने का है। ‘क्षीण करना’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे सीधे ‘निकाल देना’ मान लेने के।
- source_word: δίψυχος / διψυχία
  choice: दुविधाग्रस्त / दुविधा
  rationale: शाब्दिक अर्थ ‘दो मन वाला’ है; संदर्भ में अनिर्णय और आंतरिक विभाजन के कारण असफलता है। ‘दुविधा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ὀξυχολία
  choice: क्रोधी स्वभाव
  rationale: यह केवल एक क्षण के क्रोध से अधिक, शीघ्र भड़कने वाली चिड़चिड़ी प्रवृत्ति को सूचित करता है; ‘क्रोधी स्वभाव’ उस स्थायी झुकाव को व्यक्त करता है।
- source_word: στενοχωρίαν
  choice: घुटन
  rationale: शब्द का भाव संकुचन, दबाव और मानसिक व्याकुलता है; ‘घुटन’ आधुनिक और सहज हिन्दी में इस अनुभव को व्यक्त करती है।
- source_word: ἐντεύξηται τῷ θεῷ
  choice: परमेश्वर से तेरे विरुद्ध विनती करे
  rationale: क्रिया परमेश्वर के सामने निवेदन/अपील करने का संकेत देती है। प्रसंग चेतावनी का है, इसलिए ‘तेरे विरुद्ध’ आशय स्पष्ट करता है, यद्यपि यह पद मूल में स्वतंत्र शब्द के रूप में नहीं है।
theological_decisions:
- issue: उदासी के विनाशकारी और उद्धारकारी दोनों प्रभाव
  choice: ‘क्षीण करती है’ और ‘बचाती भी है’ दोनों को साथ रखा गया
  alternative: सारी उदासी को केवल पापपूर्ण या केवल पश्चात्तापकारी दुःख मानना
  rationale: 'मूल पाठ जानबूझकर तनाव बनाए रखता है: असफलता से उपजा विषाद आत्मा को दुःखी करता है, जबकि बुराई पर हुआ दुःख पश्चात्ताप की ओर ले जाकर उद्धारकारी प्रतीत होता है।'
- issue: पवित्र आत्मा के चले जाने की चेतावनी
  choice: ‘कहीं ऐसा न हो ... तुझसे चला जाए’ के रूप में वास्तविक चेतावनी बनाए रखी
  alternative: इसे केवल संगति की अनुभूति खोने या अलंकारिक भाषा तक सीमित करना
  rationale: मूल ἀποστῇ ἀπὸ σου स्पष्टतः अलग होने/चले जाने की भाषा है; पाठ की धर्मवैज्ञानिक तीक्ष्णता को किसी बाद की सिद्धान्त-व्यवस्था से नरम नहीं किया गया।
- issue: ‘यह उदासी उद्धार लाती हुई प्रतीत होती है’
  choice: ‘प्रतीत होती है’ सुरक्षित रखा गया
  alternative: ‘यह उदासी उद्धार लाती है’ जैसा निश्चित कथन
  rationale: δοκεῖ की अनिश्चित/मूल्यांकनात्मक छाया को बनाए रखना आवश्यक है।
- issue: आत्मा के लिए नपुंसकलिंग सर्वनाम
  choice: हिन्दी में सम्मानसूचक/व्यक्तिवाचक ‘वह’ और प्रसंगानुसार ‘उसे’
  alternative: निर्जीव ‘यह/इसे’
  rationale: यूनानी व्याकरणिक नपुंसकलिंग को हिन्दी में यांत्रिक रूप से उतारना अप्राकृतिक और अर्थभ्रमकारी होता; पाठ आत्मा को क्रिया और निवेदन करने वाला प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध। सम्बोधन और आज्ञाओं में एकवचन ‘तू/तेरे’ का रूप मूल के एकवचन प्रत्यक्ष सम्बोधन को दर्शाता है; शैली अपमानजनक न लगे, इसलिए ‘हे नासमझ’ चुना गया। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
