  revised_text: '“तो सुन, हे नासमझ,” वह कहता है, “उदासी किस प्रकार पवित्र आत्मा को क्षीण करती है और फिर बचाती है। जब कोई दुविधाग्रस्त व्यक्ति कोई काम करने का बीड़ा उठाता है और अपनी दुविधा के कारण उसमें असफल हो जाता है, तो यह उदासी उस व्यक्ति के भीतर प्रवेश करती है, पवित्र आत्मा को दुःखी करती है और उसे क्षीण कर देती है। फिर, जब किसी बात पर किसी व्यक्ति को जल्दी क्रोध आ जाए और वह बहुत कड़वाहट से भर जाए, तो उदासी फिर उस क्रोधित व्यक्ति के हृदय में प्रवेश करती है। वह अपने किए हुए काम पर दुःखी होता है और पश्चात्ताप करता है, क्योंकि उसने बुराई की। इसलिए यह उदासी उद्धार लाती हुई प्रतीत होती है, क्योंकि बुराई करने के बाद उसने पश्चात्ताप किया। अतः दोनों ही बातें आत्मा को दुःखी करती हैं: दुविधा इसलिए कि वह अपने काम में सफल नहीं हुई, और जल्दी क्रोध इसलिए कि उसने बुराई की। इस प्रकार दुविधा और जल्दी क्रोध—दोनों पवित्र आत्मा के लिए दुःखद हैं। इसलिए अपने भीतर से उदासी को निकाल दे और अपने भीतर वास करने वाले पवित्र आत्मा को दुःखी न कर, कहीं ऐसा न हो कि वह परमेश्वर से विनती करे और तुझसे चला जाए। क्योंकि परमेश्वर
    का आत्मा, जो इस देह को दिया गया है, उदासी या घुटन सहन नहीं करता।”'
