  text: But in the second vision you saw her standing, with a countenance younger and more cheerful than before, though her flesh and her hair were older. “Listen,” she says, “to this parable also.
translation:
  language: hi
  text: पर दूसरे दर्शन में तुमने उसे खड़ी देखा था। उसका चेहरा पहले से अधिक युवा और अधिक प्रसन्न था, यद्यपि उसका शरीर और उसके बाल अधिक वृद्ध थे। वह कहती है, “यह दृष्टांत भी सुनो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψιν
  choice: मुख
  rationale: यहाँ शब्द स्त्री के चेहरे के दिखाई देने वाले रूप और भाव को दर्शाता है; ‘मुख’ सहज और गरिमापूर्ण है।
- source_word: νεωτέραν
  choice: अधिक युवा
  rationale: तुलनात्मक अर्थ को स्पष्ट रखता है और चेहरे की अपेक्षाकृत युवा दिखावट बताता है।
- source_word: ἱλαρωτέραν
  choice: अधिक प्रसन्न
  rationale: चेहरे के हर्षपूर्ण, प्रफुल्ल भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σάρκα
  choice: शरीर
  rationale: शाब्दिक ‘मांस’ इस संदर्भ में अस्वाभाविक होगा; यहाँ बाहरी देह या शारीरिक रूप अभिप्रेत है।
- source_word: πρεσβυτέρας
  choice: अधिक वृद्ध दिखाई देते थे
  rationale: शरीर और बाल के वृद्ध रूप का तुलनात्मक भाव बनाए रखता है, बिना यह संकेत दिए कि वे कालक्रम में सचमुच अधिक पुराने हो गए थे।
- source_word: παραβολήν
  choice: दृष्टांत
  rationale: उदाहरणात्मक कथा के लिए प्रचलित और उपयुक्त धार्मिक-साहित्यिक शब्द।
theological_decisions:
- issue: स्त्री के युवा मुख और वृद्ध शरीर/बाल के बीच तनाव
  choice: दोनों वर्णनों को बिना सामंजस्य बैठाए साथ रखा गया
  alternative: पूरे रूप को युवा या वृद्ध बताकर विरोध को हल करना
  rationale: यूनानी पाठ जानबूझकर मुख की युवावस्था और शरीर तथा बालों की वृद्धावस्था में भेद करता है; भावी व्याख्या के लिए यह तनाव सुरक्षित रहना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में मूल के एकवचन ‘तुम’ को रखा गया है। शैली सरल, गरिमापूर्ण और साधारण पाठक के लिए सुबोध है।
