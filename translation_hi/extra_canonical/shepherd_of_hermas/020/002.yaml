base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/002.yaml
  text: “When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life; then, all at once, an inheritance is left to him. On hearing of it he is stirred up, and, becoming overjoyed, he puts on strength; he no longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed; and he no longer sits, but takes courage. So also you, when you heard the revelation that the Lord revealed to you.
translation:
  language: hi
  text: जब कोई बूढ़ा व्यक्ति अपनी दुर्बलता और गरीबी के कारण अपने लिए पहले ही आशा छोड़ चुका होता है, तो वह अपने जीवन के अंतिम दिन के सिवा और किसी बात की अपेक्षा नहीं करता। फिर अचानक उसके लिए कोई विरासत छोड़ दी जाती है। उसके विषय में सुनकर वह जाग उठता है और बहुत आनन्दित होकर सामर्थ्य धारण कर लेता है। वह अब लेटा नहीं रहता, बल्कि खड़ा होता है; और उसकी आत्मा, जो उसके पहले के कामों के कारण पहले ही क्षीण हो चुकी थी, नई हो जाती है। वह अब बैठा नहीं रहता, बल्कि साहस बाँधता है। इसी प्रकार तुम भी, जब तुमने वह प्रकटीकरण सुना जिसे प्रभु ने तुम्हें प्रकट किया—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτερός
  choice: बूढ़ा व्यक्ति
  rationale: यहाँ तुलना किसी पदाधिकारी से नहीं, आयु में वृद्ध मनुष्य से है; इसलिए सामान्य आयु-सूचक अनुवाद चुना गया।
- source_word: ἀφηλπικὼς ἑαυτόν
  choice: अपने लिए पहले ही आशा छोड़ चुका
  rationale: यूनानी पूर्ण कृदन्त निराशा की पहले से स्थापित दशा बताता है; इसे स्वाभाविक हिन्दी में स्पष्ट रखा गया।
- source_word: πτωχότητα
  choice: गरीबी
  rationale: साधारण आर्थिक अभाव का सीधा और आधुनिक हिन्दी रूप।
- source_word: κληρονομία
  choice: विरासत
  rationale: छोड़ी गई पैतृक या उत्तराधिकार-संपत्ति के अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ἐξηγέρθη
  choice: उठ खड़ा होता है
  rationale: शाब्दिक रूप से जागने/उठाए जाने का भाव है, पर प्रसंग में निराश निष्क्रियता से सक्रिय होने की शारीरिक छवि प्रमुख है।
- source_word: ἐνεδύσατο τὴν ἰσχύν
  choice: सामर्थ्य धारण कर लेता है
  rationale: ‘सामर्थ्य पहनने’ की मूल रूपकात्मक भाषा को हिन्दी में गरिमापूर्ण और समझने योग्य ढंग से सुरक्षित रखा गया।
- source_word: τὸ πνεῦμα
  choice: मन
  rationale: यहाँ व्यक्ति की भीतरी जीवनी-शक्ति/मनोदशा का संकेत है; ‘आत्मा’ भी संभव है, पर हिन्दी में इस संदर्भ में अनचाहा तत्त्वमीमांसक अर्थ ला सकता है।
- source_word: ἀνδρίζεται
  choice: साहस बाँधता है
  rationale: क्रिया का अर्थ साहसी या दृढ़ होना है; लिंग-विशिष्ट शाब्दिकता के बजाय स्वाभाविक मुहावरा चुना गया।
- source_word: ἀποκάλυψιν
  choice: प्रकाशन
  rationale: ईश्वर द्वारा प्रकट की गई बात के धार्मिक और साहित्यिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: τὸ πνεῦμα का अर्थ
  choice: मन
  alternative: आत्मा
  rationale: प्रसंग वृद्ध व्यक्ति की निराश, क्षीण भीतरी दशा के पुनर्जीवित होने का है। ‘मन’ इस मानवीय अनुभव को स्वाभाविक बनाता है, जबकि ‘आत्मा’ मूल की एक वास्तविक वैकल्पिक व्याख्या बनी रहती है।
- issue: ἀπεκάλυψεν की दिशा
  choice: तुम पर प्रकट किया है
  alternative: तुम्हें प्रकट किया है
  rationale: यूनानी में अप्रत्यक्ष कर्म ὑμῖν है; हिन्दी में दोनों संभव हैं। ‘तुम पर प्रकट किया’ प्रकाशन के प्राप्तकर्ताओं पर दैवी अनावरण का भाव देता है और मूल की पुनरुक्ति को बनाए रखता है।
- issue: पूर्व कर्मों से भीतरी दशा का बिगड़ना
  choice: उसका मन ... उसके पिछले कामों के कारण ... बिगड़ चुका था
  alternative: उसकी आत्मा ... उसके पहले के आचरण से भ्रष्ट हो चुकी थी
  rationale: नैतिक कारण-संबंध को यथावत रखा गया, पर ‘भ्रष्ट’ की अपेक्षा ‘बिगड़ चुका’ सामान्य पाठक के लिए कम तकनीकी है और मूल के φθείρω की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी की क्रमिक शारीरिक छवियाँ—लेटना, खड़ा होना, बैठना और साहस बाँधना—सुरक्षित रखी गई हैं। पाठ केवल निर्दिष्ट reader segment 2 का अनुवाद करता है; इसलिए अगले यूनानी पद का वाक्यगत विस्तार इसमें सम्मिलित नहीं किया गया।
