base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/003.yaml
  text: “For he had compassion on you and renewed your spirits, and you put away your softness; strength came to you and you were strengthened in faith; and when the Lord saw your strengthening, he rejoiced. For this reason he made known to you the building of the tower, and he will make other things known, if, with a whole heart, you are at peace among yourselves.”
translation:
  language: hi
  text: क्योंकि उसने तुम पर दया की और तुम्हारी आत्माओं को नवीकृत किया। तुमने अपनी दुर्बलताओं को त्याग दिया, तुममें सामर्थ्य आया, और तुम विश्वास में दृढ़ किए गए। जब प्रभु ने तुम्हें दृढ़ होते देखा, तो वह आनन्दित हुआ। इसी कारण उसने तुम्हें मीनार के निर्माण के विषय में बताया; और यदि तुम पूरे मन से आपस में शान्ति से रहोगे, तो वह तुम्हें और बातें भी बताएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσπλαγχνίσθη ἐφ’ ὑμᾶς
  choice: उसने तुम पर दया की
  rationale: यह करुणा से भीतर तक द्रवित होने का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἀνενεώσατο τὰ πνεύματα ὑμῶν
  choice: तुम्हारी आत्माओं को नया कर दिया
  rationale: बहुवचन πνεύματα को बनाए रखता है और पूर्ववर्ती उपमा में व्यक्ति की नवीकृत आन्तरिक दशा से संबंध स्पष्ट करता है।
- source_word: ἀπέθεσθε τὰς μαλακίας ὑμῶν
  choice: तुमने अपनी निर्बलता त्याग दी
  rationale: μαλακία यहाँ शारीरिक कोमलता नहीं, उत्साहहीन दुर्बलता या ढीलापन सूचित करती है; ‘निर्बलता’ प्रसंग में सहज है, जबकि क्रिया का मध्य रूप कर्ताओं की सक्रिय प्रतिक्रिया बनाए रखता है।
- source_word: προσῆλθεν ὑμῖν ἰσχυρότης
  choice: तुममें सामर्थ्य आया
  rationale: शाब्दिक गति-भाव को सहज हिन्दी में रखता है और अगले खंड की ‘दृढ़’ भाषा से अनावश्यक पूर्ण पुनरुक्ति टालता है।
- source_word: ἐδυναμώθητε ἐν τῇ πίστει
  choice: तुम विश्वास में दृढ़ हो गए
  rationale: विश्वास के क्षेत्र में सामर्थ्य प्राप्त करने का स्वाभाविक हिन्दी रूप।
- source_word: τὴν οἰκοδομὴν τοῦ πύργου
  choice: मीनार का निर्माण
  rationale: οἰκοδομή को प्रक्रिया/कार्य के रूप में खुला रखता है और दर्शन में मीनार के बनते जाने के चित्र से मेल खाता है।
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  choice: आपस में शान्ति बनाए रखोगे
  rationale: ἐν ἑαυτοῖς का सामुदायिक, परस्पर अर्थ प्रसंगानुकूल है; वर्तमान क्रिया की निरन्तरता ‘बनाए रखोगे’ से व्यक्त होती है।
theological_decisions:
- issue: आत्मा/आत्माओं का अर्थ
  choice: ‘तुम्हारी आत्माओं’ के बहुवचन को सुरक्षित रखा
  alternative: ‘तुम्हारे मन’ या सामूहिक ‘तुम्हारी आत्मा’
  rationale: यूनानी τὰ πνεύματα ὑμῶν स्पष्टतः बहुवचन है; इसे मनोवैज्ञानिक या सामूहिक एकवचन में सीमित करना उचित नहीं।
- issue: प्रकाशन की शर्त
  choice: ‘यदि तुम...शान्ति बनाए रखोगे’
  alternative: शर्त को आश्वासन या कारण के रूप में प्रस्तुत करना
  rationale: ἐάν के वास्तविक शर्तार्थ और सामुदायिक शान्ति पर दिए गए नैतिक बल को बनाए रखा गया है।
- issue: दृढ़ीकरण में दैवी और मानवीय भूमिका
  choice: परमेश्वर द्वारा नवीनीकरण और समुदाय द्वारा निर्बलता त्यागने—दोनों को अलग रखा
  alternative: सभी क्रियाओं को केवल दैवी या केवल मानवीय कार्य बनाना
  rationale: मूल पाठ क्रमशः दैवी करुणा/नवीनीकरण और श्रोताओं के त्याग का उल्लेख करता है; अनुवाद इस तनाव को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन बहुवचन ‘तुम’ रखा गया है। ‘मीनार’ दृश्यात्मक संदर्भ के लिए स्वाभाविक है; ‘प्रकट किया’ प्रकाशन-संबंधी क्रिया δηλόω की औपचारिकता बनाए रखता है।
