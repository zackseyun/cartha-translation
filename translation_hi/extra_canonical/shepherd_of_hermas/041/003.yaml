base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/003.yaml
  text: 3. “What deeds of evil desire,” I say, “hand people over to death, sir? Make them known to me, so that I may keep away from them.” “Listen,” [he says,] “by what deeds evil desire puts the servants of God to death.”
translation:
  language: hi
  text: 3. मैंने कहा, “स्वामी, बुरी अभिलाषा के वे कौन-से काम हैं जो मनुष्यों को मृत्यु के हवाले कर देते हैं? मुझे बता दीजिए, ताकि मैं उनसे दूर रहूँ।” “सुनो, [उसने कहा,] किन कामों के द्वारा बुरी अभिलाषा परमेश्वर के सेवकों को मृत्यु के घाट उतारती है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: बुरी अभिलाषा
  rationale: ἐπιθυμία किसी प्रबल इच्छा या लालसा को दर्शाता है; ‘अभिलाषा’ यहाँ नैतिक संदर्भ में स्वाभाविक और पर्याप्त व्यापक है, जबकि ‘बुरी’ πονηρά का स्पष्ट मूल्यांकन बनाए रखता है।
- source_word: ἔργα
  choice: काम
  rationale: यहाँ आशय उस अभिलाषा की क्रियाओं अथवा परिणामकारी व्यवहारों से है; साधारण पाठक के लिए ‘काम’ सहज है और ‘कर्म’ की संभावित धार्मिक-तकनीकी छाया से बचता है।
- source_word: παραδιδόντα ... εἰς θάνατον
  choice: मृत्यु के हवाले कर देते हैं
  rationale: παραδίδωμι की ‘सौंप देना/हवाले करना’ वाली छवि को बनाए रखता है और εἰς θάνατον को स्पष्ट करता है।
- source_word: ἀφέξομαι ἀπ’ αὐτῶν
  choice: मैं उनसे दूर रहूँ
  rationale: ἀπέχομαι का आशय स्वयं को उनसे अलग रखना या उनसे बचना है; ‘दूर रहूँ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: θανατοῖ
  choice: मृत्यु के घाट उतारती है
  rationale: क्रिया का सीधा अर्थ ‘मार डालती है’ है; यह चयन उसके घातक प्रभाव को सजीव और स्पष्ट रूप से व्यक्त करता है।
- source_word: κύριε
  choice: स्वामी
  rationale: संबोधन यहाँ वक्ता के मार्गदर्शक के प्रति आदर प्रकट करता है; ‘स्वामी’ κύριε को बनाए रखता है, बिना इसे अनिवार्यतः ईश्वरीय संबोधन मानने के।
theological_decisions:
- issue: ‘मृत्यु’ का स्वरूप
  choice: मृत्यु
  alternative: आत्मिक मृत्यु / अनन्त मृत्यु
  rationale: यूनानी पाठ केवल θάνατος/θανατόω कहता है और मृत्यु के प्रकार को स्पष्ट नहीं करता; इसलिए संभावित आत्मिक या अंतिम न्याय-संबंधी अर्थ को अनुवाद में निश्चित नहीं किया गया।
- issue: बुरी अभिलाषा को कर्ता के रूप में प्रस्तुत करना
  choice: बुरी अभिलाषा ... मृत्यु के घाट उतारती है
  alternative: बुरी अभिलाषा के कारण ... मर जाते हैं
  rationale: मूल पाठ अभिलाषा का मानवीकरण करके उसी को सक्रिय कर्ता बनाता है; इस नैतिक और आलंकारिक तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद का सीधापन तथा मूल यूनानी की मृत्यु-संबंधी तीव्रता संरक्षित है। कोष्ठकयुक्त [φησίν] पाठ की संपादकीय अनिश्चितता हिन्दी में अलग चिह्नित नहीं की गई, क्योंकि ‘उसने कहा’ संवाद की पहचान के लिए आवश्यक और संदर्भ से स्पष्ट है।
