base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/002.yaml
  text: '2. “For evil desire is wild and is hard to tame; for it is fearsome, and by its savagery it greatly consumes people—especially if a servant of God falls into it and is not sensible, he is grievously consumed by it. It consumes such people: those who do not have the garment of good desire, but are entangled with this age. These, therefore, it hands over to death.”'
translation:
  language: hi
  text: 2. “क्योंकि बुरी अभिलाषा जंगली है और बड़ी कठिनाई से वश में आती है। वह भयानक है और अपनी उग्रता से मनुष्यों को बुरी तरह नष्ट कर देती है। विशेषकर यदि परमेश्वर का कोई दास उसमें पड़ जाए और समझदार न हो, तो वह उसके द्वारा बड़ी बुरी तरह नष्ट हो जाता है। वह ऐसे लोगों को नष्ट करती है जो भली अभिलाषा का वस्त्र पहने हुए नहीं हैं, बल्कि इस युग[a] में उलझे हुए हैं। इसलिए वह उन्हें मृत्यु के हवाले कर देती है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस संसार में।”
    reason: यूनानी αἰών का अर्थ ‘युग’ हो सकता है, पर इस प्रसंग में वह वर्तमान संसार-व्यवस्था को भी सूचित कर सकता है।
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: बुरी अभिलाषा
  rationale: ‘अभिलाषा’ इच्छा की नैतिक रूप से खुली धारणा को बनाए रखती है, जिससे इसी प्रसंग की ‘भली अभिलाषा’ के साथ स्पष्ट विरोध भी बना रहता है।
- source_word: ἀγρία ... δυσκόλως ἡμεροῦται
  choice: जंगली है और बड़ी कठिनाई से वश में आती है
  rationale: मूल के जंगली पशु और उसे साधने के रूपक को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: δαπανᾷ / δαπανᾶται
  choice: नष्ट कर देती है / नष्ट हो जाता है
  rationale: यह क्रिया यहाँ किसी को खपा देने, बरबाद करने या नष्ट करने का भाव रखती है; ‘नष्ट’ मृत्यु की ओर बढ़ते परिणाम को व्यक्त करते हुए अनावश्यक रूप से शाब्दिक ‘खा जाती है’ से बचता है।
- source_word: ἐμπέσῃ εἰς αὐτήν
  choice: उसके चंगुल में पड़ जाए
  rationale: शाब्दिक रूप से ‘उसमें पड़ जाए’ है; ‘चंगुल’ जंगली और भयावह अभिलाषा के सजीव रूपक को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἔνδυμα τῆς ἐπιθυμίας τῆς ἀγαθῆς
  choice: भली अभिलाषा का वस्त्र
  rationale: मूल के वस्त्र-रूपक को बरकरार रखा गया है और पिछले वाक्यांश ‘पहन लो’ से उसका संबंध सुरक्षित रहता है।
- source_word: παραδίδωσιν εἰς θάνατον
  choice: मृत्यु के हवाले कर देती है
  rationale: ‘सौंप देना’ के मूल अर्थ और अभिलाषा के कर्ता के रूप में मानवीकरण, दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘परमेश्वर के दास’ का बुरी अभिलाषा में पड़ना और मृत्यु को सौंपा जाना
  choice: मूल की चेतावनी को बिना किसी धर्मसैद्धान्तिक स्पष्टीकरण के सीधे रखा गया है।
  alternative: इसे केवल अस्थायी हानि, शारीरिक मृत्यु या अंतिम विनाश के किसी एक निश्चित अर्थ तक सीमित करना।
  rationale: पाठ स्वयं ‘मृत्यु’ की प्रकृति स्पष्ट नहीं करता; इसलिए वास्तविक चेतावनी और उसकी अस्पष्टता दोनों सुरक्षित रखी गई हैं।
- issue: αἰών का अर्थ
  choice: युग
  alternative: संसार
  rationale: ‘युग’ यूनानी शब्द के कालगत अर्थ को प्राथमिकता देता है, जबकि पादटिप्पणी प्रसंगगत ‘संसार’ की सम्भावना बताती है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘जंगली’, ‘वश में’, ‘चंगुल’ और ‘वस्त्र’ मूल के परस्पर जुड़े रूपकों को बनाए रखते हैं; दोहराई गई ‘नष्ट’ मूल में δαπανάω की पुनरावृत्ति को दर्शाती है।
