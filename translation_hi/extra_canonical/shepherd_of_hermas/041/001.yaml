base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/001.yaml
  text: 'He says to me: “Remove from yourself every evil desire, but clothe yourself with the desire that is good and dignified; for when you are clothed with this desire, you will hate the evil desire and you will bridle it as you wish.'
translation:
  language: hi
  text: वह मुझसे कहता है, “अपने आप से हर बुरी अभिलाषा हटा दे, पर अच्छी और गरिमामय अभिलाषा को धारण कर; क्योंकि इस अभिलाषा को धारण करके तू बुरी अभिलाषा से घृणा करेगा और अपनी इच्छा के अनुसार उस पर लगाम लगाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία
  choice: अभिलाषा
  rationale: यह शब्द प्रबल इच्छा या लालसा को व्यक्त करता है। यहाँ अच्छे और बुरे दोनों प्रकार की ἐπιθυμία का उल्लेख है, इसलिए ऐसा तटस्थ हिन्दी शब्द चुना गया जो दोनों विशेषणों के साथ स्वाभाविक लगे।
- source_word: ἔνδυσαι / ἐνδεδυμένος
  choice: धारण कर / धारण करके
  rationale: मूल में वस्त्र पहनने का रूपक है। ‘धारण करना’ हिन्दी में उस रूपक को बनाए रखते हुए गुण या मनोवृत्ति अपनाने के अर्थ में सहज है।
- source_word: σεμνήν
  choice: गरिमामय
  rationale: शब्द आदरणीय, गंभीर और नैतिक रूप से प्रतिष्ठित होने का भाव देता है; ‘गरिमामय’ इस व्यापक भाव को संप्रदायगत अर्थ जोड़े बिना व्यक्त करता है।
- source_word: χαλιναγωγήσεις
  choice: लगाम लगाएगा
  rationale: मूल क्रिया घोड़े को लगाम से वश में करने की सजीव छवि रखती है; हिन्दी में ‘लगाम लगाना’ उसी नियंत्रणकारी रूपक को सुरक्षित रखता है।
- source_word: καθὼς βούλει
  choice: अपनी इच्छा के अनुसार
  rationale: यह नियंत्रण की सीमा या ढंग को वक्ता की इच्छा से जोड़ता है। अनुवाद मूल के सीधे अर्थ और संभावित प्रबल दावे को नरम किए बिना रखता है।
theological_decisions:
- issue: अच्छी अभिलाषा को वस्त्र की तरह पहनने का रूपक
  choice: ‘धारण कर’ द्वारा रूपक बनाए रखा गया
  alternative: ‘अच्छी अभिलाषा अपना ले’
  rationale: मूल पाठ में उतारने और पहनने की समानांतर छवि स्पष्ट है; इसे केवल नैतिक ‘अपनाने’ में बदलना साहित्यिक और वैचारिक संबंध को कमजोर करता।
- issue: मनुष्य द्वारा बुरी अभिलाषा पर नियंत्रण
  choice: ‘अपनी इच्छा के अनुसार उस पर लगाम लगाएगा’
  alternative: ‘उसे काबू में रख सकेगा’
  rationale: मूल की भाषा मानव नियंत्रण को सीधे और दृढ़ रूप में कहती है। किसी विशिष्ट अनुग्रह-विषयक या इच्छा-स्वातंत्र्य संबंधी सिद्धांत के अनुरूप इसे सीमित या विस्तृत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सम्मानपूर्ण, उपदेशात्मक और सहज रजिस्टर रखा गया है। वक्ता के संबोधन में ‘तू’ का प्रयोग एकवचन आज्ञार्थक रूपों के अनुरूप है और प्राचीन संवाद की सीधी निकटता बनाए रखता है।
