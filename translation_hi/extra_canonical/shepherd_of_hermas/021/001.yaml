translation:
  language: hi
  text: पर तीसरे दर्शन में तुमने उसे पहले की अपेक्षा अधिक युवा, सुंदर और प्रसन्न देखा, और उसका रूप सुंदर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεωτέραν
  choice: पहले से अधिक युवा
  rationale: यह तुलनात्मक विशेषण है, इसलिए केवल ‘युवा’ के बजाय उसकी पहले दिखाई गई अवस्था की तुलना स्पष्ट की गई है।
- source_word: ἱλαράν
  choice: प्रसन्न
  rationale: यहाँ शब्द हर्षपूर्ण और उज्ज्वल मनोदशा बताता है; आधुनिक मानक हिन्दी में ‘प्रसन्न’ स्वाभाविक और गरिमापूर्ण है।
- source_word: μορφὴν
  choice: रूप
  rationale: यह बाहरी आकृति या स्वरूप को सूचित करता है; ‘रूप’ संक्षिप्त और प्रसंगानुकूल है।
