base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/002.yaml
  text: For just as when some good message comes to someone who is grieving, he immediately forgets his former sorrows and welcomes nothing else except the message that he heard, and from then on he is strengthened for what is good, and his spirit is renewed because of the joy that he received, so also you have received a renewal of your spirits by seeing these good things.
translation:
  language: hi
  text: क्योंकि जैसे किसी दुःखी व्यक्ति के पास कोई शुभ समाचार आता है, तो वह तुरंत अपने पहले के दुःखों को भूल जाता है और सुने हुए उस समाचार के सिवा और कुछ स्वीकार नहीं करता; फिर वह भलाई के लिए दृढ़ होता है, और मिली हुई खुशी के कारण उसकी आत्मा का नवीकरण होता है। उसी प्रकार, इन अच्छी बातों को देखकर तुम्हारी आत्माओं का भी नवीकरण हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία ἀγαθή
  choice: शुभ समाचार
  rationale: यह सामान्य अर्थ में अच्छा और आनंददायक संदेश है; 'सुसमाचार' कहने से बाद का विशिष्ट ईसाई पारिभाषिक अर्थ अनावश्यक रूप से आ सकता है।
- source_word: προσδέχεται
  choice: ध्यान नहीं देता
  rationale: संदर्भ में व्यक्ति उस सुने हुए समाचार के अतिरिक्त किसी अन्य बात को ग्रहण या स्वीकार नहीं करता; सहज आधुनिक हिन्दी में इसका भाव व्यक्त किया गया है।
- source_word: ἰσχυροποιεῖται ... εἰς τὸ ἀγαθόν
  choice: भलाई के लिए दृढ़ हो जाता है
  rationale: दिशात्मक εἰς को बनाए रखते हुए नैतिक भलाई की ओर शक्ति पाने का अर्थ व्यक्त करता है।
- source_word: πνεῦμα / πνευμάτων
  choice: आत्मा / आत्माओं
  rationale: यहाँ मनुष्य के आंतरिक जीवन और उत्साह के नवीकरण का संकेत है; एकवचन और बहुवचन का स्रोत-पाठानुसार भेद रखा गया है।
- source_word: ἀνανέωσιν
  choice: नयापन
  rationale: प्राप्त किए गए आंतरिक नवीकरण को स्वाभाविक हिन्दी में व्यक्त करता है और अगली क्रिया 'नई हो जाती है' से संबंध बनाए रखता है।
- source_word: ταῦτα τὰ ἀγαθά
  choice: इन अच्छी बातों
  rationale: नपुंसक बहुवचन का संदर्भ व्यापक है—देखी गई अच्छी वस्तुएँ या बातें; 'बातों' स्वाभाविक है और अर्थ को किसी खास दृश्य-वस्तु तक सीमित नहीं करता।
theological_decisions:
- issue: πνεῦμα का अर्थ
  choice: आत्मा
  alternative: मन / हौसला
  rationale: ग्रीक शब्द की आध्यात्मिक और आंतरिक अर्थ-व्याप्ति को सुरक्षित रखा गया है; केवल मनोदशा या हौसले तक सीमित नहीं किया गया।
- issue: ἀγγελία ἀγαθή का पारिभाषिकरण
  choice: शुभ समाचार
  alternative: सुसमाचार
  rationale: इस उपमा में कोई संदेश सुनने की सामान्य स्थिति है, इसलिए इसे तकनीकी रूप से मसीही 'सुसमाचार' बनाना स्रोत से अधिक विशिष्ट होता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। लंबे ग्रीक वाक्य की तर्क-श्रृंखला को अर्धविराम और संयोजकों से सुरक्षित रखा गया है। संबोधन में बहुवचन 'तुम्हारी आत्माओं' मूल ὑμεῖς/ὑμῶν के अनुसार रखा गया है।
