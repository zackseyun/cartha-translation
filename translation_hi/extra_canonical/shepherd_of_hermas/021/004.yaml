base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/004.yaml
  text: Therefore those who have repented completely will be new and firmly founded, those who have repented from their whole heart. You have the revelation complete. No longer ask anything about revelation; but if anything is needed, it will be revealed to you.
translation:
  language: hi
  text: इसलिए जिन्होंने पूरी तरह पश्चाताप किया है, वे नए और दृढ़ता से स्थापित होंगे—वे जिन्होंने पूरे हृदय से पश्चाताप किया है। तुम्हें पूरा प्रकाशन प्राप्त हो चुका है। अब प्रकाशन के विषय में कुछ और मत माँगना; पर यदि किसी बात की आवश्यकता होगी, तो वह तुम्हें प्रकट कर दी जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσαντες
  choice: पश्चाताप किया है
  rationale: यहाँ शब्द हृदय और जीवन की दिशा बदलने वाले पश्चाताप को व्यक्त करता है; सामान्य हिन्दी पाठक के लिए ‘पश्चाताप’ स्वाभाविक और धार्मिक संदर्भ में स्पष्ट है।
- source_word: νέοι
  choice: नए
  rationale: यूनानी का सीधा अर्थ ‘नए/नवीन’ है; संदर्भ आत्मिक नवीनीकरण का है, इसलिए अस्पष्टता को बिना बढ़ाए ‘नए’ रखा गया है।
- source_word: τεθεμελιωμένοι
  choice: दृढ़ नींव पर स्थापित
  rationale: शाब्दिक रूप से ‘नींव डाले हुए’; यह स्थिरता और सुदृढ़ स्थापना दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποκάλυψιν
  choice: प्रकाशन
  rationale: यह ईश्वरीय रूप से प्रकट की गई बात/दर्शन को सूचित करता है। ‘प्रकाशन’ मूल के धार्मिक आशय को बनाए रखता है।
- source_word: ἀποκαλυφθήσεταί
  choice: प्रकट कर दी जाएगी
  rationale: कर्मवाच्य रूप को सुरक्षित रखा गया है और प्रकट करने वाले को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
theological_decisions:
- issue: पश्चाताप की पूर्णता और पूरे हृदय से पश्चाताप के बीच संबंध
  choice: 'दोनों यूनानी वाक्यांशों को एक संयुक्त कथन में रखा: ‘जिन्होंने पूरे मन से पश्चाताप किया है’ और परिणाम ‘पूरी तरह नए’'
  alternative: ‘जिन्होंने पूरी तरह पश्चाताप किया है ... जिन्होंने पूरे हृदय से पश्चाताप किया है’ के रूप में पुनरुक्ति बनाए रखना
  rationale: ὁλοτελῶς को परिणाम ‘नए हो जाएँगे’ के साथ पढ़ना व्याकरणतः संभव और अधिक स्वाभाविक है, जबकि अगला पदबंध पश्चाताप करने वालों की पहचान स्पष्ट करता है। इससे मूल की पुनरुक्ति का अर्थ बना रहता है, पर हिन्दी बोझिल नहीं होती।
- issue: प्रकाशन देने वाले की पहचान
  choice: कर्मवाच्य ‘प्रकट कर दी जाएगी’
  alternative: ‘परमेश्वर तुम्हें प्रकट करेगा’
  rationale: मूल में कर्ता स्पष्ट नहीं है; इसलिए परमेश्वर को स्पष्ट कर्ता बनाकर वास्तविक अस्पष्टता को समाप्त नहीं किया गया।
- issue: ἀπέχεις का आशय
  choice: ‘तुम्हें ... मिल चुका है’
  alternative: ‘तुम्हारे पास ... है’ या ‘तुमने ... पूरा पा लिया है’
  rationale: संदर्भ में पूर्ण प्रकाशन प्राप्त हो जाने का भाव है। हिन्दी पूर्णकाल उस संपन्न प्राप्ति को सहज रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठकों के लिए सुबोध। संबोधन एकवचन ‘तुम’ में रखा गया है, क्योंकि यूनानी क्रियाएँ एकवचन हैं। वाक्य विन्यास मूल के तर्क और कर्मवाच्य अस्पष्टता को सुरक्षित रखते हुए स्वाभाविक बनाया गया है।
