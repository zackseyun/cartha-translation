review_pass:
  verdict: revise
  source_fidelity: 'Draft reverses the most natural relation of ὁλοτελῶς: it qualifies ‘have repented completely,’ not ‘will become completely new.’ The final indirect passive should be expressed as ‘revealed to you,’ rather than the less idiomatic ‘upon you.’ The remaining sense, including the unspecified revealer, is retained.'
  naturalness: The revision uses fluent modern standard Hindi while retaining the source’s emphatic restatement about wholehearted repentance and its singular informal address.
  terminology: ‘पश्चाताप,’ ‘नए,’ ‘स्थापित,’ and ‘प्रकाशन/प्रकट’ suitably convey the key terms without assigning an explicit divine agent. ‘दृढ़ता से स्थापित’ represents the founded/established image without unnecessarily expanding it.
  issues:
  - severity: medium
    issue: ‘पूरी तरह’ is attached to ‘नए हो जाएँगे’ rather than to ‘पश्चाताप किया है.’
    rationale: In οἱ ... μετανοήσαντες ὁλοτελῶς, the adverb most naturally modifies the participle ‘having repented’; the English audit trail likewise preserves this.
  - severity: low
    issue: ‘तुम पर प्रकट कर दी जाएगी’ is not idiomatic for σοι with an indirect passive.
    rationale: ‘तुम्हें प्रकट कर दी जाएगी’ is natural Hindi and retains the Greek’s unspecified agent.
  revised_text: इसलिए जिन्होंने पूरी तरह पश्चाताप किया है, वे नए और दृढ़ता से स्थापित होंगे—वे जिन्होंने पूरे हृदय से पश्चाताप किया है। तुम्हें पूरा प्रकाशन प्राप्त हो चुका है। अब प्रकाशन के विषय में कुछ और मत माँगना; पर यदि किसी बात की आवश्यकता होगी, तो वह तुम्हें प्रकट कर दी जाएगी।
  revised_footnotes: []
  revision_rationale: The revision restores the source’s placement and emphasis of ‘completely’ with repentance, preserves the appositional repetition ‘those who have repented with their whole heart,’ and makes the final passive natural in Hindi without identifying the unstated agent.
