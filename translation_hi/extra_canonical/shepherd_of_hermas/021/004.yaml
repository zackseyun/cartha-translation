revisions:
- from: इसलिए जिन्होंने पूरे मन से पश्चाताप किया है, वे पूरी तरह नए हो जाएँगे और दृढ़ नींव पर स्थापित होंगे। अब तुम्हें पूरा प्रकाशन मिल चुका है। आगे से प्रकाशन के विषय में कुछ मत माँगना; पर यदि किसी बात की आवश्यकता होगी, तो वह तुम पर प्रकट कर दी जाएगी।
  to: इसलिए जिन्होंने पूरी तरह पश्चाताप किया है, वे नए और दृढ़ता से स्थापित होंगे—वे जिन्होंने पूरे हृदय से पश्चाताप किया है। तुम्हें पूरा प्रकाशन प्राप्त हो चुका है। अब प्रकाशन के विषय में कुछ और मत माँगना; पर यदि किसी बात की आवश्यकता होगी, तो वह तुम्हें प्रकट कर दी जाएगी।
  rationale: The revision restores the source’s placement and emphasis of ‘completely’ with repentance, preserves the appositional repetition ‘those who have repented with their whole heart,’ and makes the final passive natural in Hindi without identifying the unstated agent.
