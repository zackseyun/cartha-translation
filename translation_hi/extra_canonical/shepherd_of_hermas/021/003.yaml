base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/003.yaml
  text: And because you saw her sitting on a bench, the position is firm; because the bench has four feet and stands firmly. For indeed the world is held together by four elements.
translation:
  language: hi
  text: और तुमने उसे चौकी पर बैठी देखा—इसका अर्थ है कि उसकी स्थिति दृढ़ है; क्योंकि चौकी के चार पाये हैं और वह मजबूती से खड़ी रहती है। वास्तव में, संसार भी चार तत्वों के द्वारा थामा हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλιον
  choice: चौकी
  rationale: यह चार पायों वाली बैठने की वस्तु है; ‘चौकी’ आधुनिक हिन्दी में स्वाभाविक है और अगले वाक्य में चार पायों के उल्लेख से मेल खाती है।
- source_word: ἰσχυρὰ ἡ θέσις
  choice: उसकी स्थिति दृढ़ है
  rationale: यूनानी पद का संक्षिप्त और अपेक्षाकृत शाब्दिक अर्थ रखा गया है; संदर्भ में यह स्त्री के बैठने की स्थिर स्थिति और उसके प्रतीकात्मक अर्थ दोनों को खुला रखता है।
- source_word: κρατεῖται
  choice: स्थिर बना रहता है
  rationale: यहाँ क्रिया संसार के चार तत्वों द्वारा थामे या कायम रखे जाने का भाव देती है; सहज हिन्दी के लिए कर्मवाच्य की जगह यह अभिव्यक्ति चुनी गई है।
- source_word: στοιχεῖα
  choice: तत्वों
  rationale: प्राचीन विश्व-कल्पना में जगत के चार मूल तत्व अभिप्रेत हैं; ‘तत्व’ मानक और समझने योग्य समतुल्य है।
theological_decisions:
- issue: चौकी के चार पायों और संसार के चार तत्वों के बीच प्रतीकात्मक संबंध
  choice: मूल पाठ के कथन को बिना अतिरिक्त व्याख्या के रखा गया है
  alternative: चार तत्वों की पहचान पृथ्वी, जल, वायु और अग्नि के रूप में स्पष्ट करना
  rationale: यूनानी पाठ स्वयं तत्वों के नाम नहीं देता; उन्हें मुख्य पाठ या टिप्पणी में जोड़ना स्रोत से आगे जाना होता।
- issue: ἡ θέσις का संकेत
  choice: ‘उसकी स्थिति’ कहकर संभावित स्थानगत और प्रतीकात्मक दोनों अर्थ बनाए रखे गए हैं
  alternative: ‘उसका आधार’ या ‘कलीसिया की नींव’
  rationale: ऐसी व्याख्याएँ संदर्भ से संभव हो सकती हैं, पर इस वाक्य में स्पष्ट रूप से कही नहीं गईं; इसलिए धार्मिक अर्थ को संकीर्ण नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चौकी’, ‘चार पाये’ और ‘चार तत्व’ के ठोस बिंब मूल तर्क की संरचना बनाए रखते हैं।
