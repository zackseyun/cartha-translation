review_pass:
  verdict: revise
  source_fidelity: The draft preserves the argument from the four-footed seat to the world's four elements. However, «καθημένην» is feminine ('sitting'), whereas 'बैठे' is masculine. Also, κρατεῖται is more precisely 'is held together/sustained' than merely 'remains stable.'
  naturalness: '''चौकी'' and ''चार पाये'' are natural modern Hindi. Correcting the participle to ''बैठी'' is necessary for grammatical agreement with ''उसे'' (the woman). ''थामा हुआ है'' naturally conveys the passive force of the final Greek verb.'
  terminology: '''चौकी'' is a defensible rendering of συμψέλιον, especially since the immediately following reference to four feet makes the object clear. ''चार तत्व'' appropriately retains the ancient four-elements cosmology without supplying their identities.'
  issues:
  - severity: medium
    issue: Gender disagreement in 'उसे चौकी पर बैठे देखा'
    rationale: The Greek participle καθημένην is feminine and refers to the female figure. Standard Hindi requires 'बैठी' here.
  - severity: low
    issue: The final clause weakens κρατεῖται
    rationale: '''स्थिर बना रहता है'' conveys stability, but κρατεῖται specifically depicts the world as being held together or sustained through four elements. ''थामा हुआ है'' retains that force.'
  revised_text: और तुमने उसे चौकी पर बैठी देखा—इसका अर्थ है कि उसकी स्थिति दृढ़ है; क्योंकि चौकी के चार पाये हैं और वह मजबूती से खड़ी रहती है। वास्तव में, संसार भी चार तत्वों के द्वारा थामा हुआ है।
  revised_footnotes: []
  revision_rationale: The revision corrects the feminine agreement required by the Greek and restores the passive, sustaining sense of κρατεῖται. It retains the draft's nonsectarian wording, its ambiguity concerning the symbolic force of 'स्थिति,' and its restrained presentation of the ancient four-elements concept.
