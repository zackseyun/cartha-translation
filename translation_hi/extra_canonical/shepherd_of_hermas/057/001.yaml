  text: I say to him, "Lord, explain this to me further." He says, "What are you seeking?" I say, "Then, Lord, are those who indulge themselves and are deceived tormented for the same length of time as the time of the deception? For the time of deception is one hour, but the hour of torment has the force of thirty days. Therefore, if someone indulges himself for one day and is deceived, and is tormented for one day, the day of torment amounts to a whole year. So then, for as many days as a person indulges himself, for that many years he is tormented." "You see then," he says, "that the time of indulgence and deception is very short, but the time of punishment and torment is long."
translation:
  language: hi
  text: मैं उससे कहता हूँ, “प्रभु, यह बात मुझे और स्पष्ट कर दीजिए।” वह कहता है, “तुम क्या जानना चाहते हो?” मैं कहता हूँ, “तो, प्रभु, क्या जो लोग भोग-विलास करते हैं और बहकावे में पड़ते हैं, वे उतने ही समय तक यातना पाते हैं जितना बहकावे का समय होता है? क्योंकि बहकावे का समय एक घंटा है, पर यातना का एक घंटा तीस दिनों के बराबर होता है। इसलिए, यदि कोई एक दिन भोग-विलास करे और बहकावे में पड़े, और एक दिन यातना पाए, तो यातना का वह दिन पूरे एक वर्ष के बराबर होता है। अतः कोई जितने दिन भोग-विलास करता है, उतने ही वर्ष वह यातना पाता है।” वह कहता है, “तो तुम देखते हो कि भोग-विलास और बहकावे का समय बहुत कम है, पर दंड और यातना का समय बहुत लंबा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶντες / τρυφήσῃ / τρυφῆς
  choice: भोग-विलास करनेवाले / भोग-विलास करे / भोग-विलास
  rationale: τρυφάω यहाँ आत्म-लिप्त सुखभोग या विलासी जीवन का भाव देता है; ‘भोग-विलास’ आधुनिक हिन्दी में इसके नैतिक और व्यवहारगत आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπατώμενοι / ἀπατηθῇ / ἀπάτης
  choice: बहकावे में पड़नेवाले / बहकावे में पड़े / बहकावे
  rationale: मध्य/कर्मवाच्य रूप धोखा खाने या बहकाए जाने को दर्शाता है। ‘बहकावे में पड़ना’ कर्ता की संलिप्तता और बाहरी भ्रम—दोनों की संभावित छाया बनाए रखता है।
- source_word: βασανίζονται / βασάνου / βασανισθῇ
  choice: यातना पाते हैं / यातना / यातना पाए
  rationale: βάσανος दंडात्मक पीड़ा या यातना के लिए प्रयुक्त है; ‘यातना’ कठोरता को बिना नरम किए सुरक्षित रखता है।
- source_word: ὥρα
  choice: घड़ी
  rationale: यहाँ समय की एक मापित इकाई है। ‘घड़ी’ साहित्यिक किंतु सुबोध है और आगे के अनुपातात्मक कथन से मेल खाती है।
- source_word: δύναμιν ἔχει / ἰσχύει
  choice: प्रभाव होता है / बराबर होता है
  rationale: दोनों प्रयोग समय की दंडात्मक गणना या समतुल्यता बताते हैं; हिन्दी में शाब्दिक एकरूपता की अपेक्षा प्रसंगानुकूल स्पष्टता रखी गई है।
- source_word: τιμωρίας
  choice: दंड
  rationale: τιμωρία का अर्थ दंड या प्रतिफलात्मक सजा है; ‘दंड’ धार्मिक संप्रदायगत व्याख्या जोड़े बिना सीधा अर्थ देता है।
theological_decisions:
- issue: भोग-विलास और यातना के समय का अनुपात
  choice: पाठ में दिए गए एक दिन के भोग-विलास के बदले एक वर्ष की यातना के अनुपात को ज्यों का त्यों रखा गया है।
  alternative: इसे केवल सामान्य रूपक या अनिश्चित दीर्घ दंड के रूप में ढीला करना।
  rationale: यूनानी पाठ स्पष्ट गणनात्मक भाषा—एक घड़ी, तीस दिन, एक दिन, पूरा वर्ष—का प्रयोग करता है; अनुवाद को इसकी कठोरता या संभावित रूपकत्व पर अतिरिक्त निर्णय नहीं देना चाहिए।
- issue: ἀπατάω में बाहरी धोखे और आत्म-भ्रम का संबंध
  choice: ‘बहकावे में पड़ना’ चुना गया है।
  alternative: ‘धोखा खाना’ या ‘अपने को धोखा देना’।
  rationale: मूल कर्मवाच्य/मध्यवाच्य रूप कारण या अभिकर्ता को स्पष्ट नहीं करता। चुना हुआ पद इस अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है।
- issue: वक्ता द्वारा संबोधन κύριε
  choice: ‘प्रभु’
  alternative: ‘स्वामी’ या ‘महोदय’।
  rationale: कृति के दर्शनात्मक धार्मिक प्रसंग में ‘प्रभु’ गरिमापूर्ण और प्रचलित है, पर इसे ईश्वर की पहचान संबंधी अतिरिक्त दावा बनाने के लिए विस्तृत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संवादात्मक गद्य रखा गया है। वाक्य-संरचना मूल के प्रश्नोत्तर और गणनात्मक तर्क का क्रम बनाए रखती है। अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘यातना’, ‘दंड’ और ‘प्रभाव’ जैसे व्यापक रूप से समझे जानेवाले शब्द चुने गए हैं।
