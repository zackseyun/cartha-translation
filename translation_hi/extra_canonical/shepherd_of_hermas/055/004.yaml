base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/004.yaml
  text: 6. This shepherd, then, took over the sheep from the shepherd who was a young man—those that were living wastefully and self-indulgently, but not skipping—and he cast them into a certain steep, thorny place full of thistles, so that, because of the thorns and thistles, the sheep were unable to disentangle themselves, but [were entangled in the thorns and thistles; these, then,] being entangled, grazed among the thorns and thistles. They suffered greatly, being torn by him; he drove them here and there and gave them no rest, and those sheep were not at all steady.
translation:
  language: hi
  text: 6. तब उस चरवाहे ने जवान चरवाहे से उन भेड़ों को अपने पास ले लिया जो फ़िज़ूलखर्ची और भोग-विलास में लगी थीं, पर उछल-कूद नहीं करती थीं। उसने उन्हें एक ऐसी जगह डाल दिया जो खड़ी ढाल वाली, काँटों से भरी और गोखरुओं वाली थी, ताकि काँटों और गोखरुओं के कारण वे अपने आपको छुड़ा न सकें, बल्कि [काँटों और गोखरुओं में उलझी रहें; इसलिए वे] उन्हीं में उलझी हुई काँटों और गोखरुओं के बीच चरती रहीं। उसके मारने से वे बहुत कष्ट पाती थीं। वह उन्हें इधर-उधर हाँकता रहता और उन्हें तनिक भी विश्राम नहीं देता था; वे भेड़ें बिल्कुल भी चैन से नहीं रह पाती थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαταλῶντα
  choice: फ़िज़ूलखर्ची ... में लगी थीं
  rationale: यह शब्द उच्छृंखल या अपव्ययी जीवन का संकेत देता है; ‘फ़िज़ूलखर्ची’ सामान्य आधुनिक हिन्दी में आर्थिक और जीवन-व्यवहार दोनों की बरबादी व्यक्त करती है।
- source_word: τρυφῶντα
  choice: भोग-विलास में लगी थीं
  rationale: τρυφάω का आशय विलास और आत्म-लिप्त सुखभोग से है; यह चुनाव संदर्भ के नैतिक भाव को बनाए रखता है।
- source_word: σκιρτῶντα
  choice: उछल-कूद नहीं करती थीं
  rationale: भेड़ों के व्यवहार के लिए मूल क्रिया का ठोस चित्र सुरक्षित रखा गया है; इसे किसी व्याख्यात्मक नैतिक पद से नहीं बदला गया।
- source_word: κρημνώδη
  choice: ढलानदार
  rationale: शब्द खड़ी या कठिन ढाल वाले भूभाग को दर्शाता है; ‘ढलानदार’ सहज हिन्दी है और अनावश्यक रूप से ‘खाई’ का अर्थ नहीं जोड़ता।
- source_word: τριβολώδη / τριβόλοις
  choice: गोखरुओं वाली / गोखरुओं
  rationale: τρίβολος काँटेदार खरपतवार या कंटीले फल वाले पौधे को दर्शाता है; ‘गोखरू’ हिन्दी में उपयुक्त वनस्पतिक और चित्रात्मक समतुल्य है।
- source_word: δαιρόμενα
  choice: वह उन्हें मारता था
  rationale: मूल क्रिया पीटने या प्रहार करने की है। कष्ट का कारण चरवाहे की मार है, इसलिए अंग्रेज़ी ‘torn’ की अपेक्षा यूनानी स्रोत का अनुसरण किया गया है।
- source_word: οὐκ εὐσταθοῦσαν
  choice: बिल्कुल भी स्थिर नहीं रह पाती थीं
  rationale: εὐσταθέω यहाँ स्थिर या शांत स्थिति में रहने को व्यक्त करता है; प्रसंग में लगातार हाँके जाने के कारण अस्थिरता है।
theological_decisions:
- issue: दंड देने वाले चरवाहे की कार्रवाई का नैतिक या धर्मशास्त्रीय अर्थ
  choice: केवल दृश्यात्मक कार्रवाई—लेना, कठिन स्थान में डालना, मारना और हाँकना—का अनुवाद किया गया
  alternative: इसे सीधे परमेश्वर का अनुशासन, दंड या शुद्धिकरण कहना
  rationale: इस खंड में प्रतीक का अर्थ स्पष्ट रूप से नहीं जोड़ा गया है; अनुवाद को व्याख्या से अलग रखते हुए कथात्मक तनाव सुरक्षित रखा गया।
- issue: ‘उछल-कूद नहीं करती थीं’ का प्रतीकात्मक अर्थ
  choice: मूल पशु-चित्र को यथावत रखा गया
  alternative: इसे ‘विद्रोही नहीं थीं’ या ‘प्रभु की निंदा नहीं करती थीं’ के रूप में खोलना
  rationale: निकटवर्ती संदर्भ अर्थ की ओर संकेत करता है, पर इस वाक्य में प्रयुक्त ठोस रूपक को चुपचाप व्याख्यात्मक भाषा में बदलना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। यूनानी पाठ के कोष्ठकीय अंश को स्रोत-संदेह दर्शाने के लिए वर्ग कोष्ठकों में ही रखा गया है। कोई पाद-टिप्पणी चिह्न आवश्यक नहीं था।
