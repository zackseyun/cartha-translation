base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/002.yaml
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of repentance, by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
translation:
  language: hi
  text: “जिन भेड़ों को तुमने उछलते-कूदते नहीं, बल्कि एक ही जगह चरते देखा था, वे वे लोग हैं जिन्होंने अपने आपको भोग-विलास और छल-कपट के हवाले कर दिया है, पर उन्होंने प्रभु की बिल्कुल भी निन्दा नहीं की। इसलिए वे सत्य से भ्रष्ट हो गए हैं। फिर भी उनमें मन फिराव की आशा है, जिसके द्वारा वे जीवित रह सकते हैं। अतः भ्रष्टता को किसी नवीनीकरण की आशा है, पर मृत्यु में अनन्त विनाश है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκιρτῶντα
  choice: उछलते-कूदते
  rationale: भेड़ों की चंचल उछल-कूद का स्वाभाविक और दृश्यात्मक हिन्दी रूप।
- source_word: τρυφαῖς
  choice: भोग-विलास
  rationale: सुखासक्ति और ऐश्वर्यपूर्ण आत्म-लिप्तता के नकारात्मक भाव को स्पष्ट करता है।
- source_word: ἀπάταις
  choice: छल-कपट
  rationale: बहुवचन शब्द में निहित धोखे और भ्रमकारी आचरण, दोनों के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: παραδεδωκότες ἑαυτοὺς
  choice: अपने आपको … के हवाले कर दिया है
  rationale: स्वेच्छा से स्वयं को किसी प्रभाव के अधीन कर देने की पूर्ण क्रिया को बनाए रखता है।
- source_word: μετανοίας
  choice: मन फिराव
  rationale: विचार, मनोवृत्ति और जीवन-दिशा के परिवर्तन का धार्मिक अर्थ साधारण पाठक के लिए व्यक्त करता है।
- source_word: καταφθορὰ
  choice: भ्रष्टता
  rationale: यहाँ नैतिक और आध्यात्मिक बिगाड़ की अवस्था है; इसे अगले पद के ‘मृत्यु’ से अलग रखा गया है।
- source_word: ἀνανεώσεώς τινος
  choice: किसी प्रकार के नवीनीकरण
  rationale: τινος की अनिश्चितता को सुरक्षित रखते हुए फिर से नया किए जाने का भाव देता है।
- source_word: ἀπώλειαν αἰώνιον
  choice: अनन्त विनाश
  rationale: अवधि/परिणाम की गंभीरता को व्यक्त करता है और स्रोत की संक्षिप्तता को बनाए रखता है।
theological_decisions:
- issue: भ्रष्टता और मृत्यु के बीच भेद
  choice: ‘भ्रष्टता’ में नवीनीकरण की आशा, पर ‘मृत्यु’ में अनन्त विनाश
  alternative: दोनों को एक ही प्रकार की अंतिम दण्डावस्था मानना
  rationale: ग्रीक पाठ दोनों अवस्थाओं को स्पष्ट रूप से अलग रखता है; अनुवाद इस तनाव को बिना व्याख्यात्मक समाधान के सुरक्षित रखता है।
- issue: मन फिराव के द्वारा जीवन
  choice: ‘जिसके द्वारा वे जीवित रह सकते हैं’
  alternative: ‘जिसमें वे बच सकते हैं’
  rationale: ἐν ᾗ का व्याकरणिक सम्बन्ध ‘मन फिराव’ से है और ζῆσαι का मूल अर्थ ‘जीवित रहना/जीना’ है; इसलिए उद्धार-संबंधी अर्थ को अधिक विशिष्ट नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। भेड़ों के रूपक को दृश्यात्मक रखा गया है और ‘भ्रष्टता’, ‘मृत्यु’, ‘नवीनीकरण’ तथा ‘अनन्त विनाश’ के बीच स्रोत-पाठ की धर्मवैचारिक कसावट को बिना अतिरिक्त सम्प्रदायगत व्याख्या के सुरक्षित किया गया है।
