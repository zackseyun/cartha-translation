  text: And he says to me, “Do you see this shepherd?” “I do,” I say, “sir.”
translation:
  language: hi
  text: और वह मुझसे कहता है, “क्या तुम इस चरवाहे को देखते हो?” मैं कहता हूँ, “मैं देखता हूँ, महोदय।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα
  choice: चरवाहे
  rationale: यह ποιμήν का स्वाभाविक और सामान्य हिन्दी समतुल्य है तथा प्रसंग में भेड़ों की देखभाल करने वाले व्यक्ति को स्पष्ट करता है।
- source_word: κύριε
  choice: महोदय
  rationale: यहाँ संबोधित व्यक्ति के प्रति आदर प्रकट होता है; ‘महोदय’ इस सम्मानसूचक संबोधन को बिना उसे अनिवार्य रूप से ईश्वरीय उपाधि बनाए व्यक्त करता है।
theological_decisions:
- issue: κύριε को ईश्वरीय उपाधि या सामान्य आदरसूचक संबोधन समझना
  choice: महोदय
  alternative: प्रभु
  rationale: तात्कालिक संवाद में यह प्रत्यक्ष संबोधन है और संदर्भ इसे आवश्यक रूप से परमेश्वर के लिए प्रयुक्त उपाधि नहीं बनाता; इसलिए सामान्य सम्मानसूचक अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; प्रत्यक्ष संवाद की संक्षिप्तता और प्रश्नोत्तर की लय बनाए रखी गई है।
