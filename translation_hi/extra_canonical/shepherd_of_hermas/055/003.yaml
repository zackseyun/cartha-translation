  text: 5. Again we went on a little, and he shows me a great shepherd, savage in appearance, wearing a white goatskin, and he had a bag on his shoulders, and a very hard staff with knots, and a great whip. He had a very harsh look, so that I was afraid of him—such was his look.
translation:
  language: hi
  text: 5. फिर हम थोड़ा आगे बढ़े। तब उसने मुझे एक बड़ा चरवाहा दिखाया, जो देखने में मानो जंगली था। वह सफ़ेद बकरी की खाल ओढ़े हुए था; उसके कंधों पर एक झोला था, और उसके पास गाँठोंवाली बहुत कठोर लाठी और एक बड़ा कोड़ा था। उसकी दृष्टि अत्यन्त कठोर थी, यहाँ तक कि मैं उससे डर गया—उसकी दृष्टि ऐसी ही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα μέγαν
  choice: एक विशालकाय चरवाहा
  rationale: μέγαν चरवाहे के आकार या प्रभावशाली रूप को सूचित करता है; ‘विशालकाय’ दृश्य की भयावहता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡσεὶ ἄγριον τῇ ἰδέᾳ
  choice: जो देखने में मानो जंगली था
  rationale: ὡσεὶ की तुलनात्मक अनिश्चितता ‘मानो’ से सुरक्षित रहती है, और τῇ ἰδέᾳ बाहरी रूप-दिखावट को बताता है।
- source_word: περικείμενον δέρμα αἴγειον λευκόν
  choice: सफ़ेद बकरी की खाल ओढ़े हुए
  rationale: περίκειμαι शरीर पर धारण या लपेटे होने का भाव देता है; ‘ओढ़े हुए’ आधुनिक हिन्दी में सहज है।
- source_word: πήραν
  choice: झोला
  rationale: यह चरवाहे या यात्री के कंधे पर लटकने वाले थैले को दर्शाता है; ‘झोला’ साधारण पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: ῥάβδον σκληρὰν λίαν καὶ ὄζους ἔχουσαν
  choice: गाँठोंवाली बहुत कठोर लाठी
  rationale: ῥάβδος के लिए ‘लाठी’ चरवाहे के संदर्भ में स्वाभाविक है; ὄζους उभरी हुई गाँठों को बताता है।
- source_word: τὸ βλέμμα ... περίπικρον
  choice: उसकी दृष्टि अत्यन्त कठोर थी
  rationale: περίπικρον तीखी, कटु और भय उत्पन्न करने वाली दृष्टि का बोध कराता है; ‘अत्यन्त कठोर’ हिन्दी में इस प्रभाव को बिना अतिव्याख्या के देता है।
