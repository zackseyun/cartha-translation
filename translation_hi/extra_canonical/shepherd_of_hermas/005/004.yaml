  text: So I took it, and withdrawing to a certain place in the field, I copied it all letter by letter, for I could not make out the syllables. And when I had finished the letters of the book, suddenly the little book was snatched from my hand; but by whom I did not see.
translation:
  language: hi
  text: इसलिए मैंने उसे लिया और खेत में एक जगह अलग हटकर सब कुछ अक्षर-अक्षर उतार लिया, क्योंकि मैं शब्दांशों को पहचान नहीं पा रहा था। जब मैं उस छोटी पुस्तक को अक्षर-अक्षर उतार चुका, तो अचानक वह छोटी पुस्तक मेरे हाथ से छीन ली गई; पर मैंने नहीं देखा कि उसे किसने छीना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: छोटी पुस्तक
  rationale: यह βιβλίον का लघुतासूचक रूप है; इसलिए आकार-संबंधी भाव को स्पष्ट रखा गया है।
- source_word: εἰς τινα τόπον τοῦ ἀγροῦ ἀναχωρήσας
  choice: खेत में एक सुनसान जगह जाकर
  rationale: ἀναχωρέω में अलग हटने या एकांत में जाने का भाव है; स्वाभाविक हिन्दी में इसे 'सुनसान जगह जाकर' व्यक्त किया गया।
- source_word: πάντα πρὸς γράμμα
  choice: अक्षर-अक्षर पूरा
  rationale: वाक्यांश हूबहू, प्रत्येक अक्षर के अनुसार नकल करने पर बल देता है।
- source_word: τὰς συλλαβάς
  choice: अक्षर-समूहों
  rationale: शाब्दिक अर्थ 'शब्दांशों' है, पर प्रसंग में लिखावट को खंडों में पहचान या समझ न पाने का भाव है। 'अक्षर-समूह' उस कठिनाई को सामान्य पाठक के लिए स्पष्ट रखते हुए मूल शब्द के निकट है।
- source_word: ἡρπάγη
  choice: छीन ली गई
  rationale: क्रिया अचानक और बलपूर्वक ले लिए जाने का संकेत देती है; कर्मवाच्य को सुरक्षित रखा गया है।
