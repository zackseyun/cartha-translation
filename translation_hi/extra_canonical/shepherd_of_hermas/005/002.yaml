  text: So, having come to the place, I knelt and began to pray to the Lord and to glorify his name, because he had deemed me worthy and had made known to me my former sins.
translation:
  language: hi
  text: इसलिए उस स्थान पर पहुँचकर मैंने घुटने टेककर प्रभु से प्रार्थना करना और उसके नाम की महिमा करना शुरू किया, क्योंकि उसने मुझे योग्य समझा और मेरे पहले के पापों से मुझे परिचित कराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιθῶ τὰ γόνατα
  choice: मैंने घुटने टेके
  rationale: यूनानी मुहावरे का स्वाभाविक और अर्थ-सटीक हिन्दी रूप।
- source_word: δοξάζειν αὐτοῦ τὸ ὄνομα
  choice: उसके नाम की महिमा करने
  rationale: ‘नाम की महिमा करना’ धार्मिक संदर्भ में परिचित है और मूल की अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ἄξιον ἡγήσατο
  choice: उसने मुझे योग्य समझा
  rationale: मूल में अनुग्रहपूर्वक योग्य माने जाने का भाव है; अनावश्यक धर्मवैज्ञानिक विस्तार से बचा गया है।
- source_word: ἐγνώρισέν μοι
  choice: मुझ पर प्रकट किए
  rationale: यहाँ केवल सूचना देने के बजाय पापों का बोध करा देने का आशय है; यह हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: τὰς ἁμαρτίας μου τὰς πρότερον
  choice: मेरे पिछले पाप
  rationale: ‘पहले के/पूर्व पाप’ का सरल आधुनिक हिन्दी रूप, समय-संबंधी अस्पष्टता को बनाए रखते हुए।
theological_decisions:
- issue: पूर्व पापों को ज्ञात कराने की कर्ता-भूमिका
  choice: ‘उसने ... मुझ पर प्रकट किए’ में प्रभु को कर्ता बनाए रखा
  alternative: ‘मुझे अपने पिछले पापों का ज्ञान दिया’
  rationale: मूल ἐγνώρισέν μοι में प्रभु सक्रिय कर्ता हैं; अनुवाद उसी जोर को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; कथात्मक प्रथम पुरुष और भक्ति-संबंधी भाषा को मूल के निकट रखा गया है।
