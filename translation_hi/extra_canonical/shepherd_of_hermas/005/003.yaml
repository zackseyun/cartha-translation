  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/003.yaml
  text: And after I rose from prayer, I see before me the elderly woman whom I had also seen last year, walking and reading a little book. And she says to me, “Are you able to report these things to the elect of God?” I say to her, “Lady, I am not able to remember so many things; but give me the little book, so that I may copy it.” “Take it,” she says, “and you will give it back to me.”
translation:
  language: hi
  text: और प्रार्थना से उठने के बाद मैं अपने सामने उसी वृद्धा को देखता हूँ, जिसे मैंने पिछले वर्ष भी देखा था। वह चलते हुए एक छोटी-सी पुस्तक पढ़ रही थी। वह मुझसे कहती है, “क्या तुम इन बातों को परमेश्वर के चुने हुओं को बता सकते हो?” मैं उससे कहता हूँ, “हे स्वामिनी, मैं इतनी सारी बातें याद नहीं रख सकता; पर यह छोटी-सी पुस्तक मुझे दे दीजिए, ताकि मैं इसकी नकल कर लूँ।” वह कहती है, “लो, और तुम इसे मुझे लौटा दोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέραν
  choice: वृद्धा
  rationale: यहाँ संज्ञा के रूप में प्रयुक्त स्त्रीलिंग पद आयु में बड़ी स्त्री को सूचित करता है; “वृद्धा” स्वाभाविक और संक्षिप्त है।
- source_word: βιβλαρίδιον / βιβλίδιον
  choice: छोटी-सी पुस्तक / छोटी पुस्तक
  rationale: दोनों लघुतासूचक रूप हैं; हिन्दी में पुस्तक के छोटे आकार को स्पष्ट रखा गया है।
- source_word: ἀναγγεῖλαι
  choice: सुना सकते हो
  rationale: संदर्भ में लिखी हुई बातों को परमेश्वर के चुने हुओं तक मौखिक रूप से पहुँचाने का भाव है; यह सामान्य हिन्दी में स्वाभाविक है।
- source_word: ἐκλεκτοῖς τοῦ Θεοῦ
  choice: परमेश्वर के चुने हुओं
  rationale: मूल के धार्मिक पद और उसके सामूहिक बहुवचन को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: Κυρία
  choice: हे स्वामिनी
  rationale: सम्मानसूचक स्त्री-संबोधन और उसके प्राचीन गरिमामय स्वर को बनाए रखता है; केवल “महिला” मूल की संबोधन-शक्ति को घटा देता।
- source_word: μεταγράψωμαι
  choice: इसकी नकल कर लूँ
  rationale: पाठ को लिखकर उतारने का सीधा अर्थ है; “प्रतिलिपि बना लूँ” की अपेक्षा आम पाठक के लिए अधिक सहज है।
- source_word: ἀποδώσεις
  choice: लौटा देना
  rationale: पुस्तक लेने के बाद उसे वापस देने की आज्ञा/अपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: “परमेश्वर के चुने हुए” की पहचान
  choice: पद को “परमेश्वर के चुने हुओं” के रूप में खुला रखा गया
  alternative: इसे किसी विशिष्ट कलीसियाई या उद्धार-सिद्धान्त संबंधी समूह के रूप में स्पष्ट करना
  rationale: मूल पाठ इस समूह की सीमा या धर्मवैज्ञानिक परिभाषा नहीं देता, इसलिए अनुवाद में कोई सांप्रदायिक अर्थ नहीं जोड़ा गया।
- issue: वृद्धा की पहचान
  choice: केवल “वृद्धा” कहा गया
  alternative: उसे स्पष्ट रूप से कलीसिया या किसी अन्य प्रतीकात्मक सत्ता के रूप में पहचानना
  rationale: इस खंड में वक्ता उसे वृद्धा के रूप में देखता है; प्रतीकात्मक पहचान को मुख्य पाठ में आयात करना मूल की कथात्मक प्रस्तुति से आगे जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक वर्तमान काल को बनाए रखते हुए, सहज किंतु गरिमामय रखी गई है। प्रत्यक्ष कथन में सम्मानसूचक रूप अपनाया गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
