base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/001.yaml
  text: As I was going to Cumae at the same season as the year before, while walking I recalled last year’s vision, and again the Spirit lifts me up and carries me away to the same place as the year before.
translation:
  language: hi
  text: पिछले वर्ष के उसी समय, जब मैं कूमा जा रहा था, तो चलते-चलते मुझे पिछले वर्ष का दर्शन याद आया। फिर आत्मा ने मुझे उठा लिया और पिछले वर्ष की तरह उसी स्थान पर ले गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κούμας
  choice: कूमा
  rationale: स्थाननाम का प्रचलित यूनानी रूपानुसार लिप्यंतरण; यह इतालवी नगर Cumae है।
- source_word: κατὰ τὸν καιρὸν ὃν καὶ πέρυσι
  choice: पिछले वर्ष के उसी समय के आसपास
  rationale: κατά के कालगत प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है और ठीक उसी तिथि का अनावश्यक दावा नहीं करता।
- source_word: περιπατῶν
  choice: चलते-चलते
  rationale: समकालिक क्रिया को सहज आधुनिक हिन्दी में रखता है।
- source_word: ὁράσεως
  choice: दर्शन
  rationale: प्रकाशनात्मक vision के लिए प्रतिष्ठित, व्यापक रूप से बोधगम्य धार्मिक शब्द।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: मूल में लेख का अभाव है, फिर भी प्रसंग में सक्रिय आत्मिक सत्ता का संकेत है; हिन्दी में जानबूझकर 'पवित्र आत्मा' जोड़कर पहचान निश्चित नहीं की गई।
- source_word: αἴρει … καὶ ἀποφέρει
  choice: उठा लिया और … ले गया
  rationale: दोनों यूनानी क्रियाओं की क्रमिक गति और अलौकिक स्थानांतरण को बनाए रखता है।
theological_decisions:
- issue: πνεῦμα की पहचान
  choice: आत्मा
  alternative: पवित्र आत्मा / एक आत्मा
  rationale: यूनानी पाठ केवल πνεῦμα कहता है। 'पवित्र' जोड़ना मूल से अधिक विशिष्ट होगा, जबकि 'एक आत्मा' हिन्दी में अनावश्यक अनिश्चितता ला सकता है।
- issue: वर्णन का काल
  choice: हिन्दी भूतकाल
  alternative: ऐतिहासिक वर्तमान ('उठाता है', 'ले जाता है')
  rationale: यूनानी में आरंभिक भूतकालीन कथन के बाद जीवंत ऐतिहासिक वर्तमान है; आधुनिक हिन्दी में एकसमान भूतकाल अधिक स्वाभाविक है और घटना का अर्थ नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य-विन्यास मूल की क्रमिकता को सुरक्षित रखते हुए हिन्दी पाठक के लिए सहज बनाया गया है; अनावश्यक सांप्रदायिक शब्दावली से बचा गया है।
