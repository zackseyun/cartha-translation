base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/003.yaml
  text: I asked her, saying, “Lady, to what place in the field?” “Wherever you wish,” she says. I chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will come there where you wish.”
translation:
  language: hi
  text: मैंने उससे पूछा, “स्वामिनी, खेत में किस जगह?” उसने कहा, “जहाँ तुम चाहो।” मैंने एक अच्छी, एकांत जगह चुन ली। पर उससे बात करने और उसे वह जगह बताने से पहले ही उसने मुझसे कहा, “मैं वहीं आऊँगी जहाँ तुम चाहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: हे स्वामिनी
  rationale: यह सम्मानसूचक प्रत्यक्ष संबोधन है; ‘स्वामिनी’ मूल के स्त्रीलिंग अधिकार-सूचक भाव को बनाए रखता है और प्रसंग में उस वृद्धा के प्रति आदर प्रकट करता है।
- source_word: ἀγροῦ
  choice: खेत
  rationale: ἀγρός यहाँ उस ग्रामीण भू-भाग या खेत को दर्शाता है जहाँ हर्मास जाता था; सरल और स्वाभाविक हिन्दी के लिए ‘खेत’ उपयुक्त है।
- source_word: τόπον καλὸν ἀνακεχωρηκότα
  choice: एक अच्छी, एकांत जगह
  rationale: καλόν का ‘अच्छी’ और ἀνακεχωρηκότα का लोगों से अलग, निर्जन या एकांत स्थान का भाव रखा गया है।
- source_word: Ἥξω ἐκεῖ ὅπου θέλεις
  choice: जहाँ तुम चाहते हो, मैं वहीं आऊँगी
  rationale: ἐκεῖ और ὅπου के स्थान-संबंध को स्वाभाविक हिन्दी में ‘जहाँ…वहीं’ से स्पष्ट किया गया है, बिना कथन का आशय बढ़ाए।
