translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। प्रत्यक्ष वचन और वर्तमानकालीन ‘उसने कहा’ मूल के जीवंत ऐतिहासिक वर्तमान φησίν/λέγει का कुछ प्रभाव बनाए रखते हैं। कोई पाद-टिप्पणी आवश्यक नहीं है।
