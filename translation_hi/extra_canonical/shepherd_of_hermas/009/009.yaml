base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/009.yaml
  text: So when I wanted to sit on the right side, she did not permit me, but motioned to me with her hand that I should sit on the left side. So as I reasoned and was grieved that she had not allowed me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side belongs to others—those who have already pleased God and suffered for the sake of the Name; but you lack many things to sit with them. But as you remain in your simplicity, remain, and you will sit with them, as will all who do their works and endure what they also endured.”
translation:
  language: hi
  text: इसलिए जब मैं दाहिनी ओर बैठना चाहता था, तो उसने मुझे अनुमति नहीं दी, बल्कि हाथ से संकेत किया कि मैं बाईं ओर बैठूँ। तब मैं मन ही मन विचार करने लगा और दुखी हुआ कि उसने मुझे दाहिनी ओर बैठने नहीं दिया। उसने मुझसे कहा, “हेर्मास, क्या तुम दुखी हो? दाहिनी ओर का स्थान दूसरों के लिए है—उनके लिए जिन्होंने पहले ही परमेश्वर को प्रसन्न किया है और उस नाम के कारण दुःख सहा है। पर उनके साथ बैठने के लिए तुम्हें अभी बहुत कुछ चाहिए। फिर भी, अपनी निष्कपटता में बने रहो, और तुम उनके साथ बैठोगे; और जितने लोग उनके जैसे काम करेंगे और वही सहेंगे जो उन्होंने सहा, वे भी उनके साथ बैठेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ δεξιὰ μέρη / τὰ ἀριστερὰ μέρη
  choice: दाहिनी ओर / बाईं ओर
  rationale: स्थान-संबंधी यूनानी अभिव्यक्ति को स्वाभाविक और स्पष्ट हिन्दी में रखा गया है।
- source_word: εὐαρεστηκότων τῷ θεῷ
  choice: जिन्होंने पहले ही परमेश्वर को प्रसन्न किया है
  rationale: पूर्णकालिक भाव और परमेश्वर के प्रति प्रसन्नताजनक आचरण दोनों सुरक्षित रहते हैं।
- source_word: εἵνεκα τοῦ ὀνόματος
  choice: उस नाम के कारण
  rationale: मूल में केवल ‘नाम’ है; उसका संदर्भ स्पष्ट किए बिना लेख सहित अनूदित किया गया, ताकि मूल का धार्मिक संकेत और संक्षिप्तता बनी रहे।
- source_word: ἁπλότητί
  choice: निष्कपटता
  rationale: यहाँ सरलता, सच्चाई और कपटहीनता के नैतिक भाव को ‘निष्कपटता’ सबसे सहज रूप से व्यक्त करता है।
- source_word: ὑπενέγκωσιν
  choice: सहेंगे
  rationale: कष्टों को धैर्यपूर्वक सहने का भाव संक्षिप्त, आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘उस नाम’ की पहचान
  choice: ‘उस नाम’ को बिना विस्तार के रखा गया
  alternative: ‘प्रभु के नाम’ या ‘यीशु के नाम’
  rationale: यूनानी पाठ में τοῦ ὀνόματος है; अनुवाद में स्पष्ट पहचान जोड़ना मूल की सांकेतिक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: दाहिनी ओर बैठने की योग्यता
  choice: ‘तुममें अभी बहुत-सी बातें कम हैं’
  alternative: ‘तुम अभी बहुत पीछे हो’ या विशिष्ट सद्गुणों की सूची
  rationale: मूल πολλὰ λείπει सामान्य और खुला है; उसे किसी निश्चित योग्यता या सिद्धांत से नहीं बाँधा गया।
- issue: भविष्य में उनके साथ बैठना
  choice: शर्त-सदृश प्रोत्साहन के रूप में प्रस्तुत किया गया
  alternative: तत्काल सुनिश्चित पद या केवल कर्मों द्वारा उद्धार का कथन
  rationale: पाठ निष्कपटता में बने रहने, समान कर्म करने और समान दुःख सहने को साथ रखता है; अनुवाद इस तनाव को बिना व्यवस्थित धर्मशास्त्रीय निष्कर्ष थोपे बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। संवाद की आत्मीयता और दर्शनात्मक प्रसंग को बनाए रखने के लिए ‘तुम’ का प्रयोग किया गया है। ‘हेर्मास’ यूनानी नाम Ἑρμᾶ का निकट देवनागरी रूप है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
