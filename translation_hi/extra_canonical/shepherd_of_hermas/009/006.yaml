base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/006.yaml
  text: And she came with six young men—whom I had seen also before—and she stood by me and listened while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas, stop asking everything about your sins; ask also about righteousness, so that you may receive some share of it for your household.”
translation:
  language: hi
  text: और वह उन छह युवकों के साथ आई, जिन्हें मैं पहले भी देख चुका था। वह मेरे पास खड़ी हो गई और जब मैं प्रार्थना कर रहा था तथा प्रभु के सामने अपने पापों को स्वीकार कर रहा था, तब वह ध्यान से सुनती रही। फिर उसने मुझे छूकर कहा, “हरमास, अपने पापों के बारे में हर बात पूछना बंद करो; धार्मिकता के बारे में भी पूछो, ताकि उसमें से कुछ अंश तुम्हारे घराने को मिले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατηκροᾶτο
  choice: ध्यान से सुनती रही
  rationale: यह क्रिया ध्यानपूर्वक सुनने का भाव रखती है; केवल ‘सुना’ की अपेक्षा यह ग्रीक के बल को अधिक स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἐξομολογουμένου ... τὰς ἁμαρτίας μου
  choice: अपने पापों को स्वीकार कर रहा था
  rationale: यहाँ क्रिया प्रभु के सामने पाप मान लेने या उनका अंगीकार करने को दर्शाती है; ‘स्वीकार करना’ आधुनिक सामान्य हिन्दी में स्पष्ट और गैर-सांप्रदायिक है।
- source_word: ἐρωτῶν / ἐρώτα
  choice: माँगना / माँगो
  rationale: प्रार्थना के संदर्भ और उद्देश्यतः कुछ प्राप्त करने के उल्लेख के कारण यहाँ ‘पूछना’ के बजाय ‘माँगना’ अधिक उपयुक्त है, यद्यपि ग्रीक क्रिया दोनों अर्थ रख सकती है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह नैतिक और परमेश्वर-संबंधी ‘righteousness’ को व्यक्त करने वाला स्थापित, किंतु समझने योग्य हिन्दी पद है; ‘न्याय’ यहाँ अर्थ को अनावश्यक रूप से विधिक बना देता।
- source_word: οἶκόν σου
  choice: तुम्हारे घराने
  rationale: οἶκος केवल भवन नहीं, परिवार या गृहस्थ समुदाय को भी दर्शाता है। इस संदर्भ में ‘घराना’ उस सामूहिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: पापों के विषय में माँगने और धार्मिकता माँगने का संबंध
  choice: ‘ही’ और ‘भी’ के माध्यम से विरोधाभास नहीं, बल्कि प्राथमिकता के सुधार को व्यक्त किया गया
  alternative: इसे पापों के लिए प्रार्थना पूरी तरह बंद करने की आज्ञा के रूप में अनूदित करना
  rationale: ग्रीक παῦσαι ... πάντα ἐρωτῶν का वाक्य-विन्यास कठिन है, और अगला ἐρώτα καὶ धार्मिकता के विषय को भी प्रार्थना में शामिल करने पर बल देता है। अनुवाद उस तनाव को बनाए रखता है और क्षमा की प्रार्थना निषिद्ध होने का कठोर धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: धार्मिकता का अंश घराने को मिलना
  choice: मूल रूपक ‘कुछ अंश’ और सामूहिक ‘घराना’ बनाए रखा गया
  alternative: इसे व्यक्तिगत नैतिक सुधार या परिवार के उद्धार के रूप में स्पष्ट करना
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि अंश किस प्रकार प्राप्त होगा; अतः व्याख्यात्मक धर्मवैज्ञानिक विस्तार से बचा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। प्रत्यक्ष वचन में आत्मीय किंतु सम्मानजनक ‘तुम’ का प्रयोग है। नाम Ἑρμᾶ को ‘हरमास’ रूप में लिप्यंतरित किया गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में भी कोई पाद-टिप्पणी चिह्न नहीं है।
