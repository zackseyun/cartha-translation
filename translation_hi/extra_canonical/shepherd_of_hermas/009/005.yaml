base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/005.yaml
  text: Seeing these things set there and no one in the place, I was astonished, and a tremor, as it were, seized me, and my hair stood on end; and a shudder, as it were, came upon me, since I was alone. Then, coming to myself and remembering the glory of God, and taking courage, I knelt and again confessed my sins to the Lord, as before.
translation:
  language: hi
  text: इन वस्तुओं को वहाँ रखा देखकर और उस स्थान पर किसी को न पाकर मैं स्तब्ध रह गया। मानो कंपकंपी ने मुझे जकड़ लिया, मेरे रोंगटे खड़े हो गए, और अकेला होने के कारण मुझ पर मानो सिहरन छा गई। तब मैंने अपने आपको सँभाला, परमेश्वर की महिमा को स्मरण किया और साहस बटोरा। फिर घुटने टेककर मैंने पहले की तरह एक बार फिर प्रभु के सामने अपने पाप स्वीकार किए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκθαμβος ἐγενόμην
  choice: मैं स्तब्ध रह गया
  rationale: यह पद तीव्र विस्मय और घबराहट व्यक्त करता है; ‘स्तब्ध’ आधुनिक हिन्दी में दोनों भावों को स्वाभाविक रूप से समेटता है।
- source_word: ὡσεί τρόμος με ἔλαβεν
  choice: मानो कंपकंपी ने मुझे जकड़ लिया
  rationale: मूल के उपमासूचक ὡσεί को ‘मानो’ से बनाए रखते हुए τρόμος के शारीरिक भय-कंपन को व्यक्त किया गया है।
- source_word: αἱ τρίχες μου ὀρθαί
  choice: मेरे रोंगटे खड़े हो गए
  rationale: शाब्दिक अर्थ ‘मेरे बाल खड़े हो गए’ है; हिन्दी का प्रचलित मुहावरा उसी शारीरिक प्रतिक्रिया को अधिक स्वाभाविक ढंग से बताता है।
- source_word: ὡσεί φρίκη μοι προσῆλθεν
  choice: मुझ पर मानो सिहरन छा गई
  rationale: φρίκη भय से उत्पन्न सिहरन या रोमांच है; ‘मानो’ मूल की अभिव्यक्त सावधानी को सुरक्षित रखता है।
- source_word: ἐν ἐμαυτῷ οὖν γενόμενος
  choice: तब मैंने अपने आपको सँभाला
  rationale: मुहावरे का आशय भय या विस्मय के बाद होश और आत्मसंयम लौटना है।
- source_word: ἐξωμολογούμην ... τὰς ἁμαρτίας μου
  choice: मैंने ... अपने पाप स्वीकार किए
  rationale: यहाँ क्रिया का कर्म स्पष्टतः ‘अपने पाप’ है, इसलिए ‘स्वीकार करना’ प्रसंगानुकूल और धार्मिक रूप से तटस्थ है।
theological_decisions:
- issue: τῆς δόξης τοῦ Θεοῦ का अर्थ
  choice: परमेश्वर की महिमा को स्मरण किया
  alternative: परमेश्वर की प्रतापमयी उपस्थिति को याद किया
  rationale: मूल सामान्य रूप से ‘परमेश्वर की महिमा’ कहता है; इसे किसी विशेष प्रकार की दिव्य उपस्थिति के रूप में स्पष्ट करना अनावश्यक व्याख्या होती।
- issue: प्रभु के सामने पाप स्वीकार करना
  choice: प्रभु के सामने अपने पाप स्वीकार किए
  alternative: प्रभु से अपने पापों की क्षमा माँगी
  rationale: मूल में पापों का अंगीकार है, क्षमा की याचना स्पष्ट रूप से नहीं कही गई; इसलिए उसे जोड़ा नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भय की क्रमिक शारीरिक प्रतिक्रियाओं—कंपकंपी, रोंगटे और सिहरन—को अलग-अलग बनाए रखा गया है। मूल के दोनों ὡσεί को ‘मानो’ से सुरक्षित रखा गया है।
