base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/002.yaml
  text: 'After fasting many times and pleading with the Lord to make known to me the revelation he had promised to show me through that aged woman, on that very night the aged woman appeared to me and said: “Since you are so needy and so eager to know everything, come to the field where you stay, and about the fifth hour I will appear to you and show you what you must see.”'
translation:
  language: hi
  text: बहुत बार उपवास करने और प्रभु से यह विनती करने के बाद कि वह मुझे उस प्रकाशना का ज्ञान कराए जिसे उसने उस वृद्धा के द्वारा मुझे दिखाने की प्रतिज्ञा की थी, उसी रात वह वृद्धा मुझे दिखाई दी और उसने मुझसे कहा, “चूँकि तुम इतने अभावग्रस्त और सब कुछ जानने के लिए इतने उत्सुक हो, उस खेत में आओ जहाँ तुम ठहरते हो। लगभग पाँचवें घंटे मैं तुम्हें दिखाई दूँगी और तुम्हें वह दिखाऊँगी जो तुम्हें देखना आवश्यक है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεηθείς
  choice: विनती करने
  rationale: यह कृदन्त प्रभु से आग्रहपूर्वक प्रार्थना करने का भाव रखता है; ‘विनती’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀποκάλυψιν
  choice: प्रकाशना
  rationale: दिव्य रूप से प्रकट की जाने वाली बात या दर्शन के अर्थ को बनाए रखता है और केवल सामान्य ‘भेद खोलने’ तक सीमित नहीं करता।
- source_word: πρεσβυτέρας
  choice: वृद्धा
  rationale: यहाँ शब्द उस पहले से परिचित वृद्ध स्त्री के लिए संज्ञात्मक रूप में प्रयुक्त है; ‘वृद्धा’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐνδεὴς
  choice: अभावग्रस्त
  rationale: ग्रीक शब्द का मूल अर्थ ‘कमी या अभाव में होना’ है। संदर्भ में इसका आशय पूरी तरह स्पष्ट नहीं है, इसलिए इसे ‘उत्सुक’ या ‘ज़रूरतमंद’ में विलीन नहीं किया गया।
- source_word: σπουδαῖος
  choice: उत्सुक
  rationale: इस संदर्भ में सब कुछ जानने की गंभीर लगन और तत्परता व्यक्त करता है।
- source_word: ἀγρὸν ὅπου χρονίζεις
  choice: उस खेत में ... जहाँ तुम ठहरते हो
  rationale: χρονίζεις के वहाँ समय बिताने या ठहरने के भाव को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: περὶ ὥραν πέμπτην
  choice: लगभग पाँचवें घंटे
  rationale: प्राचीन समय-संकेत को बदले बिना περὶ की अनुमानसूचकता बनाए रखी गई है।
- source_word: ἃ δεῖ σε ἰδεῖν
  choice: वह ... जो तुम्हें देखना आवश्यक है
  rationale: δεῖ की अनिवार्यता को स्पष्ट रखा गया है, उसे केवल भविष्यवाणी ‘जो तुम देखोगे’ में नहीं बदला गया।
theological_decisions:
- issue: प्रकाशना किसके द्वारा दिखाई जाती है
  choice: ‘जिसे उसने उस वृद्धा के द्वारा मुझे दिखाने की प्रतिज्ञा की थी’
  alternative: ‘जिसे उस वृद्धा ने मुझे दिखाने की प्रतिज्ञा की थी’
  rationale: ἐπηγγείλατο का कर्ता व्याकरणतः पूर्ववर्ती ‘प्रभु’ समझा गया है, जबकि διὰ τῆς πρεσβυτέρας वृद्धा को माध्यम बताता है। इससे वृद्धा को स्वतंत्र दिव्य स्रोत नहीं बनाया गया।
- issue: ἐνδεὴς का अस्पष्ट अर्थ
  choice: अभावग्रस्त
  alternative: ज़रूरतमंद / बहुत इच्छुक
  rationale: शब्द की वास्तविक असामान्यता और अर्थगत तनाव को बनाए रखा गया है; अगले विशेषण σπουδαῖος से आने वाले ‘उत्सुक’ भाव को इसमें मिलाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली अपनाई गई है। वाक्य की दीर्घ ग्रीक संरचना को पठनीय हिन्दी में रखा गया है, पर कारण, प्रतिज्ञा, माध्यम और समय-संकेत के संबंध सुरक्षित हैं। ‘पाँचवें घंटे’ को आधुनिक घड़ी के समय में नहीं बदला गया, क्योंकि स्रोत स्वयं प्राचीन घंटा-गणना का संकेत देता है।
