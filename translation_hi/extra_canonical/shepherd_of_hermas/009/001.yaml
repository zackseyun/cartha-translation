translation:
  language: hi
  text: भाइयो, मैंने जो दर्शन देखा, वह इस प्रकार था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यह प्रत्यक्ष संबोधन है; आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण बहुवचन संबोधन।
- source_word: τοιαύτη
  choice: इस प्रकार था
  rationale: यह आगे आने वाले दर्शन-विवरण की ओर संकेत करता है; हिन्दी में सहज परिचयात्मक अभिव्यक्ति।
- source_word: ἣν εἶδον
  choice: मैंने जो दर्शन देखा
  rationale: ग्रीक में संज्ञा पूर्ववर्ती संदर्भ से समझी जाती है; पाठक-खंड को स्वतंत्र और स्पष्ट रखने के लिए ‘दर्शन’ को व्यक्त किया गया है।
