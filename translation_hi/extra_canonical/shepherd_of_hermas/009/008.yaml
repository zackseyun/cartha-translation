  text: And after the young men withdrew and we were alone, she says to me, “Sit here.” I say to her, “Lady, let the elders sit first.” “What I tell you,” she says, “sit.”
translation:
  language: hi
  text: जब वे युवक चले गए और हम अकेले रह गए, तो वह मुझसे बोली, “यहाँ बैठो।” मैंने उससे कहा, “स्वामिनी, पहले बुज़ुर्गों को बैठने दीजिए।” वह बोली, “जो मैं तुमसे कहती हूँ, बैठो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκους
  choice: युवक
  rationale: यह शब्द पहले उल्लिखित छह युवा पुरुषों को सूचित करता है; आधुनिक हिन्दी में ‘युवक’ स्वाभाविक और स्पष्ट है।
- source_word: Κυρία
  choice: स्वामिनी
  rationale: यह आदरसूचक संबोधन है। ‘स्वामिनी’ स्त्री के प्रति सम्मान और उसके प्राधिकार—दोनों को व्यक्त करता है, बिना उसे ‘देवी’ जैसा धार्मिक अर्थ दिए।
- source_word: πρεσβυτέρους
  choice: प्राचीन जनों
  rationale: संदर्भ में बहुवचन का आशय आयु या वरिष्ठता में बड़े लोगों से हो सकता है। ‘प्राचीन जन’ इस अर्थ को खुला रखता है और अनावश्यक रूप से किसी कलीसियाई पद को निश्चित नहीं करता।
- source_word: Ὅ σοι λέγω ... κάθισον
  choice: जो मैं तुमसे कहती हूँ, वही करो—बैठो
  rationale: ग्रीक वाक्य की आग्रहपूर्ण, आदेशात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है; केवल शब्दशः रचना हिन्दी में असहज होती।
theological_decisions:
- issue: πρεσβυτέρους का अर्थ पदाधिकारी ‘प्राचीन’ है या सामान्य वरिष्ठ/बुज़ुर्ग
  choice: प्राचीन जनों
  alternative: प्राचीनों / बुज़ुर्गों
  rationale: मूल पाठ स्वयं यहाँ किसी औपचारिक कलीसियाई पद को स्पष्ट नहीं करता। चुना हुआ रूप वरिष्ठता का भाव रखता है, पर पद-संबंधी अर्थ को थोपता नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। प्रत्यक्ष कथन में स्त्री के प्राधिकारपूर्ण स्वर तथा हरमास के आदरपूर्ण उत्तर को सुरक्षित रखा गया है।
