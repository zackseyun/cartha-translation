  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल के ऐतिहासिक वर्तमान ‘ले जाती है/कहती है’ को स्वाभाविक हिन्दी कथन के लिए भूतकाल में व्यक्त किया गया है; अर्थ में कोई धर्मवैचारिक विस्तार नहीं जोड़ा गया।
