translation:
  language: hi
  text: फिर उसने हाथ पकड़कर मुझे उठाया और उस आसन तक ले गई। उसने उन युवकों से कहा, “जाओ और निर्माण करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήγειρέ με τῆς χειρός
  choice: मेरा हाथ पकड़कर मुझे उठाया
  rationale: यूनानी वाक्यांश का स्वाभाविक हिन्दी रूप; इसमें हाथ के सहारे उठाने की क्रिया सुरक्षित रहती है।
- source_word: συμπέλιον
  choice: आसन
  rationale: यह दुर्लभ शब्द संदर्भ में बैठने या लेटने के लिए रखे सुसज्जित फर्नीचर को सूचित करता है। ‘आसन’ अनिश्चितता को अनावश्यक रूप से पलंग या सोफ़ा तक सीमित नहीं करता।
- source_word: νεανίσκοις
  choice: जवानों
  rationale: यह बहुवचन युवा पुरुषों को दर्शाता है; आधुनिक हिन्दी में ‘जवानों’ सहज और स्पष्ट है।
- source_word: οἰκοδομεῖτε
  choice: निर्माण करो
  rationale: क्रिया का कर्म मूल पाठ में नहीं दिया गया है; ‘निर्माण करो’ उसी खुलेपन को बनाए रखता है।
