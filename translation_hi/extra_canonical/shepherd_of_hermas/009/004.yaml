translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथन की गति बनाए रखने के लिए यूनानी ऐतिहासिक वर्तमान को हिन्दी के स्वाभाविक भूतकाल में व्यक्त किया गया है। ‘भाइयो’ आरंभिक मसीही समुदाय को किए गए सीधे संबोधन को बनाए रखता है।
