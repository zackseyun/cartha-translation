  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/004.yaml
  text: So I went, brothers, into the field, and I counted the hours, and I came to the place where I had directed her to come; and I see an ivory couch set there, and upon the couch there lay a linen pillow, and on top a spread-out towel of fine linen.
translation:
  language: hi
  text: इसलिए, भाइयो, मैं खेत में गया और घंटे गिने। फिर मैं उस स्थान पर पहुँचा, जिसे मैंने उसके आने के लिए निर्धारित किया था। वहाँ मुझे हाथीदाँत का एक आसन रखा हुआ दिखाई दिया। उस आसन पर सन का एक तकिया रखा था, और उसके ऊपर महीन सन का एक कपड़ा बिछा हुआ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन दुर्लभ यूनानी शब्दों का सटीक अर्थ निश्चित नहीं है। ‘तकिया’ का अर्थ छोटी गद्दी भी हो सकता है, और ‘कपड़ा’ बिछावन या तौलिये-जैसा वस्त्र भी हो सकता है।
    reason: फर्नीचर और वस्त्रों से संबंधित दुर्लभ शब्दों की वास्तविक शाब्दिक अनिश्चितता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: συνεψήφισα τὰς ὥρας
  choice: मैंने समय का हिसाब लगाया
  rationale: वाक्यांश का शाब्दिक अर्थ घंटों को गिनना या उनका हिसाब लगाना है; आधुनिक हिन्दी में यह उस निर्धारित समय की गणना करने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: συμπέλιον ἐλεφάντινον
  choice: हाथीदाँत की एक चौकी
  rationale: यह दुर्लभ संज्ञा बैठने या लेटने के फर्नीचर को दर्शाती है। आगे दोनों पात्र इसी पर बैठते हैं, इसलिए ‘चौकी’ हिन्दी में ‘पलंग’ की अपेक्षा प्रसंगानुकूल और सहज है।
- source_word: κεβριδάριον λινόῦν
  choice: सन के कपड़े की एक छोटी गद्दी
  rationale: दुर्लभ लघु रूप किसी छोटे गद्देदार सहारे या तकिये की ओर संकेत करता है; ‘छोटी गद्दी’ उसके आकार और उपयोग को अनावश्यक निश्चितता के बिना व्यक्त करती है।
- source_word: λεντίον ... λινόῦν καρπάσιον
  choice: महीन कपड़े की एक चादर
  rationale: λεντίον कपड़े या तौलिये जैसे बिछाए जाने वाले वस्त्र को और καρπάσιον महीन वस्त्र को सूचित करता है। दृश्य में उसके फैलाकर बिछाए जाने के कारण ‘चादर’ स्वाभाविक है।
