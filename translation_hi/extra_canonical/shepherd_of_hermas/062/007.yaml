base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/007.yaml
  text: “Who then, Sir,” I say, “are the ones who are crowned and go into the tower?”
translation:
  language: hi
  text: “तो फिर, महोदय,” मैंने कहा, “वे कौन हैं जिन्हें मुकुट पहनाया गया है और जो मीनार के भीतर जा रहे हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: महोदय
  rationale: यहाँ यह सम्मानसूचक प्रत्यक्ष संबोधन है; ‘महोदय’ आधुनिक हिन्दी में गरिमापूर्ण है और अनावश्यक रूप से इसे ईश्वरीय उपाधि नहीं बनाता।
- source_word: ἐστεφανωμένοι
  choice: जिन्हें मुकुट पहनाए गए हैं
  rationale: पूर्ण निष्क्रिय कृदन्त का भाव सुरक्षित रखते हुए मुकुट दिए या पहनाए जाने की क्रिया व्यक्त की गई है।
- source_word: εἰς τὸν πύργον ὑπάγοντες
  choice: मीनार के भीतर जा रहे हैं
  rationale: εἰς की भीतर की ओर गति और वर्तमान कृदन्त की जारी क्रिया दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: φημί
  choice: मैंने कहा
  rationale: मूल क्रिया का अर्थ ‘कहना’ है; हिन्दी कथावाचन में भूतकाल प्रसंग के अनुरूप स्वाभाविक है, जबकि प्रश्नवाचक वाक्य स्वयं पूछने का भाव स्पष्ट करता है।
theological_decisions:
- issue: κύριε को ईश्वरीय उपाधि मानना या सम्मानसूचक संबोधन
  choice: महोदय
  alternative: प्रभु
  rationale: इस संवाद में संबोधित पात्र के लिए शब्द सम्मानसूचक रूप में प्रयुक्त है; ‘प्रभु’ चुनने से उसकी पहचान या दिव्यता के बारे में मूल से अधिक निश्चितता आ सकती थी।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की प्रत्यक्ष संवाद-रचना तथा मूल यूनानी का प्रश्नात्मक स्वर सुरक्षित है।
