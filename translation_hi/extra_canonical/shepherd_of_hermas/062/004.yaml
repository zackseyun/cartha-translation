base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/004.yaml
  text: “You see the rods of each person; for the rods are the law. You see, then, many rods made worthless; and you will recognize all those who have not kept the law, and you will see the dwelling of each one.”
translation:
  language: hi
  text: “तुम प्रत्येक व्यक्ति की छड़ियाँ देखते हो; क्योंकि छड़ियाँ व्यवस्था हैं। इसलिए तुम बहुत-सी छड़ियों को बेकार हो चुकी देखते हो; और तुम उन सबको पहचान लोगे जिन्होंने व्यवस्था का पालन नहीं किया है, और तुम प्रत्येक व्यक्ति का निवास-स्थान देखोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: छड़ियाँ
  rationale: दृश्य में दी गई वास्तविक छड़ियों का बिंब बनाए रखता है; ‘डंडे’ की अपेक्षा अधिक स्वाभाविक और तटस्थ है।
- source_word: νόμος
  choice: व्यवस्था
  rationale: ईश्वर से प्राप्त आधिकारिक नियम या विधान का धार्मिक अर्थ व्यक्त करता है और प्रसंग में छड़ियों के प्रतीकात्मक आशय को बनाए रखता है।
- source_word: ἠχρειωμένας
  choice: बेकार हुई
  rationale: पूर्ण कृदंत का परिणामी भाव सुरक्षित रखता है और छड़ियों के अनुपयोगी या निकम्मा हो जाने का अर्थ सहज हिन्दी में देता है।
- source_word: γνώσῃ
  choice: पहचान लोगे
  rationale: भविष्यकाल तथा लोगों की दशा को उनके द्वारा दी गई छड़ियों से पहचानने का प्रसंगगत अर्थ व्यक्त करता है।
- source_word: κατοικίαν
  choice: निवास-स्थान
  rationale: शब्द के मूल स्थानवाची अर्थ को बनाए रखता है और व्यक्ति के अंतिम ठिकाने के संभावित संकेत को बिना स्पष्ट रूप से तय किए खुला छोड़ता है।
theological_decisions:
- issue: छड़ियों और व्यवस्था की पहचान
  choice: “ये छड़ियाँ व्यवस्था हैं”
  alternative: “हर छड़ी व्यवस्था को दर्शाती है”
  rationale: यूनानी का सीधा विधेयात्मक कथन बनाए रखा गया है; प्रतीक को केवल सामान्य ‘प्रतिनिधित्व’ कहकर कमजोर नहीं किया गया।
- issue: κατοικίαν का आशय
  choice: “हर एक का निवास-स्थान”
  alternative: “हर एक का अंतिम ठिकाना”
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि यह सांसारिक स्थान, नियत वर्ग या अंतिम गंतव्य है; इसलिए धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
- issue: व्यवस्था का पालन न करना
  choice: “जिन्होंने व्यवस्था का पालन नहीं किया”
  alternative: “जिन्होंने व्यवस्था की रक्षा नहीं की”
  rationale: τηρέω में संभालकर रखने और पालन करने दोनों का भाव है; इस नैतिक संदर्भ में ‘पालन’ आधुनिक हिन्दी में सबसे स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। मूल की पुनरावृत्ति—‘तुम देखते हो’ और ‘हर एक’—को विचार-प्रवाह तथा प्रतीकात्मक बल बनाए रखने के लिए काफी हद तक सुरक्षित रखा गया है। किसी फुटनोट की आवश्यकता नहीं पड़ी।
