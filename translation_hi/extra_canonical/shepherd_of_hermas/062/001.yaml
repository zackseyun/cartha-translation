base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/001.yaml
  text: I say to him, “Sir, make known to me what this tree is; for I am perplexed about it, because, though so many branches have been cut off, the tree is sound, and nothing appears to have been cut away from it. About this, therefore, I am at a loss.”
translation:
  language: hi
  text: मैं उससे कहता हूँ, “स्वामी, मुझे बताइए कि यह वृक्ष क्या है। मैं इसके विषय में असमंजस में हूँ, क्योंकि इतनी सारी डालियाँ काटे जाने पर भी वृक्ष सही-सलामत है और ऐसा दिखाई नहीं देता कि उसमें से कुछ भी काटा गया हो। इसलिए मैं इस बात को समझ नहीं पा रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: स्वामी
  rationale: यहाँ संबोधन वार्ताकार के प्रति आदर प्रकट करता है। ‘स्वामी’ आदरसूचक अर्थ बनाए रखता है, पर इसे अनिवार्य रूप से परमेश्वर के लिए प्रयुक्त उपाधि नहीं बनाता।
- source_word: δένδρον
  choice: वृक्ष
  rationale: दृष्टांत के केंद्रीय प्रतीक के लिए स्पष्ट, dignified और आधुनिक मानक हिन्दी का शब्द।
- source_word: ἀποροῦμαι
  choice: असमंजस में हूँ / समझ नहीं पा रहा हूँ
  rationale: यूनानी क्रिया की पुनरावृत्ति को हिन्दी में दो स्वाभाविक अभिव्यक्तियों से रखा गया है; दोनों उलझन और उत्तर न सूझने का भाव व्यक्त करती हैं।
- source_word: κλάδων
  choice: डालियाँ
  rationale: पेड़ से काटी गई शाखाओं के लिए सामान्य पाठक को सहज समझ आने वाला शब्द।
- source_word: ὑγιές
  choice: सही-सलामत
  rationale: शाब्दिक ‘स्वस्थ’ की अपेक्षा पेड़ के अक्षुण्ण और अप्रभावित दिखाई देने का भाव अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: Κύριε संबोधन की पहचान
  choice: स्वामी
  alternative: प्रभु / महोदय
  rationale: संदर्भ में वक्ता एक दूत-सदृश वार्ताकार को संबोधित कर रहा है। ‘स्वामी’ सम्मान बनाए रखता है और संबोधन को बिना आधार सीधे दिव्य उपाधि के रूप में निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, आदरपूर्ण और कथात्मक रखी गई है। यूनानी वर्तमानकालीन कथन ‘मैं उससे कहता हूँ’ को बनाए रखा गया है, और मूल में असमंजस की दोहरी अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
