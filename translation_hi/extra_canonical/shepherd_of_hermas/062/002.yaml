base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/002.yaml
  text: “Listen,” he says. “This great tree that covers plains and mountains and the whole earth is the law of God given to the whole world. And this law is the Son of God, proclaimed to the ends of the earth; and the peoples under the shade are those who heard the proclamation and believed in him.
translation:
  language: hi
  text: वह कहता है, “सुनो। यह विशाल वृक्ष, जो मैदानों, पहाड़ों और सारी पृथ्वी को छाया देता है, परमेश्वर की व्यवस्था है, जो सारे संसार को दी गई है। और यह व्यवस्था परमेश्वर का पुत्र है, जिसका प्रचार पृथ्वी के छोरों तक किया गया है। छाया के नीचे के लोग वे हैं जिन्होंने इस प्रचार को सुना और उस पर विश्वास किया।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “उस पर” का सर्वनाम पुल्लिंग है और सबसे स्वाभाविक रूप से “परमेश्वर का पुत्र” की ओर संकेत करता है, न कि नपुंसकलिंग “प्रचार” की ओर।
    reason: निकटवर्ती संज्ञाओं के कारण हिन्दी पाठक सर्वनाम को ‘प्रचार’ से जोड़ सकता है; मूल की व्याकरणिक सूचना स्पष्ट करना उपयोगी है।
lexical_decisions:
- source_word: σκεπάζον
  choice: छाया देता है
  rationale: संदर्भ में वृक्ष द्वारा भूभाग को ढकने के साथ आश्रयकारी छाया का भाव है; आगे σκέπην ‘छाया’ आने से यह शब्दावली स्वाभाविक और सुसंगत रहती है।
- source_word: νόμος Θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: νόμος के धार्मिक और निर्देशात्मक अर्थ को आधुनिक मानक हिन्दी में ‘व्यवस्था’ ठीक प्रकार व्यक्त करती है।
- source_word: κηρυχθεὶς / κηρύγματος
  choice: प्रचार किया गया / प्रचार
  rationale: दोनों सजातीय यूनानी पदों का संबंध हिन्दी में बनाए रखा गया है और सार्वजनिक घोषणा का भाव सुरक्षित है।
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: उस पर विश्वास किया
  rationale: पुल्लिंग αὐτόν का निकटतम व्याकरणिक पूर्वपद ‘परमेश्वर का पुत्र’ है; ‘उस पर’ हिन्दी में उस पुरुष-संदर्भ को बनाए रखता है।
theological_decisions:
- issue: ‘व्यवस्था’ और ‘परमेश्वर का पुत्र’ की पहचान
  choice: मूल के सीधे कथन ‘यह व्यवस्था परमेश्वर का पुत्र है’ को यथावत रखा गया।
  alternative: व्याख्यात्मक रूप से व्यवस्था को पुत्र की शिक्षा, वचन या अधिकार बताना।
  rationale: यूनानी पाठ स्पष्ट पहचानसूचक ἐστίν का प्रयोग करता है; धार्मिक तनाव को किसी बाद की व्यवस्थित व्याख्या से हल करना उचित नहीं।
- issue: विश्वास का संदर्भ
  choice: ‘उस पर विश्वास किया’ रखा गया।
  alternative: ‘उस प्रचार पर विश्वास किया’।
  rationale: αὐτόν पुल्लिंग है, जबकि κήρυγμα नपुंसकलिंग है; इसलिए सर्वनाम का अधिक स्वाभाविक संदर्भ परमेश्वर का पुत्र है। पाठक को संभावित प्रवाहगत अस्पष्टता बताने के लिए पादटिप्पणी दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्य मौखिक संवाद को स्पष्ट बनाते हैं। ‘मैदानों, पहाड़ों और सारी पृथ्वी’ में मूल की क्रम-रचना सुरक्षित है; ‘व्यवस्था’ आरंभिक मसीही धार्मिक संदर्भ के अनुरूप है।
