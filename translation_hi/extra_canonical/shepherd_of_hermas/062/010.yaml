base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/010.yaml
  text: “And those who handed in green rods just as they received them are dignified and righteous and have walked with a very pure heart, and have guarded the commandments of the Lord. The rest you will learn when I examine these rods that have been planted and watered.”
translation:
  language: hi
  text: “और जिन्होंने हरी छड़ें, जैसी उन्होंने पाई थीं, वैसी ही लौटा दीं, वे आदरणीय और धर्मी हैं; वे अत्यन्त शुद्ध हृदय से चले हैं और उन्होंने प्रभु की आज्ञाओं का पालन किया है। बाकी बातें तुम तब जानोगे, जब मैं इन लगाई और सींची गई छड़ों को ध्यान से जाँचूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χλωρὰς τὰς ῥάβδους
  choice: हरी छड़ें
  rationale: दृष्टान्त में प्रयुक्त ठोस प्रतीक को यथावत रखा गया है; χλωρός यहाँ ताज़ी/हरी अवस्था बताता है।
- source_word: σεμνοὶ
  choice: आदरणीय
  rationale: यह शब्द गरिमा और सम्मान के योग्य चरित्र को व्यक्त करता है; आधुनिक हिन्दी में ‘आदरणीय’ सहज और dignified है।
- source_word: δίκαιοι
  choice: धर्मी
  rationale: नैतिक धार्मिकता के अर्थ को बनाए रखता है और आरम्भिक मसीही साहित्य के धार्मिक संदर्भ में स्वाभाविक है।
- source_word: ἐν καθαρᾷ καρδίᾳ
  choice: शुद्ध हृदय से
  rationale: ‘हृदय’ के नैतिक-आन्तरिक अर्थ को संरक्षित करते हुए स्वाभाविक हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: πεφυλακότες
  choice: पालन किया है
  rationale: क्रिया में आज्ञाओं को मानने और सुरक्षित रखने, दोनों का भाव है; हिन्दी में आज्ञाओं के साथ ‘पालन करना’ सबसे स्वाभाविक है।
- source_word: κατανοήσω
  choice: ध्यान से जाँच लूँगा
  rationale: सिर्फ देखने के बजाय सावधानी से निरीक्षण करने का अर्थ व्यक्त करता है।
- source_word: πεφυτευμένας καὶ πεποτισμένας
  choice: लगाई और सींची गई
  rationale: दोनों पूर्ण निष्पन्न कर्मों को निष्क्रिय रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: τὰς ἐντολὰς Κυρίου में Κυρίου की पहचान
  choice: प्रभु की आज्ञाएँ
  alternative: परमेश्वर/मसीह की आज्ञाएँ
  rationale: यूनानी पाठ केवल ‘प्रभु’ कहता है; किसी विशिष्ट पहचान को जोड़कर मूल की सम्भावित व्यापकता को सीमित नहीं किया गया।
- issue: बाकी छड़ों से सूचित व्यक्तियों का उल्लेख
  choice: बाकी लोगों के विषय में
  alternative: बाकी बातों के विषय में / बाकी छड़ों के विषय में
  rationale: दृष्टान्त के निकटवर्ती संदर्भ में छड़ें लोगों का प्रतिनिधित्व करती हैं। पाठ को समझने योग्य बनाने के लिए आशय व्यक्त किया गया है, बिना उनकी अंतिम दशा निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। दृष्टान्त के ‘छड़’ रूपक को बदले बिना रखा गया है और वाक्य-विन्यास को सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
