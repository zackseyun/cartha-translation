  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/009.yaml
  text: “But the others, who themselves also handed in their rods green and having side-shoots, yet without fruit—these are those who were hard-pressed for the law, but did not suffer, nor did they deny their law.
translation:
  language: hi
  text: और वे दूसरे लोग भी, जिन्होंने अपनी छड़ियाँ हरी और पार्श्व-शाखाओं वाली सौंपीं, पर उन पर फल नहीं था—ये वे हैं जो व्यवस्था के लिए उत्पीड़न सहते रहे, पर उन्होंने कष्ट नहीं उठाया और अपनी व्यवस्था का इनकार भी नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: छड़ियाँ
  rationale: दृष्टांत में सौंपी और जाँची जाने वाली काटी हुई डालियों/छड़ों के लिए स्वाभाविक शब्द; पूर्ववर्ती प्रतीकात्मक संदर्भ से मेल खाता है।
- source_word: παραφυάδας
  choice: नई कोंपलें
  rationale: मुख्य छड़ी से निकली पार्श्व-वृद्धि को सरल, दृश्य और आधुनिक हिंदी में व्यक्त करता है।
- source_word: ὑπὲρ τοῦ νόμου
  choice: व्यवस्था के कारण
  rationale: उनके क्लेश का कारण व्यवस्था के प्रति निष्ठा है; वाक्यांश को किसी विशिष्ट धर्मशास्त्रीय व्याख्या तक सीमित नहीं करता।
- source_word: θλιβέντες
  choice: क्लेश सहा
  rationale: दबाव और उत्पीड़न का भाव रखता है तथा अगले अधिक तीव्र παθόντες से भेद बनाए रखता है।
- source_word: παθόντες
  choice: यातना सही
  rationale: सामान्य कष्ट की अपेक्षा यहाँ θλιβέντες के बाद अधिक गंभीर प्रताड़ना का संकेत देता है।
- source_word: ἀρνησάμενοι
  choice: इनकार किया
  rationale: दबाव में व्यवस्था को त्यागने या उससे संबंध नकारने का सीधा भाव सुरक्षित रखता है।
theological_decisions:
- issue: νόμος का अर्थ
  choice: व्यवस्था
  alternative: विधान / नियम
  rationale: निकटवर्ती संदर्भ में यह परमेश्वर द्वारा दिया और घोषित किया गया व्यापक धार्मिक विधान है; ‘व्यवस्था’ पारंपरिक होते हुए भी आधुनिक पाठक के लिए समझने योग्य है।
- issue: παθόντες की तीव्रता
  choice: यातना नहीं सही
  alternative: दुःख नहीं उठाया
  rationale: θλιβέντες (‘क्लेश सहा’) के साथ अर्थगत अंतर बनाए रखने के लिए अधिक तीव्र उत्पीड़न व्यक्त किया गया है, यद्यपि यूनानी शब्द अपने आप में व्यापक ‘दुःख सहना’ भी हो सकता है।
- issue: τὸν νόμον αὐτῶν में संबंध
  choice: अपनी व्यवस्था
  alternative: उस व्यवस्था
  rationale: मूल का स्वत्वसूचक रूप सुरक्षित रखा गया है; इसे चुपचाप ‘परमेश्वर की व्यवस्था’ में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तो…पर’ से χλωράς…καρπὸν δὲ μή का विरोध स्पष्ट किया गया है। इस खंड में किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई।
