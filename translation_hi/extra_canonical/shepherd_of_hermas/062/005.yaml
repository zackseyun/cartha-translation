base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/005.yaml
  text: I say to him, “Sir, why did he send some away into the tower, but leave others to you?”
translation:
  language: hi
  text: मैं उससे कहता हूँ, “स्वामी, उसने कुछ लोगों को मीनार में क्यों भेज दिया, पर दूसरों को तुम्हारे पास क्यों छोड़ दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: स्वामी
  rationale: संबोधित व्यक्ति के प्रति आदर दर्शाता है; इस प्रसंग में यह सीधे परमेश्वर के लिए प्रयुक्त उपाधि नहीं है।
- source_word: ἀπέλυσεν εἰς τὸν πύργον
  choice: मीनार में भेज दिया
  rationale: गति और गंतव्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ ἀπολύω का आशय विदा करके भेजना है।
- source_word: σοὶ κατέλειψεν
  choice: तुम्हारे पास छोड़ दिया
  rationale: यूनानी के व्यक्तिगत सर्वनाम और ‘छोड़ देना’ के भाव को स्पष्ट तथा सहज रूप में सुरक्षित रखता है।
theological_decisions:
- issue: मीनार का प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में केवल “मीनार” रखा गया
  alternative: “कलीसिया-रूपी मीनार”
  rationale: इस वाक्य में प्रतीक का अर्थ स्पष्ट करके नहीं बताया गया है; अनुवाद में व्याख्यात्मक पहचान जोड़ना मूल की प्रतीकात्मक खुलावट को सीमित कर देता।
- issue: Κύριε का संदर्भ
  choice: “स्वामी”
  alternative: “प्रभु”
  rationale: वक्ता यहाँ दर्शन के पात्र को संबोधित कर रहा है। “स्वामी” आदरसूचक संबोधन को बनाए रखते हुए उसे अनावश्यक रूप से दिव्य उपाधि के रूप में निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; प्रत्यक्ष संवाद की वर्तमानकालीन कथन-शैली तथा मूल प्रश्न की समांतर संरचना सुरक्षित रखी गई है।
