review_pass:
  verdict: revise
  source_fidelity: The draft translates Greek §5 (and follows the supplied English audit text), not the requested reader segment §6. Greek §6 asks about those crowned and entering the tower, then identifies them as those who suffered for the law; it also contains a bracketed clause about struggling with and overcoming the devil.
  naturalness: The existing Hindi is generally natural for the different sentence it translates, but it cannot be approved for this segment. The revised Hindi is modern, clear, and retains the formal narrative register.
  terminology: “व्यवस्था” consistently renders νόμος; “मुकुट पहने हुए” renders ἐστεφανωμένοι; “मीनार” renders πύργος; and “शैतान” renders διάβολος. “व्यवस्था के लिए कष्ट सहा” preserves the purpose/on-behalf-of force of ὑπὲρ τοῦ νόμου without importing a theological interpretation.
  issues:
  - severity: high
    issue: The submitted translation is for the preceding Greek paragraph (§5), rather than source segment §6.
    rationale: The draft begins with ‘जितनों ने उस व्यवस्था का उल्लंघन किया...,’ corresponding to Ὅσοι ... παρέβησαν τὸν νόμον in §5. Segment §6 instead begins Τίνες ... εἰσὶν οἱ ἐστεφανωμένοι and concerns the crowned people entering the tower. The English audit trail is likewise misaligned and should not override the original-language source.
  - severity: medium
    issue: The bracketed Greek clause in §6 requires an uncertainty note.
    rationale: The source presents the statement concerning those who struggled with and defeated the devil in brackets. The translation retains it with a footnote marking its bracketed textual status rather than silently treating it as undisputed or omitting it.
  revised_text: तब मैंने उससे कहा, “हे स्वामी, वे कौन हैं जो मुकुट पहने हुए हैं और मीनार में जा रहे हैं?” उसने कहा, “[वे जिन्होंने शैतान से संघर्ष किया और उसे हरा दिया है, मुकुट पहने हुए हैं;] ये वे हैं जिन्होंने व्यवस्था के लिए कष्ट सहा है।”¹
  revised_footnotes:
  - marker: ¹
    text: यूनानी स्रोत में ‘वे जिन्होंने शैतान से संघर्ष किया और उसे हरा दिया है ...’ वाला खंड वर्गाकार कोष्ठकों में दिया गया है।
    reason: स्रोत-संस्करण द्वारा चिह्नित पाठगत अनिश्चितता को बनाए रखता है, बिना उसके पाठ-इतिहास पर कोई निष्कर्ष थोपे।
  revision_rationale: A complete replacement is necessary because the draft and the English audit text are misaligned with the designated Greek reader segment. The revision translates §6 directly, preserves the speaker and pronoun references without adding names, and flags the bracketed clause as it appears in the source edition.
