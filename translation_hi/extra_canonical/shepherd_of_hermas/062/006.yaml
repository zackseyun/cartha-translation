base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/006.yaml
  text: “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”
translation:
  language: hi
  text: वह कहता है, “जितनों ने उस व्यवस्था का उल्लंघन किया, जिसे उन्होंने उससे पाया था, उन्हें उसने मन फिराने के लिए मेरे अधिकार में छोड़ दिया। पर जो व्यवस्था को पहले ही प्रसन्न कर चुके हैं और उसका पालन करते रहे हैं, उन्हें वह अपने अधिकार में रखता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέβησαν
  choice: उल्लंघन किया
  rationale: व्यवस्था की निर्धारित सीमा या आदेश को तोड़ने का अर्थ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: μετάνοιαν
  choice: मन फिराने
  rationale: केवल पछतावे की भावना नहीं, बल्कि मन और दिशा के परिवर्तन का व्यापक अर्थ सुरक्षित रखता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यहाँ किसी व्यक्ति के अधिकार-क्षेत्र या अधीनता को दर्शाता है।
- source_word: τετηρήκασιν
  choice: पालन करते रहे हैं
  rationale: पूर्णकालीन क्रिया के उस भाव को व्यक्त करता है कि उन्होंने व्यवस्था को थामे रखा और उसका पालन किया है।
theological_decisions:
- issue: εὐηρέστησαν τῷ νόμῳ का असामान्य संबंध
  choice: व्यवस्था को पहले ही प्रसन्न कर चुके हैं
  alternative: व्यवस्था के अनुसार पहले ही ग्रहणयोग्य ठहरे हैं
  rationale: यूनानी पाठ शाब्दिक रूप से व्यवस्था को प्रसन्न करने की बात करता है। इसे अधिक परिचित धर्मवैज्ञानिक कथन में बदलने के बजाय मूल की असामान्यता और संभावित अर्थगत तनाव को सुरक्षित रखा गया है।
- issue: कर्ता-सर्वनामों की पहचान
  choice: ‘उससे’, ‘उसने’ और ‘वह’ को पाठ की तरह अनिर्दिष्ट रखा गया
  alternative: हर स्थान पर मीकाएल नाम जोड़ना
  rationale: निकटवर्ती संदर्भ से संकेत मिलता है कि कर्ता महान स्वर्गदूत है, पर इस वाक्य में यूनानी सर्वनाम ही रखता है; अनुवाद ने स्पष्टता के नाम पर नाम नहीं जोड़ा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली रखी गई है। उद्धरण के भीतर वक्ता का संकेत स्वाभाविक हिन्दी क्रम में रखा गया है; मूल पाठ की सर्वनामगत अस्पष्टता और ‘व्यवस्था को प्रसन्न करना’ जैसी असामान्य अभिव्यक्ति को जानबूझकर नहीं सुलझाया गया।
