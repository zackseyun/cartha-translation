base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/008.yaml
  text: “[Those who grappled with the devil and overcame him,” he says, “are crowned.] These are the ones who suffered for the law.
translation:
  language: hi
  text: “[जिन्होंने शैतान से कुश्ती लड़ी और उसे पराजित किया,” उसने कहा, “उन्हें मुकुट पहनाया गया है।][a] ये वे लोग हैं जिन्होंने व्यवस्था के लिए दुःख सहा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिया गया वाक्य यूनानी पाठ में पाठगत रूप से अनिश्चित चिह्नित है।
    reason: स्रोत संस्करण के वर्गाकार कोष्ठकों को सुरक्षित रखते हुए पाठक को उनके पाठालोचनात्मक महत्व से अवगत कराना।
lexical_decisions:
- source_word: συμπαλαίσαντες
  choice: संघर्ष किया
  rationale: मूल क्रिया में निकट और कठिन मुकाबले का भाव है; आधुनिक हिन्दी में ‘संघर्ष किया’ स्वाभाविक रहते हुए उस भाव को व्यक्त करता है।
- source_word: τῷ διαβόλῳ
  choice: शैतान से
  rationale: व्यक्तिवाचक विरोधी के लिए प्रचलित और सामान्य पाठक को स्पष्ट हिन्दी शब्द।
- source_word: ἐνίκησαν
  choice: पराजित किया
  rationale: विजय पाने के सकर्मक भाव को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἐστεφανωμένοι
  choice: मुकुट पहनाए गए हैं
  rationale: पूर्ण निष्पन्न निष्क्रिय भाव को बनाए रखता है और सम्मान अथवा विजय के मुकुट की छवि सुरक्षित रखता है।
- source_word: ὑπὲρ τοῦ νόμου παθόντες
  choice: व्यवस्था के लिए दुःख सहा
  rationale: ὑπέρ के ‘के लिए/की खातिर’ भाव और παθόντες के कष्ट सहने के अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: νόμος का अर्थ
  choice: व्यवस्था
  alternative: नियम / विधान
  rationale: इस प्रसंग में यह परमेश्वर द्वारा दी गई और विश्वासियों से पालन की अपेक्षा रखने वाली ‘व्यवस्था’ है; यह चुनाव धार्मिक अर्थ को सुरक्षित रखता है, पर उसे किसी विशिष्ट सम्प्रदायगत व्यवस्था तक सीमित नहीं करता।
- issue: मुकुट दिए जाने का कर्ता
  choice: निष्क्रिय रूप—‘उन्हें मुकुट पहनाए गए हैं’
  alternative: परमेश्वर ने उन्हें मुकुट पहनाए हैं
  rationale: यूनानी पाठ कर्ता का नाम नहीं बताता; इसलिए अनकहे कर्ता को स्पष्ट करके जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद की संरचना तथा स्रोत के वर्गाकार कोष्ठक सुरक्षित हैं; ‘ये वही लोग हैं’ अगले कथन को मुकुट पाए लोगों से स्वाभाविक रूप से जोड़ता है।
