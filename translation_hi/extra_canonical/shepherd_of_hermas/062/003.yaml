base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/003.yaml
  text: “And the great and glorious angel is Michael, who has authority over this people and governs them. For he is the one who gives the law to them, into the hearts of those who believe; therefore he himself visits those to whom he gave it, to see whether they have kept it.
translation:
  language: hi
  text: और वह महान और महिमामय स्वर्गदूत मीकाएल है, जिसे इस प्रजा पर अधिकार है और जो उसका संचालन करता है। क्योंकि वही विश्वास करने वालों को उनके हृदयों में व्यवस्था देता है। इसलिए जिन लोगों को उसने व्यवस्था दी है, वह स्वयं उनकी जाँच करता है कि उन्होंने उसका पालन किया है या नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: आधुनिक हिन्दी में दैवी संदेशवाहक के लिए सर्वाधिक स्वाभाविक और स्पष्ट पद।
- source_word: ἔνδοξος
  choice: महिमामय
  rationale: यह शब्द गौरव और महिमा से युक्त होने का भाव बनाए रखता है।
- source_word: Μιχαήλ
  choice: मीकाएल
  rationale: यूनानी नाम के निकट प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: διακυβερνῶν
  choice: संचालन करता है
  rationale: शासन, मार्गदर्शन और देखरेख के संयुक्त भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: νόμος
  choice: व्यवस्था
  rationale: यहाँ परमेश्वर की दी हुई विधि/व्यवस्था का धार्मिक संदर्भ है; ‘व्यवस्था’ उसी अर्थ को बनाए रखती है।
- source_word: ἐπισκέπτεται
  choice: जाँच करता है
  rationale: संदर्भ में मिलने या देखने से अधिक, पालन की स्थिति का निरीक्षण करने का आशय प्रमुख है।
- source_word: τετηρήκασιν
  choice: पालन किया है
  rationale: व्यवस्था को थामे रखने, सुरक्षित रखने और उसके अनुसार चलने का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: मीकाएल द्वारा विश्वासियों के हृदयों में व्यवस्था देना
  choice: कथन को स्रोत के अनुसार सीधे बनाए रखा गया है
  alternative: इसे केवल व्यवस्था पहुँचाने या सिखाने के रूप में व्याख्यायित करना
  rationale: मूल पाठ मीकाएल को ‘देनेवाला’ कहता है; अनुवाद ने इस प्राचीन ग्रंथ की विशिष्ट देवदूत-संबंधी धारणा को किसी बाद की धर्मवैज्ञानिक प्रणाली के अनुरूप नहीं बदला।
- issue: ‘इस प्रजा’ पर मीकाएल का अधिकार
  choice: ‘जिसे इस प्रजा पर अधिकार है’
  alternative: ‘जो परमेश्वर की प्रजा का संरक्षक है’
  rationale: ‘संरक्षक’ व्याख्यात्मक विस्तार होता; मूल में अधिकार और संचालन का स्पष्ट कथन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य की पुनरुक्ति को अर्थ खोए बिना स्वाभाविक हिन्दी में व्यवस्थित किया गया है।
