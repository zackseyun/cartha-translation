  text: “Why then was she seated in a chair? I wanted to know, sir.” “Because every weak person sits in a chair because of his weakness, in order that the weakness of his body may be supported. You have the pattern of the first vision.”
translation:
  language: hi
  text: “तब वह आसन पर क्यों बैठी थी? महोदय, मैं यह जानना चाहता था।” उसने कहा, “क्योंकि हर निर्बल व्यक्ति अपनी निर्बलता के कारण आसन पर बैठता है, ताकि उसके शरीर की निर्बलता को सहारा मिले। तुम्हारे पास पहले दर्शन का प्रतिरूप है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθέδρα
  choice: आसन
  rationale: यह बैठने के लिए सहारा देने वाली कुर्सी या आसंदी को सूचित करता है; ‘आसन’ स्वाभाविक और गरिमापूर्ण है तथा किसी विशिष्ट आधुनिक कुर्सी तक अर्थ सीमित नहीं करता।
- source_word: κύριε
  choice: प्रभु
  rationale: यहाँ हर्मास आदरपूर्वक संबोधन करता है; ‘प्रभु’ उस गरिमापूर्ण संबोधन को बनाए रखता है, यद्यपि इसका अर्थ सामान्यतः ‘महोदय’ भी हो सकता है।
- source_word: συνκρατηθῇ
  choice: सहारा मिले
  rationale: संदर्भ में शरीर की दुर्बलता को थामने या सँभालने का भाव है; हिन्दी में ‘सहारा मिले’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: τύπον
  choice: प्रतीकात्मक अर्थ
  rationale: यह पहले दर्शन के रूप, प्रतिरूप या सांकेतिक अभिप्राय को दर्शाता है; केवल ‘नमूना’ यहाँ अस्पष्ट होगा, इसलिए संदर्भानुसार सांकेतिक अर्थ व्यक्त किया गया है।
theological_decisions:
- issue: κύριε संबोधन की पहचान
  choice: प्रभु
  alternative: महोदय / स्वामी
  rationale: मूल पाठ केवल सम्मानसूचक संबोधन देता है और संबोधित व्यक्ति की तात्त्विक पहचान को स्पष्ट नहीं करता। ‘प्रभु’ पारंपरिक गरिमा बनाए रखता है, पर अनुवाद में कोई अतिरिक्त पहचान नहीं जोड़ी गई।
- issue: τύπος का अर्थ
  choice: पहले दर्शन का प्रतीकात्मक अर्थ
  alternative: पहले दर्शन का प्रतिरूप / नमूना
  rationale: आगे की व्याख्या में वृद्ध स्त्री और आसन की विशेषताएँ सांकेतिक रूप से समझाई जाती हैं। अतः ‘प्रतीकात्मक अर्थ’ प्रसंग को स्पष्ट करता है, बिना किसी विशेष धर्मसिद्धान्त को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण संवाद-शैली। मूल के प्रश्नोत्तर क्रम और दुर्बलता की पुनरावृत्ति को अर्थगत बल के लिए बनाए रखा गया है।
