base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/001.yaml
  text: “Listen,” he says, “about the three forms you are inquiring about. In the first vision, why did she appear to you as an old woman and seated on a chair? Because your spirit is old and already withered and has no strength because of your weaknesses and your double‑mindedness. For just as the aged, no longer having hope of being renewed, expect nothing else but their sleep, so also you, having been weakened by the affairs of life, have handed yourselves over to negligence, and you did not cast your anxieties upon the Lord; instead your mind has been shattered, and you have grown old in your sorrows.”
translation:
  language: hi
  text: वह कहता है, “जिन तीन रूपों के विषय में तुम पूछ रहे हो, उनके बारे में सुनो। पहले दर्शन में वह तुम्हें वृद्धा और आसन पर बैठी हुई क्यों दिखाई दी? इसलिए कि तुम लोगों की आत्मा बूढ़ी और पहले ही मुरझा चुकी है, और तुम्हारी दुर्बलताओं और दो-मनापन के कारण उसमें कोई सामर्थ्य नहीं है। क्योंकि जैसे बूढ़े लोग, जिन्हें फिर से नया होने की आशा नहीं रहती, अपनी नींद के सिवा और किसी बात की प्रतीक्षा नहीं करते, वैसे ही तुम भी सांसारिक मामलों से दुर्बल होकर अपने आपको उदासीनता के हवाले कर चुके हो और तुमने अपनी चिंताएँ प्रभु पर नहीं डालीं; बल्कि तुम्हारा मन टूट गया और तुम अपने दुखों के कारण बूढ़े हो गए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: रूपों
  rationale: तीन अलग-अलग प्रकट रूपों के लिए स्वाभाविक और अर्थ-संगत शब्द।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ समुदाय की भीतरी आध्यात्मिक दशा का संकेत है; मूल की व्यापक धार्मिक अर्थवत्ता बनाए रखता है।
- source_word: μαλακιῶν
  choice: दुर्बलताओं
  rationale: नैतिक अथवा आध्यात्मिक शिथिलता का भाव देता है, बिना अर्थ को किसी एक विशिष्ट दोष तक सीमित किए।
- source_word: διψυχιῶν
  choice: दुविधाओं
  rationale: दो मन वाला होने, अनिर्णय और विश्वास की अस्थिरता के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: κοίμησιν
  choice: नींद
  rationale: मूल का शाब्दिक रूपक सुरक्षित है; प्रसंग में मृत्यु की ओर संकेत को स्पष्ट व्याख्या से प्रतिस्थापित नहीं किया गया।
- source_word: βιωτικῶν πραγμάτων
  choice: जीवन की बातों
  rationale: दैनिक सांसारिक मामलों का व्यापक अर्थ बनाए रखता है।
- source_word: ἀκηδίας
  choice: उदासीनता
  rationale: लापरवाही, निरुत्साह और आध्यात्मिक निष्क्रियता के संयुक्त भाव के लिए उपयुक्त आधुनिक शब्द।
- source_word: διάνοια
  choice: बुद्धि
  rationale: मन, समझ और आंतरिक विचार-क्षमता के अर्थक्षेत्र को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: बहुवचन ὑμῶν/ὑμεῖς और एकवचन संबोधन का संबंध
  choice: पहले एकवचन ‘तुम’, फिर समुदाय के लिए बहुवचन ‘तुम’ को हिन्दी में प्रसंगानुसार रहने दिया गया
  alternative: सभी सर्वनामों को एकवचन बनाना
  rationale: यूनानी पाठ व्यक्ति से प्रश्न करते हुए समुदाय की सामूहिक आध्यात्मिक दशा की ओर मुड़ता है; इस तनाव को समतल नहीं किया गया।
- issue: κοίμησις का आशय
  choice: ‘नींद’
  alternative: ‘मृत्यु’
  rationale: मूल रूपक को बनाए रखा गया, क्योंकि मृत्यु इसका संभावित संकेत है पर शब्द स्वयं ‘नींद’ कहता है।
- issue: πνεῦμα का संदर्भ
  choice: ‘तुम्हारी आत्मा’
  alternative: ‘तुम्हारा मनोबल’ या ‘तुम लोगों की आत्मा’
  rationale: धार्मिक और मानव-आंतरिक दोनों अर्थों की गुंजाइश सुरक्षित रहती है; किसी संप्रदायगत मानव-रचना सिद्धांत को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। मूल के वृद्धावस्था, मुरझाने, नींद, टूटने और दुखों से बूढ़े होने वाले रूपकों को बनाए रखा गया है। पाठ केवल दिए गए reader segment 1 (यूनानी §§1–3) का अनुवाद करता है; parent source में आगे आने वाला §4 इसमें शामिल नहीं है।
