base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/003.yaml
  text: 'I say to you: if you do not keep these, but neglect them, do not follow the commandments of the devil, which are difficult and bitter and savage and licentious; and do not fear the devil, because he has no power against you. For I will be with you—I, the angel of repentance, who has mastery over him. The devil has only fear, but his fear has no force. Therefore do not fear him, and he will flee from you.”'
translation:
  language: hi
  text: 'मैं तुमसे कहता हूँ: यदि तुम इन आज्ञाओं का पालन न करके उनकी उपेक्षा करोगे, तो शैतान की आज्ञाओं का अनुसरण मत करना—वे कठिन, कड़वी, क्रूर और उच्छृंखल हैं। और शैतान से मत डरना, क्योंकि तुम्हारे विरुद्ध उसमें कोई सामर्थ्य नहीं है। मैं तुम्हारे साथ रहूँगा—मैं, मन-फिराव का दूत, जिसका उस पर अधिकार है। शैतान के पास केवल भय है, पर उसके भय में कोई बल नहीं है। इसलिए उससे मत डरना, और वह तुम्हारे पास से भाग जाएगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολαί / ταῖς ἐντολαῖς
  choice: आज्ञाएँ
  rationale: यहाँ नैतिक आदेशों के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्द है; दोनों विरोधी आज्ञा-समूहों की समान शब्दावली भी बनी रहती है।
- source_word: παρενθυμηθῇς
  choice: उनकी उपेक्षा करोगे
  rationale: संदर्भ में आज्ञाओं को गंभीरता से न लेने या उन्हें अनदेखा करने का भाव है; स्रोत-पाठ की असामान्य/संदिग्ध शब्द-रचना के बीच अंग्रेज़ी परामर्श-पाठ से भी इसकी पुष्टि होती है।
- source_word: πορευόμενοι
  choice: पर चलना
  rationale: आज्ञाओं के अनुसार जीवन-चाल चलने के यूनानी रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀγρίαις
  choice: क्रूर
  rationale: शाब्दिक ‘जंगली’ की अपेक्षा आज्ञाओं के कठोर और निर्दय चरित्र को आधुनिक हिन्दी में अधिक स्पष्ट करता है।
- source_word: ἀσελγέσι
  choice: कामुकता से भरी
  rationale: ἀσέλγεια के उच्छृंखल और विशेषतः काम-विषयक अनैतिकता के भाव को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: δύναμις
  choice: सामर्थ्य
  rationale: विरोध करने या हानि पहुँचाने की वास्तविक शक्ति का अर्थ व्यक्त करता है।
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: मन-फिराव का दूत
  rationale: μετάνοια को केवल भावनात्मक पछतावे तक सीमित न करके जीवन-दिशा के परिवर्तन के रूप में व्यक्त करता है; ἄγγελος के लिए ‘दूत’ मूल की व्यापकता बनाए रखता है।
- source_word: ὁ κατακυριεύων αὐτοῦ
  choice: जिसका उस पर अधिकार है
  rationale: शैतान पर प्रभुत्व रखने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है, बिना वक्ता की पहचान के बारे में अतिरिक्त सिद्धान्त जोड़ने के।
- source_word: τόνον οὐκ ἔχει
  choice: कोई बल नहीं
  rationale: τόνος के ‘तनाव, जोर, प्रभावी बल’ वाले भाव को प्रसंगानुकूल हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मन-फिराव के दूत की पहचान
  choice: वक्ता को केवल ‘मन-फिराव का दूत’ कहा गया है
  alternative: उसे किसी विशिष्ट स्वर्गदूत, मसीह, या अन्य नामित सत्ता के रूप में पहचानना
  rationale: स्रोत स्वयं कोई नाम या अतिरिक्त पहचान नहीं देता; अनिर्णीत पहचान को वैसा ही रखा गया है।
- issue: शैतान की शक्ति का स्वरूप
  choice: ‘तुम्हारे विरुद्ध उसमें कोई सामर्थ्य नहीं’ और ‘उसके डर में कोई बल नहीं’
  alternative: शैतान को सर्वथा शक्तिहीन बताना
  rationale: मूल कथन संबोधित लोगों के विरुद्ध उसकी शक्ति और उसके द्वारा उत्पन्न भय की प्रभावशीलता पर केंद्रित है; इसे सार्वभौमिक दार्शनिक दावा नहीं बनाया गया।
- issue: ἀσελγέσι का नैतिक अर्थ
  choice: ‘कामुकता से भरी’
  alternative: ‘उच्छृंखल’ या ‘लज्जाहीन’
  rationale: शब्द में व्यापक उच्छृंखलता हो सकती है, पर इस नैतिक सूची में उसका प्रबल काम-विषयक संकेत स्पष्ट रखना उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सहज शैली। दूसरे पुरुष बहुवचन/आदरार्थक ‘तुम’ और ‘तुम्हारे’ अंग्रेज़ी परामर्श-पाठ तथा यूनानी बहुवचन के अनुरूप हैं। स्रोत की आज्ञा, भय, सामर्थ्य और अधिकार की पुनरावृत्तियों को यथासंभव बनाए रखा गया है।
