base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/002.yaml
  text: Answering, he says to me, “If you set before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already arisen in your heart that they cannot be kept by a human being, you will not keep them.
translation:
  language: hi
  text: उसने उत्तर में मुझसे कहा, “यदि तुम अपने मन में यह ठान लो कि इन आज्ञाओं का पालन किया जा सकता है, तो तुम आसानी से इनका पालन करोगे, और ये कठिन नहीं होंगी। लेकिन यदि तुम्हारे हृदय में यह विचार पहले ही आ चुका है कि कोई मनुष्य इनका पालन नहीं कर सकता, तो तुम इनका पालन नहीं करोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθῇς
  choice: अपने मन में यह ठान लो
  rationale: यह क्रिया किसी बात को अपने सामने रखने, उद्देश्य बनाने या दृढ़ मान लेने का भाव देती है; आधुनिक हिन्दी में यह चयन उसी संकल्पात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φυλαχθῆναι / φυλάξεις
  choice: पालन किया जा सकता है / पालन करोगे
  rationale: ἐντολαί के संदर्भ में φυλάσσω का अर्थ आज्ञाओं को मानना या उनका पालन करना है; एक ही हिन्दी पदावली से मूल की पुनरावृत्ति भी बनी रहती है।
- source_word: σκληραί
  choice: कठिन
  rationale: यहाँ आज्ञाओं के कठोर अथवा दुस्तर होने की बात है; प्रसंग में ‘कठिन’ सहज और सटीक है।
- source_word: ἐπὶ τὴν καρδίαν σου ... ἀναβῇ
  choice: तुम्हारे हृदय में यह बात ... उठ चुकी है
  rationale: मूल के ‘हृदय पर/में चढ़ आने’ वाले रूपक को हिन्दी में समझ में आने योग्य रूप में रखते हुए ‘हृदय में ... उठना’ कहा गया है।
theological_decisions:
- issue: आज्ञाओं का पालन करने की मानवीय क्षमता
  choice: मूल के प्रत्यक्ष दावे को यथावत रखा गया है कि मन में उनकी पालनीयता स्वीकार करने पर उनका पालन संभव और सहज होगा।
  alternative: इसे केवल दैवी अनुग्रह, नैतिक प्रयास या मनोवैज्ञानिक आत्मविश्वास के किसी विशिष्ट सिद्धांत के रूप में स्पष्ट करना।
  rationale: इस खंड में वक्ता का कथन संकल्प और पालन के संबंध पर केंद्रित है; अनकहे धर्मवैज्ञानिक आधार को जोड़ना मूल की तनावपूर्ण स्पष्टता को संप्रदायगत दिशा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आज्ञाओं का पालन’ धार्मिक-नैतिक संदर्भ में सामान्य हिन्दी प्रयोग है। प्रत्यक्ष कथन की पुनरावृत्ति मूल यूनानी की तर्क-रचना को बनाए रखती है।
