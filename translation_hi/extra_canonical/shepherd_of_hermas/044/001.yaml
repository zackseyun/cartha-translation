base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/001.yaml
  text: But I do not know whether these commandments can be kept by a human being, because they are very hard.
translation:
  language: hi
  text: लेकिन मैं नहीं जानता कि कोई मनुष्य इन आज्ञाओं का पालन कर सकता है या नहीं, क्योंकि ये बहुत कठिन हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολαὶ
  choice: आज्ञाएँ
  rationale: यह शब्द दिए गए आदेशों या निर्देशों को दर्शाता है; प्रसंग में ‘आज्ञाएँ’ स्वाभाविक और सटीक है।
- source_word: ὑπὸ ἀνθρώπου φυλαχθῆναι
  choice: कोई मनुष्य … पालन कर सकता है
  rationale: यूनानी निष्क्रिय रचना का अर्थ स्वाभाविक हिन्दी में सक्रिय सामर्थ्यसूचक वाक्य से व्यक्त किया गया है; φυλάσσω का आशय आज्ञाओं को मानना/पालन करना है।
- source_word: σκληραί … λίαν
  choice: बहुत कठिन
  rationale: σκληρός का मूल अर्थ ‘कठोर’ है, पर आज्ञाओं के पालन की कठिनता के इस प्रसंग में ‘बहुत कठिन’ अभिप्रेत अर्थ को स्पष्ट और सहज रूप में देता है।
theological_decisions:
- issue: क्या आज्ञाओं का पालन मनुष्य के लिए संभव है
  choice: वक्ता की अनिश्चितता को प्रश्नात्मक ‘कर सकता है या नहीं’ के रूप में सुरक्षित रखा गया है।
  alternative: ‘मनुष्य इन आज्ञाओं का पालन कर सकता है’ या ‘नहीं कर सकता’ कहकर प्रश्न का निर्णय कर देना।
  rationale: मूल पाठ οὐκ οἶδα δὲ εἰ के द्वारा अनिश्चितता व्यक्त करता है; अगले वाक्यों का उत्तर यहाँ पहले से आरोपित नहीं किया जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘मनुष्य’ मूल ἄνθρωπος की सामान्य मानवीय व्यापकता को बनाए रखता है।
