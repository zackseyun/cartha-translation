base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/004.yaml
  text: “I, lord,” I say, “am senseless, and I do not understand these parables. For how can it wear away and then save? I do not understand.”
translation:
  language: hi
  text: मैंने कहा, “प्रभु, मैं नासमझ हूँ और इन दृष्टान्तों को नहीं समझता। क्योंकि यह कैसे दूर कर सकता है और फिर बचा सकता है? मैं नहीं समझता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσύνετος
  choice: नासमझ
  rationale: यह शब्द समझ-बूझ की कमी व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक और मूल से निकट है।
- source_word: παραβολὰς
  choice: दृष्टान्तों
  rationale: आरम्भिक मसीही साहित्य में यह परिचित धार्मिक पद है और यहाँ गूढ़ उपमात्मक कथनों के लिए उपयुक्त है।
- source_word: ἐκτρίβειν
  choice: दूर भगा सकता है
  rationale: मूल क्रिया में निकाल देने या खदेड़ देने का भाव है; निकटवर्ती संदर्भ में पवित्र आत्मा को बाहर करने का आशय है।
- source_word: σῴζειν
  choice: बचा सकता है
  rationale: क्रिया के सामान्य और जानबूझकर खुले अर्थ को बनाए रखता है; यहाँ यह नहीं तय किया गया कि उद्धार किस प्रकार या किसका है।
theological_decisions:
- issue: ἐκτρίβειν और σῴζειν के विरोधाभासी संबंध को व्यक्त करना
  choice: “दूर भगा सकता है और फिर बचा सकता है”
  alternative: “नष्ट कर सकता है और फिर उद्धार कर सकता है”
  rationale: पिछले वाक्य में कर्म पवित्र आत्मा है, इसलिए ἐκτρίβειν का निष्कासन-संबंधी अर्थ अधिक संगत है। “बचा सकता है” σῴζειν की वास्तविक अस्पष्टता और कथन के तनाव को बिना व्याख्यात्मक समाधान के सुरक्षित रखता है।
- issue: κύριε का संबोधन
  choice: प्रभु
  alternative: स्वामी
  rationale: संवाद में अधिकारपूर्ण आध्यात्मिक संबोधन के रूप में “प्रभु” स्वाभाविक है, पर इसे अनिवार्य रूप से परमेश्वर के नाम के रूप में नहीं समझाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वक्ता की दोहराई हुई असमझ को मूल के अनुरूप सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं है।
