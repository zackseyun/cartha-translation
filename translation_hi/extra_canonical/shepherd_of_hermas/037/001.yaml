  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/001.yaml
  text: “Remove sorrow from yourself,” he says, “for it is a sister of double‑mindedness and quick temper.”
translation:
  language: hi
  text: वह कहता है, “अपने से उदासी दूर कर दो, क्योंकि यह दोहरे मन की अवस्था और शीघ्र क्रोध करने की प्रवृत्ति की बहन है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπην
  choice: उदासी
  rationale: यहाँ शब्द मन को दबाने वाली उदासी या खिन्नता को दर्शाता है; प्रसंग के लिए सामान्य और सहज ‘उदासी’ उपयुक्त है।
- source_word: διψυχίας
  choice: दुविधा
  rationale: शाब्दिक भाव ‘दो मन वाला होना’ है। ‘दुविधा’ मन के बँटे होने और अनिश्चय—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ὀξυχολίας
  choice: क्रोधी स्वभाव
  rationale: यह केवल एक बार के क्रोध के बजाय शीघ्र भड़कने या चिड़चिड़े क्रोधी मिज़ाज का बोध कराता है; इसलिए ‘क्रोधी स्वभाव’ चुना गया।
- source_word: ἀδελφή
  choice: बहन
  rationale: स्रोत में मानवीकरण करते हुए सीधा पारिवारिक रूपक है, जिसे यथावत रखा गया है।
theological_decisions:
- issue: διψυχία का नैतिक और आध्यात्मिक अर्थ
  choice: दुविधा
  alternative: दोहरे मन की अवस्था
  rationale: पाठ में निहित मन-विभाजन को किसी विशिष्ट सांप्रदायिक व्याख्या से बाँधे बिना संक्षिप्त और बोधगम्य रखा गया है।
- issue: λύπη की प्रकृति
  choice: उदासी
  alternative: शोक
  rationale: संदर्भ इसे दूर किए जाने योग्य आंतरिक दशा बताता है, न कि अनिवार्यतः किसी मृत्यु या हानि से उपजा शोक; अतः अधिक व्यापक अर्थ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ग्रीक के प्रत्यक्ष संबोधन और ‘बहन’ वाले रूपक को सुरक्षित रखा गया है।
