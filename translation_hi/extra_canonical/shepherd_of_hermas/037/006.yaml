base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/006.yaml
  text: “But those who have the fear of God and inquire about the divine and the truth and have their heart toward the Lord quickly understand and comprehend everything spoken to them, because they have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding. Therefore cling to the Lord, and you will understand and comprehend all things.”
translation:
  language: hi
  text: पर जो लोग परमेश्वर का भय मानते हैं, परमेश्वर और सत्य के विषय में खोज करते हैं, और अपना हृदय प्रभु की ओर लगाए रखते हैं, वे जो बातें उन्हें कही जाती हैं, उन्हें शीघ्र ही समझते और ग्रहण करते हैं, क्योंकि उनके भीतर प्रभु का भय है। जहाँ प्रभु निवास करता है, वहाँ बहुत समझ भी होती है। इसलिए प्रभु से जुड़े रहो, और तुम सब कुछ समझोगे और ग्रहण करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβον ... θεοῦ / φόβον τοῦ κυρίου
  choice: परमेश्वर का भय / प्रभु का भय
  rationale: यहाँ φόβος श्रद्धामय भय और परमेश्वर के प्रति गंभीर आदर को व्यक्त करता है; पारंपरिक और स्वाभाविक हिन्दी पदबंध मूल की तीव्रता बनाए रखता है।
- source_word: ἐρευνῶντες
  choice: खोज करते हैं
  rationale: क्रिया गंभीर जाँच-पड़ताल या खोज का बोध देती है; ‘खोज करना’ सामान्य पाठक के लिए स्वाभाविक है और सक्रिय अन्वेषण को सुरक्षित रखता है।
- source_word: περὶ θεότητος
  choice: ईश्वरीय बातों
  rationale: θεότης यहाँ परमेश्वर अथवा दिव्यता से संबंधित विषयों के अर्थ में है; ‘ईश्वरीय बातों’ से अमूर्तता घटती है, पर किसी विशिष्ट धर्मशास्त्रीय व्याख्या को आरोपित नहीं किया जाता।
- source_word: τὴν καρδίαν ἔχοντες πρὸς τὸν κύριον
  choice: अपना हृदय प्रभु की ओर लगाए रखते हैं
  rationale: दिशा, निष्ठा और सतत अभिमुखता—तीनों भावों को प्राकृतिक हिन्दी में व्यक्त करता है।
- source_word: νοοῦσι καὶ συνίουσιν
  choice: समझ-बूझ लेते हैं
  rationale: दो निकटार्थी यूनानी क्रियाओं की पुनरुक्ति को एक स्वाभाविक हिन्दी युग्म में रखा गया है, जिससे ग्रहण और विवेक दोनों का भाव आता है।
- source_word: κολλήθητι
  choice: जुड़े रहो
  rationale: मूल का अर्थ दृढ़ता से लग जाने या निकट जुड़े रहने का है; ‘जुड़े रहो’ संबंधपरक और सतत आग्रह को सहज आधुनिक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: परमेश्वर के भय का स्वरूप
  choice: ‘परमेश्वर का भय’ को यथावत रखा गया
  alternative: ‘परमेश्वर के प्रति श्रद्धा’
  rationale: केवल ‘श्रद्धा’ कहने से φόβος की वास्तविक नैतिक और आध्यात्मिक गंभीरता मंद पड़ सकती थी; पाठ स्वयं अर्थ को विस्तार से परिभाषित नहीं करता।
- issue: प्रभु का निवास और समझ
  choice: 'कारणात्मक कथन को सीधे रखा: ‘जहाँ प्रभु निवास करता है, वहाँ समझ भी बहुत होती है’'
  alternative: इसे पवित्र आत्मा के अंतर्वास या किसी विशेष सिद्धान्त के रूप में स्पष्ट करना
  rationale: मूल केवल ‘प्रभु’ कहता है; किसी विशिष्ट त्रिएकतावादी या आत्मिक पहचान को जोड़ना पाठ से आगे जाना होता।
- issue: πάντα का विस्तार
  choice: ‘सब कुछ’
  alternative: ‘कही गई सभी बातें’
  rationale: अंतिम वाक्य का πάντα व्यापक है; निकट संदर्भ इसे शिक्षा की समझ से जोड़ता है, फिर भी अनुवाद ने उसकी मूल व्यापकता को सीमित नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘समझ-बूझ’ जैसे स्वाभाविक युग्म से यूनानी समानार्थी क्रियाओं की बलात्मक पुनरावृत्ति व्यक्त की गई है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
