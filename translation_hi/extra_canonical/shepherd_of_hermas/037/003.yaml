base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/003.yaml
  text: “You are senseless, man,” he says, “and do you not perceive that sorrow is more evil than all the spirits and most dreadful for the servants of God, and that beyond all the spirits it destroys a person and wears away the Holy Spirit—and then saves again?”
translation:
  language: hi
  text: “मनुष्य, तुम नासमझ हो,” उसने कहा, “क्या तुम नहीं समझते कि उदासी सभी आत्माओं से अधिक बुरी और परमेश्वर के सेवकों के लिए सबसे भयानक है, और यह सभी आत्माओं से बढ़कर मनुष्य को नष्ट करती है और पवित्र आत्मा को मिटा देती है—और फिर बचाती भी है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में अंतिम शब्दशः भाव है, “और फिर बचाती है?” यह जानबूझकर चौंकाने वाला विरोधाभास अगले वाक्य में पूछे गए प्रश्न की भूमिका बनता है।
    reason: मूल पाठ की कठिन और संभावित रूप से भ्रमकारी अभिव्यक्ति को बिना बदलते पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ἀσύνετος
  choice: नासमझ
  rationale: यह शब्द समझ और विवेक के अभाव को दर्शाता है; आधुनिक हिन्दी में ‘नासमझ’ स्वाभाविक है और अनावश्यक रूप से कठोर बौद्धिक अपमान नहीं जोड़ता।
- source_word: λύπη
  choice: उदासी
  rationale: प्रसंग में यह सामान्य क्षणिक दुःख से अधिक, मन पर छाई ऐसी उदासी है जो विश्वास और आत्मिक समझ को बाधित करती है।
- source_word: πνευμάτων
  choice: दुष्ट आत्माओं
  rationale: यूनानी में केवल ‘आत्माओं’ है, पर तत्काल कथन ‘सभी आत्माओं से अधिक बुरी’ कहता है; ‘दुष्ट’ प्रसंग से स्पष्ट निहित अर्थ को हिन्दी में सामने लाता है, ताकि पवित्र आत्मा भी इस तुलना में सम्मिलित न समझी जाए।
- source_word: δεινοτάτη
  choice: सबसे भयानक
  rationale: सर्वोच्च रूप की तीव्रता को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καταφθείρει
  choice: नष्ट करती है
  rationale: यह क्रिया गंभीर विनाश या भ्रष्टकारी क्षति व्यक्त करती है; यहाँ ‘नष्ट करती है’ कथन की तीव्रता बनाए रखता है।
- source_word: ἐκτρίβει
  choice: निकाल देती है
  rationale: शब्द का अर्थ घिस डालना, मिटा देना या बाहर निकाल देना हो सकता है। पवित्र आत्मा के साथ और अगले वाक्य में इसी क्रिया तथा ‘बचाने’ के विरोध को देखते हुए ‘निकाल देती है’ सबसे सुबोध है, यद्यपि मूल की अर्थ-छाया पूर्णतः निश्चित नहीं है।
- source_word: σώζει
  choice: बचाती है
  rationale: मूल पाठ के अप्रत्याशित वर्तमानकालीन कथन को प्रश्नात्मक विस्मय सहित यथावत रखा गया है; इसे किसी अधिक सहज धार्मिक निष्कर्ष में नहीं बदला गया।
theological_decisions:
- issue: ‘उदासी’ का पवित्र आत्मा को निकाल देना
  choice: मूल की कठोर भाषा को सीधे रखा गया
  alternative: ‘पवित्र आत्मा के प्रभाव को दबा देती है’
  rationale: वैकल्पिक रूप किसी विशेष धर्मवैज्ञानिक व्याख्या द्वारा कथन को नरम कर देता। यूनानी क्रिया अधिक कठोर है, इसलिए पाठ की वास्तविक तनावपूर्ण भाषा सुरक्षित रखी गई।
- issue: ‘और फिर बचाती भी है?’ का विरोधाभास
  choice: विरोधाभास को प्रश्न के रूप में बनाए रखा
  alternative: इसे सुधारकर ‘और फिर वह उसे बचाता है’ अथवा ‘फिर भी वह बच जाता है’ करना
  rationale: अगली पंक्ति में वक्ता स्वयं पूछता है कि वही चीज कैसे निकाल या नष्ट कर सकती और फिर बचा सकती है। इसलिए कठिनाई मूल संवाद का अभिप्रेत अंग है और उसे चुपचाप हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, मानक और गरिमापूर्ण हिन्दी में रखी गई है। संवाद की तीक्ष्णता के लिए ‘अरे मनुष्य’ और ‘नासमझ’ चुने गए हैं, जबकि वाक्य की मूल धर्मवैज्ञानिक अस्पष्टता तथा विरोधाभास को सुरक्षित रखा गया है।
