base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/002.yaml
  text: “How, lord,” I say, “is it a sister of these? For quick temper seems to me one thing, double‑mindedness another, and sorrow another.”
translation:
  language: hi
  text: मैंने कहा, “प्रभु, यह इन दोनों की बहन कैसे है? क्योंकि तुनकमिज़ाजी मुझे एक बात, दोमनापन दूसरी, और उदासी तीसरी बात लगती है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: क्रोधी स्वभाव
  rationale: यह शब्द शीघ्र भड़क उठने या तुनकमिज़ाजी की प्रवृत्ति बताता है; ‘क्रोधी स्वभाव’ आधुनिक हिन्दी में सहज है और इसे केवल एक क्षण के क्रोध तक सीमित नहीं करता।
- source_word: διψυχία
  choice: मन की दुविधा
  rationale: शाब्दिक अर्थ ‘दो मन वाला होना’ है। ‘मन की दुविधा’ आंतरिक अनिर्णय और विभाजित निष्ठा की मूल अस्पष्टता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λύπη
  choice: उदासी
  rationale: यहाँ λύπη उस टिके रहने वाले मानसिक विषाद को सूचित करता है जिसकी आगे विस्तार से चर्चा है; ‘उदासी’ सामान्य पाठक के लिए सहज है, जबकि ‘शोक’ प्रायः किसी विशिष्ट हानि से जुड़ा समझा जाता है।
- source_word: ἀδελφή
  choice: बहन
  rationale: मूल पाठ दुर्गुणों का मानवीकरण करके उनके निकट संबंध को ‘बहन’ कहता है; उसी रूपक को सीधे बनाए रखा गया है।
- source_word: κύριε
  choice: प्रभु
  rationale: सम्बोधन में आदर और अधिकार दोनों निहित हैं। ‘प्रभु’ बाइबिलीय हिन्दी में स्वाभाविक है, पर यहाँ इसे परमेश्वर की अनिवार्य पहचान घोषित करने के रूप में नहीं लिया गया।
theological_decisions:
- issue: διψυχία में विभाजित मन और संदेह के बीच अर्थगत तनाव
  choice: मन की दुविधा
  alternative: दो मन का होना / संदेह
  rationale: केवल ‘संदेह’ कहने से विभाजित मन या निष्ठा का आयाम दब जाता, जबकि ‘दो मन का होना’ आधुनिक हिन्दी में कृत्रिम लगता है। चुना हुआ पद दोनों संभावनाओं को पर्याप्त रूप से खुला रखता है।
- issue: κύριε से सम्बोधित व्यक्ति की पहचान
  choice: प्रभु
  alternative: स्वामी
  rationale: मूल में κύριε आदरसूचक सम्बोधन है और अपने आप सम्बोधित व्यक्ति को परमेश्वर नहीं ठहराता। हिन्दी में प्रचलित बाइबिलीय सम्बोधन रखा गया है, बिना पहचान को और स्पष्ट किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। तीनों अवस्थाओं का समानांतर विन्यास—‘एक बात… दूसरी… तीसरी’—मूल यूनानी के विरोधात्मक क्रम को स्पष्ट रूप से संजोता है।
