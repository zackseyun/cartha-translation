base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/005.yaml
  text: “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine, but have only believed, and are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age—so all who devote themselves to these do not understand the parables of the divine; for they are darkened by these pursuits and are corrupted and become barren. Just as good vineyards, when they are neglected, become barren from thorns and various weeds, so also the people who have believed and fall into these many pursuits just mentioned are led astray from their understanding, and they understand nothing at all about righteousness. And even when they hear about the divine and the truth, their mind is occupied with their business, and they understand nothing at all.
translation:
  language: hi
  text: “सुनो,” वह कहता है। “जिन लोगों ने कभी सत्य की खोज नहीं की, न परमेश्वर-सम्बन्धी बातों के विषय में जानने का प्रयत्न किया, बल्कि केवल विश्वास किया है, और जो कारोबार, धन-दौलत, अन्यजातियों के साथ मित्रताओं और इस युग के बहुत-से दूसरे कामों में उलझे हुए हैं—जो लोग इन बातों में लगे रहते हैं, वे परमेश्वर-सम्बन्धी उपमाओं को नहीं समझते। क्योंकि इन कामों से उन पर अँधेरा छा जाता है, वे भ्रष्ट हो जाते हैं और बंजर हो जाते हैं। जैसे अच्छे अंगूर के बागों की उपेक्षा होने पर वे काँटों और तरह-तरह की जंगली घास के कारण बंजर हो जाते हैं, वैसे ही जिन लोगों ने विश्वास किया है और ऊपर बताए गए इन अनेक कामों में फँस जाते हैं, वे अपनी समझ से भटकाए जाते हैं और धार्मिकता के विषय में कुछ भी नहीं समझते। यहाँ तक कि जब वे परमेश्वर-सम्बन्धी बातों और सत्य के विषय में सुनते हैं, तब भी उनका मन अपने कारोबार में लगा रहता है, और वे कुछ भी नहीं समझते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεότης
  choice: परमेश्वर-सम्बन्धी बातें
  rationale: इस प्रसंग में शब्द अमूर्त ‘ईश्वरत्व’ की अपेक्षा परमेश्वर से सम्बन्धित सत्य और शिक्षाओं की ओर संकेत करता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: πραγματεῖαι / πρᾶξις
  choice: कारोबार / काम
  rationale: शब्द सांसारिक व्यस्तताओं, लेन-देन और कार्य-व्यापार को समेटते हैं। प्रसंग के अनुसार पहले स्थान पर ‘कारोबार’ और व्यापक उल्लेख में ‘काम’ रखा गया है।
- source_word: φιλίαις ἐθνικαῖς
  choice: मूर्तिपूजक लोगों से मित्रता
  rationale: ἐθνικός यहाँ उस समय के गैर-यहूदी, गैर-मसीही धार्मिक-सामाजिक परिवेश की ओर संकेत करता है। ‘मूर्तिपूजक’ ऐतिहासिक आशय को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: κεχερσωμένοι / χερσοῦνται
  choice: बंजर हो जाते हैं
  rationale: कृषि-रूपक में शब्द ऐसी भूमि या बाग को दर्शाता है जो उपेक्षा के कारण अनुपजाऊ और झाड़ियों से भरा हो गया हो।
- source_word: ἀποπλανῶνται ἀπὸ τῆς διανοίας αὐτῶν
  choice: उनकी समझ भटक जाती है
  rationale: यूनानी अभिव्यक्ति का शाब्दिक भाव अपनी समझ से दूर भटकना है; हिन्दी में यह रूप अर्थ को सहज और संक्षिप्त रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यहाँ नैतिक और धार्मिक सहीपन दोनों निहित हैं; ‘धार्मिकता’ प्रारम्भिक मसीही शिक्षात्मक सन्दर्भ में इस व्यापक अर्थ को बनाए रखती है।
theological_decisions:
- issue: ‘केवल विश्वास किया है’ और फलदायी समझ के बीच तनाव
  choice: ‘बल्कि केवल विश्वास किया है’ को स्पष्ट रूप से बनाए रखा गया
  alternative: ‘बस नाम भर के विश्वासी बने हैं’
  rationale: मूल पाठ विश्वास की वास्तविकता पर सीधे निर्णय नहीं देता, बल्कि खोज और जीवन-दिशा से विहीन विश्वास का वर्णन करता है। वैकल्पिक रूप उनकी आस्था को मात्र दिखावा घोषित कर देता।
- issue: सांसारिक कामों और आध्यात्मिक समझ का सम्बन्ध
  choice: पाठ के कारणात्मक कथन को यथावत रखा गया कि इन कामों से समझ अन्धकारमय और मन व्यस्त होता है
  alternative: हर कारोबार या धन को अपने-आप पाप बताना
  rationale: मूल आलोचना इन वस्तुओं में उलझे रहने और उन्हीं को समर्पित होने की है; किसी विशेष सम्पत्ति-विरोधी सिद्धान्त को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अंगूर के बाग का कृषि-रूपक और ‘बंजर’ की पुनरावृत्ति मूल की संरचना के अनुरूप सुरक्षित है। संवादसूचक शैली भी बनाए रखी गई है।
