  text: 11. “Hear now,” he says, “about the spirit that is earthly and empty and has no power, but is foolish.
translation:
  language: hi
  text: 11. उसने कहा, “अब उस आत्मा के विषय में सुनो जो पार्थिव और रिक्त है, जिसमें कोई सामर्थ्य नहीं है, और जो मूर्ख है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγείου
  choice: पृथ्वी का
  rationale: यह ‘ऊपर से आने वाले’ आत्मा के साथ मूल पाठ के स्थानगत विरोध को बनाए रखता है; ‘सांसारिक’ अनावश्यक नैतिक अर्थ जोड़ सकता था।
- source_word: κενοῦ
  choice: खोखला
  rationale: यह आत्मा की आंतरिक रिक्तता और निष्फलता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δύναμιν μὴ ἔχοντος
  choice: जिसमें कोई सामर्थ्य नहीं है
  rationale: मूल के शक्ति-विहीन होने के स्पष्ट कथन को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: μωροῦ
  choice: मूर्ख
  rationale: मूल के सीधे मूल्यांकन को बिना नरम किए सुरक्षित रखता है।
theological_decisions:
- issue: ἐπίγειος का अर्थ
  choice: पृथ्वी का
  alternative: सांसारिक
  rationale: इस प्रसंग में मुख्य विरोध ‘ऊपर से’ और ‘पृथ्वी का’ है; इसलिए ऐसा शब्द चुना गया जो किसी अतिरिक्त संप्रदायगत या नैतिक व्याख्या को न जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध भाषा। कथन की पुनरुक्त विशेषताओं और आत्मा के विषय में मूल की कठोर भाषा को बनाए रखा गया है।
