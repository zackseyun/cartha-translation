base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/003.yaml
  text: 3. For he, being empty, answers empty men with empty things; for whatever he is asked, he answers according to the emptiness of the person. But he also speaks some true words; for the devil fills him with his own spirit, if perhaps he may be able to tear away some of the righteous.
translation:
  language: hi
  text: 3. क्योंकि वह स्वयं खोखला है, इसलिए वह खोखले लोगों को खोखली बातें ही उत्तर में देता है; क्योंकि उससे जो कुछ पूछा जाता है, उसका उत्तर वह उस व्यक्ति के खोखलेपन के अनुसार देता है। फिर भी वह कुछ सच्ची बातें भी कहता है, क्योंकि शैतान उसे अपनी आत्मा से भर देता है, कि शायद वह धर्मियों में से किसी को तोड़ सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κενός / κενά / κενοῖς / κένωμα
  choice: खोखला / खोखली बातें / खोखले लोग / खोखलापन
  rationale: मूल में एक ही शब्द-मूल की जानबूझकर की गई पुनरावृत्ति है। ‘खोखला’ व्यक्ति की आंतरिक रिक्तता और उसके उत्तरों की निष्फलता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποκρίνεται
  choice: उत्तर देता है
  rationale: प्रश्नोत्तर के प्रसंग में इसका सीधा और स्वाभाविक अर्थ यही है।
- source_word: ῥήματα ἀληθῆ
  choice: सच्ची बातें
  rationale: यहाँ ῥήματα कथनों या वचनों को दर्शाता है; आधुनिक सामान्य हिन्दी में ‘सच्ची बातें’ स्पष्ट और सहज है।
- source_word: ῥῆξαι
  choice: तोड़कर अलग कर दे
  rationale: क्रिया का मूल भाव फाड़ने या तोड़ देने का है; प्रसंग में धर्मियों को विश्वास-समुदाय अथवा दृढ़ता से अलग कर देने की हिंसक छवि को बनाए रखा गया है।
- source_word: τῶν δικαίων
  choice: धर्मियों में से
  rationale: प्रारम्भिक मसीही नैतिक-धार्मिक प्रयोग के अनुरूप पारंपरिक किंतु सुबोध पद चुना गया है।
theological_decisions:
- issue: झूठे भविष्यवक्ता द्वारा कुछ सत्य बातें कहने और शैतानी प्रेरणा का संबंध
  choice: 'दोनों कथनों को मूल के तनाव सहित रखा गया: वह कुछ सच्ची बातें कहता है, क्योंकि शैतान उसे अपनी आत्मा से भर देता है।'
  alternative: ‘सच्ची जैसी बातें’ कहकर सत्यता को कम करना
  rationale: मूल पाठ ῥήματα ἀληθῆ स्पष्ट रूप से ‘सच्ची बातें’ कहता है। अनुवाद ने इस असहज धर्मवैचारिक तनाव को हल्का या समाप्त नहीं किया।
- issue: εἴ τινα δυνήσεται की संभाव्यता
  choice: ‘ताकि यदि संभव हो तो’
  alternative: ‘जिससे वह अवश्य’
  rationale: मूल में प्रयत्न और अनिश्चित संभावना का भाव है; परिणाम को निश्चित नहीं बनाया गया।
- issue: ῥῆξαι का लक्ष्य
  choice: ‘धर्मियों में से किसी को तोड़कर अलग कर दे’
  alternative: ‘किसी धर्मी को नष्ट कर दे’
  rationale: ‘नष्ट करना’ मूल की फाड़ने/तोड़ने की विशिष्ट छवि को मिटा देता; ‘अलग’ प्रसंगगत आशय बताता है, पर किसी विशिष्ट सांप्रदायिक सिद्धांत को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। मूल यूनानी में κενός-समूह की तीखी पुनरावृत्ति को ‘खोखला’ शब्द-समूह से सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
