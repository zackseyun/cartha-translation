base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/017.yaml
  text: 21. You see, then, that things from above, though very small when they fall upon the earth, have great power; so also the divine spirit that comes from above is powerful. Trust in this spirit, but keep away from the other.”
translation:
  language: hi
  text: 21. इसलिए तुम देखते हो कि ऊपर से आने वाली छोटी-से-छोटी चीज़ें भी जब पृथ्वी पर गिरती हैं, तो उनमें बड़ी सामर्थ्य होती है। इसी प्रकार ऊपर से आने वाला दिव्य आत्मा भी सामर्थी है। इसलिए इसी आत्मा पर विश्वास रखो और दूसरे से दूर रहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἄνωθεν
  choice: ऊपर से आने वाली ... चीज़ें
  rationale: वाक्य 20 के ओले और पानी की बूँद के उदाहरणों को समेटते हुए मूल के स्थान-सूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλάχιστα
  choice: छोटी-से-छोटी
  rationale: अत्यल्प आकार पर दिए गए बल को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: μεγάλην δύναμιν ἔχει
  choice: उनमें बड़ी सामर्थ्य होती है
  rationale: δύναμις के प्रभावकारी बल को गरिमापूर्ण और प्रसंगानुकूल भाषा में व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: दिव्य आत्मा
  rationale: मूल की अभिव्यक्ति को बिना अतिरिक्त त्रिएकवादी या संप्रदायगत पहचान जोड़े सीधे रूप में रखता है।
- source_word: πίστευε
  choice: विश्वास रखो
  rationale: आज्ञार्थक वर्तमान का निरंतर भरोसा रखने वाला भाव स्वाभाविक हिन्दी में देता है।
- source_word: ἀπέχου
  choice: दूर रहो
  rationale: हानिकारक दूसरे आत्मा से अपने को अलग रखने की निरंतर आज्ञा को स्पष्ट करता है।
theological_decisions:
- issue: ‘दिव्य आत्मा’ की पहचान
  choice: दिव्य आत्मा
  alternative: पवित्र आत्मा
  rationale: इस पद में यूनानी पाठ θεῖον (‘दिव्य’) कहता है, ἅγιον (‘पवित्र’) नहीं; इसलिए लेखक की शब्दावली और संभावित व्यापक अर्थ को सुरक्षित रखा गया है।
- issue: ‘दूसरे’ का संदर्भ
  choice: दूसरे से दूर रहो
  alternative: दूसरे आत्मा से दूर रहो
  rationale: मूल τὸ ἕτερον में संज्ञा निहित है और पूर्ववर्ती संदर्भ से ‘आत्मा’ समझ में आता है; संक्षिप्तता और मूल की संदर्भाधीन अभिव्यक्ति बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक उपदेश के अनुकूल। मूल की तुलना, आदेश और ‘ऊपर से’ आने वाली सामर्थ्य की छवि सुरक्षित रखी गई है।
