base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/006.yaml
  text: 6. But the spirit that is consulted and speaks according to the desires of men is earthly and light, having no power; and it does not speak at all unless it is consulted.
translation:
  language: hi
  text: 6. परन्तु जिस आत्मा से प्रश्न किया जाता है और जो मनुष्यों की इच्छाओं के अनुसार बोलती है, वह पार्थिव और हल्की है; उसमें कोई सामर्थ्य नहीं। और जब तक उससे प्रश्न न किया जाए, वह बिलकुल नहीं बोलती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τὸ ἐπερωτώμενον
  choice: जिस आत्मा से पूछताछ की जाती है
  rationale: कर्मवाच्य भाव को बनाए रखते हुए उस आत्मा का चित्र प्रस्तुत करता है जिससे लोग उत्तर पाने के लिए प्रश्न करते हैं।
- source_word: κατὰ τὰς ἐπιθυμίας τῶν ἀνθρώπων
  choice: मनुष्यों की अभिलाषाओं के अनुसार
  rationale: ἐπιθυμίαι यहाँ लोगों की चाहतों या इच्छाओं को सूचित करता है; ‘अभिलाषाओं’ से नैतिक संदर्भ भी बना रहता है।
- source_word: ἐπίγειον
  choice: पृथ्वी की
  rationale: ऊपर से आने वाले दिव्य आत्मा के साथ पाठ में निहित विरोध को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἐλαφρόν
  choice: हल्की
  rationale: मूल रूपक को सुरक्षित रखता है; संदर्भ में इसका आशय महत्वहीन या अस्थिर भी हो सकता है, पर अनुवाद उस अर्थ को निर्णायक रूप से नहीं थोपता।
- source_word: δύναμιν μὴ ἔχον
  choice: उसमें कोई सामर्थ्य नहीं
  rationale: दिव्य आत्मा की δύναμις के साथ विरोध बनाए रखने के लिए धार्मिक साहित्य में सहज ‘सामर्थ्य’ चुना गया है।
- source_word: ὅλως οὐ λαλεῖ
  choice: वह बिलकुल नहीं बोलती
  rationale: ὅλως के प्रबल निषेध को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘आत्मा’ की प्रकृति
  choice: ‘आत्मा’ को बिना अतिरिक्त पहचान दिए रखा गया
  alternative: ‘दुष्ट आत्मा’ या ‘झूठी भविष्यवाणी की आत्मा’
  rationale: इस पद में लेखक इसे पृथ्वी की, हल्की और सामर्थ्यहीन कहता है, पर सीधे ‘दुष्ट’ नहीं कहता; इसलिए अतिरिक्त धर्मवैज्ञानिक वर्गीकरण नहीं जोड़ा गया।
- issue: ἐλαφρόν का आशय
  choice: ‘हल्की’ के रूप में रूपक सुरक्षित रखा
  alternative: ‘तुच्छ’, ‘चंचल’ या ‘अस्थिर’
  rationale: यूनानी शब्द में हल्केपन के साथ तुच्छता या अस्थिरता की छाया संभव है; शाब्दिक रूपक पाठ की वास्तविक अर्थ-व्याप्ति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य-संरचना मूल यूनानी के विरोधात्मक और क्रमिक बल को बनाए रखती है।
