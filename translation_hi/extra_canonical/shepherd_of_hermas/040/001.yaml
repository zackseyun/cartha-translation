  text: 1. He showed me men sitting on a bench, and another man sitting on a chair. And he says to me, “Do you see the ones sitting on the bench?” “I see, sir,” I say. “These,” he says, “are faithful; and the one sitting on the chair is a false prophet who destroys the understanding of the servants of God—of the double‑minded, not of the faithful.
translation:
  language: hi
  text: 1. उसने मुझे कुछ लोगों को एक बेंच पर बैठे हुए और एक और व्यक्ति को एक आसन पर बैठे हुए दिखाया। फिर वह मुझसे कहता है, “क्या तुम उन लोगों को देखते हो जो बेंच पर बैठे हैं?” मैं कहता हूँ, “मैं देखता हूँ, स्वामी।” वह कहता है, “ये विश्वासी हैं; और जो आसन पर बैठा है, वह एक झूठा भविष्यद्वक्ता है, जो परमेश्वर के सेवकों की समझ को नष्ट करता है—अर्थात् दो-मन वालों की, विश्वासियों की नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψελλίου
  choice: बेंच
  rationale: यह कई व्यक्तियों के साथ बैठने की साधारण लंबी चौकी को दर्शाता है और आधुनिक हिन्दी में सहज है।
- source_word: καθέδραν
  choice: आसन
  rationale: यह एक व्यक्ति की अलग, विशिष्ट सीट है; ‘आसन’ बेंच के साथ मूल पाठ का अंतर बनाए रखता है।
- source_word: πιστοί
  choice: विश्वासी
  rationale: यह उन लोगों के लिए स्वाभाविक धार्मिक पद है जो विश्वास में स्थिर हैं।
- source_word: διάνοιαν
  choice: समझ
  rationale: यहाँ शब्द मन की समझ और विचार-शक्ति को सूचित करता है; ‘समझ’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: διψύχων
  choice: दो मन वाले
  rationale: यह मूल के ‘दो-मन/दो-चित्त’ भाव को स्पष्ट, वर्तमान हिन्दी में रखता है और उनकी अस्थिर निष्ठा को समय से पहले किसी संकीर्ण अर्थ में नहीं बाँधता।
- source_word: ψευδοπροφήτης
  choice: झूठा भविष्यद्वक्ता
  rationale: यह स्थापित और पारदर्शी धार्मिक शब्दावली है तथा झूठा दावा करने वाले भविष्यद्वक्ता का भाव बनाए रखती है।
- source_word: κύριε
  choice: स्वामी
  rationale: वक्ता के प्रति सम्मान व्यक्त करता है, पर संबोधित व्यक्ति को अनिवार्य रूप से परमेश्वर ठहराने वाला ‘प्रभु’ नहीं चुनता।
theological_decisions:
- issue: झूठे भविष्यद्वक्ता के प्रभाव की सीमा
  choice: ‘विश्वासियों की नहीं, बल्कि दो मन वाले लोगों की’
  alternative: सभी परमेश्वर के सेवकों की समझ नष्ट करना
  rationale: यूनानी पाठ पहले व्यापक कथन करता है और फिर स्पष्ट करता है कि विनाश दो मन वालों का होता है, विश्वासियों का नहीं; अनुवाद इस तनाव और स्पष्टीकरण दोनों को बनाए रखता है।
- issue: ἀπόλλυσι का बल
  choice: ‘समझ नष्ट कर देता है’
  alternative: ‘समझ बिगाड़ देता है’
  rationale: मूल क्रिया प्रबल है और नाश/विनाश का अर्थ देती है; हल्का ‘बिगाड़ना’ उसके बल को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कथन-विन्यास में यूनानी का वर्तमानकालीन संवाद (‘कहता है’) बनाए रखा गया है, जबकि दर्शन-दृश्य का आरंभ स्वाभाविक भूतकाल में है।
