base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/012.yaml
  text: 12. First, that man who seems to have a spirit exalts himself and wants to have the first seat; and immediately he is presumptuous and shameless and talkative, and lives among many luxuries and many other deceits, and he receives payment for his prophecy; and if he does not receive it, he does not prophesy. Can a divine spirit receive payment and prophesy? A prophet of God cannot do this; rather, the spirit of such prophets is earthly.
translation:
  language: hi
  text: 12. सबसे पहले, वह मनुष्य जो आत्मा रखने वाला प्रतीत होता है, अपने आपको ऊँचा उठाता है और सबसे प्रमुख स्थान पाना चाहता है। वह तुरंत धृष्ट, निर्लज्ज और बहुत बोलनेवाला होता है, और बहुत-सी विलासिताओं तथा बहुत-से अन्य छल-कपटों में जीवन बिताता है। वह अपनी भविष्यवाणी के लिए पारिश्रमिक लेता है; और यदि उसे पारिश्रमिक न मिले, तो वह भविष्यवाणी नहीं करता। क्या कोई दैवी आत्मा पारिश्रमिक लेकर भविष्यवाणी कर सकता है? परमेश्वर का भविष्यद्वक्ता ऐसा नहीं कर सकता; बल्कि ऐसे भविष्यद्वक्ताओं की आत्मा सांसारिक होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δοκῶν πνεῦμα ἔχειν
  choice: जो ऐसा दिखाई देता है कि उसमें कोई आत्मा है
  rationale: δοκῶν की अनिश्चितता को बनाए रखा गया है; कथन उसके दावे को सत्य मानकर नहीं चलता। πνεῦμα को प्रसंगानुसार ‘आत्मा’ रखा गया है।
- source_word: πρωτοκαθεδρίαν
  choice: सबसे प्रमुख स्थान
  rationale: शब्द का आशय केवल भौतिक पहली सीट नहीं, बल्कि सभा में प्रतिष्ठा और प्रधानता का स्थान भी है।
- source_word: ἰταμός
  choice: धृष्ट
  rationale: यह उसकी उतावली, ढीठ और दुस्साहसी प्रवृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τρυφαῖς πολλαῖς ἀναστρεφόμενος
  choice: बहुत-सी विलासिताओं ... में जीवन बिताता है
  rationale: ἀναστρέφομαι जीवन-व्यवहार को और τρυφή भोग-विलास को सूचित करता है।
- source_word: μισθὸν
  choice: पारिश्रमिक
  rationale: यह भविष्यवाणी के बदले लिए जाने वाले भुगतान को स्पष्ट करता है, बिना आधुनिक वेतन-संबंध का अनावश्यक संकेत दिए।
- source_word: ἐπίγειον
  choice: सांसारिक
  rationale: यह ऊपर से आने वाले दैवी आत्मा के विपरीत धरती से संबंधित, अधम आत्मा का भाव व्यक्त करता है।
theological_decisions:
- issue: भविष्यवाणी के बदले भुगतान और दैवी आत्मा
  choice: 'प्रश्न को मूल पाठ की तीखी असंगति के रूप में रखा गया: ‘क्या कोई दैवी आत्मा पारिश्रमिक लेकर भविष्यवाणी कर सकता है?’'
  alternative: इसे सामान्य निषेध के रूप में विस्तार देना कि सभी धार्मिक सेवाओं के लिए हर प्रकार का आर्थिक सहयोग निषिद्ध है
  rationale: मूल प्रसंग विशेष रूप से उस झूठे भविष्यद्वक्ता की निंदा करता है जो भुगतान न मिलने पर भविष्यवाणी नहीं करता; इससे अधिक व्यापक सिद्धांत पाठ में जोड़ना उचित नहीं।
- issue: झूठे भविष्यद्वक्ता में कार्यरत आत्मा की प्रकृति
  choice: ‘ऐसे भविष्यद्वक्ताओं में जो आत्मा है, वह सांसारिक है’
  alternative: उसे सीधे ‘दुष्टात्मा’ या ‘शैतान’ कहना
  rationale: इस पद में यूनानी पाठ ἐπίγειον कहता है; अधिक विशिष्ट पहचान जोड़ने से मूल की अभिव्यक्ति और उसका तनाव मिट जाएगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है, पर आत्मा के दावे, प्रतिष्ठा की चाह, भुगतान-निर्भर भविष्यवाणी और ‘सांसारिक’ आत्मा के बीच मूल विरोध सुरक्षित रखा गया है।
