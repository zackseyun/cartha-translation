translation:
  language: hi
  text: 10. इस प्रकार दैवी आत्मा प्रकट होगी। प्रभु की दैवी आत्मा की सामर्थ्य यही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς θεότητος
  choice: परमेश्वर का आत्मा
  rationale: शाब्दिक ‘ईश्वरत्व का आत्मा’ आधुनिक हिन्दी में अस्वाभाविक और अस्पष्ट है; प्रसंग में यह परमेश्वर से आने वाले आत्मा को दर्शाता है।
- source_word: φανερὸν ἔσται
  choice: प्रकट होगा
  rationale: भविष्यकाल और आत्मा की पहचान स्पष्ट हो जाने—दोनों भावों को सहज हिन्दी में रखता है।
- source_word: ἡ δύναμις αὕτη
  choice: सामर्थ्य ऐसी ही होती है
  rationale: पिछले पद में वर्णित आत्मा के कार्य करने के ढंग की ओर संकेत को बनाए रखता है।
theological_decisions:
- issue: τὸ πνεῦμα τῆς θεότητος और τοῦ πνεύματος τῆς θεότητος τοῦ Κυρίου का संबंध
  choice: ‘परमेश्वर का आत्मा’ और ‘प्रभु का परमेश्वरीय आत्मा’
  alternative: ‘ईश्वरत्व का आत्मा’ और ‘प्रभु के ईश्वरत्व का आत्मा’
  rationale: चुना हुआ रूप स्वाभाविक हिन्दी है और आत्मा के दिव्य स्रोत को व्यक्त करता है, बिना बाद की किसी विशिष्ट त्रित्ववादी शब्दावली को पाठ पर आरोपित किए।
- issue: दूसरे वाक्य की संक्षिप्त और कुछ असामान्य यूनानी रचना
  choice: 'इसे पिछले वर्णन का सार बताते हुए अनुवादित किया गया: ‘सामर्थ्य ऐसी ही होती है।’'
  alternative: ‘प्रभु के परमेश्वरीय आत्मा की सामर्थ्य के विषय में इतना ही।’
  rationale: ὅση ... ἡ δύναμις αὕτη की संकेतात्मकता को बनाए रखते हुए इसे अनावश्यक रूप से निश्चित सिद्धान्त-वाक्य नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘आत्मा’ को पुल्लिंग व्याकरण के अनुसार रखा गया है; वाक्य संक्षिप्त रखे गए हैं ताकि मूल अनुच्छेद की निष्कर्षात्मक शैली बनी रहे।
