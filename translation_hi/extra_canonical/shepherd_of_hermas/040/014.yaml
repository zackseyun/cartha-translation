  rationale: उपलब्ध अंश में ऐसा कोई प्रसंग नहीं है जो इसे परमेश्वर के निवास के अर्थ में निश्चित करे; इसलिए अनावश्यक धर्मवैज्ञानिक विशिष्टता से बचते हुए भौतिक/सामान्य अर्थ रखा गया है।
