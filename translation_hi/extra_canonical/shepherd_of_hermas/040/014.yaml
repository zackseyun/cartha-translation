  rationale: अलग-थलग मिले इस कर्मकारक रूप का मूल अर्थ ‘आकाश/स्वर्ग’ हो सकता है। प्रसंग का शेष वाक्य उपलब्ध न होने के कारण ‘आकाश’ अपेक्षाकृत तटस्थ और स्वाभाविक विकल्प है। वर्ग कोष्ठक पाठ के खंडित स्वरूप को सुरक्षित रखते हैं।
