base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/013.yaml
  text: 13. Then, he does not come near a gathering of righteous men at all, but avoids them. He clings to the double‑minded and the empty, and he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily; for he also answers the empty. For an empty vessel, placed together with empty ones, is not broken, but they agree with one another.
translation:
  language: hi
  text: 13. फिर वह धर्मी लोगों की सभा के पास तनिक भी नहीं आता, बल्कि उनसे दूर भागता है। वह दुविधा में पड़े और खोखले लोगों से चिपका रहता है और किसी कोने में उनसे भविष्यवाणी करता है। वह उनकी इच्छाओं के अनुसार सब कुछ खोखलेपन से कहकर उन्हें धोखा देता है, क्योंकि वह खोखले लोगों को खोखले उत्तर ही देता है। जब एक खाली बरतन दूसरे खाली बरतनों के साथ रखा जाता है, तो वह टूटता नहीं; बल्कि वे आपस में मेल खाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγὴν ἀνδρῶν δικαίων
  choice: धर्मी लोगों की सभा
  rationale: यहाँ συναγωγή सामान्य एकत्रित सभा को दर्शाता है; ‘आराधनालय’ कहना संदर्भ को अनावश्यक रूप से संस्थागत बना देता।
- source_word: διψύχοις
  choice: दुविधा में पड़े
  rationale: शाब्दिक अर्थ ‘दो मन वाले’ है; आधुनिक हिन्दी में यह चुनाव और विश्वास में अस्थिरता का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κενοῖς / κενῶς
  choice: खोखले लोगों / खोखली बातें
  rationale: κενός में खालीपन के साथ निरर्थकता और आध्यात्मिक सारहीनता भी है; ‘खोखला’ इस शब्द-खेल को बनाए रखता है।
- source_word: κατὰ γωνίαν
  choice: किसी कोने में
  rationale: यूनानी मुहावरे का स्थानिक और गुप्तता-सूचक चित्र सुरक्षित रखा गया है।
- source_word: κολλᾶται
  choice: चिपका रहता है
  rationale: क्रिया का प्रबल आसक्ति और संगति का भाव रखा गया है।
- source_word: συντιθέμενον
  choice: साथ रखा जाता है
  rationale: बरतन के रूपक में स्वाभाविक हिन्दी देते हुए साथ जोड़े या रखे जाने का अर्थ व्यक्त किया गया है।
theological_decisions:
- issue: ‘दुविधा में पड़े’ लोगों की पहचान
  choice: इसे विश्वास में अस्थिर लोगों के सामान्य वर्णन के रूप में रखा गया
  alternative: ‘दोहरे मन वाले’ या किसी निश्चित धार्मिक वर्ग का नाम
  rationale: δίψυχος नैतिक-आध्यात्मिक अस्थिरता दर्शाता है; पाठ इसे किसी औपचारिक संप्रदाय या वर्ग की तकनीकी संज्ञा नहीं बनाता।
- issue: ‘भविष्यवाणी’ का स्वरूप
  choice: ‘भविष्यवाणी सुनाता है’
  alternative: ‘भविष्य बताता है’
  rationale: προφητεύει केवल भविष्य-कथन तक सीमित नहीं है; व्यापक भविष्यवाणी-संबंधी कथन का अर्थ खुला रखा गया है।
- issue: खाली बरतन का रूपक
  choice: रूपक को प्रत्यक्ष रूप में बनाए रखा गया
  alternative: अर्थ खोलकर ‘सारहीन लोग एक-दूसरे से सहमत रहते हैं’
  rationale: मूल पाठ का व्यंग्यपूर्ण चित्र और κενοῖς की पुनरावृत्ति धर्मवैचारिक एवं साहित्यिक तनाव बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। मूल के ‘खाली/खोखले’ शब्द-खेल को यथासंभव बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
