  source_fidelity: Draft is substantially faithful to the Greek and follows the English audit trail closely. However, πάντα κενῶς ('everything ... emptily') is reduced to 'खोखली बातें', which omits the emphatic 'everything' and slightly shifts the adverbial force.
  naturalness: The Hindi is clear, modern, and suitably dignified. 'दुविधा में पड़े' naturally conveys δίψυχοι. A small recasting makes the clause with 'सब कुछ' more natural while retaining the original's emphasis.
  terminology: ‘धर्मी लोगों की सभा’ appropriately renders συναγωγὴν ἀνδρῶν δικαίων without unnecessarily institutionalizing it. ‘भविष्यवाणी करता है’ preserves the broad sense of προφητεύει. ‘खोखले’ effectively conveys the repeated, figurative κενός language; the vessel image is retained with ‘खाली बरतन.’
