base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/008.yaml
  text: 8. First of all, the one who has the [divine] spirit from above is gentle and quiet and humble‑minded, and refrains from every evil and from the vain desire of this age, and makes himself lower than all people; and when consulted he answers nothing to anyone, nor does he speak privately—nor does the holy Spirit speak whenever a person wishes it to speak—but it speaks when God wishes him to speak.
translation:
  language: hi
  text: 8. सबसे पहले, जिस व्यक्ति में ऊपर से आया [ईश्वरीय][a] आत्मा है, वह नम्र, शांत और दीन मन का होता है। वह हर प्रकार की बुराई और इस युग की व्यर्थ अभिलाषा से दूर रहता है, और अपने आपको सब लोगों से छोटा मानता है। पूछे जाने पर वह किसी को कोई उत्तर नहीं देता और न एकांत में बोलता है—न ही पवित्र आत्मा तब बोलता है, जब कोई मनुष्य बोलना चाहता है—बल्कि वह तभी बोलता है, जब परमेश्वर चाहता है कि वह व्यक्ति बोले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन पाठ-साक्ष्यों में यहाँ “ईश्वरीय” शब्द नहीं है; तब अर्थ होगा: “जिस व्यक्ति में ऊपर से आया आत्मा है।”'
    reason: मूल संस्करण में τὸ θεῖον को कोष्ठकों में रखकर पाठगत अनिश्चितता दिखाई गई है।
lexical_decisions:
- source_word: πραΰς
  choice: नम्र
  rationale: यहाँ स्वभाव की कोमलता और आत्म-संयम का भाव है; आधुनिक हिन्दी में ‘नम्र’ सहज और गरिमापूर्ण है।
- source_word: ἡσύχιος
  choice: शांत
  rationale: व्यक्ति के शांत, अविक्षुब्ध आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ταπεινόφρων
  choice: दीन मन का
  rationale: मन की विनम्रता और अपने को ऊँचा न समझने का भाव सुरक्षित रखता है।
- source_word: ἀπεχόμενος
  choice: दूर रहता है
  rationale: बुराई और व्यर्थ अभिलाषा से जानबूझकर परहेज़ करने का अर्थ स्पष्ट करता है।
- source_word: ἐπιθυμίας ματαίας
  choice: व्यर्थ अभिलाषा
  rationale: इच्छा के नैतिक संदर्भ और उसकी निष्फलता, दोनों को बनाए रखता है।
- source_word: ἑαυτὸν ἐνδεέστερον ποιεῖ
  choice: अपने आपको ... छोटा मानता है
  rationale: शाब्दिक ‘अधिक अभावग्रस्त बनाता है’ इस प्रसंग में सामाजिक-आत्मिक दीनता की ओर संकेत करता है; यह हिन्दी रूप उसी भाव को सहजता से देता है।
- source_word: κατὰ μόνας
  choice: एकांत में
  rationale: अलग या निजी रूप से बोलने का अर्थ संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: τὸ πνεῦμα [τὸ θεῖον] में पाठांतर
  choice: '[ईश्वरीय] को कोष्ठक और पाद-टिप्पणी सहित रखा'
  alternative: केवल ‘आत्मा’ या बिना संकेत ‘ईश्वरीय आत्मा’
  rationale: स्रोत संस्करण में τὸ θεῖον को पाठगत अनिश्चितता के साथ रखा गया है; अनुवाद में इसे न हटाया गया है, न निर्विवाद बनाया गया है।
- issue: अंतिम वाक्य में आत्मा और व्यक्ति के बोलने का संबंध
  choice: ‘जब परमेश्वर उस व्यक्ति से बुलवाना चाहता है’
  alternative: ‘जब परमेश्वर चाहता है कि आत्मा बोले’
  rationale: यूनानी αὐτὸν ... λαλῆσαι का व्याकरणिक संकेत व्यक्ति की ओर है, जबकि पूर्ववाक्य में पवित्र आत्मा कर्ता है। चुना हुआ रूप इस तनाव को यथासंभव बनाए रखता और हिन्दी में अर्थगम्य रहता है।
- issue: पवित्र आत्मा की इच्छा और मानवीय नियंत्रण
  choice: मानवीय इच्छा से न बोलने और परमेश्वर की इच्छा पर बोलने का स्पष्ट विरोध रखा
  alternative: सामान्यीकृत रूप में ‘वह अपनी इच्छा से नहीं बोलता’
  rationale: मूल पाठ का प्रमुख धर्मवैचारिक बल यह है कि सच्ची भविष्यवाणी मानवीय माँग या नियंत्रण से संचालित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण धार्मिक शैली। वाक्य-विन्यास को पठनीय बनाया गया है, पर मूल के गुण-सूचीबद्ध स्वरूप, निषेधों और परमेश्वर की इच्छा पर बल को सुरक्षित रखा गया है।
