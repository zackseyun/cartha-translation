base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/005.yaml
  text: 5. For no spirit given from God is consulted, but, having the power of the Deity, it speaks everything from itself, because it is from above, from the power of the divine Spirit.
translation:
  language: hi
  text: 5. क्योंकि परमेश्वर से मिला कोई भी आत्मा ऐसा नहीं है जिससे परामर्श लिया जाए; बल्कि, दैवत्व की सामर्थ्य रखता हुआ, वह स्वयं सब कुछ बोलता है, क्योंकि वह ऊपर से, दिव्य आत्मा की सामर्थ्य से, आता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν ... πνεῦμα ἀπὸ Θεοῦ δοθέν
  choice: परमेश्वर की ओर से दिया गया कोई भी आत्मा
  rationale: यूनानी वाक्यांश की व्यापकता और दैवी स्रोत दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οὐκ ἐπερωτᾶται
  choice: पूछे जाने पर नहीं बोलता
  rationale: शाब्दिक अर्थ ‘उससे पूछा नहीं जाता’ है, पर संदर्भ में विरोध उस आत्मा से है जो प्रश्न किए जाने पर ही उत्तर देता है; चुना हुआ रूप अभिप्रेत क्रियात्मक अर्थ स्पष्ट करता है।
- source_word: τὴν δύναμιν τῆς θεότητος
  choice: दैवी सामर्थ्य
  rationale: θεότης का अर्थ ‘ईश्वरत्व/दैवत्व’ है; ‘दैवी सामर्थ्य’ आधुनिक हिन्दी में सहज है और ईश्वर से प्राप्त शक्ति का आशय बनाए रखता है।
- source_word: ἀφ’ ἑαυτοῦ λαλεῖ πάντα
  choice: अपने आप सब कुछ बोलता है
  rationale: यह बताता है कि वाणी मानवीय पूछताछ से प्रेरित नहीं होती; ‘अपनी शक्ति से’ कहना स्रोत-विरोधी स्वतंत्रता का अर्थ दे सकता था।
- source_word: ἄνωθέν ἐστιν
  choice: वह ऊपर से ... आता है
  rationale: ἄνωθεν की स्थानिक और दैवी-स्रोत संबंधी छवि को बनाए रखते हुए हिन्दी में पूर्ण वाक्य बनाया गया है।
- source_word: ἀπὸ τῆς δυνάμεως τοῦ θείου πνεύματος
  choice: दिव्य आत्मा की सामर्थ्य से
  rationale: मूल की पुनरुक्ति और πνεῦμα के आत्मा-संबंधी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: क्या ‘अपने आप’ का अर्थ परमेश्वर से स्वतंत्र होकर बोलना है?
  choice: वाक्य में ‘क्योंकि वह ऊपर से—दिव्य आत्मा की सामर्थ्य से—आता है’ बनाए रखा गया
  alternative: ‘स्वतः बोलता है’ या ‘अपने अधिकार से बोलता है’
  rationale: मूल पाठ मानवीय प्रश्न पर निर्भरता का निषेध करता है, परमेश्वर से स्वतंत्रता का दावा नहीं; अंतिम उपवाक्य दैवी स्रोत स्पष्ट करता है।
- issue: θεότης और θεῖον πνεῦμα की प्रस्तुति
  choice: क्रमशः ‘दैवी सामर्थ्य’ और ‘दिव्य आत्मा की सामर्थ्य’
  alternative: ‘ईश्वरत्व की शक्ति’ और ‘पवित्र आत्मा की शक्ति’
  rationale: ‘ईश्वरत्व’ अधिक तकनीकी है, जबकि मूल में यहाँ ἅγιον नहीं बल्कि θεῖον है; इसलिए ‘पवित्र आत्मा’ जोड़कर पाठ को अधिक विशिष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। मूल की दैवी-स्रोत संबंधी भाषा और प्रश्न-निर्भर झूठी भविष्यवाणी के साथ निहित विरोध को सुरक्षित रखा गया है।
