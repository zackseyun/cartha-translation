  text: 19. “How,” I say, “sir, can these things be? For you have said both these things are impossible.” “As these, then, are impossible, so also the spirits that are earthly are impossible and inert.
translation:
  language: hi
  text: 19. मैंने कहा, “स्वामी, ये बातें कैसे हो सकती हैं? क्योंकि आपने कहा है कि ये दोनों ही असंभव हैं।” उन्होंने कहा, “जिस प्रकार ये बातें असंभव हैं, उसी प्रकार पार्थिव आत्माएँ भी असमर्थ[a] और निष्क्रिय हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ वही शब्द है जिसका अनुवाद पिछले वाक्य में “असंभव” किया गया है। पार्थिव आत्माओं के विषय में उसका आशय “असमर्थ” या “शक्तिहीन” है।
    reason: मूल में एक ही शब्द के पुनरुक्त प्रयोग और संदर्भानुसार उसके अर्थ-परिवर्तन को स्पष्ट करना।
lexical_decisions:
- source_word: κύριε
  choice: स्वामी
  rationale: संबोधन में सम्मान और अधीनता का भाव है; यहाँ वक्ता दर्शन में बोलने वाले से बात कर रहा है, इसलिए ‘स्वामी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τὰ πνεύματα τὰ ἐπίγεια
  choice: पृथ्वी की आत्माएँ
  rationale: ἐπίγεια का अर्थ ‘पार्थिव/पृथ्वी से संबंधित’ है; निकटवर्ती संदर्भ में इनका विरोध ऊपर से आने वाले दिव्य आत्मा से है। ‘पृथ्वी की’ साधारण पाठक के लिए स्पष्ट है।
- source_word: ἀδύνατα
  choice: असंभव / सामर्थ्यहीन
  rationale: यूनानी में एक ही शब्द पहले बताई गई बातों के लिए ‘असंभव’ और फिर आत्माओं के लिए ‘सामर्थ्यहीन’ अर्थ में प्रयुक्त होकर शब्दालंकार बनाता है। हिन्दी में अर्थ स्पष्ट रखने के लिए संदर्भानुसार दो अलग शब्द चुने गए हैं।
- source_word: ἀδρανῆ
  choice: निष्क्रिय
  rationale: शब्द का आशय प्रभावहीन, कार्य न करने वाला या निष्क्रिय है; ‘निष्क्रिय’ संक्षिप्त और संदर्भानुकूल है।
theological_decisions:
- issue: ‘पृथ्वी की आत्माओं’ की सामर्थ्यहीनता
  choice: पाठ के दावे को सीधे रूप में रखा गया है कि वे ‘सामर्थ्यहीन और निष्क्रिय’ हैं।
  alternative: इसे ‘दुष्टात्माएँ अस्तित्वहीन हैं’ या ‘बिल्कुल कोई प्रभाव नहीं रखतीं’ के रूप में समझाना।
  rationale: मूल पाठ उनके अस्तित्व का निषेध नहीं करता; वह ऊपर से आने वाली दिव्य शक्ति के मुकाबले उनकी अक्षमता और निष्क्रियता पर बल देता है। अनुवाद इस तनाव को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संवादात्मक पर गरिमापूर्ण शैली। वाक्य-रचना सरल रखी गई है और मूल के प्रश्नोत्तर रूप को बनाए रखा गया है।
