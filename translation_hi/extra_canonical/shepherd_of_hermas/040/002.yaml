  text: 2. These, then, the double‑minded, come to him as to a magician and ask him what will happen to them; and that false prophet, having in himself no power of a divine spirit, speaks with them according to their questions [and according to the desires of their wickedness], and fills their souls as they desire.
translation:
  language: hi
  text: 2. इसलिए ये दुचित्ते लोग उसके पास ऐसे आते हैं जैसे किसी जादूगर के पास, और उससे पूछते हैं कि उनके साथ क्या होगा। वह झूठा भविष्यद्वक्ता, जिसमें ईश्वरीय आत्मा की कोई सामर्थ्य नहीं है, उनके प्रश्नों [और उनकी दुष्ट अभिलाषाओं] [a] के अनुसार उनसे बातें करता है और उनकी इच्छानुसार उनकी आत्माओं को भर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पाठों में: ‘और उनकी दुष्ट अभिलाषाओं के अनुसार।’'
    reason: यूनानी स्रोत और अंग्रेज़ी POB audit trail में यह वाक्यांश कोष्ठकित पाठांतर के रूप में दिया गया है; इसलिए इसके अनिश्चित पाठ-स्थान को बिना किसी व्याख्यात्मक निष्कर्ष के चिह्नित किया गया है।
lexical_decisions:
- source_word: δίψυχοι
  choice: दुचित्ते लोग
  rationale: शाब्दिक अर्थ ‘दो मन वाले’ है; ‘दुचित्ते’ अस्थिर और बँटे हुए मन की धारणा को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς ἐπὶ μάγον
  choice: जैसे किसी जादूगर के पास
  rationale: μάγος यहाँ भविष्य जानने के लिए संपर्क किए जाने वाले जादूगर या तांत्रिक-सदृश व्यक्ति को दर्शाता है; मूल उपमा को सीधे रखा गया है।
- source_word: τί ἄρα ἔσται αὐτοῖς
  choice: कि उनके साथ क्या होगा
  rationale: यह उनके भावी हाल या परिणाम के विषय में पूछताछ है; हिन्दी में यह सहज और पर्याप्त रूप से खुला है।
- source_word: δύναμιν πνεύματος θείου
  choice: ईश्वरीय आत्मा की ... सामर्थ्य
  rationale: πνεῦμα θεῖον की अस्पष्टता बनाए रखता है—इसे अनिवार्यतः व्यक्तिवाचक ‘पवित्र आत्मा’ नहीं बनाया गया—और δύναμις के लिए प्रसंगानुकूल ‘सामर्थ्य’ चुना गया।
- source_word: κατὰ τὰ ἐπερωτήματα αὐτῶν
  choice: उनके प्रश्नों के अनुसार
  rationale: झूठे भविष्यद्वक्ता के उत्तर पूछने वालों की माँग के अनुकूल होने का भाव सीधे व्यक्त करता है।
- source_word: πληροῖ τὰς ψυχὰς αὐτῶν
  choice: उनकी आत्माओं को ... बातों से भर देता है
  rationale: ‘भरता है’ की मूल छवि सुरक्षित है; हिन्दी में वाक्य का आशय स्पष्ट करने के लिए ‘बातों से’ जोड़ा गया है, पर विषयवस्तु को अधिक निर्धारित नहीं किया गया।
theological_decisions:
- issue: πνεύματος θείου को ‘पवित्र आत्मा’ या ‘ईश्वरीय आत्मा’ कहना
  choice: ईश्वरीय आत्मा
  alternative: पवित्र आत्मा
  rationale: इस पद में यूनानी पाठ θεῖον (‘ईश्वरीय’) कहता है, ἅγιον (‘पवित्र’) नहीं; इसलिए मूल शब्दभेद और उसकी संभावित व्यापकता को सुरक्षित रखा गया है।
- issue: दुचित्ते लोगों की नैतिक दशा
  choice: ‘दुचित्ते’ और कोष्ठकीय पाठ में ‘दुष्ट अभिलाषाएँ’
  alternative: ‘संदेह करने वाले’ और ‘बुरी इच्छाएँ’
  rationale: मूल में मन के विभाजन और अस्थिरता का भाव है, केवल बौद्धिक संदेह का नहीं; πονηρία नैतिक दुष्टता को स्पष्ट रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘दुचित्ते’, ‘झूठा भविष्यद्वक्ता’, ‘ईश्वरीय आत्मा’ और ‘सामर्थ्य’ आरंभिक मसीही उपदेशात्मक शैली को बनाए रखते हैं। मुख्य पाठ में पाठांतर का संकेत [a] लगाया गया है।
