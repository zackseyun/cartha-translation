  text: 4. Therefore, as many as are strong in the faith of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often repent practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.
translation:
  language: hi
  text: 4. इसलिए जो लोग प्रभु पर विश्वास में दृढ़ हैं और सत्य को धारण किए हुए हैं, वे ऐसी आत्माओं से नहीं जुड़ते, बल्कि उनसे दूर रहते हैं। पर जो दुविधाग्रस्त हैं और बार-बार पश्चात्ताप करते हैं[a], वे जातियों की तरह दैव-विद्या करते हैं[b] और मूर्तिपूजा करके अपने ऊपर और भी बड़ा पाप ले आते हैं। क्योंकि जो किसी विषय में किसी झूठे भविष्यद्वक्ता से पूछता है, वह मूर्तिपूजक, सत्य से खाली और मूर्ख है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी अभिव्यक्ति का शाब्दिक अर्थ “बार-बार पश्चात्ताप करते हैं” है; इस प्रसंग में यह उनके बार-बार पलटने और मन की अस्थिरता की ओर भी संकेत करती है।
    reason: μετανοοῦσι के सामान्य अर्थ और प्रसंग में उसके दुविधाग्रस्तता-संबंधी संकेत—दोनों को सुरक्षित रखने के लिए।
  - marker: b
    text: यूनानी क्रिया का अर्थ दैवज्ञता या शकुन-विचार के द्वारा गुप्त अथवा भावी बातें जानना है।
    reason: μαντεύονται को केवल भविष्य जानने की सामान्य इच्छा के बजाय उस विशेष प्रथा के रूप में स्पष्ट करने के लिए।
lexical_decisions:
- source_word: δίψυχοι
  choice: दुविधाग्रस्त
  rationale: शाब्दिक अर्थ ‘दो मन वाला’ है; ‘दुविधाग्रस्त’ आधुनिक हिन्दी में व्यक्ति की अस्थिर और बँटी हुई निष्ठा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πυκνῶς μετανοοῦσι
  choice: बार-बार पश्चात्ताप करते हैं
  rationale: πυκνῶς की आवृत्ति और μετανοέω के सामान्य अर्थ ‘पश्चात्ताप करना’ को बनाए रखा गया है; संदर्भ में निहित अस्थिरता को पाद-टिप्पणी स्पष्ट करती है।
- source_word: μαντεύονται
  choice: भविष्य जानने का प्रयास करते हैं
  rationale: यह क्रिया शकुन-विचार या भविष्यवाणी के माध्यम से गुप्त/भावी बात जानने की चेष्टा बताती है; यह हिन्दी पाठक के लिए ‘भविष्यवाणी करते हैं’ की संभावित भ्रांति से बचाती है।
- source_word: εἰδωλολατροῦντες / εἰδωλολάτρης
  choice: मूर्तिपूजा करके / मूर्तिपूजक
  rationale: मूल पाठ की स्पष्ट धार्मिक श्रेणी को बिना नरम किए सामान्य और परिचित हिन्दी में रखा गया है।
- source_word: κενὸς ἀπὸ τῆς ἀληθείας
  choice: सत्य से खाली
  rationale: κενός की ठोस ‘खाली’ छवि को बनाए रखता है और निकटवर्ती प्रसंग की शब्दावली से मेल खाता है।
theological_decisions:
- issue: बार-बार पश्चात्ताप करने वालों के बारे में पाठ का तनाव
  choice: ‘बार-बार पश्चात्ताप करते हैं’ का सीधा अनुवाद रखा और संदर्भगत अस्थिरता पाद-टिप्पणी में बताई।
  alternative: ‘बार-बार मन बदलते हैं’ या ‘डाँवाडोल रहते हैं।’
  rationale: मूल μετανοοῦσι को केवल मानसिक अस्थिरता में बदल देने से पश्चात्ताप का वास्तविक अर्थ दब जाता; वहीं पाद-टिप्पणी पाठ के संदर्भगत तनाव को सुरक्षित रखती है।
- issue: झूठे भविष्यद्वक्ता से परामर्श और मूर्तिपूजा का संबंध
  choice: मूल के समान स्पष्ट कथन रखा कि ऐसा पूछने वाला मूर्तिपूजक है।
  alternative: इसे केवल ‘मूर्तिपूजा के समान’ कहना।
  rationale: मूल पाठ रूपकात्मक समानता नहीं, प्रत्यक्ष पहचान करता है; अनुवाद को इस दावे को नरम नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण गद्य रखा गया है। ‘सत्य को पहन चुके हैं’ मूल के वस्त्र-रूपक को जानबूझकर बनाए रखता है; ‘ऐसी आत्माओं’ का संकेत पिछले प्रसंग के झूठे भविष्यद्वक्ताओं को प्रेरित करने वाली आत्माओं की ओर है।
