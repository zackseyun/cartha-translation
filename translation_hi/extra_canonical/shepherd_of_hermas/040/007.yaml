  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/007.yaml
  text: 7. “How then,” I say, “sir, will a person know which of them is a prophet and which is a false prophet?” “Listen,” he says, “about both prophets; and in the way I am about to tell you, so you shall test the prophet and the false prophet. Test the man who has the divine spirit by his life.
translation:
  language: hi
  text: 7. मैंने कहा, “तो फिर, प्रभु, कोई व्यक्ति कैसे जानेगा कि इन दोनों में कौन भविष्यद्वक्ता है और कौन झूठा भविष्यद्वक्ता?” उसने कहा, “दोनों प्रकार के भविष्यद्वक्ताओं के विषय में सुनो। मैं तुम्हें जैसा बताने जा रहा हूँ, उसी प्रकार तुम भविष्यद्वक्ता और झूठे भविष्यद्वक्ता को परखोगे। जिस मनुष्य में दैवी आत्मा है, उसे उसके जीवन से परखो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: प्रभु
  rationale: हर्मास के संबोधन में यह आदरपूर्ण पद है; ‘प्रभु’ गरिमापूर्ण और पाठ-परंपरा के अनुकूल है, बिना वक्ता की पहचान को अधिक स्पष्ट किए।
- source_word: προφήτης / ψευδοπροφήτης
  choice: भविष्यद्वक्ता / झूठा भविष्यद्वक्ता
  rationale: दोनों परस्पर विरोधी पदों को स्पष्ट और प्रचलित हिन्दी धार्मिक शब्दावली में समानांतर रखा गया है।
- source_word: δοκιμάσεις / δοκίμαζε
  choice: परखोगे / परखो
  rationale: यूनानी क्रिया में जाँचकर असलियत पहचानने का भाव है; ‘परखना’ दोनों स्थानों पर इस अर्थ और पुनरावृत्ति को सुरक्षित रखता है।
- source_word: ἀπὸ τῆς ζωῆς
  choice: उसके जीवन से
  rationale: यह व्यक्ति के आचरण और जीवन-चर्या को कसौटी बनाने का संक्षिप्त, स्वाभाविक हिन्दी रूप है।
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: परमेश्वर का आत्मा
  rationale: ‘दैवी आत्मा’ भी संभव है, पर संदर्भ में परमेश्वर से प्राप्त आत्मा का भाव है; यह रूप सामान्य पाठक के लिए स्पष्ट रहते हुए ‘आत्मा’ की धार्मिक अर्थवत्ता बनाए रखता है।
theological_decisions:
- issue: κύριε संबोधन की पहचान
  choice: ‘प्रभु’ रखा गया, पर यह नहीं बताया गया कि संबोधित व्यक्ति मसीह, स्वर्गदूत या कोई अन्य पात्र है।
  alternative: ‘महोदय’ या ‘स्वामी’
  rationale: मूल पाठ केवल आदरसूचक संबोधन देता है; अनुवाद में पात्र की धर्मवैज्ञानिक पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: भविष्यद्वक्ता को परखने की कसौटी
  choice: ‘उसके जीवन से परखो’
  alternative: ‘उसके आचरण से पहचानो’
  rationale: ‘जीवन’ मूल ζωή का निकट रूप है और आगे आने वाले चरित्र-वर्णन की व्यापकता को बनाए रखता है; ‘आचरण’ अर्थ को कुछ संकुचित कर सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज संवाद-शैली। यूनानी की प्रश्नोत्तर संरचना और ‘परखना’ की पुनरावृत्ति सुरक्षित रखी गई है। कोई पादटिप्पणी आवश्यक नहीं है।
