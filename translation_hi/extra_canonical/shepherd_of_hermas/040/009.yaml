base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/009.yaml
  text: 9. Therefore, when the man who has the divine spirit comes into a gathering of righteous men who have faith in the divine Spirit, and an intercession is made to God by the gathering of those men, then the angel of the prophetic spirit who is assigned to him fills the man; and being filled with the holy Spirit he speaks to the multitude as the Lord wills.
translation:
  language: hi
  text: 9. इसलिए जब वह मनुष्य, जिसमें ईश्वरीय आत्मा है, उन धर्मी पुरुषों की सभा में आता है जो ईश्वरीय आत्मा पर विश्वास रखते हैं, और उनकी सभा में परमेश्वर से विनती की जाती है, तब भविष्यसूचक आत्मा का वह दूत, जो उसके निकट है,[a] उस मनुष्य को भर देता है। तब वह मनुष्य पवित्र आत्मा से भरकर एकत्रित लोगों से वैसा ही बोलता है जैसा प्रभु चाहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो उसके निकट स्थित है।” प्रसंग में इसका अर्थ उसके साथ रहने वाला या उसके लिए नियुक्त दूत भी हो सकता है।
    reason: κείμενος πρὸς αὐτόν की निकटता-सूचक भाषा और उसके संभावित नियत-संबंध, दोनों को बिना किसी एक अर्थ को निश्चित किए सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: συναγωγή
  choice: सभा
  rationale: यहाँ किसी संस्थागत आराधनालय के बजाय एकत्र हुए धर्मी लोगों की सभा अभिप्रेत है।
- source_word: ἔντευξις
  choice: विनती
  rationale: शब्द परमेश्वर के सामने प्रार्थनापूर्ण निवेदन को दर्शाता है; आधुनिक हिन्दी में ‘विनती’ स्वाभाविक और स्पष्ट है।
- source_word: ἄγγελος
  choice: दूत
  rationale: मूल अर्थ ‘संदेशवाहक/दूत’ है; ‘स्वर्गदूत’ कहने से पाठ की अपेक्षा अधिक विशिष्ट अर्थ जुड़ सकता था।
- source_word: τὸ πλῆθος
  choice: एकत्रित लोग
  rationale: सभा के उपस्थित जनसमूह का सहज हिन्दी रूप, जो केवल संख्या पर नहीं बल्कि संबोधित समुदाय पर बल देता है।
- source_word: λαλεῖ
  choice: बोलता है
  rationale: साधारण वाणी अथवा भविष्यवाणी के उच्चारण—दोनों को समेटने वाला सीधा अनुवाद।
theological_decisions:
- issue: πνεῦμα के विभिन्न प्रयोगों का अनुवाद
  choice: ‘ईश्वरीय आत्मा’, ‘भविष्यवाणी की आत्मा’ और ‘पवित्र आत्मा’ को मूल के भिन्न विशेषणों के अनुसार अलग रखा गया।
  alternative: सभी स्थानों पर केवल ‘पवित्र आत्मा’ कहना।
  rationale: मूल यूनानी पदबंधों की भिन्नता और उनके बीच उपस्थित धार्मिक तनाव को बिना समतल किए सुरक्षित रखना आवश्यक है।
- issue: πίστιν θείου πνεύματος का संबंध
  choice: ‘ईश्वरीय आत्मा पर विश्वास रखते हैं’
  alternative: ‘ईश्वरीय आत्मा का विश्वास रखते हैं’ अथवा ‘ईश्वरीय आत्मा से मिला विश्वास रखते हैं’
  rationale: यूनानी संबंधकारक संक्षिप्त और कुछ हद तक अस्पष्ट है; प्रसंग में आत्मा पर भरोसा रखने का अर्थ सबसे स्वाभाविक है, पर किसी विशिष्ट सांप्रदायिक सिद्धांत को नहीं जोड़ा गया।
- issue: भविष्यवाणी की आत्मा के दूत और मनुष्य का संबंध
  choice: ‘जो उसके पास नियुक्त है’ के साथ पाठगत शाब्दिकता को पादटिप्पणी में सुरक्षित रखा गया।
  alternative: ‘जो उसके पास रहता है’ या ‘जो उसके निकट स्थित है’
  rationale: κείμενος πρὸς αὐτόν का शाब्दिक अर्थ निकट स्थित होने का है, जबकि प्रसंग नियत संबंध का संकेत दे सकता है; मुख्य पाठ पठनीय रखा गया और वास्तविक अस्पष्टता पादटिप्पणी में दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है। मूल में ἀνδρῶν होने के कारण ‘पुरुषों’ रखा गया है; ‘दूत’ को अनावश्यक रूप से ‘स्वर्गदूत’ नहीं बनाया गया।
