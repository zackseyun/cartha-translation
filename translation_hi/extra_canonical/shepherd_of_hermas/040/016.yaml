base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/016.yaml
  text: 20. Take now the power that comes from above. Hail is a very small pellet, and when it falls on a man’s head, how much pain it causes! Or again, take a drop that falls from the roof tile to the ground, and it bores through the stone.
translation:
  language: hi
  text: 20. अब उस सामर्थ्य पर ध्यान दो जो ऊपर से आता है। ओला बहुत छोटा-सा दाना होता है, फिर भी जब वह किसी मनुष्य के सिर पर गिरता है, तो कैसी पीड़ा पहुँचाता है! या फिर उस बूँद को लो जो छत की खपरैल से भूमि पर टपकती है और पत्थर में छेद कर देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβε
  choice: ध्यान दो / लो
  rationale: पहले प्रयोग में किसी उदाहरण पर विचार करने का भाव है, इसलिए ‘ध्यान दो’; दूसरे में प्रत्यक्ष उदाहरण प्रस्तुत करने के लिए ‘लो’ स्वाभाविक है।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: यहाँ ऊपर से आने वाली प्रभावकारी शक्ति का अर्थ है; ‘सामर्थ्य’ धार्मिक गद्य में गरिमापूर्ण और सहज है।
- source_word: χάλαζα ... κοκκάριον
  choice: ओला ... दाना
  rationale: ग्रीक में ओले को अत्यंत छोटे कण/दाने के रूप में दिखाया गया है; ‘छोटा-सा दाना’ उपमा की ठोसता बनाए रखता है।
- source_word: κέραμος
  choice: छत की खपरैल
  rationale: शब्द का आशय मिट्टी की छत-टाइल है; केवल ‘छत’ की अपेक्षा ‘खपरैल’ मूल चित्र को अधिक स्पष्ट रखता है।
- source_word: τρυπᾷ
  choice: छेद कर देती है
  rationale: क्रिया का सीधा अर्थ आर-पार करना या छेद बनाना है; यह बूँद की निरंतर प्रभावकारी शक्ति के चित्र को सुरक्षित रखता है।
theological_decisions:
- issue: ἄνωθεν का स्थानिक और दैवी संकेत
  choice: ऊपर से
  alternative: स्वर्ग से
  rationale: मूल पाठ ‘ऊपर से’ कहता है और अगले अनुच्छेद में इसे दैवी आत्मा पर लागू करता है। ‘स्वर्ग से’ कहना निहितार्थ को स्पष्ट तो करता, पर मूल की अभिव्यक्ति को अनावश्यक रूप से निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक शिक्षण-शैली रखी गई है। विस्मयात्मक प्रश्न और दोनों प्राकृतिक उदाहरण मूल के अनुरूप सुरक्षित हैं।
