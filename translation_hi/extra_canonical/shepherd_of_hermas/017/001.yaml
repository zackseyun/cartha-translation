translation:
  language: hi
  text: हे बच्चो, मेरी बात सुनो। मैंने तुम्हारा पालन-पोषण बहुत सरलता, निष्कपटता और मर्यादा के साथ उस प्रभु की दया के द्वारा किया, जिसने तुम पर धार्मिकता टपकाई, ताकि तुम धर्मी ठहराए जाओ और…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: हे बच्चो
  rationale: स्नेहपूर्ण प्रत्यक्ष संबोधन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξέθρεψα
  choice: पालन-पोषण किया
  rationale: क्रिया में केवल शिक्षा नहीं, बल्कि पालने और बढ़ाने का भाव है।
- source_word: ἁπλότητι
  choice: सरलता
  rationale: मूल के निष्कपट और अविभाजित मनोभाव को सामान्य, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἀκακίᾳ
  choice: निष्कपटता
  rationale: बुराई या छल से रहित होने का भाव व्यक्त करता है और निकटवर्ती ‘सरलता’ से पर्याप्त भेद रखता है।
- source_word: σεμνότητι
  choice: मर्यादा
  rationale: सम्माननीय, गंभीर और शालीन आचरण के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: στάξαντος
  choice: बरसाई
  rationale: शाब्दिक ‘टपकाई’ हिन्दी में अस्वाभाविक है; ‘बरसाई’ ऊपर से प्रदान किए जाने की मूल रूपकात्मक छवि को बनाए रखता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: नैतिक धार्मिकता और परमेश्वर-संबंधी सही स्थिति के बीच मूल की अर्थगत व्यापकता को खुला रखता है।
- source_word: δικαιωθῆτε
  choice: धर्मी ठहराए जाओ
  rationale: निष्क्रिय रूप और ‘धर्मी घोषित/स्वीकार किए जाने’ के न्यायिक-संबंधपरक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: δικαιοσύνη और δικαιωθῆτε का संबंध
  choice: ‘धार्मिकता बरसाई, ताकि तुम धर्मी ठहराए जाओ’
  alternative: ‘नेकियाँ बरसाईं, ताकि तुम धर्मी बनो’
  rationale: चुना गया रूप समान मूल वाले यूनानी शब्दों का संबंध बनाए रखता है और ‘बनाए जाने’ तथा ‘ठहराए जाने’ के बीच की धार्मिक तनावपूर्ण अर्थ-संभावना को एक ओर से तय नहीं करता।
- issue: διὰ τὸ ἔλεος का संबंध
  choice: ‘क्योंकि प्रभु की दया ने…’
  alternative: ‘प्रभु की दया के द्वारा…’
  rationale: यूनानी कृदंत-वाक्यांश में दया को सक्रिय रूप से धार्मिकता टपकाने/बरसाने वाली बताया गया है; हिन्दी में कर्तृवाचक रूप इस संबंध को स्पष्ट और स्वाभाविक रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्नेहपूर्ण संबोधन, गरिमापूर्ण धार्मिक शब्दावली और मूल के वर्षा-संबंधी रूपक को बनाए रखा गया है। स्रोत अंश ‘καὶ’ पर अधूरा समाप्त होता है, इसलिए अंत में दीर्घविराम लगाया गया है।
