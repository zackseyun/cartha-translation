- from: हे बच्चो, मेरी सुनो। मैंने तुम्हारा पालन-पोषण बड़ी सरलता, निष्कपटता और मर्यादा में किया, क्योंकि प्रभु की दया ने तुम पर धार्मिकता बरसाई, ताकि तुम धर्मी ठहराए जाओ और…
  to: हे बच्चो, मेरी बात सुनो। मैंने तुम्हारा पालन-पोषण बहुत सरलता, निष्कपटता और मर्यादा के साथ उस प्रभु की दया के द्वारा किया, जिसने तुम पर धार्मिकता टपकाई, ताकि तुम धर्मी ठहराए जाओ और…
  rationale: The revision restores the Lord as the one who ‘dripped’ righteousness and renders mercy as the means expressed by διὰ. It retains the source’s unfinished final καὶ with an ellipsis and preserves the related wording ‘धार्मिकता’ / ‘धर्मी ठहराए जाओ.’
