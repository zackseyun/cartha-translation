  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/005.yaml
  text: 5. “Why,” I said, “sir, did you say about those who keep his commandments, ‘They will live to God’?” “Because,” he said, “all creation fears the Lord, but it does not keep his commandments. Therefore the life of those who fear him and keep his commandments is with God; but for those who do not keep his commandments, there is not even life in them.”
translation:
  language: hi
  text: 5. मैंने कहा, “स्वामी, आपने उसकी आज्ञाओं का पालन करने वालों के विषय में यह क्यों कहा, ‘वे परमेश्वर के लिए जीवित रहेंगे’?” उसने कहा, “क्योंकि सारी सृष्टि प्रभु का भय रखती है, पर उसकी आज्ञाओं का पालन नहीं करती। इसलिए जो उसका भय रखते और उसकी आज्ञाओं का पालन करते हैं, उनका जीवन परमेश्वर के पास है; पर जो उसकी आज्ञाओं का पालन नहीं करते, उनमें जीवन भी नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: स्वामी
  rationale: सम्बोधन में आदर बनाए रखता है और इस संवाद में वक्ता को परमेश्वर समझ लेने की अनावश्यक सम्भावना घटाता है।
- source_word: τηρούντων / φυλασσόντων
  choice: पालन करनेवालों / पालन करते
  rationale: आज्ञाओं की रक्षा या निगरानी के शाब्दिक बिंब के बजाय हिन्दी में स्वाभाविक रूप से आज्ञाकारिता व्यक्त करता है; दोनों यूनानी क्रियाओं का प्रसंगगत अर्थ समान है।
- source_word: Ζήσονται τῷ Θεῷ
  choice: वे परमेश्वर के लिए जीवित रहेंगे
  rationale: सम्प्रदान कारक की वास्तविक अस्पष्टता और पिछले वाक्य से जुड़ी धर्मवैचारिक अभिव्यक्ति को बिना ‘परमेश्वर में’ या ‘परमेश्वर के सामने’ बनाकर सुलझाए सुरक्षित रखता है।
- source_word: ἡ ζωή ἐστι παρὰ τῷ Θεῷ
  choice: उनका जीवन परमेश्वर के पास है
  rationale: παρά के निकटता/संगति-सूचक बल को बनाए रखता है और ‘परमेश्वर से मिलता है’ जैसी व्याख्यात्मक विस्तार से बचता है।
- source_word: οὐδὲ ζωὴ ἐν αὐτῷ
  choice: उनमें जीवन भी नहीं है
  rationale: ἐν αὐτῷ को निकटतम बहुवचन समूह के सामूहिक एकवचन सन्दर्भ में समझता है; हिन्दी में अर्थ स्पष्ट करने के लिए बहुवचन ‘उनमें’ स्वाभाविक है।
theological_decisions:
- issue: ‘परमेश्वर के लिए जीवित रहेंगे’ और ‘जीवन परमेश्वर के पास है’ का सम्बन्ध
  choice: दोनों अलग यूनानी रचनाओं को अलग हिन्दी अभिव्यक्तियों में रखा गया है।
  alternative: दोनों को ‘परमेश्वर में जीवित रहेंगे/जीवन है’ के रूप में एकरूप करना।
  rationale: मूल पाठ τῷ Θεῷ और παρὰ τῷ Θεῷ में भेद करता है; अनुवाद उस तनाव को मिटाता नहीं है।
- issue: सारी सृष्टि का प्रभु से भय
  choice: ‘सारी सृष्टि प्रभु का भय मानती है’
  alternative: ‘हर प्राणी प्रभु से डरता है’
  rationale: ‘सृष्टि’ κτίσις की व्यापकता को सुरक्षित रखता है, जबकि ‘भय मानना’ धार्मिक आदर और भय दोनों की सम्भावना खुली रखता है।
- issue: आज्ञा न माननेवालों में जीवन का अभाव
  choice: मूल का प्रबल कथन ‘जीवन भी नहीं है’ यथावत रखा गया।
  alternative: इसे ‘सच्चा जीवन नहीं है’ कहकर नरम या व्याख्यायित करना।
  rationale: पाठ जीवन की कोई विशेष परिभाषा नहीं जोड़ता; ऐसी विशेषणात्मक व्याख्या धर्मवैचारिक निष्कर्ष आरोपित करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज संवादात्मक शैली। ‘स्वामी’ आदरसूचक सम्बोधन है; ‘प्रभु’ यहाँ Κύριος के लिए और ‘परमेश्वर’ Θεός के लिए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
