base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/002.yaml
  text: 2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because there is no power in him. In one in whom there is no power, there is no fear; but in one in whom there is glorious power, there is also fear. For everyone who has power has fear, but the one who has no power is despised by all.
translation:
  language: hi
  text: 2. पर शैतान से मत डरो; क्योंकि प्रभु का भय मानने से तुम शैतान पर प्रभुत्व पाओगे, क्योंकि उसमें कोई सामर्थ्य नहीं है। जिसमें सामर्थ्य नहीं है, उससे भय भी नहीं होता; पर जिसमें महिमामय सामर्थ्य है, उससे भय भी होता है। क्योंकि हर सामर्थ्यवान भय उत्पन्न करता है, पर जिसके पास सामर्थ्य नहीं है, उसे सब तुच्छ समझते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν διάβολον
  choice: शैतान
  rationale: यह आधुनिक हिन्दी में व्यक्तिगत दुष्ट विरोधी के लिए स्वाभाविक और व्यापक रूप से समझा जाने वाला शब्द है।
- source_word: κατακυριεύσεις
  choice: अधिकार पा लोगे
  rationale: क्रिया का अर्थ किसी पर प्रभुत्व या वश प्राप्त करना है; यह चयन मूल की तीव्रता को सहज हिन्दी में रखता है।
- source_word: δύναμις
  choice: सामर्थ्य
  rationale: यहाँ शक्ति अथवा प्रभावी क्षमता का अर्थ है; पूरे अनुच्छेद में एक ही शब्द रखकर तर्क की पुनरावृत्ति सुरक्षित की गई है।
- source_word: ἔνδοξος
  choice: महिमामय
  rationale: मूल विशेषण महिमा और गौरव से युक्त सामर्थ्य को बताता है; केवल ‘महान’ कहने से यह भाव घट जाता।
- source_word: καταφρονεῖται
  choice: तुच्छ समझते हैं
  rationale: यह अवमानना और हेय दृष्टि से देखने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘शैतान में कोई सामर्थ्य नहीं’ कथन की निरपेक्षता
  choice: मूल के सीधे कथन को बिना नरम किए रखा गया
  alternative: ‘तुम पर उसका कोई अधिकार नहीं’ या ‘उसकी वास्तविक शक्ति नहीं’
  rationale: यूनानी पाठ ὅτι δύναμις ἐν αὐτῷ οὐκ ἔστιν निरपेक्ष रूप में कहता है कि उसमें सामर्थ्य नहीं है; संदर्भगत व्याख्या जोड़ना मूल की धर्मवैचारिक तीक्ष्णता को चुपचाप सुलझा देता।
- issue: φόβος का संबंध व्यक्ति से या उसके भीतर होने से
  choice: ‘उससे भय होता है’
  alternative: ‘उसमें भय है’
  rationale: शाब्दिक संरचना ‘उसमें भय’ है, पर तर्क का आशय भय उत्पन्न करने या भय के योग्य होने से है। स्वाभाविक हिन्दी में संबंध स्पष्ट किया गया, बिना ‘श्रद्धा’ जैसी अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रभु का भय मानना’ धार्मिक-साहित्यिक मुहावरे को सुरक्षित रखता है। मूल के बार-बार आने वाले ‘सामर्थ्य’ और ‘भय’ को शैलीगत विविधता के लिए बदला नहीं गया, क्योंकि वही अनुच्छेद के तर्क की रीढ़ हैं।
