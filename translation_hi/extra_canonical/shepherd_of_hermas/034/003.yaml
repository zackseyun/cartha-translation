  text: 3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the works of the devil, and you will not do them, but will keep away from them.
translation:
  language: hi
  text: 3. पर शैतान के कामों से डरो, क्योंकि वे बुरे हैं। इसलिए प्रभु का भय मानते हुए तुम शैतान के कामों से डरोगे और उन्हें नहीं करोगे, बल्कि उनसे दूर रहोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητι / φοβούμενος / φοβηθήσῃ
  choice: डरो / भय मानते हुए / डरोगे
  rationale: यूनानी में एक ही भय-संबंधी शब्द-समूह की पुनरावृत्ति है। हिंदी में प्रभु के प्रति आदरपूर्ण भय के लिए ‘भय मानना’ और बुरे कामों के प्रति सावधान भय के लिए ‘डरना’ स्वाभाविक है, जबकि मूल का शब्द-संबंध भी बना रहता है।
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: शैतान के काम
  rationale: ‘ἔργα’ का सीधा अर्थ ‘काम/कर्म’ है; साधारण पाठकों के लिए ‘काम’ सहज है। ‘διάβολος’ के लिए प्रचलित और स्पष्ट हिंदी रूप ‘शैतान’ चुना गया है।
- source_word: πονηρά
  choice: बुरे
  rationale: यहाँ नैतिक बुराई अभिप्रेत है; ‘बुरे’ सरल और सटीक है।
- source_word: οὐκ ἐργάσῃ αὐτά
  choice: उन्हें नहीं करोगे
  rationale: ‘ἐργάζομαι’ की कार्य-संबंधी प्रतिध्वनि को सहज हिंदी में व्यक्त करता है।
- source_word: ἀφέξῃ ἀπ᾽ αὐτῶν
  choice: उनसे दूर रहोगे
  rationale: मध्यम रूप ‘अपने को उनसे अलग/दूर रखना’ का भाव देता है; ‘दूर रहोगे’ आधुनिक हिंदी में स्वाभाविक और अर्थनिष्ठ है।
theological_decisions:
- issue: प्रभु और शैतान के कामों—दोनों के संदर्भ में ‘भय’
  choice: प्रभु के लिए ‘भय मानना’ और शैतान के कामों के लिए ‘डरना’
  alternative: दोनों जगह केवल ‘डरना’ या ‘भय करना’
  rationale: 'मूल दोनों के लिए φοβέομαι का प्रयोग करता है, पर संदर्भगत अंतर भी रखता है: प्रभु का भय नैतिक आज्ञाकारिता की प्रेरणा है, जबकि बुरे कामों का भय उनसे बचने की प्रतिक्रिया है। चुनी हुई भाषा इस तनाव को मिटाए बिना स्वाभाविक हिंदी देती है।'
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और उपदेशात्मक शैली। पद-संख्या रखी गई है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
