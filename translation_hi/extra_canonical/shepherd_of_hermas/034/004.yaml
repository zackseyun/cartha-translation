base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/004.yaml
  text: '4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live to him; and all who fear him, among those who keep his commandments, will live to God.'
translation:
  language: hi
  text: '4. इसलिए भय दो प्रकार के हैं: यदि तुम बुराई करना चाहते हो, तो प्रभु से डरो और तुम उसे नहीं करोगे; और यदि फिर तुम भलाई करना चाहते हो, तो प्रभु से डरो और तुम उसे करोगे। इस प्रकार प्रभु का भय शक्तिशाली, महान और महिमामय है। इसलिए प्रभु से डरो, और तुम उसके लिए जीओगे[a]; और वे सब जो उससे डरते हैं और उसकी आज्ञाओं का पालन करते हैं, परमेश्वर के लिए जीएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “उसके लिए/उसकी ओर जीओगे” है; इसका आशय उसके प्रति समर्पित जीवन, या उसके साथ संबंध में जीवन, हो सकता है।
    reason: ζήσῃ αὐτῷ में चतुर्थी कारक की अर्थ-व्याप्ति को सुरक्षित रखता है, बिना किसी एक व्याख्यात्मक अर्थ को अनिवार्य किए।
lexical_decisions:
- source_word: δισσοὶ ... οἱ φόβοι
  choice: भय दो प्रकार का होता है
  rationale: यूनानी अभिव्यक्ति का अर्थ है कि भय दो रूपों में कार्य करता है; सहज हिन्दी में इसे व्यक्त किया गया है, जबकि दोनों स्थितियों में प्रभु का भय ही बना रहता है।
- source_word: τὸ πονηρόν / τὸ ἀγαθόν
  choice: बुराई / भलाई
  rationale: नपुंसकलिंग विशेषणों के संज्ञात्मक प्रयोग को सामान्य और स्पष्ट हिन्दी अमूर्त संज्ञाओं से व्यक्त किया गया है।
- source_word: φοβοῦ τὸν Κύριον
  choice: प्रभु से डरो
  rationale: आज्ञार्थक रूप और भय की प्रत्यक्ष भाषा को नरम किए बिना स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ἰσχυρός ... μέγας ... ἔνδοξος
  choice: सामर्थी, महान और महिमामय
  rationale: तीनों विशेषणों की अलग-अलग शक्ति और अलंकारिक क्रम को सुरक्षित रखा गया है।
- source_word: φυλασσόντων τὰς ἐντολὰς
  choice: आज्ञाओं को माननेवालों
  rationale: φυλάσσω का आशय आज्ञाओं की रक्षा मात्र नहीं, बल्कि उनका पालन करना है; ‘मानना’ सामान्य पाठक के लिए स्वाभाविक है।
theological_decisions:
- issue: ζήσῃ αὐτῷ और ζήσονται τῷ Θεῷ का अर्थ
  choice: उसके लिए जीवित रहोगे / परमेश्वर के लिए जीवित रहेंगे
  alternative: उसमें जीवित रहोगे / परमेश्वर में जीवन पाएँगे
  rationale: यूनानी में संबंधवाचक चतुर्थी है और उसका अर्थ समर्पित होकर ‘के लिए जीना’ अथवा संबंध में ‘जीवित रहना’ हो सकता है। मुख्य पाठ मूल संरचना के निकट है और पादटिप्पणी वास्तविक अर्थ-व्याप्ति बताती है।
- issue: τῶν φυλασσόντων के साथ ὅσοι का संबंध
  choice: उसकी आज्ञाओं को माननेवालों में जितने भी उससे डरेंगे
  alternative: जितने उससे डरेंगे और उसकी आज्ञाओं को मानेंगे
  rationale: मूल का संबंधवाचक विन्यास ‘आज्ञाएँ माननेवालों में से’ कहता है; उसे समन्वयी ‘और’ में बदलने से बचाया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘डरो’ को ‘श्रद्धा रखो’ से नहीं बदला गया, क्योंकि इस अनुच्छेद में भय का नैतिक और प्रतिरोधक बल स्पष्ट रूप से केंद्र में है।
