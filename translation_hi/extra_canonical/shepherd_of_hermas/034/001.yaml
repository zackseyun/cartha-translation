base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/001.yaml
  text: 1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God you will be powerful in every deed, and your conduct will be incomparable. For in fearing the Lord you will do everything well. This is the fear that you must have—and you will be saved.
translation:
  language: hi
  text: 1. वह कहता है, “प्रभु का भय मानो और उसकी आज्ञाओं का पालन करो। परमेश्वर की आज्ञाओं का पालन करते हुए तुम हर कार्य में समर्थ होगे, और तुम्हारा कार्य बेजोड़ होगा। क्योंकि प्रभु का भय मानते हुए तुम सब कुछ भली-भाँति करोगे। यही वह भय है जो तुम्हें मानना चाहिए—और तुम उद्धार पाओगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβήθητι / φοβούμενος
  choice: भय मानो / भय मानते हुए
  rationale: यहाँ भय केवल आतंक नहीं, बल्कि प्रभु की सामर्थ्य और अधिकार के प्रति गंभीर श्रद्धायुक्त भय है। ‘भय मानना’ आधुनिक हिन्दी में इस नैतिक-धार्मिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: φύλασσε / φυλάσσων
  choice: पालन करो / पालन करने से
  rationale: आज्ञाओं के संदर्भ में यूनानी ‘रक्षा करना, ध्यान से मानना’ का स्वाभाविक हिन्दी समतुल्य ‘पालन करना’ है।
- source_word: δυνατὸς
  choice: सामर्थी
  rationale: यह शब्द कार्य करने की शक्ति या क्षमता दर्शाता है; ‘सामर्थी’ मूल के बल और योग्यता दोनों पहलुओं को बनाए रखता है।
- source_word: πράξει / πρᾶξίς
  choice: काम / आचरण
  rationale: पहला प्रयोग प्रत्येक किए जाने वाले कार्य की ओर संकेत करता है, जबकि दूसरा व्यक्ति की समग्र करनी या व्यवहार की ओर; हिन्दी में प्रसंगानुसार भिन्न शब्दों से यह अर्थ स्पष्ट होता है।
- source_word: ἀσύγκριτος
  choice: अतुलनीय
  rationale: मूल अर्थ ‘जिसकी तुलना न हो सके’ को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: σωθήσῃ
  choice: उद्धार पाओगे
  rationale: क्रिया का भविष्यकालीन निष्क्रिय अर्थ सुरक्षित रहता है और धार्मिक संदर्भ में ‘उद्धार’ इसका मानक, किंतु सम्प्रदाय-निरपेक्ष, अनुवाद है।
theological_decisions:
- issue: प्रभु के भय और उद्धार का संबंध
  choice: ‘यही वह भय है जो तुम्हें मानना चाहिए—और तुम उद्धार पाओगे’
  alternative: ‘यदि तुम ऐसा भय रखोगे, तो तुम उद्धार पाओगे’
  rationale: यूनानी पाठ भय मानने की आवश्यकता और उद्धार को साथ रखता है, पर उनके संबंध की विस्तृत धर्मवैज्ञानिक व्याख्या नहीं देता। अनुवाद उसी तनाव को बनाए रखता है और कोई विशिष्ट उद्धार-सिद्धांत नहीं जोड़ता।
- issue: ‘प्रभु’ और ‘परमेश्वर’ का संदर्भ
  choice: मूल के अनुसार दोनों पद अलग-अलग बनाए रखे गए
  alternative: दोनों स्थानों पर केवल ‘परमेश्वर’ या केवल ‘प्रभु’
  rationale: पाठ पहले Κύριον और फिर Θεοῦ कहता है। इन्हें समरूप कर देने के बजाय मूल शब्दावली का भेद सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। प्रत्यक्ष वचन की संरचना और पद संख्या सुरक्षित रखी गई है। इस पाठखंड में किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
