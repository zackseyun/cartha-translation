base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/008/003.yaml
  text: 3. “So you will write two little booklets, and you will send one to Clement and one to Grapte. Then Clement will send it to the cities outside, for this has been entrusted to him; but Grapte will admonish the widows and the orphans. But you will read it aloud in this city with the elders who preside over the church.”
translation:
  language: hi
  text: 3. इसलिए तुम दो छोटी पुस्तिकाएँ लिखोगे और एक क्लेमेंट को तथा एक ग्राप्ते को भेजोगे। तब क्लेमेंट उसे बाहर के नगरों में भेजेगा, क्योंकि यह काम उसे सौंपा गया है। पर ग्राप्ते विधवाओं और अनाथों को चेतावनी देकर शिक्षा देगी। और तुम इस नगर में कलीसिया की अगुवाई करने वाले प्राचीनों के साथ इसे पढ़कर सुनाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύο βιβλαρίδια
  choice: दो छोटी पुस्तकें
  rationale: βιβλαρίδια, βιβλαρίδιον का लघुतासूचक बहुवचन है; ‘छोटी पुस्तकें’ आकार और रूप दोनों का स्वाभाविक हिन्दी संकेत देता है।
- source_word: τὰς ἔξω πόλεις
  choice: बाहर के नगरों में
  rationale: वाक्यांश का स्थानिक अर्थ जानबूझकर सामान्य रखा गया है; यूनानी पाठ यह स्पष्ट नहीं करता कि नगर किस सीमा से बाहर हैं।
- source_word: νουθετήσει
  choice: समझाएगी
  rationale: νουθετέω में चेतावनी, शिक्षा और सुधार की सलाह का भाव है; ‘समझाएगी’ आधुनिक हिन्दी में इसे सहज ढंग से व्यक्त करता है, बिना स्वर को अनावश्यक रूप से कठोर बनाए।
- source_word: ἀναγνωσῇ
  choice: पढ़कर सुनाओगे
  rationale: संदर्भ में सार्वजनिक या सामुदायिक वाचन अभिप्रेत है; केवल ‘पढ़ोगे’ की अपेक्षा यह अर्थ अधिक स्पष्ट है।
- source_word: πρεσβυτέρων
  choice: प्राचीनों
  rationale: आरंभिक कलीसियाई नेतृत्व-पद के लिए प्रचलित और अपेक्षाकृत औपचारिक हिन्दी शब्द चुना गया है।
- source_word: τῶν προϊσταμένων
  choice: अगुवाई करने वाले
  rationale: प्रोइस्तेमी यहाँ देखरेख और नेतृत्व का बोध कराता है; क्रियात्मक अनुवाद पद-संबंध को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: आरंभिक मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में व्यापक रूप से समझा जाने वाला शब्द है।
theological_decisions:
- issue: क्लेमेंत को सौंपे गए कार्य की प्रकृति
  choice: ‘यह काम उसे सौंपा गया है’
  alternative: ‘यह अधिकार उसे सौंपा गया है’
  rationale: ἐπιτέτραπται किसी दायित्व या कार्य के सुपुर्द किए जाने को बताता है; पाठ स्वयं औपचारिक पदाधिकार या अधिकार-क्षेत्र निर्धारित नहीं करता, इसलिए ‘काम’ तटस्थ है।
- issue: प्राचीनों और नगर में वाचन का संबंध
  choice: ‘प्राचीनों के साथ इसे पढ़कर सुनाओगे’
  alternative: ‘प्राचीनों को इसे पढ़कर सुनाओगे’
  rationale: μετά + संबंधकारक का अर्थ ‘के साथ’ है। प्राचीनों को केवल श्रोता बना देना मूल संबंध को बदल देता।
- issue: कलीसियाई नेतृत्व का स्वरूप
  choice: ‘कलीसिया की अगुवाई करने वाले प्राचीन’
  alternative: ‘कलीसिया पर शासन करने वाले प्राचीन’
  rationale: προΐστημι नेतृत्व या देखरेख सूचित करता है; ‘शासन’ अनावश्यक रूप से अधिक संस्थागत या प्रभुत्वपूर्ण अर्थ जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। भविष्यकाल की पुनरावृत्ति से यूनानी निर्देशात्मक भविष्यकाल सुरक्षित रखा गया है। क्लेमेंत और ग्राप्ते नामों का लिप्यंतरण यूनानी Κλήμης और Γραπτή के निकट रखा गया है।
