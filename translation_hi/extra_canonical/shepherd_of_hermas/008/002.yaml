  text: 2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already given the book to the elders. I denied having given it. “You have done well,” she says; “for I have words to add. When, therefore, I complete all the words, through you they will be made known to all the elect.
translation:
  language: hi
  text: 2. इसके बाद मैंने अपने घर में एक दर्शन देखा। वह वृद्धा आई और उसने मुझसे पूछा कि क्या मैं वह पुस्तक प्राचीनों को दे चुका हूँ। मैंने इनकार किया कि मैंने उसे दिया है। उसने कहा, “तुमने अच्छा किया, क्योंकि मुझे और वचन जोड़ने हैं। इसलिए जब मैं सारे वचन पूरे कर लूँगी, तो तुम्हारे द्वारा वे सभी चुने हुओं को ज्ञात कराए जाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρα
  choice: वृद्धा
  rationale: यहाँ वही पहले उल्लिखित वृद्ध स्त्री अभिप्रेत है; ‘वृद्धा’ उसके आयु-संबंधी रूप को सहज और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: βιβλίον
  choice: पुस्तक
  rationale: सामान्य अर्थ ‘पुस्तक’ है और इससे पहले आए लघुरूप βιβλίδιον की तुलना में यहाँ किसी अतिरिक्त लघुता को आरोपित नहीं किया गया।
- source_word: πρεσβυτέροις
  choice: अगुओं
  rationale: संदर्भ में ये कलीसिया की अगुवाई करने वाले प्राचीन हैं; ‘अगुओं’ आधुनिक पाठक के लिए उनकी भूमिका स्पष्ट करता है, यद्यपि आयु-संबंधी शब्द-खेल कम हो जाता है।
- source_word: ῥήματα
  choice: वचन
  rationale: ‘कथन/वचन’ दोनों संभव हैं; प्रकाशनात्मक और लिखित संदेश के संदर्भ में ‘वचन’ स्वाभाविक तथा गरिमापूर्ण है।
- source_word: ἐκλεκτοῖς
  choice: चुने हुओं
  rationale: मूल विशेषण का धार्मिक अर्थ बनाए रखते हुए यह नहीं बताया गया कि किसने या किस आधार पर चुना।
- source_word: γνωρισθήσεται
  choice: प्रकट किए जाएँगे
  rationale: भाववाच्य को सुरक्षित रखते हुए ‘ज्ञात कराए जाएँगे’ का सहज हिन्दी रूप; कर्ता को मूल की तरह अनिर्दिष्ट रखा गया है।
theological_decisions:
- issue: ‘सभी चुने हुओं’ की पहचान और चुनाव का कर्ता
  choice: सभी चुने हुओं
  alternative: परमेश्वर के सभी चुने हुए लोगों
  rationale: मूल में परमेश्वर या ‘लोग’ स्पष्ट रूप से नहीं जोड़े गए हैं; इसलिए धर्मवैचारिक विस्तार से बचते हुए मूल की संक्षिप्तता और अस्पष्टता रखी गई।
- issue: वचनों के ज्ञात होने की रीति
  choice: तुम्हारे द्वारा वे ... प्रकट किए जाएँगे
  alternative: तुम उन्हें ... बताओगे
  rationale: मूल का भाववाच्य और हर्मास की माध्यम-भूमिका दोनों सुरक्षित रखे गए; प्रत्यक्ष कर्तृत्व हर्मास को नहीं दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। प्रत्यक्ष कथन स्वाभाविक बनाया गया है और यूनानी काल-रूप के कथात्मक परिवर्तन को कठोरता से नकल करने के बजाय हिन्दी प्रवाह के अनुसार व्यक्त किया गया है।
