base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/008/001.yaml
  text: 'And it was revealed to me, brothers, while I was asleep, by a very handsome young man who said to me: “The old woman, from whom you received the little book—who do you think she is?” I said, “The Sibyl.” “You are mistaken,” he says; “she is not.” “Then who is she?” I say. “The Church,” he says. I said to him, “Why then is she old?” “Because,” he says, “she was created first of all; for this reason she is old, and for her sake the world was formed.”'
translation:
  language: hi
  text: भाइयो, जब मैं सो रहा था, तब एक अत्यन्त सुन्दर युवक द्वारा मुझे यह प्रकट किया गया। उसने मुझसे कहा, “वह वृद्धा, जिससे तुमने वह छोटी पुस्तक प्राप्त की थी—तुम्हारे विचार में वह कौन है?” मैंने कहा, “सिबिल्ला।” उसने कहा, “तुम भूल में हो; वह नहीं है।” मैंने पूछा, “तो वह कौन है?” उसने कहा, “कलीसिया।” मैंने उससे कहा, “तो फिर वह वृद्धा क्यों है?” उसने कहा, “क्योंकि वह सबसे पहले सृजी गई थी। इसी कारण वह वृद्धा है, और उसी के निमित्त संसार की रचना हुई।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: प्रत्यक्ष संबोधन के बहुवचन को स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है; प्रसंग में यह समुदाय के सदस्यों के लिए प्रयुक्त संबोधन है।
- source_word: νεανίσκου εὐειδεστάτου
  choice: एक अत्यन्त सुन्दर युवक
  rationale: νεανίσκος के लिए ‘युवक’ और εὐειδέστατος के उत्कृष्टता-सूचक रूप के लिए ‘अत्यन्त सुन्दर’ मूल अर्थ को सीधे व्यक्त करते हैं।
- source_word: πρεσβυτέραν
  choice: वृद्धा
  rationale: यहाँ स्त्रीलिंग संज्ञात्मक प्रयोग है और आगे उसकी आयु के प्रतीकात्मक अर्थ की व्याख्या होती है; इसलिए ‘वृद्ध स्त्री’ की अपेक्षा संक्षिप्त ‘वृद्धा’ स्वाभाविक है।
- source_word: βιβλίδιον
  choice: छोटी पुस्तक
  rationale: लघुतासूचक रूप को बनाए रखा गया है, जबकि ‘पुस्तिका’ आधुनिक हिन्दी में विषय-वस्तु के प्रकार का अनावश्यक संकेत दे सकती है।
- source_word: Σίβυλλαν
  choice: सिबिल्ला
  rationale: प्राचीन यूनानी-रोमी भविष्यवक्त्री की पदवी/पहचान को लिप्यंतरित किया गया है, न कि सामान्य अर्थ देकर समतल किया गया है।
- source_word: Ἐκκλησία
  choice: कलीसिया
  rationale: व्यक्तिरूप में प्रस्तुत समुदाय/Church के लिए भारतीय मसीही हिन्दी में प्रचलित शब्द चुना गया है और इसकी विशिष्ट पहचान बनाए रखने के लिए आरम्भिक अक्षर के स्तर पर कोई अलग देवनागरी संकेत संभव नहीं है।
- source_word: ἐκτίσθη
  choice: सृजी गई थी
  rationale: दिव्य सृष्टि-संबंधी निष्क्रिय क्रिया को स्पष्ट रखता है और यह नहीं बताता कि कर्ता कौन था, जैसा यूनानी पाठ भी नहीं बताता।
- source_word: κατηρτίσθη
  choice: व्यवस्थित किया गया
  rationale: क्रिया में तैयार करने, क्रम में लगाने या उपयुक्त रूप देने का भाव है; ‘रचा गया’ इसे ἐκτίσθη के साथ मिला देता, इसलिए भेद सुरक्षित रखा गया है।
theological_decisions:
- issue: कलीसिया का ‘सबसे पहले सृजा जाना’
  choice: “वह सबसे पहले सृजी गई थी” के रूप में सीधे रखा गया
  alternative: इसे ‘परमेश्वर की योजना में पहले से थी’ जैसी व्याख्यात्मक भाषा में बदलना
  rationale: मूल पाठ सृष्टि की स्पष्ट भाषा का प्रयोग करता है। संभावित धर्मवैज्ञानिक तनाव को किसी बाद की व्याख्या द्वारा हल नहीं किया गया।
- issue: संसार और कलीसिया के बीच कारण/उद्देश्य संबंध
  choice: “उसी के कारण संसार को व्यवस्थित किया गया”
  alternative: “उसी के लिए संसार बनाया गया”
  rationale: διά ταύτην कारण, हेतु या निमित्त का संबंध व्यक्त कर सकता है। ‘के कारण’ इस अस्पष्टता को अपेक्षाकृत खुला रखता है, जबकि ‘के लिए’ केवल उद्देश्यगत अर्थ को निश्चित कर देता।
- issue: Ἐκκλησία का व्यक्तिरूप
  choice: स्त्रीलिंग सर्वनाम और ‘वृद्धा’ के साथ ‘कलीसिया’
  alternative: ‘विश्वासियों की सभा’ जैसे व्याख्यात्मक अनुवाद से व्यक्तिरूप को कम करना
  rationale: दर्शन में कलीसिया स्वयं वृद्ध स्त्री के रूप में पहचानी जाती है; इस साहित्यिक और धर्मवैज्ञानिक व्यक्तिरूप को बनाए रखना आवश्यक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। संवाद को सहज बनाने के लिए बार-बार आने वाले φημί/φησίν को ‘मैंने कहा/उसने कहा/मैंने पूछा’ से व्यक्त किया गया है। पाठ में कोई पादटिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
