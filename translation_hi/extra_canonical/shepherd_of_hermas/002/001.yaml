base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/001.yaml
  text: After she had spoken these words, the heavens were shut, and I was wholly trembling and grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved? Or how shall I make atonement to God for my completed sins? Or with what words shall I ask the Lord, that he may be propitious to me?”
translation:
  language: hi
  text: उसके ये वचन कहने के बाद आकाश बन्द हो गए, और मैं पूरी तरह काँप रहा था और दुःखी था। मैं अपने मन में कह रहा था, “यदि यह पाप मेरे विरुद्ध दर्ज किया जाता है, तो मैं कैसे उद्धार पा सकूँगा? या मैं अपने उन पापों के लिए, जो पूरे हो चुके हैं, परमेश्वर को कैसे अनुकूल कर सकूँगा?[a] या मैं किन शब्दों में प्रभु से विनती करूँ कि वह मुझ पर कृपालु हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपने उन पापों के लिए, जो पूरे हो चुके हैं, परमेश्वर को कैसे प्रसन्न कर सकूँगा?” यूनानी में ‘पूरे हो चुके’ का आशय स्पष्ट नहीं है; इसे निश्चित रूप से ‘पिछले’ या ‘गंभीर’ पाप नहीं कहा गया है।
    reason: ἐξιλάσομαι में परमेश्वर को अनुकूल/कृपालु करने का प्रायश्चित्तात्मक भाव है। τῶν ἁμαρτιῶν μου τῶν τελείων की अस्पष्टता को बनाए रखने के लिए स्पष्टीकरण दिया गया है।
lexical_decisions:
- source_word: ἐκλείσθησαν οἱ οὐρανοί
  choice: आकाश बन्द हो गए
  rationale: यूनानी में बहुवचन ‘आकाश’ और कर्मवाच्य ‘बन्द हो गए’ को यथासम्भव सुरक्षित रखा गया है।
- source_word: πεφρικὼς καὶ λυπούμενος
  choice: काँपता और शोक करता रहा
  rationale: दोनों कृदन्त हर्मास की लगातार भयभीत और दुःखी दशा बताते हैं; हिन्दी में स्वाभाविक निरन्तर अवस्था के रूप में प्रस्तुत किया गया है।
- source_word: ἀναγράφεται
  choice: मेरे खाते में लिखा जाता है
  rationale: शब्द का अर्थ अभिलेख में दर्ज या आरोपित किया जाना है; ‘खाते में लिखा’ न्यायिक-लेखागत भाव को साधारण हिन्दी में व्यक्त करता है।
- source_word: σωθῆναι
  choice: उद्धार पा सकूँगा
  rationale: धार्मिक प्रसंग में ‘बचाया जाना’ के व्यापक अर्थ को प्रचलित और गरिमापूर्ण ‘उद्धार पाना’ व्यक्त करता है।
- source_word: τῶν ἁμαρτιῶν μου τῶν τελείων
  choice: मेरे उन पापों के लिए जो पूरे हो चुके हैं
  rationale: τελείων का असामान्य शाब्दिक बल सुरक्षित रखा गया है; इसे बिना प्रमाण ‘पिछले’, ‘गम्भीर’ या ‘पूर्णतः किए गए’ पापों के रूप में निश्चित नहीं किया गया।
- source_word: ἱλατευθῇ μοι
  choice: वह मुझ पर कृपालु हो
  rationale: मध्य/कर्मवाच्य रूप यहाँ परमेश्वर की अनुकूल, दयालु प्रतिक्रिया माँगता है; सहज हिन्दी में प्रायश्चित्त-संबंधी भाव बनाए रखा गया है।
theological_decisions:
- issue: ἐξιλάσομαι τὸν Θεόν में मनुष्य द्वारा परमेश्वर को अनुकूल करने का भाव
  choice: मैं परमेश्वर को कैसे प्रसन्न करूँगा?
  alternative: मैं परमेश्वर के सामने कैसे प्रायश्चित्त करूँगा?
  rationale: मूल क्रिया का लक्ष्य स्वयं परमेश्वर है और उसमें उन्हें अनुकूल/कृपालु करने का भाव है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई, जबकि पादटिप्पणी मूल के प्रायश्चित्तात्मक तनाव को स्पष्ट करती है।
- issue: ‘पूरे हो चुके पापों’ का अर्थ
  choice: अस्पष्टता को शाब्दिक रूप में बनाए रखना
  alternative: मेरे पिछले पाप / मेरे पूरी तरह किए गए पाप
  rationale: τελείων की व्याख्या विवादित हो सकती है; संदर्भ से किसी एक अर्थ को निर्णायक रूप से थोपना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। प्रथम पुरुष की व्याकुल आत्मचर्चा और तीन क्रमिक प्रश्नों की लय सुरक्षित रखी गई है; अनावश्यक साम्प्रदायिक पारिभाषिकता से बचा गया है।
