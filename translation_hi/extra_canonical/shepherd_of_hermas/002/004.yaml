base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/004.yaml
  text: But she said, “By no means does this matter apply to the servant of God. Yet surely a thought concerning her rose up in your heart. For such an intention brings sin upon the servants of God. For it is an evil and startling intention for a most reverent spirit, and one already proven, if it should desire an evil deed—especially Hermas, the self-controlled one, who abstains from every evil desire and is full of all simplicity and great innocence.”
translation:
  language: hi
  text: लेकिन उसने कहा, “यह बात परमेश्वर के दास पर किसी भी तरह लागू नहीं होती। फिर भी उसके विषय में यह विचार निश्चय ही तुम्हारे हृदय में उठा था। परमेश्वर के दासों के लिए ऐसी मंशा पाप ले आती है। क्योंकि किसी अत्यंत पूजनीय और पहले से परखे हुए आत्मा के प्रति बुरे काम की इच्छा करना बुरी और चौंका देने वाली मंशा है—विशेषकर संयमी हेरमास के प्रति, जो हर बुरी लालसा से दूर रहता है और हर प्रकार की सरलता और बड़ी निष्कपटता से भरा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρᾶγμα τοῦτο
  choice: यह बात
  rationale: संदर्भ में आरोपित मामले या कृत्य की ओर संकेत है; ‘यह बात’ स्वाभाविक रहते हुए अभिव्यक्ति की व्यापकता बनाए रखता है।
- source_word: βουλή
  choice: मंशा
  rationale: यह केवल क्षणिक विचार नहीं, बल्कि भीतर उठी इच्छा या अभिप्राय को सूचित करता है; ‘मंशा’ नैतिक अर्थ को स्पष्ट रखता है।
- source_word: πάνσεμνον πνεῦμα
  choice: अत्यंत श्रद्धावान आत्मा
  rationale: πάνσεμνον की गहरी धार्मिक गरिमा को ‘अत्यंत श्रद्धावान’ व्यक्त करता है और πνεῦμα का सीधा रूप ‘आत्मा’ बनाए रखता है।
- source_word: δεδοκιμασμένον
  choice: पहले से परखा हुआ
  rationale: शब्द परीक्षा में प्रमाणित या खरा पाए जाने का भाव रखता है; अनावश्यक रूप से ‘स्वीकृत’ जोड़ने से बचा गया है।
- source_word: ἐγκρατής
  choice: संयमी
  rationale: आत्म-संयम रखने वाले व्यक्ति के लिए संक्षिप्त और प्रचलित हिन्दी पद।
- source_word: ἁπλότης
  choice: निष्कपटता
  rationale: यहाँ सरल, अखंड और छलरहित चरित्र का नैतिक भाव है; ‘निष्कपटता’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ἀκακία
  choice: निर्दोषता
  rationale: बुराई या दुर्भावना से रहित होने का भाव व्यक्त करता है; ‘निर्दोषता’ संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: भीतरी इच्छा और पाप का संबंध
  choice: ‘ऐसी मंशा पाप का कारण बनती है’
  alternative: ‘ऐसा विचार अपने-आप में पाप है’
  rationale: ἐπιφέρουσα का अर्थ पाप ले आना या उत्पन्न करना है। अनुवाद मूल की नैतिक गंभीरता रखता है, पर यह अतिरिक्त निर्णय नहीं करता कि हर अनचाहा विचार स्वतः पूर्ण पाप है।
- issue: ‘आत्मा’ का संदर्भ
  choice: ‘अत्यंत श्रद्धावान और पहले से परखा हुआ आत्मा’
  alternative: ‘अत्यंत पवित्र और प्रमाणित व्यक्ति’
  rationale: मूल में πνεῦμα है; इसलिए व्यक्ति कहकर व्याख्यात्मक रूप से अर्थ सीमित करने के बजाय ‘आत्मा’ को बनाए रखा गया है।
- issue: आरंभिक निषेध का आशय
  choice: ‘यह बात ... लागू नहीं होती’
  alternative: ‘तुमने यह काम बिल्कुल नहीं किया’
  rationale: मूल वाक्य संक्षिप्त और कुछ अस्पष्ट है। चुना हुआ रूप उसी अस्पष्टता को बचाता है और इसे किसी विशिष्ट व्यवस्थित पाप-सिद्धांत में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल गद्य। सीधे संबोधन, नैतिक गंभीरता और मूल की कुछ असामान्य आत्म-संदर्भित भाषा को बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
