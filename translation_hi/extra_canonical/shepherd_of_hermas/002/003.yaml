base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/003.yaml
  text: And she said to me, “Why are you gloomy, Hermas—you who are patient and not given to contention, always laughing? Why are you so downcast in appearance and not cheerful?” And I said to her, “Because of a most excellent woman, who said that I sinned against her.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे हरमास, तुम इतने उदास क्यों हो? तुम तो धीरज रखनेवाले और झगड़ा न करनेवाले हो, और सदा हँसते रहते हो। फिर तुम्हारा चेहरा इतना उतरा हुआ क्यों है, और तुम प्रसन्न क्यों नहीं हो?” मैंने उससे कहा, “एक अत्यंत भली स्त्री के कारण, जो कहती है कि मैंने उसके विरुद्ध पाप किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνός
  choice: उदास
  rationale: यह शब्द यहाँ मनोदशा और चेहरे पर छाई उदासी को व्यक्त करता है; आधुनिक हिन्दी में ‘उदास’ सहज और स्पष्ट है।
- source_word: μακρόθυμος
  choice: धीरज रखनेवाले
  rationale: शाब्दिक भाव दीर्घ-सहनशीलता का है; यह वाक्यांश साधारण पाठक के लिए स्वाभाविक रहते हुए अर्थ सुरक्षित रखता है।
- source_word: ἀστομάχητος
  choice: झगड़ा न करनेवाले
  rationale: दुर्लभ विशेषण का आशय विवाद या लड़ाई में न पड़ने वाला है; इसे व्यक्तित्वगत गुण के रूप में स्पष्ट किया गया है।
- source_word: κατηφὴς τῇ ἰδέᾳ
  choice: तुम्हारा चेहरा इतना उतरा हुआ
  rationale: यूनानी पद बाहरी रूप या मुखमुद्रा की उदासी बताता है; हिन्दी मुहावरा उसी दृश्य भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γυναικὸς ἀγαθωτάτης
  choice: एक अत्यंत भली स्त्री
  rationale: श्रेष्ठतासूचक रूप को ‘अत्यंत भली’ से व्यक्त किया गया है, बिना स्त्री की पहचान या नैतिक स्थिति पर अतिरिक्त व्याख्या जोड़े।
- source_word: ἥμαρτον εἰς αὐτήν
  choice: मैंने उसके विरुद्ध पाप किया है
  rationale: εἰς αὐτήν का संबंधात्मक और नैतिक बल ‘उसके विरुद्ध’ से सुरक्षित रहता है।
theological_decisions:
- issue: स्त्री के कथन में पाप की वास्तविकता या केवल आरोप
  choice: “जो कहती है कि मैंने उसके विरुद्ध पाप किया है”
  alternative: “जिसने कहा कि मैंने उसके विरुद्ध पाप किया था”
  rationale: लेγούσης वर्तमान कृदंत है और कथन को हरमास की वर्तमान व्यथा के कारण के रूप में रखता है। अनुवाद यह तय नहीं करता कि आरोप वस्तुतः सही है; अगले अनुच्छेद में इसका विवेचन होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। संबोधन ‘हे हरमास’ प्राचीन दर्शनात्मक प्रसंग के अनुकूल है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए यूनानी के लंबे प्रश्न को छोटे वाक्यों में बाँटा गया है।
