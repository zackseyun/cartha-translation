base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/002.yaml
  text: While I was considering these things and pondering them in my heart, I see before me a great white chair made of snowy wool. And an elderly woman came in most radiant clothing, holding a book in her hands, and sat down alone and greeted me, “Hermas, greetings.” And I, grieving and weeping, said, “Lady, greetings.”
translation:
  language: hi
  text: जब मैं इन बातों पर विचार कर रहा था और अपने हृदय में इनका विवेचन कर रहा था, तो मैंने अपने सामने बर्फ जैसे सफ़ेद ऊन से बनी एक बड़ी कुर्सी देखी। तब अत्यंत उज्ज्वल वस्त्र पहने एक वृद्धा आई। उसके हाथों में एक पुस्तक थी। वह अकेली बैठ गई और उसने मेरा अभिवादन किया, “हे हेरमास, नमस्कार।” मैंने दुःखी होकर और रोते हुए कहा, “हे स्वामिनी, नमस्कार।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλευομένου
  choice: विचार कर रहा था
  rationale: मध्यवाच्य कृदंत यहाँ मन में उपाय या अर्थ पर विचार करने को व्यक्त करता है; सहज हिन्दी में ‘विचार करना’ उपयुक्त है।
- source_word: διακρίνοντος ἐν τῇ καρδίᾳ μου
  choice: अपने हृदय में इनका विवेचन कर रहा था
  rationale: διακρίνω यहाँ भीतर-ही-भीतर तौलने या परखने का भाव रखता है; ‘विवेचन’ उस चिंतनशील अर्थ को बनाए रखता है।
- source_word: καθέδραν
  choice: कुर्सी
  rationale: शब्द बैठने के आसन को दर्शाता है; यहाँ ‘सिंहासन’ कहना मूल से अधिक राजकीय अर्थ जोड़ सकता है।
- source_word: ἐξ ἐρίων χιονίνων
  choice: बर्फ जैसे सफ़ेद ऊन से बनी
  rationale: शाब्दिक चित्र ‘हिमवत/बर्फ-सा ऊन’ का है; हिन्दी में रंग और पदार्थ दोनों स्पष्ट किए गए हैं।
- source_word: γυνὴ πρεσβῦτις
  choice: एक वृद्धा
  rationale: यह वृद्ध स्त्री का सीधा और सम्मानजनक आधुनिक हिन्दी रूप है।
- source_word: ἐν ἱματισμῷ λαμπροτάτῳ
  choice: अत्यंत उज्ज्वल वस्त्र पहने
  rationale: λαμπρότατος की दीप्तिमय दृश्य-छवि को ‘उज्ज्वल’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀσπάζεταί / χαῖρε
  choice: अभिवादन किया / नमस्कार
  rationale: χαῖρε अभिवादन और आनंद की कामना दोनों हो सकता है; संवाद में स्वाभाविक हिन्दी अभिवादन चुना गया है।
- source_word: Κυρία
  choice: स्वामिनी
  rationale: स्त्रीलिंग आदरसूचक संबोधन और अधिकार/सम्मान का भाव बनाए रखता है; केवल ‘महिला’ अपेक्षित संबोधन नहीं देता।
theological_decisions:
- issue: वृद्धा की पहचान
  choice: केवल ‘एक वृद्धा’ कहा गया
  alternative: उसे कलीसिया या किसी विशिष्ट स्वर्गीय सत्ता के रूप में पहचानना
  rationale: इस खंड में मूल पाठ स्वयं उसकी प्रतीकात्मक पहचान स्पष्ट नहीं करता; अनुवाद में बाद की व्याख्या नहीं जोड़ी गई।
- issue: καθέδρα को राजकीय या धार्मिक आसन मानना
  choice: ‘कुर्सी’
  alternative: ‘सिंहासन’ या ‘धर्मासन’
  rationale: मूल शब्द सामान्यतः आसन/कुर्सी है; अधिक विशिष्ट धार्मिक या राजकीय अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। कथन में यूनानी ऐतिहासिक वर्तमान βλέπω को हिन्दी कथा-प्रवाह के अनुकूल भूतकाल ‘देखी’ से व्यक्त किया गया है। संवाद के आदरसूचक स्वर को ‘हे हेरमास’ और ‘हे स्वामिनी’ द्वारा रखा गया है।
