base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/006.yaml
  text: Answering me, she says, "It is not because you are more worthy than all that it is revealed to you; for there are others before you and better than you, to whom it was fitting that these visions should be revealed. But in order that the name of God might be glorified, it has been revealed to you and will be revealed, for the sake of the double-minded—those who reason within their hearts whether these things are so or not. Tell them that all these things are true, and nothing is outside the truth; rather, all are strong and sure and well-founded."
translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “यह तुम्हें इसलिए प्रकट नहीं किया गया कि तुम सबसे अधिक योग्य हो; क्योंकि तुमसे पहले और तुमसे उत्तम दूसरे लोग हैं, जिन्हें ये दर्शन प्रकट किए जाने चाहिए थे। बल्कि परमेश्वर के नाम की महिमा हो, इस उद्देश्य से यह तुम्हें प्रकट किया गया है और आगे भी प्रकट किया जाएगा—उन दुविधा में पड़े लोगों[a] के कारण, जो अपने मन में विचार करते हैं कि ये बातें हैं या नहीं हैं। उनसे कहो कि ये सब बातें सत्य हैं, और कुछ भी सत्य से बाहर नहीं है; बल्कि ये सब दृढ़, निश्चित और नींव पर स्थापित हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दो मन वाले लोगों।”
    reason: διψύχους के मूल रूपक और उसके डगमगाते या विभाजित मन के भाव को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: διψύχους
  choice: दुविधा में पड़े लोगों
  rationale: शाब्दिक अर्थ ‘दो मन वाले’ है; यहाँ यह उन लोगों को सूचित करता है जो विश्वास और अविश्वास के बीच डगमगा रहे हैं। चुना हुआ वाक्यांश आधुनिक हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
- source_word: διαλογιζομένους ἐν ταῖς καρδίαις αὐτῶν
  choice: जो अपने मन में विचार करते हैं
  rationale: हृदय के भीतर तर्क-विचार करने की यूनानी अभिव्यक्ति को सहज हिन्दी में प्रस्तुत करता है; ‘मन’ यहाँ आंतरिक विचार का स्वाभाविक हिन्दी संकेत है।
- source_word: ἰσχυρὰ καὶ βέβαια καὶ τεθεμελιωμένα
  choice: दृढ़, विश्वसनीय और पक्की नींव पर स्थापित
  rationale: 'तीनों विशेषणों का क्रम और संचयी बल बनाए रखता है: सामर्थ्य/दृढ़ता, निश्चित विश्वसनीयता, और नींव पर स्थापन।'
theological_decisions:
- issue: दर्शन प्रकट किए जाने का कारण
  choice: वक्ता की योग्यता नहीं, बल्कि परमेश्वर के नाम की महिमा और दुविधाग्रस्त लोगों की सहायता
  alternative: वक्ता को अन्य लोगों से अधिक योग्य ठहराना
  rationale: यूनानी पाठ स्पष्ट रूप से श्रेष्ठ योग्यता का निषेध करता और प्रकाशन को परमेश्वर की महिमा तथा διψύχοι के कारण से जोड़ता है।
- issue: εἰ ἄρα ἔστιν ταῦτα की अस्पष्टता
  choice: ‘ये बातें वास्तव में ऐसी हैं या नहीं’
  alternative: ‘इन बातों का अस्तित्व है या नहीं’ अथवा ‘ये बातें सत्य हैं या नहीं’
  rationale: यह रूप मूल के अस्तित्वगत और सत्यतासंबंधी दोनों संभावित भावों को यथासंभव खुला रखता है और अगले वाक्य के ‘सत्य’ को समय से पहले नहीं दोहराता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद का प्रत्यक्ष रूप, निषेधात्मक बल और अंतिम त्रिस्तरीय आश्वासन सुरक्षित हैं।
