base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/004.yaml
  text: '"They too are holy angels of God; but these six are superior to them. The building of the tower, then, will be brought to completion, and all together will rejoice around the tower and will glorify God, because the building of the tower has been completed."'
translation:
  language: hi
  text: “वे भी परमेश्वर के पवित्र स्वर्गदूत हैं; परन्तु ये छः उनसे श्रेष्ठ हैं। इसलिए मीनार का निर्माण पूरा किया जाएगा, और सब मिलकर मीनार के चारों ओर आनन्द मनाएँगे और परमेश्वर की महिमा करेंगे, क्योंकि मीनार का निर्माण पूरा हो गया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅγιοι ἄγγελοι τοῦ Θεοῦ
  choice: परमेश्वर के पवित्र स्वर्गदूत
  rationale: ‘स्वर्गदूत’ आधुनिक हिन्दी में ἄγγελοι का स्वाभाविक धार्मिक पर्याय है और ‘पवित्र’ मूल विशेषण को स्पष्ट रूप से बनाए रखता है।
- source_word: ὑπερέχοντες
  choice: श्रेष्ठ
  rationale: यह चुनाव उन छः स्वर्गदूतों की दूसरों की अपेक्षा उच्चता व्यक्त करता है, पर उस उच्चता का पद, सामर्थ्य या स्वभाव निश्चित नहीं करता।
- source_word: συντελεσθήσεται
  choice: पूरा किया जाएगा
  rationale: मूल के भविष्यकाल और कर्मवाच्य—दोनों को सुरक्षित रखता है।
- source_word: εὐφρανθήσονται
  choice: आनन्द मनाएँगे
  rationale: सामूहिक हर्ष को सहज और वर्तमान मानक हिन्दी में व्यक्त करता है।
- source_word: δοξάσουσιν τὸν Θεόν
  choice: परमेश्वर की महिमा करेंगे
  rationale: प्राचीन धार्मिक अभिव्यक्ति का परिचित, गरिमापूर्ण और अर्थ-संगत हिन्दी रूप।
theological_decisions:
- issue: छः स्वर्गदूतों की अन्य स्वर्गदूतों पर उच्चता
  choice: ‘उनसे श्रेष्ठ’ कहकर तुलनात्मक उच्चता बनाए रखी गई है।
  alternative: ‘उनसे ऊँचे पद के’ या ‘उनसे अधिक सामर्थी’
  rationale: ὑπερέχοντες उच्चता बताता है, पर यहाँ उसका सटीक प्रकार स्पष्ट नहीं करता; इसलिए अनुवाद में किसी निश्चित स्वर्गदूतीय पदक्रम या सामर्थ्य-सिद्धान्त को नहीं जोड़ा गया।
- issue: मीनार के निर्माण की पूर्णता
  choice: पहले भविष्यकाल ‘पूरा किया जाएगा’ और फिर पूर्ण घटना ‘पूरा हो गया है’ रखी गई है।
  alternative: दोनों स्थानों पर केवल ‘पूरा होगा’ या ‘पूरा हुआ’
  rationale: मूल पाठ के कालगत तनाव और कथन की प्रगति को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘परन्तु’, ‘मीनार’, ‘आनन्द’ और ‘महिमा’ जैसे शब्द सामान्य पाठक के लिए परिचित हैं और मूल की औपचारिक धार्मिक शैली भी बनाए रखते हैं।
