base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/002.yaml
  text: '"These are the holy angels of God, the first-created, to whom the Lord entrusted all his creation, to increase and to build and to rule over all creation. By these, therefore, the building of the tower will be brought to completion."'
translation:
  language: hi
  text: “ये परमेश्वर के वे पवित्र स्वर्गदूत हैं, जो सबसे पहले सृजे गए थे। प्रभु ने अपनी सारी सृष्टि उन्हें सौंप दी, ताकि वे उसे बढ़ाएँ, उसका निर्माण करें और सारी सृष्टि पर अधिकार रखें। इसलिए इन्हीं के द्वारा मीनार का निर्माण पूरा किया जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πρῶτοι κτισθέντες
  choice: जो सबसे पहले सृजे गए थे
  rationale: यूनानी पदबंध के कालगत अर्थ और कर्मवाच्य को स्पष्ट रखते हुए स्वर्गदूतों को ‘प्रथम सृजित’ बताता है।
- source_word: παρέδωκεν
  choice: सौंप दी
  rationale: उत्तरदायित्व या अधिकार किसी को सौंपने का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: αὔξειν
  choice: बढ़ाएँ
  rationale: मूल क्रिया के ‘वृद्धि करना’ अर्थ को बनाए रखता है और उसे किसी अधिक विशिष्ट व्याख्या तक सीमित नहीं करता।
- source_word: οἰκοδομεῖν
  choice: निर्माण करें
  rationale: निर्माण करने के मूल बिंब को सुरक्षित रखता है; निकटवर्ती मीनार-निर्माण के प्रसंग से भी संगत है।
- source_word: δεσπόζειν
  choice: अधिकार रखें
  rationale: शासन या प्रभुत्व के अर्थ को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: διὰ τούτων
  choice: इन्हीं के द्वारा
  rationale: इन छह स्वर्गदूतों को मीनार का निर्माण पूरा होने का माध्यम बताने वाली संरचना को बनाए रखता है।
- source_word: τελεσθήσεται
  choice: पूरा किया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य और निर्माण की पूर्णता—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘सबसे पहले सृजे गए’ स्वर्गदूतों की पहचान और स्थिति
  choice: मूल कथन को सीधे ‘जो सबसे पहले सृजे गए थे’ के रूप में रखा गया
  alternative: इसे किसी विशिष्ट स्वर्गदूतीय श्रेणी, प्रधान स्वर्गदूतों या सह-सृष्टिकर्ताओं के रूप में समझाना
  rationale: पाठ केवल उनके पहले सृजे जाने और उन्हें सृष्टि संबंधी दायित्व सौंपे जाने की बात कहता है; वह उनकी कोई बाद की धर्मशास्त्रीय श्रेणी निर्धारित नहीं करता।
- issue: सृष्टि को बढ़ाने और बनाने में स्वर्गदूतों की भूमिका
  choice: उन्हें सौंपे गए कार्य के रूप में शाब्दिक तनाव बनाए रखा गया
  alternative: भूमिका को केवल देखभाल, व्यवस्था या आध्यात्मिक उन्नति तक सीमित करना
  rationale: αὔξειν और οἰκοδομεῖν सक्रिय क्रियाएँ हैं; अनुवाद ने इन्हें किसी संप्रदायगत सृष्टि-दृष्टि के अनुसार नरम या पुनर्परिभाषित नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथन। ‘सृजे गए’, ‘सृष्टि’, ‘सौंप दी’ और ‘अधिकार रखें’ जैसे शब्द धार्मिक-प्राचीन संदर्भ को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
