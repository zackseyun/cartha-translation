translation:
  language: hi
  text: 3. मैंने उससे पूछा, “महोदया, मैं इन पत्थरों की परिणति[a] और उनका सामर्थ्य किस प्रकार का है, यह जानना चाहता था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अंत” या “इनके साथ क्या होगा”; यूनानी शब्द का अर्थ किसी वस्तु की परिणति, अंत, या उसके साथ होने वाली बात हो सकता है।
    reason: ἔξοδος की अर्थ-सीमा को सुरक्षित रखना, क्योंकि प्रसंग में पत्थरों की परिणति अथवा उनके साथ क्या होगा, दोनों भाव संभव हैं।
lexical_decisions:
- source_word: Κυρία
  choice: महोदया
  rationale: यह सम्मानपूर्ण संबोधन है; ‘देवी’ अनचाहा दैवी अर्थ दे सकता है और ‘स्वामिनी’ आधुनिक हिन्दी में अस्वाभाविक लगेगा।
- source_word: ἔξοδος
  choice: परिणाम
  rationale: यहाँ शब्द पत्थरों की अंतिम दशा या उनके साथ क्या होगा, इस अर्थ में है; ‘परिणाम’ उस व्यापकता को सहज हिन्दी में रखता है।
- source_word: δύναμις
  choice: सामर्थ्य
  rationale: मूल शब्द की ‘शक्ति/प्रभाव’ संबंधी अर्थ-सीमा को बनाए रखता है और अंग्रेज़ी परामर्श-पाठ के ‘power’ से मेल खाता है।
- source_word: ποταπή ἐστιν
  choice: कैसा है
  rationale: प्रश्नवाचक वाक्यांश की गुण या प्रकार पूछने वाली अस्पष्टता को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
