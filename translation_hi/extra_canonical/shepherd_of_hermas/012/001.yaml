base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/001.yaml
  text: Answering, I say to her, "Lady, this matter is great and marvelous. And the six young men who are building—who are they, Lady?"
translation:
  language: hi
  text: मैंने उसे उत्तर देकर कहा, “हे स्वामिनी, यह बात बहुत महान और अद्भुत है। और वे छह युवक जो निर्माण कर रहे हैं—वे कौन हैं, हे स्वामिनी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς λέγω αὐτῇ
  choice: मैंने उसे उत्तर दिया
  rationale: यूनानी में कृदंत के साथ ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथन में इसे पूर्ण भूतकाल से व्यक्त किया गया है।
- source_word: Κυρία
  choice: हे स्वामिनी
  rationale: यह सम्मानपूर्ण प्रत्यक्ष संबोधन है; ‘स्वामिनी’ स्त्रीलिंग अधिकार और आदर दोनों को बनाए रखता है।
- source_word: μεγάλως καὶ θαυμαστῶς ἔχει
  choice: बहुत महान और अद्भुत है
  rationale: मुहावरे का आशय बात की असाधारण महत्ता और विस्मयकारी प्रकृति है; हिन्दी में सहज विशेषणात्मक रूप चुना गया है।
- source_word: τὸ πρᾶγμα τοῦτο
  choice: यह बात
  rationale: यहाँ πρᾶγμα किसी पूर्ववर्णित विषय या घटना की ओर संकेत करता है; ‘बात’ सामान्य पाठक के लिए स्वाभाविक और पर्याप्त व्यापक है।
- source_word: οἱ νεανίσκοι οἱ ἓξ
  choice: वे छः युवक
  rationale: νεανίσκοι का सीधा अर्थ युवा पुरुष है; संदर्भ से पहले ही स्वर्गदूतीय पहचान न जोड़कर प्रश्न की प्रगति सुरक्षित रखी गई है।
- source_word: οἱ οἰκοδομοῦντες
  choice: जो निर्माण कर रहे हैं
  rationale: क्रिया के अपूर्ण/जारी कार्य को वर्तमान प्रगतिशील रूप में रखा गया है; कर्म ‘मीनार’ इस खंड में स्पष्टतः नहीं दोहराया गया, इसलिए उसे नहीं जोड़ा गया।
theological_decisions:
- issue: छः युवकों की पहचान
  choice: प्रश्न में उन्हें केवल ‘युवक’ कहा गया है
  alternative: ‘छः युवा स्वर्गदूत’
  rationale: इस पाठ-खंड में वक्ता उनकी पहचान पूछ रहा है; अगले उत्तर की सूचना को पहले से जोड़ना कथात्मक और व्याख्यात्मक तनाव को मिटा देता।
- issue: Κυρία के धार्मिक अर्थ का निर्धारण
  choice: सम्मानसूचक ‘हे स्वामिनी’
  alternative: ‘हे देवी’ या ‘महोदया’
  rationale: यूनानी शब्द अधिकारपूर्ण स्त्री संबोधन है, पर स्वयं में देवीत्व नहीं बताता। ‘स्वामिनी’ अर्थ को सुरक्षित रखता है और अनावश्यक देवत्व आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; प्रत्यक्ष संबोधन में ‘हे’ से प्राचीन दर्शन-साहित्य का सम्मानपूर्ण स्वर रखा गया है। प्रश्नवाचक विराम और दीर्घ डैश मूल संवाद की गति स्पष्ट करते हैं।
