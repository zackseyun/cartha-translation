translation:
  language: hi
  text: 2. “और वे दूसरे, जो पत्थर ढोकर ला रहे हैं—वे कौन हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἕτεροι
  choice: वे दूसरे
  rationale: यह पहले बताए गए छह युवकों से अलग दूसरे समूह को सूचित करता है।
- source_word: παραφέροντες
  choice: ढोकर ला रहे हैं
  rationale: संदर्भ में पत्थरों को निर्माण-स्थल तक ले आने का भाव है; यह केवल ‘उठाने’ की अपेक्षा क्रिया की दिशा और प्रयोजन को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοὺς λίθους
  choice: पत्थर
  rationale: मीनार के निर्माण के संदर्भ में सामान्य और स्पष्ट हिन्दी शब्द।
