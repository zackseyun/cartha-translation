  text: 'But I, the angel of repentance, say to you: do not fear the devil. For I was sent," he says, "to be with you who are repenting with all your heart and to streng—'
translation:
  language: hi
  text: '“परन्तु मैं, पश्चाताप का दूत, तुम लोगों से कहता हूँ: शैतान से मत डरो। क्योंकि,” वह कहता है, “मुझे भेजा गया था कि मैं तुम लोगों के साथ रहूँ, जो अपने पूरे हृदय से पश्चाताप कर रहे हो, और सुदृढ़ कर—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: पश्चाताप का दूत
  rationale: ἄγγελος के लिए सहज और गरिमापूर्ण ‘दूत’ तथा μετάνοια के लिए नैतिक-आध्यात्मिक मन-परिवर्तन दर्शाने वाला प्रचलित ‘पश्चाताप’ चुना गया।
- source_word: μὴ φοβήθητε τὸν διάβολον
  choice: शैतान से मत डरो
  rationale: διάβολος यहाँ विशिष्ट विरोधी सत्ता के लिए है; आधुनिक हिन्दी में ‘शैतान’ सर्वसुलभ है। निषेध को सीधे और स्वाभाविक रूप में रखा गया।
- source_word: τῶν μετανοούντων ἐξ ὅλης καρδίας αὐτῶν
  choice: जो अपने पूरे हृदय से पश्चाताप कर रहे हो
  rationale: वर्तमान कृदन्त की जारी क्रिया और ἐξ ὅλης καρδίας की सम्पूर्ण आन्तरिक निष्ठा दोनों सुरक्षित रखी गईं।
- source_word: ἰσχυρο-
  choice: तुम्हें सामर्थ्य दूँ—
  rationale: स्रोत शब्द पृष्ठ/खंड के अंत में अधूरा है, पर आरम्भ ἰσχυρο- सुदृढ़ या समर्थ करने की दिशा बताता है। अनुवाद को डैश पर अधूरा रखकर स्रोत की खंडित अवस्था सुरक्षित रखी गई।
theological_decisions:
- issue: दूत की आत्म-पहचान और उद्धरण-विन्यास
  choice: ‘मैं, पश्चाताप का दूत’ को वक्ता की आत्म-पहचान रखा और ‘वह कहता है’ को अगले वाक्य के भीतर उद्धरण-सूचक बनाया।
  alternative: ‘पश्चाताप का दूत कहता है’ मानकर पूरे कथन को कथावाचक की रिपोर्ट बनाना।
  rationale: यूनानी Ἐγὼ ... ὁ ἄγγελος प्रत्यक्ष प्रथम-पुरुष आत्म-पहचान है, जबकि φησί कथात्मक उद्धरण-सूचक के रूप में बीच में आता है; दोनों स्तरों का तनाव बनाए रखा गया।
- issue: μετανοούντων का कालगत/आध्यात्मिक अर्थ
  choice: ‘पश्चाताप कर रहे हो’
  alternative: ‘पश्चाताप कर चुके हो’ या ‘मन फिराने वाले हो’
  rationale: वर्तमान कृदन्त निरन्तर या वर्तमान प्रक्रिया का संकेत देता है; पूर्ण हो चुके परिवर्तन का अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष और गरिमापूर्ण शैली। बहुवचन ‘तुम लोगों’ से ὑμῖν का संख्या-भेद स्पष्ट किया गया। स्रोत स्वयं ἰσχυρο- पर कटता है, इसलिए वाक्य को दीर्घ डैश के साथ जानबूझकर अधूरा छोड़ा गया; कोई अनुमानित अगला पाठ नहीं जोड़ा गया।
