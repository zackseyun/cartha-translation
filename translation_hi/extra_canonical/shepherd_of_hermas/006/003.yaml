review_pass:
  verdict: revise
  source_fidelity: 'The draft closely follows the Greek: the singular imperative, all the children, the striking designation of the wife as a future ‘sister,’ her unrestrained tongue, her hearing these words, and mercy are all retained. However, ἕξει ἔλεος is literally ‘she will have/receive mercy,’ not a passive ‘mercy will be shown to her.’'
  naturalness: The Hindi is generally clear and modern. ‘अपनी जीभ पर संयम नहीं रखती/रखेगी’ is more idiomatic than repeating ‘जीभ को रोकती/रोक लेगी,’ while retaining the Greek tongue idiom.
  terminology: ‘पत्नी’ for συμβίῳ and ‘बहन होने वाली है’ for μελλούσῃ σου ἀδελφῇ appropriately preserve the source wording without importing an explanatory interpretation. ‘दया पाएगी’ accurately retains the source’s unspecified giver of mercy.
  issues:
  - severity: medium
    issue: ‘उस पर दया की जाएगी’ changes the Greek construction.
    rationale: ἕξει ἔλεος (‘will have/receive mercy’) does not use a passive verb. ‘वह दया पाएगी’ is both idiomatic Hindi and closer to the source while leaving the giver unstated.
  - severity: low
    issue: ‘अपनी जीभ रोक लेगी’ is less natural Hindi.
    rationale: The sense is self-restraint in speech. ‘अपनी जीभ पर संयम रखेगी’ expresses this naturally without narrowing πονηρεύεται beyond the source.
  revised_text: लेकिन ये बातें अपने सभी बच्चों और अपनी पत्नी को बता दे, जो तेरी बहन होने वाली है; क्योंकि वह भी अपनी जीभ पर संयम नहीं रखती, जिसके द्वारा वह बुराई करती है। लेकिन इन बातों को सुनकर वह अपनी जीभ पर संयम रखेगी और दया पाएगी।
  revised_footnotes: []
  revision_rationale: The revision corrects the unwarranted passive rendering of ἕξει ἔλεος and makes the tongue-restraint idiom more natural in modern standard Hindi. It preserves the Greek’s unusual ‘wife … future sister’ wording and does not add a doctrinal explanation.
