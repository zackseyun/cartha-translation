base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/003.yaml
  text: But make these words known to all your children and to your wife, who is to be your sister; for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these words, she will refrain, and she will obtain mercy.
translation:
  language: hi
  text: लेकिन ये बातें अपने सभी बच्चों और अपनी पत्नी को बता दे, जो तेरी बहन होने वाली है; क्योंकि वह भी अपनी जीभ पर संयम नहीं रखती, जिसके द्वारा वह बुराई करती है। लेकिन इन बातों को सुनकर वह अपनी जीभ पर संयम रखेगी और दया पाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώρισον
  choice: बता दे
  rationale: आज्ञार्थक क्रिया का अर्थ ‘ज्ञात करा/प्रकट कर’ है; सामान्य आधुनिक हिन्दी में ‘बता दे’ सहज और स्पष्ट है।
- source_word: συμβίῳ
  choice: पत्नी
  rationale: शाब्दिक अर्थ ‘साथ रहने वाली/जीवन-संगिनी’ है; इस संदर्भ में पत्नी अभिप्रेत है।
- source_word: ἀδελφῇ
  choice: बहन
  rationale: मसीही समुदाय के पारिवारिक संबोधन को बनाए रखता है और पत्नी के साथ भावी पवित्र संबंध की मूल अभिव्यक्ति को अनिर्णीत नहीं करता।
- source_word: οὐκ ἀπέχεται τῆς γλώσσης
  choice: अपनी जीभ को नहीं रोकती
  rationale: जीभ/वाणी पर संयम न रखने के यूनानी मुहावरे को हिन्दी के स्वाभाविक मुहावरे में व्यक्त करता है।
- source_word: πονηρεύεται
  choice: बुराई करती है
  rationale: क्रिया के नैतिक अर्थ को सरल, व्यापक शब्दों में रखता है; इसे केवल कटु वचन तक सीमित नहीं करता।
- source_word: ἕξει ἔλεος
  choice: उस पर दया की जाएगी
  rationale: ग्रीक में शाब्दिक रूप से ‘दया पाएगी/दया होगी’; हिन्दी का कर्मवाच्य ईश्वरीय दया का संकेत देता है, पर कर्ता को वहाँ से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: पत्नी का ‘बहन होने वाली’ होना
  choice: जो तेरी बहन होने वाली है
  alternative: जो तेरी बहन के समान होगी
  rationale: मूल पाठ में उपमा-सूचक शब्द नहीं है। सीधी अभिव्यक्ति मूल की असामान्यता और संभावित नैतिक-आध्यात्मिक तनाव को सुरक्षित रखती है।
- issue: दया का कर्ता
  choice: उस पर दया की जाएगी
  alternative: वह दया पाएगी
  rationale: मूल पाठ दया देने वाले का स्पष्ट नाम नहीं लेता। कर्मवाच्य इस अनिर्दिष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में मूल के एकवचन और निकटता को दिखाने के लिए ‘तेरी’ तथा ‘दे’ रखा गया है। भाषा साधारण पाठक के लिए सहज है, फिर भी भविष्यवाणी-सदृश गंभीरता बनी रहती है।
