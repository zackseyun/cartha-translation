revisions:
- from: पर ये बातें अपने सभी बच्चों और अपनी पत्नी को बता दे, जो तेरी बहन होने वाली है; क्योंकि वह भी अपनी जीभ को नहीं रोकती, जिससे वह बुराई करती है। लेकिन इन बातों को सुनकर वह अपनी जीभ रोक लेगी और उस पर दया की जाएगी।
  to: लेकिन ये बातें अपने सभी बच्चों और अपनी पत्नी को बता दे, जो तेरी बहन होने वाली है; क्योंकि वह भी अपनी जीभ पर संयम नहीं रखती, जिसके द्वारा वह बुराई करती है। लेकिन इन बातों को सुनकर वह अपनी जीभ पर संयम रखेगी और दया पाएगी।
  rationale: The revision corrects the unwarranted passive rendering of ἕξει ἔλεος and makes the tongue-restraint idiom more natural in modern standard Hindi. It preserves the Greek’s unusual ‘wife … future sister’ wording and does not add a doctrinal explanation.
