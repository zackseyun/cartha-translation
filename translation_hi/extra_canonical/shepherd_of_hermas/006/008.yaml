base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/008.yaml
  text: For the Lord swore by his Son that those who denied their Lord are cut off from their life—those who are now about to deny him in the coming days; but to those who denied before, because of his great compassion, he became merciful.”
translation:
  language: hi
  text: क्योंकि प्रभु ने अपने पुत्र की शपथ खाकर कहा है कि जिन्होंने अपने प्रभु का इन्कार किया है, वे अपने जीवन से वंचित कर दिए गए हैं—वे जो अब आने वाले दिनों में उसका इन्कार करने वाले हैं। पर जिन्होंने पहले इन्कार किया था, उन पर उसने अपनी अपार करुणा के कारण दया की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤμοσεν ... κατὰ τοῦ υἱοῦ αὐτοῦ
  choice: अपने पुत्र की शपथ खाकर कहा है
  rationale: यूनानी शपथ-सूत्र को स्वाभाविक और गंभीर हिन्दी में व्यक्त करता है; काल का प्रभाव वर्तमान तक बनाए रखने के लिए ‘कहा है’ रखा गया है।
- source_word: ἀπεγνωσθαι ἀπὸ τῆς ζωῆς αὐτῶν
  choice: अपने जीवन से वंचित ठहराए गए हैं
  rationale: ἀπογιγνώσκω के दण्डात्मक ‘निराश/अस्वीकृत ठहराना’ भाव तथा ἀπὸ τῆς ζωῆς के पृथक्करण को बनाए रखता है, बिना इसे किसी विशिष्ट उत्तरकालीन सिद्धान्त में सीमित किए।
- source_word: τοὺς νῦν μέλλοντας ἀρνεῖσθαι
  choice: वे जो ... अब उसका इनकार करनेवाले हैं
  rationale: μέλλοντας की आसन्न भविष्यता और νῦν के ‘अब’ दोनों को स्पष्ट रखता है।
- source_word: πολυσπλαγχνία
  choice: अपार करुणा
  rationale: गहरी, प्रचुर दयालुता के अर्थ को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἵλεως ἐγένετο αὐτοῖς
  choice: उन पर ... दया की
  rationale: शाब्दिक ‘उनके प्रति अनुग्रही हुआ’ की अपेक्षा सहज हिन्दी है और कृपालुता का मूल भाव सुरक्षित रखता है।
theological_decisions:
- issue: इनकार करनेवालों के जीवन से अलग किए जाने का स्वरूप
  choice: ‘अपने जीवन से वंचित ठहराए गए हैं’
  alternative: ‘उनके जीवन की आशा छोड़ दी गई है’ अथवा ‘वे जीवन से काट दिए गए हैं’
  rationale: मूल वाक्य कठोर न्यायिक/बहिष्करणकारी भाषा रखता है, पर यह स्पष्ट नहीं करता कि ‘जीवन’ सांसारिक जीवन है या उद्धार/अनन्त जीवन। चयन इस तनाव और अस्पष्टता को बनाए रखता है।
- issue: पहले इनकार करनेवालों के लिए दया और भविष्य में इनकार करनेवालों के लिए न्याय
  choice: कालगत विरोध को स्पष्ट रूप से सुरक्षित रखा गया
  alternative: दोनों समूहों पर एक समान सामान्य कथन
  rationale: मूल पाठ πρότερον और νῦν ... ἐρχομέναις ἡμέραις के बीच जानबूझकर भेद करता है; इसे किसी व्यवस्थित पश्चाताप-सिद्धान्त द्वारा समतल नहीं किया गया।
- issue: ‘अपने पुत्र की शपथ’ का असामान्य सूत्र
  choice: मूल संबंध को ज्यों का त्यों रखा गया
  alternative: ‘अपने पुत्र के नाम की शपथ’ या ‘अपने पुत्र के विषय में शपथ’
  rationale: κατά + संबंधकारक यहाँ शपथ के आधार/साक्षी का संकेत देता है; पाठ की असामान्य धार्मिक भाषा को व्याख्यात्मक विस्तार से नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘इनकार’ को धार्मिक संदर्भ में सहज होने के कारण चुना गया; ‘अस्वीकार’ भी संभव था, पर वह यहाँ अपेक्षाकृत कम व्यक्तिगत लगता। वाक्य की भविष्यसूचक चेतावनी और करुणा के बीच का तीखा विरोध सुरक्षित है।
