base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/002.yaml
  text: “Your offspring, Hermas, have rejected God and blasphemed the Lord, and they have betrayed their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed them, they gained no advantage, but they added still to their sins licentious acts and mixtures of wickedness, and thus their lawless deeds were filled up.
translation:
  language: hi
  text: “तुम्हारी सन्तान ने, हरमास, परमेश्वर को ठुकराया और प्रभु की निन्दा की; उन्होंने घोर दुष्टता में अपने माता-पिता के साथ विश्वासघात किया और माता-पिता के विश्वासघातियों की बात सुनी। फिर भी विश्वासघात करके उन्हें कोई लाभ नहीं हुआ; बल्कि उन्होंने अपने पापों में कामुक आचरण और बुराइयों के घालमेल[a] और जोड़ दिए। इस प्रकार उनके अधर्म भर गए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बुराइयों के घालमेल’ के लिए यूनानी पद का अर्थ मिश्रण, उलझाव, या विविध बुराइयों का परस्पर मिल जाना हो सकता है।
    reason: συμφυρμοὺς πονηρίας असामान्य और अर्थ की दृष्टि से व्यापक अभिव्यक्ति है; टिप्पणी किसी एक निश्चित प्रकार की बुराई थोपे बिना यह व्यापकता स्पष्ट करती है।
lexical_decisions:
- source_word: Τὸ σπέρμα σου
  choice: तुम्हारी सन्तान
  rationale: शाब्दिक अर्थ ‘तुम्हारा बीज’ है, पर यहाँ वंशजों/बच्चों के सामूहिक अर्थ में स्वाभाविक हिन्दी ‘तुम्हारी सन्तान’ है।
- source_word: ἠθέτησαν εἰς τὸν Θεόν
  choice: परमेश्वर को ठुकराया
  rationale: क्रिया परमेश्वर के प्रति अस्वीकार और अविश्वासपूर्ण व्यवहार व्यक्त करती है; ‘ठुकराया’ इस बल को सहज हिन्दी में रखता है।
- source_word: προέδωκαν τοὺς γονεῖς αὐτῶν
  choice: अपने माता-पिता को धोखा दिया
  rationale: προδίδωμι विश्वासघात या धोखा देने का भाव रखता है; प्रसंग में माता-पिता के विरुद्ध विश्वासघाती आचरण अभिप्रेत है।
- source_word: ἤκουσαν προδότας γονέων
  choice: माता-पिता के विश्वासघाती कहलाए
  rationale: शाब्दिक संरचना ‘विश्वासघाती के रूप में सुने गए’ है; यहाँ प्रतिष्ठा या संबोधन का अर्थ है, जिसे ‘कहलाए’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀσελγηίας
  choice: कामुक आचरण
  rationale: शब्द निर्लज्ज, अनियंत्रित और प्रायः यौन अनैतिकता का संकेत देता है; ‘कामुक आचरण’ अर्थ को स्पष्ट रखता है, पर किसी विशिष्ट कृत्य तक सीमित नहीं करता।
- source_word: συμφυρμοὺς πονηρίας
  choice: बुराई के घालमेल
  rationale: συμφυρμός का मूल भाव मिला-जुला होना, उलझाव या घालमेल है; असामान्य यूनानी अभिव्यक्ति की व्यापकता बनाए रखने के लिए इसे किसी एक प्रकार की बुराई तक सीमित नहीं किया गया।
- source_word: ἐπλήσθησαν αἱ ἀνομίαι αὐτῶν
  choice: उनके अधर्मों का माप पूरा भर गया
  rationale: मूल में ‘अधर्म भर गए’ की परिपूर्णता का रूपक है; हिन्दी में ‘माप पूरा भर गया’ उस रूपक और संचयी न्याय-बोध को स्वाभाविक बनाता है।
theological_decisions:
- issue: परमेश्वर के प्रति अपराध का स्वरूप
  choice: ‘परमेश्वर को ठुकराया’
  alternative: ‘परमेश्वर के प्रति विश्वासघात किया’
  rationale: मूल क्रिया अस्वीकार, उल्लंघन या अविश्वास—इन अर्थों की सीमा में है। ‘ठुकराया’ किसी विशिष्ट धर्मशास्त्रीय श्रेणी को आरोपित किए बिना परमेश्वर-विरोधी अस्वीकार को सामने रखता है।
- issue: पापों के भर जाने का न्याय-संबंधी रूपक
  choice: ‘अधर्मों का माप पूरा भर गया’
  alternative: ‘उनके अधर्म पूरे हो गए’
  rationale: ‘माप’ मूल में प्रत्यक्ष संज्ञा नहीं है, फिर भी भरने की छवि को हिन्दी में स्पष्ट करता है। इससे अंतिम न्याय की कोई अतिरिक्त व्यवस्थित व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और श्रव्य शैली रखी गई है। ‘हे हरमास’ संबोधन को औपचारिक बनाया गया है; वाक्यों को पठनीयता के लिए विभाजित किया गया है, जबकि मूल के आरोपों की क्रमिक तीव्रता और अन्तिम ‘माप भरने’ की छवि सुरक्षित रखी गई है।
