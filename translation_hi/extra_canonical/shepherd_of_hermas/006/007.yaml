base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/007.yaml
  text: Persevere, then, you who work righteousness, and do not be double‑minded, so that your passing may be with the holy angels. Blessed are you who endure the great tribulation that is coming, and who will not deny their life.
translation:
  language: hi
  text: इसलिए, तुम जो धार्मिकता का आचरण करते हो, दृढ़ बने रहो और दुविधा में मत पड़ो, ताकि तुम्हारा पारगमन पवित्र स्वर्गदूतों के साथ हो। धन्य हो तुम सब, जो आने वाले बड़े क्लेश को सहते हो और अपने जीवन से मुकरेंगे नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμμείνατε
  choice: दृढ़ बने रहो
  rationale: क्रिया का अर्थ किसी आचरण में टिके या बने रहना है; अगले कृदंत के साथ इसे स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: तुम जो धार्मिकता के काम करते हो
  rationale: ἐργάζομαι की सक्रियता और δικαιοσύνη के नैतिक-धार्मिक अर्थ दोनों सुरक्षित रहते हैं।
- source_word: μὴ διψυχήσητε
  choice: दुविधा में मत पड़ो
  rationale: διψυχέω मन के दो ओर बँटने, संदेह करने या अस्थिर होने का भाव देता है; 'दुविधा' इसे सहज आधुनिक हिन्दी में रखता है।
- source_word: ἡ πάροδος
  choice: पारगमन
  rationale: शब्द का अर्थ गुजरना, प्रस्थान या मार्ग से पार होना हो सकता है। दुर्लभ 'पारगमन' मूल की अस्पष्टता को किसी एक व्याख्या—विशेषतः मृत्यु—तक सीमित नहीं करता।
- source_word: ὑπομένετε
  choice: सहते हो
  rationale: आने वाले क्लेश के संदर्भ में धैर्यपूर्वक टिके रहने और सहने का भाव है।
- source_word: τὴν θλῖψιν τὴν ἐρχομένην τὴν μεγάλην
  choice: आने वाले बड़े क्लेश
  rationale: मूल के भविष्याभिमुख और तीव्र संकट के भाव को संक्षिप्त, परिचित धार्मिक हिन्दी में रखा गया है।
- source_word: τὴν ζωὴν αὐτῶν
  choice: अपने जीवन
  rationale: शाब्दिक अर्थ बनाए रखा गया है; अगले वाक्य के संदर्भ के बावजूद इसे चुपचाप 'प्रभु' या 'मसीह' में नहीं बदला गया।
theological_decisions:
- issue: πάροδος का आशय
  choice: पारगमन
  alternative: प्रस्थान / मृत्यु के बाद जाना
  rationale: पाठ यह स्पष्ट नहीं करता कि संकेत मृत्यु, अंतिम यात्रा या किसी अन्य पार होने की ओर है; इसलिए अर्थगत तनाव सुरक्षित रखा गया है।
- issue: ‘अपने जीवन का इनकार’ का संदर्भ
  choice: अपने जीवन का इनकार नहीं करेंगे
  alternative: अपने प्रभु का इनकार नहीं करेंगे / जीवन को नहीं त्यागेंगे
  rationale: वर्तमान पद में यूनानी पाठ स्पष्ट रूप से ‘उनके जीवन’ कहता है। अगले पद में प्रभु का इनकार करने की चर्चा संभव व्याख्यात्मक संदर्भ देती है, पर इस पद की वास्तविक शब्दावली को बदला नहीं गया।
- issue: ‘धार्मिकता के काम’ और उद्धार
  choice: कर्म करने की आज्ञा को बिना व्याख्यात्मक विस्तार के रखा
  alternative: इसे पुण्य अर्जित करने या केवल विश्वास के प्रमाण के रूप में स्पष्ट करना
  rationale: मूल पाठ संबंध को व्यवस्थित धर्मशास्त्रीय सूत्र में नहीं बाँधता; अनुवाद भी कोई साम्प्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए बोधगम्य। ‘पारगमन’ अपेक्षाकृत साहित्यिक है, पर मूल की असामान्य और अस्पष्ट अभिव्यक्ति को बनाए रखने के लिए चुना गया है। संबोधन का बहुवचन ‘तुम’ पूरे पद में सुसंगत रखा गया है।
