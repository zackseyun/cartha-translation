base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/005.yaml
  text: 'For the Master swore by his glory concerning his chosen ones: if, after this appointed day, sin should still occur, they have no salvation; for repentance has an end for the righteous. The days of repentance have been fulfilled for all the holy ones, but for the nations there is repentance until the last day.'
translation:
  language: hi
  text: 'क्योंकि स्वामी ने अपनी महिमा की शपथ खाकर अपने चुने हुओं के संबंध में कहा: यदि इस नियत दिन के बाद भी पाप हो, तो उनके लिए उद्धार नहीं है; क्योंकि धर्मियों के लिए पश्चाताप का अंत है। सभी पवित्र जनों के लिए पश्चाताप के दिन पूरे हो चुके हैं, पर अन्यजातियों के लिए अंतिम दिन तक पश्चाताप है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  choice: स्वामी
  rationale: यहाँ δεσπότης अधिकार-संपन्न प्रभु या स्वामी को दर्शाता है; निकटवर्ती κύριος से शब्दगत भेद बनाए रखने के लिए ‘स्वामी’ चुना गया।
- source_word: κατὰ τῆς δόξης αὐτοῦ
  choice: अपनी महिमा की शपथ खाकर
  rationale: शपथ के यूनानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करते हुए ‘महिमा’ को शपथ के आधार के रूप में सुरक्षित रखा गया।
- source_word: οἱ ἐκλεκτοί
  choice: चुने हुए
  rationale: चुनाव की धार्मिक अर्थछाया बनाए रखने वाला सरल और प्रचलित हिन्दी पद।
- source_word: ὡρισμένης τῆς ἡμέρας ταύτης
  choice: इस ठहराए हुए दिन के बाद
  rationale: γενitive absolute का कालगत अर्थ है कि यह दिन निर्धारित हो चुका है; ‘ठहराया हुआ’ उसकी नियत प्रकृति को दर्शाता है।
- source_word: ἁμάρτησις
  choice: पाप किया गया
  rationale: संज्ञात्मक और कुछ हद तक अनिश्चित अभिव्यक्ति को निष्पक्ष कर्मवाच्य में रखा गया, ताकि कर्ता या पाप की प्रकृति अनावश्यक रूप से निश्चित न हो।
- source_word: σωτηρία
  choice: उद्धार
  rationale: धार्मिक संदर्भ में स्थापित हिन्दी शब्द, जो बचाव और अंतिम मुक्ति दोनों की अर्थछाया रखता है।
- source_word: μετάνοια
  choice: पश्चाताप
  rationale: यह मन-परिवर्तन और पाप से फिरने की धारणा वाला प्रचलित धार्मिक शब्द है। अंतिम वाक्य में अर्थ की स्वाभाविकता के लिए ‘पश्चाताप का अवसर’ कहा गया।
- source_word: τοῖς δικαίοις
  choice: धर्मियों के लिए
  rationale: नैतिक-धार्मिक स्थिति को दर्शाने वाला सीधा और परिचित अनुवाद।
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों
  rationale: ‘संतों’ की संभावित संस्थागत या संप्रदायगत अर्थछाया से बचते हुए मूल के सामुदायिक अर्थ को रखा गया।
- source_word: τοῖς ἔθνεσιν
  choice: अन्यजातियों
  rationale: संदर्भ में यह परमेश्वर के पवित्र समुदाय से बाहर की जातियों/गैर-यहूदियों को दर्शाता है; ‘राष्ट्रों’ की अपेक्षा धार्मिक विरोध स्पष्ट करता है।
- source_word: ἕως ἐσχάτης ἡμέρας
  choice: अंतिम दिन तक
  rationale: मूल की कालगत तथा संभावित अंतकालीन अर्थछाया दोनों सुरक्षित रहती हैं।
theological_decisions:
- issue: ठहराए हुए दिन के बाद पाप और उद्धार की अनुपलब्धता
  choice: 'मूल की कठोर चेतावनी को ज्यों का त्यों रखा गया: ‘उनके लिए उद्धार नहीं होगा।’'
  alternative: इसे केवल लगातार या जानबूझकर किए गए पाप तक सीमित करना।
  rationale: यूनानी पाठ पाप का प्रकार स्पष्ट नहीं करता; व्याख्यात्मक सीमा जोड़ना मूल की धर्मवैचारिक तीव्रता को अनुचित रूप से कम कर देता।
- issue: धर्मियों के पश्चाताप की सीमा
  choice: ‘पश्चाताप की एक सीमा है’ अनुवाद किया गया।
  alternative: ‘धर्मियों के लिए पश्चाताप समाप्त हो चुका है।’
  rationale: ἔχει τέλος सामान्य सिद्धांत के रूप में सीमा या अंत बताता है, जबकि अगला वाक्य पवित्र जनों के दिनों के पूरे होने को विशिष्ट रूप से कहता है; दोनों कथनों का तनाव बनाए रखा गया।
- issue: पवित्र जनों और अन्यजातियों के लिए अलग समय-सीमा
  choice: भेद को स्पष्ट रूप से सुरक्षित रखा गया।
  alternative: दोनों समूहों को सामान्य मानवता के रूप में मिला देना।
  rationale: पाठ स्वयं τοῖς ἁγίοις और τοῖς ἔθνεσιν में स्पष्ट विरोध स्थापित करता है; इसे समतल करना स्रोत-साक्ष्य के विरुद्ध होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली रखी गई है। यूनानी की गंभीर न्याय-संबंधी भाषा और धर्मवैचारिक तनाव को बिना संप्रदायगत व्याख्या जोड़े सुरक्षित रखा गया है।
