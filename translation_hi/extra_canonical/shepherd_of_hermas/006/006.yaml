- from: इसलिए कलीसिया के अगुओं से कहना कि वे धार्मिकता में अपने मार्ग सीधे करें, ताकि वे बड़ी महिमा के साथ प्रतिज्ञाओं को पूरी रीति से प्राप्त करें।
  to: इसलिए कलीसिया के अगुओं से कहना कि वे धार्मिकता के अनुसार अपने मार्ग सीधे करें, ताकि वे बहुत महिमा के साथ प्रतिज्ञाओं को पूरी तरह प्राप्त करें।
  rationale: The revision is limited to idiomatic Hindi phrasing. It preserves the source’s plural “promises,” its nontechnical designation for church leaders, the ethical force of setting one’s ways straight, and the final phrase “with much glory.”
