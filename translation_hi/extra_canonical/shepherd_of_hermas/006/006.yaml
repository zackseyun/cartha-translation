  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/006.yaml
  text: Therefore you shall say to those who lead the church that they should set their ways straight in righteousness, so that they may receive the promises in full, with much glory.
translation:
  language: hi
  text: इसलिए कलीसिया के अगुओं से कहना कि वे धार्मिकता के अनुसार अपने मार्ग सीधे करें, ताकि वे बहुत महिमा के साथ प्रतिज्ञाओं को पूरी तरह प्राप्त करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: कलीसिया के अगुओं
  rationale: यह पदबंध कलीसिया में आगे रहकर नेतृत्व करने वालों को दर्शाता है; ‘अगुए’ आधुनिक हिन्दी में सहज और पदविशेष से अनावश्यक रूप से सीमित नहीं है।
- source_word: κατορθώσωνται τὰς ὁδοὺς αὐτῶν
  choice: वे अपने मार्ग सीधे करें
  rationale: यूनानी मुहावरे की नैतिक दिशा और सक्रिय सुधार—दोनों को बनाए रखता है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता में
  rationale: नैतिक रूप से सही जीवन की स्रोतगत धारणा को संक्षिप्त और धर्मग्रंथीय हिन्दी में व्यक्त करता है।
- source_word: ἀπολάβωσιν ἐκ πλήρους
  choice: पूरी रीति से प्राप्त करें
  rationale: ‘पूर्ण मात्रा में पा लें’ के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰς ἐπαγγελίας
  choice: प्रतिज्ञाओं
  rationale: बहुवचन को सुरक्षित रखता है और ईश्वरीय वादों के लिए प्रचलित, गरिमापूर्ण शब्द है।
- source_word: μετὰ πολλῆς δόξης
  choice: बड़ी महिमा के साथ
  rationale: ‘बहुत महिमा सहित’ की अपेक्षा अधिक स्वाभाविक रहते हुए स्रोत की तीव्रता बनाए रखता है।
theological_decisions:
- issue: प्रतिज्ञाओं के कर्ता का स्पष्ट उल्लेख
  choice: स्रोत की तरह कर्ता को अनकहा रखा गया
  alternative: परमेश्वर की प्रतिज्ञाएँ
  rationale: यूनानी पाठ केवल ‘प्रतिज्ञाओं’ कहता है; ‘परमेश्वर की’ जोड़ना अर्थतः संभव है, पर मूल की संक्षिप्तता और अंतर्निहितता को बदल देता।
- issue: नेतृत्व-पद की पहचान
  choice: व्यापक शब्द ‘अगुए’
  alternative: अध्यक्ष या पुरोहित
  rationale: मूल पदबंध किसी विशिष्ट बाद की कलीसियाई पद-व्यवस्था को अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। वाक्य में आज्ञात्मक संदेश, नैतिक सुधार और प्रतिज्ञाओं की पूर्ण प्राप्ति—तीनों पर समान बल रखा गया है।
