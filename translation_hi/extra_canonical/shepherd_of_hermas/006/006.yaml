review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the addressees (those leading the church), the command to rectify their conduct, righteousness, the full reception of the plural promises, and accompanying great glory. No unsupported ecclesiastical office or theological qualification is introduced.
  naturalness: The expression “धार्मिकता में अपने मार्ग सीधे करें” is understandable but overly literal in modern Hindi. “धार्मिकता के अनुसार अपने मार्ग सीधे करें” retains the Greek sense while reading more naturally. “पूरी तरह” is also more idiomatic here than “पूरी रीति से.”
  terminology: “कलीसिया के अगुओं” appropriately renders τοῖς προηγουμένοις τῆς ἐκκλησίας without imposing a later technical office. “धार्मिकता,” “प्रतिज्ञाओं,” and “महिमा” are suitable established scriptural-register terms.
  issues:
  - severity: low
    issue: Literal-sounding locative phrasing
    rationale: “धार्मिकता में” is a close formal rendering of ἐν δικαιοσύνῃ, but Hindi more naturally expresses the governing ethical standard as “धार्मिकता के अनुसार.”
  - severity: low
    issue: Slightly less idiomatic expression of completeness
    rationale: “पूरी तरह प्राप्त करें” is more natural modern standard Hindi than “पूरी रीति से प्राप्त करें,” without changing ἐκ πλήρους.
  revised_text: इसलिए कलीसिया के अगुओं से कहना कि वे धार्मिकता के अनुसार अपने मार्ग सीधे करें, ताकि वे बहुत महिमा के साथ प्रतिज्ञाओं को पूरी तरह प्राप्त करें।
  revised_footnotes: []
  revision_rationale: The revision is limited to idiomatic Hindi phrasing. It preserves the source’s plural “promises,” its nontechnical designation for church leaders, the ethical force of setting one’s ways straight, and the final phrase “with much glory.”
