base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/001.yaml
  text: 'After fifteen days, when I had been fasting and had asked the Lord many things, the understanding of the writing was revealed to me. And this was written:'
translation:
  language: hi
  text: 'पंद्रह दिन उपवास करने और प्रभु से बहुत-सी बातें पूछने के बाद, मुझे उस लेख की समझ प्रकट हुई। उसमें ये बातें लिखी थीं:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ δέκα καὶ πέντε ἡμέρας
  choice: पंद्रह दिन बीतने के बाद
  rationale: समय-संबंधी यूनानी वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νηστεύσαντός μου
  choice: जब मैं उपवास कर चुका था
  rationale: aorist participle की पूर्वपूर्त क्रिया को मुख्य प्रकाशन से पहले घटित कार्य के रूप में बनाए रखता है।
- source_word: πολλὰ ἐρωτήσαντος τὸν Κύριον
  choice: प्रभु से बहुत कुछ पूछ चुका था
  rationale: ἐρωτάω और अस्पष्ट बहुवचन πολλά का सीधा अर्थ रखता है; इसे प्रार्थना या याचना तक सीमित नहीं करता।
- source_word: ἡ γνῶσις τῆς γραφῆς
  choice: उस लिखित संदेश का अर्थ
  rationale: γνῶσις को यहाँ समझ/अर्थ और γραφή को संदर्भानुसार पहले मिले लिखित संदेश के रूप में प्रस्तुत करता है; केवल लेखन-कला या अनिवार्यतः धर्मशास्त्रीय ‘पवित्रशास्त्र’ का संकेत नहीं देता।
- source_word: ἀπεκαλύφθη μοι
  choice: मुझ पर प्रकट किया गया
  rationale: दैवी निष्क्रियता और प्रकाशन की भाषा को सुरक्षित रखता है।
- source_word: ἦν δὲ γεγραμμένα ταῦτα
  choice: उसमें यह लिखा था
  rationale: मुहावरेदार हिन्दी में लिखित विषय की ओर संक्रमण करता है।
theological_decisions:
- issue: γραφή का आशय
  choice: लिखित संदेश
  alternative: पवित्रशास्त्र / लेख
  rationale: इस प्रसंग में यह उस लिखी हुई सामग्री को सूचित करता है जिसका अर्थ हर्मास को बताया गया; इसे प्रामाणिक धर्मग्रंथ घोषित करना मूल पाठ से अधिक विशिष्ट होता।
- issue: प्रकाशन का कर्ता
  choice: 'निहित रखा गया: ‘प्रकट किया गया’'
  alternative: परमेश्वर ने मुझे प्रकट किया
  rationale: यूनानी निष्क्रिय रूप कर्ता का नाम नहीं बताता; अनकही दैवी एजेंसी को स्पष्ट नाम देकर पाठ की सीमा नहीं लाँघी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अर्थ’ पाठक के लिए γνῶσις की प्रसंगगत भावना स्पष्ट करता है, जबकि ‘मुझ पर प्रकट किया गया’ प्रकाशन-संबंधी गंभीरता बनाए रखता है।
