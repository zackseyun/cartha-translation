base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/004.yaml
  text: After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they repent with all their heart and remove from their heart their double‑mindedness.
translation:
  language: hi
  text: जब तुम उन्हें ये वचन बता दोगे, जिन्हें स्वामी ने मुझे आज्ञा दी कि तुम पर प्रकट किए जाएँ, तब उनके वे सभी पाप क्षमा कर दिए जाएँगे जो उन्होंने पहले किए थे; और उन सभी पवित्र जनों के भी, जिन्होंने आज के दिन तक पाप किया है—यदि वे पूरे हृदय से मन फिराएँ और अपने हृदय से अपना दोमनापन[a] दूर कर दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘दो आत्माएँ/दो मन होना’। इसका आशय संदेह, मन की अस्थिरता, या बँटी हुई निष्ठा हो सकता है।
    reason: διψυχία की अर्थ-सीमा को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: δεσπότης
  choice: स्वामी
  rationale: यह शब्द अधिकार-संपन्न प्रभु या मालिक को दर्शाता है; ‘स्वामी’ इसके औपचारिक और धार्मिक स्वर को बनाए रखता है।
- source_word: μετανοήσωσιν
  choice: मन फिराएँ
  rationale: यह केवल खेद नहीं, बल्कि हृदय और दिशा के परिवर्तन को व्यक्त करता है; आधुनिक धार्मिक हिन्दी में भी सहज है।
- source_word: διψυχίας
  choice: दोहरे मन
  rationale: यूनानी शब्द का शाब्दिक भाव ‘दो मन वाला होना’ है और इसमें संदेह, अस्थिरता तथा बँटी हुई निष्ठा की गुंजाइश बनी रहती है।
- source_word: ἅγιοι
  choice: पवित्र जन
  rationale: ‘संत’ से जुड़ी बाद की संस्थागत या संप्रदायगत धारणाओं को आरोपित किए बिना समुदाय के पवित्र लोगों का अर्थ देता है।
theological_decisions:
- issue: पापों की क्षमा और मन फिराने का संबंध
  choice: 'शर्तात्मक कथन को उसी रूप में रखा गया: ‘यदि वे पूरे हृदय से मन फिराएँ…’'
  alternative: क्षमा को पहले से पूर्ण या मन फिराने से असंबद्ध बताना
  rationale: यूनानी ἐὰν के साथ स्पष्ट शर्त रखता है; पाठ के धार्मिक तनाव को बिना व्याख्यात्मक समाधान के सुरक्षित रखा गया है।
- issue: प्रकाशित किए जाने की वाक्य-रचना
  choice: ‘स्वामी ने मुझ पर प्रकट करने की आज्ञा दी थी ताकि मैं उन्हें तुम पर प्रकट करूँ’
  alternative: ‘जिन्हें स्वामी ने आज्ञा दी कि वे तुम पर प्रकट किए जाएँ’
  rationale: यूनानी वाक्य में प्रकाशन का आशय स्पष्ट है, पर हिन्दी में शाब्दिक कर्मवाच्य अत्यंत असहज होता; चुना गया रूप हर्मास को संदेशवाहक मानते हुए संदर्भगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संबोधन में ‘तुम’ का प्रयोग आसपास के व्यक्तिगत निर्देश के अनुरूप है।
