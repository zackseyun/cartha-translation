base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/003.yaml
  text: '"For this reason then," I say, "sir, I inquire of you carefully about everything: first, because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are many and manifold."'
translation:
  language: hi
  text: '“इसी कारण, महोदय,” मैंने कहा, “मैं आपसे हर बात के विषय में ध्यानपूर्वक पूछता हूँ: पहले इसलिए कि मैं पापी हूँ; फिर इसलिए कि मैं नहीं जानता कि कौन-से काम करके मैं जीऊँगा, क्योंकि मेरे पाप बहुत और अनेक प्रकार के हैं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξακριβάζομαι
  choice: ठीक-ठीक जानकारी माँगता हूँ
  rationale: यह क्रिया किसी बात की सावधानी और विस्तार से जाँच-पड़ताल करने या सटीक जानकारी लेने का भाव रखती है; यह अनुवाद वर्तमान संवाद में स्वाभाविक है।
- source_word: κύριε
  choice: महोदय
  rationale: यहाँ वक्ता अपने मार्गदर्शक को आदर से संबोधित करता है; ‘प्रभु’ कहने से अनावश्यक रूप से दैवी संबोधन समझा जा सकता है।
- source_word: ποῖα ἔργα ἐργαζόμενος
  choice: कौन-से काम करके
  rationale: मूल की ‘किन कर्मों को करते हुए’ संरचना का अर्थ सहज आधुनिक हिन्दी में रखा गया है।
- source_word: ζήσομαι
  choice: मैं जीवन पाऊँगा
  rationale: भविष्यकालीन ‘जीऊँगा’ के साथ प्रसंग में निहित उद्धार/परमेश्वर के लिए जीवन की संभावना खुली रखता है, बिना उसे अधिक स्पष्ट करके सीमित किए।
- source_word: πολλαί ... καὶ ποικίλαι
  choice: बहुत और अनेक प्रकार के
  rationale: पापों की संख्या और विविधता—दोनों अलग-अलग बलों को सुरक्षित रखा गया है।
theological_decisions:
- issue: ζήσομαι में ‘जीवन’ का आशय
  choice: जीवन पाऊँगा
  alternative: जीवित रहूँगा / उद्धार पाऊँगा
  rationale: ग्रीक केवल ‘जीऊँगा’ कहता है और अगले वाक्य में ‘परमेश्वर के लिए जीएगा’ आता है। ‘जीवन पाऊँगा’ आध्यात्मिक आयाम को संभव रखता है, पर इसे सीधे ‘उद्धार’ नहीं बनाता।
- issue: κύριε का संबोधन
  choice: महोदय
  alternative: प्रभु
  rationale: संबोधित पात्र आज्ञाओं की शिक्षा देने वाला है, पर इस पद में उसे परमेश्वर के रूप में पहचानना आवश्यक नहीं; अतः सम्मानसूचक किंतु गैर-दैवी संबोधन चुना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण, आत्मस्वीकारपूर्ण और सहज कथन। मूल के ‘पहला... फिर...’ क्रम तथा पापों की बहुलता और विविधता बनाए रखी गई है।
