base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/001.yaml
  text: I asked him again, saying, "Since the Lord has counted me worthy that you should dwell with me always, bear with a few more words from me, since I understand nothing, and my heart has been hardened by my former deeds. Give me understanding, for I am very foolish and altogether perceive nothing."
translation:
  language: hi
  text: मैंने फिर उससे पूछा, “चूँकि प्रभु ने मुझे इस योग्य समझा है कि तुम सदा मेरे साथ निवास करो, इसलिए मेरी कुछ और बातें धैर्य से सुन लो; क्योंकि मैं कुछ भी नहीं समझता, और मेरे पहले के कामों के कारण मेरा हृदय कठोर हो गया है। मुझे समझ-बूझ दो, क्योंकि मैं बहुत मूर्ख हूँ और बिलकुल कुछ नहीं समझता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄξιόν με ἡγήσατο
  choice: मुझे इस योग्य समझा है
  rationale: यूनानी पदबंध में प्रभु द्वारा योग्य ठहराने या मानने का भाव है; यह अनुग्रह और पात्रता के बीच निहित तनाव को बनाए रखता है।
- source_word: κατοικῇς
  choice: निवास करो
  rationale: क्रिया स्थायी रूप से साथ रहने का संकेत देती है; ‘निवास करना’ गरिमापूर्ण और स्रोत के निकट है।
- source_word: ὀλίγα μου ῥήματα ἔτι ἀνασχοῦ
  choice: मेरी कुछ और बातें सह लो
  rationale: ἀνέχομαι का अर्थ धैर्यपूर्वक सहना है; विनती का आत्मनम्र स्वर सुरक्षित रहता है।
- source_word: οὐ συνίω οὐδέν
  choice: मैं कुछ भी नहीं समझता
  rationale: दोहरी नकारात्मक अभिव्यक्ति पूर्ण अबोधता पर बल देती है।
- source_word: ἡ καρδία μου πεπώρωται
  choice: मेरा हृदय कठोर हो गया है
  rationale: πωρόω संवेदनहीन या कठोर हो जाने को व्यक्त करता है; हिन्दी में ‘हृदय कठोर होना’ स्वाभाविक और अर्थसंगत है।
- source_word: συνέτισόν με
  choice: मुझे समझ दो
  rationale: आज्ञार्थक क्रिया किसी को समझ-बूझ प्रदान करने या सिखाने का भाव रखती है; सरल आधुनिक हिन्दी में इसे सीधे व्यक्त किया गया है।
- source_word: ὅλως οὐθὲν νοῶ
  choice: कुछ भी नहीं समझ पाता
  rationale: ὅλως पूर्णतः/बिल्कुल का बल देता है; ‘कुछ भी नहीं’ और ‘समझ पाता’ मिलकर असमर्थता का स्वाभाविक हिन्दी रूप देते हैं।
theological_decisions:
- issue: प्रभु द्वारा वक्ता को योग्य समझना
  choice: ‘मुझे इस योग्य समझा है’
  alternative: ‘मुझे योग्य ठहराया है’
  rationale: ‘समझा है’ ἡγήσατο के मूल्यांकनात्मक अर्थ के अधिक निकट है और औपचारिक धार्मिक ‘धर्मी ठहराने’ की धारणा को अनावश्यक रूप से नहीं लाता।
- issue: हृदय की कठोरता और पिछले कर्मों का संबंध
  choice: ‘मेरे पिछले कामों के कारण मेरा हृदय कठोर हो गया है’
  alternative: ‘मेरे पिछले कामों से मेरा हृदय सुन्न हो गया है’
  rationale: स्रोत का ἀπό कारण अथवा स्रोत का भाव दे सकता है; हिन्दी में कारण-संबंध स्पष्ट रखा गया है, जबकि ‘कठोर’ बाइबिलीय और सामान्य दोनों प्रयोगों में सुबोध है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विनम्र, गरिमापूर्ण और सहज संवादात्मक शैली अपनाई गई है। स्रोत की आत्मनिंदा और आग्रह की तीव्रता बनाए रखी गई है; अनावश्यक धर्म-सांप्रदायिक शब्दावली से बचा गया है।
