  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/004.yaml
  text: '"You will live," he says, "if you keep my commandments and walk in them; and whoever, having heard these commandments, keeps them, will live to God."'
translation:
  language: hi
  text: उसने कहा, “यदि तुम मेरी आज्ञाओं को मानोगे और उनके अनुसार चलोगे, तो जीवित रहोगे। और जो कोई इन आज्ञाओं को सुनकर उन्हें मानेगा, वह परमेश्वर के लिए जीवित रहेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃς / φυλάξῃ
  choice: मानोगे / मानेगा
  rationale: यहाँ φυλάσσω का अर्थ आज्ञाओं को केवल सुरक्षित रखना नहीं, बल्कि उनका पालन करना है; आधुनिक हिन्दी में ‘आज्ञाओं को मानना’ स्वाभाविक और स्पष्ट है।
- source_word: πορευθῇς ἐν αὐταῖς
  choice: उनके अनुसार चलोगे
  rationale: यूनानी रूपक ‘उनमें चलना’ जीवन-आचरण को दर्शाता है; ‘उनके अनुसार चलना’ रूपक और आशय दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: ζήσῃ / ζήσεται
  choice: जीवित रहोगे / जीवित रहेगा
  rationale: ‘जीना’ और ‘जीवन पाना’ दोनों अर्थ-संभावनाएँ उपस्थित हैं। ‘जीवित रहना’ मूल की भविष्यकालीन अभिव्यक्ति को निकटता से रखता है और प्रसंग के आध्यात्मिक आयाम को बंद नहीं करता।
- source_word: τῷ Θεῷ
  choice: परमेश्वर के लिए
  rationale: यूनानी दत्तिव का सर्वाधिक सीधा प्रतिनिधित्व ‘परमेश्वर के लिए’ है। इसे ‘परमेश्वर में’ या ‘परमेश्वर के सामने’ करके निहितार्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: आज्ञापालन और जीवन के बीच संबंध
  choice: 'मूल के शर्तसूचक कथन को ज्यों का त्यों रखा गया: ‘यदि… तो…।’'
  alternative: इसे केवल आज्ञापालन के प्रमाण या परिणाम के रूप में व्याख्यायित करना।
  rationale: पाठ स्वयं आज्ञाओं को मानने और जीवन के बीच सीधा शर्तसूचक संबंध व्यक्त करता है; अनुवाद में किसी विशिष्ट उद्धार-सिद्धांत को आरोपित नहीं किया गया।
- issue: ‘परमेश्वर के लिए जीवित रहेगा’ का अर्थ
  choice: दत्तिव की अस्पष्टता को ‘परमेश्वर के लिए’ द्वारा बनाए रखा गया।
  alternative: ‘परमेश्वर में जीवित रहेगा’ या ‘परमेश्वर के सामने जीवित रहेगा।’
  rationale: इन विकल्पों में से प्रत्येक एक विशेष व्याख्या को प्रमुख करता; स्रोत पाठ अधिक खुला है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। प्रत्यक्ष वचन और दोहराव को मूल के अनुरूप बनाए रखते हुए हिन्दी वाक्यक्रम स्वाभाविक किया गया है।
