review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the argument: repentance itself is presented as great understanding; the sinner recognizes evil done before the Lord, recalls the deed, turns from evil to good, and humbles and afflicts himself. The bracketed/possibly secondary explicit subject ὁ ἀνήρ is reasonably represented by “जिस मनुष्य ने पाप किया है.” A small revision better represents ἐπὶ τῆς μετανοίας εἰμί as a entrusted sphere of responsibility rather than the Hindi idiom “काम पर नियुक्त.”'
  naturalness: 'Several phrases are understandable but not fully natural in modern standard Hindi: “पश्चाताप के काम पर नियुक्त,” “अपने प्राण को दीन करता,” and, to a lesser degree, “भरपूर भलाई करता.” The revised wording is idiomatic while retaining the source’s force and repeated dialogue formula.'
  terminology: “पश्चाताप” is appropriate for μετάνοια. “समझदारी” is a more natural Hindi rendering of σύνεσις in this argument than the somewhat stiff nominal phrase “बड़ी समझ की बात.” “अपने आपको नम्र करता और कष्ट देता है” preserves the two distinct, intentionally unspecific actions expressed by ταπεινοῖ … καὶ βασανίζει.
  issues:
  - severity: medium
    issue: “पश्चाताप के काम पर नियुक्त हूँ” is awkward and slightly imprecise.
    rationale: ἐπὶ τῆς μετανοίας εἰμί denotes being set over/assigned to repentance; “काम पर” is not natural for this responsibility in Hindi. “पश्चाताप का दायित्व मुझे सौंपा गया है” conveys the role without specifying an ecclesiastical office.
  - severity: medium
    issue: “अपने प्राण को दीन करता” is not idiomatic modern Hindi.
    rationale: ψυχή here means one’s own self/soul, and ταπεινοῖ means humbles. “अपने आपको नम्र करता” is clear, natural, and does not weaken the following βασανίζει (“कष्ट देता है”).
  - severity: low
    issue: “भरपूर भलाई करता है” is a less natural collocation.
    rationale: The source and English audit trail express abundant doing of good. “बहुत भलाई करता है” is straightforward modern Hindi and preserves the contrast with doing evil.
