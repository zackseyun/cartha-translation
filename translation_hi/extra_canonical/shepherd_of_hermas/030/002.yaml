  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/002.yaml
  text: Answering me, he says, "I," he says, "am appointed over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he repents and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that repentance is great understanding."
translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “मुझे पश्चाताप का दायित्व सौंपा गया है, और जो भी पश्चाताप करते हैं, उन सबको मैं समझ देता हूँ। क्या तुम्हें नहीं लगता कि पश्चाताप करना ही समझदारी है? पश्चाताप करना बड़ी समझदारी है। क्योंकि जिस मनुष्य ने पाप किया है, वह समझता है कि उसने प्रभु के सामने बुराई की है; और उसका किया हुआ कर्म उसके हृदय में उभर आता है। तब वह पश्चाताप करता है और फिर बुराई नहीं करता, बल्कि बहुत भलाई करता है; वह अपने आपको नम्र करता और कष्ट देता है, क्योंकि उसने पाप किया है। इसलिए तुम देखते हो कि पश्चाताप बड़ी समझदारी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῆς μετανοίας εἰμί
  choice: पश्चाताप के काम पर नियुक्त हूँ
  rationale: यह पदबंध किसी कार्यक्षेत्र पर अधिकार, देखरेख या नियुक्ति का संकेत देता है। केवल ‘मैं पश्चाताप पर हूँ’ हिन्दी में अस्पष्ट होता; चुना गया रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है, पर पद या अधिकार की अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: μετάνοια / μετανοεῖν
  choice: पश्चाताप / पश्चाताप करना
  rationale: यह प्रचलित और गरिमापूर्ण हिन्दी शब्द है, जिसमें पाप को पहचानकर मन और आचरण बदलने का भाव समा सकता है।
- source_word: σύνεσις
  choice: समझ / बड़ी समझ की बात
  rationale: यहाँ शब्द नैतिक-बोध और विवेकपूर्ण पहचान को दर्शाता है। ‘समझ’ सामान्य पाठक के लिए स्वाभाविक है; विधेय वाक्य में ‘बड़ी समझ की बात’ हिन्दी मुहावरे के अनुसार सहज है।
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: उसके हृदय में उभर आता है
  rationale: यूनानी रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्मरण और अंतःकरण में पुनः उपस्थित होने का अर्थ स्पष्ट करता है।
- source_word: τὸ ἀγαθὸν πολυτελῶς ἐργάζεται
  choice: भरपूर भलाई करता है
  rationale: πολυτελῶς का मूल भाव बहुतायत, उदारता या उत्कृष्ट ढंग से करने का है। ‘भरपूर’ मात्रा और उत्साह का भाव देता है, बिना इसे धन-संबंधी ‘महँगे ढंग से’ समझने के।
- source_word: ταπεινοῖ τὴν ἑαυτοῦ ψυχὴν καὶ βασανίζει
  choice: अपने प्राण को दीन करता और कष्ट देता है
  rationale: दोनों कठोर आत्म-अनुशासनात्मक क्रियाओं को अलग-अलग रखा गया है। ‘प्राण’ ψυχή के व्यक्ति के आंतरिक स्व का गरिमापूर्ण प्रतिनिधित्व करता है; पाठ में निहित न होने के कारण इसे किसी विशिष्ट तपस्या-पद्धति में नहीं बदला गया।
theological_decisions:
- issue: पश्चाताप और समझ का संबंध
  choice: ‘पश्चाताप करना अपने-आप में समझ है’ और ‘बड़ी समझ की बात है’
  alternative: ‘पश्चाताप बुद्धिमत्ता है’
  rationale: मूल पाठ पश्चाताप को स्वयं σύνεσις कहता है। अनुवाद ने इस मजबूत पहचान को बनाए रखा है, पर ‘बुद्धिमत्ता’ से आने वाले बौद्धिक कौशल के संकुचित अर्थ से बचा है।
- issue: ‘अपने प्राण को ... कष्ट देता है’ का अर्थ
  choice: कठोर और कुछ हद तक खुला कथन बनाए रखा
  alternative: ‘मन में दुःखी होता है’ या ‘उपवास करता है’
  rationale: मूल βασανίζει तीव्र कष्ट या अनुशासन का भाव रखता है, पर किसी खास बाहरी साधना को निर्दिष्ट नहीं करता। इसलिए न तो इसे केवल भावना बनाया गया, न कोई विशेष धार्मिक अभ्यास जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठक के लिए स्पष्ट किन्तु गरिमापूर्ण। वक्ता की बार-बार आने वाली ‘उसने कहा’ शैली को मूल की संवादात्मक लय के कारण रखा गया है। मुख्य पाठ में कोई पादटिप्पणी-चिह्न आवश्यक नहीं है।
