revisions:
- from: पर यदि क्रोधी स्वभाव उमड़ पड़े, तो पवित्र आत्मा को—जो कोमल है—तुरन्त घुटन होने लगती है, क्योंकि उसे कोई शुद्ध स्थान नहीं मिलता; और वह उस स्थान से हट जाना चाहता है। कारण यह है कि वह दुष्ट आत्मा के द्वारा दबाया जाता है और क्रोधी स्वभाव से अशुद्ध हो जाने के कारण उसे प्रभु की सेवा अपनी इच्छा के अनुसार करने का स्थान नहीं मिलता। क्योंकि धीरज में प्रभु निवास करता है, पर क्रोधी स्वभाव में शैतान। इसलिए जब दोनों आत्माएँ एक ही स्थान में निवास करती हैं, तो यह उस मनुष्य के लिए अनुपयोगी और हानिकारक होता है जिसमें वे निवास करती हैं।
