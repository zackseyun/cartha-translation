  text: But if a quick temper comes on, at once the holy spirit—being tender—is cramped, not having a clean place, and it seeks to withdraw from that place; for it is choked by the evil spirit, not having room to minister to the Lord as it desires, being defiled by the quick temper. For in long-suffering the Lord dwells, but in quick temper the devil. Therefore, when both spirits dwell together in one, it is unprofitable and harmful to that person in whom they dwell.
translation:
  language: hi
  text: पर यदि शीघ्र भड़कने वाला क्रोध आ पड़े, तो पवित्र आत्मा—जो कोमल है—तुरन्त तंग पड़ जाती है, क्योंकि उसे शुद्ध स्थान नहीं मिलता; और वह उस स्थान से हट जाना चाहती है। क्योंकि वह दुष्ट आत्मा से दबाई जाती है और उस क्रोध से अशुद्ध हो जाती है; इसलिए उसे प्रभु की सेवा अपनी इच्छा के अनुसार करने के लिए स्थान नहीं मिलता। क्योंकि धीरज में प्रभु निवास करता है, पर शीघ्र भड़कने वाले क्रोध में शैतान। इसलिए जब दोनों आत्माएँ एक साथ निवास करती हैं, तो यह उस मनुष्य के लिए अनुपयोगी और हानिकारक होता है जिसमें वे निवास करती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: क्रोधी स्वभाव
  rationale: यह शब्द केवल एक क्षण के क्रोध को नहीं, बल्कि शीघ्र भड़क उठने वाली चिड़चिड़ी और क्रोधपूर्ण प्रवृत्ति को दर्शाता है; ‘क्रोधी स्वभाव’ इस अनुच्छेद में उसके आत्मिक प्रभाव और स्थायी प्रवृत्ति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τρυφερόν
  choice: कोमल
  rationale: यहाँ आत्मा की नाज़ुकता या कठोर बुराई से असंगति का भाव है; ‘कोमल’ गरिमापूर्ण और सहज है।
- source_word: στενοχωρεῖται
  choice: घुटन होने लगती है
  rationale: मूल क्रिया तंग जगह में दबने या संकट में पड़ने की स्थानगत छवि रखती है, जिसे आगे πνίγεται और ‘स्थान’ की भाषा पुष्ट करती है।
- source_word: λειτουργῆσαι
  choice: सेवा करने
  rationale: संदर्भ में परमेश्वर/प्रभु के प्रति की जाने वाली सेवा अभिप्रेत है; ‘सेवा’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक रूप से किसी विशिष्ट अनुष्ठान तक अर्थ सीमित नहीं करती।
- source_word: ἀσύμφορον
  choice: अनुपयोगी
  rationale: शब्द का आशय लाभकारी न होने से है; पास के πονηρόν से भेद बनाए रखने के लिए इसे ‘हानिकारक’ से अलग अनूदित किया गया है।
- source_word: πονηρόν
  choice: हानिकारक
  rationale: इस प्रसंग में व्यक्ति पर पड़ने वाले बुरे परिणाम को व्यक्त करता है; ‘हानिकारक’ ἀσύμφορον के साथ स्वाभाविक युग्म बनाता है।
theological_decisions:
- issue: τὸ πνεῦμα τὸ ἅγιον की पहचान और हिन्दी में व्यक्तिकरण
  choice: ‘पवित्र आत्मा’ तथा उसके लिए एकवचन व्यक्तिवाचक भाषा
  alternative: ‘पवित्र आत्मिक शक्ति’ या ‘पवित्र आत्मा’ को अवैयक्तिक ढंग से प्रस्तुत करना
  rationale: यूनानी पाठ में निश्चित पदबंध, निवास करना, इच्छा रखना और सेवा करना जैसी व्यक्तिगत क्रियाएँ हैं। अनुवाद इन्हें बनाए रखता है, पर इस अंश से आगे कोई व्यवस्थित त्रिएकत्वीय निष्कर्ष नहीं जोड़ता।
- issue: दो आत्माओं का एक ही व्यक्ति में निवास
  choice: पाठ के तनावपूर्ण कथन को ज्यों का त्यों बनाए रखना
  alternative: इसे केवल दो मनोभावों या बारी-बारी से होने वाले प्रभाव के रूप में समझाकर नरम करना
  rationale: मूल स्पष्टतः ‘दोनों आत्माएँ’ और ‘जिसमें वे निवास करती हैं’ कहता है। अनुवाद इस कठिन धर्मवैज्ञानिक भाषा को व्याख्यात्मक रूप से हल नहीं करता।
- issue: ἐν τῇ μακροθυμίᾳ ὁ Κύριος κατοικεῖ
  choice: ‘धीरज में प्रभु निवास करता है’
  alternative: ‘धीरज रखने वाले में प्रभु निवास करता है’
  rationale: मूल अमूर्त गुण ‘धीरज’ को ही निवास-क्षेत्र के रूप में रखता है। उसकी रूपकात्मक तीक्ष्णता को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। स्थान, घुटन, दबाव और निवास की परस्पर जुड़ी मूल रूपक-श्रृंखला सुरक्षित है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
