base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/005.yaml
  text: Quick temper, for its part, is first foolish—flighty and senseless. Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage. Then rage—composed of so many evils—becomes a great and incurable sin.
translation:
  language: hi
  text: पर जल्दी क्रोध करने वाला स्वभाव पहले तो मूर्ख, चंचल और विवेकहीन होता है। फिर विवेकहीनता से कड़वाहट उत्पन्न होती है; कड़वाहट से गुस्सा; गुस्से से क्रोध; और क्रोध से उग्र रोष। फिर इतनी सारी बुराइयों से बना उग्र रोष एक बड़ा और असाध्य पाप बन जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: क्रोधी स्वभाव
  rationale: यह शब्द केवल क्षणिक क्रोध नहीं, बल्कि शीघ्र भड़क उठने की प्रवृत्ति बताता है; इसलिए स्वभावगत अर्थ सुरक्षित रखा गया है।
- source_word: μωρά
  choice: मूर्ख
  rationale: मूल के नैतिक और बौद्धिक अविवेक के सीधे वर्णन को बनाए रखता है।
- source_word: ἐλαφρά
  choice: चंचल
  rationale: यहाँ हलकेपन या अस्थिरता का भाव है; ‘चंचल’ आधुनिक हिन्दी में उस अस्थिर, उतावले गुण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἄφρων / ἀφροσύνη
  choice: विवेकहीन / विवेकहीनता
  rationale: दोनों संबद्ध रूपों को हिन्दी में भी एक ही शब्द-मूल से व्यक्त करके तर्क-श्रृंखला सुरक्षित रखी गई है।
- source_word: πικρία
  choice: कड़वाहट
  rationale: शाब्दिक और भावात्मक दोनों अर्थों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: θυμός
  choice: गुस्सा
  rationale: ὀργή और μῆνις से क्रमिक भेद दिखाने के लिए आरंभिक उग्र भाव के रूप में सामान्य शब्द चुना गया है।
- source_word: ὀργή
  choice: क्रोध
  rationale: θυμός के बाद अधिक स्थिर और गंभीर क्रोध की अवस्था व्यक्त करता है।
- source_word: μῆνις
  choice: प्रचंड रोष
  rationale: क्रम की चरम, तीव्र और विनाशकारी अवस्था को दर्शाता है, जबकि पूर्ववर्ती क्रोध-संज्ञाओं से भेद भी बना रहता है।
- source_word: ἀνίατος
  choice: असाध्य
  rationale: ‘जिसका उपचार न हो सके’ के रूपक को संक्षिप्त और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्रोध की अवस्थाओं और पाप के बीच क्रमिक संबंध
  choice: मूल की कारणात्मक शृंखला को बिना नरम किए ज्यों का त्यों रखा गया है।
  alternative: सभी यूनानी क्रोध-संबंधी शब्दों को केवल ‘क्रोध’ कहकर दोहराना।
  rationale: अलग-अलग हिन्दी शब्द मूल में दिखाई गई बढ़ती हुई नैतिक गिरावट और चरम अवस्था को स्पष्ट करते हैं।
- issue: ‘असाध्य पाप’ का अर्थ
  choice: ἀνίατος का रूपक ‘असाध्य’ के रूप में रखा गया है।
  alternative: ‘अक्षम्य पाप’ कहना।
  rationale: मूल शब्द उपचार या चंगाई से संबंधित है, क्षमा की संभावना पर स्पष्ट धर्मशास्त्रीय दावा नहीं करता; इसलिए ‘अक्षम्य’ कहना अनुचित विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए स्पष्ट, किंतु गरिमापूर्ण। वाक्य की पुनरावृत्तिमूलक शृंखला मूल यूनानी की नैतिक प्रगति को दिखाने के लिए बनाए रखी गई है।
