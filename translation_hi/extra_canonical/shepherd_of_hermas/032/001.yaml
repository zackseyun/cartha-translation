base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/001.yaml
  text: “Be long-suffering,” he says, “and sensible, and you will gain mastery over all wicked deeds and do every work of righteousness. For if you are long-suffering, the holy spirit that dwells in you will be pure, not being darkened by another evil spirit; rather, dwelling in a wide space it will exult and rejoice with the vessel in which it dwells, and it will minister to God with much cheerfulness, having prosperity within itself.
translation:
  language: hi
  text: “धीरज रखो,” वह कहता है, “और समझदार बनो; तब तुम सब बुरे कामों पर प्रभुत्व पाओगे और धार्मिकता का हर काम करोगे। क्योंकि यदि तुम धीरज रखोगे, तो तुम्हारे भीतर वास करने वाला पवित्र आत्मा शुद्ध रहेगा; वह किसी दूसरे दुष्ट आत्मा के द्वारा अंधकारमय नहीं किया जाएगा। बल्कि खुले स्थान में वास करते हुए वह उस पात्र के साथ, जिसमें वह वास करता है, उल्लसित और आनन्दित होगा; और अपने भीतर समृद्धि रखते हुए बड़े हर्ष से परमेश्वर की सेवा करेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακρόθυμος / μακροθυμία
  choice: धीरज रखो / धीरज
  rationale: यहाँ शब्द क्रोध को रोककर सहनशील बने रहने का भाव देता है। आधुनिक सामान्य हिन्दी में ‘धीरज’ स्वाभाविक और संदर्भानुकूल है।
- source_word: συνετός
  choice: समझदार
  rationale: व्यावहारिक विवेक और सही समझ के सामान्य अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατακυριεύσεις
  choice: विजय पाओगे
  rationale: मूल में बुरे कामों पर प्रभुत्व स्थापित करने का प्रबल भाव है; ‘विजय पाना’ उसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐργάσῃ πᾶσαν δικαιοσύνην
  choice: हर प्रकार की धार्मिकता का आचरण करोगे
  rationale: ἐργάζομαι के सक्रिय ‘करना/साधना’ और δικαιοσύνη के नैतिक धार्मिक आचरण, दोनों को व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: स्रोत का प्रचलित और स्पष्ट हिन्दी समतुल्य; पद में निहित व्यक्तित्व-सदृश क्रियाओं को भी सुरक्षित रखता है।
- source_word: ἐν εὐρυχώρῳ
  choice: खुले स्थान में
  rationale: शाब्दिक स्थानिक रूपक को बनाए रखता है और उसे केवल ‘स्वतंत्रता’ जैसे अमूर्त अर्थ में सीमित नहीं करता।
- source_word: σκεύους
  choice: पात्र
  rationale: मनुष्य/शरीर के लिए प्रयुक्त मूल रूपक को सुरक्षित रखता है।
- source_word: λειτουργήσει
  choice: सेवा करेगा
  rationale: परमेश्वर के प्रति की जाने वाली सेवा का व्यापक धार्मिक भाव देता है, बिना किसी विशिष्ट अनुष्ठानिक अर्थ को अनिवार्य किए।
- source_word: εὐθηνίαν
  choice: भरपूरी
  rationale: यहाँ आंतरिक समृद्धि, सहजता या फलने-फूलने का भाव है; ‘भरपूरी’ उस सकारात्मक अवस्था को संक्षेप में व्यक्त करती है।
theological_decisions:
- issue: ‘पवित्र आत्मा’ के लिए क्रिया-लिंग
  choice: पुल्लिंग एकवचन क्रियाएँ—‘रहेगा’, ‘होगा’, ‘करेगा’
  alternative: ‘आत्मा’ के व्याकरणिक स्त्रीलिंग के अनुसार ‘रहेगी’, ‘होगी’, ‘करेगी’
  rationale: हिन्दी के सामान्य मसीही प्रयोग में ‘पवित्र आत्मा’ के लिए व्यक्तित्व-सूचक पुल्लिंग सर्वनाम और क्रियाएँ प्रचलित हैं; इससे मूल की व्यक्तित्व-सदृश भाषा भी स्पष्ट रहती है।
- issue: आत्मा की ‘शुद्ध’ अवस्था
  choice: ‘शुद्ध रहेगा’ के रूप में स्रोत की भाषा सीधे रखी
  alternative: ‘निर्बाध रहेगा’ या ‘तुम्हें शुद्ध रखेगा’ कहकर धर्मवैज्ञानिक कठिनाई कम करना
  rationale: मूल καθαρὸν ἔσται को बिना धर्मवैज्ञानिक पुनर्व्याख्या के सुरक्षित रखना आवश्यक है।
- issue: दूसरे दुष्ट आत्मा द्वारा अंधकार डाला जाना
  choice: रूपक को यथावत रखा
  alternative: ‘प्रभावित नहीं होगा’ जैसे व्याख्यात्मक रूप में देना
  rationale: मूल पाठ की आत्मिक और स्थानिक कल्पना तथा उसका तनाव सुरक्षित रहता है।
- issue: ‘पात्र’ और उसमें वास करने वाले आत्मा का संबंध
  choice: मनुष्य को ‘पात्र’ कहने वाला रूपक बनाए रखा
  alternative: स्पष्ट करके ‘शरीर’ या ‘मनुष्य’ लिखना
  rationale: मूल σκεῦος जानबूझकर रूपकात्मक और कुछ हद तक अस्पष्ट है; उसे संकीर्ण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। उद्धरण-रूप और स्रोत के आत्मिक/स्थानिक रूपक बनाए रखे गए हैं। यह मसौदा केवल दिए गए reader segment 1, अर्थात् यूनानी अनुच्छेद 1–2, का अनुवाद करता है; parent-section में आगे का पाठ इस खंड में शामिल नहीं किया गया।
