base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/004.yaml
  text: You see, then, that long-suffering is sweeter than honey and is serviceable to the Lord, and he dwells in it; but quick temper is bitter and useless. If, therefore, quick temper is mixed with long-suffering, long-suffering is defiled and is no longer useful to God. Long-suffering at all times has nothing bitter within itself, remaining always gentle and quiet. This long-suffering, then, dwells with those who have the faith complete.
translation:
  language: hi
  text: इसलिए तुम देखते हो कि धीरज मधु से भी अधिक मीठा है और प्रभु के लिए उपयोगी है, और प्रभु उसमें निवास करता है। परन्तु शीघ्र क्रोध कड़वा और किसी काम का नहीं है। इसलिए यदि शीघ्र क्रोध धीरज में मिल जाए, तो धीरज अशुद्ध हो जाता है और फिर परमेश्वर के लिए उपयोगी नहीं रहता। धीरज हर समय अपने में कोई कड़वाहट नहीं रखता; वह सदा नम्र और शांत बना रहता है। इसलिए यह धीरज उन लोगों में निवास करता है जिनका विश्वास संपूर्ण है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακροθυμία
  choice: धीरज
  rationale: यहाँ इसका अर्थ उकसावे के बीच लंबे समय तक शांत और सहनशील बने रहने का गुण है; ‘धीरज’ आधुनिक हिन्दी में स्वाभाविक है और क्रोध के साथ दिए गए विरोध को बनाए रखता है।
- source_word: ὀξυχολία
  choice: शीघ्र क्रोध
  rationale: शब्द अचानक या आसानी से भड़कने वाले क्रोध को दर्शाता है। ‘शीघ्र क्रोध’ इसकी तीव्रता और तत्क्षणता को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: εὔχρηστος
  choice: के काम का
  rationale: इसका मूल भाव उपयोगी या सेवा के योग्य होना है। ‘प्रभु/परमेश्वर के काम का’ सुलभ हिन्दी में वही सेवामूलक अर्थ व्यक्त करता है।
- source_word: κατοικεῖ
  choice: निवास करता है
  rationale: निवास के रूपक को औपचारिक किंतु परिचित हिन्दी में ज्यों का त्यों रखा गया है।
- source_word: ὁλόκληρον
  choice: संपूर्ण
  rationale: यह पूर्ण, अखंड या किसी कमी से रहित होने का भाव देता है; ‘संपूर्ण’ मूल की व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: ‘प्रभु उसमें निवास करता है’ का अभिप्राय
  choice: मूल के प्रत्यक्ष कथन को बनाए रखा
  alternative: इसे केवल ‘प्रभु उससे प्रसन्न होता है’ के रूप में समझाकर अनूदित करना
  rationale: यूनानी पाठ निवास करने की स्पष्ट भाषा इस्तेमाल करता है; इसे प्रसन्नता मात्र में बदलना मूल के आत्मिक और नैतिक तनाव को कम कर देता।
- issue: ‘संपूर्ण विश्वास’ का स्वरूप
  choice: ‘जिनका विश्वास संपूर्ण है’
  alternative: ‘जो पूरी तरह विश्वास करते हैं’
  rationale: मूल में ‘विश्वास’ की गुणवत्ता को संपूर्ण कहा गया है; वैकल्पिक क्रियात्मक रूप किसी व्यक्ति के विश्वास करने की मात्रा पर अनावश्यक बल डाल सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मधु, कड़वाहट, मिश्रण, अशुद्धि और निवास के मूल रूपकों को संरक्षित किया गया है। ‘शीघ्र क्रोध’ सामान्य बोलचाल के ‘तुनकमिज़ाजी’ की अपेक्षा अधिक पारदर्शी और औपचारिक है।
