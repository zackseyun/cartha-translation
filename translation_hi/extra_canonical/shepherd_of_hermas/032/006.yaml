base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/006.yaml
  text: For when all these spirits dwell in one vessel, the very vessel in which the holy spirit also dwells, that vessel cannot contain them; it overflows. The tender spirit, having no habit of dwelling with an evil spirit or with harshness, withdraws from such a person and seeks to dwell with gentleness and quiet. Then, when it has departed from that person in whom it dwells, that person becomes empty of the righteous spirit; and thereafter, being filled with evil spirits, he is unstable in all his deeds, dragged here and there by the evil spirits, and is altogether blinded from his good understanding. Thus it happens to all who are quick-tempered.
translation:
  language: hi
  text: क्योंकि जब ये सब आत्माएँ एक ही पात्र में निवास करती हैं—उसी पात्र में जिसमें पवित्र आत्मा भी निवास करता है—तो वह पात्र उन सबको समा नहीं पाता, बल्कि भरकर छलक जाता है। इसलिए वह कोमल आत्मा, जो न किसी दुष्ट आत्मा के साथ रहने का अभ्यस्त है, न कठोरता के साथ, ऐसे मनुष्य से अलग हो जाता है और नम्रता तथा शांति के साथ निवास करना चाहता है। फिर जब वह उस मनुष्य से चला जाता है जिसमें वह निवास करता था, तो वह मनुष्य धर्मी आत्मा से खाली हो जाता है। इसके बाद दुष्ट आत्माओं से भरकर वह अपने हर काम में अस्थिर रहता है; दुष्ट आत्माएँ उसे इधर-उधर खींचती रहती हैं, और वह अपनी सद्बुद्धि खो बैठता है। इसी प्रकार उन सभी लोगों के साथ होता है जो झट क्रोध में आ जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγος
  choice: पात्र
  rationale: यह मनुष्य को आत्माओं के निवास-स्थान के रूप में प्रस्तुत करने वाले मूल रूपक को बनाए रखता है।
- source_word: τὸ τρυφερὸν ... πνεῦμα
  choice: वह कोमल आत्मा
  rationale: τρυφερός की कोमलता और कठोरता के साथ उसके विरोध को सीधे व्यक्त करता है।
- source_word: πραότητος καὶ ἡσυχίας
  choice: नम्रता तथा शांति
  rationale: πραΰτης के सौम्य, नम्र स्वभाव और ἡσυχία की शांत अवस्था को स्वाभाविक आधुनिक हिन्दी में अलग-अलग बनाए रखता है।
- source_word: ἀκαταστατεῖ
  choice: अस्थिर रहता है
  rationale: यह क्रिया व्यवहार और कर्मों में अव्यवस्था तथा चंचलता का भाव देती है।
- source_word: ὀξυχόλοις
  choice: जो झट क्रोध में आ जाते हैं
  rationale: मूल शब्द स्थायी क्रोधी स्वभाव से अधिक शीघ्र भड़क उठने की प्रवृत्ति बताता है।
theological_decisions:
- issue: τὸ πνεῦμα τὸ ἅγιον और बाद में τὸ πνεῦμα τοῦ δικαίου की पहचान
  choice: पहले पदबंध को “पवित्र आत्मा” और दूसरे को “धर्मी आत्मा” रखा गया है
  alternative: दोनों को स्पष्ट रूप से एक ही दैवी व्यक्तित्व बताना, अथवा दोनों जगह केवल “पवित्र आत्मा” लिखना
  rationale: मूल पाठ पहले “पवित्र आत्मा” और बाद में भिन्न पदबंध “धर्मी आत्मा” प्रयोग करता है। अनुवाद इस शब्दगत अंतर और संभावित वैचारिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: आत्मा का मनुष्य से अलग होना
  choice: पाठ के कथन को सीधे अनूदित किया गया है
  alternative: इसे केवल अनुभूति, प्रभाव या संगति के घटने के रूप में समझाकर नरम करना
  rationale: मूल में ἀποχωρεῖ और ἀποστῇ स्पष्ट रूप से अलग होने या चले जाने की भाषा है; किसी विशिष्ट सम्प्रदायगत सिद्धान्त के अनुरूप इसे पुनर्व्याख्यायित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “पात्र,” “निवास,” और “भरकर छलक जाना” जैसे मूल रूपक सुरक्षित हैं। आत्मा के लिए व्याकरणिक पुल्लिंग क्रियापद हिन्दी के प्रचलित बाइबलीय प्रयोग के अनुरूप हैं।
