base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/007.yaml
  text: Therefore keep away from quick temper—that most wicked spirit—but clothe yourself with long-suffering, and stand against quick temper and bitterness, and you will be found with the dignity that is beloved by the Lord. See to it, then, that you never neglect this command; for if you gain mastery over this command, you will also be able to keep the other commands that I am about to give you. Be strong in them and be empowered[—], and let all be empowered who wish to walk in them.”
translation:
  language: hi
  text: इसलिए जल्दी भड़कने वाले क्रोध से—जो सबसे दुष्ट आत्मा है—दूर रहो। धीरज को पहन लो, और जल्दी भड़कने वाले क्रोध तथा कड़वाहट का प्रतिरोध करो; तब तुम उस गरिमा के साथ पाए जाओगे जो प्रभु को प्रिय है। इसलिए सावधान रहो कि इस आज्ञा की कभी उपेक्षा न करो। क्योंकि यदि तुम इस आज्ञा पर अधिकार पा लोगे, तो उन बाकी आज्ञाओं का भी पालन कर सकोगे जिन्हें मैं तुम्हें देने वाला हूँ। उनमें दृढ़ रहो और सामर्थ्यवान बनाए जाओ; और वे सभी सामर्थ्यवान बनाए जाएँ जो उनके अनुसार चलना चाहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: शीघ्र क्रोध
  rationale: यह शब्द चिड़चिड़ेपन और तुरंत भड़क उठने वाले क्रोध को सूचित करता है; ‘शीघ्र क्रोध’ इस विशेषता को सामान्य ‘क्रोध’ से अलग रखते हुए सहज हिन्दी में व्यक्त करता है।
- source_word: μακροθυμία
  choice: धीरज
  rationale: यहाँ आशय उकसावे के बीच दीर्घकाल तक संयम और सहनशीलता बनाए रखने से है; ‘धीरज’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἔνδυσαι
  choice: पहन लो
  rationale: मूल के वस्त्र धारण करने वाले रूपक को सुरक्षित रखा गया है।
- source_word: σεμνότης
  choice: गरिमा
  rationale: शब्द नैतिक गंभीरता, आदरणीय आचरण और मर्यादा का भाव रखता है; ‘गरिमा’ इन अर्थों को बिना अनावश्यक सांप्रदायिक रंग के व्यक्त करता है।
- source_word: παρενθυμηθῇς
  choice: अपने मन से न उतरने दो
  rationale: दुर्लभ क्रिया का भाव आज्ञा को मन में गौण कर देने, भुला देने या उपेक्षित होने देने का है; यह अभिव्यक्ति उस मानसिक रूपक को बनाए रखती है।
- source_word: κυριεύσῃς
  choice: अधिकार पा लोगे
  rationale: मूल में आज्ञा पर प्रभुत्व या महारत पाने का भाव है, केवल उसे मान लेने का नहीं।
- source_word: πορεύεσθαι
  choice: के अनुसार चलना
  rationale: ‘चलना’ जीवन-आचरण के रूपक को बनाए रखता है; ‘उनके अनुसार’ हिन्दी में आज्ञाओं से इसका संबंध स्पष्ट करता है।
theological_decisions:
- issue: ὀξυχολία को ‘आत्मा’ कहना
  choice: ‘जो अत्यंत दुष्ट आत्मा है’ के रूप में मूल कथन बनाए रखा
  alternative: इसे केवल ‘अत्यंत बुरी प्रवृत्ति’ कहना
  rationale: ग्रन्थ क्रोध को स्पष्टतः πνεῦμα कहता है। इसे मनोवैज्ञानिक प्रवृत्ति में बदलना मूल की आत्मिक भाषा और तनाव को मिटा देता।
- issue: आज्ञा पर अधिकार पाने और अन्य आज्ञाओं के पालन का संबंध
  choice: शर्तात्मक कथन को ज्यों का त्यों रखा
  alternative: इसे केवल सामान्य प्रोत्साहन या दैवी सहायता के कथन में बदलना
  rationale: मूल इस आज्ञा में महारत और अन्य आज्ञाओं को रखने की क्षमता के बीच सीधा संबंध स्थापित करता है; अनुवाद ने इसमें कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी।
- issue: ἰσχυροῦ और ἐνδυναμοῦ की निकटार्थक जोड़ी
  choice: ‘दृढ़ बनो और सामर्थ्य पाओ’
  alternative: दोनों को मिलाकर केवल ‘बलवान बनो’ कहना
  rationale: दो अलग क्रियाओं को बनाए रखने से मूल का जोर और संभवतः सक्रिय तथा प्राप्त सामर्थ्य के बीच का सूक्ष्म अंतर सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठकों के लिए स्पष्ट किंतु गरिमापूर्ण शैली। छोटे वाक्यों और प्रचलित धार्मिक रूपकों—‘पहन लो’, ‘चलना’—का प्रयोग किया गया है। ‘शीघ्र क्रोध’ को पूरे अनुच्छेद में समान रखा गया है, और संबोधन एकवचन ‘तुम’ में है, जैसा यूनानी क्रियारूपों में है।
