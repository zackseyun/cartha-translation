base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/003.yaml
  text: 'For if, after taking a little wormwood, you pour it into a jar of honey, does not all the honey perish? So much honey is ruined by the smallest amount of wormwood: it destroys the sweetness of the honey, and it no longer has the same usefulness with its master, because it has been embittered and has lost its use. But if the wormwood is not cast into the honey, the honey is found sweet and becomes serviceable to its master.'
translation:
  language: hi
  text: यदि तुम थोड़ा-सा नागदौना लेकर उसे शहद के एक मटके में डाल दो, तो क्या सारा शहद खराब नहीं हो जाता? बहुत-सा शहद थोड़े-से नागदौने से नष्ट हो जाता है, और वह शहद की मिठास बिगाड़ देता है। तब वह अपने मालिक के यहाँ पहले जैसा मान्य नहीं रहता, क्योंकि वह कड़वा हो गया है और अपनी उपयोगिता खो चुका है। लेकिन यदि शहद में नागदौना न डाला जाए, तो शहद मीठा पाया जाता है और अपने मालिक के लिए उपयोगी होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀψίνθιον
  choice: नागदौना
  rationale: यह wormwood नामक अत्यंत कड़वी वनस्पति का मानक हिन्दी नाम है और उपमा में उसकी कड़वाहट को बनाए रखता है।
- source_word: κεράμιον
  choice: मटका
  rationale: मिट्टी के बड़े पात्र का स्वाभाविक और सामान्य हिन्दी रूप; प्रसंग में शहद रखने का पात्र है।
- source_word: ἀφανίζεται / ἀπόλλυται
  choice: खराब हो जाता / बिगाड़ देती है
  rationale: यहाँ भौतिक विनाश नहीं, थोड़ी कड़वाहट से पूरे शहद का अनुपयोगी हो जाना अभिप्रेत है।
- source_word: χάριν
  choice: प्रिय
  rationale: वाक्य में मालिक की दृष्टि में शहद की स्वीकार्यता या अनुकूलता का भाव है; इसे अगले पदबंध ‘उपयोग के योग्य’ से अलग रखा गया है।
- source_word: δεσπότῃ
  choice: मालिक
  rationale: पात्र और शहद के स्वामी के लिए सहज हिन्दी; ‘प्रभु’ कहने से इस उपमा में समय से पहले स्पष्ट धार्मिक अर्थ जुड़ सकता था।
- source_word: εὔχρηστον
  choice: काम आता है
  rationale: मालिक के लिए उपयोगी और उपयुक्त होने का अर्थ सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उपमा के ‘मालिक’ को ईश्वर या प्रभु के रूप में स्पष्ट करना
  choice: मालिक
  alternative: प्रभु
  rationale: इस वाक्य में यूनानी δεσπότης प्रत्यक्षतः शहद के स्वामी को दर्शाता है। व्यापक आध्यात्मिक अनुप्रयोग निहित है, पर उसे अनुवाद में जोड़कर उपमा की वास्तविक अस्पष्टता को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण गद्य रखा गया है। उपमा की पुनरावृत्ति और कारण-परिणाम की क्रमिकता मूल के अनुरूप संरक्षित है; दुर्लभ वनस्पति-नाम ‘नागदौना’ को प्रसंग में उसकी कड़वाहट से स्पष्ट होने दिया गया है।
