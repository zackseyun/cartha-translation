base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/004.yaml
  text: “But the others, lady, who are they?” “They are daughters of one another. And they are called Simplicity, Knowledge, Innocence, Dignity, and Love. Whenever, then, you do all the works of their mother, you are able to live.”
translation:
  language: hi
  text: '“और बाकी कौन हैं, स्वामिनी?”


    उसने कहा, “वे एक-दूसरी की बेटियाँ हैं। उनके नाम सरलता, ज्ञान, निष्कपटता, गरिमा और प्रेम हैं। तब जब तुम उनकी माता के सभी काम करोगे, तुम जी सकोगे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυρία
  choice: हे स्वामिनी
  rationale: सम्मानसूचक स्त्री-संबोधन को स्पष्ट और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: Ἁπλότης
  choice: सरलता
  rationale: यह शब्द सरल, निष्कपट और अखंड मनोभाव का संकेत दे सकता है; निकटवर्ती Ἀκακία से भेद बनाए रखने के लिए ‘सरलता’ चुना गया।
- source_word: Ἐπιστήμη
  choice: ज्ञान
  rationale: यहाँ सद्गुण के नाम के रूप में सामान्य और स्वाभाविक हिन्दी प्रतिशब्द।
- source_word: Ἀκακία
  choice: निष्कपटता
  rationale: शाब्दिक अर्थ बुराई या छल से रहित होना है; ‘निष्कपटता’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: Σεμνότης
  choice: गरिमा
  rationale: गंभीरता, आदरणीय आचरण और नैतिक मर्यादा के भाव को संक्षेप में व्यक्त करता है।
- source_word: Ἀγάπη
  choice: प्रेम
  rationale: व्यापक नैतिक और संबंधपरक प्रेम के लिए मानक हिन्दी शब्द।
- source_word: δύνασαι ζῆσαι
  choice: तुम जीवन पा सकोगे
  rationale: केवल जीवित रहने के बजाय नैतिक-उद्धारपरक जीवन के संभावित आशय को व्यक्त करता है, पर ‘अनन्त जीवन’ जोड़कर अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ‘उनकी माता’ की पहचान
  choice: स्रोत की अभिव्यक्ति ‘उनकी माता’ को यथावत रखा गया
  alternative: इसे स्पष्ट करके ‘विश्वास’ या किसी एक सद्गुण का नाम देना
  rationale: इस वाक्य में माता की सटीक पहचान स्पष्ट नहीं है और आगे सद्गुणों की वंश-श्रृंखला दी गई है; अनुवाद में अस्पष्टता को कृत्रिम रूप से नहीं सुलझाया गया।
- issue: ζῆσαι में जीवन का स्वरूप
  choice: ‘जीवन पा सकोगे’
  alternative: ‘अनन्त जीवन पाओगे’ अथवा केवल ‘जी सकोगे’
  rationale: संदर्भ उद्धारपरक जीवन की ओर संकेत करता है, पर इस वाक्य में αἰώνιος नहीं है; इसलिए निहितार्थ बचाया गया और ‘अनन्त’ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संवादात्मक किंतु गरिमापूर्ण शैली रखी गई है। सद्गुणों को व्यक्तित्व-रूप स्त्रियों के नामों के रूप में प्रस्तुत करने के लिए स्त्रीलिंग संज्ञाएँ और ‘बाकी स्त्रियाँ’ प्रयोग किया गया है।
