base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/003.yaml
  text: Hear their functions. The first of them, the one clasping her hands, is called Faith; through her the chosen of God are saved. And the second, the one girded about and acting bravely, is called Self-control; she is the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain from all evil works, believing that if he refrains from every evil desire he will inherit eternal life.”
translation:
  language: hi
  text: अब उनके कार्यों के बारे में सुनो। उनमें पहली, जो अपने हाथों को थामे हुए है, विश्वास कहलाती है; उसी के द्वारा परमेश्वर के चुने हुए लोग उद्धार पाते हैं। दूसरी, जिसने कमर कस रखी है और साहस से काम करती है, संयम कहलाती है; वह विश्वास की बेटी है। इसलिए जो कोई उसके पीछे चलता है, वह अपने जीवन में धन्य होता है, क्योंकि वह सब बुरे कामों से दूर रहेगा। वह विश्वास करता है कि यदि वह हर बुरी अभिलाषा से दूर रहे, तो अनन्त जीवन का उत्तराधिकारी होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: कार्यों
  rationale: यहाँ इन रूपकात्मक स्त्रियों की सक्रिय भूमिकाओं और प्रभावों का परिचय है; ‘कार्य’ सामान्य पाठक के लिए स्वाभाविक है और अर्थ को अनावश्यक रूप से तकनीकी नहीं बनाता।
- source_word: Πίστις
  choice: विश्वास
  rationale: यह सद्गुण के व्यक्तिकरण का प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: ἐκλεκτοὶ τοῦ Θεοῦ
  choice: परमेश्वर के चुने हुए लोग
  rationale: यह यूनानी संबंध और बहुवचन को स्पष्ट रखता है, बिना किसी विशिष्ट चुनाव-सिद्धान्त को पाठ में जोड़ने के।
- source_word: περιεζωσμένη
  choice: कमर कसे हुए
  rationale: यह वस्त्र बाँधकर तैयार होने की प्राचीन छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀνδριζομένη
  choice: साहस दिखाती है
  rationale: शाब्दिक लैंगिक मुहावरे ‘पुरुषवत्’ के बजाय प्रसंगगत गुण—साहस और दृढ़ता—को व्यक्त करता है।
- source_word: Ἐγκράτεια
  choice: संयम
  rationale: यह आत्म-नियंत्रण और बुरी इच्छाओं से विरत रहने, दोनों को समेटने वाला सामान्य हिन्दी शब्द है।
- source_word: μακάριος
  choice: धन्य
  rationale: धार्मिक-नैतिक प्रसंग में आशीषपूर्ण दशा का प्रतिष्ठित, फिर भी बोधगम्य रूप।
- source_word: ἀφέξεται / ἀφέξηται
  choice: दूर रहेगा / दूर रहे
  rationale: क्रिया का अर्थ बुरे कामों और अभिलाषाओं से अपने को अलग रखना है; यह हिन्दी में सहज और दोनों प्रयोगों में संगत है।
- source_word: κληρονομήσει ζωὴν αἰώνιον
  choice: अनन्त जीवन का उत्तराधिकारी होगा
  rationale: ‘विरासत में पाएगा’ सम्भव है, पर ‘उत्तराधिकारी होगा’ मूल की उत्तराधिकार-छवि को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: विश्वास के द्वारा चुने हुओं का उद्धार
  choice: ‘उसी के द्वारा परमेश्वर के चुने हुए लोग उद्धार पाते हैं’
  alternative: ‘विश्वास के कारण परमेश्वर के चुने हुए लोग बचाए जाते हैं’
  rationale: διὰ ταύτης के माध्यम-सूचक अर्थ और σώζονται के वर्तमान कर्मवाच्य को सुरक्षित रखा गया है; ‘चुने हुए’ को किसी बाद की सम्प्रदायगत व्याख्या से परिभाषित नहीं किया गया।
- issue: संयम, विरति और अनन्त जीवन का संबंध
  choice: शर्त और विश्वास के कथन को मूल क्रम में बनाए रखा
  alternative: इसे केवल उद्धार का प्रमाण या अनिवार्यतः उसका कारण बताना
  rationale: मूल पाठ नैतिक विरति, विश्वास और अनन्त जीवन की विरासत के बीच तनावपूर्ण संबंध रखता है; अनुवाद ने उसे किसी व्यवस्थित धर्मवैज्ञानिक ढाँचे में नहीं सुलझाया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सरल। स्त्रीलिंग व्यक्तिकरण को ‘पहली’, ‘दूसरी’, ‘वह’ और ‘बेटी’ से बनाए रखा गया है। νῦν को हिन्दी में अलग ‘अब’ न देकर आदेश ‘सुनो’ में स्वाभाविक रूप से समाहित किया गया है।
