base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/007.yaml
  text: But it was not revealed to you alone, but so that you may make them known to all. After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you—speak them all into the ears of the holy ones, so that, after hearing them and doing them, they may be cleansed from their evils, and you also with them.”
translation:
  language: hi
  text: पर यह केवल तुम पर ही प्रकट नहीं किया गया, बल्कि इसलिए कि तुम ये बातें सबको बता दो। तीन दिन बाद—क्योंकि पहले तुम्हें इन बातों को समझना आवश्यक है, और हे हरमास, मैं पहले तुम्हें उन वचनों के विषय में आज्ञा देती हूँ जिन्हें मैं तुमसे कहने वाली हूँ—ये सब बातें पवित्र जनों के कानों में कह देना, ताकि वे उन्हें सुनकर और मानकर अपनी बुराइयों से शुद्ध हो जाएँ, और तुम भी उनके साथ शुद्ध हो जाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκαλύφθη
  choice: प्रकट किया गया
  rationale: यूनानी कर्मवाच्य का रूप और प्रकाशन का भाव दोनों बनाए रखता है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों
  rationale: यहाँ बहुवचन संज्ञात्मक प्रयोग है; आधुनिक हिन्दी में समुदाय के व्यक्तियों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς τὰ ὦτα
  choice: कानों में
  rationale: मूल की सजीव और कुछ असामान्य अभिव्यक्ति को मिटाने के बजाय सुरक्षित रखा गया है।
- source_word: ποιήσαντες
  choice: उन पर चलकर
  rationale: बातों को केवल करना हिन्दी में अस्वाभाविक है; आज्ञाओं/वचनों का पालन करने का आशय सहज रूप में देता है।
- source_word: καθαρισθῶσιν
  choice: शुद्ध हो जाएँ
  rationale: यूनानी कर्मवाच्य तथा नैतिक शुद्धि के भाव को बनाए रखता है।
- source_word: πονηριῶν
  choice: बुराइयों
  rationale: बहुवचन को सुरक्षित रखते हुए नैतिक दुष्टताओं के लिए सामान्य, स्पष्ट हिन्दी चुनी गई है।
theological_decisions:
- issue: शुद्धि और आज्ञापालन का संबंध
  choice: “उन्हें सुनकर और उन पर चलकर ... शुद्ध हो जाएँ”
  alternative: “उन्हें सुनें और मानें, ताकि वे शुद्ध किए जाएँ”
  rationale: मूल पाठ सुनने और करने को शुद्ध होने से जोड़ता है; अनुवाद इस तनाव को बिना किसी व्यवस्थित धर्मशास्त्रीय व्याख्या के बनाए रखता है।
- issue: प्रकाशन का उद्देश्य
  choice: “बल्कि इसलिए कि तुम ये बातें सबको बता दो”
  alternative: “यह सबको बताने के लिए प्रकट किया गया”
  rationale: ἵνα के उद्देश्यसूचक बल और हरमास की व्यक्तिगत जिम्मेदारी को स्पष्ट रखा गया है।
- issue: स्त्री वक्ता की वाणी
  choice: “मैं ... आज्ञा देती हूँ”
  alternative: “मैं ... आज्ञा देता हूँ”
  rationale: संदर्भ में वक्ता स्त्री है (पूर्ववर्ती αὐτή और कथा की महिला आकृति), इसलिए हिन्दी में लिंगानुरूप क्रिया रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यूनानी पाठ में पद 11 का वाक्य-विन्यास कठिन और पाठ कुछ अस्थिर है; हिन्दी में अंग्रेज़ी परामर्श-पाठ के अनुरूप अर्थपूर्ण क्रम दिया गया है, पर “सब ... कानों में कह देना” जैसी मूल की ठोस अभिव्यक्ति सुरक्षित रखी गई है।
