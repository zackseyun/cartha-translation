base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/005.yaml
  text: '“I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers they have. Their powers are held together by one another, and they follow one another, just as they were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence, from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these are pure and dignified and divine. Whoever, then, serves these and proves able to hold fast to their works will have his dwelling in the tower with the holy ones of God.”'
translation:
  language: hi
  text: मैंने कहा, “हे स्वामिनी, मैं जानना चाहता था कि उनमें से हर एक का क्या सामर्थ्य है।” उसने कहा, “सुनो कि उनके क्या-क्या सामर्थ्य हैं। उनके सामर्थ्य एक-दूसरे के द्वारा थामे जाते हैं, और वे एक-दूसरे का अनुसरण करते हैं, ठीक उसी क्रम में जिसमें वे उत्पन्न हुई हैं। विश्वास से संयम उत्पन्न होता है, संयम से सरलता, सरलता से निष्कपटता, निष्कपटता से गरिमा, गरिमा से ज्ञान और ज्ञान से प्रेम। इसलिए इनके कार्य शुद्ध, गरिमामय और दिव्य हैं। अतः जो कोई इनकी सेवा करेगा और इनके कार्यों को दृढ़ता से थामे रखने में समर्थ होगा, उसे परमेश्वर के पवित्र जनों के साथ उस मीनार में निवास मिलेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυρία
  choice: हे स्वामिनी
  rationale: सम्मानसूचक स्त्री-संबोधन को बनाए रखता है और दर्शन में बोलने वाली स्त्री की भूमिका स्पष्ट करता है।
- source_word: δύναμις / δυνάμεις
  choice: सामर्थ्य / सामर्थ्य
  rationale: यहाँ गुणों की प्रभावकारी क्षमता का बोध है; ‘शक्ति’ की अपेक्षा ‘सामर्थ्य’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: Πίστις
  choice: विश्वास
  rationale: व्यक्तिरूप गुण Faith का प्रचलित और संदर्भानुकूल हिन्दी रूप।
- source_word: Ἐγκράτεια
  choice: संयम
  rationale: आत्म-नियंत्रण और बुरी अभिलाषाओं से दूर रहने के व्यापक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: Ἁπλότης
  choice: सरलता
  rationale: ἁπλότης के निष्कपट, अखंड और सीधे स्वभाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἀκακία
  choice: निष्कपटता
  rationale: शाब्दिक ‘बुराई-रहितता’ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल भोलेपन तक सीमित किए।
- source_word: Σεμνότης
  choice: गरिमा
  rationale: सम्माननीय नैतिक गंभीरता और प्रतिष्ठा का भाव देता है; ‘गंभीरता’ की तुलना में गुणनाम के रूप में अधिक सहज है।
- source_word: Ἐπιστήμη
  choice: ज्ञान
  rationale: यहाँ सद्गुणों की शृंखला में समझ-बूझ या ज्ञान का सामान्य अर्थ उपयुक्त है।
- source_word: Ἀγάπη
  choice: प्रेम
  rationale: व्यापक, सक्रिय प्रेम के लिए स्वाभाविक और धर्मवैज्ञानिक रूप से अनावश्यक संकीर्णता से मुक्त चयन।
- source_word: δουλεύσῃ
  choice: सेवा करेगा
  rationale: मूल के अधीन सेवा करने के मजबूत भाव को बनाए रखता है; इसे केवल ‘अपनाना’ बनाकर हल्का नहीं किया गया।
- source_word: κρατῆσαι τῶν ἔργων αὐτῶν
  choice: इनके कार्यों को दृढ़ता से थामे रखने
  rationale: κρατέω के पकड़ बनाए रखने और आचरण में स्थिर रहने, दोनों भावों को सुरक्षित रखता है।
- source_word: κατοίκησις
  choice: निवास
  rationale: मीनार में स्थायी रहने के स्थान या अधिकार का संक्षिप्त, स्वाभाविक रूप।
- source_word: ἅγιοι τοῦ Θεοῦ
  choice: परमेश्वर के पवित्र जन
  rationale: ‘संत’ से संभावित संस्थागत अर्थ जोड़े बिना परमेश्वर से संबंधित पवित्र लोगों को स्पष्ट करता है।
theological_decisions:
- issue: सद्गुणों का व्यक्तिरूप और उनकी उत्पत्ति की शृंखला
  choice: स्त्रीलिंग गुणनामों को बनाए रखते हुए ‘उत्पन्न होता है’ की क्रमिक भाषा रखी गई
  alternative: इसे केवल नैतिक प्रगति या तार्किक परिणाम के रूप में समझाकर अनुवाद करना
  rationale: मूल पाठ सद्गुणों को स्त्री-पात्रों और माता-पुत्री जैसी जन्म-शृंखला में प्रस्तुत करता है; अनुवाद इस रूपक को किसी व्यवस्थित उद्धार-सिद्धांत में नहीं बदलता।
- issue: मीनार में निवास पाने की शर्त
  choice: सेवा करने और उनके कार्यों को थामे रखने की मूल शर्त को स्पष्ट रखा गया
  alternative: केवल विश्वास के कारण निवास मिलने की व्याख्या जोड़ना
  rationale: पाठ का नैतिक और प्रतिफल-संबंधी तनाव ज्यों का त्यों रखा गया है; किसी संप्रदायगत समन्वय को पाठ में नहीं जोड़ा गया।
- issue: ‘दिव्य’ कार्य
  choice: θεῖα का अनुवाद ‘दिव्य’ किया गया
  alternative: ‘परमेश्वर को भाने वाले’
  rationale: मूल विशेषण कार्यों की प्रकृति के बारे में अधिक प्रत्यक्ष कथन करता है; व्याख्यात्मक नरमी से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। संवाद की प्रत्यक्षता, सद्गुणों का व्यक्तिरूप, उनकी क्रमिक उत्पत्ति और नैतिक-धर्मवैज्ञानिक तनाव सुरक्षित रखे गए हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
