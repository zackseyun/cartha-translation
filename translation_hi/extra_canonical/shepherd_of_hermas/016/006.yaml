base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/006.yaml
  text: And I kept asking her about the times—whether it is already the end. But she cried out with a loud voice, saying, “Senseless man, do you not see that the tower is still being built? Whenever, then, the tower is completed in its building, it comes to an end. But it will be built up quickly. Do not question me any further; this reminder and the renewal of your spirits are enough for you and for the holy ones.
translation:
  language: hi
  text: और मैं उससे समयों के बारे में पूछता रहा कि क्या अन्त पहले ही आ चुका है। पर उसने ऊँचे स्वर में पुकारकर कहा, “निर्बुद्धि मनुष्य! क्या तुम नहीं देखते कि मीनार अभी भी बनाई जा रही है? इसलिए जब मीनार का निर्माण पूरा हो जाएगा, तब अन्त होगा। पर उसका निर्माण शीघ्र ही पूरा हो जाएगा। अब मुझसे और कुछ मत पूछो। यह स्मरण और तुम्हारी आत्माओं का नवीनीकरण तुम्हारे लिए और पवित्र जनों के लिए पर्याप्त है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καιρῶν
  choice: समयों
  rationale: बहुवचन और अन्त-सम्बन्धी प्रसंग को बनाए रखते हुए सामान्य, बोधगम्य शब्द चुना गया; इसे किसी विशिष्ट काल-गणना में सीमित नहीं किया गया।
- source_word: συντέλεια
  choice: अन्त
  rationale: यहाँ निर्माण की पूर्णता से जुड़ा हुआ समापन अभिप्रेत है; सरल हिन्दी में ‘अन्त’ प्रसंग को स्पष्ट रखता है।
- source_word: πύργος
  choice: मीनार
  rationale: दृश्य में खड़ी की जा रही tower-संरचना के लिए आधुनिक और सहज हिन्दी पद।
- source_word: ὑπόμνησις
  choice: स्मरण
  rationale: मूल में याद दिलाने या चेताने का भाव है; ‘स्मरण’ उपदेशात्मक कठोरता बढ़ाए बिना इसे बनाए रखता है।
- source_word: ἀνακαίνωσις τῶν πνευμάτων ὑμῶν
  choice: तुम्हारी आत्माओं का नवीनीकरण
  rationale: πνευμάτων के बहुवचन और भीतर से नए किए जाने के भाव को यथासम्भव औपचारिक रूप से सुरक्षित रखा गया।
theological_decisions:
- issue: मीनार की पूर्णता और अन्त का सम्बन्ध
  choice: “जब मीनार का निर्माण पूरा हो जाएगा, तब अन्त आ जाएगा”
  alternative: “जब मीनार पूरी बन जाएगी, उसका अन्त हो जाएगा”
  rationale: प्रसंग में प्रश्न युग के अन्त के विषय में है; इसलिए τέλος को मीनार के नष्ट होने के बजाय प्रतीक्षित अन्त के आने के रूप में प्रस्तुत किया गया, जबकि निर्माण-पूर्णता से उसका सम्बन्ध कायम रखा गया।
- issue: οἱ ἅγιοι का अनुवाद
  choice: पवित्र जन
  alternative: सन्त
  rationale: ‘पवित्र जन’ मूल के सामुदायिक अर्थ को रखता है और बाद की किसी विशिष्ट संस्थागत या सम्प्रदायगत अवधारणा को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। स्त्री वक्ता के कठोर विस्मयादिबोधक सम्बोधन और अन्तकाल-सम्बन्धी तनाव को नरम नहीं किया गया। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
