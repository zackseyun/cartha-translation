  text: Looking at me, she smiled and says to me, “Do you see seven women around the tower?” “I do, lady,” I said. “This tower is supported by these women at the Lord’s command.
translation:
  language: hi
  text: उसने मेरी ओर देखकर हल्की मुस्कान के साथ मुझसे कहा, “क्या तुम मीनार के चारों ओर सात स्त्रियों को देखते हो?” मैंने कहा, “मैं देखता हूँ, स्वामिनी।” “यह मीनार प्रभु की आज्ञा के अनुसार इन स्त्रियों द्वारा थामी हुई है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασά μοι
  choice: उसने मेरी ओर देखकर
  rationale: क्रिया में ध्यानपूर्वक अथवा सीधे किसी की ओर देखने का भाव है; स्वाभाविक हिन्दी में इसे संक्षेप और स्पष्ट रूप में रखा गया है।
- source_word: ὑπεμειδίασεν
  choice: हल्की मुस्कान के साथ
  rationale: उपसर्ग सहित क्रिया मंद या हल्के ढंग से मुस्कराने का संकेत देती है, इसलिए केवल ‘मुस्कराई’ की अपेक्षा यह अधिक सटीक है।
- source_word: κυρία
  choice: स्वामिनी
  rationale: यह सम्मानपूर्ण स्त्री-संबोधन है; ‘स्वामिनी’ उस गरिमामय संबंध को व्यक्त करता है और इसे ईश्वरीय उपाधि में नहीं बदलता।
- source_word: βαστάζεται
  choice: सँभाले हुए हैं
  rationale: यहाँ मीनार को थामने या सहारा देने का अर्थ है; ‘सँभाले हुए’ दृश्य और रूपक दोनों स्तरों पर सहज है।
- source_word: κατ’ ἐπιταγὴν τοῦ Κυρίου
  choice: प्रभु की आज्ञा के अनुसार
  rationale: ἐπιταγή अधिकारपूर्ण आदेश है; ‘आज्ञा के अनुसार’ स्रोत का संबंध और बल सुरक्षित रखता है।
theological_decisions:
- issue: स्त्रियों द्वारा मीनार को धारण करने की रूपकात्मक भाषा
  choice: यही स्त्रियाँ इस मीनार को सँभाले हुए हैं
  alternative: यह मीनार इन स्त्रियों के द्वारा टिकी हुई है
  rationale: निष्क्रिय यूनानी रचना का आशय सुरक्षित रखते हुए हिन्दी में सक्रिय और स्वाभाविक वाक्य चुना गया है; स्त्रियों की रूपकात्मक भूमिका की कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: Κυρίου का संदर्भ
  choice: प्रभु
  alternative: मालिक
  rationale: प्रारम्भिक मसीही धार्मिक संदर्भ में मानक उपाधि ‘प्रभु’ उचित है, जबकि पाठ स्वयं यहाँ यह स्पष्ट नहीं करता कि संकेत पिता की ओर है या मसीह की ओर; उस अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमामय और कथात्मक शैली रखी गई है। प्रत्यक्ष कथनों की जीवंतता बनाए रखने के लिए यूनानी के ऐतिहासिक वर्तमान λέγει का अनिवार्य रूप से शब्दशः अनुकरण नहीं किया गया; हिन्दी में प्रसंगानुकूल भूतकाल प्रयोग हुआ है।
