base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/001.yaml
  text: When, then, I had stopped questioning her about all these things, she says to me, “Do you want to see something else?” And because I was eager to behold it, I became very glad to see.
translation:
  language: hi
  text: जब मैं इन सब बातों के विषय में उससे पूछना बंद कर चुका था, तब उसने मुझसे कहा, “क्या तुम कुछ और देखना चाहते हो?” और उसे देखने के लिए बहुत उत्सुक होने के कारण, मैं उसे देखने की संभावना से बहुत प्रसन्न हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαυσάμην ἐρωτῶν
  choice: पूछना बंद कर चुका
  rationale: यह पदबंध प्रश्न करने की क्रिया के समाप्त होने को व्यक्त करता है; हिंदी में स्वाभाविक और अर्थ-सटीक रूप।
- source_word: Θέλεις ἄλλο ἰδεῖν
  choice: क्या तुम कुछ और देखना चाहते हो?
  rationale: ἄλλο का संदर्भानुकूल अर्थ ‘कुछ और’ है; प्रश्न की सीधी और सहज शैली बनाए रखी गई।
- source_word: κατεπίθυμος ὢν τοῦ θεάσασθαι
  choice: उसे देखने के लिए बहुत उत्सुक था
  rationale: κατεπίθυμος तीव्र अभिलाषा दर्शाता है और θεάσασθαι ध्यानपूर्वक देखने का भाव रखता है; आधुनिक हिंदी में ‘बहुत उत्सुक’ स्वाभाविक है।
- source_word: περιχαρὴς ἐγενόμην
  choice: बहुत प्रसन्न हुआ
  rationale: περιχαρής अत्यधिक हर्ष का सूचक है; ‘बहुत प्रसन्न’ गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। स्त्री वक्ता के लिए ‘उसने’ प्रयुक्त है और मूल के कालक्रम को ‘जब… तब…’ संरचना से स्पष्ट किया गया है। अंतिम τοῦ ἰδεῖν की शाब्दिक पुनरावृत्ति हिंदी में असहज होने के कारण प्रसन्नता के कारण को ‘यह सुनकर’ से स्वाभाविक रूप दिया गया है।
