base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/003.yaml
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they repent and go back again after their evil desires.
translation:
  language: hi
  text: और जो दूसरे पत्थर पानी के पास गिरते हैं, पर लुढ़ककर पानी में नहीं जा पाते—क्या तुम जानना चाहते हो कि वे कौन हैं? ये वे हैं जिन्होंने वचन सुना है और प्रभु के नाम में बपतिस्मा लेना चाहते हैं; फिर, जब सत्य की पवित्रता उन्हें स्मरण आती है, तो वे अपना मन बदल लेते हैं और अपनी बुरी अभिलाषाओं की ओर फिर लौट जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ὑδάτων / τὸ ὕδωρ
  choice: पानी / पानी में
  rationale: दृश्य में जलराशि का सामान्य, सहज हिन्दी रूप; बहुवचन और एकवचन का अर्थगत अंतर यहाँ निर्णायक नहीं है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: आरम्भिक मसीही संदर्भ में सुने गए संदेश के लिए परिचित और गरिमापूर्ण पद।
- source_word: βαπτισθῆναι εἰς τὸ ὄνομα τοῦ Κυρίου
  choice: प्रभु के नाम में बपतिस्मा लेना
  rationale: εἰς की मूल संरचना को यथासंभव बनाए रखते हुए प्रचलित मसीही हिन्दी प्रयोग अपनाया गया है।
- source_word: ἡ ἁγνότης τῆς ἀληθείας
  choice: सत्य की पवित्रता
  rationale: ἁγνότης के नैतिक शुद्धता/पवित्रता भाव को बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: μετανοοῦσιν
  choice: अपना मन बदल लेते हैं
  rationale: संदर्भ में यह सामान्य धार्मिक ‘पश्चाताप’ नहीं, बल्कि सत्य की कठोर माँग देखकर निर्णय से पीछे हटना है; अगले वाक्यांश से यही नकारात्मक दिशा स्पष्ट होती है।
- source_word: τῶν ἐπιθυμιῶν αὐτῶν τῶν πονηρῶν
  choice: अपनी बुरी अभिलाषाओं
  rationale: इच्छाओं की नैतिक नकारात्मकता को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: μετανοοῦσιν का असामान्य, नकारात्मक संदर्भ
  choice: अपना मन बदल लेते हैं
  alternative: पश्चाताप करते हैं
  rationale: ‘पश्चाताप करते हैं’ हिन्दी पाठक को परमेश्वर की ओर लौटने का सकारात्मक अर्थ दे सकता है, जबकि यहाँ पात्र बपतिस्मे से पीछे हटकर बुरी अभिलाषाओं की ओर लौटते हैं। तटस्थ ‘मन बदलना’ मूल तनाव को सुरक्षित रखता है।
- issue: बपतिस्मा और उद्धार के संबंध की व्याख्या
  choice: केवल बपतिस्मा लेने की इच्छा और उससे पीछे हटने का वर्णन
  alternative: इसे उद्धार खोने या दीक्षा से वंचित होने की स्पष्ट धर्मवैज्ञानिक घोषणा बनाना
  rationale: इस पद में वर्णनात्मक प्रतीक दिया गया है; इससे आगे कोई संप्रदायगत निष्कर्ष अनूदित पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। पत्थरों के लुढ़कने की दृश्यात्मक भाषा बनाए रखी गई है और धार्मिक पदावली को अनावश्यक रूप से भारी नहीं बनाया गया।
