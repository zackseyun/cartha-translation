base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/001.yaml
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places: these are those who have believed, but because of their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a better road, they go astray and suffer misery as they walk in the pathless places.'
translation:
  language: hi
  text: जिन दूसरे पत्थरों को तुमने मीनार से दूर फेंके जाते, सड़क पर गिरते और सड़क से लुढ़ककर उन जगहों में जाते देखा था जहाँ कोई मार्ग नहीं है, वे लोग हैं जिन्होंने विश्वास तो किया है, पर मन की दुविधा के कारण अपना सच्चा मार्ग छोड़ देते हैं। इसलिए, यह सोचते हुए कि वे उससे बेहतर मार्ग पा सकते हैं, वे भटक जाते हैं और जहाँ कोई मार्ग नहीं है वहाँ चलते हुए कष्ट उठाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχίας
  choice: दुविधाग्रस्त मन
  rationale: शाब्दिक अर्थ ‘दो मन वाला होना’ है; यह चयन आंतरिक अनिर्णय और अस्थिर निष्ठा दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνοδίας
  choice: दुर्गम जगहों
  rationale: यह शब्द ऐसे स्थानों का संकेत देता है जहाँ कोई सुगम या बना हुआ मार्ग नहीं है; पत्थरों के लुढ़कने और लोगों के चलने—दोनों चित्रों के लिए ‘दुर्गम जगहें’ उपयुक्त है।
- source_word: πεπιστευκότες
  choice: जिन्होंने विश्वास तो किया है
  rationale: ग्रीक पूर्णकाल पूर्व में आए विश्वास और उसकी वर्तमान प्रासंगिकता को सूचित करता है; ‘तो’ आगे आने वाले विरोध को स्पष्ट करता है।
- source_word: ταλαιπωροῦσιν
  choice: कष्ट उठाते हैं
  rationale: भटकने के फलस्वरूप होने वाली दुर्दशा को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विश्वास कर चुके लोगों का सच्चे मार्ग से हटना
  choice: पाठ के तनाव को यथावत रखते हुए ‘जिन्होंने विश्वास तो किया है ... अपना सच्चा मार्ग छोड़ देते हैं’
  alternative: विश्वास को केवल बाहरी या अप्रामाणिक मानकर अनुवाद करना
  rationale: ग्रीक οἱ πεπιστευκότες μὲν वास्तव में उनके विश्वास करने की बात कहता है; अनुवाद में उसकी प्रकृति पर अतिरिक्त धर्मवैज्ञानिक निर्णय नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए स्पष्ट, किंतु रूपक की गंभीर और उपदेशात्मक गरिमा बनाए रखी गई है। ‘मीनार’, ‘सड़क’ और ‘मार्ग’ के भेद को स्रोत-पाठ के πύργος, ὁδός और रूपकात्मक ὁδός के अनुसार रखा गया है।
