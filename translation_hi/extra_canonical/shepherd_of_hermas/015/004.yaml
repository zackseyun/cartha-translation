  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/004.yaml
  text: So she finished the explanation of the tower. But, becoming bold again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is repentance for them and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit into this tower.
translation:
  language: hi
  text: इस प्रकार उसने मीनार की व्याख्या पूरी की। फिर हिम्मत करके मैंने उससे पूछा, “ये सभी पत्थर जो फेंक दिए गए हैं और मीनार के निर्माण में जुड़ने योग्य नहीं हैं—क्या उनके लिए पश्चाताप की संभावना है, और क्या इस मीनार में उनके लिए कोई स्थान है?” उसने कहा, “उनके लिए पश्चाताप की संभावना है, पर वे इस मीनार में जुड़ नहीं सकते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέλεσεν
  choice: पूरी की
  rationale: व्याख्या को समाप्त करने के अर्थ को सहज और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ἀναιδευσάμενος
  choice: साहस करके
  rationale: यहाँ शब्द निर्भीक होकर फिर पूछने का भाव देता है; ‘धृष्ट होकर’ अनावश्यक रूप से नकारात्मक और अप्राकृतिक लगता।
- source_word: ἀποβεβλημένοι
  choice: फेंक दिए गए थे
  rationale: पत्थरों के रूपक तथा यूनानी पूर्ण कृदंत के परिणामकारी भाव को बनाए रखता है।
- source_word: ἁρμόζοντες / ἁρμόσαι
  choice: ठीक बैठते थे / ठीक नहीं बैठ सकते
  rationale: निर्माण में पत्थरों के उपयुक्त ढंग से जुड़ने या बैठने की ठोस छवि को सुरक्षित रखता है।
- source_word: μετάνοια
  choice: पश्चाताप का अवसर
  rationale: संदर्भ में प्रश्न केवल मनोभाव का नहीं, पश्चाताप की उपलब्ध संभावना का है; आगे ‘उनके लिए’ के साथ यह हिंदी में स्वाभाविक है।
- source_word: τόπον
  choice: स्थान
  rationale: मीनार के रूपक में वास्तविक जगह और समुदाय में स्थान—दोनों अर्थों की गुंजाइश रखता है।
theological_decisions:
- issue: त्यागे गए पत्थरों के लिए पश्चाताप की संभावना
  choice: ‘उनके लिए पश्चाताप का अवसर है’
  alternative: ‘वे पश्चाताप कर सकते हैं’
  rationale: मूल का ἔστιν αὐτοῖς μετάνοια वाक्य पश्चाताप की उपलब्धता बताता है; इसे व्यक्ति की क्षमता मात्र में सीमित नहीं किया गया।
- issue: इस मीनार में पुनः सम्मिलित होने की सीमा
  choice: ‘पर वे इस मीनार में ठीक नहीं बैठ सकते’
  alternative: ‘पर उन्हें इस मीनार में स्थान नहीं मिल सकता’
  rationale: मूल ἁρμόσαι भवन-रूपक के भीतर फिट होने की भाषा रखता है; अनुवाद उस तनाव को बिना अतिरिक्त धर्मशास्त्रीय व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मीनार और पत्थरों की निर्माण-संबंधी रूपक-भाषा को बनाए रखा गया है। प्रत्यक्ष कथन में वक्ता-परिवर्तन स्पष्ट करने के लिए हिंदी विराम-चिह्न प्रयुक्त हैं।
