  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/005.yaml
  text: Rather, they will fit in another place, much smaller; and this will be when they have been tormented and have completed the days of their sins. And for this reason they will be transferred, because they have shared in the word of the righteous one. And then it will happen that they are transferred from their torments, if the evil deeds they have done come up into their heart. But if they do not come up into their heart, they are not saved because of their hardness of heart.”
translation:
  language: hi
  text: बल्कि वे एक दूसरे स्थान में, जो बहुत छोटा होगा, लगाए जा सकेंगे; और ऐसा तब होगा जब वे यातना सहेंगे और अपने पापों के दिन पूरे करेंगे। और इसी कारण उनका स्थान बदला जाएगा, क्योंकि उन्होंने धर्मी के वचन में भाग लिया है। तब ऐसा होगा कि वे अपनी यातनाओं से स्थानांतरित किए जाएँगे, यदि उनके किए हुए बुरे काम उनके मन में उठें। पर यदि वे उनके मन में न उठें, तो वे अपनी कठोरहृदयता के कारण उद्धार नहीं पाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁρμόσουσιν
  choice: जुड़ सकेंगे
  rationale: पत्थरों और मीनार के विस्तृत रूपक को बनाए रखते हुए ‘ठीक बैठना/जुड़ना’ का भाव व्यक्त करता है।
- source_word: βασανισθῶσιν
  choice: यातना सह चुकेंगे
  rationale: यहाँ दंडात्मक पीड़ा का संदर्भ है; ‘परखे जाएँगे’ संभव अर्थ है, पर निकटवर्ती βασάνων के कारण ‘यातना’ अधिक संगत है।
- source_word: ἐκπληρώσωσιν τὰς ἡμέρας τῶν ἁμαρτιῶν αὐτῶν
  choice: अपने पापों के दिन पूरे कर लेंगे
  rationale: स्रोत की असामान्य किंतु अर्थपूर्ण अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: μετατεθήσονται
  choice: उनका स्थान ... बदला जाएगा
  rationale: पत्थरों के रूपक में एक स्थान से दूसरे स्थान पर रखे जाने का अर्थ स्वाभाविक हिंदी में देता है।
- source_word: ἀναβῇ ἐπὶ τὴν καρδίαν
  choice: उनके मन में आएँगे
  rationale: यूनानी मुहावरे का स्वाभाविक हिंदी समतुल्य; आशय अपने बुरे कर्मों को स्मरण कर आत्मबोध होने का है।
- source_word: σκληροκαρδίαν
  choice: मन की कठोरता
  rationale: ‘कठोरहृदयता’ की अपेक्षा सामान्य पाठक के लिए सहज है और मूल रूपक को बनाए रखता है।
theological_decisions:
- issue: τοῦ ῥήματος τοῦ δικαίου की व्याख्या
  choice: धर्मी के वचन
  alternative: धार्मिकता के वचन
  rationale: पुल्लिंग संबंधकारक τοῦ δικαίου का सबसे सीधा पाठ ‘धर्मी जन के’ है, किंतु अमूर्त अर्थ भी संभव है; इसलिए विकल्प को पाद-टिप्पणी में रखा गया है।
- issue: यातनाओं के बाद स्थानांतरण और उद्धार की शर्त
  choice: पाठ के क्रम और शर्तात्मक भाषा को यथावत रखा गया
  alternative: इसे किसी व्यवस्थित परलोक-सिद्धांत के अनुसार स्पष्ट करना
  rationale: रचना की अपनी धार्मिक तनावपूर्ण भाषा को किसी बाद की संप्रदायगत व्याख्या से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य-पाठक-सुलभ हिंदी अपनाई गई है। मीनार में पत्थरों के जुड़ने और दूसरे स्थान पर रखे जाने का रूपक सुरक्षित रखा गया है; दंड, पश्चात्ताप और उद्धार संबंधी कथन को बिना सांप्रदायिक विस्तार के प्रस्तुत किया गया है।
