base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/002.yaml
  text: But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to repent because of the desires of their lewdness and the evils they have done.
translation:
  language: hi
  text: पर जो आग में गिरकर जल रहे हैं, वे वे लोग हैं जो जीवित परमेश्वर से पूरी तरह दूर हो गए हैं। उनकी उच्छृंखल लालसाओं और उनके किए हुए बुरे कामों के कारण उनके मन में पश्चाताप करने का विचार अब नहीं उठता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τέλος ἀποστάντες
  choice: पूरी तरह दूर हो गए हैं
  rationale: εἰς τέλος पूर्णता या अंतिम सीमा का भाव देता है और ἀφίστημι संबंध-विच्छेद या विमुख हो जाने को दर्शाता है; यह अनुवाद उस तीव्रता को स्वाभाविक हिन्दी में रखता है।
- source_word: τοῦ Θεοῦ τοῦ ζῶντος
  choice: जीवित परमेश्वर
  rationale: यूनानी पदबंध का सीधा और पारंपरिक अर्थ सुरक्षित रखा गया है।
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν
  choice: उनके मन में ... विचार तक नहीं उठा
  rationale: शाब्दिक मुहावरा ‘हृदय पर चढ़ा’ हिन्दी में अस्वाभाविक है; यहाँ किसी बात का मन में उत्पन्न होना अभिप्रेत है। ‘तक’ οὐκέτι की निर्णायक तीव्रता व्यक्त करता है।
- source_word: μετανοῆσαι
  choice: पश्चाताप करने
  rationale: यहाँ मन और मार्ग बदलने का धार्मिक-नैतिक भाव है; आधुनिक हिन्दी में ‘पश्चाताप’ सर्वाधिक स्पष्ट और प्रतिष्ठित विकल्प है।
- source_word: τὰς ἐπιθυμίας τῆς ἀσελγείας αὐτῶν
  choice: उनकी व्यभिचारी लालसाओं
  rationale: ἀσέλγεια निर्लज्ज, अनैतिक और प्रायः यौन उच्छृंखलता को सूचित करता है। ‘व्यभिचारी लालसाएँ’ संदर्भ की नैतिक तीव्रता रखती हैं, यद्यपि शब्द का दायरा केवल यौन पाप तक सीमित नहीं है।
- source_word: τῶν πονηριῶν ὧν εἰργάσαντο
  choice: उनके किए हुए बुरे कामों
  rationale: यूनानी बहुवचन अमूर्त ‘बुराइयों’ अथवा किए गए दुष्कर्मों का संकेत देता है; स्वाभाविक हिन्दी में कर्तृत्व स्पष्ट किया गया है।
theological_decisions:
- issue: क्या ‘εἰς τέλος ἀποστάντες’ अंतिम और अपरिवर्तनीय धर्मत्याग की व्यवस्थित धर्मवैज्ञानिक संज्ञा है?
  choice: ‘पूरी तरह दूर हो गए हैं’
  alternative: ‘अंत तक धर्मत्याग कर चुके हैं’
  rationale: मूल की गंभीरता रखी गई है, पर बाद के व्यवस्थित धर्मवैज्ञानिक निष्कर्ष या पारिभाषिक ‘धर्मत्याग’ अनावश्यक रूप से आरोपित नहीं किया गया।
- issue: पश्चाताप न करने और लालसाओं/बुराइयों का संबंध
  choice: ‘के कारण’ द्वारा कारणात्मक संबंध
  alternative: ‘उनकी ... लालसाओं और ... बुराइयों के विषय में’
  rationale: διά + accusative सामान्यतः कारण व्यक्त करता है। वाक्य यह कहता है कि इनकी वजह से पश्चाताप का विचार नहीं उठा; यह नहीं कहता कि पश्चाताप की संभावना पर कोई सार्वभौमिक सिद्धांत स्थापित हो रहा है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। पत्थरों के रूपक के कारण बहुवचन ‘वे लोग’ स्पष्टता देता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
