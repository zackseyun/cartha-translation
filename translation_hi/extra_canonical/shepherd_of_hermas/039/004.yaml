  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/004.yaml
  text: Cleanse yourself, then, from this evil sorrow, and you will live to God; and all will live to God, as many as cast off sorrow from themselves and clothe themselves with all cheerfulness.
translation:
  language: hi
  text: इसलिए अपने आप को इस बुरी उदासी से शुद्ध करो, और तुम परमेश्वर के लिए जीवित रहोगे। और जितने लोग उदासी को अपने से उतार फेंकेंगे और सारी प्रसन्नता धारण कर लेंगे, वे सब परमेश्वर के लिए जीवित रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπη
  choice: उदासी
  rationale: संदर्भ में यह मन पर छाई ऐसी दुःखपूर्ण अवस्था है जो प्रार्थना और पवित्र आत्मा के साथ संबंध में बाधा डालती है; ‘उदासी’ आधुनिक हिन्दी में इसे सहजता से व्यक्त करती है।
- source_word: πονηρᾶς
  choice: बुरी
  rationale: यहाँ विशेषण λύπη का नैतिक रूप से नकारात्मक चरित्र बताता है; सरल और सीधा समतुल्य ‘बुरी’ है।
- source_word: ζήσῃ τῷ θεῷ
  choice: परमेश्वर के लिए जीवित रहोगे
  rationale: यूनानी के दत्तिव τῷ θεῷ की संक्षिप्तता और संभावित संबंधपरक अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἀποβάλωσιν ἀφ᾿ ἑαυτῶν
  choice: अपने भीतर से ... उतार फेंकेंगे
  rationale: ἀποβάλλω के दृढ़ त्याग और वस्त्र-संबंधी अगले रूपक के साथ स्वाभाविक हिन्दी सामंजस्य को व्यक्त करता है।
- source_word: ἐνδύσωνται πᾶσαν ἱλαρότητα
  choice: पूरी प्रसन्नता को पहन लेंगे
  rationale: ἐνδύω के वस्त्र पहनने वाले मूल रूपक को सुरक्षित रखते हुए ἱλαρότης को प्रसन्न मनोदशा के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ζῆν τῷ θεῷ का अर्थ
  choice: परमेश्वर के लिए जीवित रहना
  alternative: परमेश्वर में जीवित रहना
  rationale: मूल पाठ का दत्तिव ‘के लिए’ अथवा संबंधपरक अर्थ दे सकता है। ‘के लिए’ औपचारिक निकटता रखता है और ‘में’ कहकर रहस्यात्मक एकता का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- issue: उदासी त्यागने और जीवन पाने का संबंध
  choice: मूल पाठ की सीधी शर्तात्मक घोषणा बनाए रखी गई
  alternative: इसे केवल भावनात्मक सलाह या उद्धार-सिद्धांत की व्यवस्थित व्याख्या के रूप में प्रस्तुत करना
  rationale: पाठ जैसा नैतिक-आध्यात्मिक तनाव रखता है, उसे किसी संप्रदायगत उद्धार-व्याख्या से नरम या विस्तृत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और उपदेशात्मक शैली। ‘उतार फेंकना’ और ‘पहन लेना’ से मूल वस्त्र-रूपक सुरक्षित रखा गया है।
