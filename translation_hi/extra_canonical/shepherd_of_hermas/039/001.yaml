base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/001.yaml
  text: Clothe yourself, then, with cheerfulness, which always has favor with God and is acceptable to him, and delight in it. For every cheerful man does good, thinks good things, and despises sorrow.
translation:
  language: hi
  text: इसलिए प्रसन्नता को धारण करो, जो सदा परमेश्वर के यहाँ अनुग्रह पाती है और उसे स्वीकार्य है; और उसी में आनंदित रहो। क्योंकि हर प्रसन्न मनुष्य भले काम करता है, भली बातें सोचता है और उदासी को तुच्छ समझता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔνδυσαι
  choice: वस्त्र के समान पहन लो
  rationale: मूल के वस्त्र धारण करने वाले रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἱλαρότητα / ἱλαρός
  choice: प्रसन्नता / प्रसन्न
  rationale: यहाँ शब्द आनंदपूर्ण और उल्लसित मनोभाव को व्यक्त करता है; ‘प्रसन्नता’ आधुनिक हिन्दी में सहज है और आगे के ‘उदासी’ के साथ स्वाभाविक विरोध बनाता है।
- source_word: χάριν παρὰ τῷ θεῷ
  choice: उस पर परमेश्वर की कृपा ... बनी रहती है
  rationale: παρά के संबंधपरक भाव और χάρις के अनुग्रह/कृपा अर्थ को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: εὐπρόσδεκτον
  choice: उसे स्वीकार्य
  rationale: परमेश्वर द्वारा अनुकूल रूप से स्वीकार किए जाने का भाव सीधे व्यक्त करता है।
- source_word: ἐντρύφα ἐν αὐτῇ
  choice: उसी में आनंदित रहो
  rationale: क्रिया के ‘आनंद लेना/मग्न रहना’ अर्थ को वर्तमान हिन्दी में गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἀγαθὰ φρονεῖ
  choice: भली बातें सोचता है
  rationale: मूल के व्यापक मानसिक अभिमुखीकरण को किसी विशेष धार्मिक व्याख्या तक सीमित किए बिना व्यक्त करता है।
- source_word: καταφρονεῖ τῆς λύπης
  choice: उदासी को तुच्छ समझता है
  rationale: καταφρονέω के प्रबल ‘तुच्छ जानना’ भाव को बनाए रखता है; इसे केवल ‘दूर रहता है’ कहना मूल की तीव्रता घटाता।
theological_decisions:
- issue: χάριν का अर्थ
  choice: परमेश्वर की कृपा
  alternative: परमेश्वर की प्रसन्न स्वीकृति / अनुग्रह
  rationale: ‘कृपा’ मूल शब्द का स्थापित और व्यापक हिन्दी समतुल्य है; वाक्य का अगला पद ‘स्वीकार्य’ स्वीकृति का पक्ष अलग से व्यक्त करता है।
- issue: λύπη की प्रकृति
  choice: उदासी
  alternative: शोक / दुःख
  rationale: इस आदेश के व्यापक संदर्भ में λύπη एक भीतर बसी निराश उदासी को सूचित करती है; ‘उदासी’ इसे सहज रूप से व्यक्त करती है, जबकि ‘शोक’ वैध शोक-विलाप की अधिक संकीर्ण धारणा दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और उपदेशात्मक शैली। वस्त्र धारण करने का मूल रूपक सुरक्षित रखा गया है। ‘मनुष्य’ मूल ἀνήρ का यहाँ सामान्य मानवीय संदर्भ में समावेशी और औपचारिक अनुवाद है।
