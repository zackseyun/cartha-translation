base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/002.yaml
  text: 'But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy Spirit that was given to the human being as cheerful; second, by grieving the Holy Spirit he works lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has power to ascend to the altar of God.'
translation:
  language: hi
  text: परन्तु दुःखी व्यक्ति सदा बुराई करता है। पहले, वह इसलिए बुराई करता है कि वह उस पवित्र आत्मा को दुःखी करता है, जो मनुष्य को हर्षित रूप में दी गई थी; दूसरे, पवित्र आत्मा को दुःखी करके वह अधर्म करता है, क्योंकि वह न तो प्रभु से प्रार्थना करता है और न उसके सामने स्वीकार करता है। क्योंकि दुःखी व्यक्ति की प्रार्थना में कभी परमेश्वर की वेदी पर चढ़ने की सामर्थ्य नहीं होती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπηρὸς
  choice: उदास
  rationale: यहाँ शब्द उस व्यक्ति की स्थायी शोकाकुल या उदास अवस्था बताता है; ‘उदास’ आधुनिक हिन्दी में स्वाभाविक है और प्रसन्नता के विपरीत भाव को बनाए रखता है।
- source_word: πονηρεύεται
  choice: बुराई करता है
  rationale: क्रिया नैतिक रूप से बुरा आचरण करने का संकेत देती है; सरल और स्पष्ट हिन्दी चुनी गई है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: प्रचलित और स्रोत के प्रति औपचारिक रूप से संगत धार्मिक पद।
- source_word: ἱλαρόν
  choice: प्रसन्न स्वभाव का
  rationale: नपुंसकलिंग विशेषण का संबंध ‘आत्मा’ से है और वह प्रसन्न/हर्षित गुण बताता है; इस अनपेक्षित कथन को मिटाए बिना स्वाभाविक हिन्दी दी गई है।
- source_word: ἀνομίαν ἐργάζεται
  choice: अधर्म करता है
  rationale: ἀνομία व्यवस्था-विरुद्धता या अधर्म है; संक्षिप्त पारंपरिक पद स्रोत का नैतिक-धार्मिक भार रखता है।
- source_word: ἐντυγχάνων / ἔντευξις
  choice: विनती करता है / विनती
  rationale: इस प्रसंग में शब्द परमेश्वर से की गई याचना या प्रार्थना को दर्शाता है; ‘विनती’ उसकी निवेदनात्मक प्रकृति बनाए रखती है।
- source_word: ἐξομολογούμενος
  choice: अपने पाप मानता है
  rationale: क्रिया स्वीकारोक्ति करने का अर्थ रखती है; प्रसंग में प्रभु के सामने पाप-स्वीकार का भाव स्पष्ट करना स्वाभाविक है, यद्यपि यूनानी में ‘पाप’ प्रत्यक्ष संज्ञा के रूप में नहीं है।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: बलिदान-वेदी के धार्मिक बिंब के लिए मानक हिन्दी शब्द।
theological_decisions:
- issue: पवित्र आत्मा को ‘प्रसन्न’ दिए जाने का संबंध
  choice: ‘जो मनुष्य को प्रसन्न स्वभाव का दिया गया था’
  alternative: ‘जो मनुष्य को प्रसन्नता से दिया गया था’
  rationale: यूनानी ἱλαρόν व्याकरणतः दिए गए पवित्र आत्मा का गुण अधिक स्वाभाविक रूप से बताता है, देने की रीति नहीं; अतः स्रोत की असामान्य धार्मिक अभिव्यक्ति सुरक्षित रखी गई।
- issue: ἐξομολογούμενος का आशय
  choice: प्रभु के सामने अपने पाप मानना
  alternative: प्रभु की स्तुति/धन्यवाद करना
  rationale: क्रिया दोनों प्रकार के स्वीकार की ओर जा सकती है, पर ‘अधर्म’ और प्रार्थना के निकट प्रसंग में पाप-स्वीकार अधिक संभावित है; वाक्य को किसी संस्कारगत सिद्धांत से नहीं जोड़ा गया।
- issue: उदासी और प्रार्थना की सामर्थ्य
  choice: लेखक के निरपेक्ष कथन को यथावत रखा गया
  alternative: इसे केवल रूपक या सामान्य प्रवृत्ति के रूप में नरम करना
  rationale: ‘कभी’ और ‘सामर्थ्य नहीं’ स्रोत के πάντοτε ... οὐκ ἔχει δύναμιν का तीखा दावा बनाए रखते हैं; अनुवाद इसे धर्मशास्त्रीय रूप से नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सामान्य पाठक के लिए सुबोध। वाक्य-संरचना मूल के ‘पहली बात… दूसरी बात…’ तर्कक्रम को बनाए रखती है। किसी फुटनोट की आवश्यकता नहीं समझी गई।
