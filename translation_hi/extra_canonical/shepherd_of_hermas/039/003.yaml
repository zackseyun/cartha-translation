base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/003.yaml
  text: “Why,” I ask, “does the prayer of the one who is sorrowing not ascend to the altar?” “Because,” he says, “sorrow has settled in his heart. Therefore sorrow, mixed with the prayer, does not allow the prayer to ascend pure to the altar. For just as vinegar and wine, mixed together, do not have the same pleasantness, so also sorrow, mixed with the Holy Spirit, does not have the same prayer.”
translation:
  language: hi
  text: “क्यों,” मैंने पूछा, “दुःखी मनुष्य की प्रार्थना वेदी पर नहीं चढ़ती?” उसने कहा, “क्योंकि दुःख उसके हृदय में बैठा हुआ है। इसलिए, प्रार्थना के साथ मिला हुआ दुःख प्रार्थना को शुद्ध रूप में वेदी पर चढ़ने नहीं देता। क्योंकि जैसे सिरका और दाखमधु को एक साथ मिलाने पर वही सुखदता नहीं रहती, वैसे ही पवित्र आत्मा के साथ मिला हुआ दुःख होने पर प्रार्थना वैसी नहीं होती।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔντευξις
  choice: प्रार्थना
  rationale: इस प्रसंग में परमेश्वर की ओर उठने वाली विनती अभिप्रेत है; ‘प्रार्थना’ आधुनिक हिन्दी में स्वाभाविक और व्यापक रूप से समझ में आने वाला शब्द है।
- source_word: λύπη / λυπουμένου
  choice: दुःख / दुःखी मनुष्य
  rationale: मूल शब्द हृदय में जमे शोक या विषाद को व्यक्त करता है। ‘दुःख’ मूल की व्यापकता बनाए रखता है और इसे केवल निराशा या बाहरी कष्ट तक सीमित नहीं करता।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: बलिदान और उपासना से संबद्ध वेदी का धार्मिक बिंब सुरक्षित रहता है।
- source_word: ὄξος καὶ οἶνος
  choice: सिरका और दाखमधु
  rationale: दो अलग द्रवों का मूल रूपक स्पष्ट रखा गया है; ‘दाखमधु’ οἶνος के अंगूरी मद्य के अर्थ को सहज धार्मिक हिन्दी में व्यक्त करता है।
- source_word: ἡδονή
  choice: सुखद स्वाद
  rationale: पेयों के रूपक में सामान्य ‘आनंद’ की अपेक्षा स्वाद-संबंधी भाव अधिक स्वाभाविक है, जबकि सुखदता का तत्व भी बना रहता है।
theological_decisions:
- issue: दुःख का पवित्र आत्मा के साथ ‘मिलना’
  choice: “पवित्र आत्मा के साथ मिला हुआ दुःख”
  alternative: “पवित्र आत्मा से युक्त व्यक्ति में मिला हुआ दुःख”
  rationale: मूल वाक्य सीधे दुःख को पवित्र आत्मा के साथ मिला हुआ कहता है। संभावित धर्मवैज्ञानिक कठिनाई को व्याख्या जोड़कर हल नहीं किया गया।
- issue: τὴν αὐτὴν ἔντευξιν οὐκ ἔχει का असामान्य कथन
  choice: “वैसी प्रार्थना नहीं करता”
  alternative: “उसकी प्रार्थना वैसी नहीं रहती”
  rationale: मूल में दुःख व्याकरणिक कर्ता है और कथन जानबूझकर संक्षिप्त तथा कुछ असामान्य है। हिन्दी में अर्थगम्यता रखते हुए उस तनाव को पूरी तरह समतल नहीं किया गया।
- issue: प्रार्थना का वेदी तक चढ़ना
  choice: रूपक को प्रत्यक्ष रूप में बनाए रखा
  alternative: “प्रार्थना परमेश्वर तक नहीं पहुँचती”
  rationale: मूल का उपासना-संबंधी वेदी-बिंब महत्वपूर्ण है; उसे सामान्यीकृत धर्मवैज्ञानिक कथन में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संवाद-रूप तथा प्रार्थना के वेदी तक चढ़ने का मूल बिंब सुरक्षित है। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
