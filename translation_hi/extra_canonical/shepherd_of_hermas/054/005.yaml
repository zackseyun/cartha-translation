  to: जब वह मुझसे ये बातें कह चुका था, तब उसने मुझसे कहा, “आओ, हम देहात चलें; मैं तुम्हें भेड़ों के चरवाहे दिखाऊँगा।” मैंने कहा, “चलिए, स्वामी।” तब हम एक मैदान में पहुँचे, और उसने मुझे एक चरवाहा दिखाया—एक जवान आदमी, जो कई प्रकार के कपड़ों से बना हुआ केसरिया रंग का वस्त्र पहने हुए था।
