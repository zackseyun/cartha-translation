base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/005.yaml
  text: And after he had spoken these things with me, he says to me, “Let us go into the country, and I will show you the shepherds of the sheep.” “Let us go, sir,” I say. And we came to a certain plain, and he shows me a shepherd, a young man, clothed in a composite garment, saffron in color.
translation:
  language: hi
  text: जब वह मुझसे ये बातें कह चुका था, तब उसने मुझसे कहा, “आओ, हम देहात चलें; मैं तुम्हें भेड़ों के चरवाहे दिखाऊँगा।” मैंने कहा, “चलिए, स्वामी।” तब हम एक मैदान में पहुँचे, और उसने मुझे एक चरवाहा दिखाया—एक जवान आदमी, जो कई प्रकार के कपड़ों से बना हुआ केसरिया रंग का वस्त्र पहने हुए था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγρόν
  choice: खुले मैदान
  rationale: यहाँ शब्द नगर या घर से बाहर के देहाती खुले क्षेत्र का संकेत देता है; आगे πεδίον ‘मैदान’ आने के कारण स्वाभाविक हिंदी में ‘खुले मैदान’ चुना गया।
- source_word: ποιμένας τῶν προβάτων
  choice: भेड़ों के चरवाहे
  rationale: बहुवचन को यथावत रखा गया है, यद्यपि तुरंत बाद एक चरवाहा दिखाया जाता है।
- source_word: κύριε
  choice: प्रभु
  rationale: सम्मानपूर्ण संबोधन है; हरमास में स्वर्गदूत-सदृश मार्गदर्शक के लिए प्रयुक्त होने पर ‘प्रभु’ मूल की गरिमा और संभावित धार्मिक अर्थ दोनों बनाए रखता है।
- source_word: σύνθεσιν ἱματίων
  choice: कई प्रकार के कपड़ों से बना ... वस्त्र
  rationale: दुर्लभ पदबंध किसी मिश्रित या विभिन्न टुकड़ों से बने परिधान का बोध देता है; अस्पष्ट ‘संयुक्त वस्त्र’ की अपेक्षा यह सामान्य पाठक के लिए स्पष्ट है, बिना उसकी ठीक बनावट निर्धारित किए।
- source_word: κροκώδη
  choice: केसरिया रंग का
  rationale: κρόκος से निकला विशेषण केसर या केसर-जैसे पीले-नारंगी रंग को दर्शाता है।
- source_word: νεανίσκον
  choice: एक जवान आदमी
  rationale: युवा पुरुष के अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: κύριε संबोधन की पहचान
  choice: प्रभु
  alternative: महोदय / स्वामी
  rationale: मूल संबोधन में सम्मान तथा प्रभुत्व दोनों संभव हैं। ‘प्रभु’ इस प्राचीन धार्मिक रचना के संदर्भ में उपयुक्त है, पर इसे परमेश्वर की स्पष्ट पहचान के रूप में नहीं विस्तार दिया गया।
- issue: बहुवचन चरवाहों और एक चरवाहे का तनाव
  choice: पहले ‘चरवाहे’, फिर ‘एक चरवाहा’
  alternative: दोनों स्थानों पर एकवचन कर देना
  rationale: मूल पाठ का वास्तविक संख्या-परिवर्तन सुरक्षित रखा गया है; संभव है कि आगे कई चरवाहे दिखाए जाने हों।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण कथात्मक शैली। प्रत्यक्ष कथन वर्तमानकालीन ‘कहा/दिखाऊँगा’ के साथ स्वाभाविक बनाया गया है, जबकि मूल के ऐतिहासिक वर्तमान ‘कहता है/दिखाता है’ को हिंदी कथन-प्रवाह में भूतकाल से व्यक्त किया गया है।
