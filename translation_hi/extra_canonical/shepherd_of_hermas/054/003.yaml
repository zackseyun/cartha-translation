  text: “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.
translation:
  language: hi
  text: ये आज्ञाएँ उन लोगों के लिए लाभकारी हैं जो पश्चाताप करने वाले हैं; क्योंकि यदि वे इनके अनुसार न चलें, तो उनका पश्चाताप व्यर्थ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολαί
  choice: आज्ञाएँ
  rationale: यह शब्द दिए गए नैतिक निर्देशों या आदेशों को दर्शाता है; ‘आज्ञाएँ’ प्रसंग के अनुरूप और सामान्य पाठकों के लिए स्पष्ट है।
- source_word: σύμφοροι
  choice: लाभकारी
  rationale: मूल शब्द उपयोगी या हितकर होने का भाव रखता है; ‘लाभकारी’ इस सकारात्मक उपयोगिता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τοῖς μέλλουσι μετανοεῖν
  choice: उन लोगों के लिए जो पश्चाताप करने वाले हैं
  rationale: μέλλουσι की भावी/आसन्न क्रिया को बनाए रखता है और μετανοεῖν को धार्मिक-नैतिक मन-फिराव के प्रचलित हिंदी पद ‘पश्चाताप करना’ से व्यक्त करता है।
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: वे इन पर न चलें
  rationale: चलने के मूल रूपक को सुरक्षित रखते हुए आज्ञाओं के अनुसार जीवन बिताने का अर्थ व्यक्त करता है।
- source_word: εἰς μάτην
  choice: व्यर्थ
  rationale: निष्फल या बेकार होने के अर्थ का संक्षिप्त और गरिमापूर्ण हिंदी रूप।
theological_decisions:
- issue: पश्चाताप और आज्ञापालन का संबंध
  choice: 'शर्तात्मक कथन को यथावत रखा गया है: आज्ञाओं पर न चलने पर पश्चाताप व्यर्थ है।'
  alternative: इसे केवल ‘पश्चाताप की सच्चाई का प्रमाण आज्ञापालन है’ कहकर व्याख्यात्मक रूप देना।
  rationale: मूल पाठ सीधे और तनावपूर्ण ढंग से पश्चाताप की सार्थकता को आज्ञाओं पर चलने से जोड़ता है; अनुवाद ने इसे किसी विशिष्ट धर्मवैज्ञानिक प्रणाली में ढाले बिना सुरक्षित रखा है।
- issue: μέλλουσι का कालगत भाव
  choice: ‘पश्चाताप करने वाले हैं’
  alternative: ‘पश्चाताप करते हैं’ या ‘पश्चाताप करना चाहते हैं’
  rationale: चुना गया रूप भावी/आसन्न आशय को बनाए रखता है, जबकि इच्छा का अर्थ अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। ‘इन पर चलें’ द्वारा यूनानी जीवन-मार्ग के रूपक को बनाए रखा गया है।
