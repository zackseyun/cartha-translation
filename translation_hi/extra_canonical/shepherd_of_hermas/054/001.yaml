base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/001.yaml
  text: 'While I was sitting in my house and glorifying the Lord for all the things I had seen, and pondering the commandments—that they are good and powerful and gladdening and glorious and able to save a person’s soul—I said within myself: “Blessed shall I be if I walk in these commandments, and whoever walks in them will be blessed.”'
translation:
  language: hi
  text: जब मैं अपने घर में बैठा हुआ उन सब बातों के लिए प्रभु की महिमा कर रहा था जिन्हें मैंने देखा था, और आज्ञाओं के विषय में विचार कर रहा था कि वे भली, सामर्थ्यशाली, आनंददायक और महिमामय हैं तथा मनुष्य की आत्मा को बचाने में समर्थ हैं, तब मैंने अपने मन में कहा, “यदि मैं इन आज्ञाओं के अनुसार चलूँगा, तो धन्य होऊँगा; और जो कोई इनके अनुसार चलता है, वह धन्य होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: महिमा कर रहा था
  rationale: क्रिया के धार्मिक अर्थ और निरंतर चल रही क्रिया—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: συζητῶν
  choice: मनन कर रहा था
  rationale: यहाँ प्रसंग आंतरिक विचार-विमर्श का है; ‘मनन’ वर्तमान हिन्दी में उसी भाव को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: καλαὶ καὶ δυναταὶ καὶ ἱλαραὶ καὶ ἔνδοξοι
  choice: भली, सामर्थ्यशाली, आनंददायक और महिमामय
  rationale: चारों विशेषणों की अलग-अलग अर्थ-छटाएँ और मूल की क्रमबद्ध प्रशंसा सुरक्षित रखी गई हैं।
- source_word: ψυχὴν ἀνθρώπου
  choice: मनुष्य के प्राण
  rationale: ‘प्राण’ ψυχή के जीवन/आत्म-सत्ता संबंधी व्यापक अर्थ को बनाए रखता है और इसे केवल आधुनिक मनोवैज्ञानिक ‘मन’ तक सीमित नहीं करता।
- source_word: ταῖς ἐντολαῖς ταύταις πορευθῶ
  choice: इन आज्ञाओं पर चलूँगा
  rationale: चलने के मूल रूपक को बनाए रखते हुए आज्ञाओं के अनुसार जीवन बिताने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: Μακάριος
  choice: धन्य
  rationale: धार्मिक-साहित्यिक संदर्भ में ईश्वरीय अनुग्रह और शुभ अवस्था दोनों को व्यक्त करने वाला प्रचलित शब्द है।
theological_decisions:
- issue: आज्ञाओं और उद्धार के बीच संबंध
  choice: ‘मनुष्य के प्राण को बचा सकती हैं’ के रूप में मूल कथन को सीधे रखा गया
  alternative: इसे केवल नैतिक लाभ या उद्धार के प्रमाण के रूप में व्याख्यायित करना
  rationale: δύναμεναι σῶσαι का स्पष्ट सामर्थ्य-वाचक कथन सुरक्षित रखा गया है; पाठ में निहित धर्मवैचारिक तनाव को किसी संप्रदायगत व्याख्या से हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मूल यूनानी की लंबी वाक्य-रचना और विशेषणों की श्रृंखला को यथासंभव सुरक्षित रखते हुए हिन्दी प्रवाह के लिए ‘तब’ जोड़ा गया है।
