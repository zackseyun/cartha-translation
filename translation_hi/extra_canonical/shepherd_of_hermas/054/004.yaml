base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/004.yaml
  text: “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
translation:
  language: hi
  text: इसलिए तुम जो मन फिरा रहे हो, इस युग की उन बुराइयों को उतार फेंको जो तुम्हें घिस डालती हैं। धार्मिकता के हर सद्गुण को धारण करके तुम इन आज्ञाओं का पालन कर सकोगे और अपने पापों में फिर कुछ नहीं जोड़ोगे। इसलिए यदि तुम आगे और कुछ नहीं जोड़ोगे, तो अपने पिछले पापों से दूर हो जाओगे। अतः मेरी इन आज्ञाओं पर चलो, और परमेश्वर के लिए जीवित रहोगे। ये [सब][a] बातें मैंने तुमसे कही हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-साक्ष्यों में “सब” नहीं है।
    reason: मूल संस्करण में πάντα को कोष्ठकों में रखा गया है, जो पाठांतर या अनिश्चितता का संकेत देता है।
lexical_decisions:
- source_word: μετανοοῦντες
  choice: मन फिरा रहे हो
  rationale: यह वर्तमान कृदंत है और चल रही पश्चात्तापपूर्ण दिशा-परिवर्तन की प्रक्रिया व्यक्त करता है; ‘पश्चात्ताप कर रहे हो’ भी संभव है, पर ‘मन फिराना’ नैतिक और जीवनगत परिवर्तन को अधिक स्पष्ट करता है।
- source_word: ἀποβάλλετε
  choice: उतार फेंको
  rationale: वस्त्र उतारने की छवि अगले वाक्य के ‘धारण करके’ से जुड़ती है, इसलिए केवल ‘त्याग दो’ की अपेक्षा रूपक को बनाए रखा गया है।
- source_word: τὰς πονηρίας τοῦ αἰῶνος τούτου
  choice: इस युग की उन बुराइयों
  rationale: αἰών को ‘युग’ और πονηρίαι को बहुवचन ‘बुराइयाँ’ के रूप में रखा गया है।
- source_word: τὰς ἐκτριβούσας ὑμᾶς
  choice: जो तुम्हें घिसे डालती हैं
  rationale: ἐκτρίβω में घिसने, चूर करने या नष्ट कर डालने का तीखा भाव है; इस अनोखी किंतु समझने योग्य छवि को सुरक्षित रखा गया है।
- source_word: πᾶσαν ἀρετὴν δικαιοσύνης
  choice: धार्मिकता के हर सद्गुण
  rationale: ἀρετή नैतिक उत्कृष्टता या सद्गुण है; संबंधवाचक δικαιοσύνης को ‘धार्मिकता के’ द्वारा खुला रखा गया है।
- source_word: πορεύεσθε
  choice: चलो
  rationale: आज्ञाओं के अनुसार जीवन-मार्ग पर चलने की मूल रूपकात्मक भाषा सुरक्षित रखी गई है।
- source_word: ζήσεσθε τῷ Θεῷ
  choice: परमेश्वर के लिए जीवित रहोगे
  rationale: सम्प्रदान कारक τῷ Θεῷ का स्वाभाविक अर्थ ‘परमेश्वर के लिए’ रखा गया है; इसे बिना आधार ‘परमेश्वर के साथ’ या ‘परमेश्वर में’ नहीं बनाया गया।
theological_decisions:
- issue: पिछले पापों से संबंध और पश्चात्ताप
  choice: अपने पिछले पापों से दूर हो जाओगे
  alternative: तुम्हारे पिछले पाप क्षमा हो जाएँगे
  rationale: ἀποστήσεσθε ἀπό का सीधा अर्थ दूर होना या अलग खड़ा होना है। पाठ स्पष्ट रूप से ‘क्षमा’ नहीं कहता, इसलिए पश्चात्ताप और पाप से दूरी के बीच की वास्तविक कथनात्मक अस्पष्टता को बनाए रखा गया है।
- issue: आज्ञापालन की सामर्थ्य
  choice: तुम इन आज्ञाओं का पालन कर सकोगे
  alternative: तुम अनिवार्य रूप से इन आज्ञाओं का पूर्ण पालन करोगे
  rationale: δυνήσεσθε सामर्थ्य या क्षमता व्यक्त करता है, न कि स्वतः सुनिश्चित निष्पाप सिद्धता।
- issue: ζήσεσθε τῷ Θεῷ का संबंध
  choice: परमेश्वर के लिए जीवित रहोगे
  alternative: परमेश्वर के द्वारा जीवित रहोगे
  rationale: यूनानी सम्प्रदान को उद्देश्य/समर्पण के अर्थ में पढ़ना सबसे स्वाभाविक है, जबकि कर्तृत्वसूचक अर्थ यहाँ कम प्रत्यक्ष है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘उतार फेंको/धारण करके’ की परस्पर जुड़ी वस्त्र-छवि और ‘आज्ञाओं पर चलो’ का मार्ग-रूपक सुरक्षित रखा गया है। संबोधन के लिए पूरे अंश में बहुवचन ‘तुम’ का सुसंगत प्रयोग है।
