base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/006.yaml
  text: He was pasturing very many sheep, and the sheep were as if luxuriating and being very extravagant, and they were cheerful, skipping here and there. And the shepherd himself was very cheerful over his flock; and the very appearance of the shepherd was exceedingly cheerful, and he ran around among the sheep.
translation:
  language: hi
  text: वह बहुत-सी भेड़ों को चरा रहा था। वे भेड़ें मानो सुख-विलास में डूबी हुई और बहुत ऐशो-आराम करती हुई थीं; वे प्रसन्न होकर इधर-उधर उछल-कूद रही थीं। चरवाहा भी अपने झुंड को देखकर बहुत प्रसन्न था। चरवाहे का रूप-रंग भी अत्यंत प्रसन्न था, और वह भेड़ों के बीच इधर-उधर दौड़ रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβοσκε
  choice: चरा रहा था
  rationale: यह अपूर्णकालीन क्रिया चरवाहे की जारी गतिविधि को व्यक्त करती है।
- source_word: τρυφῶντα
  choice: सुख-विलास में डूबी
  rationale: शब्द आराम, ऐश और भोगपूर्ण जीवन का संकेत देता है; संदर्भ में भेड़ों का रूपकात्मक मानवीकरण बना रहता है।
- source_word: σπαταλῶντα
  choice: अत्यंत उच्छृंखल
  rationale: यह भोग-विलास से उपजी बेलगाम या असंयमित दशा को व्यक्त करता है; केवल ‘मौज करती’ कहने से नैतिक नकारात्मकता खो जाती।
- source_word: ἱλαρὰ
  choice: प्रसन्न
  rationale: भेड़ों, चरवाहे और उसके चेहरे के लिए दोहराए गए इस विशेषण की अर्थगत एकरूपता सुरक्षित रखी गई है।
- source_word: σκιρτῶντα
  choice: उछल-कूद रही थीं
  rationale: भेड़ों की चंचल, आनंदपूर्ण शारीरिक गति के लिए स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: ἰδέα
  choice: चेहरा … दिखाई देता था
  rationale: यहाँ शब्द चरवाहे के बाहरी रूप या मुख-मुद्रा को दर्शाता है; सहज हिन्दी में ‘चेहरा’ प्रसन्नता की दृश्य अभिव्यक्ति स्पष्ट करता है।
- source_word: περιέτρεχε
  choice: इधर-उधर दौड़ रहा था
  rationale: अपूर्णकालीन क्रिया निरंतर चारों ओर दौड़ने को दर्शाती है; ‘भेड़ों के बीच’ τοῖς προβάτοις के प्रसंगगत संबंध को स्वाभाविक बनाता है।
theological_decisions:
- issue: भेड़ों के व्यवहार का नैतिक स्वर
  choice: ‘सुख-विलास में डूबी और अत्यंत उच्छृंखल’
  alternative: ‘मौज-मस्ती और ऐश कर रही थीं’
  rationale: आगे की उपमा में निहित नैतिक आलोचना के लिए τρυφάω और σπαταλάω की भोगपूर्ण तथा असंयमित छाया को बनाए रखा गया है, बिना उसकी व्याख्या को पाठ में और अधिक स्पष्ट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। मूल के ‘प्रसन्न’ शब्द की आवृत्ति जानबूझकर सुरक्षित है, क्योंकि वह भेड़ों, चरवाहे और उसके बाहरी रूप को परस्पर जोड़ती है।
