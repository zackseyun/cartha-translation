base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/002.yaml
  text: 'As I was saying these things within myself, I suddenly see him seated beside me and saying this: “Why are you double-minded about the commandments that I commanded you? They are good. Do not be double-minded at all, but clothe yourself with the faith of the Lord, and you will walk in them; for I will strengthen you in them.'
translation:
  language: hi
  text: 'जब मैं अपने मन में ये बातें कह रहा था, तभी अचानक मैंने उसे अपने पास बैठा हुआ देखा, और वह मुझसे यह कह रहा था: “जो आज्ञाएँ मैंने तुम्हें दी हैं, उनके विषय में तुम दुविधा में क्यों पड़ते हो? वे अच्छी हैं। तनिक भी दुविधा में मत पड़ो, बल्कि प्रभु का विश्वास धारण कर लो, और तुम उन आज्ञाओं पर चलोगे; क्योंकि उनके पालन में मैं तुम्हें सामर्थ्य दूँगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχεῖς / διψυχήσῃς
  choice: दुविधा में पड़ते हो / दुविधा में मत पड़ो
  rationale: शाब्दिक अर्थ ‘दो मन वाला होना’ है; आधुनिक हिन्दी में ‘दुविधा में पड़ना’ अस्थिरता और संदेह, दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔνδυσαι
  choice: पहन लो
  rationale: मूल के वस्त्र धारण करने वाले रूपक को सुरक्षित रखा गया है; इसे केवल ‘अपना लो’ कहने से रूपक खो जाता।
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: प्रभु के विश्वास को
  rationale: 'सम्बन्धकारक की वास्तविक अस्पष्टता सुरक्षित है: इसका आशय प्रभु पर विश्वास अथवा प्रभु से सम्बद्ध विश्वास हो सकता है; अनुवाद किसी एक अर्थ को निर्णायक नहीं बनाता।'
- source_word: ἐν αὐταῖς πορεύσῃ
  choice: उन आज्ञाओं के अनुसार चलोगे
  rationale: ‘उनमें चलना’ हिब्रू-यूनानी नैतिक मुहावरा है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘के अनुसार’ जोड़ा गया, जबकि चलने की मूल छवि रखी गई।
- source_word: ἐνδυναμώσω ἐν αὐταῖς
  choice: उनमें दृढ़ करूँगा
  rationale: वक्ता द्वारा आज्ञाओं के पालन हेतु सामर्थ्य दिए जाने का भाव व्यक्त करता है और ‘उनमें’ के सम्बन्ध को बनाए रखता है।
theological_decisions:
- issue: ‘प्रभु के विश्वास’ में सम्बन्धकारक का अर्थ
  choice: अस्पष्ट सम्बन्धकारक को ‘प्रभु के विश्वास’ के रूप में बनाए रखा
  alternative: ‘प्रभु पर विश्वास’ या ‘प्रभु की विश्वासयोग्यता’
  rationale: मूल τὴν πίστιν τοῦ Κυρίου व्याकरणतः एक से अधिक अर्थ की अनुमति देता है; प्रसंग विश्वास धारण करने पर बल देता है, पर केवल वस्तुनिष्ठ अथवा कर्तृवाचक अर्थ निश्चित नहीं करता।
- issue: आज्ञाओं पर चलने की सामर्थ्य
  choice: वक्ता की प्रतिज्ञा ‘मैं तुम्हें उनमें दृढ़ करूँगा’ स्पष्ट रखी
  alternative: मानवीय प्रयास पर केंद्रित ‘तुम उनका पालन कर सकोगे’
  rationale: मूल में ἐγώ पर बल और भविष्यकालीन सामर्थ्य-प्रदान है; इसे कम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कथन में वर्तमानकालीन दृश्यात्मकता (‘मैंने ... देखा’) को हिन्दी कथा-प्रवाह के अनुसार व्यक्त किया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
