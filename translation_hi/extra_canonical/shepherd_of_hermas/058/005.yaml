translation:
  language: hi
  text: मैंने पूछा, “स्वामी, कौन-कौन से भोग हानिकारक हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: स्वामी
  rationale: सम्मानपूर्ण संबोधन को आधुनिक, गरिमापूर्ण हिन्दी में रखा गया है; प्रसंग में यह अनिवार्य रूप से परमेश्वर के लिए प्रयुक्त उपाधि नहीं है।
- source_word: τρυφαί
  choice: भोग
  rationale: यहाँ शब्द उन सुखदायक आचरणों या लिप्साओं के लिए है जिनमें मनुष्य आसक्त होकर आनंद लेता है; ‘भोग’ प्रश्न की संक्षिप्तता और आगे आने वाली नैतिक व्याख्या दोनों के अनुकूल है।
- source_word: βλαβεραί
  choice: हानिकारक
  rationale: मूल के सामान्य अर्थ ‘हानि पहुँचाने वाले’ को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सीधे व्यक्त करता है।
- source_word: φημί
  choice: मैंने पूछा
  rationale: प्रत्यक्ष प्रश्न के साथ यूनानी कथन-सूचक क्रिया का स्वाभाविक हिन्दी रूप; प्रसंगगत संवाद को स्पष्ट करता है।
