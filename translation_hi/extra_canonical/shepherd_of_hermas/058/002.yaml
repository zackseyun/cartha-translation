  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/002.yaml
  text: He answered me and says, “Your foolishness is persistent, and you are unwilling to cleanse your heart and to serve God. Watch out lest the time be fulfilled, and you be found foolish. Listen then,” he says, “as you desire, so that you may understand these things.
translation:
  language: hi
  text: उसने मुझे उत्तर दिया, “तुम्हारी मूर्खता बनी ही रहती है, और तुम अपने हृदय को शुद्ध करके परमेश्वर की सेवा करना नहीं चाहते। सावधान रहो, कहीं ऐसा न हो कि समय पूरा हो जाए और तुम मूर्ख पाए जाओ। इसलिए सुनो, जैसा तुम चाहते हो, ताकि इन बातों को समझ सको।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ ἀφροσύνη σου παράμονός ἐστι
  choice: तुम्हारी मूर्खता बनी हुई है
  rationale: παράμονος निरंतर बने रहने या हठपूर्वक टिके रहने का भाव देता है; सहज हिन्दी में आरोप की तीव्रता बनाए रखी गई है।
- source_word: καθαρίσαι
  choice: शुद्ध करके
  rationale: हृदय की नैतिक और आत्मिक शुद्धि का मूल रूपक सुरक्षित रखता है।
- source_word: δουλεύειν τῷ Θεῷ
  choice: परमेश्वर की सेवा करना
  rationale: δουλεύειν का शाब्दिक अर्थ दास के रूप में सेवा करना है; हिन्दी में स्वाभाविक धार्मिक अभिव्यक्ति चुनी गई, जबकि अधीन सेवा का भाव बना रहता है।
- source_word: βλέπε
  choice: सावधान रहो
  rationale: यहाँ क्रिया चेतावनीसूचक है, इसलिए केवल ‘देखो’ की अपेक्षा संदर्भानुकूल अर्थ दिया गया है।
- source_word: ὁ χρόνος πληρωθῇ
  choice: समय पूरा हो जाए
  rationale: मूल के निष्क्रिय और संभाव्य कथन को बिना यह तय किए सुरक्षित रखा गया है कि कौन-सा समय अभिप्रेत है।
- source_word: ἄκουε οὖν
  choice: इसलिए अब ध्यान से सुनो
  rationale: ἄκουε की आज्ञा और οὖν का निष्कर्षात्मक संबंध स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἵνα νοήσῃς αὐτά
  choice: ताकि इन बातों को समझ सको
  rationale: αὐτά पूर्ववर्ती विषयों की ओर संकेत करता है; ‘इन बातों’ से संदर्भ स्पष्ट और स्वाभाविक रहता है।
theological_decisions:
- issue: ‘समय पूरा हो जाने’ का आशय
  choice: 'अस्पष्ट रखा गया: ‘समय पूरा हो जाए’'
  alternative: ‘तुम्हें मिला समय समाप्त हो जाए’ या ‘न्याय का समय आ जाए’
  rationale: यूनानी पाठ समय की पहचान स्पष्ट नहीं करता; किसी विशिष्ट अंतकालीन या पश्चात्ताप-संबंधी व्याख्या को अनावश्यक रूप से नहीं जोड़ा गया।
- issue: परमेश्वर के प्रति δουλεύειν
  choice: ‘परमेश्वर की सेवा करना’
  alternative: ‘परमेश्वर का दास बनना’
  rationale: मूल में दासवत अधीनता का अर्थ है, पर आधुनिक हिन्दी में ‘सेवा करना’ अधिक स्वाभाविक है और बिना अतिरिक्त सांप्रदायिक अर्थ के आशय व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण चेतावनी की शैली रखी गई है। वाक्य साधारण पाठकों के लिए सुबोध हैं, पर मूल की कठोरता—मूर्खता, हृदय की शुद्धि, सेवा और समय पूरा होने की चेतावनी—कम नहीं की गई। स्रोत में कोष्ठकित φησί को अलग से दोहराना हिन्दी में अनावश्यक और बोझिल होता, इसलिए संवाद का प्रवाह स्वाभाविक रखा गया है।
