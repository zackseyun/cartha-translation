base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/004.yaml
  text: “So, being tormented and punished the whole year, he remembers the indulgence and the deception, and he knows that because of them he suffers evil things. Every person who indulges himself and is deceived is tormented in this way, because, though having life, they have handed themselves over to death.”
translation:
  language: hi
  text: इसलिए वह पूरे वर्ष यातना और दंड सहते हुए कभी उस भोग-विलास और धोखे को याद करता है, और जानता है कि इन्हीं के कारण वह ये बुरी बातें सह रहा है। इसलिए हर वह मनुष्य जो भोग-विलास करता है और धोखा खाता है, इसी प्रकार यातना सहता है, क्योंकि जीवन होते हुए भी वे अपने आपको मृत्यु के हवाले कर चुके हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασανιζόμενος
  choice: यातना सहते हुए
  rationale: यह कृदंत निरंतर पीड़ा झेलने का भाव देता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इसकी तीव्रता सुरक्षित है।
- source_word: τιμωρούμενος
  choice: दंड सहते हुए
  rationale: τιμωρία के दंडात्मक अर्थ को βάσανος की यातना से अलग रखा गया है।
- source_word: τρυφῆς
  choice: भोग-विलास
  rationale: संदर्भ में यह केवल सुख नहीं, बल्कि आत्मतुष्टिपूर्ण और हानिकारक लिप्तता है; ‘भोग-विलास’ उस नैतिक अर्थ को स्पष्ट करता है।
- source_word: ἀπάτης / ἀπατώμενος
  choice: छल / छल में भटकता है
  rationale: ἀπάτη में धोखे और भ्रम दोनों की संभावना है। संज्ञा के लिए ‘छल’ और मध्य/निष्क्रिय कृदंत के लिए ‘छल में भटकता है’ चुना गया, ताकि व्यक्ति के धोखा खाने का भाव बना रहे।
- source_word: πάσχει τὰ πονηρά
  choice: ये बुरे कष्ट सह रहा है
  rationale: शाब्दिक ‘बुरी बातें सहता है’ हिन्दी में अस्पष्ट होता; ‘बुरे कष्ट’ विपत्तियों और पीड़ादायक परिणामों का भाव देता है।
- source_word: ἔχοντες ζωὴν
  choice: जीवन होते हुए भी
  rationale: वर्तमान जीवन/जीवन की उपलब्धता और स्वयं को मृत्यु को सौंपने के विरोधाभास को बनाए रखता है।
- source_word: εἰς θάνατον ἑαυτοὺς παραδεδώκασι
  choice: अपने आपको मृत्यु के हवाले कर दिया है
  rationale: परिणामी समर्पण को स्वाभाविक और गंभीर हिन्दी में व्यक्त करता है, बिना ‘मृत्युदंड’ जैसी अतिरिक्त न्यायिक धारणा जोड़े।
theological_decisions:
- issue: जीवन से मृत्यु की ओर स्वयं को सौंपना
  choice: ‘जीवन होते हुए भी उन्होंने अपने आपको मृत्यु के हवाले कर दिया है’
  alternative: ‘जीवित होते हुए भी उन्होंने स्वयं को मृत्यु के अधीन कर दिया है’
  rationale: मूल पाठ की नैतिक जवाबदेही और जीवन-मृत्यु के तनाव को सुरक्षित रखा गया है; मृत्यु की प्रकृति को शारीरिक, आध्यात्मिक या अंतिम मृत्यु के रूप में सीमित नहीं किया गया।
- issue: एकवचन से बहुवचन में परिवर्तन
  choice: पहले व्यक्ति के लिए एकवचन, फिर सार्वभौमिक कथन में मूल के बहुवचन ‘उन्होंने’ को बनाए रखा
  alternative: पूरे अंतिम वाक्य को एकवचन ‘उसने’ में समरूप करना
  rationale: ग्रीक में πᾶς ... ἄνθρωπος के बाद बहुवचन ἔχοντες/παραδεδώκασι आता है। इस व्याकरणिक बदलाव को पूर्णतः समतल करने के बजाय हिन्दी में सुरक्षित रखा गया।
- issue: ποτὲ का अर्थ
  choice: ‘कभी-कभी’
  alternative: ‘कभी’ अथवा इसे अनूदित न करना
  rationale: यह कालगत अनिश्चितता/अवसरगत स्मरण को दर्शाता है। संदर्भ में ‘कभी-कभी’ स्वाभाविक है, यद्यपि ‘कभी’ भी संभव है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘भोग-विलास’, ‘यातना’, ‘दंड’ और ‘मृत्यु के हवाले’ मूल की नैतिक गंभीरता बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
