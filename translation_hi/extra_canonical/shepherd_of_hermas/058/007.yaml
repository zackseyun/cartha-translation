base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/007.yaml
  text: “But there are also indulgences that save people; for many, by doing good things, indulge themselves, being carried along by their own pleasure. This indulgence, therefore, is beneficial for the servants of God, and it secures life for such a person; but the harmful indulgences previously mentioned procure torments and punishments for them; and if they persist and do not repent, they procure death for themselves.”
translation:
  language: hi
  text: पर ऐसे आनंद भी हैं जो मनुष्यों को बचाते हैं; क्योंकि बहुत-से लोग भले काम करते हुए अपनी ही प्रसन्नता से प्रेरित होकर आनंदित होते हैं। इसलिए ऐसा आनंद परमेश्वर के सेवकों के लिए लाभदायक है और ऐसे मनुष्य को जीवन दिलाता है। पर पहले बताए गए हानिकारक आनंद उन लोगों के लिए यातनाएँ और दंड लाते हैं; और यदि वे उनमें बने रहें और पश्चाताप न करें, तो वे अपने लिए मृत्यु मोल लेते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί / τρυφή
  choice: सुख
  rationale: एक ही यूनानी शब्द यहाँ सकारात्मक और नकारात्मक, दोनों प्रकार के आनंद के लिए प्रयुक्त है। ‘सुख’ इस अर्थ-विस्तार और अनुच्छेद की जानबूझकर की गई पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σώζουσαι
  choice: बचाते हैं
  rationale: क्रिया का सीधा उद्धार/रक्षा-संबंधी अर्थ बनाए रखा गया है, बिना उसके धार्मिक आशय को अतिरिक्त रूप से परिभाषित किए।
- source_word: τῇ ἑαυτῶν ἡδονῇ φερόμενοι
  choice: अपने ही आनंद से प्रेरित होकर
  rationale: शाब्दिक ‘अपने आनंद से बहाए/ले जाए जाते हुए’ को स्वाभाविक हिन्दी में व्यक्त करता है और भले काम करने में मिलने वाले आंतरिक आनंद का भाव रखता है।
- source_word: περιποιεῖται
  choice: दिलाता है / लाते हैं / मोल लेते हैं
  rationale: संदर्भानुसार ‘प्राप्त कराना, अपने लिए अर्जित करना’ का परिणामकारी भाव व्यक्त किया गया है; अंतिम वाक्य में आत्म-विनाशकारी उत्तरदायित्व को ‘अपने लिए ... मोल लेते हैं’ से स्पष्ट रखा गया है।
- source_word: ἐπιμένωσι
  choice: उनमें लगे रहें
  rationale: हानिकारक सुखों में बने रहने या लगातार लगे रहने का भाव देता है।
theological_decisions:
- issue: भले कामों से मिलने वाला सुख ‘बचाता’ और ‘जीवन दिलाता’ है
  choice: पाठ के कारण-परिणाम संबंध को यथावत रखा गया
  alternative: इसे केवल उद्धार के प्रमाण या फल के रूप में समझाकर अनुवाद करना
  rationale: यूनानी पाठ स्वयं सकारात्मक सुख को ‘बचाने वाला’ और ‘जीवन दिलाने वाला’ कहता है; किसी विशेष सिद्धान्त के अनुसार इस तनाव को हल करना अनुवाद का काम नहीं है।
- issue: हानिकारक सुखों में टिके रहने का परिणाम
  choice: पश्चाताप न करने पर अपने लिए मृत्यु मोल लेना
  alternative: मृत्यु को केवल सांसारिक या केवल अनन्त मृत्यु के रूप में निर्दिष्ट करना
  rationale: मूल पाठ मृत्यु की प्रकृति को यहाँ सीमित नहीं करता, इसलिए उसकी वास्तविक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘सुख’ की पुनरावृत्ति मूल यूनानी τρυφή के सकारात्मक और हानिकारक दोनों प्रयोगों को जोड़ती है; अनावश्यक धर्म-सांप्रदायिक शब्दावली से बचा गया है।
