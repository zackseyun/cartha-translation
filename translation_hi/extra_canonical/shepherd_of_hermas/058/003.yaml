base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/003.yaml
  text: “The one who indulges himself and is deceived for a single day and does what he wants has clothed himself with much foolishness and does not perceive the deed he is doing; for on the next day he forgets what he did the day before. For indulgence and deception have no memory because of the foolishness with which he has clothed himself. But when punishment and torment cling to a person for one day, he is punished and tormented for up to a year; for punishment and torment have great memory.
translation:
  language: hi
  text: “जो व्यक्ति एक दिन भोग-विलास करता है, धोखा खाता है और जो चाहता है वही करता है, उसने बड़ी मूर्खता ओढ़ ली है और वह उस काम को नहीं समझता जो वह कर रहा है। क्योंकि अगले दिन वह भूल जाता है कि उसने एक दिन पहले क्या किया था; भोग-विलास और धोखे की कोई स्मृति नहीं होती, उस मूर्खता के कारण जो उसने ओढ़ ली है। पर जब दंड और यातना किसी व्यक्ति से एक दिन के लिए चिपक जाते हैं, तो वह एक वर्ष तक दंडित और यातित होता है; क्योंकि दंड और यातना की स्मृति बड़ी प्रबल होती है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶν / τρυφή
  choice: भोग-विलास में डूबा रहता / भोग-विलास
  rationale: यहाँ शब्द आत्मतुष्टि, सुखभोग और नैतिक रूप से हानिकारक विलास की ओर संकेत करता है; ‘भोग-विलास’ आधुनिक हिन्दी में इस नकारात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπατώμενος / ἀπάτη
  choice: धोखे में पड़ा रहता / धोखा
  rationale: मध्य/कर्मवाच्य रूप की अस्पष्टता बनाए रखते हुए व्यक्ति के भ्रमित या छले जाने की दशा व्यक्त की गई है; कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
- source_word: ἀφροσύνην ἐνδέδυται
  choice: अपने आप को बड़ी मूर्खता से ढक लिया है
  rationale: वस्त्र पहनने के यूनानी रूपक को हिन्दी में बोधगम्य रखते हुए ‘ढक लिया’ कहा गया है; आगे की पुनरावृत्ति में ‘ओढ़ रखा’ उसी रूपक को बनाए रखता है।
- source_word: οὐ νοεῖ τὴν πρᾶξιν ἣν ποιεῖ
  choice: वह समझता नहीं कि वह क्या कर रहा है
  rationale: शाब्दिक ‘उस कर्म को नहीं समझता जिसे वह करता है’ की अपेक्षा यह सहज हिन्दी है और अर्थ को सुरक्षित रखती है।
- source_word: μέχρις ἐνιαυτοῦ
  choice: एक वर्ष तक
  rationale: अवधि की ऊपरी सीमा को ‘तक’ द्वारा व्यक्त किया गया है; इसे निश्चित रूप से पूरा एक वर्ष मानकर नहीं बढ़ाया गया।
- source_word: μνήμας μεγάλας ἔχει
  choice: स्मृति बहुत गहरी होती है
  rationale: यूनानी बहुवचन का शाब्दिक ‘बड़ी स्मृतियाँ’ हिन्दी में अस्वाभाविक है; अभिप्राय यह है कि पीड़ा की याद दीर्घ और प्रबल रहती है।
theological_decisions:
- issue: एक दिन के सुखभोग और एक वर्ष तक दंड का संबंध
  choice: पाठ की तीखी समयगत तुलना को ज्यों का त्यों रखा गया
  alternative: इसे सामान्य सिद्धांत या प्रतीकात्मक अनुपात के रूप में स्पष्ट करना
  rationale: मूल पाठ स्वयं इसकी व्याख्या नहीं करता; अनुवाद में दंड की प्रकृति, न्याय-सिद्धांत या गणितीय अनुपात आरोपित नहीं किया जाना चाहिए।
- issue: ἀπάτη में बाहरी छल या आत्म-भ्रम
  choice: ‘धोखे में पड़ा’ कहकर स्रोत की अस्पष्टता बनाए रखी गई
  alternative: ‘अपने आपको धोखा देता है’ या ‘शैतान से धोखा खाता है’
  rationale: यूनानी रूप यह निश्चित नहीं करता कि छल का कर्ता कौन है; किसी विशिष्ट धार्मिक व्याख्या को जोड़ना अनुचित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। मूल के वस्त्र-रूपक, कारणसूचक क्रम और दंड/यातना की पुनरावृत्ति को बनाए रखा गया है। इस खंड में कोई पादटिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
