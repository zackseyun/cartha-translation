base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/001.yaml
  text: “Since,” I say, “sir, I have not understood at all about the time of deception and indulgence and torment, make it more clear to me.”
translation:
  language: hi
  text: मैंने कहा, “स्वामी, मैं छल, भोग-विलास और यातना के समय के विषय में बिलकुल नहीं समझ पाया हूँ। कृपया इसे मुझे और स्पष्ट करके समझाइए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: स्वामी
  rationale: यहाँ विनम्र संबोधन है; ‘स्वामी’ प्राचीन संदर्भ की गरिमा बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: χρόνου
  choice: समय
  rationale: मूल शब्द समय या अवधि दोनों का बोध करा सकता है; ‘समय’ मूल की व्यापकता और संभावित अस्पष्टता को बनाए रखता है।
- source_word: ἀπάτης
  choice: छल
  rationale: ἀπάτη का अर्थ धोखा या भ्रमकारी छल है; संक्षिप्त ‘छल’ मूल अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τρυφῆς
  choice: भोग-विलास
  rationale: यहाँ शब्द आत्मतुष्टिपूर्ण सुख-भोग को सूचित करता है; ‘भोग-विलास’ उसके नैतिक और इंद्रियपरक आयाम को व्यक्त करता है।
- source_word: βασάνου
  choice: यातना
  rationale: βάσανος इस प्रसंग में कष्टदायक दंड या पीड़ा है; ‘यातना’ उसकी तीव्रता को बनाए रखती है।
- source_word: τηλαυγέστερόν μοι δήλωσον
  choice: कृपया इसे मुझे और स्पष्ट करके समझाइए
  rationale: शाब्दिक भाव ‘मुझे अधिक स्पष्ट रूप से प्रकट/बताइए’ है; चुना गया वाक्य आधुनिक हिन्दी में स्वाभाविक और सम्मानसूचक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का विनम्र, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। पाठक-खंड केवल 58:1 है; इसलिए मूल स्रोत के बाद के अनुच्छेद शामिल नहीं किए गए।
