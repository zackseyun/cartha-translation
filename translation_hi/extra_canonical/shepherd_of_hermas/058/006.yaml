base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/006.yaml
  text: He says, “Every deed is an indulgence to a person, whatever he does with pleasure. For even the hot‑tempered man, by giving his own passion its fill, indulges himself; and the adulterer and the drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing things like these gives his own disease its fill; he therefore indulges himself in his act. All these indulgences are harmful to the servants of God. Therefore, because of these deceptions, those who are punished and tormented suffer.
translation:
  language: hi
  text: वह कहता है, “मनुष्य जो भी काम आनंद से करता है, उसके लिए वह काम सुख-भोग है। क्योंकि क्रोधी मनुष्य भी अपने आवेश को भरपूर तुष्ट करके सुख-भोग करता है; और व्यभिचारी, पियक्कड़, निंदा करने वाला, झूठा, लोभी, ठगने वाला, और इनके समान काम करने वाला व्यक्ति भी अपने ही रोग को भरपूर तुष्ट करता है; इसलिए वह अपने काम में सुख-भोग करता है। ये सभी सुख-भोग परमेश्वर के सेवकों के लिए हानिकारक हैं। इसलिए इन छलनाओं के कारण जिन्हें दंड दिया जाता और यातना दी जाती है, वे दुःख उठाते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή / τρυφᾷ
  choice: भोग-विलास / भोग-विलास करता है
  rationale: यहाँ शब्द केवल सामान्य सुख नहीं, बल्कि इच्छा या दुर्वासना को तृप्त करने वाले आत्मलिप्त आनंद को दर्शाता है। पूरे अंश में संज्ञा और क्रिया का संबंध बनाए रखा गया है।
- source_word: πρᾶξις
  choice: काम
  rationale: साधारण पाठकों के लिए स्वाभाविक है और किसी व्यक्ति द्वारा किए गए कर्म या आचरण को स्पष्ट करता है।
- source_word: ὀξύχολος
  choice: क्रोधी मनुष्य
  rationale: शीघ्र और तीव्र क्रोध करने वाले व्यक्ति का सहज आधुनिक हिन्दी रूप।
- source_word: πάθος
  choice: आवेश
  rationale: इस प्रसंग में क्रोध की प्रबल वासना या आवेग अभिप्रेत है; ‘आवेश’ निकटवर्ती अर्थ और नकारात्मक बल दोनों रखता है।
- source_word: τὸ ἱκανὸν ποιῶν
  choice: भरपूर तृप्त करके
  rationale: मुहावरे का आशय अपनी लालसा या प्रवृत्ति को पर्याप्त मात्रा में संतुष्ट करना है, न कि केवल कोई काम ‘काफी’ करना।
- source_word: κατάλαλος
  choice: निंदा करने वाला
  rationale: दूसरों के विरुद्ध बुरा बोलने वाले के लिए स्पष्ट और व्यापक हिन्दी अभिव्यक्ति।
- source_word: πλεονέκτης
  choice: लोभी
  rationale: अधिक पाने की लालसा रखने वाले व्यक्ति का संक्षिप्त और प्रचलित रूप।
- source_word: ἀποστερητής
  choice: ठगने वाला
  rationale: दूसरे को उसके अधिकार या संपत्ति से वंचित करने की धारणा को साधारण हिन्दी में व्यक्त करता है।
- source_word: νόσος
  choice: बीमारी
  rationale: मूल का नैतिक रोग वाला रूपक सुरक्षित रखा गया है।
- source_word: ἀπάτας
  choice: छलनाओं
  rationale: पूर्व प्रसंग के आत्म-भ्रमकारी भोगों से संबंध रखते हुए मूल बहुवचन और छल/भ्रम की अर्थ-छाया को बनाए रखता है।
- source_word: τιμωρούμενοι καὶ βασανιζόμενοι
  choice: जिन्हें दंड और यातना दी जाती है
  rationale: दोनों भिन्न यूनानी पदों को बनाए रखते हुए स्वाभाविक हिन्दी कर्मवाच्य दिया गया है।
theological_decisions:
- issue: क्या हर आनंदपूर्ण कर्म को अपने आप पापपूर्ण कहा जाए
  choice: ‘मनुष्य जो भी काम आनंद लेकर करता है, वह हर ऐसा काम उसके लिए भोग-विलास है’ के बाद दिए गए दुष्कर्मों को उसी कथन के संदर्भ में रखा गया
  alternative: वाक्य को सीधे ‘हर आनंदपूर्ण काम पाप है’ के रूप में स्पष्ट करना
  rationale: मूल आगे चलकर हितकारी और उद्धारकारी आनंदों को भी स्वीकार करता है; इसलिए इस वाक्य की व्यापक और तनावपूर्ण भाषा को संप्रदायगत निष्कर्ष से नहीं बाँधा गया।
- issue: दंड और यातना का कर्ता तथा स्वरूप
  choice: कर्मवाच्य बनाए रखा गया और दंड देने वाले की पहचान नहीं जोड़ी गई
  alternative: इसे स्पष्ट रूप से परमेश्वर द्वारा दिया गया अंतिम दंड कहना
  rationale: इस इकाई में यूनानी पाठ कर्ता या दंड के अंतिम स्वरूप को स्पष्ट नहीं करता।
- issue: ‘बीमारी’ का नैतिक-आध्यात्मिक रूपक
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: इसे ‘पापी स्वभाव’ या किसी विशिष्ट धार्मिक सिद्धांत से बदलना
  rationale: मूल पाठ दुर्व्यसन को रोग कहता है, पर कोई विकसित सिद्धांत नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सरल गद्य। यूनानी की पुनरुक्ति—विशेषकर ‘भोग-विलास’ और ‘भरपूर तृप्त’—को तर्क की कड़ी बनाए रखने के लिए यथासंभव सुरक्षित रखा गया है। पाठ reader segment 6 के अनुरूप मूल के 58:5 के उत्तरार्ध और 58:6 को समेटता है, जैसा प्रदत्त अंग्रेज़ी consultation layer में है।
