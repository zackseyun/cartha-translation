base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/001.yaml
  text: After I had prayed in the house and sat down on the couch, a certain man entered, glorious in appearance, in shepherd’s attire, wearing a white skin, and having a bag on his shoulders and a staff in his hand. And he greeted me, and I returned his greeting.
translation:
  language: hi
  text: घर में प्रार्थना करने के बाद मैं पलंग पर बैठ गया। एक पुरुष भीतर आया, जिसका रूप तेजस्वी था। उसने चरवाहे का वेश धारण कर रखा था, सफेद खाल ओढ़े हुए था, उसके कंधों पर एक झोली और हाथ में एक लाठी थी। उसने मेरा अभिवादन किया, और मैंने भी उसके अभिवादन का उत्तर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ οἴκῳ
  choice: घर में
  rationale: साधारण घरेलू स्थान का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: κλίνην
  choice: पलंग
  rationale: यहाँ बैठने योग्य घरेलू शय्या या आसन का बोध है; ‘पलंग’ आधुनिक पाठक के लिए स्पष्ट है और अनावश्यक रूप से ‘सोफ़ा’ नहीं मानता।
- source_word: ἀνήρ τις ἔνδοξος τῇ ὄψει
  choice: एक पुरुष ... जिसका रूप तेजस्वी था
  rationale: ἔνδοξος τῇ ὄψει दृश्य गरिमा या तेज को व्यक्त करता है; ‘तेजस्वी’ अलौकिक पहचान को स्पष्ट रूप से निर्धारित किए बिना प्रभाव बनाए रखता है।
- source_word: σχήματι ποιμενικῷ
  choice: चरवाहे का वेश धारण कर रखा था
  rationale: σχῆμα यहाँ बाहरी रूप या पोशाक को दर्शाता है; यह अनुवाद व्यक्ति की वास्तविक पहचान के बजाय उसके दिखाई देने वाले वेश को सुरक्षित रखता है।
- source_word: δέρμα λευκόν
  choice: सफेद चमड़ा
  rationale: δέρμα का मूल अर्थ पशु-चर्म है; ‘वस्त्र’ कहने से ठोस स्रोत-चित्र मिट जाता।
- source_word: πήραν
  choice: झोली
  rationale: यह यात्री या चरवाहे की थैली है; ‘झोली’ हिन्दी में कंधे पर ढोई जाने वाली साधारण थैली का स्वाभाविक चित्र देती है।
- source_word: ῥάβδον
  choice: लाठी
  rationale: चरवाहे के हाथ में पकड़ी छड़ी के लिए सहज हिन्दी शब्द।
- source_word: ἠσπάσατό με ... ἀντησπασάμην
  choice: उसने मेरा अभिवादन किया, और मैंने भी उसके अभिवादन का उत्तर दिया
  rationale: परस्पर अभिवादन की क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, बिना आलिंगन या चुंबन जैसी किसी विशिष्ट रीति को आरोपित किए।
theological_decisions:
- issue: आगंतुक की पहचान
  choice: इस खंड में केवल ‘एक पुरुष’ कहा गया है
  alternative: उसे आरंभ से ही ‘स्वर्गदूत’ या ‘चरवाहा’ कहना
  rationale: मूल कथन इस क्षण उसकी पहचान प्रकट नहीं करता; वह केवल चरवाहे के वेश में दिखाई देता है। बाद के प्रकाशन को पहले से आरोपित नहीं किया गया।
- issue: ἔνδοξος में अलौकिक महिमा का स्तर
  choice: ‘रूप तेजस्वी था’
  alternative: ‘दिव्य महिमा से परिपूर्ण था’
  rationale: ग्रीक दृश्य प्रभाव और गरिमा बताता है, पर इस वाक्य में स्पष्ट रूप से दिव्यता घोषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल कथात्मक शैली। यूनानी वाक्य के क्रम को पठनीय हिन्दी के लिए हल्का पुनर्गठित किया गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
