  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/004.yaml
  text: 4. While he was still speaking, his appearance was changed, and I recognized him, that he was the one to whom I had been entrusted, and immediately I was confounded, and fear seized me, and I was completely crushed with grief, because I had answered him so wickedly and foolishly.
translation:
  language: hi
  text: 4. वह अभी बोल ही रहा था कि उसका रूप बदल गया, और मैंने उसे पहचान लिया कि वह वही व्यक्ति था जिसके सुपुर्द मुझे किया गया था। मैं तुरंत अत्यंत व्याकुल हो गया; भय ने मुझे आ घेरा, और मैं शोक से पूरी तरह टूट गया, क्योंकि मैंने उसे इतने बुरे और मूर्खतापूर्ण ढंग से उत्तर दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠλλοιώθη ἡ ἰδέα αὐτοῦ
  choice: उसका रूप बदल गया
  rationale: ἰδέα यहाँ दृश्य रूप या आकृति को दर्शाता है; सरल हिंदी में ‘रूप’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ἐπέγνων αὐτόν
  choice: मैंने उसे पहचान लिया
  rationale: क्रिया का आशय पहचान की प्राप्ति है, केवल जान लेने का नहीं।
- source_word: ᾧ παρεδόθην
  choice: जिसके सुपुर्द मुझे किया गया था
  rationale: निष्क्रिय क्रिया παραδίδωμι के संरक्षण या देखरेख हेतु सौंपे जाने के भाव को बनाए रखता है, बिना यह जोड़े कि सौंपने वाला कौन था।
- source_word: συνεχύθην
  choice: मैं घबरा गया
  rationale: संदर्भ में यह लज्जा, व्याकुलता और मानसिक विचलन का भाव देता है; ‘घबरा गया’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: φόβος με ἔλαβεν
  choice: भय ने मुझे आ घेरा
  rationale: यूनानी मुहावरे के अचानक भय की चपेट में आने वाले सजीव भाव को बनाए रखता है।
- source_word: ὅλος συνεκόπην ἀπὸ τῆς λύπης
  choice: मैं शोक से पूरी तरह टूट गया
  rationale: शाब्दिक प्रहार या टूटने की तीव्र छवि को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: πονηρῶς καὶ ἀφρόνως
  choice: दुष्टता और मूर्खता से
  rationale: दोनों क्रियाविशेषणों के नैतिक और अविवेकी पक्ष को अलग-अलग बनाए रखता है।
theological_decisions:
- issue: वक्ता के सुपुर्द किए जाने की निष्क्रिय अभिव्यक्ति
  choice: ‘जिसके सुपुर्द मुझे किया गया था’—कर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘जिसे परमेश्वर ने मेरा रखवाला ठहराया था’
  rationale: मूल वाक्य न तो सौंपने वाले का नाम बताता है, न ‘रखवाला’ शब्द जोड़ता है; इसलिए धार्मिक निष्कर्ष को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। मूल की भावनात्मक तीव्रता तथा ‘सुपुर्द किए जाने’ की अस्पष्टता सुरक्षित रखी गई है।
