  text: 2. And immediately he sat beside me and says to me, “I have been sent by the most venerable angel, that I may dwell with you for the rest of the days of your life.”
translation:
  language: hi
  text: 2. वह तुरन्त मेरे पास आ बैठा और मुझसे बोला, “मुझे परम आदरणीय स्वर्गदूत ने भेजा है, ताकि मैं तुम्हारे जीवन के शेष दिनों तक तुम्हारे साथ रहूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह क्रिया की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρεκάθισέν μοι
  choice: मेरे पास आ बैठा
  rationale: παρά के निकटता-बोध और बैठने की क्रिया, दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τοῦ σεμνοτάτου ἀγγέλου
  choice: परम आदरणीय स्वर्गदूत
  rationale: अतिशयोक्तिपरक σεμνοτάτου का सम्मानसूचक बल बनाए रखता है; ἄγγελος को प्रसंगानुसार 'स्वर्गदूत' कहा गया है।
- source_word: μετὰ σοῦ οἰκήσω
  choice: तुम्हारे साथ रहूँ
  rationale: οἰκέω का मूल भाव साथ निवास करना है; आधुनिक हिन्दी में 'साथ रहना' अधिक स्वाभाविक है।
- source_word: τὰς λοιπὰς ἡμέρας τῆς ζωῆς σου
  choice: तुम्हारे जीवन के शेष दिनों तक
  rationale: अवधि और जीवन के बचे हुए दिनों का अर्थ स्पष्ट एवं निकट रूप से व्यक्त होता है।
theological_decisions:
- issue: ὁ σεμνότατος ἄγγελος की पहचान
  choice: परम आदरणीय स्वर्गदूत
  alternative: सबसे पवित्र स्वर्गदूत / परम महिमामय स्वर्गदूत
  rationale: पाठ इस स्वर्गदूत की विशिष्ट पहचान नहीं बताता; इसलिए कोई ईशशास्त्रीय पहचान जोड़े बिना सम्मानसूचक विशेषण का अनुवाद किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष कथन में सम्मानसूचकता मूल यूनानी से आती है, जबकि वर्णन सहज हिन्दी वाक्य-विन्यास में है।
