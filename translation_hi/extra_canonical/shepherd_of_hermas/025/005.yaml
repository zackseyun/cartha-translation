  text: 5. But he answered me and says, “Do not be confounded, but be strengthened in my commandments, which I am about to command you. For I have been sent,” he says, “that I may show you again all the things you saw before, especially the main points that are beneficial for you. First of all, write my commandments and the parables; but the other things, as I show you, so you will write.” For this reason, he says, “I command you first to write the commandments and parables, so that you may read them readily at hand and be able to keep them.”
translation:
  language: hi
  text: 5. उसने मुझे उत्तर दिया, “व्याकुल मत हो, बल्कि मेरी उन आज्ञाओं में दृढ़ बनो जिन्हें मैं तुम्हें देने वाला हूँ। क्योंकि मुझे इसलिए भेजा गया है,” उसने कहा, “कि जो कुछ तुमने पहले देखा था, वह सब मैं तुम्हें फिर दिखाऊँ—विशेषकर वे मुख्य बातें जो तुम्हारे लिए लाभदायक हैं। सबसे पहले मेरी आज्ञाएँ और दृष्टान्त लिखो; और बाकी बातें जिस प्रकार मैं तुम्हें दिखाऊँगा, उसी प्रकार लिखना।” उसने कहा, “इसी कारण मैं तुम्हें आज्ञा देता हूँ कि पहले आज्ञाएँ और दृष्टान्त लिखो, ताकि तुम उन्हें अपने पास रखकर पढ़ सको और उनका पालन कर सको।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ συγχύννου
  choice: घबराओ मत
  rationale: यहाँ क्रिया मानसिक व्याकुलता और संकोच से उबरने का आदेश देती है; आधुनिक हिन्दी में ‘घबराओ मत’ स्वाभाविक और संदर्भानुकूल है।
- source_word: ἰσχυροποιοῦ ἐν ταῖς ἐντολαῖς μου
  choice: मेरी ... आज्ञाओं में दृढ़ बनो
  rationale: यूनानी वाक्य आज्ञाओं के संबंध में शक्ति या दृढ़ता पाने पर बल देता है; ‘दृढ़ बनो’ उस भाव को संक्षेप और गरिमा से रखता है।
- source_word: ἐντολάς
  choice: आज्ञाएँ
  rationale: यह आदेशों के लिए सामान्य और धार्मिक साहित्य में सुविज्ञात हिन्दी शब्द है।
- source_word: παραβολάς
  choice: दृष्टान्त
  rationale: παραβολή के शिक्षाप्रद तुलनात्मक कथन या रूपक का पारंपरिक किंतु समझने योग्य हिन्दी पर्याय।
- source_word: αὐτὰ τὰ κεφάλαια
  choice: विशेषकर वे मुख्य बातें
  rationale: शाब्दिक अर्थ ‘स्वयं वे शीर्ष/मुख्य बिंदु’ है; प्रसंग में पहले देखी बातों के लाभदायक प्रमुख अंश अभिप्रेत हैं।
- source_word: ὑπὸ χεῖρα
  choice: तुम्हारे पास तैयार रहें
  rationale: मुहावरे का अर्थ हाथ के पास, सुलभ या तुरंत उपयोग हेतु उपलब्ध होना है; हिन्दी में भावार्थ स्वाभाविक रखा गया है।
- source_word: φυλάξαι
  choice: पालन कर सको
  rationale: आज्ञाओं के संदर्भ में इसका अर्थ केवल सुरक्षित रखना नहीं, उन्हें मानना और आचरण में रखना है।
theological_decisions:
- issue: आज्ञाओं में दृढ़ होने का भाव
  choice: ‘मेरी ... आज्ञाओं में दृढ़ बनो’
  alternative: ‘मेरी आज्ञाओं के द्वारा बलवन्त बनो’
  rationale: ἐν के साधन और क्षेत्र—दोनों संभावित भाव हैं। चुना हुआ रूप मूल की अस्पष्टता को अपेक्षाकृत बनाए रखता है और किसी विशिष्ट अनुग्रह-सिद्धान्त को आरोपित नहीं करता।
- issue: κεφάλαια का आशय
  choice: ‘मुख्य बातें’
  alternative: ‘शीर्षक’ या ‘अध्याय’
  rationale: यहाँ साहित्यिक अध्यायों की अपेक्षा लाभदायक प्रमुख बिंदु अधिक संभावित हैं; ‘मुख्य बातें’ प्रसंग को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। कथन के भीतर ‘उसने कहा’ की पुनरावृत्ति यूनानी संवाद-संरचना के अनुरूप रखी गई है। पद में कोई फुटनोट आवश्यक नहीं समझा गया।
