translation:
  language: hi
  text: 6. इसलिए मैंने वे आज्ञाएँ और दृष्टान्त वैसे ही लिख दिए, जैसे उसने मुझे आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολάς
  choice: आज्ञाएँ
  rationale: यह बहुवचन संज्ञा दिए गए आदेशों या निर्देशों को दर्शाती है; संदर्भ में ‘आज्ञाएँ’ स्वाभाविक और सटीक है।
- source_word: παραβολάς
  choice: दृष्टान्त
  rationale: यह रचना के आगामी शिक्षाप्रद रूपकात्मक खंडों का पारंपरिक और व्यापक रूप से समझा जाने वाला हिन्दी पद है।
- source_word: καθὼς
  choice: वैसे ही, जैसे
  rationale: लेखन और प्राप्त आज्ञा के बीच अनुरूपता पर यूनानी पाठ के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐνετείλατό
  choice: आज्ञा दी थी
  rationale: मूल क्रिया के प्राधिकारपूर्ण निर्देश का भाव सुरक्षित रहता है और पूर्व में दिए गए आदेश को हिन्दी के स्वाभाविक काल-प्रयोग से व्यक्त करता है।
