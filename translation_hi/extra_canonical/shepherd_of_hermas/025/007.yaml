base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/007.yaml
  text: 7. If then, having heard them, you keep them and walk in them and do them with a pure heart, you will receive from the Lord what he promised you; but if, having heard, you do not repent, but still add to your sins, you will receive from the Lord the opposite things. The Shepherd, the angel of repentance, commanded me to write all these things in this way.
translation:
  language: hi
  text: 7. इसलिए यदि तुम इन्हें सुनकर इनका पालन करोगे, इनके अनुसार चलोगे और शुद्ध हृदय से इन्हें व्यवहार में लाओगे, तो तुम्हें वह सब प्राप्त होगा जिसकी प्रभु ने तुमसे प्रतिज्ञा की है। लेकिन यदि सुनकर भी तुम मन नहीं फिराओगे, बल्कि अपने पापों में और जोड़ते रहोगे, तो तुम्हें प्रभु से उनके विपरीत बातें प्राप्त होंगी। पश्चाताप के दूत, उस चरवाहे ने मुझे ये सब बातें इसी प्रकार लिखने की आज्ञा दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε
  choice: इनका पालन करोगे
  rationale: क्रिया का अर्थ केवल सुरक्षित रखना नहीं, बल्कि दी गई आज्ञाओं को मानना और निभाना है।
- source_word: ἐν αὐταῖς πορευθῆτε
  choice: इनके अनुसार चलोगे
  rationale: यूनानी रूपक ‘उनमें चलना’ जीवन-आचरण को दर्शाता है; स्वाभाविक हिन्दी में अर्थ सुरक्षित रखा गया है।
- source_word: ἐργάσησθε αὐτὰς
  choice: इन्हें व्यवहार में लाओगे
  rationale: आज्ञाओं को सक्रिय रूप से करने का भाव व्यक्त करता है और निकटवर्ती ‘पालन’ से अनावश्यक पुनरुक्ति घटाता है।
- source_word: μετανοήσητε
  choice: मन नहीं फिराओगे
  rationale: यहाँ पश्चाताप के साथ दिशा-परिवर्तन का भाव है; आधुनिक, सुबोध धार्मिक हिन्दी में ‘मन फिराना’ उसे व्यक्त करता है।
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: पश्चाताप के दूत
  rationale: ἄγγελος को ‘दूत’ और μετανοία को ‘पश्चाताप’ देकर पदवी का औपचारिक तथा धार्मिक स्वर बनाए रखा गया है।
theological_decisions:
- issue: प्रतिज्ञा और आज्ञापालन का संबंध
  choice: 'शर्तयुक्त वाक्य को ज्यों का त्यों रखा गया: पालन करने पर प्रतिज्ञात वस्तुएँ मिलेंगी।'
  alternative: इसे केवल सामान्य प्रोत्साहन या अनुग्रह की व्याख्या के रूप में नरम करना।
  rationale: मूल पाठ स्पष्ट शर्त और परिणाम प्रस्तुत करता है; किसी बाद की धर्मवैज्ञानिक व्यवस्था से तनाव को हल नहीं किया गया।
- issue: अवज्ञा का परिणाम
  choice: τὰ ἐναντία का अनिर्दिष्ट भाव ‘इसके विपरीत’ के रूप में रखा गया।
  alternative: इसे स्पष्ट रूप से ‘दंड’ या ‘शाप’ कहना।
  rationale: मूल यूनानी परिणाम का स्वरूप नहीं बताता, केवल प्रतिज्ञा के विपरीत की बात करता है; इसलिए अस्पष्टता सुरक्षित रखी गई।
- issue: चरवाहे और पश्चाताप के दूत की पहचान
  choice: दोनों पदवियों को एक ही व्यक्ति के लिए समानाधिकरण में रखा गया।
  alternative: उन्हें दो अलग व्यक्तियों की तरह पढ़ना या किसी विशिष्ट स्वर्गदूत से पहचानना।
  rationale: यूनानी व्याकरण चरवाहे को ही ‘पश्चाताप का दूत’ बताता है, पर उससे आगे कोई निजी पहचान स्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। बहुवचन ‘तुम’ मूल के सामुदायिक संबोधन को व्यक्त करता है। ‘प्रतिज्ञा’, ‘पश्चाताप’ और ‘दूत’ जैसे प्रचलित धार्मिक शब्द बनाए गए हैं, जबकि वाक्य-विन्यास को सामान्य पाठक के लिए स्वाभाविक किया गया है।
