base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/003.yaml
  text: 3. I thought that he had come to test me, and I say to him, “Who then are you? For I,” I say, “know the one to whom I was entrusted.” He says to me, “Do you not recognize me?” “No,” I say. “I,” he says, “am the Shepherd to whom you were entrusted.”
translation:
  language: hi
  text: 3. मुझे लगा कि वह मुझे परखने आया है। मैंने उससे कहा, “तो तुम कौन हो? क्योंकि मैं जानता हूँ कि मुझे किसके सुपुर्द किया गया था।” उसने मुझसे कहा, “क्या तुम मुझे नहीं पहचानते?” मैंने कहा, “नहीं।” उसने कहा, “मैं वही चरवाहा हूँ, जिसके सुपुर्द तुम्हें किया गया था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: परखने
  rationale: यहाँ शब्द का अर्थ किसी की पहचान या प्रतिक्रिया जाँचने के लिए परीक्षा लेना है; ‘परखना’ इस प्रसंग में स्वाभाविक और अर्थ-सटीक है।
- source_word: παρεδόθην / παρεδόθης
  choice: सुपुर्द किया गया है / सुपुर्द तुम्हें किया गया है
  rationale: παραδίδωμι के निष्क्रिय रूप में किसी की देखरेख या अधिकार में सौंपे जाने का भाव है; ‘सुपुर्द’ दोनों कथनों में इस संबंध को स्पष्ट रखता है।
- source_word: ἐπιγινώσκεις
  choice: पहचानते
  rationale: यह साधारण जानकारी से अधिक सामने उपस्थित व्यक्ति को पहचान लेने का भाव व्यक्त करता है।
- source_word: ποιμήν
  choice: चरवाहा
  rationale: मूल रूपक और इस कृति में पात्र की उपाधि दोनों को बनाए रखने के लिए प्रचलित हिन्दी शब्द चुना गया है।
theological_decisions:
- issue: चरवाहे की पहचान और भूमिका
  choice: पाठ के अनुसार केवल ‘वही चरवाहा’ कहा गया है और किसी अतिरिक्त धार्मिक पहचान को नहीं जोड़ा गया।
  alternative: चरवाहे को किसी विशिष्ट मसीही व्यक्तित्व या पद से स्पष्टतः जोड़ना।
  rationale: इस पद में वक्ता स्वयं को केवल वह चरवाहा बताता है जिसके सुपुर्द हर्मास किया गया था; मूल की अनिर्दिष्टता सुरक्षित रखी गई है।
- issue: सुपुर्द किए जाने का संबंध
  choice: निष्क्रिय वाक्य-रचना रखी गई और सुपुर्द करने वाले का नाम नहीं जोड़ा गया।
  alternative: स्पष्ट करना कि परमेश्वर या किसी स्वर्गदूत ने उसे सुपुर्द किया था।
  rationale: ग्रीक इस पद में कर्ता को व्यक्त नहीं करता; उसे भरना व्याख्यात्मक विस्तार होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संवादात्मक रखी गई है। मूल यूनानी में वर्तमान और भूतकाल के कथात्मक मिश्रण को हिन्दी में सहज बनाने के लिए मुख्य कथन भूतकाल में है, जबकि संवाद में पहचान और सुपुर्दगी की वर्तमान प्रासंगिकता बनाए रखी गई है।
