  text: Listen to me, then, and fear the One who is able to do all things, to save and to destroy; and keep these commandments, and you will live to God.
translation:
  language: hi
  text: इसलिए मेरी बात सुनो, और उससे डरो जो सब कुछ करने—बचाने और नाश करने—में समर्थ है; इन आज्ञाओं का पालन करो, और तुम परमेश्वर के लिए जीवित रहोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατε οὖν μου
  choice: इसलिए मेरी सुनो
  rationale: आज्ञार्थक भाव और οὖν के निष्कर्षसूचक संबंध को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: φοβήθητε
  choice: डरो
  rationale: मूल में भय के लिए सीधा क्रियापद है; इसे केवल ‘आदर करो’ कहकर नरम नहीं किया गया।
- source_word: τὸν πάντα δυνάμενον
  choice: उससे ... जो सब कुछ करने में समर्थ है
  rationale: πάντα की व्यापकता और सामर्थ्य के भाव को बनाए रखता है।
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: बचाने और नाश करने
  rationale: दोनों विपरीत infinitives को समानांतर और स्पष्ट रखा गया है; ἀπολέσαι के कठोर अर्थ को कम नहीं किया गया।
- source_word: τηρεῖτε τὰς ἐντολὰς ταύτας
  choice: इन आज्ञाओं का पालन करो
  rationale: τηρεῖτε का आशय केवल याद रखने का नहीं, आज्ञाओं को मानने और निभाने का है।
- source_word: ζήσεσθε τῷ Θεῷ
  choice: तुम परमेश्वर के लिए जीवित रहोगे
  rationale: दत्तिव τῷ Θεῷ को उद्देश्य/संबंध के स्वाभाविक हिन्दी रूप में व्यक्त किया गया है।
theological_decisions:
- issue: πάντα δυνάμενον का संबंध अगले infinitives से
  choice: ‘सब कुछ करने में समर्थ है—बचाने और नाश करने में भी’
  alternative: ‘जो सबको बचा और नाश कर सकता है’
  rationale: मूल में πάντα को व्यक्तियों (‘सबको’) के बजाय व्यापक रूप से ‘सब कुछ’ पढ़ना अधिक सीधा है, जबकि σῶσαι और ἀπολέσαι उस सामर्थ्य को विशेष रूप से स्पष्ट करते हैं।
- issue: ζήσεσθε τῷ Θεῷ में दत्तिव का अर्थ
  choice: ‘परमेश्वर के लिए जीवित रहोगे’
  alternative: ‘परमेश्वर में जीवित रहोगे’ या ‘परमेश्वर के सामने जीवित रहोगे’
  rationale: ‘के लिए’ मूल के संबंधपरक/उद्देश्यपरक तनाव को बिना किसी विशिष्ट सांप्रदायिक व्याख्या के सबसे स्वाभाविक ढंग से रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य में चेतावनी की गंभीरता तथा बचाने और नाश करने की धार्मिक तनावपूर्ण समानांतरता सुरक्षित है।
