base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/002.yaml
  text: Therefore, believe God—you who, on account of your sins, have despaired of your life, and are adding sins and weighing down your life—that if you turn back to the Lord with your whole heart and work righteousness for the remaining days of your life, and serve him rightly according to his will, he will bring healing to your former sins, and you will have power to gain mastery over the works of the devil. And do not at all fear the devil’s threat; for he is powerless, like the sinews of a dead man.
translation:
  language: hi
  text: इसलिए परमेश्वर पर विश्वास करो—तुम, जो अपने पापों के कारण अपने जीवन से निराश हो चुके हो, पापों में और पाप जोड़ते और अपने जीवन को बोझ से दबाते जा रहे हो। यदि तुम अपने पूरे हृदय से प्रभु की ओर फिरो, अपने जीवन के शेष दिनों में धार्मिकता के काम करो और उसकी इच्छा के अनुसार ठीक रीति से उसकी सेवा करो, तो वह तुम्हारे पहले के पापों के लिए चंगाई देगा[a], और तुम्हें शैतान के कामों को वश में करने की सामर्थ्य मिलेगी। शैतान की धमकी से तनिक भी मत डरो, क्योंकि वह निर्बल है—मरे हुए मनुष्य के स्नायुओं के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारे पहले के पापों के लिए चंगाई करेगा/देगा।” यूनानी पाठ पापों के संबंध में उपचार या चंगाई का असामान्य रूपक प्रयोग करता है।'
    reason: हिन्दी में ‘पापों को चंगा करना’ असामान्य है; यह टिप्पणी मूल के रूपक को स्पष्ट करती है, बिना उसे केवल ‘क्षमा’ तक सीमित किए।
lexical_decisions:
- source_word: ἀπεγνωκότες τὴν ζωὴν ὑμῶν
  choice: अपने जीवन से निराश हो चुके हो
  rationale: ἀπογινώσκω यहाँ जीवन के विषय में आशा छोड़ देने या निराश हो जाने का भाव देता है; हिन्दी में इसे स्वाभाविक रखते हुए आत्महत्या जैसे अधिक विशिष्ट अर्थ को आरोपित नहीं किया गया।
- source_word: προστιθέντες ἁμαρτίαις
  choice: पाप पर पाप बढ़ाते
  rationale: वाक्यांश का भाव पहले के पापों में और पाप जोड़ते जाने का है; संक्षिप्त हिन्दी मुहावरा इसकी निरंतरता बनाए रखता है।
- source_word: καταβαρύνοντες τὴν ζωὴν ὑμῶν
  choice: अपने जीवन को बोझ से दबाते जा रहे हो
  rationale: क्रिया का मूल बिंब भारी बोझ से नीचे दबाने का है, जिसे हिन्दी में प्रत्यक्ष रूप से रखा गया है।
- source_word: ἐργάσησθε τὴν δικαιοσύνην
  choice: धार्मिकता के काम करो
  rationale: शाब्दिक रूप से ‘धार्मिकता को कार्यान्वित करना’ है; यह चुनाव नैतिक आचरण के सक्रिय अर्थ को स्पष्ट करता है।
- source_word: ποιήσει ἴασιν τοῖς προτέροις ὑμῶν ἁμαρτήμασι
  choice: तुम्हारे पिछले पापों को चंगा करेगा
  rationale: ἴασις का उपचार/चंगाई रूपक जानबूझकर सुरक्षित रखा गया है, यद्यपि पापों के साथ यह हिन्दी में असामान्य लग सकता है।
- source_word: κατακυριεῦσαι
  choice: प्रभुता पाने
  rationale: क्रिया का अर्थ वश में करने या अधिकारपूर्वक जीतने का है; ‘प्रभुता पाने’ मूल के बलवान अर्थ को बनाए रखता है।
- source_word: ἀπειλή
  choice: धमकी
  rationale: यहाँ शब्द शैतान की भय उत्पन्न करने वाली धमकी को सूचित करता है, न कि केवल सामान्य भय या आक्रमण को।
- source_word: ἄτονος
  choice: निर्बल
  rationale: शब्द का अर्थ तनाव, बल या सामर्थ्य से रहित होना है; अगले उपमान के साथ ‘निर्बल’ सहज बैठता है।
- source_word: νεῦρα
  choice: नसों
  rationale: प्राचीन प्रयोग में यह नस, स्नायु या पेशीय तंतु को सूचित कर सकता है; परिचित हिन्दी बिंब के लिए ‘नसों’ चुना गया और अस्पष्टता पादटिप्पणी में बताई गई।
theological_decisions:
- issue: पूर्व पापों के लिए परमेश्वर की क्रिया
  choice: पापों को ‘चंगा करेगा’
  alternative: पापों को क्षमा करेगा / उनका उपचार करेगा
  rationale: यूनानी पाठ ἴασις, अर्थात चंगाई, का असामान्य रूपक प्रयोग करता है। इसे केवल ‘क्षमा’ में बदलना मूल की अर्थ-तनाव और रूपक को सीमित कर देता।
- issue: शैतान के कामों पर विश्वासी का अधिकार
  choice: ‘प्रभुता पाने की सामर्थ्य’
  alternative: शैतान के कामों को जीतने की शक्ति
  rationale: κατακυριεύω के अधिकार/वश में करने वाले अर्थ को रखा गया है, बिना शैतान पर निरपेक्ष या स्वतंत्र मानवीय सार्वभौमता का दावा जोड़े।
- issue: पश्चात्ताप, धार्मिक आचरण और चंगाई का संबंध
  choice: मूल की शर्तात्मक रचना ज्यों की त्यों रखी गई
  alternative: इसे केवल अनुग्रह या केवल कर्म के सिद्धान्त की भाषा में पुनर्व्याख्यायित करना
  rationale: पाठ हृदय से फिरने, धार्मिकता करने और सेवा करने को आगामी चंगाई तथा सामर्थ्य से जोड़ता है। किसी संप्रदायगत व्यवस्था द्वारा इस तनाव को हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। संबोधन बहुवचन समूह के लिए स्वाभाविक हिन्दी में ‘तुम’ रखा गया है। वाक्य की लंबी यूनानी शर्तात्मक संरचना को पठनीयता हेतु दो वाक्यों में बाँटा गया, पर तर्क-संबंध सुरक्षित है। मरे हुए व्यक्ति की ‘नसों’ का तीखा उपमान मूल के अनुसार बनाए रखा गया है।
