translation:
  language: hi
  text: उसने कहा, “तुम उनका पालन करोगे, यदि तुम अपने नगर की ओर मुड़ो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξεις
  choice: तुम उनका पालन करोगे
  rationale: क्रिया का निहित कर्म निकटवर्ती ‘आज्ञाएँ’ हैं; हिन्दी में अर्थ स्पष्ट और स्वाभाविक रखने के लिए ‘उनका’ जोड़ा गया है।
- source_word: ἐὰν ἡ κάμψαι
  choice: यदि तुम्हारा झुकाव ... की ओर हो
  rationale: स्रोत-पाठ यहाँ व्याकरणतः दूषित या OCR-प्रभावित प्रतीत होता है। κάμψαι के मूल ‘झुकना/मोड़ना’ को सुरक्षित रखते हुए संभावित आशय व्यक्त किया गया है, बिना इसे अधिक निश्चित बनाने के।
- source_word: εἰς τὴν ἰδίαν πόλιν
  choice: अपने नगर की ओर
  rationale: ἰδίαν का आत्मवाचक संबंध और εἰς की दिशात्मकता सीधे रूप में रखी गई है; आगामी दृष्टान्त में ‘अपना नगर’ विश्वासी की वास्तविक मातृभूमि का बिंब है।
- source_word: φησίν
  choice: उसने कहा
  rationale: वार्तालाप के कथावाचक संकेत को आधुनिक मानक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘अपने नगर’ की पहचान
  choice: रूपक को ‘अपने नगर’ ही रखा गया
  alternative: इसे स्पष्ट करके ‘स्वर्गीय नगर’ या ‘परमेश्वर का नगर’ कहना
  rationale: यूनानी इस पद में नगर की पहचान स्पष्ट नहीं करता; धार्मिक व्याख्या को अनुवाद में आरोपित न करके मूल रूपक और उसकी साहित्यिक अस्पष्टता सुरक्षित रखी गई है।
- issue: आज्ञापालन की शर्त का स्वरूप
  choice: ‘यदि तुम्हारा झुकाव ... की ओर हो’
  alternative: ‘यदि तुम अपने नगर लौट जाओ’
  rationale: वापसी का विचार संदर्भ से संभव है, पर उपलब्ध यूनानी में κάμψαι ‘झुकने/मोड़ने’ की भाषा रखता है; इसलिए अधिक व्याख्यात्मक ‘लौट जाओ’ से बचा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। स्रोत-पाठ के खंडित/दूषित होने के कारण वाक्य को अत्यधिक सुधारने के बजाय उसके संभावित दिशात्मक बिंब को सुरक्षित रखा गया है।
