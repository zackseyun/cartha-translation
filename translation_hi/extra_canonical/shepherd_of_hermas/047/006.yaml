  text: Foolish, double‑minded, and wretched man, do you not understand that all these things are alien, and are under the authority of another? For the lord of this city will say, ‘I do not want you to dwell in my city; rather, go out from this city, because you do not make use of my laws.’ So then, you—having fields and dwellings and many other possessions—when you are cast out by him, what will you do with your field and your house, and the rest of the things you have prepared for yourself? For the lord of this land says to you, rightly, ‘Either make use of my laws, or withdraw from my land.’ So then, what are you about to do, having…
translation:
  language: hi
  text: हे मूर्ख, दो-मन वाले और दयनीय मनुष्य! क्या तू नहीं समझता कि ये सब वस्तुएँ पराई हैं और किसी दूसरे के अधिकार में हैं? क्योंकि इस नगर का स्वामी कहेगा, ‘मैं नहीं चाहता कि तू मेरे नगर में रहे। इस नगर से निकल जा, क्योंकि तू मेरे नियमों के अनुसार नहीं चलता।’ इसलिए, तेरे पास खेत, घर और बहुत-सी दूसरी संपत्तियाँ हैं; जब वह तुझे निकाल देगा, तब तू अपने खेत, अपने घर और उन बाकी सब वस्तुओं का क्या करेगा जिन्हें तूने अपने लिए जुटाया है? क्योंकि इस देश का स्वामी तुझसे उचित ही कहता है, ‘या तो मेरे नियमों के अनुसार चल, या मेरे देश से निकल जा।’ इसलिए, अब तू क्या करने वाला है, जबकि तेरे पास…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी पाठ और यह पाठ-खंड यहाँ वाक्य के बीच में टूट जाते हैं; अगला अंश बात को आगे बढ़ाता है।
    reason: पाठक को अंतिम अधूरे वाक्य और दीर्घविराम का कारण बताना आवश्यक है।
lexical_decisions:
- source_word: ἄφρον
  choice: मूर्ख
  rationale: यह संबोधन बुद्धि और समझ की कमी को सीधे व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δίψυχε
  choice: दुविधाग्रस्त
  rationale: शाब्दिक अर्थ ‘दो मन वाला’ है; ‘दुविधाग्रस्त’ आंतरिक अनिर्णय और विभाजित निष्ठा का भाव बिना अनावश्यक व्याख्या के पहुँचाता है।
- source_word: ἀλλότριά
  choice: पराई
  rationale: वस्तुओं के वास्तव में संबोधित व्यक्ति की न होने और दूसरे के स्वामित्व में होने का भाव बनाए रखता है।
- source_word: ὑπ᾽ ἐξουσίαν ἑτέρου
  choice: किसी दूसरे के अधिकार में
  rationale: ἐξουσία का अधिकार/नियंत्रण संबंधी अर्थ स्पष्ट और औपचारिक रूप से व्यक्त होता है।
- source_word: τοῖς νόμοις μου οὐ χρᾶσαι / χρῶ
  choice: मेरे नियमों के अनुसार नहीं चलता / मेरे नियमों के अनुसार चल
  rationale: यूनानी में शाब्दिक रूप से नियमों का ‘उपयोग करना’ है, पर नगर-निवासी के संदर्भ में आशय उन नियमों के अधीन आचरण करना है; हिन्दी में यह स्वाभाविक समतुल्य है।
- source_word: ὑπάρξεις
  choice: संपत्तियाँ
  rationale: भूमि और निवास से अलग अन्य भौतिक मिल्कियतों के लिए व्यापक और सहज शब्द।
- source_word: ἐκχώρει
  choice: निकल जा
  rationale: देश/क्षेत्र छोड़ देने की आज्ञा को सीधे और समानांतर ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘दुविधाग्रस्त’ व्यक्ति की नैतिक या धार्मिक स्थिति
  choice: शब्द को आंतरिक विभाजन के सामान्य अर्थ में रखा गया
  alternative: इसे विशेष रूप से ‘अविश्वासी’ या ‘दोहरी निष्ठा वाला’ कहना
  rationale: मूल δίψυχος विभाजित मन का संकेत देता है, पर यहाँ किसी विशिष्ट सांप्रदायिक या व्यवस्थित धर्मवैज्ञानिक अर्थ को स्पष्ट नहीं करता।
- issue: नगर और देश के स्वामी की पहचान
  choice: रूपक में केवल ‘स्वामी’ कहा गया
  alternative: उसे सीधे परमेश्वर या सांसारिक शासक के रूप में पहचानना
  rationale: इस अंश में रूपक की पहचान को खुला रखना मूल की साहित्यिक और धर्मवैज्ञानिक तनावशीलता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। एकवचन संबोधन में ‘तू/तेरे’ रखा गया है, क्योंकि यूनानी संबोधन तीखा और प्रत्यक्ष है; इससे मूल की फटकार की शक्ति बनी रहती है। नगर, देश, खेत, घर और संपत्ति के रूपक को बिना धर्मवैज्ञानिक विस्तार जोड़े सुरक्षित रखा गया है।
