base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/004.yaml
  text: I say to him, “Lord, now I have been strengthened in all the righteous requirements of the Lord, because you are with me; and I know that you will cut off all the devil’s power, and we shall gain mastery over him and prevail against all his works. And I hope, Lord, that now I can keep these commandments that you have commanded, with the Lord strengthening me.”
translation:
  language: hi
  text: मैं उससे कहता हूँ, “प्रभु, अब मैं प्रभु की सभी धर्मसंगत अपेक्षाओं में दृढ़ हुआ हूँ, क्योंकि आप मेरे साथ हैं। और मैं जानता हूँ कि आप शैतान की सारी शक्ति को चूर कर देंगे; और हम उस पर वर्चस्व प्राप्त करेंगे और उसके सभी कामों पर विजयी होंगे। प्रभु, मुझे आशा है कि अब, प्रभु से सामर्थ्य पाकर, मैं इन आज्ञाओं का पालन कर सकूँगा, जो आपने दी हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιώμασι
  choice: धार्मिक विधानों
  rationale: यह बहुवचन शब्द यहाँ प्रभु की धर्मसंगत अपेक्षाओं या ठहराए हुए नियमों को सूचित करता है; ‘धार्मिक विधानों’ से आज्ञाओं के नैतिक और विधिक दोनों पक्ष बने रहते हैं।
- source_word: συγκόψεις
  choice: चूर कर देंगे
  rationale: क्रिया का मूल भाव काटकर या प्रहार करके शक्ति नष्ट करना है; संदर्भ में ‘चूर कर देंगे’ शैतान की शक्ति को निर्णायक रूप से तोड़ने का स्वाभाविक हिन्दी रूप है।
- source_word: κατακυριεύσομεν
  choice: प्रभुता पाएँगे
  rationale: शब्द का अर्थ किसी पर अधिकार या वर्चस्व प्राप्त करना है; इससे अगले κατισχύσομεν के ‘विजय प्राप्त करेंगे’ से भेद बना रहता है।
- source_word: κατισχύσομεν
  choice: विजय प्राप्त करेंगे
  rationale: यह बलवान सिद्ध होने, परास्त करने या प्रबल होने का भाव देता है; ‘विजय प्राप्त करेंगे’ सहज और संदर्भानुकूल है।
- source_word: φυλάξαι
  choice: पालन कर सकता हूँ
  rationale: आज्ञाओं के संदर्भ में φυλάσσω का अर्थ उन्हें मानना और सुरक्षित रूप से थामे रखना है; आधुनिक हिन्दी में ‘पालन करना’ सर्वाधिक स्वाभाविक है।
theological_decisions:
- issue: वक्ता की सामर्थ्य और प्रभु की सहायता का संबंध
  choice: 'अंतिम कृदंत को कारणसूचक रूप में रखा: ‘क्योंकि प्रभु मुझे सामर्थ्य देते हैं’'
  alternative: ‘प्रभु के सामर्थ्य देने पर’ या ‘प्रभु द्वारा सामर्थी किए जाते हुए’
  rationale: ग्रीक τοῦ Κυρίου ἐνδυναμοῦντος वक्ता की क्षमता को प्रभु की सक्रिय सहायता पर निर्भर बताता है; अनुवाद इसे मानवीय आत्मनिर्भरता नहीं बनने देता।
- issue: συγκόψεις τὴν δύναμιν की छवि
  choice: ‘शैतान की सारी शक्ति को चूर कर देंगे’
  alternative: ‘शैतान की सारी शक्ति काट डालेंगे’
  rationale: शाब्दिक काटने की छवि हिन्दी में शक्ति के साथ असहज है; ‘चूर करना’ शक्ति को पूरी तरह तोड़ने का तनाव बनाए रखता है, बिना किसी विशेष दार्शनिक या सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रत्यक्ष संवाद रखा गया है। संबोधन में सम्मानसूचक ‘आप’ अपनाया गया है। मूल की दो समानांतर विजय-क्रियाओं को ‘प्रभुता पाएँगे’ और ‘विजय प्राप्त करेंगे’ के रूप में अलग रखा गया है।
