base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/004.yaml
  text: '"You shall keep these things thus—you, with your children and your whole household; and having kept them you will be blessed; and as many as, having heard them, keep them will be blessed, and they will receive understanding from the Lord."'
translation:
  language: hi
  text: “तुम अपनी संतानों और अपने सारे घराने के साथ इन बातों का इसी तरह पालन करना। इनका पालन करने पर तुम धन्य होगे। और जितने लोग इन्हें सुनकर इनका पालन करेंगे, वे भी धन्य होंगे और प्रभु से समझ प्राप्त करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρήσεις / τηρήσας / τηρήσωσι
  choice: पालन करना / पालन करने पर / पालन करेंगे
  rationale: यहाँ क्रिया का अर्थ केवल याद रखना नहीं, बल्कि दिए गए निर्देशों को मानना और उन पर चलना है; हिंदी में ‘पालन करना’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τέκνων
  choice: संतानों
  rationale: यह बहुवचन शब्द पुत्र-पुत्रियों दोनों को समेट सकता है; ‘संतानों’ से वही समावेशी अर्थ बना रहता है।
- source_word: ὅλου τοῦ οἴκου
  choice: सारे घराने
  rationale: οἶκος यहाँ केवल भवन नहीं, पूरे गृह-समुदाय या परिवार को दर्शाता है; ‘घराने’ से इसका सामूहिक विस्तार सुरक्षित रहता है।
- source_word: μακάριος / μακάριοι
  choice: धन्य
  rationale: यह धार्मिक-साहित्यिक संदर्भ में ईश्वर की कृपा से प्राप्त कल्याण और सौभाग्य को व्यक्त करता है; ‘धन्य’ प्रतिष्ठित तथा बोधगम्य हिंदी विकल्प है।
- source_word: σύνεσιν
  choice: समझ
  rationale: शब्द का आशय बोध या विवेकपूर्ण समझ से है; ‘समझ’ सामान्य पाठक के लिए सहज है और अनावश्यक दार्शनिक विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: निर्देशों के पालन, धन्यता और प्रभु से मिलने वाली समझ का संबंध
  choice: मूल पाठ के क्रम में पालन के बाद धन्य होने और प्रभु से समझ पाने की बात रखी गई है
  alternative: इसे बिना शर्त प्रतिज्ञा या उद्धार-सिद्धांत के रूप में विस्तार देना
  rationale: ग्रीक पाठ व्यवहार, धन्यता और समझ के संबंध को बताता है, पर उसका विस्तृत धर्मवैज्ञानिक तंत्र स्पष्ट नहीं करता; इसलिए अनुवाद उसी कथन तक सीमित है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आज्ञात्मक वाक्य में ‘करना’ का प्रयोग सहज हिंदी निर्देश-शैली देता है। समानांतर संरचना और ‘वे भी’ से दूसरे समूह पर लागू वही धन्यता स्पष्ट होती है।
