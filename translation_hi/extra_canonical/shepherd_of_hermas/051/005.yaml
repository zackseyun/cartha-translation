base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/005.yaml
  text: I say to him, "Sir, since I have you with me, I must ask you and question you; for you show me everything and speak with me. But if apart from you I were seeing or hearing these things, I would ask the Lord that it might be made clear to me."
translation:
  language: hi
  text: मैं उससे कहता हूँ, “स्वामी, मैं आपको अपने साथ पाकर आपसे विनती करने और प्रश्न पूछने को बाध्य हूँ; क्योंकि आप मुझे सब कुछ दिखाते हैं और मुझसे बात करते हैं। पर यदि मैं आपके बिना ये बातें देखता या सुनता, तो मैं प्रभु से विनती करता कि वे मुझ पर प्रकट हो जाएँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: स्वामी
  rationale: यहाँ संबोधन उस व्याख्या देने वाले पात्र से है; ‘स्वामी’ आदरपूर्ण है और आगे आने वाले ‘प्रभु’ (τὸν Κύριον) से आवश्यक भेद बनाए रखता है।
- source_word: ἀνάγκην ἔχω
  choice: मुझे … आवश्यकता है
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप, जो वक्ता की विवशता अथवा प्रबल आवश्यकता को व्यक्त करता है।
- source_word: αἰτεῖσθαι καὶ ἐπερωτᾶν
  choice: विनती करने और प्रश्न पूछने
  rationale: 'दोनों समन्वित क्रियाओं का भेद सुरक्षित रखा गया है: पहली अनुरोध करने और दूसरी पूछताछ करने को दर्शाती है।'
- source_word: ἄτερ σοῦ
  choice: आपके बिना
  rationale: ‘आपसे अलग’ की तुलना में आधुनिक हिन्दी में अधिक सहज, जबकि आशय अक्षुण्ण रहता है।
- source_word: δηλωθῇ
  choice: स्पष्ट कर दी जाएँ
  rationale: निष्क्रिय विधिलिंग का अर्थ बनाए रखता है और यह खुला छोड़ता है कि स्पष्टीकरण किस माध्यम से मिलेगा।
theological_decisions:
- issue: Κύριε के दो संदर्भ
  choice: व्याख्याकार के लिए ‘स्वामी’ और परमेश्वर के लिए ‘प्रभु’
  alternative: दोनों स्थानों पर ‘प्रभु’
  rationale: एक ही यूनानी शब्द होने पर भी प्रसंग में संबोधित पात्र और परम प्रभु अलग हैं; हिन्दी में भेद करने से संदर्भ स्पष्ट होता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक पहचान आरोपित किए।
- issue: ἵνα μοι δηλωθῇ में कर्ता का अनुल्लेख
  choice: ‘कि वे मुझे स्पष्ट कर दी जाएँ’
  alternative: ‘कि प्रभु मुझे उनका अर्थ समझा दें’
  rationale: यूनानी निष्क्रिय रचना प्रत्यक्ष कर्ता और स्पष्टीकरण की ठीक प्रकृति को अनकहा रखती है; अनुवाद उसी अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरपूर्ण, सहज और गरिमापूर्ण संवादात्मक रूप अपनाया गया है। पात्र के लिए सर्वनाम ‘आप’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं है।
