  text: He says, "I will explain everything to you, and whatever I speak with you I will show you. The one who has received the commands of prudence will fill his own soul and will pray to the Lord on your behalf.
translation:
  language: hi
  text: वह कहता है, “मैं तुम्हें सब कुछ समझाऊँगा, और जिन बातों के बारे में मैं तुमसे बात करूँगा, वे मैं तुम्हें दिखाऊँगा। जिसने विवेक की आज्ञाएँ पाई हैं, वह अपनी आत्मा को भर लेगा और तुम्हारे लिए प्रभु से प्रार्थना करेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλύσω
  choice: समझाऊँगा
  rationale: यहाँ क्रिया का अर्थ दृष्टान्तों की गाँठ खोलना या उनका अर्थ स्पष्ट करना है; सामान्य हिन्दी में ‘समझाऊँगा’ स्वाभाविक और सटीक है।
- source_word: δείξω
  choice: दिखाऊँगा
  rationale: मूल के ‘दिखाना/प्रकट करना’ भाव को बनाए रखता है और पिछले ‘समझाऊँगा’ से भेद भी सुरक्षित रखता है।
- source_word: φροσύνης
  choice: विवेक
  rationale: यह शब्द समझ-बूझ और व्यावहारिक बुद्धिमत्ता का बोध कराता है; ‘विवेक’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: ἐμπλήσῃ τὴν ἑαυτοῦ ψυχὴν
  choice: अपनी आत्मा को भर ले
  rationale: मूल की रूपकात्मक अभिव्यक्ति को बिना अनकहे पूरक या व्याख्या जोड़े सुरक्षित रखा गया है।
- source_word: εὔξηται ὑπὲρ σοῦ πρὸς τὸν Κύριον
  choice: तुम्हारे लिए प्रभु से प्रार्थना करे
  rationale: ὑπὲρ σοῦ मध्यस्थ प्रार्थना का भाव देता है; πρὸς τὸν Κύριον को स्वाभाविक हिन्दी में ‘प्रभु से’ व्यक्त किया गया है।
theological_decisions:
- issue: आत्मा को भरने की वस्तु मूल पाठ में स्पष्ट नहीं है
  choice: ‘अपनी आत्मा को भर ले’ के रूप में अपूर्ण रूपक को बनाए रखा
  alternative: ‘इन आज्ञाओं से अपनी आत्मा को भर ले’
  rationale: वस्तु जोड़ने से अर्थ सहज होता, पर मूल में वह स्पष्ट रूप से नहीं दी गई; इसलिए वास्तविक अस्पष्टता को नहीं सुलझाया गया।
- issue: प्रार्थना का संबोधन और लाभार्थी
  choice: ‘तुम्हारे लिए प्रभु से प्रार्थना करे’
  alternative: ‘तुम्हारी ओर से प्रभु के सामने प्रार्थना करे’
  rationale: यह अनुवाद मध्यस्थता का भाव रखता है, पर कोई अतिरिक्त धार्मिक तंत्र या सांप्रदायिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संवादात्मक किंतु गरिमापूर्ण शैली। ‘वह कहता है’ से यूनानी ऐतिहासिक वर्तमान सुरक्षित रखा गया है। स्रोत-पाठ के दूसरे वाक्य की असामान्य और कुछ हद तक संदिग्ध बनावट को सहज बनाने के लिए कोई अप्रकट विषय-वस्तु नहीं जोड़ी गई।
