  text: '"If, then, you complete the fast in this way as I commanded you, your sacrifice will be acceptable before God, and this fast will be recorded; and the service performed in this way is good and cheerful and acceptable to the Lord.'
translation:
  language: hi
  text: इसलिए, यदि तुम उपवास को इस प्रकार पूरा करोगे, जैसा मैंने तुम्हें आज्ञा दी थी, तो तुम्हारा बलिदान परमेश्वर को ग्रहणयोग्य होगा, और यह उपवास लेखे में दर्ज किया जाएगा। इस प्रकार की गई सेवा अच्छी, हर्षपूर्ण और प्रभु को स्वीकार्य है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσῃς τὴν νηστείαν
  choice: उपवास को ... पूरा करोगे
  rationale: τελέω यहाँ बताई गई रीति के अनुसार उपवास को विधिवत पूरा करने का भाव देता है।
- source_word: θυσία
  choice: बलिदान
  rationale: धार्मिक अर्पण के स्पष्ट अर्थ को बनाए रखता है और उपवास से उसके संबंध को अनावश्यक रूप से नहीं समझाता।
- source_word: δεκτὴ παρὰ τῷ Θεῷ
  choice: परमेश्वर के सामने ग्रहणयोग्य
  rationale: मूल में परमेश्वर की उपस्थिति/दृष्टि में स्वीकृति का भाव है; यह औपचारिक और स्वाभाविक हिन्दी है।
- source_word: ἔγγραφος
  choice: लेखे में दर्ज
  rationale: शाब्दिक अर्थ 'लिखित/अभिलिखित' है; प्रसंग में उपवास के मान्य रूप से दर्ज होने का संकेत सुरक्षित रहता है।
- source_word: λειτουργία
  choice: सेवा
  rationale: यहाँ धार्मिक सेवा या सेवाकार्य का व्यापक अर्थ है; 'उपासना-विधि' कहना मूल की संभावित व्यापकता को सीमित कर देता।
- source_word: ἱλαρά
  choice: आनंदपूर्ण
  rationale: हर्षित और प्रसन्न भाव से की गई सेवा को व्यक्त करता है; केवल 'प्रसन्नतापूर्वक' करने की क्रियाविशेषणीय व्याख्या से बचता है।
- source_word: εὐπρόσδεκτος τῷ Κυρίῳ
  choice: प्रभु को स्वीकार्य
  rationale: परमेश्वर द्वारा अनुकूलतापूर्वक ग्रहण किए जाने का सीधा अर्थ देता है।
theological_decisions:
- issue: उपवास, बलिदान और ईश्वरीय स्वीकृति का संबंध
  choice: 'मूल के शर्तात्मक कथन को ज्यों का त्यों रखा गया: बताई गई रीति से उपवास पूरा करने पर बलिदान ग्रहणयोग्य होगा।'
  alternative: इसे उद्धार कमाने या केवल प्रतीकात्मक भक्ति के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ ऐसी कोई व्यवस्थित धर्मवैज्ञानिक व्याख्या नहीं देता; इसलिए उसके तनाव और प्रत्यक्ष दावे को बनाए रखा गया।
- issue: ἔγγραφος में स्वर्गीय लेखे की धारणा
  choice: ‘लेखे में दर्ज’ कहा गया, पर यह नहीं बताया कि लेखा कहाँ या किस प्रकार का है।
  alternative: ‘स्वर्ग में दर्ज’ अथवा केवल ‘मान्य माना जाएगा’।
  rationale: मूल में दर्ज होने का विचार है, लेकिन स्थान और तंत्र निर्दिष्ट नहीं हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। संबोधन एकवचन ‘तुम’ रखा गया है, क्योंकि यूनानी क्रियाएँ एकवचन हैं। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए अंतिम समन्वित खंड को अलग वाक्य किया गया है।
