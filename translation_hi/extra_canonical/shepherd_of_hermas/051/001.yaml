  text: I say, "Sir, I do not know these parables, nor am I able to understand them unless you explain them to me."
translation:
  language: hi
  text: मैंने कहा, “स्वामी, मैं इन दृष्टान्तों का अर्थ नहीं जानता और न इन्हें समझ सकता हूँ, जब तक कि आप मुझे इनका अर्थ न समझाएँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: स्वामी
  rationale: संबोधित व्यक्ति के प्रति आदर और अधिकार को व्यक्त करता है; इस प्रसंग में इसे अनिवार्य रूप से परमेश्वर के लिए प्रयुक्त ‘प्रभु’ मानना उचित नहीं।
- source_word: παραβολὰς
  choice: दृष्टान्तों
  rationale: παραβολή के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्द, जो उपमा-कथा अथवा सांकेतिक शिक्षण दोनों को समेटता है।
- source_word: οὐ γινώσκω
  choice: अर्थ नहीं जानता
  rationale: सिर्फ तथ्यात्मक ‘नहीं जानता’ की अपेक्षा प्रसंग में दृष्टान्तों का आशय न जानने का भाव स्पष्ट करता है।
- source_word: νοῆσαι
  choice: समझ सकता हूँ
  rationale: मन से ग्रहण करने या बोध पाने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπιλύσῃς
  choice: अर्थ न समझाएँ
  rationale: यहाँ क्रिया का अर्थ कठिन या सांकेतिक कथन की व्याख्या खोलकर बताना है; ‘सुलझाएँ’ की तुलना में यह हिन्दी में अधिक सहज है।
theological_decisions:
- issue: Κύριε से संबोधित व्यक्ति की पहचान
  choice: स्वामी
  alternative: प्रभु
  rationale: मूल शब्द आदरसूचक संबोधन भी हो सकता है। ‘स्वामी’ पात्र की दिव्य पहचान को अनावश्यक रूप से निश्चित किए बिना मूल की गुंजाइश बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवादात्मक किंतु गरिमापूर्ण शैली। मूल वाक्य की दोहरी असमर्थता—न जानना और न समझ पाना—सुरक्षित रखी गई है।
