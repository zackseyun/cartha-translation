base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/004.yaml
  text: The angel who had given the rods to the people again demanded them back from them; and as they had received them, so too they were called to him, and each one returned the rods. The angel of the Lord took them and examined them.
translation:
  language: hi
  text: जिस स्वर्गदूत ने लोगों को छड़ियाँ दी थीं, उसने उनसे वे फिर वापस माँगीं। और जैसे उन्होंने उन्हें पाया था, वैसे ही उन्हें उसके पास बुलाया गया; हर एक ने अपनी छड़ी लौटा दी। प्रभु का स्वर्गदूत उन्हें लेता और उनका ध्यान से निरीक्षण करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: छड़ियाँ
  rationale: दृश्य में विलो की काटी हुई छोटी शाखाएँ बाँटी गई हैं; ‘छड़ियाँ’ उनके आकार और प्रतीकात्मक उपयोग को सहज हिन्दी में व्यक्त करता है।
- source_word: πάλιν ἀπῄτει ἀπ᾽ αὐτῶν
  choice: उसने उनसे वे फिर वापस माँगीं
  rationale: πάλιν और ἀπαιτέω दोनों के भाव को रखते हुए स्वाभाविक हिन्दी में पुनः लौटाने की माँग व्यक्त की गई है।
- source_word: καθὼς ἔλαβον, οὕτω καὶ ἐκαλοῦντο
  choice: जिस क्रम में उन्होंने उन्हें लिया था, उसी क्रम में उन्हें उसके पास बुलाया गया
  rationale: शाब्दिक यूनानी में तुलना का आधार कुछ अस्पष्ट है; प्रसंगानुसार यह लोगों के बुलाए जाने के क्रम की ओर संकेत करता है, इसलिए अर्थ को स्पष्ट किंतु संयमित ढंग से रखा गया है।
- source_word: κατενόει
  choice: ध्यान से जाँचता गया
  rationale: क्रिया सावधानी से देखने या निरीक्षण करने का भाव देती है; अपूर्णकाल की क्रमिक क्रिया ‘जाँचता गया’ से व्यक्त हुई है।
theological_decisions:
- issue: ὁ ἄγγελος τοῦ Κυρίου की पहचान
  choice: प्रभु का स्वर्गदूत
  alternative: प्रभु का दूत
  rationale: यहाँ पात्र स्पष्ट रूप से स्वर्गदूत है; किसी विशिष्ट ईश्वरीय या मसीही पहचान को आरोपित किए बिना पारंपरिक और प्रसंगानुकूल पद रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल के पुनरावर्तन को जहाँ अर्थपूर्ण है वहाँ रखा गया है, पर हिन्दी वाक्य-विन्यास को स्वाभाविक बनाया गया है।
