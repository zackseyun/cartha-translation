base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/001.yaml
  text: …with their whole heart. So then, do you suppose that the sins of those who are repenting are immediately forgiven? Not entirely. Rather, the one who repents must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one repenting clean from everything.
translation:
  language: hi
  text: …अपने पूरे हृदय से। तो क्या तुम समझते हो कि पश्चात्ताप करनेवालों के पाप तुरंत क्षमा कर दिए जाते हैं? पूरी तरह नहीं। बल्कि पश्चात्ताप करनेवाले को अपनी आत्मा को कष्ट देना चाहिए, अपने हर काम में पूरी दृढ़ता से दीन बने रहना चाहिए और हर तरह के क्लेशों में पीड़ित होना चाहिए। यदि वह अपने ऊपर आनेवाले क्लेशों को सह लेता है, तो वह, जिसने सब कुछ रचा और सबको सुदृढ़ किया, निश्चय ही करुणा से भर जाएगा और कुछ चंगाई देगा। और ऐसा तब होगा, जब [परमेश्वर][a] पश्चात्ताप करनेवाले के हृदय को हर बात से शुद्ध देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर’ शब्द यूनानी पाठ में संपादकीय रूप से जोड़ा गया है।
    reason: स्रोत संस्करण में ὁ Θεός को कोष्ठकों में रखा गया है, इसलिए पाठक को इस पाठगत तथ्य से अवगत कराना आवश्यक है।
lexical_decisions:
- source_word: μετανοούντων / μετανοοῦντα / μετανοοῦντος
  choice: पश्चात्ताप करनेवालों / पश्चात्ताप करनेवाले
  rationale: यह वर्तमान कृदंत लगातार चल रहे पश्चात्ताप को दर्शाता है; हिन्दी में यह रूप स्वाभाविक है और प्रक्रिया का भाव बनाए रखता है।
- source_word: βασανίσαι τὴν ἑαυτοῦ ψυχήν
  choice: अपनी आत्मा को कष्ट देना
  rationale: βασανίζω के कठोर आत्मपीड़न-संबंधी भाव को नरम किए बिना सीधी और समझने योग्य हिन्दी में रखा गया है।
- source_word: ταπεινοφρονῆσαι
  choice: दीन बने रहना
  rationale: यह मन की नम्रता और आचरण में दीनता दोनों का बोध देता है; केवल बाहरी विनय तक अर्थ सीमित नहीं करता।
- source_word: θλίψεις
  choice: क्लेश
  rationale: यह दबाव, दुःख और विपत्ति के व्यापक अर्थ को समेटनेवाला प्रतिष्ठित किंतु सहज हिन्दी शब्द है।
- source_word: σπλαγχνισθήσεται
  choice: करुणा से भर जाएगा
  rationale: मूल क्रिया गहरे आंतरिक करुणाभाव को व्यक्त करती है; यह हिन्दी वाक्यांश उसी तीव्रता को स्वाभाविक ढंग से देता है।
- source_word: ἴασίν τινα
  choice: कुछ चंगाई
  rationale: τινα की अनिश्चितता को ‘कुछ’ से सुरक्षित रखा गया है; पाठ जितना कहता है उससे अधिक पूर्ण या निश्चित चंगाई नहीं जोड़ी गई।
theological_decisions:
- issue: पश्चात्ताप, क्लेश सहने और क्षमा/चंगाई के बीच संबंध
  choice: मूल की शर्तात्मक और तनावपूर्ण भाषा को ज्यों का त्यों रखा गया है।
  alternative: इसे केवल पश्चात्ताप की सच्चाई के प्रमाण या पहले से मिली क्षमा के परिणाम के रूप में समझाकर अनुवाद करना।
  rationale: यूनानी पाठ स्वयं कहता है कि पाप ‘पूरी तरह’ तुरंत क्षमा नहीं होते और आगे क्लेश सहने पर करुणा तथा चंगाई की बात करता है; किसी विशेष धर्मसैद्धांतिक व्यवस्था से इस तनाव को हल नहीं किया गया।
- issue: ὁ Θεός की पाठगत स्थिति
  choice: ‘परमेश्वर’ को कोष्ठकों में रखते हुए उस पर पादटिप्पणी चिह्न लगाया गया है।
  alternative: कोष्ठक हटाकर इसे निर्विवाद मूल पाठ की तरह प्रस्तुत करना, या इसे पूरी तरह छोड़ देना।
  rationale: प्रदत्त यूनानी संस्करण में ὁ Θεός संपादकीय कोष्ठकों में है; हिन्दी में वाक्य की पहचान स्पष्ट रखते हुए उसकी पाठगत अनिश्चितता दिखाई गई है।
- issue: सबको सामर्थ्य देनेवाले सृष्टिकर्ता का उल्लेख
  choice: ‘जिसने सब कुछ रचा और सबको सामर्थ्य दी’
  alternative: ‘जिसने सब कुछ रचा और दृढ़ किया’
  rationale: ἐνδυναμόω सामान्यतः सामर्थ्य देने का अर्थ रखता है। सर्वनामगत संदर्भ कुछ संक्षिप्त है, इसलिए सृष्टि के सभी प्राणियों/वस्तुओं की ओर संकेत करनेवाला व्यापक रूप चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘पश्चात्ताप’, ‘क्लेश’ और ‘चंगाई’ जैसे परिचित धार्मिक शब्दों के साथ वाक्यरचना को स्वाभाविक बनाया गया है। आरंभिक दीर्घविराम यह दिखाता है कि इकाई पिछले वाक्य के अंत से शुरू होती है।
