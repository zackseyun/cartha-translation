  revised_text: प्रभु के स्वर्गदूत ने कुछ लोगों से छड़ियाँ सूखी हुई और ऐसी खाई हुई पाईं, मानो उन्हें कीड़े ने खा लिया हो। उसने ऐसी छड़ियाँ लौटानेवालों को अलग खड़े होने की आज्ञा दी। दूसरों ने सूखी छड़ियाँ लौटाईं, पर उन्हें कीड़े ने नहीं खाया था; उसने उन्हें भी अलग खड़े होने की आज्ञा दी। दूसरों ने आधी सूखी छड़ियाँ लौटाईं; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ आधी सूखी और दरारों वाली लौटाईं; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ हरी, पर दरारों वाली लौटाईं; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ आधी सूखी और आधी हरी लौटाईं; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ इस दशा में प्रस्तुत कीं कि उनके दो भाग हरे और तीसरा भाग सूखा था; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ लौटाईं जिनके दो भाग सूखे और तीसरा भाग हरा था; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ लगभग पूरी तरह हरी लौटाईं; केवल उनका बहुत थोड़ा-सा भाग—ठीक सिरा—सूखा था, और उनमें दरारें भी थीं; वे भी अलग खड़े हो गए।
