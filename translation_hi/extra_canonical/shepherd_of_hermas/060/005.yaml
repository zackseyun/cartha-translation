  text: From some he received the rods dry and eaten as if by a moth; the angel ordered those who had handed in such rods to stand apart. Others handed in dry rods, but they had not been eaten by a moth; these too he ordered to stand apart. Others handed in rods half-dry; and these stood apart. Others handed in their rods half-dry and having splits; and these stood apart. Others handed in their rods green and having splits; and these stood apart. Others handed in their rods half dry and half green; and these stood apart. Others presented their rods with two parts of the rod green and the third part dry; and these stood apart. Others handed in two parts dry and the third part green; and these stood apart. Others handed in their rods almost entirely green, but a very little of their rods was dry—at the very tip; and they had splits in them; and these stood apart.
translation:
  language: hi
  text: प्रभु के स्वर्गदूत ने कुछ लोगों से छड़ियाँ सूखी हुई और ऐसी खाई हुई पाईं, मानो उन्हें कीड़े ने खा लिया हो। उसने ऐसी छड़ियाँ लौटानेवालों को अलग खड़े होने की आज्ञा दी। दूसरों ने सूखी छड़ियाँ लौटाईं, पर उन्हें कीड़े ने नहीं खाया था; उसने उन्हें भी अलग खड़े होने की आज्ञा दी। दूसरों ने आधी सूखी छड़ियाँ लौटाईं; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ आधी सूखी और दरारों वाली लौटाईं; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ हरी, पर दरारों वाली लौटाईं; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ आधी सूखी और आधी हरी लौटाईं; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ इस दशा में प्रस्तुत कीं कि उनके दो भाग हरे और तीसरा भाग सूखा था; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ लौटाईं जिनके दो भाग सूखे और तीसरा भाग हरा था; वे भी अलग खड़े हो गए। दूसरों ने अपनी छड़ियाँ लगभग पूरी तरह हरी लौटाईं; केवल उनका बहुत थोड़ा-सा भाग—ठीक सिरा—सूखा था, और उनमें दरारें भी थीं; वे भी अलग खड़े हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: छड़ियाँ
  rationale: संदर्भ में ये विलो-वृक्ष से काटी गई लगभग एक हाथ लंबी छोटी शाखाएँ हैं; ‘छड़ियाँ’ उनकी वस्तुगत और प्रतीकात्मक दोनों भूमिकाओं को सहज रूप से व्यक्त करता है।
- source_word: βεβρωμένας ὡς ὑπὸ σητός
  choice: ऐसी खाई हुई … मानो उन्हें कीड़े ने खा लिया हो
  rationale: σητός लकड़ी या वस्त्र को खानेवाले कीट के लिए प्रयुक्त हो सकता है। सामान्य हिंदी ‘कीड़ा’ मूल की अनिश्चितता बनाए रखता है और अनुपयुक्त रूप से किसी खास कीट को निश्चित नहीं करता।
- source_word: ξηράς / χλωράς
  choice: सूखी / हरी
  rationale: प्रत्यक्ष रंग और दशा के विरोध को बनाए रखा गया है; χλωρός यहाँ ताजी, जीवित या हरी छड़ी की दशा बताता है।
- source_word: σχισμάς
  choice: चीरें
  rationale: छड़ियों में फटने या दरार पड़ने की अवस्था के लिए संक्षिप्त, दृश्य और स्वाभाविक हिंदी।
- source_word: χωρὶς ἵστασθαι
  choice: अलग खड़े होना
  rationale: स्थानगत पृथक्करण का सीधा अर्थ सुरक्षित रहता है; इसमें न्यायिक या अंतिम बहिष्कार का अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: ἐπεδίδοσαν / ἀπεδίδου
  choice: लौटाईं / लौटाया
  rationale: पिछले वाक्यों में स्वर्गदूत द्वारा दी गई छड़ियों को अब वापस लेने का स्पष्ट प्रसंग है, इसलिए मात्र ‘सौंपना’ की अपेक्षा ‘लौटाना’ हिंदी में अधिक स्पष्ट है।
theological_decisions:
- issue: अलग खड़े किए जाने का अर्थ
  choice: केवल ‘अलग खड़े होने’ का वर्णन
  alternative: ‘दोषियों/अस्वीकृत लोगों में अलग खड़े होना’
  rationale: मूल पाठ इस बिंदु पर प्रतीक का नैतिक या अंतिम न्याय-संबंधी अर्थ स्पष्ट नहीं करता; व्याख्या आगे आती है। इसलिए अनुवाद ने परिणाम को पहले से निर्धारित नहीं किया।
- issue: छड़ियों की हरी और सूखी दशा का प्रतीकात्मक अर्थ
  choice: भौतिक दशा को शाब्दिक रूप में रखा
  alternative: ‘जीवित’, ‘विश्वासी’, ‘मृत’ या ‘धर्मत्यागी’ जैसे व्याख्यात्मक पद
  rationale: इस अनुच्छेद में केवल दृष्टांत का दृश्य वर्णन है। धार्मिक अर्थ आरोपित करना मूल की कथात्मक प्रगति और तनाव को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। बार-बार आनेवाली यूनानी संरचना और क्रमबद्ध वर्गीकरण को जानबूझकर बनाए रखा गया है, क्योंकि वही इस दृश्य की लय और भेदों को वहन करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
