base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/002.yaml
  text: And an angel of the Lord—exceedingly glorious and very tall—was standing beside the willow, holding a great sickle, and he was cutting off branches from the willow and handing them to the people who were being sheltered by the willow; and he kept giving them little rods, about a cubit long.
translation:
  language: hi
  text: और प्रभु का एक स्वर्गदूत—अत्यंत महिमामय और बहुत ऊँचा—बेद (विलो) के पेड़ के पास खड़ा था; उसके हाथ में एक बड़ा हँसिया था, और वह बेद के पेड़ से डालियाँ काटकर उन लोगों को दे रहा था जो उसके नीचे आश्रय लिए हुए थे; और वह उन्हें लगभग एक हाथ¹ लंबी छोटी छड़ियाँ दे रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος τοῦ Κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: ἄγγελος के धार्मिक संदर्भ को स्पष्ट रखते हुए अनिश्चित पदबंध को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἰτέαν
  choice: बेंत का पेड़
  rationale: ἰτέα सामान्यतः willow को सूचित करता है; हिन्दी पाठक के लिए पेड़ का स्वरूप स्पष्ट करने हेतु ‘बेंत का पेड़’ चुना गया।
- source_word: δρέπανον
  choice: हँसिया
  rationale: डालियाँ काटने वाले वक्र धारदार औज़ार के लिए स्वाभाविक हिन्दी शब्द।
- source_word: κλάδους
  choice: डालियाँ
  rationale: पेड़ से काटी जाने वाली branches के लिए सहज आधुनिक हिन्दी।
- source_word: σκεπαζομένῳ ὑπὸ τῆς ἰτέας
  choice: जो उसकी छाया में थे
  rationale: शाब्दिक अर्थ ‘पेड़ से ढके/आश्रित’ है; दृश्य के आशय को स्वाभाविक हिन्दी में प्रस्तुत किया गया।
- source_word: ῥαβδία
  choice: छोटी-छोटी छड़ियाँ
  rationale: लघुतासूचक रूप को पुनरुक्त विशेषण द्वारा बनाए रखा गया।
- source_word: ὡσεὶ πηχυαῖα
  choice: लगभग एक हाथ लंबी
  rationale: πηχυαῖος का अर्थ एक cubit के लगभग है; ‘एक हाथ’ सामान्य पाठक के लिए पारंपरिक माप का सुबोध रूप है।
theological_decisions:
- issue: ‘प्रभु के स्वर्गदूत’ की पहचान
  choice: उसे केवल ‘प्रभु का एक स्वर्गदूत’ कहा गया
  alternative: किसी विशिष्ट दैवी या मसीही व्यक्ति के रूप में पहचानना
  rationale: यूनानी पाठ यहाँ उसकी विशिष्ट पहचान निर्धारित नहीं करता; अतः कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। यूनानी स्रोत में OCR/खंड-संधि के कारण वाक्य का आरंभ विकृत प्रतीत होता है; लक्षित पाठ 60:2 के स्पष्ट वाक्य और उपलब्ध अंग्रेज़ी परामर्श-पाठ से पुष्ट किया गया।
