base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/003.yaml
  text: After all had received the rods, the angel laid aside the sickle, and that tree was sound, just as I had seen it before. I marveled within myself, saying, How is the tree sound, with so many branches cut off? The shepherd says to me, Do not marvel that the tree remained sound though so many branches were cut off. But wait until you see everything, and it will be shown to you what it is.
translation:
  language: hi
  text: जब सब लोगों को छड़ियाँ मिल चुकीं, तब स्वर्गदूत ने हँसिया अलग रख दिया। वह पेड़ वैसा ही स्वस्थ था, जैसा मैंने उसे पहले देखा था। मैंने मन-ही-मन अचंभा किया और कहा, “इतनी सारी डालियाँ काटे जाने के बाद भी यह पेड़ स्वस्थ कैसे है?” चरवाहे ने मुझसे कहा, “इस पर अचंभा मत कर कि इतनी सारी डालियाँ काटे जाने के बाद भी पेड़ स्वस्थ रहा। पर तब तक प्रतीक्षा कर, जब तक तुम सब कुछ न देख लो; तब तुम्हें बताया जाएगा कि यह क्या है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαβδία / ῥάβδους
  choice: छड़ियाँ
  rationale: यहाँ लोगों को बाँटी गई लगभग एक हाथ लंबी पतली शाखाओं या डंडियों का संकेत है; ‘छड़ियाँ’ दृश्य और आगे लौटाई जाने वाली वस्तु, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑγιές
  choice: स्वस्थ
  rationale: पेड़ के अक्षत, जीवित और अच्छी दशा में बने रहने का भाव रखता है; ‘साबुत’ की तुलना में यूनानी स्वास्थ्य-रूपक के अधिक निकट है।
- source_word: ποιμήν
  choice: चरवाहा
  rationale: कृति में वक्ता के मार्गदर्शक की उपाधि का सीधा और सामान्य हिन्दी रूप।
- source_word: δηλωθήσεταί
  choice: बताया जाएगा
  rationale: निष्क्रिय भाव और भविष्यकाल को बनाए रखता है, बिना यह जोड़े कि बताने वाला कौन होगा।
theological_decisions:
- issue: पेड़ के स्वस्थ रहने का प्रतीकात्मक अर्थ
  choice: अर्थ को इस खंड में अनिर्धारित रखा गया है
  alternative: पेड़ को सीधे किसी विशिष्ट धार्मिक समुदाय या व्यवस्था के रूप में पहचानना
  rationale: मूल पाठ स्वयं पाठक को आगे की व्याख्या की प्रतीक्षा करने को कहता है; इस स्थान पर प्रतीक का अर्थ पहले से तय करना अनुचित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। प्रत्यक्ष वचन स्पष्ट किया गया है और मूल की विस्मयात्मक जिज्ञासा तथा प्रतीकात्मक अनिश्चितता सुरक्षित रखी गई है।
