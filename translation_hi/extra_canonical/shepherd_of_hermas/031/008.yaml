base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/008.yaml
  text: “He does not sin,” he says; “but if someone remains by himself, he obtains for himself greater honor and great glory with the Lord; but if he also marries, he does not sin. Therefore keep purity and dignity, and you will live to God. These things that I speak to you and am about to speak, keep from now on, from the day you were entrusted to me, and I will dwell in your house. And for your former trespasses there will be forgiveness, if you keep my commandments; and there will also be forgiveness for all, if they keep these commandments of mine and walk in this purity.”
translation:
  language: hi
  text: वह कहता है, “वह पाप नहीं करता। पर यदि कोई अकेला ही रहे, तो वह प्रभु के सामने अपने लिए और भी अधिक आदर और बड़ी महिमा प्राप्त करता है; फिर भी यदि वह विवाह करे, तो वह पाप नहीं करता। इसलिए पवित्रता और मर्यादा बनाए रख, और तू परमेश्वर के लिए जीवित रहेगा। ये बातें जो मैं तुझसे कह रहा हूँ और आगे कहने वाला हूँ, आज से—जिस दिन से तू मुझे सौंपा गया है—इनका पालन कर; तब मैं तेरे घर में निवास करूँगा। यदि तू मेरी आज्ञाओं का पालन करेगा, तो तेरे पिछले अपराध क्षमा किए जाएँगे। और सबको भी क्षमा मिलेगी, यदि वे मेरी इन आज्ञाओं का पालन करें और इस पवित्रता में चलें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφ' ἑαυτῷ μείνῃ
  choice: अकेला ही रहे
  rationale: विधुर या विधवा के पुनर्विवाह के प्रसंग में इसका अर्थ अविवाहित रहना है; सहज हिन्दी में प्रसंगगत अर्थ रखा गया है।
- source_word: τιμὴν καὶ μεγάλην δόξαν
  choice: आदर और बड़ी महिमा
  rationale: दोनों अलग ग्रीक संज्ञाओं के बल को बनाए रखा गया है।
- source_word: πρὸς τὸν Κύριον
  choice: प्रभु के सामने
  rationale: यहाँ संबंध अथवा प्रभु की दृष्टि में प्राप्त प्रतिष्ठा का भाव है; हिन्दी में स्वाभाविक रहते हुए अस्पष्टता कुछ हद तक सुरक्षित है।
- source_word: ἁγνείαν καὶ σεμνότητα
  choice: पवित्रता और मर्यादा
  rationale: ἁγνεία नैतिक/यौन शुद्धता और σεμνότης गरिमापूर्ण, सम्माननीय आचरण को दर्शाता है।
- source_word: ζήσῃ τῷ Θεῷ
  choice: परमेश्वर के लिए जीवित रहेगा
  rationale: ग्रीक संप्रदान कारक के उद्देश्य अथवा संबंधगत भाव को किसी विशिष्ट धर्मवैज्ञानिक व्याख्या में सीमित किए बिना व्यक्त करता है।
- source_word: παραπτώμασιν
  choice: अपराध
  rationale: नैतिक चूक या उल्लंघन के अर्थ को सामान्य, गरिमापूर्ण हिन्दी में प्रस्तुत करता है।
- source_word: πορευθῶσιν ἐν τῇ ἁγνότητι ταύτῃ
  choice: इस पवित्रता के मार्ग पर चलेगा
  rationale: ‘चलना’ के नैतिक जीवन-व्यवहार वाले रूपक को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: विधुर या विधवा का पुनर्विवाह
  choice: पुनर्विवाह को पाप नहीं कहा गया, जबकि अकेले रहने को अधिक आदर और महिमा से जोड़ा गया है।
  alternative: अकेले रहने को अनिवार्य नियम या पुनर्विवाह को निम्नतर नैतिक पाप बताना।
  rationale: 'ग्रीक पाठ दोनों कथनों को तनाव सहित साथ रखता है: οὐχ ἁμαρτάνει और περισσοτέραν... τιμὴν καὶ μεγάλην δόξαν।'
- issue: आज्ञापालन और क्षमा का संबंध
  choice: शर्तसूचक ‘यदि’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: क्षमा को बिना शर्त बताना या इसे कर्मों से अर्जित उद्धार की व्यवस्थित शिक्षा में बदल देना।
  rationale: मूल में ἐὰν के साथ स्पष्ट शर्त है; अनुवाद उसे न घटाता है, न उसके ऊपर कोई बाद की धर्मवैज्ञानिक प्रणाली थोपता है।
- issue: वक्ता का घर में निवास
  choice: ‘मैं तेरे घर में निवास करूँगा’ को यथावत रखा गया है।
  alternative: वक्ता की पहचान को परमेश्वर, आत्मा या कलीसिया के रूप में स्पष्ट कर देना।
  rationale: इस अंश में वक्ता की प्रतीकात्मक पहचान की व्याख्या नहीं की गई; मूल की कथात्मक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। एकवचन संबोधन में ‘तू/तेरे’ रखा गया है ताकि ग्रीक के निकट, प्रत्यक्ष उपदेशात्मक स्वर बना रहे; इसे अपमानसूचक नहीं बल्कि प्राचीन धार्मिक संबोधन के रूप में बरता गया है।
