lexical_decisions:
- source_word: ἀνέχῃ μου
  choice: मेरी बात सह लें
  rationale: यह विनम्र आग्रह है कि वार्ताकार प्रश्नकर्ता को कुछ और पूछने की अनुमति देते हुए धैर्य रखे; स्वाभाविक हिन्दी में ‘मेरी बात सह लें’ इस भाव को बनाए रखता है।
- source_word: ἔτι μοι καὶ τοῦτο δήλωσον
  choice: यह बात भी मुझे स्पष्ट कर दें
