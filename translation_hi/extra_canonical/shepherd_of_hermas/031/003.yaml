  text: “I heard,” I say, “sir, from certain teachers, that there is no other repentance except that one when we went down into the water and received forgiveness of our former sins.”
translation:
  language: hi
  text: “महोदय,” मैंने कहा, “मैंने कुछ शिक्षकों से सुना है कि उस पश्चाताप के अलावा कोई दूसरा पश्चाताप नहीं है—वही, जब हम पानी में उतरे और अपने पिछले पापों की क्षमा पाई।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: महोदय
  rationale: यहाँ संबोधन आदरपूर्ण है; ‘प्रभु’ कहने से परमेश्वर के लिए प्रयुक्त उपाधि का अनचाहा अर्थ आ सकता था।
- source_word: μετάνοια
  choice: पश्चाताप
  rationale: यह प्रचलित और संदर्भानुकूल धार्मिक शब्द है, जो पाप से मन फिराने के भाव को व्यक्त करता है।
- source_word: εἰς ὕδωρ κατέβημεν
  choice: हम पानी में उतरे
  rationale: मूल पाठ की ठोस गति और बपतिस्मा-संबंधी संकेत को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἄφεσιν ἁμαρτιῶν ἡμῶν τῶν προτέρων
  choice: अपने पिछले पापों की क्षमा
  rationale: ‘पूर्व के पापों’ का स्वाभाविक आधुनिक हिन्दी रूप है और क्षमा के आशय को स्पष्ट रखता है।
theological_decisions:
- issue: पानी में उतरने और पश्चाताप के संबंध की व्याख्या
  choice: दोनों को मूल पाठ की तरह निकट संबंध में रखा गया, पर ‘बपतिस्मा’ शब्द नहीं जोड़ा गया।
  alternative: इसे स्पष्ट रूप से ‘बपतिस्मा के समय किया गया पश्चाताप’ कहना।
  rationale: मूल यूनानी केवल पानी में उतरने की बात कहता है; स्पष्ट धार्मिक पद जोड़ना मूल की निहितता को व्याख्या में बदल देता।
- issue: ‘कोई दूसरा पश्चाताप नहीं’ कथन की कठोरता
  choice: कथन को बिना नरम किए यथावत रखा गया।
  alternative: इसे ‘दूसरे बपतिस्मे’ या ‘पाप-क्षमा के दूसरे अवसर’ के रूप में समझाकर अनुवाद करना।
  rationale: यहाँ वक्ता शिक्षकों से सुना मत उद्धृत करता है; आगे का संवाद इसकी सीमा स्पष्ट करता है, इसलिए इस वाक्य में तनाव बनाए रखना आवश्यक है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; संवाद का क्रम स्वाभाविक बनाने के लिए ‘महोदय’ को आरंभ में रखा गया है।
