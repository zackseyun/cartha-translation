base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/007.yaml
  text: “If a woman,” I say, “sir, or again some man, should fall asleep, and one of them marries, does the one who marries sin?”
translation:
  language: hi
  text: मैंने कहा, “स्वामी, यदि किसी स्त्री अथवा किसी पुरुष का निधन हो जाए और उसका जीवनसाथी विवाह कर ले, तो क्या विवाह करने वाला पाप करता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοιμηθῇ
  choice: देहांत हो जाए
  rationale: शाब्दिक अर्थ ‘सो जाए’ है, पर यहाँ प्रसंग में मृत्यु के लिए प्रचलित सौम्य प्रयोग है; आधुनिक हिन्दी में आशय स्पष्ट रखने के लिए ‘देहांत हो जाए’ चुना गया।
- source_word: γαμήσῃ / ὁ γαμῶν
  choice: विवाह कर ले / विवाह करने वाला
  rationale: यूनानी क्रिया का सीधा और स्वाभाविक हिन्दी समतुल्य, जो पुनर्विवाह के प्रश्न को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: τις ἐξ αὐτῶν
  choice: उनमें से जो जीवित है
  rationale: मूल में ‘उनमें से कोई एक’ है; मृत्यु के प्रसंग में आशय बचे हुए स्त्री या पुरुष से है। ‘जो जीवित है’ हिन्दी में संदर्भ स्पष्ट करता है, पर लिंग के संबंध में मूल की समावेशिता बनाए रखता है।
- source_word: κύριε
  choice: स्वामी
  rationale: सम्मानसूचक संबोधन को गरिमापूर्ण ढंग से प्रस्तुत करता है और अनावश्यक रूप से सामान्य ‘श्रीमान’ या विशिष्ट धर्मवैधानिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: जीवनसाथी की मृत्यु के बाद पुनर्विवाह की नैतिकता पर प्रश्न
  choice: 'प्रश्न को मूल की तरह खुला रखा गया: ‘क्या ... पाप करता है?’'
  alternative: उत्तर या धार्मिक निष्कर्ष को इसी वाक्य में जोड़ना
  rationale: इस पाठखंड में केवल प्रश्न है; अगले वाक्य का उत्तर यहाँ पहले से जोड़ना कथात्मक और धर्मवैचारिक तनाव को मिटा देता।
- issue: स्त्री और पुरुष दोनों पर समान रूप से लागू प्रश्न
  choice: ‘किसी स्त्री ... या ... किसी पुरुष’ और ‘जो जीवित है’
  alternative: केवल विधुर अथवा केवल विधवा के पुनर्विवाह का उल्लेख
  rationale: मूल यूनानी स्पष्ट रूप से दोनों संभावनाएँ रखता है; अनुवाद में दोनों को बनाए रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण संवाद-शैली। ‘देहांत’ मृत्यु के लिए मूल के सौम्य प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
