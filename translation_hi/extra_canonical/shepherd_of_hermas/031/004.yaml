  text: He says to me, “You heard well; for so it is. For the one who has received forgiveness—”
translation:
  language: hi
  text: वह मुझसे कहता है, “तुमने ठीक सुना है, क्योंकि बात ऐसी ही है। जिसने क्षमा पाई है, उसके लिए आवश्यक था कि—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καλῶς ἤκουσας
  choice: तुमने ठीक सुना है
  rationale: यह यूनानी वाक्यांश की स्वाभाविक और सीधी हिन्दी अभिव्यक्ति है।
- source_word: οὕτω γὰρ ἔχει
  choice: क्योंकि बात ऐसी ही है
  rationale: मुहावरेदार यूनानी का अर्थ है कि सुनी हुई शिक्षा वास्तव में सही है।
- source_word: τὸν εἰληφότα ἄφεσιν
  choice: जिसने क्षमा पाई है
  rationale: ἄφεσις यहाँ पापों की क्षमा को सूचित करता है; हिन्दी में संक्षिप्त रूप प्रसंगानुकूल है।
- source_word: ἔδει
  choice: उसके लिए आवश्यक था
  rationale: यह अपूर्ण यूनानी वाक्य में निहित आवश्यकता या कर्तव्य को बनाए रखता है।
theological_decisions:
- issue: अपूर्ण स्रोत-वाक्य
  choice: अंत में दीर्घ विराम-चिह्न द्वारा वाक्य को खुला रखा गया
  alternative: अगले अंश की संभावित सामग्री जोड़कर वाक्य पूरा करना
  rationale: दिए गए यूनानी स्रोत और अंग्रेज़ी परामर्श-पाठ दोनों इसी स्थान पर कटे हुए हैं; अनुमान से धार्मिक आशय पूरा करना उचित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी; संवाद की प्रत्यक्षता तथा स्रोत की अपूर्णता दोनों सुरक्षित रखी गई हैं।
