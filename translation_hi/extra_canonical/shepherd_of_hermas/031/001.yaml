lexical_decisions:
- source_word: Ἔτι
  choice: एक और
  rationale: यहाँ इसका संबंध आगे एक अतिरिक्त प्रश्न जोड़ने से है; इसलिए स्वाभाविक हिन्दी में ‘एक और’ उपयुक्त है।
- source_word: κύριε
  choice: स्वामी
  rationale: वक्ता सम्मानपूर्वक संबोधित कर रहा है। ‘स्वामी’ गरिमापूर्ण है और प्रसंग में गुरु-सदृश संबोधन को व्यक्त करता है।
- source_word: προσθήσω τοῦ ἐπερωτῆσαι
  choice: प्रश्न पूछना चाहता हूँ
  rationale: यूनानी पदबंध का शाब्दिक अर्थ ‘पूछने में और जोड़ूँगा’ है; हिन्दी में इसका स्वाभाविक आशय एक अतिरिक्त प्रश्न पूछने की इच्छा है।
