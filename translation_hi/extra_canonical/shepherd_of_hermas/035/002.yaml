  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/002.yaml
  text: '“Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather, do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore exercise self‑control from every wickedness, doing the good.”'
translation:
  language: hi
  text: “मुझे बताइए, स्वामी,” मैंने कहा, “किन बातों में संयम रखना चाहिए और किनमें नहीं?” उन्होंने कहा, “सुनो। बुराई से अपने को रोको और उसे मत करो; पर भलाई से अपने को मत रोको, बल्कि उसे करो। क्योंकि यदि तुम भलाई न करने के लिए अपने को रोकते हो, तो बड़ा पाप करते हो; लेकिन यदि तुम बुराई न करने के लिए अपने को रोकते हो, तो बड़ी धार्मिकता करते हो। इसलिए हर प्रकार की बुराई से अपने को रोको और भलाई करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκρατεύσῃ / ἐγκράτευσαι
  choice: संयम रखना / अपने को रोकना
  rationale: मूल में एक ही शब्द-समूह को बुराई और भलाई दोनों के संबंध में जानबूझकर दोहराया गया है। प्रश्न में स्वाभाविक हिन्दी ‘संयम रखना’ और निर्देशों में ‘अपने को रोकना’ रखकर अर्थ और शब्द-क्रीड़ा दोनों को यथासंभव सुरक्षित रखा गया है।
- source_word: κύριε
  choice: स्वामी
  rationale: यह सम्मानसूचक संबोधन है; ‘स्वामी’ वक्ता और उसे निर्देश देने वाले पात्र के संबंध को व्यक्त करता है, बिना इसे अनिवार्य रूप से परमेश्वर के लिए प्रयुक्त उपाधि मान लेने के।
- source_word: τὸ πονηρόν / πονηρίας πάσης
  choice: बुराई / हर प्रकार की बुराई
  rationale: यह नैतिक बुराई का व्यापक संकेत है; अंतिम वाक्य में πάσης की समग्रता को ‘हर प्रकार की’ से व्यक्त किया गया है।
- source_word: τὸ ἀγαθόν
  choice: भलाई
  rationale: संज्ञात्मक नैतिक अर्थ को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δικαιοσύνην μεγάλην ἐργάζῃ
  choice: धार्मिकता का बड़ा काम करते हो
  rationale: δικαιοσύνη के धार्मिक-नैतिक अर्थ को बनाए रखते हुए ἐργάζῃ की क्रियात्मकता भी सुरक्षित रखी गई है।
theological_decisions:
- issue: भलाई न करने को ‘बड़ा पाप’ और बुराई से रुकने को ‘बड़ी धार्मिकता’ कहना
  choice: मूल के नैतिक प्रतिपक्ष और तीव्रता को सीधे बनाए रखा गया
  alternative: इसे केवल ‘गलत करते हो’ और ‘अच्छा करते हो’ जैसे सामान्य कथनों में नरम करना
  rationale: मूल पाठ कर्म, पाप और धार्मिकता के बीच स्पष्ट और तनावपूर्ण संबंध रखता है; अनुवाद में उस दावे को न तो हल्का किया गया, न किसी बाद की मत-पद्धति के अनुसार समझाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संवाद की पुनरुक्ति तथा ‘बुराई से अपने को रोकना’ और ‘भलाई से अपने को न रोकना’ का मूल विरोध जानबूझकर बनाए रखा गया है।
