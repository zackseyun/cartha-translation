base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/009.yaml
  text: '“First of all: faith, fear of the Lord, love, concord, words of righteousness, truth, endurance—there is nothing better than these in the life of human beings. If someone keeps these and does not exercise self‑control from them, he becomes blessed in his life.'
translation:
  language: hi
  text: '“सबसे पहले: विश्वास, प्रभु का भय, प्रेम, एकता, धार्मिकता की बातें, सत्य और धीरज—मनुष्यों के जीवन में इनसे बढ़कर भला और कुछ नहीं है। यदि कोई इन्हें बनाए रखे और इनसे अपने को न रोके, तो वह अपने जीवन में धन्य हो जाता है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: विश्वास
  rationale: यह शब्द भरोसे और निष्ठा दोनों का भाव रख सकता है; इस गुण-सूची में प्रचलित और पर्याप्त रूप से व्यापक हिन्दी शब्द ‘विश्वास’ उपयुक्त है।
- source_word: φόβος κυρίου
  choice: प्रभु का भय
  rationale: मूल की पारंपरिक धार्मिक अभिव्यक्ति और उसकी गंभीरता को बनाए रखता है; इसे केवल ‘श्रद्धा’ कहने से भय का वास्तविक अर्थ घट जाता।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: सामान्य, dignified और व्यापक अर्थ वाला आधुनिक हिन्दी समतुल्य।
- source_word: ὁμόνοια
  choice: मेल-मिलाप
  rationale: मन और संबंधों की एकता/सहमति का सहज हिन्दी रूप; ‘एकमतता’ अधिक अमूर्त और अस्वाभाविक लगता।
- source_word: ῥήματα δικαιοσύνης
  choice: धार्मिकता की बातें
  rationale: बहुवचन ῥήματα और संबंधसूचक δικαιοσύνης को निकटता से दर्शाता है; ‘धर्मी वचन’ की तुलना में सामान्य पाठक के लिए अधिक सहज है।
- source_word: ἀλήθεια
  choice: सत्य
  rationale: मूल संज्ञा का सीधा और स्वाभाविक समतुल्य।
- source_word: ὑπομονή
  choice: धीरज
  rationale: दृढ़ बने रहने और सहने का भाव व्यक्त करता है; इस संदर्भ में ‘धैर्य’ से अधिक सक्रिय स्थिरता सूचित करता है।
- source_word: φυλάσσῃ
  choice: बनाए रखे
  rationale: गुणों को थामे रखने, उनका पालन करने और सुरक्षित रखने का अर्थ इस प्रसंग में स्वाभाविक ढंग से देता है।
- source_word: μὴ ἐγκρατεύηται ἀπ᾿ αὐτῶν
  choice: इनसे अपने को न रोके
  rationale: 'पूरे आदेश में ἐγκρατεύομαι की जानबूझकर दोहरी विडंबनापूर्ण भाषा को बचाता है: बुराई से संयम करना है, पर भलाई से स्वयं को नहीं रोकना।'
- source_word: μακάριος
  choice: धन्य
  rationale: सुखी, अनुगृहीत और प्रशंसनीय दशा के धार्मिक आयाम को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: ‘प्रभु का भय’ का अर्थ
  choice: मूल अभिव्यक्ति ‘प्रभु का भय’ को यथावत रखा गया।
  alternative: ‘प्रभु के प्रति श्रद्धा’ या ‘श्रद्धापूर्ण भय’
  rationale: मूल φόβος में वास्तविक भय और श्रद्धा दोनों की संभावना है; केवल ‘श्रद्धा’ चुनना इस तनाव को अनावश्यक रूप से हल कर देता।
- issue: भलाई से ‘संयम न करने’ का विरोधाभासी कथन
  choice: ‘इनसे अपने को न रोके’
  alternative: ‘इनका पालन करने में पीछे न हटे’
  rationale: वैकल्पिक रूप आशय स्पष्ट करता, पर मूल अध्याय में प्रयुक्त एक ही संयम-संबंधी क्रिया की शब्द-क्रीड़ा मिटा देता।
- issue: μακάριος की परिणति
  choice: ‘धन्य हो जाता है’
  alternative: ‘सुखी होता है’
  rationale: ‘धन्य’ मूल के धार्मिक और मूल्यांकनात्मक भार को बनाए रखता है, बिना यह निर्धारित किए कि यहाँ सांसारिक सुख, ईश्वरीय कृपा या अंतिम उद्धार में से कौन-सा आशय प्रधान है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूची की लय बनाए रखने के लिए संक्षिप्त संज्ञाएँ प्रयुक्त हुई हैं। मूल पाठ की संयम-संबंधी शब्द-क्रीड़ा को अत्यधिक शाब्दिक ‘संयम न करे’ के बजाय स्वाभाविक ‘अपने को न रोके’ से संरक्षित किया गया है।
