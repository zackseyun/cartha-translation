  text: “Do these not seem to you to be evil?” “Very evil,” I say, “for the servants of God.” “From all these the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that you may live to God and be enrolled with those who exercise self‑control from them. These, then, are the things from which you must exercise self‑control.
translation:
  language: hi
  text: “क्या तुम्हें ये बातें बुरी लगती हैं?” उन्होंने कहा। मैंने कहा, “परमेश्वर के सेवकों के लिए ये बहुत बुरी हैं।” उन्होंने कहा, “जो परमेश्वर की सेवा करता है, उसे इन सबसे अपने को रोकना चाहिए। इसलिए इन सबसे अपने को रोक लो, ताकि तुम परमेश्वर के लिए जीओ और उन लोगों के साथ दर्ज किए जाओ जो इन सबसे अपने को रोकते हैं। अतः ये वे बातें हैं जिनसे तुम्हें अपने को रोकना चाहिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκράτευσαι
  choice: अपने आप को रोकना / रोके रखना
  rationale: यहाँ क्रिया का आशय सूचीबद्ध बुराइयों से संयमपूर्वक दूर रहना है। ‘आत्म-संयम रखना’ संभव था, पर बार-बार आने वाले ἀπό के साथ ‘इनसे अपने आप को रोकना’ अधिक स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: δουλεύοντα τῷ θεῷ
  choice: जो परमेश्वर की सेवा करता है
  rationale: ग्रीक कृदंत का स्वाभाविक हिन्दी रूप; इससे निरंतर सेवा का भाव बना रहता है।
- source_word: ζήσῃ τῷ θεῷ
  choice: परमेश्वर के लिए जीओ
  rationale: सम्प्रदान कारक की जानबूझकर संक्षिप्त अभिव्यक्ति को बनाए रखता है; इसे ‘परमेश्वर के साथ जीवित रहो’ या ‘परमेश्वर से जीवन पाओ’ कहकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ἐγγραφήσῃ
  choice: तुम्हारा नाम भी लिखा जाए
  rationale: नामावली में दर्ज किए जाने का भाव सामान्य आधुनिक हिन्दी में स्पष्ट करता है, जबकि निष्क्रिय क्रिया का स्वर सुरक्षित रहता है।
- source_word: πονηρά
  choice: बुरी
  rationale: नैतिक बुराई के लिए सहज और व्यापक हिन्दी शब्द; प्रसंग में ‘दुष्ट’ की तुलना में कर्मों/बातों के लिए अधिक स्वाभाविक।
theological_decisions:
- issue: ‘परमेश्वर के लिए जीना’ का अर्थ
  choice: परमेश्वर के लिए जीओ
  alternative: परमेश्वर के सामने जीवित रहो / परमेश्वर से जीवन पाओ
  rationale: ग्रीक ζῆν τῷ θεῷ में सम्बन्ध का स्वर संक्षिप्त और कुछ हद तक खुला है। अनुवाद इसे किसी विशिष्ट उद्धार-सिद्धान्त या केवल नैतिक जीवन तक सीमित नहीं करता।
- issue: नाम लिखे जाने की छवि
  choice: उन लोगों के साथ तुम्हारा नाम भी लिखा जाए
  alternative: उनमें गिने जाओ
  rationale: ἐγγραφήσῃ की लेखबद्ध नामावली वाली छवि को सुरक्षित रखा गया है; ‘गिने जाओ’ अर्थ तो देता, पर मूल रूपक मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण संवाद-शैली। मूल के बार-बार दोहराए गए ‘अपने आप को रोकना’ को जानबूझकर बनाए रखा गया है, क्योंकि यही इस आदेश का प्रमुख शब्द और तर्क-सूत्र है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
