base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/004.yaml
  text: “These deeds are the most evil of all in the life of human beings. From these works, then, the servant of God must exercise self‑control; for the one who does not exercise self‑control from these is not able to live to God. Listen, then, also to the things that follow these.”
translation:
  language: hi
  text: ये कर्म मनुष्यों के जीवन में सबसे अधिक बुरे हैं। इसलिए परमेश्वर के सेवक को इन कर्मों से संयम बरतना चाहिए; क्योंकि जो इनसे संयम नहीं बरतता, वह परमेश्वर के लिए जी नहीं सकता। इसलिए इनके बाद की बातें भी सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔργα
  choice: काम
  rationale: यहाँ नैतिक कर्मों का बोध है; सामान्य पाठक के लिए ‘काम’ स्वाभाविक और स्पष्ट है।
- source_word: πάντων πονηρότατα
  choice: सबसे बुरे
  rationale: अतिशयोक्तिपूर्ण सर्वोच्चता को सीधे बनाए रखता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: ἐγκρατεύεσθαι ἀπό
  choice: से दूर रहना / अपने को रोकना
  rationale: इस प्रसंग में क्रिया का अर्थ बुरे कर्मों से संयमपूर्वक विरत रहना है; दोनों अभिव्यक्तियाँ हिन्दी में संदर्भानुकूल और सहज हैं।
- source_word: ζῆσαι τῷ θεῷ
  choice: परमेश्वर के लिए जीना
  rationale: यूनानी सम्प्रदान कारक की संभावित निष्ठा/समर्पण की दिशा को औपचारिक रूप से सुरक्षित रखता है।
- source_word: τὰ ἀκόλουθα τούτων
  choice: इनके बाद आनेवाली बुराइयाँ
  rationale: अगले वाक्यों में और बुरे कर्मों की सूची आती है; ‘बुराइयाँ’ संदर्भ से स्पष्ट की गई है।
theological_decisions:
- issue: ζῆσαι τῷ θεῷ का अर्थ
  choice: परमेश्वर के लिए जी नहीं सकता
  alternative: परमेश्वर के प्रति जीवित नहीं रह सकता
  rationale: चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर के प्रति समर्पित जीवन का भाव रखता है; इसे अनन्त जीवन या उद्धार के किसी विशिष्ट सिद्धान्त तक सीमित नहीं करता।
- issue: संयम की नैतिक भूमिका
  choice: इन कामों से दूर रहना चाहिए
  alternative: इनसे परहेज़ करना चाहिए
  rationale: मूल पाठ का आदेशात्मक नैतिक बल सुरक्षित है, पर इसे तपस्वी या सांप्रदायिक अर्थ नहीं दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल की पुनरुक्ति को अर्थपूर्ण ढंग से रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं; अतः मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
