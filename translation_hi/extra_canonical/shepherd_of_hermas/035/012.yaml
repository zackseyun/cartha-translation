base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/012.yaml
  text: “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you will live to God—and all who act in this way will live to God. And again, if you do not do the evil and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps these commandments and walks in them.”
translation:
  language: hi
  text: इसलिए इस आज्ञा का पालन करो। यदि तुम भलाई करते हो और उसे करने से अपने को नहीं रोकते, तो तुम परमेश्वर के लिए जीवित रहोगे; और इस प्रकार करने वाले सभी परमेश्वर के लिए जीवित रहेंगे। फिर, यदि तुम बुराई नहीं करते और उससे अपने को रोकते हो, तो तुम परमेश्वर के लिए जीवित रहोगे; और वे सभी परमेश्वर के लिए जीवित रहेंगे जो इन आज्ञाओं का पालन करते और उनके अनुसार चलते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: पालन करो
  rationale: आज्ञा के संदर्भ में यूनानी क्रिया का अर्थ केवल सुरक्षित रखना नहीं, बल्कि ध्यानपूर्वक मानना और पालन करना है।
- source_word: ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ
  choice: उसे करने से अपने को नहीं रोकते / उससे अपने को रोके रखते हो
  rationale: 'एक ही यूनानी अभिव्यक्ति को प्रसंग के अनुसार स्वाभाविक हिन्दी में व्यक्त किया गया है: भलाई के विषय में न रुकना और बुराई के विषय में आत्म-संयम रखते हुए रुकना।'
- source_word: ζήσῃ τῷ θεῷ
  choice: परमेश्वर के लिए जीवित रहोगे
  rationale: सम्प्रदान कारक की संक्षिप्त और कुछ हद तक खुली हुई अर्थ-छाया को बनाए रखता है; इसे किसी अधिक विशिष्ट धर्मवैज्ञानिक निष्कर्ष में नहीं बदला गया।
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: उनके अनुसार चलते हैं
  rationale: आज्ञाओं में ‘चलने’ के यूनानी रूपक को आधुनिक हिन्दी में समझने योग्य बनाते हुए उसके नैतिक जीवन-आचरण के भाव को सुरक्षित रखा गया है।
theological_decisions:
- issue: ζῆν τῷ θεῷ का धर्मवैज्ञानिक अर्थ
  choice: परमेश्वर के लिए जीवित रहना
  alternative: परमेश्वर के सामने जीवित रहना / परमेश्वर में जीवन पाना
  rationale: मूल वाक्यांश यह स्पष्ट नहीं करता कि बल समर्पित जीवन, परमेश्वर के साथ जीवन, या उद्धारगत जीवन पर है। चुना हुआ अनुवाद इस तनाव को खुला रखता है।
- issue: भलाई करने और बुराई से रुकने का जीवन से संबंध
  choice: मूल के शर्तात्मक वाक्यों को ज्यों का त्यों रखा गया
  alternative: इन्हें केवल उद्धार के प्रमाण या परिणाम के रूप में स्पष्ट करना
  rationale: पाठ स्वयं ‘यदि…तो’ संबंध प्रस्तुत करता है; किसी विशिष्ट पंथगत अनुग्रह-कर्म सिद्धांत द्वारा उसे पुनर्व्याख्यायित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अपने को रोकना’ सामान्य पाठक के लिए ‘संयम करना’ की अपेक्षा इस प्रसंग में अधिक स्वाभाविक है, विशेषकर जहाँ भलाई से न रुकने की बात कही गई है। एकवचन ‘इस आज्ञा’ और अंत के बहुवचन ‘इन आज्ञाओं’ को मूल के अनुसार सुरक्षित रखा गया है।
