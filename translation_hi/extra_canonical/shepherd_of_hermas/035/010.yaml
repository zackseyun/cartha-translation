base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/010.yaml
  text: '“Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the servants of God from distresses; to be hospitable (for in hospitality one sometimes finds an opportunity for doing good); to oppose no one; to be quiet; to become lower than all people; to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast off those who have stumbled away from the faith, but to turn them back and make them cheerful; to admonish those who sin; not to oppress debtors and the needy; and if there is anything like these.'
translation:
  language: hi
  text: '“फिर इनके बाद आनेवाली बातों को सुनो: विधवाओं की सेवा करना; अनाथों और अभावग्रस्त लोगों की सुधि लेना; परमेश्वर के सेवकों को संकटों से छुड़ाना; अतिथि-सत्कार करना—क्योंकि अतिथि-सत्कार में कभी-कभी भलाई करने का अवसर मिलता है; किसी का विरोध न करना; शांत रहना; सब लोगों से अधिक दीन बनना[a]; बुज़ुर्गों का आदर करना; धार्मिकता का आचरण करना; भाईचारे को बनाए रखना; अपमान सहना; धीरज रखना; मन में बैर न रखना; मन से थके हुए लोगों को ढाढ़स देना; जो विश्वास से ठोकर खाकर दूर हो गए हैं, उन्हें त्याग न देना, बल्कि उन्हें लौटा लाना और उनका मन प्रसन्न करना; पाप करनेवालों को चेतावनी देना; कर्ज़दारों और अभावग्रस्त लोगों पर दबाव न डालना[b]; और यदि इनके समान कोई और काम हो, तो उसे भी करना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अधिक दीन” का अर्थ “अधिक अभावग्रस्त” या “सबसे छोटा/नम्र” भी हो सकता है।
    reason: यूनानी ἐνδεέστερον में अभाव और निम्नता दोनों के अर्थ संभव हैं।
  - marker: b
    text: अर्थात कर्ज़दारों और ज़रूरतमंदों को सताना, तंग करना या उन पर कठोर दबाव डालना नहीं।
    reason: यूनानी θλίβειν का मूल भाव दबाना या कष्ट देना है; हिंदी वाक्य में नैतिक आशय स्पष्ट करने के लिए टिप्पणी दी गई है।
lexical_decisions:
- source_word: ὑπηρετεῖν
  choice: सेवा करना
  rationale: यह विधवाओं की व्यावहारिक सहायता और देखभाल दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐπισκέπτεσθαι
  choice: सुधि लेना
  rationale: यह केवल मिलने जाने के बजाय देखभाल और सहायता की चिंता को भी समेटता है।
- source_word: ἐξ ἀναγκῶν λυτροῦσθαι
  choice: संकटों से छुड़ाना
  rationale: λυτρόομαι के मुक्ति-दायक भाव को बनाए रखता है, जबकि बहुवचन ἀνάγκαι की व्यापकता—कठिनाई, विवशता या संकट—को किसी एक प्रकार की दशा तक सीमित नहीं करता।
- source_word: ἐνδεέστερον
  choice: अधिक दीन
  rationale: तुलनात्मक शब्द में दीनता, निम्नता और अभाव का भाव है; संदर्भ में यह स्वयं को दूसरों से बड़ा न मानने की विनम्र मुद्रा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀδελφότητα συντηρεῖν
  choice: भाईचारे को बनाए रखना
  rationale: ἀδελφότης के सामुदायिक संबंध और συντηρεῖν के संरक्षणकारी अर्थ दोनों को बनाए रखता है।
- source_word: μνησικακίαν μὴ ἔχειν
  choice: मन में बैर न रखना
  rationale: शाब्दिक ‘बुराई को याद रखना’ के मुहावरेदार अर्थ—रंजिश या द्वेष पालना—को सरल आधुनिक हिंदी में देता है।
- source_word: ἐσκανδαλισμένους ἀπὸ τῆς πίστεως
  choice: जो विश्वास से ठोकर खाकर दूर हो गए हैं
  rationale: ठोकर खाने के रूपक और विश्वास से विचलन, दोनों को सुरक्षित रखता है; इसे पूर्ण धर्मत्याग के निश्चित तकनीकी अर्थ में सीमित नहीं करता।
- source_word: θλίβειν
  choice: दबाव डालना
  rationale: कर्ज़दारों और अभावग्रस्तों को सताने, तंग करने या कठोरता से दबाने के अर्थ को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: विश्वास से ठोकर खानेवालों की स्थिति
  choice: उन्हें ‘विश्वास से ठोकर खाकर दूर हो गए’ कहा गया है और समुदाय को उन्हें लौटाने के लिए कहा गया है।
  alternative: इसे निश्चित रूप से ‘विश्वास त्याग चुके’ या ‘धर्मत्यागी’ कहना।
  rationale: यूनानी ἐσκανδαλισμένους रूपकात्मक और कुछ हद तक खुला है; अनुवाद उनकी दशा को अंतिम या अपरिवर्तनीय घोषित नहीं करता।
- issue: ‘परमेश्वर के सेवकों को संकटों से छुड़ाना’ का स्वरूप
  choice: सहायता के प्रकार को व्यापक रखा गया है।
  alternative: इसे विशेष रूप से दासों को खरीदकर स्वतंत्र कराने या केवल ऋण चुकाने के अर्थ में लेना।
  rationale: यहाँ ἀνάγκαι अनेक प्रकार की विवशताओं या संकटों को सूचित कर सकता है; पाठ किसी एक संस्थागत उपाय को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। सूची की लय को अर्धविरामों से संरक्षित किया गया है। ‘परमेश्वर के सेवक’, ‘धार्मिकता’, ‘विश्वास’ और ‘भाईचारा’ जैसे पद व्यापक धार्मिक अर्थ में रखे गए हैं, बिना किसी संप्रदाय-विशेष की शब्दावली जोड़े।
