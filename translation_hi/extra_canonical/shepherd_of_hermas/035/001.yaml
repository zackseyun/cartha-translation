base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/001.yaml
  text: “I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold as well. For with regard to some things one must exercise self‑control, and with regard to others one must not.
translation:
  language: hi
  text: उसने कहा, “मैंने तुमसे कहा था कि परमेश्वर की रची हुई वस्तुएँ दो प्रकार की हैं; क्योंकि आत्म-संयम भी दो प्रकार का होता है। कुछ बातों में आत्म-संयम रखना चाहिए और कुछ में नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ κτίσματα τοῦ θεοῦ
  choice: परमेश्वर की सृष्टि की हुई चीज़ें
  rationale: कτίσματα का मूल अर्थ सृजी हुई वस्तुएँ या प्राणी है। यहाँ आगे अच्छे और बुरे कर्मों के द्विभाजन की भूमिका होने के कारण व्यापक और सहज पदावली रखी गई है।
- source_word: διπλᾶ
  choice: दो प्रकार की
  rationale: शाब्दिक ‘दुगुनी’ की अपेक्षा संदर्भ में वर्गीकरण का भाव है, इसलिए स्वाभाविक हिन्दी में ‘दो प्रकार की’ कहा गया।
- source_word: ἐγκράτεια
  choice: आत्म-संयम
  rationale: यहाँ बुरी बातों से अपने को रोकने और अच्छी बातों से न रोकने की नैतिक धारणा है; ‘आत्म-संयम’ आधुनिक हिन्दी में इसे स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: δεῖ ἐγκρατεύεσθαι
  choice: आत्म-संयम रखना चाहिए
  rationale: δεῖ की नैतिक आवश्यकता और मध्यमवाच्य क्रिया के स्वयं को वश में रखने के भाव, दोनों को सहज हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर की सृजी हुई चीज़ें दो प्रकार की हैं’ कथन का आशय
  choice: कथन को उसके व्यापक और कुछ हद तक रहस्यमय रूप में बनाए रखा गया
  alternative: इसे व्याख्यात्मक रूप से ‘मनुष्य के काम दो प्रकार के हैं’ कहना
  rationale: यूनानी पाठ κτίσματα कहता है और इस खंड में अभी उसका अर्थ स्पष्ट नहीं करता। अनुवाद में आगे की नैतिक सूची को पहले से आरोपित करके मूल की अस्पष्टता दूर नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवादात्मक किंतु गरिमापूर्ण शैली। यूनानी में प्रत्यक्ष कथन के बीच φησίν (‘वह कहता है’) आता है, जिसे हिन्दी में स्वाभाविक क्रम के अनुसार ‘उसने कहा’ बनाया गया है। पाठ-खंड में कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
