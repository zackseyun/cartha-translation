base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/007.yaml
  text: '“But the things from which you must not exercise self‑control,” he says, “but rather do them—listen: Do not exercise self‑control with regard to the good, but do it.”'
translation:
  language: hi
  text: “और जिन बातों को तुम्हें करने से अपने को नहीं रोकना, बल्कि करना है, उन्हें सुनो,” वह कहता है। “भलाई करने से अपने को मत रोको, बल्कि उसे करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκρατεύου
  choice: अपने को रोकना / अपने को मत रोको
  rationale: यहाँ शब्द सामान्य ‘आत्म-संयम’ से अधिक, किसी कार्य को करने से स्वयं को रोकने के अर्थ में प्रयुक्त है। भलाई के संदर्भ में स्वाभाविक और स्पष्ट हिन्दी के लिए क्रियात्मक रूप चुना गया।
- source_word: τὸ ἀγαθόν
  choice: भलाई
  rationale: संज्ञात्मक एकवचन यूनानी पद यहाँ सामान्य रूप से ‘जो अच्छा है’ अथवा ‘भलाई’ को दर्शाता है; ‘भलाई’ सहज और व्यापक हिन्दी है।
- source_word: ποίει αὐτό
  choice: उसे करो
  rationale: मूल के सीधे आदेश और सर्वनाम-संबंध को सुरक्षित रखा गया है।
- source_word: ἄκουε
  choice: सुनो
  rationale: एकवचन आज्ञार्थक रूप को सीधे और स्वाभाविक ढंग से प्रस्तुत किया गया है।
theological_decisions:
- issue: भलाई से न रुकने की आज्ञा
  choice: भलाई करने से अपने को मत रोको
  alternative: भलाई के विषय में आत्म-संयम मत रखो
  rationale: शाब्दिक विकल्प आधुनिक हिन्दी में यह भ्रम पैदा कर सकता है कि सद्गुण के रूप में आत्म-संयम निषिद्ध है। प्रसंग में आशय भले कार्य को करने से विरत न होना है; अनुवाद इसी प्रासंगिक अर्थ को व्यक्त करता है, बिना अतिरिक्त धर्मशास्त्रीय निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवादात्मक पर गरिमापूर्ण शैली। ‘उसने कहा’ से वक्ता की कथा-संरचना बनी रहती है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
