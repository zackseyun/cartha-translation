  text: “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works of the good, which you must do and not exercise self‑control from.
translation:
  language: hi
  text: मैंने कहा, “हे प्रभु, मुझे अच्छी बातों की शक्ति भी बताइए, ताकि मैं उनमें चलूँ और उनकी सेवा करूँ, जिससे उन्हें करके मैं उद्धार पा सकूँ।” उसने कहा, “अच्छी बातों के वे काम भी सुनो जिन्हें तुम्हें करना है और जिनसे तुम्हें अपने को नहीं रोकना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀγαθῶν
  choice: भली बातों
  rationale: यह नपुंसकलिंग बहुवचन व्यापक रूप से नैतिक रूप से अच्छी बातों या गुणों को सूचित करता है; आगे इनके ‘कामों’ की सूची आती है।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: मूल शब्द का प्राथमिक अर्थ ‘शक्ति/सामर्थ्य’ है। वाक्य में इसका आशय इन भली बातों की प्रभावकारी नैतिक शक्ति को समझना है; ‘महत्त्व’ कर देने से मूल रूपक खो जाता।
- source_word: πορευθῶ ἐν αὐτοῖς
  choice: उनके मार्ग पर चलूँ
  rationale: शाब्दिक ‘उनमें चलूँ’ को स्वाभाविक हिन्दी में नैतिक जीवन-मार्ग के रूपक सहित व्यक्त करता है।
- source_word: δουλεύσω αὐτοῖς
  choice: उनकी सेवा करूँ
  rationale: मूल की प्रबल और कुछ असामान्य अभिव्यक्ति को बनाए रखता है; इसे केवल ‘उनका पालन करूँ’ कहकर नरम नहीं किया गया।
- source_word: ἐργασάμενος αὐτά
  choice: उन्हें करते हुए
  rationale: भली बातों को व्यवहार में लाने का भाव सरल और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: σωθῆναι
  choice: उद्धार पा सकूँ
  rationale: निष्क्रिय क्रिया ‘बचाया जाना/उद्धार पाना’ का धार्मिक और व्यापक अर्थ सुरक्षित रखता है।
- source_word: μὴ ἐγκρατεύεσθαι
  choice: जिनसे अपने को नहीं रोकना है
  rationale: ἐγκρατεύομαι का सामान्य भाव आत्म-संयम है, पर यहाँ भलाई से विरत न रहने की जानबूझकर विरोधाभासी अभिव्यक्ति है; हिन्दी में अर्थ स्पष्ट रखते हुए यह तनाव बचाया गया है।
theological_decisions:
- issue: भले काम करने और उद्धार पाने का संबंध
  choice: “उन्हें करते हुए उद्धार पा सकूँ”
  alternative: “उनके कारण उद्धार कमा सकूँ” या “उद्धार मिलने के बाद उन्हें करूँ”
  rationale: यूनानी कृदंत और मुख्य क्रिया भले कामों तथा उद्धार के बीच संबंध रखते हैं, पर उसके सटीक धर्मशास्त्रीय स्वरूप को परिभाषित नहीं करते। अनुवाद न तो अर्जित उद्धार जोड़ता है, न कालक्रम उलटता है।
- issue: σωθῆναι में कर्तृत्व
  choice: निष्क्रिय भाव ‘उद्धार पा सकूँ’
  alternative: “अपने को बचा सकूँ”
  rationale: मूल में क्रिया निष्क्रिय है; इसलिए आत्म-उद्धार का आशय आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संवाद में ‘हे प्रभु’ और आदरसूचक क्रियाएँ प्रयुक्त हैं। मूल की ‘भलाई से आत्म-संयम न करना’ वाली जानबूझकर विरोधाभासी भाषा को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
