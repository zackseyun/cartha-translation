  text: “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says, “walk in them and do not exercise self‑control from them, and you will live to God.
translation:
  language: hi
  text: उसने कहा, “क्या ये बातें तुम्हें अच्छी लगती हैं?” मैंने कहा, “प्रभु, इनसे बढ़कर और क्या अच्छा है?” उसने कहा, “तो इन बातों के अनुसार चलो और इन्हें करने से अपने को मत रोको; तब तुम परमेश्वर के लिए जीवित रहोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύου ἐν αὐτοῖς
  choice: इन्हीं पर चलते रहो
  rationale: यूनानी मुहावरे में बताए गए सद्गुणों और भले कामों के अनुसार निरंतर जीवन बिताने का भाव है; ‘पर चलना’ उस नैतिक रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μὴ ἐγκρατεύου ἀπ᾿ αὐτῶν
  choice: इन्हें करने से अपने को मत रोको
  rationale: ἐγκρατεύομαι सामान्यतः आत्म-संयम रखने को कहता है, पर ἀπό के साथ यहाँ अच्छे कामों से विरत रहने का निषेध है। शाब्दिक ‘इनसे आत्म-संयम मत रखो’ हिन्दी में अस्पष्ट और अप्राकृतिक होता।
- source_word: ζήσῃ τῷ θεῷ
  choice: परमेश्वर के लिए जीवित रहोगे
  rationale: सम्प्रदान कारक τῷ θεῷ को ‘परमेश्वर के लिए’ देकर उसके प्रति उन्मुख जीवन का भाव रखा गया है, बिना इसे अधिक व्याख्यायित किए।
- source_word: κύριε
  choice: प्रभु
  rationale: सम्मानसूचक संबोधन और प्रसंग की धार्मिक गरिमा दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘परमेश्वर के लिए जीवित रहना’ का अर्थ
  choice: परमेश्वर के लिए जीवित रहोगे
  alternative: परमेश्वर की दृष्टि में जीवित रहोगे / परमेश्वर के साथ जीवित रहोगे
  rationale: यूनानी सम्प्रदान कारक कई संबंधसूचक अर्थ दे सकता है। मुख्य पाठ में निकटतम और स्वाभाविक रूप चुना गया है, पर किसी विशेष उद्धारशास्त्रीय व्याख्या को आरोपित नहीं किया गया।
- issue: भले कामों और जीवन के बीच संबंध
  choice: मूल का सीधा परिणामसूचक कथन बनाए रखा
  alternative: इसे केवल प्रमाण, साधन या प्रतिफल के रूप में स्पष्ट करना
  rationale: पाठ स्वयं कहता है कि इन बातों पर चलने से व्यक्ति परमेश्वर के लिए जीवित रहेगा। अनुवाद ने इस तनाव को किसी संप्रदायगत ढाँचे में नहीं बाँधा।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवादात्मक किंतु गरिमापूर्ण शैली। पूर्ववर्ती सूची की ओर संकेत करने वाले बहुवचन ‘ये बातें/इन्हीं’ को स्पष्ट रखा गया है।
