base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/005.yaml
  text: '“Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the servant of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire, deceit, vainglory, boastfulness, and whatever things are like these.”'
translation:
  language: hi
  text: 'मैंने पूछा, “हे प्रभु, क्या और भी बुरे काम हैं?” उन्होंने कहा, “हाँ, बहुत-से हैं, जिनसे परमेश्वर के सेवक को अपने आपको रोकना चाहिए: चोरी, झूठ, किसी का हक़ मारना, झूठी गवाही, लोभ, बुरी अभिलाषा, छल, व्यर्थ यश की लालसा, डींगबाज़ी, और इनके समान जितनी भी बातें हैं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλέμμα
  choice: चोरी
  rationale: यह संज्ञा चुराई हुई वस्तु अथवा चोरी के कृत्य का बोध करा सकती है; इस दुर्गुण-सूची में स्वाभाविक हिन्दी के लिए ‘चोरी’ उपयुक्त है।
- source_word: ἀποστέρησις
  choice: ठगी
  rationale: किसी को उसके अधिकार की वस्तु से वंचित करने या हड़पने का भाव है; ‘ठगी’ संक्षिप्त और सामान्य पाठक के लिए स्पष्ट है।
- source_word: πλεονεξία
  choice: लोभ
  rationale: और अधिक पाने की लालसा तथा लालच का व्यापक नैतिक अर्थ सुरक्षित रखता है।
- source_word: ἐπιθυμία πονηρά
  choice: बुरी अभिलाषा
  rationale: ἐπιθυμία की इच्छा/लालसा संबंधी व्यापकता को बनाए रखता है और इसे केवल यौन अर्थ तक सीमित नहीं करता।
- source_word: κενοδοξία
  choice: खोखली प्रतिष्ठा की चाह
  rationale: शाब्दिक रूप से ‘व्यर्थ महिमा’ का भाव है; यह हिन्दी पद आत्म-प्रदर्शन और निरर्थक मान-सम्मान की लालसा दोनों को समझने योग्य ढंग से व्यक्त करता है।
- source_word: ἀλαζονεία
  choice: डींग मारना
  rationale: दंभपूर्ण बड़ाई और शेखी के व्यवहारगत अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγκρατεύεσθαι
  choice: अपने आपको रोकना
  rationale: यहाँ बुरे कर्मों से संयम रखने का अर्थ है; प्रसंगानुकूल वाक्यांश हिन्दी में स्वाभाविक है और आत्म-संयम का बल बनाए रखता है।
theological_decisions:
- issue: θεοῦ के सेवक की पहचान
  choice: परमेश्वर के सेवक
  alternative: ईश्वर के दास
  rationale: ‘सेवक’ आधुनिक हिन्दी में गरिमापूर्ण और सहज है, जबकि मूल के धार्मिक समर्पण-संबंध को पर्याप्त रूप से बनाए रखता है; इसे किसी विशिष्ट सांप्रदायिक अर्थ में नहीं बाँधा गया।
- issue: κύριε का संबोधन
  choice: हे प्रभु
  alternative: स्वामी
  rationale: आदरपूर्ण प्रत्यक्ष संबोधन को सुरक्षित रखता है। प्रसंग में वक्ता अपने संवाद-सहचर को संबोधित कर रहा है; अनुवाद उसकी सटीक पहचान पर अतिरिक्त दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संवादात्मक किंतु गरिमापूर्ण शैली। दुर्गुणों की सूची को संक्षिप्त रखा गया है और यूनानी पाठ का क्रम सुरक्षित है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
