base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/003.yaml
  text: '“What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,” he says: “From adultery and fornication, from lawless drunkenness, from wicked luxury, from many foods and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander and hypocrisy, resentment, and every blasphemy.'
translation:
  language: hi
  text: 'मैंने पूछा, “प्रभु, वे कौन-कौन सी बुराइयाँ हैं जिनसे हमें अपने आप को रोकना चाहिए?” उसने कहा, “सुनो: व्यभिचार और यौन-अनैतिकता से; मर्यादाहीन मदहोशी से; दुष्ट भोग-विलास से; बहुत-से व्यंजनों, धन की विलासिता, डींग मारने, घमंड और अहंकार से; और झूठ, बदनामी, कपट, मन में बैर रखने और हर प्रकार की निंदा से।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρίαι
  choice: बुराइयाँ
  rationale: बहुवचन नैतिक दोषों की सामान्य और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: ἐγκρατεύεσθαι
  choice: अपने आप को रोकना
  rationale: यहाँ किसी वस्तु या आचरण से संयम बरतने का अर्थ है; साधारण पाठक के लिए सहज रखते हुए आत्मसंयम का भाव सुरक्षित है।
- source_word: μοιχείας
  choice: व्यभिचार
  rationale: विवाह-संबंध का उल्लंघन करने वाले यौन पाप का विशिष्ट अर्थ बनाए रखता है।
- source_word: πορνείας
  choice: यौन-अनैतिकता
  rationale: व्यभिचार से अलग, व्यापक अवैध यौन आचरण को व्यक्त करता है।
- source_word: μεθύσματος ἀνομίας
  choice: मर्यादाहीन मदहोशी
  rationale: μεθύσμα की मदहोशी और ἀνομία के नियम-विरोधी, बेलगाम चरित्र—दोनों को संक्षेप में व्यक्त करता है।
- source_word: τρυφῆς πονηρᾶς
  choice: दुष्ट भोग-विलास
  rationale: नैतिक रूप से दूषित विलासी जीवन का भाव रखता है।
- source_word: ἐδεσμάτων πολλῶν
  choice: बहुत अधिक खाने
  rationale: शाब्दिक ‘बहुत से भोजनों’ को प्रसंगानुसार अतिभोजन के स्वाभाविक हिन्दी रूप में दिया गया है।
- source_word: πολυτελείας πλούτου
  choice: धन की ऐशो-आराम भरी फिजूलखर्ची
  rationale: धन से जुड़ी खर्चीली विलासिता का नकारात्मक अर्थ स्पष्ट करता है।
- source_word: καυχήσεως
  choice: डींग मारने
  rationale: आत्मश्लाघा या boastfulness का सामान्य आधुनिक हिन्दी रूप।
- source_word: ὑψηλοφροσύνης
  choice: घमंड
  rationale: अपने को ऊँचा समझने की मनोवृत्ति को दर्शाता है।
- source_word: ὑπερηφανίας
  choice: अहंकार
  rationale: निकटवर्ती पर्याय के साथ स्रोत की दोष-सूची और अर्थ-तीव्रता बनाए रखता है।
- source_word: καταλαλιᾶς
  choice: बदनामी
  rationale: दूसरों के विरुद्ध अपमानजनक या निंदात्मक बोलने का भाव।
- source_word: ὑποκρίσεως
  choice: कपट
  rationale: दिखावे और दोहरेपन, दोनों को समेटने वाला संक्षिप्त नैतिक शब्द।
- source_word: μνησικακίας
  choice: मन में बैर रखने
  rationale: हानि को याद रखकर द्वेष पालने का अर्थ केवल ‘क्रोध’ की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: βλασφημίας
  choice: निंदा
  rationale: यह शब्द ईश्वर-निंदा या अपमानजनक वाणी दोनों को सूचित कर सकता है; व्यापक हिन्दी शब्द मूल की सीमा को अनावश्यक रूप से संकुचित नहीं करता।
theological_decisions:
- issue: βλασφημία का लक्ष्य
  choice: हर प्रकार की निंदा
  alternative: हर प्रकार की ईश्वर-निंदा
  rationale: यूनानी में यहाँ लक्ष्य स्पष्ट नहीं है। केवल ईश्वर-निंदा कहना वास्तविक व्यापकता और अस्पष्टता को संकुचित कर देता।
- issue: μοιχεία और πορνεία का भेद
  choice: व्यभिचार और यौन-अनैतिकता
  alternative: जारकर्म और व्यभिचार
  rationale: दोनों अलग पदों को अलग रखा गया है, पर आधुनिक पाठक के लिए अप्रचलित शब्दावली से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संवादात्मक किंतु गरिमापूर्ण शैली। दोषों की संचयी सूची और निकटार्थक पदों का तनाव यथासंभव सुरक्षित रखा गया है; किसी सम्प्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
