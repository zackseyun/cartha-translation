  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/002.yaml
  text: '“I wished, Sir,” I said, “to know what these various punishments are.” He said, “Listen. The various punishments and torments are torments of this present life: for some are punished with losses, some with deprivations, some with various sicknesses, some with every kind of disorder; some are insulted by the unworthy, and suffer in many other ways. For many, being unsettled in their plans, undertake many things, and nothing at all advances for them. They say of themselves that they do not prosper in their undertakings, and it does not rise up into their heart that they have done evil, but they blame the Lord.'
translation:
  language: hi
  text: मैंने कहा, “स्वामी, मैं जानना चाहता था कि ये विभिन्न दंड किस प्रकार के हैं।” उसने कहा, “सुनो। ये विभिन्न दंड और यातनाएँ इसी जीवन की यातनाएँ हैं। कुछ लोगों को हानियों से दंडित किया जाता है, कुछ को अभावों से, कुछ को तरह-तरह की बीमारियों से, और कुछ को हर प्रकार की अस्त-व्यस्तता से। कुछ लोग अयोग्य जनों से अपमानित होते हैं और अनेक दूसरे ढंगों से कष्ट सहते हैं। बहुत-से लोग अपनी योजनाओं में अस्थिर होकर बहुत-से काम हाथ में लेते हैं, पर उनका कोई काम बिल्कुल नहीं चलता। वे कहते हैं कि उन्हें अपने कामों में सफलता नहीं मिलती; उनके मन में यह बात उठती ही नहीं कि उन्होंने बुरे काम किए हैं, बल्कि वे प्रभु को दोष देते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμωρίας
  choice: दंड
  rationale: संदर्भ में सुधारात्मक अथवा प्रतिफलात्मक दंड का सामान्य अर्थ है; ‘सज़ा’ की अपेक्षा ‘दंड’ अधिक गरिमापूर्ण और व्यापक है।
- source_word: βάσανοι
  choice: यातनाएँ
  rationale: यह शब्द तीव्र दुःख और कष्ट को व्यक्त करता है; साथ के ‘दंड’ से उसका भेद भी बना रहता है।
- source_word: βιωτικαί
  choice: इसी जीवन की
  rationale: यहाँ सांसारिक या वर्तमान जीवन से संबंधित कष्ट अभिप्रेत हैं; सहज हिन्दी में कालगत आशय स्पष्ट किया गया है।
- source_word: ὑστερήσεσιν
  choice: अभावों
  rationale: वंचना, कमी और आवश्यक वस्तुओं की अनुपलब्धता—इन सभी को समेटने वाला स्वाभाविक विकल्प।
- source_word: ἀκαταστασίᾳ
  choice: अस्त-व्यस्तता
  rationale: अव्यवस्था, अस्थिरता या उथल-पुथल की व्यापकता बनाए रखता है; पाठ में ‘हर प्रकार की’ के साथ स्वाभाविक है।
- source_word: ἀκαταστατοῦντες ταῖς βουλαῖς
  choice: अपनी योजनाओं में अस्थिर होकर
  rationale: योजनाओं या विचारों में चंचलता और अनिश्चितता का मूल भाव सुरक्षित रहता है।
- source_word: προχωρεῖ
  choice: आगे नहीं बढ़ता
  rationale: उपक्रमों की प्रगति न होने का सीधा और मुहावरेदार हिन्दी रूप।
- source_word: οὐκ ἀναβαίνει ... ἐπὶ τὴν καρδίαν
  choice: उनके मन में यह बात उठती ही नहीं
  rationale: यूनानी हृदय-वाक्यांश की छवि को काफी हद तक रखते हुए आधुनिक हिन्दी में बोधगम्य बनाया गया है।
theological_decisions:
- issue: वर्तमान जीवन के कष्टों को दंड कहना
  choice: मूल पाठ के अनुसार इन्हें ‘इसी जीवन’ के दंड और यातनाएँ कहा गया है।
  alternative: इन्हें केवल सामान्य कठिनाइयाँ या अनुशासन कहना।
  rationale: खंड स्वयं इन्हें τιμωρίαι और βάσανοι कहता है; अनुवाद ने लेखक का कारणात्मक-धार्मिक दावा बनाए रखा है, पर उसमें अतिरिक्त सार्वभौमिक सिद्धांत नहीं जोड़ा।
- issue: प्रभु को दोष देना
  choice: ‘वे प्रभु को दोष देते हैं’ का सीधा कथन।
  alternative: ‘वे परमेश्वर से शिकायत करते हैं।’
  rationale: αἰτιῶνται में आरोप या दोषारोपण का भाव है; ‘शिकायत’ इसे अनावश्यक रूप से नरम कर देती।
