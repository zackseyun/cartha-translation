  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/003.yaml
  text: “When, then, they are afflicted with every affliction, then they are handed over to me for good discipline, and they are strengthened in the faith of the Lord; and the rest of the days of their life they serve the Lord with a pure heart. And if they repent, then the evil works that they did rise up into their heart; and then they glorify God, saying that he is a righteous judge and that each one suffered justly according to his deeds. Thereafter they serve the Lord with a pure heart, and they prosper in every work of theirs, receiving from the Lord whatever they ask for; and then they glorify the Lord because they were handed over to me, and they no longer suffer any of the evils.”
translation:
  language: hi
  text: “इसलिए जब वे हर प्रकार के क्लेश से दबाए जाते हैं, तब हितकारी अनुशासन के लिए उन्हें मुझे सौंप दिया जाता है। वे प्रभु के विश्वास में दृढ़ किए जाते हैं और अपने जीवन के शेष दिनों में शुद्ध हृदय से प्रभु की सेवा करते हैं। और यदि वे मन फिराते हैं, तो उनके किए हुए बुरे काम उनके मन में उभर आते हैं। तब वे परमेश्वर की महिमा करते हुए कहते हैं कि वह एक न्यायपूर्ण न्यायाधीश है और प्रत्येक ने अपने कामों के अनुसार जो कुछ भोगा, वह उचित ही भोगा। इसके बाद वे शुद्ध हृदय से प्रभु की सेवा करते हैं और अपने हर काम में सफल होते हैं; वे प्रभु से वह सब पाते हैं जो माँगते हैं। तब वे प्रभु की महिमा करते हैं कि उन्हें मुझे सौंपा गया था, और अब वे उन बुराइयों में से कोई भी नहीं सहते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάσῃ θλίψει
  choice: हर प्रकार के क्लेश
  rationale: ग्रीक अभिव्यक्ति की व्यापकता बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: εἰς ἀγαθὴν παιδείαν
  choice: अच्छे अनुशासन के लिए
  rationale: παιδεία यहाँ दंड मात्र नहीं, सुधार और प्रशिक्षण देने वाला अनुशासन है; ‘अच्छा’ ἀγαθή को स्पष्ट रखता है।
- source_word: ἰσχυροποιοῦνται
  choice: दृढ़ किए जाते हैं
  rationale: कर्मवाच्य बलवर्धन को सुरक्षित रखते हुए सहज धार्मिक हिन्दी चुनी गई है।
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτῶν
  choice: उनके मन में उभर आते हैं
  rationale: मूल के ‘हृदय पर चढ़ आने’ वाले रूपक का स्वाभाविक हिन्दी समतुल्य है और स्मरण तथा अंतर्बोध दोनों की गुंजाइश रखता है।
- source_word: εὐοδοῦνται
  choice: सफल होते हैं
  rationale: संदर्भ में उनके कार्यों के सुचारु रूप से आगे बढ़ने और फलने का अर्थ है; ‘सफल’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: τῶν πονηρῶν
  choice: उन बुरी बातों
  rationale: ग्रीक बहुवचन व्यापक है और विपत्तियों, कष्टों या बुरे परिणामों में से किसी एक तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: क्लेश, अनुशासन और मन फिराव का संबंध
  choice: मूल का क्रम और ‘यदि वे मन फिराते हैं’ की शर्त यथावत रखी गई है।
  alternative: अनुशासन को स्वतः पश्चात्ताप उत्पन्न करने वाला बताना।
  rationale: ग्रीक ἐὰν δὲ μετανοήσωσι सशर्त है; पाठ में मौजूद धार्मिक तनाव को व्याख्या द्वारा समाप्त नहीं किया गया।
- issue: ‘प्रभु के विश्वास में’ का आशय
  choice: प्रभु के विश्वास में
  alternative: प्रभु पर विश्वास में
  rationale: τῇ πίστει τοῦ Κυρίου संबंधवाचक रूप में कुछ अस्पष्टता रखता है; अनुवाद ने उसे केवल वस्तुगत ‘प्रभु पर विश्वास’ के रूप में निश्चित नहीं किया।
- issue: माँगी हुई हर वस्तु की प्राप्ति
  choice: वे प्रभु से वह सब पाते हैं जो माँगते हैं
  alternative: वे प्रभु की इच्छा के अनुसार माँगी हुई वस्तुएँ पाते हैं
  rationale: मूल वाक्य में कोई अतिरिक्त योग्यता नहीं है; इसलिए धर्मशास्त्रीय स्पष्टीकरण जोड़ने से बचा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘मन फिराना’, ‘शुद्ध हृदय’, ‘महिमा करना’ और ‘न्यायी न्यायाधीश’ जैसे स्थापित धार्मिक पद मूल के निकट रहते हुए प्रयुक्त हुए हैं। वक्ता दंड के स्वर्गदूत के रूप में पूर्ववर्ती प्रसंग से पहचाना जाता है, इसलिए ‘मेरे हाथ’ स्वाभाविक रूप से अधिकार और देखरेख दोनों दर्शाता है।
