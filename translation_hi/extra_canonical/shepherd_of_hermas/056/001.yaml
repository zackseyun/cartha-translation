  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/001.yaml
  text: Therefore, seeing them being scourged and afflicted like this, I was grieved for them, because they were being tormented in this way and had no respite at all. I said to the shepherd who was speaking with me, “Sir, who is this shepherd, so pitiless and harsh, showing no compassion at all for these sheep?” He said, “This is the angel of punishment; he is one of the righteous angels, appointed over punishment. Therefore he takes charge of those who have wandered away from God and have gone after the desires and deceits of this age, and he punishes them, as they deserve, with dreadful and various punishments.”
translation:
  language: hi
  text: इसलिए, जब मैंने उन्हें इस प्रकार कोड़े खाते और कष्ट सहते देखा, तो मुझे उनके लिए दुःख हुआ, क्योंकि उन्हें इस तरह यातना दी जा रही थी और उन्हें तनिक भी राहत नहीं थी। मैंने उस चरवाहे से, जो मुझसे बात कर रहा था, कहा, “स्वामी, यह चरवाहा कौन है, जो इतना निर्दयी और कठोर है और इन भेड़ों पर तनिक भी दया नहीं करता?” उसने कहा, “यह दण्ड देने वाला स्वर्गदूत है। यह धर्मी स्वर्गदूतों में से एक है और दण्ड के कार्य पर नियुक्त है। इसलिए यह उन लोगों को अपने अधिकार में लेता है जो परमेश्वर से भटक गए हैं और इस युग की अभिलाषाओं और छल-कपट के पीछे चल पड़े हैं; और उनकी योग्यता के अनुसार यह उन्हें भयंकर और तरह-तरह के दण्ड देता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαστιγούμενα
  choice: कोड़े खाते
  rationale: क्रिया का ठोस दण्डात्मक अर्थ बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: ταλαιπωρούμενα
  choice: कष्ट सहते
  rationale: व्यापक दुर्दशा और पीड़ा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνοχήν
  choice: राहत
  rationale: इस प्रसंग में यातना से विराम या अवकाश का भाव है; ‘राहत’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἄσπλαγχνος καὶ πικρός
  choice: निर्दयी और कठोर
  rationale: करुणा के अभाव और कठोर व्यवहार—दोनों अलग भावों को सुरक्षित रखता है।
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: दण्ड देने वाला स्वर्गदूत
  rationale: सम्बन्धवाचक यूनानी पद को हिन्दी में कार्यसूचक रूप देकर अस्पष्टता घटाता है, बिना उसकी भूमिका बदलने के।
- source_word: παραλαμβάνει
  choice: अपने अधिकार में लेता है
  rationale: केवल साथ लेने की अपेक्षा यहाँ हिरासत या प्रभार ग्रहण करने का अर्थ अधिक उपयुक्त है।
- source_word: ἐπιθυμίαις καὶ ἀπάταις τοῦ αἰῶνος τούτου
  choice: इस युग की अभिलाषाओं और छल-कपट
  rationale: αἰών को ‘युग’ और ἀπάται को उसके बहुवचन तथा नैतिक अर्थ के अनुरूप ‘छल-कपट’ से व्यक्त किया गया है।
- source_word: δειναῖς καὶ ποικίλαις τιμωρίαις
  choice: भयंकर और तरह-तरह के दण्ड
  rationale: तीव्रता और विविधता दोनों को सरल, dignified आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दण्ड देने वाले स्वर्गदूत की नैतिक स्थिति
  choice: ‘धर्मी स्वर्गदूतों में से एक’ और ‘दण्ड देने के लिए नियुक्त’—दोनों कथनों को यथावत रखा गया।
  alternative: उसे दुष्ट या पतित स्वर्गदूत समझाने वाली भाषा जोड़ना।
  rationale: मूल पाठ दण्ड की कठोरता के बावजूद उसे धर्मी और नियुक्त बताता है; इस तनाव को हल किए बिना सुरक्षित रखना आवश्यक है।
- issue: दण्ड और पात्रता का सम्बन्ध
  choice: ‘जैसे दण्ड के वे योग्य हैं, वैसे ही’
  alternative: दण्ड को केवल सुधारात्मक अनुशासन या केवल प्रतिशोध के रूप में स्पष्ट करना।
  rationale: καθὼς ἄξιοί εἰσι पात्रता के अनुसार दण्ड बताता है, पर इस खण्ड में उसके पूरे धार्मिक प्रयोजन को एकांगी रूप से परिभाषित नहीं करता।
- issue: ‘इस युग’ का अर्थ
  choice: ‘इस युग’
  alternative: ‘संसार’ या ‘दुनियावी जीवन’
  rationale: αἰών की कालगत और धार्मिक अनुगूँज को बनाए रखता है और अनावश्यक व्याख्या से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘स्वामी’ संबोधन κύριε की विनम्रता को दर्शाता है। वाक्य-रचना को हिन्दी में स्वाभाविक बनाया गया है, जबकि यातना, दया के अभाव, स्वर्गदूत की धार्मिक स्थिति और पात्रतानुसार दण्ड के मूल तनाव सुरक्षित रखे गए हैं। यूनानी आलोचनात्मक कोष्ठक [οὕτως] का अर्थ प्रसंग में ‘इतना’ से सहज रूप में आया है; प्रकाशन-पाठ में अलग पाठालोचनात्मक पादटिप्पणी आवश्यक नहीं समझी गई।
