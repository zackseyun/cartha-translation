base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/003.yaml
  text: '"He is not able," he says, "to tyrannize the servants of God—those who hope in him with their whole heart. The devil can wrestle against them, but he cannot overcome them. If, therefore, you resist him, defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil as though he had power.'
translation:
  language: hi
  text: “वह परमेश्वर के उन सेवकों पर प्रभुत्व नहीं जमा सकता,” उसने कहा, “जो पूरे मन से उस पर आशा रखते हैं। शैतान उनसे कुश्ती तो कर सकता है, पर उन्हें पछाड़ नहीं सकता। इसलिए यदि तुम उसका सामना करोगे, तो वह हारकर और लज्जित होकर तुमसे दूर भाग जाएगा। पर जो खाली हैं,” उसने कहा, “वे शैतान से ऐसे डरते हैं, मानो उसके पास सामर्थ्य हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταδυναστεύειν
  choice: प्रभुत्व जमा सकता
  rationale: यह क्रिया बलपूर्वक अधीन करने या अत्याचारी नियंत्रण रखने का भाव देती है; सहज हिंदी में ‘प्रभुत्व जमाना’ इस भाव को स्पष्ट रखता है।
- source_word: ἐξ ὅλης καρδίας ἐλπιζόντων ἐπ’ αὐτόν
  choice: जो पूरे मन से उस पर आशा रखते हैं
  rationale: ‘पूरे मन से’ καρδία के समग्र आंतरिक समर्पण को स्वाभाविक हिंदी में व्यक्त करता है, और ‘उस पर’ मूल के सर्वनाम को बनाए रखता है।
- source_word: ἀντιπαλαῖσαι … καταπαλαῖσαι
  choice: कुश्ती तो लड़ सकता है, पर … पछाड़ नहीं सकता
  rationale: दोनों यूनानी क्रियाओं में कुश्ती का साझा रूपक और विरोध—मुकाबला करना बनाम निर्णायक रूप से पछाड़ देना—सुरक्षित रखा गया है।
- source_word: κατῃσχυμμένος
  choice: लज्जित होकर
  rationale: यह पराजय के साथ अपमानित या लज्जित होने की अवस्था बताता है।
- source_word: ἀπόκενοί
  choice: खाली
  rationale: आगे आने वाले अधभरे या खाली पात्रों के दृष्टांत की शब्द-संगति बनाए रखने के लिए सीधा रूपक रखा गया है।
- source_word: ὡς δύναμιν ἔχοντα
  choice: मानो उसके पास सामर्थ्य हो
  rationale: यह वास्तविक शक्ति की पुष्टि नहीं, भयभीत लोगों की धारणा है; ‘मानो’ उस भेद को सुरक्षित रखता है।
theological_decisions:
- issue: शैतान की सामर्थ्य और परमेश्वर के सेवकों पर उसका नियंत्रण
  choice: वह मुकाबला कर सकता है, पर पूरे मन से परमेश्वर पर आशा रखने वालों को पछाड़ या अपने अधीन नहीं कर सकता
  alternative: शैतान किसी भी अर्थ में उन पर आक्रमण नहीं कर सकता
  rationale: मूल पाठ ἀντιπαλαῖσαι की संभावना और καταπαλαῖσαι की असंभवता के बीच स्पष्ट तनाव रखता है; अनुवाद उसी भेद को बनाए रखता है।
- issue: ἐπ’ αὐτόν में सर्वनाम का संकेत
  choice: ‘उस पर’ के रूप में सर्वनाम बनाए रखा
  alternative: स्पष्ट करके ‘परमेश्वर पर’ कहना
  rationale: निकट संदर्भ से संकेत परमेश्वर की ओर है, फिर भी मूल की सर्वनामात्मक अभिव्यक्ति और उसकी औपचारिक बनावट को अनावश्यक रूप से नहीं खोला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कुश्ती’ और ‘पछाड़ना’ द्वारा मूल का जीवंत युद्ध-क्रीड़ा रूपक सुरक्षित है; संबोधन बहुवचन ‘तुम’ से समुदाय को दिए गए निर्देश का रूप बना रहता है।
