base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/005.yaml
  text: '"So also the devil comes upon all the servants of God, testing them. Therefore, as many as are full in faith have strongly resisted him, and he withdraws from them, having no place where he may enter. He comes then to the empty ones; and having a place, he enters into them, and he does in them what he wishes, and they become enslaved to him."'
translation:
  language: hi
  text: “इसी प्रकार शैतान भी परमेश्वर के सब सेवकों के पास आकर उनकी परीक्षा करता है। इसलिए जो विश्वास से परिपूर्ण हैं, वे दृढ़ता से उसका सामना करते हैं; और वह उनके पास से हट जाता है, क्योंकि उसे भीतर प्रवेश करने की कोई जगह नहीं मिलती। तब वह उन लोगों के पास आता है जो खाली हैं; और जगह पाकर उनके भीतर प्रवेश कर जाता है। फिर वह उनके भीतर वही करता है जो चाहता है, और वे उसके दास बन जाते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: परीक्षा करता है
  rationale: यह कृदन्त शैतान द्वारा सेवकों को परखने या प्रलोभन में डालने का भाव रखता है। ‘परीक्षा’ मूल की व्यापकता बनाए रखता है और केवल ‘लुभाने’ तक अर्थ को सीमित नहीं करता।
- source_word: πλήρεις ... ἐν τῇ πίστει
  choice: विश्वास से परिपूर्ण
  rationale: पात्रों के भरे और खाली होने के ठीक पिछले रूपक को बनाए रखते हुए ग्रीक अभिव्यक्ति का स्वाभाविक हिन्दी रूप।
- source_word: ἀνθεστήκασιν
  choice: उसका सामना करते हैं
  rationale: क्रिया का अर्थ विरोध में दृढ़ खड़े होना है; ‘सामना करते हैं’ वर्तमान हिन्दी में स्वाभाविक है, जबकि ‘दृढ़ता से’ उसकी शक्ति को व्यक्त करता है।
- source_word: ἀπόκενοι
  choice: जो खाली हैं
  rationale: यह पिछले पदों के खाली पात्रों वाले रूपक से जुड़ा विशेष शब्द है। ‘खाली’ उस रूपकीय संबंध को प्रत्यक्ष रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ὑπόδουλοι
  choice: उसके दास बन जाते हैं
  rationale: शब्द अधीन दासत्व को व्यक्त करता है। ‘दास’ मूल की कठोरता और नैतिक-आध्यात्मिक पराधीनता दोनों बनाए रखता है।
theological_decisions:
- issue: विश्वास से परिपूर्ण लोगों पर शैतान की शक्ति
  choice: ‘उसे भीतर प्रवेश करने की कोई जगह नहीं मिलती’
  alternative: ‘उन पर उसका कोई अधिकार नहीं रहता’
  rationale: चुना हुआ पाठ मूल के स्थान और प्रवेश के चित्र को सुरक्षित रखता है तथा शैतान की शक्ति के बारे में मूल से अधिक व्यवस्थित धर्मवैज्ञानिक दावा नहीं करता।
- issue: खाली लोगों के भीतर शैतान का प्रवेश
  choice: रूपक को बिना परिभाषित किए ‘जो खाली हैं’ रखा गया
  alternative: ‘जो विश्वास में खाली/कमज़ोर हैं’
  rationale: निकटवर्ती संदर्भ विश्वास की ओर संकेत करता है, पर इस वाक्य में ग्रीक केवल ‘खाली’ कहता है। अनुवाद मूल की संक्षिप्तता और संभावित व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘परमेश्वर के सेवक’, ‘विश्वास से परिपूर्ण’ और ‘दास’ जैसे पद आरंभिक मसीही उपदेशात्मक शैली को बनाए रखते हैं। पिछले अनुच्छेद के भरे और खाली पात्रों के रूपक से संबंध स्पष्ट रखने के लिए ‘परिपूर्ण’ और ‘खाली’ की शब्दावली सुरक्षित रखी गई है।
