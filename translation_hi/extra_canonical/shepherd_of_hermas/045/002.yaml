base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/002.yaml
  text: '"A person," I say, "Lord, is eager to keep the commandments of God, and there is no one who does not ask from the Lord to be strengthened in his commandments and to be subject to them; but the devil is harsh and tyrannizes them."'
translation:
  language: hi
  text: मैंने कहा, “हे प्रभु, मनुष्य परमेश्वर की आज्ञाओं का पालन करने को उत्सुक रहता है, और ऐसा कोई नहीं जो प्रभु से यह न माँगता हो कि वह उसकी आज्ञाओं में सामर्थ्य पाए और उनके अधीन रहे; परन्तु शैतान कठोर है और उन पर अत्याचार करता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόθυμός
  choice: उत्सुक
  rationale: यह तत्पर इच्छा और तैयार मन—दोनों का स्वाभाविक आधुनिक हिन्दी में संप्रेषण करता है।
- source_word: φυλάσσειν
  choice: पालन करने
  rationale: आज्ञाओं के संदर्भ में ‘पालन करना’ सामान्य और अर्थानुकूल हिन्दी प्रयोग है।
- source_word: ἐνδυναμωθῇ ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: उसकी आज्ञाओं में सामर्थ्य पाए
  rationale: ग्रीक के ‘आज्ञाओं में सामर्थी किया जाए’ को निकट रखते हुए कृत्रिम कर्मवाच्य से बचाया गया है; ‘में’ संबंध की मूल अस्पष्टता को बनाए रखता है।
- source_word: ὑποταγῇ αὐταῖς
  choice: उनके अधीन रहे
  rationale: ὑποτάσσω की अधीनता का भाव स्पष्ट रखता है और आज्ञाओं के प्रति समर्पण को केवल ‘पालन’ में विलीन नहीं करता।
- source_word: σκληρός
  choice: कठोर
  rationale: मूल विशेषण का सीधा अर्थ सुरक्षित रहता है; इसे ‘निर्दयी’ कहकर भाव को अनावश्यक रूप से तीव्र नहीं किया गया।
- source_word: καταδυναστεύει
  choice: अत्याचार करता है
  rationale: क्रिया के दमनकारी प्रभुत्व के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आज्ञाओं में सामर्थ्य पाने का कर्ता
  choice: ‘वह ... सामर्थ्य पाए’
  alternative: ‘उसे सामर्थी किया जाए’
  rationale: ग्रीक कर्मवाच्य है और सामर्थ्य देने वाले को स्पष्ट नहीं करता; हिन्दी वाक्य प्रभु से माँगने का संदर्भ बनाए रखता है, पर किसी विशिष्ट सिद्धान्तगत सूत्र को नहीं जोड़ता।
- issue: आज्ञाओं के प्रति ὑποταγή
  choice: ‘उनके अधीन रहे’
  alternative: ‘उनका आज्ञाकारी बने’
  rationale: ‘अधीन’ मूल के समर्पण/अधीनता के तनाव को बचाता है और इसे केवल सामान्य आज्ञाकारिता तक सीमित नहीं करता।
- issue: बहुवचन αὐτῶν का संदर्भ
  choice: ‘उन पर’ अर्थात मनुष्यों/लोगों पर
  alternative: एकवचन ‘उस पर’
  rationale: ग्रीक बहुवचन उसी सामान्य कथन में आने वाले लोगों की ओर संकेत करता है; अनुवाद संख्या को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संवादात्मक पर गरिमापूर्ण शैली। ‘हे प्रभु’ संबोधन प्राचीन धार्मिक संवाद का स्वर रखता है; वाक्य-विन्यास को पठनीय बनाया गया है, जबकि मूल के तर्क और सर्वनाम-संबंध सुरक्षित हैं।
