base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/004.yaml
  text: '"When a man fills very many clay jars with good wine, and among those jars a few are empty, he comes to the jars and does not inspect the full ones—for he knows they are full—but he inspects the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the pleasure of the wine is lost.'
translation:
  language: hi
  text: “जब कोई मनुष्य बहुत-से मिट्टी के मटकों को उत्तम दाखमधु से भरता है और उन मटकों में से कुछ खाली होते हैं, तो वह मटकों के पास आकर भरे हुओं को नहीं जाँचता—क्योंकि वह जानता है कि वे भरे हैं—बल्कि खाली मटकों को जाँचता है, इस डर से कि कहीं वे खट्टे न हो गए हों। क्योंकि खाली मटके जल्दी खट्टे हो जाते हैं और दाखमधु का आनंद नष्ट हो जाता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεράμια
  choice: मिट्टी के मटके
  rationale: यह शब्द मिट्टी के बने पात्रों को सूचित करता है; ‘मटके’ सामान्य हिन्दी पाठक के लिए स्वाभाविक और प्रसंगानुकूल है।
- source_word: οἴνου καλοῦ
  choice: उत्तम दाखमधु
  rationale: ‘दाखमधु’ प्राचीन मदिरा-संदर्भ को स्पष्ट रखता है और καλοῦ की गुणवत्ता को ‘उत्तम’ व्यक्त करता है।
- source_word: ἀπόκενα
  choice: खाली
  rationale: यहाँ भरे हुए मटकों के स्पष्ट विरोध में रिक्त पात्र अभिप्रेत हैं; सरल हिन्दी ‘खाली’ रूपक को सहज रखती है।
- source_word: κατανοεῖ
  choice: जाँचता
  rationale: प्रसंग में इसका अर्थ ध्यान देकर निरीक्षण करना है; ‘जाँचता’ इस व्यावहारिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὤξισαν / ὀξίζουσι
  choice: खट्टे न हो गए हों / जल्दी खट्टे हो जाते हैं
  rationale: दोनों क्रियारूपों में अम्लीय या खट्टा हो जाने का भाव है; हिन्दी में समान शब्दावली रखने से कथन की पुनरावृत्ति और तर्क सुरक्षित रहते हैं।
- source_word: ἡ ἡδονὴ τοῦ οἴνου
  choice: दाखमधु का स्वाद
  rationale: शाब्दिक भाव ‘दाखमधु का आनंद/सुखद गुण’ है; पात्र और खट्टेपन के संदर्भ में ‘स्वाद’ सहज रूप से उसका आनंददायक गुण व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल उपमा की कुछ असामान्यता—खाली मटकों का स्वयं ‘खट्टा हो जाना’—को व्याख्या जोड़कर दूर नहीं किया गया, ताकि स्रोत का रूपक और उसकी तनावपूर्ण अभिव्यक्ति बनी रहे।
