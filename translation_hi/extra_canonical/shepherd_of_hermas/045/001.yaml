base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/001.yaml
  text: I say to him, "Lord, listen to a few words from me." He says, "Speak what you wish."
translation:
  language: hi
  text: मैं उससे कहता हूँ, “प्रभु, मेरी कुछ बातें सुनिए।” वह कहता है, “जो तुम चाहते हो, कहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: प्रभु
  rationale: यह संबोधन सम्मान और अधिकार दोनों व्यक्त करता है; प्रसंग में स्वाभाविक हिन्दी रूप है।
- source_word: ἄκουσόν μου ὀλίγων ῥημάτων
  choice: मेरी कुछ बातें सुनिए
  rationale: यूनानी वाक्य का अर्थ ‘मेरे थोड़े-से शब्द सुनिए’ है; आधुनिक हिन्दी में ‘मेरी कुछ बातें’ अधिक स्वाभाविक है और आशय सुरक्षित रखता है।
- source_word: Λέγε
  choice: कहो
  rationale: आज्ञार्थक क्रिया का सीधा, सहज हिन्दी रूप।
- source_word: ὃ βούλει
  choice: जो तुम चाहते हो
  rationale: इच्छा व्यक्त करने वाले βούλει का निकट और स्वाभाविक अनुवाद; कथन की खुली प्रकृति बनाए रखता है।
