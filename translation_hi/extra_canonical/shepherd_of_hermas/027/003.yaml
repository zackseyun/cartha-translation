base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/003.yaml
  text: Slander is evil; it is an unsettled demon, never at peace, but always dwelling amid divisions. So keep away from it, and you will always have prosperity with all.
translation:
  language: hi
  text: बदनामी करना बुरी बात है; यह एक अशांत दुष्टात्मा है, जो कभी शांति से नहीं रहती, बल्कि सदा फूट के बीच वास करती है। इसलिए इससे दूर रहो, और तुम सदा सबके साथ सुख-समृद्धि में रहोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλία
  choice: बदनामी करना
  rationale: यह शब्द किसी के विरुद्ध निंदात्मक या अपमानजनक बातें कहने को दर्शाता है; आधुनिक सामान्य हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: ἀκατάστατον
  choice: अशांत
  rationale: यह अस्थिर, उपद्रवी और शांति-विहीन दशा को व्यक्त करता है; अगले वाक्यांश ‘कभी शांति से नहीं रहती’ से इसका आशय और स्पष्ट होता है।
- source_word: δαιμόνιον
  choice: दुष्टात्मा
  rationale: स्रोत में इसे केवल रूपकात्मक प्रवृत्ति नहीं, एक दैवी-विरोधी आत्मिक सत्ता के रूप में व्यक्त किया गया है; ‘दुष्टात्मा’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक रूप से रखता है।
- source_word: διχοστασίαις
  choice: फूट
  rationale: बहुवचन यूनानी शब्द मतभेद से उत्पन्न विभाजनों और कलह को दर्शाता है; ‘फूट’ संक्षेप में दोनों भाव समेटता है।
- source_word: εὐθηνίαν
  choice: सुख-शांति के संबंध
  rationale: शब्द समृद्धि, कुशलता या अनुकूल दशा का व्यापक भाव रखता है। ‘सब लोगों के साथ’ के संबंधपरक संदर्भ में इसे केवल भौतिक ‘समृद्धि’ न मानकर मेलपूर्ण कुशल संबंधों के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: καταλαλία को दुष्टात्मा कहना
  choice: 'व्यक्तित्वसूचक भाषा बनाए रखी गई: ‘यह एक अशांत दुष्टात्मा है’'
  alternative: इसे केवल ‘एक अशांत करने वाली बुराई’ या ‘दुष्ट प्रवृत्ति’ कहना
  rationale: मूल पाठ स्पष्ट रूप से δαιμόνιον का प्रयोग करता है और आगे स्त्रीलिंग क्रियात्मक भाषा से उसके व्यवहार का वर्णन करता है। इसे मनोवैज्ञानिक प्रवृत्ति मात्र बनाना मूल की आत्मिक और नैतिक तीव्रता को घटाता।
- issue: εὐθηνία का आशय
  choice: सभी के साथ सुख-शांति के संबंध
  alternative: सभी के साथ समृद्धि
  rationale: शब्द में समृद्धि का भाव संभव है, पर μετά πάντων संबंधपरक संदर्भ देता है। अनुवाद मूल की व्यापक कुशलता को पारस्परिक मेल के संदर्भ में रखता है, बिना इसे केवल धन-संपत्ति तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण उपदेशात्मक शैली। यूनानी वाक्य की तीव्र व्यक्तित्वसूचक छवि सुरक्षित रखी गई है और अंतिम पद को स्वाभाविक हिन्दी में संबंधपरक रूप दिया गया है।
