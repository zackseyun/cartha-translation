base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/006.yaml
  text: Therefore the one who gives is innocent; for just as he received from the Lord the ministry to carry out, he carried it out simply, making no distinction as to whom he should give or not give. Thus this ministry, having been carried out simply, became glorious before God. Therefore the one who thus ministers simply to God will live.
translation:
  language: hi
  text: इसलिए देनेवाला निर्दोष है; क्योंकि प्रभु से जिस सेवा को पूरा करने का दायित्व उसे मिला था, उसे उसने निष्कपट भाव से पूरा किया और यह भेद नहीं किया कि किसे दे और किसे न दे। इस प्रकार निष्कपट भाव से पूरी की गई यह सेवा परमेश्वर की दृष्टि में महिमामय हुई। इसलिए जो इस तरह निष्कपट भाव से परमेश्वर की सेवा करता है, वह जीवित रहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जीवित रहेगा” का आशय यहाँ केवल सांसारिक जीवन या स्पष्ट रूप से अनन्त जीवन—किसी एक तक सीमित नहीं किया गया है।
    reason: यूनानी ζήσεται का सीधा अर्थ ‘वह जीवित रहेगा’ है; संदर्भ में इसका व्यापक धार्मिक अर्थ हो सकता है, पर पाठ उसे और स्पष्ट नहीं करता।
lexical_decisions:
- source_word: ἀθῷος
  choice: निर्दोष
  rationale: यह शब्द दंड या दोष के लिए उत्तरदायी न होने का भाव व्यक्त करता है; संदर्भ में देनेवाला प्राप्तकर्ता के दुरुपयोग के लिए दोषी नहीं है।
- source_word: διακονία / διακονῶν
  choice: सेवा / सेवा करता है
  rationale: एक ही यूनानी शब्द-परिवार की पुनरावृत्ति को हिन्दी में बनाए रखा गया है। यहाँ इसका आशय प्रभु से मिली सहायता बाँटने की जिम्मेदारी निभाना है।
- source_word: ἁπλῶς
  choice: निष्कपट भाव से
  rationale: संदर्भ में यह बिना पक्षपात, संदेह या छिपे स्वार्थ के सीधे मन से देने को दर्शाता है। ‘निष्कपट भाव से’ सामान्य हिन्दी में स्वाभाविक रहते हुए इस नैतिक अर्थ को व्यक्त करता है।
- source_word: ἔνδοξος παρὰ τῷ Θεῷ
  choice: परमेश्वर के सामने महिमामय ठहरी
  rationale: ‘महिमामय’ मूल के गौरवसूचक अर्थ को बनाए रखता है और ‘परमेश्वर के सामने’ उसके मूल्यांकन या दृष्टि का भाव देता है।
- source_word: ζήσεται
  choice: जीवित रहेगा
  rationale: भविष्यकाल और ‘जीना’ के सीधे कथन को बनाए रखा गया है; इसे केवल वर्तमान समृद्धि या स्पष्ट रूप से अनन्त जीवन तक सीमित नहीं किया गया।
theological_decisions:
- issue: देनेवाले की निर्दोषता
  choice: देनेवाला निर्दोष है
  alternative: देनेवाला हर प्रकार के नैतिक विचार से मुक्त है
  rationale: मूल कथन संदर्भतः प्राप्तकर्ता की नीयत या उपयोग के लिए देनेवाले को दोषी नहीं ठहराता; इसे विवेक या नैतिक जिम्मेदारी के सर्वव्यापी निषेध के रूप में विस्तृत नहीं किया गया।
- issue: ζήσεται में जीवन का स्वरूप
  choice: वह जीवित रहेगा
  alternative: वह अनन्त जीवन पाएगा
  rationale: यूनानी पाठ जीवन के स्वरूप को यहाँ स्पष्ट नहीं करता। शाब्दिक भविष्यवाणी उसके सम्भावित वर्तमान और अंतिम—दोनों आयाम खुले रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘निष्कपट भाव से’ की पुनरावृत्ति मूल में ἁπλῶς की पुनरावृत्ति को दर्शाती है; ‘सेवा’ भी διακονία और διακονῶν के शब्द-संबंध को बनाए रखती है।
