base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/005.yaml
  text: Therefore those who receive will render an account to God why they received and for what; for those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay the penalty.
translation:
  language: hi
  text: इसलिए जो लोग लेते हैं, वे परमेश्वर को लेखा देंगे कि उन्होंने क्यों और किस उद्देश्य से लिया; क्योंकि जो लोग संकट में होने पर लेते हैं, उनका न्याय नहीं किया जाएगा, पर जो लोग कपट से लेते हैं, वे दण्ड भोगेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαμβάνοντες
  choice: जो लोग लेते हैं
  rationale: दान या सहायता ग्रहण करने का अर्थ संदर्भ से स्पष्ट है; सरल और व्यापक अभिव्यक्ति मूल की पुनरावृत्ति को बनाए रखती है।
- source_word: ἀποδώσουσιν λόγον
  choice: लेखा देंगे
  rationale: यह उत्तरदायित्व और हिसाब देने की प्रचलित अर्थवत्ता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διατί ... καὶ εἰς τί
  choice: क्यों और किस काम के लिए
  rationale: पहला पद ग्रहण करने के कारण और दूसरा उसके प्रयोजन की ओर संकेत करता है; दोनों प्रश्नों का भेद सुरक्षित रखा गया है।
- source_word: θλιβόμενοι
  choice: तंगी के कारण
  rationale: शब्द पीड़ित या संकटग्रस्त होने का भाव रखता है; दान लेने के संदर्भ में वास्तविक अभाव अथवा विवशता को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν ὑποκρίσει
  choice: कपट से
  rationale: झूठे बहाने या ढोंग के साथ लेने का नैतिक भाव संक्षेप में सुरक्षित रहता है।
- source_word: τίσουσιν δίκην
  choice: दण्ड भोगेंगे
  rationale: मूल मुहावरे का अर्थ दण्ड या न्यायिक प्रतिफल चुकाना है; यह हिन्दी में स्वाभाविक और गंभीर है।
theological_decisions:
- issue: वास्तविक संकट में सहायता लेने वालों का न्याय
  choice: उनका न्याय नहीं किया जाएगा
  alternative: वे दोषी नहीं ठहराए जाएँगे
  rationale: οὐ δικασθήσονται का न्यायिक स्वर सीधे रखा गया है और कथन की स्पष्ट विषमता—संकटग्रस्त बनाम कपटी ग्रहणकर्ता—बनी रहती है।
- issue: कपट से लेने वालों का परिणाम
  choice: वे दण्ड भोगेंगे
  alternative: वे दण्ड चुकाएँगे
  rationale: दण्ड के स्वरूप या अवधि को निर्धारित किए बिना मूल के प्रतिफल संबंधी कथन को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल यूनानी की कारण और प्रयोजन संबंधी द्विपदी तथा न्यायिक तनाव को बिना अतिरिक्त व्याख्या के बनाए रखा गया है।
