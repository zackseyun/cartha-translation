review_pass:
  verdict: revise
  source_fidelity: Draft correctly renders the accountability formula, the contrast between afflicted and hypocritical recipients, and the penalty. However, “तंगी के कारण” narrows θλιβόμενοι (“being afflicted/distressed”) to financial want; the Greek can include broader distress or hardship.
  naturalness: The Hindi is clear, idiomatic, and appropriately formal. “संकट में होने पर” is equally natural while retaining the broader sense of the source.
  terminology: “लेखा देंगे,” “कपट से,” and “दण्ड भोगेंगे” appropriately convey ἀποδώσουσιν λόγον, ἐν ὑποκρίσει, and τίσουσιν δίκην. “किस उद्देश्य से” more directly reflects εἰς τί without implying only a practical use.
  issues:
  - severity: medium
    issue: “तंगी के कारण” is overly specific for θλιβόμενοι.
    rationale: The participle denotes those in affliction, distress, or hardship. Although material need is pertinent in the larger context, the verse itself does not limit the condition to financial shortage.
  revised_text: इसलिए जो लोग लेते हैं, वे परमेश्वर को लेखा देंगे कि उन्होंने क्यों और किस उद्देश्य से लिया; क्योंकि जो लोग संकट में होने पर लेते हैं, उनका न्याय नहीं किया जाएगा, पर जो लोग कपट से लेते हैं, वे दण्ड भोगेंगे।
  revised_footnotes: []
  revision_rationale: “तंगी के कारण” को “संकट में होने पर” से बदला गया है ताकि θλιβόμενοι का व्यापक ‘पीड़ित/संकटग्रस्त’ अर्थ बना रहे। “किस काम के लिए” के स्थान पर “किस उद्देश्य से” मूल के प्रयोजन-सूचक εἰς τί को अधिक सीधे व्यक्त करता है।
