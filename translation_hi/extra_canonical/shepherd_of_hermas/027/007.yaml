base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/007.yaml
  text: So keep this commandment, as I have spoken to you, so that your repentance and that of your household may be found in simplicity, and your heart clean and unstained.
translation:
  language: hi
  text: इसलिए इस आज्ञा का पालन कर, जैसा मैंने तुझसे कहा है, ताकि तेरा और तेरे घराने का पश्चाताप निष्कपटता में पाया जाए, और तेरा हृदय[a] शुद्ध और निष्कलंक हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी संस्करण में ‘तेरा’ कोष्ठक में है; इसके बिना भी प्रसंग से ‘हृदय’ संबोधित व्यक्ति का ही समझा जाता है।
    reason: मूल स्रोत में σου पाठ-संपादकीय कोष्ठक में दिया गया है, इसलिए उसकी पाठगत अनिश्चितता बताई गई है।
lexical_decisions:
- source_word: φύλασσε
  choice: पालन कर
  rationale: आज्ञा के संदर्भ में ‘रक्षा कर’ की अपेक्षा ‘पालन कर’ स्वाभाविक हिन्दी है और निरंतर सावधानी से मानने का भाव व्यक्त करता है।
- source_word: μετάνοιά
  choice: पश्चाताप
  rationale: यह प्रचलित धार्मिक शब्द μετάνοια के मन-परिवर्तन और पाप से लौटने के भाव को संक्षेप में व्यक्त करता है।
- source_word: ἁπλότητι
  choice: निष्कपटता
  rationale: इस आदेश के व्यापक संदर्भ में ἁπλότης का आशय केवल सादगी नहीं, बल्कि छल और दोहरेपन से रहित आचरण है; ‘निष्कपटता’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἴκου
  choice: घराने
  rationale: यह केवल भवन नहीं, बल्कि व्यक्ति के परिवार या गृहस्थ समुदाय को दर्शाता है।
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: शुद्ध और निष्कलंक
  rationale: 'दोनों विशेषणों की अलग-अलग तीव्रता बनाए रखी गई है: आंतरिक शुद्धता और दाग या अपवित्रता से रहित होना।'
theological_decisions:
- issue: पश्चाताप का ‘निष्कपटता में पाया जाना’
  choice: स्रोत की परिणामी और परीक्षणात्मक भाषा को यथावत रखा गया
  alternative: ‘तुम और तुम्हारा घराना निष्कपट होकर पश्चाताप करो’
  rationale: वैकल्पिक रूप अधिक सहज है, पर वह εὑρεθῇ (‘पाया जाए’) को आज्ञा में बदलकर मूल की धार्मिक और नैतिक जाँच की छाया मिटा देता है।
- issue: एकवचन संबोधन और घराने का संबंध
  choice: ‘तेरा और तेरे घराने का पश्चाताप’
  alternative: ‘तुम्हारे पूरे घराने का पश्चाताप’
  rationale: मूल पाठ संबोधित व्यक्ति और उसके घराने दोनों को अलग रखते हुए एक साझा कथन करता है; अनुवाद में यही तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और एकवचन आत्मीय संबोधन रखा गया है। वाक्य-संरचना मूल यूनानी के उद्देश्यसूचक प्रवाह के निकट है, पर हिन्दी में स्वाभाविक बनाने के लिए संयोजन स्पष्ट किए गए हैं।
