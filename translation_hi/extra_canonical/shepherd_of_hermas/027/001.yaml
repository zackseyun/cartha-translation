base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/001.yaml
  text: 'He says to me: Have simplicity, and become guileless, and you will be like the little ones who do not know the wickedness that destroys the life of human beings.'
translation:
  language: hi
  text: वह मुझसे कहता है, “सरलता बनाए रखो और निष्कपट बनो। तब तुम उन छोटे बच्चों के समान होगे, जो उस बुराई को नहीं जानते जो मनुष्यों के जीवन को नष्ट कर देती है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητα
  choice: सरलता
  rationale: यहाँ शब्द का अर्थ नैतिक सरलता, निष्कपट उदारता और दुराव से रहित स्वभाव है; ‘सरलता’ आगे के पूरे आदेश से भी संगति रखती है।
- source_word: ἄκακος
  choice: निष्कपट
  rationale: शाब्दिक अर्थ ‘बुराई से रहित’ है; प्रसंग में कपट और दुर्भावना से मुक्त होने का भाव है, जिसे स्वाभाविक हिन्दी में ‘निष्कपट’ व्यक्त करता है।
- source_word: νήπια
  choice: छोटे बच्चे
  rationale: यह शब्द शिशुओं अथवा बहुत छोटे बच्चों को दर्शाता है; ‘छोटे बच्चे’ सामान्य पाठक के लिए सहज है और उनकी बुराई से अनभिज्ञता पर बल बनाए रखता है।
- source_word: πονηρίαν
  choice: बुराई
  rationale: यहाँ नैतिक दुष्टता या बुराई अभिप्रेत है; व्यापक शब्द ‘बुराई’ मूल की सामान्यता को बनाए रखता है।
- source_word: ἀπολλύουσαν τὴν ζωὴν
  choice: जीवन को नष्ट कर देती है
  rationale: वर्तमान कृदन्त के निरंतर/विशेषतासूचक भाव और ‘जीवन का विनाश’ दोनों को सीधे व्यक्त करता है।
- source_word: τῶν ἀνθρώπων
  choice: मनुष्यों के
  rationale: मूल का सामान्य, समावेशी मानव-संदर्भ सुरक्षित रहता है; इसे केवल किसी विशेष समूह तक सीमित नहीं किया गया।
theological_decisions:
- issue: बालकों के समान होने का आधार
  choice: बुराई से अनभिज्ञता को उपवाक्य के रूप में ज्यों का त्यों रखा गया
  alternative: बालकों की कथित निर्दोषता या पापरहितता की व्याख्या जोड़ना
  rationale: मूल केवल यह कहता है कि छोटे बच्चे विनाशकारी बुराई को नहीं जानते; वह किसी व्यापक बाल-निर्दोषता के सिद्धान्त को स्पष्ट नहीं करता।
- issue: ἁπλότης और ἄκακος का संबंध
  choice: ‘सरलता बनाए रखो’ और ‘निष्कपट बनो’ के रूप में दो अलग किंतु संबंधित आज्ञाएँ
  alternative: दोनों को एक ही भाव में मिलाकर ‘सीधे-सादे बनो’ कहना
  rationale: दो ग्रीक अभिव्यक्तियों की अलग पहचान और उनके बीच का नैतिक तनाव सुरक्षित रखना अधिक स्रोत-संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी में सहज किंतु गरिमापूर्ण शैली। प्रत्यक्ष कथन की संरचना रखी गई है। ‘सरलता’ को केवल भोलेपन के अर्थ में सीमित न करते हुए, ‘निष्कपट’ के साथ नैतिक अर्थ स्पष्ट किया गया है।
