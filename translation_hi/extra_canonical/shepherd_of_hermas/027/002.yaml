base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/002.yaml
  text: First of all, slander no one, and do not listen with pleasure to someone who slanders; otherwise you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For by believing it, you yourself also will have something against your brother. Thus you will be guilty of the slanderer’s sin.
translation:
  language: hi
  text: सबसे पहले, किसी की निन्दा मत करो और न किसी निन्दा करनेवाले की बात रुचि लेकर सुनो। नहीं तो, सुननेवाले तुम भी निन्दा करनेवाले के पाप के दोषी ठहरोगे, यदि तुम उस निन्दा पर विश्वास करोगे जो तुम सुनते हो। क्योंकि उस पर विश्वास करके तुम भी अपने भाई के विरुद्ध कुछ मान लोगे। इस प्रकार तुम निन्दा करनेवाले के पाप के दोषी ठहरोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλάλει / καταλαλοῦντος / καταλαλίᾳ
  choice: निन्दा करना / निन्दा करनेवाला / निन्दा
  rationale: यह शब्द किसी के विरुद्ध अपमानजनक या दोषारोपण करनेवाली बातें कहने का भाव रखता है। ‘निन्दा’ इस पुनरावृत्त शब्द-श्रृंखला को हिन्दी में स्पष्ट और सुसंगत रखती है।
- source_word: ἡδέως ἄκουε
  choice: आनन्द से सुनो
  rationale: ἡδέως केवल सुनने नहीं, बल्कि रुचि या प्रसन्नता से सुनने पर रोक लगाता है; इसलिए स्रोत की नैतिक सूक्ष्मता बनाए रखी गई है।
- source_word: ἔνοχος ἔσῃ
  choice: दोषी ठहरोगे
  rationale: ἔνοχος अपराध या पाप के प्रति उत्तरदायी होने को व्यक्त करता है। यह हिन्दी प्रयोग कानूनी-नैतिक उत्तरदायित्व दोनों को स्वाभाविक ढंग से बताता है।
- source_word: ἕξεις κατὰ τοῦ ἀδελφοῦ σου
  choice: अपने भाई के विरुद्ध हो जाओगे
  rationale: ग्रीक वाक्यांश में कर्म अस्पष्ट रूप से ‘भाई के विरुद्ध कुछ रखना/होना’ बताता है। सहज हिन्दी के लिए विरोधी भाव व्यक्त किया गया, बिना किसी विशेष आरोप को जोड़ने के।
theological_decisions:
- issue: निन्दा सुननेवाले की पाप में सहभागिता
  choice: विश्वास करने की शर्त के साथ सुननेवाले को निन्दक के पाप का दोषी बताया गया
  alternative: केवल निन्दा सुन लेने मात्र से दोषी होना
  rationale: ग्रीक ἐὰν πιστεύσῃς स्पष्ट करता है कि दोष निन्दा पर विश्वास करने से जुड़ा है; अनुवाद इस शर्त को सुरक्षित रखता है।
- issue: ἀδελφός का अर्थ
  choice: भाई
  alternative: संगी विश्वासी / भाई या बहन
  rationale: स्रोत का पारिवारिक-सामुदायिक रूपक और उसकी शब्दावली बनाए रखने के लिए औपचारिक रूप से ‘भाई’ रखा गया है; पाठ स्वयं लिंग-समावेशी विस्तार नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा उपदेशात्मक स्वर रखा गया है। स्रोत की पुनरावृत्ति—विशेषतः ‘निन्दा करनेवाले के पाप के दोषी’—को संक्षिप्त नहीं किया गया, क्योंकि यह अनुच्छेद के नैतिक बल और संरचना का अंग है।
