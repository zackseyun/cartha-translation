base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/004.yaml
  text: But clothe yourself with dignity, in which there is no evil stumbling block, but all things are smooth and cheerful. Do what is good, and from your labors, which God gives you, give simply to all who are in need, not hesitating as to whom you should give or to whom you should not give. Give to all, for God wants all to be given from his own gifts.
translation:
  language: hi
  text: पर अपने आप को मर्यादा से ढाँप लो; उसमें बुराई का कोई ठोकर का कारण नहीं होता, बल्कि सब कुछ समतल और प्रसन्न होता है। भलाई करो, और अपने उन परिश्रमों में से, जो परमेश्वर तुम्हें देता है, सब ज़रूरतमंदों को निष्कपट भाव से दो। इस बात में हिचकिचाओ मत कि किसे दो और किसे न दो। सबको दो, क्योंकि परमेश्वर चाहता है कि उसके अपने वरदानों में से सबको दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεμνότητα
  choice: गरिमा
  rationale: यहाँ शब्द नैतिक गंभीरता, मर्यादा और सम्मानयोग्य आचरण का बोध कराता है; ‘गरिमा’ आधुनिक हिन्दी में इस अर्थ-क्षेत्र को संक्षेप में व्यक्त करती है।
- source_word: πρόσκομμά
  choice: ठोकर
  rationale: रूपक को बनाए रखते हुए ऐसी चीज़ का अर्थ व्यक्त करता है जो नैतिक पतन या अपराध का कारण बने।
- source_word: ὁμαλὰ καὶ ἱλαρά
  choice: सहज और प्रसन्न
  rationale: ὁμαλά की समतल/निर्बाध रूपक-छवि को स्वाभाविक हिन्दी में ‘सहज’ और ἱλαρά को ‘प्रसन्न’ से व्यक्त किया गया है।
- source_word: ἐργάζου τὸ ἀγαθόν
  choice: भलाई करते रहो
  rationale: आज्ञार्थक वर्तमान क्रिया के निरंतर आचरण के भाव को व्यक्त करता है।
- source_word: ἐκ τῶν κόπων σου, ὧν ὁ Θεὸς δίδωσίν σοι
  choice: तुम्हारे जिन परिश्रमों का अवसर परमेश्वर तुम्हें देता है, उनकी कमाई में से
  rationale: ग्रीक वाक्यांश में परिश्रम को परमेश्वर द्वारा दिया जाना कहा गया है; हिन्दी में अर्थ स्पष्ट करने के लिए परिश्रम का अवसर और उससे प्राप्त कमाई व्यक्त की गई है, बिना दान के स्रोत को बदलने के।
- source_word: ἁπλῶς
  choice: उदार मन से
  rationale: इस प्रसंग में शब्द निष्कपट, बिना भेदभाव और खुले हाथ से देने का भाव रखता है; ‘उदार मन से’ सामान्य हिन्दी में यही व्यावहारिक अर्थ देता है।
- source_word: μὴ διστάζων
  choice: दुविधा में न पड़ो
  rationale: किसे दिया जाए, इस विषय में संकोच, हिचक या दो मन होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τῶν ἰδίων δωρημάτων
  choice: उसके अपने वरदानों में से
  rationale: परमेश्वर को दान-सामग्री का अंतिम स्रोत बताने वाली मूल अभिव्यक्ति को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: क्या ‘सभी को दो’ को पात्रता-आधारित सीमा के साथ समझाया जाए
  choice: मूल का सार्वभौमिक आदेश बिना अतिरिक्त सीमा के रखा गया
  alternative: केवल योग्य या वास्तविक ज़रूरतमंदों को देने के रूप में स्पष्ट करना
  rationale: पाठ पहले ‘सभी ज़रूरतमंदों’ और फिर ज़ोर देकर ‘सभी को दो’ कहता है; बाद के अनुच्छेद में ग्रहण करने वाले की जवाबदेही आती है। अनुवाद में कोई अतिरिक्त धार्मिक या नैतिक पात्रता नहीं जोड़ी गई।
- issue: परिश्रम और परमेश्वर के वरदान का संबंध
  choice: परिश्रम का अवसर परमेश्वर द्वारा दिया गया और कमाई दान का साधन है
  alternative: सीधे ‘परिश्रम जिन्हें परमेश्वर देता है’ जैसा अस्वाभाविक शाब्दिक रूप
  rationale: यह रूप परमेश्वर की प्रदाता-भूमिका और मनुष्य के वास्तविक श्रम, दोनों को बनाए रखते हुए हिन्दी में बोधगम्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु साधारण पाठक के लिए सुबोध शैली। आज्ञाओं की प्रत्यक्षता, दान की निष्कपटता और मूल पाठ की व्यापकता बनाए रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
