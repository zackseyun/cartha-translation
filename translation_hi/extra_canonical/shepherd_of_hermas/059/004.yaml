base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/004.yaml
  text: 3. I say to him, “Sir, if they did such things as to embitter the glorious angel, what did I do?” “Otherwise,” he says, “they cannot be afflicted unless you, the head of the whole household, are afflicted; for when you are afflicted, of necessity they also will be afflicted, but if you stand firm, they cannot have any affliction.”
translation:
  language: hi
  text: 3. मैंने उससे कहा, “स्वामी, यदि उन्होंने ऐसे काम किए कि महिमामय स्वर्गदूत अप्रसन्न हो गया, तो मैंने क्या किया?” उसने कहा, “वे किसी और तरह कष्ट नहीं सह सकते, जब तक कि तुम—पूरे[a] घराने के मुखिया—कष्ट न सहो। क्योंकि जब तुम कष्ट सहते हो, तो वे भी अनिवार्य रूप से कष्ट सहेंगे; पर यदि तुम दृढ़ बने रहो, तो वे कोई कष्ट नहीं सह सकते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूरे’ शब्द का आधार कुछ यूनानी प्रतियों में पाया जाने वाला पाठ है; अन्य प्रतियों में केवल ‘घराने के मुखिया’ है।
    reason: स्रोत-पाठ में ὅλου को कोष्ठक में दिया गया है; अनिश्चित पाठ को पारदर्शी ढंग से चिह्नित करना आवश्यक है।
lexical_decisions:
- source_word: κύριε
  choice: स्वामी
  rationale: यहाँ संबोधन सम्मानसूचक है; ‘स्वामी’ प्राचीन धार्मिक वातावरण को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: παραπικρανθῇ
  choice: अप्रसन्न हो गया
  rationale: क्रिया का मूल भाव कटुता या रोष उत्पन्न करना है। ‘अप्रसन्न’ स्वाभाविक हिन्दी में दैवी प्रतिनिधि के रोष को व्यक्त करता है, बिना अत्यधिक तीव्र अर्थ आरोपित किए।
- source_word: ὁ ἔνδοξος ἄγγελος
  choice: महिमामय स्वर्गदूत
  rationale: ‘महिमामय’ ἔνδοξος के गौरवपूर्ण भाव को और ‘स्वर्गदूत’ ἄγγελος को सामान्य धार्मिक हिन्दी में व्यक्त करता है।
- source_word: ἡ κεφαλὴ τοῦ οἴκου [ὅλου]
  choice: पूरे घराने के मुखिया
  rationale: मुहावरे का आशय परिवार या गृह-समुदाय के प्रमुख से है। कोष्ठकित ὅλου को पाठ में रखते हुए ‘पूरे’ कहा गया है।
- source_word: θλιβῆναι / θλιβομένου / θλῖψιν
  choice: कष्ट सहना / कष्ट
  rationale: एक ही यूनानी शब्द-परिवार की पुनरावृत्ति को हिन्दी में यथासंभव बनाए रखा गया है; संदर्भ दंडात्मक पीड़ा या क्लेश का है।
- source_word: εὐσταθοῦντος
  choice: दृढ़ बने रहो
  rationale: शब्द स्थिर, सुदृढ़ या सुस्थित रहने का भाव देता है। ‘दृढ़ बने रहो’ यहाँ विपत्ति से अप्रभावित रहने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: घराने के सदस्यों का कष्ट मुखिया के कष्ट पर निर्भर होना
  choice: 'कारणात्मक कथन को ज्यों का त्यों रखा गया: मुखिया के कष्ट से वे भी अनिवार्य रूप से कष्ट सहेंगे।'
  alternative: इसे केवल सहानुभूतिजन्य दुःख या सामूहिक अनुशासन के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ निर्भरता का कथन करता है, पर उसके तंत्र की व्याख्या नहीं करता; इसलिए धर्मवैचारिक तनाव और अस्पष्टता सुरक्षित रखी गई है।
- issue: εὐσταθοῦντος का अर्थ
  choice: दृढ़ बने रहना
  alternative: सुखी रहना, समृद्ध रहना, या सुरक्षित रहना
  rationale: मूल शब्द स्थिर या अच्छी दशा में रहने का व्यापक भाव रखता है। ‘दृढ़’ अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है, पर इसे नैतिक निष्पापता या आर्थिक समृद्धि तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। वक्ताओं का परिवर्तन स्पष्ट रखा गया है और θλίψις शब्द-परिवार की पुनरावृत्ति ‘कष्ट’ से संरक्षित की गई है।
