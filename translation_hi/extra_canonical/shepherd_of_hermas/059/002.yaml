base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/002.yaml
  text: 1. After a few days I saw him in the same field where I had also seen the shepherds, and he says to me, “What are you seeking?” “I am here, sir,” I say, “that you may command the shepherd, the punisher, to go out from my house, because he afflicts me greatly.” He says, “It is necessary for you to be afflicted; for thus the glorious angel has commanded concerning you, for he wants you to be tested.” “For what, sir,” I say, “have I done that was so evil, that I should be handed over to this angel?”
translation:
  language: hi
  text: 2. उसने कहा, “सुनो। तुम्हारे पाप तो बहुत हैं, पर इतने नहीं कि तुम्हें इस दण्ड देनेवाले स्वर्गदूत के हाथ सौंप दिया जाए। लेकिन तुम्हारे घराने ने बड़े अधर्म और पाप किए हैं, और उनके कामों से महिमामय स्वर्गदूत अत्यन्त अप्रसन्न हुआ है। इसीलिए उसने आज्ञा दी है कि तुम कुछ समय तक क्लेश सहो, ताकि वे भी मन फिराएँ और अपने आपको इस युग की हर अभिलाषा से शुद्ध करें। इसलिए जब वे मन फिराएँगे और शुद्ध हो जाएँगे, तब दण्ड देनेवाला स्वर्गदूत दूर हो जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: तुम्हारा घराना
  rationale: यहाँ οἶκος केवल भवन नहीं, हर्मास के परिवार अथवा गृहस्थ समुदाय को सूचित करता है; ‘घराना’ इस सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνομίας
  choice: अधर्म
  rationale: ἀνομία नैतिक और धार्मिक नियम-विरोध को दर्शाता है; ‘अधर्म’ आधुनिक धार्मिक हिन्दी में अर्थपूर्ण है और साथ आए ‘पाप’ से भेद भी बनाए रखता है।
- source_word: παρεπικράνθη
  choice: अत्यन्त अप्रसन्न हुआ
  rationale: क्रिया में कटु रूप से खिन्न या क्रुद्ध किए जाने का भाव है। ‘अत्यन्त अप्रसन्न’ कारण बने कर्मों पर तीखी प्रतिक्रिया को व्यक्त करता है, बिना अनावश्यक रूप से केवल क्रोध तक सीमित किए।
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: इस युग की हर अभिलाषा
  rationale: ἐπιθυμία प्रबल इच्छा या लालसा हो सकती है और αἰών वर्तमान सांसारिक युग को सूचित करता है। ‘अभिलाषा’ मूल की व्यापकता रखती है; इसे केवल कामवासना नहीं बनाया गया।
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: दण्ड देनेवाला स्वर्गदूत
  rationale: सम्बन्धवाचक यूनानी पद उस स्वर्गदूत की दण्डकारी भूमिका बताता है। यह अनुवाद प्रसंग के पहले आए τιμωρητής के साथ निरन्तरता रखता है।
- source_word: ἀποστήσεται
  choice: दूर हो जाएगा
  rationale: क्रिया का अर्थ हट जाना या अलग हो जाना है; इसे पूर्ण विनाश अथवा स्थायी निष्कासन के रूप में अधिक निश्चित नहीं किया गया।
theological_decisions:
- issue: हर्मास का क्लेश और उसके घराने के पापों का सम्बन्ध
  choice: स्वर्गदूत की आज्ञा के अनुसार हर्मास कुछ समय क्लेश सहता है, ताकि उसके घराने के लोग मन फिराएँ और शुद्ध हों।
  alternative: हर्मास उनके पापों का प्रायश्चित या स्थानापन्न दण्ड भोगता है।
  rationale: यूनानी पाठ सुधारात्मक और पारिवारिक प्रभाव का सम्बन्ध बताता है, पर यह नहीं कहता कि हर्मास उनके अपराध का प्रायश्चित करता है; इसलिए स्थानापन्न दण्ड की धारणा नहीं जोड़ी गई।
- issue: μετανοήσωσι का अनुवाद
  choice: मन फिराएँ
  alternative: पश्चात्ताप करें
  rationale: ‘मन फिराना’ आन्तरिक परिवर्तन और जीवन-दिशा के बदलाव दोनों को प्रकट करता है तथा केवल खेद तक अर्थ सीमित नहीं करता।
- issue: शुद्धि का स्वरूप
  choice: अपने आपको इस युग की हर अभिलाषा से शुद्ध करें
  alternative: स्वर्गदूत उन्हें स्वतः शुद्ध कर दे
  rationale: मूल में καθαρίσωσιν ἑαυτούς आत्मवाचक है और परिवार के सक्रिय प्रत्युत्तर को व्यक्त करता है; अनुवाद उसी व्याकरणिक बल को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष वचन और कथा-प्रवाह को हिन्दी में स्वाभाविक बनाया गया है, जबकि ‘महिमामय स्वर्गदूत’, ‘इस युग’ और ‘मन फिराना’ जैसे मूल धार्मिक पदों का भाव सुरक्षित रखा गया है।
