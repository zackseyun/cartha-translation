translation:
  language: hi
  text: 4. मैंने कहा, “लेकिन देखिए, महोदय, उन्होंने अपने पूरे मन से पश्चाताप किया है।” उन्होंने कहा, “मैं भी जानता हूँ कि उन्होंने पश्चाताप किया है—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: प्रभु
  rationale: सम्मानसूचक संबोधन है; हर्मास में स्वर्गदूत-सदृश पात्र के प्रति प्रयुक्त इस संबोधन को गरिमापूर्ण और परिचित हिन्दी रूप में रखा गया है।
- source_word: μετανενοήκασιν
  choice: पश्चाताप किया है
  rationale: 'पूर्ण पक्ष को दर्शाता है: पश्चाताप हो चुका है और उसका वर्तमान परिणाम बना हुआ है।'
- source_word: ἐξ ὅλης καρδίας αὐτῶν
  choice: अपने पूरे मन से
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप, जो उनकी संपूर्ण आंतरिक निष्ठा व्यक्त करता है।
theological_decisions:
- issue: κύριε से संबोधित पात्र की पहचान
  choice: प्रभु
  alternative: महोदय / स्वामी
  rationale: स्रोत में सम्मानसूचक κύριε है; अनुवाद पात्र को परमेश्वर ठहराए बिना पारंपरिक गरिमा बनाए रखता है।
- issue: खंडित अंतिम वाक्य
  choice: दीर्घ डैश के साथ वाक्य अधूरा रखा गया
  alternative: अगले पाठ से वाक्य पूरा करना
  rationale: प्रदत्त reader segment यहीं कटता है; स्रोत-सीमा का सम्मान करते हुए अगले अंश की सामग्री नहीं जोड़ी गई।
