base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/003.yaml
  text: '2. He says, “Listen: your sins are many, but not so many that you should be handed over to this angel. Rather, your household has committed great lawless deeds and sins, and the glorious angel was embittered at their works; and for this reason he ordered that you be afflicted for a certain time, so that they too might repent and cleanse themselves from every desire of this age. When therefore they repent and are cleansed, then the angel of punishment will depart.”'
translation:
  language: hi
  text: 'उसने कहा, “सुनो: तुम्हारे पाप बहुत हैं, पर इतने नहीं कि तुम्हें इस दण्ड देनेवाले स्वर्गदूत के हाथ सौंप दिया जाए। बल्कि तुम्हारे घराने ने बड़े अधर्म और पाप किए हैं, और उनके कामों से महिमामय स्वर्गदूत बहुत अप्रसन्न हो गया। इसी कारण उसने आदेश दिया कि कुछ समय तक तुम्हें क्लेश सहना पड़े, ताकि वे भी मन फिराएँ और इस युग की हर लालसा से अपने आप को शुद्ध करें। इसलिए जब वे मन फिराएँगे और शुद्ध हो जाएँगे, तब दण्ड देनेवाला स्वर्गदूत चला जाएगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: तुम्हारा घराना
  rationale: यहाँ οἶκος भवन नहीं, वक्ता के परिवार अथवा गृहस्थ-समुदाय को सूचित करता है; ‘घराना’ इस सामूहिक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀνομίας
  choice: अधर्म
  rationale: ἀνομία का अर्थ विधि-विरुद्ध या नैतिक रूप से अनुचित कर्म है; ‘अधर्म’ इसके धार्मिक-नैतिक भार को बनाए रखता है।
- source_word: ὁ ἔνδοξος ἄγγελος
  choice: महिमामय स्वर्गदूत
  rationale: ‘महिमामय’ ἔνδοξος के गौरव और महिमा-संबंधी अर्थ को व्यक्त करता है, जबकि ‘स्वर्गदूत’ सामान्य पाठक के लिए ἄγγελος का स्पष्ट धार्मिक पद है।
- source_word: παρεπικράνθη
  choice: अप्रसन्न हो गया
  rationale: क्रिया में उनके कर्मों से तीव्र खिन्नता या रोष उत्पन्न होने का भाव है; ‘अप्रसन्न’ सहज हिन्दी में इसे व्यक्त करता है, बिना मनोभाव को अत्यधिक विशिष्ट बनाए।
- source_word: θλιβῆναι
  choice: क्लेश सहना पड़े
  rationale: निष्क्रिय क्रिया का अर्थ दबाया, पीड़ित या संकटग्रस्त किया जाना है; प्रसंग में ‘क्लेश सहना’ दण्डात्मक पीड़ा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μετανοήσωσι
  choice: मन फिराएँ
  rationale: यह पश्चात्ताप के साथ जीवन-दिशा के परिवर्तन को व्यक्त करता है और आधुनिक धार्मिक हिन्दी में समझने योग्य है।
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: इस युग की हर लालसा
  rationale: αἰών को ‘युग’ अनूदित करके उसके कालिक और नैतिक दोनों आयाम बनाए गए हैं; ἐπιθυμία के लिए ‘लालसा’ अनुचित सांसारिक चाह का भाव देता है।
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: दण्ड देनेवाला स्वर्गदूत
  rationale: संबंधवाचक पद को सहज हिन्दी में कार्यसूचक रूप दिया गया है; इससे स्वर्गदूत की दण्डकारी भूमिका स्पष्ट रहती है।
- source_word: ἀποστήσεται
  choice: चला जाएगा
  rationale: यहाँ अर्थ पीछे हटने या उनसे दूर हो जाने का है; ‘चला जाएगा’ सामान्य हिन्दी में परिणामी प्रस्थान को स्पष्ट करता है।
theological_decisions:
- issue: परिवार के पापों के कारण वक्ता का क्लेश
  choice: पाठ के सामूहिक उत्तरदायित्व और दण्डात्मक क्लेश के कथन को ज्यों का त्यों रखा गया है।
  alternative: इसे केवल स्वाभाविक पारिवारिक परिणाम या प्रतीकात्मक अनुशासन के रूप में समझाकर अनूदित करना।
  rationale: यूनानी पाठ स्वयं एक महिमामय स्वर्गदूत के आदेश और दण्ड देनेवाले स्वर्गदूत की भूमिका बताता है; अनुवाद को इस धर्मवैचारिक तनाव का समाधान नहीं करना चाहिए।
- issue: μετάνοια का अर्थ
  choice: ‘मन फिराना’ रखा गया है।
  alternative: केवल ‘पछताना’।
  rationale: मूल शब्द पश्चात्ताप के साथ बदली हुई दिशा का संकेत दे सकता है; ‘मन फिराना’ इस व्यापकता को बनाए रखता है।
- issue: ‘इस युग’ की लालसाएँ
  choice: αἰών को ‘युग’ के रूप में प्रत्यक्ष रखा गया है।
  alternative: ‘संसार’ या ‘सांसारिक लालसाएँ’।
  rationale: ‘युग’ मूल की युग-संबंधी भाषा और संभावित युगान्तशास्त्रीय तनाव को सुरक्षित रखता है, जबकि ‘संसार’ उसका अर्थ पहले ही व्याख्यायित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। संवादात्मक आरम्भ और कारण-परिणाम की संरचना मूल के निकट है। किसी सम्प्रदाय-विशेष की दण्ड, पश्चात्ताप या पारिवारिक उत्तरदायित्व संबंधी व्याख्या नहीं जोड़ी गई।
