translation:
  language: hi
  text: '**सातवीं उपमा**


    कुछ दिनों बाद मैंने उसे उसी मैदान में देखा, जहाँ मैंने उन चरवाहों को भी देखा था। उसने मुझसे कहा, “तुम क्या चाहते हो?”


    मैंने कहा, “हे प्रभु, मैं इसलिए यहाँ आया हूँ कि आप दण्ड देनेवाले चरवाहे को मेरे घर से निकल जाने की आज्ञा दें, क्योंकि वह मुझे बहुत अधिक कष्ट दे रहा है।”


    उसने कहा, “तुम्हारा कष्ट उठाना आवश्यक है, क्योंकि महिमामय स्वर्गदूत ने तुम्हारे विषय में ऐसा ही आदेश दिया है; वह चाहता है कि तुम्हारी परीक्षा हो।”


    मैंने कहा, “हे प्रभु, मैंने ऐसा कौन-सा बुरा काम किया है कि मुझे इस स्वर्गदूत के हाथ सौंप दिया जाए?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεδίον
  choice: मैदान
  rationale: यह खुले समतल स्थान का सहज और सटीक आधुनिक हिन्दी रूप है।
- source_word: ποιμένας
  choice: चरवाहों
  rationale: बहुवचन को सुरक्षित रखा गया है और कृति के चरवाहा-रूपक से संगति बनी रहती है।
- source_word: ποιμένα τὸν τιμωρητήν
  choice: दण्ड देनेवाले चरवाहे
  rationale: τιμωρητής की दण्डात्मक भूमिका और ποιμήν की चरवाहा-छवि दोनों को स्पष्ट रखा गया है।
- source_word: θλίβει / θλιβῆναι
  choice: कष्ट दे रहा है / कष्ट उठाना
  rationale: क्रिया के दबाव, पीड़ा और विपत्ति के अर्थ को प्रसंगानुकूल स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ὁ ἔνδοξος ἄγγελος
  choice: महिमामय स्वर्गदूत
  rationale: ἔνδοξος के सम्मान और गौरव के भाव को बिना अतिरिक्त पहचान जोड़े सुरक्षित रखा गया है।
- source_word: πειρασθῆναι
  choice: परीक्षा हो
  rationale: ग्रीक में परीक्षा या परखे जाने का भाव है; इसे केवल प्रलोभन के अर्थ में सीमित नहीं किया गया।
- source_word: παραδοθῶ
  choice: हाथ सौंप दिया जाए
  rationale: सत्ता या अभिरक्षा के अधीन किए जाने का भाव हिन्दी मुहावरे में स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: महिमामय स्वर्गदूत की पहचान
  choice: पाठ के अनुसार केवल “महिमामय स्वर्गदूत”
  alternative: उसे किसी विशिष्ट दैवी व्यक्ति या पद से पहचानना
  rationale: ग्रीक पाठ यहाँ उसकी विशिष्ट पहचान नहीं बताता; इसलिए व्याख्यात्मक पहचान नहीं जोड़ी गई।
- issue: πειρασθῆναι का आशय
  choice: “तुम्हारी परीक्षा हो”
  alternative: “तुम प्रलोभन में पड़ो” या “तुम्हें दण्ड मिले”
  rationale: मूल शब्द में परखे जाने का व्यापक अर्थ है; यह अनुवाद उस तनाव को खुला रखता है।
- issue: कष्ट और अपराध का संबंध
  choice: संवाद के प्रश्नात्मक तनाव को यथावत रखना
  alternative: कष्ट को सीधे व्यक्तिगत अपराध का प्रतिफल घोषित करना
  rationale: वक्ता स्वयं पूछता है कि उसने कौन-सा बुरा काम किया; पाठ अभी इस बिंदु पर कारण का पूर्ण समाधान नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। प्रत्यक्ष संवाद को स्पष्ट रखा गया है और प्राचीन संबोधन κύριε के लिए प्रसंगानुसार “हे प्रभु” अपनाया गया है। केवल 59:1 का अनुवाद किया गया है; दिए गए व्यापक स्रोत-पाठ के अगले अनुच्छेद शामिल नहीं किए गए।
