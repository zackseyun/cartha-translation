translation:
  language: hi
  text: “क्या तुम आए हो?” मैंने कहा, “क्योंकि, महोदय, मैं एक ‘स्टातियो’[a] का पालन कर रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ‘स्टातियो’ (यूनानी στατίων; लैटिन statio से) एक पारिभाषिक धार्मिक शब्द है। अगले वाक्य में इसे उपवास के संबंध में समझाया गया है।
    reason: विशिष्ट उधार लिए गए धार्मिक पद को बनाए रखते हुए उसके संदर्भगत अर्थ का संकेत देना।
lexical_decisions:
- source_word: στατίωνα
  choice: उपवास-व्रत
  rationale: यह यूनानी में लैटिन ‘स्टातियो’ से लिया गया एक पारिभाषिक शब्द है, जो यहाँ नियत धार्मिक उपवास-अनुष्ठान को दर्शाता है। ‘उपवास-व्रत’ अगले वाक्य में उसकी व्याख्या ‘मैं उपवास कर रहा हूँ’ से स्वाभाविक रूप से जुड़ता है।
- source_word: κύριε
  choice: महोदय
  rationale: यहाँ वक्ता अपने संबोधनकर्ता के प्रति आदर प्रकट करता है; ‘महोदय’ आधुनिक, dignified हिन्दी में सम्मान बनाए रखता है, बिना इसे अनिवार्य रूप से ईश्वरीय उपाधि बनाने के।
- source_word: φημί
  choice: मैंने कहा
  rationale: संवाद को स्वाभाविक हिन्दी में व्यक्त करने के लिए वर्तमानकालीन ऐतिहासिक कथन को भूतकाल में रखा गया है।
theological_decisions:
- issue: प्रश्न और उत्तर के बीच दिखाई देने वाली असंगति
  choice: उपलब्ध यूनानी पाठ के प्रश्न ‘क्या तुम आए हो?’ को बनाए रखा गया
  alternative: उत्तर ‘क्योंकि’ के आधार पर ‘तुम क्यों आए हो?’ पढ़ना
  rationale: दिए गए यूनानी स्रोत में केवल ἐλήλυθας (‘क्या तुम आए हो?’) सुरक्षित है; सम्भावित लुप्त शब्द को मुख्य पाठ में जोड़कर पाठगत कठिनाई को चुपचाप हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और आदरपूर्ण रखी गई है। उपलब्ध अंश सम्भवतः किसी प्रश्न के आरम्भ में कटा हुआ है; इसलिए उसके कठिन वाक्य-संबंध को बिना प्रमाण सुधारा नहीं गया।
