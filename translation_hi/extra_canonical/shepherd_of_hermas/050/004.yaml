  text: मैंने कहा, “स्वामी, आप ऐसा क्यों कहते हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατί
  choice: क्यों
  rationale: यह सीधे कारण पूछने वाला प्रश्न है।
- source_word: φημί
  choice: मैंने कहा
  rationale: संवाद के वृत्तांत में यूनानी वर्तमानकालीन कथन-सूचक क्रिया को हिन्दी में स्वाभाविक भूतकाल से व्यक्त किया गया है।
- source_word: κύριε
  choice: स्वामी
  rationale: यह आदरसूचक संबोधन है; ‘स्वामी’ सम्मान और संभावित अधिकार-भाव को बनाए रखता है, बिना इसे अनिवार्य रूप से ईश्वरीय उपाधि बनाने के।
- source_word: τοῦτο λέγεις
  choice: आप ऐसा कहते हैं
  rationale: ‘ऐसा’ पूर्ववर्ती कथन की ओर संकेत करता है और यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
