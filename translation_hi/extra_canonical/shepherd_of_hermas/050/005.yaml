base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/005.yaml
  text: He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds. So the servant took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.
translation:
  language: hi
  text: वह मुझसे कहता है, “मैं तुमसे कहता हूँ, यह वह उपवास नहीं है जिसे तुम प्रभु के लिए किया हुआ उपवास समझते हो। एक दृष्टान्त सुनो। जिस दाख की बारी में जंगली घास न हो, वह अधिक फल देगी, क्योंकि घास उसे दबाएगी नहीं। तब दास ने औज़ार लेकर[a] दाख की बारी खोदी और उसमें उगी सारी जंगली घास उखाड़ दी। इस प्रकार वह दाख की बारी बहुत सुन्दर और हरी-भरी हो गई, क्योंकि उसे दबाने वाली कोई जंगली घास नहीं रही।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक रूप से केवल “लेकर” है; ली गई वस्तु का नाम नहीं दिया गया। सन्दर्भ के आधार पर यहाँ “औज़ार” समझा गया है।
    reason: मूल पाठ में कर्म अनिर्दिष्ट है; हिन्दी में वाक्य को स्वाभाविक बनाने के लिए सीमित पूर्ति की गई है और उसे स्पष्ट रूप से बताया गया है।
