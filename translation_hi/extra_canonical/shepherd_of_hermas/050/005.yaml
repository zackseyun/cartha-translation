- source_word: πνιγόμενος / πνιγούσας
  choice: दबाना
  rationale: वनस्पति द्वारा पौधों की बढ़त रोकने के रूपक को सहज हिन्दी में व्यक्त करता है; शाब्दिक ‘गला घोंटना’ यहाँ अस्वाभाविक होता।
- source_word: εὐπρεπέστατος καὶ εὐθαλής
  choice: बहुत सुन्दर और हरी-भरी
  rationale: पहला शब्द आकर्षक दशा और दूसरा स्वस्थ, फलती-फूलती वृद्धि बताता है; दोनों पहलुओं को अलग रखा गया है।
- source_word: παραβολή (implied by consultation text/context)
  choice: दृष्टान्त
  rationale: धार्मिक-शिक्षाप्रद तुलना के लिए आधुनिक हिन्दी में परिचित और गरिमापूर्ण शब्द है।
theological_decisions:
- issue: प्रभु के लिए किए जाने वाले उपवास और प्रचलित उपवास के बीच भेद
  choice: ‘जिसे तुम प्रभु के लिए उपवास करना समझते हो, वह उपवास यह नहीं है’
  alternative: ‘यह वह उपवास नहीं है जो तुम प्रभु के लिए रखते हो’
  rationale: ग्रीक में लेखक उनके अभ्यास को सच्चा उपवास मानकर स्वीकार नहीं करता; चुना हुआ रूप इस आलोचनात्मक तनाव को बनाए रखता है और उसे केवल उपवास की एक भिन्न विधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण रखी गई है। सीधे संवाद को स्वाभाविक बनाया गया है, जबकि दाख की बारी और जंगली घास के रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
