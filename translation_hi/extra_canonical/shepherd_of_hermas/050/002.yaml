base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/002.yaml
  text: '"What," he says, "is a station?" I say, "I am fasting, sir." He says, "And what is this fasting that you are fasting?" I say, "As I have been accustomed, sir, so I fast."'
translation:
  language: hi
  text: उसने कहा, “स्टातियोन[a] क्या है?” मैंने कहा, “स्वामी, मैं उपवास कर रहा हूँ।” उसने कहा, “और यह कौन-सा उपवास है, जो तुम रखते हो?” मैंने कहा, “स्वामी, जैसा मेरी आदत रही है, मैं वैसा ही उपवास करता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्टातियोन” एक पारिभाषिक शब्द है, जो आरंभिक मसीही प्रयोग में उपवास के लिए नियत दिन या अनुशासन का संकेत कर सकता है। अगले उत्तर में वक्ता इसे उपवास करने के रूप में समझाता है।
    reason: यूनानी στατίων को ‘उपवास’ से अलग रखा गया है, क्योंकि मूल में पहले इस शब्द का अर्थ पूछा जाता है और फिर उसे उपवास से जोड़ा जाता है।
lexical_decisions:
- source_word: στατίων
  choice: स्टातियो
  rationale: यह आरंभिक मसीही प्रचलन में नियत उपवास अथवा धार्मिक अनुशासन के लिए प्रयुक्त एक विशिष्ट पारिभाषिक शब्द है। इसे केवल ‘उपवास’ कहने से अगले प्रश्नोत्तर की शब्दगत भिन्नता मिट जाती; इसलिए लिप्यंतरण के साथ पादटिप्पणी दी गई है।
- source_word: κύριε
  choice: स्वामी
  rationale: संवाद में सम्मानसूचक संबोधन को व्यक्त करता है; ‘प्रभु’ यहाँ अनावश्यक रूप से दैवी संबोधन का संकेत दे सकता था।
- source_word: ὡς εἰώθειν
  choice: जैसा मैं सदा से करता आया हूँ
  rationale: वक्ता की अभ्यस्त और प्रचलित रीति को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: स्टातियो और उपवास के संबंध को स्पष्ट करना
  choice: मुख्य पाठ में दोनों शब्दों को अलग रखा और पादटिप्पणी में स्टातियो का संभावित अर्थ बताया
  alternative: स्टातियो का सीधे ‘नियत उपवास’ अनुवाद करना
  rationale: मूल संवाद पहले अपरिचित पद के बारे में पूछता है और उत्तर में उसे उपवास से जोड़ता है। अलगाव बनाए रखने से मूल की प्रश्नोत्तर संरचना और पारिभाषिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण संवाद-शैली अपनाई गई है। बार-बार आने वाले कथन-सूचकों को स्वाभाविक हिन्दी में रखा गया है, जबकि मूल की प्रश्नोत्तर संरचना और विनम्र संबोधन सुरक्षित हैं।
