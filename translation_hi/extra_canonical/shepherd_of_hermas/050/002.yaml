  to: उसने कहा, “स्टातियोन[a] क्या है?” मैंने कहा, “स्वामी, मैं उपवास कर रहा हूँ।” उसने कहा, “और यह कौन-सा उपवास है, जो तुम रखते हो?” मैंने कहा, “स्वामी, जैसा मेरी आदत रही है, मैं वैसा ही उपवास करता हूँ।”
