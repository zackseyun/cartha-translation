  text: He says, "You do not know how to fast to the Lord, nor is this useless fast that you fast to him a fast."
translation:
  language: hi
  text: वह कहता है, “तुम लोग प्रभु के लिए उपवास करना नहीं जानते, और यह निष्फल उपवास, जो तुम उसके लिए रखते हो, उपवास है ही नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύειν τῷ Κυρίῳ
  choice: प्रभु के लिए उपवास करना
  rationale: समर्पण अथवा उद्देश्य व्यक्त करने वाले यूनानी सम्प्रदान कारक को स्वाभाविक हिन्दी में ‘के लिए’ से व्यक्त किया गया है।
- source_word: ἀνωφελής
  choice: निष्फल
  rationale: यह शब्द ऐसे उपवास को बताता है जिससे कोई लाभ या फल नहीं होता; ‘निष्फल’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἣν νηστεύετε αὐτῷ
  choice: जो तुम उसके लिए रखते हो
  rationale: हिन्दी में ‘उपवास रखना’ स्वाभाविक प्रयोग है; αὐτῷ का उद्देश्यात्मक भाव ‘उसके लिए’ में सुरक्षित है।
theological_decisions:
- issue: क्या वक्ता उपवास को सामान्यतः अस्वीकार करता है या केवल इस प्रकार के उपवास को?
  choice: ‘यह ... उपवास ... उपवास है ही नहीं’
  alternative: ‘उपवास करना व्यर्थ है’
  rationale: यूनानी αὕτη स्पष्टतः इसी विशेष उपवास की ओर संकेत करता है। इसलिए सामान्य रूप से उपवास का निषेध नहीं किया गया।
- issue: τῷ Κυρίῳ में ‘प्रभु’ का संदर्भ
  choice: ‘प्रभु’ को बिना अतिरिक्त पहचान के रखा गया
  alternative: ‘परमेश्वर’ अथवा ‘यीशु मसीह’
  rationale: मूल पाठ केवल Κυρίῳ कहता है; किसी विशिष्ट पहचान को जोड़ना पाठ की वास्तविक संदर्भगत खुली अवस्था को अनावश्यक रूप से सीमित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रत्यक्ष कथन की पुनरुक्ति को मूल यूनानी के जोर के अनुरूप रखा गया है, जबकि वाक्य को सामान्य पाठक के लिए सहज बनाने हेतु ‘कैसे करना चाहिए’ और ‘वास्तव में’ का प्रयोग किया गया है।
