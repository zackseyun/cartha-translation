base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/006.yaml
  text: '"After a time the master of the servant [and of the field] came and went into the vineyard. And seeing the vineyard well fenced, and even dug, and [all] the weeds pulled out, he rejoiced greatly over his servant on account of his deed. Summoning again his friends and his son, the master announced to them the deed the servant had done with his portions which he had received; and they approved all the more that the servant should become co-heir with his son."'
translation:
  language: hi
  text: कुछ समय बाद उस सेवक और खेत का[a] स्वामी आया और दाख की बारी में गया। उसने देखा कि दाख की बारी के चारों ओर अच्छी तरह बाड़ लगी हुई थी, उसकी मिट्टी भी खोदी गई थी और सारी[b] जंगली घास उखाड़ दी गई थी। अपने सेवक का यह काम देखकर वह बहुत आनन्दित हुआ। स्वामी ने फिर अपने मित्रों और अपने पुत्र को बुलाया और उन्हें उस काम के बारे में बताया जो सेवक ने अपने प्राप्त भोजन के भागों के साथ किया था। तब वे इस बात से और भी अधिक सहमत हुए कि उस सेवक को उसके पुत्र के साथ सह-उत्तराधिकारी बनाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-साक्ष्यों में “और खेत का” शब्द नहीं हैं।
    reason: यूनानी संस्करण में καὶ τοῦ ἀγροῦ को कोष्ठकों में रखा गया है, जो पाठगत अनिश्चितता दर्शाता है।
  - marker: b
    text: कुछ प्राचीन पाठ-साक्ष्यों में “सारी” शब्द नहीं है।
    reason: यूनानी संस्करण में πάσας को कोष्ठकों में रखा गया है, इसलिए इस छोटे पाठांतर को दर्ज किया गया है।
lexical_decisions:
- source_word: δεσπότης
  choice: स्वामी
  rationale: यहाँ घरेलू और संपत्ति-संबंधी अधिकार रखने वाले मालिक के लिए स्वाभाविक तथा गरिमापूर्ण हिन्दी शब्द।
- source_word: ἀμπελών
  choice: दाख की बारी
  rationale: अंगूर की खेती के स्थान को सामान्य पाठक के लिए स्पष्ट रखते हुए पारंपरिक बाइबलीय अभिव्यक्ति को बनाए रखता है।
- source_word: κεχαρακωμένον
  choice: चारों ओर अच्छी तरह बाड़ लगी हुई थी
  rationale: क्रिया का अर्थ घेरा या बाड़ लगाए जाने से है; ‘चारों ओर’ हिन्दी में दृश्य को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: βοτάνας
  choice: जंगली घास
  rationale: संदर्भ में दाख की बारी को दबाने वाली अवांछित वनस्पति अभिप्रेत है; ‘जंगली घास’ साधारण और स्पष्ट हिन्दी है।
- source_word: ἐδέσμασιν
  choice: भोजन-सामग्री
  rationale: मूल शब्द खाद्य पदार्थों को दर्शाता है; इससे यह अस्पष्टता बनी रहती है कि वे तैयार भोजन थे या राशन के रूप में मिली वस्तुएँ।
- source_word: συγκληρονόμον
  choice: सह-उत्तराधिकारी
  rationale: संयुक्त रूप से विरासत पाने वाले व्यक्ति का सटीक अर्थ देता है और पुत्र के साथ सेवक की नई स्थिति को सुरक्षित रखता है।
theological_decisions:
- issue: सेवक का पुत्र के साथ सह-उत्तराधिकारी बनाया जाना
  choice: रूपक के कथन को सीधे और बिना व्याख्या के रखा गया
  alternative: इसे दत्तक ग्रहण या किसी विशिष्ट उद्धार-सिद्धांत के रूप में स्पष्ट करना
  rationale: मूल पाठ केवल सह-उत्तराधिकार की स्वीकृति बताता है; किसी विशिष्ट धर्मवैज्ञानिक पहचान को जोड़ना मूल की खुली रूपकात्मकता को अनावश्यक रूप से सीमित करता।
- issue: मित्रों की सहमति की तीव्रता
  choice: ‘और भी अधिक सहमत हुए’
  alternative: ‘उन्होंने सहर्ष स्वीकृति दी’
  rationale: ἔτι μᾶλλον की तुलनात्मक तीव्रता को बनाए रखा गया है, भले ही पूर्व सहमति का प्रसंग इस पाठ-खंड से बाहर हो।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। कृषि-संबंधी चित्र को सामान्य पाठक के लिए स्पष्ट बनाया गया है, जबकि सह-उत्तराधिकार और भोजन-सामग्री जैसे मुख्य अर्थगत तत्वों की मूल अस्पष्टता सुरक्षित रखी गई है।
