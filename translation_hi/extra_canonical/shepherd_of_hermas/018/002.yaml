base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/002.yaml
  text: 'I say to you who lead the church and to the first-seaters: do not become like poisoners. Poisoners carry their drugs in boxes; but you carry your drug and your poison in your heart. You are encrusted and do not wish to cleanse your hearts and to bring your understanding together as one in a pure heart, so that you may receive mercy from the great King. Watch then, children, lest these dissensions of yours deprive you of life. How can you wish to train the Lord’s chosen ones when you yourselves do not have training? Train one another and be at peace among yourselves, so that I also, standing joyfully before the Father, may give an account on behalf of you all to your Lord.'
translation:
  language: hi
  text: 'मैं तुमसे—जो कलीसिया की अगुवाई करते हो और जो प्रमुख आसनों पर बैठते हो—कहती हूँ: विष देनेवालों के समान मत बनो। विष देनेवाले अपनी दवाएँ डिब्बियों में रखते हैं, पर तुम अपनी दवा और अपना विष हृदय में रखते हो। तुम कठोर हो गए हो और अपने हृदयों को शुद्ध करना नहीं चाहते, न शुद्ध हृदय से अपनी समझ को एक करना चाहते हो, ताकि महान राजा से दया पाओ। इसलिए सावधान रहो, हे बच्चो, कहीं तुम्हारे ये आपसी फूट तुम्हें जीवन से वंचित न कर दें। जब तुम स्वयं शिक्षा नहीं पाए हो, तो प्रभु के चुने हुओं को शिक्षा कैसे देना चाहते हो? इसलिए एक-दूसरे को शिक्षा दो और आपस में शांति से रहो, ताकि मैं भी पिता के सामने आनंदपूर्वक खड़ी होकर तुम सब की ओर से तुम्हारे प्रभु को लेखा दे सकूँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: जो कलीसिया की अगुवाई करते हो
  rationale: यह पद कार्यगत नेतृत्व को व्यक्त करता है; स्वाभाविक आधुनिक हिन्दी में क्रियात्मक रूप पदवी विशेष तय किए बिना अर्थ सुरक्षित रखता है।
- source_word: τοῖς πρωτοκαθεδρίταις
  choice: जो प्रमुख आसनों पर बैठते हो
  rationale: शाब्दिक आसन-चित्र को बनाए रखता है और किसी बाद की विशिष्ट कलीसियाई पदवी को पाठ में नहीं लाता।
- source_word: φαρμακοῖς / φάρμακα
  choice: विष देनेवालों / विषैली दवाएँ
  rationale: φαρμακός यहाँ विष या हानिकारक औषधि रखनेवाले व्यक्ति की ओर संकेत करता है; इसी मूल से निकले φάρμακα के औषधि-विष शब्दालंकार को हिन्दी में यथासंभव रखा गया है।
- source_word: ἐνεσκιρωμένοι
  choice: कठोर हो गए हो
  rationale: दुर्लभ पद का मूल बिंब कठोर या पपड़ी-जमा अवस्था का है; हिन्दी में हृदय की जड़ता के संदर्भ में यह स्पष्ट और संक्षिप्त है।
- source_word: συνκεράσαι ὑμῶν τὴν φρόνησιν ἐπὶ τὸ αὐτό
  choice: अपनी समझ को एक करना
  rationale: मूल में विचार या मनोवृत्ति को मिलाकर एक करने का भाव है; अनावश्यक व्याख्या के बिना सामंजस्य व्यक्त होता है।
- source_word: παιδεύειν / παιδείαν
  choice: शिक्षा देना / शिक्षा पाना
  rationale: एक ही शब्द-परिवार की पुनरावृत्ति को बनाए रखा गया है; इसमें शिक्षा, अनुशासन और प्रशिक्षण की व्यापकता निहित रहती है।
- source_word: λόγον ἀποδῶ
  choice: लेखा दे सकूँ
  rationale: उत्तरदायित्वपूर्ण विवरण देने के सामान्य प्राचीन अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: महान राजा की पहचान
  choice: महान राजा
  alternative: परमेश्वर, महान राजा
  rationale: मूल केवल βασιλεὺς ὁ μέγας कहता है; पाठ की उपाधि को स्पष्ट पहचान जोड़कर सीमित नहीं किया गया।
- issue: पिता और प्रभु का संबंध
  choice: पिता के सामने ... तुम्हारे प्रभु को
  alternative: तुम्हारे प्रभु और पिता के सामने
  rationale: मूल में κατέναντι τοῦ πατρὸς और τῷ Κυρίῳ ὑμῶν अलग पद हैं; संभावित संदर्भगत तनाव को समतल किए बिना व्याकरणिक भेद रखा गया।
- issue: चुने हुओं की संज्ञा
  choice: प्रभु के चुने हुओं
  alternative: प्रभु के निर्वाचित जनों
  rationale: ἐκλεκτούς का धार्मिक अर्थ सुरक्षित रखते हुए सामान्य पाठक के लिए सहज और गैर-सांप्रदायिक शब्दावली चुनी गई।
- issue: कथावाचक स्त्री का लिंग
  choice: कहती हूँ ... खड़ी होकर
  alternative: कहता हूँ ... खड़ा होकर
  rationale: इस प्रसंग की वक्ता πρεσβυτέρα/स्त्री-रूप कलीसिया है और σταθεῖσα स्त्रीलिंग कृदंत है; अतः हिन्दी में स्त्रीलिंग स्पष्ट किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष उपदेशात्मक रजिस्टर अपनाया गया है। ‘कलीसिया’ पाठ की प्राचीन ईसाई संस्था के लिए प्रचलित और अपेक्षाकृत तटस्थ शब्द है। संबोधन बहुवचन में है; ‘हे बच्चो’ मूल τέκνα की पारिवारिक-उपदेशात्मक ध्वनि रखता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
