  revised_text: 'मैं तुमसे—जो कलीसिया की अगुवाई करते हो और जो प्रमुख आसनों पर बैठते हो—कहती हूँ: विष देनेवालों के समान मत बनो। विष देनेवाले अपनी दवाएँ डिब्बियों में रखते हैं, पर तुम अपनी दवा और अपना विष हृदय में रखते हो। तुम कठोर हो गए हो और अपने हृदयों को शुद्ध करना नहीं चाहते, न शुद्ध हृदय से अपनी समझ को एक करना चाहते हो, ताकि महान राजा से दया पाओ। इसलिए सावधान रहो, हे बच्चो, कहीं तुम्हारे ये आपसी फूट तुम्हें जीवन से वंचित न कर दें। जब तुम स्वयं शिक्षा नहीं पाए हो, तो प्रभु के चुने हुओं को शिक्षा कैसे देना चाहते हो? इसलिए एक-दूसरे को शिक्षा दो और आपस में शांति से रहो, ताकि मैं भी पिता के सामने आनंदपूर्वक खड़ी होकर तुम सब की ओर से तुम्हारे प्रभु को लेखा दे सकूँ।'
