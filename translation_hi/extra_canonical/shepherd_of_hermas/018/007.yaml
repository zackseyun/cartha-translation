base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/007.yaml
  text: 'And answering him I said, “Lord, this only I ask—that concerning the three forms of the aged woman the revelation may become complete.” He answered me and said: “How long will you be senseless? Rather, your double-mindednesses make you senseless, and your heart is not toward the Lord.”'
translation:
  language: hi
  text: मैंने उसे उत्तर दिया, “हे प्रभु, मैं केवल इतना ही माँगता हूँ कि उस वृद्धा के तीन रूपों के विषय में रहस्योद्घाटन पूर्ण हो जाए।” उसने मुझे उत्तर दिया, “तुम लोग कब तक नासमझ रहोगे? बल्कि तुम्हारे दोहरे मन तुम्हें नासमझ बनाते हैं, और तुम्हारा हृदय प्रभु की ओर नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: रूपों
  rationale: यह वृद्धा के तीन अलग-अलग दिखाई देने वाले स्वरूपों को स्वाभाविक और व्यापक अर्थ में व्यक्त करता है।
- source_word: πρεσβυτέρας
  choice: वृद्धा
  rationale: संदर्भ की सम्मानपूर्ण वृद्ध स्त्री के लिए आधुनिक, संक्षिप्त और गरिमापूर्ण शब्द।
- source_word: ἀποκάλυψις ὁλοτελὴς γένηται
  choice: प्रकाशन पूरा हो जाए
  rationale: वाक्य का आशय यह है कि तीन रूपों के विषय में मिला प्रकाशन पूर्ण रूप से स्पष्ट या संपन्न हो; अनावश्यक व्याख्या जोड़े बिना यूनानी संरचना को सहज हिन्दी में रखा गया है।
- source_word: ἀσύνετοι
  choice: समझहीन
  rationale: बुद्धि या आत्मिक समझ के अभाव को व्यक्त करता है और कठोर अपमानसूचक भाषा से बचता है।
- source_word: διψυχίαι
  choice: दुविधाएँ
  rationale: शाब्दिक रूप से विभाजित या दोहरे मन की अवस्थाओं का बहुवचन है; ‘दुविधाएँ’ अस्थिर और बँटे हुए मन का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὴν καρδίαν ὑμῶν πρὸς τὸν Κύριον
  choice: तुम्हारा हृदय प्रभु की ओर नहीं है
  rationale: ‘हृदय का प्रभु की ओर होना’ वाली दिशात्मक मूल छवि को सुरक्षित रखा गया है, बिना इसे किसी विशिष्ट धर्मशास्त्रीय सूत्र में बदलने के।
theological_decisions:
- issue: κύριε और Κύριον के अनुवाद
  choice: दोनों के लिए ‘प्रभु’
  alternative: पहले संबोधन में ‘स्वामी’ और बाद में ‘प्रभु’
  rationale: पहला शब्द युवक को संबोधित करता है और दूसरा स्पष्टतः प्रभु की ओर संकेत करता है। समान यूनानी पदावली को दृश्यमान रखते हुए ‘प्रभु’ चुना गया है; इससे संबोधन की संभावित ऊँचाई बनी रहती है, पर युवक की पहचान को स्पष्ट रूप से परमेश्वर नहीं ठहराया गया।
- issue: एक व्यक्ति से बहुवचन समुदाय की ओर संबोधन का परिवर्तन
  choice: ‘तुम लोग’ द्वारा बहुवचन स्पष्ट किया गया
  alternative: सर्वत्र अस्पष्ट ‘तुम’
  rationale: यूनानी पाठ में हरमास का संबोधन एकवचन है, पर युवक का उत्तर ἐστε और ὑμῶν के साथ बहुवचन में व्यापक समुदाय को संबोधित करता है। इस अर्थपूर्ण बदलाव को हिन्दी में छिपाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक संवाद के अनुकूल शैली रखी गई है। ‘वृद्धा’, ‘प्रकाशन’, ‘समझहीन’ और ‘दुविधाएँ’ सामान्य पाठक के लिए बोधगम्य रहते हुए प्राचीन धार्मिक संदर्भ की गंभीरता बनाए रखते हैं।
