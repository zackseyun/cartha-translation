  text: Answering him again, I said, “But from you, Lord, we shall learn these things more precisely.”
translation:
  language: hi
  text: मैंने उसे फिर उत्तर दिया, “परन्तु प्रभु, हम ये बातें आप ही से और अधिक ठीक-ठीक जानेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... πάλιν εἶπον
  choice: मैंने उसे फिर उत्तर दिया
  rationale: यूनानी प्रत्युत्तर-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ‘फिर’ से πάλιν को बनाए रखता है।
- source_word: ἀπὸ σοῦ
  choice: आप ही से
  rationale: स्रोत में बलपूर्वक आए ‘तुमसे’ को ‘ही’ द्वारा सुरक्षित रखा गया है; संबोधन की गरिमा के लिए आदरसूचक रूप चुना गया।
- source_word: κύριε
  choice: प्रभु
  rationale: κύριε का सामान्य और गरिमापूर्ण धार्मिक हिन्दी समतुल्य; यहाँ वक्ता युवक को इसी संबोधन से पुकारता है।
- source_word: ἀκριβέστερον
  choice: अधिक ठीक-ठीक
  rationale: तुलनात्मक अर्थ ‘और अधिक सटीक/विस्तृत रूप से’ को सरल, सहज हिन्दी में बनाए रखता है।
- source_word: γνωσόμεθα
  choice: जानेंगे
  rationale: भविष्यकाल और प्रथम पुरुष बहुवचन को ज्यों का त्यों रखा गया है, बिना इसे एकवचन में बदलने या ‘समझाया जाएगा’ के रूप में व्याख्यायित करने के।
- source_word: αὐτά
  choice: ये बातें
  rationale: पूर्वोक्त तीन रूपों से जुड़ी बातों के लिए हिन्दी का स्वाभाविक संदर्भसूचक प्रयोग।
theological_decisions:
- issue: κύριε में संबोधित व्यक्ति की पहचान
  choice: ‘प्रभु’ का अनुवाद रखा गया, पर संबोधित युवक को प्रभु यीशु के रूप में स्पष्टतः पहचानने वाली कोई व्याख्या नहीं जोड़ी गई।
  alternative: ‘महोदय’ या ‘स्वामी’
  rationale: मूल का धार्मिक/सम्मानसूचक संबोधन सुरक्षित रहता है और पात्र की सटीक पहचान संबंधी संभावित अस्पष्टता भी बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक संवाद और गरिमापूर्ण किंतु साधारण पाठकों के लिए सहज शैली। वाक्य की संक्षिप्त प्रत्युत्तरात्मक संरचना तथा मूल का बहुवचन ‘हम जानेंगे’ सुरक्षित रखा गया है।
