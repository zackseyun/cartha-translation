base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/001.yaml
  text: Be made holy from all wickedness and from all crookedness. But you do not want to depart from your wickedness. Now then, listen to me and be at peace among yourselves, and look after one another and support one another; and do not alone partake of God’s creatures in an overflow of abundance, but share also with those who are in want. For some, from their many foods, bring weakness upon the flesh and ruin their flesh; but the flesh of those who do not have food is ruined because they do not have enough nourishment, and their body is destroyed. This lack of moderation then is harmful to you who have and do not share with those who lack. Look to the judgment that is coming. Therefore, you who are well-off, seek out the hungry while the tower is not yet finished; for after the tower has been finished you will want to do good, and you will not have a place. So watch, you who pride yourselves in your wealth, lest those in need should groan, and their groaning go up to the Lord, and you
    be shut out together with your useless goods outside the door of the tower.
translation:
  language: hi
  text: 'हर प्रकार की बुराई और हर प्रकार की कुटिलता से पवित्र हो जाओ। पर तुम अपनी बुराई से दूर होना नहीं चाहते। इसलिए अब मेरी सुनो: आपस में शांति से रहो, एक-दूसरे की सुधि लो और एक-दूसरे की सहायता करो। परमेश्वर की बनाई हुई वस्तुओं का भरपूर उपभोग केवल अपने लिए न करो, बल्कि अभाव में पड़े लोगों के साथ भी बाँटो। क्योंकि कुछ लोग बहुत अधिक भोजन के कारण अपने शरीर को दुर्बल कर लेते हैं और अपने शरीर को बिगाड़ लेते हैं; पर जिन्हें भोजन नहीं मिलता, उनका शरीर पर्याप्त पोषण न मिलने के कारण बिगड़ जाता है और उनकी देह नष्ट हो जाती है। इसलिए यह असंतुलन तुम लोगों के लिए हानिकारक है, जिनके पास है, फिर भी अभाव में पड़े लोगों के साथ नहीं बाँटते। आने वाले न्याय पर ध्यान दो। इसलिए तुम जिनके पास बहुत है, जब तक मीनार पूरी नहीं हुई है, भूखों को खोजकर उनकी सहायता करो; क्योंकि मीनार पूरी हो जाने के बाद तुम भलाई करना चाहोगे, पर तुम्हारे लिए कोई स्थान नहीं होगा। इसलिए तुम जो अपने धन पर घमण्ड करते हो, सावधान रहो—कहीं ऐसा न हो कि अभाव में पड़े लोग कराहें और उनकी कराह प्रभु तक पहुँच जाए, और तुम अपनी व्यर्थ सम्पत्ति[a] समेत
    मीनार के द्वार के बाहर बन्द कर दिए जाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘व्यर्थ सम्पत्ति’ के पीछे का यूनानी शब्द पाठगत रूप से अनिश्चित है; स्रोत-पाठ में वह संपादकीय कोष्ठकों में है। इसका अर्थ सम्भवतः ‘बेकार/निष्प्रयोज्य’ या ‘असंयमित’ सम्पत्ति हो सकता है।
    reason: '[ἀσχέτων] की पाठगत अनिश्चितता और अर्थ की अस्पष्टता को बनाए रखना आवश्यक है।'
lexical_decisions:
- source_word: ἁγιασθῆτε
  choice: पवित्र हो जाओ
  rationale: यूनानी निष्क्रिय आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; आत्म-शुद्धि और पवित्र किए जाने, दोनों की ध्वनि को अनावश्यक रूप से सीमित नहीं करता।
- source_word: σκολιότητος
  choice: कुटिलता
  rationale: नैतिक टेढ़ेपन या छलपूर्ण आचरण को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὰ κτίσματα τοῦ Θεοῦ
  choice: परमेश्वर की सृजी हुई वस्तुएँ
  rationale: मूल के व्यापक ‘परमेश्वर की सृष्ट वस्तुएँ’ को बनाए रखता है; निकट संदर्भ में इसका संकेत भोजन और भौतिक साधनों की ओर है।
- source_word: ἐκ καταχύματος
  choice: भरपूर उपभोग
  rationale: अतिप्रचुरता या उमड़ती बहुतायत के भाव को सहज हिन्दी में देता है, बिना इसे केवल पेटूपन तक सीमित किए।
- source_word: ἀσυνκρασία
  choice: असंतुलन
  rationale: धनवानों की अधिकता और निर्धनों की कमी के सामाजिक-वितरणात्मक विरोध को ‘असंयम’ की अपेक्षा अधिक स्पष्टता से प्रकट करता है।
- source_word: οἱ ὑπερέχοντες
  choice: जिनके पास बहुत है
  rationale: यहाँ सामाजिक-आर्थिक रूप से अधिक साधन रखने वालों का संकेत है; ‘श्रेष्ठ’ कहने से नैतिक श्रेष्ठता का भ्रामक अर्थ निकल सकता था।
- source_word: ἐκζητεῖτε τοὺς πεινώντας
  choice: भूखों को खोजकर उनकी सहायता करो
  rationale: ἐκζητεῖτε की सक्रिय खोज को सुरक्षित रखता है; संदर्भ से निहित सहायता को स्पष्ट करता है।
- source_word: πύργος
  choice: मीनार
  rationale: हेरमास के दर्शन का मुख्य प्रतीक ज्यों का त्यों रखा गया है, उसकी व्याख्या अनुवाद में आरोपित नहीं की गई।
theological_decisions:
- issue: पवित्रीकरण की वाच्यता
  choice: ‘पवित्र हो जाओ’
  alternative: ‘अपने आपको पवित्र करो’
  rationale: मूल का निष्क्रिय रूप बनाए रखने से दैवी क्रिया और मानवीय उत्तरदायित्व के बीच की सम्भावित धार्मिक तनावशीलता अनिर्णीत रहती है।
- issue: मीनार पूरी होने के बाद ‘स्थान’ न मिलना
  choice: शाब्दिक ‘कोई स्थान नहीं होगा’
  alternative: ‘कोई अवसर नहीं मिलेगा’
  rationale: τόπον की प्रतीकात्मक अस्पष्टता को सुरक्षित रखा गया है; इसे केवल समयगत अवसर मानकर व्याख्यायित नहीं किया गया।
- issue: आने वाला न्याय और बाहर बन्द किया जाना
  choice: न्यायिक चेतावनी को सीधे रूप में रखा
  alternative: इसे केवल रूपकात्मक सामाजिक परिणाम के रूप में नरम करना
  rationale: पाठ स्पष्ट रूप से प्रभु तक कराह पहुँचने, आने वाले न्याय और मीनार से बाहर किए जाने की बात करता है; इसकी धार्मिक गम्भीरता बनाए रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण बहुवचन और सहज उपदेशात्मक शैली अपनाई गई है। वाक्य सामान्य पाठक के लिए स्पष्ट रखे गए हैं, जबकि ‘मीनार’, ‘न्याय’ और पवित्रीकरण जैसे धर्मवैचारिक बिम्बों की मूल अस्पष्टता सुरक्षित है।
