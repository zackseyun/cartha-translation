  text: X. When she had ceased speaking with me, the six young men who were building came and carried her to the tower, and four others lifted the cushioned seat and carried it also to the tower. I did not see their faces, because they were turned away.
translation:
  language: hi
  text: 10 जब वह मुझसे बात करना समाप्त कर चुकी, तो वे छह युवक, जो निर्माण कर रहे थे, आए और उसे बुर्ज तक ले गए। फिर चार अन्य लोगों ने गद्देदार आसन उठाया और उसे भी बुर्ज तक ले गए। मैंने उनके चेहरे नहीं देखे, क्योंकि वे दूसरी ओर मुँह किए हुए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύργος
  choice: बुर्ज
  rationale: दर्शन में निर्मित की जा रही मीनारनुमा संरचना के लिए स्वाभाविक और सुसंगत हिन्दी शब्द।
- source_word: συμψέλιον
  choice: गद्देदार आसन
  rationale: दुर्लभ यूनानी संज्ञा संदर्भ में बैठने के गद्देदार आसन को सूचित करती है; अनिश्चित वस्तु को अनावश्यक रूप से अधिक विशिष्ट नहीं किया गया।
- source_word: ἀπήνεγκαν
  choice: ले गए
  rationale: वस्तु और स्त्री दोनों को बुर्ज की ओर उठाकर/साथ ले जाने का सामान्य अर्थ; हिन्दी में सहज अभिव्यक्ति।
- source_word: ἀπεστραμμένοι
  choice: दूसरी ओर मुँह किए हुए
  rationale: उनके चेहरे न दिखने का कारण स्पष्ट करता है और यूनानी के भाव को स्वाभाविक हिन्दी में रखता है।
