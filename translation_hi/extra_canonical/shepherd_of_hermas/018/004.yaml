base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/004.yaml
  text: And as she was going, I asked her to reveal to me about the three forms in which she had appeared to me. She answered me and said, “About these, you must ask another, so that it may be revealed to you.”
translation:
  language: hi
  text: जब वह जा रही थी, मैंने उससे पूछा कि वह मुझे उन तीन रूपों के विषय में प्रकट करे, जिनमें वह मुझे दिखाई दी थी। उसने मुझे उत्तर दिया, “इन बातों के विषय में तुम्हें किसी दूसरे से पूछना चाहिए, ताकि ये बातें तुम्हें प्रकट हों।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: रूपों
  rationale: यह दृश्य में उसके प्रकट होने के तीन भिन्न स्वरूपों या आकृतियों को स्वाभाविक और व्यापक ढंग से व्यक्त करता है।
- source_word: ἐνεφανίσθη
  choice: दिखाई दी थी
  rationale: मध्य/निष्क्रिय भाव में दर्शन के भीतर उसके प्रकट होने को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀποκαλύψῃ / ἀποκαλυφθῇ
  choice: बताए / प्रकट की जाएँ
  rationale: पहले प्रयोग में स्वाभाविक हिन्दी के लिए ‘बताए’ रखा गया है, जबकि दूसरे में दैवी प्रकाशन के निष्क्रिय भाव को ‘प्रकट की जाएँ’ से सुरक्षित रखा गया है।
- source_word: ἕτερον
  choice: किसी और
  rationale: यूनानी पाठ उस अन्य व्यक्ति की पहचान नहीं बताता; इसलिए अस्पष्टता बनाए रखी गई है।
theological_decisions:
- issue: प्रकाशन देने वाले ‘किसी और’ की पहचान
  choice: पहचान को अनिर्दिष्ट रखा गया
  alternative: उसे स्वर्गदूत, प्रभु या किसी विशेष पात्र के रूप में पहचानना
  rationale: मूल पाठ केवल ἕτερον (‘दूसरे/किसी और’) कहता है और इस वाक्य में उसकी पहचान स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में स्त्री वक्ता का संदर्भ स्पष्ट है और मूल की अनिर्दिष्टता को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
