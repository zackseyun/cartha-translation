base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/005.yaml
  text: She appeared to me, brothers, in the first vision—the one last year—very aged and sitting on a chair. And in the second vision her appearance was younger, but her flesh and her hair were older, and as she stood she spoke to me; and she was more cheerful than before. And in the third vision she was wholly younger and most distinguished in beauty, only her hair was older; and she was cheerful to the end and was seated on a cushioned seat.
translation:
  language: hi
  text: भाइयो, पिछले वर्ष के पहले दर्शन में वह मुझे बहुत वृद्ध दिखाई दी और एक आसन पर बैठी थी। दूसरे दर्शन में उसका रूप अधिक युवा था, पर उसका शरीर और उसके बाल अधिक वृद्ध थे। वह खड़ी होकर मुझसे बातें कर रही थी और पहले से अधिक प्रसन्न थी। तीसरे दर्शन में वह पूरी तरह युवा और सौंदर्य में असाधारण दिखाई दी; केवल उसके बाल अधिक वृद्ध थे। वह अंत तक प्रसन्न रही और एक गद्दीदार आसन पर बैठी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρα
  choice: बहुत वृद्ध / वृद्धावस्था के
  rationale: पहले प्रयोग में स्त्री की अत्यधिक वृद्ध अवस्था और बाद के प्रयोगों में शरीर तथा बालों में बनी हुई वृद्धावस्था को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ὄψιν νεωτέραν
  choice: उसका रूप तो अधिक युवा था
  rationale: ὄψις यहाँ समग्र बाहरी रूप या दिखाई देने वाली अवस्था का संकेत करता है; इसे केवल ‘चेहरा’ तक सीमित नहीं किया गया।
- source_word: κάλλει ἐκπρεπεστάτη
  choice: अत्यंत सुंदर
  rationale: यह पद असाधारण और विशिष्ट सौंदर्य बताता है; सरल, गरिमापूर्ण हिन्दी में उसकी तीव्रता बनाए रखी गई है।
- source_word: ἱλαρά
  choice: प्रसन्न
  rationale: संदर्भ में शब्द उज्ज्वल, हर्षित या प्रसन्न भाव को व्यक्त करता है; ‘प्रसन्न’ आधुनिक हिन्दी में सबसे सहज है।
- source_word: συμψέλιον
  choice: गद्दीदार आसन
  rationale: यह दुर्लभ शब्द बैठने के एक गद्दीदार आसन का संकेत देता है; अनावश्यक रूप से किसी निश्चित फर्नीचर-प्रकार को थोपे बिना अर्थ दिया गया है।
theological_decisions:
- issue: दर्शन में दिखाई देने वाली स्त्री की पहचान
  choice: केवल स्त्रीवाचक सर्वनाम ‘वह’ रखा गया
  alternative: उसे स्पष्ट रूप से ‘कलीसिया’ कहना
  rationale: इस खंड में वक्ता उसकी पहचान सीधे नहीं बताता; अनुवाद ने कथानक की इस अवस्था में निहित अस्पष्टता को बनाए रखा है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। तीनों दर्शनों के बीच वृद्धावस्था, युवावस्था और प्रसन्नता के विरोधाभास को समझाने के बजाय मूल की तरह खुला रखा गया है।
