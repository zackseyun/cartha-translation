  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/006.yaml
  text: 'About these things I was very much distressed, wanting to know this revelation. And I see the aged woman in a vision of the night, saying to me: “Every inquiry has need of humility; therefore fast, and you will receive what you ask from the Lord.” So I fasted one day, and on that very night a young man appeared to me and said to me: “Since you are asking for revelations in prayer, watch lest by asking for many things you harm your flesh. These revelations are sufficient for you. Are you able to see revelations more powerful than those you have seen?”'
translation:
  language: hi
  text: इन बातों के विषय में मैं इस प्रकाशन को जानना चाहता था, इसलिए बहुत व्याकुल था। तब मैंने रात के एक दर्शन में उस वृद्धा को मुझसे यह कहते देखा, “हर प्रश्न के लिए नम्रता आवश्यक है; इसलिए उपवास करो, और तुम प्रभु से जो माँगते हो, वह तुम्हें मिलेगा।” तब मैंने एक दिन उपवास किया, और उसी रात एक युवक मुझे दिखाई दिया और उसने मुझसे कहा, “तुम प्रार्थना में प्रकाशन माँगते हो; सावधान रहो, कहीं बहुत अधिक माँगकर अपने शरीर को हानि न पहुँचा लो। ये प्रकाशन तुम्हारे लिए पर्याप्त हैं। क्या तुम उन प्रकाशनों से भी अधिक सामर्थ्यवान प्रकाशन देख सकते हो, जिन्हें तुम देख चुके हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: बहुत व्याकुल
  rationale: यह शब्द गहरे दुःख और मानसिक व्याकुलता को व्यक्त करता है; प्रसंग में रहस्य जानने की तीव्र चिंता प्रमुख है।
- source_word: ἀποκάλυψιν
  choice: प्रकाशन
  rationale: दिव्य रूप से प्रकट किए गए अर्थ या रहस्य के लिए स्वाभाविक और धर्मसंगत हिन्दी शब्द।
- source_word: ταπεινοφροσύνης
  choice: नम्रता
  rationale: मन की दीनता या विनम्र वृत्ति का सीधा, सामान्य और गरिमापूर्ण रूप।
- source_word: ὑπὸ χεῖρα αἰτεῖς
  choice: लगातार … माँगते रहते हो
  rationale: दुर्लभ मुहावरे का आशय बार-बार अथवा तत्परता से माँगना प्रतीत होता है; हिन्दी में अर्थ स्पष्ट रखते हुए मुहावरेदार अनुवाद किया गया है।
- source_word: ἰσχυροτέρας
  choice: अधिक प्रबल
  rationale: तुलनात्मक बल को सुरक्षित रखता है और प्रकाशनों की तीव्रता या सामर्थ्य को अनावश्यक रूप से केवल 'महान' नहीं बनाता।
theological_decisions:
- issue: उपवास और प्रार्थना के फल का संबंध
  choice: “उपवास करो, और जो तुम प्रभु से माँगते हो, वह तुम्हें मिलेगा”
  alternative: “उपवास करो, ताकि तुम्हें प्रभु से माँगी हुई वस्तु मिले”
  rationale: ग्रीक की आज्ञा और भविष्यकालीन प्रतिज्ञा को सीधे रखा गया है, बिना उपवास को यांत्रिक या योग्यता-अर्जक साधन घोषित किए।
- issue: दर्शन सह पाने की क्षमता
  choice: “क्या तुम … अधिक प्रबल प्रकाशन देख सकोगे?”
  alternative: “क्या तुम … अधिक शक्तिशाली प्रकाशनों को देखने में समर्थ हो?”
  rationale: मूल का प्रश्न खुला रखा गया है; इसे निषेध या निश्चित असमर्थता में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वृद्ध स्त्री के लिए पूरे अंश के अनुरूप “वृद्धा” और दिव्य revelation के लिए “प्रकाशन” रखा गया है। यूनानी के ऐतिहासिक वर्तमान “मैं देखता हूँ” को स्वाभाविक हिन्दी कथन “मैंने … देखा” बनाया गया है।
