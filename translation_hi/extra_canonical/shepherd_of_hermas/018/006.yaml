- from: इन बातों के विषय में मैं बहुत व्याकुल था, क्योंकि मैं इस प्रकाशन का अर्थ जानना चाहता था। तब रात के एक दर्शन में मैंने उस वृद्धा को मुझसे यह कहते देखा, “हर पूछताछ के लिए नम्रता आवश्यक है। इसलिए उपवास करो, और जो तुम प्रभु से माँगते हो, वह तुम्हें मिलेगा।” तब मैंने एक दिन उपवास किया। उसी रात एक युवक ने मुझे दर्शन देकर कहा, “तुम प्रार्थना में लगातार प्रकाशन माँगते रहते हो। सावधान रहो, कहीं बहुत अधिक माँगकर अपने शरीर को हानि न पहुँचा लो। ये प्रकाशन तुम्हारे लिए पर्याप्त हैं। जो प्रकाशन तुम देख चुके हो, क्या तुम उनसे भी अधिक प्रबल प्रकाशन देख सकोगे?”
