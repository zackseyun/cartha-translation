base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/001.yaml
  text: He says, “I told you just now that you are crafty and headstrong, asking for the interpretations of the parables. But since you are so persistent, I will interpret for you the parable of the field and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having labored much and endured many toils—for no one can dig without toil or labor.
translation:
  language: hi
  text: वह कहता है, “मैंने अभी तुमसे कहा था कि तुम बहुत धूर्त और हठी हो, जो दृष्टान्तों की व्याख्याएँ पूछते रहते हो। पर चूँकि तुम इतने आग्रहशील हो, मैं तुम्हें खेत के दृष्टान्त और उसके बाद आनेवाली अन्य बातों की व्याख्या करूँगा। उसने उन्हें उनकी देखभाल के लिए स्वर्गदूतों को सौंप दिया; और उसने स्वयं बहुत परिश्रम किया और बहुत-सी कठिनाइयाँ सहकर उनके पापों को शुद्ध किया—क्योंकि कोई भी परिश्रम या मेहनत के बिना भूमि नहीं खोद सकता।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान पर उपलब्ध यूनानी पाठ ‘उसके बाद आनेवाली अन्य बातों’ के बाद खंडित/OCR-विकृत है। आगे का वाक्य-क्रम सुरक्षित संदर्भ और प्राचीन पाठ की प्रचलित पुनर्रचना के अनुसार दिया गया है।
    reason: प्रदत्त यूनानी स्रोत में इस बिंदु पर पाठ-लोप है, जबकि अंग्रेज़ी POB audit trail और व्यापक संदर्भ अगले सुरक्षित आशय का समर्थन करते हैं।
lexical_decisions:
- source_word: πανοῦργος
  choice: बड़े चतुर
  rationale: यह शब्द यहाँ प्रश्नकर्ता की ऐसी चतुराई को सूचित करता है जिसमें कुछ धूर्तता का रंग भी हो सकता है; ‘चतुर’ स्वाभाविक हिन्दी है और प्रसंग की हल्की झिड़की बनाए रखता है।
- source_word: αὐθάδης
  choice: हठी
  rationale: मूल का अर्थ अपनी बात पर अड़े रहने वाला या उद्दंड है; अगले वाक्य के ‘आग्रहशील’ भाव के साथ ‘हठी’ उपयुक्त है।
- source_word: ἐπιλύσεις
  choice: अर्थ
  rationale: दृष्टान्तों के संदर्भ में इसका आशय व्याख्या या अर्थ खोलने से है; सामान्य पाठक के लिए ‘अर्थ’ सहज है।
- source_word: παράμονος
  choice: आग्रहशील
  rationale: यहाँ लगातार लगे रहने और बार-बार माँगने का भाव है; ‘आग्रहशील’ इसे बिना अनावश्यक नकारात्मकता के व्यक्त करता है।
- source_word: συντηρεῖν
  choice: देखभाल करने
  rationale: शब्द में सुरक्षित रखने, संभालने और निगरानी करने का भाव है; प्रसंग में ‘देखभाल’ स्वाभाविक और व्यापक है।
- source_word: ἐκαθάρισε
  choice: शुद्ध किया
  rationale: पापों के साथ प्रयुक्त क्रिया शुद्ध करने या साफ कर देने का धार्मिक रूपक रखती है; इसे केवल ‘क्षमा किया’ कहना मूल की छवि को संकुचित कर देता।
- source_word: σκαφεῦσαι
  choice: भूमि खोद सकता
  rationale: क्रिया खोदने या कुदाल चलाने को दर्शाती है और खेत के दृष्टान्त से जुड़ी ठोस छवि को बनाए रखती है।
theological_decisions:
- issue: ‘पापों को शुद्ध किया’ का अर्थ
  choice: मूल की शुद्धीकरण-संबंधी भाषा को ज्यों का त्यों बनाए रखा गया
  alternative: ‘उनके पाप क्षमा किए’
  rationale: ἐκαθάρισε क्षमा की अपेक्षा शुद्ध करने की छवि देता है; अनुवाद उस छवि को किसी विशिष्ट प्रायश्चित्त-सिद्धान्त में नहीं बदलता।
- issue: ‘उसने’ और ‘उनकी’ के पूर्वपद
  choice: मूल की सर्वनामगत अस्पष्टता सुरक्षित रखी गई
  alternative: व्यक्तियों की पहचान स्पष्ट नामों से करना
  rationale: उपलब्ध खंड में पूर्वपद पूर्णतः स्पष्ट नहीं हैं; नाम जोड़ना पाठ से आगे जाकर धर्मवैज्ञानिक निष्कर्ष थोपता।
translation_notes:
  register: आधुनिक, सहज और सम्मानपूर्ण हिन्दी रखी गई है। संवाद की झिड़की को ‘चतुर और हठी’ से व्यक्त किया गया है, जबकि कृषि-रूपक और पाप-शुद्धीकरण की मूल छवियाँ सुरक्षित हैं।
