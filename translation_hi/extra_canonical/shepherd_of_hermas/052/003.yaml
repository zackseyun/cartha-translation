base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/003.yaml
  text: The Holy Spirit, which preexisted, which created all creation, God caused to dwell in flesh that he willed. This flesh, then, in which the Holy Spirit dwelt, served the Spirit well, walking in modesty and purity, in no way at all defiling the Spirit. Therefore, since it had conducted itself well and purely, and had toiled together with the Spirit and cooperated in every matter, conducting itself strongly and courageously, he chose it as a partner with the Holy Spirit; for the conduct of this flesh pleased [the Lord], because it was not defiled upon the earth while having the Holy Spirit.
translation:
  language: hi
  text: पवित्र आत्मा, जो पहले से विद्यमान था और जिसने सारी सृष्टि की रचना की, परमेश्वर ने उसे उस शरीर में वास कराया जिसे उसने चाहा। तब वह शरीर, जिसमें पवित्र आत्मा ने वास किया, आत्मा की अच्छी तरह सेवा करता रहा; वह मर्यादा और पवित्रता से चलता रहा और उसने आत्मा को किसी भी प्रकार अशुद्ध नहीं किया। इसलिए, जब उसने अच्छा और पवित्र आचरण किया, आत्मा के साथ परिश्रम किया, हर काम में उसके साथ कार्य किया, और दृढ़ता तथा साहस से जीवन बिताया, तब उसने उसे पवित्र आत्मा का सहभागी चुन लिया; क्योंकि इस शरीर का आचरण [प्रभु] को भाया, क्योंकि पवित्र आत्मा को धारण किए हुए भी वह पृथ्वी पर अशुद्ध नहीं हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τὸ ἅγιον τὸ προόν
  choice: पवित्र आत्मा, जो पहले से विद्यमान था
  rationale: προόν पूर्व-अस्तित्व को व्यक्त करता है; ‘पहले से विद्यमान’ इसका स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: κατῴκισεν ... εἰς σάρκα ἣν ἠβούλετο
  choice: अपनी इच्छा के अनुसार चुने हुए शरीर में वास कराया
  rationale: शाब्दिक अर्थ ‘जिस शरीर को उसने चाहा’ है। हिन्दी में संबंध स्पष्ट रखने के लिए इच्छा और चयन दोनों को व्यक्त किया गया है, बिना शरीर की पहचान तय किए।
- source_word: ἐν σεμνότητι καὶ ἁγνείᾳ
  choice: मर्यादा और पवित्रता से
  rationale: σεμνότης के गरिमामय, शालीन आचरण को ‘मर्यादा’ और ἁγνεία की नैतिक शुद्धता को ‘पवित्रता’ से व्यक्त किया गया है।
- source_word: συγκοπιάσασαν ... συνεργήσασαν
  choice: आत्मा के साथ परिश्रम किया, हर काम में सहयोग दिया
  rationale: दोनों निकटार्थक क्रियाओं—साथ परिश्रम करना और साथ कार्य करना—का भेद बनाए रखा गया है।
- source_word: κοινωνόν
  choice: सहभागी
  rationale: यह संगति, साझेदारी और सहभागिता की व्यापकता बनाए रखता है; ‘साथी’ की अपेक्षा धार्मिक गद्य में अधिक सटीक है।
- source_word: ἔχουσα τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा को धारण किए हुए
  rationale: ἔχουσα का सीधा भाव बनाए रखते हुए भीतर उपस्थित आत्मा का संकेत दिया गया है; इसे पुनः ‘वास’ कहकर अनावश्यक समानता नहीं की गई।
theological_decisions:
- issue: पवित्र आत्मा और ‘शरीर’ के संबंध की व्याख्या
  choice: मूल पाठ की ‘आत्मा ने शरीर में वास किया’ वाली भाषा को बनाए रखा गया।
  alternative: ‘देहधारण’ या किसी विशिष्ट मसीही सिद्धांत की पारिभाषिक शब्दावली जोड़ना।
  rationale: यह अंश अपने विशिष्ट रूपकात्मक और धर्मवैज्ञानिक कथन में तनाव रखता है; अनुवाद को किसी बाद की सिद्धांत-व्यवस्था के अनुसार स्पष्ट नहीं करना चाहिए।
- issue: किसने शरीर को सहभागी चुना
  choice: ‘परमेश्वर ने’ स्पष्ट किया गया।
  alternative: सर्वनाम ‘उसने’ बनाए रखना, जो हिन्दी में आत्मा या परमेश्वर दोनों की ओर संकेत कर सकता था।
  rationale: निकटवर्ती व्यापक संदर्भ में कर्ता परमेश्वर है, जिसने शरीर में आत्मा को वास कराया और परामर्श लिया; हिन्दी में अस्पष्ट सर्वनाम भ्रमकारी होता।
- issue: पाठ में कोष्ठकबद्ध τῷ Κυρίῳ
  choice: '[प्रभु] को भाया'
  alternative: ‘परमेश्वर को भाया’ या बिना कोष्ठक ‘प्रभु को भाया’।
  rationale: स्रोत-संपादन में शब्द कोष्ठकबद्ध है, इसलिए पाठगत अनिश्चितता को मुख्य पाठ में वर्गाकार कोष्ठकों द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली अपनाई गई है। ‘शरीर’ को पूरे अंश में एकसमान रखा गया है, क्योंकि स्रोत का σάρξ यहाँ बार-बार एक ही विषय के रूप में आता है। पाठगत कोष्ठक [प्रभु] स्रोत की संपादकीय अनिश्चितता दर्शाता है, फुटनोट-चिह्न नहीं।
