base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/004.yaml
  text: Therefore he took the Son and the glorious angels as counselors, in order that this flesh also, having served the Spirit blamelessly, might have some place of dwelling, and might not seem to have lost the reward of its service. For every flesh that is found undefiled and unstained, in which the Holy Spirit has dwelt, will receive a reward. You have the interpretation of this parable also.”
translation:
  language: hi
  text: इसलिए उसने पुत्र और महिमामय स्वर्गदूतों को सलाहकार बनाया, ताकि यह देह भी, जिसने आत्मा की सेवा निर्दोष होकर की थी, निवास के लिए कोई स्थान पाए और ऐसा न लगे कि उसने अपनी सेवा का प्रतिफल खो दिया है। क्योंकि हर वह देह प्रतिफल पाएगी जो निर्मल और निष्कलंक पाई जाएगी और जिसमें पवित्र आत्मा ने निवास किया है। इस दृष्टान्त की व्याख्या भी तुम्हें मिल गई है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμβουλον ... ἔλαβε
  choice: सलाहकार बनाया
  rationale: यूनानी पद का स्वाभाविक हिन्दी रूप; विचार-विमर्श में सम्मिलित करने का भाव बनाए रखता है।
- source_word: σὰρξ
  choice: देह
  rationale: यहाँ शारीरिक अस्तित्व के लिए बार-बार प्रयुक्त धार्मिक-नैतिक पद है; ‘मांस’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: δουλεύσασα
  choice: सेवा की थी
  rationale: πνεῦμα के प्रति निष्ठापूर्ण सेवा का भाव देता है; ‘दासता’ यहाँ अनावश्यक कठोरता लाती।
- source_word: ἀμέμπτως
  choice: निर्दोष होकर
  rationale: ऐसी सेवा का अर्थ व्यक्त करता है जिसमें दोष लगाने का आधार न हो।
- source_word: τόπον τινὰ κατασκηνώσεως
  choice: निवास के लिए कोई स्थान
  rationale: अनिश्चितता (τινά) और बसने/निवास करने के अर्थ को सुरक्षित रखता है।
- source_word: μισθὸν
  choice: प्रतिफल
  rationale: सेवा के बदले मिलने वाले फल या पुरस्कार का गरिमापूर्ण और व्यापक हिन्दी शब्द।
- source_word: ἀμίαντος καὶ ἄσπιλος
  choice: निर्मल और निष्कलंक
  rationale: दोनों निकटार्थक विशेषणों की अलंकारिक जोड़ी और नैतिक शुद्धता बनाए रखी गई है।
- source_word: ἐπίλυσιν
  choice: अर्थ
  rationale: दृष्टान्त की व्याख्या/समाधान के लिए साधारण पाठक को सहज शब्द।
theological_decisions:
- issue: ‘पुत्र’ और ‘महिमामय स्वर्गदूतों’ को सलाहकार बनाए जाने का कथन
  choice: मूल कथन को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा
  alternative: इसे औपचारिक त्रित्ववादी या स्वर्गदूतीय पदानुक्रम की भाषा में स्पष्ट करना
  rationale: पाठ की अपनी असामान्य धर्मवैज्ञानिक अभिव्यक्ति और तनाव को किसी बाद की पद्धति के अनुसार हल नहीं किया गया।
- issue: ‘हर देह’ के प्रतिफल की शर्त
  choice: निर्मल और निष्कलंक पाई जाने तथा पवित्र आत्मा के निवास—दोनों को स्पष्ट रखा
  alternative: इसे केवल मसीह की देह या सामान्य विश्वासियों तक सीमित कर देना
  rationale: यूनानी πᾶσα σάρξ व्यापक है; संदर्भगत संभावनाओं को अनुवाद में संकीर्ण नहीं किया गया।
- issue: κατασκήνωσις का आशय
  choice: ‘निवास’
  alternative: विशेष रूप से ‘स्वर्ग में स्थान’ या ‘अनन्त निवास’
  rationale: मूल पाठ स्थान की प्रकृति स्पष्ट नहीं करता, इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली। कथन की पुनरुक्ति और तर्क-क्रम को बनाए रखा गया है। उद्धरण का समापन चिह्न दिया गया है क्योंकि यह वक्ता के प्रत्यक्ष कथन का अंत है।
