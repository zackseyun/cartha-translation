  text: Therefore, having cleansed the sins of the people, he showed them the paths of life, giving them the law that he received from his Father. “You see,” he says, “that he himself is Lord of the people, having received all authority from his Father. And as for the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the servant—listen.
translation:
  language: hi
  text: इसलिए लोगों के पापों को शुद्ध करके उसने उन्हें जीवन के मार्ग दिखाए और वह व्यवस्था दी जो उसे अपने पिता से मिली थी। उसने कहा, “तुम देखते हो कि वह स्वयं लोगों का प्रभु है, क्योंकि उसने अपने पिता से समस्त अधिकार पाया है। और जहाँ तक इस बात का संबंध है कि प्रभु ने दास की विरासत के विषय में अपने पुत्र और महिमामय स्वर्गदूतों को परामर्श के लिए साथ लिया—सुनो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρίσας τὰς ἁμαρτίας
  choice: पापों को शुद्ध करने के बाद
  rationale: ‘καθαρίζω’ के शुद्ध करने वाले बिंब को बनाए रखता है; इसे केवल ‘क्षमा करना’ कहकर अर्थ को संकुचित नहीं करता।
- source_word: τὰς τρίβους τῆς ζωῆς
  choice: जीवन के मार्ग
  rationale: ग्रीक बहुवचन और मार्ग-बिंब को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: τὸν νόμον
  choice: वह व्यवस्था
  rationale: धार्मिक-साहित्यिक संदर्भ में νόμος के लिए प्रचलित और गरिमापूर्ण हिन्दी पद।
- source_word: κύριός ἐστι τοῦ λαοῦ
  choice: लोगों का प्रभु है
  rationale: κύριος की प्रभुता और संबंधसूचक वाक्य-विन्यास दोनों को बनाए रखता है।
- source_word: ἐξουσίαν πᾶσαν
  choice: पूरा अधिकार
  rationale: संपूर्ण प्रदत्त सत्ता का अर्थ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: σύμβουλον ἔλαβε
  choice: सलाहकार बनाया
  rationale: मुहावरे का कार्यगत अर्थ व्यक्त करता है; ‘परामर्श के लिए साथ लिया’ भी संभव है, पर हिन्दी में यह अधिक सहज है।
- source_word: περὶ τῆς κληρονομίας τοῦ δούλου
  choice: दास की विरासत के विषय में
  rationale: κληρονομία और δοῦλος को बिना व्याख्यात्मक विस्तार के औपचारिक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: पुत्र और स्वर्गदूतों का सलाहकार होना
  choice: पाठ की भाषा के अनुसार ‘अपने पुत्र और महिमामय स्वर्गदूतों को सलाहकार बनाया’
  alternative: इसे केवल निर्णय के साक्षी या अनुमोदक कहना
  rationale: मूल σύμβουλον ἔλαβε को उसकी असामान्य धर्मवैचारिक तनाव सहित रखा गया है; बाद की व्यवस्थित धर्मशास्त्रीय धारणाओं के अनुसार नरम नहीं किया गया।
- issue: पिता से अधिकार प्राप्त करना
  choice: ‘अपने पिता से पूरा अधिकार पाया’
  alternative: अधिकार को स्वभावतः अपना बताना
  rationale: λαβὼν παρὰ τοῦ πατρὸς प्रदत्त अधिकार को स्पष्ट रूप से व्यक्त करता है और स्रोत की अधीनतामूलक भाषा को बनाए रखता है।
- issue: पापों को शुद्ध करना
  choice: ‘पापों को शुद्ध करने’ की मूल उपमा बनाए रखना
  alternative: ‘पाप क्षमा करने’ या ‘लोगों को पाप से शुद्ध करने’ के रूप में व्याख्या करना
  rationale: मूल पाठ सीधे पापों को कर्म का विषय बनाता है; अनुवाद उस असामान्य संरचना को अनावश्यक रूप से नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘प्रभु’, ‘व्यवस्था’, ‘विरासत’ और ‘महिमामय स्वर्गदूत’ स्रोत के धार्मिक-साहित्यिक रजिस्टर को बनाए रखते हैं। प्रत्यक्ष कथन के भीतर वक्ता-सूचक ‘उसने कहा’ को स्वाभाविक हिन्दी क्रम में रखा गया है।
