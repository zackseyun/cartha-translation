  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/002.yaml
  text: '“Listen now,” he says: “Keep this flesh of yours pure and undefiled, so that the spirit that dwells in it may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in your heart that this flesh of yours is perishable, and you misuse it in some defilement. For if you defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh, you will not live.”'
translation:
  language: hi
  text: वह कहता है, “अब सुनो। अपने इस शरीर को शुद्ध और निष्कलंक रखो, ताकि इसमें वास करनेवाला आत्मा इसके पक्ष में गवाही दे और तुम्हारा शरीर धर्मी ठहराया जाए। सावधान रहो कि तुम्हारे मन में कभी यह विचार न उठे कि तुम्हारा यह शरीर नाशवान है, और तुम किसी प्रकार की अशुद्धता में इसका दुरुपयोग करो। क्योंकि यदि तुम अपने शरीर को अशुद्ध करोगे, तो पवित्र आत्मा को भी अशुद्ध करोगे; और यदि तुम शरीर[a] को अशुद्ध करोगे, तो जीवित न रहोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ ‘शरीर’ शब्द पाठगत रूप से अनिश्चित चिह्नित है।
    reason: मूल पाठ में †τὴν σάρκα† दिया है; टिप्पणी अनिश्चितता बताती है, पर किसी विशिष्ट वैकल्पिक पाठ का असमर्थित दावा नहीं करती।
lexical_decisions:
- source_word: σάρξ
  choice: शरीर
  rationale: यहाँ मनुष्य के देहगत अस्तित्व का सामान्य और स्वाभाविक हिन्दी बोध देता है; ‘मांस’ अनावश्यक रूप से शाब्दिक और भ्रामक होता।
- source_word: καθαρὰν καὶ ἀμίαντον
  choice: शुद्ध और निष्कलंक
  rationale: 'दोनों विशेषणों का भेद बनाए रखता है: पहला शुद्धता और दूसरा दाग या दूषण से रहित होने पर बल देता है।'
- source_word: μαρτυρήσῃ αὐτῇ
  choice: इसके पक्ष में गवाही दे
  rationale: ग्रीक के सम्प्रदान कारक को अनुकूल या समर्थनकारी गवाही के रूप में स्वाभाविक हिन्दी में व्यक्त करता है, बिना अर्थ को अत्यधिक निश्चित किए।
- source_word: δικαιωθῇ
  choice: धर्मी ठहराया जाए
  rationale: न्यायिक-धार्मिक अर्थ और कर्मवाच्य रूप को बनाए रखता है; इसे केवल ‘सही सिद्ध हो’ तक सीमित नहीं करता।
- source_word: παραχρήσῃ
  choice: दुरुपयोग करो
  rationale: शरीर के अनुचित उपयोग का भाव स्पष्ट करता है और आधुनिक हिन्दी में सहज है।
- source_word: ἐν μιασμῷ τινί
  choice: किसी अशुद्ध काम में
  rationale: दूषण या अपवित्रता के क्षेत्र में शरीर के दुरुपयोग का आशय सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: οὐ ζήσῃ
  choice: जीवित न रहोगे
  rationale: ग्रीक की संक्षिप्त और गंभीर चेतावनी को बनाए रखता है, बिना यह तय किए कि जीवन शारीरिक है, आत्मिक है या परमेश्वर-संबंधी।
theological_decisions:
- issue: शरीर और उसमें वास करनेवाले आत्मा का संबंध
  choice: शरीर और आत्मा को अलग पदों के रूप में रखते हुए दोनों के अशुद्ध होने की परस्पर संबद्धता व्यक्त की गई है।
  alternative: आत्मा को मनुष्य की अपनी आत्मा या केवल पवित्र आत्मा मानकर पूरे अनुच्छेद को उसी के अनुसार स्पष्ट करना।
  rationale: पहले वाक्य में केवल ‘आत्मा’ और बाद में ‘पवित्र आत्मा’ आता है; अनुवाद इस तनाव को किसी व्यवस्थित धर्मसिद्धांत से नहीं मिटाता।
- issue: δικαιωθῇ में धार्मिक/न्यायिक अर्थ
  choice: ‘धर्मी ठहराया जाए’
  alternative: ‘निर्दोष सिद्ध हो’ या ‘उचित ठहरे’
  rationale: यह शब्द के प्रबल न्यायिक-धार्मिक आयाम को सुरक्षित रखता है और शरीर के धर्मी ठहराए जाने की असामान्य अभिव्यक्ति को सरल करके नहीं हटाता।
- issue: ‘जीवित न रहोगे’ का आशय
  choice: अस्पष्टता को यथावत रखा गया है।
  alternative: इसे ‘अनन्त जीवन न पाओगे’ या ‘मर जाओगे’ के रूप में स्पष्ट करना।
  rationale: मूल पाठ जीवन की प्रकृति नहीं बताता, इसलिए किसी विशिष्ट दंडशास्त्रीय व्याख्या को जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष उपदेशात्मक लहजा रखा गया है। वाक्य सरल हैं, पर ‘धर्मी ठहराया जाए’ और ‘पवित्र आत्मा’ जैसी धर्मवैचारिक पदावली मूल के तनाव को सुरक्षित रखने के लिए बरकरार है।
