lexical_decisions:
- source_word: Ηὐφράνθην
  choice: मुझे बहुत आनन्द हुआ
  rationale: यूनानी क्रिया के हर्षित होने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κύριε
  choice: स्वामी
  rationale: यहाँ संबोधित व्यक्ति के प्रति आदर सूचक संबोधन है; ‘प्रभु’ कहने से अनावश्यक रूप से ईश्वरीय संबोधन का अर्थ आ सकता है।
- source_word: ἐπίλυσιν
  choice: व्याख्या
  rationale: संदर्भ में किसी बात का अर्थ खोलकर समझाना अभिप्रेत है; ‘व्याख्या’ स्पष्ट और सहज है।
- source_word: φημί
  choice: मैंने कहा
  rationale: संवाद के कथावाचकीय सूत्र को स्वाभाविक हिन्दी भूतकाल में प्रस्तुत करता है।
