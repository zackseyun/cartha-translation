  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/003.yaml
  text: “But if, Sir,” I say, “there has been some former ignorance before these words were heard, how will the man who has defiled his flesh be saved?”
translation:
  language: hi
  text: मैंने कहा, “परन्तु, प्रभु, यदि इन बातों को सुनने से पहले किसी से अज्ञानवश कुछ हुआ हो, तो जिस मनुष्य ने अपने शरीर को अशुद्ध कर लिया है, उसका उद्धार कैसे होगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: प्रभु
  rationale: यह सम्मानपूर्ण संबोधन है; प्रसंग में वक्ता उस प्रकाशन देने वाले पात्र को आदर से संबोधित करता है।
- source_word: ἄγνοια προτέρα
  choice: पहले ... अनजाने में पाप
  rationale: ἄγνοια अज्ञान अथवा अनजाने किए गए अपराध का भाव रखता है; अगले वाक्य के ἀγνοημάτων को देखते हुए केवल बौद्धिक ‘अज्ञान’ की अपेक्षा अनजाने पाप का अर्थ अधिक स्पष्ट है।
- source_word: πρὶν ἀκουσθῶσι τὰ ῥήματα ταῦτα
  choice: इन बातों को सुनने से पहले
  rationale: ग्रीक निष्क्रिय क्रिया का अर्थ स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ὁ μιάνας τὴν σάρκα αὐτοῦ
  choice: जिस मनुष्य ने अपने शरीर को अशुद्ध कर लिया है
  rationale: μιαίνω नैतिक अथवा धार्मिक अशुद्धता बताता है; σάρξ को प्रसंगानुसार ‘शरीर’ कहा गया है।
- source_word: πῶς σωθῇ
  choice: उसका उद्धार कैसे होगा
  rationale: σωθῇ के उद्धार-संबंधी प्रश्न को स्पष्ट रखते हुए कर्मवाच्य भाव सुरक्षित है।
theological_decisions:
- issue: पूर्व अज्ञान और नैतिक दोष का संबंध
  choice: ‘अनजाने में पाप किया हो’
  alternative: ‘पहले अज्ञान रहा हो’
  rationale: यह चयन अगले प्रश्न—शरीर को अशुद्ध करने वाले के उद्धार—से संबंध स्पष्ट करता है, पर जानबूझकर किए पाप के विषय में कोई अतिरिक्त सिद्धांत नहीं जोड़ता।
- issue: σάρξ का अर्थ
  choice: शरीर
  alternative: देह / पापी स्वभाव
  rationale: यहाँ σάρξ मनुष्य के भौतिक शरीर के लिए प्रयुक्त है, जिसे अशुद्ध किए जाने की बात है; ‘पापी स्वभाव’ अनावश्यक धर्मशास्त्रीय व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवादात्मक किंतु गरिमापूर्ण शैली। ग्रीक की प्रश्नात्मक संरचना और उद्धार-संबंधी तनाव को बनाए रखा गया है।
