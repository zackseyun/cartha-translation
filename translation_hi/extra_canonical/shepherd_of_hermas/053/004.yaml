  text: “As to former ignorances,” he says, “God alone is able to give healing concerning them; for all authority is his. But now guard yourself, and the Lord, the Almighty—being full of compassion—will give healing for former ignorances, if from now on you do not defile your flesh or the spirit; for both are shared and cannot be defiled apart from one another. Therefore keep both pure, and you will live to God.”
translation:
  language: hi
  text: “पहले की अज्ञानजनित भूलों के विषय में,” वह कहता है, “केवल परमेश्वर ही चंगाई दे सकता है, क्योंकि सारा अधिकार उसी का है। [a]पर अब अपनी रक्षा करो; और प्रभु, सर्वशक्तिमान और करुणा से भरपूर होकर, पहले की अज्ञानजनित भूलों के लिए चंगाई देगा,[a] यदि अब से तुम न अपने शरीर को अशुद्ध करो, न आत्मा को। क्योंकि दोनों परस्पर संबद्ध हैं और एक-दूसरे से अलग अशुद्ध नहीं किए जा सकते। इसलिए दोनों को शुद्ध रखो, और तुम परमेश्वर के लिए जीवित रहोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पर अब अपनी रक्षा करो … चंगाई देगा” वाला अंश कुछ पाठ-साक्ष्यों में नहीं मिलता; प्रदत्त संपादित यूनानी पाठ में इसे वर्ग कोष्ठकों में रखा गया है, जो इसकी पाठगत अनिश्चितता दर्शाता है।
    reason: प्रदत्त यूनानी स्रोत में यह पूरा वाक्यांश वर्ग कोष्ठकों में है, जबकि अंग्रेज़ी POB परामर्श-पाठ इसे शामिल करता है।
lexical_decisions:
- source_word: ἀγνοήματα
  choice: अज्ञानता में किए गए अपराध
  rationale: यह बहुवचन संज्ञा केवल जानकारी के अभाव को नहीं, अज्ञान के कारण हुई चूकों या अपराधों को भी सूचित करती है; यह पदबंध दोनों पक्षों को बनाए रखता है।
- source_word: ἴασιν
  choice: चंगाई
  rationale: मूल में उपचार या आरोग्य का रूपक है; ‘क्षमा’ कहने से निहितार्थ को अनावश्यक रूप से निश्चित कर दिया जाता।
- source_word: σάρκα
  choice: शरीर
  rationale: यहाँ नैतिक रूप से शुद्ध रखे जाने वाले देहगत अस्तित्व का संदर्भ है; आधुनिक हिन्दी में ‘शरीर’ स्वाभाविक और स्पष्ट है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: संदर्भ में शरीर के साथ संबद्ध आध्यात्मिक तत्त्व है; अनुवाद मूल की संभावित मानवीय/पवित्र आत्मा संबंधी अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: κοινά
  choice: एक-दूसरे के सहभागी
  rationale: शाब्दिक अर्थ ‘साझे/सामान्य’ है; प्रसंग में शरीर और आत्मा की ऐसी संयुक्तता अभिप्रेत है कि एक को दूसरे से अलग अशुद्ध नहीं किया जा सकता।
- source_word: ζήσῃ τῷ Θεῷ
  choice: परमेश्वर के लिए जीवित रहोगे
  rationale: ग्रीक दत्तिव के संबंध को बनाए रखता है और इसे ‘परमेश्वर के साथ’ या ‘परमेश्वर द्वारा’ कहकर संकीर्ण नहीं करता।
theological_decisions:
- issue: पूर्व अज्ञान के लिए परमेश्वर द्वारा दी जाने वाली ἴασις
  choice: चंगाई
  alternative: क्षमा
  rationale: ‘चंगाई’ मूल रूपक और उसके व्यापक अर्थ को सुरक्षित रखती है; ‘क्षमा’ संभावित अर्थ है, पर मूल शब्द उससे अधिक व्यापक है।
- issue: शरीर और आत्मा की पारस्परिक अशुद्धता
  choice: दोनों एक-दूसरे के सहभागी हैं और अलग-अलग अशुद्ध नहीं किए जा सकते
  alternative: दोनों समान हैं
  rationale: मूल कथन अस्तित्वगत समानता की अपेक्षा उनकी संयुक्त नैतिक दशा पर बल देता है।
- issue: पाठ में कोष्ठकित वाक्यांश की प्रामाणिकता
  choice: मुख्य पाठ में रखा और पादटिप्पणी से पाठगत अनिश्चितता दर्शाई
  alternative: मुख्य पाठ से हटाना
  rationale: प्रदत्त आलोचनात्मक स्रोत इसे कोष्ठकों में रखता है और अंग्रेज़ी परामर्श-पाठ इसे सम्मिलित करता है; इसलिए पाठक को अनिश्चितता बताते हुए शामिल करना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। संवाद का स्वर बनाए रखने के लिए “उसने कहा” प्रयुक्त है। ‘अज्ञानता में किए गए अपराध’ थोड़ा व्याख्यात्मक है, पर ἀγνοήματα की नैतिक और संज्ञानात्मक दोनों छायाएँ सुरक्षित रखता है।
