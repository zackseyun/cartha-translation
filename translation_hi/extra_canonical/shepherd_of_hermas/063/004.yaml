translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपनी छड़ें’ निकटवर्ती संदर्भ से स्पष्ट किया गया है, क्योंकि ग्रीक में कर्म संदर्भगत है। कोई पादटिप्पणी आवश्यक नहीं है।
