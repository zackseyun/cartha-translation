translation:
  language: hi
  text: 4. सबसे पहले, जिनके पास सूखी और कटी हुई छड़ें थीं, उन्होंने उन्हें सौंप दिया। वे भी सूखी और कटी हुई पाई गईं; उसने उन्हें अलग खड़े होने का आदेश दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδοι
  choice: छड़ें
  rationale: संदर्भ में लोगों को दी गई और रोपी गई लकड़ी की छड़ें अभिप्रेत हैं; ‘छड़ें’ सामान्य आधुनिक हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: ἐπέδωκαν
  choice: लाकर सौंपने लगे
  rationale: क्रिया का मूल भाव ‘सौंपना/पेश करना’ है। आरम्भसूचक πρῶτοι के साथ हिन्दी में क्रमिक कार्रवाई को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ξηρὰς καὶ κεκομμένας
  choice: सूखी और कटी हुई
  rationale: दोनों ग्रीक विशेषणों को अलग-अलग और सीधे रखा गया है; κεκομμένας की पूर्ण क्रिया से बनी अवस्था को ‘कटी हुई’ व्यक्त करता है।
- source_word: χωρὶς σταθῆναι
  choice: अलग खड़े होने
  rationale: χωρίς के पृथकता-बोध और σταθῆναι की खड़े किए जाने की क्रिया, दोनों को स्पष्ट रूप से बनाए रखता है।
