lexical_decisions:
- source_word: ῥάβδους
  choice: छड़ी
  rationale: इस दृष्टान्त में यह शब्द लगाई गई और फिर उखाड़ी जाने वाली प्रत्येक व्यक्ति की छड़ी के लिए है; ‘छड़ी’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐκτιλάτω
  choice: उखाड़कर
  rationale: क्रिया का अर्थ रोपी हुई छड़ियों को खींचकर जमीन से निकालना है; ‘उखाड़कर’ इस क्रिया को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: φερέτω πρός με
  choice: मेरे पास लाए
  rationale: आज्ञार्थक भाव और वक्ता की ओर लाने की दिशा दोनों सुरक्षित रहते हैं।
