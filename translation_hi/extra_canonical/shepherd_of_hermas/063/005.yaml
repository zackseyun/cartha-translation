translation:
  language: hi
  text: 5. फिर जिन लोगों के पास सूखी, पर कटी हुई नहीं, छड़ियाँ थीं, उन्होंने उन्हें सौंप दिया। उनमें से कुछ ने अपनी छड़ियाँ हरी सौंपीं, पर कुछ ने ऐसी छड़ियाँ सौंपीं जो सूखी और कटी हुई थीं, मानो उन्हें कीड़ों ने कुतर दिया हो। इसलिए जिन्होंने हरी छड़ियाँ सौंपी थीं, उन्हें उसने अलग खड़े होने की आज्ञा दी; पर जिनकी छड़ियाँ सूखी थीं—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी पाठ में यह पाठक-खंड वाक्य के बीच में समाप्त होता है; वाक्य अगले खंड में पूरा होता है।
    reason: मूल स्रोत और अंग्रेज़ी परामर्श-पाठ दोनों यहाँ अपूर्ण वाक्य देते हैं; डैश और टिप्पणी इस संपादकीय विभाजन को स्पष्ट रखते हैं।
lexical_decisions:
- source_word: ῥάβδοι
  choice: छड़ियाँ
  rationale: इस दृष्टान्त में यह शब्द रोपी गई और बाद में उखाड़ी गई लकड़ी की छड़ियों के लिए है; ‘छड़ियाँ’ अर्थ और दृश्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: χλωράς
  choice: हरी
  rationale: χλωρός यहाँ सूखी छड़ियों के विपरीत जीवित, ताज़ी हरियाली का संकेत देता है; ‘हरी’ संक्षिप्त और स्पष्ट है।
- source_word: κεκομμένας
  choice: कटी हुई
  rationale: पूर्ण कृदन्त छड़ियों की परिणामी दशा बताता है; ‘कटी हुई’ इस स्थिति को सीधे बनाए रखता है।
- source_word: ὡς ὑπὸ σητός
  choice: मानो उन्हें कीड़ों ने खा लिया हो
  rationale: σητός कुतरने या खाने वाले कीट/कीड़े को सूचित करता है। बहुवचन ‘कीड़ों’ का प्रयोग आधुनिक हिन्दी में स्वाभाविक है और ὡς की उपमात्मक अनिश्चितता ‘मानो’ से सुरक्षित रहती है।
- source_word: χωρὶς σταθῆναι
  choice: अलग खड़े होने
  rationale: वाक्यांश का स्थानगत अर्थ सीधे और सहज हिन्दी में व्यक्त होता है।
