  text: 2. Seeing me girded and ready to serve him, he says, “Call the men whose rods have been planted, by rank, just as each gave the rods.” And I went out to the field and called them all; and they all stood in their ranks.
translation:
  language: hi
  text: 2. मुझे कमरबंध बाँधे और उसकी सेवा के लिए तैयार देखकर उसने कहा, “जिन पुरुषों की छड़ियाँ रोपी गई हैं, उन्हें उसी क्रम में बुलाओ जिसमें हर एक ने अपनी छड़ी दी थी।” तब मैं मैदान में गया और सबको बुलाया; और वे सब अपने-अपने क्रम में खड़े हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεζωσμένον
  choice: कमर कसे
  rationale: यह यूनानी कृदंत सेवा के लिए वस्त्र कसकर तैयार होने की स्थिति बताता है; आधुनिक हिन्दी में यह स्वाभाविक और सजीव है।
- source_word: διακονεῖν
  choice: सेवा
  rationale: संदर्भ में व्यक्तिगत सहायता या परिचर्या का सामान्य अर्थ है; यहाँ किसी बाद की औपचारिक कलीसियाई पदवी को आरोपित नहीं किया गया।
- source_word: ῥάβδοι
  choice: छड़ियाँ
  rationale: दंड, टहनी या छड़ी के अर्थ-क्षेत्र में, रोपी गई वस्तु और पूरे दृष्टांत के ठोस प्रतीक के लिए ‘छड़ियाँ’ उपयुक्त है।
- source_word: κατὰ τὸ τάγμα / κατὰ τὰ τάγματα
  choice: उसी क्रम में / अपने-अपने क्रम में
  rationale: τάγμα यहाँ व्यवस्थित क्रम या दल-संबंधी स्थान दर्शाता है। ‘क्रम’ हिन्दी में दोनों वाक्यों की समानता बनाए रखते हुए अनावश्यक सैन्य अर्थ से बचता है।
- source_word: πεδίον
  choice: मैदान
  rationale: खुले समतल स्थान के लिए सीधा और स्वाभाविक हिन्दी शब्द।
