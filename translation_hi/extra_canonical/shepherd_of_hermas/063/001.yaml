base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/063/001.yaml
  text: And after a few days we came to the place, and the Shepherd sat down in the place of the angel, and I stood beside him. And he says to me, “Gird yourself with a raw-linen garment, and serve me.” So I girded myself with a clean raw-linen garment made from sackcloth.
translation:
  language: hi
  text: कुछ दिनों के बाद हम उस स्थान पर आए। चरवाहा दूत के स्थान पर बैठ गया और मैं उसके पास खड़ा हो गया। उसने मुझसे कहा, “अपनी कमर पर कच्चे सन का वस्त्र बाँध लो और मेरी सेवा करो।” तब मैंने अपनी कमर पर टाट से बना हुआ कच्चे सन का एक साफ़ वस्त्र बाँध लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμήν
  choice: चरवाहा
  rationale: रचना में इस पात्र की स्थापित उपाधि और मूल शब्द का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: τόπος τοῦ ἀγγέλου
  choice: दूत के स्थान
  rationale: ἄγγελος का मूल अर्थ ‘दूत’ रखा गया है; संदर्भ में स्वर्गदूत संभव है, पर मूल की शब्दगत व्यापकता को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: Περίζωσαι
  choice: अपनी कमर पर … बाँध लो
  rationale: मध्यवाच्य आज्ञा का स्वाभाविक हिन्दी रूप, जिसमें सेवा के लिए वस्त्र कसने की क्रिया स्पष्ट होती है।
- source_word: ὠμόλινον
  choice: कच्चे सन का वस्त्र
  rationale: दुर्लभ शब्द संभवतः अपरिष्कृत या बिना विरंजित सन के वस्त्र को सूचित करता है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘वस्त्र’ जोड़ा गया।
- source_word: διακόνει μοι
  choice: मेरी सेवा करो
  rationale: संदर्भगत सेवा-सहायता को सरल और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐκ σάκκου γεγονὸς καθαρόν
  choice: टाट से बना हुआ … एक साफ़ वस्त्र
  rationale: σάκκος को खुरदरे टाट/बोरे के कपड़े के अर्थ में लिया गया और καθαρόν को ‘साफ़’ रखा गया, बिना इसे धार्मिक शुद्धता के रूप में विशेषीकृत किए।
theological_decisions:
- issue: ἄγγελος की पहचान
  choice: दूत
  alternative: स्वर्गदूत
  rationale: पाठ यहाँ केवल ἄγγελος कहता है। ‘दूत’ वास्तविक अस्पष्टता बनाए रखता है, जबकि कथा-संदर्भ पाठक को स्वर्गीय दूत समझने की अनुमति देता है।
- issue: καθαρόν का अर्थ
  choice: साफ़
  alternative: शुद्ध
  rationale: वस्त्र के भौतिक वर्णन में ‘साफ़’ अधिक स्वाभाविक है और अनावश्यक अनुष्ठानिक या नैतिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ग्रीक के ऐतिहासिक वर्तमान ‘वह मुझसे कहता है’ को हिन्दी कथा-प्रवाह के अनुरूप भूतकाल ‘उसने कहा’ किया गया है।
