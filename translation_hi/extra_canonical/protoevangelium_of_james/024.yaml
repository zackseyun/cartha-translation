translation:
  language: hi
  text: '**याकूब का आदिसुसमाचार — अध्याय 24: जकर्याह के लिए शोक**


    **(1)** पर अभिवादन का समय[a] होने पर याजक आए, लेकिन जकर्याह प्रथा के अनुसार उन्हें आशीर्वाद देने के लिए उनसे मिलने नहीं आया। याजक जकर्याह की प्रतीक्षा में वहीं खड़े रहे, ताकि आशीर्वाद के साथ उसका अभिवादन करें और परमप्रधान परमेश्वर की महिमा करें।


    **(2)** जब उसे आने में देर हुई, तो वे सब डर गए। पर उनमें से एक ने साहस बटोरा और पवित्रस्थान में गया। वहाँ उसने प्रभु की वेदी के पास जमा हुआ खून देखा। एक आवाज़ कह रही थी, “जकर्याह की हत्या कर दी गई है, और जब तक उसका बदला लेने वाला नहीं आएगा, तब तक उसका खून मिटाया नहीं जाएगा!”


    यह बात सुनकर वह डर गया। उसने बाहर जाकर याजकों को बताया कि उसने क्या देखा और सुना था।


    **(3)** तब उन्होंने साहस बटोरा, भीतर गए और देखा कि क्या हुआ था। मंदिर के पट पुकार उठे, और याजकों ने अपने वस्त्र ऊपर से नीचे तक फाड़ डाले। उन्हें उसका शव नहीं मिला, पर उन्होंने देखा कि उसका खून पत्थर बन गया था। वे डर गए और बाहर जाकर सब लोगों को बताया कि जकर्याह की हत्या कर दी गई है। जब लोगों के सभी गोत्रों ने यह सुना, तो उन्होंने उसके लिए शोक मनाया और तीन दिन और तीन रात रोते रहे।


    **(4)** तीन दिन बाद याजकों ने यह विचार करने के लिए सभा की कि जकर्याह का स्थान किसे लेना चाहिए। चिट्ठी शिमोन के नाम निकली, क्योंकि पवित्र आत्मा ने उसे बताया था कि जब तक वह मसीह को देह में न देख ले, तब तक मृत्यु नहीं देखेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अभिवादन का समय” संभवतः याजकीय सेवा से जुड़ी किसी नियत रीति या समय का संकेत है। उपलब्ध अंग्रेज़ी साक्ष्य के आधार पर अर्थ को खुला रखा गया है; यूनानी पाठ से प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: स्रोत-वाक्यांश का रीति-विधिक आशय अनिश्चित है और वर्तमान मसौदा प्रत्यक्ष यूनानी समीक्षा पर आधारित नहीं है।
lexical_decisions:
- source_word: hour of greeting
  choice: अभिवादन का समय
  rationale: यह अभिव्यक्ति संभावित रीति-विधिक समय को बिना अनावश्यक व्याख्या के बनाए रखती है; ‘घड़ी’ की अपेक्षा ‘समय’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: sanctuary
  choice: पवित्रस्थान
  rationale: यह मंदिर के पवित्र आंतरिक क्षेत्र को सूचित करता है और उसे पूरे ‘मंदिर’ के समान नहीं ठहराता।
- source_word: panels of the Temple
  choice: मंदिर के पट
  rationale: मूल साक्ष्य की असामान्य निर्जीव-कर्तृक छवि को बनाए रखते हुए ‘पट’ वास्तु-संबंधी अर्थ की अस्पष्टता को खुला रखता है।
- source_word: avenger
  choice: बदला लेने वाला
  rationale: साधारण आधुनिक हिन्दी में स्पष्ट है और न्यायिक अथवा पारिवारिक प्रतिशोधकर्ता की पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: the Christ in the flesh
  choice: मसीह को देह में
  rationale: ‘देहधारी मसीह’ जैसी अधिक व्याख्यात्मक शब्दावली से बचते हुए स्रोत की ठोस और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: जकर्याह के खून के मिटाए जाने और बदला लेने वाले के आने का संबंध
  choice: “जब तक उसका बदला लेने वाला नहीं आएगा, तब तक उसका खून मिटाया नहीं जाएगा”
  alternative: “उसका प्रतिशोध पूरा होने तक खून नहीं मिटेगा”
  rationale: चुना गया रूप आने वाले व्यक्ति का उल्लेख बनाए रखता है और प्रतिशोध की प्रक्रिया या पहचान की अतिरिक्त व्याख्या नहीं करता।
- issue: शिमोन द्वारा मृत्यु देखने और मसीह को देह में देखने का कथन
  choice: “जब तक वह मसीह को देह में न देख ले, तब तक मृत्यु नहीं देखेगा”
  alternative: “देहधारी मसीह को देखने से पहले वह नहीं मरेगा”
  rationale: स्रोत के ‘मृत्यु देखना’ और ‘मसीह को देह में देखना’ दोनों सामी-प्रभावित मुहावरों और उनके धर्मवैचारिक तनाव को यथासंभव सुरक्षित रखा गया है।
- issue: पवित्र आत्मा से प्राप्त सूचना
  choice: “पवित्र आत्मा ने उसे बताया था”
  alternative: “पवित्र आत्मा ने उस पर प्रकट किया था”
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य ‘was told’ देता है; यूनानी समीक्षा लंबित होने के कारण अधिक विशिष्ट प्रकाशना-संबंधी क्रिया नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। बार-बार आने वाले संयोजकों को हिन्दी के स्वाभाविक प्रवाह के अनुसार कुछ स्थानों पर समायोजित किया गया है, पर घटनाक्रम, पुनरावृत्ति और अलौकिक चित्रण सुरक्षित हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष समीक्षा आवश्यक है।
