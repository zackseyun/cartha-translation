base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/008.yaml
  text: 'Her parents went down, marveling, praising, and glorifying the Lord God because the child had not turned back. Mary remained in the Temple of the Lord. She was nurtured like a dove and received food from the hand of an angel.


    When she became twelve years old, the priests held a council and said, “Look, Mary has been in the Temple of the Lord for twelve years. What should we do about her so that she will not defile the sanctuary of the Lord our God?” They said to the chief priest, “You stand at the altar of the Lord. Go in and pray about her. If the Lord God reveals anything to you, we will do it.”


    The chief priest went in, taking the robe with twelve bells into the Holy of Holies, and prayed about her. And look! An angel of the Lord stood nearby and said, “Zechariah, Zechariah, go out and assemble the widowers of the people, and let each of them bring a staff. The man whom the Lord God points out with a sign—she will be his wife.”


    The heralds went throughout the whole surrounding region of Judea and sounded the trumpet of the Lord. And look! All the men rushed in.'
translation:
  language: hi
  text: '(1) उसके माता-पिता नीचे उतर गए। वे इस बात पर अचंभा करते हुए प्रभु परमेश्वर की स्तुति और महिमा कर रहे थे कि बच्ची पीछे नहीं लौटी। मरियम प्रभु के मंदिर में रही। उसका पालन-पोषण कबूतरी के समान हुआ, और उसे एक स्वर्गदूत के हाथ से भोजन मिलता था।


    (2) जब वह बारह वर्ष की हुई, तब याजकों ने सभा करके कहा, “देखो, मरियम प्रभु के मंदिर में बारह वर्ष से है। अब हम उसके विषय में क्या करें, ताकि वह हमारे प्रभु परमेश्वर के पवित्रस्थान को अशुद्ध न करे?” उन्होंने महायाजक से कहा, “तुम प्रभु की वेदी के सामने खड़े होते हो। भीतर जाओ और उसके विषय में प्रार्थना करो। प्रभु परमेश्वर तुम पर जो कुछ प्रकट करे, हम वही करेंगे।”


    (3) तब महायाजक बारह घंटियों वाला वस्त्र लेकर परमपवित्रस्थान में गया और उसके विषय में प्रार्थना की। और देखो! प्रभु का एक स्वर्गदूत पास आ खड़ा हुआ और बोला, “जकर्याह, जकर्याह! बाहर जाओ और लोगों में से विधुरों को इकट्ठा करो। उनमें से हर एक अपनी छड़ी लेकर आए। प्रभु परमेश्वर किसी चिन्ह के द्वारा जिस व्यक्ति की ओर संकेत करे, मरियम उसकी पत्नी होगी।”[a]


    तब उद्घोषक यहूदिया के सारे आस-पास के प्रदेश में गए और उन्होंने प्रभु की तुरही फूँकी। और देखो! सभी पुरुष दौड़े चले आए।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य यहाँ स्पष्ट रूप से “पत्नी” कहता है। कुछ पाठक इस संबंध को संरक्षकत्व के रूप में समझते हैं, पर वह अर्थ इस वाक्य में स्पष्ट नहीं किया गया है।
    reason: स्रोत के वैवाहिक शब्द और बाद की व्याख्यात्मक परंपराओं के बीच अंतर को बिना मुख्य पाठ बदले स्पष्ट करना।
  - marker: b
    text: संदर्भ में बुलावा लोगों के विधुरों के लिए है; फिर भी उपलब्ध साक्ष्य का अंतिम वाक्य व्यापक रूप से “सभी पुरुष” कहता है।
    reason: संदर्भगत अर्थ और साक्ष्य की वास्तविक शब्दावली दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: Temple / sanctuary
  choice: मंदिर / पवित्रस्थान
  rationale: मंदिर पूरे धार्मिक परिसर को और पवित्रस्थान उसके पवित्र क्षेत्र को दर्शाता है; स्रोत में उपस्थित भेद बनाए रखा गया है।
- source_word: nurtured like a dove
  choice: उसका पालन-पोषण कबूतरी के समान हुआ
  rationale: उपमा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है; स्त्रीलिंग संदर्भ के कारण ‘कबूतरी’ स्वाभाविक है।
- source_word: chief priest
  choice: महायाजक
  rationale: यह प्राचीन यहूदी पद का प्रचलित और संक्षिप्त हिन्दी रूप है।
- source_word: robe with twelve bells
  choice: बारह घंटियों वाला वस्त्र
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के वस्तुगत विवरण को यथावत रखा गया है; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है।
- source_word: Holy of Holies
  choice: परमपवित्रस्थान
  rationale: अंतरतम पवित्र स्थान के लिए स्थापित बाइबलीय हिन्दी पद चुना गया है।
- source_word: widowers
  choice: विधुरों
  rationale: स्रोत का विशेष अर्थ—ऐसे पुरुष जिनकी पत्नियाँ मर चुकी थीं—सुरक्षित रखा गया है।
- source_word: staff
  choice: छड़ी
  rationale: चिन्ह के लिए लाई जाने वाली व्यक्तिगत दंड/लाठी का सहज आधुनिक हिन्दी रूप; ‘राजदंड’ जैसा अतिरिक्त अधिकार-बोध नहीं जोड़ा गया।
- source_word: heralds
  choice: उद्घोषक
  rationale: सार्वजनिक घोषणा करने वाले दूतों के लिए गरिमापूर्ण और समझने योग्य पद।
- source_word: trumpet of the Lord
  choice: प्रभु की तुरही
  rationale: असामान्य संबंधवाचक अभिव्यक्ति को स्रोत के अनुसार खुला रखा गया है, उसे सामान्य राजकीय बिगुल में नहीं बदला गया।
theological_decisions:
- issue: मरियम द्वारा पवित्रस्थान को अशुद्ध करने की आशंका
  choice: ‘ताकि वह ... पवित्रस्थान को अशुद्ध न करे’ के रूप में सीधा अनुवाद
  alternative: ऋतुस्राव अथवा किसी विशिष्ट शुद्धता-विधान की स्पष्ट व्याख्या जोड़ना
  rationale: पाठ कारण को स्पष्ट नहीं करता; इसलिए संभावित सांस्कृतिक-धार्मिक पृष्ठभूमि को मुख्य पाठ में आरोपित नहीं किया गया।
- issue: स्वर्गदूत के हाथ से भोजन
  choice: कथन को वास्तविक वर्णन के रूप में अनूदित किया
  alternative: इसे रूपक, दर्शन या याजकीय देखभाल के रूप में समझाकर लिखना
  rationale: स्रोत स्वयं कोई ऐसी व्याख्या नहीं देता; उसकी अद्भुत प्रकृति और अस्पष्टता सुरक्षित रखी गई है।
- issue: चिन्ह द्वारा पति का चयन
  choice: प्रभु परमेश्वर द्वारा संकेत किए गए व्यक्ति को भावी पति बताया
  alternative: उसे केवल संरक्षक या अभिभावक कहना
  rationale: उपलब्ध साक्ष्य स्पष्टतः ‘पत्नी’ कहता है; बाद की परंपरागत व्याख्याओं के आधार पर संबंध को बदला नहीं गया।
- issue: अंत में आए ‘सभी पुरुष’ की सीमा
  choice: मुख्य पाठ में ‘सभी पुरुष’ रखा और पादटिप्पणी में संभावित संदर्भ बताया
  alternative: सीधे ‘सभी विधुर’ लिखना
  rationale: निकटवर्ती संदर्भ विधुरों की ओर संकेत करता है, पर उपलब्ध साक्ष्य का अंतिम वाक्य व्यापक शब्दावली रखता है; इस तनाव को संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। ‘और देखो!’ जैसी स्रोत की आकस्मिक उद्घोषणा को बनाए रखा गया है। पद-संख्या रखी गई है। यह प्रारूप उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है, इसलिए विशेषतः ‘बारह घंटियों वाला वस्त्र’, क्रियाओं की सूक्ष्मता और अंतिम ‘सभी पुरुष’ की पाठगत सीमा पुनः जाँची जानी चाहिए।
