base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/005.yaml
  text: '(1) The next day, Joachim offered his gifts, saying to himself, “If the Lord God is reconciled to me, the plate worn by the priest will make it clear to me.” Joachim offered his gifts and watched the priest’s plate as the priest went up to the altar of the Lord. He saw no sin in it. Joachim said, “Now I know that the Lord God has been reconciled to me and has sent all my sins away from me.” He went down from the Temple of the Lord justified and returned to his house.


    (2) About six months were completed, and in the seventh month Anna gave birth. She said to her midwife, “What is it?”


    The midwife said, “It is a girl!”


    Anna said, “My soul is magnified this day!” Then she laid her child down.


    When her days were completed, Anna cleansed her flow of blood. She gave her breast to the child and named her Mary.'
translation:
  language: hi
  text: '(1) अगले दिन योआकीम अपनी भेंटें चढ़ा रहा था और मन-ही-मन कह रहा था, “यदि प्रभु परमेश्वर मुझसे फिर प्रसन्न हो गया है, तो याजक द्वारा पहनी जाने वाली पट्टिका यह बात मुझ पर प्रकट कर देगी।” योआकीम ने अपनी भेंटें चढ़ाईं और जब याजक प्रभु की वेदी के पास गया, तब उसने याजक की पट्टिका को ध्यान से देखा। उसे उसमें कोई पाप दिखाई नहीं दिया। तब योआकीम ने कहा, “अब मैं जान गया हूँ कि प्रभु परमेश्वर मुझसे फिर प्रसन्न हो गया है और उसने मेरे सारे पाप मुझसे दूर कर दिए हैं।” फिर वह प्रभु के मंदिर से धर्मी ठहरकर नीचे उतरा और अपने घर चला गया।


    (2) लगभग छह महीने पूरे हुए और सातवें महीने में हन्ना ने बच्चे को जन्म दिया। उसने अपनी दाई से पूछा, “क्या हुआ है?”


    दाई ने कहा, “लड़की हुई है!”


    हन्ना ने कहा, “आज मेरा प्राण महिमा पाता है!”[a] फिर उसने अपनी बच्ची को लिटा दिया।


    जब उसके शुद्ध होने के दिन पूरे हुए, तब हन्ना ने अपने रक्तस्राव से शुद्धि पाई।[b] उसने बच्ची को अपना दूध पिलाया और उसका नाम मरियम रखा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “आज मेरा प्राण बड़ा किया गया है।” वाक्य का आशय असामान्य है और इसमें महिमा या बड़ाई पाने का भाव हो सकता है।'
    reason: स्रोत की विलक्षण तथा संभावित रूप से बहुअर्थी अभिव्यक्ति को स्पष्ट किए बिना पाठक को उसकी शाब्दिक संरचना बताना।
  - marker: b
    text: यह प्रसव के बाद के रक्तस्राव और उससे संबंधित शुद्धि की अवधि की ओर संकेत करता है।
    reason: आधुनिक पाठक के लिए सांस्कृतिक और अनुष्ठानिक संदर्भ बताना, जबकि मुख्य पाठ में दोनों पहलुओं को खुला रखना।
lexical_decisions:
- source_word: plate worn by the priest
  choice: याजक द्वारा पहनी जाने वाली पट्टिका
  rationale: साक्ष्य में वस्तु की पहचान अस्पष्ट है; इसलिए किसी विशिष्ट याजकीय आभूषण का नाम जोड़ने के बजाय सामान्य किंतु ठोस शब्द रखा गया है।
- source_word: reconciled to me
  choice: मुझसे फिर प्रसन्न हो गया है
  rationale: संबंध की पुनर्बहाली का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है, बिना प्रायश्चित की कोई अतिरिक्त तकनीकी व्याख्या जोड़े।
- source_word: justified
  choice: धर्मी ठहरकर
  rationale: न्यायिक और धार्मिक अर्थ की तनावपूर्ण व्यापकता बनाए रखता है; इसे केवल ‘संतुष्ट होकर’ या ‘निर्दोष सिद्ध होकर’ तक सीमित नहीं किया गया।
- source_word: My soul is magnified
  choice: मेरा प्राण महिमा पाता है
  rationale: असामान्य मूल अभिव्यक्ति और उसकी संभावित धार्मिक प्रतिध्वनि को सहज अर्थ में विलीन करने के बजाय निकट रूप में सुरक्षित रखा गया है।
- source_word: cleansed her flow of blood
  choice: अपने रक्तस्राव से शुद्धि पाई
  rationale: प्रसवोत्तर रक्तस्राव और अनुष्ठानिक शुद्धि के जुड़े हुए भावों को बनाए रखता है।
- source_word: Mary
  choice: मरियम
  rationale: यह हिन्दी बाइबलीय परंपरा में इस पात्र का व्यापक और पहचाना हुआ नाम है।
theological_decisions:
- issue: याजक की पट्टिका में पाप न दिखाई देना
  choice: उसे उसमें कोई पाप दिखाई नहीं दिया
  alternative: इसे शुभ संकेत या परमेश्वर की स्वीकृति के रूप में स्पष्ट करना
  rationale: स्रोत का कथन रहस्यमय है; अनुवाद ने उसकी अस्पष्टता को बनाए रखा और संकेत की कार्यविधि नहीं समझाई।
- issue: योआकीम का धर्मी ठहरना
  choice: धर्मी ठहरकर
  alternative: क्षमा पाकर / निर्दोष सिद्ध होकर
  rationale: ‘justified’ के धार्मिक-न्यायिक तनाव को किसी एक धर्मशास्त्रीय प्रणाली में सीमित किए बिना सुरक्षित रखा गया है।
- issue: हन्ना का कथन ‘My soul is magnified’
  choice: आज मेरा प्राण महिमा पाता है
  alternative: आज मेरा मन बहुत आनन्दित है
  rationale: सरल भावार्थ अधिक स्वाभाविक होता, पर वह मूल की विलक्षण अभिव्यक्ति और संभावित शास्त्रीय प्रतिध्वनि मिटा देता।
- issue: प्रसवोत्तर शुद्धि
  choice: शुद्धि पाई
  alternative: रक्तस्राव रुक गया
  rationale: पाठ शारीरिक घटना के साथ शुद्धि की धार्मिक धारणा भी व्यक्त कर सकता है; केवल चिकित्सकीय अर्थ चुनना अनुचित होता।
