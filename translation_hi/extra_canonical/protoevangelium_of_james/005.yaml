  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। कथात्मक ‘और’ की अत्यधिक पुनरावृत्ति को स्वाभाविक हिन्दी वाक्य-संयोजन से संतुलित किया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण विशेषतः ‘पट्टिका’, ‘उसमें पाप’, ‘मेरा प्राण महिमा पाता है’ और प्रसवोत्तर शुद्धि के पदों को सावधानी से असमाधित रखा गया है।
