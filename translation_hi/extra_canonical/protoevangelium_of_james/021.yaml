base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/021.yaml
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
translation:
  language: hi
  text: '(1) देखो! यूसुफ यहूदिया जाने की तैयारी कर ही रहा था कि यहूदिया के बैतलहम में बड़ी हलचल मच गई। क्योंकि ज्योतिषी[a] वहाँ आए और पूछने लगे, “यहूदियों का राजा कहाँ है? हमने पूर्व दिशा में उसका तारा देखा और उसे दण्डवत करने आए हैं।”[b]


    (2) यह सुनकर हेरोदेस व्याकुल हो उठा। उसने ज्योतिषियों के पास अधिकारी भेजे और प्रधान याजकों को बुलवाकर अपने राजमहल में उनसे पूछा, “मसीह के विषय में क्या लिखा है? उसका जन्म कहाँ होगा?”


    उन्होंने उससे कहा, “यहूदिया के बैतलहम में, क्योंकि ऐसा ही लिखा है।” तब उसने उन्हें—अर्थात प्रधान याजकों को—जाने दिया।


    फिर उसने ज्योतिषियों से पूछा, “जो राजा जन्मा है, उसके विषय में तुमने क्या चिन्ह देखा?”


    ज्योतिषियों ने कहा, “हमने दूसरे तारों के बीच एक बहुत विशाल तारा चमकते देखा। उसकी चमक ने उन्हें इतना धुँधला कर दिया कि वे दिखाई ही नहीं देते थे। इससे हमने जान लिया कि इस्राएल के लिए एक राजा जन्मा है, और हम उसे दण्डवत करने आए हैं।”


    हेरोदेस ने उनसे कहा, “जाकर खोजो, और यदि वह मिल जाए तो मुझे समाचार देना, ताकि मैं भी आकर उसे दण्डवत करूँ।”


    (3) ज्योतिषी चल पड़े, और देखो! जिस तारे को उन्होंने पूर्व दिशा में देखा था, वह उनकी अगुवाई करता हुआ उन्हें उस गुफा तक ले गया और गुफा के ऊपर आकर ठहर गया।[c] जब उन्होंने बालक को उसकी माता मरियम के साथ देखा, तो अपने थैलों से भेंटें निकालीं: सोना, लोबान और गन्धरस।


    और स्वर्गदूत से यह चेतावनी पाकर कि वे यहूदिया में न जाएँ,[d] वे दूसरे मार्ग से अपने देश लौट गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ज्योतिषी” उस प्राचीन पद का अनुवाद है जो पूर्वी विद्वानों, तारा-पर्यवेक्षकों या धार्मिक विशेषज्ञों को सूचित कर सकता है; परंपरागत रूप से इन्हें “मागी” भी कहा जाता है।
    reason: ऐतिहासिक पद की अर्थ-सीमा स्पष्ट करना और आधुनिक ‘जादूगर’ वाले भ्रामक अर्थ से बचना।
  - marker: b
    text: “दण्डवत करने” के मूल पद में प्रणाम, राजकीय सम्मान या आराधना—इनमें से एक से अधिक भाव हो सकते हैं।
    reason: धर्मवैज्ञानिक अस्पष्टता बनाए रखना।
  - marker: c
    text: वाक्य का शाब्दिक भाव “गुफा के सिर के ऊपर” है, अर्थात गुफा के ऊपरी भाग के ऊपर।
    reason: असामान्य स्थान-सूचक अभिव्यक्ति को प्राकृतिक हिन्दी में देने के साथ उसका रूप दर्ज करना।
  - marker: d
    text: प्राप्त साक्ष्य में चेतावनी “यहूदिया में न जाने” की है। यह कठिन पाठ जानबूझकर सुरक्षित रखा गया है।
    reason: परिचित समानांतर कथा के आधार पर पाठ को चुपचाप बदलने से बचना।
lexical_decisions:
- source_word: μάγοι (presumed Greek underlying the witness)
  choice: ज्योतिषी
  rationale: यह शब्द प्राचीन पूर्वी विद्वानों/तारा-पर्यवेक्षकों को सूचित करता है; ‘जादूगर’ आधुनिक हिन्दी में भ्रामक होगा और ‘ज्ञानी पुरुष’ स्रोत की विशिष्टता घटाता है।
- source_word: προσκυνῆσαι / worship (witness)
  choice: दण्डवत करना
  rationale: यह शारीरिक प्रणति और सम्मान/आराधना के बीच स्रोत की संभावित व्यापकता बनाए रखता है; केवल ‘पूजा’ कहना अर्थ को पहले से अधिक निश्चित कर देता।
- source_word: Χριστός / Christ
  choice: मसीह
  rationale: स्थापित और सुबोध हिन्दी बाइबलीय पद, जिसका अर्थ अभिषिक्त जन है।
- source_word: λίβανος / frankincense
  choice: लोबान
  rationale: आधुनिक हिन्दी में प्रचलित और पदार्थ-विशिष्ट नाम।
- source_word: σμύρνα / myrrh
  choice: गन्धरस
  rationale: हिन्दी धार्मिक-साहित्य में प्रचलित समतुल्य; सामान्य पाठक के लिए भी अपेक्षाकृत पहचाना जाने वाला रूप।
- source_word: σπήλαιον / cave
  choice: गुफा
  rationale: कथा के विशिष्ट जन्म-स्थान को बिना सामंजस्य बैठाए स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: मागियों द्वारा बालक के प्रति की गई क्रिया का स्वरूप
  choice: दण्डवत करना
  alternative: आराधना करना / पूजा करना
  rationale: स्रोत क्रिया सम्मान, प्रणति या आराधना को व्यक्त कर सकती है। ‘दण्डवत’ वास्तविक अस्पष्टता को सुरक्षित रखता है और मसीह-विषयक निष्कर्ष को अनावश्यक रूप से निर्धारित नहीं करता।
- issue: ‘इस्राएल के लिए राजा’ का संबंध
  choice: इस्राएल के लिए एक राजा जन्मा है
  alternative: इस्राएल का राजा जन्मा है
  rationale: प्रदत्त साक्ष्य में ‘for Israel’ है; इसे स्वामित्वसूचक ‘इस्राएल का’ में बदलना अर्थ की सूक्ष्मता मिटा देता।
- issue: यहूदिया न जाने की स्वर्गदूतीय चेतावनी
  choice: जैसा साक्ष्य में है वैसा ही रखा
  alternative: हेरोदेस के पास न लौटने की चेतावनी
  rationale: कठिन भौगोलिक कथन को मत्ती के अधिक परिचित वृत्तांत के अनुसार चुपचाप सुधारा नहीं गया।
- issue: गुफा का उल्लेख
  choice: गुफा
  alternative: घर / चरनी का स्थान
  rationale: इन्फैंसी जेम्स की अपनी कथा-परंपरा सुरक्षित रखी गई; कैनोनिकल जन्म-वृत्तांतों से सामंजस्य नहीं बैठाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। आरंभिक ‘देखो!’ और कथात्मक पुनरावृत्तियाँ प्राचीन शैली की जीवंतता बनाए रखने के लिए रखी गई हैं। मसौदा प्रदत्त सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण स्रोत-शब्द संबंधी टिप्पणियाँ सावधानीपूर्वक और अनंतिम हैं।
