lexical_decisions:
- source_word: Temple of the Lord
  choice: प्रभु का मंदिर
  rationale: सामान्य आधुनिक हिन्दी में स्वाभाविक है और यरूशलेम के पवित्रस्थान का स्पष्ट संकेत देता है।
- source_word: promise
  choice: प्रतिज्ञा
  rationale: यह धार्मिक संदर्भ में किए गए गंभीर वचन का भाव बनाए रखता है।
- source_word: pure daughters of the Hebrews
  choice: इब्रानियों की शुद्ध बेटियाँ
  rationale: स्रोत की पवित्रता-संबंधी अस्पष्टता को ‘कुँवारी’ या किसी विशिष्ट अनुष्ठानिक श्रेणी में बदले बिना सुरक्षित रखता है।
- source_word: heart
  choice: मन
  rationale: इस प्रसंग में झुकाव, इच्छा और लगाव का स्वाभाविक हिन्दी बोध देता है।
- source_word: redemption
  choice: छुटकारा
  rationale: दैवी उद्धार के अर्थ को साधारण पाठकों के लिए सुबोध रखते हुए किसी संकीर्ण सिद्धान्तगत अर्थ तक सीमित नहीं करता।
- source_word: grace
  choice: अनुग्रह
  rationale: दैवी कृपा के पारंपरिक और व्यापक धार्मिक अर्थ को बनाए रखता है।
- source_word: house of Israel
  choice: इस्राएल का पूरा घराना
  rationale: सामूहिक, वाचा-समुदाय संबंधी अभिव्यक्ति को ‘देश’ या केवल ‘लोगों’ में समतल नहीं करता।
theological_decisions:
- issue: मरियम के माध्यम से अंतिम दिनों में छुटकारा प्रकट होना
  choice: “तुम्हारे द्वारा ... अपना छुटकारा प्रकट करेंगे”
  alternative: “तुममें ... मुक्ति दिखाएँगे”
  rationale: माध्यम-संबंधी कथन को बनाए रखता है, पर मरियम को स्वयं छुटकारे का कर्ता नहीं बनाता।
- issue: प्रभु का क्रोध और भेंट की अस्वीकृति
  choice: “ऐसा न हो कि प्रभु हमसे क्रोधित हों और हमारी भेंट अस्वीकार कर दें”
  alternative: “प्रभु हम पर क्रोध करके हमारी भेंट को ग्रहण न करें”
  rationale: वक्ताओं की आशंका को कथन के रूप में रखता है और उसे परमेश्वर के स्वभाव पर स्वतंत्र सिद्धान्तगत घोषणा नहीं बनाता।
- issue: बालिका पर अनुग्रह उंडेला जाना
  choice: “उस पर अनुग्रह उंडेला”
  alternative: “उसे अनुग्रह दिया”
  rationale: स्रोत की प्रचुर, दैवी क्रिया की रूपकात्मक शक्ति सुरक्षित रखी गई है।
- issue: वेदी की तीसरी सीढ़ी
  choice: “वेदी की तीसरी सीढ़ी”
  alternative: “बलिवेदी के तीसरे सोपान”
  rationale: स्थापत्य अथवा अनुष्ठानिक विवरण को स्पष्ट करने के नाम पर पाठ से बाहर की व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। कथात्मक पुनरावृत्ति और सरल संवाद बनाए गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष यूनानी पाठ-समीक्षा लंबित होने के कारण अनिश्चित स्थानों पर अत्यधिक विशिष्टता से बचा गया है।
