translation:
  language: hi
  text: '(1) और वह बीतते महीनों के दौरान अपनी बच्ची की देखभाल करती रही। जब वह दो वर्ष की हुई, तब योआकिम ने कहा, “आओ, हम इसे प्रभु के मंदिर में ले चलें, ताकि हमने जो प्रतिज्ञा की थी उसे पूरा करें, और ऐसा न हो कि प्रभु हमसे क्रोधित हों और हमारी भेंट अस्वीकार कर दें।”


    पर अन्ना ने कहा, “आओ, इसके तीसरे वर्ष तक प्रतीक्षा करें, ताकि यह अपने पिता या माता को न खोजे।”


    योआकिम ने कहा, “आओ, प्रतीक्षा करें।”


    (2) जब बच्ची तीन वर्ष की हुई, तब योआकिम ने कहा, “इब्रानियों की शुद्ध बेटियों को बुलाएँ। वे अपने दीपक लें और उन्हें जलाए रखें, ताकि बच्ची पीछे न मुड़े और उसका मन प्रभु के मंदिर से दूर न खिंचे।” उन्होंने वैसा ही किया, जब तक कि वे प्रभु के मंदिर तक ऊपर नहीं पहुँच गए।


    पुरोहित ने उसका स्वागत किया, उसे चूमा और कहा, “प्रभु परमेश्वर ने सब पीढ़ियों के बीच तुम्हारे नाम को महान किया है। अंतिम दिनों में प्रभु तुम्हारे द्वारा इस्राएल की प्रजा के लिए अपना छुटकारा प्रकट करेंगे।”


    (3) उसने उसे वेदी की तीसरी सीढ़ी पर बैठाया, और प्रभु परमेश्वर ने उस पर अनुग्रह उंडेला। वह अपने पैरों पर नाचने लगी, और इस्राएल के पूरे घराने ने उससे प्रेम किया।'
