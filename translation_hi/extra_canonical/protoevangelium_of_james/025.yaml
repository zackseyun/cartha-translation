base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/025.yaml
  text: '(1) Now I, James, wrote this account in Jerusalem when there was unrest over Herod’s death. I went into the wilderness until the unrest in Jerusalem had died down. I glorified the Lord God, who gave me the wisdom to write this account.


    (2) And grace will be with all who fear the Lord. Amen.'
translation:
  language: hi
  text: '(1) अब मुझ याकूब ने यह वृत्तांत यरूशलेम में उस समय लिखा, जब हेरोदेस की मृत्यु को लेकर अशांति मची हुई थी। मैं निर्जन प्रदेश में चला गया और तब तक वहीं रहा, जब तक यरूशलेम की अशांति शांत न हो गई। मैं प्रभु परमेश्वर की महिमा करता रहा, जिसने मुझे यह वृत्तांत लिखने की बुद्धि दी।


    (2) और प्रभु का भय मानने वाले सभी लोगों पर अनुग्रह बना रहेगा। आमीन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: history / account (Greek review pending)
  choice: वृत्तांत
  rationale: यह शब्द लिखित घटनाविवरण के अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है; ‘इतिहास’ की आधुनिक अकादमिक ध्वनि से बचाता है।
- source_word: commotion / unrest (Greek review pending)
  choice: अशांति
  rationale: राजनीतिक या सामाजिक हलचल की व्यापकता बनाए रखता है और कारण या स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: wilderness (Greek review pending)
  choice: निर्जन प्रदेश
  rationale: प्राचीन धार्मिक संदर्भ में केवल रेगिस्तान के बजाय निर्जन क्षेत्र का व्यापक अर्थ देता है।
- source_word: fear the Lord (Greek review pending)
  choice: प्रभु का भय मानने वाले
  rationale: परंपरागत धर्मवैचारिक अभिव्यक्ति को सुरक्षित रखते हुए श्रद्धापूर्ण भय का खुला अर्थ बनाए रखता है।
- source_word: grace (Greek review pending)
  choice: अनुग्रह
  rationale: ईश्वरीय कृपा के लिए प्रचलित, गरिमापूर्ण और धर्मवैचारिक रूप से पर्याप्त व्यापक शब्द।
theological_decisions:
- issue: लेखक का आत्मपरिचय
  choice: मुझ याकूब ने
  alternative: मैं, याकूब, ने
  rationale: हिन्दी में स्वाभाविक वाक्य-विन्यास रखते हुए प्रथम पुरुष में याकूब के लेखक होने के दावे को स्पष्ट रखा गया है।
- issue: अनुग्रह का भविष्यकालीन कथन
  choice: अनुग्रह बना रहेगा
  alternative: अनुग्रह होगा
  rationale: अंग्रेज़ी साक्षी के ‘will be with’ का साथ और निरंतरता का भाव व्यक्त करता है, बिना उद्धार-संबंधी कोई अतिरिक्त निष्कर्ष जोड़े।
- issue: महिमा करने की क्रिया का कालगत पक्ष
  choice: महिमा करता रहा
  alternative: महिमा की
  rationale: साक्षी के ‘was glorifying’ में निहित जारी क्रिया को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सरल, वर्तमान और गरिमापूर्ण रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है और यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है, इसलिए अनिश्चित यूनानी पदों पर अत्यधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
