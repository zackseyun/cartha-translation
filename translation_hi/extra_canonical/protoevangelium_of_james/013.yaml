base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/013.yaml
  text: '(1) She was in her sixth month. And look! Joseph came from his building, entered the house, and found her pregnant. He struck his face, threw himself on the ground in sackcloth, and wept bitterly, saying, “How can I face the Lord God? What prayer can I offer concerning this young girl, since I received her as a virgin from the Temple of the Lord God and did not protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Am I not reliving the story of Adam? For while Adam was giving glory during the hour of prayer, the serpent came, found Eve alone, and deceived her. And now it has happened to me!”


    (2) Joseph got up from the sackcloth, called her, and said to her, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) She wept bitterly, saying, “I am pure, and I have not known a man!”


    Joseph said to her, “Then where did this thing in your womb come from?”


    She said, “As the Lord my God lives, I do not know where it came from!”'
translation:
  language: hi
  text: '(1) मरियम के गर्भ का छठा महीना चल रहा था। तभी देखो, यूसुफ अपना निर्माण-कार्य छोड़कर लौटा। वह घर में आया और उसने मरियम को गर्भवती पाया। उसने अपने मुँह पर हाथ मारा, टाट ओढ़कर भूमि पर गिर पड़ा और फूट-फूटकर रोने लगा। उसने कहा, “अब मैं प्रभु परमेश्वर को कैसे मुँह दिखाऊँ? इस युवती के विषय में मैं क्या प्रार्थना करूँ? मैं इसे प्रभु परमेश्वर के मंदिर से कुँवारी अवस्था में लाया था, पर इसकी रक्षा न कर सका। किसने मेरे लिए यह जाल बिछाया? किसने मेरे घर में यह बुरा काम किया? किसने इस कुँवारी को अपवित्र किया? क्या आदम की कहानी मेरे साथ फिर से नहीं घट रही? क्योंकि जब आदम प्रार्थना के समय परमेश्वर की महिमा कर रहा था, तब साँप आया, उसने हव्वा को अकेली पाकर बहकाया। और अब मेरे साथ भी ऐसा ही हुआ है!”


    (2) तब यूसुफ टाट पर से उठा, उसने मरियम को बुलाकर कहा, “परमेश्वर ने तुम्हारी सुधि ली थी। फिर तुमने ऐसा क्यों किया? तुम प्रभु अपने परमेश्वर को भूल गई हो। तुमने स्वयं को क्यों अपमानित किया? तुम्हारा पालन-पोषण परमपवित्र स्थान में हुआ था और तुम्हें एक स्वर्गदूत के हाथ से भोजन मिला था!”


    (3) मरियम फूट-फूटकर रोई और बोली, “मैं शुद्ध हूँ; मैंने किसी पुरुष को नहीं जाना है।”[a]


    यूसुफ ने उससे कहा, “तो फिर तुम्हारे गर्भ में यह कहाँ से आया?”


    उसने कहा, “जीवित प्रभु मेरे परमेश्वर की शपथ, मैं नहीं जानती कि यह कहाँ से आया!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किसी पुरुष को नहीं जाना” का अर्थ है कि उसने किसी पुरुष के साथ यौन संबंध नहीं बनाया था।
