source:
  text: '(1) And she was in her sixth month. And look! Joseph came from his building, and came into the house, and found her pregnant. And he struck his face and flung himself on the ground in sackcloth and wept bitterly, saying, “How can I look to the Lord God? What prayer can I say about this young girl, since I took her as a virgin from the Temple of the Lord God and didn’t protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Aren’t I reliving the story of Adam? For as Adam was glorifying in the hour of prayer, the serpent came, found Eve alone, and deceived her, and now it’s happened to me!”


    (2) And Joseph stood from the sackcloth and called her and said to her, “God cared for you. Why have you done this? You’ve forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) And she wept bitterly, saying, “I’m pure, and I haven’t known a man!”


    And Joseph said to her, “Where then did this thing in your womb come from?”


    And she said, “As the Lord my God lives, I don’t know where it came from!”'
