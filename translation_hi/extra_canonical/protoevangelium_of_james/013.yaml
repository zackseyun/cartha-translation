lexical_decisions:
- source_word: from his building
  choice: अपना निर्माण-कार्य छोड़कर लौटा
  rationale: साक्ष्य में यूसुफ के निर्माण अथवा भवन-निर्माण के काम से लौटने का भाव है; ‘अपने भवन से’ यहाँ भ्रामक हो सकता था।
- source_word: struck his face
  choice: अपने मुँह पर हाथ मारा
  rationale: शोक और व्याकुलता की शारीरिक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में प्रत्यक्ष रखा गया है।
- source_word: in sackcloth
  choice: टाट ओढ़कर
  rationale: टाट शोक और पश्चात्ताप का पारंपरिक संकेत है; हिन्दी में केवल ‘टाट में’ की अपेक्षा यह अधिक स्पष्ट है।
- source_word: Holy of Holies
  choice: परमपवित्र स्थान
  rationale: मंदिर के सर्वाधिक पवित्र भाग के लिए समझने योग्य और प्रतिष्ठित हिन्दी पद चुना गया है।
- source_word: known a man
  choice: किसी पुरुष को नहीं जाना
  rationale: मूल का बाइबिलीय शिष्टोक्ति-रूप सुरक्षित रखा गया है और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: humiliated your soul
  choice: स्वयं को अपमानित किया
  rationale: ‘अपने प्राण को नीचा किया’ अत्यधिक कृत्रिम होता; यह चयन व्यक्ति की गरिमा को कलंकित करने का आशय बनाए रखता है।
theological_decisions:
- issue: मरियम के गर्भ का कारण
  choice: मरियम का कथन कि वह नहीं जानती कि गर्भ कहाँ से आया, बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: यह जोड़ना कि गर्भ पवित्र आत्मा से था
  rationale: इस अध्याय का संवाद अभी कारण को प्रकट नहीं करता; बाद की धर्मवैज्ञानिक जानकारी यहाँ जोड़ना कथात्मक तनाव को समय से पहले समाप्त कर देता।
- issue: आदम और हव्वा से तुलना
  choice: यूसुफ की अपनी व्याख्या और आशंका के रूप में रखा गया
  alternative: इसे घटनाओं का वस्तुनिष्ठ धर्मवैज्ञानिक वर्णन बनाना
  rationale: पाठ में यह यूसुफ के विलाप का हिस्सा है, इसलिए उसे कथावाचक की पुष्टि नहीं बनाया गया।
- issue: ‘परमेश्वर ने तुम्हारी सुधि ली थी’
  choice: अनुग्रहपूर्ण देखभाल का सामान्य कथन
  alternative: किसी विशिष्ट मतानुसार दिव्य चुनाव या पूर्वनियति की व्याख्या
  rationale: उपलब्ध साक्ष्य से अधिक संप्रदायगत अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किंतु सामान्य पाठकों के लिए सुबोध रखी गई है। अनुच्छेदों की नाटकीय तीव्रता और यूसुफ के बार-बार किए गए प्रश्न सुरक्षित हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण विशेषतः ‘निर्माण-कार्य’, ‘परमेश्वर ने तुम्हारी सुधि ली थी’ और ‘स्वयं को अपमानित किया’ जैसे पदों को आगे स्रोत-भाषा से जाँचना आवश्यक है।
