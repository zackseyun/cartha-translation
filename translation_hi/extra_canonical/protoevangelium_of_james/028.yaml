translation:
  language: hi
  text: '(1) और उसने पहाड़ से उतरती हुई उस दाई को पाया और उसे साथ ले आया। यूसुफ ने दाई से कहा, “मरियम मेरी मंगेतर है; उसने पवित्र आत्मा से गर्भ धारण किया है और उसका पालन-पोषण प्रभु के मंदिर में हुआ है।”


    दाई उसके साथ गई। (2) वे गुफा के सामने आकर खड़े हुए, और एक काले बादल ने गुफा को ढक लिया। दाई ने कहा, “आज मेरा प्राण प्रभु की महिमा करता है,[a] क्योंकि आज मेरी आँखों ने एक अद्भुत बात देखी है—इस्राएल के लिए उद्धार ने जन्म लिया है!”[b]


    तुरंत बादल गुफा से हट गया और गुफा में इतना तेज प्रकाश दिखाई दिया कि उनकी आँखें उसे सह न सकीं। थोड़ी देर बाद प्रकाश घटता गया, यहाँ तक कि एक शिशु दिखाई दिया। वह अपनी माता मरियम के पास आया और उसका दूध पीने लगा।[c]


    दाई पुकार उठी, “आज का दिन कितना महान है! मैंने यह नया चमत्कार देखा है!”


    (3) दाई गुफा से बाहर निकली तो सलोमी उसे मिली।


    उसने सलोमी से कहा, “सलोमी, सलोमी, मुझे तुम्हें एक अनोखा दृश्य बताना है: एक कुँवारी ने बच्चे को जन्म दिया है—यह उसकी प्रकृति के विपरीत है!”[d]


    सलोमी ने कहा, “जीवित प्रभु, मेरे परमेश्वर की शपथ, जब तक मैं अपनी उँगली डालकर उसकी दशा की जाँच न कर लूँ, तब तक मैं विश्वास नहीं करूँगी कि कुँवारी ने बच्चे को जन्म दिया है।”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक भाव संभवतः “आज मेरा प्राण महान किया गया है” भी हो सकता है। उपलब्ध आधार एक अंग्रेज़ी साक्षी है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: ‘is magnified’ में कर्तृवाच्य/कर्मवाच्य और स्तुतिपरक प्रतिध्वनि की अनिश्चितता सुरक्षित रखना।
  - marker: b
    text: पाठ में “उद्धार” को मानो जन्म लेने वाले व्यक्ति की तरह कहा गया है; इसे “उद्धारकर्ता” बनाकर स्पष्ट नहीं किया गया।
    reason: मूल रूपक और धर्मवैज्ञानिक तनाव को बनाए रखना।
  - marker: c
    text: 'वाक्य का क्रम असामान्य है: शिशु दिखाई देता है, फिर वह माता के पास आकर दूध पीता है। अनुवाद ने इस क्रम को बनाए रखा है।'
    reason: कथात्मक विचित्रता को सुचारु बनाने के लिए बदलने से बचना।
  - marker: d
    text: “उसकी प्रकृति के विपरीत” का आशय सामान्य प्रसव-प्रकृति के विरुद्ध कुँवारी का जन्म देना है; कथन को लेखक के दावे के रूप में रखा गया है।
    reason: दावे की प्राचीन शारीरिक धारणा को आधुनिक वैज्ञानिक निष्कर्ष की तरह प्रस्तुत न करना।
  - marker: e
    text: यहाँ सलोमी मरियम की प्रसवोत्तर शारीरिक दशा की प्रत्यक्ष जाँच की बात करती है।
    reason: शालीन शब्दावली के कारण संदर्भ अत्यधिक अस्पष्ट न हो।
