translation:
  language: hi
  text: '(1) तब वह भीतर गई और उसने उसे प्रसव की जाँच के लिए उचित स्थिति में रखा; और सलोमी ने उसकी दशा की जाँच की। सलोमी चिल्ला उठी, “मैंने जीवित परमेश्वर की परीक्षा ली है—और देखो! मेरा हाथ आग में जल रहा है और मुझसे अलग होकर गिरता जा रहा है!”


    (2) तब उसने प्रभु से प्रार्थना की, और उसी घड़ी दाई चंगी हो गई।


    (3) और देखो! प्रभु का एक स्वर्गदूत सलोमी के सामने खड़ा होकर कहने लगा, “प्रभु परमेश्वर के सामने तुम्हारी प्रार्थना सुन ली गई है। जाओ, बालक को छुओ, और तुम्हें उद्धार मिलेगा।”


    (4) उसने ऐसा ही किया और सलोमी चंगी हो गई। जब वह दंडवत करके गुफा से बाहर निकली, तो देखो! प्रभु के एक स्वर्गदूत की वाणी ने कहा, “सलोमी, सलोमी, जो अद्भुत बातें तुमने देखी हैं, उन्हें तब तक प्रकट न करना[a], जब तक बालक यरूशलेम में न आ जाए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दिए गए अंग्रेज़ी साक्षी में अर्थ है, “जो अद्भुत बातें तुमने देखी हैं, उनका वर्णन करो, जब तक बालक यरूशलेम में न आए।” यूनानी पांडुलिपि-परंपरा के प्रचलित पाठ में यहाँ निषेध का भाव मिलता है: “उन्हें प्रकट न करना।” प्रत्यक्ष यूनानी पाठ की समीक्षा अभी लंबित है।'
    reason: अंग्रेज़ी साक्षी और प्रचलित यूनानी पाठ के बीच संभावित महत्वपूर्ण पाठांतर को पारदर्शी बनाना।
lexical_decisions:
- source_word: tested the living God
  choice: जीवित परमेश्वर की परीक्षा ली है
  rationale: यह दैवी सत्य को अविश्वासपूर्वक परखने की गंभीरता को बनाए रखता है; केवल ‘जाँच’ कहना इस धार्मिक अर्थ को कमजोर करता।
- source_word: my hand is on fire and falling away from me
  choice: मेरा हाथ आग में जल रहा है और मुझसे अलग होकर गिरता जा रहा है
  rationale: दंड के तीखे और शारीरिक चित्र को नरम किए बिना स्वाभाविक हिन्दी में रखा गया है।
- source_word: was healed
  choice: चंगी हो गई
  rationale: चमत्कारिक आरोग्य के धार्मिक-साहित्यिक प्रसंग में यह सहज और गरिमापूर्ण हिन्दी है।
- source_word: salvation
  choice: उद्धार
  rationale: मूल के व्यापक धार्मिक अर्थ को सुरक्षित रखता है; इसे केवल ‘आरोग्य’ तक सीमित नहीं करता, यद्यपि प्रसंग में शारीरिक चंगाई शामिल है।
- source_word: worshipped
  choice: दंडवत करके
  rationale: शारीरिक श्रद्धा-क्रिया को स्पष्ट करता है और हिन्दी में दृश्य को स्वाभाविक बनाता है।
- source_word: wonderful things
  choice: अद्भुत बातें
  rationale: देखी गई आश्चर्यजनक घटनाओं के तटस्थ और व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: सलोमी की क्रिया को परमेश्वर की परीक्षा कहना
  choice: ‘जीवित परमेश्वर की परीक्षा ली’ को यथावत रखा
  alternative: ‘जीवित परमेश्वर को परखा’ या ‘परमेश्वर के विषय में संदेह किया’
  rationale: स्रोत-साक्ष्य की कठोर धार्मिक भाषा और उससे जुड़ी दंडात्मक प्रतिक्रिया को बिना व्याख्यात्मक नरमी के सुरक्षित रखना आवश्यक है।
- issue: ‘उद्धार’ का अर्थ
  choice: ‘उद्धार’
  alternative: ‘चंगाई’ या ‘मुक्ति’
  rationale: प्रसंग शारीरिक आरोग्य की ओर संकेत करता है, पर स्रोत का शब्द संभवतः अधिक व्यापक धार्मिक अर्थ रखता है; इसलिए तनाव को नहीं सुलझाया गया।
- issue: पद 2 में सर्वनाम और ‘दाई’ की पहचान
  choice: ‘उसने’ और ‘दाई’ का भेद बनाए रखा
  alternative: दोनों को स्पष्ट रूप से सलोमी बताना
  rationale: प्राप्त साक्ष्य में अस्पष्टता है; अनुवाद ने सलोमी और दाई की पहचान को चुपचाप एक नहीं किया।
- issue: अंतिम आज्ञा की दिशा
  choice: ‘तब तक प्रकट न करना’
  alternative: ‘तब तक बताते रहना’
  rationale: यूनानी परंपरा में इस स्थान पर निषेधात्मक पाठ व्यापक रूप से प्रमाणित माना जाता है, जबकि दिए गए अंग्रेज़ी साक्षी का ‘report ... until’ अर्थगत रूप से असहज है। प्रत्यक्ष स्रोत-भाषा समीक्षा लंबित होने के कारण पाठांतर को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, किंतु प्राचीन धार्मिक आख्यान के अनुरूप गरिमापूर्ण रखी गई है। ‘देखो’, ‘उसी घड़ी’, ‘प्रभु का स्वर्गदूत’ और ‘उद्धार’ जैसे पद स्रोत की शैली को बनाए रखते हैं। पद 1 के पहले वाक्य में संदर्भ स्पष्ट करने के लिए ‘प्रसव की जाँच के लिए’ जोड़ा गया है, पर जाँच की अंतरंग प्रकृति को अनावश्यक रूप से स्पष्ट नहीं किया गया। स्रोत-भाषा समीक्षा लंबित होने के कारण अस्पष्ट सर्वनाम सुरक्षित रखे गए हैं।
