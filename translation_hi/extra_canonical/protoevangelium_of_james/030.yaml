base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/030.yaml
  text: '(1) And look! Joseph was preparing to leave for Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers and sent for the magi, and they told him about the star.


    (3) And look! They saw stars in the East. The stars led the magi until they came to the cave, and the star stood over the child’s head. When the magi saw him with his mother Mary, they took gifts from their bags: gold, frankincense, and myrrh.


    After being warned by the angel, they returned to their country by another way.'
translation:
  language: hi
  text: '**याकूब का आदिसुसमाचार — अध्याय 21: ज्योतिषी[a]**


    (1) और देखो! यूसुफ यहूदिया के लिए निकलने की तैयारी कर रहा था कि यहूदिया के बैतलहम में बड़ी हलचल मच गई। क्योंकि कुछ ज्योतिषी आए और पूछने लगे, “यहूदियों का राजा कहाँ है? हमने पूर्व दिशा में उसका तारा देखा है और उसे दंडवत करने आए हैं।”[b]


    (2) जब हेरोदेस ने यह सुना, तो वह व्याकुल हो उठा। उसने अधिकारियों को भेजा और ज्योतिषियों को बुलवाया; तब उन्होंने उसे उस तारे के विषय में बताया।


    (3) और देखो! उन्होंने पूर्व दिशा में तारे देखे। वे तारे उन्हें तब तक राह दिखाते रहे, जब तक वे उस गुफा तक नहीं पहुँच गए; और वह तारा बच्चे के सिर के ऊपर ठहर गया। जब ज्योतिषियों ने बच्चे को उसकी माता मरियम के साथ देखा, तो उन्होंने अपनी थैलियों से भेंटें निकालीं—सोना, लोबान और गंधरस।


    फिर स्वर्गदूत से चेतावनी पाकर वे दूसरे मार्ग से अपने देश लौट गए।'
