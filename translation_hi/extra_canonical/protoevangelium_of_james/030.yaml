  choice: ज्योतिषी
  rationale: यह शब्द प्राचीन पूर्वी विद्वान-ज्योतिषियों के लिए स्वाभाविक आधुनिक हिन्दी है और उन्हें अनैतिहासिक रूप से ‘राजा’ नहीं बनाता।
- source_word: 'worship (likely Greek: προσκυνέω, source-language review pending)'
  choice: दंडवत करना
  rationale: यह शारीरिक नमन और सम्मान/आराधना—दोनों की संभावित अर्थ-सीमा को खुला रखता है; केवल ‘पूजा’ कहकर धार्मिक अर्थ को पहले से निर्णीत नहीं करता।
- source_word: commotion
  choice: बड़ी हलचल
  rationale: बैतलहम में उत्पन्न सार्वजनिक खलबली को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: frankincense
  choice: लोबान
  rationale: सुगंधित धूपद्रव्य के लिए प्रचलित और व्यापक रूप से समझा जाने वाला हिन्दी शब्द।
- source_word: myrrh
  choice: गंधरस
  rationale: प्राचीन सुगंधित राल के लिए प्रतिष्ठित हिन्दी बाइबलीय पद।
- source_word: cave
  choice: गुफा
  rationale: दिए गए साक्ष्य की विशिष्ट जन्मस्थली को बिना ‘अस्तबल’ में बदलकर सुरक्षित रखता है।
theological_decisions:
- issue: ज्योतिषियों की पहचान
  choice: उन्हें ‘ज्योतिषी’ कहा गया है
  alternative: ‘मागी’, ‘ज्ञानी पुरुष’ या ‘राजा’
  rationale: साक्ष्य में magi है; ‘राजा’ पाठ में नहीं है। ‘ज्योतिषी’ मूल पद की ऐतिहासिक-सांस्कृतिक पहचान को अधिक स्पष्ट रखता है।
- issue: ज्योतिषियों के नमन का स्वरूप
  choice: ‘दंडवत करने’
  alternative: ‘आराधना करने’ या ‘पूजा करने’
  rationale: यह अभिवादन, राजकीय सम्मान और धार्मिक आराधना के बीच निहित अर्थगत तनाव को अनावश्यक रूप से हल नहीं करता।
- issue: बहुवचन तारों से एकवचन तारे की ओर बदलाव
  choice: पहले ‘तारे/वे तारे’, फिर ‘वह तारा’
  alternative: पूरे अनुच्छेद में केवल एकवचन ‘तारा’
  rationale: प्राप्त साक्ष्य का उल्लेखनीय बहुवचन-से-एकवचन परिवर्तन ज्यों का त्यों सुरक्षित रखा गया है।
- issue: जन्मस्थान
  choice: ‘गुफा’
  alternative: ‘अस्तबल’ या ‘घर’
  rationale: इस रचना का अपना कथात्मक विवरण सुरक्षित रखा गया है और अन्य जन्म-वृत्तांतों की शब्दावली इसमें नहीं मिलाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘और देखो!’ जैसी उद्घोषणात्मक पुनरावृत्ति तथा ‘यहूदिया के बैतलहम’ की पुनरुक्ति स्रोत-साक्ष्य के अनुरूप रखी गई है। बहुवचन ‘तारे’ से एकवचन ‘तारा’ का असामान्य परिवर्तन जानबूझकर नहीं सुधारा गया। उपलब्ध drafting basis सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-परीक्षण अभी लंबित है, इसलिए यूनानी संबंधी पहचानें अंतिम आलोचनात्मक सत्यापन के अधीन हैं।
