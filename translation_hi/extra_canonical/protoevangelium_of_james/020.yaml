    rationale: ‘निर्दोष’ दोषमुक्ति का संकरा अर्थ देता है, जबकि justified का धार्मिक और न्यायिक अर्थ-क्षेत्र व्यापक है। ‘धर्मी ठहराई गई’ हिन्दी बाइबिलीय प्रयोग में अधिक निकट है और दोनों आयाम सुरक्षित रखता है।
