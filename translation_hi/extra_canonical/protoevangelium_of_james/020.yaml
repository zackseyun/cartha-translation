  source_fidelity: दिए गए अंग्रेज़ी साक्ष्य के प्रति मसौदा अधिकांशतः निकट है और कठिन वाक्यांश को टिप्पणी में चिह्नित करता है। फिर भी (2) में “give me the back to the poor” को “मुझे फिर से निर्धनों के लिए लौटा दे” कहना स्रोत के अस्पष्ट और शाब्दिक रूप से अटपटे वाक्य-विन्यास में ‘फिर से’ तथा ‘के लिए’ जोड़ता है। अस्पष्टता बचाने के लिए अधिक निकट, किंतु जानबूझकर कठिन, रूप उचित है। (4) में ‘for Israel’ का अनुवाद ‘इस्राएल के लिए’ ठीक है।
  naturalness: भाषा सामान्यतः आधुनिक, स्पष्ट और गरिमापूर्ण है। ‘मेरा हाथ आग में जल रहा है’ स्रोत के ‘on fire’ को स्वाभाविक रूप से व्यक्त करता है। ‘निर्दोष ठहराई जाकर’ हिन्दी में ‘justified’ के लिए अर्थ को अनावश्यक रूप से केवल निर्दोषता तक सीमित करता है; ‘धर्मी ठहराई गई’ न्यायिक-धार्मिक अर्थ-क्षेत्र को अधिक सीधे रखता है। ‘कोई छोटी-मोटी परीक्षा नहीं’ भी स्रोत की लघुता और गंभीरता दोनों को सहज ढंग से देता है।
  terminology: ‘अधर्म,’ ‘अविश्वास,’ ‘जीवित परमेश्वर,’ ‘उद्धार,’ और ‘आराधना’ सुसंगत बाइबिलीय शब्दावली हैं। नामों में ‘मरियम,’ ‘सलोमी,’ ‘इस्राएल,’ ‘यरूशलेम,’ ‘अब्राहम,’ ‘इसहाक,’ और ‘याकूब’ का रूप स्थिर और उपयुक्त है। ‘सबके प्रभु’ Lord of All का स्वाभाविक अनुवाद है।
