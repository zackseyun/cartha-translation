translation:
  language: hi
  text: '(1) तब दाई भीतर गई और बोली, “मरियम, अपने आपको तैयार करो, क्योंकि तुम्हारे विषय में कोई छोटी-मोटी परीक्षा नहीं होने वाली।”


    तब सलोमी ने उसकी जाँच की। सलोमी चिल्ला उठी और बोली, “हाय, मेरे अधर्म और मेरे अविश्वास के कारण! क्योंकि मैंने जीवित परमेश्वर को परखा है; और देखो! मेरा हाथ आग में जल रहा है और मुझसे अलग होकर गिरता जा रहा है!”


    (2) तब वह प्रभु के सामने घुटनों के बल गिर पड़ी और कहने लगी, “मेरे पूर्वजों के परमेश्वर, मुझे स्मरण कर, क्योंकि मैं अब्राहम, इसहाक और याकूब की वंशज हूँ। इस्राएल के लोगों के सामने मुझे दंड का उदाहरण न बना, बल्कि मुझे फिर से निर्धनों के लिए लौटा दे[a]; क्योंकि हे प्रभु, तू जानता है कि मैंने तेरे नाम में लोगों को चंगा किया है और अपनी मजदूरी तुझसे पाई है।”


    (3) और देखो! प्रभु का एक स्वर्गदूत उसे दिखाई दिया और बोला, “सलोमी, सलोमी, सबके प्रभु ने तुम्हारी प्रार्थना सुन ली है। अपना हाथ बालक की ओर बढ़ाओ और उसे उठा लो; तब तुम्हें उद्धार और आनन्द मिलेगा।”


    (4) और देखो! सलोमी आनन्द से बालक के पास गई और उसे उठा लिया। वह कहने लगी, “मैं उसकी आराधना करती हूँ, क्योंकि इस्राएल के लिए एक महान राजा जन्मा है।” उसी क्षण सलोमी चंगी हो गई और निर्दोष ठहराई जाकर गुफा से बाहर चली गई[b]।


    और देखो! एक आवाज़ कह रही थी, “सलोमी, सलोमी, जो अद्भुत बातें तुमने देखी हैं, उनके विषय में तब तक किसी को न बताना, जब तक बालक यरूशलेम में न आ जाए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मुझे फिर से निर्धनों के लिए लौटा दे” उपलब्ध साक्ष्य का कठिन और संभवतः पाठगत रूप से अनिश्चित वाक्यांश है। अर्थ यह हो सकता है कि सलोमी निर्धनों की सेवा करने की अपनी भूमिका में फिर लौटना चाहती है; पर अनिश्चितता के कारण मुख्य पाठ में व्याख्या नहीं जोड़ी गई।
    reason: कठिन और अस्पष्ट पाठ को पाठक के लिए चिह्नित करना तथा अनुवाद में अति-व्याख्या से बचना।
  - marker: b
    text: “निर्दोष ठहराई जाकर” का मूल भाव न्यायिक अथवा धार्मिक रूप से सही ठहराए जाने का हो सकता है; यह केवल शारीरिक चंगाई का पुनरुक्त वर्णन नहीं है।
    reason: धर्मवैज्ञानिक अर्थ-क्षेत्र और संभावित द्विअर्थता को सुरक्षित रखना।
lexical_decisions:
- source_word: position yourself
  choice: अपने आपको तैयार करो
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य का वाक्यांश प्रसवोत्तर शारीरिक जाँच के लिए उचित स्थिति लेने का संकेत देता है; हिन्दी में अत्यधिक स्पष्ट शारीरिक विवरण जोड़े बिना स्वाभाविक अभिव्यक्ति चुनी गई।
- source_word: examined
  choice: जाँच की
  rationale: यहाँ प्रसंग में शारीरिक परीक्षण अभिप्रेत है, पर स्रोत जितना कहता है उससे अधिक विशिष्टता नहीं जोड़ी गई।
- source_word: lawlessness
  choice: अधर्म
  rationale: नैतिक और धार्मिक उल्लंघन का गंभीर भाव बनाए रखता है और आधुनिक बाइबिलीय हिन्दी में सुबोध है।
- source_word: the living God
  choice: जीवित परमेश्वर
  rationale: पारंपरिक ईश्वरीय पदवी को सीधे और स्वाभाविक रूप में सुरक्षित रखा गया।
- source_word: Lord of All
  choice: सबके प्रभु
  rationale: सार्वभौम प्रभुता का अर्थ बनाए रखते हुए सहज आधुनिक हिन्दी दी गई।
- source_word: salvation
  choice: उद्धार
  rationale: शारीरिक चंगाई और व्यापक धार्मिक अर्थ—दोनों की संभावित प्रतिध्वनि बनाए रखने वाला शब्द।
- source_word: justified
  choice: निर्दोष ठहराई जाकर
  rationale: न्यायिक-धार्मिक अर्थ को केवल ‘क्षमा पाकर’ या ‘धर्मी बनकर’ कहकर सीमित नहीं किया गया।
- source_word: report
  choice: किसी को न बताना
  rationale: आदेश का स्वाभाविक हिन्दी रूप; अद्भुत घटनाओं को सार्वजनिक न करने का आशय स्पष्ट है।
theological_decisions:
- issue: बालक के प्रति सलोमी का कथन “I worship him”
  choice: मैं उसकी आराधना करती हूँ
  alternative: मैं उसे दण्डवत करती हूँ / मैं उसे प्रणाम करती हूँ
  rationale: उपलब्ध साक्ष्य में धार्मिक सम्मान का प्रबल भाव है; ‘आराधना’ उसे सुरक्षित रखती है, यद्यपि यूनानी स्रोत की प्रत्यक्ष समीक्षा के बाद क्रिया की अर्थ-सीमा पुनः जाँची जानी चाहिए।
- issue: सलोमी का ‘उद्धार और आनन्द’ पाना
  choice: उद्धार और आनन्द
  alternative: चंगाई और आनन्द
  rationale: ‘उद्धार’ को केवल शारीरिक आरोग्य तक सीमित नहीं किया गया, क्योंकि आगे तत्काल चंगाई अलग से वर्णित है।
- issue: गुफा से ‘justified’ होकर निकलना
  choice: निर्दोष ठहराई जाकर
  alternative: धर्मी ठहराई जाकर
  rationale: न्यायिक तथा धार्मिक तनाव सुरक्षित है; हिन्दी में ‘निर्दोष ठहराई’ प्रसंगगत दोष और पुनर्स्थापन से स्वाभाविक रूप से जुड़ती है।
- issue: इस्राएल के लिए महान राजा का जन्म
  choice: इस्राएल के लिए एक महान राजा जन्मा है
  alternative: इस्राएल में एक महान राजा जन्मा है
  rationale: ‘के लिए’ लाभ अथवा नियुक्ति की दिशा को बनाए रखता है; ‘में’ केवल जन्मस्थान या समुदाय का अर्थ दे सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। कथात्मक ‘और देखो!’ को स्रोत की विस्मयात्मक गति बनाए रखने के लिए रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण कठिन पदों, विशेषतः 2 और 4 में, सावधानीपूर्वक अस्पष्टता सुरक्षित रखी गई है।
