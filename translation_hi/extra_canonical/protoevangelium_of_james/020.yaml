    (2) तब वह प्रभु के सामने घुटनों के बल गिर पड़ी और कहने लगी, “मेरे पूर्वजों के परमेश्वर, मुझे स्मरण कर, क्योंकि मैं अब्राहम, इसहाक और याकूब की वंशज हूँ। इस्राएल के लोगों के सामने मुझे दंड का उदाहरण न बना, बल्कि मुझे निर्धनों को वापस दे[a]; क्योंकि हे प्रभु, तू जानता है कि मैंने तेरे नाम में लोगों को चंगा किया है और अपनी मजदूरी तुझसे पाई है।”


    (3) और देखो! प्रभु का एक स्वर्गदूत उसे दिखाई दिया और बोला, “सलोमी, सलोमी, सबके प्रभु ने तुम्हारी प्रार्थना सुन ली है। अपना हाथ बालक की ओर बढ़ाओ और उसे उठा लो; तब तुम्हें उद्धार और आनन्द मिलेगा।”


    (4) और देखो! सलोमी आनन्द से बालक के पास गई और उसे उठा लिया। वह कहने लगी, “मैं उसकी आराधना करती हूँ, क्योंकि इस्राएल के लिए एक महान राजा जन्मा है।” उसी क्षण सलोमी चंगी हो गई और धर्मी ठहराई गई; फिर वह गुफा से बाहर चली गई[b]।


    और देखो! एक आवाज़ कह रही थी, “सलोमी, सलोमी, जो अद्भुत बातें तुमने देखी हैं, उनके विषय में तब तक किसी को न बताना, जब तक बालक यरूशलेम में न आ जाए।”'
