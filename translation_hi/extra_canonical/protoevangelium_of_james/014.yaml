base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/014.yaml
  text: '(1) Joseph was very afraid and kept quiet about her as he considered what to do. Joseph said, “If I hide her sin, I will be found resisting the law of the Lord. But if I reveal her to the people of Israel, I am afraid that what is inside her might be angelic, and I will be found handing innocent blood over to the judgment of death. So what will I do about her? I will secretly release her from me.”


    Night overtook him. (2) And look! An angel of the Lord appeared to him in a dream and said, “Do not fear this child, for the one in her is from the Holy Spirit. She will give birth to a son, and you will call his name ‘Jesus,’ because he will save his people from their sins.”


    Joseph awoke from his sleep and glorified the God of Israel, who had shown him grace. And he protected her.'
translation:
  language: hi
  text: '(1) यूसुफ बहुत डर गया और उसके विषय में चुप रहा। वह सोचता रहा कि उसके साथ क्या करे। यूसुफ ने कहा, “यदि मैं उसका पाप छिपाऊँ, तो मैं प्रभु की व्यवस्था का विरोधी ठहरूँगा। पर यदि मैं उसे इस्राएल के लोगों के सामने प्रकट कर दूँ, तो मुझे डर है कि उसके भीतर जो है, वह कहीं किसी स्वर्गदूत से न हो; तब मैं निर्दोष रक्त को मृत्यु-दण्ड के लिए सौंपने वाला ठहरूँगा। तो मैं उसके साथ क्या करूँ? मैं चुपके से उसे अपने से अलग कर दूँगा।”


    फिर रात ने उसे आ घेरा। (2) और देखो! प्रभु का एक स्वर्गदूत उसे स्वप्न में दिखाई दिया और बोला, “इस बालक से मत डर, क्योंकि जो उसके गर्भ में है, वह पवित्र आत्मा से है। वह एक पुत्र को जन्म देगी, और तुम उसका नाम ‘यीशु’ रखोगे, क्योंकि वह अपने लोगों को उनके पापों से बचाएगा।”


    तब यूसुफ नींद से जागा और उसने इस्राएल के परमेश्वर की महिमा की, जिसने उस पर अनुग्रह किया था। और उसने उसकी रक्षा की।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: kept quiet about her
  choice: उसके विषय में चुप रहा
  rationale: यूसुफ द्वारा मरियम की दशा सार्वजनिक न करने का अर्थ सीधे और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: angelic
  choice: किसी स्वर्गदूत से
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की असामान्य और अनिश्चित धारणा को स्पष्ट किए बिना सुरक्षित रखा गया है; यह ‘दैवी’ या ‘पवित्र आत्मा से’ कहकर तनाव को समय से पहले नहीं सुलझाता।
- source_word: secretly set her free from me
  choice: चुपके से उसे अपने से अलग कर दूँगा
  rationale: संबंध-विच्छेद का आशय व्यक्त करता है, पर संबंध की सटीक कानूनी स्थिति के विषय में उपलब्ध साक्ष्य से अधिक निश्चित नहीं होता।
- source_word: night overtook him
  choice: रात ने उसे आ घेरा
  rationale: मूल साक्ष्य के चित्रात्मक मुहावरे को सहज हिंदी में बनाए रखा गया है।
- source_word: the one in her
  choice: जो उसके गर्भ में है
  rationale: हिंदी में स्वाभाविक स्पष्टता के लिए गर्भ का संदर्भ व्यक्त किया गया, जबकि गर्भस्थ की पहचान आगे के वाक्य तक खुली रखी गई है।
- source_word: protected her
  choice: उसने उसकी रक्षा की
  rationale: क्रिया का सीधा अर्थ रखा गया है; इसे केवल ‘अपने पास रखा’ या वैवाहिक अर्थ में सीमित नहीं किया गया।
theological_decisions:
- issue: गर्भस्थ शिशु की उत्पत्ति के बारे में यूसुफ की आशंका
  choice: वह कहीं किसी स्वर्गदूत से न हो
  alternative: वह कहीं दैवी न हो
  rationale: ‘angelic’ की विशिष्टता और कथानक का असहज धार्मिक तनाव सुरक्षित रखा गया है; व्यापक ‘दैवी’ अनुवाद मूल साक्ष्य को समतल कर देता।
- issue: 'स्वर्गदूत का आदेश: ‘Do not fear this child’'
  choice: इस बालक से मत डर
  alternative: मरियम को स्वीकार करने से मत डर
  rationale: उपलब्ध साक्ष्य बच्चे को आदेश का प्रत्यक्ष विषय बनाता है। मत्ती-सदृश वैकल्पिक अर्थ को यहाँ आयात नहीं किया गया।
- issue: पवित्र आत्मा से गर्भस्थ होना
  choice: जो उसके गर्भ में है, वह पवित्र आत्मा से है
  alternative: उसने पवित्र आत्मा से गर्भधारण किया है
  rationale: साक्ष्य की वाक्य-रचना और गर्भस्थ पर केंद्रित कथन को रखा गया है, बिना अतिरिक्त सिद्धान्तात्मक व्याख्या के।
- issue: अनुग्रह का कर्ता और प्राप्तकर्ता
  choice: जिसने उस पर अनुग्रह किया था
  alternative: जिसने उसे अनुग्रह दिया था
  rationale: दोनों अर्थतः संभव हैं; चुना हुआ रूप आधुनिक हिंदी में अधिक स्वाभाविक है और परमेश्वर को कर्ता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वाक्य-विन्यास को हिंदी में स्वाभाविक बनाया गया है, पर उपलब्ध अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य की वास्तविक अस्पष्टताएँ—विशेषकर ‘angelic’, गुप्त संबंध-विच्छेद, और अंतिम ‘रक्षा की’—नहीं मिटाई गईं। यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण पाठ में कोई पांडुलिपीय फुटनोट नहीं जोड़ा गया है।
