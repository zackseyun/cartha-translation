  text: '(1) And look! A woman was coming down from the mountain, and she said to me, “Man, where are you going?”


    I said, “I am looking for a Hebrew midwife.”


    She replied, “Are you from Israel?”


    I said to her, “Yes.”


    Then she said, “And who is the one giving birth in the cave?”


    I said, “My betrothed.”


    She said to me, “She is not your wife?”


    I said to her, “Mary was raised in the Temple of the Lord, and it was decided by lot that she would be my wife. Yet she is not my wife, but she has conceived from the Holy Spirit.”


    The midwife said, “Really?”


    Joseph said to her, “Come and see.”


    And the midwife went with him.


    (2) They stood in front of the cave, and a bright cloud overshadowed the cave. The midwife said, “My soul is magnified today, because my eyes have seen something wonderful. Salvation has been born to Israel!”


    Immediately the cloud withdrew from the cave, and a great light appeared in the cave, so that their eyes could not bear it. A little later, the light withdrew until an infant appeared. He came and took the breast of his mother, Mary.


    The midwife cried out and said, “How great today is for me, because I have seen this new miracle!”


    (3) The midwife went out from the cave, and Salome met her.


    She said to her, “Salome, Salome, I must describe a new sight to you. A virgin has given birth, which is against her nature!”


    Salome said, “As the Lord my God lives, unless I examine her condition, I will not believe that the virgin has given birth.”'
translation:
  language: hi
  text: '(1) और देखो! एक स्त्री पहाड़ से उतरती हुई आ रही थी। उसने मुझसे कहा, “भले आदमी, तुम कहाँ जा रहे हो?”


    मैंने कहा, “मैं एक इब्रानी दाई को ढूँढ़ रहा हूँ।”


    उसने उत्तर दिया, “क्या तुम इस्राएल से हो?”


    मैंने उससे कहा, “हाँ।”


    तब उसने कहा, “और गुफा में जो जन रही है, वह कौन है?”


    मैंने कहा, “मेरी मंगेतर।”


    उसने मुझसे कहा, “वह तुम्हारी पत्नी नहीं है?”


    मैंने उससे कहा, “मरियम का पालन-पोषण प्रभु के मंदिर में हुआ था, और चिट्ठी डालकर यह ठहराया गया कि वह मेरी पत्नी बने। फिर भी वह मेरी पत्नी नहीं है; पर उसने पवित्र आत्मा से गर्भ धारण किया है।”[a]


    दाई ने कहा, “क्या सचमुच?”


    यूसुफ ने उससे कहा, “आओ और देखो।”


    और दाई उसके साथ चली गई।


    (2) वे गुफा के सामने खड़े हुए, और एक चमकीले बादल ने गुफा को अपनी छाया में ढक लिया। दाई ने कहा, “आज मेरा प्राण बड़ाई करता है, क्योंकि मेरी आँखों ने एक अद्भुत बात देखी है—इस्राएल के लिए उद्धार ने जन्म लिया है!”[b]


    तुरंत बादल गुफा से हट गया, और गुफा में एक महान ज्योति प्रकट हुई, जिसे उनकी आँखें सह नहीं सकीं। थोड़ी देर बाद ज्योति हटने लगी, यहाँ तक कि एक शिशु दिखाई दिया। वह आया और अपनी माता मरियम का स्तन पीने लगा।[c]


    दाई पुकार उठी, “आज का दिन मेरे लिए कितना महान है, क्योंकि मैंने यह नया चमत्कार देखा है!”


    (3) दाई गुफा से बाहर निकली, और सलोमी उससे मिली।


    उसने उससे कहा, “सलोमी, सलोमी, मुझे तुम्हें एक नया दृश्य बताना है: एक कुँवारी ने जन्म दिया है—यह उसकी प्रकृति के विरुद्ध है!”[d]


    सलोमी ने कहा, “मेरे प्रभु परमेश्वर के जीवन की शपथ, जब तक मैं उसकी दशा की जाँच न कर लूँ, तब तक विश्वास नहीं करूँगी कि कुँवारी ने जन्म दिया है।”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी शेष है। ‘पत्नी बने’ और ‘पत्नी नहीं है’ का तनाव इसी साक्ष्य में मौजूद है।
    reason: Drafting basis and genuine relational ambiguity require disclosure.
  - marker: b
    text: ‘इस्राएल के लिए उद्धार ने जन्म लिया है’ मूल साक्ष्य के असामान्य व्यक्तिकरण को सुरक्षित रखता है; इसे ‘उद्धारकर्ता’ नहीं बनाया गया है।
    reason: Prevents an interpretive christological substitution for the witnessed wording.
  - marker: c
    text: ‘ज्योति हटने लगी, यहाँ तक कि एक शिशु दिखाई दिया’ दृश्य के क्रम को बताता है; यह शिशु की उत्पत्ति की कोई अतिरिक्त व्याख्या नहीं करता।
    reason: Preserves narrative ambiguity surrounding the manifestation.
  - marker: d
    text: ‘उसकी प्रकृति के विरुद्ध’ का आशय साक्ष्य में और स्पष्ट नहीं किया गया है; इसलिए इसे किसी बाद की तकनीकी धर्मवैज्ञानिक धारणा में नहीं बदला गया।
    reason: Preserves ambiguity about virgin birth and bodily condition.
  - marker: e
    text: ‘दशा’ उस शारीरिक स्थिति का शिष्ट, सामान्य संकेत है जिसकी जाँच सलोमी करना चाहती है; यहाँ जाँच का तरीका नहीं बताया गया।
    reason: Avoids importing details from the following chapter or later interpretation.
lexical_decisions:
- source_word: Hebrew midwife
  choice: इब्रानी दाई
  rationale: जातीय-सांस्कृतिक विशेषण और प्रसव-सहायिका का सामान्य आधुनिक हिन्दी पद दोनों सुरक्षित रखे गए हैं।
- source_word: betrothed
  choice: मंगेतर
  rationale: विवाह-पूर्व बंधन को स्वाभाविक हिन्दी में व्यक्त करता है और ‘पत्नी’ से भेद बनाए रखता है।
- source_word: decided by lot
  choice: चिट्ठी डालकर यह ठहराया गया
  rationale: प्राचीन लॉट/पर्ची द्वारा निर्णय की प्रक्रिया को साधारण पाठक के लिए स्पष्ट रखते हुए उसका धार्मिक-सांस्कृतिक रूप नहीं मिटाया गया।
- source_word: overshadowed
  choice: अपनी छाया में ढक लिया
  rationale: बादल द्वारा आच्छादन का दृश्य अर्थ सुरक्षित है; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: salvation
  choice: उद्धार
  rationale: यहाँ अमूर्त ‘उद्धार’ के जन्म लेने का असामान्य व्यक्तिकरण जानबूझकर सुरक्षित रखा गया है।
- source_word: condition
  choice: दशा
  rationale: मूल साक्ष्य में संकेतित किंतु अनिर्दिष्ट शारीरिक अवस्था को शिष्ट और अस्पष्ट रखा गया है; अगली कथा की जाँच को पहले से विस्तार नहीं दिया गया।
theological_decisions:
- issue: मरियम और यूसुफ के संबंध का तनाव
  choice: ‘वह मेरी पत्नी बने’ और ‘फिर भी वह मेरी पत्नी नहीं है’ दोनों कथनों को साथ रखा
  alternative: उसे केवल मंगेतर अथवा विधिवत पत्नी कहकर तनाव मिटा देना
  rationale: साक्ष्य वैवाहिक निर्धारण और अभी पत्नी न होने की स्थिति दोनों कहता है; अनुवाद ने इस वास्तविक तनाव का समाधान स्वयं नहीं किया।
- issue: पवित्र आत्मा से गर्भधारण
  choice: ‘उसने पवित्र आत्मा से गर्भ धारण किया है’
  alternative: ‘पवित्र आत्मा के द्वारा’ या अधिक व्याख्यात्मक अलौकिक गर्भधारण
  rationale: स्रोत का संक्षिप्त कारण-संबंध रखा गया है और किसी सांप्रदायिक सूत्रीकरण को नहीं जोड़ा गया।
- issue: ‘उद्धार ने जन्म लिया’ का व्यक्तिकरण
  choice: असामान्य वाक्य को लगभग यथावत रखा
  alternative: ‘इस्राएल के उद्धारकर्ता का जन्म हुआ है’
  rationale: ‘उद्धारकर्ता’ पाठ में नहीं है; उसे जोड़ना धर्मवैज्ञानिक अर्थ को स्पष्ट करने के साथ बदल भी देता।
- issue: कुँवारी के जन्म देने की शारीरिक प्रकृति
  choice: ‘यह उसकी प्रकृति के विरुद्ध है’
  alternative: ‘उसका कुँवारापन अक्षुण्ण रहा’
  rationale: पाठ का दावा अस्पष्ट है और स्पष्ट रूप से बाद वाली धर्मवैज्ञानिक शब्दावली नहीं देता; इसलिए अस्पष्टता बचाई गई।
- issue: सलोमी की प्रस्तावित जाँच
  choice: ‘उसकी दशा की जाँच’
  alternative: जाँच के अंग या तरीके को स्पष्ट करना
  rationale: इस अध्यायांश में जाँच का विवरण नहीं दिया गया; शिष्ट अस्पष्टता स्रोत के अनुरूप है।
