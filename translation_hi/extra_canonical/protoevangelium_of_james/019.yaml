  revised_text: '(1) और देखो! एक स्त्री पहाड़ से उतरती हुई आ रही थी। उसने मुझसे कहा, “आदमी, तुम कहाँ जा रहे हो?”


    मैंने कहा, “मैं एक इब्रानी दाई को ढूँढ़ रहा हूँ।”


    उसने उत्तर दिया, “क्या तुम इस्राएली हो?”


    मैंने उससे कहा, “हाँ।”


    तब उसने कहा, “और गुफा में जो जन रही है, वह कौन है?”


    मैंने कहा, “मेरी मंगेतर।”


    उसने मुझसे कहा, “वह तुम्हारी पत्नी नहीं है?”


    मैंने उससे कहा, “मरियम का पालन-पोषण प्रभु के मंदिर में हुआ था, और चिट्ठी डालकर यह ठहराया गया कि वह मेरी पत्नी बने। फिर भी वह मेरी पत्नी नहीं है; पर उसने पवित्र आत्मा से गर्भ धारण किया है।”[a]


    दाई ने कहा, “क्या सचमुच?”


    यूसुफ ने उससे कहा, “आओ और देखो।”


    और दाई उसके साथ चली गई।


    (2) वे गुफा के सामने खड़े हुए, और एक चमकीले बादल ने गुफा को अपनी छाया में ढक लिया। दाई ने कहा, “आज मेरा प्राण महान हुआ है, क्योंकि मेरी आँखों ने एक अद्भुत बात देखी है—इस्राएल के लिए उद्धार ने जन्म लिया है!”[b]


    तुरंत बादल गुफा से हट गया, और गुफा में एक बड़ा प्रकाश प्रकट हुआ, जिसे उनकी आँखें सह नहीं सकीं। थोड़ी देर बाद प्रकाश हट गया, और एक शिशु दिखाई दिया। उसने अपनी माता मरियम का स्तन मुँह में लिया।[c]


    दाई पुकार उठी, “आज का दिन मेरे लिए कितना महान है, क्योंकि मैंने यह नया चमत्कार देखा है!”


    (3) दाई गुफा से बाहर निकली, और सलोमी उससे मिली।


    दाई ने उससे कहा, “सलोमी, सलोमी, मुझे तुम्हें एक नया दृश्य बताना है: एक कुँवारी ने जन्म दिया है—यह उसकी प्रकृति के विरुद्ध है!”[d]


    सलोमी ने कहा, “मेरे प्रभु परमेश्वर के जीवन की शपथ, जब तक मैं उसकी अवस्था की जाँच न कर लूँ, तब तक मैं विश्वास नहीं करूँगी कि कुँवारी ने जन्म दिया है।”[e]'
