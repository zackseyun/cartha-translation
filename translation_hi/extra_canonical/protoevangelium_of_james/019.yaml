  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। संवाद में स्वाभाविकता के लिए ‘भले आदमी’, ‘क्या सचमुच?’ और ‘आओ और देखो’ अपनाए गए। कथात्मक पुनरावृत्ति और अध्याय की चमत्कारिक छवियाँ सुरक्षित रखी गई हैं। यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण पाठ को प्रकाशन-पूर्व अस्थायी मसौदा माना जाए।
