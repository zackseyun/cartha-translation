  source_fidelity: 'मसौदा उपलब्ध अंग्रेज़ी साक्ष्य के कथानक और जानबूझकर रखी गई अस्पष्टताओं को अधिकांशतः ठीक सुरक्षित रखता है। फिर भी कुछ स्थानों पर अर्थ या दृश्य-क्रम अधिक सटीक किया गया है: ‘Are you from Israel?’ को ‘क्या तुम इस्राएली हो?’; प्रकाश के सामने आँखों का न ठहर पाना; प्रकाश के हटने के बाद शिशु का प्रकट होना; और शिशु का माता के स्तन को ग्रहण करना, जिसे केवल ‘पीने लगा’ कहना कुछ अधिक स्पष्ट करता था। प्रत्यक्ष यूनानी पांडुलिपि-समीक्षा लंबित होने के कारण यह समीक्षा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के विरुद्ध है।'
