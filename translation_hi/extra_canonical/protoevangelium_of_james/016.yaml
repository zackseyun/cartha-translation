translation:
  language: hi
  text: '(1) तब याजक ने कहा, “जिस कुँवारी को तुम प्रभु के मंदिर से ले गए थे, उसे लौटा दो।”


    और यूसुफ की आँखों में आँसू थे।


    तब प्रधान याजक ने कहा, “मैं तुम्हें प्रभु की फटकार का जल पीने को दूँगा, और वह तुम्हारा पाप तुम्हारी आँखों के सामने प्रकट कर देगा।”


    (2) तब याजक ने वह जल लेकर यूसुफ को दिया और उसे निर्जन प्रदेश में भेज दिया। यूसुफ सकुशल लौट आया।


    फिर उसने वह जल मरियम को दिया और उसे निर्जन प्रदेश में भेज दिया। वह भी सकुशल लौट आई।


    और सभी लोग चकित हुए कि उनका पाप प्रकट नहीं हुआ।


    (3) तब याजक ने कहा, “यदि प्रभु परमेश्वर ने तुम्हारा पाप प्रकट नहीं किया, तो मैं भी तुम्हें दोषी नहीं ठहराता।” और उसने उन्हें छोड़ दिया।


    तब यूसुफ मरियम को लेकर अपने घर चला गया। वह आनन्दित था और इस्राएल के परमेश्वर की महिमा कर रहा था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: priest / chief priest
  choice: याजक / प्रधान याजक
  rationale: दोनों पदनामों का भेद बनाए रखा गया है; ‘याजक’ और ‘प्रधान याजक’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण हैं।
- source_word: virgin
  choice: कुँवारी
  rationale: यह मरियम की सामाजिक और शारीरिक स्थिति से जुड़ी कथा की शब्दावली को सीधे रखता है; ‘कुमारी’ की अपेक्षा ‘कुँवारी’ यहाँ अधिक स्वाभाविक है।
- source_word: water of the Lord’s rebuke
  choice: प्रभु की फटकार का जल
  rationale: असामान्य विधिक-धार्मिक पदबंध को समझाकर सामान्य बनाने के बजाय उसकी कठोरता और अस्पष्टता सुरक्षित रखी गई है।
- source_word: wilderness
  choice: निर्जन प्रदेश
  rationale: ‘जंगल’ आवश्यकतः वन का संकेत दे सकता है; ‘निर्जन प्रदेश’ वीरान या आबादी से दूर स्थान का व्यापक अर्थ व्यक्त करता है।
- source_word: unharmed
  choice: सकुशल
  rationale: परीक्षा के बाद किसी हानि या दण्ड के बिना लौटने का आशय सहज हिन्दी में व्यक्त होता है।
- source_word: judge
  choice: दोषी ठहराता
  rationale: संदर्भ न्यायिक निर्णय का है; केवल ‘न्याय करता’ की तुलना में यह अभिप्राय अधिक स्पष्ट करता है।
theological_decisions:
- issue: ‘उनका पाप’ का कथात्मक प्रयोग, जबकि परीक्षा में दोष सिद्ध नहीं होता
  choice: उनका पाप प्रकट नहीं हुआ
  alternative: उनमें कोई पाप नहीं पाया गया
  rationale: मूल साक्ष्य का कथन आरोपित पाप के प्रकट न होने पर बल देता है; अनुवाद ने इसे निर्दोषता की अधिक स्पष्ट घोषणा में नहीं बदला।
- issue: परीक्षा के जल की प्रकृति
  choice: प्रभु की फटकार का जल
  alternative: प्रभु के न्याय की परीक्षा का जल
  rationale: व्याख्यात्मक धार्मिक शब्दावली जोड़ने से बचते हुए साक्ष्य की विचित्र और तनावपूर्ण अभिव्यक्ति बनाए रखी गई है।
- issue: याजक का अंतिम निर्णय
  choice: मैं भी तुम्हें दोषी नहीं ठहराता
  alternative: मैं भी तुम्हारा न्याय नहीं करता
  rationale: यह न्यायिक मुक्ति को स्वाभाविक हिन्दी में व्यक्त करता है, पर परमेश्वर द्वारा पाप प्रकट न किए जाने और मानवीय निर्णय के बीच मूल संबंध को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। वाक्यों की पुनरावृत्तिमूलक प्राचीन शैली को अधिकांशतः बनाए रखते हुए कुछ स्थानों पर सहज प्रवाह दिया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी शेष होने के कारण यह प्रकाशन-पूर्व अस्थायी, स्रोत-सचेत मसौदा है।
