  revised_text: '(1) दिन-प्रतिदिन बच्ची और मज़बूत होती गई। जब वह छह महीने की हुई, तो उसकी माँ ने यह देखने के लिए कि वह खड़ी रह सकती है या नहीं, उसे भूमि पर खड़ा किया। वह सात कदम चलकर अपनी माँ के स्तन तक आई। उसकी माँ ने उसे उठा लिया और कहा, “जैसा कि प्रभु, मेरा परमेश्वर, जीवित है, जब तक मैं तुझे प्रभु के मन्दिर में न ले जाऊँ, तब तक तू फिर इस भूमि पर नहीं चलेगी।”


    फिर उसने अपने शयनकक्ष में एक पवित्र स्थान बनाया और किसी भी अपवित्र या अशुद्ध वस्तु को उसमें प्रवेश नहीं करने दिया। उसने इब्रानियों की शुद्ध कन्याओं को बुलाया, और वे उसके साथ खेलती थीं।


    (2) जब बच्ची एक वर्ष की हुई, तब योआकीम ने एक बड़ा भोज किया और प्रधान याजकों, याजकों, शास्त्रियों, बुज़ुर्गों और इस्राएल के सभी लोगों को बुलाया। योआकीम बच्ची को याजकों के पास ले गया, और उन्होंने उसे आशीर्वाद देते हुए कहा, “हमारे पूर्वजों के परमेश्वर, इस बच्ची को आशीष दे और इसे ऐसा नाम दे जिसका उल्लेख सभी पीढ़ियों में सदा होता रहे।”


    सभी लोगों ने कहा, “ऐसा ही हो। आमीन!”


    फिर वे उसे प्रधान याजकों के पास ले गए, और उन्होंने उसे आशीर्वाद देते हुए कहा, “हे परमप्रधान परमेश्वर, इस बच्ची पर दृष्टि कर और इसे ऐसी अन्तिम आशीष दे जिसे कोई पार न कर सके।”[a]


    (3) उसकी माँ उसे अपने शयनकक्ष के पवित्र स्थान में ले गई और उसे दूध पिलाया। तब अन्ना ने प्रभु परमेश्वर के लिए एक गीत गाया और कहा:


    “मैं प्रभु, अपने परमेश्वर, के लिए एक पवित्र गीत गाऊँगी,


    क्योंकि परमेश्वर ने मेरी सुधि ली है


    और मेरे शत्रुओं की निन्दा दूर कर दी है।


    “प्रभु परमेश्वर ने मुझे परमेश्वर के न्याय का फल दिया है—


    जो परमेश्वर के सामने एक होते हुए भी अनेक है।[b]


    “रूबेल के लोगों को कौन बताएगा कि अन्ना बच्चे को दूध पिला रही है?


    ‘सुनो, सुनो, हे इस्राएल के बारह गोत्रो:


    अन्ना बच्चे को दूध पिला रही है!’”[c]


    अन्ना अपने शयनकक्ष के पवित्र स्थान में विश्राम करती रही। फिर वह जाकर उनकी सेवा करने लगी। भोजन समाप्त होने पर वे आनन्द मनाते और इस्राएल के परमेश्वर की महिमा करते हुए नीचे उतर गए।'
