  text: '(1) Day by day, the child grew stronger. When she was six months old, her mother stood her on the ground to see whether she could stand. She walked seven steps and came to her mother’s breast. Her mother picked her up and said, “As the Lord my God lives, you will not walk on this ground again until I bring you into the Temple of the Lord.”


    She made a sanctuary in her bedroom and did not allow anything sacrilegious or impure to pass through it. She called the pure daughters of the Hebrews, and they played with her.


    (2) When the child became one year old, Joachim held a great feast and invited the chief priests, the priests, the scribes, the elders, and all the people of Israel. Joachim brought the child to the priests, and they blessed her, saying, “God of our ancestors, bless this child and give her a name that will be spoken forever among all generations.”


    All the people said, “So be it. Amen!”


    They brought her to the chief priests, and they blessed her, saying, “Most High God, look upon this child and bless her with a final blessing that cannot be surpassed.”


    (3) Her mother took her up to the sanctuary of her bedroom and nursed the child. Anna made a song to the Lord God, saying:


    “I will sing a holy song to the Lord my God, because God has visited me and removed the criticism of my enemies.


    “And the Lord God has given me the fruit of God’s justice, singular yet manifold before God.


    “Who will report to Reubel’s people that Anna nurses a child? ‘Listen, listen, twelve tribes of Israel: Anna nurses a child!’”


    Anna rested in the sanctuary of her bedroom. Then she went and ministered to them. When dinner was over, they went down rejoicing and glorifying the God of Israel.'
translation:
  language: hi
  text: '(1) वह बच्ची दिन-प्रतिदिन बलवती होती गई। जब वह छह महीने की हुई, तो उसकी माँ ने यह देखने के लिए उसे भूमि पर खड़ा किया कि क्या वह खड़ी रह सकती है। वह सात कदम चलकर अपनी माँ की छाती से आ लगी। उसकी माँ ने उसे गोद में उठा लिया और कहा, “जीवित प्रभु, मेरे परमेश्वर की शपथ, जब तक मैं तुझे प्रभु के मन्दिर में न ले जाऊँ, तब तक तू फिर इस भूमि पर नहीं चलेगी।”


    फिर उसने अपने शयनकक्ष में एक पवित्र स्थान बनाया और किसी भी अपवित्र या अशुद्ध वस्तु को उसमें से होकर जाने नहीं दिया। उसने इब्रानियों की शुद्ध कन्याओं को बुलाया, और वे उसके साथ खेलती थीं।


    (2) जब बच्ची एक वर्ष की हुई, तब योआकीम ने एक बड़ा भोज दिया और प्रधान याजकों, याजकों, शास्त्रियों, पुरनियों और इस्राएल के सभी लोगों को बुलाया। योआकीम बच्ची को याजकों के पास ले गया, और उन्होंने उसे आशीर्वाद देते हुए कहा, “हमारे पूर्वजों के परमेश्वर, इस बच्ची को आशीष दे और इसे ऐसा नाम दे जिसका उल्लेख पीढ़ी-दर-पीढ़ी सदा होता रहे।”


    सभी लोगों ने कहा, “ऐसा ही हो। आमीन!”


    फिर वे उसे प्रधान याजकों के पास ले गए, और उन्होंने उसे आशीर्वाद देते हुए कहा, “हे परमप्रधान परमेश्वर, इस बच्ची पर दृष्टि कर और इसे ऐसी परम आशीष दे जिससे बढ़कर कोई आशीष न हो।”[a]


    (3) उसकी माँ उसे अपने शयनकक्ष के पवित्र स्थान में ले गई और उसे दूध पिलाया। तब अन्ना ने प्रभु परमेश्वर के लिए एक गीत रचा और कहा:


    “मैं प्रभु, अपने परमेश्वर के लिए एक पवित्र गीत गाऊँगी,

    क्योंकि परमेश्वर ने मेरी सुधि ली है

    और मेरे शत्रुओं का ताना दूर कर दिया है।


    “प्रभु परमेश्वर ने मुझे अपनी धार्मिकता का फल दिया है—

    उसके सामने वह एक है, फिर भी अनेक रूपों में फलदायी है।[b]


    “रूबेल के लोगों को कौन बताएगा कि अन्ना बच्चे को दूध पिला रही है?

    ‘सुनो, सुनो, हे इस्राएल के बारह गोत्रो:

    अन्ना बच्चे को दूध पिला रही है!’”[c]


    फिर अन्ना ने बच्ची को अपने शयनकक्ष के पवित्र स्थान में विश्राम कराया और बाहर जाकर अतिथियों की सेवा की। भोजन समाप्त होने पर वे आनन्द मनाते और इस्राएल के परमेश्वर की महिमा करते हुए वहाँ से नीचे उतर गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “अन्तिम/पूर्ण आशीष, जिससे बढ़कर कोई न हो।” यहाँ आशय सम्भवतः सर्वोच्च या परिपूर्ण आशीष है।'
    reason: ‘final blessing’ का शब्दार्थ हिन्दी में भ्रामक हो सकता है और यूनानी समीक्षा अभी लंबित है।
  - marker: b
    text: “एक है, फिर भी अनेक” वाला वाक्य पाठ और अर्थ की दृष्टि से कठिन है। अनुवाद ने उसके काव्यात्मक विरोधाभास को बनाए रखा है।
    reason: अस्पष्ट source construction को किसी एक धर्मवैज्ञानिक व्याख्या में सीमित करने से बचना।
  - marker: c
    text: “रूबेल” नाम उपलब्ध अंग्रेज़ी साक्ष्य के अनुसार रखा गया है; सम्भव है कि यह “रूबेन” या किसी अन्य पाठ-रूप का संकेत हो।
    reason: नाम का स्रोत-पाठ संदिग्ध है और प्रत्यक्ष यूनानी समीक्षा लंबित है।
lexical_decisions:
- source_word: sanctuary
  choice: पवित्र स्थान
  rationale: शयनकक्ष के भीतर अलग किए गए पवित्र क्षेत्र का अर्थ सहज हिन्दी में व्यक्त होता है; ‘पवित्रस्थान’ से मन्दिर के तकनीकी भाग का अनचाहा संकेत हो सकता था।
- source_word: sacrilegious or impure
  choice: अपवित्र या अशुद्ध
  rationale: दोनों निकटार्थी धार्मिक श्रेणियों को अलग रखा गया है; पहले में पवित्रता का उल्लंघन और दूसरे में अशुद्धता का भाव है।
- source_word: visited me
  choice: मेरी सुधि ली है
  rationale: यहाँ ईश्वरीय हस्तक्षेप और कृपापूर्ण ध्यान का मुहावरेदार बाइबलीय अर्थ है, केवल शारीरिक भेंट नहीं।
- source_word: criticism
  choice: ताना
  rationale: निःसंतानता को लेकर विरोधियों की निन्दा या धिक्कार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: final blessing
  choice: परम आशीष
  rationale: अंग्रेज़ी witness का ‘final’ सम्भवतः पूर्ण या चरम आशीष का भाव देता है; ‘अन्तिम आशीष’ मृत्यु-संबंधी अर्थ दे सकती थी।
- source_word: ministered to them
  choice: अतिथियों की सेवा की
  rationale: भोज के प्रसंग में सामान्य आतिथ्य-सेवा अभिप्रेत है; इसे धार्मिक पद-सेवा के रूप में नहीं पढ़ा गया।
theological_decisions:
- issue: बालिका के लिए बनाया गया ‘sanctuary’
  choice: पवित्र स्थान
  alternative: पवित्रस्थान / मन्दिर
  rationale: कथा उसे घर के शयनकक्ष के भीतर निर्धारित पवित्र क्षेत्र बताती है; उसे औपचारिक मन्दिर या मन्दिर के गर्भगृह के समान नहीं बनाया गया।
- issue: ‘fruit of God’s justice’
  choice: अपनी धार्मिकता का फल
  alternative: अपने न्याय का फल
  rationale: मूल यूनानी की प्रत्यक्ष समीक्षा लंबित होने के कारण witness की theological ambiguity को यथासम्भव रखा गया है; ‘धार्मिकता’ ईश्वरीय उचित कार्य और अनुग्रहपूर्ण प्रतिफल दोनों को समेट सकती है।
- issue: ‘singular yet manifold before God’
  choice: उसके सामने वह एक है, फिर भी अनेक रूपों में फलदायी है
  alternative: एक, फिर भी परमेश्वर के सामने अनेक
  rationale: अस्पष्ट काव्यात्मक विरोधाभास को किसी विशिष्ट मरियम-संबंधी सिद्धान्त में हल नहीं किया गया; पठनीयता के लिए सीमित रूप से ‘फलदायी’ जोड़ा गया है और पादटिप्पणी में अनिश्चितता दर्ज है।
- issue: परम आशीष की प्रकृति
  choice: ऐसी परम आशीष ... जिससे बढ़कर कोई आशीष न हो
  alternative: अन्तिम आशीष जिसे पार न किया जा सके
  rationale: इसे मृत्यु के समय दी जाने वाली आशीष या किसी सम्प्रदायगत निष्कर्ष से जोड़ने के बजाय अतिशयोक्तिपूर्ण सर्वोच्च आशीष के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। कथा में सरल भूतकाल और गीत में काव्यात्मक पंक्ति-विन्यास रखा गया है। ‘तू/तुझे’ माँ द्वारा शिशु को आत्मीय सम्बोधन के रूप में प्रयुक्त है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पाण्डुलिपि-परम्परा की प्रत्यक्ष समीक्षा लंबित होने के कारण कठिन पदों पर पादटिप्पणियाँ दी गई हैं।
