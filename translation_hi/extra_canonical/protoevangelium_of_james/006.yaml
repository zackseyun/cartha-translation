  source_fidelity: 'अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य के विरुद्ध कथा का अधिकांश भाग निकट और विश्वसनीय है। फिर भी कुछ स्थानों पर अर्थ जोड़ा या बदला गया है: शपथ-वाक्य में “जीवित प्रभु, मेरे परमेश्वर की शपथ” स्रोत के “As the Lord my God lives” का स्वाभाविक और सटीक रूप नहीं है; गीत में “फलदायी” स्रोत में नहीं है; और अन्त में अन्ना द्वारा बच्ची को विश्राम कराने तथा ‘अतिथियों’ की सेवा करने की बातें स्रोत के अस्पष्ट सर्वनामों को अनुचित रूप से निश्चित करती हैं। प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण कठिन काव्य-पंक्ति और ‘रूबेल’ को अनिश्चितता सहित रखा गया है।'
