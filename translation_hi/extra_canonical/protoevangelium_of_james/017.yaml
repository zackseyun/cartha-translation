  language: hi
  text: '**याकूब का आदिसुसमाचार — अध्याय 17: जनगणना**


    **(1)** तब राजा औगुस्तुस की ओर से यह आदेश निकला कि यहूदिया के बैतलहम में रहनेवाले सभी लोगों का पंजीकरण किया जाए।


    यूसुफ ने कहा, “मैं अपने बेटों का पंजीकरण कराऊँगा। पर इस बालिका के विषय में क्या करूँ? इसका पंजीकरण किस रूप में कराऊँ? अपनी पत्नी के रूप में? मुझे लज्जा आती है। अपनी बेटी के रूप में? पर इस्राएल के लोग जानते हैं कि यह मेरी बेटी नहीं है। यह प्रभु का दिन है; प्रभु जो चाहेगा, मैं वही करूँगा।”


    **(2)** फिर उसने गधे पर काठी बाँधी और मरियम को उस पर बैठाया। उसका बेटा गधे को आगे ले चला और शमूएल पीछे-पीछे चला।


    जब वे तीसरे मील के निकट पहुँचे, तो यूसुफ ने मुड़कर देखा कि मरियम उदास थी। वह मन में कह रहा था, “शायद उसके भीतर जो है, वही उसे व्याकुल कर रहा है।”


    यूसुफ ने फिर मुड़कर देखा तो वह हँस रही थी। उसने उससे कहा, “मरियम, तुम्हें क्या हो रहा है? मैं कभी तुम्हारे चेहरे को हँसता हुआ देखता हूँ और फिर उदास।”


    उसने उससे कहा, “ऐसा इसलिए है कि मैं अपनी आँखों में दो समुदायों को देख रही हूँ:[a] एक रो रहा और विलाप कर रहा है, और दूसरा आनन्द मना रहा और उल्लसित हो रहा है।”


    **(3)** जब वे यात्रा के बीच में पहुँचे, तो मरियम ने उससे कहा, “यूसुफ, मुझे गधे से नीचे उतारो, क्योंकि मेरे भीतर जो है, वह बाहर आने के लिए जोर लगा रहा है।”


    उसने मरियम को गधे से नीचे उतारा और उससे कहा, “इस दशा में[b] मैं तुम्हें कहाँ ले जाऊँ और कहाँ आश्रय दूँ? यह तो निर्जन स्थान है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “मैं अपनी आँखों में दो जनसमुदायों को देखती हूँ।” यह असामान्य अभिव्यक्ति जानबूझकर बिना व्याख्या के रखी गई है।'
    reason: मूल अभिव्यक्ति की असामान्यता और सम्भावित प्रतीकात्मक अर्थ को सुरक्षित रखना।
  - marker: b
    text: यहाँ प्रयुक्त अभिव्यक्ति प्रसव के समय की असहज, उजागर या लोकलज्जाजनक दशा की ओर संकेत कर सकती है।
    reason: स्रोत पद का अर्थ-क्षेत्र किसी एक हिन्दी शब्द—जैसे ‘लज्जा’, ‘असहायता’ या ‘कठिनाई’—से अधिक व्यापक है।
lexical_decisions:
- source_word: ἀπογράφεσθαι / register (witness wording)
  choice: पंजीकरण किया जाए
  rationale: यह प्रशासनिक नाम-दर्ज प्रक्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; संदर्भ जनगणना का है, पर क्रिया केवल गिनती से अधिक पंजीकरण का भाव रखती है।
- source_word: παιδίσκη / this child (witness wording)
  choice: इस बालिका
  rationale: यूसुफ के प्रश्न में मरियम के सामाजिक और पारिवारिक दर्जे का विषय है; ‘बालिका’ लिंग और आश्रित स्थिति दोनों स्पष्ट करता है, बिना उसे बेटी ठहराए।
- source_word: δύο λαούς / two peoples
  choice: दो समुदायों
  rationale: ‘लोगों के दो समूह’ या ‘दो जनसमुदाय’ का सामूहिक अर्थ बनाए रखता है। ‘दो व्यक्ति’ कहना सम्भावित मूल सामूहिक अर्थ को संकुचित कर देता।
- source_word: ἔρημός / wilderness
  choice: निर्जन स्थान
  rationale: प्रसंग में बसाहट और आश्रय से दूर स्थान अभिप्रेत है; ‘जंगल’ अनावश्यक रूप से वृक्षाच्छादित भूभाग का बोध करा सकता है।
- source_word: ἀσχημοσύνη / awkwardness (witness wording)
  choice: इस दशा में
  rationale: प्रसव की निकट अवस्था से जुड़ी असहजता, असुरक्षा या लोकलज्जा को किसी एक अर्थ तक सीमित किए बिना स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: “यह प्रभु का दिन है” का अर्थ
  choice: वाक्य को ज्यों का त्यों खुला रखा गया
  alternative: इसे ‘आज प्रभु ही निर्णय करेगा’ या अन्तकालीन ‘प्रभु का दिन’ के रूप में स्पष्ट करना
  rationale: यह कथन दैवी मार्गदर्शन, विशेष अवसर अथवा धार्मिक पदबंध—एक से अधिक संकेत दे सकता है; अनुवाद ने किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया।
- issue: मरियम द्वारा देखे गए ‘दो समुदाय’
  choice: दर्शन को बिना पहचान बताए रखा गया
  alternative: उन्हें इस्राएल और अन्यजातियों, अथवा विश्वासियों और अविश्वासियों के रूप में पहचानना
  rationale: पाठ स्वयं इस अध्याय में उनकी पहचान नहीं बताता; बाद की व्याख्या को मुख्य पाठ में लाना उचित नहीं।
- issue: “मेरे भीतर जो है”
  choice: अजन्मे शिशु का नाम या उपाधि जोड़े बिना मूल परोक्ष अभिव्यक्ति रखी गई
  alternative: ‘मेरे गर्भ का बालक’ या ‘यीशु’
  rationale: कथाकार की रहस्यपूर्ण और परोक्ष भाषा तथा दृश्य का तनाव सुरक्षित रहता है।
