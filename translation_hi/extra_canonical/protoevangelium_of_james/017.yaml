  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप—यूसुफ, मरियम, इस्राएल, बैतलहम और शमूएल—लिए गए हैं। छोटे वाक्य और प्रत्यक्ष संवाद साधारण पाठक के लिए सहज रखे गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है और प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित है; इसलिए अस्पष्ट स्थलों को निर्णायक ढंग से नहीं सुलझाया गया।
