  footnotes:
  - marker: a
    text: यहाँ बच्चे की ‘सेवा’ किस विशिष्ट रूप में होगी, पाठ इस अध्याय में नहीं बताता।
    reason: बाद की धार्मिक संस्थाओं या परंपराओं को अनुवाद में आरोपित करने से बचाना।
  - marker: b
    text: उपलब्ध अंग्रेज़ी साक्ष्य में पहले गर्भधारण भविष्य में होने की बात है, जबकि यहाँ अन्ना के गर्भधारण कर चुकने की सूचना दी गई है; यह क्रम अनुवाद में यथावत रखा गया है।
    reason: स्रोत में विद्यमान कालगत तनाव को स्पष्ट करते हुए सुरक्षित रखना।
  - marker: c
    text: ‘विधवा’ शब्द यहाँ तब कहा गया है जब योआकीम जीवित लौट रहा है; संभवतः यह उसके अभाव में अन्ना की दशा को प्रभावपूर्ण ढंग से व्यक्त करता है।
    reason: असामान्य कथन को चुपचाप सामान्यीकृत न करना।
