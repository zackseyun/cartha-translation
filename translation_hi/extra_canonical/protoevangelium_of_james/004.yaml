- issue: अन्ना के गर्भधारण की कालगत स्थिति
  choice: स्वर्गदूत के कथन में भविष्यकाल और बाद के समाचार में पूर्ण गर्भधारण—दोनों को यथावत रखा गया
  alternative: सभी कथनों को एक ही काल में समरूप करना
  rationale: वर्णन में मौजूद तनाव या घटनाक्रम को संपादकीय रूप से समाप्त नहीं किया गया।
- issue: ‘विधवा’ का कथन जबकि योआकीम जीवित है
  choice: रूपकात्मक या सामाजिक स्थिति का स्पष्टीकरण जोड़े बिना ‘विधवा’ रखा गया
  alternative: ‘विधवा-समान’ या ‘पति से वंचित’ करना
  rationale: पाठ की तीखी और संभवतः अलंकारिक भाषा को संरक्षित किया गया।
