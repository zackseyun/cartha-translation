  choice: जो निःसंतान थी
  rationale: शाब्दिक देहगत वाक्यांश के आशय को सहज हिन्दी में व्यक्त करता है; गर्भधारण की अगली क्रिया विरोधाभास को स्पष्ट रखती है।
