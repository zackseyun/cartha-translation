- issue: अन्ना द्वारा बच्चे को प्रभु को भेंट करने और जीवन भर सेवा करने की प्रतिज्ञा
  choice: समर्पण और सेवा की भाषा को बिना किसी बाद की संस्थागत व्याख्या के रखा गया
