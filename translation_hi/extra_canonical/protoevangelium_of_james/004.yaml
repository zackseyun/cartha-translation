    (4) देखो! योआकीम अपने पशुओं के झुंडों के साथ आया, और अन्ना फाटक पर खड़ी थी। जब उसने योआकीम को झुंडों के साथ आते देखा, तो वह तुरंत दौड़ी और उसके गले से लिपटकर कहने लगी, “अब मैं जान गई हूँ कि प्रभु परमेश्वर ने मुझे बहुत आशीष दी है। क्योंकि देखो! जो विधवा थी, वह अब विधवा नहीं रही; और देखो! जो संतानहीन थी, उसने गर्भधारण किया है।”[c]


