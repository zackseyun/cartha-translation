  yaml_path: translation/extra_canonical/protoevangelium_of_james/004.yaml
  text: '(1) Look! An angel of the Lord stood nearby and said to her, “Anna, Anna, the Lord has heard your prayer. You will conceive and give birth, and your offspring will be spoken of throughout the whole world.”


    Anna said, “As the Lord God lives, whether I give birth to a boy or a girl, I will bring the child as a gift to the Lord my God, and the child will minister to him all the days of its life.”


    (2) Look! Two angels came and said to her, “Look, your husband Joachim is coming with his flocks.” For an angel of the Lord had gone down to Joachim and said, “Joachim, Joachim, the Lord God has heard your prayer. Go down from here. Look, your wife Anna has conceived in her womb.”


    (3) Joachim immediately went down and called the shepherds. He said to them, “Bring me ten lambs without spot or blemish, and the ten lambs will be for the Lord God. Bring me twelve tender calves for the priests and the elders, and one hundred male goats for all the people.”


    (4) Look! Joachim came with his flocks, and Anna stood at the gate. When she saw Joachim coming with his flocks, she immediately ran and threw her arms around his neck, saying, “Now I know that the Lord God has greatly blessed me. For look! The widow is no longer a widow, and look! The one without a child in her womb has conceived.”


    Joachim rested in his house for the first day.'
translation:
  language: hi
  text: '(1) देखो! प्रभु का एक स्वर्गदूत उसके पास आ खड़ा हुआ और उससे कहने लगा, “अन्ना, अन्ना, प्रभु ने तुम्हारी प्रार्थना सुन ली है। तुम गर्भधारण करोगी और बच्चे को जन्म दोगी, और तुम्हारी संतान की चर्चा सारे संसार में होगी।”


    अन्ना ने कहा, “जीवित प्रभु परमेश्वर की शपथ, चाहे मैं लड़के को जन्म दूँ या लड़की को, मैं उस बच्चे को अपने प्रभु परमेश्वर के लिए भेंट के रूप में अर्पित करूँगी, और वह जीवन भर उसकी सेवा करेगा।”[a]


    (2) देखो! दो स्वर्गदूत उसके पास आए और उससे कहने लगे, “देखो, तुम्हारा पति योआकीम अपने पशुओं के झुंडों के साथ आ रहा है।” क्योंकि प्रभु का एक स्वर्गदूत योआकीम के पास उतरकर गया था और उससे कहा था, “योआकीम, योआकीम, प्रभु परमेश्वर ने तुम्हारी प्रार्थना सुन ली है। यहाँ से नीचे जाओ। देखो, तुम्हारी पत्नी अन्ना ने अपने गर्भ में गर्भधारण किया है।”[b]


    (3) योआकीम तुरंत नीचे गया और चरवाहों को बुलाकर उनसे कहा, “मेरे पास दस ऐसे मेमने लाओ जिनमें कोई दाग या दोष न हो; ये दस मेमने प्रभु परमेश्वर के लिए होंगे। याजकों और पुरनियों के लिए बारह कोमल बछड़े और सब लोगों के लिए एक सौ बकरे भी लाओ।”


    (4) देखो! योआकीम अपने पशुओं के झुंडों के साथ आया, और अन्ना फाटक पर खड़ी थी। जब उसने योआकीम को झुंडों के साथ आते देखा, तो वह तुरंत दौड़ी और उसके गले से लिपटकर कहने लगी, “अब मैं जान गई हूँ कि प्रभु परमेश्वर ने मुझे बहुत आशीष दी है। क्योंकि देखो! जो विधवा थी, वह अब विधवा नहीं रही; और देखो! जो निःसंतान थी, उसने गर्भधारण किया है।”[c]


    उस पहले दिन योआकीम ने अपने घर में विश्राम किया।'
