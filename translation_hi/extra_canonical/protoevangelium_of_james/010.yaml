base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/010.yaml
  text: '(1) A council of the priests met and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Call the pure virgins from the tribe of David to me.” The officers went out and searched, and they found seven. Then the priest remembered that the child Mary was from the tribe of David and was pure before God. So the officers went out and brought her.


    (2) They brought them into the Temple of the Lord, and the priest said, “Cast lots for me to determine who will spin the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    The lot for the true purple and the scarlet fell to Mary, and she took them to her house. This was when Zechariah became silent, and Samuel took his place until Zechariah could speak. Mary took the scarlet and was spinning it.'
translation:
  language: hi
  text: '(1) याजकों की एक सभा हुई। वे कहने लगे, “आओ, हम प्रभु के मंदिर के लिए एक परदा बनाएँ।”


    याजक ने कहा, “दाऊद के गोत्र की शुद्ध कुँवारियों को मेरे पास बुलाओ।” अधिकारी बाहर गए, उन्होंने खोज की और सात कुँवारियाँ पाईं। तब याजक को याद आया कि बालिका मरियम भी दाऊद के गोत्र की थी और परमेश्वर के सामने शुद्ध थी। अधिकारी गए और उसे भी ले आए।


    (2) वे उन सबको प्रभु के मंदिर में ले आए। याजक ने कहा, “मेरे सामने चिट्ठियाँ डालो, ताकि तय हो कि सोने का धागा, सफेद धागा, सन, रेशम, बैंगनी, लाल और असली बैंजनी रंग का धागा कौन कातेगी।”[a]


    असली बैंजनी और लाल रंग के धागे की चिट्ठी मरियम के नाम निकली। वह उन्हें अपने घर ले गई। यह वही समय था जब जकरयाह की वाणी बंद हो गई थी, और उसके फिर से बोल सकने तक शमूएल ने उसका स्थान लिया था।[b] मरियम ने लाल रंग का धागा लिया और उसे कातने लगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ वस्तुओं और रंगों की सूची दिए गए अंग्रेज़ी साक्ष्य के अनुसार रखी गई है। यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित है; विशेषकर “सोना,” “सफेद,” “सन,” “बैंगनी” और “असली बैंजनी” संभवतः धागों, रेशों, कपड़ों या रंगों के तकनीकी नाम हो सकते हैं।
    reason: उपलब्ध आधार प्रत्यक्ष यूनानी पाठ नहीं है और प्राचीन वस्त्र-शब्दावली की सटीक पहचान अनिश्चित है।
  - marker: b
    text: यह शमूएल कौन था और उसने जकरयाह का कौन-सा पद संभाला, यह इस अंश में स्पष्ट नहीं किया गया है।
    reason: पाठ की वास्तविक अस्पष्टता को सुरक्षित रखने और अनावश्यक ऐतिहासिक या याजकीय पहचान आरोपित करने से बचने के लिए।
lexical_decisions:
- source_word: veil
  choice: परदा
  rationale: मंदिर के संदर्भ में स्वाभाविक और व्यापक रूप से समझा जाने वाला शब्द; कपड़े के विभाजक आवरण का अर्थ बनाए रखता है।
- source_word: pure virgins
  choice: शुद्ध कुँवारियाँ
  rationale: पवित्रता और अविवाहित कौमार्य—दोनों अलग धारणाओं को बिना मिलाए सुरक्षित रखता है।
- source_word: tribe of David
  choice: दाऊद का गोत्र
  rationale: वंशगत/इस्राएली संबद्धता के लिए स्थापित बाइबलीय शब्दावली।
- source_word: spin
  choice: कातना
  rationale: रेशे या धागे तैयार करने की प्राचीन वस्त्र-निर्माण क्रिया का सटीक और सहज हिन्दी रूप।
- source_word: linen
  choice: सन
  rationale: वस्त्र-सामग्री के रूप में लिनन के मूल पौध-रेशे को दर्शाता है और इसे केवल रंग मानने से बचाता है।
- source_word: violet
  choice: बैंगनी
  rationale: दिए गए साक्ष्य में अलग रंग-श्रेणी के रूप में आए violet को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: scarlet
  choice: लाल
  rationale: चमकीले लाल रंग का सरल, सामान्य रूप; स्रोत-समीक्षा लंबित होने के कारण अधिक विशिष्ट कृमिज या सिंदूरी पद आरोपित नहीं किया गया।
- source_word: true purple
  choice: असली बैंजनी
  rationale: violet से शब्दगत भेद दिखाने और witness के ‘true’ को सुरक्षित रखने हेतु ‘बैंगनी’ से भिन्न वर्तनी ‘बैंजनी’ अपनाई गई; सटीक यूनानी वस्त्र-रंग पद की समीक्षा अभी लंबित है।
- source_word: fell silent
  choice: वाणी बंद हो गई
  rationale: यह बताता है कि जकरयाह बोल नहीं पा रहा था, बिना उसकी स्थायी दशा या कारण पर अतिरिक्त व्याख्या जोड़े।
theological_decisions:
- issue: मरियम की ‘परमेश्वर के सामने शुद्ध’ स्थिति
  choice: परमेश्वर के सामने शुद्ध थी
  alternative: परमेश्वर की दृष्टि में पवित्र थी
  rationale: दिए गए साक्ष्य की न्यायिक/उपस्थितिगत अभिव्यक्ति को बनाए रखता है और बाद की किसी विशिष्ट मरियम-संबंधी धर्मसिद्धि को आरोपित नहीं करता।
- issue: जकरयाह की निःशब्दता
  choice: जकरयाह की वाणी बंद हो गई थी
  alternative: जकरयाह गूँगा हो गया था
  rationale: अस्थायी रूप से न बोल सकने की स्थिति व्यक्त होती है; व्यक्ति की पहचान को स्थायी अक्षमता के रूप में प्रस्तुत नहीं किया जाता।
- issue: शमूएल द्वारा स्थान लेना
  choice: शमूएल ने उसका स्थान लिया था
  alternative: शमूएल महायाजक बन गया था
  rationale: स्रोत-साक्ष्य केवल स्थान लेने की बात कहता है; पद, नियुक्ति या याजकीय श्रेणी के बारे में अतिरिक्त दावा नहीं जोड़ा गया।
