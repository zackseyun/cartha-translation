    reason: आपूर्ति किए गए अंग्रेज़ी साक्षी की असामान्य अभिव्यक्ति और संभावित अर्थ को सुरक्षित रखना।
  - marker: b
    text: “साक्षी” के लिए प्रयुक्त प्राचीन शब्द से ऐसा व्यक्ति भी अभिप्रेत हो सकता है जो अपनी गवाही के कारण मार डाला जाए; इसलिए अनुवाद “शहीद” भी संभव है।
    reason: ‘martyr’ में निहित साक्षी और मृत्यु—दोनों अर्थ-छायाओं को बिना एक को अंतिम ठहराए प्रस्तुत करना।
lexical_decisions:
- source_word: minister of God
  choice: परमेश्वर का सेवक
  rationale: ‘सेवक’ आधुनिक हिंदी में धार्मिक सेवा का स्वाभाविक और गरिमापूर्ण पद है; यह पदाधिकारी की ठीक-ठीक श्रेणी अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: I sit in God’s Temple
  choice: परमेश्वर के मंदिर में सेवा करता हूँ
  rationale: अंग्रेज़ी साक्षी के शाब्दिक ‘बैठता हूँ’ का आशय संभवतः मंदिर में पदस्थ या सेवारत होना है। हिंदी में ‘सेवा करता हूँ’ प्रसंग को स्वाभाविक बनाता है, जबकि पादरीय पद का अतिरिक्त दावा नहीं जोड़ता।
- source_word: martyr of God
  choice: परमेश्वर का साक्षी
  rationale: मूल परंपरा में ‘martyr’ का आधारभूत अर्थ ‘साक्षी’ है, पर प्रसंग मृत्यु तक की गवाही का है। मुख्य पाठ में ऐतिहासिक अर्थ रखा गया और अर्थ-तनाव को पादटिप्पणी में स्पष्ट किया गया।
- source_word: spirit
  choice: आत्मा
  rationale: व्यक्ति के उस अभौतिक जीवन-तत्त्व के लिए प्रचलित धर्मग्रंथीय हिंदी, जिसे प्रभु ग्रहण करता है।
- source_word: at the entrance of the Temple of the Lord
  choice: प्रभु के मंदिर के प्रवेश-द्वार पर
  rationale: स्थान-संबंधी कथन को स्पष्ट रखते हुए ‘entrance’ का सीधा और स्वाभाविक अनुवाद किया गया।
theological_decisions:
- issue: ज़करयाह द्वारा स्वयं को ‘martyr/witness of God’ कहना
  choice: परमेश्वर का साक्षी ठहरूँगा
  alternative: परमेश्वर का शहीद बनूँगा
  rationale: ‘शहीद’ मृत्यु का परिणाम अधिक प्रत्यक्ष करता है, जबकि प्राचीन शब्द में ‘साक्षी’ और मृत्यु दोनों की अर्थ-छायाएँ हो सकती हैं। इसलिए मुख्य पाठ ने आधारभूत अर्थ रखा और पादटिप्पणी ने घातक परिणाम बताया।
- issue: प्रभु द्वारा ज़करयाह की आत्मा ग्रहण करना
  choice: प्रभु मेरी आत्मा को ग्रहण करेगा
  alternative: प्रभु मेरे प्राण को स्वीकार करेगा
  rationale: आपूर्ति किए गए साक्षी की धार्मिक अभिव्यक्ति और उसके खुले अर्थ को बनाए रखा गया; मृत्यु के बाद की अवस्था का अतिरिक्त सिद्धांत नहीं जोड़ा गया।
- issue: यूहन्ना का इस्राएल का राजा बनना
  choice: उसका बेटा इस्राएल का राजा बनने वाला है
  alternative: उसका बेटा इस्राएल पर राज्य करने वाला है
  rationale: हेरोदेस की आशंका को कथन के रूप में ज्यों का त्यों रखा गया है; पाठ यह पुष्टि नहीं करता कि यह भविष्यवाणी सत्य है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-विन्यास में कथा की पुनरावृत्तिमूलक शैली को अधिकांशतः बनाए रखते हुए अत्यधिक अंग्रेज़ीपन से बचाया गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी अनुवाद है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है।
