translation:
  language: hi
  text: '(1) पर हेरोदेस ने यूहन्ना के विषय में पूछताछ की और अधिकारियों को ज़करयाह के पास यह कहने भेजा, “तुमने अपने बेटे को कहाँ छिपा रखा है?”


    उसने उन्हें उत्तर दिया, “मैं परमेश्वर का सेवक हूँ और परमेश्वर के मंदिर में सेवा करता हूँ। मैं कैसे जानूँ कि मेरा बेटा कहाँ है?”[a]


    (2) अधिकारी लौट गए और उन्होंने ये सारी बातें हेरोदेस को बता दीं। हेरोदेस क्रोधित हुआ और बोला, “उसका बेटा इस्राएल का राजा बनने वाला है!”


    उसने अधिकारियों को फिर यह कहने भेजा, “मुझे सच बताओ—तुम्हारा बेटा कहाँ है? तुम जानते हो कि तुम्हारा जीवन मेरे हाथ में है।”


    अधिकारियों ने लौटकर उसे ये बातें बता दीं।


    (3) ज़करयाह ने कहा, “यदि तुम मेरा लहू बहाओगे, तो मैं परमेश्वर का साक्षी ठहरूँगा,[b] क्योंकि प्रभु मेरी आत्मा को ग्रहण करेगा। तुम प्रभु के मंदिर के प्रवेश-द्वार पर निर्दोष का लहू बहाओगे।”


    भोर के आस-पास ज़करयाह की हत्या कर दी गई, और इस्राएल के लोगों को पता नहीं चला कि उसकी हत्या हो चुकी थी।'
  philosophy: optimal-equivalence
