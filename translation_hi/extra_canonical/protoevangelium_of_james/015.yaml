translation:
  language: hi
  text: '(1) शास्त्री हन्ना[a] उसके पास आया और उससे कहा, “यूसुफ, तुम हमारे यात्रा-दल में क्यों नहीं दिखाई दिए?”


    उसने उससे कहा, “क्योंकि मैं यात्रा से थक गया था और लौटने के बाद पहले दिन विश्राम करता रहा।”


    तब हन्ना मुड़ा और उसने मरियम को गर्भवती देखा।


    (2) वह तुरंत याजक के पास गया और उससे कहा, “जिस यूसुफ के विषय में तुमने गवाही दी थी, उसने घोर अधर्म किया है।”


    याजक ने कहा, “क्या बात है?”


    उसने कहा, “जिस कुँवारी को यूसुफ प्रभु के मन्दिर से ले गया था, उसने उसे अशुद्ध कर दिया है, उसका विवाह चुरा लिया है[b] और यह बात इस्राएल के लोगों पर प्रकट नहीं की।”


    याजक ने उत्तर दिया, “क्या यूसुफ ने ऐसा किया है?”


    शास्त्री हन्ना ने उससे कहा, “अधिकारियों को भेजो, और तुम कुँवारी को गर्भवती पाओगे।”


    अधिकारी गए और जैसा उसने कहा था, वैसा ही उसे पाया। वे उसे और यूसुफ को न्यायसभा में ले आए।


    (3) प्रधान याजक ने उससे कहा, “मरियम, तुमने ऐसा क्यों किया? तुमने अपने प्राण को क्यों अपमानित किया और प्रभु अपने परमेश्वर को क्यों भुला दिया? तुम्हारा पालन-पोषण परमपवित्र स्थान में हुआ; तुम्हें एक स्वर्गदूत के हाथ से भोजन मिला; तुमने उसके भजन सुने और उसके सामने नृत्य किया। यह तुमने क्या किया है?”[c]


    वह फूट-फूटकर रोई और बोली, “जीवित प्रभु परमेश्वर की शपथ, मैं परमेश्वर के सामने शुद्ध हूँ और मैंने किसी पुरुष को नहीं जाना!”


    (4) याजक ने कहा, “यूसुफ, यह तुमने क्या किया है?”


    यूसुफ ने कहा, “जीवित प्रभु मेरे परमेश्वर की शपथ और परमेश्वर की सच्चाई की गवाही से, मैं उसके प्रति शुद्ध हूँ।”[d]


    याजक ने कहा, “झूठी गवाही मत दो, बल्कि सच बताओ। तुमने उसका विवाह चुरा लिया और यह बात इस्राएल के लोगों पर प्रकट नहीं की। तुमने उस सामर्थी हाथ के अधीन अपना सिर नहीं झुकाया, जिसे तुम्हारी सन्तान को आशीष देनी थी।”[e]


    तब यूसुफ चुप रहा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी नाम का रूप ‘अन्नास’ भी लिखा जा सकता है। यहाँ ‘हन्ना’ नामक यह शास्त्री बाद में उल्लिखित प्रधान याजक से अलग पात्र है।
    reason: नाम के लिप्यंतरण और संभावित पात्र-भ्रम को स्पष्ट करना।
  - marker: b
    text: “उसका विवाह चुरा लिया” एक असामान्य अभिव्यक्ति है; सम्भवतः आशय है कि यूसुफ ने विवाह या वैवाहिक अधिकार गुप्त रूप से अपने लिए ले लिया। यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: साक्षी की वास्तविक कठिनाई और अस्थायी अनुवाद-स्थिति बताना, बिना अर्थ को निश्चित कर देने के।
  - marker: c
    text: “उसके भजन” में ‘उसके’ का संकेत उपलब्ध साक्षी में स्वर्गदूत की ओर है, यद्यपि अभिव्यक्ति असामान्य है।
    reason: सर्वनाम की संदर्भगत अस्पष्टता सुरक्षित रखना।
  - marker: d
    text: “उसके प्रति शुद्ध” का अर्थ प्रसंग में यह हो सकता है कि यूसुफ ने मरियम के साथ यौन सम्बन्ध नहीं रखा; अनुवाद ने कथन को इससे अधिक स्पष्ट नहीं किया है।
    reason: मुहावरे का संभावित अर्थ देना, पर अस्पष्टता न मिटाना।
  - marker: e
    text: “सामर्थी हाथ” और सन्तान को आशीष देने का संबंध कठिन है; सम्भवतः यह परमेश्वर के अधिकार के अधीन होकर विधिवत आशीष पाने की ओर संकेत करता है।
    reason: कठिन धार्मिक-रीतिगत वाक्य को संप्रदायगत व्याख्या के बिना चिह्नित करना।
