    (2) वह तुरंत याजक के पास गया और उससे कहा, “जिस यूसुफ के विषय में तुमने गवाही दी थी, उसने घोर अधर्म किया है।”


    याजक ने कहा, “क्या बात है?”


    उसने कहा, “जिस कुँवारी को यूसुफ प्रभु के मन्दिर से ले गया था, उसने उसे अशुद्ध कर दिया है, उसका विवाह चुरा लिया है[b] और यह बात इस्राएल के लोगों को नहीं बताई है।”


    याजक ने उत्तर दिया, “क्या यूसुफ ने ऐसा किया है?”


    शास्त्री अन्नास ने उससे कहा, “अधिकारियों को भेजो, और तुम कुँवारी को गर्भवती पाओगे।”


    अधिकारी गए और जैसा उसने कहा था, वैसा ही उसे पाया। वे उसे यूसुफ के साथ न्यायसभा में ले आए।


    (3) प्रधान याजक ने उससे कहा, “मरियम, तुमने ऐसा क्यों किया? तुमने अपने प्राण को क्यों लज्जित किया और प्रभु अपने परमेश्वर को क्यों भुला दिया? तुम्हारा पालन-पोषण परमपवित्र स्थान में हुआ; तुम्हें एक स्वर्गदूत के हाथ से भोजन मिला; तुमने उसके भजन सुने और उसके सामने नृत्य किया। यह तुमने क्या किया है?”[c]


    वह फूट-फूटकर रोई और बोली, “जीवित प्रभु परमेश्वर की शपथ, मैं परमेश्वर के सामने शुद्ध हूँ और मैंने किसी पुरुष को नहीं जाना!”


    (4) याजक ने कहा, “यूसुफ, यह तुमने क्या किया है?”


    यूसुफ ने कहा, “जीवित प्रभु, मेरे परमेश्वर, की शपथ और परमेश्वर की सच्चाई की गवाही से, मैं उसके प्रति शुद्ध हूँ।”[d]


    याजक ने कहा, “झूठी गवाही मत दो, बल्कि सच बताओ। तुमने उसका विवाह चुरा लिया और यह बात इस्राएल के लोगों को नहीं बताई। तुमने उस सामर्थी हाथ के अधीन अपना सिर नहीं झुकाया, जिसे तुम्हारी सन्तान को आशीष देनी थी।”[e]


    तब यूसुफ चुप रहा।'
