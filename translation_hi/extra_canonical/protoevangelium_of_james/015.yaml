- source_word: Annas
  choice: हन्ना
  rationale: नाम को प्रचलित बाइबलीय हिन्दी रूप में लिप्यंतरित किया गया; इसे महायाजक हन्ना के साथ अनिवार्य रूप से एक ही व्यक्ति नहीं माना गया।
- source_word: scribe
  choice: शास्त्री
  rationale: धार्मिक-वैधानिक लेखन और व्यवस्था-ज्ञान से जुड़े पद के लिए परिचित तथा स्वाभाविक हिन्दी शब्द।
- source_word: traveling group
  choice: यात्रा-दल
  rationale: साथ यात्रा करने वाले समूह का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: acted very lawlessly
  choice: घोर अधर्म किया है
  rationale: आरोप की नैतिक और धार्मिक तीव्रता बनाए रखता है; केवल नागरिक ‘कानून तोड़ना’ तक सीमित नहीं करता।
- source_word: Holy of Holies
  choice: परमपवित्र स्थान
  rationale: मन्दिर के अत्यन्त पवित्र भीतरी स्थान के लिए स्थापित बाइबलीय पदावली।
- source_word: known a man
  choice: किसी पुरुष को नहीं जाना
  rationale: मूल का शिष्ट बाइबलीय मुहावरा सुरक्षित रखता है; इसका यौनार्थ प्रसंग से स्पष्ट है।
- source_word: court
  choice: न्यायसभा
  rationale: यहाँ राजकीय आँगन के बजाय धार्मिक न्यायिक सुनवाई का भाव अधिक उपयुक्त है।
theological_decisions:
- issue: मरियम की गर्भावस्था और उसकी शुद्धता का दावा
  choice: दोनों कथनों को बिना सामंजस्य बैठाए ज्यों का त्यों रखा गया
  alternative: गर्भधारण को स्पष्ट रूप से चमत्कारी घोषित करना
  rationale: इस अध्याय की पूछताछ और तनाव को संरक्षित करना चाहिए; पाठ यहाँ स्वयं विस्तृत धर्मवैज्ञानिक स्पष्टीकरण नहीं देता।
- issue: ‘एक स्वर्गदूत’ और बाद के सर्वनाम का संदर्भ
  choice: ‘एक स्वर्गदूत’ तथा ‘उसके भजन’ रखा गया
  alternative: ‘स्वर्गदूतों के भजन’ या ‘परमेश्वर के भजन’
  rationale: उपलब्ध साक्षी का असामान्य एकवचन और संदर्भगत अस्पष्टता बिना चुपचाप सुधार किए सुरक्षित रखी गई।
- issue: यूसुफ का ‘उसके प्रति शुद्ध’ होना
  choice: संबंधगत कथन ‘मैं उसके प्रति शुद्ध हूँ’ रखा गया
  alternative: ‘मैंने उसे नहीं छुआ’ या ‘मैं निर्दोष हूँ’
  rationale: वैकल्पिक रूप मूल दावे को अधिक विशिष्ट बना देते; वर्तमान रूप उसकी व्यापक और कुछ असामान्य प्रकृति बचाता है।
- issue: सामर्थी हाथ से आशीष
  choice: ‘जिसे तुम्हारी सन्तान को आशीष देनी थी’
  alternative: ‘ताकि तुम्हारी सन्तान आशीष पाए’
  rationale: कर्तृत्व और अपेक्षा के विचित्र संबंध को उपलब्ध साक्षी के निकट रखा गया, बिना किसी विशिष्ट वैवाहिक अनुष्ठान की व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। मूल साक्षी की बार-बार आने वाली ‘और’ संरचना को जहाँ स्वाभाविक था वहाँ रखा गया, पर हिन्दी प्रवाह के लिए कुछ स्थानों पर ‘तब’ और सीधे वाक्य-विन्यास का प्रयोग किया गया। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; यूनानी पाण्डुलिपि-परम्परा की प्रत्यक्ष समीक्षा लंबित होने के कारण कठिन पदों पर पादटिप्पणियाँ दी गई हैं।
