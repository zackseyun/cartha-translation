translation:
  language: hi
  text: '(1) अन्ना ने स्वर्ग की ओर ध्यान से देखा और तेजपात के पेड़ पर गौरैयों का एक घोंसला देखा। तब अन्ना विलाप करते हुए मन ही मन कहने लगी,


    “हाय मुझ पर! मुझे किसने जन्म दिया? किस गर्भ ने मुझे धारण किया? मैं इस्राएल के लोगों के सामने शाप बनकर जन्मी और तुच्छ समझी गई। उन्होंने मेरा उपहास किया और मुझे मेरे परमेश्वर प्रभु के मंदिर से निकाल दिया।


    (2) “हाय मुझ पर! मैं किसके समान हूँ? मैं आकाश के पक्षियों के समान नहीं हूँ, क्योंकि आकाश के पक्षी भी आपके सामने फलवन्त हैं, हे प्रभु।


    “हाय मुझ पर! मैं किसके समान हूँ? मैं पशुओं के समान नहीं हूँ, क्योंकि पशु भी आपके सामने फलवन्त हैं, हे प्रभु।


    “हाय मुझ पर! मैं किसके समान हूँ? मैं धरती के वन-पशुओं के समान नहीं हूँ, क्योंकि धरती के वन-पशु भी आपके सामने फलवन्त हैं, हे प्रभु।


    (3) “हाय मुझ पर! मैं किसके समान हूँ? मैं इन जलधाराओं के समान नहीं हूँ, क्योंकि ये जलधाराएँ शांत होकर भी उमड़ती हैं, और इनमें रहने वाली मछलियाँ आपको धन्य कहती हैं, हे प्रभु।


    “हाय मुझ पर! मैं किसके समान हूँ? मैं इस धरती के समान नहीं हूँ, क्योंकि धरती उचित समय पर अपने फल उपजाती है और आपको धन्य कहती है, हे प्रभु।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laurel tree
  choice: तेजपात का पेड़
  rationale: भारतीय पाठकों के लिए परिचित और स्वाभाविक वनस्पति-नाम; उपलब्ध अंग्रेज़ी साक्ष्य के ‘laurel’ को सामान्य ‘पेड़’ बनाकर अस्पष्ट नहीं किया गया।
- source_word: fruitful
  choice: फलवन्त
  rationale: बार-बार आने वाली संतानोत्पत्ति और उत्पादकता की रूपकात्मक कड़ी को एक ही शब्द से बनाए रखता है।
- source_word: Temple
  choice: मंदिर
  rationale: यहूदी पवित्रस्थान के अर्थ में आधुनिक हिन्दी का सहज शब्द; संदर्भ में ‘प्रभु का मंदिर’ पहचान स्पष्ट करता है।
- source_word: bless you
  choice: आपको धन्य कहती हैं
  rationale: ‘आशीष देना’ से उत्पन्न ईश्वर को आशीष प्रदान करने की आधुनिक हिन्दी की असहजता से बचते हुए स्तुति/धन्य कहने का अर्थ व्यक्त किया गया।
- source_word: waters
  choice: जलधाराएँ
  rationale: बहुवचन और गतिशीलता को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि मूल यूनानी की सीधी समीक्षा लंबित है।
theological_decisions:
- issue: अन्ना का अपने जन्म को ‘शाप’ कहना
  choice: मैं ... शाप बनकर जन्मी
  alternative: मैं ... शापित होकर जन्मी
  rationale: कथन की कठोर आत्म-विलापपूर्ण भाषा और सामाजिक अपमान का तनाव सुरक्षित रखा गया; इसे ईश्वर द्वारा घोषित शाप के रूप में स्पष्ट नहीं किया गया।
- issue: जीव-जगत का प्रभु के सामने फलवन्त होना
  choice: आपके सामने फलवन्त हैं
  alternative: आपकी उपस्थिति में संतान उत्पन्न करते हैं
  rationale: रूपक और जैविक अर्थ दोनों खुले रखे गए तथा दोहराव की काव्यात्मक संरचना बचाई गई।
- issue: मछलियों और धरती द्वारा प्रभु को धन्य कहना
  choice: आपको धन्य कहती है/हैं
  alternative: आपकी स्तुति करती है/हैं
  rationale: साक्ष्य के ‘bless you’ के निकट रहते हुए सृष्टि के मानवीकरण को बरकरार रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, मौखिक विलाप के अनुकूल रूप अपनाया गया है। दोहराए गए “हाय मुझ पर!” और “मैं किसके समान हूँ?” को साहित्यिक संरचना बनाए रखने के लिए समान रखा गया। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण संदिग्ध बिंदुओं पर अत्यधिक निश्चितता से बचा गया है।
