translation:
  language: hi
  text: (1) उसने वहाँ एक गुफा पाई, उसे वहाँ ले गया, अपने बेटों को उसके साथ ठहराया, और बैतलहम के इलाके में किसी इब्रानी दाई को ढूँढ़ने निकल गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: दिए गए स्रोत की सीमा और अनुवाद की अस्थायी स्थिति को पारदर्शी रूप से बताना।
lexical_decisions:
- source_word: cave
  choice: गुफा
  rationale: यह सामान्य, स्वाभाविक और प्राचीन स्थल-विवरण के अनुरूप हिन्दी शब्द है।
- source_word: stationed his sons with her
  choice: अपने बेटों को उसके साथ ठहराया
  rationale: यह वाक्यांश बेटों को उसके पास छोड़ने और वहीं रहने की व्यवस्था करने का भाव रखता है, बिना उनकी भूमिका के बारे में अतिरिक्त अर्थ जोड़े।
- source_word: Hebrew midwife
  choice: इब्रानी दाई
  rationale: ‘इब्रानी’ जातीय-सांस्कृतिक पहचान को बनाए रखता है और ‘दाई’ प्रसव में सहायता करने वाली स्त्री के लिए सहज आधुनिक हिन्दी है।
- source_word: region of Bethlehem
  choice: बैतलहम के इलाके में
  rationale: ‘इलाका’ साधारण पाठकों के लिए स्वाभाविक है और किसी सख्त प्रशासनिक सीमा का अनावश्यक संकेत नहीं देता।
