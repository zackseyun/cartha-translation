    (2) लेकिन यूसुफ़ ने इनकार करते हुए कहा, “मेरे बेटे हैं और मैं बूढ़ा हूँ, जबकि वह युवा है। मैं इस्राएल के लोगों के बीच हँसी का पात्र नहीं बनूँगा।”


    याजक ने कहा, “यूसुफ़, अपने परमेश्वर प्रभु का भय मानो और याद करो कि परमेश्वर ने दातान, अबीराम और कोरह के साथ क्या किया था—उनके विद्रोह के कारण धरती खुल गई और उन सबको निगल गई। इसलिए अब भय मानो, यूसुफ़, कहीं ये बातें तुम्हारे घर में भी न हों।”


