  yaml_path: translation/extra_canonical/protoevangelium_of_james/009.yaml
  text: '(1) Joseph threw down his axe and went to meet them. When they had all gathered, they went to the priest with their staffs. The priest took all their staffs, entered the Temple, and prayed. When he had finished praying, he took the staffs, went out, and gave them back. But there was no sign among them. Joseph took his staff last, and look! A dove went from the staff and flew upon Joseph’s head. The priest said to Joseph, “You have been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she is young. I will not be a laughingstock among the people of Israel.”


    The priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore—how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things will not happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
translation:
  language: hi
  text: '(1) यूसुफ़ ने अपनी कुल्हाड़ी नीचे रख दी और उनकी सभा में गया। जब वे सब इकट्ठे हो गए, तो अपनी-अपनी छड़ियाँ लेकर याजक के पास गए। याजक ने उनकी सभी छड़ियाँ लीं, मन्दिर में जाकर प्रार्थना की। प्रार्थना पूरी करने के बाद वह छड़ियाँ लेकर बाहर आया और उन्हें लौटा दिया। लेकिन उनमें कोई चिन्ह नहीं था। यूसुफ़ ने अपनी छड़ी सबसे अन्त में ली, और देखो! छड़ी में से एक कबूतर निकला और उड़कर यूसुफ़ के सिर पर आ बैठा। तब याजक ने यूसुफ़ से कहा, “प्रभु की कुँवारी को अपनी देखरेख में लेने के लिए तुम चुने गए हो।”


    (2) लेकिन यूसुफ़ ने इनकार करते हुए कहा, “मेरे बेटे हैं और मैं बूढ़ा हूँ, जबकि वह जवान है। मैं इस्राएल के लोगों के बीच हँसी का पात्र नहीं बनूँगा।”


    याजक ने कहा, “यूसुफ़, अपने परमेश्वर प्रभु का भय मानो और याद करो कि परमेश्वर ने दातान, अबीराम और कोरह के साथ क्या किया था—उनके विद्रोह के कारण धरती फट गई और उन सबको निगल गई। इसलिए अब भय मानो, यूसुफ़, कहीं ये बातें तुम्हारे घर में भी न हों।”


    (3) तब यूसुफ़ ने डरकर उसे अपनी देखरेख में ले लिया और उससे कहा, “मरियम, मैं तुम्हें प्रभु के मन्दिर से ले आया हूँ और अब तुम्हें अपने घर लाता हूँ। मैं घर बनाने के काम से बाहर जा रहा हूँ, लेकिन तुम्हारे पास लौट आऊँगा। प्रभु तुम्हारी रक्षा करेगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: axe
  choice: कुल्हाड़ी
  rationale: बढ़ई के औज़ार के लिए सामान्य, स्पष्ट आधुनिक हिन्दी शब्द।
- source_word: staffs
  choice: छड़ियाँ
  rationale: चयन के लिए लाई गई व्यक्तिगत दण्डाकार वस्तुओं को सहज हिन्दी में व्यक्त करता है; ‘लाठियाँ’ अनावश्यक रूप से हथियार का भाव दे सकता है।
- source_word: Temple
  choice: मन्दिर
  rationale: यरूशलेम के पवित्र मन्दिर के लिए प्रचलित और सामान्य हिन्दी पद।
- source_word: virgin of the Lord
  choice: प्रभु की कुँवारी
  rationale: स्रोत की धार्मिक उपाधि और कुँवारेपन के स्पष्ट उल्लेख को बनाए रखता है।
- source_word: welcome ... into your own care
  choice: अपनी देखरेख में लेना
  rationale: विवाह या दत्तक ग्रहण जैसी कोई अतिरिक्त व्याख्या जोड़े बिना संरक्षण और उत्तरदायित्व का अर्थ देता है।
- source_word: laughingstock
  choice: हँसी का पात्र
  rationale: सार्वजनिक उपहास का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: rebellion
  choice: विद्रोह
  rationale: दातान, अबीराम और कोरह के प्रसंग में विरोध और अवज्ञा की गंभीरता बनाए रखता है।
- source_word: build houses
  choice: घर बनाने के काम से
  rationale: बहुवचन और यूसुफ़ के निर्माण-कार्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूसुफ़ और मरियम के संबंध का स्वरूप
  choice: ‘अपनी देखरेख में लेना’
  alternative: ‘पत्नी के रूप में ग्रहण करना’ या ‘सगाई करना’
  rationale: इस अध्याय का उपलब्ध साक्ष्य संरक्षण की जिम्मेदारी बताता है; वैवाहिक स्थिति को अधिक स्पष्ट करना स्रोत से आगे जाना होता।
- issue: यूसुफ़ के बेटों का उल्लेख
  choice: ‘मेरे बेटे हैं’ को बिना व्याख्या के रखा
  alternative: उन्हें किसी पूर्व विवाह के पुत्र बताना
  rationale: पाठ पुत्रों का उल्लेख करता है, पर उनकी माता या यूसुफ़ के पूर्व वैवाहिक इतिहास की व्याख्या नहीं करता।
- issue: कबूतर के प्रकट होने का ढंग
  choice: ‘छड़ी में से ... निकला’
  alternative: ‘छड़ी पर आ बैठा’ या प्रतीकात्मक दर्शन मानना
  rationale: उपलब्ध साक्ष्य कबूतर के छड़ी से निकलने और फिर यूसुफ़ के सिर पर आने का क्रम देता है; असामान्य तत्व को सामान्यीकृत नहीं किया गया।
- issue: दैवी दण्ड की चेतावनी
  choice: ‘कहीं ये बातें तुम्हारे घर में भी न हों’
  alternative: निश्चित भविष्यवाणी के रूप में प्रस्तुत करना
  rationale: स्रोत चेतावनी और संभाव्यता व्यक्त करता है, निश्चित घोषणा नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-विन्यास स्रोत के कथात्मक क्रम के निकट है, पर अनावश्यक अंग्रेज़ी-प्रभाव से बचाया गया है। यह प्रारूप उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण सूक्ष्म पाठगत और शब्दार्थगत निर्णय अस्थायी माने जाएँ।
