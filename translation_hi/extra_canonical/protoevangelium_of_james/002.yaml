base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/002.yaml
  text: '(1) Now his wife, Anna, mourned and lamented for two reasons. She said, “I lament because I am a widow and because I have no child.”


    (2) Now the great day of the Lord was approaching, and her servant Juthine said to her, “How long will you humiliate your soul? Look, the great day of the Lord has approached, and it is not right for you to grieve. Take this headband that the leader of the workplace gave me. It is not right for me to wear it, since I am your servant and it bears a royal mark.”


    (3) Anna said, “Get away from me! I will not do this. The Lord God has greatly humiliated me. Perhaps a trickster gave this to you, and you have come to make me share in your sin.”


    Juthine the servant replied, “Why should I curse you, since you haven’t heard my voice? The Lord God has made your womb infertile, to give you no fruit in Israel.”


    (4) And Anna was very grieved. She removed her garment of mourning, washed her head, and put on her wedding garment. At about the ninth hour, she went down into her garden to walk around. She saw a laurel tree and sat beneath it. After resting, she petitioned the Lord, saying, “God of my ancestors, bless me and hear my prayer, just as you blessed our mother Sarah and gave her a son, Isaac.”'
translation:
  language: hi
  text: '(1) अब उसकी पत्नी अन्ना दो कारणों से शोक और विलाप कर रही थी। उसने कहा, “मैं इसलिए विलाप करती हूँ कि मैं विधवा हूँ और इसलिए कि मेरी कोई संतान नहीं है।”


    (2) अब प्रभु का महान दिन निकट आ रहा था। उसकी दासी यूथीने ने उससे कहा, “तुम कब तक अपने प्राण को दीन करती रहोगी?[a] देखो, प्रभु का महान दिन निकट आ गया है; तुम्हारा शोक करना उचित नहीं है। यह सिरबंद ले लो, जो कार्यशाला के मुखिया ने मुझे दिया था। मेरा इसे पहनना उचित नहीं है, क्योंकि मैं तुम्हारी दासी हूँ और इस पर राजचिह्न लगा है।”[b]


    (3) अन्ना ने कहा, “मेरे सामने से चली जा! मैं ऐसा नहीं करूँगी। प्रभु परमेश्वर ने मुझे बहुत दीन किया है। हो सकता है, किसी छलिये ने यह तुम्हें दिया हो और तुम मुझे अपने पाप में भागी बनाने आई हो।”


    दासी यूथीने ने कहा, “जब तुमने मेरी बात नहीं मानी, तो मैं तुम्हें क्यों कोसूँ?[c] प्रभु परमेश्वर ने तुम्हारी कोख को बाँझ कर दिया है, ताकि तुम इस्राएल में कोई फल उत्पन्न न करो।”[d]


    (4) तब अन्ना बहुत दुखी हुई। उसने अपने शोक के वस्त्र उतारे, सिर धोया और विवाह का वस्त्र पहन लिया। लगभग नौवें पहर[e] वह टहलने के लिए अपने बगीचे में उतर गई। उसने तेजपात का एक पेड़ देखा और उसके नीचे बैठ गई। कुछ देर विश्राम करने के बाद उसने प्रभु से विनती की, “मेरे पूर्वजों के परमेश्वर, मुझे आशीष दे और मेरी प्रार्थना सुन, जैसे तूने हमारी माता सारा को आशीष दी और उसे एक पुत्र, इसहाक, दिया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने प्राण को दीन करना” का अर्थ अपने आपको शोक, संयम या संभवतः उपवास में रखना हो सकता है।
    reason: स्रोत-साक्ष्य की मुहावरेदार अभिव्यक्ति आधुनिक पाठक के लिए अस्पष्ट हो सकती है।
  - marker: b
    text: “कार्यशाला के मुखिया” और “राजचिह्न” वाले वाक्य का सटीक आशय अनिश्चित है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी बाकी है।
    reason: प्रस्तुत अंग्रेज़ी साक्ष्य में पद और वस्तु का सामाजिक संदर्भ असामान्य है, इसलिए अनुमान से विशिष्ट अर्थ नहीं थोपा गया।
  - marker: c
    text: 'यह उत्तर संदर्भ में कठिन है। इसका भाव यह भी हो सकता है: “तुमने मेरी बात नहीं मानी, इसलिए तुम्हारे लिए इससे अधिक कठोर बात मैं क्या कहूँ?”'
    reason: ‘क्यों कोसूँ’ और अगले कठोर कथन के बीच तनाव को स्वीकार करना आवश्यक है।
  - marker: d
    text: यहाँ “फल” संतान का रूपक है, विशेष रूप से इस्राएल समुदाय में वंश आगे बढ़ाने के अर्थ में।
    reason: रूपक को मुख्य पाठ में सुरक्षित रखते हुए उसका आशय स्पष्ट किया गया।
  - marker: e
    text: “नौवाँ पहर” लगभग दोपहर तीन बजे का समय था।
    reason: प्राचीन समय-गणना आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: humiliate your soul
  choice: अपने प्राण को दीन करती रहोगी
  rationale: स्रोत-साक्ष्य की सामी पृष्ठभूमि वाली अभिव्यक्ति को बनाए रखते हुए आधुनिक हिंदी में बोधगम्य रखा; केवल ‘अपने को दुखी’ कहना संभावित उपवास/आत्म-दमन के संकेत को मिटा देता।
- source_word: headband
  choice: सिरबंद
  rationale: सिर पर पहने जाने वाले अलंकार/पट्टी के लिए सहज और पर्याप्त रूप से व्यापक हिंदी शब्द।
- source_word: leader of the workplace
  choice: कार्यशाला के मुखिया
  rationale: अंग्रेज़ी साक्ष्य के असामान्य पद को अनुमान से किसी विशिष्ट राजकीय अधिकारी में नहीं बदला; ‘कार्यशाला’ और ‘मुखिया’ अर्थ को स्वाभाविक हिंदी देते हैं।
- source_word: royal mark
  choice: राजचिह्न
  rationale: राजकीय या शाही पहचान के चिह्न का संक्षिप्त, स्वाभाविक अनुवाद।
- source_word: womb infertile
  choice: कोख को बाँझ कर दिया
  rationale: शारीरिक बिंब और कथन की कठोरता दोनों सुरक्षित रखे गए हैं।
- source_word: fruit in Israel
  choice: इस्राएल में कोई फल उत्पन्न न करो
  rationale: ‘फल’ के रूपक को संतान कहकर पूरी तरह स्पष्ट नहीं किया, ताकि स्रोत की रूपकात्मक और सामुदायिक भाषा बनी रहे।
- source_word: laurel tree
  choice: तेजपात का एक पेड़
  rationale: आधुनिक हिंदी में laurel के लिए पहचाना जाने वाला निकटतम सामान्य नाम; वनस्पति-विशिष्टता की अनिश्चितता फुटनोट में बताई गई है।
- source_word: ninth hour
  choice: नौवाँ पहर
  rationale: प्राचीन समय-सूचक पद्धति को मुख्य पाठ में बनाए रखा; आधुनिक अनुमान फुटनोट में दिया।
- source_word: God of my ancestors
  choice: मेरे पूर्वजों के परमेश्वर
  rationale: वंशपरंपरा और वाचा-संबंधी संबोधन को स्वाभाविक, समावेशी हिंदी में व्यक्त करता है।
theological_decisions:
- issue: क्या परमेश्वर स्वयं अन्ना की बाँझपन का कारण बताया गया है
  choice: “प्रभु परमेश्वर ने तुम्हारी कोख को बाँझ कर दिया है” के प्रत्यक्ष कथन को रखा
  alternative: “परमेश्वर ने तुम्हें संतान नहीं दी” जैसा नरम अनुवाद
  rationale: वक्ता यूथीने का कठोर आरोप कथानक का धार्मिक तनाव है; अनुवाद इसे लेखक या अनुवादक की अंतिम धर्मवैज्ञानिक घोषणा में बदले बिना प्रत्यक्ष वचन के भीतर सुरक्षित रखता है।
- issue: ‘अपने प्राण को दीन करना’ का अर्थ
  choice: मुहावरे की औपचारिक छवि बनाए रखी
  alternative: “अपने को कब तक दुखी रखोगी?”
  rationale: वाक्य में शोक, आत्म-दमन या संभवतः उपवास का संकेत हो सकता है; अस्पष्टता को चुपचाप समाप्त नहीं किया गया।
- issue: अन्ना का स्वयं को ‘विधवा’ कहना
  choice: ‘मैं विधवा हूँ’ को यथावत रखा
  alternative: पति की अनुपस्थिति के कारण अकेली/परित्यक्त कहना
  rationale: पूर्व प्रसंग से संभावित तनाव के बावजूद दिए गए साक्ष्य का स्पष्ट कथन बदला नहीं गया।
- issue: सारा और इसहाक का संकेत
  choice: प्रत्यक्ष प्रार्थना और तुलना को यथावत रखा
  alternative: व्याख्यात्मक रूप से उत्पत्ति की कथा जोड़ना
  rationale: पाठ स्वयं जो धर्मशास्त्रीय समानता बनाता है वही पर्याप्त है; अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। कथात्मक संयोजनों को स्वाभाविक बनाया गया, पर ‘प्राण को दीन करना’, ‘फल’, और ‘नौवाँ पहर’ जैसे अर्थपूर्ण प्राचीन बिंब सुरक्षित रखे गए। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण संदिग्ध सामाजिक पदों और कठिन संवाद पर फुटनोट दिए गए हैं।
