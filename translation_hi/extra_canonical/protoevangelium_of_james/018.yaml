base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/018.yaml
  text: '(1) He found a cave there, brought her (to it), stationed his sons with her, and went to look for a Hebrew midwife in the region of Bethlehem.


    (2) Now I, Joseph, was wandering, yet not wandering. I looked up at the dome of heaven and saw it standing still. I looked into the sky and was astonished to see that even the birds of heaven were motionless. I looked at the ground and saw a bowl lying there, and workers reclining. Their hands were in the bowl, and they were chewing but not chewing. They were picking up food but not picking it up, and they were bringing it to their mouths but not bringing it to their mouths. Instead, all their faces were looking upward.


    I saw sheep being driven, but the sheep stood still. The shepherd lifted his hand to strike them, but his hand was raised. I looked into the torrent of the river and saw young goats with their mouths in the water, but they were not drinking.


    Then suddenly, everything resumed its course.'
translation:
  language: hi
  text: '(1) वहाँ उसे एक गुफा मिली। वह उसे गुफा में ले गया, अपने बेटों को उसके साथ ठहराया, और बैतलहम के इलाके में किसी इब्रानी दाई को ढूँढ़ने निकल गया।


    (2) अब मैं, यूसुफ, चल रहा था, फिर भी चल नहीं रहा था। मैंने ऊपर आकाश के गुंबद की ओर देखा और पाया कि वह स्थिर था। मैंने आकाश में देखा और यह देखकर चकित रह गया कि आकाश के पक्षी भी निश्चल थे। मैंने धरती की ओर देखा तो वहाँ एक कटोरा रखा था और मज़दूर अधलेटे थे। उनके हाथ कटोरे में थे; वे चबा रहे थे, फिर भी चबा नहीं रहे थे। वे भोजन उठा रहे थे, फिर भी उठा नहीं रहे थे; वे उसे अपने मुँह तक ला रहे थे, फिर भी ला नहीं रहे थे। बल्कि उन सबके चेहरे ऊपर की ओर उठे हुए थे।


    मैंने भेड़ों को हाँकते हुए देखा, पर भेड़ें स्थिर खड़ी थीं। चरवाहे ने उन्हें मारने के लिए हाथ उठाया, पर उसका हाथ उठा ही रह गया। मैंने नदी की प्रचंड धारा में देखा और बकरी के बच्चों को पाया; उनके मुँह पानी में थे, फिर भी वे पी नहीं रहे थे।


    और अचानक सब कुछ फिर अपनी गति से चलने लगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cave
  choice: गुफा
  rationale: दिए गए साक्ष्य का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: Hebrew midwife
  choice: इब्रानी दाई
  rationale: जातीय-सांस्कृतिक विशेषण को बनाए रखते हुए सामान्य पाठक के लिए सहज शब्दावली।
- source_word: dome of heaven
  choice: आकाश का गुंबद
  rationale: प्राचीन विश्व-चित्र की ठोस अभिव्यक्ति को समतल किए बिना सुरक्षित रखा गया है।
- source_word: wandering but not wandering
  choice: चल रहा था, फिर भी चल नहीं रहा था
  rationale: समय के ठहर जाने से जुड़ी जानबूझकर विरोधाभासी भाषा को स्पष्ट व्याख्या में बदलने के बजाय बनाए रखा गया है।
- source_word: torrent of the river
  choice: नदी की प्रचंड धारा
  rationale: ‘torrent’ की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: resumed its course
  choice: फिर अपनी गति से चलने लगा
  rationale: सृष्टि की रुकी हुई गतिविधियों के पुनः आरंभ होने का व्यापक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: समय अथवा सृष्टि के ठहरने का स्वरूप
  choice: दृश्य को यूसुफ के प्रत्यक्ष अनुभव के रूप में रखा गया है, बिना उसके तंत्र की व्याख्या किए।
  alternative: इसे केवल दर्शन, प्रतीक या वस्तुगत चमत्कार के रूप में स्पष्ट करना।
  rationale: साक्ष्य स्वयं इन विकल्पों में निर्णय नहीं करता; इसलिए कथात्मक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: ‘चल रहा था, फिर भी चल नहीं रहा था’ का विरोधाभास
  choice: विरोधाभासी रूप बनाए रखा गया है।
  alternative: ‘मैं स्तब्ध होकर रुक गया’ जैसी व्याख्यात्मक भाषा।
  rationale: व्याख्यात्मक विकल्प मूल कथन की रहस्यमय पुनरुक्ति और व्यापक ठहराव के साथ उसके संबंध को सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुलभ। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण शब्द-सूक्ष्मताओं को अंतिम न माना जाए। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
