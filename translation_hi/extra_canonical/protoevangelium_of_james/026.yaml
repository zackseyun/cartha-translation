  text: सबसे प्राचीन पांडुलिपि, पपाइरस बोडमर V (जो तीसरी शताब्दी के उत्तरार्ध या चौथी शताब्दी के आरंभ की मानी जाती है), में अध्याय 18–21 का एक बहुत संक्षिप्त रूप मिलता है। वह रूप नीचे दिया गया है।
