base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/012.yaml
  text: '(1) She made the purple and the scarlet and took it to the priest. The priest received it, blessed her, and said, “Mary, the Lord God has magnified your name, and you will be blessed among all the generations of the earth.”


    (2) Mary rejoiced and went to her cousin Elizabeth. She knocked at the door. Elizabeth heard, threw down the scarlet, and rushed to the door. She opened it, blessed Mary, and said, “How is it that the mother of my Lord should come to me? For look, the one in me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She looked intently into heaven and said, “Lord, who am I, that all the women of the earth will bless me?”


    (3) She stayed with Elizabeth for three months. Day by day, her womb grew larger, and Mary became afraid. She went to her house and hid herself from the people of Israel. She was sixteen years old when these mysteries happened to her.'
translation:
  language: hi
  text: '(1) मरियम ने बैंगनी और लाल रंग का सूत तैयार किया और उसे याजक के पास ले गई। याजक ने उसे लेकर मरियम को आशीर्वाद दिया और कहा, “मरियम, प्रभु परमेश्वर ने तुम्हारा नाम महान किया है, और पृथ्वी की सभी पीढ़ियाँ तुम्हें धन्य कहेंगी।”


    (2) मरियम आनन्दित हुई और अपनी कुटुम्बिनी एलिज़ाबेथ के पास गई। उसने द्वार खटखटाया। एलिज़ाबेथ ने आवाज़ सुनी, लाल सूत नीचे फेंक दिया और दौड़कर द्वार पर गई। उसने द्वार खोला, मरियम को आशीर्वाद दिया और कहा, “यह कैसे हुआ कि मेरे प्रभु की माता मेरे पास आई? क्योंकि देखो, मेरे गर्भ में जो है, वह उछल पड़ा और उसने तुम्हें धन्य कहा!”


    पर मरियम उन रहस्यों को भूल गई थी जो स्वर्गदूत गब्रिएल ने उसे बताए थे। उसने ध्यान से आकाश की ओर देखा और कहा, “प्रभु, मैं कौन हूँ कि पृथ्वी की सभी स्त्रियाँ मुझे धन्य कहेंगी?”


    (3) वह तीन महीने एलिज़ाबेथ के साथ रही। दिन-प्रतिदिन उसका गर्भ बढ़ता गया, और मरियम डर गई। वह अपने घर चली गई और इस्राएल के लोगों से अपने आपको छिपाए रखा। जब ये रहस्य उसके साथ घटित हुए, तब वह सोलह वर्ष की थी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: purple and scarlet
  choice: बैंगनी और लाल रंग का सूत
  rationale: पिछले कथानक के वस्त्र-निर्माण प्रसंग के अनुसार रंगों से अभिप्रेत सामग्री को स्वाभाविक हिन्दी में ‘सूत’ कहा गया है; फिर भी दोनों रंग अलग रखे गए हैं।
- source_word: cousin
  choice: कुटुम्बिनी
  rationale: आधार-पाठ का ‘cousin’ सम्भवतः व्यापक रिश्तेदारी का द्योतक है; ‘चचेरी/ममेरी बहन’ कहने से अनिश्चित संबंध को अनावश्यक रूप से निश्चित किया जाता।
- source_word: blessed
  choice: आशीर्वाद दिया / धन्य कहा
  rationale: किसी व्यक्ति द्वारा आशीर्वाद देने और पीढ़ियों या स्त्रियों द्वारा धन्य कहे जाने के अलग संदर्भों को स्वाभाविक हिन्दी में अलग अभिव्यक्त किया गया है।
- source_word: the one in me
  choice: मेरे गर्भ में जो है
  rationale: मूल कथन की व्यक्ति-संबंधी अस्पष्टता बनाए रखते हुए हिन्दी में आशय स्पष्ट किया गया है; ‘बालक’ जोड़कर अर्थ को निश्चित नहीं किया गया।
- source_word: mysteries
  choice: रहस्य
  rationale: धर्मवैज्ञानिक अर्थ खोलने या इसे केवल ‘बातें’ बनाने के बजाय पाठ का रहस्यमय स्वर सुरक्षित रखा गया है।
- source_word: people of Israel
  choice: इस्राएल के लोग
  rationale: आधुनिक पाठकों के लिए स्वाभाविक और सामूहिक अर्थ में स्पष्ट अभिव्यक्ति।
theological_decisions:
- issue: एलिज़ाबेथ द्वारा मरियम को ‘मेरे प्रभु की माता’ कहना
  choice: मेरे प्रभु की माता
  alternative: मेरे स्वामी की माँ
  rationale: ‘प्रभु’ की धर्मवैज्ञानिक प्रतिध्वनि और कथन की गरिमा बनाए रखी गई है, बिना उसके आशय की अतिरिक्त व्याख्या किए।
- issue: गर्भस्थ के उछलने और आशीर्वाद देने का कर्ता
  choice: वह उछल पड़ा और उसने तुम्हें धन्य कहा
  alternative: बच्चा आनन्द से उछल पड़ा और तुम्हारा अभिनंदन किया
  rationale: साक्ष्य में आए ‘blessed you’ को बनाए रखा गया है; ‘आनन्द से’ या ‘बच्चा’ जोड़कर अस्पष्टता दूर नहीं की गई।
- issue: मरियम का गब्रिएल द्वारा बताए रहस्यों को भूलना
  choice: भूल गई थी
  alternative: उसे उस समय स्मरण न रहा
  rationale: कठिन धर्मवैज्ञानिक तनाव को नरम किए बिना साक्ष्य का सीधा कथन सुरक्षित रखा गया है।
- issue: मरियम के गर्भ का बढ़ना
  choice: उसका गर्भ बढ़ता गया
  alternative: उसका पेट बढ़ता गया
  rationale: गर्भावस्था का आशय गरिमापूर्ण और स्पष्ट रखा गया है, पर कथानक से आगे कोई जैविक या धर्मवैज्ञानिक विवरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल कथात्मक शैली अपनाई गई है। बार-बार आने वाले संयोजकों को जहाँ सम्भव हो सहज हिन्दी वाक्यक्रम में रखा गया है, किंतु घटनाओं की क्रमिक गति बनाए रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण रिश्तेदारी, वस्त्र-सामग्री और कुछ क्रियाओं के सूक्ष्म अर्थ अस्थायी माने जाएँ।
