  text: '(1) She took the pitcher and went to fill it with water, and look! A voice said to her, “Rejoice, blessed one! The Lord is with you. Blessed are you among women.”


    Mary looked around to the right and the left to see where the voice might be coming from. She became terrified and went into her house. After setting down the pitcher, she took up the purple, sat upon her throne, and spun the purple.


    (2) And look! An angel of the Lord stood before her and said, “Do not be afraid, Mary, because you have found grace before the Lord of All. You will conceive from God’s word.”


    When Mary heard this, she questioned herself, saying, “Will I conceive from the Lord, the living God, and give birth as all women give birth?”


    (3) The angel of the Lord said to her, “Not like that, Mary, because the power of God will overshadow you. Therefore, the holy one who will be born from you will be called the Son of the Most High. You will call his name Jesus, because he will save his people from their sins.”


    Mary said, “Look, I am the servant of the Lord. May it happen to me according to your word.”'
translation:
  language: hi
  text: '(1) तब वह घड़ा लेकर पानी भरने गई। और देखो, एक आवाज़ उससे कह रही थी, “आनन्दित हो, धन्य स्त्री! प्रभु तुम्हारे साथ है। स्त्रियों में तुम धन्य हो।”


    मरियम ने दाएँ-बाएँ मुड़कर देखा कि यह आवाज़ कहाँ से आ रही है। वह बहुत डर गई और अपने घर के भीतर चली गई। घड़ा नीचे रखकर उसने बैंगनी ऊन उठाई, अपने आसन पर बैठी और उसे कातने लगी।


    (2) और देखो, प्रभु का एक स्वर्गदूत उसके सामने खड़ा हुआ और बोला, “मत डरो, मरियम, क्योंकि तुमने सबके प्रभु के सामने अनुग्रह पाया है। तुम परमेश्वर के वचन से गर्भधारण करोगी।”[a]


    यह सुनकर मरियम ने मन-ही-मन पूछा, “क्या मैं जीवित परमेश्वर, प्रभु से गर्भधारण करूँगी और वैसे ही जन्म दूँगी जैसे सभी स्त्रियाँ जन्म देती हैं?”


    (3) प्रभु के स्वर्गदूत ने उससे कहा, “ऐसा नहीं होगा, मरियम, क्योंकि परमेश्वर की सामर्थ्य तुम पर छाया करेगी। इसलिए जो पवित्र जन तुमसे जन्म लेगा, वह परमप्रधान का पुत्र कहलाएगा। तुम उसका नाम यीशु रखना, क्योंकि वह अपने लोगों को उनके पापों से बचाएगा।”


    मरियम ने कहा, “देखो, मैं प्रभु की दासी हूँ। तुम्हारे वचन के अनुसार मेरे साथ हो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर के वचन से” का अनुवाद उपलब्ध अंग्रेज़ी साक्ष्य के आधार पर है। यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी अपेक्षित है; वाक्यांश को “परमेश्वर के कहने से” भी समझा जा सकता है।
    reason: आपूर्ति किए गए स्रोत में प्रत्यक्ष यूनानी समीक्षा लंबित है और यह वाक्यांश अर्थगत तथा धर्मवैज्ञानिक रूप से महत्त्वपूर्ण है।
lexical_decisions:
- source_word: χαῖρε / Rejoice
  choice: आनन्दित हो
  rationale: अभिवादन में निहित आनन्द की आज्ञा/कामना को बनाए रखता है; केवल सामान्य ‘नमस्कार’ करने से अर्थ संकुचित हो जाता।
- source_word: εὐλογημένη / blessed one
  choice: धन्य स्त्री
  rationale: सम्बोधन को स्वाभाविक हिन्दी में व्यक्त करते हुए ‘धन्य’ का धार्मिक और प्रशंसात्मक अर्थ सुरक्षित रखा गया है।
- source_word: πορφύρα / purple
  choice: बैंगनी ऊन
  rationale: प्रसंग में मरियम इसे कात रही है, इसलिए केवल रंगवाचक ‘बैंगनी’ की अपेक्षा कातने की सामग्री स्पष्ट की गई; फिर भी वस्त्र तैयार होने की अवस्था नहीं मान ली गई।
- source_word: θρόνος / throne
  choice: आसन
  rationale: शाब्दिक ‘सिंहासन’ यहाँ अनावश्यक राजसी अर्थ जगा सकता है; बैठकर कातने के घरेलू प्रसंग में ‘आसन’ स्वाभाविक है।
- source_word: χάρις / grace
  choice: अनुग्रह
  rationale: ईश्वरीय कृपा और स्वीकृति दोनों की अर्थ-सीमा को बनाए रखने वाला प्रचलित हिन्दी धार्मिक शब्द।
- source_word: λόγος θεοῦ / God’s word
  choice: परमेश्वर का वचन
  rationale: ‘वचन’ कथन, संदेश और संभावित व्यक्तिवाचक धार्मिक संकेत—इन सभी को खुला रखता है।
- source_word: ἐπισκιάζω / overshadow
  choice: छाया करेगी
  rationale: रूपक को व्याख्यात्मक ढंग से बदलने के बजाय उसकी स्रोतगत छवि सुरक्षित रखी गई है।
- source_word: δοῦλη / female servant
  choice: दासी
  rationale: स्त्रीलिंग सेवकत्व तथा मरियम की विनम्र आत्म-पहचान को संक्षिप्त और गरिमापूर्ण रूप में रखता है।
theological_decisions:
- issue: ‘परमेश्वर के वचन से गर्भधारण’ का आशय
  choice: वाक्यांश को सीधे ‘परमेश्वर के वचन से’ रखा गया
  alternative: ‘परमेश्वर के कहने से’ अथवा ‘परमेश्वर के वचन के द्वारा’
  rationale: पाठ कारण, माध्यम या व्यक्तिवाचक ‘वचन’ के बीच संभावित तनाव रखता है; अनुवाद ने इसे किसी एक व्यवस्थित धर्मवैज्ञानिक अर्थ में सीमित नहीं किया।
- issue: मरियम के प्रश्न में ‘प्रभु, जीवित परमेश्वर से’
  choice: ‘जीवित परमेश्वर, प्रभु से’
  alternative: ‘जीवित प्रभु परमेश्वर से’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की सम्बद्धता कुछ असहज है; प्रस्तुत क्रम दोनों उपाधियों को सुरक्षित रखता है और यह दावा नहीं करता कि प्रश्न केवल सामान्य वैवाहिक गर्भधारण के विषय में है।
- issue: दैवी सामर्थ्य का ‘छाया करना’
  choice: रूपक ज्यों का त्यों रखा गया
  alternative: ‘तुम्हें ढाँप लेगी’ या ‘तुम पर उतर आएगी’
  rationale: ‘छाया’ की धर्मग्रंथीय प्रतिध्वनि और गर्भधारण के ढंग के विषय में पाठ की संयमित भाषा को सुरक्षित रखा गया।
- issue: ‘पवित्र जन’ और ‘परमप्रधान का पुत्र’
  choice: उपाधियों को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: ‘पवित्र बालक’ या स्पष्ट त्रित्ववादी/मसीहवैज्ञानिक विस्तार
  rationale: पाठ जितना कहता है उतना ही कहा गया है; बाद की सिद्धान्तगत व्याख्या नहीं जोड़ी गई।
