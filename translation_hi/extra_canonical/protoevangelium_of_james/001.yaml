translation:
  language: hi
  text: 'प्राक्-सुसमाचार याकूब — अध्याय 1: योआकीम की व्यथा


    (1) इस्राएल के बारह गोत्रों के इतिहास-वृत्तांतों[a] में योआकीम नाम का एक बहुत धनी व्यक्ति था। वह प्रभु को चढ़ाई जानेवाली भेंटों को दुगुना कर देता था। वह मन में कहता था, “एक भेंट मेरी बहुतायत में से सब लोगों के लिए होगी, और दूसरी क्षमा के लिए प्रभु परमेश्वर को होगी, ताकि मेरे लिए प्रायश्चित हो।”


    (2) अब प्रभु का महान दिन निकट आ रहा था, और इस्राएल के लोग अपनी भेंटें चढ़ा रहे थे। पर रूबेल उसके सामने आ खड़ा हुआ और बोला, “तुम्हारा सबसे पहले अपनी भेंटें चढ़ाना उचित नहीं है, क्योंकि इस्राएल में तुम्हारी कोई संतान नहीं हुई।”


    (3) इससे योआकीम बहुत दुःखी हुआ। वह लोगों के बारह गोत्रों के इतिहास-वृत्तांतों[a] के पास गया और मन में कहने लगा, “मैं इस्राएल के बारह गोत्रों के इतिहास-वृत्तांतों में देखूँगा कि क्या इस्राएल में मैं ही अकेला हूँ जिसकी कोई संतान नहीं हुई।” उसने खोज की और पाया कि इस्राएल के सभी धर्मी लोगों ने संतान उत्पन्न की थी। तब उसे स्मरण आया कि कुलपिता अब्राहम के अंतिम दिनों में प्रभु परमेश्वर ने उसे एक पुत्र, इसहाक, दिया था।


    (4) योआकीम बहुत दुःखी हुआ। वह अपनी पत्नी के पास नहीं गया, बल्कि जंगल में चला गया और वहीं अपना तंबू गाड़ लिया। उसने चालीस दिन और चालीस रात उपवास किया। वह मन में कहता था, “जब तक प्रभु मेरा परमेश्वर मेरी सुधि न ले, तब तक मैं भोजन या पानी के लिए नीचे नहीं जाऊँगा। प्रार्थना ही मेरा भोजन और पानी होगी।”


    [a] यहाँ उपलब्ध अंग्रेज़ी साक्ष्य में “इतिहास” को कोष्ठक में रखा गया है। आशय लिखित वंशावली, अभिलेख या गोत्र-वृत्तांत भी हो सकता है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध अंग्रेज़ी साक्ष्य में “इतिहास” को कोष्ठक में रखा गया है। आशय लिखित वंशावली, अभिलेख या गोत्र-वृत्तांत भी हो सकता है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: दिए गए साक्ष्य की वास्तविक शाब्दिक अनिश्चितता को पाठक के सामने सुरक्षित रखना।
lexical_decisions:
- source_word: histories
  choice: इतिहास-वृत्तांत
  rationale: साक्ष्य में शब्द संदिग्ध और कोष्ठकबद्ध है। ‘इतिहास-वृत्तांत’ अभिलेख, वंशावली या जनजातीय विवरण की संभावित व्यापकता को पूरी तरह किसी एक अर्थ में सीमित नहीं करता।
- source_word: Joachim
  choice: योआकीम
  rationale: यूनानी परंपरा में प्रचलित नाम के निकट और आधुनिक हिन्दी पाठक के लिए उच्चारण-सुगम लिप्यंतरण।
- source_word: Reubel
  choice: रूबेल
  rationale: दिए गए साक्ष्य की नाम-वर्तनी को सामान्यीकृत बाइबलीय ‘रूबेन’ में बदलने के बजाय उसकी विशिष्टता सुरक्षित रखी गई है।
- source_word: to atone for me
  choice: ताकि मेरे लिए प्रायश्चित हो
  rationale: यह वाक्य भेंट के प्रायश्चितकारी उद्देश्य को व्यक्त करता है, पर यह स्वयं योआकीम द्वारा प्रायश्चित करने का अनावश्यक अर्थ नहीं थोपता।
- source_word: considers me
  choice: मेरी सुधि न ले
  rationale: संदर्भ में परमेश्वर द्वारा ध्यान देने, कृपापूर्वक देखने या उत्तर देने का भाव है; ‘सुधि लेना’ स्वाभाविक हिन्दी में इस व्यापकता को रखता है।
- source_word: just people
  choice: धर्मी लोग
  rationale: धार्मिक-नैतिक औचित्य के पारंपरिक बाइबलीय अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुगुनी भेंट का प्रायश्चित से संबंध
  choice: ‘दूसरी क्षमा के लिए प्रभु परमेश्वर को होगी, ताकि मेरे लिए प्रायश्चित हो’
  alternative: ‘दूसरी मेरे पापों की क्षमा और प्रायश्चित के लिए होगी’
  rationale: मूल साक्ष्य ‘पापों’ को स्पष्ट नहीं करता। इसलिए उसे जोड़कर धार्मिक अर्थ को संकरा नहीं किया गया।
- issue: ‘प्रभु का महान दिन’ की पहचान
  choice: मुहावरे को यथावत रखा गया
  alternative: इसे किसी विशिष्ट पर्व का नाम देना
  rationale: उपलब्ध साक्ष्य पर्व की स्पष्ट पहचान नहीं देता; अंतकालीन या पर्व-संबंधी अर्थ में से किसी एक को निर्णायक रूप से नहीं चुना गया।
- issue: संतानहीनता और भेंट चढ़ाने की योग्यता
  choice: रूबेल के कथन के रूप में प्रस्तुत
  alternative: इसे कथाकार की स्वीकृत धार्मिक शिक्षा के रूप में कहना
  rationale: पाठ केवल रूबेल का आरोप दर्ज करता है; अनुवाद उसे सार्वभौमिक सिद्धांत या ईश्वरीय निर्णय नहीं बनाता।
- issue: अब्राहम के ‘अंतिम दिन’
  choice: ‘अंतिम दिनों में’
  alternative: ‘बुढ़ापे में’
  rationale: ‘बुढ़ापे’ का अर्थ संदर्भतः संभव है, किंतु उपलब्ध साक्ष्य के शब्दांकन को अधिक निकटता से बचाने और संभावित व्यापकता बनाए रखने हेतु शाब्दिक भाव रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज शैली। वाक्य-विन्यास कथात्मक रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-समीक्षित प्रस्तुति है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण संदिग्ध स्थलों को निर्णायक रूप से सामान्यीकृत नहीं किया गया।
