base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/022.yaml
  text: '(1) When Herod realized that the magi had tricked him, he became angry. He sent out his killers and ordered them to kill every infant two years old and younger.


    (2) When Mary heard that the infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that they were looking for John, she took him into the hills and searched for a place to hide him, but there was nowhere to hide. Then Elizabeth groaned and said, “Mountain of God, take in a mother with her child,” because Elizabeth could not climb any higher. Immediately, the mountain split open and received her, and a light shone through the mountain for her. For an angel of the Lord was with them, protecting them.'
translation:
  language: hi
  text: '(1) जब हेरोदेस ने देखा कि ज्योतिषियों ने उसे धोखा दिया है, तो वह क्रोधित हो गया। उसने अपने हत्यारों को भेजकर आदेश दिया कि वे दो वर्ष और उससे कम आयु के सभी शिशुओं को मार डालें।


    (2) जब मरियम ने सुना कि शिशुओं को मारा जा रहा है, तो वह डर गई। उसने अपने बच्चे को लिया, उसे कपड़ों में लपेटा और गायों की चरनी में रख दिया।


    (3) जब एलिज़ाबेथ ने सुना कि यूहन्ना को ढूँढ़ा जा रहा है, तो वह उसे लेकर पहाड़ियों में चली गई और उसे छिपाने के लिए कोई जगह खोजने लगी, पर छिपने की कोई जगह नहीं थी। तब एलिज़ाबेथ ने कराहकर कहा, “परमेश्वर के पर्वत, एक माँ को उसके बच्चे समेत अपने भीतर ले ले,” क्योंकि एलिज़ाबेथ इससे अधिक ऊपर नहीं चढ़ सकती थी। उसी क्षण पर्वत फट गया और उसने उसे अपने भीतर ले लिया; और पर्वत के भीतर उसके लिए एक प्रकाश चमका। क्योंकि प्रभु का एक स्वर्गदूत उनके साथ था और उनकी रक्षा कर रहा था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र के अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है। यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष मिलान अभी शेष है।
    reason: प्रस्तुत स्रोत-सामग्री में प्रत्यक्ष यूनानी समीक्षा लंबित बताई गई है; पाठकीय और संपादकीय पारदर्शिता के लिए यह सीमा स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: magi
  choice: ज्योतिषियों
  rationale: मागी प्राचीन पूर्वी विद्वान और तारों के ज्ञाता थे; ‘ज्योतिषी’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है और उन्हें अनिवार्य रूप से राजा नहीं बनाता।
- source_word: killers
  choice: हत्यारों
  rationale: साक्ष्य में प्रयुक्त कठोर और प्रत्यक्ष पद को बनाए रखा गया है; ‘सैनिकों’ कहने से ऐसी सूचना जुड़ती जो उपलब्ध पाठ में स्पष्ट नहीं है।
- source_word: infants
  choice: शिशुओं
  rationale: आयु-संदर्भ के अनुरूप सहज और स्पष्ट आधुनिक हिन्दी पद।
- source_word: manger for cows
  choice: गायों की चरनी
  rationale: ‘चरनी’ पशुओं के चारा खाने का पात्र है और दृश्य को संक्षेप में स्पष्ट करती है; गायों का उल्लेख साक्ष्य के अनुसार रखा गया है।
- source_word: Mountain of God
  choice: परमेश्वर के पर्वत
  rationale: सम्बोधन की असामान्य एवं धार्मिक छवि को व्याख्यात्मक रूप से सरल किए बिना सुरक्षित रखा गया है।
- source_word: took her / received her
  choice: उसे अपने भीतर ले लिया
  rationale: पर्वत के फटने और एलिज़ाबेथ को आश्रय देने की अलौकिक क्रिया को प्रसंगानुकूल स्पष्ट करता है।
- source_word: angel of the Lord
  choice: प्रभु का एक स्वर्गदूत
  rationale: अनिश्चितता को बनाए रखने के लिए ‘एक’ रखा गया है; इसे किसी विशिष्ट नामित स्वर्गदूत के रूप में नहीं पहचाना गया।
theological_decisions:
- issue: पर्वत का फटना और एलिज़ाबेथ को ग्रहण करना
  choice: घटना को कथानक में वर्णित प्रत्यक्ष अलौकिक घटना के रूप में अनूदित किया गया।
  alternative: इसे रूपक, गुफा या केवल प्राकृतिक दरार के रूप में समझाकर प्रस्तुत करना।
  rationale: उपलब्ध साक्ष्य पर्वत के तत्काल फटने और उसे भीतर लेने की बात करता है; अनुवाद व्याख्यात्मक प्राकृतिककरण नहीं करता।
- issue: स्वर्गदूत की रक्षात्मक उपस्थिति
  choice: ‘उनके साथ था और उनकी रक्षा कर रहा था’
  alternative: स्वर्गदूत को प्रकाश का प्रत्यक्ष स्रोत या पर्वत फाड़ने वाला बताना।
  rationale: पाठ स्वर्गदूत की उपस्थिति और संरक्षण बताता है, पर इन विशिष्ट कार्यों का कर्ता स्पष्ट रूप से निर्धारित नहीं करता।
- issue: ‘उनके’ का संदर्भ
  choice: बहुवचन सर्वनाम सुरक्षित रखा गया।
  alternative: केवल एलिज़ाबेथ अथवा केवल यूहन्ना को संरक्षित व्यक्ति बताना।
  rationale: उपलब्ध साक्ष्य में बहुवचन है, जो स्वाभाविक रूप से माँ और बच्चे दोनों की ओर संकेत करता है; इसे एक व्यक्ति तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। कथात्मक पुनरावृत्ति और अलौकिक तनाव सुरक्षित हैं। व्यक्तिनामों के लिए प्रचलित हिन्दी बाइबिलीय रूप—हेरोदेस, मरियम, एलिज़ाबेथ और यूहन्ना—अपनाए गए हैं। प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण मसौदा जानबूझकर उपलब्ध अंग्रेज़ी साक्ष्य से आगे के सूक्ष्म पाठगत दावे नहीं करता।
