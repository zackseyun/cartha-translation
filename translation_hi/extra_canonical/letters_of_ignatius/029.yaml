  witness_license: Public domain witness
  english_witness: 'Seeing then that in the aforementioned persons I beheld your whole people in faith and embraced them, I advise you, be ye zealous to do all things in godly concord, the bishop presiding after the likeness of God and the presbyters after the likeness of the council of the Apostles, with the deacons also who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore do ye all study conformity to God and pay reverence one to another; and let no man regard his neighbor after the flesh, but love ye one another in Jesus Christ always. Let there be nothing among you which shall have power to divide you, but be ye united with the bishop and with them that preside over you as an ensample and a lesson of incorruptibility.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/029.yaml
  text: 'Since, in the persons mentioned above, I saw and embraced your whole people in faith, I urge you: be zealous to do all things in godly concord, with the bishop presiding after the likeness of God, the presbyters after the likeness of the council of the Apostles, and also the deacons, who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore, all of you, study conformity to God and show reverence to one another. Let no one regard a neighbor after the flesh, but always love one another in Jesus Christ. Let there be nothing among you that has power to divide you; rather, be united with the bishop and with those who preside over you, as an example and a lesson of incorruptibility.'
translation:
  language: hi
  text: 'क्योंकि ऊपर बताए गए व्यक्तियों में मैंने विश्वास की दृष्टि से आपकी पूरी मंडली को देखा और उनसे प्रेमपूर्वक मिला, इसलिए मैं आपसे आग्रह करता हूँ: परमेश्वर से मिलनेवाली एकता में सब कुछ करने के लिए उत्साही रहो। बिशप परमेश्वर के स्थान पर[a] अध्यक्षता करे, प्राचीन प्रेरितों की परिषद के स्थान पर हों, और डीकन भी उनके साथ रहें—वे मुझे अत्यन्त प्रिय हैं और उन्हें यीशु मसीह की सेवा का दायित्व सौंपा गया है। वही मसीह युगों से पहले पिता के साथ था और समय के अन्त में प्रकट हुआ।


    इसलिए तुम सब परमेश्वर-जैसा स्वभाव अपनाओ[b] और एक-दूसरे का आदर करो। कोई भी अपने पड़ोसी को केवल शारीरिक दृष्टि से न देखे, बल्कि यीशु मसीह में सदा एक-दूसरे से प्रेम करो। तुम्हारे बीच ऐसी कोई बात न रहे जो तुम्हें बाँट सके। इसके बजाय, बिशप और अपने अगुवों के साथ एक हो जाओ, ताकि तुम अविनाशी जीवन का आदर्श और पाठ[c] बनो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “परमेश्वर के स्थान पर।” इसका आशय प्रतिनिधिक क्रम से है; यह बिशप को परमेश्वर के समान ठहराने का कथन नहीं है।
    reason: यूनानी εἰς τόπον θεοῦ और उपलब्ध अंग्रेज़ी साक्ष्य के ‘after the likeness of God’ के बीच अनुवादगत अंतर को पारदर्शी बनाना।
  - marker: b
    text: इस दुर्लभ अभिव्यक्ति का अनुवाद “परमेश्वर के अनुरूप आचरण अपनाओ” भी हो सकता है।
    reason: ὁμοήθεια θεοῦ में समान स्वभाव, समान चाल-चलन या अनुरूपता के संभावित अर्थों को सुरक्षित रखना।
  - marker: c
    text: शाब्दिक रूप से, “अविनाशिता का प्रतिरूप और शिक्षा।”
    reason: ἀφθαρσία के अमूर्त और संभवतः नैतिक तथा अंतिम-काल संबंधी दोनों आयामों को दिखाना।
lexical_decisions:
- source_word: ὁμόνοια θεοῦ
  choice: परमेश्वर से मिलनेवाली एकता
  rationale: यूनानी पद में सहमति, एकचित्तता और सामंजस्य का भाव है। हिन्दी में इसे केवल मानवीय सहमति न बनाकर परमेश्वर-संबंधी/परमेश्वर-प्रदत्त एकता के रूप में रखा गया है।
- source_word: ἐπίσκοπος
  choice: बिशप
  rationale: दूसरी शताब्दी के विशिष्ट कलीसियाई पद को सामान्य ‘अध्यक्ष’ या आधुनिक ‘निरीक्षक’ में विलीन न करके प्रचलित ऐतिहासिक पदनाम रखा गया है।
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: कलीसियाई पद के अर्थ में आधुनिक हिन्दी मसीही पाठकों के लिए परिचित शब्द चुना गया है; इसका अर्थ केवल अधिक आयु वाले लोग नहीं है।
- source_word: διάκονοι / διακονία
  choice: डीकन / सेवा का दायित्व
  rationale: पदनाम के लिए ऐतिहासिक शब्द रखा गया है, जबकि संबंधित कार्य को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: κατὰ σάρκα
  choice: केवल शारीरिक दृष्टि से
  rationale: ‘शरीर के अनुसार’ के शाब्दिक रूप की अस्पष्टता बनाए रखते हुए हिन्दी में दृष्टिकोण का भाव स्पष्ट किया गया है; ‘केवल’ यह संकेत देता है कि मनुष्य को बाहरी या सांसारिक मानदंडों तक सीमित न किया जाए।
- source_word: ἀφθαρσία
  choice: अविनाशी जीवन
  rationale: अमूर्त ‘अविनाशिता’ की अपेक्षा सामान्य पाठक के लिए सहज रूप चुना गया है, पर नाश या भ्रष्टता से परे रहने का मूल भाव सुरक्षित है।
theological_decisions:
- issue: बिशप और परमेश्वर के संबंध का रूपक
  choice: परमेश्वर के स्थान पर
  alternative: परमेश्वर की समानता के अनुसार / परमेश्वर के प्रतिरूप के रूप में
  rationale: मध्य-पाठ-परंपरा के यूनानी εἰς τόπον θεοῦ का सीधा अर्थ स्थान या प्रतिनिधिक स्थिति की ओर संकेत करता है। इसे सत्ता की समानता या दैवीकरण के रूप में नहीं बढ़ाया गया; फुटनोट में सीमा स्पष्ट की गई है।
- issue: मसीह का पूर्व-अस्तित्व
  choice: युगों से पहले पिता के साथ था
  alternative: संसारों से पहले पिता के साथ था
  rationale: πρὸ αἰώνων समयगत युगों की ओर अधिक स्वाभाविक रूप से संकेत करता है। कथन की मसीह-विषयक दृढ़ता को नरम नहीं किया गया।
- issue: ‘समय के अन्त में’ प्रकट होना
  choice: समय के अन्त में प्रकट हुआ
  alternative: अन्तिम समय में दिखाई दिया
  rationale: देहधारण/ऐतिहासिक प्रकटीकरण का कथन खुला रखा गया है; अनावश्यक रूप से जन्म, देहधारण या पुनरागमन में से किसी एक की व्याख्या नहीं थोपी गई।
- issue: अविनाशिता का आदर्श और शिक्षा
  choice: अविनाशी जीवन का आदर्श और पाठ बनो
  alternative: अविनाशिता के नमूने और शिक्षा के लिए एक हो जाओ
  rationale: वाक्य के नैतिक और सामुदायिक प्रयोजन को स्वाभाविक हिन्दी में रखा गया है, बिना इसे किसी विशेष मोक्ष-सिद्धांत में सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक और उपदेशात्मक शैली रखी गई है। ‘बिशप’, ‘प्राचीन’ और ‘डीकन’ ऐतिहासिक पदों के भेद को सुरक्षित रखते हैं। प्रत्यक्ष यूनानी समीक्षा उपलब्ध पाठ-साक्ष्य और मध्य-पाठ-परंपरा के प्रचलित रूप के आधार पर की गई है, पर दी गई मेटाडेटा के अनुसार पूर्ण पांडुलिपीय स्रोत-समीक्षा अभी लंबित है; इसलिए दुर्लभ या विवाद्य पदों पर फुटनोट द्वारा विकल्प सुरक्षित रखे गए हैं।
