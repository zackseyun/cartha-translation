base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/078.yaml
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
translation:
  language: hi
  text: क्योंकि उसने ये सब कष्ट हमारे लिए सहे [ताकि हमारा उद्धार हो सके]। उसने सचमुच कष्ट सहा, जैसे उसने सचमुच अपने आप को जिलाया भी। यह वैसा नहीं था जैसा कुछ अविश्वासी कहते हैं—कि उसने केवल दिखावे में कष्ट सहा; वे स्वयं भी केवल दिखावा हैं। जैसा उनका मत है, वैसा ही उनके साथ होगा, क्योंकि वे देहरहित और दुष्टात्माओं के समान हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; मध्य-पाठ-परंपरा के यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। वर्ग कोष्ठक साक्ष्य में दिए गए पुनर्स्थापन-संकेत को सुरक्षित रखते हैं।
    reason: स्रोत-भाषा समीक्षा की स्थिति और कोष्ठकित पाठ की पाठालोचनात्मक प्रकृति पारदर्शी करना।
lexical_decisions:
- source_word: suffered
  choice: कष्ट सहा
  rationale: यह स्वाभाविक आधुनिक हिन्दी में वास्तविक दुःख और यातना दोनों को समेटता है।
- source_word: raised Himself
  choice: अपने आप को जिलाया
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के आत्मवाचक रूप को बनाए रखा गया है; इसे निष्क्रिय ‘जिलाया गया’ में बदलकर संभावित धर्मवैज्ञानिक तनाव को नहीं मिटाया गया।
- source_word: in semblance
  choice: केवल दिखावे में
  rationale: यह कथित अवास्तविक देहधारण और दुःखभोग के विचार को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: mere semblance
  choice: केवल दिखावा
  rationale: मूल वाक्य की व्यंग्यात्मक पुनरुक्ति को बनाए रखने के लिए पहले प्रयोग से lexical correspondence रखा गया।
- source_word: without body
  choice: देहरहित
  rationale: संक्षिप्त, गरिमापूर्ण और प्राचीन विवाद की देह-संबंधी भाषा के अनुकूल।
- source_word: demon-like
  choice: दुष्टात्माओं के समान
  rationale: ‘दानव-जैसे’ की अपेक्षा धार्मिक संदर्भ में अधिक स्वाभाविक हिन्दी, जबकि तुलना को पहचान की घोषणा नहीं बनाया गया।
theological_decisions:
- issue: मसीह के दुःखभोग की वास्तविकता
  choice: उसने सचमुच कष्ट सहा
  alternative: उसने वास्तव में दुःख उठाया
  rationale: दोकेतिक दावे के विरुद्ध कथन का स्पष्ट बल रखा गया, बिना अतिरिक्त सिद्धान्त जोड़ने के।
- issue: पुनरुत्थान में आत्मवाचक क्रिया
  choice: उसने सचमुच अपने आप को जिलाया
  alternative: वह सचमुच जी उठा
  rationale: अंग्रेज़ी साक्ष्य में उपस्थित ‘raised Himself’ को सुरक्षित रखा गया; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण इसे अधिक परिचित धर्मवैज्ञानिक वाक्य में समतल नहीं किया गया।
- issue: विरोधियों के मत और उनके परिणाम का संबंध
  choice: जैसा उनका मत है, वैसा ही उनके साथ होगा
  alternative: वे जैसा मानते हैं, उनके साथ वैसा ही घटेगा
  rationale: कथन की जानबूझकर तीखी और कुछ हद तक रहस्यमय प्रतिफल-भाषा को बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठकों के लिए बोधगम्य शैली अपनाई गई है। विवादात्मक तीखापन तथा ‘सचमुच/दिखावे’ का विरोध सुरक्षित रखा गया है।
