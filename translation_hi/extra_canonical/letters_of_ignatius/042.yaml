base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/042.yaml
  text: 'In the same way, let everyone respect the deacons as Jesus Christ, just as they should respect the bishop as a representation of the Father, and the presbyters as the council of God and the assembly of the apostles. Apart from these, there is not even the name of a church.


    I am convinced that you think this way concerning these matters, for I received an example of your love and have it with me in the person of your bishop. His very conduct is a great lesson, while his gentleness is power—a man to whom I think even the godless show reverence.


    Because I love you, I spare you in this way, though I could write more sharply on his behalf. But I did not consider myself qualified to do this: as a convict, to give you orders as though I were an apostle.'
translation:
  language: hi
  text: 'इसी प्रकार, सब लोग सेवकों[a] का आदर यीशु मसीह के समान करें; और बिशप[b] का आदर पिता के प्रतिरूप के रूप में, तथा प्राचीनों का आदर परमेश्वर की परिषद और प्रेरितों के समूह के रूप में करें। इनके बिना कलीसिया का नाम तक नहीं होता।


    मुझे विश्वास है कि इन बातों के विषय में तुम्हारी सोच भी ऐसी ही है; क्योंकि तुम्हारे बिशप के व्यक्तित्व में मुझे तुम्हारे प्रेम का एक नमूना मिला है, और वह मेरे साथ है। उनका आचरण अपने-आप में एक बड़ी शिक्षा है, और उनकी नम्रता ही उनकी सामर्थ्य है। मुझे लगता है कि परमेश्वर को न माननेवाले भी उनका आदर करते हैं।


    मैं तुमसे प्रेम करता हूँ, इसलिए इस प्रकार तुम्हें छोड़ देता हूँ, यद्यपि उनकी ओर से मैं और कठोरता से लिख सकता था। पर मैंने अपने आपको इसके योग्य नहीं समझा कि एक दोषी ठहराया हुआ बंदी[c] होकर तुम्हें इस तरह आदेश दूँ, मानो मैं कोई प्रेरित हूँ।'
  philosophy: optimal-equivalence
