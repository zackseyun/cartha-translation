    reason: प्रचलित पदनाम के साथ उसके मूल कार्यात्मक अर्थ और अनुवाद-विकल्प को बताना।
  - marker: c
    text: यह पद किसी दोषी ठहराए गए व्यक्ति या बंदी का भाव दे सकता है। यहाँ लेखक अपनी कैद और निम्न स्थिति की ओर संकेत करता है; यूनानी स्रोत की सीधी समीक्षा अभी शेष है।
    reason: अंग्रेज़ी witness के ‘convict’ में नैतिक, न्यायिक और कारावास-संबंधी अर्थों की अस्पष्टता सुरक्षित रखना।
