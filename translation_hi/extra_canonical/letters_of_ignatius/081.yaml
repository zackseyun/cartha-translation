lexical_decisions:
- source_word: ἀρνοῦνται / ἠρνήθησαν (as reflected in witness)
  choice: नकारते हैं / नकार दिया है
  rationale: सक्रिय और कर्मवाच्य के जानबूझकर रखे गए विरोध को सुरक्षित रखा गया है।
- source_word: σάρκα φορεῖν / σαρκophoric image (as reflected in witness)
  choice: देहधारी था
  rationale: ‘मांस का वाहक’ का यांत्रिक अनुवाद करने के बजाय वास्तविक देह धारण करने का आशय स्वाभाविक हिन्दी में दिया गया है; चित्रात्मक शाब्दिकता पादटिप्पणी में सुरक्षित है।
- source_word: νεκροφόρος (as reflected in witness ‘bearer of a corpse’)
  choice: शव ढोनेवाला
  rationale: मूल के तीखे विरोधी चित्र को नरम किए बिना हिन्दी में सुरक्षित रखता है।
- source_word: πάθος (as reflected in witness ‘passion’)
  choice: दुःखभोग
  rationale: यहाँ मसीह की पीड़ा और मृत्यु का संकेत है; ‘जुनून’ भ्रामक होता और केवल ‘पीड़ा’ पूर्ण धार्मिक-साहित्यिक अर्थ को कम कर देती।
- source_word: μετανοήσωσιν (as reflected in witness ‘repent’)
  choice: मन न फिराएँ
  rationale: पश्चात्ताप के साथ दिशा-परिवर्तन का अर्थ सामान्य और बाइबलीय हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: मसीह के देहधारण की स्वीकारोक्ति
  choice: यह स्वीकार नहीं करता कि वह देहधारी था
  alternative: यह अंगीकार नहीं करता कि वह मांस का वाहक था
  rationale: लेखक का देह-विरोधी मत के विरुद्ध दावा स्पष्ट रखा गया है, पर कोई बाद की संप्रदायगत शब्दावली नहीं जोड़ी गई।
- issue: ‘दुःखभोग ... हमारा पुनरुत्थान है’ का संबंध
  choice: उस दुःखभोग की ओर ... जो हमारा पुनरुत्थान है
  alternative: उस दुःखभोग की ओर लौटें, जिसके द्वारा हमारा पुनरुत्थान होता है
  rationale: साक्षी के साहसी समतुल्य-विधान को कारणात्मक व्याख्या में बदलकर धार्मिक तनाव को हल नहीं किया गया।
- issue: ‘उसी ने उन्हें नकार दिया’
  choice: कर्मवाच्य को मसीह के कर्तृत्व के साथ रखा
  alternative: वे स्वयं उससे अलग हो गए हैं
  rationale: मूल साक्ष्य में उपस्थित न्याय-संबंधी उलटाव को सुरक्षित रखा गया, उसे आत्म-वियोग की व्याख्या में नहीं बदला।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। अनुच्छेदों की तर्कात्मक तीक्ष्णता, पुनरुक्त विरोध और धार्मिक तनाव सुरक्षित रखे गए हैं। उपलब्ध आधार प्रत्यक्ष यूनानी समीक्षा के बजाय सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; इसलिए यूनानी पदों के उल्लेख साक्षी से अनुमानित हैं और अंतिम स्रोत-भाषा समीक्षा अपेक्षित है।
