  english_witness: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/026.yaml
  text: 'Yes, and it is fitting for you also not to presume upon the youth of your bishop, but, in accordance with the power of God the Father, to show him every reverence. I have learned that the holy presbyters likewise have not taken advantage of his outwardly youthful condition, but yield to him as to one who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop of all.


    Therefore, for the honor of Him who desired you, it is right that you should obey without pretense. For a person does not so much deceive this visible bishop as cheat the One who is invisible; and in such a case, that person must reckon not with flesh but with God, who knows the hidden things.'
translation:
  language: hi
  text: 'हाँ, तुम्हारे लिए भी यह उचित है कि तुम अपने बिशप की युवावस्था का अनुचित लाभ न उठाओ, बल्कि परमेश्वर पिता की सामर्थ्य के अनुसार उसका हर प्रकार से आदर करो। मैंने जाना है कि पवित्र प्राचीनों ने भी उसके बाहरी रूप से युवा होने का लाभ नहीं उठाया, बल्कि उसे परमेश्वर में बुद्धिमान मानकर उसके लिए स्थान छोड़ते हैं; फिर भी ऐसा वे उसके लिए नहीं, बल्कि यीशु मसीह के पिता के लिए करते हैं, जो सबके बिशप हैं।[a]


    इसलिए, जिसने तुम्हें चाहा उसके सम्मान के लिए तुम्हारा निष्कपट होकर आज्ञा मानना उचित है।[b] क्योंकि कोई व्यक्ति इस दिखाई देनेवाले बिशप को जितना धोखा देता है, उससे कहीं अधिक उस अदृश्य को छलता है; और ऐसे मामले में उसे मनुष्य को नहीं, बल्कि परमेश्वर को हिसाब देना है, जो छिपी हुई बातें जानता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘बिशप’ का मूल अर्थ ‘निरीक्षक’ या ‘देखरेख करनेवाला’ है। लेखक यही पद-संज्ञा स्थानीय कलीसियाई अगुवे और परमेश्वर पिता—दोनों के लिए प्रयोग करता है।
    reason: मूल के पद-संज्ञात्मक संबंध को स्पष्ट करना, जबकि पाठ में ‘बिशप’ को बनाए रखना।
  - marker: b
    text: ‘जिसने तुम्हें चाहा’ का आशय मूल में संक्षिप्त और कुछ हद तक अस्पष्ट है; इसका अर्थ ‘जिसने तुम्हें अपने लिए चाहा’ या ‘जिसकी इच्छा तुम पर हुई’ भी समझा जा सकता है।
    reason: साक्षी में विद्यमान अस्पष्टता को किसी एक व्याख्या से समाप्त न करना।
lexical_decisions:
- source_word: bishop / Greek episkopos
  choice: बिशप
  rationale: यह आधुनिक हिन्दी मसीही प्रयोग में इस विशिष्ट कलीसियाई पद का सर्वाधिक सहज और पहचाना जानेवाला नाम है; ‘अध्यक्ष’ मूल पद-संज्ञा को सामान्य बना देता।
- source_word: presbyters / Greek presbyteroi
  choice: प्राचीन
  rationale: यह आरम्भिक कलीसिया के पद को दर्शाने वाला प्रचलित बाइबलीय हिन्दी शब्द है और ‘पुरोहित’ जैसे बाद के संस्थागत अर्थों से बचता है।
- source_word: render every reverence / Greek pasan entropēn aponemein
  choice: पूरा आदर करो
  rationale: मूल के सम्मान और संकोचपूर्ण आदर के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: yield / Greek synchōrountas
  choice: उसे स्थान देते हैं
  rationale: यह उसके पद और निर्णय के आगे सम्मानपूर्वक स्थान देने का भाव रखता है, बिना पूर्ण आत्मसमर्पण का अतिरिक्त अर्थ जोड़े।
- source_word: without dissimulation / Greek anypokritōs
  choice: निष्कपट होकर
  rationale: मूल में पाखंड या दिखावे से रहित आज्ञाकारिता का भाव है।
- source_word: reckon not with flesh / Greek ou pros sarka ho logos
  choice: सामना किसी मनुष्य से नहीं
  rationale: शाब्दिक ‘मांस से हिसाब नहीं’ हिन्दी में अस्पष्ट होता; यह न्यायोत्तरदायित्व के संदर्भ को स्वाभाविक रूप से व्यक्त करता है, जबकि अगले वाक्यांश में परमेश्वर के प्रति उत्तरदायित्व बना रहता है।
theological_decisions:
- issue: युवा बिशप के प्रति आदर का आधार
  choice: आदर को परमेश्वर पिता के सामर्थ्य और अंततः पिता के प्रति दिए गए सम्मान से जोड़ा गया है।
  alternative: बिशप को स्वयं में परमेश्वर के समान आदर का अधिकारी बताना।
  rationale: पाठ स्वयं ‘उसे नहीं, बल्कि... पिता को’ कहकर प्रतिनिधिक आज्ञाकारिता और परमेश्वर के सर्वोच्च अधिकार के बीच तनाव बनाए रखता है।
- issue: ‘सबके बिशप’ उपाधि
  choice: परमेश्वर पिता के लिए ‘सबके बिशप’ बनाए रखा गया है।
  alternative: ‘सबके निरीक्षक’ या ‘सर्वोच्च अध्यक्ष’ करना।
  rationale: मूल में एक ही पद-संज्ञा स्थानीय बिशप और परमेश्वर दोनों के लिए प्रयुक्त होकर जानबूझकर संबंध स्थापित करती है; उसे बनाए रखना धर्मवैचारिक और आलंकारिक रूप से महत्त्वपूर्ण है।
- issue: अदृश्य को छलना
  choice: ‘उस अदृश्य को छलने का प्रयास करता है’
  alternative: ‘अदृश्य परमेश्वर को वास्तव में धोखा देता है’
  rationale: परमेश्वर सर्वज्ञ हैं और वास्तव में धोखा नहीं खाते; मूल क्रिया छलने/गलत हिसाब लगाने के प्रयास का भाव रख सकती है। यह अनुवाद उसी तनाव को रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामूहिक संबोधन वाली रखी गई है। पद-संज्ञाओं में ‘बिशप’ और ‘प्राचीन’ का प्रयोग किया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी और मध्य-पाठ-परंपरा संबंधी ज्ञात यूनानी वाक्य-विन्यास है; औपचारिक प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण कठिन स्थलों पर अनावश्यक निश्चितता से बचा गया है।
