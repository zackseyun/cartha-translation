  revised_text: 'इस संसार का शासक मुझे टुकड़े-टुकड़े कर देना और परमेश्वर की ओर उन्मुख मेरे मन को भ्रष्ट करना चाहता है। इसलिए तुममें से जो पास हैं, उनमें से कोई भी उसकी सहायता न करे। इसके बजाय मेरा पक्ष लो—अर्थात परमेश्वर का पक्ष। यीशु मसीह की बातें करते हुए संसार की अभिलाषा मत रखो। ईर्ष्या को अपने भीतर घर न करने दो।


