base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/060.yaml
  text: 'The ruler of this world wants to tear me to pieces and corrupt my mind toward God. Therefore, let none of you who are near help him. Instead, stand on my side—that is, on God’s side. Do not speak of Jesus Christ while also desiring the world. Do not let envy make its home in you.


    Even if I myself, when I am with you, should plead with you, do not obey me. Instead, believe what I am writing to you. [For] I write to you while still alive, yet longing for death. My desire has been crucified, and there is no fire of material longing in me. There is only living water, speaking within me and saying, “Come to the Father.”


    I take no delight in the food of corruption or in the pleasures of this life. I desire the bread of God, which is the flesh of Christ, who was from the seed of David; and as my drink I desire his blood, which is incorruptible love.'
translation:
  language: hi
  text: 'इस संसार का शासक मुझे टुकड़े-टुकड़े कर देना और परमेश्वर की ओर उन्मुख मेरे मन को भ्रष्ट करना चाहता है। इसलिए तुममें से जो पास हैं, उनमें से कोई भी उसकी सहायता न करे। इसके बजाय मेरा पक्ष लो—अर्थात परमेश्वर का पक्ष। यीशु मसीह की बातें करते हुए संसार की अभिलाषा मत रखो। ईर्ष्या को अपने भीतर घर न करने दो।


    जब मैं तुम्हारे बीच रहूँ, तब यदि मैं स्वयं भी तुमसे विनती करूँ, तो मेरी बात मत मानना; बल्कि जो बातें मैं तुम्हें लिख रहा हूँ, उन्हीं पर विश्वास करना। [क्योंकि][a] मैं जीवित रहते हुए तुम्हें लिख रहा हूँ, फिर भी मृत्यु की लालसा रखता हूँ। मेरी अभिलाषा क्रूस पर चढ़ा दी गई है, और मुझमें भौतिक वस्तुओं की चाह की कोई आग नहीं है। मेरे भीतर केवल जीवित जल है, जो बोलता और कहता है, “पिता के पास आओ।”


    नाशवान भोजन या इस जीवन के सुखों में मुझे कोई आनंद नहीं मिलता। मैं परमेश्वर की रोटी चाहता हूँ, जो मसीह का शरीर है—उस मसीह का, जो दाऊद के वंश से था; और पीने के लिए मैं उसका लहू चाहता हूँ, जो अविनाशी प्रेम है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “क्योंकि” उपलब्ध अंग्रेज़ी साक्ष्य में कोष्ठकों में है; यह संभवतः संपादकीय रूप से जोड़ा गया संयोजक है।
    reason: आपूर्त पाठ में दिए गए संपादकीय पुनर्स्थापन संकेत को दृश्यमान रखना।
lexical_decisions:
- source_word: ὁ ἄρχων τοῦ αἰῶνος τούτου (witness sense)
  choice: इस संसार का शासक
  rationale: इग्नातियुस और यूहन्नाई परंपरा में प्रचलित पदबंध का स्वाभाविक और औपचारिक रूप; इसे किसी विशिष्ट नाम से पहचानकर निहितार्थ को अधिक स्पष्ट नहीं किया गया।
- source_word: διαφθεῖραι ... γνώμην τὴν εἰς θεόν (witness sense)
  choice: परमेश्वर की ओर लगे मेरे मन को भ्रष्ट करना
  rationale: ‘toward God’ की दिशात्मकता बनाए रखते हुए ‘mind’ को केवल बुद्धि नहीं, भीतरी अभिमुखता के अर्थ में प्रस्तुत किया।
- source_word: ἐπιθυμία
  choice: अभिलाषा
  rationale: यह शब्द सांसारिक कामना और मृत्यु की प्रबल चाह—दोनों प्रसंगों में आ सकता है; ‘वासना’ कहने से अनावश्यक यौन अर्थ हावी होता।
- source_word: ὕδωρ ζῶν
  choice: जीवित जल
  rationale: आरंभिक मसीही और बाइबिलीय प्रतिध्वनि को बनाए रखने वाला परिचित पदबंध।
- source_word: ἄρτον θεοῦ
  choice: परमेश्वर की रोटी
  rationale: मूल रूपक और उसके यूखरिस्तीय/मसीह-केंद्रित तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा।
- source_word: σπέρματος Δαυίδ
  choice: दाऊद के वंश
  rationale: शाब्दिक ‘बीज’ की वंशावली-संबंधी भावना को आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त किया।
- source_word: ἀγάπη ἄφθαρτος
  choice: अविनाशी प्रेम
  rationale: रक्त और प्रेम के बीच मूल का सीधा संबंध बनाए रखा; इसे ‘अविनाशी प्रेम का चिह्न’ बनाकर व्याख्यायित नहीं किया।
theological_decisions:
- issue: ‘मेरी अभिलाषा क्रूस पर चढ़ा दी गई है’ का आशय
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: ‘मेरी सांसारिक कामनाएँ मर चुकी हैं’
  rationale: मूल कथन जानबूझकर तीखा और बहुअर्थी है; व्याख्यात्मक विकल्प क्रूस-संबंधी प्रतिध्वनि और व्यक्तिगत अभिलाषा के तनाव को घटा देता।
- issue: ‘जीवित जल’ की पहचान
  choice: उसकी पहचान स्पष्ट किए बिना व्यक्तिकृत वाणी को रखा गया
  alternative: इसे पवित्र आत्मा या मसीह के रूप में स्पष्ट करना
  rationale: पाठ स्वयं नाम नहीं देता; किसी एक धर्मवैज्ञानिक पहचान को थोपना उचित नहीं।
- issue: मसीह का शरीर और लहू
  choice: ‘शरीर’ और ‘लहू’ का प्रत्यक्ष कथन रखा गया
  alternative: ‘मसीह से मिलने वाली आत्मिक रोटी और पेय’
  rationale: मूल की देहधारण-संबंधी और संस्कार-संबंधी सघनता को किसी संप्रदायगत व्याख्या में बदले बिना सुरक्षित रखा।
- issue: ‘उसका लहू, जो अविनाशी प्रेम है’ में संबंध
  choice: संबंधवाचक उपवाक्य को सीधे ‘लहू’ से जोड़ा
  alternative: ‘उसका लहू—अर्थात उसके अविनाशी प्रेम का प्रमाण’
  rationale: मूल की साहसी समानाधिकरणात्मक भाषा को नरम या व्याख्यायित नहीं किया।
- issue: मृत्यु की लालसा
  choice: ‘मृत्यु की लालसा रखता हूँ’
  alternative: ‘शहीद होने की लालसा रखता हूँ’
  rationale: ऐतिहासिक संदर्भ शहादत की ओर संकेत करता है, पर इस वाक्य में मृत्यु का सीधा शब्द है; अनुवाद ने निहित संदर्भ को मुख्य पाठ में नहीं जोड़ा।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सीधे संबोधन वाला रूप अपनाया गया है। ‘मेरा पक्ष लो—अर्थात परमेश्वर का पक्ष’ जैसे वाक्यों में मूल की तात्कालिकता और अलंकारिक तीक्ष्णता रखी गई है। यूनानी स्रोत-पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण निर्णय उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और दिए गए स्रोत-संबंधी संकेतों पर आधारित हैं; इसलिए जहाँ संभव था, अस्पष्टता को व्याख्या द्वारा समाप्त नहीं किया गया।
