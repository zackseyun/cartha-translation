    नाशवान भोजन या इस जीवन के सुखों में मुझे कोई आनंद नहीं मिलता। मैं परमेश्वर की रोटी चाहता हूँ, जो मसीह का शरीर है—उस मसीह का, जो दाऊद के वंश से था; और पीने के लिए मैं उसका लहू चाहता हूँ, जो अविनाशी प्रेम है।'
