base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/069.yaml
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  language: hi
  text: 'मेरे भाइयो, मेरा हृदय आपके प्रति प्रेम से पूरी तरह उमड़ रहा है। मैं हद से बढ़कर आनंदित होते हुए आपकी सुरक्षा की चिंता करता हूँ—फिर भी यह मैं नहीं, बल्कि यीशु मसीह हैं। उन्हीं के कारण मैं बेड़ियों में हूँ, और मुझे इस बात का और भी अधिक भय है कि मैं अब तक सिद्ध नहीं हुआ हूँ। पर आपकी प्रार्थना मुझे परमेश्वर के लिए[a] सिद्ध बनाएगी, ताकि मैं उस विरासत को पा सकूँ जिसे पाने के लिए मुझ पर दया हुई है। मैं सुसमाचार में ऐसे शरण लेता हूँ जैसे वह यीशु का शरीर हो, और प्रेरितों में ऐसे जैसे वे कलीसिया के प्राचीनों की परिषद हों।


    हाँ, हम भविष्यद्वक्ताओं से भी प्रेम करते हैं, क्योंकि उन्होंने भी अपने प्रचार में सुसमाचार की ओर संकेत किया, मसीह पर अपनी आशा रखी और उनकी बाट जोही। उन पर विश्वास करके वे भी यीशु मसीह की एकता में उद्धार पाए। वे पवित्र जन थे—पूरे प्रेम और आदर के योग्य, यीशु मसीह द्वारा स्वीकृत, और हमारी साझी आशा के सुसमाचार में सम्मिलित।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर के लिए” प्राचीन पाठ की एक अनिश्चित या पूरक पाठ-परंपरा को दर्शाता है; उपलब्ध अंग्रेज़ी गवाह में ये शब्द कोष्ठकों में हैं।
    reason: मूल यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित है और अंग्रेज़ी गवाह ने यहाँ पाठ-संबंधी अनिश्चितता का संकेत दिया है।
lexical_decisions:
- source_word: brethren
  choice: भाइयो
  rationale: संबोधन की आत्मीयता और प्राचीन पत्रात्मक शैली को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: safety
  choice: सुरक्षा
  rationale: व्यापक अर्थ को खुला रखता है; इसे केवल शारीरिक कुशलता या अंतिम उद्धार तक सीमित नहीं करता।
- source_word: wearing whose bonds
  choice: उन्हीं के कारण मैं बेड़ियों में हूँ
  rationale: मसीह से संबंधित कैद का भाव स्वाभाविक हिन्दी में देता है, बिना बेड़ियों को शाब्दिक रूप से मसीह की अपनी बेड़ियाँ बताने के।
- source_word: Gospel as the flesh of Jesus
  choice: सुसमाचार में ऐसे शरण लेता हूँ जैसे वह यीशु का शरीर हो
  rationale: स्रोत का साहसपूर्ण रूपक सुरक्षित रखा गया है और उसकी व्याख्या करके उसे कमजोर नहीं किया गया।
- source_word: presbytery of the Church
  choice: कलीसिया के प्राचीनों की परिषद
  rationale: ‘presbytery’ के सामूहिक निकाय का अर्थ देता है; किसी आधुनिक संप्रदायगत पदनाम को आरोपित नहीं करता।
- source_word: prophets
  choice: भविष्यद्वक्ता
  rationale: यह स्थापित और सामान्य बाइबलीय हिन्दी पद है।
- source_word: numbered together in the Gospel
  choice: सुसमाचार में सम्मिलित
  rationale: गिने जाने या शामिल किए जाने के सामूहिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘yet not I, but Jesus Christ’ में कर्ता का संबंध
  choice: आपकी सुरक्षा की चिंता का वास्तविक कर्ता यीशु मसीह बताए गए हैं
  alternative: इसे लेखक की विनम्रता का केवल आलंकारिक कथन मानना
  rationale: वाक्य का प्रत्यक्ष विरोध ‘मैं नहीं, बल्कि यीशु मसीह’ सुरक्षित रखा गया है, बिना उसके धर्मवैज्ञानिक अर्थ को विस्तार देने के।
- issue: ‘perfected’ का अर्थ
  choice: सिद्ध होना
  alternative: परिपक्व होना या पूर्ण बनाया जाना
  rationale: ‘सिद्ध’ नैतिक, आध्यात्मिक और सेवकाई-संबंधी संभावनाओं को खुला रखता है और प्रसंग की तनावपूर्ण विनम्रता बनाए रखता है।
- issue: भविष्यद्वक्ताओं का उद्धार और मसीह की एकता
  choice: ‘उन पर विश्वास करके वे भी यीशु मसीह की एकता में उद्धार पाए’
  alternative: उनका उद्धार केवल भविष्य में होने वाला बताना
  rationale: गवाह में प्रयुक्त पूर्ण उद्धार-वचन और मसीह-केंद्रित एकता दोनों सुरक्षित रखे गए हैं।
- issue: ‘approved of/by Jesus Christ’
  choice: यीशु मसीह द्वारा स्वीकृत
  alternative: यीशु मसीह को स्वीकार करने वाले
  rationale: अंग्रेज़ी गवाह की अधिक स्वाभाविक कर्मवाच्य समझ को अपनाया गया है, पर प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण इसे सावधानी से दर्ज किया गया है।
