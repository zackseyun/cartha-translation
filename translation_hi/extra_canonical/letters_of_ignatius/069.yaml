  english_witness: 'My brethren, my heart overfloweth altogether in love towards you; and rejoicing above measure I watch over your safety; yet not I, but Jesus Christ, wearing whose bonds I am the more afraid, because I am not yet perfected. But your prayer will make me perfect [unto God], that I may attain unto the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the Apostles as the presbytery of the Church.


