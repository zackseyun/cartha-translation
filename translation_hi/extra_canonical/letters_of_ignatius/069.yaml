  register: भाषा आधुनिक मानक हिन्दी में, आत्मीय पर गरिमापूर्ण पत्रात्मक शैली में रखी गई है। ‘कलीसिया’, ‘सुसमाचार’, ‘प्रेरित’ और ‘भविष्यद्वक्ता’ जैसे व्यापक रूप से पहचाने जाने वाले मसीही शब्द प्रयुक्त हैं। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी गवाह और दिए गए परामर्श-पाठ पर आधारित है; यूनानी मध्य-पाठ-परंपरा की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित है।
