    Now Onesimus of his own accord highly praiseth your orderly conduct in God, for that ye all live according to truth, and that no heresy hath a home among you: nay, ye do not so much as listen to any one, if he speak of aught else save concerning Jesus Christ in truth.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/007.yaml
  text: 'And in proportion as anyone sees that his bishop is silent, let him fear him the more. For everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praises your orderly conduct in God, for you all live according to truth, and no heresy has a home among you; indeed, you do not so much as listen to anyone if he speaks of anything other than Jesus Christ in truth.'
translation:
  language: hi
  text: 'और कोई जितना अधिक यह देखे कि उसका बिशप मौन है, वह उससे उतना ही अधिक डरे। क्योंकि जिस किसी को गृहस्वामी अपने घर का प्रबंधक बनाकर भेजता है, हमें उसे ऐसे स्वीकार करना चाहिए मानो वह स्वयं भेजने वाला हो। इसलिए स्पष्ट है कि हमें बिशप को स्वयं प्रभु के समान मानना चाहिए।


    अब उनेसिमुस स्वयं परमेश्वर में आपके सुव्यवस्थित आचरण की बहुत प्रशंसा करता है, क्योंकि आप सब सत्य के अनुसार जीवन जीते हैं और कोई विधर्म आपके बीच नहीं रहता। बल्कि आप किसी की सुनते भी नहीं, जब तक कि वह यीशु मसीह के विषय में सत्य के अनुसार न बोलता हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'bishop (Greek: ἐπίσκοπος, as reflected in the witness)'
  choice: बिशप
  rationale: आरंभिक कलीसियाई पदनाम को आधुनिक हिन्दी में पहचाने जाने योग्य रूप में रखा गया है; ‘अध्यक्ष’ अर्थ दे सकता है, पर ऐतिहासिक पदनाम को कम स्पष्ट करता है।
- source_word: silent
  choice: मौन रहता है
  rationale: साक्षी-पाठ की संक्षिप्त और संदर्भतः अस्पष्ट अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: fear him
  choice: उसका भय माने
  rationale: मूल-समीक्षा लंबित होने के कारण अंग्रेज़ी साक्षी में उपस्थित अर्थ-तनाव को बनाए रखा गया है; इसे केवल ‘आदर करे’ बनाकर नरम नहीं किया गया।
- source_word: Master of the household
  choice: गृहस्वामी
  rationale: घर के स्वामी और उसके द्वारा नियुक्त प्रबंधक के रूपक को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: steward
  choice: प्रबंधक
  rationale: किसी दूसरे के घर की सौंपी गई व्यवस्था संभालने वाले व्यक्ति का अर्थ स्पष्ट करता है।
- source_word: orderly conduct
  choice: सुव्यवस्थित आचरण
  rationale: समुदाय की अनुशासित व्यवस्था और जीवन-व्यवहार, दोनों का संकेत बनाए रखता है।
- source_word: heresy
  choice: विधर्म
  rationale: प्राचीन कलीसियाई संदर्भ का स्थापित धार्मिक शब्द है; यहाँ किसी आधुनिक संप्रदायगत परिभाषा को नहीं जोड़ा गया।
- source_word: has a home among you
  choice: आपके बीच ठिकाना नहीं मिलता
  rationale: आवास-रूपक को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखता है।
theological_decisions:
- issue: बिशप को भेजने वाले के समान ग्रहण करना और प्रभु के समान मानना
  choice: 'रूपक की प्रबल भाषा को यथावत रखा गया: ‘स्वयं प्रभु के समान मानना चाहिए।’'
  alternative: इसे ‘प्रभु का प्रतिनिधि मानना’ कहकर व्याख्यायित करना।
  rationale: साक्षी-पाठ प्रत्यक्ष तुलना करता है। ‘प्रतिनिधि’ जोड़ना संभावित अर्थ तो समझाता, पर पाठ की धार्मिक तीव्रता को पहले ही हल कर देता।
- issue: ‘भय’ का आशय
  choice: ‘भय माने’ रखा गया।
  alternative: ‘और अधिक आदर करे’ या ‘श्रद्धा रखे।’
  rationale: उपलब्ध अंग्रेज़ी साक्षी स्वयं संभावित अर्थ-व्याप्ति को खुला रखता है; प्रत्यक्ष यूनानी समीक्षा लंबित होने पर अस्पष्टता सुरक्षित रखना उचित है।
- issue: यीशु मसीह के विषय में सत्यतः बोलने की अंतिम शर्त
  choice: ‘यदि कोई सत्य के साथ यीशु मसीह के विषय के अलावा कुछ और कहता है’
  alternative: ‘यदि कोई सच्चे यीशु मसीह के अतिरिक्त किसी और विषय पर बोलता है।’
  rationale: वाक्यरचना यह अस्पष्ट छोड़ सकती है कि ‘सत्य के साथ’ बोलने की रीति को संशोधित करता है या यीशु मसीह-विषयक संदेश को; मुख्य पाठ में एक स्वाभाविक पाठ दिया और टिप्पणी में अनिश्चितता बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक बहुवचन और आरंभिक कलीसियाई पत्र के अनुरूप गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ शैली अपनाई गई है। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण विशेषतः ‘मौन’, ‘भय’ और अंतिम वाक्य की वाक्यरचना में साक्षी की अस्पष्टता सुरक्षित रखी गई है।
