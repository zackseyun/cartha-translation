  yaml_path: translation/extra_canonical/letters_of_ignatius/095.yaml
  text: 'Flee evil arts—or rather, hold discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If anyone is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boasts, he is lost; and if it becomes known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
translation:
  language: hi
  text: 'बुरी चालों से दूर रहो—या यों कहूँ, इन विषयों पर बातचीत करो। मेरी बहनों से कहो कि वे प्रभु से प्रेम करें और तन और मन से अपने पतियों के प्रति संतुष्ट रहें। इसी प्रकार मेरे भाइयों को भी यीशु मसीह के नाम में समझाओ कि वे अपनी पत्नियों से प्रेम करें, जैसे प्रभु ने कलीसिया से प्रेम किया।


    यदि कोई प्रभु की देह के सम्मान में ब्रह्मचर्य में बने रहने में समर्थ है, तो वह बिना घमंड किए ऐसा करे। यदि वह घमंड करता है, तो वह नाश हो गया; और यदि बिशप के अतिरिक्त किसी और को इसका पता चलता है, तो वह अशुद्ध हो गया। जब पुरुष और स्त्रियाँ विवाह करें, तो उचित है कि वे बिशप की सहमति से एक हों, ताकि उनका विवाह प्रभु के अनुसार हो, न कि वासना के अनुसार। सब कुछ परमेश्वर के सम्मान के लिए किया जाए।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है। मध्य-पाठ यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष समीक्षा अभी अपेक्षित है; विशेषकर “बुरी चालों,” “प्रभु की देह के सम्मान में,” और बिशप के अतिरिक्त किसी को ज्ञात होने वाले वाक्यांश की शब्दावली पुनरीक्षण के अधीन है।
    reason: आधार-सामग्री स्वयं बताती है कि प्रत्यक्ष यूनानी समीक्षा लंबित है; इसलिए पाठक को प्रमुख पाठगत और अर्थगत अनिश्चितताओं से अवगत कराना आवश्यक है।
lexical_decisions:
- source_word: evil arts
  choice: बुरी चालों
  rationale: यह अनुवाद हानिकारक या अनुचित युक्तियों/व्यवहारों का व्यापक अर्थ रखता है; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण अधिक विशिष्ट अर्थ नहीं थोपा गया।
- source_word: in flesh and in spirit
  choice: तन और मन से
  rationale: सामान्य आधुनिक हिन्दी में वैवाहिक निष्ठा की बाहरी और भीतरी संपूर्णता व्यक्त होती है; शाब्दिक ‘शरीर और आत्मा में’ हिन्दी में अप्राकृतिक लग सकता है।
- source_word: chastity
  choice: ब्रह्मचर्य
  rationale: संदर्भ विवाह न करने और संयम में बने रहने का है; आधुनिक पाठक के लिए संक्षिप्त और परिचित पद चुना गया।
- source_word: bishop
  choice: बिशप
  rationale: आरंभिक कलीसियाई पद के लिए प्रचलित, तटस्थ हिन्दी लिप्यंतरण रखा गया; किसी विशेष आधुनिक शासन-व्यवस्था का अर्थ नहीं जोड़ा गया।
- source_word: concupiscence
  choice: वासना
  rationale: अनियंत्रित काम-लालसा का सहज और गरिमापूर्ण आधुनिक हिन्दी समतुल्य।
- source_word: to the honor of God
  choice: परमेश्वर के सम्मान के लिए
  rationale: मूल साक्ष्य के ‘honor’ को बनाए रखा गया; इसे ‘महिमा’ में बदलकर अतिरिक्त धार्मिक अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: ‘प्रभु की देह के सम्मान में’ का आशय
  choice: वाक्यांश को निकट और अस्पष्ट रूप में सुरक्षित रखा गया
  alternative: ‘प्रभु के देहधारण के सम्मान में’ या ‘प्रभु के शरीर का आदर करने के लिए’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य कई संभावित अर्थ देता है; यूनानी स्रोत की समीक्षा के बिना किसी एक धर्मवैज्ञानिक व्याख्या को निश्चित नहीं किया गया।
- issue: बिशप की सहमति और विवाह
  choice: ‘बिशप की सहमति से’
  alternative: ‘बिशप की अनुमति से’ या ‘बिशप की उपस्थिति में’
  rationale: साक्ष्य consent कहता है; पाठ को किसी विशिष्ट संस्कारवादी या कानूनी विवाह-सिद्धांत में नहीं बदला गया।
- issue: ‘यदि ... बिशप के अतिरिक्त किसी और को पता चलता है’
  choice: कठोर कथन को ज्यों का त्यों रखा गया
  alternative: इसे केवल गुप्तता या आध्यात्मिक निर्देशन की सलाह के रूप में स्पष्ट करना
  rationale: मूल साक्ष्य का तनाव और अस्पष्टता सुरक्षित रखी गई; निजी संयम के प्रदर्शन की निंदा से आगे कोई निश्चित सिद्धांत नहीं जोड़ा गया।
- issue: कलीसिया के प्रति प्रभु का प्रेम
  choice: ‘जैसे प्रभु ने कलीसिया से प्रेम किया’
  alternative: ‘जैसे मसीह ने कलीसिया से प्रेम किया’
  rationale: दिए गए साक्ष्य में ‘Lord’ है; उसके पदनाम को बिना आवश्यकता बदला नहीं गया।
