  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन के आदेशात्मक स्वर को रखा गया है। ‘कलीसिया’ और ‘बिशप’ आरंभिक मसीही संदर्भ के परिचित शब्द हैं। अंग्रेज़ी साक्ष्य की पुरातन शैली का अनुकरण नहीं किया गया, और जहाँ स्रोत-समीक्षा लंबित है वहाँ निर्णायक संप्रदायगत व्याख्या से बचा गया।
