review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the supplied English witness and appropriately preserves its difficult, provisional wording. However, “बुरी चालों” narrows “evil arts” toward schemes, “तन और मन” replaces the witness’s body/spirit contrast, and “नाश हो गया” can imply a stronger final-destruction claim than the witness’s deliberately terse “is lost.” The sentence about knowledge beyond the bishop is better retained with present/generic force and with “this matter” made explicit.
  naturalness: The prose is mostly clear modern Hindi. “अपने पतियों के प्रति संतुष्ट रहें” is less idiomatic than “अपने पतियों से संतुष्ट रहें,” and “यीशु मसीह के नाम में” is nonstandard for “in the name of”; “यीशु मसीह के नाम से” is natural. “विवाह-बंधन में बंधें” expresses the reciprocal union more naturally than “एक हों.”
  terminology: “बिशप,” “कलीसिया,” “वासना,” and “परमेश्वर” are suitable and retain the early-Christian register. “संयम” is less likely than “ब्रह्मचर्य” to pre-decide the precise practical scope of chastity while retaining the source’s moral category. “शरीर और आत्मा” should be kept rather than psychologizing “spirit” as “मन.”
  issues:
  - severity: medium
    issue: “बुरी चालों” for “evil arts”
    rationale: “चालें” primarily suggests tricks or stratagems. The witness’s broad reference to evil practices/arts is better represented by “बुरी प्रथाओं,” without claiming a more specific historical referent.
  - severity: medium
    issue: “तन और मन से” for “in flesh and in spirit”
    rationale: This changes the explicit body/spirit pairing. “मन” is not a neutral equivalent of “spirit,” especially in this ethical and ecclesial context.
  - severity: medium
    issue: “वह नाश हो गया” for “he is lost”
    rationale: The perfect-like Hindi wording and “नाश” can read as a definitive eschatological pronouncement. “वह नष्ट हो जाता है” keeps the terse warning without adding that implication.
  - severity: low
    issue: Idiomatic and grammatical refinements
    rationale: “पतियों से संतुष्ट,” “नाम से,” and generic present verbs make the translation more natural and accurately reflect the witness’s injunctional style.
  revised_text: 'बुरी प्रथाओं से दूर रहो—या यों कहूँ, इन विषयों पर चर्चा करो। मेरी बहनों से कहो कि वे प्रभु से प्रेम करें और शरीर और आत्मा में अपने पतियों से संतुष्ट रहें। इसी प्रकार मेरे भाइयों को भी यीशु मसीह के नाम से आज्ञा दो कि वे अपनी पत्नियों से प्रेम करें, जैसे प्रभु ने कलीसिया से प्रेम किया।


    यदि कोई प्रभु की देह का आदर करने के लिए संयम में बना रह सकता है, तो वह बिना घमंड किए ऐसा करे। यदि वह घमंड करता है, तो वह नष्ट हो जाता है; और यदि यह बात बिशप के अतिरिक्त किसी और को ज्ञात हो जाए, तो वह अशुद्ध हो जाता है। पुरुषों और स्त्रियों, दोनों के लिए उचित है कि जब वे विवाह करें, तो बिशप की सहमति से विवाह-बंधन में बंधें, ताकि उनका विवाह प्रभु के अनुसार हो, वासना के अनुसार नहीं। सब कुछ परमेश्वर के सम्मान के लिए किया जाए।[a]'
