base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/087.yaml
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in bonds most pleasing to God, I salute all men, though I am not worthy to belong to it, being the very last of them. By the divine will was this vouchsafed to me, not of my own complicity, but by God’s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore, that your work may be perfected both on earth and in heaven, it is fitting that your church should appoint, for the honor of God, an ambassador of God, that he may go as far as Syria and congratulate them because they are at peace, have recovered their proper stature, and their proper fullness has been restored to them.


    It seemed to me therefore a fitting thing that you should send one of your own people with a letter, that he might join with them in giving glory for the calm which, by God’s will, had overtaken them, and because they were already reaching a haven through your prayers. Seeing you are perfect, let your counsels also be perfect; for if you desire to do well, God is ready to grant the means.'
translation:
  language: hi
  text: 'आपकी प्रार्थना सीरिया के अन्ताकिया में स्थित कलीसिया तक पहुँच गई है। वहीं से, परमेश्वर को अत्यन्त प्रिय बन्धनों में बन्दी होकर, मैं सबको नमस्कार करता हूँ। यद्यपि मैं उस कलीसिया का सदस्य कहलाने योग्य नहीं हूँ—क्योंकि मैं उन सबमें सबसे छोटा हूँ—फिर भी परमेश्वर की इच्छा से मुझे यह सौभाग्य मिला। यह मेरे अपने किसी आत्मबोध के कारण नहीं,[a] बल्कि परमेश्वर के अनुग्रह से हुआ है। मेरी प्रार्थना है कि यह अनुग्रह मुझे पूर्ण रूप से मिले, ताकि आपकी प्रार्थनाओं के द्वारा मैं परमेश्वर तक पहुँच सकूँ।[b]


    इसलिए, ताकि आपका कार्य पृथ्वी और स्वर्ग दोनों में पूरा हो, यह उचित है कि आपकी कलीसिया परमेश्वर के सम्मान के लिए किसी व्यक्ति को परमेश्वर के दूत के रूप में नियुक्त करे। वह सीरिया तक जाए और वहाँ के विश्वासियों को बधाई दे, क्योंकि अब उन्हें शान्ति मिली है, उन्होंने फिर से अपना उचित स्वरूप पा लिया है और उनकी पूरी देह फिर से बहाल हो गई है।[c]


    इसलिए मुझे यह उचित लगा कि आप अपने लोगों में से किसी एक को पत्र के साथ भेजें। वह उनके साथ मिलकर उस शान्ति के लिए परमेश्वर की महिमा करे, जो परमेश्वर की इच्छा से उन्हें मिली है, और इसलिए भी कि आपकी प्रार्थनाओं के द्वारा वे अब बन्दरगाह तक पहुँच रहे हैं।[d] चूँकि आप सिद्ध हैं, इसलिए आपकी योजनाएँ भी सिद्ध हों। यदि आप भलाई करना चाहते हैं, तो परमेश्वर उसके साधन देने के लिए तैयार है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन वाक्यांश का अर्थ ‘मेरी अपनी चेतना/अन्तःकरण के कारण नहीं’ या ‘अपने विषय में किसी निजी दावे के कारण नहीं’ भी हो सकता है।
    reason: यूनानी वाक्यांश οὐκ ἐκ συνειδότος की वास्तविक अस्पष्टता बनाए रखने के लिए।
  - marker: b
    text: ‘परमेश्वर तक पहुँचना’ इग्नातियुस की गन्तव्य-भाषा है; यहाँ इसे केवल मृत्यु, शहादत या उद्धार में से किसी एक अर्थ तक सीमित नहीं किया गया है।
    reason: धर्मवैचारिक तनाव को बिना चुपचाप हल किए सुरक्षित रखने के लिए।
  - marker: c
    text: मूल में कलीसिया के ‘उचित आकार’ और उसकी ‘पूरी देह’ के फिर से स्थापित होने की रूपकात्मक भाषा है।
    reason: अटपटी किन्तु अर्थपूर्ण सामुदायिक/देहात्मक छवि स्पष्ट करने के लिए।
  - marker: d
    text: ‘बन्दरगाह’ संकट के बाद शान्ति और सुरक्षा पाने का रूपक है।
    reason: प्राचीन समुद्री रूपक को समझने में सहायता के लिए।
