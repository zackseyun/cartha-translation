  english_witness: 'Be not deceived, my brethren. Corrupters of houses shall not inherit the kingdom of God.


    If then they which do these things after the flesh are put to death, how much more if a man through evil doctrine corrupt the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, shall go into the unquenchable fire; and in like manner also shall he that hearkeneth unto him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/017.yaml
  text: 'Do not be deceived, my brethren. Those who corrupt households will not inherit the kingdom of God.


    If those who do such things according to the flesh are put to death, how much more if a man, through evil teaching, corrupts the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, will go into the unquenchable fire; and likewise also the one who listens to him.'
translation:
  language: hi
  text: 'मेरे भाइयो, धोखा न खाओ। घरानों को भ्रष्ट करनेवाले परमेश्वर के राज्य के वारिस न होंगे।


    यदि शरीर के अनुसार ऐसे काम करनेवाले मृत्यु-दण्ड पाते हैं, तो जो कोई बुरी शिक्षा के द्वारा परमेश्वर के उस विश्वास को भ्रष्ट करता है, जिसके लिए यीशु मसीह क्रूस पर चढ़ाए गए, उसका दण्ड कितना अधिक होगा! ऐसा मनुष्य अपने को अशुद्ध करके कभी न बुझनेवाली आग में जाएगा; और इसी प्रकार वह भी, जो उसकी बात सुनता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है; मध्य-पाठ-परंपरा के यूनानी पाठ से प्रत्यक्ष समीक्षा अभी लंबित है। यहाँ “सुनता है” में उसकी शिक्षा को ग्रहण करने या मानने का भाव भी हो सकता है।
    reason: स्रोत-भाषा समीक्षा की सीमा और अंतिम वाक्य की अर्थ-सीमा को पारदर्शी बनाना।
lexical_decisions:
- source_word: Corrupters of houses
  choice: घरानों को भ्रष्ट करनेवाले
  rationale: ‘घर’ की केवल इमारत नहीं, बल्कि परिवार या गृहस्थ समुदाय का व्यापक अर्थ बनाए रखता है; उपलब्ध अंग्रेज़ी साक्ष्य की अस्पष्टता को अधिक विशिष्ट अपराध में नहीं बदलता।
- source_word: according to the flesh
  choice: शरीर के अनुसार
  rationale: प्राचीन मसीही नैतिक भाषा और उसके संभावित अर्थ-तनाव को सुरक्षित रखने हेतु औपचारिक अभिव्यक्ति रखी गई है।
- source_word: evil doctrine
  choice: बुरी शिक्षा
  rationale: साधारण आधुनिक हिन्दी में बोधगम्य है और गलत धार्मिक उपदेश का आशय व्यक्त करती है।
- source_word: the faith of God
  choice: परमेश्वर का विश्वास
  rationale: सम्बन्धसूचक वाक्यांश की वास्तविक अस्पष्टता को बनाए रखता है—यह परमेश्वर से सम्बन्धित विश्वास अथवा परमेश्वर में विश्वास का संकेत हो सकता है।
- source_word: unquenchable fire
  choice: कभी न बुझनेवाली आग
  rationale: चित्रात्मक और न्याय-संबंधी भाषा को स्वाभाविक हिन्दी में सीधे व्यक्त करता है।
- source_word: hearkeneth unto him
  choice: उसकी बात सुनता है
  rationale: केवल ध्वनि सुनने के बजाय शिक्षा को ग्रहण करने या मानने का संदर्भ सम्भव है; इसलिए इसे टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘परमेश्वर के विश्वास’ का सम्बन्ध
  choice: परमेश्वर का वह विश्वास
  alternative: परमेश्वर में विश्वास / परमेश्वर की ओर से दिया गया विश्वास
  rationale: प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण उपलब्ध साक्ष्य में निहित सम्बन्धसूचक अस्पष्टता को किसी एक धर्मवैज्ञानिक अर्थ में नहीं बाँधा गया।
- issue: श्रोता की जवाबदेही
  choice: वह भी, जो उसकी बात सुनता है
  alternative: वह भी, जो उसकी शिक्षा मानता है
  rationale: मूल साक्ष्य के ‘hearkeneth’ में सुनने और स्वीकार करने दोनों का भाव सम्भव है; मुख्य पाठ सरल रखा गया और पादटिप्पणी में अर्थ-सीमा बताई गई।
- issue: तुलनात्मक दण्ड-वाक्य
  choice: उसका दण्ड कितना अधिक होगा!
  alternative: तो वह कितना अधिक मृत्यु-दण्ड पाएगा
  rationale: अंग्रेज़ी साक्ष्य में दूसरे खंड का परिणाम अलंकारिक रूप से निहित है; हिन्दी में वाक्य को पूर्ण और स्वाभाविक बनाते हुए दण्ड की प्रकृति को अगले वाक्य से निर्धारित होने दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, चेतावनीपूर्ण और कलीसियाई पत्र के अनुरूप गरिमामय शैली। ‘भाइयो’, ‘वारिस’, ‘क्रूस पर चढ़ाए गए’ और ‘कभी न बुझनेवाली आग’ जैसे परिचित बाइबलीय पद बनाए गए हैं, जबकि अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशिष्ट शब्दावली से बचा गया है।
