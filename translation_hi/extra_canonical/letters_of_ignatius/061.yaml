base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/061.yaml
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
translation:
  language: hi
  text: 'अब मैं मनुष्यों की रीति से जीना नहीं चाहता; और यह तभी होगा, यदि तुम ऐसा चाहो। तुम ऐसा चाहो, ताकि तुम स्वयं भी चाहे जाओ। इस छोटे-से पत्र में मैं तुमसे विनती करता हूँ: मेरा विश्वास करो।


    और यीशु मसीह तुम पर यह प्रकट कर देंगे कि मैं सच कह रहा हूँ—यीशु मसीह, वह अचूक मुख, जिसके द्वारा पिता ने [सचमुच] कहा है।[a]


    मेरे लिए प्रार्थना करो कि मैं लक्ष्य तक पहुँच सकूँ [पवित्र आत्मा के द्वारा]।[b] मैं तुम्हें शरीर के अनुसार नहीं, बल्कि परमेश्वर की इच्छा के अनुसार लिख रहा हूँ। यदि मैं दुःख सहूँगा, तो यह तुम्हारी इच्छा थी; यदि मैं ठुकरा दिया जाऊँगा, तो यह तुम्हारी घृणा थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सचमुच” उपलब्ध अंग्रेज़ी साक्ष्य में कोष्ठकों में है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। “जिसके द्वारा” का शाब्दिक विकल्प “जिसमें” हो सकता है।
    reason: पाठगत संकेत और संबंधवाचक वाक्यांश की वास्तविक अनिश्चितता को प्रकट करना।
  - marker: b
    text: “पवित्र आत्मा के द्वारा” उपलब्ध साक्ष्य में कोष्ठकों में है; सम्भव है कि यह पाठगत रूपांतर या संपादकीय पूर्ति को दर्शाता हो।
    reason: आपूर्ति किए गए आधार-पाठ में उपस्थित अनिश्चितता को बनाए रखना।
lexical_decisions:
- source_word: after the manner of men
  choice: मनुष्यों की रीति से
  rationale: मानवीय ढंग से जीवन बचाने या सांसारिक रीति से जीने के संकेत को बिना अधिक व्याख्या के बनाए रखता है।
- source_word: Desire ye ... desired
  choice: तुम ऐसा चाहो ... तुम स्वयं भी चाहे जाओ
  rationale: मूल साक्ष्य की जानबूझकर की गई शब्द-पुनरावृत्ति और उसकी कठिन, संभावित पारस्परिकता को सुरक्षित रखा गया है।
- source_word: unerring mouth
  choice: अचूक मुख
  rationale: मसीह को पिता की त्रुटिरहित वाणी के माध्यम के रूप में प्रस्तुत करने वाले रूपक को सीधे बनाए रखता है।
- source_word: attain
  choice: लक्ष्य तक पहुँच सकूँ
  rationale: अव्यक्त लक्ष्य—शहादत, परमेश्वर तक पहुँचना, या सिद्धि—को पाठ में संकीर्ण रूप से निर्धारित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: after the flesh
  choice: शरीर के अनुसार
  rationale: प्रारम्भिक मसीही साहित्य की नैतिक-आध्यात्मिक अभिव्यक्ति को 'मानवीय स्वार्थ' जैसी व्याख्यात्मक भाषा में सीमित नहीं किया गया।
- source_word: mind of God
  choice: परमेश्वर की इच्छा
  rationale: यहाँ व्यावहारिक आशय को आधुनिक हिन्दी में स्पष्ट करता है, जबकि 'मन' का अत्यधिक शाब्दिक और अस्वाभाविक प्रयोग टालता है।
theological_decisions:
- issue: पिता का मसीह में अथवा मसीह के द्वारा बोलना
  choice: जिसके द्वारा पिता ने ... कहा है
  alternative: जिसमें पिता ने ... कहा है
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में 'in whom' है, पर अभिप्राय माध्यम का भी हो सकता है। हिन्दी में 'जिसके द्वारा' कथन-संबंध को स्वाभाविक बनाता है, पर स्रोत-भाषा समीक्षा लंबित होने के कारण इसे पादटिप्पणी में चिह्नित किया गया है।
- issue: पवित्र आत्मा के द्वारा लक्ष्य-प्राप्ति
  choice: कोष्ठक सहित रखा गया
  alternative: कोष्ठक हटाकर निर्विवाद मूल पाठ के रूप में देना
  rationale: आपूर्ति किए गए साक्ष्य में शब्द कोष्ठकों में हैं, जो पाठगत या संपादकीय अनिश्चितता दर्शाते हैं; इसे छिपाया नहीं गया।
- issue: दुःख और अस्वीकृति के लिए रोमियों की इच्छा अथवा घृणा
  choice: कठोर विरोध को यथावत रखा गया
  alternative: इसे केवल वाक्पटु अतिशयोक्ति के रूप में नरम करना
  rationale: इग्नातियुस सहायता न करने को इच्छा और हस्तक्षेप को घृणा के तीखे विरोध में रखता है; अनुवाद इस धर्मवैचारिक और भावनात्मक तनाव को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सुबोध। बहुवचन संबोधन के लिए “तुम” रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण कठिन पुनरुक्तियों और कोष्ठकीय पाठ को सावधानी से सुरक्षित रखा गया है।
