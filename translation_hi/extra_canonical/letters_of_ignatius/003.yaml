  english_witness: 'But as touching my fellow servant Burrhus, who by the will of God is your deacon blessed in all things, I pray that he may remain with me to the honor of yourselves and of your bishop. Yea, and Crocus also, who is worthy of God and of you whom I received as an ensample of the love which ye bear me, hath relieved me in all ways--even so may the Father of Jesus Christ refresh him--together with Onesimus and Burrhus and Euplus and Fronto; in whom I saw you all with the eyes of love.


    May I have joy of you always, if so be I an worthy of it. It is therefore meet for you in every way to glorify Jesus Christ who glorified you; that being perfectly joined together in one submission, submitting yourselves to your bishop and presbytery, ye may be sanctified in all things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/003.yaml
  text: 'Regarding my fellow servant Burrhus, who by the will of God is your deacon, blessed in every way, I ask that he may remain with me, to the honor of both you and your bishop. And Crocus also, who is worthy of God and of you, whom I received as an example of the love you bear me, has relieved me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. In them I saw you all with the eyes of love.


    May I always have joy in you, if indeed I am worthy of it. Therefore, it is fitting for you in every way to glorify Jesus Christ, who glorified you, so that, being perfectly joined together in one submission and submitting yourselves to your bishop and presbytery, you may be sanctified in all things.'
translation:
  language: hi
  text: 'जहाँ तक मेरे सह-सेवक बुर्रुस की बात है—जो परमेश्वर की इच्छा से आपका सेवक[a] है और हर प्रकार से आशीषित है—मैं निवेदन करता हूँ कि वह मेरे साथ रहे; इससे आपका और आपके अध्यक्ष[b] का सम्मान होगा। और क्रोकुस भी, जो परमेश्वर और आपके योग्य है और जिसे मैंने अपने प्रति आपके प्रेम के उदाहरण के रूप में ग्रहण किया, उसने हर प्रकार से मुझे राहत दी है। यीशु मसीह का पिता भी उसे ताज़गी दे—उनेसिमुस, बुर्रुस, यूप्लुस और फ्रोंतो के साथ। इन सबमें मैंने प्रेम की आँखों से आप सभी को देखा।


    काश, मुझे सदा आपसे आनंद मिले—यदि सचमुच मैं इसके योग्य हूँ। इसलिए आपके लिए उचित है कि आप हर प्रकार से यीशु मसीह की महिमा करें, जिसने आपकी महिमा की है, ताकि आप एक ही अधीनता में पूरी तरह जुड़कर, अपने अध्यक्ष और प्राचीनों की सभा[c] के अधीन रहते हुए, हर बात में पवित्र किए जाएँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेवक’ के पीछे ऐसा शब्द हो सकता है जो सामान्य सेवक और कलीसियाई पद ‘डीकन’—दोनों अर्थों में प्रयुक्त होता है; यहाँ बुर्रुस की समुदाय में मान्य सेवकीय भूमिका अभिप्रेत है।
    reason: स्रोत-भाषा समीक्षा लंबित होने के बीच पदनाम की संभावित तकनीकी प्रकृति बताना आवश्यक है।
  - marker: b
    text: ‘अध्यक्ष’ उस कलीसियाई अगुवे के लिए है जिसे परंपरागत अनुवादों में प्रायः ‘बिशप’ कहा जाता है।
    reason: आरंभिक कलीसियाई पदनाम को समझने में सहायता देते हुए बाद की संस्थागत संरचना को पाठ पर आरोपित करने से बचाता है।
  - marker: c
    text: ‘प्राचीनों की सभा’ से आशय समुदाय के प्राचीन अगुवों के सामूहिक निकाय से है; परंपरागत शब्द ‘प्रेस्बिटरी’ है।
    reason: सामूहिक नेतृत्व-निकाय का अर्थ स्पष्ट करता है।
lexical_decisions:
- source_word: fellow servant
  choice: सह-सेवक
  rationale: साझी सेवा और समान सेवकीय स्थिति, दोनों को संक्षेप में बनाए रखता है।
- source_word: deacon
  choice: सेवक
  rationale: यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण पदनाम को केवल आधुनिक कलीसियाई तकनीकी शब्द में सीमित नहीं किया; फुटनोट में संभावित पदनाम स्पष्ट किया है।
- source_word: bishop
  choice: अध्यक्ष
  rationale: आरंभिक कलीसियाई निगरानी/नेतृत्व की भूमिका को आधुनिक और सहज हिंदी में व्यक्त करता है, बिना बाद की संस्थागत धारणाएँ आरोपित किए।
- source_word: presbytery
  choice: प्राचीनों की सभा
  rationale: सामूहिक निकाय का भाव बनाए रखता है; केवल बहुवचन ‘प्राचीन’ कहने के बजाय परिषद-सदृश समूह स्पष्ट करता है।
- source_word: refresh
  choice: ताज़गी दे
  rationale: पहले आए ‘राहत दी’ के प्रत्युत्तरात्मक भाव को रखते हुए ईश्वरीय सांत्वना और पुनर्बलन का व्यापक अर्थ सुरक्षित करता है।
- source_word: one submission
  choice: एक ही अधीनता
  rationale: एकता और अधीनता दोनों की तनावपूर्ण भाषा को नरम या विलीन किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: यीशु मसीह की महिमा करना और उनके द्वारा समुदाय की महिमा किया जाना
  choice: ‘यीशु मसीह की महिमा करें, जिसने आपकी महिमा की है’
  alternative: ‘यीशु मसीह का आदर करें, जिन्होंने आपको आदर दिया’
  rationale: महिमा की पारस्परिक शब्दावली और उसके धर्मवैज्ञानिक भार को संरक्षित किया गया है।
- issue: अध्यक्ष और प्राचीनों की सभा के प्रति अधीनता
  choice: मूल कथन की सीधी अधीनता-भाषा रखी
  alternative: इसे केवल ‘सहयोग’ या ‘सम्मान’ के रूप में नरम करना
  rationale: पाठ के वास्तविक कलीसियाई आग्रह को किसी आधुनिक संप्रदायगत व्यवस्था के समर्थन या विरोध में बदले बिना बनाए रखा है।
- issue: पवित्रीकरण का संबंध सामुदायिक एकता और अधीनता से
  choice: ‘ताकि... हर बात में पवित्र किए जाएँ’
  alternative: ‘और इस प्रकार पवित्र जीवन जिएँ’
  rationale: निष्क्रिय क्रिया का भाव सुरक्षित है, जिससे पवित्रीकरण के कर्ता को पाठ से बाहर जाकर निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, पत्रात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। नामों का देवनागरी लिप्यंतरण प्रचलित बाइबिलीय रूपों के निकट रखा गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; मध्य-पाठरूप की यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष समीक्षा अभी लंबित है, इसलिए संदिग्ध पदनामों पर फुटनोट दिए गए हैं और अनावश्यक निश्चितता से बचा गया है।
