base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/068.yaml
  text: Therefore, be careful to observe one Eucharist (for there is one flesh of our Lord Jesus Christ and one cup for union in his blood; there is one altar, just as there is one bishop, together with the presbytery and the deacons, my fellow servants), so that whatever you do, you may do it in accordance with God.
translation:
  language: hi
  text: इसलिए इस बात का ध्यान रखो कि तुम एक ही यूखरिस्त[a] में भाग लो; क्योंकि हमारे प्रभु यीशु मसीह की देह एक ही है, और उसके लहू में एकता के लिए प्याला भी एक ही है; वेदी एक ही है, जैसे बिशप[b] भी एक ही है, उसके साथ प्राचीनों की परिषद और डीकन, जो मेरे सह-सेवक हैं। ताकि तुम जो कुछ भी करो, परमेश्वर के अनुसार करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पद ‘यूखरिस्त’ का अर्थ मूलतः ‘धन्यवाद’ है; यह आरंभिक मसीही समुदाय के पवित्र सामूहिक भोजन/धन्यवाद-विधि के लिए प्रयुक्त पद है।
    reason: मूल के विशिष्ट ऐतिहासिक पद तथा उसके सामान्य अर्थ को स्पष्ट करता है, बिना किसी विशेष संस्कार-सिद्धांत को आरोपित किए।
  - marker: b
    text: ‘बिशप’ यूनानी कलीसियाई पद का लिप्यंतरण है; इसका मूल अर्थ ‘निरीक्षक’ है।
    reason: ऐतिहासिक पदनाम को सुरक्षित रखते हुए उसके शब्दार्थ की पारदर्शिता देता है।
lexical_decisions:
- source_word: eucharist
  choice: प्रभु-भोज
  rationale: आधुनिक हिन्दी पाठकों के लिए स्वाभाविक और बोधगम्य धार्मिक पद; मूल का आशय सामूहिक पवित्र भोजन/धन्यवाद-विधि है। मूल यूनानी की प्रत्यक्ष समीक्षा लंबित होने के कारण पाद-टिप्पणी में वैकल्पिक पद दिया गया है।
- source_word: one cup unto union in His blood
  choice: उसके लहू में एकता के लिए प्याला भी एक ही है
  rationale: साक्षी-पाठ में व्यक्त उद्देश्य और ‘एकता’ की धार्मिक-सामुदायिक ध्वनि को बिना अधिक व्याख्या के सुरक्षित रखता है।
- source_word: altar
  choice: वेदी
  rationale: बलिदान और उपासना से जुड़ी मूल छवि को औपचारिक तथा संक्षिप्त रूप में बनाए रखता है।
- source_word: bishop
  choice: अध्यक्ष
  rationale: प्रारंभिक कलीसियाई पद के निरीक्षण/नेतृत्व संबंधी अर्थ को व्यक्त करता है और आधुनिक पदानुक्रम की अतिरिक्त धारणाएँ आरोपित करने से बचता है।
- source_word: presbytery
  choice: प्राचीनों की सभा
  rationale: एकवचन सामूहिक निकाय का भाव स्पष्ट करता है, न कि केवल अलग-अलग प्राचीनों का।
- source_word: deacons my fellow-servants
  choice: मेरे सह-सेवक उपयाजक
  rationale: पदनाम और लेखक द्वारा व्यक्त सह-सेवकत्व दोनों को बनाए रखता है।
- source_word: after God
  choice: परमेश्वर के अनुसार
  rationale: अंग्रेज़ी साक्षी की संक्षिप्तता और संभावित अर्थ-विस्तार को सुरक्षित रखता है; इसे ‘परमेश्वर की इच्छा के अनुसार’ कहकर चुपचाप स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ‘एक प्रभु-भोज’, ‘एक देह’, ‘एक प्याला’, ‘एक वेदी’ और ‘एक अध्यक्ष’ के बीच संबंध
  choice: सभी समानांतर एकता-वाक्यों को निकटता से बनाए रखा गया
  alternative: इन्हें केवल संगठनात्मक एकरूपता या केवल संस्कार-सिद्धांत के रूप में स्पष्ट करना
  rationale: पाठ कलीसियाई और उपासना-संबंधी एकता को साथ रखता है; किसी एक धार्मिक प्रणाली में उसका अर्थ सीमित करना उचित नहीं।
- issue: ‘उसके लहू में एकता’ का अर्थ
  choice: ‘उसके लहू में एकता के लिए’
  alternative: ‘उसके लहू के साथ सहभागिता के लिए’
  rationale: उपलब्ध अंग्रेज़ी साक्षी में ‘union in His blood’ है; स्रोत-भाषा समीक्षा लंबित होने के कारण ‘एकता’ की वास्तविक अस्पष्टता संरक्षित रखी गई।
- issue: कलीसियाई पद ‘bishop’
  choice: मुख्य पाठ में ‘अध्यक्ष’, पाद-टिप्पणी में ‘बिशप/निरीक्षक’
  alternative: केवल ‘बिशप’
  rationale: यह ऐतिहासिक पद है, पर आधुनिक हिन्दी में ‘बिशप’ बाद की संस्थागत धारणाएँ जगा सकता है; ‘अध्यक्ष’ कार्यात्मक अर्थ देता है, जबकि पाद-टिप्पणी पहचान बनाए रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और समुदाय को संबोधित करने वाली हिन्दी अपनाई गई है। ‘तुम’ बहुवचन सामुदायिक संबोधन के रूप में है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; मध्य-पाठपरंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है, इसलिए जहाँ आवश्यक है वहाँ दावे सावधानी से रखे गए हैं।
