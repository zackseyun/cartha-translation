source:
  text: '[But] shun divisions, as the beginning of evils. Do ye all follow your bishop, as Jesus Christ followed the Father, and the presbytery as the Apostles; and to the deacons pay respect, as to God''s commandment. Let no man do aught of things pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he shall have committed it.


    Wheresoever the bishop shall appear, there let the people be; even as where Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatsoever he shall approve, this is well-pleasing also to God; that everything which ye do may be sure and valid.'
