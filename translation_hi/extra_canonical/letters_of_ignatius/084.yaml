  english_witness: '[But] shun divisions, as the beginning of evils. Do ye all follow your bishop, as Jesus Christ followed the Father, and the presbytery as the Apostles; and to the deacons pay respect, as to God''s commandment. Let no man do aught of things pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he shall have committed it.


    Wheresoever the bishop shall appear, there let the people be; even as where Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatsoever he shall approve, this is well-pleasing also to God; that everything which ye do may be sure and valid.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/084.yaml
  text: '[But] shun divisions, since they are the beginning of evils. All of you, follow your bishop as Jesus Christ followed the Father, and the presbytery as the Apostles; and respect the deacons as God’s commandment. Let no one do anything pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he has committed it.


    Wherever the bishop appears, there let the people be; even as wherever Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatever he approves is also well-pleasing to God, so that everything you do may be sure and valid.'
translation:
  language: hi
  text: '[परन्तु] फूट से दूर रहो, क्योंकि वह बुराइयों का आरम्भ है। तुम सब अपने बिशप के पीछे वैसे चलो जैसे यीशु मसीह पिता के पीछे चले, और प्राचीनों की सभा के पीछे वैसे जैसे प्रेरितों के; और उपयाजकों का आदर ऐसे करो जैसे परमेश्वर की आज्ञा का। बिशप से अलग होकर कोई भी कलीसिया से सम्बन्धित कोई काम न करे। वही प्रभु-भोज[a] मान्य समझा जाए जो बिशप की देखरेख में हो, या उस व्यक्ति की देखरेख में जिसे उसने यह दायित्व सौंपा हो।


    जहाँ कहीं बिशप दिखाई दे, वहीं लोगों का समुदाय भी हो; ठीक वैसे ही जैसे जहाँ यीशु मसीह हों, वहाँ सार्वभौमिक कलीसिया[b] है। बिशप से अलग होकर न बपतिस्मा देना उचित है, न प्रेम-भोज[c] करना। परन्तु जिसे वह स्वीकृति दे, वही परमेश्वर को भी भाता है, ताकि तुम जो कुछ करो वह सुनिश्चित और मान्य हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रभु-भोज’ उस कलीसियाई भोजन/संस्कार के लिए है जिसे यूनानी परम्परा में ‘यूखरिस्त’ कहा जाता है।
    reason: सामान्य हिन्दी पाठक के लिए अर्थ स्पष्ट करते हुए ऐतिहासिक तकनीकी पद से संबंध बनाए रखना।
  - marker: b
    text: ‘सार्वभौमिक कलीसिया’ का अर्थ यहाँ समूची, विश्वव्यापी कलीसिया है; इसे किसी बाद की विशिष्ट संस्था के आधिकारिक नाम के रूप में पढ़ना आवश्यक नहीं।
    reason: ‘catholic/universal’ के ऐतिहासिक अर्थ और बाद के सांप्रदायिक प्रयोग में भेद स्पष्ट करना।
  - marker: c
    text: ‘प्रेम-भोज’ आरम्भिक मसीहियों का सामुदायिक भोजन था; इस पद का प्रभु-भोज से ठीक संबंध इस अंश में स्पष्ट नहीं किया गया है।
    reason: दोनों गतिविधियों को पाठ अलग-अलग नाम देता है; उनके ऐतिहासिक संबंध को अनावश्यक रूप से निश्चित नहीं करना।
lexical_decisions:
- source_word: bishop (Greek review pending; likely ἐπίσκοπος)
  choice: बिशप
  rationale: आरम्भिक कलीसियाई पद के लिए आधुनिक हिन्दी में पहचाना जाने वाला शब्द; इसे ‘अध्यक्ष’ कहने से पाठ में निहित विशिष्ट पद-संरचना धुँधली पड़ सकती थी।
- source_word: presbytery (Greek review pending; likely πρεσβυτέριον)
  choice: प्राचीनों की सभा
  rationale: यह सामूहिक निकाय है, इसलिए केवल ‘प्राचीन’ की अपेक्षा ‘सभा’ जोड़कर सामूहिक अर्थ सुरक्षित रखा गया।
- source_word: deacons (Greek review pending; likely διάκονοι)
  choice: उपयाजक
  rationale: कलीसियाई पद का संकेत बनाए रखने के लिए पारंपरिक हिन्दी पदनाम चुना गया, न कि सामान्य ‘सेवक’।
- source_word: valid
  choice: मान्य
  rationale: यहाँ क्रिया या संस्कार की स्वीकृत/प्रामाणिक स्थिति अभिप्रेत है; ‘वैध’ की कानूनी कठोरता से बचते हुए संस्थागत अर्थ रखा गया।
- source_word: universal Church (likely καθολικὴ ἐκκλησία)
  choice: सार्वभौमिक कलीसिया
  rationale: ऐतिहासिक पद का मूल व्यापक अर्थ सुरक्षित रखा गया और बाद की किसी विशिष्ट सांप्रदायिक संस्था का नाम आरोपित नहीं किया गया।
- source_word: love-feast (likely ἀγάπη)
  choice: प्रेम-भोज
  rationale: आरम्भिक मसीही सामुदायिक भोजन के तकनीकी आशय को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: बिशप और यीशु/पिता के अनुकरण की समानांतर भाषा
  choice: ‘अपने बिशप के पीछे वैसे चलो जैसे यीशु मसीह पिता के पीछे चले’
  alternative: ‘बिशप की आज्ञा वैसे मानो जैसे यीशु ने पिता की मानी’
  rationale: साक्ष्य में ‘follow’ का संबंधपरक और अनुकरणात्मक रूप है; ‘आज्ञा मानना’ करने से अधिकार की व्याख्या अधिक कठोर और संकीर्ण हो जाती।
- issue: उपयाजकों और परमेश्वर की आज्ञा के बीच तुलना
  choice: ‘उपयाजकों का आदर ऐसे करो जैसे परमेश्वर की आज्ञा का’
  alternative: ‘उपयाजकों का परमेश्वर की आज्ञा के अनुसार आदर करो’
  rationale: मूल साक्ष्य की असामान्य तुलना को दूसरी व्याख्या में बदलकर हल नहीं किया गया।
- issue: बिशप से अलग संस्कार-संबंधी कार्य
  choice: ‘बिशप से अलग होकर’
  alternative: ‘बिशप की अनुमति के बिना’
  rationale: ‘apart from’ में उपस्थिति, सहभागिता या प्राधिकरण—एक से अधिक संभावित आयाम हैं; केवल अनुमति का अर्थ आरोपित नहीं किया गया।
- issue: यीशु की उपस्थिति और सार्वभौमिक कलीसिया
  choice: ‘जहाँ यीशु मसीह हों, वहाँ सार्वभौमिक कलीसिया है’
  alternative: ‘जहाँ यीशु के विश्वासी हैं, वहीं कैथोलिक चर्च है’
  rationale: पाठ यीशु की उपस्थिति की बात करता है; ‘विश्वासी’ जोड़ना और ‘कैथोलिक चर्च’ को संस्थागत नाम बनाना दोनों अनावश्यक व्याख्याएँ होतीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कलीसिया’, ‘बिशप’, ‘प्राचीनों की सभा’ और ‘उपयाजक’ जैसे पद ऐतिहासिक कलीसियाई परिवेश को सुरक्षित रखते हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी मध्य-पाठ-परम्परा से प्रत्यक्ष समीक्षा अभी शेष होने के कारण कोष्ठकित ‘[परन्तु]’ और प्रमुख पारिभाषिक निर्णय अनन्तिम माने जाएँ।
