translation:
  language: hi
  text: इग्नातियुस, जो थियोफोरुस भी कहलाता है, स्मुरनावासियों की कलीसिया के बिशप पोलिकार्प को—बल्कि उस व्यक्ति को जिसकी देखरेख परमेश्वर पिता और प्रभु यीशु मसीह करते हैं—बहुत-बहुत नमस्कार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰγνάτιος ὁ καὶ Θεοφόρος
  choice: इग्नातियुस, जो थिओफोरुस भी कहलाता है
  rationale: दोनों प्राचीन नामों को लिप्यंतरित किया गया है; ‘भी कहलाता है’ उपनाम अथवा वैकल्पिक नाम के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना Θεοφόρος का अर्थ व्याख्यात्मक रूप से थोपे।
- source_word: ἐπισκόπῳ
  choice: बिशप
  rationale: आरंभिक कलीसियाई पदनाम को आधुनिक हिन्दी के व्यापक रूप से पहचाने जाने वाले रूप में रखा गया है; वाक्य में इसकी जानबूझकर की गई पुनरावृत्ति भी सुरक्षित है।
- source_word: Σμυρναίων ἐκκλησίας
  choice: स्मुरनावासियों की कलीसिया
  rationale: यह नगर से जुड़े लोगों की सभा/कलीसिया को दर्शाता है; ‘स्मुरना की कलीसिया’ की अपेक्षा जातिवाचक संरचना मूल अभिव्यक्ति के अधिक निकट है।
- source_word: μᾶλλον δὲ ἐπισκοπημένῳ ὑπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: बल्कि ऐसे व्यक्ति को, जिसके बिशप परमेश्वर पिता और यीशु मसीह हैं
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की अर्थ-रेखा और उसके अलंकारिक पद-प्रयोग को सुरक्षित रखते हुए वाक्य को सहज हिन्दी दी गई है; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण ‘प्रभु’ के संभावित पाठ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: πλεῖστα χαίρειν
  choice: बहुत-बहुत नमस्कार
  rationale: प्राचीन पत्र-अभिवादन की प्रचुरता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पोलिकार्प के लिए परमेश्वर पिता और यीशु मसीह को ‘बिशप’ कहना
  choice: अलंकारिक कथन को स्पष्ट किए बिना ज्यों का त्यों बनाए रखा गया है
  alternative: ‘जिसकी देखरेख परमेश्वर पिता और यीशु मसीह करते हैं’
  rationale: ‘देखरेख’ अर्थ को सहज बनाती, पर मूल के पद-संबंधी शब्द-खेल और उसकी धर्मवैचारिक तीक्ष्णता को कम कर देती।
- issue: ‘परमेश्वर पिता’ और ‘यीशु मसीह’ का संयुक्त बिशपीय संबंध
  choice: दोनों को समान रूप से ‘जिसके बिशप ... हैं’ के अंतर्गत रखा गया है
  alternative: एकवचन या पदानुक्रमसूचक पुनर्गठन
  rationale: साक्ष्य की समन्वयी संरचना को बिना त्रित्ववादी या पदानुक्रमवादी विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘कलीसिया’ और ‘बिशप’ आरंभिक मसीही पत्र के संस्थागत संदर्भ को स्पष्ट रखते हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण नामों और विवादास्पद वाक्यांश में संयम बरता गया है।
