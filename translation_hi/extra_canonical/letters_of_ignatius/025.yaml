  source_fidelity: संशोधन आवश्यक है। प्रारूप में ‘जब’ कालवाचक अर्थ देता है, जबकि ‘Forasmuch then as’ का कारणसूचक संबंध अपेक्षित है। साथ ही, ‘आप सबको देखने’ के बजाय दामास, प्राचीनों और ज़ोतियोन के व्यक्तित्वों में समुदाय को देखना अभिप्रेत है। अंतिम तुलना में हिन्दी वाक्य-विन्यास अस्पष्ट है और उसे ऐसा नहीं होना चाहिए कि बिशप को सीधे परमेश्वर का अनुग्रह अथवा प्राचीन-मंडली को सीधे मसीह की व्यवस्था ठहराया जाए।
  naturalness: संशोधित पाठ आधुनिक मानक हिन्दी में स्वाभाविक रहते हुए मूल के औपचारिक, पत्रात्मक और अपूर्ण वाक्य-प्रवाह को बनाए रखता है। ‘जिसकी संगति का मैं आनन्द लेना चाहता हूँ’ ‘of whom I would fain have joy’ का अधिक स्पष्ट और मुहावरेदार निर्वाह है।
  terminology: ‘धर्मपरायण’, ‘बिशप’, ‘प्राचीन’, ‘प्राचीन-मंडली’, ‘डीकन’, ‘परमेश्वर का अनुग्रह’, और ‘यीशु मसीह की व्यवस्था’ पद मूल के संस्थागत तथा धर्मवैचारिक भेदों को बनाए रखते हैं। ‘प्राचीनों’ (व्यक्ति) और ‘प्राचीन-मंडली’ (सामूहिक निकाय) में भेद सुरक्षित है।
