  english_witness: Forasmuch then as I was permitted to see you in the person of Damas your godly bishop and your worthy presbyters Bassus and Apollonius and my fellow-servant the deacon Zotion, of whom I would fain have joy, for that he is subject to the bishop as unto the grace of God and to the presbytery as unto the law of Jesus Christ:--
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/025.yaml
  text: Since, then, I was permitted to see you in the person of Damas, your godly bishop, and your worthy presbyters Bassus and Apollonius, and my fellow servant, the deacon Zotion—whom I would gladly rejoice in, because he is subject to the bishop as to the grace of God, and to the presbytery as to the law of Jesus Christ—
translation:
  language: hi
  text: इसलिए, जब मुझे आपके भक्तिमान बिशप दामास, आपके सम्माननीय प्राचीनों बास्सुस और अपोल्लोनियुस, और मेरे सह-सेवक डीकन ज़ोतियोन में आप सबको देखने का अवसर मिला—ज़ोतियोन से मैं आनंदित होना चाहता हूँ, क्योंकि वह बिशप के अधीन ऐसे रहता है जैसे परमेश्वर के अनुग्रह के, और प्राचीनों की सभा के अधीन ऐसे जैसे यीशु मसीह की व्यवस्था के—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly bishop
  choice: भक्तिमान बिशप
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में व्यक्त धर्मपरायणता का भाव रखते हुए आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण पद चुना गया।
- source_word: presbyters / presbytery
  choice: प्राचीनों / प्राचीनों की सभा
  rationale: व्यक्तियों और सामूहिक निकाय के बीच भेद बनाए रखने के लिए क्रमशः बहुवचन और सभा-सूचक रूप रखा गया।
- source_word: deacon
  choice: डीकन
  rationale: आरंभिक कलीसियाई पद के लिए व्यापक रूप से पहचाना जाने वाला लिप्यंतर चुना गया, ताकि इसे सामान्य सेवक मात्र न समझा जाए।
- source_word: subject
  choice: के अधीन ... रहता है
  rationale: आज्ञाकारिता और व्यवस्थित अधीनता का भाव बिना अनावश्यक कठोरता जोड़े व्यक्त होता है।
- source_word: law of Jesus Christ
  choice: यीशु मसीह की व्यवस्था
  rationale: ‘law’ का औपचारिक और धर्मवैचारिक तनाव बनाए रखा गया; इसे ‘शिक्षा’ या ‘आज्ञा’ कहकर अर्थ सीमित नहीं किया गया।
theological_decisions:
- issue: बिशप की अधीनता की तुलना परमेश्वर के अनुग्रह से
  choice: ‘बिशप के अधीन ऐसे ... जैसे परमेश्वर के अनुग्रह के’
  alternative: ‘बिशप की अधीनता में, जो परमेश्वर का अनुग्रह है’
  rationale: तुलना को तादात्म्य में नहीं बदला गया; उपलब्ध साक्ष्य का ‘as to’ संबंध और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया।
- issue: प्राचीनों की सभा और मसीह की व्यवस्था का संबंध
  choice: स्पष्ट उपमा के रूप में प्रस्तुत किया
  alternative: प्राचीनों की सभा को सीधे मसीह की व्यवस्था कहना
  rationale: पाठ में उपस्थित समानांतर तुलना को बनाए रखा गया और संस्थागत निकाय को व्यवस्था के साथ बिना आधार एकरूप नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। वाक्य मूल की अपूर्ण, अगले अंश की ओर बढ़ती संरचना के अनुरूप दीर्घ डैश पर समाप्त होता है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी मूल-पाठ की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण पदावली को अंतिम स्रोत-सत्यापन की आवश्यकता है।
