base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/009.yaml
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
translation:
  language: hi
  text: 'इसलिए कोई तुम्हें धोखा न दे—और वास्तव में तुम धोखे में नहीं हो, क्योंकि तुम पूरी तरह परमेश्वर के हो। जब तुम्हारे भीतर ऐसी कोई लालसा जड़ नहीं पकड़ती जो तुम्हें सताने की शक्ति रखती हो, तभी तुम सचमुच परमेश्वर के अनुसार जीते हो। मैं तुम्हारे लिए अपने आपको अर्पित करता हूँ; और तुम इफिसियों की कलीसिया के लिए अपने आपको बलि के रूप में समर्पित करता हूँ, जिसकी ख्याति युगों-युगों तक है।[a]


    जो शरीर के अनुसार हैं, वे आत्मा के काम नहीं कर सकते; और जो आत्मा के अनुसार हैं, वे शरीर के काम नहीं कर सकते। उसी तरह विश्वास विश्वासघात के काम नहीं कर सकता, और न विश्वासघात विश्वास के काम। फिर भी, जो काम तुम शरीर में रहते हुए करते हो, वे भी आत्मिक हैं, क्योंकि तुम सब कुछ यीशु मसीह में करते हो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वाक्य में लेखक अपने आत्म-अर्पण के लिए बलि-संबंधी रूपक प्रयोग करता है। उपलब्ध अंग्रेज़ी साक्ष्य से इसका अधिक विशिष्ट अनुष्ठानिक अर्थ निश्चित नहीं किया गया है।
    reason: धर्मवैचारिक अति-निर्धारण से बचते हुए रूपक की तीव्रता स्पष्ट करना।
  - marker: b
    text: ‘शरीर में रहते हुए’ उपलब्ध अंग्रेज़ी साक्ष्य के आधार पर दिया गया है। मध्य-पाठपरंपरा के यूनानी पाठ की सीधी समीक्षा लंबित है; शाब्दिक रूप ‘शरीर के अनुसार’ भी हो सकता है।
    reason: अंतिम वाक्य में ‘flesh’ की अर्थगत अस्पष्टता और लंबित यूनानी समीक्षा को दर्ज करना।
lexical_decisions:
- source_word: lust / desire (Greek review pending)
  choice: लालसा
  rationale: यह शब्द नैतिक रूप से विकृत या यातना देने वाली इच्छा का भाव व्यक्त करता है, पर इसे केवल यौन वासना तक सीमित नहीं करता।
- source_word: live after God
  choice: परमेश्वर के अनुसार जीते हो
  rationale: मूल अभिव्यक्ति की असामान्य किंतु अर्थपूर्ण संरचना को बनाए रखता है और इसे केवल ‘भक्ति से जीना’ कहकर संकुचित नहीं करता।
- source_word: flesh
  choice: शरीर / शरीर के अनुसार
  rationale: संदर्भ के अनुसार ‘flesh’ की पुनरावृत्ति को बनाए रखते हुए पहले विरोध में ‘शरीर के अनुसार’ और अंतिम वाक्य में देहधारी जीवन का स्वाभाविक अर्थ व्यक्त किया गया है।
- source_word: Spirit / spiritual
  choice: आत्मा / आत्मिक
  rationale: शरीर और आत्मा के धर्मवैचारिक विरोध तथा अंतिम कथन की शब्दगत कड़ी को सुरक्षित रखता है।
- source_word: unfaithfulness
  choice: विश्वासघात
  rationale: ‘अविश्वास’ की अपेक्षा विश्वास के प्रतिकूल आचरण का सक्रिय भाव व्यक्त करता है; यूनानी स्रोत की सीधी समीक्षा लंबित होने के कारण इसे टिप्पणी में अस्थायी माना गया है।
- source_word: in Jesus Christ
  choice: यीशु मसीह में
  rationale: ‘में’ की सहभागी और संबंधपरक अस्पष्टता को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: शरीर और आत्मा का विरोध
  choice: ‘शरीर के अनुसार’ और ‘आत्मा के अनुसार’
  alternative: ‘सांसारिक’ और ‘आत्मिक’
  rationale: ‘सांसारिक’ कहने से शरीर को संसार या पाप के बराबर मान लेने का जोखिम है। चुना हुआ रूप मूल विरोध को अधिक पारदर्शी रखता है।
- issue: अंतिम वाक्य में शरीर के कामों का आत्मिक होना
  choice: ‘शरीर में रहते हुए’
  alternative: ‘शरीर के अनुसार’
  rationale: यदि यहाँ भी ‘शरीर के अनुसार’ रखा जाए तो पिछले वाक्य से प्रत्यक्ष विरोधाभास अधिक तीखा और संभवतः भ्रामक लगेगा। अंग्रेज़ी साक्ष्य के आशय के अनुसार देहधारी जीवन में किए कामों का भाव दिया गया है, पर स्रोत-समीक्षा की आवश्यकता पादटिप्पणी में स्पष्ट है।
- issue: लेखक का आत्म-अर्पण
  choice: ‘अपने आपको बलि के रूप में समर्पित करता हूँ’
  alternative: ‘मैं तुम्हारा प्रायश्चित-बलिदान हूँ’
  rationale: प्रायश्चित का विशिष्ट धर्मवैचारिक अर्थ थोपे बिना अर्पण/बलि की तीव्र रूपकात्मक भाषा सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक संबोधन के लिए ‘तुम’ का प्रयोग किया गया है। वाक्य-संरचना को पठनीय बनाया गया है, पर ‘परमेश्वर के अनुसार’, ‘शरीर/आत्मा’ और ‘यीशु मसीह में’ जैसी धर्मवैचारिक अभिव्यक्तियों की वास्तविक अस्पष्टता बनाए रखी गई है। यह मसौदा प्रदत्त सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठपरंपरा के यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
