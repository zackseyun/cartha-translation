review_pass:
  verdict: revise
  source_fidelity: The final sentence must retain the English witness's repeated phrase “according to the flesh”; rendering it as “शरीर में रहते हुए” changes the stated contrast. “Unfaithfulness” is more faithfully and idiomatically paired with “faith” as “अविश्वास” than as “विश्वासघात.” The offering language should not be sharpened into a sacrificial term beyond the witness.
  naturalness: The revision uses natural, dignified modern Hindi while preserving the deliberately parallel body/Spirit and faith/unfaithfulness contrasts. “तुम इफिसियों की कलीसिया” is retained as a clear rendering of the addressed Ephesian church.
  terminology: “शरीर,” “आत्मा,” “आत्मिक,” “विश्वास,” “अविश्वास,” and “यीशु मसीह में” preserve the witness's theological vocabulary without doctrinal expansion. “भेंट के रूप में अर्पित” conveys an offering without imposing a specific atoning or ritual sense.
  issues:
  - severity: high
    issue: The final occurrence of “after/according to the flesh” is translated as “शरीर में रहते हुए.”
    rationale: The supplied witness explicitly says that what they do “according to the flesh” is spiritual. Recasting this as actions done while bodily alive resolves the tension interpretively and changes the source wording.
  - severity: medium
    issue: “Unfaithfulness” is rendered “विश्वासघात.”
    rationale: “विश्वासघात” normally means betrayal or treachery. “अविश्वास” more directly preserves the lexical and rhetorical opposition to “विश्वास” in the supplied witness.
  - severity: medium
    issue: “Offering” is rendered as “बलि.”
    rationale: “बलि” may specify a sacrificial offering more strongly than the supplied English witness warrants. “भेंट के रूप में अर्पित” retains the offering metaphor without overdetermining it.
