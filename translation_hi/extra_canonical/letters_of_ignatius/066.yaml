base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/066.yaml
  text: 'Therefore, as children [of the light] of truth, avoid division and false teachings. Where the shepherd is, follow him like sheep.


    For many persuasive wolves use harmful pleasures to take captive those running in God’s race. But where you are united, they will find no place.'
translation:
  language: hi
  text: 'इसलिए सत्य की ज्योति की सन्तान होकर[a] फूट और गलत शिक्षाओं से दूर रहो। जहाँ चरवाहा हो, वहाँ भेड़ों की तरह उसके पीछे चलो।


    क्योंकि बहुत-से लुभावने भेड़िए हानिकारक सुखों के द्वारा परमेश्वर की दौड़ में दौड़नेवालों को बन्दी बना लेते हैं; पर जहाँ तुम एक बने रहते हो, वहाँ उन्हें कोई जगह नहीं मिलेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में “ज्योति की” शब्द कोष्ठकों में हैं; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: आपूर्त साक्ष्य में चिह्नित पाठगत अनिश्चितता को पारदर्शी रूप से सुरक्षित रखना।
lexical_decisions:
- source_word: children [of the light] of the truth
  choice: सत्य की ज्योति की सन्तान
  rationale: आपूर्त अंग्रेज़ी साक्ष्य में कोष्ठकीय शब्दों की अनिश्चितता को पादटिप्पणी सहित सुरक्षित रखते हुए स्वाभाविक हिन्दी वाक्यांश बनाया गया है।
- source_word: division
  choice: फूट
  rationale: सामुदायिक विघटन और आपसी विभाजन का संक्षिप्त तथा सामान्य हिन्दी बोध देता है।
- source_word: wrong doctrines
  choice: गलत शिक्षाएँ
  rationale: सिद्धान्तगत अर्थ को बनाए रखता है, पर अत्यधिक पारिभाषिक या सम्प्रदायगत भाषा से बचता है।
- source_word: specious wolves
  choice: लुभावने भेड़िए
  rationale: ऐसे भेड़ियों का भाव व्यक्त करता है जो ऊपर से आकर्षक या विश्वासयोग्य प्रतीत होते हैं।
- source_word: baneful delights
  choice: हानिकारक सुख
  rationale: आनन्द के आकर्षण और उसके विनाशकारी प्रभाव, दोनों को सुरक्षित रखता है।
- source_word: runners in God's race
  choice: परमेश्वर की दौड़ में दौड़नेवाले
  rationale: मूल साक्ष्य के दौड़-वाले रूपक को स्पष्ट रूप से बनाए रखता है।
- source_word: where ye are at one
  choice: जहाँ तुम एक बने रहते हो
  rationale: सामुदायिक एकता का अर्थ देता है और इसे किसी विशिष्ट संस्थागत व्याख्या तक सीमित नहीं करता।
theological_decisions:
- issue: ‘चरवाहा’ की पहचान
  choice: चरवाहा
  alternative: अध्यक्ष/बिशप
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में रूपकात्मक ‘shepherd’ है; स्रोत-भाषा की प्रत्यक्ष समीक्षा लंबित होने के कारण किसी विशिष्ट कलीसियाई पद को आरोपित नहीं किया गया।
- issue: कोष्ठकीय ‘of the light’ की पाठगत स्थिति
  choice: मुख्य पाठ में ‘ज्योति की’ रखकर [a] पादटिप्पणी
  alternative: इसे बिना संकेत के शामिल करना अथवा हटा देना
  rationale: दिए गए साक्ष्य की वास्तविक अनिश्चितता को पाठक के सामने सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामुदायिक उपदेश का सीधा स्वर रखा गया है। बहुवचन सम्बोधन के लिए ‘तुम’ प्रयुक्त है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठ यूनानी परम्परा की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित है।
