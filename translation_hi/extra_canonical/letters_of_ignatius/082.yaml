  english_witness: 'Let no man be deceived. Even the heavenly beings and the glory of the angels and the rulers visible and invisible, if they believe not in the blood of Christ [who is God], judgment awaiteth them also. He that receiveth let him receive. Let not office puff up any man; for faith and love are all in all, and nothing is preferred before them.


