  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुलभ रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष मध्य-पाठ यूनानी परंपरा की समीक्षा लंबित होने के कारण पाठीय और शब्दार्थ संबंधी निष्कर्ष अस्थायी सावधानी के साथ प्रस्तुत हैं। संबोधन में सामुदायिक बहुवचन ‘ध्यान दो’ अपनाया गया है।
