base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/082.yaml
  text: 'Let no one be deceived. Even the heavenly beings, the glory of the angels, and the rulers, visible and invisible—if they do not believe in the blood of Christ [who is God], judgment awaits them also. He who receives, let him receive. Let no one be puffed up by office, for faith and love are all in all, and nothing is preferred before them.


    But mark those who hold strange doctrine concerning the grace of Jesus Christ that came to us, how they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from the eucharist (thanksgiving) and prayer because they do not acknowledge that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins and which the Father, in His goodness, raised up.'
translation:
  language: hi
  text: 'कोई धोखा न खाए। यहाँ तक कि स्वर्गीय प्राणी, स्वर्गदूतों की महिमा, और दृश्य तथा अदृश्य शासक भी—यदि वे मसीह के लहू पर विश्वास नहीं करते [जो परमेश्वर हैं][a]—तो न्याय उनकी भी प्रतीक्षा करता है। जो इसे ग्रहण कर सकता है, वह ग्रहण करे। किसी को उसका पद घमंडी न बनाए, क्योंकि विश्वास और प्रेम ही सर्वोपरि हैं, और उनसे बढ़कर कुछ भी नहीं है।


    पर उन लोगों पर ध्यान दो जो हमारे पास पहुँचे यीशु मसीह के अनुग्रह के विषय में परायी शिक्षा देते हैं—देखो, वे परमेश्वर की इच्छा के कितने विरुद्ध हैं। उन्हें न प्रेम की चिंता है, न विधवा की, न अनाथ की, न पीड़ित की, न बंदी की, और न भूखे या प्यासे की। वे यूखरिस्त (धन्यवाद)[b] और प्रार्थना से दूर रहते हैं, क्योंकि वे यह स्वीकार नहीं करते कि यूखरिस्त हमारे उद्धारकर्ता यीशु मसीह का शरीर है—वही शरीर जिसने हमारे पापों के लिए दुःख सहा और जिसे पिता ने अपनी भलाई में मरे हुओं में से जिलाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जो परमेश्वर हैं” वाक्यांश उपलब्ध साक्ष्य में वर्ग कोष्ठकों में है; इससे उसके पाठीय पुनर्स्थापन या पांडुलिपीय दर्जे का संकेत मिलता है। प्रत्यक्ष यूनानी पाठ-समीक्षा अभी लंबित है।
    reason: महत्त्वपूर्ण मसीह-विषयक वाक्यांश के अनिश्चित पाठीय दर्जे को पारदर्शी रखना।
  - marker: b
    text: “यूखरिस्त” यूनानी मूल का शब्द है जिसका शाब्दिक अर्थ “धन्यवाद” है; यहाँ यह आरंभिक मसीही सामुदायिक भोज के लिए प्रयुक्त है।
    reason: ऐतिहासिक पद को बनाए रखते हुए सामान्य पाठक को उसका अर्थ बताना।
lexical_decisions:
- source_word: heavenly beings
  choice: स्वर्गीय प्राणी
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के व्यापक अर्थ को बनाए रखता है और इसे अनावश्यक रूप से किसी विशिष्ट स्वर्गीय श्रेणी तक सीमित नहीं करता।
- source_word: rulers visible and invisible
  choice: दृश्य तथा अदृश्य शासक
  rationale: शक्तियों की दोनों श्रेणियों और मूल समानांतर संरचना को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: office
  choice: पद
  rationale: आधुनिक हिंदी में अधिकार या कलीसियाई दायित्व से मिलने वाली प्रतिष्ठा का स्वाभाविक संकेत देता है, बिना किसी खास पदनाम को आरोपित किए।
- source_word: strange doctrine
  choice: परायी शिक्षा
  rationale: ऐसी शिक्षा का भाव देता है जो प्राप्त प्रेरितीय विश्वास से अलग है; 'विचित्र' की अपेक्षा धार्मिक संदर्भ में अधिक स्वाभाविक है।
- source_word: mind of God
  choice: परमेश्वर की इच्छा
  rationale: हिंदी में नैतिक अभिप्राय को स्वाभाविक बनाता है; फिर भी यह चयन संभावित 'मन/विचार' अर्थ की तुलना में कुछ गतिशील है।
- source_word: eucharist (thanksgiving)
  choice: यूखरिस्त (धन्यवाद)
  rationale: ऐतिहासिक पारिभाषिक शब्द और उसके शाब्दिक अर्थ, दोनों को सुरक्षित रखता है।
- source_word: flesh
  choice: शरीर
  rationale: आधुनिक हिंदी में देहधारण और वास्तविक दुःख की बात को स्वाभाविक ढंग से व्यक्त करता है; 'मांस' यहाँ भ्रामक या असहज हो सकता है।
theological_decisions:
- issue: कोष्ठकित मसीह-विषयक वाक्यांश
  choice: '[जो परमेश्वर हैं] को मुख्य पाठ में वर्ग कोष्ठकों सहित रखा गया'
  alternative: वाक्यांश हटाना या बिना संकेत के समाहित करना
  rationale: प्रदत्त साक्ष्य इसे पाठीय पुनर्स्थापन अथवा पांडुलिपीय संकेत के रूप में चिह्नित करता है; उसका दर्जा छिपाए बिना कथन सुरक्षित रखा गया है।
- issue: यूखरिस्त और मसीह के शरीर का संबंध
  choice: ‘यूखरिस्त ... यीशु मसीह का शरीर है’ का सीधा कथन सुरक्षित रखा
  alternative: इसे केवल प्रतीकात्मक या किसी विशिष्ट संस्कार-सिद्धांत के अनुसार व्याख्यायित करना
  rationale: लेखक के विवादात्मक कथन और उसके धार्मिक तनाव को बिना सांप्रदायिक विस्तार के बनाए रखना आवश्यक है।
- issue: पुनरुत्थान का कर्ता और आधार
  choice: ‘पिता ने अपनी भलाई में ... जिलाया’
  alternative: निष्क्रिय वाक्य या केवल ‘जी उठा’
  rationale: प्रदत्त साक्ष्य में पिता की सक्रियता और भलाई दोनों स्पष्ट हैं।
- issue: ‘He that receiveth’ का अस्पष्ट कर्म
  choice: ‘जो इसे ग्रहण कर सकता है, वह ग्रहण करे’
  alternative: ‘जो स्वीकार करता है, वह स्वीकार करे’ या किसी निश्चित शिक्षा को कर्म बनाना
  rationale: उक्ति का संकेत अस्पष्ट है; ‘इसे’ पूर्ववर्ती कथन की ओर हल्का संकेत देता है, जबकि ‘कर सकता है’ पारंपरिक सूक्तिपरक हिंदी बनाता है, पर किसी विस्तृत सिद्धांत को नहीं जोड़ता।
