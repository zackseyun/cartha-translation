base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/036.yaml
  text: 'Therefore, make every effort to be firmly established in the ordinances of the Lord and of the apostles, so that you may prosper in everything you do, in flesh and spirit, through faith and love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, just as Jesus Christ was to the Father [according to the flesh], and as the apostles were to Christ and to the Father, so that there may be union of both flesh and spirit.'
translation:
  language: hi
  text: 'इसलिए पूरा प्रयत्न करो कि तुम प्रभु और प्रेरितों की विधियों में दृढ़ बने रहो, ताकि तुम जो कुछ भी शरीर और आत्मा में करते हो, उसमें सफल हो—विश्वास और प्रेम के द्वारा, पुत्र और पिता और आत्मा में, आरम्भ और अन्त में—अपने आदरणीय बिशप के साथ, अपने प्राचीनों के समुदाय[a] के सुन्दर ढंग से गुँथे हुए आत्मिक मुकुट के साथ, और उन सेवकों के साथ जो परमेश्वर के मार्ग पर चलते हैं।


    बिशप की और एक-दूसरे की आज्ञा मानो, जैसे यीशु मसीह ने पिता की [शरीर के अनुसार][b] आज्ञा मानी, और जैसे प्रेरितों ने मसीह और पिता की आज्ञा मानी, ताकि शरीर और आत्मा—दोनों की एकता बनी रहे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राचीनों का समुदाय’ से आशय बिशप के साथ सेवा करने वाले कलीसियाई प्राचीनों के सामूहिक निकाय से है।
    reason: ‘प्रेस्बिटरी’ के ऐतिहासिक कलीसियाई अर्थ को स्पष्ट करना।
  - marker: b
    text: ‘शरीर के अनुसार’ शब्द प्राप्त अंग्रेज़ी साक्ष्य में भी कोष्ठकों में हैं; ये सम्भवतः पाठगत अनिश्चितता अथवा सम्पादकीय संकेत दर्शाते हैं। प्रत्यक्ष यूनानी समीक्षा अभी शेष है।
    reason: आपूर्तित साक्ष्य के पाठ-संकेत को पारदर्शी रूप से सुरक्षित रखना।
lexical_decisions:
- source_word: ordinances
  choice: विधियों
  rationale: यहाँ स्थापित निर्देशों और व्यवस्थाओं का अर्थ है; ‘विधियाँ’ सामान्य पाठक के लिए समझने योग्य रहते हुए संस्थागत भाव को बनाए रखता है।
- source_word: presbytery
  choice: प्राचीनों का समुदाय
  rationale: यह किसी भवन नहीं, बिशप के साथ सेवा करने वाले प्राचीनों के सामूहिक निकाय को दर्शाता है; फुटनोट में पारिभाषिक अर्थ स्पष्ट किया गया है।
- source_word: deacons
  choice: सेवक
  rationale: मूल कलीसियाई सेवक-पद का कार्यात्मक अर्थ देता है; आधुनिक पाठक के लिए सहज है और अनावश्यक संप्रदायगत शब्दावली से बचता है।
- source_word: walk after God
  choice: परमेश्वर के मार्ग पर चलते हैं
  rationale: शाब्दिक चलने के बजाय जीवन-आचरण का मुहावरेदार अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: fitly wreathed spiritual circlet
  choice: सुन्दर ढंग से गुँथा हुआ आत्मिक मुकुट
  rationale: माला अथवा मुकुट की सामूहिक रूपक-छवि को बनाए रखता है, जिसमें प्राचीनों का निकाय बिशप के चारों ओर सुसंगठित दिखाई देता है।
- source_word: flesh and spirit
  choice: शरीर और आत्मा
  rationale: मानवीय जीवन के दृश्य और आत्मिक पक्षों के बीच मूल तनाव और समानांतरता को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु मसीह की पिता के प्रति आज्ञाकारिता
  choice: जैसे यीशु मसीह ने पिता की [शरीर के अनुसार] आज्ञा मानी
  alternative: जैसे यीशु मसीह शरीर में पिता के अधीन थे
  rationale: ‘आज्ञा मानना’ अनुच्छेद की मुख्य आज्ञा के साथ समानांतरता बनाए रखता है; कोष्ठकीय वाक्यांश को पाठ-संकेत के रूप में सुरक्षित रखा गया है, बिना मसीह के स्वभावों के संबंध को अतिरिक्त रूप से परिभाषित किए।
- issue: पुत्र, पिता और आत्मा का त्रिपदीय उल्लेख
  choice: पुत्र और पिता और आत्मा में
  alternative: पुत्र, पिता और पवित्र आत्मा में
  rationale: प्राप्त साक्ष्य में ‘पवित्र’ नहीं है और बार-बार प्रयुक्त ‘और’ की शैलीगत तथा धर्मवैचारिक संरचना को बनाए रखना उचित है।
- issue: शरीर और आत्मा की एकता
  choice: शरीर और आत्मा—दोनों की एकता
  alternative: दैहिक और आत्मिक एकता
  rationale: ठोस मूल शब्दों को बनाए रखने से यह अस्पष्टता सुरक्षित रहती है कि लेखक व्यक्ति के दोनों पक्षों, समुदाय की दृश्य-आत्मिक एकता, या दोनों की बात कर रहा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक और उपदेशात्मक शैली रखी गई है। बहुवचन ‘तुम’ मूल के सामूहिक संबोधन को व्यक्त करता है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और लेखापरीक्षित अंग्रेज़ी POB पर आधारित अस्थायी स्रोत-संगत अनुवाद है; मध्य-पाठ यूनानी परम्परा की प्रत्यक्ष समीक्षा लंबित होने के कारण किसी संभावित यूनानी सूक्ष्मता का दावा नहीं किया गया है।
