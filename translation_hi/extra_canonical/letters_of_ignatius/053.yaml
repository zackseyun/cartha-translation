source:
  text: Ignatius, who is also Theophorus, unto her that hath found mercy in the bountifulness of the Father Most High and of Jesus Christ His only Son; to the church that is beloved and enlightened through the will of Him who willed all things that are, by faith and love towards Jesus Christ our God; even unto her that hath the presidency in the country of the region of the Romans, being worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father's name; which church also I salute in the name of Jesus Christ the Son of the Father; unto them that in flesh and spirit are united unto His every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain; abundant greeting in Jesus Christ our God in blamelessness.
