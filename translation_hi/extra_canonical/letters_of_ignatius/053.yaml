base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/053.yaml
  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
translation:
  language: hi
  text: इग्नातियुस, जो थियोफ़ोरुस भी कहलाता है, उस कलीसिया को जो परमप्रधान पिता और उसके एकलौते पुत्र यीशु मसीह की उदारता में दया की भागी हुई है; उस कलीसिया को जो उस परमेश्वर की इच्छा से—जिसने सभी अस्तित्वमान वस्तुओं के होने की इच्छा की—प्रिय ठहराई गई और ज्योति पाई है, और यह यीशु मसीह हमारे परमेश्वर के प्रति विश्वास और प्रेम के द्वारा हुआ है; अर्थात उस कलीसिया को जो रोमियों के क्षेत्र में अध्यक्षता करती है, जो परमेश्वर के योग्य, आदर के योग्य, बधाई के योग्य, प्रशंसा के योग्य, सफलता के योग्य और शुद्धता में योग्य है; जो प्रेम की अध्यक्षता करती है, मसीह की व्यवस्था के अनुसार चलती है और पिता का नाम धारण करती है। इसी कलीसिया को मैं पिता के पुत्र यीशु मसीह के नाम में नमस्कार करता हूँ। उन लोगों को, जो शरीर और आत्मा में उसकी हर आज्ञा से जुड़े हुए हैं, जो बिना डगमगाए परमेश्वर के अनुग्रह से भरपूर हैं और हर बाहरी कलंक से छानकर निर्मल किए गए हैं—हमारे परमेश्वर यीशु मसीह में, निर्दोषता सहित, भरपूर नमस्कार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεοφόρος (Theophorus)
  choice: थियोफ़ोरुस
  rationale: उपनाम को अर्थानुवाद द्वारा किसी एक व्युत्पत्ति में बाँधने के बजाय लिप्यंतरित किया गया है, क्योंकि इसका आशय ‘परमेश्वर को धारण करने वाला’ अथवा ‘परमेश्वर द्वारा धारण किया गया’ समझा जा सकता है।
- source_word: προκάθηται / προκάθημένη (presidency language)
  choice: अध्यक्षता करती है / प्रेम की अध्यक्षता करती है
  rationale: बार-बार आने वाली नेतृत्व-संबंधी भाषा को बनाए रखा गया है और उसे अधिकार-क्षेत्र, सर्वोच्चता या केवल सेवा जैसे किसी विशिष्ट संस्थागत अर्थ में सीमित नहीं किया गया।
- source_word: ἀγάπη (agapē)
  choice: प्रेम
  rationale: सामान्य और धर्मवैचारिक दोनों आयाम खुले रखता है; इसे ‘प्रेम-भोज’ या किसी विशेष कलीसियाई संस्था के रूप में नहीं समझाया गया।
- source_word: ἀποδιϋλισμένοι (filtered clear)
  choice: छानकर निर्मल किए गए
  rationale: मूल की असामान्य छनाई-संबंधी छवि सुरक्षित रखी गई है, यद्यपि स्वाभाविक हिन्दी के लिए ‘निर्मल’ जोड़ा गया।
- source_word: ἀλλοτρίου χρώματος (foreign stain/color)
  choice: हर बाहरी कलंक
  rationale: ‘पराया रंग’ की शाब्दिक छवि हिन्दी में अस्पष्ट हो सकती थी; ‘बाहरी कलंक’ अलग या विजातीय दूषण का भाव रखता है, बिना उसका सैद्धांतिक अर्थ तय किए।
- source_word: ἀξιόχαιρε (worthy of felicitation/greeting)
  choice: बधाई के योग्य
  rationale: योग्यता-वाचक आवृत्ति बनाए रखते हुए आधुनिक हिन्दी में बोधगम्य अभिव्यक्ति चुनी गई।
- source_word: ἀξιότευκτος (worthy of success/attainment)
  choice: सफलता के योग्य
  rationale: दुर्लभ पद के संभावित ‘लक्ष्य-प्राप्ति/सफलता’ भाव को रखा गया; अधिक निश्चित व्याख्या से बचा गया।
theological_decisions:
- issue: यीशु मसीह के लिए ‘हमारे परमेश्वर’
  choice: यीशु मसीह हमारे परमेश्वर / हमारे परमेश्वर यीशु मसीह
  alternative: ‘हमारे परमेश्वर के यीशु मसीह’ अथवा पद को नरम करना
  rationale: प्राप्त साक्ष्य में स्पष्ट उच्च मसीह-विज्ञान को यथावत रखा गया है; हिन्दी वाक्यरचना में यीशु मसीह को ‘हमारे परमेश्वर’ का समानाधिकरण माना गया।
- issue: रोम की कलीसिया की अध्यक्षता
  choice: ‘रोमियों के क्षेत्र में अध्यक्षता करती है’ और ‘प्रेम की अध्यक्षता करती है’
  alternative: ‘रोम क्षेत्र में प्रमुख है’ या ‘प्रेम में अगुवाई करती है’
  rationale: भौगोलिक और प्रेम-संबंधी दोनों कथनों की जानबूझकर अस्पष्टता तथा समानांतरता रखी गई; किसी बाद की कलीसियाई शासन-व्यवस्था को पाठ में नहीं डाला गया।
- issue: ‘उसकी हर आज्ञा’ में सर्वनाम का संदर्भ
  choice: ‘उसकी’ को बिना स्पष्ट नाम दोहराए रखा गया
  alternative: ‘यीशु मसीह की हर आज्ञा’ या ‘परमेश्वर की हर आज्ञा’
  rationale: साक्ष्य में सर्वनाम का संभावित संदर्भ पूरी तरह स्पष्ट नहीं है; अनुवाद ने इस अस्पष्टता को हल नहीं किया।
- issue: शरीर और आत्मा में एकता
  choice: ‘शरीर और आत्मा में ... जुड़े हुए’
  alternative: ‘दैहिक और आत्मिक रूप से पूर्णतः आज्ञाकारी’
  rationale: मानवीय समग्रता, सामुदायिक एकता और आज्ञाओं से संबंध—इन संभावनाओं को खुला रखने के लिए व्याख्यात्मक विस्तार से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पत्र-प्रस्तावना। मूल की लंबी, अलंकृत वाक्यरचना और ‘योग्य’ की आवृत्ति पर्याप्त रूप से सुरक्षित रखी गई है, पर पठनीयता के लिए विरामचिह्न और वाक्य-विभाजन अपनाए गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण दुर्लभ पदों और वाक्य-संबंधों पर यह मसौदा अस्थायी है। कोई पाद-टिप्पणी नहीं दी गई, इसलिए मुख्य पाठ में पाद-टिप्पणी चिह्न नहीं हैं।
