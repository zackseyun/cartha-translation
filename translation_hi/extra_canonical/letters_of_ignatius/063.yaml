base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/063.yaml
  text: 'I am writing these things to you from Smyrna by the hand of the Ephesians, who are worthy of every congratulation. Crocus also, a name very dear to me, is here with me, along with many others.


    Regarding those who went ahead of me from Syria to Rome for the glory of God, I believe you have received instructions. Let them also know that I am near, for they are all worthy of God and of you, and it is fitting for you to refresh them in every way.


    I am writing these things to you on the ninth day before the Calends of September. Farewell to the end as you wait patiently for Jesus Christ.'
translation:
  language: hi
  text: 'अब मैं ये बातें स्मुरना से इफिसुस के विश्वासियों के हाथ तुम्हें लिख रहा हूँ। वे हर प्रकार की बधाई के योग्य हैं। क्रोकुस भी, जिसका नाम मुझे अत्यंत प्रिय है, और बहुत-से अन्य लोग मेरे साथ हैं।


    जो लोग परमेश्वर की महिमा के लिए मुझसे पहले सीरिया से रोम गए थे, उनके विषय में मुझे विश्वास है कि तुम्हें निर्देश मिल चुके हैं। उन्हें यह भी बता देना कि मैं निकट हूँ; क्योंकि वे सभी परमेश्वर और तुम्हारे योग्य हैं, और उचित है कि तुम हर प्रकार से उन्हें तरोताज़ा करो।


    मैं ये बातें सितंबर के कलेंद्स से नौ दिन पहले[a] तुम्हें लिख रहा हूँ। यीशु मसीह की धीरज के साथ प्रतीक्षा करते हुए अंत तक कुशल से रहो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह रोमी पंचांग की तिथि है। सितंबर के कलेंद्स अर्थात 1 सितंबर से पीछे समावेशी गणना करने पर यह लगभग 24 अगस्त पड़ती है; मूल तिथि-पद्धति पाठ में बनाए रखी गई है।
    reason: आधुनिक पाठक के लिए प्राचीन रोमी तिथि-सूत्र समझाना और अनिश्चित रूपांतरण को मुख्य पाठ में न थोपना।
lexical_decisions:
- source_word: Smyrna
  choice: स्मुरना
  rationale: प्राचीन नगर के यूनानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: Ephesians
  choice: इफिसुस के विश्वासी
  rationale: केवल नगर-निवासी कहने के बजाय पत्र के मसीही संदर्भ को सामान्य पाठक के लिए स्पष्ट करता है, यद्यपि उपलब्ध अंग्रेज़ी साक्षी में संक्षेप से 'Ephesians' है।
- source_word: Crocus
  choice: क्रोकुस
  rationale: व्यक्तिनाम का ध्वन्यात्मक लिप्यंतरण।
- source_word: refresh
  choice: तरोताज़ा करो
  rationale: आतिथ्य, सहायता और उत्साह देने की व्यापक अर्थ-छाया को बनाए रखने वाला स्वाभाविक हिन्दी पद।
- source_word: Calends
  choice: कलेंद्स
  rationale: रोमी पंचांग की मूल तिथि-पद्धति को बिना अनुमानित आधुनिक रूपांतरण के सुरक्षित रखा गया है।
- source_word: patient waiting
  choice: धीरज के साथ प्रतीक्षा
  rationale: प्रतीक्षा और सहनशील दृढ़ता, दोनों भावों को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ‘unto the glory of God’ का संबंध
  choice: परमेश्वर की महिमा के लिए ... गए थे
  alternative: परमेश्वर की महिमा तक पहुँचने के लिए गए थे
  rationale: वाक्य को उद्देश्यसूचक रखा गया है और शहादत अथवा किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को अनावश्यक रूप से आरोपित नहीं किया गया।
- issue: ‘worthy of God and of you’
  choice: परमेश्वर और तुम्हारे योग्य
  alternative: परमेश्वर और तुम्हारे सम्मान के योग्य
  rationale: मूल साक्षी की असामान्य और तनावपूर्ण अभिव्यक्ति को व्याख्यात्मक विस्तार से हल किए बिना सुरक्षित रखा गया है।
- issue: अंतिम अभिवादन का कालगत बल
  choice: अंत तक कुशल से रहो
  alternative: अंततः विदा
  rationale: ‘unto the end’ को अंतिम दृढ़ता के अर्थ में रखा गया है, न कि केवल पत्र के समापन-सूत्र के रूप में।
