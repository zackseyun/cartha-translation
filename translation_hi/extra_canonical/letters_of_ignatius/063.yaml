  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। बहुवचन संबोधन के लिए ‘तुम/तुम्हें’ रखा गया है। उपलब्ध सामग्री प्रत्यक्ष यूनानी पाठ नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; इसलिए यह मसौदा स्रोत-भाषा समीक्षा लंबित होने की स्थिति में सावधानीपूर्वक तैयार किया गया है।
