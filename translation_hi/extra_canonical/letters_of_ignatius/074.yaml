base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/074.yaml
  text: 'Seeing that in answer to your prayer and to the tender sympathy which you have in Christ Jesus, it has been reported to me that the church which is in Antioch of Syria has peace, it is becoming for you, as a church of God, to appoint a deacon to go there as God’s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he who shall be counted worthy of such a ministration; and you yourselves shall be glorified. Now if you desire it, it is not impossible for you to do this for the name of God, even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
translation:
  language: hi
  text: 'चूँकि आपकी प्रार्थना और उस कोमल करुणा के फलस्वरूप, जो आप मसीह यीशु में रखते हैं, मुझे यह समाचार मिला है कि सीरिया के अन्ताकिया की कलीसिया में शान्ति है, इसलिए परमेश्वर की कलीसिया होने के नाते आपके लिए उचित है कि आप एक सेवक[a] नियुक्त करें, जो परमेश्वर के दूत के रूप में वहाँ जाए, ताकि उनके एकत्र होने पर वह उन्हें बधाई दे और उस नाम[b] की महिमा करे।



    धन्य है वह व्यक्ति जो मसीह यीशु में ऐसी सेवा के योग्य ठहराया जाएगा; और आप भी महिमा पाएँगे। यदि आप ऐसा करना चाहते हैं, तो परमेश्वर के नाम के लिए यह आपके लिए असम्भव नहीं है; क्योंकि निकटतम कलीसियाओं ने बिशपों[c] को भेजा है, और अन्य कलीसियाओं ने प्राचीनों[d] तथा सेवकों[a] को।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “सेवक” प्रारम्भिक कलीसिया के एक मान्य सेवक-पद (डीकन) के लिए प्रयुक्त है।
    reason: सामान्य सेवा और विशिष्ट कलीसियाई पद के बीच सम्भावित भ्रम दूर करना।
  - marker: b
    text: “उस नाम” एक श्रद्धापूर्ण संकेत है; उपलब्ध अंग्रेज़ी साक्ष्य इसे और स्पष्ट नहीं करता।
    reason: पाठ की वास्तविक अस्पष्टता को सुरक्षित और पाठक के लिए दृश्यमान रखना।
  - marker: c
    text: “बिशप” का अर्थ यहाँ प्रारम्भिक कलीसिया का अध्यक्ष या निरीक्षक है; बाद के सभी संस्थागत अर्थ अनिवार्यतः इसमें निहित नहीं हैं।
    reason: उत्तरकालीन सम्प्रदायगत धारणाएँ आरोपित करने से बचना।
  - marker: d
    text: “प्राचीन” यहाँ कलीसिया के मान्य अगुवे या पदाधिकारी के अर्थ में है।
    reason: इसे केवल आयु में वृद्ध व्यक्ति समझे जाने से बचाना।
lexical_decisions:
- source_word: διάκονος / deacon (English witness)
  choice: सेवक
  rationale: सामान्य आधुनिक हिन्दी में स्वाभाविक रहते हुए कलीसियाई सेवक-पद का अर्थ देता है; पद-सूचक अर्थ स्पष्ट करने के लिए पादटिप्पणी जोड़ी गई है।
- source_word: πρεσβύτεροι / presbyters (English witness)
  choice: प्राचीन
  rationale: प्रारम्भिक कलीसिया के पद के लिए प्रचलित बाइबलीय हिन्दी शब्द; इसे केवल सामान्य वृद्ध व्यक्ति समझे जाने से बचाने हेतु पादटिप्पणी दी गई है।
- source_word: ἐπίσκοποι / bishops (English witness)
  choice: बिशप
  rationale: पदनामों के बीच का भेद बनाए रखता है और आधुनिक पाठकों के लिए पहचाने जाने योग्य है; ऐतिहासिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τὸ ὄνομα / the Name (English witness)
  choice: उस नाम
  rationale: मूल साक्ष्य में निहित श्रद्धापूर्ण, संक्षिप्त संकेत को बनाए रखता है और उसे चुपचाप किसी स्पष्ट नाम से प्रतिस्थापित नहीं करता।
- source_word: God’s ambassador
  choice: परमेश्वर के दूत
  rationale: प्रतिनिधि बनकर भेजे जाने का भाव सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ministration
  choice: सेवा
  rationale: धार्मिक सेवा के अर्थ को सामान्य पाठक के लिए स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: “the Name” किसकी ओर संकेत करता है
  choice: “उस नाम” के रूप में संकेतात्मक रखा गया
  alternative: “परमेश्वर के नाम” या “यीशु के नाम” के रूप में स्पष्ट करना
  rationale: उपलब्ध साक्ष्य की श्रद्धापूर्ण अस्पष्टता और धार्मिक तनाव को बनाए रखा गया है।
- issue: प्रारम्भिक कलीसियाई पदनामों का अनुवाद
  choice: बिशप, प्राचीन और सेवक को अलग-अलग पदनामों के रूप में रखा गया
  alternative: सभी को सामान्य नेतृत्व या सेवकाई-संबंधी शब्दों में मिला देना
  rationale: पाठ में उपस्थित तीन श्रेणियों का भेद सुरक्षित रहता है, बिना बाद की किसी विशेष सम्प्रदायगत शासन-व्यवस्था को आरोपित किए।
- issue: “you yourselves shall be glorified”
  choice: “आप भी महिमा पाएँगे”
  alternative: “आपका भी सम्मान होगा”
  rationale: धार्मिक ‘महिमा’ की सम्भावित गहराई बनाए रखी गई है; इसे केवल मानवीय प्रतिष्ठा तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सरल वाक्य-विन्यास। सामूहिक संबोधन के लिए आदरसूचक “आप” रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठीय यूनानी परम्परा की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित होने के कारण शब्दगत निष्कर्ष अनन्तिम हैं।
