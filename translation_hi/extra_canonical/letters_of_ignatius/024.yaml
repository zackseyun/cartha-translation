    rationale: ‘जो सब बातों से बढ़कर है’ स्रोत के तुलनात्मक बल को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
  revised_text: 'जब मैंने परमेश्वर के मार्गों में आपके प्रेम की अत्यंत उत्तम सुव्यवस्था के विषय में जाना, तो मुझे आनंद हुआ और मैंने यीशु मसीह के विश्वास में आपको संबोधित करने का निश्चय किया।


    क्योंकि मुझे परमेश्वर को शोभा देने वाला एक महान नाम धारण करने योग्य ठहराया गया है, इसलिए मैं इन बेड़ियों में, जिन्हें मैं अपने साथ लिए फिरता हूँ, कलीसियाओं की स्तुति गाता हूँ। और मैं प्रार्थना करता हूँ कि उनमें देह और आत्मा की एकता हो—देह और आत्मा जो यीशु मसीह की हैं, जो हमारा कभी न चूकने वाला जीवन हैं—और विश्वास तथा प्रेम की एकता हो, जो सब बातों से बढ़कर है; और, जो सब से भी बढ़कर है, यीशु और पिता के साथ एकता हो। उन्हीं में, यदि हम इस संसार के शासक की सारी उद्दंडता को धीरज से सहें और उससे बच निकलें, तो हम परमेश्वर तक पहुँचेंगे।'
