base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/024.yaml
  text: 'When I learned of the exceeding good order of your love in the ways of God, I was gladdened and determined to address you in the faith of Jesus Christ.


    For, being counted worthy to bear a most godly name in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ’s, our never-failing life—and union of faith and of love, which is preferred before all things, and—what is more than all—union with Jesus and with the Father, in whom, if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
translation:
  language: hi
  text: 'जब मैंने परमेश्वर के मार्गों पर चलते हुए आपके प्रेम की अत्यंत उत्तम सुव्यवस्था के विषय में जाना, तो मुझे आनंद हुआ और मैंने यीशु मसीह में विश्वास के आधार पर आपको संबोधित करने का निश्चय किया।


    क्योंकि इन बेड़ियों में, जिन्हें मैं अपने साथ लिए फिरता हूँ, मुझे परमेश्वर से जुड़ा एक महान नाम धारण करने के योग्य समझा गया है; इसलिए मैं कलीसियाओं की स्तुति गाता हूँ। मैं प्रार्थना करता हूँ कि उनमें देह और आत्मा की एकता हो—वह देह और आत्मा जो यीशु मसीह के हैं, जो हमारा कभी न चूकने वाला जीवन हैं—और विश्वास तथा प्रेम की एकता हो, जिसे सब बातों से बढ़कर माना जाता है; और सबसे बढ़कर, यीशु और पिता के साथ एकता हो। उन्हीं में यदि हम इस संसार के शासक के सारे अपमान को धीरज से सहें और उससे बच निकलें, तो हम परमेश्वर तक पहुँचेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: good order
  choice: सुव्यवस्था
  rationale: समुदाय के प्रेम में दिखाई देने वाली अनुशासित और उचित व्यवस्था का भाव बनाए रखता है।
- source_word: in the ways of God
  choice: परमेश्वर के मार्गों पर चलते हुए
  rationale: शाब्दिक स्थानवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में आचरण और जीवन-मार्ग के अर्थ सहित व्यक्त करता है।
- source_word: bear a most godly name
  choice: परमेश्वर से जुड़ा एक महान नाम धारण करना
  rationale: स्रोत-समीक्षा लंबित होने के कारण अस्पष्ट ‘name’ को किसी निश्चित उपाधि या ‘Christian’ के रूप में नहीं सुलझाता।
- source_word: bonds
  choice: बेड़ियाँ
  rationale: कैद और बंधन के ठोस भाव को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: prince of this world
  choice: इस संसार का शासक
  rationale: पारंपरिक धार्मिक अर्थ को बनाए रखते हुए अनावश्यक रूप से उसकी पहचान स्पष्ट नहीं करता।
- source_word: attain unto God
  choice: परमेश्वर तक पहुँचेंगे
  rationale: गंतव्य और परमेश्वर-संगति की ओर पहुँचने का भाव सीधे रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ‘देह और आत्मा जो यीशु मसीह के हैं’ का संबंध
  choice: संबंधवाचक वाक्य को देह और आत्मा दोनों से जोड़ा गया
  alternative: इसे कलीसिया की देह-आत्मा की एकता या केवल मसीह के देहधारण का स्पष्ट कथन बनाना
  rationale: उपलब्ध अंग्रेज़ी साक्षी की व्याकरणिक और धर्मवैचारिक जटिलता को बिना एकतरफा समाधान के बनाए रखा गया है।
- issue: ‘in whom’ का पूर्वपद
  choice: ‘उन्हीं में’ द्वारा यीशु और पिता दोनों की ओर संकेत
  alternative: केवल पिता में
  rationale: निकटतम संयुक्त पद ‘यीशु और पिता’ से संबंध बनाए रखते हुए मूल की संभावित अस्पष्टता को पूर्णतः नष्ट नहीं किया गया।
- issue: ‘most godly name’ की पहचान
  choice: नाम को अनिर्दिष्ट रखा गया
  alternative: ‘मसीही नाम’ या ‘परमेश्वर का नाम’
  rationale: प्रत्यक्ष यूनानी समीक्षा लंबित है और उपलब्ध साक्षी किसी विशिष्ट पहचान को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कलीसियाई परंतु सामान्य पाठक के लिए सुबोध शैली। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित है।
