  source_fidelity: मसौदा अंग्रेज़ी साक्षी के अर्थ को प्रायः ठीक रखता है और महत्वपूर्ण अस्पष्टताओं को अनावश्यक धर्मवैचारिक निष्कर्ष में नहीं बदलता। फिर भी दूसरे अनुच्छेद में ‘इन बेड़ियों में’ को ‘योग्य समझे जाने’ से जोड़ दिया गया है, जबकि साक्षी में यह मुख्यतः वक्ता के बंधनों में रहते हुए कलीसियाओं की स्तुति करने से संबद्ध है। ‘परमेश्वर के मार्गों पर चलते हुए’ भी ‘आपके प्रेम’ के साथ ऐसा कर्तृवाचक संबंध बनाता है जो साक्षी में स्पष्ट नहीं है।
  naturalness: भाषा गरिमापूर्ण और पठनीय है। संशोधन में वाक्य-संबंधों को अधिक स्पष्ट तथा स्वाभाविक बनाया गया है, जबकि मूल की दीर्घ प्रार्थना-वाक्य की संरचना और बल बना हुआ है।
  terminology: ‘कलीसियाएँ’, ‘देह’, ‘आत्मा’, ‘विश्वास’, ‘प्रेम’, ‘यीशु’, और ‘पिता’ उपयुक्त हैं। ‘परमेश्वर को शोभा देने वाला’ ‘most godly’ के लिए अधिक निकट है और ‘मसीही’ जैसी अनिर्दिष्ट पहचान नहीं थोपता।
  issues:
