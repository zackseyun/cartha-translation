    issue: ‘इन बेड़ियों में’ का वाक्यगत संबंध बदल गया है।
    rationale: मसौदे में वक्ता को बेड़ियों में ‘नाम धारण करने योग्य’ ठहराया गया है। अंग्रेज़ी साक्षी में योग्य ठहराया जाना नाम धारण करने से और ‘इन बेड़ियों में, जिन्हें मैं लिए फिरता हूँ’ कलीसियाओं की स्तुति करने से जुड़ा है।
  - severity: low
