base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/013.yaml
  text: 'I know who I am and to whom I am writing. I am a condemned prisoner; you have received mercy. I am in danger; you are firmly established.


    You are the highway of those who are on their way to die unto God. You share in the mysteries with Paul, who was sanctified, who received a good testimony, and who is worthy of every congratulation. I would gladly be found following in his footsteps when I shall attain to God. In every letter, he makes mention of you in Christ Jesus.'
translation:
  language: hi
  text: 'मैं जानता हूँ कि मैं कौन हूँ और किन लोगों को लिख रहा हूँ। मैं दोषी ठहराया हुआ बंदी हूँ; तुम पर दया हुई है। मैं संकट में हूँ; तुम दृढ़ता से स्थापित हो।


    तुम उन लोगों का राजमार्ग हो जो परमेश्वर के लिए मरने जा रहे हैं। तुम पौलुस के साथ पवित्र रहस्यों में सहभागी हो—उस पौलुस के, जो पवित्र किया गया, जिसकी अच्छी गवाही दी गई और जो हर प्रकार की बधाई के योग्य है। जब मैं परमेश्वर तक पहुँचूँ, तब मैं उसके पदचिह्नों पर चलता हुआ पाया जाना चाहता हूँ। वह अपने हर पत्र में मसीह यीशु में तुम्हारा उल्लेख करता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने हर पत्र में” का आशय सम्भवतः पौलुस के उन पत्रों से है जिनमें इफिसुस के विश्वासियों या उनकी कलीसिया का उल्लेख समझा गया था। उपलब्ध अंग्रेज़ी साक्ष्य के आधार पर वाक्य का यही स्वाभाविक संबंध है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: यह दावा ऐतिहासिक और पाठगत प्रश्न उठाता है; पादटिप्पणी अनिश्चितता को ईमानदारी से दर्शाती है।
lexical_decisions:
- source_word: convict
  choice: दोषी ठहराया हुआ बंदी
  rationale: यह केवल सामान्य कैद नहीं, न्यायिक दोषसिद्धि का भाव भी सुरक्षित रखता है; इग्नातियुस की बंदी अवस्था आधुनिक हिन्दी में स्पष्ट होती है।
- source_word: established
  choice: दृढ़ता से स्थापित
  rationale: समुदाय की स्थिर और पुष्ट दशा को बिना अतिरिक्त धार्मिक व्याख्या के व्यक्त करता है।
- source_word: high-road
  choice: राजमार्ग
  rationale: मूल साक्ष्य के सजीव मार्ग-रूपक को बनाए रखता है; इसे केवल 'उदाहरण' कहकर अर्थ को सीमित नहीं किया गया।
- source_word: die unto God
  choice: परमेश्वर के लिए मरने
  rationale: '''unto God'' का संबंधगत और लक्ष्यपरक तनाव बनाए रखने के लिए स्वाभाविक हिन्दी प्रयोग चुना गया; ''परमेश्वर में मरना'' अनावश्यक रूप से अस्पष्ट होता।'
- source_word: associates in the mysteries
  choice: पवित्र रहस्यों में सहभागी
  rationale: '''mysteries'' को किसी विशिष्ट संस्कार-सिद्धांत तक सीमित किए बिना धार्मिक अर्थ और बहुवचन सुरक्षित रखता है।'
- source_word: attain unto God
  choice: परमेश्वर तक पहुँचूँ
  rationale: इग्नातियुस की परमेश्वर की ओर अंतिम यात्रा का लक्ष्यपरक भाव सरल और गरिमापूर्ण हिन्दी में सुरक्षित है।
theological_decisions:
- issue: ‘पवित्र रहस्यों’ का सटीक आशय
  choice: पवित्र रहस्यों में सहभागी
  alternative: संस्कारों में सहभागी
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य और लंबित यूनानी समीक्षा के कारण इसे किसी विशेष संस्कार-संबंधी अर्थ में निश्चित नहीं किया गया।
- issue: ‘परमेश्वर के लिए मरना’ और शहादत
  choice: रूपक और मृत्यु-लक्ष्य को यथावत रखना
  alternative: शहीद होने जा रहे हैं
  rationale: '''शहीद'' अर्थ को स्पष्ट कर सकता था, पर उपलब्ध साक्ष्य के ‘die unto God’ को व्याख्यात्मक रूप से संकीर्ण कर देता।'
- issue: पौलुस द्वारा हर पत्र में उल्लेख
  choice: वाक्य को सीधे पौलुस से संबद्ध रखा
  alternative: इग्नातियुस के हर पत्र का संदर्भ
  rationale: व्याकरण और अंग्रेज़ी साक्ष्य में निकटतम पूर्वपद पौलुस है; फिर भी ऐतिहासिक कठिनाई को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक बहुवचन के बजाय निकट और सामुदायिक ‘तुम’ शैली। वाक्य गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रखे गए हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण संदिग्ध बिंदुओं को निर्णायक रूप से नहीं सुलझाया गया।
