  yaml_path: translation/extra_canonical/letters_of_ignatius/002.yaml
  text: 'While I welcomed in God [your] well beloved name, which ye bear by natural right, [in an upright and virtuous mind], by faith and love in Christ Jesus our Savior—being imitators of God, and having your hearts kindled in the blood of God, ye have perfectly fulfilled your congenial work—


    for when ye heard that I was on my way from Syria, in bonds for the sake of the common Name and hope, and was hoping through your prayers to succeed in fighting the wild beasts in Rome, that by so succeeding I might have power to be a disciple, ye were eager to visit me—


    seeing then in God''s name I have received your whole multitude in the person of Onesimus, whose love passeth utterance and who is moreover your bishop [in the flesh], and I pray that ye may love him according to Jesus Christ and that ye all may be like him; for blessed is He that granted unto you according to your deserving to have such a bishop.'
translation:
  language: hi
  text: 'परमेश्वर में मैंने तुम्हारे अत्यंत प्रिय नाम का स्वागत किया है—उस नाम का, जिसे तुम अपने धर्मी स्वभाव के अनुसार धारण करते हो—क्योंकि तुम हमारे उद्धारकर्ता मसीह यीशु में विश्वास और प्रेम रखते हो। परमेश्वर का अनुकरण करनेवाले होकर और परमेश्वर के लहू में अपने स्वभाव के अनुरूप कार्य को फिर प्रज्वलित करके, तुमने उसे पूरी तरह संपन्न किया है।


    क्योंकि जब तुमने सुना कि मैं हम सबके साझा नाम और आशा के लिए बेड़ियों में बँधा हुआ सीरिया से आ रहा हूँ, और यह आशा रखता हूँ कि तुम्हारी प्रार्थनाओं के द्वारा मुझे रोम में जंगली पशुओं से लड़ने में सफलता मिलेगी, ताकि इस सफलता के द्वारा मैं शिष्य होने में समर्थ हो सकूँ, तब तुम मुझसे मिलने के लिए उत्सुक हुए।


    इसलिए मैंने परमेश्वर के नाम में उनेसिमुस के रूप में तुम सबको ग्रहण किया है। उसका प्रेम वर्णन से परे है, और वह शरीर के अनुसार तुम्हारा अध्यक्ष[a] है। मेरी प्रार्थना है कि तुम यीशु मसीह के अनुसार उससे प्रेम करो और तुम सब उसके समान बनो। धन्य है वह परमेश्वर, जिसने तुम्हें—जो इसके योग्य हो—ऐसा अध्यक्ष पाने का वरदान दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ समुदाय की देखरेख करनेवाला अगुआ है; परंपरागत अनुवादों में इसे प्रायः ‘बिशप’ कहा जाता है।
    reason: पदनाम के ऐतिहासिक अर्थ को स्पष्ट करना और आधुनिक संप्रदायगत धारणाओं को सीधे मुख्य पाठ में आरोपित करने से बचना।
lexical_decisions:
- source_word: τὸ πολυαγάπητόν ... ὄνομα
  choice: अत्यंत प्रिय नाम
  rationale: ‘नाम’ की सामुदायिक अथवा धार्मिक पहचान से जुड़ी संभावित व्यापकता को बनाए रखा गया है।
- source_word: φύσει δικαίᾳ
  choice: अपने धर्मी स्वभाव के अनुसार
  rationale: यह पदबंध कठिन है; इसे केवल ‘स्वाभाविक अधिकार’ या केवल ‘सद्गुणी मन’ बनाकर उसका अर्थ सीमित नहीं किया गया।
- source_word: ἐν αἵματι θεοῦ
  choice: परमेश्वर के लहू में
  rationale: असामान्य और धर्मवैज्ञानिक रूप से तनावपूर्ण अभिव्यक्ति को स्पष्ट करने या बदलने के बजाय यथावत रखा गया है।
- source_word: τὸ συγγενικὸν ἔργον
  choice: अपने स्वभाव के अनुरूप कार्य
  rationale: ‘congenial/kindred work’ की कठिन अभिव्यक्ति के लिए ऐसा सहज हिंदी रूप चुना गया है जो संबंध अथवा स्वाभाविक अनुरूपता का भाव बनाए रखता है।
- source_word: τοῦ κοινοῦ ὀνόματος καὶ ἐλπίδος
  choice: हम सबके साझा नाम और आशा
  rationale: ‘नाम’ को ‘मसीही नाम’ कहकर व्याख्यायित नहीं किया गया, जिससे मूल की संक्षिप्तता और संभावित बहुअर्थकता बनी रहे।
- source_word: ἐπίσκοπος
  choice: अध्यक्ष
  rationale: आरंभिक समुदाय में देखरेख और नेतृत्व करनेवाले पद का सामान्य आधुनिक हिंदी रूप; संप्रदाय-विशिष्ट पदनाम से बचा गया है।
theological_decisions:
- issue: ‘परमेश्वर के लहू’ का मसीह-संबंधी आशय
  choice: परमेश्वर के लहू में
  alternative: मसीह के लहू में
  rationale: प्राप्त यूनानी परंपरा से ज्ञात चौंकानेवाली अभिव्यक्ति को धर्मवैज्ञानिक सहजता के लिए बदलना उचित नहीं है।
- issue: इग्नातियुस का ‘शिष्य होने’ का कथन
  choice: मैं शिष्य होने में समर्थ हो सकूँ
  alternative: मैं सच्चा शिष्य सिद्ध हो सकूँ
  rationale: ‘सच्चा’ या ‘सिद्ध’ जोड़ने से आशय स्पष्ट तो होता, पर मूल कथन की विनम्र और तनावपूर्ण भाषा अनावश्यक रूप से निर्णीत हो जाती।
- issue: उनेसिमुस के पद का अनुवाद
  choice: अध्यक्ष
  alternative: बिशप
  rationale: ऐतिहासिक पद को स्वीकार करते हुए भी बाद की किसी विशिष्ट कलीसियाई संरचना को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। लंबे मूल वाक्य को पठनीय हिंदी वाक्यों में बाँटा गया है, पर तर्कक्रम सुरक्षित है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और मध्य-पाठ-परंपरा के ज्ञात यूनानी पाठ के आधार पर तैयार किया गया है; औपचारिक प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित होने के कारण कठिन पदबंधों में सावधानी और वास्तविक अस्पष्टता बनाए रखी गई है।
