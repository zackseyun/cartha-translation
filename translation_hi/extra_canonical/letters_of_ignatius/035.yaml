  english_witness: Let me have joy of you in all things, if I be worthy. For even though I am in bonds, yet am I not comparable to one of you who are at liberty. I know that ye are not puffed up; for ye have Jesus Christ in yourselves. And, when I praise you, I know that ye only feel the more shame; as it is written the righteous man is a self-accuser.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/035.yaml
  text: May I have joy in you in all things, if I am worthy. For even though I am in chains, I am not comparable to any one of you who are free. I know that you are not puffed up, for you have Jesus Christ within you. And when I praise you, I know that you only feel all the more ashamed, as it is written, “The righteous person accuses himself.”
translation:
  language: hi
  text: यदि मैं योग्य हूँ, तो मुझे हर बात में तुमसे आनन्द मिले। क्योंकि यद्यपि मैं बेड़ियों में हूँ, फिर भी मैं तुममें से किसी एक के भी बराबर नहीं, जो स्वतंत्र हो। मैं जानता हूँ कि तुम घमण्ड से फूले नहीं हो, क्योंकि यीशु मसीह तुम्हारे भीतर हैं। और जब मैं तुम्हारी प्रशंसा करता हूँ, तो मैं जानता हूँ कि तुम और भी अधिक लज्जित होते हो; जैसा लिखा है, “धर्मी मनुष्य स्वयं अपने ऊपर दोष लगाता है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी पाठ है; मध्य-पाठ-परम्परा के यूनानी स्रोत से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: प्रदान किए गए आधार-पाठ की स्रोतगत सीमा और यूनानी समीक्षा की लंबित स्थिति स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: have joy of you
  choice: तुमसे आनन्द मिले
  rationale: समुदाय के कारण आनन्द पाने की सम्बन्धपरक भावना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: bonds
  choice: बेड़ियों में
  rationale: लेखक की कैद को ठोस और गरिमापूर्ण ढंग से व्यक्त करता है; केवल सामान्य कठिनाई का अर्थ नहीं देता।
- source_word: not puffed up
  choice: घमण्ड से फूले नहीं हो
  rationale: अहंकार के रूपक को हिन्दी में पहचाने जाने योग्य ढंग से बनाए रखता है।
- source_word: in yourselves
  choice: तुम्हारे भीतर
  rationale: मसीह की आन्तरिक उपस्थिति के कथन को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
- source_word: self-accuser
  choice: स्वयं अपने ऊपर दोष लगाता है
  rationale: आत्म-परीक्षण या पाप-स्वीकार जैसी किसी संकीर्ण व्याख्या को थोपे बिना उपलब्ध साक्षी का सीधा अर्थ देता है।
theological_decisions:
- issue: “Jesus Christ within you” में उपस्थिति का स्वरूप
  choice: यीशु मसीह तुम्हारे भीतर हैं
  alternative: यीशु मसीह तुममें वास करते हैं
  rationale: ‘भीतर हैं’ स्रोत-साक्षी की अस्पष्टता बनाए रखता है और ‘वास’ से जुड़ी अतिरिक्त धर्मवैज्ञानिक विशिष्टता नहीं जोड़ता।
- issue: धर्मी व्यक्ति के स्वयं को दोष देने का कथन
  choice: धर्मी मनुष्य स्वयं अपने ऊपर दोष लगाता है
  alternative: धर्मी स्वयं को दोषी ठहराता है
  rationale: ‘दोषी ठहराता है’ न्यायिक और निर्णायक अर्थ को अधिक प्रबल कर सकता है; चुना हुआ पाठ आत्म-अभियोग के सामान्य अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। बहुवचन ‘तुम’ को समुदाय के सामूहिक सम्बोधन के रूप में रखा गया है। स्रोत की तुलना, नम्रता और आत्म-अभियोग की तनावपूर्ण भाषा को सरल करते हुए भी समाप्त नहीं किया गया।
