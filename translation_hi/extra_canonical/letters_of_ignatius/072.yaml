review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the supplied English witness closely, including the repeated charter/document image, the conditional connection of repentance with return to unity, and the deliberately open phrasing of “faith through him.” However, “वह किया जो मुझे करना था” slightly recasts “did my own part” as an imposed duty rather than the writer’s own contribution. The revision restores that nuance.
  naturalness: The register is suitably dignified and readable. Minor adjustments make the opening and “God does not dwell” more idiomatic in modern standard Hindi, while retaining the public-reading register. “उसके माध्यम से विश्वास” is clearer Hindi than the markedly elliptical “उसके द्वारा विश्वास,” while the accompanying note preserves the source’s unresolved relation.
  terminology: “फूट,” “गुटबाज़ी,” “बिशप की परिषद्,” “अनुग्रह,” and “धर्मी ठहराया जाना” are appropriate. “अभिलेख” continues to preserve the repeated documentary image without prematurely identifying the disputed referent as Scripture. “अखंडनीय” conveys “inviolable” more precisely than “अटल” in the context of an authoritative document.
  issues:
  - severity: medium
    issue: “did my own part” is rendered as “वह किया जो मुझे करना था.”
    rationale: This can imply merely doing an externally required duty. “मैंने अपनी ओर से अपना भाग निभाया” more directly reflects the writer’s stated personal contribution.
  - severity: low
    issue: “परमेश्वर वास नहीं करता” is somewhat compressed and archaic in this context.
    rationale: “परमेश्वर निवास नहीं करता” is natural modern standard Hindi and preserves the metaphor of divine dwelling.
  - severity: low
    issue: “अटल अभिलेख” is less exact for “inviolable charter.”
    rationale: “अखंडनीय अभिलेख” more clearly communicates an authoritative document that cannot be set aside or violated, without expanding its referent.
