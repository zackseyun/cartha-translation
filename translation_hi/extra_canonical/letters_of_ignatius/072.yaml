  register: आधुनिक मानक हिन्दी का गरिमामय, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। ‘बिशप’ प्रारम्भिक कलीसियाई पद के पहचाने जाने योग्य नाम के रूप में रखा गया है। अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अंतरिम मसौदा है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण विशेषतः ‘अभिलेख’, ‘परिषद्’ और ‘उसके द्वारा विश्वास’ को सावधानी से प्रस्तुत किया गया है।
