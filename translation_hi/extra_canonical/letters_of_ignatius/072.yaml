base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/072.yaml
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent, if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
translation:
  language: hi
  text: 'इसलिए मैंने अपनी ओर से वह किया जो मुझे करना था, ऐसे मनुष्य के समान जो एकता के लिए समर्पित है। पर जहाँ फूट और क्रोध है, वहाँ परमेश्वर वास नहीं करता। प्रभु सबको क्षमा करता है जब वे मन फिराते हैं—यदि वे मन फिराकर परमेश्वर की एकता और बिशप की परिषद् में लौट आते हैं। मुझे यीशु मसीह के अनुग्रह पर विश्वास है; वह तुम्हारी हर बेड़ी काट देगा। और मैं तुमसे विनती करता हूँ:


    गुटबाज़ी की भावना से कुछ न करो, बल्कि मसीह की शिक्षा के अनुसार करो। क्योंकि मैंने कुछ लोगों को यह कहते सुना, “यदि मुझे यह अभिलेखों[a] में नहीं मिलता, तो मैं इसे सुसमाचार में भी नहीं मानता।” जब मैंने उनसे कहा, “यह लिखा है,” तो उन्होंने मुझे उत्तर दिया, “यही तो प्रश्न है।” पर मेरे लिए मेरा अभिलेख यीशु मसीह है; अटल अभिलेख है उसका क्रूस, उसकी मृत्यु और उसका पुनरुत्थान, और उसके द्वारा विश्वास[b]। इन्हीं में मैं तुम्हारी प्रार्थनाओं के द्वारा धर्मी ठहराया जाना चाहता हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अभिलेखों” से आशय प्रामाणिक लिखित दस्तावेज़ों या शास्त्रीय लेखों से हो सकता है। यहाँ उपलब्ध अंग्रेज़ी साक्ष्य की “charters” वाली छवि को सुरक्षित रखा गया है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: मुख्य शब्द का सटीक दायरा अनिश्चित है और इसे केवल ‘पवित्र शास्त्र’ मान लेना अस्पष्टता मिटा देगा।
  - marker: b
    text: '“उसके द्वारा विश्वास” का संबंध अस्पष्ट है: इसका अर्थ उसके माध्यम से उत्पन्न विश्वास, उसके द्वारा संभव विश्वास, या उस पर विश्वास हो सकता है।'
    reason: उपलब्ध साक्ष्य निर्णायक व्याकरणिक अर्थ स्थापित नहीं करता; धर्मवैज्ञानिक तनाव बनाए रखना आवश्यक है।
lexical_decisions:
- source_word: charters / charter (English witness; Greek review pending)
  choice: अभिलेखों / अभिलेख
  rationale: कानूनी या प्रामाणिक लिखित दस्तावेज़ की पुनरावृत्त छवि बनाए रखता है और ‘शास्त्र’ कहकर आशय को समय से पहले सीमित नहीं करता।
- source_word: division and anger
  choice: फूट और क्रोध
  rationale: सामुदायिक विभाजन और रोष—दोनों को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: council of the bishop
  choice: बिशप की परिषद्
  rationale: दिए गए साक्ष्य की संस्थागत अस्पष्टता बनाए रखता है; इसे ‘बिशप की आज्ञाकारिता’ जैसे अधिक व्याख्यात्मक रूप में नहीं बदला गया।
- source_word: factiousness
  choice: गुटबाज़ी की भावना
  rationale: केवल मतभेद नहीं, बल्कि दल बनाकर विघटन करने की प्रवृत्ति व्यक्त होती है।
- source_word: strike off every fetter
  choice: हर बेड़ी काट देगा
  rationale: बंधन छुड़ाने की सशक्त रूपकात्मक छवि सुरक्षित रहती है।
theological_decisions:
- issue: पश्चात्ताप, क्षमा और एकता का संबंध
  choice: “क्षमा करता है जब वे मन फिराते हैं—यदि वे मन फिराकर ... लौट आते हैं”
  alternative: एकता में लौटने को क्षमा अर्जित करने की शर्त के रूप में स्पष्ट करना
  rationale: मूल साक्ष्य की शर्तात्मक रचना सुरक्षित रखी गई है, पर अनुग्रह और कलीसियाई एकता के संबंध को किसी विशिष्ट मत-सिद्धांत में नहीं बाँधा गया।
- issue: “faith through him” का व्याकरणिक और धर्मवैज्ञानिक संबंध
  choice: “उसके द्वारा विश्वास”
  alternative: “उस पर विश्वास” अथवा “उसके द्वारा मिलने वाला विश्वास”
  rationale: स्रोत-भाषा समीक्षा लंबित होने के कारण माध्यम, लक्ष्य या उत्पत्ति में से किसी एक अर्थ को निर्णायक नहीं बनाया गया; असामान्य किंतु समझने योग्य रूप से अस्पष्टता रखी गई है।
- issue: “justified” का अनुवाद
  choice: “धर्मी ठहराया जाना”
  alternative: “सही सिद्ध होना”
  rationale: धर्मवैज्ञानिक और न्यायिक आयाम को बनाए रखता है, बिना यह तय किए कि यहाँ अंतिम उद्धार, नैतिक सत्यापन या सामुदायिक अनुमोदन में से कौन-सा पक्ष प्रमुख है।
- issue: मसीह को ‘charter’ कहना
  choice: रूपक को सीधे बनाए रखना
  alternative: इसे “मेरा प्रमाण” या “मेरा धर्मग्रंथ” कहना
  rationale: लेखक के मसीह-केंद्रित प्रत्युत्तर और ‘अभिलेख’ शब्द-खेल को सुरक्षित रखा गया है।
