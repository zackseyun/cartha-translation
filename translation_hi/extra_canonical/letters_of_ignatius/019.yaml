  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। बाइबलीय प्रतिध्वनियों में ‘ठोकर का कारण’, ‘उद्धार’, ‘अनन्त जीवन’ और प्रश्नमाला को बनाए रखा गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; मध्य-पाठपरंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण विवादास्पद शब्दों पर सावधान पादटिप्पणियाँ दी गई हैं।
