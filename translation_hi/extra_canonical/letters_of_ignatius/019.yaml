  yaml_path: translation/extra_canonical/letters_of_ignatius/019.yaml
  text: 'My spirit is made refuse for the cross, which is a stumbling block to those who do not believe, but to us is salvation and eternal life. Where is the wise person? Where is the debater? Where is the boasting of those who are called prudent?


    For our God, Jesus the Christ, was conceived in Mary’s womb according to a dispensation, from the seed of David but also from the Holy Spirit. He was born and was baptized so that by his suffering he might cleanse water.'
translation:
  language: hi
  text: 'मेरा आत्मा क्रूस के लिए कूड़ा[a] बन जाए—वही क्रूस जो अविश्वासियों के लिए ठोकर का कारण है, पर हमारे लिए उद्धार और अनन्त जीवन है। बुद्धिमान कहाँ है? वाद-विवाद करनेवाला कहाँ है? उन लोगों का घमण्ड कहाँ है जो समझदार कहलाते हैं?


    क्योंकि हमारे परमेश्वर, यीशु मसीह, परमेश्वर की योजना[b] के अनुसार मरियम के गर्भ में धारण किए गए—वे दाऊद के वंश से थे, और पवित्र आत्मा से भी। उनका जन्म हुआ और उन्होंने बपतिस्मा लिया, ताकि अपने दुःख-भोग के द्वारा जल को शुद्ध करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कूड़ा’ के पीछे ऐसा शब्द है जिसका अर्थ झाड़कर फेंकी गई मैल, निकृष्ट अवशेष या सबका तिरस्कृत व्यक्ति हो सकता है। यहाँ यह अत्यन्त तीव्र आत्म-निम्नीकरण की भाषा है।
    reason: मूल यूनानी की प्रत्यक्ष समीक्षा अभी लंबित है और अंग्रेज़ी ‘offscouring/refuse’ का अर्थ-विस्तार एक शब्द में पूरी तरह नहीं आता।
  - marker: b
    text: ‘योजना’ का अनुवाद ऐसे शब्द से है जिसका अर्थ दैवी व्यवस्था, प्रबन्ध या उद्धार-योजना भी हो सकता है।
    reason: ‘dispensation’ धर्मवैचारिक और प्रशासनिक दोनों अर्थ रख सकता है; हिन्दी मुख्य पाठ में स्पष्टता रखते हुए पादटिप्पणी में व्यापकता सुरक्षित की गई है।
lexical_decisions:
- source_word: offscouring (Greek source review pending)
  choice: कूड़ा
  rationale: अंग्रेज़ी साक्ष्य में प्रयुक्त आत्म-निम्नीकरण की तीखी छवि को सरल और स्वाभाविक हिन्दी में बनाए रखता है; इसे केवल ‘तुच्छ’ कहने से रूपक कमजोर पड़ता।
- source_word: Cross
  choice: क्रूस
  rationale: आरम्भिक मसीही साहित्य में प्रचलित और गरिमापूर्ण हिन्दी पारिभाषिक शब्द।
- source_word: dispensation (Greek source review pending)
  choice: परमेश्वर की योजना
  rationale: यहाँ गर्भधारण से जुड़ी दैवी व्यवस्था/योजना का भाव है; सामान्य पाठक के लिए ‘विधान’ की अपेक्षा अधिक स्पष्ट, जबकि पादटिप्पणी संभावित अर्थ-विस्तार बचाती है।
- source_word: seed of David
  choice: दाऊद के वंश
  rationale: वंशगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक ‘बीज’ यहाँ असहज होता।
- source_word: passion
  choice: दुःख-भोग
  rationale: यीशु की पीड़ा और मृत्यु से जुड़े पारंपरिक धर्मवैचारिक अर्थ को संक्षेप में सुरक्षित रखता है।
- source_word: cleanse water
  choice: जल को शुद्ध करें
  rationale: साक्ष्य की असामान्य और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के यथावत रखता है।
theological_decisions:
- issue: यीशु मसीह को ‘हमारे परमेश्वर’ कहना
  choice: हमारे परमेश्वर, यीशु मसीह
  alternative: हमारे परमेश्वर के यीशु मसीह
  rationale: उपलब्ध साक्ष्य स्पष्ट रूप से यीशु मसीह को ‘हमारे परमेश्वर’ कहता है; संबंधकारक जोड़ना अर्थ बदल देता।
- issue: दाऊद के वंश और पवित्र आत्मा से गर्भधारण
  choice: वे दाऊद के वंश से थे, और पवित्र आत्मा से भी
  alternative: दाऊद के वंश और पवित्र आत्मा के बीज से
  rationale: दोनों कथनों को साथ रखते हुए पवित्र आत्मा के लिए जैविक ‘बीज’ का अनुचित अर्थ उत्पन्न नहीं किया गया।
- issue: बपतिस्मे द्वारा जल की शुद्धि
  choice: उन्होंने बपतिस्मा लिया, ताकि अपने दुःख-भोग के द्वारा जल को शुद्ध करें
  alternative: उन्होंने जल को शुद्ध करने के लिए बपतिस्मा लिया
  rationale: साक्ष्य में साधन के रूप में ‘अपने दुःख-भोग के द्वारा’ है; कठिन संबंध को सरल बनाकर मिटाया नहीं गया।
