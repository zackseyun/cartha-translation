base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/034.yaml
  text: I say these things, my dearly loved ones, not because I have learned that any of you think this way. Rather, since I am less than any of you, I want you to be on your guard in good time, so that you do not fall into the snares of empty teaching. Instead, be fully convinced about the birth, the suffering, and the resurrection, which took place during the governorship of Pontius Pilate. For these things were truly and certainly done by Jesus Christ, our hope. May none of you be turned away from this hope.
translation:
  language: hi
  text: मेरे अत्यंत प्रिय जनो, मैं ये बातें इसलिए नहीं कहता कि मुझे पता चला है कि तुममें से कोई ऐसा सोचता है। बल्कि, तुममें से हर एक से छोटा होने के नाते, मैं चाहता हूँ कि तुम समय रहते सावधान रहो, ताकि खोखली शिक्षा के फंदों में न फँसो। इसके बजाय, उस जन्म, दुःखभोग और पुनरुत्थान के विषय में पूरी तरह निश्चय रखो, जो पुन्तियुस पिलातुस के शासनकाल में हुए। क्योंकि ये बातें सचमुच और निश्चित रूप से हमारी आशा, यीशु मसीह, के द्वारा पूरी हुईं। ऐसा न हो कि तुममें से कोई इस आशा से भटक जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dearly beloved
  choice: मेरे अत्यंत प्रिय जनो
  rationale: स्नेहपूर्ण सामुदायिक संबोधन को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: being less than any of you
  choice: तुममें से हर एक से छोटा होने के नाते
  rationale: वक्ता की विनम्र आत्म-स्थिति को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: vain doctrine
  choice: खोखली शिक्षा
  rationale: ऐसी शिक्षा का भाव देता है जिसमें सत्य या सार नहीं है; आधुनिक पाठक के लिए सहज है।
- source_word: passion
  choice: दुःखभोग
  rationale: मसीह की पीड़ा और मृत्यु से जुड़े पारंपरिक अर्थ को संक्षिप्त, धार्मिक रूप से तटस्थ भाषा में रखता है।
- source_word: fully persuaded
  choice: पूरी तरह निश्चय रखो
  rationale: दृढ़ विश्वास का भाव देता है, पर अनावश्यक रूप से किसी विशिष्ट मत-सूत्र का संकेत नहीं करता।
- source_word: our hope
  choice: हमारी आशा
  rationale: यीशु मसीह की पहचान आशा के रूप में सीधे सुरक्षित रखता है।
theological_decisions:
- issue: जन्म, दुःखभोग और पुनरुत्थान की ऐतिहासिकता
  choice: जो पुन्तियुस पिलातुस के शासनकाल में हुए
  alternative: जो पुन्तियुस पिलातुस के राज्यपाल होने के समय घटित हुए
  rationale: घटनाओं को ऐतिहासिक काल से जोड़ता है और हिन्दी में स्वाभाविक रहता है; ‘शासनकाल’ पद के औपचारिक प्रशासनिक अर्थ से कुछ व्यापक होने की संभावना स्रोत-समीक्षा में जाँची जानी चाहिए।
- issue: Jesus Christ as agent in ‘done by’
  choice: यीशु मसीह के द्वारा पूरी हुईं
  alternative: यीशु मसीह के साथ घटित हुईं
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के कर्तृवाचक रूप को बनाए रखता है, यद्यपि यूनानी स्रोत की प्रत्यक्ष समीक्षा से यह स्पष्ट करना आवश्यक है कि आशय उनके द्वारा किए जाने का है या उनके जीवन में घटित होने का।
- issue: अंतिम चेतावनी का स्वर
  choice: ऐसा न हो कि तुममें से कोई इस आशा से भटक जाए
  alternative: ईश्वर करे, तुममें से कोई इस आशा से विमुख न हो
  rationale: कामनात्मक चेतावनी को सुरक्षित रखता है और पाठ में अनुपस्थित स्पष्ट ईश्वरीय कर्ता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मीय किन्तु गरिमापूर्ण शैली। बहुवचन संबोधन के लिए ‘तुम’ रखा गया है, जिससे निकटता बनी रहती है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है, विशेषकर ‘शासनकाल’, घटनाओं के क्रियात्मक संबंध, और ‘पूरी हुईं’ के लिए।
