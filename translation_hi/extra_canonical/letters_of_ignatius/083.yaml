base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/083.yaml
  text: 'Therefore, those who deny the good gift of God perish through their arguments. It would be better for them to have love, so that they too may rise again.


    It is therefore right for you to keep away from such people and not speak about them either privately or publicly. Instead, pay attention to the Prophets, and especially to the Gospel, in which the suffering is shown to us and the resurrection is accomplished.'
translation:
  language: hi
  text: 'इसलिए जो लोग परमेश्वर के उत्तम वरदान का विरोध करते हैं, वे अपने वाद-विवादों के कारण नाश होते हैं। उनके लिए प्रेम रखना अधिक लाभदायक होता, ताकि वे भी फिर जी उठें।


    इसलिए उचित है कि तुम ऐसे लोगों से दूर रहो और उनके विषय में न तो अकेले में और न सार्वजनिक रूप से बात करो। इसके बजाय भविष्यद्वक्ताओं की बातों पर, और विशेष रूप से सुसमाचार पर ध्यान दो, जिसमें हमारे सामने दुखभोग प्रकट किया गया है और पुनरुत्थान पूरा हुआ है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gainsay
  choice: विरोध करते हैं
  rationale: यह उपलब्ध अंग्रेज़ी साक्ष्य के ‘gainsay’ का स्वाभाविक और पर्याप्त रूप से औपचारिक हिन्दी रूप है; ‘इनकार’ की अपेक्षा इसमें सक्रिय प्रतिवाद का भाव सुरक्षित रहता है।
- source_word: good gift of God
  choice: परमेश्वर का उत्तम वरदान
  rationale: ‘वरदान’ धार्मिक संदर्भ में स्वाभाविक है और gift के अनुग्रहपूर्ण भाव को बनाए रखता है, बिना वरदान की प्रकृति को अनावश्यक रूप से निर्धारित किए।
- source_word: questionings
  choice: वाद-विवादों
  rationale: संदर्भ में विरोधी तर्क-वितर्क का भाव है। यह चयन प्रश्न पूछने मात्र के निर्दोष अर्थ से अलग करता है, पर उपलब्ध साक्ष्य से आगे बढ़कर किसी खास दार्शनिक पद्धति का आरोप नहीं लगाता।
- source_word: love
  choice: प्रेम
  rationale: मूल धार्मिक-नैतिक अवधारणा को व्यापक और पारंपरिक हिन्दी शब्द से व्यक्त किया गया है।
- source_word: rise again
  choice: फिर जी उठें
  rationale: पुनरुत्थान के क्रियात्मक भाव को साधारण पाठक के लिए स्पष्ट और स्वाभाविक रखा गया है।
- source_word: Prophets
  choice: भविष्यद्वक्ताओं की बातों
  rationale: केवल व्यक्तियों पर ध्यान देने की अपेक्षा उनके लिखित/घोषित साक्ष्य को सुनने का आशय हिन्दी में स्पष्ट करने के लिए ‘की बातों’ जोड़ा गया है।
- source_word: Gospel
  choice: सुसमाचार
  rationale: आरंभिक मसीही साहित्य में प्रचलित अर्थ और हिन्दी की स्थापित धार्मिक शब्दावली दोनों को सुरक्षित रखता है।
- source_word: passion
  choice: दुखभोग
  rationale: यहाँ मसीह की पीड़ा और मृत्यु से जुड़ा पारिभाषिक आशय है; ‘जुनून’ भ्रामक होता और ‘पीड़ा’ अकेले कुछ संकुचित हो सकती थी।
- source_word: is accomplished
  choice: पूरा हुआ है
  rationale: पूर्णता/सिद्धि के निष्क्रिय भाव को बनाए रखा गया है और उसे केवल वर्णन या घोषणा में नहीं बदला गया।
theological_decisions:
- issue: ‘उत्तम वरदान’ की पहचान
  choice: वरदान को अनिर्दिष्ट रखा गया
  alternative: इसे यूखरिस्त, देहधारण, उद्धार या किसी अन्य विशिष्ट वरदान के रूप में स्पष्ट करना
  rationale: उपलब्ध पाठ स्वयं यहाँ वरदान की पहचान स्पष्ट नहीं करता; किसी विशेष धार्मिक व्याख्या को पाठ में जोड़ना उचित नहीं।
- issue: ‘वे भी फिर जी उठें’ का आशय
  choice: पुनरुत्थान की भाषा को यथावत रखा गया
  alternative: इसे केवल आत्मिक सुधार, पश्चाताप या अंतिम उद्धार के रूप में समझाकर अनुवाद करना
  rationale: वाक्य में प्रेम और पुनरुत्थान के बीच तनावपूर्ण संबंध है; अनुवाद ने यह तय नहीं किया कि इसका संकेत वर्तमान आत्मिक जीवन की ओर है या भावी शारीरिक पुनरुत्थान की ओर।
- issue: दुखभोग और पुनरुत्थान के क्रियारूपों का अंतर
  choice: ‘दुखभोग प्रकट किया गया है’ और ‘पुनरुत्थान पूरा हुआ है’
  alternative: दोनों को केवल ‘वर्णित हैं’ कहना
  rationale: अंग्रेज़ी साक्ष्य में shown और accomplished का स्पष्ट अंतर है। अनुवाद उस अंतर को बनाए रखता है, भले ही अंतिम यूनानी समीक्षा में क्रियारूपों की बारीकी पुनः जाँची जानी हो।
- issue: विरोधियों के विषय में बोलने की मनाही
  choice: ‘उनके विषय में ... बात करो’
  alternative: ‘उनसे ... बात करो’
  rationale: उपलब्ध साक्ष्य ‘speak of them’ कहता है, इसलिए मनाही उनके बारे में चर्चा करने पर रखी गई है, उनसे हर प्रकार का संवाद निषिद्ध बताने पर नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। बहुवचन संबोधन के लिए ‘तुम’ रखा गया है, जो आधुनिक और प्रत्यक्ष है। कोई पादटिप्पणी आवश्यक नहीं मानी गई। चूँकि प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित है, मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और परामर्शी English POB के आधार पर सावधानी से तैयार किया गया है।
