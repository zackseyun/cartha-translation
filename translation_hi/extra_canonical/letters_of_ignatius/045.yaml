base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/045.yaml
  text: 'Therefore I urge you—yet not I, but the love of Jesus Christ—take only Christian food, and abstain from strange herbage, which is heresy:


    for these people even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who does not know it, fearing nothing, drinks in death with baneful delight.'
translation:
  language: hi
  text: 'इसलिए मैं तुम्हें समझाता हूँ—फिर भी मैं नहीं, बल्कि यीशु मसीह का प्रेम—कि केवल मसीही भोजन ग्रहण करो और पराई वनस्पति से दूर रहो, जो विधर्म है।


    क्योंकि ये लोग यीशु मसीह के साथ विष भी मिला देते हैं और भलेपन का दिखावा करके दूसरों को धोखा देते हैं। वे उन लोगों के समान हैं जो मधु-मिश्रित दाखमधु में घातक औषधि मिलाकर पिलाते हैं, ताकि अनजान व्यक्ति बिना किसी आशंका के विनाशकारी आनंद के साथ मृत्यु पी ले।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Christian food
  choice: मसीही भोजन
  rationale: भोजन के रूपक को बनाए रखते हुए आधुनिक हिन्दी में सहज और स्पष्ट अभिव्यक्ति।
- source_word: strange herbage
  choice: पराई वनस्पति
  rationale: कृषि/वनस्पति-रूपक को जानबूझकर सुरक्षित रखा गया है; इसे सीधे ‘गलत शिक्षा’ कहने से मूल चित्र लुप्त हो जाता।
- source_word: heresy
  choice: विधर्म
  rationale: यह ऐतिहासिक धार्मिक संदर्भ में प्रचलित और संक्षिप्त हिन्दी पद है; यहाँ लेखक स्वयं पराई वनस्पति के रूपक की व्याख्या करता है।
- source_word: show of honesty
  choice: भलेपन का दिखावा
  rationale: बाहरी सदाचार या विश्वसनीयता के छलपूर्ण प्रदर्शन का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: honeyed wine
  choice: मधु-मिश्रित दाखमधु
  rationale: पेय के ऐतिहासिक स्वरूप और उसकी मिठास दोनों को स्पष्ट रखता है।
- source_word: baneful delight
  choice: विनाशकारी आनंद
  rationale: सुखद अनुभव और उसके घातक परिणाम के विरोधाभास को बनाए रखता है।
theological_decisions:
- issue: ‘यीशु मसीह के साथ विष मिलाना’ रूपक का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के यथावत रखा
  alternative: ‘यीशु मसीह की शिक्षा में विष मिलाना’
  rationale: उपलब्ध साक्ष्य में संक्षिप्त और तीखा रूपक है; ‘शिक्षा’ जोड़ना संभावित आशय को अनावश्यक रूप से निश्चित कर देता।
- issue: heresy का अनुवाद
  choice: विधर्म
  alternative: भ्रांत मत / गलत शिक्षा
  rationale: ‘विधर्म’ ऐतिहासिक और धर्मवैचारिक भार को सुरक्षित रखता है, जबकि विकल्प अर्थ को सामान्यीकृत कर सकते हैं।
- issue: ‘not I, but the love of Jesus Christ’ का कर्तृत्व
  choice: ‘मैं नहीं, बल्कि यीशु मसीह का प्रेम’
  alternative: ‘मेरी ओर से नहीं, बल्कि यीशु मसीह के प्रेम की ओर से’
  rationale: मूल गवाही की असामान्य व्यक्तिकृत अभिव्यक्ति और उसकी धर्मवैचारिक तनावपूर्णता को बिना सहज बनाकर मिटाए सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। भोजन, पराई वनस्पति, विष, मधु-मिश्रित दाखमधु और मृत्यु पीने के परस्पर जुड़े रूपकों को सुरक्षित रखा गया है। उपलब्ध स्रोत प्रत्यक्ष यूनानी पाठ नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी गवाही है; अतः यह मसौदा यूनानी स्रोत-समीक्षा लंबित रहते हुए सावधानीपूर्वक तैयार किया गया है।
