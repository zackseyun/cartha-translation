base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/062.yaml
  text: 'Remember in your prayers the church in Syria, which has God as its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    But I am ashamed to be called one of them, for I am not worthy, being the very last of them and an untimely birth. Yet I have found mercy so that I may be someone, if indeed I attain to God.


    My spirit greets you, as does the love of the churches that received me in the name of Jesus Christ, not as a mere traveler. For even the churches that were not on my route according to the flesh went ahead of me from city to city.'
translation:
  language: hi
  text: 'अपनी प्रार्थनाओं में सीरिया की कलीसिया को याद रखना। मेरे स्थान पर परमेश्वर स्वयं उसका चरवाहा है। केवल यीशु मसीह ही उसकी देखरेख करेंगे—और तुम्हारा प्रेम भी।[a]


    परन्तु मुझे उनमें से एक कहलाने में भी लज्जा आती है, क्योंकि मैं इसके योग्य नहीं हूँ। मैं उनमें सबसे अंतिम और असमय जन्मे हुए के समान हूँ।[b] फिर भी मुझ पर दया हुई है कि मैं कुछ बन सकूँ—यदि सचमुच परमेश्वर तक पहुँच जाऊँ।[c]


    मेरी आत्मा तुम्हें नमस्कार कहती है। उन कलीसियाओं का प्रेम भी तुम्हें नमस्कार कहता है, जिन्होंने यीशु मसीह के नाम में मेरा स्वागत किया—केवल एक राहगीर समझकर नहीं। यहाँ तक कि जो कलीसियाएँ मेरी सांसारिक यात्रा के मार्ग में नहीं पड़ती थीं, वे भी नगर-नगर मुझसे पहले पहुँचती रहीं।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“केवल यीशु मसीह” के बाद “और तुम्हारा प्रेम भी” एक जानबूझकर संक्षिप्त और तनावपूर्ण कथन है: देखरेख का सर्वोच्च आधार मसीह हैं, फिर भी रोमी विश्वासियों का प्रेम उसमें सहभागी बताया गया है।'
    reason: वाक्य की वास्तविक व्याकरणिक और theological tension को पाठ में समतल किए बिना पाठक को संकेत देना।
  - marker: b
    text: “असमय जन्मा हुआ” अपने को अत्यन्त छोटा और अयोग्य बताने का रूपक है।
    reason: रूपक आधुनिक पाठक को असामान्य लग सकता है।
  - marker: c
    text: इस पत्र के व्यापक संदर्भ में “परमेश्वर तक पहुँचना” इग्नातियुस की आसन्न मृत्यु और परमेश्वर के पास पहुँचने की आशा से जुड़ा है।
    reason: मुख्य पाठ में निहित संदर्भ को संक्षेप में स्पष्ट करना, बिना उसे अनुवाद में जोड़ने के।
  - marker: d
    text: अर्थ सम्भवतः यह है कि उसके सीधे यात्रा-मार्ग से बाहर की कलीसियाओं ने भी नगर-नगर प्रतिनिधि भेजकर उसका स्वागत और सहायता की।
    reason: “मुझसे पहले पहुँचती रहीं” का व्यवहारिक आशय अस्पष्ट है और उपलब्ध अंग्रेज़ी साक्ष्य में भी संक्षिप्त है।
