source:
  text: 'For I would not have you to be men-pleasers but to please God, as indeed ye do please Him. For neither shall I myself ever find an opportunity such as this to attain unto God, nor can ye, if ye be silent, win the credit of any nobler work. For, if ye be silent and leave me alone, I am a word of God; but if ye desire my flesh, then shall I be again a mere cry.


    Nay grant me nothing more than that I be poured out a libation to God, while there is still an altar ready; that forming yourselves into a chorus in love ye may sing to the Father in Jesus Christ, for that God hath vouchsafed that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, that I may rise unto Him.'
