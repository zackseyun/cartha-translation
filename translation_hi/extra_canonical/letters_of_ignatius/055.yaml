base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/055.yaml
  text: 'For I do not want you to please people, but to please God, as indeed you do please him. For I myself will never find an opportunity like this to attain to God, nor can you, if you remain silent, receive credit for any nobler work. For if you remain silent and leave me alone, I am a word of God; but if you desire my flesh, then I will again be merely a cry.


    No, grant me nothing more than to be poured out as a libation to God while an altar is still ready, so that, forming yourselves into a chorus in love, you may sing to the Father in Jesus Christ, because God has graciously granted that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, so that I may rise unto him.'
translation:
  language: hi
  text: 'क्योंकि मैं नहीं चाहता कि तुम मनुष्यों को प्रसन्न करने वाले बनो, बल्कि परमेश्वर को प्रसन्न करो—जैसा कि तुम सचमुच उसे प्रसन्न करते हो। मुझे स्वयं परमेश्वर तक पहुँचने का ऐसा अवसर फिर कभी नहीं मिलेगा; और यदि तुम मेरे विषय में मौन रहो, तो तुम भी इससे अधिक उत्तम किसी काम का श्रेय नहीं पा सकते। क्योंकि यदि तुम मेरे विषय में मौन रहो, तो मैं परमेश्वर का वचन बनूँगा; पर यदि तुम मेरे शरीर की अभिलाषा करो, तो मैं फिर केवल एक पुकार बन जाऊँगा।[a]



    मेरे लिए केवल यही माँगो कि, जब तक वेदी तैयार है, मैं परमेश्वर के लिए अर्घ्य के समान उँडेला जाऊँ; ताकि तुम प्रेम में एक गायक-मंडली बनकर यीशु मसीह में पिता के लिए गाओ, क्योंकि परमेश्वर ने अनुग्रह करके सीरिया के बिशप को, उसे पूर्व से बुलाकर, पश्चिम में पाया जाने योग्य ठहराया है। संसार से अस्त होकर परमेश्वर के पास जाना मेरे लिए अच्छा है, ताकि मैं उसी में उदित होऊँ।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वचन’ और ‘पुकार’ के बीच का विरोध संक्षिप्त और रूपकात्मक है। इग्नातियुस चाहता है कि पाठक उसके विषय में हस्तक्षेप न करें; पर इन दोनों रूपकों का सटीक आशय मुख्य पाठ में खुला रखा गया है।
    reason: रूपक आधुनिक पाठक को अस्पष्ट लग सकता है, किंतु उसे किसी एक व्याख्या तक सीमित नहीं करना चाहिए।
  - marker: b
    text: 'यहाँ अस्त होने और उदित होने का जुड़ा हुआ बिंब है: संसार से विदा होना ‘अस्त होना’ है और परमेश्वर में ‘उदित होना’।'
    reason: असामान्य खगोलीय रूपक तथा अंतिम यूनानी स्थानवाचक पदबंध का भाव सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: 'ἀνθρωπάρεσκοι (English witness: men-pleasers)'
  choice: मनुष्यों को प्रसन्न करनेवाले
  rationale: शब्द के नैतिक अर्थ को सीधे और सहज आधुनिक हिन्दी में रखा गया है; केवल ‘लोगों को खुश करना’ कहने से भाव अत्यधिक बोलचाल का हो जाता।
- source_word: 'ἐπιτυχεῖν θεοῦ (English witness: attain unto God)'
  choice: परमेश्वर तक पहुँचना
  rationale: इग्नातियुस के शहादत-संबंधी संदर्भ में लक्ष्य तक पहुँचने का भाव सुरक्षित रहता है, बिना उसके ठीक धर्मशास्त्रीय स्वरूप को अधिक स्पष्ट किए।
- source_word: 'λόγος θεοῦ (English witness: a word of God)'
  choice: परमेश्वर का वचन
  rationale: ‘वचन’ और अगले ‘पुकार’ के बीच का अलंकारिक विरोध बनाए रखा गया है; इसे मसीह के विशिष्ट उपाधि-वाचक प्रयोग के रूप में नहीं समझाया गया।
- source_word: 'φωνή (English witness: cry)'
  choice: पुकार
  rationale: ‘वचन’ के विपरीत एक क्षणभंगुर ध्वनि का बिंब सहज हिन्दी में व्यक्त होता है।
- source_word: 'σπονδισθῆναι (English witness: be poured out a libation)'
  choice: अर्घ्य के समान उँडेला जाऊँ
  rationale: बलिदानी पेय-अर्पण का बिंब रखा गया है; ‘अर्घ्य’ भारतीय पाठक के लिए बोधगम्य है, और ‘उँडेला जाना’ मूल क्रिया की दृश्यता बचाता है।
- source_word: 'χορός (English witness: chorus)'
  choice: गायक-मंडली
  rationale: सामूहिक, समस्वर स्तुति का आशय आधुनिक हिन्दी में स्पष्ट किया गया है।
- source_word: 'ἐπίσκοπος (English witness: bishop)'
  choice: बिशप
  rationale: आरम्भिक कलीसियाई पदनाम के लिए प्रचलित और अपेक्षाकृत तटस्थ हिन्दी रूप चुना गया है।
- source_word: 'δύειν / ἀνατεῖλαι imagery (English witness: set / rise)'
  choice: अस्त होकर / उदित होऊँ
  rationale: सूर्यास्त और सूर्योदय के परस्पर जुड़े बिंब को जानबूझकर अक्षुण्ण रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर का वचन’ और ‘केवल एक पुकार’ का अर्थ
  choice: अलंकारिक विरोध को ज्यों का त्यों रखा गया
  alternative: इसे ‘परमेश्वर का सार्थक संदेश’ बनाम ‘निरर्थक आवाज़’ के रूप में स्पष्ट करना
  rationale: पाठ की संक्षिप्तता और संभावित बहुअर्थकता को सुरक्षित रखना उचित है; व्याख्यात्मक विस्तार लेखक की धर्मशास्त्रीय तनावपूर्ण भाषा को सीमित कर देता।
- issue: शहादत के द्वारा ‘परमेश्वर तक पहुँचना’
  choice: मूल लक्ष्य-संबंधी भाषा को सुरक्षित रखा गया
  alternative: ‘परमेश्वर की उपस्थिति में पहुँचना’ या ‘परमेश्वर से मिलना’
  rationale: अधिक व्याख्यात्मक विकल्प मृत्यु, उद्धार और परमेश्वर से मिलन के संबंध को मूल से अधिक निश्चित बना देते।
- issue: बलिदान और अर्घ्य का बिंब
  choice: स्वयं को परमेश्वर के लिए उँडेला जाने वाला अर्घ्य कहा गया
  alternative: सिर्फ ‘बलिदान हो जाऊँ’
  rationale: सामान्य ‘बलिदान’ कहने से विशिष्ट पेय-अर्पण और तैयार वेदी की संयुक्त छवि नष्ट हो जाती।
- issue: संसार से अस्त होना और परमेश्वर के पास उदित होना
  choice: दोनों दिशात्मक खगोलीय बिंब संरक्षित किए गए
  alternative: ‘संसार छोड़कर परमेश्वर के पास जाना’
  rationale: सरल विकल्प अर्थ बताता है, पर लेखक का जानबूझकर रचा गया अस्त–उदय तनाव मिटा देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में dignified और पठनीय रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। उपलब्ध आधार मुख्यतः सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है और यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित बताई गई है; इसलिए कठिन रूपकों को सुधारकर समतल करने के बजाय सुरक्षित रखा गया है। ‘बिशप’ ऐतिहासिक पदनाम के रूप में रखा गया है, और ‘अर्घ्य’ के साथ ‘उँडेला’ जोड़कर पेय-अर्पण का अर्थ स्पष्ट किया गया है।
