  english_witness: 'But I have learned that certain persons passed through you from yonder, bringing evil doctrine; whom ye suffered not to sow seed in you, for ye stopped your ears, so that ye might not receive the seed sown by them; forasmuch as ye are stones of a temple, which were prepared beforehand for a building of God the Father, being hoisted up to the heights through the engine of Jesus Christ, which is the Cross, and using for a rope the Holy Spirit; while your faith is your windlass, and love is the way that leadeth up to God.


    So then ye are all companions in the way, carrying your God and your shrine, your Christ and your holy things, being arrayed from head to foot in the commandments of Jesus Christ. And I too, taking part in the festivity, am permitted by letter to bear you company and to rejoice with you, that ye set not your love on anything after the common life of men, but only on God.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/010.yaml
  text: 'But I have learned that certain people passed through you from elsewhere, bringing evil teaching; you did not allow them to sow seed in you, for you stopped your ears so that you might not receive the seed sown by them. For you are stones of a temple, prepared beforehand for a building of God the Father, being hoisted up to the heights through the lifting device of Jesus Christ, which is the cross, and using the Holy Spirit as a rope. Your faith is your windlass, and love is the way that leads up to God.


    Therefore, you are all companions on the way, carrying your God and your shrine, your Christ and your holy things, clothed from head to foot in the commandments of Jesus Christ. I too, taking part in the celebration, am permitted by letter to accompany you and rejoice with you, that you set not your love on anything after the common life of men, but only on God.'
translation:
  language: hi
  text: 'पर मैंने सुना है कि वहाँ से कुछ लोग तुम्हारे बीच आए थे और बुरी शिक्षा लेकर आए थे। तुमने उन्हें अपने भीतर बीज बोने नहीं दिया, बल्कि अपने कान बंद कर लिए, ताकि उनके द्वारा बोया जानेवाला बीज ग्रहण न करो। क्योंकि तुम पिता के मंदिर के पत्थर हो, जिन्हें पिता परमेश्वर के भवन के लिए पहले से तैयार किया गया है। तुम्हें यीशु मसीह की उठानेवाली मशीन—अर्थात क्रूस—के द्वारा ऊँचाई तक उठाया जा रहा है; पवित्र आत्मा तुम्हारी रस्सी है, तुम्हारा विश्वास तुम्हारी चरखी है, और प्रेम वह मार्ग है जो परमेश्वर तक ऊपर ले जाता है।[a]


    इसलिए तुम सब मार्ग के सहयात्री हो—परमेश्वर को धारण करनेवाले, मंदिर को धारण करनेवाले, मसीह को धारण करनेवाले और पवित्र वस्तुओं को धारण करनेवाले[b]—और सिर से पाँव तक यीशु मसीह की आज्ञाओं से सजे हुए हो। मैं भी इस आनंद में सहभागी हूँ, और इस पत्र के द्वारा तुम्हारा साथ देने और तुम्हारे साथ आनंद मनाने योग्य ठहराया गया हूँ, क्योंकि तुम किसी दूसरे जीवन के अनुसार प्रेम नहीं करते, बल्कि केवल परमेश्वर से प्रेम करते हो।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ भवन-निर्माण की एक विस्तृत उपमा है: क्रूस पत्थरों को ऊपर उठाने का यंत्र है, पवित्र आत्मा रस्सी है, और विश्वास ऊपर खींचने वाली चरखी है।'
    reason: आधुनिक पाठक के लिए परस्पर जुड़ी प्राचीन निर्माण-छवियों को स्पष्ट करना, बिना मुख्य पाठ में रूपक को सपाट किए।
  - marker: b
    text: मूल में चार समान यौगिक शब्द लगातार आते हैं, जिनका अर्थ लगभग ‘परमेश्वर-धारी, मंदिर-धारी, मसीह-धारी और पवित्र-वस्तु-धारी’ है। अंतिम पद का आशय पवित्र वस्तुएँ, पवित्र बातें या पवित्र तत्व हो सकता है।
    reason: मूल की शब्द-क्रीड़ा और अंतिम पद की वास्तविक अर्थगत व्यापकता बताना।
  - marker: c
    text: ‘किसी दूसरे जीवन के अनुसार’ मूल का संक्षिप्त और कठिन वाक्यांश है। इसका आशय ‘किसी अन्य जीवन-पद्धति के अनुसार’ या सामान्य मानवीय जीवन से जुड़ी किसी दूसरी अभिलाषा से हो सकता है।
    reason: अस्पष्ट पाठ को चुपचाप किसी एक व्याख्या में सीमित न करना।
lexical_decisions:
- source_word: κακὴν διδαχήν
  choice: बुरी शिक्षा
  rationale: ‘शिक्षा’ doctrinal teaching को स्वाभाविक हिन्दी में व्यक्त करती है; ‘बुरी’ मूल के नैतिक और धार्मिक नकारात्मक मूल्यांकन को बनाए रखती है।
- source_word: μηχανή
  choice: उठानेवाली मशीन
  rationale: संदर्भ निर्माण-स्थल पर पत्थर ऊपर उठाने की यांत्रिक उपमा है। ‘मशीन’ मूल रूपक की ठोस प्रकृति बचाती है, जबकि ‘उठानेवाली’ उसका कार्य स्पष्ट करती है।
- source_word: ἀναγωγεύς
  choice: चरखी
  rationale: यह ऊपर खींचने वाले उपकरण का संकेत देता है और रस्सी तथा निर्माण की विस्तृत उपमा से मेल खाता है।
- source_word: σύνοδοι
  choice: मार्ग के सहयात्री
  rationale: शब्द में साथ होने और साथ यात्रा करने, दोनों का भाव है; यह अनुवाद अगले धारण-सूचक पदों से पहले यात्रा की छवि बनाए रखता है।
- source_word: θεοφόροι / ναοφόροι / χριστοφόροι / ἁγιοφόροι
  choice: परमेश्वर को धारण करनेवाले / मंदिर को धारण करनेवाले / मसीह को धारण करनेवाले / पवित्र वस्तुओं को धारण करनेवाले
  rationale: मूल के लगातार आने वाले चार समान यौगिक पदों की लय और ‘धारण करने’ की साझा छवि को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: κεκοσμημένοι
  choice: सजे हुए
  rationale: यह अलंकृत या सुशोभित होने का भाव रखता है और आज्ञाओं को वस्त्र या सज्जा की तरह धारण करने वाली छवि के अनुकूल है।
theological_decisions:
- issue: क्रूस को यीशु मसीह की उठानेवाली मशीन कहना
  choice: रूपक को प्रत्यक्ष और बिना व्याख्यात्मक नरमी के रखा गया
