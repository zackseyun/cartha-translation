- issue: परमेश्वर, मंदिर, मसीह और पवित्र वस्तुओं को धारण करना
  choice: चारों धारण-सूचक पद अलग-अलग बनाए रखे गए
  alternative: अपने भीतर परमेश्वर और मसीह की पवित्र उपस्थिति लिए हुए
  rationale: विस्तृत व्याख्या किसी खास आध्यात्मिक या संस्कार-संबंधी अर्थ को आरोपित कर सकती थी। शाब्दिक समानांतरता मूल की धार्मिक सघनता और संभावित बहुअर्थकता बचाती है।
- issue: κατὰ ἄλλον βίον का अर्थ
  choice: किसी दूसरे जीवन के अनुसार
  alternative: साधारण मानवीय जीवन की किसी वस्तु से / किसी और जीवन-पद्धति के अनुसार
  rationale: वाक्यांश संक्षिप्त और अर्थ की दृष्टि से कठिन है। मुख्य पाठ मूल की खुली बनावट रखता है और पादटिप्पणी संभावित अर्थ बताती है, किसी एक को निश्चित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक संबोधन में बहुवचन ‘तुम’ वाली रखी गई है। कृषि, निर्माण और यात्रा की मूल छवियाँ सुरक्षित हैं। यांत्रिक शब्दावली को जानबूझकर ठोस रखा गया है। उपलब्ध सामग्री स्वयं बताती है कि प्रत्यक्ष यूनानी समीक्षा लंबित है; फिर भी मध्य-पाठ-परंपरा के प्रमाणित यूनानी पदों से जहाँ संभव था, शब्द-संरचना और अस्पष्टता की जाँच की गई है। प्रकाशन से पहले निर्दिष्ट आलोचनात्मक यूनानी पाठ के साथ अंतिम पंक्ति और यौगिक पदों की पुनः पुष्टि उचित होगी।
