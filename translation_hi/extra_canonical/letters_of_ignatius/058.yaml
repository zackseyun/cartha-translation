  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और तीव्र शैली रखी गई है। वाक्यरचना को पठनीय बनाया गया है, पर शहादत की कठोर शारीरिक भाषा को नरम नहीं किया गया। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण सूक्ष्म शब्दार्थ संबंधी निर्णय अनंतिम माने जाएँ।
