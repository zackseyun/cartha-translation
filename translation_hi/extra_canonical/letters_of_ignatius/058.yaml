base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/058.yaml
  text: 'From Syria all the way to Rome, I fight with wild beasts, on land and sea, night and day, bound among ten leopards—that is, a company of soldiers—who only grow worse when they are treated kindly. Yet through their wrongdoing I become more fully a disciple, though I am not thereby justified.


    May I have joy from the beasts prepared for me. I pray that I may find them ready; indeed, I will entice them to devour me quickly, unlike what they have done to some, refusing out of fear to touch them. Even if they are unwilling while I am ready, I myself will force them to it.


    Bear with me. I know what is best for me. Now I am beginning to be a disciple. Let nothing visible or invisible envy me, so that I may attain to Jesus Christ. Let fire and cross come, grappling with wild beasts, [cuttings and manglings,] wrenching of bones, hacking off of limbs, crushing of my whole body; let the cruel tortures of the devil come upon me. Only let me attain to Jesus Christ.'
translation:
  language: hi
  text: 'सीरिया से लेकर रोम तक मैं जंगली पशुओं से लड़ रहा हूँ—थल और जल पर, रात-दिन—दस तेंदुओं के बीच बँधा हुआ, अर्थात् सैनिकों की एक टुकड़ी के बीच। उनके साथ भलाई की जाए, तो वे और भी बुरे हो जाते हैं। फिर भी उनके अन्याय के द्वारा मैं और अधिक पूर्ण रूप से शिष्य बन रहा हूँ; लेकिन इससे मैं निर्दोष नहीं ठहरता।


    मेरे लिए तैयार किए गए पशु मेरे आनंद का कारण बनें। मैं प्रार्थना करता हूँ कि वे मुझे तत्पर मिलें; बल्कि मैं उन्हें लुभाऊँगा कि वे मुझे तुरंत खा जाएँ। वे उन लोगों के साथ जैसा कर चुके हैं—डर के कारण उन्हें छूने से इनकार—वैसा मेरे साथ न करें। यदि मेरे तैयार होने पर भी वे स्वयं तैयार न हों, तो मैं स्वयं उन्हें इसके लिए विवश करूँगा।


    मेरी बात सह लो। मैं जानता हूँ कि मेरे लिए क्या हितकर है। अब मैं शिष्य होना आरंभ कर रहा हूँ। दृश्य या अदृश्य कोई भी वस्तु मुझसे ईर्ष्या न करे, ताकि मैं यीशु मसीह तक पहुँच सकूँ। आग और क्रूस आएँ, जंगली पशुओं से मुठभेड़, [चीरना और अंग-भंग करना,][a] हड्डियों का उखाड़ा जाना, अंगों का काटा जाना और मेरे सारे शरीर का कुचला जाना आए; शैतान की क्रूर यातनाएँ मुझ पर आएँ। बस, मैं यीशु मसीह तक पहुँच सकूँ।'
