lexical_decisions:
- source_word: θηριομαχῶ / wild beasts
  choice: जंगली पशुओं से लड़ रहा हूँ
  rationale: रोमी अखाड़े के पशुओं और सैनिकों के लिए प्रयुक्त विस्तारित रूपक, दोनों को बनाए रखता है।
- source_word: δέκα λεοπάρδοις / ten leopards
  choice: दस तेंदुओं
  rationale: लेखक का तीखा रूपक शब्दशः सुरक्षित रखा गया है और अगले वाक्यांश में उसका आशय सैनिकों की टुकड़ी बताया गया है।
- source_word: μαθητής / disciple
  choice: शिष्य
  rationale: आरंभिक मसीही शिष्यत्व की धार्मिक और संबंधपरक अर्थछाया बनाए रखता है।
- source_word: δεδικαίωμαι / justified
  choice: निर्दोष ठहरता
  rationale: न्यायिक निष्पाप-घोषणा का भाव देता है, पर कथन को किसी विशिष्ट सांप्रदायिक धर्मसिद्धांत में सीमित नहीं करता।
- source_word: ἐπιτύχω Ἰησοῦ Χριστοῦ / attain to Jesus Christ
  choice: यीशु मसीह तक पहुँच सकूँ
  rationale: मृत्यु के द्वारा मसीह को प्राप्त करने की दिशा और लालसा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συστάσεις θηρίων / grapplings with wild beasts
  choice: जंगली पशुओं से मुठभेड़
  rationale: शारीरिक भिड़ंत का भाव सहज और गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: कष्ट के द्वारा शिष्य बनना और धर्मी/निर्दोष ठहरना
  choice: “और अधिक पूर्ण रूप से शिष्य बन रहा हूँ; लेकिन इससे मैं निर्दोष नहीं ठहरता”
  alternative: “मैं अधिक शिष्य बनता हूँ, फिर भी इसके कारण धर्मी नहीं ठहराया गया हूँ”
  rationale: लेखक कष्ट की शिष्यत्व-साधक भूमिका स्वीकार करता है, पर उसे स्वयं में अंतिम न्यायोचित ठहराव का आधार नहीं बनाता; इस तनाव को बिना व्याख्यात्मक समाधान के रखा गया है।
- issue: “यीशु मसीह तक पहुँचना” का आशय
  choice: मूल लक्ष्यसूचक भाषा को यथावत रखा
  alternative: “यीशु मसीह के साथ हो सकूँ” या “मसीह में उद्धार पा सकूँ”
  rationale: वैकल्पिक रूप मूल की खुली हुई शहादत, संगति और प्राप्ति की अर्थछायाओं को संकुचित कर देते।
- issue: शैतान की यातनाएँ
  choice: “शैतान की क्रूर यातनाएँ मुझ पर आएँ”
  alternative: “शैतान द्वारा कराई गई क्रूर यातनाएँ”
  rationale: मूल की संबंधसूचक अस्पष्टता को रखा गया है—यह शैतान से आने वाली या उससे संबद्ध यातनाएँ हो सकती हैं।
