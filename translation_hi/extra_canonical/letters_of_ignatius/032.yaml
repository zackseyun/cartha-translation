base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/032.yaml
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
translation:
  language: hi
  text: 'यदि वे लोग, जो प्राचीन रीति-रिवाजों के अनुसार जीवन बिताते थे, आशा की नवीनता तक पहुँचे—अब सब्त न मनाते हुए, बल्कि प्रभु के दिन के अनुसार अपना जीवन ढालते हुए[a], जिस दिन हमारा जीवन भी उन्हीं के द्वारा और उनकी मृत्यु के द्वारा उदित हुआ, जिसे कुछ लोग नकारते हैं[b]—तो इसी रहस्य के द्वारा हमें विश्वास प्राप्त हुआ। और इसी कारण हम धीरज से सहते हैं, ताकि हम अपने एकमात्र शिक्षक यीशु मसीह के शिष्य पाए जाएँ।


    तो फिर हम उनसे अलग होकर कैसे जी सकेंगे? क्योंकि भविष्यद्वक्ता भी उनके शिष्य थे और आत्मा के द्वारा शिक्षक के रूप में उन्हीं की प्रतीक्षा करते थे। इसी कारण, जिसकी वे उचित रूप से प्रतीक्षा कर रहे थे, उसने आकर उन्हें मरे हुओं में से उठा दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रभु के दिन के अनुसार’ का यूनानी वाक्यांश सामान्यतः प्रभु के दिन, अर्थात मसीही उपासना से जुड़े दिन, की ओर संकेत करता है; साथ ही यहाँ पूरे जीवन को प्रभु के अनुरूप ढालने का भाव भी सुनाई देता है।
    reason: κυριακή के संक्षिप्त प्रयोग और κατὰ ... ζῶντες की संभावित अर्थ-छाया को स्पष्ट करना।
  - marker: b
    text: ‘जिसे कुछ लोग नकारते हैं’ निकटतम रूप से ‘उनकी मृत्यु’ की ओर संकेत करता है; वाक्य की रचना इसे मृत्यु और उससे जुड़े जीवन के पूरे रहस्य से भी जोड़ सकती है।
    reason: यूनानी संबंधवाचक सर्वनाम के संदर्भ में विद्यमान व्याकरणिक और धर्मवैचारिक तनाव बनाए रखना।
