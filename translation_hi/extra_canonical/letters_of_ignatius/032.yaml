  rationale: मूल की असामान्य और धर्मवैचारिक रूप से तनावपूर्ण रचना को सरल सिद्धांत-वाक्य में नहीं बदला गया।
- issue: भविष्यद्वक्ताओं को मरे हुओं में से उठाना
  choice: ‘उसने आकर उन्हें मरे हुओं में से उठा दिया’
  alternative: इसे रूपक रूप में ‘उनकी आशा पूरी की’ कहना
  rationale: मूल का स्पष्ट पुनरुत्थान-वचन बनाए रखा गया और उसकी प्रकृति पर अतिरिक्त व्याख्या नहीं जोड़ी गई।
