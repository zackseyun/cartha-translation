    May all things therefore abound unto you in grace, for ye are worthy. Ye refreshed me in all things, and Jesus Christ shall refresh you. In my absence and in my presence ye cherished me. May God recompense you; for whose sake if ye endure all things, ye shall attain unto Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/085.yaml
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to repent and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
translation:
  language: hi
  text: 'अब से यह उचित है कि हम जाग जाएँ और संयमित रहें, जब तक हमारे पास पश्चाताप करके परमेश्वर की ओर लौटने का [अभी भी] समय है। परमेश्वर और बिशप को मान्यता देना अच्छा है। जो बिशप का आदर करता है, उसका आदर परमेश्वर करता है; और जो बिशप की जानकारी के बिना कुछ करता है, वह शैतान की सेवा करता है।


    इसलिए अनुग्रह में सब कुछ तुम्हारे लिए भरपूर हो, क्योंकि तुम इसके योग्य हो। तुमने हर बात में मुझे ताज़गी दी, और यीशु मसीह तुम्हें ताज़गी देंगे। मेरी अनुपस्थिति और उपस्थिति, दोनों में तुमने मुझे स्नेह से सँभाला। परमेश्वर तुम्हें इसका प्रतिफल दें; यदि तुम उनके लिए सब कुछ सहते रहोगे, तो तुम उन्हें पा लोगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wake to soberness
  choice: जाग जाएँ और संयमित रहें
  rationale: जागने और सचेत-संयमी होने की संयुक्त छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: recognize
  choice: मान्यता देना
  rationale: यह केवल पहचानने के बजाय उचित पद और अधिकार को स्वीकार करने का भाव व्यक्त करता है, बिना इसे अत्यधिक विशिष्ट धर्मशास्त्रीय अर्थ देने के।
- source_word: bishop
  choice: बिशप
  rationale: प्राचीन कलीसियाई पद के लिए आधुनिक हिन्दी में व्यापक रूप से समझा जाने वाला पारिभाषिक शब्द।
- source_word: refreshed
  choice: ताज़गी दी
  rationale: लेखक को मिले प्रोत्साहन, राहत और बल के रूपक को सुरक्षित रखता है।
- source_word: cherished
  choice: स्नेह से सँभाला
  rationale: प्रेमपूर्ण देखभाल और आदर, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: attain unto Him
  choice: उन्हें पा लोगे
  rationale: परमेश्वर तक पहुँचने अथवा उन्हें प्राप्त करने के लक्ष्यभाव को स्पष्ट, किंतु संक्षिप्त रूप में रखता है।
theological_decisions:
- issue: परमेश्वर और बिशप को पहचानने/मान्यता देने का समानांतर कथन
  choice: परमेश्वर और बिशप को मान्यता देना अच्छा है
  alternative: परमेश्वर और बिशप को पहचानना अच्छा है
  rationale: समानांतर संरचना को बनाए रखते हुए इसे सत्ता और भूमिका की उचित स्वीकृति के रूप में प्रस्तुत किया गया है; दोनों को समान स्तर का ठहराने वाली व्याख्या नहीं जोड़ी गई।
- issue: बिशप की जानकारी के बिना कार्य करना
  choice: जो बिशप की जानकारी के बिना कुछ करता है, वह शैतान की सेवा करता है
  alternative: जो बिशप से अलग होकर कुछ करता है, वह शैतान की सेवा करता है
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के 'without the knowledge' को निकटता से रखा गया है और अनुमति, सहभागिता अथवा अलगाव का अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
- issue: अंतिम सर्वनाम का संदर्भ
  choice: यदि तुम उनके लिए सब कुछ सहते रहोगे, तो तुम उन्हें पा लोगे
  alternative: यदि तुम परमेश्वर के लिए सब कुछ सहते रहोगे, तो तुम परमेश्वर तक पहुँचोगे
  rationale: निकटतम पूर्वपद परमेश्वर है; सर्वनाम को बनाए रखकर उपलब्ध साक्ष्य की संदर्भगत बनावट सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण पाठ को अंतिम स्रोत-समालोचनात्मक निर्णय न माना जाए। अंग्रेज़ी साक्ष्य का पुनर्स्थापन-संकेत '[still]' हिन्दी में '[अभी भी]' के रूप में सुरक्षित रखा गया है; यह फुटनोट-चिह्न नहीं है।
