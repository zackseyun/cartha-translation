base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/079.yaml
  text: 'For I know and believe that he was in the flesh even after the resurrection;


    and when he came to Peter and his companions, he said to them, “Take hold of me and touch me, and see that I am not a bodiless demon.” Immediately they touched him, and they believed, being united with his flesh and his blood. Therefore they also despised death; indeed, they proved superior to death. After his resurrection he [both ate and drank with them as one in the flesh, though spiritually he was united with the Father.'
translation:
  language: hi
  text: 'क्योंकि मैं जानता और विश्वास करता हूँ कि पुनरुत्थान के बाद भी वह शरीर में था।


    और जब वह पतरस और उसके साथियों के पास आया, तो उसने उनसे कहा, “मुझे पकड़ो, छूकर देखो कि मैं कोई शरीरहीन दुष्टात्मा नहीं हूँ।” उन्होंने तुरन्त उसे छुआ और विश्वास किया, क्योंकि वे उसके मांस और लहू से जुड़ गए थे। इसलिए उन्होंने मृत्यु को भी तुच्छ जाना; सच तो यह है कि वे मृत्यु से अधिक सामर्थी पाए गए। और अपने पुनरुत्थान के बाद उसने [शरीरधारी होकर उनके साथ खाया और पिया भी, यद्यपि आत्मिक रूप से वह पिता के साथ एकता में था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्षी में “उसने” से पहले एक बेजोड़ आरम्भिक वर्ग कोष्ठक है। यहाँ उसे पाठगत क्षति या प्रस्तावित पुनर्स्थापन के संकेत के रूप में सुरक्षित रखा गया है। यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: दिए गए साक्षी की पाठगत अनियमितता और स्रोत-समीक्षा की अस्थायी स्थिति को पारदर्शी बनाना।
lexical_decisions:
- source_word: in the flesh
  choice: शरीर में / शरीरधारी होकर
  rationale: देहधारण और पुनरुत्थान के बाद वास्तविक शारीरिक अस्तित्व पर बल बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: demon without a body
  choice: शरीरहीन दुष्टात्मा
  rationale: ‘दुष्टात्मा’ साधारण हिन्दी पाठक के लिए स्पष्ट है और ‘शरीरहीन’ मूल विरोध को सुरक्षित रखता है।
- source_word: being joined unto His flesh and His blood
  choice: उसके मांस और लहू से जुड़ गए थे
  rationale: मूल की ठोस शारीरिक भाषा और संभावित धर्मवैचारिक प्रतिध्वनि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: despised death
  choice: मृत्यु को तुच्छ जाना
  rationale: मृत्यु से निर्भयता और उसके प्रति अवमानना—दोनों भावों को औपचारिक किंतु सुबोध हिन्दी में व्यक्त करता है।
- source_word: found superior to death
  choice: मृत्यु से अधिक सामर्थी पाए गए
  rationale: ‘श्रेष्ठ’ की संभावित नैतिक ध्वनि से बचते हुए मृत्यु पर उनकी विजय या प्रबलता का भाव रखा गया है।
- source_word: spiritually
  choice: आत्मिक रूप से
  rationale: ‘आध्यात्मिक रूप से’ की तुलना में अधिक संक्षिप्त और धार्मिक गद्य में प्रचलित, पर अर्थ को किसी विशिष्ट सिद्धान्त तक सीमित नहीं करता।
theological_decisions:
- issue: पुनरुत्थान के बाद मसीह की शारीरिक वास्तविकता
  choice: ‘पुनरुत्थान के बाद भी वह शरीर में था’
  alternative: ‘वह देहधारी था’
  rationale: साक्षी के कथन को सीधे रखा गया है और केवल दिखाई देने वाले शरीर अथवा किसी विशेष पुनरुत्थान-सिद्धान्त की अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: ‘उसके मांस और लहू से जुड़ गए’ का आशय
  choice: अस्पष्टता को यथावत रखा
  alternative: इसे केवल शारीरिक स्पर्श या प्रभुभोज-संबंधी एकता के रूप में स्पष्ट करना
  rationale: वाक्य स्पर्श, विश्वास और मसीह के मांस-लहू से एकता के बीच संबंध रखता है; अनिश्चित स्रोत स्थिति में किसी एक धर्मवैचारिक अर्थ को निर्णायक नहीं बनाया गया।
- issue: पिता के साथ आत्मिक एकता
  choice: ‘आत्मिक रूप से वह पिता के साथ एकता में था’
  alternative: ‘आत्मा में वह पिता से संयुक्त था’
  rationale: शारीरिक भोजन और पिता के साथ एकता के तनाव को बनाए रखा गया है, बिना त्रित्व या मसीह-विज्ञान की बाद की तकनीकी शब्दावली आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। वाक्यरचना को सुबोध बनाया गया है, पर ‘मांस और लहू’, ‘शरीरहीन दुष्टात्मा’ तथा पिता के साथ आत्मिक एकता जैसी ठोस या तनावपूर्ण अभिव्यक्तियाँ नरम नहीं की गईं। मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; मध्य-पाठ यूनानी पर प्रत्यक्ष समीक्षा लंबित है।
