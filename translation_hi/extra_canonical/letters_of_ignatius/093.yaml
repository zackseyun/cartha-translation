    Be thou more diligent than thou art. Mark the seasons. Await Him that is above every season, the Eternal, the Invisible, who became visible for our sake, the Impalpable, the Impassible, who suffered for our sake, who endured in all ways for our sake.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/093.yaml
  text: 'Do not let those who seem convincing but teach strange doctrine dismay you. Stand firm, like an anvil when it is struck. It is the part of a great athlete to receive blows and be victorious. Above all, for God’s sake we must endure everything, so that he may also endure us.


    Be more diligent than you are. Pay attention to the seasons. Await the one who is above every season: the Eternal, the Invisible, who became visible for our sake; the Untouchable, the one incapable of suffering, who suffered for our sake; the one who endured in every way for our sake.'
translation:
  language: hi
  text: 'जो लोग सुनने में विश्वसनीय लगते हैं, फिर भी पराया उपदेश देते हैं, उनसे तुम घबराना मत। जब निहाई पर चोट पड़ती है, तब जैसे वह अटल रहती है, वैसे ही तुम भी अटल रहो। महान पहलवान का काम है कि वह प्रहार सहे और विजयी हो। पर सबसे बढ़कर, परमेश्वर के लिए हमें सब कुछ सहना चाहिए, ताकि वह भी हमें सहन करे।[a]


    तुम अभी जितने परिश्रमी हो, उससे भी अधिक परिश्रमी बनो। समयों को पहचानो। उसकी प्रतीक्षा करो जो हर समय से परे है—अनन्त, अदृश्य, जो हमारे लिए दृश्य हुआ; जिसे छुआ नहीं जा सकता, जो दुःख से परे है, फिर भी जिसने हमारे लिए दुःख सहा; जिसने हमारे लिए हर प्रकार से सहन किया।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वह भी हमें सहन करे” उपलब्ध अंग्रेज़ी साक्ष्य का जानबूझकर शाब्दिक और असामान्य भाव सुरक्षित रखता है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: वाक्यांश अर्थगत और धर्मवैज्ञानिक रूप से कठिन है; पाठक को इसकी अस्थायी स्रोत-स्थिति बताना आवश्यक है।
  - marker: b
    text: “समयों,” “दुःख से परे,” और “हर प्रकार से सहन किया” का अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर अस्थायी है; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है।
    reason: प्रमुख यूनानी शब्दों की पुष्टि के बिना उनकी पूरी अर्थ-सीमा निश्चित नहीं की जानी चाहिए।
lexical_decisions:
- source_word: plausible
  choice: सुनने में विश्वसनीय लगते हैं
  rationale: यह बाहरी प्रभावशीलता या विश्वास जगा सकने वाली वाणी को व्यक्त करता है, बिना उनकी शिक्षा को वास्तव में सत्य ठहराए।
- source_word: strange doctrine
  choice: पराया उपदेश
  rationale: ऐसी शिक्षा का भाव रखता है जो प्राप्त विश्वास से भिन्न या उसके बाहर है; ‘विचित्र’ कहने से केवल असामान्यता का अर्थ निकल सकता था।
- source_word: anvil
  choice: निहाई
  rationale: प्रहार के बीच स्थिर रहने की मूल धातुकर्म-संबंधी उपमा को बनाए रखता है।
- source_word: athlete
  choice: पहलवान
  rationale: प्रहार सहकर विजय पाने के प्रसंग में आधुनिक हिन्दी पाठक के लिए स्वाभाविक और शारीरिक संघर्ष का उपयुक्त बिंब है।
- source_word: seasons
  choice: समयों
  rationale: बहुवचन और प्रसंगगत व्यापकता को सुरक्षित रखता है; इसका अर्थ अवसर, युग या नियत काल हो सकता है।
- source_word: Impassible
  choice: दुःख से परे
  rationale: ईश्वरीय दुःख-अधीनता के निषेध को सुबोध रूप में व्यक्त करता है, जबकि अगले वाक्य में ‘दुःख सहा’ के साथ मूल तनाव बनाए रखता है।
- source_word: Impalpable
  choice: जिसे छुआ नहीं जा सकता
  rationale: अमूर्त संस्कृतनिष्ठ पद के बजाय मूल अर्थ का स्पष्ट, स्वाभाविक हिन्दी रूप देता है।
theological_decisions:
- issue: ‘that He also may endure us’ में परमेश्वर के मनुष्य को सहने का असामान्य कथन
  choice: ताकि वह भी हमें सहन करे
  alternative: ताकि वह भी हमारे साथ धीरज रखे / हमें स्वीकार करे
  rationale: उपलब्ध साक्ष्य के असामान्य और संभवतः जानबूझकर रखे गए पारस्परिक भाव को बिना नरम किए सुरक्षित रखा गया है।
- issue: दुःख से परे होने और वास्तव में दुःख सहने का मसीह-संबंधी विरोधाभास
  choice: जो दुःख से परे है, फिर भी जिसने हमारे लिए दुःख सहा
  alternative: जो स्वभाव से दुःख नहीं सह सकता था, पर हमारे लिए दुःख सहा
  rationale: मूल theological tension को बनाए रखा गया है और उसे किसी विशिष्ट सिद्धान्तगत व्याख्या से हल नहीं किया गया।
- issue: ‘became visible for our sake’ का कर्ता
  choice: अदृश्य, जो हमारे लिए दृश्य हुआ
  alternative: अदृश्य परमेश्वर, जो हमारे लिए देह में दिखाई दिया
  rationale: मूल में निहित मसीह-संदर्भ को रहने दिया गया है, पर ‘देह में’ जैसा व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। एकवचन संबोधन ‘तुम’ रखा गया है। स्रोत-साक्ष्य अंग्रेज़ी मध्यस्थ अनुवाद है और प्रत्यक्ष यूनानी समीक्षा लंबित है, इसलिए कठिन स्थानों पर अस्पष्टता और theological tension को सुरक्षित रखा गया है।
