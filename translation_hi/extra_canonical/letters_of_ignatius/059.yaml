base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/059.yaml
  text: 'The farthest reaches of the universe will profit me nothing, nor will the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest reaches of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Do not give to the world one who desires to be God’s, nor entice him with material things. Allow me to receive the pure light. When I have arrived there, then I will be a man.


    Permit me to be an imitator of the passion of my God. If anyone has Him within himself, let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me.'
translation:
  language: hi
  text: 'ब्रह्मांड की दूर-से-दूर सीमाएँ भी मेरे किसी काम नहीं आएँगी, न इस संसार के राज्य। मेरे लिए पृथ्वी की दूर-से-दूर सीमाओं पर राज करने से अच्छा है कि मैं यीशु मसीह के लिए मर जाऊँ। मैं उसी को खोजता हूँ, जो हमारी ओर से मरा; मैं उसी की अभिलाषा करता हूँ, जो [हमारे लिए] फिर जी उठा।[a]


    नए जन्म की प्रसव-पीड़ाएँ मुझ पर आ पड़ी हैं। भाइयो, मेरे साथ धीरज रखो। मुझे जीने से मत रोको; मेरी मृत्यु की इच्छा मत करो। जो परमेश्वर का होना चाहता है, उसे संसार के हवाले मत करो, और न भौतिक वस्तुओं से उसे लुभाओ। मुझे शुद्ध ज्योति पाने दो। जब मैं वहाँ पहुँच जाऊँगा, तभी मैं मनुष्य बनूँगा।


    मुझे अपने परमेश्वर के दुःख-भोग का अनुकरण करने दो।[b] यदि किसी के भीतर वह है, तो वह समझे कि मैं क्या चाहता हूँ और मेरे साथ सहानुभूति रखे, क्योंकि वह जानता है कि किन बातों ने मुझे जकड़ रखा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हमारे लिए” उपलब्ध अंग्रेज़ी साक्ष्य में कोष्ठकों में है; यह पाठगत पुनर्स्थापन या अनिश्चितता का संकेत देता है।
    reason: आधार-साक्ष्य में उपस्थित bracketed restoration signal को पाठक के लिए स्पष्ट करना।
  - marker: b
    text: “दुःख-भोग” से आशय यीशु मसीह की यातना, पीड़ा और मृत्यु से है।
    reason: ‘passion’ के ऐतिहासिक धार्मिक अर्थ को आधुनिक हिन्दी पाठक के लिए स्पष्ट करना, बिना मुख्य पाठ को विस्तार देने के।
lexical_decisions:
- source_word: farthest bounds / reaches
  choice: दूर-से-दूर सीमाएँ
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की स्थानिक अतिशयोक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: profit me nothing
  choice: मेरे किसी काम नहीं आएँगी
  rationale: शाब्दिक ‘लाभ’ की तुलना में प्रसंग में अधिक स्वाभाविक है, जबकि पूर्ण निष्फलता का भाव सुरक्षित रहता है।
- source_word: pangs of a new birth
  choice: नए जन्म की प्रसव-पीड़ाएँ
  rationale: जन्म और पीड़ा, दोनों बिंबों को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: pure light
  choice: शुद्ध ज्योति
  rationale: धार्मिक और रूपकात्मक गरिमा को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है।
- source_word: passion
  choice: दुःख-भोग
  rationale: यहाँ मसीह की यातना और मृत्यु से जुड़ी पीड़ा का संकेत है; आधुनिक हिन्दी में ‘पैशन’ या केवल ‘पीड़ा’ से अधिक उपयुक्त।
- source_word: things which straiten / constrain me
  choice: किन बातों ने मुझे जकड़ रखा है
  rationale: दबाव, घेराव और विवशता की अस्पष्टता को बिना किसी एक विशिष्ट कारण तक सीमित किए बनाए रखता है।
theological_decisions:
- issue: ‘मुझे जीने से मत रोको; मेरी मृत्यु की इच्छा मत करो’ का जानबूझकर विरोधाभासी कथन
  choice: विरोधाभास को ज्यों का त्यों बनाए रखा
  alternative: इसे ‘शहीद होकर सच्चा जीवन पाने’ की स्पष्ट व्याख्या में बदलना
  rationale: लेखक मृत्यु को जीवन-प्राप्ति के रूप में प्रस्तुत करता है; पाठ के धार्मिक तनाव को अनुवाद में चुपचाप हल नहीं किया गया।
- issue: ‘my God’ और उसके दुःख-भोग का संबंध
  choice: ‘अपने परमेश्वर के दुःख-भोग’
  alternative: ‘अपने प्रभु के दुःख-भोग’ या ‘मसीह के दुःख-भोग’
  rationale: उपलब्ध साक्ष्य में उपस्थित प्रबल मसीह-संबंधी कथन को नरम या पुनर्व्याख्यायित नहीं किया गया।
- issue: ‘then I will be a man’
  choice: ‘तभी मैं मनुष्य बनूँगा’
  alternative: ‘तभी मैं पूर्ण मनुष्य बनूँगा’
  rationale: ‘पूर्ण’ जोड़ने से निहितार्थ अधिक निश्चित हो जाता; मूल साक्ष्य की संक्षिप्त और रहस्यपूर्ण अभिव्यक्ति सुरक्षित रखी गई।
- issue: ‘If anyone has Him within himself’ में सर्वनाम का संदर्भ
  choice: ‘यदि किसी के भीतर वह है’
  alternative: ‘यदि किसी के भीतर मसीह है’
  rationale: निकटवर्ती संदर्भ यीशु मसीह की ओर संकेत करता है, फिर भी सर्वनाम को स्पष्ट संज्ञा से बदलकर मूल की हल्की संदर्भगत खुलावट समाप्त नहीं की गई।
