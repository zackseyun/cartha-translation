  yaml_path: translation/extra_canonical/letters_of_ignatius/012.yaml
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is—the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot always to be a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the apostles in the power of Jesus Christ.'
translation:
  language: hi
  text: 'ये अंतिम समय हैं। इसलिए अब से हम श्रद्धा रखें; हम परमेश्वर की सहनशीलता का भय मानें, कहीं ऐसा न हो कि वह हमारे विरुद्ध न्याय में बदल जाए। क्योंकि या तो हम आनेवाले क्रोध से डरें, या उस अनुग्रह को प्रेम करें जो अभी उपस्थित है—दोनों में से एक; बस हम सच्चे जीवन को प्राप्त करने के लिए मसीह यीशु में पाए जाएँ।



    उसके सिवा और कोई वस्तु तुम्हारी आँखों में न चमके, उसी में मैं अपनी बेड़ियाँ—अपने आत्मिक मोती—लिए फिरता हूँ। तुम्हारी प्रार्थना के द्वारा मैं फिर जी उठूँ, यही मेरी अभिलाषा है; और मुझे सदा उसमें सहभागी होने का सौभाग्य मिले, ताकि मैं इफिसुस के उन मसीहियों की संगति में पाया जाऊँ, जो यीशु मसीह की सामर्थ्य से सदा प्रेरितों के साथ एकमत रहे हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: last times
  choice: अंतिम समय
  rationale: युगांत-संबंधी अर्थ को सीधे और स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: long-suffering of God
  choice: परमेश्वर की सहनशीलता
  rationale: दैवी धैर्य और विलंबित दंड का भाव बनाए रखता है; ‘धीरज’ भी संभव है, पर ‘सहनशीलता’ चेतावनी के संदर्भ में अधिक स्पष्ट है।
- source_word: spiritual pearls
  choice: आत्मिक मोती
  rationale: बेड़ियों के लिए प्रयुक्त सजीव रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: rise again
  choice: पुनरुत्थान हो
  rationale: सिर्फ उठने या मुक्त होने के बजाय पुनरुत्थान-संबंधी आशा को व्यक्त करता है, जैसा संदर्भ संकेत करता है।
- source_word: of one mind with the Apostles
  choice: प्रेरितों के साथ सदा एकमत रहे हैं
  rationale: सहमति और साझा मनोभाव दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की सहनशीलता का न्याय में बदलना
  choice: कहीं ऐसा न हो कि वह हमारे विरुद्ध न्याय में बदल जाए
  alternative: कहीं ऐसा न हो कि वह हमारे लिए दंड का कारण बने
  rationale: मूल साक्ष्य की तीखी अलंकारिक अभिव्यक्ति और theological tension को नरम किए बिना बनाए रखा गया है।
- issue: क्रोध का भय अथवा वर्तमान अनुग्रह का प्रेम
  choice: दोनों में से एक
  alternative: इनमें से कम-से-कम एक
  rationale: लेखक के द्विविकल्पी आह्वान को जस का तस रखा गया है; दोनों को व्यवस्थित रूप से मिलाकर तनाव समाप्त नहीं किया गया।
- issue: बेड़ियों में पुनरुत्थान
  choice: इन्हीं में मेरा पुनरुत्थान हो
  alternative: इन्हीं को पहने हुए मैं फिर जी उठूँ
  rationale: शहादत और अंतिम पुनरुत्थान की संभावित परतों को खुला रखते हुए रूपक की निकटता बनाए रखी गई है।
- issue: मसीह में पाया जाना
  choice: मसीह यीशु में पाए जाएँ
  alternative: मसीह यीशु के साथ एक पाए जाएँ
  rationale: न्याय और अंतिम जीवन के प्रसंग में परंपरागत, पर गैर-सांप्रदायिक, संबंधात्मक भाषा रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; मध्य-पाठपरंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण यह मसौदा अस्थायी है। लंबे वाक्यों को सीमित रूप से सँवारा गया है, पर मूल की चेतावनी, रूपक और संभावित अस्पष्टताएँ सुरक्षित रखी गई हैं।
