  text: Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ, which is in Philadelphia of Asia, which has found mercy and is firmly established in the concord of God and rejoices in the passion of our Lord and in His resurrection without wavering, being fully assured in all mercy; which church I salute in the blood of Jesus Christ, that is eternal and abiding joy, more especially if they are at one with the bishop and the presbyters who are with him, and with the deacons who have been appointed according to the mind of Jesus Christ, whom after His own will He confirmed and established by His Holy Spirit.
translation:
  language: hi
  text: इग्नातियुस, जो थिओफोरुस भी कहलाता है, एशिया के फिलादेलफिया में स्थित परमेश्वर पिता और प्रभु यीशु मसीह की उस कलीसिया के नाम जिसने दया पाई है, जो परमेश्वर के सामंजस्य में दृढ़ता से स्थापित है, और जो हमारे प्रभु के दुःखभोग तथा उनके पुनरुत्थान में बिना डगमगाए आनन्दित होती है और हर प्रकार के अनुग्रह के विषय में पूर्णतः आश्वस्त है। मैं यीशु मसीह के लहू में उस कलीसिया को नमस्कार भेजता हूँ। वह अनन्त और स्थायी आनन्द है—विशेषकर यदि वे बिशप, उसके साथ के प्राचीनों और उन डीकनों[a] के साथ एक हों जिन्हें यीशु मसीह की सम्मति के अनुसार नियुक्त किया गया है और जिन्हें उन्होंने अपनी इच्छा के अनुसार अपने पवित्र आत्मा के द्वारा दृढ़ किया और स्थापित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘डीकन’ आरंभिक कलीसिया का एक ऐतिहासिक पदनाम है; इसका मूल अर्थ सेवा से संबद्ध है।
    reason: ऐतिहासिक पदनाम को बनाए रखते हुए सामान्य पाठक के लिए उसका मूल अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: थिओफोरुस
  rationale: नाम/उपाधि का लिप्यंतरण किया गया है; यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण इसके संभावित अर्थ (‘परमेश्वर को धारण करने वाला’ या ‘परमेश्वर द्वारा धारण किया हुआ’) को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: church (ἐκκλησία)
  choice: कलीसिया
  rationale: आरंभिक मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में परिचित और गरिमापूर्ण शब्द।
- source_word: concord
  choice: एकता
  rationale: संदर्भ में सामंजस्य और एकचित्तता का भाव है; सामान्य पाठक के लिए ‘एकता’ स्वाभाविक है, यद्यपि यूनानी स्रोत की समीक्षा के बाद ‘सामंजस्य’ पर पुनर्विचार हो सकता है।
- source_word: passion
  choice: दुःखभोग
  rationale: यह केवल भावनात्मक पीड़ा नहीं, बल्कि यीशु की गिरफ्तारी, यातना और मृत्यु से जुड़े पारंपरिक धर्मवैज्ञानिक अर्थ को व्यक्त करता है।
- source_word: bishop
  choice: बिशप
  rationale: ऐतिहासिक पदनाम की विशिष्टता सुरक्षित रखता है; इसे व्यापक अर्थ वाले ‘अध्यक्ष’ से नहीं बदला गया।
- source_word: presbyters
  choice: प्राचीनों
  rationale: आरंभिक कलीसियाई पद के लिए शाब्दिक और बाइबलीय रूप; किसी बाद की संप्रदायगत संरचना को आरोपित नहीं करता।
- source_word: deacons
  choice: सेवकों
  rationale: स्रोत पद का सेवाकार्य-संबंधी अर्थ सामान्य हिन्दी में व्यक्त करता है; ऐतिहासिक पदनाम ‘डीकन’ फुटनोट में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘in the blood of Jesus Christ’ और ‘eternal and abiding joy’ का संबंध
  choice: आनन्द को लहू के साथ व्याकरणिक रूप से जोड़ा गया और अस्पष्टता पर फुटनोट दिया गया।
  alternative: ‘यीशु मसीह के लहू में अभिवादन करता हूँ, जो अनन्त और स्थायी आनन्द है’ अथवा आनन्द को पूरी कलीसिया/अभिवादन से जोड़ना।
  rationale: उपलब्ध अंग्रेज़ी साक्षी निकटतम पूर्वपद ‘लहू’ की ओर संकेत करता है, पर वाक्य की प्राचीन संरचना संबंध को कुछ अस्पष्ट छोड़ती है; इसे बिना सूचना कठोरता से तय नहीं किया गया।
- issue: अंतिम संबंधवाचक ‘whom’ का पूर्वपद
  choice: इसे सेवकों सहित उल्लिखित नियुक्त अगुवों से संबंधित समझकर ‘उन्हें’ रखा गया।
  alternative: इसे केवल सेवकों से जोड़ना या यीशु मसीह को कर्ता न मानकर परमेश्वर पिता को कर्ता मानना।
  rationale: अंग्रेज़ी साक्षी में वचन-सामंजस्य और लंबी वाक्यरचना संदिग्ध हैं; मुख्य पाठ पठनीय रखा गया और अनिश्चितता फुटनोट में बताई गई।
- issue: कलीसियाई पदों की आधुनिक संप्रदायगत पहचान
  choice: ऐतिहासिक पदनामों को यथासंभव तटस्थ रूप में रखा गया।
  alternative: ‘धर्माध्यक्ष’, ‘पुरोहित’ और ‘उपयाजक’ जैसे परंपरा-विशिष्ट शब्द।
  rationale: पाठ में बाद की किसी विशेष कलीसियाई व्यवस्था को आरोपित करने से बचना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; मध्य-पाठीय यूनानी परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण विवादास्पद व्याकरणिक संबंधों को फुटनोटों में स्पष्ट किया गया है।
