base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/014.yaml
  text: 'Therefore, be diligent to meet together more frequently for thanksgiving to God and for his glory. For when you meet together frequently, the powers of Satan are cast down, and his mischief comes to nothing in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
translation:
  language: hi
  text: 'इसलिए पूरा प्रयत्न करो कि परमेश्वर को धन्यवाद देने और उसकी महिमा करने के लिए और भी अधिक बार एक साथ इकट्ठे हुआ करो। क्योंकि जब तुम बार-बार एक साथ इकट्ठे होते हो, तब शैतान की शक्तियाँ परास्त की जाती हैं, और तुम्हारे विश्वास की एकता में उसका विनाशकारी कार्य निष्प्रभावी हो जाता है।


    शांति से उत्तम कुछ भी नहीं है; उसमें स्वर्गीय और सांसारिक वास्तविकताओं का हर संघर्ष समाप्त कर दिया जाता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्वर्गीय और सांसारिक वास्तविकताओं’ के लिए मूल वाक्य में विशेषणों का संज्ञा-संदर्भ स्पष्ट नहीं है; इसका अर्थ ‘स्वर्ग और पृथ्वी की बातों/वस्तुओं का हर संघर्ष’ भी हो सकता है।
    reason: यूनानी में ‘स्वर्गीय’ और ‘सांसारिक’ शब्द संज्ञा के बिना प्रयुक्त हैं। मुख्य पाठ में व्यापक शब्द ‘वास्तविकताओं’ से अस्पष्टता बचाई गई है, और वैकल्पिक शाब्दिक समझ पादटिप्पणी में दी गई है।
lexical_decisions:
- source_word: thanksgiving
  choice: धन्यवाद देने
  rationale: यह सामूहिक रूप से परमेश्वर के प्रति कृतज्ञता व्यक्त करने का स्वाभाविक आधुनिक हिन्दी रूप है; उपलब्ध अंग्रेज़ी साक्ष्य किसी विशिष्ट अनुष्ठानिक अर्थ को अनिवार्य नहीं करता।
- source_word: concord
  choice: एकता
  rationale: विश्वासियों के विश्वास में मेल और सामंजस्य का भाव सरल, स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: mischief
  choice: विनाशकारी चालें
  rationale: सिर्फ़ हल्की ‘शरारत’ का भ्रम टालते हुए शैतान के हानिकारक षड्यंत्र का आशय व्यक्त किया गया है।
- source_word: peace
  choice: शांति
  rationale: व्यक्तिगत और सामुदायिक मेल, दोनों को समेटने वाला प्रतिष्ठित और व्यापक हिन्दी शब्द।
- source_word: powers of Satan
  choice: शैतान की शक्तियाँ
  rationale: अलौकिक या प्रभावकारी शक्तियों की सम्भावना को बिना सीमित किए उपलब्ध साक्ष्य की औपचारिकता बनाए रखता है।
theological_decisions:
- issue: ‘thanksgiving’ का अनुष्ठानिक या सामान्य अर्थ
  choice: परमेश्वर को धन्यवाद देने
  alternative: यूखरिस्त मनाने
  rationale: प्रत्यक्ष यूनानी समीक्षा अभी लंबित है; इसलिए उपलब्ध साक्ष्य से अधिक विशिष्ट संस्कार-संबंधी अर्थ आरोपित नहीं किया गया।
- issue: विश्वासियों के इकट्ठे होने और शैतानी शक्तियों के पतन का संबंध
  choice: कारणात्मक कथन को यथावत रखा
  alternative: इसे केवल उत्साहवर्धक रूपक के रूप में नरम करना
  rationale: पाठ की वास्तविक धर्मवैज्ञानिक तीव्रता और तनाव को सुरक्षित रखा गया है।
- issue: अंतिम वाक्य में युद्ध करने वाले पक्ष
  choice: स्वर्ग और पृथ्वी की शक्तियाँ
  alternative: स्वर्ग और पृथ्वी की वस्तुएँ
  rationale: अंग्रेज़ी साक्ष्य का वाक्यांश अर्थगत रूप से अस्पष्ट है; पठनीय मुख्य पाठ दिया गया है और वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। बहुवचन संबोधन और सामुदायिक स्वर बनाए रखे गए हैं। यह मसौदा सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-समीक्षित रूप है; मध्य-पाठ यूनानी परम्परा की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
