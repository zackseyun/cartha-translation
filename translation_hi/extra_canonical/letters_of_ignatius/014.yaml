source:
  text: 'Do your diligence therefore to meet together more frequently for thanksgiving to God and for His glory. For when ye meet together frequently, the powers of Satan are cast down; and his mischief cometh to nought in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
