base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/041.yaml
  text: 'For when you are obedient to the bishop as to Jesus Christ, it is evident to me that you are living not after men but after Jesus Christ, who died for us, so that, believing in his death, you might escape death.


    It is therefore necessary, even as is your custom, that you should do nothing without the bishop; but be obedient also to the presbytery, as to the Apostles of Jesus Christ our hope. For if we live in him, we shall also be found in him.


    And likewise those who are deacons of the mysteries of Jesus Christ must please all people in every way. For they are not deacons of meats and drinks but servants of the Church of God. It is right, therefore, that they should beware of blame as of fire.'
translation:
  language: hi
  text: 'क्योंकि जब आप बिशप की आज्ञा वैसे ही मानते हैं जैसे यीशु मसीह की, तो मेरे लिए यह स्पष्ट है कि आप मनुष्यों के अनुसार नहीं, बल्कि यीशु मसीह के अनुसार जीवन जी रहे हैं। वह हमारे लिए मर गए, ताकि उनकी मृत्यु पर विश्वास करके आप मृत्यु से बच सकें।


    इसलिए आवश्यक है कि, जैसा आपका रीति है, आप बिशप के बिना कुछ न करें। साथ ही पुरनियों की सभा की आज्ञा वैसे ही मानें जैसे हमारी आशा, यीशु मसीह के प्रेरितों की; क्योंकि यदि हम उनमें जीवन जीते हैं, तो हम उनमें पाए भी जाएँगे।


    इसी प्रकार, जो यीशु मसीह के रहस्यों के सेवक हैं, उन्हें हर प्रकार से सब लोगों को प्रसन्न करना चाहिए। क्योंकि वे खाने-पीने की वस्तुओं के सेवक नहीं, बल्कि परमेश्वर की कलीसिया के सेवक हैं। इसलिए उचित है कि वे दोष से वैसे ही सावधान रहें जैसे आग से।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bishop (Greek source review pending; likely ἐπίσκοπος)
  choice: बिशप
  rationale: आधुनिक हिन्दी मसीही पाठकों के लिए पदनाम स्पष्ट है और इसे सामान्य ‘अध्यक्ष’ कहकर संस्थागत अर्थ को अनावश्यक रूप से नहीं बदलता।
- source_word: presbytery (Greek source review pending; likely πρεσβυτέριον)
  choice: पुरनियों की सभा
  rationale: यह सामूहिक निकाय को व्यक्त करता है; केवल ‘पुरनिए’ कहने से सभा या परिषद का भाव कम हो जाता।
- source_word: mysteries (Greek source review pending; likely μυστήρια)
  choice: रहस्यों
  rationale: धार्मिक अर्थ और मूल की व्यापकता बनाए रखी गई है; इसे किसी विशिष्ट संस्कार-सिद्धांत तक सीमित नहीं किया गया।
- source_word: deacons / servants (Greek source review pending; likely διάκονοι)
  choice: सेवक
  rationale: इस अनुच्छेद की शब्द-क्रीड़ा और सेवा का मूल भाव हिन्दी में स्वाभाविक रूप से रखने के लिए ‘सेवक’ चुना गया; इसे लिप्यंतरित पदनाम तक सीमित नहीं किया।
- source_word: after Jesus Christ / in accordance with
  choice: यीशु मसीह के अनुसार
  rationale: यह जीवन के आदर्श या मानदंड का भाव देता है; ‘पीछे चलना’ यहाँ अधिक संकीर्ण या अस्वाभाविक होता।
theological_decisions:
- issue: बिशप के प्रति आज्ञाकारिता की तुलना मसीह के प्रति आज्ञाकारिता से
  choice: ‘वैसे ही ... जैसे’ के तुलनात्मक कथन को सीधे बनाए रखा
  alternative: इसे प्रतिनिधित्व या सीमित अधीनता की व्याख्या से नरम करना
  rationale: साक्ष्य में तीखा तुलनात्मक कथन है; अनुवाद ने न तो इसे पूर्ण समानता के सिद्धांत में बदला, न ही इसकी शक्ति घटाई।
- issue: ‘उनमें जीवन जीते हैं’ और ‘उनमें पाए जाएँगे’
  choice: दोनों ‘उनमें’ वाक्यांश सुरक्षित रखे
  alternative: दूसरे वाक्यांश को ‘उनके साथ पाए जाएँगे’ या मुक्ति-संबंधी व्याख्या से स्पष्ट करना
  rationale: मसीह में जीवन और मसीह में पाए जाने की धार्मिक भाषा तथा उसकी अंतर्निहित व्यापकता बनाए रखी गई।
- issue: ‘मृत्यु पर विश्वास’ का संबंध
  choice: ‘उनकी मृत्यु पर विश्वास करके ... मृत्यु से बच सकें’
  alternative: ‘उनकी मृत्यु के द्वारा’ या ‘उन पर विश्वास करके’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य जिस असामान्य संबंध को रखता है, उसे व्याख्यात्मक रूप से सामान्य नहीं किया गया।
- issue: ‘रहस्य’ का अर्थ
  choice: ‘यीशु मसीह के रहस्यों’
  alternative: ‘संस्कारों’ या ‘सुसमाचार के भेदों’
  rationale: प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण किसी खास संस्कारवादी या ज्ञानात्मक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामुदायिक संबोधन में बहुवचन ‘आप’ वाली रखी गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण पदनामों और ‘रहस्य’ जैसे शब्दों में सावधानी बरती गई है।
