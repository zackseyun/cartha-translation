base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/008.yaml
  text: 'For some are accustomed, with malicious deceit, to peddle the Name while doing other things unworthy of God. You should avoid these people as wild beasts, for they are mad dogs that bite in secret. Be on your guard against them, for they are difficult to heal.


    There is only one physician, of flesh and of spirit, generated and ungenerated, God in man, true Life in death, Son of Mary and Son of God, first able to suffer and then unable to suffer: Jesus Christ our Lord.'
translation:
  language: hi
  text: 'क्योंकि कुछ लोग दुर्भावनापूर्ण छल से उस नाम[a] का सौदा करते फिरते हैं, जबकि वे ऐसे दूसरे काम करते हैं जो परमेश्वर के योग्य नहीं हैं। तुम्हें इन लोगों से वैसे ही दूर रहना चाहिए जैसे जंगली पशुओं से; क्योंकि वे पागल कुत्ते हैं, जो छिपकर काटते हैं। उनसे सावधान रहो, क्योंकि उनका उपचार कठिन है।


    केवल एक ही वैद्य है—देहधारी और आत्मिक, जन्मा हुआ और अजन्मा[b], मनुष्य में परमेश्वर, मृत्यु में सच्चा जीवन, मरियम का पुत्र और परमेश्वर का पुत्र, पहले दुःख सह सकनेवाला और फिर दुःख से परे[c]—हमारा प्रभु यीशु मसीह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उस नाम” संभवतः यीशु मसीह के नाम अथवा उस नाम से जुड़ी मसीही पहचान की ओर संकेत करता है; वाक्य स्वयं इसे स्पष्ट नहीं करता।
    reason: विशिष्ट संकेत को समझने में सहायता देते हुए मूल की अस्पष्टता बनाए रखना।
  - marker: b
    text: 'शाब्दिक विरोधी युग्म: “जन्मा हुआ और अजन्मा।” इसे कभी मसीह के मानवीय जन्म और उनके दिव्य अस्तित्व के संदर्भ में समझा जाता है, पर यहाँ पाठ इसकी व्याख्या नहीं करता।'
    reason: कठिन और धर्मवैचारिक रूप से तनावपूर्ण भाषा को बिना चुपचाप सुलझाए स्पष्ट करना।
  - marker: c
    text: अर्थात पहले दुःख भोग सकनेवाला, फिर दुःख के अधीन न रहनेवाला। मूल युग्म की क्रमिक और विरोधी बनावट सुरक्षित रखी गई है।
    reason: ‘passible/impassible’ के तकनीकी विरोध को सामान्य पाठक के लिए समझने योग्य बनाना।
lexical_decisions:
- source_word: the Name
  choice: उस नाम
  rationale: विशिष्ट और श्रद्धापूर्ण संकेत को बिना उसका आशय चुपचाप निश्चित किए सुरक्षित रखा गया है।
- source_word: hawk about / peddle
  choice: का सौदा करते फिरते हैं
  rationale: लाभ या स्वार्थ के लिए किसी वस्तु को जगह-जगह बेचने जैसी निंदात्मक छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: physician
  choice: वैद्य
  rationale: प्राचीन संदर्भ के अनुकूल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शब्द।
- source_word: of flesh and of spirit
  choice: देहधारी और आत्मिक
  rationale: देह और आत्मा के युग्म को संक्षिप्त, काव्यात्मक समानांतरता में रखा गया है; इसे किसी विस्तृत दार्शनिक व्याख्या में नहीं बदला गया।
- source_word: generate and ungenerated
  choice: जन्मा हुआ और अजन्मा
  rationale: विरोधाभासी धर्मवैचारिक युग्म को सरल हिन्दी में बनाए रखता है और उसे एक ही अर्थ में समतल नहीं करता।
- source_word: passible and impassible
  choice: दुःख सह सकनेवाला और दुःख से परे
  rationale: तकनीकी शब्दावली से बचते हुए दुःख भोगने की सामर्थ्य और उससे परे होने के तनाव को सुरक्षित रखता है।
theological_decisions:
- issue: ‘जन्मा हुआ और अजन्मा’ का मसीह-संबंधी तनाव
  choice: युग्म को ज्यों का त्यों विरोधी रूप में रखा गया
  alternative: मानवीय रूप में जन्मा, पर दिव्य रूप में अजन्मा
  rationale: वैकल्पिक रूप मूल के निहित आशय की व्याख्या करता, जबकि उपलब्ध साक्ष्य के स्तर पर पाठ की संक्षिप्तता और तनाव को सुरक्षित रखना अधिक उचित है।
- issue: ‘मनुष्य में परमेश्वर’
  choice: मनुष्य में परमेश्वर
  alternative: मनुष्य बने हुए परमेश्वर
  rationale: ‘में’ वाले मूल संबंध को सुरक्षित रखा गया है; ‘मनुष्य बने हुए’ अवतार का अर्थ स्पष्ट करता, पर मूल की संभावित अस्पष्टता घटा देता।
- issue: दुःख सहने और दुःख से परे होने का क्रम
  choice: पहले दुःख सह सकनेवाला और फिर दुःख से परे
  alternative: पहले दुःखभोगी, फिर दुःखातीत
  rationale: क्रम और धर्मवैचारिक तनाव दोनों बनाए रखते हुए सामान्य आधुनिक हिन्दी को प्राथमिकता दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और चेतावनीपूर्ण शैली रखी गई है। पहले अनुच्छेद की तीखी पशु-उपमाएँ नरम नहीं की गईं। दूसरे अनुच्छेद की सूत्रात्मक, समानांतर और धर्मवैचारिक रूप से तनावपूर्ण संरचना को डैश तथा युग्मित पदों से बनाए रखा गया है। चूँकि प्रत्यक्ष यूनानी स्रोत-समीक्षा अभी लंबित बताई गई है, निर्णय उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और दिए गए परामर्श-पाठ के आधार पर सावधानी से किए गए हैं।
