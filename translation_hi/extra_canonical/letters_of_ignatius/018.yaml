base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/018.yaml
  text: 'For this reason the Lord received ointment on his head, so that he might breathe incorruption upon the church. Do not be anointed with the foul odor of the teaching of the prince of this world, so that he may not take you captive and rob you of the life set before you.


    Why do we not all walk wisely, receiving the knowledge of God, which is Jesus Christ? Why do we perish in our foolishness, not knowing the gift of grace that the Lord has truly sent?'
translation:
  language: hi
  text: 'इसी कारण प्रभु ने अपने सिर पर सुगंधित तेल ग्रहण किया, ताकि वह कलीसिया पर अविनाशी जीवन की साँस फूँके। इस संसार के शासक की शिक्षा की दुर्गंध से अपना अभिषेक न होने दो, कहीं ऐसा न हो कि वह तुम्हें बंदी बना ले और तुम्हारे सामने रखे हुए जीवन से तुम्हें वंचित कर दे।


    फिर हम सब बुद्धिमानी से क्यों नहीं चलते और परमेश्वर का ज्ञान—जो यीशु मसीह है—ग्रहण क्यों नहीं करते? हम अपनी मूर्खता में क्यों नाश होते हैं और अनुग्रह के उस वरदान को क्यों नहीं पहचानते, जिसे प्रभु ने सचमुच भेजा है?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध प्राचीन यूनानी पाठ की प्रत्यक्ष समीक्षा के अभाव में सार्वजनिक-क्षेत्र के अंग्रेज़ी साक्षी पर आधारित अस्थायी प्रारूप है।
    reason: दिए गए स्रोत-विवरण के अनुसार यूनानी स्रोत की समीक्षा अभी लंबित है; पाठकीय पारदर्शिता आवश्यक है।
lexical_decisions:
- source_word: ointment
  choice: सुगंधित तेल
  rationale: अभिषेक में प्रयुक्त सुगंधित द्रव्य का सहज आधुनिक हिन्दी रूप; अगले वाक्य की गंध-संबंधी शब्द-क्रीड़ा भी बनी रहती है।
- source_word: breathe incorruption upon
  choice: अविनाशी जीवन की साँस फूँके
  rationale: शाब्दिक साँस फूँकने की छवि सुरक्षित रखते हुए ‘incorruption’ का आशय सामान्य पाठक के लिए स्पष्ट किया गया है।
- source_word: the prince of this world
  choice: इस संसार का शासक
  rationale: पदवी को तटस्थ और स्वाभाविक रूप में रखा गया है; किसी अतिरिक्त नाम या व्याख्या को नहीं जोड़ा गया।
- source_word: walk prudently
  choice: बुद्धिमानी से चलते
  rationale: ‘चलना’ की नैतिक-जीवन संबंधी रूपकात्मक भाषा को सुरक्षित रखा गया है।
- source_word: knowledge of God, which is Jesus Christ
  choice: परमेश्वर का ज्ञान—जो यीशु मसीह है—
  rationale: साक्षी में उपस्थित व्याकरणिक पहचान और उसके धर्मवैचारिक तनाव को बिना नरम किए बनाए रखा गया है।
- source_word: gift of grace
  choice: अनुग्रह का वरदान
  rationale: ‘gift’ और ‘grace’ दोनों तत्वों को स्पष्ट एवं परिचित धार्मिक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘incorruption’ का अर्थ
  choice: अविनाशी जीवन
  alternative: अविनश्वरता / नाशरहितता
  rationale: कलीसिया पर साँस फूँकने की जीवनदायी छवि स्पष्ट होती है, पर मूल अवधारणा का अविनाशीपन बना रहता है।
- issue: ‘परमेश्वर का ज्ञान’ और यीशु मसीह का संबंध
  choice: 'सीधी पहचान: ‘जो यीशु मसीह है’'
  alternative: ‘जो यीशु मसीह के द्वारा मिलता है’
  rationale: उपलब्ध साक्षी प्रत्यक्ष पहचान करता है; उसे माध्यम-संबंध में बदलना अर्थ का अनधिकृत समाधान होता।
- issue: प्रभु द्वारा भेजे गए अनुग्रह के वरदान की पहचान
  choice: वरदान को अनिर्दिष्ट रखा
  alternative: इसे स्पष्टतः यीशु मसीह कहना
  rationale: संदर्भ ऐसा संकेत दे सकता है, किंतु उपलब्ध वाक्य इसे सीधे नहीं कहता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘कलीसिया’, ‘अभिषेक’ और ‘अनुग्रह’ जैसे स्थापित आरंभिक-मसीही शब्द रखे गए हैं। तेल, सुगंध और दुर्गंध की परस्पर जुड़ी रूपक-श्रृंखला तथा प्रश्नात्मक आग्रह सुरक्षित हैं।
