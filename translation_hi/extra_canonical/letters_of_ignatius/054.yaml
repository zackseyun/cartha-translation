    for the beginning verily is well ordered, if so be I shall attain unto the goal, that I may receive mine inheritance without hindrance. For I dread your very love, lest it do me an injury; for it is easy for you to do what ye will, but for me it is difficult to attain unto God, unless ye shall spare me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/054.yaml
  text: 'Because, in answer to my prayer to God, I have been granted the privilege of seeing your godly faces, I have received even more than I asked for. For while wearing chains in Christ Jesus, I hope to greet you, if it is the divine will that I should be counted worthy to reach the end.


    For the beginning is indeed well ordered, provided that I reach the goal and receive my inheritance without hindrance. I fear your very love, in case it should harm me. For it is easy for you to do what you want, but it is difficult for me to reach God unless you spare me.'
translation:
  language: hi
  text: 'परमेश्वर से की गई मेरी प्रार्थना के उत्तर में मुझे आपके धर्मपरायण मुखों का दर्शन करने का सौभाग्य मिला है; इस प्रकार मैंने जितना माँगा था, उससे भी अधिक पाया है। क्योंकि मसीह यीशु के लिए बेड़ियों में रहते हुए मैं आपको नमस्कार करने की आशा रखता हूँ—यदि परमेश्वर की इच्छा हो कि मुझे अंत तक पहुँचने के योग्य समझा जाए।


    आरंभ तो सचमुच अनुकूल है, बशर्ते कि मैं लक्ष्य तक पहुँचूँ, ताकि बिना किसी बाधा के अपना भाग प्राप्त कर सकूँ। मुझे तो आपके प्रेम से भी भय है, कहीं वह मुझे हानि न पहुँचा दे। क्योंकि आपके लिए जो आप चाहें वह करना आसान है; पर मेरे लिए परमेश्वर तक पहुँचना कठिन होगा, यदि आप मुझे ऐसा करने से रोकें।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, मुझे परमेश्वर तक पहुँचने या अपने लक्ष्य को प्राप्त करने से न रोकें। यहाँ का क्रियापद शाब्दिक रूप से ‘ईर्ष्या करना’ या ‘कृपणता से किसी बात से वंचित करना’ का भाव रख सकता है; संदर्भ में यह प्रेमवश हस्तक्षेप करके रोकने की ओर संकेत करता है।
    reason: अंतिम वाक्य में प्रयुक्त मुहावरे का अर्थ शाब्दिक अनुवाद से स्पष्ट नहीं होता। टिप्पणी संदर्भगत अर्थ बताती है, पर लक्ष्य को शहादत या किसी एक विशिष्ट घटना के रूप में परिभाषित नहीं करती।
lexical_decisions:
- source_word: godly countenances
  choice: भक्तिमय मुख
  rationale: ईश्वर के प्रति भक्ति से चिह्नित चेहरों का भाव बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिंदी दी गई है।
- source_word: wearing bonds in Christ Jesus
  choice: मसीह यीशु में बंधन पहने हुए
  rationale: कैद की वास्तविक बेड़ियों और मसीह से संबंध—दोनों को बनाए रखने के लिए रूपक को अपेक्षाकृत औपचारिक रूप में रखा गया है।
- source_word: reach unto the end
  choice: अंत तक पहुँचने
  rationale: मृत्यु/शहादत की संभावित ओर संकेत को स्पष्ट किए बिना मूल की संक्षिप्त और तनावपूर्ण अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: goal
  choice: लक्ष्य
  rationale: दौड़ अथवा यात्रा की परिणति का रूपक सहज हिंदी में सुरक्षित रहता है।
- source_word: inheritance
  choice: विरासत
  rationale: प्राप्त होने वाले अंतिम आध्यात्मिक भाग का पारंपरिक अर्थ बनाए रखते हुए आधुनिक सामान्य शब्द चुना गया है।
- source_word: attain unto God
  choice: परमेश्वर तक पहुँचना
  rationale: मूल साक्ष्य में निहित रहस्यपूर्ण और धर्मवैचारिक तनाव को किसी विशिष्ट व्याख्या में सीमित नहीं किया गया है।
theological_decisions:
- issue: ‘अंत’, ‘लक्ष्य’ और ‘परमेश्वर तक पहुँचना’ का आशय
  choice: इन अभिव्यक्तियों को खुला और परस्पर संबद्ध रखा गया है
  alternative: इन्हें सीधे ‘शहीद होना’ या ‘मृत्यु के बाद परमेश्वर के पास जाना’ कहना
  rationale: प्रसंग शहादत की ओर दृढ़ संकेत करता है, पर उपलब्ध साक्ष्य स्वयं इसे हर स्थान पर स्पष्ट शब्दों में नहीं कहता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: रोमी विश्वासियों के प्रेम से संभावित हानि
  choice: ‘कहीं वह मुझे हानि न पहुँचा दे’
  alternative: ‘कहीं वह मुझे मृत्यु से बचा न ले’
  rationale: प्रसंग में हस्तक्षेप करके रिहाई दिलाना संभव आशय है, किंतु मुख्य पाठ में उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
- issue: ‘unless ye shall spare me’ का अर्थ
  choice: ‘यदि आप मुझे छोड़ न दें’ और व्याख्यात्मक पादटिप्पणी
  alternative: ‘यदि आप मुझे बचाने से बाज़ न आएँ’ अथवा ‘यदि आप मुझ पर दया न करें’
  rationale: अंग्रेज़ी साक्ष्य का ‘spare me’ संदर्भ में असामान्य और बहुअर्थी है; यूनानी की प्रत्यक्ष समीक्षा लंबित होने के कारण मुख्य पाठ में खुली अभिव्यक्ति और पादटिप्पणी उचित है।
