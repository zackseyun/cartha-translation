  register: आधुनिक मानक हिंदी में गरिमापूर्ण, पत्रात्मक शैली रखी गई है। अनावश्यक पुरातनता से बचते हुए ‘बंधन’, ‘विरासत’ और ‘परमेश्वर तक पहुँचना’ जैसे मूल धर्मवैचारिक रूपकों को सुरक्षित रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठ-परंपरा के यूनानी की प्रत्यक्ष समीक्षा लंबित होने के कारण विशेषतः अंतिम वाक्य का अनुवाद अस्थायी सावधानी के साथ किया गया है।
