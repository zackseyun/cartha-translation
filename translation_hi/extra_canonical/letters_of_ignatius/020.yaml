base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/020.yaml
  text: 'Hidden from the ruler of this world were Mary’s virginity, her giving birth, and also the Lord’s death—three mysteries to be proclaimed aloud—which were accomplished in the silence of God. How, then, were they revealed to the ages?


    A star shone forth in the heaven above all the stars. Its light was beyond description, and its strangeness caused amazement. All the other constellations, together with the sun and moon, formed a chorus around the star, but the star itself far outshone them all. There was bewilderment about where this strange appearance, so unlike the others, had come from.


    From that time on, every sorcery and every spell was dissolved. Ignorance of wickedness vanished, and the ancient kingdom was torn down when God appeared in human likeness unto the newness of everlasting life. What had been brought to completion in the counsels of God began to take effect. From then on, everything was thrown into turmoil because the abolition of death had begun.'
translation:
  language: hi
  text: 'इस संसार के शासक से मरियम का कुँवारी होना, उनका संतान को जन्म देना, और इसी प्रकार प्रभु की मृत्यु भी छिपी रही—ये तीन ऐसे रहस्य थे जिनकी ऊँचे स्वर में घोषणा की जानी थी, और जो परमेश्वर की नीरवता में पूरे हुए। फिर वे युगों पर कैसे प्रकट किए गए?


    आकाश में एक तारा चमका, जो सब तारों से अधिक तेजस्वी था। उसका प्रकाश वर्णन से परे था, और उसकी विलक्षणता ने विस्मय उत्पन्न किया। सूर्य और चंद्रमा समेत अन्य सभी नक्षत्र उस तारे के चारों ओर मानो एक गान-मंडली बन गए; पर वह तारा उन सब से कहीं अधिक चमक रहा था। लोग उलझन में थे कि यह विलक्षण दृश्य, जो उन सबसे इतना भिन्न था, कहाँ से आया।


    उस समय से हर प्रकार का जादू-टोना और हर मंत्र निष्प्रभावी हो गया। दुष्टता से उपजी अज्ञानता मिट गई और प्राचीन राज्य ढा दिया गया, जब परमेश्वर अनन्त जीवन की नवीनता के लिए मनुष्य के रूप में प्रकट हुए। परमेश्वर की योजनाओं में जो सिद्ध हो चुका था, वह प्रभावी होने लगा। तब से सब कुछ उथल-पुथल में पड़ गया, क्योंकि मृत्यु का अंत करने का कार्य आरम्भ हो चुका था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद मध्यकालीन पाठ-परंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित रहते हुए उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर तैयार किया गया है। विशेष रूप से “दुष्टता से उपजी अज्ञानता” और “अनन्त जीवन की नवीनता के लिए” का अनुवाद यूनानी पाठ से आगे सत्यापन चाहता है।
    reason: उपलब्ध स्रोत-सामग्री स्वयं बताती है कि प्रत्यक्ष यूनानी समीक्षा अभी लंबित है; इसलिए महत्त्वपूर्ण संभावित अस्पष्टताओं को प्रकाशन में पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: prince/ruler of this world
  choice: इस संसार का शासक
  rationale: यह पदवी प्रतिकूल आध्यात्मिक सत्ता की ओर संकेत करती है; ‘शासक’ आधुनिक और स्वाभाविक है, जबकि निहित पहचान को व्याख्यात्मक रूप से स्पष्ट नहीं करता।
- source_word: virginity of Mary
  choice: मरियम का कुँवारी होना
  rationale: ‘कुँवारापन’ की अपेक्षा यह अभिव्यक्ति व्यक्ति के लिए अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: three mysteries to be cried aloud
  choice: तीन ऐसे रहस्य...जिनकी ऊँचे स्वर में घोषणा की जानी थी
  rationale: गुप्त रखे जाने और सार्वजनिक रूप से घोषित किए जाने के मूल विरोधाभास को बनाए रखता है।
- source_word: silence of God
  choice: परमेश्वर की नीरवता
  rationale: रहस्यमय और काव्यात्मक तनाव को बिना व्याख्या किए संरक्षित करता है।
- source_word: constellations...formed themselves into a chorus
  choice: नक्षत्र...मानो एक गान-मंडली बन गए
  rationale: आकाशीय पिंडों की सामूहिक स्तुति-सदृश काव्यात्मक छवि को सहज हिन्दी में रखता है।
- source_word: sorcery and every spell
  choice: जादू-टोना और हर मंत्र
  rationale: दो निकटवर्ती जादुई प्रथाओं के भेद को सामान्य आधुनिक शब्दावली में बनाए रखता है।
- source_word: ignorance of wickedness
  choice: दुष्टता से उपजी अज्ञानता
  rationale: अंग्रेज़ी साक्ष्य का संबंध अस्पष्ट है; यह पाठ दुष्टता से संबंधित अज्ञान के अर्थ को पठनीय रूप देता है, पर इसे अंतिम यूनानी समीक्षा के अधीन मानता है।
- source_word: ancient kingdom
  choice: प्राचीन राज्य
  rationale: सत्ता की पहचान को किसी खास धार्मिक व्याख्या से सीमित किए बिना मूल रूपक बनाए रखता है।
- source_word: newness of everlasting life
  choice: अनन्त जीवन की नवीनता
  rationale: असामान्य लेकिन अर्थपूर्ण मूल अभिव्यक्ति को समतल किए बिना हिन्दी में संरक्षित करता है।
- source_word: abolishing of death was taken in hand
  choice: मृत्यु का अंत करने का कार्य आरम्भ हो चुका था
  rationale: आरम्भ की गई निर्णायक प्रक्रिया का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘इस संसार के शासक’ की पहचान
  choice: उसे पदवी के रूप में ही रहने दिया गया
  alternative: सीधे ‘शैतान’ लिखना
  rationale: पाठ स्वयं नाम नहीं देता; स्पष्ट पहचान जोड़ना वास्तविक सांकेतिकता और अंतर्पाठीय तनाव को समाप्त कर देता।
- issue: परमेश्वर का मनुष्य के रूप में प्रकट होना
  choice: ‘परमेश्वर...मनुष्य के रूप में प्रकट हुए’
  alternative: ‘एक मनुष्य के समान दिखाई दिए’
  rationale: साक्ष्य के अवतारी कथन को बनाए रखते हुए यह नहीं बताता कि ‘रूप’ केवल बाहरी प्रतीति थी।
- issue: ‘अनन्त जीवन की नवीनता’ से वाक्यगत संबंध
  choice: ‘के लिए’ द्वारा उद्देश्य/दिशा का संबंध
  alternative: ‘में’ द्वारा अवस्था का संबंध
  rationale: अंग्रेज़ी witness का ‘unto’ दिशा या लक्ष्य सूचित करता है; यूनानी समीक्षा लंबित होने के कारण इसे अत्यधिक निश्चित नहीं बनाया गया।
- issue: मृत्यु का अंत
  choice: एक आरम्भ हो चुकी प्रक्रिया के रूप में
  alternative: मृत्यु तत्काल पूरी तरह समाप्त हो गई
  rationale: ‘was taken in hand’ और POB के ‘had begun’ के अनुसार आरम्भ और अंतिम पूर्णता के बीच का तनाव सुरक्षित रखा गया।
