base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/006.yaml
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
translation:
  language: hi
  text: 'क्योंकि यदि थोड़े ही समय में आपके बिशप के साथ मेरी ऐसी संगति हुई—जो केवल मानवीय रीति से नहीं, बल्कि आत्मा में थी—तो मैं आपको और भी कितना बधाई देता हूँ कि आप उनसे घनिष्ठता से जुड़े हुए हैं, जैसे कलीसिया यीशु मसीह से और यीशु मसीह पिता से जुड़े हैं, ताकि सब बातें एकता में सुर मिलाएँ।


    कोई धोखा न खाए। यदि कोई वेदी की सीमा के भीतर नहीं है, तो वह [परमेश्वर की] रोटी से वंचित है।[a] क्योंकि यदि दो व्यक्तियों की प्रार्थना में इतना सामर्थ्य होता है, तो बिशप और सारी कलीसिया की प्रार्थना में कितना अधिक होगा!


    इसलिए जो कोई सभा में नहीं आता, वह इसी से अपना घमंड प्रकट करता है और अपने आपको अलग कर चुका है; क्योंकि लिखा है, “परमेश्वर घमंडियों का विरोध करता है।”[b] इसलिए हम सावधान रहें कि बिशप का विरोध न करें, ताकि अपनी अधीनता के द्वारा हम अपने आपको परमेश्वर को सौंप दें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर की” शब्दावली उपलब्ध अंग्रेज़ी साक्ष्य में कोष्ठकों में है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: पाठगत अनिश्चितता को पाठक के सामने स्पष्ट रखना।
  - marker: b
    text: नीतिवचन 3:34 के यूनानी रूप से संबंधित कथन; तुलना करें याकूब 4:6 और 1 पतरस 5:5।
    reason: उद्धरण के शास्त्रीय संदर्भ की पहचान करना।
lexical_decisions:
- source_word: converse / fellowship (Greek review pending)
  choice: संगति
  rationale: यह केवल बातचीत नहीं, बल्कि आत्मिक सहभागिता और निकट संबंध का भाव व्यक्त करता है।
- source_word: bishop
  choice: बिशप
  rationale: आरंभिक कलीसियाई पद के लिए आधुनिक हिन्दी में व्यापक रूप से समझा जाने वाला, अपेक्षाकृत तटस्थ पदनाम।
- source_word: in the Spirit
  choice: आत्मा में
  rationale: मूल धार्मिक अभिव्यक्ति की संभावित अस्पष्टता बनाए रखता है; इसे केवल ‘आत्मिक ढंग से’ कहकर व्याख्यायित नहीं किया गया।
- source_word: precinct of the altar
  choice: वेदी की सीमा के भीतर
  rationale: वेदी-संबंधी रूपक और समुदाय की सीमा—दोनों को बिना संप्रदायगत विस्तार के सुरक्षित रखता है।
- source_word: bread [of God]
  choice: '[परमेश्वर की] रोटी'
  rationale: साक्ष्य में कोष्ठकित पाठ की अनिश्चितता को कोष्ठकों सहित बनाए रखा गया है।
- source_word: congregation
  choice: सभा
  rationale: एकत्रित विश्वासी समुदाय का सहज और व्यापक हिन्दी रूप।
- source_word: submission
  choice: अधीनता
  rationale: पदाधिकारी के प्रति आज्ञापालन/विनम्र समर्पण के अर्थ को औपचारिक किंतु स्पष्ट ढंग से व्यक्त करता है।
theological_decisions:
- issue: वेदी के भीतर होने और रोटी पाने का संबंध
  choice: रूपक को शाब्दिक संरचना में सुरक्षित रखा गया
  alternative: इसे स्पष्टतः यूखरिस्तीय सहभागिता या संस्थागत सदस्यता के रूप में समझाना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य और लंबित यूनानी समीक्षा किसी एक संप्रदायगत अर्थ को निर्णायक नहीं बनाते।
- issue: ‘आत्मा’ का संदर्भ
  choice: ‘आत्मा में’
  alternative: ‘पवित्र आत्मा में’ अथवा ‘आत्मिक रीति से’
  rationale: अनुवाद ने न तो स्पष्ट रूप से ‘पवित्र’ जोड़ा, न वाक्यांश को केवल आचरण की रीति बना दिया; इससे मूल तनाव बना रहता है।
- issue: बिशप के प्रति अधीनता का उद्देश्य
  choice: ‘अपने आपको परमेश्वर को सौंप दें’
  alternative: ‘परमेश्वर के पूर्ण अधीन हों’
  rationale: व्यक्ति के परमेश्वर को आत्मसमर्पण का भाव रखा गया, पर बिशप और परमेश्वर की सत्ता को समान नहीं ठहराया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। ‘कलीसिया’ और ‘बिशप’ जैसे ऐतिहासिक-कलीसियाई शब्द बनाए गए हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण जहाँ आवश्यक था वहाँ अस्पष्टता और कोष्ठक सुरक्षित रखे गए हैं।
