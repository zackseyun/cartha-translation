base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/039.yaml
  text: Ignatius, who is also called Theophorus, to the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto him. I also greet this church in the divine fullness, after the apostolic fashion, and wish her abundant greeting.
translation:
  language: hi
  text: इग्नातियुस, जो थियोफोरुस भी कहलाता है, उस कलीसिया के नाम जो यीशु मसीह के पिता परमेश्वर की प्रिय है—एशिया के त्रल्लेस नगर में स्थित पवित्र कलीसिया, जो चुनी हुई और परमेश्वर के योग्य है, और यीशु मसीह के दुःख-भोग के द्वारा शरीर और आत्मा में शांति रखती है। वही यीशु मसीह हमारे उस पुनरुत्थान के द्वारा हमारी आशा हैं, जो हमें उनकी ओर ले जाता है। इस कलीसिया को मैं प्रेरितों की रीति के अनुसार परमेश्वर की परिपूर्णता में नमस्कार करता हूँ और भरपूर शुभकामनाएँ देता हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; मध्य-पाठ-परंपरा के यूनानी स्रोत से प्रत्यक्ष समीक्षा अभी शेष है। विशेषतः ‘हमारे पुनरुत्थान के द्वारा उनकी ओर’ और ‘परमेश्वर की परिपूर्णता’ वाले वाक्यांशों की पुष्टि यूनानी पाठ से की जानी चाहिए।
    reason: प्रदान किए गए स्रोत-विवरण के अनुसार प्रत्यक्ष यूनानी समीक्षा लंबित है; पाठक को आधार और प्रमुख अनिश्चितताओं की स्पष्ट सूचना देना आवश्यक है।
lexical_decisions:
- source_word: Theophorus
  choice: थियोफोरुस
  rationale: उपनाम को अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है, क्योंकि उपलब्ध अंग्रेज़ी साक्ष्य इसके अभिप्रेत अर्थ को निश्चित नहीं करता।
- source_word: church
  choice: कलीसिया
  rationale: आरंभिक मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित और गरिमापूर्ण शब्द।
- source_word: passion
  choice: दुःख-भोग
  rationale: यह केवल सामान्य पीड़ा नहीं, बल्कि यीशु मसीह के अंतिम दुःख और मृत्यु की ओर संकेत करता है; ‘दुःख-भोग’ इस धार्मिक आशय को संक्षेप में बनाए रखता है।
- source_word: flesh and spirit
  choice: शरीर और आत्मा
  rationale: मूल की द्विपदी और उसकी संभावित धार्मिक-अस्तित्वगत व्यापकता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: Divine plenitude
  choice: परमेश्वर की परिपूर्णता
  rationale: ‘परिपूर्णता’ plenitude/fullness की धार्मिक प्रतिध्वनि को बनाए रखता है, जबकि ‘परमेश्वर की’ हिन्दी में स्वाभाविक है।
- source_word: after the apostolic fashion
  choice: प्रेरितों की रीति के अनुसार
  rationale: वाक्यांश को किसी विशिष्ट कलीसियाई पद या अधिकार-सिद्धांत में बदले बिना उसके सामान्य अर्थ में रखा गया है।
theological_decisions:
- issue: ‘through our resurrection unto Him’ का संबंध और अर्थ
  choice: ‘हमारे उस पुनरुत्थान के द्वारा हमारी आशा हैं, जो हमें उनकी ओर ले जाता है’
  alternative: ‘उनमें हमारे पुनरुत्थान के कारण हमारी आशा हैं’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में ‘unto Him’ दिशा या लक्ष्य प्रकट करता है। चुना गया पाठ इस दिशा को बनाए रखता है, पर यह स्वीकार किया जाता है कि यूनानी की प्रत्यक्ष समीक्षा के बिना वाक्य-संबंध पूर्णतः निश्चित नहीं है।
- issue: ‘peace in flesh and spirit’
  choice: ‘शरीर और आत्मा में शांति रखती है’
  alternative: ‘दैहिक और आत्मिक शांति पाती है’
  rationale: पहला रूप स्रोत की संज्ञात्मक समानांतरता और अस्पष्टता को अधिक निकटता से बचाता है; इसे आंतरिक-बाहरी या सामुदायिक-आध्यात्मिक शांति के रूप में सीमित नहीं किया गया।
- issue: ‘worthy of God’
  choice: ‘परमेश्वर के योग्य’
  alternative: ‘परमेश्वर के सम्मान के योग्य’
  rationale: संक्षिप्त, औपचारिक अभिव्यक्ति मूल धार्मिक तनाव को बनाए रखती है और योग्यता का आधार जोड़कर अर्थ नहीं सुलझाती।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी में; शैली पत्रात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे यूनानीनुमा अभिवादन को पठनीय बनाने के लिए वाक्य-विभाजन किया गया, पर उपाधियों और धार्मिक पदों का क्रम यथासंभव सुरक्षित रखा गया है।
