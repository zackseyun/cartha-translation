base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/001.yaml
  text: 'Ignatius, who is also Theophorus, to her who has been blessed in greatness through the fullness of God the Father; who was foreordained before the ages to be forever in abiding and unchangeable glory, united and chosen in a true passion, by the will of the Father and of Jesus Christ our God; even to the church that is in Ephesus [of Asia], worthy of every felicitation: abundant greeting in Christ Jesus and in blameless joy.'
translation:
  language: hi
  text: 'इग्नातियुस, जो थिओफोरुस भी कहलाता है, उस कलीसिया को जो परमपिता परमेश्वर की परिपूर्णता के द्वारा महान रूप से आशीषित हुई है; जो युगों से पहले ही ठहराई गई कि वह सदा बनी रहे और स्थायी तथा अपरिवर्तनीय महिमा में रहे; जो पिता और हमारे परमेश्वर यीशु मसीह की इच्छा से एक सच्चे दुःखभोग में एक की गई और चुनी गई है—अर्थात [आसिया के] इफिसुस में स्थित उस कलीसिया को, जो हर प्रकार की बधाई के योग्य है: यीशु मसीह में और निष्कलंक आनन्द में भरपूर अभिवादन।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; मध्य-पाठ-परंपरा के यूनानी पाठ से प्रत्यक्ष समीक्षा अभी लंबित है। ‘थिओफोरुस’ का अर्थ खोले बिना नाम या उपाधि के रूप में रखा गया है। वर्ग कोष्ठकों में ‘[आसिया के]’ साक्ष्य के पुनर्स्थापन-संकेत को सुरक्षित रखता है।
    reason: पाठाधार की सीमा, अनिर्वचित उपाधि और साक्ष्य में उपस्थित संपादकीय पुनर्स्थापन को पारदर्शी बनाना।
lexical_decisions:
- source_word: Ἰγνάτιος / Ignatius
  choice: इग्नातियुस
  rationale: नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण किया गया है।
- source_word: Θεόφορος / Theophorus
  choice: थिओफोरुस
  rationale: उपाधि अथवा नाम का अर्थ निर्धारित किए बिना उसे लिप्यंतरित रखा गया है, क्योंकि स्रोत-समीक्षा अभी लंबित है।
- source_word: plentitude / fullness
  choice: परिपूर्णता
  rationale: यह शब्द ईश्वरीय भरपूरी का भाव रखता है और हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: foreordained
  choice: पहले ही ठहराई गई
  rationale: पूर्व-निर्धारण का मूल भाव रखा गया है, पर किसी विशिष्ट सम्प्रदायगत सिद्धान्त की शब्दावली नहीं थोपी गई।
- source_word: true passion
  choice: सच्चे दुःखभोग
  rationale: यहाँ ‘passion’ को सामान्य भावना नहीं, दुःख सहने अथवा मसीह के दुःखभोग के अर्थ में प्रस्तुत किया गया है; संबंध की कुछ अस्पष्टता बनी रहती है।
- source_word: church
  choice: कलीसिया
  rationale: आरम्भिक मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित और सहज शब्द।
- source_word: felicitation
  choice: बधाई
  rationale: अत्यधिक पुरातन हिन्दी से बचते हुए सम्मान और अभिनन्दन का व्यावहारिक अर्थ दिया गया है।
- source_word: blameless joy
  choice: निष्कलंक आनन्द
  rationale: नैतिक निर्दोषता और आनन्द दोनों भावों को संक्षेप में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘Jesus Christ our God’ में यीशु मसीह के लिए ‘our God’ का प्रयोग
  choice: हमारे परमेश्वर यीशु मसीह
  alternative: यीशु मसीह, हमारे परमेश्वर
  rationale: साक्ष्य में उपस्थित स्पष्ट ईश्वरीय संबोधन को बिना नरम किए रखा गया; शब्दक्रम हिन्दी में बोधगम्य बनाया गया है।
- issue: ‘united and elect in a true passion’ का आशय
  choice: एक सच्चे दुःखभोग में एक की गई और चुनी गई
  alternative: सच्चे दुःखभोग के द्वारा एक की गई और चुनी गई
  rationale: ‘in’ और दुःखभोग के साथ संबंध की वास्तविक अस्पष्टता को कारणवाचक ‘के द्वारा’ में बदलकर हल नहीं किया गया।
- issue: कलीसिया के लिए स्त्रीलिंग संबोधन
  choice: स्त्रीलिंग क्रियापदों द्वारा बनाए रखा
  alternative: समुदाय को पुल्लिंग रूप में प्रस्तुत करना
  rationale: मूल अभिवादन में कलीसिया को स्त्रीलिंग रूप में संबोधित करने की संरचना को हिन्दी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पत्रात्मक शैली अपनाई गई है। मूल की लम्बी और औपचारिक अभिवादन-संरचना को अर्धविरामों और दीर्घ विराम से पठनीय बनाया गया है। स्रोत-यूनानी की प्रत्यक्ष समीक्षा लंबित होने के कारण कठिन पदों में अंग्रेज़ी साक्ष्य से अधिक निश्चितता का दावा नहीं किया गया।
