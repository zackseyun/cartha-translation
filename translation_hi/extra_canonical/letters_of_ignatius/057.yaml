base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/057.yaml
  text: 'I write to all the churches, and I want everyone to know that I willingly die for God—unless you hinder me. I urge you: do not show me kindness at the wrong time. Let me be given to the wild beasts, for through them I can reach God. I am God’s wheat, and I am ground by the teeth of wild beasts so that I may be found to be pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave no part of my body behind. Then, when I have fallen asleep, I will not be a burden to anyone. I will truly be a disciple of Jesus Christ when the world does not even see my body. Plead with the Lord for me, so that through these instruments I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a convict. They were free, but I am a servant even to this hour. Yet if I suffer, then I will be a freedman of Jesus Christ, and I will rise free in him. Now, in my chains, I am learning to put away every desire.'
translation:
  language: hi
  text: 'मैं सभी कलीसियाओं को लिखता हूँ और सबको बता देता हूँ कि मैं अपनी इच्छा से परमेश्वर के लिए मर रहा हूँ—यदि आप मुझे न रोकें। मैं आपसे आग्रह करता हूँ: अनुचित समय पर मुझ पर कृपा न करें। मुझे जंगली पशुओं के हवाले हो जाने दें, क्योंकि उनके द्वारा मैं परमेश्वर तक पहुँच सकता हूँ। मैं परमेश्वर का गेहूँ हूँ, और जंगली पशुओं के दाँतों से पीसा जाता हूँ, ताकि मैं [मसीह की] शुद्ध रोटी पाया जाऊँ।[a]


    बल्कि जंगली पशुओं को उकसाएँ, ताकि वे ही मेरी कब्र बन जाएँ और मेरे शरीर का कोई अंश न छोड़ें; तब सो जाने के बाद मैं किसी पर बोझ नहीं बनूँगा। जब संसार मेरे शरीर को भी नहीं देखेगा, तभी मैं सचमुच यीशु मसीह का शिष्य होऊँगा। मेरे लिए प्रभु से विनती करें कि इन साधनों के द्वारा मैं परमेश्वर के लिए बलिदान पाया जाऊँ।


    मैं आपको वैसी आज्ञा नहीं देता जैसी पतरस और पौलुस ने दी थी। वे प्रेरित थे; मैं दंडित कैदी हूँ। वे स्वतंत्र थे, पर मैं इस घड़ी तक दास हूँ। फिर भी, यदि मैं दुःख सहूँ, तो मैं यीशु मसीह का मुक्त किया हुआ जन होऊँगा और उसी में स्वतंत्र होकर जी उठूँगा। अब मैं अपनी बेड़ियों में हर अभिलाषा त्यागना सीख रहा हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह की’ शब्द पांडुलिपि-पाठ में अनिश्चित हैं; उपलब्ध साक्ष्य में इन्हें संपादकीय पुनर्स्थापन के रूप में कोष्ठकों में दिया गया है।
    reason: अंग्रेज़ी साक्षी के वर्गाकार कोष्ठक पाठालोचनात्मक अनिश्चितता दर्शाते हैं; मुख्य पाठ में वही संकेत सुरक्षित रखा गया है।
lexical_decisions:
- source_word: ἀποθανεῖν / die (witness)
  choice: मर रहा हूँ
  rationale: स्वेच्छा से निकट आती शहादत का वर्तमान और आसन्न भाव बनाए रखा गया है।
- source_word: ἐπιτυχεῖν θεοῦ / attain unto God
  choice: परमेश्वर तक पहुँच सकता हूँ
  rationale: मूल की लक्ष्य-प्राप्ति संबंधी भाषा को बिना किसी विशिष्ट परलोक-सिद्धांत से बाँधे स्वाभाविक हिन्दी में रखा गया है।
- source_word: σίτος θεοῦ / God’s wheat
  choice: परमेश्वर का गेहूँ
  rationale: इग्नातियुस के रूपक को प्रत्यक्ष और ठोस रूप में सुरक्षित रखा गया है।
- source_word: κατακρίτος / convict
  choice: दंडित कैदी
  rationale: केवल सामान्य बंदी नहीं, बल्कि दंडादेश के अधीन व्यक्ति का भाव व्यक्त करता है।
- source_word: δοῦλος / slave
  choice: दास
  rationale: ‘सेवक’ की अपेक्षा अधीनता और स्वतंत्रता के अभाव का विरोध अधिक स्पष्ट रखता है।
- source_word: ἀπελεύθερος / freedman
  choice: मुक्त किया हुआ जन
  rationale: प्राचीन विधिक-सामाजिक अर्थ को सहज हिन्दी में व्यक्त करता है और ‘स्वतंत्र’ के अगले प्रयोग से भेद बनाए रखता है।
- source_word: ἐπιθυμία / desire
  choice: अभिलाषा
  rationale: शब्द की व्यापकता को बनाए रखा गया है; इसे केवल शारीरिक वासना तक सीमित नहीं किया गया।
theological_decisions:
- issue: शहादत के द्वारा परमेश्वर तक पहुँचना
  choice: ‘उनके द्वारा मैं परमेश्वर तक पहुँच सकता हूँ’
  alternative: ‘उनके द्वारा मैं परमेश्वर को प्राप्त कर सकता हूँ’
  rationale: दावे की तीव्रता और साधनवाचक भाषा सुरक्षित है, पर हिन्दी में ऐसा अतिरिक्त अर्थ नहीं जोड़ा गया कि शहादत स्वयं उद्धार अर्जित करती है।
- issue: ‘सच्चा शिष्य’ होने का कथन
  choice: ‘तभी मैं सचमुच ... शिष्य होऊँगा’
  alternative: ‘तभी मैं सिद्ध शिष्य प्रमाणित होऊँगा’
  rationale: मूल की तनावपूर्ण भावी अभिव्यक्ति को समझाकर नरम नहीं किया गया और ‘सिद्ध’ जैसी व्याख्यात्मक संज्ञा नहीं जोड़ी गई।
- issue: बलिदान की भाषा
  choice: ‘परमेश्वर के लिए बलिदान पाया जाऊँ’
  alternative: ‘परमेश्वर को स्वीकार्य बलिदान ठहरूँ’
  rationale: ‘स्वीकार्य’ मूल में स्पष्ट नहीं है; इसलिए मृत्यु को बलिदान के रूप में प्रस्तुत करने वाला कथन बिना विस्तार के रखा गया।
- issue: मसीह में जी उठना और स्वतंत्र होना
  choice: ‘उसी में स्वतंत्र होकर जी उठूँगा’
  alternative: ‘उसके द्वारा स्वतंत्र होकर पुनर्जीवित होऊँगा’
  rationale: ‘उसमें’ की सहभागितामूलक भाषा सुरक्षित रखी गई है और पुनरुत्थान का सीधा भाव व्यक्त किया गया है।
