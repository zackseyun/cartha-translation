base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/030.yaml
  text: 'Therefore, just as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do you do anything without the bishop and the presbyters. And do not attempt to think anything right for yourselves apart from others; but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.


    Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.'
translation:
  language: hi
  text: 'इसलिए, जैसे प्रभु ने पिता के बिना कुछ नहीं किया—[उनके साथ एक होकर][a]—न तो अपने आप और न प्रेरितों के द्वारा, वैसे ही तुम भी बिशप और प्राचीनों के बिना कुछ न करो। दूसरों से अलग होकर अपनी ही किसी बात को सही ठहराने का प्रयत्न न करो। इसके बजाय, तुम सबकी एक ही प्रार्थना, एक ही विनती, एक ही मन और एक ही आशा हो—प्रेम में और निष्कलंक आनन्द में—जो यीशु मसीह है; उनसे उत्तम कुछ भी नहीं।


    तुम सब शीघ्रता से एक साथ इकट्ठे हो, मानो एक ही मन्दिर में—अर्थात परमेश्वर में; और मानो एक ही वेदी के पास—अर्थात एक ही यीशु मसीह के पास। वह एक पिता से निकलकर आए, एक के साथ हैं और एक ही के पास चले गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिए गए शब्द उपलब्ध अंग्रेज़ी साक्षी में भी पुनर्स्थापित पाठ के रूप में चिह्नित हैं; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: साक्षी में उपस्थित पाठगत अनिश्चितता और परियोजना की स्रोत-समीक्षा स्थिति को पारदर्शी रखना।
lexical_decisions:
- source_word: bishop (Greek source review pending; likely ἐπίσκοπος)
  choice: बिशप
  rationale: आरम्भिक कलीसियाई पदनाम को आधुनिक हिन्दी में पहचाने जाने योग्य रूप में रखा गया; ‘अध्यक्ष’ मूल पद की ऐतिहासिक-कलीसियाई विशिष्टता को धुँधला कर सकता है।
- source_word: presbyters (Greek source review pending; likely πρεσβύτεροι)
  choice: प्राचीनों
  rationale: बहुवचन और सामुदायिक नेतृत्व-पद दोनों सुरक्षित रहते हैं; किसी बाद की संप्रदायगत पद-व्यवस्था को आरोपित नहीं किया गया।
- source_word: one mind
  choice: एक ही मन
  rationale: साझी मानसिकता और एकता की छवि को सहज हिन्दी में यथासंभव औपचारिक रूप से बनाए रखा गया।
- source_word: altar
  choice: वेदी
  rationale: उपासना-संबंधी रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया।
- source_word: came forth
  choice: निकलकर आए
  rationale: गतिशीलता और उद्गम की भाषा रखी गई, पर इसे किसी विशिष्ट उत्तरकालीन सिद्धान्तगत सूत्र में नहीं बदला गया।
theological_decisions:
- issue: पिता के साथ प्रभु की एकता
  choice: '[उनके साथ एक होकर]'
  alternative: '[उनसे संयुक्त होकर]'
  rationale: अंग्रेज़ी साक्षी के पुनर्स्थापन-संकेत को कोष्ठकों और पाद-टिप्पणी से सुरक्षित रखा गया; ‘एक होकर’ साधारण पाठक के लिए स्वाभाविक है, पर तत्त्वगत अभिन्नता का अतिरिक्त दावा नहीं करता।
- issue: ‘which is Jesus Christ’ का पूर्वपद
  choice: ‘जो यीशु मसीह है’ को आशा से व्याकरणिक रूप से जोड़ा
  alternative: पूरी एकीकृत प्रार्थना, विनती, मन, आशा, प्रेम और आनन्द को यीशु मसीह से जोड़ना
  rationale: उपलब्ध अंग्रेज़ी साक्षी में संबंध कुछ अस्पष्ट है; हिन्दी में निकटतम व्याकरणिक पूर्वपद ‘आशा’ है, फिर भी वाक्य-संरचना व्यापक धार्मिक प्रतिध्वनि को खुला रखती है।
- issue: एक पिता/एक के साथ/एक के पास
  choice: ‘एक’ की पुनरावृत्ति बनाए रखी
  alternative: हर बार स्पष्ट रूप से ‘पिता’ कहना
  rationale: स्रोत-साक्षी की संक्षिप्त, तनावपूर्ण और संभावित रूप से धर्मवैज्ञानिक भाषा को व्याख्या द्वारा समतल नहीं किया गया।
- issue: सामुदायिक नेतृत्व के बिना कुछ न करना
  choice: प्रत्यक्ष निषेध को ज्यों का त्यों रखा
  alternative: केवल परामर्श लेने की नरम भाषा
  rationale: पाठ के प्रबल सामुदायिक-अधिकार संबंधी आग्रह को किसी आधुनिक कलीसियाई व्यवस्था के अनुसार न तो नरम किया गया, न विस्तृत।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘बिशप’ और ‘प्राचीन’ ऐतिहासिक पदनामों के रूप में रखे गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; यूनानी मध्य-पाठ-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण मसौदा सावधानीपूर्वक अनंतिम है।
