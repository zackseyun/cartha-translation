base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/056.yaml
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
translation:
  language: hi
  text: 'आपने कभी किसी से ईर्ष्या नहीं की; आपने दूसरों को शिक्षा दी है। मेरी इच्छा है कि जिन बातों की शिक्षा देते हुए आप आज्ञा करते हैं, वे अटल बनी रहें।


    केवल यह प्रार्थना कीजिए कि मुझे भीतर और बाहर से सामर्थ्य दी जाए, ताकि मैं इसे केवल कहूँ ही नहीं, बल्कि चाहूँ भी; ताकि मैं केवल मसीही कहलाऊँ ही नहीं, बल्कि वास्तव में मसीही पाया भी जाऊँ। क्योंकि यदि मैं ऐसा पाया जाऊँ, तभी मैं मसीही कहलाने योग्य भी हो सकता हूँ और उस समय विश्वासयोग्य ठहर सकता हूँ, जब मैं संसार को फिर दिखाई न दूँ।


    जो कुछ दिखाई देता है, उसमें कुछ भी भला नहीं है।[a] क्योंकि हमारे परमेश्वर यीशु मसीह, पिता में रहते हुए, और भी अधिक प्रकट होते हैं। यह कार्य मनवानेवाली बातों का नहीं है; बल्कि मसीही विश्वास महान सामर्थ्य की बात है,[b] जब संसार उससे घृणा करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भला” के लिए यूनानी शब्द का अर्थ “अच्छा,” “सुंदर” या “श्रेष्ठ” भी हो सकता है।
    reason: मूल विशेषण के नैतिक और सौंदर्यात्मक अर्थ-क्षेत्र को सुरक्षित रखना।
  - marker: b
    text: 'शाब्दिक रूप से: “मसीही विश्वास महानता की बात है।” कुछ अनुवाद इसे “सामर्थ्य की बात” कहते हैं।'
    reason: यूनानी μεγέθους की शाब्दिक ‘महानता’ और संदर्भगत ‘सामर्थ्य’ के बीच अनुवादगत तनाव बताना।
lexical_decisions:
- source_word: ἐβασκάνατε
  choice: ईर्ष्या नहीं की
  rationale: क्रिया का मूल भाव किसी की भलाई से जलना या दुर्भावनापूर्वक ईर्ष्या करना है; यह ‘किसी बात से वंचित रखना’ की तुलना में यूनानी अर्थ को अधिक सीधे व्यक्त करता है।
- source_word: βέβαια
  choice: अटल बनी रहें
  rationale: शिक्षाओं के दृढ़, स्थायी और प्रभावी बने रहने का भाव देता है।
- source_word: δύναμις
  choice: सामर्थ्य
  rationale: भीतरी इच्छा और बाहरी आचरण, दोनों के लिए दी जाने वाली शक्ति का व्यापक भाव सुरक्षित रखता है।
- source_word: εὑρεθῶ
  choice: वास्तव में ... पाया भी जाऊँ
  rationale: केवल नाम और प्रमाणित वास्तविकता के बीच लेखक के विरोध को स्पष्ट रखता है।
- source_word: φαίνωμαι / φαίνεται
  choice: दिखाई न दूँ / प्रकट होते हैं
  rationale: एक ही यूनानी शब्द-परिवार की दृश्यता और प्रकटीकरण संबंधी शब्द-क्रीड़ा को यथासंभव बनाए रखता है।
- source_word: πεισμονῆς
  choice: मनवानेवाली बातों
  rationale: सिर्फ वाक्पटुता नहीं, बल्कि दबावपूर्ण या कुशल मनुहार से सहमति प्राप्त करने का भाव व्यक्त करता है।
- source_word: μεγέθους
  choice: महान सामर्थ्य
  rationale: शाब्दिक ‘महानता’ और संदर्भगत प्रभावी शक्ति, दोनों को समेटता है; केवल ‘सामर्थ्य’ कहने से यूनानी संज्ञा की महानता का पक्ष खो सकता है।
theological_decisions:
- issue: ‘हमारे परमेश्वर यीशु मसीह’ में मसीह का संबोधन
  choice: हमारे परमेश्वर यीशु मसीह
  alternative: हमारे परमेश्वर के यीशु मसीह
  rationale: यूनानी व्याकरण यीशु मसीह को सीधे ‘हमारे परमेश्वर’ कहता है; संबंधकारक अर्थ जोड़ना पाठ की स्पष्ट रचना को बदल देता।
- issue: संसार को दिखाई न देने का आशय
  choice: जब मैं संसार को फिर दिखाई न दूँ
  alternative: जब संसार में मेरी प्रतिष्ठा न रहे
  rationale: मृत्यु/शहादत की ओर संकेत को बनाए रखा गया है, पर उसे व्याख्यात्मक रूप से सीधे ‘मर जाऊँ’ नहीं बनाया गया, ताकि मूल की दृश्यता संबंधी भाषा और तनाव सुरक्षित रहे।
- issue: दृश्य वस्तुओं की भलाई पर कथन
  choice: जो कुछ दिखाई देता है, उसमें कुछ भी भला नहीं है
  alternative: कोई दिखावटी वस्तु अच्छी नहीं
  rationale: वाक्य की कठोर और व्यापक ध्वनि को नरम नहीं किया गया; साथ ही पादटिप्पणी में विशेषण के अर्थ-क्षेत्र की जानकारी दी गई है।
- issue: मसीही विश्वास और संसार की घृणा
  choice: मसीही विश्वास महान सामर्थ्य की बात है, जब संसार उससे घृणा करता है
  alternative: मसीहियत महान है, जब संसार उससे घृणा करता है
  rationale: अमूर्त ‘मसीहियत’ के स्थान पर स्वाभाविक हिन्दी रखी गई, पर संसार की घृणा को उसकी प्रामाणिकता की सरल कसौटी बनाकर अतिरिक्त सिद्धांत नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। संबोधन बहुवचन ‘आप’ में है। उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के साथ मध्य-पाठ यूनानी परंपरा के ज्ञात पाठ का प्राथमिक मिलान किया गया है; औपचारिक प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित होने के कारण विवादास्पद पदों पर पादटिप्पणियों द्वारा पारदर्शिता रखी गई है।
