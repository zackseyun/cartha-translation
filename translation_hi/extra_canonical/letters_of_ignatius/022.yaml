  register: आधुनिक मानक हिन्दी, सम्मानसूचक बहुवचन और गरिमापूर्ण पत्रात्मक शैली अपनाई गई है। ‘कलीसिया’, ‘स्मुरना’ और ‘पोलिकार्प’ जैसे ऐतिहासिक-ईसाई पदनाम बनाए रखे गए हैं। भाषा को सामान्य पाठक के लिए स्वाभाविक रखा गया है, पर उपलब्ध अंग्रेज़ी साक्ष्य से आगे बढ़कर संप्रदायगत अर्थ आरोपित नहीं किए गए।
