base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/022.yaml
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
translation:
  language: hi
  text: 'मैं आपके प्रति और उन लोगों के प्रति समर्पित हूँ जिन्हें आपने परमेश्वर के सम्मान के लिए स्मुरना भेजा था। वहीं से मैं भी प्रभु को धन्यवाद देते हुए आपको लिख रहा हूँ। मैं पोलिकार्प से भी वैसा ही प्रेम करता हूँ जैसा आपसे। मुझे स्मरण रखें, जैसे मेरी इच्छा है कि यीशु मसीह भी आपको स्मरण रखें।


    सीरिया की कलीसिया के लिए प्रार्थना करें। वहीं से मुझे बंदी बनाकर रोम ले जाया जा रहा है—मैं, जो वहाँ के विश्वासियों में सबसे छोटा हूँ; फिर भी मुझे परमेश्वर के सम्मान के योग्य पाया गया। परमपिता परमेश्वर और यीशु मसीह में—जो हम सबकी आशा हैं—कुशल से रहें।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य के आधार पर तैयार किया गया अस्थायी पाठ है। मध्य-पाठपरंपरा के यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी शेष है; विशेषकर “परमेश्वर के सम्मान के योग्य पाया गया” और “हम सबकी आशा” वाले वाक्यांश पुनः जाँचे जाने चाहिए।
    reason: उपलब्ध सामग्री स्वयं बताती है कि प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित है; पाठक को आधार और प्रमुख अनिश्चितताओं की पारदर्शी सूचना देना आवश्यक है।
lexical_decisions:
- source_word: I am devoted to you
  choice: मैं आपके प्रति ... समर्पित हूँ
  rationale: अंग्रेज़ी साक्ष्य में व्यक्त गहरे आत्मीय समर्पण को आधुनिक, गरिमापूर्ण हिन्दी में रखा गया है; संभावित यूनानी मुहावरे की प्रत्यक्ष जाँच अभी शेष है।
- source_word: for the honor of God
  choice: परमेश्वर के सम्मान के लिए
  rationale: ‘honor’ को ‘महिमा’ बनाकर अर्थ को धर्मशास्त्रीय रूप से अधिक विशिष्ट नहीं किया गया; साक्ष्य के सामान्य अर्थ को सुरक्षित रखा गया है।
- source_word: Remember me
  choice: मुझे स्मरण रखें
  rationale: ‘याद रखें’ की अपेक्षा पत्रात्मक और प्रार्थनात्मक गरिमा बनाए रखता है, और अगले खंड में मसीह द्वारा स्मरण किए जाने की समानांतरता भी बचाता है।
- source_word: the very last of the faithful
  choice: विश्वासियों में सबसे छोटा
  rationale: ‘last’ का आशय आत्म-दीनता या निम्नतम स्थान हो सकता है; स्वाभाविक हिन्दी में ‘सबसे छोटा’ उस भाव को व्यक्त करता है, यद्यपि यूनानी समीक्षा लंबित है।
- source_word: our common hope
  choice: जो हम सबकी आशा हैं
  rationale: ‘common’ को सहज हिन्दी में साझा आशा के रूप में व्यक्त किया गया और इसका निकटतम व्याकरणिक संबंध यीशु मसीह से रखा गया।
theological_decisions:
- issue: ‘according as I was counted worthy to be found unto the honor of God’ का संबंध और अर्थ
  choice: फिर भी मुझे परमेश्वर के सम्मान के योग्य पाया गया
  alternative: जिस प्रकार मुझे परमेश्वर की महिमा के लिए पाया जाने योग्य समझा गया
  rationale: अंग्रेज़ी साक्ष्य का वाक्य असहज और संभावित रूप से बहुअर्थी है। हिन्दी में आत्म-दीनता और मिले हुए सम्मान के तनाव को रखा गया है, पर प्रत्यक्ष यूनानी समीक्षा के बिना इसे अधिक निश्चित धर्मशास्त्रीय दावा नहीं बनाया गया।
- issue: ‘our common hope’ का संदर्भ
  choice: यीशु मसीह—जो हम सबकी आशा हैं
  alternative: परमपिता परमेश्वर और यीशु मसीह—जो हमारी साझा आशा हैं
  rationale: अंग्रेज़ी में निकटतम पूर्वपद यीशु मसीह है, लेकिन व्यापक संयुक्त संदर्भ भी संभव है। मुख्य पाठ में स्वाभाविक निकट-संबंध चुना गया और टिप्पणी में अस्थायित्व स्पष्ट किया गया।
- issue: ‘Jesus Christ may also remember you’ में कामना की भाव-छाया
  choice: मेरी इच्छा है कि यीशु मसीह भी आपको स्मरण रखें
  alternative: यीशु मसीह भी आपको स्मरण करें
  rationale: स्रोत-साक्ष्य के इच्छार्थक ‘may’ को मिटाए बिना आधुनिक हिन्दी में प्रार्थनात्मक कामना के रूप में व्यक्त किया गया है।
