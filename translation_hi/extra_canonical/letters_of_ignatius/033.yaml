base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/033.yaml
  text: 'Therefore, let us not be insensitive to his goodness. For if he were to imitate us according to our deeds, we would be lost. For this reason, since we have become his disciples, let us learn to live in a way worthy of Christianity. For whoever is called by any name other than this does not belong to God.


    Therefore, put away the vile leaven that has grown stale and sour, and turn to the new leaven, which is Jesus Christ. Be salted in him, so that none of you becomes putrid, since you will be tested by your savor.


    It is monstrous to speak of Jesus Christ and practice Judaism. For Christianity did not believe in Judaism, but Judaism believed in Christianity, in which every tongue believed and was gathered together to God.'
translation:
  language: hi
  text: 'इसलिए हम उसकी भलाई के प्रति संवेदनहीन न रहें। क्योंकि यदि वह हमारे कामों के अनुसार हमारे ही जैसा व्यवहार करे, तो हम नष्ट हो जाएँगे। इसलिए, जब हम उसके चेले बन गए हैं, तो आइए मसीही जीवन के अनुरूप जीना सीखें। क्योंकि जो कोई इसके सिवा किसी और नाम से पुकारा जाता है, वह परमेश्वर का नहीं है।


    अतः उस निकृष्ट खमीर को दूर कर दो, जो बासी और खट्टा हो गया है, और नए खमीर की ओर मुड़ो, जो यीशु मसीह है। उसी में नमकीन किए जाओ, ताकि तुममें से कोई सड़ न जाए, क्योंकि तुम्हारी गंध से तुम्हारी परख होगी।[a]


    यीशु मसीह की बातें करना और यहूदी रीति पर चलना घोर विसंगति है।[b] क्योंकि मसीही विश्वास ने यहूदी धर्म पर विश्वास नहीं किया, बल्कि यहूदी धर्म ने मसीही विश्वास पर विश्वास किया—उसी में हर भाषा के लोगों ने विश्वास किया और परमेश्वर के पास इकट्ठे किए गए।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ खमीर, नमक, सड़न और गंध के जुड़े हुए रूपक हैं। ‘तुम्हारी गंध से तुम्हारी परख होगी’ का आशय है कि तुम्हारे जीवन का वास्तविक गुण प्रकट हो जाएगा।
    reason: असामान्य मिश्रित रूपक को बिना समतल किए समझने में सहायता देना।
  - marker: b
    text: यहाँ ‘यहूदी रीति पर चलना’ धार्मिक जीवन-पद्धति के लिए प्रयुक्त है; यह जातीय यहूदी पहचान के बारे में सामान्य कथन नहीं है।
    reason: ऐतिहासिक विवादात्मक भाषा का दायरा स्पष्ट करना और अनुचित जातीय सामान्यीकरण से बचना।
  - marker: c
    text: ‘हर भाषा के लोग’ सार्वभौमिक विस्तार का संकेत है। वाक्य की रचना में ‘उसी में’ का निकटतम संदर्भ मसीही विश्वास है।
    reason: मुहावरे और सर्वनाम-संदर्भ को स्पष्ट करना, जबकि उपलब्ध साक्ष्य की सीमा स्वीकार करना।
lexical_decisions:
- source_word: goodness
  choice: भलाई
  rationale: ईश्वरीय कृपा या दया तक अर्थ को सीमित किए बिना सामान्य नैतिक और उपकारी अर्थ बनाए रखता है।
- source_word: Christianity
  choice: मसीही जीवन / मसीही विश्वास
  rationale: पहले प्रसंग में जीवन-पद्धति और बाद के विरोध में विश्वास-परंपरा अभिप्रेत है; आधुनिक हिन्दी में एक ही अमूर्त शब्द को यांत्रिक रूप से दोहराने के बजाय प्रसंगानुकूल रूप चुना गया है।
- source_word: leaven
  choice: खमीर
  rationale: रूपक को सीधे बनाए रखता है और साधारण हिन्दी पाठक के लिए परिचित है।
- source_word: Be ye salted in Him
  choice: उसी में नमकीन किए जाओ
  rationale: असामान्य परंतु जानबूझकर प्रयुक्त नमक के रूपक और उसके निष्क्रिय भाव को सहज व्याख्या से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: savor
  choice: गंध
  rationale: सड़ने और परखे जाने के निकट संदर्भ में ‘गंध’ स्वाभाविक है, यद्यपि मूल रूपक स्वाद और गंध दोनों की छाया रख सकता है।
- source_word: practice Judaism
  choice: यहूदी रीति पर चलना
  rationale: जातीय पहचान के बजाय धार्मिक आचरण का भाव व्यक्त करता है और ‘यहूदी धर्म का अभ्यास करना’ जैसी अस्वाभाविक हिन्दी से बचता है।
- source_word: every tongue
  choice: हर भाषा के लोग
  rationale: सेमिटिक मुहावरे का सामूहिक मानवीय अर्थ स्वाभाविक हिन्दी में देता है, जबकि भाषाई विविधता को बनाए रखता है।
theological_decisions:
- issue: ‘किसी और नाम’ का आशय
  choice: अस्पष्ट संकेत को ‘इसके सिवा किसी और नाम’ के रूप में बनाए रखा गया
  alternative: इसे स्पष्ट रूप से किसी विशेष पंथ, उपाधि या ‘मसीही’ नाम के निषेध के रूप में समझाना
  rationale: प्राप्त साक्ष्य में संकेत का सटीक विस्तार निश्चित नहीं है; अनुवाद ने व्याख्यात्मक विस्तार नहीं जोड़ा।
- issue: मसीही विश्वास और यहूदी धर्म के बीच कथन
  choice: मूल की तीखी और परस्पर-विरोधी रचना को सुरक्षित रखा गया
  alternative: इसे समन्वयकारी या आधुनिक धर्म-संबंधी कथन बनाकर नरम करना
  rationale: लेखक की ऐतिहासिक धर्मवैचारिक तनातनी पाठ का वास्तविक अंग है; उसे मिटाना उचित नहीं, पर जातीय यहूदियों पर सामान्य आरोप भी नहीं जोड़ा गया।
- issue: ‘परमेश्वर के पास इकट्ठे किए गए’ में कर्तृत्व
  choice: निष्क्रिय रूप रखा गया
  alternative: ‘परमेश्वर ने उन्हें इकट्ठा किया’
  rationale: निष्क्रियता परमेश्वर के निहित कर्तृत्व की संभावना रखती है, पर उसे पाठ में स्पष्ट करके अर्थ को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। खमीर, नमक, सड़न और गंध के तीखे रूपकों को सहज बनाने के लिए हटाया नहीं गया। यह मसौदा दिए गए सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठपरंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण शब्दगत निर्णय अनंतिम माने जाने चाहिए।
