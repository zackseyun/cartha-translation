  english_witness: 'So then it becometh you to run in harmony with the mind of the bishop; which thing also ye do. For your honorable presbytery, which is worthy of God, is attuned to the bishop, even as its strings to a lyre. Therefore in your concord and harmonious love Jesus Christ is sung.


    And do ye, each and all, form yourselves into a chorus, that being harmonious in concord and taking the key note of God ye may in unison sing with one voice through Jesus Christ unto the Father, that He may both hear you and acknowledge you by your good deeds to be members of His Son. It is therefore profitable for you to be in blameless unity, that ye may also be partakers of God always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/005.yaml
  text: 'So then it is fitting for you to run in harmony with the mind of the bishop, as indeed you do. For your honorable council of elders, which is worthy of God, is attuned to the bishop like strings to a lyre. Therefore Jesus Christ is sung in your unity and harmonious love.


    Each and every one of you should form yourselves into a chorus, so that, being harmonious in unity and taking the key note of God, you may sing in unison with one voice through Jesus Christ to the Father. Then he may both hear you and acknowledge by your good deeds that you are members of his Son. It is therefore beneficial for you to be in blameless unity, so that you may always share in God.'
translation:
  language: hi
  text: 'इसलिए तुम्हारे लिए उचित है कि तुम बिशप की सोच के साथ तालमेल रखते हुए आगे बढ़ो—और तुम ऐसा करते भी हो। तुम्हारी आदरणीय प्राचीनों की परिषद, जो परमेश्वर के योग्य है, बिशप के साथ वैसे ही सुर में बँधी है जैसे वीणा के तार। इस प्रकार तुम्हारी एकता और सुरमय प्रेम में यीशु मसीह का गीत गूँजता है।


    तुममें से प्रत्येक जन मिलकर एक गायक-मंडली बन जाए, ताकि एकता में सुर मिलाकर और परमेश्वर से अपना सुर लेकर तुम एक स्वर में, यीशु मसीह के द्वारा, पिता के लिए गाओ। तब वह तुम्हारी सुने और तुम्हारे भले कामों से पहचाने कि तुम उसके पुत्र के अंग हो। इसलिए तुम्हारे लिए निर्दोष एकता में बने रहना लाभदायक है, ताकि तुम सदा परमेश्वर के सहभागी रहो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mind of the bishop
  choice: बिशप की सोच
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के ‘mind’ को आधुनिक, सहज हिन्दी में व्यक्त करता है; इसे ‘आज्ञा’ बनाकर पदानुक्रम का अर्थ अधिक प्रबल नहीं किया गया।
- source_word: presbytery
  choice: प्राचीनों की परिषद
  rationale: यह सामूहिक निकाय को स्पष्ट करता है और किसी आधुनिक संप्रदाय-विशेष के पदनाम को आरोपित नहीं करता।
- source_word: attuned / harmony / concord
  choice: तालमेल / सुर में बँधी / एकता में सुर मिलाकर
  rationale: मूल अंश में फैले संगीत-रूपक को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: lyre
  choice: वीणा
  rationale: भारतीय पाठक के लिए परिचित तारवाद्य-संज्ञा है और संगीतात्मक उपमा को स्पष्ट रखती है।
- source_word: taking the key note of God
  choice: परमेश्वर से अपना सुर लेकर
  rationale: संगीत के आरंभिक या नियामक स्वर की छवि को सरल हिन्दी में सुरक्षित रखता है।
- source_word: members of His Son
  choice: उसके पुत्र के अंग
  rationale: देह और अंगों की सामुदायिक छवि को शाब्दिक निकटता से बनाए रखता है।
- source_word: partakers of God
  choice: परमेश्वर के सहभागी
  rationale: परमेश्वर में सहभागिता की प्रबल और कुछ हद तक खुली धार्मिक भाषा को नरम या व्याख्यायित नहीं करता।
theological_decisions:
- issue: बिशप और प्राचीनों की परिषद का संबंध
  choice: ‘सोच के साथ तालमेल’ और ‘सुर में बँधी’
  alternative: ‘बिशप की आज्ञा मानना’ या ‘उसके अधीन होना’
  rationale: उपलब्ध साक्ष्य सामंजस्य पर बल देता है; स्पष्ट आज्ञाकारिता या संस्थागत अधीनता जोड़ना पाठ से आगे जाता।
- issue: यीशु मसीह का गाया जाना
  choice: ‘यीशु मसीह का गीत गूँजता है’
  alternative: ‘तुम यीशु मसीह की स्तुति गाते हो’
  rationale: निष्क्रिय अभिव्यक्ति और उसका काव्यात्मक तनाव सुरक्षित रखा गया है; उसे केवल स्तुतिगान की क्रिया में सीमित नहीं किया।
- issue: पिता द्वारा पहचान
  choice: ‘तुम्हारे भले कामों से पहचाने कि तुम उसके पुत्र के अंग हो’
  alternative: ‘भले कामों के कारण तुम्हें उद्धार दे’
  rationale: भले काम पहचान के प्रमाण हैं; पाठ में कारणात्मक उद्धार-सिद्धांत नहीं जोड़ा गया।
- issue: परमेश्वर में सहभागिता
  choice: ‘परमेश्वर के सहभागी रहो’
  alternative: ‘परमेश्वर की आशीषें पाते रहो’
  rationale: मूल धार्मिक दावे की शक्ति और रहस्य को बनाए रखा गया, उसे केवल वरदान प्राप्त करने तक सीमित नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘तुम’ बहुवचन सामुदायिक संबोधन के रूप में प्रयुक्त है। संगीत-रूपक पूरे अनुच्छेद में जानबूझकर बनाए रखे गए हैं। प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और अंकेक्षित अंग्रेज़ी POB पर आधारित है; अतः सूक्ष्म यूनानी शब्दार्थ की पुष्टि आवश्यक है।
