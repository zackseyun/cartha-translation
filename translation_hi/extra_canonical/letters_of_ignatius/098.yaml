base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/098.yaml
  text: 'Since I have been unable to write to all the churches because I sailed suddenly from Troas to Neapolis, as the divine will commands, you shall write to the churches ahead, as one who possesses the mind of God, so that they too may do this same thing: let those who are able send messengers, and let the rest send letters with the people you send, so that you may be glorified by an ever-memorable deed—for this is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, together with her entire household and those of her children. I greet my beloved Attalus. I greet the one who will be appointed to go to Syria. Grace will always be with him, and with Polycarp, who sends him.


    I always bid you farewell in our God Jesus Christ. Remain in him, in the unity and supervision of God. I greet Alce, a name very dear to me. Farewell in the Lord.'
translation:
  language: hi
  text: 'चूँकि त्रोआस से नेआपुलिस के लिए मुझे अचानक जहाज़ से निकलना पड़ा—जैसा परमेश्वर की इच्छा ठहराती है—इसलिए मैं सब कलीसियाओं को नहीं लिख सका। अतः तुम, परमेश्वर की मनसा रखनेवाले व्यक्ति के समान, आगे की कलीसियाओं को लिखना, ताकि वे भी यही काम करें: जो समर्थ हैं वे दूत भेजें, और शेष लोग तुम्हारे भेजे हुए व्यक्तियों के हाथ पत्र भेजें। इस प्रकार तुम सदा स्मरण किए जाने योग्य कार्य के कारण महिमा पाओगे—क्योंकि यह तुम्हारे योग्य है।


    मैं सबको नाम लेकर नमस्कार करता हूँ, विशेष रूप से एपित्रोपुस की पत्नी को, उसके पूरे घराने और उसके बच्चों के घरानों सहित। मैं अपने प्रिय अत्तालुस को नमस्कार करता हूँ। जो सीरिया जाने के लिए नियुक्त किया जाएगा, उसे भी नमस्कार करता हूँ। अनुग्रह सदा उसके साथ और उसे भेजनेवाले पोलीकार्प के साथ रहे।


    हमारे परमेश्वर यीशु मसीह में मैं तुम सबको सदा विदा कहता हूँ। तुम उसी में, परमेश्वर की एकता और देखरेख में, बने रहो। मैं अल्के को नमस्कार करता हूँ, जिसका नाम मुझे बहुत प्रिय है। प्रभु में विदा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the mind of God
  choice: परमेश्वर की मनसा
  rationale: ‘मनसा’ यहाँ केवल बुद्धि नहीं, बल्कि सोच, अभिप्राय और दृष्टिकोण की व्यापक धारणा व्यक्त करता है।
- source_word: messengers
  choice: दूत
  rationale: संदर्भ में कलीसियाओं द्वारा भेजे जानेवाले प्रतिनिधि अभिप्रेत हैं; ‘दूत’ इस भूमिका को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: supervision of God
  choice: परमेश्वर की ... देखरेख
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के असामान्य ‘supervision’ को किसी विशिष्ट कलीसियाई पद या धर्मवैज्ञानिक अर्थ में बदले बिना सुरक्षित रखा गया है।
- source_word: ever-memorable deed
  choice: सदा स्मरण किए जाने योग्य कार्य
  rationale: मूल साक्ष्य की स्थायी स्मरणीयता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Grace
  choice: अनुग्रह
  rationale: प्राचीन मसीही पत्रों के अभिवादन और आशीर्वचन की स्थापित तथा अर्थपूर्ण हिन्दी शब्दावली।
theological_decisions:
- issue: ‘our God Jesus Christ’ में यीशु मसीह का संबोधन
  choice: हमारे परमेश्वर यीशु मसीह
  alternative: हमारे परमेश्वर और यीशु मसीह
  rationale: उपलब्ध साक्ष्य यीशु मसीह को सीधे ‘हमारा परमेश्वर’ कहता है; ‘और’ जोड़ने से वाक्य का धर्मवैज्ञानिक आशय बदल जाता।
- issue: ‘unity and supervision of God’ का संबंध
  choice: परमेश्वर की एकता और देखरेख में
  alternative: परमेश्वर और अध्यक्ष की एकता में
  rationale: प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण उपलब्ध साक्ष्य की दो समांतर संज्ञाओं को बनाए रखा गया है और ‘supervision’ को किसी पदाधिकारी के रूप में नहीं समझाया गया।
- issue: दैवी इच्छा की भूमिका
  choice: जैसा परमेश्वर की इच्छा ठहराती है
  alternative: जैसी परमेश्वर की आज्ञा थी
  rationale: अंग्रेज़ी witness के वर्तमानकालीन ‘enjoineth/commands’ को बनाए रखते हुए इसे केवल अतीत की एक आज्ञा में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पत्रात्मक और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘तुम’ एकवचन और बहुवचन दोनों संदर्भों में स्वाभाविक रूप से प्रयुक्त है। नामों का देवनागरी लिप्यंतरण किया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण संदिग्ध वाक्यांशों में अनावश्यक धर्मवैज्ञानिक सामंजस्य से बचा गया है।
