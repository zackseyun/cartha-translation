base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/040.yaml
  text: 'I have learned that you have a blameless mind and are steadfast in patience, not from habit but by nature, just as Polybius your bishop informed me. By the will of God and Jesus Christ, he visited me in Smyrna, and he rejoiced so greatly with me in my chains in Christ Jesus that in him I saw the whole multitude of you.


    Therefore, having received your godly goodwill through him, I gave glory, because I had found you to be imitators of God, just as I had learned.'
translation:
  language: hi
  text: 'मैंने जाना है कि आपका मन निर्दोष है और आप धीरज में अटल हैं—यह केवल अभ्यास से नहीं, बल्कि आपके स्वभाव में है—जैसा कि आपके बिशप पोलिबियुस ने मुझे बताया। परमेश्वर और यीशु मसीह की इच्छा से वह स्मुरना में मुझसे मिलने आया। मसीह यीशु के कारण मेरी बेड़ियों में उसने मेरे साथ इतना अधिक आनन्द मनाया कि उसमें मुझे आप सब दिखाई दिए।


    इसलिए, उसके हाथों आपकी परमेश्वर-भक्त सद्भावना पाकर मैंने महिमा की[a], क्योंकि जैसा मैंने सुना था, वैसा ही मैंने आपको परमेश्वर का अनुकरण करनेवाला पाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने महिमा की”; किसकी महिमा की गई, यह वाक्य में स्पष्ट नहीं है। सम्भवतः आशय परमेश्वर की महिमा करना है।
    reason: मूल गवाही में कर्म अनिर्दिष्ट है; टिप्पणी संभावित आशय बताती है, पर मुख्य पाठ की वास्तविक अस्पष्टता बनाए रखती है।
lexical_decisions:
- source_word: mind (Greek διάνοια, as reflected in the witness)
  choice: मन
  rationale: यहाँ केवल बुद्धि नहीं, बल्कि भीतरी सोच और मनोवृत्ति का भाव है; साधारण हिन्दी में ‘मन’ इस व्यापकता को सबसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: steadfast in patience (Greek ἀδιάκριτον ἐν ὑπομονῇ, source review pending)
  choice: धीरज में अटल
  rationale: यह धैर्य रखने के साथ-साथ कठिनाई में स्थिर बने रहने का भाव सुरक्षित रखता है।
- source_word: not from habit, but by nature
  choice: केवल अभ्यास से नहीं, बल्कि आपके स्वभाव में
  rationale: मूल साक्ष्य की आदत/स्वभाव वाली तीखी तुलना को सहज आधुनिक हिन्दी में बनाए रखा गया है, बिना उसके आशय को किसी धर्मवैज्ञानिक निष्कर्ष में बदलने के।
- source_word: bonds
  choice: बेड़ियों
  rationale: यह सामान्य कठिनाई के बजाय वास्तविक बंदी अवस्था को स्पष्ट रूप से व्यक्त करता है।
- source_word: the whole multitude of you
  choice: आप सब
  rationale: समूचे समुदाय का भाव स्वाभाविक हिन्दी में व्यक्त होता है; ‘पूरी भीड़’ यहाँ अनावश्यक रूप से कठोर और असहज होता।
- source_word: imitators of God
  choice: परमेश्वर का अनुकरण करनेवाला
  rationale: ‘अनुकरण’ नैतिक और आचरणगत समानता का भाव देता है, बिना ईश्वरत्व में समानता का संकेत किए।
theological_decisions:
- issue: ‘परमेश्वर और यीशु मसीह की इच्छा’ में संबंध
  choice: परमेश्वर और यीशु मसीह की इच्छा से
  alternative: परमेश्वर, अर्थात् यीशु मसीह, की इच्छा से
  rationale: उपलब्ध साक्ष्य दोनों नामों को ‘और’ से जोड़ता है; अनुवाद ने उनकी पहचान या भिन्नता को व्याख्यात्मक ढंग से तय नहीं किया।
- issue: ‘मैंने महिमा की’ का कर्म
  choice: कर्म को अनकहा रखा गया
  alternative: मैंने परमेश्वर की महिमा की
  rationale: उपलब्ध गवाही में महिमा पानेवाले का नाम स्पष्ट रूप से नहीं दिया गया। संभावित आशय परमेश्वर है, पर उसे मुख्य पाठ में जोड़ना अस्पष्टता को मिटा देता।
- issue: अनुकरण का धर्मवैज्ञानिक आशय
  choice: परमेश्वर का अनुकरण करनेवाला
  alternative: परमेश्वर के समान
  rationale: यह वाक्य आचरण और सद्भावना में अनुकरण की बात करता है; अस्तित्वगत समानता का दावा अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक पत्र के अनुरूप रखी गई है। ‘बिशप’ ऐतिहासिक कलीसियाई पद के प्रचलित हिन्दी रूप के रूप में लिया गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी गवाही और मध्य-पाठ-परंपरा से ज्ञात वाक्यरचना पर आधारित है; प्रत्यक्ष यूनानी पाठ-समीक्षा अभी लंबित होने के कारण विशेषकर ‘मन’, ‘धीरज में अटल’ और ‘परमेश्वर-भक्त सद्भावना’ की शब्दावली को आगे सत्यापित किया जाना चाहिए।
