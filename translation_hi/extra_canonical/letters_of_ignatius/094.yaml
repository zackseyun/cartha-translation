base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/094.yaml
  text: 'Do not neglect widows. After the Lord, be their protector. Let nothing be done without your consent, and do nothing without God’s consent, as indeed you do not. Be steadfast.


    Let meetings be held more frequently. Seek out everyone by name.


    Do not despise enslaved people, whether men or women. Yet let them not in turn be puffed up, but let them serve even more faithfully for the glory of God, so that they may obtain a better freedom from God. Let them not seek to be freed at public expense, lest they be found to be servants of lust.'
translation:
  language: hi
  text: 'विधवाओं की उपेक्षा न होने दो। प्रभु के बाद उनके संरक्षक बनो। तुम्हारी सहमति के बिना कुछ न किया जाए; और तुम भी परमेश्वर के बिना कुछ न करो—जैसा कि तुम करते भी नहीं। दृढ़ बने रहो।


    सभाएँ अधिक बार हों। हर एक को नाम लेकर खोजो।


    दासों और दासियों को तुच्छ न समझो। फिर भी वे घमंड से न फूलें, बल्कि परमेश्वर की महिमा के लिए और भी निष्ठा से सेवा करें, ताकि वे परमेश्वर से उत्तम स्वतंत्रता पाएँ। वे साझे कोष से स्वतंत्र किए जाने की लालसा न रखें, कहीं ऐसा न हो कि वे लालसा के दास पाए जाएँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χήραι / “widows”
  choice: विधवाएँ
  rationale: सामाजिक रूप से असुरक्षित विधवा स्त्रियों का सीधा और स्वाभाविक आधुनिक हिन्दी पद।
- source_word: φροντιστής / “protector”
  choice: देखभाल करनेवाला
  rationale: शब्द में संरक्षण के साथ व्यावहारिक चिंता और देखरेख का भाव है; केवल ‘रक्षक’ इसे अनावश्यक रूप से सैन्य अर्थ दे सकता है।
- source_word: γνώμη / “consent”
  choice: सहमति
  rationale: यहाँ अगुवे की जानकारी मात्र नहीं, उसके अनुमोदन या सम्मति का भाव प्रमुख है।
- source_word: συναγωγαί / “meetings”
  choice: सभाएँ
  rationale: यह सामुदायिक एकत्रीकरण को दर्शाता है; बाद के किसी विशिष्ट संस्थागत अर्थ को आरोपित नहीं करता।
- source_word: ἐξ ὀνόματος πάντας ζήτει / “seek out all by name”
  choice: हर एक को नाम लेकर खोजो
  rationale: व्यक्तिगत पहचान और सक्रिय खोज-खबर दोनों को यथासंभव बनाए रखता है।
- source_word: δούλους καὶ δούλας / “male and female slaves”
  choice: दासों और दासियों
  rationale: प्राचीन दासता की वास्तविक स्थिति तथा दोनों लिंगों का स्पष्ट उल्लेख सुरक्षित रहता है।
- source_word: ἀπὸ τοῦ κοινοῦ / “at public cost”
  choice: सामुदायिक कोष से
  rationale: संदर्भ में साझा कलीसियाई निधि से मूल्य देकर दास-मुक्ति कराए जाने का संभावित आशय है; ‘सरकारी खर्च’ का आधुनिक भ्रम टलता है।
- source_word: ἐπιθυμία / “lust/desire”
  choice: लालसा
  rationale: यूनानी पद व्यापक अनियंत्रित इच्छा को सूचित कर सकता है; ‘वासना’ इसे केवल यौन अर्थ तक सीमित कर सकती है।
theological_decisions:
- issue: “प्रभु के बाद” में अधिकार और संरक्षण का संबंध
  choice: प्रभु के बाद तुम ही उनके देखभाल करनेवाले बनो
  alternative: प्रभु के समान उनके रक्षक बनो / प्रभु के अधीन उनके संरक्षक बनो
  rationale: ‘के बाद’ स्रोत की क्रमसूचक और कुछ हद तक अस्पष्ट अभिव्यक्ति को बनाए रखता है; यह न तो मनुष्य को प्रभु के समान ठहराता है, न पाठ में अनुपस्थित व्याख्या जोड़ता है।
- issue: “परमेश्वर की सहमति” का मानवीकरण
  choice: परमेश्वर की सहमति के बिना
  alternative: परमेश्वर की इच्छा के बिना
  rationale: समानांतर वाक्य-रचना को सुरक्षित रखा गया है। ‘इच्छा’ अर्थ स्पष्ट करती, पर स्रोत में प्रयुक्त समान धारणा की आलंकारिक तीक्ष्णता घटा देती।
- issue: “उत्तम स्वतंत्रता” का स्वरूप
  choice: परमेश्वर से उत्तम स्वतंत्रता पाएँ
  alternative: परमेश्वर से सच्ची आत्मिक स्वतंत्रता पाएँ
  rationale: पाठ स्वतंत्रता के स्वरूप को स्पष्ट नहीं करता। ‘आत्मिक’ जोड़ने से संभावित भाव समझ में आता, पर अस्पष्टता समय से पहले समाप्त हो जाती।
- issue: अंतिम “लालसा के दास” का अर्थ
  choice: लालसा के दास पाए जाएँ
  alternative: भोग-विलास के दास पाए जाएँ
  rationale: व्यापक नैतिक चेतावनी सुरक्षित रहती है और इसे केवल यौन या विलासी इच्छा तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। संबोधन एकवचन ‘तुम’ है, क्योंकि पत्र में निर्देश एक अगुवे को दिया गया है। प्राचीन दासता को नरम करने के बजाय ‘दास/दासी’ स्पष्ट रखा गया है। उपलब्ध प्रत्यक्ष आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी स्रोत-पाठ की पूर्ण समीक्षा अभी लंबित होने के कारण मसौदा सावधानीपूर्वक और वास्तविक अस्पष्टताओं को बनाए रखते हुए तैयार किया गया है।
