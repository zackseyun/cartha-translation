    especially if the Lord should reveal aught to me. Assemble yourselves together in common, every one of you severally, man by man, in grace, in one faith and one Jesus Christ, who after the flesh was of David''s race, who is Son of Man and Son of God, to the end that ye may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live for ever in Jesus Christ.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/021.yaml
  text: 'If Jesus Christ should count me worthy through your prayer, and if it should be God’s will, then in the second tract that I intend to write to you, I will further set before you the dispensation of which I have begun to speak, relating to the new man Jesus Christ. This consists in faith toward him and love toward him, in his passion and resurrection,


    especially if the Lord should reveal anything to me. Assemble yourselves together in common, each one of you severally, person by person, in grace, in one faith and one Jesus Christ, who according to the flesh was of David’s race, who is Son of Man and Son of God, so that you may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live forever in Jesus Christ.'
translation:
  language: hi
  text: 'यदि यीशु मसीह तुम्हारी प्रार्थना के द्वारा मुझे योग्य ठहराएँ और परमेश्वर की इच्छा हो, तो जिस दूसरी रचना को मैं तुम्हें लिखने का विचार करता हूँ, उसमें मैं उस प्रबंध को, जिसकी चर्चा मैंने आरम्भ की है, तुम्हारे सामने और विस्तार से रखूँगा—अर्थात् नए मनुष्य यीशु मसीह से संबंधित प्रबंध को। यह उन पर विश्वास करने और उनसे प्रेम करने में, उनके दुःखभोग और पुनरुत्थान में निहित है—विशेषकर यदि प्रभु मुझ पर कुछ प्रकट करें।


    तुम सब एक साथ इकट्ठे हो, तुममें से हर एक व्यक्ति अनुग्रह में, एक विश्वास में और एक यीशु मसीह में; वे शरीर के अनुसार दाऊद के वंश से थे और मनुष्य के पुत्र तथा परमेश्वर के पुत्र हैं—ताकि तुम बिना मन भटके बिशप और प्राचीनों की सभा की आज्ञा मानो और एक ही रोटी तोड़ो। वह रोटी अमरता की औषधि और वह प्रतिविष है जिसके द्वारा हम न मरें, बल्कि यीशु मसीह में सदा जीवित रहें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dispensation (Greek source review pending)
  choice: प्रबंध
  rationale: यहाँ उद्धार-इतिहास से संबंधित व्यवस्था या योजना का भाव है; ‘प्रबंध’ मूल साक्ष्य की व्यापकता बनाए रखता है और अत्यधिक व्याख्यात्मक ‘ईश्वरीय योजना’ से बचता है।
- source_word: new man
  choice: नया मनुष्य
  rationale: मानवता और मसीह-संबंधी धार्मिक तनाव को बनाए रखने के लिए अपेक्षाकृत औपचारिक पदावली चुनी गई है।
- source_word: passion
  choice: दुःखभोग
  rationale: यह यीशु की पीड़ा और मृत्यु से जुड़ा पारंपरिक धार्मिक अर्थ संक्षेप में और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: presbytery
  choice: प्राचीनों की सभा
  rationale: यह सामूहिक नेतृत्व-मंडल को दर्शाता है और आधुनिक ‘पुरोहिताई’ जैसे संप्रदायगत अर्थ आरोपित नहीं करता।
- source_word: medicine of immortality
  choice: अमरता की औषधि
  rationale: मूल रूपक की शक्ति और धार्मिक भाषा को यथासंभव सीधे सुरक्षित रखा गया है।
- source_word: antidote
  choice: मृत्यु से बचाने वाली दवा
  rationale: शाब्दिक ‘प्रतिविष’ हिंदी में विष की विशिष्ट धारणा जगा सकता है; यह चयन संदर्भित परिणाम को स्पष्ट रखते हुए औषधीय रूपक बनाए रखता है।
theological_decisions:
- issue: ‘एक रोटी’ और अमरता की औषधि का संबंध
  choice: दोनों वाक्यों को निकट रखकर रोटी को ही औषधि बताया गया है
  alternative: इसे सामान्य एकता या केवल प्रतीकात्मक भोजन के रूप में स्पष्ट करना
  rationale: पाठ की संस्कार-संबंधी भाषा और उसका वास्तविक धार्मिक तनाव बिना किसी संप्रदायगत व्याख्या के सुरक्षित रखा गया है।
- issue: यीशु की दाऊदी मानव वंशावली और दिव्य पुत्रता
  choice: ‘शरीर के अनुसार... मनुष्य के पुत्र और परमेश्वर के पुत्र’
  alternative: इन उपाधियों को व्याख्यात्मक रूप से ‘पूर्ण मनुष्य और पूर्ण परमेश्वर’ कहना
  rationale: साक्ष्य की समानांतर उपाधियों को जस का तस रखा गया है; बाद की सिद्धांतगत शब्दावली नहीं जोड़ी गई।
- issue: बिशप और प्राचीनों की सभा की आज्ञाकारिता
  choice: ऐतिहासिक पदों और सामूहिक संरचना को सीधे प्रस्तुत किया गया है
  alternative: ‘कलीसिया के नेताओं’ जैसा सामान्यीकरण
  rationale: विशिष्ट प्रारंभिक कलीसियाई संरचना को मिटाए बिना आधुनिक पाठक के लिए समझने योग्य बनाया गया है।
- issue: ‘हम मरें नहीं’ का अर्थ
  choice: मृत्यु और अनन्त जीवन की भाषा को बिना सीमित किए रखा गया है
  alternative: इसे केवल आत्मिक मृत्यु या केवल शारीरिक पुनरुत्थान के रूप में समझाना
  rationale: मूल कथन की जानबूझकर व्यापक धार्मिक गुंजाइश सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सार्वजनिक-पाठ योग्य शैली। ‘बिशप’ ऐतिहासिक पद के परिचित रूप में रखा गया है; ‘प्राचीनों की सभा’ presbytery की सामूहिकता स्पष्ट करती है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण अनिश्चित स्थानों पर अत्यधिक निश्चित या संप्रदायगत शब्दावली से बचा गया है।
