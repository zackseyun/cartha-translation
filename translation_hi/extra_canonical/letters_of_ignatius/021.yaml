- from: 'यदि यीशु मसीह तुम्हारी प्रार्थना के द्वारा मुझे योग्य समझें और परमेश्वर की इच्छा हो, तो जिस दूसरी रचना को मैं तुम्हारे लिए लिखने का विचार रखता हूँ, उसमें मैं उस प्रबंध को और विस्तार से तुम्हारे सामने रखूँगा जिसकी चर्चा मैंने आरम्भ की है—नए मनुष्य यीशु मसीह से संबंधित प्रबंध को। यह उन पर विश्वास और उनसे प्रेम करने में, और उनके दुःखभोग तथा पुनरुत्थान में निहित है—


