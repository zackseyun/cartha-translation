base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/031.yaml
  text: 'Do not be led astray by strange teachings or by ancient fables, which are useless. For if we still live according to Judaism even to this day, we admit that we have not received grace.


    For the divine prophets lived after Christ Jesus. For this reason they were also persecuted, being inspired by his grace, so that those who are disobedient might be fully convinced that there is one God, who manifested himself through Jesus Christ his Son. He is his Word who proceeded from silence and who in every way was well-pleasing to the one who sent him.'
translation:
  language: hi
  text: 'न तो विचित्र शिक्षाओं के बहकावे में आओ, न पुरानी और निष्फल कथाओं के। क्योंकि यदि हम आज तक यहूदी रीति के अनुसार जीवन बिताते हैं, तो हम मानते हैं कि हमने अनुग्रह पाया ही नहीं।


    क्योंकि परमेश्वर के भविष्यद्वक्ता मसीह यीशु के अनुसार जीवन बिताते थे।[a] इसी कारण उन्हें सताया भी गया। वे उसके अनुग्रह से प्रेरित थे, ताकि आज्ञा न माननेवालों को पूरा विश्वास हो जाए कि परमेश्वर एक ही है। उसने अपने पुत्र यीशु मसीह के द्वारा अपने आपको प्रकट किया। वही उसका वचन है, जो मौन से प्रकट हुआ,[b] और जिसने हर बात में अपने भेजनेवाले को प्रसन्न किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से उपलब्ध साक्ष्य का भाव ‘मसीह यीशु के अनुसार जीते थे’ है; कुछ पुराने अनुवाद इसे ‘मसीह यीशु के बाद’ कहते हैं, पर यहाँ कालक्रम नहीं, मसीह के अनुरूप जीवन अभिप्रेत जान पड़ता है।
    reason: स्रोत-साक्ष्य की कठिन और संभावित रूप से भ्रामक अभिव्यक्ति को पारदर्शी बनाना।
  - marker: b
    text: ‘मौन से प्रकट हुआ’ एक रहस्यमय अभिव्यक्ति है। यह संभवतः परमेश्वर के वचन के प्रकट होने की ओर संकेत करती है, पर यहाँ ‘मौन’ का ठीक आशय स्पष्ट नहीं किया गया है।
    reason: मूल की वास्तविक धर्मवैचारिक और अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἑτεροδοξίαις / strange doctrines
  choice: विचित्र शिक्षाओं
  rationale: यह अभिव्यक्ति ऐसी शिक्षाओं का संकेत देती है जो स्वीकृत प्रेरितीय संदेश से भिन्न हैं; ‘विचित्र’ अर्थ को स्पष्ट रखते हुए अत्यधिक सांप्रदायिक शब्दावली से बचता है।
- source_word: παλαιοῖς μύθοις / antiquated fables
  choice: पुरानी ... कथाओं
  rationale: ‘कथाएँ’ आधुनिक पाठक के लिए स्वाभाविक है; ‘निष्फल’ के साथ मिलकर इनके निरर्थक होने का भाव सुरक्षित रहता है।
- source_word: Ἰουδαϊσμόν / Judaism
  choice: यहूदी रीति
  rationale: संदर्भ में केवल जातीय पहचान नहीं, बल्कि धार्मिक जीवन-पद्धति अभिप्रेत है; ‘यहूदी रीति’ इसे सहज हिंदी में व्यक्त करता है।
- source_word: χάριν / grace
  choice: अनुग्रह
  rationale: आरंभिक मसीही धार्मिक संदर्भ का स्थापित और व्यापक हिंदी पद।
- source_word: λόγος / Word
  choice: वचन
  rationale: ‘लोगोस’ के व्यक्तिवाचक और प्रकाशन-संबंधी अर्थ को सुरक्षित रखने वाला प्रचलित बाइबलीय पद।
- source_word: ἀπὸ σιγῆς προελθών / proceeded from silence
  choice: मौन से प्रकट हुआ
  rationale: रहस्यमय मूल कथन को किसी विशिष्ट दार्शनिक व्याख्या में बाँधे बिना स्वाभाविक हिंदी में रखा गया है।
theological_decisions:
- issue: भविष्यद्वक्ताओं का ‘मसीह यीशु के बाद/अनुसार’ जीना
  choice: मसीह यीशु के अनुसार जीवन बिताते थे
  alternative: मसीह यीशु के बाद जीवन बिताते थे
  rationale: कालक्रम की दृष्टि से भविष्यद्वक्ता यीशु के पृथ्वी पर आगमन से पहले थे। उपलब्ध यूनानी परंपरा में κατά का भाव ‘के अनुसार’ या ‘के अनुरूप’ हो सकता है; इसीलिए अर्थ को मसीह-केंद्रित जीवन के रूप में रखा गया और पाठगत कठिनाई फुटनोट में बताई गई।
- issue: एक परमेश्वर का आत्म-प्रकटीकरण
  choice: उसने अपने पुत्र यीशु मसीह के द्वारा अपने आपको प्रकट किया
  alternative: जो अपने पुत्र यीशु मसीह के द्वारा प्रकट हुआ
  rationale: यह रचना परमेश्वर को कर्ता और पुत्र को प्रकटीकरण का माध्यम बताती है; हिंदी में कर्ता स्पष्ट करने से वाक्य स्वाभाविक होता है, बिना त्रिएकता-संबंधी तनाव को मिटाए।
- issue: वचन का मौन से निकलना
  choice: वही उसका वचन है, जो मौन से प्रकट हुआ
  alternative: वही उसका वचन है, जो मौन से निकला
  rationale: अस्पष्ट और धर्मवैचारिक रूप से तनावपूर्ण कथन को बनाए रखा गया है। ‘प्रकट हुआ’ संदर्भ में सहज है, पर ‘मौन’ की प्रकृति की व्याख्या नहीं करता।
- issue: सर्वनाम ‘उसके अनुग्रह’ का संदर्भ
  choice: उसके अनुग्रह
  alternative: मसीह यीशु के अनुग्रह
  rationale: मूल की सर्वनामगत संरचना और उसकी संभावित संदर्भ-अस्पष्टता को बनाए रखा गया है; निकटतम पूर्वपद मसीह यीशु है, पर अनावश्यक स्पष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। वाक्य अपेक्षाकृत छोटे रखे गए हैं। ‘आज्ञा न माननेवाले’, ‘अनुग्रह’, ‘भविष्यद्वक्ता’ और ‘वचन’ जैसे परिचित बाइबलीय पद बनाए गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण कठिन स्थानों पर दावे सावधानी से और फुटनोट सहित रखे गए हैं।
