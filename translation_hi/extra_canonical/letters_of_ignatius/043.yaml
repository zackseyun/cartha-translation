base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/043.yaml
  text: 'I have many profound thoughts in God, but I keep myself within proper bounds, so that I do not perish through my boasting. For now I must be even more afraid and must not listen to those who would puff me up, because those who say such things to me are a scourge to me.


    For although I desire to suffer, I do not know whether I am worthy. The envy of the devil is indeed unseen by many, but it wages an even fiercer war against me. Therefore, I long for gentleness, by which the ruler of this world is brought to nothing.'
translation:
  language: hi
  text: 'परमेश्वर में मेरे मन में बहुत-सी गहरी बातें हैं; फिर भी मैं अपनी सीमा पहचानता हूँ, कहीं ऐसा न हो कि अपने घमंड के कारण नाश हो जाऊँ। क्योंकि इस समय मुझे और भी अधिक सावधान रहना चाहिए और उन लोगों की बात पर ध्यान नहीं देना चाहिए जो मुझे फुलाकर घमंडी बनाना चाहते हैं; क्योंकि जो लोग मुझसे ऐसी बातें कहते हैं, वे मेरे लिए कोड़े के समान हैं।


    यद्यपि मैं दुःख सहना चाहता हूँ, फिर भी मैं नहीं जानता कि मैं इसके योग्य हूँ या नहीं। शैतान की ईर्ष्या बहुतों को दिखाई नहीं देती, पर वह मेरे विरुद्ध और भी भयंकर युद्ध करती है। इसलिए मैं नम्र कोमलता की लालसा करता हूँ, जिसके द्वारा इस संसार का शासक निष्प्रभावी कर दिया जाता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है; मध्य-पाठ-परंपरा के यूनानी स्रोत से प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: उपलब्ध सामग्री स्पष्टतः बताती है कि प्रत्यक्ष यूनानी समीक्षा लंबित है; इसलिए स्रोत-आधार की सीमा पाठक के सामने पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: deep thoughts in God
  choice: परमेश्वर में मेरे मन में बहुत-सी गहरी बातें हैं
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की रहस्यात्मक गहराई और ‘in God’ संबंध को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है; यूनानी समीक्षा लंबित होने के कारण अर्थ को अधिक विशिष्ट नहीं बनाया गया।
- source_word: take the measure of myself
  choice: मैं अपनी सीमा पहचानता हूँ
  rationale: आत्म-संयम और अपने वास्तविक स्तर के आकलन—दोनों भावों को संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
- source_word: puff me up
  choice: मुझे फुलाकर घमंडी बनाना
  rationale: मूल रूपक को कुछ हद तक सुरक्षित रखते हुए उसका आशय सामान्य पाठक के लिए स्पष्ट किया गया है।
- source_word: scourge
  choice: कोड़े के समान
  rationale: कठोर हानि और अनुशासनकारी पीड़ा का चित्र बनाए रखा गया है, बिना इसे केवल रूपकात्मक ‘कष्ट’ में कम किए।
- source_word: gentleness
  choice: नम्र कोमलता
  rationale: ‘कोमलता’ अकेले निष्क्रिय दुर्बलता का संकेत दे सकती है; ‘नम्र’ जोड़ने से विनय, संयम और सौम्यता का व्यापक नैतिक भाव आता है।
- source_word: brought to nought
  choice: निष्प्रभावी कर दिया जाता है
  rationale: पूर्ण अस्तित्व-विनाश के बजाय शक्ति और कार्यक्षमता के निष्फल किए जाने का भाव देता है, जो प्रसंग में अधिक सावधान अनुवाद है।
theological_decisions:
- issue: ‘परमेश्वर में’ गहरे विचारों का अर्थ
  choice: वाक्य को जानबूझकर व्यापक रखा गया है
  alternative: परमेश्वर के विषय में गहरे विचार / परमेश्वर से प्राप्त रहस्य
  rationale: उपलब्ध साक्ष्य ‘in God’ की संबंधात्मक अस्पष्टता रखता है; इसे विषय-वस्तु या विशेष प्रकाशन मानकर सीमित करना उचित नहीं।
- issue: दुःख सहने की योग्यता
  choice: ‘मैं इसके योग्य हूँ या नहीं’
  alternative: मैं शहादत के योग्य हूँ या नहीं
  rationale: प्रसंग शहादत की ओर संकेत कर सकता है, पर दिए गए पाठ में सामान्य ‘suffer’ है; अतः संप्रदायगत या ऐतिहासिक निष्कर्ष को मुख्य पाठ में नहीं जोड़ा गया।
- issue: इस संसार के शासक की पहचान
  choice: उपाधि को यथावत रखा गया
  alternative: शैतान
  rationale: पहले वाक्य में शैतान का उल्लेख होने पर भी उपाधि की अलग अभिव्यक्ति और उसकी धर्मवैचारिक प्रतिध्वनि संरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य-विन्यास मूल की आत्मपरीक्षणात्मक तीव्रता और धर्मवैचारिक तनाव को बनाए रखता है। ‘नम्र कोमलता’ तथा ‘निष्प्रभावी’ जैसे पद सहजता और अर्थगत सावधानी के बीच संतुलन रखते हैं।
