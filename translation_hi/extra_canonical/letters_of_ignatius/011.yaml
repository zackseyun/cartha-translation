base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/011.yaml
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance, that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
translation:
  language: hi
  text: 'और शेष सभी लोगों के लिए भी निरन्तर प्रार्थना करते रहो, क्योंकि उनके लिए मन फिराने की आशा है, ताकि वे परमेश्वर को पा सकें। इसलिए उन्हें कम-से-कम तुम्हारे कामों से शिक्षा लेने दो।


    उनके क्रोध के सामने तुम नम्र रहो; उनकी डींग भरी बातों के सामने दीन बनो; उनकी निन्दाओं के उत्तर में प्रार्थना करो; उनके भटकाव के सामने विश्वास में दृढ़ रहो; उनकी उग्रता के सामने कोमल रहो। बदले में उनके जैसे बनने की कोशिश मत करो।


    अपनी सहनशीलता से हम उनके भाई सिद्ध हों। पर हम प्रभु का अनुकरण करने के लिए उत्सुक रहें और इस बात में एक-दूसरे से आगे बढ़ें कि कौन अधिक अन्याय सहे, कौन अधिक ठगा जाए, और किसे तुच्छ समझा जाए। तब तुममें शैतान का कोई अंकुर[a] नहीं पाया जाएगा। इसके बजाय, पूरी शुद्धता और आत्म-संयम के साथ शरीर और आत्मा दोनों से मसीह यीशु में बने रहो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शैतान का कोई पौधा” या “वनस्पति।” यहाँ बुराई के जड़ पकड़ने और बढ़ने का रूपक है।
    reason: ‘अंकुर’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी मूल यूनानी रूपक की ठोस शब्दावली दिखाती है।
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: निरन्तर
  rationale: क्रियाविशेषण का अर्थ लगातार अथवा बिना रुके है; आधुनिक हिन्दी में ‘निरन्तर प्रार्थना करते रहो’ स्वाभाविक और गरिमापूर्ण है।
- source_word: μετανοίας
  choice: मन फिराने
  rationale: यह केवल पछतावे नहीं, बल्कि मन और दिशा के परिवर्तन को व्यक्त करता है; ‘मन फिराना’ धार्मिक अर्थ को स्पष्ट रखते हुए सामान्य पाठक के लिए बोधगम्य है।
- source_word: θεοῦ τύχωσιν
  choice: परमेश्वर को पा सकें
  rationale: τύχωσιν में प्राप्त करने या पहुँचने का भाव है; ‘पा सकें’ स्रोत की संक्षिप्तता और खुले अर्थ को बनाए रखता है।
- source_word: μαθητευθῆναι
  choice: शिक्षा लेने
  rationale: रूप में सीखने अथवा शिष्य बनाए जाने का भाव हो सकता है। यहाँ कर्मों से सीखने का प्रसंग है, इसलिए किसी औपचारिक धार्मिक प्रक्रिया को अनावश्यक रूप से आरोपित किए बिना ‘शिक्षा लेने’ चुना गया।
- source_word: βλασφημίας
  choice: निन्दाओं
  rationale: यह अपमानजनक या निन्दात्मक वाणी को दर्शाता है; ‘निन्दा’ केवल सामान्य गाली से अधिक व्यापक और स्रोत के निकट है।
- source_word: ἀντιμιμήσασθαι
  choice: बदले में उनके जैसे बनने
  rationale: शब्द में प्रत्युत्तर के रूप में अनुकरण करने का भाव है। यह अनुवाद प्रतिशोध और अनुकरण दोनों पहलुओं को सहज हिन्दी में रखता है।
- source_word: ἐπιεικείᾳ
  choice: सहनशीलता
  rationale: शब्द नम्र उदारता, धैर्य और कठोर अधिकार न जताने का भाव रखता है; विरोधियों के प्रति व्यवहार के इस संदर्भ में ‘सहनशीलता’ उपयुक्त है।
- source_word: βοτάνη
  choice: अंकुर
  rationale: मूल शब्द पौधे या वनस्पति को दर्शाता है। रूपक को बनाए रखते हुए ‘अंकुर’ हिन्दी में भीतर जड़ पकड़ती बुराई का सजीव बोध देता है।
- source_word: σωφροσύνῃ
  choice: आत्म-संयम
  rationale: इसमें संयमित, विवेकपूर्ण और अनुशासित जीवन का अर्थ है; ‘आत्म-संयम’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: σαρκικῶς καὶ πνευματικῶς
  choice: शरीर और आत्मा दोनों से
  rationale: यह शारीरिक और आत्मिक—दोनों आयामों में बने रहने को दर्शाता है; हिन्दी में क्रियाविशेषणों की अपेक्षा यह संरचना अधिक स्वाभाविक है।
theological_decisions:
- issue: ἔστιν γὰρ ἐν αὐτοῖς ἐλπὶς μετανοίας का आशय
  choice: उनके लिए मन फिराने की आशा है
  alternative: उनमें मन फिराने की आशा है
  rationale: ग्रीक वाक्यांश शाब्दिक रूप से ‘उनमें’ कह सकता है, पर आशा का लक्ष्य उनका मन फिराना है। ‘उनके लिए’ स्वाभाविक हिन्दी है और यह दावा नहीं करता कि पश्चात्ताप पहले से उनके भीतर सक्रिय है।
- issue: μαθητευθῆναι में शिष्यत्व का भाव
  choice: तुम्हारे कामों से शिक्षा लेने दो
  alternative: तुम्हारे कामों से शिष्य बनने दो
  rationale: मध्य/कर्मवाच्य रूप में शिष्य बनाए जाने का अर्थ सम्भव है, पर तत्काल बल विश्वासियों के आचरण से सीखने पर है। चुना गया पाठ सम्प्रदायगत शिष्यत्व-प्रक्रिया आरोपित नहीं करता।
- issue: अन्याय सहने की प्रतिस्पर्धात्मक भाषा
  choice: इस बात में एक-दूसरे से आगे बढ़ें कि कौन अधिक अन्याय सहे...
  alternative: देखें कि कौन अधिक अन्याय सहे...
  rationale: मूल की उत्साही और चुनौतीपूर्ण वक्तृता को सुरक्षित रखा गया है। इसे निष्क्रिय आत्म-हानि की आज्ञा या अत्याचार खोजने की शिक्षा के रूप में विस्तार नहीं दिया गया।
- issue: ‘शैतान का अंकुर’ रूपक
  choice: रूपक को मुख्य पाठ में बनाए रखना
  alternative: शैतान की कोई बुराई
  rationale: मूल का पौधा-संबंधी रूपक जानबूझकर तीखा है; सामान्यीकृत ‘बुराई’ उसका चित्रात्मक तनाव मिटा देता।
- issue: ‘शरीर और आत्मा दोनों से’
  choice: मानवीय जीवन के दोनों आयामों को समान रूप से रखना
  alternative: शारीरिक और आत्मिक रूप से
  rationale: पाठ शरीर को आत्मा से हीन या त्याज्य नहीं बताता; दोनों में मसीह में बने रहने की बात करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में बहुवचन संबोधन रखा गया है। समानान्तर वाक्यरचना और नैतिक आग्रह की तीव्रता को सुरक्षित रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। मसौदा मध्य-पाठपरम्परा के उपलब्ध यूनानी पाठ के शब्दार्थ से मिलान करके तैयार किया गया है; फिर भी औपचारिक पाण्डुलिपि-आलोचनात्मक समीक्षा अपेक्षित है।
