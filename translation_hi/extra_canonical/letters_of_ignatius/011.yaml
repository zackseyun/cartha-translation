  verdict: revise
  source_fidelity: 'The draft conveys the exhortation and its parallel contrasts well. Two details need adjustment: βοτάνη is a plant/herb rather than specifically an ‘अंकुर,’ and the final purpose clause should not be rendered as a consequential future (‘तब ... नहीं पाया जाएगा’). ‘प्रत्युत्तर में उनके जैसे बनने’ better retains the reciprocal force of ἀντιμιμήσασθαι than ‘बदले में’ alone.'
  naturalness: The Hindi is generally clear and appropriately dignified. ‘अहंकार भरी बातें,’ ‘प्रत्युत्तर में,’ and ‘अपने को उनका भाई दिखाएँ’ are natural modern-standard formulations while retaining the rhetorical parallelism.
  terminology: ‘मन फिराना,’ ‘परमेश्वर,’ ‘विश्वास,’ ‘मसीह यीशु,’ and ‘आत्म-संयम’ are suitable and do not over-specify disputed theological implications. ‘पौधा’ preserves the concrete botanical image without narrowing it to a shoot.
  issues:
  - severity: medium
    issue: ‘शैतान का कोई अंकुर’ narrows the botanical noun.
    rationale: βοτάνη denotes a plant or herb; an अंकुर is specifically a sprout/shoot. ‘पौधा’ preserves the source image more directly.
  - severity: medium
    issue: ‘तब तुममें ... नहीं पाया जाएगा’ changes the clause’s purpose-oriented force.
    rationale: The source has a ‘that no herb of the devil may be found in you’ construction. ‘ताकि ... न पाया जाए’ retains this relation without adding a temporal/consequential assertion.
  - severity: low
    issue: ‘बदले में’ can sound primarily retaliatory rather than reciprocal.
    rationale: Adding ‘प्रत्युत्तर में’ makes clear that the warning concerns responding by imitating opponents’ conduct.
