  english_witness: The Ephesians from Smyrna salute you, from whence also I write to you. They are here with me for the glory of God, as also are ye; and they have comforted me in all things, together with Polycarp bishop of the Smyrnaeans. Yea, and all the other churches salute you in the honor of Jesus Christ. Fare ye well in godly concord, and possess ye a steadfast spirit, which is Jesus Christ.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/038.yaml
  text: The Ephesians in Smyrna greet you; I am also writing to you from here. They are here with me for the glory of God, as you also are, and they have comforted me in every way, together with Polycarp, bishop of the Smyrnaeans. Yes, and all the other churches greet you in the honor of Jesus Christ. Farewell in godly harmony, and possess a steadfast spirit, which is Jesus Christ.
translation:
  language: hi
  text: स्मुरना में रहनेवाले इफिसुस के विश्वासी आपको नमस्कार कहते हैं; मैं भी यहीं से आपको लिख रहा हूँ। वे परमेश्वर की महिमा के लिए मेरे साथ यहाँ हैं, जैसे आप भी हैं। उन्होंने स्मुरना के बिशप पोलिकार्प के साथ मिलकर हर प्रकार से मुझे सांत्वना दी है। हाँ, और दूसरी सभी कलीसियाएँ भी यीशु मसीह के सम्मान में आपको नमस्कार कहती हैं। परमेश्वर के अनुरूप मेल में बने रहते हुए विदा लें, और उस अटल आत्मा को थामे रहें, जो यीशु मसीह है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: The Ephesians from Smyrna
  choice: स्मुरना में रहनेवाले इफिसुस के विश्वासी
  rationale: वाक्य में लोग इफिसुस के हैं पर उस समय स्मुरना में उपस्थित हैं; इस संबंध को सहज हिन्दी में स्पष्ट किया गया है।
- source_word: bishop
  choice: बिशप
  rationale: आरंभिक कलीसियाई पदनाम के लिए आधुनिक हिन्दी पाठकों में प्रचलित और अपेक्षाकृत तटस्थ शब्द।
- source_word: godly concord
  choice: परमेश्वर के अनुरूप मेल
  rationale: ‘godly’ को केवल सामान्य धार्मिकता न बनाकर परमेश्वर-संबंधी मानक से जोड़ा गया और ‘concord’ को स्वाभाविक हिन्दी ‘मेल’ से व्यक्त किया गया।
- source_word: possess ye a steadfast spirit
  choice: उस अटल आत्मा को थामे रहें
  rationale: ‘possess’ के कठोर स्वामित्व-बोध से बचते हुए निरंतर धारण करने का भाव रखा गया; अगले संबंधवाचक वाक्य के कारण निश्चितता-सूचक ‘उस’ जोड़ा गया।
- source_word: which is Jesus Christ
  choice: जो यीशु मसीह है
  rationale: साक्ष्य की साहसपूर्ण पहचान को व्याख्यात्मक रूप से नरम किए बिना यथावत रखा गया।
theological_decisions:
- issue: ‘अटल आत्मा’ और यीशु मसीह की पहचान
  choice: जो यीशु मसीह है
  alternative: जो यीशु मसीह से मिलता है / अर्थात यीशु मसीह का आत्मा
  rationale: उपलब्ध साक्ष्य सीधी पहचान प्रस्तुत करता है। संभावित रूपक या अर्थ-विस्तार को अनुवाद में आरोपित नहीं किया गया।
- issue: कलीसियाई पदनाम episkopos/bishop
  choice: बिशप
  alternative: अध्यक्ष / निरीक्षक
  rationale: दिए गए अंग्रेज़ी साक्ष्य में संस्थागत पदनाम है; ‘बिशप’ ऐतिहासिक पहचान बनाए रखता है, जबकि विकल्प पद के स्वरूप की व्याख्या कर सकते हैं।
- issue: ‘परमेश्वर की महिमा के लिए’ उपस्थित होना
  choice: परमेश्वर की महिमा के लिए मेरे साथ यहाँ हैं
  alternative: परमेश्वर की महिमा में मेरे साथ हैं
  rationale: साक्ष्य का उद्देश्यसूचक ‘for’ रखा गया; रहस्यात्मक सहभागिता का अतिरिक्त अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, पत्रात्मक और सामान्य पाठक के लिए सुबोध शैली। उपलब्ध आधार प्रत्यक्ष यूनानी पाठ नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए मसौदा अस्थायी है और यूनानी स्रोत-समीक्षा के बाद शब्दावली, विशेषतः अंतिम वाक्य, पुनः जाँची जानी चाहिए।
