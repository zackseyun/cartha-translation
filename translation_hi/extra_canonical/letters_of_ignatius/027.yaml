base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/027.yaml
  text: Therefore, it is right that we should not only be called Christians but also be Christians. In the same way, some people have the bishop’s name on their lips but act apart from him in everything. Such people do not seem to me to maintain a good conscience, because they do not assemble together lawfully according to the commandment.
translation:
  language: hi
  text: इसलिए उचित है कि हम केवल मसीही कहलाएँ ही नहीं, बल्कि वास्तव में मसीही हों। इसी प्रकार कुछ लोग बिशप का नाम तो लेते हैं, पर हर बात में उससे अलग होकर चलते हैं। मुझे नहीं लगता कि ऐसे लोग शुद्ध विवेक बनाए रखते हैं, क्योंकि वे आज्ञा के अनुसार विधिपूर्वक एकत्र नहीं होते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; मध्य-पाठ-परंपरा के यूनानी पाठ से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: प्रदत्त स्रोत-विवरण के अनुसार यूनानी स्रोत-भाषा की समीक्षा लंबित है; इसलिए पाठगत निश्चितता की सीमा पारदर्शी करना आवश्यक है।
lexical_decisions:
- source_word: Christians
  choice: मसीही
  rationale: आधुनिक मानक हिन्दी में स्वाभाविक और व्यापक रूप से समझा जाने वाला पद; कहलाने और वास्तव में होने के विरोध को स्पष्ट रखता है।
- source_word: bishop
  choice: बिशप
  rationale: आरंभिक कलीसियाई पद के लिए प्रचलित, तटस्थ हिन्दी रूप; स्रोत में विद्यमान पद-संबंधी विशिष्टता को सामान्य शब्द में विलीन नहीं करता।
- source_word: keep a good conscience
  choice: शुद्ध विवेक बनाए रखते हैं
  rationale: नैतिक अंतःचेतना और उसके निरंतर संरक्षण—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: lawfully according to commandment
  choice: आज्ञा के अनुसार विधिपूर्वक
  rationale: आज्ञा तथा मान्य/व्यवस्थित रीति, दोनों तत्वों को बनाए रखता है; अस्पष्ट रूप से यह निर्धारित नहीं करता कि कौन-सी विशिष्ट आज्ञा अभिप्रेत है।
theological_decisions:
- issue: नाममात्र के मसीही होने और वास्तविक आचरण का विरोध
  choice: केवल मसीही कहलाएँ ही नहीं, बल्कि वास्तव में मसीही हों
  alternative: केवल मसीही नाम न धारण करें, बल्कि वैसे हों भी
  rationale: मूल तर्क की नैतिक तीक्ष्णता को स्पष्ट रखते हुए कोई अतिरिक्त उद्धार-सिद्धांत नहीं जोड़ता।
- issue: बिशप से अलग होकर कार्य करने का आशय
  choice: हर बात में उससे अलग होकर चलते हैं
  alternative: हर काम उसके बिना करते हैं
  rationale: यह अनुवाद संबंध-विच्छेद/स्वतंत्र आचरण की व्यापकता बनाए रखता है, पर बिशप की भूमिका या अधिकार की सीमा को स्रोत से अधिक परिभाषित नहीं करता।
- issue: सभा की वैधता का आधार
  choice: आज्ञा के अनुसार विधिपूर्वक एकत्र नहीं होते
  alternative: आज्ञा के अनुरूप मान्य रीति से सभा नहीं करते
  rationale: स्रोत की कलीसियाई व्यवस्था संबंधी बात को सुरक्षित रखता है, किंतु उस आज्ञा की पहचान या बाद की किसी संप्रदायगत व्यवस्था को पाठ में आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘बिशप’ को ऐतिहासिक कलीसियाई पदनाम के रूप में रखा गया है। वाक्य-संरचना में नाम और वास्तविक आचरण के बीच का विरोध प्रमुख है; किसी विशिष्ट संप्रदाय की पदानुक्रम-संबंधी व्याख्या नहीं जोड़ी गई।
