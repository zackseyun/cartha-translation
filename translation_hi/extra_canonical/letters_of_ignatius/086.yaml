base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/086.yaml
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
translation:
  language: hi
  text: '10 आपने अच्छा किया कि फिलोन और राइउस अगाथोपुस को—जो परमेश्वर के कार्य के लिए मेरे साथ चले—[मसीह] परमेश्वर के सेवकों के रूप में ग्रहण किया। वे भी तुम्हारे लिए प्रभु को धन्यवाद देते हैं, क्योंकि तुमने हर प्रकार से उन्हें नया बल दिया। तुम्हारे लिए कुछ भी व्यर्थ नहीं जाएगा।


    मेरा प्राण तुम्हारे लिए समर्पित है, और मेरी बेड़ियाँ भी; तुमने न तो उनका तिरस्कार किया, न उनसे लज्जित हुए। और जो सिद्ध विश्वासयोग्यता है—अर्थात यीशु मसीह—वह भी तुमसे लज्जित न होगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है; मध्य-पाठरूप की यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष समीक्षा अभी लंबित है। मुख्य पाठ में [मसीह] के वर्ग-कोष्ठक उसी साक्ष्य के पाठ-पुनर्स्थापन संकेत को सुरक्षित रखते हैं।
    reason: प्रत्यक्ष यूनानी समीक्षा के अभाव और वर्ग-कोष्ठक वाले अनिश्चित/पुनर्स्थापित पाठ के विषय में पाठक को पारदर्शी सूचना देना आवश्यक है।
lexical_decisions:
- source_word: Philo and Rhaius Agathopus
  choice: फिलोन और राइउस अगाथोपुस
  rationale: व्यक्तिनामों को प्रचलित विद्वत्तापूर्ण ध्वन्यंतरण के निकट रखते हुए देवनागरी में प्रस्तुत किया गया है।
- source_word: in the cause of God
  choice: परमेश्वर के कार्य के लिए
  rationale: अंग्रेज़ी साक्ष्य के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
- source_word: receive
  choice: ग्रहण किया
  rationale: यहाँ केवल आतिथ्य नहीं, बल्कि स्वागत और स्वीकार—दोनों अर्थ सम्भव हैं; ‘ग्रहण’ उस व्यापकता को बनाए रखता है।
- source_word: ministers
  choice: सेवकों
  rationale: धार्मिक सेवा का भाव रखता है, पर किसी निश्चित कलीसियाई पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: refreshed
  choice: नया बल दिया
  rationale: शारीरिक, भावनात्मक और आतिथ्य-संबंधी सहायता के व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: My spirit is devoted for you
  choice: मेरा प्राण तुम्हारे लिए समर्पित है
  rationale: भक्ति और आत्म-समर्पण की प्रबल अभिव्यक्ति को बनाए रखता है; ‘आत्मा’ की अपेक्षा ‘प्राण’ यहाँ मुहावरेदार और व्यक्तिगत है।
- source_word: bonds
  choice: बेड़ियाँ
  rationale: कैद की ठोस दशा और उसके कारण सहन किए जा रहे बंधन को स्पष्ट रखता है।
- source_word: perfect faithfulness
  choice: सिद्ध विश्वासयोग्यता
  rationale: अमूर्त संज्ञात्मक रूप को जानबूझकर सुरक्षित रखा गया है, क्योंकि साक्ष्य में मसीह को विश्वासयोग्यता की पूर्ण अभिव्यक्ति के रूप में कहा गया है।
theological_decisions:
- issue: ‘[Christ] God’ में पाठ-पुनर्स्थापन और मसीह/परमेश्वर का संबंध
  choice: '[मसीह] परमेश्वर'
  alternative: मसीह के परमेश्वर / मसीह-परमेश्वर
  rationale: आपूर्ति किए गए साक्ष्य के वर्ग-कोष्ठक को पाठ-पुनर्स्थापन संकेत के रूप में हूबहू सुरक्षित रखा गया है; हिन्दी में संबंध को किसी एक धर्मवैज्ञानिक व्याख्या से नहीं बाँधा गया।
- issue: ‘he who is perfect faithfulness’ की पहचान
  choice: जो सिद्ध विश्वासयोग्यता है—अर्थात यीशु मसीह
  alternative: जो पूर्णतः विश्वासयोग्य है, यीशु मसीह
  rationale: साक्ष्य की असामान्य और धर्मवैज्ञानिक रूप से सघन संज्ञात्मक भाषा को सामान्य विशेषण में समतल नहीं किया गया।
- issue: भविष्यकालीन प्रतिफल की उक्ति
  choice: तुम्हारे लिए कुछ भी व्यर्थ नहीं जाएगा
  alternative: तुम्हारा कुछ भी खोया न जाएगा
  rationale: कथन को कर्म-आधारित उद्धार के व्यवस्थित सिद्धांत में बदले बिना उनके आतिथ्य और सेवा के अप्रतिफलित न रहने का आश्वासन दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल और सामुदायिक पत्र-शैली वाला रूप अपनाया गया है। बहुवचन संबोधन के लिए ‘तुम’ रखा गया है, जिससे आत्मीयता बनी रहती है। पाठ के असामान्य धर्मवैज्ञानिक वाक्यांशों को सहज बनाने के नाम पर मिटाया नहीं गया; जहाँ स्रोत-समीक्षा लंबित है वहाँ निर्णय संयमित रखे गए हैं।
