source:
  text: 'I salute the households of my brethren with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, saluteth you.


    I salute the household of Tavia, and I pray that she may be grounded in faith and love both of flesh and of spirit. I salute Alce, a name very dear to me, and Daphnus the incomparable, and Eutecnus, and all by name. Fare ye well in the grace of God.'
