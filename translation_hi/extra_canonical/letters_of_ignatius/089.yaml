  yaml_path: translation/extra_canonical/letters_of_ignatius/089.yaml
  text: 'I greet the households of my brothers, with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, greets you.


    I greet the household of Tavia, and I pray that she may be grounded in faith and love, both of flesh and of spirit. I greet Alce, a name very dear to me, and the incomparable Daphnus, and Eutecnus, and all by name. Farewell in the grace of God.'
translation:
  language: hi
  text: 'मैं अपने भाइयों के घरानों को, उनकी पत्नियों और बच्चों समेत, और उन कुँवारियों को नमस्कार करता हूँ जिन्हें विधवाएँ कहा जाता है।[a] पिता की सामर्थ्य में कुशल से रहो। फिलो, जो मेरे साथ है, तुम्हें नमस्कार करता है।


    मैं ताविया के घराने को नमस्कार करता हूँ और प्रार्थना करता हूँ कि वह विश्वास और प्रेम में—देह और आत्मा, दोनों में—दृढ़ता से स्थापित हो जाए।[b] मैं अल्के को नमस्कार करता हूँ, जिसका नाम मुझे बहुत प्रिय है; और अनुपम दाफ्नुस, यूतेक्नुस तथा सबको नाम लेकर नमस्कार करता हूँ। परमेश्वर के अनुग्रह में कुशल से रहो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कुँवारियाँ जिन्हें विधवाएँ कहा जाता है” संभवतः उस समय किसी पहचाने हुए सामुदायिक वर्ग या सेवकाई की ओर संकेत करता है; उपलब्ध साक्ष्य से उसका ठीक स्वरूप निश्चित नहीं है।
    reason: ऐतिहासिक रूप से असामान्य पदबंध की वास्तविक अस्पष्टता बताना।
  - marker: b
    text: “देह और आत्मा, दोनों में” का संबंध वाक्य में विश्वास और प्रेम दोनों से हो सकता है; इसका आशय जीवन के शारीरिक और आत्मिक दोनों आयामों से भी हो सकता है।
    reason: व्याकरणिक और अर्थगत अस्पष्टता को किसी एक व्याख्या में सीमित होने से बचाना।
lexical_decisions:
- source_word: households
  choice: घरानों
  rationale: यह केवल भवन नहीं, बल्कि परिवार और उससे जुड़े गृह-समुदाय को व्यक्त करता है।
- source_word: virgins
  choice: कुँवारियों
  rationale: आधुनिक और सहज हिन्दी में अविवाहित तथा यौन-संयमी स्त्रियों के लिए संदर्भानुकूल शब्द।
- source_word: grounded
  choice: दृढ़ता से स्थापित
  rationale: विश्वास और प्रेम में स्थिर नींव पाने का रूपक बनाए रखता है।
- source_word: flesh
  choice: देह
  rationale: ‘मांस’ की अपेक्षा यहाँ अधिक स्वाभाविक है और शारीरिक/मानवीय आयाम को बिना नकारात्मक अर्थ जोड़े व्यक्त करता है।
- source_word: spirit
  choice: आत्मा
  rationale: देह के साथ प्रयुक्त आध्यात्मिक आयाम को व्यक्त करता है; इसे पवित्र आत्मा मानकर अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: by name
  choice: नाम ले-लेकर
  rationale: हर व्यक्ति के प्रति व्यक्तिगत अभिवादन का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ‘कुँवारियाँ जिन्हें विधवाएँ कहा जाता है’ की असामान्य सामुदायिक उपाधि
  choice: विरोधाभासी-सी मूल अभिव्यक्ति को ज्यों का त्यों बनाए रखा
  alternative: इसे ‘विधवाओं के नाम से जानी जाने वाली सेविकाएँ’ अथवा किसी निश्चित कलीसियाई पद के रूप में समझाना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य किसी एक ऐतिहासिक या कलीसियाई अर्थ को निर्णायक नहीं बनाता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई।
- issue: ‘देह और आत्मा दोनों’ का संबंध
  choice: इसे विश्वास और प्रेम में स्थापित होने की प्रार्थना के दोनों आयामों के रूप में रखा
  alternative: ‘देह का प्रेम और आत्मा का प्रेम’ या केवल वैवाहिक शुद्धता के संदर्भ में सीमित करना
  rationale: वाक्य-विन्यास एक से अधिक संबंधों की अनुमति देता है; अनुवाद ने व्यापक शारीरिक और आत्मिक आयाम को रखा और निजी धर्मसिद्धांत नहीं जोड़ा।
- issue: ‘आत्मा’ का अभिप्राय
  choice: सामान्य ‘आत्मा’
  alternative: ‘पवित्र आत्मा’
  rationale: साक्ष्य में स्पष्ट रूप से पवित्र आत्मा का नाम नहीं है, इसलिए त्रिएकवादी विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, आत्मीय पत्रात्मक और गरिमापूर्ण रखी गई है। बहुवचन संबोधन के लिए ‘तुम’ का प्रयोग समुदाय के निकट संबंध को दर्शाता है। व्यक्तिनाम उपलब्ध अंग्रेज़ी साक्ष्य के आधार पर देवनागरी में लिप्यंतरित किए गए हैं। चूँकि प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित है, शब्दगत निर्णय सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और दिए गए पांडुलिपि-संदर्भ पर आधारित हैं।
