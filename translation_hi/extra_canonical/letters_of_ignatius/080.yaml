base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/080.yaml
  text: 'But I warn you about these things, dearly loved, knowing that you yourselves think this way. Nevertheless, I am watching over you in advance to protect you from wild beasts in human form—people whom you should not only refuse to receive but, if possible, not even meet [them]. Only pray for them, in case they might repent. This is indeed difficult, but Jesus Christ, our true life, has power over it.


    For if our Lord did these things only in appearance, then I too am a prisoner only in appearance. And why, then, have I handed myself over to death, to fire, to the sword, to wild beasts? But close to the sword, close to God; in the company of wild beasts, in the company of God. Only let it be in the name of Jesus Christ, so that we may suffer together with him. I endure everything, since he himself enables me, who is the perfect human being.'
translation:
  language: hi
  text: 'परन्तु, हे अत्यन्त प्रिय लोगो, मैं तुम्हें इन बातों के विषय में चेतावनी देता हूँ, क्योंकि मैं जानता हूँ कि तुम स्वयं भी ऐसा ही सोचते हो। फिर भी मैं तुम्हें पहले से सावधान कर रहा हूँ, ताकि तुम्हें मनुष्य-रूपी जंगली पशुओं से बचाऊँ—ऐसे लोगों से, जिन्हें तुम्हें न केवल स्वीकार नहीं करना चाहिए, बल्कि यदि सम्भव हो तो उनसे मिलना तक नहीं चाहिए। केवल उनके लिए प्रार्थना करो कि शायद वे मन फिराएँ। यह सचमुच कठिन है, पर यीशु मसीह, जो हमारा सच्चा जीवन है, इस पर सामर्थ्य रखता है।


    क्योंकि यदि हमारे प्रभु ने ये बातें केवल प्रतीत रूप में कीं, तो मैं भी केवल प्रतीत रूप में ही बन्दी हूँ। फिर मैंने अपने आपको मृत्यु, आग, तलवार और जंगली पशुओं के हवाले क्यों कर दिया है? परन्तु तलवार के निकट, परमेश्वर के निकट; जंगली पशुओं के साथ, परमेश्वर के साथ। बस, यह यीशु मसीह के नाम में हो, ताकि हम उसके साथ दुःख सहें। मैं सब कुछ सहता हूँ, क्योंकि वही मुझे सामर्थ्य देता है, जो पूर्ण मनुष्य है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wild beasts in human form
  choice: मनुष्य-रूपी जंगली पशु
  rationale: विरोधियों के लिए प्रयुक्त तीखे रूपक को नरम किए बिना स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: receive
  choice: स्वीकार करना
  rationale: यह केवल आतिथ्य देने तक सीमित न होकर संगति या मान्यता देने का व्यापक अर्थ सुरक्षित रखता है।
- source_word: in semblance
  choice: केवल दिखावे में
  rationale: मसीह के दुःख को मात्र प्रतीत होने वाला मानने के विवादात्मक संदर्भ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: in the name of Jesus Christ
  choice: यीशु मसीह के नाम के कारण
  rationale: यहाँ शहादत के कारण अथवा निष्ठा का भाव संदर्भानुकूल है; केवल अनुष्ठानिक सूत्र का संकेत देने से बचता है।
- source_word: perfect Man
  choice: सिद्ध मनुष्य
  rationale: मसीह की वास्तविक और पूर्ण मानवता पर दिए गए बल को सुरक्षित रखता है, बिना ‘पुरुष’ द्वारा अनावश्यक लैंगिक संकुचन किए।
theological_decisions:
- issue: प्रभु के कार्य और दुःख का केवल आभासी होना
  choice: यदि हमारे प्रभु ने ये बातें केवल दिखावे में की थीं
  alternative: यदि हमारे प्रभु ने ये बातें केवल प्रतीत रूप में की थीं
  rationale: पाठ की प्रत्यक्ष देहधारण-विरोधी धार को बनाए रखते हुए साधारण पाठक के लिए अर्थ स्पष्ट किया गया है।
- issue: Jesus Christ has power over it
  choice: यीशु मसीह ... इस पर सामर्थ्य रखता है
  alternative: यीशु मसीह ... इसे करने में समर्थ है
  rationale: ‘इस’ का सटीक संदर्भ कुछ अस्पष्ट है—पश्चाताप, प्रार्थना की कठिनाई, या परिस्थिति पर अधिकार—इसलिए व्यापक मूल अभिव्यक्ति को सुरक्षित रखा गया है।
- issue: साथ दुःख सहने का कर्ता
  choice: ताकि हम उसके साथ दुःख सहें
  alternative: ताकि मैं उसके साथ दुःख सहूँ
  rationale: प्राप्त अंग्रेज़ी साक्ष्य में बहुवचन ‘we’ है; लेखक के व्यक्तिगत शहादती संदर्भ के बावजूद उसे एकवचन में नहीं बदला गया।
- issue: मसीह का मानवत्व
  choice: जो सिद्ध मनुष्य है
  alternative: जो पूर्ण मनुष्य है
  rationale: विवादात्मक संदर्भ में मसीह की वास्तविक मानवता की पुष्टि को स्पष्ट रखा गया है; ‘सिद्ध’ मूल साक्ष्य के ‘perfect’ के अधिक औपचारिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य-लय में पत्रात्मक चेतावनी और शहादत-संबंधी तीव्रता बनाए रखी गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और ऑडिटेड POB पर आधारित अस्थायी अनुवाद है; यूनानी मध्य-पाठ परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है। किसी पादटिप्पणी का प्रयोग नहीं किया गया, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
