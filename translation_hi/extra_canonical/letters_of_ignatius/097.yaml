review_pass:
  verdict: revise
  source_fidelity: 'The draft generally follows the supplied English witness closely and retains its conditional, non-doctrinal language. A few phrases need tightening: the opening can imply that the report, rather than Antioch''s peace, came through Polycarp''s prayers; the explicit imperative “Appoint him, I say” is weakened; and “glorify” is rendered merely as “प्रकट करे.”'
  naturalness: The register is largely appropriate, but “निष्कपटता की प्रबलता” is not idiomatic modern Hindi. “धार्मिक परिषद्” and “सत्यनिष्ठा का उत्साह” are clearer while retaining the elevated epistolary style.
  terminology: “कलीसिया,” “मसीही,” “अनुग्रह,” and “मध्यस्थता” are suitable. “परमेश्वर का दूत” preserves the marked expression ‘God’s courier’; wording should retain that it is a name/title to be borne. “अन्ताकिया” is the standard Hindi biblical form used here.
  issues:
  - severity: medium
    issue: Opening modifier is ambiguous
    rationale: “तुम्हारी प्रार्थनाओं के द्वारा” immediately follows “समाचार मिला,” so it can mean that the news was received through their prayers. The witness presents the prayers as connected with Antioch’s peace; the Hindi should make that attachment explicit.
  - severity: medium
    issue: The separate appointment command is reduced
    rationale: 'The witness repeats the instruction: choose such a person, then “Appoint him, I say.” The draft’s “उसे नियुक्त करो कि” makes this less distinct. A separate imperative better preserves the rhetorical emphasis.'
  - severity: medium
    issue: ‘Glorify’ is undertranslated
    rationale: “प्रकट करे” means reveal or display, whereas the witness says that the envoy should glorify/praise their zealous love for God’s glory. “महिमान्वित करे” retains the wording without adding an interpretation.
  - severity: low
    issue: ‘निष्कपटता की प्रबलता’ is unnatural
    rationale: This phrase is grammatically possible but stiff and unclear in modern Hindi. “तुम्हारी सत्यनिष्ठा का उत्साह” naturally conveys the witness’s ‘fervor of your sincerity.’
  revised_text: 'जब मुझे यह समाचार मिला कि तुम्हारी प्रार्थनाओं के कारण सीरिया के अन्ताकिया की कलीसिया में शांति है, तो मुझे और भी अधिक सांत्वना मिली, क्योंकि परमेश्वर ने मेरी चिंता दूर कर दी है—यदि मैं दुःख सहने के द्वारा परमेश्वर तक पहुँच सकूँ, ताकि तुम्हारी मध्यस्थता के द्वारा शिष्य पाया जाऊँ।


    परम धन्य पॉलीकार्प, तुम्हारे लिए उचित है कि तुम एक धर्मपरायण परिषद् बुलाओ और अपने बीच से किसी ऐसे व्यक्ति को चुनो जो तुम्हें बहुत प्रिय हो और उत्साही भी हो, और जो “परमेश्वर का दूत” नाम धारण करने के योग्य हो। मैं कहता हूँ, उसे नियुक्त करो, ताकि वह सीरिया जाए और परमेश्वर की महिमा के लिए तुम्हारे उत्साहपूर्ण प्रेम को महिमान्वित करे।


    मसीही का अपने ऊपर अधिकार नहीं होता, बल्कि वह अपना समय परमेश्वर को देता है। यह परमेश्वर का काम है, और जब तुम इसे पूरा करोगे, तब तुम्हारा भी। क्योंकि मुझे परमेश्वर के अनुग्रह पर भरोसा है कि तुम परमेश्वर के योग्य कोई भला काम करने के लिए तैयार हो। तुम्हारी सत्यनिष्ठा का उत्साह जानकर मैंने एक छोटे पत्र में तुम्हें प्रोत्साहित किया है।'
