base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/097.yaml
  text: 'Seeing that the church in Antioch of Syria has peace, as it has been reported to me, through your prayers, I myself also have been the more comforted, since God has banished my care—if indeed through suffering I may attain to God, so that through your intercession I may be found to be a disciple.


    It is fitting for you, most blessed Polycarp, to call together a godly council and choose someone among you who is very dear to you and also zealous, who will be fit to bear the name of God’s courier. Appoint him, I say, so that he may go to Syria and glorify your zealous love to the glory of God.


    A Christian has no authority over himself but gives his time to God. This is God’s work, and yours also, when you shall complete it; for I trust in the divine grace that you are ready for an act of well doing worthy of God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
translation:
  language: hi
  text: 'जब मुझे यह समाचार मिला कि तुम्हारी प्रार्थनाओं के द्वारा सीरिया के अंताकिया की कलीसिया में शांति है, तो मुझे और भी अधिक सांत्वना मिली, क्योंकि परमेश्वर ने मेरी चिंता दूर कर दी है—यदि मैं दुःख सहने के द्वारा परमेश्वर तक पहुँच सकूँ, ताकि तुम्हारी मध्यस्थता के द्वारा शिष्य पाया जाऊँ।


    परम धन्य पॉलीकार्प, तुम्हारे लिए उचित है कि तुम परमेश्वर को समर्पित एक सभा बुलाओ और अपने बीच से किसी ऐसे व्यक्ति को चुनो जो तुम्हें बहुत प्रिय और उत्साही भी हो, और जो “परमेश्वर का दूत” कहलाने योग्य हो। उसे नियुक्त करो कि वह सीरिया जाए और परमेश्वर की महिमा के लिए तुम्हारे उत्साही प्रेम को प्रकट करे।


    मसीही का अपने ऊपर अधिकार नहीं होता, बल्कि वह अपना समय परमेश्वर को देता है। यह परमेश्वर का काम है, और जब तुम इसे पूरा करोगे तो तुम्हारा भी। क्योंकि मुझे परमेश्वर के अनुग्रह पर भरोसा है कि तुम परमेश्वर के योग्य भलाई का काम करने के लिए तैयार हो। तुम्हारी निष्कपटता की प्रबलता जानकर मैंने इस छोटे-से पत्र में तुम्हें प्रोत्साहित किया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hath peace
  choice: शांति है
  rationale: कलीसिया की शांतिपूर्ण और सुरक्षित स्थिति को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: attain unto God
  choice: परमेश्वर तक पहुँच सकूँ
  rationale: इग्नातियुस की शहादत-संबंधी अभिव्यक्ति को उसकी धार्मिक तीव्रता सहित रखा गया है, बिना उसका अर्थ विस्तार से तय किए।
- source_word: godly council
  choice: परमेश्वर को समर्पित एक सभा
  rationale: ‘ईश्वरीय’ जैसे अस्पष्ट विशेषण के बजाय ऐसी सभा का भाव देता है जिसका उद्देश्य परमेश्वर की सेवा है।
- source_word: God’s courier
  choice: “परमेश्वर का दूत”
  rationale: संदेश लेकर भेजे जाने वाले प्रतिनिधि का भाव देता है; उद्धरण-चिह्न विशिष्ट पदनाम को सुरक्षित रखते हैं।
- source_word: giveth his time to God
  choice: अपना समय परमेश्वर को देता है
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के निकट रहता है; यूनानी स्रोत की समीक्षा लंबित होने के कारण संभावित वैकल्पिक अर्थ नहीं जोड़ा गया।
- source_word: fervor of your sincerity
  choice: तुम्हारी निष्कपटता की प्रबलता
  rationale: ईमानदार समर्पण की तीव्रता को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुःख सहने के द्वारा परमेश्वर तक पहुँचना
  choice: वाक्य को शर्तात्मक रूप में यथावत रखा गया
  alternative: इसे निश्चित शहादत या उद्धार की घोषणा बनाना
  rationale: पाठ की ‘यदि’ वाली विनम्र अनिश्चितता और शिष्य पाए जाने की धार्मिक तनावपूर्ण भाषा को सुरक्षित रखना आवश्यक है।
- issue: तुम्हारी मध्यस्थता
  choice: मध्यस्थता
  alternative: केवल ‘प्रार्थनाओं’ या ‘सहायता’ कहना
  rationale: उपलब्ध साक्ष्य में intercession है; इसे संप्रदायगत अर्थ दिए बिना सामान्य प्रार्थनापूर्ण निवेदन के रूप में रखा गया है।
- issue: मसीही का अपने ऊपर अधिकार नहीं
  choice: प्रत्यक्ष और सार्वभौमिक कथन बनाए रखा
  alternative: इसे केवल कलीसियाई सेवक या दूत पर लागू करना
  rationale: मूल साक्ष्य ‘A Christian’ कहता है; दायरा संकीर्ण करना व्याख्यात्मक हस्तक्षेप होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु साधारण पाठकों के लिए सुबोध। ‘कलीसिया’ आरम्भिक मसीही समुदाय के लिए रखा गया है। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठपरंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है, इसलिए संदिग्ध स्थानों पर अनावश्यक निश्चितता से बचा गया है।
