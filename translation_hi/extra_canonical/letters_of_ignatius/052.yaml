base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/052.yaml
  text: 'The love of the Smyrnaeans and Ephesians greets you. Remember in your prayers the church which is in Syria, whereof [also] I am not worthy to be called a member, being the very last of them.


    Farewell in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with an undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
translation:
  language: hi
  text: 'स्मुरना और इफिसुस के विश्वासियों का प्रेम तुम्हें नमस्कार कहता है। अपनी प्रार्थनाओं में सीरिया की कलीसिया को याद रखना; उसका सदस्य कहलाने के योग्य भी मैं नहीं हूँ, क्योंकि मैं उन सबमें सबसे छोटा हूँ।


    यीशु मसीह में कुशल से रहो। बिशप के अधीन ऐसे रहो जैसे किसी आज्ञा के अधीन, और इसी प्रकार प्राचीनों की परिषद के भी। तुममें से हर एक निष्कपट हृदय से एक-दूसरे से प्रेम करे।


    मेरा प्राण तुम्हारे लिए अर्पित है—केवल अभी ही नहीं, बल्कि तब भी जब मैं परमेश्वर तक पहुँच जाऊँगा। क्योंकि मैं अब भी संकट में हूँ; पर पिता यीशु मसीह में विश्वासयोग्य है कि वह मेरी और तुम्हारी विनती पूरी करे। काश, हम उसमें निर्दोष पाए जाएँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Smyrnaens and Ephesians
  choice: स्मुरना और इफिसुस के विश्वासी
  rationale: नगर-आधारित जननामों का यांत्रिक लिप्यंतरण हिंदी में अस्वाभाविक होता; यह रूप अभिप्रेत मसीही समुदायों को स्पष्ट करता है।
- source_word: church
  choice: कलीसिया
  rationale: प्राचीन मसीही समुदाय के लिए हिंदी बाइबलीय प्रयोग में प्रचलित और गरिमापूर्ण शब्द।
- source_word: bishop
  choice: बिशप
  rationale: ἐπίσκοπος-संबंधी ऐतिहासिक पद को सामान्य आधुनिक हिंदी पाठक के लिए पहचानने योग्य रूप में रखा गया; किसी आधुनिक संप्रदाय की संरचना इसमें आरोपित नहीं की गई।
- source_word: presbytery
  choice: प्राचीनों की परिषद
  rationale: यह सामूहिक निकाय है, केवल अमूर्त पद नहीं; इसलिए अर्थस्पष्ट सामूहिक पदबंध चुना गया।
- source_word: undivided heart
  choice: निष्कपट हृदय
  rationale: अभिप्राय अखंड, दोहरेपन से रहित प्रेम का है; हिंदी में स्वाभाविक नैतिक भाव देने के लिए यह रूप चुना गया।
- source_word: My spirit is offered up for you
  choice: मेरा प्राण तुम्हारे लिए अर्पित है
  rationale: आत्म-समर्पण और बलिदानी भाव को बनाए रखते हुए अस्वाभाविक शाब्दिक अनुवाद से बचा गया।
- source_word: attain unto God
  choice: परमेश्वर तक पहुँच जाऊँगा
  rationale: शहादत की संभावित पृष्ठभूमि को स्पष्ट रूप से जोड़ने के बजाय मूल की गंतव्य-संबंधी भाषा और तनाव सुरक्षित रखा गया।
theological_decisions:
- issue: बिशप के प्रति अधीनता की तुलना
  choice: बिशप के अधीन ऐसे रहो जैसे किसी आज्ञा के अधीन
  alternative: बिशप के अधीन ऐसे रहो मानो वह स्वयं आज्ञा हो
  rationale: आपूर्त अंग्रेज़ी साक्ष्य में तुलना का आशय अनिश्चित है; चुना हुआ रूप व्यक्ति और दिव्य आज्ञा को एक मान लेने से बचता है, फिर भी कठोर अधीनता की भाषा बनाए रखता है।
- issue: परमेश्वर तक पहुँचने का अर्थ
  choice: जब मैं परमेश्वर तक पहुँच जाऊँगा
  alternative: जब मैं शहादत पाकर परमेश्वर के पास पहुँचूँगा
  rationale: पाठ में शहादत निहित हो सकती है, पर उसे खुलकर नहीं कहा गया; इसलिए निहितार्थ को व्याख्या बनाकर मुख्य पाठ में नहीं जोड़ा गया।
- issue: पिता की विश्वासयोग्यता और विनती की पूर्ति
  choice: पिता यीशु मसीह में विश्वासयोग्य है कि वह मेरी और तुम्हारी विनती पूरी करे
  alternative: यीशु मसीह में विश्वासयोग्य पिता मेरी और तुम्हारी विनती अवश्य पूरी करेगा
  rationale: मूल साक्ष्य की वाक्यगत और धार्मिक कसावट रखी गई तथा पूर्ति को अनावश्यक रूप से पूर्ण आश्वासन में नहीं बदला गया।
- issue: ‘उसमें’ का संदर्भ
  choice: काश, हम उसमें निर्दोष पाए जाएँ
  alternative: काश, हम यीशु मसीह में निर्दोष पाए जाएँ
  rationale: सर्वनाम का संभावित संदर्भ पिता या यीशु मसीह हो सकता है; मूल की अस्पष्टता को मुख्य पाठ में सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण पर सहज शैली। उपलब्ध सामग्री प्रत्यक्ष यूनानी पाठ नहीं बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है और स्रोत-भाषा समीक्षा लंबित है; इसलिए मसौदा अनंतिम है। संपादकीय “[also]” को हिंदी मुख्य पाठ में अलग संकेत के रूप में नहीं रखा गया, क्योंकि वाक्य में उसका निश्चित अर्थ उपलब्ध साक्ष्य से स्थापित नहीं होता।
