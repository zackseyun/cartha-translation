  terminology: “कलीसिया,” “बिशप,” and “प्राचीनों की परिषद” are appropriate, historically intelligible renderings. “आत्मा” is preferable to “प्राण” here for “My spirit,” without making a doctrinal claim. The bracketed editorial restoration is retained and documented.
  issues:
