source:
  text: 'The love of the Smyrnaens and Ephesians saluteth you. Remember in your prayers the church which is in Syria; whereof [also] I am not worthy to be called a member, being the very last of them.


    Fare ye well in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
