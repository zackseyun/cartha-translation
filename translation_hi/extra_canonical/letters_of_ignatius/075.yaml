base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: hi
  text: 'अब किलिकिया के सेवक फिलोन के विषय में—जिसकी अच्छी गवाही दी जाती है और जो अब परमेश्वर के वचन की सेवा में मेरी भी सहायता करता है—और राइउस अगाथोपुस के विषय में, जो एक चुना हुआ व्यक्ति है और इस वर्तमान जीवन को विदा कहकर सीरिया से मेरे साथ चला आ रहा है: वे भी तुम्हारे पक्ष में गवाही देते हैं। मैं स्वयं तुम्हारे लिए परमेश्वर को धन्यवाद देता हूँ, क्योंकि तुमने उनका स्वागत किया, जैसे मुझे प्रभु पर भरोसा है कि वह भी तुम्हारा स्वागत करेगा। पर जिन्होंने उनका अनादर किया, वे यीशु मसीह के अनुग्रह से छुटकारा पाएँ।


    त्रोआस में रहने वाले भाई-बहनों का प्रेम तुम्हें नमस्कार कहता है। वहीं से मैं बुर्रुस के हाथ यह पत्र भी लिख रहा हूँ। इफिसुस और स्मुरना के विश्वासियों ने उसे मेरे साथ मेरे सम्मान के चिह्न के रूप में भेजा था। प्रभु यीशु मसीह उनका सम्मान करे; उन्हीं पर उनका भरोसा शरीर, प्राण और आत्मा से, और विश्वास, प्रेम तथा एकता में लगा है। हमारे साझे आशा यीशु मसीह में कुशल से रहो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deacon
  choice: सेवक
  rationale: यह कलीसियाई भूमिका का संकेत बनाए रखता है, पर आधुनिक हिन्दी में केवल लिप्यंतरित पदनाम की अपेक्षा अधिक सहज है।
- source_word: ministereth to me in the word of God
  choice: परमेश्वर के वचन की सेवा में मेरी भी सहायता करता है
  rationale: सेवा और इग्नातियुस को दी जा रही सहायता—दोनों भाव स्पष्ट रहते हैं।
- source_word: elect one
  choice: एक चुना हुआ व्यक्ति
  rationale: चुने जाने की धार्मिक प्रतिध्वनि को बिना किसी विशिष्ट सिद्धान्त में सीमित किए सुरक्षित रखा गया है।
- source_word: having bidden farewell to this present life
  choice: इस वर्तमान जीवन को विदा कहकर
  rationale: स्रोत-साक्ष्य के असामान्य और संभवतः रूपकात्मक कथन को व्याख्यात्मक रूप से हल किए बिना रखा गया है।
- source_word: received
  choice: स्वागत किया / स्वागत करेगा
  rationale: मनुष्य द्वारा आतिथ्य और प्रभु द्वारा ग्रहण किए जाने के बीच की जानबूझकर समानता सुरक्षित है।
- source_word: redeemed
  choice: छुटकारा पाएँ
  rationale: धार्मिक भार को बनाए रखते हुए स्वाभाविक हिन्दी प्रयोग चुना गया है।
- source_word: concord
  choice: एकता
  rationale: सामंजस्यपूर्ण सहमति का अर्थ सरल और प्रतिष्ठित आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ‘वर्तमान जीवन को विदा कहना’ का आशय
  choice: रूपक को यथावत रखा गया
  alternative: ‘सांसारिक जीवन त्यागकर’ या ‘मरने को तैयार होकर’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य अस्पष्ट है और यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है; अतः किसी तपस्वी या शहादत-संबंधी अर्थ को निश्चित नहीं किया गया।
- issue: ‘प्रभु तुम्हें ग्रहण करेगा’ का स्वर
  choice: ‘मुझे प्रभु पर भरोसा है कि वह भी तुम्हारा स्वागत करेगा’
  alternative: निश्चित प्रतिज्ञा के रूप में ‘प्रभु तुम्हें ग्रहण करेगा’
  rationale: साक्ष्य में उपस्थित आशावादी विश्वास को बनाए रखा गया है, उसे निरपेक्ष घोषणा नहीं बनाया गया।
- issue: अनादर करने वालों के लिए कामना
  choice: ‘वे यीशु मसीह के अनुग्रह से छुटकारा पाएँ’
  alternative: दंड या क्षमा की स्पष्ट प्रार्थना
  rationale: मूल साक्ष्य की उद्धार-संबंधी कामना और उसके तनाव को सुरक्षित रखा गया है।
- issue: शरीर, प्राण और आत्मा
  choice: तीनों पद अलग रखे गए
  alternative: ‘अपने पूरे अस्तित्व से’
  rationale: मानव-स्वरूप पर कोई प्रणालीगत निष्कर्ष थोपे बिना स्रोत की त्रिपदी भाषा संरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और दिए गए परामर्श-पाठ पर आधारित है; मध्य-पाठपरंपरा के यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। व्यक्तिनामों और स्थाननामों को हिन्दी ध्वन्यात्मक रूप में दिया गया है। अंतिम वाक्य में ‘हमारे साझे आशा’ को स्रोत के ‘common hope’ की सामूहिकता बनाए रखने हेतु चुना गया है।
