base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/047.yaml
  text: 'It is not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith, which is the flesh of the Lord, and in love, which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for, “Woe unto him through whom My name is vainly blasphemed before some.”'
translation:
  language: hi
  text: 'यह नहीं कि मैंने तुम्हारे बीच ऐसी किसी बात के होने की खबर पाई है। फिर भी, हे मेरे प्रिय जनो, मैं समय रहते तुम्हारे लिए चौकस रहता हूँ, क्योंकि मैं शैतान के फंदों को पहले से देखता हूँ। इसलिए नम्रता को अपने हथियार के रूप में धारण करो, और उस विश्वास में अपने को फिर दृढ़ करो जो प्रभु का शरीर है, और उस प्रेम में जो यीशु मसीह का लहू है।


    तुममें से कोई भी अपने पड़ोसी के प्रति मन में बैर न रखे। गैर-यहूदियों को कोई ऐसा अवसर न दो कि कुछ मूर्ख लोगों के कारण भक्त जनों की पूरी मंडली की निंदा हो; क्योंकि लिखा है, “हाय उस पर, जिसके कारण कुछ लोगों के सामने मेरे नाम की व्यर्थ निंदा होती है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह उद्धरण उपलब्ध अंग्रेज़ी साक्ष्य में इसी मिश्रित रूप में मिलता है और संभवतः कई बाइबलीय वचनों की अनुगूँज समेटे हुए है। यूनानी पांडुलिपि-परंपरा की सीधी समीक्षा अभी लंबित है।
    reason: उद्धरण के स्रोत, शब्दक्रम और ‘व्यर्थ निंदा’ की असामान्य अभिव्यक्ति के बारे में पाठक को स्रोतगत अनिश्चितता बताना आवश्यक है।
lexical_decisions:
- source_word: keep watch over you betimes
  choice: समय रहते तुम्हारे लिए चौकस रहता हूँ
  rationale: पुराने अंग्रेज़ी पदबंध में शीघ्र या पहले से सावधान रहने का भाव है; आधुनिक हिन्दी में इसे सहज और स्पष्ट रखा गया है।
- source_word: arm yourselves with gentleness
  choice: नम्रता को अपने हथियार के रूप में धारण करो
  rationale: युद्ध-संबंधी रूपक को सुरक्षित रखते हुए gentleness का अर्थ नम्रता रखा गया है।
- source_word: recover yourselves
  choice: अपने को फिर दृढ़ करो
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में पुनः संभलने या सुदृढ़ होने का भाव है; यूनानी समीक्षा लंबित होने के कारण अत्यधिक विशिष्ट अर्थ नहीं चुना गया।
- source_word: faith which is the flesh of the Lord
  choice: उस विश्वास में ... जो प्रभु का शरीर है
  rationale: मूल साक्ष्य के साहसिक रूपक और उसकी वास्तविक समानता को व्याख्यात्मक ढंग से हल किए बिना सुरक्षित रखा गया है।
- source_word: love which is the blood of Jesus Christ
  choice: उस प्रेम में जो यीशु मसीह का लहू है
  rationale: शरीर और लहू के समानांतर रूपक को यथावत रखा गया है।
- source_word: bear a grudge
  choice: मन में बैर न रखे
  rationale: आधुनिक सामान्य हिन्दी में दीर्घकालीन रोष या द्वेष का स्वाभाविक समतुल्य।
- source_word: Gentiles
  choice: गैर-यहूदियों
  rationale: यहाँ यहूदी समुदाय से बाहर के लोगों का ऐतिहासिक-सामाजिक अर्थ अपेक्षित है; ‘अन्यजाति’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट।
- source_word: godly multitude
  choice: भक्त जनों की पूरी मंडली
  rationale: समूहगत धार्मिक समुदाय का भाव रखा गया है, बिना उसे किसी विशिष्ट बाद की संस्थागत संज्ञा में सीमित किए।
- source_word: vainly blasphemed
  choice: व्यर्थ निंदा होती है
  rationale: अंग्रेज़ी साक्ष्य के ‘vainly’ और ‘blasphemed’ दोनों तत्वों को रखा गया है, यद्यपि वाक्य की स्रोतगत बनावट असामान्य है।
theological_decisions:
- issue: विश्वास और प्रेम का क्रमशः प्रभु के शरीर और मसीह के लहू से समानांकन
  choice: सीधे रूपकात्मक समानांकन को बनाए रखा
  alternative: इसे केवल प्रभुभोज का संकेत बताकर व्याख्यात्मक अनुवाद करना
  rationale: पाठ में संस्कारात्मक अनुगूँज संभव है, पर उपलब्ध साक्ष्य रूपक को स्पष्ट सिद्धांत में नहीं खोलता; अतः तनाव और बहुअर्थता सुरक्षित रखी गई।
- issue: ‘मेरे नाम’ में वक्ता की पहचान
  choice: उद्धरण में प्रथम पुरुष ‘मेरे नाम’ को यथावत रखा
  alternative: ‘परमेश्वर के नाम’ के रूप में स्पष्ट करना
  rationale: उपलब्ध साक्ष्य जिस उद्धरणात्मक स्वर को प्रस्तुत करता है, उसे किसी निश्चित वक्ता-संबंधी व्याख्या से प्रतिस्थापित नहीं किया गया।
- issue: ‘godly multitude’ की सामुदायिक पहचान
  choice: भक्त जनों की पूरी मंडली
  alternative: कलीसिया
  rationale: ‘कलीसिया’ संभव अर्थ हो सकता है, पर साक्ष्य के व्यापक सामुदायिक पद को संप्रदायगत या संस्थागत रूप से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘हे मेरे प्रिय जनो’ से स्नेहपूर्ण संबोधन रखा गया है। रूपकों को सरल व्याख्या में बदलने के बजाय सुरक्षित रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अंतरिम अनुवाद है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष समीक्षा लंबित है।
