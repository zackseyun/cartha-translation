base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/076.yaml
  text: 'Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ the Beloved, which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace, most reverend and bearing holy treasures; to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting.'
translation:
  language: hi
  text: इग्नातियुस, जो थियोफोरुस भी कहलाता है, परमेश्वर पिता और प्रिय यीशु मसीह की उस कलीसिया को, जिसे दया करके हर प्रकार के अनुग्रह से संपन्न किया गया है, जो विश्वास और प्रेम से परिपूर्ण है और जिसमें किसी भी वरदान की कमी नहीं, जो अत्यंत आदरणीय है और पवित्र निधियों को धारण करती है—अर्थात एशिया के स्मुरना नगर में स्थित कलीसिया को—निर्दोष आत्मा में और परमेश्वर के वचन में बहुत-बहुत नमस्कार।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; मध्य-पाठ-परंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा अभी शेष है। इसलिए विशेषतः “थियोफोरुस,” “पवित्र निधियों,” और अंतिम वाक्यांश की सूक्ष्मताएँ पुनरीक्षण के अधीन हैं।
    reason: दिए गए स्रोत की सीमा और लंबित यूनानी समीक्षा को पाठक के सामने पारदर्शी बनाना आवश्यक है।
lexical_decisions:
- source_word: Theophorus
  choice: थियोफोरुस
  rationale: यह इग्नातियुस का उपनाम है; अर्थ को अनिश्चित रूप से खोलने के बजाय नाम का लिप्यंतरण किया गया है।
- source_word: church
  choice: कलीसिया
  rationale: आरंभिक मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में परिचित और गरिमापूर्ण शब्द।
- source_word: grace
  choice: अनुग्रह
  rationale: पहले प्रयोग में ईश्वरीय कृपा का सामान्य धार्मिक अर्थ व्यक्त करता है।
- source_word: grace (second occurrence)
  choice: वरदान
  rationale: ‘किसी भी grace की कमी नहीं’ में प्राप्त सामर्थ्य या देन का भाव है; हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए अर्थभेद रखा गया है।
- source_word: bearing holy treasures
  choice: पवित्र निधियों को धारण करती है
  rationale: मूल साक्ष्य की रूपकात्मक और कुछ हद तक अस्पष्ट अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: Smyrna of Asia
  choice: एशिया के स्मुरना नगर
  rationale: प्राचीन रोमी प्रांत एशिया के भौगोलिक संकेत को बनाए रखते हुए आधुनिक पाठक के लिए ‘नगर’ जोड़ा गया है।
- source_word: abundant greeting
  choice: बहुत-बहुत नमस्कार
  rationale: पत्र-अभिवादन की प्रचुरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘God the Father and Jesus Christ the Beloved’ में कलीसिया का संबंध
  choice: परमेश्वर पिता और प्रिय यीशु मसीह की उस कलीसिया
  alternative: परमेश्वर पिता की और प्रिय यीशु मसीह की कलीसिया
  rationale: साझे संबंध को सरल हिन्दी में रखा गया है, बिना पिता और मसीह के संबंध पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष आरोपित किए।
- issue: ‘in a blameless spirit and in the word of God’ का वाक्यगत संबंध
  choice: अभिवादन के साथ जोड़ते हुए ‘निर्दोष आत्मा में और परमेश्वर के वचन में’
  alternative: कलीसिया के गुण-वर्णन के रूप में जोड़ना
  rationale: अंग्रेज़ी साक्ष्य में संबंध अस्पष्ट है; विरामचिह्न अभिवादन से संबंध सुझाता है, पर अभिव्यक्ति को यथासंभव शाब्दिक रखकर तनाव सुरक्षित किया गया है।
- issue: ‘holy treasures’ की पहचान
  choice: अपरिभाषित रूपक के रूप में सुरक्षित
  alternative: पवित्र अवशेष, संस्कार या आत्मिक वरदान स्पष्ट करना
  rationale: उपलब्ध साक्ष्य किसी एक विशिष्ट पहचान को निश्चित नहीं करता; सांप्रदायिक व्याख्या से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; पत्रात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। लंबे यूनानीनुमा संबोधन को डैश और ‘अर्थात’ से व्यवस्थित किया गया है, पर उसकी औपचारिक संरचना और वास्तविक अस्पष्टताएँ बनाए रखी गई हैं।
