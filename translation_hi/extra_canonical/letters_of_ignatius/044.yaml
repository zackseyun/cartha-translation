base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/044.yaml
  text: 'Am I not able to write to you about heavenly things? But I fear lest I should cause you harm, being infants. So bear with me, lest, not being able to take them in, you should be choked.


    For I myself also, although I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible—I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
translation:
  language: hi
  text: 'क्या मैं तुम्हें स्वर्गीय बातों के विषय में नहीं लिख सकता? पर मुझे डर है कि तुम अभी शिशु हो और कहीं मैं तुम्हें हानि न पहुँचा दूँ। इसलिए मुझे क्षमा करना, कहीं ऐसा न हो कि तुम इन बातों को अपने भीतर समा न सको और तुम्हारा दम घुट जाए।


    क्योंकि मैं स्वयं भी, यद्यपि बंधनों में हूँ और स्वर्गीय बातों को, स्वर्गदूतों के क्रमों को, शासक शक्तियों के समूहों को, तथा दृश्य और अदृश्य बातों को समझ सकता हूँ—फिर भी मैं केवल इसी कारण अभी तक शिष्य नहीं हूँ। क्योंकि हममें बहुत-सी बातों की कमी है, ताकि हम परमेश्वर से वंचित न रह जाएँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: heavenly things
  choice: स्वर्गीय बातें
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के व्यापक और कुछ अस्पष्ट अर्थ को बनाए रखता है; इसे केवल रहस्य या सिद्धांत तक सीमित नहीं करता।
- source_word: babes / infants
  choice: अभी शिशु
  rationale: आध्यात्मिक अपरिपक्वता के रूपक को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
- source_word: arrays of the angels
  choice: स्वर्गदूतों की पंक्तियाँ
  rationale: व्यवस्थित दलों या श्रेणियों की छवि को बिना अनावश्यक रूप से तकनीकी देवदूतीय पदक्रम ठहराए व्यक्त करता है।
- source_word: musterings of the principalities
  choice: प्रधानताओं के जमावड़े
  rationale: ‘principalities’ की पारंपरिक आध्यात्मिक-सत्तात्मक अस्पष्टता के लिए ‘प्रधानताएँ’ रखा गया है और ‘musterings’ को एकत्र होने के अर्थ में प्रस्तुत किया गया है।
- source_word: disciple
  choice: शिष्य
  rationale: प्रारंभिक मसीही शिष्यत्व के सामान्य और प्रतिष्ठित हिन्दी पद का प्रयोग।
- source_word: bonds
  choice: बंधन
  rationale: कैद और जंजीरों दोनों की संभावित छाया को सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान और शिष्यत्व का संबंध
  choice: ‘केवल इसी कारण मैं शिष्य नहीं बन गया हूँ’
  alternative: ‘इस सबके बावजूद मैं अभी शिष्य नहीं हूँ’
  rationale: वाक्य का बल इस बात पर रखा गया है कि स्वर्गीय विषयों का ज्ञान अपने-आप किसी को सच्चा शिष्य सिद्ध नहीं करता; साथ ही लेखक के आत्मविनम्र कथन को बनाए रखा गया है।
- issue: अंतिम कथन में मानवीय अभाव और परमेश्वर की पर्याप्तता
  choice: ‘हममें बहुत-सी बातों की कमी है, ताकि परमेश्वर की हमें कमी न हो’
  alternative: ‘हमें बहुत कुछ और चाहिए, जिससे हमें परमेश्वर की कमी न रहे’
  rationale: उपलब्ध साक्ष्य की कठिन और तनावपूर्ण भाषा को सहज धर्मवैज्ञानिक व्याख्या में बदलने के बजाय यथासंभव संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल बहुवचन संबोधन रखा गया है। रूपकों—शिशु, दम घुटना, बंधन—को बनाए रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; मध्य-पाठपरंपरा के यूनानी मूल से प्रत्यक्ष सत्यापन आवश्यक है।
