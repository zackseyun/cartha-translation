  english_witness: Knowing that ye are full of God, I have exhorted you briefly. Remember me in your prayers, that I may attain unto God; and remember also the church which is in Syria, whereof I am not worthy to be called a member. For I have need of your united prayer and love in God, that it may be granted to the church which is in Syria to be refreshed by the dew of your fervent supplication.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/037.yaml
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
translation:
  language: hi
  text: यह जानते हुए कि तुम परमेश्वर से परिपूर्ण हो, मैंने तुम्हें संक्षेप में प्रोत्साहित किया है। अपनी प्रार्थनाओं में मुझे स्मरण रखना, ताकि मैं परमेश्वर तक पहुँच सकूँ। सीरिया की कलीसिया को भी स्मरण रखना, जिसका सदस्य कहलाने योग्य मैं नहीं हूँ। क्योंकि मुझे परमेश्वर में तुम्हारी एकजुट प्रार्थना और प्रेम की आवश्यकता है, ताकि तुम्हारी उत्कट विनती की ओस से सीरिया की कलीसिया को ताज़गी पाने का वरदान मिले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्षी पर आधारित अस्थायी प्रारूप है; मध्य-पाठ-परंपरा के यूनानी पाठ से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: प्रदान किए गए स्रोत-विवरण के अनुसार प्रत्यक्ष यूनानी समीक्षा लंबित है; पाठगत निश्चितता की सीमा को पारदर्शी बनाना आवश्यक है।
lexical_decisions:
- source_word: full of God
  choice: परमेश्वर से परिपूर्ण
  rationale: साक्षी के धार्मिक रूपक को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखता है; इसे केवल ‘भक्त’ कहकर कमजोर नहीं करता।
- source_word: exhorted
  choice: प्रोत्साहित किया
  rationale: संदर्भ में संक्षिप्त आत्मिक आग्रह और उत्साहवर्धन दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: attain unto God
  choice: परमेश्वर तक पहुँच सकूँ
  rationale: लेखक की आसन्न शहादत की पृष्ठभूमि की ओर संकेत बनाए रखता है, पर अर्थ को स्पष्टतः ‘मरना’ या ‘उद्धार पाना’ कहकर सीमित नहीं करता।
- source_word: united prayer
  choice: एकजुट प्रार्थना
  rationale: समुदाय की सामूहिक और ऐक्यपूर्ण प्रार्थना पर बल बनाए रखता है।
- source_word: refreshed by the dew
  choice: ओस से ... ताज़गी पाने
  rationale: मूल साक्षी की ओस-संबंधी काव्यात्मक छवि को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: fervent supplication
  choice: उत्कट विनती
  rationale: गंभीर, प्रबल प्रार्थना का भाव व्यक्त करता है और निकटवर्ती ‘प्रार्थना’ की अनावश्यक पुनरावृत्ति घटाता है।
theological_decisions:
- issue: ‘परमेश्वर तक पहुँचना’ का आशय
  choice: अभिव्यक्ति को खुला रखा गया
  alternative: ‘शहादत पाकर परमेश्वर के पास जाना’
  rationale: संदर्भ शहादत का संकेत दे सकता है, पर उपलब्ध अंग्रेज़ी साक्षी स्वयं अधिक व्यापक अभिव्यक्ति रखता है; इसलिए धर्मवैज्ञानिक तनाव को स्पष्ट व्याख्या से नहीं बाँधा गया।
- issue: सीरिया की कलीसिया को मिलने वाली ताज़गी
  choice: प्रार्थना के उत्तर में मिलने वाले वरदान के रूप में प्रस्तुत
  alternative: किसी विशिष्ट ऐतिहासिक संकट से मुक्ति
  rationale: साक्षी संकट या ताज़गी के स्वरूप को निर्दिष्ट नहीं करता, इसलिए कोई ऐतिहासिक या सांप्रदायिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, आत्मीय बहुवचन संबोधन रखा गया है। ‘कलीसिया’ आरंभिक मसीही समुदाय के लिए प्रचलित हिन्दी बाइबलीय शब्द है। वाक्यरचना को पठनीय बनाया गया है, जबकि परमेश्वर-परिपूर्णता, परमेश्वर तक पहुँचने और प्रार्थना की ओस जैसे प्रमुख रूपकों को सुरक्षित रखा गया है।
