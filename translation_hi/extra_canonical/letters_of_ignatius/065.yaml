base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/065.yaml
  text: 'I have found that this bishop of yours holds the ministry that serves the common good, not from himself or through people, nor for vain glory, but in the love of God the Father and the Lord Jesus Christ. I am amazed at his patience;


    his silence is more powerful than the speech of others. For he is attuned to the commandments in harmony, like a lyre with its strings. Therefore my soul blesses his godly mind, for I have found it virtuous and perfect—even the untroubled and calm disposition he has while living with all godly patience.'
translation:
  language: hi
  text: मैंने पाया है कि तुम्हारा यह बिशप उस सेवकाई का दायित्व निभाता है जो सबके हित के लिए है—न अपनी ओर से, न मनुष्यों के द्वारा, और न ही व्यर्थ महिमा के लिए, बल्कि परमेश्वर पिता और प्रभु यीशु मसीह के प्रेम में। मैं उसके धीरज पर चकित हूँ। उसका मौन दूसरों की वाणी से अधिक प्रभावशाली है। क्योंकि वह आज्ञाओं के साथ ऐसे सुर में मिला हुआ है, जैसे वीणा अपने तारों के साथ। इसलिए मेरा प्राण उसकी भक्तिमय बुद्धि को धन्य कहता है, क्योंकि मैंने उसे सद्गुणी और सिद्ध पाया है—अर्थात उसका वह अविचल और शांत स्वभाव, जिसके साथ वह पूर्ण भक्तिमय धीरज में जीवन बिताता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित प्रारूप है; मध्य-पाठ-परंपरा के यूनानी पाठ से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: प्रदत्त स्रोत-सामग्री स्वयं बताती है कि मूल यूनानी की समीक्षा लंबित है; पाठकीय पारदर्शिता के लिए यह सीमा स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: ministry which pertaineth to the common weal
  choice: उस सेवकाई का दायित्व ... जो सबके हित के लिए है
  rationale: ‘सेवकाई’ प्राचीन कलीसियाई संदर्भ को बनाए रखती है, जबकि ‘सबके हित’ common weal का सहज आधुनिक हिन्दी रूप है।
- source_word: vain glory
  choice: व्यर्थ महिमा
  rationale: आत्म-प्रशंसा या खोखली प्रतिष्ठा की मूल धारणा को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: forbearance / patience
  choice: धीरज
  rationale: सहनशीलता, संयम और स्थिर धैर्य की संयुक्त भावना व्यक्त करता है; अनुच्छेद में पुनरावृत्ति भी बनाए रखी गई है।
- source_word: silence is more powerful
  choice: मौन ... अधिक प्रभावशाली है
  rationale: शाब्दिक शक्ति की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल वाक्पटुता या अधिकार तक सीमित किए।
- source_word: attuned in harmony
  choice: सुर में मिला हुआ
  rationale: वीणा और तारों के अगले रूपक से स्वाभाविक संबंध बनाता है और आज्ञाओं के अनुरूप जीवन का भाव रखता है।
- source_word: godly mind
  choice: भक्तिमय बुद्धि
  rationale: ऐसी अंतःवृत्ति और समझ का संकेत देता है जो परमेश्वर की ओर उन्मुख है; इसे ‘ईश्वरीय’ कहकर स्वयं दिव्य होने का भ्रम नहीं पैदा करता।
- source_word: imperturbable and calm temper
  choice: अविचल और शांत स्वभाव
  rationale: बाहरी विक्षोभ से न डिगने और भीतरी शांति, दोनों पहलुओं को बनाए रखता है।
theological_decisions:
- issue: बिशप की सेवकाई का स्रोत
  choice: न अपनी ओर से, न मनुष्यों के द्वारा ... बल्कि ... प्रेम में
  alternative: परमेश्वर द्वारा नियुक्त
  rationale: साक्ष्य नियुक्ति के स्रोत और प्रेरणा के बीच तनावपूर्ण भाषा रखता है; स्पष्ट ‘परमेश्वर द्वारा नियुक्त’ जोड़ना मूल से अधिक निश्चित धर्मवैज्ञानिक दावा होता।
- issue: God the Father and the Lord Jesus Christ के साथ ‘love’ का संबंध
  choice: परमेश्वर पिता और प्रभु यीशु मसीह के प्रेम में
  alternative: परमेश्वर पिता के और प्रभु यीशु मसीह के प्रेम में
  rationale: एकवचन ‘प्रेम’ की साझा संरचना को बनाए रखा गया है और संबंध को अनावश्यक रूप से अलग-अलग नहीं किया गया।
- issue: perfect का नैतिक अर्थ
  choice: सिद्ध
  alternative: दोषरहित
  rationale: ‘सिद्ध’ पूर्णता या परिपक्वता की खुली अर्थ-सीमा बनाए रखता है; ‘दोषरहित’ पाठ से अधिक निरपेक्ष दावा कर सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। ‘बिशप’ ऐतिहासिक पदनाम के रूप में रखा गया है; रूपक, पुनरावृत्ति और मूल की धर्मवैज्ञानिक अनिश्चितता यथासंभव सुरक्षित रखी गई है।
