  english_witness: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/077.yaml
  text: 'I glorify Jesus Christ, the God who gave you such wisdom, because I have seen that you are established in unshakable faith, as though nailed to the cross of the Lord Jesus Christ in flesh and spirit, and firmly rooted in love in the blood of Christ. You are fully convinced concerning our Lord that he is truly descended from David according to the flesh, yet is the Son of God by divine will and power; that he was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him;


    that he was truly nailed up in the flesh for our sake under Pontius Pilate and Herod the tetrarch (of which we are the fruit—that is, of his most blessed suffering); and that through his resurrection he might raise a banner for all ages, for his saints and faithful people, whether among Jews or Gentiles, in the one body of his Church.'
translation:
  language: hi
  text: 'मैं यीशु मसीह की—उस परमेश्वर की—महिमा करता हूँ, जिसने तुम्हें ऐसा ज्ञान दिया। क्योंकि मैंने जान लिया है कि तुम अटल विश्वास में स्थिर हो, मानो शरीर और आत्मा से प्रभु यीशु मसीह के क्रूस पर कीलों से जड़े हुए हो, और मसीह के लहू में प्रेम की दृढ़ नींव पर टिके हो। हमारे प्रभु के विषय में तुम्हें पूरा विश्वास है कि शरीर के अनुसार वह सचमुच दाऊद के वंश से था, पर दिव्य इच्छा और सामर्थ्य से परमेश्वर का पुत्र है; वह सचमुच एक कुँवारी से जन्मा और यूहन्ना से बपतिस्मा लिया, ताकि उसके द्वारा सारी धार्मिकता पूरी की जाए;


    और हमारे लिए वह शरीर में सचमुच पुन्तियुस पिलातुस और चौथाई प्रदेश के शासक हेरोदेस के समय क्रूस पर कीलों से जड़ा गया। हम उसी के फल हैं—अर्थात उसके परमधन्य दुःखभोग के। उसने अपने पुनरुत्थान के द्वारा सभी युगों के लिए एक ध्वजा खड़ी की, ताकि उसके पवित्र और विश्वासी लोग—चाहे यहूदियों में से हों या गैर-यहूदियों में से—उसकी कलीसिया की एक देह में एकत्र हों।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित प्रारूप है; मध्य-पाठ-परंपरा के यूनानी मूल से प्रत्यक्ष समीक्षा अभी शेष है। अंतिम वाक्य में ‘एकत्र हों’ अर्थ को स्वाभाविक हिंदी में व्यक्त करने के लिए जोड़ा गया है और यूनानी समीक्षा के बाद पुनः जाँचा जाना चाहिए।
    reason: स्रोत-भाषा समीक्षा लंबित होने तथा अंतिम उद्देश्य-वाक्य में सीमित व्याख्यात्मक पूर्ति की पारदर्शिता।
lexical_decisions:
- source_word: the God
  choice: उस परमेश्वर की
  rationale: ‘यीशु मसीह’ के साथ मूल साक्ष्य के स्पष्ट ईश्वरीय विशेषण को बनाए रखते हुए हिंदी में विराम-चिह्नों द्वारा संबंध स्पष्ट किया गया।
- source_word: according to the flesh
  choice: शरीर के अनुसार
  rationale: यह पारंपरिक, समझने योग्य और धर्मवैज्ञानिक रूप से खुला पदबंध है; इसे केवल ‘मानवीय वंश से’ कहकर सीमित नहीं किया गया।
- source_word: in the blood of Christ
  choice: मसीह के लहू में
  rationale: मूल रूपक और उसके धर्मवैज्ञानिक तनाव को बनाए रखा गया; इसे ‘लहू के कारण’ में नहीं बदला गया।
- source_word: tetrarch
  choice: चौथाई प्रदेश का शासक
  rationale: ऐतिहासिक पदवी का अर्थ साधारण पाठक के लिए स्पष्ट किया गया, बिना हेरोदेस को सामान्य अर्थ में ‘राजा’ कहे।
- source_word: ensign
  choice: ध्वजा
  rationale: सार्वजनिक रूप से उठाए गए चिह्न या मानक की प्राचीन छवि को सुरक्षित रखता है।
- source_word: Gentiles
  choice: गैर-यहूदी
  rationale: आधुनिक हिंदी में सहज और व्यापक रूप से बोधगम्य शब्द।
- source_word: Church
  choice: कलीसिया
  rationale: प्राचीन मसीही समुदाय और उसकी एक देह की धारणा के लिए हिंदी बाइबलीय प्रयोग में परिचित शब्द।
theological_decisions:
- issue: यीशु मसीह के लिए ‘परमेश्वर’ की उपाधि
  choice: यीशु मसीह की—उस परमेश्वर की—महिमा करता हूँ
  alternative: उस परमेश्वर की महिमा करता हूँ जिसने यीशु मसीह के द्वारा...
  rationale: प्राप्त साक्ष्य में ‘the God’ सीधे Jesus Christ का समानाधिकरण है; वैकल्पिक वाक्य मूल की मसीह-विषयक घोषणा बदल देता।
- issue: दाऊद का वंश और परमेश्वर का पुत्र होना
