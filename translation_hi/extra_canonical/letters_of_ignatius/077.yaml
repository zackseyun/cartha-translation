- issue: ‘सारी धार्मिकता’ का कर्ता/माध्यम
  choice: ताकि उसके द्वारा सारी धार्मिकता पूरी की जाए
  alternative: ताकि वह सारी धार्मिकता पूरी करे
  rationale: अंग्रेज़ी साक्ष्य का निष्क्रिय ‘by him’ संरक्षित है; उपलब्ध आधार पर अधिक सक्रिय व्याख्या थोपने से बचा गया।
- issue: पुनरुत्थान और एक देह का उद्देश्य-संबंध
  choice: ध्वजा खड़ी की, ताकि... एकत्र हों
  alternative: ध्वजा खड़ी की... उसकी कलीसिया की एक देह में
  rationale: हिंदी में उद्देश्य को स्वाभाविक बनाया गया, पर अंतिम क्रिया यूनानी समीक्षा लंबित होने के कारण व्याख्यात्मक है और पादटिप्पणी में चिह्नित की गई है।
- issue: दुःखभोग का फल
  choice: हम उसी के फल हैं—अर्थात उसके परमधन्य दुःखभोग के
  alternative: हम उसके क्रूस के फल हैं
  rationale: साक्ष्य में दिए स्पष्टीकरण ‘that is, of his most blessed passion’ को जस का तस धर्मवैज्ञानिक विस्तार सहित रखा गया।
