lexical_decisions:
- source_word: to keep silence and to be
  choice: चुप रहकर वास्तव में होना
  rationale: यहाँ ‘होना’ केवल अस्तित्व नहीं, बल्कि अपने कथन के अनुरूप वास्तविक चरित्र रखने का संकेत देता है; ‘वास्तव में’ हिन्दी में इस विरोध को स्पष्ट करता है।
- source_word: one teacher
  choice: शिक्षक तो एक ही है
  rationale: मूल साक्ष्य की विशिष्टता और बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: the word of Jesus
  choice: यीशु का वचन
  rationale: ‘वचन’ आरंभिक मसीही धार्मिक भाषा की संभावित अर्थ-गहनता को ‘शिक्षा’ जैसे संकुचित विकल्प से बेहतर सुरक्षित रखता है।
- source_word: hearken unto His silence
  choice: उसके मौन को भी सुन सकता है
  rationale: जानबूझकर प्रयुक्त विरोधाभासी रूपक को समझाकर समाप्त करने के बजाय सुरक्षित रखा गया है।
- source_word: perfect
  choice: सिद्ध
  rationale: पूर्णता और परिपक्वता दोनों की धार्मिक-नैतिक अर्थछाया को खुला रखता है।
- source_word: temples
  choice: मंदिर
  rationale: बहुवचन अर्थ ‘हम उसके मंदिर हों’ में सुरक्षित है; इसे सामूहिक एकवचन में नहीं बदला गया।
theological_decisions:
- issue: ‘एक शिक्षक’ की पहचान
  choice: सर्वनाम और संदर्भ को मूल साक्ष्य की तरह खुला रखा गया
  alternative: स्पष्ट रूप से ‘यीशु मसीह ही एक शिक्षक है’ जोड़ना
  rationale: अनुच्छेद से पहचान का संकेत मिलता है, पर उपलब्ध आधार में नाम को इस वाक्य में प्रत्यक्ष रूप से जोड़ना व्याख्यात्मक विस्तार होता।
- issue: यीशु के ‘मौन’ का अर्थ
  choice: रूपक को जस का तस रखा गया
  alternative: इसे केवल अनकहे कर्मों या दुःखभोग के रूप में समझाकर अनूदित करना
  rationale: उपलब्ध साक्ष्य मौन के अर्थ को पूरी तरह निश्चित नहीं करता; इसलिए उसकी वास्तविक अस्पष्टता और धार्मिक तनाव सुरक्षित रखा गया है।
- issue: ईश्वर का विश्वासियों में निवास
  choice: ‘वह हममें निवास करता है’ और ‘हम उसके मंदिर हों’
  alternative: इसे केवल नैतिक प्रभाव या केवल संस्थागत कलीसिया के अर्थ में सीमित करना
  rationale: पाठ के सशक्त अंतर्निवास-वचन को बनाए रखते हुए किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। छोटे, संतुलित वाक्यों द्वारा मूल की सूक्तिपरक लय रखी गई है। ‘वचन’, ‘सिद्ध’, ‘निवास’ और ‘मंदिर’ जैसे परिचित धार्मिक पद अर्थ-गहनता के लिए रखे गए हैं, जबकि पुरातन या अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है। प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण मसौदा सावधानीपूर्वक अस्थायी है।
