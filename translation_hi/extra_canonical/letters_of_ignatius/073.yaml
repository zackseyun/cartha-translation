base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/073.yaml
  text: 'The priests likewise were good, but better is the High Priest, to whom the holy of holies is entrusted. For to him alone are entrusted the hidden things of God. He himself is the door of the Father, through which Abraham, Isaac, and Jacob enter, along with the Prophets, the Apostles, and the whole Church. All these things come together in the unity of God.


    But the Gospel has a unique preeminence in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. For the beloved Prophets pointed to him in their preaching, but the Gospel is the fulfillment of immortality. All things together are good, if you believe through love.'
translation:
  language: hi
  text: 'इसी प्रकार याजक अच्छे थे, पर वह महायाजक उनसे उत्तम है, जिसे परमपवित्र स्थान सौंपा गया है; क्योंकि केवल उसी को परमेश्वर की गुप्त बातें सौंपी गई हैं। वही पिता का द्वार है, जिसके द्वारा अब्राहम, इसहाक और याकूब, और भविष्यद्वक्ता, प्रेरित तथा पूरी कलीसिया प्रवेश करते हैं। ये सब परमेश्वर की एकता में आ मिलते हैं।


    पर उद्धारकर्ता—अर्थात हमारे प्रभु यीशु मसीह—के आगमन, दुःख-भोग और पुनरुत्थान के कारण सुसमाचार को अद्वितीय श्रेष्ठता प्राप्त है। क्योंकि प्रिय भविष्यद्वक्ताओं ने अपने प्रचार में उसी की ओर संकेत किया था; पर सुसमाचार अमरता की परिपूर्णता है। ये सब बातें मिलकर अच्छी हैं, यदि तुम प्रेम के द्वारा विश्वास करते हो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; मध्य-पाठ-परंपरा के यूनानी पाठ से प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: प्रदान किए गए स्रोत-विवरण में यूनानी स्रोत की समीक्षा लंबित बताई गई है; इसलिए पाठ की आधार-सीमा पारदर्शी रूप से दर्ज की गई है।
lexical_decisions:
- source_word: priests / High-priest
  choice: याजक / महायाजक
  rationale: मंदिर और परमपवित्र स्थान के संदर्भ को स्पष्ट रखते हुए प्रचलित बाइबलीय पदावली अपनाई गई है।
- source_word: holy of holies
  choice: परमपवित्र स्थान
  rationale: यह स्वाभाविक आधुनिक हिन्दी में मंदिर के भीतरी पवित्रतम भाग को व्यक्त करता है।
- source_word: hidden things of God
  choice: परमेश्वर की गुप्त बातें
  rationale: ‘छिपी हुई बातें’ भी संभव है, किंतु ‘गुप्त बातें’ संक्षिप्त है और रहस्यपूर्ण ईश्वरीय विषयों का अर्थ सुरक्षित रखता है।
- source_word: door of the Father
  choice: पिता का द्वार
  rationale: मूल रूपक को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
- source_word: Gospel
  choice: सुसमाचार
  rationale: आधुनिक हिन्दी की मानक मसीही पदावली; यहाँ संदेश अथवा सुसमाचार की वास्तविकता दोनों की संभावित व्यापकता बनी रहती है।
- source_word: passion
  choice: दुःख-भोग
  rationale: यीशु की पीड़ा और मृत्यु से जुड़े पारंपरिक अर्थ को गरिमापूर्ण तथा समझने योग्य रूप में व्यक्त करता है।
- source_word: completion of immortality
  choice: अमरता की परिपूर्णता
  rationale: असामान्य और धर्मवैचारिक रूप से सघन वाक्यांश को व्याख्या करके सीमित करने के बजाय उसकी अस्पष्टता सहित सुरक्षित रखा गया है।
theological_decisions:
- issue: महायाजक की पहचान
  choice: ‘वह महायाजक’ और आगे ‘वही पिता का द्वार’
  alternative: हर स्थान पर स्पष्ट रूप से ‘मसीह’ जोड़ना
  rationale: संदर्भ में पहचान मसीह से है, किंतु दिए गए साक्ष्य में इस अनुच्छेद के आरंभ पर नाम नहीं जोड़ा गया; इसलिए अनावश्यक स्पष्टता आरोपित नहीं की गई।
- issue: ‘जिसके द्वारा ... प्रवेश करते हैं’ का काल और आशय
  choice: वर्तमान काल ‘प्रवेश करते हैं’
  alternative: ‘प्रवेश पा चुके हैं’ अथवा ‘पिता के पास आते हैं’
  rationale: साक्ष्य का वर्तमानकालीन रूप और ‘द्वार’ का प्रत्यक्ष रूपक बनाए रखा गया; गंतव्य को जोड़कर धर्मवैचारिक व्याख्या नहीं की गई।
- issue: परमेश्वर की एकता
  choice: ‘परमेश्वर की एकता में आ मिलते हैं’
  alternative: ‘एक परमेश्वर में एक हो जाते हैं’
  rationale: ‘unity of God’ की संभावित संबंधवाचक अस्पष्टता को सुरक्षित रखते हुए उसे परमेश्वर की संख्यात्मक एकता की स्पष्ट घोषणा में नहीं बदला गया।
- issue: प्रेम और विश्वास का संबंध
  choice: ‘प्रेम के द्वारा विश्वास करते हो’
  alternative: ‘प्रेम सहित विश्वास करते हो’ या ‘प्रेम में विश्वास करते हो’
  rationale: ‘through love’ के साधनात्मक बल को यथासंभव रखा गया, यद्यपि अन्य संबंध भी व्याकरणतः संभव हो सकते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘कलीसिया’, ‘याजक’, ‘महायाजक’, ‘सुसमाचार’ और ‘पुनरुत्थान’ जैसी स्थापित बाइबलीय पदावली अपनाई गई है। लंबे यूनानीनुमा वाक्य-संबंधों को पूरी तरह तोड़े बिना हिन्दी की स्वाभाविक लय के अनुसार व्यवस्थित किया गया है।
