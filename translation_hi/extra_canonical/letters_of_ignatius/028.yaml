base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/028.yaml
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
translation:
  language: hi
  text: इसलिए, जब कि सभी बातों का एक अंत है और ये दोनों—जीवन और मृत्यु—हमारे सामने एक साथ रखे हैं, हर व्यक्ति अपने ही स्थान पर जाएगा। क्योंकि जैसे दो प्रकार के सिक्के हैं—एक परमेश्वर के और दूसरे संसार के—और प्रत्येक पर अपनी विशेष छाप अंकित है, वैसे ही अविश्वासी इस संसार की छाप धारण करते हैं, पर विश्वासयोग्य लोग प्रेम में, यीशु मसीह के द्वारा, परमेश्वर पिता की छाप धारण करते हैं। उन्हीं के द्वारा यदि हम अपनी स्वतंत्र इच्छा से उनके दुःखभोग के अनुरूप मरना स्वीकार नहीं करते, तो उनका जीवन हममें नहीं है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέλος / “end” (Greek review pending)
  choice: अंत
  rationale: साक्ष्य में प्रयुक्त ‘end’ की व्यापकता को बनाए रखता है; इसे केवल मृत्यु या लक्ष्य के रूप में सीमित नहीं करता।
- source_word: δύο νομίσματα / “two coinages” (Greek review pending)
  choice: दो प्रकार के सिक्के
  rationale: मुद्रा और उस पर अंकित छाप के रूपक को सामान्य हिन्दी में स्पष्ट रखते हुए बनाए रखता है।
- source_word: χαρακτήρ / “stamp” (Greek review pending)
  choice: छाप
  rationale: पहचान बताने वाली अंकित मुद्रा-छवि का स्वाभाविक और बोधगम्य हिन्दी रूप।
- source_word: πιστοί / “the faithful” (Greek review pending)
  choice: विश्वासयोग्य लोग
  rationale: संज्ञात्मक अर्थ और निष्ठा—दोनों को रखता है; केवल ‘विश्वासी’ कहकर अविश्वासियों के साथ यांत्रिक समानांतरता से बचता है।
- source_word: πάθος / “passion” (Greek review pending)
  choice: दुःखभोग
  rationale: मसीह की पीड़ा और मृत्यु से संबंधित प्राचीन मसीही अर्थ को गरिमापूर्ण एवं परिचित हिन्दी में व्यक्त करता है।
- source_word: ἑκουσίως / “of our own free choice” (Greek review pending)
  choice: अपनी स्वतंत्र इच्छा से
  rationale: स्वेच्छा और उत्तरदायित्व के भाव को स्पष्ट रखता है, बिना किसी विस्तृत दार्शनिक सिद्धांत को आरोपित किए।
theological_decisions:
- issue: ‘through whom’ का संबंध
  choice: ‘उन्हीं के द्वारा’ को यीशु मसीह के संदर्भ में रखा गया
  alternative: इसे छाप धारण करने की क्रिया या परमेश्वर पिता से जोड़ना
  rationale: निकटतम पूर्ववर्ती ‘यीशु मसीह’ है और उपलब्ध अंग्रेज़ी साक्ष्य यही संबंध सुझाता है; फिर भी यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है।
- issue: ‘die unto his passion’ का अर्थ
  choice: ‘उनके दुःखभोग के अनुरूप मरना’
  alternative: ‘उनके दुःखभोग के लिए मरना’ या ‘उनके दुःखभोग में मरना’
  rationale: यह रूप मसीह के दुःखभोग के साथ स्वैच्छिक अनुरूपता/सहभागिता की कठिन अभिव्यक्ति को पूरी तरह किसी एक सिद्धान्त में नहीं समेटता।
- issue: विश्वासियों पर पिता की छाप
  choice: प्रेम में, यीशु मसीह के द्वारा, परमेश्वर पिता की छाप
  alternative: ‘यीशु मसीह के द्वारा प्रेम में परमेश्वर पिता की छाप’
  rationale: विराम-चिह्न ‘प्रेम में’ को विश्वासयोग्य लोगों की अवस्था के रूप में खुला रखता है, जैसा उपलब्ध साक्ष्य में है, और संभावित संबंध को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मुद्रा और छाप का रूपक सुरक्षित रखा गया है। अंतिम दीर्घ डैश मूल साक्ष्य में अगले खंड तक वाक्य के जारी रहने का संकेत बनाए रखता है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित है।
