base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/015.yaml
  text: 'None of these things is hidden from you, if you are complete in your faith and love toward Jesus Christ, for these are the beginning and end of life—faith is the beginning and love is the end. The two, found in unity, are God, while everything else follows in their train toward true nobility.


    No one who professes faith sins, and no one who possesses love hates. The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions. For the Work is not now a matter of profession, but is seen when someone is found in the power of faith to the end.'
translation:
  language: hi
  text: 'यदि यीशु मसीह के प्रति तुम्हारा विश्वास और प्रेम परिपूर्ण है, तो इनमें से कोई भी बात तुमसे छिपी नहीं है; क्योंकि यही जीवन का आरंभ और अंत हैं—विश्वास आरंभ है और प्रेम अंत। और ये दोनों जब एकता में पाए जाते हैं, तो परमेश्वर हैं,[a] जबकि बाकी सब कुछ इनके पीछे-पीछे सच्ची श्रेष्ठता की ओर बढ़ता है।


    जो विश्वास का अंगीकार करता है, वह पाप नहीं करता; और जिसमें प्रेम है, वह घृणा नहीं करता। पेड़ अपने फल से प्रकट होता है; इसी प्रकार जो अपने को मसीह का बताते हैं, वे अपने कामों से पहचाने जाएँगे। क्योंकि अब यह कार्य केवल अंगीकार की बात नहीं है; बल्कि वह तब दिखाई देता है, जब कोई अंत तक विश्वास की सामर्थ्य में स्थिर पाया जाता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक और धर्मवैज्ञानिक रूप से कठिन कथन: “ये दोनों जब एकता में पाए जाते हैं, तो परमेश्वर हैं।” उपलब्ध साक्ष्य के अनुसार इसे बिना सामंजस्यकारी विस्तार के रखा गया है।'
    reason: मूल यूनानी की प्रत्यक्ष समीक्षा लंबित होने और कथन की वास्तविक अस्पष्टता के कारण पाठक को सचेत करना आवश्यक है।
  - marker: b
    text: “विश्वास की सामर्थ्य में” और “अंत तक” का यह रूप उपलब्ध अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित है।
    reason: वाक्य के अंतिम पदबंध की संरचना और बल के बारे में स्रोतगत सीमा स्पष्ट करना।
lexical_decisions:
- source_word: perfect / complete
  choice: परिपूर्ण
  rationale: यह विश्वास और प्रेम की पूर्णता या परिपक्वता का भाव रखता है और स्रोत-साक्ष्य की शर्तात्मक भाषा बनाए रखता है।
- source_word: professing faith
  choice: विश्वास का अंगीकार करता है
  rationale: ‘अंगीकार’ सार्वजनिक रूप से विश्वास मानने या घोषित करने का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: true nobility
  choice: सच्ची श्रेष्ठता
  rationale: यह नैतिक उत्कृष्टता की दिशा को व्यक्त करता है, बिना इसे सामाजिक कुलीनता तक सीमित किए।
- source_word: the Work
  choice: यह कार्य
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के बड़े अक्षर को सिद्धान्तगत विशिष्ट पद न बनाते हुए निकट रूप में रखा गया है; यूनानी समीक्षा लंबित है।
- source_word: power of faith
  choice: विश्वास की सामर्थ्य
  rationale: स्रोत की शक्तिशाली और सक्रिय धारणा को बनाए रखने वाला सीधा, स्वाभाविक रूप।
theological_decisions:
- issue: ‘the two being found in unity are God’ का असामान्य कथन
  choice: ‘ये दोनों जब एकता में पाए जाते हैं, तो परमेश्वर हैं’
  alternative: ‘इन दोनों की एकता में परमेश्वर होता है’
  rationale: उपलब्ध साक्ष्य की वास्तविक धर्मवैज्ञानिक कठिनाई और अस्पष्टता को नरम या सामंजस्यपूर्ण बनाकर नहीं बदला गया।
- issue: ‘जो विश्वास का अंगीकार करता है, वह पाप नहीं करता’ की निरपेक्ष भाषा
  choice: निरपेक्ष कथन को यथावत रखा
  alternative: ‘वह पाप में बना नहीं रहता’
  rationale: स्रोत-साक्ष्य में दी गई तीखी नैतिक उक्ति को किसी बाद की व्याख्यात्मक धर्मशास्त्रीय भाषा से सीमित नहीं किया गया।
- issue: ‘अंत तक’ का संबंध
  choice: विश्वास की सामर्थ्य में अंत तक स्थिर पाए जाने से जोड़ा
  alternative: कार्य का अंत तक दिखाई देना
  rationale: अंग्रेज़ी साक्ष्य की वाक्य-रचना के अनुसार व्यक्ति की स्थिरता प्रमुख है, यद्यपि यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी शेष है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। ‘तुम्हारा/तुमसे’ बहुवचन समुदाय-संबोधन के रूप में प्रयुक्त है। मसौदा मध्य-पाठ-परंपरा के सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण कठिन धर्मवैज्ञानिक और वाक्यगत स्थानों को समतल नहीं किया गया।
