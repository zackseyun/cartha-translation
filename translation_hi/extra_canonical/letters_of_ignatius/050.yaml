base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/050.yaml
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
translation:
  language: hi
  text: 'इसलिए उन निकृष्ट अंकुरों से दूर रहो जो घातक फल उत्पन्न करते हैं। यदि कोई उसका स्वाद चख ले, तो वह तुरंत मर जाता है। क्योंकि ये लोग पिता के लगाए हुए पौधे नहीं हैं।


    यदि वे होते, तो वे क्रूस की डालियाँ दिखाई देते और उनका फल अविनाशी होता—उस क्रूस की डालियाँ, जिसके द्वारा वह अपने दुःख-भोग के माध्यम से हमें बुलाता है, क्योंकि हम उसके अंग हैं। सिर अंगों के बिना नहीं हो सकता, क्योंकि परमेश्वर एकता की प्रतिज्ञा करता है, और यह एकता वह स्वयं है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित प्रारूप है; मध्य-पाठीय यूनानी परंपरा से प्रत्यक्ष जाँच अभी शेष है। विशेषकर अंतिम वाक्य की शब्दावली और वाक्य-संबंध की पुष्टि आवश्यक है।
    reason: प्रदत्त स्रोत-विवरण के अनुसार यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है; पाठक को इस पाठ-साक्ष्य संबंधी सीमा से अवगत कराना आवश्यक है।
lexical_decisions:
- source_word: vile offshoots
  choice: निकृष्ट अंकुर
  rationale: वनस्पति-रूपक को बनाए रखते हुए नैतिक निंदा का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: deadly fruit
  choice: घातक फल
  rationale: मृत्यु उत्पन्न करने वाले फल की तीव्रता और मूल रूपक दोनों सुरक्षित हैं।
- source_word: the Father’s planting
  choice: पिता के लगाए हुए पौधे
  rationale: रोपण/पौध लगाने की क्रिया और पिता से संबंध को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: branches of the Cross
  choice: क्रूस की डालियाँ
  rationale: क्रूस से जुड़े वृक्ष-रूपक को असामान्य होते हुए भी जानबूझकर अक्षुण्ण रखा गया है।
- source_word: passion
  choice: दुःख-भोग
  rationale: मसीह की पीड़ा और मृत्यु से संबंधित पारंपरिक अर्थ को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: members
  choice: अंग
  rationale: शरीर और सिर के अगले रूपक के साथ सीधा संबंध बनाए रखता है।
- source_word: union
  choice: एकता
  rationale: संघ/मिलन की अपेक्षा यहाँ कलीसियाई और दैवी एकत्व की व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: “He” का संदर्भ
  choice: मसीह-संबंधी संदर्भ को छोटे अक्षर वाले ‘वह/उसके’ से व्यक्त किया
  alternative: नाम जोड़कर ‘मसीह’ कहना
  rationale: साक्ष्य में सर्वनाम ही है; नाम जोड़कर संदर्भ को आवश्यकता से अधिक स्पष्ट नहीं किया गया।
- issue: क्रूस के द्वारा बुलाने और उसके अंग होने का संबंध
  choice: दोनों कथनों को साथ रखा, पर कारणसूचक ‘क्योंकि’ से पठनीय संबंध दिखाया
  alternative: ‘हमें, जो उसके अंग हैं, बुलाता है’
  rationale: हिन्दी में स्वाभाविकता बढ़ती है, जबकि यह तनाव सुरक्षित रहता है कि बुलाए जाने वाले पहले से उसके अंग कहे गए हैं।
- issue: ‘यह एकता वह स्वयं है’
  choice: व्यक्तिगत और दैवी पहचान का कथन यथावत रखा
  alternative: ‘वह स्वयं इस एकता का आधार है’
  rationale: वैकल्पिक रूप मूल के प्रबल पहचान-विधान को व्याख्यात्मक ढंग से कमजोर कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। कृषि, वृक्ष और शरीर के परस्पर जुड़े रूपकों को सरल बनाने के बजाय सुरक्षित रखा गया है।
