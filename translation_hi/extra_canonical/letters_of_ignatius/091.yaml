base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/091.yaml
  text: 'I welcome your godly mind, grounded as though on an immovable rock, and I give exceedingly great glory that I have been granted the privilege of seeing your blameless face,


    of which I long to have joy in God. I urge you in the grace with which you are clothed to press forward in your course and to urge everyone that they may be saved. Vindicate your office with all diligence of flesh and spirit. Be concerned for unity, than which there is nothing better. Bear with everyone, just as the Lord also bears with you. Endure everyone in love, as indeed you do.


    Devote yourself to unceasing prayers. Ask for greater wisdom than you have. Be watchful, and keep your spirit from falling asleep. Speak to each person individually after the manner of God. Bear the illnesses of all, like a perfect athlete. Where there is more toil, there is much gain.'
translation:
  language: hi
  text: 'आपके उस भक्तिमय मन का स्वागत करते हुए, जो मानो अचल चट्टान पर दृढ़ता से टिका है, मैं परमेश्वर की अत्यन्त महिमा करता हूँ कि मुझे आपका निष्कलंक मुख देखने का सौभाग्य दिया गया—


    ऐसा मुख, जिसे देखकर मैं परमेश्वर में आनन्दित होते रहना चाहता हूँ। जिस अनुग्रह को आपने वस्त्र के समान धारण किया है, उसी में मैं आपसे आग्रह करता हूँ कि अपनी दौड़ में आगे बढ़ते रहें और सबको प्रोत्साहित करें, ताकि वे उद्धार पाएँ। तन और मन की पूरी लगन से अपने पद को सार्थक सिद्ध करें। एकता की चिन्ता करें, क्योंकि उससे उत्तम कुछ भी नहीं। सबको सहारा दें, जैसे प्रभु भी आपको सहारा देता है। प्रेम में सबको सहते रहें, जैसा कि आप करते भी हैं।


    निरन्तर प्रार्थना में लगे रहें। आपके पास जितनी बुद्धि है, उससे भी अधिक माँगें। जागते रहें और अपनी आत्मा को ऊँघने न दें। हर व्यक्ति से अलग-अलग, परमेश्वर के अनुरूप रीति से बात करें। एक सिद्ध खिलाड़ी की तरह सबकी दुर्बलताओं को उठाएँ।[a] जहाँ परिश्रम अधिक है, वहाँ लाभ भी बहुत है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दुर्बलताओं” का अनुवाद “रोगों” या “कमज़ोरियों” के रूप में भी किया जा सकता है।
    reason: अंग्रेज़ी साक्ष्य का ‘maladies’ शारीरिक रोग और व्यापक मानवीय कमज़ोरी—दोनों अर्थों की सम्भावना रखता है; प्रत्यक्ष यूनानी समीक्षा अभी लंबित है।
lexical_decisions:
- source_word: godly mind (Greek review pending)
  choice: भक्तिमय मन
  rationale: यह अभिव्यक्ति परमेश्वर की ओर उन्मुख मनोभाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है, बिना इसे किसी विशिष्ट सैद्धान्तिक पद में बदलने के।
- source_word: immovable rock
  choice: अचल चट्टान
  rationale: मूल रूपक और दृढ़ता का भाव दोनों सुरक्षित रहते हैं।
- source_word: grace ... clothed
  choice: जिस अनुग्रह को आपने वस्त्र के समान धारण किया है
  rationale: ‘अनुग्रह’ का धार्मिक अर्थ और पहनाए जाने का रूपक दोनों स्पष्ट रखे गए हैं।
- source_word: vindicate thine office
  choice: अपने पद को सार्थक सिद्ध करें
  rationale: ‘पद’ दायित्वपूर्ण स्थान को व्यक्त करता है; ‘सार्थक सिद्ध करें’ पद के योग्य आचरण द्वारा उसे प्रमाणित करने का भाव रखता है, पर अधिकार-सिद्धान्त को अनावश्यक रूप से नहीं जोड़ता।
- source_word: diligence of flesh and spirit
  choice: तन और मन की पूरी लगन से
  rationale: मुहावरेदार हिन्दी में व्यक्ति के बाहरी और भीतरी समर्पण का समग्र भाव देता है; ‘मन’ यहाँ अंग्रेज़ी साक्ष्य के ‘spirit’ का सहज संदर्भानुकूल रूप है।
- source_word: union
  choice: एकता
  rationale: सामुदायिक मेल और अखंडता का व्यापक अर्थ रखता है, बिना संस्थागत अर्थ थोपे।
- source_word: bear
  choice: सहारा दें / सहते रहें / उठाएँ
  rationale: 'अलग-अलग प्रसंगों में एक ही भार-वहन संबंधी अर्थ-क्षेत्र को स्वाभाविक हिन्दी में व्यक्त किया गया है: लोगों को थामना, धैर्यपूर्वक सहना और उनकी दुर्बलताओं का भार उठाना।'
- source_word: perfect athlete
  choice: सिद्ध खिलाड़ी
  rationale: प्रशिक्षित, परिपक्व और लक्ष्य तक पहुँचे हुए प्रतियोगी का रूपक सुरक्षित रहता है; ‘सिद्ध’ नैतिक परिपक्वता की सम्भावना भी खुली रखता है।
- source_word: maladies
  choice: दुर्बलताओं
  rationale: संदर्भ में केवल शारीरिक रोग नहीं, बल्कि व्यापक मानवीय कमज़ोरियाँ भी सम्भव हैं; इसीलिए अधिक समावेशी शब्द चुना गया और पादटिप्पणी में विकल्प बताया गया है।
theological_decisions:
- issue: उद्धार में मानवीय प्रोत्साहन और दैवी निष्क्रिय क्रिया का सम्बन्ध
  choice: सबको प्रोत्साहित करें, ताकि वे उद्धार पाएँ
  alternative: सबका उद्धार करें
  rationale: निष्क्रिय ‘उद्धार पाएँ’ उद्धार के कर्ता को अनिर्दिष्ट रखता है और लेखक के प्रोत्साहन को साधन के रूप में प्रस्तुत करता है; इससे मनुष्य को अंतिम उद्धारकर्ता नहीं बनाया जाता।
- issue: प्रभु द्वारा लोगों को सहने का अर्थ
  choice: जैसे प्रभु भी आपको सहारा देता है
  alternative: जैसे प्रभु भी आपको सहता है
  rationale: ‘सहारा देता है’ संरक्षण और भार-वहन का सकारात्मक भाव रखता है। निकटवर्ती अगला वाक्य धैर्यपूर्वक सहने का अर्थ अलग से व्यक्त करता है।
- issue: परमेश्वर के अनुरूप बोलना
  choice: परमेश्वर के अनुरूप रीति से बात करें
  alternative: परमेश्वर की ओर से बात करें
  rationale: यह चयन दैवी प्रतिनिधित्व या प्रत्यक्ष प्रेरणा का अनावश्यक दावा नहीं करता और आचरण की ईश्वरानुकूल रीति का खुला अर्थ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक एकवचन ‘आप’ अपनाया गया है। शैली पत्रात्मक, प्रेरक और गरिमापूर्ण रखी गई है। अनुच्छेद-विराम प्रदत्त साक्ष्य के अनुसार सुरक्षित है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और ऑडिट किए गए अंग्रेज़ी परामर्श-पाठ पर आधारित है; मध्य-पाठ यूनानी परम्परा की प्रत्यक्ष समीक्षा लंबित होने के कारण सूक्ष्म शब्दार्थ संबंधी निष्कर्ष अस्थायी हैं।
