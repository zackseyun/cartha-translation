base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/023.yaml
  text: Ignatius, who is also called Theophorus, to her who has been blessed through the grace of God the Father in Christ Jesus our Savior, in whom I salute the church in Magnesia on the Maeander, and I wish her abundant greeting in God the Father and in Jesus Christ.
translation:
  language: hi
  text: इग्नातियुस, जो थिओफोरुस भी कहलाता है, उस कलीसिया के नाम जो हमारे उद्धारकर्ता मसीह यीशु में परमेश्वर पिता के अनुग्रह के द्वारा आशीषित हुई है। मैं माएन्दर नदी के किनारे बसे मग्नेसिया की इस कलीसिया को मसीह यीशु में नमस्कार करता हूँ और परमेश्वर पिता तथा यीशु मसीह में उसके लिए भरपूर आनंद की कामना करता हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी रूप है; मध्य-पाठ-परंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: उपयोगकर्ता द्वारा दिए गए स्रोत-विवरण में यूनानी स्रोत-भाषा समीक्षा लंबित बताई गई है; इसलिए पाठ की आधार-सीमा पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: Theophorus
  choice: थिओफोरुस
  rationale: उपनाम को अर्थानुवाद करने के बजाय ध्वन्यात्मक रूप में रखा गया है, क्योंकि उपलब्ध अंग्रेज़ी साक्ष्य उसका अर्थ स्पष्ट नहीं करता और यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
- source_word: church
  choice: कलीसिया
  rationale: आरंभिक मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित और गरिमापूर्ण शब्द।
- source_word: abundant greeting
  choice: भरपूर आनंद की कामना
  rationale: पत्र-अभिवादन की स्वाभाविक हिन्दी अभिव्यक्ति; यह केवल साधारण नमस्कार की पुनरावृत्ति से बचते हुए प्रचुर शुभकामना का भाव व्यक्त करती है।
- source_word: Magnesia on the Maeander
  choice: माएन्दर नदी के किनारे बसे मग्नेसिया
  rationale: स्थान-संबंध को सामान्य पाठक के लिए स्पष्ट और स्वाभाविक बनाया गया है।
theological_decisions:
- issue: पिता के अनुग्रह और मसीह में आशीषित होने का संबंध
  choice: हमारे उद्धारकर्ता मसीह यीशु में परमेश्वर पिता के अनुग्रह के द्वारा आशीषित
  alternative: परमेश्वर पिता के उस अनुग्रह के द्वारा आशीषित, जो हमारे उद्धारकर्ता मसीह यीशु में है
  rationale: उपलब्ध साक्ष्य की संरचना को निकटता से रखते हुए अनुग्रह के साधन और मसीह में स्थिति—दोनों को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- issue: अंतिम अभिवादन में पिता और यीशु मसीह
  choice: परमेश्वर पिता तथा यीशु मसीह में
  alternative: परमेश्वर पिता और यीशु मसीह की ओर से
  rationale: मूल साक्ष्य के ‘in’ को ‘की ओर से’ बनाकर संबंध को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पत्रात्मक शैली अपनाई गई है। लंबे अंग्रेज़ी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘कलीसिया’ को स्त्रीलिंग सामुदायिक इकाई मानते हुए संबोधन स्वाभाविक हिन्दी रूप में दिया गया है।
