base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/046.yaml
  text: 'Therefore, be on your guard against such people. And this will certainly be so, if you are not puffed up and if you remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles.


    Whoever is inside the sanctuary is clean, but whoever is outside the sanctuary is not clean. That is, whoever does anything without the bishop, presbytery, and deacons is not clean in his conscience.'
translation:
  language: hi
  text: 'इसलिए ऐसे लोगों से सावधान रहो। और ऐसा निश्चय ही होगा, यदि तुम घमंड से न फूलो और [परमेश्वर] यीशु मसीह, बिशप, और प्रेरितों की विधियों से अविभाज्य रूप से जुड़े रहो।


    जो वेदी के भीतर है, वह शुद्ध है; पर जो वेदी के बाहर है, वह शुद्ध नहीं है। अर्थात, जो कोई बिशप, प्राचीनों की परिषद, और डेकनों के बिना कुछ करता है, वह अपने विवेक में शुद्ध नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: परमेश्वर
    text: कोष्ठक प्रदत्त अंग्रेज़ी साक्ष्य में उपस्थित पाठगत संकेत को सुरक्षित रखते हैं; इन्हें यहाँ पाठ-निर्णय के रूप में नहीं समझना चाहिए.
    reason: ब्रैकेटयुक्त शब्द की अनिश्चित पाठगत स्थिति को अनुवाद में बनाए रखना।
lexical_decisions:
- source_word: puffed up
  choice: घमंड से फूलो
  rationale: मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: bishop
  choice: बिशप
  rationale: दूसरी शताब्दी के विशिष्ट कलीसियाई पद के लिए प्रचलित और अपेक्षाकृत तटस्थ ऐतिहासिक पद।
- source_word: presbytery
  choice: प्राचीनों की परिषद
  rationale: यहाँ किसी आधुनिक संप्रदाय का नाम नहीं, बल्कि प्राचीनों के सामूहिक निकाय का संकेत है।
- source_word: deacons
  choice: सेवकों
  rationale: पद के सेवामूलक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि यह औपचारिक कलीसियाई सेवकों को संदर्भित करता है।
- source_word: sanctuary
  choice: पवित्रस्थान
  rationale: भीतर-बाहर और शुद्ध-अशुद्ध की धार्मिक उपमा को सुरक्षित रखता है।
- source_word: ordinances
  choice: विधानों
  rationale: प्रेरितों द्वारा स्थापित निर्देशों या व्यवस्थाओं का व्यापक अर्थ बनाए रखता है; इसे केवल संस्कारों तक सीमित नहीं करता।
theological_decisions:
- issue: '[God] की पाठगत स्थिति'
  choice: '[परमेश्वर] को कोष्ठकों में रखा गया'
  alternative: कोष्ठक हटाकर परमेश्वर को निर्विवाद मूल पाठ मानना, या शब्द छोड़ देना
  rationale: प्रदत्त साक्ष्य में कोष्ठक पाठगत अनिश्चितता का संकेत हैं; उसे बिना समाधान किए सुरक्षित रखा गया है।
- issue: पवित्रस्थान की उपमा
  choice: उपमा को शाब्दिक रूप में बनाए रखा
  alternative: इसे सीधे कलीसिया की सदस्यता या उद्धार के कथन के रूप में व्याख्यायित करना
  rationale: लेखक स्वयं अगले वाक्य में संस्थागत आशय स्पष्ट करता है; अनुवाद अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: विवेक की शुद्धता और पदाधिकारियों के साथ कार्य करना
  choice: मूल के कठोर नैतिक-कलीसियाई संबंध को यथावत रखा
  alternative: कथन को केवल सुव्यवस्था की सलाह के रूप में नरम करना
  rationale: स्रोत में उपस्थित धर्मवैज्ञानिक तनाव को शांत या संप्रदायगत ढंग से पुनर्परिभाषित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष उपदेशात्मक शैली अपनाई गई है। बहुवचन संबोधन के लिए ‘तुम’ रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी स्रोत-परीक्षण लंबित होने के कारण जहाँ साक्ष्य अनिश्चित है वहाँ अनिश्चितता को सुरक्षित रखा गया है।
