  source_fidelity: 'The draft materially weakens the conditional assurance: “will surely be” is rendered as “निश्चय ही संभव होगा” (“will certainly be possible”), which is not supported. More importantly, the Greek term behind the supplied witness’s “sanctuary” is θυσιαστήριον, “altar”; “पवित्रस्थान” is therefore too broad and obscures the specific cultic image. The bracketed [God] appropriately preserves the witness’s textual signal.'
  naturalness: The imperative style and plural “तुम” are natural. “ऐसा निश्चय ही होगा” is preferable to “निश्चय ही संभव होगा.” “अविभाज्य रूप से जुड़े रहो” naturally expresses “remain inseparable.”
  terminology: “बिशप” suitably retains the historical office. “प्राचीनों की परिषद” clearly conveys presbytery as a corporate body. “डेकनों” retains the corresponding office more precisely than the generic “सेवकों.” “वेदी” is required for θυσιαστήριον. “विधियों” is a natural rendering of “ordinances” without restricting the term to sacraments.
  issues:
  - severity: high
    issue: “will surely be” rendered as “निश्चय ही संभव होगा”
    rationale: “संभव होगा” introduces mere possibility where the source asserts certainty.
  - severity: high
    issue: “sanctuary” rendered as “पवित्रस्थान”
    rationale: The underlying Greek θυσιαστήριον denotes an altar. “वेदी” preserves the concrete image and is more source-faithful.
  - severity: medium
    issue: “deacons” rendered as generic “सेवकों”
    rationale: In a coordinated list of ecclesial offices, generic servants can lose the formal office denoted by διάκονοι.
