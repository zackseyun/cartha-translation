base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
translation:
  language: hi
  text: 'स्मुरना से मैं तुम्हें नमस्कार कहता हूँ। परमेश्वर की जो कलीसियाएँ यहाँ मेरे साथ हैं, वे भी तुम्हें नमस्कार कहती हैं। उनके लोगों ने हर प्रकार से—शरीर और आत्मा दोनों में—मुझे नई शक्ति दी है।


    मेरी ये बेड़ियाँ, जिन्हें मैं यीशु मसीह के कारण पहने फिरता हूँ, तुम्हें समझाती हैं। मैं विनती करता हूँ कि मैं परमेश्वर तक पहुँच सकूँ। तुम आपसी मेल और एक-दूसरे के लिए प्रार्थना में बने रहो। तुममें से प्रत्येक को, और विशेषकर प्राचीनों को, अपने बिशप के मन को उत्साहित करना चाहिए, ताकि पिता का [और] यीशु मसीह तथा प्रेरितों का सम्मान हो।[a]


    मैं प्रार्थना करता हूँ कि तुम प्रेम से मेरी बात सुनो, कहीं ऐसा न हो कि यह लिखने के कारण मैं तुम्हारे विरुद्ध गवाह बनूँ। तुम भी मेरे लिए प्रार्थना करो, क्योंकि परमेश्वर की दया में मुझे तुम्हारे प्रेम की आवश्यकता है, ताकि मुझे वह भाग पाने योग्य ठहराया जाए जिसे पाने के लिए मैं उत्सुक हूँ, और मैं अयोग्य न पाया जाऊँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिया गया ‘और’ उपलब्ध अंग्रेज़ी साक्ष्य में पाठ-पुनर्स्थापन का संकेत है। यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: स्रोत-सामग्री में मौजूद वर्गाकार कोष्ठकों के पाठगत संकेत को पाठक के लिए स्पष्ट करना आवश्यक है।
