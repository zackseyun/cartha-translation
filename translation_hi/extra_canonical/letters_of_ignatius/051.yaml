source:
  text: 'I salute you from Smyrna, together with the churches of God that are present with me; men who refreshed me in all ways both in flesh and in spirit.


    My bonds exhort you, which for Jesus Christ''s sake I bear about, entreating that I may attain unto God; abide ye in your concord and in prayer one with another. For it becometh you severally, and more especially the presbyters, to cheer the soul of your bishop unto the honor of the Father [and to the honor] of Jesus Christ and of the Apostles.


    I pray that ye may hearken unto me in love, lest I be for a testimony against you by having so written. And pray ye also for me who have need of your love in the mercy of God, that I may be vouchsafed the lot which I am eager to attain, to the end that I be not found reprobate.'
