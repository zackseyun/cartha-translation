base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/048.yaml
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
translation:
  language: hi
  text: 'इसलिए, जब कोई तुमसे यीशु मसीह से अलग होकर बोले, तो बहरे हो जाओ। वे दाऊद के वंश से और मरियम से जन्मे थे। उन्होंने सचमुच जन्म लिया, खाया और पिया। पोंतियुस पिलातुस के अधीन उन्हें सचमुच सताया गया। उन्हें सचमुच क्रूस पर चढ़ाया गया और वे मर गए—स्वर्ग में रहनेवालों, पृथ्वी पर रहनेवालों और पृथ्वी के नीचे रहनेवालों की आँखों के सामने।


    फिर वे सचमुच मरे हुओं में से जिलाए गए, क्योंकि उनके पिता ने उन्हें जिलाया। उसी प्रकार उनके पिता हम लोगों को भी, जो उन पर विश्वास करते हैं, मसीह यीशु में जिलाएँगे—हाँ, उनके पिता ही हमें जिलाएँगे। मसीह यीशु से अलग हमारा सच्चा जीवन नहीं है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Be ye deaf
  choice: उसके लिए बहरे बन जाओ
  rationale: 'मूल साक्ष्य के तीखे श्रवण-रूपक को बनाए रखते हुए हिन्दी में उसका आशय स्पष्ट किया गया है: ऐसी शिक्षा को ग्रहण न करना।'
- source_word: of the race of David
  choice: दाऊद के वंश से
  rationale: वंशगत संबंध को सहज और पारंपरिक हिन्दी में व्यक्त करता है; ‘जाति’ से उत्पन्न होनेवाली आधुनिक अस्पष्टता से बचता है।
- source_word: truly
  choice: सचमुच
  rationale: जन्म, दुःखभोग, क्रूस-मृत्यु और पुनरुत्थान की वास्तविकता पर बार-बार दिए गए बल को सुरक्षित रखता है।
- source_word: under Pontius Pilate
  choice: पोंतियुस पिलातुस के समय
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के ऐतिहासिक-कालगत अर्थ को स्वाभाविक हिन्दी में प्रस्तुत करता है; यूनानी स्रोत की प्रत्यक्ष समीक्षा होने तक ‘शासन में’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ी गई।
- source_word: those under the earth
  choice: पृथ्वी के नीचे रहनेवाले
  rationale: त्रिस्तरीय ब्रह्मांडीय अभिव्यक्ति को बिना यह तय किए बनाए रखता है कि संकेत मृतकों, अधोलोक के प्राणियों या किसी अन्य वर्ग की ओर है।
- source_word: raised from the dead
  choice: मरे हुओं में से जिलाए गए
  rationale: पुनरुत्थान की क्रिया और पिता की सक्रिय भूमिका दोनों को स्पष्ट रखता है।
- source_word: true life
  choice: सच्चा जीवन
  rationale: ‘वास्तविक’ की अपेक्षा धार्मिक और अस्तित्वगत अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है, पर उसे ‘अनन्त जीवन’ बनाकर अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ‘यीशु मसीह से अलग’ वाक्यांश का संबंध
  choice: जब कोई यीशु मसीह से अलग कोई बात कहे
  alternative: जब कोई तुमसे यीशु मसीह के बिना बोले
  rationale: उपलब्ध साक्ष्य की अस्पष्टता को काफी हद तक बनाए रखते हुए इसे ऐसी शिक्षा के रूप में प्रस्तुत किया गया है जो मसीह से कटी हुई है; इसे केवल ‘मसीह के विरुद्ध’ नहीं बनाया गया।
- issue: पिता द्वारा विश्वासियों को जिलाना
  choice: उनके पिता हम लोगों को भी...मसीह यीशु में जिलाएँगे
  alternative: उनके पिता, जो मसीह यीशु में हैं, हम विश्वासियों को भी जिलाएँगे
  rationale: ‘मसीह यीशु में’ को जिलाए जाने के ढाँचे से जोड़ा गया है, जैसा उपलब्ध अंग्रेज़ी साक्ष्य में सबसे स्वाभाविक है; वाक्य-विन्यास की संभावित वैकल्पिक संबद्धता को सिद्धांतगत रूप से निर्णायक नहीं बनाया गया।
- issue: ‘पृथ्वी के नीचे रहनेवाले’ की पहचान
  choice: पहचान को खुला रखा गया
  alternative: मृतक अथवा अधोलोक के प्राणी
  rationale: पाठ स्वयं इस समूह की स्पष्ट पहचान नहीं करता, इसलिए किसी विशिष्ट परलोक-सिद्धांत को अनुवाद में नहीं डाला गया।
