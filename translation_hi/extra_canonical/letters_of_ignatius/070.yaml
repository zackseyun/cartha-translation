base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/070.yaml
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
translation:
  language: hi
  text: 'पर यदि कोई तुम्हें यहूदी धर्म की शिक्षा दे, तो उसकी बात मत सुनो; क्योंकि किसी खतना किए हुए व्यक्ति से मसीही धर्म की बात सुनना, किसी खतनारहित व्यक्ति से यहूदी धर्म की बात सुनने से अच्छा है। पर यदि दोनों में से कोई भी यीशु मसीह के विषय में नहीं बोलता, तो मेरी दृष्टि में वे समाधि-शिलाओं और मृतकों की कब्रों के समान हैं, जिन पर केवल लोगों के नाम खुदे होते हैं।


    इसलिए इस संसार के शासक की दुष्ट चालों और षड्यंत्रों से दूर रहो, कहीं ऐसा न हो कि उसकी युक्तियाँ तुम्हें कुचल दें और तुम अपने प्रेम में निर्बल पड़ जाओ। बल्कि तुम सब एक अविभाजित हृदय से एकत्र हुआ करो। और


    मैं अपने परमेश्वर को धन्यवाद देता हूँ कि तुम्हारे साथ अपने व्यवहार में मेरा विवेक शुद्ध है। कोई भी, न गुप्त रूप से न खुले रूप से, यह दावा नहीं कर सकता कि मैं किसी पर न छोटी बात में बोझ बना, न बड़ी बात में। और जिन सब लोगों से मैंने बात की, उन सबके लिए मेरी प्रार्थना है कि वे इसे अपने ही विरुद्ध गवाही न बना लें।'
