lexical_decisions:
- source_word: Judaism
  choice: यहूदी धर्म
  rationale: यहाँ किसी जातीय पहचान के बजाय प्रस्तुत की जा रही धार्मिक शिक्षा या व्यवस्था का संकेत है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: Christianity
  choice: मसीही विश्वास
  rationale: ‘मसीही धर्म’ संभव है, पर इस आरंभिक ऐतिहासिक संदर्भ में ‘विश्वास’ जीवित संदेश और जीवन-पद्धति का व्यापक भाव रखता है तथा बाद की संस्थागत ध्वनि कम करता है।
- source_word: circumcised / uncircumcised
  choice: खतना किया हुआ / खतनारहित
  rationale: मूल विरोध को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखता है।
- source_word: tombstones and graves of the dead
  choice: कब्र के पत्थरों और मृतकों की कब्रों
  rationale: दोनों समानांतर बिंबों को बनाए रखा गया है, भले ही हिन्दी में उनमें अर्थगत निकटता हो।
- source_word: prince of this world
  choice: इस संसार का शासक
  rationale: ‘prince’ का आशय यहाँ राजनीतिक पदवी से अधिक आधिपत्य रखने वाला शासक है; ‘शासक’ आधुनिक हिन्दी में स्वाभाविक है और पारंपरिक धार्मिक संकेत भी बचाता है।
- source_word: undivided heart
  choice: अविभाजित हृदय
  rationale: सामूहिक एकचित्तता के रूपक को औपचारिक किंतु बोधगम्य हिन्दी में सुरक्षित रखता है।
- source_word: good conscience
  choice: विवेक शुद्ध है
  rationale: शाब्दिक ‘अच्छा विवेक’ की तुलना में यह हिन्दी में स्वाभाविक है और निर्दोष आचरण के दावे को व्यक्त करता है।
- source_word: among whom I spoke
  choice: जिन-जिन लोगों के बीच मैंने वचन सुनाया
  rationale: केवल सामान्य बातचीत के बजाय सार्वजनिक धार्मिक वक्तव्य का संदर्भ संभावित है; ‘वचन’ इसे संक्षेप में दर्शाता है, यद्यपि स्रोत-भाषा समीक्षा लंबित है।
theological_decisions:
- issue: खतना और धार्मिक संदेश के बीच संबंध
  choice: व्यक्ति की खतना-स्थिति और उसके द्वारा दिए गए संदेश के बीच मूल का विरोध ज्यों का त्यों रखा गया है।
  alternative: वाक्य को यह अर्थ देकर समझाना कि जातीय पहचान सर्वथा अप्रासंगिक है।
  rationale: पाठ स्वयं एक तीखा तुलनात्मक कथन करता है; उसके निहितार्थ को व्यवस्थित सिद्धांत में बदलना उचित नहीं।
- issue: ‘इस संसार का शासक’ की पहचान
  choice: उपाधि को बिना नाम बताए रखा गया है।
  alternative: सीधे ‘शैतान’ कहना।
  rationale: संदर्भ संभवतः शैतानी विरोध की ओर संकेत करता है, पर पाठ की रूपकात्मक उपाधि और उसकी साहित्यिक प्रतिध्वनि सुरक्षित रहनी चाहिए।
- issue: यीशु मसीह के विषय में न बोलने वालों का बहुवचन संदर्भ
  choice: ‘दोनों में से कोई भी... वे’ द्वारा सामूहिक निष्कर्ष रखा गया है।
  alternative: हर व्यक्ति को अलग-अलग एकवचन में प्रस्तुत करना।
  rationale: साक्षी में दोनों वर्गों पर एक साथ निर्णय आता है; हिन्दी में अर्थ स्पष्ट रखने के लिए यह स्वाभाविक संरचना है।
- issue: अंतिम ‘गवाही’ का अर्थ
  choice: ‘उसे अपने ही विरुद्ध गवाही न बना लें’ के रूप में अस्पष्टता बनाए रखी गई है।
  alternative: स्पष्ट करना कि इग्नातियुस का उपदेश न्याय के दिन उन्हें दोषी ठहराएगा।
  rationale: संभावित न्यायिक या अंतिम न्याय संबंधी संकेत है, पर उपलब्ध साक्षी इसे पूर्णतः स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है और प्रत्यक्ष यूनानी समीक्षा लंबित है; इसलिए विशेषकर ‘Christianity’, ‘spoke’ और अनुच्छेद के अंत में आए अचानक ‘और’ के लिए सावधानी बरती गई है। दूसरे अनुच्छेद का अपूर्ण ‘और’ साक्षी की पाठगत आकस्मिकता के रूप में जानबूझकर सुरक्षित रखा गया है।
