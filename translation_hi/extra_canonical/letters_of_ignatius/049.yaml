  english_witness: But if it were as certain persons who are godless, that is unbelievers, say, that He suffered only in semblance, being themselves mere semblance, why am I in bonds? And why also do I desire to fight with wild beasts? So I die in vain. Truly then I lie against the Lord.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/049.yaml
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
translation:
  language: hi
  text: पर यदि बात वैसी ही है जैसी कुछ धर्महीन लोग—अर्थात् अविश्वासी—कहते हैं, कि उसने केवल दिखावे में कष्ट सहा, जबकि वे स्वयं ही केवल दिखावा हैं, तो मैं बेड़ियों में क्यों हूँ? और मैं जंगली पशुओं से लड़ने की इच्छा भी क्यों करता हूँ? तब तो मैं व्यर्थ ही मरता हूँ। सचमुच, तब मैं प्रभु के विरुद्ध झूठ बोलता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godless
  choice: भक्तिहीन
  rationale: यह सहज आधुनिक हिन्दी में ईश्वर के प्रति श्रद्धा या भक्ति के अभाव को व्यक्त करता है; साथ का स्पष्टीकरण ‘अर्थात अविश्वासी’ अर्थ को सीमित करता है।
- source_word: suffered only in semblance
  choice: केवल दिखावे में दुःख सहा
  rationale: दुःख का वास्तविक न होकर केवल प्रतीत होना सुरक्षित रहता है, बिना बाद की पारिभाषिक शब्दावली थोपे।
- source_word: being themselves mere semblance
  choice: वे स्वयं ही केवल दिखावा हैं
  rationale: मूल कथन के तीखे शब्द-क्रीड़ा-सदृश प्रत्युत्तर को बनाए रखता है।
- source_word: bonds
  choice: बेड़ियों
  rationale: इग्नातियुस की कैद और शारीरिक बंधन का ठोस अर्थ सामान्य हिन्दी में स्पष्ट है।
- source_word: fight with wild beasts
  choice: जंगली पशुओं से लड़ने
  rationale: मृत्युदंड के संदर्भ में जानवरों का सामना करने की प्रत्यक्ष छवि को ज्यों का त्यों रखता है।
- source_word: lie against the Lord
  choice: प्रभु के विरुद्ध झूठी गवाही देता हूँ
  rationale: सिर्फ ‘प्रभु से झूठ बोलता हूँ’ की अपेक्षा उस दावे का भाव स्पष्ट करता है जिसमें वक्ता प्रभु के दुःख के विषय में असत्य साक्षी ठहरेगा।
theological_decisions:
- issue: मसीह के दुःख की वास्तविकता बनाम केवल प्रतीति
  choice: ‘केवल दिखावे में दुःख सहा’
  alternative: ‘केवल प्रतीत रूप में दुःख सहा’
  rationale: 'पाठ का विवाद स्पष्ट रखा गया है: कथित मत के अनुसार दुःख वास्तविक नहीं, केवल दिखाई देने वाला था। किसी संप्रदायगत नाम का आयात नहीं किया गया।'
- issue: ‘वे स्वयं ही केवल दिखावा हैं’ का आशय
  choice: रूपकात्मक निंदा को अनसुलझा रखा
  alternative: इसे ‘उनका अस्तित्व ही असत्य है’ कहकर व्याख्यायित करना
  rationale: पाठ की विडंबना और अस्पष्टता को सुरक्षित रखा गया है; यह तय नहीं किया गया कि कथन अस्तित्व, चरित्र या विश्वसनीयता पर है।
- issue: अंतिम वाक्य में असत्य का संबंध
  choice: ‘प्रभु के विरुद्ध झूठी गवाही देता हूँ’
  alternative: ‘प्रभु के बारे में झूठ बोलता हूँ’
  rationale: ‘against the Lord’ की विरोधात्मक दिशा बनी रहती है और शहादत/साक्ष्य के तर्क से संबंध भी स्वाभाविक रूप से व्यक्त होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और मध्य-पाठ-परंपरा का उल्लेख है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण शब्द-चयन में अनावश्यक तकनीकी निश्चितता से बचा गया है।
