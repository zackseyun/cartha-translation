  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी अपनाई गई है। वाक्य-विन्यास सहज बनाया गया, पर यूहन्नाई भाषा (‘कहाँ से आती है और कहाँ जाती है’), शरीर/आत्मा का तनाव और लेखक के भविष्यसूचक दावे सुरक्षित रखे गए हैं। प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और परामर्श-पाठ पर आधारित है।
