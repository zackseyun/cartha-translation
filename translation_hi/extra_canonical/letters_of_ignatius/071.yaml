base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: hi
  text: 'क्योंकि यद्यपि कुछ लोगों ने शरीर के अनुसार मुझे धोखा देना चाहा, फिर भी आत्मा धोखा नहीं खाती, क्योंकि वह परमेश्वर से है। वह जानती है कि वह कहाँ से आती है और कहाँ जाती है, और छिपी हुई बातों को खोज निकालती है। जब मैं तुम्हारे बीच था, तब मैंने पुकारकर ऊँचे स्वर में—परमेश्वर की अपनी वाणी से—कहा, “बिशप, प्राचीनों की परिषद और सेवकों पर ध्यान दो।”[a]


    फिर भी कुछ लोगों को संदेह था कि मैंने यह इसलिए कहा क्योंकि मुझे कुछ लोगों के फूट डालने की बात पहले से मालूम थी। पर वह, जिसमें बँधा हुआ मैं हूँ,[b] मेरा साक्षी है कि मैंने यह किसी मनुष्य के शरीर से नहीं सीखा। यह आत्मा का संदेश था, जिसने इस प्रकार कहा: “बिशप के बिना कुछ न करो। अपने शरीर को परमेश्वर के मंदिर के समान सुरक्षित रखो। एकता को सँजोए रखो। फूट से दूर रहो। यीशु मसीह का अनुकरण करो, जैसे उन्होंने स्वयं अपने पिता का अनुकरण किया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राचीनों की परिषद’ सामूहिक कलीसियाई निकाय का अनुवाद है। ‘सेवक’ के लिए परंपरागत पदनाम ‘डीकन’ भी प्रयुक्त होता है।
    reason: आरंभिक कलीसियाई पदों की शब्दावली और वैकल्पिक प्रचलित नाम स्पष्ट करना।
  - marker: b
    text: 'शाब्दिक भाव: ‘वह, जिसमें मैं बँधा हुआ हूँ।’ इसका संकेत संभवतः मसीह और उनके कारण पहनी गई बेड़ियों—दोनों की ओर है।'
    reason: सघन और कुछ अस्पष्ट मूल अभिव्यक्ति का संभावित द्विअर्थ बताना।
lexical_decisions:
- source_word: bishop (ἐπίσκοπος, Greek review pending)
  choice: बिशप
  rationale: आरंभिक कलीसियाई पद को आधुनिक पाठक के लिए पहचानने योग्य रखते हुए ‘अध्यक्ष’ जैसे अधिक व्याख्यात्मक विकल्प से बचा गया।
- source_word: presbytery (πρεσβυτέριον, Greek review pending)
  choice: प्राचीनों की परिषद
  rationale: यहाँ सामूहिक निकाय अभिप्रेत है, केवल अलग-अलग ‘प्राचीन’ नहीं; इसलिए परिषद का भाव स्पष्ट किया गया।
- source_word: deacons (διάκονοι, Greek review pending)
  choice: सेवक
  rationale: पदनाम के सेवाभाव को सहज हिन्दी में रखा गया; ‘डीकन’ की अपेक्षा यह सामान्य पाठक के लिए अधिक बोधगम्य है।
- source_word: spirit / Spirit
  choice: आत्मा
  rationale: पहले अनुच्छेद में संदर्भगत अस्पष्टता सुरक्षित रखी गई; दूसरे में संदेश देने वाली आत्मा के लिए भी वही शब्द रखा गया, यद्यपि वाक्य-संदर्भ पवित्र आत्मा की ओर संकेत करता है।
- source_word: flesh
  choice: शरीर / मनुष्य का शरीर
  rationale: मूल साक्ष्य की देह-विषयक शब्दावली और यूहन्नाई प्रतिध्वनि बनाए रखी गई; अर्थ को केवल ‘मानवीय साधन’ कहकर समतल नहीं किया गया।
- source_word: union
  choice: एकता
  rationale: सामुदायिक मेल और संगठित एकत्व का स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: ‘the spirit’ की पहचान
  choice: ‘आत्मा’ को स्पष्ट रूप से ‘पवित्र आत्मा’ नहीं बनाया
  alternative: पवित्र आत्मा
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में पहले प्रयोग का आशय आत्मिक अंतर्दृष्टि अथवा परमेश्वर की आत्मा—दोनों की ओर खुला रह सकता है; स्रोत-भाषा समीक्षा लंबित होने से अस्पष्टता बचाई गई।
- issue: ‘with God’s own voice’
  choice: ‘परमेश्वर की अपनी वाणी से’
  alternative: ‘परमेश्वर की प्रेरणा से’
  rationale: लेखक के प्रबल दावे और उसके धार्मिक तनाव को नरम व्याख्या में नहीं बदला गया।
- issue: कलीसियाई पदों का स्वरूप
  choice: बिशप, प्राचीनों की परिषद और सेवक
  alternative: अध्यक्ष, पुरोहित-मंडल और उपयाजक
  rationale: बाद की किसी विशिष्ट सांप्रदायिक पद-व्यवस्था को आरोपित किए बिना आरंभिक त्रिस्तरीय शब्दावली को दर्शाया गया।
- issue: ‘He in whom I am bound’ का संदर्भ
  choice: सर्वनामगत संकेत को खुला रखा और अक्षरानुसार रूप दिया
  alternative: ‘मसीह, जिनके लिए मैं कैद हूँ’
  rationale: संभावित मसीह-संदर्भ को स्वीकार करते हुए भी उपलब्ध साक्ष्य से नाम जोड़कर अस्पष्टता समाप्त नहीं की गई।
- issue: शरीर को मंदिर रखना
  choice: ‘अपने शरीर को परमेश्वर के मंदिर के समान सुरक्षित रखो’
  alternative: ‘अपनी देह पवित्र रखो’
  rationale: मंदिर-रूपक को बनाए रखा गया और आदेश का व्यावहारिक संरक्षण-भाव व्यक्त किया गया, बिना इसे केवल यौन नैतिकता तक सीमित किए।
