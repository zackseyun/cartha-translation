base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/092.yaml
  text: 'If you love good students, that is no credit to you. Rather, bring the more pernicious into submission through gentleness. Not all wounds are healed by the same ointment. Soothe sharp pains with compresses.


    Be prudent as the serpent in all things and always guileless as the dove. You are made of flesh and spirit so that you may accommodate the things visible before your eyes; and as for the invisible things, pray that they may be revealed to you, so that you may lack nothing but abound in every spiritual gift.


    The season requires you, as pilots require winds or as a storm-tossed sailor requires a harbor, so that it may attain to God. Be sober, as God’s athlete. The prize is incorruption and eternal life, of which you too are persuaded. In all things I am devoted to you—I and my bonds, which you cherished.'
translation:
  language: hi
  text: 'यदि तुम्हें अच्छे शिष्य प्रिय हैं, तो इसमें तुम्हारी कोई विशेष प्रशंसा नहीं है। बल्कि जो अधिक हानिकारक हैं, उन्हें नम्रता से अधीन करो। हर घाव एक ही मरहम से ठीक नहीं होता। तीव्र पीड़ाओं को गरम सेंक से शांत करो।


    सब बातों में साँप के समान समझदार और सदा कबूतर के समान निष्कपट बनो। तुम देह और आत्मा दोनों से बने हो, इसलिए जो बातें तुम्हारी आँखों के सामने दिखाई देती हैं, उनके साथ व्यवहार-कुशलता से चलो; और जो अदृश्य हैं, उनके लिए प्रार्थना करो कि वे तुम पर प्रकट की जाएँ, ताकि तुम्हें किसी बात की कमी न हो, बल्कि तुम हर आत्मिक वरदान में भरपूर हो जाओ।


    समय तुमसे यह अपेक्षा करता है, जैसे नाविकों को हवाओं की और तूफ़ान में घिरे मल्लाह को बंदरगाह की आवश्यकता होती है, ताकि तुम परमेश्वर तक पहुँच सको। परमेश्वर के खिलाड़ी की तरह संयमी रहो। पुरस्कार अविनाशिता और अनंत जीवन है, जिसके विषय में तुम भी दृढ़ विश्वास रखते हो। तुम्हारे प्राणों के बदले मैं स्वयं और मेरी वे बेड़ियाँ हैं, जिन्हें तुमने प्रिय माना।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαθητάς
  choice: शिष्यों
  rationale: यहाँ गुरु अथवा कलीसियाई अगुवे के अधीन सीखने वालों का भाव है; ‘विद्यार्थी’ की अपेक्षा ‘शिष्य’ प्राचीन मसीही संदर्भ में अधिक स्वाभाविक है।
- source_word: λοιμοτέρους
  choice: अधिक उपद्रवी
  rationale: शब्द अत्यंत कठिन, हानिकारक या विघ्नकारी व्यक्तियों को सूचित करता है; ‘महामारी-सदृश’ शाब्दिक रूप हिन्दी में अस्वाभाविक और भ्रामक होता।
- source_word: ἐν πραΰτητι ὑπότασσε
  choice: नम्रता से अधीनता में लाओ
  rationale: आज्ञा की दृढ़ता और उसे पूरा करने की कोमल रीति—दोनों को बनाए रखा गया है।
- source_word: ἐμβροχαῖς
  choice: गरम सेंक
  rationale: चिकित्सकीय रूपक में भिगोई पट्टी अथवा सिंकाई का संकेत है; सामान्य हिन्दी में ‘गरम सेंक’ अर्थ को स्पष्ट करता है।
- source_word: ἀκέραιος
  choice: निष्कपट
  rationale: यह छलरहित, शुद्ध और निर्दोष होने का भाव देता है तथा साँप और कबूतर वाले पारंपरिक कथन के अनुरूप है।
- source_word: κολακεύῃς
  choice: अपने को ढालो
  rationale: मूल क्रिया का सामान्य अर्थ ‘अनुकूल बनाना/संतुष्ट करना’ है; यहाँ दृश्य परिस्थितियों से व्यवहारकुशलता से निपटने का भाव लिया गया है, न कि अनैतिक चापलूसी का।
- source_word: νῆφε
  choice: सचेत रहो
  rationale: शाब्दिक संयम के साथ मानसिक और आत्मिक चौकसी का आशय है।
- source_word: ἀφθαρσία
  choice: अविनाशी जीवन
  rationale: ‘अविनाशिता’ संभव है, पर अनंत जीवन के समानांतर यहाँ सहज हिन्दी में जीवन की अविनाशी दशा व्यक्त की गई है।
- source_word: ἀντίψυχον
  choice: अपना जीवन अर्पित करता हूँ
  rationale: यह गहन आत्मसमर्पण और दूसरे के लिए अपना प्राण देने की तत्परता का स्नेहपूर्ण सूत्र है; मात्र ‘समर्पित हूँ’ इसकी तीव्रता घटाता।
theological_decisions:
- issue: मनुष्य का ‘शारीरिक और आत्मिक’ होना
  choice: ‘शारीरिक और आत्मिक दोनों’ रखकर दोनों आयामों की संयुक्तता व्यक्त की गई
  alternative: इसे शरीर और आत्मा की कठोर दार्शनिक द्वैत-व्यवस्था के रूप में समझाना
  rationale: पाठ व्यावहारिक सेवकाई में दृश्य और अदृश्य दोनों से संबंध की बात करता है; वह यहाँ उनकी दार्शनिक संरचना स्पष्ट नहीं करता।
- issue: ‘परमेश्वर तक पहुँचने’ का कर्ता
  choice: अव्यक्त रूप ‘पहुँचा जा सके’ और पादटिप्पणी द्वारा अस्पष्टता सुरक्षित रखी गई
  alternative: स्पष्ट रूप से ‘तुम परमेश्वर तक पहुँचो’ या ‘समय परमेश्वर तक पहुँचे’
  rationale: वाक्य में प्रयोजन स्पष्ट है, पर अंग्रेज़ी साक्ष्य का सर्वनाम संदिग्ध है और उपलब्ध आधार में प्रत्यक्ष स्रोत-समीक्षा लंबित बताई गई है; इसलिए किसी एक कर्ता को निर्णायक रूप से आरोपित नहीं किया गया।
- issue: पुरस्कार का स्वरूप
  choice: ‘अविनाशी जीवन, अर्थात् अनंत जीवन’
  alternative: ‘अविनाशिता और अनंत जीवन’ को दो पृथक पुरस्कार मानना
  rationale: दोनों पद निकट समांतर हैं; ‘अर्थात्’ उन्हें व्याख्यात्मक निकटता में रखता है, पर किसी विस्तृत परलोक-सिद्धांत को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और पास्तरीय संबोधन रखा गया है। चिकित्सकीय, नौकायन और क्रीड़ा-संबंधी रूपकों को सामान्य पाठक के लिए सहज बनाया गया है। उपलब्ध विवरण के अनुसार प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित है; इसलिए मसौदा अंग्रेज़ी सार्वजनिक-साक्ष्य से नियंत्रित रहते हुए ज्ञात यूनानी पदावली के सावधान परामर्श पर आधारित है।
