source:
  text: 'If thou lovest good scholars, this is not thankworthy in thee. Rather bring the more pestilent to submission by gentleness. All wounds are not healed by the same salve. Allay sharp pains by fomentations.


    Be thou prudent as the serpent in all things and guileless always as the dove. Therefore art thou made of flesh and spirit, that thou mayest humor the things which appear before thine eyes; and as for the invisible things, pray thou that they may be revealed unto thee; that thou mayest be lacking in nothing, but mayest abound in every spiritual gift.


    The season requireth thee, as pilots require winds or as a storm-tossed mariner a haven, that it may attain unto God. Be sober, as God''s athlete. The prize is incorruption and life eternal, concerning which thou also art persuaded. In all things I am devoted to thee--I and my bonds which thou didst cherish.'
