base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/096.yaml
  text: 'Give heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, and the deacons. May it be granted me to have my portion with them in the presence of God. Toil together with one another, struggle together, run together, suffer together, lie down together, rise up together, as God’s stewards, assessors, and ministers.


    Please the Captain in whose army you serve, from whom also you will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that you may receive your assets due to you. Be therefore long-suffering with one another in gentleness, as God is with you. May I have joy of you always.'
translation:
  language: hi
  text: 'बिशप की बात पर ध्यान दो, ताकि परमेश्वर भी तुम पर ध्यान दे। जो लोग बिशप, प्राचीनों और सेवकों के अधीन रहते हैं, उनके प्रति मैं समर्पित हूँ। परमेश्वर की उपस्थिति में मुझे भी उनके साथ भाग मिले। परमेश्वर के भंडारियों, सहायक न्यायाधीशों और सेवकों के समान एक-दूसरे के साथ परिश्रम करो, साथ संघर्ष करो, साथ दौड़ो, साथ दुःख सहो, साथ सोओ और साथ जागो।


    उस सेनापति को प्रसन्न करो जिसकी सेना में तुम सेवा करते हो और जिससे तुम्हें वेतन भी मिलेगा। तुममें से कोई भगोड़ा न पाया जाए। तुम्हारा बपतिस्मा तुम्हारी ढाल बना रहे; तुम्हारा विश्वास तुम्हारा टोप; तुम्हारा प्रेम तुम्हारा भाला; और तुम्हारा धैर्य तुम्हारा कवच। तुम्हारे काम तुम्हारी जमा-पूँजी हों, ताकि तुम्हें तुम्हारी देय राशि मिले। इसलिए नम्रता के साथ एक-दूसरे के प्रति धीरज रखो, जैसे परमेश्वर तुम्हारे प्रति रखता है। मुझे तुमसे सदा आनंद मिलता रहे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bishop
  choice: बिशप
  rationale: आरंभिक कलीसियाई पदनाम को आधुनिक हिन्दी पाठकों के लिए परिचित रूप में रखा गया; इसे केवल ‘अध्यक्ष’ कहने से ऐतिहासिक पद-संबंध धुँधला पड़ सकता था।
- source_word: presbyters
  choice: प्राचीन
  rationale: कलीसियाई पद के अर्थ और नए नियम की प्रचलित हिन्दी शब्दावली, दोनों को सुरक्षित रखता है।
- source_word: deacons
  choice: सेवक
  rationale: पदनाम की सेवा-संबंधी मूल धारणा को सहज हिन्दी में व्यक्त करता है; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण अधिक तकनीकी लिप्यंतरण से बचा गया।
- source_word: assessors
  choice: सहायक न्यायाधीशों
  rationale: दिए गए अंग्रेज़ी साक्ष्य में निहित न्यायिक-सहभागिता का रूपक बनाए रखता है, यद्यपि यूनानी स्रोत से पुष्टि आवश्यक है।
- source_word: Captain
  choice: सेनापति
  rationale: सैनिक रूपक और आगे आने वाले वेतन, भगोड़े, ढाल, टोप, भाले और कवच के बिंबों को एकसूत्र में रखता है।
- source_word: deposits / assets due
  choice: जमा-पूँजी / देय राशि
  rationale: लेखा और पारिश्रमिक के रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखा गया है।
- source_word: long-suffering
  choice: धीरज रखो
  rationale: परस्पर सहनशीलता और दीर्घ धैर्य को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कलीसियाई अधिकारियों के प्रति अधीनता
  choice: ‘अधीन रहते हैं’
  alternative: ‘आज्ञा मानते हैं’
  rationale: दिए गए साक्ष्य के संबंधपरक और संस्थागत आशय को रखा गया, पर पूर्ण या असीम आज्ञाकारिता का अतिरिक्त दावा नहीं जोड़ा गया।
- issue: कर्म और प्रतिफल का रूपक
  choice: कर्मों को ‘जमा-पूँजी’ और मिलने वाली वस्तु को ‘देय राशि’ कहा गया
  alternative: इसे स्पष्ट रूप से उद्धार का पुरस्कार या स्वर्गीय धन कहना
  rationale: पाठ की आर्थिक उपमा और उसकी धर्मवैज्ञानिक तनातनी को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया।
- issue: बपतिस्मा का स्थायी कवच-सदृश कार्य
  choice: ‘तुम्हारा बपतिस्मा तुम्हारी ढाल बना रहे’
  alternative: ‘अपने बपतिस्मे को ढाल की तरह थामे रहो’
  rationale: मूल अंग्रेज़ी साक्ष्य के ‘abide with you’ को प्राथमिकता दी गई, जिससे बपतिस्मा को केवल मानवीय प्रयास में बदलने से बचा जा सके।
- issue: परमेश्वर का मनुष्यों पर ध्यान देना
  choice: शर्तसूचक ‘ताकि’ बनाए रखा
  alternative: ‘क्योंकि परमेश्वर तुम पर ध्यान देता है’
  rationale: पाठ में उपस्थित पारस्परिक/उद्देश्यसूचक तनाव को सिद्धान्तगत व्याख्या से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामूहिक संबोधन और गरिमापूर्ण, सीधी आज्ञार्थक शैली अपनाई गई है। सैनिक तथा आर्थिक रूपकों की शृंखला अक्षुण्ण रखी गई। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; मध्य-पाठ यूनानी परंपरा की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित है, इसलिए विशेषतः ‘assessors’, पदनामों और आर्थिक शब्दावली के अनुवाद को प्रारंभिक माना जाना चाहिए।
