review_pass:
  verdict: revise
  source_fidelity: 'The draft generally follows the supplied English witness closely. Two expressions need adjustment for fidelity and clarity: ''as God’s stewards, assessors, and ministers'' should not make God’s roles merely a comparison (''के समान''), and the final clause should retain the sense that God is patient ''with you,'' rather than leaving its object implicit. The military image is retained; the supplied witness specifically has ''shield,'' though the underlying Greek tradition should later be checked because this image may be textually/lexically broader.'
  naturalness: The collective imperatives are clear and suitably dignified. 'टोप' is less natural in contemporary standard Hindi than 'शिरस्त्राण,' and 'जिसकी सेना में तुम सेवा करते हो' is smoother as 'जिसकी सेना में तुम सैनिक हो.' 'जमा-पूँजी' can suggest personal wealth; 'जमा-राशि' better preserves the accounting metaphor.
  terminology: बिशप, प्राचीन, सेवक, सेनापति, बपतिस्मा, विश्वास, प्रेम, धैर्य, and कवच are appropriate. 'सहायक न्यायाधीश' is a defensible provisional rendering of 'assessors,' but remains subject to direct Greek review. 'प्राप्य' is more idiomatic than 'देय राशि' for what is to be received.
  issues:
  - severity: medium
    issue: ‘परमेश्वर के भंडारियों, सहायक न्यायाधीशों और सेवकों के समान’
    rationale: The phrase presents the recipients as God’s stewards, assessors, and ministers; 'के समान' can instead imply that they are merely acting like such persons. Render the appositional relationship directly.
  - severity: medium
    issue: ‘जैसे परमेश्वर तुम्हारे प्रति रखता है’
    rationale: This omits the explicit relational sense of ‘as God is with you’ and leaves ‘धीरज’ only implied. State that God exercises patience with them.
  - severity: low
    issue: ‘टोप’ and ‘जमा-पूँजी / देय राशि’
    rationale: These are understandable but less natural or less precise in modern standard Hindi for a sustained military and accounting metaphor.
  revised_text: 'बिशप की बात पर ध्यान दो, ताकि परमेश्वर भी तुम पर ध्यान दे। जो लोग बिशप, प्राचीनों और सेवकों के अधीन रहते हैं, उनके लिए मैं समर्पित हूँ। परमेश्वर की उपस्थिति में मुझे भी उनके साथ भाग मिले। परमेश्वर के भंडारियों, सहायक न्यायाधीशों और सेवकों के रूप में एक-दूसरे के साथ परिश्रम करो, साथ संघर्ष करो, साथ दौड़ो, साथ दुःख सहो, साथ विश्राम करो और साथ उठो।


    उस सेनापति को प्रसन्न करो, जिसकी सेना में तुम सैनिक हो और जिससे तुम्हें वेतन भी मिलेगा। तुममें से कोई भगोड़ा न पाया जाए। तुम्हारा बपतिस्मा तुम्हारी ढाल बना रहे; तुम्हारा विश्वास तुम्हारा शिरस्त्राण; तुम्हारा प्रेम तुम्हारा भाला; और तुम्हारा धैर्य तुम्हारा कवच। तुम्हारे काम तुम्हारी जमा-राशि हों, ताकि तुम्हें तुम्हारा प्राप्य मिले। इसलिए नम्रता के साथ एक-दूसरे के प्रति धीरज रखो, जैसे परमेश्वर तुम्हारे साथ धीरज रखता है। मुझे तुमसे सदा आनंद मिलता रहे।'
