base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/004.yaml
  text: 'I do not command you as though I were someone important. For even though I am in chains for the sake of the Name, I have not yet been perfected in Jesus Christ. [For] I am only now beginning to be a disciple, and I speak to you as my fellow students. For I ought to be trained by you for the contest in faith, admonition, endurance, and patience.


    But since love does not allow me to remain silent concerning you, I was therefore eager to exhort you to run in harmony with the mind of God. For Jesus Christ also, our inseparable life, is the mind of the Father, just as the bishops established in the farthest parts of the earth are in the mind of Jesus Christ.'
translation:
  language: hi
  text: 'मैं तुम्हें इस तरह आज्ञा नहीं देता मानो मैं कोई महत्त्वपूर्ण व्यक्ति हूँ। यद्यपि मैं उस नाम के कारण बेड़ियों में हूँ, फिर भी मैं अब तक यीशु मसीह में सिद्ध नहीं हुआ हूँ। [क्योंकि][a] मैं तो अभी शिष्य बनना आरम्भ ही कर रहा हूँ, और तुमसे अपने सहपाठियों के समान बात करता हूँ। मुझे विश्वास, चेतावनी, धीरज और सहनशीलता की प्रतियोगिता के लिए तुमसे प्रशिक्षण पाना चाहिए।


    परन्तु प्रेम मुझे तुम्हारे विषय में चुप रहने नहीं देता; इसलिए मैं तुम्हें प्रोत्साहित करने को उत्सुक था कि तुम परमेश्वर के मन के अनुरूप एक ही लय में दौड़ो। क्योंकि यीशु मसीह भी—हमारा वह जीवन जिससे हम अलग नहीं हो सकते—पिता का मन है; ठीक वैसे ही जैसे पृथ्वी के दूर-दूर के भागों में नियुक्त बिशप यीशु मसीह के मन के अनुरूप हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘क्योंकि’ उपलब्ध अंग्रेज़ी साक्ष्य में कोष्ठकों में है, जो पाठ में इसकी पुनर्स्थापना अथवा अनिश्चितता का संकेत देता है।
    reason: आधार साक्ष्य में उपस्थित पाठालोचनात्मक संकेत को पाठक के लिए सुरक्षित रखना।
lexical_decisions:
- source_word: the Name
  choice: उस नाम
  rationale: मूल साक्ष्य की संकेतात्मक और श्रद्धापूर्ण अभिव्यक्ति को बनाए रखा गया है; नाम को स्पष्ट रूप से किसी एक विस्तृत पदवी में बदलकर अंतर्निहित संकेत को नहीं सुलझाया गया।
- source_word: perfected
  choice: सिद्ध हुआ
  rationale: आत्मिक परिपक्वता और पूर्णता, दोनों की संभावित अर्थछाया सुरक्षित रहती है।
- source_word: school-fellows
  choice: सहपाठियों
  rationale: शिष्य बनने और प्रशिक्षण पाने के रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: contest
  choice: प्रतियोगिता
  rationale: विश्वासमय जीवन के संघर्ष को प्रशिक्षण और दौड़ के विस्तृत रूपक से जोड़ता है।
- source_word: admonition
  choice: चेतावनी
  rationale: सुधारने वाले गंभीर निर्देश का भाव देता है, बिना इसे केवल सामान्य शिक्षा तक सीमित किए।
- source_word: endurance / long-suffering
  choice: धीरज / सहनशीलता
  rationale: 'निकटार्थी होते हुए भी दोनों पदों का भेद रखा गया है: कठिनाई में टिके रहने के लिए ‘धीरज’ और लंबे समय तक सहने के लिए ‘सहनशीलता’।'
- source_word: run in harmony
  choice: एक ही लय में दौड़ो
  rationale: दौड़ और सामंजस्य, दोनों रूपकों को सहज हिन्दी में एक साथ सुरक्षित रखता है।
- source_word: mind
  choice: मन
  rationale: ‘इच्छा’ या ‘योजना’ चुनकर अर्थ को संकरा करने के बजाय विचार, अभिप्राय और मनोभाव की व्यापकता तथा दोहराव सुरक्षित रखा गया है।
- source_word: inseparable life
  choice: वह जीवन जिससे हम अलग नहीं हो सकते
  rationale: शाब्दिक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा मसीह और विश्वासियों के अविभाज्य संबंध पर मूल बल बनाए रखता है।
- source_word: bishops
  choice: बिशप
  rationale: प्राचीन कलीसियाई पदनाम को किसी आधुनिक सम्प्रदाय-विशिष्ट प्रशासनिक समकक्ष में बदले बिना परिचित रूप में रखा गया है।
theological_decisions:
- issue: ‘यीशु मसीह ... पिता का मन है’ का कथन
  choice: रूपक को सीधे बनाए रखा गया
  alternative: ‘यीशु मसीह पिता की इच्छा को प्रकट करते हैं’
  rationale: वैकल्पिक रूप अधिक व्याख्यात्मक है और मसीह तथा पिता के ‘मन’ के बीच मूल के सघन संबंध को कमजोर कर सकता है।
- issue: बिशपों का ‘यीशु मसीह के मन में’ होना
  choice: ‘यीशु मसीह के मन के अनुरूप हैं’
  alternative: ‘यीशु मसीह की इच्छा के अधीन हैं’
  rationale: ‘अनुरूप’ सामंजस्य और सहमति व्यक्त करता है, पर पद को अधीनता की किसी विशिष्ट कलीसियाई व्यवस्था का स्पष्ट दावा नहीं बनाता।
- issue: ‘उस नाम’ का अभिप्राय
  choice: संकेतात्मक रूप बनाए रखा गया
  alternative: ‘यीशु के नाम’ या ‘मसीह के नाम’
  rationale: साक्ष्य में निहित पवित्र नाम-संकेत को संरक्षित किया गया है और स्पष्टता के नाम पर उसे अनावश्यक रूप से नहीं खोला गया।
