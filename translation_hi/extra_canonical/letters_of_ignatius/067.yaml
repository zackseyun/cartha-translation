base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/067.yaml
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall repent and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
translation:
  language: hi
  text: 'हानिकारक जड़ी-बूटियों से दूर रहो। वे यीशु मसीह की खेती नहीं हैं, क्योंकि उन्हें पिता ने नहीं रोपा। ऐसा नहीं कि मैंने तुममें फूट पाई है, बल्कि छनाई पाई है।[a]


    क्योंकि जितने परमेश्वर और यीशु मसीह के हैं, वे बिशप के साथ हैं। और जितने पश्चाताप करके कलीसिया की एकता में प्रवेश करेंगे, वे भी परमेश्वर के होंगे, ताकि वे यीशु मसीह के अनुसार जीवन जिएँ। मेरे भाइयो, धोखा न खाना।


    यदि कोई फूट डालनेवाले के पीछे चलता है, तो वह परमेश्वर के राज्य का उत्तराधिकारी नहीं होता। यदि कोई पराए उपदेश के अनुसार चलता है, तो मसीह के दुःखभोग में उसकी कोई सहभागिता नहीं है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छनाई’ उपलब्ध अंग्रेज़ी साक्ष्य के असामान्य शब्द “filtering” का अस्थायी अनुवाद है। इसका ठीक आशय अनिश्चित है; यूनानी पाठ की प्रत्यक्ष समीक्षा आवश्यक है।
    reason: दिए गए स्रोत में मूल यूनानी पाठ नहीं, केवल सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; अस्पष्टता को चुपचाप हल करना उचित नहीं।
  - marker: b
    text: ‘दुःखभोग’ से आशय यीशु मसीह के दुःख और मृत्यु से है।
    reason: ‘passion’ के धार्मिक अर्थ को आधुनिक हिन्दी पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: noxious herbs
  choice: हानिकारक जड़ी-बूटियाँ
  rationale: कृषि और रोपण के विस्तृत रूपक को बनाए रखते हुए सहज आधुनिक हिन्दी दी गई है।
- source_word: husbandry
  choice: खेती
  rationale: यहाँ आशय कृषि-कार्य या उगाई हुई फसल से जुड़ा है; ‘खेती’ आगे आने वाले ‘रोपा’ के साथ रूपक को स्वाभाविक रखता है।
- source_word: planting
  choice: रोपा
  rationale: पिता द्वारा न रोपे जाने की सक्रिय कृषि-छवि को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: filtering
  choice: छनाई
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के असामान्य शब्द को बिना व्याख्यात्मक समाधान के यथासंभव संरक्षित किया गया है।
- source_word: bishop
  choice: बिशप
  rationale: आरम्भिक कलीसियाई पद के लिए प्रचलित और व्यापक रूप से समझा जाने वाला हिन्दी रूप चुना गया; इसे किसी आधुनिक संप्रदायगत पद-संरचना से नहीं जोड़ा गया।
- source_word: schism
  choice: फूट
  rationale: समुदाय की एकता तोड़ने का अर्थ सरल, सटीक और प्रसंगानुकूल हिन्दी में देता है।
- source_word: strange doctrine
  choice: पराया उपदेश
  rationale: ‘भिन्न/विदेशी शिक्षा’ की दूरी और असंगति को बनाए रखता है, बिना उसे स्वतः ‘झूठा’ कहकर अर्थ को अधिक निश्चित किए।
- source_word: passion
  choice: मसीह का दुःखभोग
  rationale: यहाँ सामान्य भावावेश नहीं, यीशु मसीह का दुःख और मृत्यु अभिप्रेत है; हिन्दी में भ्रम से बचने हेतु स्पष्ट किया गया है।
theological_decisions:
- issue: परमेश्वर और यीशु मसीह से संबंधित लोगों का बिशप के साथ होना
  choice: कथन को सीधे उसी रूप में रखा गया है
  alternative: इसे केवल प्रशासनिक आज्ञाकारिता या उद्धार की अनिवार्य शर्त के रूप में विस्तार देना
  rationale: पाठ कलीसियाई एकता और बिशप के साथ संबंध को जोड़ता है, पर उपलब्ध साक्ष्य से आगे जाकर किसी विशिष्ट संप्रदायगत शासन-सिद्धांत को स्थापित नहीं किया गया।
- issue: कलीसिया की एकता में लौटने वालों का ‘परमेश्वर के होना’
  choice: ‘वे भी परमेश्वर के होंगे’
  alternative: ‘वे फिर उद्धार पा लेंगे’
  rationale: मूल साक्ष्य की संबंधपरक भाषा को बचाया गया है; उद्धार की किसी विस्तृत प्रणाली को इसमें नहीं जोड़ा गया।
- issue: दुःखभोग में सहभागिता
  choice: ‘मसीह के दुःखभोग में उसकी कोई सहभागिता नहीं है’
  alternative: ‘उसे मसीह के प्रायश्चित का कोई लाभ नहीं मिलता’
  rationale: ‘सहभागिता’ की धार्मिक और सामुदायिक व्यापकता को सुरक्षित रखा गया है तथा प्रायश्चित के किसी खास सिद्धांत से इसे सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सीधी और सामुदायिक उपदेश-शैली रखी गई है। ‘मेरे भाइयो’ मूल संबोधन को बनाए रखता है। उपलब्ध सामग्री स्वयं बताती है कि यूनानी स्रोत की समीक्षा लंबित है; इसलिए यह मसौदा अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य पर आधारित अस्थायी स्रोत-सचेत अनुवाद है, विशेषतः ‘छनाई’ के संबंध में।
