  english_witness: 'The love of the brethren which are in Troas saluteth you; from whence also I write to you by the hand of Burrhus, whom ye sent with me jointly with the Ephesians your brethren. He hath refreshed me in all ways. And I would that all imitated him, for he is an ensample of the ministry of God. The Divine grace shall requite him in all things.


    I salute your godly bishop and your venerable presbytery [and] my fellow-servants the deacons, and all of you severally and in a body, in the name of Jesus Christ, and in His flesh and blood, in His passion and resurrection, which was both carnal and spiritual, in the unity of God and of yourselves. Grace to you, mercy, peace, patience, always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/088.yaml
  text: 'The love of the brothers and sisters in Troas greets you. From there I am also writing to you through Burrhus, whom you sent with me together with your brothers and sisters, the Ephesians. He has refreshed me in every way. I wish everyone would imitate him, for he is an example of service to God. Divine grace will repay him in all things.


    I greet your godly bishop, your venerable council of elders, [and] my fellow servants the deacons, as well as all of you individually and together, in the name of Jesus Christ, and in his flesh and blood, in his suffering and resurrection, both bodily and spiritual, in the unity of God and of yourselves. Grace, mercy, peace, and patience be with you always.'
translation:
  language: hi
  text: 'त्रोआस में रहने वाले भाई-बहनों का प्रेम तुम्हें नमस्कार कहता है। वहीं से मैं बुर्रुस के हाथ तुम्हें लिख भी रहा हूँ। तुमने उसे अपने इफिसी भाई-बहनों के साथ मेरे पास भेजा था। उसने हर प्रकार से मुझे ताज़गी दी है। मेरी इच्छा है कि सभी उसका अनुकरण करें, क्योंकि वह परमेश्वर की सेवा का एक आदर्श है। ईश्वरीय अनुग्रह उसे हर बात में प्रतिफल देगा।


    मैं तुम्हारे परमेश्वर-भक्त बिशप, तुम्हारी आदरणीय प्राचीनों की परिषद्, [और][a] अपने सह-सेवक डीकनों को नमस्कार कहता हूँ; और तुम सभी को भी—एक-एक करके और एक साथ—यीशु मसीह के नाम में, और उसके मांस और लहू में, उसके दुःख-भोग और पुनरुत्थान में, जो शारीरिक और आत्मिक दोनों था,[b] तथा परमेश्वर की और तुम्हारी आपसी एकता में। अनुग्रह, दया, शांति और धीरज सदा तुम्हारे साथ रहें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘और’ उपलब्ध अंग्रेज़ी साक्ष्य में कोष्ठकों में दिया गया पुनर्स्थापित संयोजक है; यूनानी स्रोत-पाठ की सीधी समीक्षा अभी शेष है।
    reason: पाठीय पुनर्स्थापन-संकेत को मुख्य पाठ में सुरक्षित रखने के लिए।
  - marker: b
    text: उपलब्ध साक्ष्य में ‘शारीरिक और आत्मिक दोनों’ का व्याकरणिक संबंध अस्पष्ट है; यह ‘पुनरुत्थान’ से, या संभवतः ‘दुःख-भोग और पुनरुत्थान’ दोनों से जुड़ सकता है।
    reason: स्रोत-साक्ष्य की वास्तविक व्याकरणिक और धर्मवैचारिक अस्पष्टता को चुपचाप हल न करने के लिए।
lexical_decisions:
- source_word: brethren
  choice: भाई-बहन
  rationale: समुदाय के सभी विश्वासियों को स्वाभाविक आधुनिक हिन्दी में समावेशी ढंग से व्यक्त करता है; उपलब्ध अंग्रेज़ी साक्ष्य का बहुवचन सामुदायिक अर्थ बनाए रखता है।
- source_word: refreshed
  choice: ताज़गी दी
  rationale: सहायता, सांत्वना और बल देने के व्यापक भाव को बिना अनावश्यक रूप से सीमित किए व्यक्त करता है।
- source_word: ensample of the ministry of God
  choice: परमेश्वर की सेवा का एक आदर्श
  rationale: पुराने अंग्रेज़ी पदबंध के भाव को सहज हिन्दी में रखता है और सेवा को परमेश्वर की ओर उन्मुख बताता है।
- source_word: presbytery
  choice: प्राचीनों की परिषद्
  rationale: यहाँ सामूहिक नेतृत्व-मंडल का अर्थ है; केवल पदनाम का लिप्यंतरण करने की अपेक्षा अर्थ स्पष्ट किया गया है।
- source_word: deacons
  choice: डीकनों
  rationale: आरंभिक कलीसियाई पदनाम को पहचानने योग्य रूप में रखा गया है, बिना उसे किसी आधुनिक संप्रदाय की संरचना से समान ठहराए।
- source_word: passion
  choice: दुःख-भोग
  rationale: मसीह की पीड़ा और मृत्यु से संबंधित पारंपरिक अर्थ को गरिमापूर्ण तथा समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: patience
  choice: धीरज
  rationale: सिर्फ प्रतीक्षा नहीं, बल्कि कठिनाई में स्थिर सहनशीलता का भाव व्यक्त करता है।
theological_decisions:
- issue: मसीह के पुनरुत्थान का ‘carnal and spiritual’ वर्णन
  choice: जो शारीरिक और आत्मिक दोनों था
  alternative: उसके शारीरिक और आत्मिक दुःख-भोग तथा पुनरुत्थान में
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में संबंध व्याकरणिक रूप से असहज और कुछ हद तक अस्पष्ट है। मुख्य पाठ निकटतम प्रत्यक्ष संबंध बनाए रखता है और टिप्पणी इस अनिश्चितता को स्पष्ट करती है।
- issue: ‘unity of God and of yourselves’
  choice: परमेश्वर की और तुम्हारी आपसी एकता में
  alternative: परमेश्वर के साथ और आपस में तुम्हारी एकता में
  rationale: पहला रूप स्रोत-साक्ष्य की संरचना और वास्तविक अस्पष्टता को अधिक निकटता से सुरक्षित रखता है; दूसरा अधिक व्याख्यात्मक होता।
- issue: ‘godly bishop’
  choice: परमेश्वर-भक्त बिशप
  alternative: ईश्वरीय बिशप
  rationale: विशेषण को बिशप की भक्ति/चरित्र के रूप में समझना स्वाभाविक है और उसे स्वयं दिव्य कहने की संभावित भ्रांति से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पत्रात्मक शैली। ‘तुम’ बहुवचन समुदाय के संबोधन के रूप में रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मध्य-पाठपरंपरा के यूनानी पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण पाठीय और व्याकरणिक अनिश्चितताओं को टिप्पणियों में स्पष्ट किया गया है।
