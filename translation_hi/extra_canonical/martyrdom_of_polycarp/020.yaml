  english_witness: 'So it befell the blessed Polycarp, who having with those from Philadelphia suffered martyrdom in Smyrna--twelve in all--is especially remembered more than the others by all men, so that he is talked of even by the heathen in every place: for he showed himself not only a notable teacher, but also a distinguished martyr, whose martyrdom all desire to imitate, seeing that it was after the pattern of the Gospel of Christ.


    Having by his endurance overcome the unrighteous ruler in the conflict and so received the crown of immortality, he rejoiceth in company with the Apostles and all righteous men, and glorifieth the Almighty God and Father, and blesseth our Lord Jesus Christ, the savior of our souls and helmsman of our bodies and shepherd of the universal Church which is throughout the world.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
translation:
  language: hi
  text: 'इस प्रकार धन्य पॉलीकार्प ने फिलादेल्फिया से आए लोगों के साथ स्मुरना में शहादत पाई—वे कुल बारह थे। फिर भी सब लोग दूसरों की अपेक्षा विशेष रूप से उसी को याद करते हैं; यहाँ तक कि हर जगह गैर-यहूदी भी उसकी चर्चा करते हैं। क्योंकि उसने अपने आपको न केवल एक उल्लेखनीय शिक्षक, बल्कि एक विशिष्ट शहीद भी प्रमाणित किया। सभी उसकी शहादत का अनुकरण करना चाहते हैं, क्योंकि वह मसीह के सुसमाचार के नमूने के अनुसार थी।


    अपने धीरज के द्वारा उसने इस संघर्ष में अधर्मी शासक को पराजित किया और इस प्रकार अमरता का मुकुट पाया। वह प्रेरितों और सभी धर्मी जनों की संगति में आनन्दित होता है, सर्वशक्तिमान परमेश्वर और पिता की महिमा करता है, और हमारे प्रभु यीशु मसीह की स्तुति करता है—जो हमारी आत्माओं का उद्धारकर्ता, हमारे शरीरों का कर्णधार और संसार भर में फैली सार्वभौमिक कलीसिया का चरवाहा है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र के अंग्रेज़ी साक्ष्य के आधार पर तैयार किया गया है; यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष मिलान अभी लंबित है।
    reason: प्रदान किए गए स्रोत-विवरण के अनुसार मूल यूनानी की समीक्षा लंबित है, इसलिए पाठीय आधार को पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: blessed
  choice: धन्य
  rationale: प्राचीन मसीही सम्मानसूचक अर्थ को संक्षिप्त और परंपरासंगत हिन्दी में रखता है।
- source_word: suffered martyrdom
  choice: शहादत पाई
  rationale: मृत्यु देकर साक्षी होने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: heathen
  choice: गैर-यहूदी
  rationale: पुराने और प्रायः अपमानसूचक ‘विधर्मी’ से बचते हुए उपलब्ध अंग्रेज़ी साक्ष्य का व्यापक जातीय-धार्मिक संकेत देता है; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है।
- source_word: after the pattern of the Gospel of Christ
  choice: मसीह के सुसमाचार के नमूने के अनुसार
  rationale: शहादत और सुसमाचार के बीच दिए गए आदर्शात्मक संबंध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: crown of immortality
  choice: अमरता का मुकुट
  rationale: प्रतियोगिता और विजय से जुड़े मूल रूपक को सुरक्षित रखता है।
- source_word: helmsman of our bodies
  choice: हमारे शरीरों का कर्णधार
  rationale: असामान्य किन्तु जानबूझकर प्रयुक्त नौसंचालन-रूपक को सामान्यीकृत किए बिना बनाए रखता है।
- source_word: universal Church
  choice: सार्वभौमिक कलीसिया
  rationale: संसार भर की संपूर्ण कलीसिया का अर्थ देता है और किसी आधुनिक संस्थागत दावे को पाठ में नहीं जोड़ता।
theological_decisions:
- issue: शहादत का ‘मसीह के सुसमाचार के नमूने’ के अनुसार होना
  choice: संबंध को पाठ के कथन के रूप में यथावत रखा गया
  alternative: इसे सीधे ‘मसीह की मृत्यु का अनुकरण’ कहना
  rationale: उपलब्ध साक्ष्य ‘सुसमाचार के नमूने’ कहता है; अधिक विशिष्ट मसीह-विज्ञान संबंध जोड़ना मूल की संभावित व्यापकता को सीमित कर देता।
- issue: मृत्यु के बाद पॉलीकार्प की वर्तमान दशा
  choice: ‘आनन्दित होता है… महिमा करता है… स्तुति करता है’ वर्तमान काल में रखा गया
  alternative: इसे भविष्य की आशा या केवल स्मारकीय भाषा के रूप में प्रस्तुत करना
  rationale: साक्ष्य वर्तमान काल में सक्रिय संगति और आराधना का दावा करता है; उसके धर्मवैज्ञानिक तनाव को नरम नहीं किया गया।
- issue: यीशु मसीह के तीन पदनाम
  choice: उद्धारकर्ता, कर्णधार और चरवाहा—तीनों समानांतर रखे गए
  alternative: ‘कर्णधार’ को व्याख्यात्मक रूप से ‘रक्षक’ बनाना
  rationale: आत्मा और शरीर के संबंध तथा कलीसिया के चरवाहे की त्रिस्तरीय उपमा को अक्षुण्ण रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक वाचन के योग्य शैली अपनाई गई है। ‘पॉलीकार्प’, ‘फिलादेल्फिया’ और ‘स्मुरना’ के प्रचलित मसीही लिप्यंतरण रखे गए हैं। नौसंचालन और विजय-मुकुट के रूपकों को सरल व्याख्या में विलीन नहीं किया गया। प्रत्यक्ष यूनानी समीक्षा उपलब्ध न होने के कारण यह प्रकाशन-पूर्व स्रोत-पुष्टि अपेक्षित मसौदा है।
