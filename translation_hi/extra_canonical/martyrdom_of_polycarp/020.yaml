    issue: ‘गैर-यहूदी’ for ‘heathen’
    rationale: ‘गैर-यहूदी’ denotes non-Jews, whereas the supplied English witness says ‘heathen’ and the English POB audit trail says ‘pagans.’ The current wording therefore shifts the referent. ‘अन्यधर्मी लोग’ better conveys the historical religious contrast without importing an ethnic claim.
  - severity: low
    issue: ‘नमूने के अनुसार’ is somewhat wooden
    rationale: ‘मसीह के सुसमाचार के अनुरूप’ is more natural modern Hindi and retains the source’s claim that the martyrdom conformed to the Gospel’s pattern.
