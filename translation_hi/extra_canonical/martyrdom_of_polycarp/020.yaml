  terminology: ‘धन्य,’ ‘शहादत,’ ‘अमरता का मुकुट,’ ‘कर्णधार,’ and ‘सार्वभौमिक कलीसिया’ appropriately preserve the register and key metaphors of the witness. ‘अन्यधर्मी लोग’ is preferable here to ‘गैर-यहूदी,’ while remaining less needlessly pejorative than older labels such as ‘विधर्मी.’
