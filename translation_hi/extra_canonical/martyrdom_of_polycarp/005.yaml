  witness_license: Public domain witness
  english_witness: But one man, Quintus by name, a Phrygian newly arrived from Phrygia, when he saw the wild beasts, turned coward. He it was who had forced himself and some others to come forward of their own free will. This man the proconsul by much entreaty persuaded to swear the oath and to offer incense. For this cause therefore, brethren, we praise not those who deliver themselves up, since the Gospel doth not so teach us.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/005.yaml
  text: But one man named Quintus, a Phrygian who had recently arrived from Phrygia, lost his courage when he saw the wild beasts. He was the one who had compelled himself and some others to come forward voluntarily. After much urging, the proconsul persuaded him to swear the oath and offer incense. Therefore, brothers, we do not praise those who hand themselves over, since the Gospel does not teach us to do so.
translation:
  language: hi
  text: परन्तु क्विन्तुस नाम का एक फ्रूगियाई व्यक्ति, जो हाल ही में फ्रूगिया से आया था, जंगली पशुओं को देखकर साहस खो बैठा। उसी ने अपने आप को और कुछ अन्य लोगों को स्वेच्छा से आगे आने के लिए विवश किया था। प्रान्तपाल ने बहुत अनुनय-विनय करके उसे शपथ लेने और धूप चढ़ाने के लिए मना लिया। इसलिए, भाइयो, हम उन लोगों की प्रशंसा नहीं करते जो स्वेच्छा से अपने आप को सौंप देते हैं, क्योंकि सुसमाचार हमें ऐसा करना नहीं सिखाता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Phrygian ... from Phrygia
  choice: फ्रूगिया का रहने वाला ... वहाँ से आया था
  rationale: जातीय-भौगोलिक पहचान को सहज आधुनिक हिन्दी में रखा और अनावश्यक पुनरुक्ति घटाई।
- source_word: turned coward
  choice: साहस खो बैठा
  rationale: अपमानजनक संज्ञा बनाने के बजाय प्रसंगगत भय और धैर्यभंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: come forward of their own free will
  choice: अपनी इच्छा से आगे आने
  rationale: स्वेच्छा से अधिकारियों के सामने उपस्थित होकर स्वयं को प्रस्तुत करने का भाव बनाए रखता है।
- source_word: proconsul
  choice: प्रान्तपाल
  rationale: रोमी प्रशासनिक पद का सामान्य पाठक के लिए समझने योग्य कार्यात्मक रूप।
- source_word: swear the oath
  choice: शपथ खाने
  rationale: मूल साक्ष्य में शपथ की विषयवस्तु निर्दिष्ट नहीं है, इसलिए उसे अनिर्दिष्ट ही रखा गया।
- source_word: offer incense
  choice: धूप चढ़ाने
  rationale: राजकीय अथवा धार्मिक अनुष्ठान के ठोस कर्म को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: deliver themselves up
  choice: अपने आप को अधिकारियों के हवाले कर देते हैं
  rationale: यहाँ आत्मसमर्पण का आशय स्वेच्छा से गिरफ्तारी अथवा अभियोजन के लिए उपस्थित होना है; 'अधिकारियों' प्रसंग को स्पष्ट करता है।
- source_word: Gospel
  choice: सुसमाचार
  rationale: प्रारम्भिक मसीही नैतिक शिक्षा के लिए प्रचलित, गरिमापूर्ण और व्यापक हिन्दी पद।
theological_decisions:
- issue: स्वेच्छा से शहादत खोजने का मूल्यांकन
  choice: ऐसे लोगों की प्रशंसा न करने की लेखक की बात को सीधे रखा गया
  alternative: इसे सभी प्रकार के स्वैच्छिक आत्मसमर्पण पर सार्वकालिक पूर्ण निषेध के रूप में विस्तार देना
  rationale: पाठ विशेष रूप से स्वयं आगे आकर अधिकारियों के हवाले होने की प्रथा की आलोचना करता है; अनकहे व्यापक सिद्धान्त नहीं जोड़े गए।
- issue: शपथ और धूप का आशय
  choice: दोनों क्रियाओं को बिना अतिरिक्त धार्मिक व्याख्या के रखा गया
  alternative: शपथ को सम्राट की शपथ और धूप को सम्राट-पूजा स्पष्ट रूप से कहना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य इन विवरणों को स्पष्ट नहीं करता और प्रत्यक्ष यूनानी समीक्षा लंबित है।
- issue: भय के बाद क्विन्तुस की स्थिति
  choice: केवल साहस खोने और राज़ी हो जाने का वर्णन
  alternative: उसे धर्मत्यागी, उद्धार-विहीन या क्षमित घोषित करना
  rationale: पाठ ऐसे किसी अंतिम धर्मवैज्ञानिक निर्णय को व्यक्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। यह मसौदा उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी स्रोत-परीक्षण अभी लंबित है।
