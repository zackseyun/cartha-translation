revisions:
- from: परन्तु क्विन्तुस नाम का एक व्यक्ति, जो फ्रूगिया का रहने वाला था और हाल ही में वहाँ से आया था, जंगली पशुओं को देखकर साहस खो बैठा। उसी ने अपने आप को और कुछ अन्य लोगों को अपनी इच्छा से आगे आने के लिए उकसाया था। बहुत समझाने-बुझाने पर प्रान्तपाल ने उसे शपथ खाने और धूप चढ़ाने के लिए राज़ी कर लिया। इसलिए, भाइयो और बहनो,[a] हम उन लोगों की प्रशंसा नहीं करते जो अपने आप को अधिकारियों के हवाले कर देते हैं, क्योंकि सुसमाचार हमें ऐसा करना नहीं सिखाता।
  to: परन्तु क्विन्तुस नाम का एक फ्रूगियाई व्यक्ति, जो हाल ही में फ्रूगिया से आया था, जंगली पशुओं को देखकर साहस खो बैठा। उसी ने अपने आप को और कुछ अन्य लोगों को स्वेच्छा से आगे आने के लिए विवश किया था। प्रान्तपाल ने बहुत अनुनय-विनय करके उसे शपथ लेने और धूप चढ़ाने के लिए मना लिया। इसलिए, भाइयो, हम उन लोगों की प्रशंसा नहीं करते जो स्वेच्छा से अपने आप को सौंप देते हैं, क्योंकि सुसमाचार हमें ऐसा करना नहीं सिखाता।
  rationale: The revision restores the strong reflexive-and-plural force of the source’s description of Quintus, removes an unsupported expansion of the direct address, and makes the oath idiom natural in modern standard Hindi. It preserves the source’s ambiguity regarding the oath and the recipient or setting of the incense offering, and it does not add doctrinal conclusions about Quintus.
