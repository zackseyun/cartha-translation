translation:
  language: hi
  text: 'ये सब बातें इतनी तेज़ी से हुईं कि उनका वर्णन शब्दों में करना कठिन था। भीड़ ने तुरंत कार्यशालाओं और स्नानघरों से लकड़ियाँ और सूखी टहनियाँ इकट्ठी कर लीं। विशेषकर यहूदियों ने, जैसा कि उनका रिवाज़ है, बड़े उत्साह से इस काम में सहायता की।[a]


    जब चिता तैयार हो गई, तो पोलिकार्प ने अपने सभी ऊपरी वस्त्र उतार दिए और कमरबंद खोल दिया। उन्होंने अपने जूते भी उतारने की कोशिश की, हालाँकि पहले उन्हें स्वयं ऐसा करने की आदत नहीं थी, क्योंकि सभी विश्वासी सदा इस होड़ में रहते थे कि कौन सबसे पहले उनके शरीर को छू सके। उनके बाल सफ़ेद होने से पहले ही, उनके पवित्र जीवन के कारण लोग उन्हें हर प्रकार से आदर देते थे।


    फिर चिता के लिए तैयार की गई सामग्री तुरंत उनके चारों ओर रख दी गई। जब लोग उन्हें खंभे पर कीलों से जड़ने वाले थे, तो उन्होंने कहा, “मुझे ऐसा ही छोड़ दो। जिसने मुझे आग सहने की सामर्थ्य दी है, वही मुझे यह सामर्थ्य भी देगा कि मैं कीलों से बाँधे बिना चिता पर स्थिर रहूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जैसा कि उनका रिवाज़ है” कथाकार का विवादात्मक सामान्यीकरण है। यह उस समय की भीड़ में सम्मिलित कुछ यहूदियों के बारे में लेखक का आरोप प्रस्तुत करता है; इसे हर स्थान और हर युग के यहूदियों के विषय में कथन नहीं समझना चाहिए।
    reason: मूल गवाही के ऐतिहासिक रूप से संवेदनशील और सामूहिक आरोप वाले वाक्यांश को सुरक्षित रखते हुए उसके वक्तृता-संदर्भ और सीमित दायरे को स्पष्ट करना।
lexical_decisions:
- source_word: ξύλα καὶ φρύγανα (as reflected in the Greek tradition)
  choice: लकड़ियाँ और सूखी टहनियाँ
  rationale: चिता के लिए जुटाई गई मोटी और छोटी सूखी जलाऊ सामग्री का स्वाभाविक तथा स्पष्ट हिन्दी रूप।
- source_word: ἱμάτια
  choice: ऊपरी वस्त्र
  rationale: संदर्भ में शरीर पर पहने बाहरी कपड़ों को सूचित करता है; केवल सामान्य ‘कपड़े’ कहने से स्तरगत अर्थ खो सकता था।
- source_word: χρώς / flesh (witness)
  choice: शरीर
  rationale: आधुनिक हिन्दी में स्वाभाविक है और यहाँ स्पर्श किए जाने वाले व्यक्ति के देहगत अर्थ को बिना अनावश्यक कठोरता के व्यक्त करता है।
- source_word: ὄργανα / instruments (witness)
  choice: चिता के लिए तैयार की गई सामग्री
  rationale: ‘औज़ार’ इस संदर्भ में भ्रामक हो सकता है; आशय पोलिकार्प के चारों ओर लगाई जाने वाली चिता-सामग्री से प्रतीत होता है।
- source_word: πάσσαλος / stake (as reflected in the tradition)
  choice: खंभा
  rationale: दंडित व्यक्ति को स्थिर रखने वाले काष्ठ-स्तंभ का सीधा और समझने योग्य हिन्दी रूप।
theological_decisions:
- issue: आग सहने और स्थिर रहने की सामर्थ्य देने वाले का संकेत
  choice: ‘जिसने ... वही’—नाम जोड़े बिना मूल के संकेतात्मक कथन को बनाए रखा
  alternative: ‘परमेश्वर ने ... परमेश्वर ही’
  rationale: वक्ता का अभिप्राय परमेश्वर की ओर है, पर इस वाक्य में नाम स्पष्ट रूप से जोड़ना मूल की शैलीगत अप्रत्यक्षता को अनावश्यक रूप से समाप्त कर देता।
- issue: पोलिकार्प के प्रति विश्वासियों का आदर
  choice: वर्णन को ऐतिहासिक सम्मान और शारीरिक स्पर्श की होड़ के रूप में रखा
  alternative: इसे संत-अवशेषों से संबंधित किसी बाद की व्यवस्थित धार्मिक प्रथा के रूप में व्याख्यायित करना
  rationale: पाठ जितना कहता है उतना ही रखा गया है; किसी विशिष्ट सांप्रदायिक सिद्धांत को इसमें नहीं जोड़ा गया।
- issue: यहूदियों के विषय में सामूहिक कथन
  choice: कथाकार के तीखे ऐतिहासिक कथन को मुख्य पाठ में सुरक्षित रखा और पादटिप्पणी में उसकी वक्तृता तथा सीमा स्पष्ट की
  alternative: वाक्यांश को हटा देना या उसे सभी कालों और स्थानों के यहूदियों के बारे में सार्वभौमिक तथ्य मानना
  rationale: ऐतिहासिक पाठ को सेंसर किए बिना आधुनिक पाठक को यह बताना आवश्यक है कि यह कथाकार की विवादात्मक सामान्यीकृति है, न कि यहूदियों के विरुद्ध सार्वकालिक निर्णय।
