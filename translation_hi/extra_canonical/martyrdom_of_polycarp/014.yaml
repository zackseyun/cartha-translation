  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रखी गई है। प्रत्यक्ष ग्रीक स्रोत-समीक्षा लंबित होने के कारण यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी गवाही और प्रचलित यूनानी पाठ-साक्ष्य की प्रारंभिक तुलना पर आधारित है; विशेषकर ‘सामग्री/औज़ार’ तथा वस्त्र-संबंधी शब्दों की अंतिम पुष्टि प्रत्यक्ष पांडुलिपि-समीक्षा में की जानी चाहिए।
