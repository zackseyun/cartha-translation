  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/011.yaml
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
translation:
  language: hi
  text: 'पर जब वह बार-बार आग्रह करके कहने लगा, “कैसर के संरक्षक-दैव की शपथ खाओ,” तो पॉलीकार्प ने उत्तर दिया, “यदि तुम व्यर्थ ही यह समझते हो कि मैं कैसर के संरक्षक-दैव की शपथ खाऊँगा, जैसा तुम कहते हो, और यह दिखावा करते हो कि तुम नहीं जानते मैं कौन हूँ, तो साफ़-साफ़ सुन लो: मैं मसीही हूँ। लेकिन यदि तुम मसीही विश्वास की शिक्षा जानना चाहते हो, तो एक दिन ठहराओ और मुझे सुनने का अवसर दो।”


    प्रांतपाल ने कहा, “लोगों को समझाओ।” पर पॉलीकार्प ने कहा, “मैंने तुम्हें बातचीत के योग्य समझा होता, क्योंकि हमें सिखाया गया है कि परमेश्वर द्वारा ठहराए गए शासकों और अधिकारियों को वह उचित सम्मान दें जिससे हमें कोई हानि न हो। लेकिन इन लोगों को मैं इस योग्य नहीं समझता कि उनके सामने अपना पक्ष रखूँ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: genius of Caesar
  choice: कैसर का संरक्षक-दैव
  rationale: रोमी धार्मिक संदर्भ में यह कैसर की संरक्षक अथवा दैवी सत्ता से जुड़ी आत्मिक सत्ता को सूचित करता है। केवल “प्रतिभा” कहना भ्रामक होता; “संरक्षक-दैव” अर्थ को आधुनिक पाठक के लिए स्पष्ट रखते हुए प्राचीन धारणा को बनाए रखता है।
- source_word: Christian
  choice: मसीही
  rationale: आधुनिक मानक हिन्दी में यीशु मसीह के अनुयायी की स्वाभाविक और प्रतिष्ठित संज्ञा।
- source_word: doctrine of Christianity
  choice: मसीही विश्वास की शिक्षा
  rationale: “मसीही धर्म का सिद्धांत” की अपेक्षा अधिक स्वाभाविक हिन्दी है और यहाँ किसी एक व्यवस्थित धर्मसिद्धांत के बजाय मसीही शिक्षा के व्यापक अर्थ को व्यक्त करता है।
- source_word: proconsul
  choice: प्रांतपाल
  rationale: रोमी पद की प्रशासनिक भूमिका सामान्य पाठक तक पहुँचाता है; अधिक तकनीकी रूप “प्रोकौंसल” से पठनीयता घटती।
- source_word: defend myself
  choice: अपना पक्ष रखूँ
  rationale: न्यायिक और सार्वजनिक प्रत्युत्तर का स्वाभाविक हिन्दी रूप; इसका अर्थ शारीरिक आत्मरक्षा नहीं है।
theological_decisions:
- issue: परमेश्वर द्वारा नियुक्त अधिकारियों का सम्मान और उससे होने वाली हानि
  choice: “वह उचित सम्मान दें जिससे हमें कोई हानि न हो”
  alternative: “उन्हें उचित सम्मान दें, बशर्ते उससे हमें कोई हानि न पहुँचे”
  rationale: मूल साक्ष्य में सम्मान की सीमा या शर्त का भाव है। अनुवाद उस तनाव को बनाए रखता है और इसे न तो निरपेक्ष आज्ञाकारिता बनाता है, न राजनीतिक प्रतिरोध का विस्तृत सिद्धांत।
- issue: मसीही पहचान की सार्वजनिक घोषणा
  choice: “मैं मसीही हूँ”
  alternative: “मैं एक ईसाई हूँ”
  rationale: संक्षिप्त, प्रत्यक्ष स्वीकारोक्ति के बल को बनाए रखा गया है; कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
- issue: भीड़ के सामने प्रतिरक्षा से इनकार
  choice: “इन लोगों को मैं इस योग्य नहीं समझता कि उनके सामने अपना पक्ष रखूँ”
  alternative: “मैं इनसे अपनी सफ़ाई देना उचित नहीं समझता”
  rationale: पॉलीकार्प प्रांतपाल और भीड़ के बीच भेद करता है। “योग्य” स्रोत-साक्ष्य के मूल्यांकनात्मक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक संवाद के अनुकूल रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है और प्रत्यक्ष यूनानी समीक्षा लंबित है; इसलिए अत्यधिक तकनीकी पुनर्निर्माण से बचा गया है। “कैसर” ऐतिहासिक उपाधि के रूप में रखा गया है, और संवाद में सम्मानसूचक पर सहज “तुम” का प्रयोग किया गया है।
