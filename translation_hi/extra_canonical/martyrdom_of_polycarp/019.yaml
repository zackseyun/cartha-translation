base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/019.yaml
  text: 'Therefore, when the centurion saw the opposition raised by the Jews, he placed Polycarp in the middle and burned him according to their custom.


    Afterward, we took up his bones, which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place;


    there the Lord will permit us to gather together, as we are able, with gladness and joy, and to celebrate the birthday of his martyrdom, in remembrance of those who have already fought in the contest and for the training and preparation of those who will do so hereafter.'
translation:
  language: hi
  text: 'इसलिए जब सूबेदार ने यहूदियों की ओर से उठाया गया विरोध देखा, तो उसने पोलिकार्पुस को बीच में रखवाया और प्रथा के अनुसार उन्हें जला दिया।


    इसके बाद हमने उनकी हड्डियाँ उठा लीं, जो बहुमूल्य रत्नों से भी अधिक मूल्यवान और खरे सोने से भी अधिक उत्तम हैं, और उन्हें एक उचित स्थान पर रख दिया।


    वहाँ प्रभु हमें अवसर और सामर्थ्य के अनुसार हर्ष और आनन्द के साथ इकट्ठा होने देंगे, ताकि हम उनकी शहादत का जन्म-दिवस[a] मनाएँ—उन लोगों की स्मृति में जो पहले ही इस संघर्ष[b] में लड़ चुके हैं, और उन लोगों के प्रशिक्षण और तैयारी के लिए जो आगे चलकर ऐसा करेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “जन्म-दिवस” से आशय पोलिकार्पुस की शहादत की वर्षगाँठ है—उस दिन को नए जीवन में प्रवेश के रूप में स्मरण किया जाता था।
    reason: आधुनिक पाठक इसे जैविक जन्मदिन न समझे और प्राचीन रूपक भी सुरक्षित रहे।
  - marker: b
    text: “संघर्ष” में अखाड़े या प्रतियोगिता का रूपक है; शहीदों को ऐसे योद्धाओं की तरह चित्रित किया गया है जिन्होंने अपनी परीक्षा पूरी की।
    reason: मूल के प्रतियोगितात्मक रूपक को स्पष्ट करना, जो सहज हिन्दी शब्द में आंशिक रूप से मंद पड़ सकता है।
lexical_decisions:
- source_word: centurion
  choice: सूबेदार
  rationale: रोमी सैन्य पद के लिए प्रचलित और सामान्य पाठक के लिए बोधगम्य हिन्दी शब्द; यह लगभग सौ सैनिकों के अधिकारी का संकेत देता है।
- source_word: bones
  choice: हड्डियाँ
  rationale: मूल का ठोस, शारीरिक अर्थ बनाए रखा गया है; ‘अवशेष’ कहने से अर्थ अधिक व्यापक और व्याख्यात्मक हो जाता।
- source_word: birth-day of his martyrdom
  choice: उनकी शहादत का जन्म-दिवस
  rationale: आरम्भिक मसीही शहीदी-स्मरण की जानबूझकर प्रयुक्त जन्म-रूपक भाषा सुरक्षित रखी गई है; इसे केवल ‘बरसी’ करने से यह रूपक खो जाता।
- source_word: contest
  choice: संघर्ष
  rationale: प्रतियोगिता/अखाड़े के रूपक को सहज हिन्दी में व्यक्त करता है और शहादत के आत्मिक संघर्ष का भाव बनाए रखता है।
- source_word: as we are able
  choice: अवसर और सामर्थ्य के अनुसार
  rationale: वाक्यांश में निहित व्यावहारिक सीमा को स्वाभाविक हिन्दी में रखा गया है, बिना यह निश्चित किए कि सीमा अवसर, सुरक्षा, संख्या या सामर्थ्य में से किससे संबंधित थी।
theological_decisions:
- issue: शहादत के दिन को ‘जन्म-दिवस’ कहना
  choice: रूपक को मुख्य पाठ में ज्यों का त्यों बनाए रखा और पाद-टिप्पणी में स्पष्ट किया
  alternative: ‘शहादत की बरसी’ या ‘स्मृति-दिवस’
  rationale: ‘जन्म-दिवस’ मृत्यु को नए जीवन में प्रवेश मानने वाली प्राचीन भाषा को सुरक्षित रखता है, पर पाद-टिप्पणी किसी विस्तृत परलोक-सिद्धान्त को आरोपित किए बिना अर्थ समझाती है।
- issue: यहूदियों के विरोध और जलाने की प्रथा का संबंध
  choice: ‘यहूदियों की ओर से उठाया गया विरोध’ रखा, पर ‘प्रथा के अनुसार’ में स्वामित्व अनिर्दिष्ट रखा
  alternative: ‘उनकी प्रथा के अनुसार’, जिसे सीधे यहूदियों की प्रथा समझा जा सकता है
  rationale: उपलब्ध अंग्रेज़ी साक्षी में सर्वनाम है, पर प्रत्यक्ष यूनानी समीक्षा लंबित है; अनिर्दिष्ट रूप अनावश्यक सामूहिक आरोप और संदिग्ध संबंध-निर्धारण से बचता है।
- issue: हड्डियों के सम्मान का वर्णन
  choice: मूल की मूल्य-तुलना को स्पष्ट रूप से सुरक्षित रखा
  alternative: इसे अवशेष-पूजा या केवल भावात्मक अतिशयोक्ति के रूप में समझाकर अनुवाद करना
  rationale: पाठ स्वयं हड्डियों को अत्यन्त मूल्यवान बताता है; अनुवाद किसी बाद की सांप्रदायिक व्याख्या को न तो पुष्ट करता है, न अस्वीकार।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक स्मरण के अनुकूल रखी गई है। ‘हर्ष और आनन्द’, ‘प्रशिक्षण और तैयारी’ जैसी युग्म अभिव्यक्तियाँ साक्षी की औपचारिक लय बनाए रखती हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण संदिग्ध सर्वनाम-संबंध को जानबूझकर निर्णायक नहीं बनाया गया है।
