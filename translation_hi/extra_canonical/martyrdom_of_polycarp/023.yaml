  text: 'We bid you God speed, brethren, while you walk by the word of Jesus Christ which is according to the Gospel; with whom be glory to God for the salvation of his holy elect; even as the blessed Polycarp suffered martyrdom, in whose footsteps may it be our lot to be found in the kingdom of Jesus Christ.


    This account Gaius copied from the papers of Irenaeus, a disciple of Polycarp. The same also lived with Irenaeus.


    And I, Socrates, wrote it down in Corinth from the copy of Gaius. Grace be with all men.


    And I, Pionius, again wrote it down from the aforementioned copy, having searched it out (for the blessed Polycarp showed me in a revelation, as I will declare in the sequel), gathering it together when it was now well nigh worn out by age, that the Lord Jesus Christ may gather me also with his elect into his heavenly kingdom; to whom be the glory with the Father and the Holy Spirit for ever and ever. Amen.


    The three preceding paragraphs as read in the Moscow manuscript: This account Gaius copied from the papers of Irenaeus. The same lived with Irenaeus, who had been a disciple of the holy Polycarp. For this Irenaeus, being in Rome at the time of the martyrdom of the bishop Polycarp, instructed many; and many most excellent and orthodox treatises by him are in circulation. In these he makes mention of Polycarp, saying that he was taught by him. And he ably refuted every heresy, and handed down the catholic rule of the Church just as he had received it from the saint. He mentions this fact also, that when Marcion, after whom the Marcionites are called, met the holy Polycarp on one occasion, and said, “Recognize us, Polycarp,” he said in reply to Marcion, “Yes indeed, I recognize the firstborn of Satan.” The following statement also is made in the writings of Irenaeus, that on the very day and hour when Polycarp was martyred in Smyrna, Irenaeus, being in the city of the Romans, heard a voice
    as of a trumpet saying, “Polycarp is martyred.”


    From these papers of Irenaeus then, as has been stated already, Gaius made a copy, and from the copy of Gaius Isocrates made another in Corinth.


    And I, Pionius, again wrote it down from the copy of Isocrates, having searched for it in obedience to a revelation of the holy Polycarp, gathering it together when it was well nigh worn out by age, that the Lord Jesus Christ may gather me also with his elect into his heavenly kingdom; to whom be the glory with the Father and the Son and the Holy Spirit for ever and ever. Amen.'
translation:
  language: hi
  text: 'भाइयो और बहनो, जब तक आप सुसमाचार के अनुरूप यीशु मसीह के वचन पर चलते हैं, हम आपके लिए परमेश्वर की कृपा और कुशलता की कामना करते हैं। परमेश्वर की महिमा उसके पवित्र चुने हुओं के उद्धार के लिए यीशु मसीह के द्वारा हो। धन्य पॉलीकार्प ने इसी प्रकार शहीद होकर प्राण दिए; हमारी भी यही अभिलाषा है कि यीशु मसीह के राज्य में हम उनके पदचिह्नों पर चलते हुए पाए जाएँ।


    इस वृत्तांत की प्रतिलिपि गायुस ने पॉलीकार्प के शिष्य इरेनियुस के लेखों से बनाई। गायुस स्वयं भी इरेनियुस के साथ रहा था।


    और मैंने, सुकरात ने, कुरिन्थुस में गायुस की प्रतिलिपि से इसे लिख लिया। सब पर अनुग्रह बना रहे।


    और मैंने, पियोनियुस ने, उपर्युक्त प्रतिलिपि को ढूँढ़ निकालने के बाद फिर से इसे लिखा—क्योंकि धन्य पॉलीकार्प ने एक दर्शन में मुझे इसका पता दिखाया था, जैसा कि मैं आगे बताऊँगा। वह प्रतिलिपि पुरानी होकर लगभग नष्ट हो चुकी थी, इसलिए मैंने उसकी सामग्री को फिर से संकलित किया, ताकि प्रभु यीशु मसीह मुझे भी अपने चुने हुओं के साथ अपने स्वर्गीय राज्य में इकट्ठा करे। उसी की महिमा पिता और पवित्र आत्मा के साथ युगानुयुग होती रहे। आमीन।


    मॉस्को की पांडुलिपि में पिछले तीन अनुच्छेद इस रूप में मिलते हैं:[a]


    इस वृत्तांत की प्रतिलिपि गायुस ने इरेनियुस के लेखों से बनाई। गायुस स्वयं भी इरेनियुस के साथ रहा था, और इरेनियुस पवित्र पॉलीकार्प का शिष्य रह चुका था। बिशप पॉलीकार्प की शहादत के समय इरेनियुस रोम में था और उसने बहुतों को शिक्षा दी। उसकी लिखी हुई अनेक अत्युत्तम और शुद्ध-विश्वास के अनुरूप रचनाएँ प्रचलित हैं। उनमें वह पॉलीकार्प का उल्लेख करके कहता है कि उसने उन्हीं से शिक्षा पाई थी। उसने हर विधर्म का कुशलता से खंडन किया और कलीसिया के सार्वभौमिक विश्वास-नियम[b] को ठीक वैसे ही आगे सौंपा, जैसे उसने उस संत से पाया था। वह यह घटना भी बताता है: एक बार मारकियोन—जिसके नाम पर मारकियोनी कहलाते हैं—पवित्र पॉलीकार्प से मिला और बोला, “पॉलीकार्प, हमें पहचानो।” पॉलीकार्प ने उसे उत्तर दिया, “हाँ, मैं पहचानता हूँ—तुम शैतान के पहलौठे हो।” इरेनियुस के लेखों में यह कथन भी मिलता है कि जिस दिन और जिस घड़ी स्मुरना में पॉलीकार्प शहीद हुए, उसी समय इरेनियुस रोम नगर में था और उसने तुरही जैसी एक आवाज़ सुनी, जो कह रही थी, “पॉलीकार्प शहीद हो गए हैं।”


    इस प्रकार, जैसा पहले कहा जा चुका है, गायुस ने इरेनियुस के इन लेखों से एक प्रतिलिपि बनाई, और कुरिन्थुस में इसोक्रातेस ने गायुस की प्रतिलिपि से दूसरी प्रतिलिपि बनाई।


    और मैंने, पियोनियुस ने, पवित्र पॉलीकार्प से मिले दर्शन के निर्देश के अनुसार उसे ढूँढ़ने के बाद इसोक्रातेस की प्रतिलिपि से फिर इसे लिखा। वह प्रतिलिपि पुरानी होकर लगभग नष्ट हो चुकी थी, इसलिए मैंने उसकी सामग्री को फिर से संकलित किया, ताकि प्रभु यीशु मसीह मुझे भी अपने चुने हुओं के साथ अपने स्वर्गीय राज्य में इकट्ठा करे। उसी की महिमा पिता, पुत्र और पवित्र आत्मा के साथ युगानुयुग होती रहे। आमीन।


    [a] यह वैकल्पिक पाठ मॉस्को की पांडुलिपि में सुरक्षित पिछले तीन अनुच्छेदों का रूप है। इसमें मुख्य पाठ के “सुकरात” के स्थान पर “इसोक्रातेस” नाम आता है और अंतिम महिमावचन में “पुत्र” भी सम्मिलित है।


    [b] यहाँ “सार्वभौमिक” उस प्राचीन अर्थ को व्यक्त करता है जिसमें पूरी कलीसिया द्वारा ग्रहण किए गए विश्वास की बात है; यह किसी आधुनिक संप्रदाय का नाम नहीं है।


    [c] यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र के अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-समीक्षित प्रारूप है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी शेष है।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वैकल्पिक पाठ मॉस्को की पांडुलिपि में सुरक्षित पिछले तीन अनुच्छेदों का रूप है। इसमें मुख्य पाठ के “सुकरात” के स्थान पर “इसोक्रातेस” नाम आता है और अंतिम महिमावचन में “पुत्र” भी सम्मिलित है।
    reason: पांडुलिपीय वैकल्पिक पाठ तथा उसके प्रमुख अंतरों को स्पष्ट करना।
  - marker: b
    text: यहाँ “सार्वभौमिक” उस प्राचीन अर्थ को व्यक्त करता है जिसमें पूरी कलीसिया द्वारा ग्रहण किए गए विश्वास की बात है; यह किसी आधुनिक संप्रदाय का नाम नहीं है।
    reason: ‘catholic’ के प्राचीन और आधुनिक अर्थों में भ्रम से बचाना।
  - marker: c
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र के अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-समीक्षित प्रारूप है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: स्रोत-सामग्री की वास्तविक सीमा और प्रत्यक्ष यूनानी समीक्षा के लंबित होने को पारदर्शी बनाना।
lexical_decisions:
- source_word: God speed
  choice: परमेश्वर की कृपा और कुशलता की कामना
  rationale: पुराने अंग्रेज़ी अभिवादन का स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी रूप, जिसमें आशीर्वाद और मंगलकामना दोनों बने रहते हैं।
- source_word: martyrdom / is martyred
  choice: शहीद होकर प्राण दिए / शहीद हो गए हैं
  rationale: हिन्दी पाठकों के लिए सहज ऐतिहासिक-धार्मिक शब्दावली; मृत्यु-साक्ष्य का भाव स्पष्ट रहता है।
- source_word: catholic rule of the Church
  choice: कलीसिया का सार्वभौमिक विश्वास-नियम
  rationale: प्राचीन ‘सार्वभौमिक’ अर्थ को सुरक्षित रखते हुए आधुनिक संप्रदायगत अर्थ से बचाया गया; स्पष्टीकरण हेतु पादटिप्पणी दी गई।
- source_word: orthodox treatises
  choice: शुद्ध-विश्वास के अनुरूप रचनाएँ
  rationale: यहाँ ‘ऑर्थोडॉक्स’ को किसी आधुनिक संस्थागत पहचान के बजाय सही माने गए विश्वास के अर्थ में प्रस्तुत किया गया।
- source_word: gather
  choice: इकट्ठा करे
  rationale: चुने हुओं को राज्य में एकत्र करने की बाइबिलीय छवि को बिना व्याख्यात्मक विस्तार के बनाए रखा गया।
- source_word: revelation
  choice: दर्शन
  rationale: प्रसंग में पॉलीकार्प द्वारा दिखाए जाने की दृश्य-अनुभूति है; ‘दर्शन’ स्वाभाविक हिन्दी है, यद्यपि व्यापक अर्थ ‘प्रकाशना’ भी संभव है।
theological_decisions:
- issue: महिमावचन में संबोधन और मध्यस्थता
  choice: ‘परमेश्वर की महिमा ... यीशु मसीह के द्वारा हो’ तथा आगे ‘उसी की महिमा...’
  alternative: ‘जिसके साथ परमेश्वर की महिमा हो’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य का वाक्य-संबंध कुछ असहज और संभावित रूप से अस्पष्ट है। हिन्दी में आरंभिक भाव को पठनीय बनाया गया, जबकि बाद के महिमावचनों का मसीह-संबंधित निकटवर्ती संकेत बनाए रखा गया।
- issue: चुने हुए लोगों का उद्धार
  choice: ‘उसके पवित्र चुने हुओं के उद्धार’
  alternative: ‘पवित्र चुने हुए लोगों के उद्धार’
  rationale: स्वामित्व-सूचक सर्वनाम को रखा गया, पर चुनाव की प्रकृति या प्रक्रिया पर कोई अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
- issue: पॉलीकार्प के पदचिह्नों पर पाया जाना
  choice: राज्य में ‘उनके पदचिह्नों पर चलते हुए पाए जाएँ’
  alternative: उनके समान शहीद होने की स्पष्ट प्रार्थना
  rationale: पाठ शहादत का संदर्भ देता है, पर अभिव्यक्ति का दायरा अनुकरण तक भी जा सकता है; इसे केवल हिंसक मृत्यु की इच्छा मानकर सीमित नहीं किया गया।
- issue: मॉस्को पांडुलिपि का त्रित्वात्मक महिमावचन
  choice: ‘पिता, पुत्र और पवित्र आत्मा के साथ’ को वैकल्पिक पाठ में रखा
  alternative: मुख्य पाठ के अनुरूप ‘पिता और पवित्र आत्मा के साथ’
  rationale: पांडुलिपीय अंतर को समतल करने के बजाय दोनों रूप अलग-अलग सुरक्षित रखे गए।
- issue: पॉलीकार्प का दर्शन
