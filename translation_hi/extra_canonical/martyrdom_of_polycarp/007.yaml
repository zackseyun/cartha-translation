base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/007.yaml
  text: 'Those who were searching for him persisted, so he left for another farm. Immediately, those searching for him arrived. When they did not find him, they seized two young servants, one of whom confessed under torture;


    for it was impossible for him to remain hidden, since the very people who betrayed him were members of his own household. The police captain, who happened to bear the name Herod, was eager to bring him into the stadium, so that he might fulfill his appointed lot by becoming a fellow participant with Christ, while they—his betrayers—underwent the punishment of Judas himself.'
translation:
  language: hi
  text: '6 जो लोग उसकी खोज कर रहे थे, वे लगे रहे, इसलिए वह दूसरे खेत पर चला गया। वे खोजी तुरन्त वहाँ आ पहुँचे। जब वह उन्हें नहीं मिला, तो उन्होंने दो दास-किशोरों को पकड़ लिया। उनमें से एक ने यातना दिए जाने पर सब बता दिया।


    दरअसल, उसका छिपा रहना असम्भव था, क्योंकि उसे पकड़वानेवाले उसी के घराने के लोग थे। संयोग से पुलिस-अधिकारी का नाम भी हेरोदेस था। वह उसे अखाड़े में ले जाने को उतावला था, ताकि पोलिकार्प मसीह के साथ सहभागी होकर अपने लिए ठहराए हुए भाग को पूरा करे, जबकि उसे पकड़वानेवाले स्वयं यहूदा का दण्ड भोगें।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र के अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: प्रदान किए गए स्रोत-विवरण के अनुसार यूनानी मूल-पाठ की समीक्षा लंबित है; प्रकाशन में इस सीमा को पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: farm
  choice: खेत
  rationale: यहाँ आशय नगर से बाहर स्थित कृषि-स्थान या खेत वाले निवास से है; आधुनिक हिन्दी में ‘खेत’ सहज है, यद्यपि ‘खेती की जागीर’ भी सम्भव है।
- source_word: slave lads
  choice: दास-किशोर
  rationale: ‘दास’ उनकी कानूनी-सामाजिक स्थिति को बनाए रखता है और ‘किशोर’ कम आयु का संकेत देता है; केवल ‘नौकर’ कहने से दासता का तत्व मिट जाता।
- source_word: captain of the police
  choice: पुलिस-अधिकारी
  rationale: प्राचीन पद का आधुनिक पाठक के लिए सुबोध कार्यात्मक रूप; ‘कप्तान’ अनावश्यक रूप से आधुनिक सैन्य पद का आभास देता।
- source_word: stadium
  choice: अखाड़ा
  rationale: यह सार्वजनिक प्रतियोगिता और दण्ड-प्रदर्शन के स्थल को दर्शाता है; ‘स्टेडियम’ सम्भव है, पर ‘अखाड़ा’ हिन्दी में अधिक स्वाभाविक ऐतिहासिक बोध देता है।
- source_word: appointed lot
  choice: अपने लिए ठहराए हुए भाग
  rationale: ‘भाग’ नियत हिस्से और नियति दोनों की छाया बनाए रखता है; वाक्य इसे परमेश्वर द्वारा ठहराए जाने के रूप में स्पष्टतः नहीं खोलता।
- source_word: partaker with Christ
  choice: मसीह के साथ सहभागी
  rationale: मसीह के दुःख और उसके प्रतिफल में सहभागिता की धार्मिक गहराई को बिना अधिक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: ‘अपने लिए ठहराए हुए भाग को पूरा करे’ का कर्ता
  choice: ‘पोलिकार्प’ को स्पष्ट किया गया
  alternative: सर्वनाम ‘वह’ बनाए रखना
  rationale: मूल वाक्य की समान पुरुषवाचक सर्वनाम-श्रृंखला हिन्दी में हेरोदेस को कर्ता समझे जाने का भ्रम पैदा करती। संदर्भ में ठहराया हुआ भाग पूरा करने और मसीह के साथ सहभागी होने वाला पोलिकार्प है।
- issue: विश्वासघातियों के लिए ‘यहूदा का दण्ड’
  choice: ‘स्वयं यहूदा का दण्ड भोगें’
  alternative: ‘यहूदा के समान दण्ड पाएँ’
  rationale: गवाह का अधिक तीखा संबंध—यहूदा से जुड़ा वही दण्ड—बनाए रखा गया है; इसे केवल सामान्य समानता में नरम नहीं किया गया।
- issue: हेरोदेस नाम का संकेत
  choice: ‘नाम भी हेरोदेस था’
  alternative: केवल ‘जिसका नाम हेरोदेस था’
  rationale: ‘भी’ नाम की कथात्मक विडम्बना और यीशु के दुःख-वृत्तान्त से सम्भावित प्रतिध्वनि को संकेतित करता है, पर उसकी व्याख्या पाठ में आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और कथात्मक रखी गई है। ‘पकड़वानेवाले’, ‘उतावला’ और ‘भोगें’ जैसे सामान्य शब्द पठनीयता बढ़ाते हैं, जबकि ‘दास’, ‘ठहराया हुआ भाग’ और ‘सहभागी’ स्रोत की सामाजिक तथा धार्मिक गंभीरता सुरक्षित रखते हैं।
