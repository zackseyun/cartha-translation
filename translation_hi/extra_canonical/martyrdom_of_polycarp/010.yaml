  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/010.yaml
  text: 'But as Polycarp entered the stadium, a voice came to him from heaven: “Be strong, Polycarp, and be courageous.” No one saw the speaker, but those of our people who were present heard the voice. At last, when he was brought up, there was a great uproar, for they had heard that Polycarp had been arrested.


    When he was brought before him, the proconsul asked whether he was the man. When he confessed that he was, the proconsul tried to persuade him to deny Christ, saying, “Have respect for your age,” and other such things, as they usually say: “Swear by the genius of Caesar; repent and say, ‘Away with the atheists!’” Then Polycarp, with a solemn expression, looked at the whole crowd of lawless heathen in the stadium and waved his hand toward them. Groaning and looking up to heaven, he said, “Away with the atheists!”


    But when the magistrate pressed him strongly and said, “Swear the oath, and I will release you. Revile the Christ,” Polycarp said, “For eighty-six years I have been his servant, and he has done me no wrong. How then can I blaspheme my King who saved me?”'
translation:
  language: hi
  text: 'पर जब पोलिकार्प रंगभूमि में प्रवेश कर रहे थे, तो स्वर्ग से उनके पास एक आवाज़ आई, “पोलिकार्प, दृढ़ रहो और साहस दिखाओ।” बोलनेवाले को किसी ने नहीं देखा, पर हमारे लोगों में से जो वहाँ उपस्थित थे, उन्होंने वह आवाज़ सुनी। जब अंत में उन्हें वहाँ लाया गया, तो बड़ा कोलाहल मच गया, क्योंकि लोगों ने सुन रखा था कि पोलिकार्प पकड़े गए हैं।


    जब उन्हें प्रांतपाल के सामने लाया गया, तो उसने पूछा, “क्या तुम पोलिकार्प हो?” जब उन्होंने स्वीकार किया कि वे वही हैं, तो उसने उन्हें मुकर जाने के लिए मनाने की कोशिश की। वह कहने लगा, “अपनी उम्र का लिहाज़ करो,” और ऐसी ही दूसरी बातें, जैसी वे प्रायः कहते हैं: “कैसर के सौभाग्य की शपथ खाओ; मन बदलो और कहो, ‘नास्तिकों को दूर करो!’”[a] तब पोलिकार्प ने गंभीर मुखमुद्रा से रंगभूमि में उपस्थित अधर्मी अन्यजातियों की सारी भीड़ की ओर देखा और उनकी ओर हाथ हिलाया। फिर कराहते हुए और स्वर्ग की ओर देखकर उन्होंने कहा, “नास्तिकों को दूर करो!”[b]


    पर जब प्रांतपाल ने उन पर बहुत दबाव डालते हुए कहा, “शपथ खाओ, और मैं तुम्हें छोड़ दूँगा; मसीह की निंदा करो,” तो पोलिकार्प ने कहा, “छियासी वर्षों से मैं उनकी सेवा करता आया हूँ, और उन्होंने मेरे साथ कोई अन्याय नहीं किया। फिर मैं अपने उस राजा की निंदा कैसे कर सकता हूँ, जिसने मुझे बचाया?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कैसर के सौभाग्य” के पीछे यूनानी शब्द τύχη है। यह रोमी धार्मिक-राजकीय संदर्भ में कैसर के भाग्य या संरक्षक सौभाग्य से जुड़ी शपथ को सूचित करता है; इसका अर्थ ‘कैसर का genius’ नहीं है।
    reason: यूनानी शब्द और रोमी शपथ-संदर्भ स्पष्ट करने तथा ‘genius’ वाली असटीक व्याख्या से बचने के लिए।
  - marker: b
    text: अधिकारी चाहता था कि पोलिकार्प “नास्तिक” कहकर मसीहियों को धिक्कारें। पोलिकार्प ने वही शब्द रंगभूमि की अन्यजाति भीड़ की ओर मोड़ दिया।
    reason: कथन की विडंबना और संकेत को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ἀνδρίζου (reconstructed Greek wording; direct source review pending)
  choice: साहस दिखाओ
  rationale: मुहावरे का आशय वीरतापूर्वक दृढ़ रहने से है; लिंग-विशिष्ट शाब्दिक रूप ‘पुरुष बनो’ आधुनिक हिन्दी में भ्रामक होता।
- source_word: στάδιον / stadium (witness)
  choice: रंगभूमि
  rationale: यह सार्वजनिक प्रतियोगिता और दण्ड-प्रदर्शन के स्थल को स्वाभाविक, ऐतिहासिक हिन्दी में व्यक्त करता है।
- source_word: genius of Caesar (English witness; Greek review pending)
  choice: कैसर के संरक्षक-दैव
  rationale: रोमी सम्राट से जुड़े पूज्य संरक्षक आत्मिक/दैवी तत्त्व का संकेत बचाता है; केवल ‘कैसर की शपथ’ कहने से धार्मिक आशय खो जाता।
- source_word: ἄθεοι / atheists (reconstructed)
  choice: नास्तिक
  rationale: 'आरोप की विडंबना बनाए रखता है: अधिकारी का आशय मसीहियों से था, जबकि पोलिकार्प ने वही शब्द मूर्तिपूजक भीड़ पर लौटा दिया।'
- source_word: βλασφήμησον / blaspheme-revile (reconstructed)
  choice: बुरा कहो / निन्दा
  rationale: अधिकारी की आज्ञा में सहज हिन्दी ‘बुरा कहो’ और पोलिकार्प के उत्तर में अधिक गंभीर ‘निन्दा’ प्रसंगानुकूल हैं।
- source_word: ἔθνη / heathen (source wording uncertain)
  choice: गैर-यहूदी
  rationale: जातीय-धार्मिक बाहरी समूह का प्राचीन अर्थ व्यक्त करता है और अपमानजनक आधुनिक लेबल से बचता है; ‘अधर्मी’ अलग नैतिक विशेषण के रूप में रखा गया है।
theological_decisions:
- issue: पोलिकार्प के छियासी वर्षों का आशय
  choice: “छियासी वर्षों से मैं उनकी सेवा करता आया हूँ”
  alternative: “मैं छियासी वर्ष का हूँ और सदा उनका सेवक रहा हूँ” अथवा बपतिस्मा के बाद के छियासी वर्ष
  rationale: पाठ सेवा की अवधि बताता है, पर यह स्पष्ट नहीं करता कि गणना जन्म, बपतिस्मा या किसी अन्य आरंभ से है; अस्पष्टता सुरक्षित रखी गई।
- issue: ‘जिसने मेरा उद्धार किया’ में उद्धार का स्वरूप
  choice: व्यापक धार्मिक शब्द ‘उद्धार’
  alternative: “जिसने मुझे बचाया”
  rationale: कथन में मसीह के उद्धारकारी कार्य का धार्मिक भार संभव है; उसे केवल तत्काल शारीरिक बचाव तक सीमित नहीं किया गया।
- issue: स्वर्गीय आवाज़ की पहचान
  choice: केवल ‘स्वर्ग से ... एक आवाज़’
  alternative: परमेश्वर, मसीह या स्वर्गदूत की आवाज़ के रूप में पहचानना
  rationale: पाठ वक्ता की पहचान नहीं करता और स्वयं कहता है कि किसी ने बोलनेवाले को नहीं देखा; इसलिए पहचान नहीं जोड़ी गई।
