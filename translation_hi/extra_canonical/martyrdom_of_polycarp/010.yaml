  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध गद्य। संवाद स्वाभाविक रखा गया है और प्राचीन न्यायिक-धार्मिक परिवेश के लिए ‘राज्यपाल’, ‘कैसर’, ‘शपथ’, ‘संरक्षक-दैव’ तथा ‘रंगभूमि’ प्रयुक्त हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष यूनानी स्रोत-समीक्षा अभी लंबित होने के कारण संदिग्ध यूनानी पुनर्निर्माणों को निर्णयों में स्पष्ट रूप से चिह्नित किया गया है।
