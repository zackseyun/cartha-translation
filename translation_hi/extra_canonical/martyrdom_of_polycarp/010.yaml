  source_fidelity: 'प्रत्यक्ष यूनानी पाठ के अनुसार मुख्य सुधार आवश्यक है: यहाँ ‘कैसर के genius’ नहीं, ‘τὴν Καίσαρος τύχην’ अर्थात कैसर के भाग्य/सौभाग्य (रोमी धार्मिक-राजकीय शपथ-संदर्भ) की शपथ लेने को कहा गया है। इसलिए मसौदे का ‘संरक्षक-दैव’ मूल पाठ से मेल नहीं खाता। ‘छियासी वर्षों’ वाला वाक्य व्याकरणतः मसीह की सेवा की अवधि कहता है; इसे पोलिकार्प की आयु के बराबर बताने वाली पादटिप्पणी उचित नहीं है।'
  naturalness: संशोधित पाठ आधुनिक, गरिमापूर्ण और सुबोध हिन्दी रखता है। ‘प्रांतपाल’ συγκεκριित रोमी पद proconsul के लिए ‘राज्यपाल’ से अधिक सटीक है; संवादों में ‘तुम’ और कथन में सामान्य एकवचन क्रिया प्राचीन न्यायिक प्रसंग में स्वाभाविक हैं।
  terminology: ‘रंगभूमि’, ‘मसीह’, ‘नास्तिक’, और ‘निंदा’ प्रसंगानुकूल हैं। ‘अधर्मी अन्यजातियों’ मूल के ἀνόμων ἐθνῶν को बिना आधुनिक जातीय अपमान जोड़े सुरक्षित रखता है। ‘मुझे बचाया’ σῴσαντά με के अर्थ को बनाए रखता और उद्धार के स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
  issues:
  - severity: high
    issue: ‘कैसर के संरक्षक-दैव’
    rationale: यूनानी पाठ में τύχη (‘भाग्य’, ‘सौभाग्य’, रोमी Fortuna/Tyche-संबंधी शपथ) है, न कि genius। अंग्रेज़ी audit trail का ‘genius’ स्रोत-पाठ के विरुद्ध है।
  - severity: medium
    issue: पादटिप्पणी c में छियासी वर्षों को आयु भी मानने की संभावना
    rationale: ‘ἔτη ἓξ καὶ ὀγδοήκοντα δουλεύω αὐτῷ’ का प्रत्यक्ष कथन है कि वह छियासी वर्षों से उसकी सेवा कर रहा है। पाठ स्वयं आयु का दावा नहीं करता; पादटिप्पणी की वैकल्पिक व्याख्या अनावश्यक भ्रम पैदा करती है।
  - severity: low
    issue: ‘राज्यपाल’ और ‘क्या वही पोलिकार्प हैं’
    rationale: ἀνθύπατος विशेष रूप से प्रांतपाल/proconsul है, और प्रश्न का सीधा रूप ‘क्या तुम पोलिकार्प हो?’ है।
  revised_text: 'पर जब पोलिकार्प रंगभूमि में प्रवेश कर रहे थे, तो स्वर्ग से उनके पास एक आवाज़ आई, “पोलिकार्प, दृढ़ रहो और साहस दिखाओ।” बोलनेवाले को किसी ने नहीं देखा, पर हमारे लोगों में से जो वहाँ उपस्थित थे, उन्होंने वह आवाज़ सुनी। जब अंत में उन्हें वहाँ लाया गया, तो बड़ा कोलाहल मच गया, क्योंकि लोगों ने सुन रखा था कि पोलिकार्प पकड़े गए हैं।


    जब उन्हें प्रांतपाल के सामने लाया गया, तो उसने पूछा, “क्या तुम पोलिकार्प हो?” जब उन्होंने स्वीकार किया कि वे वही हैं, तो उसने उन्हें मुकर जाने के लिए मनाने की कोशिश की। वह कहने लगा, “अपनी उम्र का लिहाज़ करो,” और ऐसी ही दूसरी बातें, जैसी वे प्रायः कहते हैं: “कैसर के सौभाग्य की शपथ खाओ; मन बदलो और कहो, ‘नास्तिकों को दूर करो!’”[a] तब पोलिकार्प ने गंभीर मुखमुद्रा से रंगभूमि में उपस्थित अधर्मी अन्यजातियों की सारी भीड़ की ओर देखा और उनकी ओर हाथ हिलाया। फिर कराहते हुए और स्वर्ग की ओर देखकर उन्होंने कहा, “नास्तिकों को दूर करो!”[b]


    पर जब प्रांतपाल ने उन पर बहुत दबाव डालते हुए कहा, “शपथ खाओ, और मैं तुम्हें छोड़ दूँगा; मसीह की निंदा करो,” तो पोलिकार्प ने कहा, “छियासी वर्षों से मैं उनकी सेवा करता आया हूँ, और उन्होंने मेरे साथ कोई अन्याय नहीं किया। फिर मैं अपने उस राजा की निंदा कैसे कर सकता हूँ, जिसने मुझे बचाया?”'
  revised_footnotes:
  - marker: a
    text: “कैसर के सौभाग्य” के पीछे यूनानी शब्द τύχη है। यह रोमी धार्मिक-राजकीय संदर्भ में कैसर के भाग्य या संरक्षक सौभाग्य से जुड़ी शपथ को सूचित करता है; इसका अर्थ ‘कैसर का genius’ नहीं है।
    reason: यूनानी शब्द और रोमी शपथ-संदर्भ स्पष्ट करने तथा ‘genius’ वाली असटीक व्याख्या से बचने के लिए।
  - marker: b
    text: अधिकारी चाहता था कि पोलिकार्प “नास्तिक” कहकर मसीहियों को धिक्कारें। पोलिकार्प ने वही शब्द रंगभूमि की अन्यजाति भीड़ की ओर मोड़ दिया।
    reason: कथन की विडंबना और संकेत को स्पष्ट करने के लिए।
  revision_rationale: संशोधन प्रत्यक्ष यूनानी पाठ को प्राथमिकता देता है और अंग्रेज़ी साक्षी/audit trail में ‘genius of Caesar’ के रूप में आए भेद को सुधारता है। प्रांतपाल के प्रश्न, शपथ के विषय, और छियासी वर्षों के कथन को अधिक निकटता से प्रस्तुत किया गया है। अस्पष्ट धार्मिक अर्थों को बढ़ाए बिना ‘मुझे बचाया’ रखा गया है।
