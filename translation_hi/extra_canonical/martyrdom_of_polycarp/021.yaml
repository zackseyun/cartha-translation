  english_witness: 'Ye indeed required that the things which happened should be shown unto you at greater length: but we for the present have certified you as it were in a summary through our brother Marcianus. When then ye have informed yourselves of these things, send the letter about likewise to the brethren which are farther off, that they also may glorify the Lord, who maketh election from His own servants.


    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/021.yaml
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
translation:
  language: hi
  text: 'आपने आग्रह किया था कि जो घटनाएँ घटीं, उनका अधिक विस्तार से वर्णन आपको दिया जाए। पर अभी हमने अपने भाई मार्सियानुस के द्वारा उनका संक्षिप्त विवरण आपको पहुँचा दिया है। जब आप इन बातों को जान लें, तो इस पत्र को दूर-दूर रहने वाले भाई-बहनों के पास भी भेज दें, ताकि वे भी उस प्रभु की महिमा करें, जो अपने सेवकों में से चुनता है।


    अब जो अपने अनुग्रह और उदारता से, अपने एकलौते पुत्र यीशु मसीह के द्वारा, हम सबको अपने अनन्त राज्य में पहुँचा सकता है, उसकी महिमा, आदर, सामर्थ्य और महानता युगानुयुग होती रहे। सभी पवित्र जनों को नमस्कार कहना। जो हमारे साथ हैं, वे आपको नमस्कार कहते हैं। इस पत्र को लिखने वाला यूआरेस्तुस और उसका पूरा घराना भी आपको नमस्कार कहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Marcianus
  choice: मार्सियानुस
  rationale: नाम का ऐसा देवनागरी लिप्यंतरण जो प्राचीन यूनानी/लातीनी रूप के निकट और हिन्दी में पठनीय है।
- source_word: maketh election from His own servants
  choice: अपने सेवकों में से चुनता है
  rationale: चुनाव की क्रिया और ‘अपने सेवकों में से’ के संबंध को बनाए रखते हुए किसी विशिष्ट सम्प्रदायगत सिद्धान्त को आरोपित नहीं किया गया।
- source_word: grace and bounty
  choice: अनुग्रह और उदारता
  rationale: दोनों अलग गुणों को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: only-begotten Son
  choice: एकलौते पुत्र
  rationale: पारंपरिक मसीही पदावली तथा पुत्र की अद्वितीयता को बनाए रखने वाला सहज हिन्दी रूप।
- source_word: saints
  choice: पवित्र जनों
  rationale: यहाँ समुदाय के विश्वासी सदस्यों के संबोधन के रूप में स्वाभाविक है और बाद की औपचारिक संत-पदवी का अर्थ आरोपित नहीं करता।
- source_word: whole house
  choice: पूरा घराना
  rationale: प्राचीन ‘house/household’ के व्यापक पारिवारिक-गृहस्थ समूह को केवल भवन या निकट परिवार तक सीमित नहीं करता।
- source_word: Euarestus
  choice: यूआरेस्तुस
  rationale: नाम का पठनीय देवनागरी लिप्यंतरण, जिसमें उपलब्ध अंग्रेज़ी साक्षी का रूप सुरक्षित है।
theological_decisions:
- issue: प्रभु द्वारा अपने सेवकों में से चुनाव
  choice: जो अपने सेवकों में से चुनता है
  alternative: जो अपने सेवकों को चुनता है
  rationale: ‘में से’ स्रोत-साक्षी में व्यक्त चयन-समूह की बारीकी को बनाए रखता है; चुनाव की प्रकृति या परिणाम की अतिरिक्त व्याख्या नहीं की गई।
- issue: only-begotten की मसीह-संबंधी उपाधि
  choice: एकलौते पुत्र
  alternative: अद्वितीय पुत्र / एकमात्र उत्पन्न पुत्र
  rationale: ‘एकलौता’ हिन्दी बाइबलीय भाषा में परिचित और स्वाभाविक है; ‘उत्पन्न’ से आधुनिक पाठक में जैविक अर्थ की अनावश्यक गलतफहमी हो सकती है।
- issue: अन्तिम स्तुतिवचन में सर्वनाम का संदर्भ
  choice: उसकी महिमा… होती रहे
  alternative: परमेश्वर की महिमा… होती रहे
  rationale: मूल साक्षी का ‘उसे/उसकी’ रूप बनाए रखकर संदर्भ को स्पष्ट नाम जोड़कर आवश्यकता से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक पत्र-शैली रखी गई है। बहुवचन ‘आप’ से मूल के सामूहिक संबोधन को सहज हिन्दी में व्यक्त किया गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है और प्रत्यक्ष यूनानी स्रोत-समीक्षा अभी लंबित है; इसलिए पाठ में कोई अनुमानात्मक पाठालोचनात्मक पादटिप्पणी नहीं जोड़ी गई।
