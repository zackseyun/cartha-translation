theological_decisions:
- issue: ‘कैसर प्रभु है’ की स्वीकारोक्ति
  choice: उद्धरण को यथावत धार्मिक-राजकीय दावे के रूप में रखा गया
  alternative: इसे केवल ‘कैसर हमारा शासक है’ कहना
