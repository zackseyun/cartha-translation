- issue: प्रस्थान का समय
  choice: अप्रत्यक्ष अभिव्यक्ति बनाए रखी गई
  alternative: ‘उनकी मृत्यु का समय’
  rationale: मूल साक्ष्य में उपस्थित संभावित मृत्यु-संकेत को व्याख्यात्मक रूप से निर्णीत नहीं किया गया।
- issue: universal Church
  choice: ‘सार्वभौमिक कलीसिया’
  alternative: किसी विशिष्ट आधुनिक संस्थागत नाम का प्रयोग
  rationale: पाठ की विश्वव्यापी कलीसिया की धारणा को बिना सांप्रदायिक पहचान आरोपित किए सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध शैली रखी गई है। आदरसूचक बहुवचन पॉलीकार्प के लिए लगातार प्रयुक्त है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी स्रोत-पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण पदनामों और ‘बड़ा सब्त’ जैसे वाक्यांशों में उचित सावधानी रखी गई है।
