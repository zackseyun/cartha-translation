base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/009.yaml
  text: 'But when at last he finished his prayer, after remembering everyone who had ever crossed his path—small and great, high and low—and the whole universal Church throughout the world, the hour of departure came. They seated him on a donkey and brought him into the city, since it was a high Sabbath.


    Herod, the captain of police, and his father Nicetes met him. They moved him into their carriage, sat beside him, and tried to persuade him, saying, “What harm is there in saying, ‘Caesar is Lord,’ and offering incense,” along with more words to this effect, “and saving yourself?” At first he gave them no answer. But when they persisted, he said, “I am not going to do what you advise me.”


    Then, having failed to persuade him, they spoke threatening words and made him get out quickly, so that he bruised his shin as he stepped down from the carriage. Without even turning around, he continued promptly and quickly on his way, as though nothing had happened to him, while he was taken to the stadium. There was such an uproar in the stadium that no one’s voice could even be heard.'
translation:
  language: hi
  text: 'अंततः जब उन्होंने अपनी प्रार्थना पूरी की—उन सबको स्मरण करने के बाद जो कभी उनके संपर्क में आए थे, छोटे-बड़े, ऊँचे-नीचे, और संसार भर में फैली पूरी सार्वभौमिक कलीसिया को भी—तो प्रस्थान का समय आ गया। उन्होंने उन्हें एक गधे पर बैठाया और नगर में ले आए, क्योंकि वह एक बड़ा सब्त था।[a]


    पुलिस-अधिकारी हेरोदेस और उसके पिता निकेतास उनसे मिले। उन्होंने उन्हें अपने रथ में बैठा लिया और स्वयं उनके पास बैठकर उन्हें मनाने लगे। वे कहने लगे, “यह कहने में क्या हानि है कि ‘कैसर प्रभु है,’ और धूप चढ़ाने में”—और इसी आशय की दूसरी बातें कहते हुए बोले—“और इस तरह अपने आप को बचा लेने में?” पहले तो उन्होंने उन्हें कोई उत्तर नहीं दिया। पर जब वे आग्रह करते रहे, तो उन्होंने कहा, “तुम मुझे जो सलाह दे रहे हो, वह मैं नहीं करूँगा।”


    तब वे उन्हें मनाने में असफल होकर धमकियाँ देने लगे और उन्हें जल्दी से रथ से उतरने पर मजबूर किया। रथ से उतरते समय उनकी पिंडली छिल गई। फिर भी उन्होंने पीछे मुड़कर तक नहीं देखा, बल्कि ऐसे तत्परता से तेज़ी से आगे बढ़ते रहे मानो उन्हें कुछ हुआ ही न हो। उन्हें रंगभूमि में ले जाया जा रहा था। वहाँ इतना कोलाहल था कि किसी की आवाज़ तक सुनाई नहीं दे सकती थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बड़ा सब्त” उपलब्ध अंग्रेज़ी साक्ष्य के “high Sabbath” का निकट अनुवाद है। इसका सटीक ऐतिहासिक आशय अनिश्चित है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: असामान्य काल-सूचक पद को बिना सामंजस्य या अनुमानित व्याख्या के सुरक्षित रखने के लिए।
