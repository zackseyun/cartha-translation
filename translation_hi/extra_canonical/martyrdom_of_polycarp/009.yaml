  rationale: राजकीय निष्ठा और धार्मिक स्वीकारोक्ति के बीच मूल तनाव को स्पष्ट रखते हुए पदवी ‘प्रभु’ को बनाए रखा गया।
- source_word: offering incense
  choice: धूप चढ़ाने
  rationale: अनुष्ठानिक क्रिया को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
