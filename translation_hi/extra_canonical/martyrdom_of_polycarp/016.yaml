base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/016.yaml
  text: 'When he had offered up the Amen and finished his prayer, those tending the fire lit the fire. And a mighty flame flashing forth, we to whom it was given to see saw a marvel; yea, and we were preserved that we might relate to the rest what happened.


    The fire, making the appearance of a vault, like the sail of a vessel filled by the wind, made a wall round about the body of the martyr; and it was there in the midst, not like flesh burning, but like [a loaf in the oven or like] gold and silver refined in a furnace. For we perceived such a fragrant smell, as if it were the wafted odor of frankincense or some other precious spice.'
translation:
  language: hi
  text: 'जब वह “आमीन” कह चुका और अपनी प्रार्थना पूरी कर चुका, तब आग की देखरेख करनेवालों ने आग सुलगा दी। एक प्रचंड ज्वाला भभक उठी, और हममें से जिन्हें यह देखने का अवसर दिया गया था, उन्होंने एक अद्भुत दृश्य देखा। हाँ, हमें इसलिए जीवित भी रखा गया कि जो कुछ हुआ, वह हम बाकी लोगों को बता सकें।


    आग ने मेहराब-सा रूप ले लिया—मानो हवा से भरा हुआ किसी जहाज़ का पाल हो—और शहीद के शरीर के चारों ओर दीवार-सी बन गई। वह उसके बीच में था, पर जलते हुए मांस जैसा नहीं, बल्कि [भट्ठी में पकती रोटी जैसा, या] भट्ठी में तपाए जाते सोने और चाँदी जैसा दिखाई दे रहा था। हमें ऐसी सुगंध महसूस हुई, मानो लोबान या किसी और बहुमूल्य सुगंध-द्रव्य की महक हवा में बहती हुई आ रही हो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर अस्थायी रूप से तैयार किया गया है; यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष समीक्षा अभी शेष है। वर्ग कोष्ठकों में आया वाक्यांश पाठ की पुनर्स्थापना या पांडुलिपि की क्षति/अनिश्चितता का संकेत देता है।
    reason: स्रोत-भाषा समीक्षा की लंबित स्थिति और वर्ग कोष्ठकों की पाठालोचनात्मक प्रकृति को पारदर्शी बनाना।
lexical_decisions:
- source_word: offered up the Amen
  choice: “आमीन” कह चुका
  rationale: हिन्दी में स्वाभाविक रखते हुए प्रार्थना के समापन पर उच्चरित ‘आमीन’ का आशय सुरक्षित रखा गया है; ‘आमीन अर्पित किया’ अस्वाभाविक होता।
- source_word: those tending the fire / firemen
  choice: आग की देखरेख करनेवालों
  rationale: आधुनिक ‘दमकलकर्मी’ के भ्रामक अर्थ से बचते हुए उन व्यक्तियों को दर्शाता है जिनका काम दंड की आग जलाना और संभालना था।
- source_word: vault
  choice: मेहराब-सा रूप
  rationale: ज्वाला के ऊपर मुड़कर घेरे जैसा बनने की दृश्यात्मकता देता है; ‘तिजोरी’ जैसे आधुनिक अर्थ से बचता है।
- source_word: martyr
  choice: शहीद
  rationale: आस्था के कारण मृत्यु सहनेवाले व्यक्ति के लिए प्रचलित, सहज और गरिमापूर्ण हिन्दी शब्द।
- source_word: frankincense
  choice: लोबान
  rationale: प्राचीन सुगंधित धूप के लिए सामान्य और ऐतिहासिक रूप से उपयुक्त हिन्दी पद।
theological_decisions:
- issue: वर्णित चमत्कार की कथात्मक स्थिति
  choice: प्रत्यक्षदर्शियों के दावे के रूप में बिना शंका-सूचक भाषा के अनुवाद
  alternative: घटना को प्रतीकात्मक या किंवदंती-सदृश बताना
  rationale: मूल साक्ष्य इसे प्रत्यक्ष देखी घटना के रूप में प्रस्तुत करता है; अनुवाद को इस दावे को न बढ़ाना चाहिए, न घटाना।
- issue: ‘हमें जीवित रखा गया’ में कर्ता की अस्पष्टता
  choice: कर्ता का नाम न जोड़ते हुए कर्मवाच्य बनाए रखा
  alternative: ‘परमेश्वर ने हमें जीवित रखा’
  rationale: पाठ में निहित धार्मिक संकेत संभव है, पर उपलब्ध आधार में कर्ता स्पष्ट नहीं है; इसलिए अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। लंबे अंग्रेज़ी वाक्यों को पठनीय हिन्दी वाक्यों में बाँटा गया है, जबकि प्रत्यक्षदर्शी स्वर, अलौकिक वर्णन और पाठगत अनिश्चितता को सुरक्षित रखा गया है।
