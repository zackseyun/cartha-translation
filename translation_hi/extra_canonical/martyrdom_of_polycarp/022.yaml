base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/022.yaml
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
translation:
  language: hi
  text: अब धन्य पॉलीकार्प महीने ज़ैंथिकुस के पहले भाग के दूसरे दिन, मार्च के कैलेंड्स से सातवें दिन पहले, एक महान सब्त के दिन, आठवें घंटे में शहीद हुए। उन्हें हेरोदेस ने पकड़ा था, उस समय जब त्राल्लेस का फिलिप महायाजक था और स्तातियुस क्वाद्रातुस प्रोकॉन्सुल था; पर यह अनन्त राजा यीशु मसीह के राज्यकाल में हुआ। उसी की महिमा, आदर, महानता और अनन्त सिंहासन पीढ़ी से पीढ़ी तक बना रहे। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Xanthicus
  choice: ज़ैंथिकुस
  rationale: प्राचीन मास के नाम को आधुनिक कैलेंडर से समरूप किए बिना लिप्यंतरित किया गया है।
- source_word: Kalends
  choice: कैलेंड्स
  rationale: रोमी तिथि-पद्धति के तकनीकी पद को बनाए रखा गया है, क्योंकि आधुनिक तारीख में बदलना अनिश्चितता को छिपा सकता है।
- source_word: great Sabbath
  choice: महान सब्त
  rationale: विशिष्ट किंतु अस्पष्ट प्राचीन अभिव्यक्ति को बिना व्याख्यात्मक सामंजस्य के सीधे रखा गया है।
- source_word: high priest
  choice: महायाजक
  rationale: पदवी का औपचारिक अर्थ सुरक्षित रखा गया है; इसके स्थानीय या पंथ-संबंधी आशय को पाठ में अनुमान से नहीं जोड़ा गया।
- source_word: proconsulship
  choice: प्रोकॉन्सुल था
  rationale: रोमी प्रशासनिक पद को लिप्यंतरित कर स्वाभाविक हिन्दी वाक्य में व्यक्त किया गया है।
- source_word: martyred
  choice: शहीद हुए
  rationale: हिंसा के कारण विश्वास-साक्षी के रूप में मृत्यु के स्थापित और सामान्य हिन्दी अर्थ को व्यक्त करता है।
theological_decisions:
- issue: सांसारिक अधिकारियों और मसीह के राज्यकाल का विरोधाभास
  choice: स्तातियुस क्वाद्रातुस के प्रोकॉन्सुल होने का उल्लेख करने के बाद ‘पर’ द्वारा यीशु मसीह के अनन्त राज्यकाल को रखा गया
  alternative: दोनों काल-सूचकों को बिना विरोधसूचक संयोजक के समानांतर रखना
  rationale: साक्ष्य में उपस्थित ‘but’ राजनीतिक काल-निर्धारण और मसीह की सर्वोच्च राजसत्ता के बीच जानबूझकर किया गया विरोध बनाए रखता है।
- issue: अंतिम स्तुतिवचन का सर्वनाम
  choice: ‘उसी की’ को निकटतम पूर्वपद यीशु मसीह से संबद्ध रखा गया
  alternative: स्पष्ट रूप से ‘यीशु मसीह की’ दोहराना
  rationale: मूल साक्ष्य की सर्वनामात्मक शैली सुरक्षित रहती है और अनावश्यक विस्तार नहीं होता।
- issue: eternal throne की व्याकरणिक भूमिका
  choice: महिमा, आदर और महानता के साथ ‘अनन्त सिंहासन’ को भी कामनात्मक स्तुतिवचन में रखा गया
  alternative: ‘वह अनन्त सिंहासन पर विराजमान रहे’
  rationale: स्रोत-साक्ष्य की असामान्य संज्ञा-सूची और संभावित धार्मिक तनाव को सुगम बनाने के नाम पर पुनर्व्याख्यायित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली रखी गई है। प्राचीन यूनानी की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है। प्राचीन मास, रोमी तिथि-पद्धति और ‘महान सब्त’ का आधुनिकीकरण या सामंजस्य नहीं किया गया।
