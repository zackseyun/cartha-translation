    Then he said to him again, ''I will cause thee to be consumed by fire, if thou despisest the wild beasts, unless thou repent.'' But Polycarp said; ''Thou threatenest that fire which burneth for a season and after a little while is quenched: for thou art ignorant of the fire of the future judgment and eternal punishment, which is reserved for the ungodly. But why delayest thou? Come, do what thou wilt.'''
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/012.yaml
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you repent.” But he said, “Call for them, for repentance from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you repent.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
translation:
  language: hi
  text: 'तब राज्यपाल ने कहा, “मेरे पास जंगली जानवर हैं। यदि तुम पश्चात्ताप नहीं करोगे, तो मैं तुम्हें उनके आगे फिंकवा दूँगा।”


    पोलिकार्प ने कहा, “उन्हें बुला लो। बेहतर से बदतर की ओर मुड़ने जैसा पश्चात्ताप हमारे लिए स्वीकार नहीं है; लेकिन बुराई से उस ओर मुड़ना जो उचित है, एक भली बात है।”[a]


    राज्यपाल ने उससे फिर कहा, “यदि तुम जंगली जानवरों को तुच्छ समझते हो और पश्चात्ताप नहीं करोगे, तो मैं तुम्हें आग में भस्म करवा दूँगा।”


    लेकिन पोलिकार्प ने कहा, “तुम मुझे उस आग की धमकी देते हो जो कुछ समय तक जलती है और थोड़ी देर बाद बुझ जाती है। क्योंकि तुम आने वाले न्याय की आग और उस अनन्त दण्ड से अनजान हो जो भक्तिहीनों के लिए रखा गया है।[b] पर तुम देर क्यों करते हो? आओ, जो करना चाहते हो, करो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ पोलिकार्प राज्यपाल के शब्द को पलटकर उत्तर देता है: विश्वास से फिरना उसके लिए बेहतर से बदतर की ओर जाना है, जबकि वास्तविक परिवर्तन बुराई से उचित मार्ग की ओर होता है।'
    reason: मूल के शब्द-खेल और नैतिक विरोध को हिन्दी पाठक के लिए स्पष्ट करना।
  - marker: b
    text: अर्थात वह आग जो आने वाले न्याय और अनन्त दण्ड से जुड़ी है; पाठ दण्ड की अवधि या स्वरूप का आगे विवरण नहीं देता।
    reason: धर्मवैज्ञानिक कथन को उसके पाठगत दायरे में रखना और अनकहा विवरण न जोड़ना।
lexical_decisions:
- source_word: 'repent / change (Greek witness tradition: μετανοέω / μετάνοια)'
  choice: पश्चात्ताप करना / मुड़ना
  rationale: राज्यपाल की माँग को ‘पश्चात्ताप’ से व्यक्त किया गया है, जबकि पोलिकार्प के प्रत्युत्तर में दिशा-परिवर्तन का भाव स्पष्ट करने के लिए ‘मुड़ना’ रखा गया है। इससे मूल का शब्द-खेल और नैतिक उलटाव यथासंभव बना रहता है।
- source_word: proconsul
  choice: राज्यपाल
  rationale: रोमी पदवी का सामान्य पाठक के लिए सहज कार्यात्मक रूप; ‘प्रोकौंसल’ अधिक तकनीकी और कम सुबोध होता।
- source_word: wild beasts
  choice: जंगली जानवर
  rationale: स्वाभाविक आधुनिक हिन्दी और दण्ड हेतु रखे गए हिंसक पशुओं का पर्याप्त स्पष्ट संकेत।
- source_word: from better to worse
  choice: बेहतर से बदतर की ओर
  rationale: तुलनात्मक विरोध को निकटता से बनाए रखता है और पोलिकार्प के प्रत्युत्तर की धार सुरक्षित करता है।
- source_word: from untowardness to righteousness
  choice: बुराई से उस ओर जो उचित है
  rationale: नैतिक दिशा-परिवर्तन को व्यक्त करता है, पर किसी विशिष्ट सम्प्रदायगत अर्थ को आरोपित नहीं करता।
- source_word: consumed by fire
  choice: आग में भस्म करवा दूँगा
  rationale: धमकी के कारक भाव और पूर्ण विनाश की तीव्रता को स्वाभाविक हिन्दी में रखता है।
- source_word: ungodly
  choice: भक्तिहीन
  rationale: ईश्वर के प्रति श्रद्धा और धर्मपरायणता के अभाव को दर्शाता है; केवल सामान्य नैतिक ‘दुष्टता’ तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: राज्यपाल के ‘पश्चात्ताप’ और पोलिकार्प के नैतिक दिशा-परिवर्तन के बीच शब्द-खेल
  choice: मुख्य माँग में ‘पश्चात्ताप’ और व्याख्यात्मक प्रत्युत्तर में ‘मुड़ना’
  alternative: हर स्थान पर केवल ‘पश्चात्ताप करना’ या ‘मन बदलना’
  rationale: एक ही मूल शब्द-परिवार के आलंकारिक प्रयोग को दिखाते हुए हिन्दी में यह स्पष्ट करता है कि पोलिकार्प धर्मत्याग को बेहतर से बदतर की ओर परिवर्तन मानता है।
- issue: future judgment and eternal punishment
  choice: आने वाला न्याय और अनन्त दण्ड
  alternative: अगले युग का न्याय और युग-सम्बन्धी दण्ड
  rationale: प्राप्त साक्ष्य में सामान्य और प्रबल अर्थ ‘अनन्त दण्ड’ है; फिर भी वाक्य को विस्तार देकर दण्ड की प्रकृति पर अतिरिक्त सिद्धान्त आरोपित नहीं किया गया।
- issue: fire reserved for the ungodly
  choice: आग और दण्ड दोनों को भविष्य के न्याय से जोड़ा गया
  alternative: केवल दण्ड को भविष्य का बताना
  rationale: वाक्य की समानाधिकरणात्मक संरचना और प्रलयकालीन तनाव को हिन्दी में स्पष्ट बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज हिन्दी। रोमी पदवी के लिए तकनीकी लिप्यंतरण के बदले ‘राज्यपाल’ रखा गया है। प्रत्यक्ष कथन संक्षिप्त और दृढ़ हैं, जिससे पूछताछ तथा शहादत का नाटकीय तनाव बना रहे। उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और दी गई यूनानी पांडुलिपि-परंपरा की सूचना के आधार पर यह प्रकाशन-प्रारूप मसौदा है; पूर्ण प्रत्यक्ष यूनानी पाठ-समीक्षा अभी अपेक्षित है।
