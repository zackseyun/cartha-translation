base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/008.yaml
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  language: hi
  text: 'वे उस लड़के को अपने साथ ले गए। शुक्रवार को, लगभग संध्या-भोजन के समय, सिपाही और घुड़सवार अपने सामान्य हथियार लेकर ऐसे उतावले होकर निकले, मानो किसी डाकू को पकड़ने जा रहे हों। देर शाम वे सब एक साथ वहाँ पहुँचे और उन्होंने उस व्यक्ति को एक छोटे-से घर की ऊपरी कोठरी में बिस्तर पर पाया। यद्यपि वह वहाँ से किसी दूसरी जगह जा सकता था, फिर भी उसने ऐसा नहीं किया। उसने कहा, “परमेश्वर की इच्छा पूरी हो।”


    जब उसे पता चला कि वे आ गए हैं, तो वह नीचे उतरा और उनसे बातचीत की। वहाँ खड़े लोग उसकी आयु और दृढ़ता पर अचंभित थे। वे सोच रहे थे कि उसके जैसे वृद्ध व्यक्ति को पकड़ने के लिए इतनी उतावली क्यों दिखाई जा रही है। तब उसने तुरंत आदेश दिया कि उनके लिए मेज लगाई जाए, ताकि वे उसी समय जितना चाहें खा-पी सकें। फिर उसने उन्हें इस बात के लिए मना लिया कि वे उसे बिना बाधा के प्रार्थना करने के लिए एक घंटे का समय दें।


    जब वे मान गए, तो वह खड़ा होकर प्रार्थना करने लगा। वह परमेश्वर के अनुग्रह से इतना परिपूर्ण था कि दो घंटे तक बोलना बंद न कर सका। सुननेवाले अचंभित रह गए, और बहुतों को इस बात का पछतावा हुआ कि वे ऐसे आदरणीय वृद्ध को पकड़ने आए थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gendarmes and horsemen
  choice: सिपाही और घुड़सवार
  rationale: आधुनिक पाठक के लिए स्वाभाविक और ऐतिहासिक रूप से पर्याप्त व्यापक पद; आधुनिक फ्रांसीसी अर्थवाले ‘जेंडार्म’ से बचा गया।
- source_word: as against a robber
  choice: मानो किसी डाकू को पकड़ने जा रहे हों
  rationale: तुलना की तीव्रता और गिरफ्तारी के संदर्भ को स्पष्ट रखते हुए स्वाभाविक हिन्दी दी गई।
- source_word: constancy
  choice: दृढ़ता
  rationale: यहाँ स्थिर साहस और अपने निर्णय पर अडिग रहने का भाव है; ‘निष्ठा’ से अधिक संदर्भानुकूल।
- source_word: unmolested
  choice: बिना किसी बाधा के
  rationale: प्रार्थना के दौरान निर्बाध समय माँगने का आशय सरल आधुनिक हिन्दी में व्यक्त होता है।
- source_word: grace of God
  choice: परमेश्वर का अनुग्रह
  rationale: धार्मिक अर्थ को बनाए रखनेवाला प्रचलित और संप्रदाय-निरपेक्ष हिन्दी पद।
- source_word: venerable old man
  choice: आदरणीय वृद्ध
  rationale: आयु और सम्मान दोनों का भाव गरिमापूर्ण, सहज हिन्दी में सुरक्षित है।
theological_decisions:
- issue: The will of God be done
  choice: परमेश्वर की इच्छा पूरी हो
  alternative: परमेश्वर की इच्छा हो
  rationale: वाक्य को प्रार्थनापूर्ण समर्पण के रूप में रखा गया है और किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को नहीं जोड़ा गया।
- issue: so full of the grace of God
  choice: वे परमेश्वर के अनुग्रह से इतने परिपूर्ण थे
  alternative: उनमें परमेश्वर का अनुग्रह इतना भरपूर था
  rationale: कथन की आध्यात्मिक शक्ति सुरक्षित रखी गई है, पर इसे किसी तकनीकी सिद्धांत की भाषा में नहीं बदला गया।
- issue: could not hold his peace
  choice: चुप न हो सके
  alternative: प्रार्थना करना बंद न कर सके
  rationale: मूल साक्ष्य की अभिव्यक्ति को निकटता से रखा गया है; संदर्भ से स्पष्ट है कि वे प्रार्थना में बोलते रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक बहुवचन और गरिमापूर्ण कथात्मक शैली अपनाई गई है। अत्यधिक संस्कृतनिष्ठ तथा औपनिवेशिक प्रशासनिक शब्दावली से बचा गया। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी स्रोत-पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण कोई पाठालोचनात्मक फुटनोट नहीं जोड़ा गया।
