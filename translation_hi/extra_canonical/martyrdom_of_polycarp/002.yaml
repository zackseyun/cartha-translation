base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/002.yaml
  text: 'Brethren, we write unto you an account of what befell those who suffered martyrdom, and especially the blessed Polycarp, who stayed the persecution, having, as it were, set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom conformable to the Gospel.


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, looking not only to that which concerns ourselves, but also to that which concerns our neighbors. For it is the office of true and steadfast love not only to desire that oneself be saved, but all the brethren also.'
translation:
  language: hi
  text: 'भाइयो, हम तुम्हें उन लोगों के साथ घटी घटनाओं का विवरण लिख रहे हैं जिन्होंने शहादत सही, और विशेष रूप से धन्य पॉलीकार्प का। उन्होंने अपनी शहादत के द्वारा मानो उस पर मुहर लगाकर उत्पीड़न का अंत कर दिया। पहले घटी लगभग सभी घटनाएँ इसलिए हुईं कि प्रभु एक बार फिर हमें ऐसी शहादत का उदाहरण दिखाए जो सुसमाचार के अनुरूप हो।


    क्योंकि वह तब तक रुके रहे जब तक उन्हें पकड़वा न दिया गया, ठीक वैसे ही जैसे प्रभु ने किया था, ताकि हम भी उनका अनुकरण करें और केवल अपने हित की नहीं, बल्कि अपने पड़ोसियों के हित की भी चिंता करें। क्योंकि सच्चे और दृढ़ प्रेम का काम यह है कि मनुष्य केवल अपना ही उद्धार न चाहे, बल्कि सभी भाइयों का भी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: brethren
  choice: भाइयो / भाइयों
  rationale: समुदाय को संबोधित करने और उसके सभी सदस्यों के सामूहिक उल्लेख के लिए प्राचीन धार्मिक पत्र-शैली के अनुरूप, पर आधुनिक हिन्दी में सहज रूप।
- source_word: suffered martyrdom
  choice: शहादत सही
  rationale: मृत्यु तक विश्वासयोग्य साक्षी बने रहने और उसके कारण कष्ट सहने का भाव संक्षेप में रखता है; केवल ‘मारे गए’ की अपेक्षा धार्मिक आशय सुरक्षित रहता है।
- source_word: stayed the persecution
  choice: उत्पीड़न का अंत कर दिया
  rationale: अंग्रेज़ी साक्ष्य में ‘stayed’ का स्वाभाविक अर्थ रोकना/अंत करना है, यद्यपि यूनानी समीक्षा लंबित होने के कारण अर्थ की पुष्टि आवश्यक है।
- source_word: set his seal upon it
  choice: उस पर मुहर लगाकर
  rationale: समापन अथवा निर्णायक पुष्टि के रूपक को मूल चित्र सहित बनाए रखता है।
- source_word: conformable to the Gospel
  choice: सुसमाचार के अनुरूप
  rationale: शहादत को सुसमाचार द्वारा प्रस्तुत प्रतिमान से संगत बताता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
- source_word: linger(ed)
  choice: तब तक रुके रहे
  rationale: जानबूझकर प्रतीक्षा करने का भाव देता है, पर कायरतापूर्ण टालमटोल का अर्थ आरोपित नहीं करता।
- source_word: delivered up
  choice: पकड़वा दिया गया
  rationale: विश्वासघात अथवा अधिकारियों के हाथ सौंपे जाने की संभावित प्रतिध्वनि रखता है; केवल ‘गिरफ्तार’ से अधिक निकट।
- source_word: neighbors
  choice: पड़ोसियों
  rationale: व्यक्ति के निकट अन्य लोगों के लिए पारंपरिक और समझने योग्य नैतिक शब्दावली।
theological_decisions:
- issue: पॉलीकार्प की शहादत और प्रभु के उदाहरण का संबंध
  choice: ‘ठीक वैसे ही जैसे प्रभु ने किया था’ को अनुकरण के प्रतिमान के रूप में रखा
  alternative: दोनों घटनाओं को उद्धारकारी अर्थ में समान ठहराना
  rationale: साक्ष्य अनुकरण और सौंपे जाने की समानता बताता है; वह पॉलीकार्प की मृत्यु को प्रभु की मृत्यु के समान उद्धारकारी नहीं ठहराता।
- issue: ‘saved’ का अर्थ
  choice: ‘उद्धार’
  alternative: ‘सुरक्षित बचना’ अथवा ‘प्राण बचना’
  rationale: संदर्भ में आध्यात्मिक उद्धार संभव है, जबकि शहादत के प्रसंग से शारीरिक बचाव का तनाव भी उपस्थित रहता है। धार्मिक अर्थ को बनाए रखा गया, पर कोई विस्तृत सिद्धान्त नहीं जोड़ा गया।
- issue: सुसमाचार के अनुरूप शहादत
  choice: वर्णन को मानक उदाहरण के रूप में रखा
  alternative: शहादत की हर खोज या स्वैच्छिक मृत्यु को अनुमोदन मानना
  rationale: पाठ प्रभु के उदाहरण के अनुरूप शहादत की प्रशंसा करता है; वह स्वयं मृत्यु खोजने का सार्वभौमिक आदेश नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पत्रात्मक शैली अपनाई गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित है। इसलिए ‘stayed’, ‘linger’ और ‘delivered up’ जैसे पदों का अनुवाद साक्ष्य के आधार पर सावधानी से किया गया है और भविष्य में यूनानी पाठ से सत्यापन अपेक्षित है।
