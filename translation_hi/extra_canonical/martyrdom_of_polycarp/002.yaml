source:
  text: 'We write unto you, brethren, an account of what befell those that suffered martyrdom and especially the blessed Polycarp, who stayed the persecution, having as it were set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom which is conformable to the Gospel


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, not looking only to that which concerneth ourselves, but also to that which concerneth our neighbors. For it is the office of true and steadfast love, not only to desire that oneself be saved, but all the brethren also.'
