  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: hi
  text: 'इसलिए उन्होंने उन्हें कीलों से नहीं जड़ा, बल्कि बाँध दिया। तब उन्होंने अपने हाथ पीठ के पीछे कर लिए और उन्हें खूँटे से बाँध दिया गया। वह मानो किसी बड़े झुंड में से भेंट के लिए चुना गया एक उत्तम मेढ़ा थे—परमेश्वर के लिए तैयार की गई और उसे स्वीकार्य होमबलि। उन्होंने स्वर्ग की ओर देखकर कहा:


    “हे प्रभु, सर्वशक्तिमान परमेश्वर,

    आपके प्रिय और धन्य पुत्र यीशु मसीह के पिता,

    जिनके द्वारा हमने आपको जाना है;

    स्वर्गदूतों, सामर्थ्यों और सारी सृष्टि के परमेश्वर,

    और उन सभी धर्मियों के परमेश्वर, जो आपकी उपस्थिति में जीते हैं।


    मैं आपको धन्य कहता हूँ,

    क्योंकि आपने मुझे इस दिन और इस घड़ी के योग्य समझा,

    कि मैं शहीदों की गिनती में भाग पाऊँ,

    [आपके] मसीह के प्याले में सहभागी होकर

    आत्मा और शरीर—दोनों के अनन्त जीवन के पुनरुत्थान के लिए,

    पवित्र आत्मा की अविनश्वरता में।


    आज मैं आपकी उपस्थिति में उनके बीच

    एक भरपूर और स्वीकार्य बलिदान के रूप में ग्रहण किया जाऊँ,

    जैसा आपने पहले से तैयार किया और प्रकट किया था,

    और अब पूरा भी किया है—

    आप, जो विश्वासयोग्य और सच्चे परमेश्वर हैं।


    इसी कारण, और सब बातों के लिए भी,

    मैं आपकी स्तुति करता हूँ, आपको धन्य कहता हूँ,

    और आपकी महिमा करता हूँ,

    अनन्त और स्वर्गीय महायाजक,

    आपके प्रिय पुत्र यीशु मसीह के द्वारा;

    जिनके द्वारा, उनके साथ और पवित्र आत्मा के साथ,

    आपकी महिमा अब [और सदा] तथा आने वाले युगों तक होती रहे। आमीन।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर अस्थायी रूप से तैयार किया गया है; यूनानी पांडुलिपि-परंपरा से प्रत्यक्ष समीक्षा अभी शेष है। वर्ग कोष्ठक प्रदत्त साक्ष्य में पाठ-पुनर्स्थापन या पाठगत अनिश्चितता को दर्शाते हैं।
    reason: उपयोगकर्ता द्वारा दिए गए स्रोत की सीमा और कोष्ठकों के पाठालोचनात्मक स्वरूप को पारदर्शी बनाना आवश्यक है।
lexical_decisions:
- source_word: nail / tied / stake
  choice: कीलों से जड़ा / बाँध दिया / खूँटा
  rationale: दंड-विधान की ठोस क्रियाओं और साधन को स्पष्ट रखते हुए स्वाभाविक आधुनिक हिन्दी चुनी गई है।
- source_word: noble ram
  choice: उत्तम मेढ़ा
  rationale: बलिदानी बिंब को बनाए रखता है; ‘कुलीन’ यहाँ अप्राकृतिक और भ्रामक होता।
- source_word: burnt sacrifice
  choice: होमबलि
  rationale: पूर्णतः जलाई जाने वाली बलि के पारंपरिक धार्मिक अर्थ को संक्षेप और सटीक रूप से व्यक्त करता है।
- source_word: powers
  choice: सामर्थ्य
  rationale: यह सम्भवतः स्वर्गीय शक्तियों/सत्ताओं का संकेत है; बहुवचन का अर्थ हिन्दी में सामूहिक संज्ञा द्वारा रखा गया है, बिना किसी निश्चित देवदूतीय श्रेणी का आरोप किए।
- source_word: martyrs
  choice: शहीद
  rationale: आस्था के लिए प्राण देने वाले साक्षियों के लिए आधुनिक हिन्दी में सर्वाधिक समझा जाने वाला शब्द।
- source_word: cup
  choice: प्याला
  rationale: मसीह के दुःख और मृत्यु में सहभागिता का मूल रूपक ज्यों का त्यों रखा गया है।
- source_word: incorruptibility
  choice: अविनश्वरता
  rationale: क्षय अथवा विनाश से परे अवस्था को गरिमापूर्ण और बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: High-priest
  choice: महायाजक
  rationale: आराधनात्मक और याजकीय पदवी का प्रचलित हिन्दी समतुल्य।
theological_decisions:
- issue: ‘in the incorruptibility of the Holy Spirit’ का संबंध
  choice: ‘पवित्र आत्मा की अविनश्वरता में’ को पृथक पंक्ति में निकट रखा गया
  alternative: इसे केवल आत्मा और शरीर के पुनरुत्थान अथवा केवल अनन्त जीवन से स्पष्ट रूप से जोड़ना
  rationale: साक्ष्य में वाक्यगत संबंध कुछ तनावपूर्ण है; अनुवाद ने किसी एक व्यवस्थित धर्मवैज्ञानिक व्याख्या को निश्चित नहीं किया।
- issue: मसीह के प्याले में सहभागिता
  choice: रूपक को शाब्दिक रूप से बनाए रखा
  alternative: इसे ‘मसीह के दुःख में सहभागी’ कहकर खोल देना
  rationale: मूल धार्मिक बिंब और उसकी बहुस्तरीयता—दुःख, मृत्यु और सहभागिता—सुरक्षित रहती है।
- issue: अंतिम महिमा-वाक्य का व्याकरण
  choice: ‘जिनके द्वारा, उनके साथ और पवित्र आत्मा के साथ, आपकी महिमा… होती रहे’
  alternative: महिमा को सीधे मसीह और पवित्र आत्मा को भी समानांतर रूप से संबोधित करना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के असहज ‘through whom with him’ को बिना संप्रदायगत विस्तार के यथासंभव निकट रखा गया।
- issue: कोष्ठकित सर्वनाम और कालवाचक पद
  choice: '[आपके] और [और सदा] के वर्ग कोष्ठक सुरक्षित रखे'
  alternative: उन्हें निर्विवाद मूल पाठ मानकर बिना कोष्ठक छापना या हटा देना
  rationale: प्रदत्त साक्ष्य में ये पुनर्स्थापन अथवा पाठ-संदेह के संकेत हैं; इन्हें मौन रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ईश्वर को आदरसूचक ‘आप’ से संबोधित किया गया है। वाक्य-विन्यास को हिन्दी के अनुरूप किया गया, पर बलिदान, प्याला, पुनरुत्थान और महायाजक जैसे प्रमुख प्राचीन धार्मिक बिंब सुरक्षित रखे गए हैं। प्रत्यक्ष यूनानी समीक्षा उपलब्ध न होने के कारण मसौदा जानबूझकर पाठगत दावों में संयमित है।
