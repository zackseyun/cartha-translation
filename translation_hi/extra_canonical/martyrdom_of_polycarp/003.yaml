  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/003.yaml
  text: 'Blessed, therefore, and noble are all the martyrdoms that have taken place according to the will of God—for it behooves us to be very scrupulous and to assign to God power over all things.


    For who could fail to admire their nobility, patient endurance, and loyalty to the Master? For, when they were so torn by lashes that the mechanism of their flesh was visible even as far as the inward veins and arteries, they endured patiently, so that the very bystanders had pity and wept; while they themselves reached such a pitch of bravery that none of them uttered a cry or a groan, thus showing us all that at that hour the martyrs of Christ, while being tortured, were absent from the flesh—or rather, that the Lord was standing by and conversing with them.


    And, giving heed to the grace of Christ, they despised the tortures of this world, purchasing at the cost of one hour a release from eternal punishment. And they found the fire of their inhuman torturers cold, for they set before their eyes escape from the eternal fire that is never quenched; while with the eyes of their heart they gazed upon the good things reserved for those who endure patiently, things that neither ear has heard nor eye has seen, neither have they entered into the heart of man, but were shown to them by the Lord, for they were no longer men but already angels.


    And in like manner also those condemned to the wild beasts endured fearful punishments, being made to lie on sharp shells and buffeted with other forms of manifold tortures, so that the devil might, if possible, by the persistence of the punishment bring them to a denial; for he tried many wiles against them.'
translation:
  language: hi
  text: 'इसलिए वे सभी शहादतें धन्य और महान हैं जो परमेश्वर की इच्छा के अनुसार हुई हैं—क्योंकि हमें इस विषय में बहुत सावधान रहना चाहिए और सब बातों पर अधिकार परमेश्वर का ही मानना चाहिए।


    उनकी महानता, धीरज और स्वामी के प्रति निष्ठा की प्रशंसा कौन न करता? वे कोड़ों से इस बुरी तरह चीर दिए गए थे कि उनकी देह की भीतरी बनावट, यहाँ तक कि अंदर की नसें और धमनियाँ भी दिखाई देने लगी थीं; फिर भी वे धीरज से सहते रहे। यह देखकर वहाँ खड़े लोग भी दया से भर गए और रो पड़े। पर वे स्वयं ऐसे साहसी बने रहे कि उनमें से किसी ने न चीख निकाली, न कराह। इस प्रकार उन्होंने हम सबको दिखाया कि उस घड़ी यातना सहते हुए मसीह के शहीद मानो देह से परे थे—या यों कहें कि प्रभु उनके पास खड़ा उनसे बातें कर रहा था।


    मसीह के अनुग्रह पर ध्यान लगाए हुए उन्होंने इस संसार की यातनाओं को तुच्छ जाना और एक घंटे का मूल्य चुकाकर अनन्त दण्ड से छुटकारा पाया। अपने निर्दयी यातना देनेवालों की आग उन्हें ठंडी लगी, क्योंकि उनकी आँखों के सामने उस अनन्त आग से बच निकलना था जो कभी नहीं बुझती। अपने हृदय की आँखों से वे उन उत्तम वस्तुओं को निहार रहे थे जो धीरज धरनेवालों के लिए सुरक्षित हैं—ऐसी वस्तुएँ जिन्हें न कान ने सुना, न आँख ने देखा, और न मनुष्य के हृदय में उनका विचार आया; पर प्रभु ने उन्हें वे दिखा दी थीं, क्योंकि वे अब मनुष्य नहीं रहे थे, बल्कि पहले ही स्वर्गदूत थे।[a]


    इसी प्रकार जिन लोगों को जंगली पशुओं के सामने डाले जाने का दण्ड मिला था, उन्होंने भी भयानक यातनाएँ सहीं। उन्हें नुकीले ठीकरों पर लिटाया गया और अनेक प्रकार की दूसरी यातनाओं से पीटा और सताया गया, ताकि यदि सम्भव हो तो शैतान लगातार यातना देकर उनसे मसीह का इनकार करवा सके; क्योंकि उसने उनके विरुद्ध बहुत-सी चालें चलीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वे अब मनुष्य नहीं रहे थे, बल्कि पहले ही स्वर्गदूत थे” शहीदों के असाधारण धीरज और स्वर्गीय दृष्टि की प्रशंसात्मक भाषा है; इसे मनुष्यों के सचमुच स्वर्गदूतों में बदल जाने का सिद्धान्त न समझें।
    reason: मूल की सशक्त प्रशंसात्मक अभिव्यक्ति को अनुवाद में बनाए रखते हुए, आधुनिक पाठक के लिए उसके अलंकारिक प्रयोजन को स्पष्ट करता है।
lexical_decisions:
- source_word: μαρτύρια / martyrdoms
  choice: शहादतें
  rationale: आरम्भिक मसीही साक्ष्य में प्राण देकर दी गई गवाही का भाव रखता है; आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: δεσπότης / Master
  choice: स्वामी
  rationale: अधिकार और व्यक्तिगत निष्ठा दोनों को व्यक्त करता है, बिना अनावश्यक साम्प्रदायिक शब्दावली के।
- source_word: ὑπομονή / patient endurance
  choice: धीरज / धीरज से सहना
  rationale: केवल निष्क्रिय प्रतीक्षा नहीं, बल्कि कष्ट में दृढ़ बने रहने का भाव देता है।
- source_word: χάρις / grace
  choice: अनुग्रह
  rationale: प्रचलित और धर्मशास्त्रीय रूप से व्यापक हिन्दी समतुल्य।
- source_word: ἄρνησις / denial
  choice: मसीह का इनकार
  rationale: संदर्भ में सामान्य अस्वीकार नहीं, विश्वास से मुकरना अभिप्रेत है; स्पष्टता के लिए कर्म जोड़ा गया है।
- source_word: ὄστρακα / sharp shells, potsherds
  choice: नुकीले सीप
  rationale: उपलब्ध अंग्रेज़ी साक्षी का अनुसरण; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण निश्चितता का दावा नहीं किया गया।
theological_decisions:
- issue: परमेश्वर की इच्छा और शहादत
  choice: “परमेश्वर की इच्छा के अनुसार” और “सब बातों पर अधिकार परमेश्वर का”
  alternative: परमेश्वर को यातना का प्रत्यक्ष कर्ता बताना
  rationale: पाठ ईश्वरीय प्रभुता पर बल देता है, पर यातना की नैतिक जिम्मेदारी परमेश्वर पर आरोपित नहीं करता।
- issue: “देह से अनुपस्थित” कथन
  choice: “मानो देह से परे थे—या यों कहें...”
  alternative: शहीद सचमुच शरीर छोड़ चुके थे
  rationale: लेखक स्वयं पहले कथन को सुधारकर प्रभु की उपस्थिति की बात करता है; हिन्दी में उस अलंकारिक तनाव को सुरक्षित रखा गया।
- issue: एक घंटे के मूल्य पर अनन्त दण्ड से छुटकारा
  choice: रूपकात्मक लेन-देन की भाषा को बनाए रखा
  alternative: कर्मों द्वारा उद्धार का स्पष्ट सिद्धान्त बनाना या वाक्य को केवल रूपक कहकर कमजोर करना
  rationale: मूल की तीखी तुलना को रखा गया, पर उससे कोई व्यवस्थित सम्प्रदायगत सिद्धान्त नहीं निकाला गया।
- issue: शहीदों का स्वर्गदूत होना
  choice: “मानो पहले ही स्वर्गदूत बन चुके थे”
  alternative: मनुष्य का वास्तविक रूप से स्वर्गदूत में बदल जाना
  rationale: प्राचीन प्रशंसात्मक अतिशयोक्ति को बनाए रखते हुए अस्तित्वगत परिवर्तन का अनावश्यक दावा टाला गया।
- issue: शैतान की भूमिका
  choice: यातना के द्वारा इनकार करवाने की उसकी कोशिश
  alternative: मानवीय यातना देनेवालों की जिम्मेदारी हटाकर केवल शैतान को दोषी ठहराना
  rationale: पाठ शैतानी प्रेरणा और मानवीय क्रूरता दोनों को साथ रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सुबोध। प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी को सावधानी से आधार बनाया गया है। लंबे वाक्यों को पठनीय अनुच्छेदों और वाक्यों में बाँटा गया, जबकि लेखक की पुनरुक्ति, विरोध और धर्मशास्त्रीय तनाव सुरक्षित रखे गए हैं।
