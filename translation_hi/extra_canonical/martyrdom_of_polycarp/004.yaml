base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/004.yaml
  text: 'But thanks be to God; for He truly prevailed against all. For the most noble Germanicus encouraged their fearfulness through the steadfastness that was in him, and he fought with the wild beasts in a remarkable way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used force and dragged the wild beast toward himself, desiring more quickly to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry: “Away with the atheists! Let search be made for Polycarp.”'
translation:
  language: hi
  text: 'परन्तु परमेश्वर का धन्यवाद हो, क्योंकि उसने सचमुच उन सब पर विजय पाई। अत्यन्त श्रेष्ठ जर्मनिकुस ने अपने भीतर की दृढ़ता से उनके भय को साहस में बदल दिया, और जंगली पशुओं से असाधारण रीति से लड़ा। जब प्रान्तपाल ने उसे मनाने की कोशिश की और उससे कहा कि वह अपनी जवानी पर दया करे, तब उसने बल लगाकर जंगली पशु को अपनी ओर खींच लिया, क्योंकि वह उनके अधर्मी और अन्यायपूर्ण जीवन से शीघ्र छुटकारा पाना चाहता था।


    इसके बाद सारी भीड़ मसीहियों की इस परमेश्वर-प्रिय और परमेश्वर का भय मानने वाली प्रजा के साहस पर चकित हुई और चिल्ला उठी, “नास्तिकों को दूर करो! पोलिकार्प की खोज की जाए!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “नास्तिक” भीड़ द्वारा मसीहियों के लिए लगाया गया आरोप है—संभवतः इसलिए कि वे नगर के परम्परागत देवताओं की उपासना नहीं करते थे।
    reason: आधुनिक पाठक कहीं इसे लेखक द्वारा मसीहियों का वर्णन न समझे; ऐतिहासिक विडंबना स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: right noble Germanicus
  choice: अत्यन्त श्रेष्ठ जर्मनिकुस
  rationale: सम्मानसूचक भाव को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक पदबंध चुना गया।
- source_word: encouraged their timorousness
  choice: उनके भय को साहस में बदल दिया
  rationale: अंग्रेज़ी साक्ष्य के अस्वाभाविक संक्षिप्त प्रयोग का आशय स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया।
- source_word: constancy
  choice: दृढ़ता
  rationale: संकट और शहादत के प्रसंग में अडिग बने रहने का भाव रखता है।
- source_word: obtain a release
  choice: छुटकारा पाना
  rationale: मृत्यु को स्पष्ट रूप से जोड़ने के बजाय मूल की परोक्ष अभिव्यक्ति सुरक्षित रखी गई।
- source_word: atheists
  choice: नास्तिकों
  rationale: भीड़ द्वारा मसीहियों पर लगाए गए प्राचीन आरोप का सीधा और समझने योग्य अनुवाद।
theological_decisions:
- issue: “उसने ... विजय पाई” में सर्वनाम का संदर्भ
  choice: परमेश्वर को कर्ता बनाए रखा
  alternative: जर्मनिकुस अथवा किसी शहीद को कर्ता मानना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में बड़े अक्षर वाला “He” परमेश्वर की ओर संकेत करता है; ग्रीक समीक्षा लंबित होने के कारण इसे उसी रूप में रखा गया।
- issue: शहीद की मृत्यु का वर्णन
  choice: “छुटकारा पाना” की परोक्ष भाषा
  alternative: “मृत्यु पाना” या “इस संसार से मुक्त होना”
  rationale: मूल साक्ष्य की धार्मिक और नैतिक तनावयुक्त अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया।
- issue: “नास्तिक” का आरोप
  choice: भीड़ का कथन ज्यों का त्यों उद्धृत किया
  alternative: इसे “ईश्वर-विरोधी” अथवा व्याख्यात्मक पदबंध बनाना
  rationale: यह कथावाचक का निर्णय नहीं बल्कि विरोधी भीड़ की विडंबनापूर्ण पुकार है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। “प्रान्तपाल,” “जंगली पशु,” और “परमेश्वर का भय मानने वाली प्रजा” जैसे पद सामान्य पाठक के लिए सुबोध रखे गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष ग्रीक समीक्षा लंबित होने के कारण मसौदा अस्थायी और स्रोत-साक्ष्य के प्रति सावधान है।
