base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/013.yaml
  text: 'As he said these things and much more, he was filled with courage and joy, and his face was full of grace. Far from falling in dismay at what was said to him, he astonished the proconsul. The proconsul sent his own herald to proclaim three times in the middle of the stadium, “Polycarp has confessed that he is a Christian.”


    When the herald proclaimed this, the whole crowd of Gentiles and Jews living in Smyrna cried out with uncontrollable rage and a loud shout, “This is the teacher of Asia, the father of the Christians, the destroyer of our gods, who teaches many not to sacrifice or worship.” As they said these things, they shouted loudly and asked Philip the Asiarch to release a lion on Polycarp. But he said that he was not permitted to do so, since he had brought the games to an end.


    Then they all agreed to shout that Polycarp should be burned alive. For the vision concerning his pillow had to be fulfilled. He had seen it on fire while he was praying, and he turned and said prophetically to the faithful who were with him, “I must be burned alive.”'
translation:
  language: hi
  text: 'ये बातें और इनके अलावा भी बहुत कुछ कहते हुए वे साहस और आनन्द से भर गए, और उनका चेहरा अनुग्रह से दमक उठा। उनसे कही गई बातों से निराश होकर उनका चेहरा तनिक भी नहीं उतरा; उलटे राज्यपाल चकित रह गया। उसने अपने उद्घोषक को स्टेडियम के बीच में तीन बार यह घोषणा करने भेजा, “पोलिकार्प ने स्वीकार किया है कि वह मसीही है।”


    जब उद्घोषक ने यह घोषणा की, तो स्मुरना में रहने वाले गैर-यहूदियों और यहूदियों की सारी भीड़ बेकाबू क्रोध में ऊँचे स्वर से चिल्ला उठी, “यही एशिया का शिक्षक, मसीहियों का पिता और हमारे देवताओं का नाश करने वाला है! यही बहुतों को सिखाता है कि वे बलि न चढ़ाएँ और न उपासना करें।” यह कहते हुए वे जोर-जोर से चिल्लाए और एशियार्ख[a] फिलिप्पुस से माँग करने लगे कि वह पोलिकार्प पर एक सिंह छोड़ दे। पर उसने कहा कि उसे ऐसा करने की अनुमति नहीं थी, क्योंकि वह खेलों का समापन कर चुका था।


    तब वे सब एक स्वर में चिल्लाने लगे कि पोलिकार्प को जीवित जला दिया जाए। क्योंकि पोलिकार्प को उनके तकिए के विषय में जो दर्शन दिखाया गया था, उसका पूरा होना आवश्यक था। प्रार्थना करते समय उन्होंने उसे आग में जलते देखा था और मुड़कर अपने साथ के विश्वासियों से भविष्यवाणी के रूप में कहा था, “मुझे जीवित जलाया जाना अवश्य है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एशियार्ख रोमी प्रांत एशिया में सार्वजनिक उत्सवों से जुड़ी एक प्रतिष्ठित प्रांतीय पदवी थी।
    reason: अपरिचित ऐतिहासिक पदवी का संक्षिप्त, संयत स्पष्टीकरण आवश्यक है।
lexical_decisions:
- source_word: proconsul
  choice: राज्यपाल
  rationale: रोमी पद का कार्य सामान्य पाठक के लिए स्पष्ट करने वाला स्वाभाविक हिन्दी शब्द; यहाँ व्यक्ति का प्रशासनिक अधिकार प्रमुख है।
- source_word: herald
  choice: उद्घोषक
  rationale: सार्वजनिक और आधिकारिक घोषणा करने वाले अधिकारी का सटीक, सहज अर्थ देता है।
- source_word: Gentiles
  choice: गैर-यहूदी
  rationale: जातीय-धार्मिक विरोध को आधुनिक हिन्दी में स्पष्ट रखता है और अस्पष्ट ‘अन्यजाति’ से बचता है।
- source_word: Asiarch
  choice: एशियार्ख
  rationale: विशिष्ट प्राचीन प्रांतीय पदवी को लिप्यंतरित किया गया है, क्योंकि साधारण प्रशासनिक उपाधि इसका पूरा ऐतिहासिक अर्थ नहीं देती।
- source_word: games
  choice: खेलों
  rationale: अखाड़े में आयोजित सार्वजनिक प्रदर्शनों/क्रीड़ाओं के लिए सहज सामूहिक पद; प्रसंग इसकी प्रकृति स्पष्ट करता है।
- source_word: faithful
  choice: विश्वासियों
  rationale: साथ उपस्थित मसीही समुदाय के लोगों के लिए प्राकृतिक और धर्मवैज्ञानिक रूप से अनावश्यक रूप से संकीर्ण न होने वाला शब्द।
theological_decisions:
- issue: ‘face was full of grace’ में ‘grace’ का अर्थ
  choice: उनका चेहरा अनुग्रह से दमक उठा
  alternative: उनके चेहरे पर दिव्य कृपा थी / उनका चेहरा मनोहर हो गया
  rationale: ‘अनुग्रह’ मूल अभिव्यक्ति की धर्मवैज्ञानिक और वर्णनात्मक बहुअर्थता को बनाए रखता है; ‘दमक उठा’ हिन्दी में चेहरे की दृश्य दशा स्वाभाविक बनाता है।
- issue: दर्शन की पूर्ति की अनिवार्यता
  choice: पूरा होना था; ‘अवश्य है’
  alternative: पूरा हुआ / निश्चित रूप से पूरा किया गया
  rationale: वर्णन में व्यक्त भविष्यसूचक आवश्यकता को सुरक्षित रखा गया है, बिना यह निर्धारित किए कि वह दैवी आदेश, पूर्वज्ञान या कथात्मक अनिवार्यता किस अर्थ में थी।
- issue: Polycarp ‘confessed himself to be a Christian’
  choice: स्वीकार किया है कि वह मसीही है
  alternative: अपने को मसीही घोषित किया है
  rationale: ‘स्वीकार’ सार्वजनिक अंगीकार और न्यायिक स्वीकारोक्ति दोनों की छाया बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘पोलिकार्प’, ‘स्मुरना’ और ‘फिलिप्पुस’ जैसे नाम यूनानी रूपों के निकट हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण विवादास्पद सूक्ष्मताओं में अंग्रेज़ी साक्षी की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
