base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/018.yaml
  text: 'But the jealous and envious Evil One, the adversary of the family of the righteous, had seen the greatness of his martyrdom, his blameless life from the beginning, how he was crowned with the crown of immortality, and how he had won a reward that no one could deny. So he arranged that not even his poor body would be taken away by us, although many desired to do this and to touch his holy flesh.


    So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release his body, “lest,” as it was said, “they abandon the crucified one and begin to worship this man.” This was done at the instigation and urgent entreaty of the Jews, who also kept watch when we were about to take it from the fire. They did not know that it will be impossible for us either ever to forsake the Christ who suffered for the salvation of the whole world of those who are saved—though faultless, he suffered for sinners—or to worship anyone else.


    For we adore him because he is the Son of God, but we cherish the martyrs, as disciples and imitators of the Lord, as they deserve because of their matchless affection for their own King and Teacher. May it also be our lot to be found partakers and fellow disciples with them.'
translation:
  language: hi
  text: 'परन्तु ईर्ष्यालु और डाह करनेवाले दुष्ट ने—जो धर्मियों के परिवार का विरोधी है—उसकी शहादत की महानता, आरम्भ से उसके निष्कलंक जीवन, उसके अविनाशी मुकुट से मुकुट पहनाए जाने और उसके ऐसे प्रतिफल पाने को देखा था जिसे कोई नकार नहीं सकता था। इसलिए उसने ऐसा प्रबन्ध किया कि हमें उसका असहाय शरीर भी न मिल सके, यद्यपि बहुत-से लोग उसे ले जाना और उसके पवित्र शरीर को छूना चाहते थे।


    इसलिए उसने हेरोदेस के पिता और अल्के के भाई निकेतास को आगे किया कि वह अधिकारी से विनती करे कि उसका शरीर न सौंपा जाए, “कहीं ऐसा न हो,” जैसा कहा गया, “कि वे उस क्रूस पर चढ़ाए गए जन को छोड़कर इस मनुष्य की उपासना करने लगें।” यह उन यहूदियों के उकसाने और बार-बार आग्रह करने पर किया गया; जब हम शरीर को आग में से निकालनेवाले थे, तब वे पहरा भी दे रहे थे। वे नहीं जानते थे कि हमारे लिए उस मसीह को कभी छोड़ना असम्भव है, जिसने उद्धार पानेवालों के समस्त संसार के उद्धार के लिए दुःख सहा—निर्दोष होकर भी पापियों के लिए दुःख सहा—और यह भी असम्भव है कि हम किसी और की उपासना करें।[a]


    क्योंकि वह परमेश्वर का पुत्र है, इसलिए हम उसकी उपासना करते हैं; पर शहीदों को हम प्रभु के शिष्य और अनुयायी मानकर उनसे वैसा ही प्रेम करते हैं जिसके वे योग्य हैं, क्योंकि अपने राजा और गुरु के प्रति उनका प्रेम बेजोड़ है। हमारा भी यह सौभाग्य हो कि हम उनके सहभागी और सहशिष्य पाए जाएँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन इस शहादत-वृत्तांत में वर्णित स्थानीय विरोधियों के विषय में है; इसे सभी यहूदियों या यहूदी लोगों के विषय में सार्वकालिक आरोप न समझा जाए।
    reason: ऐतिहासिक पाठ सुरक्षित रखते हुए सामूहिक और कालातीत यहूदी-विरोधी सामान्यीकरण से बचाना।
lexical_decisions:
- source_word: Evil One
  choice: दुष्ट
  rationale: व्यक्तिवाचक विरोधी का भाव बनाए रखते हुए स्वाभाविक हिन्दी; संदर्भ इसे शैतानी विरोधी के रूप में स्पष्ट करता है।
- source_word: family of the righteous
  choice: धर्मियों का परिवार
  rationale: सामुदायिक/आत्मिक परिवार की स्रोत-छवि सुरक्षित रखी गई है।
- source_word: martyrdom
  choice: शहादत
  rationale: आधुनिक हिन्दी में विश्वास के कारण मृत्यु की सहज और प्रतिष्ठित अभिव्यक्ति।
- source_word: crown of immortality
  choice: अविनाशी मुकुट
  rationale: अमरता से सम्बद्ध मुकुट की रूपकात्मक भाषा को संक्षिप्त, स्वाभाविक ढंग से रखा गया है।
- source_word: poor body
  choice: असहाय शरीर
  rationale: यहाँ दयनीय दशा का भाव है, आर्थिक निर्धनता का नहीं।
- source_word: adore / worship
  choice: उपासना करना
  rationale: मसीह को दी जानेवाली आराधनात्मक निष्ठा और शहीदों के प्रति प्रेम के बीच पाठ का स्पष्ट भेद सुरक्षित है।
- source_word: cherish
  choice: प्रेम करना
  rationale: सम्मानयुक्त स्नेह व्यक्त करता है, पर उपासना का अर्थ नहीं देता।
- source_word: imitators
  choice: अनुयायी
  rationale: सामान्य पाठक के लिए स्वाभाविक; प्रभु के आचरण का अनुसरण करने का भाव बनाए रखता है।
- source_word: partakers and fellow-disciples
  choice: सहभागी और सहशिष्य
  rationale: दोनों पृथक अवधारणाओं को बनाए रखने के लिए युग्म पदावली रखी गई है।
theological_decisions:
- issue: मसीह की उपासना और शहीदों के सम्मान का भेद
  choice: मसीह के लिए ‘उपासना’, शहीदों के लिए ‘प्रेम’
  alternative: दोनों के लिए व्यापक अर्थ वाला ‘आदर’
  rationale: पाठ स्वयं परमेश्वर के पुत्र की उपासना और शहीदों के प्रति योग्य स्नेह के बीच जानबूझकर भेद करता है।
- issue: ‘whole world of those who are saved’ की कठिन संरचना
  choice: ‘उद्धार पानेवालों के समस्त संसार के उद्धार के लिए’
  alternative: ‘समस्त संसार के उद्धार के लिए’
  rationale: आपूर्त स्रोत-साक्ष्य में उपस्थित सीमितकारी वाक्यांश को हटाकर धार्मिक तनाव का समाधान नहीं किया गया।
- issue: दोषरहित मसीह का पापियों के लिए दुःख
  choice: ‘निर्दोष होकर भी पापियों के लिए दुःख सहा’
  alternative: ‘निर्दोष ने पापियों के स्थान पर दुःख सहा’
  rationale: ‘के लिए’ का व्यापक अर्थ रखा गया; ‘स्थान पर’ जोड़कर प्रायश्चित्त की किसी विशिष्ट व्याख्या को आरोपित नहीं किया गया।
- issue: ‘the crucified one’ का संकेत
  choice: ‘उस क्रूस पर चढ़ाए गए जन’
  alternative: ‘क्रूसित व्यक्ति’
  rationale: विरोधियों के कथित शब्दों की दूरी और मसीह की ओर संकेत दोनों सुरक्षित हैं।
- issue: यहूदियों की भूमिका
  choice: ऐतिहासिक कथन का सीधा अनुवाद और संदर्भात्मक पादटिप्पणी
  alternative: जातीय पहचान को हटाना
  rationale: प्राचीन पाठ का आरोप सुरक्षित रखा गया है, पर उसे सभी यहूदियों के विरुद्ध सार्वकालिक कथन न समझने की सावधानी दी गई है।
