base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/001.yaml
  text: 'The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium, and to all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place: May mercy, peace, and love from God the Father and our Lord Jesus Christ be multiplied to you.'
translation:
  language: hi
  text: 'स्मुरना में प्रवासी के रूप में रहने वाली परमेश्वर की कलीसिया की ओर से फिलोमेलियम में प्रवासी के रूप में रहने वाली परमेश्वर की कलीसिया को, और हर स्थान पर पवित्र और सार्वभौमिक कलीसिया की सभी स्थानीय कलीसियाओं को: परमेश्वर पिता और हमारे प्रभु यीशु मसीह की ओर से दया, शांति और प्रेम तुम्हारे लिए बढ़ते जाएँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παροικοῦσα / sojourneth
  choice: परदेशियों के समान रहने वाली
  rationale: कलीसिया के अस्थायी निवास और इस संसार में परदेशी होने की धारणा को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: ἀδελφότητες / brotherhoods
  choice: भाई-बहनों के समुदायों
  rationale: विश्वासी समुदायों के सामूहिक अर्थ को व्यक्त करता है और आधुनिक हिन्दी में स्त्री-पुरुष दोनों की सहभागिता स्पष्ट करता है।
- source_word: καθολικῆς / universal
  choice: सार्वभौमिक
  rationale: यहाँ शब्द का सामान्य अर्थ ‘हर स्थान में फैली समूची कलीसिया’ है; किसी बाद की सांप्रदायिक पहचान को आरोपित नहीं किया गया।
- source_word: πληθυνθείη / be multiplied
  choice: बढ़ते जाएँ
  rationale: अभिवादन की प्रार्थनात्मक कामना को सहज और वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कलीसिया का ‘परदेशी’ रूप
  choice: ‘परदेशियों के समान रहने वाली’ को तीनों प्रसंगों में बनाए रखा
  alternative: ‘निवास करने वाली’
  rationale: मूल अभिव्यक्ति में केवल भौगोलिक निवास नहीं, अस्थायी या प्रवासी स्थिति की धार्मिक छाया भी है; इसे मिटाया नहीं गया।
- issue: ‘सार्वभौमिक कलीसिया’ का आशय
  choice: विशेष नाम के बजाय वर्णनात्मक पदबंध
  alternative: ‘कैथोलिक कलीसिया’
  rationale: प्राचीन संदर्भ में व्यापक, समूची कलीसिया का अर्थ सुरक्षित रहता है और उत्तरकालीन सांप्रदायिक अर्थ अनावश्यक रूप से नहीं जोड़ा जाता।
- issue: दया, शांति और प्रेम का स्रोत
  choice: ‘परमेश्वर पिता और हमारे प्रभु यीशु मसीह की ओर से’
  alternative: वाक्य को इस प्रकार पुनर्गठित करना कि केवल परमेश्वर पिता स्रोत प्रतीत हों
  rationale: प्राप्त साक्ष्य की व्याकरणिक निकटता और संभावित संयुक्त संबंध को बिना अतिरिक्त व्याख्या के बनाए रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक पत्र-अभिवादन के अनुरूप रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण पाठ को प्रारंभिक, स्रोत-सचेत मसौदा माना जाए। स्थान-नामों को प्रचलित ध्वन्यात्मक रूप ‘स्मुरना’ और ‘फिलोमेलियम’ में रखा गया है।
