  verdict: revise
  source_fidelity: The draft generally follows the supplied English witness closely. However, “खेत की बस्ती” adds the idea of a settlement, whereas the witness says only “a farm” (and the underlying tradition refers to a rural/farm property). The final “यह अवश्य है कि” is overly literal and less idiomatic than a Hindi construction that retains the impersonal necessity.
  naturalness: The narrative is clear and appropriately dignified. “नगर से कुछ दूर एक खेत” and “मुझे जीवित जलाया जाना है” are more natural than the corresponding draft expressions. “भावावस्था” is possible but can suggest an emotional state; “दर्शनावस्था” more directly conveys the reported trance/vision without specifying its cause.
  terminology: “महिमावान,” “कलीसियाओं,” and the respectful plural for Polycarp are suitable. “दर्शनावस्था” preserves the unusual experiential terminology without importing a denominational interpretation. The provisional-source footnote is retained, with its marker positioned at the end of the passage to indicate its scope.
  issues:
  - severity: medium
    issue: “खेत की बस्ती” for “farm”
    rationale: “बस्ती” introduces a habitation or settlement not present in the supplied witness. A neutral rural-property expression is needed.
  - severity: low
    issue: “यह अवश्य है कि मुझे जीवित जला दिया जाएगा”
    rationale: This is understandable but syntactically stiff in modern Hindi. “मुझे जीवित जलाया जाना है” naturally expresses the source’s impersonal necessity without adding theological causation.
  - severity: low
    issue: “भावावस्था” for “trance”
    rationale: The expression may be understood as an emotional mood. “दर्शनावस्था” better links the altered state to the immediately reported vision while avoiding a precise technical or doctrinal classification.
