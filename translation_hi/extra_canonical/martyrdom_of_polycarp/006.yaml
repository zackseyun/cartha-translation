base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/006.yaml
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
translation:
  language: hi
  text: 'जब महिमावान पॉलीकार्प ने पहले-पहल यह बात सुनी, तो वह तनिक भी नहीं घबराए, बल्कि नगर में ही रहना चाहते थे। पर अधिकांश लोगों ने उन्हें वहाँ से चले जाने के लिए मना लिया। इसलिए वह नगर से कुछ ही दूरी पर स्थित एक खेत की बस्ती में चले गए। वहाँ वह कुछ साथियों के साथ रहे और रात-दिन सभी लोगों तथा संसार भर की कलीसियाओं के लिए प्रार्थना करने के सिवा और कुछ नहीं करते थे; क्योंकि यह उनकी नियमित आदत थी।


    गिरफ़्तारी से तीन दिन पहले, प्रार्थना करते समय वह भावावस्था में चले गए और उन्होंने देखा कि उनका तकिया आग से जल रहा है। तब उन्होंने मुड़कर अपने साथियों से कहा, “यह अवश्य है कि मुझे जीवित जला दिया जाएगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र के अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: दिए गए स्रोत-विवरण के अनुसार यूनानी मूल की समीक्षा लंबित है, इसलिए पाठीय आधार की सीमा स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: glorious
  choice: महिमावान
  rationale: सम्मानसूचक धार्मिक भाव को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण शब्द चुना गया।
- source_word: farm
  choice: खेत की बस्ती
  rationale: संदर्भ में यह केवल खेती की भूमि नहीं, नगर से बाहर ठहरने का स्थान है; इसलिए स्वाभाविक हिन्दी में अर्थ स्पष्ट किया गया।
- source_word: trance
  choice: भावावस्था
  rationale: असाधारण दर्शनात्मक अवस्था व्यक्त होती है, पर उसकी सटीक प्रकृति के बारे में पाठ से अधिक दावा नहीं किया गया।
- source_word: churches
  choice: कलीसियाओं
  rationale: आरंभिक मसीही समुदायों के लिए प्रचलित और संदर्भानुकूल हिन्दी पद।
- source_word: must needs
  choice: यह अवश्य है
  rationale: कथन की अनिवार्यता और भविष्यसूचक दृढ़ता दोनों बनाए रखी गईं।
theological_decisions:
- issue: पॉलीकार्प के दर्शन की प्रकृति
  choice: भावावस्था में चले गए और उन्होंने देखा
  alternative: उन पर परमेश्वर की ओर से भविष्यद्वाणी उतरी
  rationale: साक्ष्य दर्शनात्मक अनुभव बताता है, पर उसके स्रोत या तकनीकी धार्मिक वर्गीकरण को स्पष्ट नहीं करता; इसलिए अस्पष्टता सुरक्षित रखी गई।
- issue: जीवित जलाए जाने की अनिवार्यता
  choice: यह अवश्य है कि मुझे जीवित जला दिया जाएगा
  alternative: परमेश्वर ने ठहराया है कि मुझे जीवित जलाया जाए
  rationale: मूल गवाही में अनिवार्यता है, लेकिन यहाँ उसे सीधे परमेश्वर की पूर्वनियुक्ति कहना पाठ से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रखी गई है। ऐतिहासिक वर्णन में आदरसूचक बहुवचन का प्रयोग किया गया है। ‘भावावस्था’ और ‘यह अवश्य है’ जैसे पदों से स्रोत की धार्मिक तथा अनुभवगत अस्पष्टता को अनावश्यक रूप से हल नहीं किया गया।
