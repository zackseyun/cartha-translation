  source_fidelity: 'The draft closely follows the supplied English witness and preserves the disputed/restored wording in the Levi transition. However, Peter’s first rhetorical question is materially obscured: the source contrasts private speech with a woman and non-public speech with the group, whereas the draft’s repeated negative construction and added “क्या ऐसा हो सकता है?” make the syntax and force unclear. Levi’s comparison is also better rendered as Peter arguing with Mary ‘like the adversaries,’ not merely as adversaries generally do.'
  naturalness: The register is generally fluent, dignified modern Hindi. The revised Peter question and Levi rebuke are clearer and more idiomatic. ‘सिद्ध मानवता’ remains somewhat marked in Hindi, but this is appropriate for retaining the witness’s conspicuously technical and capitalized ‘perfect Humanity’; the explanatory footnote adequately signals the uncertainty.
  terminology: ‘उद्धारकर्ता,’ ‘सुसमाचार,’ ‘योग्य ठहराया,’ and ‘नियम या व्यवस्था’ are suitable and maintain the source distinctions. ‘सिद्ध मानवता’ is retained provisionally rather than doctrinally normalized. Names follow established Hindi biblical forms.
  issues:
  - severity: medium
    issue: Peter’s question about private versus public speech is syntactically and semantically unclear.
    rationale: '“उसने हमारी जानकारी के बिना किसी स्त्री से बात तो नहीं की थी—और हमसे खुलकर बात नहीं की थी—क्या ऐसा हो सकता है?” does not clearly convey the witness’s paired allegation: he spoke with a woman without their knowledge and did not speak publicly with them. The added question changes the direct rhetorical structure.'
  - severity: low
    issue: Levi’s comparison ‘like the adversaries’ is weakened.
    rationale: “जैसे विरोधी करते हैं” shifts the comparison from Peter’s manner of disputing to a generic action of opponents. “विरोधियों की तरह” more directly retains the witness’s wording.
