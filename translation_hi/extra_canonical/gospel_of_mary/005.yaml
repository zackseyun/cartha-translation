  yaml_path: translation/extra_canonical/gospel_of_mary/005.yaml
  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  language: hi
  text: 'तब अन्द्रियास ने भाई-बहनों से कहा, “उसने जो कहा है, उसके बारे में तुम जो चाहो कहो। मैं तो विश्वास नहीं करता कि उद्धारकर्ता ने ये बातें कही थीं, क्योंकि ये शिक्षाएँ भिन्न प्रकार के विचार लगती हैं।”


    पतरस ने भी वही आपत्तियाँ उठाईं। उसने उद्धारकर्ता के विषय में उनसे पूछा, “उसने हमारी जानकारी के बिना किसी स्त्री से बात तो नहीं की थी—और हमसे खुलकर बात नहीं की थी—क्या ऐसा हो सकता है? क्या अब हम पलटकर सब उसकी सुनें? क्या उसने उसे हमसे अधिक प्रिय माना?”[a]


    तब मरियम रो पड़ी और उसने पतरस से कहा, “मेरे भाई पतरस, तुम क्या सोच रहे हो? क्या तुम सचमुच समझते हो कि मैंने यह सब अपने ही मन से गढ़ लिया है, या कि मैं उद्धारकर्ता के विषय में झूठ बोल रही हूँ?”


    तब लेवी ने पतरस से कहा, “पतरस, तुम सदा से क्रोधी रहे हो। अब मैं देखता हूँ कि तुम इस स्त्री से वैसे ही विवाद कर रहे हो जैसे विरोधी करते हैं। पर यदि उद्धारकर्ता ने उसे योग्य ठहराया, तो तुम कौन होते हो उसे अस्वीकार करने वाले? निश्चय ही उद्धारकर्ता उसे भली-भाँति जानता है। इसी कारण उसने उससे हमसे अधिक प्रेम किया।


    “इसके बजाय हमें लज्जित होना चाहिए, सिद्ध मानवता को वस्त्र के समान धारण करना चाहिए, उसे अपने लिए प्राप्त करना चाहिए—जैसा उसने हमें निर्देश दिया था—और सुसमाचार का प्रचार करना चाहिए। उद्धारकर्ता ने जो कहा, उससे आगे कोई और नियम या व्यवस्था निर्धारित न करें।”[b]


    जब [लेवी ने ये बातें कहीं],[c] तब वे शिक्षा देने और प्रचार करने के लिए निकलने लगे।


    मरियम के अनुसार


    सुसमाचार'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “क्या उसने उसे हमसे अधिक प्रिय माना?” का अर्थ “क्या उसने उसे हमसे अधिक चुना?” भी हो सकता है। उपलब्ध अंग्रेज़ी साक्ष्य यहाँ वरीयता का प्रश्न व्यक्त करता है।
    reason: ‘prefer’ में प्रेम, चुनाव और वरीयता की निकट अर्थ-छायाएँ हैं।
  - marker: b
    text: “सिद्ध मानवता” उपलब्ध साक्ष्य के “perfect Humanity” का अस्थायी अनुवाद है; इसका आशय सिद्ध मनुष्यत्व या पूर्ण मानवीय अवस्था भी हो सकता है।
    reason: प्रत्यक्ष कॉप्टिक/यूनानी स्रोत-समीक्षा लंबित है और यह पद वैचारिक रूप से कठिन है।
  - marker: c
    text: कोष्ठक पांडुलिपि के लुप्त या क्षतिग्रस्त अंश की संपादकीय पूर्ति का संकेत देते हैं।
    reason: आपूर्त पाठ में उपस्थित पुनर्स्थापन-संकेत को सुरक्षित रखना आवश्यक है।
lexical_decisions:
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: ईसाई और प्राचीन धार्मिक संदर्भ में स्वाभाविक तथा अर्थ-सटीक पद।
- source_word: brothers (and sisters)
  choice: भाई-बहनों
  rationale: अंग्रेज़ी साक्ष्य में कोष्ठक द्वारा व्यक्त समावेशिता को सहज आधुनिक हिंदी में सुरक्षित रखा गया है।
- source_word: made her worthy
  choice: उसे योग्य ठहराया
  rationale: योग्यता प्रदान करने अथवा मान्यता देने की अर्थ-छाया को बिना यह तय किए सुरक्षित रखता है कि यह चुनाव, तैयारी या आध्यात्मिक पात्रता है।
- source_word: perfect Humanity
  choice: सिद्ध मानवता
  rationale: साक्ष्य में विशेष धार्मिक/वैचारिक पद के रूप में बड़े अक्षर से लिखे Humanity को शाब्दिक रूप से रखा; ‘सिद्ध मनुष्य’ कर देने से मूल रूपक और अमूर्तता बदल जाती।
- source_word: gospel
  choice: सुसमाचार
  rationale: संदर्भ में प्रचार किए जाने वाले शुभ संदेश और कृति के शीर्षक दोनों के लिए प्रचलित हिंदी पद।
- source_word: adversaries
  choice: विरोधी
  rationale: बहुवचन मानवीय विरोधियों का सामान्य अर्थ रखता है और अनावश्यक रूप से इसे शैतान का नाम नहीं बनाता।
theological_decisions:
- issue: उद्धारकर्ता का मरियम से ‘अधिक प्रेम’
  choice: उसने उससे हमसे अधिक प्रेम किया
  alternative: उसने उसे हमसे अधिक प्रिय माना
  rationale: पाठ के चुनौतीपूर्ण तुलनात्मक कथन को नरम या पुनर्व्याख्यायित किए बिना बनाए रखा गया है।
- issue: ‘perfect Humanity’ का स्वरूप
  choice: सिद्ध मानवता
  alternative: सिद्ध मनुष्यत्व / पूर्ण मानव को धारण करो
  rationale: प्रत्यक्ष कॉप्टिक/यूनानी समीक्षा लंबित होने के कारण उपलब्ध साक्ष्य की अमूर्त संज्ञा और वैचारिक तनाव सुरक्षित रखा गया है।
- issue: ‘rule or law’ का भेद
  choice: नियम या व्यवस्था
  alternative: आज्ञा या विधान
  rationale: दो निकटवर्ती पर अलग पदों को हिंदी में अलग रखा गया है; ‘व्यवस्था’ धार्मिक विधान की संभावित अर्थ-छाया भी वहन करती है।
- issue: पतरस के प्रश्न का आशय
  choice: प्रश्नात्मक और आरोपपूर्ण अस्पष्टता सुरक्षित रखी
  alternative: साफ कथन कि उद्धारकर्ता ने गुप्त रूप से मरियम को शिक्षा दी
  rationale: मूल साक्ष्य में यह पतरस की शंका है, कथावाचक द्वारा पुष्ट तथ्य नहीं।
