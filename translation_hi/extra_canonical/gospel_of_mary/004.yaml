  yaml_path: translation/extra_canonical/gospel_of_mary/004.yaml
  text: 'Desire said, “I did not see you going down, but now I see you going up. So why are you lying, since you belong to me?”


    The soul answered, “I saw you, but you did not see or know me. To you I was just a garment, and you did not recognize me.” When it said these things, it left, rejoicing greatly.


    Again, it came to the third power, called “Ignorance.” [It] questioned the soul and [said], “Where are you going? You are bound in wickedness. Since you are bound, do not judge!”


    [And] the soul said, “Why do you judge me, since I have not judged? I was bound, even though I have not bound. They did not recognize me, but I have recognized that everything will dissolve—both the things of the [earth] and the things of [heaven].”


    When the soul had overcome the third power, it went up and saw the fourth power, which took seven forms:


    The first form is Darkness;

    The second, Desire;

    The third, Ignorance;

    The fourth, Zeal for Death;

    The fifth, the Kingdom of the Flesh;

    The sixth, the Foolish “Wisdom” of Flesh;

    The seventh, the “Wisdom” of Anger.


    These are the seven powers of Wrath.


    They ask the soul, “Where do you come from, you murderer, and where are you going, conqueror of space?”


    The soul answered, “What binds me has been killed, what surrounds me has been overcome, my desire is gone, and ignorance has died. In a [world] I was released from a world, [and] in a type from a type which is above, and from the chain of forgetfulness, which exists only for a time. From now on, I will receive the rest of the time of the season of the age in silence.”


    When Mary had said these things, she fell silent, because the Savior had spoken with her up to this point.'
translation:
  language: hi
  text: 'अभिलाषा ने कहा, “जब तुम नीचे जा रही थीं, तब मैंने तुम्हें नहीं देखा; पर अब मैं तुम्हें ऊपर जाते देख रही हूँ। तो फिर तुम झूठ क्यों बोलती हो, जबकि तुम मेरी हो?”


    आत्मा ने उत्तर दिया, “मैंने तुम्हें देखा, पर तुमने न तो मुझे देखा, न मुझे जाना। तुम्हारे लिए मैं केवल एक वस्त्र थी, और तुमने मुझे पहचाना नहीं।” ये बातें कहकर आत्मा बड़े आनन्द के साथ वहाँ से चली गई।


    फिर वह तीसरी शक्ति के पास पहुँची, जिसका नाम “अज्ञान” है। [उसने] आत्मा से पूछताछ की और [कहा], “तुम कहाँ जा रही हो? तुम दुष्टता में बँधी हो। जब तुम स्वयं बँधी हो, तो न्याय मत करो!”[a]


    [तब] आत्मा ने कहा, “तुम मेरा न्याय क्यों करती हो, जबकि मैंने न्याय नहीं किया? मैं बँधी हुई थी, यद्यपि मैंने किसी को बाँधा नहीं। उन्होंने मुझे नहीं पहचाना, पर मैंने पहचान लिया है कि सब कुछ मिट जाएगा—[पृथ्वी] की वस्तुएँ भी और [स्वर्ग] की वस्तुएँ भी।”[b]


    जब आत्मा तीसरी शक्ति पर विजय पा चुकी, तो वह ऊपर गई और उसने चौथी शक्ति को देखा, जिसने सात रूप धारण किए थे:


    पहला रूप है अन्धकार;

    दूसरा, अभिलाषा;

    तीसरा, अज्ञान;

    चौथा, मृत्यु की उत्कंठा;

    पाँचवाँ, देह का राज्य;

    छठा, देह की मूर्खतापूर्ण “बुद्धि”;

    सातवाँ, क्रोध की “बुद्धि।”


    ये क्रोध की सात शक्तियाँ हैं।


    वे आत्मा से पूछती हैं, “हे हत्यारिन, तुम कहाँ से आई हो? और हे विस्तार पर विजय पानेवाली, तुम कहाँ जा रही हो?”[c]


    आत्मा ने उत्तर दिया, “जिसने मुझे बाँध रखा था, वह मार डाला गया है; जिसने मुझे घेर रखा था, उस पर विजय पा ली गई है; मेरी अभिलाषा मिट गई है और अज्ञान मर गया है। एक [संसार] में मैं एक संसार से मुक्त हुई, [और] एक रूप में उस रूप से, जो ऊपर है; और विस्मृति की उस जंजीर से भी, जो केवल कुछ समय तक रहती है। अब से मैं मौन में युग की ऋतु के शेष समय का विश्राम प्राप्त करूँगी।”[d]


    जब मरियम ये बातें कह चुकी, तो वह चुप हो गई, क्योंकि उद्धारकर्ता ने उससे यहीं तक बात की थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिए “उसने” और “कहा” जैसे शब्द उपलब्ध पाठ में पुनर्स्थापित माने गए हैं; प्राचीन भाषा के प्रत्यक्ष पुनरीक्षण के बाद शब्दांकन बदल सकता है।
    reason: पांडुलिपि-पुनर्स्थापन के संकेत को पाठक के सामने सुरक्षित रखना।
  - marker: b
    text: “पृथ्वी” और “स्वर्ग” पुनर्स्थापित पाठ हैं। “सब कुछ मिट जाएगा” का अर्थ विलीन होना, नष्ट होना या खुलकर बिखर जाना भी हो सकता है।
    reason: पाठ की क्षति और क्रिया की अर्थ-सीमा दोनों बताना।
  - marker: c
    text: “विस्तार पर विजय पानेवाली” का मूल आशय अनिश्चित है; इसका अर्थ स्थान, प्रदेश या ब्रह्माण्डीय विस्तार पर विजय पानेवाली भी हो सकता है।
    reason: “conqueror of space” के पीछे सम्भावित स्रोतार्थ को किसी एक आधुनिक धारणा में सीमित न करना।
  - marker: d
    text: “एक [संसार] में…,” “रूप,” और “युग की ऋतु के शेष समय का विश्राम” वाला वाक्य अत्यन्त कठिन है। यहाँ उसकी असामान्य संरचना को जानबूझकर सरल सिद्धान्त में नहीं बदला गया है।
    reason: प्रामाणिक अस्पष्टता और पांडुलिपि-पुनर्स्थापन को संरक्षित करना।
lexical_decisions:
- source_word: Desire
  choice: अभिलाषा
  rationale: यहाँ एक मानवीकृत ब्रह्माण्डीय शक्ति का नाम है; “अभिलाषा” आधुनिक और गरिमापूर्ण है तथा केवल यौन अर्थ तक सीमित नहीं करती।
- source_word: soul
  choice: आत्मा
  rationale: आरोहण करनेवाली सत्ता के लिए पारंपरिक और व्यापक रूप से समझा जानेवाला समतुल्य।
- source_word: power
  choice: शक्ति
  rationale: व्यक्तिरूप आध्यात्मिक सत्ता और उसके सामर्थ्य—दोनों अर्थों को खुला रखता है।
- source_word: flesh
  choice: देह
  rationale: “मांस” की अनावश्यक शाब्दिक कठोरता से बचते हुए शारीरिक/देहगत क्षेत्र का भाव व्यक्त करता है।
- source_word: Wrath
  choice: क्रोध
  rationale: मानवीकृत शक्ति के नाम के रूप में स्वाभाविक हिन्दी; बड़े अक्षर का भेद देवनागरी में उपलब्ध नहीं है।
- source_word: space
  choice: विस्तार
  rationale: स्रोत-साक्ष्य की जाँच लंबित होने के कारण इसे आधुनिक खगोलीय “अंतरिक्ष” तक सीमित नहीं किया गया; “विस्तार” स्थान/प्रदेश की सम्भावना बचाता है।
- source_word: type
  choice: रूप
  rationale: अस्पष्ट दार्शनिक कथन में प्रतिरूप, प्रकार या अवस्था की सम्भावनाओं को अपेक्षाकृत खुला रखता है।
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: पाठ की धार्मिक उपाधि का परिचित और संप्रदाय-निरपेक्ष हिन्दी रूप।
theological_decisions:
- issue: आत्मा का बन्धन और उसका किसी को न बाँधना
  choice: “मैं बँधी हुई थी, यद्यपि मैंने किसी को बाँधा नहीं”
  alternative: “मैं बँधी थी, फिर भी मैंने बाँधा नहीं”
  rationale: वाक्य की कठिनता और नैतिक प्रत्युत्तर को बनाए रखते हुए कर्म का अव्यक्त लक्ष्य हिन्दी में स्पष्ट किया गया, पर किसी विशिष्ट धार्मिक व्याख्या को नहीं जोड़ा गया।
- issue: संसार, ऊपर के रूप और मुक्ति का सम्बन्ध
  choice: खंडित और रहस्यमय वाक्य-संरचना को यथासम्भव सुरक्षित रखा
  alternative: इसे आत्मा की भौतिक संसार से पूर्ण मुक्ति के स्पष्ट सिद्धान्त के रूप में सरल करना
  rationale: मूल साक्ष्य स्वयं कठिन/अस्पष्ट है; किसी विशिष्ट ब्रह्माण्ड-विज्ञान या ज्ञानवादी सिद्धान्त को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: अन्तिम ‘rest’ का अर्थ
  choice: “विश्राम प्राप्त करूँगी”
  alternative: “शेष भाग प्राप्त करूँगी”
  rationale: सन्दर्भ में ‘विश्राम’ सम्भावित आध्यात्मिक अर्थ है, किन्तु समय-संबंधी पुनरुक्ति को बनाए रखकर कथन की तनावपूर्ण अस्पष्टता पूरी तरह समाप्त नहीं की गई।
- issue: “wisdom” पर उद्धरण-चिह्न
  choice: “बुद्धि” को उद्धरण-चिह्नों में रखा
  alternative: उद्धरण-चिह्न हटाकर इसे वास्तविक बुद्धि मानना
  rationale: साक्षी-पाठ का व्यंग्यात्मक या प्रश्नसूचक संकेत सुरक्षित रहता है और देह अथवा क्रोध की बुद्धि को सकारात्मक धर्मवैज्ञानिक मूल्य नहीं दिया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। व्यक्तिरूप शक्तियों के नाम संज्ञा-रूप में रखे गए हैं। उद्धरण-चिह्न और वर्ग-कोष्ठक साक्षी-पाठ के संकेतों के अनुरूप सुरक्षित हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी और उपलब्ध पांडुलिपि-सूचना पर आधारित अनंतिम स्रोत-सचेत प्रस्तुति है; कॉप्टिक/यूनानी साक्ष्यों की प्रत्यक्ष समीक्षा अभी लंबित है।
