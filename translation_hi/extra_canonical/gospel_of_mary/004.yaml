  revised_text: 'अभिलाषा ने कहा, “जब तुम नीचे जा रही थीं, तब मैंने तुम्हें नहीं देखा; पर अब मैं तुम्हें ऊपर जाते देख रही हूँ। तो फिर तुम झूठ क्यों बोलती हो, जबकि तुम मेरी हो?”


    आत्मा ने उत्तर दिया, “मैंने तुम्हें देखा, पर तुमने न तो मुझे देखा, न मुझे जाना। तुम्हारे लिए मैं केवल एक वस्त्र थी, और तुमने मुझे पहचाना नहीं।” ये बातें कहकर आत्मा बड़े आनंद के साथ वहाँ से चली गई।


    फिर वह तीसरी शक्ति के पास पहुँची, जिसका नाम “अज्ञान” है। [उसने] आत्मा से पूछताछ की और [कहा], “तुम कहाँ जा रही हो? तुम दुष्टता में बँधी हो। जब तुम स्वयं बँधी हो, तो न्याय मत करो!”[a]


    [तब] आत्मा ने कहा, “तुम मेरा न्याय क्यों करती हो, जबकि मैंने न्याय नहीं किया? मैं बँधी हुई थी, यद्यपि मैंने किसी को बाँधा नहीं। उन्होंने मुझे नहीं पहचाना, पर मैंने पहचान लिया है कि सब कुछ मिट जाएगा—[पृथ्वी] की वस्तुएँ भी और [स्वर्ग] की वस्तुएँ भी।”[b]


    जब आत्मा तीसरी शक्ति पर विजय पा चुकी थी, तो वह ऊपर गई और उसने चौथी शक्ति को देखा, जिसने सात रूप धारण किए थे:


    पहला रूप है अंधकार;


    दूसरा, अभिलाषा;


    तीसरा, अज्ञान;


    चौथा, मृत्यु के लिए उत्कंठा;


    पाँचवाँ, देह का राज्य;


    छठा, देह की मूर्खतापूर्ण “बुद्धि”;


    सातवाँ, क्रोध की “बुद्धि।”


    ये क्रोध की सात शक्तियाँ हैं।


    वे आत्मा से पूछती हैं, “हे हत्यारिन, तुम कहाँ से आई हो? और हे विस्तार पर विजय पाने वाली, तुम कहाँ जा रही हो?”[c]


    आत्मा ने उत्तर दिया, “जो मुझे बाँधता है, वह मार डाला गया है; जो मुझे घेरे हुए है, उस पर विजय पा ली गई है; मेरी अभिलाषा मिट गई है और अज्ञान मर गया है। एक [संसार] में मैं एक संसार से मुक्त हुई, [और] एक रूप में उस रूप से, जो ऊपर है; और विस्मृति की उस जंजीर से भी, जो केवल कुछ समय तक रहती है। अब से मैं मौन में युग की ऋतु के समय का शेष भाग प्राप्त करूँगी।”[d]


    जब मरियम ये बातें कह चुकी, तो वह चुप हो गई, क्योंकि उद्धारकर्ता ने उससे यहीं तक बात की थी।'
