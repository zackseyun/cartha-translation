translation:
  language: hi
  text: 'तब मरियम उठी और उसने उन सबका अभिवादन किया। उसने अपने भाइयों [और बहनों][a] से कहा, “मत रोओ, शोक मत करो और अपने मन को बँटने मत दो, क्योंकि उसकी कृपा तुम सबके साथ रहेगी और तुम्हारी रक्षा करेगी। इसके बजाय, हमें उसकी महानता की स्तुति करनी चाहिए, क्योंकि उसने हमें तैयार किया और मनुष्य बनाया है।”[b]


    जब मरियम ने ये बातें कहीं, तो उसने उनके मनों को भलाई की ओर मोड़ा, और वे उद्धारकर्ता के वचनों पर विचार-विमर्श करने लगे।[c]


    पतरस ने मरियम से कहा, “बहन, हम जानते हैं कि उद्धारकर्ता तुमसे अन्य सभी स्त्रियों से अधिक प्रेम करता था। हमें उद्धारकर्ता के वे वचन बताओ जो तुम्हें याद हैं—वे बातें जिन्हें तुम जानती हो, पर हम नहीं जानते और जिन्हें हमने नहीं सुना।”


    मरियम ने उत्तर दिया, “जो तुमसे छिपा है, वह मैं तुम्हें बताऊँगी।” फिर वह उन्हें ये बातें बताने लगी। उसने कहा, “मैंने दर्शन में प्रभु को देखा और उनसे कहा, ‘प्रभु, आज मैंने आपको दर्शन में देखा।’


    “उन्होंने मुझे उत्तर दिया, ‘तुम धन्य हो, क्योंकि मुझे देखकर तुम डगमगाई नहीं। जहाँ मन है, वहीं खज़ाना है।’[d]


    “मैंने उनसे कहा, ‘प्रभु, जो व्यक्ति दर्शन देखता है, क्या वह उसे आत्मा में देखता है या रूह में?’[e]


    “उद्धारकर्ता ने उत्तर दिया, ‘वह न आत्मा में देखता है, न रूह में; बल्कि इन दोनों के बीच स्थित मन ही दर्शन देखता है, और वही […]’[f]


    [पाण्डुलिपि के पृष्ठ 11 से 14 लुप्त हैं।][g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “और बहनों” उपलब्ध अंग्रेज़ी साक्ष्य में कोष्ठकीय है; यह संभवतः संबोधन के समावेशी अर्थ को स्पष्ट करता है।
    reason: स्रोत-समीक्षा लंबित होने के कारण कोष्ठकीय अनिश्चितता को पारदर्शी रखना आवश्यक है।
  - marker: b
    text: “मनुष्य बनाया” का अर्थ केवल जैविक मानव बनाना नहीं, बल्कि मानवता की किसी पूर्ण या तैयार अवस्था तक लाना भी हो सकता है।
    reason: पूँजीकृत ‘Humans’ की संभावित वैचारिक विशेषता हिन्दी में अन्यथा दिखाई नहीं देती।
  - marker: c
    text: “भलाई” के पीछे का पद “अच्छाई” अथवा “परम भलाई” जैसे दार्शनिक अर्थ में भी समझा जा सकता है। वर्ग कोष्ठकों में दिए शब्द उपलब्ध साक्ष्य में पुनर्स्थापित हैं।
    reason: शाब्दिक और दार्शनिक दोनों संभावनाएँ सुरक्षित रखना।
  - marker: d
    text: “डगमगाई नहीं” का आशय प्रभु को देखकर संदेह, भय या अस्थिरता में न पड़ना हो सकता है।
    reason: अंग्रेज़ी witness का ‘didn’t waver’ एक से अधिक अर्थ देता है।
  - marker: e
    text: यहाँ “आत्मा” और “रूह” दो अलग स्रोत-पदों को दर्शाते हैं; इनके ठीक दार्शनिक अर्थ पर स्रोत-भाषा समीक्षा अभी लंबित है।
    reason: दोनों को एक ही हिन्दी शब्द में मिलाने से मूल का भेद नष्ट हो जाता।
  - marker: f
    text: वाक्य यहीं टूट जाता है। वर्ग कोष्ठक और तीन बिंदु पाण्डुलिपि की क्षति तथा अधूरे पाठ को दर्शाते हैं।
    reason: अनुपलब्ध पाठ की अनुमानित पूर्ति से बचना।
  - marker: g
    text: बर्लिन कोडेक्स में इसके बाद के चार पृष्ठ उपलब्ध नहीं हैं; कथा आगे के बचे हुए पृष्ठों पर पुनः आरम्भ होती है।
    reason: यह कथानक का वाक्य नहीं, पाण्डुलिपि की भौतिक दशा की सूचना है।
lexical_decisions:
- source_word: brothers (and sisters)
  choice: भाइयों [और बहनों]
  rationale: ‘भाइयों’ मूल संबोधन की निकटता रखता है; कोष्ठकीय स्त्री-समावेश को पाठ-संबंधी अनिश्चितता के रूप में वर्ग कोष्ठकों में सुरक्षित रखा गया है।
- source_word: Humans
  choice: मनुष्य
  rationale: पूँजीकृत अंग्रेज़ी ‘Humans’ संभवतः मानवता अथवा पूर्ण मनुष्य बनने पर बल देती है; हिन्दी में अस्वाभाविक पूँजीकरण संभव नहीं, इसलिए अर्थ को ‘मनुष्य’ से खुला रखा गया है।
- source_word: the Good
  choice: भलाई
  rationale: व्यक्तिवाचक अथवा दार्शनिक ‘Good’ और सामान्य नैतिक भलाई के बीच संभावित तनाव को किसी संप्रदायगत तकनीकी शब्द से नहीं बाँधा गया।
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: यह प्रचलित, गरिमापूर्ण और अर्थ-सटीक हिन्दी पद है।
- source_word: mind
  choice: मन
  rationale: दृष्टि, खज़ाने और आत्मा/रूह के बीच स्थित देखनेवाली क्षमता के संदर्भ में एक ही पद रखकर अनुच्छेद की वैचारिक संगति बचाई गई है।
- source_word: soul / spirit
  choice: आत्मा / रूह
  rationale: स्रोत में दो अलग अवधारणाएँ हैं; हिन्दी में ‘आत्मा’ दोनों के लिए रखने से भेद मिट जाता। ‘रूह’ आधुनिक पाठक के लिए बोधगम्य रहते हुए भेद सुरक्षित रखती है।
- source_word: vision
  choice: दर्शन
  rationale: यह धार्मिक दृश्य-अनुभव के लिए स्वाभाविक हिन्दी है और केवल स्वप्न अथवा कल्पना का अर्थ आरोपित नहीं करती।
theological_decisions:
- issue: ‘made us Humans’ का आशय
  choice: ‘हमें तैयार किया और मनुष्य बनाया है’
  alternative: ‘हमें सच्चा/पूर्ण मनुष्य बनाया है’
  rationale: ‘सच्चा’ या ‘पूर्ण’ स्रोत से अधिक व्याख्या जोड़ता; सरल रूप संभावित मानवशास्त्रीय गहराई को खुला रखता है।
- issue: ‘the Good’ की पहचान
  choice: ‘भलाई’
  alternative: ‘परम भलाई’ या ‘सद्‌तत्त्व’
  rationale: विशिष्ट दार्शनिक सत्ता या ईश्वर-संबंधी पहचान आरोपित न करते हुए मूल की अस्पष्टता रखी गई है।
- issue: मन, आत्मा और रूह का संबंध
  choice: तीनों को अलग पदों के रूप में प्रस्तुत किया
  alternative: ‘मन’, ‘प्राण’ और ‘आत्मा’
  rationale: कथन की त्रिभागी संरचना और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया; किसी व्यवस्थित मानवशास्त्र में इसे जबरन नहीं ढाला गया।
- issue: मरियम के प्रति उद्धारकर्ता का प्रेम
  choice: ‘अन्य सभी स्त्रियों से अधिक प्रेम करता था’
  alternative: ‘सबसे अधिक प्रेम करता था’
  rationale: तुलना का दायरा स्त्रियों तक ही रखा गया है, जैसा उपलब्ध साक्ष्य में है; व्यापक शिष्य-श्रेष्ठता का निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। उपलब्ध आधार प्रत्यक्ष कॉप्टिक/यूनानी समीक्षा नहीं बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए अनिश्चित पुनर्स्थापन, टूटे वाक्य और पाण्डुलिपि-लोप स्पष्ट रूप से बनाए रखे गए हैं। संबोधन में आदरसूचक ‘आप’ का प्रयोग किया गया है, जबकि शिष्यों के लिए सामूहिक ‘तुम’ रखा गया है।
