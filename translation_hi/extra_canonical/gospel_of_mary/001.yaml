  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। पुनरावृत्त दार्शनिक पदों में संगति रखी गई है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक/यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
