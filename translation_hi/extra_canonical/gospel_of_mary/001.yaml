translation:
  language: hi
  text: '“तो क्या [पदार्थ] [नष्ट हो जाएगा], या नहीं?”[a]


    उद्धारकर्ता ने कहा, “हर प्रकृति, हर रूप और हर प्राणी एक-दूसरे में और एक-दूसरे के साथ अस्तित्व में हैं; पर वे फिर अपनी-अपनी जड़ों में विलीन हो जाएँगे, क्योंकि पदार्थ की प्रकृति केवल अपनी ही प्रकृति में विलीन होती है। जिसके सुनने के कान हों, वह सुन ले!”


    पतरस ने उनसे कहा, “जब आपने हमें सब कुछ समझा दिया है, तो हमें एक बात और बताइए। संसार का पाप क्या है?”


    उद्धारकर्ता ने कहा, “पाप का कोई अस्तित्व नहीं है; बल्कि तुम ही पाप उत्पन्न करते हो, जब तुम व्यभिचार की प्रकृति के अनुसार काम करते हो—और उसी को ‘पाप’ कहा जाता है। इसीलिए भलाई तुम्हारे बीच, हर प्रकृति की वस्तुओं तक आई, ताकि उसे उसकी जड़ के भीतर फिर से स्थापित करे।”[b]


    फिर उन्होंने आगे कहा, “इसीलिए तुम बीमार पड़ते और मरते हो, क्योंकि [तुम उससे प्रेम करते हो जो तुम्हें छलता है। जो कोई] समझ सकता है, वह समझ ले!


    “पदार्थ ने [एक ऐसी वासना को जन्म दिया] जिसका कोई स्वरूप नहीं है, क्योंकि वह प्रकृति के विरुद्ध से आती है। तब पूरे शरीर में विक्षोभ उत्पन्न होता है। इसीलिए मैंने तुमसे कहा था कि मन में संतुष्ट रहो। यदि तुम असंतुष्ट हो, तो प्रकृति के विविध रूपों की उपस्थिति में संतोष पाओ। जिसके सुनने के कान हों, वह सुन ले!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वर्ग कोष्ठक पांडुलिपि की क्षति या संपादकीय रूप से पुनर्स्थापित शब्दों को दर्शाते हैं।
    reason: पाठक को खंडित पाठ और पुनर्निर्माण के संकेत समझाने के लिए।
  - marker: b
    text: “उसे” और “उसकी” का संकेत किसकी ओर है, यह उपलब्ध साक्ष्य में निश्चित नहीं है; संभव है कि आशय प्रत्येक प्रकृति को उसकी जड़ में पुनःस्थापित करने से हो।
    reason: सर्वनाम के संदिग्ध पूर्वपद को बिना चुपचाप सुलझाए स्पष्ट करने के लिए।
lexical_decisions:
- source_word: matter
  choice: पदार्थ
  rationale: यह दार्शनिक संदर्भ में भौतिक तत्त्व या द्रव्य का संकेत देता है; ‘सामग्री’ अत्यधिक सामान्य होता।
- source_word: nature
  choice: प्रकृति
  rationale: मूल साक्ष्य में बार-बार आने वाले दार्शनिक पद की संगति और उसकी अर्थगत व्यापकता बनाए रखता है।
- source_word: form / image
  choice: रूप / स्वरूप
  rationale: ‘form’ के लिए ‘रूप’ और passion के ‘image’ के लिए ‘स्वरूप’ रखने से निकटवर्ती पर अलग शब्दों का भेद स्वाभाविक हिन्दी में बचता है।
- source_word: the Good
  choice: भलाई
  rationale: व्यक्तिवाची या तात्त्विक अर्थ की संभावना बनाए रखने के लिए अमूर्त संज्ञा चुनी गई है; इसे किसी विशिष्ट धर्मशास्त्रीय उपाधि में नहीं बदला गया।
- source_word: passion
  choice: वासना
  rationale: यहाँ शरीर में विक्षोभ उत्पन्न करने वाली इच्छा या आवेग का भाव है; केवल ‘भावना’ बहुत निर्बल होता।
- source_word: content at heart
  choice: मन में संतुष्ट रहो
  rationale: आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है, जबकि आंतरिक संतोष का आशय सुरक्षित रहता है।
theological_decisions:
- issue: “Sin doesn’t exist” का स्वर
  choice: “पाप का कोई अस्तित्व नहीं है”
  alternative: “पाप जैसी कोई चीज़ नहीं है”
  rationale: दार्शनिक-अस्तित्वगत कथन की तीक्ष्णता और आगे मनुष्यों द्वारा पाप उत्पन्न करने के तनाव को बिना नरम किए सुरक्षित रखा गया।
- issue: “the nature of adultery” की व्याख्या
  choice: “व्यभिचार की प्रकृति”
  alternative: “व्यभिचारी स्वभाव”
  rationale: रूपक, नैतिक या तात्त्विक अर्थ में से किसी एक को निर्णायक न बनाकर मूल अभिव्यक्ति की अस्पष्टता रखी गई।
- issue: “the Good” की पहचान
  choice: “भलाई”
  alternative: “भला जन” अथवा “परम भला”
  rationale: किसी विशिष्ट व्यक्तित्व या ईश्वरीय उपाधि की पहचान पाठ में स्पष्ट नहीं है, इसलिए उसे आरोपित नहीं किया गया।
- issue: “restore it within its root” में सर्वनाम
  choice: “उसे उसकी जड़ के भीतर फिर से स्थापित करे”
  alternative: “हर प्रकृति को उसकी जड़ में लौटा दे”
  rationale: अंग्रेज़ी साक्ष्य के एकवचन सर्वनाम और उसके संदिग्ध पूर्वपद को यथासंभव बनाए रखा गया।
