base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/002.yaml
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
translation:
  language: hi
  text: 'जब धन्य जन ने ये बातें कह लीं, तो उन्होंने उन सबका अभिवादन किया और कहा, “तुम्हें शांति मिले! मेरी शांति को अपना लो। सावधान रहो कि कोई तुम्हें यह कहकर भटका न दे, ‘देखो, यहाँ!’ या ‘देखो, वहाँ!’ क्योंकि मानव-पुत्र[a] तुम्हारे भीतर है। उसके पीछे चलो! जो उसे खोजते हैं, वे उसे पाएँगे।


    “इसलिए जाओ और राज्य का शुभ समाचार सुनाओ। जो मैंने तुम्हें दिया है, उससे आगे कोई नियम न ठहराओ, और न विधान देनेवाले की तरह कोई व्यवस्था बनाओ, कहीं ऐसा न हो कि तुम उसी से बँध जाओ।” ये बातें कहकर वे चले गए।


    पर वे बहुत दुखी हुए और फूट-फूटकर रोए। उन्होंने कहा, “हम गैर-यहूदियों[b] के पास जाकर मानव-पुत्र के राज्य का शुभ समाचार कैसे सुनाएँ? जब उन्होंने उसे ही नहीं छोड़ा, तो हमें क्यों छोड़ेंगे?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मानव-पुत्र” यहाँ अंग्रेज़ी साक्षी के “Son of Humanity” का अनुवाद है। प्रत्यक्ष कॉप्टिक और यूनानी पाठ-समीक्षा अभी लंबित है।
    reason: उपाधि के रूप और अर्थ में संभावित स्रोत-भाषाई सूक्ष्मता को स्पष्ट करना।
  - marker: b
    text: “गैर-यहूदी” उन जातियों या लोगों को दर्शाता है जो यहूदी समुदाय के बाहर थे।
    reason: ऐतिहासिक-सांस्कृतिक पद को आधुनिक हिन्दी पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: the Blessed One
  choice: धन्य जन
  rationale: सम्मानसूचक अर्थ को बनाए रखते हुए किसी विशिष्ट सांप्रदायिक उपाधि को आरोपित नहीं करता।
- source_word: Acquire my peace
  choice: मेरी शांति को अपना लो
  rationale: ‘प्राप्त करो’ की अपेक्षा स्वाभाविक आधुनिक हिन्दी में शांति को ग्रहण और धारण करने का भाव व्यक्त करता है।
- source_word: Son of Humanity
  choice: मानव-पुत्र
  rationale: परंपरागत ‘मनुष्य का पुत्र’ से निकट अर्थ रखते हुए समस्त मानवता से संबंध का स्वर सुरक्षित करता है; स्रोत-भाषा की समीक्षा लंबित होने के कारण टिप्पणी जोड़ी गई है।
- source_word: within you
  choice: तुम्हारे भीतर
  rationale: अंतःस्थिति का सीधा अर्थ रखता है और ‘तुम्हारे बीच’ विकल्प को चुपचाप नहीं अपनाता।
- source_word: gospel
  choice: शुभ समाचार
  rationale: मूल संदेशार्थ को साधारण आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: lawgiver
  choice: विधान देनेवाले
  rationale: किसी व्यक्ति-विशेष की पहचान जोड़े बिना विधि निर्धारित करनेवाले का भाव व्यक्त करता है।
- source_word: Gentiles
  choice: गैर-यहूदियों
  rationale: आधुनिक पाठक के लिए अपेक्षाकृत स्पष्ट सामाजिक-धार्मिक अर्थ देता है।
theological_decisions:
- issue: मानव-पुत्र का स्थान
  choice: तुम्हारे भीतर
  alternative: तुम्हारे बीच
  rationale: प्रदत्त साक्षी स्पष्टतः ‘within you’ देता है। सामूहिक उपस्थिति की संभावित व्याख्या को मुख्य पाठ में डालकर तनाव समाप्त नहीं किया गया।
- issue: नियम और व्यवस्था का निषेध
  choice: जो मैंने तुम्हें दिया है, उससे आगे कोई नियम न ठहराओ
  alternative: किसी भी प्रकार का नियम न बनाओ
  rationale: वचन पूर्णतः नियम-विरोधी नहीं, बल्कि दिए गए निर्देशों से आगे नियम बनाने के विरुद्ध है; इस सीमा को बनाए रखा गया।
- issue: राज्य और मानव-पुत्र का संबंध
  choice: पहले ‘राज्य का शुभ समाचार’, बाद में ‘मानव-पुत्र के राज्य का शुभ समाचार’
  alternative: दोनों स्थानों पर एक ही विस्तृत पदबंध
  rationale: प्रदत्त साक्षी में मौजूद अंतर को समतल नहीं किया गया।
- issue: ‘विधान देनेवाले’ का संकेत
  choice: अनिर्दिष्ट रखा गया
  alternative: मूसा के समान
  rationale: प्रदत्त पाठ किसी नाम का उल्लेख नहीं करता; इसलिए संभावित धार्मिक संकेत को स्पष्ट पहचान में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सुबोध रखी गई है। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी अनुवाद है; जीवित कॉप्टिक और यूनानी स्रोतों की प्रत्यक्ष समीक्षा आवश्यक है। सर्वनाम में सम्मानसूचक बहुवचन का प्रयोग किया गया है, जबकि संवाद की तात्कालिकता बनाए रखने के लिए आज्ञार्थक वाक्य संक्षिप्त रखे गए हैं।
