    text: 'एक अन्य सम्भव पाठ: “वे जानते थे कि उन्होंने अभी तक रूप नहीं पाया था—उन वस्तुओं का, जो उसमें, अर्थात् पिता में हैं। फिर भी पिता परिपूर्ण है और अपने भीतर की हर वस्तु को जानता है। और जब वह चाहता है, जिसे चाहता है उसे प्रकट करता है; जो विद्यमान है उसमें उसे रूप देता है, उसे वस्त्र पहनाता है और बाहरी रूप देकर बाहर लाता है।”'
