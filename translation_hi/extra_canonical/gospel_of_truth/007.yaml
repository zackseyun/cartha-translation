- from: 'क्योंकि उन्होंने अभी तक कोई रूप या नाम नहीं पाया था। पिता उन्हें उत्पन्न करता है। फिर[a], जब वे उसके ज्ञान के द्वारा रूप पाते हैं, तो यद्यपि वे वास्तव में उसी के भीतर हैं, वे उसे नहीं जानते। पर पिता परिपूर्ण है और अपने भीतर के हर स्थान को जानता है। वह जिसे प्रकट करना चाहता है, उसे प्रकट करता है, उसे रूप और नाम देता है। वह उन्हें नाम देता है और उन्हें अस्तित्व में लाता है—उन्हें, जो अस्तित्व में आने से पहले अपने बनानेवाले से अनजान हैं।


    इसलिए यह मत कहो कि जो अभी तक अस्तित्व में नहीं आए हैं, वे कुछ भी नहीं हैं। बल्कि वे उसमें विद्यमान हैं जो जब चाहेगा, उन्हें अस्तित्व में लाना चाहेगा—मानो किसी बाद के नियत समय में। सब कुछ प्रकट होने से पहले ही वह जानता है कि अपने समय में वह क्या उत्पन्न करेगा। लेकिन जिस फल को उसने अभी तक प्रकट नहीं किया है, वह अभी कुछ नहीं जानता और न कुछ करता है।


    इसके अतिरिक्त, पिता में विद्यमान हर ऐयोन उस ‘जो विद्यमान है’ से आता है; वही उन्हें अनस्तित्व में से स्थापित करता है। क्योंकि जिनकी कोई जड़ नहीं, उनका कोई फल भी नहीं। वे अपने मन में कहते हैं, “मैं अस्तित्व में आ गया हूँ,” पर वे अपने-आप विलीन हो जाएँगे। इसी कारण जो कभी अस्तित्व में थे ही नहीं, वे अस्तित्व में नहीं रहेंगे।'
