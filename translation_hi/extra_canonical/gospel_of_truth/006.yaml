  rationale: ऊपर से आने वाली और सबका मूल्यांकन करने वाली न्यायिक क्रिया के लिए स्वाभाविक तथा संदर्भानुकूल शब्द।
- source_word: ⲙⲫⲟⲥⲛⲉⲩ
  choice: दोधारी
  rationale: दोनों ओर काटने वाली तलवार के रूपक को संक्षिप्त और स्पष्ट रूप में रखता है।
- source_word: ⲡⲓⲱⲉ / Logos contrast
