- from: 'क्योंकि यही वह न्याय है जो ऊपर से उतरा; उसने सबका न्याय किया। वह दोधारी तलवार है, जो दोनों ओर काटती है। वचन, जो उसे बोलने वालों के हृदयों में है, प्रकट हुआ। वह केवल एक ध्वनि नहीं था, बल्कि उसने देह धारण की।


    घड़ों के बीच बड़ी हलचल मच गई: कुछ खाली थे और दूसरे भरे हुए; कुछ का प्रबंध किया गया था और दूसरे उँडेल दिए गए थे; कुछ शुद्ध किए गए और दूसरे तोड़ दिए गए। सारे लोक हिल उठे और व्याकुल हो गए, क्योंकि उनमें न तो व्यवस्था थी, न स्थिरता।


    भ्रम[a] अपने भीतर घबरा उठा। वह नहीं जानता था कि क्या करे। वह दुःखी हुआ, विलाप करने लगा और अपने ही ऊपर प्रहार करने लगा, क्योंकि वह कुछ भी नहीं जानता था। वह ज्ञान उसके निकट आया जो उसका विनाश है—और उन सबके निकट भी जो उससे निकले थे—क्योंकि भ्रम खाली है और उसके भीतर कुछ भी नहीं है।


    सत्य उनके बीच आया, और उससे निकले सभी ने उसे पहचान लिया। उन्होंने सत्य में पिता का स्वागत उस पूर्ण सामर्थ्य के साथ किया जो उन्हें पिता से जोड़ता है। सत्य पिता का मुख है और पवित्र आत्मा उसकी जीभ। जो कोई पिता के मुख से जुड़ता है, वह उसकी जीभ के द्वारा पवित्र आत्मा को पाएगा। यह पिता का प्रकाशन और उसकी पीढ़ियों के सामने उसका प्रकट होना है। उसने अपने भीतर छिपी हुई बात को प्रकट किया और उसका अर्थ खोल दिया—क्योंकि अकेले पिता को छोड़ और किसके पास कुछ है?[b]'
