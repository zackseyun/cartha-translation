  consult_excerpt: 'It’s like some who’ve left their home, having jars that weren’t any good in places. They broke them, but the master of the house doesn’t suffer any loss. Instead he rejoices, because in place of the bad jars are ones that are full and complete. For this is 26 the judgment that’s come from above; it’s judged everyone. It’s a drawn, two-edged sword which cuts both ways. The Word, which is in the hearts of those who speak it, appeared. It isn’t just a sound, but it was incarnated (embodied).

    A great disturbance arose among the jars, because some were empty, others filled; some provided for, others poured out; some purified, others broken. All the realms were shaken and disturbed, because they didn’t have order or stability. Error was anxious. It didn’t know what to do; it grieved, mourned, and hurt itself, because it knew nothing. The knowledge, which is its (Error’s) destruction, approached it (Error) and all that emanated from it. Error is empty, with nothing inside it.

    Truth came into their midst, and all that emanated knew it. They welcomed the Father in Truth with a complete power that joins them with the Father. Truth is the Father’s mouth; the Holy Spirit is his tongue. Everyone who loves the Truth and are joined to the 27 Truth are joined to the Father’s mouth. By his tongue they’ll receive the Holy Spirit. This is the revelation of the Father and his manifestation to his generations. He revealed what was hidden of himself; he explained it, because who has anything, if not the Father alone?'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/006.yaml
  text: 'For this is the judgment that came down from above[a]; it judged everyone. It is a sword, two‑edged, that cuts on both sides. The Word, which is in the hearts of those who speak it, appeared: it is not a mere sound, but it put on a body. A great disturbance arose among the jars: some were empty, and others were filled; some were provided for, and others poured out; some were purified, and others were broken. All the realms were shaken and agitated, for they had neither order nor stability.


    Error became anxious within itself; it did not know what it should do. It grieved and mourned and struck at itself, for it knew nothing. The Knowledge that is its undoing approached it—and all that had come forth from it—for Error is empty and has nothing within it.


    Truth came in their midst, and all who are from it knew it. They greeted the Father in Truth with a complete Power that joins them to the Father. Truth is the mouth of the Father; the Holy Spirit is his tongue. Whoever is joined to the mouth of the Father will receive the Holy Spirit by his tongue. This is the revelation of the Father and his manifestation to his generations: he revealed what of himself was hidden, he explained it—for who has anything[b], if not the Father alone?'
translation:
  language: hi
  text: 'क्योंकि यही वह न्याय है जो ऊपर से उतरा; उसने सबका न्याय किया। वह दोधारी तलवार है, जो दोनों ओर काटती है। वचन, जो उसे बोलने वालों के हृदयों में है, प्रकट हुआ। वह केवल एक ध्वनि नहीं था, बल्कि उसने देह धारण की।


    घड़ों के बीच बड़ी हलचल मच गई: कुछ खाली थे और दूसरे भरे हुए; कुछ की पूर्ति की गई थी और दूसरे उँडेल दिए गए थे; कुछ शुद्ध किए गए और दूसरे तोड़ दिए गए। सारे लोक हिल उठे और व्याकुल हो गए, क्योंकि उनमें न तो व्यवस्था थी, न स्थिरता।


    भ्रम[a] अपने भीतर घबरा उठा। वह नहीं जानता था कि क्या करे। वह दुःखी हुआ, विलाप करने लगा और अपने ही ऊपर प्रहार करने लगा, क्योंकि वह कुछ भी नहीं जानता था। वह ज्ञान, जो उसका विनाश है, उसके निकट आया—और उन सबके निकट भी जो उससे निकले थे—क्योंकि भ्रम खाली है और उसके भीतर कुछ भी नहीं है।


    सत्य उनके बीच आया, और उससे निकले सभी ने उसे पहचान लिया। उन्होंने सत्य में पिता का स्वागत उस पूर्ण सामर्थ्य के साथ किया जो उन्हें पिता से जोड़ता है। सत्य पिता का मुख है और पवित्र आत्मा उसकी जीभ। जो कोई सत्य से प्रेम करता है, वह पिता के मुख से जुड़ता है; उसकी जीभ के द्वारा वह पवित्र आत्मा को पाएगा। यह पिता का प्रकाशन और उसकी पीढ़ियों के सामने उसका प्रकट होना है। उसने अपने भीतर छिपी हुई बात को प्रकट किया और उसका अर्थ खोल दिया—क्योंकि अकेले पिता को छोड़ और कौन अस्तित्व में है?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भ्रम’ यहाँ किसी साधारण भूल के लिए नहीं, बल्कि एक व्यक्तिरूप शक्ति के रूप में प्रयुक्त है; इसका अनुवाद ‘भटकाव’ या ‘मिथ्या’ भी किया जा सकता है।
    reason: ग्रीक मूल के कॉप्टिक शब्द πλάνη/ⲡⲗⲁⲛⲏ का अर्थक्षेत्र और स्पष्ट व्यक्तिकरण सुरक्षित करना।
  - marker: b
    text: 'वैकल्पिक अर्थ: ‘अकेले पिता को छोड़ और किसके पास कुछ है?’ अंतिम कॉप्टिक प्रश्न को अस्तित्वगत (‘कौन अस्तित्व में है?’) या अधिक शाब्दिक-स्वामित्वसूचक ढंग से समझा जा सकता है।'
    reason: अंतिम अलंकारिक प्रश्न की संक्षिप्त व्याकरण और अर्थगत द्विअर्थता को सुरक्षित रखना।
