lexical_decisions:
- source_word: ⲡⲓϫⲱⲕ
  choice: पूर्णता
  rationale: यह शब्द पूर्ण होने, पूर्णता या समापन का बोध देता है। संदर्भ में पिता के विचार के भीतर सिद्ध पूर्णता प्रमुख है; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: लोगोस—वचन
  rationale: यूनानी-कॉप्टिक पारिभाषिक संज्ञा को सुरक्षित रखते हुए सामान्य पाठक के लिए उसका अर्थ ‘वचन’ साथ दिया गया है।
- source_word: ⲛⲟⲩⲥ
  choice: बुद्धि
  rationale: यहाँ केवल सामान्य मन नहीं, बल्कि वचन को व्यक्त करनेवाली बोधात्मक शक्ति अभिप्रेत है; इसलिए ‘बुद्धि’ चुना गया।
- source_word: ⲭⲁⲣⲓⲥ
  choice: अनुग्रह
  rationale: कृपा/अनुग्रह के धार्मिक और साहित्यिक अर्थ को बनाए रखता है तथा ‘मौन अनुग्रह’ के असामान्य स्रोत-रूपक को नहीं मिटाता।
- source_word: ⲙⲉⲩⲉ / ⲙⲉⲉⲓⲛⲉ
  choice: विचार / मनन
  rationale: मूर्त रूप में प्रयुक्त संज्ञा के लिए ‘विचार’ और चिंतन की क्रिया या प्रक्रिया के लिए ‘मनन’ रखकर स्रोत का शब्द-खेल आंशिक रूप से सुरक्षित किया गया है।
- source_word: ⲟⲩⲱϣ
  choice: इच्छा
  rationale: पिता की सक्रिय इच्छा और लगभग व्यक्तीकृत इच्छाशक्ति दोनों को व्यक्त करता है; हिन्दी में अनावश्यक अंग्रेज़ी-शैली के बड़े अक्षर संभव नहीं हैं।
- source_word: ⲁⲃⲁⲗ
  choice: बाहर / प्रकट
  rationale: अंदर स्थित विचार और बाहर अभिव्यक्त होने के स्थानिक-तत्त्वमीमांसक विरोध को जहाँ संभव हो ‘बाहर’ से सुरक्षित रखा गया है।
- source_word: ⲓⲭⲛⲟⲥ
  choice: चिह्न
  rationale: यूनानी ichnos का मूल अर्थ पदचिह्न/निशान है; अमूर्त संदर्भ में स्वाभाविक हिन्दी ‘चिह्न’ है।
- source_word: ⲥⲟⲟⲩⲛⲉ
  choice: ज्ञान
  rationale: तकनीकी ज्ञानबोध को सुलभ हिन्दी में रखता है, बिना मुख्य पाठ में ‘ग्नोसिस’ जैसा बाहरी पारिभाषिक शब्द आरोपित किए।
- source_word: ⲡⲉⲉⲓ ⲉⲑⲏⲡ
  choice: वह छिपा हुआ
  rationale: ईश्वर के लिए प्रयुक्त उपाधि-सदृश अभिव्यक्ति को बनाए रखते हुए हिन्दी में स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: पिता की इच्छा का व्यक्तीकृत स्वरूप
  choice: ‘इच्छा’ को पिता के विश्राम और कार्य का सक्रिय माध्यम रहने दिया गया
  alternative: इसे केवल ‘निर्णय’ या ‘अभिलाषा’ के रूप में सपाट करना
  rationale: पाठ इच्छा को पिता के विश्राम-स्थान और उसके चिह्न के रूप में प्रस्तुत करता है; अनुवाद इस तनाव को किसी व्यवस्थित सिद्धान्त में नहीं बदलता।
- issue: लोगोस और बुद्धि का संबंध
  choice: लोगोस को ‘लोगोस—वचन’ और nous को ‘बुद्धि’ कहा गया
  alternative: दोनों को सामान्यतः ‘वचन’ और ‘मन’ कहना
  rationale: पाठ की पारिभाषिक और चिंतनपरक भाषा सुरक्षित रहती है, पर अर्थ भी साधारण पाठक को मिलता है।
- issue: अन्त का अर्थ
  choice: ‘अन्त’ को छिपे हुए पिता का ज्ञान पाना कहा गया
  alternative: इसे मुक्ति, उद्धार या परम-दर्शन कहकर स्पष्ट करना
  rationale: स्रोत ज्ञान और लौटने की भाषा रखता है; किसी विशिष्ट संप्रदायगत उद्धार-सिद्धान्त को आरोपित नहीं किया गया।
- issue: पिता की अगम्यता
  choice: ‘जाँच-पड़ताल करके उसे पकड़ सकें’
  alternative: ‘उसे पूरी तरह समझ सकें’
