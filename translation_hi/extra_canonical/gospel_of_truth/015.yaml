- from: '### विश्राम का स्थान


    पर ये इस रीति से प्रकट नहीं होते।


    क्योंकि उन्होंने न तो अपने आपको ऊँचा उठाया, न पिता की महिमा घटाई; और न उन्होंने उसे तुच्छ, कठोर या क्रोधी समझा। इसके विपरीत, वह बुराई से रहित, अविचल और मधुर है। वह हर क्षेत्र को उसके अस्तित्व में आने से पहले ही जानता है, और उसे किसी से शिक्षा पाने की आवश्यकता नहीं है।


    ऊपर की अथाह महानता में जिनका कुछ अंश है, उनकी रीति ऐसी ही है। वे केवल उस संपूर्ण जन[a] की प्रतीक्षा करते हैं, जो उनके लिए माता है। वे अधोलोक[b] में नहीं उतरते। उनके बीच न ईर्ष्या है, न कराहना, और न उनके भीतर मृत्यु है। इसके बजाय, वे उस विश्राममय जन में विश्राम करते हैं—न संघर्ष करते हुए, न सत्य की खोज में छटपटाते हुए। बल्कि वे स्वयं सत्य हैं; पिता उनके भीतर है और वे पिता में हैं। वे संपूर्ण हैं और उस जन से अविभाजित हैं जो सचमुच भला है। उन्हें किसी वस्तु की कमी नहीं; वे विश्राम करते हैं और आत्मा में तरोताज़ा होते हैं। वे अपनी जड़ की सुनेंगे और उन बातों की ओर ध्यान देंगे जिनमें उन्हें अपनी जड़ मिलेगी, ताकि उनकी आत्मा को कोई हानि न हो। यही धन्य जनों का स्थान है; यही उनका स्थान है।'
  to: '### विश्राम का स्थान


    पर ये इस रीति से प्रकट नहीं होते।


