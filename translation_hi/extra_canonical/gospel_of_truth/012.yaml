  - marker: c
    text: “मसीह” का पारंपरिक रूप “ख्रीस्त” भी है।
    reason: संक्षिप्त कॉप्टिक पवित्र नाम यूनानी Christos को दर्शाता है, जो शीर्षक और नाम-जैसे प्रयोग दोनों रख सकता है।
  - marker: d
    text: 'वैकल्पिक रूप से: “वह अपनी रोपाइयों को जानता है, क्योंकि उसी ने उन्हें अपने उद्यान में रोपा है।”'
    reason: कृषि-रूपक में ‘पौधे’ और ‘रोपाइयाँ’ दोनों सम्भव हैं; मुख्य पाठ सामान्य हिन्दी में अधिक सहज ‘लगाए हुए पौधों’ रखता है।
