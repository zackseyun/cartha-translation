  consult_excerpt: 'This is the Word of the Gospel of the discovery of the fullness, which comes for those who are awaiting 35 the salvation which is coming from above. The hope for which they’re waiting is waiting for those whose image is light with no shadow in it. If at that time the fullness comes, the need of matter doesn’t come through the infinity of the Father, who comes to give time to the need – although no one can say that the incorruptible one will come like this. But the depth of the Father multiplied, and the thought of Error didn’t exist with him. It’s something that’s fallen, which is easily set upright in the discovery of the one who’s to come to what he’ll return, because the return is called “repentance.”

    Because of this, incorruptibility breathed out. It followed after the one who sinned, so that they might rest, because forgiveness is what remains for the light in need, the Word of fullness. For the doctor hurries to the place where there’s sickness, because that’s what he (or she) wants to do. The one in need, then, doesn’t hide it, because one (the doctor) has what they need. In this way the fullness, which has no need but fills the need, is what he 36 provided from himself to fill up what’s needed, so that they might receive grace; because when they were in need, they didn’t have grace. Because of this, a diminishing took place where there is no grace. When what was diminished was restored, what they needed was revealed as fullness. This is the discovery of the light of Truth which enlightened them, because it doesn’t change.

    Because of this, they spoke of Christ in their midst: “Seek, and those who were disturbed will receive a return – and he’ll anoint them with ointment.” The ointment is the mercy of the Father, who will have mercy on them. But those whom he anointed are those who have been completed, because full jars are the ones that are anointed. But when the anointing of one dissolves, it empties, and the cause of the need is the place where the ointment leaks, because a breath and its power draws it. But from the one who has no need, no seal is removed, nor is anything emptied, but what it needs is filled again by the Father, who’s complete.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/012.yaml
  text: 'The speech of the Good News about the finding of the Fullness is for those who await the salvation that comes from above[a]. While they wait for it, the hope belongs to those whose image is light with no shadow in it. When, then, the Fullness arrives, the need of hylē (matter) is not from the immeasurability of the Father; he comes to grant a season to the need. Yet no one is able to say that the Incorruptible comes in such a manner. Rather, the Depth of the Father grew and multiplied, and the thought of Error was not with him. Error is a fall—something easy to set upright by the finding of the one who will come back to that to which he returns, for the return is named change of mind.


    Because of this, Incorruptibility breathed forth; it pursued the one who had sinned, so that he might find rest. For what remains for the light in need is forgiveness—the Word of the Fullness. For the physician runs to the place where sickness is, because that is what he wills. And the one in need does not hide, for someone possesses what that one needs. In this way the Fullness—which has no need—provided from itself to fill up the need, so that they might receive grace. For when they were in need, grace was not with them. Because of this, a diminishing took place where there is no grace; and when what was diminished was restored, the need was shown as Fullness. This is the finding of the light of the Truth that enlightened them, for it is unchangeable.


    Because of this, they spoke concerning the Messiah in their midst: “Seek, and those who were disturbed will return, and he will anoint them with chrism.” The chrism is the mercy of the Father, and he will have mercy on them. Now those whom he anointed are the perfect—for full vessels are the ones anointed. But when the anointing of one dissolves, it is emptied, and the cause of the need is the place where the ointment leaks out, because a breath and its power draw it. Yet from the one who has no need no seal is loosened, and nothing is emptied; rather, what it needs the Father—who is complete—fills again with him. He is good; he knows his plantings, because it is he who planted them in his Paradise[c][b]. Now his Paradise is his place of rest.'
translation:
  language: hi
  text: '### जो कमी थी, उसे पूरा करना


    परिपूर्णता के मिल जाने के शुभ समाचार का यह वचन उन लोगों के लिए है जो ऊपर से आनेवाले उद्धार की बाट जोहते हैं।[a] जिस आशा की वे प्रतीक्षा करते हैं, वह उन लोगों के लिए है जिनका स्वरूप ऐसा प्रकाश है जिसमें कोई छाया नहीं।


    जब परिपूर्णता आती है, तब मूल पदार्थ की कमी पिता की असीमता से नहीं आती; वह कमी को एक समय देने आता है। फिर भी कोई यह नहीं कह सकता कि अविनाशी इसी रीति से आएगा। बल्कि पिता की गहराई बढ़ी और बहुतायत में हुई, और भूल का विचार उसके साथ नहीं था। भूल गिरी हुई वस्तु है—जो उस व्यक्ति के मिल जाने पर आसानी से सीधी की जा सकती है, जो उसी ओर लौटता है जहाँ उसे लौटना है। क्योंकि इस लौटने को “मन-परिवर्तन” कहा जाता है।[b]


    इसी कारण अविनाशिता ने साँस फूँकी और पाप करनेवाले के पीछे गई, ताकि वह विश्राम पाए। क्योंकि अभाव में पड़े प्रकाश के लिए जो शेष रहता है, वह क्षमा है—परिपूर्णता का वचन। वैद्य उस स्थान की ओर दौड़ता है जहाँ रोग है, क्योंकि यही उसकी इच्छा है। और जिसे आवश्यकता है वह उसे छिपाता नहीं, क्योंकि किसी के पास वह है जिसकी उसे आवश्यकता है। इसी प्रकार परिपूर्णता ने—जिसे स्वयं कोई आवश्यकता नहीं—अपने में से वह दिया जिससे कमी पूरी हो जाए, ताकि वे अनुग्रह पाएँ। क्योंकि जब वे अभाव में थे, तब अनुग्रह उनके साथ नहीं था। इसी कारण जहाँ अनुग्रह नहीं था वहाँ घटाव हुआ। पर जब जो घट गया था वह फिर पूरा किया गया, तब कमी परिपूर्णता के रूप में प्रकट हुई। सत्य के प्रकाश का मिलना यही है; उसी ने उन्हें प्रकाशित किया, क्योंकि वह बदलता नहीं।


    इसी कारण उन्होंने अपने बीच मसीह[c] के विषय में कहा, “खोजो, और जो व्याकुल हो गए थे वे लौट आएँगे; और वह अभिषेक-तेल से उनका अभिषेक करेगा।” यह अभिषेक-तेल पिता की दया है, और वह उन पर दया करेगा। जिनका उसने अभिषेक किया, वे पूर्ण हुए लोग हैं; क्योंकि भरे हुए पात्रों का ही अभिषेक किया जाता है। पर जब किसी का अभिषेक घुलकर बह जाता है, तो वह पात्र खाली हो जाता है। कमी उस जगह के कारण होती है जहाँ से तेल रिसता है, क्योंकि एक साँस और उसकी शक्ति उसे खींच लेती है। लेकिन जिसमें कोई कमी नहीं, उसकी मुहर नहीं खुलती और उसमें से कुछ भी खाली नहीं होता। बल्कि जिसे जो चाहिए, उसे पिता—जो पूर्ण है—फिर भर देता है।


    वह भला है। वह अपने लगाए हुए पौधों को जानता है, क्योंकि उसी ने उन्हें अपने उद्यान में लगाया है। उसका उद्यान ही उसका विश्राम-स्थान है।[d]'
