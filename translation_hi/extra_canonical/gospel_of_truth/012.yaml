- from: '### जो कमी थी, उसे पूरा करना


    परिपूर्णता के मिल जाने के शुभ समाचार का यह वचन उन लोगों के लिए है जो ऊपर से आनेवाले उद्धार की बाट जोहते हैं।[a] जब वे उसकी प्रतीक्षा करते हैं, तब उनकी आशा उन लोगों के लिए है जिनका स्वरूप ऐसा प्रकाश है जिसमें कोई छाया नहीं।


    जब परिपूर्णता आती है, तब मूल पदार्थ की कमी पिता की असीमता से नहीं आती; वह उस कमी को एक समय देने आता है। फिर भी कोई यह नहीं कह सकता कि अविनाशी इसी रीति से आएगा। बल्कि पिता की गहराई बढ़ी और बहुतायत में हुई, और भूल का विचार उसके साथ नहीं था। भूल गिरी हुई वस्तु है—और जो आनेवाला है, उसके मिल जाने पर उसे आसानी से सीधा किया जा सकता है; वह उसी ओर लौटेगा जहाँ उसे लौटना है। क्योंकि इस लौटने को “मन-परिवर्तन” कहा जाता है।[b]


    इसी कारण अविनाशिता ने साँस फूँकी और पाप करनेवाले के पीछे गई, ताकि वह विश्राम पाए। क्योंकि अभाव में पड़े प्रकाश के लिए जो शेष रहता है, वह क्षमा है—परिपूर्णता का वचन। वैद्य उस स्थान की ओर दौड़ता है जहाँ रोग है, क्योंकि यही उसकी इच्छा है। और जिसे आवश्यकता है वह उसे छिपाता नहीं, क्योंकि किसी के पास वह है जिसकी उसे आवश्यकता है। इसी प्रकार परिपूर्णता ने—जिसे स्वयं कोई आवश्यकता नहीं—अपने ही भीतर से वह दिया जिससे कमी पूरी हो जाए, ताकि वे अनुग्रह पाएँ। क्योंकि जब वे अभाव में थे, तब अनुग्रह उनके साथ नहीं था। इसी कारण जहाँ अनुग्रह नहीं था वहाँ घटाव हुआ। पर जब जो घट गया था वह फिर पूरा किया गया, तब जिसकी कमी थी वह परिपूर्णता के रूप में प्रकट हुआ। सत्य के प्रकाश का मिलना यही है; उसी ने उन्हें प्रकाशित किया, क्योंकि वह बदलता नहीं।


    इसी कारण उन्होंने अपने बीच मसीह[c] के विषय में कहा, “खोजो, और जो व्याकुल हो गए थे वे लौट आएँगे; और वह अभिषेक-तेल से उनका अभिषेक करेगा।” यह अभिषेक-तेल पिता की दया है, और वह उन पर दया करेगा। जिनका उसने अभिषेक किया, वे पूर्ण किए हुए लोग हैं; क्योंकि भरे हुए पात्रों का ही अभिषेक किया जाता है। पर जब किसी का अभिषेक घुलकर बह जाता है, तो वह पात्र खाली हो जाता है। कमी उस जगह के कारण होती है जहाँ से तेल रिसता है, क्योंकि एक साँस और उसकी शक्ति उसे खींच लेती है। लेकिन जिसमें कोई कमी नहीं, उसकी मुहर नहीं खुलती और उसमें से कुछ भी खाली नहीं होता। बल्कि उसमें जो कमी है, उसे पूर्ण पिता फिर अपने से भर देता है।


    वह भला है। वह अपने लगाए हुए पौधों को जानता है, क्योंकि उसी ने उन्हें अपने उद्यान में लगाया है। उसका उद्यान ही उसका विश्राम-स्थान है।[d]'
