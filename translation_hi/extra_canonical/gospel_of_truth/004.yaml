  yaml_path: translation/extra_canonical/gospel_of_truth/004.yaml
  text: 'As for the names of the Living, they are written in the Book of the Living.

    They receive instruction about themselves; they receive it from the Sonship, so that the one who hears may answer, may turn back, and may look toward the one who called his name. He does his will, he follows after him, and he says that they are his who have been named by him. Each one knows from where he has been called; he does his will, he desires to please him, and he receives rest. Each one’s name becomes his own.

    Since, then, the completion of the All is in him, it is necessary for the All to go up, and for each one to receive what is his. He wrote them beforehand—having prepared them in his thought and in his will—to give to those who went forth from him.

    Those whom he knew by name beforehand were called at the end, so that the one who has knowledge is the one whose name the Father has spoken; for the one whose name has not been uttered is ignorant. And how will such a one hear, if his name has not been called? For the ignorant one until the end is a product of Error, and he will dissolve together with it. Otherwise, why do these pitiable ones have no name? Why do they have no voice?

    Thus, if someone has knowledge, he is from above. If he is called, he hears; he answers; he turns to the one who calls him; he goes up to him; and he knows the manner in which he is called. Possessing knowledge, he does the will of the one who called him, he desires to be pleasing to him, and he receives rest. His name becomes his own. Such a knower knows from where he came and where he is going. He knows like one who, having been drunk, turned away from his drunkenness, and having returned to himself, has set again in order the things that are his.

    He has brought many back from Error. He went before them to the places from which they had moved away. They had received Error because of the depth of the one who surrounds every place—though nothing surrounds him. A great wonder: that they were in the Father and did not know him, and that they were able to come forth by themselves, though they were not able to grasp and to know the one in whom they were. He revealed his will as knowledge, in harmony with all that went out from him.

    This is the knowledge of the Living Book which he revealed to the generations at the end—letters from him showing that they are not vowels nor consonants, so that someone would read them and suppose they are empty, but they are letters of the Truth: they speak, and they know themselves. Each letter is a complete thought, like a book that is complete, since they are letters written by the Unity, the Father having written them so that the generations, by means of his letters from him, might know the Father.'
translation:
  language: hi
  text: '## जीवितों की पुस्तक


    जहाँ तक जीवितों के नामों की बात है, वे जीवितों की पुस्तक[a] में लिखे हुए हैं।


    वे अपने विषय में शिक्षा पाते हैं; वे इसे पुत्रत्व[b] से पाते हैं, ताकि जो सुनता है वह उत्तर दे, लौटे और उसकी ओर देखे जिसने उसे नाम लेकर बुलाया है। वह उसकी इच्छा पूरी करता है, उसके पीछे चलता है और कहता है कि जिन्हें उसने नाम दिया है, वे उसी के हैं। हर एक जानता है कि उसे कहाँ से बुलाया गया है; वह उसकी इच्छा पूरी करता है, उसे प्रसन्न करना चाहता है और विश्राम पाता है। हर एक का नाम उसका अपना हो जाता है।


    क्योंकि समस्त की पूर्णता उसी में है, इसलिए समस्त का ऊपर उसके पास जाना और हर एक का जो उसका है उसे पाना आवश्यक है। उसने इन्हें पहले ही लिख दिया था—अपने विचार और अपनी इच्छा में तैयार करके—ताकि वह इन्हें उन लोगों को दे जो उससे निकलकर आए थे।


    जिन्हें वह पहले से नाम के द्वारा जानता था, उन्हें अंत में बुलाया गया। इसलिए ज्ञान रखने वाला वही है जिसका नाम पिता ने पुकारा है; क्योंकि जिसका नाम उच्चारित नहीं हुआ, वह अज्ञानी है। और यदि उसका नाम पुकारा ही न गया हो, तो वह कैसे सुनेगा? जो अंत तक अज्ञानी रहता है, वह भ्रांति[c] की उपज है और उसी के साथ मिट जाएगा। नहीं तो इन दयनीय लोगों का कोई नाम क्यों नहीं है? उनकी कोई आवाज़ क्यों नहीं है?


    इसलिए यदि किसी के पास ज्ञान है, तो वह ऊपर से है। जब उसे बुलाया जाता है, वह सुनता है; उत्तर देता है; बुलाने वाले की ओर मुड़ता है; ऊपर उसके पास जाता है; और जानता है कि उसे किस प्रकार बुलाया गया है। ज्ञान रखते हुए वह अपने बुलाने वाले की इच्छा पूरी करता है, उसे प्रसन्न करना चाहता है और विश्राम पाता है। उसका नाम उसका अपना हो जाता है। इस प्रकार ज्ञान रखने वाला जानता है कि वह कहाँ से आया और कहाँ जा रहा है। वह उस मनुष्य के समान जानता है जो नशे में था, फिर अपने नशे से फिर गया और होश में लौटकर अपनी वस्तुओं को दोबारा व्यवस्थित कर लिया।


    उसने बहुतों को भ्रांति से वापस लौटा दिया है। वह उनके आगे-आगे उन स्थानों तक गया जिनसे वे भटककर दूर चले गए थे। उन्होंने उसकी गहराई के कारण भ्रांति को अपना लिया था—उसकी, जो हर स्थान को घेरे हुए है, यद्यपि उसे कोई नहीं घेरता। यह बड़ा आश्चर्य है कि वे पिता में थे, फिर भी उसे नहीं जानते थे; और वे अपने आप उससे निकल सके, यद्यपि वे उसे ग्रहण करने और जानने में असमर्थ थे जिसमें वे थे। उसने अपनी इच्छा को ज्ञान के रूप में प्रकट किया, उन सबके साथ सामंजस्य में जो उससे निकले थे।


    यह जीवित पुस्तक[a] का वह ज्ञान है जिसे उसने अंत में पीढ़ियों को प्रकट किया—उसकी ओर से आए ऐसे अक्षर, जो न तो स्वर हैं न व्यंजन, ताकि कोई उन्हें पढ़कर यह समझे कि वे अर्थहीन हैं। बल्कि वे सत्य के अक्षर हैं: वे बोलते हैं और अपने आपको जानते हैं। हर अक्षर एक पूर्ण विचार है, मानो अपने आप में एक पूरी पुस्तक हो; क्योंकि वे एकत्व[d] के लिखे हुए अक्षर हैं। पिता ने उन्हें इसलिए लिखा कि पीढ़ियाँ उसकी ओर से आए इन अक्षरों के द्वारा पिता को जानें।'
