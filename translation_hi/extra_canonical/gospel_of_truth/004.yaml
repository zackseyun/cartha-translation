- from: '## जीवितों की पुस्तक


    जहाँ तक जीवितों के नामों की बात है, वे जीवितों की पुस्तक[a] में लिखे हुए हैं।


    वे अपने विषय में शिक्षा पाते हैं; वे इसे पुत्रत्व[b] से पाते हैं, ताकि जो सुनता है वह उत्तर दे, लौटे और उसकी ओर देखे जिसने उसे नाम लेकर बुलाया है। वह उसकी इच्छा पूरी करता है, उसके पीछे चलता है और कहता है कि जिन्हें उसने नाम दिया है, वे उसी के हैं। हर एक जानता है कि उसे कहाँ से बुलाया गया है; वह उसकी इच्छा पूरी करता है, उसे प्रसन्न करना चाहता है और विश्राम पाता है। हर एक का नाम उसका अपना हो जाता है।


    क्योंकि समस्त की पूर्णता उसी में है, इसलिए समस्त का ऊपर उसके पास जाना और हर एक का अपनी वस्तुएँ पाना आवश्यक है। उसने इन्हें पहले ही लिख दिया था—अपने विचार और अपनी इच्छा में तैयार करके—ताकि वह इन्हें उन लोगों को दे जो उससे निकलकर आए थे।


    जिन्हें वह पहले से नाम के द्वारा जानता था, उन्हें अंत में बुलाया गया। इसलिए ज्ञान रखने वाला वही है जिसका नाम पिता ने पुकारा है; क्योंकि जिसका नाम उच्चारित नहीं हुआ, वह अज्ञानी है। और यदि उसका नाम पुकारा ही न गया हो, तो वह कैसे सुनेगा? जो अंत तक अज्ञानी रहता है, वह भ्रांति[c] की उपज है और उसी के साथ मिट जाएगा। नहीं तो इन दयनीय लोगों का कोई नाम क्यों नहीं है? उनकी कोई आवाज़ क्यों नहीं है?


    इसलिए यदि किसी के पास ज्ञान है, तो वह ऊपर से है। जब उसे बुलाया जाता है, वह सुनता है; उत्तर देता है; बुलाने वाले की ओर मुड़ता है; ऊपर उसके पास जाता है; और जानता है कि उसे किस प्रकार बुलाया गया है। ज्ञान रखते हुए वह अपने बुलाने वाले की इच्छा पूरी करता है, उसे प्रसन्न करना चाहता है और विश्राम पाता है। उसका नाम उसका अपना हो जाता है। इस प्रकार ज्ञान रखने वाला जानता है कि वह कहाँ से आया और कहाँ जा रहा है। वह उस मनुष्य के समान जानता है जो नशे में था, फिर अपने नशे से फिर गया और होश में लौटकर अपनी वस्तुओं को दोबारा व्यवस्थित कर लिया।


    उसने बहुतों को भ्रांति से वापस लौटा दिया है। वह उनके आगे-आगे उन स्थानों तक गया जिनसे वे भटककर दूर चले गए थे। उन्होंने उस जन की गहराई के कारण भ्रांति को अपना लिया था जो हर स्थान को घेरे हुए है—यद्यपि उसे कोई नहीं घेरता। यह बड़ा आश्चर्य है कि वे पिता में थे, फिर भी उसे नहीं जानते थे; और वे अपने आप उससे निकल सके, यद्यपि वे उसे ग्रहण करने और जानने में असमर्थ थे जिसमें वे थे। उसने अपनी इच्छा को ज्ञान के रूप में प्रकट किया, उन सबके साथ सामंजस्य में जो उससे निकले थे।


    यह जीवित पुस्तक[a] का वह ज्ञान है जिसे उसने अंत में आने वाली पीढ़ियों पर प्रकट किया—उसकी ओर से आए अक्षर, जो दिखाते हैं कि वे न तो स्वर हैं, न व्यंजन, जिन्हें पढ़कर कोई यह समझे कि वे अर्थहीन हैं। बल्कि वे सत्य के अक्षर हैं: वे बोलते हैं और अपने आपको जानते हैं। हर अक्षर एक पूर्ण विचार है, मानो अपने आप में एक पूरी पुस्तक हो; क्योंकि वे एकत्व[d] के लिखे हुए अक्षर हैं। पिता ने उन्हें इसलिए लिखा कि पीढ़ियाँ उसकी ओर से आए इन अक्षरों के द्वारा पिता को जानें।


    [a] कॉप्टिक पद का अर्थ संदर्भ के अनुसार “जीवितों की पुस्तक” या “जीवित पुस्तक” हो सकता है। आरंभ में पहला अर्थ नामों के लिखे होने से जुड़ता है, जबकि अंतिम अनुच्छेद में दूसरा अर्थ अधिक स्वाभाविक है।


    [b] “पुत्रत्व” यहाँ केवल पुत्र होने की दशा नहीं, बल्कि एक विशिष्ट आध्यात्मिक सत्ता या वास्तविकता का संकेत भी दे सकता है।


    [c] “भ्रांति” को यहाँ केवल किसी व्यक्ति की भूल नहीं, बल्कि भटकाने वाली सक्रिय शक्ति के रूप में चित्रित किया गया है।


    [d] “एकत्व” उस एकीकृत दिव्य वास्तविकता का संकेत है जिससे ये अक्षर आते हैं; इसे “एकता” भी कहा जा सकता है।'
