  - marker: e
    text: ‘प्लेरोमा’ का शाब्दिक अर्थ ‘परिपूर्णता’ या ‘पूर्ण समग्रता’ है; यहाँ यह दिव्य पूर्णता के लिए तकनीकी पद है।
    reason: तकनीकी ब्रह्मांड-विषयक शब्द की पाठक-सुलभ व्याख्या।
