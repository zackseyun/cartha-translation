revisions:
- from: '### पिता की इच्छा पूरी करना


    जो लड़खड़ाते हैं, उनके पाँव दृढ़ करो; बीमारों की ओर हाथ बढ़ाओ। भूखों को भोजन दो और थके-माँदों को विश्राम दो। जो उठना चाहते हैं, उन्हें उठाओ और सोए हुओं को जगाओ—क्योंकि तुम वह समझ हो जिसे म्यान से खींच लिया गया है। यदि सामर्थ्य ऐसा करे, तो वह और भी प्रबल होता जाता है।


    अपना ध्यान रखो। जिन दूसरी चीज़ों को तुमने अपने से दूर फेंक दिया है, उनकी चिंता मत करो। अपनी उलटी खाने के लिए फिर मत लौटो। न तो पतंगों का आहार बनो, न कीड़ों का, क्योंकि तुम उसे पहले ही झाड़ चुके हो। शैतान का घर मत बनो, क्योंकि तुम उसे पहले ही मिटा चुके हो। अपनी गिरती हुई बाधाओं को इस तरह सहारा मत दो, मानो तुम उनके टेक हो। क्योंकि अधर्मी कुछ भी नहीं है; फिर भी जब वह दूसरों के बीच अपने काम करता है, तो उसके साथ धर्मी से भी अधिक कठोरता बरती जाती है।[a]


    इसलिए पिता की इच्छा पूरी करो, क्योंकि तुम उसी से निकले हो। पिता मधुर है, और उसकी इच्छा में भलाई है। वह तुम्हारी चीज़ों को जानता है, ताकि तुम उनमें विश्राम पाओ। फल से लोग पहचानते हैं कि तुम्हारा क्या है, क्योंकि पिता की संतान उसकी सुगंध हैं; वे उसके मुख के अनुग्रह से निकली हैं। इसी कारण पिता अपनी सुगंध से प्रेम करता है और उसे हर स्थान पर प्रकट करता है। जब वह हाइले[b] के साथ मिलती है, तब वह अपनी सुगंध ज्योति को देता है; और अपनी शांति में वह उसे हर रूप और हर ध्वनि से श्रेष्ठ बना देता है।


    सुगंध को सूँघने वाले कान नहीं हैं; आत्मा ही उसे सूँघता है, सुगंध को अपनी ओर खींचता है और पिता की सुगंध में डूब जाता है। तब वह उसे आश्रय देता है और उस स्थान पर वापस ले जाता है जहाँ से वह आई थी—उस पहली सुगंध से, जो ठंडी पड़ गई थी। वह प्राणयुक्त रचना[c] के भीतर ऐसी है, जैसे ठंडा पानी भुरभुरी मिट्टी के ढेले में समा गया हो। उसे देखने वाले समझते हैं कि वह केवल मिट्टी है। बाद में वह फिर घुल जाती है; और यदि कोई साँस उसे खींच ले, तो वह गरम हो जाती है।


    इस प्रकार जो सुगंधें ठंडी हैं, वे विभाजन से उत्पन्न हुई हैं। इसी कारण विश्वास आया:[d] उसने विभाजन को मिटा दिया और प्रेम से गरम प्लेरोमा[e] को ले आया, ताकि ठंड फिर न लौटे, बल्कि सिद्धता के विचार की एकता बनी रहे। इसी लोगोस[f] ने उन लोगों के लिए, जो उसकी प्रतीक्षा कर रहे थे, प्लेरोमा की प्राप्ति प्रकट की।'
  to: '### पिता की इच्छा पूरी करना


