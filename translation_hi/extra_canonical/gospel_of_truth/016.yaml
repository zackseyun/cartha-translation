  revised_text: 'जहाँ तक दूसरों की बात है, वे पहचान लें कि वे कहाँ खड़े हैं। पर मैं विश्राम-स्थान[a] में पहुँच चुका हूँ; इसलिए मेरे लिए और कुछ कहना उचित नहीं। बल्कि, मैं उसी में स्थित हो जाऊँगा और समस्त के पिता तथा सच्चे भाइयों के प्रति निरंतर समर्पित रहूँगा—उनके प्रति, जिन पर पिता का प्रेम उँडेला गया है और जिनके बीच कोई अभाव नहीं है।


    यही वे हैं जो सत्य में प्रकट हुए हैं। वे सच्चे जीवन में विद्यमान हैं और उस ज्योति के विषय में बोलते हैं जो पूर्ण है, पिता के बीज से भरी है, और उसके हृदय तथा परिपूर्णता[b] में है। उसकी आत्मा उसमें आनन्दित होती है और उस व्यक्ति की महिमा करती है जिसमें वह विद्यमान है, क्योंकि वह भला है। उसकी संतानें भी पूर्ण हैं और उसके नाम के योग्य हैं, क्योंकि वही पिता है। ऐसी ही संतानों से वह प्रेम करता है।


    [… पांडुलिपि में बड़ा रिक्तांश …][c]


    फिर भी कुछ लोग ऐसे हैं जिनके विचार परिश्रम में लगे रहते हैं। खोजते-खोजते वे मतवाले हो जाते हैं और अपनी समझ खो बैठते हैं। पर पवित्र जन वे हैं जिनका विचार दुष्टता से दूषित नहीं हुआ; उनका विचार उनके भीतर बना रहता है। क्योंकि विचार का लोगोस[d] जो ऊपर है उसकी खोज करता है—उसकी अकथनीयता को मैंने सबके मुख के द्वारा [वहन किया/कहा] है: भला—मसीह[e]।'
