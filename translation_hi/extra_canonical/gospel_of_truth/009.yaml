- source_word: ⲟⲉⲓⲛ / ⲡⲟⲩⲁⲉⲓⲛ
  choice: ज्योति
  rationale: यहाँ प्रकाश को उद्धार देने वाली सजीव सत्ता के रूप में प्रस्तुत किया गया है; ‘ज्योति’ साधारण पाठक के लिए बोधगम्य रहते हुए इस धार्मिक भार को बनाए रखता है।
- source_word: ⲡϣⲉϫⲉ
  choice: वचन
  rationale: संदर्भ में यह केवल बोली हुई बात नहीं, पिता के भीतर से प्रकट पूर्ण रहस्योद्घाटन है; इसलिए ‘वचन’ उपयुक्त है।
- source_word: ⲁⲧⲉⲙⲁϩⲧⲉ
  choice: जिसे किसी सीमा में बाँधा नहीं जा सकता
  rationale: मूल में पकड़ने या थामने की असमर्थता है। स्वाभाविक हिन्दी में यह पिता की असीमता और अग्रहणीयता दोनों व्यक्त करता है।
- source_word: ⲧⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: अविनाशिता
  rationale: यह नाश या क्षय से परे होने का गुण है; अगली क्रिया ‘पकड़ में नहीं आती’ मूल की अग्रहणीयता को भी सुरक्षित रखती है।
- source_word: ⲥⲁⲩⲛⲉ
  choice: ज्ञान
  rationale: तकनीकी उद्धारकारी अर्थ को सहज हिन्दी में व्यक्त करता है; विदेशी शब्द ‘ग्नोसिस’ से बचा गया है।
- source_word: ⲡⲗⲁⲛⲏ
  choice: भ्रांति
  rationale: मूल में भटकाने वाली दशा या सक्रिय शक्ति दोनों की संभावना है; ‘भ्रांति’ इस अर्थ-विस्तार को बनाए रखती है।
