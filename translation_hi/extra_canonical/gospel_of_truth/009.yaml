    उसने नई बातें कहीं। उसने पिता के हृदय में जो है उसे प्रकट किया और पूर्ण वचन को सामने लाया। जब ज्योति ने उसके मुख से कहा और उसकी वाणी ने जीवन को जन्म दिया, तब उसने उन्हें विचार, समझ, दया, उद्धार और सामर्थ्य का आत्मा दिया—ये सब पिता की असीमता और मधुरता से आए।


