  revised_text: 'भूल पिता से प्रकट नहीं हुई थी; वह पिता का कोई विचार नहीं थी। भूल पिता से उत्पन्न नहीं हुई—फिर भी वह उसके कारण उत्पन्न हुई थी।[a] उसके भीतर जो उत्पन्न होता है, वह ज्ञान है। वह इसलिए प्रकट किया गया कि भूल मिट जाए और पिता को जाना जाए। भूल इसलिए उत्पन्न हुई कि पिता को जाना नहीं गया था; इसलिए, जब पिता को जाना जाएगा, तब भूल फिर नहीं रहेगी।


    यही उस खोजे जानेवाले का सुसमाचार है। पिता की करुणाओं के द्वारा यह उन लोगों पर प्रकट किया गया जो पूर्ण किए गए हैं—वह छिपा हुआ रहस्य, यीशु मसीह। उसने भूल के कारण अंधकार में पड़े लोगों को प्रकाश दिया। उसने उन्हें प्रकाश दिया और मार्ग दिखाया; और वह मार्ग वह सत्य है जिसकी उसने उन्हें शिक्षा दी।


    इस कारण भूल उस पर क्रोधित हुई। उसने उसे सताया, उसके कारण व्याकुल हुई और निष्प्रभावी कर दी गई। उसे एक वृक्ष पर कीलों से जड़ा गया,[b] और वह पिता के ज्ञान का फल बन गया। जिन्होंने उसे खाया, उनके लिए वह विनाश का कारण नहीं बना; बल्कि वे उसे अपने भीतर पाकर आनन्दित हुए। उसने उन्हें अपने भीतर पाया, और उन्होंने उसे अपने भीतर पाया।


    जहाँ तक उस अगम और अचिंत्य पिता का प्रश्न है—वह वही है जिसने समस्तता को अपने भीतर सिद्ध किया है। समस्तता उसके भीतर है, और समस्तता को उसी की आवश्यकता है। उसने उनकी सिद्धता अपने भीतर सँभाल रखी थी, क्योंकि उसने उसे समस्तता को अभी दिया नहीं था। फिर भी पिता ईर्ष्यालु नहीं था। उसके और उसके अपने अंगों के बीच ईर्ष्या कैसे हो सकती थी?'
