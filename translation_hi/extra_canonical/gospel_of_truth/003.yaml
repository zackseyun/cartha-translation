  text: 'पिता उनकी पूर्णता को अपने भीतर धारण किए हुए है, ताकि वह उन्हें विश्राम और ज्ञान दे—उस पूर्णता में जिसे उसने बनाया है। उसी ने समग्रता[a] को बनाया है; समग्रता उसके भीतर है और समग्रता को उसकी आवश्यकता है। वह उनकी पूर्णता को अपने भीतर रखता है, जिसे उसने सबको नहीं दिया। फिर भी पिता ईर्ष्यालु नहीं था; क्योंकि उसके और उसके अंगों के बीच कैसी ईर्ष्या हो सकती थी? यदि समग्रता ने इस प्रकार वह पूर्णता पा ली होती, तो वे पिता के पास नहीं आ सकते थे। वह उसे उनके लिए अपने भीतर रखता है, ताकि उन्हें दे और वे एकीकृत ज्ञान में, पूर्णता में, उसकी ओर लौट आएँ।


    वह उस व्यक्ति के समान है जो अपरिचित है, फिर भी चाहता है कि लोग उसे जानें और उससे प्रेम करें; क्योंकि पिता के ज्ञान के सिवा समग्रता को और किस बात की आवश्यकता थी?


    वह मार्गदर्शक बना—शांत और निश्चिंत। वह शिक्षा के स्थानों में आया और शिक्षक के रूप में वचन बोला। जो अपने हृदय में स्वयं को बुद्धिमान समझते थे, वे उसकी परीक्षा लेने उसके पास आए; पर उसने उन्हें लज्जित कर दिया, क्योंकि वे व्यर्थ थे। उन्होंने उससे घृणा की, क्योंकि वे सत्य में बुद्धिमान नहीं थे। उन सबके बाद छोटे बच्चे भी उसके पास आए; पिता का ज्ञान उन्हीं का है। जब वे सामर्थी हुए, तो उन्होंने पिता के वचनों के विषय में शिक्षा पाई। उन्होंने जाना और वे जाने गए; उन्होंने महिमा पाई और महिमा दी। उनके हृदयों में जीवितों की जीवित पुस्तक प्रकट हुई। वह पिता के विचार और मन में, समग्रता की नींव से पहले, उसकी अगम्यता के भीतर लिखी हुई थी—ऐसी पुस्तक जिसे लेने की सामर्थ्य किसी में नहीं है, क्योंकि जो उसे लेगा उसके मारे जाने का विधान है। जिन लोगों को उद्धार सौंपा गया था, उनमें कोई भी तब तक प्रकट नहीं हो सकता था, जब तक वह पुस्तक प्रकट न होती।


    इसी कारण दयालु और विश्वासयोग्य यीशु ने धीरज से दुःख सहा, जब तक उसने वह पुस्तक ग्रहण न कर ली; क्योंकि वह जानता है कि उसकी मृत्यु बहुतों के लिए जीवन है। जब तक वसीयतनामा[b] नहीं खोला जाता, तब तक मर चुके गृहस्वामी की संपत्ति छिपी रहती है। इसी प्रकार, जब सबका पिता अदृश्य था, तब सब कुछ छिपा हुआ था; क्योंकि वे उसी से हैं, जिससे हर अधिपत्य निकलता है। इसी कारण यीशु प्रकट हुआ; उसने उस पुस्तक को धारण किया; उसे काठ पर कीलों से जड़ा गया; और उसने क्रूस पर पिता की आज्ञा प्रकाशित कर दी।[c]


    ओह, कैसी महान शिक्षा! वह स्वयं को मृत्यु तक नीचे ले गया; उसने अपने को अनन्त जीवन से आवृत किया। उसने नाशवान चिथड़े उतार दिए और अविनाशिता धारण कर ली, जिसे कोई उससे छीन नहीं सकता। जब वह आतंक के सूने क्षेत्रों में प्रवेश किया, तो वह उन लोगों के बीच से होकर गुज़रा जिन्हें विस्मृति ने निर्वस्त्र कर दिया था। वह ज्ञान और पूर्णता होकर, हृदय में जो बातें हैं उनकी घोषणा उन लोगों को कर रहा था जो शिक्षा पाने के लिए तैयार हैं।


    वह शिक्षा देता है उन लोगों को जो शिक्षा ग्रहण करेंगे। ये वे जीवित लोग हैं जिनका नाम जीवितों की पुस्तक में लिखा है। वे अपने-अपने लिए शिक्षा पाते हैं; वे उसे पिता से ग्रहण करते हैं और फिर उसकी ओर लौटते हैं। क्योंकि समग्रता की पूर्णता पिता में है, इसलिए समग्रता का उसके पास ऊपर जाना आवश्यक है। तब प्रत्येक वह पाता है जो उसका अपना है और उसे अपनी ओर खींच लेता है। जो अज्ञान में है, उसमें कमी है; और उसकी कमी बड़ी है, क्योंकि उसे उस वस्तु की कमी है जो उसे पूर्ण करेगी। चूँकि समग्रता की पूर्णता पिता में है, इसलिए समग्रता का उसके पास ऊपर जाना आवश्यक है। जब प्रत्येक अपना पाता है, तब वे जिनको उसने पहले से जाना, उनके लिए तैयार किए गए कि वे उसके पास से निकलें। जिनके नाम उसने पहले से जाने, अंत में वे बुलाए गए। जिसे पिता ने अपना नाम प्रकट किया है, वही ज्ञानवान है। जिसका नाम नहीं पुकारा गया, वह अज्ञानी है। भला कोई उस व्यक्ति को कैसे सुन सकता है जिसका नाम पुकारा ही नहीं गया? जो अंत तक अज्ञानी रहता है, वह विस्मृति की रचना है और उसी के साथ नष्ट हो जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘समग्रता’ कॉप्टिक ⲡⲧⲏⲣϥ का अनुवाद है। यह प्रसंग में केवल ‘सब लोग’ नहीं, बल्कि समूचे अस्तित्व अथवा ‘सब-कुछ’ के वैचारिक अर्थ में भी प्रयुक्त है।
    reason: तकनीकी पद के व्यापक अर्थ को स्पष्ट करने के लिए।
  - marker: b
    text: यूनानी मूल के इस शब्द का अर्थ ‘वसीयतनामा’, ‘वाचा’ या ‘व्यवस्था’ हो सकता है। मृत गृहस्वामी की संपत्ति के उदाहरण में कानूनी ‘वसीयतनामा’ का अर्थ उपयुक्त है।
    reason: बहुअर्थी कानूनी-धार्मिक पद की प्रसंगगत व्याख्या के लिए।
  - marker: c
    text: मूल पाठ में यीशु को पहले ‘काठ/वृक्ष’ पर कीलों से जड़े जाने और फिर क्रूस पर पिता की आज्ञा प्रकाशित करने की अलग-अलग छवियों से जोड़ा गया है।
    reason: दो संबद्ध लेकिन भिन्न मूल छवियों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ⲡⲧⲏⲣϥ
  choice: समग्रता
  rationale: यह साधारण ‘सब’ और वैचारिक ‘the All’ दोनों अर्थों को वहन करता है; ‘समग्रता’ पाठ के तकनीकी, समावेशी अर्थ को हिन्दी में स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: ⲥⲁⲩⲛⲉ
  choice: ज्ञान
  rationale: रचना का केंद्रीय शब्द है; ‘ज्ञान’ सामान्य पाठक के लिए स्पष्ट है और तकनीकी अर्थ को भी ग्रहण कर सकता है।
- source_word: ⲥⲧⲟⲩⲱⲣⲁⲩ
  choice: विश्राम
  rationale: उद्धारकारी repose/rest के भाव को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ϫⲱⲕ
  choice: पूर्णता
  rationale: इस अंश में शब्द पूर्ण होने, पूर्ण करने और समग्रता की पूर्णता के बारंबार शब्द-खेल का भाग है; ‘देह’ करने से यह संबंध टूट जाता।
- source_word: ⲡⲓϫⲱⲱⲙⲉ
  choice: पुस्तक
  rationale: ‘जीवित पुस्तक’ के आवर्ती प्रतीक के लिए सबसे सीधा और प्रचलित रूप।
- source_word: ⲙⲉⲉⲩⲉ / ⲛⲟⲩⲥ
  choice: विचार / मन
  rationale: दो अलग, साथ रखे हुए मानसिक पदों का समानांतर भेद बनाए रखता है।
- source_word: ⲇⲓⲁⲑⲏⲕⲏ
  choice: वसीयतनामा
  rationale: मृत गृहस्वामी और छिपी संपत्ति का कानूनी उत्तराधिकार-संदर्भ ‘वाचा’ की अपेक्षा ‘वसीयतनामा’ को माँगता है।
- source_word: ⲇⲓⲁⲧⲁⲅⲙⲁ
  choice: राजाज्ञा
  rationale: पिता के औपचारिक आदेश/घोषणा का प्रशासनिक भाव रखता है और आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ⲡⲗⲁⲥⲙⲁ
  choice: रचना
  rationale: विस्मृति से गढ़े या निर्मित अस्तित्व का भाव रखता है, बिना उसकी प्रकृति को जरूरत से अधिक परिभाषित किए।
theological_decisions:
- issue: ⲡⲧⲏⲣϥ का तात्त्विक अर्थ
  choice: समग्रता
  alternative: सब कुछ / विश्व
  rationale: ‘विश्व’ इसे केवल ब्रह्मांडीय बना देता, जबकि पाठ में यह पिता से निकले सभी अस्तित्वों की सामूहिक पूर्णता भी सूचित करता है।
- issue: पुस्तक लेने वाले की मृत्यु
  choice: ‘यह ठहराया गया है कि जो उसे ले, वह मार डाला जाए’
  alternative: पुस्तक स्वयं लेने वाले को मारती है
  rationale: कॉप्टिक निष्क्रिय विधान और कर्ता की अस्पष्टता को बनाए रखा गया; मृत्यु का कर्ता नहीं जोड़ा गया।
- issue: यीशु का पुस्तक को ‘पहनना’
  choice: पुस्तक को धारण किया
  alternative: पुस्तक पहन ली
