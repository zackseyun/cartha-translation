  revised_text: 'पिता उनकी पूर्णता को अपने भीतर धारण किए हुए है, ताकि वह उन्हें विश्राम और ज्ञान दे—उस पूर्णता में जिसे उसने बनाया है। उसी ने समग्रता[a] को बनाया है; समग्रता उसके भीतर है और समग्रता को उसकी आवश्यकता है। वह उनकी पूर्णता को अपने भीतर रखता है, जिसे उसने सबको नहीं दिया। फिर भी पिता ईर्ष्यालु नहीं था; क्योंकि उसके और उसके अंगों के बीच कैसी ईर्ष्या हो सकती थी? यदि समग्रता ने इस प्रकार वह पूर्णता पा ली होती, तो वे पिता के पास नहीं आ सकते थे। वह उसे उनके लिए अपने भीतर रखता है, ताकि उन्हें दे और वे एकीकृत ज्ञान में, पूर्णता में, उसकी ओर लौट आएँ।


    वह उस व्यक्ति के समान है जो अपरिचित है, फिर भी चाहता है कि लोग उसे जानें और उससे प्रेम करें; क्योंकि पिता के ज्ञान के सिवा समग्रता को और किस बात की आवश्यकता थी?


    वह मार्गदर्शक बना—शांत और निश्चिंत। वह शिक्षा के स्थानों में आया और शिक्षक के रूप में वचन बोला। जो अपने हृदय में स्वयं को बुद्धिमान समझते थे, वे उसकी परीक्षा लेने उसके पास आए; पर उसने उन्हें लज्जित कर दिया, क्योंकि वे व्यर्थ थे। उन्होंने उससे घृणा की, क्योंकि वे सत्य में बुद्धिमान नहीं थे। उन सबके बाद छोटे बच्चे भी उसके पास आए; पिता का ज्ञान उन्हीं का है। जब वे सामर्थी हुए, तो उन्होंने पिता के वचनों के विषय में शिक्षा पाई। उन्होंने जाना और वे जाने गए; उन्होंने महिमा पाई और महिमा दी। उनके हृदयों में जीवितों की जीवित पुस्तक प्रकट हुई। वह पिता के विचार और मन में, समग्रता की नींव से पहले, उसकी अगम्यता के भीतर लिखी हुई थी—ऐसी पुस्तक जिसे लेने की सामर्थ्य किसी में नहीं है, क्योंकि जो उसे लेगा उसके मारे जाने का विधान है। जिन लोगों को उद्धार सौंपा गया था, उनमें कोई भी तब तक प्रकट नहीं हो सकता था, जब तक वह पुस्तक प्रकट न होती।


    इसी कारण दयालु और विश्वासयोग्य यीशु ने धीरज से दुःख सहा, जब तक उसने वह पुस्तक ग्रहण न कर ली; क्योंकि वह जानता है कि उसकी मृत्यु बहुतों के लिए जीवन है। जब तक वसीयतनामा[b] नहीं खोला जाता, तब तक मर चुके गृहस्वामी की संपत्ति छिपी रहती है। इसी प्रकार, जब सबका पिता अदृश्य था, तब सब कुछ छिपा हुआ था; क्योंकि वे उसी से हैं, जिससे हर अधिपत्य निकलता है। इसी कारण यीशु प्रकट हुआ; उसने उस पुस्तक को धारण किया; उसे काठ पर कीलों से जड़ा गया; और उसने क्रूस पर पिता की आज्ञा प्रकाशित कर दी।[c]


    ओह, कैसी महान शिक्षा! वह स्वयं को मृत्यु तक नीचे ले गया; उसने अपने को अनन्त जीवन से आवृत किया। उसने नाशवान चिथड़े उतार दिए और अविनाशिता धारण कर ली, जिसे कोई उससे छीन नहीं सकता। जब वह आतंक के सूने क्षेत्रों में प्रवेश किया, तो वह उन लोगों के बीच से होकर गुज़रा जिन्हें विस्मृति ने निर्वस्त्र कर दिया था। वह ज्ञान और पूर्णता होकर, हृदय में जो बातें हैं उनकी घोषणा उन लोगों को कर रहा था जो शिक्षा पाने के लिए तैयार हैं।


    वह शिक्षा देता है उन लोगों को जो शिक्षा ग्रहण करेंगे। ये वे जीवित लोग हैं जिनका नाम जीवितों की पुस्तक में लिखा है। वे अपने-अपने लिए शिक्षा पाते हैं; वे उसे पिता से ग्रहण करते हैं और फिर उसकी ओर लौटते हैं। क्योंकि समग्रता की पूर्णता पिता में है, इसलिए समग्रता का उसके पास ऊपर जाना आवश्यक है। तब प्रत्येक वह पाता है जो उसका अपना है और उसे अपनी ओर खींच लेता है। जो अज्ञान में है, उसमें कमी है; और उसकी कमी बड़ी है, क्योंकि उसे उस वस्तु की कमी है जो उसे पूर्ण करेगी। चूँकि समग्रता की पूर्णता पिता में है, इसलिए समग्रता का उसके पास ऊपर जाना आवश्यक है। जब प्रत्येक अपना पाता है, तब वे जिनको उसने पहले से जाना, उनके लिए तैयार किए गए कि वे उसके पास से निकलें। जिनके नाम उसने पहले से जाने, अंत में वे बुलाए गए। जिसे पिता ने अपना नाम प्रकट किया है, वही ज्ञानवान है। जिसका नाम नहीं पुकारा गया, वह अज्ञानी है। भला कोई उस व्यक्ति को कैसे सुन सकता है जिसका नाम पुकारा ही नहीं गया? जो अंत तक अज्ञानी रहता है, वह विस्मृति की रचना है और उसी के साथ नष्ट हो जाएगा।'
