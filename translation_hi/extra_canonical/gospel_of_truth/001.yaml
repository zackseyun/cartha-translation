base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/001.yaml
  text: The Gospel of Truth is joy for those who have received grace from the Father of Truth[a], so that they might know him through the power of the Word that came forth from the Pleroma—the one who is in the thought and the mind of the Father. He is called “Savior”; that is the name of the work he will do to save those who had become ignorant of the Father. And the name “Gospel” is the revelation of hope, the discovery for those who seek him.
translation:
  language: hi
  text: सत्य का सुसमाचार उन लोगों के लिए आनंद है जिन्होंने सत्य के पिता से अनुग्रह पाया है, ताकि वे उस वचन की सामर्थ्य के द्वारा उसे जानें जो पूर्णता[a] से निकला—वही जो पिता के विचार और मन में है। उसे “उद्धारकर्ता” कहा जाता है; यह उस कार्य का नाम है जिसे वह उन लोगों को बचाने के लिए करेगा जो पिता से अनजान हो गए थे। और “सुसमाचार” नाम आशा का प्रकट होना है—उसे खोजने वालों के लिए उसकी खोज।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में यूनानी ऋणशब्द ‘प्लेरोमा’ है, जिसका अर्थ ‘पूर्णता’ है; यहाँ यह दैवी पूर्णता के लिए तकनीकी पद भी हो सकता है।
    reason: तकनीकी धार्मिक पद का अर्थ और उसका विशिष्ट प्रयोग दोनों सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: सुसमाचार
  rationale: यूनानी ऋणशब्द εὐαγγέλιον यहाँ उद्घोषणा और उसके नाम दोनों के रूप में प्रयुक्त है; ‘सुसमाचार’ आधुनिक हिन्दी में स्वाभाविक और पारंपरिक समतुल्य है।
- source_word: ⲧⲙⲏⲉ
  choice: सत्य
  rationale: मूल कॉप्टिक का सीधा और प्रसंगानुकूल अर्थ।
- source_word: ⲭⲁⲣⲓⲥ (opening formula)
  choice: अनुग्रह
  rationale: प्राप्त कृपा/अनुकूलता का धार्मिक भार बनाए रखते हुए हिन्दी में प्रचलित अर्थ देता है।
- source_word: ⲡⲓⲱⲧ
  choice: पिता
  rationale: दैवी उपाधि का सीधा और निरंतर अनुवाद।
- source_word: ⲧϭⲁⲙ
  choice: सामर्थ्य
  rationale: यहाँ जानने को प्रभावी बनाने वाली शक्ति का भाव है; ‘सामर्थ्य’ गरिमापूर्ण और स्वाभाविक है।
- source_word: ⲡⲥⲁϫⲉ
  choice: वचन
  rationale: सामान्य अर्थ ‘शब्द’ है, पर यहाँ पूर्णता से निकलने और पिता के विचार में होने के कारण व्यक्तिवाची धार्मिक संकेत है; ‘वचन’ उस तनाव को बिना ‘लोगोस’ थोपे रखता है।
- source_word: ⲡⲡⲗⲏⲣⲱⲙⲁ
  choice: पूर्णता
  rationale: यूनानी πλήρωμα के मूल अर्थ को हिन्दी पाठक के लिए समझने योग्य रखता है; तकनीकी प्रयोग पादटिप्पणी में बताया गया है।
- source_word: ⲛⲟⲩⲥ and paired cognitive term
  choice: विचार और मन
  rationale: पिता से जुड़े दो भिन्न मानसिक पदों को एक में मिलाए बिना स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ⲡⲥⲱⲧⲏⲣ
  choice: उद्धारकर्ता
  rationale: σωτήρ की स्पष्ट उपाधि और उसके बचाने वाले कार्य के बीच संबंध बनाए रखता है।
- source_word: ⲟⲩⲱⲛϩ ⲃⲁⲗ
  choice: प्रकट होना
  rationale: शाब्दिक ‘खुलना’ के प्रकटीकरण-संबंधी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ⲕⲱⲧⲉ ⲛⲥⲱϥ
  choice: उसे खोजना
  rationale: सक्रिय तलाश का भाव संक्षेप और स्वाभाविक ढंग से देता है।
