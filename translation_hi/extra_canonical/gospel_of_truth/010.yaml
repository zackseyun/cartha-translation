    text: यह संकेत प्राचीन उँगली-गणना की उस पद्धति की ओर है जिसमें निन्यानवे बाएँ हाथ पर और एक सौ दाएँ हाथ पर दर्शाया जाता था।
    reason: आधुनिक पाठक के लिए बाएँ से दाएँ हाथ जाने वाली संख्या-छवि अन्यथा अस्पष्ट हो सकती है।
  - marker: b
