    पिता ने अपना अंतरतम प्रकट किया; उसका अंतरतम पवित्र आत्मा है। उसने अपने भीतर छिपे हुए को प्रकट किया; उसके भीतर छिपा हुआ उसका पुत्र है। यह इसलिए हुआ कि पिता की करुणा के द्वारा एओन[b] उसे जानें, पिता को खोजने के अपने परिश्रम से विराम लें और उसमें विश्राम करें, क्योंकि वे जानते हैं कि यही विश्राम है।


    पिता ने अभाव को भर दिया और उसके प्रकट रूप को मिटा दिया—उसका प्रकट रूप यह संसार है, जिसमें वह काम करता रहा। क्योंकि जहाँ ईर्ष्या और कलह हैं, वहाँ अभाव है; पर जहाँ एकता है, वहाँ पूर्णता है। अभाव इसलिए अस्तित्व में आया कि पिता को जाना नहीं गया था। इसलिए जब पिता जाना जाएगा, तब से अभाव नहीं रहेगा। जैसे किसी व्यक्ति का अज्ञान ज्ञान आने पर मिट जाता है, और जैसे प्रकाश प्रकट होने पर अंधकार मिट जाता है, वैसे ही पूर्णता के द्वारा अभाव भी मिट जाता है। तब से उसका प्रकट रूप फिर दिखाई नहीं देगा, बल्कि वह एकता के सामंजस्य में विलीन हो जाएगा।


