    जब प्रकाश उस आतंक पर पड़ता है जिसे उन्होंने ग्रहण किया था, तो वह कुछ भी नहीं निकलता। इसी प्रकार वे पिता से अनजान थे, क्योंकि उन्होंने उसे देखा नहीं था। वहाँ आतंक, खलबली, अस्थिरता, विभाजन और संदेह था; उनके बीच बहुत-से खोखले भ्रम और व्यर्थ शून्यता काम कर रहे थे—मानो वे गहरी नींद में डूबे हों और सपनों में अपने को दुःस्वप्नों के बीच पाएँ।


    कभी वे किसी जगह की ओर भाग रहे होते हैं, तो कभी किसी से बचकर भाग नहीं पाते; कभी वे लड़ रहे होते हैं, तो कभी पीटे जा रहे होते हैं; कभी वे ऊँचाई से गिरते हैं, तो कभी बिना पंखों के हवा में उड़ते हैं। कभी ऐसा भी होता है कि कोई उन्हें मार रहा है, यद्यपि कोई उनका पीछा नहीं कर रहा; या वे स्वयं अपने आस-पास के लोगों को मार रहे हैं और उनके लहू से लथपथ हैं। जब तक इन सब बातों से गुज़रनेवाले जाग नहीं जाते, वे कुछ भी नहीं देखते—क्योंकि ये बातें कुछ भी नहीं हैं।


    ऐसा ही उन लोगों के साथ है जिन्होंने अज्ञान को नींद की तरह उतार फेंका है। वे उसे कुछ नहीं मानते, और न उसके दूसरे कामों को वास्तविक मानते हैं; बल्कि उन्हें रात के सपने की तरह पीछे छोड़ देते हैं। वे पिता के ज्ञान को प्रकाश के समान मूल्यवान मानते हैं। जो अनजान थे, उन्होंने सोए हुओं की तरह व्यवहार किया; जो जान गए हैं, उन्होंने जागे हुओं की तरह व्यवहार किया।


    भला है वह जो लौटकर जाग उठता है![a] धन्य है वह जो अंधों की आँखें खोलता है!


    आत्मा उन्हें जीवित करने के लिए उनके पीछे दौड़ी। उसने भूमि पर पड़े हुए व्यक्ति को हाथ देकर उसके पैरों पर खड़ा किया, क्योंकि वह अभी तक उठा नहीं था। उसने उन्हें पिता का ज्ञान और पुत्र का प्रकाशन प्रदान किया; क्योंकि जब उन्होंने उसे देखा और उसकी बात सुनी, तब उसने उन्हें अपना स्वाद चखने और प्रिय पुत्र को थाम लेने दिया।'
