- source_word: ⲡϭⲁⲗ
  choice: नींद
  rationale: अज्ञान के लिए प्रयुक्त मूल रूपक को सीधे सुरक्षित रखता है।
- source_word: ⲛⲉⲉⲓ
  choice: सपने
  rationale: यहाँ सामान्य या भविष्यसूचक दर्शनों के बजाय निद्रा के सपने अभिप्रेत हैं।
