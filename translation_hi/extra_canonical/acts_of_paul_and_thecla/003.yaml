  revised_text: 'पौलुस और थेकला के काम — अध्याय 3


    3:1 तब थामिरिस ने कहा, “मेरे साथ मेरे घर चलो और कुछ खा-पीकर ताज़ा हो जाओ।” इसलिए वे एक बहुत भव्य भोज में गए, जहाँ दाखमधु बहुतायत में था और उत्तम भोजन का भरपूर प्रबंध था।


    3:2 उन्हें बहुतायत से सजी मेज़ पर बैठाया गया, और थामिरिस ने उन्हें खूब पीने को दिया, क्योंकि वह थेकला से प्रेम करता था और उससे विवाह करना चाहता था।


    3:3 तब थामिरिस ने कहा, “मैं चाहता हूँ कि तुम मुझे बताओ कि इस पौलुस की शिक्षाएँ क्या हैं, ताकि मैं उन्हें समझ सकूँ। मुझे थेकला की बड़ी चिंता है, क्योंकि वह उस परदेशी की बातों में इतना आनंद लेती है कि मुझे डर है कि मैं उस युवती को खो न दूँ, जिससे मैं विवाह करना चाहता हूँ।”


