  text: '3:1 Then Thamyris said, “Come with me to my house and refresh yourselves.” So they went to a very splendid banquet, where there was abundant wine and very rich food.


    3:2 They were brought to a richly spread table, and Thamyris gave them plenty to drink because of his love for Thecla and his desire to marry her.


    3:3 Then Thamyris said, “I want you to tell me what this Paul’s teachings are so that I may understand them. I am deeply concerned about Thecla, since she takes such delight in that stranger’s words that I am in danger of losing the woman I intend to marry.”


    3:4 Then Demas and Hermogenes answered together, “Have him brought before the governor Castillius as someone who is trying to persuade the people to adopt the new religion of the Christians. Then the governor, in accordance with Caesar’s decree, will put him to death, and in this way you will obtain your wife.


    3:5 “At the same time, we will teach her that the resurrection he speaks about has already come and consists in our having children, and that we rose again when we came to the knowledge of God.”


    3:6 When Thamyris heard this account from them, he was filled with burning resentment.


    3:7 Early the next morning, he got up and went to the house of Onesiphorus, accompanied by the magistrates, the jailer, and a great crowd of people carrying clubs. He said to Paul,


    3:8 “You have led the city of Iconium astray, including Thecla, who is betrothed to me, so that now she will not marry me. Therefore, you must come with us to the governor Castillius.”


    3:9 Then the whole crowd cried out, “Away with this impostor (magician)! He has led the minds of our wives astray, and all the people listen to him.”'
translation:
  language: hi
  text: 'पौलुस और थेकला के काम — अध्याय 3


    3:1 तब थामिरिस ने कहा, “मेरे साथ मेरे घर चलो और कुछ खा-पीकर ताज़ा हो जाओ।” इसलिए वे एक बहुत भव्य भोज में गए, जहाँ दाखमधु बहुतायत में था और उत्तम भोजन का भरपूर प्रबंध था।


    3:2 उन्हें सजी हुई भरपूर मेज़ पर बैठाया गया, और थामिरिस ने उन्हें खूब पिलाया, क्योंकि वह थेकला से प्रेम करता था और उससे विवाह करना चाहता था।


    3:3 तब थामिरिस ने कहा, “मैं चाहता हूँ कि तुम मुझे बताओ कि इस पौलुस की शिक्षाएँ क्या हैं, ताकि मैं उन्हें समझ सकूँ। मुझे थेकला की बड़ी चिंता है, क्योंकि वह उस परदेशी की बातों से इतनी प्रसन्न होती है कि मुझे डर है, जिससे मैं विवाह करना चाहता हूँ उसे कहीं खो न दूँ।”


    3:4 तब देमास और हेरमोगेनेस ने एक साथ उत्तर दिया, “उसे राज्यपाल कास्तिलियुस के सामने इस आरोप में ले जाओ कि वह लोगों को मसीहियों के नए धर्म को अपनाने के लिए उकसा रहा है। तब राज्यपाल कैसर के आदेश के अनुसार उसे मृत्युदंड दे देगा, और इस प्रकार तुम्हें अपनी पत्नी मिल जाएगी।


    3:5 “इसी बीच हम उसे सिखाएँगे कि जिस पुनरुत्थान की वह बात करता है, वह पहले ही हो चुका है और वह हमारे संतान उत्पन्न करने में निहित है; और जब हमने परमेश्वर को जाना, तभी हम फिर जी उठे।”


    3:6 उनसे यह बात सुनकर थामिरिस क्रोध से भड़क उठा।


    3:7 अगली सुबह वह जल्दी उठा और अधिकारियों, बंदीगृह के रक्षक तथा लाठियाँ लिए लोगों की एक बड़ी भीड़ के साथ उनेसिफोरुस के घर गया। उसने पौलुस से कहा,


    3:8 “तुमने इकोनियुम नगर को भटका दिया है, और थेकला को भी, जिसकी मंगनी मुझसे हुई है; इसलिए अब वह मुझसे विवाह नहीं करेगी। अतः तुम्हें हमारे साथ राज्यपाल कास्तिलियुस के पास चलना होगा।”


    3:9 तब सारी भीड़ चिल्ला उठी, “इस धोखेबाज़[a] को यहाँ से ले जाओ! इसने हमारी पत्नियों के मन भटका दिए हैं, और सब लोग इसकी बात सुनते हैं।”


    [a] या “जादूगर।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जादूगर।”
    reason: आपूर्त सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य में “imposter (magician)” का विकल्प है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण वास्तविक अस्पष्टता सुरक्षित रखी गई।
lexical_decisions:
- source_word: refresh yourselves
  choice: कुछ खा-पीकर ताज़ा हो जाओ
  rationale: भोज के प्रसंग में केवल विश्राम नहीं, आतिथ्य से ताज़गी पाने का स्वाभाविक आधुनिक हिन्दी भाव व्यक्त करता है।
- source_word: doctrines
  choice: शिक्षाएँ
  rationale: सामान्य पाठक के लिए स्वाभाविक है और किसी विकसित सांप्रदायिक धर्मशास्त्रीय तंत्र का अनावश्यक संकेत नहीं देता।
- source_word: resurrection
  choice: पुनरुत्थान
  rationale: मूल धार्मिक अवधारणा के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्दावली।
- source_word: rose again
  choice: फिर जी उठे
  rationale: पुनरुत्थान से शब्दगत संबंध बनाए रखते हुए वाक्य को सहज हिन्दी में रखता है।
- source_word: perverted / led astray
  choice: भटका दिया
  rationale: आरोपात्मक स्वर सुरक्षित रखता है, पर आधुनिक हिन्दी में अस्पष्ट या अत्यधिक कठोर शब्द से बचता है।
- source_word: imposter (magician)
  choice: धोखेबाज़; पादटिप्पणी में ‘जादूगर’
  rationale: आपूर्त अंग्रेज़ी साक्ष्य में दोनों पाठ/अर्थ दिए गए हैं; मुख्य पाठ पठनीय रखा गया और विकल्प सुरक्षित किया गया।
theological_decisions:
- issue: पुनरुत्थान की कथित पूर्ति
  choice: “वह पहले ही हो चुका है और वह हमारे संतान उत्पन्न करने में निहित है”
  alternative: इसे आध्यात्मिक पुनर्जन्म या वंश में जीवित रहने के रूप में स्पष्ट करना
  rationale: पाठ में देमास और हेरमोगेनेस का दावा जानबूझकर तनावपूर्ण है; अनुवाद ने उसकी व्याख्या या समर्थन किए बिना कथन को संरक्षित किया है।
- issue: “परमेश्वर को जानने” पर फिर जी उठना
  choice: “जब हमने परमेश्वर को जाना, तभी हम फिर जी उठे”
  alternative: “हमें नया जीवन मिला”
  rationale: पुनरुत्थान-संबंधी भाषा की प्रतिध्वनि बनाए रखने और उसके अर्थ को चुपचाप हल न करने के लिए अधिक औपचारिक अभिव्यक्ति चुनी गई।
- issue: “मसीहियों का नया धर्म”
  choice: वक्ता के आरोप के रूप में यथावत रखा
  alternative: “नया मार्ग” या “नया मत”
  rationale: साक्ष्य में उपस्थित बाहरी कानूनी-सामाजिक आरोप को सुरक्षित रखा गया; इसे लेखक की धर्मशास्त्रीय स्वीकृति नहीं बनाया गया।
