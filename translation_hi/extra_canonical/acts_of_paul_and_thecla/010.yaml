    **10:9** उसने अपनी माता के सामने ये और बहुत-सी बातें रखीं, [उसे अपने मत के लिए मनाने का प्रयत्न करते हुए]। पर उसकी माता थियोख्लिया ने शहीद थेक्ला[a] की कही हुई बातों पर विश्वास नहीं किया।


