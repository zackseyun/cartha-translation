    **10:14** वह [उस बादल के द्वारा][d] कालामोन अथवा रोदिओन नामक एक पहाड़ पर ले जाई गई। वहाँ वह बहुत वर्षों तक रही और शैतान की ओर से आने वाली बहुत-सी कठिन परीक्षाएँ सहती रही। मसीह से मिली सहायता के द्वारा उसने उन्हें उचित रीति से सहा।


    **10:15** अंत में, कुछ कुलीन स्त्रियों ने कुँवारी थेक्ला के विषय में सुना और उसके पास आईं। थेक्ला ने उन्हें परमेश्वर के वचन सिखाए, और उनमें से बहुतों ने संसार का त्याग कर उसके साथ मठवासी जीवन अपनाया[e]।


    **10:16** इस प्रकार थेक्ला की अच्छी ख्याति चारों ओर फैल गई, और वह अनेक [अद्भुत] चंगाइयाँ करती थी[f]। इसलिए पूरे नगर और आसपास के क्षेत्रों के लोग अपने रोगियों को उस पहाड़ पर लाने लगे। वे गुफा के द्वार तक पहुँच भी नहीं पाते थे कि उनके रोगी जिस किसी बीमारी से ग्रस्त होते, उससे तुरंत चंगे हो जाते थे।


    **10:17** अशुद्ध आत्माएँ शोर मचाती हुई निकाली जाती थीं। सबने अपने रोगियों को स्वस्थ पाया और परमेश्वर की महिमा की, जिसने कुँवारी थेक्ला को ऐसा सामर्थ्य दिया था।


