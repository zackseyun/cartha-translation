    **10:7** “हे प्रभु, इस घर के परमेश्वर, जिसमें तूने मुझे पहली बार ज्योति दी; हे यीशु, जीवित परमेश्वर के पुत्र, तू राज्यपाल के सामने मेरा सहायक था, आग में मेरा सहायक था और पशुओं के बीच मेरा सहायक था—केवल तू ही युगानुयुग परमेश्वर है। आमीन।”


