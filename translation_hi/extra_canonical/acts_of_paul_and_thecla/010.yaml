  text: '10:1 But Paul was greatly surprised when he saw her and the people with her, for he thought that some new trial was coming upon them.


    10:2 When Thecla realized this, she said to him, “I have been baptized, O Paul, for he who assists you in preaching has assisted me to baptize.”


    10:3 Then Paul took her and led her to the house of Hermes. Thecla told Paul everything that had happened to her in Antioch, so that Paul was exceedingly amazed, and all who heard were strengthened in the faith and prayed for Trifina’s happiness.


    10:4 Then Thecla arose and said to Paul, “I am going to Iconium.” Paul replied to her, “Go and teach the word of the Lord.”


    10:5 But Trifina had sent large sums of money to Paul, as well as clothing by the hands of Thecla, for the relief of the poor.


    10:6 So Thecla went to Iconium. When she came to the house of Onesiphorus, she fell to the floor where Paul had sat and preached. Mingling her tears with her prayers, she praised and glorified God with these words:


    10:7 “O Lord, the God of this house, in which I was first enlightened by you; O Jesus, Son of the living God, who were my helper before the governor, my helper in the fire, and my helper among the beasts—you alone are God forever and ever. Amen.”


    10:8 On her return, Thecla found Thamyris dead, but her mother still living. So she called her mother and said to her, “Theoclia, my mother, is it possible for you to be brought to believe that there is only one Lord God, who dwells in the heavens? If you desire great riches, God will give them to you through me. If you want your daughter again, here I am.”


    10:9 She presented these and many other things to her mother, [endeavouring] to persuade her [to her opinion]. But her mother, Theoclia, gave no credence to the things spoken by the martyr Thecla.


    10:10 When Thecla realized that she was speaking to no purpose, she marked her whole body with the sign [of the cross], left the house, and went to Daphine. When she arrived there, she went to the cave where she had found Paul with Onesiphorus, fell to the ground, and wept before God.


    10:11 After leaving there, she went to Seleucia and enlightened many in the knowledge of Christ.


    10:12 And a bright cloud guided her on her journey.


    10:13 After she arrived at Seleucia, she went to a place outside the city, about a furlong away, because she was afraid of the inhabitants, since they were worshipers of idols.


    10:14 And she was led [by the cloud] to a mountain called Calamon, or Rodeon. She remained there for many years and endured a great many grievous temptations from the devil. Through the assistance she received from Christ, she bore them in a fitting manner.


    10:15 At last, certain gentlewomen heard about the virgin Thecla and went to her. They were instructed by her in the oracles of God, and many of them abandoned this world and led a monastic life with her.


    10:16 In this way, a good report about Thecla spread everywhere, and she performed several [miraculous] cures. As a result, people from the whole city and the surrounding regions brought their sick to that mountain. Before they came as far as the door of the cave, they were instantly cured of whatever illness they had.


    10:17 The unclean spirits were cast out, making a noise. All received their sick restored to health and glorified God, who had bestowed such power on the virgin Thecla.


    10:18 Consequently, the physicians of Seleucia were no longer held in any regard and lost all the profit from their trade, because no one paid attention to them. At this they were filled with envy and began to devise what measures they might take against this servant of Christ.'
translation:
  language: hi
  text: '**पौलुस और थेक्ला के काम — अध्याय 10**


    **10:1** जब पौलुस ने थेक्ला और उसके साथ आए लोगों को देखा, तो उसे बहुत आश्चर्य हुआ, क्योंकि उसने सोचा कि उन पर कोई नई परीक्षा आनेवाली है।


    **10:2** यह समझकर थेक्ला ने उससे कहा, “हे पौलुस, मैंने बपतिस्मा पा लिया है; क्योंकि जिसने सुसमाचार सुनाने में तुम्हारी सहायता की, उसी ने बपतिस्मा पाने में मेरी भी सहायता की।”


    **10:3** तब पौलुस उसे अपने साथ हेरमेस के घर ले गया। थेक्ला ने पौलुस को वह सब बताया जो अन्ताकिया में उसके साथ हुआ था। यह सुनकर पौलुस को बहुत आश्चर्य हुआ; और जितनों ने यह सुना, वे विश्वास में दृढ़ हुए और उन्होंने त्रिफैना के कल्याण के लिए प्रार्थना की।


    **10:4** तब थेक्ला उठी और पौलुस से बोली, “मैं इकोनियुम जा रही हूँ।” पौलुस ने उससे कहा, “जाओ और प्रभु का वचन सिखाओ।”


    **10:5** त्रिफैना ने थेक्ला के हाथ पौलुस के लिए बहुत-सा धन और कपड़े भी भेजे थे, ताकि गरीबों की सहायता की जा सके।


    **10:6** इसलिए थेक्ला इकोनियुम गई। जब वह उनेसिफोरुस के घर पहुँची, तो उस स्थान पर भूमि पर गिर पड़ी जहाँ पौलुस ने बैठकर उपदेश दिया था। अपने आँसुओं को प्रार्थना में मिलाते हुए उसने इन शब्दों से परमेश्वर की स्तुति और महिमा की:


    **10:7** “हे प्रभु, इस घर के परमेश्वर, जिसमें तूने मुझे पहली बार ज्योति दी; हे यीशु, जीवित परमेश्वर के पुत्र, तू राज्यपाल के सामने मेरा सहायक था, आग में मेरा सहायक था और जंगली पशुओं के बीच मेरा सहायक था। केवल तू ही युगानुयुग परमेश्वर है। आमीन।”


    **10:8** लौटने पर थेक्ला ने पाया कि थामिरिस मर चुका था, पर उसकी माता जीवित थी। तब उसने अपनी माता को बुलाकर कहा, “मेरी माता थियोख्लिया, क्या तुम यह विश्वास कर सकती हो कि केवल एक प्रभु परमेश्वर है, जो स्वर्ग में वास करता है? यदि तुम बहुत धन चाहती हो, तो परमेश्वर मेरे द्वारा तुम्हें देगा; और यदि तुम अपनी बेटी को फिर पाना चाहती हो, तो देखो, मैं यहाँ हूँ।”


    **10:9** उसने अपनी माता को ये और ऐसी बहुत-सी बातें समझाकर मनाने का प्रयत्न किया। पर उसकी माता थियोख्लिया ने शहीद थेक्ला[a] की कही हुई बातों पर विश्वास नहीं किया।


    **10:10** जब थेक्ला ने समझ लिया कि उसके बोलने का कोई लाभ नहीं हो रहा, तो उसने अपने सारे शरीर पर [क्रूस का] चिह्न बनाया[b], घर छोड़ दिया और दाफ्ने चली गई। वहाँ पहुँचकर वह उस गुफा में गई जहाँ उसने पौलुस और उनेसिफोरुस को पाया था। वह भूमि पर गिर पड़ी और परमेश्वर के सामने रोई।


    **10:11** वहाँ से निकलकर वह सिलूकिया गई और उसने बहुतों को मसीह का ज्ञान देकर ज्योति दी।


    **10:12** यात्रा में एक उज्ज्वल बादल उसका मार्गदर्शन करता रहा।


    **10:13** सिलूकिया पहुँचने के बाद वह नगर से बाहर लगभग एक स्टेडियम[c] दूर एक स्थान पर गई। वह वहाँ के निवासियों से डरती थी, क्योंकि वे मूर्तियों की पूजा करते थे।


    **10:14** वह [उस बादल के द्वारा][d] कालामोन अथवा रोदिओन नामक पहाड़ पर पहुँचाई गई। वहाँ वह बहुत वर्षों तक रही और उसने शैतान की ओर से आनेवाली बहुत-सी कठिन परीक्षाएँ सहीं। मसीह से मिली सहायता के द्वारा उसने उनका उचित रीति से सामना किया।


    **10:15** अंत में, कुछ कुलीन स्त्रियों ने कुँवारी थेक्ला के विषय में सुना और वे उसके पास आईं। थेक्ला ने उन्हें परमेश्वर के वचन सिखाए। उनमें से बहुतों ने संसार का त्याग कर उसके साथ संयम और तपस्या का जीवन अपनाया[e]।


    **10:16** इस कारण थेक्ला की कीर्ति चारों ओर फैल गई। वह अनेक [अद्भुत] चंगाइयाँ करती थी[f], इसलिए पूरे नगर और आसपास के क्षेत्रों के लोग अपने रोगियों को उस पहाड़ पर लाने लगे। वे गुफा के द्वार तक पहुँच भी नहीं पाते थे कि उनके रोगी किसी भी बीमारी से तुरंत चंगे हो जाते थे।


    **10:17** अशुद्ध आत्माएँ शोर मचाती हुई निकल जाती थीं। सभी लोग अपने रोगियों को स्वस्थ पाकर ले जाते और परमेश्वर की महिमा करते थे, जिसने कुँवारी थेक्ला को ऐसा सामर्थ्य दिया था।


    **10:18** फलस्वरूप सिलूकिया के वैद्यों का कोई आदर नहीं रह गया और उनके व्यवसाय की सारी आय जाती रही, क्योंकि अब कोई उनकी ओर ध्यान नहीं देता था। इससे वे ईर्ष्या से भर गए और सोचने लगे कि मसीह की इस सेविका के विरुद्ध क्या किया जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “शहीद” शब्द थेक्ला की सम्मानसूचक उपाधि है और मसीह की साक्षी के अर्थ में प्रयुक्त हो सकता है; इस प्रसंग में उसकी मृत्यु नहीं हुई है।
    reason: आधुनिक हिन्दी में ‘शहीद’ सामान्यतः मृत्यु सूचित करता है, जबकि यहाँ उपाधि का व्यापक प्राचीन अर्थ संभव है।
  - marker: b
    text: “क्रूस का” शब्द उपलब्ध अंग्रेजी साक्ष्य में पुनःस्थापित पाठ के रूप में कोष्ठकों में है; मूल वाक्य का सीधा अर्थ “चिह्न बनाकर” भी हो सकता है।
    reason: पाठीय पुनःस्थापन और उसकी अनिश्चितता को प्रकट करना।
  - marker: c
    text: एक स्टेडियम प्राचीन दूरी-माप था, जो लगभग 185 मीटर के आसपास होता था; वास्तविक लंबाई स्थान और काल के अनुसार बदलती थी।
    reason: अपरिचित प्राचीन माप को समझाना।
  - marker: d
    text: “उस बादल के द्वारा” उपलब्ध साक्ष्य में पूरक शब्द हैं; कर्ता पिछले पद के उज्ज्वल बादल से अनुमानित है।
    reason: अनुवाद में जोड़े गए संबंध को मूल पाठ से अलग दिखाना।
  - marker: e
    text: उपलब्ध अंग्रेजी साक्ष्य में “मठवासी जीवन” है। यहाँ उत्तरकालीन संस्थागत अर्थ से बचते हुए उसे “संयम और तपस्या का जीवन” कहा गया है।
    reason: संभावित ऐतिहासिक अनाकालिकता से बचना और तपस्वी जीवन का मूल भाव रखना।
  - marker: f
    text: “अद्भुत” उपलब्ध साक्ष्य में पूरक शब्द के रूप में दिया गया है; मूल कथन केवल अनेक चंगाइयों का उल्लेख भी समझा जा सकता है।
    reason: संपादकीय पूर्ति को पारदर्शी रखना।
lexical_decisions:
- source_word: baptized / assisted me to baptize
  choice: मैंने बपतिस्मा पा लिया है… बपतिस्मा पाने में मेरी भी सहायता की
  rationale: वाक्य को आत्म-बपतिस्मा के स्पष्ट दावे में बदलने के बजाय उपलब्ध साक्ष्य की अस्पष्टता रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: enlightened
  choice: ज्योति दी
  rationale: दीक्षा, शिक्षा और आत्मिक प्रकाश—इन संभावित अर्थों को खुला रखने के लिए पारंपरिक रूपक बचाया गया है।
