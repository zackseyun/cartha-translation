  text: '8:1 When the people saw this, they said, “The judgments passed in this city are unjust.” But Thecla asked the governor for the favor that her chastity would not be violated, but preserved until she was thrown to the beasts.


    8:2 The governor then asked who would take her in. A very rich widow named Trifina, whose daughter had recently died, asked to have her in her care, and she began to treat Thecla in her house as her own daughter.


    8:3 At last the day came when the beasts were to be brought out for display. Thecla was brought to the amphitheater and put into a den containing an exceedingly fierce lioness, in the presence of a multitude of spectators.


    8:4 Trifina accompanied Thecla without showing any alarm, and the lioness licked Thecla’s feet. The written notice stating her crime read: “Sacrilege.” Then the woman cried out, “O God, the judgments of this city are unrighteous!”


    8:5 After the beasts had been displayed, Trifina took Thecla home with her, and they went to bed. And behold, Trifina’s dead daughter appeared to her mother and said, “Mother, regard the young woman Thecla as your daughter in my place. Ask her to pray for me, so that I may be transferred to a state of happiness.”


    8:6 Then Trifina said sorrowfully, “My daughter Falconilla has appeared to me and instructed me to receive you in her place. Therefore, Thecla, I ask you to pray for my daughter, so that she may be transferred to a state of happiness and to eternal life.”


    8:7 When Thecla heard this, she immediately prayed to the Lord and said, “O Lord God of heaven and earth, Jesus Christ, Son of the Most High, grant that her daughter Falconilla may live forever.” When Trifina heard this, she groaned again and said, “O unrighteous judgments! O senseless wickedness, that such a person should (again) be thrown to the beasts!”


    8:8 The next morning, at daybreak, Alexander came to Trifina’s house and said, “The governor and the people are waiting. Bring out the criminal.”


    8:9 But Trifina rushed at him so violently that he became frightened and ran away. Trifina was a member of the royal family. She expressed her sorrow in this way and said, “Alas! I have trouble in my house for two reasons, and there is no one who will relieve me—either in the loss of my daughter or in my inability to save Thecla. But now, O Lord God, be the helper of your servant Thecla.”


    8:10 While she was saying this, the governor sent one of his own officers to bring Thecla. Trifina took her by the hand and went with her, saying, “I went with Falconilla to her grave, and now I must go with Thecla to the beasts.”


    8:11 When Thecla heard this, she prayed with tears and said, “O Lord God, in whom I have placed my confidence and found refuge, reward Trifina for her compassion toward me and for preserving my chastity.”


    8:12 Then there was a great noise in the amphitheater. The beasts roared, and the people cried out, “Bring in the criminal!”


    8:13 But the woman cried out and said, “Let the whole city suffer for such crimes, and order all of us, O governor, to receive the same punishment. O unjust judgment! O cruel sight!”


    8:14 Others said, “Let the whole city be destroyed for this vile act. Kill us all, O governor! O cruel sight! O unrighteous judgment!”'
translation:
  language: hi
  text: '**पौलुस और तेकला के कार्य — अध्याय 8**


    **8:1** जब लोगों ने यह देखा, तो वे कहने लगे, “इस नगर में दिए जाने वाले निर्णय अन्यायपूर्ण हैं।” पर तेकला ने राज्यपाल से यह कृपा माँगी कि उसके शील का उल्लंघन न किया जाए, बल्कि उसे पशुओं के आगे फेंके जाने तक सुरक्षित रखा जाए।


    **8:2** तब राज्यपाल ने पूछा, “इसे अपने यहाँ कौन रखेगा?” इस पर त्रिफीना नाम की एक बहुत धनी विधवा ने, जिसकी बेटी हाल ही में मर गई थी, उसे अपनी देखरेख में रखने की अनुमति माँगी। वह अपने घर में तेकला के साथ अपनी बेटी जैसा व्यवहार करने लगी।


    **8:3** आखिर वह दिन आया जब पशुओं को प्रदर्शन के लिए बाहर लाया जाना था। दर्शकों की भारी भीड़ के सामने तेकला को रंगभूमि में लाकर एक बाड़े में डाल दिया गया, जिसमें एक अत्यंत हिंसक सिंहनी थी।


    **8:4** त्रिफीना बिना भय दिखाए तेकला के साथ गई, और सिंहनी ने तेकला के पैर चाटे। उसके अपराध की घोषणा करने वाली पट्टी पर लिखा था, “पवित्र वस्तुओं का अपमान।”[a] तब वह स्त्री पुकार उठी, “हे परमेश्वर! इस नगर के निर्णय अधर्मी हैं!”


    **8:5** पशुओं का प्रदर्शन हो चुकने के बाद त्रिफीना तेकला को अपने साथ घर ले गई, और वे सोने चली गईं। तभी देखो, त्रिफीना की मृत बेटी ने अपनी माँ को दर्शन देकर कहा, “माँ, इस युवती तेकला को मेरे स्थान पर अपनी बेटी मानो। उससे कहो कि वह मेरे लिए प्रार्थना करे, ताकि मुझे आनंद की दशा में पहुँचा दिया जाए।”[b]


    **8:6** तब त्रिफीना ने शोक भरे स्वर में कहा, “मेरी बेटी फाल्कोनिल्ला ने मुझे दर्शन देकर कहा है कि मैं तुम्हें उसके स्थान पर अपना लूँ। इसलिए, तेकला, मैं तुमसे विनती करती हूँ कि मेरी बेटी के लिए प्रार्थना करो, ताकि उसे आनंद की दशा और अनंत जीवन में पहुँचा दिया जाए।”


    **8:7** यह सुनते ही तेकला ने प्रभु से प्रार्थना की, “हे स्वर्ग और पृथ्वी के प्रभु परमेश्वर, यीशु मसीह, परमप्रधान के पुत्र, ऐसा कर कि उसकी बेटी फाल्कोनिल्ला सदा जीवित रहे।” यह सुनकर त्रिफीना फिर कराह उठी और बोली, “हाय, ये अधर्मी निर्णय! हाय, यह विवेकहीन दुष्टता! ऐसी स्त्री को फिर से पशुओं के आगे फेंका जाएगा!”[c]


    **8:8** अगले दिन पौ फटते ही अलेक्ज़ान्दर त्रिफीना के घर आया और बोला, “राज्यपाल और लोग प्रतीक्षा कर रहे हैं। अपराधिनी को बाहर लाओ।”


    **8:9** पर त्रिफीना इतने वेग से उसकी ओर झपटी कि वह डरकर भाग गया। त्रिफीना राजपरिवार की सदस्य थी। उसने अपना दुःख इन शब्दों में प्रकट किया: “हाय! मेरे घर में दोहरा दुःख है, और मुझे राहत देने वाला कोई नहीं—न मेरी बेटी की मृत्यु के दुःख में, न तेकला को बचा पाने में। पर अब, हे प्रभु परमेश्वर, अपनी सेविका तेकला का सहायक हो।”


    **8:10** जब वह यह कह ही रही थी, तब राज्यपाल ने तेकला को लाने के लिए अपना एक अधिकारी भेजा। त्रिफीना ने तेकला का हाथ पकड़ा और उसके साथ चलते हुए कहा, “मैं फाल्कोनिल्ला के साथ उसकी कब्र तक गई थी, और अब मुझे तेकला के साथ पशुओं के पास जाना है।”


    **8:11** यह सुनकर तेकला ने रोते हुए प्रार्थना की, “हे प्रभु परमेश्वर, जिस पर मैंने भरोसा किया और जिसमें मैंने शरण पाई है, त्रिफीना को मेरे प्रति उसकी करुणा और मेरे शील की रक्षा करने का प्रतिफल दे।”


    **8:12** तब रंगभूमि में भारी कोलाहल मच गया। पशु गरजने लगे और लोग चिल्लाने लगे, “अपराधिनी को भीतर लाओ!”


    **8:13** पर वह स्त्री पुकारकर बोली, “ऐसे अपराधों के कारण पूरे नगर को दंड भोगना पड़े! हे राज्यपाल, हम सबको भी यही दंड देने की आज्ञा दे! हाय, अन्यायपूर्ण निर्णय! हाय, कैसा क्रूर दृश्य!”


    **8:14** दूसरे लोग कहने लगे, “इस घृणित काम के कारण पूरा नगर नष्ट हो जाए! हे राज्यपाल, हम सबको मार डाल! हाय, कैसा क्रूर दृश्य! हाय, कैसा अधर्मी निर्णय!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्षी में यहाँ “Sacrilege” है। इसका आशय पवित्र वस्तु, स्थान या धार्मिक मर्यादा के विरुद्ध अपराध हो सकता है; यूनानी और अन्य प्राचीन साक्षियों की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: अपराध-सूचक पद के अर्थ-क्षेत्र और स्रोतगत अनिश्चितता को पारदर्शी रखना।
  - marker: b
    text: “आनंद की दशा” उपलब्ध साक्षी के “state of happiness” का निकट रूप है। पाठ उस दशा को और अधिक परिभाषित नहीं करता।
    reason: मृत्योत्तर अवस्था को किसी विशिष्ट धर्मवैज्ञानिक धारणा में सीमित करने से बचना।
  - marker: c
    text: “फिर से” उपलब्ध अंग्रेज़ी साक्षी में कोष्ठक के भीतर है; प्रत्यक्ष स्रोत-भाषा समीक्षा लंबित होने के कारण इसे अर्थपूर्ण संकेत के रूप में पाठ में रखा गया है।
    reason: साक्षी में चिह्नित पाठगत अनिश्चितता बताना।
lexical_decisions:
- source_word: chastity
  choice: शील
  rationale: प्रसंग में यौन-अखंडता और सम्मान दोनों निहित हैं; ‘शील’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में समझने योग्य है। जहाँ क्रिया अपेक्षित थी, वहाँ ‘शील का उल्लंघन’ और ‘शील की रक्षा’ रखा गया है।
- source_word: governor
  choice: राज्यपाल
  rationale: नागरिक न्यायाधिकारी के पद को सामान्य पाठक के लिए स्पष्ट रखने वाला प्रचलित समतुल्य।
- source_word: amphitheatre
  choice: रंगभूमि
  rationale: पशु-प्रदर्शन और सार्वजनिक दंड के प्राचीन स्थल के लिए स्वाभाविक हिन्दी; आधुनिक बंद सभागार का भ्रामक बोध टालता है।
- source_word: she-lion
  choice: सिंहनी
  rationale: पशु के स्त्रीलिंग को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: Sacrilege
  choice: पवित्र वस्तुओं का अपमान
  rationale: अपराध-सूचक शब्द को किसी संप्रदाय-विशिष्ट शब्दावली में बाँधे बिना सामान्य पाठक के लिए अर्थपूर्ण बनाया गया है; स्रोत-पुनरीक्षण लंबित होने के कारण टिप्पणी जोड़ी गई है।
- source_word: state of happiness
  choice: आनंद की दशा
  rationale: मृत्यु के बाद की दशा संबंधी मूल साक्ष्य की अस्पष्टता को बनाए रखता है; इसे चुपचाप ‘स्वर्ग’ या किसी निश्चित मत में नहीं बदला गया।
- source_word: criminal
  choice: अपराधिनी
  rationale: तेकला के स्त्रीलिंग और उस पर लगाए गए कानूनी आरोप दोनों को व्यक्त करता है, बिना कथाकार की ओर से दोष सिद्ध किए।
- source_word: royal family
  choice: राजपरिवार
  rationale: त्रिफीना की सामाजिक-राजकीय प्रतिष्ठा को सीधा और स्वाभाविक रूप देता है।
theological_decisions:
- issue: मृत फाल्कोनिल्ला के लिए प्रार्थना और उसके आनंद/अनंत जीवन में पहुँचने की याचना
