  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/005.yaml
  text: '5:1 At last Thecla was missed, and her family and Thamyris searched for her in every street, as though she had been lost. But one of the gatekeeper’s fellow servants told them that she had gone out during the night.


    5:2 Then they questioned the gatekeeper, and he told them that she had gone to the prison to see the stranger.


    5:3 So they followed his directions and found her there. When they came out, they gathered a mob and went and told the governor everything that had happened.


    5:4 At this, he ordered Paul to be brought before his judgment seat.


    5:5 Meanwhile, Thecla lay wallowing on the prison floor, in the very place where Paul had sat while teaching her. So the governor also ordered her to be brought before his judgment seat. She received the summons with joy and went.


    5:6 When Paul was brought there, the mob cried out even more fiercely, “He is a magician! Let him die!”


    5:7 Nevertheless, the governor listened with pleasure to Paul’s discourses about the holy works of Christ. After convening a council, he summoned Thecla and said to her, “Why do you not marry Thamyris, according to the law of the Iconians?”


    5:8 She stood silent, with her eyes fixed on Paul. When she gave no answer, her mother, Theoclia, cried out, “Let the unjust creature be burned! Let her be burned in the middle of the theater for refusing Thamyris, so that all women may learn from her to avoid such practices!”


    5:9 Then the governor became exceedingly distressed and ordered Paul to be whipped out of the city and Thecla to be burned.


    5:10 So the governor arose and went immediately into the theater, and all the people went out to see the dreadful sight.


    5:11 But just as a lamb in the wilderness looks all around for its shepherd, Thecla looked around for Paul.


    5:12 As she looked at the multitude, she saw the Lord Jesus in the likeness of Paul and said to herself, “Paul has come to see me in my distress.” She fixed her eyes on him, but as she watched, he immediately ascended into heaven.


    5:13 Then the young men and women brought wood and straw for Thecla’s burning. When she was brought naked to the stake, the governor gazed in amazement at the greatness of her beauty and was moved to tears.


    5:14 When they had arranged the wood, the people commanded her to step onto it. She did so, first making the sign of the cross.


    5:15 Then the people set fire to the pile. Although the flame was exceedingly large, it did not touch her, for God had compassion on her and caused a great eruption from the earth beneath, while a cloud above poured down great quantities of rain and hail.


    5:16 Because of the rupture of the earth, very many were in great danger, and some were killed. The fire was extinguished, and Thecla was preserved.'
translation:
  language: hi
  text: 'पौलुस और थेकला के काम — अध्याय 5


    5:1 अंततः लोगों को पता चला कि थेकला नहीं मिल रही है। उसके घरवाले और थामिरिस उसे खोई हुई समझकर हर गली में ढूँढ़ने लगे। परंतु द्वारपाल के एक साथी सेवक ने उन्हें बताया कि वह रात में बाहर गई थी।


    5:2 तब उन्होंने द्वारपाल से पूछताछ की। उसने उन्हें बताया कि वह उस अजनबी से मिलने बंदीगृह गई थी।


    5:3 इसलिए वे उसके बताए अनुसार गए और थेकला को वहीं पाया। बाहर निकलने के बाद उन्होंने एक भीड़ इकट्ठी की और राज्यपाल के पास जाकर उसे वह सब बताया जो हुआ था।


    5:4 इस पर राज्यपाल ने पौलुस को अपने न्यायासन के सामने लाने का आदेश दिया।


    5:5 इस बीच थेकला बंदीगृह में उसी जगह भूमि पर लोट रही थी, जहाँ पौलुस बैठकर उसे शिक्षा देता था। तब राज्यपाल ने उसे भी अपने न्यायासन के सामने लाने का आदेश दिया। थेकला ने यह बुलावा आनंद से स्वीकार किया और वहाँ गई।


    5:6 जब पौलुस को वहाँ लाया गया, तो भीड़ और भी उग्र होकर चिल्लाई, “यह जादूगर है! इसे मार डालो!”


    5:7 फिर भी राज्यपाल ने पौलुस की वे बातें आनंद से सुनीं जो वह मसीह के पवित्र कार्यों के विषय में कह रहा था। इसके बाद उसने परिषद बुलाई, फिर थेकला को बुलाकर उससे कहा, “तुम इकोनियुम के कानून के अनुसार थामिरिस से विवाह क्यों नहीं करती?”


    5:8 वह चुपचाप खड़ी रही और उसकी आँखें पौलुस पर लगी रहीं। जब उसने कोई उत्तर नहीं दिया, तो उसकी माता थियोक्लिया चिल्लाकर बोली, “इस अधर्मी को जला दो! थामिरिस को ठुकराने के कारण इसे रंगशाला के बीच में जला दो, ताकि सभी स्त्रियाँ इससे सीखें और ऐसा करने से बचें!”


    5:9 तब राज्यपाल अत्यंत व्यथित हुआ। उसने आदेश दिया कि पौलुस को कोड़े लगाकर नगर से बाहर निकाल दिया जाए और थेकला को जला दिया जाए।


    5:10 फिर राज्यपाल उठा और तुरंत रंगशाला में गया। सभी लोग भी उस भयानक दृश्य को देखने बाहर निकल आए।


    5:11 पर थेकला पौलुस को चारों ओर ऐसे खोज रही थी, जैसे निर्जन प्रदेश में कोई मेमना अपने चरवाहे को खोजने के लिए चारों ओर देखता है।


    5:12 भीड़ की ओर देखते हुए उसने प्रभु यीशु को पौलुस के रूप में देखा। उसने मन में कहा, “मेरे संकट में पौलुस मुझे देखने आया है।” वह उसी पर आँखें लगाए रही, पर देखते-ही-देखते वह तुरंत स्वर्ग पर उठा लिया गया।


    5:13 तब युवक और युवतियाँ थेकला को जलाने के लिए लकड़ी और पुआल लाए। जब उसे निर्वस्त्र करके चिता के पास लाया गया, तो राज्यपाल उसके अनुपम सौंदर्य को देखकर चकित रह गया और उसकी आँखों से आँसू निकल पड़े।


    5:14 जब उन्होंने लकड़ी सजा दी, तो लोगों ने थेकला को उस पर चढ़ने का आदेश दिया। पहले उसने क्रूस का चिह्न बनाया,[a] फिर वह उस पर चढ़ गई।


    5:15 तब लोगों ने चिता में आग लगा दी। यद्यपि लपटें बहुत ऊँची थीं, फिर भी उन्होंने थेकला को छुआ तक नहीं, क्योंकि परमेश्वर ने उस पर करुणा की। उसने नीचे धरती को बड़े वेग से फाड़ दिया और ऊपर एक बादल से बहुत अधिक वर्षा और ओले बरसाए।


    5:16 धरती फटने के कारण बहुत-से लोग बड़े संकट में पड़ गए और कुछ मारे भी गए। आग बुझ गई और थेकला बच गई।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उसने अपने ऊपर क्रूस का संकेत बनाया।
    reason: प्राचीन संकेत-क्रिया को उन पाठकों के लिए स्पष्ट करता है जो इस मुहावरे से परिचित न हों, बिना किसी बाद की संप्रदायगत विधि को आरोपित किए।
lexical_decisions:
- source_word: judgement seat
  choice: न्यायासन
  rationale: न्यायिक अधिकार और औपचारिक सुनवाई—दोनों को संक्षिप्त, प्रतिष्ठित हिंदी में व्यक्त करता है।
- source_word: governor
  choice: राज्यपाल
  rationale: दिए गए प्राचीन प्रशासनिक पद के लिए सामान्य और बोधगम्य हिंदी समतुल्य।
- source_word: theatre
  choice: रंगशाला
  rationale: आधुनिक चलचित्रगृह का भ्रम टालते हुए प्राचीन सार्वजनिक प्रदर्शन-स्थल का अर्थ देता है।
- source_word: magician
  choice: जादूगर
  rationale: भीड़ द्वारा लगाए गए विरोधी आरोप को बिना धार्मिक व्याख्या जोड़े सीधे व्यक्त करता है।
- source_word: wallowing
  choice: भूमि पर लोट रही थी
  rationale: मूल साक्ष्य में निहित तीव्र शारीरिक भाव-भंगिमा को नरम किए बिना स्वाभाविक हिंदी में रखता है।
- source_word: making the sign of the cross
  choice: क्रूस का चिह्न बनाया
  rationale: प्राचीन मसीही संकेत-क्रिया को संप्रदाय-विशेष की अतिरिक्त व्याख्या के बिना सुरक्षित रखता है।
- source_word: eruption / rupture of the earth
  choice: धरती को बड़े वेग से फाड़ दिया / धरती फटने
  rationale: दोनों पदों में वर्णित भू-विक्षोभ को एक संगत और दृश्यात्मक हिंदी अभिव्यक्ति में प्रस्तुत करता है।
theological_decisions:
- issue: प्रभु यीशु का पौलुस के रूप में दिखाई देना
  choice: “प्रभु यीशु को पौलुस के रूप में देखा”
  alternative: “पौलुस-जैसे रूप में प्रभु यीशु को देखा”
  rationale: प्राप्त साक्ष्य की रहस्यमय दृष्टि और पौलुस तथा यीशु के बीच कथात्मक भेद—दोनों को बनाए रखा गया है; इसे देहधारण या पहचान की सैद्धांतिक घोषणा नहीं बनाया गया।
- issue: मसीह के holy works
  choice: “मसीह के पवित्र कार्यों”
  alternative: “मसीह के पवित्र कर्मों”
  rationale: साक्ष्य की व्यापक अभिव्यक्ति को सुरक्षित रखा गया है; इसे चमत्कारों, उद्धार-कार्य या नैतिक कर्मों में से केवल किसी एक तक सीमित नहीं किया गया।
- issue: दैवी उद्धार और जनहानि का तनाव
  choice: थेकला पर करुणा, धरती का फटना, और कुछ लोगों का मारा जाना—तीनों कथन यथावत रखे गए
  alternative: जनहानि को कम करके या केवल दुर्घटना के रूप में प्रस्तुत करना
  rationale: कथा में उपस्थित दैवी करुणा और विनाशकारी परिणाम के कठिन तनाव को बिना सामंजस्य बैठाए सुरक्षित रखा गया है।
translation_notes:
  register: 'भाषा आधुनिक मानक हिंदी, कथात्मक और गरिमापूर्ण रखी गई है। नामों के रूप: थेकला, थामिरिस, थियोक्लिया, पौलुस, इकोनियुम। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी और अन्य प्राचीन संस्करणों की प्रत्यक्ष समीक्षा लंबित होने के कारण संदिग्ध स्थानों पर अनावश्यक पाठालोचनात्मक दावे नहीं किए गए।'
