  revised_text: 'पौलुस और थेकला के काम — अध्याय 5


    5:1 अंत में थेकला के न मिलने का पता चला, और उसके घरवाले तथा थामिरिस उसे खोई हुई समझकर हर गली में ढूँढ़ने लगे। परंतु द्वारपाल के एक साथी सेवक ने उन्हें बताया कि वह रात में बाहर गई थी।


    5:2 तब उन्होंने द्वारपाल से पूछताछ की। उसने उन्हें बताया कि वह उस अजनबी से मिलने बंदीगृह गई थी।


    5:3 इसलिए वे उसके बताए अनुसार गए और थेकला को वहीं पाया। बाहर निकलने के बाद उन्होंने एक भीड़ इकट्ठी की और राज्यपाल के पास जाकर उसे वह सब बताया जो हुआ था।


    5:4 इस पर राज्यपाल ने पौलुस को अपने न्यायासन के सामने लाने का आदेश दिया।


    5:5 इस बीच थेकला बंदीगृह में उसी जगह भूमि पर लोट रही थी, जहाँ पौलुस बैठकर उसे शिक्षा देता था। तब राज्यपाल ने उसे भी अपने न्यायासन के सामने लाने का आदेश दिया। थेकला ने यह बुलावा आनंद से स्वीकार किया और वहाँ गई।


    5:6 जब पौलुस को वहाँ लाया गया, तो भीड़ और भी उग्र होकर चिल्लाई, “यह जादूगर है! इसे मार डालो!”


    5:7 फिर भी राज्यपाल ने मसीह के पवित्र कार्यों के बारे में पौलुस के उपदेश आनंद से सुने। इसके बाद उसने परिषद बुलाई, फिर थेकला को बुलाकर उससे कहा, “तुम इकोनियुम के कानून के अनुसार थामिरिस से विवाह क्यों नहीं करती?”


    5:8 वह चुपचाप खड़ी रही और उसकी आँखें पौलुस पर लगी रहीं। जब उसने कोई उत्तर नहीं दिया, तो उसकी माता थियोक्लिया चिल्लाकर बोली, “इस दुष्ट को जला दो! थामिरिस को ठुकराने के कारण इसे रंगशाला के बीच में जला दो, ताकि सभी स्त्रियाँ इससे सीखें और ऐसे व्यवहार से बचें!”


    5:9 तब राज्यपाल अत्यंत व्यथित हुआ। उसने आदेश दिया कि पौलुस को कोड़े लगाकर नगर से बाहर निकाल दिया जाए और थेकला को जला दिया जाए।


    5:10 फिर राज्यपाल उठा और तुरंत रंगशाला में गया। सभी लोग भी उस भयानक दृश्य को देखने बाहर निकल आए।


    5:11 पर थेकला पौलुस को चारों ओर ऐसे खोज रही थी, जैसे निर्जन प्रदेश में कोई मेमना अपने चरवाहे को खोजने के लिए चारों ओर देखता है।


    5:12 भीड़ की ओर देखते हुए उसने प्रभु यीशु को पौलुस के रूप में देखा। उसने मन में कहा, “मेरे संकट में पौलुस मुझे देखने आया है।” वह उसी पर आँखें लगाए रही, पर देखते-ही-देखते वह तुरंत स्वर्ग पर चढ़ गया।


    5:13 तब युवक और युवतियाँ थेकला को जलाने के लिए लकड़ी और पुआल लाए। जब उसे निर्वस्त्र करके खूँटे के पास लाया गया, तो राज्यपाल उसके महान सौंदर्य को देखकर चकित रह गया और उसकी आँखों से आँसू निकल पड़े।


    5:14 जब उन्होंने लकड़ी सजा दी, तो लोगों ने थेकला को उस पर चढ़ने का आदेश दिया। पहले उसने क्रूस का चिह्न बनाया,[a] फिर वह उस पर चढ़ गई।


    5:15 तब लोगों ने लकड़ियों के ढेर में आग लगा दी। यद्यपि लपटें बहुत बड़ी थीं, फिर भी उन्होंने थेकला को छुआ तक नहीं, क्योंकि परमेश्वर ने उस पर करुणा की। उसने नीचे धरती से एक बड़ा भू-विक्षोभ उत्पन्न किया, और ऊपर से एक बादल ने बहुत अधिक वर्षा और ओले बरसाए।


    5:16 धरती फटने के कारण बहुत-से लोग बड़े संकट में पड़ गए और कुछ मारे भी गए। आग बुझ गई और थेकला बच गई।'
