  revised_text: 'पौलुस और थेकला के काम — अध्याय 4


    4:1 तब थामिरिस राज्यपाल के न्यायासन के सामने खड़ा हुआ और ऊँचे स्वर में इस प्रकार बोला:


    4:2 “हे राज्यपाल, मैं नहीं जानता कि यह मनुष्य कहाँ से आया है; पर यह सिखाता है कि विवाह वर्जित है। इसलिए इसे आज्ञा दीजिए कि यह आपके सामने बताए कि वह ऐसी शिक्षाओं का प्रचार किस कारण करता है।”


    4:3 जब वह यह कह रहा था, तब देमास और हेरमोगेनेस ने (थामिरिस से फुसफुसाकर) कहा, “कहो कि यह मसीही है, और इसे तुरंत मार डाला जाएगा।”[a]


    4:4 पर राज्यपाल ने अधिक विचार से काम लिया। उसने पौलुस को बुलाकर कहा, “तुम कौन हो? क्या शिक्षा देते हो? ये लोग तुम पर गंभीर अपराधों का आरोप लगाते जान पड़ते हैं।”


    4:5 तब पौलुस ने ऊँचे स्वर में कहा, “हे राज्यपाल, अब मुझे अपनी शिक्षाओं का लेखा देने के लिए बुलाया गया है; इसलिए मैं चाहता हूँ कि आप मेरी बात सुनें।


    4:6 “परमेश्वर, जो प्रतिशोध करनेवाला परमेश्वर है और जिसे अपने प्राणियों के उद्धार के सिवा किसी बात की आवश्यकता नहीं, ने मुझे भेजा है कि मैं उन्हें उनकी दुष्टता और भ्रष्टता, सब पापमय सुखों और मृत्यु से फेरूँ, और उन्हें फिर पाप न करने के लिए समझाऊँ।


    4:7 “इसी कारण परमेश्वर ने अपने पुत्र यीशु मसीह को भेजा, जिसका मैं प्रचार करता हूँ और जिस पर आशा रखने की शिक्षा मैं लोगों को देता हूँ। केवल उसी ने भटके हुए संसार पर ऐसी करुणा की कि वह, हे राज्यपाल, दोषी न ठहराया जाए, बल्कि उसमें विश्वास, परमेश्वर का भय, धर्म का ज्ञान और सत्य से प्रेम हो।


    4:8 “इसलिए यदि मैं केवल वही बातें सिखाता हूँ जो मैंने परमेश्वर के प्रकाशन से पाई हैं, तो मेरा अपराध क्या है?”


    4:9 यह सुनकर राज्यपाल ने पौलुस को बाँधकर बंदीगृह में डाल देने की आज्ञा दी, ताकि अधिक समय मिलने पर वह उसकी बात पूरी तरह सुन सके।


    4:10 पर रात में थेकला ने अपने कानों की बालियाँ उतारकर बंदीगृह के द्वारपाल को दे दीं। उसने उसके लिए द्वार खोल दिए और उसे भीतर जाने दिया।


    4:11 फिर थेकला ने जेलर को चाँदी का एक दर्पण भेंट किया, और उसे उस कक्ष में जाने दिया गया जहाँ पौलुस था। वह उसके चरणों के पास बैठ गई और उसने उससे परमेश्वर की महान बातें सुनीं।


    4:12 उसने देखा कि पौलुस दुःख सहने से नहीं डरता था, बल्कि ईश्वरीय सहायता से साहसपूर्वक व्यवहार करता था। इससे उसका विश्वास इतना बढ़ गया कि उसने उसकी जंजीरों को चूम लिया।


    [a] उपलब्ध अंग्रेज़ी साक्ष्य में “थामिरिस से फुसफुसाकर” शब्द कोष्ठकों में हैं; मूल यूनानी और अन्य प्राचीन पाठ-साक्ष्यों की जाँच अभी बाकी है।'
