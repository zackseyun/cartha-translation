  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में “थामिरिस से फुसफुसाकर” शब्द कोष्ठकों में हैं; मूल यूनानी और अन्य प्राचीन पाठ-साक्ष्यों की जाँच अभी बाकी है।
    reason: आपूर्त पाठ में कोष्ठकीय और संभवतः पाठ-संदिग्ध सामग्री को पारदर्शी बनाना।
  - marker: b
    text: “प्रतिफल देनेवाला” का अर्थ दंड या न्याय करनेवाला भी हो सकता है; उपलब्ध साक्ष्य का अंग्रेज़ी अनुवाद “vengeance” देता है।
    reason: कठिन ईश्वरविषयक पद की अर्थ-सीमा और अनुवादगत अनिश्चितता सुरक्षित रखना।
  - marker: c
    text: “भक्ति का ज्ञान” उपलब्ध साक्ष्य के “knowledge of religion” का अनुवाद है; मूल शब्द का अर्थ “ईश्वर-भक्ति का ज्ञान” भी हो सकता है।
    reason: प्रत्यक्ष यूनानी समीक्षा के अभाव में संभावित धार्मिक अर्थ को संकेत करना।
lexical_decisions:
- source_word: governor
  choice: राज्यपाल
  rationale: न्यायिक अधिकार रखनेवाले प्रांतीय अधिकारी के लिए आधुनिक और सहज शब्द।
- source_word: judgment-seat
  choice: न्यायासन
  rationale: औपचारिक न्यायिक आसन का संक्षिप्त और गरिमापूर्ण रूप।
- source_word: matrimony is unlawful
  choice: विवाह करना उचित नहीं है
  rationale: आरोप को स्वाभाविक हिन्दी में रखा है; ‘अवैध’ आधुनिक कानूनी अर्थ को अनावश्यक रूप से प्रमुख करता।
- source_word: Christian
  choice: मसीही
  rationale: आधुनिक मानक हिन्दी में यीशु मसीह के अनुयायी का स्पष्ट और प्रचलित पद।
- source_word: God of vengeance
  choice: प्रतिफल देनेवाला परमेश्वर
  rationale: न्याय और दंड के भाव को बनाए रखते हुए ‘प्रतिशोधी’ से उत्पन्न निजी वैर के आधुनिक अर्थ से बचता है; अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: revelation
  choice: प्रकाशन
  rationale: ईश्वर द्वारा प्रकट की गई बात के लिए स्थापित धार्मिक शब्द।
- source_word: turnkey / jailer
  choice: बंदीगृह का द्वारपाल / जेलर
  rationale: साक्ष्य में प्रयुक्त दो पदों का भेद बनाए रखा गया है, यद्यपि वे संभवतः एक ही अधिकारी को सूचित करते हों।
- source_word: great things of God
  choice: परमेश्वर की महान बातें
  rationale: वाक्य की व्यापकता और संभावित धार्मिक अर्थ को बिना विस्तार से व्याख्यायित किए सुरक्षित रखता है।
theological_decisions:
- issue: विवाह के विषय में पौलुस की शिक्षा
  choice: इसे थामिरिस द्वारा लगाया गया आरोप ही रहने दिया गया है
  alternative: पौलुस वास्तव में हर प्रकार के विवाह को निषिद्ध करता था
  rationale: कथा यहाँ आरोप प्रस्तुत करती है; उसे लेखक या पौलुस की निर्विवाद शिक्षा बनाना पाठ से आगे जाना होगा।
- issue: God of vengeance
  choice: परमेश्वर के न्याय/प्रतिफल के भाव को रखा गया
  alternative: परमेश्वर प्रतिशोधी है
  rationale: अंग्रेज़ी साक्ष्य कठोर पद देता है, पर निजी बदले का भाव थोपे बिना न्यायिक आयाम बनाए रखना अधिक संतुलित है।
- issue: Jesus Christ की अनन्य करुणा
  choice: ‘केवल उसी ने’ को बनाए रखा
  alternative: अनन्यता को हल्का करके केवल ‘उसने’ कहना
  rationale: उपलब्ध साक्ष्य के ‘who only’ में उपस्थित अनन्य दावे को नहीं हटाया गया।
- issue: faith, fear of God, knowledge of religion, love of truth
  choice: सूची को अलग-अलग धार्मिक गुणों के रूप में सुरक्षित रखा
  alternative: इन्हें सामान्य ‘धार्मिक जीवन’ में समेट देना
  rationale: पाठ की धर्मवैचारिक बहुलता और तनाव को यथावत रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। संवाद में सम्मानसूचक ‘आप’ और ‘हे राज्यपाल’ रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और दिए गए परामर्श-पाठ पर आधारित है; मूल यूनानी तथा प्राचीन अनुवाद-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण कठिन स्थानों पर पाद-टिप्पणियों द्वारा सावधानी बरती गई है।
