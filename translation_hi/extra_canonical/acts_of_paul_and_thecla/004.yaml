  text: '4:1 Then Thamyris stood before the governor’s judgment seat and spoke loudly as follows:


    4:2 “Governor, I do not know where this man comes from, but he teaches that marriage is unlawful. Therefore, command him to explain before you why he proclaims such doctrines.”


    4:3 While he was speaking, Demas and Hermogenes (whispered to Thamyris, and) said, “Say that he is a Christian, and he will immediately be put to death.”


    4:4 But the governor was more deliberate. He called Paul and said, “Who are you? What do you teach? They seem to accuse you of serious crimes.”


    4:5 Then Paul spoke loudly, saying, “Since I am now called to give an account of my teachings, Governor, I ask you to hear me.


    4:6 “God, who is a God of vengeance and needs nothing except the salvation of his creatures, has sent me to turn them away from their wickedness and corruption, from all (sinful) pleasures, and from death, and to persuade them to sin no more.


    4:7 “For this reason, God sent his Son Jesus Christ, whom I proclaim and in whom I teach people to place their hope. He alone had such compassion on the deluded world that it might not be condemned, Governor, but might have faith, the fear of God, the knowledge of religion, and the love of truth.


    4:8 “So if I teach only those things that I received by revelation from God, what is my crime?”


    4:9 When the governor heard this, he ordered Paul to be bound and put in prison until he had more time to hear him fully.


    4:10 But during the night, Thecla took off her earrings and gave them to the prison guard, who opened the doors for her and let her in.


    4:11 After she gave a silver mirror to the jailer, she was allowed to enter the room where Paul was. Then she sat at his feet and heard from him the great things of God.


    4:12 When she saw that Paul was not afraid to suffer but, with divine assistance, conducted himself courageously, her faith increased so greatly that she kissed his chains.'
translation:
  language: hi
  text: 'पौलुस और थेकला के काम — अध्याय 4


    4:1 तब थामिरिस राज्यपाल के न्यायासन के सामने खड़ा हुआ और ऊँचे स्वर में इस प्रकार बोला:


    4:2 “हे राज्यपाल, मैं नहीं जानता कि यह मनुष्य कहाँ से आया है; पर यह सिखाता है कि विवाह करना उचित नहीं है। इसलिए इसे आज्ञा दीजिए कि यह आपके सामने बताए कि वह ऐसी शिक्षाएँ क्यों फैलाता है।”


    4:3 जब वह यह कह रहा था, तब देमास और हेरमोगेनेस ने (थामिरिस से फुसफुसाकर) कहा, “कहो कि यह मसीही है, और इसे तुरंत मार डाला जाएगा।”[a]


    4:4 पर राज्यपाल ने जल्दबाज़ी नहीं की। उसने पौलुस को बुलाकर कहा, “तुम कौन हो? क्या शिक्षा देते हो? ये लोग तुम पर गंभीर अपराधों का आरोप लगाते जान पड़ते हैं।”


    4:5 तब पौलुस ने ऊँचे स्वर में कहा, “हे राज्यपाल, जब अब मुझे अपनी शिक्षा का उत्तर देने के लिए बुलाया गया है, तो मेरी बात सुनिए।


    4:6 “परमेश्वर—जो प्रतिफल देनेवाला परमेश्वर है और जिसे अपने प्राणियों के उद्धार के सिवा किसी बात की आवश्यकता नहीं—ने मुझे भेजा है, ताकि मैं उन्हें उनकी दुष्टता और भ्रष्टता, हर प्रकार के पापमय सुख और मृत्यु से फेरूँ तथा उन्हें फिर पाप न करने के लिए समझाऊँ।[b]


    4:7 “इसी कारण परमेश्वर ने अपने पुत्र यीशु मसीह को भेजा। मैं उसी का प्रचार करता हूँ और लोगों को उसी पर आशा रखने की शिक्षा देता हूँ। केवल उसी ने भटके हुए संसार पर ऐसी करुणा की कि वह दोषी न ठहराया जाए, हे राज्यपाल, बल्कि उसमें विश्वास, परमेश्वर का भय, भक्ति का ज्ञान और सत्य से प्रेम हो।[c]


    4:8 “इसलिए यदि मैं केवल वही बातें सिखाता हूँ जो मैंने परमेश्वर के प्रकाशन से पाई हैं, तो मेरा अपराध क्या है?”


    4:9 यह सुनकर राज्यपाल ने पौलुस को बाँधकर बंदीगृह में डाल देने की आज्ञा दी, ताकि अधिक समय मिलने पर वह उसकी बात पूरी तरह सुन सके।


    4:10 पर रात में थेकला ने अपने कानों की बालियाँ उतारकर बंदीगृह के द्वारपाल को दे दीं। उसने उसके लिए द्वार खोल दिए और उसे भीतर जाने दिया।


    4:11 फिर थेकला ने जेलर को चाँदी का एक दर्पण भेंट किया, और उसे उस कक्ष में जाने दिया गया जहाँ पौलुस था। वह उसके चरणों के पास बैठ गई और उससे परमेश्वर की महान बातों के विषय में सुनती रही।


    4:12 उसने देखा कि पौलुस दुःख सहने से नहीं डरता, बल्कि परमेश्वर की सहायता से साहस बनाए रखता है। इससे उसका विश्वास इतना बढ़ गया कि उसने पौलुस की जंजीरों को चूम लिया।


    [a] उपलब्ध अंग्रेज़ी साक्ष्य में “थामिरिस से फुसफुसाकर” शब्द कोष्ठकों में हैं; मूल यूनानी और अन्य प्राचीन पाठ-साक्ष्यों की जाँच अभी बाकी है।

    [b] “प्रतिफल देनेवाला” का अर्थ दंड या न्याय करनेवाला भी हो सकता है; उपलब्ध साक्ष्य का अंग्रेज़ी अनुवाद “vengeance” देता है।

    [c] “भक्ति का ज्ञान” उपलब्ध साक्ष्य के “knowledge of religion” का अनुवाद है; मूल शब्द का अर्थ “ईश्वर-भक्ति का ज्ञान” भी हो सकता है।'
