  text: '11:1 The devil then put evil counsel into their minds. One day, when they had gathered to consult together, they reasoned among themselves: “The virgin is a priestess of the great goddess Diana, and whatever she asks of her is granted, because she is a virgin and is therefore loved by all the gods.


    11:2 Now, then, let us hire some immoral young men. After we have made them sufficiently drunk and given them a large sum of money, let us order them to go and violate this virgin, promising them an even greater reward if they do it.”


    11:3 (For they had concluded among themselves that if they could violate her, the gods would no longer regard her, nor would Diana heal the sick for her.)


    11:4 They carried out this plan. The young men went to the mountain and came to the cave as fierce as lions, knocking at the door.


    11:5 The holy martyr Thecla, trusting in the God in whom she believed, opened the door, although she had already been warned of their plan. She said to them, “Young men, what is your business?”


    11:6 They replied, “Is anyone here whose name is Thecla?” She answered, “What do you want with her?” They said, “We intend to lie with her.”


    11:7 The blessed Thecla answered, “Although I am a lowly old woman, I am the servant of my Lord Jesus Christ. And although you have a vile design against me, you will not be able to accomplish it.” They replied, “It is impossible that we should not be able to do with you whatever we want.”


    11:8 While they were saying this, they seized her by force and intended to rape her. Then she said to them with the (greatest) gentleness, “Young men, be patient and see the glory of the Lord.”


    11:9 While they held her, she looked up to heaven and said, “O most reverend God, to whom no one can be compared, who glorifies yourself over your enemies; who delivered me from the fire and did not give me up to Thamyris or to Alexander; who delivered me from the wild beasts; who preserved me in the deep waters; who have everywhere been my helper and have glorified your name in me:


    11:10 Now also deliver me from the hands of these wicked and unreasonable men. Do not allow them to violate the chastity that I have preserved until now for your honor. For I love you, long for you, and worship you, O Father, Son, and Holy Spirit, forever. Amen.”


    11:11 Then a voice came from heaven, saying, “Do not be afraid, Thecla, my faithful servant, for I am with you. Look and see the place that has been opened for you. There your eternal dwelling shall be; there you shall receive the beatific vision.”


    11:12 The blessed Thecla looked and saw that the rock had opened wide enough for a person to enter. She did as she had been commanded, bravely escaped from the vile group, and entered the rock. It immediately closed so completely that no crack was visible where it had opened.


    11:13 The men stood utterly astonished at such a remarkable miracle and had no power to detain the servant of God. But as they caught hold of her veil, or hood, they tore off a piece of it.


    11:14 Even this happened by God’s permission, to confirm the faith of those who would come to see this venerable place and to convey blessings to people in succeeding ages who would believe in our Lord Jesus Christ with a pure heart.


    11:15 Thus suffered Thecla, that first martyr and apostle of God, and virgin. She came from Iconium at eighteen years of age. Afterward, partly through journeys and travels and partly through a monastic life in the cave, she lived for seventy-two years, so that she was ninety years old when the Lord translated her.


    11:16 Thus ends her life.


    11:17 The day kept sacred to her memory is the twenty-fourth of September, to the glory of the Father, the Son, and the Holy Spirit, now and forever. Amen.'
translation:
  language: hi
  text: 'पौलुस और थेकला के कार्य — अध्याय 11


    11:1 तब शैतान ने उनके मनों में बुरी सलाह डाल दी। एक दिन वे आपस में विचार करने के लिए इकट्ठे हुए और कहने लगे, “यह कुँवारी महान देवी अरतिमिस[a] की पुजारिन है। वह देवी से जो कुछ माँगती है, उसे मिल जाता है; क्योंकि यह कुँवारी है और इसलिए सभी देवता इससे प्रेम करते हैं।


    11:2 इसलिए अब हम कुछ चरित्रहीन जवानों को ले आएँ। हम उन्हें खूब शराब पिलाएँ, अच्छी-खासी रकम दें और उनसे कहें कि जाकर इस कुँवारी का शील भंग करें। यदि वे ऐसा कर दें, तो हम उन्हें और भी बड़ा इनाम देने का वादा करें।”


    11:3 (क्योंकि उन्होंने आपस में यह निष्कर्ष निकाला था कि यदि वे उसका शील भंग कर सकें, तो देवता फिर उसकी ओर ध्यान नहीं देंगे और न अरतिमिस उसके लिए रोगियों को चंगा करेगी।)


    11:4 उन्होंने अपनी योजना के अनुसार किया। वे जवान पहाड़ पर गए और सिंहों के समान उग्र होकर गुफा के पास पहुँचे तथा द्वार खटखटाने लगे।


    11:5 पवित्र शहीद थेकला ने उस परमेश्वर पर भरोसा रखते हुए, जिस पर वह विश्वास करती थी, द्वार खोल दिया, यद्यपि उसे उनकी योजना की चेतावनी पहले ही मिल चुकी थी। उसने उनसे कहा, “जवानो, तुम किस काम से आए हो?”


    11:6 उन्होंने उत्तर दिया, “क्या यहाँ थेकला नाम की कोई स्त्री है?” उसने पूछा, “तुम उससे क्या चाहते हो?” उन्होंने कहा, “हम उसके साथ सोना चाहते हैं।”


    11:7 धन्य थेकला ने उत्तर दिया, “यद्यपि मैं एक दीन बूढ़ी स्त्री हूँ, फिर भी मैं अपने प्रभु यीशु मसीह की सेविका हूँ। तुम्हारा इरादा मेरे विरुद्ध घृणित है, पर तुम उसे पूरा नहीं कर सकोगे।” उन्होंने उत्तर दिया, “यह हो ही नहीं सकता कि हम तुम्हारे साथ अपनी इच्छा के अनुसार न कर सकें।”


    11:8 यह कहते हुए उन्होंने उसे बलपूर्वक पकड़ लिया और उसके साथ बलात्कार करना चाहा। तब उसने अत्यन्त[b] नम्रता से उनसे कहा, “जवानो, तनिक ठहरो और प्रभु की महिमा देखो।”


    11:9 जब वे उसे पकड़े हुए थे, तब उसने स्वर्ग की ओर देखकर कहा, “हे परम श्रद्धेय परमेश्वर, तेरे समान कोई नहीं! तू अपने शत्रुओं पर अपनी महिमा प्रकट करता है। तूने मुझे आग से छुड़ाया और मुझे थामिरिस या सिकन्दर के हाथ नहीं सौंपा। तूने मुझे जंगली पशुओं से बचाया और गहरे जल में सुरक्षित रखा। तू हर स्थान पर मेरा सहायक रहा है और तूने मुझमें अपने नाम की महिमा की है।


    11:10 अब भी मुझे इन दुष्ट और विवेकहीन मनुष्यों के हाथों से छुड़ा। जिस पवित्रता को मैंने अब तक तेरे सम्मान के लिए सुरक्षित रखा है, उन्हें उसका शील भंग न करने दे। क्योंकि मैं तुझसे प्रेम करती हूँ, तेरी लालसा रखती हूँ और तेरी आराधना करती हूँ—हे पिता, पुत्र और पवित्र आत्मा—सदा-सर्वदा। आमीन।”


    11:11 तब स्वर्ग से एक वाणी आई, “मत डर, थेकला, मेरी विश्वासयोग्य सेविका, क्योंकि मैं तेरे साथ हूँ। देख, वह स्थान जो तेरे लिए खोल दिया गया है। वहीं तेरा अनन्त निवास होगा; वहीं तू धन्य दर्शन[c] पाएगी।”


    11:12 धन्य थेकला ने देखा कि चट्टान इतनी खुल गई थी कि एक व्यक्ति उसमें प्रवेश कर सकता था। उसने आज्ञा के अनुसार किया, साहस के साथ उस घृणित दल से बच निकली और चट्टान के भीतर चली गई। चट्टान तुरन्त इस प्रकार पूरी तरह बन्द हो गई कि जहाँ वह खुली थी, वहाँ कोई दरार तक दिखाई नहीं दी।


    11:13 उस अद्भुत चमत्कार को देखकर वे पुरुष पूरी तरह स्तब्ध खड़े रह गए और परमेश्वर की सेविका को रोक न सके। वे केवल उसके घूँघट या सिर ढकने के वस्त्र को पकड़ पाए और उसका एक टुकड़ा फाड़ लिया।


    11:14 यह भी परमेश्वर की अनुमति से हुआ, ताकि उन लोगों का विश्वास दृढ़ हो जो इस पूज्य स्थान को देखने आएँगे, और आने वाली पीढ़ियों में उन लोगों तक आशीष पहुँचे जो शुद्ध हृदय से हमारे प्रभु यीशु मसीह पर विश्वास करेंगे।


    11:15 इस प्रकार थेकला ने दुःख सहा—वह प्रथम शहीद, परमेश्वर की प्रेरित और कुँवारी थी। वह अठारह वर्ष की आयु में इकुनियुम से आई थी। इसके बाद उसने कुछ समय यात्राओं में और कुछ समय गुफा में तपस्विनी का जीवन बिताते हुए बहत्तर वर्ष और जीए। इस प्रकार जब प्रभु ने उसे उठा लिया[d], तब वह नब्बे वर्ष की थी।


    11:16 इस प्रकार उसका जीवन समाप्त हुआ।


    11:17 उसकी स्मृति में पवित्र माना जाने वाला दिन चौबीस सितम्बर है—पिता, पुत्र और पवित्र आत्मा की महिमा के लिए, अब और सदा-सर्वदा। आमीन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पुराने अंग्रेज़ी साक्षी में यहाँ “डायना” है, जो यूनानी देवी अरतिमिस का रोमी नाम है।
    reason: नाम की यूनानी-रोमी भिन्नता और साक्ष्य की स्थिति स्पष्ट करना।
  - marker: b
    text: “अत्यन्त” पुराने अंग्रेज़ी साक्षी में कोष्ठकों में दिया गया है; मूल यूनानी और अन्य पाठ-साक्षियों की समीक्षा अभी शेष है।
    reason: साक्षी में चिह्नित पाठगत अनिश्चितता सुरक्षित रखना।
  - marker: c
    text: “धन्य दर्शन” उस परम आनन्दमय दर्शन को सूचित करता है जिसका वादा थेकला से किया गया है; यहाँ प्रयुक्त अभिव्यक्ति उत्तरकालीन तकनीकी अर्थ भी ग्रहण कर सकती है।
    reason: ‘beatific vision’ की अर्थ-सीमा बिना सांप्रदायिक निर्धारण के बताना।
  - marker: d
    text: “उठा लिया” के पीछे पुराने अंग्रेज़ी साक्षी का शब्द “translated” है, जो मृत्यु अथवा परमेश्वर द्वारा दूसरे लोक में ले जाए जाने—दोनों का संकेत दे सकता है।
    reason: अन्त की वास्तविक अस्पष्टता को प्रकाशित करना।
lexical_decisions:
- source_word: 'Diana (Greek tradition: Artemis)'
  choice: अरतिमिस
  rationale: कथा का एशिया माइनर/यूनानी परिवेश देखते हुए यूनानी देवी का नाम रखा गया; पुराने अंग्रेज़ी साक्षी का रोमी नाम ‘Diana’ पादटिप्पणी में बताया गया है।
- source_word: debauch / violate
  choice: शील भंग करना
  rationale: यौन हिंसा का आशय स्पष्ट रखते हुए गरिमापूर्ण आधुनिक हिन्दी चुनी गई; पद 8 में प्रयास को अधिक प्रत्यक्ष रूप से ‘बलात्कार करना चाहा’ कहा गया।
