translation:
  language: hi
  text: 'पौलुस और थेकला के कार्य — अध्याय 2


    2:1 जब पौलुस उनेसिफुरुस के घर में इकट्ठी होनेवाली कलीसिया में यह उपदेश दे रहा था, तब थेकला नाम की एक कुँवारी—जिसकी माता का नाम थियोคลिया था और जिसकी मँगनी थामिरिस नाम के एक पुरुष से हुई थी—अपने घर की एक खिड़की पर बैठी थी।


    2:2 वहाँ से, उस घर की खिड़की के कारण जहाँ पौलुस ठहरा था, वह रात-दिन परमेश्वर, प्रेम, मसीह में विश्वास और प्रार्थना के विषय में पौलुस के उपदेश सुनती रही।


    2:3 वह खिड़की से नहीं हटी, और विश्वास की शिक्षाओं से वशीभूत होकर अत्यन्त आनन्दित हुई।[a]


    2:4 अन्ततः, जब उसने बहुत-सी स्त्रियों और कुँवारियों को पौलुस के पास जाते देखा, तो उसके मन में बड़ी उत्कट अभिलाषा हुई कि वह भी उसके सामने आने और मसीह का वचन सुनने के योग्य समझी जाए; क्योंकि उसने अभी तक पौलुस को देखा नहीं था, केवल उसके उपदेश ही सुने थे।


    2:5 जब किसी तरह उसे खिड़की से हटने के लिए राज़ी नहीं किया जा सका, तो उसकी माता ने थामिरिस को बुलवा भेजा। वह बड़े आनन्द से आया, क्योंकि उसे आशा थी कि अब वह उससे विवाह कर पाएगा। उसने थियोคลिया से पूछा, “मेरी थेकला कहाँ है?”


    2:6 थियोक्लिया ने उत्तर दिया, “थामिरिस, मुझे तुम्हें एक बहुत विचित्र बात बतानी है। थेकला तीन दिन से खिड़की से नहीं हटी है; वह खाने-पीने तक के लिए नहीं उठती। वह एक परदेशी की चतुराई-भरी और भरमानेवाली बातों को सुनने में ऐसी मग्न है कि मुझे बड़ा आश्चर्य होता है, थामिरिस, कि अपनी शालीनता के लिए जानी जानेवाली यह युवती उसके प्रभाव में कैसे आ गई।


    2:7 “उस मनुष्य ने सारे इकुनियुम नगर को अशान्त कर दिया है, और दूसरों के साथ तुम्हारी थेकला को भी। सभी स्त्रियाँ और युवक उसकी शिक्षा पाने के लिए उसके पास उमड़ते हैं। वह उन्हें यह भी बताता है कि परमेश्वर केवल एक है, केवल उसी की आराधना की जानी चाहिए और हमें ब्रह्मचर्य में रहना चाहिए।[b]


    2:8 “फिर भी मेरी बेटी थेकला, मानो खिड़की से चिपका मकड़ी का जाला हो, पौलुस की बातों के वश में है। वह उन्हें अद्भुत उत्सुकता और अपार आनन्द से सुनती है; और उसकी बातों पर ध्यान देते-देते यह युवती बहक गई है। अब तुम जाकर उससे बात करो, क्योंकि उसकी मँगनी तुमसे हुई है।”


    2:9 तब थामिरिस उसके पास गया। उसने अभिवादन किया और उसे चौंकाने से बचते हुए कहा, “थेकला, मेरी होनेवाली पत्नी, तुम इस उदास दशा में क्यों बैठी हो? तुम पर यह कैसा अनोखा प्रभाव पड़ा है? थामिरिस की ओर मुड़ो और लज्जा करो।”[c]


    2:10 उसकी माता ने भी उसी प्रकार उससे कहा, “बेटी, तुम इतनी उदास क्यों बैठी हो और स्तब्ध व्यक्ति की तरह कोई उत्तर क्यों नहीं देती?”


    2:11 तब वे फूट-फूटकर रोने लगे—थामिरिस इसलिए कि उसने अपनी होनेवाली पत्नी को खो दिया था, थियोक्लिया इसलिए कि उसने अपनी बेटी को खो दिया था, और दासियाँ इसलिए कि उन्होंने अपनी स्वामिनी को खो दिया था। इस प्रकार पूरे घर में शोक छा गया।


    2:12 पर इन सब बातों का थेकला पर कोई ऐसा प्रभाव नहीं पड़ा कि वह उनकी ओर मुड़कर उन पर ध्यान देती; वह अब भी पौलुस की बातों में ही लगी रही।


    2:13 तब थामिरिस बाहर सड़क पर दौड़ा गया, ताकि देखे कि पौलुस के पास आने-जानेवाले लोग कौन हैं। उसने दो पुरुषों को बड़ी तीखी बहस करते देखा और उनसे कहा,


    2:14 “महाशयो, तुम यहाँ किस काम से आए हो? और भीतर तुम्हारे साथ का वह कौन मनुष्य है जो युवकों और कुँवारियों—दोनों के मन बहकाता है और उन्हें समझाता है कि वे विवाह न करें, बल्कि जैसे हैं वैसे ही रहें?


    2:15 “यदि तुम मुझे उसके विषय में सही जानकारी दोगे तो मैं तुम्हें बहुत-सा धन दूँगा, क्योंकि इस नगर में मेरा प्रमुख स्थान है।”


    2:16 देमास और हेरमोगेनेस ने उत्तर दिया, “वह ठीक-ठीक कौन है, यह हम तुम्हें नहीं बता सकते। पर इतना हम जानते हैं कि वह युवकों को उनकी होनेवाली पत्नियों से और कुँवारियों को उनके होनेवाले पतियों से वंचित करता है। वह सिखाता है, ‘यदि तुम ब्रह्मचर्य में न रहो और अपने शरीर को अशुद्ध करो, तो तुम्हारा भावी पुनरुत्थान नहीं हो सकता।’”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वशीभूत” पुरानी अंग्रेज़ी साक्षी के शब्द का निकट रूप है; आशय यह भी हो सकता है कि विश्वास की शिक्षाओं ने उसे पूरी तरह अपने प्रभाव में ले लिया।
    reason: स्रोत-भाषा की समीक्षा लंबित होने के कारण असामान्य अभिव्यक्ति और उसकी संभावित अर्थ-छाया बताना।
  - marker: b
    text: यहाँ “ब्रह्मचर्य” से आशय विवाह न करने और यौन संयम में रहने से है।
    reason: भारतीय भाषिक संदर्भ में शब्द की व्यापक धार्मिक अनुगूँज को सीमित कर कथानकगत अर्थ स्पष्ट करना।
  - marker: c
    text: “लज्जा करो” का आशय संभवतः अपने मंगेतर की ओर संकोच या शील के साथ मुड़ना है; वाक्य का ठीक भाव अनिश्चित है।
    reason: पुराने अंग्रेज़ी साक्ष्य की कठिन अभिव्यक्ति को बिना चुपचाप सुलझाए सुरक्षित रखना।
  - marker: d
    text: यह देमास और हेरमोगेनेस द्वारा पौलुस की शिक्षा का वर्णन है; कथावाचक यहाँ इस दावे की पुष्टि नहीं करता।
    reason: वक्ता-स्तर स्पष्ट करना और विवादित धर्मवैचारिक कथन को कथाकार की मान्यता समझने से रोकना।
lexical_decisions:
- source_word: church
  choice: इकट्ठी होनेवाली कलीसिया
  rationale: संदर्भ में समुदाय उनेसिफुरुस के घर में एकत्र है; यह रूप भवन और समुदाय के बीच अंग्रेज़ी साक्ष्य की संभावित अस्पष्टता को सहज हिन्दी में रखता है।
- source_word: charity
  choice: प्रेम
  rationale: यहाँ पुरानी अंग्रेज़ी ‘charity’ का व्यापक धार्मिक अर्थ है; आधुनिक हिन्दी में ‘प्रेम’ स्वाभाविक है और इसे केवल दान तक सीमित नहीं करता।
- source_word: chastity
  choice: ब्रह्मचर्य
  rationale: कथानक में विवाह न करने और यौन संयम में बने रहने की शिक्षा है; ‘ब्रह्मचर्य’ इसे संक्षेप और स्पष्टता से व्यक्त करता है, यद्यपि भारतीय सांस्कृतिक अनुगूँज के कारण पादटिप्पणी दी गई है।
- source_word: subdued
  choice: वशीभूत
  rationale: पुराने साक्ष्य की तीव्र और कुछ हद तक निष्क्रिय छवि को बनाए रखा गया है, पर वाक्य को आधुनिक हिन्दी में पठनीय बनाया गया है।
