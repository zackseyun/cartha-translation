base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/007.yaml
  text: '7:1 Then Paul sent Onesiphorus and his family back to their own home. Taking Thecla with him, he went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander, a city magistrate who had performed many significant services for the city during his term, saw Thecla and fell in love with her. He tried to win Paul over with many costly gifts.


    7:3 But Paul told him, “I do not know the woman you are speaking about, nor does she belong to me.”


    7:4 But Alexander, being a person of great power in Antioch, seized her in the street and kissed her. Thecla would not tolerate this. Looking around for Paul, she cried out loudly in distress, “Do not force me, a stranger! Do not force me, a servant of God! I am one of the prominent people of Iconium, and I was forced to leave that city because I refused to marry Thamyris.”


    7:5 Then she seized Alexander, tore his coat, took the crown from his head, and made him look ridiculous in front of all the people.


    7:6 But Alexander, partly because he loved her and partly because he was ashamed of what had happened, brought her before the governor. When she admitted what she had done, the governor condemned her to be thrown to the beasts.'
translation:
  language: hi
  text: '7:1 तब पौलुस ने उनेसिफुरुस और उसके परिवार को उनके घर वापस भेज दिया। फिर वह थेकला को अपने साथ लेकर अन्ताकिया गया।


    7:2 जैसे ही वे नगर में पहुँचे, सिकन्दर नाम के एक सीरियाई ने थेकला को देखा और उस पर मोहित हो गया। वह नगर का एक अधिकारी था और अपने कार्यकाल में नगर के लिए कई महत्त्वपूर्ण काम कर चुका था। उसने बहुत-से बहुमूल्य उपहार देकर पौलुस को अपने पक्ष में करने की कोशिश की।


    7:3 पर पौलुस ने उससे कहा, “तुम जिस स्त्री की बात कर रहे हो, उसे मैं नहीं जानता, और न वह मेरी है।”


    7:4 लेकिन सिकन्दर अन्ताकिया में बहुत प्रभावशाली व्यक्ति था। उसने सड़क पर थेकला को पकड़ लिया और उसे चूम लिया। थेकला ने यह सहन नहीं किया। वह पौलुस को इधर-उधर खोजती हुई व्याकुल होकर ऊँचे स्वर में चिल्लाई, “मैं परदेशी हूँ—मेरे साथ ज़बरदस्ती मत करो! मैं परमेश्वर की सेविका हूँ—मेरे साथ ज़बरदस्ती मत करो! मैं इकुनियुम के प्रतिष्ठित लोगों में से हूँ, और मुझे वह नगर इसलिए छोड़ना पड़ा क्योंकि मैंने थामिरिस से विवाह करने से इनकार कर दिया था।”


    7:5 तब उसने सिकन्दर को पकड़ लिया, उसका वस्त्र फाड़ दिया, उसके सिर से मुकुट[a] उतार लिया और सब लोगों के सामने उसे उपहास का पात्र बना दिया।


    7:6 सिकन्दर उसे राज्यपाल के पास ले गया—कुछ तो इसलिए कि वह उससे प्रेम करता था और कुछ इसलिए कि जो हुआ था उससे वह अपमानित महसूस कर रहा था। जब थेकला ने अपना किया स्वीकार कर लिया, तो राज्यपाल ने उसे जंगली पशुओं के बीच फेंके जाने की सज़ा सुनाई।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मुकुट” का सटीक रूप उपलब्ध साक्ष्य से निश्चित नहीं है; यह सम्भवतः पद या सार्वजनिक सम्मान से जुड़ा सिर का अलंकरण रहा हो सकता है।
    reason: स्रोत-समीक्षा लंबित होने के कारण वस्तु की पहचान को आवश्यकता से अधिक विशिष्ट बनाने से बचना।
lexical_decisions:
- source_word: magistrate
  choice: नगर का एक अधिकारी
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में पद का सटीक यूनानी नाम नहीं दिया गया है; अतः किसी विशिष्ट रोमी पदवी को आरोपित किए बिना नागरिक अधिकार का सामान्य अर्थ रखा गया।
- source_word: fell in love with her
  choice: उस पर मोहित हो गया
  rationale: प्रसंग में तत्काल आकर्षण और वासना-सदृश आग्रह है; आधुनिक हिन्दी में यह अभिव्यक्ति स्वाभाविक है और बाद के ‘प्रेम करता था’ से कथात्मक संबंध भी बनाए रखती है।
- source_word: engage Paul in his interest
  choice: पौलुस को अपने पक्ष में करने
  rationale: मुहावरे का आशय उपहारों से पौलुस का सहयोग या समर्थन प्राप्त करना है, न कि औपचारिक नियुक्ति।
- source_word: nor does she belong to me
  choice: न वह मेरी है
  rationale: स्वामित्व-सूचक और संबंध से इनकार करने वाली मूल तनावपूर्ण भाषा को स्पष्ट किए बिना जस का तस रखा गया है।
- source_word: one of the principal persons
  choice: प्रतिष्ठित लोगों में से
  rationale: यह सामाजिक प्रतिष्ठा या उच्च स्थिति को व्यक्त करता है, पर किसी निश्चित पद अथवा कुलीन उपाधि को आरोपित नहीं करता।
- source_word: crown
  choice: मुकुट
  rationale: उपलब्ध साक्ष्य के अनुसार वस्तु का सामान्य नाम रखा गया; उसके आकार, सामग्री या पदचिह्न होने का अनुमान नहीं लगाया गया।
- source_word: be thrown among the beasts
  choice: जंगली पशुओं के बीच फेंके जाने
  rationale: प्राचीन दण्ड की ठोस और कठोर छवि को सहज हिन्दी में सुरक्षित रखा गया।
theological_decisions:
- issue: थेकला का ‘परमेश्वर की सेविका’ होने का दावा
  choice: प्रत्यक्ष कथन के रूप में यथावत रखा
  alternative: इसे किसी औपचारिक कलीसियाई पद या मठवासी उपाधि के रूप में प्रस्तुत करना
  rationale: पाठ आत्म-पहचान देता है, पर किसी संस्थागत पद को परिभाषित नहीं करता; इसलिए बाद की परम्परागत श्रेणियाँ नहीं जोड़ी गईं।
- issue: पौलुस का थेकला से संबंध नकारना
  choice: ‘उसे मैं नहीं जानता, और न वह मेरी है’
  alternative: इसे केवल कानूनी अभिभावकत्व अथवा विवाह-संबंध का स्पष्ट निषेध बनाना
  rationale: कथन का नैतिक, व्यावहारिक और संबंधपरक तनाव जानबूझकर अनिर्णीत रखा गया है।
- issue: सिकन्दर के व्यवहार के लिए ‘प्रेम’ शब्द
  choice: पद 7:6 में साक्ष्य का ‘प्रेम’ रखा, जबकि पद 7:2 में ‘मोहित’ प्रयोग किया
  alternative: दोनों स्थानों पर ‘वासना’ कहना
  rationale: कथावाचक की शब्दावली को नैतिक व्याख्या से पूरी तरह प्रतिस्थापित नहीं किया गया, यद्यपि जबरदस्ती को स्पष्ट रूप से जबरदस्ती ही कहा गया है।
translation_notes:
  register: 'भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। हिंसा और सार्वजनिक अपमान को नरम नहीं किया गया। यह मसौदा दिए गए सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; प्रत्यक्ष यूनानी और प्राचीन अनुवाद-परम्परा की समीक्षा अभी लंबित है। नामों के रूप: पौलुस, उनेसिफुरुस, थेकला, अन्ताकिया, सिकन्दर, इकुनियुम और थामिरिस।'
