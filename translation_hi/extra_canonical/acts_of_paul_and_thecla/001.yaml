  text: '1:1 When Paul went up to Iconium after fleeing from Antioch, Demas and Hermogenes became his companions, though at that time they were full of hypocrisy.


    1:2 But Paul, looking only to the goodness of God, did them no harm and loved them greatly.


    1:3 So he tried to make all the oracles and teachings of Christ, and the purpose of the gospel of God’s dearly loved Son, pleasing to them, instructing them in the knowledge of Christ as it had been revealed to him.


    1:4 A certain man named Onesiphorus heard that Paul had come to Iconium and quickly went out to meet him, together with his wife Lectra and his sons Simmia and Xeno, to invite him into their house.


    1:5 For Titus had given them a description of Paul’s appearance. They did not yet know him in person, but knew only his character.


    1:6 They went along the king’s highway toward Lystra and stood there waiting for him, comparing everyone who passed by with the description Titus had given them.


    1:7 At last they saw a man coming—namely, Paul—who was short, bald (or shaved) on the head, with crooked thighs, handsome legs, hollow eyes, and a crooked nose. He was full of grace, for sometimes he appeared as a man, and sometimes he had the face of an angel. Paul saw Onesiphorus and was glad.


    1:8 Onesiphorus said, “Greetings, servant of the blessed God.” Paul replied, “May the grace of God be with you and your family.”


    1:9 But Demas and Hermogenes were moved with envy, and, making a show of great religion, Demas said, “Are we not also servants of the blessed God? Why did you not greet us?”


    1:10 Onesiphorus replied, “Because I have not seen the fruits of righteousness in you. Nevertheless, if you are of that kind, you will also be welcome in my house.”


    1:11 Then Paul entered the house of Onesiphorus, and there was great joy among the family because of this. They devoted themselves to prayer, the breaking of bread, and listening to Paul preach the word of God concerning self-control and the resurrection, as follows:


    1:12 “Blessed are the pure in heart, for they shall see God.


    1:13 “Blessed are those who keep their flesh undefiled (or pure), for they shall be the temple of God.


    1:14 “Blessed are the self-controlled (or chaste), for God will reveal himself to them.


    1:15 “Blessed are those who abandon their worldly pleasures, for they shall be accepted by God.


    1:16 “Blessed are those who have wives as though they did not have them, for they shall be made angels of God.


    1:17 “Blessed are those who tremble at the word of God, for they shall be comforted.


    1:18 “Blessed are those who keep their baptism pure, for they shall find peace with the Father, Son, and Holy Spirit.


    1:19 “Blessed are those who pursue the wisdom (or teaching) of Jesus Christ, for they shall be called sons of the Most High.


    1:20 “Blessed are those who observe the instructions of Jesus Christ, for they shall dwell in eternal light.


    1:21 “Blessed are those who, for the love of Christ, abandon the glories of the world, for they shall judge angels, be placed at the right hand of Christ, and not suffer the bitterness of the last judgment.


    1:22 “Blessed are the bodies and souls of virgins, for they are acceptable to God and shall not lose the reward of their virginity. For the word of their (heavenly) Father shall prove effective for their salvation on the day of his Son, and they shall enjoy rest forevermore.”'
translation:
  language: hi
  text: 'पौलुस और थिकला के काम — अध्याय 1


    1:1 जब पौलुस अन्ताकिया से भागने के बाद इकुनियुम गया, तब देमास और हरमुगिनेस उसके सहयात्री बन गए; पर उस समय वे कपट से भरे हुए थे।


    1:2 किन्तु पौलुस ने केवल परमेश्वर की भलाई पर ध्यान रखते हुए उनका कुछ बुरा नहीं किया, बल्कि उनसे बहुत प्रेम किया।


    1:3 इसलिए वह मसीह के सभी ईश-वचनों और शिक्षाओं को, और परमेश्वर के प्रिय पुत्र के सुसमाचार के अभिप्राय को, उनके लिए प्रिय बनाने का प्रयत्न करता रहा। इस प्रकार वह उन्हें मसीह का वह ज्ञान सिखाता था जो उस पर प्रकट किया गया था।


    1:4 उनेसिफुरुस नामक एक व्यक्ति ने सुना कि पौलुस इकुनियुम आया है। इसलिए वह अपनी पत्नी लेक्ट्रा और अपने पुत्रों सिम्मिया और जेनो के साथ शीघ्रता से उससे मिलने निकल पड़ा, ताकि उसे अपने घर आमंत्रित करे।


    1:5 क्योंकि तीतुस ने उन्हें पौलुस के रूप-रंग का वर्णन दिया था। वे अब तक उसे व्यक्तिगत रूप से नहीं जानते थे, केवल उसके चरित्र से परिचित थे।


    1:6 वे लुस्त्रा की ओर जाने वाले राजमार्ग पर गए और वहाँ खड़े होकर उसकी प्रतीक्षा करने लगे। जो भी उधर से गुजरता, वे उसके रूप की तुलना तीतुस के दिए हुए वर्णन से करते थे।


    1:7 अन्त में उन्होंने एक व्यक्ति को आते देखा—वह पौलुस था। उसका कद छोटा था, सिर गंजा था या मुंडा हुआ था,[a] जाँघें टेढ़ी थीं, पैर सुडौल थे, आँखें धँसी हुई थीं और नाक टेढ़ी थी। वह अनुग्रह से परिपूर्ण था, क्योंकि कभी वह साधारण मनुष्य-सा दिखाई देता और कभी उसका मुख स्वर्गदूत के मुख जैसा लगता था। पौलुस उनेसिफुरुस को देखकर आनन्दित हुआ।


    1:8 उनेसिफुरुस ने कहा, “धन्य परमेश्वर के सेवक, तुम्हें नमस्कार!” पौलुस ने उत्तर दिया, “परमेश्वर का अनुग्रह तुम्हारे और तुम्हारे परिवार के साथ रहे।”


    1:9 परन्तु देमास और हरमुगिनेस ईर्ष्या से भर गए। बड़ी धर्मपरायणता का दिखावा करते हुए देमास ने कहा, “क्या हम भी धन्य परमेश्वर के सेवक नहीं हैं? तुमने हमें नमस्कार क्यों नहीं किया?”


    1:10 उनेसिफुरुस ने उत्तर दिया, “क्योंकि मैंने तुममें धार्मिकता के फल नहीं देखे। फिर भी यदि तुम वैसे ही हो, तो मेरे घर में तुम्हारा भी स्वागत है।”


    1:11 तब पौलुस उनेसिफुरुस के घर गया और इस कारण सारे परिवार में बड़ा आनन्द हुआ। वे प्रार्थना करने, रोटी तोड़ने और पौलुस से संयम तथा पुनरुत्थान के विषय में परमेश्वर के वचन का यह उपदेश सुनने में लगे रहे:


    1:12 “धन्य हैं वे जिनके हृदय शुद्ध हैं, क्योंकि वे परमेश्वर को देखेंगे।


    1:13 “धन्य हैं वे जो अपने शरीर को निष्कलंक अर्थात् शुद्ध रखते हैं,[b] क्योंकि वे परमेश्वर का मन्दिर होंगे।


    1:14 “धन्य हैं वे जो संयमी अर्थात् पवित्र आचरण वाले हैं,[c] क्योंकि परमेश्वर अपने आपको उन पर प्रकट करेगा।


    1:15 “धन्य हैं वे जो सांसारिक सुखों को त्याग देते हैं, क्योंकि परमेश्वर उन्हें स्वीकार करेगा।


    1:16 “धन्य हैं वे जिनकी पत्नियाँ हैं, फिर भी वे ऐसे रहते हैं मानो उनकी पत्नियाँ न हों, क्योंकि उन्हें परमेश्वर के स्वर्गदूत बनाया जाएगा।


    1:17 “धन्य हैं वे जो परमेश्वर के वचन के सामने काँपते हैं, क्योंकि उन्हें शान्ति दी जाएगी।


    1:18 “धन्य हैं वे जो अपने बपतिस्मे को शुद्ध रखते हैं, क्योंकि वे पिता, पुत्र और पवित्र आत्मा के साथ शान्ति पाएँगे।


    1:19 “धन्य हैं वे जो यीशु मसीह की बुद्धि अर्थात् शिक्षा की खोज करते हैं,[d] क्योंकि वे परमप्रधान के पुत्र कहलाएँगे।


    1:20 “धन्य हैं वे जो यीशु मसीह के निर्देशों का पालन करते हैं, क्योंकि वे अनन्त ज्योति में निवास करेंगे।


    1:21 “धन्य हैं वे जो मसीह के प्रेम के कारण संसार का वैभव त्याग देते हैं, क्योंकि वे स्वर्गदूतों का न्याय करेंगे, मसीह के दाहिने हाथ बैठाए जाएँगे और अन्तिम न्याय की कड़वाहट नहीं सहेंगे।


    1:22 “धन्य हैं कुँवारों के शरीर और प्राण, क्योंकि वे परमेश्वर को स्वीकार्य हैं और अपने कुँवारेपन का प्रतिफल नहीं खोएँगे। उनके स्वर्गीय पिता का वचन उसके पुत्र के दिन उनके उद्धार के लिए प्रभावशाली सिद्ध होगा,[e] और वे सदा-सर्वदा विश्राम पाएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी गवाही में ‘गंजा (या सिर मुंडा हुआ)’—दोनों सम्भावनाएँ दी गई हैं।
    reason: रूप-वर्णन की वैकल्पिक पाठ-समझ को सुरक्षित रखना।
  - marker: b
    text: गवाही में ‘निष्कलंक’ के साथ ‘शुद्ध’ वैकल्पिक अर्थ के रूप में दिया गया है।
    reason: शारीरिक शुद्धता से जुड़ी शब्दगत अस्पष्टता बनाए रखना।
  - marker: c
    text: यहाँ शब्द का अर्थ सामान्य आत्म-संयम भी हो सकता है और विशेष रूप से यौन-संयम या पवित्रता भी।
    reason: तपस्वी और व्यापक नैतिक अर्थों में से किसी एक को अनावश्यक रूप से निश्चित न करना।
  - marker: d
    text: उपलब्ध गवाही ‘बुद्धि’ और ‘शिक्षा’ दोनों अर्थ देती है।
    reason: ज्ञान और सिद्धान्त/शिक्षा के बीच की शब्दगत सम्भावना सुरक्षित रखना।
  - marker: e
    text: ‘स्वर्गीय’ शब्द उपलब्ध गवाही में व्याख्यात्मक कोष्ठक में है; ‘प्रभावशाली सिद्ध होगा’ का आशय यह भी हो सकता है कि पिता का वचन उनके उद्धार को पूरा करेगा।
    reason: गवाही के व्याख्यात्मक जोड़ और कठिन वाक्य की अस्पष्टता बताना।
lexical_decisions:
- source_word: oracles
  choice: ईश-वचन
  rationale: यह ‘दैवी कथनों’ का भाव व्यक्त करता है और इसे सामान्य शिक्षा से अलग रखता है।
- source_word: temperance
  choice: संयम
  rationale: प्रसंग में आत्म-संयम तथा यौन-संयम दोनों की सम्भावना खुली रखता है।
- source_word: breaking of bread
  choice: रोटी तोड़ने
  rationale: प्राचीन मसीही पदावली को बिना यह तय किए सुरक्षित रखता है कि यहाँ सामान्य भोजन है या धार्मिक सहभागिता।
- source_word: baptism
  choice: बपतिस्मा
  rationale: आधुनिक हिन्दी मसीही प्रयोग में व्यापक और स्पष्ट शब्द।
- source_word: virgins
  choice: कुँवारों
  rationale: मूल गवाही के सामान्य बहुवचन को केवल स्त्रियों तक सीमित नहीं करता; अगली संज्ञा ‘कुँवारापन’ उसी स्थिति को व्यक्त करती है।
- source_word: rest
  choice: विश्राम
  rationale: मृत्यु-पश्चात अथवा अनन्त शान्ति के धार्मिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: ‘रोटी तोड़ना’ का धार्मिक स्वरूप
  choice: शाब्दिक पारम्परिक अभिव्यक्ति रखी गई
  alternative: प्रभु-भोज करना
  rationale: उपलब्ध गवाही स्वयं संस्कार का नाम स्पष्ट रूप से नहीं देती।
- issue: विवाहित पुरुषों का ‘मानो पत्नियाँ न हों’ रहना
