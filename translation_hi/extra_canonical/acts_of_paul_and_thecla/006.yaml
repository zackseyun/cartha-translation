  text: '6:1 Meanwhile, Paul, together with Onesiphorus, his wife, and children, was keeping a fast in a certain cave on the road from Iconium to Daphne.


    6:2 And when they had fasted for several days, the children said to Paul, “Father, we are hungry, and have not wherewithal to buy bread”; for Onesiphorus had left all his substance to follow Paul with his family.


    6:3 Then Paul, taking off his coat, said to the boy, “Go, child, buy bread, and bring it here.”


    6:4 But while the boy was buying the bread, he saw his neighbor Thecla and was surprised, and said to her, “Thecla, where are you going?”


    6:5 She replied, “I am in pursuit of Paul, having been delivered from the flames.”


    6:6 The boy then said, “I will bring you to him, for he is under great concern on your account and has been in prayer and fasting these six days.”


    6:7 When Thecla came to the cave, she found Paul on his knees praying and saying, “O holy Father, O Lord Jesus Christ, grant that the fire may not touch Thecla; but be her helper, for she is your servant.”


    6:8 Thecla then, standing behind him, cried out in these words: “O sovereign Lord, Creator of heaven and earth, the Father of your beloved and holy Son, I praise you that you have preserved me from the fire, to see Paul again.”


    6:9 Paul then arose, and when he saw her, said, “O God, who searches the heart, Father of my Lord Jesus Christ, I praise you that you have answered my prayer.”


    6:10 And there prevailed among them in the cave an entire affection for each other, Paul, Onesiphorus, and all who were with them being filled with joy.


    6:11 They had five loaves, some herbs, and water, and they solaced each other in reflections upon the holy works of Christ.


    6:12 Then Thecla said to Paul, “If you are pleased with it, I will follow you wherever you go.”


    6:13 He replied to her, “Persons are now much given to fornication, and you being handsome, I am afraid lest you should meet with greater temptation than the former, and should not withstand, but be overcome by it.”


    6:14 Thecla replied, “Grant me only the seal of Christ, and no temptation shall affect me.”


    6:15 Paul answered, “Thecla, wait with patience, and you shall receive the gift of Christ.”'
translation:
  language: hi
  text: 'पौलुस और थेकला के काम — अध्याय 6


    6:1 इसी बीच पौलुस, उनेसिफुरुस, उसकी पत्नी और उसके बच्चों के साथ, इकुनियुम से दफ्ने जानेवाले मार्ग पर एक गुफा में उपवास कर रहा था।


    6:2 जब उन्हें उपवास करते हुए कई दिन हो गए, तो बच्चों ने पौलुस से कहा, “पिता, हमें भूख लगी है और हमारे पास रोटी खरीदने के लिए कुछ नहीं है।” क्योंकि उनेसिफुरुस अपना सब कुछ छोड़कर अपने परिवार सहित पौलुस के पीछे हो लिया था।


    6:3 तब पौलुस ने अपना चोगा उतारकर लड़के को दिया और कहा, “बेटे, जाओ, रोटी खरीदकर यहाँ ले आओ।”


    6:4 जब लड़का रोटी खरीद रहा था, तब उसने अपनी पड़ोसिन थेकला को देखा। वह चकित हुआ और उससे बोला, “थेकला, तुम कहाँ जा रही हो?”


    6:5 उसने उत्तर दिया, “मैं पौलुस को खोज रही हूँ; मुझे आग की लपटों से बचा लिया गया है।”


    6:6 तब लड़के ने कहा, “मैं तुम्हें उनके पास ले चलूँगा, क्योंकि उन्हें तुम्हारी बहुत चिंता है और वे छह दिन से प्रार्थना और उपवास कर रहे हैं।”


    6:7 जब थेकला गुफा में पहुँची, तो उसने पौलुस को घुटनों के बल प्रार्थना करते और यह कहते पाया, “हे पवित्र पिता, हे प्रभु यीशु मसीह, ऐसा कर कि आग थेकला को न छुए; उसकी सहायता कर, क्योंकि वह तेरी सेविका है।”


    6:8 तब थेकला ने उनके पीछे खड़े होकर पुकारा, “हे सर्वसत्ताधारी प्रभु, स्वर्ग और पृथ्वी के सृष्टिकर्ता, अपने प्रिय और पवित्र पुत्र के पिता, मैं तेरी स्तुति करती हूँ कि तूने मुझे आग से बचाया, ताकि मैं पौलुस को फिर देख सकूँ।”


    6:9 तब पौलुस उठ खड़ा हुआ और उसे देखकर बोला, “हे हृदय को परखनेवाले परमेश्वर, मेरे प्रभु यीशु मसीह के पिता, मैं तेरी स्तुति करता हूँ कि तूने मेरी प्रार्थना सुन ली है।”


    6:10 गुफा में उन सबके बीच गहरा प्रेम छा गया। पौलुस, उनेसिफुरुस और उनके साथ के सभी लोग आनंद से भर गए।


    6:11 उनके पास पाँच रोटियाँ, कुछ साग-पात और पानी था। वे मसीह के पवित्र कार्यों पर विचार करते हुए एक-दूसरे को सांत्वना देते रहे।


    6:12 तब थेकला ने पौलुस से कहा, “यदि आपको उचित लगे, तो आप जहाँ कहीं जाएँगे, मैं आपके पीछे चलूँगी।”


    6:13 उन्होंने उससे कहा, “आजकल लोग व्यभिचार में बहुत लिप्त हैं, और तुम सुंदर हो। मुझे डर है कि कहीं तुम पहले से भी बड़ी परीक्षा में न पड़ जाओ और उसका सामना न कर सको, बल्कि उससे हार जाओ।”


    6:14 थेकला ने उत्तर दिया, “मुझे केवल मसीह की मुहर[a] दे दीजिए, फिर कोई परीक्षा मुझ पर प्रभाव न डालेगी।”


    6:15 पौलुस ने कहा, “थेकला, धीरज रखकर प्रतीक्षा करो; तुम्हें मसीह का वरदान[b] मिलेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मसीह की मुहर” संभवतः दीक्षा या बपतिस्मा से जुड़ी अभिव्यक्ति है, पर यहाँ उसका अर्थ स्पष्ट करके सीमित नहीं किया गया है।
    reason: संस्कारात्मक पदबंध की वास्तविक अस्पष्टता सुरक्षित रखने के लिए।
  - marker: b
    text: “मसीह का वरदान” को स्रोत में किसी एक विशिष्ट संस्कार या अनुभव के रूप में स्पष्ट नहीं किया गया है।
    reason: ‘मुहर’ और ‘वरदान’ को बिना पर्याप्त स्रोत-साक्ष्य के समान ठहराने से बचने के लिए।
lexical_decisions:
- source_word: coat
  choice: चोगा
  rationale: प्रसंग में ऐसा बाहरी वस्त्र अभिप्रेत है जिसे उतारकर रोटी खरीदने के साधन के रूप में दिया जा सकता था; आधुनिक पाठक के लिए ‘चोगा’ स्पष्ट और स्वाभाविक है।
- source_word: Father
  choice: पिता
  rationale: बच्चों द्वारा पौलुस के लिए प्रयुक्त सम्मानपूर्ण और आत्मीय संबोधन को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: fornication
  choice: व्यभिचार
  rationale: यौन अनैतिकता के गंभीर नैतिक भाव को dignified और सामान्य हिन्दी में व्यक्त करता है, यद्यपि मूल यूनानी की प्रत्यक्ष समीक्षा लंबित है।
- source_word: seal of Christ
  choice: मसीह की मुहर
  rationale: धार्मिक-संस्कारात्मक अभिव्यक्ति की संभावित बहुअर्थकता को व्याख्यायित किए बिना अक्षुण्ण रखा गया है।
- source_word: gift of Christ
  choice: मसीह का वरदान
  rationale: ‘gift’ के अनुग्रहपूर्ण धार्मिक अर्थ को बनाए रखता है और इसे किसी विशिष्ट संस्कार के रूप में सीमित नहीं करता।
- source_word: holy works of Christ
  choice: मसीह के पवित्र कार्य
  rationale: स्रोत-साक्ष्य की अभिव्यक्ति को औपचारिक निकटता से रखा गया है; ‘works’ को शिक्षा या चमत्कार तक सीमित नहीं किया गया।
theological_decisions:
- issue: 6:7 में ‘पवित्र पिता’ और ‘प्रभु यीशु मसीह’ का संबोधन
  choice: दोनों संबोधनों को स्रोत-साक्ष्य के क्रम में यथावत रखा गया
  alternative: पूरी प्रार्थना को केवल पिता अथवा केवल यीशु को संबोधित मानकर पुनर्गठित करना
  rationale: वाक्य में संबोधन की संभावित धार्मिक/व्याकरणिक अस्पष्टता है; अनुवाद ने उसे चुपचाप हल नहीं किया।
- issue: ‘मसीह की मुहर’ का अर्थ
  choice: शाब्दिक धार्मिक पदबंध बनाए रखा और पादटिप्पणी दी
  alternative: इसे सीधे ‘बपतिस्मा’ कहना
  rationale: यह बपतिस्मा, दीक्षा, संरक्षण या संबंधित संस्कारात्मक धारणा की ओर संकेत कर सकता है, पर उपलब्ध साक्ष्य इसे एक ही अर्थ में निश्चित नहीं करता।
- issue: ‘मसीह का वरदान’ और ‘मुहर’ का संबंध
  choice: दोनों को अलग पदबंधों के रूप में रखा
  alternative: वरदान को स्पष्टतः वही मुहर या बपतिस्मा घोषित करना
  rationale: पाठ संबंध का संकेत देता है, पर पूर्ण समानता को स्पष्ट नहीं करता; धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। संवादों में वर्तमान प्रचलित आदरसूचक रूप रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मूल यूनानी और संस्करणगत पांडुलिपियों की प्रत्यक्ष समीक्षा लंबित होने के कारण संदिग्ध धार्मिक पदबंधों को जानबूझकर व्याख्यायित नहीं किया गया।
