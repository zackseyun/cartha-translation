  text: '**बरनबास 10**


    क्योंकि मूसा ने कहा, “तुम सूअर, उकाब, बाज़, चील या कौआ न खाना, और ऐसी कोई मछली भी न खाना जिस पर शल्क न हों,” इसलिए उसने इन बातों में तीन नियमों का अर्थ समझा।[a]


    और व्यवस्थाविवरण में वह उनसे यह भी कहता है, “मैं अपने नियम इस प्रजा पर वाचा के रूप में रखूँगा।” इसलिए परमेश्वर की आज्ञा का आशय यह नहीं है कि वे अपने दाँतों से कुछ न चबाएँ; बल्कि मूसा ने आत्मिक अर्थ में यह कहा था।


    इसी अभिप्राय से उसने सूअर का उल्लेख किया: “तुम ऐसे लोगों से न जुड़ना,” वह कहता है, “जो सूअर के समान हैं।” अर्थात् जब वे सुख-सुविधा में होते हैं, तो प्रभु को भूल जाते हैं; पर जब अभाव में पड़ते हैं, तो प्रभु को पहचानते हैं। इसी प्रकार सूअर खाते समय अपने स्वामी को नहीं पहचानता, पर भूखा होने पर चिल्लाता है और भोजन मिलते ही फिर चुप हो जाता है।


    “तुम उकाब, बाज़, चील या कौआ भी न खाना।” वह कहता है, “तुम ऐसे लोगों से न जुड़ना और न उनके समान बनना, जो परिश्रम और पसीना बहाकर अपने लिए भोजन जुटाना नहीं जानते, बल्कि अधर्म करके दूसरों की वस्तुएँ छीन लेते हैं। वे ऐसे दिखाई देते हैं मानो निष्कपटता से घूम रहे हों, पर अपनी लूट की लालसा में ताक लगाए रहते और किसी को लूटने के लिए खोजते हैं।” इसी प्रकार ये पक्षी अपने लिए भोजन नहीं जुटाते, बल्कि निकम्मे बैठे रहते हैं और यह ढूँढ़ते हैं कि दूसरों का मांस कैसे खाएँ; अपने बुरे कामों से वे विनाशकारी हैं।


    वह कहता है, “तुम लैम्प्रे, ऑक्टोपस या कटलफ़िश भी न खाना।” उसका आशय है, “तुम ऐसे लोगों के समान न बनना जो पूरी तरह दुष्ट हैं और पहले ही मृत्यु-दण्ड के अधीन हैं।” ये मछलियाँ भी मानो शापित हैं: वे दूसरी मछलियों की तरह सतह के पास नहीं तैरतीं, बल्कि गहराइयों में तैरती और गहरे समुद्र के तल पर रहती हैं।


    इसके अतिरिक्त, “तुम खरगोश न खाना।” क्यों? “तुम बालकों का यौन शोषण करनेवाले न बनना और न ऐसे लोगों के समान होना।” क्योंकि कहा जाता था कि खरगोश के शरीर में हर वर्ष एक नया छिद्र बनता है; वह जितने वर्ष जीवित रहता है, उसके उतने ही छिद्र होते हैं।[b]


    फिर, “तुम लकड़बग्घा भी न खाना।” वह कहता है, “तुम व्यभिचारी या यौन-अनैतिक व्यक्ति न बनना और न ऐसे लोगों के समान होना।” क्यों? क्योंकि कहा जाता था कि यह पशु वर्ष-प्रतिवर्ष अपना लिंग बदलता है—कभी नर और कभी मादा हो जाता है।[c]


    उसने नेवले से भी घृणा की, और उचित ही की। वह कहता है, “तुम उन लोगों के समान न बनना जिनके विषय में हम सुनते हैं कि वे अशुद्धता के लिए अपने मुँह से अधर्म करते हैं; और न उन अशुद्ध स्त्रियों से जुड़ना जो अपने मुँह से अधर्म करती हैं।” क्योंकि कहा जाता था कि यह पशु मुँह से गर्भ धारण करता है।[d]


    इस प्रकार भोजन के विषय में मूसा ने ये तीन निर्देश पाए और उन्हें आत्मिक अर्थ में कहा; पर उन्होंने शारीरिक लालसा के अनुसार इन्हें ग्रहण किया, मानो ये केवल खाने के विषय में हों।


    दाऊद को भी इन्हीं तीन निर्देशों का ज्ञान मिला और उसने कहा, “धन्य है वह मनुष्य जो दुष्टों की सलाह पर नहीं चलता”—जैसे मछलियाँ अँधेरे में गहराइयों तक जाती हैं—“और पापियों के मार्ग में खड़ा नहीं होता”—जैसे वे लोग जो प्रभु का भय मानने का दिखावा करते हुए सूअरों के समान पाप करते हैं—“और विनाश करनेवालों की सभा में नहीं बैठता”—जैसे वे पक्षी जो शिकार की ताक में बैठे रहते हैं। अब तुमने भोजन के विषय में पूरी शिक्षा पा ली है।


    मूसा फिर कहता है, “तुम हर उस पशु को खाना जिसका खुर चिरा हुआ हो और जो जुगाली करता हो।” इसका क्या अर्थ है? जो भोजन पाता है, वह भोजन देनेवाले को पहचानता है और तृप्त होकर उसमें आनन्दित दिखाई देता है। आज्ञा को ध्यान में रखते हुए मूसा ने यह बात ठीक कही। तो फिर इसका अर्थ क्या है? उन लोगों से जुड़े रहो जो प्रभु का भय मानते हैं; जो पाए हुए वचन के भेद पर अपने हृदय में मनन करते हैं; जो प्रभु के नियमों की चर्चा करते और उनका पालन करते हैं; जो जानते हैं कि मनन करना आनन्द का काम है और जो प्रभु के वचन की जुगाली करते हैं। लेकिन चिरे हुए खुर का क्या अर्थ है? यह कि धर्मी मनुष्य इस संसार में चलता भी है और साथ ही आनेवाले पवित्र संसार की बाट भी जोहता है। तुम देखते हो कि मूसा कितना बुद्धिमान व्यवस्थापक था।


    पर वे इन बातों को कैसे जान या समझ सकते थे? फिर भी हमने आज्ञाओं को ठीक प्रकार से समझा है और उन्हें वैसा ही बताते हैं जैसा प्रभु ने चाहा। इसी उद्देश्य से उसने हमारे कानों और हृदयों का खतना किया, ताकि हम इन बातों को समझ सकें।[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ उपलब्ध अंग्रेज़ी साक्षी में “seine” स्पष्टतः मुद्रण-दोष है; प्रसंग के आधार पर “swine” अर्थात् “सूअर” ग्रहण किया गया है। इस अनुच्छेद की प्रत्यक्ष यूनानी/लातीनी स्रोत-समीक्षा अभी लंबित है।
    reason: पाठगत सुधार और मसौदे की स्रोत-सीमा पारदर्शी करना।
  - marker: b
    text: खरगोश के शरीर के विषय में यह प्राचीन धारणा आधुनिक प्राणिविज्ञान के अनुसार सही नहीं है; इसे लेखक के तर्क के ऐतिहासिक अंग के रूप में ज्यों का त्यों रखा गया है।
    reason: प्राचीन प्राकृतिक-विज्ञान सम्बन्धी दावे को आधुनिक तथ्य के रूप में पढ़े जाने से रोकना।
  - marker: c
    text: लकड़बग्घे के हर वर्ष नर और मादा बनने की बात प्राचीन धारणा है, आधुनिक प्राणिवैज्ञानिक तथ्य नहीं।
    reason: ऐतिहासिक दावा सुरक्षित रखते हुए तथ्यगत पारदर्शिता।
  - marker: d
    text: नेवले के मुँह से गर्भ धारण करने की बात भी एक प्राचीन धारणा है, आधुनिक प्राणिवैज्ञानिक तथ्य नहीं।
    reason: लेखक की उपमा को बिना सुधारवादी सामंजस्य के संरक्षित करना।
  - marker: e
    text: “कानों और हृदयों का खतना” शारीरिक क्रिया नहीं, समझने और आज्ञाकारी होने की भीतरी क्षमता का बाइबलीय रूपक है।
    reason: असामान्य रूपक को बनाए रखते हुए सामान्य पाठक की सहायता करना।
