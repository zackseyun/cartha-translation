base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/017.yaml
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
translation:
  language: hi
  text: 'जहाँ तक मेरे लिए संभव था, मैंने तुम्हें पूरी सरलता से सब कुछ समझाया है। मेरी आत्मा को आशा है कि मैंने [उद्धार से सम्बन्धित बातों में से] कुछ भी नहीं छोड़ा और इस प्रकार अपनी अभिलाषा में विफल नहीं हुआ।[a]


    क्योंकि यदि मैं तुम्हें तात्कालिक या भविष्य की बातों के विषय में लिखता, तो तुम उन्हें समझ न पाते, क्योंकि वे दृष्टान्तों में कही गई हैं। इस विषय में इतना ही।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वर्ग कोष्ठकों के भीतर का अंश उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य में पाठ की बहाली या पांडुलिपि-क्षति का संकेत देता है। प्रत्यक्ष यूनानी/लातीनी स्रोत-समीक्षा अभी लंबित है।
    reason: पाठ-संदिग्ध सामग्री को पाठक के लिए दृश्यमान रखा गया है; कोष्ठक का स्थान हिन्दी वाक्य-विन्यास के लिए समायोजित है।
lexical_decisions:
- source_word: with all simplicity
  choice: पूरी सरलता से
  rationale: यह अभिव्यक्ति कथन की सरल और स्पष्ट रीति को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: my soul hopeth
  choice: मेरी आत्मा आशा करती है
  rationale: प्राचीन पत्रात्मक और आत्मीय अभिव्यक्ति को सामान्यीकृत किए बिना यथासंभव औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: things immediate or future
  choice: वर्तमान या भविष्य की बातें
  rationale: अंग्रेज़ी साक्ष्य के immediate को प्रसंगानुसार वर्तमान माना गया है; प्रत्यक्ष यूनानी/लातीनी समीक्षा लंबित होने के कारण इसे टिप्पणी में सावधानी के साथ दर्ज किया गया है।
- source_word: parables
  choice: दृष्टान्तों
  rationale: धार्मिक-साहित्यिक संदर्भ में यह परिचित और व्यापक हिन्दी पद है, और रूपकात्मक कथन की संभावित व्यापकता को पूरी तरह समाप्त नहीं करता।
- source_word: So much then for this
  choice: इस विषय में इतना ही
  rationale: अनुच्छेद-समापन का स्वाभाविक, संक्षिप्त और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: कोष्ठकित उद्धार-संबंधी वाक्यांश की पाठ-संदिग्ध स्थिति
  choice: वर्ग कोष्ठकों में सुरक्षित रखा और [a] से स्पष्ट किया
  alternative: इसे निर्विवाद मूल पाठ की तरह बिना कोष्ठक छापना, या पूरी तरह हटा देना
  rationale: प्रदत्त साक्ष्य बहाली अथवा पांडुलिपि-क्षति का संकेत देता है; इसलिए इसके धर्मवैचारिक आशय को निश्चित पाठ मानना उचित नहीं।
- issue: ‘उद्धार’ से संबंधित बातों को लेखक के उद्देश्य से जोड़ना
  choice: अर्थगत तनाव को यथावत रखा
  alternative: वाक्य को सहज बनाने के लिए लेखक की सफलता का निश्चित दावा बना देना
  rationale: स्रोत-साक्ष्य आशा और संभावित विफलता दोनों व्यक्त करता है; अनुवाद ने इस विनम्र अनिश्चितता को नहीं मिटाया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है। मसौदा प्रदत्त सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है, क्योंकि प्रत्यक्ष यूनानी/लातीनी स्रोत-समीक्षा उपलब्ध नहीं कराई गई; इसलिए अस्पष्टताओं को निर्णायक ढंग से हल नहीं किया गया।
