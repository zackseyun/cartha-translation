  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
translation:
  language: hi
  text: 'हाँ, निश्चय ही। पर उस वाचा के विषय में, जिसे उसने पूर्वजों से शपथ खाकर लोगों को देने की प्रतिज्ञा की थी, आइए देखें कि क्या उसने सचमुच उसे दिया। उसने उसे दिया, पर वे अपने पापों के कारण उसे पाने के योग्य नहीं पाए गए।


    क्योंकि भविष्यद्वक्ता कहता है, “मूसा सीनै पर्वत पर चालीस दिन और चालीस रात उपवास करता रहा, ताकि वह प्रभु की वाचा पाए और उसे लोगों को दे। और [मूसा][a] ने प्रभु से वे दो पटियाएँ पाईं, जो आत्मा में[b] प्रभु के हाथ की उँगली से लिखी गई थीं।” तब मूसा उन्हें लेकर नीचे आया, ताकि उन्हें लोगों को दे।


    और प्रभु ने मूसा से कहा, “मूसा, मूसा, शीघ्र नीचे जा, क्योंकि तेरे लोग, जिन्हें तू मिस्र देश से निकाल लाया है, दुष्टता कर बैठे हैं।” मूसा ने देखा कि उन्होंने फिर अपने लिए ढली हुई मूर्तियाँ बना ली हैं। तब उसने पटियाएँ अपने हाथों से फेंक दीं, और प्रभु की वाचा की पटियाएँ चकनाचूर हो गईं।


    मूसा ने उन्हें पाया था, पर वे स्वयं उनके योग्य नहीं पाए गए। किंतु हमने उन्हें कैसे पाया? इस पर ध्यान दो: मूसा ने उन्हें एक सेवक के रूप में पाया, पर स्वयं प्रभु ने हमारे लिए धीरज से दुःख सहकर उन्हें हमें दिया, ताकि हम उसकी विरासत की प्रजा बनें।


    पर वह इसलिए प्रकट हुआ कि एक ही समय में वे अपने पापों में परिपूर्ण हो जाएँ, और हम उस वाचा को उसके द्वारा पाएँ जो उसका उत्तराधिकारी था—अर्थात प्रभु यीशु। उसे इसी उद्देश्य के लिए पहले से तैयार किया गया था कि वह स्वयं प्रकट होकर हमारे हृदयों को अंधकार से छुड़ाए—उन हृदयों को जो पहले ही मृत्यु के हाथ सौंपे जा चुके थे और भटकावे की दुष्टता के वश में कर दिए गए थे—और इस प्रकार वचन के द्वारा हमारे भीतर वाचा स्थापित करे।


    क्योंकि लिखा है कि पिता उसे हमें अंधकार से छुड़ाने और अपने लिए एक पवित्र प्रजा तैयार करने की आज्ञा देता है।


    इसलिए भविष्यद्वक्ता कहता है, “मैं, प्रभु तेरा परमेश्वर, ने धार्मिकता में तुझे बुलाया है। मैं तेरा हाथ थामूँगा और तुझे सामर्थ्य दूँगा। मैंने तुझे वंश के लिए वाचा और अन्यजातियों के लिए ज्योति बनाया है, ताकि तू अंधों की आँखें खोले, बंधुओं को उनकी बेड़ियों से निकाले और अंधकार में बैठे हुओं को बंदीगृह से बाहर लाए।” इसलिए हम समझते हैं कि हमें कहाँ से छुड़ाया गया।


    फिर भविष्यद्वक्ता कहता है, “देख, मैंने तुझे अन्यजातियों के लिए ज्योति ठहराया है, ताकि तू पृथ्वी के छोर तक उद्धार का साधन बने।” तुझे छुड़ाने वाला प्रभु, अर्थात परमेश्वर, ऐसा कहता है।


    फिर भविष्यद्वक्ता कहता है, “प्रभु का आत्मा मुझ पर है; इसलिए उसने मेरा अभिषेक किया कि मैं दीनों को शुभ समाचार सुनाऊँ। उसने मुझे भेजा है कि टूटे मनवालों को चंगा करूँ, बंदियों के लिए रिहाई और अंधों के लिए दृष्टि की पुनःप्राप्ति की घोषणा करूँ, प्रभु के कृपा-वर्ष और प्रतिफल के दिन का प्रचार करूँ, और सब शोक करने वालों को सांत्वना दूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नाम “मूसा” उपलब्ध अंग्रेज़ी साक्ष्य में संपादकीय पूर्ति के रूप में कोष्ठकों में है।
    reason: पाठ में पुनर्स्थापित नाम की संपादकीय स्थिति पारदर्शी रखना आवश्यक है।
  - marker: b
    text: “आत्मा में” मूल अभिव्यक्ति की असामान्य शब्दावली को बनाए रखता है; इसका आशय “आत्मा के द्वारा” भी समझा जा सकता है।
    reason: साधन और क्षेत्र/अवस्था के बीच अर्थगत अस्पष्टता को चुपचाप हल नहीं किया गया।
lexical_decisions:
- source_word: covenant
  choice: वाचा
  rationale: यह बाइबलीय और आरंभिक मसीही साहित्य में स्वाभाविक, संक्षिप्त तथा धार्मिक रूप से तटस्थ पद है।
- source_word: fathers
  choice: पूर्वजों
  rationale: आधुनिक हिन्दी में वंशगत पुरखों का अर्थ स्पष्ट करता है और केवल जैविक पिताओं का भ्रम टालता है।
- source_word: cast-metal images / molten images
  choice: ढली हुई मूर्तियाँ
  rationale: धातु ढालकर बनाई गई प्रतिमाओं का आशय सहज हिन्दी में व्यक्त होता है।
- source_word: people of his inheritance
  choice: उसकी विरासत की प्रजा
  rationale: स्वामित्व और विरासत, दोनों मूल रूपकों को बनाए रखता है; इसे व्याख्यात्मक रूप से केवल 'चुनी हुई प्रजा' नहीं बनाया गया।
- source_word: word
  choice: वचन
  rationale: संदर्भ की धार्मिक प्रतिध्वनि बनाए रखते हुए यह तय नहीं करता कि यहाँ उपदेश, संदेश या व्यक्तिवाचक लोगोस में से कौन-सा आशय प्रधान है।
- source_word: race
  choice: वंश
  rationale: दिए गए साक्ष्य के असामान्य पद को 'इस्राएल' या 'लोगों' में बदलकर उसकी अस्पष्टता समाप्त नहीं की गई।
- source_word: Gentiles
  choice: अन्यजातियाँ
  rationale: यह यहूदी और गैर-यहूदी समुदायों के बीच मूल ऐतिहासिक भेद को सुरक्षित रखता है।
- source_word: acceptable year
  choice: कृपा-वर्ष
  rationale: शाब्दिक 'स्वीकार्य वर्ष' की अपेक्षा अर्थ अधिक स्वाभाविक है और प्रभु की अनुग्रहपूर्ण स्वीकृति का भाव रखता है।
- source_word: day of recompense
  choice: प्रतिफल का दिन
  rationale: इसमें न्याय, बदला और प्रतिदान की संभावनाएँ खुली रहती हैं; किसी एक दंडात्मक अर्थ को अनिवार्य नहीं किया गया।
theological_decisions:
- issue: “they might be brought to completion in their sins” का कठिन कथन
  choice: “वे अपने पापों में परिपूर्ण हो जाएँ”
  alternative: “उनके पाप अपनी चरम सीमा तक पहुँच जाएँ”
  rationale: लेखक के तीखे और धर्मवैचारिक रूप से तनावपूर्ण कथन को नरम या कारणात्मक व्याख्या में बदले बिना सुरक्षित रखा गया।
- issue: यीशु द्वारा वाचा को विरासत में पाना
  choice: “जो उसका उत्तराधिकारी था—अर्थात प्रभु यीशु”
  alternative: “जिसे वह वाचा विरासत में मिली थी”
  rationale: साक्ष्य की व्याकरणिक संक्षिप्तता और उत्तराधिकार की धारणा रखी गई, बिना यह समझाए कि उत्तराधिकार किस विशेष धर्मसैद्धांतिक अर्थ में है।
- issue: “through the word” में ‘वचन’ की पहचान
  choice: “वचन के द्वारा”
  alternative: “संदेश के द्वारा”
  rationale: व्यक्तिगत लोगोस और घोषित संदेश के बीच संभावित अर्थगत खुलापन बनाए रखा गया।
- issue: अंधकार से छुड़ाए जाने का स्रोत
  choice: “हम समझते हैं कि हमें कहाँ से छुड़ाया गया”
  alternative: “हम समझते हैं कि हमें किससे छुड़ाया गया”
  rationale: दिए गए साक्ष्य के स्थान-सूचक रूपक को रखा गया; इसे केवल पाप या शैतान जैसी किसी निश्चित सत्ता से नहीं जोड़ा गया।
- issue: मूसा और प्रभु के बीच सेवक-पुत्र जैसी संभावित तुलना
  choice: केवल “एक सेवक के रूप में” और “स्वयं प्रभु” का विरोध रखा गया
  alternative: मूसा को सेवक और यीशु को पुत्र कहना
  rationale: स्रोत में स्पष्ट रूप से न दिए गए ‘पुत्र’ पद या बाद की धर्मसैद्धांतिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु पठनीय शैली अपनाई गई है। उद्धरणों में बाइबलीय लय रखी गई, पर अत्यधिक संस्कृतनिष्ठ या पुरातन क्रियारूपों से बचा गया। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और परामर्श-पाठ पर आधारित है; यूनानी/लैटिन स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण संदिग्ध या असामान्य पदों को यथासंभव खुला रखा गया है।
