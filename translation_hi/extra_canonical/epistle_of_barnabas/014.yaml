    issue: “बंधुओं को उनकी बेड़ियों से निकाले”
    rationale: In standard Hindi, “बंधु” ordinarily means a relative, kinsman, or brother, not a prisoner or a person bound. This reverses the immediate sense of “them that are bound.” It is corrected to “जो बंधे हुए हैं उन्हें उनकी बेड़ियों से निकाले.”
