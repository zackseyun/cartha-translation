  revised_text: '9 फिर कानों के विषय में वह कहता है कि उसने हमारे हृदय का खतना किया है। प्रभु भविष्यद्वक्ता के द्वारा कहता है, “उन्होंने अपने कानों से मेरी सुनी।” और वह फिर कहता है, “जो दूर हैं वे अपने कानों से सुनेंगे और समझेंगे कि मैंने क्या किया है।” और प्रभु कहता है, “अपने हृदयों का खतना करो।”


