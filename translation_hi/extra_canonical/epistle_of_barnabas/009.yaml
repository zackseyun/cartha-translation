  language: hi
  text: '9 फिर कानों के विषय में वह कहता है कि उसने हमारे हृदय का खतना किया है। प्रभु भविष्यद्वक्ता के द्वारा कहता है, “उन्होंने अपने कानों से सुनकर मेरी बात मानी।” और वह फिर कहता है, “जो दूर हैं वे अपने कानों से सुनेंगे और समझेंगे कि मैंने क्या किया है।” और प्रभु कहता है, “अपने हृदयों का खतना करो।”


    और वह फिर कहता है, “हे इस्राएल, सुन, क्योंकि तेरा परमेश्वर प्रभु यह कहता है: जो सदा जीवित रहना चाहता है, वह अपने कानों से मेरे सेवक की आवाज़ सुने।” और वह फिर कहता है, “हे आकाश, सुन, और हे पृथ्वी, कान लगा, क्योंकि प्रभु ने ये बातें गवाही के लिए कही हैं।” और वह फिर कहता है, “हे इस प्रजा के शासको, प्रभु के वचन सुनो।” और वह फिर कहता है, “हे मेरे बच्चो, जंगल में पुकारनेवाले की आवाज़ सुनो।” इसलिए उसने हमारे कानों का खतना किया, ताकि हम वचन सुनकर विश्वास करें।


    परन्तु जिस खतने पर वे भरोसा रखते हैं, वह रद्द कर दिया गया है; क्योंकि उसने कहा है कि ऐसा खतना किया जाना चाहिए जो शरीर का न हो। पर उन्होंने आज्ञा का उल्लंघन किया, क्योंकि एक दुष्ट दूत ने उन्हें चतुराई सिखाई।


    वह उनसे कहता है, “तुम्हारा परमेश्वर प्रभु यह कहता है”—आज्ञा मुझे इसी रूप में मिलती है—“काँटों के बीच मत बोओ; अपने प्रभु के लिए खतना कराओ।”[a] और वह क्या कहता है? “अपने हृदय की कठोरता का खतना करो, तब तुम अपनी गर्दन कठोर नहीं करोगे।” यह भी लो: प्रभु कहता है, “देखो, सभी गैर-यहूदी अपनी खलड़ी में खतनारहित हैं, पर यह प्रजा अपने हृदयों में खतनारहित है।”


    पर तुम कहोगे, “वास्तव में इस प्रजा का खतना मुहर के रूप में हुआ है।” नहीं, क्योंकि हर सीरियाई और अरबी का, और मूर्तियों के सभी पुरोहितों का भी खतना होता है। तो क्या वे सब भी उनकी वाचा में सम्मिलित हैं? इतना ही नहीं, मिस्री भी खतना किए हुए लोगों में गिने जाते हैं।


    इसलिए, हे प्रेम की सन्तानो, सब बातों को भली-भाँति समझो: अब्राहम ने, जिसने सबसे पहले खतना ठहराया, आत्मा में यीशु की ओर पहले से देखते हुए खतना किया, क्योंकि उसे तीन अक्षरों का विधान मिला था।


    क्योंकि पवित्रशास्त्र कहता है, “अब्राहम ने अपने घराने के अठारह और तीन सौ पुरुषों का खतना किया।”[b] तो उसे कौन-सा ज्ञान दिया गया था? समझो कि वह पहले अठारह कहता है और फिर कुछ अन्तर देकर तीन सौ। अठारह में “Ι” दस का और “Η” आठ का चिह्न है। यहाँ तुम्हें यीशु—ΙΗΣΟΥΣ—मिलता है।[c] और क्योंकि “Τ” में क्रूस को अनुग्रह लाना था, इसलिए वह तीन सौ भी कहता है।[d] इस प्रकार वह दो अक्षरों में यीशु को और बचे हुए एक अक्षर में क्रूस को प्रकट करता है।


    वह जानता है जिसने हमारे भीतर अपनी वाचा का जन्मजात वरदान रखा है: किसी ने मुझसे इससे अधिक प्रामाणिक वचन कभी नहीं सीखा। पर मैं जानता हूँ कि तुम इसके योग्य हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने प्रभु के लिए खतना कराओ” उपलब्ध साक्ष्य का कठिन और सम्भवतः पाठगत रूप से अनिश्चित वाक्य है; इसका अर्थ “प्रभु के प्रति अपने को खतना किया हुआ बनाओ” भी हो सकता है।
    reason: स्रोत-भाषा समीक्षा लंबित है और उपलब्ध अंग्रेज़ी साक्ष्य में ‘into your Lord’ असामान्य है।
  - marker: b
    text: यह संख्या उत्पत्ति 17:23, 27 के 318 पुरुषों को “अठारह और तीन सौ” के रूप में पढ़ती है, ताकि यूनानी अक्षर-अंकों की व्याख्या की जा सके।
    reason: आगे के अक्षर-संख्या तर्क को आधुनिक पाठक के लिए समझने योग्य बनाना।
  - marker: c
    text: यूनानी अंक-पद्धति में Ι = 10 और Η = 8; दोनों मिलकर ΙΗ बनते हैं, जिसे लेखक ΙΗΣΟΥΣ (यीशु) के आरम्भिक अक्षरों के रूप में पढ़ता है।
    reason: यह शब्द-खेल देवनागरी में स्वयं स्पष्ट नहीं है।
  - marker: d
    text: यूनानी अक्षर Τ का संख्यात्मक मूल्य 300 है और उसका आकार लेखक को क्रूस की याद दिलाता है।
    reason: तीन सौ और क्रूस के बीच लेखक के प्रतीकात्मक संबंध को स्पष्ट करना।
lexical_decisions:
- source_word: περιτομή / circumcision
  choice: खतना
  rationale: यह सामान्य आधुनिक हिन्दी में स्पष्ट और ऐतिहासिक-धार्मिक संदर्भ के अनुकूल है; रूपकात्मक प्रयोगों—हृदय और कानों का खतना—को भी ज्यों का त्यों रखा गया है।
- source_word: ἀκοή / ears, hearing
  choice: कान; सुनना; बात मानना
  rationale: जहाँ शारीरिक अंग का संकेत है वहाँ ‘कान’, और जहाँ श्रवण के साथ प्रत्युत्तर का भाव है वहाँ प्रसंगानुसार ‘सुनकर मेरी बात मानी’ रखा गया है।
- source_word: διαθήκη / covenant
  choice: वाचा
  rationale: बाइबलीय और आरम्भिक मसीही साहित्य में प्रचलित, संक्षिप्त और धर्मवैज्ञानिक रूप से तटस्थ हिन्दी पद।
- source_word: ἄγγελος πονηρός / evil angel
  choice: दुष्ट दूत
  rationale: ‘दूत’ मूल शब्द की व्यापकता बनाए रखता है और बिना आधार उसे सीधे ‘शैतान’ नहीं बनाता।
- source_word: σφραγίς / seal
  choice: मुहर
  rationale: वाचा-संबंधी पहचान के चिह्न का रूपक सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: γνῶσις / knowledge
  choice: ज्ञान
  rationale: अक्षर-संख्या की व्याख्या से प्राप्त गूढ़ समझ के लिए मूल की संज्ञा को सीधे सुरक्षित रखा गया है।
- source_word: γνήσιος λόγος / genuine word
  choice: प्रामाणिक वचन
  rationale: ‘वचन’ शिक्षण/व्याख्या की धार्मिक ध्वनि बनाए रखता है और ‘प्रामाणिक’ genuine की शक्ति व्यक्त करता है।
theological_decisions:
- issue: हृदय और कानों के खतने का संबंध
  choice: मूल के रूपकों को बिना व्याख्यात्मक समतलीकरण के रखा गया
  alternative: इसे केवल ‘आत्मिक शुद्धि’ या ‘आज्ञाकारिता’ कह देना
  rationale: लेखक जानबूझकर शारीरिक खतने, हृदय और श्रवण के बीच तनावपूर्ण रूपक रचता है।
- issue: शारीरिक खतने के ‘रद्द’ होने का दावा
  choice: लेखक का कठोर दावा प्रत्यक्ष रूप में अनूदित किया गया
  alternative: इसे ‘अपर्याप्त’ या ‘गलत समझा गया’ कहकर नरम करना
  rationale: अनुवाद को लेखक के विवादात्मक कथन को न तो बढ़ाना चाहिए, न सांप्रदायिक सुविधा के लिए घटाना चाहिए।
- issue: तीन अक्षरों की मसीही प्रतीकात्मक व्याख्या
  choice: यूनानी अक्षर Ι, Η, Τ और ΙΗΣΟΥΣ सुरक्षित रखे गए
  alternative: हिन्दी अक्षरों में समतुल्य शब्द-खेल गढ़ना
  rationale: तर्क यूनानी अक्षर-अंकों पर निर्भर है; लिप्यंतरण या स्थानीयकरण से उसका ऐतिहासिक आधार मिट जाता।
- issue: ‘अपने प्रभु के लिए/में खतना कराओ’ की अस्पष्ट अभिव्यक्ति
  choice: ‘अपने प्रभु के लिए खतना कराओ’ और पाठगत कठिनाई पर पादटिप्पणी
  alternative: ‘अपने हृदय का खतना करो’ से सीधे सामंजस्य करना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में असामान्य वाक्य है; स्रोत-भाषा समीक्षा लंबित होने के कारण निश्चित सुधार अनुचित होगा।
- issue: वाचा का ‘जन्मजात वरदान’
  choice: असामान्य अभिव्यक्ति को सुरक्षित रखा गया
  alternative: ‘हममें स्थापित वाचा का ज्ञान’ जैसे सहज धर्मवैज्ञानिक पुनर्लेखन
  rationale: साक्ष्य की कठिन भाषा में सम्भावित पाठगत या अर्थगत तनाव है, जिसे चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। उद्धरणों की पुनरावृत्ति और लेखक की विवादात्मक शैली सुरक्षित रखी गई है। ‘हे’ का सीमित प्रयोग प्राचीन उद्धरणों की संबोधन-शैली के लिए किया गया। ‘गैर-यहूदी’ को सामान्य बोधगम्यता के लिए चुना गया; यूनानी अक्षर-अंक मूल रूप में रखे गए। मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी/लैटिन समीक्षा अभी लंबित है।
