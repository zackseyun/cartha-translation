base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/002.yaml
  text: 'Seeing, then, that the days are evil and that the Active One himself has the authority, we ought to pay attention to ourselves and seek out the ordinances of the Lord.


    The aids of our faith are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, and knowledge rejoice with them.


    For he has made known to us by all the prophets that he desires neither sacrifices nor whole burnt offerings nor oblations, saying at one time:


    “What is the multitude of your sacrifices to me?” says the Lord. “I am full of whole burnt offerings, and I do not desire the fat of lambs or the blood of bulls and goats—not even if you come to be seen by me. Or who required these things at your hands? You shall no longer continue to tread my court. If you bring fine flour, it is in vain; incense is an abomination to me. Your new moons and your Sabbaths I cannot endure.”


    Therefore, he annulled these things so that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have an oblation not made by human hands.


    And he says to them again: “Did [I] command your fathers, when they went forth from the land of Egypt, to bring me whole burnt offerings and sacrifices?


    “No. This was my command to them: Let none of you bear an evil grudge against his neighbor in his heart, and do not love a false oath.”


    So, unless we are without understanding, we ought to perceive the mind of the goodness of our Father. For he speaks to us, desiring that we should not go astray like them but should seek how we may approach him.


    Thus he speaks to us: “The sacrifice to God is a broken heart; the smell of a sweet savor to the Lord is a heart that glorifies its Maker.” Therefore, brethren, we ought to learn accurately concerning our salvation, lest the Evil One, having effected an entrance of error in us, should fling us away from our life.'
translation:
  language: hi
  text: 'अतः, यह देखते हुए कि दिन बुरे हैं और स्वयं सक्रिय जन[a] के हाथ में अधिकार है, हमें अपने ऊपर ध्यान देना और प्रभु की विधियों को खोज निकालना चाहिए।


    हमारे विश्वास के सहायक हैं—भय और धीरज; और हमारे साथी हैं—सहनशीलता और संयम।


    जब तक प्रभु से संबंधित बातों में ये शुद्ध आत्मा के भीतर बने रहते हैं, तब तक बुद्धि, समझ, विद्या[b] और ज्ञान इनके साथ आनन्दित होते हैं।


    क्योंकि उसने सभी भविष्यद्वक्ताओं के द्वारा हम पर प्रकट किया है कि वह न बलिदान चाहता है, न पूर्ण होमबलि, न भेंट। एक स्थान पर वह कहता है:


    “तुम्हारे असंख्य बलिदान मेरे किस काम के?” प्रभु कहता है। “मैं पूर्ण होमबलियों से भर चुका हूँ; मेमनों की चर्बी और बैलों तथा बकरों का लहू मैं नहीं चाहता—तब भी नहीं, जब तुम मेरे सामने दिखाई देने आओ। या किसने तुम्हारे हाथों से इन वस्तुओं की माँग की? अब तुम मेरे आँगन को रौंदते न रहोगे। यदि तुम मैदा लाते हो, तो वह व्यर्थ है; धूप मेरे लिए घृणित है। तुम्हारी अमावस्याएँ और तुम्हारे सब्त मैं सह नहीं सकता।”


    इसलिए उसने इन बातों को रद्द कर दिया, ताकि हमारे प्रभु यीशु मसीह की नई व्यवस्था, बाध्यता के जुए से स्वतंत्र होकर, ऐसी भेंट रखे जो मनुष्य के हाथों से न बनाई गई हो।


    और वह उनसे फिर कहता है, “जब तुम्हारे पूर्वज मिस्र देश से निकले थे, तब क्या मैंने उन्हें आज्ञा दी थी कि वे मेरे लिए पूर्ण होमबलियाँ और बलिदान लाएँ?


    “नहीं। मैंने उन्हें यह आज्ञा दी थी: तुममें से कोई अपने पड़ोसी के विरुद्ध अपने हृदय में बुरी दुर्भावना न रखे, और झूठी शपथ से प्रेम न करो।”


    इसलिए, यदि हम समझ से रहित नहीं हैं, तो हमें अपने पिता की भलाई का अभिप्राय समझना चाहिए। क्योंकि वह हमसे बोलता है और चाहता है कि हम उनकी तरह भटक न जाएँ, बल्कि यह खोजें कि हम उसके निकट कैसे पहुँचें।


    अतः वह हमसे इस प्रकार कहता है, “परमेश्वर के लिए बलिदान टूटा हुआ हृदय है; प्रभु के लिए सुगंधित सुवास ऐसा हृदय है जो अपने सृष्टिकर्ता की महिमा करता है।” इसलिए, भाइयो, हमें अपने उद्धार के विषय में ठीक-ठीक सीखना चाहिए, कहीं ऐसा न हो कि वह दुष्ट हमारे भीतर भटकाव के लिए प्रवेश का मार्ग बना ले और हमें हमारे जीवन से दूर फेंक दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सक्रिय जन” उपलब्ध अंग्रेज़ी साक्ष्य के “Active One” का अस्थायी रूप है। यह किसी उपाधि या कार्यरत सत्ता का संकेत हो सकता है; यूनानी/लातीनी स्रोत की प्रत्यक्ष समीक्षा लंबित है।
    reason: असामान्य पद और उसकी संभावित धर्मवैचारिक पहचान की अस्पष्टता पाठक के लिए स्पष्ट करनी आवश्यक है।
  - marker: b
    text: यहाँ “विद्या” उपलब्ध साक्ष्य के “science” का व्यापक अर्थ देता है—व्यवस्थित बोध या अध्ययन; इसे केवल आधुनिक प्राकृतिक विज्ञान तक सीमित न समझें।
    reason: आधुनिक हिन्दी में ‘विज्ञान’ अनावश्यक रूप से संकीर्ण और कालविरुद्ध अर्थ दे सकता है।
lexical_decisions:
- source_word: ὁ ἐνεργῶν / “the Active One” (witness rendering)
  choice: सक्रिय जन
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य के असामान्य और संभवतः उपाधिसूचक शब्द को सामान्य ‘कर्ता’ या किसी निश्चित व्यक्तित्व में समेटे बिना सुरक्षित रखा गया है; स्रोत-भाषा समीक्षा लंबित होने के कारण पादटिप्पणी दी गई है।
- source_word: φόβος / fear
  choice: भय
  rationale: विश्वास के सहायक सद्गुण के रूप में मूल तनाव बनाए रखता है; इसे व्याख्यात्मक रूप से केवल ‘श्रद्धा’ नहीं बनाया गया।
- source_word: μακροθυμία / long-suffering
  choice: सहनशीलता
  rationale: दीर्घकाल तक सहने की नैतिक धारणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγκράτεια / self-restraint
  choice: संयम
  rationale: आत्म-नियंत्रण का संक्षिप्त, प्रतिष्ठित और व्यापक हिन्दी समतुल्य।
- source_word: ἐπιστήμη / science (witness rendering)
  choice: विद्या
  rationale: आधुनिक प्रयोगात्मक ‘विज्ञान’ का अनपेक्षित संकुचन टालते हुए व्यवस्थित बोध/अध्ययन का व्यापक अर्थ सुरक्षित रखता है।
- source_word: ὁλοκαυτώματα / whole burnt offerings
  choice: पूर्ण होमबलियाँ
  rationale: ऐसी बलि का संकेत देता है जो पूरी तरह जलाई जाती थी और इसे सामान्य बलिदान से अलग रखता है।
- source_word: προσφορά / oblation
  choice: भेंट
  rationale: उपासना में अर्पित वस्तु का सहज हिन्दी रूप, जबकि प्रसंग इसका बलिदानी अर्थ स्पष्ट करता है।
- source_word: ἀκύρωσεν / annulled
  choice: रद्द कर दिया
  rationale: लेखक के प्रबल दावे को नरम किए बिना आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: χειροποίητος / made by human hands
  choice: मनुष्य के हाथों से बनाई गई
  rationale: हाथों से निर्मित होने की मूर्त और धर्मवैचारिक अभिव्यक्ति को अक्षुण्ण रखता है।
- source_word: συντετριμμένη καρδία / broken heart
  choice: टूटा हुआ हृदय
  rationale: उद्धरण की ठोस छवि और पश्चात्तापपूर्ण तनाव को बनाए रखता है।
theological_decisions:
- issue: ‘Active One’ की पहचान
  choice: अस्पष्ट उपाधि ‘सक्रिय जन’ के रूप में रखी गई
  alternative: इसे सीधे ‘दुष्ट’, ‘शैतान’, ‘कार्य करने वाला’ या किसी अन्य निश्चित व्यक्तित्व के रूप में अनूदित करना
  rationale: दिए गए साक्ष्य में पहचान स्पष्ट नहीं है। किसी एक धर्मवैचारिक पहचान को थोपने के बजाय वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: पुरानी बलिदान-व्यवस्था को ‘रद्द’ करने का कथन
  choice: लेखक के कथन को सीधे और प्रबल रूप में अनूदित किया गया
  alternative: इसे ‘पूर्ण किया’, ‘बदल दिया’ या ‘दुरुपयोग को रद्द किया’ कहना
  rationale: ऐसे विकल्प पाठ के स्पष्ट विवादात्मक दावे को संप्रदायगत व्याख्या से नरम या पुनर्परिभाषित कर देते।
- issue: नई व्यवस्था और गैर-हस्तनिर्मित भेंट
  choice: व्याकरणिक तनाव बनाए रखा गया कि नई व्यवस्था ‘ऐसी भेंट रखे’
  alternative: भेंट को निश्चित रूप से हृदय, मसीह, प्रार्थना या यूखरिस्त के रूप में पहचानना
  rationale: निकटवर्ती संदर्भ हृदय की ओर संकेत करता है, पर वाक्य स्वयं भेंट की पहचान पूर्णतः स्पष्ट नहीं करता; इसलिए निजी सिद्धान्त नहीं जोड़ा गया।
- issue: परमेश्वर के निकट पहुँचने का कथन
  choice: ‘हम उसके निकट कैसे पहुँचें’
  alternative: इसे किसी निश्चित अनुष्ठानिक, मसीहवैज्ञानिक या नैतिक विधि से विस्तार देना
  rationale: पाठ खोज और निकटता की भाषा रखता है, पर यहाँ उसका तंत्र निर्दिष्ट नहीं करता।
- issue: ‘हमारे जीवन’ से दूर फेंकना
  choice: जीवन को सामान्य परन्तु धर्मवैचारिक रूप से खुला रखा गया
  alternative: ‘अनन्त जीवन’, ‘उद्धार’ या ‘जीवन का मार्ग’ जोड़ना
  rationale: ऐसी स्पष्टताएँ संभव हैं, लेकिन उपलब्ध पाठ में कही नहीं गईं; मूल तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए बोधगम्य। भविष्यद्वाणी-संबंधी उद्धरणों में औपचारिक लय रखी गई है, पर पुरातन क्रियारूपों से बचा गया है। ‘सब्त’, ‘होमबलि’, ‘अमावस्या’ और ‘धूप’ जैसे बाइबलीय-सांस्कृतिक पद प्रसंग की विशिष्टता के लिए रखे गए हैं। उपलब्ध स्रोत प्रत्यक्ष यूनानी/लातीनी पाठ नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए विशेषतः [a] और [b] वाले पद प्रकाशन से पहले स्रोत-भाषा समीक्षा चाहते हैं।
