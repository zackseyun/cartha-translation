    rationale: “मधुर सुगंध” naturally conveys “a sweet savor” without unnecessary duplication.
  revised_text: 'अतः, यह देखते हुए कि दिन बुरे हैं और स्वयं कार्य करने वाले[a] के पास अधिकार है, हमें अपनी ओर ध्यान देना और प्रभु की विधियों को खोज निकालना चाहिए।


    हमारे विश्वास के सहायक भय और धीरज हैं, और हमारे साथी सहनशीलता और संयम हैं।


    जब तक ये प्रभु से संबंधित बातों में शुद्ध आत्मा में बने रहते हैं, तब तक बुद्धि, समझ, विद्या[b] और ज्ञान इनके साथ आनन्दित होते हैं।


    क्योंकि उसने सभी भविष्यद्वक्ताओं के द्वारा हमें प्रकट किया है कि वह न बलिदान चाहता है, न पूर्ण होमबलि, न भेंट। एक स्थान पर वह कहता है:


    “तुम्हारे असंख्य बलिदान मेरे किस काम के?” प्रभु कहता है। “मैं पूर्ण होमबलियों से भर चुका हूँ; मेमनों की चर्बी और बैलों तथा बकरों का लहू मैं नहीं चाहता—तब भी नहीं, जब तुम मेरे सामने दिखाई देने आओ। या किसने तुम्हारे हाथों से इन वस्तुओं की माँग की? अब तुम मेरे आँगन को रौंदते न रहोगे। यदि तुम उत्तम आटा लाते हो, तो वह व्यर्थ है; धूप मेरे लिए घृणित है। तुम्हारी अमावस्याएँ और तुम्हारे सब्त मैं सह नहीं सकता।”


    इसलिए उसने इन बातों को रद्द कर दिया, ताकि हमारे प्रभु यीशु मसीह की नई व्यवस्था, बाध्यता के जुए से स्वतंत्र होकर, उसकी ऐसी भेंट हो जो मनुष्य के हाथों से न बनाई गई हो।


    और वह उनसे फिर कहता है, “जब तुम्हारे पूर्वज मिस्र देश से निकले थे, तब क्या मैंने उन्हें आज्ञा दी थी कि वे मेरे लिए पूर्ण होमबलियाँ और बलिदान लाएँ?


    “नहीं। मैंने उन्हें यह आज्ञा दी थी: तुममें से कोई अपने पड़ोसी के विरुद्ध अपने हृदय में बुरी दुर्भावना न रखे, और झूठी शपथ से प्रेम न करो।”


    इसलिए, यदि हम समझ से रहित नहीं हैं, तो हमें हमारे पिता की भलाई की मंशा समझनी चाहिए। क्योंकि वह हमसे बोलता है और चाहता है कि हम उनकी तरह भटक न जाएँ, बल्कि यह खोजें कि हम उसके निकट कैसे पहुँचें।


    अतः वह हमसे इस प्रकार कहता है, “परमेश्वर के लिए बलिदान टूटा हुआ हृदय है; प्रभु के लिए मधुर सुगंध ऐसा हृदय है जो अपने सृष्टिकर्ता की महिमा करता है।” इसलिए, भाइयो, हमें अपने उद्धार के विषय में ठीक-ठीक सीखना चाहिए, कहीं ऐसा न हो कि वह दुष्ट हमारे भीतर भूल को प्रवेश दिलाकर हमें हमारे जीवन से बाहर फेंक दे।'
