  text: 'Therefore, we ought to investigate the present deeply and search out the things that have power to save us. Let us flee completely from all the works of lawlessness, so that the works of lawlessness do not overpower us. Let us hate the error of the present age, so that we may be loved for what is to come.


    Let us give our soul no relief that would allow it to associate with sinners and wicked people, so that we are not made like them.


    The last offense is at hand, concerning which Scripture speaks, as Enoch says. For this reason the Master has shortened the seasons and the days, so that his beloved may hasten and come to His inheritance.


    The prophet also speaks in this way: “Ten reigns shall reign upon the earth, and after them another king will arise, who will bring three of the kings low under one.”


    In the same way Daniel speaks concerning the same thing: “I saw the fourth beast, wicked and strong and more unmanageable than all the beasts of the earth. I saw ten horns arise from it, and from these a little horn, an outgrowth, and I saw how it brought three of the great horns low under one.”


    Therefore, you ought to understand. Moreover, I ask you this one thing as one of you, loving each of you more than my own soul: pay attention to yourselves now, and do not become like certain people who pile sin upon sin, saying that our covenant also remains theirs.


    It is ours, but they lost it forever in this way, just after Moses had received it. For Scripture says: “Moses was on the mountain, fasting for forty days and forty nights, and he received the covenant from the Lord—tablets of stone written by the finger of the Lord’s hand.”


    But they lost it by turning to idols. For the Lord says: “Moses, Moses, come down quickly, for your people, whom you brought out of the land of Egypt, have acted lawlessly.” Moses understood and threw the two tablets from his hands. Their covenant was shattered, so that the covenant of the beloved Jesus might be sealed upon our hearts in the hope that springs from faith in him.


    Although I would gladly write many things—not as a teacher, but as is fitting for one who loves you, so that you may not fall short of what we possess—I was eager to write to you, since I am your devoted servant. Therefore, let us be watchful in these last days. For the whole time of our faith will benefit us nothing unless now, in the season of lawlessness and amid the offenses that are to come, we resist as is fitting for God’s sons, so that the Black One may not gain an entrance.


    Let us flee from all vanity. Let us completely hate the works of the evil way. Do not, entering in privately, stand apart by yourselves, as though you were already justified, but gather together and consult about the common good.


    For Scripture says: “Woe to those who are wise for themselves and understanding in their own sight.” Let us become spiritual. Let us become a temple made perfect for God. As far as it lies within us, let us train ourselves in the fear of God, [and] let us strive to keep his commandments, so that we may rejoice in his ordinances.


    The Lord judges the world without partiality. Each person will receive according to his deeds. If someone is good, his righteousness will go before him on the way. If someone is evil, the repayment for his evildoing is before him, so that perhaps,


    if we relax as people who are called, we may fall asleep over our sins, and the prince of evil may gain power against us and thrust us out of the Lord’s kingdom.


    Moreover, understand this also, my brothers. When you see that, even after so many signs and wonders were performed in Israel, they were still abandoned, let us pay attention, so that perhaps we are not found to be, as Scripture says, “Many are called, but few are chosen.”'
translation:
  language: hi
  text: 'इसलिए हमें वर्तमान समय की गहराई से जाँच करनी चाहिए और उन बातों को खोजना चाहिए जिनमें हमारा उद्धार करने की सामर्थ्य है। अतः हम अधर्म के सभी कामों से पूरी तरह दूर भागें, कहीं ऐसा न हो कि अधर्म के काम हम पर हावी हो जाएँ। हम वर्तमान युग के भ्रम से घृणा करें, ताकि आनेवाले युग के कारण हमसे प्रेम किया जाए।


    हम अपने प्राण को ऐसी कोई ढील न दें जिससे उसे पापियों और दुष्ट लोगों के साथ मेल-जोल रखने की छूट मिले, कहीं ऐसा न हो कि हम उन्हीं के समान बन जाएँ।


    अंतिम ठोकर निकट है, जिसके विषय में पवित्रशास्त्र बोलता है, जैसा हनोक कहता है। इसी कारण स्वामी ने समयों और दिनों को छोटा कर दिया है, ताकि उसका प्रिय शीघ्रता करे और अपनी विरासत में आ पहुँचे।


    भविष्यद्वक्ता भी इसी प्रकार कहता है, “पृथ्वी पर दस राज्य राज्य करेंगे, और उनके बाद एक और राजा उठेगा, जो तीन राजाओं को एक के अधीन नीचा कर देगा।”[a]


    इसी प्रकार दानिय्येल भी उसी विषय में कहता है, “मैंने चौथे पशु को देखा, जो पृथ्वी के सब पशुओं से अधिक दुष्ट, बलवान और वश में न आनेवाला था। मैंने देखा कि उसमें से दस सींग निकले, और उनमें से एक छोटा सींग, एक उभार निकला; और उसने तीन बड़े सींगों को एक के अधीन नीचा कर दिया।”[b]


    इसलिए तुम्हें समझना चाहिए। इसके अतिरिक्त, तुममें से एक होने के नाते और तुममें से प्रत्येक को अपने प्राण से भी अधिक प्रेम करते हुए, मैं तुमसे केवल यह आग्रह करता हूँ: अब अपने ऊपर ध्यान दो। उन लोगों के समान मत बनो जो पाप पर पाप जोड़ते जाते हैं और कहते हैं कि हमारी वाचा अब भी उनकी ही है।


    वह हमारी है; पर उन्होंने उसे सदा के लिए इसी प्रकार खो दिया—ठीक उस समय जब मूसा ने उसे प्राप्त ही किया था। क्योंकि पवित्रशास्त्र कहता है, “मूसा पर्वत पर चालीस दिन और चालीस रात उपवास करता रहा, और उसने प्रभु से वाचा प्राप्त की—पत्थर की वे पटियाएँ जो प्रभु के हाथ की उँगली से लिखी गई थीं।”


    पर मूर्तियों की ओर फिरकर उन्होंने उसे खो दिया। क्योंकि प्रभु इस प्रकार कहता है, “मूसा, मूसा, शीघ्र नीचे उतर, क्योंकि तेरे लोग, जिन्हें तू मिस्र देश से निकाल लाया है, अधर्म कर बैठे हैं।” मूसा समझ गया और उसने दोनों पटियाएँ अपने हाथों से फेंक दीं। उनकी वाचा चकनाचूर हो गई, ताकि प्रिय यीशु की वाचा उस आशा में हमारे हृदयों पर मुहरबंद हो, जो उस पर विश्वास से उत्पन्न होती है।[c]


    यद्यपि मैं बहुत-सी बातें लिखना चाहता था, फिर भी एक शिक्षक के समान नहीं, बल्कि तुमसे प्रेम करनेवाले के योग्य रीति से—ताकि जो हमारे पास है उसमें तुम किसी बात में पीछे न रहो—मैंने तुम्हारे समर्पित सेवक के रूप में तुम्हें लिखने का उत्साह किया। इसलिए इन अंतिम दिनों में हम सावधान रहें। क्योंकि हमारे विश्वास का पूरा बीता हुआ समय हमें कोई लाभ नहीं देगा, यदि अब, अधर्म के समय और आनेवाली ठोकरों के बीच, हम परमेश्वर के पुत्रों के योग्य उनका सामना न करें, ताकि वह काला दुष्ट भीतर प्रवेश न पा सके।[d]


    हम हर व्यर्थता से दूर भागें। बुरे मार्ग के कामों से पूरी तरह घृणा करें। अकेले में भीतर जाकर अपने-अपने में अलग न रहो, मानो तुम पहले ही धर्मी ठहराए जा चुके हो; बल्कि एक साथ इकट्ठे हो और सबके हित के विषय में विचार करो।


    क्योंकि पवित्रशास्त्र कहता है, “हाय उन पर जो अपनी ही दृष्टि में बुद्धिमान और अपनी ही निगाह में समझदार हैं।” हम आत्मिक बनें; हम परमेश्वर के लिए सिद्ध मंदिर बनें। जहाँ तक हमारे वश में है, हम परमेश्वर का भय मानने का अभ्यास करें [और] उसकी आज्ञाओं का पालन करने का प्रयत्न करें, ताकि हम उसके विधानों में आनन्दित हों।[e]


    प्रभु बिना पक्षपात के संसार का न्याय करता है। प्रत्येक व्यक्ति अपने कामों के अनुसार पाएगा। यदि वह भला है, तो उसकी धार्मिकता मार्ग में उसके आगे चलेगी; यदि वह बुरा है, तो उसके बुरे काम का प्रतिफल उसके सामने है। इसलिए कहीं ऐसा न हो कि बुलाए हुए लोग होकर हम ढीले पड़ जाएँ और अपने पापों में सो जाएँ, और बुराई का शासक हमारे विरुद्ध अधिकार पाकर हमें प्रभु के राज्य से बाहर निकाल दे।[f]


    मेरे भाइयो, यह भी समझो: जब तुम देखते हो कि इस्राएल में इतने चिन्ह और अद्भुत काम किए जाने के बाद भी उन्हें त्याग दिया गया, तो हम सावधान रहें, कहीं ऐसा न हो कि हम भी वैसे पाए जाएँ जैसा पवित्रशास्त्र कहता है, “बुलाए हुए बहुत हैं, पर चुने हुए थोड़े।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एक के अधीन” का वाक्यांश उपलब्ध साक्ष्य में असामान्य है; इसका आशय अनिश्चित है, इसलिए इसे व्याख्यात्मक रूप से नहीं बदला गया।
    reason: स्रोत की वास्तविक अस्पष्टता सुरक्षित रखना।
  - marker: b
    text: यह दानिय्येल 7 की स्वतंत्र उद्धरण-परंपरा या स्मृतिजन्य रूप प्रतीत होता है। “एक के अधीन” का असामान्य पाठ भी ज्यों का त्यों रखा गया है।
    reason: मानक बाइबल-पाठ के अनुरूप उद्धरण को चुपचाप संशोधित न करना।
  - marker: c
    text: लेखक यहाँ वाचा के विषय में अपना तीखा धार्मिक दावा प्रस्तुत करता है। अनुवाद उसे न तो नरम करता है, न उससे आगे कोई निष्कर्ष जोड़ता है।
    reason: धार्मिक तनाव और ऐतिहासिक विवादात्मकता को स्पष्ट करना।
  - marker: d
    text: “वह काला दुष्ट” दुष्ट सत्ता की एक असामान्य उपाधि है; इसे सामान्य रूप से केवल “शैतान” नहीं किया गया।
    reason: विशिष्ट स्रोत-शब्दावली को सुरक्षित रखना।
  - marker: e
    text: कोष्ठक में [और] उपलब्ध अंग्रेज़ी साक्ष्य में पुनःस्थापित/संदिग्ध शब्द का संकेत है; प्रत्यक्ष यूनानी-लैटिन समीक्षा अभी शेष है।
    reason: प्रदत्त पुनःस्थापन संकेत को मुख्य पाठ में बनाए रखना।
  - marker: f
    text: उपलब्ध साक्ष्य में वाक्य-विभाजन “उसके सामने है” के बाद असहज है। हिन्दी में अगले वाक्य से अर्थ-संबंध स्पष्ट किया गया है, पर चेतावनी का बल नहीं बदला गया।
    reason: साक्ष्य की वाक्यगत कठिनाई दर्ज करना।
lexical_decisions:
- source_word: παράπτωμα / offense (witness)
  choice: ठोकर
  rationale: अंतकालीन परीक्षा या अपराध—दोनों की संभावित छाया बनाए रखने के लिए ‘अपराध’ की अपेक्षा व्यापक शब्द चुना गया।
- source_word: Δεσπότης / Master
  choice: स्वामी
  rationale: अधिकार और स्वामित्व का भाव रखता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: διαθήκη / covenant
  choice: वाचा
  rationale: बाइबलीय संदर्भ में स्थापित हिन्दी शब्द; अनुबंध मात्र से अधिक धार्मिक अर्थ रखता है।
