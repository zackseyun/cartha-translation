  revised_text: 'इसलिए हमें वर्तमान समय की गहराई से जाँच करनी चाहिए और उन बातों को खोजना चाहिए जिनमें हमारा उद्धार करने की सामर्थ्य है। अतः हम अधर्म के सभी कामों से पूरी तरह दूर भागें, कहीं ऐसा न हो कि अधर्म के काम हम पर हावी हो जाएँ। हम वर्तमान युग के भ्रम से घृणा करें, ताकि आनेवाले समय के लिए हम प्रिय ठहरें।


    हम अपने प्राण को ऐसी कोई ढील न दें जिससे उसे पापियों और दुष्ट लोगों के साथ मेल-जोल रखने की छूट मिले, कहीं ऐसा न हो कि हम उन्हीं के समान बन जाएँ।


    अंतिम ठोकर निकट है, जिसके विषय में पवित्रशास्त्र बोलता है, जैसा हनोक कहता है। इसी कारण स्वामी ने समयों और दिनों को छोटा कर दिया है, ताकि उसका प्रिय शीघ्र आए और उसकी विरासत में पहुँचे।


    भविष्यद्वक्ता भी इसी प्रकार कहता है, “पृथ्वी पर दस राज्य शासन करेंगे, और उनके बाद एक और राजा उठेगा, जो तीन राजाओं को एक के अधीन नीचा कर देगा।”[a]


    इसी प्रकार दानिय्येल भी उसी विषय में कहता है, “मैंने चौथे पशु को देखा, जो पृथ्वी के सब पशुओं से अधिक दुष्ट, बलवान और वश में न आनेवाला था। मैंने देखा कि उसमें से दस सींग निकले, और उनमें से एक छोटा सींग, एक उभार निकला; और उसने तीन बड़े सींगों को एक के अधीन नीचा कर दिया।”[b]


    इसलिए तुम्हें समझना चाहिए। इसके अतिरिक्त, तुममें से एक होने के नाते और तुममें से प्रत्येक को अपने प्राण से भी अधिक प्रेम करते हुए, मैं तुमसे केवल यह आग्रह करता हूँ: अब अपने ऊपर ध्यान दो। उन लोगों के समान मत बनो जो पाप पर पाप जोड़ते जाते हैं और कहते हैं कि हमारी वाचा भी उनकी बनी रहती है।


    वह हमारी है; पर उन्होंने उसे सदा के लिए इसी प्रकार खो दिया—मूसा के उसे पाते ही। क्योंकि पवित्रशास्त्र कहता है, “मूसा पर्वत पर चालीस दिन और चालीस रात उपवास करता रहा, और उसने प्रभु से वाचा प्राप्त की—पत्थर की वे पटियाएँ जो प्रभु के हाथ की उँगली से लिखी गई थीं।”


    पर मूर्तियों की ओर फिरकर उन्होंने उसे खो दिया। क्योंकि प्रभु इस प्रकार कहता है, “मूसा, मूसा, शीघ्र नीचे उतर, क्योंकि तेरे लोग, जिन्हें तू मिस्र देश से निकाल लाया है, अधर्म कर बैठे हैं।” मूसा समझ गया और उसने दोनों पटियाएँ अपने हाथों से फेंक दीं। उनकी वाचा चकनाचूर हो गई, ताकि प्रिय यीशु की वाचा उस आशा में हमारे हृदयों में मुहरबंद हो, जो उस पर विश्वास से उत्पन्न होती है।[c]


    यद्यपि मैं बहुत-सी बातें लिखना चाहता था, फिर भी एक शिक्षक के समान नहीं, बल्कि तुमसे प्रेम करनेवाले के योग्य रीति से—ताकि जो हमारे पास है उसमें तुम किसी बात में पीछे न रहो—मैंने, तुम्हारा समर्पित दास होकर, तुम्हें लिखने का उत्साह किया। इसलिए इन अंतिम दिनों में हम सावधान रहें। क्योंकि हमारे विश्वास का सारा समय हमें कोई लाभ नहीं देगा, यदि अब, अधर्म के समय और आनेवाली ठोकरों के बीच, हम परमेश्वर के पुत्रों के योग्य प्रतिरोध न करें, ताकि वह काला भीतर प्रवेश न पा सके।[d]


    हम हर व्यर्थता से दूर भागें। बुरे मार्ग के कामों से पूरी तरह घृणा करें। अपने-आप में सिमटकर अलग-अलग न रहो, मानो तुम पहले ही धर्मी ठहराए जा चुके हो; बल्कि एक साथ इकट्ठे हो और सबके हित के विषय में विचार करो।


    क्योंकि पवित्रशास्त्र कहता है, “हाय उन पर जो अपनी ही दृष्टि में बुद्धिमान और अपनी ही निगाह में समझदार हैं।” हम आत्मिक बनें; हम परमेश्वर के लिए सिद्ध मंदिर बनें। जहाँ तक हमारे वश में है, हम परमेश्वर का भय मानने का अभ्यास करें [और] उसकी आज्ञाओं का पालन करने का प्रयत्न करें, ताकि हम उसके विधानों में आनन्दित हों।[e]


    प्रभु बिना पक्षपात के संसार का न्याय करता है। प्रत्येक व्यक्ति अपने कामों के अनुसार पाएगा। यदि वह भला है, तो उसकी धार्मिकता मार्ग में उसके आगे चलेगी; यदि वह बुरा है, तो उसके बुरे काम का प्रतिफल उसके सामने है। कहीं ऐसा न हो कि बुलाए हुए लोग होकर हम ढीले पड़ जाएँ और अपने पापों में सोते रह जाएँ, और बुराई का शासक हमारे विरुद्ध अधिकार पाकर हमें प्रभु के राज्य से बाहर निकाल दे।[f]


    मेरे भाइयो, यह भी समझो: जब तुम देखते हो कि इस्राएल में इतने चिन्ह और अद्भुत काम किए जाने के बाद भी उन्हें त्याग दिया गया, तो हम सावधान रहें, कहीं ऐसा न हो कि हम भी वैसे पाए जाएँ जैसा पवित्रशास्त्र कहता है, “बुलाए हुए बहुत हैं, पर चुने हुए थोड़े।”'
