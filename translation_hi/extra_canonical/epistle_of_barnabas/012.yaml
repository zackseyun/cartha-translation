  text: 'In the same way again he defines concerning the cross in another prophet, who says, “And when will these things be accomplished?” says the Lord. “Whenever a tree is bent and stands upright, and whenever blood drips from a tree.” Again you are taught concerning the cross and him who was to be crucified.


    And again he says in Moses, when war was waged against Israel by people of another nation, and so that he might remind them, when war was waged against them, that because of their sins they had been delivered unto death: the Spirit says to the heart of Moses that he should make a type of the cross and of him who was to suffer, for unless, he says, they set their hope on him, war will be waged against them forever. Therefore Moses piles arms one upon another in the midst of the encounter, and, standing on higher ground than anyone else, stretches out his hands; and so Israel again is victorious. But whenever he lowers them, they are slain with the sword.


    Why was this? That they might learn that they cannot be saved unless they set their hope on him.


    And again, in another prophet, he says, “The whole day long I have stretched out my hands to a disobedient people who gainsaid my righteous way.”


    Again Moses makes a type of Jesus: how he must suffer, and how he himself, whom they will think to have destroyed, shall make alive in an emblem when Israel was falling. For the Lord caused all kinds of serpents to bite them, and they died—for the transgression was wrought in Eve through the serpent—so that he might convince them that, because of their transgression, they would be delivered over to the affliction of death.


    Furthermore, though Moses gave the command, “You shall not have a molten or carved image for your God,” he himself made one, that he might show them a type of Jesus. So Moses makes a bronze serpent, sets it up conspicuously, and summons the people by proclamation.


    When they had assembled together, they entreated Moses that he should offer intercession for them, so that they might be healed. And Moses said to them, “Whenever one of you is bitten, let him come to the serpent placed on the tree, and let him believe and hope that the serpent, being itself dead, can make alive; and immediately he shall be saved.” And so they did. Here again, in these things also, you have the glory of Jesus: in him and unto him are all things.


    What again does Moses say to Jesus—Joshua—the son of Nun, when he gives him this name, as being a prophet, so that all the people might give ear to him alone, because the Father reveals all things concerning his Son Jesus?


    Therefore Moses says to Jesus the son of Nun, giving him this name, when he sent him as a spy into the land, “Take a book in your hands, and write what the Lord says: how the Son of God shall cut up by the roots all the house of Amalek in the last days.”


    Behold, again it is Jesus—not a son of man, but the Son of God—and he was revealed in the flesh in a figure. Since people will say that Christ is the son of David, David himself prophesies, being afraid and understanding the error of sinners: “The Lord said to my Lord, ‘Sit at my right hand until I set your enemies as a footstool under your feet.’”


    And again Isaiah says, “The Lord said unto my Christ the Lord, of whose right hand I laid hold, that the nations should give ear before him, and I will break down the strength of kings.” See how David calls him Lord and does not call him Son.'
translation:
  language: hi
  text: '12 उसी प्रकार वह फिर एक दूसरे नबी के द्वारा क्रूस के विषय में स्पष्ट करता है। वह नबी कहता है, “और ये बातें कब पूरी होंगी?” प्रभु कहता है, “जब कोई वृक्ष झुकाया जाए और फिर सीधा खड़ा हो जाए, और जब किसी वृक्ष से लहू टपके।” इससे तुम्हें फिर क्रूस और उस व्यक्ति के विषय में शिक्षा मिलती है जिसे क्रूस पर चढ़ाया जाना था।


    और वह मूसा के वृत्तांत में फिर कहता है: जब दूसरी जाति के लोगों ने इस्राएल से युद्ध किया, तब वह उन्हें यह स्मरण दिलाना चाहता था कि उनके पापों के कारण उन्हें मृत्यु के हवाले कर दिया गया था। इसलिए आत्मा ने मूसा के हृदय से कहा कि वह क्रूस का और उस व्यक्ति का, जिसे दुःख सहना था, एक प्रतीक बनाए; क्योंकि, वह कहता है, यदि वे उस पर आशा न रखेंगे, तो उनके विरुद्ध सदा युद्ध होता रहेगा। इसलिए युद्ध के बीच मूसा ने हथियारों को एक के ऊपर एक रखा[a] और सबसे ऊँचे स्थान पर खड़े होकर अपने हाथ फैला दिए। तब इस्राएल फिर विजयी हुआ; पर जब-जब वह अपने हाथ नीचे करता, वे तलवार से मारे जाते थे।


    ऐसा क्यों हुआ? इसलिए कि वे सीखें कि जब तक वे उस पर आशा न रखें, उनका उद्धार नहीं हो सकता।


    और वह एक दूसरे नबी के द्वारा फिर कहता है, “मैंने दिन भर अपने हाथ ऐसे आज्ञा न मानने वाले लोगों की ओर फैलाए रखे, जो मेरे धर्ममय मार्ग का विरोध करते थे।”


    फिर मूसा यीशु का एक प्रतीक बनाता है—कि उसे दुःख सहना आवश्यक है और जिसे लोग नष्ट कर चुका समझेंगे, वही उस समय एक चिह्न के द्वारा जीवन देगा जब इस्राएल नाश हो रहा था। क्योंकि प्रभु ने हर प्रकार के साँपों से उन्हें डसवाया और वे मर गए—चूँकि हव्वा के द्वारा किया गया अपराध साँप के माध्यम से हुआ था—ताकि वह उन्हें विश्वास दिलाए कि अपने अपराध के कारण वे मृत्यु की पीड़ा के हवाले किए जाएँगे।


    इतना ही नहीं, यद्यपि मूसा ने यह आज्ञा दी थी, “तुम अपने परमेश्वर के लिए कोई ढली हुई या खुदी हुई मूर्ति न रखना,” फिर भी उसने स्वयं एक मूर्ति बनाई, ताकि वह उन्हें यीशु का एक प्रतीक दिखाए। अतः मूसा ने काँसे का साँप बनाया, उसे सबके सामने ऊँचा खड़ा किया और घोषणा करके लोगों को बुलाया।


    जब वे इकट्ठे हुए, तो उन्होंने मूसा से विनती की कि वह उनके लिए मध्यस्थता करे, ताकि वे चंगे हो जाएँ। मूसा ने उनसे कहा, “जब भी तुममें से किसी को साँप डसे, तो वह उस साँप के पास आए जिसे काठ पर रखा गया है। वह विश्वास करे और आशा रखे कि वह साँप, जो स्वयं मरा हुआ है, जीवन दे सकता है; और वह तुरन्त बच जाएगा।” उन्होंने वैसा ही किया। इन बातों में भी तुम्हारे सामने फिर यीशु की महिमा है: सब कुछ उसी में और उसी के लिए है।


    और मूसा नून के पुत्र यीशु—अर्थात् यहोशू[b]—से फिर क्या कहता है, जब वह नबी के रूप में उसे यह नाम देता है, ताकि सब लोग केवल उसी की सुनें, क्योंकि पिता अपने पुत्र यीशु के विषय में सब बातें प्रकट करता है?


    अतः जब मूसा ने नून के पुत्र यीशु को देश की जासूसी करने भेजा, तब उसे यह नाम देते हुए उसने उससे कहा, “अपने हाथों में एक पुस्तक ले और वह लिख जो प्रभु कहता है: अन्तिम दिनों में परमेश्वर का पुत्र अमालेक के सारे घराने को जड़ से उखाड़ देगा।”


    देखो, यहाँ फिर यीशु है—मनुष्य का पुत्र नहीं, बल्कि परमेश्वर का पुत्र—और वह एक प्रतीक के रूप में देह में प्रकट किया गया। क्योंकि लोग कहेंगे कि मसीह दाऊद का पुत्र है, इसलिए दाऊद स्वयं पापियों की भूल को समझकर और भयभीत होकर भविष्यवाणी करता है: “प्रभु ने मेरे प्रभु से कहा, ‘मेरे दाहिने बैठ, जब तक मैं तेरे शत्रुओं को तेरे पैरों की चौकी न बना दूँ।’”


    और यशायाह भी इस प्रकार कहता है, “प्रभु ने मेरे मसीह, प्रभु, से कहा, जिसका दाहिना हाथ मैंने थामा है, ताकि जातियाँ उसके सामने ध्यान दें; और मैं राजाओं की शक्ति तोड़ दूँगा।” देखो, दाऊद उसे प्रभु कहता है, पुत्र नहीं कहता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हथियारों को एक के ऊपर एक रखा” उपलब्ध अंग्रेज़ी साक्षी का कठिन और सम्भवतः पाठगत रूप है। निर्गमन 17 के प्रचलित वृत्तांत में मूसा के नीचे पत्थर रखने का उल्लेख है। मूल यूनानी/लातीनी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: कठिन पाठ को मुख्य पाठ में सुरक्षित रखते हुए पाठक को सम्बद्ध पाठगत समस्या बताना।
  - marker: b
    text: यूनानी नाम Ἰησοῦς हिन्दी में प्रसंग के अनुसार “यीशु” या “यहोशू” लिखा जाता है। लेखक नून के पुत्र यहोशू और यीशु के नाम की इसी समानता पर अपना तर्क आधारित करता है।
    reason: हिन्दी में अलग दिखने वाले दोनों नामों के कारण मूल शब्द-क्रीड़ा और तर्क अन्यथा खो जाएगा।
lexical_decisions:
- source_word: τύπος / type (witness)
  choice: प्रतीक
  rationale: लेखक की प्रतिरूपात्मक व्याख्या को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘प्रतिरूप’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: ξύλον / tree, wood (quotation context)
  choice: वृक्ष; काठ
  rationale: पहली भविष्यवाणी में ‘वृक्ष’ रखा गया है; साँप के प्रसंग में क्रूस-संकेत बनाए रखते हुए ‘काठ’ स्वाभाविक है। स्रोत-समीक्षा लंबित होने के कारण अर्थ को ‘क्रूस’ कहकर समरूप नहीं किया गया।
- source_word: Ἰησοῦς
  choice: यीशु—अर्थात् यहोशू
  rationale: यूनानी में यीशु और यहोशू के लिए एक ही नाम है और लेखक का तर्क इसी नाम-साम्य पर निर्भर है; हिन्दी पाठक हेतु दोनों रूप स्पष्ट किए गए हैं।
- source_word: Christ / anointed one (Isaian quotation)
  choice: मसीह
  rationale: उद्धरण की असामान्य पदावली और लेखक के मसीही तर्क को बनाए रखता है; इसे ‘अभिषिक्त’ बनाकर संभावित पदवी-संबंधी तनाव नहीं मिटाया गया।
- source_word: save / saved
  choice: उद्धार; बच जाएगा
  rationale: धर्मवैचारिक कथन में ‘उद्धार’ और साँप के डसने के तत्काल प्रसंग में प्राकृतिक ‘बच जाएगा’ चुना गया है।
- source_word: make alive
  choice: जीवन देना
  rationale: मृत्यु और जीवन के धर्मवैचारिक विरोध को स्पष्ट रखता है, पर पुनरुत्थान का अधिक विशिष्ट अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: मूसा के फैले हाथों और काँसे के साँप की मसीह-संबंधी व्याख्या
  choice: लेखक के दावे को प्रत्यक्ष कथन के रूप में सुरक्षित रखा गया
  alternative: इसे केवल बाद की सम्भावित व्याख्या या उपमा के रूप में नरम करना
  rationale: अध्याय का मूल धर्मवैचारिक तर्क यही है; अनुवाद को उससे दूरी बनाकर उसे बदलना नहीं चाहिए।
- issue: ‘जिसे वे नष्ट समझेंगे, वही जीवन देगा’
  choice: कर्ता की अस्पष्टता और भविष्यकालीन तनाव बनाए रखा गया
