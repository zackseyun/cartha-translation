  language: hi
  text: 'जब उसने आज्ञा दी, तब वह क्या कहता है? “वह कौन है जो मुझसे विवाद करता है? वह मेरे सामने आ खड़ा हो। या वह कौन है जो मुझ पर मुकदमा चलाता है? वह प्रभु के सेवक के निकट आए।


    हाय तुम पर! क्योंकि तुम सब वस्त्र के समान पुराने हो जाओगे, और कीड़ा तुम्हें खा जाएगा।” फिर भविष्यद्वक्ता कहता है—क्योंकि उसे चूर करने के लिए कठोर पत्थर के समान ठहराया गया था—“देखो, मैं सिय्योन के सोतों में एक अत्यंत बहुमूल्य, चुना हुआ, आदरणीय प्रधान कोने का पत्थर रखूँगा।”[a]


    फिर वह क्या कहता है? “जो कोई उस पर आशा रखेगा, वह सदा जीवित रहेगा।” तो क्या हमारी आशा किसी पत्थर पर टिकी है? कदापि नहीं! बल्कि बात यह है कि प्रभु ने अपनी देह को सामर्थ्य में दृढ़ किया है। क्योंकि वह कहता है, “उसने मुझे कठोर चट्टान के समान ठहराया।”


    और भविष्यद्वक्ता फिर कहता है, “जिस पत्थर को राजमिस्त्रियों ने ठुकरा दिया था, वही कोने का सिरा बन गया।” और वह फिर कहता है, “यह वही महान और अद्भुत दिन है जिसे प्रभु ने बनाया।”


    मैं तुम्हें और भी सरल ढंग से लिख रहा हूँ, ताकि तुम समझ सको—मैं, जो तुम्हारे प्रेम का मैल हूँ।[b]


    तो भविष्यद्वक्ता फिर क्या कहता है? “कुकर्मियों की सभा मेरे चारों ओर इकट्ठी हो गई; उन्होंने मुझे ऐसे घेर लिया जैसे मधुमक्खियाँ छत्ते को घेरती हैं”; और, “उन्होंने मेरे वस्त्र के लिए चिट्ठी डाली।”


    क्योंकि वह देह में प्रकट होने और दुःख सहने वाला था, इसलिए उसका दुःख पहले ही प्रकट कर दिया गया। भविष्यद्वक्ता इस्राएल के विषय में कहता है, “हाय उनके प्राण पर! क्योंकि उन्होंने अपने ही विरुद्ध बुरी युक्ति रची और कहा, ‘आओ, हम धर्मी को बाँध दें, क्योंकि वह हमारे किसी काम का नहीं।’”


    दूसरा भविष्यद्वक्ता, मूसा, उनसे क्या कहता है? “देखो, प्रभु परमेश्वर यह कहता है: उस अच्छे देश में प्रवेश करो, जिसे प्रभु ने अब्राहम, इसहाक और याकूब को देने की शपथ खाई थी, और उसे विरासत में लो—ऐसा देश जिसमें दूध और मधु की धाराएँ बहती हैं।”


    पर ज्ञान क्या कहता है? समझो: उस पर आशा रखो जो तुम्हारे लिए देह में प्रकट होने वाला है, अर्थात् यीशु पर। क्योंकि मनुष्य दुःख सहने वाली मिट्टी है; आदम की रचना धरती की सतह से हुई थी।[c]


    तो वह क्या कहता है? “अच्छे देश में—ऐसे देश में जिसमें दूध और मधु की धाराएँ बहती हैं।” भाइयो, धन्य है हमारा प्रभु, जिसने हमारे बीच अपनी गुप्त बातों की बुद्धि और समझ स्थापित की। क्योंकि भविष्यद्वक्ता प्रभु के विषय में एक दृष्टान्त कहता है। उसे कौन समझेगा, सिवाय उसके जो बुद्धिमान और समझदार है और अपने प्रभु से प्रेम करता है?


    क्योंकि उसने पापों की क्षमा के द्वारा हमें नया किया, इसलिए उसने हमें एक नया प्रतिरूप बनाया, ताकि हमारे भीतर बच्चों-सा प्राण हो—मानो वह हमारी फिर से सृष्टि कर रहा हो।


    पवित्रशास्त्र हमारे विषय में कहता है कि वह पुत्र से कहता है, “हम मनुष्य को अपने स्वरूप के अनुसार, अपनी समानता में बनाएँ; और वे पृथ्वी के पशुओं, आकाश के पक्षियों और समुद्र की मछलियों पर शासन करें।” और जब प्रभु ने हम मनुष्यों की सुंदर रचना को देखा, तो कहा, “फलो-फूलो, बढ़ो और पृथ्वी को भर दो।” ये वचन पुत्र के विषय में हैं।


    मैं तुम्हें फिर दिखाऊँगा कि प्रभु हमारे विषय में कैसे बोलता है। उसने अंत में दूसरी सृष्टि की; और प्रभु कहता है, “देखो, मैं अंतिम वस्तुओं को पहली वस्तुओं के समान बनाता हूँ।” इसी के संबंध में भविष्यद्वक्ता ने घोषणा की, “दूध और मधु की धाराओं वाले देश में प्रवेश करो और उस पर प्रभुता करो।”


    तो देखो, हमारी नई सृष्टि हुई है, जैसा वह एक अन्य भविष्यद्वक्ता में फिर कहता है: “देखो, प्रभु कहता है, मैं इनमें से”—अर्थात् उनमें से जिन्हें प्रभु के आत्मा ने पहले से देखा—“उनके पत्थर के हृदय निकाल दूँगा और उनके भीतर मांस के हृदय रखूँगा”; क्योंकि वह स्वयं देह में प्रकट होने और हमारे भीतर निवास करने वाला था।


    क्योंकि भाइयो, हमारे हृदय का निवास-स्थान प्रभु के लिए एक पवित्र मंदिर है।[d]


    प्रभु फिर कहता है, “मैं किस वस्तु के साथ प्रभु अपने परमेश्वर के सामने उपस्थित होऊँ और महिमा पाऊँ? मैं अपने भाइयों की सभा में तेरा अंगीकार करूँगा और पवित्र लोगों की सभा के बीच तेरा गुणगान करूँगा।” इसलिए हम ही वे लोग हैं जिन्हें वह अच्छे देश में ले आया।


    तो दूध और मधु क्या हैं? बच्चा पहले मधु से और फिर दूध से जीवित रखा जाता है। उसी प्रकार हम भी प्रतिज्ञा पर अपने विश्वास और वचन के द्वारा जीवित रखे जाकर जीवन पाएँगे और पृथ्वी पर प्रभुता करेंगे।


    हम ऊपर पहले ही कह चुके हैं, “वे फलें-फूलें और बढ़ें तथा मछलियों पर शासन करें।” पर अब कौन पशुओं, मछलियों और आकाश के पक्षियों पर शासन कर सकता है?[e] हमें समझना चाहिए कि शासन करने का अर्थ सामर्थ्य रखना है—अर्थात् आदेश देना और प्रभुता करना।


    यदि यह अब पूरा नहीं होता, तो निश्चय ही उसने हमसे आने वाले युग के विषय में कहा था, जब हम स्वयं सिद्ध बनाए जाएँगे, ताकि प्रभु की वाचा के वारिस बन सकें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में “सिय्योन के सोतों में” है। संबंधित बाइबलीय पाठ में प्रायः “सिय्योन में” या “सिय्योन की नींव में” मिलता है; यहाँ विशिष्ट पाठ को सुरक्षित रखा गया है।
    reason: स्रोत-साक्ष्य की असामान्य पाठ-परंपरा और लंबित यूनानी/लातीनी समीक्षा बताना।
  - marker: b
    text: “तुम्हारे प्रेम का मैल” आत्म-दीनता का जानबूझकर कठोर रूपक है; अर्थ है कि लेखक अपने को अत्यंत तुच्छ मानता है।
