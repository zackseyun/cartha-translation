  text: 'Understand, therefore, children of gladness, that the good Lord revealed everything to us beforehand, so that we might know to whom we ought to give thanks and praise in all things.


    If, then, the Son of God, who is Lord and future Judge of the living and the dead, suffered so that his wound might give us life, let us believe that the Son of God could not have suffered except for our sake.


    Moreover, when he was crucified, he was given vinegar and gall to drink. Hear how the priests of the temple revealed this matter. Scripture contains a commandment: “Whoever does not observe the fast shall surely die.” Because the Lord was about to offer the vessel of his Spirit in his own person as a sacrifice for our sins, he commanded that the symbol given in Isaac, who was offered on the altar, should also be fulfilled.


    What, then, does he say in the prophet? “Let them eat from the goat that is offered during the fast for all their sins.” Pay careful attention: “Let the priests alone eat all the entrails, unwashed, with vinegar.”


    Why? “Since you are going to give me—who am about to offer my flesh for the sins of my new people—gall with vinegar to drink, you alone must eat, while the people fast and mourn in sackcloth and ashes.” This was to show that he must suffer at their hands.


    Pay attention to the commands he gave: “Take two goats, fair and alike, and offer them. Let the priest take one as a whole burnt offering for sins.”


    But what must they do with the other one? “The one is accursed,” he says. Notice how the symbol of Jesus is revealed.


    “All of you must spit on it and goad it, place scarlet wool around its head, and then let it be cast into the wilderness.” When this has been done, the one who takes the goat into the wilderness leads it away, removes the wool, and puts it on the branch called Rachia, the same plant whose shoots we are accustomed to eat when we find them in the countryside. The fruit of this briar alone is so sweet.


    What, then, does this mean? Pay attention. The one is at the altar, and the other is accursed. Moreover, the accursed one is crowned. For they will see him on that day wearing the long scarlet robe around his flesh, and they will say, “Is this not the one whom we once crucified, treated with contempt, and spat on? Truly, this was the one who then said that he was the Son of God.”


    For how is he like the goat? For this reason it says that the goats must be fair and alike, so that when they see him coming at that time, they may be astonished at his likeness to the goat. See, therefore, the symbol of Jesus who was to suffer.


    But what does it mean that they place the wool among the thorns? It is a symbol of Jesus set forth for the church, since whoever wished to remove the scarlet wool had to suffer many things because of the thorn’s terrible nature and, through affliction, gain mastery over it. Thus he says, “Those who desire to see me and to attain my kingdom must take hold of me through tribulation and affliction.”'
translation:
  language: hi
  text: '7


    इसलिए, हे आनन्द की सन्तानो, समझो कि भले प्रभु ने हमें सब बातें पहले ही प्रकट कर दीं, ताकि हम जानें कि हमें हर बात में किसे धन्यवाद और स्तुति देनी चाहिए।


    यदि परमेश्वर के पुत्र ने—जो प्रभु और जीवितों तथा मृतकों का भावी न्यायी है—इसलिए दुःख सहा कि उसका घाव हमें जीवन दे, तो हम विश्वास करें कि परमेश्वर के पुत्र ने केवल हमारे ही कारण दुःख सहा।


    और जब उसे क्रूस पर चढ़ाया गया, तब उसे पीने के लिए सिरका और पित्त दिया गया। सुनो कि मन्दिर के याजकों ने इस विषय को कैसे प्रकट किया। पवित्रशास्त्र में यह आज्ञा है, “जो कोई उपवास का पालन न करे, वह निश्चय मर जाएगा।” प्रभु स्वयं अपने आत्मा के पात्र को हमारे पापों के लिए बलिदान के रूप में अर्पित करने वाला था; इसलिए उसने आज्ञा दी कि वेदी पर अर्पित किए गए इसहाक में दिया गया प्रतीक भी पूरा हो।[a]


    तो वह भविष्यद्वक्ता में क्या कहता है? “जिस बकरे को उनके सब पापों के लिए उपवास के समय चढ़ाया जाता है, वे उसमें से खाएँ।” ध्यान से सुनो: “केवल सभी याजक ही सिरके के साथ बिना धोई हुई अंतड़ियाँ खाएँ।”[b]


    क्यों? “क्योंकि तुम मुझे—जो अपनी नई प्रजा के पापों के लिए अपना शरीर अर्पित करने वाला हूँ—पीने के लिए सिरके में मिला पित्त दोगे, इसलिए केवल तुम ही खाओ, जबकि लोग उपवास करें और टाट तथा राख में विलाप करें।” ऐसा इसलिए था कि वह दिखाए कि उसे उनके हाथों दुःख सहना होगा।


    उसकी दी हुई आज्ञाओं पर ध्यान दो: “दो सुन्दर और एक-समान बकरे लो और उन्हें चढ़ाओ। याजक उनमें से एक को पापों के लिए पूर्ण होमबलि के रूप में ले।”


    पर दूसरे का वे क्या करें? वह कहता है, “वह शापित है।” ध्यान दो कि यीशु का प्रतीक कैसे प्रकट होता है।


    “तुम सब उस पर थूको, उसे कोंचो, उसके सिर के चारों ओर लाल ऊन बाँधो, और फिर उसे निर्जन प्रदेश में छोड़ दिया जाए।” जब ऐसा हो जाता है, तो बकरे को निर्जन प्रदेश में ले जाने वाला व्यक्ति उसे वहाँ ले जाता है, ऊन उतारता है और उसे उस झाड़ी की डाल पर रख देता है जिसे ‘राखिया’ कहा जाता है। यह वही पौधा है जिसकी कोमल टहनियाँ देहात में मिलने पर हम खाया करते हैं। केवल इस काँटेदार झाड़ी का फल इतना मीठा होता है।[c]


    तो इसका अर्थ क्या है? ध्यान दो: एक वेदी पर है और दूसरा शापित; और शापित बकरे को मुकुट भी पहनाया गया है। क्योंकि उस दिन वे उसे अपने शरीर पर लम्बा लाल वस्त्र पहने देखेंगे और कहेंगे, “क्या यह वही नहीं है जिसे हमने कभी क्रूस पर चढ़ाया, तुच्छ जाना और जिस पर थूका था? सचमुच, यह वही था जिसने उस समय कहा था कि वह परमेश्वर का पुत्र है।”


    तो वह बकरे के समान कैसे है? इसी कारण कहा गया है कि दोनों बकरे सुन्दर और एक-समान हों, ताकि जब वे उस समय उसे आते देखें, तो बकरे से उसकी समानता देखकर चकित रह जाएँ। इसलिए उस यीशु के प्रतीक को देखो जिसे दुःख सहना था।


    पर ऊन को काँटों के बीच रखने का क्या अर्थ है? यह कलीसिया के सामने रखा गया यीशु का प्रतीक है, क्योंकि जो कोई उस लाल ऊन को निकालना चाहता था, उसे काँटे की भयानक प्रकृति के कारण बहुत दुःख उठाना पड़ता था और क्लेश सहकर उस पर अधिकार पाना होता था। इसी प्रकार वह कहता है, “जो मुझे देखना और मेरे राज्य तक पहुँचना चाहते हैं, उन्हें दुःख और क्लेश के बीच मुझे थामना होगा।”


    [a] “अपने आत्मा के पात्र” का आशय देह से प्रतीत होता है, पर मूल अभिव्यक्ति के रूपक को बनाए रखा गया है। इसहाक का उल्लेख उत्पत्ति 22 में उसके अर्पण की ओर संकेत करता है।

    [b] यहाँ उद्धृत उपवास और बकरों से जुड़ी विधियाँ उपलब्ध पुराने नियम के पाठ से शब्दशः मेल नहीं खातीं। लेखक सम्भवतः किसी प्रचलित परम्परा या अब लुप्त विधि-विवरण का उपयोग कर रहा है। “सिरके के साथ बिना धोई हुई अंतड़ियाँ” पाठ की कठिन और सम्भवतः अनिश्चित अभिव्यक्ति है।

    [c] ‘राखिया’ पौधे का प्राचीन नाम है; उसकी निश्चित आधुनिक पहचान अज्ञात है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने आत्मा के पात्र” का आशय देह से प्रतीत होता है, पर मूल अभिव्यक्ति के रूपक को बनाए रखा गया है। इसहाक का उल्लेख उत्पत्ति 22 में उसके अर्पण की ओर संकेत करता है।
    reason: रूपक और शास्त्रीय संकेत सामान्य पाठक के लिए अस्पष्ट हो सकते हैं।
  - marker: b
    text: यहाँ उद्धृत उपवास और बकरों से जुड़ी विधियाँ उपलब्ध पुराने नियम के पाठ से शब्दशः मेल नहीं खातीं। लेखक सम्भवतः किसी प्रचलित परम्परा या अब लुप्त विधि-विवरण का उपयोग कर रहा है। “सिरके के साथ बिना धोई हुई अंतड़ियाँ” पाठ की कठिन और सम्भवतः अनिश्चित अभिव्यक्ति है।
    reason: पाठीय और परम्परागत अनिश्चितता को छिपाने के बजाय स्पष्ट करना आवश्यक है।
  - marker: c
    text: ‘राखिया’ पौधे का प्राचीन नाम है; उसकी निश्चित आधुनिक पहचान अज्ञात है।
    reason: अज्ञात वनस्पति की काल्पनिक पहचान से बचना।
lexical_decisions:
- source_word: τέκνα εὐφροσύνης / children of gladness
  choice: हे आनन्द की सन्तानो
  rationale: सम्बोधन की आत्मीयता और ‘gladness’ के धार्मिक-भावात्मक अर्थ को बनाए रखते हुए dignified Hindi चुनी गई।
- source_word: ζώντων καὶ νεκρῶν / quick and dead
  choice: जीवितों तथा मृतकों
  rationale: आधुनिक हिन्दी में स्पष्ट और पारम्परिक न्याय-विषयक युग्म।
- source_word: τὸ σκεῦος τοῦ πνεύματος / vessel of his Spirit
  choice: अपने आत्मा के पात्र
  rationale: देह के सम्भावित आशय को मुख्य पाठ में स्पष्ट करके रूपक समाप्त नहीं किया गया।
- source_word: τύπος / type
  choice: प्रतीक
  rationale: ‘प्रतिरूप’ की अपेक्षा सामान्य पाठक के लिए सुबोध, किन्तु पूर्वसंकेतात्मक अर्थ को संदर्भ में सुरक्षित रखता है।
- source_word: ὁλοκαύτωμα / whole burnt offering
  choice: पूर्ण होमबलि
  rationale: सम्पूर्णतः जलाए जाने वाले बलिदान का संस्कारगत अर्थ बनाए रखता है।
- source_word: ἐρημία / wilderness
  choice: निर्जन प्रदेश
  rationale: केवल रेगिस्तान का अनावश्यक बोध दिए बिना निर्जन स्थान का अर्थ व्यक्त करता है।
- source_word: ῥαχία / Rachia
  choice: राखिया
  rationale: अनिश्चित वनस्पति-नाम का लिप्यन्तरण किया गया; अनुमानित आधुनिक पहचान नहीं थोपी गई।
- source_word: ἐκκλησία / church
  choice: कलीसिया
  rationale: आरम्भिक मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग, बिना आधुनिक संस्थागत अर्थ को प्रधान किए।
- source_word: θλῖψις / tribulation, affliction
  choice: दुःख और क्लेश
  rationale: दोहराए गए कष्ट-सूचक पदों के बल और आध्यात्मिक तनाव को बनाए रखता है।
theological_decisions:
- issue: पुत्र के दुःख का कारण
  choice: “केवल हमारे ही कारण दुःख सहा”
  alternative: “हमारे लिए दुःख सहा”
  rationale: ‘except for our sake’ की विशिष्टता को सुरक्षित रखा गया, बिना प्रायश्चित्त का कोई बाद का सम्प्रदायगत सिद्धान्त जोड़ने के।
- issue: “उसका घाव हमें जीवन दे”
  choice: घाव के एकवचन और जीवनदायी विरोधाभास को जस का तस रखा
  alternative: “उसकी मृत्यु से हमें जीवन मिले”
  rationale: पाठ ‘घाव’ कहता है; इसे ‘मृत्यु’ में बदलना लेखक की विशिष्ट छवि को अनावश्यक रूप से हल कर देता।
- issue: दो बकरों का मसीही प्रतीकार्थ
