  yaml_path: translation/extra_canonical/epistle_of_barnabas/015.yaml
  text: 'Moreover, concerning the Sabbath, it is likewise written in the Ten Words, which he spoke to Moses face to face on Mount Sinai: “You shall make holy the Sabbath of the Lord with pure hands and a pure heart.”


    And in another place he says, “If my sons observe the Sabbath, then I will bestow my mercy upon them.”


    He speaks of the Sabbath at the beginning of creation: “And God made the works of his hands in six days, and he finished on the seventh day, rested on it, and made it holy.”


    Pay attention, children, to what this means: “He finished in six days.” He means that in six thousand years the Lord will bring all things to an end, for with him a day signifies a thousand years. He himself testifies to me about this, saying, “Behold, the day of the Lord will be as a thousand years.” Therefore, children, in six days—that is, in six thousand years—everything will come to an end.


    “And he rested on the seventh day.” This is what he means: when his Son comes and abolishes the time of the Lawless One, judges the ungodly, and changes the sun, the moon, and the stars, then he will truly rest on the seventh day.


    Yes, and furthermore he says, “You shall make it holy with pure hands and a pure heart.” Therefore, if anyone is now able to make holy the day that God made holy, even though he is pure in heart, we have gone completely astray.


    But if it is only afterward, and not until then, that we will truly rest and make it holy—when we ourselves are able to do so after being justified and receiving the promise, when iniquity is no more and all things have been made new by the Lord—then we will be able to make it holy, because we ourselves will first have been made holy.


    Finally, he says to them, “Your new moons and your Sabbaths I cannot endure.” You see what he means: it is not your present Sabbaths that are acceptable [to me], but the Sabbath that I have made. On that Sabbath, when I have brought all things to rest, I will make the beginning of the eighth day, which is the beginning of another world.


    Therefore, we also keep the eighth day for rejoicing, on which Jesus also rose from the dead and, after being revealed, ascended into the heavens.'
translation:
  language: hi
  text: '15 इसके अतिरिक्त, सब्त के विषय में भी उन दस वचनों में लिखा है, जिन्हें उसने सीनै पर्वत पर मूसा से आमने-सामने कहा था: “तुम शुद्ध हाथों और शुद्ध हृदय से प्रभु के सब्त को पवित्र मानना।”[a]


    और एक दूसरे स्थान पर वह कहता है, “यदि मेरे पुत्र सब्त मानें, तो मैं उन पर अपनी दया करूँगा।”[b]


    सृष्टि के आरम्भ में वह सब्त के विषय में कहता है: “परमेश्वर ने अपने हाथों के काम छः दिनों में किए; सातवें दिन उसने उन्हें पूरा किया, उस दिन विश्राम किया और उसे पवित्र ठहराया।”[c]


    बच्चो, ध्यान दो कि इसका क्या अर्थ है: “उसने छः दिनों में पूरा किया।” इसका अर्थ है कि प्रभु छः हज़ार वर्षों में सब कुछ अन्त तक पहुँचा देगा, क्योंकि उसके लिए एक दिन हज़ार वर्षों का सूचक है। वह स्वयं इसकी गवाही मुझे देता है: “देखो, प्रभु का दिन हज़ार वर्षों के समान होगा।”[d] इसलिए, बच्चो, छः दिनों में—अर्थात् छः हज़ार वर्षों में—सब कुछ अन्त तक पहुँच जाएगा।


    “और उसने सातवें दिन विश्राम किया।” इसका अर्थ यह है: जब उसका पुत्र आएगा, अधर्मी के समय का अन्त कर देगा, भक्तिहीनों का न्याय करेगा और सूर्य, चन्द्रमा तथा तारों को बदल देगा, तब वह सचमुच सातवें दिन विश्राम करेगा।[e]


    और आगे वह कहता है, “तुम शुद्ध हाथों और शुद्ध हृदय से उसे पवित्र मानना।” इसलिए, यदि कोई मनुष्य अभी उस दिन को पवित्र मान सकता है जिसे परमेश्वर ने पवित्र ठहराया है—भले ही उसका हृदय शुद्ध हो—तो हम पूरी तरह भटक गए हैं।[f]


    परन्तु यदि हम बाद में ही—उससे पहले नहीं—सचमुच विश्राम करेंगे और उसे पवित्र मानेंगे, अर्थात् तब, जब धर्मी ठहराए जाने और प्रतिज्ञा पाने के बाद हम ऐसा करने योग्य होंगे, जब अधर्म नहीं रहेगा और प्रभु सब कुछ नया कर चुका होगा, तब हम उसे पवित्र मान सकेंगे, क्योंकि पहले हम स्वयं पवित्र किए जा चुके होंगे।


    अन्त में वह उनसे कहता है, “तुम्हारे नए चाँदों और तुम्हारे सब्तों को मैं सह नहीं सकता।”[g] तुम देखते हो कि उसका अर्थ क्या है: तुम्हारे वर्तमान सब्त मुझे स्वीकार्य नहीं हैं, बल्कि वह सब्त स्वीकार्य है जिसे मैंने बनाया है। उसमें, जब मैं सब कुछ विश्राम दे चुका होऊँगा, तब मैं आठवें दिन का आरम्भ करूँगा, जो एक दूसरे संसार का आरम्भ है।


    इसीलिए हम भी आठवाँ दिन आनन्द मनाते हुए रखते हैं; उसी दिन यीशु मृतकों में से जी उठा और प्रकट होने के बाद स्वर्गों पर चढ़ गया।[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दस वचन” से आशय उन आज्ञाओं से है जिन्हें सामान्यतः “दस आज्ञाएँ” कहा जाता है। यह उद्धरण निर्गमन 20:8 और व्यवस्थाविवरण 5:12 से मिलता-जुलता है, पर “शुद्ध हाथों और शुद्ध हृदय” वाले शब्द वहाँ इसी रूप में नहीं मिलते।
    reason: संयुक्त अथवा परम्परागत उद्धरण और शब्दावली स्पष्ट करना।
  - marker: b
    text: इस कथन का ठीक-ठीक ज्ञात शास्त्रीय स्रोत अनिश्चित है; यह यिर्मयाह 17:24–26 जैसी सब्त-सम्बन्धी प्रतिज्ञाओं की प्रतिध्वनि हो सकता है।
    reason: अनिश्चित उद्धरण-स्रोत को ईमानदारी से दर्ज करना।
  - marker: c
    text: तुलना करें उत्पत्ति 2:2–3। पाठ की भाषा बाइबलीय कथन का निकट रूपान्तर है।
    reason: अन्तर्पाठीय सन्दर्भ देना।
  - marker: d
    text: तुलना करें भजन 90:4 और 2 पतरस 3:8। लेखक सृष्टि के प्रत्येक दिन को एक हज़ार वर्ष के अनुरूप समझता है।
    reason: लेखक की काल-व्याख्या के शास्त्रीय आधार को स्पष्ट करना।
  - marker: e
    text: “अधर्मी” मूल में किसी विशेष ‘व्यवस्थाहीन’ व्यक्ति या शक्ति की ओर संकेत कर सकता है। सर्वनाम “वह” का संदर्भ परमेश्वर अथवा उसके पुत्र से हो सकता है; अनुवाद ने इसे निर्णीत नहीं किया है।
    reason: वास्तविक भाषिक और धर्मवैज्ञानिक अस्पष्टता सुरक्षित रखना।
  - marker: f
    text: 'इस वाक्य का तर्क कठिन है: लेखक कहता है कि वर्तमान युग में पूर्ण रूप से पवित्र सब्त मनाने की क्षमता मान लेना उसकी पूरी व्याख्या को गलत ठहराएगा।'
    reason: जटिल शर्त-वाक्य को समझने में सहायता देना।
  - marker: g
    text: तुलना करें यशायाह 1:13–14। “नए चाँद” मास के आरम्भ पर मनाए जाने वाले धार्मिक पर्व थे।
    reason: प्राचीन सांस्कृतिक पद और उद्धरण-स्रोत स्पष्ट करना।
  - marker: h
    text: “आठवाँ दिन” सात-दिवसीय क्रम के बाद आने वाले दिन और भावी नए संसार—दोनों का प्रतीक है। लेखक इसे यीशु के पुनरुत्थान से जोड़ता है।
    reason: अध्याय के मुख्य प्रतीकात्मक सम्बन्ध को स्पष्ट करना, बिना ‘रविवार’ शब्द पाठ में जोड़ने के।
lexical_decisions:
- source_word: 'Sabbath (Greek: σάββατον, source review pending)'
  choice: सब्त
  rationale: यह प्रचलित हिन्दी बाइबलीय शब्द है और विश्राम-दिन तथा लेखक की युग-संबंधी व्याख्या के बीच शब्दगत निरन्तरता बनाए रखता है।
- source_word: 'Ten Words (Greek likely: δέκα λόγοι)'
  choice: दस वचन
  rationale: ‘दस आज्ञाएँ’ के बजाय स्रोत की शब्दावली को निकटता से सुरक्षित रखता है।
- source_word: hallow / make holy
  choice: पवित्र मानना / पवित्र ठहराना / पवित्र करना
  rationale: सन्दर्भानुसार मनुष्य द्वारा दिन के पवित्र पालन, परमेश्वर द्वारा दिन को पवित्र ठहराने और मनुष्यों के पवित्र किए जाने का भेद रखा गया है।
- source_word: Lawless One
  choice: अधर्मी
  rationale: व्यक्तिवाचक संकेत को बनाए रखते हुए हिन्दी में स्वाभाविक पद चुना गया; यह किसी विशिष्ट बाद की पहचान को पाठ में नहीं जोड़ता।
- source_word: new moons
  choice: नए चाँद
  rationale: प्राचीन मासिक धार्मिक पर्व का शाब्दिक बिम्ब सुरक्षित है; फुटनोट अर्थ स्पष्ट करता है।
- source_word: eighth day
  choice: आठवाँ दिन
  rationale: लेखक के सातवें दिन के बाद नए युग के प्रतीकात्मक क्रम को ज्यों का त्यों रखा गया है।
- source_word: 'another world (Greek likely: ἄλλος κόσμος)'
  choice: एक दूसरा संसार
  rationale: ‘नया युग’ कहकर अर्थ को पहले से सीमित करने के बजाय स्रोत की विश्व-संबंधी भाषा और सम्भावित अर्थ-विस्तार को सुरक्षित रखता है।
theological_decisions:
- issue: छः दिनों को छः हज़ार वर्षों के रूप में पढ़ना
  choice: लेखक की व्याख्या को सीधे कथन के रूप में रखा गया
  alternative: इसे केवल रूपक या अनुमान कहकर नरम करना
  rationale: यह अध्याय का वास्तविक युगान्त-संबंधी तर्क है; अनुवाद को उससे सहमत या असहमत हुए बिना उसे स्पष्ट रूप से प्रस्तुत करना चाहिए।
- issue: ‘उसका पुत्र’ और सातवें दिन का विश्राम
  choice: 'कर्ता-संबंधी स्रोतगत तनाव को बनाए रखा: पुत्र कार्य करता है, फिर ‘वह’ विश्राम करता है'
  alternative: स्पष्ट रूप से ‘परमेश्वर’ या ‘पुत्र’ जोड़ना
  rationale: उपलब्ध साक्ष्य में सर्वनाम का संदर्भ पूरी तरह स्पष्ट नहीं; किसी एक धर्मवैज्ञानिक समाधान को आरोपित नहीं किया गया।
- issue: वर्तमान में सब्त को पवित्र मानने की असमर्थता
  choice: कठिन शर्त-वाक्य को लेखक के भावी पूर्ण पवित्रीकरण वाले तर्क सहित रखा
  alternative: इसे वर्तमान सब्त-पालन की साधारण निन्दा में बदलना
  rationale: लेखक का तर्क केवल रीति के विरोध का नहीं, बल्कि धर्मी ठहराए जाने, प्रतिज्ञा और भावी नवीनीकरण का है।
- issue: आठवें दिन का पालन
  choice: ‘आनन्द मनाते हुए रखते हैं’
  alternative: ‘रविवार की उपासना करते हैं’
  rationale: पाठ में रविवार या किसी विशिष्ट उपासना-विधान का स्पष्ट नाम नहीं है; बाद की कलीसियाई शब्दावली नहीं जोड़ी गई।
- issue: यीशु का प्रकट होना और स्वर्गारोहण
  choice: ‘प्रकट होने के बाद स्वर्गों पर चढ़ गया’
  alternative: कालक्रम को किसी सुसमाचार-सामंजस्य के अनुसार विस्तार देना
  rationale: लेखक का संक्षिप्त कथन ज्यों का त्यों रखा गया, बिना बाहरी विवरण जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। उद्धरणों में हल्का शास्त्रीय स्वर रखा गया है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है और प्रत्यक्ष यूनानी/लातीनी समीक्षा अभी लंबित है; इसलिए सम्भावित मूल-शब्दों के दावे सावधानी से किए गए हैं और पाठगत अस्पष्टताओं को फुटनोटों में सुरक्षित रखा गया है।
