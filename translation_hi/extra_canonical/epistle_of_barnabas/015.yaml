  revised_text: '15 इसके अतिरिक्त, सब्त के विषय में भी उन दस वचनों में लिखा है, जिन्हें उसने सीनै पर्वत पर मूसा से आमने-सामने कहा था: “तुम शुद्ध हाथों और शुद्ध हृदय से प्रभु के सब्त को पवित्र मानो।”[a]


    और एक दूसरे स्थान पर वह कहता है, “यदि मेरे पुत्र सब्त का पालन करें, तो मैं उन पर अपनी दया करूँगा।”[b]


    सृष्टि के आरंभ में वह सब्त के विषय में कहता है: “परमेश्वर ने अपने हाथों के कार्य छह दिनों में बनाए; सातवें दिन उसने अपना काम पूरा किया, उस दिन विश्राम किया और उसे पवित्र ठहराया।”[c]


    बच्चों, ध्यान दो कि इसका क्या अर्थ है: “उसने छह दिनों में पूरा किया।” इसका अर्थ है कि प्रभु छह हज़ार वर्षों में सब कुछ अंत तक पहुँचा देगा, क्योंकि उसके यहाँ एक दिन हज़ार वर्षों का सूचक है। वह स्वयं इसकी गवाही मुझे देता है: “देखो, प्रभु का दिन हज़ार वर्षों के समान होगा।”[d] इसलिए, बच्चों, छह दिनों में—अर्थात् छह हज़ार वर्षों में—सब कुछ अंत तक पहुँच जाएगा।


    “और उसने सातवें दिन विश्राम किया।” इसका अर्थ यह है: जब उसका पुत्र आएगा, उस व्यवस्थाहीन के समय को समाप्त कर देगा, भक्तिहीनों का न्याय करेगा और सूर्य, चन्द्रमा तथा तारों को बदल देगा, तब वह सचमुच सातवें दिन विश्राम करेगा।[e]


    और आगे वह कहता है, “तुम शुद्ध हाथों और शुद्ध हृदय से उसे पवित्र मानो।” इसलिए, यदि कोई मनुष्य अभी उस दिन को पवित्र मान सकता है जिसे परमेश्वर ने पवित्र ठहराया है—भले ही उसका हृदय शुद्ध हो—तो हम पूरी तरह भटक गए हैं।[f]


    परन्तु यदि हम बाद में ही—उससे पहले नहीं—सचमुच विश्राम करेंगे और उसे पवित्र मानेंगे, अर्थात् तब, जब धर्मी ठहराए जाने और प्रतिज्ञा पाने के बाद हम ऐसा करने योग्य होंगे, जब अधर्म नहीं रहेगा और प्रभु सब कुछ नया कर चुका होगा, तब हम उसे पवित्र मान सकेंगे, क्योंकि पहले हम स्वयं पवित्र किए जा चुके होंगे।


    अंत में वह उनसे कहता है, “तुम्हारे नए चाँदों और तुम्हारे सब्तों को मैं सह नहीं सकता।”[g] तुम देखते हो कि उसका अर्थ क्या है: तुम्हारे वर्तमान सब्त [मेरे लिए] स्वीकार्य नहीं हैं, बल्कि वह सब्त है जिसे मैंने बनाया है। उसमें, जब मैं सब कुछ को विश्राम में पहुँचा चुका होऊँगा, तब मैं आठवें दिन का आरंभ करूँगा, जो एक दूसरे संसार का आरंभ है।


    इसीलिए हम भी आठवें दिन को आनन्द के साथ मनाते हैं; उसी दिन यीशु मृतकों में से जी उठा और प्रकट होने के बाद स्वर्गों पर चढ़ गया।[h]'
