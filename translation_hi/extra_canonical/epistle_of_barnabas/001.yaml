base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/001.yaml
  text: 'I greet you, sons and daughters, in the name of the Lord who loved us, in peace.


    Seeing that the ordinances of God are great and rich unto you, I rejoice with exceedingly great and overflowing joy over your blessed and glorious spirits; so innate is the grace of the spiritual gift you have received.


    Therefore, I congratulate myself all the more, hoping to be saved, because I truly see that the Spirit has been poured out among you from the riches of the Lord’s fountain. The greatly desired sight of you amazed me so much concerning you.


    Being persuaded of this, and knowing within myself that, after saying many things among you, I know that the Lord traveled with me on the way of righteousness, I am also wholly compelled to love you more than my own soul—for great faith and love dwell in you through the hope of the life that is his—considering this, therefore, that,


    if I take care to share with you some portion of what I received, it will become my reward for having ministered to such spirits, I was eager to send you something small, so that together with your faith you might also have complete knowledge.


    Well then, there are three ordinances of the Lord: *the hope of life, which is the beginning and end of our faith; righteousness, which is the beginning and end of judgment; and love displayed in gladness and exultation, the testimony of works of righteousness.*


    For the Lord made known to us through his prophets things past and present, giving us likewise the firstfruits of the taste of things future. Seeing each of these things coming to pass one by one, just as he said, we ought to offer a richer and higher offering to the fear of him. But I, not as though I were a teacher, but as one of you, will set out a few things by which you will be gladdened in the present circumstances.'
translation:
  language: hi
  text: 'हे पुत्रो और पुत्रियो, जिस प्रभु ने हमसे प्रेम किया, उसके नाम में तुम्हें शांति सहित नमस्कार।


    मैं यह देखकर अत्यंत उमड़ते हुए आनंद से प्रसन्न हूँ कि परमेश्वर की विधियाँ तुम्हारे लिए महान और समृद्ध हैं, और तुम्हारी आत्माएँ धन्य और महिमामय हैं; तुम्हें मिले आत्मिक वरदान का अनुग्रह तुममें इस प्रकार बस गया है।


    इसलिए उद्धार पाने की आशा में मैं अपने आपको और भी धन्य मानता हूँ, क्योंकि मैं सचमुच देखता हूँ कि प्रभु के सोते की समृद्धि में से आत्मा तुम पर उंडेला गया है। तुम्हारे बहुप्रतीक्षित दर्शन ने तुम्हारे विषय में मुझे अत्यंत चकित कर दिया।


    इस बात का विश्वास होने पर, और अपने भीतर यह जानते हुए कि तुम्हारे बीच बहुत-सी बातें कहने के बाद मैंने अनुभव किया कि प्रभु धार्मिकता के मार्ग पर मेरे साथ चला, मैं स्वयं भी पूरी तरह विवश हूँ कि अपने प्राण से बढ़कर तुमसे प्रेम करूँ—क्योंकि उस जीवन की आशा के द्वारा जो उसका है, तुममें महान विश्वास और प्रेम वास करते हैं। इसलिए मैंने यह विचार किया:


    यदि मैं उस चीज़ का कुछ अंश तुम्हारे साथ बाँटने का प्रयत्न करूँ जो मुझे मिली है, तो ऐसी आत्माओं की सेवा करने के कारण यह मेरे लिए प्रतिफल होगा। इसी कारण मैं तुम्हें थोड़ी-सी बात लिख भेजने को उत्सुक हुआ, ताकि विश्वास के साथ-साथ तुम्हारा ज्ञान भी पूर्ण हो जाए।


    तो फिर, प्रभु की तीन विधियाँ हैं: जीवन की आशा, जो हमारे विश्वास का आरंभ और अंत है; धार्मिकता, जो न्याय का आरंभ और अंत है; और आनंद तथा उल्लास में प्रकट होने वाला प्रेम, जो धार्मिकता के कामों की गवाही है।[a]


    क्योंकि प्रभु ने अपने भविष्यद्वक्ताओं के द्वारा हमें बीती और वर्तमान बातें बताईं, और भविष्य की बातों के स्वाद का प्रथम फल भी हमें दिया। जब हम इनमें से प्रत्येक बात को ठीक वैसे ही एक-एक करके पूरा होते देखते हैं जैसे उसने कहा था, तब हमें उसके भय के लिए और अधिक समृद्ध तथा ऊँची भेंट चढ़ानी चाहिए।[b] पर मैं शिक्षक बनकर नहीं, बल्कि तुममें से एक होकर कुछ बातें सामने रखूँगा, जिनसे तुम वर्तमान परिस्थितियों में आनंदित हो सको।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रभु की तीन विधियाँ’ वाला वाक्य अत्यंत संक्षिप्त है। उपलब्ध प्राचीन साक्ष्यों की वाक्य-रचना और विराम-चिह्न अलग ढंग से समझे जा सकते हैं; यहाँ आशा, धार्मिकता और प्रेम को तीन विधियों के रूप में प्रस्तुत किया गया है।
    reason: सूची की प्राचीन वाक्य-संरचना में वास्तविक व्याख्यात्मक अस्पष्टता है।
  - marker: b
    text: ‘उसके भय के लिए भेंट चढ़ाना’ का भाव संभवतः परमेश्वर के प्रति भय-भक्ति को बढ़ाना या अधिक उत्कृष्ट रूप से अर्पित करना है; मूल रूपक को पाठ में सुरक्षित रखा गया है।
    reason: शाब्दिक भेंट-रूपक आधुनिक पाठक को अस्पष्ट लग सकता है और इसे चुपचाप केवल ‘श्रद्धा बढ़ाना’ कहना मूल को संकीर्ण करेगा।
lexical_decisions:
- source_word: δικαιώματα / ordinances
  choice: विधियाँ
  rationale: यहाँ आशय प्रभु द्वारा ठहराए गए नैतिक-धार्मिक निर्देशों से है; ‘विधियाँ’ कानूनी कठोरता थोपे बिना मूल की व्यापकता बनाए रखता है।
- source_word: πνευματικῆς δωρεᾶς / spiritual gift
  choice: आत्मिक वरदान
  rationale: ‘वरदान’ प्राप्त दान का भाव और ‘आत्मिक’ उसके पवित्र आत्मा-संबंधी आयाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁδῷ δικαιοσύνης / way of righteousness
  choice: धार्मिकता का मार्ग
  rationale: प्रारंभिक मसीही नैतिक भाषा और मार्ग-रूपक दोनों सुरक्षित रहते हैं।
- source_word: γνῶσις / knowledge
  choice: ज्ञान
  rationale: पाठ में विश्वास के साथ पूर्ण किए जाने वाले बोध का सामान्य अर्थ है; किसी विशिष्ट ज्ञानवादी तकनीकी अर्थ को आरोपित नहीं किया गया।
- source_word: ἀπαρχή / firstfruits
  choice: प्रथम फल
  rationale: भविष्य की वास्तविकता के आरंभिक स्वाद या अग्रिम अनुभव का कृषि-रूपक बनाए रखा गया है।
- source_word: φόβος / fear
  choice: भय
  rationale: मूल की धार्मिक गंभीरता और श्रद्धामिश्रित भय को ‘भय’ बनाए रखता है; केवल ‘श्रद्धा’ कहना अर्थ को संकीर्ण कर देता।
theological_decisions:
- issue: ‘उद्धार पाने की आशा’ में लेखक का आत्म-संदर्भ
  choice: उद्धार पाने की आशा में मैं अपने आपको और भी धन्य मानता हूँ
  alternative: मुझे अपने उद्धार का और अधिक भरोसा होता है
  rationale: पाठ की आशापूर्ण किंतु अनिर्णीत अभिव्यक्ति को बनाए रखा गया है; निश्चित उद्धार की शिक्षा इसमें नहीं जोड़ी गई।
- issue: ‘उस जीवन की आशा जो उसका है’ का संदर्भ
  choice: उस जीवन की आशा के द्वारा जो उसका है
  alternative: उस अनंत जीवन की आशा के द्वारा जो वह देता है
  rationale: मूल अभिव्यक्ति का संबंध अस्पष्ट है; ‘अनंत’ और ‘वह देता है’ जोड़कर अस्पष्टता का समाधान नहीं किया गया।
- issue: तीन विधियों की वाक्य-संरचना
  choice: आशा, धार्मिकता और प्रेम—तीन समांतर तत्व
  alternative: आशा और धार्मिकता के बाद प्रेम को केवल धार्मिक कामों की व्याख्या मानना
  rationale: प्राप्त साक्ष्य में तीन विधियाँ स्पष्ट रूप से घोषित हैं, इसलिए सूची को तीन भागों में रखा गया, जबकि प्रत्येक भाग के जटिल विशेषण सुरक्षित हैं।
- issue: ‘आत्मा उंडेला गया’ का कर्ता और स्वरूप
  choice: आत्मा तुम पर उंडेला गया है
  alternative: पवित्र आत्मा के वरदान तुममें भरपूर हैं
  rationale: उंडेले जाने की बाइबिलीय छवि और व्यक्तिगत ‘आत्मा’ को बनाए रखा गया; पाठ से बाहर स्पष्टीकरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पत्रात्मक और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। लंबे यूनानी ढंग के वाक्यों को अर्थ-संबंध बचाते हुए कुछ हद तक विभाजित किया गया है। ‘तुम’ बहुवचन समुदाय-संबोधन के रूप में प्रयुक्त है। उपलब्ध इनपुट स्वयं सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है और प्रत्यक्ष यूनानी/लैटिन समीक्षा लंबित बताता है; अतः यह स्रोत-साक्ष्य-सचेत, पर अनिवार्यतः प्रारंभिक प्रकाशन-मसौदा है।
