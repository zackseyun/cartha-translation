  revised_text: 'हे पुत्रो और पुत्रियो, जिस प्रभु ने हमसे प्रेम किया है, उसके नाम में तुम्हें शांति सहित नमस्कार।


    परमेश्वर की विधियाँ तुम्हारे लिए महान और समृद्ध हैं; इसलिए मैं तुम्हारी धन्य और महिमामय आत्माओं के विषय में अत्यंत बड़े और उमड़ते हुए आनंद से प्रसन्न हूँ। तुम्हें प्राप्त आत्मिक वरदान के अनुग्रह ने तुममें ऐसा स्वाभाविक स्थान पा लिया है।


    इसलिए, उद्धार पाने की आशा रखते हुए, मैं अपने को और भी धन्य मानता हूँ, क्योंकि मैं सचमुच देखता हूँ कि प्रभु के सोते की समृद्धि में से आत्मा तुम्हारे बीच उंडेला गया है। तुम्हारे बहुप्रतीक्षित दर्शन ने तुम्हारे विषय में मुझे अत्यंत चकित कर दिया।


    इस बात का विश्वास होने पर, और अपने भीतर यह जानते हुए कि तुम्हारे बीच बहुत-सी बातें कहने के बाद मैं जानता हूँ कि प्रभु धार्मिकता के मार्ग पर मेरे साथ चला, मैं भी पूरी तरह इस बात के लिए विवश हूँ कि अपने प्राण से बढ़कर तुमसे प्रेम करूँ—क्योंकि उस जीवन की आशा के द्वारा, जो उसका है, तुममें महान विश्वास और प्रेम वास करते हैं—इसलिए मैंने यह विचार किया कि,


    यदि जो मुझे प्राप्त हुआ है उसमें से कुछ तुम्हारे साथ बाँटने की मैं चिंता करूँ, तो ऐसी आत्माओं की सेवा करने के कारण यह मेरे लिए प्रतिफल होगा। इसी कारण मैं तुम्हें कुछ छोटा-सा लिख भेजने को उत्सुक हुआ, ताकि तुम्हारे विश्वास के साथ-साथ तुम्हारा ज्ञान भी पूर्ण हो जाए।


    तो फिर, प्रभु की तीन विधियाँ हैं: जीवन की आशा, जो हमारे विश्वास का आरंभ और अंत है; धार्मिकता, जो न्याय का आरंभ और अंत है; और आनंद तथा उल्लास में प्रकट होने वाला प्रेम, जो धार्मिकता के कामों की गवाही है।[a]


