base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/018.yaml
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
translation:
  language: hi
  text: 'पर अब हम एक और शिक्षा और उपदेश की ओर बढ़ें। शिक्षा और सामर्थ्य के दो मार्ग हैं—एक प्रकाश का और दूसरा अंधकार का; और इन दोनों मार्गों में बहुत बड़ा अंतर है। क्योंकि एक मार्ग पर परमेश्वर के प्रकाश देनेवाले स्वर्गदूत नियुक्त हैं, और दूसरे पर शैतान के स्वर्गदूत।


    और एक अनादि काल से अनंत काल तक प्रभु है, जबकि दूसरा इस वर्तमान अधर्म के काल का प्रभु है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दूसरा ... प्रभु’ उपलब्ध अंग्रेज़ी साक्ष्य का निकट अनुवाद है और संभवतः शैतान की ओर संकेत करता है। यहाँ उसकी प्रभुता केवल वर्तमान अधर्म के काल तक सीमित दिखाई गई है। यूनानी और लातीनी पाठों की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: वाक्य की संभावित पहचान और धार्मिक तनाव को बिना चुपचाप सुलझाए स्पष्ट करना तथा मसौदे के अंतरिम स्रोताधार की सूचना देना।
lexical_decisions:
- source_word: lesson and teaching
  choice: शिक्षा और उपदेश
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में आए निकटार्थी किंतु अलग दोनों पदों को बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी दी गई है।
- source_word: two ways of teaching and of power
  choice: शिक्षा और सामर्थ्य के दो मार्ग
  rationale: ‘मार्ग’ की नैतिक-धार्मिक छवि तथा ‘teaching’ और ‘power’ दोनों अवधारणाओं को संक्षेप में सुरक्षित रखा गया है।
- source_word: light giving angels
  choice: प्रकाश देनेवाले स्वर्गदूत
  rationale: विशेषण का सीधा अर्थ रखा गया है; इसे केवल ‘प्रकाशमय’ कहकर अर्थ को नहीं बदला गया।
- source_word: from all eternity and unto all eternity
  choice: अनादि काल से अनंत काल तक
  rationale: आरंभहीन और अंतहीन प्रभुता का संतुलित, प्रचलित हिन्दी रूप।
- source_word: season of iniquity that now is
  choice: इस वर्तमान अधर्म के काल
  rationale: वर्तमान सीमित युग/अवधि और उसकी अधार्मिक प्रकृति दोनों को व्यक्त करता है।
theological_decisions:
- issue: ‘the one’ और ‘the other’ की पहचान
  choice: एक को ‘प्रभु’ और दूसरे को भी साक्ष्य के अनुसार ‘प्रभु’ कहा गया
  alternative: दूसरे को सीधे ‘शैतान’ या ‘शासक’ कहना
  rationale: उपलब्ध साक्ष्य की समानांतर और तनावपूर्ण भाषा को बनाए रखा गया है; दूसरे की सीमित, वर्तमान अधर्म-काल से बंधी प्रभुता को स्पष्ट किया गया है, पर उसकी पहचान पाठ से आगे जाकर नहीं जोड़ी गई।
- issue: ईश्वर और विरोधी सत्ता की प्रभुता का अंतर
  choice: ‘अनादि काल से अनंत काल तक’ बनाम ‘इस वर्तमान ... काल’
  alternative: दोनों प्रभुताओं को समान स्तर का दिखाना या दूसरे की प्रभुता हटाना
  rationale: मूल साक्ष्य में निहित शाश्वत और अस्थायी प्रभुता का स्पष्ट विरोध सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य-संरचना में ‘दो मार्ग’ की समानांतरता और शाश्वत बनाम अस्थायी प्रभुता का विरोध प्रमुख रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी/लातीनी मूल-साक्ष्य की प्रत्यक्ष समीक्षा लंबित है।
