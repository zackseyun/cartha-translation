translation:
  language: hi
  text: 'परन्तु उस काले की राह टेढ़ी और शाप से भरी है। क्योंकि वह दण्ड सहित अनन्त मृत्यु की राह है। उसमें वे बातें हैं जो मनुष्यों के प्राणों का नाश करती हैं—मूर्तिपूजा, धृष्टता, सामर्थ्य का घमण्ड,[a] कपट, दोहरा मन, व्यभिचार, हत्या, लूटपाट, अभिमान, अपराध, विश्वासघात, दुर्भावना, हठ, टोना-टोटका, जादू, लोभ और परमेश्वर का भय न होना।


    इस राह पर चलनेवाले भले लोगों को सताते हैं, सत्य से घृणा और झूठ से प्रेम करते हैं; वे धार्मिकता के प्रतिफल को नहीं पहचानते, न भलाई से लगे रहते हैं, न धर्मपूर्ण न्याय से। वे विधवा और अनाथ की सुधि नहीं लेते। वे परमेश्वर के भय के लिए नहीं, बल्कि बुराई के लिए जागते रहते हैं। नम्रता और धीरज उनसे बहुत दूर रहते हैं। वे व्यर्थ बातों से प्रेम करते और लाभ के पीछे दौड़ते हैं; निर्धन पर दया नहीं करते, न कठिन परिश्रम से दबे हुए व्यक्ति की सहायता के लिए परिश्रम करते हैं। वे बदनामी करने को तत्पर रहते हैं और अपने सृष्टिकर्ता को नहीं पहचानते। वे बच्चों के हत्यारे, परमेश्वर की सृष्टि को भ्रष्ट करनेवाले, अभावग्रस्त से मुँह मोड़नेवाले और पीड़ित को दबानेवाले हैं। वे धनवानों के पक्षधर, निर्धनों के अन्यायी न्यायी और हर बात में पापी हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अंग्रेज़ी साक्ष्य में यहाँ असामान्य पद “सामर्थ्य का उच्छ्वास” जैसा है; सम्भवतः आशय सामर्थ्य के घमण्ड या दम्भपूर्ण प्रदर्शन से है। मूल यूनानी/लातीनी पाठ की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य का पद असामान्य है और स्रोत-भाषा समीक्षा लंबित है; अनिश्चितता पाठक के सामने रखना आवश्यक है।
lexical_decisions:
- source_word: the Black One
  choice: उस काले
  rationale: व्यक्तिवाचक और प्रतीकात्मक पद को सामान्य विशेषण में विलीन किए बिना रखा गया है; ‘उस’ से पूर्ववर्ती संदर्भ में उल्लिखित विरोधी सत्ता का संकेत मिलता है।
- source_word: way
  choice: राह
  rationale: दो मार्गों की नैतिक शिक्षा के रूपक को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: doubleness of heart
  choice: दोहरा मन
  rationale: आंतरिक कपट अथवा विभाजित निष्ठा की छवि को बिना अधिक व्याख्या के सुरक्षित रखता है।
- source_word: exhalation of power
  choice: सामर्थ्य का घमण्ड
  rationale: अंग्रेज़ी साक्ष्य का शब्दशः रूप हिन्दी में अस्पष्ट और अस्वाभाविक होता; संदर्भ में शक्ति के दम्भपूर्ण प्रदर्शन का संभावित अर्थ चुना गया, पर अनिश्चितता पादटिप्पणी में दर्ज है।
- source_word: wakeful
  choice: जागते रहते हैं
  rationale: स्रोत-साक्ष्य की जागरूक अथवा चौकस रहने की रूपकात्मक भाषा को सुरक्षित रखा गया है।
- source_word: creatures of God
  choice: परमेश्वर की सृष्टि
  rationale: यह चयन जीवित प्राणियों और रची हुई वस्तुओं—दोनों की सम्भावित व्यापकता को खुला रखता है।
- source_word: pursuing a recompense
  choice: लाभ के पीछे दौड़ते हैं
  rationale: संदर्भ में स्वार्थपूर्ण प्रतिफल या पारिश्रमिक की खोज को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उस काले’ की पहचान
  choice: प्रतीकात्मक पद को ‘उस काले’ के रूप में रखा गया
  alternative: शैतान / दुष्ट जन
  rationale: उपलब्ध साक्ष्य पद की स्पष्ट व्याख्या नहीं करता; किसी विशिष्ट दुष्ट सत्ता की पहचान आरोपित नहीं की गई।
- issue: अनन्त मृत्यु और दण्ड का सम्बन्ध
  choice: ‘दण्ड सहित अनन्त मृत्यु की राह’
  alternative: ऐसी राह जिसका दण्ड अनन्त मृत्यु है
  rationale: साक्ष्य में मृत्यु और दण्ड के वाक्यगत सम्बन्ध की कठोर व्याख्या करने के बजाय दोनों को निकट रखते हुए अस्पष्टता सुरक्षित रखी गई।
- issue: ‘धार्मिकता के प्रतिफल’ का स्वरूप
  choice: प्रतिफल
  alternative: मजदूरी / पुरस्कार / उद्धार
  rationale: नैतिक अथवा अंतिम प्रतिदान के स्वरूप को किसी विशिष्ट धर्मवैज्ञानिक योजना से नहीं बाँधा गया।
- issue: बच्चों की हत्या
  choice: सीधा आरोप ‘बच्चों के हत्यारे’
  alternative: गर्भपात करानेवाले
  rationale: पाठ व्यापक अभिव्यक्ति देता है; इसे किसी एक ऐतिहासिक या आधुनिक व्यवहार तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और श्रव्य गद्य अपनाया गया है। आरम्भिक दुर्गुण-सूची की तीव्रता और दूसरे अनुच्छेद के समानान्तर आरोप सुरक्षित रखे गए हैं। मसौदा उपलब्ध अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी/लातीनी समीक्षा लंबित होने के कारण विशेषतः ‘exhalation of power’ को सावधानी से और पादटिप्पणी सहित प्रस्तुत किया गया है।
