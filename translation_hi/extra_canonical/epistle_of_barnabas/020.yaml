review_pass:
  verdict: revise
  source_fidelity: The draft broadly preserves the vice catalogue, its repeated participial accusations, and the deliberately non-specific reference to those who reject their Maker. However, it resolves the witness's anomalous “exhalation of power” as “सामर्थ्य का घमण्ड,” an interpretation not securely warranted while direct Greek/Latin review is pending. The wording should retain the anomaly with an explanatory note. “Unjust judges of the poor” also requires a clearer Hindi rendering.
  naturalness: The register is generally clear and appropriately grave. “निर्धनों के अन्यायी न्यायी” is unnatural and semantically opaque; “निर्धनों के साथ अन्याय करने वाले न्यायाधीश” is idiomatic. “उस काले की” is somewhat marked in Hindi, but it preserves the supplied witness's unusual epithet without importing a named interpretation.
  terminology: “परमेश्वर,” “धार्मिकता,” “व्यभिचार,” and “सृष्टिकर्ता” are consistent and suitable. “दोहरा मन” preserves the metaphor of divided inward loyalty. The uncertain phrase concerning power is retained more literally rather than converted into “घमण्ड.”
  issues:
  - severity: medium
    issue: “exhalation of power” has been interpreted as “सामर्थ्य का घमण्ड.”
    rationale: The supplied English witness explicitly flags this expression as unusual, and direct source-language review is pending. “घमण्ड” may be plausible but is not a safe translation of the attested wording; retain a close, marked rendering and explain it in a footnote.
  - severity: medium
    issue: “निर्धनों के अन्यायी न्यायी” is unclear Hindi.
    rationale: It does not naturally convey “unjust judges of the poor.” A phrase explicitly stating that they are judges who treat the poor unjustly preserves the source sense and is readable.
