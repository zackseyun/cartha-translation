  text: 'Moreover, I will also tell you about the temple: how these wretched men were led astray and placed their hope in the building, rather than in their God who made them, as though it were a house of God.


    For, almost like the Gentiles, they consecrated him in the temple. But what does the Lord say when abolishing the temple? Learn: “Who has measured heaven with a span, or measured the earth with his hand? Have not I?” says the Lord. “Heaven is my throne, and the earth is the footstool of my feet. What kind of house will you build for me? Or what will be my resting place?” You perceive that their hope is vain.


    Furthermore, he says again, “Behold, those who pulled down this temple will themselves build it.”


    And so it happens. Because they went to war, it was pulled down by their enemies. Now even the servants of their enemies will build it up.


    Again, it was revealed how the city, the temple, and the people of Israel would be betrayed. For Scripture says, “And it shall be in the last days that the Lord will deliver the sheep of the pasture, and the fold and its tower, over to destruction.” And it happened as the Lord had spoken.


    But let us inquire whether there is any temple of God. There is, in the place where he himself undertakes to make and complete it. For it is written, “And it shall come to pass, when the week is being completed, that the temple of God will be built gloriously in the name of the Lord.”


    I find, then, that there is a temple. How, then, will it be built in the name of the Lord? Understand. Before we believed in God, the dwelling place of our heart was corrupt and weak, truly a temple built by hands. For it was full of idolatry and was a house of demons, because we did everything that was contrary to God.


    But it will be built in the name of the Lord. Pay attention, then, so that the temple of the Lord may be built gloriously.


    How? Understand. By receiving the forgiveness of our sins and hoping in the Name, we became new, created afresh from the beginning. Therefore God truly dwells in our habitation, within us. How? The word of his faith, the calling of his promise, the wisdom of the ordinances, the commandments of the teaching—he himself prophesying in us, he himself dwelling in us, opening for us who had been enslaved to death the door of the temple, which is the mouth, and giving us repentance—leads us to the incorruptible temple.


    For the one who desires to be saved does not look to the person, but to him who dwells and speaks within that person, being amazed that he has never before heard these words from the speaker’s mouth, nor ever desired to hear them. This is the spiritual temple built for the Lord.'
translation:
  language: hi
  text: 'इसके अतिरिक्त मैं तुम्हें मन्दिर के विषय में भी बताऊँगा कि किस प्रकार वे अभागे लोग भटक गए और उन्होंने अपने बनानेवाले परमेश्वर पर नहीं, बल्कि उस भवन पर अपनी आशा रखी, मानो वही परमेश्वर का घर हो।


    क्योंकि उन्होंने लगभग गैर-यहूदियों की तरह परमेश्वर को मन्दिर में सीमित करके पवित्र ठहराया। परन्तु मन्दिर को निरस्त करते हुए प्रभु क्या कहते हैं? सुनो: “किसने आकाश को अपनी बित्ता से नापा, या पृथ्वी को अपने हाथ से मापा? क्या मैंने नहीं?” प्रभु कहते हैं। “आकाश मेरा सिंहासन है और पृथ्वी मेरे पाँवों की चौकी। तुम मेरे लिए कैसा घर बनाओगे? या मेरे विश्राम का स्थान क्या होगा?”[a] तुम समझते हो कि उनकी आशा व्यर्थ है।


    फिर वह यह भी कहते हैं, “देखो, जिन्होंने इस मन्दिर को गिराया, वे स्वयं ही इसे बनाएँगे।”[b]


    और ऐसा ही हो रहा है। क्योंकि वे युद्ध करने गए, इसलिए उनके शत्रुओं ने उसे गिरा दिया; और अब उन्हीं शत्रुओं के सेवक उसे फिर बनाएँगे।[c]


    फिर यह भी प्रकट किया गया था कि नगर, मन्दिर और इस्राएल के लोग सौंप दिए जाएँगे। क्योंकि पवित्रशास्त्र कहता है, “अन्तिम दिनों में ऐसा होगा कि प्रभु चरागाह की भेड़ों, बाड़े और उसके गुम्मट को विनाश के लिए सौंप देंगे।”[d] और जैसा प्रभु ने कहा था, वैसा ही हुआ।


    पर आओ, हम जाँचें कि परमेश्वर का कोई मन्दिर है या नहीं। हाँ, है—उस स्थान में जिसे बनाने और पूरा करने का उत्तरदायित्व वह स्वयं लेते हैं। क्योंकि लिखा है, “जब सप्ताह पूरा हो रहा होगा, तब प्रभु के नाम में परमेश्वर का मन्दिर महिमा के साथ बनाया जाएगा।”[e]


    इसलिए मैं पाता हूँ कि एक मन्दिर है। तो वह प्रभु के नाम में कैसे बनाया जाएगा? समझो। परमेश्वर पर विश्वास करने से पहले हमारे हृदय का निवास भ्रष्ट और दुर्बल था—वास्तव में हाथों से बनाया हुआ मन्दिर। वह मूर्तिपूजा से भरा और दुष्टात्माओं का घर था, क्योंकि हम वह सब करते थे जो परमेश्वर के विरुद्ध था।


    पर वह प्रभु के नाम में बनाया जाएगा। इसलिए ध्यान दो कि प्रभु का मन्दिर महिमा के साथ बनाया जाए।


    कैसे? समझो। अपने पापों की क्षमा पाकर और उस नाम पर आशा रखकर हम नए हो गए, मानो आरम्भ से फिर सृजे गए हों। इसलिए परमेश्वर सचमुच हमारे निवास में—हमारे भीतर—वास करते हैं। कैसे? उनके विश्वास का वचन, उनकी प्रतिज्ञा का बुलावा, विधियों की बुद्धि और शिक्षा की आज्ञाएँ हमारे भीतर हैं। वह स्वयं हमारे भीतर भविष्यवाणी करते और स्वयं हमारे भीतर वास करते हैं। हम जो मृत्यु के दास थे, हमारे लिए वह मन्दिर का द्वार—अर्थात् मुँह—खोलते हैं और हमें मन-फिराव देकर अविनाशी मन्दिर तक ले जाते हैं।[f]


    क्योंकि जो उद्धार पाना चाहता है, वह बोलनेवाले मनुष्य की ओर नहीं, बल्कि उसकी ओर देखता है जो उस मनुष्य के भीतर वास करता और बोलता है। वह चकित होता है कि उसने बोलनेवाले के मुँह से ऐसी बातें पहले कभी नहीं सुनीं और न कभी उन्हें सुनने की इच्छा की थी। यही वह आत्मिक मन्दिर है जो प्रभु के लिए बनाया गया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन यशायाह 40:12 और 66:1–2 की भाषा को साथ रखता है।
    reason: मिश्रित शास्त्रीय उद्धरण की पहचान पाठक को संदर्भ समझने में सहायता देती है।
  - marker: b
    text: इस उद्धरण का निश्चित शास्त्रीय स्रोत ज्ञात नहीं है।
    reason: इसे किसी प्रमाणित बाइबिल पद से जबरन जोड़ने से बचना।
  - marker: c
    text: यह सम्भवतः यरूशलेम के मन्दिर के विनाश और उसके बाद शत्रु-शासकों के अधीन उसके पुनर्निर्माण की अपेक्षा की ओर संकेत करता है; ऐतिहासिक संकेत की सटीक पहचान अनिश्चित है।
    reason: ऐतिहासिक दावे को अत्यधिक निश्चित किए बिना संभावित पृष्ठभूमि बताना।
  - marker: d
    text: इस उद्धरण का निश्चित शास्त्रीय स्रोत ज्ञात नहीं है; उपलब्ध पाठ-परम्परा में इसकी भाषा भिन्न रूपों में मिलती है।
    reason: अज्ञात उद्धरण और पाठगत अनिश्चितता को पारदर्शी बनाना।
  - marker: e
    text: “सप्ताह” और इस उद्धरण का स्रोत अनिश्चित हैं; सम्भवतः दानिय्येल-संबंधी परम्परा की प्रतिध्वनि है।
    reason: काल-संबंधी अस्पष्टता और संभावित शास्त्रीय पृष्ठभूमि को सुरक्षित रखना।
  - marker: f
    text: इस लम्बे वाक्य में कर्ता और कुछ संबंधवाचक पद अस्पष्ट हैं। अनुवाद ने दैवी कर्ता को बनाए रखा है, पर उसे किसी विशिष्ट व्यक्ति के रूप में अधिक स्पष्ट नहीं किया।
    reason: स्रोत-भाषा की समीक्षा लंबित होने के कारण सर्वनामगत और वाक्यगत अनिश्चितता बताना।
lexical_decisions:
- source_word: temple (ναός/templum tradition)
  choice: मन्दिर
  rationale: धार्मिक भवन और भीतर के आत्मिक निवास—दोनों स्तरों पर चलनेवाली केंद्रीय उपमा को एक ही शब्द से सुरक्षित रखा गया है।
- source_word: the Name
  choice: उस नाम
  rationale: मूल की विशिष्ट धार्मिक अभिव्यक्ति और उसके जानबूझकर अप्रकट संदर्भ को बनाए रखा गया है; किसी नाम को स्पष्ट जोड़कर अर्थ सीमित नहीं किया गया।
- source_word: remission
  choice: क्षमा
  rationale: पापों के हटाए जाने की धार्मिक धारणा को सामान्य आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: repentance
  choice: मन-फिराव
  rationale: केवल पछतावे के बजाय दिशा और जीवन के परिवर्तन का भाव सुरक्षित रहता है।
- source_word: incorruptible
  choice: अविनाशी
  rationale: नाश या क्षय के अधीन न होने के मूल विरोध को स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: Gentiles
  choice: गैर-यहूदी
  rationale: आधुनिक पाठक के लिए स्पष्ट है और जातीय-धार्मिक भेद को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: undertakes to make and finish
  choice: बनाने और पूरा करने का उत्तरदायित्व वह स्वयं लेते हैं
  rationale: दैवी पहल और पूर्णता—दोनों को सुरक्षित रखते हुए वाक्य को स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: भौतिक मन्दिर की आलोचना और आत्मिक मन्दिर की पुष्टि
  choice: लेखक के तीखे विरोध को यथावत रखते हुए बाद में हृदय/समुदाय के आत्मिक मन्दिर की व्याख्या प्रस्तुत की गई है।
  alternative: मन्दिर-विरोध को केवल ऐतिहासिक भवन तक सीमित या किसी बाद की कलीसियाई व्यवस्था से समान करना।
  rationale: पाठ स्वयं पहले भवन पर रखी आशा को व्यर्थ कहता है और फिर विश्वासियों के भीतर बने मन्दिर की बात करता है; इस तनाव को सुलझाया नहीं गया।
- issue: “वह स्वयं” और भीतर बोलने/वास करनेवाले की पहचान
  choice: जहाँ पाठ स्पष्ट रूप से नाम नहीं बताता, वहाँ सर्वनाम और दैवी संदर्भ को बनाए रखा गया है।
  alternative: हर स्थान पर ‘परमेश्वर’, ‘मसीह’ या ‘पवित्र आत्मा’ जोड़ देना।
  rationale: स्रोत-साक्ष्य में सर्वनामगत खुलापन है; किसी विशेष त्रिएकीय पहचान को आरोपित करना उचित नहीं।
- issue: “उनके विश्वास का वचन” का संबंध
  choice: संबंधवाचक अस्पष्टता को लगभग अक्षुण्ण रखते हुए ‘उनके विश्वास का वचन’ रखा गया है।
  alternative: ‘हमारे भीतर परमेश्वर पर विश्वास का वचन’ या ‘मसीही विश्वास का संदेश’।
  rationale: वाक्यांश का सटीक व्याकरणिक संबंध स्रोत-समीक्षा के बिना निश्चित नहीं; अनुवाद को व्याख्यात्मक रूप से संकीर्ण नहीं किया गया।
- issue: “मन्दिर का द्वार, जो मुँह है”
  choice: मुँह को मन्दिर के द्वार के रूप में सीधे रखा गया है।
  alternative: इसे केवल प्रचार, अंगीकार या प्रार्थना के रूप में समझाकर अनुवाद करना।
  rationale: लेखक की असामान्य उपमा को सुरक्षित रखना आवश्यक है; उसका एकमात्र धर्मशास्त्रीय अर्थ तय नहीं किया गया।
- issue: इस्राएल के विषय में लेखक की नकारात्मक भाषा
