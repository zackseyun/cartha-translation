  revised_text: 'इसके अतिरिक्त मैं तुम्हें मन्दिर के विषय में भी बताऊँगा कि किस प्रकार वे अभागे लोग भटक गए और उन्होंने अपने बनानेवाले परमेश्वर पर नहीं, बल्कि उस भवन पर अपनी आशा रखी, मानो वह परमेश्वर का घर हो।


    क्योंकि उन्होंने लगभग अन्यजातियों की तरह परमेश्वर को मन्दिर में प्रतिष्ठित किया। परन्तु मन्दिर को निरस्त करते हुए प्रभु क्या कहते हैं? सुनो: “किसने आकाश को अपनी बित्ता से नापा, या पृथ्वी को अपने हाथ से मापा? क्या मैंने नहीं?” प्रभु कहते हैं। “आकाश मेरा सिंहासन है और पृथ्वी मेरे पाँवों की चौकी। तुम मेरे लिए कैसा घर बनाओगे? या मेरे विश्राम का स्थान क्या होगा?”[a] तुम समझते हो कि उनकी आशा व्यर्थ है।


    फिर वह यह भी कहते हैं, “देखो, जिन्होंने इस मन्दिर को गिराया, वे स्वयं ही इसे बनाएँगे।”[b]


    और ऐसा ही होता है। क्योंकि वे युद्ध करने गए, इसलिए उनके शत्रुओं ने उसे गिरा दिया; और अब उन्हीं शत्रुओं के सेवक उसे फिर बनाएँगे।[c]


    फिर यह भी प्रकट किया गया था कि नगर, मन्दिर और इस्राएल के लोग विश्वासघात के द्वारा सौंप दिए जाएँगे। क्योंकि पवित्रशास्त्र कहता है, “अन्तिम दिनों में ऐसा होगा कि प्रभु चरागाह की भेड़ों, बाड़े और उसके गुम्मट को विनाश के लिए सौंप देंगे।”[d] और जैसा प्रभु ने कहा था, वैसा ही हुआ।


    पर आओ, हम जाँचें कि परमेश्वर का कोई मन्दिर है या नहीं। हाँ, है—उस स्थान में जिसे बनाने और पूरा करने का उत्तरदायित्व वह स्वयं लेते हैं। क्योंकि लिखा है, “जब सप्ताह पूरा हो रहा होगा, तब प्रभु के नाम में परमेश्वर का मन्दिर महिमा के साथ बनाया जाएगा।”[e]


    इसलिए मैं पाता हूँ कि एक मन्दिर है। तो वह प्रभु के नाम में कैसे बनाया जाएगा? समझो। परमेश्वर पर विश्वास करने से पहले हमारे हृदय का निवास भ्रष्ट और दुर्बल था—वास्तव में हाथों से बनाया हुआ मन्दिर। वह मूर्तिपूजा से भरा और दुष्टात्माओं का घर था, क्योंकि हम वह सब करते थे जो परमेश्वर के विरुद्ध था।


    पर वह प्रभु के नाम में बनाया जाएगा। इसलिए ध्यान दो कि प्रभु का मन्दिर महिमा के साथ बनाया जाए।


    कैसे? समझो। अपने पापों की क्षमा पाकर और उस नाम पर आशा रखकर हम नए हो गए, मानो आरम्भ से फिर सृजे गए हों। इसलिए परमेश्वर सचमुच हमारे निवास में—हमारे भीतर—वास करते हैं। कैसे? उनके विश्वास का वचन, उनकी प्रतिज्ञा का बुलावा, विधियों की बुद्धि, और शिक्षा की आज्ञाएँ; वह स्वयं हमारे भीतर भविष्यवाणी करते हुए, वह स्वयं हमारे भीतर वास करते हुए, हम जो मृत्यु के दास थे हमारे लिए मन्दिर का द्वार—अर्थात् मुँह—खोलकर और हमें मन-फिराव देकर हमें अविनाशी मन्दिर तक ले जाते हैं।[f]


