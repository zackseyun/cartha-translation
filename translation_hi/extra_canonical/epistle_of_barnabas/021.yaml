base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/021.yaml
  text: 'Therefore, it is good to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For whoever does these things will be glorified in the kingdom of God, but whoever chooses their opposites will perish together with their works. This is why there is the resurrection; this is why there is the recompense.


    I urge those of you who are in a higher position: if you are willing to receive any good advice from me, keep among you those to whom you can do good. Do not fail.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and his reward.


    Again and again I urge you: be good lawgivers for one another; remain faithful counselors to yourselves; remove all hypocrisy from among you.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of his ordinances, and patience.


    Be taught by God, diligently seeking what the Lord requires of you, and act so that you may be found on the day of judgment.


    But if you have any remembrance of what is good, remember me when you practice these things, these things, so that both my desire and my watchfulness may lead to some good result. I urge you, asking this as a favor.


    As long as the good vessel (of the body) is with you, do not lack any of these things, but search them out constantly and fulfill every commandment, for they deserve it.


    For this reason I was all the more eager to write to you as far as I was able, so that I might give you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
translation:
  language: hi
  text: 'इसलिए प्रभु के उन सभी विधानों को सीखना अच्छा है जो ऊपर लिखे गए हैं, और उनके अनुसार चलना भी। क्योंकि जो इन बातों पर चलता है, वह परमेश्वर के राज्य में महिमा पाएगा; पर जो इनके विपरीत बातों को चुनता है, वह अपने कामों समेत नाश होगा। इसी कारण पुनरुत्थान है, और इसी कारण प्रतिफल है।


    तुममें जो ऊँचे पद पर हैं, उनसे मैं विनती करता हूँ: यदि तुम मेरी कोई भली सलाह स्वीकार करना चाहो, तो अपने बीच ऐसे लोगों को बनाए रखो जिनका तुम भला कर सकते हो। इसमें चूकना मत।


    वह दिन निकट है जब दुष्ट के साथ सब कुछ नष्ट कर दिया जाएगा। प्रभु निकट है, और उसका प्रतिफल भी।


    मैं तुमसे बार-बार विनती करता हूँ: एक-दूसरे के लिए अच्छे विधान बनानेवाले बनो; अपने लिए विश्वासयोग्य सलाहकार बने रहो; अपने बीच से हर प्रकार का कपट दूर कर दो।


    और परमेश्वर, जो सारे संसार का प्रभु है, तुम्हें बुद्धि, विवेक, शिक्षा, उसके विधानों का ज्ञान और धीरज दे।


    परमेश्वर से शिक्षा पाओ; लगन से खोजो कि प्रभु तुमसे क्या चाहता है, और ऐसा आचरण करो कि न्याय के दिन तुम योग्य पाए जाओ।[a]


    यदि तुम्हें भलाई का कुछ भी स्मरण रहता है, तो इन बातों—हाँ, इन बातों—पर चलते समय मुझे भी स्मरण करना, ताकि मेरी अभिलाषा और मेरी जागरूकता का कुछ अच्छा फल निकले। मैं इसे कृपा मानकर तुमसे विनती करता हूँ।[b]


    जब तक यह अच्छा पात्र—अर्थात शरीर—तुम्हारे पास है, तब तक इनमें से किसी बात में कमी न रखो; बल्कि निरंतर उनकी खोज करते रहो और हर आज्ञा पूरी करो, क्योंकि वे इसके योग्य हैं।[c]


    इसी कारण मैंने अपनी सामर्थ्य भर तुम्हें लिखने का और भी अधिक प्रयत्न किया, ताकि तुम्हें आनन्द दूँ। प्रेम और शान्ति की सन्तानो, कुशल से रहो। महिमा और हर प्रकार के अनुग्रह का प्रभु तुम्हारी आत्मा के साथ रहे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “योग्य” अर्थ को स्पष्ट करने के लिए जोड़ा गया है; उपलब्ध अंग्रेज़ी साक्ष्य में केवल “कि न्याय के दिन तुम पाए जाओ” है। प्रत्यक्ष यूनानी/लैटिन पाठ-समीक्षा अभी अपेक्षित है।
    reason: आपूर्ति किए गए आधार में वाक्य का अपेक्षित पूरक अस्पष्ट है।
  - marker: b
    text: “इन बातों—हाँ, इन बातों—” उपलब्ध साक्ष्य में आए दोहराव को सुरक्षित रखता है; यह प्रतिलिपि-दोष भी हो सकता है।
    reason: साक्षी-पाठ की पुनरुक्ति को बिना बताए हटाना उचित नहीं था।
  - marker: c
    text: “अर्थात शरीर” उपलब्ध साक्ष्य का व्याख्यात्मक कोष्ठकीय स्पष्टीकरण है; “अच्छा पात्र” मूल रूपक है। अंतिम वाक्यांश का शाब्दिक अर्थ “क्योंकि वे योग्य हैं” है और उसका सटीक संकेत अस्पष्ट है।
    reason: व्याख्यात्मक जोड़ और संदिग्ध सर्वनाम-संदर्भ दोनों को पाठक के सामने रखना।
lexical_decisions:
- source_word: ordinances
  choice: विधान
  rationale: यह शब्द प्रभु द्वारा निर्धारित शिक्षाओं और आचरण-संबंधी निर्देशों का औपचारिक किन्तु सहज बोध देता है; ‘रीति’ से अधिक प्रामाणिक और ‘कानून’ से कम संकीर्ण है।
- source_word: recompense / reward
  choice: प्रतिफल
  rationale: सकारात्मक या न्यायिक परिणाम की व्यापकता बनाए रखता है और पाठ में दोनों स्थानों की शब्द-संगति सुरक्षित करता है।
- source_word: Evil One
  choice: दुष्ट
  rationale: व्यक्तिवाचक विरोधी का संकेत बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति देता है; इसे किसी अधिक विशिष्ट नाम से नहीं पहचाना गया।
- source_word: judgment
  choice: विवेक
  rationale: गुणों की सूची में इसका अर्थ न्याय-दण्ड की घटना नहीं, बल्कि समझ-बूझ या निर्णय-क्षमता है।
- source_word: vessel
  choice: पात्र
  rationale: मूल रूपक को सुरक्षित रखा गया है; साथ का स्पष्टीकरण इसे शरीर से संबद्ध करता है।
- source_word: spirit
  choice: आत्मा
  rationale: समापन आशीष की धार्मिक भाषा के अनुरूप है और व्यक्ति के आंतरिक जीवन का संकेत बनाए रखता है।
theological_decisions:
- issue: कामों, महिमा और नाश का संबंध
  choice: 'शर्तात्मक कथनों को सीधे रूप में रखा गया: आचरण करनेवाला महिमा पाएगा और विपरीत चुननेवाला अपने कामों समेत नाश होगा।'
  alternative: इन्हें केवल विश्वास के प्रमाण या किसी विशिष्ट उद्धार-सिद्धान्त की भाषा में समझाकर अनुवाद करना।
  rationale: साक्ष्य में उपस्थित नैतिक और न्यायिक तनाव को किसी संप्रदायगत ढाँचे से हल नहीं किया गया।
- issue: न्याय के दिन ‘पाए जाने’ का आशय
  choice: ‘योग्य पाए जाओ’ मुख्य पाठ में रखा, साथ में पाठगत अनिश्चितता की पादटिप्पणी दी।
  alternative: ‘उद्धार पाए हुए मिलो’, ‘निर्दोष पाए जाओ’ या केवल ‘उपस्थित पाए जाओ’।
  rationale: आपूर्ति किए गए अंग्रेज़ी साक्ष्य में पूरक विशेषण अनुपस्थित है, पर हिन्दी में निहित सकारात्मक आशय बताना आवश्यक लगा; अनिश्चितता स्पष्ट कर दी गई है।
- issue: दुष्ट की पहचान
  choice: ‘दुष्ट’ कहा गया।
  alternative: ‘शैतान’ या ‘दुष्टता’।
  rationale: व्यक्तिवाचकता बनी रहती है, पर पाठ से आगे बढ़कर निश्चित नाम आरोपित नहीं होता।
- issue: पुनरुत्थान और प्रतिफल
  choice: दो समानांतर स्वतंत्र कथनों के रूप में रखा गया।
  alternative: पुनरुत्थान को केवल प्रतिफल पाने का साधन बताते हुए कारणात्मक व्याख्या जोड़ना।
  rationale: मूल साक्ष्य का संक्षिप्त और कुछ हद तक अस्पष्ट समानांतर विन्यास सुरक्षित है।
