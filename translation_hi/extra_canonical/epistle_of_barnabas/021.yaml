  revised_text: 'इसलिए प्रभु के उन सभी विधानों को सीखना, जो ऊपर लिखे गए हैं, और उनके अनुसार चलना अच्छा है। क्योंकि जो ये बातें करता है, वह परमेश्वर के राज्य में महिमा पाएगा; पर जो इनके विपरीत बातों को चुनता है, वह अपने कामों समेत नाश होगा। इसी कारण पुनरुत्थान है, और इसी कारण प्रतिफल है।


    तुममें जो ऊँचे पद पर हैं, उनसे मैं विनती करता हूँ: यदि तुम मुझसे कोई भली सलाह लेना चाहो, तो अपने बीच उन लोगों को रखो जिनका तुम भला कर सको। इसमें चूकना मत।


    वह दिन निकट है, जब उस दुष्ट के साथ सब कुछ नष्ट कर दिया जाएगा। प्रभु निकट है, और उसका प्रतिफल भी।


    मैं तुमसे बार-बार विनती करता हूँ: एक-दूसरे के लिए अच्छे विधान बनाने वाले बनो; अपने ही लिए विश्वासयोग्य सलाहकार बने रहो; अपने बीच से हर प्रकार का कपट दूर कर दो।


    और परमेश्वर, जो सारे संसार का प्रभु है, तुम्हें बुद्धि, विवेक, शिक्षा, उसके विधानों का ज्ञान और धीरज दे।


    परमेश्वर से शिक्षा पाओ; लगन से खोजो कि प्रभु तुमसे क्या चाहता है, और ऐसा आचरण करो कि न्याय के दिन तुम पाए जाओ।


    पर यदि तुम्हें भलाई की कुछ सुध हो, तो इन बातों को करते समय—इन बातों को करते समय—मुझे स्मरण करना, ताकि मेरी अभिलाषा और मेरी सतर्कता दोनों का कुछ अच्छा फल निकले। मैं तुमसे यह कृपा के रूप में माँगता हूँ।[a]


    जब तक अच्छा पात्र—अर्थात शरीर—तुम्हारे साथ है, तब तक इनमें से किसी भी बात की कमी न होने दो; बल्कि निरंतर इनकी खोज करते रहो और हर आज्ञा पूरी करो, क्योंकि वे इसके योग्य हैं।[b]


    इसी कारण मैंने, जहाँ तक मुझसे हो सका, तुम्हें लिखने का और भी अधिक प्रयत्न किया, ताकि तुम्हें आनंद दूँ। प्रेम और शांति की संतानो, कुशल रहो। महिमा और हर प्रकार के अनुग्रह का प्रभु तुम्हारी आत्मा के साथ रहे।'
