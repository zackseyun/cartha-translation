  language: hi
  text: 'इस उद्देश्य से प्रभु ने अपनी देह को विनाश के हवाले किया, ताकि पापों की क्षमा के द्वारा हम शुद्ध किए जाएँ—यह शुद्धि उसके छिड़काव के लहू से होती है।[a]


    क्योंकि उसके विषय में पवित्रशास्त्र की कुछ बातें इस्राएल से और कुछ हमसे संबंधित हैं। वह कहता है, “वह तुम्हारे अपराधों के कारण घायल किया गया और हमारे पापों के कारण कुचला गया; उसके घावों से हम चंगे हुए। वह भेड़ की तरह वध के लिए ले जाया गया और अपने ऊन कतरनेवाले के सामने चुप रहनेवाले मेमने की तरह मौन रहा।”


    इसलिए हमें प्रभु का बहुत धन्यवाद करना चाहिए, क्योंकि उसने हम पर बीती हुई बातें प्रकट कीं, वर्तमान के विषय में हमें बुद्धिमान बनाया और भविष्य के विषय में भी हमें समझ से वंचित नहीं रखा।


    अब पवित्रशास्त्र कहता है, “पक्षियों के लिए जाल अकारण नहीं बिछाया जाता।” इसका अर्थ यह है कि जो मनुष्य धार्मिकता का मार्ग जानने पर भी अपने आपको अंधकार के मार्ग पर चलने के लिए विवश करता है, वह उचित ही नाश होगा।


    मेरे भाइयो, एक बात और है: यदि प्रभु ने हमारे प्राणों के लिए दुःख सहा—यद्यपि वह सारे संसार का प्रभु था, और परमेश्वर ने संसार की नींव डाले जाने के समय उसी से कहा था, “आओ, हम मनुष्य को अपने स्वरूप और समानता में बनाएँ”—तो उसने मनुष्यों के हाथों दुःख सहना कैसे स्वीकार किया?


    समझो। भविष्यवक्ताओं ने उससे अनुग्रह पाकर उसी के विषय में भविष्यवाणी की। पर उसने स्वयं दुःख सहा, ताकि वह मृत्यु का नाश करे और मरे हुओं का पुनरुत्थान प्रकट करे, क्योंकि उसका देह में प्रकट होना आवश्यक था।


    इससे वह एक ही समय में पूर्वजों से की गई प्रतिज्ञा को पूरा करे और अपने लिए एक नई प्रजा तैयार करके, पृथ्वी पर रहते हुए यह दिखाए कि पुनरुत्थान करा चुकने के बाद वह स्वयं न्याय करेगा।[b]


    इसके अतिरिक्त उसने प्रचार किया, इस्राएल को शिक्षा दी, इतने आश्चर्यकर्म और चिह्न किए, और उससे अत्यंत प्रेम किया।


    जब उसने अपने प्रेरितों को चुना, जिन्हें उसका सुसमाचार सुनाना था—वे ऐसे मनुष्य थे जो हर प्रकार के पाप से बढ़कर पापी थे, ताकि वह दिखाए कि वह धर्मियों को नहीं, बल्कि पापियों को बुलाने आया है—तब उसने अपने आपको परमेश्वर का पुत्र प्रकट किया।[c]


    यदि वह देह में न आया होता, तो मनुष्य उसे देखकर उद्धार न पा सकते। वे तो उस सूर्य की किरणों का सामना भी नहीं कर सकते, जो एक दिन अस्तित्व में नहीं रहेगा और जो उसके अपने हाथों की रचना है।


    इसी उद्देश्य से परमेश्वर का पुत्र देह में आया: ताकि जिन लोगों ने उसके भविष्यवक्ताओं को सताया और मार डाला था, उनके पापों की पूरी गिनती भर दे।[d]


    इसी उद्देश्य से उसने दुःख सहा। क्योंकि परमेश्वर उसकी देह के घावों के विषय में कहता है कि वे उन्हीं लोगों से मिले: “जब वे अपने चरवाहे को मारेंगे, तब झुंड की भेड़ें तितर-बितर हो जाएँगी।”[e]


    पर उसने स्वयं इस प्रकार दुःख सहना चाहा, क्योंकि उसका काठ पर दुःख सहना आवश्यक था। उसके विषय में भविष्यवाणी करनेवाले ने कहा, “मेरे प्राण को तलवार से बचा,” और, “मेरी देह को कीलों से बेधो, क्योंकि कुकर्मियों की सभाएँ मेरे विरुद्ध उठ खड़ी हुई हैं।”[f]


    और फिर वह कहता है, “देखो, मैंने अपनी पीठ को कोड़े खाने के लिए और अपने गालों को प्रहार सहने के लिए दे दिया; मैंने अपना मुख कठोर चट्टान के समान कर लिया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके छिड़काव का लहू” बलिदान और शुद्धिकरण की प्राचीन विधि का बिंब है। उपलब्ध अंग्रेज़ी साक्ष्य पर आधारित यह वाक्यांश प्रत्यक्ष यूनानी/लातीनी समीक्षा की प्रतीक्षा में है।
    reason: कठिन और संस्कार-संबंधी बिंब को बिना मौन व्याख्या के समझने में सहायता।
  - marker: b
    text: “प्रतिज्ञा को पूरा करे” के पीछे ऐसा शब्द हो सकता है जिसका अर्थ प्रतिज्ञा को सिद्ध करना, पूरा करना या उसके लाभ को उपलब्ध कराना हो; प्रत्यक्ष स्रोत-भाषा समीक्षा अभी शेष है।
    reason: अंग्रेज़ी witness के असामान्य ‘redeem the promise’ की अनिश्चितता दर्ज करना।
  - marker: c
    text: “हर प्रकार के पाप से बढ़कर पापी” मूल साक्ष्य का अत्यंत कठोर, संभवतः अतिशयोक्तिपूर्ण कथन है; इसे नरम नहीं किया गया है।
    reason: पाठ की धर्मवैचारिक और अलंकारिक कठिनाई सुरक्षित रखना।
  - marker: d
    text: “पापों की पूरी गिनती भर दे” का आशय संभवतः उनके पापों को पूर्ण माप तक पहुँचाना है; वाक्य का ठीक बल स्रोत-भाषा समीक्षा के बाद अधिक स्पष्ट हो सकता है।
    reason: वास्तविक अर्थगत अस्पष्टता दर्शाना।
  - marker: e
    text: उपलब्ध साक्ष्य में “भेड़ें … खो जाएँगी” है; यहाँ भविष्यवाणी के परिचित बिंब के अनुसार “तितर-बितर हो जाएँगी” अनूदित है।
    reason: शाब्दिक रूप और संभावित उद्धरणार्थ के बीच अनुवाद-निर्णय बताना।
  - marker: f
    text: “मेरी देह को कीलों से बेधो” के रूप में दिया गया उद्धरण ज्ञात प्राचीन पाठ-परंपराओं में पाठांतर या संयुक्त उद्धरण से संबंधित हो सकता है; इसे उपलब्ध साक्ष्य के अनुसार रखा गया है।
    reason: उद्धरण की पाठालोचनात्मक अनिश्चितता स्पष्ट करना।
lexical_decisions:
- source_word: corruption (Greek source review pending)
  choice: विनाश
  rationale: यहाँ देह को मृत्यु और क्षय के हवाले किए जाने का भाव है; ‘सड़न’ अत्यधिक भौतिक और अस्वाभाविक लगता, जबकि ‘विनाश’ व्यापक अर्थ बनाए रखता है।
- source_word: blood of his sprinkling
  choice: उसके छिड़काव का लहू
  rationale: बलिदानी और शुद्धिकरण-संबंधी बिंब को व्याख्यात्मक रूप से सरल किए बिना सुरक्षित रखा गया है।
- source_word: way of righteousness
  choice: धार्मिकता का मार्ग
  rationale: नैतिक और धर्मवैधानिक दोनों संभावित अर्थों को बनाए रखने वाला स्वाभाविक बाइबलीय पदबंध।
- source_word: souls
  choice: प्राणों
  rationale: ‘आत्माओं’ की अपेक्षा यहाँ जीवन/व्यक्ति के लिए प्रयुक्त प्राचीन व्यापक अर्थ को बेहतर बनाए रखता है।
- source_word: tree
  choice: काठ
  rationale: क्रूस की ओर संकेत को बनाए रखते हुए मूल उद्धरण के ‘वृक्ष/काठ’ वाले रूपक को सीधे ‘क्रूस’ में नहीं बदला गया।
- source_word: sum up the complete tale
  choice: पूरी गिनती भर दे
  rationale: पापों को उनकी पराकाष्ठा या पूर्ण माप तक पहुँचाने के कठिन और संभावित रूप से लेखा-संबंधी बिंब को बनाए रखा गया है।
theological_decisions:
- issue: सृष्टि-वचन में पुत्र की पहचान
  choice: “उसी से कहा था”
  alternative: संबोधन को अनिर्दिष्ट छोड़ना
  rationale: प्रस्तुत साक्ष्य लेखक द्वारा ‘आओ, हम मनुष्य बनाएँ’ को प्रभु से कहा गया वचन मानता है; इसे स्पष्ट रखा गया, पर आगे कोई विकसित त्रित्ववादी शब्दावली नहीं जोड़ी गई।
- issue: प्रेरितों का ‘हर पाप से बढ़कर पापी’ होना
  choice: कठोर कथन को मुख्य पाठ में बनाए रखा
  alternative: ‘साधारण पापी मनुष्य’
  rationale: साक्ष्य का अतिशयोक्तिपूर्ण और धर्मवैचारिक तनाव जानबूझकर नरम नहीं किया गया।
- issue: प्रतिज्ञा को redeem करना
  choice: प्रतिज्ञा को पूरा करना
  alternative: प्रतिज्ञा को छुड़ाना
  rationale: हिन्दी में प्रतिज्ञा के साथ ‘छुड़ाना’ अस्पष्ट है; प्रसंग में उसे सिद्ध/पूरा करने का अर्थ सबसे स्वाभाविक है।
- issue: पापों की पूरी गिनती
  choice: उनके पापों की पूरी गिनती भर दे
