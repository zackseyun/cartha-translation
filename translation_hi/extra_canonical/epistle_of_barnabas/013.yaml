  text: 'Now let us see whether this people or the first people has the inheritance, and whether the covenant had reference to us or to them.


    Hear, then, what the Scripture says concerning the people: “Isaac prayed concerning Rebekah his wife, for she was barren. And she conceived. Then Rebekah went out to inquire of the Lord. And the Lord said to her, ‘Two nations are in your womb, and two peoples in your belly, and one people shall vanquish another people, and the greater shall serve the less.’”


    You ought to understand who Isaac is, who Rebekah is, and in whose case he has shown that the one people is greater than the other.


    And in another prophecy Jacob speaks more plainly to Joseph his son, saying, “Behold, the Lord has not bereft me of your face; bring me your sons, that I may bless them.”


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the Spirit a type of the people that should come afterward. And what does he say? “Jacob crossed his hands and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, ‘Transfer your right hand to the head of Manasseh, for he is my firstborn son.’ And Jacob said to Joseph, ‘I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.’”


    Mark in whose cases he ordained that this people should be first and heir of the covenant.


    If then, besides this, he also recorded it through Abraham, we attain the completion of our knowledge. What, then, does he say to Abraham when he alone believed, and was ascribed for righteousness? “Behold, I have made you, Abraham, a father of nations that believe in God in uncircumcision.”'
translation:
  language: hi
  text: '**बरनबास 13**


    अब हम देखें कि विरासत इस प्रजा को मिली है या पहली प्रजा को, और वाचा का संबंध हमसे था या उनसे।


    तो सुनो, पवित्रशास्त्र इन प्रजाओं के विषय में क्या कहता है: “इसहाक ने अपनी पत्नी रिबका के लिए प्रार्थना की, क्योंकि वह बाँझ थी; और वह गर्भवती हुई। तब रिबका यहोवा से पूछने गई। यहोवा ने उससे कहा, ‘तेरे गर्भ में दो जातियाँ हैं और तेरे भीतर दो प्रजाएँ हैं। एक प्रजा दूसरी प्रजा पर प्रबल होगी, और बड़ी छोटी की सेवा करेगी।’”[a]


    तुम्हें समझना चाहिए कि इसहाक कौन है, रिबका कौन है, और किनके विषय में उसने दिखाया कि एक प्रजा दूसरी से बड़ी है।


    एक दूसरी भविष्यवाणी में याकूब अपने पुत्र यूसुफ से और भी स्पष्ट रूप से कहता है, “देख, प्रभु ने मुझे तेरा मुख देखने से वंचित नहीं रखा। अपने पुत्रों को मेरे पास ला, ताकि मैं उन्हें आशीष दूँ।”[b]


    तब वह एप्रैम और मनश्शे को ले आया। वह चाहता था कि मनश्शे को आशीष मिले, क्योंकि वह बड़ा था; इसलिए यूसुफ उसे अपने पिता याकूब के दाहिने हाथ की ओर ले गया। पर याकूब ने आत्मा में उस प्रजा का प्रतिरूप देखा जो बाद में आने वाली थी। और वह क्या कहता है? “याकूब ने अपने हाथों को एक-दूसरे के ऊपर कर लिया और अपना दाहिना हाथ दूसरे और छोटे पुत्र एप्रैम के सिर पर रखकर उसे आशीष दी। तब यूसुफ ने याकूब से कहा, ‘अपना दाहिना हाथ मनश्शे के सिर पर रखिए, क्योंकि वही मेरा पहलौठा पुत्र है।’ याकूब ने यूसुफ से कहा, ‘मैं जानता हूँ, मेरे पुत्र, मैं जानता हूँ; पर बड़ी छोटी की सेवा करेगी। फिर भी यह भी आशीष पाएगा।’”[c]


    ध्यान दो कि उसने किनके विषय में ठहराया कि यह प्रजा प्रथम हो और वाचा की वारिस बने।[d]


    और यदि इसके अतिरिक्त उसने अब्राहम के द्वारा भी इसे लिखवाया, तो हमारा ज्ञान पूर्ण हो जाता है। जब अब्राहम ने अकेले विश्वास किया और यह उसके लिए धार्मिकता गिना गया, तब वह उससे क्या कहता है? “देख, हे अब्राहम, मैंने तुझे उन जातियों का पिता बनाया है जो खतनारहित अवस्था में परमेश्वर पर विश्वास करती हैं।”[e]


    **पादटिप्पणियाँ**


    [a] उत्पत्ति 25:21–23 का स्वतंत्र उद्धरण। उपलब्ध पाठ में “बड़ी छोटी की सेवा करेगी” है; उत्पत्ति के प्रचलित पाठ में आशय प्रायः “बड़ा छोटे की सेवा करेगा” व्यक्त किया जाता है। यहाँ लेखक का शब्दरूप बनाए रखा गया है।


    [b] उत्पत्ति 48:11, 9 का स्वतंत्र संयोजन। “तेरा मुख” का अर्थ “तुझे प्रत्यक्ष देखना” है।


    [c] उत्पत्ति 48:13–20 का स्वतंत्र पुनर्कथन, जिसमें उत्पत्ति 25:23 की भाषा भी सम्मिलित है। “आत्मा में” का अर्थ यह हो सकता है कि याकूब ने आत्मा से प्रेरित होकर आने वाली प्रजा का प्रतीकात्मक पूर्वरूप देखा।


    [d] “प्रथम” से आशय पद, प्राथमिकता या उत्तराधिकार में पहले होने से हो सकता है; लेखक का तर्क उलटे हुए ज्येष्ठाधिकार के प्रतिरूप पर आधारित है।


    [e] यह उत्पत्ति 15:6 और 17:5 की भाषा का स्वतंत्र संयोजन है; “खतनारहित अवस्था में” पौलुस की अब्राहम-विषयक व्याख्या, विशेषकर रोमियों 4:9–12, की भाषा से निकटता रखता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति 25:21–23 का स्वतंत्र उद्धरण। उपलब्ध पाठ में “बड़ी छोटी की सेवा करेगी” है; उत्पत्ति के प्रचलित पाठ में आशय प्रायः “बड़ा छोटे की सेवा करेगा” व्यक्त किया जाता है। यहाँ लेखक का शब्दरूप बनाए रखा गया है।
    reason: बरनबास के उद्धरण और उत्पत्ति के प्रचलित पाठ के बीच रूपात्मक अंतर को पारदर्शी बनाना।
  - marker: b
    text: उत्पत्ति 48:11, 9 का स्वतंत्र संयोजन। “तेरा मुख” का अर्थ “तुझे प्रत्यक्ष देखना” है।
    reason: उद्धरण की संयुक्त प्रकृति और हिब्रू मुहावरे का अर्थ स्पष्ट करना।
  - marker: c
    text: उत्पत्ति 48:13–20 का स्वतंत्र पुनर्कथन, जिसमें उत्पत्ति 25:23 की भाषा भी सम्मिलित है। “आत्मा में” का अर्थ यह हो सकता है कि याकूब ने आत्मा से प्रेरित होकर आने वाली प्रजा का प्रतीकात्मक पूर्वरूप देखा।
    reason: मिश्रित उद्धरण और typological भाषा की वास्तविक अस्पष्टता बताना।
  - marker: d
    text: “प्रथम” से आशय पद, प्राथमिकता या उत्तराधिकार में पहले होने से हो सकता है; लेखक का तर्क उलटे हुए ज्येष्ठाधिकार के प्रतिरूप पर आधारित है।
    reason: “first” को केवल कालक्रम मान लेने से बचाना और तर्क की संरचना स्पष्ट करना।
  - marker: e
    text: यह उत्पत्ति 15:6 और 17:5 की भाषा का स्वतंत्र संयोजन है; “खतनारहित अवस्था में” पौलुस की अब्राहम-विषयक व्याख्या, विशेषकर रोमियों 4:9–12, की भाषा से निकटता रखता है।
    reason: इस वाक्य को उत्पत्ति का अक्षरशः एकल उद्धरण समझने से रोकना और अंतर्पाठीय संबंध दिखाना।
lexical_decisions:
- source_word: people / peoples (Greek source review pending)
  choice: प्रजा / प्रजाएँ
  rationale: अध्याय का तर्क वाचा से संबंधित सामूहिक समुदायों के बीच है। “लोग” की अपेक्षा “प्रजा” इस सामूहिक और वाचागत अर्थ को अधिक स्पष्ट रखता है, जबकि “nation” के लिए अलग से “जाति” रखा गया है।
- source_word: inheritance
  choice: विरासत
  rationale: आधुनिक और सहज शब्द, जो प्राप्त अधिकार या भाग—दोनों अर्थों को खुला रखता है।
- source_word: covenant
  choice: वाचा
  rationale: बाइबिलीय संधि-संबंध के लिए प्रचलित और धर्मवैज्ञानिक रूप से पर्याप्त शब्द।
- source_word: vanquish
  choice: पर प्रबल होगी
  rationale: सिर्फ सैन्य विनाश का अर्थ थोपे बिना अधीनता या प्रभुत्व का भाव देता है।
- source_word: type
  choice: प्रतिरूप
  rationale: बाद की प्रजा का प्रतीकात्मक पूर्वसंकेत व्यक्त करता है, पर उसे पूर्ण समानता या सीधी पहचान में नहीं बदलता।
- source_word: firstborn
  choice: पहलौठा
  rationale: ज्येष्ठता और उससे जुड़े उत्तराधिकार के बाइबिलीय भाव को सुरक्षित रखता है।
- source_word: ascribed for righteousness
  choice: उसके लिए धार्मिकता गिना गया
  rationale: उत्पत्ति 15:6 की गणना-संबंधी भाषा को बनाए रखता है और धार्मिकता को केवल नैतिक गुण के रूप में नहीं समझाता।
- source_word: in uncircumcision
  choice: खतनारहित अवस्था में
  rationale: अस्पष्ट “बिना खतने” की अपेक्षा अवस्था या दशा का भाव स्पष्ट करता है, फिर भी यह तय नहीं करता कि वाक्यांश विश्वास करने वालों को विशेषित करता है या उनके विश्वास के समय को।
theological_decisions:
- issue: “यह प्रजा” और “पहली प्रजा” की पहचान
  choice: पहचान को पाठ में अनिर्दिष्ट रखा गया
  alternative: इन्हें सीधे कलीसिया और इस्राएल नाम देना
  rationale: अंश स्वयं इन नामों का प्रयोग नहीं करता; स्पष्ट नाम जोड़ना लेखक की निहित व्याख्या को अनावश्यक रूप से निश्चित कर देता।
- issue: “बड़ी छोटी की सेवा करेगी” का व्याकरण और अर्थ
  choice: प्राप्त साक्ष्य का स्त्रीलिंग सामूहिक रूप यथावत रखा
  alternative: उत्पत्ति के मानक रूप के अनुसार “बड़ा छोटे की सेवा करेगा”
  rationale: दिए गए बरनबास-पाठ में people के सामूहिक संदर्भ से यह रूप आया है। उसे चुपचाप मानकीकृत करने से पाठ की वास्तविक भिन्नता मिट जाती।
- issue: याकूब का “आत्मा में” देखना
  choice: प्रेरित प्रतीकात्मक दृष्टि की अस्पष्टता बनाए रखी
  alternative: इसे स्पष्ट रूप से भविष्यदर्शन या मसीही कलीसिया की भविष्यवाणी कहना
  rationale: पाठ “आत्मा में एक प्रतिरूप” कहता है, पर उसकी प्रक्रिया और सटीक पहचान नहीं बताता।
- issue: अब्राहम और खतनारहित विश्वासियों का संबंध
  choice: उद्धरण-जैसी संयुक्त भाषा रखी और स्रोत-संयोजन पादटिप्पणी में बताया
  alternative: इसे केवल उत्पत्ति 17:5 का सीधा उद्धरण प्रस्तुत करना
  rationale: अंतिम वाक्य उत्पत्ति की भाषा के साथ बाद की व्याख्यात्मक भाषा को मिलाता है; इसे एक ही शास्त्रीय पद का अक्षरशः उद्धरण कहना भ्रामक होगा।
- issue: “वाचा की वारिस” में लिंग और सामूहिकता
  choice: “प्रजा” के अनुसार स्त्रीलिंग “वारिस” का प्रयोग
  alternative: “उत्तराधिकारी” या “वाचा पाने वाली”
  rationale: “वारिस” inheritance और heir के पारस्परिक शब्द-संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
