  source_fidelity: 'The draft generally follows the supplied English witness closely and appropriately leaves the identities of “this people” and “the first people” unspecified. A needed correction is in the final sentence: the righteousness is reckoned to Abraham, rather than Abraham himself being reckoned as righteousness. The wording about Manasseh’s placement is also clarified so that Joseph leads Manasseh toward Jacob’s right hand, as the narrative requires.'
  naturalness: The register is suitably modern, dignified Hindi. Minor revisions improve idiom and syntactic clarity, especially “किनके मामले में,” the positioning of Manasseh, and the final reckoning clause.
  terminology: Established biblical terms—“वाचा,” “धार्मिकता,” “खतनारहित,” “पहलौठा,” and “प्रतिरूप”—are appropriate. “प्रजा” consistently represents the collective people and preserves the author’s contrast with “जातियाँ.”
  issues:
  - severity: high
    issue: The final clause says “यह उसके लिए धार्मिकता गिना गया” only implicitly in the draft’s explanation, while the translated text says “यह उसके लिए धार्मिकता गिना गया” is needed instead of treating Abraham as what was reckoned.
    rationale: The present wording, “जब अब्राहम ने अकेले विश्वास किया और यह उसके लिए धार्मिकता गिना गया,” is close but has an unclear antecedent for “यह”; the underlying allusion is that Abraham’s believing/faith was reckoned to him as righteousness, not that Abraham himself was reckoned as righteousness. The revised wording explicitly supplies the referent without adding interpretation.
  - severity: medium
    issue: “इस प्रजाओं के विषय में” is an unnecessary pluralization of the witness’s singular “the people.”
    rationale: The immediate quotation concerns the people, while it mentions two peoples within it. Singular “इस प्रजा के विषय में” follows the supplied witness more precisely.
  - severity: medium
    issue: Joseph’s action is expressed as though he led Manasseh generally to Jacob’s right side, rather than positioning him by Jacob’s right hand for the blessing.
    rationale: Clarifying the placement preserves the narrative logic of the crossed hands without altering its typological argument.
  revised_text: '**बरनबास 13**


    अब हम देखें कि विरासत इस प्रजा को मिली है या पहली प्रजा को, और वाचा का संबंध हमसे था या उनसे।


    तो सुनो, पवित्रशास्त्र इस प्रजा के विषय में क्या कहता है: “इसहाक ने अपनी पत्नी रिबका के लिए प्रार्थना की, क्योंकि वह बाँझ थी; और वह गर्भवती हुई। तब रिबका यहोवा से पूछने गई। यहोवा ने उससे कहा, ‘तेरे गर्भ में दो जातियाँ हैं और तेरे भीतर दो प्रजाएँ हैं। एक प्रजा दूसरी प्रजा पर प्रबल होगी, और बड़ी छोटी की सेवा करेगी।’”[a]


    तुम्हें समझना चाहिए कि इसहाक कौन है, रिबका कौन है, और किनके मामले में उसने दिखाया कि एक प्रजा दूसरी से बड़ी है।


    एक दूसरी भविष्यवाणी में याकूब अपने पुत्र यूसुफ से और भी स्पष्ट रूप से कहता है, “देख, प्रभु ने मुझे तेरा मुख देखने से वंचित नहीं रखा। अपने पुत्रों को मेरे पास ला, ताकि मैं उन्हें आशीष दूँ।”[b]


    तब वह एप्रैम और मनश्शे को ले आया। वह चाहता था कि मनश्शे को आशीष मिले, क्योंकि वह बड़ा था; इसलिए यूसुफ उसे अपने पिता याकूब के दाहिने हाथ की ओर ले गया। पर याकूब ने आत्मा में उस प्रजा का प्रतिरूप देखा जो बाद में आने वाली थी। और वह क्या कहता है? “याकूब ने अपने हाथों को एक-दूसरे के ऊपर कर लिया और अपना दाहिना हाथ दूसरे, अर्थात छोटे, एप्रैम के सिर पर रखकर उसे आशीष दी। तब यूसुफ ने याकूब से कहा, ‘अपना दाहिना हाथ मनश्शे के सिर पर रखिए, क्योंकि वही मेरा पहलौठा पुत्र है।’ याकूब ने यूसुफ से कहा, ‘मैं जानता हूँ, मेरे पुत्र, मैं जानता हूँ; पर बड़ी छोटी की सेवा करेगी। फिर भी यह भी आशीष पाएगा।’”[c]


    ध्यान दो कि उसने किनके विषय में ठहराया कि यह प्रजा प्रथम हो और वाचा की वारिस बने।[d]


    और यदि इसके अतिरिक्त उसने अब्राहम के द्वारा भी इसे लिखवाया, तो हमारा ज्ञान पूर्ण हो जाता है। जब केवल अब्राहम ने विश्वास किया और वह उसके लिए धार्मिकता गिना गया, तब वह उससे क्या कहता है? “देख, हे अब्राहम, मैंने तुझे उन जातियों का पिता बनाया है जो खतनारहित अवस्था में परमेश्वर पर विश्वास करती हैं।”[e]


    **पादटिप्पणियाँ**


    [a] उत्पत्ति 25:21–23 का स्वतंत्र उद्धरण। उपलब्ध पाठ में “बड़ी छोटी की सेवा करेगी” है; उत्पत्ति के प्रचलित पाठ में आशय प्रायः “बड़ा छोटे की सेवा करेगा” व्यक्त किया जाता है। यहाँ लेखक का शब्दरूप बनाए रखा गया है।


    [b] उत्पत्ति 48:11, 9 का स्वतंत्र संयोजन। “तेरा मुख” का अर्थ “तुझे प्रत्यक्ष देखना” है।


    [c] उत्पत्ति 48:13–20 का स्वतंत्र पुनर्कथन है, जिसमें उत्पत्ति 25:23 की भाषा भी सम्मिलित है। “आत्मा में” का अर्थ यह हो सकता है कि याकूब ने आत्मा से प्रेरित होकर आने वाली प्रजा का प्रतीकात्मक पूर्वरूप देखा।


    [d] “प्रथम” से आशय पद, प्राथमिकता, या उत्तराधिकार में पहले होने से हो सकता है; लेखक का तर्क उलटे हुए ज्येष्ठाधिकार के प्रतिरूप पर आधारित है।


    [e] यह उत्पत्ति 15:6 और 17:5 की भाषा का स्वतंत्र संयोजन है; “खतनारहित अवस्था में” रोमियों 4:9–12 में अब्राहम की व्याख्या की भाषा से निकटता रखता है।'
