  terminology: “प्रकाश का मार्ग,” “परमेश्वर,” “प्रभु,” “पवित्र जन,” and “उस दुष्ट” are consistent and appropriate. “यौन-अनैतिकता” followed by “परस्त्रीगमन” makes the distinction in the witness clearer. “पापों की छुड़ौती” retains the witness’s ransom language more directly than “प्रायश्चित,” while a restrained note preserves the unresolved theological force of the phrase.
  issues:
  - severity: medium
    issue: “जहाँ लोग अशुद्ध हों” changes the construction concerning the word of God coming from one’s mouth.
    rationale: The supplied witness’s archaic wording is better represented as speech uttered in/with uncleanness, rather than a prohibition tied to being in a place where unclean people are present.
  - severity: medium
    issue: “ऊँचे पदवालों” narrows “the lofty.”
    rationale: The witness can denote the exalted, socially elevated, or proud generally; “ऊँचे लोगों” preserves this breadth without specifying political or official rank.
  - severity: low
    issue: “प्रतिफल का उत्तम दाता” weakens “good paymaster.”
    rationale: The phrase concerns the goodness of the one who gives or repays the reward, not merely an abstract excellent donor.
  - severity: low
    issue: The existing note on ransom language is more doctrinally framed than necessary.
    rationale: A textual note should identify the ransom/price metaphor and state that its precise theological implication is not defined here, without proposing or denying a systematic account of salvation.
  revised_text: 'इसलिए प्रकाश का मार्ग यह है: यदि कोई अपने लिए नियत स्थान तक पहुँचनेवाले मार्ग पर चलना चाहता है, तो वह अपने कामों में उत्साही रहे। उस पर चलने के लिए हमें जो ज्ञान दिया गया है, वह यह है:


    जिसने तुम्हें बनाया है, उससे प्रेम करो। जिसने तुम्हारी सृष्टि की है, उसका भय मानो। जिसने तुम्हें मृत्यु से छुड़ाया है, उसकी महिमा करो। हृदय से निष्कपट और आत्मा में धनी रहो। मृत्यु के मार्ग पर चलनेवालों से न जुड़े रहो। जो कुछ परमेश्वर को अच्छा नहीं लगता, उससे घृणा करो। हर प्रकार के कपट से घृणा करो। प्रभु की आज्ञाओं को कभी न छोड़ो।


    अपने आपको ऊँचा न करो, बल्कि हर बात में दीन मन के रहो। अपने लिए महिमा का दावा न करो। अपने पड़ोसी के विरुद्ध कोई बुरी योजना मन में न रखो। अपने मन में दुस्साहस को स्थान न दो।


    यौन-अनैतिकता[a] न करो। परस्त्रीगमन न करो। लड़कों को भ्रष्ट न करो। किसी अशुद्धता के साथ तुम्हारे मुँह से परमेश्वर का वचन न निकले। किसी के अपराध के लिए उसे डाँटते समय पक्षपात न करो। नम्र रहो। शांत रहो। जो वचन तुमने सुने हैं, उनका भय मानो। अपने भाई के विरुद्ध मन में बैर न रखो।


    इस बात में संदेह न करो कि कोई बात होगी या नहीं होगी। प्रभु का नाम व्यर्थ न लो। अपने पड़ोसी से अपने प्राण से भी बढ़कर प्रेम करो। गर्भपात करके किसी बच्चे की हत्या न करो, और जन्म लेने के बाद भी उसे न मारो। अपने बेटे या बेटी पर से अपना हाथ न हटाओ,[b] बल्कि बचपन से ही उन्हें परमेश्वर का भय मानना सिखाओ।


    अपने पड़ोसी की वस्तुओं का लालच करते हुए न पाए जाओ। अनुचित लाभ के लोभी न बनो। मन से ऊँचे लोगों से न चिपके रहो, बल्कि दीन और धर्मी लोगों के साथ चलो। तुम्हारे साथ जो अनचाही घटनाएँ घटें, उन्हें भलाई के रूप में स्वीकार करो, क्योंकि तुम जानते हो कि परमेश्वर के बिना कुछ नहीं होता। दो मनवाले या दोहरी बात करनेवाले न बनो।


    अपने स्वामियों के अधीन ऐसे रहो मानो वे परमेश्वर के प्रतिरूप हों—लज्जा और भय के साथ। अपने दास या दासी को, जो उसी परमेश्वर पर आशा रखते हैं, कटुता से आदेश न दो; कहीं ऐसा न हो कि वे उस परमेश्वर का भय मानना छोड़ दें जो तुम दोनों के ऊपर है। क्योंकि वह पक्षपात करके बुलाने नहीं आया, बल्कि उन्हें बुलाने आया है जिन्हें आत्मा ने तैयार किया है।


    अपने पड़ोसी को हर वस्तु में सहभागी बनाओ और किसी वस्तु को केवल अपनी न कहो। क्योंकि यदि तुम अविनाशी वस्तुओं में सहभागी हो, तो नाशवान वस्तुओं में तो और भी अधिक सहभागी होना चाहिए! अपनी जीभ से बोलने में उतावले न हो, क्योंकि मुँह मृत्यु का फंदा है। जहाँ तक तुमसे हो सके, अपने प्राण के लिए शुद्ध रहो।


    ऐसे न पाए जाओ कि लेने के लिए हाथ फैलाओ, पर देने के लिए उन्हें खींच लो। जो कोई तुम्हें प्रभु का वचन सुनाता है, उससे अपनी आँख की पुतली के समान प्रेम करो।


    न्याय के दिन को रात-दिन स्मरण रखो। प्रतिदिन पवित्र जनों को खोजो—या तो वचन के द्वारा परिश्रम करते हुए उनके पास जाकर उन्हें प्रोत्साहित करो और यह सोचो कि अपने वचन से प्राणों को कैसे बचा सकते हो, या अपने पापों की छुड़ौती के लिए अपने हाथों से काम करो।[c]


    देने में संकोच न करो और देते समय कुड़कुड़ाओ मत; बल्कि जानो कि तुम्हें प्रतिफल देनेवाला भला है। जो बातें तुम्हें प्राप्त हुई हैं, उनकी रक्षा करो—न उनमें कुछ जोड़ो, न उनमें से कुछ घटाओ। उस दुष्ट से पूरी तरह घृणा करो। धर्म के अनुसार न्याय करो।


    फूट न डालो, बल्कि झगड़नेवालों को मिलाकर उनमें मेल कराओ। अपने पापों को स्वीकार करो। दूषित विवेक के साथ प्रार्थना करने न जाओ। यही प्रकाश का मार्ग है।'
