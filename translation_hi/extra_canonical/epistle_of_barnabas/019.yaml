  source_fidelity: 'The draft preserves the sequence, imperative form, and major ethical instructions of the supplied witness well. A few renderings need adjustment: “where any are unclean” should not be made into a location containing unclean people; “the lofty” should not be narrowed to officeholders; and “good paymaster” should retain the sense of one who repays/rewards. The Greek/Latin witnesses are noted as pending, so these judgments are limited to the supplied English witness and its evident idiom.'
