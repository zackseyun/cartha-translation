  text: 'This, then, is the way of light: if anyone desires to travel on the way to his appointed place, he should be zealous in his works. The knowledge given to us, by which we may walk in it, is as follows.


    You shall love the One who made you. You shall fear the One who created you. You shall glorify the One who redeemed you from death. You shall be simple in heart and rich in spirit. You shall not cleave to those who walk the way of death. You shall hate everything that is not pleasing to God. You shall hate all hypocrisy. You shall never forsake the commandments of the Lord.


    You shall not exalt yourself, but shall be lowly minded in all things. You shall not assume glory for yourself. You shall not entertain a wicked design against your neighbor. You shall not admit boldness into your soul.


    You shall not commit fornication. You shall not commit adultery. You shall not corrupt boys. The word of God shall not come forth from you where any are unclean. You shall not make a difference in a person when reproving him for a transgression. You shall be meek. You shall be quiet. You shall fear the words you have heard. You shall not bear a grudge against your brother.


    You shall not doubt whether a thing shall be or not be. You shall not take the name of the Lord in vain. You shall love your neighbor more than your own soul. You shall not murder a child by abortion, nor shall you kill it when it is born. You shall not withhold your hand from your son or daughter, but from their youth you shall teach them the fear of God.


    You shall not be found coveting your neighbor''s goods. You shall not be found greedy for gain. Neither shall you cleave with your soul to the lofty, but you shall walk with the humble and righteous. You shall receive the accidents that befall you as good, knowing that nothing is done without God. You shall not be double-minded or double-tongued.


    You shall be subject to your masters as to a type of God, in shame and fear. You shall not command your bondservant or handmaid in bitterness, though they set their hope on the same God, lest perhaps they cease to fear the God who is over both of you; for He came not to call with respect of persons, but to call those whom the Spirit has prepared.


    You shall make your neighbor partake in all things, and shall not say that anything is your own. For if you are fellow partakers in that which is imperishable, how much rather shall you be in the things that are perishable? You shall not be hasty with your own tongue, for the mouth is the snare of death. So far as you are able, you shall be pure for your soul''s sake.


    Do not be found holding out your hands to receive and drawing them in to give. You shall love as the apple of your eye everyone who speaks to you the word of the Lord.


    You shall remember the day of judgment night and day, and day by day you shall seek out the persons of the saints, either laboring by word and going to exhort them and meditating how you may save souls by your word, or working with your hands for a ransom for your sins.


    You shall not hesitate to give, nor shall you murmur when giving, but you shall know who is the good paymaster of your reward. You shall keep the things you have received, neither adding to them nor taking away from them. You shall utterly hate the Evil One. You shall judge righteously.


    You shall not make a schism, but shall pacify those who contend by bringing them together. You shall confess your sins. You shall not betake yourself to prayer with an evil conscience. This is the way of light.'
translation:
  language: hi
  text: 'इसलिए प्रकाश का मार्ग यह है: यदि कोई अपने लिए ठहराए गए स्थान की ओर जानेवाले मार्ग पर चलना चाहता है, तो वह अपने कामों में उत्साही रहे। उस मार्ग पर चलने के लिए हमें जो ज्ञान दिया गया है, वह यह है:


    जिसने तुम्हें बनाया है, उससे प्रेम करो। जिसने तुम्हारी सृष्टि की है, उसका भय मानो। जिसने तुम्हें मृत्यु से छुड़ाया है, उसकी महिमा करो। हृदय से निष्कपट और आत्मा में समृद्ध रहो। मृत्यु के मार्ग पर चलनेवालों से न जुड़े रहो। जो कुछ परमेश्वर को अच्छा नहीं लगता, उससे घृणा करो। हर प्रकार के कपट से घृणा करो। प्रभु की आज्ञाओं को कभी न छोड़ो।


    अपने आपको ऊँचा न करो, बल्कि हर बात में दीन मन के रहो। अपने लिए महिमा का दावा न करो। अपने पड़ोसी के विरुद्ध कोई बुरी योजना मन में न रखो। अपने मन में धृष्टता को स्थान न दो।


    व्यभिचार[a] न करो। परस्त्रीगमन न करो। लड़कों को भ्रष्ट न करो। जहाँ लोग अशुद्ध हों, वहाँ तुम्हारे मुँह से परमेश्वर का वचन न निकले। किसी के अपराध पर उसे डाँटते समय पक्षपात न करो। नम्र रहो। शांत रहो। जो वचन तुमने सुने हैं, उनका भय मानो। अपने भाई के विरुद्ध मन में बैर न रखो।


    यह संदेह न करो कि कोई बात होगी या नहीं। प्रभु का नाम व्यर्थ न लो। अपने पड़ोसी से अपने प्राण से भी बढ़कर प्रेम करो। गर्भपात करके किसी बच्चे की हत्या न करो, और जन्म लेने के बाद भी उसे न मारो। अपने बेटे या बेटी पर से अपना हाथ न हटाओ,[b] बल्कि बचपन से ही उन्हें परमेश्वर का भय मानना सिखाओ।


    अपने पड़ोसी की वस्तुओं का लालच करते हुए न पाए जाओ। अनुचित लाभ के लोभी न बनो। मन से ऊँचे पदवालों से न चिपके रहो, बल्कि दीन और धर्मी लोगों के साथ चलो। तुम्हारे साथ जो अनचाही घटनाएँ घटें, उन्हें भलाई समझकर स्वीकार करो, क्योंकि तुम जानते हो कि परमेश्वर के बिना कुछ नहीं होता। दो मनवाले या दोहरी बात करनेवाले न बनो।


    अपने स्वामियों के अधीन ऐसे रहो मानो वे परमेश्वर के प्रतिरूप हों—लज्जा और भय के साथ। अपने दास या दासी को, जो उसी परमेश्वर पर आशा रखते हैं, कटुता से आदेश न दो; कहीं ऐसा न हो कि वे उस परमेश्वर का भय मानना छोड़ दें जो तुम दोनों के ऊपर है। क्योंकि वह पक्षपात करके बुलाने नहीं आया, बल्कि उन्हें बुलाने आया है जिन्हें आत्मा ने तैयार किया है।


    अपने पड़ोसी को हर वस्तु में सहभागी बनाओ और किसी वस्तु को केवल अपनी न कहो। क्योंकि यदि तुम अविनाशी वस्तुओं में सहभागी हो, तो नाशवान वस्तुओं में और भी कितना अधिक सहभागी होना चाहिए! बोलने में उतावले न हो, क्योंकि मुँह मृत्यु का फंदा है। जहाँ तक तुमसे हो सके, अपने प्राण के लिए शुद्ध रहो।


    ऐसे न पाए जाओ कि लेने के लिए हाथ फैलाओ, पर देने के लिए उन्हें खींच लो। जो कोई तुम्हें प्रभु का वचन सुनाता है, उससे अपनी आँख की पुतली के समान प्रेम करो।


    न्याय के दिन को रात-दिन स्मरण रखो। प्रतिदिन पवित्र जनों को खोजो—या तो वचन के द्वारा परिश्रम करते हुए उनके पास जाकर उन्हें प्रोत्साहित करो और यह सोचो कि अपने वचन से प्राणों को कैसे बचा सकते हो, या अपने पापों के प्रायश्चित के लिए अपने हाथों से काम करो।[c]


    देने में संकोच न करो और देते समय कुड़कुड़ाओ मत; बल्कि जानो कि तुम्हारे प्रतिफल का उत्तम दाता कौन है। जो बातें तुम्हें सौंपी गई हैं, उनकी रक्षा करो—न उनमें कुछ जोड़ो, न उनमें से कुछ घटाओ। उस दुष्ट से पूरी तरह घृणा करो। धर्म के अनुसार न्याय करो।


    फूट न डालो, बल्कि झगड़नेवालों को मिलाकर उनमें मेल कराओ। अपने पापों को स्वीकार करो। बुरे विवेक के साथ प्रार्थना करने न जाओ। यही प्रकाश का मार्ग है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त शब्द व्यापक यौन अनैतिकता का संकेत दे सकता है; अगला निषेध विशेष रूप से परस्त्रीगमन का है।
    reason: ‘fornication’ और ‘adultery’ के बीच स्रोत में रखा गया भेद हिन्दी पाठक के लिए स्पष्ट करना।
  - marker: b
    text: अर्थात अपने बेटे या बेटी की देखभाल, अनुशासन और शिक्षा से पीछे न हटो।
    reason: ‘अपना हाथ न हटाओ’ मुहावरे की संभावित अस्पष्टता स्पष्ट करना।
  - marker: c
    text: ‘पापों के प्रायश्चित के लिए’ का वाक्यांश दान या परिश्रम की प्रतिपूरक भूमिका का संकेत देता है; यह अपने आप में उद्धार की कोई पूर्ण व्यवस्था स्पष्ट नहीं करता।
    reason: उपलब्ध साक्ष्य की धार्मिक tension को बनाए रखते हुए अति-व्याख्या से बचना।
lexical_decisions:
- source_word: way of light
  choice: प्रकाश का मार्ग
  rationale: कृति के ‘दो मार्ग’ संबंधी नैतिक रूपक को सीधे और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: simple in heart
  choice: हृदय से निष्कपट
  rationale: ‘सरल’ की संभावित बौद्धिक ध्वनि से बचते हुए नैतिक अखंडता और छलरहित भाव व्यक्त करता है।
- source_word: rich in spirit
  choice: आत्मा में समृद्ध
  rationale: स्रोत की संक्षिप्त आध्यात्मिक अभिव्यक्ति को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: corrupt boys
  choice: लड़कों को भ्रष्ट न करो
  rationale: साक्ष्य की कठोर लेकिन कुछ हद तक व्यापक भाषा को सुरक्षित रखा गया; इसे किसी एक विशिष्ट कृत्य तक सीमित नहीं किया गया।
- source_word: the lofty
  choice: ऊँचे पदवालों
  rationale: सामाजिक रूप से प्रतिष्ठित या शक्तिशाली लोगों से लगाव का संभावित आशय सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी के बिना अत्यधिक विस्तार से बचता है।
- source_word: type of God
  choice: परमेश्वर के प्रतिरूप
  rationale: ‘प्रतिरूप’ typological तुलना को व्यक्त करता है, बिना स्वामियों को परमेश्वर के समान ठहराए।
- source_word: apple of thine eye
  choice: अपनी आँख की पुतली के समान
  rationale: हिन्दी में परिचित और अर्थपूर्ण बिंब, जो अत्यंत प्रिय और सुरक्षित रखने योग्य होने का भाव देता है।
- source_word: ransom for thy sins
  choice: अपने पापों के प्रायश्चित के लिए
  rationale: शाब्दिक ‘छुड़ौती’ इस प्रसंग में अस्वाभाविक होती; ‘प्रायश्चित’ प्रायश्चित्तकारी/प्रतिपूरक आशय रखता है, और पादटिप्पणी धार्मिक अस्पष्टता बताती है।
- source_word: Evil One
  choice: उस दुष्ट
  rationale: व्यक्तिवाचक बुराई के संकेत को सुरक्षित रखता है, पर स्रोत-समीक्षा लंबित होने के कारण अनावश्यक रूप से ‘शैतान’ नहीं जोड़ता।
theological_decisions:
- issue: ‘परमेश्वर के बिना कुछ नहीं होता’ और ईश्वरीय विधान
  choice: स्रोत के व्यापक कथन को यथावत रखा
  alternative: ‘परमेश्वर की अनुमति के बिना’ या ‘परमेश्वर के ज्ञान के बिना’
