source:
  text: 'But what think ye meaneth the type, where the commandment is given to Israel that those men, whose sins are full grown, offer an heifer and slaughter and burn it, and then that the children take up the ashes, and cast them into vessels, and twist the scarlet wool on a tree (see here again is the type of the cross and the scarlet wool), and the hyssop, and that this done the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand ye how in all plainness it is spoken unto you; the calf is Jesus, the men that offer it, being sinners, are they that offered Him for the slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are they that preached unto us the forgiveness of sins and the purification of our heart, they to whom, being twelve in number for a testimony unto the tribes (for there are twelve tribes of Israel), He gave authority over the Gospel, that they should preach it.


    But wherefore are the children that sprinkle three in number? For a testimony unto Abraham, Isaac and Jacob, because these are mighty before God.


    Then there is the placing the wool on the tree. This means that the kingdom of Jesus is on the cross, and that they who set their hope on Him shall live for ever.


    And why is there the wool and the hyssop at the same time? Because in His kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they heard not the voice of the Lord.'
