review_pass:
  verdict: revise
  source_fidelity: 'The draft responsibly preserves the witness''s major tensions (heifer/calf, twelve/three children, and the kingdom ''on the cross''). However, two renderings introduce avoidable interpretation: the hyssop is detached from the action of binding/twisting on the tree, and ''offered him for slaughter'' becomes ''handed him over for slaughter.'' The phrase concerning hyssop''s ''foulness'' should remain more formally strange rather than being recast as its ''repulsive nature.'''
  naturalness: The Hindi is generally clear, contemporary, and suitably dignified. Minor adjustments make the sacrificial and ritual sequence more coherent and retain the source syntax without unnatural Hindi.
  terminology: '''प्रतीक,'' ''बछिया/बछड़ा,'' ''क्रूस,'' ''सुसमाचार,'' and ''जूफा'' are appropriate. ''चढ़ाया'' is preferable to ''सौंप दिया'' for the repeated offering language. ''जूफे की अशुद्धता'' better represents the deliberately difficult expression than ''घिनौनी प्रकृति.'''
  issues:
  - severity: medium
    issue: जूफा को वृक्ष पर ऊन बाँधने की क्रिया से अलग कर दिया गया है।
    rationale: Witness wording coordinates the scarlet wool and hyssop in the ritual action. 'साथ में जूफा भी रखें' introduces a vague, separate action and loses the tree-related construction.
  - severity: medium
    issue: '''उसे वध के लिए सौंप दिया'' मूल के ''offered him for slaughter'' से अलग अर्थ देता है।'
    rationale: '''सौंप देना'' handing over का भाव जोड़ता है; पाठ की बलि/अर्पण की भाषा को ''वध के लिए चढ़ाया'' से बनाए रखना चाहिए।'
  - severity: low
    issue: '''जूफा की घिनौनी प्रकृति'' कठिन शब्द को व्याख्यात्मक बना देता है।'
    rationale: यहाँ स्रोत का आशय असामान्य और अनिश्चित है; 'जूफे की अशुद्धता' अधिक निकट है और बिना निजी स्पष्टीकरण के कठिनाई सुरक्षित रखता है।
  - severity: low
    issue: '''इसके बाद चढ़ानेवाले मनुष्य नहीं रहे'' का अर्थ मनुष्यों के अस्तित्व समाप्त होने जैसा निकल सकता है।'
    rationale: कोष्ठकित 'who offer' के अनुसार स्पष्ट करना चाहिए कि बात बलि चढ़ानेवालों की है, न कि मनुष्यों के रहने की।
  revised_text: 'पर तुम क्या समझते हो कि इस प्रतीक का क्या अर्थ है? इस्राएल को यह आज्ञा दी गई कि जिन मनुष्यों के पाप पक चुके हैं, वे एक बछिया चढ़ाएँ, उसे मारें और जला दें। फिर बालक उसकी राख उठाकर पात्रों में डालें, और लाल ऊन तथा जूफे को एक वृक्ष पर लपेटें—देखो, यहाँ फिर क्रूस और लाल ऊन का प्रतीक है। इसके बाद बालक लोगों पर एक-एक करके छिड़काव करें, ताकि वे अपने पापों से शुद्ध किए जाएँ।



    समझो कि यह तुम्हें कितनी स्पष्टता से कहा गया है: वह बछड़ा यीशु है; और उसे चढ़ानेवाले मनुष्य पापी हैं—ये वही हैं जिन्होंने उसे वध के लिए चढ़ाया। इसके बाद बलि चढ़ानेवाले मनुष्य नहीं हैं; पापियों के लिए फिर महिमा नहीं है।[a]



    छिड़काव करनेवाले बालक वे हैं जिन्होंने हमें पापों की क्षमा और हमारे हृदयों की शुद्धि का प्रचार किया। वे संख्या में बारह थे—गोत्रों के लिए एक गवाही, क्योंकि इस्राएल के बारह गोत्र हैं—और उसने उन्हें सुसमाचार का प्रचार करने का अधिकार दिया।



    पर छिड़काव करनेवाले बालक संख्या में तीन क्यों हैं? अब्राहम, इसहाक और याकूब की गवाही के लिए, क्योंकि वे परमेश्वर के सामने सामर्थी हैं।[b]



    फिर ऊन को वृक्ष पर रखा जाता है। इसका अर्थ यह है कि यीशु का राज्य क्रूस पर है, और जो उस पर आशा रखते हैं वे सदा जीवित रहेंगे।[c]



    और ऊन तथा जूफा एक साथ क्यों हैं? क्योंकि उसके राज्य में बुरे और घिनौने दिन आएँगे, जिनमें हमारा उद्धार होगा; क्योंकि जो शरीर में पीड़ा सहता है, वह जूफे की अशुद्धता के द्वारा चंगा होता है।[d]



    हमारे लिए तो यह स्पष्ट है कि ये बातें इसी कारण इस प्रकार हुईं; पर उनके लिए वे अस्पष्ट रहीं, क्योंकि उन्होंने प्रभु की वाणी नहीं सुनी।'
