base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/008.yaml
  text: 'But what do you think the type means, where the commandment is given to Israel that those men whose sins are full grown must offer a heifer, slaughter it, and burn it; and then that the children must take up the ashes and cast them into vessels, and twist the scarlet wool on a tree—see, here again is the type of the cross and the scarlet wool—and the hyssop; and that, this done, the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand how plainly it is spoken to you: the calf is Jesus; the men who offer it, being sinners, are those who offered him for slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are those who preached to us the forgiveness of sins and the purification of our hearts, those to whom, being twelve in number for a testimony to the tribes—for there are twelve tribes of Israel—he gave authority over the Gospel, that they should preach it.


    But why are the children who sprinkle three in number? For a testimony to Abraham, Isaac, and Jacob, because these are mighty before God.


    Then there is the placing of the wool on the tree. This means that the kingdom of Jesus is on the cross, and that those who set their hope on him shall live forever.


    And why are the wool and the hyssop at the same time? Because in his kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they did not hear the voice of the Lord.'
translation:
  language: hi
  text: 'पर तुम क्या समझते हो कि इस प्रतीक का क्या अर्थ है? इस्राएल को यह आज्ञा दी गई कि जिन मनुष्यों के पाप पक चुके हैं, वे एक बछिया चढ़ाएँ, उसे मारें और जला दें। फिर बालक उसकी राख उठाकर पात्रों में डालें, और लाल ऊन को एक वृक्ष पर लपेटें—देखो, यहाँ फिर क्रूस और लाल ऊन का प्रतीक है—और साथ में जूफा भी रखें। इसके बाद बालक लोगों पर एक-एक करके छिड़काव करें, ताकि वे अपने पापों से शुद्ध किए जाएँ।


    समझो कि यह तुमसे कितनी स्पष्टता से कहा गया है: वह बछड़ा यीशु है; और उसे चढ़ानेवाले मनुष्य पापी हैं—ये वही हैं जिन्होंने उसे वध के लिए सौंप दिया। इसके बाद चढ़ानेवाले मनुष्य नहीं रहे; अब पापियों के लिए महिमा नहीं है।[a]


    छिड़काव करनेवाले बालक वे हैं जिन्होंने हमें पापों की क्षमा और हमारे हृदयों की शुद्धि का प्रचार किया। वे संख्या में बारह थे—गोत्रों के लिए एक गवाही, क्योंकि इस्राएल के बारह गोत्र हैं—और उसने उन्हें सुसमाचार का प्रचार करने का अधिकार दिया।


    पर छिड़काव करनेवाले बालक संख्या में तीन क्यों हैं? अब्राहम, इसहाक और याकूब की गवाही के लिए, क्योंकि वे परमेश्वर के सामने सामर्थी हैं।[b]


    फिर ऊन को वृक्ष पर रखा जाता है। इसका अर्थ यह है कि यीशु का राज्य क्रूस पर है, और जो उस पर आशा रखते हैं वे सदा जीवित रहेंगे।[c]


    और ऊन तथा जूफा एक साथ क्यों हैं? क्योंकि उसके राज्य में बुरे और घिनौने दिन आएँगे, जिनमें हमारा उद्धार होगा; क्योंकि जो शरीर में पीड़ा सहता है, वह जूफा की घिनौनी प्रकृति के द्वारा चंगा होता है।[d]


    हमारे लिए तो यह स्पष्ट है कि ये बातें इसी कारण इस प्रकार हुईं; पर उनके लिए वे अस्पष्ट रहीं, क्योंकि उन्होंने प्रभु की वाणी नहीं सुनी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इसके बाद चढ़ानेवाले मनुष्य नहीं रहे; अब पापियों के लिए महिमा नहीं है”—यह वाक्य उपलब्ध साक्ष्य में कठिन और अर्थ की दृष्टि से अनिश्चित है।
    reason: स्रोत-भाषा समीक्षा लंबित होने के कारण संभावित वैकल्पिक अर्थ को मुख्य पाठ में निर्णीत नहीं किया गया।
  - marker: b
    text: इस अनुच्छेद में छिड़काव करनेवालों की संख्या पहले बारह और फिर तीन कही गई है; दोनों पाठगत विवरण सुरक्षित रखे गए हैं।
    reason: आंतरिक तनाव को चुपचाप सामंजस्यपूर्ण बनाने से बचना।
  - marker: c
    text: “यीशु का राज्य क्रूस पर है” को जानबूझकर निकट रूप में रखा गया है; इसका अर्थ “राजत्व क्रूस के द्वारा प्रकट हुआ” भी समझा जा सकता है, पर वह अधिक व्याख्यात्मक होगा।
    reason: धर्मवैज्ञानिक और व्याकरणिक तनाव सुरक्षित रखना।
  - marker: d
    text: जूफा की “घिनौनी प्रकृति” संबंधी कथन असामान्य है। कुछ अर्थ-छायाएँ इसकी खुरदरी, कड़वी या साधारण प्रकृति की ओर संकेत कर सकती हैं, पर उपलब्ध साक्ष्य निर्णायक नहीं है।
    reason: कठिन रूपक पर अनावश्यक निश्चितता से बचना।
lexical_decisions:
- source_word: τύπος / type (witness)
  choice: प्रतीक
  rationale: यहाँ किसी पूर्वरूपात्मक धार्मिक संकेत का अर्थ है; ‘प्रतीक’ आधुनिक पाठक के लिए सहज है और व्याख्यात्मक संबंध बनाए रखता है।
- source_word: heifer / calf
  choice: बछिया / बछड़ा
  rationale: प्राप्त साक्ष्य में पहले ‘heifer’ और फिर ‘calf’ का परिवर्तन है; उसे समतल किए बिना सुरक्षित रखा गया है।
- source_word: tree / ξύλον (likely source term)
  choice: वृक्ष
  rationale: ‘लकड़ी’ और ‘वृक्ष’ दोनों संभव हैं; संदर्भ में क्रूस का पूर्वरूप देखते हुए भी साक्ष्य की शब्द-छवि बनाए रखने के लिए ‘वृक्ष’ चुना गया।
- source_word: scarlet wool
  choice: लाल ऊन
  rationale: सामान्य आधुनिक हिन्दी में स्पष्ट और प्राकृतिक; रंग की प्रतीकात्मकता को अतिरिक्त व्याख्या से नहीं बाँधा गया।
- source_word: hyssop
  choice: जूफा
  rationale: बाइबलीय वनस्पति के प्रचलित हिन्दी नाम का उपयोग किया गया।
- source_word: Gospel
  choice: सुसमाचार
  rationale: धार्मिक-साहित्यिक संदर्भ का मानक, व्यापक रूप से समझा जाने वाला हिन्दी पद।
- source_word: full grown (sins)
  choice: पक चुके हैं
  rationale: पापों के परिपक्व या पूर्ण हो जाने की रूपकात्मक छवि को सहज हिन्दी में रखा गया।
- source_word: foulness
  choice: घिनौनी प्रकृति
  rationale: कठिन और असामान्य तर्क को मिटाए बिना हिन्दी में अर्थगम्य बनाया गया; इसे केवल ‘कड़वाहट’ या औषधीय गुण मानकर निर्णीत नहीं किया गया।
theological_decisions:
- issue: यीशु का राज्य ‘क्रूस पर’ होने का कथन
  choice: शाब्दिक तनाव सहित ‘यीशु का राज्य क्रूस पर है’
  alternative: ‘यीशु का राजत्व क्रूस में प्रकट होता है’
  rationale: वैकल्पिक रूप अधिक व्याख्यात्मक और धर्मवैज्ञानिक रूप से समतल होता; प्राप्त साक्ष्य की असामान्य उक्ति सुरक्षित रखी गई।
- issue: बारह और तीन छिड़काव करनेवाले बालकों का भेद
  choice: दोनों संख्याएँ यथावत रखीं
  alternative: उन्हें अलग समूह या प्रतीक बताकर सामंजस्य स्थापित करना
  rationale: पाठ के भीतर वास्तविक तनाव को बिना प्रमाण हल नहीं किया गया।
- issue: ‘अब पापियों के लिए महिमा नहीं’
  choice: अस्पष्ट निष्कर्ष को निकट रूप में रखा
  alternative: इसे दोषियों के अधिकार, सम्मान या बलिदान-सेवा के अंत के रूप में स्पष्ट करना
  rationale: स्रोत-भाषा समीक्षा लंबित है और अंग्रेज़ी साक्ष्य स्वयं कठिन है; निजी व्याख्या नहीं जोड़ी गई।
- issue: ‘उसने’ का कर्ता
  choice: सर्वनाम को खुला रखा
  alternative: स्पष्ट रूप से ‘यीशु ने’ या ‘परमेश्वर ने’ कहना
  rationale: प्राप्त पाठ कर्ता को नाम से स्पष्ट नहीं करता; धर्मवैज्ञानिक निर्णय थोपने से बचा गया।
- issue: जूफा द्वारा चंगाई
  choice: असामान्य कारण-संबंध को सुरक्षित रखा
  alternative: जूफा को शुद्धिकरण का साधन कहकर सामान्य बाइबलीय प्रतीकवाद में ढालना
  rationale: लेखक की विशिष्ट और कठिन अभिव्यक्ति को बाद की सुव्यवस्थित व्याख्या से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य-विन्यास को पठनीय बनाया गया है, पर बछिया/बछड़ा, बारह/तीन, ‘क्रूस पर राज्य’, और जूफा की घिनौनी प्रकृति जैसे वास्तविक पाठगत तनाव सुरक्षित हैं। मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी/लैटिन स्रोत समीक्षा अभी लंबित है।
