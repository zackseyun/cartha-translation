  text: 'But let us ask whether the Lord took care to reveal beforehand anything about the water and the cross. Now concerning the water, it is written with reference to Israel that they would not receive the baptism that brings forgiveness of sins, but would build for themselves.


    For the prophet says, “Be astonished, heaven, and let the earth shudder even more at this, for this people has done two evil things: they abandoned me, the fountain of life, and they dug for themselves a pit of death.


    “Is my holy mountain of Sinai a desert rock? For you shall be like the young birds that flutter aloft when deprived of their nest.”


    And again the prophet says, “I will go before you and level mountains, crush gates of bronze, and break iron bars in pieces. I will give you treasures—dark, concealed, and unseen—so that they may know that I am the Lord God.”


    And, “You shall dwell in a lofty cave of a strong rock.” And, “His water shall be sure. You shall see the King in glory, and your soul shall meditate on the fear of the Lord.”


    And again he says in another prophet, “The one who does these things shall be like the tree planted beside divided streams of water, which shall yield its fruit in its proper season. Its leaf shall not fall off, and everything he does shall prosper.


    “Not so the ungodly, not so. Instead, they are like the dust that the wind scatters from the face of the earth. Therefore, ungodly people shall not stand in the judgment, nor sinners in the council of the righteous. For the Lord knows the way of the righteous, but the way of the ungodly shall perish.”


    You understand how he pointed out the water and the cross at the same time. For this is the meaning: Blessed are those who set their hope on the cross and go down into the water. For he speaks of the reward “in its proper season.” “Then,” he says, “I will repay.” But what does he say about the present? “Its leaves shall not fall off.” By this he means that every word that comes from your mouth in faith and love shall lead many to conversion and hope.


    And again another prophet says, “The land of Jacob was praised above the whole earth.” He means this: He glorifies the vessel of his Spirit.


    What does he say next? “There was a river flowing from the right hand, and beautiful trees grew up from it. Whoever eats from them shall live forever.”


    He says this because we go down into the water burdened with sins and filth, and we rise from it bearing fruit in the heart, resting our fear and hope on Jesus in the spirit. “Whoever eats from these shall live forever.” He means this: “Whoever,” he says, “hears these things being spoken and believes shall live forever.”'
translation:
  language: hi
  text: 'पर आइए, हम पूछें कि क्या प्रभु ने जल और क्रूस के विषय में पहले से कुछ प्रकट करने का ध्यान रखा था। जल के विषय में इस्राएल के संबंध में लिखा है कि वे पापों की क्षमा लानेवाला बपतिस्मा ग्रहण नहीं करेंगे, बल्कि अपने लिए बनाएँगे।[a]


    क्योंकि भविष्यवक्ता कहता है, “हे आकाश, चकित हो जा, और पृथ्वी इस बात पर और भी अधिक काँप उठे, क्योंकि इस प्रजा ने दो बुरे काम किए हैं: उन्होंने मुझ जीवन के सोते को त्याग दिया, और अपने लिए मृत्यु का गड्ढा खोद लिया।


    “क्या सीनै का मेरा पवित्र पर्वत मरुभूमि की चट्टान है? क्योंकि तुम उन चिड़िया के बच्चों के समान हो जाओगे जो अपना घोंसला छिन जाने पर ऊपर फड़फड़ाते फिरते हैं।”[b]


    और फिर भविष्यवक्ता कहता है, “मैं तेरे आगे-आगे चलूँगा, पर्वतों को समतल करूँगा, काँसे के फाटकों को चूर करूँगा और लोहे की बेड़ियों को टुकड़े-टुकड़े कर दूँगा। मैं तुझे अंधकार में रखे हुए, छिपे और अनदेखे खजाने दूँगा, ताकि वे जानें कि मैं प्रभु परमेश्वर हूँ।”


    और, “तू दृढ़ चट्टान की ऊँची गुफा में रहेगा।” और, “उसका जल निश्चित रहेगा। तुम राजा को उसकी महिमा में देखोगे, और तुम्हारा मन प्रभु के भय पर मनन करेगा।”[c]


    और फिर वह एक दूसरे भविष्यवक्ता में कहता है, “जो ये काम करता है, वह उस वृक्ष के समान होगा जो जल की विभाजित धाराओं के पास लगाया गया है। वह अपने उचित समय पर फल देगा, उसका पत्ता नहीं झड़ेगा, और वह जो कुछ करेगा उसमें सफल होगा।


    “दुष्ट ऐसे नहीं हैं, बिल्कुल नहीं; वे उस धूल के समान हैं जिसे हवा धरती के ऊपर से उड़ा ले जाती है। इसलिए दुष्ट न्याय के समय खड़े न रह सकेंगे, और न पापी धर्मियों की सभा में। क्योंकि प्रभु धर्मियों का मार्ग जानता है, पर दुष्टों का मार्ग नष्ट हो जाएगा।”


    तुम समझते हो कि उसने एक ही समय जल और क्रूस—दोनों की ओर कैसे संकेत किया। इसका अर्थ यह है: धन्य हैं वे जो क्रूस पर अपनी आशा रखते और जल में उतरते हैं। क्योंकि “अपने उचित समय पर” कहकर वह प्रतिफल की बात करता है। वह कहता है, “तब मैं बदला दूँगा।” पर वर्तमान के विषय में वह क्या कहता है? “उसके पत्ते नहीं झड़ेंगे।” इससे उसका अर्थ है कि विश्वास और प्रेम में तुम्हारे मुँह से निकलनेवाला प्रत्येक वचन बहुतों को मन-फिराव और आशा की ओर ले जाएगा।


    और फिर एक दूसरा भविष्यवक्ता कहता है, “याकूब की भूमि की प्रशंसा सारी पृथ्वी से बढ़कर हुई।” उसका अर्थ यह है: वह अपने आत्मा के पात्र को महिमा देता है।[d]


    इसके बाद वह क्या कहता है? “दाहिनी ओर से एक नदी बह रही थी, और उससे सुंदर वृक्ष उग आए; जो कोई उनका फल खाएगा, वह सदा जीवित रहेगा।”[e]


    वह ऐसा इसलिए कहता है कि हम पापों और मलिनता से लदे हुए जल में उतरते हैं और उसमें से हृदय में फल धारण किए हुए ऊपर आते हैं; आत्मा में हमारा भय और हमारी आशा यीशु पर टिके रहते हैं। “जो कोई इनका फल खाएगा, वह सदा जीवित रहेगा।” उसका अर्थ यह है: वह कहता है, “जो कोई इन कही जा रही बातों को सुनेगा और विश्वास करेगा, वह सदा जीवित रहेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य उपलब्ध पाठ-साक्ष्य में “अपने लिए बनाएँगे” पर अधूरा रह जाता है; संभवतः आगे आनेवाले ‘गड्ढा खोदने’ के उद्धरण की ओर संकेत है।
    reason: पाठगत अपूर्णता को बिना अनुमानित शब्द मुख्य पाठ में जोड़े स्पष्ट करना।
  - marker: b
    text: यह उद्धरण ज्ञात पुराने नियम के पाठों का स्वतंत्र रूप या संयोजन प्रतीत होता है; इसकी शब्दावली मानक पाठ से भिन्न है।
    reason: पाठक को असामान्य उद्धरण-रूप के विषय में सचेत करना।
  - marker: c
    text: इन पंक्तियों में यशायाह से संबंधित अनेक वाक्यांश संयुक्त हैं; “उसका जल” का संदर्भ उपलब्ध रूप में स्पष्ट नहीं है।
    reason: संकलित उद्धरण और सर्वनामगत अस्पष्टता को सुरक्षित रखना।
  - marker: d
    text: “अपने आत्मा के पात्र” से किस व्यक्ति या समुदाय का संकेत है, यह स्पष्ट नहीं किया गया है।
    reason: धर्मवैचारिक अस्पष्टता को किसी निजी व्याख्या से न भरना।
  - marker: e
    text: यह दृश्य संभवतः यहेजकेल 47 की नदी और जीवनदायी वृक्षों की छवि को स्वतंत्र रूप में प्रस्तुत करता है।
    reason: उद्धरण-संबंध की जानकारी देना, जबकि इसे शाब्दिक समानता का दावा न बनाना।
lexical_decisions:
- source_word: ὕδωρ / water
  choice: जल
  rationale: धर्मग्रंथीय उद्धरणों और बपतिस्मा-संबंधी तर्क में गरिमापूर्ण तथा स्वाभाविक शब्द; पूरे अध्याय में एकरूपता रखता है।
- source_word: σταυρός / cross
  choice: क्रूस
  rationale: आरंभिक मसीही साहित्य में प्रचलित तकनीकी अर्थ को स्पष्ट रखता है और सामान्य ‘सलीब’ की अपेक्षा हिन्दी बाइबिलीय रजिस्टर से मेल खाता है।
- source_word: βάπτισμα / baptism
  choice: बपतिस्मा
  rationale: विशिष्ट धार्मिक क्रिया को अस्पष्ट किए बिना आधुनिक हिन्दी मसीही पाठकों के लिए परिचित रूप।
- source_word: μετάνοια / conversion/repentance
  choice: मन-फिराव
  rationale: नैतिक और आध्यात्मिक दिशा-परिवर्तन को व्यक्त करता है; केवल खेद या संस्थागत धर्म-परिवर्तन का अर्थ नहीं देता।
- source_word: σκεῦος τοῦ πνεύματος / vessel of the Spirit
  choice: आत्मा का पात्र
  rationale: रूपक को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखता है; ‘आत्मा’ की पहचान संबंधी मूल तनाव को खुला छोड़ता है।
- source_word: φόβος / fear
  choice: भय
  rationale: ईश्वर के प्रति श्रद्धामय भय और वास्तविक भय की स्रोतगत अर्थ-सीमा को ‘श्रद्धा’ से संकुचित नहीं करता।
theological_decisions:
- issue: जल और बपतिस्मा का संबंध
  choice: लेखक के अपने निष्कर्ष के अनुसार जल में उतरने को पाप-क्षमा लानेवाले बपतिस्मे से जोड़ा गया है।
  alternative: ‘जल’ को केवल शुद्धि या जीवन का सामान्य प्रतीक बनाना।
  rationale: अनुच्छेद स्वयं βάπτισμα/बपतिस्मा और जल में उतरने की भाषा का स्पष्ट संबंध बनाता है; अनुवाद को इस संबंध को न तो कमजोर करना चाहिए, न आगे विकसित करना चाहिए।
- issue: क्रूस पर आशा रखना
  choice: ‘क्रूस पर अपनी आशा रखते’ रखा गया है।
  alternative: ‘क्रूसित मसीह पर भरोसा रखते’ जैसा व्याख्यात्मक विस्तार।
  rationale: लेखक की संक्षिप्त और वस्तु-केंद्रित भाषा को सुरक्षित रखा गया है; निहित मसीह-विज्ञान को स्पष्ट करने के नाम पर पाठ में शब्द नहीं जोड़े गए।
- issue: ‘अपने आत्मा के पात्र’ की पहचान
  choice: सर्वनाम और रूपक को यथावत अस्पष्ट रखा गया है।
  alternative: इसे स्पष्टतः कलीसिया, मनुष्य-देह, मसीह, या बपतिस्मा पाए व्यक्ति के रूप में पहचानना।
  rationale: उपलब्ध साक्ष्य में पहचान निश्चित नहीं है और किसी एक सम्प्रदायगत व्याख्या को आरोपित करना अनुचित होगा।
- issue: यीशु पर भय और आशा टिकना
  choice: असामान्य युग्म ‘हमारा भय और हमारी आशा यीशु पर टिके रहते हैं’ सुरक्षित रखा गया है।
  alternative: ‘यीशु के प्रति श्रद्धा और यीशु में आशा’ कर अर्थ को सहज बनाना।
  rationale: मूल साक्ष्य की धर्मवैचारिक और व्याकरणिक खिंचाव को चुपचाप हल नहीं किया गया।
- issue: अपूर्ण आरंभिक वाक्य
  choice: ‘बल्कि अपने लिए बनाएँगे’ को अपूर्ण ही रखा गया है।
  alternative: ‘अपने लिए हौद/गड्ढे बनाएँगे’ जोड़कर यिर्मयाह के उद्धरण से पूर्ति करना।
  rationale: प्राप्त साक्ष्य में वाक्य अपूर्ण है; अनुमानित पूर्ति को मुख्य पाठ में डालना पाठ-साक्ष्य से आगे जाना होता।
