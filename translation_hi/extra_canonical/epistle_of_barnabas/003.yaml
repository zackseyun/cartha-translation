  yaml_path: translation/extra_canonical/epistle_of_barnabas/003.yaml
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
translation:
  language: hi
  text: 'इसलिए वह इन बातों के विषय में उनसे फिर कहता है: “तुम मेरे लिए उपवास क्यों रखते हो,” प्रभु कहता है, “कि आज तुम्हारा ऊँचा पुकारना सुनाई दे? यह वह उपवास नहीं जिसे मैंने चुना है,” प्रभु कहता है, “न यह कि मनुष्य अपने प्राण को दीन करे;


    न यह कि तुम अपनी गर्दन छल्ले की तरह झुका लो, टाट ओढ़ो और राख को अपना बिछौना बनाओ। तब भी तुम इसे ग्रहणयोग्य उपवास नहीं कहोगे।


    पर हमसे वह कहता है: “देखो, यह वह उपवास है जिसे मैंने चुना है,” प्रभु कहता है: “दुष्टता का हर बंधन खोल दो, बलपूर्वक कराए गए समझौतों की कसी हुई रस्सियाँ खोल दो,[a] कुचले हुओं को स्वतंत्र करके विदा करो, और हर अन्यायपूर्ण जुए को तोड़ डालो। अपनी रोटी भूखे के साथ बाँटो; यदि किसी को नंगा देखो तो उसे वस्त्र पहनाओ। बेघर को अपने घर में ले आओ; और यदि किसी दीन मनुष्य को देखो तो उसे तुच्छ न जानो—न अपने घराने और अपने ही वंश के किसी जन को।


    तब तुम्हारा प्रकाश भोर के समान फूट निकलेगा, और तुम्हारा घाव शीघ्र भर जाएगा। धार्मिकता तुम्हारे आगे-आगे चलेगी, और परमेश्वर की महिमा तुम्हें चारों ओर से घेरे रहेगी।


    तब तुम पुकारोगे और परमेश्वर तुम्हारी सुनेगा; तुम बोल ही रहे होगे कि वह कहेगा, ‘देखो, मैं यहाँ हूँ।’ यदि तुम अपने बीच से जुआ, उँगली उठाना और कुड़कुड़ाहट की बात दूर कर दो; यदि तुम पूरे मन से भूखे को अपनी रोटी दो और दीन प्राण पर दया करो।


    इसलिए, मेरे भाइयो, इसी उद्देश्य से उस धीरजवन्त ने—यह पहले से देखकर कि वे लोग, जिन्हें उसने अपने प्रियतम में तैयार किया था, सरलता से विश्वास करेंगे—हमें सब बातें पहले ही प्रकट कर दीं, ताकि हम नए सीखनेवालों की तरह उनके विधान से टकराकर अपने विश्वास का जहाज़ न डुबो बैठें।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बलपूर्वक कराए गए समझौतों की कसी हुई रस्सियाँ” का पाठ और सटीक अर्थ अनिश्चित है। संबंधित यशायाही परंपरा में इसका अर्थ अन्यायपूर्ण दायित्वों या जुए की गाँठें खोलना भी हो सकता है।
    reason: प्रत्यक्ष यूनानी/लातीनी पाठ-समीक्षा लंबित है और उपलब्ध अंग्रेज़ी साक्ष्य असामान्य कानूनी भाषा देता है।
  - marker: b
    text: यह मसौदा उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य और दिए गए परामर्श-पाठ पर आधारित है; यूनानी और लातीनी पांडुलिपियों की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: स्रोत-विवरण स्वयं मूल-भाषा समीक्षा को लंबित बताता है; प्रकाशन-पारदर्शिता आवश्यक है।
lexical_decisions:
- source_word: abasing/humbling his soul (Isaianic ψυχή-language)
  choice: अपने प्राण को दीन करे
  rationale: ‘प्राण’ मूल की समग्र व्यक्ति/जीवन-सत्ता की अभिव्यक्ति को बनाए रखता है; इसे केवल ‘मन’ या भावनात्मक नम्रता तक सीमित नहीं किया गया।
- source_word: forcible contracts
  choice: बलपूर्वक कराए गए समझौते
  rationale: प्रस्तुत साक्ष्य में आर्थिक-कानूनी दबाव का भाव है; ‘समझौते’ को रखा गया, पर पाठ-साक्ष्य की अनिश्चितता के कारण पादटिप्पणी जोड़ी गई।
- source_word: the broken ones
  choice: कुचले हुओं
  rationale: यह शारीरिक टूटन से अधिक उत्पीड़न से टूटे लोगों की ओर संकेत करता है और यशायाह-संबंधी सामाजिक संदर्भ के अनुकूल है।
- source_word: healing
  choice: तुम्हारा घाव शीघ्र भर जाएगा
  rationale: संज्ञात्मक ‘चंगाई’ के बजाय स्वाभाविक हिन्दी में आरोग्य-प्राप्ति का चित्र व्यक्त किया गया, बिना उसे केवल शारीरिक उपचार मानने के।
- source_word: simplicity
  choice: सरलता से
  rationale: विश्वास की निष्कपट और सहज मुद्रा का भाव रखा गया; ‘भोलेपन’ जैसे नकारात्मक अर्थ से बचा गया।
- source_word: shipwreck ourselves upon their law
  choice: उनके विधान से टकराकर अपने विश्वास का जहाज़ न डुबो बैठें
  rationale: मूल समुद्री रूपक सुरक्षित रखा गया और हिन्दी में उसके आशय को स्पष्ट करने के लिए ‘अपने विश्वास का’ जोड़ा गया।
theological_decisions:
- issue: उपवास की आलोचना का स्वरूप
  choice: बाहरी उपवास के स्थान पर न्याय और दया को चुना हुआ उपवास बताना
  alternative: हर प्रकार के उपवास का निषेध
  rationale: उद्धरण विशेष प्रकार के कर्मकाण्डी आत्म-दमन को अस्वीकार करता है और न्यायपूर्ण आचरण को स्वीकृत उपवास कहता है; सार्वभौमिक निषेध पाठ से अधिक होगा।
- issue: ‘अपने प्रियतम में’ का संदर्भ
  choice: अस्पष्ट शीर्षक ‘अपने प्रियतम’ को यथावत रखना
  alternative: स्पष्ट रूप से ‘यीशु मसीह में’ लिखना
  rationale: मसीही संकेत सम्भावित है, पर उपलब्ध स्रोत-साक्ष्य में नाम नहीं है; अनुवाद ने निहितार्थ को व्याख्यात्मक रूप से नहीं खोला।
- issue: ‘उनके विधान’ के प्रति लेखक का संबंध
  choice: लेखक की तीखी दूरी को बनाए रखना
  alternative: इसे केवल ‘विधान की गलत व्याख्या’ कहना
  rationale: पाठ स्वयं ‘उनके विधान’ कहता है; इसे नरम करना लेखक की वास्तविक धर्मवैचारिक तनावशीलता को मिटा देता।
- issue: ‘धार्मिकता’
  choice: धार्मिकता
  alternative: तेरा धर्मी आचरण
  rationale: अमूर्तता और सम्भावित बहुअर्थता—न्यायपूर्ण आचरण, सही स्थिति, या ईश्वरीय प्रतिफल—को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। यशायाह-सदृश उद्धरण में काव्यात्मक समानांतरता और आज्ञार्थक बल रखा गया है। ‘टाट’, ‘जुआ’, ‘धार्मिकता’, ‘प्राण’ जैसे बाइबलीय शब्द संदर्भगत स्पष्टता के साथ सुरक्षित हैं। उद्धरण-सीमाएँ इस प्रकार रखी गई हैं कि अंतिम अनुच्छेद बरनबास के लेखक की टिप्पणी के रूप में स्पष्ट रहे।
