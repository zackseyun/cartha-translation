    पर वह हमसे कहता है: “देखो, यह वह उपवास है जिसे मैंने चुना है,” प्रभु कहता है: “दुष्टता का हर बंधन खोल दो, बलपूर्वक कराए गए समझौतों की कसी हुई रस्सियाँ खोल दो,[a] कुचले हुओं को स्वतंत्र करके विदा करो, और हर अन्यायपूर्ण जुए को तोड़ डालो। अपनी रोटी भूखों के साथ बाँटो; यदि किसी को नंगा देखो, तो उसे वस्त्र पहनाओ। बेघर को अपने घर में ले आओ; और यदि किसी दीन व्यक्ति को देखो, तो उसे तुच्छ न जानो—न अपने घराने और अपने ही वंश के किसी जन को।


    तब तुम्हारा प्रकाश भोर के समान फूट निकलेगा, और तुम्हारी चंगाई शीघ्र प्रकट होगी। धार्मिकता तुम्हारे आगे-आगे चलेगी, और परमेश्वर की महिमा तुम्हें चारों ओर से घेरे रहेगी।


    तब तुम पुकारोगे और परमेश्वर तुम्हारी सुनेगा; तुम बोल ही रहे होगे कि वह कहेगा, ‘देखो, मैं यहाँ हूँ।’ यदि तुम अपने बीच से जुआ, उँगली उठाना और शिकायत की बात दूर कर दो; यदि तुम पूरे मन से भूखे को अपनी रोटी दो और दीन प्राण पर दया करो।”


    इसलिए, मेरे भाइयो, इसी उद्देश्य से उस धीरज रखनेवाले ने—यह पहले से देखकर कि वे लोग, जिन्हें उसने अपने प्रिय में तैयार किया था, सरलता से विश्वास करेंगे—हमें सब बातें पहले ही प्रकट कर दीं, ताकि हम नए सीखनेवालों की तरह उनके विधान से टकराकर जहाज़ न डुबो बैठें।'
