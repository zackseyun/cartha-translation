  yaml_path: translation/extra_canonical/thunder_perfect_mind/093.yaml
  text: 'The calling of my name—it is I.

    I am the crying out, and I am the hearing.

    You hear me in your calling of me; you call me with a sound you …'
translation:
  language: hi
  text: '**9.** मेरे नाम की पुकार—मैं ही हूँ।


    मैं ही पुकार हूँ, और मैं ही सुनना हूँ।


    तुम मुझे तब सुनते हो जब तुम मुझे पुकारते हो; तुम मुझे उस ध्वनि से पुकारते हो जिसे तुम उच्चारित करते हो…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ पांडुलिपि/OCR का पाठ पृष्ठ-विभाजन पर खंडित है: ⲟⲩⲡ… के बाद ⲉⲧⲉⲧⲛⲧⲁⲩⲟ मिलता है। ‘ध्वनि’ संभावित पुनर्निर्माण है; ‘वाणी’ भी संभव है। आगे का वाक्य अधूरा है।'
    reason: खंडित और अनिश्चित स्रोत-पाठ
lexical_decisions:
- source_word: ⲡⲱϣ(ⲥ) ⲙ̄ⲡⲁⲣⲁⲛ
  choice: मेरे नाम की पुकार
  rationale: यहाँ आरंभिक पद को ⲱϣ, ‘पुकारना/ऊँचे स्वर में कहना’, से बने संज्ञात्मक रूप के रूप में समझा गया है। ‘पुकार’ नाम और संबोधन के संबंध को बनाए रखती है; केवल ‘ध्वनि’ कहना अर्थ को अनावश्यक रूप से व्यापक कर देता। अंतिम ⲥ OCR-संदिग्ध है।
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: मैं ही हूँ
  rationale: बलाघाती कापुलर कथन का स्वाभाविक हिन्दी रूप; ‘ही’ काव्यात्मक पहचान के जोर को व्यक्त करता है।
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: पुकारना
  rationale: OCR में मिला रूप ⲁϣⲕⲁⲕ ‘पुकार उठना/चिल्लाना’ से संबंधित है, न कि ‘निर्दोष’ के अर्थ से। क्रियार्थक संज्ञा ‘पुकारना’ मूल की संज्ञात्मक, विरोधाभासी शैली को बनाए रखती है।
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: सुनना
  rationale: ⲥⲱⲧⲙ̄ का मूल अर्थ ‘सुनना’ है। समानांतर संज्ञात्मक कथन को बनाए रखने के लिए ‘जो सुना जाता है’ के बजाय क्रियार्थक संज्ञा चुनी गई है।
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ ϩⲛ ⲛⲉⲧⲛⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: जब तुम मुझे पुकारते हो, तब तुम मुझे सुनते हो
  rationale: द्वितीय पुरुष बहुवचन संबोधन और ‘मुझे सुनना/मुझे पुकारना’ दोनों को स्पष्ट रखा गया है। ϩⲛ के प्रसंगगत संबंध को स्वाभाविक हिन्दी में काल-सहवर्तिता के रूप में व्यक्त किया गया है।
- source_word: ϩⲛ ⲟⲩⲡ… ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: उस ध्वनि से … जिसे तुम उच्चारित करते हो
  rationale: खंडित ⲟⲩⲡ… को संभावित ध्वनि/वाणी-संज्ञा माना गया है, जबकि ⲧⲁⲩⲟ का अर्थ यहाँ ‘निकालना/उच्चारित करना’ है। पाठ की क्षति को दीर्घविराम और पादटिप्पणी से खुला रखा गया है।
theological_decisions:
- issue: वक्ता का ‘पुकारना’ और ‘सुनना’ दोनों के साथ आत्मपरिचय
  choice: दोनों को समानांतर क्रियार्थक संज्ञाओं—‘पुकारना’ और ‘सुनना’—के रूप में रखा गया
  alternative: ‘मैं पुकारती हूँ और मेरी ही बात सुनी जाती है’
  rationale: वैकल्पिक रूप काव्य के वास्तविक दार्शनिक/धार्मिक तनाव को सक्रिय और निष्क्रिय भूमिकाओं में बाँटकर सुलझा देता। स्रोत का पहचान-सूचक विरोधाभास बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी अपनाई गई है। ‘मैं ही…’ की पुनरावृत्ति मूल के बलाघात और लय को रखती है। अत्यधिक संस्कृतनिष्ठ ‘श्रवण’ तथा सिद्धांत-विशिष्ट ‘निर्दोष/पापरहित’ से बचा गया है।
