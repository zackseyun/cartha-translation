- source_word: ⲟⲩϣⲙⲙⲱ
  choice: परदेशी
  rationale: पाठ कुछ अनिश्चित है, पर अगले पद ‘नागरिक’ के विपरीत ‘परदेशी’ अर्थ और काव्यात्मक संतुलन दोनों में उपयुक्त है।
- source_word: ⲣⲙⲛⲡⲟⲗⲓⲥ
  choice: नागरिक
  rationale: शाब्दिक ‘नगर का व्यक्ति’ का स्वाभाविक हिन्दी समतुल्य है और ‘परदेशी’ से स्पष्ट विरोध बनाता है।
- source_word: ⲟⲩⲥⲓⲁ
  choice: सारतत्त्व
  rationale: यूनानी οὐσία सत्ता, सार या द्रव्य का बोध करा सकता है; ‘सारतत्त्व’ दार्शनिक आयाम बनाए रखते हुए ‘सार’ की अपेक्षा अधिक स्पष्ट है।
- source_word: ⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: संगति
  rationale: यूनानी συνουσία साथ होने, साहचर्य, मेल-जोल, और कभी यौन-संयोग तक का अर्थ दे सकता है; ‘संगति’ यहाँ सम्बन्धपरक अस्पष्टता को यथासम्भव खुला रखता है।
- source_word: ⲣ-ⲁⲧⲥⲟⲟⲩⲛ
  choice: नहीं जानते
  rationale: यह privative ⲁⲧ- के साथ ‘अज्ञानी होना/न जानना’ है, न कि causative ‘ज्ञात कराना’।
theological_decisions:
- issue: वक्ता का एक साथ सारतत्त्व होना और सारतत्त्व-विहीन होना
  choice: 'विरोधाभास को ज्यों का त्यों रखा गया: ‘मैं सारतत्त्व हूँ, और वह भी जिसमें कोई सारतत्त्व नहीं है।’'
  alternative: इसे किसी धर्मवैज्ञानिक सिद्धान्त के अनुसार ‘मैं सत्ता हूँ और असत्ता भी’ कहकर समझाना
  rationale: स्रोत जानबूझकर विरोधी आत्म-घोषणाएँ रखता है; अनुवाद को इस तनाव को सुलझाना या किसी सम्प्रदायगत तत्त्वमीमांसा में ढालना नहीं चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, घोषणात्मक और काव्यात्मक लय रखी गई है। ‘भी … भी’ से परदेशी/नागरिक और सारतत्त्व/सारतत्त्व-विहीन विरोधों की समकालिकता उभरती है। भाषा को समझने योग्य रखा गया है, जबकि οὐσία जैसे दार्शनिक पद के लिए आवश्यक तकनीकी गहराई बनाए रखी गई है।
