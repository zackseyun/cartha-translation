base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/077.yaml
  text: 'I am the silence within a voice[a].

    I am peace, and because of me war came to be.

    And I am a foreigner and a citizen.

    I am the substance, and the one who has no substance[g][f][e][d][c][b]; those who exist outside my association are ignorant of me.'
translation:
  language: hi
  text: '**2.** मैं वाणी के भीतर का मौन हूँ[a]।


    मैं शांति हूँ, और मेरे कारण युद्ध अस्तित्व में आया।


    मैं परदेशी भी हूँ और नागरिक भी[b]।


    मैं सत्ता हूँ, और सत्ता-विहीन भी हूँ[c]। जो मेरी संगति से बाहर हैं, वे मुझे नहीं जानते[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले शब्द का OCR-पाठ अपूर्ण है। सम्भावित पाठ का अर्थ ‘मौन’ है; ‘वाणी के भीतर मौन’ इस रचना में बार-बार आने वाले विरोधाभासी ढंग के अनुरूप है।
    reason: textual_uncertainty
  - marker: b
    text: ‘परदेशी’ के लिए मूल शब्द का पाठ कुछ अनिश्चित है; ‘अजनबी’ भी सम्भव है।
    reason: lexical_alternative
  - marker: c
    text: ‘सत्ता’ यूनानी οὐσία का अनुवाद है; ‘सार’, ‘द्रव्य’ या ‘सारतत्त्व’ भी सम्भव हैं।
    reason: lexical_alternative
  - marker: d
    text: ‘संगति’ यूनानी συνουσία का अनुवाद है, जिसका अर्थ साहचर्य, साथ होना, मेल-जोल, या कुछ सन्दर्भों में यौन-संयोग भी हो सकता है।
    reason: lexical_alternative
