- source_word: ⲡⲥⲱⲧⲙ
  choice: वह सुनना
  rationale: क्रिया-संज्ञा का असामान्य आत्मपरिचय और ‘वाणी’ के साथ काव्यात्मक समानांतरता बनाए रखी गई है।
