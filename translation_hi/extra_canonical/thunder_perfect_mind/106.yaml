  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और साधारण पाठक के लिए बोधगम्य शैली रखी गई है। स्रोत-समीक्षा के अनुसार आरम्भिक OCR ⲭⲓⲥⲃⲱ को ϫⲓⲥⲃⲱ मानकर ‘सीखो’ किया गया है। सभी दिए गए पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
