- source_word: ⲡϣⲁϫⲉ
  choice: वाणी
  rationale: ‘कथन/शब्द/वाणी’ में ‘वाणी’ काव्यात्मक गरिमा और श्रवण के साथ समानांतरता को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ⲙⲁϩⲧⲉ
  choice: पकड़
