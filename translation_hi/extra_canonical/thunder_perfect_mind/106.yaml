theological_decisions:
- issue: वक्ता के ‘मैं’ को सुनने और वाणी से एकरूप बताना
  choice: ‘मैं ही हूँ वह सुनना… मैं ही हूँ वह वाणी…’ के प्रत्यक्ष आत्मपरिचय को बनाए रखा
  alternative: इसे ‘मैं सुनती हूँ’ अथवा ‘मैं बोलती हूँ’ जैसे साधारण क्रियात्मक कथन में बदलना
  rationale: मूल का विरोधाभासी और रहस्यात्मक आत्मपरिचय जानबूझकर संज्ञात्मक है; उसे किसी व्यवस्थित धर्मवैज्ञानिक अर्थ में सरल नहीं किया गया।
- issue: ‘मेरी आत्माओं’ का असामान्य बहुवचन
  choice: बहुवचन को ज्यों का त्यों रखा
  alternative: ‘मेरी आत्मा’ या ‘अपने प्राण’
  rationale: समीक्षित कॉप्टिक विभाजन प्रथम पुरुष स्वत्वसूचक बहुवचन का समर्थन करता है; असामान्यता को मौन रूप से सामान्य नहीं किया गया।
