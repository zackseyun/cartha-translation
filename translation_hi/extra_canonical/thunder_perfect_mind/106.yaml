base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/106.yaml
  text: 'And learn from my souls.

    Those who know me — I am

    the hearing that is accessible to all [b];

    I am the speech that no one can grasp [c].[d]'
translation:
  language: hi
  text: 'और मेरी आत्माओं से सीखो।


    जो मुझे जानते हैं—मैं ही हूँ

    वह सुनना जो सबके लिए सुलभ है[a];

    मैं ही हूँ वह वाणी जिसे कोई पकड़ नहीं सकता[b]।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सुलभ’ के लिए आए कॉप्टिक शब्द का अर्थ ‘सामान्य’, ‘उपलब्ध’ या ‘उपयुक्त’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पकड़’ का अर्थ ‘थाम’ या ‘समझ’ भी हो सकता है; मूल में शारीरिक और बौद्धिक दोनों अर्थ सम्भव हैं।
    reason: lexical_alternative
  - marker: c
    text: इस अंश के अंत में कॉप्टिक में केवल ‘मैं ही हूँ’ आता है, जो सम्भवतः अगले आत्मपरिचय की शुरुआत है; उसका शेष कथन यहाँ उपलब्ध नहीं है।
    reason: alignment_note
