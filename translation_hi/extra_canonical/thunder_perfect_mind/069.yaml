base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/069.yaml
  text: 'I am the mind[1],

    and my rest.

    I am the knowledge of my seeking for myself,

    and the seeking of those who seek me,

    and the command of those who ask of me[c][b][a][5][4][3][2],

    and the voice of the voices of the place of the gods.'
translation:
  language: hi
  text: 'मैं ही मन[a] हूँ,


    और मेरा विश्राम।


    मैं ही स्वयं को खोजने का ज्ञान हूँ,


    और उन लोगों की खोज, जो मुझे खोजते हैं,


    और उन लोगों का आदेश, जो मुझसे याचना करते हैं,


    और देवताओं के स्थान की वाणियों की वाणी।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मन’ का अनुवाद ‘बुद्धि’ या ‘बोध-शक्ति’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम शब्द उपलब्ध पाठ में संक्षिप्त या अपूर्ण प्रतीत होता है। यहाँ उसे संभावित बहुवचन के आधार पर ‘देवताओं’ समझा गया है। ‘ईश्वर का स्थान’ या ‘दिव्य स्थान’ वैकल्पिक पाठगत व्याख्याएँ हैं, निश्चित अर्थ नहीं।
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲛⲟⲩⲥ
  choice: मन
  rationale: यह यूनानी νοῦς से आया शब्द है और मन अथवा बुद्धि-बोध की शक्ति को सूचित करता है। सामान्य पाठक के लिए ‘मन’ सहज है और मूल की व्यापकता बनाए रखता है।
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: मेरा विश्राम
  rationale: ⲧⲁ- प्रथम पुरुष एकवचन स्त्रीलिंग संबंधसूचक है; इसलिए ‘मेरा’, न कि ‘तुम्हारा’। यूनानी मूल ἀνάπαυσις के लिए ‘विश्राम’ स्वाभाविक और अर्थ-विस्तार को सुरक्षित रखने वाला विकल्प है।
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: ज्ञान
  rationale: यह संज्ञा जानने या ज्ञान को व्यक्त करती है; ‘ज्ञान’ मूल की अमूर्त और घोषणात्मक शैली बनाए रखता है।
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ-
  choice: खोजना
  rationale: समीक्षित पाठ में यह ‘जाति/प्रकार’ नहीं, बल्कि किसी के पीछे जाना या उसे खोजना है। ‘खोजना’ दोनों समानांतर पदों में पुनरावृत्ति सुरक्षित रखता है।
- source_word: ⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: आदेश
  rationale: यह मानक कॉप्टिक संज्ञा आज्ञा या आदेश को दर्शाती है; इसे ‘संगति’ जैसा कृत्रिम संयुक्त शब्द मानना उचित नहीं है।
- source_word: ⲁⲓⲧⲉⲓ
  choice: माँगना
  rationale: यह यूनानी मूल का क्रियापद माँगने या निवेदन करने के लिए है। ‘मुझसे माँगते हैं’ हिंदी में संबंध स्पष्ट रखता है।
- source_word: ⲧⲥⲙⲏ
  choice: वाणी
  rationale: मूल अर्थ ‘आवाज़/वाणी’ है, ‘नाम’ नहीं। काव्यात्मक उद्घोषणा में ‘वाणी’ गरिमामय और स्वाभाविक है।
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱ
  choice: देवताओं का स्थान
  rationale: अंतिम रूप संभवतः बहुवचन यूनानी θεῶν का संक्षिप्त या क्षतिग्रस्त रूप है। संदर्भानुकूल बहुवचन रखते हुए संबंधवाचक संरचना का अक्षरशः भार सुरक्षित किया गया है।
theological_decisions:
- issue: वक्ता का ‘मन’, ‘विश्राम’, ‘ज्ञान’, ‘खोज’, ‘आदेश’ और ‘वाणी’ से आत्म-सामीकरण
  choice: सभी ‘मैं ही…हूँ’ वाली घोषणाओं को एक ही आत्मपरिचय-श्रृंखला के रूप में रखा गया है।
  alternative: इन पदों को केवल वक्ता की संपत्तियाँ या कार्य मानना।
  rationale: कॉप्टिक की घोषणात्मक रचना पहचान और संबंध के बीच जानबूझकर तनाव रखती है; अनुवाद उसे किसी व्यवस्थित धार्मिक सिद्धांत में नहीं बदलता।
- issue: ⲛⲑⲉⲱ का वचन और आशय
  choice: देवताओं
  alternative: परमेश्वर / देवता / दिव्य स्थान
  rationale: उपलब्ध पाठ के संभावित θεῶν-पठन और नवीन स्रोत-समीक्षा के अनुसार बहुवचन चुना गया है, पर पाठगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, घोषणात्मक और गरिमामय लहजा रखा गया है। मूल की समानांतर पुनरावृत्ति को बचाने के लिए ‘खोज’, ‘आदेश’ और ‘वाणी’ की संज्ञात्मक संरचनाएँ बनाए रखी गई हैं। ‘मैं ही’ पहचान-सूचक बल को स्वाभाविक हिंदी में व्यक्त करता है; दूसरी पंक्ति में ‘भी’ से लुप्त क्रिया का सहज विस्तार मिलता है।
