translation:
  language: hi
  text: 'मैं वह हूँ जिसे शिक्षा नहीं मिली[a],


    और तुम मुझसे सीखते हो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “जिसे सिखाया नहीं गया” या “अशिक्षित” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: कॉप्टिक क्रियारूप का अनुवाद “तुम मुझसे सीखोगे” भी किया जा सकता है। उपलब्ध अंश का पंक्ति-संरेखण मध्यम विश्वास का है; OCR में ज्ञान/अज्ञान, लज्जा/निर्लज्जता और छोटापन से जुड़े शब्द भी हैं, जो सम्भवतः आस-पास की पंक्तियों के हैं और इसलिए यहाँ मुख्य पाठ में नहीं लिए गए।
    reason: textual_alignment_and_grammatical_alternative
