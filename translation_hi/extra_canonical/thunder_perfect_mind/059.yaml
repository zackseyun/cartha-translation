- source_word: ⲉⲧϩⲁⲉⲓⲏⲟⲩ
  choice: जिसे शिक्षा नहीं मिली
  rationale: यह सापेक्ष पद वक्ता को ऐसे व्यक्ति के रूप में प्रस्तुत करता है जिसे सिखाया नहीं गया। ‘अशिक्षित’ की तुलना में यह आधुनिक औपचारिक स्कूली शिक्षा के अनावश्यक संकेतों से बचते हुए विरोधाभास को स्पष्ट रखता है।
- source_word: ⲛⲧⲉⲧⲛⲧⲱⲡ
  choice: तुम ... सीखते हो
  rationale: द्वितीय पुरुष बहुवचन और सीखने के अर्थ को सुरक्षित रखा गया है। कॉप्टिक रूप भावी अथवा आशयात्मक अर्थ भी दे सकता है; प्रसंग के सूक्तिपरक विरोधाभास के कारण हिन्दी में सामान्य वर्तमान स्वाभाविक है।
- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: मुझसे
  rationale: सीखने की क्रिया के साथ यह स्रोत अथवा व्यक्ति को दर्शाता है; हिन्दी में ‘मुझसे सीखते हो’ इसका सहज और सटीक रूप है।
