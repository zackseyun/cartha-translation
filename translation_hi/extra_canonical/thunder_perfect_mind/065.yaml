  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सुबोध शैली रखी गई है। विरोधी युग्म—महानता/छोटाई, शाप/आदर, घायल करना/दया—को स्पष्ट पर अनिर्णीत रखा गया है। बहुवचन द्वितीय पुरुष के लिए स्वाभाविक ‘तुम’ प्रयुक्त है।
