- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: वे … जानते हैं
  rationale: इसे आदतन/सामान्य क्रिया-सूचक ⲉϣⲁⲩ- और क्रिया ⲥⲟⲩⲱⲛ के रूप में पढ़ा गया है, न कि ‘पुराना होना’ और आज्ञार्थक ‘जानो’ के रूप में।
- source_word: ⲉⲧⲕⲉ ⲟⲩ
