  text: 'greatness in parts from smallness[a].

    For they know smallness from greatness.

    Why do you curse me and honor me?

    You have wounded, and you have shown mercy.

    Do not cast out the first things[c][b],'
translation:
  language: hi
  text: 'छोटाई से निकले अंशों में महानता है।[a]

    क्योंकि वे महानता से छोटाई को जानते हैं।


    तुम मुझे शाप क्यों देते हो और मेरा आदर क्यों करते हो?

    तुमने घायल किया है, और तुमने दया दिखाई है।

    पहली बातों को बाहर मत निकालो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पहली पंक्ति खंडित और व्याकरण की दृष्टि से अनिश्चित है। इसका अधिक शाब्दिक रूप हो सकता है: “छोटाई से अंशों में महानता।”'
    reason: पाठ और वाक्य-विन्यास की अनिश्चितता
  - marker: b
    text: “पहली बातें” का अर्थ “आरंभिक वस्तुएँ” या “आदि की बातें” भी हो सकता है। “बाहर निकालो” के लिए उपलब्ध पाठ भी कुछ अनिश्चित है।
    reason: शब्दार्थ और OCR-पाठ की अनिश्चितता
