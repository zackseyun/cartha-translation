  text: '**5.** तुम छोटे लोगों के बीच मेरा तिरस्कार करते हो।[a] मैं मन हूँ, और मेरा विश्राम भी।[b] तुम मेरे कुल का ज्ञान हो।[c]'
  philosophy: optimal-equivalence
