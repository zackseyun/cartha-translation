  alternative: मेरा कुल / मेरा प्रकार / मेरी संतान
  rationale: γένος वंश, कुल, प्रकार या उद्गम-संबंध दर्शा सकता है। ‘जाति’ इस बहुअर्थता को अपेक्षाकृत सुरक्षित रखती है; इसे जैविक संतान या किसी विशिष्ट आध्यात्मिक वर्ग तक सीमित नहीं किया गया।
