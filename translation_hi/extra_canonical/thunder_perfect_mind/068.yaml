    text: 'या: ‘बुद्धि’; ‘नूस’। कॉप्टिक ⲡⲛⲟⲩⲥ यूनानी νοῦς से लिया गया है। शाब्दिक रूप से वाक्य है: ‘मैं मन हूँ, और मेरा विश्राम [भी]।’'
    reason: lexical_alternative
  - marker: c
    text: यह पंक्ति क्षतिग्रस्त OCR के बजाय समीक्षित पुनर्निर्माण ‘तुम मेरे कुल का ज्ञान हो’ पर आधारित है। ‘कुल’ के लिए ‘वंश’ या ‘प्रकार’ भी संभव हैं।
    reason: textual_restoration
