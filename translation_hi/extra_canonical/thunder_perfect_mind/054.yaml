base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/054.yaml
  text: 'I am she from whom you hide,[a]

    and you reveal me.

    But whenever you hide yourselves,[c][b]

    I myself will appear.'
translation:
  language: hi
  text: '**9.** मैं वह स्त्री हूँ जिससे तुम छिपते हो,


    और तुम मुझे प्रकट करते हो।


    पर जब कभी तुम अपने आप को छिपाते हो,


    मैं स्वयं प्रकट हो जाऊँगी।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम पद का अनुवाद “मैं अपने को प्रकट करूँगी” भी हो सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: उपलब्ध OCR अंश में इसके बाद अतिरिक्त, पूर्णतः सुनिश्चित न होने वाले पाठांश हैं। निम्न-विश्वास संरेखण के कारण यहाँ केवल इस स्पष्ट विरोधी-वाक्य संरचना का अनुवाद दिया गया है।
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲱⲡ
  choice: अपने को छिपाना
  rationale: इस प्रसंग में क्रिया का सामान्य अर्थ ‘छिपाना’ है। पहले वाक्य में ⲉⲣⲟⲉⲓ के साथ इसका स्वाभाविक आशय वक्ता से अपने को छिपाना है, और अगले वाक्य में स्पष्ट आत्मवाचक कर्म इसी अर्थ की पुष्टि करता है।
- source_word: ⲟⲩⲟⲛϩ / ⲟⲩⲟⲛϩⲧ
  choice: प्रकट करना / प्रकट हो जाना
  rationale: पहले प्रयोग में वक्ता कर्म है—‘तुम मुझे प्रकट करते हो’; बाद के आत्मवाचक प्रयोग में हिन्दी का स्वाभाविक रूप ‘मैं स्वयं प्रकट हो जाऊँगी’ है। दोनों में छिपने और प्रकट होने का मूल विरोध सुरक्षित रहता है।
- source_word: ⲧⲁ
  choice: मैं वह स्त्री हूँ
  rationale: कॉप्टिक रूप वक्ता को स्त्रीलिंग में प्रस्तुत करता है। हिन्दी में केवल ‘मैं वही हूँ’ कहने से यह व्याकरणिक संकेत लुप्त हो जाता, इसलिए ‘स्त्री’ को स्पष्ट किया गया है।
- source_word: ⲟⲩⲁⲛ ⲇⲉ … ϣⲁⲛ
  choice: पर जब कभी
  rationale: यहाँ पदसमूह शर्त/काल की पुनरावृत्त परिस्थिति व्यक्त करता है; इसे अंक ‘एक’ मानना संदर्भ और वाक्यरचना के विपरीत होगा।
theological_decisions:
- issue: वक्ता की स्त्रीलिंग पहचान
  choice: ‘मैं वह स्त्री हूँ’ द्वारा स्त्रीलिंग को स्पष्ट रखा गया
  alternative: ‘मैं वही हूँ’
  rationale: यह भाषिक संकेत स्रोत में उपस्थित है; इसे किसी विशिष्ट धर्मवैज्ञानिक पहचान या उपाधि में नहीं बदला गया।
- issue: अंतिम क्रिया का कर्तृवाचक अथवा आत्मवाचक स्वरूप
  choice: ‘मैं स्वयं प्रकट हो जाऊँगी’
  alternative: ‘मैं अपने को प्रकट करूँगी’
  rationale: कॉप्टिक आत्म-संदर्भ दोनों अर्थ-छायाओं की अनुमति देता है। हिन्दी में चुना गया रूप अधिक स्वाभाविक है और यह तय नहीं करता कि प्रकट होना केवल वक्ता की क्रिया है या उसकी दृश्य उपस्थिति।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छिपाना/प्रकट करना’ की विरोधी संरचना और वक्ता का स्त्रीलिंग स्वर सुरक्षित रखा गया है। कम-विश्वसनीय अंग्रेज़ी परामर्श-पाठ के ‘बिखेरना/एकत्र करना’ वाले पाठ को नहीं अपनाया गया, क्योंकि वह दिए गए कॉप्टिक अंश से मेल नहीं खाता।
