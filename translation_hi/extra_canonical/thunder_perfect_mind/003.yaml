  source_fidelity: The translation follows the corrected manuscript reading reflected in the audit trail rather than the demonstrably corrupt OCR. ‘मुझे अपनी दृष्टि से दूर मत फेंको’ adequately conveys the force of being cast out from the addressees’ face/sight. The final voice/hearing parallel remains deliberately unusual, as in the source.
  naturalness: The address, imperative, and poetic register are natural modern literary Hindi. However, ‘न अपने सुनने को’ is syntactically incomplete and sounds unnatural as a Hindi parallel. ‘और अपने श्रवण को भी नहीं’ makes the ellipsis intelligible while preserving the source’s striking personification.
  terminology: ‘हे सुननेवालो’ and ‘मेरी सुनो’ preserve the vocative repetition effectively. ‘बाट जोहते हो’ is a suitable literary rendering of waiting/expecting, with the lexical alternative properly noted. ‘वाणी’ and ‘श्रवण’ maintain a dignified poetic register.
  issues:
