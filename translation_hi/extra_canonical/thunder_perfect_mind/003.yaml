base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/003.yaml
  text: 'And you hearers, listen to me.

    You who wait for me, take me to yourselves,

    and do not cast me from your sight,

    and do not let your voice hate me, nor your hearing.'
translation:
  language: hi
  text: 'और हे सुननेवालो, मेरी सुनो।


    तुम जो मेरी बाट जोहते हो,[a] मुझे अपना लो,


    और मुझे अपनी दृष्टि से दूर मत फेंको;


    अपनी वाणी को मुझसे घृणा न करने दो, और अपने श्रवण को भी नहीं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस शब्द का अर्थ “प्रतीक्षा करना/आशा रखना” भी हो सकता है और “लालसा करना” भी। यहाँ “बाट जोहना” प्रत्याशा के भाव को सामने रखता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम पद का पाठ खंडित और कुछ अनिश्चित है। उसका आशय “तुम्हारा सुनना” या “तुम्हारा कान” हो सकता है; अनुवाद उसकी असामान्य समानांतर रचना को बनाए रखता है।
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ / ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: हे सुननेवालो, मेरी सुनो
  rationale: कर्ता-संज्ञा और आज्ञार्थक क्रिया की पुनरुक्ति को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ⲧⲟϣⲧ
  choice: बाट जोहते हो
  rationale: प्रतीक्षा और प्रत्याशा दोनों का भाव देता है; अभिलाषा का संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: मुझे अपना लो
  rationale: वक्ता को अपने पास ग्रहण करने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: ⲙⲡⲣⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲙ ⲡⲉⲧⲛϩⲟ
  choice: मुझे अपनी दृष्टि से दूर मत फेंको
  rationale: सुधारे गए पांडुलिपि-पाठ के ‘अपने मुख/दृष्टि से बाहर मत फेंको’ को रूपकात्मक कठोरता सहित प्रस्तुत करता है।
- source_word: ⲙⲡⲣⲧⲣⲉⲡⲉⲧⲛϩⲣⲟⲟⲩ ⲙⲥⲧⲱⲉⲓ
  choice: अपनी वाणी को मुझसे घृणा न करने दो
  rationale: कारक रचना और असामान्य मानवीकरण को सरल किए बिना सुरक्षित रखता है।
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: अपने सुनने को
  rationale: खंडित अंतिम समानांतर पद की अस्पष्टता को ‘कान’ कहकर अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: वक्ता को ग्रहण करने की भाषा
  choice: मुझे अपना लो
  alternative: मुझे गले लगा लो
  rationale: मूल क्रिया ग्रहण/स्वीकार करने का व्यापक भाव रखती है; ‘गले लगाना’ शारीरिक अर्थ को आवश्यकता से अधिक निश्चित कर सकता है।
- issue: वाणी और श्रवण का मानवीकरण
  choice: शाब्दिक तनाव बनाए रखा गया
  alternative: मेरे प्रति घृणापूर्ण बातें मत कहो और मेरी बात अनसुनी मत करो
  rationale: वैकल्पिक रूप अर्थ की व्याख्या कर देता, जबकि स्रोत की काव्यात्मक और कुछ असामान्य रचना को सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, संबोधनात्मक और गरिमापूर्ण शैली। ‘बाट जोहना’ सामान्यतः बोधगम्य साहित्यिक मुहावरा है। पाठ में उपलब्ध सुधारे हुए पांडुलिपि-साक्ष्य को त्रुटिपूर्ण OCR से अधिक महत्त्व दिया गया है; अंतिम खंड की अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
