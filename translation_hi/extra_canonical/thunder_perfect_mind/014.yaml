  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। बार-बार आने वाले ‘मैं … हूँ’ ढाँचे तथा संबंधसूचक विरोधाभासों को सुरक्षित रखा गया है। ‘स्त्री’, ‘माँ’, ‘पिता’, ‘पति’, ‘बेटी’ और ‘संतान’ जैसे साधारण, सर्वबोध्य शब्द चुने गए हैं; पाठगत अनिश्चितताएँ मुख्य पाठ में चुपचाप हल करने के बजाय पादटिप्पणियों में दी गई हैं।
