base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/014.yaml
  text: 'I am the daughter and the woman[a].

    I am the mother of my father

    and the daughter of my husband[d][c][b],

    and he is my offspring.'
translation:
  language: hi
  text: 'मैं बेटी और स्त्री[a] हूँ।


    मैं अपने पिता की माँ हूँ


    और अपने पति की बेटी[b] हूँ,


    और वह मेरी संतान है[c]।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक ⲥϩⲓⲙⲉ का अर्थ ‘पत्नी’ भी हो सकता है। यहाँ ‘स्त्री’ रखा गया है ताकि शब्द का व्यापक अर्थ और ‘बेटी’ के साथ उसका तीखा जोड़ बना रहे।
    reason: lexical_alternative
  - marker: b
    text: इस स्थान पर कुछ संस्करणों या पाठों में ‘अपने पति की बहन’ पढ़ा जाता है, न कि ‘अपने पति की बेटी’। उपलब्ध OCR में ⲧⲥⲱⲛⲉ (‘बेटी’) पढ़ाई देता है, पर अक्षरों के आकार के कारण भ्रम संभव है।
    reason: textual_variant
  - marker: c
    text: ‘वह मेरी संतान है’ इस अंश की प्रचलित Thunder-पाठ-परंपरा का अनुसरण करता है और निकटवर्ती संबंध-श्रृंखला से मेल खाता है। उपलब्ध OCR में शब्द अनिश्चित है; यदि क्षतिग्रस्त शब्द वास्तव में ⲡⲁϫⲟⲉⲓⲥ हो, तो अर्थ होगा, ‘वह मेरा प्रभु है।’
    reason: alternative_reading
  - marker: d
    text: 'इसके बाद एक अधूरी अर्ध-पंक्ति आरम्भ होती है: ‘मैं अपने … का अपमान/दीनता हूँ’ (ⲁⲛⲟⲕ ⲧⲉ ⲧϩⲙϩⲁⲗ ⲛⲧⲉ ⲡⲁ—)। अनुमान से रिक्त स्थान भरने से बचने के लिए इसे मुख्य पाठ में अनूदित नहीं किया गया।'
    reason: alignment_note
