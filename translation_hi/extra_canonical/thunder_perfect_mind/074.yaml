review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly rejects the earlier audit trail’s misreadings: ⲛⲓϩⲓⲟⲙⲉ is ‘women,’ not ‘poor’; ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ denotes the honored one; and the following two feminine relative expressions mean the one whom they praise and the one whom they despise in scorn. The opening is an incomplete, syntactically difficult excerpt, so its connection to preceding material should remain explicitly qualified. ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ is best retained simply as ‘who are within,’ without supplying ‘heart.’'
  naturalness: ‘वे स्त्रियाँ जो भीतर रहती हैं’ can suggest physical residence and is less parallel to the existential wording of the Coptic. ‘जो स्त्रियाँ भीतर हैं’ is more idiomatic and preserves the ambiguity. The rest is clear, dignified Hindi. ‘आदर पानेवाली’ is understandable, but ‘सम्मानित’ is the more direct and natural rendering of ‘honored.’
  terminology: ‘स्तुति’ and ‘तिरस्कार’ suitably preserve the elevated, paradoxical register. The feminine identity is retained by the feminine noun ‘स्त्री’ in the predicate ‘सम्मानित स्त्री’; this is needed because Hindi ‘सम्मानित’ itself does not visibly mark gender.
  issues:
  - severity: low
    issue: The phrase ‘जो भीतर रहती हैं’ over-specifies the existential/locative phrase.
    rationale: The Coptic says that the women ‘are/exist within’; it does not necessarily say that they live or reside there.
  - severity: low
    issue: ‘आदर पानेवाली’ is slightly less direct than the source’s designation ‘the honored one.’
    rationale: It can sound like a person who is to receive honor, whereas the source presents the speaker as honored.
