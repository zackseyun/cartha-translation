  yaml_path: translation/extra_canonical/thunder_perfect_mind/074.yaml
  text: 'those who exist with me[a], and the poor.

    What is within, in the heart—I am she.

    I am the honored one,

    and the one whom they praise,

    and the one whom they despise in scorn[e][d][c][b].

    I am'
translation:
  language: hi
  text: 'जो मेरे साथ हैं, और जो स्त्रियाँ भीतर हैं[a]।


    मैं ही वह सम्मानित स्त्री हूँ,


    और मैं ही वह हूँ जिसकी वे स्तुति करते हैं,


    और मैं ही वह हूँ जिसे वे तिरस्कार से नीचा समझते हैं।


    मैं हूँ—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंश वाक्य या विचार के बीच से आरंभ होता जान पड़ता है। आरंभिक पदों का अर्थ संभवतः ‘जो मेरे साथ हैं, और जो स्त्रियाँ भीतर हैं’ है; उनका व्याकरणिक संबंध पिछले, यहाँ अनुपलब्ध पाठ से हो सकता है।
    reason: alignment_note
lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: जो मेरे साथ हैं
  rationale: आरंभिक ϣⲟⲟⲡ को अस्तित्व/स्थिति के अर्थ में लिया गया है, आज्ञार्थक ‘मेरे साथ उपस्थित रहो’ के रूप में नहीं; अंश संभवतः पिछले वाक्य से जारी है।
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: स्त्रियाँ
  rationale: यह कॉप्टिक बहुवचन ‘स्त्रियाँ’ है; इसे मिलते-जुलते किंतु अलग शब्द ‘गरीब’ के रूप में पढ़ना उचित नहीं।
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: जो भीतर रहती हैं
  rationale: संबंधवाचक उपवाक्य और स्थानवाचक ‘भीतर’ को सीधे रखा गया है; यहाँ ‘हृदय में’ जोड़ना आवश्यक नहीं।
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: मैं ही आदर पानेवाली हूँ
  rationale: स्त्रीलिंग आत्मवाचक सूत्र और ‘आदरित/सम्मानित’ होने का भाव दोनों सुरक्षित हैं।
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: मैं ही वह हूँ जिसकी वे स्तुति करते हैं
  rationale: ⲥⲙⲟⲩ का अर्थ यहाँ ‘स्तुति करना’ लिया गया है; यह आगे के ‘नीचा समझना’ के साथ जानबूझकर विरोध रचता है।
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ ϩⲛ ⲟⲩϣⲱⲥ
  choice: मैं ही वह हूँ जिसे वे तिरस्कार से नीचा समझते हैं
  rationale: यूनानी मूल के क्रियापद का अर्थ ‘नीचा समझना/तिरस्कार करना’ है और ϩⲛ ⲟⲩϣⲱⲥ रीति सूचित करता है; इसे ‘एक आवाज़ में’ नहीं लिया गया।
- source_word: ⲁⲛⲟⲕ
  choice: मैं हूँ—
  rationale: अंश के अंत का अधूरा आत्म-घोषणात्मक सूत्र बनाए रखने के लिए डैश लगाया गया है।
theological_decisions:
- issue: वक्ता का स्त्रीलिंग आत्म-परिचय
  choice: स्त्रीलिंग रूप ‘आदर पानेवाली’ रखा गया
  alternative: लिंग-निरपेक्ष ‘सम्मानित जन’
  rationale: कॉप्टिक में स्त्रीलिंग सर्वनाम और संबंधसूचक रूप स्पष्ट हैं; उन्हें तटस्थ करना मूल की वाणी को बदल देता।
- issue: स्तुति और तिरस्कार का विरोधाभास
  choice: दोनों कथनों को एक ही ‘मैं’ के समांतर दावों के रूप में रखा गया
  alternative: दो अलग व्यक्तियों या समूहों से जोड़ना
  rationale: मूल रचना का जानबूझकर रखा गया विरोध और धार्मिक तनाव बिना व्याख्यात्मक समाधान के सुरक्षित रहना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; वक्ता का स्त्रीलिंग स्पष्ट रखा गया है। समानांतर ‘मैं ही…’ संरचना मूल के घोषणात्मक लय और विरोधाभास को सामने लाती है।
