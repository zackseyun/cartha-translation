base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/005.yaml
  text: Be watchful,[1] and as for your hearing, do not be deaf to me in any place or in any other thought[2]; and do not be ignorant of me. For I am the first[a][2], and I am the last.
translation:
  language: hi
  text: '**5.** सावधान रहो,[a] और जहाँ तक तुम्हारे सुनने की बात है, किसी भी स्थान पर या किसी दूसरे विचार में मेरे प्रति बहरे न बनो;[b] और मुझसे अनजान न रहो। क्योंकि मैं पहली हूँ, और मैं अंतिम हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “चौकन्ने रहो”; “ध्यान दो।”'
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध पंक्तियों के साथ इस उपवाक्य का स्थान पूरी तरह निश्चित नहीं है; कुछ संपादन इसे पहले या अगले उपदेश से जोड़ सकते हैं।
    reason: alignment_note
lexical_decisions:
- source_word: ⲧⲱⲉⲓ
  choice: सावधान रहो
  rationale: आज्ञार्थक क्रिया जागरूकता और चौकसी का आह्वान करती है; यह चयन आधुनिक हिन्दी में स्वाभाविक रहते हुए चेतावनी का स्वर बनाए रखता है।
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: जहाँ तक तुम्हारे सुनने की बात है
  rationale: रूप का अर्थ ‘तुम्हारा सुनना’ है, ‘तुम जो सुनते हो’ नहीं; हिन्दी में विषय-प्रस्तावक वाक्यांश से इस असामान्य संज्ञात्मक रचना को स्पष्ट रखा गया है।
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ
  choice: बहरे न बनो
  rationale: निषेधात्मक आज्ञा का भाव ‘न सुननेवाले/बहरे न बनो’ है; इसे सकारात्मक ‘मेरी सुनो’ में बदलने के बजाय स्रोत की नकारात्मक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ⲕⲁⲧⲁ ⲙⲁ
  choice: किसी भी स्थान पर
  rationale: यहाँ पदबंध स्थानगत व्यापकता व्यक्त करता है; शाब्दिक ‘स्थान के अनुसार’ की अपेक्षा ‘किसी भी स्थान पर’ प्रसंगानुकूल है।
- source_word: ⲛⲕⲉⲟⲩⲙⲉⲩⲉ
  choice: किसी दूसरे विचार में
  rationale: ⲟⲩⲙⲉⲩⲉ का मूल भाव विचार/मत है और ⲕⲉ अन्यता दर्शाता है; स्रोत की जानबूझकर असामान्य अभिव्यक्ति को सरल व्याख्या में नहीं बदला गया।
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: मुझसे अनजान न रहो
  rationale: निषेधात्मक आज्ञा और ‘जानना’ क्रिया को स्वाभाविक हिन्दी में व्यक्त करते हुए अज्ञान की कड़ी चेतावनी बनाए रखी गई है।
- source_word: ⲧϣⲟⲣⲡ … ⲑⲁⲉ
  choice: पहली … अंतिम
  rationale: ‘प्रथम/अंतिम’ की समांतर जोड़ी को सुरक्षित रखा गया है; कॉप्टिक का स्त्रीलिंग विधेय और वक्ता की स्त्रीलिंग आत्म-पहचान हिन्दी के ‘पहली हूँ/अंतिम हूँ’ में प्रकट होती है।
theological_decisions:
- issue: वक्ता की व्याकरणिक लैंगिक पहचान
  choice: ‘मैं पहली हूँ … मैं अंतिम हूँ’ में स्त्रीलिंग रखा गया
  alternative: लिंग-अस्पष्ट ‘मैं आदि और अंत हूँ’ या पुल्लिंग ‘प्रथम’
  rationale: कॉप्टिक में स्त्रीलिंग संयोजक और स्त्रीलिंग निश्चित पद वक्ता को स्त्रीलिंग में प्रस्तुत करते हैं; इसे धर्मवैचारिक रूप से निष्प्रभावी करने के बजाय स्रोत का रूप सुरक्षित रखा गया है।
- issue: ‘दूसरे विचार में’ का अर्थ
  choice: अस्पष्ट स्थानिक/मानसिक रूपक को यथावत रखा गया
  alternative: ‘किसी दूसरी धारणा के कारण मेरी उपेक्षा न करो’ जैसी व्याख्यात्मक भाषा
  rationale: स्रोत स्थान और विचार को समानांतर रखता है; स्पष्ट कारणात्मक अर्थ जोड़ना वास्तविक काव्यात्मक और अर्थगत तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। आज्ञाओं की काव्यात्मक लय बनाए रखने के लिए छोटे समन्वित उपवाक्य प्रयुक्त हुए हैं। ‘किसी दूसरे विचार में’ की असामान्यता जानबूझकर सुरक्षित है, और स्त्रीलिंग आत्म-घोषणा स्रोत-व्याकरण के अनुसार स्पष्ट की गई है।
