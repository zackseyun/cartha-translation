  yaml_path: translation/extra_canonical/thunder_perfect_mind/087.yaml
  text: 'I am the hearing that is acceptable to everyone[a],

    and I am the speech that is [to be spoken][b].

    Believe them: I am your [call][c] for speaking, and great is

    the silence of speech—listen to me in anger[a][d][c][b], and of [...] [d]'
translation:
  language: hi
  text: '**3.** मैं वह श्रवण हूँ जो सबको स्वीकार्य है[a],


    और मैं वह वाणी हूँ जिसे [बोला जाना है][b]।


    उन पर विश्वास करो। मैं बोलने के लिए तुम्हारी [पुकार][c] हूँ,


    और वाणी का मौन महान है। क्रोध में मेरी सुनो,


    और [...] का[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्वीकार्य’ के स्थान पर संभवतः ‘सब प्राणियों में प्रथम’ भी पढ़ा जा सकता है। कॉप्टिक रूप और वाक्य-संबंध दोनों व्याख्याओं की गुंजाइश देते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ कॉप्टिक OCR-पाठ अनिश्चित है। यदि क्रिया ‘माँगना/पूछना’ है, तो अर्थ ‘वह वाणी जिसकी माँग की जाती है’ हो सकता है।
    reason: textual_uncertainty
  - marker: c
    text: यहाँ पढ़ा गया कॉप्टिक रूप अस्पष्ट या भ्रष्ट है। ‘पुकार’ विषयानुकूल अनुमान है; ‘तुम्हारा कान’ या ‘तुम्हारी आवाज़’ जैसे पाठ भी प्रस्तावित किए जा सकते हैं।
    reason: textual_uncertainty
  - marker: d
    text: उपलब्ध अंश ⲛⲧⲉ पर समाप्त होता है और रचना अगले अनुपलब्ध शब्दों में जारी रहती है; इसलिए वाक्य जानबूझकर अधूरा छोड़ा गया है।
    reason: fragment_boundary
