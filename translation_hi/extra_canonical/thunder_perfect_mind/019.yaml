base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/019.yaml
  text: I am the voice whose sound is manifold[a], and the word whose appearance is manifold. I am the utterance of my name. Why, you who hate me, do you love me[g][f][e][d][c][b], and hate those who love me?
translation:
  language: hi
  text: '**14.** मैं वह वाणी हूँ जिसकी ध्वनि अनेक प्रकार की है, और वह वचन[a] हूँ जिसका रूप अनेक प्रकार का है।[b] मैं अपने नाम का उच्चारण हूँ। मुझसे घृणा करनेवालो, तुम मुझसे प्रेम क्यों करते हो, और जो मुझसे प्रेम करते हैं उनसे घृणा क्यों करते हो?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी मूल का ⲡⲗⲟⲅⲟⲥ ‘लोगोस’ भी लिखा जा सकता है; यहाँ इसका अनुवाद “वचन” किया गया है।
    reason: lexical_alternative
  - marker: b
    text: 'दोनों जगह प्रयुक्त अभिव्यक्ति बहुलता या विविधता बताती है: वाणी की ध्वनि अनेक प्रकार की है और वचन का रूप भी अनेक प्रकार का।'
    reason: ambiguity_note
lexical_decisions:
- source_word: ⲧⲉⲥⲙⲏ
  choice: वाणी
  rationale: यहाँ ⲥⲙⲏ का सामान्य अर्थ ‘आवाज़/वाणी’ है। स्त्री-वक्ता की काव्यात्मक आत्मघोषणा में ‘वाणी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: जिसकी ध्वनि अनेक प्रकार की है
  rationale: यह पदबंध ध्वनि की बहुलता या विविधता बताता है; इसे आयु अथवा ‘दिन’ से जोड़ना OCR-आधारित गलत विश्लेषण होगा।
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: वचन
  rationale: यूनानी आगत शब्द Logos के अर्थ और दार्शनिक-धार्मिक अनुनाद को हिंदी में ‘वचन’ पर्याप्त रूप से रखता है; केवल लिप्यंतरण साधारण पाठक के लिए कम स्पष्ट होता।
- source_word: ⲛⲁϣⲉ ⲡⲉϥⲉⲓⲛⲉ
  choice: जिसका रूप अनेक प्रकार का है
  rationale: यहाँ ⲉⲓⲛⲉ ‘रूप/दिखावट’ है और ⲛⲁϣⲉ बहुलता व्यक्त करता है; इसे ‘इच्छा पूरी होगी’ नहीं समझना चाहिए।
- source_word: ⲡϣⲁϫⲉ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: अपने नाम का उच्चारण
  rationale: शाब्दिक भाव ‘मेरे नाम का कथन/उच्चारण’ है। ‘उच्चारण’ वाणी और वचन की निकटवर्ती ध्वनि-छवि को बनाए रखता है।
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: क्यों
  rationale: यह स्पष्ट प्रश्नवाचक पदबंध है, ‘के कारण’ नहीं।
- source_word: ⲙⲟⲥⲧⲉ / ⲙⲉ
  choice: घृणा करना / प्रेम करना
  rationale: दोनों विरोधी क्रियाओं की तीखी और जानबूझकर रखी गई विडंबना को सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: Logos का अनुवाद
  choice: वचन
  alternative: लोगोस / शब्द
  rationale: ‘वचन’ Logos की वैचारिक गूँज बचाते हुए आधुनिक हिंदी पाठक के लिए बोधगम्य है। इसे किसी विशिष्ट सांप्रदायिक अर्थ तक सीमित नहीं किया गया।
- issue: प्रेम और घृणा का विरोधाभास
  choice: प्रश्न को बिना व्याख्यात्मक समाधान के ज्यों का त्यों रखा गया
  alternative: इसे अस्थिरता, पाखंड या किसी विशेष रहस्यवादी सिद्धांत की व्याख्या मानना
  rationale: मूल पाठ श्रोताओं के प्रेम और घृणा के विरोधाभास को प्रस्तुत करता है, पर उसका कारण स्पष्ट नहीं करता; इसलिए तनाव को खुला रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सहज रखी गई है। स्त्री-वक्ता के कारण ‘वह वाणी हूँ’ स्वाभाविक है। OCR अंश के आरंभ का टूटा हुआ पाठ पिछली पंक्ति का अवशेष जान पड़ता है, इसलिए उसे इस खंड में अलग वाक्य बनाकर नहीं जोड़ा गया।
