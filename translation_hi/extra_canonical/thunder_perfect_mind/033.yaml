base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/033.yaml
  text: 'Look at me as I come forth among those who are honored[1];

    and in the least places you will find me.

    And do not cast me out among those who are destitute in worthlessness[d][c][b][a][5][4][3][2];

    for I—I am compassionate.'
translation:
  language: hi
  text: 'मेरी ओर देखो, जब मैं सम्मानित लोगों के बीच से निकलकर आती हूँ;

    और सबसे तुच्छ स्थानों में तुम मुझे पाओगे।

    और उन लोगों के बीच से मुझे बाहर न फेंको जो निकम्मेपन में अभावग्रस्त हैं;

    क्योंकि मैं—मैं करुणामयी हूँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: सम्मानित लोग
  rationale: पंक्ति-विभाजन से पुनर्निर्मित रूप का अर्थ ‘वे जो सम्मानित हैं’ है; यह आगे के ‘सबसे तुच्छ स्थानों’ के साथ काव्यात्मक विरोध बनाए रखता है।
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: सबसे तुच्छ स्थान
  rationale: यूनानी मूल के शब्दों का शाब्दिक भाव ‘सबसे छोटे/निम्न स्थान’ है; ‘तुच्छ’ सामाजिक अवमानना और स्थानगत निम्नता दोनों को खुला रखता है।
- source_word: ⲛ̄ⲧⲉⲧⲛϭⲓⲛⲉ ⲙ̄ⲙⲟⲓ (OCR में विकृत)
  choice: तुम मुझे पाओगे
  rationale: प्राप्त OCR के कठिन अंश के संभावित पांडुलिपीय पाठ का स्वाभाविक अर्थ ‘तुम मुझे पाओगे’ है; ‘घर/देखना’ वाला विश्लेषण संभवतः OCR से उत्पन्न कृत्रिम पाठ है।
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: मुझे बाहर न फेंको
  rationale: यह निषेधात्मक क्रिया, प्रथम पुरुष कर्म-चिह्न और ‘बाहर’ के साथ ‘मुझे बाहर मत फेंको’ का अर्थ देती है, न कि ‘अपने को ऊँचा मत उठाओ’।
- source_word: ⲛⲉⲧϣⲁⲁⲧ
  choice: जो अभावग्रस्त हैं
  rationale: यहाँ रूप को ‘कमी होना/वंचित होना’ से समझना संदर्भतः उचित है; ‘रौंदना’ वाला अर्थ अस्वीकार किया गया है।
- source_word: ⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: निकम्मापन
  rationale: यूनानी ἀχρήστ- से बना भाववाचक शब्द अनुपयोगिता या निकम्मेपन को व्यक्त करता है; हिन्दी में ‘निकम्मापन’ सामान्य और मूल्यांकनात्मक दोनों है।
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: करुणामयी
  rationale: मानक कॉप्टिक शब्द का अर्थ ‘दयालु/करुणामय’ है। वक्ता स्त्रीलिंग रूप में बोलती है, इसलिए ‘करुणामयी’ चुना गया है।
theological_decisions:
- issue: वक्ता की करुणा और सामाजिक निम्नता का विरोधाभास
  choice: विरोधाभास को बिना व्याख्यात्मक समाधान के बनाए रखा गया
  alternative: वक्ता को किसी विशिष्ट धर्मशास्त्रीय सत्ता के रूप में पहचानना
  rationale: अंश स्वयं वक्ता की निश्चित पहचान नहीं बताता; किसी संप्रदायगत या निजी व्याख्या को पाठ में जोड़ना अनुचित होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। स्त्री वक्ता के कारण ‘आती हूँ’ और ‘करुणामयी’ प्रयुक्त हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में संशोधित स्रोत-पठन को सीधे और स्पष्ट रूप से व्यक्त किया जा सकता है।
