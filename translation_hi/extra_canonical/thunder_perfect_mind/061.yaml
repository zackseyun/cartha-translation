- source_word: ϩⲟⲩⲛ ⲉⲣⲱⲧⲛ
  choice: तुम्हारे सामने
  rationale: OCR में स्पष्ट सर्वनाम ⲉⲣⲱⲧⲛ ‘तुम्हारी ओर/तुम्हारे लिए’ है। इसलिए परंपरागत ‘मेरे सामने’ के बजाय स्रोत-दृश्य साक्ष्य के अनुसार ‘तुम्हारे सामने’ चुना गया है।
- source_word: '[concealment motif; no clear lexeme in excerpt]'
  choice: तुमने अपने आपको छिपाया
  rationale: ‘छिपाने’ की क्रिया इस OCR अंश में स्पष्ट नहीं है, पर परामर्श-पाठ और स्थापित विरोधी युग्म में उपस्थित है। आत्मवाचक रूप कथन की संरचना को स्वाभाविक हिन्दी में रखता है।
