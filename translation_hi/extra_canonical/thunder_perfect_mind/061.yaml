translation:
  language: hi
  text: मैं वही हूँ जिससे तुमने अपने आपको छिपाया[b], और मैं तुम्हारे सामने प्रकट होती हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध OCR में सर्वनाम ⲉⲣⲱⲧⲛ का अर्थ ‘तुम्हारी ओर/तुम्हारे सामने’ है; इसलिए यहाँ ‘मैं तुम्हारे सामने प्रकट होती हूँ’ अनूदित है। प्रचलित खंड-विभाजन में इसके बजाय ‘तुम मेरे सामने प्रकट होते हो’ भी मिलता है।
    reason: alternative_reading
  - marker: b
    text: इस OCR अंश में ‘छिपाने’ की क्रिया स्पष्ट दिखाई नहीं देती। पास का पाठ ‘तुम्हारे भीतर के मेरे अंगों’ की बात करता है; इसलिए सम्भव है कि आस-पास की पंक्तियाँ इस खंड में मिल गई हों।
    reason: alignment_note
