translation:
  language: hi
  text: '**8.** मैं दाई और माँ हूँ।[a]


    मैं कुँवारी[b] और स्त्री हूँ।


    मैं अपने पिता की माँ हूँ, और मेरे [—] की कुँवारी हूँ[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अंग्रेज़ी संस्करण यहाँ अर्थ देते हैं, “मैं दाई और वह हूँ जो जन्म नहीं देती।” पर उपलब्ध कॉप्टिक पाठ में ⲧⲙⲁⲁⲩ, अर्थात् “माँ,” है; इसलिए यहाँ “दाई और माँ” रखा गया है।
    reason: alignment_note
  - marker: b
    text: ⲥⲱⲛⲉ का अनुवाद “कुमारी” भी किया जा सकता है। यहाँ “कुँवारी” अगले शब्द “स्त्री” के साथ विरोध को उभारता है।
    reason: lexical_alternative
  - marker: c
    text: उपलब्ध अंश ⲙⲡⲁ—, अर्थात् “मेरे … के/की,” के बाद टूट जाता है। इसलिए अधूरे पद को बिना अनुमान लगाए [—] से दिखाया गया है।
    reason: textual_variant
