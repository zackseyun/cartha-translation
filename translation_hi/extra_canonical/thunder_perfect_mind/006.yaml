  rationale: कॉप्टिक में प्रथम पुरुष की स्पष्ट आत्म-पहचान है; हिन्दी का ‘मैं … हूँ’ उसी उद्घोषात्मक लय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲧϣⲟⲣⲡ
  choice: प्रथम
  rationale: यहाँ शब्द पहचान-सूचक उपाधि के रूप में प्रयुक्त है। ‘प्रथम’ अगले पद ‘अंतिम’ के साथ संतुलित और गरिमापूर्ण युग्म बनाता है।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: यह विरोधी किन्तु परस्पर संबद्ध उपाधियों को जोड़ने वाला सामान्य समुच्चयबोधक है।
- source_word: ⲑⲁⲉ
  choice: अंतिम
  rationale: शब्द का अर्थ ‘अंत’ अथवा ‘अंतिम’ हो सकता है; ⲧϣⲟⲣⲡ के समानांतर पहचान-सूचक प्रयोग में ‘अंतिम’ संतुलन बनाए रखता है।
theological_decisions:
- issue: ‘प्रथम और अंतिम’ आत्म-पहचान सूत्र
  choice: सूत्र को बिना व्याख्यात्मक विस्तार के यथावत रखा गया है।
  alternative: इसे ‘आरम्भ और अंत’ के रूप में अर्थ-विस्तार देना।
  rationale: मूल पाठ की समांतर उपाधियों और उनकी धार्मिक-साहित्यिक प्रतिध्वनि को सुरक्षित रखते हुए किसी विशिष्ट धर्मवैज्ञानिक पहचान को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और उद्घोषात्मक शैली रखी गई है। ‘प्रथम’ और ‘अंतिम’ का तत्सम युग्म मूल की सममिति तथा उपाधिसूचक लय को स्वाभाविक ढंग से सुरक्षित रखता है।
