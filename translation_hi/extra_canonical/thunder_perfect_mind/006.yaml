lexical_decisions:
- source_word: ⲅⲁⲣ
  choice: क्योंकि
  rationale: यह कारणसूचक अव्यय पिछले कथन का आधार बताता है; ‘क्योंकि’ मूल संवाद-प्रवाह को बनाए रखता है।
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
