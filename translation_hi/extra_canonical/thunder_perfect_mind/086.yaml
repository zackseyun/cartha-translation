  yaml_path: translation/extra_canonical/thunder_perfect_mind/086.yaml
  text: '...of the nature that exists within me[a]. I am the hearing that is attainable to everyone, and the speech that cannot be grasped[f][e][d][c][b]. I am the call.'
translation:
  language: hi
  text: '**2.** …उस हृदय का, जो मेरे भीतर है।[a] मैं वह श्रवण हूँ जो सबकी पहुँच में है, और वह वाणी हूँ जिसे पकड़ा नहीं जा सकता।[b] मैं पुकार हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त OCR में यह पद विकृत है। संभावित पांडुलिपीय पाठ का अर्थ “हृदय का” है; इसे “स्वभाव का” भी पढ़ा गया है, पर वह पाठ कम संभावित है। वाक्य का आरंभ पिछले अंश में है।
    reason: textual_uncertainty
  - marker: b
    text: इस वाक्यांश का OCR अत्यंत विकृत है। पुनर्निर्मित पाठ का संभावित अर्थ है “जिसे पकड़ा नहीं जा सकता”; अर्थात वाणी को ग्रहण या वश में नहीं किया जा सकता।
    reason: textual_uncertainty
