- issue: वक्ता के स्त्रीलिंग स्वर की अभिव्यक्ति
  choice: ‘होती हूँ’ द्वारा स्त्रीलिंग वक्ता
  alternative: लिंग-अचिह्नित या पुल्लिंग ‘होता हूँ’
  rationale: रचना की आत्म-प्रस्तुति और शीर्षकीय स्त्री-स्वर के अनुरूप हिंदी में वक्ता का स्त्रीलिंग बनाए रखा गया है; यह किसी सांप्रदायिक पहचान का आरोपण नहीं करता।
- issue: निकटता और ज्ञान का विरोधाभास
  choice: विरोधाभास को बिना व्याख्यात्मक समाधान के यथावत रखा
  alternative: निकट/दूर को केवल आध्यात्मिक या नैतिक अर्थ देकर स्पष्ट करना
  rationale: मूल की काव्यात्मक और धर्मवैचारिक तनावपूर्ण समानांतरता वास्तविक है; अनुवाद उसे किसी एक सिद्धांत में सीमित नहीं करता।
- issue: ‘मेरे अस्तित्व में’ का तात्पर्य
  choice: अस्तित्वगत भाषा को खुला रखा
  alternative: ‘मेरे समुदाय में’ या ‘मेरे शरीर में’
  rationale: OCR और संदर्भ किसी एक ठोस व्याख्या को निर्णायक नहीं बनाते; ‘अस्तित्व’ अस्पष्टता को पर्याप्त रूप से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, काव्यात्मक गद्य रखा गया है। ‘जो…वे/वही’ और ‘जिस दिन…उस दिन’ की समानांतर संरचना मूल के विरोधाभासी लय-विन्यास को व्यक्त करती है। उपलब्ध consult_text इस OCR अंश से असंगत है, इसलिए अनुवाद प्रत्यक्ष कॉप्टिक पंक्तियों और संशोधित स्रोत-समीक्षा पर आधारित है।
