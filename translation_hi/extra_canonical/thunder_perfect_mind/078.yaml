  choice: जो मेरे साहचर्य से बाहर हैं
  rationale: ⲥⲩⲛⲟⲩⲥⲓⲁ का मूल भाव साथ होने, संगति या सहवास का है; ‘साहचर्य’ इस संबंधात्मक अर्थ को बनाए रखता है, जबकि ⲉⲃⲟⲗ ϩⲛ को ‘से बाहर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: वे मुझे नहीं जानते
  rationale: OCR रूप संदर्भ में नकारात्मक ‘न जानना/अनजान होना’ बताता है; सरल वर्तमान हिंदी कथन विरोधाभासी वाक्य-रचना को स्पष्ट रखता है।
- source_word: ⲛⲉⲧϣⲟⲟⲡ ⲛⲧⲁⲟⲩⲁ
  choice: जो मेरे अस्तित्व में हैं
  rationale: पाठ का यह अंश OCR में संदिग्ध है, पर प्रचलित पाठ-साक्ष्य ‘मेरे अस्तित्व/सत्ता में’ का समर्थन करता है। ‘अस्तित्व’ दार्शनिक गहराई रखता है और ‘पदार्थ’ जैसे भौतिक अर्थ से बचता है।
- source_word: ⲛⲉⲧⲙⲏⲛ ⲉⲣⲟⲉⲓ
  choice: जो मेरे निकट हैं
  rationale: शाब्दिक अर्थ ‘मेरे पास/साथ बने रहनेवाले’ हो सकता है, किंतु अगले ‘दूर’ पद के साथ स्पष्ट स्थानिक-विरोध के कारण ‘निकट’ हिंदी में उचित है।
- source_word: ⲛⲉⲧⲟⲩⲏⲏⲩ ⲛⲥⲁⲛⲃⲟⲗ ⲙⲙⲟⲉⲓ
  choice: जो मुझसे दूर हैं
  rationale: ⲟⲩⲏⲏⲩ और ⲛⲥⲁⲃⲟⲗ दूरी/बाहर होने का भाव देते हैं; ‘मुझसे दूर’ निकट-दूर की समानांतरता को सुरक्षित रखता है।
- source_word: ϩⲙ ⲡⲉϩⲟⲟⲩ
  choice: जिस दिन / उस दिन
  rationale: दिन-सूचक पद को दोहरावपूर्ण लेकिन स्वाभाविक हिंदी समानांतरता में रखा गया है।
