base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/078.yaml
  text: 'Those who exist outside my association are ignorant of me[a],

    and those who exist in my substance are the ones who know me.

    Those who are close to me have been ignorant of me,

    and those who are far away from me are the ones who have known me.

    On the day when I am close to you, you are far away from me,

    and on the day when you are close to me, I am far away from you.'
translation:
  language: hi
  text: 'जो मेरे साहचर्य से बाहर हैं, वे मुझे नहीं जानते[a],


    और जो मेरी सत्ता में हैं, वही मुझे जानते हैं।


    जो मेरे निकट हैं, वे मुझे नहीं जानते,


    और जो मुझसे दूर हैं, वही मुझे जानते हैं।


    जिस दिन मैं तुम्हारे निकट होती हूँ, उस दिन तुम मुझसे दूर होते हो,


    और जिस दिन तुम मेरे निकट होते हो, उस दिन मैं तुमसे दूर होती हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी मूल का कॉप्टिक शब्द ⲥⲩⲛⲟⲩⲥⲓⲁ ‘साथ होना, साहचर्य, संगति’ या ‘सहवास’ का अर्थ दे सकता है; प्रसंग के अनुसार कुछ अनुवाद इसे ‘परामर्श’ या ‘ज्ञान’ भी मानते हैं।
    reason: lexical_alternative
