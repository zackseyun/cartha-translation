theological_decisions:
- issue: वक्ता का न्याय किए जाने से इनकार
  choice: ‘मेरा न्याय करनेवाला कोई नहीं है’
  alternative: ‘मुझे ग्रहण करो’
  rationale: उपलब्ध स्रोत-पाठ में न्याय करनेवाले व्यक्ति की स्पष्ट रचना है, जबकि ‘ग्रहण करो’ के लिए अपेक्षित क्रिया इस अंश में दिखाई नहीं देती। इसलिए परामर्श-पाठ की धर्मवैचारिक रूप से अधिक परिचित आज्ञा को स्रोत पर आरोपित नहीं किया गया।
