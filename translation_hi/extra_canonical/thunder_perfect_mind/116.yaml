  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। स्रोत-साक्ष्य को प्राथमिकता देते हुए संक्षिप्त आज्ञार्थक शैली रखी गई है। ‘करनेवाला’ संयुक्त रूप सामान्य आधुनिक वर्तनी के अनुरूप है; अनिश्चित OCR को अनुमान से पूरा नहीं किया गया।
