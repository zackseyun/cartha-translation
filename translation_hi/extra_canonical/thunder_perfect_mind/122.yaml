  text: 'And do not make me known in another place or in another time. Do not make me known. Do not make me known in another place or in another time.

    For I am the one who has come to be, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance[f][e][d][c][b], and the one who will come to be.'
translation:
  language: hi
  text: 'और किसी दूसरे स्थान या किसी दूसरे समय में मुझसे अनजान मत रहो।[a] मुझसे अनजान मत रहो। किसी दूसरे स्थान या किसी दूसरे समय में मुझसे अनजान मत रहो।


    क्योंकि मैं वही हूँ जो अस्तित्व में आया है,[b] और जो अस्तित्व में आएगा।


    मैं सहनशीलता हूँ,[c] और वह हूँ जो अस्तित्व में आएगा।


    मैं सहनशीलता हूँ, और वह हूँ जो अस्तित्व में आएगा।


    मैं सहनशीलता हूँ, और…[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक ⲙⲡⲣ ⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ का अर्थ है, “मुझसे अनजान मत रहो।” इसे “मुझे प्रकट/ज्ञात मत करो” भी समझा गया है, पर ⲣ-ⲁⲧ-ⲥⲟⲟⲩⲛ का अर्थ ‘ज्ञान-विहीन होना’ है। ⲟⲩⲟⲉⲓϣ यहाँ “समय” है।
    reason: lexical_and_grammatical_clarification
  - marker: b
    text: “अस्तित्व में आया है” का अनुवाद “हुआ है” या “बना है” भी हो सकता है; कॉप्टिक ϣⲱⲡⲉ इन अर्थों को समेटता है।
    reason: lexical_alternative
  - marker: c
    text: “सहनशीलता” के लिए प्रयुक्त ⲥⲩⲛⲅⲛⲱⲙⲏ का अर्थ “क्षमा,” “रियायत,” “समझ,” या “सहमति” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: उपलब्ध कॉप्टिक अंश अंतिम “और” पर कट जाता है; इसलिए उसके बाद की पंक्ति यहाँ अनूदित नहीं की गई है। उपलब्ध परामर्श-पाठ इन कॉप्टिक पंक्तियों से मेल नहीं खाता, और खंड-संरेखण कम विश्वसनीय है।
    reason: alignment_and_textual_note
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: मुझसे अनजान मत रहो
  rationale: ⲙⲡⲣ- निषेधात्मक आज्ञार्थ है और ⲣ-ⲁⲧ-ⲥⲟⲟⲩⲛ का शाब्दिक अर्थ ‘ज्ञान-विहीन होना’ है। इसलिए यह causative ‘मुझे ज्ञात मत कराओ’ के बजाय ‘मुझसे अनजान मत रहो’ है।
- source_word: ⲕⲉⲙⲁ
  choice: दूसरा स्थान
  rationale: ⲕⲉ ‘दूसरा’ और ⲙⲁ ‘स्थान’ का सीधा संयुक्त अर्थ।
- source_word: ⲕⲉⲟⲩⲟⲉⲓϣ
  choice: दूसरा समय
  rationale: साहिदिक ⲟⲩⲟⲉⲓϣ यहाँ ‘समय/अवसर’ है, ‘भीड़’ नहीं। समानांतर ‘दूसरे स्थान’ के साथ ‘दूसरे समय’ स्वाभाविक है।
- source_word: ϣⲱⲡⲉ
  choice: अस्तित्व में आना
  rationale: इस क्रिया की अर्थ-सीमा ‘होना, घटित होना, बनना, अस्तित्व में आना’ है। वक्ता के आत्म-परिचय में ‘अस्तित्व में आना’ उसके अस्तित्वगत भार और कालगत अस्पष्टता को बनाए रखता है।
- source_word: ⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: सहनशीलता
  rationale: यूनानी मूल के इस शब्द में क्षमा, रियायत, सहमति और समझ के अर्थ संभव हैं। आत्म-उपाधि के रूप में ‘सहनशीलता’ इसकी उदार सहन-भावना को रखती है, बिना इसे केवल न्यायिक ‘क्षमा’ या बौद्धिक ‘समझ’ तक सीमित किए।
theological_decisions:
- issue: वक्ता के भूत और भविष्य संबंधी आत्म-वर्णन का अस्तित्वगत स्वर
  choice: जो अस्तित्व में आया है / जो अस्तित्व में आएगा
  alternative: जो हुआ है / जो होगा; जो बन चुका है / जो बनेगा
  rationale: पाठ यह स्पष्ट नहीं करता कि अभिप्राय घटना, परिवर्तन या अस्तित्व है। चुना गया रूप आत्म-प्रकाशन का भार रखता है, पर किसी विशिष्ट दार्शनिक या सांप्रदायिक सिद्धांत को आरोपित नहीं करता।
- issue: ⲥⲩⲛⲅⲛⲱⲙⲏ को व्यक्त आत्म-उपाधि मानना
  choice: मैं सहनशीलता हूँ
  alternative: मैं क्षमा हूँ; मैं समझ हूँ; मैं रियायत हूँ
  rationale: मूल में अमूर्त संज्ञा वक्ता की पहचान के रूप में आती है। हिंदी में भी इसे अमूर्त आत्म-उपाधि रखकर मूल की काव्यात्मक और धर्मवैचारिक विचित्रता सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक गद्य। मूल की तीखी पुनरावृत्ति को संक्षिप्त या सुचारु नहीं किया गया। स्त्री-वक्ता के बावजूद ‘वही’ और ‘जो’ जैसे रूप लिंग-तटस्थ संबंधवाचक संरचना में रखे गए हैं।
