translation:
  language: hi
  text: '**6.** मैं सार-तत्त्व हूँ और सार-तत्त्व से रहित भी हूँ[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सार-तत्त्व’ के लिए आया कॉप्टिक शब्द ⲁⲙⲡⲉ ‘संपत्ति,’ ‘साधन’ या ‘धन-सामग्री’ भी बता सकता है। इसलिए वाक्य का अर्थ ‘मैं संपत्ति हूँ और संपत्तिहीन भी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध OCR में ⲉⲧⲁⲙⲁⲧⲉ है, जो संभवतः ⲁⲧⲁⲙⲡⲉ (‘सार-तत्त्व/संपत्ति से रहित’) का गलत पाठ है। इसी अंश में ⲫⲩⲥⲓⲥ, ⲕⲧⲓⲥⲓⲥ और ⲯⲩⲭⲟⲟⲩⲉ जैसे शब्दों की उपस्थिति से लगता है कि पास की पंक्तियों की सामग्री इस खंड में मिल गई हो सकती है।
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲙⲡⲉ (ⲛⲁⲙⲡⲉ में)
  choice: सार-तत्त्व
  rationale: कॉप्टिक शब्द का अर्थ संपत्ति, साधन या धन-सामग्री हो सकता है, पर इस विरोधाभासी कथन में वह तात्त्विक ‘सार/वास्तविकता’ की ओर भी संकेत कर सकता है। ‘सार-तत्त्व’ अमूर्त अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी ठोस अर्थों को सुरक्षित रखती है।
- source_word: 'ⲁⲧⲁⲙⲡⲉ (संभावित पाठ: निषेधार्थक ⲁⲧ- + ⲁⲙⲡⲉ)'
  choice: सार-तत्त्व से रहित
  rationale: यह पहले पद का सीधा निषेधार्थक प्रतिरूप है। ‘से रहित’ मूल की privative रचना को स्वाभाविक हिन्दी में व्यक्त करता और विरोधाभास को यथावत रखता है।
theological_decisions:
- issue: वक्ता का एक ही साथ सार-तत्त्व होना और उससे रहित होना
  choice: विरोधाभास को बिना समझाए या समतल किए सीधे बनाए रखा गया है।
  alternative: दूसरे खंड को केवल ‘निर्धन’ या ‘निराकार’ कहना
  rationale: ऐसा कोई एकार्थी रूप मूल में निहित शाब्दिक और तात्त्विक तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘वह भी, जो…’ मूल के ‘the one without’ को बनाए रखता है; स्त्री-वक्ता के संदर्भ में भी हिन्दी का ‘वह’ अनावश्यक लिंग-निर्धारण नहीं करता।
