  yaml_path: translation/extra_canonical/thunder_perfect_mind/036.yaml
  text: It is the utterance according to prudence of my seeking[a], and it is the knowledge of my searching[d][c][b]. But I am she who exists in all fears and in courage.
translation:
  language: hi
  text: '**1.** यह मेरी खोज के विवेक के अनुसार वाणी है[a], और यह मेरे अन्वेषण का ज्ञान है। परन्तु मैं वह स्त्री हूँ जो सभी भयों और साहस में विद्यमान है[b][c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक कॉप्टिक शब्द का OCR-पाठ अनिश्चित है। ‘वाणी’ अस्थायी अनुवाद है; ‘कथन’ भी सम्भव हो सकता है।
    reason: alignment_note
  - marker: b
    text: कॉप्टिक रूप का अर्थ ‘वह स्त्री जो विद्यमान है’ है; इसलिए यहाँ स्त्रीलिंग आत्म-पहचान को साधारण ‘मैं हूँ’ में नहीं बदला गया।
    reason: grammar_note
  - marker: c
    text: अन्तिम शब्द में ‘पुरुषत्व, वीरता’ का भाव भी हो सकता है; यहाँ ‘भय’ के प्रतिलोम और लिंग-निरपेक्ष अर्थ में ‘साहस’ चुना गया है। पाठ वक्ता को भय और साहस—दोनों में विद्यमान बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲕⲉⲟⲩⲁⲩ
  choice: वाणी
  rationale: OCR-पाठ अनिश्चित है; प्रसंग में यह ऐसा संज्ञात्मक पद प्रतीत होता है जिसे ‘विवेकानुसार’ विशेषित करता है। इसलिए सामान्य और गरिमापूर्ण ‘वाणी’ को अस्थायी रूप से चुना गया।
- source_word: ⲫⲣⲟⲛⲓ
  choice: विवेक
  rationale: यह यूनानी φρόνησις का रूप जान पड़ता है। ‘विवेक’ इसके व्यावहारिक-बौद्धिक अर्थ और दार्शनिक लहजे दोनों को सहज हिन्दी में रखता है।
- source_word: ⲣⲓⲧⲉ
  choice: खोज
  rationale: ‘खोजना/ढूँढ़ना’ के क्रियात्मक भाव को संज्ञा के रूप में रखता है और अगले समानांतर पद ‘छानबीन’ से मेल खाता है।
- source_word: ⲥⲁϩⲟⲩ
  choice: ज्ञान
  rationale: संज्ञानात्मक विषयवस्तु के व्यापक अर्थ के लिए सीधा और स्वाभाविक हिन्दी पद।
- source_word: ϣⲟⲩϣⲟⲩ
  choice: छानबीन
  rationale: खोजने और जाँचने के गहन भाव को व्यक्त करता है तथा पहले ‘खोज’ की मात्र पुनरावृत्ति से बचते हुए समानांतरता बनाए रखता है।
- source_word: ϣⲟⲟⲡ
  choice: विद्यमान है
  rationale: ‘होना/उपस्थित होना’ का अस्तित्वसूचक भाव और विरोधी अवस्थाओं में वक्ता की उपस्थिति दोनों सुरक्षित रहते हैं।
- source_word: ⲫⲟⲃⲟⲥ
  choice: भय
  rationale: यूनानी φόβος का व्यापक और सीधा हिन्दी समतुल्य।
- source_word: ⲧⲏⲣⲟⲩ
  choice: सभी
  rationale: यह बहुवचन ‘भयों’ को सार्वत्रिक बनाता है; इसे संबंधवाचक ‘उनके’ नहीं माना गया।
- source_word: ⲡⲛⲏϣⲁⲧ
  choice: साहस
  rationale: मूल में पुरुषत्व/वीरता से जुड़ा अर्थ हो सकता है, पर यहाँ ‘भय’ के नैतिक विलोम के रूप में लिंग-निरपेक्ष ‘साहस’ सबसे स्वाभाविक है।
- source_word: ⲧⲉⲧϣⲟⲟⲡ
  choice: मैं वह हूँ जो … विद्यमान है
  rationale: स्त्रीलिंग संबंधवाचक संरचना को साधारण ‘मैं हूँ’ में समतल न करके वक्ता की स्त्रीलिंग आत्म-पहचान सुरक्षित रखी गई है।
theological_decisions:
- issue: विरोधी अवस्थाओं में वक्ता की उपस्थिति
  choice: सभी भयों में और साहस में
  alternative: भय के स्थान पर साहस में
  rationale: पाठ वक्ता को केवल किसी एक पक्ष से नहीं जोड़ता, बल्कि दोनों विरोधी अवस्थाओं में विद्यमान बताता है; इस तनाव को बिना व्याख्यात्मक समाधान के रखा गया।
- issue: स्त्रीलिंग आत्म-पहचान
  choice: मैं वह हूँ जो
  alternative: मैं … में हूँ
  rationale: कॉप्टिक स्त्रीलिंग संबंधवाचक रूप पाठ की वक्ता-छवि के लिए महत्त्वपूर्ण है, इसलिए हिन्दी में ‘वह’ के स्त्रीलिंग संदर्भ को प्रसंगगत रूप से बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। दार्शनिक पदों के लिए ‘विवेक’ और ‘ज्ञान’ रखे गए हैं; ‘विद्यमान’ अस्तित्वसूचक लहजा बनाए रखता है। आरम्भिक OCR-अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है, जबकि मुख्य पाठ पठनीय रखा गया है।
