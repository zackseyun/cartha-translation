base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/107.yaml
  text: 'I am the hearing that is attainable to all[a];

    I am the speech that cannot be grasped;

    the name of the sound and the sound of the name;

    I am the sign of this[g][f][e][d][c][b], and the manifestation.'
translation:
  language: hi
  text: 'मैं वह श्रवण हूँ जो सबके लिए सुलभ है[a];


    मैं वह वाणी हूँ जिसे वे पकड़ नहीं सकते;


    मैं ध्वनि का नाम और नाम की ध्वनि हूँ;


    मैं इसी का चिह्न[b] और प्रकटीकरण हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲉⲧϣⲏⲡ का अर्थ यहाँ “सुलभ/प्राप्य” लिया गया है; इसका एक संभावित अर्थ “महान” भी है।
    reason: lexical_alternative
  - marker: b
    text: “इसी” (ⲡⲁⲓ) का ठीक-ठीक पूर्वपद स्पष्ट नहीं है; यह पहले आए नाम और ध्वनि के पूरे कथन की ओर संकेत कर सकता है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: ⲡⲥⲱⲧⲙ
  choice: श्रवण
  rationale: यह ⲥⲱⲧⲙ (‘सुनना’) से बना संज्ञात्मक रूप है। ‘श्रवण’ अमूर्त श्रव्य भाव को बनाए रखता है और इसे नैतिक अर्थ वाले ‘आज्ञापालन’ में नहीं बदलता।
- source_word: ⲉⲧϣⲏⲡ
  choice: जो ... सुलभ है
  rationale: इस संदर्भ में ‘पहुँच के भीतर/प्राप्य’ अर्थ अगले कथन की अगम्यता के साथ विरोधाभासी तनाव बनाता है; ‘सुलभ’ आधुनिक हिन्दी में स्वाभाविक है। ‘महान’ भी संभावित शब्दार्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ⲛϩⲱⲃ ⲛⲓⲙ
  choice: सबके लिए
  rationale: सार्वभौमिकता व्यक्त करने वाले मुहावरे के रूप में लिया गया है; शाब्दिक ‘हर वस्तु/हर कार्य में’ यहाँ कम स्वाभाविक होगा।
- source_word: ⲡϣⲁϫⲉ
  choice: वाणी
  rationale: ‘वाणी’ बोले गए कथन और ध्वनि-संबंधी क्रम को बनाए रखती है; ‘वचन’ से आने वाला बाहरी धर्मवैज्ञानिक भार टाला गया है।
- source_word: ⲉⲧⲉ ⲙⲁⲩϣⲁⲙⲁϩⲧⲉ ⲙⲙⲟϥ
  choice: जिसे वे पकड़ नहीं सकते
  rationale: 'पंक्ति-विभाजन के पार यह एक संबंधवाचक उपवाक्य है: नकारात्मक तृतीय-पुरुष बहुवचन रूप और ⲁⲙⲁϩⲧⲉ (‘पकड़ना/अधिकार में लेना’)। ‘पकड़’ मूल रूपक को सुरक्षित रखता है, जबकि ‘समझ’ कहने से अर्थ अनावश्यक रूप से निश्चित हो जाता।'
- source_word: ⲣⲁⲛ
  choice: नाम
  rationale: मानक अर्थ; ‘ध्वनि’ के साथ उलटे क्रम की संरचना को स्पष्ट रखता है।
- source_word: ⲥⲙⲏ
  choice: ध्वनि
  rationale: ‘आवाज़’ और ‘समाचार’ संभव हैं, पर ‘ध्वनि’ अमूर्त श्रव्य अर्थ और ‘नाम/ध्वनि’ की सममित रचना को बेहतर बनाए रखती है।
- source_word: ⲥⲏⲙⲉⲓⲟⲛ
  choice: चिह्न
  rationale: यूनानी मूल के इस शब्द का अर्थ ‘चिह्न/संकेत’ है। OCR में पंक्ति-विभाजन से अलग दिखने वाला ⲟⲛ इसी शब्द का अंतिम भाग है, कोई स्वतंत्र ‘भी’ नहीं।
- source_word: ⲙⲡⲁⲓ
  choice: इसी का
  rationale: संकेतवाचक ‘इसका’ को सुरक्षित रखा गया है; ‘ही’ निकट संकेत और पूर्ववर्ती कथन से संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, पर संदर्भित पद को स्पष्ट करके अस्पष्टता नहीं मिटाता।
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: प्रकटीकरण
  rationale: यह ‘प्रकट होना/प्रकट करना’ से बनी संज्ञात्मक अभिव्यक्ति है। ‘प्रकाश’ कहना अलग कॉप्टिक शब्द की अपेक्षा करेगा; ‘प्रकटीकरण’ बाह्य रूप से प्रकट होने का भाव रखता है।
theological_decisions:
- issue: प्रथम-पुरुष आत्म-पहचान वाले कथनों का परस्पर संबंध
  choice: सभी पहचानों को समानांतर और बिना व्याख्यात्मक सामंजस्य के रखा गया है
  alternative: इन्हें किसी विशिष्ट धर्मवैज्ञानिक सत्ता, ‘लोगोस’, या दैवी गुणों के रूप में स्पष्ट करना
  rationale: स्रोत स्वयं वक्ता की पहचान को इन अमूर्त पदों के साथ तनावपूर्ण ढंग से रखता है; किसी संप्रदायगत पहचान को जोड़ना मूल की अपेक्षा अधिक निश्चितता पैदा करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक गद्य रखा गया है। ‘श्रवण’, ‘वाणी’, ‘ध्वनि’, ‘चिह्न’ और ‘प्रकटीकरण’ अमूर्त आत्म-पहचान की लय को बनाए रखते हैं, फिर भी सामान्य शिक्षित पाठक के लिए बोधगम्य हैं। अर्धविराम मूल के समानांतर उद्घोषों को जोड़ते हैं।
