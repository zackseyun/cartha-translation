  yaml_path: translation/extra_canonical/thunder_perfect_mind/050.yaml
  text: '...outwardly[a], and you knew me inwardly. I am she before whom you were ashamed, and you were shameless. I, I am godless, and I am the virgin[b], her God.'
translation:
  language: hi
  text: …बाहर से[a], और तुमने मुझे भीतर से जाना। मैं वही हूँ जिसके सामने तुम लज्जित हुए, और तुम निर्लज्ज बने। मैं—मैं ईश्वर-विहीन हूँ, और मैं वह कुँवारी हूँ[b]—उसका ईश्वर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंश का आरम्भ अधूरा है; उपलब्ध पाठ में केवल ‘…बाहर से’ का अंतिम भाग बचा है।
    reason: fragmentary_source
  - marker: b
    text: इस स्थान का OCR बहुत विकृत है। ‘कुँवारी’ और उसके बाद ‘उसका ईश्वर’ का वाक्य-संबंध अनिश्चित है; अनुवाद परामर्श-पाठ में पुनर्निर्मित पठन का अनुसरण करता है।
    reason: textual_uncertainty
