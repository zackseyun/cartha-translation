  text: 'to him who created me[a].

    I am the one who will cry out his name.

    Look then at his words,

    and all the writings that have been completed.

    Listen therefore, you hearers,

    and you yourselves also[c][b], the angels'
translation:
  language: hi
  text: 'उसके सामने जिसने मुझे रचा है।


    मैं ही वह हूँ जो उसका नाम पुकारूँगी।


    इसलिए उसके वचनों को देखो,


    और उन सभी लेखों को भी, जो पूरे किए जा चुके हैं।


    इसलिए सुनो, हे सुनने वालो,


    और तुम भी, हे स्वर्गदूतो—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि का उपलब्ध अंश यहाँ वाक्य के बीच में समाप्त होता है; अंतिम शब्द “स्वर्गदूत” भी स्रोत में अधूरा है। इस खंड का OCR क्षतिग्रस्त और अंग्रेज़ी परामर्श-पाठ असंगत है, इसलिए अनुवाद दृश्यमान कॉप्टिक अक्षरों और समीक्षित पुनर्निर्माण पर आधारित है।
    reason: textual_and_alignment_note
lexical_decisions:
- source_word: ⲡⲉⲛⲧⲁϥⲧⲁⲙⲓⲟⲓ
  choice: जिसने मुझे रचा है
  rationale: ⲧⲁⲙⲓⲟ का अर्थ बनाना या रचना है। “रचा” सृष्टि-संबंधी अर्थ को बनाए रखता है, पर किसी विशिष्ट दार्शनिक व्याख्या को आरोपित नहीं करता।
- source_word: ⲁⲛⲟⲕ ⲡⲉ ⲧⲛⲁⲭⲱ ⲙ̄ⲡⲉϥⲣⲁⲛ ⲉⲃⲟⲗ
  choice: मैं ही वह हूँ जो उसका नाम पुकारूँगी
  rationale: पंक्ति आत्म-परिचय और भावी उद्घोषणा व्यक्त करती है। “पुकारूँगी” ⲉⲃⲟⲗ की प्रकट या ऊँची उद्घोषणा का स्वाभाविक हिन्दी रूप है।
- source_word: ϣⲁϫⲉ
  choice: वचन
  rationale: यहाँ शब्द बहुवचन संदर्भ में किसी व्यक्ति के कहे हुए कथनों को सूचित करता है। “वचन” आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: 'ⲛⲉⲥϩⲁⲓ (OCR: ⲛⲉⲥⲙⲏ)'
  choice: लेख
  rationale: पांडुलिपि-संदर्भ और समीक्षित पुनर्निर्माण “लिखी हुई वस्तुओं/लेखों” की ओर संकेत करते हैं। OCR का ⲥⲙⲏ सम्भवतः अक्षर-पहचान की त्रुटि है।
- source_word: ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: सुनने वालो
  rationale: यूनानी मूल का यह शब्द श्रोताओं को सीधे संबोधित करता है। “सुनने वालो” निकटवर्ती आज्ञा “सुनो” के साथ मूल की शब्द-प्रतिध्वनि बनाए रखता है।
- source_word: ⲛ̄ⲛⲁⲅⲅⲉ[ⲗⲟⲥ]
  choice: हे स्वर्गदूतो
  rationale: अंश के अंत में शब्द कटा हुआ है, पर उपलब्ध अक्षर ἄγγελος के कॉप्टिक रूप की ओर स्पष्ट संकेत करते हैं। संबोधन को हिन्दी में “हे स्वर्गदूतो” से व्यक्त किया गया है।
theological_decisions:
- issue: वक्ता के व्याकरणिक लिंग को हिन्दी में व्यक्त करना
  choice: स्त्रीलिंग “पुकारूँगी”
  alternative: पुल्लिंग या लिंग-निरपेक्ष पुनर्वाक्य-विन्यास
  rationale: पूरे ग्रंथ में बोलने वाली नाटकीय वाणी स्त्री-स्वर में प्रस्तुत होती है; हिन्दी में भविष्यकाल के प्रथम पुरुष को स्वाभाविक रूप से लिंग चाहिए। यह चयन वक्ता की पहचान के बारे में आगे की दार्शनिक या संप्रदायगत व्याख्या निर्धारित नहीं करता।
- issue: “जिसने मुझे रचा” का तात्त्विक संबंध
  choice: संबंध को बिना व्याख्या के यथावत रखना
  alternative: रचयिता को किसी विशिष्ट देवता, उद्गम या ग्नॉस्टिक सत्ता के रूप में नामित करना
  rationale: स्रोत केवल “जिसने मुझे रचा” कहता है। अनाम सर्वनाम की अस्पष्टता बनाए रखना पाठ के धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य काव्यात्मक लय वाली रखी गई है। दोहराए गए “इसलिए” और “सुनो, हे सुनने वालो” से मूल की उपदेशात्मक पुनरुक्ति बनी रहती है। आरंभ और अंत की खंडित प्रकृति को पूरा वाक्य गढ़कर छिपाया नहीं गया।
