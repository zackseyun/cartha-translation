  text: I am the name cried out among those who are dead; and I am the one who is present—alone and in unity. The one who will judge me by the law—
translation:
  language: hi
  text: मैं वह नाम हूँ जिसे मरे हुओं के बीच पुकारा जाता है; और मैं ही वह हूँ जो उपस्थित है—अकेली और एकता में।[a] वह जो व्यवस्था के अनुसार मेरा न्याय करेगा—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अकेली और एकत्व में।” यहाँ मूल पाठ सम्भवतः एक ही शब्द-मूल से ‘अकेली’ और ‘एकता’ को साथ रखता है।
    reason: lexical_alternative
  - marker: b
    text: इस अंश का OCR अनिश्चित है। यहाँ “व्यवस्था” का पाठ सम्भावित संशोधन पर आधारित है; यदि OCR का पाठ सही हो, तो वाक्य का न्यायिक अर्थ बदल सकता है। वाक्य भी इसी स्थान पर अधूरा रह जाता है।
    reason: alignment_note
lexical_decisions:
- source_word: '(ⲡⲓ)ⲣⲁⲛ (OCR: ⲡⲓⲛⲁ)'
  choice: वह नाम
  rationale: OCR में सम्भवतः ⲣ छूट गया है; सन्दर्भानुसार ⲣⲁⲛ ‘नाम’ सबसे सम्भावित पाठ है। निश्चित लेख का बल बनाए रखने के लिए ‘वह नाम’ चुना गया।
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: जिसे ... पुकारा जाता है
  rationale: इस कठिन और सम्भवतः विकृत पाठ में बाहर की ओर आवाज़ देने या उद्घोषित करने का भाव सम्भव है। ‘पुकारा जाता है’ श्रव्य अर्थ बनाए रखता है, जबकि ‘निकाला जाता है’ भी सम्भव है।
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: मरे हुओं के बीच
  rationale: ϩⲛ के साथ बहुवचन सम्बन्धवाचक रूप का स्वाभाविक हिन्दी प्रतिरूप।
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: वह ... जो उपस्थित है
  rationale: ϣⲟⲟⲡ में केवल अस्तित्व नहीं, उपस्थिति का भी भाव है; इसलिए ‘उपस्थित है’ चुना गया।
- source_word: ⲟⲩⲁⲁⲧ
  choice: अकेली
  rationale: वक्ता की स्त्री-स्वरूप पहचान और मूल के ‘अकेले/एकाकी’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: 'ⲙⲛⲧⲟⲩⲁⲁⲧ (OCR: ⲙⲛⲧⲁⲓ)'
  choice: एकता में
  rationale: OCR में अक्षर छूटे होने की सम्भावना है। सम्भावित अमूर्त संज्ञा ‘एकता/एकत्व’ है; ‘एकता में’ नवीनतम व्याकरणिक निर्णय और मूल विरोधाभास को बनाए रखता है।
- source_word: ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ
  choice: वह जो ... मेरा न्याय करेगा
  rationale: ⲛⲁ- का भविष्यकाल और यूनानी मूल के न्यायिक क्रियार्थ दोनों स्पष्ट रखे गए हैं।
- source_word: 'ϩⲁ ⲡⲓ ⲛⲟⲙⲟⲥ (OCR: ⲛⲉⲗⲟⲥ)'
  choice: व्यवस्था के अनुसार
  rationale: सम्भावित यूनानी आगन्तुक शब्द νόμος का अर्थ ‘व्यवस्था/कानून’ है। ‘के अनुसार’ ϩⲁ के न्यायिक सम्बन्ध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘अकेली’ और ‘एकता में’ का विरोधाभासी युग्म
  choice: अकेली और एकता में
  alternative: एकाकी और एकत्वस्वरूप
  rationale: पाठ के जानबूझकर रखे गए तनाव को किसी विशिष्ट आध्यात्मिक या त्रित्ववादी व्याख्या में नहीं बदला गया।
- issue: ‘व्यवस्था’ के अनुसार न्याय
  choice: व्यवस्था के अनुसार
  alternative: कानून के द्वारा
  rationale: धार्मिक ‘व्यवस्था’ और सामान्य ‘कानून’ दोनों अर्थ सम्भव हैं; कोई विशिष्ट धार्मिक विधान आरोपित किए बिना न्यायिक अस्पष्टता सुरक्षित रखी गई।
