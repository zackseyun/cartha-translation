base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/045.yaml
  text: 'Greeks and barbarians[a],

    I am the one whose image is great in Egypt,

    and the one who has no image among the barbarians.

    I am she whom they hated in every place[d][c][b],

    and she whom they loved.'
translation:
  language: hi
  text: 'यूनानी और बर्बर[a],


    मैं वही हूँ जिसकी छवि मिस्र में महान[b] है,

    और वही जिसकी कोई छवि बर्बरों के बीच नहीं है।


    मैं वही हूँ जिससे उन्होंने हर स्थान में घृणा की[c],

    और वही जिससे उन्होंने प्रेम किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बर्बर’ मूल के यूनानी ऋणशब्द का निकट रूप है। प्राचीन प्रयोग में इसका अर्थ मुख्यतः ‘गैर-यूनानी’ था; यहाँ इसे आधुनिक अर्थ में ‘असभ्य’ कहना आवश्यक नहीं है।
    reason: historical_lexical_context
  - marker: b
    text: मूल शब्द का अर्थ ‘बहुत/अनेक’ या ‘महान/विशाल’ हो सकता है; इसलिए अनुवाद ‘जिसकी छवियाँ मिस्र में बहुत हैं’ भी संभव है।
    reason: lexical_ambiguity
  - marker: c
    text: ‘घृणा की’ वाला पाठ अगले वाक्य के ‘प्रेम किया’ के साथ विरोध बनाता है। मूल की वर्तनी कुछ अनिश्चित है; ‘तुच्छ जाना’ भी संभव अर्थ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ⲉⲗⲗⲏⲛ
  choice: यूनानी
  rationale: यह यूनानियों के लिए प्रयुक्त मानक जातिनाम है और ⲃⲁⲣⲃⲁⲣⲟⲥ के साथ पारंपरिक युग्म बनाता है।
- source_word: ⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: बर्बर
  rationale: मूल के यूनानी ऋणशब्द और ‘यूनानी’ के साथ उसके विरोधी युग्म को सुरक्षित रखता है; पादटिप्पणी ऐतिहासिक अर्थ स्पष्ट करती है।
- source_word: ⲉⲓⲛⲉ
  choice: छवि
  rationale: यहाँ शब्द का अर्थ ‘छवि/रूप/सादृश्य’ है, ‘मौन’ नहीं; ‘छवि’ दोनों कथनों में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: ⲛⲁϣⲉ
  choice: महान
  rationale: शब्द मात्रा, बहुतायत या बड़प्पन व्यक्त कर सकता है; ‘महान’ अंग्रेज़ी परामर्श-पाठ के अर्थ को रखते हुए काव्यात्मक विरोध को सहज बनाता है।
- source_word: ϩⲛ ⲕⲏⲙⲉ
  choice: मिस्र में
  rationale: ⲕⲏⲙⲉ मिस्र का भौगोलिक नाम है; आधुनिक हिन्दी में प्रचलित नाम लिया गया है।
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ
  choice: जिससे उन्होंने … घृणा की
  rationale: प्रेम किए जाने के अगले कथन के साथ स्पष्ट विरोध के कारण ‘घृणा’ वाला पाठ सर्वाधिक संगत है, यद्यपि वर्तनीगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: जिससे उन्होंने प्रेम किया
  rationale: यह ‘घृणा की’ के समानांतर सक्रिय बहुवचन रचना को और स्त्री वक्ता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: हर स्थान में
  rationale: OCR में जुड़े हुए रूप का संभावित विभाजन यही प्रचलित स्थानवाचक मुहावरा देता है और इसे ‘घृणा की’ वाले उपवाक्य से जोड़ा गया है।
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: मैं वही हूँ
  rationale: स्त्रीलिंग क़िब्ती पहचान-वाक्य का बल सुरक्षित है; हिन्दी में ‘वही’ बार-बार आने वाली आत्म-घोषणा को गरिमापूर्ण और स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘छवि’ का स्वरूप
  choice: छवि
  alternative: प्रतिमा / रूप / सादृश्य
  rationale: पाठ यह निर्धारित नहीं करता कि बात किसी भौतिक प्रतिमा की है, दृश्य रूप की, या व्यापक सादृश्य की; ‘छवि’ इस अर्थ-खुलेपन को बनाए रखती है।
- issue: घृणा और प्रेम करने वालों की पहचान
  choice: अनिर्दिष्ट बहुवचन ‘उन्होंने’
  alternative: लोगों ने
  rationale: क़िब्ती क्रिया में कर्ता बहुवचन है, पर उसकी पहचान नहीं बताई गई; ‘लोगों’ जोड़ना अनावश्यक व्याख्या होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक किंतु सरल आत्म-घोषणात्मक लय। ‘मैं वही हूँ’ की पुनरावृत्ति मूल के स्त्री वक्ता और समानांतर संरचना को दर्शाती है। आरंभिक ‘यूनानी और बर्बर’ उपलब्ध अंश में व्याकरणतः अधूरा प्रतीत होता है, इसलिए उसे बिना कृत्रिम क्रिया जोड़े खंडित रूप में रखा गया है।
