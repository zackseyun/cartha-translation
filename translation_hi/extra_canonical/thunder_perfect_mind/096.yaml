base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/096.yaml
  text: It is not my defense when they call[a], and the injustice you have considered[d][c][b], you leave it to open their mouths to judge me.
translation:
  language: hi
  text: जब वे पुकारते हैं, तब मेरा बचाव नहीं होता; और जिस अन्याय पर तुमने विचार किया है, उसे तुम छोड़ देते हो कि वे अपना मुँह खोलें और मेरा न्याय करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि का यह अंश खंडित है और OCR-पंक्तियों का विभाजन अनिश्चित है। आरंभिक वाक्यांश का संबंध पिछली पंक्ति से भी हो सकता है। अंतिम खंड का लगभग शाब्दिक अर्थ है, “उसे छोड़ देते हो कि वे अपना मुँह खोलें और मेरा न्याय करें।”
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: मेरा बचाव
  rationale: यूनानी मूल का यह कॉप्टिक शब्द न्यायिक संदर्भ में प्रतिरक्षा या बचाव-वचन को दर्शाता है; यहाँ स्वाभाविक हिन्दी में ‘मेरा बचाव’ रखा गया है।
- source_word: ⲉⲩϣⲁⲛⲙⲟⲩⲧⲉ
  choice: जब वे पुकारते हैं
  rationale: ϣⲁⲛ वाली रचना परिस्थितिक/कालिक अर्थ दे सकती है और ⲙⲟⲩⲧⲉ का सामान्य अर्थ ‘पुकारना/नाम लेना’ है; खंडित पाठ में अस्पष्टता बनाए रखने के लिए ‘पुकारते हैं’ चुना गया है।
- source_word: ⲡϫⲓⲛϭⲟⲛⲥ
  choice: अन्याय
  rationale: पूरा संज्ञा-रूप ϫⲓⲛϭⲟⲛⲥ अन्याय, उत्पीड़न या हिंसा का भाव देता है; इसे केवल ϭⲟⲛⲥ मानकर ‘संख्या’ करना स्रोत-संगत नहीं है।
- source_word: ⲡⲉⲧⲛⲧⲁⲉⲓⲙⲟⲉⲓⲛ
  choice: जिस पर तुमने विचार किया है
  rationale: खंड का आशय ‘जिसे/जिस पर तुमने सोचा-विचारा’ है; हिन्दी में पूर्ववर्ती ‘अन्याय’ से संबंध स्पष्ट रखने के लिए संबंधवाचक रचना अपनाई गई है।
- source_word: ⲭⲣⲟⲉⲓ ... ⲧⲉⲣⲟⲟⲩ
  choice: उनके मुँह खोलकर
  rationale: पाठ को ‘उनका मुँह खोलना’ समझते हुए मुहावरे का ठोस बिंब सुरक्षित रखा गया है, यद्यपि OCR में अक्षरखंड अनिश्चित हैं।
- source_word: ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: मेरा न्याय करने के लिए
  rationale: यूनानी ऋण-क्रिया ⲕⲣⲓⲛⲉ का मूल अर्थ न्याय/निर्णय करना है; ‘दोषी ठहराना’ कहने से निहित परिणाम अनावश्यक रूप से निश्चित हो जाता।
theological_decisions:
- issue: न्यायिक भाषा का स्वर
  choice: बचाव और न्याय
  alternative: सफाई और दोषी ठहराना
  rationale: स्रोत के न्यायिक शब्दों को व्यापक अर्थ में रखा गया है, ताकि यह पहले से तय न हो कि निर्णय अनिवार्यतः दंडात्मक है।
- issue: वक्ता के विरोधियों की पहचान
  choice: अनिर्दिष्ट ‘वे/उनके’
  alternative: अभियुक्त करने वाले या न्यायाधीश
  rationale: खंड सर्वनामों की स्पष्ट पहचान नहीं देता; किसी विशिष्ट धार्मिक या संस्थागत समूह को जोड़ना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य-पाठक के लिए सुबोध हिन्दी। न्यायिक बिंबों को बनाए रखा गया है और खंडित कॉप्टिक पाठ की वाक्य-संरचनात्मक अनिश्चितता फुटनोट में स्पष्ट की गई है।
