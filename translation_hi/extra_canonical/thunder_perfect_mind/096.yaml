  source_fidelity: 'The draft correctly rejects the misaligned consult text and follows the visible Coptic sequence: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ (my defense), the conditional/temporal fragment involving ‘they call,’ ⲡϫⲓⲛϭⲟⲛⲥ (injustice/wrong), ‘what you have considered,’ and the juridical ending ‘to judge me.’ The text is fragmentary, so the syntactic links should remain cautious.'
