  - severity: medium
    issue: Agency and syntax in ‘उनके मुँह खोलकर’
    rationale: This instrumental phrasing says that ‘you’ open ‘their’ mouths. The source sequence more naturally supports leaving it for them to open their mouths and judge the speaker; Hindi should retain that distinction.
