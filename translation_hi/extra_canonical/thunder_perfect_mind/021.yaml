base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/021.yaml
  text: 'Those who deny me confess me[a],

    and those who confess me deny me.

    Those who speak truth about me lie about me[b],

    and those who lie about me speak truth about me.'
translation:
  language: hi
  text: 'जो मेरा इनकार करते हैं, वे मुझे स्वीकार करते हैं[a],


    और जो मुझे स्वीकार करते हैं, वे मेरा इनकार करते हैं।


    जो मेरे विषय में सच कहते हैं, वे मेरे विषय में झूठ बोलते हैं,


    और जो मेरे विषय में झूठ बोलते हैं, वे मेरे विषय में सच कहते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परामर्श के लिए दिया गया अंग्रेज़ी पाठ इस खंड को “मैं वह वाणी हूँ जिसकी ध्वनि अनेक प्रकार की है…” से जोड़ता है, पर यहाँ उपलब्ध कॉप्टिक पाठ इनकार/स्वीकार और सच/झूठ के विरोधाभासी युग्म देता है। सम्भवतः पृष्ठ के इस भाग में खंड-संरेखण चूक गया है; अनुवाद दिए गए कॉप्टिक पाठ का अनुसरण करता है।
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲣⲛⲁ
  choice: इनकार करना
  rationale: यह यूनानी मूल का सहिदिक क्रियापद यहाँ किसी व्यक्ति को नकारने या उससे मुकरने का भाव रखता है। ‘इनकार करना’ आधुनिक हिन्दी में स्वाभाविक है और विरोधी क्रिया ‘स्वीकार करना’ के साथ मूल का तीखा विरोधाभास बनाए रखता है।
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: स्वीकार करना
  rationale: इस यूनानी मूल के सहिदिक शब्द का अर्थ स्वीकार करना, अंगीकार करना या घोषित रूप से मानना हो सकता है। ‘स्वीकार करना’ साधारण पाठक के लिए स्पष्ट है और यहाँ ‘इनकार करना’ का सीधा प्रतिपक्ष बनता है।
- source_word: ⲛⲉⲧ–
  choice: जो … करते हैं
  rationale: सम्बन्धवाचक निर्धारक से बने व्यक्तिवाचक उपवाक्य के लिए यह आधुनिक हिन्दी का स्वाभाविक और समावेशी रूप है।
- source_word: ⲙ̄ⲙⲟⲉⲓ / ⲉⲣⲟⲓ
  choice: मुझे / मेरा / मेरे विषय में
  rationale: वाक्यगत क्रिया और विभक्ति के अनुसार प्रथम पुरुष एकवचन के कर्म अथवा सम्बन्ध को स्वाभाविक हिन्दी में अलग-अलग रूपों से व्यक्त किया गया है।
- source_word: ϫⲉ ⲙⲉ ⲉⲣⲟⲓ
  choice: मेरे विषय में सच कहते हैं
  rationale: पाठ का आशय वक्ता के बारे में सत्य कहना है; यह रूप हिन्दी में स्पष्ट है और अगले ‘झूठ बोलते हैं’ के साथ समानांतरता रखता है।
- source_word: ϫⲓϭⲟⲗ ⲉⲣⲟⲓ
  choice: मेरे विषय में झूठ बोलते हैं
  rationale: मुहावरे का सीधा अर्थ वक्ता के बारे में झूठ कहना है। ‘झूठ बोलना’ वर्तमान हिन्दी का स्वाभाविक प्रयोग है।
theological_decisions:
- issue: इनकार और स्वीकार का विरोधाभासी सम्बन्ध
  choice: दोनों कथनों को बिना व्याख्यात्मक समाधान के समानांतर विरोधाभास के रूप में रखा गया है।
  alternative: वाक्यों को आध्यात्मिक अज्ञान या गुप्त पहचान की किसी विशिष्ट धर्मवैचारिक व्याख्या के अनुसार स्पष्ट करना।
  rationale: मूल पाठ जानबूझकर तनाव और विरोधाभास बनाए रखता है; अनुवाद में किसी सम्प्रदायगत या निजी व्याख्या को आरोपित नहीं करना चाहिए।
- issue: सत्य और झूठ का उलटाव
  choice: ‘सच कहते हैं/झूठ बोलते हैं’ का सीधा और सममित रूप रखा गया है।
  alternative: इसे केवल दिखावे और वास्तविकता के भेद के रूप में व्याख्यायित करना।
  rationale: मूल कथन की पहेली-जैसी अस्पष्टता को सुरक्षित रखना अधिक स्रोत-संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य। ‘अंगीकार’ की अपेक्षा ‘स्वीकार’ चुना गया है ताकि धार्मिक-तकनीकी रंग अनावश्यक रूप से न बढ़े। मूल की चार पंक्तियों वाली समानांतर और विरोधाभासी संरचना सुरक्षित रखी गई है।
