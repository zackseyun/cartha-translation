  rationale: यह रचना विरोधाभासी आत्म-परिचयों से अर्थ रचती है; अनुवाद को उस धार्मिक और काव्यात्मक तनाव को सुरक्षित रखना चाहिए।
- issue: पहली पंक्ति का अस्थिर OCR-पाठ
  choice: ‘जिसके उत्सव बहुत हैं’
  alternative: ‘कुमारी’ अथवा कोई अन्य खंडित पाठ
  rationale: परामर्श-पाठ और प्रचलित पाठ-साक्ष्य के अनुरूप अर्थ दिया गया है, पर OCR से यह पठन पूरी तरह सुरक्षित नहीं, इसलिए पादटिप्पणी जोड़ी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सहज शैली रखी गई है। स्त्री-वक्ता की पहचान ‘वह हूँ’ से बनी रहती है, जबकि विशेषण ‘ईश्वर-विहीन’ और ‘अशिक्षित’ हिन्दी में लिंग-निरपेक्ष रूप से स्वाभाविक हैं। पुनरुक्त ‘मैं—मैं’ मूल के emphatic स्वर को सुरक्षित रखती है।
