base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/051.yaml
  text: 'And I am she whose festivals are many[a]. I, I am a godless one,

    and I am she whose God is great.

    I am the one you have pondered,

    and you have scorned me.

    I am an unlearned one[f][e][d][c][b],

    and they learn.'
translation:
  language: hi
  text: 'और मैं वह हूँ जिसके उत्सव बहुत हैं[a]।


    मैं—मैं ईश्वर-विहीन हूँ,


    और मैं वह हूँ जिसका ईश्वर महान है।


    मैं वही हूँ जिसके विषय में तुमने विचार किया,


    और तुमने मेरा तिरस्कार किया।


    मैं अशिक्षित हूँ,


    और वे सीखते हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पंक्ति उपलब्ध OCR-पाठ में अस्थिर है। सम्भावित सुधारे हुए कॉप्टिक पाठ का अर्थ ‘मैं वह हूँ जिसके उत्सव बहुत हैं’ है; मुद्रित पाठ की जाँच के बिना यह पठन पूर्णतः निश्चित नहीं है।
    reason: पाठालोचनात्मक अनिश्चितता
  - marker: b
    text: कॉप्टिक पद का शाब्दिक भाव ‘शिक्षा ग्रहण करना’ है और यहाँ मुहावरे के रूप में ‘सीखना’ है; अंतिम कण पूर्णता या बल का संकेत दे सकता है।
    reason: शब्दार्थ संबंधी स्पष्टीकरण
lexical_decisions:
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: ईश्वर-विहीन
