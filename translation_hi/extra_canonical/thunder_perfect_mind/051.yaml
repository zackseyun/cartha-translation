- source_word: ⲧⲉⲛϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ
  choice: वह हूँ जिसका ईश्वर महान है
  rationale: OCR-पाठ को संभावित ⲧⲉ ⲛⲁϣⲉ ... के रूप में समझकर ‘जिसका ... महान है’ लिया गया है; इससे पिछले ‘ईश्वर-विहीन’ कथन के साथ समानांतर विरोधाभास बना रहता है।
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: जिसके विषय में तुमने विचार किया
  rationale: कॉप्टिक के resumptive ‘मेरे विषय में’ को स्वाभाविक हिन्दी संबंधवाचक रचना में व्यक्त किया गया है।
- source_word: ϣⲟⲥⲧ
  choice: तिरस्कार किया
  rationale: क्रिया का अर्थ ‘तुच्छ जानना/तिरस्कार करना’ है; इसे ‘लज्जित होना’ नहीं माना गया।
- source_word: ⲁⲧⲥⲃⲱ
  choice: अशिक्षित
  rationale: निषेधात्मक ⲁⲧ- + ‘शिक्षा’ का भाव देता है और अगले ‘शिक्षा पाते हैं’ के साथ शब्दगत संबंध बनाए रखता है।
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ
  choice: शिक्षा पाते हैं
  rationale: शाब्दिक ‘शिक्षा ग्रहण करना’ का स्वाभाविक हिन्दी रूप; ⲉⲃⲟⲗ को अलग से नहीं उकेरा गया क्योंकि यहाँ वह पूर्णता/बल का सूचक हो सकता है।
theological_decisions:
- issue: ‘ईश्वर-विहीन’ और ‘जिसका ईश्वर महान है’ का विरोधाभास
  choice: दोनों दावों को बिना सामंजस्य बैठाए साथ रखा गया
