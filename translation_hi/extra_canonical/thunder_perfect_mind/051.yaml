  terminology: ‘ईश्वर-विहीन,’ ‘ईश्वर,’ ‘तिरस्कार किया,’ and ‘अशिक्षित’ are appropriate and preserve the deliberate tension without importing the modern ideological sense of ‘नास्तिक.’ The textual-critical note on the first line responsibly retains uncertainty.
