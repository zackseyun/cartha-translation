translation:
  language: hi
  text: '**4.** किसी भी स्थान या किसी भी समय मुझसे अनजान न रहो।[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: किसी भी घड़ी।'
    reason: lexical_alternative
  - marker: b
    text: 'कुछ पाठ-साक्ष्य या खंड-विभाजन इस कथन की रचना इस प्रकार सुझाते हैं: “तुम जो सुनते हो, मेरी सुनो … किसी स्थान में या किसी समय में”; इसलिए यहाँ अधिक स्पष्ट रूप से “मेरी सुनो” अनुवाद करना भी संभव है।'
    reason: alignment_note
  - marker: c
    text: 'या: “और किसी भी स्थान या किसी भी समय मुझसे अनजान न रहो।”'
    reason: previous_rendering
lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ
  choice: न रहो
  rationale: निषेधात्मक उपदेश को हिन्दी में सीधे और स्वाभाविक रूप से व्यक्त करता है; ‘मुझसे अनजान’ के साथ यह रचना सहज है।
- source_word: ⲥⲱⲧⲙ
  choice: सुनो
  rationale: दिए गए OCR अंश में क्रिया का स्पष्ट अर्थ ‘सुनना/ध्यान से सुनना’ है; किंतु वर्तमान खंड-निर्धारण अनिश्चित होने के कारण इसे मुख्य पाठ के बजाय पाठ-विभाजन संबंधी पादटिप्पणी में रखा गया है।
- source_word: ⲕⲁⲧⲁ
  choice: में
  rationale: स्थान और समय के वितरणसूचक संदर्भ में हिन्दी का ‘में’ स्वाभाविक समतुल्य है।
- source_word: ⲙⲁ
  choice: स्थान
  rationale: स्थानवाचक संज्ञा का सीधा, गरिमापूर्ण और सामान्य हिन्दी रूप।
- source_word: ⲟⲩⲙⲉⲩⲉ
  choice: समय
  rationale: परामर्श-पाठ के अनुसार स्थान-समय की जोड़ी बनाए रखता है; ‘घड़ी’ एक संभव वैकल्पिक अर्थ है।
- source_word: ⲛⲕⲉ-
  choice: किसी भी / अन्य
  rationale: ‘दूसरा/अन्य’ के अर्थ को वितरणसूचक संदर्भ में ‘किसी भी’ से व्यक्त किया गया है।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: यह सामान्य संयोजक है, पर उपलब्ध अंश का खंड-संरेखण मध्यम विश्वसनीयता का है और इस वाक्य के आरंभ में इसकी स्थिति विवादित है; इसलिए मुख्य पाठ में इसे नहीं रखा, विकल्प पादटिप्पणी में दिया है।
