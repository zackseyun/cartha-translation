base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/064.yaml
  text: 'For she is wise[a], and she is a small one[e][d][c][b];

    nor turn away great things in parts

    from smallness—

    for they know smallness.'
translation:
  language: hi
  text: 'क्योंकि वह बुद्धिमती है[a], और वह छोटी है[b];


    महान बातों को भागों में


    छोटेपन से अलग न करो[c]—


    क्योंकि वे छोटेपन को जानते हैं[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक रूप का अर्थ ‘वह बुद्धिमती है’ है; इसे ‘बुद्धिमान बनो’ जैसी आज्ञा समझना संभव नहीं लगता।
    reason: grammar_clarification
  - marker: b
    text: शाब्दिक रूप से ‘वह एक छोटी [व्यक्ति] है।’ संदर्भ में ‘साधारण’ या ‘अज्ञानी’ का भाव संभव है, पर मूल शब्द का प्राथमिक अर्थ ‘छोटी’ है।
    reason: lexical_alternative
  - marker: c
    text: 'इस कठिन पंक्ति का अधिक निकट रूप है: ‘महान बातों को भागों में छोटेपन से दूर न करो।’ वाक्य-संबंध और ‘भागों में’ की भूमिका कुछ अस्पष्ट हैं; मूल पाठ ‘बाँटने’ की अलग क्रिया स्पष्ट रूप से नहीं कहता।'
    reason: textual_ambiguity
  - marker: d
    text: यहाँ ‘वे’ का पूर्वपद इस छोटे अंश में स्पष्ट नहीं है। क्रिया को ‘जानते हैं’ पढ़ा गया है; पाठ की दूसरी पहचान पर अर्थ बदल सकता है।
