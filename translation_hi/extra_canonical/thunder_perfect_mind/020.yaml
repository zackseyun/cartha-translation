base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/020.yaml
  text: Why[a], you who hate me, do you love me, and hate those who love me? You who deny me, confess me[b], and you who confess me, deny me[e][d][c]. You who say—
translation:
  language: hi
  text: '**15.** तुम जो मुझसे घृणा करते हो, मुझसे प्रेम क्यों करते हो और उनसे घृणा करते हो जो मुझसे प्रेम करते हैं?[a] जो मुझे नकारते हैं, वे मुझे अंगीकार करते हैं[b]; और जो मुझे अंगीकार करते हैं, वे मुझे नकारते हैं[c]। जो कहते हैं—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “क्यों” का आधार ⲉⲧⲃⲉ ⲟⲩ है। आरंभ का ⲡⲁⲣⲁⲛ (“मेरा नाम”) संभवतः पिछली पंक्ति से जुड़ा हुआ अंश है; पाठ-संबंध अनिश्चित होने के कारण उसका अलग अनुवाद नहीं किया गया है।
    reason: textual_alignment_note
  - marker: b
    text: “अंगीकार करते हैं” यूनानी-मूल ϩⲟⲙⲟⲗⲟⲅⲉⲓ का अनुवाद है; “स्वीकार करते हैं” या “खुले रूप से मानते हैं” भी संभव हैं।
    reason: lexical_alternative
  - marker: c
    text: “नकारते हैं” ⲁⲣⲛⲁ का अनुवाद है; प्रसंगानुसार “इनकार करते हैं” या “त्याग देते हैं” भी संभव हैं। दोनों खंड स्रोत में समानांतर सापेक्ष बहुवचन कथन हैं, आदेश नहीं।
    reason: lexical_and_grammatical_note
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: क्यों
  rationale: यह संयुक्त पद स्वाभाविक रूप से प्रश्नवाचक ‘क्यों?’ है; इसे केवल ⲉⲧⲃⲉ मानकर ‘के विषय में’ करना ⲟⲩ की उपेक्षा करेगा।
- source_word: ⲙⲟⲥⲧⲉ
  choice: घृणा करना
  rationale: यह द्वेष के सामान्य क्रियापद का सीधा और वर्तमान हिन्दी रूप है।
- source_word: ⲙⲉ
  choice: प्रेम करना
  rationale: यहाँ ⲙⲉ का अर्थ ‘प्रेम करना’ है, ‘जानना’ नहीं; इससे कथन का जानबूझकर विरोधाभासी तनाव बना रहता है।
- source_word: ⲁⲣⲛⲁ
  choice: नकारना
  rationale: ‘नकारना’ व्यक्ति को अस्वीकार करने का अर्थ संक्षेप में व्यक्त करता है और ‘अंगीकार करना’ के साथ स्पष्ट अलंकारिक विरोध बनाता है।
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: अंगीकार करना
  rationale: यूनानी मूल के इस क्रियापद में स्वीकार या खुली स्वीकृति का भाव है; ‘अंगीकार करना’ हिन्दी में इसकी औपचारिकता और ‘नकारना’ से विरोध दोनों बनाए रखता है।
- source_word: ⲉⲣϩⲟⲙⲟⲗⲟⲅⲉⲓ / ⲉⲣⲁⲣⲛⲁ
  choice: अंगीकार करो / नकार दो
  rationale: ⲉⲣ- वाले रूप आज्ञार्थक हैं; इसलिए इन्हें कथनसूचक न बनाकर स्पष्ट आज्ञार्थक हिन्दी में रखा गया है।
- source_word: ⲛⲉⲧϫⲉ
  choice: तुम जो कहते हो—
  rationale: सापेक्ष पद को संबोधन के रूप में रखा गया है और स्रोत के अधूरे अंत को दीर्घ डैश द्वारा सुरक्षित किया गया है।
theological_decisions:
- issue: विरोधाभासी प्रेम, घृणा, अंगीकार और नकार
  choice: विरोधों को ज्यों का त्यों रखा गया है
  alternative: उन्हें आत्मज्ञान, पाखंड या किसी निश्चित आध्यात्मिक सिद्धांत की व्याख्या के रूप में स्पष्ट करना
  rationale: स्रोत जानबूझकर तनावपूर्ण और विरोधाभासी वाणी देता है; अनुवाद को किसी संप्रदायगत या निजी व्याख्या से उसका अर्थ सीमित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक लय वाला संबोधन अपनाया गया है। ‘तुम जो…’ की पुनरावृत्ति स्रोत के संबोधनात्मक ढाँचे को स्पष्ट करती है। अंतिम वाक्य को अधूरा छोड़ा गया है, क्योंकि उपलब्ध स्रोतांश वहीं कटता है।
