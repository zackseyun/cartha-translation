base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/073.yaml
  text: And in the spirit of every man who exists with me[a], and the women who are in me— I am the honored one[f][e][d][c][b], and the one who is praised.
translation:
  language: hi
  text: '**10.** और मेरे साथ मौजूद हर पुरुष की आत्मा में, और उन स्त्रियों में जो मुझमें हैं—मैं वह हूँ जिसका सम्मान किया जाता है और जिसकी स्तुति[a] की जाती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्तुति’ का अनुवाद ‘आशीष’ भी हो सकता है; कॉप्टिक ⲥⲙⲟⲩ दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲛⲁ ⲛ̄ⲣⲱⲙⲉ
  choice: पुरुष की आत्मा में
  rationale: ⲡⲛⲁ के लिए यहाँ आंतरिक/आत्मिक अर्थ में ‘आत्मा’ स्वाभाविक है; निकटवर्ती ‘मेरे साथ’ और ‘मुझमें’ से स्थानवाचक अभिव्यक्ति का प्रवाह बनता है।
- source_word: ⲣⲱⲙⲉ ⲛⲓⲙ ⲉⲧϣⲟⲟⲡ
  choice: हर उस पुरुष की, जो … है
  rationale: पाठ को ⲣⲱⲙⲉ ⲛⲓⲙ ‘हर पुरुष’ और संबंधवाचक ⲉⲧϣⲟⲟⲡ ‘जो है’ के रूप में समझा गया है। आगे ‘स्त्रियों’ का स्पष्ट उल्लेख होने से यहाँ सामान्य ‘मनुष्य’ के बजाय ‘पुरुष’ रखा गया है।
- source_word: ⲛ̄ⲙⲙⲁⲉⲓ
  choice: मेरे साथ
  rationale: यह ‘साथ होना’ बताने वाली सामान्य साहिदिक अभिव्यक्ति है।
- source_word: ⲛⲓϩⲓⲟⲙⲉ ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: उन स्त्रियों में, जो मुझमें हैं
  rationale: ⲛ̄ϩⲏⲧ को प्रथम पुरुष एकवचन प्रत्यय सहित ‘मुझमें’ समझा गया है, न कि ‘हृदय में’; इससे पिछले ‘मेरे साथ’ के समानांतर रचना सुरक्षित रहती है।
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: जिसका सम्मान किया जाता है
  rationale: इसे ⲧⲁⲉⲓⲟ ‘सम्मान करना’ से बना कर्मवाच्य/गुणवाचक कथन माना गया है; ‘रूप’ अर्थ यहाँ उपयुक्त नहीं है।
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ
  choice: जिसकी स्तुति की जाती है
  rationale: ⲥⲙⲟⲩ क्रिया का अर्थ ‘स्तुति करना/आशीष देना’ है; संदर्भ में ‘स्तुति’ सम्मान के समानांतर अधिक स्वाभाविक है।
theological_decisions:
- issue: वक्ता के आत्मपरक कथन का स्वर
  choice: मैं वही हूँ जिसका सम्मान किया जाता है और जिसकी स्तुति की जाती है
  alternative: मैं सम्मानित और स्तुत्य हूँ
  rationale: संबंधवाचक रचना मूल के ‘वह जो…’ वाले आत्मपरक और औपचारिक स्वर को बनाए रखती है तथा किसी अतिरिक्त धर्मवैधानिक अर्थ को नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पुरुष/स्त्रियाँ’ मूल की लैंगिक समानांतरता को बनाए रखते हैं। लंबा वाक्य और डैश वक्ता की घोषणात्मक, काव्यात्मक लय को सुरक्षित रखते हैं।
