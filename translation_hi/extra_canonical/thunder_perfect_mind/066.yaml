translation:
  language: hi
  text: '**3.** और तुम मेरा आदर करते हो[a]। तुमने मुझे तुच्छ जाना, और तुमने मुझे देखा[b]। पहली चीज़ों को तितर-बितर मत करो[c] […] मनन मत करो[d] […] तुम्हारे अंग[e] […]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक ⲧⲁⲉⲓⲟ का अर्थ यहाँ “आदर करना” या “सम्मान देना” है। पहले प्रस्तावित “आलिंगन करना” इस पंक्ति के उपलब्ध कॉप्टिक से समर्थित नहीं है।
    reason: lexical_correction
  - marker: b
    text: “तुमने मुझे देखा” वाली जगह OCR अपूर्ण या त्रुटिपूर्ण है; अनुवाद दृश्यमान अक्षरों और संभावित क्रियारूप पर आधारित है।
    reason: textual_uncertainty
  - marker: c
    text: “पहली चीज़ें” का आशय स्पष्ट नहीं है; “आरम्भिक बातें” या “आरम्भ” भी संभव हैं।
    reason: lexical_ambiguity
  - marker: d
    text: इसके बाद पांडुलिपि-पाठ खंडित है, इसलिए यह स्पष्ट नहीं कि किस बात पर मनन न करने को कहा गया है।
    reason: lacuna
  - marker: e
    text: कॉप्टिक शब्द का अर्थ “अंग” या “शरीर के अवयव” हो सकता है; आसपास का वाक्य खंडित है।
    reason: lexical_and_textual_uncertainty
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲟ
  choice: आदर करना
  rationale: यहाँ क्रिया का सामान्य और संदर्भानुकूल अर्थ ‘आदर करना/सम्मान देना’ है। उपलब्ध कॉप्टिक पंक्ति में ‘आलिंगन करना’ अर्थ के लिए पर्याप्त आधार नहीं है।
- source_word: ϣⲱϥ
  choice: तुच्छ जानना
  rationale: ⲁⲧⲉⲧⲛ- को द्वितीय पुरुष बहुवचन पूर्णकालिक उपसर्ग मानते हुए क्रिया को ‘तुमने तुच्छ जाना’ किया गया है; इसे privative ⲁⲧ- मानकर ‘निर्लज्ज’ करना व्याकरणतः अनुचित होगा।
- source_word: ⲛⲁ
  choice: देखा
  rationale: OCR में रूप अपूर्ण या त्रुटिपूर्ण जान पड़ता है, पर वाक्य-विन्यास और प्रमाण इसे ‘तुमने मुझे देखा’ की ओर संकेत करते हैं; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: तितर-बितर करना
  rationale: निषेधात्मक ⲙⲡⲣ- के साथ यह प्रसंग ‘मत तितर-बितर करो/मत बिखेरो’ देता है, ‘मत डरो’ नहीं।
- source_word: ⲛⲛϣⲟⲣⲡ
  choice: पहली चीज़ों को
  rationale: बहुवचन विशेषण का संज्ञात्मक प्रयोग है; ‘आरम्भों’ संभव है, पर ‘पहली चीज़ें’ मूल की व्यापक और कुछ अस्पष्ट अभिव्यक्ति को बचाता है।
- source_word: ⲙⲉⲗⲉⲧⲁ
  choice: मनन करना
  rationale: यूनानी मूल की इस उधार क्रिया का अर्थ ‘मनन करना/विचार में लगे रहना’ हो सकता है। आगे का पाठ खंडित होने के कारण कर्म नहीं जोड़ा गया।
- source_word: ⲗⲁⲁⲧⲉ
  choice: अंग
  rationale: ‘अंग’ शारीरिक अर्थ को स्वाभाविक हिन्दी में रखता है और ‘सदस्य’ के सामुदायिक अर्थ से बचता है।
