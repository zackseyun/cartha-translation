  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। बहुवचन ‘तुम’ को बनाए रखा गया है। जहाँ OCR या पांडुलिपि खंडित है वहाँ कोष्ठकित त्रिबिंदु रखे गए हैं और अनुमान से वाक्य पूरा नहीं किया गया।
