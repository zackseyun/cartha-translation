- issue: खंडित पाठ में वक्ता के विरोधाभासी सम्मान और तिरस्कार का संबंध
  choice: दोनों कथनों को बिना सामंजस्य बैठाए साथ रखा गया
  alternative: इन्हें लज्जा/निर्लज्जता के धार्मिक विरोधाभास के रूप में पुनर्निर्मित करना
  rationale: उपलब्ध कॉप्टिक वास्तव में ‘आदर’ और ‘तुच्छ जानने’ की क्रियाएँ देता है; पाठ की तनावपूर्ण वाणी को किसी विशेष धार्मिक व्याख्या से नहीं सुलझाया गया।
- issue: ‘पहली चीज़ों’ का आशय
  choice: अर्थ को खुला रखा गया
  alternative: इसे ‘आदि तत्त्वों’, ‘आरम्भों’ या किसी विशिष्ट ब्रह्माण्ड-विज्ञान संबंधी सत्ता के रूप में प्रस्तुत करना
  rationale: खंडित संदर्भ किसी तकनीकी धर्मवैज्ञानिक अर्थ को निश्चित नहीं करता।
