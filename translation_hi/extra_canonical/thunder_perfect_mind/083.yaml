  yaml_path: translation/extra_canonical/thunder_perfect_mind/083.yaml
  text: 'I am the division and the stripping[a].

    I am the dwelling[c].

    And I am the robbery; I am

    the one who sees what comes

    down to me.

    I am the flight of the release[d][b][a][d][c][b].

    I am I.'
translation:
  language: hi
  text: '**8.** मैं विभाजन और उतारना[a] हूँ।


    मैं निवास हूँ।


    और मैं लूट[b] हूँ; मैं वह हूँ


    जो मेरी ओर नीचे आता है।


    मैं मुक्ति का पलायन[c] हूँ।


    मैं—मैं हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन दोनों कॉप्टिक शब्दों का अर्थ निश्चित नहीं है। पहले के लिए ‘विभाजन/अलगाव’ और दूसरे के लिए ‘उतारना, निर्वसन, या वंचित करना’ सम्भव हैं; ‘भीतर और बाहर’ भी प्रस्तावित हुआ है, पर वह शब्दार्थ की दृष्टि से कम निश्चित है।
    reason: lexical_alternative
  - marker: b
    text: यह शब्द ‘चुराना/लूटना’ से संबंधित समझा गया है; इसलिए यहाँ ‘लूट’ है। इसे ‘बाहर’ समझना संभवतः समान दिखनेवाले दूसरे शब्द के साथ गलत संबंध पर आधारित है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘मुक्ति/छोड़ दिए जाने का पलायन’। संबंधसूचक रचना अस्पष्ट है; अर्थ ‘मुक्ति से पलायन’ भी हो सकता है। पुराने अनुवाद में इसे ‘वह ज्योति जो नहीं बुझी’ समझा गया था, पर ⲫⲱⲧ का अर्थ यहाँ ‘पलायन’ है, ‘ज्योति’ नहीं।
    reason: textual_and_lexical_note
