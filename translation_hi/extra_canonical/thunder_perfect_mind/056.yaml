  rationale: दो विरोधाभासी घोषणाओं को जोड़ने वाला साधारण समुच्चयबोधक।
- source_word: ⲡⲁⲓ … (relative construction)
  choice: मैं वह हूँ जो … / मैं वह हूँ जिसके …
  rationale: बार-बार आने वाली प्रथम-पुरुष स्त्री-वाचक घोषणा और दोनों पंक्तियों की समानांतर संरचना सुरक्षित रहती है।
