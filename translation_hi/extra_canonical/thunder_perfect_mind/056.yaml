translation:
  language: hi
  text: '**11.** मैं वह हूँ जो कोई पर्व नहीं मनाती[a],

    और मैं वह हूँ जिसके पर्व बहुत हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पर्व” का अनुवाद “उत्सव” भी किया जा सकता है; यहाँ यूनानी आगंतुक शब्द ἑορτή निहित है।
    reason: lexical_alternative
  - marker: b
    text: “बहुत हैं” का अर्थ “बहुतायत में हैं” या “संख्या में बहुत हैं” भी हो सकता है; यह ⲕⲁϩ के अनिश्चित वाचन पर निर्भर है।
    reason: lexical_alternative
