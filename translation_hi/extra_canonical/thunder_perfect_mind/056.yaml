  rationale: निषेधात्मक रचना और यूनानी आगंतुक शब्द ἑορτή के धार्मिक-सामुदायिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। स्त्रीलिंग क्रिया वक्ता की स्त्री-वाणी को बनाए रखती है।
