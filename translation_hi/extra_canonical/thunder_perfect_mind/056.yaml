  rationale: पाठ का वाचन अस्थायी है, पर समानांतर विरोधाभास में बहुलता या प्रचुरता का भाव सबसे उपयुक्त है। ‘बहुत हैं’ मूल की संभावित अर्थ-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ⲁⲩⲱ
