translation:
  language: hi
  text: उनके मुँह बंद कर दो[a]! उनके तुम्हें पकड़ लेने से पहले ही उनका न्याय करो, क्योंकि अन्याय का न्यायाधीश तुम्हारे बीच मौजूद है। यदि तुम्हें उस जन के आगमन पर मुक्त किया जाए जो तुम्हें मुक्त करेगा,[b] या यदि तुम स्वयं को मुक्त करोगे…[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक शब्द का OCR-पाठ अस्पष्ट है। पांडुलिपि-संदर्भ के आधार पर इसे ‘उनके मुँह बंद कर दो’ पढ़ा गया है; ‘मैं वह हूँ जो पुकारती है’ इस अंश से मेल नहीं खाता।
    reason: textual_ocr_correction
  - marker: b
    text: 'शाब्दिक रूप के निकट: ‘उसके आने में/आगमन में, जो तुम्हें मुक्त करेगा।’'
    reason: lexical_syntax_note
  - marker: c
    text: यहाँ उपलब्ध अंश अधूरा समाप्त होता है; इसलिए वाक्य को त्रिबिंदु के साथ खुला रखा गया है।
    reason: fragment_note
lexical_decisions:
- source_word: ⲭⲣⲱ
  choice: मुँह बंद कर दो
  rationale: प्रारंभिक OCR-पाठ ⲭⲣⲟⲉⲓ भ्रामक है; पांडुलिपि-पठन और वाक्य-संदर्भ इसे मुँह बंद कराने की आज्ञा के रूप में समर्थन देते हैं, न कि ‘मैं पुकारती हूँ’ के रूप में।
- source_word: ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ
  choice: उनका न्याय करो
  rationale: यूनानी-मूलक क्रिया ⲕⲣⲓⲛⲉ न्याय करने/निर्णय देने का अर्थ रखती है; कर्मवाचक सर्वनाम ‘उनका’ है।
- source_word: ⲧⲁϩⲉ ⲉⲣⲱⲧⲛ
  choice: तुम्हें पकड़ लेना
  rationale: यहाँ क्रिया के पहुँचने, धर लेने या पकड़ लेने के अर्थ में ‘पकड़ लेना’ स्वाभाविक है और आसन्न खतरे को बनाए रखता है।
- source_word: ⲡⲉⲕⲣⲓⲧⲏⲥ ⲙⲡϫⲓ ⲛϭⲟⲛⲥ
  choice: अन्याय का न्यायाधीश
  rationale: संबंधवाचक रचना को औपचारिक रूप से रखा गया है; यह ‘अन्यायी न्यायाधीश’ से अलग संभावित अर्थ-संबंध को सुरक्षित रखती है।
- source_word: ⲕⲁ … ⲉⲃⲟⲗ
  choice: मुक्त करना
  rationale: इस प्रसंग में क्रिया किसी को छोड़ने या मुक्त करने की है; ‘बाहर फेंकना’ संदर्भ के विपरीत होगा।
- source_word: ϩⲙ ⲡϫⲓⲛⲓ
  choice: आगमन पर
  rationale: यहाँ पद ‘आने/आगमन’ की संज्ञात्मक रचना है, ‘धरती के मुख पर’ नहीं।
theological_decisions:
- issue: ‘अन्याय का न्यायाधीश’ किसे सूचित करता है
  choice: संबंधवाचक और नैतिक अस्पष्टता बनाए रखी गई
  alternative: अन्यायी न्यायाधीश
  rationale: कॉप्टिक पदबंध ‘अन्याय का न्यायाधीश’ कहता है; विशेषण बनाकर किसी एक धर्मवैचारिक पहचान को निश्चित करना उचित नहीं।
- issue: मुक्ति में कर्ता और मानवीय सहभागिता
  choice: दैवी/बाहरी मुक्तिदाता और आत्म-मुक्ति दोनों अधूरे विकल्पों के रूप में रखे गए
  alternative: केवल बाहरी उद्धारकर्ता द्वारा मुक्ति
  rationale: खंडित पाठ स्वयं ‘जो तुम्हें मुक्त करेगा’ और ‘यदि तुम अपने आपको मुक्त करते हो’ को साथ रखता है; इस तनाव को सुलझाया नहीं गया।
translation_notes:
  register: आज्ञार्थक आरंभ को तीखा और सीधा रखा गया है। ‘तुम’ बहुवचन है। भाषा आधुनिक, गरिमापूर्ण और सुबोध है; खंडित स्रोत, OCR-सुधार और वाक्य की वास्तविक अपूर्णता स्पष्ट की गई है।
