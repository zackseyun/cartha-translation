base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/048.yaml
  text: And you have called me “Lawlessness.” I am she whom you pursued[a]; and I am the one you have seized; I am she whom you scattered[g][f][e][d][c][b], and you have known.
translation:
  language: hi
  text: 'और मुझे “व्यवस्थाहीनता” मत कहो।[a]


    मैं वही हूँ, जिसका तुमने पीछा किया;


    और मैं वही हूँ, जिसे तुमने पकड़ लिया।


    मैं वही हूँ, जिसे तुमने तितर-बितर किया,


    और तुमने मुझे जाना।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “व्यवस्थाहीनता” यूनानी मूल anomia का अनुवाद है; इसके अन्य संभव रूप “कानून-विहीनता” या “कानून-भंग” हैं।
    reason: lexical_alternative
  - marker: b
    text: प्रदत्त OCR-पाठ में क्रिया का अर्थ “जाना” है और वाक्य सकारात्मक है। निकट अक्षर-पाठ के आधार पर कुछ लोग यहाँ “इकट्ठा किया” सम्भव मान सकते हैं, जो “तितर-बितर किया” के साथ विरोधी समानांतर बनाता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: ⲙⲟⲩⲧⲉ
  choice: कहा
  rationale: यह क्रिया किसी को पुकारने या कोई नाम देने के अर्थ में है। हिन्दी में आरोपसूचक उपाधि के साथ “मुझे … कहा” सबसे स्वाभाविक है।
- source_word: ⲁⲛⲟⲙⲓⲁ
  choice: व्यवस्थाहीनता
  rationale: यूनानी मूल anomia का अर्थ कानून या व्यवस्था का अभाव अथवा उल्लंघन है। “व्यवस्थाहीनता” अमूर्त आरोपसूचक नाम को बनाए रखता है और “अधर्म” के अतिरिक्त धार्मिक अर्थभार से बचता है।
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: जिसका तुमने पीछा किया
  rationale: ⲛⲥⲱⲥ स्त्रीलिंग पूर्ववर्ती को फिर से ग्रहण करता है; इसलिए इसे वक्ता के संदर्भ में स्वाभाविक हिन्दी संबंधवाचक वाक्य बनाया गया है, न कि अलग सर्वनाम या OCR-दोष माना गया है।
- source_word: ⲙⲁϩⲧⲉ
  choice: पकड़ लिया
  rationale: क्रिया पकड़ने, अधिकार में लेने या धर लेने का भाव देती है। “पकड़ लिया” सामान्य पाठक के लिए स्पष्ट है और बलपूर्ण अर्थ बनाए रखता है।
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
  choice: तितर-बितर किया
  rationale: यहाँ ϫⲟⲟⲩ का अर्थ बाहर भेजना या बिखेरना है; इसे ϫⲱ, ‘कहना/पुकारना,’ से अलग रखा गया है। स्त्रीलिंग प्रत्यय वक्ता की ओर संकेत करता है।
- source_word: ⲥⲟⲟⲩⲛ
  choice: जाना
  rationale: प्रदत्त पाठ में यह ‘जानना’ है और क्रिया सकारात्मक पूर्ण रूप में है। संभावित वैकल्पिक अक्षर-पाठ को मुख्य पाठ में चुपचाप नहीं अपनाया गया।
theological_decisions:
- issue: ⲁⲛⲟⲙⲓⲁ के आरोपसूचक नाम का धार्मिक अर्थभार
  choice: व्यवस्थाहीनता
  alternative: अधर्म / कानून तोड़ने वाली
  rationale: अमूर्त संज्ञा और कथन की विडंबनापूर्ण तनातनी सुरक्षित रहती है, जबकि कोई विशिष्ट पापशास्त्रीय व्याख्या पाठ पर आरोपित नहीं होती।
- issue: अंतिम क्रिया का अर्थ
  choice: और तुमने जाना
  alternative: और तुमने इकट्ठा किया
  rationale: प्रदत्त कॉप्टिक OCR में सकारात्मक ⲥⲟⲟⲩⲛ ‘जानना’ है। ‘तितर-बितर किया/इकट्ठा किया’ का समांतर पाठ आकर्षक है, पर वह संभावित अक्षर-संशोधन पर निर्भर करता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और काव्यात्मक पुनरावर्तन रखा गया है। स्त्री वक्ता के लिए “मैं वही हूँ” तथा संबंधवाचक रूपों का प्रयोग किया गया है। विराम-चिह्न मूल की क्रमिक घोषणात्मक लय को स्पष्ट करते हैं।
