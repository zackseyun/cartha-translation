  yaml_path: translation/extra_canonical/thunder_perfect_mind/084.yaml
  text: '...is the one who sees what comes before me[A]. I am the light.

    I have not gone out — I, I —.B

    a non-darkness and the root of darkness is from within me.

    I am the desire of a vision,

    and the self-control of the heart that exists within me[d][c][b][a][E][D][C][B],

    I am the hearing that is acceptable to everyone.'
translation:
  language: hi
  text: '**9.** …वही है जो उसे देखता है जो मेरे सामने आता है।[a]


    मैं प्रकाश हूँ।


    मैं बाहर नहीं निकली हूँ—मैं, मैं।[b]


    मैं अंधकार-रहित हूँ,


    और अंधकार की जड़ मेरे भीतर से है।


    मैं एक दर्शन की अभिलाषा हूँ,


    और हृदय का वह आत्म-संयम, जो मेरे भीतर है।


    मैं वह श्रवण हूँ जो सबको स्वीकार्य है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अंश के लिए अपेक्षित संरेखण में ‘निकट/दूर’ वाला विरोधाभास बताया गया है, पर उपलब्ध कॉप्टिक OCR-पाठ में प्रकाश, अंधकार और मानवीय क्षमताओं का यह क्रम है। अनुवाद उपलब्ध कॉप्टिक पाठ का अनुसरण करता है; आरम्भ भी खंडित है।
    reason: alignment_note
