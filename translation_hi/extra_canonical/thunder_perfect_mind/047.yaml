base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/047.yaml
  text: 'Among the peoples[a], they have named me “Death.”

    I am she whom they call “Law,” and you have called me “Lawlessness.”

    I am she whom you pursued, and I am she whom you seized.'
translation:
  language: hi
  text: 'हर जगह[a] मैं वही हूँ जिसे वे “मृत्यु” कहते हैं।


    मैं वही हूँ जिसे वे “विधि” कहते हैं, और तुमने मुझे “विधिहीनता” कहा है।


    मैं वही हूँ जिसका तुमने पीछा किया, और मैं वही हूँ जिसे तुमने पकड़ लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पाठ को “लोगों के बीच” भी समझा गया है; OCR में शब्द-विभाजन अनिश्चित है।
    reason: ϩⲛⲙⲁⲛⲓⲙ का संभावित विभाजन ϩⲛ ⲙⲁ ⲛⲓⲙ (‘हर जगह’) है, पर उपलब्ध OCR-आधारित साक्ष्य में वैकल्पिक सामूहिक/सामाजिक पठन को पूरी तरह नकारना उचित नहीं।
lexical_decisions:
- source_word: ϩⲛⲙⲁⲛⲓⲙ
  choice: हर जगह
  rationale: इसे ϩⲛ ⲙⲁ ⲛⲓⲙ (‘हर स्थान में/हर जगह’) के रूप में विभाजित करना सहज कॉप्टिक पाठ देता है। OCR और शब्द-विभाजन की अनिश्चितता के कारण वैकल्पिक सामाजिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: ⲙⲟⲩⲧⲉ
  choice: कहते हैं / कहा है
  rationale: नाम देने या किसी उपाधि से पुकारने का अर्थ है। हिन्दी में उद्धृत नामों के साथ ‘कहना’ स्वाभाविक है; काल-भेद के द्वारा habitual ϣⲁⲩⲙⲟⲩⲧⲉ और perfect ⲁⲧⲉⲧⲛⲙⲟⲩⲧⲉ का अंतर रखा गया है।
- source_word: ⲡⲙⲟⲩ
  choice: मृत्यु
  rationale: निश्चित पद को यहाँ कथित नाम या उपाधि के रूप में प्रस्तुत किया गया है।
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: विधि
  rationale: ग्रीक νόμος से आए कानूनी पद का संक्षिप्त और गरिमापूर्ण हिन्दी रूप; अगले विरोधी पद के साथ शब्दगत समानांतरता भी बनाए रखता है।
- source_word: ⲧⲁⲛⲟⲙⲓⲁ
  choice: विधिहीनता
  rationale: ἀνομία का ऐसा रूप जो ‘विधि’ के साथ मूल पाठ की जानबूझकर रखी गई विरोधी शब्द-युग्मता को बचाता है; ‘अधर्म’ अर्थ को संकरा और धार्मिक रूप से अधिक व्याख्यायित कर देता।
- source_word: ⲁⲛⲟⲕ ⲧⲉ …
  choice: मैं वही हूँ …
  rationale: कॉप्टिक स्त्रीलिंग copular formula की पुनरावृत्ति और ‘मैं हूँ’ शैली को स्वाभाविक हिन्दी में रखा गया है। ‘मैं वह स्त्री हूँ’ कहना मूल से अधिक स्पष्ट जैविक पहचान जोड़ देता।
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: पीछा किया
  rationale: शाब्दिक ‘पीछे दौड़ना’ का स्वाभाविक हिन्दी मुहावरा, जो लक्ष्य बनाकर पीछा करने का भाव रखता है।
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: पकड़ लिया
  rationale: पकड़ने या अधिकार में लेने का ठोस अर्थ रखता है और ‘पीछा किया’ के बाद क्रियात्मक क्रम को स्वाभाविक बनाता है।
theological_decisions:
- issue: νόμος और ἀνομία का विरोध
  choice: “विधि” और “विधिहीनता”
  alternative: “कानून” और “अराजकता”; अथवा “व्यवस्था” और “अधर्म”
  rationale: मूल के निकट शब्दगत विरोध को बनाए रखा गया है और इसे किसी विशेष धार्मिक विधान या पाप-सिद्धांत के रूप में सीमित नहीं किया गया।
- issue: वक्ता के व्याकरणिक स्त्रीलिंग का हिन्दी रूप
  choice: “मैं वही हूँ”
  alternative: “मैं वह स्त्री हूँ”
  rationale: संदर्भगत स्त्री-वक्ता से संगत रहते हुए हिन्दी में अनावश्यक रूप से ‘स्त्री’ शब्द जोड़ने से बचता है; इस अंश का मुख्य बल पहचान-सूत्र की पुनरावृत्ति पर है।
translation_notes:
  register: आधुनिक मानक हिन्दी; लयात्मक और गरिमापूर्ण, पर सामान्य पाठक के लिए सहज। तीनों वाक्यों में ‘मैं वही हूँ’ की आवृत्ति जानबूझकर रखी गई है ताकि मूल की अनाफोरिक ‘I am’ शैली बनी रहे। उद्धरण-चिह्न कथित नामों/उपाधियों को स्पष्ट करते हैं।
