  alternative: इसे विनाश, अभाव, दरिद्रता या किसी नामित आध्यात्मिक लोक के रूप में स्पष्ट करना।
  rationale: स्रोत रूपकात्मक और अर्थतः अस्पष्ट है; धर्मवैचारिक निष्कर्ष जोड़ना उचित नहीं।
