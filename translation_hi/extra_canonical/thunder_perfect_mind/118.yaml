  text: 'And there are ignorances,

    and passions that are about to come,

    and pleasures toward you[a],

    and a power that you will take[b],

    a clear‑mindedness[c]—

    they will run up into their emptiness[d].'
translation:
  language: hi
  text: 'और अज्ञानताएँ हैं,

    और आनेवाले आवेग,

    और कुछ समय के लिए सुख-विलास[a],

    जो उन पर आ पड़ेंगे[b],

    जब तक वे होश में न आएँ[c]

    और दौड़कर ऊपर अपने खालीपन में न चले जाएँ[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पांडुलिपि की पंक्ति के अंत का ⲡⲉ और अगली पंक्ति का ⲟⲩⲉⲓϣ मिलकर ⲡⲉⲟⲩⲉⲓϣ, ‘समय’, बन सकते हैं। इसलिए वाक्यांश का अनुवाद ‘कुछ समय के लिए’ किया गया है; इसे ‘तुम्हारी ओर’ पढ़ना भी प्रस्तावित हुआ है, पर उसके लिए कर्म स्पष्ट नहीं है।
    reason: खंडित पंक्ति और वैकल्पिक पद-विभाजन
  - marker: b
    text: इस क्रियारूप और सर्वनाम का पाठ कठिन है। यहाँ अर्थ ‘जो उन पर आ पड़ेंगे’ लिया गया है; इसे ‘जिसे तुम लोग ग्रहण करोगे’ भी समझा जा सकता है।
    reason: वैकल्पिक व्याकरणिक पाठ
  - marker: c
    text: 'मूल रूप क्रियात्मक है: ‘जब तक वे सचेत/संयमी न हो जाएँ।’ ‘होश में आएँ’ उसी भाव को सामान्य हिन्दी में व्यक्त करता है।'
    reason: शाब्दिक रूप और अर्थ-सीमा
  - marker: d
    text: ⲕⲏⲛⲏ को यहाँ ‘खालीपन’ समझा गया है; ‘अभाव’ या ‘दरिद्रता’ भी संभव है।
    reason: शब्दार्थ का विकल्प
