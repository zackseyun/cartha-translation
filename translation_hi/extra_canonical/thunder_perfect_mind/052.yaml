base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/052.yaml
  text: 'I am the one you have thought about[a],

    and you have mocked me.

    I am unlearned, and from me they learn.

    I am she whom you have scorned[g][f][e][d][c][b],

    and you think about me.'
translation:
  language: hi
  text: 'मैं वही हूँ जिसके बारे में तुमने सोचा,


    और तुमने मेरा उपहास किया।


    मैं अशिक्षित हूँ[a], और वे मुझसे सीखते हैं।


    मैं वही स्त्री हूँ जिस स्त्री का तुमने तिरस्कार किया[b],


    और तुम मेरे बारे में सोचते हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अशिक्षित” का अनुवाद “अनपढ़” या “अज्ञानी” भी हो सकता है, पर उन शब्दों में अधिक नकारात्मक भाव आ सकता है।
    reason: lexical_alternative
  - marker: b
    text: “तिरस्कार किया” का अनुवाद “तुच्छ समझा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ
  choice: मैं … हूँ
  rationale: बार-बार आने वाले प्रथम-पुरुष कथन और उनकी अधिकारपूर्ण काव्यात्मक लय को बनाए रखता है।
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ / ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: मेरे बारे में सोचना
  rationale: पूर्वसर्ग सहित पद का सीधा अर्थ विचार का विषय ‘मैं’ होना है; दोनों स्थानों पर एक ही अभिव्यक्ति रखने से जानबूझकर की गई पुनरावृत्ति बचती है।
- source_word: ⲁⲧⲉⲧⲛϣⲟⲥⲧ
  choice: तुमने मेरा उपहास किया
  rationale: इसे ϣⲱⲥ ‘उपहास करना/अपमान करना’ से बना पूर्णकालिक मुख्य उपवाक्य माना गया है; इसे ‘छिपाया’ या संबंधवाचक उपवाक्य बनाना उचित नहीं है।
- source_word: ⲁⲧⲥⲃⲱ
  choice: अशिक्षित
  rationale: ⲁⲧ- द्वारा नकारे गए ⲥⲃⲱ के ‘सीखा हुआ/ज्ञानयुक्त’ अर्थ को व्यक्त करता है और ‘अज्ञानी’ की अपेक्षा अनावश्यक रूप से कम अपमानजनक है।
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ ⲛ̄ⲧⲟⲟⲧ
  choice: वे मुझसे सीखते हैं
  rationale: शाब्दिक ‘मेरे पास से/मुझसे’ वाले मुहावरे को सहज हिन्दी में रखता है और वाच्य को अनावश्यक रूप से कर्मवाच्य नहीं बनाता।
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: तिरस्कार किया
  rationale: यूनानी मूल के इस क्रियापद का अवमानना और नीचा समझने का भाव स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: ⲁⲩⲱ
  choice: और / फिर भी
  rationale: अधिकांश स्थानों पर सामान्य संयोजक ‘और’ रखा गया है; अशिक्षित होने और दूसरों के उससे सीखने के स्पष्ट विरोधाभास को सहज हिन्दी में उभारने के लिए एक स्थान पर ‘फिर भी’ चुना गया है।
theological_decisions:
- issue: वक्ता का स्त्रीलिंग आत्म-निर्देश
  choice: मैं वही स्त्री हूँ
  alternative: मैं वही हूँ
  rationale: ⲁⲛⲟⲕ ⲧⲉ में स्त्रीलिंग सहायक और आगे स्त्रीलिंग संबंधवाचक रचना स्पष्ट है; हिन्दी में ‘स्त्री’ जोड़ने से स्रोत का यह संकेत सुरक्षित रहता है।
- issue: अशिक्षित होकर भी शिक्षा का स्रोत होने का विरोधाभास
  choice: विरोधाभास को जस का तस रखा गया
  alternative: वक्ता को ‘अनपढ़ समझी जाने वाली’ कहना
  rationale: स्रोत सीधे ‘मैं अशिक्षित हूँ’ कहता है; इसे केवल दूसरों की धारणा बताना पाठ के धर्मवैचारिक तनाव को चुपचाप हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। बहुवचन द्वितीय पुरुष के लिए सहज ‘तुम’ प्रयोग हुआ है। पंक्ति-विन्यास मूल के आवर्ती घोषणात्मक स्वर को उभारता है। अंतिम अधूरा ⲁⲛⲟⲕ ⲡⲉⲛ अगले खंड का आरंभ प्रतीत होता है, इसलिए उसे इस खंड के मुख्य पाठ में पूरा करके नहीं जोड़ा गया।
