base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/017.yaml
  text: I am the servant of the one who prepared me[a]. I am the ruler of my offspring[d][c][b]. But he is the one who begot me before the day of my birth.
translation:
  language: hi
  text: '**12.** मैं उसकी सेविका हूँ जिसने मुझे तैयार किया। मैं अपनी संतान की स्वामिनी हूँ। पर वही है जिसने मेरे जन्म के दिन से पहले मुझे जन्म दिया[a]।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जन्म दिया” वाला शब्द पांडुलिपि के क्षतिग्रस्त भाग की पुनर्स्थापना है; प्रसंग और बचे हुए अक्षर इस पाठ का समर्थन करते हैं।
    reason: textual_reconstruction
  - marker: b
    text: “वही” के लिए मूल कॉप्टिक में पुल्लिंग संकेतक है, यद्यपि हिन्दी सर्वनाम स्वयं लिंग प्रकट नहीं करता।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ⲧϩⲙϩⲁⲗ
  choice: सेविका
  rationale: यह शब्द सेवा करने वाले व्यक्ति को सूचित करता है; कॉप्टिक व्याकरण में वक्ता स्त्रीलिंग है, इसलिए हिन्दी में स्त्रीलिंग रूप रखा गया है। ‘दासी’ भी संभव है, पर वह कानूनी दासता का अधिक विशिष्ट भाव ला सकता है।
- source_word: ⲡⲉⲛⲧⲁϥⲥⲃⲧⲱⲧ
  choice: जिसने मुझे तैयार किया
  rationale: ⲥⲃⲧⲱⲧ का मूल अर्थ तैयार करना या प्रस्तुत होने योग्य बनाना है। ‘रचा’ कहना सृष्टि या जन्म का अर्थ अनावश्यक रूप से जोड़ देता।
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: स्वामिनी
  rationale: यह अधिकार या प्रभुत्व रखने वाली स्त्री का पद है। ‘स्वामिनी’ स्त्रीलिंग और अधिकार—दोनों को स्पष्ट रखता है।
- source_word: ⲙⲛⲧϣⲏⲣⲉ
  choice: संतान
  rationale: यह ϣⲏⲣⲉ (‘बालक/संतान’) से बना सामूहिक या अमूर्त संज्ञा-रूप है; ‘संतान’ एकवचन और सामूहिक दोनों अर्थों को खुला रखता है।
- source_word: '[ϫⲡⲟⲉⲓ]'
  choice: मुझे जन्म दिया
  rationale: पांडुलिपि के क्षतिग्रस्त अंश की स्वीकृत पुनर्स्थापना जन्म देने/उत्पन्न करने का अर्थ देती है और वक्ता के अपनी ही संतान से जन्म पाने के जानबूझकर रखे गए विरोधाभास को सुरक्षित रखती है।
- source_word: ϩⲁⲧⲉϩⲏ ⲙⲡⲉϩⲟⲟⲩ ⲙⲡⲁϫⲡⲟ
  choice: मेरे जन्म के दिन से पहले
  rationale: यह कालगत वाक्यांश सीधे तौर पर वक्ता के जन्म-दिन से पूर्व की बात कहता है; हिन्दी क्रम मूल विरोधाभास को सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: वक्ता और उसकी संतान के बीच उलटा जन्म-संबंध
  choice: ‘मैं अपनी संतान की स्वामिनी हूँ। पर वही है जिसने ... मुझे जन्म दिया’
  alternative: संबंध को तार्किक बनाने के लिए ‘वही’ को किसी अन्य पात्र से जोड़ना
  rationale: मूल पाठ जानबूझकर संतान पर अधिकार और उसी से पहले जन्म पाने का तनाव रखता है। अनुवाद उस विरोधाभास को हल नहीं करता।
- issue: जन्म देने वाले का लिंग
  choice: मुख्य पाठ में लिंग-निरपेक्ष हिन्दी सर्वनाम ‘वही’ और पादटिप्पणी में कॉप्टिक पुल्लिंग का उल्लेख
  alternative: ‘वह पुरुष ही’ या ‘वही पुरुष’
  rationale: कॉप्टिक संकेतक पुल्लिंग है, पर हिन्दी में उसे ‘पुरुष’ कहकर व्यक्त करना अनावश्यक रूप से जैविक या व्यक्तिगत पहचान निश्चित कर देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी अपनाई गई है। स्त्री वक्ता को ‘सेविका’ और ‘स्वामिनी’ से स्पष्ट किया गया है। काव्यात्मक विरोधाभास को सरल करके मिटाया नहीं गया। उपलब्ध OCR अंश इस खंड से असंरेखित है; इसलिए नवीन स्रोत-समीक्षा में पहचाने गए NHC VI.2, 14:4–8 के वास्तविक कॉप्टिक पाठ को आधार बनाया गया है।
