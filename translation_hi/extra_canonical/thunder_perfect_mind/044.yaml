base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/044.yaml
  text: I am she — the Greek and the barbarian[a][c][d]; I am she who will be manifest[b] in Egypt.
translation:
  language: hi
  text: मैं वही हूँ—यूनानी और गैर-यूनानी[a][c][d]; मैं वही हूँ जो मिस्र में प्रकट होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“यूनानी और गैर-यूनानी” यूनानी-रोमी संसार का एक प्रचलित द्विभाजन था: एक ओर यूनानी भाषा बोलने वाले और दूसरी ओर अन्य सभी लोग। इस रचना में वक्ता अक्सर ऐसे दोनों विपरीत पक्षों को अपने भीतर समेटती है।'
    reason: cultural_note
  - marker: b
    text: या, “दिखाई देगी।” “प्रकट होगी” प्रकाशनात्मक स्वर बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: क़िब्ती मूल में दोनों पदों के साथ बहुवचन सूचक लेख हैं—शाब्दिक रूप से, “यूनानी लोग … गैर-यूनानी लोग।” मुख्य पाठ में आत्म-परिचय की काव्यात्मक लय के लिए सामूहिक पद रखे गए हैं; दोनों समूहों का समावेश अभिप्रेत है।
    reason: parallelism_note
  - marker: d
    text: इस अंश के OCR में स्पष्ट पदों से पहले दो पाठांश संदिग्ध हैं, और दिया गया परामर्श-पाठ इन पंक्तियों से मेल नहीं खाता। बेहतर पाठ-संरेखण उपलब्ध होने तक अनुवाद केवल अपेक्षाकृत सुनिश्चित वाक्यांशों तक सीमित है।
    reason: alignment_note
