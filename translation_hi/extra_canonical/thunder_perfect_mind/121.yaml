base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/121.yaml
  text: 'Because of this[a], do not let me be heard[b];

    and do not let me be known by judgment or by any other power.'
translation:
  language: hi
  text: 'इस कारण[a], मुझे सुनाई न देने दो;


    और मुझे न्याय या किसी अन्य सामर्थ्य के द्वारा ज्ञात न होने दो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पाठ का आशय “इस कारण” या “इस विषय में” हो सकता है; कारणसूचक अर्थ अधिक संभावित है।
    reason: translation_ambiguity
  - marker: b
    text: प्राप्त पाठ में संबंधित शब्द अस्पष्ट है। सम्भव है कि यह यूनानी आगत ⲕⲣⲓⲙⲁ (“न्याय/निर्णय”) हो; और ⲟⲉⲓϣ का अर्थ सामान्यतः “बल” या “सामर्थ्य” है। इसलिए इस वाक्यांश का पाठ और अर्थ दोनों कुछ अनिश्चित हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲡⲁⲓ
  choice: इस कारण
  rationale: कारणसूचक बल को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ⲙⲡⲣ ⲣⲁⲧ ⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: मुझे सुनाई न देने दो
  rationale: निषेधात्मक आज्ञार्थ और कारक/अनुमतिपरक रचना को हिन्दी में निष्क्रिय अर्थ के साथ व्यक्त करता है।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: मूल के साधारण संयोजक और समानांतर लय को सुरक्षित रखता है।
- source_word: ⲙⲡⲣ ⲣⲁⲧ ⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: मुझे ... जाना न जाने दो
  rationale: पहली निषेधात्मक पंक्ति के समानांतर कारक तथा निष्क्रिय भाव को बनाए रखता है।
- source_word: ⲛ ⲕⲣⲓⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ
  choice: न्याय या किसी दूसरी सामर्थ्य के द्वारा
  rationale: संभावित यूनानी आगत शब्द को ‘न्याय’ और ⲟⲉⲓϣ को ‘सामर्थ्य’ मानते हुए, संबंधसूचक ⲛ- का साधनार्थक अनुवाद किया गया है।
theological_decisions:
- issue: वक्ता को ‘सुना’ और ‘जाना’ न जाने देने का विरोधाभासी निषेध
  choice: निषेधों को ज्यों का त्यों रखा गया
  alternative: इन्हें सकारात्मक आह्वान या केवल अलंकारिक कथन के रूप में स्पष्ट करना
  rationale: रचना की वास्तविक विरोधाभासी और धर्मवैचारिक तनातनी को बिना समाधान थोपे सुरक्षित रखना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली। समानांतर निषेधात्मक पंक्तियों और मूल की रहस्यमयता को बनाए रखा गया है।
