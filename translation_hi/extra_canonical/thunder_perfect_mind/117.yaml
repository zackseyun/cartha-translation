  text: The one who will judge me at the end—judge him! You who are in many sins, and intemperances, and empty passions, and temporary pleasures!
translation:
  language: hi
  text: '**1.** जो व्यवस्था के आधार पर मेरा न्याय करेगा—उसका न्याय करो![a] हे तुम, जो बहुत-से पापों, असंयम, खोखली वासनाओं और क्षणिक सुखों में पड़े हो![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: OCR में यह अंश बहुत बिगड़ा हुआ है। यहाँ ‘व्यवस्था’ उस पुनर्पाठ पर आधारित है जो ⲛⲉⲗⲟⲥ को ⲛⲟⲙⲟⲥ (‘व्यवस्था/कानून’) मानता है; एक अन्य प्रस्तावित पठन का अर्थ ‘अंत में’ है। ‘उसका न्याय करो’ भी क्षतिग्रस्त अगले शब्दों के पुनर्निर्माण पर आधारित है।
    reason: textual_uncertainty
  - marker: b
    text: ‘खोखली’ और ‘क्षणिक’ OCR में अधूरे या बिगड़े रूपों के संशोधित पठन पर आधारित हैं; शाब्दिक भाव क्रमशः ‘खाली/व्यर्थ’ और ‘अस्थायी’ है।
    reason: lexical_and_ocr_note
lexical_decisions:
- source_word: ⲕⲣⲓⲛⲉ
  choice: न्याय करना
  rationale: यूनानी मूल κρίνω से आया यह शब्द यहाँ न्यायिक और नैतिक अर्थ रखता है; एक ही वाक्य में इसकी पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
- source_word: 'ⲛⲟⲙⲟⲥ (OCR: ⲛⲉⲗⲟⲥ)'
  choice: व्यवस्था
  rationale: प्रसंग और संशोधित पठन के आधार पर OCR के ⲛⲉⲗⲟⲥ को यूनानी νόμος, ‘व्यवस्था/कानून’, का बिगड़ा रूप माना गया है। धार्मिक-नैतिक संदर्भ में ‘व्यवस्था’ स्वाभाविक है और केवल आधुनिक नागरिक कानून तक अर्थ को सीमित नहीं करती।
- source_word: ⲛⲟⲃⲉ ⲉⲛⲁϣⲱⲟⲩ
  choice: बहुत-से पाप
  rationale: ⲉⲛⲁϣⲱⲟⲩ की बहुलता को स्पष्ट रखते हुए ⲛⲟⲃⲉ का पारंपरिक नैतिक अर्थ ‘पाप’ लिया गया है।
- source_word: ⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: असंयम
  rationale: यह रचना अपने ऊपर नियंत्रण या पकड़ के अभाव को व्यक्त करती है; ‘असंयम’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: 'ⲡⲁⲑⲟⲥ ⲉⲧϣⲟⲩⲉⲓⲧ (OCR: ⲡⲁⲑⲟⲥ ⲉⲧϣⲁⲉⲓⲏⲧ)'
  choice: खोखली वासनाएँ
  rationale: πάθος यहाँ अनियंत्रित चाह या आवेग के नैतिक अर्थ में है; ‘वासनाएँ’ इस भाव को सामान्य हिन्दी में व्यक्त करता है और संशोधित पठन ‘खाली/व्यर्थ’ को ‘खोखली’ से दर्शाया गया है।
- source_word: 'ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥⲕⲁⲓⲣⲟⲥ (OCR fragment: ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥ ⲡⲉ)'
  choice: क्षणिक सुख
  rationale: यूनानी ἡδονή का अर्थ ‘सुख/भोग’ और πρόσκαιρος का अर्थ ‘अस्थायी’ है; ‘क्षणिक सुख’ सूची की नैतिक धार और स्वाभाविक हिन्दी दोनों बनाए रखता है।
theological_decisions:
- issue: 'न्याय का आधार: ‘अंत में’ या ‘व्यवस्था के आधार पर’'
  choice: व्यवस्था के आधार पर
  alternative: अंत में
  rationale: दिखाई दे रहा OCR ⲛⲉⲗⲟⲥ अस्थिर है, पर समीक्षात्मक पुनर्पाठ इसे ⲛⲟⲙⲟⲥ (‘व्यवस्था’) का बिगड़ा रूप मानता है; ‘अंत’ के लिए ⲧⲉⲗⲟⲥ मानना आरंभिक व्यंजन और प्रसंग दोनों में अधिक अनुमान माँगता है। अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: दूसरे ‘न्याय करो’ का व्याकरणिक बल
  choice: आज्ञार्थक—‘उसका न्याय करो!’
  alternative: भविष्यवाचक—‘वह ... का न्याय करेगा’
  rationale: खंडित पाठ के समीक्षात्मक पुनर्निर्माण में यहाँ नाटकीय आज्ञा और फिर सीधे संबोधन का परिवर्तन है। इसे समतल भविष्यवाचक वाक्य बनाने के बजाय वही तनाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, उद्घोषणात्मक और काव्यात्मक गद्य रखा गया है। ‘हे तुम’ सीधे संबोधन की तीव्रता बचाता है; ‘में पड़े हो’ अस्तित्वसूचक कॉप्टिक वाक्यांश को स्वाभाविक हिन्दी में नैतिक स्थिति के रूप में व्यक्त करता है।
