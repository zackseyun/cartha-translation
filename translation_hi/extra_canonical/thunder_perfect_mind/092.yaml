base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/092.yaml
  text: 'I am the understanding of every person, my mind within.

    I am the knowledge of my name.

    I am the cry that goes out,

    and I am the one who hears.'
translation:
  language: hi
  text: 'मैं हर व्यक्ति की तैयारी हूँ—मेरी बुद्धि भीतर है।[a]


    मैं मेरे नाम का उच्चारण हूँ।[b]


    मैं बाहर निकलने वाली पुकार हूँ,


    और मैं ही वह हूँ जो सुनती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहली पंक्ति का संबंध कुछ अस्पष्ट है। इसे “मैं हर व्यक्ति की तैयारी हूँ—भीतर मेरी बुद्धि” भी समझा जा सकता है। ⲧⲥⲟⲃⲧⲉ का अर्थ ‘तैयारी’ या ‘सज्जा’ है।
    reason: syntactic_and_lexical_ambiguity
  - marker: b
    text: शाब्दिक रूप से यह पद ‘मेरे नाम का विभाजन/भेद’ कह सकता है; वाणी के प्रसंग में इसका भाव ‘उच्चारण’ या ‘अक्षर-विन्यास’ हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: तैयारी
  rationale: साहिदिक ⲥⲟⲃⲧⲉ का मूल अर्थ ‘तैयारी/सज्जा’ है; ‘समझ’ कहने से शब्द को अनावश्यक रूप से संज्ञानात्मक अर्थ मिल जाता।
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: हर मनुष्य की
  rationale: ⲣⲱⲙⲉ का अर्थ मनुष्य/व्यक्ति और ⲛⲓⲙ का अर्थ हर/सभी है। ‘हर मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: ⲡⲁⲛⲟⲩⲥ ⲉϩⲟⲩⲛ
  choice: मेरी बुद्धि भीतर है
  rationale: ⲡⲁ- प्रथम पुरुष एकवचन संबंधसूचक है और यूनानी मूल νοῦς मन/बुद्धि को सूचित करता है; ‘बुद्धि’ काव्यात्मक गरिमा और मानसिक अर्थ दोनों रखती है। ⲉϩⲟⲩⲛ को ‘भीतर’ रखा गया है।
- source_word: ⲧⲡⲱϣⲥ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: अपने नाम का उच्चारण
  rationale: ⲡⲱϣⲥ का मूल क्षेत्र विभाजन/भेद है और वाणी के संदर्भ में शब्द या नाम के स्पष्ट उच्चारण/अक्षर-विन्यास की ओर संकेत कर सकता है; ‘ज्ञान’ स्रोत-शब्द का सीधा अर्थ नहीं है।
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: बाहर उठने वाली पुकार
  rationale: ϣⲕⲁⲕ में पुकारने/चिल्लाने का स्वर है और ⲉⲃⲟⲗ बाहर की दिशा बताता है। यह अगले ‘सुनने’ के साथ श्रव्य समानांतरता रखता है।
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: सुनने वाली
  rationale: ⲥⲱⲧⲙ̄ का सीधा अर्थ ‘सुनना’ है। वक्ता के स्त्रीलिंग आत्मनिर्देश के अनुरूप हिन्दी में ‘वाली’ रखा गया है।
theological_decisions:
- issue: वक्ता का व्याकरणिक लिंग
  choice: स्त्रीलिंग आत्मनिर्देश (‘वाली’)
  alternative: लिंग-निरपेक्ष बहुवचन-सम्मानसूचक रूप
  rationale: कॉप्टिक ‘ⲁⲛⲟⲕ ⲧⲉ’ में स्त्रीलिंग विधेय-संयोजक है; हिन्दी में जहाँ रूप स्पष्ट होता है, उसे बनाए रखना पाठ की आवाज़ के लिए महत्त्वपूर्ण है।
- issue: ‘मेरी बुद्धि भीतर’ का पहले वाक्य से संबंध
  choice: डैश के बाद स्वतंत्र उपवाक्य
  alternative: ‘हर मनुष्य की तैयारी, अर्थात् भीतर मेरी बुद्धि’
  rationale: खंडित OCR और विराम-संरचना संबंध को पूरी तरह निश्चित नहीं करते। डैश मूल की संक्षिप्त, समांतर काव्यात्मकता रखते हुए संबंध को अत्यधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक किंतु सरल और गरिमापूर्ण। बार-बार आने वाले ‘मैं’ को रखा गया है ताकि मूल की घोषणात्मक लय बनी रहे। ‘बुद्धि’ को ‘मन’ पर इसलिए चुना गया कि νοῦς का बौद्धिक आयाम बना रहे; फिर भी वाक्य को व्याख्यात्मक धार्मिक शब्दावली से मुक्त रखा गया है।
