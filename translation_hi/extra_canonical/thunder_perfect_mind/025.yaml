  yaml_path: translation/extra_canonical/thunder_perfect_mind/025.yaml
  text: 'The shame and the boldness[a].

    I am shameless; I am ashamed.

    I am hard, and I am trembling.

    I am the war and the peace; within me they are.

    I am she[g][f][e][d][c][b]; heed me.'
translation:
  language: hi
  text: 'लज्जा और निर्भीक वाणी[a]।


    मैं निर्लज्ज हूँ; मैं लज्जित हूँ[b]।


    मैं कठोर हूँ, और मैं काँपती हूँ[c]।


    मैं युद्ध और शांति हूँ।


    मुझ पर ध्यान दो[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निर्भीक वाणी’ के मूल शब्द का अर्थ खुलकर या निडरता से बोलना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह शब्द OCR में विकृत जान पड़ता है; पाठीय समानांतर के आधार पर अर्थ ‘मैं लज्जित हूँ’ लिया गया है।
    reason: textual_uncertainty
  - marker: c
    text: यहाँ उपलब्ध OCR संदिग्ध है; समीक्षित पाठ-साक्ष्य ‘काँपती हूँ’ या ‘भयभीत हूँ’ जैसे अर्थ का समर्थन करते हैं।
    reason: textual_uncertainty
  - marker: d
    text: 'मूल मुहावरे का भाव है: अपना हृदय या ध्यान मेरी ओर लगाओ।'
    reason: lexical_alternative
