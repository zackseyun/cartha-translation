base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/034.yaml
  text: And do not cast me out among those who are lacking in worthlessness[a]; for I—I am merciful, and I am hard‑hearted. Do not hate my obedience; and my self-control[h][g][f][e][d][c][b], love it in my weakness.
translation:
  language: hi
  text: '**12.** और मुझे उन लोगों के बीच निकाल न फेंको, जो निकम्मेपन से रहित हैं[a]; क्योंकि मैं—मैं दयालु हूँ, और मैं कठोर-हृदय भी हूँ[b]। मेरी आज्ञाकारिता से घृणा न करो; और मेरे आत्म-संयम से प्रेम करो, मेरी दुर्बलता में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल वाक्यांश का शाब्दिक भाव ‘जो निकम्मेपन अथवा अनुपयोगिता में कमी रखते हैं’ है। यह जानबूझकर विरोधाभासी पदबंध है। ‘गोबर के ढेर पर’ या ‘कूड़े के ढेर पर’ जैसे पारंपरिक अनुवादों के लिए इस अंश में कोई स्पष्ट संज्ञा नहीं है।
    reason: lexical_alternative
  - marker: b
    text: मूल के दो पदों का शाब्दिक विरोध ‘कोमल-हृदय’ और ‘हृदयहीन/कठोर-हृदय’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: मुझे … निकालकर बाहर न फेंको
  rationale: निषेधात्मक क्रिया निष्कासन या बाहर फेंके जाने का भाव देती है। वक्ता कर्म के रूप में प्रसंग से स्पष्ट है, इसलिए हिन्दी में ‘मुझे’ व्यक्त किया गया है।
- source_word: ⲛⲉⲧϣⲁⲁⲧ ϩⲛ̄ ⲟⲩⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: जो निकम्मेपन से रहित हैं
  rationale: ⲛⲉⲧϣⲁⲁⲧ अभाव या कमी और यूनानी-मूल संज्ञा निकम्मेपन/अनुपयोगिता का बोध कराती है। असामान्य विरोधाभास को सहज बनाकर मिटाया नहीं गया।
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: दयालु
  rationale: शाब्दिक ‘कोमल-हृदय’ का नैतिक और स्वाभाविक हिन्दी समतुल्य; अगले विरोधी पद के साथ तनाव बनाए रखता है।
- source_word: ⲟⲩⲁⲧϩⲏⲧ
  choice: कठोर-हृदय
  rationale: ‘हृदयहीन/कठोर-हृदय’ अर्थक्षेत्र में से यह चयन पहले पद के साथ प्रत्यक्ष विरोधाभास को सुरक्षित रखता है।
- source_word: ⲙⲉⲥⲧⲉ
  choice: घृणा न करो
  rationale: यह ⲙⲟⲥⲧⲉ ‘घृणा करना’ का रूप है; इसे ‘छोड़ना’ नहीं समझा गया।
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: मेरी आज्ञाकारिता
  rationale: यह ⲥⲱⲧⲙ ‘सुनना/आज्ञा मानना’ से बनी भाववाचक संज्ञा है, अतः ‘अपमान’ के बजाय ‘आज्ञाकारिता’ चुना गया।
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: मेरे आत्म-संयम
  rationale: यूनानी ἐγκράτεια का प्रचलित नैतिक अर्थ ‘आत्म-संयम’ है।
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ⲙⲉⲣⲓⲧⲥ
  choice: उससे प्रेम करो
  rationale: क्रिया ⲙⲉ/ⲙⲉⲣⲓ का अर्थ ‘प्रेम करना’ है; इसे ‘पाना’ नहीं समझा गया। हिन्दी वाक्य में सर्वनाम की पुनरावृत्ति से बचते हुए स्पष्ट कर्म-संबंध रखा गया।
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: मेरी दुर्बलता
  rationale: मूल ϭⲱⲃ का अर्थ ‘दुर्बल होना’ है; इसे ‘राज्य’ नहीं समझा गया।
theological_decisions:
- issue: वक्ता का दयालु और कठोर-हृदय दोनों होना
  choice: दोनों कथनों को सीधे और समान बल के साथ रखा गया
  alternative: किसी एक को रूपक या विडंबना बताकर विरोध को हल करना
  rationale: काव्य का जानबूझकर रचा गया आत्म-विरोध मूल पाठ की विशेषता है; अनुवाद में उसकी व्याख्यात्मक काट-छाँट नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पाठयोग्य रखी गई है। ‘निकम्मेपन से रहित’ की असामान्य अभिव्यक्ति मूल के वास्तविक अर्थगत विरोधाभास को बचाने के लिए जानबूझकर रखी गई; शेष वाक्य-विन्यास को स्वाभाविक हिन्दी में ढाला गया है।
