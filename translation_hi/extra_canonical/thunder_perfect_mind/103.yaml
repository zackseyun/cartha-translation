translation:
  language: hi
  text: क्योंकि जो तुम्हारे भीतर है, वही तुम्हारे बाहर है; और जो तुम्हें बाहर से गढ़ता है, उसी ने तुम्हारे भीतर के स्वरूप को आकार दिया। और जिसे तुम देखते हो, वह तुम्हारे बाहर का है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिया गया कॉप्टिक अंश अंग्रेज़ी परामर्श-पाठ से मेल नहीं खाता। इसमें मुख्यतः ‘भीतर’, ‘बाहर’, ‘गढ़ना’ और ‘स्वरूप/प्रतिरूप’ की भाषा है। अंतिम उपवाक्य का OCR और खंड-विभाजन अनिश्चित है; बेहतर पांडुलिपि-संरेखण मिलने पर इसका संशोधन आवश्यक हो सकता है।
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲁϩⲟⲩⲛ
  choice: भीतर
  rationale: यह स्थानसूचक अभिव्यक्ति ‘अंदर/भीतर’ का अर्थ देती है और अंश में ⲥⲁⲃⲟⲗ (‘बाहर’) के साथ स्पष्ट विरोध बनाती है।
- source_word: ⲥⲁⲃⲟⲗ
  choice: बाहर
  rationale: इस प्रसंग में शब्द का स्थानसूचक अर्थ ‘बाहर’ है, न कि अंग्रेज़ी परामर्श-पाठ में प्रस्तावित ‘Justice’; भीतर–बाहर की पुनरावृत्ति पूरे वाक्य की संरचना नियंत्रित करती है।
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: गढ़ता है
  rationale: यूनानी मूल πλάσσει का अर्थ गढ़ना, ढालना या रचना है; ‘गढ़ना’ मनुष्य अथवा रूप को आकार देने की मूर्त छवि बचाता है।
- source_word: ⲧⲩⲡⲟⲥ
  choice: स्वरूप
  rationale: यूनानी τύπος ‘छाप, नमूना, प्रतिरूप, आकृति’ का बोध देता है। ‘स्वरूप’ सामान्य हिन्दी में आकार/प्रतिरूप की धारणा व्यक्त करता है, यद्यपि OCR-वाक्यविन्यास अस्थिर है।
theological_decisions:
- issue: परामर्श-पाठ का ‘मैं न्याय हूँ; मैं पक्ष की पैरवी करनेवाली हूँ’
  choice: उपलब्ध कॉप्टिक अंश का भीतर–बाहर और गढ़ने/स्वरूप वाला कथन अनूदित किया गया
  alternative: मैं न्याय हूँ; मैं पक्ष की पैरवी करनेवाली हूँ।
  rationale: दिए गए कॉप्टिक OCR अंश में प्रथम पुरुष ‘मैं हूँ’, ‘न्याय’ या ‘पक्ष-समर्थक’ के स्पष्ट समतुल्य दिखाई नहीं देते। अतः अनुमानित कानूनी कथन को मूल-पाठ के नाम पर प्रस्तुत करना उचित नहीं होगा।
