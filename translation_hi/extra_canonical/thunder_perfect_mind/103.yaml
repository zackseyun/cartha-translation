review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly rejects the English audit line “I am Justice; I am the advocate,” which is not supported by the supplied Coptic excerpt. However, it overstates possessive relations in the opening and reverses/obscures the source’s contrast: the excerpt begins with an aphoristic identification of “the inner” and “the outer,” then refers to one who fashions “you” externally and makes a type/pattern within.'
  naturalness: The Hindi is generally clear, but “उसी ने तुम्हारे भीतर के स्वरूप को आकार दिया” is redundant and less precise than a direct rendering of making a pattern/type within. A concise parallel structure better reflects the source.
  terminology: “भीतर/बाहर” and “गढ़ना” are appropriate. For τύπος, “प्रतिरूप” is more exact than the broader “स्वरूप” in this context. The uncertain final clause should remain explicitly qualified in a footnote rather than be rendered as a firm statement that is not securely recoverable from the OCR.
  issues:
  - severity: high
    issue: Opening clause adds “तुम्हारे” and changes the aphoristic inner–outer identification into a statement about what is within and outside the audience.
    rationale: The visible Coptic supports “the inner ... the outer,” while the second-person plural is explicit in the following clause concerning the one who fashions “you.”
  - severity: medium
    issue: The phrase about τύπος is rendered as “तुम्हारे भीतर के स्वरूप को आकार दिया,” which is both interpretively expanded and semantically circular.
    rationale: The Coptic uses the Greek loanword τύπος, best represented here by “प्रतिरूप” or “नमूना”; it appears to say that a type/pattern was made within.
  - severity: medium
    issue: The final sentence is presented as a complete, confident translation despite acknowledged OCR/syntactic uncertainty.
    rationale: The supplied excerpt’s last clause is not sufficiently secure for a definitive Hindi rendering. The translation should not add a specific predication unsupported by the visible text.
  revised_text: क्योंकि भीतर ही बाहर है; और जो तुम्हें बाहर से गढ़ता है, उसने तुम्हारे भीतर उसका प्रतिरूप बनाया है।[a]
  revised_footnotes:
  - marker: a
    text: दिए गए कॉप्टिक OCR अंश का अंतिम उपवाक्य (लगभग, “और जिसे तुम देखते हो ... बाहर ...”) वाक्यविन्यास और खंड-संरेखण की दृष्टि से अनिश्चित है; इसलिए उसे मुख्य अनुवाद में निश्चित रूप से नहीं जोड़ा गया है। उपलब्ध अंश अंग्रेज़ी परामर्श-पाठ “मैं न्याय हूँ; मैं पक्ष की पैरवी करनेवाली हूँ” का समर्थन नहीं करता; इसमें ‘भीतर’, ‘बाहर’, ‘गढ़ना’ और यूनानी τύπος (‘प्रतिरूप/नमूना’) की भाषा दिखाई देती है।
    reason: alignment_note
  revision_rationale: 'संशोधन उपलब्ध कॉप्टिक के स्पष्ट शब्दों और वाक्य-क्रम को प्राथमिकता देता है: ⲥⲁϩⲟⲩⲛ/ⲥⲁⲃⲟⲗ के भीतर–बाहर विरोध, ⲣⲡⲗⲁⲥⲥⲉ का ‘गढ़ना,’ और τύπος का ‘प्रतिरूप।’ अनिश्चित अंतिम OCR खंड को अर्थ आरोपित किए बिना पादटिप्पणी में दर्ज किया गया है।'
