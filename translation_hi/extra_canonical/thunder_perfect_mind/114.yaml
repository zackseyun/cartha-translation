base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/114.yaml
  text: '… with those who were sent[a];

    I am the one cast out;

    among the dead — but I am the one who exists alone[g][f][e][d][c][b], and the everlasting.'
translation:
  language: hi
  text: '**5.** … भेजे गए लोगों के साथ[a];


    मैं वही हूँ जिसे निकाल दिया गया[b];


    मृतकों के बीच[c]—क्योंकि मैं ही वह हूँ जो अकेला अस्तित्व में है[d], और सदा रहनेवाला है[e]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भेजे गए लोगों” का अनुवाद ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ से है। इसका अर्थ “वे लोग जिन्हें उन्होंने भेजा” भी हो सकता है; आरम्भ का पाठ खंडित है।
    reason: textual_ambiguity
  - marker: b
    text: '“निकाल दिया गया” के अन्य सम्भव अनुवाद हैं: “बाहर कर दिया गया” या “खदेड़ दिया गया।”'
    reason: lexical_alternative
  - marker: c
    text: यहाँ ⲙⲟⲟⲩⲧ मरने की प्रक्रिया नहीं, मृत होने की अवस्था बताता है; इसलिए “मृतकों के बीच” किया गया है।
    reason: grammar_note
  - marker: d
    text: “अकेला” का अर्थ “एकमात्र” या “अद्वितीय” भी हो सकता है।
    reason: lexical_ambiguity
  - marker: e
    text: पांडुलिपि-अंश यहाँ ⲙⲛⲧⲁⲓ पर टूटता है; सम्भवतः शब्द ⲙⲛⲧⲁⲓⲱⲛ (“अनन्तता/युगस्थायित्व”) है। इसलिए “सदा रहनेवाला” पाठ-पुनर्निर्माण पर आधारित है; “अनन्त” भी सम्भव है।
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲛ̄ ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: भेजे गए लोगों के साथ
  rationale: ⲙⲛ̄ का सहचारी अर्थ “के साथ” है और ⲧⲛ̄ⲛⲟⲟⲩ का अर्थ “भेजना” है। कर्मवाच्य अनुवाद सहज है, जबकि कर्ता मूल में व्यक्त नहीं है।
- source_word: ⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: निकाल दिया गया
  rationale: यह पद किसी को बाहर निकालने या खदेड़ने का भाव देता है। “निकाल दिया गया” आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: मृतकों के बीच
  rationale: ⲙⲟⲟⲩⲧ मृत्यु की पूर्ण अवस्था व्यक्त करता है, इसलिए “मरनेवालों” के बजाय “मृतकों” उचित है; लोगों के बहुवचन समूह के साथ ϩⲛ को “के बीच” किया गया है।
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: वह … जो … अस्तित्व में है
  rationale: ϣⲟⲟⲡ यहाँ होने, विद्यमान रहने या अस्तित्व में होने का अर्थ रखता है। “अस्तित्व में है” इसके सत्तात्मक बल को बनाए रखता है।
- source_word: ⲟⲩⲁⲁⲧ
  choice: अकेला
  rationale: शब्द अकेलेपन, एकत्व या अद्वितीयता का संकेत दे सकता है। “अकेला” मूल की संक्षिप्त और तीखी अभिव्यक्ति बनाए रखता है।
- source_word: ⲙⲛⲧⲁⲓ(ⲱⲛ)
  choice: सदा रहनेवाला
  rationale: पाठ संभवतः ⲙⲛⲧⲁⲓⲱⲛ, अर्थात अनन्तता या युगस्थायित्व, की ओर बढ़ता है। हिन्दी में “सदा रहनेवाला” विशेषणात्मक-नामिक बल और काव्यात्मक लय दोनों बनाए रखता है।
theological_decisions:
- issue: मृतकों के बीच होने और अकेले अस्तित्व में रहने का विरोधाभास
  choice: दोनों कथनों को बिना सामंजस्य बैठाए साथ रखा गया
  alternative: इसे केवल मृत्यु पर विजय या मृतकों से अलगाव के रूप में स्पष्ट करना
  rationale: मूल वक्ता की वाणी जानबूझकर विरोधाभासी है। किसी एक व्यवस्थित धार्मिक अर्थ में इसे सीमित करना मूल के तनाव को मिटा देता।
- issue: ⲟⲩⲁⲁⲧ का आशय
  choice: अकेला
  alternative: अद्वितीय
  rationale: “अद्वितीय” अधिक स्पष्ट धार्मिक दावा बन सकता था; “अकेला” मूल की वास्तविक अर्थ-बहुलता और अस्तित्वगत तीखापन बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर खंड की घोषणात्मक और रहस्यपूर्ण लय बनाए रखने के लिए छोटे समानान्तर वाक्यांश रखे गए हैं। आरम्भ में दीर्घविराम खंडित पूर्वपाठ दिखाता है और अर्धविराम मूल की क्रमिक आत्म-घोषणाओं को अलग करते हैं।
