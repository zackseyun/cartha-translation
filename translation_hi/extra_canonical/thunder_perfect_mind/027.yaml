lexical_decisions:
- source_word: ⲁⲧⲱⲧⲙ
  choice: जिसे बंद नहीं किया गया
  rationale: रूप को ⲁⲧ- (निषेध) और ⲱⲧⲙ (‘बंद करना’) से बना मानकर शाब्दिक विरोधाभास सुरक्षित रखा गया है। पाठ और विभाजन संदिग्ध हैं; ‘न सुननेवाली’ भी संभव है।
- source_word: ⲧⲣⲙⲙⲁⲟ
  choice: धनवान
  rationale: ⲣⲙⲙⲁⲟ का सामान्य अर्थ ‘धनी/धनवान’ है; स्त्री प्रथम-पुरुष वक्ता के अनुरूप हिंदी रूप रखा गया है।
- source_word: ⲡϫⲓⲥⲉ
  choice: उत्कंठा
  rationale: ϫⲓⲥⲉ का मूल भाव ‘ऊँचाई/ऊँचा उठना/उत्कर्ष’ है। अगले पद के खोजने के भाव से संबंध दिखाने के लिए ‘उत्कंठा’ चुना गया, जबकि शाब्दिक ‘उत्कर्ष’ भी संभव है।
- source_word: ⲛⲍⲏⲧⲉ
  choice: खोजने की
  rationale: इसे यूनानी ζητεῖν (‘खोजना’) से संबद्ध रूप मानकर संबंधसूचक अनुवाद किया गया है; ‘गर्व’ अर्थ स्रोत से समर्थित नहीं है।
theological_decisions:
- issue: पहचान-वाक्य और अगले अपूर्ण वाक्यांश के बीच संबंध
  choice: दो अलग वाक्यांश रखे गए; दूसरा अल्पविराम पर खुला छोड़ा गया
