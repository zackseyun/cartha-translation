  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। स्त्री-वक्ता के कारण ‘धनवान हूँ’ का प्रयोग किया गया है। मूल की अपूर्णता दिखाने के लिए अंतिम अल्पविराम बनाए रखा गया है; पुराने ‘मैं लज्जा और गर्व हूँ’ पाठ को स्रोतगत शब्दार्थ के अभाव में नहीं अपनाया गया।
