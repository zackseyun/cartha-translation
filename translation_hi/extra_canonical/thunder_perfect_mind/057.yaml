base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/057.yaml
  text: 'This is mine:

    I came forth in an earth[a],

    and you came to be manifest in knowledge;

    an earth is in your heart—you receive those outside[c][b], in places.'
translation:
  language: hi
  text: 'यह मेरा है:[a]


    मैं एक धरती से निकलकर आई,


    और तुम ज्ञान में प्रकट हुए;


    तुम्हारे हृदय में एक धरती है—तुम बाहर की चीज़ों को स्थानों में ग्रहण करते हो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक शब्द OCR के कारण अनिश्चित हैं; सम्भवतः अर्थ ‘यह मेरी वाणी है’ भी हो सकता है। प्रकाशित अनुवादों में इस स्थान पर मिलने वाला ‘मैं ईश्वर-विहीन हूँ, और मेरा ईश्वर महान है’ वाला कथन उपलब्ध कॉप्टिक अंश से मेल नहीं खाता, इसलिए यहाँ नहीं जोड़ा गया।
    reason: पाठगत और संरेखण-संबंधी अनिश्चितता
  - marker: b
    text: ‘बाहर की चीज़ों’ का अर्थ ‘बाहर वालों’ भी हो सकता है। अन्तिम वाक्य की वाक्य-रचना OCR और पंक्ति-विभाजन के कारण कुछ अनिश्चित है।
    reason: व्याकरणिक और शब्दार्थगत विकल्प
lexical_decisions:
- source_word: ⲧⲉ ⲡⲁⲓ ⲙⲙⲟⲉⲓ
  choice: यह मेरा है
  rationale: OCR-पाठ अनिश्चित है। यह न्यूनतम अनुवाद संकेतवाचक और संबंधसूचक भाव बनाए रखता है, बिना ‘वाणी’ जैसे किसी लुप्त संज्ञा को निश्चित मानने के।
- source_word: ⲉⲓⲉⲃⲟⲗ
  choice: मैं ... निकलकर आई
  rationale: ⲉⲓ ⲉⲃⲟⲗ का सामान्य अर्थ बाहर आना या निकलना है। वक्ता के स्त्रीलिंग आत्म-निर्देश के अनुरूप हिन्दी में ‘आई’ रखा गया है।
- source_word: ⲕⲁϩ
  choice: धरती
  rationale: साहिदिक ⲕⲁϩ का अर्थ ‘धरती/भूमि’ है; ‘अन्धकार’ के लिए सामान्य रूप ⲕⲁⲕⲉ होता है।
- source_word: ⲛⲧⲉⲧⲛϣⲟⲟⲡ ⲉⲃⲟⲗ
  choice: तुम ... प्रकट हुए
  rationale: ϣⲟⲟⲡ ‘होना/अस्तित्व में आना’ और ⲉⲃⲟⲗ यहाँ खुले या प्रकट होने का भाव देता है। बहुवचन संबोधन रखा गया है।
- source_word: ⲉⲡⲓⲥⲧⲏⲙ
  choice: ज्ञान
  rationale: यूनानी ἐπιστήμη से आए इस शब्द का सीधा और स्वाभाविक अर्थ ‘ज्ञान’ है।
- source_word: ⲛϩⲏⲧ
  choice: तुम्हारे हृदय में
  rationale: यह आन्तरिकता का प्रचलित कॉप्टिक प्रयोग है; हिन्दी में ‘हृदय में’ उसके रूपक को बनाए रखता है।
- source_word: ⲛⲧⲉⲧⲛϣⲟⲡ
  choice: तुम ... ग्रहण करते हो
  rationale: पंक्ति-विभाजन के आर-पार पढ़ा गया रूप ϣⲱⲡ ‘लेना/ग्रहण करना’ है, न कि ‘खोजना’।
- source_word: ⲛⲉⲃⲟⲗ
  choice: बाहर वालों को
  rationale: इसे केवल क्रियाविशेषण ‘बाहर’ न मानकर बहुवचन संज्ञात्मक पद ‘बाहर वाले’ समझा गया है; सन्दर्भ के कारण व्यक्ति और वस्तु दोनों सम्भव हैं।
- source_word: ϩⲛϩⲉⲛⲧⲟⲡⲟⲥ
  choice: अलग-अलग स्थानों में
  rationale: यूनानी मूल τόπος का बहुवचन ‘स्थान’ है; अनिश्चित बहुवचन का भाव ‘अलग-अलग’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: प्राप्त अंग्रेज़ी परामर्श-पाठ का ‘godless / God is great’ कथन
  choice: इसे मुख्य पाठ में शामिल नहीं किया गया
  alternative: ‘मैं ईश्वर-विहीन हूँ, और मैं वही हूँ जिसका ईश्वर महान है’
  rationale: दिए गए कॉप्टिक अंश में उस कथन के स्पष्ट शब्द नहीं हैं; उपलब्ध पंक्तियाँ धरती, ज्ञान, हृदय, ग्रहण और स्थानों की बात करती हैं। सम्भावित संरेखण-अन्तर को सिद्धान्तगत रूप से पूरा नहीं किया गया।
- issue: ⲛⲉⲃⲟⲗ का संदर्भ
  choice: बाहर वालों
  alternative: बाहर की वस्तुओं
  rationale: बहुवचन पद का सजीव अथवा निर्जीव आशय निश्चित नहीं है। मुख्य पाठ में संक्षिप्त मानवीय रूप रखा गया है और पादटिप्पणी में वस्तुगत विकल्प सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। मूल की पुनरुक्ति, स्थानिक बिम्ब और कुछ असहज रहस्यात्मक तनाव को सरल करके मिटाया नहीं गया। बहुवचन ‘तुम’ बनाए रखा गया है; स्त्री वक्ता के अनुसार ‘आई’ प्रयुक्त है।
