- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: क्यों
  rationale: यह कारण पूछने वाला सामान्य कॉप्टिक प्रश्न-वाक्यांश है और यहाँ आलंकारिक प्रश्न आरम्भ करता है।
- source_word: ⲧⲉⲧⲛⲙⲉⲥⲧⲉ
  choice: तुम ... घृणा करते हो
  rationale: बहुवचन कर्ता और वर्तमानकालीन क्रिया को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखा गया है।
- source_word: ⲧⲁϩⲟⲧⲉ
  choice: मेरे भय
  rationale: शाब्दिक अर्थ ‘मेरा भय/डर’ है। ‘मुझसे भय’ कहने पर मूल की वास्तविक अर्थगत अनिश्चितता अनावश्यक रूप से समाप्त हो जाती।
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  choice: तुम ... शाप देते हो
  rationale: क्रिया का सीधा अर्थ ‘शाप देना’ है; समानांतर वाक्य-विन्यास को बनाए रखा गया है।
- source_word: ⲙⲡⲁϣⲟⲩϣⲟⲩ
  choice: मेरे गर्व को
  rationale: ϣⲟⲩϣⲟⲩ में गर्व, डींग या महिमा का भाव हो सकता है। इस विरोधात्मक संदर्भ में ‘गर्व’ संक्षिप्त और स्वाभाविक है, पर इसे धर्मवैचारिक रूप से अधिक सकारात्मक ‘महिमा’ नहीं बनाया गया।
