translation:
  language: hi
  text: '**10.** मैं वही स्त्री हूँ, जिसके सामने[a] तुम लज्जित हुए, और मेरे प्रति तुम निर्लज्ज[b] रहे।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जिसके सामने”; अथवा “जिसकी उपस्थिति में।”
    reason: lexical_alternative
  - marker: b
    text: “निर्लज्ज रहे”; अथवा “बिना लज्जा के रहे” या “निर्लज्जता से व्यवहार किया।”
    reason: lexical_alternative
  - marker: c
    text: 'यहाँ “स्त्री” वक्ता के व्याकरणिक स्त्रीलिंग को स्पष्ट रखने के लिए है; अधिक संक्षिप्त अनुवाद हो सकता है: “मैं वही हूँ, जिसके सामने…”'
    reason: grammatical_gender
lexical_decisions:
- source_word: ⲁⲛⲟⲕ
  choice: मैं … हूँ
  rationale: खंड में बार-बार आनेवाले आत्म-परिचय के सूत्र और उसकी लय को बनाए रखता है।
- source_word: ϩⲱⲱⲧ / ⲉ ⲧⲟⲟⲧϥ
  choice: जिसके सामने
  rationale: ‘मुख के सामने’ का अक्षरशः अनुवाद हिन्दी में अस्वाभाविक होता; ‘सामने’ प्रत्यक्ष उपस्थिति का भाव स्वाभाविक ढंग से रखता है।
- source_word: feminine demonstrative (textual reading reported as ⲧⲁⲓ)
  choice: वही स्त्री
  rationale: वक्ता के व्याकरणिक स्त्रीलिंग को हिन्दी में स्पष्ट रखने के लिए केवल लिंग-निरपेक्ष ‘वही’ के बजाय ‘वही स्त्री’ कहा गया है।
- source_word: ⲁⲩⲉⲓ … ⲃⲟⲗ
  choice: तुम लज्जित हुए
  rationale: OCR-पाठ की रूपात्मक अस्पष्टता के बावजूद प्रसंग में अगले ‘निर्लज्ज’ पद के साथ स्पष्ट विरोध-समानांतरता बनती है; इसलिए लज्जा-संबंधी अर्थ रखा गया है।
- source_word: ⲙⲛⲧⲁⲧ…
  choice: निर्लज्ज रहे
  rationale: अभावसूचक अमूर्त संज्ञा का भाव रखता है और ‘लज्जित हुए/निर्लज्ज रहे’ की तीखी विरोधात्मक रचना को स्वाभाविक हिन्दी देता है।
- source_word: ⲙⲙⲟⲉⲓ
  choice: मेरे प्रति
  rationale: वक्ता की ओर संबंधपरक या विरोधी रुख—दोनों की संभावना को ‘मेरे विरुद्ध’ कहकर अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: वक्ता के स्त्रीलिंग की अभिव्यक्ति
  choice: मैं वही स्त्री हूँ
  alternative: मैं वही हूँ
  rationale: ‘मैं वही हूँ’ अधिक शब्दशः लग सकता है, पर आधुनिक हिन्दी में वक्ता का स्त्रीलिंग प्रकट नहीं करता। उपलब्ध पाठ-समीक्षा में स्त्रीलिंग को वक्ता की पहचान के लिए अर्थवाही माना गया है, इसलिए उसे स्पष्ट किया गया है।
- issue: लज्जा और निर्लज्जता के बीच तनाव
  choice: लज्जित हुए … निर्लज्ज रहे
  alternative: शर्मिंदा हुए … बेशर्मी से व्यवहार किया
  rationale: चुने हुए शब्द एक ही अर्थ-क्षेत्र की विरोधात्मक समानांतरता को संक्षिप्त और गरिमापूर्ण ढंग से बनाए रखते हैं, बिना यह समझाए कि दोनों परस्पर-विरोधी प्रतिक्रियाएँ कैसे संभव हैं।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी। ‘लज्जित/निर्लज्ज’ की शब्दगत प्रतिध्वनि मूल की विरोधात्मक धार बनाए रखती है। ‘मेरे प्रति’ जानबूझकर ‘मेरे विरुद्ध’ से अधिक खुला है।
