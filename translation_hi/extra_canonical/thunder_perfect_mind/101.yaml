base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/101.yaml
  text: Release yourselves.[a] Or if you release yourselves from him, who will be able to seize you? For your inside is your outside,[b] and the one who fashions the outside is the one who fashions the inside.
translation:
  language: hi
  text: अपने आप को मुक्त कर लो।[a] अथवा, यदि तुम अपने आप को उससे मुक्त कर लो, तो कौन तुम्हें पकड़ सकेगा? क्योंकि तुम्हारा भीतर ही तुम्हारा बाहर है,[b] और जो बाहर को गढ़ता है, वही भीतर को भी गढ़ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “अपने आप को छोड़ दो।” कॉप्टिक पदबंध का अर्थ किसी को जाने देना, छोड़ना या मुक्त करना हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में भी ‘भीतर’ और ‘बाहर’ का विरोध ही है; पाठ यह स्पष्ट नहीं करता कि ये मन, शरीर, आत्मा या किसी अन्य वास्तविकता के संकेत हैं।
    reason: ambiguity
lexical_decisions:
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: अपने आप को मुक्त कर लो
  rationale: ⲕⲁ … ⲉⲃⲟⲗ यहाँ ‘छोड़ देना/मुक्त कर देना’ का भाव देता है और ⲧⲏⲛⲉ बहुवचन आत्मवाचक सर्वनाम है। यह पाठ को ‘पुकारो’ समझने वाले पुराने, संदर्भ-विरुद्ध विभाजन से बचाता है।
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲱⲧⲛ
  choice: तुम्हें पकड़ सकेगा
  rationale: क्रिया का मूल अर्थ पकड़ना, थामना या अपने वश में करना है। ‘पकड़ना’ मुक्ति और बंधन के विरोध को सहज हिंदी में बनाए रखता है।
- source_word: ⲥⲁϩⲟⲩⲛ / ⲥⲁⲃⲃⲟⲗ
  choice: भीतर / बाहर
  rationale: ये स्थानसूचक संज्ञात्मक अभिव्यक्तियाँ अंदर और बाहर का विरोध बनाती हैं; यहाँ ⲥⲁϩⲟⲩⲛ को ‘समझना’ मानना OCR-जनित गलत विभाजन होगा।
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: गढ़ता है
  rationale: यूनानी-मूल की यह क्रिया आकार देने या रचने का अर्थ रखती है। ‘गढ़ना’ देहात्मक रूप-निर्माण और काव्यात्मक स्वर, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘उससे’ का संदर्भ
  choice: सर्वनाम को अस्पष्ट ही रखा गया है
  alternative: उसे किसी विशिष्ट व्यक्ति, सत्ता या बंधन के रूप में स्पष्ट करना
  rationale: उपलब्ध अंश में सर्वनाम का पूर्वपद स्पष्ट नहीं है; किसी धार्मिक सत्ता की पहचान जोड़ना स्रोत से आगे जाना होता।
- issue: भीतर और बाहर की समानता
  choice: ‘तुम्हारा भीतर ही तुम्हारा बाहर है’
  alternative: भीतर और बाहर को आत्मा तथा शरीर जैसे निश्चित धर्मवैचारिक वर्गों से जोड़ना
  rationale: पाठ एक विरोधाभासी समानता व्यक्त करता है, पर उसका तात्त्विक अर्थ स्वयं निश्चित नहीं करता। अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। बहुवचन संबोधन के लिए ‘तुम’ लिया गया है। ‘भीतर’ और ‘बाहर’ को संज्ञा की तरह रखकर मूल का विरोधाभासी, सूक्तिपरक स्वर बचाया गया है; अस्पष्ट सर्वनाम और दार्शनिक तनाव को जानबूझकर नहीं सुलझाया गया।
