base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/035.yaml
  text: 'Do not despise my lowliness[a];

    and my self-control toward you—love her in my poverty.

    Do not laugh at me excessively;

    and do not despise my fault[d][c][b], and do not curse my boasting.'
translation:
  language: hi
  text: '**13.** मेरी दीनता का तिरस्कार न करो;


    और मेरी गरीबी में मेरे आत्मसंयम से प्रेम करो।[a]


    मुझ पर बहुत अधिक मत हँसो;


    मेरे दोष को तुच्छ न समझो,


    और मेरी शेखी को मत कोसो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरे आत्मसंयम’ के साथ जुड़े पद का अर्थ ‘तुम्हारे संबंध में’ या ‘तुम पर’ भी समझा जा सकता है।
    reason: व्याकरणिक विकल्प
  - marker: b
    text: समीक्षित पठन में अंतिम दो पदों का अर्थ ‘मेरे दोष को तुच्छ न समझो, और मेरी शेखी को मत कोसो’ है।
    reason: पांडुलिपि-पठन की स्पष्टता
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲙⲉⲥⲧⲉ
  choice: तिरस्कार न करो
  rationale: नकारात्मक आज्ञा और ⲙⲉⲥⲧⲉ के ‘घृणा/तिरस्कार करना’ अर्थ को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: मेरी दीनता
  rationale: ‘छोटापन, नीच दशा, नगण्यता’ के भाव को रखता है और इसे सद्गुण के रूप में ‘विनम्रता’ कहकर अर्थ नहीं बदलता।
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: मेरे आत्मसंयम
  rationale: यूनानी ἐγκράτεια से आए शब्द का वर्तमान हिन्दी में स्पष्ट नैतिक समतुल्य।
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: प्रेम करो
  rationale: बहुवचन संबोधन हिन्दी की आज्ञार्थक क्रिया में स्वाभाविक रूप से निहित है; स्त्रीलिंग सर्वनाम का संदर्भ ‘आत्मसंयम’ है, जिसे हिन्दी में अलग सर्वनाम के बिना स्पष्ट रखा गया है।
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: मेरी निर्बलता
  rationale: मूल में कमजोरी, अभाव या दरिद्रता की अर्थ-सीमा है; निकटवर्ती विरोधाभास ‘आत्मसंयम/निर्बलता’ को बनाए रखने के लिए ‘निर्बलता’ चुना गया।
- source_word: ⲕⲱ ⲧⲏⲛⲉ
  choice: बहुत अधिक मत हँसो
  rationale: ⲧⲏⲛⲉ की तीव्रतासूचक शक्ति को बिना अतिरिक्त उपहास-चित्र जोड़े व्यक्त करता है।
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲛ̄ⲧⲁⲣⲓⲧⲉ
  choice: मेरी भूल को तुच्छ न समझो
  rationale: समीक्षित पाठ में क्रिया ‘तुच्छ समझना’ और संज्ञा ‘भूल/दोष’ है; यह पुराने ‘हिंसा की सभा’ वाले पाठ-पठन को नहीं अपनाता।
- source_word: ⲥⲁϩⲟⲩ ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: मेरी शेखी को मत कोसो
  rationale: समीक्षित पठन में ⲥⲁϩⲟⲩ ‘कोसना/शाप देना’ और ϣⲟⲩϣⲟⲩ ‘शेखी/घमंड’ है; रचना के जानबूझकर रखे गए तनाव को सहज नहीं किया गया।
theological_decisions:
- issue: आत्मसंयम और निर्बलता का विरोधाभास
  choice: दोनों को साथ रखकर मूल तनाव बनाए रखा गया
  alternative: निर्बलता को नैतिक नम्रता बनाकर कथन को सामंजस्यपूर्ण करना
  rationale: वक्ता की विरोधाभासी आत्म-घोषणाएँ इस रचना की प्रमुख शैली हैं; अनुवाद को उनका धर्मवैचारिक तनाव चुपचाप दूर नहीं करना चाहिए।
- issue: ‘भूल’ और ‘शेखी’ का वक्ता से संबंध
  choice: प्रथम पुरुष स्वामित्व—‘मेरी भूल’, ‘मेरी शेखी’—सीधे रखा गया
  alternative: इन्हें रूपक, आरोप या दूसरों की दृष्टि के रूप में स्पष्ट करना
  rationale: मूल यह निर्धारित नहीं करता कि वक्ता इन्हें स्वीकार कर रही है, उद्धृत कर रही है या उलट रही है; अतः अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन/आदरार्थक आज्ञा में है। पंक्तिबद्ध, घोषणात्मक काव्य-लय रखी गई है। ‘दीनता’, ‘आत्मसंयम’, ‘निर्बलता’ और ‘शेखी’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के विरोधाभास को बनाए रखते हैं।
