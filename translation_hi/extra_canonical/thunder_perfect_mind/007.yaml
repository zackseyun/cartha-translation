  yaml_path: translation/extra_canonical/thunder_perfect_mind/007.yaml
  text: 'Do not be ignorant of me.

    For I am the first and the last;

    I am the honored and the scorned[a];

    I am the whore and the holy one[d];

    I am the wife[b] and the virgin[c][e].'
translation:
  language: hi
  text: 'मुझसे अपरिचित मत रहो।


    क्योंकि मैं पहली और आखिरी हूँ;


    मैं सम्मानित और तिरस्कृत हूँ[a];


    मैं वेश्या और पवित्र हूँ[b];


    मैं स्त्री[c] और कुँवारी हूँ[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: OCR में ϣⲏϣ है, जिसका सामान्य अर्थ “महान/अनेक” हो सकता है और वह “सम्मानित” का स्पष्ट विलोम नहीं बनता। अनेक संपादक यहाँ “तिरस्कृत/घृणित” अर्थ वाला पाठ मानते हैं। अनुवाद उसी सम्भावित पाठ का अनुसरण करता है; पाठ-पठन अनिश्चित है।
    reason: alignment_note
  - marker: b
    text: ⲥⲉⲙⲛⲏ का अर्थ “पवित्र,” “शुद्ध” या “सतीत्वयुक्त” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: कॉप्टिक ⲥϩⲓⲙⲉ का मूल अर्थ “स्त्री” है; प्रसंगानुसार इसका अर्थ “पत्नी” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ⲡⲁⲣ नाग हम्मादी पांडुलिपियों में यूनानी παρθένος, अर्थात “कुँवारी,” का संक्षिप्त रूप है।
    reason: cultural_note
