  alternative: उन्हें रूपक बताकर या अलग-अलग व्यक्तियों/अवस्थाओं से जोड़कर समझाना
  rationale: पाठ स्वयं इन विरोधों का समाधान नहीं करता; अनुवाद में कोई सांप्रदायिक या निजी व्याख्या आरोपित नहीं की गई।
