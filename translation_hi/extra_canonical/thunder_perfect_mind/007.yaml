  rationale: ‘पवित्र’ व्यापक अर्थ और धार्मिक अनुगूँज दोनों रखता है, बिना ‘संत’ जैसी संस्थागत श्रेणी जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। हर पंक्ति में दो विरोधी पहचानों की संक्षिप्त, घोषणात्मक लय सुरक्षित है। स्त्री वक्ता के कारण “पहली,” “आखिरी” और “कुँवारी” जैसे स्त्रीलिंग रूप प्रयुक्त हैं।
