translation:
  language: hi
  text: '**10.** तुम मुझे अपनी पुकार में सुनते हो[a], एक [...] में जिसे तुम उच्चारित करते हो[b]। तुमने नहीं सुना[c]। मैं प्रतिरक्षा हूँ[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कॉप्टिक में यह वर्तमानकालीन कथन है: ‘तुम मुझे अपनी पुकार में सुनते हो’; इसे आज्ञा ‘मेरी सुनो’ नहीं समझना चाहिए। ‘तुम्हारी पुकार’ के पीछे का कॉप्टिक पद ‘तुम्हारे मुझे पुकारने’ का भाव रखता है; ‘मुझे संबोधित करते हो’ या ‘मेरा आह्वान करते हो’ भी संभव है।'
    reason: grammar_and_lexical_alternative
  - marker: b
    text: ‘एक’ के बाद का कॉप्टिक शब्द केवल ⲟⲩⲡ— तक सुरक्षित है, इसलिए उसका अनुमान न लगाकर [...] रखा गया है। आगे का वाक्यांश स्पष्टतः ‘जिसे तुम बोलते/उच्चारित करते हो’ कहता है।
    reason: textual_gap
  - marker: c
    text: 'कॉप्टिक में यह नकारात्मक पूर्ण भूतकाल है: ‘तुमने नहीं सुना।’ इसे ‘यदि तुमने नहीं सुना’ के रूप में लेना कम उपयुक्त है।'
    reason: grammar_note
  - marker: d
    text: ⲁⲡⲟⲗⲟⲅⲓⲁ यूनानी ἀπολογία से आया शब्द है और ‘प्रतिरक्षा’, ‘बचाव में उत्तर’ या ‘सफाई’ का अर्थ दे सकता है। उपलब्ध पठन वक्ता की ‘प्रतिरक्षा’ के साथ पहचान का समर्थन करता है।
    reason: lexical_and_textual_note
lexical_decisions:
- source_word: ⲥⲱⲧⲙ
  choice: सुनते हो / सुना
  rationale: क्रिया सुनने और ध्यान देकर सुनने—दोनों अर्थ दे सकती है। यहाँ पहला रूप वर्तमानकालीन कथन और दूसरा नकारात्मक पूर्ण भूतकाल है; इसलिए आज्ञार्थक ‘सुनो’ नहीं रखा गया।
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: मुझे पुकारते हो
  rationale: यह किसी को पुकारने, पुकारकर संबोधित करने या आह्वान करने का अर्थ दे सकता है। ‘मुझे पुकारते हो’ दिशा-संबंध बनाए रखता है और केवल नाम लेने का अर्थ नहीं थोपता।
- source_word: ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: जिसे तुम बोलते हो
  rationale: यह सापेक्ष उपवाक्य है, जिसका आशय किसी बात को मुख से निकालना या कहना है। ‘बोलते हो’ अपूर्ण पूर्ववर्ती शब्द के साथ स्वाभाविक रहते हुए क्रिया को सुरक्षित रखता है।
- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: तुमने नहीं सुना
  rationale: यह नकारात्मक पूर्ण भूतकाल का कथन है, शर्तसूचक ‘यदि तुमने नहीं सुना’ नहीं।
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: प्रतिरक्षा
  rationale: यूनानी आगंतुक शब्द ἀπολογία का अर्थ बचाव में दिया गया उत्तर या पक्ष-समर्थन है। ‘प्रतिरक्षा’ न्यायिक/समर्थनात्मक रंग बचाता है, यद्यपि ‘उत्तर’ या ‘सफाई’ भी संभव हैं।
theological_decisions:
- issue: वक्ता की ‘प्रतिरक्षा’ से पहचान
  choice: मैं ही प्रतिरक्षा हूँ
  alternative: मैं ही उत्तर हूँ / मैं ही सफाई हूँ
  rationale: पाठ की आत्म-पहचान और उसका तनाव जस का तस रखा गया है; इसे किसी विशिष्ट धार्मिक सिद्धांत, व्यक्ति या उद्धार-संबंधी भूमिका से नहीं जोड़ा गया। ‘ही’ हिन्दी में पहचान के बल को स्वाभाविक बनाता है, कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी रखी गई है। खंडित शब्द को अनुमान से पूरा नहीं किया गया। आरंभिक वाक्य को हिन्दी की स्वाभाविक काल-संरचना में रखा गया है, जबकि वर्तमानकालीन कथन, सापेक्ष उपवाक्य और नकारात्मक पूर्ण भूतकाल के बीच स्रोत का व्याकरणिक भेद सुरक्षित है।
