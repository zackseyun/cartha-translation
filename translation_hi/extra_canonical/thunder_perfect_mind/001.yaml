translation:
  language: hi
  text: '**गर्जना : पूर्ण मन**


    मैं शक्ति[a] से भेजी गई,


    और मैं उन लोगों के पास आई[b] जो मेरा मनन करते हैं,


    और मैं उन लोगों के बीच पाई गई[c] जो मुझे खोजते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शक्ति” कॉप्टिक में प्रयुक्त यूनानी ऋणशब्द δύναμις का अनुवाद है। इस OCR अंश में निश्चयवाचक उपपद दिखाई नहीं देता; प्रचलित पाठ-साक्ष्यों के आधार पर “उस शक्ति से” भी समझा जा सकता है।
    reason: alignment_note
  - marker: b
    text: 'OCR में ⲛⲧⲁⲓⲥⲱⲧⲙ है, जिसका अर्थ “मैं सुनी गई” होगा। अनेक संपादित पाठ यहाँ ⲛⲧⲁⲓⲉⲓ, अर्थात् “मैं आई,” पढ़ते हैं। यदि OCR का पाठ सही हो, तो पंक्ति का अनुवाद हो सकता है: “और मैं उन लोगों द्वारा सुनी गई जो मेरा मनन करते हैं।”'
    reason: alternative_reading
  - marker: c
    text: कॉप्टिक ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ का अर्थ “मैंने अपने आपको पाया,” “मैं पाई गई,” या “उन्होंने मुझे पाया” हो सकता है। यहाँ समानांतर वाक्य-विन्यास के कारण “मैं पाई गई” चुना गया है।
    reason: alternative_reading
