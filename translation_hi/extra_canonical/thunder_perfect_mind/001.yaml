  choice: गर्जना
  rationale: यह यूनानी βροντή से आया शब्द है और शीर्षक में ‘thunder’ का भाव देता है। ‘गर्जना’ आधुनिक हिंदी में स्वाभाविक और संज्ञात्मक है।
- source_word: ⲛⲟⲩⲥ
  choice: मन
  rationale: यूनानी νοῦς का अर्थ ‘मन’ या ‘बुद्धि’ हो सकता है। शीर्षक की संक्षिप्तता और प्रचलित अर्थ बनाए रखने के लिए ‘मन’ चुना गया है।
- source_word: ⲛⲧⲉⲗⲉⲓⲟⲥ
  choice: पूर्ण
  rationale: यूनानी τέλειος में पूर्णता, सिद्धता या समग्रता का भाव है। यहाँ ‘पूर्ण’ शीर्षक में सहज रहते हुए अर्थ की व्यापकता बनाए रखता है।
- source_word: ⲧⲁⲛⲧⲁⲟⲩⲟⲉⲓ ... ⲉⲃⲟⲗ
  choice: मैं ... से भेजी गई
  rationale: रूप निष्क्रिय भेजे जाने और बाहर की ओर प्रस्थान का संकेत देता है। हिंदी में स्रोत-वाचक ‘से’ के साथ ‘भेजी गई’ स्वाभाविक है; ‘बाहर’ अलग से जोड़ना अनावश्यक और भ्रामक हो सकता है।
- source_word: (implied) ⲇⲩⲛⲁⲙⲓⲥ
  choice: शक्ति
  rationale: यूनानी δύναμις का सीधा और गरिमापूर्ण हिंदी समतुल्य। संभावित निश्चयवाचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: मेरा मनन करते हैं
  rationale: ⲙⲉⲉⲩⲉ में सोचने, विचारने और ध्यानपूर्वक चिंतन करने का भाव है; ‘मनन’ चिंतनशील स्वर बनाए रखता है।
- source_word: ⲛⲧⲁⲓⲥⲱⲧⲙ (OCR) / ⲛⲧⲁⲓⲉⲓ (edited reading)
  choice: मैं ... आई
  rationale: अनेक संपादित पाठों की ‘आई’ वाली पाठ-रीति मुख्य पाठ में ली गई है; OCR की ‘सुनी गई’ वाली वास्तविक वैकल्पिक रीति पादटिप्पणी में स्पष्ट है।
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: मैं ... के बीच पाई गई
  rationale: कॉप्टिक रचना के अनेक संभावित निर्वचनों में यह चयन संदर्भ और समानांतर निष्क्रिय वाक्य-विन्यास को बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: वक्ता के लिए हिंदी में व्याकरणिक लिंग
  choice: स्त्रीलिंग—‘भेजी गई’, ‘आई’, ‘पाई गई’
  alternative: पुल्लिंग या लिंग से बचने वाला अधिक कृत्रिम वाक्य-विन्यास
  rationale: कॉप्टिक प्रथम पुरुष रूप स्वयं लिंग नहीं बताता, पर इस रचना में वक्ता का व्यापक साहित्यिक व्यक्तित्व स्त्री-वाचक है। आधुनिक हिंदी में स्वाभाविक वाक्य बनाने के लिए स्त्रीलिंग रखा गया है; इससे वक्ता की तात्त्विक पहचान पर कोई अतिरिक्त सांप्रदायिक दावा नहीं किया जाता।
