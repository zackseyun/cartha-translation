    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲉⲣⲟⲉⲓ
  choice: मेरी / मुझसे
  rationale: इस पूर्वसर्गीय रूप का अर्थ संदर्भ के अनुसार ‘मेरी ओर/मेरे विषय में’ है। पहले खंड में हिन्दी मुहावरे के अनुसार ‘मेरी सुनो’ और शिक्षा ग्रहण करने वाले दूसरे खंड में स्वाभाविक रूप से ‘मुझसे सीखो’ किया गया है।
- source_word: ϩⲛ ⲟⲩϭⲱⲛ
  choice: क्रोध में
  rationale: ϭⲱⲛ क्रोध या रोष को व्यक्त करता है। ‘क्रोध में’ मूल की संक्षिप्त, जानबूझकर तनावपूर्ण अभिव्यक्ति को बिना यह तय किए बनाए रखता है कि क्रोध वक्ता का है या सुनने वालों का।
- source_word: ⲛⲧⲉⲧⲛϫⲓ ⲥⲃⲱ
  choice: मुझसे सीखो
  rationale: शाब्दिक भाव ‘तुम शिक्षा ग्रहण करो’ है। आधुनिक हिन्दी में ‘मुझसे सीखो’ उसी आशय को स्पष्ट और स्वाभाविक रीति से व्यक्त करता है।
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ (OCR; सम्भवतः क्षतिग्रस्त पाठ)
  choice: नम्रता में
  rationale: प्राप्त OCR यहाँ अविश्वसनीय है, पर समीक्षित पाठ-साक्ष्य क्रोध के प्रतिलोम रूप में gentleness/mildness का समर्थन करता है। ‘नम्रता’ हिन्दी में कोमल, गैर-कठोर भाव देता है और पंक्ति का विरोधाभास सुरक्षित रखता है।
theological_decisions:
- issue: क्रोध और नम्रता का कर्ता या धारक
  choice: ‘क्रोध में’ और ‘नम्रता में’ जैसी खुली रचना
  alternative: ‘जब तुम क्रोधित हो’ अथवा ‘मेरे क्रोध में’; ‘मेरी नम्रता से’
  rationale: कॉप्टिक पूर्वसर्गीय वाक्यांश स्पष्ट रूप से यह निर्धारित नहीं करते कि ये अवस्थाएँ वक्ता की हैं, श्रोताओं की हैं, या सुनने-सीखने की रीति बताती हैं। अनुवाद इस वास्तविक अस्पष्टता को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण आज्ञार्थक शैली रखी गई है। ‘क्रोध’ और ‘नम्रता’ के बीच मूल तनाव को स्पष्ट किया गया है, पर उसका आशय व्याख्या द्वारा सीमित नहीं किया गया।
