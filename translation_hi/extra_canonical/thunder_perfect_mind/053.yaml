base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/053.yaml
  text: 'I am she whom you have despised,

    and I am she upon whom you have deliberated.

    I am she whom you have seized,

    and I am she whom you have made alive.'
translation:
  language: hi
  text: 'मैं वही स्त्री हूँ जिसे तुमने तुच्छ जाना,

    और मैं वही स्त्री हूँ जिसके विषय में तुमने विचार किया।

    मैं वही स्त्री हूँ जिसे तुमने पकड़ लिया,

    और मैं वही स्त्री हूँ जिसे तुमने जीवित किया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसके बाद OCR में एक अधूरा वाक्यांश है, जो अगले पाठ-खंड में जारी होता प्रतीत होता है; अपूर्ण पाठ का अनुमान लगाने से बचने के लिए उसे यहाँ अनूदित नहीं किया गया है।
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: मैं वही स्त्री हूँ
  rationale: स्त्रीलिंग विधेयवाचक रूप वक्ता की स्त्री-वाणी को स्पष्ट करता है; हिन्दी में केवल ‘मैं वही हूँ’ कहने पर यह संकेत खो जाता।
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: तुच्छ जाना
  rationale: यूनानी मूल के इस क्रियापद का अर्थ ‘नीचा समझना/तिरस्कार करना’ है, न कि ‘सताना’; ‘तुच्छ जाना’ स्वाभाविक हिन्दी में इसका भाव रखता है।
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: मेरे विषय में विचार किया
  rationale: वाक्यांश विचार का लक्ष्य वक्ता को बनाता है; ‘षड्यंत्र रचा’ कहना प्रसंग से अधिक अर्थ जोड़ता।
- source_word: ϩⲱⲡ ⲉⲣⲟⲉⲓ
  choice: मुझे पकड़ लिया
  rationale: क्रिया पकड़ने या अधिकार में लेने का अर्थ दे सकती है; ‘पकड़ लिया’ ‘गिरफ़्तार किया’ की अपेक्षा व्यापकता बनाए रखता है।
- source_word: ⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ
  choice: मुझे जीवित किया
  rationale: सकर्मक प्रयोग ‘जीवित करना/जीवन देना’ व्यक्त करता है; समानांतर वाक्य-संरचना के लिए ‘जीवित किया’ रखा गया है।
- source_word: ⲛ̄ⲧⲟⲟⲧ
  choice: मुख्य पाठ में अनूदित नहीं
  rationale: यह अंश संभवतः पिछले वाक्य को पूरा करता है (‘मुझसे’) और वर्तमान ‘मैं हूँ’ कथन का ‘जहाँ तक तुम्हारा प्रश्न है’ जैसा आरंभ नहीं है।
theological_decisions:
- issue: वक्ता का स्त्रीलिंग परिचय
  choice: ‘मैं वही स्त्री हूँ’ द्वारा स्पष्ट रखा
  alternative: ‘मैं वही हूँ’
  rationale: कॉप्टिक का स्त्रीलिंग रूप पाठ की काव्यात्मक और वैचारिक पहचान का वास्तविक अंग है; इसे लिंग-निरपेक्ष करना स्रोत-सूचना मिटा देता।
- issue: ‘जीवित किया’ और ‘पकड़ लिया’ के बीच तनाव
  choice: दोनों कथनों को बिना सामंजस्य बैठाए समानांतर रखा
  alternative: ‘जीवित रखा’ या किसी प्रतीकात्मक अर्थ की व्याख्या
  rationale: पाठ विरोधाभासी पहचानें साथ रखता है; अनुवाद को उनका धार्मिक या रूपकात्मक समाधान नहीं थोपना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; चारों ‘मैं वही स्त्री हूँ’ कथनों की समानांतर संरचना तथा मूल की अर्थगत अनिश्चितता सुरक्षित रखी गई है।
