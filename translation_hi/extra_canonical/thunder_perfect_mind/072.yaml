  yaml_path: translation/extra_canonical/thunder_perfect_mind/072.yaml
  text: 'The voice of the angels who were sent forth in the word[a], and of the gods,

    the gods that go out by means of the counsel;

    and the spirits of humans who exist with me,

    and the women who exist within[m][l][k][j][i][h][g][f][e][d][c][b].

    I am she — you [pl.] ...'
translation:
  language: hi
  text: '**9.** उन स्वर्गदूतों का मौन[a], जिन्हें वचन[b] के भीतर भेजा गया था;

    और देवताओं[c] का—

    उन देवताओं का, जो परामर्श के द्वारा बाहर निकलते हैं;

    और उन मनुष्यों की आत्माओं का, जो मेरे साथ विद्यमान हैं;

    और उन स्त्रियों का, जो भीतर विद्यमान हैं[d]।

    मैं वही हूँ—तुम लोग…[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक ⲥⲓⲥ का पाठ और अर्थ अनिश्चित है। इसे यहाँ संज्ञा ‘मौन’ माना गया है; ‘शांत रहो’ जैसा आदेश भी संभव हो सकता है।
    reason: पाठगत और रूपगत अनिश्चितता
  - marker: b
    text: ‘वचन’ यूनानी मूल के कॉप्टिक ⲡⲗⲟⲅⲟⲥ (लोगोस) का अनुवाद है। इसे ‘लोगोस’ भी रखा जा सकता है।
    reason: शब्दार्थ का विकल्प
  - marker: c
