    reason: व्याकरणिक और धार्मिक अस्पष्टता
  - marker: d
    text: ‘भीतर’ का मूल शब्द ‘हृदय’ या ‘भीतरी भाग’ का भाव भी दे सकता है।
    reason: शब्दार्थ की व्यापकता
  - marker: e
    text: कॉप्टिक पाठ यहाँ द्वितीय पुरुष बहुवचन के आरंभ पर टूट जाता है; इसलिए ‘तुम लोग…’ अधूरा रखा गया है।
    reason: खंडित स्रोत-पाठ
