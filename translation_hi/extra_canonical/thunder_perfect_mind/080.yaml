  choice: नागरिक
  rationale: यह मानक नागरिकता-संबंधी शब्द है और ‘विदेशी’ के साथ मूल के विरोधाभासी युग्म को सुरक्षित रखता है।
- source_word: ⲉⲓ (पूर्णतासूचक/एओरिस्ट रूप, ‘आना’)
  choice: आ गया है
  rationale: यह पूर्ण हुई घटना और उसके वर्तमान परिणाम को व्यक्त करता है; ‘उठ खड़ा हुआ है’ भी प्रसंगानुकूल संभावना है।
theological_decisions:
- issue: वक्ता का शांति होना और फिर भी उसके कारण युद्ध आना
  choice: विरोधाभास को बिना समझाए ज्यों का त्यों रखा गया है
  alternative: इसे रूपक, न्याय या धार्मिक संघर्ष के रूप में स्पष्ट करना
  rationale: मूल कथन जानबूझकर तनावपूर्ण है; किसी विशेष धर्मवैज्ञानिक व्याख्या को पाठ में जोड़ना उचित नहीं।
- issue: एक ही वक्ता का विदेशी और नागरिक होना
  choice: दोनों पहचानों को समन्वित किए बिना साथ रखा गया है
  alternative: किसी आध्यात्मिक या सामाजिक दोहरी नागरिकता के रूप में व्याख्या करना
  rationale: काव्यात्मक विरोधाभास स्वयं पाठ का अंग है और उसे किसी संप्रदायगत अर्थ में सीमित नहीं किया जाना चाहिए।
