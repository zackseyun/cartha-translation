translation:
  language: hi
  text: '**5.** मैं शांति हूँ, और मेरे कारण युद्ध आ गया है[a];

    और मैं विदेशी[b] और नागरिक हूँ।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘युद्ध उठ खड़ा हुआ है’ भी संभव अनुवाद है; इससे युद्ध के भड़क उठने का भाव उभरता है।
    reason: lexical_alternative
  - marker: b
    text: 'या: ‘अजनबी’। मूल शब्द दोनों अर्थ दे सकता है; ‘विदेशी’ से ‘नागरिक’ के साथ नागरिकता-संबंधी विरोध अधिक स्पष्ट होता है।'
    reason: lexical_alternative
  - marker: c
    text: दिया गया कॉप्टिक OCR अंश इस खंड से मेल नहीं खाता; उसमें कोलासिस, फ्यूसिस, क्तिसिस और स्यूखे जैसे असंबद्ध यूनानी आगंतुक शब्द दिखाई देते हैं। इसलिए इस खंड का पाठ उपलब्ध संपादकीय संरेखण और प्रमाणित शब्द-साक्ष्य के आधार पर प्रस्तुत है।
    reason: alignment_note
