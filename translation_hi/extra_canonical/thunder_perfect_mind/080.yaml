  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘शांति/युद्ध’ और ‘विदेशी/नागरिक’ के समानांतर विरोधों को स्पष्ट रखा गया है; अस्पष्टता या धर्मवैज्ञानिक तनाव को व्याख्यात्मक विस्तार से समाप्त नहीं किया गया।
