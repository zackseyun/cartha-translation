base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/075.yaml
  text: I am the honored one and the one they bless[a], and the one they despise with contempt. I am Peace, and because of me there is War. I am Peace[e][d][c][b], and because of me there is War.
translation:
  language: hi
  text: '**12.** मैं वह हूँ जिसका आदर किया जाता है, जिसे वे आशीष देते हैं, और जिसे वे घोर तिरस्कार से तुच्छ समझते हैं। मैं शांति हूँ, और मेरे कारण युद्ध है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कॉप्टिक वाक्यांश अपूर्ण या अनिश्चित रूप में उपलब्ध है। इसका वैकल्पिक पुनर्निर्माण ‘मैं शांति हूँ, और मैं ही युद्ध हूँ’ भी किया गया है; मुख्य पाठ में कारणसूचक अर्थ रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲏⲟⲩ
  choice: वह हूँ जिसका सम्मान होता है
  rationale: इसे ⲧⲁⲉⲓⲟ (‘सम्मानित करना’) का गुणात्मक रूप माना गया है, न कि ‘मैं आई हूँ’। हिन्दी में कर्मवाच्य संबंधवाचक रचना स्त्री वक्ता की पहचान और पदवी-सदृश अर्थ दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: जिसे वे आशीष देते हैं
  rationale: ⲥⲙⲟⲩ को ‘आशीष देना’ और ⲉⲣⲟⲥ को स्त्रीलिंग संबंधवाचक पदबंध का अंग समझा गया है। यह ‘सम्मानित’ और ‘तुच्छ समझी गई’ के बीच मूल विरोधात्मक समानांतरता बनाए रखता है।
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ ϩⲛ ⲟⲩϣⲱⲥ
  choice: जिसे वे घोर तिरस्कार से तुच्छ समझते हैं
  rationale: यूनानी मूल के क्रियापद का अर्थ ‘तुच्छ समझना/घृणा करना’ है। ϩⲛ ⲟⲩϣⲱⲥ को छोड़ा नहीं गया, बल्कि ढंग या तीव्रता बताने वाले ‘घोर तिरस्कार से’ के रूप में रखा गया है।
- source_word: ϯⲣⲏⲛⲏ
  choice: मैं शान्ति हूँ
  rationale: यूनानी εἰρήνη से लिया गया स्पष्ट शब्द है। ‘शान्ति’ को वक्ता की विरोधाभासी आत्म-पहचान के रूप में रखा गया है।
- source_word: ⲛⲧⲁ ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: मेरे कारण युद्ध है
  rationale: खंडित वाक्यांश में ⲛⲧⲁ- को कारणसूचक ‘मेरे कारण’ और ⲡⲡⲟⲗⲉⲙⲟⲥ को ‘युद्ध’ समझा गया है। उपलब्ध अंश की अपूर्णता के कारण वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: शान्ति और युद्ध के बीच विरोधाभासी संबंध
  choice: ‘मैं शान्ति हूँ, और मेरे कारण युद्ध है’
  alternative: ‘मैं शान्ति हूँ, और मैं ही युद्ध हूँ’
  rationale: कारणसूचक पाठ उपलब्ध कॉप्टिक और रचना के विरोधाभासी आत्मोद्घाटन—दोनों के अनुकूल है; फिर भी वैकल्पिक व्याकरणिक पुनर्निर्माण को निर्णायक रूप से अस्वीकार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, काव्यात्मक और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। स्त्री वक्ता का संकेत ‘वह’ और संबंधवाचक संरचनाओं से स्वाभाविक रूप में बना रहता है। ‘शान्ति’ और ‘युद्ध’ को आत्म-पहचान की पदवी-सदृश भाषा बनाए रखने के लिए प्रमुख संज्ञाओं की तरह प्रस्तुत किया गया है।
