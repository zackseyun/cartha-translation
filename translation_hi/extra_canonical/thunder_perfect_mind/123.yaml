translation:
  language: hi
  text: वह जो होने को है[a]। मैं क्षमा[b] हूँ, और वह जो होने को है[a]। मैं क्षमा[b] हूँ, और वह जो होने को है[a]। मैं क्षमा[b] हूँ, और वह जो होने को है[a]…[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक पदबंध का शाब्दिक आशय ‘वह जो होगा/बनेगा’ है। क्रिया का अर्थ ‘होना’, ‘बनना’ या ‘घटित होना’ हो सकता है; OCR-पाठ अनिश्चित होने के कारण ‘जो घटित होगा’ भी संभव है।
    reason: मूल पाठ की व्याकरणिक और OCR-संबंधी अनिश्चितता बताना।
  - marker: b
    text: कॉप्टिक ⲥⲩⲛⲅⲛⲱⲙⲏ यूनानी συγγνώμη से लिया गया शब्द है; इसके अर्थ ‘क्षमा’, ‘क्षमादान’, ‘रियायत’ या ‘सहनशीलता’ हो सकते हैं।
    reason: महत्त्वपूर्ण शाब्दिक विकल्प सुरक्षित रखना।
  - marker: c
    text: उपलब्ध OCR-अंश अगले शब्द के केवल आरम्भिक अक्षर पर टूट जाता है; इसलिए यहाँ अपूर्णता-सूचक चिह्न दिया गया है।
    reason: स्रोत-अंश के कटे हुए अंत को स्पष्ट करना।
lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁϣⲱⲡⲉ
  choice: वह जो होने को है
  rationale: यह पदबंध संबंधवाचक भविष्य-रूप और ϣⲱⲡⲉ (‘होना, घटित होना, बनना’) को व्यक्त करता है। ‘वह जो होने को है’ व्यक्तिवाचक संबंधवाचकता बनाए रखता है, पर ‘होगा/बनेगा’ के बीच की मूल अर्थगत खुलावट को पूरी तरह बंद नहीं करता।
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: मैं … हूँ
  rationale: कॉप्टिक समतामूलक कथन का सीधा और स्वाभाविक हिन्दी रूप; बार-बार आने वाले आत्म-परिचय की लय भी सुरक्षित रहती है।
- source_word: ⲧⲉⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: क्षमा
  rationale: यूनानी συγγνώμη से आए इस शब्द का यहाँ स्पष्ट और गरिमापूर्ण हिन्दी अर्थ ‘क्षमा’ है; ‘क्षमादान’, ‘रियायत’ और ‘सहनशीलता’ संदर्भानुसार संभव हैं।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: यह सामान्य कॉप्टिक संयोजक है; ‘और’ पुनरावृत्तिमय प्रवाह को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: वक्ता द्वारा स्वयं को ‘क्षमा’ कहना
  choice: मैं क्षमा हूँ
  alternative: मेरे द्वारा क्षमा है / मैं क्षमा देती हूँ
  rationale: मूल पाठ पहचान का समतामूलक कथन करता है, कार्य या माध्यम का नहीं। इसलिए उसके प्रबल और रहस्यमय दावे को व्याख्यात्मक रूप से नरम नहीं किया गया।
- issue: ⲡⲉⲧⲛⲁϣⲱⲡⲉ का व्यक्तिवाचक अथवा घटनावाचक अर्थ
  choice: वह जो होने को है
  alternative: जो होने वाला है / जो घटित होगा / वह जो बनेगा
  rationale: पुल्लिंग संबंधवाचक रूप व्यक्तिवाचक पाठ का समर्थन करता है, जबकि क्रिया ‘होना/बनना/घटित होना’ की अर्थगत व्यापकता रखती है। अनुवाद और पादटिप्पणी दोनों पक्षों को खुला रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक पुनरावृत्ति रखी गई है। वाक्य-विन्यास जानबूझकर सरल है, ताकि रहस्यमय पहचान-कथन और मूल की आवर्तक लय बनी रहे।
