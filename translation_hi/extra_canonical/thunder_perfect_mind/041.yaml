translation:
  language: hi
  text: '**6.** मैं वह हूँ जो भयभीत लोगों में पाई जाती हूँ,[a][b]

    और काँपने के बीच मैं सामर्थ्य हूँ।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ स्त्रीलिंग पूरी रचना में वक्ता के स्थापित स्त्री-स्वर को दर्शाता है; कॉप्टिक सर्वनाम ⲁⲛⲟⲕ अपने आप में लिंग नहीं बताता।
    reason: cultural_note
  - marker: b
    text: मूल व्याकरण अधिक स्वाभाविक रूप से ‘जो भयभीत हैं’ अर्थात व्यक्तियों की ओर संकेत करता है; कुछ अनुवाद इसे अमूर्त रूप में ‘सब प्रकार के भयों में’ समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: ‘सामर्थ्य’ के लिए अपेक्षित कॉप्टिक संज्ञा इस OCR अंश में स्पष्ट दिखाई नहीं देती, पर समानांतर रचना और अन्य पाठ-साक्ष्यों के आधार पर इसे सावधानी से ग्रहण किया गया है। ‘काँपने’ का अर्थ ‘जो काँपते हैं’ भी हो सकता है।
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲛ
  choice: में / के बीच
  rationale: मूल संबंधबोधक स्थान या किसी अवस्था के भीतर होने का बोध देता है। पहली पंक्ति में व्यक्तियों के साथ स्वाभाविक ‘में’ और दूसरी में अवस्था के भीतर विद्यमान विरोधाभास को स्पष्ट रखने के लिए ‘के बीच’ चुना गया है।
- source_word: ⲛⲉⲧⲛϣⲟϫⲛⲉ
  choice: भयभीत लोग
  rationale: सापेक्ष रूप का संकेत व्यक्तियों—‘जो डरते हैं’—की ओर अधिक है, न कि केवल अमूर्त ‘भयों’ की ओर। ‘भयभीत लोग’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ϯⲛⲁⲕⲣⲣⲱ
  choice: पाई जाती हूँ
  rationale: रूप भविष्यकालीन अर्थ दे सकता है—‘पाई जाऊँगी’—पर रचना की आत्म-घोषणाओं के सूत्रात्मक और सामान्य-सत्य वाले स्वर में हिन्दी वर्तमानकाल अधिक स्वाभाविक है।
- source_word: ⲁⲛⲟⲕ
  choice: मैं वह हूँ
  rationale: बार-बार आने वाली आत्म-घोषणा और काव्यात्मक समानांतरता बनाए रखने के लिए स्पष्ट ‘मैं … हूँ’ रखा गया है। स्त्रीलिंग का संकेत क्रिया ‘पाई जाती हूँ’ से आता है।
- source_word: ⲛⲉⲧⲕⲗⲏϣ
  choice: काँपने
  rationale: इसे अमूर्त अवस्था ‘काँपना’ या व्यक्तियों ‘जो काँपते हैं’ के रूप में समझना संभव है। ‘काँपने’ से ‘सामर्थ्य’ के साथ मूल विरोधाभास संक्षिप्त और खुला रहता है।
- source_word: ⲟⲩϩⲟⲟⲩ (अपेक्षित पाठ)
  choice: सामर्थ्य
  rationale: ‘सामर्थ्य’ शक्ति, क्षमता और बल की अर्थ-छाया रखता है तथा काव्यात्मक धार्मिक गद्य में स्वाभाविक है। यह संज्ञा दिए गए OCR अंश में साफ़ नहीं दिखती, इसलिए पाठ-साक्ष्य के आधार पर सावधानी से ग्रहण की गई है।
theological_decisions:
- issue: वक्ता का स्त्रीलिंग स्वर
  choice: ‘पाई जाती हूँ’ द्वारा स्त्रीलिंग बनाए रखा गया
  alternative: लिंग-निरपेक्ष वाक्य-विन्यास
  rationale: कॉप्टिक ⲁⲛⲟⲕ स्वयं लिंग नहीं बताता, पर पूरी रचना में वक्ता का स्थापित स्त्रीलिंग स्वर है। यह चयन किसी अतिरिक्त धर्मवैज्ञानिक पहचान को आरोपित किए बिना साहित्यिक संदर्भ को सुरक्षित रखता है।
- issue: भय और सामर्थ्य का विरोधाभास
  choice: ‘काँपने के बीच मैं सामर्थ्य हूँ’
  alternative: ‘जो काँपते हैं, उनमें मैं सामर्थ्य हूँ’
  rationale: अमूर्त ‘काँपने’ को रखने से रचना का जानबूझकर रचा गया विरोधाभास बना रहता है; इसे मनोवैज्ञानिक सांत्वना या किसी विशिष्ट सिद्धांत में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर मूल की घोषणात्मक, काव्यात्मक और विरोधाभासी लय बनाए रखने के लिए वाक्य संक्षिप्त रखे गए हैं। ‘भयभीत’, ‘सामर्थ्य’ और ‘काँपने’ सामान्य पाठक के लिए बोधगम्य रहते हुए गरिमापूर्ण स्वर देते हैं। उपलब्ध OCR-संरेखण की विश्वसनीयता कम होने के कारण संदिग्ध पाठ को पादटिप्पणी में स्पष्ट किया गया है।
