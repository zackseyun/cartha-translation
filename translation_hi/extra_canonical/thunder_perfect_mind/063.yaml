  text: But whenever you appear[c][b][a], I will conceal myself from you.
translation:
  language: hi
  text: '**18.** परन्तु जब तुम प्रकट होते हो[a], मैं तुमसे छिप जाऊँगी।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जब तुम अपने आपको प्रकट करते हो।”'
    reason: lexical_alternative
  - marker: b
    text: 'यह पंक्ति एक विरोधाभासी जोड़ी का दूसरा भाग है: जब श्रोता अपने को छिपाते हैं, वक्ता दिखाई देती है; पर जब वे प्रकट होते हैं, वक्ता छिप जाती है।'
    reason: parallelism_note
lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: प्रकट होते हो
  rationale: इस क्रिया-समूह का अर्थ दिखाई देना या स्वयं को प्रकट करना है। ‘प्रकट होते हो’ सामने आने और छिपने के विरोध को सहज और स्पष्ट रखता है।
- source_word: ϩⲱⲡ
  choice: छिप जाऊँगी
  rationale: यहाँ अर्थ छिपने या अपने को छिपाने का है। हिन्दी में ‘छिप जाऊँगी’ स्वाभाविक है और वक्ता के अपने छिप जाने का भाव बनाए रखता है।
- source_word: ⲇⲉ
  choice: परन्तु
  rationale: प्रमाणित पंक्ति में यह संयोजक पिछले कथन के साथ विरोध स्थापित करता है; इसलिए ‘परन्तु’ विरोधाभासी समानांतरता को स्पष्ट करता है।
- source_word: ⲉⲧⲉⲧⲛ / ⲉⲣⲱⲧⲛ
  choice: तुम / तुमसे
  rationale: कॉप्टिक रूप बहुवचन हैं। आधुनिक हिन्दी का ‘तुम’ एक या अनेक श्रोताओं के लिए प्रयुक्त हो सकता है, पर यहाँ प्रसंगानुसार सामूहिक संबोधन समझा जाता है।
theological_decisions:
- issue: वक्ता का व्याकरणिक लिंग
  choice: छिप जाऊँगी
  alternative: छिप जाऊँगा / छिप जाऊँगी
  rationale: ‘थंडर, परफेक्ट माइंड’ में बोलने वाली वाणी स्वयं को स्त्रीलिंग रूपों में प्रस्तुत करती है। हिन्दी में भविष्यकाल लिंग बताना आवश्यक होने के कारण स्त्रीलिंग रखा गया है; इससे वक्ता की पहचान के बारे में कोई अतिरिक्त सांप्रदायिक निष्कर्ष नहीं निकाला गया।
- issue: प्रकट होने और छिपने का विरोधाभास
  choice: विरोध को बिना व्याख्यात्मक समाधान के यथावत रखा गया
  alternative: प्रकट होने या छिपने को रूपक बताकर स्पष्ट करना
  rationale: यह पंक्ति जानबूझकर रची गई विरोधाभासी जोड़ी का आधा भाग है; अनुवाद उसका धर्मवैचारिक तनाव नहीं सुलझाता।
