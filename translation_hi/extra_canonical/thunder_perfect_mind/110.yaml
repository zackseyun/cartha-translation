  rationale: OCR अंश के अंत में ‘वचन और नाम’ जैसा क्रम दिखाई देता है, पर यह संभवतः अगले या आसपास के वाक्यांश से जुड़ा है; अतः मुख्य पाठ में नहीं जोड़ा गया।
