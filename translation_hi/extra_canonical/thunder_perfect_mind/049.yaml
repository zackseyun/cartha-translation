base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/049.yaml
  text: And I am she whom you seized[a]. I am she whom you scattered, and you gathered me in. I am she before whom you were ashamed[b][c][d], and you were shameless toward me.
translation:
  language: hi
  text: 'और मैं वही हूँ जिसे तुमने पकड़ लिया।

    मैं वही हूँ जिसे तुमने तितर-बितर कर दिया[a], और फिर मुझे समेट लिया।

    मैं वही हूँ जिसके सामने तुम लज्जित हुए, और मेरे प्रति निर्लज्ज हुए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जिसे तुमने बाहर भेज दिया।”'
    reason: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ का अधिक शाब्दिक अर्थ ‘उसे बाहर भेजना’ हो सकता है; ‘तितर-बितर करना’ अगले ‘समेट लेना’ के साथ बने विरोध को सामने लाता है।
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: पकड़ लिया
  rationale: यह क्रिया किसी को पकड़ने, थामने या अपने वश में करने का भाव देती है। यहाँ ‘पकड़ लिया’ सहज है और स्रोत की हिंसक अथवा अधिकारपूर्ण छाया को खुला रखता है।
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
  choice: तितर-बितर कर दिया
  rationale: शाब्दिक संरचना ‘उसे बाहर भेजा/निकाला’ की ओर भी संकेत कर सकती है, पर अगले ‘समेट लिया’ के साथ काव्यात्मक विरोध के कारण ‘तितर-बितर कर दिया’ उपयुक्त है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ⲥⲱⲟⲩϩ … ⲉϩⲟⲩⲛ
  choice: समेट लिया
  rationale: क्रिया इकट्ठा करने का भाव देती है और दिशासूचक पद भीतर की ओर लाने को दर्शाता है। हिन्दी में ‘समेट लिया’ बिखेरने के साथ स्वाभाविक विरोध बनाता है।
- source_word: ϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: जिसके सामने तुम लज्जित हुए
  rationale: मूल में स्त्रीलिंग सर्वनाम के साथ ‘उसमें/उसके कारण लज्जित होना’ जैसा विन्यास है; ‘जिसके सामने’ हिन्दी में संबंध को स्वाभाविक रखते हुए कारण और उपस्थिति की हल्की अस्पष्टता बनाए रखता है।
- source_word: ⲣⲁⲧϣⲓⲡⲉ
  choice: निर्लज्ज हुए
  rationale: यह ‘लज्जा न करना’ अथवा ‘बेशर्म होना’ व्यक्त करता है। ‘निर्लज्ज हुए’ गरिमापूर्ण तथा पिछले ‘लज्जित हुए’ के साथ स्पष्ट विरोधी है।
theological_decisions:
- issue: वक्ता के स्त्रीलिंग आत्म-परिचय का निर्वाह
  choice: ‘वही हूँ जिसे/जिसके’ द्वारा स्त्री वक्ता के संदर्भ को प्रसंगानुकूल बनाए रखा गया
  alternative: हर वाक्य में ‘वही स्त्री हूँ’ कहना
  rationale: कॉप्टिक ⲁⲛⲟⲕ ⲧⲉ स्त्रीलिंग वक्ता को चिह्नित करता है, पर आधुनिक हिन्दी में बार-बार ‘स्त्री’ जोड़ना अस्वाभाविक और स्रोत से अधिक स्पष्टकारी होता।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। बार-बार आने वाले ‘मैं वही हूँ’ को सुरक्षित रखा गया है, क्योंकि यही इस आत्म-घोषणा की लय और बल का आधार है।
