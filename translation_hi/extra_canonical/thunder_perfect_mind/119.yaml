    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: वे मुझे पाएँगे
  rationale: भविष्यकालीन क्रिया ‘पाना’ और प्रथम पुरुष कर्म ‘मुझे’ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: उस स्थान पर
  rationale: निर्देशवाचक स्थान-सूचक पद का सामान्य और सटीक हिन्दी रूप।
- source_word: ⲛⲥⲉⲱⲛϩ
  choice: और जीवित रहेंगे
  rationale: ⲱⲛϩ जीवन या जीवित रहने को दर्शाता है; प्रसंग में भविष्यकालीन परिणाम के रूप में ‘जीवित रहेंगे’ स्वाभाविक है।
- source_word: ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ (probable reconstruction of OCR ⲛⲥⲉⲧⲙⲥⲱⲧ)
  choice: वे फिर नहीं मरेंगे
  rationale: प्राप्त OCR का अंतिम अंश दोषपूर्ण प्रतीत होता है; समीक्षित पठन में निषेध, ‘मरना’ और ‘फिर’ का अर्थ निकलता है।
theological_decisions:
- issue: ‘जीवित रहेंगे’ का आशय
  choice: अर्थ को केवल जीवन/जीवित रहने के सामान्य कथन के रूप में रखा गया
  alternative: इसे स्पष्ट रूप से ‘अनन्त जीवन पाएँगे’ कहना
  rationale: कॉप्टिक पद स्वयं यहाँ जीवन की अवधि या उसके धर्मवैज्ञानिक स्वरूप को स्पष्ट नहीं करता; इसलिए अनन्त जीवन का विचार पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और कथनात्मक शैली रखी गई है। उपलब्ध परामर्श-पाठ इस कॉप्टिक अंश से मेल नहीं खाता, इसलिए अनुवाद प्रत्यक्ष स्रोत-पाठ और उसके समीक्षित पुनर्निर्माण पर आधारित है।
