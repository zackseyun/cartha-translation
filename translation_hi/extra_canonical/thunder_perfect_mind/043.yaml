translation:
  language: hi
  text: 'मैं विवेकहीन हूँ, और मैं बुद्धिमान हूँ।


    मैं यूनानी और बर्बर दोनों का ज्ञान हूँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: ज्ञान
  rationale: संज्ञात्मक रूप ‘ज्ञान’ है; संशोधित पाठ में यह यूनानियों से संबंध रखने वाले पद के रूप में आता है।
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ ⲉⲣⲟⲥ
  choice: उसके विषय में अज्ञान
  rationale: पुनर्निर्मित कॉप्टिक में निषेधात्मक संज्ञा ‘अज्ञान’ और ⲉⲣⲟⲥ का स्त्रीलिंग संदर्भ है; ‘उसके विषय में’ संदर्भ को बनाए रखता है, यद्यपि उसका संकेत कुछ अस्पष्ट है।
- source_word: 'ϩⲁⲡ (OCR: ⲫⲁⲡ)'
  choice: न्याय
  rationale: समीक्षित पाठ में OCR ने लेख और ϩⲁⲡ को मिला दिया है; ϩⲁⲡ का अर्थ ‘न्याय/निर्णय’ है। यहाँ व्यक्तिवाचक उद्घोष में ‘न्याय’ अधिक स्वाभाविक है।
- source_word: ⲛⲉⲗⲗⲏⲛ
  choice: यूनानियों
  rationale: बहुवचन चिह्न के साथ यह ‘यूनानियों’ को दर्शाता है, न कि एकवचन ‘यूनानी’ को।
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: बर्बर लोगों
  rationale: बहुवचन रूप और प्राचीन यूनानी-सांस्कृतिक विरोध को बनाए रखने के लिए ‘बर्बर’ रखा गया; ‘लोगों’ जोड़ने से आधुनिक हिन्दी में संज्ञात्मक प्रयोग स्पष्ट होता है।
theological_decisions:
- issue: वक्ता का ज्ञान, अज्ञान और न्याय के रूप में आत्म-वर्णन
  choice: तीनों पदों को बिना व्याख्यात्मक सामंजस्य के प्रत्यक्ष रखा गया
  alternative: अज्ञान को ‘बुद्धिहीन’ और न्याय को पुनः ‘ज्ञान’ मानकर सरल विरोधाभास बनाना
  rationale: स्रोत-समीक्षा ज्ञान/अज्ञान और न्याय—दो अलग उद्घोषों—का समर्थन करती है। काव्यात्मक और धार्मिक तनाव को अनावश्यक रूप से सुलझाना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी। ‘बर्बर’ ऐतिहासिक यूनानी–गैर-यूनानी द्वंद्व की तीक्ष्णता रखता है। उपलब्ध OCR अंश दोषपूर्ण है, इसलिए नवीनतम विस्तृत स्रोत-समीक्षा में दिए गए पुनर्निर्मित कॉप्टिक को प्राथमिकता दी गई है।
