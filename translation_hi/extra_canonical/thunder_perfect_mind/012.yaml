base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/012.yaml
  text: I am the midwife and she who does not give birth[a]. I am the comfort of my labor pains. I am the bride and the bridegroom[d][c][b]. I am the mother of my father and the sister of my husband.
translation:
  language: hi
  text: 'मैं दाई हूँ, और वही हूँ जो जन्म नहीं देती।[a]

    मैं अपनी प्रसव-वेदनाओं की सांत्वना हूँ।

    मैं दुल्हन और माँ हूँ।[b]

    मैं बहन और पत्नी हूँ।

    मैं उसकी माँ हूँ जो…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक OCR में ϩⲙ ⲡⲓϫⲉⲕⲙ भी है, जिसका इस अंश से संबंध और पठन अनिश्चित है। पुराने अनुवादों में यहाँ विवाह-संबंधी पठन मिलता है, पर आगे के शब्द दाई और जन्म न देने वाली स्त्री की ओर संकेत करते हैं।
    reason: textual_uncertainty
  - marker: b
    text: दिए हुए कॉप्टिक OCR में यहाँ शाब्दिक रूप से “दुल्हन और माँ” दिखाई देता है। कुछ संपादित परंपराओं अथवा अंग्रेज़ी पुनर्निर्माणों में “दुल्हन और दूल्हा” मिलता है; बेहतर हस्तलिपि-मिलान से पठन बदल सकता है।
    reason: alternative_reading
  - marker: c
    text: अंश का अंतिम वाक्य ⲁⲛⲟⲕ ⲧⲉ ⲧⲙⲁⲁⲩ ⲛⲧⲉ (“मैं … की माँ हूँ”) पर अधूरा समाप्त होता है; इसलिए अभाव को तीन बिंदुओं से दिखाया गया है।
    reason: incomplete_source
