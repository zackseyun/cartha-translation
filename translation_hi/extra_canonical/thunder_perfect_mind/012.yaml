  alternative: अंग्रेज़ी POB के अनुसार ‘दूल्हा’, ‘अपने पिता की माँ’ और ‘अपने पति की बहन’ लिखना
  rationale: निर्देशानुसार मूल-भाषा साक्ष्य प्राथमिक है। वर्तमान OCR में ⲧⲙⲁⲁⲩ ‘माँ’, ⲧⲥⲱⲛⲉ ‘बहन’ और ⲧⲥϩⲓⲙⲉ ‘स्त्री/पत्नी’ दिखाई देते हैं, जबकि अंग्रेज़ी के विस्तृत संबंध इस अंश में स्पष्ट नहीं हैं।
