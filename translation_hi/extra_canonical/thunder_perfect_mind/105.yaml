base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/105.yaml
  text: 'You look on me[a], cast out from yourselves,

    and you are defeated.

    Listen to me, you hearers,

    and learn my words,

    you who know me[g][f][e][d][c][b].

    I am...'
translation:
  language: hi
  text: 'तुम मुझे देखते हो—तुम, जो अपनों के बीच से निकाल दिए गए हो[a]—

    और तुम हार जाते हो।


    मेरी सुनो, हे सुननेवालो,

    और मेरी बातें सीखो,

    हे मुझे जाननेवालो।


    मैं हूँ…[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पंक्ति का कॉप्टिक पाठ और उसका शब्द-विभाजन अनिश्चित है। एक अन्य सम्भव समझ है: “तुम मुझे खुले में देखते हो—तुम जो सफल होते हो।”'
    reason: textual_and_segmentation_uncertainty
  - marker: b
    text: यह आत्म-घोषणा अगले अंश में पूरी होती प्रतीत होती है; इसलिए यहाँ वाक्य को जानबूझकर अधूरा रखा गया है।
    reason: segment_boundary
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟⲓ
  choice: तुम मुझे देखते हो
  rationale: ⲛⲁⲩ ⲉ- का सीधा अर्थ ‘देखना’ है। वर्तमान और प्रत्यक्ष संबोधन दोनों को बनाए रखने के लिए स्वाभाविक हिन्दी रूप चुना गया।
- source_word: ⲙⲡⲉⲧⲛⲥⲁⲛϩⲟⲩ ⲛⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: तुम, जो अपनों के बीच से निकाल दिए गए हो
  rationale: उपलब्ध OCR में शब्द-विभाजन और पाठ संदिग्ध हैं। परामर्श-पाठ की संशोधित समझ ‘cast out from yourselves’ को सहज हिन्दी में व्यक्त किया गया है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ⲧⲉⲧⲛⲣⲥⲱⲧⲉ
  choice: तुम हार जाते हो
  rationale: पाठ को ⲧⲉⲧⲛ-ⲣ-ⲥⲱⲧⲉ समझने पर अर्थ ‘तुम पराजित होते/हार जाते हो’ है; इसे अलग करके ‘पुकारते हो’ पढ़ना उचित नहीं।
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: मेरी सुनो
  rationale: आदेशात्मक संबोधन की तात्कालिकता और हिन्दी की स्वाभाविक लय को बनाए रखता है।
- source_word: ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: हे सुननेवालो
  rationale: यूनानी मूल ἀκροατής का अर्थ ‘श्रोता/सुननेवाला’ है। ‘सुननेवालो’ निकटवर्ती ‘मेरी सुनो’ की शब्द-प्रतिध्वनि भी बचाता है।
- source_word: ⲛⲧⲉⲧⲛⲭⲓⲥⲃⲱ ⲉⲛⲁⲯⲩⲭⲏ
  choice: और मेरी बातें सीखो
  rationale: समीक्षित पाठ में OCR रूप ⲭⲓⲥⲃⲱ को ϫⲓ-ⲥⲃⲱ, ‘शिक्षा ग्रहण करना/सीखना’, और ⲉⲛⲁⲯⲩⲭⲏ को भ्रष्ट पाठ के रूप में ⲉ-ⲛⲁ-ϣⲁϫⲉ, ‘मेरी बातों/वचनों को’, समझा गया है। हिन्दी में ‘मेरी बातें सीखो’ अर्थ और काव्यात्मक सरलता दोनों रखता है।
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: हे मुझे जाननेवालो
  rationale: इसे पिछले ‘हे सुननेवालो’ के समानांतर संबोधन माना गया है, अलग कथन नहीं।
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: मैं हूँ…
  rationale: यह अगले वाक्य या आत्म-घोषणा का आरम्भ है। अंश यहीं कटता है, इसलिए ‘वही’ जैसी पूर्ति जोड़े बिना अपूर्णता दर्शाई गई है।
theological_decisions:
- issue: ⲁⲛⲟⲕ ⲡⲉ की अपूर्ण आत्म-घोषणा
  choice: मैं हूँ…
  alternative: मैं ही वह हूँ।
  rationale: खंड की सीमा पर वाक्य आगे जारी होता प्रतीत होता है। ‘वह’ जोड़ना पहचान को अनावश्यक रूप से पूर्ण करके संभावित धार्मिक अर्थ आरोपित करता।
- issue: जाननेवालों का व्याकरणिक संबंध
  choice: हे मुझे जाननेवालो
  alternative: जो मुझे जानते हैं, उनके लिए मैं वही हूँ
  rationale: समानांतर संबोधन संरचना को सुरक्षित रखा गया है; इसे आत्म-परिभाषा में मिलाने से स्रोत का वाक्य-विन्यास और तनाव बदल जाता।
