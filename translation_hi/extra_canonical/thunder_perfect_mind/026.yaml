base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/026.yaml
  text: 'You who know me[a], be ignorant of me;

    and those who have not known me, let them know me[b],

    for I am knowledge and ignorance.'
translation:
  language: hi
  text: 'तुम जो मुझे जानते हो[a], मुझे न जानो;


    और जो मुझे नहीं जानते, वे मुझे जान लें[b],


    क्योंकि मैं ज्ञान भी हूँ और अज्ञान भी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘न जानो’ कॉप्टिक में प्रयुक्त यूनानी ऋण-क्रिया ἀγνοεῖν को दर्शाता है। इसका अर्थ ‘अज्ञानी होना’ या ‘न जानना’ हो सकता है; ‘अज्ञानी हो जाओ’ अधिक शाब्दिक, पर हिन्दी में अधिक कठोर विकल्प है।
    reason: lexical_alternative
  - marker: b
    text: दिए गए OCR अंश में पृथ्वी पर निकलने वाली आवाज़ से संबंधित पंक्तियाँ भी हैं, जो संभवतः पास के किसी दूसरे अंश की हैं। यह अनुवाद ‘जानने/अज्ञान’ वाले पद्यांश के मानक पाठ-स्थान का अनुसरण करता है।
    reason: alignment_note
