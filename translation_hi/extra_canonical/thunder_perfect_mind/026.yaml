  choice: जानना
  rationale: यह बोध या परिचय के सामान्य अर्थ वाला मूल कॉप्टिक क्रियापद है। ‘जानना’ सरल है और विरोधात्मक वाक्य-संरचना को स्पष्ट रखता है।
- source_word: ⲁⲅⲛⲟⲉⲓ (क्रिया; यूनानी ἀγνοεῖν से)
  choice: अनजान हो जाना
  rationale: यह आज्ञार्थक बल तथा ‘जानना’ के साथ तीखा विरोध बनाए रखता है। ‘अज्ञानी बनो’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है और व्यक्ति की बुद्धि पर अपमानजनक टिप्पणी का अनचाहा भाव कम करता है।
- source_word: ⲅⲛⲱⲥⲓⲥ (संज्ञा)
  choice: ज्ञान
  rationale: यूनानी मूल शब्द का मानक और सीधा हिन्दी समतुल्य; विपरीत संज्ञा ‘अज्ञान’ के साथ सूत्रात्मक समानांतरता बनाए रखता है।
- source_word: ⲁⲅⲛⲱⲥⲓⲁ (संज्ञा)
  choice: अज्ञान
  rationale: ‘ज्ञान’ का परंपरागत और स्पष्ट विलोम है तथा मूल की विरोधाभासी घोषणा को बिना व्याख्यात्मक समाधान के सुरक्षित रखता है।
theological_decisions:
- issue: वक्ता का स्वयं को ज्ञान और अज्ञान दोनों कहना
  choice: ‘मैं ज्ञान भी हूँ और अज्ञान भी’ के रूप में विरोधाभास यथावत रखा गया
  alternative: इसे ज्ञान-अज्ञान से परे होने या दोनों का स्रोत होने के रूप में स्पष्ट करना
  rationale: मूल कथन जानबूझकर तनावपूर्ण और अस्पष्ट है; किसी विशेष दार्शनिक या धर्मवैचारिक अर्थ से इसे सुलझाना पाठ में अतिरिक्त व्याख्या जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। ‘मुझसे अनजान हो जाओ’ स्वाभाविक हिन्दी देते हुए मूल आज्ञार्थक विरोध को बनाए रखता है; अंतिम पंक्ति में ‘भी…और…भी’ से दोनों विपरीत पहचानों पर समान बल दिया गया है।
