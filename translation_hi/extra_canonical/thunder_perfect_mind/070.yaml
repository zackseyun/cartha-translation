  yaml_path: translation/extra_canonical/thunder_perfect_mind/070.yaml
  text: the finding of those who seek me[a], and the command of those who ask me, and the voice of the voices of the place of God, of the angels[d][c][b], which they utter
translation:
  language: hi
  text: 'जो मुझे खोजते हैं, उनकी खोज,

    और जो मुझसे माँगते हैं, उनकी आज्ञा,

    और परमेश्वर के स्थान की वाणियों की वाणी—

    स्वर्गदूतों की—जिसे वे उच्चारित करते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम पद का वाक्यगत संबंध अनिश्चित है: इसका अर्थ ‘जिसे वे उच्चारित करते हैं’ हो सकता है; ‘जिसे उन्होंने उच्चारित किया’ भी संभव है। ‘स्वर्गदूतों की’ का संबंध ‘वाणियों’ से या अंतिम उपवाक्य से समझा जा सकता है।'
    reason: textual_and_syntactic_ambiguity
lexical_decisions:
- source_word: ⲡⲅⲓⲛⲉ ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: जो मुझे खोजते हैं, उनकी खोज
  rationale: ⲡⲅⲓⲛⲉ संज्ञात्मक रूप में ‘खोज/पा लेना’ और ϣⲓⲛⲉ ⲛⲥⲱ= ‘किसी को खोजना’ व्यक्त करता है। यहाँ ‘निंदा’ का अर्थ और प्रश्नवाचक रचना स्रोत में नहीं है। हिंदी में संज्ञात्मक समानांतरता बचाने के लिए ‘उनकी खोज’ रखा गया है।
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: आज्ञा
  rationale: शब्द का सामान्य अर्थ ‘आदेश/आज्ञा’ है। ‘आज्ञा’ काव्यात्मक गरिमा और संज्ञात्मक संरचना दोनों बनाए रखता है, यद्यपि अगले संबंधसूचक पद के कारण वाक्यांश अर्थ की दृष्टि से कुछ रहस्यमय है।
- source_word: ⲛⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ
  choice: जो मुझसे माँगते हैं
  rationale: यूनानी-मूल ⲁⲓⲧⲉⲓ का अर्थ ‘माँगना/याचना करना’ है; ‘मेरा आदर करते हैं’ स्रोत-सम्मत नहीं है।
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: वाणियों की वाणी
  rationale: स्रोत की जानबूझकर दोहराई गई ‘voice of the voices’ संरचना को बनाए रखा गया है। ‘वाणी’ यहाँ साधारण ‘आवाज़’ की अपेक्षा अधिक गरिमापूर्ण और काव्यानुकूल है।
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱⲥⲓⲥ
  choice: परमेश्वर के स्थान की
  rationale: OCR में पंक्ति-विभाजन के पार ⲑⲉⲱⲥⲓⲥ संभवतः यूनानी θεός के रूप/लिप्यंतरण से जुड़ा है। उपलब्ध पाठ के अनुसार संबंधसूचक अर्थ ‘परमेश्वर के स्थान की’ रखा गया है।
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ
  choice: स्वर्गदूतों की—जिसे वे उच्चारित करते हैं
  rationale: ⲁⲅⲅⲉⲗⲟⲥ को ‘स्वर्गदूत’ और ⲧⲁⲟⲩⲟ को संदर्भानुसार ‘उच्चारित करना/प्रकट करना’ समझा गया है। सर्वनाम के वचन-संबंध में अस्पष्टता को अत्यधिक स्पष्ट नहीं किया गया।
theological_decisions:
- issue: ‘परमेश्वर के स्थान’ और ‘स्वर्गदूतों’ के बीच संबंध
  choice: ‘स्वर्गदूतों की’ को डैशों के बीच रखा गया, ताकि वह ‘वाणियों’ की व्याख्या भी हो सके और आगे के उपवाक्य से भी जुड़ सके।
  alternative: ‘परमेश्वर के स्थान की, स्वर्गदूतों की वाणियों की वाणी’ अथवा ‘परमेश्वर के स्थान में स्वर्गदूतों की वाणियों की वाणी’
  rationale: कॉप्टिक संबंधसूचक शृंखला और OCR-पंक्ति-विभाजन सटीक वाक्यगत संबंध को अनिश्चित रखते हैं। हिंदी में किसी एक देवदूत-संबंधी व्याख्या को अंतिम रूप से आरोपित करने के बजाय विरामचिह्न से वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक और संज्ञात्मक समानांतरता वाला रूप चुना गया है। स्रोत में प्रश्न नहीं है, इसलिए परामर्श-पाठ का ‘तुम मुझे क्यों…?’ रूप ग्रहण नहीं किया गया। ‘खोज—आज्ञा—वाणी’ की त्रिपदी संरचना तथा मूल की रहस्यमय व्याकरणिक कसावट यथासंभव सुरक्षित है।
