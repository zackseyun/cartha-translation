review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly rejects the unrelated interrogative consult text and follows the supplied Coptic sequence: finding/seekers, command/requesters, and voice/voices. However, ⲡⲅⲓⲛⲉ is more specifically the finding or attainment of the seekers than their act of searching. The final relative form ⲛ̄ⲧⲁⲩ- is past/perfective, so the Hindi should not render it as present ‘वे उच्चारित करते हैं.’'
  naturalness: ‘जो मुझे खोजते हैं, उनकी खोज’ is intelligible but blurs the noun ‘finding’ into the action ‘search.’ ‘मुझे खोजने वालों की प्राप्ति’ is both more exact and natural in this compressed, poetic catalogue. The dash-enclosed ‘स्वर्गदूतों की’ leaves an unnecessarily broken Hindi construction; commas preserve the source’s dense genitive sequence without assigning a stronger syntactic relation than the text permits.
  terminology: ‘आज्ञा’ suitably renders ‘command,’ ‘वाणी’ preserves the elevated repetition ‘voice of voices,’ and ‘परमेश्वर’ and ‘स्वर्गदूत’ are appropriate modern-standard Hindi terms. The ambiguous chain connecting the place of God, angels, and the final relative clause should remain unharmonized.
  issues:
  - severity: medium
    issue: The first phrase renders ‘finding’ as ‘search.’
    rationale: The source has the noun ⲡⲅⲓⲛⲉ followed by ‘of those seeking me.’ Hindi should retain the result/attainment noun rather than repeat the seeking action.
  - severity: medium
    issue: The final verb is rendered in the present tense.
    rationale: The relative construction ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ contains the perfective/past prefix ⲁⲩ. Given the supplied English audit trail’s ‘which they utter,’ Hindi should read ‘जिसे उन्होंने उच्चारित किया,’ while noting that the exact referent and verb nuance remain uncertain.
  - severity: low
    issue: Dash bracketing makes ‘स्वर्गदूतों की’ syntactically awkward.
    rationale: The source’s genitive chain is difficult, but ordinary commas better retain its ambiguity in Hindi than treating the phrase as a parenthesis.
  revised_text: 'मुझे खोजने वालों की प्राप्ति,


    और मुझसे माँगने वालों की आज्ञा,


    और परमेश्वर के स्थान की वाणियों की वाणी,


    स्वर्गदूतों की, जिसे उन्होंने उच्चारित किया।[a]'
  revised_footnotes:
  - marker: a
    text: अंतिम पद का वाक्यगत संबंध अनिश्चित है। ‘स्वर्गदूतों की’ का संबंध पूर्ववर्ती ‘वाणियों’ से या अंतिम संबंधवाचक उपवाक्य से समझा जा सकता है। कॉप्टिक क्रिया का रूप भूतकाल/पूर्णता सूचित करता है; उसका सटीक अर्थ ‘उच्चारित किया’ के अतिरिक्त ‘प्रकट किया’ भी हो सकता है।
    reason: textual_and_syntactic_ambiguity
