base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/002.yaml
  text: 'Consider me[1], and I found myself among those who seek me,

    you who watch for me—you yourselves;[3]

    and you hearers, listen to me.

    You who are troubled in heart, receive me to yourselves[d][c][b][a][4][3][2],

    and do not turn away from me.[4]'
translation:
  language: hi
  text: '**2.** मुझे स्मरण करो; और मैंने अपने आपको उन लोगों के बीच पाया जो मुझे खोजते हैं।[a]


    तुम जो मेरी बाट जोहते हो—हाँ, तुम स्वयं—;


    और तुम सुननेवालो, मेरी सुनो।


    तुम जिनका मन व्याकुल है, मुझे अपने पास स्वीकार करो,


    और मुझसे दूर मत भागो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कॉप्टिक पाठ का शाब्दिक व्याकरण है, “मैंने अपने आपको उन लोगों के बीच पाया जो मुझे खोजते हैं।” आज्ञाओं की इस शृंखला के कारण कुछ लोग पाठ को “और मुझे उन लोगों के बीच खोजो जो मुझे खोजते हैं” समझते या सुधारते हैं।
    reason: पाठगत और व्याकरणिक अनिश्चितता
  - marker: b
    text: शाब्दिक रूप से, “मुझसे मत भागो।” ‘मुझसे दूर मत भागो’ सम्बन्ध-विच्छेद के भाव को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
    reason: शब्दार्थ और वाक्यांश का वैकल्पिक अर्थ
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: मेरा ध्यान करो
  rationale: ⲙⲉⲉⲩⲉ का अर्थ सोचना, मनन करना या ध्यान देना है। आज्ञार्थक प्रसंग में यह स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: मैंने अपने आपको उन लोगों के बीच पाया जो मुझे खोजते हैं
  rationale: उपलब्ध पाठ में ⲁⲓϭⲓⲛⲉ प्रथम पुरुष एकवचन पूर्ण भूत रूप है और ⲙⲙⲟⲓ उसका प्रथम पुरुष कर्म है। असामान्य वाक्य होने पर भी अनिश्चितता को मिटाने के बजाय मुख्य पाठ में प्रत्यक्ष व्याकरण सुरक्षित रखा गया है।
- source_word: ⲧⲉⲧⲛⲉⲣⲟⲉⲓⲥ ... ⲉⲣⲟⲓ
  choice: मेरी ओर जागते रहो
  rationale: ⲣⲟⲉⲓⲥ का अर्थ जागना, चौकसी रखना या बाट जोहना है; इसे ‘जानना’ नहीं किया गया। काव्यात्मक संबोधन में ‘जागते रहो’ इसकी सक्रिय सतर्कता बनाए रखता है।
- source_word: ⲉⲧⲏⲩⲧⲛ
  choice: तुम स्वयं
  rationale: स्वतंत्र सर्वनाम के बलाघात को हिन्दी में स्पष्ट रखा गया है।
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ, ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: तुम सुननेवालो, मेरी सुनो
  rationale: ⲣⲉϥ- यहाँ कर्तावाचक संज्ञा बनाता है; इसलिए इसे भविष्यसूचक संबंधवाक्य नहीं, सीधे बहुवचन संबोधन के रूप में अनूदित किया गया है।
- source_word: ⲛⲉⲧⲧⲟϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ
  choice: तुम जिनका मन व्याकुल है
  rationale: यह भीतरी भय या अशांति व्यक्त करता है। ‘मन व्याकुल’ आधुनिक हिन्दी में सहज है और केवल भय तक अर्थ को सीमित नहीं करता।
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: मुझे अपने पास ग्रहण करो
  rationale: ϣⲟⲡⲧ को ϣⲱⲡ ‘लेना/ग्रहण करना’ के आज्ञार्थक रूप और प्रथम पुरुष कर्म-प्रत्यय के साथ समझा गया है; ⲉⲣⲱⲧⲛ ‘अपने पास/अपने लिए’ जोड़ता है।
- source_word: ⲙⲡⲣⲡⲱⲧ ⲛⲥⲱⲓ
  choice: मुझसे दूर मत भागो
  rationale: ⲙⲡⲣ- निषेधात्मक आज्ञा और ⲡⲱⲧ ‘दौड़ना/भागना’ है। प्रसंग में संबंध-विच्छेद का भाव हिन्दी में ‘दूर मत भागो’ से व्यक्त होता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: वक्ता और खोजनेवालों के संबंध की असामान्य अभिव्यक्ति
  choice: ‘मैंने अपने आपको ... पाया’ को मुख्य पाठ में बनाए रखा गया
  alternative: ‘मुझे उन लोगों के बीच खोजो जो मुझे खोजते हैं’
  rationale: उपलब्ध कॉप्टिक रूप प्रथम पुरुष कथन का समर्थन करता है, जबकि आज्ञार्थक विकल्प साहित्यिक समानांतरता के अनुकूल है। किसी एक धर्मवैचारिक अर्थ को थोपने के बजाय पाठगत तनाव स्पष्ट रखा गया है।
