  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/018.yaml
  text: '[...] and the one who boasts brings these to me[a]. I am the silence that is incomprehensible, and the thought whose remembrance is great. I am the voice whose sound is manifold[f][e][d][c][b], and the word that is multiple.'
translation:
  language: hi
  text: '[…] और जो डींग मारता है, वह इन्हें मेरे पास लाता है।[a]


    मैं वह मौन हूँ जिसे समझा नहीं जा सकता,


    और वह विचार हूँ जिसकी स्मृति महान है।


    मैं वह वाणी हूँ जिसकी ध्वनि अनेक रूपों वाली है,


    और वह वचन हूँ जो अनेक रूपों वाला है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'आरंभिक पाठ खंडित है और OCR-पाठ अनिश्चित है। यहाँ इसका अर्थ लिया गया है: “जो डींग मारता है, वह इन्हें मेरे पास लाता है।” इसे पहले “प्रतिध्वनि और पुकारने वाला” भी समझा गया था।'
    reason: textual_and_alignment_uncertainty
