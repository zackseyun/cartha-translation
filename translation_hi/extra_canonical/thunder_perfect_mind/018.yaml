  choice: वह वचन हूँ जिसके रूप अनेक हैं
  rationale: यूनानी λόγος को गरिमापूर्ण ‘वचन’ से व्यक्त किया गया है; अंतिम ⲛⲁϣⲉ बहुलता/प्रचुरता बताता है, जबकि OCR अंश वाक्य के अंत से पहले कटता है।
theological_decisions:
- issue: λόγος का धार्मिक या साधारण अर्थ
  choice: वचन
  alternative: शब्द
  rationale: ‘वचन’ ऊँचे काव्यात्मक स्तर और λόγος की व्यापक अर्थच्छाया को बनाए रखता है, पर इसे किसी विशिष्ट मतगत पहचान के रूप में स्पष्ट नहीं करता।
