  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। लगातार ‘मैं वह… हूँ’ संरचना मूल के घोषणात्मक लय-विन्यास को बनाए रखती है। आरंभ में […] स्रोत-अंश के अपूर्ण प्रारंभ को दर्शाता है।
