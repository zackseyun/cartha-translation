  register: आधुनिक मानक हिंदी, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण। बहुवचन संबोधन के लिए 'तुम लोगों' का प्रयोग किया गया है। पांडुलिपि की रिक्तियाँ [...] से स्पष्ट की गई हैं; भ्रमित अंग्रेज़ी परत में आए 'रोटी/चक्की' अर्थ को कॉप्टिक रूपों के आधार पर अस्वीकार किया गया है।
