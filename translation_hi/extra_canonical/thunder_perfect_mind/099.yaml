  text: I am among you who [...] yourselves out from the [...][a]. Who is it that will release you? Or if he releases you from it[d][c][b], who will be able to [...]?
translation:
  language: hi
  text: '**15.** मैं तुम लोगों के बीच हूँ—तुम, जो [...] अपने आप को [...] से बाहर निकालते हो।[a] कौन है जो तुम्हें छुड़ाएगा? अथवा यदि वह तुम्हें उससे छुड़ा दे, तो कौन [...] कर सकेगा?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पांडुलिपि यहाँ टूटी हुई है। “अपने आप को” का संबंध बहुवचन “तुम” से है, पर जिस वस्तु या अवस्था से बाहर निकलने की बात है उसका नाम सुरक्षित नहीं है।
    reason: textual_gap
  - marker: b
    text: अंतिम क्रिया पांडुलिपि में अधूरी है; इसलिए “कौन” और सामर्थ्य का भाव सुरक्षित रखते हुए लुप्त शब्द को पूरा नहीं किया गया है।
    reason: textual_gap
lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛⲧⲏⲏⲧⲉ
  choice: मैं तुम लोगों के बीच हूँ
  rationale: ϣⲟⲟⲡ अस्तित्व/उपस्थिति और ⲛⲧⲏⲏⲧⲉ बहुवचन संबोधन के बीच होने को व्यक्त करता है।
- source_word: ⲧⲏⲛⲉ
  choice: तुम्हें / अपने आप को
  rationale: यह द्वितीय पुरुष बहुवचन कर्म-सर्वनाम है; पहले खंड में वाक्य-संबंध के अनुसार आत्मवाचक रूप स्वाभाविक है, और बाद में सीधा कर्म 'तुम्हें'।
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: तुम्हें छुड़ाएगा
  rationale: ⲕⲁ ... ⲉⲃⲟⲗ का संयुक्त अर्थ यहाँ छोड़ देना, मुक्त करना या छुड़ाना है; प्रश्न में 'छुड़ाना' सहज और अर्थ-संगत है।
- source_word: ⲛϩⲏⲧϥ
  choice: उससे
  rationale: पुल्लिंग एकवचन प्रत्यय किसी पूर्वोक्त, किंतु खंडित संज्ञा की ओर संकेत करता है; हिंदी में संदर्भ को अनिश्चित रखते हुए 'उससे' उपयुक्त है।
- source_word: ⲛⲓⲙ ⲡⲉⲧⲛⲁϣ[...]
  choice: कौन [...] कर सकेगा?
  rationale: ⲛⲓⲙ प्रश्नवाचक 'कौन' है और ⲡⲉⲧⲛⲁϣ[...] सामर्थ्यसूचक अधूरा खंड है; लुप्त क्रिया की पूर्ति नहीं की गई।
theological_decisions:
- issue: वक्ता की उपस्थिति और मुक्ति देने वाले की पहचान
  choice: वक्ता को मुक्ति देने वाले व्यक्ति के साथ स्वतः समान नहीं माना गया
  alternative: दोनों को एक ही सत्ता मानकर सर्वनाम स्पष्ट करना
  rationale: खंडित कॉप्टिक पाठ पहचान को निश्चित नहीं करता; अस्पष्टता और पाठ का तनाव सुरक्षित रखा गया है।
- issue: ⲛϩⲏⲧϥ का पूर्वपद
  choice: अनिश्चित 'उससे'
  alternative: किसी विशेष स्थान, वस्तु या शक्ति का नाम देना
  rationale: जिस संज्ञा की ओर प्रत्यय संकेत करता है वह क्षतिग्रस्त है, इसलिए विशिष्ट धार्मिक अर्थ आरोपित नहीं किया गया।
