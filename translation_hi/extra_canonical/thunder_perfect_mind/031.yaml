base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/031.yaml
  text: …leave me as I come forth[a]. And you will seek me in riches[c][b]. And do not look at me as I come forth among those who are honored…
translation:
  language: hi
  text: …और जब मैं बाहर आती हूँ, तब तुम मुझे छोड़ देते हो।[a] और तुम मुझे धन-संपत्ति में पाओगे।[b] और जब मैं सम्मानित लोगों के बीच से बाहर आती हूँ, तब मेरी ओर मत देखो…[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध कॉप्टिक अंश वाक्य के बीच से आरंभ होता है; इसलिए आरंभ में दीर्घविराम रखा गया है।
    reason: fragment_boundary
  - marker: b
    text: ‘धन-संपत्ति’ का अनुवाद ‘समृद्धि’ या ‘धन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अंश का अंतिम शब्द अधूरा है। अगले अक्षरों के आधार पर इसे ‘सम्मानित लोग’ के रूप में पूरा किया गया है; वाक्य आगे भी जारी रहता है।
    reason: textual_restoration
lexical_decisions:
- source_word: ⲕⲁⲁⲧ
  choice: मुझे छोड़ देते हो
  rationale: यहाँ क्रिया ⲕⲱ ‘छोड़ना’ के साथ प्रथम पुरुष एकवचन कर्म-प्रत्यय है; इसे ‘ध्यान दो’ समझना रूपात्मक रूप से उचित नहीं है।
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: जब मैं बाहर आती हूँ
  rationale: इसे प्रथम पुरुष एकवचन की परिस्थितिवाचक रचना के रूप में पढ़ा गया है—‘मेरे बाहर आते समय’; वक्ता स्त्रीलिंगी रूप में अपना परिचय देती है, इसलिए हिन्दी में ‘आती हूँ’ है।
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: तुम मुझे पाओगे
  rationale: भविष्यकालीन ϭⲓⲛⲉ का अर्थ यहाँ ‘पाना/मिलना’ है, न कि ϣⲓⲛⲉ ‘खोजना’।
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: धन-संपत्ति
  rationale: ⲣⲙⲁⲟ ‘धनी’ से बना भाववाचक संज्ञा-रूप संपन्नता अथवा धन को दर्शाता है; ‘महानता’ की अपेक्षा ‘धन-संपत्ति’ अधिक सटीक है।
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: और मेरी ओर मत देखो
  rationale: ⲙⲡⲣ- निषेधात्मक आज्ञा है; अतः वाक्य निषेधात्मक आदेश है, साधारण भविष्यकाल ‘तुम मुझे नहीं देखोगे’ नहीं।
- source_word: ⲛⲉⲧⲧⲁ…
  choice: सम्मानित लोग
  rationale: अंश का अंतिम रूप अगले खंड में जारी होने वाले ⲛⲉⲧⲧⲁⲉⲓⲏⲩ ‘जो सम्मानित हैं’ का आरंभ माना गया है; अकेले इसे ‘दीन’ या ‘छोटे लोग’ पढ़ना उचित नहीं।
theological_decisions:
- issue: वक्ता के बाहर आने और धन-संपत्ति तथा सम्मानित लोगों से उसके संबंध का विरोधाभास
  choice: विरोधाभासी कथनों को बिना समन्वित व्याख्या के यथावत रखा गया है।
  alternative: इन पंक्तियों को धन या सम्मान की निंदा अथवा समर्थन के रूप में स्पष्ट करना।
  rationale: स्रोत काव्यात्मक और विरोधाभासी है; किसी विशिष्ट धर्मवैचारिक निष्कर्ष को अनुवाद में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और प्रत्यक्ष संबोधन रखा गया है। ‘तुम’ बहुवचन श्रोताओं को स्वाभाविक ढंग से व्यक्त करता है। स्रोत-अंश की दोनों सीमाओं पर अपूर्णता दिखाने के लिए दीर्घविराम रखे गए हैं।
