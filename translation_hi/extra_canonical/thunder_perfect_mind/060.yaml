base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/060.yaml
  text: 'But out of shame, receive me to yourselves in shamelessness;

    and out of shamelessness and shame, reprove my members among yourselves;

    and approach yourselves.'
translation:
  language: hi
  text: 'अतः, लज्जा से बाहर निकलकर मुझे निर्लज्जता के साथ अपने पास ग्रहण करो;


    और निर्लज्जता और लज्जा से बाहर निकलकर मेरे अंगों को अपने बीच धिक्कारो[a];


    और अपनी ही ओर आओ[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे अंगों” का अर्थ “मेरे सदस्यों” भी हो सकता है; स्रोत यह स्पष्ट नहीं करता कि आशय शारीरिक अंगों से है या लोगों से।
    reason: lexical_ambiguity
  - marker: b
    text: 'शाब्दिक भाव: “और तुम अपनी ओर आने को अपनी ओर करो।” वाक्य स्वयं अपनी ओर आने की असामान्य, आत्मवाचक छवि रखता है।'
    reason: idiom_and_source_tension
lexical_decisions:
- source_word: ϣⲓⲡⲉ
  choice: लज्जा
  rationale: यहाँ संज्ञा का मूल अर्थ ‘लज्जा/शर्म’ है; विरोधाभासी युग्म को बनाए रखने के लिए इसे अमूर्त संज्ञा के रूप में रखा गया है।
- source_word: ϣⲟⲡⲧ
  choice: मुझे ... ग्रहण करो
  rationale: इसे ϣⲱⲡ ‘ग्रहण करना’ के आज्ञार्थक रूप और प्रथम पुरुष एकवचन कर्म-सर्वनाम के रूप में पढ़ना इस वाक्य की आज्ञार्थक संरचना से मेल खाता है।
- source_word: ⲙⲛⲧⲁⲧϣⲓⲡⲉ
  choice: निर्लज्जता
  rationale: यह ϣⲓⲡⲉ का निषेधात्मक भाववाचक रूप है; ‘निर्लज्जता’ शब्द-रचना और लज्जा के साथ जानबूझकर रखे गए विरोध को सुरक्षित रखती है।
- source_word: ϫⲡⲓⲟ
  choice: धिक्कारो
  rationale: आज्ञार्थक क्रिया का अर्थ डाँटना, उलाहना देना या धिक्कारना है; ‘धिक्कारो’ कथन की तीव्रता को संक्षेप में व्यक्त करता है।
- source_word: ⲛⲛⲁⲙⲉⲗⲟⲥ
  choice: मेरे अंगों को
  rationale: ग्रीक-उद्भूत ⲙⲉⲗⲟⲥ का अर्थ अंग/सदस्य है; बहुवचन और प्रथम पुरुष संबंध को प्रत्यक्ष रखा गया है, बिना यह तय किए कि अर्थ शारीरिक है या सामुदायिक।
- source_word: ϩⲛⲧⲏⲩⲧⲛ
  choice: अपने बीच
  rationale: यह बहुवचन संबोधित समुदाय के भीतर/बीच होने का भाव देता है।
- source_word: ⲧⲓ ⲟⲩⲟⲉⲓ ⲉ-
  choice: निकट आओ
  rationale: इस मुहावरे का अर्थ ‘पास आना/निकट जाना’ है; आत्मवाचक लक्ष्य को ‘अपने ही निकट’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘मेरे अंग’ का आशय
  choice: मेरे अंगों
  alternative: मेरे सदस्यों
  rationale: स्रोत शारीरिक अंगों और किसी समूह के सदस्यों के बीच संभावित द्विअर्थता रखता है। मुख्य पाठ में ‘अंग’ अधिक प्रत्यक्ष है, जबकि पादटिप्पणी सामुदायिक अर्थ की संभावना बताती है।
- issue: आत्मवाचक अंतिम आज्ञा
  choice: अपने ही निकट आओ
  alternative: अपने भीतर आओ
  rationale: स्रोत का मुहावरा ‘निकट आने’ का अर्थ देता है, पर दिशा स्वयं संबोधित लोगों की ओर है। अनुवाद इस विचित्र आत्मवाचक तनाव को सहज सिद्धांत में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण आज्ञार्थक बहुवचन अपनाया गया है। ‘लज्जा/निर्लज्जता’ की पुनरावृत्ति और विरोधाभास जानबूझकर सुरक्षित रखे गए हैं। स्रोत के ‘परन्तु’ तथा तीन क्रमिक आदेशों की संरचना बनाए रखी गई है; अस्पष्ट ‘अंग/सदस्य’ और आत्मवाचक अंतिम वाक्य को पादटिप्पणियों में स्पष्ट किया गया है।
