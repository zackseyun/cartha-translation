base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/046.yaml
  text: 'and she who has no image among the barbarians[1].

    I am the one they have hated in many places,

    and I am the one they have loved in many places[b][a][3][2].

    I am the one they call “Death,”

    and I am the one they call “the Law.”'
translation:
  language: hi
  text: 'और वह, जिसकी बर्बरों के बीच कोई प्रतिमा नहीं है।[a]


    मैं वही हूँ जिससे उन्होंने हर जगह घृणा की,

    और मैं वही हूँ जिससे उन्होंने हर जगह प्रेम किया।


    मैं वही हूँ जिसे वे “मृत्यु” कहते हैं,

    और मैं वही हूँ जिसे वे “व्यवस्था” कहते हैं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रतिमा” का अनुवाद “रूप” या “सदृशता” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी मूल के इस शब्द का अनुवाद “कानून,” “विधान,” “रीति” या “मानक” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲉ ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ ⲙⲙⲁⲩ
  choice: वह, जिसकी ... कोई प्रतिमा नहीं है
  rationale: यह पाठ के स्त्रीलिंग संबंधवाचक रूप और ⲉⲓⲛⲉ के ‘प्रतिमा/सदृशता/रूप’ अर्थ को बनाए रखता है; इसे पहले के कथित यूनानी-विषयक प्रश्न में नहीं बदला गया।
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: बर्बरों के बीच
  rationale: यूनानी मूल के सांस्कृतिक पद barbaros की ऐतिहासिक तीक्ष्णता बचाने के लिए ‘विदेशियों’ जैसे नरम पर्याय के बजाय लिप्यंतरित प्रचलित पद रखा गया।
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: मैं वही हूँ
  rationale: स्त्री वक्ता की बार-बार आने वाली आत्मघोषणा और काव्यात्मक लय को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ / ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: उन्होंने ... घृणा की / उन्होंने ... प्रेम किया
  rationale: मूल के पूर्ण क्रियात्मक विरोध और स्त्रीलिंग कर्म-संदर्भ को समानांतर हिन्दी पंक्तियों में बनाए रखता है।
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: हर जगह
  rationale: ⲙⲁ ‘स्थान’ और ⲛⲓⲙ ‘हर/प्रत्येक’ का सीधा वितरणात्मक अर्थ है; ‘बहुत-सी जगहों में’ की अपेक्षा ‘हर जगह’ स्रोत के अधिक निकट है।
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ
  choice: जिसे वे ... कहते हैं
  rationale: नाम देने या पुकारने की सामान्य क्रिया को सरल वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ⲡⲙⲟⲩ
  choice: मृत्यु
  rationale: मूल के निश्चित संज्ञापद को आत्मनाम के रूप में उद्धरण-चिह्नों के भीतर रखा गया है; हिन्दी में अलग से निश्चित उपपद आवश्यक नहीं।
- source_word: ϣⲁⲩⲙⲟⲩⲧⲉ
  choice: वे ... कहते हैं
  rationale: ϣⲁ- को भविष्य नहीं, सामान्य/आदतन क्रिया के रूप में पढ़ा गया है; इसलिए ‘कहेंगे’ के बजाय वर्तमानकाल उचित है।
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: व्यवस्था
  rationale: यूनानी nomos के कानून, प्रचलित नियम और मान्य व्यवस्था के अर्थ-क्षेत्र को यहाँ ‘व्यवस्था’ अपेक्षाकृत खुला रखता है; ‘कानून’ वैकल्पिक पाठ है।
theological_decisions:
- issue: ⲡⲛⲟⲙⲟⲥ को किसी विशिष्ट धार्मिक विधान से जोड़ना
  choice: व्यवस्था
  alternative: कानून / विधान
  rationale: संदर्भ यह निश्चित नहीं करता कि संकेत मूसा की व्यवस्था, नागरिक कानून या व्यापक मानक/प्रथा की ओर है। ‘व्यवस्था’ उस अस्पष्टता को संप्रदायगत निष्कर्ष के बिना बचाती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; छोटी समानांतर पंक्तियों में बार-बार आने वाले “मैं वही हूँ” को सुरक्षित रखा गया है। आरंभिक “और वह” स्रोत के खंड-संबंधी स्वरूप को बनाए रखता है और उसे स्वतंत्र पूर्ण वाक्य बनाने के लिए अनावश्यक सामग्री नहीं जोड़ता।
