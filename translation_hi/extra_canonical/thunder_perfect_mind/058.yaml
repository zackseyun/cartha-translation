  rationale: यह हृदय/मन में किसी को स्थान देकर उस पर सोचने-मनन करने का भाव व्यक्त करने वाला मुहावरा है। “अपना मन लगाया” मूल बिंब का कुछ अंश बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ϩⲏⲧ
  choice: मन
  rationale: कॉप्टिक शब्द विचार, इच्छा और भीतरी चेतना के केंद्र को सूचित कर सकता है। इस प्रसंग में “मन” संज्ञानात्मक भाव को स्पष्ट करता है; “हृदय” अधिक शाब्दिक विकल्प है।
- source_word: ⲧⲱⲡ ⲉⲃⲟⲗ
  choice: ठुकरा दिया
  rationale: इस संयुक्त क्रिया में बाहर निकालने, दूर फेंकने या अस्वीकार करने का सक्रिय भाव है। “ठुकरा दिया” पूर्ववर्ती मनन और बाद की अस्वीकृति के विरोध को सहज हिन्दी में बनाए रखता है।
