  text: '**4.** तुम भी—स्वर्गदूतों[a] और भेजे गए लोगों[b]—


    मैं वह चिह्न[c] हूँ जो मरे हुओं के बीच संकेत देता है[d]; फिर भी मैं वह हूँ जो—[e]'
