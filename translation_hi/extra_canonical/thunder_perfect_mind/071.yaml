    text: ‘आज्ञा’ का अनुवाद ⲟⲩⲁϩⲥⲁϩⲛⲉ से है; इसका अर्थ ‘आदेश’ या ‘फरमान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘देवत्वकरण’ यूनानी आगंतुक शब्द ⲑⲉⲱⲥⲓⲥ (theōsis) का अनुवाद है—अर्थात देवत्व प्राप्त करना या दिया जाना।
    reason: lexical_explanation
  - marker: c
    text: ‘वचन’ ⲗⲟⲅⲟⲥ का अनुवाद है; इसे तकनीकी शब्द के रूप में ‘लोगोस’ भी लिखा जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: इस अंश का उपलब्ध पाठ OCR पर आधारित है और अंतिम पंक्तियों की वाक्य-संरचना अनिश्चित है। कोष्ठक में दिया ‘स्वर’ पिछले पद से पूरा किया गया है; ‘प्रकट हुए’ का अर्थ ‘बाहर भेजे गए’ भी हो सकता है।
    reason: textual_uncertainty
