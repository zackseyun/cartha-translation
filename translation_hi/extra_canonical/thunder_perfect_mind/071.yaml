base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/071.yaml
  text: 'I am the decree of those who ask me[a],

    and the voice of the voices in the place of the gods—

    the voice of the angels that they shout.

    Within the word and among the gods[f][e][d][c][b],

    the gods sent forth by means of the shout.'
translation:
  language: hi
  text: '**8.** मैं उन लोगों की आज्ञा[a] हूँ जो मुझसे माँगते हैं,


    और स्वरों का स्वर हूँ, उस स्थान में जहाँ स्वर्गदूतों का देवत्वकरण[b] होता है—वे जिन्हें वचन[c] में भेजा गया—


    और देवताओं के देवताओं का [स्वर], जो परामर्श के द्वारा प्रकट हुए।[d]'
  philosophy: optimal-equivalence
