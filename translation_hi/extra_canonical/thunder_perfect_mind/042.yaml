base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/042.yaml
  text: For why do you hate me[a], O Greeks? Because I am a barbarian? And I am the knowledge of the Greek and the barbarian[d][c][b]. I am the judgment.
translation:
  language: hi
  text: '**7.** हे यूनानियो, तुम मुझसे घृणा क्यों करते हो?[a] क्या इसलिए कि मैं बर्बर हूँ?[b] मैं यूनानी और बर्बर—दोनों का ज्ञान हूँ। मैं न्याय हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध OCR अत्यन्त विकृत है। पांडुलिपि-पाठ के पुनर्निर्माण में यहाँ “हे यूनानियो” और आगे “बर्बर,” “ज्ञान,” तथा “न्याय” पढ़े जाते हैं; इसलिए पुराने OCR-आधारित “बीमार,” “चिकित्सक,” या “बंदरगाह” वाले अर्थ स्वीकार नहीं किए गए हैं।
    reason: source_reconstruction
  - marker: b
    text: “बर्बर” यहाँ प्राचीन यूनानी सांस्कृतिक श्रेणी है—मुख्यतः गैर-यूनानी या यूनानी न बोलने वाला व्यक्ति। इसका अर्थ अनिवार्य रूप से नैतिक रूप से “असभ्य” नहीं है।
    reason: historical_lexical_context
lexical_decisions:
- source_word: 'ⲛⲉⲓⲉⲗⲗⲏⲛ (OCR में विकृत: ⲡⲉⲓⲛⲗⲏⲛ)'
  choice: हे यूनानियो
  rationale: संबोधन बहुवचन है; आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण संबोधन के लिए “हे यूनानियो” रखा गया है।
- source_word: ⲃⲁⲣⲃⲁⲣⲟⲥ (OCR में विकृत अंश)
  choice: बर्बर
  rationale: यह यूनानी मूल का सांस्कृतिक पद है, जिसका आशय यूनानी न बोलने वाले अथवा गैर-यूनानी व्यक्ति से हो सकता है। मूल की तीखी विरोधात्मक भाषा बनाए रखने के लिए इसे “बर्बर” रखा गया है, न कि “असभ्य” बनाकर अर्थ सीमित किया गया है।
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: ज्ञान
  rationale: कॉप्टिक पद का सीधा अर्थ “ज्ञान” है। वक्ता स्वयं को यूनानी और बर्बर दोनों के ज्ञान के रूप में प्रस्तुत करती है; इस जानबूझकर रहस्यमय कथन को सरल करके “जानने वाली” नहीं किया गया।
- source_word: 'ⲡϩⲁⲡ (OCR: ⲫⲁⲡ)'
  choice: न्याय
  rationale: यह पद न्याय, निर्णय या न्यायादेश का अर्थ दे सकता है। “मैं न्याय हूँ” मूल की संक्षिप्त, व्यक्तिवाची घोषणा और उसकी अर्थगत व्यापकता को बनाए रखता है।
theological_decisions:
- issue: वक्ता का “ज्ञान” और “न्याय” के साथ आत्मपरिचय
  choice: 'रूपक को यथावत रखा गया: “मैं ... ज्ञान हूँ। मैं न्याय हूँ।”'
  alternative: “मुझे ... का ज्ञान है” अथवा “मैं न्याय करती हूँ”
  rationale: मूल में वक्ता किसी गुण या क्रिया का दावा मात्र नहीं करती, बल्कि स्वयं को इन अमूर्त वास्तविकताओं के रूप में घोषित करती है। इसे व्याख्यात्मक क्रिया में बदलना पाठ की दार्शनिक और धर्मवैचारिक तीव्रता घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। स्त्री वक्ता का लिंग “मैं बर्बर हूँ” में हिन्दी व्याकरण से प्रत्यक्ष नहीं दिखता, पर पाठ में कोई पुरुषवाची रूप नहीं जोड़ा गया। “यूनानी और बर्बर—दोनों” से मूल के द्वंद्व को सहज हिन्दी में स्पष्ट किया गया है, बिना उसे किसी विशेष धर्मसिद्धान्त में बाँधे।
