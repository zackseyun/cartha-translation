base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/022.yaml
  text: 'Those who speak the truth about me[a], lie about me,

    and those who have lied about me, speak the truth about me.

    Those who know me, be ignorant of me,

    and those who have not known me[b], let them know me.'
translation:
  language: hi
  text: '**17.** जो मेरे विषय में सच बोलते हैं, वे मेरे विषय में झूठ बोलते हैं,


    और जिन्होंने मेरे विषय में झूठ बोला है, वे मेरे विषय में सच बोलें।


    जो मुझे जानते हैं, वे मेरे विषय में अज्ञानी हों[a],


    और जिन्होंने मुझे नहीं जाना है, वे मुझे जानें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल में यह आज्ञार्थक है: ‘जो मुझे जानते हैं, वे मेरे विषय में अज्ञानी हों’; इसे भविष्यसूचक कथन (‘वे अज्ञानी होंगे’) नहीं समझना चाहिए।'
    reason: grammatical_clarification
lexical_decisions:
- source_word: ⲙⲉ
  choice: सच
  rationale: यहाँ ⲙⲉ ‘सत्य/सच’ को सूचित करता है और अगले ϫⲓϭⲟⲗ के साथ जानबूझकर विरोध रचता है। साधारण पाठकों के लिए ‘सच बोलना’ स्वाभाविक और स्पष्ट है।
- source_word: ϫⲓϭⲟⲗ
  choice: झूठ बोलना
  rationale: इस प्रसंग में यह पद ⲙⲉ (‘सच’) के प्रतिलोम के रूप में आता है; अतः ‘झूठ बोलना’ उपयुक्त है। इसे ‘उच्चारण’ या ‘घोषणा’ मानना इस अंश के स्पष्ट सत्य–झूठ विरोध को मिटा देगा।
- source_word: ⲥⲟⲟⲩⲛ
  choice: जानना
  rationale: क्रिया का मूल अर्थ ‘जानना/पहचानना’ है। ‘जानना’ पूरे विरोध—जानना, अनजान होना, न जानना, जानना—को सरल और सुसंगत रखता है।
theological_decisions:
- issue: वक्ता के विषय में सच और झूठ तथा ज्ञान और अज्ञान का विरोधाभास
  choice: विरोधाभासी आज्ञाओं को ज्यों का त्यों रखा गया है
  alternative: इन्हें व्याख्यात्मक ढंग से रूपक, विडंबना या आध्यात्मिक ज्ञान के किसी निश्चित सिद्धांत के रूप में स्पष्ट करना
  rationale: मूल रचना जानबूझकर तनावपूर्ण और विरोधाभासी भाषा का प्रयोग करती है। अनुवाद में उसका कोई एक धर्मवैचारिक समाधान थोपना उचित नहीं।
- issue: ‘जानने वाले’ वाक्य का क्रियारूप
  choice: आज्ञार्थक/कामनार्थक बहुवचन—‘वे मुझसे अनजान हो जाएँ’
  alternative: भविष्यसूचक कथन—‘वे मुझसे अनजान होंगे’
  rationale: प्रसंग और उपलब्ध पाठ-साक्ष्य इसे आज्ञार्थक क्रम के रूप में समर्थन देते हैं; भविष्यकाल करने से वक्ता की चुनौतीपूर्ण पुकार बदल जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘मेरे विषय में’ सत्य और झूठ बोलने के संबंध को स्पष्ट करता है, जबकि ‘मुझसे अनजान’ हिन्दी में अधिक स्वाभाविक है। समांतर पंक्तियों और मूल के तीखे विरोधाभास को सुरक्षित रखा गया है।
