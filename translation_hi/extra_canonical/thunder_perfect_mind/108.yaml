translation:
  language: hi
  text: '**6.** नाम की वाणी और वाणी का नाम। मैं अक्षर का चिह्न[a] और विभाजन का प्रकटीकरण हूँ। और मैं […] [b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: OCR में इस स्थान का पाठ अस्पष्ट है; समीक्षित पाठ-परंपरा इसे ‘अक्षर/लेखन का चिह्न’ समझती है, जबकि उपलब्ध OCR-रूप को शाब्दिक रूप से ‘इसका चिह्न’ भी पढ़ा जा सकता है।
    reason: textual_uncertainty
  - marker: b
    text: इसके बाद का पाठ पृष्ठ-सीमा पर खंडित और OCR में अनिश्चित है। कुछ अक्षर सुनने से संबंधित आदेश की ओर संकेत कर सकते हैं, पर उन्हें इस वाक्य में निश्चित रूप से जोड़ना संभव नहीं है।
    reason: alignment_note
lexical_decisions:
- source_word: ⲡⲣⲁⲛ
  choice: नाम
  rationale: साहिदिक कॉप्टिक में इसका सामान्य अर्थ ‘नाम’ है; दोनों पदों में उलटे क्रम की काव्यात्मक समानांतरता बनाए रखी गई है।
- source_word: ⲧⲥⲙⲏ
  choice: वाणी
  rationale: यहाँ ⲥⲙⲏ का अर्थ ‘आवाज़/वाणी’ है। ‘वाणी’ गरिमापूर्ण है और नाम तथा ध्वनि के अमूर्त संबंध को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ
  choice: चिह्न
  rationale: यूनानी मूल के इस शब्द का अर्थ ‘चिह्न/संकेत’ है; ‘चिह्न’ अक्षर के दृश्य संकेत और व्यापक प्रतीकात्मक अर्थ दोनों को खुला रखता है।
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: प्रकटीकरण
  rationale: यह पद किसी वस्तु के प्रकट या उजागर होने को दर्शाता है। संज्ञात्मक समानांतर रचना बनाए रखने के लिए ‘प्रकटीकरण’ चुना गया है।
- source_word: ⲧⲁϩⲉⲣⲉⲥⲓⲥ
  choice: विभाजन
  rationale: यूनानी αἵρεσις से आया रूप ‘चयन, दल, मतभेद, विभाजन’ का बोध करा सकता है। संदर्भ और परंपरागत पाठ के अनुसार ‘विभाजन’ उपयुक्त है, पर इसकी अर्थ-सीमा को सिद्धान्तगत रूप से संकुचित नहीं किया गया।
- source_word: ⲁⲛⲟⲕ
  choice: मैं
  rationale: प्रथम पुरुष की बार-बार आती उद्घोषणात्मक शैली को सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘विभाजन’ को किसी विशिष्ट धार्मिक पंथ या विधर्म के रूप में समझना
  choice: तटस्थ ‘विभाजन’
  alternative: ‘पंथ’, ‘विधर्म’ या ‘मत’
  rationale: ग्रीक-आधारित शब्द में अनेक अर्थ संभव हैं। किसी संप्रदायगत या निंदात्मक अर्थ को आरोपित किए बिना मूल की अस्पष्टता बनाए रखी गई है।
- issue: वक्ता की पहचान
  choice: प्रथम पुरुष के दावों को बिना व्याख्यात्मक उपाधि के प्रस्तुत करना
  alternative: वक्ता को किसी निश्चित देवी, ज्ञान-तत्त्व या धार्मिक व्यक्तित्व के रूप में नामित करना
  rationale: इस अंश में वक्ता स्वयं अपनी पहचान स्पष्ट नहीं करती; अनुवाद उस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और उद्घोषणात्मक शैली रखी गई है। ‘वाणी’ तथा ‘प्रकटीकरण’ गरिमापूर्ण हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं। स्रोत की उलटी समानांतर रचना—‘नाम की वाणी / वाणी का नाम’—जानबूझकर अक्षुण्ण रखी गई है; खंडित अंत को अनुमान से पूरा नहीं किया गया।
