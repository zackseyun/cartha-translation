base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/102.yaml
  text: 'Take hold of yourselves[a];

    for your inside is your outside[c][b],

    and the one who fashions your outside

    is the one who shaped it.'
translation:
  language: hi
  text: '**18.** अपने आप को थाम लो;


    क्योंकि तुम्हारा भीतर ही तुम्हारा बाहर है,


    और जो तुम्हारे बाहरी भाग को गढ़ता है,


    उसी ने उसे एक प्रतिरूप बनाया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक प्रतिरूप बनाया है’ ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ (यूनानी τύπος) का अनुवाद है। τύπος का अर्थ ‘नमूना’, ‘छाप’ या ‘मुहर की छाप’ भी हो सकता है। कॉप्टिक पुल्लिंग सर्वनाम का सटीक पूर्वपद स्पष्ट नहीं है; इसलिए ‘उसे’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲱⲧⲛ
  choice: अपने आप को थाम लो
  rationale: ⲁⲙⲁϩⲧⲉ को बहुवचन आज्ञार्थक ‘पकड़ो/थाम लो’ और ⲙⲙⲱⲧⲛ को आत्मवाचक कर्म के रूप में पढ़ता है; यह ‘मैं प्रकट हुई’ वाली पुरानी गलत व्याख्या से बचता है।
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ
  choice: तुम्हारा भीतर
  rationale: ⲥⲁϩⲟⲩⲛ का अर्थ ‘भीतर/अंदर’ है। संज्ञात्मक ‘भीतर’ अगले ‘बाहर’ के साथ सूत्रात्मक विरोधाभास बनाए रखता है।
- source_word: ⲡⲉⲧⲛⲥⲁⲃⲟⲗ
  choice: तुम्हारा बाहर
  rationale: ⲥⲁⲃⲟⲗ का अर्थ ‘बाहर/बाहरी भाग’ है; इसे ‘धीरज’ मानने के लिए पाठ में पर्याप्त आधार नहीं है।
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: गढ़ता है
  rationale: यूनानी πλάσσω से आए इस क्रियापद में कारीगर द्वारा बनाने, ढालने या गढ़ने का बिंब है; ‘गढ़ता’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसे सुरक्षित रखता है।
- source_word: ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ
  choice: उसे आकार दिया है
  rationale: τύπος के चिह्न, छाप, नमूने और आकार के अर्थ-क्षेत्र को सहज हिन्दी में व्यक्त किया गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘भीतर’ और ‘बाहर’ की पहचान
  choice: तुम्हारा भीतर ही तुम्हारा बाहर है
  alternative: तुम्हारा भीतरी भाग तुम्हारा बाहरी भाग है
  rationale: पाठ के जानबूझकर रखे गए विरोधाभास को बिना आध्यात्मिक, मनोवैज्ञानिक या सृष्टितात्त्विक व्याख्या जोड़े यथावत रखा गया है।
- issue: अंतिम पुरुषवाचक सर्वनाम का संदर्भ
  choice: उसे
  alternative: उसको / उसे नमूना बनाया
  rationale: कॉप्टिक ⲙⲙⲟϥ पुल्लिंग एकवचन है, पर निकट संदर्भ में उसका सटीक पूर्वपद अस्पष्ट है। हिन्दी ‘उसे’ इस अस्पष्टता को अनावश्यक रूप से व्यक्ति या वस्तु तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘भीतर—बाहर’ का सूत्रात्मक विरोध और गढ़ने/आकार देने का कारीगरी-बिंब सुरक्षित है। OCR में दिखाई देने वाली पुनरावृत्ति ⲡⲉⲧⲛⲡⲉⲧⲛ को अर्थपूर्ण दोहराव न मानकर प्रतिलिपिक/OCR द्विलिपि समझा गया है।
