translation:
  language: hi
  text: '**4.** और वे मुझे उस स्थान में पाएँगे जो वहाँ है; वे जीवित रहेंगे और नष्ट नहीं होंगे। इसलिए, मेरी बात सुनने में देर मत करो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: वे मुझे पाएँगे
  rationale: ⲥⲉⲛⲁ- भविष्यकाल का बहुवचन सूचक है; ϭⲓⲛⲉ का यहाँ सामान्य अर्थ ‘पाना/खोजना’ और ⲙⲙⲟⲉⲓ का अर्थ ‘मुझे’ है। इससे उस पुराने पाठ-विभाजन से बचा गया है जिसमें इसे आज्ञापालन संबंधी संबोधन माना गया था।
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: वहाँ के स्थान में
  rationale: यह अभिव्यक्ति स्थान और उसके संकेतवाचक बल—‘जो वहाँ है’—दोनों को रखती है; हिन्दी में ‘वहाँ के स्थान में’ औपचारिक किंतु समझने योग्य है।
- source_word: ⲱⲛϩ
  choice: जीवित रहेंगे
  rationale: मूल क्रिया ‘जीना/जीवित होना’ को भविष्यकालीन प्रसंग में स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: ⲛⲥⲉⲧⲙⲥⲱⲧ ⲉⲃⲟⲗ
  choice: नष्ट नहीं होंगे
  rationale: उपलब्ध पाठ खंडित/संदिग्ध है। ‘नष्ट नहीं होंगे’ जीवन के साथ अर्थगत समानांतरता रखता है, पर अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: मेरी अवज्ञा मत करो
  rationale: नकारात्मक आज्ञार्थक ⲙⲡⲣ और ‘न सुनने/न मानने’ की संयुक्त अभिव्यक्ति को हिन्दी में संक्षिप्त और स्वाभाविक ‘अवज्ञा मत करो’ से व्यक्त किया गया है।
theological_decisions:
- issue: जीवन के बाद आने वाली नकारात्मक क्रिया का अर्थ
  choice: नष्ट नहीं होंगे
  alternative: बाहर नहीं जाएँगे / निकाल नहीं दिए जाएँगे / बचाकर बाहर नहीं लाए जाएँगे
  rationale: OCR में क्रिया का रूप अपूर्ण और पाठगत रूप से अनिश्चित है। मुख्य पाठ में प्रसंगानुकूल अर्थ रखा गया है, पर अन्य संभावनाओं को निर्णायक रूप से अस्वीकार नहीं किया गया।
