translation:
  language: hi
  text: '**17.** और जब तुम अपने आपको छिपाते हो[a][b][c],


    मैं ही वह हूँ जो दिखाई देगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ⲥⲙⲓⲛⲉ का अर्थ ‘छोटा होना’ या ‘घट जाना’ भी हो सकता है। उस स्थिति में पाठ होगा: “और जब तुम छोटे हो जाते हो, मैं ही वह हूँ जो दिखाई देगी।”'
    reason: lexical_alternative
  - marker: b
    text: दिए गए अंश में “सृष्टि के आरंभ में” और “एक छोटे बच्चे का दिखाई देने वाला रूप” जैसे पद भी हैं, जो संभवतः आस-पास की पंक्तियों के हैं। खंड-विभाजन के अनुसार यहाँ केवल छिपने और दिखाई देने वाला वाक्य प्रस्तुत किया गया है।
    reason: alignment_note
  - marker: c
    text: 'यदि अंत का ⲙⲡⲣⲙⲉⲥⲧⲱⲥ इसी काव्य-पंक्ति से संबंधित माना जाए, तो एक संभावित पाठ है: “और अपने आपको मत छिपाओ; मैं ही वह हूँ जो दिखाई देगी।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲥⲙⲓⲛⲉ
  choice: अपने आपको छिपाते हो
  rationale: निर्धारित खंड में छिपने और दिखाई देने का विरोधाभास मुख्य काव्यात्मक संबंध है। फिर भी कॉप्टिक शब्द का अर्थ ‘छोटा होना/घट जाना’ भी लिया जा सकता है; इसलिए इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ⲙⲓⲉ
  choice: दिखाई देगी
  rationale: यह दृश्य अथवा प्रकट होने का भाव देता है। ‘दिखाई देगी’ परिणामसूचक और ग्रहणकर्ता-केंद्रित अर्थ को बनाए रखता है तथा ‘छिपाते हो’ के साथ स्वाभाविक विरोध रचता है।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: साधारण संयोजक को बनाए रखते हुए काव्य की क्रमिक लय सुरक्षित रखी गई है; स्रोत से अधिक प्रबल विरोधसूचक अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: वक्ता के लिए हिन्दी में लिंग-चिह्नित क्रिया
  choice: दिखाई देगी
  alternative: दिखाई दूँगा/दूँगी अथवा दिखाई दूँ
  rationale: पूरे ग्रंथ में बोलने वाली वाणी स्त्री-रूप में प्रस्तुत है; इसलिए आधुनिक हिन्दी में स्त्रीलिंग रखा गया है। इसे किसी विशिष्ट धर्मवैज्ञानिक पहचान का निर्णय नहीं माना गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मैं ही वह हूँ’ मूल की आत्म-परिचयात्मक और बलाघातपूर्ण शैली को बचाता है। OCR और खंड-संरेखण मध्यम विश्वसनीयता के हैं, इसलिए मुख्य पाठ को अनावश्यक रूप से विस्तृत किए बिना सभी महत्वपूर्ण वैकल्पिक पाठ पादटिप्पणियों में दिए गए हैं।
