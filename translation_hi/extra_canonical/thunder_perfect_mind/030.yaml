translation:
  language: hi
  text: '**8.** मुझे बाहर फेंका हुआ न छोड़ो,[a] और तुम मुझे धन-संपदा में पाओगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध OCR इस स्थान पर विकृत है; समीक्षित कॉप्टिक पाठ का अर्थ है, “मुझे बाहर फेंका हुआ न छोड़ो।” इसके बाद दिखने वाले “और न देखो…” शब्द संभवतः अगले वाक्य के आरंभ हैं।
    reason: textual_and_alignment_note
lexical_decisions:
- source_word: ⲙⲡⲣ…ⲕⲁⲁⲧ
  choice: मुझे … न छोड़ो
  rationale: निषेधात्मक रूप के साथ ⲕⲁ (‘छोड़ना/रहने देना’) का अर्थ स्वाभाविक और सीधा रखा गया है। OCR में आरंभिक अक्षर विकृत हैं, पर समीक्षित पाठ में यह वाक्य-विन्यास स्पष्ट है।
- source_word: ⲉⲓⲛⲏϫ ⲉⲃⲟⲗ
  choice: त्यागा हुआ
  rationale: शाब्दिक भाव ‘बाहर फेंका/निकाला हुआ’ है। ‘त्यागा हुआ’ हिंदी में बहिष्कार और परित्याग—दोनों का बल बनाए रखता है, बिना किसी विशेष सामाजिक या धार्मिक प्रक्रिया को आरोपित किए।
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: तुम मुझे … पाओगे
  rationale: द्वितीय पुरुष बहुवचन भविष्यकाल तथा ‘मुझे पाना’ का सीधा प्रतिनिधित्व।
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: धन-संपदा के बीच
  rationale: यह अमीरी/समृद्धि की अवस्था या क्षेत्र को व्यक्त करता है। ‘के बीच’ स्रोत के ϩⲛ की स्थानगत व्यापकता बनाए रखता है; केवल ‘धनवान होकर’ कहना अनावश्यक व्याख्या होता।
theological_decisions:
- issue: वक्ता का ‘त्यागा हुआ’ होना और धन-संपदा में पाया जाना
  choice: विरोधाभासी कथन को ज्यों का त्यों बनाए रखा गया
  alternative: इसे आध्यात्मिक दरिद्रता या भौतिक समृद्धि की किसी निश्चित शिक्षा के रूप में स्पष्ट करना
  rationale: स्रोत जानबूझकर तनावपूर्ण और विरोधाभासी भाषा बरतता है; पाठ स्वयं यह तय नहीं करता कि ‘धन-संपदा’ भौतिक है, रूपकात्मक है या आध्यात्मिक।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘त्यागा हुआ’ ने शाब्दिक ‘बाहर फेंका हुआ’ की कठोर छवि को पूरी तरह मिटाए बिना स्वाभाविक हिंदी दी है। बहुवचन ‘तुम’ को स्रोत के द्वितीय पुरुष बहुवचन के अनुरूप रखा गया है।
