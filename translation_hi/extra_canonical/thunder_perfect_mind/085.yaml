base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/085.yaml
  text: 'Vision and self-control

    of the heart[a], existing within me—

    I am the hearing that is attainable to everyone[d][c][b],

    and the speech that cannot be grasped.'
translation:
  language: hi
  text: 'हृदय की दृष्टि और आत्म-संयम[a],


    जो मेरे भीतर विद्यमान हैं—


    मैं वह सुनना हूँ जो हर किसी को सुलभ है[b],


    और वह वाणी जो पकड़ में नहीं आती[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवाद आरंभ को “हृदय का दीपक” मानते हैं, पर उपलब्ध पाठ में यूनानी से आए शब्द ϩⲟⲣⲁⲥⲓⲥ (“दृष्टि”) और ⲧⲉⲅⲕⲣⲁⲧⲓⲁ (“आत्म-संयम”) पढ़े जाते हैं।
    reason: lexical_alternative
  - marker: b
    text: “सुलभ” के लिए प्रयुक्त पद का अर्थ “उपलब्ध” या “जिस तक पहुँचा जा सके” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “पकड़ में नहीं आती” का अर्थ “समझ में नहीं आती” भी हो सकता है; इसमें पकड़ने और समझने, दोनों की संभावना बनी रहती है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ϩⲟⲣⲁⲥⲓⲥ
  choice: दृष्टि
  rationale: यूनानी आगत शब्द का मूल अर्थ ‘दृष्टि/देखना’ है; ‘दृष्टि’ आंतरिक अनुभूति की अमूर्त छाया बनाए रखता है।
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ
  choice: आत्म-संयम
  rationale: ἐγκράτεια का स्पष्ट, प्रचलित आधुनिक हिन्दी समतुल्य; अनावश्यक रूप से केवल मद्य-संयम का अर्थ नहीं देता।
- source_word: ⲙⲫⲏⲧ
  choice: हृदय की
  rationale: m- को यहाँ संबंधकारक मानकर दोनों आरंभिक संज्ञाओं को हृदय से जोड़ा गया है।
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ ⲁⲛⲟⲕ
  choice: जो मेरे भीतर विद्यमान हैं
  rationale: स्त्रीलिंग संबंधवाचक रूप आरंभ की स्त्रीलिंग संज्ञाओं से जुड़ता है, ‘हृदय’ से नहीं; हिन्दी में दोनों के लिए बहुवचन क्रिया स्वाभाविक है।
- source_word: ⲡⲥⲱⲧⲙ
  choice: वह सुनना
  rationale: संज्ञात्मक और ठोस श्रवण-अर्थ सुरक्षित रहता है तथा आगे की ‘वाणी’ के साथ काव्यात्मक विरोध बनता है।
- source_word: ⲉⲧϣⲏⲡ
  choice: जो ... सुलभ है
  rationale: उपलब्धता और पहुँच की संभावना व्यक्त करता है, मानवीय उपलब्धि का अनावश्यक भाव नहीं जोड़ता।
- source_word: ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: हर किसी को
  rationale: सार्वभौमिक दायरा सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ⲡϣⲁϫⲉ
  choice: वाणी
  rationale: ‘सुनना’ के साथ स्वाभाविक युग्म बनाता है और इसे केवल एक शब्द तक सीमित नहीं करता।
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: जिसे ग्रहण नहीं किया जा सकता
  rationale: ‘ग्रहण’ पकड़ने और समझने—दोनों अर्थों की संभावित द्व्यर्थता को हिन्दी में कुछ हद तक बनाए रखता है।
theological_decisions:
- issue: वक्ता की रहस्यमय आत्म-पहचान
  choice: ‘मैं वह सुनना हूँ ... और वह वाणी’ की विरोधाभासी पहचान अक्षुण्ण रखी गई।
  alternative: इसे व्याख्यात्मक रूप से ‘मैं सुनने की शक्ति देती हूँ’ या ‘मेरी वाणी’ कहना।
  rationale: स्रोत वक्ता को सीधे ‘सुनना’ और ‘वाणी’ के रूप में प्रस्तुत करता है; व्याख्यात्मक विस्तार काव्यगत और धर्मवैचारिक तनाव मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। आरंभिक संबंधवाचक खंड को स्त्रीलिंग स्रोत-संज्ञाओं से जोड़ने के लिए हिन्दी में बहुवचन ‘जो ... विद्यमान हैं’ रखा गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
