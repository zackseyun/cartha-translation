base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/090.yaml
  text: 'Give heed to me in gentleness.[a]

    I am the one who remains upon the face of the earth,[b]

    and I am the one who is cast off the face of the earth.[c]

    I am the preparation of every person.[d][e][f][g]'
translation:
  language: hi
  text: '**6.** तुम नम्रता से मेरी शिक्षा ग्रहण करो।[a]


    मैं वह हूँ जो पृथ्वी के मुख पर बनी रहती हूँ,[b]


    और मैं वह हूँ जिसे पृथ्वी के मुख से फेंक दिया जाता है।[c]


    मैं हर मनुष्य की तैयारी हूँ।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नम्रता’ के स्थान पर ‘दीनता’ भी संभव है; मूल वाक्यांश का अधिक शाब्दिक अर्थ है, ‘नम्रता में मेरी शिक्षा ग्रहण करो।’
    reason: lexical_alternative
  - marker: b
    text: दिए गए OCR में यह पद विकृत है; समीक्षित पांडुलिपि-पाठ का आशय ‘वह जो बनी रहती है’ या ‘वह जो टिकी रहती है’ है।
    reason: textual_variant
  - marker: c
    text: 'या: ‘जिसे पृथ्वी के मुख से बाहर डाल दिया जाता है।’ मूल क्रिया का अर्थ ‘फेंकना’ या ‘बाहर डालना’ है।'
    reason: lexical_alternative
  - marker: d
    text: मूल शब्द का अर्थ ‘तैयारी’ है। यह वाक्य स्पष्ट नहीं करता कि तैयारी किस अर्थ में या किस उद्देश्य के लिए है।
    reason: ambiguity
