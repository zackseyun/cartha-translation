base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/015.yaml
  text: My father[a], and the sister of my husband—and he is my offspring. I am the servant of my husband[e][d][c][b], and I am the Lady.
translation:
  language: hi
  text: '**10.** मैं अपने पिता और अपने पति की बहन हूँ;

    और वही मेरी संतान है।

    मैं अपने पति की दासी[a] हूँ,

    और मैं ही स्वामिनी हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दासी’ का अर्थ ‘सेविका’ भी हो सकता है और अधिक कठोर अर्थ में ‘गुलाम स्त्री’ भी। यहाँ मूल शब्द दोनों अर्थों की गुंजाइश रखता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: अपने पिता
  rationale: ⲡⲁⲉⲓⲱⲧ का सीधा अर्थ ‘मेरा पिता’ है। हिन्दी वाक्य में ‘मैं ... हूँ’ के साथ ‘अपने पिता’ स्वाभाविक और स्पष्ट है।
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁϩⲁⲓ
  choice: अपने पति की बहन
  rationale: ⲥⲱⲛⲉ का अर्थ ‘बहन’ और ϩⲁⲓ का अर्थ ‘पति’ है; संबंधसूचक रचना को सरल हिन्दी में रखा गया है।
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: और वही मेरी संतान है
  rationale: ⲛⲧⲟϥ पुरुषवाचक बलयुक्त सर्वनाम है, इसलिए ‘वही’; ⲡⲁϫⲡⲟ का अर्थ ‘मेरी संतान/मेरी उत्पत्ति’ है, न कि ‘मुझे जन्म देनेवाला’।
- source_word: ⲧϩⲙϩⲁⲗ
  choice: दासी
  rationale: ϩⲙϩⲁⲗ सेवक अथवा दास को सूचित करता है और स्त्रीलिंग उपपद के कारण ‘दासी’ उपयुक्त है; यह आगे की ‘स्वामिनी’ के साथ जानबूझकर रखा गया विरोध भी बचाता है।
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: स्वामिनी
  rationale: यह ‘स्वामी/प्रभु’ का स्त्रीलिंग रूप है। ‘स्वामिनी’ आधुनिक हिन्दी में अधिकार और पद दोनों व्यक्त करता है तथा ‘दासी’ के प्रतिलोम को बनाए रखता है।
theological_decisions:
- issue: वक्ता के परस्पर-विरोधी पारिवारिक और सामाजिक संबंध
  choice: 'विरोधों को ज्यों का त्यों रखा गया: पिता, पति की बहन, पति की संतान, दासी और स्वामिनी'
  alternative: इन संबंधों को रूपक मानकर व्याख्यात्मक ढंग से सरल करना
  rationale: मूल कविता का आशय इन्हीं तनावपूर्ण आत्म-घोषणाओं में निहित है; अनुवाद में उनका धर्मवैचारिक अर्थ तय करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। बार-बार आनेवाले ‘मैं ... हूँ’ के घोषणात्मक स्वर तथा ‘दासी/स्वामिनी’ के प्रत्यक्ष विरोध को सुरक्षित रखा गया है। आरंभिक ‘मैं ... हूँ’ आपूर्ति के रूप में आवश्यक है, क्योंकि उपलब्ध अंश वाक्य के बीच से आरंभ होता प्रतीत होता है और पूरे भाषण की आवर्ती संरचना यही है।
