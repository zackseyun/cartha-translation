  yaml_path: translation/extra_canonical/thunder_perfect_mind/011.yaml
  text: 'I am the members of my mother[b][a].

    And I am the barren one—her children are many.'
translation:
  language: hi
  text: '**6.** मैं अपनी माँ के अंग हूँ।[a][b]


    और मैं बाँझ हूँ—फिर भी उसके बच्चे बहुत हैं।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अंग’ का अर्थ यहाँ शरीर के अवयव भी हो सकता है; ‘मेरी माँ के शरीर के अंग’ अधिक स्पष्ट, पर अधिक व्याख्यात्मक अनुवाद होगा।
    reason: lexical_alternative
  - marker: b
    text: ‘अपनी माँ के’ से संबंधित उपलब्ध OCR-पाठ और इस खंड का पंक्ति-संरेखण अनिश्चित है; किसी बेहतर आलोचनात्मक प्रतिलेख से इसकी जाँच आवश्यक है।
    reason: alignment_note
  - marker: c
    text: उपलब्ध कॉप्टिक OCR में ‘उसके बच्चे बहुत हैं’ स्पष्ट है, पर इसी अंश में ‘मैं बाँझ हूँ’ का शब्दाधार अस्पष्ट या छूटा हुआ जान पड़ता है। यह वाक्य संलग्न परामर्श-पाठ और व्यापक पाठ-संदर्भ के आधार पर रखा गया है।
    reason: source_text_uncertainty
lexical_decisions:
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: अंग
  rationale: यह शब्द सामूहिक रूप से शरीर के अंगों का बोध कराता है। ‘अंग’ आधुनिक हिन्दी में स्वाभाविक है और शारीरिक बिंब को बनाए रखता है।
- source_word: ⲛⲁϣⲉ
  choice: बहुत हैं
  rationale: दिए गए कॉप्टिक क्रम में यह बहुलता सूचित करता है और ⲛⲉⲥϣⲏⲣⲉ (‘उसके बच्चे’) के साथ मिलकर ‘उसके बच्चे बहुत हैं’ बनता है; इसे ‘बाँझ’ नहीं माना गया। ‘बाँझ’ की पहचान संलग्न परामर्श-पाठ और व्यापक पंक्ति-संदर्भ पर निर्भर है, क्योंकि OCR अंश में उसका स्पष्ट आधार संदिग्ध है।
- source_word: ⲛⲉⲥϣⲏⲣⲉ
  choice: उसके बच्चे
  rationale: स्त्रीलिंग एकवचन स्वामी के साथ बहुवचन संतान का अर्थ है। ‘बच्चे’ समावेशी और सहज है; ‘पुत्र’ अनावश्यक रूप से संकीर्ण होता।
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: मैं ... हूँ
  rationale: कविता की बार-बार दोहराई गई प्रथम-पुरुष आत्म-घोषणा और उसकी लय को सुरक्षित रखता है।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: मूल के सरल समन्वयी संबंध को बनाए रखता है; ‘फिर भी’ केवल अगले उपवाक्य में बाँझपन और अनेक बच्चों के विरोधाभास को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: (genitival phrase for “of my mother”)
  choice: अपनी माँ के
  rationale: प्रथम-पुरुष कर्ता के साथ हिन्दी का निजवाचक ‘अपनी’ स्वाभाविक रूप से संबंध व्यक्त करता है; OCR-पाठ की अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: बाँझ स्त्री के अनेक बच्चों का विरोधाभास
  choice: 'विरोधाभास को बिना समझाए यथावत रखा गया: ‘मैं बाँझ हूँ—फिर भी उसके बच्चे बहुत हैं।’'
  alternative: ‘मैं निःसंतान हूँ, पर मेरे बहुत बच्चे हैं’ या इसे रूपक मानकर व्याख्यात्मक अनुवाद करना
  rationale: वक्ता की ‘मैं’ से अचानक ‘उसके’ की ओर जाने वाली व्याकरणिक दूरी और मूल काव्य का तनाव अर्थपूर्ण हैं; उन्हें किसी धर्मवैज्ञानिक व्याख्या से समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बाँझ’ सीधा और प्रचलित शब्द है; ‘निःसंतान’ विरोधाभास को नरम कर देता। डैश और ‘फिर भी’ कथन के तीखे विरोध को सुनने योग्य बनाते हैं, जबकि ‘उसके’ को ‘मेरे’ में बदलकर व्याकरणिक तनाव दूर नहीं किया गया।
