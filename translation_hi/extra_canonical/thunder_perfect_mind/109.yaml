translation:
  language: hi
  text: '**7.** और जिसे तुम अपने बाहर देखते हो, उसे ही अपने भीतर देखते हो; वही है जो दिखाई देता है, और वही तुम्हारा वस्त्र है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए पांडुलिपि-OCR अंश का इस पंक्ति से मिलान अनिश्चित है; उपलब्ध संरेखण का विश्वास-स्तर कम है। अनुवाद इस खंड से संबद्ध संपादकीय पाठ और पहचाने गए कॉप्टिक पदों पर आधारित है।
    reason: प्रस्तुत OCR अंश में अपेक्षित प्रमुख पद स्पष्ट रूप से दिखाई नहीं देते, इसलिए पाठ-साक्ष्य की अनिश्चितता पाठक से छिपाई नहीं जानी चाहिए।
lexical_decisions:
- source_word: ⲛⲁⲩ
  choice: देखते हो
  rationale: यह दृश्य बोध के सामान्य क्रियापद का सीधा और स्वाभाविक हिन्दी रूप है; इससे मूल की पुनरावृत्ति और लय बनी रहती है।
- source_word: ⲉⲃⲟⲗ
  choice: अपने बाहर
  rationale: यह बाहरी दिशा या स्थिति को व्यक्त करता है और ⲉϩⲟⲩⲛ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ⲉϩⲟⲩⲛ
  choice: अपने भीतर
  rationale: यह आंतरिकता को व्यक्त करता है; ‘बाहर/भीतर’ की जोड़ी आधुनिक हिन्दी में स्वाभाविक है और मूल समानांतरता को सुरक्षित रखती है।
- source_word: ⲟⲣⲁⲧⲟⲛ (Greek loan ὁρατόν)
  choice: जो दिखाई देता है
  rationale: मूल यूनानी विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। यह रूप उसके अर्थ को स्पष्ट रखता है और ‘देखते हो’ वाली शब्द-प्रतिध्वनि भी बचाता है।
- source_word: ⲓⲙⲁⲧⲓⲟⲛ (Greek loan ἱμάτιον)
  choice: वस्त्र
  rationale: ‘वस्त्र’ गरिमापूर्ण, सहज और रूपक के लिए उपयुक्त है; यह अर्थ को ‘शरीर’, ‘आवरण’ या किसी अन्य व्याख्या तक सीमित नहीं करता।
theological_decisions:
- issue: ‘वस्त्र’ के रूपक की पहचान
  choice: रूपक को केवल ‘तुम्हारा वस्त्र’ के रूप में रखा गया है।
  alternative: इसे शरीर, बाहरी व्यक्तित्व या भौतिक जगत के रूप में स्पष्ट करना।
  rationale: पंक्ति स्वयं रूपक का आशय निश्चित नहीं करती; किसी विशिष्ट दार्शनिक या धार्मिक व्याख्या को पाठ में जोड़ना उचित नहीं होगा।
- issue: बाहर और भीतर का संबंध
  choice: दोनों को समानांतर स्थानगत अभिव्यक्तियों के रूप में रखा गया है।
  alternative: इन्हें बाहरी संसार और आत्मिक अंतःकरण जैसे व्याख्यात्मक पदों में बदलना।
  rationale: मूल विरोध जानबूझकर संक्षिप्त और बहुअर्थी है; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘तुम’ मूल संबोधन की संख्या को हिन्दी में खुला रहने देता है। ‘उसे ही’ और ‘वही’ से मूल की पहचानात्मक समानांतरता उभरती है, पर उसकी दार्शनिक व्याख्या निर्धारित नहीं की जाती।
