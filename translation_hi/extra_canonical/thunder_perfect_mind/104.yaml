  choice: उसे … एक प्रतिरूप बनाया
  rationale: यूनानी मूल के ⲧⲩⲡⲟⲥ का अर्थ ‘रूप, नमूना, प्रतिरूप’ है; causative construction को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ⲥⲁϩⲟⲩⲛ
  choice: भीतर
  rationale: यहाँ स्थानवाचक अर्थ ‘अंदर/भीतर’ बाहरी पक्ष के साथ स्पष्ट विरोध बनाता है; इसे ‘निकट आना’ नहीं माना गया।
- source_word: ⲥⲁⲛⲃⲟⲗ
  choice: बाहर
  rationale: पाठ का आंतरिक–बाह्य विरोध बनाए रखने के लिए स्थानवाचक अर्थ लिया गया है, न कि ‘दूर’।
- source_word: ⲛⲁⲩ ⲉⲣⲟϥ
  choice: जिसे … देखते हो
  rationale: यह सापेक्ष वाक्यांश है, आज्ञार्थक ‘देखो’ नहीं।
- source_word: ⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: प्रकट है
  rationale: यहाँ रूप का अर्थ ‘दिखाई देना/प्रकट होना’ है; इसे ⲱⲛϩ ‘जीना’ से अलग रखा गया है।
- source_word: ⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: सुननेवालो
  rationale: यूनानी ἀκροατής के सम्बोधनार्थ बहुवचन को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बाहरी और भीतरी रूप के बीच संबंध
  choice: ‘उसे तुम अपने भीतर मुझमें देखते हो’
  alternative: ‘तुम मुझे अपने भीतर देखते हो’
  rationale: वाक्य की असामान्य सर्वनाम-संरचना और रहस्यात्मक तनाव को सरल करके मिटाया नहीं गया; ‘उसे’ और ‘मुझमें’ दोनों को बनाए रखा गया है।
- issue: खंड को ‘मैं न्याय हूँ’ कथन से जोड़ना
  choice: ऐसा कोई कथन मुख्य पाठ में नहीं जोड़ा गया
  alternative: ‘मैं वह हूँ जिसे न्याय कहा जाता है’
  rationale: दिए गए कॉप्टिक अंश में न्याय अथवा अपराध का कथन नहीं है; सम्भावित खंड-संरेखण त्रुटि के कारण परामर्श-पाठ को स्रोत में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; रहस्यात्मक और काव्यात्मक स्वर बनाए रखते हुए वाक्य सरल रखा गया है। ‘प्रतिरूप’, ‘प्रकट’ और ‘वस्त्र’ जैसे गरिमापूर्ण पर सामान्यतः समझे जाने वाले शब्द चुने गए हैं। आरम्भिक अपूर्णता को दीर्घविराम से दिखाया गया है।
