  yaml_path: translation/extra_canonical/thunder_perfect_mind/104.yaml
  text: '...you[a], he made him a pattern within you. And what you see outside you, you see me within you. It is visible, and it is your garment. Listen to me[d][c][b], you hearers.'
translation:
  language: hi
  text: …तुममें से,[a] उसने उसे तुम्हारे भीतर एक प्रतिरूप बनाया। और जिसे तुम अपने बाहर देखते हो, उसे तुम अपने भीतर मुझमें देखते हो। वह प्रकट है,[b] और वही तुम्हारा वस्त्र है।[c] हे सुननेवालो, मेरी सुनो।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक अंश का आरम्भ अपूर्ण है; इसलिए पहले शब्दों का पूरा संबंध निश्चित नहीं किया जा सकता।
    reason: textual_fragment
  - marker: b
    text: यहाँ के कॉप्टिक रूप का अर्थ ‘प्रकट/दिखाई देनेवाला’ है। पुराने पाठ-विभाजन में इसे ‘जीओ’ भी समझा गया था, पर वह कम सम्भावित है।
    reason: lexical_alternative
  - marker: c
    text: ‘वही तुम्हारा वस्त्र है’ वाला पाठ सम्भवतः अस्पष्ट या बिगड़े हुए अक्षरों के सुधार पर आधारित है; उपलब्ध OCR में यह शब्दक्रम साफ़ नहीं है।
    reason: textual_uncertainty
  - marker: d
    text: दिए गए कॉप्टिक अंश में ‘मैं न्याय हूँ’ वाला वाक्य नहीं मिलता; सम्भव है कि इस खंड का शीर्षक या मानचित्रण अगले-पिछले अंश से असंरेखित हो।
    reason: alignment_note
