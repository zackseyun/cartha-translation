translation:
  language: hi
  text: मैं पत्नी और कुँवारी हूँ।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कॉप्टिक ⲥϩⲓⲙⲉ का अर्थ “स्त्री” या “पत्नी” हो सकता है। “कुँवारी” के साथ इसके विरोध को देखते हुए यहाँ “पत्नी” रखा गया है; “स्त्री” भी संभव अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: ⲡⲁⲣⲑⲉⲛⲟⲥ यूनानी से लिया गया शब्द है, जिसका सामान्य अर्थ “कुँवारी” है; काव्यात्मक शैली में “कुमारी” भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: ओसीआर पाठ में ⲡⲁⲣⲑⲉⲛⲟⲥ शब्द पंक्ति के अंत पर दो भागों में बँटा है (ⲡⲁⲣ | ⲑⲉⲛⲟⲥ), इसलिए इस खंड की सीमाओं का संरेखण पूरी तरह निश्चित नहीं है।
    reason: alignment_note
