- source_word: ⲧⲡⲁⲣⲑⲉⲛⲟⲥ
  choice: कुँवारी
  rationale: यह यूनानी मूल का आगत शब्द है, जिसका सामान्य अर्थ ‘virgin’ है। आधुनिक हिन्दी में ‘कुँवारी’ यहाँ व्यक्ति की पहचान और ‘पत्नी’ के साथ मूल विरोधाभास को स्वाभाविक रूप से व्यक्त करता है।
