  source_fidelity: 'The principal lexical choices follow the Coptic excerpt well: knowledge/ignorance, shame, the distinct modesty/bashfulness term, and strength followed by a continuing conjunction are all retained. The opening jussive is represented appropriately, with its alternative noted. However, ⲧⲡⲁⲣⲣⲏⲥⲓⲁ is an abstract quality (boldness/frankness), not specifically an utterance; “निर्भीक वाणी” narrows it and breaks the balanced abstract pair with “लज्जा.”'
