  issues:
  - severity: medium
    issue: “निर्भीक वाणी” over-specifies ⲧⲡⲁⲣⲣⲏⲥⲓⲁ.
    rationale: Parrhesia can concern frank or confident public speech, but it denotes the abstract quality of boldness/frankness, rather than a particular ‘speech.’ In this identity list it is paired with the abstract noun “लज्जा.” “निर्भीकता” preserves the category and leaves the lexical range available in the note.
