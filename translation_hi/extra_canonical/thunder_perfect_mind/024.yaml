translation:
  language: hi
  text: 'ज्ञानी जन ज्ञानी बने रहें।[a]


    क्योंकि मैं ज्ञान और अज्ञान हूँ।


    मैं लज्जा और निर्भीकता हूँ।[b]


    मैं निर्लज्ज हूँ; मैं संकोची हूँ।[c]


    मैं शक्ति हूँ, और—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक पंक्ति का अनुवाद “ज्ञानी जन, ज्ञानी बनो” भी हो सकता है।
    reason: मूल कॉप्टिक में कृदन्त/संज्ञात्मक रूप और तीसरे पुरुष के कामनार्थक प्रयोग के कारण वाक्य-विन्यास में कुछ अस्पष्टता है।
  - marker: b
    text: यह शब्द खुलकर बोलने, स्पष्टवादिता या सार्वजनिक रूप से विश्वास के साथ बोलने का भाव भी रखता है।
    reason: ग्रीक से आए ⲡⲁⲣⲣⲏⲥⲓⲁ का वाचिक और सार्वजनिक आयाम बताना आवश्यक है।
  - marker: c
    text: यहाँ “संकोची” के लिए प्रयुक्त मूल शब्द “लज्जा” वाले पिछले शब्द से अलग है और संकोच या लाजशीलता का भाव दे सकता है।
    reason: दो निकटार्थी किंतु भिन्न कॉप्टिक शब्दों का अंतर सुरक्षित रखना है।
lexical_decisions:
- source_word: ⲥⲟⲩⲱⲛⲧ ⲙⲁⲣⲟⲩ ⲥⲟⲩⲱⲛⲧ
  choice: ज्ञानी जन ज्ञानी बने रहें
  rationale: ⲙⲁⲣⲟⲩ तीसरे पुरुष की आज्ञार्थक/कामनार्थक संरचना है; यह अनुवाद ‘ज्ञानी’ की पुनरुक्ति और सूक्तिपरक लय बनाए रखता है।
- source_word: ⲡⲥⲟⲟⲩⲛ / ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: ज्ञान / अज्ञान
  rationale: दोनों अमूर्त संज्ञाओं के सीधे विरोध और मूल के विरोधाभास को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ⲡϣⲓⲡⲉ
  choice: लज्जा
  rationale: यहाँ मूल अर्थ ‘शर्म/लज्जा’ है; ‘लज्जा’ गरिमापूर्ण और संज्ञात्मक पहचान-वाक्य के अनुकूल है।
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: निर्भीक वाणी
  rationale: यूनानी मूल का आशय सार्वजनिक रूप से खुलकर और विश्वासपूर्वक बोलना है; केवल ‘साहस’ कहने की अपेक्षा यह वाचिक आयाम बचाता है।
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ / ϫⲓⲡⲏⲧ
  choice: निर्लज्ज / संकोची
  rationale: समानांतर विशेषणात्मक रूप हिन्दी में बनाए गए हैं, साथ ही ϫⲓⲡⲏⲧ को ϣⲓⲡⲉ से अलग, संकोचशीलता के अर्थ में रखा गया है।
- source_word: ⲛⲁϣⲧⲉ
  choice: शक्ति
  rationale: इस प्रसंग में अर्थ ‘शक्ति/दृढ़ता’ है, ‘भय’ नहीं; इसके बाद का ⲁⲩⲱ वाक्य के अगले खंड में जारी रहने का संकेत देता है।
theological_decisions:
- issue: वक्ता द्वारा परस्पर-विरोधी गुणों को अपने विषय में कहना
  choice: विरोधाभासी पहचान-वाक्यों को ज्यों का त्यों रखा गया
  alternative: उन्हें रूपक, अलग-अलग अवस्थाओं या अलग दृष्टिकोणों के रूप में स्पष्ट करना
  rationale: मूल पाठ जानबूझकर तनाव और विरोधाभास रचता है; अनुवाद में उसकी व्याख्या करके तनाव समाप्त करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘मैं … हूँ’ की पुनरावृत्ति मूल की घोषणात्मक लय बचाती है। अंतिम ‘और—’ पाठ के अगले खंड में जारी रहने को दर्शाता है।
