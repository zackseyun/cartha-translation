lexical_decisions:
- source_word: ⲧⲉⲧϭⲟⲟⲃ
  choice: जो निर्बल है
  rationale: यह स्त्रीलिंग संबंधवाचक पदबंध वक्ता की अवस्था बताता है। ‘निर्बल’ आधुनिक, स्वाभाविक हिन्दी में कमजोरी का अर्थ स्पष्ट रखता है।
- source_word: ⲉⲉⲓⲟⲩⲧⲁϫⲣⲟ
  choice: मैं बलवान हूँ
  rationale: समीक्षित पाठ के अनुसार यह पहले कथन ‘निर्बल’ के प्रतिकूल बल या सामर्थ्य की अवस्था व्यक्त करता है। ‘बलवान’ विरोधाभासी आत्म-घोषणा को बिना ‘अधिकार’ जैसे अधिक विशिष्ट अर्थ के सुरक्षित रखता है।
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: मैं वही हूँ
  rationale: कॉप्टिक की स्त्रीलिंग प्रथम-पुरुष पहचान-सूत्र को हिन्दी में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है; वक्ता का स्त्रीलिंग संदर्भ अगले पद ‘जो निर्बल है’ से भी स्पष्ट रहता है।
theological_decisions:
- issue: वक्ता में निर्बलता और बल का साथ-साथ कथन
  choice: दोनों दावों को प्रत्यक्ष विरोधाभासी आत्म-घोषणा के रूप में बनाए रखा गया है।
  alternative: इसे समय-सापेक्ष बनाना—‘जब मैं निर्बल हूँ… जब मैं सामर्थ्य में हूँ…’।
  rationale: दृश्य कॉप्टिक अंश पहचानसूचक कथन और समन्वय ‘और’ का समर्थन करता है; इसे आज्ञाओं या अलग-अलग समयों में बदलना स्रोत में निहित तनाव को अनुचित रूप से हल कर देगा।
