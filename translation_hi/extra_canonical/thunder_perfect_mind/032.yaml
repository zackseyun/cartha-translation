  yaml_path: translation/extra_canonical/thunder_perfect_mind/032.yaml
  text: And you will find me in greatness; and do not look at me going out among those who are honored, and in the least places look for me.
translation:
  language: hi
  text: और तुम मुझे महानता में पाओगे;[a] और मुझे सम्मानित लोगों के बीच से निकलकर आते हुए मत देखो;[b] और सबसे छोटे स्थानों में मुझे ढूँढ़ो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘महानता’ का अर्थ प्रसंगानुसार ‘ऊँचा पद’ या ‘समृद्धि’ भी समझा जा सकता है। पारंपरिक प्रस्तुतियों में इस अंश को कभी-कभी ‘मेरी दरिद्रता और मेरे धन पर ध्यान दो’ कहा गया है, पर उपलब्ध कॉप्टिक पाठ यहाँ स्पष्ट रूप से ‘दरिद्रता’ और ‘धन’—दोनों शब्दों का प्रयोग नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: ‘निकलकर आते हुए’ का अनुवाद ‘बाहर निकलते हुए’ या ‘प्रकट होते हुए’ भी हो सकता है; मूल क्रियारूप की OCR-पहचान पूरी तरह सुनिश्चित नहीं है।
    reason: alignment_note
  - marker: c
    text: अंतिम शब्दसमूह OCR में विकृत है। संदर्भ और पाठ के संभावित पुनर्निर्माण से ‘मुझे ढूँढ़ो’ समर्थित होता है; पुराना पाठ-विभाजन ‘मौन का स्थान’ पढ़ता था, पर वह संभवतः इसी विकृति पर आधारित है।
    reason: textual_note
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: तुम मुझे पाओगे
  rationale: भविष्यकाल के द्वितीय पुरुष बहुवचन रूप के साथ ϭⲓⲛⲉ का सामान्य अर्थ ‘पाना/खोजना’ है; हिन्दी में ‘पाओगे’ सहज और अर्थनिष्ठ है।
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: महानता
  rationale: ⲙⲛⲧ- से बना भाववाचक रूप ‘महानता’ को सीधे व्यक्त करता है; ‘धन-सम्पत्ति’ संभव प्रसंगगत अर्थ है, पर शब्दगत रूप से कम सुनिश्चित।
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: पर मुझे … मत देखो
  rationale: निषेधात्मक आज्ञा को स्वाभाविक हिन्दी में रखा गया है। ⲟⲩⲇⲉ का संबंध यहाँ विरोधी अगली आज्ञा से मिलाकर ‘पर … बल्कि’ द्वारा व्यक्त किया गया है।
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: से निकलते हुए
  rationale: ⲉⲃⲟⲗ बाहरी दिशा दर्शाता है; ‘निकलते हुए’ going out/coming forth की गति को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: सम्मानित लोग
  rationale: यह ⲧⲁⲉⲓⲟ ‘सम्मान देना’ के स्थायी रूप वाला बहुवचन संबंधवाचक पद है, अर्थात ‘जो सम्मानित हैं’; इसे ‘महान लोग’ कहना उचित नहीं।
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: सबसे तुच्छ स्थानों
  rationale: यूनानी-व्युत्पन्न ⲉⲗⲁⲭⲓⲥⲧⲟⲥ और ⲧⲟⲡⲟⲥ मिलकर ‘सबसे छोटे/निम्न स्थान’ देते हैं। ‘तुच्छ’ सामाजिक अवमानना और निम्नता का तनाव बनाए रखता है।
- source_word: ⲛ̄ⲧⲉ ⲧⲏⲥ ⲱⲕ ⲉⲛⲥⲱⲉⲓ (OCR; likely ⲛⲧⲉⲧⲛϭⲱϣⲧ ⲛⲥⲱⲉⲓ)
  choice: मुझे ढूँढ़ो
  rationale: प्रस्तुत OCR खंड विकृत है; सुधारे गए पाठ का आशय ‘मेरी खोज करो/मुझे ढूँढ़ो’ है। इससे ‘मौन का स्थान’ जैसी अप्रमाणित व्याख्या से बचा गया है।
theological_decisions:
- issue: ‘महानता’ और ‘सबसे तुच्छ स्थानों’ का विरोधाभासी आत्म-वर्णन
  choice: दोनों ध्रुवों को बिना समन्वित व्याख्या के बनाए रखा
  alternative: महानता को ‘धन’ और तुच्छ स्थानों को ‘दरिद्रता’ मानकर पारंपरिक ‘मेरी दरिद्रता और धन पर ध्यान दो’ के अनुरूप करना
  rationale: उपलब्ध कॉप्टिक अंश स्पष्ट रूप से महानता तथा सबसे निम्न स्थानों की भाषा देता है; रचना का जानबूझकर रखा गया विरोधाभास किसी सिद्धान्तगत समाधान के बिना सुरक्षित रहना चाहिए।
