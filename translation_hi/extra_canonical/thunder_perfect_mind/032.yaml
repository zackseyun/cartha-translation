  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सहज शैली। बहुवचन ‘तुम’ ने कॉप्टिक द्वितीय पुरुष बहुवचन को सुरक्षित रखा है। वाक्य के विरोधाभासी और घोषणात्मक स्वर को बनाए रखते हुए अस्पष्टताओं को पादटिप्पणियों में रखा गया है।
