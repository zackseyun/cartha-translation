base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/082.yaml
  text: 'I am the union and the dissolution[a];

    I am the abiding[d][c][b],

    and I am the dissolution.'
translation:
  language: hi
  text: 'मैं संयोग[a] और विघटन[b] हूँ;

    मैं स्थायित्व[c] हूँ,

    और मैं विघटन हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘संयोग’ का अर्थ ‘जुड़ना’ या ‘एक होना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘विघटन’ के लिए ‘खुलना’, ‘अलग होना’ या ‘बंधन-मुक्त होना’ भी संभव हैं। यही शब्द अंतिम पंक्ति में फिर आता है।
    reason: lexical_alternative
  - marker: c
    text: ‘स्थायित्व’ वाला शब्द ‘बने रहना’, ‘निवास’ या ‘विश्राम-स्थान’ भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲡⲱⲧⲣ
  choice: संयोग
  rationale: देशज कॉप्टिक शब्द यहाँ जुड़ने या एक होने की क्रिया/अवस्था व्यक्त करता है। ‘संयोग’ संक्षिप्त रूप में इस अर्थ को रखता है और इसके साथ आए विरोधी ‘विघटन’ के समानांतर बैठता है।
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: विघटन
  rationale: ⲕⲱⲗ ⲉⲃⲟⲗ का भाव खोलने, अलग करने या बिखेरने का है। ‘विघटन’ संयोग के प्रतिपक्ष को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ⲧⲙⲟⲛⲏ
  choice: स्थायित्व
  rationale: यूनानी मूल का यह कॉप्टिक शब्द बने रहने, टिके रहने, निवास या विश्राम की अवस्था बता सकता है। अमूर्त आत्म-घोषणाओं और ‘विघटन’ से विरोध को देखते हुए ‘स्थायित्व’ चुना गया है।
- source_word: ⲡⲕⲱⲗ
  choice: विघटन
  rationale: यहाँ वही खोलने या अलग करने वाला अर्थ फिर आता है; पहले प्रयोग के साथ एकरूपता और मूल की जानबूझकर की गई पुनरावृत्ति बनाए रखी गई है।
- source_word: ⲁⲩⲱ
  choice: और
  rationale: मूल के सरल संयोजक और समानांतर वाक्य-विन्यास को सुरक्षित रखता है।
theological_decisions:
- issue: वक्ता का परस्पर-विरोधी आत्मवर्णन
  choice: ‘संयोग’ और ‘विघटन’ दोनों को बिना सामंजस्य बैठाए वक्ता की पहचान के रूप में रखा गया है।
  alternative: विघटन को सृष्टि, मुक्ति या किसी विशिष्ट धर्मवैज्ञानिक प्रक्रिया के रूप में समझाकर प्रस्तुत करना।
  rationale: मूल पाठ विरोधाभास को जानबूझकर साथ रखता है; किसी विशिष्ट संप्रदायगत व्याख्या से उसे हल करना स्रोत से आगे जाना होगा।
