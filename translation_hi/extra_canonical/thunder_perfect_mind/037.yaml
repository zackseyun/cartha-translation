  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली। स्त्री वक्ता को “मैं वही हूँ” से व्यक्त किया गया है; जानबूझकर उपस्थित विरोधाभास और खंडित अन्त सुरक्षित रखे गए हैं।
