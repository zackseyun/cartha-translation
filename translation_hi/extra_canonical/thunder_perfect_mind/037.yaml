  text: 'मेरी दुर्बलता के विषय में सावधान रहो।[a]


    परन्तु मैं वही हूँ जो हर भय में विद्यमान है


    और थरथराहट में सामर्थ्य है।[b]


    मैं वही हूँ जो…[c]'
  philosophy: optimal-equivalence
