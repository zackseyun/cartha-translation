  revised_text: 'थोमा ने उत्तर दिया, “इन बातों के बाद हम क्या कह सकते हैं? अंधों से हम क्या कह सकते हैं? इन दयनीय नश्वर मनुष्यों को हम कौन-सी शिक्षा दें, जो कहते हैं, ‘हम यहाँ भलाई [करने] आए हैं, शाप देने नहीं,’ और फिर भी [कहते हैं], ‘यदि हम देह में उत्पन्न न हुए होते, तो [पाप] को कभी न जानते’?”


