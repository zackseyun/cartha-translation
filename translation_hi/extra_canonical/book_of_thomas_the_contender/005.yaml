    Nor will he find a way to the east to flee there and be rescued.


    Because he did not find it in the day when he lived in the body, he will not find it on the day of judgment.”'
translation:
  language: hi
  text: 'थोमा ने उत्तर दिया, “इन बातों के बाद हम क्या कह सकते हैं? अंधों से हम क्या कह सकते हैं? इन दयनीय नश्वर मनुष्यों को हम कौन-सी शिक्षा दें, जो कहते हैं, ‘हम यहाँ भलाई [करने] आए हैं, शाप देने नहीं,’ और फिर भी [कहते हैं], ‘यदि हम देह में उत्पन्न न हुए होते, तो [पाप] को कभी न जानते’?”


    उद्धारकर्ता ने कहा, “सचमुच, [ऐसे लोगों] को मनुष्य न समझो, बल्कि [पशु] समझो; क्योंकि जैसे पशु एक-दूसरे को खा जाते हैं, वैसे ही इस प्रकार के लोग भी एक-दूसरे को खा जाते हैं। बात ठीक उलटी है: अपने प्रेम के कारण उन्होंने [राज्य] खो दिया है—वह मीठी आग—और वे मृत्यु के दास बनकर विनाश के काम करने दौड़ते हैं। वे अपने पूर्वजों की वासना के अनुसार चलते हैं। उन्हें अथाह गड्ढे में फेंक दिया जाएगा, ताकि वे अपने स्वभाव की कड़वी बुराई की यातना सहें। उन्हें कोड़े मारे जाएँगे और वे पीछे की ओर, वहाँ भागेंगे जहाँ वे देख नहीं सकते; वे अपने अंगों से [अलग कर दिए जाएँगे], और इसे साहस से नहीं, बल्कि [निराशा में] सहेंगे। वे प्रसन्न हैं, क्योंकि […] पागलपन और विवेकहीनता […] [वे] अपने [पागलपन को पहचाने बिना, और यह मानते हुए] कि वे बुद्धिमान [हैं], इस विवेकहीनता के पीछे दौड़ते हैं। [वे …] अपनी देह […]। उनका मन स्वार्थ की ओर लगा है, क्योंकि उनकी सोच अपने कामों में उलझी रहती है; पर आग उन्हें झुलसा देगी।”


    थोमा ने उत्तर दिया, “प्रभु, जो व्यक्ति उनके बीच फेंक दिया जाएगा, वह क्या करेगा? मुझे उनकी बहुत चिंता है, क्योंकि उन पर आक्रमण करनेवाले बहुत हैं।”


    उद्धारकर्ता ने उत्तर दिया, “तुम स्वयं क्या सोचते हो?”


    यहूदा ने, जो थोमा कहलाता है, कहा, “प्रभु, उचित यही है कि आप बोलें और मैं सुनूँ।”


    उद्धारकर्ता ने उत्तर दिया, “जो मैं तुमसे कहूँगा, उस पर ध्यान दो और जो सत्य है उस पर विश्वास करो। जो बोता है और जो बोया जाता है, दोनों आग में—आग और पानी में—नष्ट हो जाएँगे, और वे अपने आपको अंधेरी कब्रों में ढक लेंगे। बहुत समय बीत जाने के बाद वे बुरे पेड़ों का फल प्रकट करेंगे; पशुओं और मनुष्यों के मुँहों में उन्हें दोषी ठहराया और मार डाला जाएगा, और वर्षा, हवाएँ, वायु तथा ऊपर से चमकता प्रकाश उन्हें उकसाते रहेंगे।”


    थोमा ने उत्तर दिया, “प्रभु, निस्संदेह आपने हमें विश्वास दिला दिया है। हम अपने हृदय में जानते हैं, और यह स्पष्ट है कि ऐसा ही [है] और आपका वचन पर्याप्त है। फिर भी, जो बातें आप हमसे कहते हैं वे संसार को हँसी योग्य और घृणित लगती हैं, क्योंकि उनका गलत अर्थ लगाया जाता है। तो हम जाकर उनका प्रचार कैसे करें, क्योंकि संसार में हमारा [आदर नहीं] होता?”


    उद्धारकर्ता ने उत्तर दिया, “मैं तुमसे सच कहता हूँ: जो कोई [तुम्हारा] वचन सुनकर उसे ठुकराता है, उसका उपहास करता है या इन बातों पर हँसता है—मैं तुमसे सच कहता हूँ—वह ऊपर के उस शासक के हाथ सौंप दिया जाएगा, जो हर शक्ति पर राजा होकर शासन करता है। वह उसे चक्कर पर चक्कर घुमाएगा और स्वर्ग से निकालकर अथाह गड्ढे में फेंक देगा; वहाँ उसे एक तंग और अंधकारमय स्थान में बंद कर दिया जाएगा। फिर वह न मुड़ सकेगा, न हिल सकेगा, क्योंकि तारतारोस[a] अत्यंत गहरा है और अडिग अधोलोक[b] की [कटुता भारी] है। […] उन्हें उसमें […] वे क्षमा नहीं करेंगे […] तुम्हारा पीछा करेंगे। वे […] को […] तारतारूखोस[c] दूत के हाथ सौंप देंगे […] आग उनका पीछा करती हुई। […] आग के कोड़े, जो पीछा किए जा रहे व्यक्ति के मुँह पर चिनगारियों की बौछार उगलते हैं।


    यदि वह पश्चिम की ओर भागेगा, तो आग से उसका सामना होगा।


    यदि वह दक्षिण की ओर भागेगा, तो वहाँ भी उसका सामना उसी से होगा।


    यदि वह उत्तर की ओर मुड़ेगा, तो खौलती आग का संकट फिर उसके सामने आ जाएगा।


    और न उसे पूर्व की ओर कोई ऐसा मार्ग मिलेगा जिससे वह वहाँ भागकर बच सके।


    क्योंकि जिस दिन वह देह में रहता था, उस दिन उसने वह मार्ग नहीं पाया; इसलिए न्याय के दिन भी वह उसे नहीं पाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'तारतारोस: यूनानी परंपरा में अत्यंत गहरे दंड-स्थान का नाम; यहाँ इसे विशिष्ट नाम के रूप में रखा गया है।'
    reason: सांस्कृतिक और पौराणिक पद सामान्य हिन्दी पाठक के लिए अपरिचित हो सकता है।
  - marker: b
    text: 'अधोलोक: यहाँ ‘हेडीज़’ का अनुवाद, अर्थात मृतकों का लोक; आवश्यक नहीं कि इसका अर्थ बाद की परंपराओं का ‘नरक’ ही हो।'
    reason: धर्मवैचारिक अतिनिर्धारण से बचते हुए पद का अर्थ स्पष्ट करना।
  - marker: c
    text: 'तारतारूखोस: पाठ में आए एक दूत का नाम या पद, संभवतः तारतारोस से संबंधित; सटीक अर्थ अनिश्चित है।'
    reason: दुर्लभ पद और उसकी अनिश्चित व्युत्पत्ति बताना।
lexical_decisions:
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: शीर्षक का धार्मिक अर्थ बनाए रखते हुए आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण रूप।
- source_word: abyss
  choice: अथाह गड्ढा
  rationale: दंड-स्थान की गहराई और गर्त—दोनों बिंबों को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: Tartaros
  choice: तारतारोस
  rationale: विशिष्ट प्राचीन दंड-स्थान को सामान्य ‘नरक’ में विलीन न करके लिप्यंतरित किया गया है।
- source_word: Hades
  choice: अधोलोक
  rationale: मृतकों के लोक का व्यापक अर्थ रखा गया है; इसे किसी विशेष उत्तरकालीन नरक-सिद्धांत से नहीं जोड़ा गया।
- source_word: Tartarouchos
  choice: तारतारूखोस
  rationale: विशिष्ट नाम/उपाधि का लिप्यंतरण किया गया है, क्योंकि अर्थ और पाठीय रूप अनिश्चित हैं।
- source_word: what sows and what is sown
  choice: जो बोता है और जो बोया जाता है
  rationale: असामान्य और संभवतः प्रतीकात्मक मूल अभिव्यक्ति को सहज बनाकर निर्णीत नहीं किया गया।
- source_word: sweet fire
  choice: मीठी आग
  rationale: विरोधाभासी रूपक को ज्यों का त्यों रखा गया है, क्योंकि उसका आशय संदिग्ध है।
theological_decisions:
- issue: ‘अपने प्रेम के कारण … मीठी आग’ का वाक्य-संबंध
  choice: वाक्य की अस्थिरता को डैशों के साथ बनाए रखा
  alternative: ‘मीठी आग के प्रेम के कारण उन्होंने राज्य खो दिया’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में संबंध अस्पष्ट है; अनुवाद ने किसी एक धर्मवैचारिक अर्थ को निश्चित नहीं किया।
- issue: देह, पाप और उत्पत्ति का संबंध
  choice: ‘यदि हम देह में उत्पन्न न हुए होते, तो पाप को कभी न जानते’
  alternative: इसे देह को स्वयं पाप का कारण बताने वाले स्पष्ट कथन के रूप में प्रस्तुत करना
  rationale: पात्रों का उद्धृत दावा रखा गया है, पर उसे कथाकार अथवा उद्धारकर्ता की स्वीकृत शिक्षा नहीं बनाया गया।
