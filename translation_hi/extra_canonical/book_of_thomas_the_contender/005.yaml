    थोमा ने उत्तर दिया, “प्रभु, निस्संदेह आपने हमें विश्वास दिला दिया है। हम अपने हृदय में जानते हैं, और यह स्पष्ट है कि ऐसा ही [है] और आपका वचन पर्याप्त है। फिर भी, जो बातें आप हमसे कहते हैं वे संसार के लिए हँसी और घृणा की वस्तु हैं, क्योंकि उनका गलत अर्थ लगाया जाता है। तो हम जाकर उनका प्रचार कैसे करें, क्योंकि संसार में हमारा [आदर नहीं] होता?”


