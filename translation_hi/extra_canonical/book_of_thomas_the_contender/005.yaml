    थोमा ने उत्तर दिया, “प्रभु, जो व्यक्ति उनके बीच फेंक दिया जाएगा, वह क्या करेगा? मुझे उनकी बहुत चिंता है, क्योंकि उन पर आक्रमण करनेवाले बहुत हैं।”


    उद्धारकर्ता ने उत्तर दिया, “तुम स्वयं क्या सोचते हो?”


