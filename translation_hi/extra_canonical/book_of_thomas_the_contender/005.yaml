    The Savior replied, “Pay attention to what I will tell you, and believe what is true. What sows and what is sown will vanish in the fire, in fire and water, and they will cover themselves in dark graves. After much time has passed, they will reveal the fruit of evil trees, being reproved and killed in the mouths of animals and humans, driven on by the rains, winds, air, and the light shining from above.”


