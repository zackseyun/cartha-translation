base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/002.yaml
  text: 'The Savior said, “Brother Thomas, listen to me while you have time (left) in the world, and I will reveal to you the things you have wondered about in your mind.


    “It has been said that you are my twin and true friend. Therefore, examine yourself and discover who you are, the mode in which you are, and how you will be (in the future). Since you will be called ‘my brother,’ it is not fitting for you to be ignorant of yourself. Yet I know that you have understood (yourself), because you have already understood that I am true knowledge. Thus, even though you do not understand, as you concur with me 1, you have already attained knowledge, and (so) you will be called ‘the one of self-knowledge.’ For whoever has no knowledge of himself knows nothing, but whoever knows himself has, along with that, already gained deep knowledge about everything. Consequently, my brother Thomas, you have looked upon what is hidden from human beings—namely, that which they stumble over in (self-)ignorance.”'
translation:
  language: hi
  text: 'उद्धारकर्ता ने कहा, “भाई थोमा, जब तक संसार में तुम्हारे पास समय शेष है, मेरी बात ध्यान से सुनो। तब मैं तुम्हें वे बातें प्रकट करूँगा जिनके विषय में तुम अपने मन में विचार करते रहे हो।


    “क्योंकि यह कहा गया है कि तुम मेरे जुड़वाँ और सच्चे मित्र हो, इसलिए अपने आप को परखो और पता लगाओ कि तुम कौन हो, किस दशा में हो, और भविष्य में कैसे होगे। क्योंकि तुम ‘मेरे भाई’ कहलाओगे, इसलिए तुम्हारा अपने ही विषय में अनजान रहना उचित नहीं है। फिर भी मैं जानता हूँ कि तुमने अपने आप को समझ लिया है, क्योंकि तुम पहले ही समझ चुके हो कि मैं सच्चा ज्ञान हूँ। इसलिए, यद्यपि तुम नहीं समझते, फिर भी मुझसे सहमत होने के कारण[a] तुम ज्ञान प्राप्त कर चुके हो और ‘आत्मज्ञान रखनेवाले’ कहलाओगे। क्योंकि जिसे अपना ज्ञान नहीं है, वह कुछ नहीं जानता; पर जो अपने आप को जानता है, उसने इसके साथ ही सब कुछ के विषय में गहरा ज्ञान प्राप्त कर लिया है। इसलिए, मेरे भाई थोमा, तुमने वह देख लिया है जो मनुष्यों से छिपा है—अर्थात वह, जिस पर वे अपने ही विषय में अनजान होने के कारण ठोकर खाते हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मुझसे सहमत होने के कारण”—उपलब्ध अंग्रेज़ी साक्ष्य में इस वाक्यांश के साथ संख्या 1 है, पर दी गई सामग्री में उससे सम्बद्ध टिप्पणी उपलब्ध नहीं है। इसका अर्थ ‘मेरे साथ एकमत होने पर’ भी हो सकता है।
    reason: पाठ का वाक्यगत सम्बन्ध और अंग्रेज़ी साक्ष्य का संकेत अनिश्चित है; प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित है।
lexical_decisions:
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: धार्मिक उपाधि का प्रतिष्ठित और सामान्य आधुनिक हिन्दी रूप।
- source_word: heed me
  choice: मेरी बात ध्यान से सुनो
  rationale: केवल सुनने के बजाय ध्यान देने और मानने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: study yourself
  choice: अपने आप को परखो
  rationale: आत्म-परीक्षण के सक्रिय भाव को साधारण, गरिमापूर्ण हिन्दी में रखता है।
- source_word: the mode in which you are
  choice: किस दशा में हो
  rationale: अस्पष्ट दार्शनिक अभिव्यक्ति को अनावश्यक रूप से परिभाषित किए बिना हिन्दी में समझने योग्य रखता है।
- source_word: true knowledge
  choice: सच्चा ज्ञान
  rationale: मूल साक्ष्य की विधेयात्मक और धर्मवैचारिक रूप से तनावपूर्ण भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: self-knowledge
  choice: आत्मज्ञान / अपना ज्ञान / अपने आप को जानना
  rationale: उपाधि में संक्षिप्त ‘आत्मज्ञान’ और व्याख्यात्मक वाक्यों में अधिक सहज हिन्दी प्रयोग करके मूल शब्द-सम्बन्ध बनाए रखे गए हैं।
- source_word: know-nothing
  choice: वह कुछ नहीं जानता
  rationale: अपमानसूचक संज्ञा बनाने के बजाय मूल कथन का अर्थ स्पष्ट और प्राकृतिक हिन्दी में देता है।
theological_decisions:
- issue: ‘मैं सच्चा ज्ञान हूँ’ में वक्ता और ज्ञान की पहचान
  choice: मैं सच्चा ज्ञान हूँ
  alternative: मेरे पास सच्चा ज्ञान है
  rationale: स्रोत-साक्ष्य का प्रबल पहचान-वाक्य सुरक्षित रखा गया है; उसे केवल ज्ञान रखने के दावे में कमज़ोर नहीं किया गया।
- issue: न समझने के बावजूद ज्ञान प्राप्त होने का विरोधाभास
  choice: यद्यपि तुम नहीं समझते... तुम ज्ञान प्राप्त कर चुके हो
  alternative: यद्यपि तुम पूरी तरह नहीं समझते...
  rationale: ‘पूरी तरह’ जोड़कर तनाव सुलझाने के बजाय साक्ष्य की वास्तविक विरोधाभासी भाषा बनाए रखी गई।
- issue: सब कुछ के विषय में गहरे ज्ञान का व्यापक दावा
  choice: सब कुछ के विषय में गहरा ज्ञान
  alternative: आत्मिक बातों का गहरा ज्ञान
  rationale: दावे को किसी विशिष्ट धार्मिक क्षेत्र तक सीमित नहीं किया गया।
- issue: Thomas नाम का रूप
  choice: थोमा
  alternative: थॉमस
  rationale: बाइबिलीय/प्राचीन धार्मिक नाम का हिन्दी में प्रचलित रूप चुना गया, जबकि किसी विशेष सम्प्रदायगत अर्थ को नहीं जोड़ा गया।
