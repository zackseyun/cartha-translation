review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the supplied witness’s principal elements: the opening lacuna, ‘secret sayings,’ the Savior, Judas Thomas, Mathaias’s emphatic self-identification, walking, listening, and writing. However, ‘मुझ मथायस ने’ is not grammatically sound Hindi, and the expanded ellipsis within the opening brackets goes beyond the witness’s empty brackets.'
  naturalness: The sentence is generally clear and appropriately formal. Revising the self-identification to ‘हाँ, मैंने ही, मथायस ने’ preserves its deliberately emphatic, somewhat marked form while making the Hindi grammatical. ‘जब मैं चल रहा था और उन्हें आपस में बात करते सुन रहा था’ more explicitly and naturally carries the two simultaneous actions.
  terminology: ‘गुप्त वचन,’ ‘उद्धारकर्ता,’ ‘यहूदा थोमा,’ and ‘मथायस’ are suitable modern-standard Hindi choices and do not impose interpretation. ‘लिखे’ is preferable here to perfective ‘लिख लिया,’ which can add a nuance of completion not required by ‘wrote down.’
  issues:
  - severity: medium
    issue: Ungrammatical emphatic self-identification
    rationale: ‘मुझ मथायस ने’ incorrectly uses the oblique pronoun ‘मुझ’ before the ergative marker ‘ने.’ The source’s ‘I, yes I, Mathaias’ should retain emphasis without ungrammatical Hindi.
  - severity: low
    issue: Opening lacuna has been expanded
    rationale: The supplied source and English POB show empty square brackets ‘[]’; rendering these as ‘[…]’ introduces an ellipsis not present in the provided witness. Retain ‘[]’ while explaining the lacuna in the footnote.
  - severity: low
    issue: Aspect and simultaneity can be closer to the witness
    rationale: ‘लिख लिया’ may suggest completed accomplishment, while ‘लिखे’ is more neutral for ‘wrote down.’ An explicit finite ‘जब मैं चल रहा था ... सुन रहा था’ naturally represents ‘while I was walking, listening.’
  revised_text: '[][a] वे गुप्त वचन, जो उद्धारकर्ता ने यहूदा थोमा से कहे और जिन्हें मैंने—हाँ, मैंने ही, मथायस ने—लिखे, जब मैं चल रहा था और उन्हें आपस में बात करते सुन रहा था।'
