base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/001.yaml
  text: '[] The secret sayings that the Savior spoke to Judas Thomas, which I—yes, I, Mathaias—wrote down as I walked along, listening to them speak with one another.'
translation:
  language: hi
  text: '[…][a] वे गुप्त वचन, जो उद्धारकर्ता ने यहूदा थोमा से कहे और जिन्हें मैंने—हाँ, मुझ मथायस ने—चलते हुए और उन दोनों को आपस में बात करते सुनते हुए लिख लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भ में कोष्ठक पाण्डुलिपि-साक्ष्य में पाठ के लुप्त या अपठनीय होने का संकेत देता है। यह हिन्दी रूप उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक मूल से प्रत्यक्ष समीक्षा अभी शेष है।
    reason: आरम्भिक रिक्ति और वर्तमान पाठाधार की सीमा पाठक के सामने पारदर्शी रखना।
lexical_decisions:
- source_word: secret sayings
  choice: गुप्त वचन
  rationale: ‘वचन’ धार्मिक-साहित्यिक संदर्भ में स्वाभाविक और गरिमापूर्ण है, जबकि ‘गुप्त’ मूल साक्ष्य के रहस्यपूर्ण या अप्रकट स्वर को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: यह आधुनिक मानक हिन्दी में स्पष्ट और प्रचलित धार्मिक पद है तथा किसी विशेष सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- source_word: Judas Thomas
  choice: यहूदा थोमा
  rationale: दोनों नामों को नाम-रूप में रखा गया है; उनके पारस्परिक संबंध या ‘थोमा’ के अर्थ की व्याख्या पाठ में नहीं जोड़ी गई।
- source_word: Mathaias
  choice: मथायस
  rationale: अंग्रेज़ी साक्ष्य में दिए विशिष्ट नाम-रूप का लिप्यंतरण किया गया है; इसे ‘मत्ती’ या किसी अन्य परिचित नाम से नहीं मिलाया गया।
- source_word: while I was walking, listening
  choice: चलते हुए और … सुनते हुए
  rationale: दोनों समकालिक क्रियाओं को यथासंभव निकट रूप में रखा गया है और यह नहीं जोड़ा गया कि लेखक अनिवार्यतः उन्हीं के साथ चल रहा था।
theological_decisions:
- issue: ‘गुप्त वचन’ की प्रकृति
  choice: गुप्त वचन
  alternative: रहस्यपूर्ण उपदेश
  rationale: ‘उपदेश’ कहने से विधा और आशय अधिक निश्चित हो जाते; उपलब्ध साक्ष्य केवल sayings और secret का समर्थन करता है।
- issue: वक्ता की उपाधि
  choice: उद्धारकर्ता
  alternative: मुक्तिदाता
  rationale: ‘उद्धारकर्ता’ स्रोत की उपाधि को सीधे रखता है और यहाँ उसकी पहचान या उद्धार की प्रकृति की व्याख्या नहीं करता।
- issue: लेखक के आत्मबलाघात का संरक्षण
  choice: मैंने—हाँ, मुझ मथायस ने—
  alternative: मैं मथायस ने
  rationale: ‘I, yes I’ के असामान्य जोर को हिन्दी में स्पष्ट रखा गया है; इसे शैलीगत पुनरुक्ति मानकर हटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। वाक्य की प्रस्तावना-जैसी संरचना तथा ‘हाँ, मुझ मथायस ने’ का जोर सुरक्षित है। उपलब्ध आधार अंग्रेज़ी साक्ष्य है, इसलिए कॉप्टिक की प्रत्यक्ष समीक्षा के बाद शब्दक्रम, नाम-रूप और आरम्भिक रिक्ति पर पुनर्विचार आवश्यक हो सकता है।
