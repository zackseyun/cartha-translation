translation:
  language: hi
  text: 'तब उद्धारकर्ता ने आगे कहा, “हाय तुम पर, जो परमेश्वर-विहीन और आशाहीन हो, और उस बात की प्रतीक्षा करते हो जो कभी पूरी नहीं होगी! हाय तुम पर, जिनकी आशा देह पर—उस कारागार पर जो नाश होने के लिए बँधा है—टिकी हुई है! तुम कब तक भूले रहोगे? और कब तक यह मानते रहोगे कि अविनाशी वस्तुएँ भी नाश हो जाएँगी? तुम्हारी आशा संसार पर टिकी है, और यह जीवन ही तुम्हारा ईश्वर है! तुम अपने ही को नष्ट कर रहे हो!


    हाय तुम पर, क्योंकि तुम्हारे भीतर की आग तुम्हें झुलसा रही है; वह बुझने वाली नहीं है!


    हाय तुम पर, क्योंकि तुम्हारे मन में एक चक्र घूम रहा है!


    हाय तुम पर, जो अपने भीतर बसे दाह की जकड़ में हो; वह तुम्हारी देह को प्रत्यक्ष रूप से भस्म करेगा और तुम्हारी आत्माओं को अदृश्य रूप से चीर डालेगा, और तुम्हें तुम्हारे साथियों से जा मिलने के लिए तैयार करेगा!


    हाय तुम पर, हे बंदियो, क्योंकि तुम गुफाओं में जंजीरों से जकड़े हो!


    “तुम उपहास करते और पागलपन की हँसी हँसते हो! तुम अपने दंड से अनजान हो; तुम अपनी दशा पर विचार नहीं करते और यह समझने में असफल रहे हो कि तुम अंधकार और [मृत्यु] में जीते हो! इसके बजाय तुम आग से मतवाले और [कड़वाहट से भरे] हुए हो। तुम्हारे भीतर के [दाह] के कारण तुम्हारा मन पागल हो गया है, और तुम्हारे शत्रुओं का विष और उनके आक्रमण तुम्हें मीठे लगते हैं! तुम्हारे लिए घोर अंधकार प्रकाश के समान उदित हुआ, क्योंकि तुमने अपनी स्वतंत्रता छोड़कर दासता स्वीकार कर ली! तुमने अपने हृदय काले कर लिए, अपने विचार मूर्खता के हवाले कर दिए, और अपने भीतर के आग भरे धुएँ से अपने मन को भर लिया! तुम्हारा प्रकाश बादल [में… ढक गया], और जो वस्त्र तुम्हें ढाँपते हैं, उन्हें तुम […]। और तुम एक खोखली [आशा] के बंधन में पड़ गए। तुमने किस पर विश्वास किया? क्या तुम [नहीं समझते कि] तुम सब उन लोगों के बीच रहते हो जो […] तुम्हें मानो [तुम…]।[a]


    […] तुमने अपने आपको घोर अंधकार के पानी में डुबो दिया!


    तुम अपनी ही लालसाओं के अनुसार चले!


    हाय तुम पर, जो भटकाव में जीते हो और उस सूर्य के प्रकाश की उपेक्षा करते हो जो संसार का न्याय करता और उस पर दृष्टि रखता है, और जो शत्रुओं को दास बनाने के लिए सब वस्तुओं को घेर लेगा।


    तुम चंद्रमा को भी नहीं पहचानते, जो रात-दिन नीचे देखता और तुम्हारे वध से पड़ी लाशों को निहारता है!


    हाय तुम पर, जो स्त्रियों के निकट रहना और उनके साथ अशुद्ध संभोग करना पसंद करते हो!


    हाय तुम पर, जो अपनी शारीरिक शक्तियों की जकड़ में हो, क्योंकि वे तुम्हें यातना देंगी!


    हाय तुम पर, जो दुष्ट दुष्टात्माओं की शक्तियों की जकड़ में हो!


    हाय तुम पर, जो अपने अंगों को आग से फुसलाते हो!


    “कौन तुम पर ठंडी ओस की वर्षा भेजेगा, ताकि तुम्हारे दाह समेत तुम्हें घेरे हुए आग के बादल को बुझा दे? कौन सूर्य को तुम पर चमकाएगा, ताकि तुम्हारे भीतर का घोर अंधकार दूर करे और घोर अंधकार तथा अशुद्ध पानी को ढाँप दे? सूर्य और चंद्रमा, वायु और हवा, पृथ्वी और पानी के साथ मिलकर तुम्हें सुगंध देंगे; क्योंकि यदि सूर्य इन देहों पर न चमके तो वे खरपतवार और घास की तरह मुरझाकर नष्ट हो जाएँगी। यदि सूर्य उन पर चमकता है, तो वे फैलकर अंगूर की बेल का गला घोंट देती हैं। किंतु यदि अंगूर की बेल प्रबल होकर पास उगने वाले सारे खरपतवार और दूसरी झाड़ियों पर छाया कर दे, और [फैलकर] बढ़े, तो जहाँ वह उगती है उस भूमि पर वही अधिकार कर लेगी और हर उस स्थान पर प्रभुत्व करेगी जिसे उसने अपनी छाया से ढक लिया है। जब वह पक जाएगी, तब सारी भूमि पर उसका अधिकार होगा और वह अपने स्वामी के लिए बहुत फल लाएगी। वह उसे और भी प्रसन्न करेगी, क्योंकि इन पौधों को उखाड़ने के भारी परिश्रम से वह बच गया होगा। बल्कि अंगूर की बेल ने स्वयं ही उनका गला घोंटकर उन्हें दूर कर दिया; वे मर गए और मिट्टी के समान (मृत) हो गए।”


    तब यीशु ने आगे कहा, “हाय तुम पर, क्योंकि तुमने शिक्षा स्वीकार नहीं की, और जो […] प्रचार करने का काम करेंगे […]। और [तुम] […] की ओर दौड़ रहे हो […] [उन्हें] नीचे धकेल देगा […] दिन में तुम उन्हें मार डालते हो […] ताकि वे मृत्यु में से उठ सकें।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अनुच्छेद में कोष्ठक और तीन बिंदु पांडुलिपि की क्षति अथवा संपादकीय पुनर्स्थापना दर्शाते हैं; वाक्य का पूरा अर्थ निश्चित नहीं है।
    reason: खंडित पाठ और पुनर्निर्माण की अनिश्चितता बताना।
  - marker: b
    text: अंतिम कथन बहुत खंडित है। शब्दों का आपसी व्याकरणिक संबंध और यह कि कौन किसे मारता, नीचे धकेलता या मृत्यु में से उठता है—निश्चित नहीं है।
    reason: क्षतिग्रस्त समापन को कृत्रिम रूप से सुसंगत बनाने से बचना।
lexical_decisions:
- source_word: godless
  choice: परमेश्वर-विहीन
  rationale: ‘नास्तिक’ आधुनिक दार्शनिक अर्थ को अनावश्यक रूप से थोप सकता है; यह रूप धार्मिक वंचना/विरोध की व्यापकता बनाए रखता है।
- source_word: flesh
  choice: देह
  rationale: ‘मांस’ की अपेक्षा वर्तमान धार्मिक-दार्शनिक संदर्भ में स्वाभाविक है और शरीरधर्मी अस्तित्व का आशय रखता है।
- source_word: imperishable
  choice: अविनाशी
  rationale: नाश के विरोध में स्रोत का पारिभाषिक तनाव स्पष्ट रखता है।
- source_word: scorching
  choice: दाह
  rationale: भीतर रहने और यातना देने वाली जलन का संज्ञात्मक रूप सुरक्षित रहता है।
- source_word: damnation
  choice: दंड
  rationale: स्रोत-साक्ष्य की सीमा में रहते हुए अंतिम नरक-दंड जैसी विशिष्ट व्यवस्थित धारणा आरोपित नहीं की गई।
- source_word: gloom
  choice: घोर अंधकार
  rationale: साधारण ‘अंधकार’ से तीव्रता अलग करते हुए आवर्ती बिंब को पठनीय बनाया गया।
- source_word: bodily powers
  choice: शारीरिक शक्तियाँ
  rationale: अस्पष्ट अभिव्यक्ति को किसी विशिष्ट वासना, अंग या आध्यात्मिक सत्ता के रूप में नहीं सुलझाया गया।
- source_word: grapevine
  choice: अंगूर की बेल
  rationale: आम पाठक के लिए स्वाभाविक और वनस्पति-रूपक में सुस्पष्ट।
- source_word: lure your limbs with fire
  choice: अपने अंगों को आग से फुसलाते हो
  rationale: कठिन और संभवतः रूपकात्मक वाक्य को व्याख्यात्मक विस्तार के बिना निकटता से रखा गया।
theological_decisions:
- issue: सूर्य और चंद्रमा का व्यक्तिकरण तथा न्यायकारी भूमिका
  choice: मूल साक्ष्य के व्यक्तिकरण को बनाए रखा
