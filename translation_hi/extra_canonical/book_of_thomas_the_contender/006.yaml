id: BTHC.006
reference: Book of Thomas the Contender — Condemnation of the Godless
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: 'The Savior then continued: “Woe to you who are godless, who are hopeless, expecting what will not come to pass! Woe to you whose hope is in the flesh, even in the prison bound to perish! How long will you be forgetful? And how long will you assume that imperishable things will also perish? Your hope is fixed on the world, your god being this life! You are destroying yourselves!


    Woe to you inside the fire that scorches you inside, because it is unquenchable!

    Woe to you for of the wheel that spins inside your minds!

    Woe to you in the clutch of the scorching that dwells inside you, because it will consume your flesh visibly and rip your souls invisibly, and will make you ready to join your friends!

    Woe to you prisoners, because you are fettered in caves!


    “You mock, in insane laughter you smirk! You are unaware of your damnation, and you fail to consider your state, and [you] have failed to understand that you live in darkness and [death]! Instead, you are intoxicated with fire and [filled] with bitterness. Your mind is insane because of the [scorching that is inside] you, and the venom and the attacks of your enemies are sweet to you! And the gloom rose for you like the light, because you capitulated your freedom for slavery! You blackened your hearts and relinquished your thoughts to foolishness, and you filled your thoughts with the fiery smoke inside you! And your light [was obscured] in the cloud [of . . .], and the clothes that cover you, you [. . .]. And [you] were captured by a vacuous [hope]. And whom did [you] believe? Do you [not understand that] all of [you] live among those that [. . .] you as though [you . . .].


    [] You immersed yourselves in the water of gloom!

    You acted according to your own urges!

    Woe to you who live in error, who neglect the light of the sun who judges the world and gazes down at the world, that will encircle all things in order to enslave enemies.

    Nor do you perceive the moon, who by night and day gazes down, beholding the corpses from your slaughtering!

    Woe to you who love to be close to women and (who love) unclean intercourse with them!

    Woe to you caught in the clutch of your bodily powers, because they will torment you!

    Woe to you caught in the clutch of the forces of evil demons!

    Woe to you who lure your limbs with fire!


    “Who will send a shower of cool dew on you to quench the cloud of fire engulfing you together with your scorching? Who will make the sun to shine on you to dispel the gloom inside you and to conceal the gloom and impure water? The sun and moon, with the air and the wind, and the earth and the water, will grant you a fragrant scent, because if the sun does not shine on these bodies, they will wilt and perish, exactly like weeds and grass. If the sun shines on them, they take over and strangle the grapevine. If, however, the grapevine takes over and shades all the weeds and other bushes growing next to them, and [spreads] and increases, it will receive the land by itself where it grows and dominate every place where it has overshadowed it. And when it matures, it will control the entire land and will produce bountifully for its master, and will please him yet more, because he will have avoided the great trouble of uprooting these plants. However, the grapevine by itself got rid of them,
    even choking them, and they died and became as (dead) as the soil.”


    Jesus then continued and said: “Woe to you, because you did not accept the teaching, and those who [. . .] will work at preaching [. . .]. And [you] are running into [. . .] will drive [them] downward [. . .] by day you kill them [] so that they could rise from death.”'
