  source_fidelity: दिए गए अंग्रेज़ी सार्वजनिक-डोमेन साक्षी के प्रति अनुवाद अधिकांशतः निकट और सावधान है। किंतु अंतिम वाक्य में स्रोत के “upward (back)” और “greet (the light)” के कोष्ठकीय संकेत मुख्य पाठ में पर्याप्त रूप से सुरक्षित नहीं रहे थे। कुछ स्थानों पर वाक्य-विन्यास को स्रोत के ‘works of truth’ और अनिश्चित सर्वनाम-संबंध के अधिक निकट किया गया है। कॉप्टिक मूल की प्रत्यक्ष समीक्षा लंबित होने के कारण यह समीक्षा उपलब्ध अंग्रेज़ी साक्षी तक सीमित है।
