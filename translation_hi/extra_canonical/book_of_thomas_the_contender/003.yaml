  revised_text: 'थोमा ने प्रभु से कहा, “तो मैं आपसे विनती करता हूँ कि अपने स्वर्गारोहण से पहले मेरे प्रश्नों का उत्तर दें; और जब मैं आपसे छिपी हुई बातों के विषय में सुन लूँ, तब उन बातों पर खुलकर चर्चा कर सकूँ। और यह बात मेरे लिए स्पष्ट है कि दूसरों के सामने सत्य को आचरण में लाना कठिन है।”


    उद्धारकर्ता ने उत्तर दिया, “यदि दिखाई देनेवाली बातें ही तुमसे छिपी हैं, तो तुम अदृश्य बातों के विषय में कैसे सुन सकते हो? यदि इस संसार में सत्य के दिखाई देनेवाले काम करना तुम्हारे लिए कठिन है, तो फिर तुम उन कामों को कैसे करोगे जो अदृश्य ऊँचाई और परिपूर्णता[a] से संबंधित हैं? और तुम ‘कार्य करनेवाले’ कैसे कहलाओगे? इस विषय में तुम अभी विद्यार्थी हो और अब तक सिद्धता के शिखर तक नहीं पहुँचे।”


    थोमा ने उद्धारकर्ता से कहा, “जिन्हें आप अदृश्य बातें कहते हैं, [और जो फिर भी] हमसे छिपी हैं, उनके विषय में हमें समझाइए।”


    उद्धारकर्ता ने कहा, “[सभी] शरीर […] पशु उत्पन्न होते हैं […] वह इस प्रकार प्रकट है […] यह भी, जो ऊपर हैं […] दिखाई देनेवाली बातें, परंतु [वे] अपने ही मूल में दिखाई देती हैं [ ], और उनका फल उनका पोषण करता है। किंतु ये दिखाई देनेवाले शरीर अपने जैसे पशुओं को खाकर जीवित रहते हैं; फलस्वरूप शरीर बदलते रहते हैं। जो बदलता है, वह क्षीण होगा और नष्ट हो जाएगा, और उसके बाद उसके लिए जीवन की कोई आशा नहीं रहती, क्योंकि वह एक पशु-शरीर है। इसलिए जैसे पशुओं के शरीर नष्ट होते हैं, वैसे ही ये शारीरिक रूप भी नष्ट होंगे। वे पशुओं की तरह मैथुन से उत्पन्न होते हैं—क्या ऐसा नहीं है? यदि वह भी मैथुन से उत्पन्न होता है, तो वह पशुओं से भिन्न कुछ कैसे उत्पन्न करेगा? इसलिए जब तक तुम परिपक्व नहीं होते, तब तक बालक ही बने रहोगे।”[b]


    थोमा ने उत्तर दिया, “इसलिए, प्रभु, मैं आपसे कहता हूँ कि जो लोग अदृश्य और कठिनाई से समझ में आनेवाली बातों के विषय में बोलते हैं, वे उन लोगों के समान हैं जो रात में किसी निशाने पर तीर चलाते हैं। वे निश्चय ही दूसरों की तरह अपने तीर चलाते हैं, क्योंकि वे निशाने की ओर तीर चला रहे होते हैं, फिर भी निशाना दिखाई नहीं देता। पर जब प्रकाश प्रकट होकर अंधकार को ढक लेगा,[c] तब हर एक का काम दिखाई देगा। हे प्रभु, हमारे प्रकाश, हमें प्रकाशित कीजिए।”


    यीशु ने कहा, “प्रकाश का स्वभाव प्रकाश ही है।”[d]


    थोमा ने कहा, “प्रभु, मनुष्यों के लिए चमकनेवाला यह दिखाई देनेवाला प्रकाश क्यों उदय और अस्त होता है?”


    उद्धारकर्ता ने उत्तर दिया, “हे धन्य थोमा, यह दिखाई देनेवाला प्रकाश निश्चय ही तुम्हारे लिए चमकता है—इसलिए नहीं कि तुम यहाँ बने रहो, बल्कि इसलिए कि तुम यहाँ से चले जाओ। और जब सभी चुने हुए लोग पशु-दशा को त्याग देंगे, तब यह प्रकाश ऊपर (वापस) अपने मूल स्वरूप की ओर चला जाएगा और (प्रकाश का) अभिवादन करेगा,[e] क्योंकि यह एक अच्छा सेवक है।”'
