translation:
  language: hi
  text: 'थोमा ने प्रभु से कहा, “तो मैं आपसे विनती करता हूँ कि अपने स्वर्गारोहण से पहले मेरे प्रश्नों का उत्तर दें, ताकि जब मैं आपसे छिपी हुई बातों के विषय में सुन लूँ, तब उनके बारे में खुलकर चर्चा कर सकूँ। और यह बात मेरे लिए स्पष्ट है कि दूसरों के सामने सत्य पर चलना कठिन है।”


    उद्धारकर्ता ने उत्तर दिया, “यदि दिखाई देनेवाली बातें ही तुमसे छिपी हैं, तो तुम अदृश्य बातों के विषय में कैसे सुन सकते हो? यदि इस संसार में दिखाई देनेवाले सत्य के काम करना तुम्हारे लिए कठिन है, तो फिर तुम उन कामों को कैसे करोगे जो अदृश्य ऊँचाई और परिपूर्णता[a] से संबंधित हैं? और तुम ‘कार्य करनेवाले’ कैसे कहलाओगे? इस विषय में तुम अभी विद्यार्थी हो और अब तक सिद्धता के शिखर तक नहीं पहुँचे।”


    थोमा ने उद्धारकर्ता से कहा, “जिन्हें आप अदृश्य बातें कहते हैं, [और जो फिर भी] हमसे छिपी हैं, उनके विषय में हमें समझाइए।”


    उद्धारकर्ता ने कहा, “[सभी] शरीर […] पशु उत्पन्न होते हैं […] वह इस प्रकार प्रकट है […] यह भी, जो ऊपर हैं […] दिखाई देनेवाली बातें, परंतु [वे] अपने ही मूल में दिखाई देती हैं [ ], और उनका फल उनका पोषण करता है। किंतु ये दिखाई देनेवाले शरीर अपने जैसे पशुओं को खाकर जीवित रहते हैं; फलस्वरूप शरीर बदलते रहते हैं। जो बदलता है, वह बिगड़ेगा और नष्ट हो जाएगा, और उसके बाद उसके लिए जीवन की कोई आशा नहीं रहती, क्योंकि वह पशु-शरीर है। इसलिए जैसे पशुओं के शरीर नष्ट होते हैं, वैसे ही ये शारीरिक रूप भी नष्ट होंगे। वे पशुओं की तरह मैथुन से उत्पन्न होते हैं—क्या ऐसा नहीं है? यदि वह भी मैथुन से उत्पन्न होता है, तो वह पशुओं से भिन्न किसी वस्तु को कैसे जन्म देगा? इसलिए जब तक तुम परिपक्व नहीं होते, तब तक बालक ही बने रहोगे।”[b]


    थोमा ने उत्तर दिया, “इसलिए, प्रभु, मैं आपसे कहता हूँ कि जो लोग अदृश्य और कठिनाई से समझ में आनेवाली बातों के विषय में बोलते हैं, वे उन लोगों के समान हैं जो रात में किसी निशाने पर तीर चलाते हैं। वे भी निश्चय ही दूसरों की तरह अपने तीर चलाते हैं, क्योंकि वे निशाने की ओर तीर चला रहे होते हैं, फिर भी निशाना दिखाई नहीं देता। पर जब प्रकाश प्रकट होकर अंधकार को ढक लेगा,[c] तब हर एक का काम दिखाई देगा। हे प्रभु, हमारे प्रकाश, हमें प्रकाशित कीजिए।”


    यीशु ने कहा, “प्रकाश का स्वभाव प्रकाश ही है।”[d]


    थोमा ने कहा, “प्रभु, मनुष्यों के लिए चमकनेवाला यह दिखाई देनेवाला प्रकाश क्यों उदय और अस्त होता है?”


    उद्धारकर्ता ने उत्तर दिया, “हे धन्य थोमा, यह दिखाई देनेवाला प्रकाश निश्चय ही तुम्हारे लिए चमकता है—इसलिए नहीं कि तुम यहाँ बने रहो, बल्कि इसलिए कि तुम यहाँ से चले जाओ। और जब सभी चुने हुए लोग पशु-दशा को त्याग देंगे, तब यह प्रकाश ऊपर अपने मूल स्वरूप की ओर लौट जाएगा और प्रकाश का अभिवादन करेगा,[e] क्योंकि यह एक अच्छा सेवक है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परिपूर्णता” संभवतः यहाँ एक विशिष्ट आध्यात्मिक लोक या अवस्था का पारिभाषिक नाम भी हो सकता है; उपलब्ध साक्ष्य से अर्थ निश्चित नहीं है।
    reason: संभावित तकनीकी धार्मिक अर्थ को बिना निर्णायक व्याख्या के संकेत करना।
  - marker: b
    text: इस अनुच्छेद का आरंभिक भाग पांडुलिपि में बहुत खंडित है। कोष्ठक संपादकीय पूर्ति और […] लुप्त अथवा अपठनीय पाठ को दर्शाते हैं; खाली [ ] भी उपलब्ध साक्षी की रिक्ति को सुरक्षित रखता है।
    reason: गंभीर पाठ-क्षति और पुनर्निर्माण की अनिश्चितता स्पष्ट करना।
  - marker: c
    text: साक्षी में प्रकाश के अंधकार को “ढकने” की असामान्य अभिव्यक्ति है; अर्थ संभवतः अंधकार को मिटाने या उस पर छा जाने का है, पर मुख्य पाठ में रूपक को नहीं बदला गया।
    reason: असामान्य स्रोत-भाषा को सामान्यीकृत किए बिना पाठक को सचेत करना।
  - marker: d
    text: यह वाक्य जानबूझकर सूक्तिपरक और पुनरुक्तिपूर्ण प्रतीत होता है; इसका आशय उपलब्ध पाठ में और स्पष्ट नहीं किया गया।
    reason: वास्तविक अर्थगत अस्पष्टता सुरक्षित रखना।
  - marker: e
    text: यहाँ यह स्पष्ट नहीं है कि लौटता हुआ प्रकाश किस “प्रकाश” का अभिवादन करता है, और सर्वनाम-संबंध भी अनिश्चित हो सकता है।
    reason: साक्षी में विद्यमान संदर्भगत अस्पष्टता बताना।
lexical_decisions:
- source_word: Fullness
  choice: परिपूर्णता
  rationale: गूढ़ धार्मिक पारिभाषिकता को किसी विशिष्ट संप्रदायगत व्याख्या से बाँधे बिना सामान्य अर्थ और संभावित तकनीकी अर्थ दोनों सुरक्षित रखता है।
- source_word: workers
  choice: कार्य करनेवाले
  rationale: ‘कर्मी’ की राजनीतिक या संप्रदायगत ध्वनि से बचते हुए मूल रूपक को बनाए रखता है।
- source_word: animal body / animal state
  choice: पशु-शरीर / पशु-दशा
  rationale: ‘animal’ की पुनरावृत्ति और देह-संबंधी वैचारिक तनाव को नरम किए बिना सुरक्षित रखा गया है।
- source_word: intercourse
  choice: मैथुन
  rationale: प्रजनन-संबंधी आशय का स्पष्ट, गरिमापूर्ण और सटीक आधुनिक हिन्दी रूप।
- source_word: essence
  choice: मूल स्वरूप
  rationale: ‘सारतत्त्व’ की अत्यधिक दार्शनिक कठोरता से बचते हुए ऊपर लौटने और मूल प्रकृति की ओर जाने का भाव व्यक्त करता है।
- source_word: concealed things
  choice: छिपी हुई बातें
  rationale: सहज आधुनिक हिन्दी में रहस्य अथवा अप्रकाशित विषयों का अर्थ सुरक्षित है।
- source_word: do the truth
  choice: सत्य पर चलना
  rationale: शाब्दिक ‘सत्य करना’ अस्वाभाविक होता; यह रूप सत्य को व्यवहार में उतारने का आशय स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: ‘Fullness’ का संभावित तकनीकी गूढ़ार्थ
  choice: मुख्य पाठ में ‘परिपूर्णता’, साथ में पादटिप्पणी
  alternative: ‘पूर्णता’ या लिप्यंतरित तकनीकी पद
  rationale: स्रोत-साक्ष्य की सीमित स्थिति में किसी विकसित तत्त्वमीमांसीय प्रणाली को पाठ पर आरोपित नहीं किया गया।
- issue: शरीर और पशु-दशा का संबंध
  choice: कठोर देह-विरोधी भाषा को यथावत रखा
  alternative: इसे केवल नैतिक ‘सांसारिक दशा’ के रूप में नरम करना
  rationale: मूल साक्ष्य में विद्यमान धार्मिक तनाव को व्याख्यात्मक रूप से हल करना अनुचित होता।
- issue: प्रकाश किसका अभिवादन करता है
  choice: ‘प्रकाश का अभिवादन करेगा’
  alternative: ‘उसका अभिवादन किया जाएगा’ या ‘वह अपने मूल से मिल जाएगा’
  rationale: साक्षी में सर्वनाम-संदर्भ अस्पष्ट है; मुख्य पाठ ने उपलब्ध वाक्य-संरचना का निकट रूप रखा और पादटिप्पणी में अस्पष्टता बताई।
- issue: ‘The nature of light is light’
  choice: ‘प्रकाश का स्वभाव प्रकाश ही है’
  alternative: ‘प्रकाश प्रकाशमान होता है’
  rationale: सूक्तिपरक पुनरुक्ति और उसकी जानबूझकर बनी रहस्यमयता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध संवादात्मक रूप अपनाया गया है। ‘आप’ का प्रयोग प्रभु के संबोधन में आदर बनाए रखता है, जबकि उद्धारकर्ता की ओर से थोमा और शिष्यों के लिए ‘तुम’ मूल गुरु-शिष्य संबंध को स्वाभाविक बनाता है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अंतरिम अनुवाद है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है। पांडुलिपीय कोष्ठक और रिक्तियाँ यथासंभव सुरक्षित रखी गई हैं।
