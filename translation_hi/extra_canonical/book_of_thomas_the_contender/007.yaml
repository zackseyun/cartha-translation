  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/007.yaml
  text: '“Blessed are you who know beforehand what can trip you up and who flee from strange things.

    Blessed are you who are insulted and disrespected because of the love their Lord shows them.

    Blessed are you who weep and are persecuted by those who are without hope, because you will be freed from every captivity.


    “Watch and pray that you may avoid living in the flesh and instead depart from the bitter captivity of this life. When you pray, you will find rest because you have abandoned suffering and shame. For when you depart from bodily sufferings and appetites, you will receive rest from the Good One, and you will reign with the King, you and he united with one another, from now on, forever and ever. Amen.”


    The Book of Thomas

    The Contender

    Writing to the Mature


    Remember me too, my brothers,

    [in] your prayers:

    Peace be to the saints

    and to those of the spirit.'
translation:
  language: hi
  text: '“धन्य हो तुम, जो पहले से जानते हो कि कौन-सी बातें तुम्हें ठोकर खिला सकती हैं और जो पराई बातों से दूर भागते हो।


    धन्य हो तुम, जिनका अपमान और अनादर उस प्रेम के कारण होता है जो उनका प्रभु उनसे करता है।[a]


    धन्य हो तुम, जो रोते हो और उन लोगों के हाथों सताए जाते हो जिनके पास कोई आशा नहीं है, क्योंकि तुम हर प्रकार की कैद से मुक्त किए जाओगे।


    “जागते रहो और प्रार्थना करो कि तुम देह में जीवन बिताने से बचो, बल्कि इस जीवन की कड़वी कैद से निकल जाओ। जब तुम प्रार्थना करोगे, तब तुम्हें विश्राम मिलेगा, क्योंकि तुमने दुःख और लज्जा को त्याग दिया है। कारण यह है कि जब तुम शारीरिक पीड़ाओं और लालसाओं से अलग हो जाओगे, तब तुम्हें उस भले जन से विश्राम मिलेगा,[b] और तुम राजा के साथ राज्य करोगे—तुम और वह एक-दूसरे से एक हो जाओगे—अब से लेकर युगानुयुग तक। आमीन।”


    थोमा की पुस्तक


    प्रतियोगी[c]


    परिपक्व लोगों के लिए लिखी गई


    मेरे भाइयो, अपनी प्रार्थनाओं में मुझे भी याद रखना।


    पवित्र जनों को

    और आत्मा के जनों को शांति मिले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में यहाँ ‘उनका प्रभु’ और ‘उनसे’ है, जबकि संबोधन ‘तुम’ से किया गया है। यह असामान्य सर्वनाम-परिवर्तन अनुवाद में सुरक्षित रखा गया है; मूल कॉप्टिक की समीक्षा लंबित है।
    reason: साक्ष्य की वास्तविक व्याकरणिक अस्पष्टता को चुपचाप सामान्य बनाने से बचाना।
  - marker: b
    text: शाब्दिक उपाधि ‘भला जन’ है; इससे किसकी ओर संकेत है, इसे पाठ स्वयं यहाँ स्पष्ट नहीं करता।
    reason: ‘the Good One’ की धर्मवैचारिक पहचान को अनावश्यक रूप से निश्चित न करना।
  - marker: c
    text: शीर्षक का अनुवाद ‘प्रतियोगी’ किया गया है; इसका अर्थ संघर्ष करने वाला, मुकाबला करने वाला या प्रतिद्वंद्वी भी हो सकता है।
    reason: शीर्षक के अर्थ-क्षेत्र और अनिश्चितता को दिखाना।
lexical_decisions:
- source_word: knowledge beforehand
  choice: पहले से जानते हो
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में क्रिया का बोध शारीरिक साथ देने के बजाय पूर्वज्ञान या संज्ञान से जुड़ा बताया गया है; इसलिए सहज और अर्थ-सटीक हिंदी चुनी गई।
- source_word: strange things
  choice: पराई बातें
  rationale: मूल कॉप्टिक की प्रत्यक्ष समीक्षा लंबित होने के कारण व्यापक अर्थ बनाए रखा गया है; ‘अजनबी वस्तुएँ’ की अस्वाभाविकता से बचते हुए नैतिक या वैचारिक आशय को संकीर्ण नहीं किया गया।
- source_word: repose / rest
  choice: विश्राम
  rationale: यह देहगत आराम से अधिक मुक्ति और शांति की अवस्था को व्यक्त कर सकता है; ‘विश्राम’ इस धार्मिक-दार्शनिक व्यापकता को बनाए रखता है।
- source_word: the Good One
  choice: उस भले जन
  rationale: व्यक्तिवाचक उपाधि का संकेत बनाए रखने के लिए संकेतवाचक और आदरसूचक संज्ञा-रूप रखा गया, पर इसे बिना आधार सीधे ‘परमेश्वर’ नहीं बनाया गया।
- source_word: Contender
  choice: प्रतियोगी
  rationale: शीर्षक में संघर्ष या मुकाबले में लगे व्यक्ति का सामान्य अर्थ सुरक्षित रखा गया; ‘योद्धा’ जैसे अधिक सैन्य अर्थ को नहीं थोपा गया।
- source_word: the Mature
  choice: परिपक्व लोग
  rationale: आध्यात्मिक परिपक्वता संभव है, किंतु केवल किसी विशिष्ट दीक्षित वर्ग का अर्थ आरोपित नहीं किया गया।
theological_decisions:
- issue: देह में अस्तित्व और इस जीवन से प्रस्थान की भाषा
  choice: ‘देह में जीवन बिताने से बचो’ और ‘इस जीवन की कड़वी कैद से निकल जाओ’
  alternative: ‘शरीर को त्याग दो’ या ‘मर जाओ’
  rationale: पाठ की देह-विरोधी या तपस्वी तनावपूर्ण भाषा को बनाए रखा गया है, पर इसे आत्महत्या, मृत्यु अथवा किसी विशिष्ट ज्ञानवादी सिद्धांत की स्पष्ट आज्ञा नहीं बनाया गया।
- issue: प्रभु के प्रेम के कारण अपमानित लोगों का सर्वनाम-संबंध
  choice: अस्पष्ट तीसरे पुरुष को यथासंभव बनाए रखा गया
  alternative: ‘तुम्हारा प्रभु तुमसे प्रेम करता है’
  rationale: अंग्रेज़ी साक्ष्य में ‘their Lord … them’ अप्रत्याशित है और संभवतः पाठगत या अनुवादगत समस्या दर्शाता है; उसे चुपचाप दूसरे पुरुष में नियमित नहीं किया गया।
- issue: भले जन की पहचान
  choice: ‘उस भले जन’
  alternative: ‘परमेश्वर’ या ‘भला परमेश्वर’
  rationale: पाठ की उपाधि को किसी पूर्वनिर्धारित ईश्वरशास्त्रीय पहचान में नहीं बदला गया।
- issue: राजा के साथ पारस्परिक एकता
  choice: ‘तुम और वह एक-दूसरे से एक हो जाओगे’
  alternative: ‘तुम उसमें विलीन हो जाओगे’
  rationale: पारस्परिक संयुक्तता को रखा गया है, लेकिन अस्तित्वगत विलय या सारगत समानता का सिद्धांत नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, सुबोध धार्मिक गद्य रखा गया है। ‘धन्य हो तुम’, ‘जागते रहो और प्रार्थना करो’ तथा ‘युगानुयुग’ जैसे पद पाठ की आशीर्वचनात्मक और उपदेशात्मक लय बनाए रखते हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; मूल कॉप्टिक की प्रत्यक्ष समीक्षा अभी लंबित है। वेबसाइट का परिशिष्ट, संपर्क विवरण, वाणिज्यिक सूचना और संपादकीय FAQ मूल प्राचीन रचना का भाग न होने के कारण अनुवाद-पाठ में शामिल नहीं किए गए।
