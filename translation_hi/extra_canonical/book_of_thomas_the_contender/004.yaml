translation:
  language: hi
  text: 'तब उद्धारकर्ता ने आगे कहा, “हे प्रकाश के अथाह प्रेम! हे उस आग की कड़वाहट, जो मनुष्यों के शरीर और अस्थिमज्जा में जलती है, जो रात-दिन उनके भीतर भड़कती रहती है, जो मनुष्यों के अंगों को झुलसाती है और [उनके] मन को मतवाला तथा उनकी आत्माओं को उन्मत्त [कर देती है…] उन्हें पुरुषों और स्त्रियों, [दोनों] में […] रात, और वे हरकतें करते हैं, […] छिपकर और खुले में, क्योंकि पुरुष [स्त्रियों पर… हरकतें करते हैं] और स्त्रियाँ [पुरुषों पर]। [इसी कारण यह] कहा गया है: ‘वे सभी, जो सच्ची बुद्धि से सत्य को खोजते हैं, उड़ने के लिए पंख उगाएँगे; वे उस वासना से बच निकलेंगे जो मनुष्यों की आत्माओं को झुलसाती है, और जिस किसी [दुष्ट] आत्मा को वे देखें, उससे बच निकलने के लिए पंख उगाएँगे।’”[a]


    थोमा ने उत्तर दिया, “प्रभु, मैं आपसे ठीक इसी विषय में पूछता हूँ, क्योंकि मैं समझ गया हूँ कि, जैसा आप कहते हैं, आप हमारे हितकारी हैं।”


    उद्धारकर्ता ने फिर उत्तर दिया, “इसी कारण हमें तुमसे बोलना चाहिए, क्योंकि यह शिक्षा परिपक्व लोगों के लिए है। यदि तुम अब परिपक्व होना चाहते हो, तो इन बातों को पूरा करोगे। यदि नहीं, तो तुम्हारा नाम ‘अज्ञानी’ है; क्योंकि समझदार व्यक्ति मूर्ख के साथ नहीं रह सकता, और समझदार व्यक्ति सारी बुद्धि में परिपक्व होता है। वास्तव में, जो बुद्धिमान है, उसका पोषण सत्य से होगा और वह ‘बहती धारा के पास उगनेवाले वृक्ष के समान होगा।’ (भजन 1:3)[b] परन्तु मूर्ख के लिए भला और बुरा एक समान हैं। कुछ लोगों के पंख तो हैं, फिर भी वे उन दृश्य वस्तुओं की ओर दौड़ते हैं जो सत्य से दूर हैं। इसका कारण यह है कि उनका मार्ग दिखानेवाली आग उनके लिए सत्य का भ्रम रचती है, उन्हें [नाशवान] सुंदरता से प्रकाशित करती है, उन्हें मधुर अँधियारे में बंद कर देती है और सुगंधित भोग-विलास से मोहित करती है।


    “वह उन्हें न बुझनेवाली वासना से अंधा कर देगी, उनकी आत्माओं को झुलसा देगी और उनके लिए ऐसी बन जाएगी मानो उनके हृदय में ठोंका हुआ खूँटा, जिसे वे कभी निकाल नहीं पाएँगे। वह जैसे चाहती है, वैसे ही उन्हें मुँह की लगाम के समान इधर-उधर हाँकती है। दृश्य वस्तुओं की वासना की दासता की कड़वाहट से—वे वस्तुएँ जो आवेग के साथ पतित होती, बदलती और भटक जाती हैं—उसने उन्हें अपनी जंजीरों में बाँध रखा है और उनके हर अंग को बेड़ियों में जकड़ दिया है। वे निरन्तर नीचे की ओर खिंचते जाते हैं। जब वे मार डाले जाते हैं, तब नाशवान जगत के सभी पशु उन्हें पचा जाते हैं।”[c]


    थोमा ने उत्तर दिया, “यह स्पष्ट है, जैसा कहा भी गया है: [‘बहुत-से हैं… जो नहीं जानते] […] आत्मा।’”[d]


    और [उद्धारकर्ता] ने उत्तर दिया, “[धन्य है] वह बुद्धिमान व्यक्ति, जिसने [सत्य को खोजा और] उसे पाकर सदा के लिए उसमें विश्राम किया, और जो उसे व्याकुल करनेवालों से नहीं डरा।”[e]


    थोमा ने उत्तर दिया, “प्रभु, क्या हमारे लिए उन बातों में विश्राम करना अच्छा है जो हमारी अपनी हैं?”[f]


    उद्धारकर्ता ने कहा, “हाँ, यह लाभदायक है और तुम्हारे लिए अच्छा है, क्योंकि मनुष्यों के बीच दिखाई देनेवाली वस्तुएँ मिट जाएँगी। उनका देहधारी पात्र मिट जाएगा, और जब वह कुछ भी न रह जाएगा, तब वह दृश्य वस्तुओं के बीच—उन वस्तुओं के बीच जिन्हें देखा जा सकता है—अस्तित्व में आएगा। तब जो आग वे देखते हैं, वह विश्वास के प्रति उनके पहले के प्रेम के कारण उन्हें पीड़ा देगी। उन्हें फिर दृश्य वस्तुओं के पास इकट्ठा किया जाएगा। इसके अतिरिक्त, जो अदृश्य वस्तुओं के बीच देख सकते हैं, पर जिनमें सर्वोच्च प्रेम नहीं है, वे इस जीवन की चिंता और आग की झुलसन में नष्ट हो जाएँगे। थोड़े ही समय बाद दृश्य वस्तुएँ मिट जाएँगी। तब निराकार छायाएँ निकलेंगी, और वे कब्रों के बीच शवों पर सदा पड़ी रहेंगी—पीड़ा सहती हुईं, और उनकी आत्मा सड़ती हुई।”[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुच्छेद पांडुलिपि में बहुत खंडित है। वर्ग कोष्ठक संपादकीय पूर्ति और […] खोए अथवा अपठनीय पाठ को दर्शाते हैं।
    reason: पाठीय क्षति और पुनर्निर्माण की अनिश्चितता बताना आवश्यक है।
  - marker: b
    text: भजन 1:3 की ओर संकेत; यहाँ उपलब्ध साक्षी में ‘बहती/मुड़ती धारा’ जैसा रूप है।
    reason: उद्धरण-स्रोत और उसके विशिष्ट पाठरूप की पहचान।
  - marker: c
    text: ‘नाशवान जगत के पशु उन्हें पचा जाते हैं’ का बिंब कठिन है; इसे किसी निश्चित परलोक-सिद्धांत के रूप में स्पष्ट नहीं किया गया है।
    reason: धर्मवैचारिक अति-व्याख्या से बचना।
  - marker: d
    text: थोमा का उद्धरण गंभीर रूप से अपूर्ण है; उसका स्रोत और पूरा आशय निश्चित नहीं है।
    reason: खंडित उद्धरण की सीमा स्पष्ट करना।
  - marker: e
    text: ‘उसमें विश्राम किया’ का संबंध निकटतम ‘सत्य’ से माना गया है, पर क्षतिग्रस्त पाठ के कारण वाक्य पूरी तरह निश्चित नहीं है।
    reason: व्याकरणिक पुनर्निर्माण की अनिश्चितता दर्ज करना।
  - marker: f
    text: ‘जो हमारी अपनी हैं’ का आशय अस्पष्ट है—यह अपनी वास्तविक प्रकृति, अपने क्षेत्र, या अपने से संबंधित बातों की ओर संकेत कर सकता है।
    reason: वास्तविक बहुअर्थकता बनाए रखना।
  - marker: g
    text: अंतिम अनुच्छेद का तर्क और कुछ सर्वनाम कठिन हैं। अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर अस्थायी रूप से आधारित है; प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित है।
    reason: स्रोत-आधार की सीमा और पाठीय कठिनाई पारदर्शी करना।
lexical_decisions:
- source_word: Savior
  choice: उद्धारकर्ता
  rationale: सम्मानसूचक, स्वाभाविक और धार्मिक परंपरा में व्यापक रूप से समझा जाने वाला पद।
- source_word: marrow
  choice: अस्थिमज्जा
  rationale: शारीरिक बिंब को ठीक और संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: mature
  choice: परिपक्व
  rationale: बौद्धिक और आध्यात्मिक पूर्णता—दोनों संभावित अर्थों को खुला रखता है।
- source_word: Ignoramus
  choice: अज्ञानी
  rationale: नामकरण की अपमानसूचक शक्ति को आधुनिक हिन्दी में स्पष्ट रखता है, बिना कृत्रिम लिप्यंतरण के।
- source_word: visible things
  choice: दृश्य वस्तुएँ
  rationale: ग्रंथ के दृश्य-अदृश्य वैचारिक विरोध को लगातार बनाए रखता है।
- source_word: reposed
  choice: विश्राम किया
  rationale: स्थिरता, आश्रय और अंतिम ठहराव की अस्पष्टता को सुरक्षित रखता है।
- source_word: fleshly vessel
  choice: देहधारी पात्र
  rationale: पात्र के रूपक और शरीर-संबंधी अर्थ दोनों को बनाए रखता है; इसे केवल ‘शरीर’ नहीं किया गया।
- source_word: bit in the mouth
  choice: मुँह की लगाम
  rationale: पशु को नियंत्रित करनेवाले मुखबन्ध का बिंब साधारण पाठक के लिए सुबोध बनाता है।
theological_decisions:
