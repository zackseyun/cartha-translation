  revised_text: 'तब उद्धारकर्ता ने आगे कहा, “हे प्रकाश के अथाह प्रेम! हे उस आग की कड़वाहट, जो मनुष्यों के शरीरों और अस्थिमज्जा में जलती है, जो रात-दिन उनके भीतर भड़कती रहती है, जो मनुष्यों के अंगों को झुलसाती है और [उनके] मनों को मतवाला तथा उनकी आत्माओं को उन्मत्त [करती है] […] उन्हें पुरुषों और स्त्रियों, (दोनों) में […] रात, और वे गतियाँ करते हैं, […] छिपकर और खुले में, क्योंकि पुरुष [स्त्रियों पर … गतियाँ करते हैं] और स्त्रियाँ [पुरुषों पर]। [इसी कारण यह] [] कहा गया है: ‘वे सभी, जो सच्ची बुद्धि से सत्य को खोजते हैं, उड़ने के लिए पंख उगाएँगे, उस वासना से बच निकलेंगे जो मनुष्यों की आत्माओं को झुलसाती है, और जिस किसी [दुष्ट] आत्मा को वे देखें, उससे बच निकलने के लिए पंख उगाएँगे।’”[a]



    थोमा ने उत्तर दिया, “प्रभु, मैं आपसे ठीक इसी विषय में पूछता हूँ, क्योंकि मैं समझ गया हूँ कि, जैसा आप कहते हैं, आप हमारे हितकारी हैं।”



    उद्धारकर्ता ने फिर उत्तर दिया, “इसी कारण हमें तुमसे बोलना चाहिए, क्योंकि यह शिक्षा परिपक्व लोगों के लिए है। यदि तुम अब परिपक्व होना चाहते हो, तो इन बातों को पूरा करोगे। यदि नहीं, तो तुम्हारा नाम ‘अज्ञानी’ है; क्योंकि समझदार व्यक्ति मूर्ख के साथ नहीं रह सकता, और समझदार व्यक्ति सारी बुद्धि में परिपक्व होता है। वास्तव में, जो बुद्धिमान है, उसका पोषण सत्य से होगा और वह ‘बहती धारा के पास उगनेवाले वृक्ष के समान होगा।’ (भजन 1:3)[b] परन्तु मूर्ख के लिए भला और बुरा एक समान हैं। कुछ लोगों के पंख तो हैं, फिर भी वे उन दृश्य वस्तुओं की ओर दौड़ते हैं जो सत्य से दूर हैं। इसका कारण यह है कि उनका मार्ग दिखानेवाली आग उनके लिए सत्य का भ्रम रचती है, उन्हें [नाशवान] सुंदरता से प्रकाशित करती है, उन्हें मधुर अँधियारे में बंद कर देती है और सुगंधित भोग-विलास से मोहित करती है।



    “वह उन्हें न बुझनेवाली वासना से अंधा कर देगी, उनकी आत्माओं को झुलसा देगी और उनके लिए ऐसी बन जाएगी मानो उनके हृदय में ठोंका हुआ खूँटा, जिसे वे कभी निकाल नहीं पाएँगे। वह जैसे चाहती है, वैसे ही उन्हें मुँह में लगी लगाम के समान इधर-उधर हाँकती है। दृश्य वस्तुओं की वासना की दासता की कड़वाहट से—वे वस्तुएँ जो आवेग में पतित होती, बदलती और भटक जाती हैं—उसने उन्हें अपनी जंजीरों में बाँध रखा है और उनके हर अंग को बेड़ियों में जकड़ दिया है। वे निरन्तर नीचे की ओर खिंचते जाते हैं। जब वे मार डाले जाते हैं, तब नाशवान जगत के सभी पशु उन्हें पचा जाते हैं।”[c]



    थोमा ने उत्तर दिया, “यह स्पष्ट है, जैसा कहा भी गया है: [‘बहुत-से हैं … जो नहीं जानते] […] आत्मा।’”[d]



    और [उद्धारकर्ता] ने उत्तर दिया, “[धन्य है] वह बुद्धिमान व्यक्ति, जिसने [सत्य को खोजा और] उसे पाकर सदा के लिए उसमें विश्राम किया, और जो उसे व्याकुल करनेवालों से नहीं डरा।”[e]



    थोमा ने उत्तर दिया, “प्रभु, क्या हमारे लिए उन बातों में विश्राम करना अच्छा है जो हमारी अपनी हैं?”[f]



    उद्धारकर्ता ने कहा, “हाँ, यह लाभदायक है और तुम्हारे लिए अच्छा है, क्योंकि मनुष्यों के बीच दिखाई देनेवाली वस्तुएँ मिट जाएँगी। उनका देहधारी पात्र मिट जाएगा, और जब वह कुछ भी न रह जाएगा, तब वह दृश्य वस्तुओं के बीच—उन वस्तुओं के बीच जिन्हें देखा जा सकता है—अस्तित्व में आएगा। तब जो आग वे देखते हैं, वह विश्वास के प्रति उनके पहले के प्रेम के कारण उन्हें पीड़ा देगी। उन्हें फिर दृश्य वस्तुओं के पास इकट्ठा किया जाएगा। इसके अतिरिक्त, जो अदृश्य वस्तुओं के बीच देख सकते हैं, पर जिनमें सर्वोच्च प्रेम नहीं है, वे इस जीवन की चिंता और आग की झुलसन में नष्ट हो जाएँगे। थोड़े ही समय बाद दृश्य वस्तुएँ मिट जाएँगी। तब निराकार छायाएँ निकलेंगी, और वे कब्रों के बीच शवों पर सदा पड़ी रहेंगी—पीड़ा सहती हुईं, और उनकी आत्मा सड़ती हुई।”[g]'
