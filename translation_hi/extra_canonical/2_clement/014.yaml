base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/014.yaml
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church, which is spiritual and was created before the sun and the moon. But if we do not do the will of the Lord, we will belong to the scripture that says, “My house was made a den of robbers.” So then, let us choose instead to belong to the church of life, so that we may be saved.


    I do not suppose that you are unaware that the living church is the body of Christ, for the scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. And the Books and the Apostles plainly declare that the church does not exist now for the first time, but has existed from the beginning. For she was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    Now the church, being spiritual, was revealed in the flesh of Christ, thereby showing us that if any of us guards her in the flesh and does not defile her, that person will receive her again in the Holy Spirit. For this flesh is the counterpart and copy of the spirit. Therefore, no one who has defiled the copy will receive the original as their portion. This, then, is what he means, brothers and sisters: “Guard the flesh, so that you may partake of the spirit.”


    But if we say that the flesh is the church and the spirit is Christ, then whoever has treated the flesh wantonly has treated the church wantonly. Such a person, therefore, will not partake of the spirit, which is Christ>.


    So excellent are the life and immortality that this flesh can receive as its portion if the Holy Spirit is joined to it. No one can declare or tell the things that the Lord has prepared for his elect.'
translation:
  language: hi
  text: 'इसलिए, भाइयो और बहनो, यदि हम अपने पिता परमेश्वर की इच्छा पूरी करते हैं, तो हम उस प्रथम कलीसिया के होंगे, जो आत्मिक है और जिसे सूर्य और चन्द्रमा से पहले सृजा गया था। पर यदि हम प्रभु की इच्छा पूरी नहीं करते, तो हम उस वचन के अनुसार ठहरेंगे जो कहता है, “मेरा घर डाकुओं की गुफा बना दिया गया।” इसलिए आओ, हम जीवन की कलीसिया के होना चुनें, ताकि हमारा उद्धार हो।


    मैं नहीं मानता कि तुम इस बात से अनजान हो कि जीवित कलीसिया मसीह की देह है; क्योंकि पवित्रशास्त्र कहता है, “परमेश्वर ने मनुष्य को नर और नारी बनाया।” नर मसीह है और नारी कलीसिया। धर्मग्रन्थ और प्रेरित स्पष्ट रूप से बताते हैं कि कलीसिया पहली बार अब अस्तित्व में नहीं आई, बल्कि वह आरम्भ से ही थी। वह आत्मिक थी, जैसे हमारे यीशु भी आत्मिक थे; पर वह अन्तिम दिनों में प्रकट हुई, ताकि वह[a] हमारा उद्धार करे।


    अब आत्मिक कलीसिया मसीह की देह में प्रकट हुई। इससे हमें यह दिखाया गया कि यदि हममें से कोई उसे अपनी देह में सुरक्षित रखे और उसे अशुद्ध न करे, तो वह उसे पवित्र आत्मा में फिर प्राप्त करेगा। क्योंकि यह देह आत्मा का प्रतिरूप और उसकी प्रति है। इसलिए जिसने प्रति को अशुद्ध किया है, उसे मूल अपने भाग के रूप में नहीं मिलेगा। अतः भाइयो और बहनो, इसका अर्थ यह है: “देह को सुरक्षित रखो, ताकि तुम आत्मा के सहभागी बनो।”


    पर यदि हम कहते हैं कि देह कलीसिया है और आत्मा मसीह है, तो जिसने देह के साथ दुराचार किया है, उसने कलीसिया के साथ दुराचार किया है। इसलिए ऐसा व्यक्ति उस आत्मा का सहभागी नहीं होगा, जो मसीह है।


    यदि पवित्र आत्मा इस देह से जुड़ जाए, तो यह देह कितना उत्तम जीवन और कैसी अमरता अपने भाग के रूप में पा सकती है! जो बातें प्रभु ने अपने चुने हुओं के लिए तैयार की हैं, उन्हें कोई व्यक्त या बयान नहीं कर सकता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “वह” का संकेत सम्भवतः कलीसिया की ओर है; वाक्य-संरचना के अनुसार यीशु की ओर संकेत भी सम्भव समझा जा सकता है। यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: सर्वनाम के कर्ता की वास्तविक अस्पष्टता को पाठ में किसी एक दिशा में चुपचाप हल करने से बचाना।
lexical_decisions:
- source_word: ἐκκλησία (church)
  choice: कलीसिया
  rationale: आरम्भिक मसीही समुदाय और स्त्रीलिंग रूपक—विशेषकर कलीसिया को नारी तथा मसीह की देह कहने—को स्पष्ट रखने के लिए प्रचलित हिन्दी मसीही शब्द चुना गया।
- source_word: πνευματική / πνεῦμα (spiritual / spirit)
  choice: आत्मिक / आत्मा
  rationale: पाठ में आत्मिक कलीसिया, आत्मा के मूल स्वरूप और पवित्र आत्मा के बीच जानबूझकर निकटता है; एक ही शब्द-परिवार से यह संबंध सुरक्षित रहता है।
- source_word: σάρξ (flesh)
  choice: देह
  rationale: आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा यहाँ शारीरिक अस्तित्व और कलीसिया के देहगत रूपक दोनों को वहन करता है।
- source_word: ἀντίτυπος / ἀντίγραφον (counterpart / copy)
  choice: प्रतिरूप और उसकी प्रति
  rationale: देह और आत्मा के बीच प्रतिलिपि–मूल के तर्क को स्पष्ट रखता है, बिना उनके संबंध को दार्शनिक रूप से अधिक निश्चित किए।
- source_word: μετέχειν (partake)
  choice: सहभागी होना
  rationale: किसी वस्तु या सत्ता में भाग पाने के धार्मिक और सहभागितामूलक अर्थ को सुरक्षित रखता है।
- source_word: ἀσελγῶς χρῆσθαι / wantonly treat
  choice: दुराचार करना
  rationale: देह को नैतिक अथवा यौन रूप से अपवित्र करने का कठोर आशय रखता है, पर अस्पष्टता को किसी एक विशिष्ट पाप तक सीमित नहीं करता।
theological_decisions:
- issue: सृष्टि से पहले अस्तित्व रखने वाली ‘प्रथम कलीसिया’
  choice: पाठ के पूर्व-अस्तित्व संबंधी कथन को यथावत रखा गया
  alternative: इसे केवल परमेश्वर की पूर्वयोजना या चुनाव के रूप में व्याख्यायित करना
  rationale: पाठ स्वयं कलीसिया को सूर्य और चन्द्रमा से पहले सृजा गया तथा आरम्भ से विद्यमान बताता है; अनुवाद को इस तनाव को समझाकर समाप्त नहीं करना चाहिए।
- issue: नर को मसीह और नारी को कलीसिया कहना
  choice: रूपक को सीधे और बिना विस्तार के रखा गया
  alternative: इसे आदम–हव्वा, विवाह या किसी विशिष्ट कलीसियाई सिद्धान्त से स्पष्ट करना
  rationale: लेखक का कथन अनोखा और संक्षिप्त है; अतिरिक्त व्याख्या किसी सम्प्रदायगत अर्थ को आरोपित कर सकती है।
- issue: कलीसिया का मसीह की देह में प्रकट होना
  choice: ‘मसीह की देह में प्रकट हुई’
  alternative: ‘मसीह के शरीरधारण के द्वारा प्रकट हुई’
  rationale: वैकल्पिक रूप व्याख्यात्मक रूप से अधिक निश्चित है; चुना गया रूप मूल रूपक और उसकी संभावित अस्पष्टता को बनाए रखता है।
- issue: ‘वह हमारा उद्धार करे’ में कर्ता
  choice: स्त्रीलिंग ‘वह’ रखा और पादटिप्पणी दी
  alternative: ‘यीशु हमारा उद्धार करें’
  rationale: निकटवर्ती कर्ता कलीसिया है, पर अर्थगत रूप से यीशु भी सम्भव हैं; स्रोत-समीक्षा लंबित होने के कारण अनिश्चितता चिह्नित की गई।
- issue: पवित्र आत्मा का देह से जुड़ना
  choice: ‘जुड़ जाए’
  alternative: ‘एक हो जाए’ या ‘निवास करे’
  rationale: ‘एक होना’ या ‘निवास करना’ अधिक विशिष्ट धर्मवैज्ञानिक संबंध सुझाते; ‘जुड़ना’ उपलब्ध साक्ष्य के निकट और कम व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘भाइयो और बहनो’ समावेशी संबोधन है; ‘कलीसिया’, ‘पवित्रशास्त्र’, ‘उद्धार’ और ‘सहभागी’ जैसे परिचित मसीही शब्द रखे गए हैं। उपलब्ध आधार मुख्यतः सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है और यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है; इसलिए असामान्य रूपकों और धर्मवैज्ञानिक तनावों को सरल बनाकर नहीं हटाया गया।
