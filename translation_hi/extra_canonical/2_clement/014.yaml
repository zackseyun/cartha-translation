    rationale: हिन्दी में ‘हुई...करे’ स्त्रीलिंग कलीसिया को निश्चित कर्ता बनाता है, जबकि उपलब्ध अंग्रेज़ी साक्षियों में कर्ता-निर्देशन असंगत है और प्रत्यक्ष यूनानी समीक्षा लंबित है। लिंग-निरपेक्ष ‘वह ... करे’ तथा पादटिप्पणी अस्पष्टता बचाते हैं।
  - severity: low
