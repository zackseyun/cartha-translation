  source_fidelity: प्रारूप मूल साक्षी के प्रमुख रूपकों और तर्क-क्रम को प्रायः सुरक्षित रखता है। फिर भी ‘हम उस वचन के अनुसार ठहरेंगे’ में ‘उस शास्त्र-वचन के होंगे’ वाली जानबूझकर असामान्य अभिव्यक्ति का रूपकात्मक संबंध धुंधला हो गया था। ‘ताकि वह हमारा उद्धार करे’ में कर्ता की स्रोत-साक्षी में बनी रहने वाली अस्पष्टता को हिन्दी में लिंग-निरपेक्ष क्रिया के साथ सुरक्षित किया गया है।
  naturalness: ‘सृजा गया था’, ‘जीवन की कलीसिया के होना चुनें’, और ‘देह के साथ दुराचार’ जैसे कुछ प्रयोग कम स्वाभाविक या अनावश्यक रूप से संकीर्ण थे। संशोधन आधुनिक, गरिमापूर्ण हिन्दी में अधिक सहज वाक्य-विन्यास देता है, जबकि मूल के असामान्य तर्क और रूपक बने रहते हैं।
  terminology: ‘कलीसिया’, ‘आत्मिक’, ‘देह’, ‘पवित्र आत्मा’, और ‘उद्धार’ उपयुक्त और सुसंगत हैं। ‘उच्छृंखल व्यवहार’ ‘wantonly’ के व्यापक नैतिक आशय को ‘दुराचार’ से बेहतर सुरक्षित करता है, जो हिन्दी में अपेक्षाकृत विशिष्ट यौन अर्थ ले सकता है।
  issues:
  - severity: medium
    issue: ‘उस वचन के अनुसार ठहरेंगे’
    rationale: अंग्रेज़ी साक्षी का विचित्र ‘we shall be of the scripture’ पाठ के भीतर शास्त्र-वचन के अधीन/उसके अनुसार होने का संबंध व्यक्त करता है; केवल ‘के अनुसार ठहरना’ उस संबंध को पर्याप्त रूप से नहीं रखता।
  - severity: medium
