base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/020.yaml
  text: 'Do not let this trouble your minds either: that we see the unrighteous possessing wealth while the servants of God suffer hardship.


    Therefore, let us have faith, brothers and sisters. We are being trained by this present life so that we may be crowned in the life to come.


    No righteous person has quickly reaped the fruit but waits for it.


    For if God had quickly given the righteous their reward, we would immediately have been training ourselves in commerce rather than godliness. We would appear to be righteous, though we were pursuing not what is godly but what is profitable. For this reason, divine judgment overtakes a spirit that is not just and weighs it down with chains.


    To the only invisible God, the Father of truth, who sent to us the Savior and Prince of immortality, through whom he also revealed to us the truth and the heavenly life—to him be the glory forever and ever. Amen.'
translation:
  language: hi
  text: 'यह बात भी तुम्हारे मन को व्याकुल न करे कि हम अधर्मियों को धन-संपत्ति से भरपूर और परमेश्वर के सेवकों को तंगी सहते देखते हैं।


    इसलिए, हे भाई-बहनो, हम विश्वास बनाए रखें। इस वर्तमान जीवन में हमें प्रशिक्षित किया जा रहा है, ताकि आने वाले जीवन में हमें मुकुट मिले।


    किसी धर्मी व्यक्ति ने तुरंत फल नहीं पाया; वह उसकी प्रतीक्षा करता है।


    क्योंकि यदि परमेश्वर धर्मियों को शीघ्र ही प्रतिफल दे देता, तो हम भक्ति का नहीं, बल्कि व्यापार का अभ्यास कर रहे होते। हम धर्मी दिखाई तो देते, पर हमारा लक्ष्य वह नहीं होता जो भक्तिपूर्ण है, बल्कि वह होता जिसमें लाभ है। इसी कारण परमेश्वर का न्याय उस आत्मा को आ पकड़ता है जो न्यायपूर्ण नहीं है और उसे जंजीरों से जकड़ देता है।


    एकमात्र अदृश्य परमेश्वर, सत्य के पिता, ने हमारे पास उद्धारकर्ता और अमरता के अधिपति को भेजा। उसी के द्वारा उसने हम पर सत्य और स्वर्गीय जीवन भी प्रकट किया। उसी की महिमा युगानुयुग होती रहे। आमीन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: straitened
  choice: तंगी सहते
  rationale: यह आर्थिक अभाव और कठिन परिस्थिति—दोनों का सहज आधुनिक हिन्दी में संकेत देता है।
- source_word: trained
  choice: प्रशिक्षित किया जा रहा है
  rationale: वर्तमान जीवन को भावी मुकुट के लिए अनुशासन और तैयारी के रूप में प्रस्तुत करने वाला रूपक सुरक्षित रहता है।
- source_word: commerce
  choice: व्यापार
  rationale: मूल साक्ष्य में निहित लाभ-केंद्रित लेन-देन का रूपक बनाए रखा गया है; इसे केवल सामान्य स्वार्थ में नहीं बदला गया।
- source_word: godliness
  choice: भक्ति
  rationale: परमेश्वर के प्रति समर्पित और श्रद्धापूर्ण जीवन का स्वाभाविक, संक्षिप्त हिन्दी रूप।
- source_word: Prince of immortality
  choice: अमरता के अधिपति
  rationale: सम्मानसूचक पदवी और अमरता पर अधिकार/नेतृत्व का भाव सुरक्षित है; आधुनिक हिन्दी में 'राजकुमार' से उत्पन्न भ्रामक पारिवारिक अर्थ से बचा गया है।
theological_decisions:
- issue: वर्तमान कष्ट और भावी प्रतिफल का संबंध
  choice: वर्तमान जीवन में प्रशिक्षण और आने वाले जीवन में मुकुट की भाषा को ज्यों का त्यों तनाव सहित रखा गया
  alternative: कष्ट को सीधे दंड या उद्धार कमाने का साधन बताना
  rationale: पाठ तैयारी और प्रतिफल की बात करता है, पर कष्ट के कारण या उद्धार की विस्तृत प्रणाली निर्धारित नहीं करता।
- issue: न्याय द्वारा अन्यायी आत्मा को जकड़ना
  choice: परमेश्वर का न्याय उस आत्मा को आ पकड़ता है और जंजीरों से जकड़ता है
  alternative: इसे केवल मनोवैज्ञानिक अपराधबोध या स्पष्ट अंतिम नरक-दंड के रूप में समझाना
  rationale: न्याय और बंधन की प्रबल रूपकात्मक भाषा सुरक्षित रखी गई है, बिना उसके समय या स्वरूप को अतिरिक्त रूप से तय किए।
- issue: उद्धारकर्ता के द्वारा सत्य और स्वर्गीय जीवन का प्रकाशन
  choice: मध्यस्थता-सूचक 'उसी के द्वारा' रखा गया
  alternative: उद्धारकर्ता को केवल संदेशवाहक कहना या परमेश्वर के साथ उसकी सत्ता-संबंधी पहचान निश्चित करना
  rationale: पाठ उसके माध्यम से प्रकाशन की पुष्टि करता है, पर यहाँ उसके स्वरूप पर आगे की सैद्धांतिक व्याख्या नहीं करता।
