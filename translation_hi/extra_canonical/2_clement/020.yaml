review_pass:
  verdict: revise
  source_fidelity: The draft substantially follows the supplied English witness and preserves its exhortation, delayed recompense, commercial metaphor, judicial chains, and doxology. A few expressions can more exactly retain the source’s metaphors and syntax, especially ‘reaped fruit,’ ‘godliness,’ and revelation ‘to us.’ Direct Greek review remains pending, as stated in the source context.
  naturalness: The Hindi is generally clear and dignified. However, ‘हम पर सत्य ... प्रकट किया’ is not idiomatic in this context, and ‘वह नहीं होता जो भक्तिपूर्ण है’ is stilted. The revised wording is smoother modern standard Hindi while retaining a formal homiletic register.
  terminology: ‘अमरता के अधिपति’ is a sound rendering of ‘Prince of immortality.’ ‘परमेश्वर-भक्ति’ better represents ‘godliness’ than bare ‘भक्ति’ in the contrast with commerce. ‘धर्मी’ and ‘प्रतिफल’ are retained as appropriate register-consistent terms.
  issues:
  - severity: medium
    issue: Revelation clause is awkward and may misstate its direction
    rationale: ‘उसी के द्वारा उसने हम पर सत्य और स्वर्गीय जीवन भी प्रकट किया’ is non-idiomatic; the witness says that God made truth and heavenly life known ‘to us.’ ‘हमारे लिए ... प्रकट किया’ expresses this naturally without adding interpretation.
  - severity: medium
    issue: Godliness/profit contrast is rendered unnaturally
    rationale: ‘वह नहीं होता जो भक्तिपूर्ण है’ is not natural Hindi and makes the object of pursuit vague. ‘जो परमेश्वर-भक्ति से संबंधित है ... जो लाभदायक है’ retains the contrast of godly versus gainful pursuits.
  - severity: low
    issue: Agricultural metaphor is weakened
    rationale: ‘फल नहीं पाया’ can be understood generally as receiving a result, whereas ‘reaped fruit’ uses harvest imagery. ‘फल नहीं काटता’ preserves that imagery while keeping the intended point of patient waiting.
