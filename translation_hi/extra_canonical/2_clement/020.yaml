  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक उपदेशात्मक शैली रखी गई है। 'तुम्हारे' और 'हम' मूल के सामूहिक संबोधन को दर्शाते हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी स्रोत-समीक्षा अभी लंबित होने के कारण सूक्ष्म शब्दार्थों पर यह मसौदा अनंतिम है।
