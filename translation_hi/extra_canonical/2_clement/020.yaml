source:
  text: 'Neither suffer ye this again to trouble your mind, that we see the unrighteous possessing wealth, and the servants of God straitened.


    Let us then have faith, brothers and sisters. We are trained by the present life, that we may be crowned with the future.


    No righteous man hath reaped fruit quickly but waiteth for it.


    For if God had paid the recompense of the righteous speedily, then straightway we should have been training ourselves in merchandise, and not in godliness; for we should seem to be righteous, though we were pursuing not that which is godly, but which is gainful. And for this cause Divine judgment overtaketh a spirit that is not just, and loadeth it with chains.


    To the only God invisible, the Father of truth, who sent forth unto us the Savior and Prince of immortality, through whom also He made manifest unto us the truth and the heavenly life, to Him be the glory for ever and ever. Amen.'
