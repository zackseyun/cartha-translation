base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/003.yaml
  text: 'Seeing, then, that he showed us such great mercy—first of all, that we who are alive do not sacrifice to these dead gods or worship them, but through him have come to know the Father of truth—what else is this knowledge toward him except not denying him through whom we have known him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    This, then, is our reward, if we truly confess him through whom we were saved.


    But how do we confess him? By doing what he says, not disobeying his commandments, and honoring him not only with our lips but with our whole heart and our whole mind.


    Now he also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
translation:
  language: hi
  text: 'इसलिए, जब उसने हम पर इतनी बड़ी दया की है—सबसे पहले यह कि हम, जो जीवित हैं, इन मरे हुए देवताओं को न तो बलि चढ़ाते हैं और न उनकी उपासना करते हैं, बल्कि उसी के द्वारा सत्य के पिता को जान पाए हैं—तो उसके प्रति इस ज्ञान का अर्थ इसके सिवा और क्या है कि हम उसका इनकार न करें, जिसके द्वारा हमने उसे जाना है?


    हाँ, वह स्वयं कहता है, “जो कोई मुझे स्वीकार करेगा, उसे मैं पिता के सामने स्वीकार करूँगा।”[a]


    इसलिए हमारा प्रतिफल यही है, यदि हम सचमुच उसे स्वीकार करें, जिसके द्वारा हमारा उद्धार हुआ।


    पर हम उसे कैसे स्वीकार करते हैं? जब हम उसकी कही हुई बातों पर चलते हैं, उसकी आज्ञाओं की अवहेलना नहीं करते, और केवल अपने होंठों से नहीं, बल्कि अपने पूरे हृदय और अपनी पूरी बुद्धि से उसका आदर करते हैं।


    अब वह यशायाह में भी कहता है, “ये लोग अपने होंठों से मेरा आदर करते हैं, पर उनका हृदय मुझसे बहुत दूर है।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'तुलना करें: मत्ती 10:32; लूका 12:8। उद्धरण का शब्द-विन्यास उपलब्ध सुसमाचार-पाठों से कुछ भिन्न है।'
    reason: यीशु-वचन के संभावित लिखित या प्रचलित मौखिक स्रोत की पहचान में सावधानी और पाठगत भिन्नता दिखाना।
  - marker: b
    text: यशायाह 29:13 से तुलना करें; यही कथन मत्ती 15:8 और मरकुस 7:6 में भी उद्धृत है।
    reason: प्रत्यक्ष रूप से नामित शास्त्रीय संदर्भ बताना और संबंधित सुसमाचार-परंपरा की जानकारी देना।
lexical_decisions:
- source_word: confesseth / confess
  choice: स्वीकार करना
  rationale: संदर्भ में इसका अर्थ केवल मौखिक अंगीकार नहीं, बल्कि सार्वजनिक निष्ठा और कर्मों द्वारा मान्यता देना भी है; ‘स्वीकार करना’ आधुनिक हिन्दी में दोनों आयामों को स्वाभाविक रूप से समेटता है।
- source_word: Father of truth
  choice: सत्य का पिता
  rationale: मूल अभिव्यक्ति की संभावित अर्थगत व्यापकता को बनाए रखने के लिए औपचारिक संरचना रखी गई; इसे व्याख्यात्मक रूप से ‘सच्चा पिता’ नहीं बनाया गया।
- source_word: reward
  choice: प्रतिफल
  rationale: दिग्निफ़ाइड धार्मिक गद्य में स्वाभाविक है और भविष्य में मिलने वाले प्रत्युत्तर या फल का अर्थ बनाए रखता है।
- source_word: mind
  choice: बुद्धि
  rationale: ‘हृदय’ के साथ मानसिक-विवेकपूर्ण समर्पण का भेद स्पष्ट करता है; ‘मन’ रखने पर दोनों पद हिन्दी में अत्यधिक निकट सुनाई दे सकते थे।
- source_word: dead gods
  choice: मरे हुए देवता
  rationale: लेखक के जीवित विश्वासियों और निर्जीव देवताओं के बीच जानबूझकर रखे गए तीखे विरोध को सुरक्षित रखा गया।
theological_decisions:
- issue: ‘उसे/उसका’ सर्वनाम का संदर्भ
  choice: अस्पष्टता को मुख्य पाठ में बनाए रखा गया
  alternative: हर स्थान पर ‘मसीह’ अथवा ‘पिता’ स्पष्ट रूप से जोड़ना
  rationale: प्राप्त साक्ष्य में सर्वनामों का क्रम कुछ स्थानों पर पिता और मध्यस्थ के बीच अर्थगत तनाव रखता है; नाम जोड़ना अनावश्यक व्याख्यात्मक निर्णय होता।
- issue: स्वीकार करने और उद्धार/प्रतिफल का संबंध
  choice: शर्तसूचक ‘यदि’ को यथावत रखा गया
  alternative: इसे केवल उद्धार के प्रमाण या कारण के रूप में व्याख्यायित करना
  rationale: पाठ स्वयं प्रतिफल और स्वीकारोक्ति के संबंध को स्पष्ट करता है, पर उसके व्यवस्थित धर्मशास्त्रीय स्वरूप को नहीं; अतः तनाव को नहीं सुलझाया गया।
- issue: आज्ञापालन द्वारा स्वीकार करना
  choice: कर्म, आज्ञापालन और पूरे व्यक्तित्व से आदर को स्वीकारोक्ति की व्याख्या के रूप में रखा गया
  alternative: स्वीकारोक्ति को केवल मौखिक विश्वास-घोषणा मानना
  rationale: अगला वाक्य लेखक के आशय को स्पष्टतः नैतिक आज्ञापालन और आंतरिक निष्ठा तक विस्तृत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य अपनाया गया है। लंबे आरंभिक वाक्य की तर्क-रचना सुरक्षित रखते हुए विराम-चिह्नों से पठनीयता बढ़ाई गई है। चूँकि प्रत्यक्ष यूनानी समीक्षा लंबित है और उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है, अनिश्चित संदर्भों को व्याख्यात्मक विस्तार से नहीं भरा गया।
