base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/002.yaml
  text: '“Rejoice, you barren woman who never gave birth. Break out and cry aloud, you who were never in labor, for the children of the desolate woman are more numerous than the children of the woman who has a husband.” When he said, “Rejoice, you barren woman who never gave birth,” he was speaking about us, for our church was barren before children were given to her.


    And when he said, “Cry aloud, you who were never in labor,” he meant this: Let us not grow weary, like women in labor, of offering our prayers to God with simplicity.


    Again, when he said, “For the children of the desolate woman are more numerous than those of the woman who has a husband,” he spoke this way because our people seemed desolate and abandoned by God. But now, having believed, we have become more numerous than those who seemed to have God.


    Again, another Scripture says, “I did not come to call the righteous, but sinners.”


    He means this: It is right to save those who are perishing.


    For this truly is a great and marvelous work: to establish not the things that are standing, but the things that are falling.


    So Christ also desired to save the things that were perishing. And he saved many, coming and calling us when we were already perishing.'
translation:
  language: hi
  text: '“हे बाँझ स्त्री, जिसने जन्म नहीं दिया, आनन्द मना! हे प्रसव-पीड़ा न सहनेवाली, फूट पड़ और ऊँचे स्वर से पुकार! क्योंकि उजड़ी हुई स्त्री की सन्तानें पति वाली स्त्री की सन्तानों से अधिक हैं।”[a] जब उसने कहा, “हे बाँझ स्त्री, जिसने जन्म नहीं दिया, आनन्द मना!” तो वह हमारे विषय में कह रहा था; क्योंकि हमारी कलीसिया बाँझ थी, इससे पहले कि उसे सन्तानें दी गईं।


    और जब उसने कहा, “हे प्रसव-पीड़ा न सहनेवाली, ऊँचे स्वर से पुकार!” तो उसका अर्थ यह है: हम अपनी प्रार्थनाएँ निष्कपट भाव से परमेश्वर के सामने चढ़ाने में प्रसव-पीड़ा सहती स्त्रियों के समान थक न जाएँ।


    फिर, जब उसने कहा, “क्योंकि उजड़ी हुई स्त्री की सन्तानें पति वाली स्त्री की सन्तानों से अधिक हैं,” तो उसने ऐसा इसलिए कहा कि हमारे लोग उजड़े हुए और परमेश्वर से त्यागे हुए प्रतीत होते थे। पर अब विश्वास करने के बाद हम उन लोगों से अधिक हो गए हैं जो परमेश्वर को अपना मानते प्रतीत होते थे।


    फिर एक और पवित्रशास्त्र कहता है, “मैं धर्मियों को नहीं, बल्कि पापियों को बुलाने आया हूँ।”[b]


    उसका अर्थ यह है: जो नाश हो रहे हैं, उन्हें बचाना उचित है।


    क्योंकि सचमुच महान और अद्भुत कार्य यह है कि जो खड़े हैं उन्हें नहीं, बल्कि जो गिर रहे हैं उन्हें स्थिर किया जाए।


    इसी प्रकार मसीह ने भी नाश हो रहे लोगों को बचाना चाहा। और जब हम नाश हो ही रहे थे, तब उसने आकर हमें बुलाया और बहुतों को बचाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यशायाह 54:1 का उद्धरण; यूनानी रूप सेप्टुआजिन्ट की भाषा के निकट है।
    reason: पुराने नियम के उद्धरण की पहचान और उसकी पाठ-परम्परा बताना।
  - marker: b
    text: यह कथन मत्ती 9:13, मरकुस 2:17 और लूका 5:32 में समान रूपों में मिलता है। यहाँ लेखक संक्षिप्त रूप देता है और ‘मन फिराने के लिए’ नहीं जोड़ता।
    reason: सुसमाचार-परम्परा से सम्बन्ध दिखाते हुए इस पाठ के संक्षिप्त रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: στεῖρα
  choice: बाँझ स्त्री
  rationale: सन्तान उत्पन्न न कर सकनेवाली स्त्री का रूपक स्पष्ट रखता है और कलीसिया पर लेखक के अनुप्रयोग से मेल खाता है।
- source_word: ἐκκλησία
  choice: कलीसिया
  rationale: आरम्भिक मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में परिचित शब्द; यहाँ संस्था से अधिक समुदाय का बोध है।
- source_word: ἁπλῶς
  choice: निष्कपट भाव से
  rationale: सादगी, निष्कपटता और बिना दोहरे मन के प्रार्थना करने का भाव देता है; केवल रीति की सरलता तक अर्थ सीमित नहीं करता।
- source_word: ἔρημος
  choice: उजड़ी हुई
  rationale: उद्धरण में परित्यक्त और निर्जन स्त्री की छवि बनाए रखता है; आगे समुदाय पर लागू होने पर भी अर्थ स्वाभाविक रहता है।
- source_word: ἀπολλυμένους
  choice: जो नाश हो रहे हैं
  rationale: वर्तमान कृदन्त की जारी प्रक्रिया को सुरक्षित रखता है; ‘खोए हुए’ की अपेक्षा विनाश के संकट को अधिक सीधे व्यक्त करता है।
- source_word: στηρίζειν
  choice: स्थिर किया जाए
  rationale: गिरती हुई वस्तुओं को थामने, दृढ़ करने और स्थापित करने का अर्थ समेटता है।
theological_decisions:
- issue: ‘हम उन लोगों से अधिक हो गए हैं’ का आशय
  choice: संख्या या विस्तार की सम्भावना खुली रखते हुए ‘अधिक हो गए हैं’
  alternative: ‘हमारी संख्या अधिक हो गई है’
  rationale: तुलनात्मक अभिव्यक्ति में संख्या प्रमुख हो सकती है, पर मूल कथन को केवल गणना तक सीमित करना आवश्यक नहीं; इसलिए संक्षिप्त अस्पष्टता सुरक्षित रखी गई है।
- issue: ‘जो परमेश्वर को रखते/पाते प्रतीत होते थे’
  choice: जो परमेश्वर को अपना मानते प्रतीत होते थे
  alternative: जिनके पास परमेश्वर था, ऐसा प्रतीत होता था
  rationale: शाब्दिक स्वामित्व की अस्वाभाविक हिन्दी से बचते हुए धार्मिक दावे या सम्बन्ध का भाव रखा गया है; ‘प्रतीत होते थे’ लेखक की विडम्बनापूर्ण दूरी को बनाए रखता है।
- issue: पापियों को बुलाने का उद्देश्य
  choice: उद्धरण और लेखक की व्याख्या को अलग-अलग रखा
  alternative: उद्धरण में ‘मन फिराने के लिए’ जोड़ना
  rationale: प्राप्त पाठ में अतिरिक्त उद्देश्य-वाक्यांश नहीं है; किसी सुसमाचार-पाठान्तर को आयात नहीं किया गया।
- issue: मसीह की इच्छा और उद्धार
  choice: ‘बचाना चाहा’
  alternative: ‘बचाने की इच्छा की’
  rationale: मसीह की इच्छा और उसके फलस्वरूप बहुतों के बचाए जाने—दोनों कथनों को स्पष्ट, पर बिना अतिरिक्त सिद्धान्तगत व्याख्या के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। भविष्यद्वाणी के काव्यात्मक आह्वान में विस्मयादिबोधक लय रखी गई, जबकि लेखक की व्याख्या सरल गद्य में है। ‘कलीसिया’, ‘धर्मी’, ‘पापी’ और ‘मसीह’ जैसे परिचित बाइबलीय पद बनाए गए हैं। उपलब्ध अनुरोध में यूनानी मूल-पाठ पूर्णतः उद्धृत नहीं था और स्रोत-भाषा समीक्षा लंबित बताई गई थी; अतः मसौदा दिए गए प्राचीन अंग्रेज़ी साक्ष्य, अंग्रेज़ी परामर्श-पाठ और ज्ञात यूनानी पाठ-रूप के अनुरूप सावधानी से तैयार किया गया है।
