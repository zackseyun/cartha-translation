base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
translation:
  language: hi
  text: 'इसलिए, भाइयो और बहनो, हम अभी मन फिराएँ। जो भला है उसके विषय में सचेत रहें, क्योंकि हम बहुत मूर्खता और दुष्टता से भरे हैं। हम अपने पिछले पापों को मिटा दें और लोगों को प्रसन्न करनेवाले न पाए जाएँ। हम केवल एक-दूसरे को ही प्रसन्न करने की इच्छा न रखें, बल्कि अपने धर्ममय आचरण से बाहरवालों को भी, ताकि हमारे कारण उस नाम की निन्दा न हो।


    क्योंकि प्रभु कहते हैं, “अन्यजातियों के बीच हर प्रकार से मेरे नाम की निन्दा होती है”; और फिर, “हाय उस मनुष्य पर, जिसके कारण मेरे नाम की निन्दा होती है।” उसकी निन्दा किस बात में होती है? इस बात में कि तुम वे काम नहीं करते जिन्हें मैं चाहता हूँ।


    क्योंकि जब अन्यजाति लोग हमारे मुँह से परमेश्वर के वचन सुनते हैं, तो उनकी सुन्दरता और महानता पर चकित होते हैं। फिर जब उन्हें पता चलता है कि हमारे काम हमारे कहे हुए वचनों के योग्य नहीं हैं, तो वे तुरन्त निन्दा करने लगते हैं और कहते हैं कि यह एक खोखली कहानी और छलावा है।


    क्योंकि जब वे हमसे सुनते हैं कि परमेश्वर कहते हैं, “यदि तुम अपने प्रेम रखनेवालों से प्रेम करते हो, तो इसमें तुम्हारी कोई प्रशंसा नहीं; पर यदि तुम अपने शत्रुओं और तुमसे घृणा करनेवालों से प्रेम करते हो, तो इसमें तुम्हारी प्रशंसा है,” तो ये बातें सुनकर वे उनकी असाधारण भलाई पर चकित होते हैं। पर जब वे देखते हैं कि हम न केवल हमसे प्रेम नहीं करते[a], तो वे हमारा उपहास करते हैं, और उस नाम की निन्दा होती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ उपलब्ध पाठ अपूर्ण या दूषित प्रतीत होता है: “हम न केवल हमसे प्रेम नहीं करते।” सम्भवतः कुछ शब्द लुप्त हैं, पर पर्याप्त स्रोत-साक्ष्य के बिना उन्हें मुख्य पाठ में पूरा नहीं किया गया है।'
    reason: प्रेषित स्रोत और अंग्रेज़ी साक्षी दोनों अंतिम तुलना को व्याकरणिक रूप से अधूरा रखते हैं; वास्तविक अनिश्चितता बताना आवश्यक है।
lexical_decisions:
- source_word: brethren
  choice: भाइयो और बहनो
  rationale: समुदाय को संबोधित करनेवाले व्यापक आशय को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: be sober unto that which is good
  choice: जो भला है उसके विषय में सचेत रहें
  rationale: यहाँ शारीरिक मद्यत्याग से अधिक नैतिक सजगता का भाव है; ‘सचेत’ उसे स्पष्ट और गरिमापूर्ण ढंग से देता है।
- source_word: men pleasers
  choice: लोगों को प्रसन्न करनेवाले
  rationale: शाब्दिक भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: those men that are without
  choice: बाहरवालों
  rationale: समुदाय से बाहर के लोगों के लिए प्राचीन सामुदायिक पद का संक्षिप्त और बोधगम्य रूप।
- source_word: righteousness
  choice: धर्ममय आचरण
  rationale: संदर्भ में दिखाई देनेवाले नैतिक व्यवहार पर बल है; केवल अमूर्त ‘धार्मिकता’ से अधिक स्पष्ट।
- source_word: the Name
  choice: उस नाम
  rationale: ईश्वर के पवित्र नाम के प्रति संकेत और मूल की संक्षिप्त श्रद्धामय अभिव्यक्ति सुरक्षित रहती है।
- source_word: oracles of God
  choice: परमेश्वर के वचन
  rationale: ‘दैवी उक्तियाँ’ की अपेक्षा साधारण पाठक के लिए स्वाभाविक, जबकि ईश्वरीय अधिकार का भाव बना रहता है।
- source_word: thank / credit
  choice: प्रशंसा
  rationale: नैतिक सराहना या मान्यता के संदर्भ को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: Gentiles
  choice: अन्यजाति लोग
  rationale: यह यहूदी-ईसाई प्राचीन संदर्भ में समुदाय से बाहर की जातियों का पारंपरिक किंतु समझने योग्य पद है।
theological_decisions:
- issue: ‘उस नाम’ का आशय
  choice: मुख्य पाठ में केवल ‘उस नाम’ रखा गया
  alternative: ‘परमेश्वर के नाम’ के रूप में स्पष्ट करना
  rationale: स्रोत की श्रद्धामय और संकेतात्मक भाषा को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया।
- issue: दूसरे अनुच्छेद के कथनों का शास्त्रीय स्वरूप
  choice: उन्हें प्रभु के कथन के रूप में यथावत प्रस्तुत किया
  alternative: किसी विशिष्ट बाइबिल पद का औपचारिक उद्धरण मानकर मानकीकृत करना
  rationale: यह मिश्रित या पारंपरिक उद्धरण हो सकता है; किसी एक प्रामाणिक पद से जबरन समान नहीं किया गया।
- issue: अंतिम वाक्य का अपूर्ण/दूषित पाठ
  choice: असंगत संरचना को मुख्य पाठ में निकटता से सुरक्षित रखकर पादटिप्पणी दी
  alternative: अनुमान से ‘हम अपने शत्रुओं से प्रेम नहीं करते, बल्कि अपने प्रेम रखनेवालों से भी नहीं’ जैसे शब्द जोड़ना
  rationale: उपलब्ध साक्ष्य में पाठ अपूर्ण है; अनुमानित पुनर्स्थापन से धर्मवैचारिक या नैतिक अर्थ को चुपचाप बदलना उचित नहीं।
