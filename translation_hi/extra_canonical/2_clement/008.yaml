  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामूहिक उपदेशात्मक शैली रखी गई है। ‘भाइयो’ प्राचीन समुदाय-संबोधन को दर्शाता है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण सूक्ष्म शब्दार्थ संबंधी निष्कर्ष अस्थायी हैं।
