translation:
  language: hi
  text: 'जब तक हम पृथ्वी पर हैं, तब तक हम पश्चात्ताप करें, क्योंकि हम कारीगर के हाथों में मिट्टी हैं।


    जिस प्रकार कुम्हार कोई बरतन बनाते समय, यदि वह उसके हाथों में टेढ़ा हो जाए या दबकर बिगड़ जाए, तो उसे फिर से आकार देता है; पर यदि वह उसे एक बार आग की भट्ठी में रख दे, तो फिर उसे सुधार नहीं सकता—उसी प्रकार जब तक हम इस संसार में हैं, तब तक हम देह में किए हुए बुरे कामों के लिए पूरे मन से पश्चात्ताप करें, ताकि जब तक हमारे पास पश्चात्ताप करने का समय है, हम प्रभु के द्वारा उद्धार पाएँ।


    क्योंकि संसार से चले जाने के बाद हम वहाँ न तो अपने पापों को स्वीकार कर सकते हैं और न फिर पश्चात्ताप कर सकते हैं।


    इसलिए, भाइयो, यदि हम पिता की इच्छा पूरी करें, देह को शुद्ध रखें और प्रभु की आज्ञाओं का पालन करें, तो हम अनन्त जीवन पाएँगे।


    क्योंकि प्रभु सुसमाचार में कहते हैं, “यदि तुमने छोटी वस्तु की रक्षा नहीं की, तो तुम्हें बड़ी वस्तु कौन सौंपेगा? क्योंकि मैं तुमसे कहता हूँ, जो थोड़े में विश्वासयोग्य है, वह बहुत में भी विश्वासयोग्य है।”


    अतः उनका आशय यह है: “देह को शुद्ध और मुहर को निष्कलंक रखो[a], ताकि हम जीवन पाएँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मुहर” का आशय पाठ में स्पष्ट नहीं किया गया है; इसलिए इसे किसी एक विशेष धार्मिक विधि या शिक्षा के रूप में नहीं समझाया गया है।
    reason: मूल रूपक की वास्तविक अस्पष्टता बनाए रखने और मत-सापेक्ष व्याख्या से बचने के लिए।
lexical_decisions:
- source_word: clay under the craftsman's hand
  choice: कारीगर के हाथों में मिट्टी
  rationale: मानवीय अस्थिरता और अभी पुनः आकार दिए जा सकने की मूल उपमा को सहज हिन्दी में सुरक्षित रखा गया है; अगले वाक्य में कुम्हार इस बिंब को स्पष्ट करता है।
- source_word: repent / repentance
  choice: पश्चात्ताप करना / पश्चात्ताप
  rationale: मन-परिवर्तन तथा बुरे कर्मों से लौटने के धार्मिक और नैतिक अर्थ को व्यक्त करने वाला प्रचलित, गरिमापूर्ण शब्द।
- source_word: in the flesh
  choice: देह में
  rationale: पाठ की देह-संबंधी शब्दावली को बिना उसे केवल ‘जीवनकाल में’ या ‘पापी स्वभाव से’ अर्थ देने के सुरक्षित रखा गया है।
- source_word: make confession
  choice: अपने पापों को स्वीकार करना
  rationale: सिर्फ मौखिक कथन से अधिक स्पष्ट रूप से अपराध-स्वीकार का भाव देता है, पर किसी विशिष्ट संस्कारगत व्याख्या को आरोपित नहीं करता।
- source_word: seal
  choice: मुहर
  rationale: रूपक को उसके अस्पष्ट धार्मिक संकेतों सहित अक्षरशः बनाए रखा गया है; इसे बपतिस्मा, विश्वास या किसी अन्य विशेष मत से नहीं पहचाना गया।
theological_decisions:
- issue: पश्चात्ताप और उद्धार के समय की सीमा
  choice: पाठ के इस कथन को यथावत रखा गया कि संसार से जाने के बाद पाप-स्वीकार या पश्चात्ताप नहीं किया जा सकता
  alternative: इसे व्यापक परलोक-सिद्धान्त की व्याख्या से नरम या विस्तृत करना
  rationale: लेखक के स्पष्ट आग्रह और धार्मिक तनाव को बिना साम्प्रदायिक स्पष्टीकरण जोड़े सुरक्षित रखना आवश्यक है।
- issue: ‘देह को शुद्ध रखना’ का अर्थ
  choice: देह-संबंधी भाषा को प्रत्यक्ष रूप से बनाए रखा
  alternative: इसे केवल नैतिक जीवन, यौन शुद्धता या तपस्या के रूप में स्पष्ट करना
  rationale: संदर्भ इन संभावित अर्थों में से किसी एक को निर्णायक रूप से स्थापित नहीं करता।
- issue: ‘मुहर’ की पहचान
  choice: अस्पष्ट रूपक के रूप में संरक्षित
  alternative: मुहर को स्पष्टतः बपतिस्मा या उद्धार का चिह्न कहना
  rationale: उपलब्ध साक्ष्य के आधार पर किसी एक धार्मिक पहचान को आरोपित करना उचित नहीं है।
- issue: छोटी और बड़ी वस्तु संबंधी सुसमाचार-वचन
  choice: लेखक के उद्धृत रूप को अनुवादित किया गया
  alternative: इसे किसी प्रचलित आधुनिक बाइबल अनुवाद के समान बनाने के लिए बदलना
  rationale: यह कथन सुसमाचार परंपरा का उद्धरण/अनुरूपण है; 2 क्लेमेंट के अपने पाठ-रूप को सुरक्षित रखा गया है।
