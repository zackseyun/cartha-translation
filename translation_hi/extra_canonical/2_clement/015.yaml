- issue: परमेश्वर को प्रतिदान देना
  choice: ‘उसे हम यही प्रतिदान दे सकते हैं’
  alternative: ‘हम उसके प्रति यही कृतज्ञता दिखा सकते हैं’
  rationale: मूल साक्ष्य की प्रतिदान-वाली भाषा और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया।
- issue: वचनों के पालन से आनंद और अवज्ञा से दंड
  choice: आचरण और अवज्ञा के स्पष्ट समांतर को बनाए रखा
  alternative: इसे सामान्य प्रोत्साहन और परिणाम के रूप में नरम करना
  rationale: लेखक की नैतिक चेतावनी की तीव्रता को कम नहीं किया गया।
- issue: ‘before God’ बनाम साक्षी का दोषपूर्ण ‘as of God’
  choice: ‘परमेश्वर के सामने’
  alternative: ‘परमेश्वर की ओर से’
  rationale: वाक्य-संदर्भ में निर्भीकता से परमेश्वर के सामने खड़े होने का अर्थ अधिक सुसंगत है, पर प्रत्यक्ष यूनानी समीक्षा अभी लंबित है।
