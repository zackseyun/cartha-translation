theological_decisions:
- issue: सलाह माननेवाले द्वारा स्वयं और सलाहकार को ‘बचाना’
  choice: शाब्दिक तनाव बनाए रखते हुए ‘अपने आप को और मुझे भी…बचाएगा’
  alternative: ‘अपने और मेरे उद्धार में सहायक होगा’
