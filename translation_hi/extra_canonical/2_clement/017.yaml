base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/017.yaml
  text: 'Therefore, let us repent with our whole heart, so that none of us perishes along the way. For if we have received commands to make it our business to draw people away from idols and instruct them, how much more wrong is it for a soul that already knows God to perish!


    Therefore, let us help one another, so that we may also lead the weak upward toward what is good, so that we may all be saved. And let us convert and admonish one another.


    Let us not think that we need to pay attention and believe only now. When we have gone home, let us remember the commandments of the Lord and not allow ourselves to be dragged in the other direction by our worldly desires. Instead, let us come here more frequently and strive to advance in the commandments of the Lord, so that, all having the same mind, we may be gathered together into life.


    For the Lord said, “I come to gather together all the nations, tribes, and languages.” Here he speaks about the day of his appearing, when he will come and redeem us, each person according to his works.


    And the unbelievers will see his glory and his power, and they will be amazed when they see the kingdom of the world given to Jesus. They will say, “Woe to us, for you wast, and we did not know it or believe, and we did not obey the presbyters when they told us about our salvation.” And “Their worm will not die, and their fire will not be quenched, and they will be a spectacle to all flesh.”


    He speaks about that day of judgment, when people will see those among us who live ungodly lives and have dealt falsely with the commandments of Jesus Christ.


    But when the righteous—who have done good, endured torments, and hated the pleasures of the soul—see those who have done wrong and denied Jesus by their words or their deeds being punished with severe torments in unquenchable fire, they will give glory to God and say, “There will be hope for the one who has served God with his whole heart.”'
translation:
  language: hi
  text: 'इसलिए आओ, हम पूरे मन से मन फिराएँ, कहीं ऐसा न हो कि हममें से कोई मार्ग में नष्ट हो जाए। क्योंकि यदि हमें यह आज्ञा मिली है कि हम लोगों को मूर्तियों से दूर खींचने और उन्हें शिक्षा देने को अपना काम बनाएँ, तो यह कितनी अधिक अनुचित बात है कि वह प्राणी नष्ट हो जाए जो परमेश्वर को पहले से जानता है!


    इसलिए आओ, हम एक-दूसरे की सहायता करें, ताकि जो निर्बल हैं उन्हें भी भलाई की ओर ऊपर उठा सकें और हम सब उद्धार पाएँ। हम एक-दूसरे को फेर लाएँ और चेतावनी दें।


    हम यह न सोचें कि केवल अभी, जब हम यहाँ हैं, ध्यान देना और विश्वास करना आवश्यक है। घर लौटने पर भी हम प्रभु की आज्ञाएँ स्मरण रखें और अपनी सांसारिक अभिलाषाओं को स्वयं को दूसरी दिशा में घसीटने न दें। इसके बजाय, हम यहाँ अधिक बार आया करें और प्रभु की आज्ञाओं में आगे बढ़ने का प्रयत्न करें, ताकि हम सब एक मन होकर जीवन के लिए एकत्र किए जाएँ।[a]


    क्योंकि प्रभु ने कहा, “मैं सभी राष्ट्रों, कुलों और भाषाओं को एकत्र करने आता हूँ।”[b] यहाँ वह अपने प्रकट होने के दिन की बात करता है, जब वह आएगा और हममें से हर एक को उसके कामों के अनुसार छुड़ाएगा।[c]


    तब अविश्वासी उसकी महिमा और सामर्थ्य देखेंगे। जब वे संसार का राज्य यीशु को दिया हुआ देखेंगे, तो चकित होकर कहेंगे, “हाय हम पर! क्योंकि तू था, और हमने तुझे न जाना, न विश्वास किया; और जब प्राचीनों ने हमें हमारे उद्धार के विषय में बताया, तब हमने उनकी बात न मानी।” और “उनका कीड़ा नहीं मरेगा और उनकी आग नहीं बुझेगी, और वे सब प्राणियों के सामने एक दृश्य ठहरेंगे।”[d]


    वह न्याय के उस दिन की बात करता है, जब लोग हमारे बीच के उन लोगों को देखेंगे जो भक्तिहीन जीवन जीते हैं और यीशु मसीह की आज्ञाओं के प्रति कपटपूर्ण रहे हैं।


    परन्तु धर्मी—जिन्होंने भलाई की, यातनाएँ सहीं और प्राण के सुखों से घृणा की—जब उन लोगों को देखेंगे जिन्होंने बुराई की और अपने शब्दों या कामों से यीशु का इनकार किया, और जो न बुझने वाली आग में कठोर यातनाएँ पा रहे हैं, तब वे परमेश्वर की महिमा करेंगे और कहेंगे, “जो पूरे मन से परमेश्वर की सेवा करता है, उसके लिए आशा होगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहाँ” से आशय संभवतः विश्वासियों की सभा का स्थान है; उपलब्ध अंग्रेज़ी साक्षी का वाक्य-विन्यास कुछ अस्थिर है।
    reason: प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण स्थान-सूचक पद की व्याख्या को निश्चित नहीं किया गया।
  - marker: b
    text: 'यह कथन यशायाह 66:18 की भाषा से मिलता-जुलता है: सब राष्ट्रों और भाषाओं को एकत्र करना।'
    reason: पुराने नियम की संभावित प्रतिध्वनि पहचानने के लिए।
  - marker: c
    text: “हर एक को उसके कामों के अनुसार” का संबंध ‘छुड़ाएगा’ से भी समझा जा सकता है, या आने वाले न्याय से; उपलब्ध साक्षी दोनों के बीच तनाव छोड़ता है।
    reason: धर्मवैचारिक और व्याकरणिक अस्पष्टता को सुरक्षित रखने के लिए।
  - marker: d
    text: “उनका कीड़ा नहीं मरेगा…” यशायाह 66:24 की प्रतिध्वनि है। “सब प्राणियों” का शाब्दिक भाव “सब देह” है, अर्थात सब मनुष्य।
    reason: उद्धरण-स्रोत और सेमिटिक मुहावरे को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: repent
  choice: मन फिराएँ
  rationale: पश्चात्ताप के साथ जीवन की दिशा बदलने का भाव रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: soul
  choice: प्राणी
  rationale: पहले प्रसंग में व्यक्ति/जीव के नष्ट होने का अर्थ है; केवल शरीर से पृथक आत्मा का दार्शनिक अर्थ थोपने से बचता है।
- source_word: convert
  choice: फेर लाएँ
  rationale: परस्पर सुधार और परमेश्वर की ओर लौटाने का सक्रिय भाव सुरक्षित रखता है; आधुनिक सांप्रदायिक अर्थ वाले ‘धर्म-परिवर्तन’ से बचता है।
- source_word: presbyters
  choice: प्राचीनों
  rationale: आरंभिक कलीसियाई पद का अपेक्षाकृत औपचारिक और गैर-सांप्रदायिक प्रतिरूप; ‘बुज़ुर्गों’ की केवल आयु-संबंधी अस्पष्टता से बचता है।
- source_word: pleasures of the soul
  choice: प्राण के सुखों
  rationale: साक्षी की असामान्य अभिव्यक्ति को सरल करके मिटाया नहीं गया; इसके तपस्वी अथवा आंतरिक-अभिलाषात्मक अर्थ को खुला रखा गया है।
- source_word: all flesh
  choice: सब प्राणियों
  rationale: सेमिटिक मुहावरे को समझने योग्य हिन्दी देता है; आशय समस्त मानवता भी हो सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: works and redemption
  choice: हममें से हर एक को उसके कामों के अनुसार छुड़ाएगा
  alternative: आएगा, हमें छुड़ाएगा, और हर एक का उसके कामों के अनुसार न्याय करेगा
  rationale: उपलब्ध अंग्रेज़ी साक्षी में ‘redeem us, each man according to his works’ का व्याकरणिक/धर्मवैचारिक तनाव है। मुख्य पाठ ने उसी निकट संबंध को बनाए रखा है, पर पादटिप्पणी वैकल्पिक समझ दर्ज करती है।
- issue: mutual conversion
  choice: हम एक-दूसरे को फेर लाएँ
  alternative: हम एक-दूसरे का मन फिराएँ
  rationale: लेखक की सामुदायिक जवाबदेही सुरक्षित रहती है और इसे केवल निजी आत्म-सुधार में नहीं बदला गया।
- issue: eschatological punishment
  choice: न बुझने वाली आग में कठोर यातनाएँ
  alternative: अशमनीय आग में कठोर दंड
  rationale: साक्षी की तीखी न्याय-भाषा को नरम नहीं किया गया, न ही उसकी अवधि या प्रकृति पर अतिरिक्त सिद्धांत जोड़ा गया।
- issue: denial of Jesus
  choice: अपने शब्दों या कामों से यीशु का इनकार किया
  alternative: वचन या कर्म से यीशु को नकारा
  rationale: स्पष्ट करता है कि इनकार मौखिक और व्यावहारिक दोनों हो सकता है, जैसा साक्षी कहता है।
- issue: hope for the wholehearted servant
  choice: उसके लिए आशा होगी
  alternative: उसके लिए आशा है
  rationale: भविष्यकालीन रूप साक्षी की न्याय-दिवस की दृष्टि और उद्धृत कथन की संरचना को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण सामुदायिक उपदेश-शैली। ‘आओ, हम…’ से मूल के आवाहनात्मक प्रथम-पुरुष बहुवचन को रखा गया है। अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘उद्धार’, ‘धर्मी’, ‘भक्तिहीन’ जैसे व्यापक बाइबिलीय पद बनाए गए हैं। यह मसौदा प्रदत्त सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित है।
