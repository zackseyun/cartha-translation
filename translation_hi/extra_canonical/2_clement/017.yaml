  revised_text: 'इसलिए आओ, हम पूरे मन से मन फिराएँ, कहीं ऐसा न हो कि हममें से कोई मार्ग में नष्ट हो जाए। क्योंकि यदि हमें यह आज्ञा मिली है कि हम लोगों को मूर्तियों से दूर खींचने और उन्हें शिक्षा देने को अपना काम बनाएँ, तो यह कितनी अधिक अनुचित बात है कि वह व्यक्ति नष्ट हो जाए जो परमेश्वर को पहले से जानता है!


    इसलिए आओ, हम एक-दूसरे की सहायता करें, ताकि हम निर्बलों को भी भलाई की ओर ऊपर उठा सकें और हम सब उद्धार पाएँ। हम एक-दूसरे को सुधारें और चेतावनी दें।


    हम यह न सोचें कि केवल अभी, जब हम यहाँ हैं, ध्यान देना और विश्वास करना आवश्यक है। घर लौटने पर भी हम प्रभु की आज्ञाएँ स्मरण रखें और अपनी सांसारिक अभिलाषाओं को हमें दूसरी दिशा में घसीटने न दें। इसके बजाय, हम यहाँ अधिक बार आया करें और प्रभु की आज्ञाओं में आगे बढ़ने का प्रयत्न करें, ताकि हम सब एक मन होकर जीवन में एकत्र किए जाएँ।[a]


    क्योंकि प्रभु ने कहा, “मैं सभी राष्ट्रों, कुलों और भाषाओं को एकत्र करने आता हूँ।”[b] यहाँ वह अपने प्रकट होने के दिन की बात करता है, जब वह आएगा और हमें छुड़ाएगा—हर एक को उसके कामों के अनुसार।[c]


    तब अविश्वासी उसकी महिमा और सामर्थ्य देखेंगे। जब वे संसार का राज्य यीशु को दिया हुआ देखेंगे, तो वे चकित होकर कहेंगे, “हाय हम पर! क्योंकि तू था, और हमने तुझे नहीं जाना, न तुझ पर विश्वास किया; और जब प्राचीनों ने हमें हमारे उद्धार के विषय में बताया, तब हमने उनकी बात नहीं मानी।” और “उनका कीड़ा नहीं मरेगा और उनकी आग नहीं बुझेगी, और वे सब मनुष्यों के लिए एक दृश्य ठहरेंगे।”[d]


    वह न्याय के उस दिन की बात करता है, जब लोग हमारे बीच के उन लोगों को देखेंगे जो भक्तिहीन जीवन जीते हैं और यीशु मसीह की आज्ञाओं के प्रति कपटपूर्ण रहे हैं।


    परन्तु धर्मी—जिन्होंने भलाई की, यातनाएँ सहीं और आत्मा के सुखों से घृणा की—जब उन लोगों को देखेंगे जिन्होंने बुराई की और अपने शब्दों या कामों से यीशु का इनकार किया, और जो न बुझने वाली आग में कठोर यातनाएँ पा रहे हैं, तब वे परमेश्वर की महिमा करेंगे और कहेंगे, “जो पूरे मन से परमेश्वर की सेवा करता है, उसके लिए आशा होगी।”'
