base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/012.yaml
  text: 'Therefore let us await the kingdom of God betimes in love and righteousness, since we do not know the day of God’s appearing.


    For the Lord himself, being asked by a certain person when his kingdom would come, said, “When the two shall be one, and the outside as the inside, and the male with the female, neither male nor female.”


    Now the two are one when we speak truth among ourselves, and in two bodies there shall be one soul, without dissimulation.


    And by the outside as the inside he means this: by the inside he means the soul, and by the outside the body. Therefore, in like manner as the body appears, so also let your soul be manifest by its good works.


    And by the male with the female, neither male nor female, he means this: that a brother seeing a sister should have no thought of her as a female, and that a sister seeing a brother should have no thought of him as a male.


    “These things, if you do,” he says, “the kingdom of my Father shall come.”'
translation:
  language: hi
  text: 'इसलिए हम प्रेम और धार्मिकता में तत्पर होकर परमेश्वर के राज्य की बाट जोहें, क्योंकि हम परमेश्वर के प्रकट होने का दिन नहीं जानते।[a]


    क्योंकि जब किसी व्यक्ति ने स्वयं प्रभु से पूछा कि उनका राज्य कब आएगा, तो उन्होंने कहा, “जब दोनों एक हो जाएँगे, और बाहर भीतर के समान होगा, और नर नारी के साथ ऐसा होगा कि न नर रहेगा, न नारी।”[b]


    अब दोनों उस समय एक होते हैं, जब हम आपस में सत्य बोलते हैं और दो शरीरों में एक ही प्राण होता है, जिसमें कोई कपट नहीं।


    और “बाहर भीतर के समान” से उनका अर्थ यह है: भीतर से उनका अर्थ प्राण है और बाहर से शरीर। इसलिए जैसे तुम्हारा शरीर दिखाई देता है, वैसे ही तुम्हारा प्राण भी अपने भले कामों से प्रकट हो।


    और “नर नारी के साथ ऐसा होगा कि न नर रहेगा, न नारी” से उनका अर्थ यह है: कोई भाई किसी बहन को देखकर उसके विषय में स्त्री समझकर कोई विचार न करे, और कोई बहन किसी भाई को देखकर उसके विषय में पुरुष समझकर कोई विचार न करे।[c]


    वे कहते हैं, “यदि तुम ये बातें करोगे, तो मेरे पिता का राज्य आएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित प्रारूप है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: दिए गए स्रोत-सामग्री की सीमा और प्रारूप की अस्थायी पाठ-समीक्षात्मक स्थिति स्पष्ट करना।
  - marker: b
    text: यह कथन वर्तमान कैनोनिकल सुसमाचारों में इसी रूप में नहीं मिलता; इसका एक निकट समानांतर प्राचीन ‘थॉमस का सुसमाचार’ 22 में मिलता है।
    reason: असामान्य उद्धरण की पाठ-परंपरा संबंधी उपयोगी जानकारी देना, बिना उसे किसी अन्य पाठ के साथ मिला देने के।
  - marker: c
    text: मूल व्याख्या असामान्य और कुछ हद तक अस्पष्ट है; अनुवाद ने इसे किसी विशिष्ट तपस्वी, लैंगिक या संस्कार-संबंधी सिद्धांत के अनुसार नहीं बदला है।
    reason: पाठ की वास्तविक अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रखने की सूचना देना।
lexical_decisions:
- source_word: betimes
  choice: तत्पर होकर
  rationale: पुराने अंग्रेज़ी पद का आशय शीघ्रता या समय रहते सक्रिय प्रतीक्षा करना है; आधुनिक हिन्दी में ‘तत्पर होकर ... बाट जोहें’ यह भाव स्वाभाविक रूप से देता है।
- source_word: righteousness
  choice: धार्मिकता
  rationale: नैतिक सही आचरण और परमेश्वर-संबंधी धार्मिक अर्थ—दोनों को खुला रखता है।
- source_word: appearing
  choice: प्रकट होना
  rationale: आगमन का अर्थ आरोपित किए बिना दृश्य प्रकटीकरण की भाषा सुरक्षित रखता है।
- source_word: soul
  choice: प्राण
  rationale: यहाँ शरीर के विपरीत आंतरिक जीवन/स्व का संकेत है; ‘प्राण’ अपेक्षाकृत सहज है, यद्यपि यूनानी स्रोत की सीधी समीक्षा अभी शेष है।
- source_word: without dissimulation
  choice: जिसमें कोई कपट नहीं
  rationale: दिखावे, दोहरेपन और छलरहित एकता का आशय स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: male ... female
  choice: नर ... नारी
  rationale: उद्धृत रहस्यमय कथन में लिंग-युग्म की औपचारिक समांतरता बनाए रखता है; व्याख्यात्मक अनुच्छेद में संबंध-सूचक ‘भाई/बहन’ और ‘स्त्री/पुरुष’ सुरक्षित हैं।
theological_decisions:
- issue: राज्य के आने की शर्त-सदृश भाषा
  choice: “यदि तुम ये बातें करोगे, तो मेरे पिता का राज्य आएगा” को यथावत रखा
  alternative: इसे केवल नैतिक तैयारी या राज्य के अनुभव के रूप में समझाकर अनूदित करना
  rationale: पाठ की वास्तविक कारणात्मक/शर्तात्मक ध्वनि और उसके धर्मवैचारिक तनाव को बिना समाधान थोपे सुरक्षित रखना आवश्यक है।
- issue: ‘न नर, न नारी’ का अर्थ
  choice: लेखक द्वारा दी गई पारस्परिक दृष्टि की व्याख्या को ज्यों का त्यों रखा
  alternative: इसे बपतिस्मा, ब्रह्मचर्य, सामाजिक समानता या देह-लोप के किसी विशिष्ट सिद्धांत से जोड़ना
  rationale: पाठ स्वयं जो व्याख्या देता है उससे आगे किसी संप्रदायगत या निजी सिद्धांत को आरोपित नहीं किया गया।
- issue: अप्रमाणित प्रभु-वचन
  choice: इसे पाठ के भीतर प्रभु का कथन मानकर उद्धृत किया, पर पादटिप्पणी में इसकी कैनोनिकल सुसमाचारों से भिन्न स्थिति बताई
  alternative: किसी कैनोनिकल वचन से मिलाकर या उसका रूपांतर मानकर अनुवाद करना
  rationale: प्राचीन पाठ की अपनी दावे वाली भाषा बनी रहती है और आधुनिक पाठक को आवश्यक पाठ-साक्ष्य संबंधी सूचना भी मिलती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सुबोध। ‘बाट जोहें’ बाइबिलीय गरिमा देता है पर अत्यधिक पुरातन नहीं है। रहस्यमय समानांतर वाक्य-रचना जानबूझकर सुरक्षित रखी गई है। उपलब्ध आधार अंग्रेज़ी साक्ष्य है; अतः यूनानी की प्रत्यक्ष जाँच के बाद विशेषतः ‘betimes’, ‘soul’, और लिंग-संबंधी पदावली पर पुनर्विचार अपेक्षित हो सकता है।
