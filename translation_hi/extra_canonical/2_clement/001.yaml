base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/001.yaml
  text: 'Brethren, we ought to think of Jesus Christ as of God, as the Judge of the living and the dead.


    And we ought not to think mean things of our Salvation; for when we think mean things of Him, we also expect to receive mean things. And those who listen as concerning mean things do wrong; and we ourselves do wrong, not knowing whence and by whom and unto what place we were called, and how many things Jesus Christ endured to suffer for our sakes.


    What recompense, then, shall we give to Him? Or what fruit worthy of His own gift to us? And how many mercies do we owe to Him!


    For He bestowed the light upon us; He spoke to us as a father to his sons; He saved us when we were perishing.


    What praise, then, shall we give to Him? Or what payment of recompense for those things which we received?


    We were maimed in our understanding, and worshipped stocks and stones and gold and silver and bronze, the works of men; and our whole life was nothing else but death. While we were thus wrapped in darkness and oppressed with this thick mist in our vision, we recovered our sight, putting off by His will the cloud in which we were wrapped.


    For He had mercy on us and, in His compassion, saved us, having beheld in us much error and perdition, even when we had no hope of salvation except that which came from Him.


    For He called us when we were not, and from not being He willed us to be.'
translation:
  language: hi
  text: '**2 क्लेमेंट 1**


    भाइयो, हमें यीशु मसीह को परमेश्वर और जीवितों तथा मरे हुओं का न्यायी मानना चाहिए।


    हमें अपने उद्धार को कोई छोटी बात नहीं समझना चाहिए; क्योंकि जब हम उनके विषय में छोटा विचार रखते हैं, तो हम यह आशा भी करते हैं कि हमें थोड़ा ही मिलेगा। जो लोग इन बातों को छोटी बातें समझकर सुनते हैं, वे पाप करते हैं; और हम भी पाप करते हैं, क्योंकि हम नहीं जानते कि हमें कहाँ से, किसके द्वारा और कहाँ के लिए बुलाया गया, और यीशु मसीह ने हमारे लिए कितने दुःख सहे।


    तो फिर हम उन्हें इसका क्या प्रतिफल दें? अथवा ऐसा कौन-सा फल लाएँ जो हमें दिए गए उनके वरदान के योग्य हो? हम उनकी कैसी-कैसी दयाओं के ऋणी हैं!


    क्योंकि उन्होंने हमें प्रकाश दिया; पिता जैसे अपने पुत्रों से बोलता है, वैसे ही उन्होंने हमसे बात की; और जब हम नाश हो रहे थे, तब उन्होंने हमें बचाया।


    तो फिर हम उनकी क्या स्तुति करें? अथवा जो कुछ हमने पाया है, उसके बदले उन्हें क्या चुकाएँ?


    हमारी समझ मानो अपंग थी। हम लकड़ी, पत्थर, सोने, चाँदी और काँसे से बनी मनुष्यों के हाथों की कृतियों की पूजा करते थे; और हमारा पूरा जीवन मृत्यु के सिवा और कुछ न था। हम अंधकार में इस प्रकार लिपटे हुए थे और हमारी दृष्टि पर ऐसा घना कोहरा छाया था; फिर भी उनकी इच्छा से उस बादल को उतार फेंककर, जिसमें हम लिपटे थे, हमने फिर से दृष्टि पाई।


    क्योंकि उन्होंने हम पर दया की और करुणा करके हमें बचाया। उन्होंने देखा कि हम बड़ी भूल और विनाश में पड़े थे और हमारे पास उद्धार की कोई आशा नहीं थी—सिवाय उस आशा के जो उन्हीं से आई।


    क्योंकि जब हम थे ही नहीं, तब उन्होंने हमें बुलाया; और हमारे न होने की दशा से उन्होंने चाहा कि हम हों।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जब हम थे ही नहीं…कि हम हों” को अस्तित्व, पहचान अथवा परमेश्वर की प्रजा के रूप में बुलाए जाने की भाषा समझा जा सकता है। उपलब्ध साक्ष्य इस अर्थ को और संकीर्ण नहीं करता।
    reason: अंतिम वाक्य की वास्तविक अर्थगत और धर्मवैज्ञानिक बहुअर्थता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: as of God / ὡς περὶ θεοῦ (as reflected in the witness)
  choice: यीशु मसीह को परमेश्वर ... मानना चाहिए
  rationale: आरंभिक कथन की स्पष्ट और ऊँची मसीह-संबंधी भाषा को बिना नरम किए स्वाभाविक हिन्दी में रखा गया है।
- source_word: quick and dead
  choice: जीवितों तथा मरे हुओं
  rationale: पुराने अंग्रेज़ी प्रयोग “quick” का अर्थ “जीवित” है; हिन्दी में प्रचलित न्याय-सूत्र को रखा गया है।
- source_word: mean things
  choice: छोटी बात / छोटा विचार
  rationale: यहाँ “mean” का आशय निकृष्ट नैतिकता नहीं बल्कि कम महत्त्व आँकना या तुच्छ समझना है; प्रसंगानुसार संज्ञा और विचार दोनों रूपों में अनुवाद किया गया है।
- source_word: recompense
  choice: प्रतिफल / बदले ... चुकाएँ
  rationale: दोहराव में अर्थ बनाए रखते हुए हिन्दी को बोझिल होने से बचाने के लिए संदर्भानुसार दो स्वाभाविक रूप चुने गए हैं।
- source_word: stocks and stones
  choice: लकड़ी, पत्थर
  rationale: मूर्तियों की सामग्री का सीधा उल्लेख रखा गया है; “stocks” को आधुनिक हिन्दी में अस्पष्ट “ठूँठ” न बनाकर “लकड़ी” कहा गया है।
- source_word: maimed in our understanding
  choice: हमारी समझ मानो अपंग थी
  rationale: मूल रूपक सुरक्षित रखा गया है, जबकि “मानो” हिन्दी में रूपक का स्वाभाविक संकेत देता है।
- source_word: when we were not ... from not being
  choice: जब हम थे ही नहीं ... हमारे न होने की दशा से
  rationale: अस्तित्व और पहचान के बीच संभावित अर्थगत तनाव को किसी एक व्याख्या में सीमित किए बिना लगभग शाब्दिक रूप में रखा गया है।
theological_decisions:
- issue: यीशु मसीह का परमेश्वर और न्यायी के रूप में वर्णन
  choice: दोनों पद सीधे यीशु मसीह पर लागू किए गए हैं।
  alternative: “परमेश्वर के समान” या “परमेश्वर की ओर से न्यायी” कहना।
  rationale: साक्ष्य का आरंभिक कथन यीशु मसीह के विषय में परमेश्वर के विषय जैसा विचार करने को कहता है; उसे उपमा या प्रतिनिधित्व तक सीमित करना अनावश्यक व्याख्यात्मक नरमी होती।
- issue: “उद्धार” और अगले वाक्य के “उनके” का संबंध
  choice: “उद्धार” को वस्तु और “उनके” को मसीह के लिए रखा गया है।
  alternative: “उद्धारकर्ता” लिखकर दोनों को स्पष्ट रूप से एक ही व्यक्ति-संज्ञा बनाना।
  rationale: प्राप्त साक्ष्य में Salvation और Him के बीच भाषिक बदलाव है; “उद्धारकर्ता” जोड़ना वास्तविक अस्पष्टता को हल कर देता।
- issue: अंतिम ‘न होना’ कथन का अर्थ
  choice: अस्तित्व-संबंधी भाषा को यथासंभव खुला रखा गया है।
  alternative: इसे केवल अन्यजातियों का ‘परमेश्वर की प्रजा न होना’, नैतिक मृत्यु, या शाब्दिक सृष्टि के रूप में समझाना।
  rationale: पाठ स्वयं इनमें से किसी एक अर्थ को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए अनुवाद किसी निजी सिद्धान्त को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य शैली। वाक्य-संरचना को सामान्य पाठकों के लिए सहज बनाया गया है, पर आरंभिक मसीह-संबंधी दावा, प्रतिफल की प्रश्नात्मक भाषा और अंतिम ‘न होने’ का तनाव सुरक्षित है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण सूक्ष्म शब्दार्थ भविष्य में संशोधन माँग सकते हैं।
