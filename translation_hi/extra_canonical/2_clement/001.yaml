    भाइयो, हमें यीशु मसीह के विषय में परमेश्वर के विषय जैसा विचार करना चाहिए, और उन्हें जीवितों तथा मरे हुओं का न्यायी मानना चाहिए।


    और हमें अपने उद्धार के विषय में तुच्छ विचार नहीं रखना चाहिए; क्योंकि जब हम उसके विषय में तुच्छ विचार रखते हैं, तो हम यह आशा भी करते हैं कि हमें तुच्छ ही मिलेगा। जो लोग इसे तुच्छ बात समझकर सुनते हैं, वे गलत करते हैं; और हम भी गलत करते हैं, क्योंकि हम नहीं जानते कि हमें कहाँ से, किसके द्वारा और किस स्थान के लिए बुलाया गया, और यीशु मसीह ने हमारे लिए दुःख सहने में कितना कुछ सहा।


    तो फिर हम उन्हें क्या प्रतिफल दें? अथवा ऐसा कौन-सा फल दें जो हमें दिए गए उनके वरदान के योग्य हो? हम उनकी कितनी दयाओं के ऋणी हैं!


    क्योंकि उन्होंने हमें प्रकाश दिया; जैसे पिता अपने पुत्रों से बोलता है, वैसे ही उन्होंने हमसे बात की; जब हम नाश हो रहे थे, तब उन्होंने हमें बचाया।


    तो फिर हम उनकी क्या स्तुति करें? अथवा जो कुछ हमने पाया है, उसके बदले उन्हें क्या प्रतिदान दें?


    हमारी समझ अपंग थी, और हम लकड़ी, पत्थर, सोने, चाँदी और काँसे—मनुष्यों के हाथों की कृतियों—की पूजा करते थे; और हमारा पूरा जीवन मृत्यु के सिवा और कुछ न था। जब हम इस प्रकार अंधकार में लिपटे हुए थे और हमारी दृष्टि पर घना कोहरा छाया हुआ था, तब उनकी इच्छा से उस बादल को उतारकर, जिसमें हम लिपटे थे, हमने फिर से दृष्टि पाई।


    क्योंकि उन्होंने हम पर दया की और अपनी करुणा में हमें बचाया, क्योंकि उन्होंने हममें बहुत भटकाव और विनाश देखा था, तब भी जब हमारे पास उद्धार की कोई आशा नहीं थी, सिवाय उस आशा के जो उन्हीं से आई थी।


    क्योंकि जब हम थे ही नहीं, तब उन्होंने हमें बुलाया; और हमारे न होने से उन्होंने चाहा कि हम हों।[a]'
