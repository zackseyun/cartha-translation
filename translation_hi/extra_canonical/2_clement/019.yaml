base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/019.yaml
  text: 'Therefore, brothers and sisters, after the God of truth has been heard, I read you an exhortation so that you may pay attention to what is written, for you may save both yourselves and the one who reads among you. For I ask you, as a reward, to repent with your whole heart and give salvation and life to yourselves. By doing this, we will set a goal for all the young people who desire to labor in the study of godliness and of the goodness of God.


    And let us not be displeased and annoyed, foolish as we are, whenever anyone warns us and turns us away from unrighteousness toward righteousness. For sometimes, while we do evil things, we do not realize it because of the divided minds and unbelief within our hearts, and our understanding is darkened by our vain lusts.


    Therefore, let us practice righteousness so that we may be saved to the end. Blessed are those who obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore, let the godly person not be grieved if he is miserable in the present times; a blessed time awaits him. He will live again in heaven with our fathers and will rejoice throughout a sorrowless eternity.'
translation:
  language: hi
  text: '**2 क्लेमेंट 19**


    इसलिए, भाइयो और बहनो, सत्य के परमेश्वर की वाणी सुन लेने के बाद[a] मैं तुम्हारे सामने यह उपदेश पढ़ रहा हूँ, ताकि तुम लिखी हुई बातों पर ध्यान दो और अपना तथा अपने बीच पढ़नेवाले का भी उद्धार करो। मैं तुमसे प्रतिफल के रूप में यही माँगता हूँ कि तुम पूरे मन से पश्चाताप करो और अपने लिए उद्धार और जीवन प्राप्त करो। ऐसा करके हम उन सभी युवाओं के सामने एक लक्ष्य रखेंगे जो परमेश्वर की भक्ति और उसकी भलाई को जानने में परिश्रम करना चाहते हैं।


    जब कोई हमें चेतावनी देता और अधर्म से फेरकर धार्मिकता की ओर ले जाता है, तो हम—जो नासमझ हैं—न तो अप्रसन्न हों, न झुँझलाएँ। क्योंकि कभी-कभी हम बुरे काम करते हुए भी उन्हें पहचान नहीं पाते। इसका कारण हमारे भीतर की दुविधा और अविश्वास है; हमारी व्यर्थ लालसाएँ हमारी समझ को अंधकारमय कर देती हैं।


    इसलिए हम धार्मिकता के काम करें, ताकि अंत तक उद्धार पाएँ। धन्य हैं वे जो इन आदेशों का पालन करते हैं। भले ही वे इस संसार में थोड़े समय तक दुःख सहें, फिर भी वे पुनरुत्थान का अविनाशी फल काटेंगे।


    इसलिए भक्त जन यदि वर्तमान समय में कष्ट उठाता है, तो वह दुःखी न हो; एक धन्य समय उसकी प्रतीक्षा कर रहा है। वह ऊपर हमारे पूर्वजों के साथ फिर जीवित होकर उस युग में आनन्द मनाएगा जहाँ कोई दुःख नहीं होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अभिव्यक्ति लगभग ‘सत्य के परमेश्वर के बाद’ है। संभवतः संकेत परमेश्वर की वाणी या पवित्र पाठ को पहले सुनने की ओर है, पर वाक्य की संक्षिप्तता कुछ अस्पष्ट बनी रहती है।
    reason: आरंभिक वाक्य का रूप असामान्य और अर्थगत रूप से अस्पष्ट है; मुख्य पाठ को पठनीय रखते हुए वास्तविक अनिश्चितता बताना आवश्यक है।
lexical_decisions:
- source_word: ἀδελφοὶ καὶ ἀδελφαί
  choice: भाइयो और बहनो
  rationale: मूल के स्पष्ट स्त्री-पुरुष संबोधन को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: ἔντευξιν
  choice: उपदेश
  rationale: इस प्रसंग में पढ़कर सुनाई जाने वाली विनती/प्रेरक चेतावनी का अर्थ है; ‘उपदेश’ सामान्य पाठक के लिए सहज है, यद्यपि शब्द में निवेदन की छाया भी हो सकती है।
- source_word: σώσητε
  choice: उद्धार करो
  rationale: मूल की सक्रिय और धर्मवैज्ञानिक रूप से तनावपूर्ण अभिव्यक्ति को नरम किए बिना रखा गया है; इसे केवल ‘सहायता करो’ नहीं बनाया गया।
- source_word: διψυχίαν
  choice: दुविधा
  rationale: शाब्दिक भाव ‘दो मन वाला होना’ है; ‘दुविधा’ विभाजित निष्ठा और अनिश्चितता दोनों को सरल हिन्दी में व्यक्त करती है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यहाँ नैतिक सही आचरण और धर्मसंगत स्थिति दोनों निहित हैं; ‘धार्मिकता’ इस व्यापकता को बनाए रखती है।
- source_word: ἀθάνατον
  choice: अविनाशी
  rationale: पुनरुत्थान के फल के लिए ‘अमर’ संभव है, पर ‘अविनाशी’ फल के नष्ट न होने के रूपक के साथ अधिक स्वाभाविक है।
- source_word: ἄλυπον αἰῶνα
  choice: उस युग में ... जहाँ कोई दुःख नहीं होगा
  rationale: ‘दुःखरहित युग’ के अर्थ को सरल, गरिमापूर्ण और बोधगम्य हिन्दी में खोला गया है।
theological_decisions:
- issue: मनुष्य द्वारा अपना और पाठक का उद्धार करना
  choice: ‘अपना तथा अपने बीच पढ़नेवाले का भी उद्धार करो’
  alternative: ‘अपने और पढ़नेवाले के उद्धार में सहायक बनो’
  rationale: वैकल्पिक रूप धर्मवैज्ञानिक तनाव को कम कर देता। मूल की सक्रिय क्रिया को सुरक्षित रखा गया है, बिना उद्धार की कोई व्यवस्थित व्याख्या जोड़े।
- issue: ‘अपने लिए उद्धार और जीवन’ देने/पाने की भाषा
  choice: ‘अपने लिए उद्धार और जीवन प्राप्त करो’
  alternative: ‘अपने आपको उद्धार और जीवन दो’
  rationale: साक्ष्य में शाब्दिक भाषा ‘देते हुए’ है, पर हिन्दी में वह इस प्रकार अस्वाभाविक और भ्रामक लगती है मानो मनुष्य उद्धार का अंतिम स्रोत हो। ‘प्राप्त करो’ पश्चाताप के आह्वान का आशय स्वाभाविक ढंग से देता है, जबकि पिछले वाक्य में सक्रिय ‘उद्धार करो’ सुरक्षित है।
- issue: मृत्यु के बाद का स्थान और पुनर्जीवन
  choice: ‘ऊपर हमारे पूर्वजों के साथ फिर जीवित होकर’
  alternative: ‘स्वर्ग में हमारे पूर्वजों के साथ फिर जीवित होगा’
  rationale: संभावित यूनानी ‘ऊपर’ को सीधे ‘स्वर्ग’ मानकर अस्पष्टता समाप्त नहीं की गई; पुनर्जीवन और पूर्वजों के साथ संगति दोनों बनाए रखे गए हैं।
- issue: वर्तमान दुःख और भावी प्रतिफल
  choice: अल्पकालिक दुःख के विपरीत पुनरुत्थान का अविनाशी फल
  alternative: दुःख को प्रतिफल कमाने का साधन बताना
  rationale: पाठ दुःख और भावी फल का विरोध रखता है, पर स्पष्ट रूप से दुःख को पुण्य कमाने का साधन नहीं कहता; इसलिए ऐसा सिद्धांत नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘तुम’ बहुवचन सामुदायिक संबोधन के रूप में रखा गया है। उपलब्ध पैकेट में प्रत्यक्ष यूनानी समीक्षा लंबित बताई गई है; इसलिए निर्णय सार्वजनिक-डोमेन साक्ष्य और उद्धृत यूनानी परंपरा के ज्ञात पाठ के प्रति सावधानी रखते हुए किए गए हैं।
