base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/011.yaml
  text: 'Therefore, let us serve God with a pure heart, and we shall be righteous; but if we do not serve him because we do not believe the promise of God, we shall be wretched.


    For the word of prophecy also says: “Wretched are the double-minded, who doubt in their hearts and say, ‘We heard these things long ago, in the days of our fathers also; yet we have waited day after day and seen none of them.’”


    You fools! Compare yourselves to a tree; take a vine. First it sheds its leaves, then a shoot comes, after this a sour berry, then a fully ripe grape.


    So likewise my people had tumults and afflictions, but afterward they shall receive good things.


    Therefore, my brethren, let us not be double-minded, but endure patiently in hope, that we also may obtain our reward.


    For faithful is he who promised to pay to each person the recompense of their works.


    Therefore, if we shall have wrought righteousness in the sight of God, we shall enter into his kingdom and receive the promises which ear has not heard, nor eye seen, nor eye seen, neither has it entered into the heart of man.'
translation:
  language: hi
  text: 'इसलिए आओ, हम शुद्ध हृदय से परमेश्वर की सेवा करें, और हम धर्मी ठहरेंगे। पर यदि हम परमेश्वर की प्रतिज्ञा पर विश्वास न करने के कारण उसकी सेवा नहीं करते, तो हम अभागे होंगे।


    क्योंकि भविष्यवाणी का वचन भी कहता है, “अभागे हैं वे जो दुविधा में पड़े रहते हैं, जो अपने हृदय में संदेह करते और कहते हैं, ‘ये बातें हमने बहुत पहले, अपने पुरखों के दिनों में भी सुनी थीं; फिर भी हम दिन-प्रतिदिन प्रतीक्षा करते रहे, पर इनमें से कुछ भी होते नहीं देखा।’”


    हे मूर्खो! अपने को एक पेड़ के समान समझो—अंगूर की बेल को देखो। पहले वह अपने पत्ते गिराती है, फिर उसमें अंकुर निकलता है; इसके बाद कच्चा अंगूर आता है और तब पूरी तरह पका हुआ अंगूर।


    इसी प्रकार मेरी प्रजा ने भी उपद्रव और क्लेश सहे; पर बाद में उन्हें अच्छी वस्तुएँ मिलेंगी।


    इसलिए, मेरे भाइयो, हम दुविधा में न पड़ें, बल्कि आशा रखते हुए धीरज से सहते रहें, ताकि हम भी अपना प्रतिफल पाएँ।


    क्योंकि जिसने प्रत्येक व्यक्ति को उसके कामों का प्रतिफल देने की प्रतिज्ञा की है, वह विश्वासयोग्य है।


    इसलिए यदि हम परमेश्वर की दृष्टि में धार्मिकता के काम करते रहें, तो हम उसके राज्य में प्रवेश करेंगे और उन प्रतिज्ञा की हुई वस्तुओं को पाएँगे जिन्हें न कान ने सुना, न आँख ने देखा, न आँख ने देखा, और न वे मनुष्य के हृदय में आईं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्ष्य में “न आँख ने देखा” दो बार आया है; इस पुनरावृत्ति को यहाँ सुरक्षित रखा गया है। यूनानी पाठ की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: साक्ष्य की संभावित पाठगत पुनरावृत्ति को चुपचाप हटाने के बजाय पाठक को इसकी सूचना देना।
lexical_decisions:
- source_word: pure heart
  choice: शुद्ध हृदय
  rationale: मूल साक्ष्य की नैतिक और आंतरिक शुद्धता को औपचारिक रूप से सुरक्षित रखते हुए प्रचलित बाइबिलीय हिन्दी दी गई है।
- source_word: double-minded
  choice: दुविधा में पड़े रहते हैं
  rationale: यह केवल सामान्य संदेह नहीं, बल्कि विभाजित अथवा अस्थिर मनोदशा दर्शाता है; सहज आधुनिक हिन्दी में उसी भाव को रखा गया है।
- source_word: tumults and afflictions
  choice: उपद्रव और क्लेश
  rationale: दो अलग कठिनाइयों—अशांति और पीड़ा—को अलग-अलग बनाए रखा गया है।
- source_word: recompense of his works
  choice: उसके कामों का प्रतिफल
  rationale: कर्म और उसके अनुरूप मिलने वाले परिणाम का सीधा संबंध सुरक्षित है, बिना किसी विशिष्ट सिद्धान्तगत निष्कर्ष को जोड़ने के।
- source_word: wrought righteousness
  choice: धार्मिकता के काम करते रहें
  rationale: अंग्रेज़ी साक्ष्य के सक्रिय नैतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है; इसे केवल घोषित धार्मिकता के अर्थ में नहीं बदला गया।
theological_decisions:
- issue: सेवा करने और धर्मी ठहरने का संबंध
  choice: “सेवा करें, और हम धर्मी ठहरेंगे”
  alternative: “सेवा करें, क्योंकि हम धर्मी हैं”
  rationale: साक्ष्य में परिणामात्मक/भविष्यकालीन संबंध है। उसे उलटकर पूर्वघोषित धार्मिक स्थिति नहीं बनाया गया।
- issue: कामों के अनुसार प्रतिफल
  choice: “प्रत्येक व्यक्ति को उसके कामों का प्रतिफल”
  alternative: इसे केवल अनुग्रह या दंड तक सीमित करना
  rationale: पाठ का व्यापक और तनावपूर्ण कथन ज्यों का त्यों रखा गया है; प्रतिफल की प्रकृति को अतिरिक्त धर्मशास्त्रीय भाषा से सीमित नहीं किया गया।
- issue: राज्य में प्रवेश की शर्तात्मक भाषा
  choice: “यदि... तो हम उसके राज्य में प्रवेश करेंगे”
  alternative: शर्त को कमजोर करके केवल आश्वासन बनाना
  rationale: पाठ की स्पष्ट ‘यदि–तो’ संरचना सुरक्षित रखी गई है।
- issue: अंतिम पंक्ति में प्रतिज्ञाओं का आशय
  choice: “प्रतिज्ञा की हुई वस्तुओं”
  alternative: किसी निश्चित स्वर्गीय दृश्य या उद्धार-सिद्धान्त के रूप में विस्तार
  rationale: साक्ष्य में वस्तुएँ स्पष्ट नहीं हैं; इसलिए वास्तविक अस्पष्टता बनाए रखी गई है।
