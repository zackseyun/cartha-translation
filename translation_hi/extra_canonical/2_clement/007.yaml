theological_decisions:
- issue: ‘मुहर’ का आशय
  choice: मुहर को सुरक्षित नहीं रखा
  alternative: बपतिस्मा की मुहर को सुरक्षित नहीं रखा / विश्वास को सुरक्षित नहीं रखा
  rationale: मूल रूपक का धर्मवैचारिक अर्थ स्पष्ट किए बिना उसे यथावत रखा गया है, ताकि किसी विशिष्ट परंपरागत व्याख्या को पाठ में न थोपा जाए।
- issue: क्या सभी मुकुट पा सकते हैं
  choice: ‘यदि हम सब मुकुट नहीं पा सकते’ की तनावपूर्ण भाषा सुरक्षित रखी
  alternative: सबको मुकुट पाने के लिए भरसक प्रयास करना चाहिए
  rationale: लेखक की पहले की सामूहिक आशा और बाद की सशर्त संभावना के बीच मौजूद तनाव को समतल नहीं किया गया।
- issue: अंतिम दंड का दृश्य
  choice: कीड़ा, आग और सार्वजनिक तमाशे की छवियाँ ज्यों की त्यों रखीं
  alternative: सामान्यीकृत ‘अनन्त दंड’
  rationale: उद्धरण की विशिष्ट भविष्यद्वक्तापूर्ण भाषा को किसी व्यवस्थित धर्मसिद्धान्त में बदलने से बचा गया है।
