  yaml_path: translation/extra_canonical/2_clement/007.yaml
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
translation:
  language: hi
  text: 'इसलिए, मेरे भाइयो, आओ हम पूरी शक्ति से संघर्ष करें, क्योंकि हम जानते हैं कि प्रतियोगिता निकट है। नाशवान प्रतियोगिताओं में तो बहुत लोग उतरते हैं, फिर भी सबको मुकुट नहीं मिलता, बल्कि केवल उन्हीं को मिलता है जिन्होंने कठिन परिश्रम किया और वीरता से संघर्ष किया है।


    इसलिए आओ हम संघर्ष करें, ताकि हम सबको मुकुट मिले।


    अतः आओ हम सीधे मार्ग पर दौड़ें—उस अविनाशी प्रतियोगिता में। आओ हम बड़ी संख्या में उसमें उतरें और संघर्ष करें, ताकि हमें भी मुकुट मिले। और यदि हम सब मुकुट नहीं पा सकते, तो कम-से-कम मुकुट के निकट तो पहुँचें।


    हमें जानना चाहिए कि नाशवान प्रतियोगिता में भाग लेनेवाला यदि उसमें बेईमानी करता पाया जाए, तो पहले उसे कोड़े लगाए जाते हैं और फिर दौड़ के मैदान से निकालकर बाहर खदेड़ दिया जाता है।


    तुम्हारा क्या विचार है? जो अविनाशी प्रतियोगिता में बेईमानी करता है, उसके साथ क्या किया जाएगा?


    क्योंकि जिन्होंने मुहर को सुरक्षित नहीं रखा, उनके विषय में वह कहता है, “उनका कीड़ा नहीं मरेगा, उनकी आग नहीं बुझेगी, और वे समस्त प्राणियों के सामने तमाशा बनेंगे।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन यशायाह 66:24 की भाषा पर आधारित है। उपलब्ध पाठ में उद्धरण का अंतिम भाग ‘वे समस्त प्राणियों के सामने तमाशा बनेंगे’ के रूप में आता है। ‘मुहर’ का सटीक आशय यहाँ स्पष्ट नहीं किया गया है।
    reason: शास्त्रीय संकेत बताना और ‘मुहर’ की वास्तविक अस्पष्टता सुरक्षित रखना।
