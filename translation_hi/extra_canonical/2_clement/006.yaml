base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/006.yaml
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
translation:
  language: hi
  text: 'परन्तु प्रभु कहते हैं, “कोई सेवक दो स्वामियों की सेवा नहीं कर सकता।”[a] यदि हम परमेश्वर और धन—दोनों की सेवा करना चाहें, तो इससे हमें कोई लाभ नहीं होगा।


    क्योंकि यदि कोई मनुष्य सारे संसार को प्राप्त कर ले, पर अपने प्राण को खो दे, तो उसे क्या लाभ होगा?[b]


    यह वर्तमान युग और आने वाला युग एक-दूसरे के शत्रु हैं।


    एक व्यभिचार, अशुद्धता, लोभ और छल की बातें करता है, पर दूसरा इन बातों को त्याग देने को कहता है।


    इसलिए हम दोनों के मित्र नहीं हो सकते; हमें एक को त्यागना और दूसरे की संगति अपनानी होगी।


    हम यह समझें कि यहाँ की वस्तुओं से घृणा करना बेहतर है, क्योंकि वे तुच्छ, थोड़े समय की और नाशवान हैं; और वहाँ की वस्तुओं से प्रेम करना बेहतर है, क्योंकि वे उत्तम और अविनाशी हैं।


    क्योंकि यदि हम मसीह की इच्छा पूरी करें, तो हमें विश्राम मिलेगा। पर यदि हम उनकी आज्ञाएँ न मानें, तो अनन्त दण्ड से हमें कोई भी नहीं छुड़ा सकेगा।


    पवित्रशास्त्र में यहेजकेल के द्वारा यह भी कहा गया है, “यदि नूह, अय्यूब और दानिय्येल उठ खड़े हों, तो भी वे बंधुआई में अपने बच्चों को नहीं छुड़ा सकेंगे।”[c]


    पर यदि ऐसे धर्मी मनुष्य भी अपने धार्मिक कामों के द्वारा अपने बच्चों को नहीं छुड़ा सकते, तो यदि हम अपने बपतिस्मे को शुद्ध और निष्कलंक न रखें, हम किस भरोसे के साथ परमेश्वर के राज्य में प्रवेश करेंगे? अथवा यदि हम पवित्र और धार्मिक कामों से युक्त न पाए जाएँ, तो हमारा पक्ष लेने वाला कौन होगा?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'तुलना करें: मत्ती 6:24; लूका 16:13।'
    reason: प्रभु के कथन के सुसमाचार-संबंधी समानांतर की पहचान।
  - marker: b
    text: 'तुलना करें: मत्ती 16:26; मरकुस 8:36; लूका 9:25।'
    reason: सुसमाचारों में पाए जाने वाले समान कथन की पहचान।
  - marker: c
    text: 'तुलना करें: यहेजकेल 14:14, 20। यहाँ उद्धरण ज्ञात यहेजकेल-पाठ से शब्दशः मेल नहीं खाता: वहाँ नूह, दानिय्येल और अय्यूब का क्रम है और कहा गया है कि वे केवल अपने प्राण बचाएँगे, पुत्र-पुत्रियों को नहीं।'
    reason: द्वितीय क्लेमेंट में उद्धृत रूप और यहेजकेल की पाठ-परंपरा के बीच अंतर को पारदर्शी बनाना।
lexical_decisions:
- source_word: mammon
  choice: धन
  rationale: सामान्य आधुनिक हिन्दी में अर्थ स्पष्ट रखने के लिए; प्रसंग में धन-संपत्ति को प्रतिद्वंद्वी स्वामी के रूप में प्रस्तुत किया गया है।
- source_word: soul
  choice: प्राण
  rationale: व्यक्ति के जीवन/स्वत्व की व्यापकता बनाए रखता है और केवल अमूर्त ‘आत्मा’ तक अर्थ को सीमित नहीं करता।
- source_word: this age / the future
  choice: यह वर्तमान युग / आने वाला युग
  rationale: आरम्भिक मसीही युग-संबंधी विरोध को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: find rest
  choice: विश्राम मिलेगा
  rationale: धर्मवैचारिक गूंज को बिना अतिरिक्त व्याख्या के बनाए रखने वाला सीधा रूप।
- source_word: baptism
  choice: बपतिस्मा
  rationale: हिन्दी मसीही प्रयोग में प्रचलित और मूल धार्मिक संस्कार-संदर्भ को अक्षुण्ण रखने वाला शब्द।
- source_word: advocate
  choice: हमारा पक्ष लेने वाला
  rationale: न्यायिक/मध्यस्थतापरक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट पदवी को आरोपित किए।
theological_decisions:
- issue: परमेश्वर और धन की सेवा
  choice: धन को परमेश्वर के प्रतिद्वंद्वी स्वामी के रूप में रहने दिया गया
  alternative: ‘मामोन’ का लिप्यंतरण
  rationale: कथन की नैतिक और धार्मिक तीक्ष्णता सुरक्षित रहती है, जबकि सामान्य पाठक अर्थ तुरंत समझ सकता है।
- issue: ‘अपने प्राण को खो दे’ का आशय
  choice: प्राण
  alternative: आत्मा
  rationale: मूल कथन की सम्भावित जीवन/व्यक्ति/आत्म के अर्थगत व्यापकता को संकीर्ण धर्मवैज्ञानिक परिभाषा में नहीं बाँधा गया।
- issue: बपतिस्मे को शुद्ध रखना और धार्मिक काम
  choice: लेखक की उद्धार-संबंधी चेतावनी को यथावत रखा गया
  alternative: विश्वास, अनुग्रह या संस्कार पर व्याख्यात्मक स्पष्टीकरण जोड़ना
  rationale: पाठ की वास्तविक धर्मवैचारिक तनावपूर्ण भाषा को किसी सम्प्रदायगत व्यवस्था में चुपचाप नहीं ढाला गया।
- issue: ‘मसीह की इच्छा’ और ‘उनकी आज्ञाएँ’
  choice: सर्वनाम को मसीह से संबद्ध रखा गया
  alternative: ‘परमेश्वर की आज्ञाएँ’ कहना
  rationale: निकटतम व्याकरणिक संदर्भ मसीह है; पाठ की उच्च मसीह-विषयक भाषा को सुरक्षित रखा गया।
- issue: यहेजकेल का उद्धरण
  choice: प्राप्त साक्षी का ‘उठ खड़े हों’ और ‘बच्चों’ वाला रूप बनाए रखा गया
  alternative: प्रामाणिक यहेजकेल-पाठ के अनुसार उद्धरण को सुधारना
  rationale: यहाँ लेखक के उद्धरण-रूप का अनुवाद किया गया है; उसे बाद के मानकीकृत बाइबिल पाठ से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्यरचना को सहज बनाया गया है, पर युगों के विरोध, अनन्त दण्ड, बपतिस्मे की शुद्धता और धार्मिक कामों से जुड़ी मूल धर्मवैचारिक तीक्ष्णता को नरम नहीं किया गया। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष यूनानी स्रोत-परीक्षण लंबित होने के कारण शब्दगत निष्कर्ष सावधानी से लिए गए हैं।
