base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/010.yaml
  text: 'Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us rather pursue virtue, but forsake vice as the forerunner of our sins, and let us flee from ungodliness, lest evils overtake us.


    For if we are diligent in doing good, peace will pursue us.


    For this cause a person is unable to attain happiness, seeing that they call in the fears of men, preferring the enjoyment that is here to the promise that is to come.


    For they do not know how great a torment the enjoyment that is here brings, and what delight the promise that is to come brings.


    And if indeed they were doing these things by themselves alone, it would have been tolerable; but now they continue teaching evil to innocent souls, not knowing that they shall have their condemnation doubled, both themselves and their hearers.'
translation:
  language: hi
  text: 'इसलिए, मेरे भाइयो, आओ हम उस पिता की इच्छा पूरी करें जिसने हमें बुलाया है, ताकि हम जीवित रहें। हम सद्गुण के पीछे चलें और बुराई को छोड़ दें, क्योंकि वह हमारे पापों की अग्रदूत है। हम भक्तिहीनता से दूर भागें, कहीं ऐसा न हो कि विपत्तियाँ हमें आ घेरें।


    क्योंकि यदि हम भलाई करने में तत्पर रहें, तो शांति हमारा पीछा करेगी।


    इसी कारण मनुष्य सच्चा सुख नहीं पा सकता: लोग मनुष्यों के भय को अपने पास बुला लेते हैं[a] और आनेवाली प्रतिज्ञा की अपेक्षा यहाँ के भोग-सुख को अधिक पसंद करते हैं।


    वे नहीं जानते कि यहाँ का भोग-सुख कितनी बड़ी यातना लाता है और आनेवाली प्रतिज्ञा कितना आनंद लाती है।


    यदि वे ये काम केवल अपने तक ही रखते, तो इसे सहा जा सकता था। पर अब वे निर्दोष प्राणों को बुराई सिखाते रहते हैं। वे नहीं जानते कि उन्हें दुगुना दण्ड मिलेगा—अपने लिए भी और अपने सुननेवालों के लिए भी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनुष्यों के भय को अपने पास बुला लेते हैं” उपलब्ध अंग्रेज़ी साक्ष्य के एक कठिन और असामान्य वाक्यांश का निकट अनुवाद है। इसका आशय संभवतः मानवीय भय या धमकियों को अपने ऊपर आने देना है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी आवश्यक है।
    reason: प्रदान किए गए आधार-पाठ में यह वाक्यांश अस्पष्ट है; अनुमान से एक अर्थ निश्चित करने के बजाय अनिश्चितता पाठक के सामने रखी गई है।
lexical_decisions:
- source_word: virtue
  choice: सद्गुण
  rationale: नैतिक उत्कृष्टता के अर्थ को संक्षिप्त और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: vice
  choice: बुराई
  rationale: ‘दुर्गुण’ संभव था, पर यहाँ पापों की अग्रदूत के रूप में व्यापक नैतिक बुराई अभिप्रेत है; ‘बुराई’ सामान्य पाठक के लिए अधिक सहज है।
- source_word: ungodliness
  choice: भक्तिहीनता
  rationale: यह केवल सामान्य अन्याय नहीं, बल्कि परमेश्वर के प्रति भक्ति के अभाव का भाव बनाए रखता है; ‘अधर्म’ वैकल्पिक अनुवाद है।
- source_word: peace will pursue us
  choice: शांति हमारा पीछा करेगी
  rationale: मूल साक्ष्य की सजीव उलटी छवि—मनुष्य शांति को नहीं, शांति मनुष्य को खोजती है—को सुरक्षित रखा गया है।
- source_word: enjoyment which is here
  choice: यहाँ का भोग-सुख
  rationale: वर्तमान, क्षणिक सुख और उससे जुड़ी नैतिक चेतावनी दोनों को व्यक्त करता है।
- source_word: condemnation doubled
  choice: दुगुना दण्ड
  rationale: दोषनिर्णय के परिणाम को सहज हिन्दी में व्यक्त करता है और लेखक तथा श्रोताओं—दोनों से संबंधित दोहरे उत्तरदायित्व को स्पष्ट रखता है।
theological_decisions:
- issue: जीवन पाने और पिता की इच्छा पूरी करने का संबंध
  choice: ‘इच्छा पूरी करें ... ताकि हम जीवित रहें’ के उद्देश्य-संबंध को यथावत रखा गया है।
  alternative: इसे केवल प्राप्त जीवन के प्रमाण या फल के रूप में स्पष्ट करना।
  rationale: उपलब्ध साक्ष्य उद्देश्य अथवा परिणाम का सीधा संबंध रखता है; किसी विशिष्ट उद्धार-सिद्धान्त के अनुसार उसे पुनर्व्याख्यायित नहीं किया गया।
- issue: ‘आनेवाली प्रतिज्ञा’ का आशय
  choice: सामान्य और एकवचन ‘आनेवाली प्रतिज्ञा’ रखा गया है।
  alternative: इसे स्पष्टतः स्वर्ग, पुनरुत्थान या अनन्त जीवन कहना।
  rationale: पाठ स्वयं इस स्थान पर प्रतिज्ञा की विषयवस्तु नहीं खोलता; इसलिए धार्मिक अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- issue: दुगुना दण्ड
  choice: अपने और सुननेवालों—दोनों के कारण दुगुना दण्ड।
  alternative: दण्ड की ठीक मात्रा या दो अलग न्यायों की व्याख्या करना।
  rationale: उपलब्ध वाक्य की तीखी चेतावनी रखी गई है, पर उसके न्यायशास्त्रीय स्वरूप को अतिरिक्त सिद्धान्त से नहीं भरा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, और सामूहिक उपदेशात्मक शैली अपनाई गई है। ‘आओ हम’, ‘पीछे चलें’, और ‘दूर भागें’ से आग्रह का स्वर स्वाभाविक रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष यूनानी स्रोत-समीक्षा लंबित होने के कारण विशेषतः [a] को अस्थायी माना जाना चाहिए।
