  revised_text: '**5** इसलिए, भाइयो, हम इस संसार में अपना परदेशी निवास[a] पीछे छोड़ दें, और जिसने हमें बुलाया है उसकी इच्छा पूरी करें; और इस संसार से विदा होने से न डरें।


    क्योंकि प्रभु कहते हैं, “तुम भेड़ियों के बीच मेमनों के समान होगे।”


    पर पतरस ने उन्हें उत्तर दिया, “तो फिर, यदि भेड़िये मेमनों को फाड़ डालें तो क्या होगा?”


    यीशु ने पतरस से कहा, “मर जाने के बाद मेमने भेड़ियों से न डरें। इसी प्रकार तुम भी उनसे मत डरो जो तुम्हें मार डालते हैं और तुम्हारा कुछ नहीं कर सकते। बल्कि उससे डरो जिसके पास तुम्हारे मरने के बाद आत्मा और शरीर को आग के गेहन्ना[b] में डालने का अधिकार है।”


    और भाइयो, तुम जानते हो कि इस देह का इस संसार में रहना तुच्छ और थोड़े समय का है; पर मसीह की प्रतिज्ञा महान और अद्भुत है—आनेवाले राज्य का विश्राम और अनन्त जीवन।


    तो इन्हें पाने के लिए हम और क्या कर सकते हैं, सिवाय इसके कि पवित्रता और धार्मिकता से जीवन बिताएँ, संसार की इन वस्तुओं को अपने लिए पराया समझें और उनकी लालसा न करें?


    क्योंकि जब हम इन वस्तुओं को पाने की लालसा करते हैं, तब हम धार्मिकता के मार्ग से भटक जाते हैं।'
