  yaml_path: translation/extra_canonical/2_clement/005.yaml
  text: 'Therefore, brethren, let us forsake our sojourn in this world and do the will of Him who called us, and let us not be afraid to depart from this world.


    For the Lord says, “You shall be as lambs in the midst of wolves.”


    But Peter answered and said to Him, “What then, if the wolves should tear the lambs?”


    Jesus said to Peter, “Let not the lambs fear the wolves after they are dead; and you also, do not fear those who kill you and are not able to do anything to you; but fear Him who, after you are dead, has power over soul and body to cast them into the Gehenna of fire.”


    And you know, brethren, that the sojourn of this flesh in this world is mean and for a short time, but the promise of Christ is great and marvelous, even the rest of the kingdom that shall be and of life eternal.


    What then can we do to obtain them, but walk in holiness and righteousness, consider these worldly things as alien to us, and not desire them?


    For when we desire to obtain these things, we fall away from the righteous path.'
translation:
  language: hi
  text: '**5** इसलिए, भाइयो, हम इस संसार में अपना परदेशी निवास[a] पीछे छोड़ दें, और जिसने हमें बुलाया है उसकी इच्छा पूरी करें; और इस संसार से विदा होने से न डरें।


    क्योंकि प्रभु कहते हैं, “तुम भेड़ियों के बीच मेमनों के समान होगे।”


    पर पतरस ने उन्हें उत्तर दिया, “तो फिर, यदि भेड़िये मेमनों को फाड़ डालें तो क्या होगा?”


    यीशु ने पतरस से कहा, “मर जाने के बाद मेमने भेड़ियों से न डरें। इसी प्रकार तुम भी उनसे मत डरो जो तुम्हें मार डालते हैं और तुम्हारा कुछ नहीं कर सकते। बल्कि उससे डरो जिसके पास तुम्हारे मरने के बाद आत्मा और शरीर को आग के गेहन्ना[b] में डालने का अधिकार है।”


    और भाइयो, तुम जानते हो कि इस देह का इस संसार में रहना तुच्छ और थोड़े समय का है; पर मसीह की प्रतिज्ञा महान और अद्भुत है—आनेवाले राज्य का विश्राम और अनन्त जीवन।


    तो इन्हें पाने के लिए हम और क्या कर सकते हैं, सिवाय इसके कि पवित्रता और धार्मिकता से जीवन बिताएँ, संसार की इन वस्तुओं को अपने लिए पराया समझें और उनकी लालसा न करें?


    क्योंकि जब हम इन वस्तुओं को पाने की लालसा करते हैं, तब हम धार्मिकता के मार्ग से भटक जाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी निवास’ का अर्थ इस संसार में अस्थायी रूप से रहना है।
    reason: मूल शब्द में अस्थायी निवास और परदेशीपन दोनों के भाव हैं, जिन्हें आधुनिक पाठक के लिए स्पष्ट करना उपयोगी है।
  - marker: b
    text: 'गेहन्ना: यरूशलेम के बाहर हिन्नोम की घाटी से निकला नाम, जो यहाँ अंतिम दंड के स्थान के लिए प्रयुक्त है।'
    reason: अपरिचित प्राचीन स्थान-संज्ञा को अनुवाद में बनाए रखते हुए उसका संक्षिप्त संदर्भ देना आवश्यक है।
lexical_decisions:
- source_word: παροικία
  choice: परदेशी निवास
  rationale: यह शब्द अस्थायी निवास और अपने वास्तविक घर से बाहर रहने—दोनों भाव रखता है; केवल ‘जीवन’ कहने से यह रूपक खो जाता।
- source_word: ἐξελθεῖν ἐκ τοῦ κόσμου τούτου
  choice: इस संसार से विदा होने
  rationale: संदर्भ में मृत्यु निहित है, पर मूल अभिव्यक्ति ‘संसार से निकलने’ की है; ‘विदा होने’ स्वाभाविक हिंदी में दोनों को साथ रखता है।
- source_word: γέεννα πυρός
  choice: आग का गेहन्ना
  rationale: गेहन्ना स्थान-संज्ञा को बनाए रखा गया है और πυρός का अग्नि-संबंध स्पष्ट किया गया है; इसे किसी विस्तृत परवर्ती दंड-सिद्धांत से नहीं बदला गया।
- source_word: ἐπιδημία ... τῆς σαρκὸς
  choice: इस देह का इस संसार में रहना
  rationale: देहधारी सांसारिक प्रवास का भाव साधारण आधुनिक हिंदी में व्यक्त किया गया है, बिना देह को अपने-आप बुरा ठहराए।
- source_word: ἀνάπαυσις
  choice: विश्राम
  rationale: राज्य से जुड़ी भावी शांति और राहत के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: ὁσίως καὶ δικαίως ἀναστρέφεσθαι
  choice: पवित्रता और धार्मिकता से जीवन बिताना
  rationale: आचरण-सूचक क्रिया को स्वाभाविक हिंदी में रखा गया है और दोनों नैतिक विशेषताओं को अलग बनाए रखा गया है।
theological_decisions:
- issue: बुलाने वाले की पहचान
  choice: उस परमेश्वर की इच्छा ... जिसने हमें बुलाया है
  alternative: उसकी इच्छा ... जिसने हमें बुलाया है
  rationale: हिंदी में संदर्भ स्पष्ट करने के लिए ‘परमेश्वर’ जोड़ा गया है; इसे मसीह या किसी विशिष्ट त्रित्ववादी विन्यास के रूप में अधिक निर्धारित नहीं किया गया।
- issue: हत्या के बाद हानि पहुँचाने में असमर्थता
  choice: उसके बाद तुम्हारा कुछ नहीं कर सकते
  alternative: तुम्हारे साथ और कुछ नहीं कर सकते
  rationale: वाक्य को सामान्य रखा गया है; यह आत्मा की प्रकृति या मृत्यु के बाद की अवस्था पर अतिरिक्त सिद्धांत नहीं जोड़ता।
- issue: आत्मा और शरीर पर अधिकार
  choice: आत्मा और शरीर को आग के गेहन्ना में डालने का अधिकार
  alternative: आत्मा और शरीर पर अधिकार, कि उन्हें आग के गेहन्ना में डाले
  rationale: मूल कथन का कठोर न्याय-विषयक तनाव सुरक्षित है, पर परमेश्वर का नाम वहाँ नहीं जोड़ा गया जहाँ कथन केवल ‘उससे’ कहता है।
- issue: मसीह की प्रतिज्ञा की विषयवस्तु
  choice: आनेवाले राज्य का विश्राम और अनन्त जीवन
  alternative: आनेवाले राज्य और अनन्त जीवन का विश्राम
  rationale: स्रोत-वाक्य की समन्वित संरचना कुछ अस्पष्ट है; चुना गया पाठ दोनों भावी वरदानों को अलग और सहज रूप में रखता है, जबकि किसी एक को दूसरे में विलीन नहीं करता।
- issue: मेमनों की मृत्यु के बाद भय
  choice: मर जाने के बाद मेमने भेड़ियों से न डरें
  alternative: भेड़ियों के मर जाने के बाद मेमने उनसे न डरें
  rationale: संदर्भ में शिष्यों/मेमनों की हत्या और उसके बाद हानि की असमर्थता आगे स्पष्ट होती है; इसलिए मृत्यु को मेमनों से जोड़ा गया, जबकि वाक्य को अनावश्यक दार्शनिक व्याख्या से नहीं बढ़ाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, संबोधन में गरिमामय और सामान्य पाठक के लिए सुलभ रखी गई है। प्रत्यक्ष कथनों में स्वाभाविक हिंदी वाक्य-विन्यास अपनाया गया है। ‘भाइयो’, ‘धार्मिकता’, ‘प्रतिज्ञा’ और ‘अनन्त जीवन’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं, पर अत्यधिक संस्कृतनिष्ठ शैली से बचा गया है। उपलब्ध ग्रीक परंपरा से जुड़े प्रमुख शब्दार्थों को प्राथमिकता दी गई है; जहाँ प्रस्तुत सामग्री ने स्रोत-भाषा समीक्षा को लंबित बताया है, वहाँ पाठगत दावे संयमित रखे गए हैं।
