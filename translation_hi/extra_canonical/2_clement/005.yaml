source:
  text: 'Wherefore, brethren, let us forsake our sojourn in this world and do the will of Him that called us, and let us not be afraid to depart out of this world.


    For the Lord saith, Ye shall be as lambs in the midst of wolves.


    But Peter answered and said unto Him, What then, if the wolves should tear the lambs?


    Jesus said unto Peter, Let not the lambs fear the wolves after they are dead; and ye also, fear ye not them that kill you and are not able to do anything to you; but fear Him that after ye are dead hath power over soul and body, to cast them into the Gehenna of fire.


    And ye know, brethren, that the sojourn of this flesh in this world is mean and for a short time, but the promise of Christ is great and marvelous, even the rest of the kingdom that shall be and of life eternal.


    What then can we do to obtain them, but walk in holiness and righteousness, and consider these worldly things as alien to us, and not desire them?


    For when we desire to obtain these things we fall away from the righteous path.'
