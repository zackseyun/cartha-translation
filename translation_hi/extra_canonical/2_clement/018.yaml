base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/018.yaml
  text: 'Therefore, let us also be found among those who give thanks, among those who have served God, and not among the ungodly who are judged.


    For I myself am also an utter sinner. I have not yet escaped temptation but am still surrounded by the devices of the devil. Yet I strive to pursue righteousness, so that I may at least succeed in coming near to it, because I fear the judgment to come.'
translation:
  language: hi
  text: 'इसलिए हम भी उन लोगों में पाए जाएँ जो धन्यवाद देते हैं, जिन्होंने परमेश्वर की सेवा की है—न कि उन भक्तिहीनों में, जिनका न्याय किया जाता है।


    क्योंकि मैं स्वयं भी महापापी हूँ। मैं अब तक परीक्षा से निकल नहीं पाया हूँ, बल्कि अभी भी शैतान की युक्तियों के बीच हूँ। फिर भी मैं धार्मिकता का अनुसरण करने का यत्न करता हूँ, ताकि कम-से-कम उसके निकट पहुँच सकूँ, आनेवाले न्याय से डरते हुए।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी पाठ है; यूनानी स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: उपलब्ध सामग्री के अनुसार प्रत्यक्ष यूनानी स्रोत-पाठ की समीक्षा लंबित है; इस सीमा को पाठकों के सामने पारदर्शी रखना आवश्यक है।
lexical_decisions:
- source_word: give thanks
  choice: धन्यवाद देते हैं
  rationale: साक्ष्य में उपस्थित कृतज्ञता व्यक्त करने के सामान्य और स्पष्ट अर्थ को सीधे रखा गया है।
- source_word: served God
  choice: परमेश्वर की सेवा की है
  rationale: धार्मिक संदर्भ में स्वाभाविक आधुनिक हिन्दी और मूल साक्ष्य के पूर्णतामूलक भाव को सुरक्षित रखता है।
- source_word: ungodly
  choice: भक्तिहीन
  rationale: यह ऐसा नैतिक-धार्मिक शब्द है जो परमेश्वर के प्रति श्रद्धा और निष्ठा के अभाव को व्यक्त करता है, बिना किसी विशिष्ट संप्रदायगत अर्थ के।
- source_word: utter sinner
  choice: घोर पापी
  rationale: वक्ता की तीव्र आत्म-स्वीकृति को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: temptation
  choice: परीक्षा
  rationale: यह प्रलोभन और कसौटी—दोनों संभावित धार्मिक अर्थों के लिए कुछ खुलापन बनाए रखता है।
- source_word: engines/devices of the devil
  choice: शैतान के फंदों
  rationale: पुराने अंग्रेज़ी मुहावरे के आशय को साधारण पाठक के लिए बोधगम्य रूप में व्यक्त करता है; इसमें शत्रुतापूर्ण युक्तियों और जाल का भाव है।
- source_word: righteousness
  choice: धार्मिकता
  rationale: नैतिक सच्चाई और परमेश्वर-सम्मत जीवन के व्यापक धार्मिक अर्थ को बनाए रखने वाला प्रचलित पद।
- source_word: judgment to come
  choice: आनेवाला न्याय
  rationale: भावी दैवी न्याय के कालगत और धर्मवैज्ञानिक तनाव को बिना विस्तार किए सुरक्षित रखता है।
theological_decisions:
- issue: धन्यवाद देने वालों और परमेश्वर की सेवा करने वालों का संबंध
  choice: दोनों वर्णनों को एक ही समूह के संबद्ध गुणों के रूप में रखा गया
  alternative: इन्हें दो अलग-अलग समूह मानना
  rationale: साक्ष्य की समानांतर रचना स्वाभाविक रूप से धन्यवाद देने वालों को परमेश्वर की सेवा कर चुके लोगों से जोड़ती है, पर कोई अतिरिक्त उद्धार-सिद्धांत नहीं जोड़ा गया।
- issue: धार्मिकता के निकट पहुँचने की भाषा
  choice: “कम-से-कम उसके निकट पहुँच सकूँ”
  alternative: धार्मिकता को पूर्णतः प्राप्त कर लूँ
  rationale: वक्ता की विनम्र, अपूर्ण और प्रयत्नशील स्थिति को सुरक्षित रखा गया है; धार्मिकता की प्राप्ति की कोई व्यवस्थित धर्मवैज्ञानिक व्याख्या आरोपित नहीं की गई।
- issue: न्याय के भय और धार्मिक प्रयत्न का संबंध
  choice: कारणसूचक “क्योंकि” रखा गया
  alternative: केवल समकालिक भाव—“आनेवाले न्याय से डरते हुए”
  rationale: प्राप्त अंग्रेज़ी साक्ष्य और परामर्श-पाठ कारणात्मक संबंध का समर्थन करते हैं, यद्यपि प्रत्यक्ष यूनानी समीक्षा लंबित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे वाक्य को पठनीयता के लिए विभाजित किया गया, जबकि तर्कगत क्रम, आत्मस्वीकृति, संघर्ष और भावी न्याय का तनाव सुरक्षित रखा गया है।
