    text: “पहले आत्मा थे, फिर देह बने” इस प्राचीन उपदेश का अपना कथन है। इसे बाद की धर्मवैज्ञानिक परिभाषाओं के अनुसार विस्तृत या पुनर्व्याख्यायित नहीं किया गया है।
    reason: मसीह-विज्ञान संबंधी तनाव को सुरक्षित रखना और सांप्रदायिक व्याख्या आरोपित करने से बचना।
lexical_decisions:
- source_word: flesh (Greek review pending)
  choice: देह
  rationale: ‘देह’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है; यह शारीरिक अस्तित्व तथा पुनरुत्थान पर दिए गए बल को बनाए रखता है।
- source_word: riseth again
  choice: फिर जी उठती
  rationale: पुनरुत्थान का अर्थ साधारण पाठक के लिए स्पष्ट रखते हुए मूल कथन की प्रत्यक्षता बनाए रखता है।
- source_word: recover your sight
  choice: फिर से दृष्टि मिली
  rationale: शाब्दिक दृष्टि-प्राप्ति को सुरक्षित रखा गया है और उसके संभावित आध्यात्मिक आशय को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: repentance
  choice: मन फिराना
  rationale: यह केवल पछतावे के बजाय हृदय और जीवन की दिशा बदलने का सक्रिय अर्थ व्यक्त करता है।
- source_word: physician
  choice: वैद्य
  rationale: उपचारक परमेश्वर का रूपक संक्षिप्त और गरिमापूर्ण ढंग से सुरक्षित रहता है।
- source_word: reward
  choice: प्रतिफल
  rationale: नैतिक-युगांतकारी संदर्भ में ‘प्रतिफल’ स्वाभाविक है और पुरस्कार के स्वरूप को अनिर्धारित रखता है।
theological_decisions:
- issue: देह के न्याय और पुनरुत्थान का संबंध
  choice: 'दोनों कथनों को समानांतर और स्पष्ट रखा गया: देह का न्याय होता है और वह फिर जी उठती है।'
  alternative: ‘मनुष्य का न्याय होगा और शरीर का पुनरुत्थान होगा।’
  rationale: वैकल्पिक रूप मूल के देह-केंद्रित जोर को नरम कर देता; वर्तमान रूप लेखक की धर्मवैचारिक तीक्ष्णता को बनाए रखता है।
- issue: मसीह ‘पहले आत्मा थे, फिर देह बने’
  choice: कथन को निकट-औपचारिक रूप में रखा गया।
  alternative: इसे बाद की व्यवस्थित मसीह-विज्ञान संबंधी शब्दावली से समझाकर लिखना।
  rationale: पाठ की वास्तविक प्राचीन अभिव्यक्ति और उसका तनाव सुरक्षित रखना आवश्यक है; किसी संप्रदायगत व्याख्या को आरोपित नहीं किया गया।
- issue: ‘देह में आओगे’ का आशय
  choice: मुख्य पाठ में अस्पष्ट अभिव्यक्ति बनाए रखी गई और टिप्पणी में संभावित आशय बताया गया।
  alternative: सीधे ‘न्याय के लिए देह में उपस्थित होगे’ या ‘पुनर्जीवित होगे’ लिखना।
  rationale: उपलब्ध अंग्रेज़ी साक्षी का वाक्य स्वयं अस्पष्ट है और यूनानी समीक्षा लंबित है, इसलिए निर्णायक विस्तार उचित नहीं।
- issue: परमेश्वर को ‘बदले में’ देना
  choice: लेन-देन का रूपक बनाए रखा, फिर पाठ के अपने उत्तर ‘सच्चे हृदय से मन फिराना’ से स्पष्ट किया।
  alternative: ‘कृतज्ञता प्रकट करें’ या ‘अपना कर्तव्य निभाएँ।’
  rationale: मूल की चिकित्सक और प्रतिदान संबंधी रूपक-श्रृंखला को नैतिक सामान्यीकरण से बचाया गया।
- issue: ‘पुत्रों के रूप में स्वीकार करें’
  choice: पुत्रों
  alternative: संतान
  rationale: प्राचीन पाठ के पारिवारिक और उत्तराधिकार-सदृश धार्मिक स्वर को बनाए रखने हेतु ‘पुत्रों’ रखा गया; इसे लिंग-निरपेक्ष व्याख्या में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण उपदेशात्मक शैली अपनाई गई है। ‘देह’, ‘मन फिराना’, ‘प्रतिफल’ और ‘वैद्य’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए प्राचीन धार्मिक स्वर बनाए रखते हैं। मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी और अंग्रेज़ी POB पर आधारित है; यूनानी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण संदिग्ध स्थानों पर संयम और टिप्पणियों का उपयोग किया गया है।
