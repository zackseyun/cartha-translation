  yaml_path: translation/extra_canonical/2_clement/004.yaml
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
translation:
  language: hi
  text: '**2 क्लेमेंट 4**


    इसलिए हम उसे केवल “प्रभु” कहकर न पुकारें, क्योंकि इससे हमारा उद्धार नहीं होगा।


    क्योंकि वह कहता है, “हर वह व्यक्ति जो मुझसे ‘प्रभु’ कहता है, उद्धार नहीं पाएगा, बल्कि वह जो धार्मिकता के काम करता है।”[a]


    इसलिए, भाइयो, हम अपने कामों से उसे स्वीकार करें—एक-दूसरे से प्रेम करके, व्यभिचार न करके, एक-दूसरे की बुराई न करके और ईर्ष्या न करके; बल्कि संयमी, दयालु और कृपालु बनकर। हमें एक-दूसरे के दुःख-सुख में सहभागी होना चाहिए और लोभी नहीं होना चाहिए। इन्हीं कामों से हम उसे स्वीकार करें, इनके विपरीत कामों से नहीं।


    और हमें मनुष्यों से नहीं, बल्कि परमेश्वर से डरना चाहिए।


    इसी कारण प्रभु ने कहा, “यदि तुम मेरे साथ मेरी गोद में इकट्ठे भी हो, पर मेरी आज्ञाओं का पालन नहीं करते, तो मैं तुम्हें दूर कर दूँगा और तुमसे कहूँगा, ‘मुझसे दूर हो जाओ। मैं नहीं जानता कि तुम कहाँ से हो—तुम अधर्म करनेवालो।’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन मत्ती 7:21 की परंपरा से निकटता रखता है, पर यहाँ शब्दावली ‘धार्मिकता के काम करता है’ के रूप में दी गई है।
    reason: पाठक को सुसमाचार-संबंध का संकेत देना और भिन्न शब्दावली को स्पष्ट करना।
  - marker: b
    text: यह कथन कई प्रभु-वचनों की भाषा से मिलता-जुलता है; इसका ठीक यही संयुक्त रूप प्रामाणिक सुसमाचारों में नहीं मिलता। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; यूनानी पाठ की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: संभावित मिश्रित या अप्रामाणिक उद्धरण तथा स्रोत-साक्ष्य की सीमा को ईमानदारी से बताना।
lexical_decisions:
- source_word: Lord
  choice: प्रभु
  rationale: यह सामान्य, गरिमापूर्ण और आरंभिक मसीही प्रभु-संबोधन का स्वाभाविक हिन्दी रूप है।
- source_word: doeth righteousness
  choice: धार्मिकता के काम करता है
  rationale: ‘धार्मिकता करता है’ की स्रोत-समीपता बनाए रखते हुए आधुनिक हिन्दी में अर्थ स्पष्ट करने के लिए ‘के काम’ जोड़ा गया है।
- source_word: confess Him
  choice: उसे स्वीकार करें
  rationale: प्रसंग केवल मौखिक अंगीकार नहीं, बल्कि आचरण द्वारा निष्ठा प्रकट करने पर बल देता है; ‘स्वीकार करें’ हिन्दी में दोनों पक्षों को समेटता है।
- source_word: temperate
  choice: संयमी
  rationale: आत्म-संयम और नियंत्रित आचरण का संक्षिप्त तथा स्वाभाविक हिन्दी रूप।
- source_word: fellow-feeling
  choice: एक-दूसरे के दुःख-सुख में सहभागी
  rationale: शाब्दिक ‘सहानुभूति’ से अधिक व्यापक पारस्परिक संवेदना और सहभागिता व्यक्त होती है।
- source_word: covetous
  choice: लोभी
  rationale: दूसरों की वस्तु पाने की लालसा और धनलिप्सा दोनों को सामान्य हिन्दी में व्यक्त करता है।
- source_word: in My bosom
  choice: मेरी गोद में
  rationale: निकटता और आश्रय की देहात्मक उपमा को बदले बिना स्वाभाविक हिन्दी में रखा गया है।
- source_word: workers of iniquity
  choice: अधर्म करनेवालो
  rationale: व्यक्तियों की पहचान को उनके निरंतर अधर्मी आचरण से जोड़ने वाली अभिव्यक्ति सुरक्षित रहती है।
theological_decisions:
- issue: उद्धार और धार्मिक कर्मों का संबंध
  choice: “उद्धार नहीं पाएगा, बल्कि वह जो धार्मिकता के काम करता है” को सीधे रखा गया
  alternative: इसे केवल वास्तविक विश्वास के प्रमाण के रूप में समझाकर अनुवाद करना
  rationale: पाठ की नैतिक और उद्धार-संबंधी तीक्ष्णता को किसी विशेष धर्मवैज्ञानिक व्यवस्था के अनुसार नरम या स्पष्ट नहीं किया गया।
- issue: ‘उसे’ का संदर्भ
  choice: सर्वनाम को सर्वनाम ही रखा गया
  alternative: हर स्थान पर ‘यीशु’ या ‘मसीह’ जोड़ना
  rationale: उपलब्ध साक्ष्य में ‘Lord/Him’ है; स्पष्ट नाम जोड़ना स्रोत से आगे जाना होता।
- issue: आज्ञापालन न करने वालों का अस्वीकार
  choice: चेतावनी को बिना शर्त और प्रत्यक्ष रूप में रखा गया
  alternative: इसे केवल नाममात्र के विश्वासियों या किसी खास समूह तक सीमित करना
  rationale: पाठ स्वयं ऐसी सीमा स्पष्ट नहीं करता, इसलिए उसकी व्यापक चेतावनी और तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘भाइयो’ से प्राचीन सामुदायिक संबोधन रखा गया है। वाक्य-रचना को हिन्दी के स्वाभाविक प्रवाह के अनुसार सँवारा गया है, जबकि दोहराव, नैतिक आग्रह और कठोर चेतावनी सुरक्षित रखी गई है। प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण विवादास्पद सूक्ष्मताओं पर अत्यधिक निश्चितता से बचा गया है।
