  revised_text: 'मैंने कहा, “मेरे प्रभु, मुझे इन शासक शक्तियों की [सामर्थ्य] के विषय में समझाइए। वे [कैसे] अस्तित्व में आईं? वे किस प्रकार के तत्त्व और किस पदार्थ से बनीं? उन्हें और उनकी सामर्थ्य को किसने रचा?”[a]


    महान स्वर्गदूत एलेलेथ, जो बुद्धि है, ने मुझसे कहा, “अविनाशिता अनंत एयोन के भीतर निवास करती है। सोफिया, जिसे पिस्तिस कहा जाता है, ने अपने सहचर से अलग, अपने ही बल पर कुछ रचने की इच्छा की; और जो उसने उत्पन्न किया, उसका उद्गम ऊपर से था।


    “ऊपरी लोक और नीचे के एयोन के बीच एक परदा है। उस परदे के नीचे एक छाया उत्पन्न हुई; वह छाया पदार्थ बन गई और एक अलग स्थान पर जा पड़ी।


    “उसकी उत्पन्न की हुई वस्तु बढ़कर एक भौतिक रूप बन गई, जो गर्भपात हुए भ्रूण के समान थी। उसका आकार छाया से गढ़ा गया, और वह सिंह के समान एक घमंडी पशु बन गई। वह उभयलिंगी था, जैसा मैं पहले बता चुका हूँ, क्योंकि उसका उद्गम पदार्थ से हुआ था।


    “उसने अपनी आँखें खोलीं, पदार्थ की विशाल, असीम राशि को निहारते हुए। वह घमंड से भर गया और बोला, ‘मैं परमेश्वर हूँ, और मेरे सिवा कुछ भी अस्तित्व में नहीं है।’


    “यह कहकर उसने समग्रता के विरुद्ध पाप किया। तब परम शासन के स्थान के ऊपर से एक वाणी निकली और बोली, ‘तू भूल में है, समाएल’—जिसका अर्थ है ‘अंधा देवता।’[b]


    “उसने कहा, ‘यदि मुझसे पहले कोई और अस्तित्व में है, तो उसे मुझे दिखा।’


    “सोफिया ने तुरंत अपनी उँगली बढ़ाकर पदार्थ में प्रकाश प्रविष्ट कराया और उस प्रकाश का पीछा करते हुए नीचे अराजकता के स्थान तक गई। फिर वह ऊपर अपने प्रकाश में लौट गई, और अंधकार फिर से पदार्थ पर [छा गया]।[c]


    “इस उभयलिंगी शासक ने अपने लिए एक विशाल क्षेत्र, एक असीम विस्तार बनाया।


    “[लुप्त पाठ] उसने अपने लिए संतान उत्पन्न करने का विचार किया और अपने लिए सात संतानें उत्पन्न कीं, जो अपने उत्पत्तिकर्ता के समान उभयलिंगी थीं।[d]


    “उसने अपनी संतानों से कहा, ‘मैं समग्रता का परमेश्वर हूँ।’


    “पिस्तिस सोफिया की पुत्री ज़ोए ने पुकारकर उससे कहा, ‘तू भूल में है, सक्ला,’ जिसका दूसरा नाम यल्दाबाओथ है। ज़ोए ने उसके मुख पर फूँक मारी। उसकी श्वास उसके लिए अग्नि का एक स्वर्गदूत बन गई; और उस स्वर्गदूत ने यल्दाबाओथ को बाँधकर अथाह गहराई के नीचे तारतारोस में फेंक दिया।”[e]'
