translation:
  language: hi
  text: 'मैंने कहा, “मेरे प्रभु, मुझे इन शासक शक्तियों की [सामर्थ्य] के विषय में समझाइए। वे [कैसे] अस्तित्व में आईं? वे किस प्रकार के तत्त्व और किस पदार्थ से बनीं? उन्हें और उनकी सामर्थ्य को किसने रचा?”[a]


    महान स्वर्गदूत एलेलेथ, जो बुद्धि है, ने मुझसे कहा, “अविनाशिता अनंत युगों में निवास करती है। सोफिया, जिसे पिस्तिस कहा जाता है, ने अपने सहचर से अलग, अपने ही बल पर कुछ रचने की इच्छा की; और जो उसने उत्पन्न किया, उसका उद्गम ऊपर से था।


    “ऊपरी लोक और नीचे के युगों के बीच एक परदा है। उस परदे के नीचे एक छाया उत्पन्न हुई; वह छाया पदार्थ बन गई और एक अलग स्थान पर जा पड़ी।


    “उसकी उत्पन्न की हुई वस्तु बढ़कर एक भौतिक रूप बन गई, जो अधूरे गर्भपात से निकले भ्रूण जैसी थी। उसका आकार छाया से गढ़ा गया, और वह सिंह के समान एक घमंडी पशु बन गई। वह उभयलिंगी था, जैसा मैं पहले बता चुका हूँ, क्योंकि उसका उद्गम पदार्थ से हुआ था।


    “उसने अपनी आँखें खोलीं और पदार्थ की विशाल, असीम राशि को देखा। वह घमंड से भर गया और बोला, ‘मैं परमेश्वर हूँ, और मेरे सिवा कुछ भी अस्तित्व में नहीं है।’


    “यह कहकर उसने समग्रता के विरुद्ध पाप किया। तब परम शासन के स्थान के ऊपर से एक वाणी निकली और बोली, ‘तू भूल में है, समाएल’—जिसका अर्थ है ‘अंधा देवता।’[b]


    “उसने कहा, ‘यदि मुझसे पहले कोई और अस्तित्व में है, तो उसे मुझे दिखा।’


    “सोफिया ने तुरंत अपनी उँगली बढ़ाकर पदार्थ में प्रकाश प्रविष्ट कराया और उसके पीछे नीचे अराजकता के स्थान तक गई। फिर वह ऊपर अपने प्रकाश में लौट गई, और अंधकार फिर से पदार्थ पर [छा गया]।[c]


    “इस उभयलिंगी शासक ने अपने लिए एक विशाल राज्य, एक असीम विस्तार बनाया।


    “[लुप्त पाठ] उसने अपने लिए संतान उत्पन्न करने का विचार किया और अपने लिए सात संतानें उत्पन्न कीं, जो अपने जनक के समान उभयलिंगी थीं।[d]


    “उसने अपनी संतानों से कहा, ‘मैं समग्रता का परमेश्वर हूँ।’


    “पिस्तिस सोफिया की बेटी ज़ोए ने पुकारकर उससे कहा, ‘तू भूल में है, सक्ला,’ जिसका दूसरा नाम यल्दाबाओथ है। ज़ोए ने उसके मुख पर फूँक मारी। उसकी श्वास उसके लिए अग्नि का एक स्वर्गदूत बन गई; और उस स्वर्गदूत ने यल्दाबाओथ को बाँधकर अथाह गहराई के नीचे तारतारोस में फेंक दिया।”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिए शब्द क्षतिग्रस्त या पुनर्निर्मित पाठ का संकेत हैं। इस वाक्य के अंत में पांडुलिपि का पृष्ठ-संकेत था, जिसे मुख्य पाठ में नहीं रखा गया।
    reason: पाठ-साक्ष्य की अनिश्चितता और संपादकीय पुनर्स्थापन को पारदर्शी बनाना।
  - marker: b
    text: ‘समाएल’ का अर्थ पाठ स्वयं ‘अंधा देवता’ बताता है। ‘समग्रता’ यहाँ उस पूर्ण दैवी वास्तविकता के लिए प्रयुक्त तकनीकी पद हो सकता है जिसे यह शासक नहीं पहचानता।
    reason: नाम की आंतरिक व्याख्या और तकनीकी ब्रह्मांड-विज्ञान संबंधी पद स्पष्ट करना।
  - marker: c
    text: ‘छा गया’ क्षतिग्रस्त पाठ की संभावित पूर्ति है; मूल साक्ष्य में क्रिया अनिश्चित है।
    reason: वाक्य की पांडुलिपीय अपूर्णता बनाए रखना।
  - marker: d
    text: इस वाक्य से पहले पांडुलिपि में पाठ लुप्त है।
    reason: खाली कोष्ठक को पाठक के लिए अर्थपूर्ण क्षति-संकेत में बदलना।
  - marker: e
    text: तारतारोस यूनानी परंपरा में अत्यंत गहरे अधोलोक का नाम है; यहाँ उसे सामान्य ‘नरक’ कहकर समतल नहीं किया गया है।
    reason: विशिष्ट ब्रह्मांडीय स्थान और उसकी सांस्कृतिक पृष्ठभूमि सुरक्षित रखना।
lexical_decisions:
- source_word: authorities / archon
  choice: शासक शक्तियाँ; शासक
  rationale: आरंभ में बहुवचन ‘authorities’ के लिए अर्थ-स्पष्ट पद रखा गया है, जबकि बाद के विशिष्ट archon के लिए संक्षिप्त ‘शासक’; इससे एक ही अवधारणा का शासन-संबंधी अर्थ बना रहता है।
- source_word: Indestructibility
  choice: अविनाशिता
  rationale: व्यक्तित्वसूचक अमूर्त सत्ता के रूप में प्रयुक्त शब्द का औपचारिक और स्वाभाविक हिन्दी रूप।
- source_word: aeons
  choice: युग
  rationale: स्रोत की ब्रह्मांड-विज्ञान संबंधी अस्पष्टता बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य रूप; इसे केवल कालखंड या केवल दैवी सत्ता के रूप में निश्चित नहीं किया गया।
- source_word: Sophia / Pistis / Zoe
  choice: सोफिया / पिस्तिस / ज़ोए
  rationale: विशिष्ट नामों को अर्थानुवाद करने के बजाय लिप्यंतरित किया गया; जहाँ स्रोत स्वयं ‘Wisdom’ या नाम का अर्थ बताता है, वहाँ उसे पाठ में रखा गया।
- source_word: matter / substance
  choice: पदार्थ / तत्त्व
  rationale: प्रश्न में आए दोनों निकटार्थी दार्शनिक शब्दों का भेद यथासंभव सुरक्षित रखा गया।
- source_word: androgynous
  choice: उभयलिंगी
  rationale: स्त्री और पुरुष दोनों लक्षण रखने की स्रोतगत धारणा को स्पष्ट, तटस्थ और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: the All
  choice: समग्रता
  rationale: ज्ञानवादी ब्रह्मांड-विज्ञान के तकनीकी आशय को केवल ‘सब लोग’ या ‘संसार’ में सीमित किए बिना सुरक्षित रखता है।
- source_word: chaos
  choice: अराजकता का स्थान
  rationale: यहाँ ब्रह्मांडीय क्षेत्र का संकेत है; ‘अव्यवस्था’ मात्र कहने से स्थानगत अर्थ खो सकता था।
- source_word: Tartaros
  choice: तारतारोस
  rationale: विशिष्ट पौराणिक अधोलोक का नाम होने के कारण लिप्यंतरण किया गया, सामान्य ‘नरक’ नहीं।
theological_decisions:
- issue: ‘I am God’ में deity पद का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर / देवता
  rationale: वक्ता के सर्वोच्चता-दावे की तीव्रता बनाए रखी गई है; आगे ‘अंधा देवता’ में अर्थ-व्याख्या के कारण अलग सामान्य पद रखा गया है। इससे पाठ स्वयं उस दावे का खंडन कर सकता है, अनुवाद पहले से निर्णय नहीं सुनाता।
- issue: सोफिया की स्वतंत्र सृष्टि
  choice: ‘अपने सहचर से अलग, अपने ही बल पर’
  alternative: ‘अपने सहचर की सहमति के बिना’
  rationale: स्रोत केवल independent/apart का संकेत देता है; असहमति या अवज्ञा का अतिरिक्त नैतिक निष्कर्ष नहीं जोड़ा गया।
- issue: उत्पन्न सत्ता के सर्वनाम और लिंग
  choice: आरंभ में ‘वस्तु/वह’, आगे स्रोतानुसार पुल्लिंग ‘वह/उसने’
  alternative: पूरे अनुच्छेद में केवल पुल्लिंग या केवल नपुंसक रूप
  rationale: विकसित होते भौतिक उत्पाद से व्यक्तिवाची शासक की ओर पाठ में होने वाले संक्रमण और उसकी उभयलिंगी प्रकृति—दोनों को सुरक्षित रखा गया।
- issue: ‘sinned against the All’
  choice: ‘समग्रता के विरुद्ध पाप किया’
  alternative: ‘सर्वोच्च परमेश्वर के विरुद्ध पाप किया’
  rationale: ‘the All’ को किसी एक व्यवस्थित धर्मशास्त्रीय पहचान में नहीं बदला गया।
- issue: ज़ोए की श्वास और अग्निदूत
  choice: ‘उसकी श्वास उसके लिए अग्नि का एक स्वर्गदूत बन गई’
  alternative: ‘उसकी श्वास स्वयं अग्निदूत बन गई’
  rationale: लाभार्थक/संबंधसूचक वाक्यांश को बनाए रखा गया और श्वास व दूत की पहचान को स्रोत से अधिक निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। तकनीकी ज्ञानवादी नाम लिप्यंतरित हैं और मुख्य अवधारणाओं को जहाँ संभव हो अर्थपूर्ण हिन्दी दी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण पुनर्निर्मित अंशों, पाठ-क्षति और संभावित तकनीकी अर्थों को निर्णायक ढंग से सामान्यीकृत नहीं किया गया।
