base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/007.yaml
  text: 'The rulers plotted together and said, “Come, let us cause a flood with our own hands and destroy all flesh, humans and animals.”


    When the ruler of the forces learned of their plot, he said to Noah, “Make yourself an ark from wood that does not rot, and hide in it—you, your children, the animals, and the birds of the sky, both small and large—placing it on Mount Sir.”


    Orea [3] then approached Noah, wanting to board the ark. When he refused her, she blew on the ark, and it was devoured by fire. So he made an ark a second time.'
translation:
  language: hi
  text: 'शासकों ने आपस में षड्यंत्र रचा और कहा, “आओ, हम अपने ही हाथों से जलप्रलय लाएँ और सभी देहधारियों—मनुष्यों और पशुओं—का नाश कर दें।”


    जब शक्तियों के शासक को उनके षड्यंत्र का पता चला, तो उसने नूह से कहा, “अपने लिए ऐसी लकड़ी से एक जहाज़ बनाओ जो सड़ती नहीं, और उसमें छिप जाओ—तुम, तुम्हारे बच्चे, पशु और आकाश के पक्षी, छोटे और बड़े सभी—और उसे सीर पर्वत पर रखो।”


    तब ओरेआ [3] जहाज़ पर चढ़ने की इच्छा से नूह के पास आई। जब नूह ने उसे मना कर दिया, तो उसने जहाज़ पर फूँक मारी, और वह आग में भस्म हो गया। इसलिए नूह ने दूसरी बार एक जहाज़ बनाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '3'
    text: उपलब्ध अंग्रेज़ी साक्ष्य में नाम के बाद “[3]” दिया गया है। यह पांडुलिपीय अथवा संपादकीय संकेत हो सकता है; इसका कार्य उपलब्ध सामग्री से निश्चित नहीं है। नाम का रूप ‘ओरेआ’ अंग्रेज़ी साक्ष्य के आधार पर लिप्यंतरित है।
    reason: स्रोत-पाठ में दिए गए [3] एंकर को उसी संख्या के साथ सुरक्षित रखना और उसके अनिश्चित स्वरूप को बताना आवश्यक है।
lexical_decisions:
- source_word: archons
  choice: शासक
  rationale: नाग हम्मादी साहित्य में यह पद ब्रह्मांडीय सत्ताधारियों के लिए प्रयुक्त होता है। ‘शासक’ इसका सामान्य और संप्रदाय-निरपेक्ष अर्थ रखता है; केवल लिप्यंतरण ‘आर्खोन’ साधारण पाठक के लिए अस्पष्ट होता।
- source_word: all flesh
  choice: समस्त देहधारी
  rationale: यह अभिव्यक्ति मनुष्यों और पशुओं दोनों को समेटती है और ‘सारा मांस’ जैसे अप्राकृतिक शाब्दिक अनुवाद से बचते हुए मूल की व्यापकता बनाए रखती है।
- source_word: archon of the forces
  choice: सेनाओं का शासक
  rationale: ‘forces’ की सत्ता अथवा सैन्य समूह—दोनों संभावित छवियों में से सैन्य-सामूहिक अर्थ को सहज हिंदी में रखा गया है, पर किसी विशिष्ट देवदूतीय पद की पहचान नहीं थोपी गई।
- source_word: ark
  choice: जहाज़
  rationale: बाढ़-कथा के संदर्भ में ‘जहाज़’ आधुनिक पाठक के लिए स्वाभाविक है और बड़े जलयान का अर्थ स्पष्ट करता है।
- source_word: wood that does not rot
  choice: ऐसी लकड़ी जो सड़ती नहीं
  rationale: पदार्थ के बारे में मूल वर्णन को बिना किसी अनुमानित वृक्ष-प्रजाति जोड़े सीधे रखा गया है।
- source_word: Mount Sir
  choice: सीर पर्वत
  rationale: स्थान-नाम का ध्वन्यात्मक रूप रखा गया है; इसे किसी अधिक परिचित बाइबलीय पर्वत से नहीं मिलाया गया।
- source_word: blew on the ark
  choice: जहाज़ पर फूँक मारी
  rationale: असामान्य क्रिया को ज्यों का त्यों रखा गया है; आग लगने की कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: जलप्रलय की योजना बनाने वालों और नूह को चेताने वाले की पहचान
  choice: बहुवचन ‘शासकों’ और एकवचन ‘सेनाओं के शासक’ का भेद बनाए रखा गया
  alternative: चेतावनी देने वाले को परमेश्वर या किसी नामित देवदूत के रूप में स्पष्ट करना
  rationale: उपलब्ध साक्ष्य अलग पदों का प्रयोग करता है, पर चेतावनी देने वाले की अंतिम धार्मिक पहचान यहाँ स्पष्ट नहीं करता; इसलिए तनाव और अस्पष्टता सुरक्षित रखी गई।
- issue: ओरिया द्वारा जहाज़ जलाने की घटना
  choice: फूँक मारने और आग में भस्म होने के क्रम को बिना स्पष्टीकरण रखा गया
  alternative: इसे चमत्कार, जादुई शक्ति या दैवी सामर्थ्य कहना
  rationale: पाठ केवल घटना बताता है; उसकी शक्ति का धार्मिक स्रोत निर्धारित करना व्याख्यात्मक जोड़ होता।
- issue: नूह द्वारा ओरिया को अस्वीकार करना
  choice: ‘उसने उसे चढ़ने नहीं दिया’
  alternative: नूह के निर्णय को नैतिक रूप से उचित या अनुचित ठहराना
  rationale: मूल घटना बताता है, उसका नैतिक मूल्यांकन नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण रखी गई है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है। इसलिए विवादित पदों में अनावश्यक निश्चितता से बचते हुए अर्थगत संरचना सुरक्षित रखी गई है।
