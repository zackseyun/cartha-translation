  text: 'The archons brought Adam and placed him in the garden so that he might tend it and guard it. They commanded him, saying, “You may eat from [all] the trees in the garden, but do not eat from the tree of the knowledge of good and evil. Do not [touch] it, because on the day you eat from it, you will certainly die.”


    [This] they [said to him], yet they did not understand what [they had said] to him. Instead, it was according to the will of the Father [] that they spoke this way, so that Adam would indeed eat and so that Adam would <not> regard them as a thoroughly material person would.


    The archons plotted with one another and said, “Come, let us cause a deep sleep to fall upon Adam,” and Adam fell asleep. The deep sleep they caused to fall upon him, which he slept, is ignorance. They opened his side, like a living woman. Then they closed his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him and spoke to him, saying, “Arise, Adam.”


    When he looked at her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart speaking with him, they became aroused and lusted after her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. She, however, laughed at them because of their stupidity and blindness. As they seized her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. Thus they brought judgment upon themselves by means of the form they had modeled in their own image.'
translation:
  language: hi
  text: 'अधिपति आदम को ले आए और उसे वाटिका में रख दिया, ताकि वह उसकी देखभाल और रक्षा करे। उन्होंने उसे आज्ञा दी और कहा, “तुम वाटिका के [सभी] वृक्षों में से खा सकते हो, पर भले और बुरे के ज्ञान के वृक्ष में से मत खाना। उसे [छूना] भी मत, क्योंकि जिस दिन तुम उसमें से खाओगे, उस दिन तुम निश्चय मर जाओगे।”[a]


    [यह] उन्होंने [उससे कहा], फिर भी वे नहीं समझते थे कि उन्होंने [उससे क्या कहा था]। बल्कि पिता की इच्छा के अनुसार [] उन्होंने इस ढंग से कहा, ताकि आदम सचमुच खाए और आदम उनके विषय में वैसा <न> सोचे जैसा कोई पूरी तरह भौतिक मनुष्य सोचता।[b]


    अधिपतियों ने आपस में षड्यंत्र रचा और कहा, “आओ, हम आदम पर गहरी नींद डालें,” और आदम सो गया। जो गहरी नींद उन्होंने उस पर डाली और जिसे वह सोया, वह अज्ञान है। उन्होंने उसका पार्श्व खोल दिया, मानो कोई जीवित स्त्री हो। फिर उन्होंने उसकी जगह उसके पार्श्व को मांस से बंद कर दिया, और आदम केवल प्राणमय बन गया।[c]


    आत्मिक स्त्री उसके पास आई और उससे बोली, “उठो, आदम।”


    जब उसने उसकी ओर देखा, तो कहा, “तुमने मुझे जीवन दिया है। तुम जीवितों की माता कहलाओगी, क्योंकि वही मेरी माता है। वही वैद्य है—वह स्त्री, जिसने जन्म दिया है।”[d]


    वे सत्ताधारी अपने आदम के पास आए। जब उन्होंने उसकी स्त्री-प्रतिरूप को उससे बात करते देखा, तो वे कामोत्तेजित हो गए और उसके लिए लालसा करने लगे। उन्होंने एक-दूसरे से कहा, “आओ, हम उसमें अपना वीर्य बोएँ,” और वे उसके पीछे दौड़े। पर वह उनकी मूर्खता और अंधेपन के कारण उन पर हँसी। जब उन्होंने उसे पकड़ लिया, तो वह एक वृक्ष बन गई; और उसने अपने ही एक छायामय प्रतिरूप को उनके सामने रख दिया। उन्होंने उसे अत्यंत घृणित रीति से दूषित किया और उसकी वाणी की मुहर को दूषित किया। इस प्रकार अपने ही स्वरूप में गढ़ी हुई आकृति के द्वारा वे अपने ऊपर न्याय ले आए।[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वर्ग कोष्ठक उपलब्ध अंग्रेज़ी गवाह में संपादकीय पूर्ति या अनिश्चित पाठ को दर्शाते हैं; इसलिए [सभी] और [छूना] को यथावत चिह्नित किया गया है।
    reason: पांडुलिपीय अनिश्चितता और संपादकीय पुनर्निर्माण को पाठक के सामने रखना।
  - marker: b
    text: खाली [] गवाह में रिक्ति या अपठनीय अंश का संकेत है। कोणीय कोष्ठक वाला <न> संपादकीय सुधार है; उसके बिना वाक्य का अर्थ उलट जाता। ‘पूरी तरह भौतिक मनुष्य’ का आशय पाठ में स्पष्ट नहीं किया गया है।
    reason: महत्त्वपूर्ण पाठ-समस्या और अर्थगत तनाव को पारदर्शी बनाना।
  - marker: c
    text: ‘प्राणमय’ यहाँ ‘आत्मिक’ का पर्याय नहीं, बल्कि उससे भिन्न श्रेणी के लिए प्रयुक्त है। ‘उसका पार्श्व खोल दिया, मानो कोई जीवित स्त्री हो’ वाक्य मूल गवाह में भी कठिन और अस्पष्ट है।
    reason: विशिष्ट मानव-विज्ञान संबंधी शब्दावली और कठिन वाक्य को अतिव्याख्या से बचाना।
  - marker: d
    text: यहाँ संबोधन ‘तुम’ से वर्णन ‘वही/वह’ में बदलता है। उपलब्ध गवाह का यह परिवर्तन सुरक्षित रखा गया है; संभव है कि पाठ स्त्री के किसी उच्चतर रूप या सत्ता की ओर संकेत करता हो, पर यह निश्चित नहीं है।
    reason: सर्वनामगत अस्पष्टता और संभावित धर्मवैचारिक परत को बनाए रखना।
  - marker: e
    text: ‘वाणी की मुहर’ और ‘अपने ही स्वरूप में गढ़ी हुई आकृति’ प्रतीकात्मक किंतु अस्पष्ट पद हैं। अनुवाद यह निश्चित नहीं करता कि ‘मुहर’ आवाज़, पहचान, प्रतिरूप या किसी अन्य चिह्न को दर्शाती है।
    reason: दुर्बोध रूपक को किसी एक व्याख्या में सीमित न करना।
lexical_decisions:
- source_word: archons / authorities
  choice: अधिपति; अंतिम अनुच्छेद में ‘सत्ताधारी’
  rationale: कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित है; उपलब्ध गवाह के दो अंग्रेज़ी पदों का भेद यथासंभव रखा गया है। ‘अधिपति’ इस ग्रंथ के विशिष्ट ब्रह्मांडीय शासकों के लिए गरिमापूर्ण और बोधगम्य है, जबकि ‘सत्ताधारी’ authorities का स्वाभाविक समकक्ष है।
- source_word: garden
  choice: वाटिका
  rationale: अदन-वृत्तांत की औपचारिक साहित्यिक ध्वनि रखते हुए आधुनिक पाठक के लिए स्पष्ट।
- source_word: knowledge of good and evil
  choice: भले और बुरे का ज्ञान
  rationale: मुहावरे की द्विध्रुवीय नैतिक संरचना को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: soulish
  choice: केवल प्राणमय
  rationale: ‘आत्मिक’ से भेद और पाठ की विवादास्पद मानव-रचना को बनाए रखता है; इसे सामान्य ‘जीवित’ या doctrinal ‘शारीरिक’ में नहीं बदला गया।
- source_word: spiritual woman
  choice: आत्मिक स्त्री
  rationale: spiritual और soulish के जानबूझकर रखे गए विरोध को हिंदी में स्पष्ट रखता है।
- source_word: female counterpart
  choice: स्त्री-प्रतिरूप
  rationale: सिर्फ ‘पत्नी’ या ‘स्त्री’ कहने से मूल की counterpart-संबंधी अवधारणा खो जाती।
- source_word: signet of her voice
  choice: उसकी वाणी की मुहर
  rationale: असामान्य और संभवतः प्रतीकात्मक अभिव्यक्ति को समझाकर समाप्त करने के बजाय औपचारिक रूप में सुरक्षित रखा गया।
- source_word: modeled / shape
  choice: गढ़ी हुई आकृति
  rationale: निर्माण और रूप—दोनों भाव बनाए गए, बिना यह निश्चित किए कि संकेत किस सत्ता या प्रतिरूप की ओर है।
theological_decisions:
- issue: पिता की इच्छा और अधिपतियों की अनभिज्ञता
  choice: 'दोनों कथनों को साथ रखा गया: अधिपति नहीं समझते, फिर भी उनका कथन पिता की इच्छा के अनुसार है।'
  alternative: इसे पिता द्वारा अधिपतियों को प्रत्यक्ष आदेश या छल के रूप में स्पष्ट करना।
  rationale: पाठ की दैवी इच्छा, अधिपतियों की अज्ञानता और आदम के खाने के बीच का तनाव वास्तविक है; अनुवाद इसे हल नहीं करता।
- issue: आदम का ‘soulish’ हो जाना
  choice: ‘केवल प्राणमय’
  alternative: ‘केवल प्राणी’, ‘मानसिक’, ‘शारीरिक’ या ‘जीवधारी’।
  rationale: वैकल्पिक शब्द पाठ की विशिष्ट त्रिस्तरीय/द्विस्तरीय मानव-विज्ञान संबंधी भाषा को सामान्य या संप्रदायगत बना सकते हैं।
- issue: स्त्री की पहचान और सर्वनाम परिवर्तन
  choice: ‘तुम… क्योंकि वही मेरी माता है। वही वैद्य है…’
  alternative: सभी वाक्यों में लगातार द्वितीय पुरुष या लगातार तृतीय पुरुष।
  rationale: उपलब्ध गवाह में ‘you’ से ‘she’ का अचानक परिवर्तन है। इसे व्याकरणिक त्रुटि मानकर चुपचाप समतल नहीं किया गया।
- issue: यौन हिंसा और प्रतिरूप
  choice: 'प्रत्यक्ष पर गैर-संवेदी भाषा: ‘वीर्य बोएँ’, ‘दूषित किया’।'
  alternative: शिष्टोक्ति से घटना को अस्पष्ट करना या अधिक चित्रात्मक भाषा जोड़ना।
  rationale: पाठ की हिंसा और नैतिक निंदा दोनों स्पष्ट रहें, पर अनावश्यक विस्तार न हो।
- issue: अंतिम न्याय का कर्ता और माध्यम
  choice: ‘अपने ही स्वरूप में गढ़ी हुई आकृति के द्वारा वे अपने ऊपर न्याय ले आए।’
  alternative: इसे बाहरी दंडदाता द्वारा दिए गए न्याय के रूप में प्रस्तुत करना।
  rationale: मूल गवाह आत्म-आरोपित परिणाम और प्रतिरूप के माध्यम को जोड़ता है; अनुवाद उसी अस्पष्ट कार्य-कारण को रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण कथात्मक शैली अपनाई गई है। बाइबिलीय प्रतिध्वनियों के लिए ‘वाटिका’, ‘भले और बुरे का ज्ञान’, ‘जीवितों की माता’ और ‘निश्चय मर जाओगे’ जैसे परिचित किंतु वर्तमान रूप चुने गए हैं। हिंसक और यौन सामग्री को स्पष्ट, संयत और गैर-संवेदी रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी गवाह पर आधारित अस्थायी स्रोत-समीक्षित रूप है; नाग हम्मादी कोडेक्स II,4 के कॉप्टिक पाठ से प्रत्यक्ष मिलान अभी अपेक्षित है।
