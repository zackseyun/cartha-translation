  revised_text: 'अधिपति आदम को ले आए और उसे वाटिका में रख दिया, ताकि वह उसकी देखभाल और रक्षा करे। उन्होंने उसे आज्ञा दी और कहा, “तुम वाटिका के [सभी] वृक्षों में से खा सकते हो, पर भले और बुरे के ज्ञान के वृक्ष में से मत खाना। उसे [छूना] भी मत, क्योंकि जिस दिन तुम उसमें से खाओगे, उस दिन तुम निश्चय मर जाओगे।”[a]



    [यह] उन्होंने [उससे कहा], फिर भी वे नहीं समझते थे कि उन्होंने [उससे क्या कहा था]। बल्कि पिता की इच्छा के अनुसार [] उन्होंने इस ढंग से कहा, ताकि आदम सचमुच खाए और आदम उनके विषय में वैसा <न> सोचे जैसा कोई पूरी तरह भौतिक मनुष्य सोचता।[b]



    अधिपतियों ने आपस में षड्यंत्र रचा और कहा, “आओ, हम आदम पर गहरी नींद डालें,” और आदम सो गया। जो गहरी नींद उन्होंने उस पर डाली और जिसे वह सोया, वह अज्ञान है। उन्होंने उसका पार्श्व खोल दिया, मानो कोई जीवित स्त्री हो। फिर उन्होंने उस स्थान को मांस से भरकर बंद कर दिया, और आदम केवल प्राणमय बन गया।[c]



    आत्मिक स्त्री उसके पास आई और उससे बोली, “उठो, आदम।”



    जब उसने उसकी ओर देखा, तो कहा, “तुमने मुझे जीवन दिया है। तुम जीवितों की माता कहलाओगी, क्योंकि वह मेरी माता है। वह वैद्य है—वह स्त्री, जिसने जन्म दिया है।”[d]



    वे सत्ताधारी अपने आदम के पास आए। जब उन्होंने उसकी स्त्री-प्रतिरूप को उससे बात करते देखा, तो वे कामोत्तेजित हो गए और उसकी लालसा करने लगे। उन्होंने एक-दूसरे से कहा, “आओ, हम उसमें अपना वीर्य बोएँ,” और उन्होंने उसका पीछा किया। पर वह उनकी मूर्खता और अंधेपन के कारण उन पर हँसी। जब वे उसे पकड़ने लगे, तो वह एक वृक्ष बन गई; और उसने अपने ही एक छायामय प्रतिरूप को उनके सामने रख दिया। उन्होंने उसे अत्यंत घृणित रीति से दूषित किया और उसकी वाणी की मुहर को दूषित किया। इस प्रकार अपने ही स्वरूप में गढ़ी हुई आकृति के द्वारा वे अपने ऊपर न्याय ले आए।[e]'
