  naturalness: शैली गरिमापूर्ण आधुनिक मानक हिंदी है। ‘उसकी लालसा करने लगे’ और ‘उसका पीछा किया’ अधिक स्वाभाविक तथा स्रोत के निकट हैं। ‘क्योंकि वह मेरी माता है’ गवाह के अनपेक्षित तृतीय-पुरुष परिवर्तन को बिना अनावश्यक बलाघात के रखता है।
