    rationale: ‘बंदी’ कारावास या बंदीकरण का अपेक्षाकृत विशिष्ट भाव दे सकता है; “सीमित कर दिया जाएगा” स्रोत के व्यापक ‘confined’ को बिना अतिरिक्त दृश्य आरोपित किए रखता है।
