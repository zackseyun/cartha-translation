base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/009.yaml
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I have been sent to speak with you and to save you from the hand of the lawless ones. I will also instruct you about your root.”


    As for that angel, I am unable to describe his power. His appearance is like fine gold, and his clothing is like snow. My mouth is truly unable to describe his power or the appearance of his face.


    The great angel Eleleth spoke to me and said, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you (really) think that these archons can exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Moreover, these authorities will be unable to defile you and that generation, because your dwelling is in indestructibility, where the virgin Spirit dwells, who is superior over the authorities of chaos and over their world.”'
translation:
  language: hi
  text: 'स्वर्गदूत ने कहा, “मैं एलेलेथ हूँ—वह महान स्वर्गदूत, बुद्धि, जो पवित्र आत्मा के सामने खड़ा रहता है। मुझे तुम्हारे पास तुमसे बात करने और तुम्हें उन अधर्मियों के हाथ से बचाने के लिए भेजा गया है। मैं तुम्हें तुम्हारी जड़ के विषय में भी शिक्षा दूँगा।”[a]


    उस स्वर्गदूत की सामर्थ्य का वर्णन करना मेरे लिए संभव नहीं है। उसका रूप उत्तम सोने के समान और उसका वस्त्र बर्फ के समान है। सचमुच, मेरा मुँह उसकी सामर्थ्य और उसके मुख के रूप का वर्णन करने में असमर्थ है।


    महान स्वर्गदूत एलेलेथ ने मुझसे कहा, “मैं बुद्धि हूँ—उन चार ज्योतियों में से एक, जो महान अदृश्य आत्मा के सामने खड़ी रहती हैं। क्या तुम सचमुच सोचती हो कि ये शासक तुम पर कोई अधिकार चला सकते हैं?[b] उनमें से एक भी सत्य की जड़ को पराजित नहीं कर सकेगा, क्योंकि वह अंतिम दिनों में सत्य की जड़ के कारण प्रकट हुआ है; और इन सत्ताओं को बंदी बना दिया जाएगा। ये सत्ताएँ तुम्हें और उस पीढ़ी को भी अशुद्ध नहीं कर सकेंगी, क्योंकि तुम्हारा निवास अविनाशिता में है, जहाँ कुँवारी आत्मा निवास करती है, जो अराजकता की सत्ताओं और उनके संसार से श्रेष्ठ है।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “जड़” से वंश, मूल या आध्यात्मिक उद्गम का संकेत हो सकता है; उपलब्ध साक्ष्य इसे और स्पष्ट नहीं करता।
    reason: पारिभाषिक रूप से महत्त्वपूर्ण और बहुअर्थक रूपक को स्पष्ट किए बिना पाठक को संभावित अर्थ-क्षेत्र बताना।
  - marker: b
    text: “शासक” उस पारिभाषिक पद का अनुवाद है जिसे प्रायः “आर्खोन” कहा जाता है; इस रचना में यह संसार से जुड़ी विरोधी अलौकिक सत्ताओं के लिए प्रयुक्त है।
    reason: सामान्य हिन्दी शब्द के पीछे उपस्थित ग्रंथ-विशिष्ट तकनीकी अर्थ बताना।
  - marker: c
    text: “वह ... प्रकट हुआ है” में “वह” किसे सूचित करता है, यह उपलब्ध साक्ष्य में अस्पष्ट है। “उस पीढ़ी” की सटीक पहचान भी यहाँ खुली रहती है।
    reason: सर्वनाम और समूह-संदर्भ की वास्तविक अस्पष्टता को ईमानदारी से सुरक्षित रखना।
lexical_decisions:
- source_word: Wisdom
  choice: बुद्धि
  rationale: व्यक्तित्वयुक्त दैवी सत्ता के रूप में प्रयुक्त पद को सहज और पारंपरिक हिन्दी में रखा गया है; प्रसंग में यह एलेलेथ का परिचय अथवा उपाधि है।
- source_word: root
  choice: जड़
  rationale: रहस्योद्घाटनात्मक पाठ की वंश, मूल या आध्यात्मिक उद्गम संबंधी बहुअर्थकता बनाए रखने के लिए शाब्दिक रूप चुना गया है।
- source_word: archons
  choice: शासक
  rationale: ग्रीक मूल के सत्ता-सूचक पद का अर्थ सामान्य पाठक तक पहुँचाने के लिए ‘शासक’ रखा गया; इसकी विशेष पारिभाषिक भूमिका फुटनोट में स्पष्ट की गई है।
- source_word: authorities
  choice: सत्ताएँ
  rationale: ‘शासक’ से शब्दगत भेद बनाए रखते हुए अलौकिक अधिकार-शक्तियों का संकेत दिया गया है।
- source_word: indestructibility
  choice: अविनाशिता
  rationale: किसी अविनाशी अवस्था या लोक की अमूर्त संज्ञा को सुरक्षित रखा गया है, उसे केवल ‘स्वर्ग’ कहकर व्याख्यायित नहीं किया गया।
- source_word: virgin Spirit
  choice: कुँवारी आत्मा
  rationale: स्रोत-साक्ष्य की विशिष्ट उपाधि को बिना सांप्रदायिक विस्तार के निकट रूप में रखा गया है।
- source_word: chaos
  choice: अराजकता
  rationale: आदिम अथवा ब्रह्मांडीय अव्यवस्था के संकेत को प्राकृतिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘महान स्वर्गदूत बुद्धि’ में एलेलेथ और बुद्धि का संबंध
  choice: “महान स्वर्गदूत, बुद्धि”
  alternative: “बुद्धि का महान स्वर्गदूत”
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में Wisdom एलेलेथ की पहचान/उपाधि प्रतीत होती है; संबंधकारक जोड़कर अलग सत्ता का अर्थ आरोपित नहीं किया गया।
- issue: ‘he has appeared’ का संदर्भ
  choice: पुल्लिंग एकवचन “वह ... प्रकट हुआ है” बनाए रखा
  alternative: इसे स्पष्ट रूप से एलेलेथ, उद्धारकर्ता या सत्य की जड़ से जोड़ना
  rationale: उपलब्ध साक्ष्य में सर्वनाम का पूर्वपद अस्पष्ट है; अनुवाद ने इस वास्तविक संदिग्धता को नहीं सुलझाया।
- issue: ‘that generation’ की पहचान
  choice: “उस पीढ़ी”
  alternative: “सत्य की पीढ़ी” या “तुम्हारा वंश”
  rationale: पाठ जिस समूह की ओर संकेत करता है उसकी पहचान यहाँ स्पष्ट नहीं है, इसलिए व्याख्यात्मक विशेषण नहीं जोड़ा गया।
- issue: ‘your abode is in indestructibility’
  choice: “तुम्हारा निवास अविनाशिता में है”
  alternative: “तुम अविनाशी लोक में रहती हो”
  rationale: अमूर्त और स्थानगत दोनों संभावनाओं के तनाव को यथासंभव सुरक्षित रखा गया है।
