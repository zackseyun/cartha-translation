  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय गद्य। संबोधित व्यक्ति के लिए स्त्रीलिंग क्रिया “सोचती हो” प्रसंगगत वक्ता-संबोधन के अनुरूप रखी गई है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अंतरिम अनुवाद है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
