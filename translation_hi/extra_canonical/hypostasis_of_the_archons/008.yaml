  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध रूप। ‘तू/तेरी’ शत्रुतापूर्ण तथा असमान शक्ति-संबंध वाले सीधे संवाद में रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी अनुवाद है; नाग हम्मादी कोडेक्स II,4 के कॉप्टिक पाठ की प्रत्यक्ष समीक्षा अभी लंबित है।
