lexical_decisions:
- source_word: archons
  choice: प्रधान
  rationale: कॉप्टिक पाठ की प्रत्यक्ष समीक्षा लंबित होने के कारण उपलब्ध साक्षी के तकनीकी पद ‘archons’ को सामान्य सत्ता-सूचक ‘प्रधान’ से व्यक्त किया गया है; इससे उनका शासकीय स्वर बना रहता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं थोपा जाता।
- source_word: female counterpart
  choice: स्त्री-सहचरी
  rationale: ‘स्त्री समकक्ष’ की कठोरता से बचते हुए counterpart के युग्म-संबंध को सुरक्षित रखा गया है; ‘पत्नी’ कहना स्रोत से अधिक निश्चित होता।
- source_word: knew
  choice: जाना
  rationale: मूल साक्षी में ‘know’ की संभावित यौन अर्थच्छाया और नोरिया के आरोप की द्विअर्थता बचाने के लिए ‘जाना’ रखा गया, न कि उसे खुलकर ‘यौन संबंध बनाया’ किया गया।
- source_word: sexual services
  choice: काम-सेवा
  rationale: मांग की यौन और बाध्यकारी प्रकृति को स्पष्ट, गरिमापूर्ण और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: God of the All
  choice: समस्त के परमेश्वर
  rationale: विशिष्ट ब्रह्मांडीय उपाधि को सामान्य ‘सर्वशक्तिमान परमेश्वर’ में बदलने के बजाय औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: holy Spirit
  choice: पवित्र आत्मा
  rationale: प्रचलित हिन्दी धार्मिक पदावली अपनाई गई है, जबकि छोटे अक्षर से उत्पन्न अंग्रेज़ी अस्पष्टता का अनावश्यक सिद्धान्तीकरण नहीं किया गया।
theological_decisions:
- issue: नोरिया की माता को ‘जानने’ का अर्थ
  choice: ‘जाना’ की अस्पष्ट अभिव्यक्ति सुरक्षित रखी
  alternative: ‘उसके साथ यौन संबंध बनाया’
  rationale: प्रसंग यौन संकेत देता है, पर उपलब्ध साक्षी का शब्द जानबूझकर अथवा परंपरागत रूप से द्विअर्थी हो सकता है।
- issue: स्वर्गदूत के प्रश्न में नोरिया की ‘धृष्टता’
  choice: विरोधाभासी प्रतीत होने वाला कथन यथावत रखा
  alternative: इसे प्रशंसा, व्यंग्य या प्रधानों को संबोधित कथन मानकर स्पष्ट करना
  rationale: पाठ में वास्तविक कथात्मक और धर्मवैचारिक तनाव है; स्रोत-समीक्षा के बिना उसे चुपचाप सुलझाना उचित नहीं।
- issue: God के पुनर्निर्मित पाठ का दर्जा
  choice: '[परमेश्वर] को वर्ग कोष्ठकों में रखा'
  alternative: कोष्ठक हटाकर निश्चित पाठ बनाना
  rationale: वर्ग कोष्ठक पांडुलिपि-क्षति या संपादकीय पुनर्स्थापन का संकेत देते हैं और उन्हें सुरक्षित रखना आवश्यक है।
