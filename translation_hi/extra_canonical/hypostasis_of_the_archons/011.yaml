  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/011.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
translation:
  language: hi
  text: '“जब यलदबाओथ के पुत्र सबाओथ ने उस स्वर्गदूत की सामर्थ्य देखी, तो उसने पश्चात्ताप किया और अपने पिता तथा अपनी माता, द्रव्य—जिसे उसने धिक्कारा था—को न्याय-दण्ड के अधीन ठहराया।


    “उसने ऊपर की सोफिया और उसकी पुत्री ज़ोए की स्तुति में गीत गाए। सोफिया और ज़ोए उसे ऊपर ले गईं और उसे सातवें स्वर्ग पर, उस परदे के नीचे नियुक्त किया जो ऊपरी और निचले लोकों को अलग करता है। वह ‘सेनाओं का परमेश्वर, सबाओथ’ कहलाता है, क्योंकि वह अराजकता की सेनाओं के ऊपर है; सोफिया ने ही उसे नियुक्त किया था।


    “इन घटनाओं के बाद सबाओथ ने अपने लिए करूबों का एक विशाल, चार मुखों वाला रथ बनाया। उसने अपनी सेवा के लिए असंख्य स्वर्गदूत और वीणाएँ तथा सारंगियाँ भी बनाईं।


    “सोफिया अपनी पुत्री ज़ोए को लाई और उसे सबाओथ के दाहिने बैठाया, ताकि वह उसे आठवें स्वर्ग की बातों की शिक्षा दे। और उसने क्रोध के स्वर्गदूत को उसके बाएँ रखा।


    “[उस] दिन से [उसका दाहिना हाथ] ‘जीवन’ कहलाया, [a] जबकि बायाँ हाथ स्वेच्छाचारी के ऊपरी लोक के अन्याय का चिह्न बन गया। तुम्हारे अस्तित्व में आने से पहले ही ये घटनाएँ हो चुकी थीं।


    “जब यलदबाओथ ने सबाओथ को ऐसे महान वैभव में और इतना ऊँचा उठाया हुआ देखा, तो वह उससे ईर्ष्या करने लगा। उसकी ईर्ष्या एक उभयलिंगी सत्ता बन गई। इसी प्रकार ईर्ष्या की उत्पत्ति हुई; उसने मृत्यु को जन्म दिया। मृत्यु ने संतानों को जन्म दिया और उनमें से प्रत्येक को उसके अपने स्वर्ग का अधिकारी नियुक्त किया। अराजकता के सारे स्वर्ग उनकी भीड़ों से भर गए।


    “फिर भी ये सारी घटनाएँ सर्वस्व के पिता की इच्छा से, ऊपर की प्रत्येक वस्तु के प्रतिरूप के अनुसार हुईं, ताकि अराजकता की पूर्ण परिणति हो सके।


    “देखो, मैंने तुम्हें शासकों के साँचे, उस द्रव्य जिसमें वह प्रकट हुआ, और उनके जनक तथा उनके संसार के विषय में शिक्षा दे दी है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पांडुलिपि का पाठ क्षतिग्रस्त या लुप्त है; उपलब्ध साक्ष्य में इस स्थान पर रिक्ति है।
    reason: मूल साक्ष्य में restoration/damage brackets और एक रिक्त खंड है; अस्पष्टता को चुपचाप पूरा नहीं किया गया।
lexical_decisions:
- source_word: Sabaoth
  choice: सबाओथ
  rationale: नाम का ध्वन्यात्मक लिप्यंतरण रखा गया; उपाधि में निहित ‘सेनाओं’ का अर्थ अलग से स्पष्ट है।
- source_word: Yaldabaoth
  choice: यलदबाओथ
  rationale: कॉप्टिक/यूनानी परंपरा में प्रचलित नाम का निकट देवनागरी लिप्यंतरण।
- source_word: Matter
  choice: द्रव्य
  rationale: मूल ब्रह्मांड-विज्ञान में व्यक्तिरूप सत्ता और भौतिक तत्त्व, दोनों संकेत सुरक्षित रखने के लिए इसे बड़े अर्थक्षेत्र वाले संज्ञापद के रूप में रखा गया।
- source_word: Sophia
  choice: सोफिया
  rationale: व्यक्तिनाम के रूप में लिप्यंतरण किया; इसे केवल ‘बुद्धि’ करने से पात्र और गुण के बीच का तनाव मिट जाता।
- source_word: Zoe
  choice: ज़ोए
  rationale: व्यक्तिनाम का लिप्यंतरण रखा; आगे ‘जीवन’ से इसका अर्थगत संबंध अलग रूप में दिखाई देता है।
- source_word: God of hosts
  choice: सेनाओं का परमेश्वर
  rationale: पारंपरिक धार्मिक प्रतिध्वनि और ‘hosts of chaos’ के साथ शब्द-संबंध दोनों बनाए रखता है।
- source_word: archons
  choice: शासक
  rationale: सामान्य पाठक के लिए स्वाभाविक हिन्दी; इस ग्रंथ में ब्रह्मांडीय शासक सत्ताओं का भाव देता है।
- source_word: autocrat
  choice: स्वेच्छाचारी
  rationale: एकाधिकारपूर्ण, स्वयं-प्रभुत्व जताने वाले शासक का नकारात्मक अर्थ सुरक्षित है।
- source_word: androgynous entity
  choice: उभयलिंगी सत्ता
  rationale: लैंगिक द्विरूपता और सत्ता/अस्तित्व दोनों को बिना व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: summation of chaos
  choice: अराजकता की पूर्ण परिणति
  rationale: ‘summation’ का आशय संदिग्ध है; ‘पूर्ण परिणति’ समापन/पूर्णता का तनाव रखती है, पर केवल विनाश या गणितीय योग तय नहीं करती।
- source_word: mold
  choice: साँचा
  rationale: रचना के नमूने या गठनकारी रूपक को ठोस और सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: सबाओथ का पश्चात्ताप और अपने माता-पिता पर न्याय
  choice: कथन को उसी रूप में रखा कि सबाओथ पश्चात्ताप करता और उन्हें न्याय-दण्ड के अधीन ठहराता है।
  alternative: इसे नैतिक परिवर्तन या विधिवत दण्डादेश के रूप में अधिक स्पष्ट करना।
  rationale: साक्ष्य इन दोनों के संबंध और अधिकार की प्रकृति पूरी तरह नहीं समझाता; अनावश्यक धर्मशास्त्रीय समाधान से बचा गया।
- issue: सोफिया और ज़ोए द्वारा सबाओथ की नियुक्ति
  choice: दोनों को सक्रिय पात्र रखते हुए सातवें स्वर्ग पर नियुक्ति व्यक्त की।
  alternative: नियुक्ति को केवल सोफिया का कार्य बताना।
  rationale: पाठ पहले दोनों को ऊपर उठाने और नियुक्त करने का कर्ता बनाता है, फिर कारण-वाक्य में सोफिया को विशेष रूप से नाम देता है; यह आंतरिक तनाव सुरक्षित रखा गया।
- issue: ‘Father of the All’
  choice: सर्वस्व का पिता
  alternative: सबका पिता / समस्त जगत का पिता
  rationale: यह विशिष्ट ब्रह्मांडीय उपाधि है; ‘सर्वस्व’ इसकी व्यापकता को बिना किसी परिचित सांप्रदायिक पद में मिलाए रखता है।
- issue: ऊपरी प्रतिरूप और अराजकता की परिणति
  choice: कारणात्मक कथन को जस का तस रखा, बिना यह समझाए कि पिता बुराई को अनुमोदित करता है या केवल सीमित करता है।
  alternative: इसे अनुमति, पूर्वनियोजन, या उद्धारकारी योजना के रूप में स्पष्ट करना।
  rationale: पाठ में दैवी इच्छा, ऊपरी प्रतिरूप और अराजकता की पूर्णता के बीच वास्तविक धर्मशास्त्रीय तनाव है।
- issue: दाहिने और बाएँ हाथ का प्रतीकवाद
  choice: दाहिने को ‘जीवन’ और बाएँ को अन्याय का चिह्न कहा।
  alternative: ज़ोए को ही सीधे ‘जीवन’ और क्रोधदूत को ‘अन्याय’ कहना।
  rationale: क्षतिग्रस्त वाक्य में संदर्भ अस्पष्ट है; पात्रों और हाथों की पहचान को पूर्णतः एक नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु पठनीय शैली अपनाई गई है। तकनीकी नामों को लिप्यंतरित किया गया और प्रमुख ब्रह्मांडीय पदों को अर्थानुवाद दिया गया। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; प्रत्यक्ष कॉप्टिक स्रोत-समीक्षा अभी लंबित है। निरर्थक पृष्ठ-संकेत [7] और [8] नहीं रखे गए, पर पाठ-क्षति को [a] और पादटिप्पणी द्वारा स्पष्ट किया गया है।
