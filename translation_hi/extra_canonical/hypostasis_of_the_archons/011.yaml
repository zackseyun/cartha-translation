  revised_text: '“जब यलदबाओथ के पुत्र सबाओथ ने उस स्वर्गदूत की सामर्थ्य देखी, तो उसने पश्चात्ताप किया और अपने पिता तथा अपनी माता, द्रव्य—जिन्हें उसने धिक्कारा था—को न्याय के लिए ठहराया।


    “उसने ऊपर की सोफिया और उसकी पुत्री ज़ोए की स्तुति में गीत गाए। सोफिया और ज़ोए उसे ऊपर ले गईं और उसे उस परदे के नीचे, जो ऊपरी और निचले लोकों को अलग करता है, सातवें स्वर्ग का प्रभारी नियुक्त किया। वह ‘सेनाओं का परमेश्वर, सबाओथ’ कहलाता है, क्योंकि वह अराजकता की सेनाओं के ऊपर है, क्योंकि सोफिया ने उसे नियुक्त किया था।


    “इन घटनाओं के घटित होने के बाद, सबाओथ ने अपने लिए करूबों का एक विशाल, चार मुखों वाला रथ बनाया, और अपनी सेवा के लिए असंख्य स्वर्गदूत, साथ ही हार्प और वीणाएँ भी बनाईं।


    “सोफिया अपनी पुत्री ज़ोए को लाई और उसे उसके दाहिने हाथ पर बैठाया, ताकि वह उसे आठवें स्वर्ग की बातों की शिक्षा दे। और उसने क्रोध के स्वर्गदूत को उसके बाएँ हाथ पर रखा।


    “[उस] दिन से [उसका दाहिना हाथ] ‘जीवन’ कहलाया, [a] जबकि बायाँ हाथ स्वेच्छाचारी के ऊपरी लोक के अन्याय का चिह्न बन गया। तुम्हारे अस्तित्व में आने से पहले ही ये घटनाएँ घटित हो चुकी थीं।


    “जब यलदबाओथ ने सबाओथ को ऐसे महान वैभव में और इतना ऊँचा उठाया हुआ देखा, तो वह उससे ईर्ष्या करने लगा, और उसकी ईर्ष्या एक उभयलिंगी सत्ता बन गई। इसी प्रकार ईर्ष्या की उत्पत्ति हुई, जिसने मृत्यु को जन्म दिया। मृत्यु ने संतानों को जन्म दिया और उनमें से प्रत्येक को उसके अपने स्वर्ग का प्रभारी नियुक्त किया। अराजकता के सारे स्वर्ग उनकी भीड़ों से भर गए।


    “फिर भी ये सारी घटनाएँ सर्वस्व के पिता की इच्छा से, ऊपर की प्रत्येक वस्तु के प्रतिरूप के अनुसार हुईं, ताकि अराजकता की पूर्ण परिणति हो सके।


    “देखो, मैंने तुम्हें शासकों के साँचे, उस द्रव्य जिसमें वह प्रकट हुआ, और उनके जनक तथा उनके संसार के विषय में शिक्षा दे दी है।”'
