  source_fidelity: दिया गया सार्वजनिक-डोमेन अंग्रेज़ी गवाह ही प्रत्यक्ष समीक्षा का आधार है; कॉप्टिक पाठ की प्रत्यक्ष जाँच लंबित है। मसौदा अधिकांशतः गवाह के अर्थ, व्यक्तीकृत स्त्रीलिंग ‘अविनाशिता’, पुनर्स्थापित वर्ग-कोष्ठकों और मिथकीय पारिभाषिकता को सुरक्षित रखता है। किंतु रिक्त पाठ-खंड [] को केवल फुटनोट-चिह्न में बदलने से स्रोत का दृश्य lacuna-चिह्न लुप्त हो गया था, और एक स्थान पर ‘तब’ जोड़ा गया था, जिसका गवाह में स्पष्ट आधार नहीं है।
  naturalness: संशोधित पाठ आधुनिक, गरिमापूर्ण हिन्दी में है। ‘उसके पीछे-पीछे नीचे ... चला गया’ को अधिक सहज क्रिया-विन्यास दिया गया है और ‘पकड़ न सकीं’ को ‘थामे न रख सकीं’ किया गया है, जो image को hold onto करने का अर्थ बेहतर व्यक्त करता है।
  terminology: ‘अविनाशिता’, ‘सर्वसमष्टि’, ‘अराजकता’, ‘अथाह गर्त’, ‘एऑन’, ‘सत्ताधारी शक्तियाँ’, ‘प्राणमय’ और ‘आत्मिक’ सुसंगत रखे गए हैं। ‘परमेश्वर’ के स्थान पर ‘ईश्वर’ किया गया है, ताकि समाएल के कथित दावे और ‘blind god’ की व्याख्या में एक ही मूल पद का समरूप प्रतिफलन हो।
