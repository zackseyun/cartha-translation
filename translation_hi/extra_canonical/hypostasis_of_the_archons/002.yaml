translation:
  language: hi
  text: 'उनका अगुआ अंधा है। [अपनी] सामर्थ्य, अज्ञान और घमंड के कारण उसने [अपनी सामर्थ्य में] घोषणा की, “मैं परमेश्वर हूँ; [मेरे सिवा] कोई और नहीं है।”


    जब उसने यह कहा, तो उसने [सर्वसमष्टि] के विरुद्ध पाप किया। उसकी यह डींग अविनाशिता तक जा पहुँची। [a] तब अविनाशिता की ओर से एक वाणी ने उत्तर दिया, “तुम भूल में हो, समाएल”—जिसका अर्थ है “अंधा ईश्वर”—क्योंकि उसके विचार अंधे थे। उसने अपनी सामर्थ्य, अर्थात अपनी कही हुई ईशनिंदा, बाहर उंडेल दी और उसके पीछे-पीछे नीचे अराजकता में और अपनी माता, अथाह गर्त, के पास चला गया; यह पिस्तिस सोफिया की प्रेरणा से हुआ। उसने उसकी हर संतान को उसकी सामर्थ्य के अनुरूप, ऊँचे सनातन एऑनों[b] की समानता में व्यवस्थित किया, क्योंकि जो दिखाई देता है वह उसी से उत्पन्न हुआ जो दिखाई नहीं देता।


    अविनाशिता ने नीचे जलों के स्थान में झाँका। उसका प्रतिरूप जलों पर प्रतिबिंब के रूप में दिखाई दिया, और अंधकार की सत्ताधारी शक्तियाँ उस पर मोहित हो गईं। फिर भी वे जलों पर दिखाई दिए उस प्रतिरूप को पकड़ न सकीं, क्योंकि वे निर्बल थीं। जो केवल प्राणमय है, वह आत्मिक को पकड़ नहीं सकता,[c] क्योंकि वे सत्ताधारी शक्तियाँ नीचे से उत्पन्न हुई थीं, जबकि अविनाशिता का प्रतिरूप ऊपर से आया था।


    इसलिए अविनाशिता ने नीचे उस स्थान में झाँका, ताकि पिता की इच्छा के अनुसार वह उन सबको ज्योति के साथ एक कर सके।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध साक्ष्य में इस स्थान पर एक रिक्त पाठ-खंड (lacuna) सूचित है; लुप्त शब्द ज्ञात नहीं हैं।
    reason: मूल गवाह के खाली कोष्ठक को पठनीय फुटनोट में सुरक्षित रखना।
  - marker: b
    text: “एऑन” इस ग्रंथ में केवल समय के युग नहीं, बल्कि ऊँची सनातन सत्ताओं या लोकों के लिए प्रयुक्त पारिभाषिक शब्द है।
    reason: लिप्यंतरित तकनीकी संज्ञा को सामान्य पाठक के लिए स्पष्ट करना।
  - marker: c
    text: “प्राणमय” और “आत्मिक” यहाँ अस्तित्व के दो भिन्न स्तरों का विरोध व्यक्त करते हैं; पहला नीचे की सत्ताओं से और दूसरा ऊपर के प्रतिरूप से संबद्ध है।
    reason: soulish और spiritual के तकनीकी भेद को समझाना, बिना उसे किसी बाद की संप्रदायगत प्रणाली से बाँधने के।
lexical_decisions:
- source_word: indestructability / indestructibility
  choice: अविनाशिता
  rationale: अमूर्त गुण के साथ-साथ स्त्रीलिंग व्यक्त सत्ता का बोध बनाए रखता है; आगे के स्त्रीलिंग सर्वनाम और क्रियाएँ भी सुरक्षित रहती हैं।
- source_word: the All
  choice: सर्वसमष्टि
  rationale: यहाँ प्रयुक्त तकनीकी पूर्णता-सूचक धारणा को केवल ‘सब’ या ‘संसार’ में सीमित किए बिना व्यक्त करता है; पुनर्स्थापित पाठ होने के कारण कोष्ठक रखे गए हैं।
- source_word: Chaos
  choice: अराजकता
  rationale: मिथकीय स्थान/अवस्था के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे किसी अधिक विशिष्ट धर्मवैज्ञानिक संज्ञा में बदलने के।
- source_word: Abyss
  choice: अथाह गर्त
  rationale: गहराई और व्यक्त मिथकीय सत्ता—दोनों के संकेत को बनाए रखता है।
- source_word: aeons
  choice: एऑन
  rationale: इस ग्रंथ की विशिष्ट दिव्य/सनातन सत्ताओं के लिए पारिभाषिक शब्द का लिप्यंतरण किया गया, क्योंकि ‘युग’ अकेले यहाँ भ्रामक हो सकता है।
- source_word: authorities
  choice: सत्ताधारी शक्तियाँ
  rationale: साधारण ‘अधिकारी’ की जगह ब्रह्मांडीय शासक सत्ताओं का अर्थ स्पष्ट करता है।
- source_word: soulish / spiritual
  choice: प्राणमय / आत्मिक
  rationale: दो अलग स्तरों के बीच स्रोत का विरोध बनाए रखता है; ‘मानसिक’ या एक ही हिन्दी मूल के शब्द लेने से भेद धुँधला पड़ता।
- source_word: Pistis Sophia
  choice: पिस्तिस सोफिया
  rationale: व्यक्त नाम/तकनीकी संज्ञा के रूप में लिप्यंतरण किया गया; इसका अर्थ अनुवाद करके किसी एक व्याख्या को आरोपित नहीं किया गया।
theological_decisions:
- issue: समाएल की ‘मैं परमेश्वर हूँ’ घोषणा
  choice: दावे को सीधे और बिना शमन के रखा गया
  alternative: ‘मैं ही एकमात्र देवता हूँ’ या दावे को व्यंग्यात्मक बनाना
  rationale: स्रोत में घमंड, अज्ञान और ईशनिंदा का तनाव कथानक से उभरता है; अनुवाद में अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: अविनाशिता का व्यक्तिकरण
  choice: स्त्रीलिंग व्यक्त सत्ता के रूप में ‘अविनाशिता’
  alternative: नपुंसक अमूर्त गुण ‘अविनाशीपन’
  rationale: साक्ष्य में इसके लिए स्त्रीलिंग सर्वनाम और सक्रिय क्रियाएँ हैं; व्यक्तिकरण खोना कथानक को बदल देता।
- issue: दृश्य का अदृश्य से उत्पन्न होना
  choice: कारणात्मक कथन को यथावत रखा गया
  alternative: इसे सृष्टि-विषयक रूढ़ सिद्धांत के अनुसार विस्तार देना
  rationale: पाठ की अपनी ब्रह्मांड-रचना संबंधी भाषा सुरक्षित रखी गई है, बिना किसी संप्रदायगत समंजन के।
- issue: ‘उसने उसकी हर संतान…’ में स्त्रीलिंग कर्ता
  choice: निकटतम स्त्रीलिंग संदर्भ पिस्तिस सोफिया/‘वह’ को बनाए रखा
  alternative: स्पष्ट रूप से किसी अन्य सत्ता का नाम जोड़ना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य स्त्रीलिंग ‘She’ देता है, पर सीधे कॉप्टिक परीक्षण के अभाव में उससे अधिक स्पष्टता जोड़ना उचित नहीं।
- issue: सबको ज्योति के साथ एक करना
  choice: ‘एक कर सके’
  alternative: ‘उद्धार दे सके’ या ‘ज्योति में मिला दे’
  rationale: स्रोत के unite को रखा गया और उद्धार अथवा विलय की विशिष्ट धर्मवैज्ञानिक व्याख्या आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज गद्य रखा गया है। स्रोत के पुनर्स्थापित अंशों के वर्ग-कोष्ठक सुरक्षित हैं। समाएल, पिस्तिस सोफिया और एऑन जैसी विशिष्ट संज्ञाएँ लिप्यंतरित हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; नाग हम्मादी कोडेक्स II,4 के कॉप्टिक पाठ से प्रत्यक्ष समीक्षा अभी लंबित है।
