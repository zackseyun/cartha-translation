    rationale: अंग्रेज़ी गवाह में ‘[]’ स्वयं पाठ-संबंधी अनिश्चितता का चिह्न है। केवल [a] रखने से यह स्पष्ट नहीं रहता कि मूल स्थान पर वास्तविक रिक्त पाठ-खंड है।
  - severity: low
