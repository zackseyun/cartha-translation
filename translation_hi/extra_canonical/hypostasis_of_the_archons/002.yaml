    अविनाशिता ने नीचे जलों के स्थान में झाँका। उसका प्रतिरूप जलों पर प्रतिबिंब के रूप में दिखाई दिया, और अंधकार की सत्ताधारी शक्तियाँ उस पर मोहित हो गईं। फिर भी वे जलों पर दिखाई दिए उस प्रतिरूप को थामे न रख सकीं, क्योंकि वे निर्बल थीं। जो केवल प्राणमय है, वह आत्मिक को थामे नहीं रख सकता,[c] क्योंकि वे सत्ताधारी शक्तियाँ नीचे से उत्पन्न हुई थीं, जबकि अविनाशिता का प्रतिरूप ऊपर से आया था।


