  revised_text: 'उनका अगुआ अंधा है। [अपनी] सामर्थ्य, अज्ञान और घमंड के कारण उसने अपनी [सामर्थ्य] में घोषणा की, “मैं ईश्वर हूँ; [मेरे सिवा] कोई और नहीं है।”


