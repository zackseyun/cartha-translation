  variant: modern standard Hindi in Devanagari
source:
  text: 'Next, Eve then gave birth to Cain, their son, and Cain tilled the land. Then Adam knew his wife. She once again became pregnant, giving birth to Abel, and Abel was a shepherd. Cain brought in crops from his field, while Abel brought in an offering from among his lambs. God looked favorably on the offering of Abel, but he did not accept the offerings of Cain.


    The fleshly Cain pursued his brother Abel.


    God said to Cain: “Where is Abel your brother?”


    Cain answered and said: “Am I my brother’s keeper?”


    God said to Cain: “Listen! The voice of your brother’s blood calls to me. You have sinned with your mouth. It will return to you. Whoever kills Cain will unleash seven revenges, and you will live moaning and trembling on the earth.”


    Adam once again [knew] his female counterpart Eve, and she became pregnant and bore [Seth] to Adam. She said: “I have given birth to [another] man through God, to replace [Abel].”


    Eve once again became pregnant and gave birth to [Norea]. Eve said: “He has begotten a virgin for me in order to help many generations of humans.” [] She is the virgin whom the forces did not defile.


    And mankind began to multiply and to progress.'
