theological_decisions:
- issue: कैन की रक्षा और सात प्रतिशोधों का कथन
  choice: “जो कोई कैन को मारेगा, वह सात प्रतिशोधों को भड़का देगा”
  alternative: “कैन को मारने वाले से सात गुना बदला लिया जाएगा”
  rationale: दिए गए साक्ष्य की असामान्य रचना और अस्पष्ट कर्तृत्व को बनाए रखा गया है; उत्पत्ति की परिचित भाषा से इसे चुपचाप सामान्यीकृत नहीं किया गया।
- issue: ‘तेरे मुँह से पाप’ और उसके लौटने का संदर्भ
  choice: सर्वनामात्मक वाक्य “वह तेरे पास लौट आएगा” रखा गया
  alternative: ‘तेरा पाप तुझ पर लौटेगा’
  rationale: ‘वह’ किसे सूचित करता है—पाप, रक्त की आवाज़, या कथित वचन—यह स्रोत-साक्ष्य में स्पष्ट नहीं; अनुवाद ने इस तनाव को नहीं सुलझाया।
- issue: नोरिआ का कुँवारी और सहायक के रूप में वर्णन
  choice: स्त्रीलिंग संदर्भ और ‘बहुत-सी पीढ़ियों की सहायता’ को यथावत रखा
  alternative: इसे किसी विशिष्ट उद्धारकारी पदवी के रूप में व्याख्यायित करना
  rationale: पाठ जितना कहता है उतना ही व्यक्त किया गया है; बाद की धर्मवैज्ञानिक पहचान आरोपित नहीं की गई।
- issue: हव्वा का ‘परमेश्वर के द्वारा’ संतान उत्पन्न करना
  choice: “परमेश्वर के द्वारा”
  alternative: “परमेश्वर की सहायता से” या “परमेश्वर से”
  rationale: माध्यम, सहायता और स्रोत के बीच संभव अस्पष्टता को अपेक्षाकृत खुला रखा गया।
