  footnotes:
  - marker: a
    text: यहाँ उपलब्ध पांडुलिपि-साक्ष्य में एक रिक्त खंड है; उसका मूल पाठ सुरक्षित नहीं है।
    reason: अंग्रेज़ी साक्षी में दिए गए खाली कोष्ठक पांडुलिपि की क्षति या लुप्त पाठ का संकेत हैं; हिन्दी मुख्य पाठ में निरर्थक खाली कोष्ठक रखने के बजाय चिह्न और टिप्पणी से इसे स्पष्ट किया गया।
lexical_decisions:
- source_word: archons
  choice: अधिपति
  rationale: कृति के शासक-सत्ताधारी प्राणियों के लिए अर्थपूर्ण और गरिमापूर्ण हिन्दी पद; विशिष्ट ज्ञानवादी संदर्भ को किसी बाद की सांप्रदायिक शब्दावली में नहीं बाँधता।
- source_word: soil / earth
  choice: मिट्टी / पृथ्वी / भूमि
  rationale: संदर्भ के अनुसार पदार्थ, जगत और धरातल के भेद को बनाए रखा गया है; आदम और भूमि के शब्द-संबंध को यथासंभव सुनाई देने दिया गया है।
- source_word: image
  choice: प्रतिरूप
  rationale: यह केवल चित्र नहीं, प्रकट हुए दिव्य स्वरूप की धारणा व्यक्त करता है और ‘आकृति’ से अलग रहता है।
- source_word: form
  choice: आकृति
  rationale: अधिपतियों द्वारा गढ़े भौतिक आकार को दिव्य ‘प्रतिरूप’ से पृथक रखने के लिए।
- source_word: soulish man
  choice: प्राणधारी मनुष्य
  rationale: ‘आत्मिक’ से भेद रखते हुए soul-संबंधी असामान्य अभिव्यक्ति को पठनीय हिन्दी में सुरक्षित करता है।
- source_word: living soul
  choice: जीवित प्राणी
  rationale: सेमिटिक सृष्टि-वर्णन की पृष्ठभूमि में समग्र जीवित सत्ता का स्वाभाविक हिन्दी अर्थ; इसे अमर या देह-विहीन आत्मा के रूप में नहीं समझाता।
- source_word: Adamic Land
  choice: आदमिक भूमि
  rationale: तकनीकी अथवा पौराणिक स्थान-संज्ञा की संभावित विशिष्टता को सामान्य ‘आदम की भूमि’ बनाकर सीमित नहीं किया गया।
- source_word: indestructibility
  choice: अविनश्वरता
  rationale: एक अविनाशी दैवी लोक या अवस्था—दोनों की संभावित अस्पष्टता को बनाए रखता है।
- source_word: Father of the All
  choice: सर्वसमष्टि का पिता
  rationale: ‘All’ को समस्त अस्तित्व की पूर्णता/समष्टि के अर्थ में रखा गया है, केवल ‘सब लोगों’ के अर्थ में नहीं।
theological_decisions:
- issue: मनुष्य में पहले प्राण और बाद में आत्मा के प्रवेश का संबंध
  choice: 'दो चरणों को अलग रखा गया: पहले मनुष्य को ‘प्राण मिला’, बाद में ‘आत्मा’ ने उसमें निवास किया।'
  alternative: दोनों को एक ही जीवनदायी श्वास की घटना के रूप में मिला देना।
  rationale: पाठ की ब्रह्मांड-दृष्टि और उसके जानबूझकर रखे गए soul/Spirit भेद को बिना व्याख्यात्मक समरसता के सुरक्षित रखना आवश्यक है।
- issue: चेहरे पर फूँक मारने वाले का अस्पष्ट कर्ता
  choice: ‘उसने’ रखा गया।
  alternative: ‘एक अधिपति ने’ अथवा ‘मुख्य अधिपति ने’।
  rationale: उपलब्ध साक्ष्य में एकवचन कर्ता की पहचान स्पष्ट नहीं; उसे निश्चित करना पाठ से आगे जाना होता।
- issue: ‘प्रतिरूप’ की शक्ति और सर्वनाम
  choice: प्रतिरूप को पकड़ने की अधिपतियों की असफलता को उसी की रहस्यमय शक्ति के साथ रखा गया।
  alternative: शक्ति को स्पष्ट रूप से परमेश्वर या आत्मा की शक्ति बताना।
  rationale: पाठ के सर्वनाम-संबंध में मौजूद तनाव को हल किए बिना संरक्षित किया गया है।
- issue: सर्वसमष्टि के पिता की इच्छा
  choice: सभी घटनाओं को उनकी इच्छा से घटित कहा गया, बिना यह समझाए कि इच्छा अनुमति थी या प्रत्यक्ष आदेश।
  alternative: ‘अनुमति से’ लिखकर नैतिक कठिनाई को हल करना।
  rationale: मूल कथन की धर्मवैचारिक कठोरता और अस्पष्टता को बनाए रखा गया है।
