  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पुनर्निर्मित शब्दों के वर्गाकार कोष्ठक सुरक्षित रखे गए हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी लंबित होने के कारण विशेषतः तकनीकी पदों, सर्वनामों और पाठ-रिक्तियों पर अनंतिम सावधानी बरती गई है।
