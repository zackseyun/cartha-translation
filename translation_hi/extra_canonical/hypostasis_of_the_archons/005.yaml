  revised_text: 'तब स्त्रीरूप आत्मिक प्रकृति शिक्षक सर्प का रूप धारण करके आई। सर्प ने आदम और हव्वा को शिक्षा दी और कहा, “समाएल ने तुमसे क्या [कहा]? क्या उसने यह कहा था: ‘तुम्हें बगीचे के सब वृक्षों से खाने की अनुमति है, पर भले-बुरे के ज्ञान के [वृक्ष] से मत खाना’?”[a]


    [] मांसमय स्त्री ने कहा, “उसने केवल यह नहीं कहा, ‘मत खाना,’ बल्कि यह भी कहा, ‘उसे छूना तक मत, क्योंकि जिस दिन तुम उसमें से खाओगे, उस दिन तुम निश्चय मर जाओगे।’”


    शिक्षक सर्प ने कहा, “तुम निश्चय नहीं मरोगे, क्योंकि उसने ईर्ष्या के कारण तुमसे ऐसा कहा। इसके विपरीत, तुम्हारी आँखें खुल जाएँगी और तुम देवताओं के समान हो जाओगे, भले-बुरे को जानते हुए।” तब वह स्त्रीरूप शिक्षा-देनेवाली प्रकृति सर्प से अलग हो गई और उसे ऐसे छोड़ गई मानो वह कोई पार्थिव वस्तु हो।


    मांसमय स्त्री ने वृक्ष से लिया और खाया, और अपने पति को भी दिया। इस प्रकार उन दोनों ने खाया—वे प्राणी जो केवल प्राणमय थे। उनके ज्ञान के अभाव से उनका दोष प्रकट हो गया। उन्होंने जान लिया कि जो आत्मिक था, उससे वे वंचित कर दिए गए थे; इसलिए उन्होंने अंजीर के पत्ते लेकर अपनी नंगी कटि के चारों ओर बाँध लिए।


    जो कुछ हुआ था उससे अनजान, शासकों का प्रधान आया और बोला, “आदम, तुम कहाँ हो?”


    आदम ने कहा, “मैंने तुम्हारी आवाज़ सुनी और डर गया, क्योंकि मैं नंगा था; इसलिए मैं छिप गया।”


    शासक ने कहा, “तुम क्यों छिपे? क्या इसलिए नहीं कि तुमने उस एक वृक्ष से खाया, जिससे खाने को मैंने तुम्हें मना किया था? तुमने उसमें से खाया है!”


    आदम ने कहा, “जो स्त्री तुमने मुझे दी, उसी ने मुझे फल [दिया], और मैंने खा लिया।”[b]


    तब उस घमंडी [शासक] ने स्त्री को शाप दिया।[c]


    स्त्री ने कहा, “सर्प ने मुझे धोखा दिया, इसलिए मैंने खा लिया।”


    [शासक सर्प की ओर मुड़े] और उन्होंने उसकी छाया को शाप दिया, [जिससे वह] दुर्बल हो गई।[d]


    वे नहीं जानते थे कि यह वही आकृति थी जिसे उन्होंने गढ़ा था। उस समय से सर्प अधिकारियों के शाप के अधीन हो गया; यह [] तब तक रहा जब तक सिद्ध मनुष्य नहीं आया।[e]


    फिर वे अपने आदम की ओर मुड़े और उसे उसकी पत्नी समेत बगीचे से निकाल दिया। उनके पास कोई आशीष नहीं थी, क्योंकि वे स्वयं भी शाप के अधीन थे।


    उन्होंने मानवजाति को भारी उलझन और परिश्रम के जीवन में धकेल दिया, ताकि उनकी मानवजाति सांसारिक बातों में उलझी रहे और पवित्र आत्मा पर ध्यान देने के लिए उसके पास समय न बचे।'
