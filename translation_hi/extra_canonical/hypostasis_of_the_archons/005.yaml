translation:
  language: hi
  text: 'तब स्त्रीरूप आत्मिक प्रकृति शिक्षक सर्प का रूप धारण करके आई। सर्प ने आदम और हव्वा को शिक्षा दी और कहा, “समाएल ने तुमसे क्या [कहा]? क्या उसने यह कहा था: ‘तुम्हें बगीचे के सब वृक्षों से खाने की अनुमति है, पर भले और बुरे के ज्ञान के [वृक्ष] से मत खाना’?”[a]


    मांसमय स्त्री ने कहा, “उसने केवल यह नहीं कहा, ‘मत खाना,’ बल्कि यह भी कहा, ‘उसे छूना तक मत, क्योंकि जिस दिन तुम उसमें से खाओगे, उस दिन तुम निश्चय मर जाओगे।’”


    शिक्षक सर्प ने कहा, “तुम निश्चय नहीं मरोगे, क्योंकि उसने ईर्ष्या के कारण तुमसे ऐसा कहा। इसके विपरीत, तुम्हारी आँखें खुल जाएँगी और तुम देवताओं के समान हो जाओगे, भले और बुरे को जानने वाले।” तब वह स्त्रीरूप शिक्षिका-प्रकृति सर्प से अलग हो गई और उसे ऐसे छोड़ गई मानो वह कोई पार्थिव वस्तु हो।


    मांसमय स्त्री ने वृक्ष का फल लेकर खाया और अपने पति को भी दिया। इस प्रकार उन दोनों ने खाया—वे प्राणी जो केवल प्राणमय थे। ज्ञान के अभाव ने उनका दोष प्रकट कर दिया। उन्होंने जान लिया कि जो आत्मिक था, उससे वे वंचित कर दिए गए थे; इसलिए उन्होंने अंजीर के पत्ते लेकर अपनी नंगी कमर के चारों ओर बाँध लिए।


    जो कुछ हुआ था उससे अनजान, शासकों का प्रधान आया और बोला, “आदम, तुम कहाँ हो?”


    आदम ने कहा, “मैंने आपकी आवाज़ सुनी और डर गया, क्योंकि मैं नंगा था; इसलिए मैं छिप गया।”


    शासक ने कहा, “तुम क्यों छिपे? क्या इसलिए नहीं कि तुमने उस एक वृक्ष से खाया, जिससे खाने को मैंने तुम्हें मना किया था? तुमने उसमें से खाया है!”


    आदम ने कहा, “जिस स्त्री को आपने मुझे दिया, उसी ने मुझे फल [थमाया], और मैंने खा लिया।”[b]


    तब उस घमंडी [शासक] ने स्त्री को शाप दिया।[c]


    स्त्री ने कहा, “सर्प ने मुझे धोखा दिया, इसलिए मैंने खा लिया।”


    [शासक सर्प की ओर मुड़े] और उन्होंने उसकी छाया को शाप देकर [उसे] दुर्बल कर दिया।[d]


    वे नहीं जानते थे कि यह वही आकृति थी जिसे उन्होंने गढ़ा था। उस समय से सर्प अधिकारियों के शाप के अधीन हो गया; यह शाप तब तक बना रहा [] जब तक सिद्ध मनुष्य नहीं आया।[e]


    फिर वे अपने आदम की ओर मुड़े और उसे उसकी पत्नी समेत बगीचे से निकाल दिया। उनके पास देने के लिए कोई आशीष नहीं थी, क्योंकि वे स्वयं भी शाप के अधीन थे।


    उन्होंने मानवजाति को भारी उलझन और परिश्रम के जीवन में धकेल दिया, ताकि उनकी मानवजाति सांसारिक बातों में उलझी रहे और पवित्र आत्मा पर ध्यान देने के लिए उसके पास समय न बचे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठक उस शब्द या वाक्यांश को दिखाते हैं जिसे पांडुलिपि की क्षति या अपूर्णता के कारण संपादकों ने पूरा किया है।
    reason: पाठीय पुनर्स्थापन संकेत की व्याख्या।
  - marker: b
    text: ‘[थमाया]’ क्षतिग्रस्त या पुनर्स्थापित पाठ को दर्शाता है।
    reason: स्थानीय पाठीय अनिश्चितता सुरक्षित रखना।
  - marker: c
    text: ‘[शासक]’ संपादकीय पुनर्स्थापन है।
    reason: मुख्य पाठ के कोष्ठक संकेत को स्पष्ट करना।
  - marker: d
    text: इस वाक्य के कोष्ठक पांडुलिपि में रिक्ति के कारण पुनर्निर्मित शब्दों को चिह्नित करते हैं।
    reason: वाक्य के कर्ता और क्रिया में पाठीय अनिश्चितता बताना।
  - marker: e
    text: खाली कोष्ठक [] उस स्थान पर पांडुलिपि की ऐसी रिक्ति दिखाते हैं जिसे विश्वसनीय रूप से पूरा नहीं किया जा सकता।
    reason: अनसुलझी पांडुलिपीय क्षति को दृश्य रूप में बनाए रखना।
lexical_decisions:
- source_word: female spiritual nature
  choice: स्त्रीरूप आत्मिक प्रकृति
  rationale: अंश की विशिष्ट ब्रह्मांड-दृष्टि और स्त्रीलिंग व्यक्तित्व दोनों को बनाए रखता है; इसे केवल ‘आत्मा’ बनाकर अस्पष्ट नहीं किया गया।
- source_word: archon(s)
  choice: शासक / शासकों
  rationale: यूनानी मूल के सामान्य अर्थ को सहज हिन्दी में व्यक्त करता है; इस ग्रंथ में ये विरोधी ब्रह्मांडीय सत्ताएँ हैं।
- source_word: fleshly woman
  choice: मांसमय स्त्री
  rationale: आत्मिक और देहगत प्रकृति के बीच पाठ के जानबूझकर किए गए विरोध को सुरक्षित रखता है।
- source_word: merely soulish
  choice: केवल प्राणमय
  rationale: ‘आत्मिक’ से भिन्न मध्यवर्ती जीवनी/मनोवैज्ञानिक स्तर को दर्शाता है; ‘सिर्फ मानसिक’ कहना संकीर्ण होता।
- source_word: female teaching nature
  choice: स्त्रीरूप शिक्षिका-प्रकृति
  rationale: व्यक्तिवाची स्त्रीलिंगता और शिक्षा देने वाली प्रकृति दोनों को बनाए रखता है।
- source_word: Perfect Man
  choice: सिद्ध मनुष्य
  rationale: पूर्णता प्राप्त आदर्श या उद्धारकारी मानव की उपाधि का अर्थ बनाए रखता है, बिना किसी विशिष्ट पहचान को आरोपित किए।
- source_word: holy Spirit
  choice: पवित्र आत्मा
  rationale: स्थापित और स्वाभाविक हिन्दी पद; मूल के संभावित व्यक्तिवाची और सामान्य दोनों अर्थों को खुला रखता है।
- source_word: authorities
  choice: अधिकारी
  rationale: ‘शासक’ से संबंधित किंतु अलग स्रोत-पद का भेद यथासंभव बनाए रखता है।
theological_decisions:
- issue: सर्प का नैतिक और धार्मिक मूल्यांकन
  choice: उसे ‘शिक्षक’ कहा गया और आत्मिक शिक्षिका-प्रकृति के माध्यम के रूप में प्रस्तुत किया गया
  alternative: उसे स्वतः शैतान या पूर्णतः दुष्ट कहना
  rationale: यह रचना उत्पत्ति-वृत्तांत का उलट पाठ प्रस्तुत करती है; किसी बाद की धार्मिक पहचान को पाठ में नहीं जोड़ा गया।
- issue: समाएल और शासकों का संबंध
  choice: समाएल का नाम आरंभ में यथावत रखा; बाद में प्रधान शासक की पहचान उससे स्पष्टतः एक नहीं की
  alternative: हर स्थान पर समाएल नाम जोड़ना
  rationale: उपलब्ध साक्ष्य इस अंश में पहचान को हर जगह स्पष्ट नहीं करता; वास्तविक अस्पष्टता सुरक्षित रखी गई।
- issue: ‘देवताओं के समान’
  choice: बहुवचन बनाए रखा
  alternative: ‘परमेश्वर के समान’
  rationale: साक्षी-पाठ का बहुवचन इस रचना की बहुसत्तात्मक ब्रह्मांड-दृष्टि में अर्थपूर्ण है।
- issue: ‘अपने आदम’
  choice: असामान्य स्वामित्वसूचक अभिव्यक्ति बनाए रखी
  alternative: केवल ‘आदम’
  rationale: यह मानव को शासकों की बनाई हुई या उनके अधिकाराधीन सत्ता के रूप में दिखाने वाली धार्मिक धारणा को व्यक्त करती है।
- issue: पवित्र आत्मा का व्याकरणिक दर्जा
  choice: ‘पवित्र आत्मा पर ध्यान’
  alternative: ‘पवित्र आत्मा की चिंता’ या स्पष्ट व्यक्तिवाची सर्वनाम
  rationale: स्रोत में व्यक्तित्व और आत्मिक विषय के बीच संभावित तनाव को बिना अतिरिक्त व्याख्या के खुला रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। स्रोत की गूढ़ ब्रह्मांड-संबंधी शब्दावली के लिए ‘शासक’, ‘आत्मिक’, ‘मांसमय’ और ‘प्राणमय’ जैसे परस्पर भिन्न पद चुने गए हैं। यह प्रारूप उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
