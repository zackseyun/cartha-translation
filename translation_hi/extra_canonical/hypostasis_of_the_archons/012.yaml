  naturalness: भाषा सामान्यतः आधुनिक और गरिमापूर्ण है। ‘ढल सकने वाला पदार्थ’ और ‘राजाविहीन पीढ़ी’ स्रोत की विचित्रता को बचाते हुए वाचनीय हैं। ‘सत्य की [आत्मा]’ तथा ‘समस्त के पिता’ अधिक स्वाभाविक और सुस्पष्ट हैं।
  terminology: ‘पदार्थ’, ‘शासक’, ‘ज्योति’, ‘पवित्र आत्मा’ और ‘अभिषेक’ सुसंगत हैं। ‘बीज’ को बनाए रखना उचित है, क्योंकि यह ‘संतान’ से अलग स्रोत-पद है और बाद में उसके ‘निवास’ का भी उल्लेख है। ‘सबके पिता’ के स्थान पर तकनीकी व्यापकता बनाए रखने के लिए ‘समस्त के पिता’ रखा गया है।
