  revised_text: 'मैंने कहा, “मेरे प्रभु, क्या मैं भी उन्हीं के पदार्थ से उत्पन्न हुई हूँ?”


    उसने कहा, “तुम और तुम्हारी संतान उस पिता से उत्पन्न हुए हो, जो आरम्भ से विद्यमान था।


    “आत्माएँ ऊपर से, अविनाशी ज्योति से उत्पन्न होती हैं। इसलिए शासक उनके निकट नहीं आ सकते, क्योंकि उनके भीतर सत्य की आत्मा है। जो कोई सत्य के इस मार्ग को जानता है, वह नश्वर मनुष्यों के बीच मृत्युहीन होगा।


    “परन्तु वह बीज अभी प्रकट नहीं होगा। वह तीन युगों के बाद प्रकट होगा और तब उन्हें शासकों की भूल की दासता से मुक्त करेगा।”


    मैंने पूछा, “मेरे प्रभु, यह होने में अब और कितना समय लगेगा?”


    उसने मुझसे कहा, “उस घड़ी तक, जब ढल सकने वाले पदार्थ[a] में सत्य मनुष्य पिता के भेजे हुए सत्य की [आत्मा] को प्रकट करेगा।


    “तब वह उन्हें सब बातों की शिक्षा देगा और अनन्त जीवन के उस तेल से उनका अभिषेक करेगा, जो उसे राजाविहीन पीढ़ी से प्रदान किया गया है।


    “तब वे अंधी सोच से मुक्त हो जाएँगे। वे उस मृत्यु को पैरों तले रौंदेंगे, जो शासकों से उत्पन्न होती है, और उस असीम ज्योति में ऊपर चढ़ जाएँगे जहाँ यह बीज निवास करता है।


    “तब शासक अपने समयों को त्याग देंगे। उनके विनाश के कारण उनके स्वर्गदूत रोएँगे, और उनकी मृत्यु के कारण उनके दुष्टात्मा शोक करेंगे।


    “तब ज्योति के सभी पुत्र वास्तव में सत्य को, अपनी जड़ को, समस्त के पिता को और पवित्र आत्मा को जानेंगे। वे सब एक स्वर में घोषणा करेंगे, ‘पिता का सत्य न्यायपूर्ण है; पुत्र समस्त पर राज्य करता है।’ और हर एक घोषणा करेगा, ‘युगानुयुग, पवित्र, पवित्र, पवित्र! आमेन।’”


