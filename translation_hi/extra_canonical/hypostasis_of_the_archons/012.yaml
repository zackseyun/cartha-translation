  text: 'I said, “My Lord, do I too come from their matter?”


    “You and your offspring come from the Father, who existed from the beginning.


    “The souls come from above, from indestructible light. Therefore, the authorities cannot approach them because the spirit of truth is within them. Everyone who knows this path of truth will be deathless among mortal humans.


    “However, that seed will not yet be known. It will become known after three ages, and then it will free them from bondage to the error of the authorities.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He said to me, “Until the moment the True Man, in a moldable substance, reveals [the spirit of] truth that the Father has sent.


    [] “Then he will instruct them about all things, anointing them with the oil of eternal life bestowed on him by the kingless generation.


    “Then they will be freed from blind thought. They will tread on death, which comes from the authorities, and they will ascend to the infinite light where this seed dwells.


    “Then the authorities will give up their times. Their angels will weep because of their destruction, and their demons will grieve because of their death.


    “Then all the sons of light will truly know the truth, their root, the Father of the All, and the holy Spirit. They will all proclaim with one voice, ‘The truth of the Father is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever, holy, holy, holy! Amen.’”


    The Substance of the Archons'
translation:
  language: hi
  text: 'मैंने कहा, “मेरे प्रभु, क्या मैं भी उन्हीं के पदार्थ से उत्पन्न हुई हूँ?”


    उसने कहा, “तुम और तुम्हारी संतान उस पिता से उत्पन्न हुए हो, जो आरम्भ से विद्यमान था।


    “आत्माएँ ऊपर से, अविनाशी ज्योति से उत्पन्न होती हैं। इसलिए शासक उनके निकट नहीं आ सकते, क्योंकि उनके भीतर सत्य का आत्मा है। जो कोई सत्य के इस मार्ग को जानता है, वह नश्वर मनुष्यों के बीच मृत्यु से परे रहेगा।


    “परन्तु वह वंश अभी प्रकट नहीं होगा। वह तीन युगों के बाद प्रकट होगा और तब उन्हें शासकों की भूल की दासता से मुक्त करेगा।”


    मैंने पूछा, “मेरे प्रभु, यह होने में अब और कितना समय लगेगा?”


    उसने मुझसे कहा, “उस घड़ी तक, जब ढल सकने वाले पदार्थ[a] में सत्य मनुष्य उस [सत्य के आत्मा] को प्रकट करेगा, जिसे पिता ने भेजा है।


    “तब वह उन्हें सब बातों की शिक्षा देगा और अनन्त जीवन के उस तेल से उनका अभिषेक करेगा, जो उसे राजाविहीन पीढ़ी से प्रदान किया गया है।


    “तब वे अंधी सोच से मुक्त हो जाएँगे। वे उस मृत्यु को पैरों तले रौंदेंगे, जो शासकों से उत्पन्न होती है, और उस असीम ज्योति में ऊपर चढ़ जाएँगे जहाँ यह वंश निवास करता है।


    “तब शासक अपने नियत काल छोड़ देंगे। उनके विनाश के कारण उनके स्वर्गदूत रोएँगे, और उनकी मृत्यु के कारण उनके दुष्टात्मा शोक करेंगे।


    “तब ज्योति के सभी पुत्र वास्तव में सत्य को, अपनी जड़ को, सबके पिता को और पवित्र आत्मा को जानेंगे। वे सब एक स्वर में घोषणा करेंगे, ‘पिता का सत्य न्यायपूर्ण है; पुत्र सब पर राज्य करता है।’ और सब ओर से यह घोषणा होगी, ‘युगानुयुग, पवित्र, पवित्र, पवित्र! आमेन।’”


    शासकों का पदार्थ[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ढल सकने वाला पदार्थ’ यूनानी शब्द प्लाज़्मा का अनुवाद है—अर्थात ऐसा पदार्थ जिसे रूप दिया जा सके।
    reason: दुर्लभ तकनीकी शब्द और उसके भौतिक-रूपात्मक अर्थ को स्पष्ट करना।
  - marker: b
    text: शीर्षक में ‘पदार्थ’ यूनानी हाइपोस्टासिस का अनुवाद है। यहाँ इसका आशय शासकों की मूल-सामग्री या ठोस आधार से है; इसे बाद के धर्मशास्त्रीय अर्थ में नहीं समझना चाहिए।
    reason: शीर्षक के बहुअर्थी यूनानी पद की संदर्भगत व्याख्या देना।
lexical_decisions:
- source_word: hyle
  choice: पदार्थ
  rationale: यहाँ प्रश्न शासकों की भौतिक मूल-सामग्री का है; ‘पदार्थ’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: authorities / archons
  choice: शासक
  rationale: कॉप्टिक पाठ में यूनानी परंपरा के ब्रह्मांडीय शासकों का संकेत है; ‘शासक’ पदवी और विरोधी भूमिका दोनों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: seed
  choice: वंश
  rationale: संदर्भ में यह सामूहिक संतति या आध्यात्मिक वंश को सूचित करता है; शाब्दिक ‘बीज’ की तुलना में ‘वंश’ हिन्दी पाठक के लिए अधिक स्वाभाविक है, जबकि सामूहिक अर्थ सुरक्षित रहता है।
- source_word: plasma
  choice: ढल सकने वाला पदार्थ
  rationale: यूनानी शब्द आकार दिए जा सकने वाले पदार्थ को दर्शाता है; यह अनुवाद ‘देह’ जैसी व्याख्यात्मक संकीर्णता से बचता है।
- source_word: kingless generation
  choice: राजाविहीन पीढ़ी
  rationale: मूल की असामान्य ब्रह्मांडीय अभिव्यक्ति को समझाकर सामान्य बनाने के बजाय यथासंभव औपचारिक रूप में रखा गया है।
- source_word: hypostasis
  choice: पदार्थ
  rationale: शीर्षक के संदर्भ में यह शासकों की ठोस मूल-सामग्री या भौतिक आधार की ओर संकेत करता है, न कि बाद के धर्मशास्त्रीय अर्थ में ‘व्यक्ति’ की ओर।
theological_decisions:
- issue: ‘सत्य मनुष्य’ और ‘सत्य के आत्मा’ का संबंध
  choice: कोष्ठक सहित ‘उस [सत्य के आत्मा] को प्रकट करेगा’
  alternative: ‘पिता द्वारा भेजे गए सत्य को प्रकट करेगा’
  rationale: साक्ष्य में पुनर्स्थापन अनिश्चित है; कोष्ठक पाठगत पूर्ति को खुला और दृश्यमान रखते हैं।
- issue: नश्वर मनुष्यों के बीच deathless होने का अर्थ
  choice: ‘मृत्यु से परे रहेगा’
  alternative: ‘अमर होगा’
  rationale: ‘अमर’ संभावित अर्थ है, पर ‘मृत्यु से परे’ कथन की तनावपूर्ण तुलना—नश्वर मनुष्यों के बीच मृत्युहीनता—को अधिक स्पष्ट रूप से बचाता है।
- issue: पुत्र का सार्वभौम शासन
  choice: ‘पुत्र सब पर राज्य करता है’
  alternative: ‘पुत्र सम्पूर्णता पर राज्य करता है’
  rationale: ‘the All’ ब्रह्मांडीय पूर्णता का तकनीकी संकेत हो सकता है, पर मुख्य पाठ में स्वाभाविक हिन्दी के साथ उसकी व्यापकता रखी गई है।
- issue: शासकों के angels
  choice: ‘उनके स्वर्गदूत’
  alternative: ‘उनके दूत’
  rationale: ब्रह्मांडीय संदर्भ में ‘स्वर्गदूत’ अधिक पहचानने योग्य है, यद्यपि ये सकारात्मक दिव्य दूत नहीं माने गए हैं; संबंधसूचक ‘उनके’ इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वाचनयोग्य रखी गई है। स्रोत-भाषा की प्रत्यक्ष समीक्षा लंबित होने के कारण उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य को सावधानी से आधार बनाया गया है। पांडुलिपि की रिक्ति को अलग [] चिह्न के रूप में नहीं रखा गया, क्योंकि वह हिन्दी में अर्थपूर्ण स्थान नहीं बताती; वास्तविक पुनर्स्थापन [सत्य के आत्मा] को कोष्ठकों में सुरक्षित रखा गया है।
