translation:
  language: hi
  text: '[] सत्ताओं के उस तत्त्व[a] के विषय में (जिससे वे बनाई गई थीं)।


    सत्य के पिता की आत्मा के द्वारा महान प्रेरित ने अंधकार की सत्ताओं का उल्लेख किया और हमें बताया कि “हमारा संघर्ष मांस और [लहू] से नहीं, बल्कि विश्वगत सत्ताओं और बुराई की आत्माओं से है।” मैंने यह लेख तुम्हें इसलिए भेजा है, क्योंकि तुमने सत्ताओं के उस तत्त्व के विषय में पूछा था (जिससे वे बनाई गई थीं)।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है। यहाँ ‘तत्त्व’ उस मूल वास्तविकता या पदार्थ को व्यक्त करता है जिससे सत्ताएँ बनाई गई बताई जाती हैं। आरंभ का “[]” और “[लहू]” पांडुलिपि की क्षति अथवा संपादकीय पुनर्स्थापना के संकेत के रूप में सुरक्षित रखे गए हैं।
    reason: मूल कॉप्टिक की समीक्षा लंबित होने, ‘substance’ की अर्थ-सीमा, और वर्ग कोष्ठकों की पाठालोचनात्मक भूमिका को पारदर्शी बनाना।
lexical_decisions:
- source_word: substance
  choice: तत्त्व
  rationale: यहाँ आशय उस मूल वास्तविकता या पदार्थ से है जिससे सत्ताएँ बनी मानी गई हैं। ‘तत्त्व’ हिंदी में इस दार्शनिक व्यापकता को बनाए रखता है; इसे केवल भौतिक ‘पदार्थ’ तक सीमित नहीं करता।
- source_word: authorities
  choice: सत्ताएँ
  rationale: पाठ में ये अंधकार से जुड़ी विश्वगत आध्यात्मिक शक्तियाँ हैं। ‘सत्ताएँ’ उनके अधिकार और अस्तित्व, दोनों का संकेत देती है तथा उन्हें केवल मानवीय अधिकारियों के रूप में सीमित नहीं करती।
- source_word: cosmic authorities
  choice: विश्व की शासक शक्तियाँ
  rationale: ‘विश्वगत सत्ताएँ’ की अपेक्षा यह साधारण पाठक के लिए अधिक स्वाभाविक है, जबकि इन शक्तियों के विश्व-स्तरीय शासन का भाव सुरक्षित रहता है।
- source_word: battle
  choice: संघर्ष
  rationale: ‘संघर्ष’ आध्यात्मिक विरोध का स्वाभाविक हिंदी रूप है और अनिवार्य रूप से भौतिक युद्ध का अर्थ नहीं देता।
- source_word: spirits of evil
  choice: दुष्टता की आत्माएँ
  rationale: यह संबंधवाचक संरचना मूल साक्ष्य की अभिव्यक्ति को बनाए रखती है और ‘दुष्ट आत्माएँ’ कहकर अर्थ को अनावश्यक रूप से सरल नहीं करती।
theological_decisions:
- issue: ‘सत्ताओं’ की पहचान
  choice: उन्हें विश्वगत आध्यात्मिक शासक शक्तियों के रूप में संकेतित किया गया, पर उनकी प्रकृति को अधिक स्पष्ट नहीं किया गया।
  alternative: उन्हें सीधे ‘दुष्टात्माएँ’, ‘प्रधानताएँ’ या मानवीय ‘अधिकारी’ कहना।
  rationale: पाठ स्वयं ‘अंधकार की सत्ताओं’, ‘विश्व की शासक शक्तियों’ और ‘दुष्टता की आत्माओं’ के बीच संबंध रखता है, पर इन सभी को पूर्णतः समान ठहराना आवश्यक नहीं।
- issue: ‘महान प्रेरित’ की पहचान
  choice: पाठ की तरह उसे अनाम रखा गया।
  alternative: उसे पौलुस के रूप में स्पष्ट करना।
  rationale: उद्धरण पौलिनी परंपरा से जुड़ा है, फिर भी उपलब्ध पाठ यहाँ प्रेरित का नाम नहीं देता; अनामता बनाए रखना स्रोत के प्रति अधिक निष्ठावान है।
- issue: ‘सत्य के पिता के आत्मा’ की भूमिका
  choice: ‘के द्वारा’ का माध्यम-सूचक रूप रखा गया।
  alternative: ‘की प्रेरणा से’ या ‘के आदेश से’ कहना।
  rationale: ये विकल्प आत्मा की क्रिया का अधिक विशिष्ट धर्मवैज्ञानिक अर्थ निर्धारित कर देते, जो साक्ष्य में स्पष्ट नहीं है।
