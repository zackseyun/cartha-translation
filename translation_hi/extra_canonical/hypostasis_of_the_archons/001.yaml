  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। दार्शनिक पदावली को अत्यधिक संस्कृतनिष्ठ बनाने से बचते हुए ‘तत्त्व’ और ‘सत्ताएँ’ जैसे संक्षिप्त शब्द चुने गए हैं। एकवचन संबोधन ‘तुम्हें/तुमने’ स्रोत के व्यक्तिगत पत्रात्मक स्वर को बनाए रखता है। नंगा पांडुलिपि-पृष्ठ अंक हटाया गया है, जबकि क्षति या पुनर्स्थापना दर्शाने वाले वर्ग कोष्ठक सुरक्षित हैं।
