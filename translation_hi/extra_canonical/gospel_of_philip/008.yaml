translation:
  language: hi
  text: 'यीशु ने उन सबको गुप्त रूप से अपने वश में कर लिया,[a] क्योंकि वह जैसा था वैसा प्रकट नहीं हुआ, बल्कि वह वैसे प्रकट हुआ जैसे वे उसे देख सकते थे। वह उन्हें [इन सभी] रूपों में प्रकट हुआ: वह बड़ों को बड़ा दिखाई दिया; छोटों को छोटा दिखाई दिया; स्वर्गदूतों को स्वर्गदूत के रूप में और मनुष्यों को मनुष्य के रूप में दिखाई दिया। इस प्रकार उसका वचन सबसे छिपा रहा। कुछ लोगों ने उसे देखा तो सही, पर उन्हें लगा कि वे स्वयं को देख रहे हैं। लेकिन जब वह पहाड़ पर महिमा में अपने शिष्यों को दिखाई दिया, तब वह छोटा नहीं था। वह महान हो गया, और उसने शिष्यों को भी महान बनाया, ताकि वे उसे महान रूप में देख सकें।


    उस दिन यूखरिस्त[b] में उसने कहा, “हे तुम, जिसने सिद्ध ज्योति को पवित्र आत्मा के साथ एक किया है, स्वर्गदूतों को भी हमारे साथ, प्रतिरूपों के साथ, एक कर!”[c]


    मेमने को तुच्छ न समझो, क्योंकि उसके बिना द्वार को देखना असंभव है। कोई भी नंगा होकर राजा के निकट नहीं आ सकेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गुप्त रूप से अपने वश में कर लिया” का आधार उपलब्ध अंग्रेज़ी साक्ष्य का “took all of them by stealth” है; यहाँ क्रिया का सटीक आशय अनिश्चित है।
    reason: प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने के कारण असामान्य वाक्यांश की अनिश्चितता बताना आवश्यक है।
  - marker: b
    text: “यूखरिस्त” आरंभिक मसीही धन्यवाद-भोज या पवित्र सहभागिता के लिए प्रयुक्त पारिभाषिक शब्द है।
    reason: आधुनिक सामान्य हिन्दी पाठक के लिए लिप्यंतरित धार्मिक पद का संक्षिप्त स्पष्टीकरण।
  - marker: c
    text: इस वाक्य का संबोधन और “हमारे साथ, प्रतिरूपों के साथ” का परस्पर संबंध अस्पष्ट है; अनुवाद उपलब्ध साक्ष्य की संरचना को निकटता से रखता है।
    reason: खंड के धर्मवैचारिक रूप से कठिन और संभवतः पाठगत रूप से अस्थिर वाक्य को अत्यधिक स्पष्ट करने से बचना।
lexical_decisions:
- source_word: took all of them by stealth
  choice: उन सबको गुप्त रूप से अपने वश में कर लिया
  rationale: अंग्रेज़ी साक्ष्य के ‘took’ और ‘by stealth’ दोनों पक्षों को रखते हुए जानबूझकर कुछ अर्थगत खुलापन बचाया गया है; इसे केवल ‘धोखा दिया’ नहीं बनाया गया।
- source_word: his Word
  choice: उसका वचन
  rationale: ‘Word’ की संभावित व्यक्तिवाचक या प्रकाशन-संबंधी गूंज को बनाए रखने के लिए ‘वचन’ चुना गया।
- source_word: great / small
  choice: बड़ा/महान; छोटा
  rationale: दृश्य आकार और आध्यात्मिक महत्ता के बीच मूल तनाव को पूरी तरह एक ही अर्थ में सीमित नहीं किया गया; अंतिम प्रसंग में स्वाभाविक हिन्दी के लिए ‘महान’ रखा गया।
- source_word: Eucharist
  choice: यूखरिस्त
  rationale: विशिष्ट प्राचीन धार्मिक संदर्भ को सामान्य ‘धन्यवाद’ या किसी संप्रदाय-विशेष पद में विलीन करने के बजाय पारिभाषिक लिप्यंतरण रखा गया।
- source_word: images
  choice: प्रतिरूपों
  rationale: ‘प्रतिमाएँ’ से मूर्तियों का अनावश्यक संकेत आ सकता था; ‘प्रतिरूप’ मूल की रूप/छवि संबंधी अस्पष्टता बेहतर रखता है।
- source_word: lamb
  choice: मेमना
  rationale: प्रतीकात्मक पहचान को व्याख्या द्वारा निश्चित किए बिना प्रत्यक्ष रूपक सुरक्षित रखा गया।
- source_word: naked
  choice: नंगा
  rationale: वस्त्रहीनता और संभावित आध्यात्मिक अर्थ के तनाव को बिना विस्तार दिए सीधे रखा गया।
theological_decisions:
- issue: यीशु का भिन्न दर्शकों के अनुसार भिन्न रूप में प्रकट होना
  choice: कथन को प्रत्यक्ष रूप में रखा गया
  alternative: इसे केवल दर्शकों की सीमित अनुभूति के रूप में समझाकर अनुवाद करना
  rationale: पाठ प्रकट होने और देखने दोनों की भाषा रखता है; अनुवाद किसी एक तात्त्विक व्याख्या को निर्णायक नहीं बनाता।
- issue: ‘उसका वचन’ का स्वरूप
  choice: ‘वचन’ को बिना अतिरिक्त व्याख्या बनाए रखा
  alternative: ‘उसकी असली पहचान’ या स्पष्ट व्यक्तिवाचक ‘वचन’
  rationale: साक्ष्य में निहित संभावित बहुअर्थकता और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: यूखरिस्तीय वाक्य में वक्ता और संबोधन
  choice: एकवचन संबोधन ‘हे तुम, जिसने…’ रखा
  alternative: बहुवचन समुदाय को संबोधन या परमेश्वर को स्पष्ट संबोधन
  rationale: अंग्रेज़ी साक्ष्य का वाक्य रचनात्मक संबंध अस्पष्ट है; अनुवाद इसे किसी निश्चित उपासना-पद्धति या संबोधित सत्ता से नहीं बांधता।
- issue: मेमना, द्वार और राजा की पहचान
  choice: रूपकों को बिना पहचानों का नाम दिए रखा
  alternative: मेमने, द्वार और राजा को स्पष्ट रूप से मसीह/परमेश्वर कहना
  rationale: पाठ की प्रतीकात्मक परत और संभावित अलग-अलग संदर्भों को खुला रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। कोष्ठकीय पुनर्स्थापन संकेतों के लिए वर्ग कोष्ठक सुरक्षित रखे गए हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है।
