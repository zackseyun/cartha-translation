translation:
  language: hi
  text: 'शासक मानवजाति को धोखा देना चाहते थे, क्योंकि उन्होंने देखा कि मानवजाति का उनसे नाता है जो सचमुच भले हैं। उन्होंने भले लोगों के नाम लेकर उन्हें उन पर रख दिया जो भले नहीं हैं, ताकि नामों के द्वारा मानवजाति को धोखा दें और उसे उन लोगों से बाँध दें जो भले नहीं हैं। और फिर वे उन पर कैसा उपकार करते हैं! वे उन्हें उन लोगों के बीच से निकालते हैं जो भले नहीं हैं और भले लोगों के बीच रख देते हैं। शासक जानते थे कि वे क्या कर रहे हैं, क्योंकि वे स्वतंत्र लोगों को लेकर सदा के लिए दासता में डालना चाहते थे। कुछ शक्तियाँ हैं जो […] मानवजाति, और नहीं चाहतीं कि वे [बचाए जाएँ], ताकि वे […] क्योंकि यदि मानवजाति [बचा ली जाती], तो बलिदान [नहीं] होते […] और शक्तियों को पशु भेंट नहीं किए जाते, क्योंकि जिन्हें भेंट चढ़ाई जाती थी, वे पशु थे। उन्हें जीवित ही भेंट किया जाता था, पर भेंट किए जाने पर वे मर जाते थे। एक मनुष्य परमेश्वर को मरा हुआ भेंट किया गया, और वह जीवित हो गया।


    मसीह के आने से पहले संसार में कोई रोटी नहीं थी—ठीक वैसे ही जैसे उस स्वर्गोद्यान में, जहाँ आदम था, पशुओं के भोजन के लिए बहुत-से पेड़ तो थे, पर मानवजाति के भोजन के लिए गेहूँ नहीं था। मानवजाति पशुओं की तरह खाती थी; पर जब सिद्ध मनुष्य मसीह आया, तो वह स्वर्ग से रोटी लाया, ताकि मानवजाति को मनुष्यों का भोजन मिले।


    शासकों ने सोचा कि उन्होंने जो कुछ किया, अपनी ही सामर्थ्य और इच्छा से किया; पर पवित्र आत्मा उनके द्वारा गुप्त रूप से वह सब पूरा कर रहा था जो वह चाहता था। सत्य, जो आरम्भ से अस्तित्व में है, हर जगह बोया जाता है। बहुत-से लोग उसे बोया जाता हुआ देखते हैं, पर बहुत कम लोग उसे काटा जाता हुआ देखते हैं।'
