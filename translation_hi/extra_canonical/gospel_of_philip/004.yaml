lexical_decisions:
- source_word: rulers
  choice: शासक
  rationale: पाठ की ब्रह्मांडीय अथवा आध्यात्मिक शक्तियों की धारणा को किसी विशेष सांप्रदायिक तकनीकी शब्द में सीमित किए बिना व्यक्त करता है।
- source_word: humanity
  choice: मानवजाति
  rationale: सामूहिक मानवता का अर्थ बनाए रखता है और जहाँ सर्वनाम संदिग्ध हो सकते थे वहाँ स्पष्टता देता है।
- source_word: kinship
  choice: नाता
  rationale: वंश, आत्मीयता या संबंध की मूल व्यापकता को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: powers
  choice: शक्तियाँ
  rationale: अलौकिक या शासकीय सामर्थ्यों के लिए औपचारिक और अर्थगत रूप से खुला शब्द।
- source_word: the perfect human
  choice: सिद्ध मनुष्य
  rationale: ‘perfect’ के पूर्णता/परिपक्वता संबंधी तनाव को बनाए रखता है और मसीह की मानवता को स्पष्ट रखता है।
- source_word: bread from heaven
  choice: स्वर्ग से रोटी
  rationale: प्रत्यक्ष रूपक को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखता है।
- source_word: Holy Spirit
  choice: पवित्र आत्मा
  rationale: मानक आधुनिक हिन्दी धार्मिक पदावली।
- source_word: reaped
  choice: काटा जाता हुआ
  rationale: बीज बोने और फसल काटने की कृषि-छवि को निरंतर रखता है।
theological_decisions:
- issue: भले लोगों के नामों का अभलों को दिया जाना और बाद में स्थानांतरण
  choice: पाठ की विडंबनापूर्ण और तनावपूर्ण भाषा को यथावत रखा गया
  alternative: इसे नामकरण द्वारा छल और बाद के उद्धार की स्पष्ट व्याख्या में बदलना
  rationale: मूल साक्ष्य में कथन का आशय जानबूझकर उलझा हुआ प्रतीत होता है; अनुवाद में उसे किसी एक धर्मवैज्ञानिक योजना के अनुसार नहीं सुलझाया गया।
- issue: मरे हुए मनुष्य का परमेश्वर को भेंट होना और जीवित होना
  choice: ‘एक मनुष्य’ और ‘जीवित हो गया’ का सीधा अनुवाद
  alternative: स्पष्ट रूप से यीशु का नाम जोड़ना या पुनरुत्थान की व्याख्या करना
  rationale: संकेत संभव है, पर उपलब्ध साक्ष्य व्यक्ति का नाम नहीं देता; इसलिए निहितार्थ को खुला रखा गया।
- issue: पवित्र आत्मा का शासकों के द्वारा कार्य करना
  choice: कर्ता के रूप में पवित्र आत्मा और माध्यम के रूप में शासकों को बनाए रखा
  alternative: शासकों के काम के बावजूद आत्मा के अलग कार्य की व्याख्या
  rationale: ‘उनके द्वारा’ की कठिन धर्मवैज्ञानिक बात को नरम या परिवर्तित नहीं किया गया।
- issue: रोटी और मनुष्यों के भोजन का अर्थ
  choice: रोटी, गेहूँ और भोजन की प्रतीकात्मक भाषा को बिना व्याख्या रखा
  alternative: इसे यूखरिस्त, शिक्षा या स्वर्गीय ज्ञान के रूप में स्पष्ट करना
  rationale: पाठ स्वयं प्रतीक का एकमात्र अर्थ निर्धारित नहीं करता।
