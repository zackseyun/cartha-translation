base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/006.yaml
  text: “Jesus” is a hidden name; “Christ” is a revealed name. So “Jesus” is not translated, but he is called by his name “Jesus.” But the name “Christ” in Syriac is “Messiah,” in Greek “Christ,” and all the others have it according to their own language. “The Nazarene” reveals what is hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.
translation:
  language: hi
  text: “यीशु” एक गुप्त नाम है; “ख्रीस्त” एक प्रकट नाम है। इसलिए “यीशु” का अनुवाद नहीं किया जाता, बल्कि उसे उसके अपने नाम, “यीशु,” से पुकारा जाता है। पर “ख्रीस्त” नाम सिरियाई भाषा में “मसीहा” और यूनानी भाषा में “ख्रीस्त” है; बाकी सभी लोग भी इसे अपनी-अपनी भाषा के अनुसार कहते हैं। “नासरी” गुप्त बात को प्रकट करता है। ख्रीस्त के भीतर सब कुछ है—चाहे मनुष्य हो, स्वर्गदूत हो, रहस्य हो या पिता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर अस्थायी रूप से आधारित है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी शेष है। अंतिम वाक्य की सूची-संबंधी वाक्यरचना भी कुछ अस्पष्ट है।
    reason: दिए गए स्रोत-विवरण की सीमा और अंतिम वाक्य में मौजूद वास्तविक अनिश्चितता को पाठक के सामने पारदर्शी बनाना।
lexical_decisions:
- source_word: Jesus
  choice: यीशु
  rationale: आधुनिक मानक हिन्दी में इस नाम का प्रचलित और सहज रूप; नाम का अनुवाद न किए जाने संबंधी कथन भी इससे स्पष्ट रहता है।
- source_word: Christ
  choice: ख्रीस्त
  rationale: इस अनुच्छेद में उपाधि के विभिन्न भाषायी रूपों पर विशेष बल है। इसलिए इसे हर जगह सामान्य हिन्दी ‘मसीह’ में बदल देने के बजाय यूनानी-आधारित नामरूप ‘ख्रीस्त’ रखा गया, ताकि सिरियाई ‘मसीहा’ से उसका भाषायी भेद दिखाई दे।
- source_word: Messiah
  choice: मसीहा
  rationale: सिरियाई नामरूप को हिन्दी में पहचाने जाने योग्य लिप्यंतरण के रूप में रखा गया है।
- source_word: the Nazarene
  choice: नासरी
  rationale: यीशु से जुड़ी इस उपाधि का स्वाभाविक हिन्दी रूप; मूल कथन में इसके द्वारा गुप्त बात प्रकट किए जाने की शब्दगत पहेली को बिना समझाए सुरक्षित रखता है।
- source_word: hidden
  choice: गुप्त
  rationale: नाम और बाद की ‘गुप्त बात’ के बीच आंतरिक संबंध बनाए रखने वाला सरल, गरिमापूर्ण शब्द।
- source_word: mystery
  choice: रहस्य
  rationale: धार्मिक तथा सामान्य दोनों संदर्भों में स्वाभाविक हिन्दी शब्द, बिना किसी विशेष सांप्रदायिक व्याख्या के।
theological_decisions:
- issue: ख्रीस्त के भीतर मौजूद ‘सब कुछ’ की सूची और पिता का स्थान
  choice: “चाहे मनुष्य हो, स्वर्गदूत हो, रहस्य हो या पिता” को एक ही समांतर सूची के रूप में रखा गया।
  alternative: ‘मनुष्य, स्वर्गदूत या रहस्य—और पिता भी’ अथवा पिता को सूची से अलग वाक्यांश मानना।
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की वाक्यरचना अस्पष्ट है। हिन्दी पाठ सूची-संबंध को बनाए रखता है और किसी विशिष्ट तत्त्वमीमांसात्मक क्रम या संबंध को आरोपित नहीं करता।
- issue: ‘नासरी’ द्वारा गुप्त का प्रकट होना
  choice: कथन को सीधे और अनिर्वचित रूप में रखा गया।
  alternative: इसे किसी अनुमानित शब्द-व्युत्पत्ति या विशेष रहस्यवादी अर्थ के द्वारा समझाना।
  rationale: उपलब्ध साक्ष्य कथन का आशय स्पष्ट नहीं करता; अतः वास्तविक अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। अनुच्छेद की भाषायी शब्द-क्रीड़ा बचाने के लिए ‘ख्रीस्त’ और ‘मसीहा’ को अलग रूपों में रखा गया है। उपलब्ध आधार कॉप्टिक मूल नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए अनावश्यक मूल-भाषायी पुनर्निर्माण से परहेज़ किया गया है।
