translation:
  language: hi
  text: 'जो लोग कहते हैं कि प्रभु पहले मरा और फिर जी उठा, वे गलत हैं, क्योंकि वह पहले जी उठा और फिर मरा। जो पहले पुनरुत्थान को प्राप्त नहीं करता, वह नहीं मरेगा। जीवित परमेश्वर की शपथ, वह /मरेगा\![a]


    कोई भी किसी बड़ी और मूल्यवान वस्तु को किसी बड़ी वस्तु में नहीं छिपाता; पर अकसर किसी ने केवल एक पैसे की वस्तु में अनगिनत हजारों रख दिए हैं। आत्मा के साथ भी ऐसा ही है—एक मूल्यवान वस्तु तुच्छ देह में अस्तित्व में आई।


    कुछ लोग डरते हैं कि वे नग्न जी उठेंगे। इसलिए वे देह में जी उठना चाहते हैं, और [वे] नहीं जानते कि जो [देह] को पहने हुए हैं, वे ही नग्न हैं। जो [...] अपने आपको नग्न करने वाले [हैं], वे नग्न नहीं हैं।[b] “मांस [और लहू परमेश्वर के] राज्य के वारिस नहीं होंगे।” वह क्या है जो वारिस नहीं होगा? वह जो हमारे ऊपर है। फिर वह क्या है जो वारिस होगा? वह यीशु का मांस और लहू है। इसी कारण उसने कहा, “जो मेरा मांस नहीं खाता और मेरा लहू नहीं पीता, उसमें जीवन नहीं है।” उसका मांस क्या है? वह वचन है, और उसका लहू पवित्र आत्मा है। जिन्होंने इन्हें प्राप्त किया है, उनके पास भोजन, पेय और वस्त्र हैं।


    इसलिए मैं स्वयं उन दूसरे लोगों से असहमत हूँ जो कहते हैं, “वह नहीं जी उठेगा।” दोनों पक्ष गलत हैं। तुम जो कहते हो, “देह नहीं जी उठेगी,” हमें बताओ कि क्या जी उठेगा, ताकि हम तुम्हारा सम्मान करें। तुम कहते हो, “देह में आत्मा, और देह में यह दूसरा प्रकाश।” पर यह कथन भी देह में है, क्योंकि तुम जो कुछ भी कहते हो, देह से अलग होकर नहीं कह सकते। इसी देह में जी उठना आवश्यक है, क्योंकि सब कुछ इसी में विद्यमान है। इस संसार में लोग अपने पहने हुए वस्त्रों से श्रेष्ठ हैं; स्वर्ग के राज्य में वस्त्र उन्हें पहनने वालों से श्रेष्ठ हैं।


    हर वस्तु जल और आग से शुद्ध की जाती है—दिखाई देने वाली वस्तु दिखाई देने वाली से, और छिपी हुई वस्तु छिपी हुई से। कुछ वस्तुएँ दिखाई देने वाली वस्तुओं के द्वारा छिपी रहती हैं। जल के भीतर जल है, और अभिषेक-तेल के भीतर आग है।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “/मरेगा\” की असामान्य लेखन-चिह्नावली उपलब्ध अंग्रेज़ी साक्ष्य से ज्यों की त्यों रखी गई है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: आधार-साक्ष्य की असामान्य और संभवतः पाठालोचनात्मक चिह्नावली को पारदर्शी बनाना।
  - marker: b
    text: कोष्ठक और तीन बिंदु पांडुलिपि की क्षति अथवा संपादकीय पुनर्स्थापन का संकेत देते हैं; इसलिए वाक्य अधूरा और उसका ठीक अर्थ अनिश्चित है।
    reason: क्षतिग्रस्त पाठ को चुपचाप पूरा करने से बचना।
  - marker: c
    text: “अभिषेक-तेल” उस सुगंधित अभिषेक-द्रव्य को दर्शाता है जिसे प्रायः यूनानी मूल के शब्द “क्रिस्म” से व्यक्त किया जाता है।
    reason: तकनीकी संस्कारगत पद को सामान्य हिन्दी पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: resurrection / arose
  choice: पुनरुत्थान / जी उठा
  rationale: संज्ञा के लिए प्रचलित और धर्मशास्त्रीय रूप से खुला ‘पुनरुत्थान’ रखा गया है, जबकि क्रियात्मक कथन में स्वाभाविक हिन्दी ‘जी उठा’ प्रयुक्त है।
- source_word: flesh
  choice: देह / मांस
  rationale: जहाँ मानवीय शारीरिक अस्तित्व या पहने जाने वाले आवरण की बात है वहाँ ‘देह’, और उद्धृत ‘flesh and blood’ तथा यीशु के मांस खाने वाले कथन में पारंपरिक समानांतरता के लिए ‘मांस’ रखा गया है।
- source_word: Word
  choice: वचन
  rationale: व्यक्तिवाचक और धर्मशास्त्रीय संकेत को बनाए रखने के लिए ‘वचन’ चुना गया है, बिना उसकी व्याख्या को पाठ में जोड़ने के।
- source_word: chrism
  choice: अभिषेक-तेल
  rationale: संस्कारगत अभिषेक-द्रव्य का अर्थ साधारण पाठक तक पहुँचाने के लिए स्पष्ट हिन्दी पद चुना गया है; इसे केवल सामान्य ‘तेल’ नहीं किया गया।
- source_word: acquire / receive
  choice: प्राप्त करना
  rationale: पुनरुत्थान को वर्तमान में प्राप्त करने की पाठ की असामान्य धारणा को नरम किए बिना व्यक्त करता है।
theological_decisions:
- issue: ‘वह पहले जी उठा और फिर मरा’ का कालक्रम
  choice: विरोधाभासी प्रतीत होने वाला क्रम ज्यों का त्यों रखा
  alternative: इसे आध्यात्मिक पुनरुत्थान की व्याख्या से स्पष्ट करना
  rationale: पाठ स्वयं इस तनाव की व्याख्या नहीं करता; अनुवाद में किसी संप्रदायगत या निजी व्याख्या को नहीं जोड़ा गया।
- issue: कौन-सी देह जी उठती है
  choice: ‘इसी देह में जी उठना आवश्यक है’ का सीधा कथन रखा
  alternative: ‘इस देह से’ या केवल ‘आत्मिक देह’ कहना
  rationale: साक्ष्य में उपस्थित देह, आत्मा और प्रकाश के तनाव को अनिर्णीत रखा गया है।
- issue: यीशु का मांस और लहू
  choice: पाठ के अपने स्पष्टीकरण—वचन और पवित्र आत्मा—को सीधे रखा
  alternative: इसे प्रभु-भोज या किसी विशिष्ट संस्कार-सिद्धांत के रूप में समझाना
  rationale: पाठ में दिए रूपक से आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ा गया।
- issue: राज्य के वारिस होने वाला तत्व
  choice: ‘यीशु का मांस और लहू’ रखा
  alternative: व्याकरण को सहज बनाने के लिए ‘हमारे भीतर का आत्मिक तत्व’ कहना
  rationale: स्रोत-साक्ष्य के चौंकाने वाले उत्तर को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। उद्धरण, पुनरावृत्ति, विरोधाभास, वर्ग-कोष्ठक और पाठ-क्षति के संकेत सुरक्षित रखे गए हैं। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी स्रोत-समीक्षित सेतु है; कॉप्टिक मूल का प्रत्यक्ष परीक्षण लंबित होने के कारण अनिश्चित स्थानों पर निर्णायक सुधार नहीं किया गया।
