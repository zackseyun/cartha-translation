id: GPHIL.005
reference: Gospel of Philip — The Virgin Birth
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: 'Some say that "Mary conceived by the Holy Spirit." They''re wrong; they don''t know what they''re saying. When did a woman ever conceive by a woman? "Mary is the virgin whom no power defiled" is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex II,3, 51.29-86.19
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.gospels.net/philip
  witness_translator: Mark M. Mattison
  witness_license: Public Domain dedication stated on source page
  english_witness: 'Some say that "Mary conceived by the Holy Spirit." They''re wrong; they don''t know what they''re saying. When did a woman ever conceive by a woman? "Mary is the virgin whom no power defiled" is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/005.yaml
  text: 'Some say, “Mary conceived by the Holy Spirit.” They are wrong; they do not know what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Instead, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house, but do not steal anything from the Father’s house or carry it away.”'
translation:
  language: hi
  text: 'कुछ लोग कहते हैं, “मरियम ने पवित्र आत्मा से गर्भधारण किया।” वे गलत हैं; वे नहीं जानते कि वे क्या कह रहे हैं। कब किसी स्त्री ने किसी स्त्री से गर्भधारण किया है?[a] “मरियम वह कुँवारी है जिसे किसी शक्ति ने अशुद्ध नहीं किया”—यह उन इब्रानियों की महान गवाही है जो (पहले) प्रेरित और (उनके) प्रेरितिक (उत्तराधिकारी) बने। वह कुँवारी, जिसे किसी शक्ति ने अशुद्ध नहीं किया […] शक्तियों ने अपने-आपको अशुद्ध कर लिया।


    और यदि उसका कोई दूसरा पिता न होता, तो प्रभु ने यह न कहा होता, “मेरा [पिता, जो] स्वर्ग में [है]”; बल्कि वह केवल इतना कहता, [“मेरा पिता।”] प्रभु ने [शिष्यों] से कहा, “[…] हर [घर से] और पिता के घर में ले आओ; पर पिता के घर से कुछ चुराओ मत, न वहाँ से उठाकर ले जाओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह प्रश्न उपलब्ध अंग्रेज़ी साक्षी में ‘पवित्र आत्मा’ को स्त्री के रूप में ग्रहण करने वाले शब्द-खेल या व्याकरणिक तर्क पर निर्भर प्रतीत होता है। कॉप्टिक मूल की प्रत्यक्ष समीक्षा लंबित है।
    reason: हिन्दी में ‘आत्मा’ का व्याकरणिक और सांस्कृतिक बोध उस प्राचीन तर्क को स्वतः स्पष्ट नहीं करता; स्रोत-सीमा बताना आवश्यक है।
lexical_decisions:
- source_word: Holy Spirit
  choice: पवित्र आत्मा
  rationale: मानक और व्यापक रूप से समझा जाने वाला धार्मिक पद; अंग्रेज़ी साक्षी में ‘Spirit’ के स्त्रीलिंग माने जाने पर आधारित अगले अलंकारिक प्रश्न को बदले बिना सुरक्षित रखता है।
- source_word: virgin
  choice: कुँवारी
  rationale: आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण; संदर्भ में यौन-अस्पृश्यता के दावे को स्पष्ट रखता है।
- source_word: power / powers
  choice: शक्ति / शक्तियाँ
  rationale: एकवचन और बहुवचन की जानबूझकर की गई पुनरावृत्ति सुरक्षित रहती है; इसे ‘सत्ता’ या किसी निश्चित स्वर्गदूतीय श्रेणी के रूप में व्याख्यायित नहीं किया गया।
- source_word: defiled
  choice: अशुद्ध किया / अशुद्ध कर लिया
  rationale: मूल साक्षी की धार्मिक और नैतिक बहुअर्थकता बनाए रखता है; अधिक संकीर्ण ‘भ्रष्ट’ या ‘अपवित्र’ से बचता है।
- source_word: apostles / apostolic successors
  choice: प्रेरित / प्रेरितिक उत्तराधिकारी
  rationale: पहले पद के लिए प्रचलित बाइबलीय शब्द और दूसरे के लिए संस्थागत अर्थ थोपे बिना निकट अनुवाद।
- source_word: Father’s house
  choice: पिता का घर
  rationale: रूपक को सरल बनाकर व्याख्या करने के बजाय स्रोत की शब्दावली और पुनरावृत्ति सुरक्षित रखी गई।
theological_decisions:
- issue: पवित्र आत्मा के संबंध में स्त्री से स्त्री के गर्भधारण वाला तर्क
  choice: विरोधाभासी कथन को ज्यों का त्यों रखा और फुटनोट में उसके भाषिक आधार की सीमा बताई।
  alternative: ‘आत्मा’ को व्याकरणिक स्त्रीलिंग बताते हुए मुख्य पाठ में ही अर्थ स्पष्ट करना।
  rationale: उपलब्ध आधार केवल अंग्रेज़ी साक्षी है और कॉप्टिक समीक्षा लंबित है; मुख्य पाठ में व्याख्या जोड़ने से लेखक का विवादात्मक तर्क बदल जाता।
- issue: ‘शक्तियाँ’ की पहचान
  choice: अनिर्दिष्ट ‘शक्तियाँ’ रखा।
  alternative: दुष्ट आत्माएँ, शासक शक्तियाँ या स्वर्गीय सत्ताएँ।
  rationale: साक्षी किसी एक पहचान को निश्चित नहीं करता; धार्मिक तंत्र आरोपित नहीं किया गया।
- issue: यीशु के ‘दूसरे पिता’ का कथन
  choice: कठिन धार्मिक तनाव को बिना सामंजस्य बिठाए सुरक्षित रखा।
  alternative: सांसारिक पिता और स्वर्गीय पिता का स्पष्ट भेद जोड़ना।
  rationale: ऐसा स्पष्टीकरण पाठ में नहीं है और कथन की वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: कोष्ठकों और रिक्तियों का स्वरूप
  choice: वर्ग कोष्ठक, दीर्घविराम और गोल कोष्ठक सुरक्षित रखे।
  alternative: पुनर्निर्मित पाठ को निर्बाध वाक्यों में प्रस्तुत करना।
  rationale: ये पांडुलिपि-क्षति, संपादकीय पूर्ति या अनिश्चित विस्तार के संकेत हैं; इन्हें हटाना पाठ की निश्चितता बढ़ाकर दिखाता।
translation_notes:
  register: भाषा आधुनिक, पठनीय और गरिमापूर्ण रखी गई है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी अनुवाद है; कॉप्टिक स्रोत-पाठ की प्रत्यक्ष समीक्षा अभी लंबित है। वर्ग कोष्ठक पांडुलिपि की क्षति या संपादकीय पुनर्स्थापन, दीर्घविराम लुप्त पाठ, और गोल कोष्ठक अनिश्चित या व्याख्यात्मक पूर्ति दर्शाते हैं।
