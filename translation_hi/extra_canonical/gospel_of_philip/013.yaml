translation:
  language: hi
  text: 'जो कोई संसार से बाहर निकल आता है, उसे फिर बाँधा नहीं जा सकता, क्योंकि वह संसार में था। वह […] की अभिलाषा और भय से ऊपर प्रकट होता है। वह […] पर स्वामी है; वह ईर्ष्या से श्रेष्ठ है। यदि […] आते हैं, तो वे—शक्तियाँ—[उसे] बाँधकर उसका दम घोंट देती हैं। [वे] [महान शक्तियों …] से कैसे बच सकेंगे? वे कैसे […] सकेंगे? कुछ लोग [कहते हैं], “हम विश्वासी हैं,” ताकि […] [अशुद्ध आत्मा] और दुष्टात्मा, क्योंकि यदि उनमें पवित्र आत्मा होती, तो कोई अशुद्ध आत्मा उनसे न चिपकती। देह से न डरो, न उससे प्रेम करो। यदि तुम उससे डरोगे, तो वह तुम पर स्वामी हो जाएगी; यदि उससे प्रेम करोगे, तो वह तुम्हें निगलकर तुम्हारा दम घोंट देगी।


    मनुष्य या तो इस संसार में होता है, या पुनरुत्थान में, या बीच के स्थानों में। मैं वहाँ कभी न पाया जाऊँ! इस संसार में भलाई और बुराई दोनों हैं। इसकी अच्छी वस्तुएँ अच्छी नहीं हैं, और इसकी बुरी वस्तुएँ बुरी नहीं हैं। पर इस संसार के बाद एक ऐसी बुराई है जो सचमुच बुरी है—वह जिसे “बीच” कहा जाता है। वह मृत्यु है। जब तक हम इस संसार में हैं, हमारे लिए उचित है कि हम अपने लिए पुनरुत्थान प्राप्त कर लें, ताकि देह से उतार दिए जाने पर हम विश्राम में पाए जाएँ और बीच से होकर यात्रा न करें, क्योंकि बहुत-से लोग मार्ग में भटक जाते हैं।


    पाप करने से पहले संसार से बाहर निकल आना अच्छा है। कुछ लोग न तो ऐसा करना चाहते हैं, न कर सकते हैं; पर दूसरे यदि चाहते भी, तो उन्हें लाभ न होता, क्योंकि उन्होंने कर्म नहीं किया। उनका चाहना उन्हें पापी बनाता है। पर यदि वे न भी चाहें, तब भी न्याय उनसे छिपा रहेगा। बात न इच्छा की है, न कर्म की।


    एक प्रेरित ने [एक] दर्शन में कुछ लोगों को जलते हुए घर में बंद देखा। वे जलती हुई […] से बँधे थे, और उन्हें फेंका गया […] जलती हुई […] उन्हें […]। उनसे कहा गया [… बचाए] जा सकते […] पर वे नहीं चाहते थे, और उन्हें […] दंड मिला, जिसे “[बाहरी] अंधकार” कहा जाता है, क्योंकि वह […]।


    प्राण और आत्मा जल और आग से अस्तित्व में आए। विवाह-कक्ष की संतान जल, आग और प्रकाश से उत्पन्न हुई। आग अभिषेक है; प्रकाश आग है। मैं उस निराकार आग की बात नहीं कर रहा, बल्कि दूसरी आग की, जिसका रूप श्वेत है, जो उज्ज्वल और सुंदर है और सुंदरता प्रदान करती है।


    सत्य संसार में नग्न होकर नहीं आया, बल्कि प्रतिरूपों और छवियों में आया। संसार सत्य को किसी और रीति से ग्रहण नहीं करेगा। एक नया जन्म है और नए जन्म की एक छवि है। छवि के द्वारा फिर से जन्म लेना सचमुच आवश्यक है। पुनरुत्थान और छवि क्या हैं? छवि के द्वारा उसका उठना आवश्यक है। विवाह-कक्ष और छवि? छवि के द्वारा उनका सत्य में प्रवेश करना आवश्यक है, और यही पुनर्स्थापना है। केवल पिता, पुत्र और पवित्र आत्मा का नाम प्राप्त करना ही आवश्यक नहीं है; वे भी तुम्हारे लिए प्राप्त किए गए हैं। यदि कोई उन्हें प्राप्त नहीं करता, तो नाम भी उससे ले लिया जाएगा। पर वे क्रूस की सामर्थ्य के […] के अभिषेक में प्राप्त किए जाते हैं। प्रेरितों ने इसे “[दायाँ] और बायाँ” कहा, क्योंकि यह व्यक्ति अब [मसीही] नहीं, बल्कि एक मसीह है।


    प्रभु ने सब कुछ [एक] रहस्य में [किया]: बपतिस्मा, अभिषेक, प्रभु-भोज, छुटकारा और विवाह-कक्ष […]। उसने [कहा], “मैं [नीचे को] [ऊपर] के समान और [बाहर को] [भीतर] के समान बनाने, और उन्हें उस स्थान में [एक करने] आया हूँ।” […] यहाँ [प्रतिरूपों …] के द्वारा। जो लोग कहते हैं, “[…] ऊपर एक है […,” वे गलत हैं, क्योंकि] जो प्रकट है वह […], वह [जिसे] “नीचे का” कहा जाता है; और जो छिपा है, वह उसके लिए वह है जो उसके ऊपर है, क्योंकि वह अच्छा है। और वे कहते हैं, “भीतर और जो बाहर है, और जो बाहर के भी बाहर है।” इसलिए प्रभु ने विनाश को “बाहरी अंधकार” कहा। उसके बाहर कुछ भी नहीं है।


    उसने कहा, “मेरा पिता, जो छिपा हुआ है।” उसने कहा, “अपनी कोठरी में जाओ, अपने पीछे द्वार बंद करो और अपने उस पिता से प्रार्थना करो जो छिपा हुआ है,” अर्थात उससे जो उन सबके भीतर है। पर जो उन सबके भीतर है, वही परिपूर्णता है। उसके परे भीतर और कुछ नहीं है। इसी को “वह जो उनके ऊपर है” कहा जाता है।


    मसीह से पहले कुछ लोग वहाँ से आए जहाँ वे फिर प्रवेश नहीं कर सकते थे, और वे वहाँ गए जहाँ से फिर बाहर नहीं निकल सकते थे। तब मसीह आया। जो भीतर गए थे, उन्हें वह बाहर ले आया; और जो बाहर गए थे, उन्हें भीतर ले आया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: world
  choice: संसार
  rationale: पाठ के ब्रह्मांडीय और नैतिक दोनों अर्थों को बनाए रखने वाला स्वाभाविक हिन्दी विकल्प।
- source_word: flesh
  choice: देह
  rationale: ‘मांस’ की तुलना में व्यक्ति की शारीरिक अवस्था के लिए अधिक स्वाभाविक, पर मूल theological tension को बनाए रखता है।
- source_word: powers
  choice: शक्तियाँ
  rationale: अलौकिक सत्ताओं के संकेत को बिना अतिरिक्त व्याख्या या संप्रदायगत पहचान दिए सुरक्षित रखता है।
- source_word: middle / middle places
  choice: बीच / बीच के स्थान
  rationale: पाठ के तकनीकी किंतु अस्पष्ट स्थान-वाचक प्रयोग को व्याख्यायित किए बिना यथासंभव शाब्दिक रखा गया।
- source_word: rest
  choice: विश्राम
  rationale: मरणोत्तर विश्राम और ठहराव की धार्मिक प्रतिध्वनि को बनाए रखता है।
- source_word: chrism
  choice: अभिषेक
  rationale: अभिषेक-विधि और अभिषेक-द्रव्य दोनों की संभावित अर्थ-सीमा को हिन्दी में सबसे निकट रखता है।
- source_word: bridal chamber
  choice: विवाह-कक्ष
  rationale: पाठ के विशिष्ट संस्कारात्मक प्रतीक को सामान्य विवाह या दांपत्य में विलीन नहीं करता।
- source_word: types and images
  choice: प्रतिरूपों और छवियों
  rationale: दो पृथक प्रतीकात्मक शब्दों का भेद बनाए रखा गया है।
- source_word: fullness
  choice: परिपूर्णता
  rationale: तकनीकी ब्रह्मांडीय अर्थ की संभावना रखते हुए भी अनावश्यक लिप्यंतरण से बचता है।
- source_word: Eucharist
  choice: प्रभु-भोज
