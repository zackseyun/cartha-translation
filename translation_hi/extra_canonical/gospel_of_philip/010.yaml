  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; कॉप्टिक स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण मसौदा अस्थायी है। चौकोर कोष्ठक और दीर्घविराम पांडुलिपि-क्षति तथा पुनर्स्थापन संकेतों के अनुरूप सुरक्षित रखे गए हैं।
