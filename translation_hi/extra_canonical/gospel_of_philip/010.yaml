base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/010.yaml
  text: 'Some animals submit to humans, such as the calf, the donkey, and others of this kind. Others are not submissive and live alone in the wilderness. Humanity plows the field with the submissive animals and, consequently, nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plow with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers—those that are submissive, those that [aren''t], and those that are alone—because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
translation:
  language: hi
  text: 'कुछ पशु मनुष्यों के अधीन रहते हैं, जैसे बछड़ा, गधा और इसी प्रकार के दूसरे पशु। दूसरे अधीन नहीं रहते और निर्जन प्रदेश में अकेले रहते हैं। मनुष्य अधीन रहनेवाले पशुओं से खेत जोतता है और इस प्रकार अपना तथा सभी पशुओं का पालन-पोषण करता है—चाहे वे अधीन हों या न हों। सिद्ध मनुष्य के साथ भी ऐसा ही है: वह अधीन शक्तियों से जोतता है और उन सबके लिए तैयारी करता है जो अस्तित्व में आएँगे। इसी कारण पूरा स्थान स्थिर बना रहता है—चाहे भला हो या बुरा, दायाँ हो या बायाँ। पवित्र आत्मा सबकी चरवाही करता है और सभी शक्तियों पर शासन करता है—जो अधीन हैं, जो [अधीन नहीं हैं], और जो अकेली हैं—क्योंकि वह सचमुच उन्हें […] सीमित रखता है, [ताकि यदि वे …] चाहें भी, तो [निकल] न सकें।[a]


    [जिसे] रचा [गया है, वह सुंदर है, पर] तुम पाओगे कि उसकी संतान उत्तम रूप हैं। यदि वह रचा न गया होता, बल्कि जन्मा होता, तो तुम पाते कि उसका बीज उत्तम था। पर अब वह रचा गया, और उसने जन्म दिया। यह कैसी उत्तमता है? पहले व्यभिचार हुआ, फिर हत्या; और वह—कैन—व्यभिचार से जन्मा था, क्योंकि वह सर्प का पुत्र था। इसी कारण वह भी अपने पिता के समान हत्यारा बना और उसने अपने भाई—हाबिल—की हत्या कर दी। जो एक-दूसरे से भिन्न हैं, उनकी हर साझेदारी व्यभिचार है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अंश में पांडुलिपि क्षतिग्रस्त है। चौकोर कोष्ठक संपादकीय पुनर्स्थापन और […] लुप्त पाठ को दर्शाते हैं; इसलिए वाक्य का कुछ अर्थ अनिश्चित है।
    reason: पांडुलिपि की रिक्तियों और पुनर्निर्मित शब्दों को पाठक के सामने स्पष्ट करना।
  - marker: b
    text: कैन, हाबिल और सर्प के बारे में कथन उत्पत्ति की कथा की एक विशिष्ट व्याख्या प्रस्तुत करता है। अंतिम वाक्य में ‘साझेदारी’ और ‘व्यभिचार’ का अभिप्रेत दायरा पाठ में स्पष्ट नहीं है।
    reason: धर्मवैचारिक तनाव और अर्थगत अस्पष्टता को बिना किसी निजी व्याख्या से सुलझाए चिह्नित करना।
lexical_decisions:
- source_word: submit / submissive
  choice: अधीन रहना / अधीन
  rationale: पशुओं और शक्तियों के बारे में एक ही आवर्ती संबंध को बनाए रखता है; ‘आज्ञाकारी’ की अपेक्षा सत्ता-संबंध का अर्थ अधिक स्पष्ट है।
- source_word: perfect human
  choice: सिद्ध मनुष्य
  rationale: पूर्णता या आध्यात्मिक परिपक्वता का अर्थ खुला रखता है और किसी खास सांप्रदायिक पदावली को नहीं थोपता।
- source_word: powers
  choice: शक्तियाँ
  rationale: मूल साक्ष्य की ब्रह्मांडीय या आध्यात्मिक अस्पष्टता को बनाए रखता है; इसे ‘अधिकारी’ या ‘आत्माएँ’ कहकर सीमित नहीं किया गया।
- source_word: the whole place
  choice: पूरा स्थान
  rationale: असामान्य परंतु जानबूझकर व्यापक अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया; ‘संसार’ जोड़ना व्याख्यात्मक होता।
- source_word: stands
  choice: स्थिर बना रहता है
  rationale: अस्तित्व, टिके रहने और व्यवस्था के अर्थों को समेटता है, बिना इसे केवल भौतिक खड़े होने तक सीमित किए।
- source_word: formed / begotten
  choice: रचा गया / जन्मा
  rationale: दो अलग उत्पत्ति-प्रकारों के विरोध को हिन्दी में स्पष्ट रखा गया।
- source_word: noble
  choice: उत्तम
  rationale: वंशगत कुलीनता और गुणवाचक श्रेष्ठता दोनों की संभावना बनाए रखता है; ‘कुलीन’ यहाँ अत्यधिक सामाजिक अर्थ दे सकता था।
- source_word: partnership
  choice: साझेदारी
  rationale: संबंध या संयोग की व्यापकता बनाए रखता है; इसे केवल विवाह या यौन-संबंध तक सीमित नहीं करता।
- source_word: adultery
  choice: व्यभिचार
  rationale: पाठ के नैतिक और रूपक दोनों प्रयोगों के लिए स्थापित, गरिमापूर्ण हिन्दी शब्द।
theological_decisions:
- issue: पवित्र आत्मा के सर्वनाम और कार्य
  choice: ‘वह’ तथा ‘चरवाही करता है’
  alternative: ‘वह आत्मा’ / ‘सबको चराता है’
  rationale: हिन्दी में सम्मानपूर्ण व्यक्तिवाचक संदर्भ स्वाभाविक है, जबकि चरवाही का रूपक सुरक्षित रहता है; इससे आत्मा की प्रकृति पर अतिरिक्त सिद्धांत नहीं जोड़ा गया।
- issue: कैन को सर्प का पुत्र कहना
  choice: दावे को पाठानुसार सीधे रखा
  alternative: इसे केवल प्रतीकात्मक या जैविक अर्थ में स्पष्ट करना
  rationale: पाठ की वास्तविक धर्मवैचारिक तीक्ष्णता और अस्पष्टता को बिना समाधान के सुरक्षित रखना आवश्यक है।
- issue: भिन्न लोगों की साझेदारी को व्यभिचार कहना
  choice: सार्वभौमिक वाक्य को यथावत रखा
  alternative: इसे केवल असमान विवाह या आध्यात्मिक मिश्रण के रूप में समझाना
  rationale: साक्ष्य यह निर्धारित नहीं करता कि कथन का दायरा सामाजिक, यौन, आध्यात्मिक या ब्रह्मांडीय है; अनुवाद ने इसे संकीर्ण नहीं किया।
- issue: good/evil और right/left
  choice: ‘भला या बुरा, दायाँ या बायाँ’
  alternative: ‘अच्छाई-बुराई, धर्मी-अधर्मी’
  rationale: युग्मों की ठोस और संभवतः ब्रह्मांडीय भाषा को बनाए रखा गया, बिना नैतिक व्याख्या बढ़ाए।
