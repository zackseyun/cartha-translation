  revised_text: 'संसार की खेती चार चीज़ों के द्वारा होती है। पानी, मिट्टी, हवा और प्रकाश के द्वारा उपज भंडारों में इकट्ठी की जाती है। इसी प्रकार परमेश्वर भी चार चीज़ों के द्वारा खेती करता है—विश्वास, आशा, प्रेम और ज्ञान के द्वारा। हमारी मिट्टी विश्वास है, जिसमें हम जड़ पकड़े हुए हैं। [और] [पानी] आशा है, जिसके द्वारा हमारा पोषण होता है। हवा प्रेम है, जिसके द्वारा हम बढ़ते हैं। और प्रकाश ज्ञान है, जिसके द्वारा हम [पकते] हैं। अनुग्रह [चार प्रकार का है। वह] पृथ्वी का है, वह [स्वर्ग का है, …] स्वर्ग का स्वर्ग […] के द्वारा […।] धन्य है वह, जिसके पास […] आत्मा नहीं है। यह यीशु मसीह है। वह सब जगह गया और उसने किसी पर बोझ नहीं डाला। इसलिए ऐसा व्यक्ति धन्य है; वह सिद्ध मनुष्य है, क्योंकि वचन हमें बताता है कि उसके समान बने रहना कितना कठिन है। हम इतनी महान बात कैसे प्राप्त कर सकेंगे? वह सबको विश्राम कैसे देगा? सबसे पहली बात यह है कि किसी को दुःख देना उचित नहीं—चाहे वह बड़ा हो या छोटा, अविश्वासी हो या विश्वासी—और फिर उन लोगों को विश्राम देना चाहिए जो संपन्न लोगों के बीच पहले से ही विश्राम में हैं। कुछ
    लोग ऐसे हैं जिन्हें संपन्न व्यक्ति को विश्राम देने से लाभ होता है। जो भलाई करता है, वह उन्हें विश्राम नहीं दे सकता, क्योंकि वह मनमाना नहीं कर सकता; वह दुःख नहीं दे सकता, क्योंकि वह किसी को कष्ट नहीं पहुँचा सकता। फिर भी कभी-कभी संपन्न व्यक्ति उसे दुःख देता है। वे ऐसे नहीं हैं, पर उनकी अपनी बुराई ही उन्हें दुःख देती है। जिसमें सिद्ध मनुष्य का स्वभाव है, वह भले व्यक्ति को आनन्द देता है, पर कुछ लोग इसी बात से बहुत दुःखी होते हैं।



    एक गृहस्वामी ने सब कुछ प्राप्त किया था—बच्चे, दास, मवेशी, कुत्ते, सूअर, गेहूँ, [या] जौ, भूसा, सूखी घास, […] मांस और बलूत के फल। [पर वह] बुद्धिमान है और जानता है कि हर [एक] को क्या खिलाना चाहिए। बच्चों को उसने रोटी परोसी […] पर [… दासों] को उसने […] परोसा; मवेशियों के आगे [उसने जौ] और भूसा और सूखी घास डाली। [कुत्तों] को उसने हड्डियाँ [और] [सूअरों] को बलूत के फल और जूठन दी। परमेश्वर के शिष्य के साथ भी ऐसा ही है। यदि वह बुद्धिमान है, तो वह समझता है कि शिष्य होने का अर्थ क्या है। शारीरिक रूप उसे धोखा नहीं देंगे; बल्कि वह हर व्यक्ति की आत्मा की दशा देखकर उसी के अनुसार उससे बात करेगा। संसार में बहुत-से पशु हैं जिन्हें मनुष्य का रूप मिला हुआ है। वह शिष्य उन्हें पहचानता है। सूअरों को वह बलूत के फल देगा, मवेशियों को जौ के साथ भूसा और सूखी घास देगा, कुत्तों को हड्डियाँ देगा, दासों को भोजन से पहले का व्यंजन देगा और बच्चों को पूर्ण भोजन देगा।



    मानव-पुत्र है, और मानव-पुत्र का पुत्र भी है। प्रभु मानव-पुत्र है, और मानव-पुत्र का पुत्र वह है जो मानव-पुत्र के द्वारा सृष्टि करता है। मानव-पुत्र ने परमेश्वर से सृष्टि करने की सामर्थ्य पाई। उसके पास जन्म देने की सामर्थ्य भी है। जिसने सृष्टि करने की सामर्थ्य पाई, वह सृजित प्राणी है; जिसने जन्म देने की सामर्थ्य पाई, वह जन्मा हुआ है। जो सृष्टि करता है वह जन्म नहीं दे सकता; जो जन्म देता है वह सृष्टि कर सकता है। लोग कहते हैं, “जो सृष्टि करता है, वही जन्म देता है।” पर जिसे वह जन्म देता है, वह सृजित प्राणी है। [इसलिए] उससे जन्मे हुए उसके बच्चे नहीं, बल्कि वे […] हैं। जो सृष्टि करता है, वह [सबके सामने] काम करता है और स्वयं [प्रकट होता] है। जो जन्म देता है, वह [गुप्त रूप से] जन्म देता है, और वे छिपे रहते हैं […] प्रतिरूप। [फिर], जो [सृष्टि करता है, वह] सबके सामने [सृष्टि करता है], पर जो जन्म देता है, वह [गुप्त रूप से] बच्चों को जन्म देता है।



