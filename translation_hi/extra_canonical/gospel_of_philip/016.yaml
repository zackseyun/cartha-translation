translation:
  language: hi
  text: 'संसार की खेती चार चीज़ों के द्वारा होती है। पानी, मिट्टी, हवा और प्रकाश के द्वारा उपज भंडारों में इकट्ठी की जाती है। इसी प्रकार परमेश्वर भी चार चीज़ों के द्वारा खेती करता है—विश्वास, आशा, प्रेम और ज्ञान के द्वारा। हमारी मिट्टी विश्वास है, जिसमें हम जड़ पकड़े हुए हैं। [और] [पानी] आशा है, जिसके द्वारा हमारा पोषण होता है। हवा प्रेम है, जिसके द्वारा हम बढ़ते हैं। और प्रकाश ज्ञान है, जिसके द्वारा हम [पकते] हैं। अनुग्रह [चार प्रकार का है। वह] पृथ्वी का है, वह [स्वर्ग का है, …] स्वर्ग का स्वर्ग […] के द्वारा […।] धन्य है वह, जिसके पास […] आत्मा नहीं है। यह यीशु मसीह है। वह सब जगह गया और उसने किसी पर बोझ नहीं डाला। इसलिए ऐसा व्यक्ति धन्य है; वह सिद्ध मनुष्य है, क्योंकि वचन हमें बताता है कि उसके समान बने रहना कितना कठिन है। हम इतनी महान बात कैसे प्राप्त कर सकेंगे? वह सबको विश्राम कैसे देगा? सबसे पहली बात यह है कि किसी को दुःख देना उचित नहीं—चाहे वह बड़ा हो या छोटा, अविश्वासी हो या विश्वासी—और फिर उन लोगों को विश्राम देना चाहिए जो संपन्न लोगों के बीच पहले से ही विश्राम में हैं। कुछ लोग ऐसे
    हैं जिन्हें संपन्न व्यक्ति को विश्राम देने से लाभ होता है। जो भलाई करता है, वह उन्हें विश्राम नहीं दे सकता, क्योंकि वह मनमाना नहीं कर सकता; वह दुःख नहीं दे सकता, क्योंकि वह किसी को कष्ट नहीं पहुँचा सकता। फिर भी कभी-कभी संपन्न व्यक्ति उसे दुःख देता है। दोष उस भलाई करनेवाले का नहीं, बल्कि संपन्न व्यक्ति की अपनी बुराई का है, जो उसे दुःख देती है। जिसमें सिद्ध मनुष्य का स्वभाव है, वह भले व्यक्ति को आनन्द देता है, पर कुछ लोग इसी बात से बहुत दुःखी होते हैं।


    एक गृहस्वामी ने हर प्रकार की वस्तु प्राप्त की—बच्चे, दास, मवेशी, कुत्ते, सूअर, गेहूँ, [या] जौ, भूसा, सूखी घास, […] मांस और बलूत के फल। [पर वह] बुद्धिमान है और जानता है कि हर [एक] को क्या खिलाना चाहिए। बच्चों को उसने रोटी परोसी […] पर [… दासों] को उसने […] परोसा; मवेशियों के आगे [उसने जौ] और भूसा और सूखी घास डाली। [कुत्तों] को उसने हड्डियाँ [और] [सूअरों] को बलूत के फल और जूठन दी। परमेश्वर के शिष्य के साथ भी ऐसा ही है। यदि वह बुद्धिमान है, तो वह समझता है कि शिष्य होने का अर्थ क्या है। शारीरिक रूप उसे धोखा नहीं देंगे; बल्कि वह हर व्यक्ति की आत्मा की दशा देखकर उसी के अनुसार उससे बात करेगा। संसार में बहुत-से पशु हैं जिन्हें मनुष्य का रूप मिला हुआ है। वह शिष्य उन्हें पहचानता है। सूअरों को वह बलूत के फल देगा, मवेशियों को जौ के साथ भूसा और सूखी घास देगा, कुत्तों को हड्डियाँ देगा, दासों को आरम्भिक भोजन देगा और बच्चों को पूर्ण भोजन देगा।


    मानव-पुत्र है, और मानव-पुत्र का पुत्र भी है। प्रभु मानव-पुत्र है, और मानव-पुत्र का पुत्र वह है जो मानव-पुत्र के द्वारा सृष्टि करता है। मानव-पुत्र ने परमेश्वर से सृष्टि करने की सामर्थ्य पाई। उसके पास जन्म देने की सामर्थ्य भी है। जिसने सृष्टि करने की सामर्थ्य पाई, वह सृजित प्राणी है; जिसने जन्म देने की सामर्थ्य पाई, वह जन्मा हुआ है। जो सृष्टि करता है वह जन्म नहीं दे सकता; जो जन्म देता है वह सृष्टि कर सकता है। लोग कहते हैं, “जो सृष्टि करता है, वही जन्म देता है।” पर जिसे वह जन्म देता है, वह सृजित प्राणी है। [इसलिए] उससे जन्मे हुए उसके बच्चे नहीं, बल्कि वे […] हैं। जो सृष्टि करता है, वह [सबके सामने] काम करता है और स्वयं [प्रकट होता] है। जो जन्म देता है, वह [गुप्त रूप से] जन्म देता है, और वे छिपे रहते हैं […] प्रतिरूप। [फिर], जो [सृष्टि करता है, वह] सबके सामने [सृष्टि करता है], पर जो जन्म देता है, वह [गुप्त रूप से] बच्चों को जन्म देता है।


    जब [पति] और पत्नी एक-दूसरे से घनिष्ठ होते हैं, तब उनके सिवा कोई [नहीं जान सकेगा], क्योंकि संसार का विवाह विवाहित लोगों के लिए एक रहस्य है। यदि अशुद्ध विवाह छिपा रहता है, तो अशुद्धता-रहित विवाह उससे कहीं बढ़कर सच्चा रहस्य है! वह देह-संबंधी नहीं, बल्कि शुद्ध है। वह वासना से नहीं, बल्कि इच्छा से है। वह अन्धकार या रात का नहीं, बल्कि दिन और प्रकाश का है। यदि विवाह को सबके सामने निर्वस्त्र कर दिया जाए, तो वह अश्लीलता बन जाता है। दुलहन केवल तभी व्यभिचार नहीं करती जब वह किसी दूसरे पुरुष का बीज ग्रहण करती है; बल्कि यदि वह विवाह-कक्ष से बाहर निकलकर दिखाई भी देती है, तो वह व्यभिचार करती है। वह अपने पिता, अपनी माता, वर के मित्र और वर के बच्चों के सामने अपने आपको प्रकट करे। उन्हें प्रतिदिन विवाह-कक्ष में प्रवेश करने की अनुमति है। पर दूसरे लोग केवल उसकी आवाज़ सुनने के लिए तरसें और उसकी सुगन्ध का आनन्द लें; और कुत्तों के समान मेज़ से गिरे हुए टुकड़े खाएँ। वर और दुलहन विवाह-कक्ष के हैं। कोई भी वर और दुलहन को तब तक नहीं देख सकेगा, जब तक [वे स्वयं] उनके समान न बन जाएँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: farmed / farms
  choice: खेती होती है / खेती करता है
  rationale: कृषि-रूपक को पूरे अनुच्छेद में प्रत्यक्ष और सुसंगत रखा गया है।
- source_word: knowledge
  choice: ज्ञान
  rationale: विश्वास, आशा और प्रेम के साथ प्रयुक्त आध्यात्मिक बोध के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: grace
  choice: अनुग्रह
  rationale: धार्मिक हिन्दी में स्वाभाविक है और अस्पष्ट, खंडित वर्गीकरण को किसी विशिष्ट सिद्धान्त से नहीं भरता।
- source_word: Son of Humanity
  choice: मानव-पुत्र
  rationale: मानवता/मनुष्य से संबंध बनाए रखते हुए पदवी-सदृश पुनरावृत्ति और ‘मानव-पुत्र का पुत्र’ का शब्द-खेल सुरक्षित करता है।
