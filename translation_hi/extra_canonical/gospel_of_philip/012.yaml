translation:
  language: hi
  text: '**विवाह का रहस्य**


    [विवाह] का रहस्य महान [है], क्योंकि [उसके बिना] संसार का [अस्तित्व न होता]; क्योंकि [संसार] की संरचना […], परंतु संरचना [… विवाह]। उस [अंतरंग …] के विषय में सोचो जो अशुद्ध किया गया है, क्योंकि उसमें […] सामर्थ्य है। उसका प्रतिरूप एक [अशुद्धता] में विद्यमान है।[a]


    अशुद्ध आत्माएँ पुरुष और स्त्री [रूप] धारण करती हैं। पुरुष वे हैं जो स्त्री-रूप में रहनेवाली आत्माओं के साथ अंतरंग होते हैं, और स्त्रियाँ वे हैं जो आज्ञा न मानने के कारण पुरुष-रूप में रहनेवालों के साथ मिलती हैं। कोई भी उनके बंधन से तब तक नहीं बच सकेगा, जब तक वह पुरुष-शक्ति और स्त्री-शक्ति—अर्थात वर और वधू—को विवाह-कक्ष के प्रतिरूप में प्राप्त न कर ले। जब मूर्ख स्त्रियाँ किसी पुरुष को अकेला बैठा देखती हैं, तो वे उस पर झपट पड़ती हैं, उसके साथ खेलती हैं और उसे अशुद्ध करती हैं। उसी प्रकार, जब मूर्ख पुरुष किसी सुंदर स्त्री को अकेली बैठी देखते हैं, तो वे उसे बहकाते और विवश करते हैं, क्योंकि वे उसे अशुद्ध करना चाहते हैं। पर यदि वे पति और उसकी पत्नी को एक साथ बैठे देखते हैं, तो स्त्रियाँ पति के भीतर प्रवेश नहीं कर सकतीं, और न पुरुष पत्नी के भीतर। ऐसा ही तब होता है जब प्रतिरूप स्वर्गदूत के साथ एक हो जाता है: कोई भी [पुरुष] या स्त्री के भीतर प्रवेश करने का साहस नहीं कर सकेगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वर्ग कोष्ठक संपादकीय पुनर्स्थापन या अनिश्चित पाठ को, और […] पांडुलिपि में लुप्त अथवा अपठनीय अंश को सूचित करते हैं।
    reason: प्रारंभिक अनुच्छेद अत्यधिक खंडित है; पाठक को पुनर्निर्मित और लुप्त सामग्री अलग पहचाननी चाहिए।
  - marker: b
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य के आधार पर अस्थायी रूप से तैयार किया गया है; कॉप्टिक मूल से प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: स्रोत-संबंधी सीमा को पारदर्शी रखना आवश्यक है, विशेषतः अंतिम वाक्य में कोष्ठकबद्ध शब्द और सर्वनाम-संदर्भ अनिश्चित हैं।
lexical_decisions:
- source_word: mystery of marriage
  choice: विवाह का रहस्य
  rationale: ‘रहस्य’ धार्मिक और प्रतीकात्मक अर्थ को खुला रखता है; इसे केवल वैवाहिक गोपनीयता या किसी विशिष्ट संस्कार तक सीमित नहीं करता।
- source_word: structure
  choice: संरचना
  rationale: खंडित वाक्य में व्यापक अर्थ वाला शब्द चुना गया है, ताकि ‘व्यवस्था’, ‘उत्पत्ति’ या ‘आधार’ में से किसी एक अर्थ को अनावश्यक रूप से निश्चित न किया जाए।
- source_word: male power and a female one
  choice: पुरुष-शक्ति और स्त्री-शक्ति
  rationale: मूल साक्ष्य की समानांतर अभिव्यक्ति को बनाए रखते हुए ‘power’ का स्पष्ट, स्वाभाविक अनुवाद किया गया है।
- source_word: groom and bride
  choice: वर और वधू
  rationale: आधुनिक किंतु गरिमापूर्ण हिंदी; आगे आने वाले पति-पत्नी के बिंब से भेद भी बना रहता है।
- source_word: bridal chamber
  choice: विवाह-कक्ष
  rationale: प्रतीकात्मक पद को किसी विशेष सांप्रदायिक संस्कार का नाम बनाए बिना सीधे व्यक्त करता है।
- source_word: image
  choice: प्रतिरूप
  rationale: ‘छवि’ की अपेक्षा यह किसी अनुरूप अथवा प्रतिनिधि रूप की संभावना को बेहतर बनाए रखता है।
- source_word: go inside
  choice: भीतर प्रवेश करना
  rationale: अस्पष्ट स्थानिक भाषा को ‘अधिकार करना’, ‘ग्रस्त करना’ या यौन अर्थ में व्याख्यायित किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: विवाह की विश्व-धारक भूमिका
  choice: खंडित कथन को उसी रूप में रखा गया है कि विवाह के बिना संसार का अस्तित्व न होने की बात कही जाए।
  alternative: इसे जैविक प्रजनन या किसी विशिष्ट आध्यात्मिक संस्कार की स्पष्ट शिक्षा के रूप में समझाना।
  rationale: पांडुलिपि-क्षति के कारण तर्क अधूरा है; अनुवाद को किसी एक धर्मवैज्ञानिक व्याख्या का निर्णय नहीं करना चाहिए।
- issue: पुरुष और स्त्री शक्तियों को प्राप्त करना
  choice: ‘प्राप्त करना’ और ‘विवाह-कक्ष का प्रतिरूप’ ज्यों के त्यों अर्थ-संरचना में रखे गए हैं।
  alternative: इसे आत्मा के भीतर लैंगिक एकीकरण, विवाह-संस्कार, या उद्धार की निश्चित विधि कहना।
  rationale: उपलब्ध साक्ष्य इन संभावित व्याख्याओं में से किसी एक को निर्णायक रूप से स्थापित नहीं करता।
- issue: प्रतिरूप का स्वर्गदूत के साथ एक होना
  choice: रहस्यमय कथन को बिना व्याख्यात्मक विस्तार के सीधा रखा गया है।
  alternative: ‘स्वर्गदूत’ को संरक्षक आत्मा, स्वर्गीय समकक्ष, या मसीह के रूप में पहचानना।
  rationale: ऐसी पहचान अनुवाद से आगे बढ़कर व्याख्या होगी और पाठ की वास्तविक अस्पष्टता मिटा देगी।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। खंडित पाठ को सहज बनाने के लिए पूरा नहीं किया गया; कोष्ठक और दीर्घविराम सुरक्षित हैं। यौन और आध्यात्मिक बिंबों को न तो शिष्टोक्ति से ढका गया है, न अतिरिक्त रूप से स्पष्ट किया गया है। कॉप्टिक स्रोत की प्रत्यक्ष जाँच लंबित होने के कारण यह प्रकाशन-पूर्व अस्थायी मसौदा है।
