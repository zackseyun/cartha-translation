translation:
  language: hi
  text: 'जब हव्वा आदम के [भीतर] थी, तब मृत्यु का अस्तित्व नहीं था। जब वह उससे अलग हुई, तब मृत्यु अस्तित्व में आई। यदि वह फिर [प्रवेश करता है] और उसे अपने लिए ग्रहण करता है, तो मृत्यु नहीं रहेगी।[a]


    “हे [मेरे] परमेश्वर, मेरे परमेश्वर, हे प्रभु, आपने मुझे क्यों [त्याग दिया]?” उसने क्रूस पर यह कहा, क्योंकि उस स्थान पर वह विभाजित हो गया था। […] कि वह उसके द्वारा जन्मा था जो […] परमेश्वर से। वह […] मरे हुओं में से […] अस्तित्व में है, पर […] वह सिद्ध है […] देह का, पर यह […] सच्ची देह है […] सच्ची नहीं है, [बल्कि …] सच्ची वस्तु की प्रतिमा है।


    विवाह-कक्ष पशुओं के लिए नहीं, न दासों के लिए, न अशुद्ध लोगों के लिए, बल्कि स्वतंत्र लोगों और कुँवारे-कुँवारियों के लिए है।


    हम पवित्र आत्मा के द्वारा फिर से जन्म लेते हैं, पर मसीह के द्वारा हम दो वस्तुओं से जन्म लेते हैं। आत्मा के द्वारा हमारा अभिषेक होता है। जब हम जन्मे, तब हम एक हो गए।


    प्रकाश के बिना कोई भी जल में या दर्पण में अपने आपको नहीं देख सकता; और जल या दर्पण के बिना तुम प्रकाश में भी नहीं देख सकोगे। इसलिए दोनों में—प्रकाश में और जल में—बपतिस्मा लेना आवश्यक है। पर प्रकाश अभिषेक है।[b]


    यरूशलेम में अर्पण के तीन भवन थे। जो पश्चिम की ओर खुलता है, वह “पवित्र स्थान” कहलाता है। दूसरा, जो दक्षिण की ओर खुलता है, “पवित्र का पवित्र स्थान” कहलाता है। तीसरा, जो पूर्व की ओर खुलता है, “परमपवित्र स्थान” कहलाता है—वह स्थान जहाँ केवल महायाजक प्रवेश करता है। बपतिस्मा “पवित्र स्थान” है। [छुटकारा] “पवित्र का पवित्र स्थान” है। “परम[पवित्र स्थान]” विवाह-कक्ष है। [बपतिस्मे] में छुटकारे [के साथ] पुनरुत्थान भी सम्मिलित है। छुटकारा विवाह-कक्ष में है। पर [वह] विवाह-कक्ष […] से श्रेष्ठ है। तुम उसका […] नहीं पाओगे […] जो प्रार्थना करते हैं […] यरूशलेम। […] यरूशलेम जो [… यरूशलेम], दिखाई देते हुए […] ये जो “[परमपवित्र स्थान]” कहलाते हैं [… वह] परदा फटा हुआ […] प्रतिमा को छोड़ विवाह-कक्ष [… जो] [ऊपर है। इसलिए] उसका परदा ऊपर से नीचे तक फट गया, क्योंकि नीचे के कुछ लोगों का ऊपर जाना आवश्यक था।[c]


    जिन लोगों ने सिद्ध प्रकाश को पहन लिया है, उन्हें शक्तियाँ देख नहीं सकतीं और बाँध भी नहीं सकतीं। पर मनुष्य उस प्रकाश को एकता के रहस्य में पहनेगा।[d]


    यदि स्त्री पुरुष से अलग न हुई होती, तो वह पुरुष के साथ न मरी होती। उसका अलग होना मृत्यु का आरम्भ था। इसी कारण मसीह उस अलगाव को मिटाने आया जो आरम्भ से चला आ रहा था—ताकि दोनों को फिर से एक कर दे। जो लोग अलगाव के कारण मर गए, उन्हें वह एक करके जीवन देगा। अब पत्नी विवाह-कक्ष में अपने पति से एक होती है, और जो विवाह-कक्ष में एक हो गए हैं वे फिर कभी अलग नहीं होंगे। इसी कारण हव्वा आदम से अलग हुई, क्योंकि वह विवाह-कक्ष में उसके साथ एक नहीं हुई थी।


    एक श्वास के द्वारा आदम का प्राण अस्तित्व में आया। उसका सहचर आत्मा था। जो उसे दिया गया था, वही उसकी माता थी। उसका प्राण [ले लिया गया] और उसके स्थान पर उसे [जीवन] (हव्वा) दिया गया। जब वह एक हुआ […] ऐसे वचन जो शक्तियों से श्रेष्ठ थे, और उन्होंने उससे ईर्ष्या की […] आत्मिक सहचर […] छिपा हुआ […] अर्थात वह […] स्वयं […] विवाह-कक्ष ताकि […] यीशु प्रकट हुआ [… वह] यरदन, स्वर्ग के राज्य की [परिपूर्णता]। जो सब वस्तुओं से पहले [जन्मा था], वह फिर से जन्मा। जिसका [सबसे पहले अभिषेक हुआ था], उसका फिर से अभिषेक हुआ। जिसका छुटकारा हुआ था, उसका फिर से छुटकारा हुआ।


    यदि किसी रहस्य की बात कहना आवश्यक हो, तो सबके पिता ने उस कुँवारी से एकता की जो नीचे उतरी थी, और उस दिन एक अग्नि ने उसे प्रकाशमान किया। उसने महान विवाह-कक्ष प्रकट किया, इसलिए उसी दिन उसकी देह अस्तित्व में आई। वह विवाह-कक्ष से ऐसे व्यक्ति के समान बाहर आया जो वर और वधू से उत्पन्न हुआ हो। इसी प्रकार यीशु ने अपने भीतर सब कुछ स्थापित किया। प्रत्येक शिष्य के लिए भी आवश्यक है कि इन बातों के द्वारा उसके विश्राम में प्रवेश करे।


    आदम दो कुँवारियों से अस्तित्व में आया—आत्मा से और कुँवारी धरती से। इसलिए मसीह एक कुँवारी से जन्मा, ताकि आरम्भ में हुए पतन को सुधार दे।


    स्वर्गोद्यान में दो वृक्ष उगते हैं। एक [पशुओं] को जन्म देता है और दूसरा मनुष्यों को। आदम ने उस वृक्ष से [खाया] जो पशुओं को जन्म देता था; [और वह] पशु बन गया और उसने [पशुओं] को जन्म दिया। इसलिए आदम की संतानें [पशुओं] की उपासना करती हैं। वह वृक्ष […] फल है […] यह उन्होंने […] उस […] का फल खाया […] मनुष्यों को जन्म देता है […] मनुष्य का […] परमेश्वर मनुष्य को बनाता है, [… मनुष्य परमेश्वर] को बनाते हैं। संसार में ऐसा ही होता है: मनुष्य देवताओं को बनाते हैं और अपनी बनाई हुई वस्तु की उपासना करते हैं। इससे तो अच्छा होता कि देवता मनुष्यों की उपासना करते!


