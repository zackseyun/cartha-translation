    प्रभु ने कहा, “धन्य है वह जो अस्तित्व में आने से पहले अस्तित्व में है, क्योंकि जो अस्तित्व में हैं, वे अस्तित्व में थे और अस्तित्व में रहेंगे।”


    मनुष्य की श्रेष्ठता प्रकट नहीं होती, बल्कि छिपे हुए में विद्यमान है। इसलिए मनुष्य उन पशुओं पर अधिकार रखता है जो अधिक शक्तिशाली हैं, और जो प्रकट तथा छिपी हुई बातों की दृष्टि से बड़े हैं। इससे वे जीवित रह पाते हैं; पर यदि मनुष्य उनसे अलग हो जाए, तो वे एक-दूसरे को मारते, काटते और खा जाते हैं, क्योंकि उन्हें भोजन नहीं मिला था। लेकिन अब उन्हें भोजन मिल गया है, क्योंकि मनुष्य ने भूमि जोती है।


