translation:
  language: hi
  text: 'परमेश्वर रंगरेज़ है। जैसे अच्छे रंग—जिन्हें पक्का कहा जाता है—उनसे रंगी हुई वस्तुओं के साथ ही मिटते हैं, वैसे ही उन लोगों के साथ होता है जिन्हें परमेश्वर ने रंगा है। क्योंकि उसके रंग अमर हैं, वे उसके रंगों के द्वारा अमर हो जाते हैं। पर परमेश्वर जल में बपतिस्मा देता है।


    किसी के लिए भी किसी ऐसी वस्तु को देखना असंभव है जो सचमुच अस्तित्व में है, जब तक वह उसके समान न हो जाए। यह संसार के मनुष्य जैसा नहीं है, जो सूर्य को देखता है पर सूर्य नहीं बनता, और आकाश, पृथ्वी तथा दूसरी सभी वस्तुओं को देखता है पर वे नहीं बनता। वहाँ ऐसा ही होता है। पर तुमने उस स्थान की कोई वस्तु देखी और वही बन गए। तुमने आत्मा को देखा, तुम आत्मा बन गए; तुमने मसीह को देखा, तुम मसीह बन गए; तुमने [पिता को देखा, तुम] पिता बन जाओगे। इसी कारण [यहाँ] तुम सब कुछ देखते हो, पर [अपने आपको नहीं देखते]; लेकिन [वहाँ] तुम अपने आपको देखते हो, क्योंकि जो तुम देखते हो, वही [बन जाओगे]।


    विश्वास ग्रहण करता है; प्रेम देता है। विश्वास के बिना [कोई ग्रहण नहीं कर सकेगा], और प्रेम के बिना कोई दे नहीं सकेगा। इसलिए हम विश्वास करते हैं ताकि ग्रहण करें, और हम देते हैं ताकि प्रेम करें; क्योंकि जो प्रेम से नहीं देता, उसे उससे कुछ भी लाभ नहीं होता। जिसने प्रभु को ग्रहण नहीं किया, वह अब भी इब्रानी है।


    हमसे पहले के प्रेरित उसे “यीशु नासरी मसीहा” कहते थे, अर्थात “यीशु नासरी ख्रीस्त।” अंतिम नाम “ख्रीस्त” है, पहला “यीशु” और बीच का “नासरी।” “मसीहा” के दो अर्थ हैं: “ख्रीस्त” और “नापा हुआ,” दोनों। इब्रानी में “यीशु” का अर्थ “छुटकारा” है। “नाज़ारा” का अर्थ “सत्य” है। इसलिए “नासरी” का अर्थ “सत्य” है। “ख्रीस्त” वह है जिसे नापा गया। “नासरी” और “यीशु” वे हैं जिन्हें नापा गया।


    मोती को कीचड़ में फेंक दिया जाए तो उसका मूल्य कम नहीं होता, और उस पर सुगंधित मरहम लगाया जाए तो उसका मूल्य बढ़ नहीं जाता; वह अपने स्वामी के लिए सदा मूल्यवान रहता है। परमेश्वर की संतानों के साथ भी ऐसा ही है: वे चाहे जहाँ हों, अपने पिता के लिए मूल्यवान रहती हैं।


    यदि तुम कहो, “मैं यहूदी हूँ,” तो कोई विचलित नहीं होगा। यदि तुम कहो, “मैं रोमी हूँ,” तो कोई व्याकुल नहीं होगा। यदि तुम कहो, “मैं यूनानी हूँ,” “बर्बर हूँ,” “दास हूँ,” [“स्वतंत्र व्यक्ति हूँ,”] तो कोई परेशान नहीं होगा। [यदि] तुम [कहो], “मैं मसीही हूँ,” तो […] काँप उठेगा। काश [… इस] प्रकार का, यह व्यक्ति [जो …] उसका नाम [सुनना] सह नहीं सकेगा।


    परमेश्वर मनुष्य-भक्षी है। इसी कारण मनुष्य उसके लिए [बलि किया जाता] है। मनुष्य की बलि दिए जाने से पहले पशुओं की बलि दी जाती थी, क्योंकि जिनके लिए उनकी बलि दी जाती थी, वे देवता नहीं थे।


    काँच और मिट्टी के बरतन आग के द्वारा बनते हैं। पर काँच के बरतन टूट जाएँ तो फिर बनाए जाते हैं, क्योंकि वे एक फूँक के द्वारा बने थे; लेकिन मिट्टी के बरतन टूट जाएँ तो नष्ट कर दिए जाते हैं, क्योंकि वे बिना फूँक के बने थे।


    चक्की का पाट घुमाते हुए एक गधे ने सौ मील की यात्रा की। जब उसे छोड़ा गया, तो उसने अपने आपको अब भी उसी स्थान पर पाया। बहुत-से लोग यात्रा करते हैं, पर कहीं नहीं पहुँचते। जब शाम हुई, तो उन्होंने न नगर देखा, न गाँव, न कोई सृजी हुई या प्राकृतिक वस्तु, न कोई सामर्थ्य, न स्वर्गदूत। उन अभागों ने व्यर्थ परिश्रम किया।


    यूखरिस्त यीशु है, क्योंकि सिरियाई भाषा में उसे “फरीसाथा” कहा जाता है, अर्थात “वह जो फैलाया गया है”; क्योंकि यीशु संसार को क्रूस पर चढ़ाने आया।


    प्रभु लेवी के रंगाईघर में गया। उसने बहत्तर रंग लिए और उन्हें रंग के कुंड में डाल दिया। उसने उन सभी को सफेद निकालकर कहा, “मानव-पुत्र इसी प्रकार रंगरेज़ [बनकर] आया है।”


    वह प्रज्ञा, जिसे “बाँझ” कहा जाता है, [स्वर्गदूतों की] माता और [… मरियम] मगदलीनी की [संगिनी] है। [… वह उससे] शिष्यों से अधिक [प्रेम करता था … वह] उसके […] पर [बहुत] बार चूमता था। शेष […] […] उन्होंने उससे कहा, “आप उससे हम सबसे अधिक प्रेम क्यों करते हैं?” उद्धारकर्ता ने उत्तर दिया, “मैं तुमसे उसके समान प्रेम क्यों नहीं करता? जब एक अंधा व्यक्ति और एक देखने वाला, दोनों अँधेरे में हों, तो उनमें कोई भेद नहीं होता। जब प्रकाश आता है, तो देखने वाला प्रकाश देखेगा, पर अंधा अँधेरे में ही रहेगा।”


    प्रभु ने कहा, “धन्य है वह जो अस्तित्व में आने से पहले अस्तित्व में है, क्योंकि जो अस्तित्व में है, वह अस्तित्व में था और अस्तित्व में रहेगा।”


