  text: 'The children of the heavenly human are more numerous than the children of the earthly human. If Adam has so many children, even though they die, how many children does the perfect human have—those who do not die but are begotten continually?


    The father produces a son, but a son cannot produce a son, because someone who has been born cannot beget sons. The son begets brothers, not sons. All who are begotten in the world are begotten physically, and the others in […] are begotten by him […] out there to the human […] in the […] heavenly place […] it from the mouth […] the Word came out from there. They would be nourished from the mouth [and] become perfect. The perfect are conceived and begotten through a kiss. This is why we also kiss one another, conceiving from the grace within one another.


    There were three who traveled with the Lord all the time: his mother Mary, her sister, and Magdalene, who is called his companion; because Mary is his sister, his mother, and his partner.


    “The Father” and “the Son” are single names. “The Holy Spirit” is a double name, because they are everywhere. They are in heaven and below; they are hidden and revealed. The Holy Spirit is revealed below and hidden in heaven.


    The holy ones are served by the evil powers, because the Holy Spirit has blinded these powers so that they think they are serving an ordinary human when they are actually working for the holy ones. So one day a disciple asked the Lord about a worldly matter. He told him, “Ask your Mother, and she will give you from someone else.”


    The apostles said to the disciples, “May our entire offering acquire salt.” They called […] “salt.” Without it, the offering does not [become] acceptable. But Wisdom [is] childless. Because of this, [she is] called […], this of salt, the place they will […] in their own way. The Holy Spirit […] […] many children.


    What belongs to the father belongs to the son. But as long as the son is little, he is not entrusted with what is his. When he becomes a man, his father gives him everything that belongs to him.


    Those who have been begotten by the Spirit and go astray also go astray through it. Because of this, through this one Spirit it blazes—that is, the fire—and it is extinguished.


    Echamoth is one thing, and Echmoth is another. Echamoth is simply Wisdom, but Echmoth is the Wisdom of Death, which knows death. This is called “the little Wisdom.”'
translation:
  language: hi
  text: 'स्वर्गीय मनुष्य की संतानें पृथ्वी के मनुष्य की संतानों से अधिक हैं। यदि आदम की इतनी संतानें हैं, यद्यपि वे मर जाती हैं, तो सिद्ध मनुष्य की संतानें कितनी अधिक होंगी—वे जो मरती नहीं, बल्कि निरंतर जन्म लेती रहती हैं?


    पिता एक पुत्र उत्पन्न करता है, पर पुत्र एक पुत्र उत्पन्न नहीं कर सकता, क्योंकि जो स्वयं जन्मा है वह पुत्रों को जन्म नहीं दे सकता; पुत्र भाइयों को जन्म देता है, पुत्रों को नहीं। संसार में जितने जन्म लेते हैं, वे शारीरिक रीति से जन्म लेते हैं; और दूसरे […] में उसके द्वारा जन्म लेते हैं […] वहाँ बाहर मनुष्य के लिए […] उस […] स्वर्गीय स्थान में […] उसे मुख से […] वचन वहाँ से निकला। वे मुख से पोषित होते [और] सिद्ध बनते। सिद्ध जन एक चुम्बन के द्वारा गर्भ में आते और जन्म लेते हैं। इसी कारण हम भी एक-दूसरे को चूमते हैं और एक-दूसरे के भीतर की अनुग्रह से गर्भ धारण करते हैं।


    तीन स्त्रियाँ हर समय प्रभु के साथ चलती थीं: उसकी माता मरियम, उसकी बहन, और मगदलीनी, जिसे उसकी संगिनी कहा जाता है; क्योंकि मरियम उसकी बहन, उसकी माता और उसकी सहचरी है।[a]


    “पिता” और “पुत्र” एकहरे नाम हैं; “पवित्र आत्मा” दोहरा नाम है, क्योंकि वे हर जगह हैं। वे स्वर्ग में हैं और नीचे भी; वे छिपे हुए हैं और प्रकट भी। पवित्र आत्मा नीचे प्रकट और स्वर्ग में छिपा हुआ है।[b]


    दुष्ट शक्तियाँ पवित्र जनों की सेवा करती हैं, क्योंकि पवित्र आत्मा ने उन शक्तियों को अंधा कर दिया है, ताकि वे समझें कि वे किसी साधारण मनुष्य की सेवा कर रही हैं, जबकि वास्तव में वे पवित्र जनों के लिए काम कर रही हैं। इसलिए एक दिन एक शिष्य ने प्रभु से किसी सांसारिक विषय के बारे में पूछा। उसने उससे कहा, “अपनी माता से माँग, और वह तुझे किसी और से लेकर देगी।”[c]


    प्रेरितों ने शिष्यों से कहा, “हमारी पूरी भेंट में नमक आ जाए।” उन्होंने […] को “नमक” कहा। उसके बिना भेंट [स्वीकार्य नहीं होती]। पर बुद्धि निःसंतान [है]; इसी कारण [उसे] […] कहा जाता [है], यह नमक का, वह स्थान जहाँ वे […] अपने ढंग से। पवित्र आत्मा […] […] बहुत-सी संतानें।[d]


    जो कुछ पिता का है, वह पुत्र का है। पर जब तक पुत्र छोटा है, तब तक जो उसका अपना है वह भी उसे नहीं सौंपा जाता। जब वह वयस्क हो जाता है, तब उसका पिता अपनी सारी संपत्ति उसे दे देता है।


    जो आत्मा से जन्मे हैं और भटक जाते हैं, वे उसी के द्वारा भटकते भी हैं। इसी कारण इसी एक आत्मा के द्वारा वह धधकती है—अर्थात आग—और बुझ भी जाती है।[e]


    एकामोथ एक है और एक्मोथ दूसरी। एकामोथ केवल बुद्धि है, पर एक्मोथ मृत्यु की बुद्धि है, जो मृत्यु को जानती है। इसे “छोटी बुद्धि” कहा जाता है।[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘संगिनी’ और ‘सहचरी’ संबंध की निकटता बताते हैं, पर पाठ स्वयं उस संबंध का स्वरूप स्पष्ट नहीं करता। ‘मरियम’ किस स्त्री को हर पद में सूचित करती है, यह वाक्य में अस्पष्ट है।
    reason: नाम-संदर्भ और संबंध की वास्तविक अस्पष्टता बनाए रखने के लिए।
  - marker: b
    text: ‘दोहरा नाम’ सम्भवतः ‘पवित्र आत्मा’ नाम के दो घटकों की ओर संकेत करता है; इसके बाद आने वाले बहुवचन ‘वे’ का सटीक संदर्भ अनिश्चित है।
    reason: व्याकरणिक और धर्मवैचारिक अस्पष्टता दर्ज करने के लिए।
  - marker: c
    text: ‘अपनी माता’ का संकेत किसकी ओर है और ‘किसी और से’ का आशय क्या है, यह उपलब्ध पाठ में स्पष्ट नहीं है।
    reason: अनिश्चित सर्वनाम-संदर्भ को बिना अनुमान के चिह्नित करने के लिए।
  - marker: d
    text: इस अनुच्छेद में पांडुलिपि का पाठ कई स्थानों पर टूटा हुआ है। […] खोए या अपठनीय अंशों को दर्शाता है; कोष्ठकों में दिए शब्द सम्भावित पूर्ति हैं।
    reason: गंभीर पाठ-क्षति और पुनर्निर्माण की अनिश्चितता बताने के लिए।
  - marker: e
    text: ‘उसी के द्वारा’ और ‘वह’ के संदर्भ कठिन हैं। पाठ आग के धधकने और बुझने दोनों को उसी एक आत्मा से जोड़ता प्रतीत होता है।
    reason: सर्वनाम और कारण-संबंध की अस्पष्टता सुरक्षित रखने के लिए।
  - marker: f
    text: ‘एकामोथ’ और ‘एक्मोथ’ तकनीकी नाम हैं। उनकी वर्तनी और व्युत्पत्ति की पुष्टि के लिए कॉप्टिक पाठ की प्रत्यक्ष समीक्षा आवश्यक है।
    reason: स्रोत-भाषा समीक्षा लंबित होने के कारण लिप्यंतरण की अस्थायिता स्पष्ट करने के लिए।
lexical_decisions:
- source_word: heavenly human / earthly human / perfect human
  choice: स्वर्गीय मनुष्य / पृथ्वी का मनुष्य / सिद्ध मनुष्य
  rationale: ‘मनुष्य’ को समष्टिगत और विशिष्ट दोनों अर्थों के लिए बनाए रखा गया है; ‘सिद्ध’ आध्यात्मिक पूर्णता के भाव को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: begotten / beget
  choice: जन्म लेना / जन्म देना / उत्पन्न करना
  rationale: संदर्भ के अनुसार स्वाभाविक हिन्दी क्रियाएँ चुनी गई हैं; पिता-पुत्र कथन में ‘उत्पन्न करना’ और जन्म-संबंधी विस्तार में ‘जन्म देना/लेना’ रखा गया है।
- source_word: Word
  choice: वचन
  rationale: धार्मिक-दार्शनिक पद की पारंपरिक पहचान बनाए रखते हुए इसे विशिष्ट संज्ञा के रूप में रखा गया है।
- source_word: grace
  choice: अनुग्रह
  rationale: मूल धार्मिक अर्थ-क्षेत्र को बनाए रखने वाला प्रतिष्ठित और सुबोध हिन्दी पद।
- source_word: companion / partner
  choice: संगिनी / सहचरी
  rationale: संबंध की मूल अस्पष्टता को बनाए रखा गया है; वैवाहिक या यौन अर्थ को अनिवार्य नहीं बनाया गया।
- source_word: Wisdom
  choice: बुद्धि
  rationale: स्त्रीलिंग व्यक्तिकरण और दार्शनिक अर्थ दोनों को सम्भव रखने के लिए ‘बुद्धि’ चुना गया है।
- source_word: Spirit / Holy Spirit
  choice: आत्मा / पवित्र आत्मा
  rationale: मानक धार्मिक शब्दावली रखते हुए अनुच्छेद की लिंग और सर्वनाम-संबंधी अस्पष्टताओं को यथासंभव नहीं सुलझाया गया।
- source_word: Echamoth / Echmoth
  choice: एकामोथ / एक्मोथ
  rationale: विशिष्ट तकनीकी नामों का अर्थानुवाद न करके देवनागरी लिप्यंतरण किया गया है।
theological_decisions:
- issue: मरियम की बहुस्तरीय पहचान
  choice: ‘बहन, माता और सहचरी’ को ज्यों का त्यों रखा
  alternative: अलग-अलग मरियमों के रूप में स्पष्ट करना
  rationale: पाठ स्वयं जानबूझकर पहचान और संबंधों को गुँथाता है; अनुवाद में इसे किसी ऐतिहासिक या सिद्धान्तगत समाधान में नहीं बदला गया।
- issue: ‘पवित्र आत्मा’ का ‘दोहरा नाम’ और बहुवचन सर्वनाम
  choice: ‘वे’ बहुवचन को बनाए रखा
  alternative: बहुवचन को केवल नाम के दो शब्दों या त्रिएक व्यक्तियों से स्पष्ट रूप से जोड़ना
  rationale: उपलब्ध साक्ष्य में सर्वनाम का संदर्भ अस्पष्ट है; हिन्दी में इस तनाव को सुरक्षित रखा गया है।
- issue: आत्मा द्वारा भटकना
  choice: कारणात्मक कथन ‘उसी के द्वारा भटकते’ बनाए रखा
  alternative: अनुमति, न्याय या मानवीय दोष के रूप में व्याख्यात्मक पुनर्लेखन
  rationale: कठिन धर्मवैचारिक कथन को नरम या व्यवस्थित किए बिना मूल तनाव सुरक्षित रखा गया है।
- issue: चुम्बन द्वारा गर्भधारण और जन्म
  choice: रूपक को प्रत्यक्ष भाषा में रखा
  alternative: इसे केवल आध्यात्मिक सहभागिता के रूप में समझाकर लिखना
  rationale: पाठ की शारीरिक और आध्यात्मिक भाषा का जानबूझकर मेल अनसुलझा रखा गया है।
- issue: एकामोथ और एक्मोथ की ज्ञानमीमांसक पहचान
  choice: तकनीकी नाम और ‘बुद्धि’ की व्याख्या सुरक्षित रखी
  alternative: किसी विशिष्ट ज्ञानवादी तंत्र के अनुसार विस्तृत पहचान देना
