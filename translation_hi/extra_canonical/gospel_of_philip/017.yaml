    संसार की [अधिकांश वस्तुएँ] तब तक खड़ी रह सकती और जीवित रह सकती हैं, जब तक उनके [भीतर के अंग छिपे रहते हैं। यदि वे प्रकट हो जाएँ], तो वे मर जाती हैं—जैसा कि दिखाई देने वाले मनुष्य से [समझा जा सकता है]। [जब तक] मनुष्य के भीतर के अंग छिपे रहते हैं, वह जीवित रहता है। यदि उसके भीतर के अंग खुल जाएँ और बाहर निकल आएँ, तो वह मर जाएगा। पेड़ के साथ भी ऐसा ही है। जब तक उसकी जड़ छिपी रहती है, वह फूलता-फलता और बढ़ता है। यदि उसकी जड़ खुल जाए, तो पेड़ सूख जाता है। संसार में जन्मी हर वस्तु के साथ ऐसा ही है—केवल प्रकट वस्तुओं के साथ नहीं, बल्कि छिपी हुई वस्तुओं के साथ भी। क्योंकि जब तक बुराई की जड़ छिपी रहती है, वह शक्तिशाली रहती है। पर यदि उसे पहचान लिया जाए, तो वह गल जाती है; और यदि उसे प्रकट कर दिया जाए, तो वह मर जाती है। इसलिए वचन कहता है, “कुल्हाड़ा पेड़ों की जड़ पर रखा जा चुका है।”[b] वह केवल काटेगा नहीं, क्योंकि जो काटा जाता है वह फिर फूलने लगता है। इसके बजाय, कुल्हाड़ा धरती में तब तक गहरा खोदता है, जब तक जड़ को बाहर न निकाल दे। यीशु ने जड़ को पूरी तरह उखाड़ दिया, पर दूसरों ने ऐसा केवल कुछ अंश
    तक किया। हमारी बात यह है कि हममें से हर एक अपने भीतर की बुराई की जड़ तक गहरा खोदे और उसे अपने भीतर से जड़ समेत उखाड़ दे। यदि हम उसे पहचान लें, तो वह उखाड़ दी जाएगी। पर यदि हम उसे न पहचानें, तो वह हमारे भीतर जड़ पकड़ती है और हमारे भीतर अपना फल उत्पन्न करती है। वह हम पर अधिकार कर लेती है, और हमें उसकी सेवा करने के लिए विवश होना पड़ता है। वह हमें बंदी बना लेती है, ताकि जो हम [नहीं] करना चाहते, वही करें; और जो करना चाहते हैं, वह [न] करें। वह [इसलिए] शक्तिशाली है कि हमने उसे पहचाना नहीं है। जब तक [वह अस्तित्व में है], तब तक वह सक्रिय रहती है। [अज्ञान] [सारी बुराई] की माता है। अज्ञान [मृत्यु लाएगा, क्योंकि] जो कुछ [अज्ञान] से उत्पन्न होता है, वह न कभी अस्तित्व में था, न [अब अस्तित्व में है], और न वे अस्तित्व में आएँगे […] जब संपूर्ण सत्य प्रकट होगा, तब वे सिद्ध किए जाएँगे। क्योंकि सत्य भी अज्ञान के समान है: जब वह छिपा होता है, तो अपने भीतर स्थिर रहता है; पर जब वह प्रकट होकर पहचाना जाता है, तो उसकी महिमा होती है, क्योंकि वह अज्ञान और भ्रम से अधिक शक्तिशाली है। वह स्वतंत्रता देता है। वचन कहता
