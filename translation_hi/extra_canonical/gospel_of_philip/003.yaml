translation:
  language: hi
  text: 'जो नाम सांसारिक लोगों को दिए जाते हैं, वे बहुत भरमाने वाले हैं, क्योंकि वे हृदय को सही बात से हटाकर गलत बात की ओर मोड़ देते हैं। जो कोई “परमेश्वर” सुनता है, वह सही बात के बारे में नहीं सोचता, बल्कि गलत बात के बारे में सोचता है। “पिता,” “पुत्र,” “पवित्र आत्मा,” “जीवन,” “ज्योति,” “पुनरुत्थान,” “कलीसिया” और बाकी सभी नामों के साथ भी ऐसा ही है—लोग [सही बात] के बारे में नहीं, बल्कि [गलत] बात के बारे में सोचते हैं, [जब तक कि] उन्होंने सही बात को जाना न हो। [जो नाम सुने गए] वे संसार में हैं […] [और भरमाते हैं। यदि वे] अनन्त युग[a] में होते, तो संसार में नामों के रूप में उनका उपयोग न होता, न उन्हें सांसारिक वस्तुओं के बीच रखा जाता। अनन्त युग में उनका अन्त हो जाता है।


    एक नाम ऐसा है जिसका उच्चारण संसार में नहीं किया जाता: वह नाम जो पिता ने पुत्र को दिया। वह हर वस्तु से ऊँचा है; वह पिता का नाम है, क्योंकि यदि पुत्र ने पिता का नाम धारण न किया होता, तो वह पिता न बनता। जिनके पास यह नाम है, वे इसे जानते हैं, पर कहते नहीं; और जिनके पास यह नहीं है, वे इसे नहीं जानते। लेकिन सत्य हमारे लिए नामों को संसार में लाया, क्योंकि इन नामों के बिना सत्य को जानना हमारे लिए असम्भव है। सत्य केवल एक है, फिर भी हमारे लिए वह अनेक है, ताकि अनेक बातों के द्वारा प्रेम में हमें इसी एक बात की शिक्षा दे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अनन्त युग” उस आने वाले या शाश्वत क्षेत्र के लिए प्रयुक्त पद है जिसे साक्ष्य में संसार के विपरीत रखा गया है।
    reason: पद की कालगत और क्षेत्रगत अस्पष्टता स्पष्ट करना, बिना उसे किसी एक धर्मवैज्ञानिक व्यवस्था में सीमित किए।
  - marker: b
    text: यह अनुवाद उपलब्ध सार्वजनिक-अधिकार वाले अंग्रेज़ी साक्ष्य पर आधारित एक अंतरिम रूप है; कॉप्टिक मूल-पाठ की प्रत्यक्ष समीक्षा अभी शेष है। वर्ग कोष्ठक और […] पाण्डुलिपि की क्षति अथवा सम्पादकीय पुनर्स्थापना के संकेत सुरक्षित रखते हैं।
    reason: स्रोत-आधार की सीमा तथा पाठ में दिखाई गई क्षति और पुनर्निर्माण के चिह्नों का पारदर्शी विवरण देना।
lexical_decisions:
- source_word: worldly
  choice: सांसारिक
  rationale: यह ‘संसार से संबंधित’ अर्थ को स्वाभाविक आधुनिक हिन्दी में रखता है और अनावश्यक नैतिक व्याख्या नहीं जोड़ता।
- source_word: very deceptive
  choice: बहुत भरमाने वाले
  rationale: नाम स्वयं भ्रम उत्पन्न करते हैं—इस सक्रिय अर्थ को ‘भ्रामक’ की अपेक्षा अधिक सहज ढंग से व्यक्त करता है।
- source_word: what's right / what's not right
  choice: सही बात / गलत बात
  rationale: साक्ष्य में उपस्थित व्यापक और कुछ हद तक अस्पष्ट विरोध को बनाए रखा गया है; इसे ‘सत्य/असत्य’ बनाकर दार्शनिक अर्थ सीमित नहीं किया गया।
- source_word: the (eternal) age
  choice: अनन्त युग
  rationale: कोष्ठकीय व्याख्या को सहज हिन्दी पद में रखा गया है; इसे ‘स्वर्ग’ या किसी विशिष्ट परलोक-सिद्धान्त से नहीं जोड़ा गया।
- source_word: church
  choice: कलीसिया
  rationale: भारतीय हिन्दी मसीही पाठकों में प्रचलित धार्मिक पद है और केवल भवन के बजाय समुदाय का अर्थ सम्भव रहने देता है।
- source_word: Truth
  choice: सत्य
  rationale: व्यक्तिवाची या सत्तात्मक प्रयोग की सम्भावना बनाए रखने के लिए प्रमुख स्थानों पर इसे ‘सत्य’ रूप में रखा गया है।
- source_word: took the name
  choice: नाम धारण किया
  rationale: यह केवल नाम जानने के बजाय उसे ग्रहण करने या अपने ऊपर लेने की अर्थ-छाया बनाए रखता है।
theological_decisions:
- issue: पुत्र का पिता बनना
  choice: “तो वह पिता न बनता” को यथावत रखा गया
  alternative: इसे पिता का प्रतिनिधि या पिता के समान बनना कहना
  rationale: मूल साक्ष्य का कथन धर्मवैज्ञानिक तनाव लिए हुए है; व्याख्यात्मक विस्तार से उसे किसी निश्चित सिद्धान्त में नहीं बदला गया।
- issue: एक सत्य का अनेक होना
  choice: “सत्य केवल एक है, फिर भी हमारे लिए वह अनेक है”
  alternative: सत्य अनेक रूप धारण करता है
  rationale: ‘रूप धारण करता है’ मूल में निहित हो सकता है, पर वह अस्पष्ट कथन को स्पष्ट व्याख्या में बदल देता; इसलिए विरोधाभासी तनाव सुरक्षित रखा गया।
- issue: गुप्त नाम का स्वरूप
  choice: नाम को अनिर्दिष्ट रखा गया
  alternative: किसी ज्ञात ईश्वरीय नाम से उसकी पहचान करना
  rationale: पाठ स्वयं नाम नहीं बताता; किसी परम्परागत पहचान को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज लेकिन गरिमापूर्ण शैली रखी गई है। धार्मिक नामों में प्रचलित हिन्दी मसीही शब्दावली अपनाई गई, जबकि कठिन दार्शनिक कथनों की वास्तविक अस्पष्टता और तनाव को सरल व्याख्या से मिटाया नहीं गया।
