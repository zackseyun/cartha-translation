id: GPHIL.003
reference: Gospel of Philip — Names
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: 'The names that are given to those who are worldly are very deceptive, because they turn the heart away from what''s right to what''s not right, and someone who hears "God" doesn''t think of what''s right but thinks of what''s not right. So also with "the Father," "the Son," "the Holy Spirit," "the life," "the light," "the resurrection," "the church," and all the others – they don''t think of [what''s right] but think of what''s [not] right, [unless] they''ve learned what''s right. The [names that were heard] exist in the world […] [deceive. If they existed] in the (eternal) age they wouldn''t have been used as names in the world, nor would they have been placed among worldly things. They have an end in the (eternal) age.


    There''s one name that isn''t uttered in the world: the name which the Father gave to the Son. It''s exalted over everything; it''s the Father''s name, because the Son wouldn''t have become father unless he had taken the name of the Father. Those who have this name know it, but don''t say it; and those who don''t have it, don''t know it. But Truth brought names into the world for us, because it''s impossible for us to learn it (Truth) without these names. There''s only one Truth, but it''s many things for us, to teach this one thing in love through many things.'
