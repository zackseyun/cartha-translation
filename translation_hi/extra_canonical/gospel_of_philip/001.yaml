translation:
  language: hi
  text: 'एक इब्रानी एक इब्रानी को उत्पन्न करता है, और [इस] प्रकार के व्यक्ति को “यहूदी मत अपनानेवाला”[a] कहा जाता है। पर एक [यहूदी मत अपनानेवाला] दूसरे यहूदी मत अपनानेवाले को उत्पन्न नहीं करता। वे […] के समान हैं और वे दूसरों को उत्पन्न करते हैं […] उनके लिए इतना ही काफ़ी है कि वे अस्तित्व में आ जाएँ।


    दास केवल स्वतंत्रता चाहता है; वह अपने स्वामी की संपत्ति नहीं चाहता। पर पुत्र केवल पुत्र ही नहीं है; वह अपने पिता की विरासत पर अपना दावा करता है। जो मरे हुओं की विरासत पाते हैं, वे स्वयं भी मरे हुए हैं, और वे मरे हुओं को विरासत में पाते हैं। जो जीवितों की विरासत पाते हैं, वे स्वयं भी जीवित हैं, और वे जीवितों और मरे हुओं—दोनों को विरासत में पाते हैं। मरे हुए किसी वस्तु की विरासत नहीं पा सकते, क्योंकि मरे हुए भला कैसे विरासत पाएँगे? यदि मरा हुआ जीवित को विरासत में पाए, तो वह नहीं मरेगा, बल्कि वह मरा हुआ और भी अधिक जीवित होगा! अन्यजाति का व्यक्ति नहीं मरता, क्योंकि वह कभी जीवित ही नहीं हुआ कि मर सके। जिसने सत्य पर विश्वास किया है, वह जीवित हुआ है और उसके मरने का जोखिम है, क्योंकि जिस दिन से मसीह आया, उसी दिन से वह जीवित है। संसार रचा जाता है, नगर बसाए जाते हैं,[b] और मरे हुओं को बाहर ले जाया जाता है।


    जब हम इब्रानी थे, तब हम पिताविहीन थे—हमारे पास [केवल] हमारी माता थी। पर जब हम मसीही बने, तब हमें पिता और माता दोनों मिले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से यूनानी मूल का पद ‘प्रोसेलाइट’; यहाँ आशय उस व्यक्ति से है जिसने यहूदी मत और समुदाय को अपनाया हो। कोष्ठक पाठ की पुनर्स्थापना दर्शाते हैं।
    reason: तकनीकी धार्मिक पद और संपादकीय पुनर्स्थापना को स्पष्ट करना।
  - marker: b
    text: यह पंक्ति और विशेष रूप से ‘नगर बसाए जाते हैं’ वाला पद पाठगत या अनुवादगत रूप से अनिश्चित है। उपलब्ध अंग्रेज़ी साक्ष्य में इसका अर्थ ‘नगरों का स्वरूप/निवासी बदलना’ भी हो सकता है।
    reason: प्रत्यक्ष कॉप्टिक समीक्षा लंबित होने और अंग्रेज़ी witness के असामान्य ‘gentrified’ पद के कारण वास्तविक अनिश्चितता सुरक्षित रखना।
lexical_decisions:
- source_word: Hebrew
  choice: इब्रानी
  rationale: जातीय-धार्मिक पद को आधुनिक हिन्दी में पहचाने जाने योग्य रखते हुए ‘यहूदी’ और ‘इब्रानी’ के बीच मूल पाठ के भेद को बनाए रखा गया है।
- source_word: proselyte
  choice: यहूदी मत अपनानेवाला
  rationale: ‘धर्मांतरित’ की अस्पष्टता से बचते हुए यहाँ यहूदी समुदाय में प्रवेश करनेवाले व्यक्ति का आशय स्पष्ट किया गया है; पहली occurrence पर पादटिप्पणी जोड़ी गई है।
- source_word: slave
  choice: दास
  rationale: स्वामी, संपत्ति, स्वतंत्रता और पुत्र की विरासत के विरोध को बनाए रखने के लिए अधिक सटीक सामाजिक-कानूनी पद चुना गया है।
- source_word: inherit / inheritance
  choice: विरासत पाना / विरासत
  rationale: अंश में कानूनी उत्तराधिकार और रूपकात्मक प्राप्ति दोनों हैं; समान शब्दावली पुनरावृत्ति और तनाव को सुरक्षित रखती है।
- source_word: gentile
  choice: अन्यजाति का व्यक्ति
  rationale: यहूदी/इब्रानी पहचान के बाहर के व्यक्ति का पारंपरिक किंतु समझने योग्य पद है, और आधुनिक जातीय अर्थों से कुछ दूरी रखता है।
- source_word: Truth
  choice: सत्य
  rationale: मूल साक्ष्य में व्यक्तिवाची या धर्मवैचारिक संकेत संभव है; बड़े अक्षर का भेद हिन्दी में न होने के कारण शब्द को बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: Christians
  choice: मसीही
  rationale: आधुनिक मानक हिन्दी में स्वाभाविक और व्यापक रूप से समझा जानेवाला पद, बिना सांप्रदायिक विशिष्टता के।
- source_word: gentrified
  choice: बसाए जाते हैं
  rationale: दिए गए अंग्रेज़ी साक्ष्य का यह पद संदर्भ में असामान्य और संभवतः पाठ/अनुवाद-संदिग्ध है; ‘बसाए जाते हैं’ सृजन और मृतकों को बाहर ले जाने की समानांतर संरचना में न्यूनतम अर्थ देता है, जबकि पादटिप्पणी अनिश्चितता सुरक्षित रखती है।
theological_decisions:
- issue: मरे हुए और जीवित लोगों को ‘विरासत में पाने’ की असामान्य भाषा
  choice: शाब्दिक पारस्परिक संरचना बनाए रखी गई
  alternative: इसे ‘मृत/जीवित वस्तुओं की विरासत’ या ‘उनसे मिलने वाली संपत्ति’ के रूप में स्पष्ट करना
  rationale: अंश जानबूझकर उत्तराधिकार, जीवन और मृत्यु की श्रेणियों को उलटता है; व्याख्यात्मक सरलीकरण धर्मवैचारिक तनाव मिटा देता।
- issue: अन्यजाति के व्यक्ति के न मरने का कथन
  choice: विरोधाभासी कथन को ज्यों का त्यों रखा गया
  alternative: इसे केवल आत्मिक मृत्यु के अर्थ में स्पष्ट करना
  rationale: साक्ष्य स्वयं जीवन और मृत्यु को रूपकात्मक तथा अस्तित्वगत अर्थों में मिलाता है; किसी एक सिद्धांत में इसे सीमित करना उचित नहीं।
- issue: पिता और माता की धार्मिक पहचान
  choice: दोनों को बिना पहचान बताए रखा गया
  alternative: पिता को परमेश्वर और माता को कलीसिया/पवित्र आत्मा/ज्ञान कहना
  rationale: इस अंश में इनकी स्पष्ट पहचान नहीं दी गई; किसी नामित धार्मिक व्याख्या को आरोपित नहीं किया गया।
- issue: ‘जिस दिन से मसीह आया’ और जीवन का संबंध
  choice: कालगत कथन और व्यक्ति के जीवित होने का तनाव बनाए रखा गया
  alternative: इसे सार्वभौमिक उद्धार-ऐतिहासिक कथन या व्यक्तिगत परिवर्तन के रूप में स्पष्ट करना
  rationale: साक्ष्य दोनों संभावनाओं को पूर्णतः अलग नहीं करता, इसलिए अनिश्चितता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पुनरावृत्तियों और सूत्रात्मक विरोधों को शैलीगत दोष मानकर हटाया नहीं गया। वर्गाकार कोष्ठक और […] पांडुलिपि की पुनर्स्थापना तथा क्षति के संकेत के रूप में सुरक्षित हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; कॉप्टिक मूल की प्रत्यक्ष समीक्षा लंबित है।
