  yaml_path: translation/extra_canonical/gospel_of_philip/002.yaml
  text: 'Those who sow in winter reap in summer. Winter is the world; summer is the other age. Let us sow in the world so that we may reap in summer. For this reason, it is not right for us to pray in winter. Summer follows winter. But if someone reaps in winter, they will not reap but will uproot, since this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it is fruitless.


    Christ came to buy some, to save others, and to redeem still others. He bought those who were strangers, made them his own, and set them apart as a pledge, as he wished. It was not only when he appeared that he laid down his life when he wished; rather, since the day the world came into being, he laid down his life when he wished. Then he came first to take it, since it had been pledged. It was under the power of the robbers who had captured it, but he saved it. He also redeemed those who are good in the world, as well as those who are bad.


    Light and darkness, right and left, are brothers to each other. They are inseparable. Therefore, those who are good are not good, those who are bad are not bad, life is not really life, and death is not really death. For this reason, each one will be dissolved into its origin from the beginning. But those who are exalted above the world cannot be dissolved and are eternal.'
translation:
  language: hi
  text: 'जो लोग जाड़े में बोते हैं, वे गरमी में काटते हैं। जाड़ा यह संसार है और गरमी आनेवाला युग। आओ, हम संसार में बोएँ, ताकि गरमी में काटें। इसी कारण हमारे लिए जाड़े में प्रार्थना करना उचित नहीं है। जाड़े के बाद गरमी आती है। पर यदि कोई जाड़े में फसल काटता है, तो वह काटेगा नहीं, बल्कि उखाड़ेगा; क्योंकि इस प्रकार की फसल फल नहीं देगी […] वह केवल बाहर नहीं आती […] बल्कि दूसरे सब्त में […] वह निष्फल है।[a]


    मसीह कुछ लोगों को मोल लेने, कुछ को बचाने और कुछ अन्य लोगों को छुड़ाने आया। जो पराए थे, उन्हें उसने मोल लिया, अपना बनाया, और अपनी इच्छा के अनुसार उन्हें बयाने के रूप में अलग रखा। ऐसा नहीं कि केवल अपने प्रकट होने के समय ही उसने, जब चाहा, अपना जीवन अर्पित किया; बल्कि जिस दिन से संसार अस्तित्व में आया, तभी से उसने, जब चाहा, अपना जीवन अर्पित किया। फिर वह पहले उसे लेने आया, क्योंकि उसे बयाने के रूप में रखा गया था। वह उन लुटेरों के वश में था जिन्होंने उसे पकड़ लिया था, पर उसने उसे बचा लिया। और संसार में जो अच्छे हैं, उन्हें भी उसने छुड़ाया, और जो बुरे हैं, उन्हें भी।[b]


    प्रकाश और अंधकार, दायाँ और बायाँ, आपस में भाई हैं। वे एक-दूसरे से अलग नहीं किए जा सकते। इसलिए जो अच्छे हैं वे अच्छे नहीं हैं, जो बुरे हैं वे बुरे नहीं हैं; न जीवन वास्तव में जीवन है, न मृत्यु वास्तव में मृत्यु। इसी कारण हर एक अपने उस मूल में विलीन हो जाएगा जो आरम्भ से है। पर जो संसार से ऊपर उठाए गए हैं, वे अविलय और अनन्त हैं।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अनुच्छेद के अंतिम भाग में पांडुलिपि क्षतिग्रस्त या पाठ अनिश्चित है; […] लुप्त अथवा अनिश्चित अंशों को दर्शाता है।
    reason: खंडित स्रोत-पाठ और उसके कारण उत्पन्न वाक्यगत अस्पष्टता को स्पष्ट करना।
  - marker: b
    text: इस अनुच्छेद में ‘जीवन’, ‘उसे’ और ‘वह’ के संदर्भ कुछ स्थानों पर अस्पष्ट हैं; अनुवाद ने उन्हें किसी एक निश्चित व्याख्या से नहीं बदला है।
    reason: सर्वनाम-संदर्भ की वास्तविक अनिश्चितता सुरक्षित रखना।
  - marker: c
    text: ‘दायाँ’ और ‘बायाँ’ यहाँ प्रकाश और अंधकार के समान विरोधी युग्म के रूप में आते हैं। ‘अविलय’ का अर्थ है जिसे विलीन या विघटित न किया जा सके।
    reason: असामान्य प्रतीकात्मक युग्म और दुर्लभ हिन्दी पद को समझने में सहायता देना।
lexical_decisions:
- source_word: winter / summer
  choice: जाड़ा / गरमी
  rationale: ऋतु-रूपक को साधारण आधुनिक हिन्दी में स्पष्ट रखते हुए शब्दशः मौसमी विरोध बनाए रखा गया है।
- source_word: the other age
  choice: आनेवाला युग
  rationale: वर्तमान संसार के विपरीत भावी काल-व्यवस्था का अर्थ व्यक्त करता है; इसे केवल ‘परलोक’ बनाकर संकीर्ण नहीं किया गया।
- source_word: buy / save / redeem
  choice: मोल लेना / बचाना / छुड़ाना
  rationale: तीनों निकटवर्ती पर भिन्न क्रियाओं का भेद सुरक्षित रखा गया है।
- source_word: pledge
  choice: बयाना
  rationale: किसी भावी दावे या प्राप्ति की गारंटी के रूप में अलग रखी वस्तु का अर्थ देता है; संदर्भ की अस्पष्टता बनी रहती है।
- source_word: indissoluble
  choice: अविलय
  rationale: पूर्ववर्ती ‘विलीन हो जाएगा’ के साथ शब्दगत विरोध बनाए रखता है और नष्ट या विघटित न हो सकने का भाव देता है।
