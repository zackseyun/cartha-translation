- issue: अच्छे अच्छे नहीं और बुरे बुरे नहीं
  choice: प्रत्यक्ष विरोधाभासी रूप बनाए रखा गया
  alternative: ‘जिन्हें अच्छा/बुरा कहा जाता है’ जैसा व्याख्यात्मक रूप
  rationale: मूल साक्ष्य के तत्वमीमांसात्मक तनाव को चुपचाप हल नहीं किया गया।
- issue: हर एक का अपने मूल में विलीन होना
