  revised_text: 'जो लोग जाड़े में बोते हैं, वे गरमी में काटते हैं। जाड़ा संसार है; गरमी अन्य युग है। आओ, हम संसार में बोएँ, ताकि गरमी में काटें। इसी कारण हमारे लिए जाड़े में प्रार्थना करना उचित नहीं है। जाड़े के बाद गरमी आती है। पर यदि कोई जाड़े में काटे, तो वह काटेगा नहीं, बल्कि उखाड़ेगा; क्योंकि यह प्रकार फल नहीं देगा […] वह केवल प्रकट नहीं होता […] बल्कि दूसरे सब्त में […] वह निष्फल है।[a]


    मसीह कुछ लोगों को मोल लेने, कुछ को बचाने और कुछ अन्य लोगों को छुड़ाने आया। जो पराए थे, उन्हें उसने मोल लिया, अपना बनाया, और अपनी इच्छा के अनुसार उन्हें बंधक के रूप में अलग रखा। ऐसा नहीं कि केवल अपने प्रकट होने के समय ही उसने, जब चाहा, अपना जीवन अर्पित किया; बल्कि जिस दिन से संसार अस्तित्व में आया, तभी से उसने, जब चाहा, अपना जीवन अर्पित किया। फिर वह पहले उसे लेने आया, क्योंकि उसे बंधक रखा गया था। वह उन लुटेरों के वश में था जिन्होंने उसे पकड़ लिया था, पर उसने उसे बचा लिया। संसार में जो अच्छे हैं, उन्हें भी उसने छुड़ाया, और जो बुरे हैं, उन्हें भी।[b]


    प्रकाश और अंधकार, दायाँ और बायाँ, आपस में भाई हैं। वे एक-दूसरे से अलग नहीं किए जा सकते। इसलिए जो अच्छे हैं वे अच्छे नहीं हैं, जो बुरे हैं वे बुरे नहीं हैं; न जीवन वास्तव में जीवन है, न मृत्यु वास्तव में मृत्यु। इसी कारण हर एक अपने उस मूल में विलीन हो जाएगा जो आरम्भ से है। पर जो संसार से ऊपर उठाए गए हैं, वे अविघटनीय और अनन्त हैं।[c]'
