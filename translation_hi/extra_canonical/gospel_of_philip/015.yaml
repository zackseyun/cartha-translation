translation:
  language: hi
  text: 'जो लोग कहते हैं कि वे पहले मरेंगे और उसके बाद जी उठेंगे, वे गलत हैं। यदि वे जीवित रहते हुए पहले पुनरुत्थान को प्राप्त नहीं करते, तो मरने पर उन्हें कुछ भी प्राप्त नहीं होगा। बपतिस्मा के विषय में भी यही बात है। वे कहते हैं, “बपतिस्मा बड़ी बात है,” क्योंकि जो इसे ग्रहण करते हैं वे जीवित रहेंगे।


    प्रेरित फिलिप्पुस ने कहा, “बढ़ई यूसुफ ने एक बगीचा लगाया, क्योंकि उसे अपने काम के लिए लकड़ी चाहिए थी। उसी ने अपने लगाए हुए पेड़ों से क्रूस बनाया, और उसकी संतान उसी की लगाई हुई वस्तु पर लटकाई गई। उसकी संतान यीशु था और वह पौधा क्रूस था।” पर जीवन का वृक्ष स्वर्गोद्यान के बीच में है; जैतून के वृक्ष से अभिषेक का तेल आया, और उससे पुनरुत्थान।


    यह संसार मुर्दों को खाता है। जिन्हें भी इसमें खाया जाता है, वे भी मर जाते हैं। सत्य जीवन को खाता है; इसलिए जो [सत्य] से पोषित होता है, वह नहीं मरेगा। यीशु उस स्थान से आया और वहाँ से भोजन लाया; जो चाहते थे, उन्हें उसने [खाने को दिया, ताकि] वे न मरें।


    [परमेश्वर …] एक स्वर्गोद्यान, [मनुष्य …] स्वर्गोद्यान, वहाँ […] और […] परमेश्वर के […] जो उसमें [हैं …] मेरी इच्छा है कि [स्वर्गोद्यान …] वे मुझसे कहेंगे, “[यह … खाओ],” या “[वह] मत खाओ [… इच्छा]।” ज्ञान का वृक्ष वह स्थान है जहाँ मैं सब कुछ खाऊँगा। उसने आदम को मार डाला, पर यहाँ वह मानवता को जीवन देता है। व्यवस्था वह वृक्ष थी। उसमें भले और बुरे का ज्ञान देने की शक्ति है। उसने न तो उन्हें बुराई से रोका, न भलाई में स्थापित किया; बल्कि उससे खाने वालों के लिए मृत्यु उत्पन्न की। क्योंकि जब उसने कहा, “यह खाओ, वह मत खाओ,” तो वह मृत्यु का आरम्भ बन गई।


    अभिषेक बपतिस्मा से उत्तम है, क्योंकि हम अभिषेक के कारण “मसीही” कहलाते हैं, बपतिस्मा के कारण नहीं। और अभिषेक के कारण ही मसीह का यह नाम पड़ा, क्योंकि पिता ने पुत्र का अभिषेक किया, पुत्र ने प्रेरितों का अभिषेक किया और प्रेरितों ने हमारा अभिषेक किया। जिसका अभिषेक हुआ है, उसके पास सब कुछ है—पुनरुत्थान, ज्योति, क्रूस और पवित्र आत्मा। पिता ने यह उसे विवाह-कक्ष में दिया और उसने इसे ग्रहण किया। पिता पुत्र में था और पुत्र पिता में। यही स्वर्ग का [राज्य] है।


    प्रभु ने ठीक कहा: “कुछ लोग हँसते हुए स्वर्ग के राज्य में गए और वे बाहर आए […] एक मसीही […] और जैसे ही [… पानी में उतरा] और उसने […] उसके बारे में सब कुछ […] यह [एक] खेल है, [पर … उपेक्षा] इसे […] स्वर्ग के राज्य में [… यदि] वे उपेक्षा करें […] और यदि वे इसे खेल समझकर तुच्छ जानें, [… बाहर] हँसते हुए।” रोटी, प्याला और तेल के साथ भी ऐसा ही है, यद्यपि इनमें से एक से उत्तम भी कुछ है।


    संसार एक अपराध के द्वारा अस्तित्व में आया, क्योंकि जिसने उसे बनाया वह उसे अविनाशी और अमर बनाना चाहता था। वह चूक गया और जो चाहता था उसे प्राप्त न कर सका; क्योंकि न संसार अविनाशी था, न उसका बनाने वाला अविनाशी था। कारण यह है कि वस्तुएँ अविनाशी नहीं होतीं, बल्कि संतानें होती हैं। कोई भी संतान बने बिना अविनाशिता प्राप्त नहीं कर सकेगा। पर जो ग्रहण ही नहीं कर सकता, वह दे कैसे सकेगा?


    प्रार्थना के प्याले में दाखरस और पानी है, क्योंकि उसे उस लहू के प्रतिरूप के रूप में रखा जाता है जिस पर वे धन्यवाद देते हैं। वह पवित्र आत्मा से भर जाता है और पूर्णतः सिद्ध मनुष्य से संबंधित है। जब भी हम इसे पीते हैं, हम सिद्ध मनुष्य को ग्रहण करेंगे। जीवित जल एक देह है। हमारे लिए जीवित मनुष्य को धारण करना आवश्यक है। इसलिए पानी में उतरते समय वे अपने वस्त्र उतारते हैं, ताकि उस मनुष्य को धारण करें।


    घोड़ा घोड़े को जन्म देता है, मनुष्य मनुष्य को, और देवता देवता को। [दूल्हे] और [दुलहनों] के साथ भी ऐसा ही है। वे […] से [अस्तित्व में आते हैं]। कोई यहूदी […] से […] अस्तित्व रखता है और […] यहूदियों से […] मसीहियों ने […] इन्हें “[…] का चुना हुआ वंश,” “सच्चा मनुष्य,” “मनुष्य का पुत्र” और “मनुष्य के पुत्र का वंश” कहा। यह सच्चा वंश संसार में पहचाना जाता है। ये वे स्थान हैं जहाँ विवाह-कक्ष की संतानें रहती हैं।


    इस संसार में मिलन पुरुष और स्त्री के बीच होता है—यह शक्ति और दुर्बलता का स्थान है। आने वाले युग में मिलन कुछ और ही प्रकार का है, यद्यपि हम उनके लिए वही नाम प्रयोग करते हैं। फिर भी दूसरे नाम भी हैं, जो हर उस नाम से ऊपर हैं जिसका नाम लिया जाता है; और वे बलवानों से श्रेष्ठ हैं, क्योंकि जहाँ बल है, वहाँ उनसे भी अधिक शक्तिशाली जन हैं। वे दो अलग-अलग वस्तुएँ नहीं हैं, बल्कि दोनों एक ही वस्तु हैं। यह बात देहधारी हृदय पर उतर नहीं सकती।


    क्या यह आवश्यक नहीं कि जिसके पास सब कुछ है, वह अपने आपको पूरी तरह जाने? जो अपने आपको नहीं जानते, उनमें से कुछ अपनी वस्तुओं का आनन्द नहीं ले सकेंगे; पर जो अपने आपको समझ चुके हैं, वे उनका आनन्द लेंगे।


    वे सिद्ध मनुष्य को बाँध ही नहीं सकेंगे, बल्कि उसे देख भी नहीं सकेंगे, क्योंकि यदि वे उसे देख लें तो बाँध देंगे। इस अनुग्रह को अपने लिए प्राप्त करने का कोई दूसरा मार्ग नहीं, [सिवाय इसके कि] कोई सिद्ध ज्योति को धारण करे [और] सिद्ध [ज्योति बन जाए। जिसने उसे] धारण किया है, वह जाएगा […] यह सिद्ध […] कि हम बनें […] हमारे आने से पहले […] जो सब कुछ ग्रहण करता है […] इन स्थानों में, वे […] उस स्थान को कर सकेंगे, पर वे […] [बीच में] अपूर्ण जनों के समान। केवल यीशु ही इसका अन्त जानता है।


    पवित्र मनुष्य—अर्थात पुरोहित—पूरी तरह पवित्र है, यहाँ तक कि उसकी देह भी। क्योंकि यदि वह रोटी ग्रहण करता है, तो उसे पवित्र कर देगा; या प्याले को, अथवा किसी भी दूसरी वस्तु को जिसे वह लेकर शुद्ध करता है। तो वह देह को भी शुद्ध क्यों नहीं करेगा?


    जिस प्रकार यीशु ने बपतिस्मा के पानी को सिद्ध किया, उसी प्रकार उसने मृत्यु को उँडेल दिया। इसलिए हम पानी में उतरते तो हैं, पर मृत्यु में नहीं उतरते, ताकि हमें संसार की आत्मा में न उँडेल दिया जाए। जब वह बहती है तो जाड़ा आता है; जब पवित्र आत्मा श्वास देता है तो गरमी आती है।


    जो सत्य को जानता है वह स्वतंत्र मनुष्य है, और स्वतंत्र मनुष्य पाप नहीं करता, क्योंकि “जो पाप करता है वह पाप का दास है।” सत्य माता है, पर ज्ञान मिलन है। जो पाप के अधीन नहीं किए गए, वे संसार में “स्वतंत्र” कहलाते हैं। सत्य का ज्ञान इन लोगों को, जो पाप के अधीन नहीं किए गए, गर्व से भर देता है। वही उन्हें स्वतंत्र करता और हर वस्तु से ऊपर उठाता है। पर “प्रेम उन्नति करता है”; और जो ज्ञान के द्वारा स्वतंत्र किया गया है, वह उन लोगों के प्रति प्रेम के कारण दास बनता है जो अभी ज्ञान की स्वतंत्रता प्राप्त नहीं कर सकते। [पर] ज्ञान उन्हें स्वतंत्र होने योग्य बनाता है। प्रेम […] किसी भी वस्तु को अपना […] वह […] अपना। वह कभी [नहीं कहता, “…,”] या “यह मेरा है,” [बल्कि “…] तुम्हारे हैं।” आत्मिक प्रेम सुगन्धित दाखरस है। जो भी उससे अपना अभिषेक करते हैं, वे उसका आनन्द लेते हैं। जब तक अभिषिक्त लोग पास रहते हैं, आसपास के लोग भी उसका आनन्द लेते हैं। यदि सुगन्धित तेल से अभिषिक्त लोग उन्हें छोड़कर चले जाएँ, तो जो अभिषिक्त नहीं हैं और केवल पास थे, वे अपनी दुर्गन्ध में रह जाते हैं।

    सामरी ने घायल मनुष्य को तेल मिले दाखरस के सिवा कुछ नहीं दिया। वह सुगन्धित मरहम ही था, और उसने घावों को चंगा किया, क्योंकि “प्रेम बहुत-से पापों को ढक देता है।”


    स्त्री जिन बच्चों को जन्म देती है, वे उस पुरुष के समान दिखाई देंगे जिससे वह प्रेम करती है। यदि वह उसका पति है, तो वे उसके पति के समान दिखाई देंगे; यदि वह परपुरुष है, तो वे उस परपुरुष के समान दिखाई देंगे। प्रायः यदि कोई स्त्री विवश होकर अपने पति के साथ सोती है, पर उसका हृदय उस परपुरुष के साथ है जिससे उसके घनिष्ठ संबंध हैं, और वह बच्चे को जन्म देती है, तो उसका जन्मा बच्चा उस परपुरुष के समान दिखाई देता है। पर तुम, जो परमेश्वर के पुत्र के साथ हो, संसार से प्रेम न करो; बल्कि प्रभु से प्रेम करो, ताकि जिन्हें तुम जन्म दोगे वे संसार के समान नहीं, बल्कि प्रभु के समान दिखाई दें।


    मनुष्य मनुष्य से मिलता है, घोड़ा घोड़े से और गधा गधे से। प्रजातियाँ अपने समान [प्रजातियों से] मिलती हैं। इसी प्रकार आत्मा आत्मा से मिलती है, [वचन] वचन से घनिष्ठ होता है, [और ज्योति] ज्योति से [घनिष्ठ होती है]। यदि [तुम] मनुष्य बनो, तो [मनुष्य ही] तुमसे प्रेम करेगा। यदि तुम [आत्मा] बनो, तो आत्मा तुमसे मिलेगी। [यदि] तुम वचन बनो, तो वचन तुमसे मिलेगा। यदि [तुम] ज्योति बनो, तो ज्योति तुमसे घनिष्ठ होगी। यदि तुम ऊपर के लोगों में से एक बनो, तो ऊपर के लोग तुम पर विश्राम करेंगे। यदि तुम घोड़ा, गधा, बछड़ा, कुत्ता, भेड़ या बाहर अथवा नीचे के पशुओं में से कोई और बनो, तो न मनुष्य, न आत्मा, न वचन, न ज्योति, न ऊपर के लोग और न भीतर के लोग तुमसे प्रेम कर सकेंगे। वे तुम्हारे भीतर विश्राम नहीं कर सकेंगे और उनमें तुम्हारा कोई भाग न होगा।


    जो अपनी इच्छा के विरुद्ध दास है, वह स्वतंत्र किया जा सकेगा। पर जो अपने स्वामी के अनुग्रह से स्वतंत्र हुआ और फिर अपने आपको बेचकर दोबारा दास बन गया, वह फिर कभी स्वतंत्र नहीं किया जा सकेगा।'
