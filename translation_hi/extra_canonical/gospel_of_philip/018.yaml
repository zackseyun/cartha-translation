translation:
  language: hi
  text: 'हर व्यक्ति जो कक्ष में [प्रवेश करेगा], अपना [दीपक] जलाएगा, क्योंकि [यह] उन विवाहों के समान है जो […] रात में होते हैं; आग […] रात में और बुझ जाती है। पर इस विवाह के रहस्य दिन और प्रकाश में पूरे होते हैं। न वह दिन कभी ढलता है, न उसका प्रकाश।


    यदि कोई विवाह-कक्ष की संतान बनता है, तो वह प्रकाश पाएगा। यदि कोई उसे यहाँ रहते हुए नहीं पाता, तो वह उसे दूसरी जगह में नहीं पा सकेगा। जो उस प्रकाश को पाएगा, वह न दिखाई देगा, न बाँधा जाएगा; और ऐसे व्यक्ति को कोई परेशान नहीं कर सकेगा, यहाँ तक कि जब वह संसार में रहता हो। फिर जब वह संसार से निकलता है, तब वह प्रतिरूपों में सत्य को पहले ही पा चुका होता है। संसार उसके लिए (अनन्त) युग बन गया है, क्योंकि (अनन्त) युग उसके लिए परिपूर्णता है। और यह ऐसा ही है: यह केवल उसी पर प्रकट होता है। यह अन्धकार और रात में छिपा नहीं है, बल्कि एक परिपूर्ण दिन और पवित्र प्रकाश में छिपा है।


    सुसमाचार


    फिलिप्पुस के अनुसार'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: chamber / bridal chamber
  choice: कक्ष / विवाह-कक्ष
  rationale: पहले वाक्य के सामान्य ‘कक्ष’ और बाद के विशिष्ट वैवाहिक प्रतीक ‘विवाह-कक्ष’ का भेद बनाए रखा गया है।
- source_word: mysteries
  choice: रहस्य
  rationale: अनुष्ठानिक अथवा गूढ़ आशय को किसी विशेष सम्प्रदाय की पारिभाषिक व्याख्या में सीमित किए बिना सुरक्षित रखता है।
- source_word: images
  choice: प्रतिरूपों
  rationale: ‘छवियों’ की अपेक्षा यहाँ मूल/सत्य के दृश्य या सांसारिक रूपों का दार्शनिक सम्बन्ध अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: (eternal) ages / (eternal) age
  choice: (अनन्त) युग / (अनन्त) युग
  rationale: गोल कोष्ठकों में दी गई व्याख्यात्मक पूर्ति को सुरक्षित रखते हुए एकवचन-बहुवचन का तनाव यथासम्भव बनाए रखा गया है।
- source_word: fullness
  choice: परिपूर्णता
  rationale: दार्शनिक-धार्मिक गहराई को बनाए रखने वाला सहज और तटस्थ हिन्दी पद है।
theological_decisions:
- issue: ‘विवाह-कक्ष की संतान’ का रहस्यात्मक अर्थ
  choice: शाब्दिक प्रतीकात्मक भाषा को बनाए रखा गया
  alternative: इसे ‘दीक्षित व्यक्ति’ या ‘उद्धार पाया हुआ व्यक्ति’ के रूप में स्पष्ट करना
  rationale: साक्ष्य स्वयं प्रतीक का अर्थ पूरी तरह नहीं खोलता; किसी सम्प्रदायगत व्याख्या को आरोपित नहीं किया गया।
- issue: प्रकाश पाने वाले का ‘दिखाई न देना’
  choice: ‘वह न दिखाई देगा, न बाँधा जाएगा’
  alternative: ‘उसे पहचाना या बन्दी नहीं बनाया जाएगा’
  rationale: अदृश्यता, पहचान से परे होने और आध्यात्मिक अबन्धन के बीच मूल अस्पष्टता को नहीं सुलझाया गया।
- issue: संसार का (अनन्त) युग बन जाना
  choice: विरोधाभासी कथन को ज्यों का त्यों रखा गया
  alternative: ‘संसार उसके लिए अनन्त लोक में बदल गया है’
  rationale: ‘world’ और ‘age(s)’ के सम्बन्ध को सरल बनाकर किसी निश्चित ब्रह्माण्ड-विज्ञान में नहीं बदला गया।
- issue: परिपूर्ण दिन में छिपा होना
  choice: ‘एक परिपूर्ण दिन और पवित्र प्रकाश में छिपा है’
  alternative: ‘प्रकट है’
  rationale: अन्तिम वाक्य के जानबूझकर प्रतीत होने वाले विरोधाभास—प्रकाश में छिपना—को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। पाण्डुलिपीय क्षति और सम्पादकीय पुनर्स्थापन बताने वाले वर्ग कोष्ठक, दीर्घविराम और गोल कोष्ठक मूल साक्ष्य के अनुसार सुरक्षित रखे गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष कॉप्टिक समीक्षा अभी लंबित होने के कारण अनिश्चित स्थानों पर अति-व्याख्या से बचा गया है।
