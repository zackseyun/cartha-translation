  yaml_path: translation/extra_canonical/epistle_to_diognetus/008.yaml
  text: 'For what human being at all had any knowledge of what God was before he came?


    Or do you accept the empty and senseless statements of those pretentious philosophers: some of whom said that God was fire (they call that God, to which they themselves shall go), and others water, and others some other of the elements created by God?


    And yet, if any of these statements is worthy of acceptance, any other created thing might just as well be made out to be God.


    No, all this is the trickery and deceit of magicians;


    and no one has either seen or recognized him, but he revealed himself.


    And he revealed (himself) by faith, whereby alone it is given to see God.


    For God, the Master and Creator of the universe, who made all things and arranged them in order, was found to be not only friendly toward humanity, but also long-suffering.


    And such indeed he always was, and is, and will be, kind and good and dispassionate and true, and he alone is good.


    And having conceived a great and unutterable plan, he communicated it to his Son alone.


    For so long as he kept and guarded his wise design as a mystery, he seemed to neglect us and to be careless about us.


    But when he revealed it through his beloved Son, and manifested the purpose that he had prepared from the beginning, he gave us all these gifts at once: participation in his benefits, and sight and understanding of (mysteries) which none of us ever would have expected.'
translation:
  language: hi
  text: 'आखिर उसके आने से पहले कौन मनुष्य जानता था कि परमेश्वर कैसा है?[a]


    या क्या तुम उन दंभी दार्शनिकों की खोखली और निरर्थक बातों को मानते हो? उनमें से कुछ ने कहा कि परमेश्वर आग है—वे उसी को परमेश्वर कहते हैं जिसमें वे स्वयं जाने वाले हैं—दूसरों ने पानी को परमेश्वर कहा, और कुछ ने परमेश्वर द्वारा रचे गए अन्य तत्त्वों में से किसी को।


    फिर भी, यदि इनमें से कोई बात मानने योग्य है, तो किसी भी दूसरी सृजी हुई वस्तु को उतनी ही आसानी से परमेश्वर ठहराया जा सकता है।


    नहीं, यह सब जादूगरों की ठगी और छल है।


    किसी मनुष्य ने न तो उसे देखा है, न पहचाना; बल्कि उसी ने अपने आपको प्रकट किया।


    और उसने विश्वास के द्वारा अपने आपको प्रकट किया, क्योंकि केवल विश्वास के द्वारा ही परमेश्वर को देखने की सामर्थ्य दी जाती है।[b]


    परमेश्वर, जो सारे जगत का स्वामी और सृष्टिकर्ता है, जिसने सब कुछ बनाया और सुव्यवस्थित किया, वह मनुष्यों के प्रति केवल प्रेमपूर्ण ही नहीं, बल्कि धीरजवन्त भी पाया गया।


    वास्तव में वह सदा ऐसा ही था, अब भी है और आगे भी रहेगा—कृपालु, भला, विकाररहित और सत्य; और केवल वही भला है।[c]


    उसने एक महान और अकथनीय योजना ठहराई और उसे केवल अपने पुत्र को बताया।


    जब तक उसने अपनी बुद्धिमान योजना को रहस्य बनाकर रखा और सुरक्षित रखा, तब तक ऐसा प्रतीत हुआ कि वह हमारी उपेक्षा करता और हमारी चिंता नहीं करता है।


    लेकिन जब उसने अपने प्रिय पुत्र के द्वारा उस योजना को प्रकट किया और उस उद्देश्य को स्पष्ट किया जिसे उसने आरम्भ से तैयार कर रखा था, तब उसने हमें ये सब वरदान एक साथ दे दिए—उसकी भलाई में सहभागी होना, और उन रहस्यों को देखना और समझना जिनकी हममें से किसी ने कभी आशा भी नहीं की होती।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके आने” का संदर्भ उपलब्ध अंग्रेज़ी साक्ष्य में स्पष्ट नहीं है; यह परमेश्वर के आत्म-प्रकाशन अथवा उसके पुत्र के आगमन की ओर संकेत कर सकता है। यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है।
    reason: वास्तविक सर्वनाम-संदर्भ की अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: यहाँ “देखना” शारीरिक दृष्टि के बजाय परमेश्वर को विश्वास से जानने और पहचानने का भाव रख सकता है।
    reason: रूपकात्मक/आध्यात्मिक अर्थ की सम्भावना स्पष्ट करना, बिना उसे एकमात्र अर्थ घोषित किए।
  - marker: c
    text: “विकाररहित” का अर्थ भावशून्य या उदासीन नहीं, बल्कि दूषित अथवा अनियंत्रित भावावेग से रहित है।
    reason: ‘dispassionate’ के संभावित भ्रामक हिन्दी अर्थ से बचाना।
  - marker: d
    text: “रहस्यों” शब्द अंग्रेज़ी साक्ष्य में कोष्ठकों में है, जिससे संकेत मिलता है कि यह अर्थ स्पष्ट करने के लिए संपादकीय पूर्ति हो सकती है।
    reason: साक्ष्य में दर्शाई गई पाठगत अनिश्चितता को प्रकाशित अनुवाद में बताना।
lexical_decisions:
- source_word: what God was
  choice: परमेश्वर कैसा है
  rationale: अंग्रेज़ी साक्ष्य के अस्तित्वगत-गुणात्मक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है; इसका आशय ‘परमेश्वर क्या वस्तु था’ नहीं है।
- source_word: elements
  choice: तत्त्व
  rationale: आग और पानी जैसे प्राचीन ब्रह्माण्ड-विज्ञान के मूल तत्त्वों के लिए उपयुक्त और बोधगम्य शब्द।
- source_word: quackery
  choice: ठगी
  rationale: झूठे कौशल और कपटपूर्ण दावे का भाव साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: long-suffering
  choice: धीरजवन्त
  rationale: मानवीय दुष्टता को लंबे समय तक सहने वाली ईश्वरीय सहनशीलता को केवल सामान्य ‘धैर्य’ से अधिक सटीकता से व्यक्त करता है।
- source_word: dispassionate
  choice: विकाररहित
  rationale: यहाँ उदासीनता नहीं, अनियंत्रित भावावेग अथवा दूषित वासना से रहित होने का भाव है।
- source_word: scheme / design / purpose
  choice: योजना / योजना / उद्देश्य
  rationale: अनुच्छेद में एक ही दिव्य अभिप्राय के विविध पहलुओं को स्वाभाविक हिन्दी में रखते हुए शब्दगत भिन्नता बनाए रखी गई है।
- source_word: participation in His benefits
  choice: उसकी भलाई में सहभागी होना
  rationale: केवल लाभ प्राप्त करने के बजाय ईश्वरीय उपकार में सहभागिता के अधिक गहरे भाव को सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसके आने’ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘उसके’ को यथावत रखा और टिप्पणी में संभावित संदर्भ बताया
  alternative: स्पष्ट रूप से ‘परमेश्वर के आने’ या ‘पुत्र के आने’ लिखना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में सर्वनाम अस्पष्ट है; स्रोत-भाषा समीक्षा लंबित होने के कारण इसे चुपचाप निश्चित करना उचित नहीं।
- issue: विश्वास के द्वारा परमेश्वर को देखना
  choice: ‘केवल विश्वास के द्वारा ही ... देखने की सामर्थ्य दी जाती है’
  alternative: ‘विश्वास ही परमेश्वर को दिखाता है’
  rationale: मूल साक्ष्य में दैवी प्रदान (‘it is given’) और विश्वास की अनन्यता दोनों को बनाए रखा गया है।
- issue: परमेश्वर का ‘मनुष्यों के प्रति प्रेमपूर्ण’ होना
  choice: ‘प्रेमपूर्ण’
  alternative: ‘मनुष्य-मित्र’
  rationale: प्राचीन philanthrōpos-सदृश भाव को सांप्रदायिक व्याख्या के बिना सहज आधुनिक हिन्दी में व्यक्त करता है।
- issue: रहस्यों की पूर्ति
  choice: अंतिम वाक्य में ‘उन रहस्यों’ को पाठ में स्पष्ट किया और फुटनोट लगाया
  alternative: कोष्ठकों में ‘(रहस्यों)’ रखना
  rationale: अंग्रेज़ी साक्ष्य के कोष्ठक संपादकीय पूर्ति सूचित करते हैं; हिन्दी में पठनीयता हेतु शब्द मुख्य पाठ में रखा गया, पर उसकी पाठगत स्थिति नहीं छिपाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक एकवचन संबोधन ‘तुम’, और गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित होने के कारण संदिग्ध स्थानों पर सावधानी और फुटनोट रखे गए हैं।
