lexical_decisions:
- source_word: practicing their religion / worship
  choice: उपासना करना / उपासना-पद्धति
  rationale: यहाँ विषय केवल सामान्य ‘धर्म का पालन’ नहीं, बल्कि परमेश्वर की आराधना की रीति है; ‘उपासना’ आधुनिक और स्पष्ट है।
- source_word: one God of the universe
  choice: समस्त विश्व का एकमात्र परमेश्वर
  rationale: ‘one’ के विशिष्ट दावे को स्पष्ट रखते हुए एकेश्वरवादी बल सुरक्षित रखा गया है।
- source_word: Master
  choice: स्वामी
  rationale: अधिकार और प्रभुता का भाव रखता है, जबकि ‘मालिक’ की अपेक्षा धार्मिक गद्य में अधिक गरिमापूर्ण है।
- source_word: senseless and deaf images
  choice: चेतनाहीन और बहरी मूर्तियाँ
  rationale: मूर्तियों की अनुभव एवं प्रत्युत्तर देने की असमर्थता से जुड़े दोनों विशेषणों को बनाए रखता है।
- source_word: whole burnt offerings
  choice: पूर्ण होमबलियाँ
  rationale: ऐसी बलि का संकेत देता है जो पूरी तरह जलाई जाती थी; केवल ‘होमबलि’ की अपेक्षा अंग्रेज़ी साक्ष्य का ‘whole’ भी व्यक्त होता है।
- source_word: participate in / receive the honor
  choice: उस सम्मान को ग्रहण करना
  rationale: अर्थ यह है कि मूर्तियाँ दिए गए सम्मान से लाभान्वित या उसमें सहभागी नहीं हो सकतीं; सहज हिन्दी में ‘ग्रहण’ यह असमर्थता व्यक्त करता है।
