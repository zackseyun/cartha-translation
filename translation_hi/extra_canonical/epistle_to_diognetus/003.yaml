  language: hi
  text: 'इसके बाद, मेरा विचार है कि तुम विशेष रूप से यह जानने को उत्सुक हो कि वे यहूदियों के समान रीति से उपासना क्यों नहीं करते।


    जहाँ तक यहूदी ऊपर बताई गई उपासना-पद्धति से दूर रहते हैं और यह दावा करते हैं कि वे समस्त विश्व के एकमात्र परमेश्वर का आदर करते और उसे अपना स्वामी मानते हैं, वहाँ तक वे ठीक करते हैं। पर जब वे पहले बताई गई बातों जैसी विधियों से उसकी उपासना करते हैं, तब वे पूरी तरह भूल करते हैं।[a]


    क्योंकि यूनानी जब चेतनाहीन और बहरी मूर्तियों को ये वस्तुएँ चढ़ाते हैं, तो अपनी मूर्खता प्रकट करते हैं। लेकिन यहूदी यह सोचकर इन्हें परमेश्वर को अर्पित करते हैं, मानो उसे इनकी आवश्यकता हो; इसलिए उन्हें इसे धार्मिक उपासना नहीं, बल्कि मूर्खता मानना चाहिए।


    जिसने आकाश, पृथ्वी और उनमें मौजूद सभी वस्तुओं को बनाया है, और जो हम सबको हमारी आवश्यकता की हर वस्तु देता है, उसे स्वयं उन वस्तुओं में से किसी की आवश्यकता नहीं हो सकती जिन्हें वह उन्हीं लोगों को देता है जो समझते हैं कि वे उसे कुछ दे रहे हैं।


    जो लोग सोचते हैं कि वे लहू, चरबी और पूर्ण होमबलियों[b] के द्वारा उसे बलि चढ़ा सकते और ऐसे सम्मानों से उसका आदर कर सकते हैं, वे मुझे उन लोगों से किसी भी तरह भिन्न नहीं लगते जो बहरी मूर्तियों के प्रति वैसा ही आदर दिखाते हैं। एक समूह उन वस्तुओं को भेंट चढ़ाना उचित समझता है जो उस सम्मान को ग्रहण ही नहीं कर सकतीं, और दूसरा उसे भेंट चढ़ाता है जिसे किसी वस्तु की आवश्यकता नहीं है।'
