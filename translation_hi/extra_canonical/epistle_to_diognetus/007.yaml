  source_fidelity: मुख्य तर्क और अनुक्रम सुरक्षित हैं, किन्तु मसौदे में प्रेषक और भेजे गए व्यक्ति के लिए सम्मानसूचक बहुवचन सर्वनामों का प्रयोग कई स्थानों पर संबंधों को अनावश्यक रूप से धुंधला करता है। ‘तत्त्वों’ के विषय में ‘गूढ़ नियम’ भी साक्ष्य के ‘mysteries’ को व्याख्यात्मक रूप से बदल देता है। संशोधन में एकवचन सर्वनामों से व्याकरणिक संबंध स्पष्ट किए गए हैं, जबकि पाठ की मसीही और पांडुलिपीय अस्पष्टताएँ यथावत रखी गई हैं।
