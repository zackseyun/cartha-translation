base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/007.yaml
  text: 'For it is no earthly discovery, as I said, that was entrusted to them. They are not concerned to guard any mortal invention so carefully, nor have they been entrusted with the administration of human mysteries.


    But truly, the Almighty Creator of the universe, the invisible God himself, planted among humanity from heaven the truth and the holy teaching that surpasses human understanding, and firmly fixed it in their hearts. He did this not, as anyone might imagine, by sending to humanity a subordinate, or an angel, or a ruler, or one of those who direct earthly affairs, or one of those entrusted with administration in heaven, but by sending the very Maker and Creator of the universe himself. Through him he made the heavens; through him he enclosed the sea within its proper boundaries; all the elements faithfully observe his mysteries; from him [the sun] has received even the measure of the day’s courses to keep; the moon obeys him when he commands her to shine by night; the stars obey him as they follow the course of the moon. Through him all things are ordered, bounded, and placed in subjection: the heavens and the things in the heavens, the earth and the things on the earth, the sea and the
    things in the sea, fire, air, the abyss, the things in the heights, the things in the depths, and the things between the two. Him he sent to them.


    Was he sent, do you think, as anyone might suppose, to establish a dominion and inspire fear and terror?


    Not so. But he sent him in gentleness [and] meekness, as a king might send his son who is a king. He sent him as God; he sent him as [a man] to humanity; he sent him as Savior, using persuasion, not force, for force is no attribute of God.


    He sent him to summon, not to persecute; he sent him in love, not in judgment.


    For he will send him in judgment, and who will endure his presence?


    ....[Do you not see] them thrown to wild beasts so that they may deny the Lord, and yet they are not overcome?


    Do you not see that the more of them are punished, the more others multiply?


    These do not look like the works of a human being; they are the power of God; they are proofs of his presence.'
translation:
  language: hi
  text: 'क्योंकि, जैसा मैंने कहा, उन्हें जो सौंपा गया है वह कोई सांसारिक खोज नहीं है। न वे किसी नश्वर मनुष्य की ईजाद की इतनी सावधानी से रक्षा करने में लगे हैं, और न उन्हें मानवीय रहस्यों का प्रबंध सौंपा गया है।


    बल्कि सच तो यह है कि विश्व के सर्वशक्तिमान सृष्टिकर्ता, स्वयं अदृश्य परमेश्वर ने स्वर्ग से मनुष्यों के बीच उस सत्य और पवित्र शिक्षा को स्थापित किया जो मनुष्य की समझ से परे है, और उसे उनके हृदयों में दृढ़ता से बसा दिया। उन्होंने ऐसा—जैसा कोई कल्पना कर सकता है—किसी अधीनस्थ, स्वर्गदूत, शासक, पृथ्वी के कामकाज का संचालन करनेवाले किसी अधिकारी, या स्वर्ग के प्रबंध का दायित्व पाए किसी जन को भेजकर नहीं किया, बल्कि स्वयं विश्व के रचयिता और सृष्टिकर्ता को भेजकर किया। उन्हीं के द्वारा उन्होंने आकाश बनाए; उन्हीं के द्वारा समुद्र को उसकी निर्धारित सीमाओं में बाँधा; सभी तत्त्व उनके गूढ़ नियमों का निष्ठापूर्वक पालन करते हैं; उन्हीं से [सूर्य] ने दिन की यात्राओं का नियत माप पाया है, जिसका वह पालन करता है; जब वे चंद्रमा को रात में चमकने की आज्ञा देते हैं, तो वह उनकी आज्ञा मानता है; और जब तारे चंद्रमा के मार्ग का अनुसरण करते हैं, तो वे भी उनकी आज्ञा मानते हैं। उन्हीं के द्वारा सब कुछ व्यवस्थित और सीमाबद्ध किया गया और अधीन रखा गया है—आकाश और जो कुछ आकाश में है, पृथ्वी और जो कुछ पृथ्वी पर है, समुद्र और जो
    कुछ समुद्र में है, अग्नि, वायु, अथाह गहराई, ऊँचाइयों की वस्तुएँ, गहराइयों की वस्तुएँ और इन दोनों के बीच की वस्तुएँ। उन्हीं को उन्होंने उनके पास भेजा।


    क्या तुम समझते हो कि उन्हें—जैसा कोई मान सकता है—प्रभुत्व स्थापित करने और भय व आतंक उत्पन्न करने के लिए भेजा गया था?


    नहीं। बल्कि उन्होंने उन्हें नम्रता [और] दीनता के साथ भेजा, जैसे कोई राजा अपने उस पुत्र को भेजे जो स्वयं राजा है। उन्होंने उन्हें परमेश्वर के रूप में भेजा; उन्होंने उन्हें [मनुष्य] के रूप में मनुष्यों के पास भेजा; उन्होंने उन्हें उद्धारकर्ता के रूप में भेजा—बल का प्रयोग करते हुए नहीं, बल्कि समझाते हुए, क्योंकि बल परमेश्वर का गुण नहीं है।


    उन्होंने उन्हें बुलाने के लिए भेजा, सताने के लिए नहीं; उन्होंने उन्हें प्रेम करते हुए भेजा, न्याय करने के लिए नहीं।


    क्योंकि वह उन्हें न्याय करने के लिए भेजेंगे, और उनकी उपस्थिति कौन सह सकेगा?


    …[क्या तुम नहीं देखते] कि उन्हें जंगली पशुओं के आगे फेंक दिया जाता है, ताकि वे प्रभु का इनकार कर दें, फिर भी वे पराजित नहीं होते?


    क्या तुम नहीं देखते कि उनमें से जितनों को दंड दिया जाता है, उतने ही अधिक दूसरे बढ़ते जाते हैं?


    ये किसी मनुष्य के काम नहीं लगते; ये परमेश्वर की सामर्थ्य हैं; ये उनकी उपस्थिति के प्रमाण हैं।'
