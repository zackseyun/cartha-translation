lexical_decisions:
- source_word: earthly discovery / mortal invention
  choice: सांसारिक खोज / नश्वर मनुष्य की ईजाद
  rationale: दो निकट लेकिन अलग अभिव्यक्तियों का भेद रखा गया; ‘ईजाद’ सामान्य आधुनिक हिन्दी में कृत्रिम मानवीय रचना का भाव देता है।
- source_word: dispensation / administration
  choice: प्रबंध
  rationale: यहाँ रहस्यों अथवा स्वर्गीय कार्यों की व्यवस्था और दायित्व का अर्थ है; ‘विधान’ अनावश्यक धर्म-सांप्रदायिक अर्थ ला सकता था।
- source_word: mysteries
  choice: रहस्य / गूढ़ नियम
  rationale: मानवीय mysteries के लिए ‘रहस्य’, जबकि तत्त्वों द्वारा माने जाने वाले divine mysteries के संदर्भ में प्राकृतिक व्यवस्था का संकेत देने हेतु ‘गूढ़ नियम’ चुना गया।
- source_word: Artificer and Creator
  choice: रचयिता और सृष्टिकर्ता
  rationale: दोनों समानांतर उपाधियों को बनाए रखा गया।
- source_word: abyss
  choice: अथाह गहराई
  rationale: आधुनिक पाठक के लिए स्पष्ट और गरिमामय प्राकृतिक-कॉस्मिक अर्थ।
- source_word: persuasion, not force
  choice: बल का प्रयोग करते हुए नहीं, बल्कि समझाते हुए
  rationale: विरोध को स्वाभाविक हिन्दी में रखा और coercion बनाम persuasion का भाव सुरक्षित किया।
- source_word: presence
  choice: उपस्थिति
  rationale: ‘आगमन’ से भावी आगमन की व्याख्या आरोपित हो सकती थी; witness की व्यापक ambiguity रखी गई।
theological_decisions:
- issue: प्रेषक परमेश्वर और भेजे गए जन के सर्वनाम
  choice: ‘उन्होंने/उन्हें’ के माध्यम से भेद बनाए रखते हुए भेजे गए जन की दिव्य उपाधियाँ ज्यों की त्यों रखीं
  alternative: स्पष्ट रूप से ‘पिता’ और ‘पुत्र’ नाम देना
  rationale: दिए गए पाठ में नाम स्पष्ट नहीं हैं; अतिरिक्त त्रित्ववादी शब्दावली जोड़े बिना मूल की उच्च मसीही धारणा और संबंधात्मक तनाव सुरक्षित रखा गया।
- issue: ‘as sending God’
  choice: ‘उन्हें परमेश्वर के रूप में भेजा’
  alternative: ‘परमेश्वर को भेजा’
  rationale: अंग्रेज़ी साक्ष्य की व्याकरणिक/धर्मवैज्ञानिक अस्पष्टता को यथासंभव बनाए रखा गया और पहचान को कमजोर नहीं किया गया।
- issue: ‘as [a man] unto men’ में पुनर्स्थापित पाठ
  choice: ‘[मनुष्य] के रूप में मनुष्यों के पास’
  alternative: कोष्ठक हटाकर निश्चित पाठ बनाना
  rationale: पांडुलिपीय पुनर्स्थापन का संकेत वर्ग कोष्ठकों सहित सुरक्षित रखा गया।
- issue: पहला आगमन प्रेम में, भावी प्रेषण न्याय में
  choice: ‘प्रेम करते हुए… न्याय करने के लिए नहीं’ और बाद में ‘न्याय करने के लिए भेजेंगे’
  alternative: ‘न्यायादेश सुनाने’ या ‘दंड देने’ जैसी अधिक विशिष्ट व्याख्या
  rationale: मूल का कालगत और धर्मवैज्ञानिक तनाव बिना सुलझाए रखा गया।
- issue: ‘force is no attribute of God’
  choice: ‘बल परमेश्वर का गुण नहीं है’
  alternative: इसे केवल धर्म-परिवर्तन की पद्धति तक सीमित करना
  rationale: लेखक का व्यापक कथन जस का तस रखा गया; कोई सांप्रदायिक स्पष्टीकरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सुबोध। उपलब्ध आधार प्रत्यक्ष यूनानी पाठ नहीं, बल्कि सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; इसलिए वर्ग कोष्ठक और दीर्घविराम द्वारा पाठ-क्षति/पुनर्स्थापन संकेत सुरक्षित रखे गए हैं। कोई फुटनोट नहीं जोड़ा गया, अतः मुख्य पाठ में फुटनोट-चिह्न भी नहीं हैं।
