  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  text: 'Come then, clear thyself of all the prepossessions which occupy thy mind, and throw off the habit which leadeth thee astray, and become a new man, as it were, from the beginning, as one who would listen to a new story, even as thou thyself didst confess. See not only with thine eyes, but with thine intellect also, of what substance or of what form they chance to be whom ye call and regard as gods.


    Is not one of them stone, like that which we tread under foot, and another bronze, no better than the vessels which are forged for our use, and another wood, which has already become rotten, and another silver, which needs a man to guard it lest it be stolen, and another iron, which is corroded with rust, and another earthenware, not a whit more comely than that which is supplied for the most dishonorable service?


    Are not all these of perishable matter? Are they not forged by iron and fire? Did not the sculptor make one, and the brass-founder another, and the silversmith another, and the potter another? Before they were molded into this shape by the crafts of these several artificers, was it not possible for each one of them to have been changed in form and made to resemble these several utensils? Might not the vessels which are now made out of the same material, if they met with the same artificers, be made like unto such as these?


    Could not these things which are now worshipped by you, by human hands again be made vessels like the rest? Are not they all deaf and blind, are they not soul-less, senseless, motionless? Do they not all rot and decay?


    These things ye call gods, to these ye are slaves, these ye worship; and ye end by becoming altogether like unto them.


    Therefore ye hate the Christians, because they do not consider these to be gods.


    For do not ye yourselves, who now regard and worship them, much more despise them? Do ye not much rather mock and insult them, worshipping those that are of stone and earthenware unguarded, but shutting up those that are of silver and gold by night, and setting guards over them by day, to prevent their being stolen?


    And as for the honors which ye think to offer to them, if they are sensible of them, ye rather punish them thereby, whereas, if they are insensible, ye reproach them by propitiating them with the blood and fat of victims.


    Let one of yourselves undergo this treatment, let him submit to these things being done to him. Nay, not so much as a single individual will willingly submit to such punishment, for he has sensibility and reason; but a stone submits, because it is insensible Therefore ye convict his sensibility.


    Well, I could say much besides concerning the Christians not being enslaved to such gods as these; but if any one should think what has been said insufficient, I hold it superfluous to say more.'
