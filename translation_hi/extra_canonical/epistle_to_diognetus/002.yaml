  yaml_path: translation/extra_canonical/epistle_to_diognetus/002.yaml
  text: 'Come, then, clear your mind of all the preconceptions that occupy it, throw off the habit that leads you astray, and become, as it were, a new person from the beginning—someone ready to hear a new account, just as you yourself confessed. Look not only with your eyes but also with your understanding at the substance and form of those whom you call and regard as gods.


    Is not one of them stone, like what we tread underfoot, and another bronze, no better than the vessels forged for our use; another wood, which has already rotted; another silver, which needs someone to guard it so that it is not stolen; another iron, which is corroded by rust; and another earthenware, no more attractive than what is supplied for the most dishonorable service?


    Are not all these made of perishable material? Are they not fashioned by iron and fire? Did not the sculptor make one, the bronze-worker another, the silversmith another, and the potter another? Before they were molded into these shapes by the skills of these various craftspeople, could not each of them have been reshaped and made to resemble these various utensils? Could not the vessels now made from the same material, if they came into the hands of the same craftspeople, be made like these gods?


    Could not these things that you now worship be made again by human hands into vessels like the rest? Are they not all deaf and blind? Are they not without souls, without senses, and motionless? Do they not all rot and decay?


    These things you call gods; to these you are servants; these you worship; and you end up becoming altogether like them.


    Therefore you hate the Christians because they do not consider these things to be gods.


    For do not you yourselves, who now regard and worship them, despise them much more? Do you not rather mock and insult them by leaving those made of stone and earthenware unguarded, while locking up those made of silver and gold at night and setting guards over them by day to prevent them from being stolen?


    As for the honors you think you offer them, if they can perceive them, you actually punish them by these honors; but if they cannot perceive them, you reproach them by trying to appease them with the blood and fat of sacrificial victims.


    Let one of you undergo this treatment; let him submit to having these things done to him. No, not even a single person would willingly submit to such punishment, because he has feeling and reason. But a stone submits because it has no feeling. Therefore you convict its sensibility.


    Well, I could say much more about the Christians not being enslaved to gods such as these. But if anyone considers what has been said insufficient, I think it unnecessary to say more.'
translation:
  language: hi
  text: 'तो आओ, अपने मन को उन सभी पूर्वधारणाओं से खाली कर दो जिन्होंने उसे घेर रखा है। उस आदत को उतार फेंको जो तुम्हें भटका रही है, और मानो आरम्भ से ही एक नया मनुष्य बन जाओ—ऐसा मनुष्य जो एक नया वृत्तांत सुनने को तैयार हो, जैसा कि तुमने स्वयं स्वीकार किया था। जिन्हें तुम देवता कहते और मानते हो, उन्हें केवल अपनी आँखों से ही नहीं, बल्कि अपनी बुद्धि से भी देखो कि वे किस पदार्थ के बने हैं और उनका रूप कैसा है।


    क्या उनमें से एक पत्थर का नहीं है—उसी पत्थर का जिसे हम पैरों तले रौंदते हैं? दूसरा काँसे का है, और उन बर्तनों से तनिक भी उत्तम नहीं जो हमारे उपयोग के लिए ढाले जाते हैं। कोई लकड़ी का है, जो पहले ही सड़ चुकी है; कोई चाँदी का, जिसकी रखवाली के लिए मनुष्य चाहिए ताकि वह चोरी न हो जाए; कोई लोहे का, जिसे जंग खा रही है; और कोई मिट्टी का, जो उन बर्तनों से तनिक भी अधिक शोभनीय नहीं जिन्हें अत्यन्त अपमानजनक कामों के लिए रखा जाता है।


    क्या ये सभी नाशवान पदार्थ से नहीं बने हैं? क्या इन्हें लोहे के औज़ारों और आग से गढ़ा नहीं गया? क्या एक को मूर्तिकार ने, दूसरे को काँसे के कारीगर ने, तीसरे को सुनार ने और चौथे को कुम्हार ने नहीं बनाया? विभिन्न कारीगरों के कौशल से इन्हें यह रूप दिए जाने से पहले, क्या इनमें से प्रत्येक का रूप बदलकर उसे उन भिन्न-भिन्न बर्तनों जैसा नहीं बनाया जा सकता था? और जो बर्तन अब उसी पदार्थ से बने हैं, यदि वे उन्हीं कारीगरों के हाथ लगें, तो क्या उन्हें इन देवताओं जैसा नहीं बनाया जा सकता?


    जिन वस्तुओं की तुम अब उपासना करते हो, क्या मनुष्य के हाथ उन्हें फिर से अन्य बर्तनों जैसा नहीं बना सकते? क्या वे सभी बहरे और अन्धे नहीं हैं? क्या वे प्राणहीन, संवेदनहीन और गतिहीन नहीं हैं? क्या वे सभी सड़ते और नष्ट नहीं होते?


    इन्हीं वस्तुओं को तुम देवता कहते हो; इन्हीं के दास बनते हो; इन्हीं की उपासना करते हो; और अन्त में पूरी तरह इन्हीं जैसे हो जाते हो।


    इसीलिए तुम मसीहियों से घृणा करते हो, क्योंकि वे इन वस्तुओं को देवता नहीं मानते।


    पर क्या तुम स्वयं—जो इन्हें देवता मानते और इनकी उपासना करते हो—इनका और भी अधिक तिरस्कार नहीं करते? क्या तुम इनका उपहास और अपमान नहीं करते, क्योंकि पत्थर और मिट्टी से बनी मूर्तियों को तो बिना पहरे के छोड़ देते हो, पर चाँदी और सोने से बनी मूर्तियों को रात में ताले में बन्द रखते और दिन में उन पर पहरेदार बैठाते हो, ताकि वे चोरी न हो जाएँ?


    और जिन सम्मानों को तुम समझते हो कि तुम उन्हें अर्पित कर रहे हो—यदि वे उन्हें अनुभव कर सकती हैं, तो इन सम्मानों से तुम वास्तव में उन्हें यातना देते हो; पर यदि वे अनुभव नहीं कर सकतीं, तो बलि-पशुओं के रक्त और चर्बी से उन्हें प्रसन्न करने का प्रयत्न करके उनका अपमान करते हो।


    तुममें से कोई अपने साथ ऐसा व्यवहार होने दे; वह स्वीकार करे कि उसके साथ ये सब काम किए जाएँ। नहीं, एक भी मनुष्य ऐसी यातना स्वेच्छा से नहीं सहेगा, क्योंकि उसमें संवेदना और बुद्धि है। पर पत्थर सब सह लेता है, क्योंकि उसमें कोई संवेदना नहीं। इस प्रकार तुम उसकी संवेदना को सिद्ध करते हो![a]


    मसीही ऐसे देवताओं के दास नहीं हैं—इस विषय में मैं और भी बहुत कुछ कह सकता हूँ। पर यदि कोई अब तक कही गई बातों को अपर्याप्त समझे, तो मुझे और कहना व्यर्थ लगता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध अंग्रेज़ी साक्षी में शाब्दिक अर्थ है, “इस प्रकार तुम उसकी संवेदना को सिद्ध करते हो।” यह पिछले वाक्य—पत्थर में संवेदना नहीं है—से तनाव में है। सम्भव है कि पाठ या अनुवाद में कठिनाई हो; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: साक्षी के कठिन और सम्भवतः विकृत पाठ को बिना सूचना अर्थानुकूल बदलने से बचाना।
lexical_decisions:
- source_word: prepossessions
  choice: पूर्वधारणाएँ
  rationale: मन में पहले से जमी मान्यताओं का अर्थ स्पष्ट और आधुनिक हिन्दी में व्यक्त होता है।
- source_word: intellect
  choice: बुद्धि
  rationale: आँखों से देखने के विपरीत विवेकपूर्ण मानसिक परीक्षण का भाव सुरक्षित रहता है।
- source_word: substance
  choice: पदार्थ
  rationale: मूर्तियों की भौतिक सामग्री पर लेखक के तर्क को प्रत्यक्ष रखता है।
- source_word: new man
  choice: नया मनुष्य
  rationale: रूपक की शक्ति बनाए रखते हुए इसे केवल ‘नई सोच’ में सीमित नहीं किया गया।
- source_word: soul-less, senseless, motionless
  choice: प्राणहीन, संवेदनहीन और गतिहीन
  rationale: तीन अलग आरोपों की समानान्तर संरचना और अर्थभेद सुरक्षित हैं।
- source_word: victims
  choice: बलि-पशु
  rationale: यहाँ हिंसा के सामान्य पीड़ित नहीं, धार्मिक बलि में चढ़ाए गए पशु अभिप्रेत हैं।
- source_word: servants / enslaved
  choice: दास / दास बनना
  rationale: मूल विवाद की कठोर दासता-संबंधी भाषा को नरम किए बिना रखा गया है।
theological_decisions:
- issue: मूर्तियों को ‘देवता’ कहने की भाषा
  choice: लेखक के वादात्मक संदर्भ में ‘देवता’ शब्द बनाए रखा
  alternative: ‘कथित देवता’ या हर बार उद्धरण-चिह्न लगाना
  rationale: लेखक स्वयं बाद में उनके देवत्व का खण्डन करता है; अतिरिक्त विशेषण जोड़ने से मूल की विडम्बना को अनावश्यक रूप से स्पष्ट कर दिया जाता।
- issue: अन्तिम संवेदना-वाक्य का आन्तरिक तनाव
  choice: ‘इस प्रकार तुम उसकी संवेदना को सिद्ध करते हो’ का प्रत्यक्ष अनुवाद और पादटिप्पणी
  alternative: अर्थ-सुधार करके ‘असंवेदनशीलता सिद्ध करते हो’
  rationale: उपलब्ध अंग्रेज़ी साक्षी में पाठ पूर्ववर्ती वाक्य से तनावपूर्ण है। यूनानी स्रोत की समीक्षा लंबित होने के कारण कठिन पाठ को चुपचाप सुधारा नहीं गया।
- issue: मसीहियों और उपासकों की तुलना
  choice: दासता और उपासना की स्पष्ट आलोचनात्मक भाषा सुरक्षित रखी
  alternative: ‘अनुयायी’ जैसी नरम भाषा
  rationale: लेखक का धार्मिक और नैतिक तर्क इसी तीखे विरोध पर निर्भर है; किसी सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। लम्बे आलंकारिक प्रश्नों को पठनीय वाक्यों में बाँटा गया, पर तर्क की क्रमिकता और तीखापन बनाए रखा गया। ‘तुम’ का प्रयोग एकवचन सम्बोधन और सामूहिक श्रोताओं के बीच मूल साक्षी में होने वाले परिवर्तन को हिन्दी में स्वाभाविक रूप से वहन करता है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी पर आधारित अस्थायी स्रोत-समीक्षित प्रस्तुति है; यूनानी स्रोत की प्रत्यक्ष समीक्षा लंबित है।
