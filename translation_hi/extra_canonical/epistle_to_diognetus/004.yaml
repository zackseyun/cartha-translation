base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/004.yaml
  text: 'But again their scruples concerning food, and their superstition relating to the Sabbath, and the vanity of their circumcision, and the pretense of their fasting and new moons, I do [not] suppose you need to learn from me, are ridiculous and unworthy of any consideration.


    For to receive some of the things created by God for human use as created well, but to decline others as useless and superfluous, is not this impious?


    And again, to lie against God, as if he forbade us to do any good thing on the Sabbath day, is not this profane?


    Again, to boast of the mutilation of the flesh as a token of election, as though for this reason they were particularly beloved by God, is not this ridiculous?


    And to watch the stars and the moon and to keep the observance of months and days, and to distinguish the arrangements of God and the changes of the seasons according to their own impulses, making some into festivals and others into times of mourning, who would regard this as an exhibition of godliness and not much more of folly?


    That the Christians are right, therefore, in holding aloof from the common silliness and error of the Jews, and from their excessive fussiness and pride, I consider that you have been sufficiently instructed; but as regards the mystery of their own religion, do not expect that you can be instructed by man.'
translation:
  language: hi
  text: 'फिर, भोजन के विषय में उनके संकोच, सब्त से जुड़ा उनका अंधविश्वास, उनके खतने का खोखलापन, और उनके उपवासों तथा नवचंद्र-पर्वों का दिखावा—ये सब हास्यास्पद और विचार करने योग्य भी नहीं हैं; यह बात, मेरा खयाल है, तुम्हें मुझसे सीखने की [नहीं][a] आवश्यकता है।


    क्योंकि परमेश्वर ने मनुष्य के उपयोग के लिए जो वस्तुएँ रची हैं, उनमें से कुछ को अच्छी सृष्टि मानकर ग्रहण करना, पर दूसरी वस्तुओं को बेकार और अनावश्यक समझकर ठुकरा देना—क्या यह परमेश्वर के प्रति अनादर नहीं है?


    और परमेश्वर के विषय में यह झूठ कहना कि उसने हमें सब्त के दिन कोई भी भला काम करने से मना किया है—क्या यह अपवित्र बात नहीं है?


    फिर, शरीर को काटे जाने पर चुनाव के चिह्न के रूप में घमंड करना, मानो इसी कारण वे परमेश्वर को विशेष रूप से प्रिय हों—क्या यह हास्यास्पद नहीं है?


    और तारों तथा चंद्रमा पर नज़र रखना, महीनों और दिनों का पालन करना, और अपनी ही इच्छा के अनुसार परमेश्वर की ठहराई हुई व्यवस्थाओं और ऋतुओं के परिवर्तनों में भेद करके कुछ को उत्सव और कुछ को शोक का समय बना देना—इसे कौन ईश्वर-भक्ति का प्रदर्शन मानेगा, न कि उससे कहीं अधिक मूर्खता का?


    इसलिए मैं समझता हूँ कि तुम्हें पर्याप्त रूप से बता दिया गया है कि मसीही यहूदियों की आम मूर्खता और भूल से, और नियमों की छोटी-छोटी बातों में उनके अत्यधिक उलझाव तथा घमंड से दूर रहकर ठीक करते हैं। लेकिन उनकी अपनी ईश्वर-भक्ति के रहस्य के विषय में यह आशा मत रखना कि कोई मनुष्य तुम्हें उसकी शिक्षा दे सकता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नहीं’ उपलब्ध अंग्रेज़ी साक्ष्य में कोष्ठकों के भीतर पाठ-सुधार के रूप में दिया गया है; इसके बिना वाक्य का आशय उलट जाता है। प्रत्यक्ष यूनानी पाठ की समीक्षा अभी लंबित है।
    reason: पाठगत पुनर्स्थापन और स्रोत-साक्ष्य की सीमा को पारदर्शी रखना।
lexical_decisions:
- source_word: scruples concerning meats
  choice: भोजन के विषय में उनके संकोच
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में धार्मिक भोजन-विवेक या परहेज़ का भाव है; ‘संकोच’ सामान्य पाठक के लिए स्वाभाविक है और किसी विशिष्ट आहार-विधि को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: superstition relating to the Sabbath
  choice: सब्त से जुड़ा उनका अंधविश्वास
  rationale: लेखक की तीखी आलोचनात्मक भाषा को बिना नरम किए रखा गया है; ‘सब्त’ ऐतिहासिक धार्मिक पद है।
- source_word: vanity of their circumcision
  choice: उनके खतने का खोखलापन
  rationale: ‘खोखलापन’ यहाँ लेखक के अनुसार दावे की निरर्थकता व्यक्त करता है; अगले अनुच्छेद में शारीरिक क्रिया का स्पष्ट उल्लेख बना रहता है।
- source_word: dissimulation / pretense of their fasting and new moons
  choice: उनके उपवासों तथा नवचंद्र-पर्वों का दिखावा
  rationale: ‘दिखावा’ बाहरी धर्म-प्रदर्शन या कपट का भाव देता है। ‘नवचंद्र-पर्व’ केवल खगोलीय घटना नहीं, उसके धार्मिक पालन को सूचित करता है।
- source_word: token of election
  choice: चुनाव के चिह्न
  rationale: ‘चुनाव’ परमेश्वर द्वारा चुने जाने की धार्मिक धारणा को खुला रखता है; ‘चुने हुए होने का प्रमाण’ कहने से दावे को अधिक निश्चित बना दिया जाता।
- source_word: excessive fussiness
  choice: नियमों की छोटी-छोटी बातों में उनका अत्यधिक उलझाव
  rationale: शाब्दिक ‘अत्यधिक झंझट’ की अपेक्षा यह धार्मिक सूक्ष्मताओं में व्यस्तता का आशय सहज हिन्दी में स्पष्ट करता है।
- source_word: mystery of their own religion
  choice: उनकी अपनी ईश्वर-भक्ति का रहस्य
  rationale: ‘ईश्वर-भक्ति’ प्रसंग में जीवन और उपासना की धार्मिक रीति दोनों को समेटता है; ‘रहस्य’ की जानबूझकर अनावृत्त न की गई प्रकृति सुरक्षित है।
theological_decisions:
- issue: सब्त पर भला काम करने की मनाही
  choice: लेखक के आरोप को कथन के बजाय आलंकारिक प्रश्न के रूप में रखा गया
  alternative: यह कहना कि यहूदी व्यवस्था सचमुच हर भले काम को निषिद्ध करती थी
  rationale: मूल साक्ष्य लेखक की विवादात्मक व्याख्या प्रस्तुत करता है; अनुवाद उसे स्वतंत्र ऐतिहासिक या धर्मशास्त्रीय तथ्य के रूप में प्रमाणित नहीं करता।
- issue: खतना और चुनाव
  choice: ‘चुनाव के चिह्न’ और ‘मानो’ दोनों बनाए रखे गए
  alternative: ‘उद्धार का प्रमाण’
  rationale: पाठ चुनाव की बात करता है, उद्धार की नहीं; ‘मानो’ लेखक की आलोचनात्मक दूरी बनाए रखता है।
- issue: मनुष्य से धार्मिक रहस्य की शिक्षा
  choice: अंतिम निषेध को पूर्ण और रहस्यमय रूप में रहने दिया गया
  alternative: यह स्पष्ट जोड़ना कि केवल परमेश्वर ही सिखा सकता है
  rationale: यह निष्कर्ष संदर्भ से संभव है, पर दिए गए पाठ में स्पष्ट नहीं कहा गया; इसलिए उसे जोड़ा नहीं गया।
- issue: यहूदियों के विषय में कठोर सामूहिक भाषा
  choice: प्राचीन लेखक की विवादात्मक भाषा को स्पष्ट रूप से अनूदित किया गया
  alternative: आलोचना को सामान्य धार्मिक पाखंड की आलोचना में बदल देना
  rationale: ऐतिहासिक पाठ की असुविधाजनक तीक्ष्णता को छिपाना उचित नहीं; साथ ही अनुवाद में उससे भी अधिक अपमानजनक आधुनिक शब्दावली नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। लेखक की तीखी यहूदी-विरोधी विवादात्मक वाणी को न तो छिपाया गया है, न बढ़ाया गया है। यह प्रारूप दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है, क्योंकि प्रत्यक्ष यूनानी स्रोत-परीक्षण लंबित बताया गया है; अतः यूनानी शब्दावली के बारे में अप्रमाणित निश्चितता से बचा गया है।
