review_pass:
  verdict: revise
  source_fidelity: 'मसौदा उपलब्ध अंग्रेज़ी साक्ष्य के अर्थ और अनुच्छेद-विन्यास को अधिकांशतः ठीक रखता है तथा ‘वचन’, ‘कलीसिया’, ‘कृपा’ और ‘गैर-यहूदी’ जैसे प्रमुख पद सुसंगत हैं। फिर भी कुछ स्थानों पर स्रोतार्थ या उसकी जानबूझकर रखी गई अनिश्चितता बदलती है: आरम्भ में ‘discourses’ को ‘शिक्षाएँ’ और ‘perverse questionings’ को केवल ‘प्रश्न’ कहना कम सटीक है; ‘revealed ... to the disciples’ का ‘शिष्यों पर ... प्रकट’ अप्राकृतिक और दिशासूचक रूप से गलत है; ‘pledges’ को ‘धरोहरें’ कहकर फिर उन्हें ‘तोड़ना’ अर्थ और रूपक दोनों में असंगत हो जाता है; तथा ‘those whom He desires’ में ‘अपने चुने हुए लोगों’ जोड़ना स्रोत में नहीं है। प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण संशोधन अंग्रेज़ी सार्वजनिक-डोमेन साक्ष्य तक सीमित है।'
  naturalness: गरिमापूर्ण आधुनिक हिन्दी का स्तर अच्छा है, किंतु ‘विकृत प्रश्न’, ‘शिष्यों पर ... प्रकट’, ‘धरोहरों को तोड़ते’, और ‘अपने चुने हुए लोगों के मुख से’ जैसे प्रयोग या तो अस्वाभाविक हैं या अर्थ बढ़ाते हैं। संशोधित पाठ में इन्हें सहज, आधुनिक और स्रोत-समीप हिन्दी में बदला गया है।
  terminology: ‘वचन’, ‘प्रेरित’, ‘भेद’, ‘कलीसिया’, ‘कृपा’, ‘व्यवस्था’ और ‘सुसमाचार’ उपयुक्त हैं। ‘विश्वास की प्रतिज्ञाएँ’ अंग्रेज़ी witness के ‘pledges of faith’ को ‘धरोहरें’ की अपेक्षा अधिक सीधा रखता है। ‘पूर्वजों द्वारा निर्धारित सीमाएँ’ ‘boundaries of the fathers’ के रूपक को बनाए रखता है, बिना किसी बाद की सम्प्रदायगत पहचान के।
  issues:
  - severity: medium
    issue: आरम्भिक ‘discourses’ और ‘perverse questionings’ का अर्थ संकुचित है।
    rationale: ‘मेरी शिक्षाएँ’ मूल के ‘no strange discourses’ की अपेक्षा अधिक शिक्षणात्मक है, और ‘विकृत प्रश्न’ विवादपूर्ण/कुटिल तर्क-वितर्क की बारीकी खो देता है।
