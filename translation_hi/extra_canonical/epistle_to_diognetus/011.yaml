  revised_text: 'मेरे विचार-विमर्श न तो अनोखे हैं, न मेरे तर्क-वितर्क कुटिल हैं। बल्कि मैं प्रेरितों का शिष्य रहा हूँ और अब गैर-यहूदियों का शिक्षक बनकर सामने आता हूँ। जो लोग अपने आपको सत्य के शिष्य के रूप में प्रस्तुत करते हैं, उन्हें मैं योग्य रीति से वे शिक्षाएँ प्रदान करता हूँ जो सौंप दी गई हैं।


    क्योंकि ऐसा कौन है जिसने ठीक रीति से शिक्षा पाई हो और वचन के साथ मित्रता में आया हो, फिर भी उन शिक्षाओं को स्पष्ट रूप से जानना न चाहे जिन्हें वचन ने शिष्यों को खुले तौर पर प्रकट किया? वचन उनके सामने प्रकट हुआ और उसने साफ-साफ बोलकर उन्हें ये बातें बताईं। अविश्वासियों ने उसे नहीं पहचाना; पर उसने इन्हें उन शिष्यों को बताया जिन्हें उसने विश्वासयोग्य माना और जिन्हें पिता के भेद सिखाए गए।


    इसी कारण उसने वचन को भेजा, ताकि वह संसार के सामने प्रकट हो। लोगों ने उसका अपमान किया, प्रेरितों ने उसका प्रचार किया और गैर-यहूदियों ने उस पर विश्वास किया।


    यही वह वचन है जो आरम्भ से था, जो नया दिखाई दिया, फिर भी प्राचीन सिद्ध हुआ, और जो पवित्र जनों के हृदयों में सदा युवा रूप में उत्पन्न होता है।


    वही, मैं कहता हूँ, अनन्त है; आज वह पुत्र माना गया।[a] उसी के द्वारा कलीसिया समृद्ध होती है और पवित्र जनों के बीच कृपा खुलकर प्रकट होती और बढ़ती जाती है—वह कृपा जो समझ देती है, भेद प्रकट करती है, समयों की घोषणा करती है,[b] विश्वासयोग्य लोगों पर आनन्दित होती है और खोजने वालों को दी जाती है—अर्थात उन्हें जो विश्वास की प्रतिज्ञाओं को नहीं तोड़ते और पूर्वजों द्वारा निर्धारित सीमाओं को नहीं लाँघते।[c]


    इसी से व्यवस्था के भय का गुणगान होता है, भविष्यद्वक्ताओं की कृपा पहचानी जाती है, सुसमाचारों का विश्वास दृढ़ होता है, प्रेरितों की परम्परा सुरक्षित रहती है और कलीसिया का आनन्द उमड़ पड़ता है।


    यदि तुम इस कृपा को दुःखी नहीं करोगे, तो उन शिक्षाओं को समझोगे जिन्हें वचन, जब चाहता है, जिनके मुख से चाहता है, कहता है।


    क्योंकि आज्ञा देने वाले वचन की इच्छा से जिन सब बातों को कहने के लिए हम बहुत परिश्रम के साथ प्रेरित हुए, उनमें हम तुम्हारे साथ सहभागी बनते हैं—उन बातों के प्रेम के कारण जो हम पर प्रकट की गई हैं।'
