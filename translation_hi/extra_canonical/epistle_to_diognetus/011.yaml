base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/011.yaml
  text: 'My teachings are not strange, nor are my questions perverse. Rather, having been a disciple of Apostles, I come forward as a teacher of the Gentiles, worthily presenting to those who offer themselves as disciples of the truth the lessons that have been handed down.


    For who, having been rightly taught and having entered into friendship with the Word, does not seek to learn clearly the lessons openly revealed by the Word to the disciples? The Word appeared to them and declared these lessons, speaking plainly. He was not perceived by the unbelieving, but related them to disciples who, being counted faithful by Him, were taught the mysteries of the Father.


    For this reason He sent forth the Word, so that He might appear to the world. Though He was dishonored by the people and preached by the Apostles, He was believed in by the Gentiles.


    This Word, who was from the beginning, who appeared as new and yet was shown to be old, and who is always engendered young in the hearts of saints,


    He, I say, is eternal. Today He was accounted a Son. Through Him the Church is enriched, and grace is unfolded and multiplied among the saints: grace that gives understanding, reveals mysteries, announces seasons, rejoices over the faithful, and is bestowed on those who seek her—those by whom the pledges of faith are not broken and the boundaries of the fathers are not overstepped.


    Therefore the fear of the law is sung, the grace of the prophets is recognized, the faith of the gospels is established, the tradition of the apostles is preserved, and the joy of the Church exults.


    If you do not grieve this grace, you will understand the teachings that the Word delivers through the mouths of those whom He desires, when He wishes.


    For in everything that, by the will of the commanding Word, we were moved to utter with great effort, we become sharers with you through love for the things revealed to us.'
translation:
  language: hi
  text: 'मेरी शिक्षाएँ न तो अनोखी हैं, न मेरे प्रश्न विकृत। बल्कि मैं प्रेरितों का शिष्य रहा हूँ और अब गैर-यहूदियों का शिक्षक बनकर सामने आता हूँ। जो लोग अपने आपको सत्य के शिष्य के रूप में प्रस्तुत करते हैं, उन्हें मैं योग्य रीति से वे शिक्षाएँ देता हूँ जो हमें सौंपी गई हैं।


    क्योंकि ऐसा कौन है जिसने ठीक रीति से शिक्षा पाई हो और वचन के साथ मित्रता में आया हो, फिर भी वह उन शिक्षाओं को स्पष्ट रूप से जानना न चाहे जिन्हें वचन ने शिष्यों पर खुले तौर पर प्रकट किया? वचन उनके सामने प्रकट हुआ और उसने साफ-साफ बोलकर उन्हें ये बातें बताईं। अविश्वासियों ने उसे नहीं पहचाना; पर उसने इन्हें उन शिष्यों को बताया जिन्हें उसने विश्वासयोग्य माना और जिन्हें पिता के भेद सिखाए गए।


    इसी कारण उसने वचन को भेजा, ताकि वह संसार के सामने प्रकट हो। लोगों ने उसका अपमान किया, प्रेरितों ने उसका प्रचार किया और गैर-यहूदियों ने उस पर विश्वास किया।


    यही वह वचन है जो आरम्भ से था, जो नया दिखाई दिया, फिर भी प्राचीन सिद्ध हुआ, और जो पवित्र जनों के हृदयों में सदा युवा होकर जन्म लेता है।


    वही, मैं कहता हूँ, अनन्त है; आज वह पुत्र माना गया।[a] उसी के द्वारा कलीसिया समृद्ध होती है और पवित्र जनों के बीच कृपा खुलकर प्रकट होती और बढ़ती जाती है—वह कृपा जो समझ देती है, भेद प्रकट करती है, समयों की घोषणा करती है,[b] विश्वासयोग्य लोगों पर आनन्दित होती है और खोजने वालों को दी जाती है—अर्थात उन्हें जो विश्वास की धरोहरों को नहीं तोड़ते और पूर्वजों की ठहराई सीमाओं को नहीं लाँघते।[c]


    इसी से व्यवस्था के भय का गुणगान होता है, भविष्यद्वक्ताओं की कृपा पहचानी जाती है, सुसमाचारों का विश्वास दृढ़ होता है, प्रेरितों की परम्परा सुरक्षित रहती है और कलीसिया का आनन्द उमड़ पड़ता है।


    यदि तुम इस कृपा को दुःखी न करोगे, तो उन शिक्षाओं को समझोगे जिन्हें वचन अपनी इच्छा के अनुसार, जब चाहता है, अपने चुने हुए लोगों के मुख से सुनाता है।


    क्योंकि आज्ञा देने वाले वचन की इच्छा से जिन सब बातों को कहने के लिए हम बहुत परिश्रम के साथ प्रेरित हुए, उनमें हम तुम्हारे सहभागी बनते हैं—उन बातों के प्रेम के कारण जो हम पर प्रकट की गई हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आज वह पुत्र माना गया” मूल साक्ष्य में भी कठिन और संक्षिप्त कथन है। अनुवाद इसे जन्म, दत्तकत्व या केवल सार्वजनिक प्रकटीकरण के किसी एक अर्थ तक सीमित नहीं करता।
    reason: वास्तविक धर्मवैज्ञानिक और भाषिक अस्पष्टता को पाठक के सामने बनाए रखना।
  - marker: b
    text: “समयों” से नियत काल, युग या अवसर अभिप्रेत हो सकते हैं।
    reason: उपलब्ध साक्ष्य का बहुअर्थी temporal शब्द किसी एक अर्थ में सीमित नहीं है।
  - marker: c
    text: “पूर्वजों की ठहराई सीमाएँ” सौंपे गए विश्वास और प्राचीन शिक्षकीय परम्परा की मान्य मर्यादाओं का रूपक है।
    reason: ऐतिहासिक रूपक को स्पष्ट करना, बिना किसी बाद की विशिष्ट सम्प्रदायगत परम्परा से उसकी पहचान किए।
lexical_decisions:
- source_word: Word (Greek source term likely λόγος; direct review pending)
  choice: वचन
  rationale: प्रारम्भ, प्रकट होने और पुत्र कहलाने के संदर्भ में यह व्यक्तिगत उपाधि है; ‘वचन’ हिन्दी बाइबलीय भाषा में परिचित है और पाठ की व्यक्ति-सूचकता बनाए रखता है।
- source_word: Gentiles
  choice: गैर-यहूदी
  rationale: आधुनिक पाठक के लिए स्पष्ट और स्वाभाविक; जातीय-धार्मिक विरोध को बिना अनावश्यक पारिभाषिक बोझ के व्यक्त करता है।
- source_word: mysteries
  choice: भेद
  rationale: यह छिपी हुई, अब सिखाई गई ईश्वरीय बातों का संकेत देता है; ‘रहस्य’ की गूढ़वादी सम्भावना से बचते हुए अर्थ की गंभीरता रखता है।
- source_word: Church
  choice: कलीसिया
  rationale: ऐतिहासिक मसीही समुदाय के लिए व्यापक रूप से पहचाना जाने वाला हिन्दी शब्द।
- source_word: pledges of faith
  choice: विश्वास की धरोहरें
  rationale: अंग्रेज़ी साक्ष्य का वाक्यांश अस्पष्ट है; ‘धरोहरें’ सौंपे गए विश्वास और उसकी प्रतिज्ञाबद्ध रक्षा—दोनों अर्थों की गुंजाइश रखता है।
- source_word: fathers
  choice: पूर्वजों
  rationale: यहाँ आरम्भिक प्रामाणिक परम्परा के धारकों का संकेत है; ‘पिताओं’ की शाब्दिकता से होने वाली आधुनिक हिन्दी की अस्पष्टता से बचता है।
theological_decisions:
- issue: ‘He sent forth the Word’ में भेजने वाले की पहचान
  choice: ‘उसने वचन को भेजा’
  alternative: ‘पिता ने वचन को भेजा’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य कर्ता को सर्वनाम में रखता है। पिता का अर्थ संदर्भ से सम्भव है, पर उसे स्पष्ट जोड़ना पाठ की वास्तविक अस्पष्टता को हल कर देना होता।
- issue: ‘Today He was accounted a Son’ का अर्थ
  choice: ‘आज वह पुत्र माना गया’
  alternative: ‘आज वह पुत्र के रूप में प्रकट हुआ’ अथवा ‘आज पुत्र उत्पन्न हुआ’
  rationale: असामान्य और धर्मवैज्ञानिक तनावपूर्ण कथन को व्याख्यात्मक रूप से जन्म, दत्तकत्व या केवल प्रकटीकरण में नहीं बदला गया।
- issue: कृपा का व्यक्तिकरण
  choice: कृपा को समझ देने, आनन्दित होने और दिए जाने वाली सक्रिय सत्ता के रूप में रखा गया
  alternative: इन क्रियाओं को परमेश्वर या वचन का कार्य बनाना
  rationale: साक्ष्य की व्याकरणिक और अलंकारिक संरचना को बनाए रखा गया; इसे किसी व्यवस्थित कृपा-सिद्धान्त के अनुसार पुनर्गठित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘वचन’, ‘कलीसिया’, ‘प्रेरित’ और ‘भविष्यद्वक्ता’ जैसे स्थापित बाइबलीय पद रखे गए हैं। लम्बे प्राचीन वाक्यों को अर्थ-संबंध बचाते हुए कुछ छोटे वाक्यों में बाँटा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और उसके परामर्शी POB पाठ पर आधारित है; प्राचीन यूनानी पाठ की प्रत्यक्ष समीक्षा अभी लंबित है, और खोई हुई Codex Argentoratensis की प्रतिलिपि-परम्परा के कारण निर्णायक स्रोत-पाठ संबंधी दावे नहीं किए गए हैं।
