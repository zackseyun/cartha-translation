  terminology: ‘आत्मा,’ ‘देह,’ ‘शरीर,’ ‘मसीही,’ and ‘धर्म’ are suitable in this literary analogy. ‘अविनश्वरता’ preserves the abstract sense of ‘imperishability’ more closely than ‘अविनाशी अवस्था,’ without specifying a doctrinal mechanism.
  issues:
  - severity: medium
    issue: ‘imperishability’ is rendered as ‘अविनाशी अवस्था.’
    rationale: ‘अवस्था’ is not present in the supplied witness and narrows an abstract quality into a state. ‘अविनश्वरता’ better preserves the source wording and its theological openness.
  - severity: low
    issue: The final sentence makes non-abandonment appear solely as a result of the office’s greatness (‘इतना महान है कि...’).
    rationale: The witness coordinates the greatness of the assigned office with the statement that it is not lawful to decline it. A coordinate Hindi construction preserves this relation more closely.
