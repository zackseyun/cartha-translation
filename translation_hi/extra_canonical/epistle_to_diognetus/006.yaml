lexical_decisions:
- source_word: soul
  choice: आत्मा
  rationale: शरीर–आत्मा उपमा को स्पष्ट और पारंपरिक ढंग से बनाए रखता है; यहाँ इसका प्रयोग दार्शनिक उपमा के रूप में है।
- source_word: Christians
  choice: मसीही
  rationale: आधुनिक मानक हिन्दी में स्वाभाविक और व्यापक रूप से समझा जाने वाला पद।
- source_word: religion
  choice: धर्म
  rationale: दृश्य समुदाय और अदृश्य धार्मिक जीवन के विरोध को संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: flesh
  choice: देह
  rationale: इस वाक्य में आत्मा के विपरीत शारीरिक पक्ष का संकेत देता है और अगले पदों के ‘शरीर’ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: imperishability
  choice: अविनाशी अवस्था
  rationale: अमूर्त संज्ञा को समझने योग्य हिन्दी में व्यक्त करता है, बिना यह तय किए कि आशय अमरता, पुनरुत्थान या किसी अन्य विशिष्ट सिद्धांत से है।
- source_word: office
  choice: दायित्व
  rationale: यहाँ पदवी के बजाय परमेश्वर द्वारा सौंपे गए कार्य और स्थान का बोध अधिक स्वाभाविक रूप से देता है।
theological_decisions:
- issue: ‘संसार को एक साथ थामे रखते हैं’ का दावा
  choice: रूपक को बिना व्याख्यात्मक नरमी के सुरक्षित रखा गया।
  alternative: ‘संसार की भलाई में सहायक हैं’
  rationale: वैकल्पिक अर्थ मूल आत्मा–शरीर समानांतर की प्रबलता घटाता और व्याख्या जोड़ता।
- issue: स्वर्ग में स्थित ‘imperishability’
  choice: ‘उस अविनाशी अवस्था ... जो स्वर्ग में है’
  alternative: ‘स्वर्गीय अमर जीवन’
  rationale: साक्ष्य में विद्यमान अमूर्तता और भावी अपेक्षा को बनाए रखा गया; किसी विशिष्ट परलोक-सिद्धांत को आरोपित नहीं किया गया।
- issue: मसीहियों का दंड में बढ़ना
  choice: ‘और अधिक बढ़ते जाते हैं’
  alternative: ‘संख्या में बढ़ते जाते हैं’ अथवा ‘आत्मिक रूप से उन्नत होते हैं’
  rationale: ‘increase’ में संख्या और सामुदायिक/आत्मिक वृद्धि की संभावित अस्पष्टता है, इसलिए उसे अनिर्णीत रखा गया।
- issue: आत्मा का भोजन-पेय की कठोरता से सुधरना
  choice: प्राचीन लेखक के दावे को उसी उपमा के भीतर रखा गया।
  alternative: इसे उपवास के प्रत्यक्ष धार्मिक आदेश के रूप में प्रस्तुत करना
  rationale: पाठ उपमा देता है; इससे सार्वभौमिक साधना-विधान निकालना अनावश्यक सांप्रदायिक विस्तार होता।
