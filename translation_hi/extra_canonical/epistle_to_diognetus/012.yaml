base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/012.yaml
  text: 'Confronted with these truths and listening to them attentively, you will know how much God bestows on those who love him rightly. They become a paradise of delight, a flourishing tree that grows within them, bears every kind of fruit, and is adorned with various fruits.


    For in this garden a tree of knowledge and a tree of life have been planted. Yet the tree of knowledge does not kill; disobedience kills.


    For the Scriptures state clearly that from the beginning God planted a tree [of knowledge and a tree] of life in the midst of Paradise, revealing life through knowledge. Because our first parents did not use it genuinely, they were made naked through the serpent’s deceit.


    For there is neither life without knowledge nor sound knowledge without true life. Therefore, one tree is planted near the other.


    Discerning the force of this, and blaming the knowledge practiced apart from the truth of the injunction that leads to life, the apostle says, “Knowledge puffs up, but love builds up.”


    For the person who supposes that he knows anything without the true knowledge testified by life is ignorant. He is deceived by the serpent because he did not love life. But the one who recognizes and desires life with fear plants in hope, expecting fruit.


    Let your heart be knowledge, and your life true reason, properly understood.


    If you bear the tree and pluck its fruit, you will always gather the harvest God looks for—a harvest which the serpent does not touch and deceit does not infect. Eve is not corrupted but is believed on as a virgin,


    and salvation is set forth, and the apostles are filled with understanding, and the Passover of the Lord goes forward, and the congregations are gathered together, and [all things] are arranged in order. As He teaches the saints, the Word is gladdened, through whom the Father is glorified. To him be glory forever and ever. Amen.'
translation:
  language: hi
  text: 'इन सत्यों के सामने आने और इन्हें ध्यान से सुनने पर तुम जानोगे कि परमेश्वर उन लोगों को कितना कुछ देता है जो उससे सही रीति से प्रेम करते हैं। वे आनन्द की वाटिका बन जाते हैं—अपने भीतर बढ़ता और फलता-फूलता ऐसा वृक्ष, जो हर प्रकार के फल फलता और विविध फलों से सुशोभित होता है।


    क्योंकि इस वाटिका में ज्ञान का वृक्ष और जीवन का वृक्ष लगाया गया है। फिर भी ज्ञान का वृक्ष नहीं मारता; आज्ञा न मानना मारता है।


    क्योंकि पवित्र शास्त्र स्पष्ट रूप से बताते हैं कि आरम्भ से ही परमेश्वर ने वाटिका के बीच में [ज्ञान का वृक्ष और] जीवन का वृक्ष लगाया और ज्ञान के द्वारा जीवन प्रकट किया। पर हमारे आदि माता-पिता ने उसका सही रीति से उपयोग नहीं किया, इसलिए साँप के छल से वे नग्न हो गए।[a]


    क्योंकि न तो ज्ञान के बिना जीवन है, न सच्चे जीवन के बिना खरा ज्ञान। इसलिए एक वृक्ष दूसरे के पास लगाया गया है।


    इस बात का मर्म समझकर, और उस ज्ञान को दोषी ठहराकर जो जीवन की ओर ले जाने वाली आज्ञा की सच्चाई से अलग होकर काम करता है, प्रेरित कहता है, “ज्ञान घमण्ड से फुलाता है, पर प्रेम उन्नति करता है।”[b]


    क्योंकि जो मनुष्य यह मानता है कि वह कुछ जानता है, पर उसके पास वह सच्चा ज्ञान नहीं जिसकी गवाही जीवन देता है, वह अज्ञानी है। साँप ने उसे धोखा दिया है, क्योंकि उसने जीवन से प्रेम नहीं किया। पर जो श्रद्धापूर्ण भय के साथ जीवन को पहचानता और उसकी अभिलाषा करता है, वह फल की आशा रखते हुए उम्मीद में रोपता है।


    तुम्हारा हृदय ज्ञान बने, और तुम्हारा जीवन ठीक से समझी हुई सच्ची बुद्धि बने।[c]


    यदि तुम उस वृक्ष को अपने भीतर धारण करो और उसका फल तोड़ो, तो तुम सदा वही उपज बटोरोगे जिसकी परमेश्वर अपेक्षा करता है। उसे न साँप छूता है, न छल दूषित करता है; हव्वा भ्रष्ट नहीं होती, बल्कि कुँवारी के रूप में उस पर विश्वास किया जाता है;[d]


    उद्धार प्रकट किया जाता है, प्रेरित समझ से भर जाते हैं, प्रभु का फसह आगे बढ़ता है, सभाएँ एकत्र होती हैं, और [सब कुछ] सुव्यवस्थित किया जाता है। जब वह पवित्र जनों को शिक्षा देता है, तब वचन आनन्दित होता है; उसी के द्वारा पिता की महिमा होती है। उसकी महिमा युगानुयुग होती रहे। आमीन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोष्ठकों में दिए शब्द उपलब्ध साक्ष्य में पाठ-पुनर्स्थापन अथवा क्षतिग्रस्त पाण्डुलिपि का संकेत हैं।
    reason: पाठ-साक्ष्य की अनिश्चितता को पाठक के सामने स्पष्ट रखना।
  - marker: b
    text: 'यह 1 कुरिन्थियों 8:1 का संकेत है: “ज्ञान घमण्ड से फुलाता है, पर प्रेम उन्नति करता है।”'
    reason: प्रेरितीय उद्धरण की पहचान कराना।
  - marker: c
    text: “सच्ची बुद्धि” के पीछे उपलब्ध अंग्रेज़ी साक्ष्य में ‘true reason’ है; मूल यूनानी की प्रत्यक्ष समीक्षा बाकी होने के कारण अर्थ कुछ अनिश्चित है।
    reason: कठिन और सम्भवतः तकनीकी पद की अनिश्चितता बताना।
  - marker: d
    text: हव्वा के विषय में यह कथन उपलब्ध साक्ष्य में इसी असामान्य रूप में है। इसे मरियम या किसी अन्य प्रतीक के स्पष्ट उल्लेख में नहीं बदला गया है।
    reason: वास्तविक पाठगत/व्याख्यात्मक कठिनाई को बिना सामंजस्य बैठाए सुरक्षित रखना।
lexical_decisions:
- source_word: Paradise
  choice: आनन्द की वाटिका / वाटिका
  rationale: उत्पत्ति की उद्यान-छवि और ‘delight’ दोनों को सहज हिन्दी में बनाए रखता है; केवल पारिभाषिक ‘स्वर्गलोक’ कहने से स्थल-रूपक धुँधला पड़ता।
- source_word: knowledge
  choice: ज्ञान
  rationale: पूरे अनुच्छेद में वृक्ष, जीवन और प्रेरितीय उद्धरण को जोड़ने वाला एक ही प्रमुख शब्द बनाए रखा गया है।
- source_word: disobedience
  choice: आज्ञा न मानना
  rationale: आम पाठक के लिए स्वाभाविक है और आदेश/आज्ञा से जुड़े आगे के तर्क को सुरक्षित रखता है।
- source_word: charity
  choice: प्रेम
  rationale: यहाँ यूनानी आगापे की पारंपरिक आधुनिक हिन्दी अभिव्यक्ति; ‘दान’ अर्थ को भटका देता।
- source_word: edifieth
  choice: उन्नति करता है
  rationale: निर्माण-रूपक की दिशा रखते हुए आधुनिक हिन्दी में व्यक्ति/समुदाय को सुदृढ़ करने का भाव देता है।
- source_word: fear
  choice: श्रद्धापूर्ण भय
  rationale: सिर्फ आतंक नहीं, परमेश्वर के प्रति आदर और गंभीरता का धार्मिक भाव व्यक्त करता है।
- source_word: true reason
  choice: सच्ची बुद्धि
  rationale: अंग्रेज़ी साक्ष्य का वाक्य असामान्य है; ‘तर्क’ की संकीर्ण आधुनिक ध्वनि से बचकर समझ-बूझ का नैतिक भाव रखा गया है।
- source_word: Passover of the Lord
  choice: प्रभु का फसह
  rationale: ऐतिहासिक-पवित्र पर्व का विशिष्ट नाम सुरक्षित रखता है और इसे सामान्य ‘पार होना’ में नहीं बदलता।
- source_word: congregations
  choice: सभाएँ
  rationale: मूल बहुवचन और एकत्र होने के सार्वजनिक भाव को रखता है, बिना बाद की किसी विशिष्ट कलीसियाई संरचना को आरोपित किए।
- source_word: the Word
  choice: वचन
  rationale: व्यक्तिवाचक मसीही प्रयोग की सम्भावना बनाए रखने के लिए ‘वचन’ रखा गया और संदर्भानुसार गरिमामय रूप दिया गया।
theological_decisions:
- issue: ज्ञान के वृक्ष और मृत्यु का सम्बन्ध
  choice: “ज्ञान का वृक्ष नहीं मारता; आज्ञा न मानना मारता है” को सीधे बनाए रखा
  alternative: ज्ञान के वृक्ष को स्वयं घातक या ज्ञान को पापपूर्ण बताना
  rationale: पाठ स्पष्ट रूप से दोष ज्ञान पर नहीं, अवज्ञा पर रखता है; इसकी धार्मिक तनातनी को नरम नहीं किया गया।
- issue: ज्ञान और जीवन की परस्पर निर्भरता
  choice: दोनों दिशाओं वाला कथन समान रूप से रखा
  alternative: सच्चे ज्ञान को केवल जीवन का परिणाम या जीवन को केवल ज्ञान का परिणाम बनाना
  rationale: लेखक ‘न…न…’ संरचना से दोनों को अविभाज्य बताता है।
- issue: हव्वा का कुँवारी के रूप में विश्वास किया जाना
  choice: असामान्य कथन को यथावत रखा और पादटिप्पणी दी
  alternative: इसे मरियम के स्पष्ट उल्लेख में बदलना या पाठ को सुधारकर सहज बनाना
  rationale: उपलब्ध साक्ष्य में कथन कठिन है; किसी विशिष्ट प्रतीकात्मक व्याख्या को अनिवार्य नहीं बनाया गया।
- issue: ‘वचन’ का आनन्दित होना और पिता की महिमा
  choice: व्यक्तिवाचक ‘वचन’ तथा सम्बन्धवाचक क्रम सुरक्षित रखा
  alternative: ‘संदेश’ करना या कर्ता को स्पष्ट रूप से मसीह बताकर विस्तार करना
  rationale: संभावित लोगोस-सन्दर्भ रखा गया, पर अंग्रेज़ी साक्ष्य की सर्वनामगत अस्पष्टता से आगे नहीं बढ़ा गया।
- issue: ‘उसकी महिमा’ का संदर्भ
  choice: अंतिम पुरुषवाचक सर्वनाम को हिन्दी में भी व्यापक रखा
  alternative: स्पष्ट रूप से केवल पिता या केवल वचन का नाम दोहराना
  rationale: निकटवर्ती वाक्य में पिता और वचन दोनों आते हैं; स्रोत-भाषा समीक्षा के बिना संदर्भ को निर्णायक बनाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सुबोध। सम्बोधन के लिए ‘तुम’ रखा गया है, क्योंकि पाठ शिक्षात्मक और प्रत्यक्ष है; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘पवित्र शास्त्र’, ‘प्रेरित’, ‘फसह’ और ‘वचन’ जैसे स्थापित धार्मिक पद सुरक्षित रखे गए हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण कठिन स्थानों पर पादटिप्पणी और अर्थगत संयम अपनाया गया है।
