  revised_text: 'इन सत्यों का सामना करके और इन्हें ध्यान से सुनकर तुम जानोगे कि परमेश्वर उन लोगों को कितना कुछ देता है जो उससे सही रीति से प्रेम करते हैं। वे आनन्द की वाटिका बन जाते हैं—एक ऐसा फलता-फूलता वृक्ष, जो उनके भीतर बढ़ता है, हर प्रकार के फल लाता है और विविध फलों से सुशोभित होता है।


    क्योंकि इस वाटिका में ज्ञान का वृक्ष और जीवन का वृक्ष लगाए गए हैं। फिर भी ज्ञान का वृक्ष नहीं मारता; आज्ञा न मानना मारता है।


    क्योंकि पवित्र शास्त्र स्पष्ट रूप से बताते हैं कि आरम्भ से ही परमेश्वर ने वाटिका के बीच में एक वृक्ष [ज्ञान का वृक्ष और एक वृक्ष] जीवन का लगाया था,[a] और ज्ञान के द्वारा जीवन प्रकट किया था। और क्योंकि हमारे आदि माता-पिता ने उसका सही रीति से उपयोग नहीं किया, इसलिए साँप के छल से वे नग्न हो गए।


    क्योंकि न तो ज्ञान के बिना जीवन है, न सच्चे जीवन के बिना खरा ज्ञान। इसलिए एक वृक्ष दूसरे के पास लगाया गया है।


    इस बात का मर्म समझकर, और उस ज्ञान को दोष देते हुए जो जीवन की ओर ले जाने वाली आज्ञा के सत्य से अलग बरता जाता है, प्रेरित कहता है, “ज्ञान घमण्ड से फुलाता है, पर प्रेम उन्नति करता है।”[b]


    क्योंकि जो मनुष्य यह मानता है कि वह कुछ जानता है, पर उसके पास वह सच्चा ज्ञान नहीं जिसकी गवाही जीवन देता है, वह अज्ञानी है। साँप ने उसे धोखा दिया है, क्योंकि उसने जीवन से प्रेम नहीं किया। पर जो भय के साथ जीवन को पहचानता और उसकी अभिलाषा करता है, वह फल की आशा रखते हुए उम्मीद में रोपता है।


    तुम्हारा हृदय ज्ञान हो, और तुम्हारा जीवन सच्चा विवेक हो, जिसे ठीक से समझा गया हो।[c]


    यदि तुम उस वृक्ष को धारण करो और उसका फल तोड़ो, तो तुम सदा वही उपज बटोरोगे जिसकी परमेश्वर अपेक्षा करता है—ऐसी उपज जिसे न साँप छूता है, न छल दूषित करता है। हव्वा भ्रष्ट नहीं होती, बल्कि कुँवारी के रूप में उस पर विश्वास किया जाता है;[d]


    उद्धार प्रकट किया जाता है, प्रेरित समझ से भर जाते हैं, प्रभु का फसह आगे बढ़ता है, सभाएँ एकत्र होती हैं, और [सब कुछ] सुव्यवस्थित किया जाता है। जब वह पवित्र जनों को शिक्षा देता है, तब वचन आनन्दित होता है; जिसके द्वारा पिता की महिमा होती है। उसी की महिमा युगानुयुग होती रहे। आमीन।'
