  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.xv.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Since I see, most excellent Diognetus, that thou art exceedingly anxious to understand the religion of the Christians, and that thy enquiries respecting them are distinctly and carefully made, as to what God they trust and how they worship Him, that they all disregard the world and despise death, and take no account of those who are regarded as gods by the Greeks, neither observe the superstition of the Jews, and as to the nature of the affection which they entertain one to another, and of this new development or interest, which has entered into men''s lives now and not before: I gladly welcome this zeal in thee, and I ask of God, Who supplieth both the speaking and the hearing to us, that it may be granted to myself to speak in such a way that thou mayest be made better by the hearing, and to thee that thou mayest so listen that I the speaker may not be disappointed.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/001.yaml
  text: 'Most excellent Diognetus, I see that you are exceedingly anxious to understand the religion of the Christians, and that your enquiries concerning them are distinctly and carefully made: as to what God they trust and how they worship him; that they all disregard the world and despise death; that they take no account of those regarded as gods by the Greeks, neither observing the superstition of the Jews; as to the nature of the affection they have for one another; and as to this new development or interest, which has entered into human lives now and not before. I gladly welcome your zeal, and I ask God, who supplies both speaking and hearing to us, that it may be granted to me to speak in such a way that you may be made better by hearing, and to you to listen in such a way that I, the speaker, may not be disappointed.'
translation:
  language: hi
  text: 'परम आदरणीय दियोग्नेतुस, मैं देखता हूँ कि आप मसीहियों के धर्म को समझने के लिए अत्यन्त उत्सुक हैं और उनके विषय में आपके प्रश्न स्पष्ट तथा सावधानी से पूछे गए हैं: वे किस परमेश्वर पर भरोसा रखते हैं और उसकी उपासना कैसे करते हैं; वे सब संसार की परवाह क्यों नहीं करते और मृत्यु को तुच्छ क्यों समझते हैं; यूनानियों द्वारा देवता माने जाने वालों को वे क्यों नहीं मानते और यहूदियों के अंधविश्वास का पालन भी क्यों नहीं करते; एक-दूसरे के प्रति उनके प्रेम का स्वरूप क्या है; और यह नई बात या रुचि, जो अब मनुष्यों के जीवन में आई है, पहले क्यों नहीं आई। मैं आपकी इस लगन का सहर्ष स्वागत करता हूँ और उस परमेश्वर से प्रार्थना करता हूँ, जो हमें बोलने और सुनने—दोनों की सामर्थ्य देता है, कि मुझे इस प्रकार बोलने का वरदान मिले कि सुनने से आप और उत्तम बनें, और आपको इस प्रकार सुनने का वरदान मिले कि मुझ बोलने वाले को निराश न होना पड़े।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है। प्राचीन यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी शेष है; विशेषतः “नई बात या रुचि” और कुछ वाक्यगत सम्बन्ध पुनरीक्षण के अधीन हैं।
    reason: उपयोगकर्ता द्वारा दिए गए स्रोत-विवरण के अनुसार यूनानी स्रोत-भाषा की समीक्षा लंबित है; इसलिए पाठगत निश्चितता का अनुचित दावा नहीं किया जाना चाहिए।
lexical_decisions:
- source_word: religion
  choice: धर्म
  rationale: यहाँ मसीहियों के विश्वास और उपासना-पद्धति के व्यापक अर्थ के लिए साधारण आधुनिक हिन्दी का स्वाभाविक शब्द है।
- source_word: disregard the world
  choice: संसार की परवाह नहीं करते
  rationale: ‘संसार’ को नष्ट या स्वभावतः बुरा बताने के बजाय सामाजिक-सांसारिक मूल्यांकन के प्रति उदासीनता का भाव बनाए रखता है।
- source_word: despise death
  choice: मृत्यु को तुच्छ समझते हैं
  rationale: मृत्यु से निर्भयता की तीव्र अभिव्यक्ति सुरक्षित रहती है; इसे केवल ‘नहीं डरते’ कहकर हल्का नहीं किया गया।
- source_word: affection
  choice: प्रेम
  rationale: परस्पर स्नेह या अनुराग के अर्थ को सामान्य और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: new development or interest
  choice: नई बात या रुचि
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की वैकल्पिक और अनिश्चित अभिव्यक्ति को एक ही निश्चित अर्थ में सीमित नहीं किया गया।
- source_word: supplieth both the speaking and the hearing
  choice: बोलने और सुनने—दोनों की सामर्थ्य देता है
  rationale: दैवी सहायता का भाव प्राकृतिक हिन्दी में देता है, बिना किसी विशेष प्रेरणा-सिद्धान्त को जोड़ने के।
theological_decisions:
- issue: यूनानी देवताओं का उल्लेख
  choice: यूनानियों द्वारा देवता माने जाने वाले
  alternative: यूनानियों के देवता
  rationale: लेखक की दृष्टि से उनके वास्तविक देवता होने की पुष्टि किए बिना मूल के आलोचनात्मक अंतर को बनाए रखता है।
- issue: Jewish superstition
  choice: यहूदियों के अंधविश्वास
  alternative: यहूदियों की धार्मिक रीति
  rationale: उपलब्ध साक्ष्य में आए स्पष्ट नकारात्मक पद को नरम करके नहीं हटाया गया; इसे लेखक के ऐतिहासिक दावे के रूप में प्रस्तुत किया गया है, आधुनिक सम्पादकीय निर्णय के रूप में नहीं।
- issue: God के लिए पद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: मसीही धार्मिक सन्दर्भ में स्वाभाविक आधुनिक हिन्दी है और किसी विशिष्ट साम्प्रदायिक मत को नहीं जोड़ता।
- issue: सुनने से बेहतर होने का आशय
  choice: और उत्तम बनें
  alternative: लाभ पाएँ
  rationale: नैतिक अथवा आत्मिक सुधार की मूल तनावपूर्ण व्यापकता बनाए रखी गई है; इसे केवल बौद्धिक लाभ तक सीमित नहीं किया गया।
