  revised_text: 'इस प्रकार परमेश्वर ने अपने पुत्र के साथ मिलकर अपने मन में पहले ही सब कुछ ठहरा लिया था। फिर भी पिछले समय में उसने हमें हमारी इच्छा के अनुसार अनियंत्रित आवेगों में बहते रहने दिया; हम सुख-विलास और लालसाओं से भटकते रहे। ऐसा बिल्कुल नहीं था कि वह हमारे पापों से प्रसन्न होता था, बल्कि वह हमें सहता रहा; ऐसा भी नहीं कि वह अधर्म के उस बीते समय को स्वीकार करता था, बल्कि वह धार्मिकता का यह वर्तमान समय तैयार कर रहा था। इसका उद्देश्य यह था कि बीते समय में अपने ही कामों से जीवन के अयोग्य सिद्ध होकर हम अब परमेश्वर की भलाई से योग्य ठहरें; और हमारे अपने बल पर परमेश्वर के राज्य में प्रवेश करने की असमर्थता स्पष्ट हो जाने पर हम परमेश्वर की सामर्थ्य से ऐसा करने में समर्थ बनाए जाएँ।


    जब हमारा अधर्म पूरी तरह हो चुका और यह पूर्णतः प्रकट हो गया कि उसका प्रतिफल दंड और मृत्यु होना था, तब परमेश्वर का ठहराया हुआ समय आया कि अब वह अपनी भलाई और सामर्थ्य प्रकट करे। ओह, परमेश्वर की कितनी अपार कृपा और प्रेम! उसने न हमसे घृणा की, न हमें ठुकराया, न हमारे प्रति बैर रखा; बल्कि वह दीर्घसहिष्णु और धीरजवन्त रहा। उसने हम पर दया करके हमारे पापों को अपने ऊपर ले लिया[a] और हमारे लिए छुड़ौती के रूप में अपना पुत्र दे दिया—व्यवस्थाहीनों के लिए पवित्र जन, दुष्टों के लिए निष्कपट, अधर्मियों के लिए धर्मी, नाशवानों के लिए अविनाशी और मरणहारों के लिए अमर।


    उसकी धार्मिकता के सिवा और क्या हमारे पापों को ढक सकता था?


    हम व्यवस्थाहीन और भक्तिहीन लोग परमेश्वर के पुत्र को छोड़ और किसमें धर्मी ठहराए जा सकते थे?


