  yaml_path: translation/extra_canonical/epistle_to_diognetus/009.yaml
  text: 'Having already planned everything in His mind with His Son, He permitted us during the former time to be borne along by disorderly impulses as we desired, led astray by pleasures and lusts, not at all because He took delight in our sins, but because He bore with us; not because He approved of the past season of iniquity, but because He was creating the present season of righteousness. Thus, being convicted in the past time by our own deeds as unworthy of life, we might now be made deserving by the goodness of God; and, having made clear our inability to enter into the kingdom of God of ourselves, we might be enabled by the ability of God.


    And when our iniquity had been fully accomplished, and it had been made perfectly manifest that punishment and death were expected as its recompense, the season came which God had ordained, when henceforth He should manifest His goodness and power. O the exceeding great kindness and love of God! He hated us not, neither rejected us, nor bore us malice, but was long-suffering and patient; and in pity for us took upon Himself our sins, and Himself parted with His own Son as a ransom for us: the holy for the lawless, the guileless for the evil, the just for the unjust, the incorruptible for the corruptible, the immortal for the mortal.


    For what else but His righteousness would have covered our sins?


    In whom was it possible for us, lawless and ungodly people, to have been justified, save only in the Son of God?


    O the sweet exchange! O the inscrutable creation! O the unexpected benefits! That the iniquity of many should be concealed in One Righteous Man, and the righteousness of One should justify many that are iniquitous!


    Having then in the former time demonstrated the inability of our nature to obtain life, and having now revealed a Savior able to save even creatures which have no ability, He willed that for both reasons we should believe in His goodness and should regard Him as nurse, father, teacher, counselor, physician, mind, light, honor, glory, strength, and life.'
translation:
  language: hi
  text: 'इस प्रकार परमेश्वर ने अपने पुत्र के साथ अपने मन में पहले ही सब कुछ ठहरा लिया था। फिर भी पिछले समय में उसने हमें हमारी इच्छा के अनुसार अनियंत्रित आवेगों में बहते रहने दिया; हम सुख-विलास और लालसाओं से भटकते रहे। ऐसा बिल्कुल नहीं था कि वह हमारे पापों से प्रसन्न होता था, बल्कि वह हमें सहता रहा; ऐसा भी नहीं कि वह अधर्म के उस बीते समय को स्वीकार करता था, बल्कि वह धार्मिकता का यह वर्तमान समय तैयार कर रहा था। इसका उद्देश्य यह था कि बीते समय में अपने ही कामों से जीवन के अयोग्य सिद्ध होकर हम अब परमेश्वर की भलाई से योग्य ठहरें; और जब यह स्पष्ट हो जाए कि हम अपने बल पर परमेश्वर के राज्य में प्रवेश नहीं कर सकते, तब परमेश्वर की सामर्थ्य से ऐसा करने में समर्थ बनाए जाएँ।


    जब हमारा अधर्म अपनी पराकाष्ठा पर पहुँच चुका और यह पूरी तरह स्पष्ट हो गया कि उसके प्रतिफल के रूप में दंड और मृत्यु सामने हैं, तब परमेश्वर का ठहराया हुआ समय आया कि अब वह अपनी भलाई और सामर्थ्य प्रकट करे। ओह, परमेश्वर की कितनी अपार कृपा और प्रेम! उसने न हमसे घृणा की, न हमें ठुकराया, न हमारे प्रति बैर रखा; बल्कि वह धीरज धरता और सहता रहा। उसने हम पर दया करके हमारे पापों को अपने ऊपर ले लिया[a] और हमारे लिए छुड़ौती के रूप में अपना पुत्र दे दिया—व्यवस्थाहीनों के लिए पवित्र जन, दुष्टों के लिए निष्कपट, अधर्मियों के लिए धर्मी, नाशवानों के लिए अविनाशी और मरणहारों के लिए अमर।


    उसकी धार्मिकता के सिवा और क्या हमारे पापों को ढक सकता था?


    हम व्यवस्थाहीन और भक्तिहीन लोग परमेश्वर के पुत्र को छोड़ और किसमें धर्मी ठहराए जा सकते थे?


    ओह, कैसा मधुर विनिमय! कैसी अगम्य योजना![b] कैसे अनपेक्षित उपकार! अनेकों का अधर्म एक धर्मी जन में छिप जाए, और एक की धार्मिकता अनेक अधर्मियों को धर्मी ठहराए!


    इस प्रकार, पहले के समय में उसने दिखा दिया कि हमारा स्वभाव जीवन पाने में असमर्थ है, और अब उसने ऐसे उद्धारकर्ता को प्रकट किया जो असमर्थ प्राणियों तक का उद्धार कर सकता है। इन दोनों बातों के कारण उसकी इच्छा थी कि हम उसकी भलाई पर विश्वास करें और उसे अपना पालनकर्ता, पिता, शिक्षक, परामर्शदाता, वैद्य, बुद्धि, प्रकाश, आदर, महिमा, सामर्थ्य और जीवन मानें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध अंग्रेज़ी साक्ष्य की वाक्य-रचना का अनुसरण करता है, जहाँ परमेश्वर कर्ता है। इस कथन का पुत्र को छुड़ौती के रूप में देने वाली अगली पंक्ति से संबंध है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: कर्ता और प्रायश्चित्त-संबंधी वाक्यांश में संभावित व्याख्यात्मक तनाव को ईमानदारी से चिह्नित करना।
  - marker: b
    text: उपलब्ध अंग्रेज़ी साक्ष्य में यहाँ ‘inscrutable creation’ है। संदर्भ में इसका आशय परमेश्वर की अगम्य व्यवस्था या योजना भी हो सकता है; यूनानी पाठ की प्रत्यक्ष जाँच लंबित है।
    reason: साक्ष्य का शब्द असामान्य है और स्रोत-भाषा समीक्षा के बिना एक अर्थ को अंतिम रूप देना उचित नहीं।
lexical_decisions:
- source_word: disorderly impulses
  choice: अनियंत्रित आवेग
  rationale: नैतिक अव्यवस्था और भीतर से प्रेरित इच्छाओं—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: made deserving
  choice: योग्य ठहरें
  rationale: संदर्भ में मनुष्य की अर्जित योग्यता नहीं, परमेश्वर की भलाई से मिला नया दर्जा प्रमुख है; ‘ठहरें’ इस संबंधपरक भाव को सुरक्षित रखता है।
- source_word: ransom
  choice: छुड़ौती
  rationale: मुक्ति के लिए दिए गए मूल्य का पारंपरिक और सुबोध हिन्दी पद।
- source_word: lawless
  choice: व्यवस्थाहीन
  rationale: केवल सामान्य अपराधीपन के बजाय ईश्वरीय व्यवस्था के उल्लंघन का भाव बनाए रखता है।
- source_word: justified
  choice: धर्मी ठहराए
  rationale: न्यायिक घोषणा का अर्थ बनाए रखता है और इसे नैतिक सुधार मात्र में नहीं बदलता।
- source_word: nurse
  choice: पालनकर्ता
  rationale: आधुनिक हिन्दी में लिंग-विशिष्ट ‘धाय’ की अपेक्षा पोषण और देखभाल का व्यापक भाव अधिक स्पष्ट है।
- source_word: mind
  choice: बुद्धि
  rationale: सूची में परमेश्वर को समझ और विवेक के स्रोत के रूप में व्यक्त करता है; ‘मन’ यहाँ हिन्दी में अस्पष्ट हो सकता था।
theological_decisions:
- issue: मनुष्य को पाप में बहने देने में परमेश्वर की भूमिका
  choice: ‘बहते रहने दिया’ और साथ ही पाप से प्रसन्न न होने का स्पष्ट निषेध
  alternative: परमेश्वर ने मनुष्यों को पाप की ओर धकेला
  rationale: पाठ सहनशील अनुमति और नैतिक अनुमोदन के बीच स्पष्ट भेद करता है।
- issue: परमेश्वर की भलाई से मनुष्य का योग्य होना
  choice: ‘परमेश्वर की भलाई से योग्य ठहरें’
  alternative: अपने कर्मों से योग्य बनें
  rationale: पाठ मानवीय अयोग्यता और ईश्वरीय भलाई के तनाव को बनाए रखता है।
- issue: ‘अपने ऊपर हमारे पाप ले लिए’ में कर्ता
  choice: मुख्य पाठ में परमेश्वर को कर्ता रहने दिया और अस्पष्टता पर पादटिप्पणी दी
  alternative: इसे बिना टिप्पणी सीधे पुत्र के प्रायश्चित्त के रूप में पुनर्लिखना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की व्याकरणिक संरचना को संप्रदायगत व्याख्या से नहीं बदला गया।
- issue: एक धर्मी की धार्मिकता और अनेकों का धर्मी ठहरना
  choice: प्रतिस्थापन और धार्मिक ठहराए जाने की सशक्त भाषा सुरक्षित रखी
  alternative: इसे केवल नैतिक उदाहरण या प्रेरणा बना देना
  rationale: मूल साक्ष्य का विनिमय, ढकने और धर्मी ठहराने वाला तनाव स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आलंकारिक विस्मय, समानांतर विरोध-युग्म और धर्मवैचारिक तनाव सुरक्षित हैं। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी अनुवाद है; खोए हुए Codex Argentoratensis की प्रतियों में संरक्षित यूनानी पाठ से प्रत्यक्ष समीक्षा अभी लंबित है।
