revisions:
- from: '**डायोग्नेतुस के नाम पत्र 5**


    मसीही बाकी मनुष्यों से न तो अपने रहने के स्थान के कारण अलग पहचाने जाते हैं, न भाषा के कारण और न रीति-रिवाजों के कारण।


    वे अपने ही अलग नगरों में नहीं बसते, न कोई दूसरी भाषा बोलते हैं और न किसी असाधारण जीवन-पद्धति का पालन करते हैं।


    उनकी शिक्षा प्रतिभाशाली मनुष्यों की बुद्धि या खोजबीन से निकला कोई आविष्कार भी नहीं है; और कुछ लोगों की तरह वे किसी मानवीय मत के समर्थक नहीं हैं।


    इसके बजाय, जिसका भाग जहाँ ठहरा है, उसके अनुसार वे यूनानियों और गैर-यूनानियों[a] के नगरों में रहते हैं। पहनावे, भोजन और जीवन की दूसरी बातों में वे वहाँ के रीति-रिवाजों का पालन करते हैं। फिर भी नागरिकों के रूप में वे जिस ढंग का जीवन दिखाते हैं, वह अद्भुत है और निस्संदेह सारी अपेक्षाओं के विपरीत है।


