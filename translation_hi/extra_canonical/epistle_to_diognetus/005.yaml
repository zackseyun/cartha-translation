base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/005.yaml
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
translation:
  language: hi
  text: '**डायोग्नेतुस के नाम पत्र 5**


    मसीही बाकी मनुष्यों से न तो अपने रहने के स्थान के कारण अलग पहचाने जाते हैं, न भाषा के कारण और न रीति-रिवाजों के कारण।


    वे अपने ही अलग नगरों में नहीं बसते, न कोई दूसरी भाषा बोलते हैं, और न किसी असाधारण जीवन-पद्धति का पालन करते हैं।


    न ही उनके पास कोई ऐसी खोज या युक्ति है जो चतुर मनुष्यों की बुद्धि या जिज्ञासापूर्ण अनुसंधान से निकली हो; और न ही वे, कुछ लोगों की तरह, किसी मानवीय मत के अनुयायी हैं।


    बल्कि, जिसका भाग्य उन्हें जहाँ ले जाता है, वहाँ वे यूनानियों और गैर-यूनानियों[a] के नगरों में रहते हैं। पहनावे, भोजन और जीवन की दूसरी व्यवस्थाओं में वे स्थानीय रीति-रिवाजों का पालन करते हैं। फिर भी उनकी अपनी नागरिकता-व्यवस्था, जो उनके जीवन में प्रकट होती है, अद्भुत है और निस्संदेह अपेक्षा के विपरीत है।


    वे अपने-अपने देशों में रहते तो हैं, पर प्रवासियों की तरह। नागरिकों के रूप में वे सब बातों में सहभागी होते हैं, फिर भी परदेशियों की तरह हर कष्ट सहते हैं। हर पराया देश उनके लिए अपनी मातृभूमि है, और हर मातृभूमि उनके लिए पराया देश।


    वे दूसरे सभी लोगों की तरह विवाह करते हैं और संतान उत्पन्न करते हैं, पर अपनी संतानों को त्यागते नहीं[b]।


    वे भोजन साझा करते हैं, पर पत्नियाँ नहीं।


    वे शरीर में हैं, फिर भी शरीर के अनुसार जीवन नहीं जीते[c]।


    वे पृथ्वी पर रहते हैं, पर उनकी नागरिकता स्वर्ग में है।


    वे स्थापित कानूनों का पालन करते हैं, फिर भी अपने जीवन में कानूनों से आगे बढ़ जाते हैं।


    वे सबसे प्रेम करते हैं, और सभी उन्हें सताते हैं।


    लोग उन्हें जानते तक नहीं, फिर भी उन्हें दोषी ठहराया जाता है। उन्हें मार डाला जाता है, फिर भी उन्हें जीवित किया जाता है।


    वे निर्धन हैं, फिर भी बहुतों को धनी बनाते हैं। उन्हें सब वस्तुओं की कमी है, फिर भी वे सब बातों में भरपूर हैं।


    उनका अपमान होता है, फिर भी उसी अपमान में उनका गौरव होता है। उनके विषय में बुरा कहा जाता है, फिर भी वे निर्दोष सिद्ध होते हैं।


    उन्हें बुरा-भला कहा जाता है, और वे आशीष देते हैं; उनका अपमान किया जाता है, और वे सम्मान देते हैं।


    भलाई करने पर उन्हें कुकर्मियों के समान दंड दिया जाता है। दंड पाकर वे ऐसे आनंदित होते हैं, मानो उसी के द्वारा उन्हें जीवन मिला हो।


    यहूदी उन्हें पराया मानकर उनके विरुद्ध युद्ध करते हैं, और यूनानी उन्हें सताते हैं; फिर भी उनसे घृणा करनेवाले अपनी शत्रुता का कारण नहीं बता सकते।'
