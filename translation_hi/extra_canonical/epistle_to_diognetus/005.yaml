  footnotes:
  - marker: a
    text: शाब्दिक रूप से “बर्बरों के नगरों में।” प्राचीन यूनानी प्रयोग में इससे सामान्यतः गैर-यूनानी भाषा और संस्कृति के लोग अभिप्रेत थे।
    reason: आधुनिक हिन्दी में “बर्बर” से जुड़ी अपमानजनक नैतिक छाया से बचते हुए ऐतिहासिक पद को दर्ज करना।
  - marker: b
    text: यह प्राचीन संसार में अवांछित नवजात शिशुओं को मरने के लिए छोड़ देने की प्रथा की ओर संकेत है।
    reason: “संतानों को त्यागते नहीं” का ऐतिहासिक आशय आधुनिक पाठक के लिए स्पष्ट करना।
  - marker: c
    text: “शरीर के अनुसार” का आशय केवल शरीर में रहने से नहीं, बल्कि शरीर-केंद्रित इच्छाओं के अधीन जीवन से भी हो सकता है; पाठ दोनों वाक्यांशों को आमने-सामने रखता है।
    reason: धार्मिक शब्दावली के अर्थ-तनाव को बिना निश्चित व्याख्या थोपे समझाना।
lexical_decisions:
- source_word: barbarians
  choice: गैर-यूनानी
  rationale: प्राचीन यूनानी-रोमी संदर्भ में यह पद मुख्यतः यूनानी न बोलनेवाले लोगों के लिए प्रयुक्त होता था। आधुनिक हिन्दी में “बर्बर” अनावश्यक रूप से नैतिक निंदा का अर्थ देता।
- source_word: constitution of their own citizenship
  choice: नागरिकों के रूप में ... जीवन का ढंग
  rationale: “नागरिकता की व्यवस्था” अत्यधिक प्रशासनिक लगती; चुना हुआ रूप सार्वजनिक आचरण और विशिष्ट सामाजिक जीवन—दोनों भाव सुरक्षित रखता है।
- source_word: sojourners
  choice: प्रवासी
  rationale: स्थायी नागरिकता के बिना कुछ समय रहनेवाले व्यक्ति का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: cast away their offspring
  choice: अपनी संतानों को फेंक नहीं देते
  rationale: मूल साक्ष्य की कठोर और ठोस अभिव्यक्ति को बनाए रखा गया; पादटिप्पणी ऐतिहासिक शिशु-परित्याग का संदर्भ स्पष्ट करती है।
- source_word: in the flesh / according to the flesh
  choice: शरीर में / शरीर के अनुसार
  rationale: जानबूझकर किए गए शब्द-पुनरावर्तन और नैतिक-धार्मिक तनाव को किसी एक व्याख्या में सीमित किए बिना सुरक्षित रखा गया।
- source_word: citizenship is in heaven
  choice: उनकी नागरिकता स्वर्ग में है
  rationale: पृथ्वी के निवास और स्वर्गीय संबद्धता के स्पष्ट विरोध को औपचारिक और स्वाभाविक हिन्दी में रखा गया।
- source_word: endowed with life
  choice: उन्हें जीवन दिया जाता है
  rationale: मृत्यु और जीवन के विरोधाभास को बनाए रखते हुए कृत्रिम “जीवन से संपन्न” से बचा गया।
theological_decisions:
- issue: “शरीर के अनुसार” का अर्थ
  choice: 'वाक्य को खुला रखा गया: “वे शरीर में हैं, फिर भी शरीर के अनुसार जीवन नहीं जीते।”'
  alternative: “वे सांसारिक अभिलाषाओं के अनुसार नहीं जीते।”
  rationale: वैकल्पिक रूप नैतिक अर्थ को स्पष्ट करता, पर “शरीर” के देहगत और नैतिक दोनों संकेतों को समय से पहले एक ही अर्थ में बाँध देता।
- issue: दंड में जीवन पाने का विरोधाभास
  choice: “मानो उसी के द्वारा उन्हें जीवन मिला हो”
  alternative: “मानो वे पुनरुत्थान पा रहे हों”
  rationale: पुनरुत्थान संभावित धार्मिक पृष्ठभूमि हो सकता है, पर उपलब्ध साक्ष्य उसे सीधे नाम नहीं देता; इसलिए कथन का तनाव सुरक्षित रखा गया।
- issue: कानूनों से आगे बढ़ना
  choice: “अपने जीवन से कानूनों की माँग से आगे बढ़ जाते हैं”
  alternative: “अपने जीवन से कानूनों पर विजय पाते हैं”
  rationale: यह आज्ञाभंग नहीं, बल्कि नैतिक आचरण में न्यूनतम कानूनी अपेक्षा से आगे जाने का भाव देता है।
- issue: यहूदियों और यूनानियों द्वारा शत्रुता
  choice: ऐतिहासिक लेखक के व्यापक सामूहिक कथन को निकटता से रखा गया
  alternative: इसे आधुनिक समुदायों पर लागू सामान्य कथन के रूप में नरम करना
  rationale: पाठ की ऐतिहासिक वाक्पटुता को बदलना उचित नहीं; पर इसे आज के किसी जातीय या धार्मिक समुदाय के बारे में सार्वकालिक निर्णय नहीं माना जाना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। छोटे समानांतर वाक्यों और विरोधाभासी संरचनाओं को लेखक की वाक्पटु शैली के अनुरूप बनाए रखा गया है। उपलब्ध आधार सार्वजनिक-क्षेत्र का अंग्रेज़ी साक्ष्य है; Codex Argentoratensis लुप्त है और प्रतियों से ज्ञात होता है। अतः यह मसौदा प्राचीन यूनानी पाठ की प्रत्यक्ष समीक्षा होने तक अस्थायी स्रोत-समीक्षित अनुवाद माना जाए।
