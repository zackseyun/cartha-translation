- source_word: full knowledge (Greek review pending)
  choice: पूरा ज्ञान
  rationale: गहन और पूर्ण पहचान के भाव को सामान्य आधुनिक हिन्दी में रखता है; स्रोत-यूनानी उपलब्ध न होने के कारण तकनीकी विकल्प से बचा गया।
- source_word: reason and mind
  choice: तर्क-बुद्धि और समझ
  rationale: दो निकटवर्ती मानवीय क्षमताओं के भेद को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: only begotten Son
  choice: एकलौता पुत्र
  rationale: पारंपरिक और बोधगम्य पद; स्रोत-पाठ की विशिष्ट पुत्रता को बनाए रखता है, पर बाद की दार्शनिक व्याख्या नहीं जोड़ता।
- source_word: mysteries
  choice: भेदों
  rationale: रहस्यात्मक विषयों के अर्थ को सहज हिन्दी में व्यक्त करता है; इसे किसी विशिष्ट संस्कार-संबंधी अर्थ तक सीमित नहीं करता।
- source_word: becomes a God to those who receive
  choice: पाने वालों के लिए मानो परमेश्वर बन जाता है
  rationale: मूल की साहसपूर्ण उपमा बचाई गई है, जबकि ‘मानो’ से स्पष्ट होता है कि मनुष्य को परमेश्वर-स्वरूप सत्ता नहीं बताया जा रहा।
- source_word: righteousness
  choice: धार्मिकता
  rationale: नैतिक और ईश्वरीय न्याय—दोनों संभावित आयामों को खुला रखने वाला प्रचलित शब्द।
theological_decisions:
- issue: ‘God loved’ के बाद कर्म का अभाव
  choice: ‘उनसे’ जोड़ा गया और टिप्पणी दी गई
  alternative: वाक्य को व्याकरणतः अधूरा छोड़ना
  rationale: उपलब्ध अंग्रेज़ी साक्षी में स्पष्ट पाठ-अभाव है; न्यूनतम पूर्ति अगले संबंधवाचक खंड के बहुवचन मानव-संदर्भ से ली गई है, पर अनिश्चितता छिपाई नहीं गई।
- issue: मनुष्य का ‘परमेश्वर बनना’
  choice: ‘मानो परमेश्वर बन जाता है’
  alternative: ‘परमेश्वर-जैसा सहायक बनता है’
  rationale: लेखक की तीखी उपमा को बनाए रखा गया, पर ऐसी शब्दावली से बचा गया जो मनुष्य के वास्तविक देवत्व का अनिवार्य दावा करे।
- issue: अनन्त आग और ‘अंत तक’
  choice: दोनों अभिव्यक्तियाँ साथ रखी गईं
  alternative: ‘सदा-सदा दंड देगी’ कहकर तनाव समाप्त करना
  rationale: ‘अनन्त’ और ‘अंत तक’ के बीच स्रोत-साक्षी में मौजूद संभावित अर्थगत तनाव को किसी एक व्यवस्थित सिद्धांत के अनुसार हल नहीं किया गया।
- issue: अंतिम अधूरा वाक्य
  choice: दीर्घविराम सुरक्षित रखा गया
  alternative: अनुमान से वाक्य पूरा करना
  rationale: प्राप्त साक्षी की अपूर्णता को ईमानदारी से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण एकवचन ‘तुम’, और सहज किंतु गरिमापूर्ण गद्य अपनाया गया है। लंबे यूनानी-शैली संबंधवाचक वाक्यों को पठनीय विरामचिह्नों से व्यवस्थित किया गया, लेकिन तर्कक्रम और पुनरुक्ति सुरक्षित रखी गई। यह मसौदा दिए गए सार्वजनिक-क्षेत्र अंग्रेज़ी साक्षी पर आधारित है; प्रत्यक्ष यूनानी समीक्षा लंबित होने के कारण जहाँ पाठ संदिग्ध है वहाँ टिप्पणियाँ जोड़ी गई हैं।
