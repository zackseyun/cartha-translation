base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/010.yaml
  text: 'If you also desire this faith, first grasp the full knowledge of the Father.


    For God loved those for whose sake he made the world, to whom he subjected everything on earth, to whom he gave reason and understanding, whom alone he permitted to look up to heaven, whom he created in his own image, to whom he sent his only-begotten Son, to whom he promised the kingdom in heaven, and to whom he will give it—those who have loved him.


    And when you have attained this full knowledge, with what joy do you think you will be filled? How will you love him who loved you first?


    By loving him, you will imitate his goodness. Do not be amazed that a human being can imitate God. One can, if God wills it.


    For happiness does not consist in ruling over one’s neighbors, desiring to have more than weaker people, possessing wealth, or using force against inferiors. No one can imitate God in these matters; indeed, these things lie outside his greatness.


    But whoever takes upon himself his neighbor’s burden, whoever desires to benefit someone worse off in an area where he himself is better off, and whoever supplies those in need with possessions he received from God, becoming a god to those who receive them from him—this person imitates God.


    Then, although you are placed on earth, you will see that God lives in heaven. Then you will begin to declare the mysteries of God. Then you will both love and admire those who are punished because they refuse to deny God. Then you will condemn the deceit and error of the world, when you perceive the true life that is in heaven, when you despise the apparent death that is here on earth, and when you fear the real death reserved for those who will be condemned to the eternal fire, which will punish those delivered over to it until the end.


    Then you will admire those who endure, for righteousness’ sake, the fire that lasts only for a season, and you will count them blessed when you perceive that fire...'
translation:
  language: hi
  text: 'यदि तुम भी इस विश्वास की अभिलाषा रखते हो, तो पहले पिता का पूरा ज्ञान प्राप्त करो।


    क्योंकि परमेश्वर ने उनसे प्रेम किया, जिनके लिए उसने संसार बनाया; पृथ्वी की सब वस्तुएँ उनके अधीन कर दीं; उन्हें तर्क-बुद्धि और समझ दी; केवल उन्हें ही आकाश की ओर देखने की अनुमति दी; उन्हें अपने स्वरूप में बनाया; उनके पास अपने एकलौते पुत्र को भेजा; उनसे स्वर्ग के राज्य की प्रतिज्ञा की; और वह राज्य उन्हें देगा जिन्होंने उससे प्रेम किया है।[a]


    और जब तुम यह पूरा ज्ञान प्राप्त कर लोगे, तो सोचो, तुम कितने आनंद से भर जाओगे! जिसने पहले तुमसे ऐसा प्रेम किया, उससे तुम कितना प्रेम करोगे!


    उससे प्रेम करते हुए तुम उसकी भलाई का अनुकरण करोगे। इस पर अचंभा मत करो कि मनुष्य परमेश्वर का अनुकरण कर सकता है। यदि परमेश्वर की इच्छा हो, तो वह ऐसा कर सकता है।


    क्योंकि सुख अपने पड़ोसियों पर प्रभुता करने में नहीं है; न अपने से निर्बल लोगों से अधिक पाने की लालसा में; न धन रखने में; और न अपने से नीचे लोगों पर बल प्रयोग करने में। इन बातों में कोई परमेश्वर का अनुकरण नहीं कर सकता; बल्कि ये उसकी महानता से बाहर की बातें हैं।


    पर जो अपने पड़ोसी का बोझ अपने ऊपर लेता है; जो जिस बात में स्वयं समर्थ है, उसी में अभावग्रस्त व्यक्ति का भला करना चाहता है; और जो परमेश्वर से मिली अपनी वस्तुएँ ज़रूरतमंदों को देकर, उनसे पाने वालों के लिए मानो परमेश्वर बन जाता है—वही परमेश्वर का अनुकरण करता है।[b]


    तब, यद्यपि तुम पृथ्वी पर रखे गए हो, तुम देखोगे कि परमेश्वर स्वर्ग में वास करता है। तब तुम परमेश्वर के भेदों का वर्णन करना आरंभ करोगे। तब तुम उन लोगों से प्रेम करोगे और उनकी सराहना करोगे जिन्हें इसलिए दंड दिया जाता है कि वे परमेश्वर का इनकार नहीं करते। तब तुम संसार के छल और भ्रम को दोषी ठहराओगे—जब तुम स्वर्ग में स्थित सच्चे जीवन को पहचानोगे; जब पृथ्वी पर दिखाई देनेवाली मृत्यु को तुच्छ जानोगे; और जब उस वास्तविक मृत्यु से डरोगे जो उनके लिए रखी गई है जिन्हें अनन्त आग का दंड सुनाया जाएगा—वह आग, जो उसके हवाले किए गए लोगों को अंत तक दंड देगी।[c]


    तब तुम उन लोगों की सराहना करोगे जो धार्मिकता के कारण थोड़े समय की आग सहते हैं, और जब तुम उस आग को पहचानोगे... तब उन्हें धन्य मानोगे।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध साक्षी में ‘परमेश्वर ने प्रेम किया’ के बाद कर्म अनुपस्थित जान पड़ता है। यहाँ संदर्भ के आधार पर ‘उनसे’ न्यूनतम रूप से जोड़ा गया है; यूनानी स्रोत की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: पाठगत अभाव और संपादकीय पूर्ति को पारदर्शी बनाना।
  - marker: b
    text: '‘मानो’ मूल उपमा का अर्थ स्पष्ट करने के लिए है: दानी व्यक्ति ज़रूरतमंद के लिए परमेश्वर की भलाई का माध्यम बनता है; उसे स्वयं परमेश्वर नहीं ठहराया गया है।'
    reason: साहसपूर्ण प्राचीन रूपक को रखते हुए संभावित गलतफहमी रोकना।
  - marker: c
    text: यहाँ ‘अनन्त आग’ और ‘अंत तक’ दोनों उपलब्ध साक्षी के अनुसार रखे गए हैं; उनके संबंध को अनुवाद में अधिक निश्चित नहीं किया गया है।
    reason: वास्तविक अर्थगत और धर्मवैचारिक तनाव सुरक्षित रखना।
  - marker: d
    text: अंतिम दीर्घविराम उपलब्ध साक्षी के अधूरे पाठ को दर्शाता है।
    reason: पाठ की अपूर्णता को अनुमान से न भरना।
