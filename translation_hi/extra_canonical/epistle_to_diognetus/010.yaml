source:
  text: 'This faith if thou also desirest, apprehend first full knowledge of the Father.


    For God loved for whose sake He made the world, to whom He subjected all things that are in the earth, to whom He gave reason and mind, whom alone He permitted to look up to heaven, whom He created after His own image, to whom He sent His only begotten Son, to whom He promised the kingdom which is in heaven, and will give it to those that have loved Him.


    And when thou hast attained to this full knowledge, with what joy thinkest thou that thou wilt be filled, or how wilt thou love Him that so loved thee before?


    And loving Him thou wilt be an imitator of His goodness. And marvel not that a man can be an imitator of God. He can, if God willeth it.


    For happiness consisteth not in lordship over one''s neighbors, nor in desiring to have more than weaker men, nor in possessing wealth and using force to inferiors; neither can any one imitate God in these matters; nay, these lie outside His greatness.


    But whosoever taketh upon himself the burden of his neighbor, whosoever desireth to benefit one that is worse off in that in which he himself is superior, whosoever by supplying to those that are in want possessions which he received from God becomes a God to those who receive them from him, he is an imitator of God.


    Then, though thou art placed on earth, thou shalt behold that God liveth in heaven; then shalt thou begin to declare the mysteries of God; then shalt thou both love and admire those that are punished because they will not deny God; then shalt thou condemn the deceit and error of the world; when thou shalt perceive the true life which is in heaven, when thou shalt despise the apparent death which is here on earth, when thou shalt fear the real death, which is reserved for those that shall be condemned to the eternal fire that shall punish those delivered over to it unto the end.


    Then shalt thou admire those who endure for righteousness'' sake the fire that is for a season, and shalt count them blessed when thou perceivest that fire...'
