  revised_text: 'यदि तुम भी इस विश्वास को चाहते हो, तो पहले पिता का पूर्ण ज्ञान प्राप्त करो।


    क्योंकि परमेश्वर ने उनसे प्रेम किया, जिनके लिए उसने संसार बनाया; पृथ्वी की सारी वस्तुओं को उनके अधीन किया; उन्हें तर्क-बुद्धि और समझ दी; केवल उन्हें ही स्वर्ग की ओर देखने की अनुमति दी; उन्हें अपने स्वरूप के अनुसार बनाया; उनके पास अपने एकमात्र पुत्र को भेजा; उन्हें स्वर्ग के राज्य की प्रतिज्ञा दी; और वह राज्य उन्हें देगा जिन्होंने उससे प्रेम किया है।[a]


    और जब तुम यह पूर्ण ज्ञान प्राप्त कर लोगे, तो तुम किस आनन्द से भर जाओगे, ऐसा तुम क्या सोचते हो? जिसने पहले तुमसे इतना प्रेम किया, उससे तुम कितना प्रेम करोगे!


    और उससे प्रेम करके तुम उसकी भलाई का अनुकरण करोगे। इस बात पर अचंभा मत करो कि कोई मनुष्य परमेश्वर का अनुकरण कर सकता है। यदि परमेश्वर चाहे, तो वह ऐसा कर सकता है।


    क्योंकि सुख अपने पड़ोसियों पर प्रभुता करने में, अपने से निर्बल लोगों से अधिक पाने की इच्छा करने में, धन रखने में, या अपने से नीचे के लोगों पर बल प्रयोग करने में नहीं है। इन बातों में कोई परमेश्वर का अनुकरण नहीं कर सकता; बल्कि ये उसकी महानता के बाहर की बातें हैं।


    पर जो अपने पड़ोसी का बोझ अपने ऊपर लेता है, जो उस बात में, जिसमें वह स्वयं श्रेष्ठ है, किसी अधिक अभावग्रस्त व्यक्ति का भला करना चाहता है, और जो परमेश्वर से मिली वस्तुओं में से ज़रूरतमंदों को देता है और उनसे पाने वालों के लिए परमेश्वर बन जाता है—वही परमेश्वर का अनुकरण करता है।[b]


    तब, यद्यपि तुम पृथ्वी पर रखे गए हो, तुम देखोगे कि परमेश्वर स्वर्ग में रहता है। तब तुम परमेश्वर के रहस्यों का वर्णन करना आरंभ करोगे। तब तुम उन लोगों से प्रेम करोगे और उनकी सराहना करोगे जिन्हें इसलिए दंड दिया जाता है कि वे परमेश्वर का इनकार नहीं करते। तब तुम संसार के छल और भ्रम को दोषी ठहराओगे, जब तुम स्वर्ग में स्थित सच्चे जीवन को पहचानोगे, जब तुम पृथ्वी पर दिखाई देने वाली मृत्यु को तुच्छ जानोगे, और जब तुम उस वास्तविक मृत्यु से डरोगे जो उनके लिए रखी गई है जिन्हें उस अनन्त आग के लिए दंडित ठहराया जाएगा, जो उसके हवाले किए गए लोगों को अंत तक दंड देगी।[c]


    तब तुम उन लोगों की सराहना करोगे जो धार्मिकता के कारण थोड़े समय की आग सहते हैं, और जब तुम उस आग को पहचानोगे... तब उन्हें धन्य मानोगे।[d]'
