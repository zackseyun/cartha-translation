base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/015.yaml
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
translation:
  language: hi
  text: मैं ये बातें क्रेस्केंस के हाथ तुम्हें लिख रहा हूँ। मैंने हाल ही में उसकी सिफ़ारिश तुमसे की थी और अब फिर करता हूँ, क्योंकि हमारे बीच उसका आचरण निर्दोष रहा है; और मुझे विश्वास है कि तुम्हारे बीच भी वह वैसा ही रहेगा। जब उसकी बहन तुम्हारे पास आए, तो उसे भी मेरी ओर से सिफ़ारिश की हुई समझना। प्रभु यीशु मसीह में, अनुग्रह सहित, तुम और तुम्हारे सभी जन कुशल से रहो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: by Crescens
  choice: क्रेस्केंस के हाथ
  rationale: पत्र पहुँचाने में क्रेस्केंस की मध्यस्थ भूमिका को स्वाभाविक हिंदी में व्यक्त करता है; केवल ‘के द्वारा’ की अपेक्षा यह पत्रवाहक का भाव अधिक स्पष्ट रखता है।
- source_word: commended
  choice: सिफ़ारिश
  rationale: किसी व्यक्ति को समुदाय के स्वागत और भरोसे के योग्य बताने का आशय सुरक्षित रखता है।
- source_word: walked blamelessly
  choice: आचरण निर्दोष रहा है
  rationale: ‘चलना’ के सामी मुहावरे का अर्थ आधुनिक हिंदी में स्पष्ट करता है, जबकि नैतिक जीवन के आशय को बनाए रखता है।
- source_word: all yours
  choice: तुम्हारे सभी जन
  rationale: संबंधित घराने या समुदाय के लोगों की व्यापक और कुछ हद तक अस्पष्ट परिधि को संकीर्ण किए बिना स्वाभाविक हिंदी देता है।
- source_word: in grace
  choice: अनुग्रह सहित
  rationale: समापन अभिवादन में अनुग्रह की धार्मिक और संबंधपरक भाषा को बनाए रखता है।
theological_decisions:
- issue: ‘in the Lord Jesus Christ in grace’ में संबंध
  choice: प्रभु यीशु मसीह में, अनुग्रह सहित
  alternative: प्रभु यीशु मसीह के अनुग्रह में
  rationale: दोनों पदबंधों को अलग बनाए रखकर मूल गवाही की संभावित व्याकरणिक अस्पष्टता को एक ही संबंध में नहीं समेटा गया।
- issue: भविष्य या समान आचरण के कथन का अर्थ
  choice: मुझे विश्वास है कि तुम्हारे बीच भी वह वैसा ही रहेगा
  alternative: मुझे विश्वास है कि तुम्हारे बीच भी उसका आचरण वैसा ही रहा है
  rationale: आपूर्त अंग्रेज़ी गवाही और POB परत में भाव कुछ अस्पष्ट है; प्रसंगतः क्रेस्केंस के फिलिप्पी पहुँचने पर उसके भावी आचरण का विश्वास अधिक स्वाभाविक है, पर प्रत्यक्ष यूनानी/लातीनी समीक्षा लंबित होने के कारण इसे निर्णायक स्रोत-पाठ निष्कर्ष नहीं माना गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज पत्रात्मक शैली। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी गवाही पर आधारित अस्थायी अनुवाद है; यूनानी और लातीनी पांडुलिपि-परंपरा की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित है।
