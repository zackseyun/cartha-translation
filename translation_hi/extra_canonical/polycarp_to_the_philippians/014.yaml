base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/014.yaml
  text: 'You yourselves and Ignatius wrote to me, asking that if anyone should go to Syria, he might carry your letters there. And I will do this, if I get a suitable opportunity, either I myself or the one whom I shall send as an ambassador on your behalf also.


    The letters of Ignatius which were sent to us by him, and as many others as we had with us, we send to you, according as you gave charge; they are attached to this letter. From them you will be able to gain great advantage, for they comprise faith and endurance and every kind of edification that pertain to our Lord. Moreover, concerning Ignatius himself and those who were with him, if you have any reliable news, let us know.'
translation:
  language: hi
  text: 'तुम लोगों ने स्वयं, और इग्नातियुस ने भी, मुझे लिखा था। तुमने अनुरोध किया था कि यदि कोई सीरिया जाए, तो वह तुम्हारे पत्र वहाँ पहुँचा दे। उचित अवसर मिलने पर मैं ऐसा करूँगा—या तो स्वयं जाऊँगा, या उस व्यक्ति को भेजूँगा जिसे मैं तुम्हारी ओर से भी प्रतिनिधि बनाकर भेजूँगा।


    इग्नातियुस ने अपने जो पत्र हमें भेजे थे, और उनके अतिरिक्त जितने अन्य पत्र हमारे पास थे, वे सब तुम्हारे निर्देश के अनुसार हम तुम्हें भेज रहे हैं। वे इस पत्र के साथ संलग्न हैं। उनसे तुम्हें बहुत लाभ होगा, क्योंकि उनमें विश्वास, धीरज और हमारे प्रभु से संबंधित हर प्रकार की उन्नति की बातें हैं। इग्नातियुस और उसके साथियों के विषय में यदि तुम्हें कोई विश्वसनीय समाचार मिला हो, तो हमें बताना।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-क्षेत्र अंग्रेज़ी साक्ष्य के आधार पर तैयार किया गया है; यूनानी और लैटिन पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी शेष है।
    reason: उपलब्ध स्रोत-सामग्री की सीमा और पाठ की अस्थायी स्रोत-स्थिति पारदर्शी करना आवश्यक है।
lexical_decisions:
- source_word: ambassador
  choice: प्रतिनिधि
  rationale: यहाँ औपचारिक आधुनिक कूटनीतिक पद की अपेक्षा समुदाय की ओर से भेजे गए दूत का भाव है; ‘प्रतिनिधि’ सामान्य हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: endurance
  choice: धीरज
  rationale: यह कठिनाई में टिके रहने और सहनशील बने रहने, दोनों का भाव संक्षेप में व्यक्त करता है।
- source_word: edification
  choice: उन्नति
  rationale: ‘निर्माण’ का शाब्दिक रूप हिन्दी में यहाँ अस्वाभाविक होता; ‘उन्नति’ समुदाय के विश्वास और चरित्र को दृढ़ करने का भाव रखता है, बिना ‘आत्मिक’ शब्द जोड़कर अर्थ को अनावश्यक रूप से सीमित किए।
- source_word: sure tidings
  choice: विश्वसनीय समाचार
  rationale: प्रामाणिक या भरोसेमंद सूचना के आशय को आधुनिक, सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘faith and endurance and every kind of edification, which pertaineth unto our Lord’ में संबंध की व्याप्ति
  choice: ‘विश्वास, धीरज और हमारे प्रभु से संबंधित हर प्रकार की उन्नति की बातें’
  alternative: ‘हमारे प्रभु में विश्वास और धीरज तथा हर प्रकार की उन्नति’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में संबंधवाचक पद पूरे कथन या ‘हर प्रकार की उन्नति’ से जुड़ सकता है। अनुवाद ने ‘हमारे प्रभु’ को केवल ‘विश्वास’ का कर्म बनाकर संभावित व्याकरणिक तनाव को नहीं मिटाया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामुदायिक पत्राचार के अनुरूप शैली रखी गई है। बहुवचन संबोधन के लिए ‘तुम’ के रूपों का प्रयोग किया गया है; पुरातन या अत्यधिक औपचारिक भाषा से बचा गया है।
