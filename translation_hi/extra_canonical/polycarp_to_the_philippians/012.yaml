review_pass:
  verdict: revise
  source_fidelity: 'The draft generally follows the supplied English witness closely and appropriately retains the difficult ‘letters’ image. A few renderings can be made more faithful in Hindi idiom: the Gentiles clause should clearly express being judged ‘as’ Gentiles; the corporate body image should not sound like an individual physical body; and ‘sober’ is better rendered as ‘संयमी’ in this moral context. The source-language text is not supplied directly, so the retained textual-ambiguity notes remain appropriate.'
  naturalness: Modern Hindi is mostly clear, but ‘फिर से बहाल करो,’ ‘अपनी पूरी देह,’ and ‘उन्नत करते हो’ are somewhat awkward or misleading in this context. ‘पुनःस्थापित करो,’ ‘पूरा शरीर,’ and ‘निर्माण करते हो’ are more natural while preserving the communal-body metaphor.
  terminology: ‘प्राचीन’ is an acceptable non-denominational rendering of presbyter when briefly explained. ‘लोभ,’ ‘मूर्तिपूजा,’ ‘गैर-यहूदी,’ ‘पश्चाताप,’ and ‘पवित्र जन’ are suitable. ‘संयमी’ better represents the ethical sense of sober than ‘सचेत.’
  issues:
  - severity: medium
    issue: ‘उन गैर-यहूदियों में से एक के समान उसका न्याय होगा’ is grammatically and idiomatically strained.
    rationale: The witness says that such a person will be judged as one of the Gentiles. ‘गैर-यहूदियों के समान उसका न्याय किया जाएगा’ conveys this relation clearly without changing its force.
  - severity: medium
    issue: ‘ताकि तुम अपनी पूरी देह को बचा सको’ can be read as saving one’s physical body.
    rationale: The witness uses a corporate body image. ‘ताकि तुम पूरे शरीर को बचा सको’ retains the metaphor more naturally in Hindi; the immediately preceding ‘अंग’ supports the communal reference.
  - severity: low
    issue: ‘उन्नत करते हो’ is not the most natural rendering of mutual edification here.
    rationale: ‘एक-दूसरे का निर्माण करते हो’ is established, comprehensible Hindi for mutual strengthening/building up and better reflects the metaphorical language.
  - severity: low
    issue: ‘सचेत रहो’ weakens the ethical self-control nuance of ‘be sober.’
    rationale: ‘संयमी रहो’ is concise, natural, and fits the surrounding exhortation about self-control and restoration.
  - severity: low
    issue: The wording on the churches’ knowledge of God is unnecessarily awkward.
    rationale: ‘जिन्हीं ने उस समय केवल परमेश्वर को जाना था’ is not intended; the revised wording ‘जो उस समय अकेली परमेश्वर को जानती थीं’ is retained but smoothed to ‘जो उस समय केवल वही थीं जो परमेश्वर को जानती थीं,’ preserving the supplied witness’s referential sense.
