    reason: असामान्य रूपक और स्रोतगत अनिश्चितता को छिपाने के बजाय सुरक्षित रखना।
  - marker: c
    text: “जो उस समय अकेली परमेश्वर को जानती थीं” का संबंध उपलब्ध साक्ष्य में व्याकरण की दृष्टि से अस्पष्ट है। अनुवाद निकटतम सतही अर्थ को रखता है; प्राचीन भाषा के पाठ की समीक्षा से वाक्य-विन्यास स्पष्ट हो सकता है।
    reason: वास्तविक अस्पष्टता को किसी एक व्याख्या से चुपचाप हल न करना।
lexical_decisions:
- source_word: presbyter
  choice: प्राचीन
  rationale: आरम्भिक मसीही समुदाय के पद को आधुनिक हिन्दी बाइबलीय प्रयोग में समझने योग्य ढंग से व्यक्त करता है, बिना किसी बाद की विशिष्ट पंथीय पद-व्यवस्था को आरोपित किए।
- source_word: covetousness / greed
  choice: लोभ
  rationale: धन या वस्तुओं की लालसा के नैतिक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: Gentiles
  choice: गैर-यहूदी
  rationale: जातीय-धार्मिक भेद को आधुनिक पाठक के लिए स्पष्ट करता है; 'अन्यजाति' की अपेक्षा अधिक सहज है।
- source_word: sober
  choice: सचेत
  rationale: यहाँ नशामुक्ति के संकीर्ण अर्थ के बजाय नैतिक सतर्कता और संयम अभिप्रेत है।
- source_word: restore
  choice: फिर से बहाल करो
  rationale: भटके सदस्यों को दण्ड मात्र देने के बजाय समुदाय में पुनर्स्थापित करने का भाव सुरक्षित रखता है।
- source_word: edify
  choice: उन्नत करते हो
  rationale: परस्पर आत्मिक और नैतिक निर्माण का अर्थ सहज आधुनिक हिन्दी में देता है।
theological_decisions:
- issue: लोभ और मूर्तिपूजा का संबंध
  choice: वह मूर्तिपूजा से अशुद्ध हो जाएगा
  alternative: वह मूर्तिपूजक ठहरेगा
  rationale: साक्ष्य में दिए गए 'defiled by idolatry' को सीधे रखते हुए लोभ और मूर्तिपूजा की पहचान को उससे अधिक कठोर या व्यवस्थित नहीं किया गया।
- issue: पवित्र जनों द्वारा संसार का न्याय
  choice: पवित्र जन संसार का न्याय करेंगे
  alternative: संत संसार पर शासन करेंगे
  rationale: पौलुस-संबंधी न्याय की स्पष्ट भाषा को सुरक्षित रखा गया और उसे केवल शासन के अर्थ में नहीं बदला गया।
- issue: समुदाय की देह को बचाना
  choice: अपनी पूरी देह को बचा सको
  alternative: अपनी पूरी मण्डली को सुरक्षित रख सको
  rationale: मूल साक्ष्य के सामुदायिक देह-रूपक और 'बचाने' की तनावपूर्ण भाषा को व्याख्यात्मक रूप से हल किए बिना बनाए रखा गया।
- issue: वालेंस और उसकी पत्नी के लिए पश्चाताप
  choice: प्रभु उन्हें सच्चा पश्चाताप प्रदान करे
  alternative: प्रभु उन्हें वास्तव में मन फिराने की सामर्थ्य दे
  rationale: पश्चाताप को ईश्वरीय प्रदान के रूप में व्यक्त करने वाली प्रार्थना को बरकरार रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और साधारण पाठकों के लिए सुबोध। बहुवचन संबोधन के लिए “तुम” रखा गया है, जिससे पत्र का सामुदायिक और आत्मीय स्वर बना रहे। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी और लातीनी परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण दो कठिन वाक्यों पर स्पष्ट पाठालोचनात्मक टिप्पणियाँ दी गई हैं।
