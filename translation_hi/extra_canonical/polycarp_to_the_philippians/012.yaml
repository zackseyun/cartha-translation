base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/012.yaml
  text: 'I was deeply grieved for Valens, who was formerly a presbyter among you, because he understands so little of the office entrusted to him. Therefore, I warn you to keep away from greed and to be pure and truthful. Keep away from every evil.


    But if someone cannot control himself in these matters, how can he command another to do so? If anyone does not keep away from greed, he will be defiled by idolatry and judged as one of the Gentiles who do not know the judgment of the Lord. Nay, do we not know that the saints will judge the world, as Paul teaches?


    But I have neither found nor heard of any such thing among you, among whom the blessed Paul labored and who were his letters in the beginning. For he boasts about you in all those churches that alone knew God at that time; for we did not yet know Him.


    Therefore, I am deeply grieved for him and for his wife, to whom may the Lord grant true repentance. You yourselves also must be sober in this matter. Do not regard such people as enemies, but restore them as frail and erring members, so that you may save the whole body of you. For by doing this, you build one another up.'
translation:
  language: hi
  text: '**पॉलिकार्प का फिलिप्पियों के नाम पत्र 11**


    मैं वालेंस के कारण बहुत दुःखी हुआ। वह पहले तुम्हारे बीच प्राचीन[a] था, फिर भी उसे सौंपे गए पद की समझ उसमें कितनी कम है! इसलिए मैं तुम्हें चेतावनी देता हूँ कि लोभ से दूर रहो और शुद्ध तथा सत्यवादी बने रहो। हर प्रकार की बुराई से दूर रहो।


    पर जो इन बातों में अपने आप पर नियंत्रण नहीं रख सकता, वह किसी दूसरे को इनका आदेश कैसे दे सकता है? यदि कोई लोभ से दूर नहीं रहता, तो वह मूर्तिपूजा से अशुद्ध हो जाएगा और उन गैर-यहूदियों में से एक के समान उसका न्याय होगा जो प्रभु के न्याय को नहीं जानते। बल्कि, क्या हम नहीं जानते कि पवित्र जन संसार का न्याय करेंगे, जैसा पौलुस सिखाता है?


    पर मैंने तुम्हारे बीच ऐसी कोई बात न तो पाई है, न सुनी है। तुम्हारे बीच धन्य पौलुस ने परिश्रम किया, और आरम्भ में तुम उसके पत्र थे।[b] वह उन सभी कलीसियाओं में तुम्हारी प्रशंसा करता है जो उस समय अकेली परमेश्वर को जानती थीं; क्योंकि हम तब तक उसे नहीं जानते थे।[c]


    इसलिए मैं उसके और उसकी पत्नी के कारण बहुत दुःखी हूँ। प्रभु उन्हें सच्चा पश्चाताप प्रदान करे। इस मामले में तुम स्वयं भी सचेत रहो। ऐसे लोगों को शत्रु न मानो, बल्कि उन्हें निर्बल और भटके हुए अंग जानकर फिर से बहाल करो, ताकि तुम अपनी पूरी देह को बचा सको। ऐसा करने से तुम एक-दूसरे को उन्नत करते हो।'
