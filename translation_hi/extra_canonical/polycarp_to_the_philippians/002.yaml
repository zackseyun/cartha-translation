base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/002.yaml
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
translation:
  language: hi
  text: 'हमारे प्रभु यीशु मसीह में मुझे आपके साथ बहुत आनन्द हुआ, क्योंकि आपने सच्चे प्रेम के अनुयायियों का स्वागत किया और, जैसा आपके लिए उचित था, उन्हें आगे की यात्रा के लिए विदा किया—उन पुरुषों को जो पवित्र बेड़ियों से घिरे हैं; ये बेड़ियाँ उन लोगों के मुकुट हैं जिन्हें सचमुच परमेश्वर और हमारे प्रभु ने चुना है।


    मुझे इस बात का भी आनन्द हुआ कि आपके विश्वास की दृढ़ जड़, जो आरम्भिक समय से प्रसिद्ध रही है, अब तक बनी हुई है और हमारे प्रभु यीशु मसीह के लिए फल लाती है। उन्होंने हमारे पापों के कारण मृत्यु तक का सामना सहा; परमेश्वर ने अधोलोक की पीड़ाओं को खोलकर उन्हें जिलाया।[a] यद्यपि आपने उन्हें देखा नहीं, फिर भी आप उन पर ऐसे आनन्द के साथ विश्वास करते हैं जो वर्णन से परे और महिमा से भरा है। बहुत-से लोग इस आनन्द में प्रवेश करना चाहते हैं, क्योंकि आप जानते हैं कि आपका उद्धार अनुग्रह से हुआ है—कामों से नहीं, बल्कि यीशु मसीह के द्वारा परमेश्वर की इच्छा से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी के “releasing the pains of Hades” पर आधारित है। यूनानी और लैटिन पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है; इसलिए इस वाक्यांश का ठीक पाठ और अर्थ पुनः जाँचा जाना चाहिए।
    reason: मूल-भाषा समीक्षा लंबित है और यह वाक्यांश पाठगत तथा अर्थगत रूप से संवेदनशील है।
lexical_decisions:
- source_word: true Love
  choice: सच्चा प्रेम
  rationale: उपलब्ध अंग्रेज़ी साक्षी के अर्थ और उसके विशेष बल को सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है; देवनागरी में अनावश्यक अंग्रेज़ी-शैली का बड़े अक्षर वाला भेद संभव नहीं।
- source_word: saintly bonds
  choice: पवित्र बेड़ियाँ
  rationale: यह कैद की वास्तविक जंजीरों और सम्मानसूचक रूपक—दोनों को बनाए रखता है।
- source_word: diadems
  choice: मुकुट
  rationale: सामान्य पाठक के लिए सहज शब्द है और सम्मान तथा विजय के रूपक को व्यक्त करता है।
- source_word: steadfast root
  choice: दृढ़ जड़
  rationale: विश्वास की स्थिरता और फल लाने वाले वनस्पति-रूपक दोनों को सुरक्षित रखा गया है।
- source_word: Hades
  choice: अधोलोक
  rationale: इसे सीधे 'नरक' कहना दंड-स्थान का अधिक निश्चित अर्थ ला सकता था; 'अधोलोक' मृतकों के लोक की व्यापक प्राचीन अवधारणा को बेहतर सुरक्षित रखता है।
- source_word: by grace ... not of works
  choice: अनुग्रह से ... कामों से नहीं
  rationale: धर्मवैचारिक वाक्य-विन्यास को बिना व्याख्यात्मक विस्तार के स्पष्ट और निकट रखा गया है।
theological_decisions:
- issue: ‘God and our Lord’ में चयनकर्ता की व्याकरणिक पहचान
  choice: ‘जिन्हें सचमुच परमेश्वर और हमारे प्रभु ने चुना है’
  alternative: ‘जो सचमुच परमेश्वर और हमारे प्रभु के चुने हुए हैं’
  rationale: उपलब्ध साक्षी की संयुक्त अभिव्यक्ति को बनाए रखा गया है; उसे केवल परमेश्वर या केवल प्रभु से जोड़कर तनाव समाप्त नहीं किया गया।
- issue: मसीह का मृत्यु और पुनरुत्थान से संबंध
  choice: यीशु ने मृत्यु का सामना सहा और परमेश्वर ने उन्हें जिलाया
  alternative: यीशु स्वयं जी उठे
  rationale: प्राप्त पाठ में कर्ताओं का भेद स्पष्ट है, इसलिए उसे ज्यों का त्यों रखा गया है।
- issue: उद्धार में अनुग्रह, कर्म और परमेश्वर की इच्छा
  choice: ‘अनुग्रह से ... कामों से नहीं, बल्कि ... परमेश्वर की इच्छा से’
  alternative: किसी विशेष सम्प्रदायगत उद्धार-सिद्धान्त के अनुसार इसका विस्तार
  rationale: पाठ के कथन को सुरक्षित रखा गया है और अनुग्रह, कर्म तथा इच्छा के परस्पर संबंध की अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: अधोलोक की पीड़ाओं को खोलना
  choice: शाब्दिक रूपक को रखा गया और पाठांतर-संबंधी सावधानी पादटिप्पणी में दी गई
  alternative: ‘मृत्यु के बन्धन तोड़कर’ या ‘नरक की पीड़ा समाप्त करके’
  rationale: प्रत्यक्ष यूनानी/लैटिन समीक्षा लंबित होने के कारण किसी अधिक परिचित बाइबिलीय वाक्यांश से अनिश्चितता को चुपचाप नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली रखी गई है। बहुवचन आदरसूचक ‘आप’ फिलिप्पी की कलीसिया के सामूहिक संबोधन के लिए प्रयुक्त है। वाक्यों को पठनीय बनाया गया है, पर मूल साक्षी के रूपक, पुनरुक्तियाँ और धर्मवैचारिक तनाव यथासंभव सुरक्षित हैं। यह मसौदा अनिवार्य रूप से अस्थायी है, क्योंकि प्रत्यक्ष यूनानी और लैटिन स्रोत-समीक्षा अभी उपलब्ध नहीं है।
