  text: 'पॉलीकार्प और जो प्राचीन उनके साथ हैं, उनकी ओर से फिलिप्पी में परदेशी होकर रहने वाली परमेश्वर की कलीसिया के नाम: सर्वशक्तिमान परमेश्वर और हमारे उद्धारकर्ता यीशु मसीह की ओर से तुम्हें दया और शान्ति बहुतायत से मिले।'
  philosophy: optimal-equivalence
