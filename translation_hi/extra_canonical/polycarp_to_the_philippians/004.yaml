base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/004.yaml
  text: 'Brothers, I write these things to you concerning righteousness, not because I laid this charge upon myself, but because you invited me.


    For neither I nor anyone else like me is able to follow the wisdom of the blessed and glorious Paul, who, when he came among you, carefully and surely taught face to face with the men of that day the word concerning truth; and who also, when he was absent, wrote a letter to you. If you look diligently into it, you will be able to be built up unto the faith given to you,


    which is the mother of us all, while hope follows after and love goes before—love toward God and Christ and toward our neighbor. For if anyone is occupied with these, that person has fulfilled the commandment of righteousness; for whoever has love is far from all sin.'
translation:
  language: hi
  text: 'भाइयो, धार्मिकता के विषय में मैं ये बातें तुम्हें इसलिए नहीं लिख रहा कि मैंने अपने ऊपर यह दायित्व ले लिया था, बल्कि इसलिए कि तुमने मुझसे ऐसा करने का अनुरोध किया था।


    क्योंकि न तो मैं, न मेरे जैसा कोई और, धन्य और महिमामय पौलुस की बुद्धि के पदचिह्नों पर चलने में समर्थ है। जब वह तुम्हारे बीच आया था, तब उसने उस समय के लोगों के सामने सत्य से संबंधित वचन को आमने-सामने सावधानी और दृढ़ता से सिखाया था। फिर जब वह तुमसे दूर था, तब उसने तुम्हें एक पत्र भी लिखा। यदि तुम उसका ध्यानपूर्वक अध्ययन करोगे, तो उस विश्वास में दृढ़ और उन्नत हो सकोगे जो तुम्हें दिया गया है।


    यह विश्वास हम सबकी माता है; आशा उसके पीछे चलती है और प्रेम उसके आगे—परमेश्वर और मसीह के प्रति तथा हमारे पड़ोसी के प्रति प्रेम। जो कोई इन बातों में लगा रहता है, उसने धार्मिकता की आज्ञा पूरी की है; क्योंकि जिसमें प्रेम है, वह हर पाप से दूर रहता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित अस्थायी प्रारूप है। यूनानी और लातीनी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी शेष है; विशेषकर ‘हम सबकी माता’ के संदर्भ और कुछ वाक्य-संबंधों की पुनः जाँच आवश्यक है।
    reason: प्रदान किया गया मूल-भाषा खंड वास्तव में अंग्रेज़ी अनुवाद-साक्ष्य है और स्रोत-भाषा समीक्षा लंबित बताई गई है; इसलिए प्रकाशन में प्रमाणिक सीमा स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: righteousness
  choice: धार्मिकता
  rationale: यह शब्द नैतिक न्यायपरायणता और परमेश्वर के अनुरूप सही आचरण—दोनों का व्यापक अर्थ बनाए रखता है।
- source_word: follow the wisdom
  choice: बुद्धि के पदचिह्नों पर चलना
  rationale: सिर्फ बौद्धिक समझ नहीं, बल्कि पौलुस की शिक्षा और उदाहरण का अनुसरण करने का भाव प्राकृतिक हिन्दी में व्यक्त होता है।
- source_word: word concerning truth
  choice: सत्य से संबंधित वचन
  rationale: ‘वचन’ आरम्भिक मसीही शिक्षण का गरिमापूर्ण भाव रखता है, जबकि ‘सत्य से संबंधित’ मूल साक्ष्य की कुछ असामान्य संरचना को अति-व्याख्यायित नहीं करता।
- source_word: built up unto the faith
  choice: उस विश्वास में दृढ़ और उन्नत
  rationale: निर्माण-रूपक का आशय सुबोध हिन्दी में देता है और विश्वास में आध्यात्मिक वृद्धि का अर्थ सुरक्षित रखता है।
- source_word: mother of us all
  choice: हम सबकी माता
  rationale: मूल रूपक को बिना नरम या व्याख्यायित किए यथावत रखा गया है।
- source_word: neighbor
  choice: पड़ोसी
  rationale: शास्त्रीय नैतिक अर्थ में निकट के मनुष्य अथवा सहमनुष्य को दर्शाने वाला परिचित हिन्दी पद।
theological_decisions:
- issue: ‘हम सबकी माता’ का निकटतम पूर्वपद
  choice: इसे ‘विश्वास’ से जोड़ा गया है
  alternative: पूरी विश्वास-आशा-प्रेम त्रयी या धार्मिकता से जोड़ना
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य में व्याकरणतः निकटतम पूर्वपद ‘faith’ है; फिर भी स्रोत-भाषा की प्रत्यक्ष समीक्षा लंबित होने के कारण रूपक को बिना अतिरिक्त सिद्धान्तगत व्याख्या के रखा गया है।
- issue: प्रेम रखने वाला ‘हर पाप से दूर’ है
  choice: दावे की प्रबलता सुरक्षित रखी गई है
  alternative: इसे ‘पाप से बचने का प्रयत्न करता है’ जैसे नरम कथन में बदलना
  rationale: पाठ नैतिक आदर्श को स्पष्ट और निरपेक्ष रूप में रखता है; इसे संप्रदायगत पापहीनता-सिद्धान्त या केवल प्रयत्न के कथन में नहीं बदला गया।
- issue: परमेश्वर और मसीह का उल्लेख
  choice: दोनों को पाठानुसार अलग-अलग नामित रखा गया है
  alternative: त्रित्ववादी व्याख्यात्मक भाषा जोड़ना
  rationale: पाठ की वास्तविक शब्दावली और धर्मवैज्ञानिक तनाव को बनाए रखने के लिए कोई अतिरिक्त सूत्रीकरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। बहुवचन संबोधन के लिए ‘तुम’ रखा गया है, जो पत्र की आत्मीयता दर्शाता है। पौलुस की शिक्षा से संबंधित लंबे वाक्य को पठनीयता के लिए विभाजित किया गया है, पर तर्कक्रम और रूपक सुरक्षित रखे गए हैं।
