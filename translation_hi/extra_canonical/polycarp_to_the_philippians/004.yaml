    rationale: The English witness says “follow the wisdom,” not follow footprints. “बुद्धि का अनुसरण” is direct and avoids adding a concrete metaphor.
  - severity: medium
    issue: “हर पाप से दूर रहता है” changes a stative assertion into a habitual-action formulation
    rationale: “Is far from all sin” is more closely rendered as “हर पाप से दूर है.”
