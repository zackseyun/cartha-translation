  terminology: “धार्मिकता,” “विश्वास,” “प्रेम,” “परमेश्वर,” “मसीह,” and “पड़ोसी” are suitable and consistent. “सत्य से संबंधित वचन” preserves the supplied witness’s slightly marked expression without doctrinal expansion. The maternal metaphor remains unaltered.
