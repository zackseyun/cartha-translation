base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/005.yaml
  text: 'But the love of money is the beginning of all troubles. Therefore, knowing that we brought nothing into the world and cannot carry anything out, let us arm ourselves with the armor of righteousness, and let us first teach ourselves to walk in the commandment of the Lord;


    and then teach our wives also to walk in the faith that has been given to them, and in love and purity, cherishing their own husbands in all truth, loving everyone equally in all chastity, and training their children in the discipline of the fear of God.


    Our widows must be sober-minded concerning the faith of the Lord, interceding without ceasing for everyone, abstaining from all slander, evil speaking, false witness, love of money, and every evil thing. They know that they are God’s altar, that all sacrifices are carefully inspected, and that nothing escapes him—neither their thoughts, their intentions, nor any of the secret things of the heart.'
translation:
  language: hi
  text: 'पर धन का प्रेम सभी मुसीबतों की शुरुआत है। इसलिए, यह जानते हुए कि हम संसार में कुछ भी लेकर नहीं आए और न कुछ बाहर ले जा सकते हैं, आओ हम धार्मिकता के हथियारों से अपने आपको सुसज्जित करें और पहले स्वयं को प्रभु की आज्ञा के अनुसार चलना सिखाएँ।


    फिर अपनी पत्नियों को भी सिखाएँ कि वे उस विश्वास में, जो उन्हें दिया गया है, और प्रेम तथा पवित्रता में चलें; पूरी सच्चाई से अपने-अपने पतियों को प्रिय जानें, पूरी शुद्धता के साथ सभी से समान प्रेम करें, और परमेश्वर के भय के अनुशासन में अपने बच्चों को प्रशिक्षित करें।


    हमारी विधवाएँ प्रभु में विश्वास के विषय में संयमी मन वाली हों; वे सब लोगों के लिए निरंतर विनती करती रहें और हर प्रकार की निंदा, बुरी बात, झूठी गवाही, धन के प्रेम और हर बुरी वस्तु से दूर रहें। वे जानें कि वे परमेश्वर की वेदी हैं[a], कि हर बलिदान को ध्यान से परखा जाता है, और उनकी कोई भी बात उससे छिपी नहीं रहती—न उनके विचार, न उनके इरादे और न हृदय की कोई गुप्त बात।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर की वेदी’ एक रूपक है। संभवतः आशय यह है कि विधवाओं की निरंतर प्रार्थनाएँ परमेश्वर के सामने चढ़ाए जाने वाले बलिदानों के समान हैं; फिर भी उपलब्ध पाठ स्वयं विधवाओं को ही ‘वेदी’ कहता है।
    reason: मूल रूपक आधुनिक पाठक के लिए कठिन है और उसका निहितार्थ निश्चित रूप से स्पष्ट नहीं; पादटिप्पणी संभावित अर्थ बताती है, पर अस्पष्टता बनाए रखती है।
lexical_decisions:
- source_word: love of money
  choice: धन का प्रेम
  rationale: मूल साक्ष्य में प्रयुक्त नैतिक संज्ञा को स्पष्ट और सामान्य आधुनिक हिन्दी में रखा गया; ‘लोभ’ अधिक व्याख्यात्मक और व्यापक हो सकता था।
- source_word: armor of righteousness
  choice: धार्मिकता के हथियार
  rationale: सैन्य रूपक सुरक्षित रखा गया। ‘कवच’ अकेला पूरे armor का अर्थ संकुचित कर सकता है, इसलिए बहुवचन ‘हथियारों’ से सुसज्जित होने की छवि व्यक्त की गई।
- source_word: walk in the commandment
  choice: आज्ञा के अनुसार चलना
  rationale: सेमिटिक-आरंभिक मसीही ‘चलने’ के नैतिक रूपक को स्वाभाविक हिन्दी के साथ बनाए रखा गया।
- source_word: cherishing
  choice: प्रिय जानें
  rationale: पति के प्रति स्नेहपूर्ण आदर का भाव रखा गया, बिना अधीनता जैसी अतिरिक्त धारणा जोड़े।
- source_word: sober-minded
  choice: संयमी मन वाली
  rationale: यह मानसिक सजगता और आत्मसंयम दोनों को व्यक्त करता है; इसे केवल मद्यत्याग तक सीमित नहीं किया गया।
- source_word: God's altar
  choice: परमेश्वर की वेदी
  rationale: मूल धार्मिक रूपक को ज्यों का त्यों रखा गया, यद्यपि उसका आशय पूर्णतः स्पष्ट नहीं है।
theological_decisions:
- issue: ‘वे परमेश्वर की वेदी हैं’ का रूपक
  choice: रूपक को सीधे सुरक्षित रखा गया और संक्षिप्त पादटिप्पणी दी गई।
  alternative: इसे ‘उनकी प्रार्थनाएँ परमेश्वर को चढ़ाया हुआ बलिदान हैं’ कहकर स्पष्ट करना।
  rationale: ऐसी व्याख्या पाठ में निहित हो सकती है, पर उपलब्ध साक्ष्य सीधे विधवाओं को वेदी कहता है; अतः अस्पष्टता को समाप्त नहीं किया गया।
- issue: faith of the Lord
  choice: प्रभु में विश्वास
  alternative: प्रभु का विश्वास / प्रभु के विश्वास के विषय में
  rationale: अंग्रेज़ी साक्ष्य का संबंधवाचक वाक्यांश अस्पष्ट है। सहज हिन्दी के लिए ‘प्रभु में विश्वास’ चुना गया, पर इसे किसी विशिष्ट सिद्धान्त के रूप में विस्तृत नहीं किया गया।
- issue: ‘all men equally’ का विस्तार
  choice: सभी से समान प्रेम करें
  alternative: सभी पुरुषों से समान प्रेम करें
  rationale: संदर्भ सार्वभौमिक निष्पक्ष प्रेम का है; आधुनिक हिन्दी में ‘सब लोगों’ का आशय अधिक स्वाभाविक और लैंगिक रूप से अनावश्यक संकुचन से मुक्त है।
- issue: God के लिए सर्वनाम
  choice: ‘उससे’ का प्रयोग
  alternative: ‘परमेश्वर से’ को पुनः दोहराना
  rationale: संदर्भ स्पष्ट रखते हुए हिन्दी प्रवाह बनाया गया; परमेश्वर के लिंग के विषय में अतिरिक्त दार्शनिक दावा नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक उपदेश के अनुरूप रखी गई है। ‘आओ हम’ और आज्ञार्थक बहुवचन मूल के सामूहिक आग्रह को व्यक्त करते हैं। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य है; यूनानी और लैटिन पांडुलिपि-परंपरा की प्रत्यक्ष स्रोत-भाषाई समीक्षा लंबित होने के कारण सूक्ष्म वाक्यगत और शब्दगत निर्णय अनंतिम माने जाएँ।
