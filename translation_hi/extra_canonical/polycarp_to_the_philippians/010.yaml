base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/010.yaml
  text: 'Therefore, I urge all of you to obey the word of righteousness and to practice all endurance, which you saw with your own eyes in the blessed Ignatius, Zosimus, and Rufus, and also in others who came from among you, as well as in Paul himself and the rest of the apostles;


    being convinced that none of these ran in vain, but in faith and righteousness, and that they are in their rightful place in the presence of the Lord, with whom they also suffered. For they did not love the present world, but the one who died for our sake and was raised by God for us.'
translation:
  language: hi
  text: 'इसलिए मैं तुम सबको प्रोत्साहित करता हूँ कि धार्मिकता के वचन का पालन करो और हर प्रकार का धीरज धरो। यह धीरज तुमने स्वयं धन्य इग्नातियुस, ज़ोसिमुस और रूफुस में देखा; और उन दूसरे लोगों में भी, जो तुम्हारे बीच से निकले थे, तथा स्वयं पौलुस और शेष प्रेरितों में भी।


    तुम्हें यह दृढ़ विश्वास है कि इनमें से कोई भी व्यर्थ नहीं दौड़ा, बल्कि विश्वास और धार्मिकता में दौड़ा; और वे प्रभु की उपस्थिति में अपने उचित स्थान पर हैं—उसी प्रभु के साथ उन्होंने दुःख भी सहा।[a] क्योंकि उन्होंने इस वर्तमान संसार से प्रेम नहीं किया, बल्कि उससे प्रेम किया जो हमारे लिए मरा और जिसे परमेश्वर ने हमारे लिए मरे हुओं में से जिलाया।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसी प्रभु के साथ’ उपलब्ध अंग्रेज़ी साक्ष्य में संबंधवाचक वाक्यांश का सबसे स्वाभाविक संदर्भ है; यूनानी और लातीनी पाठ-परंपरा की प्रत्यक्ष समीक्षा अभी लंबित है।
    reason: सर्वनाम के संदर्भ में संभावित अस्पष्टता तथा स्रोत-समीक्षा की सीमा बताना।
  - marker: b
    text: यहाँ ‘जिलाया’ का आशय मरे हुओं में से जिलाए जाने से है; वाक्य में परमेश्वर को इस कार्य का कर्ता बताया गया है।
    reason: हिन्दी में पुनरुत्थान-संदर्भ को स्वाभाविक और स्पष्ट बनाना, जबकि मूल धर्मशास्त्रीय कर्तृता बनाए रखना।
lexical_decisions:
- source_word: word of righteousness
  choice: धार्मिकता का वचन
  rationale: मूल साक्ष्य में उपस्थित संक्षिप्त और संभवतः तकनीकी अभिव्यक्ति को व्याख्यात्मक रूप से ‘धार्मिक शिक्षा’ बनाने के बजाय उसकी व्यापकता बनाए रखी गई है।
- source_word: practice all endurance
  choice: हर प्रकार का धीरज धरो
  rationale: शाब्दिक ‘समस्त सहनशीलता का अभ्यास करो’ की अस्वाभाविकता से बचते हुए निरंतर धीरजपूर्ण आचरण का भाव रखा गया है।
- source_word: ran not in vain
  choice: व्यर्थ नहीं दौड़ा
  rationale: दौड़ की प्रेरितिक रूपक-भाषा को मिटाने के बजाय हिन्दी में ज्यों का त्यों बनाए रखा गया है।
- source_word: in faith and righteousness
  choice: विश्वास और धार्मिकता में
  rationale: विश्वास तथा धार्मिकता के बीच मूल समानांतर संबंध को बिना अतिरिक्त धर्मशास्त्रीय व्याख्या के सुरक्षित रखा गया है।
- source_word: present world
  choice: वर्तमान संसार
  rationale: यह वर्तमान युग/जगत दोनों की ओर संकेत कर सकता है; उपलब्ध अंग्रेज़ी साक्ष्य के निकट रहते हुए व्यापक हिन्दी पद चुना गया है।
theological_decisions:
- issue: ‘with whom they also suffered’ में संबंधवाचक सर्वनाम का संदर्भ
  choice: ‘उसी प्रभु के साथ उन्होंने दुःख भी सहा’
  alternative: ‘जिन लोगों के साथ उन्होंने भी दुःख सहा’
  rationale: उपलब्ध साक्ष्य में निकटतम एकवचन पूर्वपद ‘प्रभु’ है। फिर भी स्रोत-भाषा की प्रत्यक्ष समीक्षा लंबित होने के कारण संदर्भगत अनिश्चितता को पादटिप्पणी में स्वीकार किया गया है।
- issue: ‘the one who died’ की पहचान
  choice: ‘उससे ... जो हमारे लिए मरा’
  alternative: स्पष्ट रूप से ‘यीशु मसीह से’
  rationale: संदर्भ स्पष्ट रूप से मसीह की ओर संकेत करता है, पर पाठ में नाम जोड़ने के बजाय मूल की परोक्ष अभिव्यक्ति को रखा गया है।
- issue: पुनरुत्थान में परमेश्वर की कर्तृता
  choice: ‘जिसे परमेश्वर ने ... जिलाया’
  alternative: ‘जो ... जी उठा’
  rationale: उपलब्ध साक्ष्य के कर्मवाच्य और परमेश्वर की स्पष्ट कर्तृता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक उपदेशात्मक शैली रखी गई है। ‘तुम सब’, ‘पालन करो’ और ‘धीरज धरो’ सामान्य पाठक के लिए सहज हैं। नामों का देवनागरी लिप्यंतरण प्रचलित कलीसियाई रूपों के निकट रखा गया है। यह मसौदा दिए गए सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और परामर्श-पाठ पर आधारित अस्थायी अनुवाद है; यूनानी तथा लातीनी स्रोत-पाठ की प्रत्यक्ष समीक्षा आवश्यक है।
