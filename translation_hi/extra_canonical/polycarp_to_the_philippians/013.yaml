base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/013.yaml
  text: 'For I am convinced that you are well trained in the sacred writings, and nothing is hidden from you. But this has not been granted to me. Only, as it is said in these Scriptures, “Be angry and do not sin,” and, “Do not let the sun set on your wrath.” Blessed is the one who remembers this; and I trust that this is in you.


    Now may the God and Father of our Lord Jesus Christ, and the eternal High Priest himself, the [Son of God Jesus Christ, build you up in faith and truth, and in all gentleness and in all avoidance of wrath and in forbearance and long-suffering and in patient endurance and in purity; and may he grant you a lot and portion among his saints, and to us with you, and to all who are under heaven, who will believe in our Lord and God Jesus Christ and in his Father who raised him from the dead.


    Pray for all the saints. Pray also for kings and powers and princes, and for those who persecute and hate you and for the enemies of the cross, that your fruit may be manifest among all people, that you may be perfect in him.'
translation:
  language: hi
  text: 'क्योंकि मुझे विश्वास है कि आपको पवित्र शास्त्रों का अच्छा प्रशिक्षण मिला है और कोई बात आपसे छिपी नहीं है। पर मुझे यह वरदान नहीं मिला। केवल इतना ही कहूँगा कि इन शास्त्रों में जैसा कहा गया है, “क्रोध तो करो, पर पाप मत करो,” और “तुम्हारे क्रोध पर सूर्य अस्त न हो।” धन्य है वह जो इसे स्मरण रखता है; और मुझे भरोसा है कि यह बात आपमें है।


    अब हमारे प्रभु यीशु मसीह के परमेश्वर और पिता, और स्वयं सनातन महायाजक—[परमेश्वर के पुत्र यीशु मसीह—आपको विश्वास और सत्य में, और हर प्रकार की नम्रता, क्रोध से पूरी तरह दूर रहने, सहनशीलता, धीरज, दृढ़तापूर्वक टिके रहने और शुद्धता में बढ़ाएँ; और वह आपको अपने पवित्र जनों के बीच भाग और विरासत दें—और आपके साथ हमें भी—तथा आकाश के नीचे उन सभी को भी, जो हमारे प्रभु और परमेश्वर यीशु मसीह पर और उनके पिता पर विश्वास करेंगे, जिन्होंने उन्हें मरे हुओं में से जिलाया।[a]


    सभी पवित्र जनों के लिए प्रार्थना करो। राजाओं, अधिकारियों और शासकों के लिए भी प्रार्थना करो; उनके लिए भी जो तुम्हें सताते और तुमसे घृणा करते हैं, और क्रूस के शत्रुओं के लिए भी, ताकि तुम्हारा फल सब लोगों के सामने प्रकट हो और तुम उनमें सिद्ध हो जाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अनुच्छेद में “परमेश्वर के पुत्र यीशु मसीह” से पहले का आरंभिक कोष्ठक प्राप्त पाठ की क्षति या संपादकीय पुनर्स्थापना का संकेत है; यहाँ उसे ज्यों का त्यों सुरक्षित रखा गया है।
    reason: आपूर्ति किए गए ग्रीक/लैटिन परंपरा-आधारित अंग्रेज़ी साक्ष्य में खुला वर्ग-कोष्ठक है और प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित है।
lexical_decisions:
- source_word: sacred writings / scriptures
  choice: पवित्र शास्त्रों / इन शास्त्रों
  rationale: आरंभिक मसीही संदर्भ में धर्मग्रंथों का स्वाभाविक और प्रतिष्ठित हिन्दी पद; दूसरी बार संकेतवाचक रूप उद्धरणों से सीधा संबंध रखता है।
- source_word: wrath
  choice: क्रोध
  rationale: दोनों उक्तियों और सद्गुण-सूची में अर्थ-संगति बनाए रखता है; कृत्रिम पर्याय-भेद से बचता है।
- source_word: lot and portion
  choice: भाग और विरासत
  rationale: दो निकटवर्ती उत्तराधिकार-संबंधी बिंबों को हिन्दी में अलग रखते हुए उनके सामूहिक आशय को स्पष्ट करता है।
- source_word: saints
  choice: पवित्र जन
  rationale: सामान्य विश्वासियों के समुदाय के लिए बोधगम्य और गैर-सांप्रदायिक पद।
- source_word: long-suffering / patient endurance
  choice: धीरज / दृढ़तापूर्वक टिके रहना
  rationale: मूल सूची के दो संबंधित किन्तु पृथक गुणों—लंबे समय तक सहने और परिस्थितियों में स्थिर रहने—का भेद सुरक्षित रखता है।
- source_word: powers and princes
  choice: अधिकारियों और शासकों
  rationale: राजकीय और प्रशासनिक सत्ता-धारकों के व्यापक वर्गों को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: perfect
  choice: सिद्ध
  rationale: नैतिक-आध्यात्मिक परिपक्वता या पूर्णता की पारंपरिक बहुअर्थता बनाए रखता है।
theological_decisions:
- issue: “our Lord and God Jesus Christ” की उपाधि
  choice: हमारे प्रभु और परमेश्वर यीशु मसीह
  alternative: हमारे प्रभु यीशु मसीह और परमेश्वर
  rationale: प्राप्त साक्ष्य का व्याकरण दोनों उपाधियाँ यीशु मसीह से जोड़ता है; पदक्रम को बिना नरम किए सुरक्षित रखा गया है।
- issue: दूसरे अनुच्छेद में कर्ता और सर्वनाम-संदर्भ
  choice: पिता और सनातन महायाजक को संयुक्त आशीर्वचन में रखा; आगे एकवचन “वह” बनाए रखा
  alternative: हर क्रिया को अलग-अलग पिता या पुत्र से स्पष्ट रूप से जोड़ना
  rationale: साक्ष्य में मौजूद वाक्यगत और धर्मवैचारिक तनाव को कृत्रिम रूप से सुलझाना उचित नहीं था।
- issue: “in Him” का संदर्भ
  choice: उनमें
  alternative: मसीह में / परमेश्वर में
  rationale: निकटवर्ती अनेक संभावित पूर्वपदों के कारण स्पष्ट नाम जोड़ना मूल की वास्तविक संदर्भगत अस्पष्टता को मिटा देता।
- issue: “who shall believe” का काल और दायरा
  choice: जो ... विश्वास करेंगे
  alternative: जो ... विश्वास करते हैं
  rationale: उपलब्ध साक्ष्य के भावी संकेत को रखा गया है, यद्यपि इसका आशय भावी विश्वासियों या सामान्यतः विश्वास करने वालों तक फैल सकता है।
