  register: आधुनिक मानक हिन्दी, आदरसूचक बहुवचन और गरिमामय पत्रात्मक शैली। बाइबिलीय उद्धरणों को सहज किंतु पहचाने जाने योग्य रखा गया है। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर स्रोत-सचेत रूप से आधारित है; ग्रीक/लैटिन की प्रत्यक्ष समीक्षा लंबित होने के कारण पांडुलिपीय संकेत और वास्तविक अस्पष्टताएँ संरक्षित हैं।
