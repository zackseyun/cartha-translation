  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक-पाठ के अनुकूल शैली अपनाई गई है। छोटे और मध्यम वाक्यों से सूचीबद्ध उपदेशों को स्पष्ट रखा गया है। मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्षी और दिए गए परामर्श-पाठ पर आधारित है; यूनानी/लैटिन स्रोत-परंपरा की प्रत्यक्ष समीक्षा लंबित होने के कारण विवादित पदों में अनावश्यक निश्चितता से बचा गया है।
