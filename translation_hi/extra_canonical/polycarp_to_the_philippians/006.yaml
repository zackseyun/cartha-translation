base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/006.yaml
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
translation:
  language: hi
  text: 'इसलिए, यह जानते हुए कि परमेश्वर का उपहास नहीं किया जा सकता, हमें उसकी आज्ञा और उसकी महिमा के योग्य चाल चलनी चाहिए।


    इसी प्रकार सेवकों[a] को भी उसकी धार्मिकता के सामने निर्दोष होना चाहिए। वे मनुष्यों के नहीं, बल्कि परमेश्वर और मसीह के सेवक हैं। वे निंदा करनेवाले, दोहरी बात करनेवाले या धन से प्रेम करनेवाले न हों, बल्कि हर बात में संयमी, करुणामय और परिश्रमी हों। वे प्रभु के सत्य के अनुसार चलें, जो सबका सेवक बना। क्योंकि यदि हम इस वर्तमान संसार में उसे प्रसन्न करें, तो आनेवाला संसार भी पाएँगे, जैसा उसने हमें मरे हुओं में से जिलाने की प्रतिज्ञा की है। और यदि हम उसके योग्य आचरण करें, तो उसके साथ राज्य भी करेंगे—यदि सचमुच हम विश्वास करते हैं।


    इसी प्रकार जवान पुरुषों को भी हर बात में निर्दोष होना चाहिए। वे सबसे बढ़कर शुद्धता का ध्यान रखें और अपने आपको हर बुराई से रोकें। संसार की अभिलाषाओं से दूर रहना अच्छा है, क्योंकि हर अभिलाषा आत्मा[b] के विरुद्ध युद्ध करती है। न तो यौन-अनैतिकता करनेवाले, न स्त्रैण पुरुष, न पुरुषों के साथ अपने आपको अशुद्ध करनेवाले[c], परमेश्वर के राज्य के वारिस होंगे; और न वे, जो अनुचित काम करते हैं। इसलिए इन सब बातों से दूर रहना उचित है। तुम प्रेस्बिटरों[d] और सेवकों के अधीन ऐसे रहो, जैसे परमेश्वर और मसीह के अधीन रहते हो। कुँवारी स्त्रियों को निर्दोष और शुद्ध विवेक के साथ चाल चलनी चाहिए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सेवक’ कलीसिया के उस पद को भी दर्शाता है जिसे ‘डीकन’ कहा जाता है। आगे प्रभु को ‘सबका सेवक’ कहने में इसी शब्द का सामान्य अर्थ सामने आता है।
    reason: सेवक और डीकन के बीच मूल शब्द-खेल तथा पदनाम का अर्थ सुरक्षित करना।
  - marker: b
    text: ‘आत्मा’ से पवित्र आत्मा या मनुष्य की आत्मा—दोनों में से किसका आशय है, यह यहाँ स्पष्ट नहीं है।
    reason: वास्तविक अर्थगत अस्पष्टता को खुला रखना।
  - marker: c
    text: इस सूची के प्राचीन यौन-संबंधी पदों का ठीक दायरा विवादित है। यहाँ उपलब्ध साक्ष्य की श्रेणियाँ अलग रखी गई हैं; स्रोत-भाषा की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
    reason: विवादित शब्दावली पर आवश्यकता से अधिक निश्चित अर्थ आरोपित करने से बचना।
  - marker: d
    text: ‘प्रेस्बिटर’ आरंभिक कलीसिया के अगुए या प्राचीन के लिए प्रयुक्त पद है।
    reason: तकनीकी कलीसियाई पद को सामान्य पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: deacons / minister (deacon)
  choice: सेवक
  rationale: एक ही मूल से जुड़े पदनाम और सामान्य सेवा के अर्थ का शब्द-खेल बनाए रखने के लिए ‘सेवक’ रखा गया है; पद के तकनीकी अर्थ को पादटिप्पणी स्पष्ट करती है।
- source_word: walk
  choice: चाल चलना
  rationale: यह आचरण के लिए प्रयुक्त प्राचीन रूपक को बनाए रखता है और हिन्दी बाइबलीय गद्य में समझने योग्य है।
- source_word: double-tongued
  choice: दोहरी बात करनेवाले
  rationale: अलग-अलग लोगों से असंगत या छलपूर्ण बातें कहने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: the younger men
  choice: जवान पुरुष
  rationale: संदर्भ में पुरुष-वर्ग लक्षित है; सामान्य ‘युवा’ से लिंग-सूचना अस्पष्ट हो सकती थी।
- source_word: presbyters
  choice: प्रेस्बिटर
  rationale: प्राचीन कलीसियाई पद का तकनीकी स्वरूप सुरक्षित रखा गया है; किसी आधुनिक संप्रदाय के पदनाम से इसकी पहचान नहीं की गई।
- source_word: virgins
  choice: कुँवारी स्त्रियाँ
  rationale: लक्षित स्त्री-समूह को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘Spirit’ का आशय पवित्र आत्मा है या मानवीय आत्मा
  choice: आत्मा
  alternative: पवित्र आत्मा / मनुष्य की आत्मा
  rationale: उपलब्ध साक्ष्य में अर्थ को निर्णायक रूप से सीमित न करके मूल धार्मिक तनाव और अस्पष्टता सुरक्षित रखी गई है।
- issue: यौन आचरण से संबंधित तीन श्रेणियों की सीमा
  choice: अलग-अलग तीन अभिव्यक्तियाँ रखी गईं
  alternative: सभी को एक व्यापक पद ‘यौन-अनैतिक लोग’ में मिला देना
  rationale: पाठ की सूची और उसके संभावित भेदों को बनाए रखा गया है; फिर भी स्रोत-भाषा की प्रत्यक्ष समीक्षा लंबित होने के कारण पादटिप्पणी में सावधानी दी गई है।
- issue: ‘उसकी धार्मिकता’ में सर्वनाम का संदर्भ
  choice: सर्वनाम को यथावत रखा
  alternative: परमेश्वर की धार्मिकता
  rationale: निकटवर्ती संदर्भ परमेश्वर की ओर संकेत करता है, पर अनुवाद ने नाम जोड़कर अस्पष्टता को अनावश्यक रूप से समाप्त नहीं किया।
- issue: ‘as to God and Christ’ में अधीनता की उपमा
  choice: ‘जैसे परमेश्वर और मसीह के अधीन रहते हो’
  alternative: उन्हें परमेश्वर और मसीह के समान मानते हुए
  rationale: यह पदाधिकारियों को दैवी दर्जा दिए बिना तुलना के अधीनता-संबंधी बल को व्यक्त करता है।
