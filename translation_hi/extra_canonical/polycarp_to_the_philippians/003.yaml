base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/003.yaml
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
translation:
  language: hi
  text: 'इसलिए अपनी कमर कसो[a] और भय तथा सच्चाई से परमेश्वर की सेवा करो। व्यर्थ और खोखली बातों और बहुतों के भ्रम को छोड़ दो, क्योंकि तुमने उस पर विश्वास किया है जिसने हमारे प्रभु यीशु मसीह को मरे हुओं में से जिलाया, उसे महिमा दी और अपनी दाहिनी ओर सिंहासन दिया। स्वर्ग और पृथ्वी की सब वस्तुएँ उसके अधीन कर दी गईं। हर प्राणधारी सृष्टि उसकी सेवा करती है। वह जीवितों और मरे हुओं का न्यायी बनकर आ रहा है। जो उसकी आज्ञा नहीं मानते, उनसे परमेश्वर उसके लहू का लेखा माँगेगा[b]।


    जिसने उसे मरे हुओं में से जिलाया, वही हमें भी जिलाएगा—यदि हम उसकी इच्छा पूरी करें, उसकी आज्ञाओं पर चलें और उन बातों से प्रेम करें जिनसे उसने प्रेम किया; और हर प्रकार के अधर्म, लालच, धन के मोह, निंदा और झूठी गवाही से दूर रहें। हम बुराई के बदले बुराई, अपमान के बदले अपमान, चोट के बदले चोट या शाप के बदले शाप न दें।


    इसके बजाय प्रभु की वे बातें याद रखो जो उसने शिक्षा देते समय कहीं: “न्याय न करो, ताकि तुम्हारा भी न्याय न किया जाए। क्षमा करो, तो तुम्हें भी क्षमा किया जाएगा। दया करो, ताकि तुम पर भी दया की जाए। जिस नाप से तुम नापते हो, उसी से तुम्हारे लिए भी नापा जाएगा।” और फिर: “धन्य हैं गरीब और वे जो धार्मिकता के कारण सताए जाते हैं, क्योंकि परमेश्वर का राज्य उन्हीं का है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक बिंब: “अपनी कमर बाँधो”; अर्थात् कार्य के लिए तैयार हो जाओ।'
    reason: प्राचीन परिधान से जुड़े मुहावरे का बिंब और अर्थ दोनों स्पष्ट करने के लिए।
  - marker: b
    text: “उसके” का निकटतम संदर्भ मसीह है। वाक्य का अर्थ है कि परमेश्वर आज्ञा न माननेवालों से उसके लहू के विषय में लेखा माँगेगा; उपलब्ध स्रोत-साक्ष्य में सर्वनाम-संबंध को इससे अधिक स्पष्ट नहीं किया गया है।
    reason: सर्वनाम और धर्मवैज्ञानिक आशय को अनावश्यक रूप से निश्चित किए बिना पाठक को संभावित संदर्भ बताने के लिए।
lexical_decisions:
- source_word: gird up your loins
  choice: अपनी कमर कसो
  rationale: मूल बिंब को बनाए रखते हुए यह आधुनिक हिन्दी में कार्य के लिए तैयार होने का स्वाभाविक और सुबोध मुहावरा है।
- source_word: fear and truth
  choice: भय तथा सच्चाई
  rationale: ‘भय’ श्रद्धापूर्ण भय की धार्मिक गंभीरता बनाए रखता है और ‘सच्चाई’ सत्यनिष्ठ सेवा का सहज हिन्दी रूप है; इसे केवल ‘ईमानदारी’ तक सीमित नहीं किया गया।
- source_word: the error of the many
  choice: बहुतों का भ्रम
  rationale: यह बहुसंख्य लोगों के भटके हुए मत या भूल को व्यक्त करता है, बिना किसी विशिष्ट समूह की पहचान जोड़े।
- source_word: quick and dead
  choice: जीवितों और मरे हुओं
  rationale: पुराने अंग्रेज़ी प्रयोग ‘quick’ का आशय ‘जीवित’ है; हिन्दी में पारंपरिक न्याय-सूत्र की स्पष्टता रखी गई है।
- source_word: covetousness, love of money
  choice: लालच, धन का मोह
  rationale: 'दो निकटवर्ती लेकिन अलग दोषों को अलग रखा गया है: व्यापक लोभ और विशेष रूप से धन से आसक्ति।'
- source_word: railing
  choice: अपमान
  rationale: कटु, निंदात्मक वाणी के प्रत्युत्तर को सामान्य पाठक के लिए सहज रूप में व्यक्त करता है और समानांतर संरचना बनाए रखता है।
- source_word: the poor
  choice: गरीब
  rationale: उपलब्ध साक्ष्य के सीधे अर्थ को रखा गया है; ‘मन के दीन’ जोड़कर पाठ का कैनोनिकल सामंजस्य नहीं किया गया।
theological_decisions:
- issue: पुनरुत्थान और आज्ञाकारिता के बीच शर्तसूचक संबंध
  choice: “वही हमें भी जिलाएगा—यदि हम...”
  alternative: पुनरुत्थान को बिना किसी शर्त के कथन के रूप में प्रस्तुत करना
  rationale: उपलब्ध पाठ में स्पष्ट ‘if’ है। उसके धर्मवैज्ञानिक तनाव को समझाकर हटाने या कमजोर करने के बजाय सुरक्षित रखा गया है।
- issue: यीशु को दिया गया सिंहासन
  choice: “अपनी दाहिनी ओर सिंहासन दिया”
  alternative: “परमेश्वर के दाहिने हाथ पर बैठाया”
  rationale: साक्ष्य में महिमा और सिंहासन दिए जाने की भाषा है; ‘बैठाया’ जोड़ने के बजाय दिए गए कथन के निकट रहा गया है।
- issue: लहू का लेखा माँगने वाला और लहू का संबंध
  choice: “परमेश्वर उसके लहू का लेखा माँगेगा”
  alternative: “परमेश्वर उनसे मसीह के लहू का बदला लेगा”
  rationale: सर्वनाम की वास्तविक अस्पष्टता और ‘require’ की लेखा/उत्तरदायित्व संबंधी भाषा को बनाए रखा गया है; ‘बदला’ जैसी अधिक निर्णायक व्याख्या नहीं जोड़ी गई।
- issue: धन्यवचन में राज्य
  choice: “परमेश्वर का राज्य”
  alternative: “स्वर्ग का राज्य”
  rationale: प्रस्तुत साक्ष्य में ‘kingdom of God’ है; इसे समानांतर कैनोनिकल रूप के अनुसार नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। आज्ञार्थक बहुवचन और समानांतर वाक्य-विन्यास सुरक्षित रखे गए हैं। कैनोनिकल समानांतरों के अनुसार शब्दावली का कृत्रिम सामंजस्य नहीं किया गया। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य पर आधारित है; यूनानी/लातीनी पांडुलिपि-परंपरा की प्रत्यक्ष समीक्षा अभी अपेक्षित है।
