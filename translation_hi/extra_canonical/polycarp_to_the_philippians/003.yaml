review_pass:
  verdict: revise
  source_fidelity: Overall the draft faithfully follows the supplied witness and preserves its conditional statement about being raised, the distinct vices of covetousness and love of money, and the unharmonized wording of the final beatitude. A small revision improves the rendering of the Lord's teaching that mercy be received, rather than merely expressed in a passive construction.
  naturalness: The Hindi is generally fluent, dignified, and suitable for public reading. “भय और सत्य में” is a more idiomatic formal rendering of the source’s paired prepositional expression than “भय तथा सच्चाई से,” and “तुम्हें भी दया मिले” directly and naturally conveys receiving mercy.
  terminology: “परमेश्वर,” “प्रभु यीशु मसीह,” “महिमा,” “सिंहासन,” “लहू,” and “परमेश्वर का राज्य” are consistently and appropriately rendered. “धार्मिकता” is retained without importing a denominational interpretation.
  issues:
  - severity: low
    issue: The mercy saying is rendered as “तुम पर भी दया की जाए.”
    rationale: The witness says “that ye may receive mercy.” While the existing passive Hindi can imply this, “तुम्हें भी दया मिले” explicitly retains the recipient-focused sense and avoids adding an unspecified passive agent.
  - severity: low
    issue: “Serve God in fear and truth” is rendered “भय तथा सच्चाई से परमेश्वर की सेवा करो.”
    rationale: This is understandable, but “भय और सत्य में परमेश्वर की सेवा करो” better reflects the source’s compact religious-register pairing and reads naturally in formal Hindi.
