base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
translation:
  language: hi
  text: 'इसलिए हम बिना रुके अपनी आशा को और अपनी धार्मिकता की गारंटी, अर्थात् यीशु मसीह, को दृढ़ता से थामे रहें। उसने अपने ही शरीर में हमारे पापों को वृक्ष पर उठा लिया। उसने कोई पाप नहीं किया, और न उसके मुँह में कोई छल पाया गया। फिर भी उसने हमारे लिए सब कुछ सहा, ताकि हम उसमें जीवित रहें।


    इसलिए हम उसके धीरज का अनुकरण करें। और यदि हमें उसके नाम के कारण दुःख सहना पड़े, तो हम उसकी महिमा करें। क्योंकि उसने अपने ही जीवन में हमारे लिए यह उदाहरण दिया, और हमने इस पर विश्वास किया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: earnest
  choice: बयाना
  rationale: यहाँ अर्थ किसी सामान्य प्रतिज्ञा का नहीं, बल्कि उस अग्रिम राशि या निश्चित आश्वासन का है जो पूरी प्राप्ति की गारंटी देता है। ‘बयाना’ इस रूपक को संक्षेप में बनाए रखता है।
- source_word: righteousness
  choice: धार्मिकता
  rationale: ‘धार्मिकता’ न्यायोचित ठहराए जाने और सही जीवन—दोनों से जुड़ी संभावित व्यापकता को खुला रखता है; इसे केवल ‘नेक काम’ या केवल किसी संप्रदायगत सिद्धांत तक सीमित नहीं किया गया।
- source_word: tree
  choice: वृक्ष
  rationale: ‘वृक्ष’ मूल बिंब को बनाए रखता है और क्रूस की ओर संकेत करता है, पर पाठ में अनुपस्थित ‘क्रूस’ को सीधे प्रतिस्थापित नहीं करता।
- source_word: endurance
  choice: धीरज
  rationale: यह निष्क्रिय प्रतीक्षा नहीं, बल्कि दुःख के बीच स्थिर बने रहने का भाव व्यक्त करता है।
- source_word: in Him
  choice: उसमें
  rationale: मसीह के साथ संबंध या सहभागिता की धर्मवैज्ञानिक गहराई को किसी एक व्याख्या में सीमित किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: यीशु मसीह को ‘हमारी धार्मिकता का बयाना’ कहना
  choice: रूपक और व्यक्ति-संदर्भ दोनों को सीधे बनाए रखा गया है।
  alternative: ‘हमारी धार्मिकता की गारंटी’ या ‘हमारे धर्मी ठहराए जाने की गारंटी’
  rationale: ‘गारंटी’ अधिक सहज होती, पर ‘बयाना’ मूल के अग्रिम-आश्वासन वाले रूपक को बेहतर बचाता है; ‘धर्मी ठहराया जाना’ अर्थ को एक विशिष्ट धर्मवैज्ञानिक व्याख्या तक सीमित कर देता।
- issue: मसीह द्वारा पापों को वृक्ष पर उठाना
  choice: ‘हमारे पापों को अपनी ही देह में लेकर वृक्ष पर चढ़ाया’
  alternative: ‘क्रूस पर हमारे पापों का दंड सहा’
  rationale: वैकल्पिक वाक्य व्याख्यात्मक है और ‘दंड’ जोड़ता है, जो दिए गए पाठ में स्पष्ट रूप से नहीं है। चुना गया रूप देह, पाप और वृक्ष के मूल बिंबों को बनाए रखता है।
- issue: ‘ताकि हम उसमें जीवित रहें’
  choice: ‘उसमें’ की संबंधपरक अभिव्यक्ति सुरक्षित रखी गई है।
  alternative: ‘उसके द्वारा जीवन पाएँ’
  rationale: वैकल्पिक रूप कारण या साधन पर बल देता है, जबकि मूल अभिव्यक्ति मसीह में जीवन या सहभागिता के अर्थ को खुला रखती है।
- issue: अंतिम कथन ‘we believed this’ का संदर्भ
  choice: ‘हमने इसी पर विश्वास किया’
  alternative: ‘हमने उस पर विश्वास किया’
  rationale: दिया गया साक्ष्य ‘this’ कहता है; इसलिए इसे केवल मसीह के व्यक्ति की ओर संकेत करने वाले ‘उस पर’ में बदलने के बजाय निकटवर्ती उदाहरण और संदेश की संभावित व्यापकता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामुदायिक उपदेशात्मक शैली रखी गई है। ‘हम ... करें/रहें’ से मूल के सामूहिक आह्वान सुरक्षित हैं। यह मसौदा उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और प्रदत्त परामर्श-पाठ पर आधारित है; यूनानी/लातीनी पांडुलिपि-परंपरा की प्रत्यक्ष स्रोत-भाषा समीक्षा अभी लंबित होने के कारण सूक्ष्म पाठगत निष्कर्ष अंतिम नहीं माने जाने चाहिए।
