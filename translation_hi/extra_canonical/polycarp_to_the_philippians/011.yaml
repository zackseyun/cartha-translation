base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/011.yaml
  text: 'Therefore stand firm in these things and follow the example of the Lord, being firm in the faith and immovable, kindly affectionate toward one another in love of the brotherhood, partners with the truth, forestalling one another in the gentleness of the Lord, and despising no one.


    When you are able to do good, do not delay, for pitifulness delivers from death. Be all subject to one another, having your conduct blameless among the Gentiles, so that by your good works you may receive praise and the Lord may not be blasphemed in you.


    But woe to the one through whom the name of the Lord is blasphemed. Therefore teach all people soberness, in which you yourselves also walk.'
translation:
  language: hi
  text: 'इसलिए इन बातों में दृढ़ बने रहो और प्रभु के उदाहरण पर चलो। विश्वास में दृढ़ और अटल रहो; भाईचारे के प्रेम में एक-दूसरे के प्रति स्नेह रखो; सत्य के सहभागी बनो; प्रभु की नम्रता दिखाने में एक-दूसरे से आगे रहो[a]; और किसी को तुच्छ न समझो।


    जब तुम भलाई कर सकते हो, तो देर मत करो, क्योंकि दयापूर्ण दान मृत्यु से छुड़ाता है[b]। तुम सब एक-दूसरे के अधीन रहो। अन्यजातियों के बीच तुम्हारा आचरण निर्दोष हो, ताकि तुम्हारे भले कामों के कारण तुम्हें प्रशंसा मिले और तुम्हारे कारण प्रभु की निन्दा न हो[c]।


    पर हाय उस व्यक्ति पर, जिसके कारण प्रभु के नाम की निन्दा होती है! इसलिए सब लोगों को उस संयम की शिक्षा दो, जिसके अनुसार तुम स्वयं भी चलते हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एक-दूसरे से आगे रहो” का अर्थ एक-दूसरे से पहले नम्रता दिखाना या इसमें पहल करना भी हो सकता है।
    reason: ‘forestalling’ की पुरानी अंग्रेज़ी अभिव्यक्ति और अंतर्निहित स्रोत-पाठ की सम्भावित अर्थ-सीमा को दर्ज करना।
  - marker: b
    text: “दयापूर्ण दान” का अनुवाद “दया” या “दानशीलता” भी किया जा सकता है। “मृत्यु से छुड़ाता है” का कथन यहाँ बिना यह तय किए रखा गया है कि मृत्यु का आशय शारीरिक है या व्यापक आध्यात्मिक।
    reason: मुख्य नैतिक पद और ‘मृत्यु’ दोनों की सम्भावित अर्थ-व्याप्ति सुरक्षित रखना।
  - marker: c
    text: शाब्दिक रूप से, “प्रभु की निन्दा तुममें न हो”; भाव सम्भवतः “तुम्हारे कारण” या “तुम्हारे विषय में” है।
    reason: मूल वाक्य-विन्यास और स्वाभाविक हिन्दी अर्थ के बीच अंतर बताना।
lexical_decisions:
- source_word: Stand fast / firm and immovable
  choice: दृढ़ बने रहो … दृढ़ और अटल रहो
  rationale: आदेश की पुनरावृत्ति और स्थिरता पर दिए गए बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखा गया है।
- source_word: love of the brotherhood
  choice: भाईचारे का प्रेम
  rationale: यह समुदाय के भीतर पारिवारिक स्नेह का भाव रखता है, बिना इसे केवल पुरुषों तक सीमित किए।
- source_word: partners with the truth
  choice: सत्य के सहभागी
  rationale: ‘सत्य’ के साथ सक्रिय साझेदारी/सहभागिता का अर्थ सुरक्षित रहता है।
- source_word: forestalling one another
  choice: एक-दूसरे से आगे रहो
  rationale: पुराने अंग्रेज़ी ‘forestalling’ को पहल करने अथवा आगे बढ़ने के अर्थ में लिया गया है; अस्पष्टता को पादटिप्पणी में दर्ज किया गया है।
- source_word: Pitifulness
  choice: दयापूर्ण दान
  rationale: संदर्भ में दया के व्यावहारिक, दानशील रूप की ओर संकेत सम्भावित है; केवल भावनात्मक करुणा तक अर्थ सीमित न हो, इसलिए संयुक्त पद चुना गया।
- source_word: Gentiles
  choice: अन्यजातियों
  rationale: आरम्भिक मसीही साहित्य का प्रचलित समुदाय-बाह्य पद सुरक्षित रखा गया है।
- source_word: soberness
  choice: संयम
  rationale: यह केवल मद्यत्याग नहीं, बल्कि आत्मसंयम और विवेकपूर्ण जीवन का व्यापक नैतिक अर्थ व्यक्त करता है।
theological_decisions:
- issue: ‘दयापूर्ण दान मृत्यु से छुड़ाता है’ का उद्धार-संबंधी आशय
  choice: कथन को बिना व्याख्यात्मक कमी-बेशी के रखा गया
  alternative: इसे केवल सांसारिक संकट से बचाव अथवा अनन्त उद्धार की शर्त के रूप में स्पष्ट करना
  rationale: उपलब्ध साक्ष्य कथन की धर्मवैज्ञानिक कसावट को स्वयं हल नहीं करता; किसी विशिष्ट सिद्धान्त को आरोपित नहीं किया गया।
- issue: प्रभु की निन्दा ‘in you’
  choice: तुम्हारे कारण प्रभु की निन्दा न हो
  alternative: तुममें प्रभु की निन्दा न हो
  rationale: संदर्भ में समुदाय के आचरण के कारण बाहरी लोगों द्वारा निन्दा किया जाना अभिप्रेत प्रतीत होता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: परस्पर अधीनता
  choice: तुम सब एक-दूसरे के अधीन रहो
  alternative: विशिष्ट पदानुक्रम या एकतरफा अधीनता
  rationale: परस्परता को स्पष्ट रूप से बनाए रखा गया है और किसी संस्थागत ढाँचे को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में बहुवचन अनौपचारिक-गरिमापूर्ण ‘तुम’ का प्रयोग किया गया है, जो सामुदायिक उपदेश के लिए स्वाभाविक है। वाक्य छोटे रखे गए हैं, पर आरम्भिक मसीही नैतिक उपदेश की गंभीरता और समानांतर संरचना बनाए रखी गई है। उपलब्ध आधार सार्वजनिक-डोमेन अंग्रेज़ी साक्षी है; प्रत्यक्ष यूनानी/लातीनी स्रोत-पाठ की समीक्षा लंबित होने के कारण संदिग्ध पदों पर पादटिप्पणियाँ दी गई हैं।
