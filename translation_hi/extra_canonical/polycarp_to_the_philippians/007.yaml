  english_witness: 'And the presbyters also must be compassionate, merciful towards all men, turning back the sheep that are gone astray, visiting all the infirm, not neglecting a widow or an orphan or a poor man: but providing always for that which is honorable in the sight of God and of men, abstaining from all anger, respect of persons, unrighteous judgment, being far from all love of money, not quick to believe anything against any man, not hasty in judgment, knowing that we all are debtors of sin.


    If then we entreat the Lord that He would forgive us, we also ought to forgive: for we are before the eyes of our Lord and God, and we must all stand at the judgment-seat of Christ, and each man must give an account of himself.


    Let us therefore so serve Him with fear and all reverence, as He himself gave commandment and the Apostles who preached the Gospel to us and the prophets who proclaimed beforehand the coming of our Lord; being zealous as touching that which is good, abstaining from offenses and from the false brethren and from them that bear the name of the Lord in hypocrisy, who lead foolish men astray.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/007.yaml
  text: 'The elders must also be compassionate and merciful toward everyone. They must bring back the sheep that have gone astray, visit all who are sick, and not neglect a widow, an orphan, or a poor person. Instead, they must always provide for what is honorable in the sight of God and of people. They must abstain from all anger, favoritism, and unjust judgment; stay far from every love of money; not be quick to believe anything against anyone; and not be hasty in judgment, knowing that we are all debtors of sin.


    So if we ask the Lord to forgive us, we also ought to forgive. For we are before the eyes of our Lord and God, and we must all stand before the judgment seat of Christ, and each person must give an account of himself.


    Therefore, let us serve him with fear and complete reverence, as he himself commanded, along with the apostles who preached the good news to us and the prophets who proclaimed beforehand the coming of our Lord. Let us be zealous for what is good, abstaining from offenses, from false brothers, and from those who bear the name of the Lord hypocritically and lead foolish people astray.'
translation:
  language: hi
  text: 'प्राचीनों[a] को भी करुणामय और सब लोगों के प्रति दयालु होना चाहिए। वे भटकी हुई भेड़ों को वापस लाएँ, सभी रोगियों की सुधि लें और किसी विधवा, अनाथ या निर्धन व्यक्ति की उपेक्षा न करें। इसके बजाय, वे सदा उस बात का ध्यान रखें जो परमेश्वर और मनुष्यों की दृष्टि में आदर के योग्य है। वे हर प्रकार के क्रोध, पक्षपात और अन्यायपूर्ण न्याय से दूर रहें; धन के हर प्रकार के लोभ से बहुत दूर रहें; किसी के विरुद्ध कही गई बात पर तुरंत विश्वास न करें और न्याय करने में उतावली न करें, क्योंकि हम जानते हैं कि हम सब पाप के कर्ज़दार हैं।[b]


    इसलिए, यदि हम प्रभु से विनती करते हैं कि वह हमें क्षमा करे, तो हमें भी क्षमा करना चाहिए। क्योंकि हम अपने प्रभु और परमेश्वर की आँखों के सामने हैं; हम सबको मसीह के न्याय-आसन के सामने खड़ा होना है, और प्रत्येक व्यक्ति को अपना लेखा देना है।


    इसलिए हम भय और पूरे आदर के साथ उसकी सेवा करें—जैसी आज्ञा उसने स्वयं दी, और जैसे उन प्रेरितों ने, जिन्होंने हमें शुभ समाचार सुनाया, तथा उन भविष्यद्वक्ताओं ने, जिन्होंने हमारे प्रभु के आगमन की पहले से घोषणा की।[c] हम भलाई के लिए उत्साही रहें और ठोकर के कारणों,[d] झूठे भाइयों तथा उन लोगों से दूर रहें जो कपट से प्रभु का नाम धारण करते हैं और निर्बुद्धि लोगों को भटका देते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्राचीन” से आशय समुदाय के नियुक्त अगुओं से है; उपलब्ध साक्ष्य में अंग्रेज़ी “presbyters” है।
    reason: आधुनिक हिन्दी में “प्राचीन” को केवल वृद्ध व्यक्ति समझे जाने की संभावना स्पष्ट करना।
  - marker: b
    text: “पाप के कर्ज़दार” का आशय पाप के कारण दोषी अथवा क्षमा के ऋणी होने से संबंधित हो सकता है; यहाँ ऋण का मूल रूपक बनाए रखा गया है।
    reason: सच्ची अर्थगत और धर्मवैज्ञानिक अस्पष्टता को सुरक्षित रखना।
  - marker: c
    text: इस वाक्य में प्रभु की आज्ञा, प्रेरितों के शुभ समाचार और भविष्यद्वक्ताओं की पूर्वघोषणा का संबंध उपलब्ध साक्ष्य में संक्षिप्त और कुछ अस्पष्ट है।
    reason: वाक्यगत संबंध को किसी एक व्याख्या से अनावश्यक रूप से न बाँधना।
  - marker: d
    text: “ठोकर के कारण” का अर्थ नैतिक बाधाएँ, पाप में गिराने वाली बातें या अपराध के अवसर हो सकता है।
    reason: “offenses” की व्यापक अर्थ-सीमा को दर्ज करना।
lexical_decisions:
- source_word: presbyters
  choice: प्राचीनों
  rationale: आरंभिक मसीही समुदाय के पद/भूमिका के लिए प्रचलित हिन्दी शब्द चुना गया; इसे केवल अधिक आयु वाले लोगों के अर्थ से अलग करने हेतु पादटिप्पणी दी गई है।
- source_word: visiting
  choice: सुधि लें
  rationale: यह केवल औपचारिक भेंट नहीं, बल्कि रोगियों की देखभाल और सहायता का भाव व्यक्त करता है।
- source_word: debtors of sin
  choice: पाप के कर्ज़दार
  rationale: साक्ष्य में उपस्थित ऋण-रूपक को बनाए रखा गया है और उसका आशय व्याख्यात्मक रूप से तय नहीं किया गया।
- source_word: judgment-seat
  choice: न्याय-आसन
  rationale: न्यायिक उपस्थिति और अंतिम लेखा देने की छवि को संक्षिप्त, प्रतिष्ठित हिन्दी में सुरक्षित रखता है।
- source_word: offenses
  choice: ठोकर के कारणों
  rationale: नैतिक चूक, प्रलोभन अथवा दूसरों को गिराने वाली बाधा के बीच संभावित अर्थ-व्याप्ति को यथासंभव खुला रखता है।
- source_word: false brethren
  choice: झूठे भाइयों
  rationale: समुदायगत संबंध के दावे और उसके झूठेपन—दोनों को सीधे बनाए रखता है।
theological_decisions:
- issue: “हमारे प्रभु और परमेश्वर” में संबोधन/संदर्भ
  choice: हमारे प्रभु और परमेश्वर की आँखों के सामने
  alternative: हमारे प्रभु, जो परमेश्वर हैं, उनकी आँखों के सामने
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य की व्याकरणिक-धर्मवैज्ञानिक अस्पष्टता को बिना किसी विशिष्ट सिद्धान्तगत पहचान को थोपे सुरक्षित रखा गया।
- issue: “पाप के कर्ज़दार” का अर्थ
  choice: ऋण-रूपक को ज्यों का त्यों रखना
  alternative: हम सबने पाप किया है / हम सब पाप के दोषी हैं
  rationale: वैकल्पिक रूप मूल तनाव को एक निश्चित व्याख्या में बदल देते; इसलिए रूपक का समाधान नहीं किया गया।
- issue: आज्ञा देने वालों की समन्वित सूची
  choice: यीशु, प्रेरितों और भविष्यद्वक्ताओं से जुड़ी खंडित समानांतर रचना को बनाए रखना
  alternative: केवल प्रभु को आज्ञा का कर्ता बनाकर प्रेरितों और भविष्यद्वक्ताओं को अलग से शिक्षक कहना
  rationale: उपलब्ध साक्ष्य की वाक्यरचना पूरी तरह स्पष्ट नहीं है; अनूदित पाठ इसे कृत्रिम रूप से निश्चित नहीं करता।
