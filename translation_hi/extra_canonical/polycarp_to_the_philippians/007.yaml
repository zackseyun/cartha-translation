  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। उपदेशात्मक लय और समानांतर आज्ञाओं को बनाए रखा गया। चूँकि दिए गए आँकड़ों में यूनानी/लातीनी मूल-पाठ की सीधी समीक्षा लंबित बताई गई है और केवल सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य उपलब्ध कराया गया है, यह मसौदा उसी साक्ष्य तथा ऑडिट किए गए अंग्रेज़ी परामर्श-पाठ पर आधारित अस्थायी स्रोत-सचेत अनुवाद है; प्रकाशन से पहले यूनानी/लातीनी पाठ से प्रत्यक्ष मिलान आवश्यक है।
