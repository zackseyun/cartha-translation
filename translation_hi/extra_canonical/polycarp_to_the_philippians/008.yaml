  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट। स्रोत-भाषा समीक्षा लंबित होने के कारण अनुवाद उपलब्ध सार्वजनिक-डोमेन अंग्रेज़ी साक्ष्य और दिए गए परामर्श-पाठ पर सावधानी से आधारित है। अनावश्यक संप्रदायगत शब्दावली और व्याख्यात्मक विस्तार से बचा गया है।
