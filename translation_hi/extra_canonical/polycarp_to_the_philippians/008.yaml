    Wherefore let us forsake the vain doing of the many and their false teachings, and turn unto the word which was delivered unto us from the beginning, being sober unto prayer and constant in fastings, entreating the all-seeing God with supplications that He bring us not into temptation, according as the Lord said, The Spirit is indeed willing, but the flesh is weak.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/008.yaml
  text: 'For everyone who does not confess that Jesus Christ has come in the flesh is antichrist. Whoever does not confess the testimony of the cross is of the devil. And whoever twists the Lord’s sayings to suit his own desires and says that there is neither resurrection nor judgment—that person is the firstborn of Satan.


    Therefore, let us abandon the empty practices of the many and their false teachings, and turn to the word delivered to us from the beginning. Let us be sober in prayer and steadfast in fasting, pleading with the all-seeing God not to bring us into temptation, just as the Lord said, “The spirit is indeed willing, but the flesh is weak.”'
translation:
  language: hi
  text: 'क्योंकि जो कोई यह अंगीकार नहीं करता कि यीशु मसीह देह में आए हैं, वह मसीह-विरोधी है। और जो कोई क्रूस की गवाही को अंगीकार नहीं करता, वह शैतान की ओर से है। और जो कोई अपनी अभिलाषाओं के अनुसार प्रभु के वचनों को तोड़-मरोड़कर यह कहता है कि न पुनरुत्थान है, न न्याय—वह व्यक्ति शैतान का पहलौठा है।


    इसलिए आओ, हम बहुतों के व्यर्थ आचरण और उनकी झूठी शिक्षाओं को छोड़ दें, और उस वचन की ओर फिरें जो आरम्भ से हमें सौंपा गया था। हम प्रार्थना के लिए सचेत रहें और उपवासों में दृढ़ बने रहें। हम सब कुछ देखनेवाले परमेश्वर से विनती करें कि वह हमें परीक्षा में न लाए, जैसा प्रभु ने कहा, “आत्मा तो सचमुच तत्पर है, पर शरीर दुर्बल है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confess
  choice: अंगीकार करना
  rationale: यह केवल मौखिक स्वीकार नहीं, बल्कि सार्वजनिक विश्वास-स्वीकृति का भाव भी व्यक्त करता है।
- source_word: in the flesh
  choice: देह में
  rationale: आरम्भिक मसीही देहधारण-संबंधी कथन की ठोस भाषा बनाए रखता है; इसे केवल ‘मनुष्य बनकर’ कहकर व्याख्यायित नहीं किया गया।
- source_word: antichrist
  choice: मसीह-विरोधी
  rationale: शब्द का अर्थ सामान्य पाठक के लिए स्पष्ट रखते हुए पारंपरिक धार्मिक आशय सुरक्षित करता है।
- source_word: testimony of the Cross
  choice: क्रूस की गवाही
  rationale: मूल साक्ष्य की संक्षिप्त और संभावित रूप से बहुअर्थी अभिव्यक्ति को बिना विस्तार दिए सुरक्षित रखा गया।
- source_word: oracles/sayings of the Lord
  choice: प्रभु के वचन
  rationale: ‘वचन’ स्वाभाविक हिन्दी है और प्रभु के प्रामाणिक कथनों का भाव देता है; अत्यधिक तकनीकी ‘दैववाणियाँ’ से बचा गया।
- source_word: firstborn of Satan
  choice: शैतान का पहलौठा
  rationale: कठोर रूपक को नरम या व्याख्यायित किए बिना सुरक्षित रखा गया।
- source_word: vain doing
  choice: व्यर्थ आचरण
  rationale: यह पाठ के सामूहिक व्यवहार/प्रथाओं के भाव को समेटता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: being sober unto prayer
  choice: प्रार्थना के लिए सचेत रहें
  rationale: ‘सचेत’ जागरूक, संयमी और सावधान रहने के संयुक्त भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: constant in fastings
  choice: उपवासों में दृढ़ बने रहें
  rationale: बहुवचन ‘fastings’ को ‘उपवासों’ से बनाए रखा और निरंतरता को ‘दृढ़’ से व्यक्त किया।
- source_word: all-seeing God
  choice: सब कुछ देखनेवाला परमेश्वर
  rationale: दैवी सर्वदर्शिता को सरल, प्रत्यक्ष और गैर-तकनीकी भाषा में रखा गया।
theological_decisions:
- issue: यीशु मसीह के देह में आने का कालगत अर्थ
  choice: ‘देह में आए हैं’
  alternative: ‘देह में आए’ / ‘देह में आ रहे हैं’
  rationale: उपलब्ध अंग्रेज़ी साक्ष्य ‘is come’ पूर्ण हुई और वर्तमान महत्व रखनेवाली घटना का संकेत देता है; प्रत्यक्ष यूनानी/लातीनी समीक्षा लंबित होने के कारण अधिक विशिष्ट कालगत दावा नहीं जोड़ा गया।
- issue: ‘क्रूस की गवाही’ का आशय
  choice: अभिव्यक्ति को यथावत रखा
  alternative: ‘क्रूस के विषय की गवाही’ या ‘क्रूस का संदेश’
  rationale: यह क्रूस के ऐतिहासिक साक्ष्य, उसके संदेश अथवा उसके अंगीकार की ओर संकेत कर सकती है; अनिश्चितता को व्याख्यात्मक विस्तार से समाप्त नहीं किया गया।
- issue: पुनरुत्थान और न्याय
  choice: ‘न पुनरुत्थान है, न न्याय’
  alternative: ‘न मरे हुओं का पुनरुत्थान होगा, न अंतिम न्याय’
  rationale: पाठ जितना कहता है उतना ही रखा गया; ‘मरे हुओं का’ और ‘अंतिम’ जैसे धर्मवैज्ञानिक स्पष्टीकरण नहीं जोड़े गए।
- issue: ‘शैतान का पहलौठा’ रूपक
  choice: शाब्दिक रूपक सुरक्षित रखा
  alternative: ‘शैतान का प्रमुख पुत्र/मुख्य अनुयायी’
  rationale: मूल की तीव्र निंदात्मक और रूपकात्मक भाषा को किसी एक व्याख्या में सीमित नहीं किया गया।
- issue: ‘हमें परीक्षा में न लाए’ में परमेश्वर की भूमिका
  choice: प्रार्थना की पारंपरिक प्रत्यक्ष संरचना रखी
  alternative: ‘हमें परीक्षा में पड़ने न दे’
  rationale: दूसरा विकल्प धर्मवैज्ञानिक कठिनाई को हल कर देता, जबकि पाठ की वास्तविक तनावपूर्ण भाषा को बनाए रखना उचित है।
- issue: ‘आत्मा’ और ‘शरीर’
  choice: दोनों पद बिना व्याख्यात्मक विशेषण के रखे
  alternative: ‘मन तो तैयार है, पर मानवीय स्वभाव दुर्बल है’
  rationale: उद्धरण की बाइबिलीय शब्दावली और उसके मानवशास्त्रीय तनाव को सुरक्षित रखा गया।
