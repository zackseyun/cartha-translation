  yaml_path: translation/deuterocanon/judith/002/006.yaml
  text: And you shall go out to meet all the land toward the west[b][a], because they disobeyed the word of my mouth.
translation:
  language: hi
  text: और तुम पश्चिम की ओर के सारे भूभाग का सामना करने निकलोगे,[a] क्योंकि उन्होंने मेरे मुँह की बात नहीं मानी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम सारे भूभाग का सामना करने पश्चिम की ओर निकलोगे।” यूनानी पद पश्चिमी क्षेत्र या पश्चिम की दिशा, दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे मुँह की बात” का आशय मुँह से दी गई आज्ञा या घोषणा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσῃ
  choice: तुम ... निकलोगे
  rationale: भविष्यकालीन मध्यम रूप को सीधे भावी निर्देश के रूप में रखा गया है। ‘निकलोगे’ मूल गति को व्यक्त करता है और सैन्य प्रसंग से अधिक अर्थ नहीं जोड़ता।
- source_word: εἰς συνάντησιν
  choice: सामना करने
  rationale: इस मुहावरे का मूल अर्थ ‘मिलने के लिए निकलना’ है, पर यहाँ सैन्य प्रसंग में मुठभेड़ निहित है। ‘सामना करने’ आधुनिक हिन्दी में स्वाभाविक है और विरोधपूर्ण भेंट का भाव व्यक्त करता है।
- source_word: πάσῃ τῇ γῇ
  choice: सारे भूभाग का
  rationale: एकवचन γῇ के साथ πᾶς को सामूहिक अर्थ में लिया गया है—एक संपूर्ण क्षेत्र, न कि अलग-अलग प्रत्येक देश।
- source_word: ἐπὶ δυσμᾶς
  choice: पश्चिम की ओर के
  rationale: यूनानी पद पश्चिमी दिशा अथवा पश्चिमी क्षेत्र, दोनों का बोध करा सकता है। मुख्य पाठ में इसे भूभाग की भौगोलिक स्थिति से जोड़ा गया है, जबकि पादटिप्पणी दिशात्मक विकल्प सुरक्षित रखती है।
- source_word: ἠπείθησαν
  choice: उन्होंने ... नहीं मानी
  rationale: ἀπειθέω आज्ञा या कथन को मानने से इनकार करने का अर्थ देता है। हिन्दी में ‘बात नहीं मानी’ संक्षिप्त और स्वाभाविक है।
- source_word: τῷ ῥήματι τοῦ στόματός μου
  choice: मेरे मुँह की बात
  rationale: यह चयन यूनानी की शाब्दिक और आलंकारिक संरचना को बनाए रखता है; आशय मुँह से दी गई आज्ञा अथवा घोषणा है।
