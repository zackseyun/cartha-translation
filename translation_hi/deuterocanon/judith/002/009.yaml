    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: ले जाऊँगा
  rationale: ἄγω के भविष्यत् रूप का मूल अर्थ ‘ले जाना’ या ‘अगुवाई करना’ है। यहाँ बंदियों को दूर ले जाने की बलपूर्ण गति व्यक्त होती है, पर ढंग को अनावश्यक रूप से विशिष्ट नहीं किया गया।
- source_word: αἰχμαλωσίαν
  choice: बंदियों
  rationale: यह संज्ञा बंदी होने की अवस्था या बंदियों के समूह, दोनों को सूचित कर सकती है। αὐτῶν और ‘ले जाऊँगा’ के साथ इस संदर्भ में व्यक्तियों का अर्थ अधिक स्वाभाविक है; अमूर्त अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐπὶ τὰ ἄκρα
  choice: छोरों तक
  rationale: यह पद दूरस्थ सीमाओं या अंतिम भागों को सूचित करता है। ‘छोरों तक’ स्वाभाविक आधुनिक हिन्दी में इसकी भौगोलिक व्यापकता बनाए रखता है।
- source_word: πάσης τῆς γῆς
  choice: सारी पृथ्वी के
  rationale: γῆ का अर्थ ‘भूमि/देश’ अथवा ‘पृथ्वी’ हो सकता है। ‘छोरों तक’ और संदर्भ की साम्राज्यवादी डींग के कारण यहाँ विश्वव्यापी दावे को व्यक्त करने के लिए ‘सारी पृथ्वी’ चुना गया है।
