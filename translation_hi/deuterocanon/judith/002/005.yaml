base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/005.yaml
  text: 'Thus says the great king[a], the lord of all the earth: Behold, you shall go out from my presence, and you shall take with yourself men confident in their strength, one hundred twenty thousand foot soldiers, and a multitude of horses with riders, one hundred twenty thousand.'
translation:
  language: hi
  text: '“महान राजा, सारी पृथ्वी का स्वामी, यह कहता है: देख, तुम मेरे सामने से निकलोगे और अपने साथ ऐसे पुरुषों को ले जाओगे जो अपनी शक्ति पर भरोसा रखते हैं—एक लाख बीस हज़ार पैदल सैनिक और सवारों सहित एक लाख बीस हज़ार घोड़े।[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “बारह मिरियड,” अर्थात् बारह दस-हज़ार (1,20,000)।
    reason: स्रोत की विशिष्ट संख्या-अभिव्यक्ति को दर्ज करना।
lexical_decisions:
- source_word: Τάδε λέγει
  choice: यह कहता है
  rationale: राजकीय घोषणा के सूत्र को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ βασιλεὺς ὁ μέγας
  choice: महान राजा
  rationale: राजकीय उपाधि का सीधा और औपचारिक अनुवाद।
- source_word: ὁ κύριος πάσης τῆς γῆς
  choice: सारी पृथ्वी का स्वामी
  rationale: κύριος के अधिकार-सूचक अर्थ को रखता है; यह यहाँ मनुष्य राजा का दावा है, जबकि πάσης τῆς γῆς की सार्वभौमिक व्यापकता भी बनी रहती है।
- source_word: Ἰδοὺ
  choice: देख
  rationale: ध्यान आकर्षित करने वाले यूनानी अव्यय का स्पष्ट, आधुनिक और सीधा हिन्दी रूप।
- source_word: ἐξελεύσῃ ἐκ τοῦ προσώπου μου
  choice: तू मेरे सामने से निकलकर
  rationale: राजा की उपस्थिति से प्रस्थान करने के मुहावरे को शाब्दिक कठोरता के बिना सुरक्षित रखता है।
- source_word: λήμψῃ μετὰ σεαυτοῦ
  choice: अपने साथ ... ले जाएगा
  rationale: साथ ले जाने की क्रिया और भावी आज्ञात्मक कथन दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἄνδρας πεποιθότας ἐν ἰσχύι αὐτῶν
  choice: ऐसे पुरुषों को ... जो अपनी शक्ति पर भरोसा रखते हैं
  rationale: πεποιθότας में निहित भरोसे को केवल ‘शक्तिशाली’ कहकर मिटाता नहीं है।
- source_word: πεζῶν εἰς χιλιάδας ἑκατὸν εἴκοσι
  choice: एक लाख बीस हज़ार पैदल सैनिक
  rationale: यूनानी संख्या को मानक हिन्दी संख्या-पद्धति में और πεζῶν को उसके सैनिक अर्थ में स्पष्ट करता है।
- source_word: πλῆθος ἵππων σὺν ἀναβάταις
  choice: सवारों सहित ... घोड़े
  rationale: यूनानी पाठ में घोड़ों और उन पर चढ़ने वालों, दोनों के स्पष्ट उल्लेख को बनाए रखता है।
- source_word: μυριάδας δέκα δύο
  choice: एक लाख बीस हज़ार
  rationale: बारह ‘मिरियड’, अर्थात बारह दस-हज़ार, का स्वाभाविक हिन्दी संख्यात्मक रूप; स्रोत की अभिव्यक्ति पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: मानवीय राजा के लिए κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: यह नबूकदनेस्सर का राजकीय आत्म-दावा है, ईश्वरीय उपाधि नहीं। ‘स्वामी’ अधिकार का भाव सुरक्षित रखता है और अनावश्यक दिव्य पहचान से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजकीय घोषणा। ‘तू’ पदानुक्रम में अधीन सेनापति को संबोधन की एकवचन निकटता और अधिकारपूर्ण स्वर व्यक्त करता है; भाषा जानबूझकर सरल रखी गई है।
