  yaml_path: translation/deuterocanon/judith/002/007.yaml
  text: and to prepare earth and water[a], because I will go out against them in my wrath, and I will cover the whole face of the earth with the feet of my army, and I will give them over to plunder by them.
translation:
  language: hi
  text: और धरती और पानी तैयार करने को कहो[a], क्योंकि मैं अपने प्रकोप में उनके विरुद्ध निकलूँगा। मैं अपनी सेना के पैरों से सारी धरती की सतह को ढक दूँगा और उन्हें अपनी सेना को लूटने के लिए सौंप दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धरती और पानी’ संभवतः वे चिह्न थे जिन्हें कोई विजेता राजा अधीनता स्वीकार करने के प्रमाण के रूप में मँगवाता था।
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζειν
  choice: तैयार रखने को कहो
  rationale: अनंत क्रिया पूर्ववर्ती आज्ञा-क्रम को आगे बढ़ाती है। हिन्दी में आज्ञात्मक संबंध स्पष्ट करने के लिए ‘कहो’ जोड़ा गया है, जबकि ‘तैयार रखना’ मूल के व्यापक अर्थ को बनाए रखता है।
- source_word: γῆν καὶ ὕδωρ
  choice: धरती और पानी
  rationale: मूल के ठोस शब्द-युग्म को अक्षरशः रखा गया है; अधीनता के संकेत वाला संभावित सांस्कृतिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐξελεύσομαι
  choice: निकलूँगा
  rationale: यह ‘बाहर निकलने’ का सीधा अर्थ रखता है और सैन्य प्रसंग में स्वाभाविक हिन्दी है, बिना ‘चढ़ाई करूँगा’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: ἐν θυμῷ μου
  choice: अपने प्रकोप में
  rationale: θυμός की तीव्र क्रोध-सूचक शक्ति और राजकीय धमकी की गरिमा को ‘प्रकोप’ व्यक्त करता है।
- source_word: καλύψω πᾶν τὸ πρόσωπον τῆς γῆς
  choice: धरती के पूरे मुख को ढक दूँगा
  rationale: बाइबलीय देहात्मक रूपक ‘धरती का मुख’ सुरक्षित रखा गया है; कथन की व्यापक विजय-वाणी भी बनी रहती है।
- source_word: τοῖς ποσὶν τῆς δυνάμεώς μου
  choice: अपनी सेना के पैरों से
  rationale: इस सैन्य प्रसंग में δύναμις का आशय सैन्य बल है। ‘सेना’ साधारण पाठक के लिए स्पष्ट है और ‘पैरों’ की रौंदती हुई छवि को बनाए रखता है।
- source_word: δώσω αὐτοὺς εἰς διαρπαγὴν αὐτοῖς
  choice: उन्हें अपनी सेना के हाथ लूट के लिए सौंप दूँगा
  rationale: दोनों αὐτούς/αὐτοῖς के संदर्भ हिन्दी में अस्पष्ट हो सकते हैं; ‘अपनी सेना’ से अंतिम सर्वनाम का संभावित सैन्य संदर्भ स्पष्ट किया गया है। ‘लूट के लिए सौंपना’ Greek निर्माण का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘धरती और पानी’ का मुहावरेदार सांस्कृतिक अर्थ
  choice: मुख्य पाठ में ठोस शब्द-युग्म रखा और संभावित अधीनता-सूचक अर्थ पादटिप्पणी में समझाया।
  alternative: मुख्य पाठ में ‘अधीनता के चिह्न’ अनुवाद करना।
  rationale: यूनानी पाठ केवल γῆν καὶ ὕδωρ कहता है। सांस्कृतिक संकेत संभावित है, पर उसे निश्चित अर्थ बनाकर मुख्य पाठ में रखना मूल की अर्थगत खुली जगह को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक-राजकीय शैली रखी गई है। ‘धरती का मुख’ और ‘सेना के पैर’ जैसी मूल छवियाँ सुरक्षित हैं; अंतिम वाक्यांश को हिन्दी में बोधगम्य बनाने के लिए सर्वनाम का आशय ‘अपनी सेना’ से स्पष्ट किया गया है।
