translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, कथात्मक और गरिमापूर्ण रखी गई है। हिंसक सैन्य कार्रवाई को मूल के समान स्पष्ट कहा गया है, न तो नरम किया गया है और न बढ़ाया गया है। ‘भेड़-बकरियों’ और ‘गाय-बैलों’ से पशु-समूहों का भेद सामान्य पाठक के लिए स्पष्ट किया गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न कटनी के बाद दिखता है, पर उसकी विषयवस्तु तलवार वाले यूनानी मुहावरे से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [a] उसी वाक्यांश के बाद रखा गया है।
