base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/027.yaml
  text: And he went down into the plain of Damascus in the days of the wheat harvest[a], and he set all their fields on fire; their flocks and herds he gave over to destruction, and he plundered their cities and stripped bare their plains, and struck down all their young men with the edge of the sword.
translation:
  language: hi
  text: और वह गेहूँ की कटनी के दिनों में दमिश्क के मैदान में उतर गया। उसने उनके सभी खेतों में आग लगा दी; उनकी भेड़-बकरियों के झुंडों और गाय-बैलों के झुंडों को विनाश के हवाले कर दिया, उनके नगरों को लूटा, उनके मैदानों को पूरी तरह उजाड़ दिया, और उनके सभी युवकों को तलवार की धार से[a] मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तलवार के मुँह से”; यह तलवार से मार डालने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: उतर गया
  rationale: यह क्रिया नीचे की ओर जाने का स्पष्ट भौगोलिक भाव रखती है; ‘उतर गया’ आधुनिक हिन्दी में स्वाभाविक रूप से उसे बनाए रखता है।
- source_word: πεδίον Δαμασκοῦ
  choice: दमिश्क का मैदान
  rationale: πεδίον समतल खुले भूभाग को दर्शाता है और संबंधकारक Δαμασκοῦ इसे दमिश्क से जुड़े भौगोलिक मैदान के रूप में पहचानता है।
- source_word: ἐν ἡμέραις θερισμοῦ πυρῶν
  choice: गेहूँ की कटनी के दिनों में
  rationale: πυρῶν विशेष रूप से गेहूँ को सूचित करता है; पूरा पद कटनी के मौसम को व्यक्त करता है, जबकि ‘दिनों में’ यूनानी अभिव्यक्ति का रूप भी बनाए रखता है।
- source_word: ἐνέπρησεν πάντας τοὺς ἀγροὺς
  choice: सभी खेतों में आग लगा दी
  rationale: ἐνέπρησεν का कारक भाव किसी वस्तु को आग लगा देने का है और ἀγρούς यहाँ खेती की भूमि है।
- source_word: τὰ ποίμνια καὶ τὰ βουκόλια
  choice: भेड़-बकरियों के झुंडों और गाय-बैलों के झुंडों
  rationale: यह अनुवाद छोटे पशुओं के झुंड और गोपशुओं के झुंड के बीच मूल के युग्मित भेद को साधारण हिन्दी में स्पष्ट करता है।
- source_word: ἔδωκεν εἰς ἀφανισμόν
  choice: विनाश के हवाले कर दिया
  rationale: यह मूल की ‘विनाश के लिए दे दिया’ संरचना और कार्रवाई की कठोरता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐσκύλευσεν
  choice: लूटा
  rationale: क्रिया युद्ध में माल-असबाब छीन लेने या लूटने को व्यक्त करती है; ‘लूटा’ सीधा और प्रसंगानुकूल है।
- source_word: ἐξελίκμησεν
  choice: उजाड़कर नंगा कर दिया
  rationale: क्रिया पूरी तरह झाड़ या छानकर खाली कर देने की प्रबल छवि रखती है। यह पद उस संपूर्ण उजाड़ को व्यक्त करता है, पर उसे केवल सामान्य ‘नष्ट किया’ में नहीं समेटता।
- source_word: τὰ πεδία αὐτῶν
  choice: उनके मैदानों
  rationale: पहले आए ἀγρούς के लिए ‘खेत’ रखा गया है; यहाँ πεδία को ‘मैदान’ कहना मूल का शब्दगत भेद बनाए रखता है।
- source_word: ἐπάταξεν πάντας τοὺς νεανίσκους
  choice: उनके सभी जवान पुरुषों को ... मार गिराया
  rationale: ἐπάταξεν युद्ध-संदर्भ में घात करके मार गिराने का भाव देता है और νεανίσκους पुरुष युवाओं को सूचित करता है।
- source_word: ἐν στόματι ῥομφαίας
  choice: तलवार की धार से
  rationale: मूलतः ‘तलवार के मुँह से’ एक सामी-प्रभावित युद्ध-वाक्यांश है। हिन्दी में ‘तलवार की धार से’ उसका अर्थ स्वाभाविक ढंग से देता है, जबकि शाब्दिक चित्र पादटिप्पणी में रखा गया है।
