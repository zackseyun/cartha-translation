  text: And he summoned all his attendants and all his nobles[a], and he set before them the secret of his plan[b], and from his own mouth he declared all the evil of the land.
translation:
  language: hi
  text: उसने अपने सभी परिचारकों और सभी प्रमुख जनों को बुलाकर इकट्ठा किया, और उनके सामने अपनी योजना की गुप्त बात रखी[a]; और उसने अपने ही मुँह से देश की सारी बुराई पूरी तरह बता दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उनके साथ अपनी योजना का रहस्य साझा किया।” यहाँ “गुप्त बात” से आशय किसी गोपनीय योजना या विचार से है, किसी पारिभाषिक धार्मिक रहस्य से नहीं।
    reason: lexical_alternative
  - marker: b
    text: यह यूनानी वाक्यांश कठिन है। इसका अधिक शाब्दिक अर्थ “देश की सारी बुराई” है; पर इसका अर्थ देश के संबंध में, या देश के विरुद्ध किए जाने वाले, समस्त अनिष्ट को पूरी तरह बताना भी हो सकता है।
    reason: alternative_reading
