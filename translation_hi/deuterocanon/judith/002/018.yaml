lexical_decisions:
- source_word: ἐπισιτισμὸν
  choice: रसद
  rationale: यह संज्ञा भोजन-सामग्री या निर्वाह के लिए जुटाई गई आपूर्ति को दर्शाती है। सैन्य प्रसंग में ‘रसद’ स्वाभाविक है और केवल व्यक्तिगत भोजन-भाग तक अर्थ को सीमित नहीं करती।
- source_word: παντὶ ἀνδρὶ
  choice: हर एक पुरुष के लिए
  rationale: यूनानी पदबंध वितरणात्मक एकवचन में अक्षरशः ‘हर एक पुरुष के लिए’ है। प्रसंग सैनिकों का है, फिर भी मूल में ‘सैनिक’ शब्द नहीं है, इसलिए उसे पाठ में नहीं जोड़ा गया।
- source_word: εἰς πλῆθος
  choice: भरपूर
  rationale: यह मुहावरा बड़ी या पर्याप्त मात्रा व्यक्त करता है। ‘भरपूर’ आधुनिक हिन्दी में सहज रूप से रसद की प्रचुरता बताता है।
- source_word: χρυσίον καὶ ἀργύριον
  choice: सोना और चाँदी
  rationale: मूल पाठ सीधे बहुमूल्य धातुओं का नाम लेता है; उन्हें ‘धन’ या ‘सिक्के’ कहना अनावश्यक विशिष्टीकरण होता।
- source_word: ἐξ οἴκου βασιλέως
  choice: राजा के घर से
  rationale: यूनानी का शाब्दिक अर्थ ‘राजा के घर से’ है। प्रसंग में राजकोष या राजभवन अभिप्रेत हो सकता है, पर मुख्य पाठ में व्यापक और वास्तविक अस्पष्टता रखी गई है।
- source_word: σφόδρα
  choice: बहुत अधिक
  rationale: यहाँ क्रियाविशेषण सोने और चाँदी की मात्रा पर बल देता है; ‘बहुत अधिक’ उस तीव्रता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
