  text: And their wounded will fill their ravines and the wadis, and a river overflowing will be filled with their dead;
translation:
  language: hi
  text: और उनके घायल लोग उनकी घाटियों और बरसाती नालों[a] को भर देंगे, और उफनती हुई नदी उनके मृतकों से भर जाएगी।
  philosophy: optimal-equivalence
  footnotes:
