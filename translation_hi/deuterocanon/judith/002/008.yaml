    reason: lexical_alternative
lexical_decisions:
- source_word: τραυματίαι
  choice: घायल लोग
  rationale: यह संज्ञा घायल व्यक्तियों को दर्शाती है। केवल ‘घायल’ भी संभव है, पर ‘घायल लोग’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा ‘हताहत’ की अपेक्षा अधिक सटीक है।
- source_word: πληρώσουσιν
  choice: भर देंगे
  rationale: भविष्यकालीन क्रिया को सीधे और चित्रात्मक ढंग से व्यक्त करता है।
- source_word: φάραγγας
  choice: घाटियों
  rationale: यह शब्द गहरी या संकरी घाटियों और खड्डों के लिए प्रयुक्त हो सकता है। ‘घाटियों’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक विशेषण जोड़े बिना स्थलाकृतिक चित्र बनाए रखता है।
- source_word: χειμάρρους
  choice: बरसाती नालों
  rationale: यूनानी शब्द मौसमी तेज जलधारा अथवा उसके प्रवाह-पथ को सूचित कर सकता है। ‘बरसाती नाले’ निकट-पूर्वी भू-दृश्य में इस मौसमी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ποταμὸς ἐπικλύζων
  choice: उफनती हुई नदी
  rationale: वर्तमान कृदंत नदी के उमड़ने, बाढ़ लाने या किनारों से बाहर बहने का चित्र देता है। ‘उफनती हुई नदी’ प्राकृतिक हिन्दी में इस गतिशीलता को बनाए रखता है।
- source_word: τοῖς νεκροῖς
  choice: उनके मृतकों से
  rationale: νεκροί मृत व्यक्तियों या शवों को सूचित कर सकता है। ‘उनके मृतकों से’ गंभीर और गरिमापूर्ण है तथा ‘शवों’ की अपेक्षा मूल की अभिव्यक्ति को व्यापक रखता है।
