  yaml_path: translation/deuterocanon/judith/002/010.yaml
  text: But you[a], after going out, shall seize all their territory in advance for me, and they will surrender themselves to you; and you shall keep them for me until the day of their punishment.
translation:
  language: hi
  text: पर तू निकलकर उनके सारे प्रदेश पर मेरे लिए पहले ही अधिकार कर लेगा, और वे तेरे सामने आत्मसमर्पण कर देंगे; और तू उन्हें मेरे लिए उनके दण्ड के दिन तक संभालकर रखेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी फटकार के दिन तक” अथवा “उनकी ताड़ना के दिन तक।” यूनानी शब्द ἐλεγμός फटकार, भर्त्सना, या दण्ड देकर सुधारने का भाव सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: निकलकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया दिखाता है; ‘निकलकर’ स्वाभाविक हिन्दी में वही क्रम व्यक्त करता है।
- source_word: προκαταλήμψῃ
  choice: पहले से ... अधिकार कर लेना
  rationale: क्रिया में पूर्वता और बलपूर्वक कब्ज़े, दोनों का भाव है; यह प्रयोग προ- उपसर्ग और सैनिक प्रसंग को बनाए रखता है।
- source_word: πᾶν ὅριον αὐτῶν
  choice: उनके सारे प्रदेश
  rationale: ὅριον सीमा, सीमावर्ती भूभाग या अधिकार-क्षेत्र हो सकता है; सैनिक प्रसंग में केवल सीमा-रेखा नहीं, पूरा प्रदेश अभिप्रेत है।
- source_word: ἐκδώσουσίν σοι ἑαυτούς
  choice: वे अपने आपको तेरे हाथ सौंप देंगे
  rationale: ἑαυτούς का आत्मवाचक भाव स्वेच्छा से समर्पण दर्शाता है; ‘तेरे हाथ सौंप देंगे’ सहज आधुनिक हिन्दी है।
- source_word: διατηρήσεις
  choice: सुरक्षित रखना
  rationale: क्रिया का अर्थ बचाए रखना या संभालकर रखना है; यहाँ जीते गए लोगों को बाद की कार्रवाई तक जीवित और नियंत्रण में रखने का भाव है।
- source_word: εἰς ἡμέραν ἐλεγμοῦ αὐτῶν
  choice: उनकी दण्ड-प्राप्ति के दिन तक
  rationale: ἐλεγμός में फटकार, भर्त्सना या सुधारात्मक दण्ड का अर्थ हो सकता है; राजकीय-सैनिक धमकी के प्रसंग में दण्ड का भाव प्रमुख है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: सैनिक-न्यायिक प्रसंग में ἐλεγμός का अर्थ
  choice: दण्ड-प्राप्ति
  alternative: फटकार; ताड़ना
  rationale: वचन विजय और अधीन किए गए लोगों के भावी व्यवहार से संबंधित है, इसलिए दण्ड का अर्थ प्रसंगानुकूल है। फिर भी मूल शब्द की व्यापकता को पादटिप्पणी में बनाए रखा गया है और इसे विशेष रूप से अंतिम न्याय नहीं बनाया गया।
translation_notes:
  register: राजा द्वारा सेनापति को दिए गए सीधे आदेश के अनुरूप एकवचन निकट/अधीनस्थ संबोधन ‘तू/तेरे’ रखा गया है। भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है; सैन्य बल तथा ἐλεγμός की अर्थगत व्यापकता दोनों सुरक्षित हैं।
