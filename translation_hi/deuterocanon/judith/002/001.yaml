  yaml_path: translation/deuterocanon/judith/002/001.yaml
  text: And in the eighteenth year[a], on the twenty-second day of the first month, a word came in the house of Nebuchodonosor king of the Assyrians, to take vengeance on all the land[c][b], just as he had spoken.
translation:
  language: hi
  text: और अठारहवें वर्ष में, पहले महीने के बाईसवें दिन, अश्शूरियों के राजा नबूकदनेस्सर के राजभवन[a] में यह बात उठी[b] कि वह पूरी भूमि[c] से बदला ले, जैसा उसने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘घर में’; यहाँ इसका अर्थ ‘राजमहल’ या ‘राजदरबार’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘एक बात हुई।’ इसका अर्थ ‘निर्णय लिया गया’ या ‘आज्ञा जारी हुई’ भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘सारी पृथ्वी।’ यूनानी शब्द का अर्थ ‘देश/भूमि’ और ‘पृथ्वी’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ ὀκτωκαιδεκάτῳ
  choice: अठारहवें वर्ष में
  rationale: यह कालसूचक पदबंध यूनानी की औपचारिक तिथि-शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δευτέρᾳ καὶ εἰκάδι τοῦ πρώτου μηνός
  choice: पहले महीने के बाईसवें दिन
  rationale: यूनानी क्रमवाचक अभिव्यक्ति महीने के बाईसवें दिन को सूचित करती है; हिन्दी में यह स्पष्ट और सहज रूप है।
- source_word: ἐγένετο λόγος
  choice: यह बात तय हुई
  rationale: शाब्दिक अर्थ ‘एक बात/वचन हुआ’ है; राजकीय संदर्भ में निर्णय का भाव है, पर ‘आज्ञा जारी हुई’ की अपेक्षा यह अभिव्यक्ति औपचारिक आदेश का अनावश्यक आग्रह नहीं करती।
- source_word: ἐν οἴκῳ Ναβουχοδονοσὸρ
  choice: नबूकदनेस्सर के राजभवन में
  rationale: οἶκος का मूल अर्थ घर है, किंतु राजा के प्रसंग में राजनिवास या दरबार अभिप्रेत हो सकता है। ‘राजभवन’ आधुनिक हिन्दी में इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: βασιλέως Ἀσσυρίων
  choice: अश्शूरियों के राजा
  rationale: यह यूनानी संबंधकारक उपाधि का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐκδικῆσαι
  choice: बदला लेगा
  rationale: क्रिया प्रतिशोध लेने को व्यक्त करती है। हिन्दी वाक्य में भावी क्रिया निर्णय की विषयवस्तु को स्पष्ट करती है, बिना यूनानी में अनुपस्थित आत्मवाचक पद जोड़े।
- source_word: πᾶσαν τὴν γῆν
  choice: सारे देश
  rationale: γῆ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। कथा का राजनीतिक-क्षेत्रीय प्रसंग ‘देश’ का समर्थन करता है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: καθὼς ἐλάλησεν
  choice: ठीक जैसा उसने कहा था
  rationale: यह नबूकदनेस्सर के पहले कथन से निर्णय का संबंध बनाए रखता है और यूनानी के बलयुक्त καθὼς को ‘ठीक जैसा’ से व्यक्त करता है।
theological_decisions:
- issue: ἐγένετο λόγος को औपचारिक राजाज्ञा मानना या व्यापक अर्थ वाला निर्णय/बात बनाए रखना
  choice: यह बात तय हुई
  alternative: यह वचन हुआ; एक आज्ञा जारी हुई
  rationale: यूनानी औपचारिक राजाज्ञा को स्पष्टतः नहीं कहता। चुना हुआ पाठ दरबारी निर्णय का स्वाभाविक अर्थ देता है, पर उसे विधिवत जारी आदेश तक सीमित नहीं करता।
- issue: γῆ का क्षेत्रीय या सार्वभौमिक अर्थ
  choice: सारे देश
  alternative: सारी पृथ्वी; सारी भूमि
  rationale: निकटवर्ती कथा विजित किए जाने वाले क्षेत्रों से संबंधित है, इसलिए क्षेत्रीय अर्थ अधिक संभावित है; फिर भी यूनानी की व्यापक अर्थ-संभावना पादटिप्पणी में रखी गई है।
- issue: ἐκδικῆσαι में आत्मवाचक अर्थ स्पष्ट करना
  choice: बदला लेगा
  alternative: अपना बदला लेगा
  rationale: कर्ता का प्रतिशोध प्रसंग से स्पष्ट है, पर यूनानी में अलग आत्मवाचक सर्वनाम नहीं है; इसलिए ‘अपना’ जोड़कर अर्थ को अनावश्यक रूप से अधिक निश्चित नहीं किया गया।
