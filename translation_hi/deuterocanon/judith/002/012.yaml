translation:
  language: hi
  text: क्योंकि मेरे जीवन की शपथ और मेरे राज्य की शक्ति की शपथ, मैंने कहा है और मैं ये बातें अपने हाथ से करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का गंभीर, शपथ-सदृश आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ उस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ζῶν ἐγώ
  choice: मेरे जीवन की शपथ
  rationale: शाब्दिक अर्थ ‘मैं जीवित हूँ’ है, पर यहाँ यह प्रचलित शपथ-सूत्र है। हिन्दी में ‘मेरे जीवन की शपथ’ उसके आशय और गंभीरता को स्पष्ट करता है।
- source_word: τὸ κράτος τῆς βασιλείας μου
  choice: मेरे राज्य की सामर्थ्य
  rationale: κράτος शक्ति, सामर्थ्य या प्रभुत्वसूचक बल को दर्शाता है; ‘सामर्थ्य’ राजकीय शक्ति का अर्थ रखता है और ‘राज्य’ के साथ अनावश्यक पुनरुक्ति से बचता है।
- source_word: λελάληκα
  choice: मैंने कह दिया है
  rationale: पूर्णकालिक रूप पहले से किए गए और अब भी प्रभावी कथन पर बल देता है; ‘कह दिया है’ आधुनिक हिन्दी में उस निर्णायकता को व्यक्त करता है।
- source_word: ποιήσω ταῦτα
  choice: ये काम मैं ... करूँगा
  rationale: बहुवचन ταῦτα को ‘ये काम’ के रूप में रखा गया है और ποιήσω का सीधा भविष्यकालीन अर्थ सुरक्षित है।
- source_word: ἐν χειρί μου
  choice: अपने हाथ से
  rationale: शाब्दिक बिंब को बनाए रखते हुए यह प्रत्यक्ष व्यक्तिगत कर्तृत्व को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: राजकीय आत्म-साक्ष्य वाले शपथ-सूत्र का रूप
  choice: मेरे जीवन और मेरे राज्य की सामर्थ्य की शपथ
  alternative: मैं जीवित हूँ, और मेरे राज्य की सामर्थ्य
  rationale: यूनानी वाक्यांश संक्षिप्त और शपथ-सदृश है; दूसरे पद के लिए क्रिया व्यक्त नहीं की गई। चुना हुआ रूप इसे पूर्ण कथन बनाकर किसी एक धर्मवैज्ञानिक अर्थ में नहीं बाँधता, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और राजकीय घोषणा के अनुरूप रखी गई है। ‘शपथ’ मूल में अलग संज्ञा के रूप में नहीं है, पर ζῶν ἐγώ की शपथ-सूत्रीय शक्ति को स्वाभाविक हिन्दी में व्यक्त करती है; शाब्दिक बनावट पादटिप्पणी में दी गई है।
