  yaml_path: translation/deuterocanon/judith/002/013.yaml
  text: And you also must not transgress a single one of your lord’s words, but you shall surely carry out exactly as I have commanded you, and you shall not delay to do them.
translation:
  language: hi
  text: और तुम भी अपने स्वामी की एक भी बात का उल्लंघन न करना, बल्कि जैसा मैंने तुम्हें आदेश दिया है, ठीक वैसा ही उन्हें अवश्य पूरा करना, और उन्हें करने में देर न लगाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παραβήσῃ
  choice: उल्लंघन न करना
  rationale: παραβαίνω का मूल भाव निर्धारित सीमा या आदेश का अतिक्रमण करना है। ‘उल्लंघन’ आदेश की गंभीरता और औपचारिक सैन्य प्रसंग दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἓν τι τῶν ῥημάτων
  choice: बातों में से एक भी बात
  rationale: यह प्रयोग प्रत्येक आदेश पर बल देता है—एक भी बात छोड़ी या तोड़ी न जाए। हिन्दी का ‘एक भी’ यूनानी के वितरणात्मक और बलात्मक अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: τοῦ κυρίου σου
  choice: अपने स्वामी
  rationale: यहाँ κύριος किसी मानवीय वरिष्ठ अधिकारी के लिए है, परमेश्वर के लिए नहीं। ‘स्वामी’ अधीनता और अधिकार का भाव बनाए रखता है तथा इस औपचारिक प्रसंग के अनुकूल है।
- source_word: ἐπιτελῶν ἐπιτελέσεις
  choice: पूरी तरह पूरा करना
  rationale: एक ही धातु के कृदन्त और सीमित क्रिया-रूप की पुनरुक्ति कार्य को निश्चित और पूर्ण रूप से संपन्न करने पर बल देती है। ‘पूरी तरह पूरा करना’ उस बल को पठनीय हिन्दी में बनाए रखता है।
- source_word: καθότι προστέταχά σοι
  choice: जैसा मैंने तुम्हें आज्ञा दी है, वैसा ही
  rationale: καθότι ठीक अनुरूपता को और προστάσσω अधिकारपूर्वक आदेश देने को व्यक्त करता है। ‘वैसा ही’ निर्देश से तनिक भी न हटने का भाव देता है।
- source_word: οὐ μακρυνεῖς
  choice: देर न लगाना
  rationale: इस प्रसंग में μακρύνω काम को लंबा खींचने या टालने का अर्थ देता है। ‘देर न लगाना’ आदेश की तात्कालिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοῦ ποιῆσαι αὐτά
  choice: उन्हें करने में
  rationale: αὐτά बहुवचन में पहले कही गई बातों या आदेशों की ओर लौटता है। ‘उन्हें’ उस बहुवचन संबंध को सुरक्षित रखता है, और ‘करने में’ विलंब के साथ स्वाभाविक हिन्दी रचना बनाता है।
theological_decisions:
- issue: मानवीय वरिष्ठ के लिए κύριος का अनुवाद
  choice: अपने स्वामी
  alternative: अपने मालिक
  rationale: प्रसंग सैन्य पदानुक्रम का है, इसलिए यहाँ κύριος ईश्वरीय उपाधि नहीं है। ‘स्वामी’ मानवीय अधिकार और अधीनता का अर्थ देता है; ‘मालिक’ संभव है, पर इस राजकीय-सैन्य आदेश में अपेक्षाकृत कम गरिमापूर्ण लगता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, औपचारिक और आदेशात्मक है। ‘न करना’ तथा ‘देर न लगाना’ सीधे संबोधन में दृढ़ निषेध व्यक्त करते हैं। यूनानी की बलात्मक पुनरुक्ति को अत्यधिक कृत्रिम शब्दशः दोहराव के बजाय ‘पूरी तरह पूरा करना’ से दर्शाया गया है।
