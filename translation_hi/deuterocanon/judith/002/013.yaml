review_pass:
  verdict: revise
  source_fidelity: Draft accurately identifies κύριος as a human superior ('स्वामी'), retains the comprehensive prohibition ('not even one'), conveys the emphatic requirement to carry out the orders, and preserves the prohibition against delay. The revised wording more directly links the plural pronoun to the lord's words/orders and renders the emphatic ἐπιτελῶν ἐπιτελέσεις without the somewhat tautological 'पूरी तरह पूरा करना'.
  naturalness: The draft's 'बातों में से एक भी बात' and especially 'उन्हें पूरी तरह पूरा करना' are understandable but stylistically repetitive in modern standard Hindi. 'अपने स्वामी की एक भी बात का उल्लंघन' and 'उन्हें अवश्य पूरा करना' are smoother while retaining the force.
  terminology: '''स्वामी'' is suitable for the human κύριος in this military-administrative context and avoids a divine-title reading. ''उल्लंघन,'' ''आदेश,'' and ''देर न लगाना'' fit the formal imperative register. No footnotes are required.'
  issues:
  - severity: low
    issue: Unnatural repetition in the execution clause
    rationale: ‘उन्हें पूरी तरह पूरा करना’ duplicates the same idea and is less idiomatic than ‘उन्हें अवश्य पूरा करना.’ The latter also naturally represents the Greek emphatic participle-plus-verb construction.
  - severity: low
    issue: Awkward distributive wording
    rationale: ‘बातों में से एक भी बात’ is semantically correct but unnecessarily repetitive. ‘अपने स्वामी की एक भी बात’ expresses the same total prohibition in natural Hindi.
  revised_text: और तुम भी अपने स्वामी की एक भी बात का उल्लंघन न करना, बल्कि जैसा मैंने तुम्हें आदेश दिया है, ठीक वैसा ही उन्हें अवश्य पूरा करना, और उन्हें करने में देर न लगाना।
  revised_footnotes: []
