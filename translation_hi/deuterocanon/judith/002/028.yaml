base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/028.yaml
  text: And fear and dread of him fell upon those living along the coast—those in Sidon and Tyre[a], those living in Assur and Ocina, and all those living in Jamnia[b]; and those living in Azotus and Ascalon were very greatly afraid of him.
translation:
  language: hi
  text: और समुद्रतट पर रहनेवालों पर उसका भय और आतंक[b] छा गया—अर्थात सीदोन और सूर में रहनेवालों पर, अस्सूर और ओकीना में रहनेवालों पर, और यम्निया में रहनेवाले सभी लोगों पर। अज़ोतुस और अस्कलोन[a] में रहनेवाले भी उससे बहुत अधिक डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अज़ोतुस, अशदोद का यूनानी नाम है; और अस्कलोन, अश्कलोन का यूनानी नाम है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द-युग्म का अधिक शाब्दिक अनुवाद “भय और कंपकंपी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: छा गया
  rationale: यह ἐπιπίπτω के ‘आ पड़ना/छा जाना’ वाले सजीव भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और कथात्मक भूतकाल बनाए रखता है।
- source_word: φόβος καὶ τρόμος
  choice: भय और आतंक
  rationale: यह युग्म तीव्र भय व्यक्त करता है। ‘भय और आतंक’ आधुनिक हिन्दी में स्वाभाविक है; τρόμος के शाब्दिक ‘कंपकंपी’ भाव को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: αὐτοῦ
  choice: उसका
  rationale: सम्बन्धकारक रूप को निकटता से रखते हुए यह उस व्यक्ति को भय और आतंक के विषय अथवा स्रोत के रूप में इंगित करता है, बिना सम्बन्ध को अनावश्यक रूप से अधिक स्पष्ट किए।
- source_word: τοὺς κατοικοῦντας τὴν παραλίαν
  choice: समुद्रतट पर रहनेवालों
  rationale: παραλία समुद्रतटीय क्षेत्र को सूचित करता है; यह पद सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: Σιδῶνι καὶ Τύρῳ
  choice: सीदोन और सूर
  rationale: ये हिन्दी बाइबल परम्परा में प्रचलित और पहचानने योग्य स्थान-नाम हैं।
- source_word: Ἀσσούρ
  choice: अस्सूर
  rationale: इसे किसी बड़े क्षेत्र ‘असीरिया’ के रूप में व्याख्यायित करने के बजाय यूनानी पाठ के स्थान-नाम का लिप्यंतरण रखा गया है।
- source_word: Ὀκεινὰ
  choice: ओकीना
  rationale: अनिश्चित पहचान वाले स्थान-नाम को यूनानी रूप के निकट देवनागरी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: Ἰεμνάν
  choice: यम्निया
  rationale: यह पहचाने जाने योग्य परम्परागत रूप Jamnia/Yamnia को आधुनिक हिन्दी ध्वन्यात्मक रूप में प्रस्तुत करता है।
- source_word: Ἀζώτῳ
  choice: अज़ोतुस
  rationale: यूनानी साक्ष्य के हेलेनीकृत नाम को मुख्य पाठ में रखा गया है; अशदोद नाम पादटिप्पणी में दिया गया है।
- source_word: Ἀσκάλωνι
  choice: अस्कलोन
  rationale: यूनानी पाठ के स्थान-नाम को मुख्य पाठ में लिप्यंतरित किया गया है; अश्कलोन का अधिक परिचित रूप पादटिप्पणी में दिया गया है।
- source_word: ἐφοβήθησαν αὐτὸν σφόδρα
  choice: उससे बहुत अधिक डर गए
  rationale: क्रिया के साथ व्यक्ति को भय के लक्ष्य के रूप में स्पष्ट रखता है और σφόδρα की प्रबल तीव्रता को ‘बहुत अधिक’ से व्यक्त करता है।
