  text: And he himself and all his force set out on the march to go before King Nebuchadnezzar and to cover the whole face of the land toward the west with his chariots and horsemen and his chosen foot soldiers[a].
translation:
  language: hi
  text: और वह स्वयं अपनी सारी सेना के साथ अभियान पर निकल पड़ा, ताकि राजा नबूकदनेस्सर के आगे-आगे जाकर अपने रथों, घुड़सवारों और चुने हुए पैदल सैनिकों से सारी भूमि को पश्चिम की ओर ढक दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... εἰς πορείαν
  choice: अभियान पर निकल पड़ा
  rationale: शाब्दिक अर्थ ‘यात्रा के लिए बाहर निकला’ है, पर सैन्य प्रसंग में यह युद्ध-अभियान के लिए प्रस्थान को दर्शाता है। यह अनुवाद स्वाभाविक हिन्दी में दोनों पदों का संयुक्त भाव व्यक्त करता है।
- source_word: πᾶσα ἡ δύναμις αὐτοῦ
  choice: अपनी सारी सेना
  rationale: δύναμις का अर्थ ‘शक्ति’ भी हो सकता है, किंतु रथों, घुड़सवारों और पैदल सैनिकों वाला संदर्भ स्पष्ट रूप से सैन्य बल का है। ‘सेना’ सामान्य हिन्दी में स्वाभाविक और सटीक है।
- source_word: τοῦ προελθεῖν βασιλέως Ναβουχοδονοσόρ
  choice: राजा नबूकदनेस्सर के आगे-आगे जाकर
  rationale: προέρχομαι यहाँ किसी के आगे जाने या अग्रिम रूप से बढ़ने का भाव रखता है। ‘आगे-आगे’ इस संबंध को स्पष्ट रखते हुए नेतृत्व या प्रतिनिधित्व का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: καλύψαι πᾶν τὸ πρόσωπον τῆς γῆς
  choice: सारी भूमि को ढक दे
  rationale: यूनानी मुहावरा अक्षरशः ‘भूमि के पूरे मुख को ढकना’ है। हिन्दी में ‘सारी भूमि को ढक देना’ उस व्यापक फैलाव की सजीव छवि को स्वाभाविक ढंग से बनाए रखता है; ‘रौंद डालना’ या ‘जीत लेना’ अनावश्यक व्याख्या जोड़ते।
- source_word: πρὸς δυσμαῖς
  choice: पश्चिम की ओर की
  rationale: यह पद पश्चिम दिशा की ओर बढ़ते भूभाग को सूचित करता है। चुना हुआ रूप इसे भूमि के साथ स्वाभाविक हिन्दी में जोड़ता है।
- source_word: ἅρμασι καὶ ἱππεῦσι καὶ πεζοῖς ἐπιλέκτοις αὐτοῦ
  choice: अपने रथों, घुड़सवारों और चुने हुए पैदल सैनिकों से
  rationale: यह तीनों सैन्य घटकों को अलग-अलग और स्पष्ट रखता है। ἐπιλέκτοις का ‘चुने हुए’ अनुवाद आधुनिक तकनीकी पद ‘विशिष्ट सैन्य-दल’ जैसी अतिरिक्त धारणा से बचता है।
