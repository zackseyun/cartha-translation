translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, जिसमें सैन्य प्रसंग के लिए गरिमापूर्ण किंतु सामान्य शब्दावली रखी गई है। ‘अभियान पर निकल पड़ा’ स्वाभाविक प्रवाह देता है, जबकि ‘ढक दे’ मूल की व्यापक सैन्य उपस्थिति वाली दृश्यात्मक भाषा को सुरक्षित रखता है।
