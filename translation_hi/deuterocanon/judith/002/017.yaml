  text: और उसने उनके सामान के लिए ऊँट, गधे और खच्चर लिए[a]—बहुत ही बड़ी संख्या में—और उनके भोजन-प्रबंध के लिए भेड़ें, गाय-बैल और बकरियाँ भी लीं[b], जिनकी कोई गिनती न थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके साज-सामान के लिए”; यूनानी पद का अर्थ व्यापक रूप से सामान, उपकरण या पूरी रसद-सज्जा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी आपूर्ति के लिए”; यहाँ प्रयुक्त यूनानी शब्द तैयारी या आपूर्ति का अर्थ दे सकता है, और इस संदर्भ में सम्भवतः भोजन की व्यवस्था को सूचित करता है।
    reason: lexical_alternative
