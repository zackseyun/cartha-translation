- source_word: πλῆθος πολὺ σφόδρα
  choice: बहुत ही बड़ी संख्या में
  rationale: यह πολὺ और σφόδρα की संयुक्त तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πρόβατα καὶ βόας καὶ αἶγας
  choice: भेड़ें, गाय-बैल और बकरियाँ
  rationale: πρόβατα और αἶγας के सीधे अर्थ लिए गए हैं। βόας को केवल ‘बैल’ कहने के बजाय ‘गाय-बैल’ रखा गया है, क्योंकि यहाँ भोजन हेतु मवेशियों का व्यापक झुंड अभिप्रेत हो सकता है।
- source_word: εἰς τὴν παρασκευὴν αὐτῶν
  choice: उनके भोजन-प्रबंध के लिए
  rationale: παρασκευή का अर्थ तैयारी या आपूर्ति हो सकता है; खाद्य पशुओं की सूची के कारण यहाँ सेना के भोजन की व्यवस्था प्रमुख संदर्भगत अर्थ है।
- source_word: ὧν οὐκ ἦν ἀριθμός
  choice: जिनकी कोई गिनती न थी
  rationale: यूनानी संरचना और बाइबिलीय मुहावरे को निकटता से रखते हुए असंख्यता का भाव व्यक्त किया गया है।
