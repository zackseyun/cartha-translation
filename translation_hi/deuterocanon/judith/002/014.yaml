  text: And Holofernes went out from the presence of his lord, and he called all the nobles and the generals and overseers of the Assyrian army,
translation:
  language: hi
  text: और होलोफेरनेस अपने स्वामी की उपस्थिति से चला गया, और उसने अश्शूर की सेना के सभी सामंतों, सेनापतियों और निरीक्षकों को बुलाया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकल गया
  rationale: यह ἐξέρχομαι का सीधा कथात्मक रूप है और स्थान से बाहर जाने की ठोस गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ προσώπου
  choice: के सामने से
  rationale: यह सामी प्रभाव वाला मुहावरा किसी की उपस्थिति से विदा होने को बताता है। ‘के सामने से’ उसके दरबारी और औपचारिक भाव को बनाए रखता है।
- source_word: τοῦ κυρίου αὐτοῦ
  choice: अपने स्वामी
  rationale: यहाँ κύριος परमेश्वर के लिए नहीं, बल्कि होलोफेरनेस के मानवीय अधिपति के लिए प्रयुक्त है। ‘स्वामी’ आधुनिक हिन्दी में इस अधीनस्थ संबंध को स्पष्ट रखता है।
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: क्रिया का सीधा अर्थ इन अधिकारियों को अपने पास आने के लिए बुलाना है; यह ‘तलब किया’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: δυνάστας
  choice: सामंतों
  rationale: शब्द सत्ता-संपन्न, उच्च पदस्थ पुरुषों को सूचित करता है। राजकीय-सैन्य परिवेश में ‘सामंत’ इस अभिजात वर्ग का स्वाभाविक हिन्दी समतुल्य है।
- source_word: στρατηγοὺς
  choice: सेनापतियों
  rationale: यह सैन्य नेतृत्व का पद है; ‘सेनापति’ स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: ἐπιστάτας
  choice: निरीक्षकों
  rationale: शब्द उन अधिकारियों को सूचित करता है जिन्हें दूसरों के ऊपर देखरेख का दायित्व दिया गया था। ‘निरीक्षक’ प्रशासनिक पर्यवेक्षण का भाव रखता है, बिना किसी निश्चित आधुनिक सैन्य पद का आरोपण किए।
- source_word: τῆς δυνάμεως Ἀσσούρ
  choice: अश्शूर की सेना के
  rationale: सैन्य प्रसंग में δύναμις का अर्थ सशस्त्र बल या सेना है। संबंधकारक पदबंध को ‘अश्शूर की सेना’ कहना स्वाभाविक और स्रोत के अनुरूप है।
- source_word: Ἀσσούρ
  choice: अश्शूर
  rationale: यूनानी रूप यहाँ देश/राज्य अश्शूर को सूचित करता है। हिन्दी बाइबलीय परंपरा में ‘अश्शूर’ परिचित भौगोलिक नाम है।
theological_decisions:
- issue: मानवीय अधिपति के लिए κύριος का अनुवाद
  choice: अपने स्वामी
  alternative: अपने प्रभु
  rationale: प्रसंग में यह उपाधि होलोफेरनेस के मानवीय वरिष्ठ के लिए है, परमेश्वर के लिए नहीं। ‘स्वामी’ अधीनता और दरबारी पदक्रम को व्यक्त करते हुए अनावश्यक दैवी भ्रम से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। पद मूल यूनानी की तरह अगले वाक्यांश की ओर बढ़ता हुआ अल्पविराम पर समाप्त होता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
