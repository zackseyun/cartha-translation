  naturalness: The revision uses natural, modern formal Hindi while retaining the narrative continuation and the source sentence’s final comma.
  terminology: ‘स्वामी’ suitably identifies the human κύριος without divine overtones. ‘सामंतों, सेनापतियों और निरीक्षकों’ preserves the three distinct classes of officials; ‘अश्शूर’ is an appropriate established Hindi biblical form.
