  yaml_path: translation/deuterocanon/judith/002/011.yaml
  text: But against those who disobey, your eye shall not spare; you shall give them over to slaughter and plunder throughout all your land.
translation:
  language: hi
  text: परन्तु जो आज्ञा नहीं मानते, उन पर तुम्हारी आँख दया न करे; तुम उन्हें अपने पूरे देश में वध और लूट के हवाले कर दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντας
  choice: जो आज्ञा नहीं मानते
  rationale: यह कृदन्त उन लोगों को दर्शाता है जो आदेश मानने से इनकार करते हैं; सरल आधुनिक हिन्दी में इसका स्पष्ट अर्थ रखा गया है।
- source_word: οὐ φείσεται ὁ ὀφθαλμός σου
  choice: तुम्हारी आँख दया न करे
  rationale: यूनानी के नेत्र-संबंधी मुहावरे को बनाए रखते हुए उसका करुणा न दिखाने का आशय स्पष्ट रहता है।
- source_word: εἰς φόνον καὶ ἁρπαγήν
  choice: वध और लूट के लिए
  rationale: φόνος के हिंसक मृत्यु/संहार और ἁρπαγή के लूटपाट संबंधी अर्थ को संक्षिप्त समानांतर पदों में रखा गया है।
- source_word: ἐν πάσῃ τῇ γῇ σου
  choice: अपने पूरे देश में
  rationale: πάσῃ की समग्रता और γῇ के राजनीतिक-भौगोलिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: निर्दयता के आदेश की तीव्रता
  choice: ‘तुम्हारी आँख दया न करे’ के रूप में स्पष्ट आदेश बनाए रखा गया है
  alternative: ‘तुम उन्हें मत छोड़ना’
  rationale: मूल पाठ के कठोर नेत्र-मुहावरे और नैतिक तनाव को नरम या व्याख्यायित नहीं किया गया।
- issue: δοῦναι का वाक्यगत बल
  choice: ‘तुम उन्हें ... सौंप दो’ को पहले आदेश के साथ समन्वित आज्ञा माना गया है
  alternative: ‘ताकि उन्हें ... सौंप दिया जाए’
  rationale: यह अनंत क्रिया पहले कथन के उद्देश्य अथवा परिणाम को भी सूचित कर सकती है, पर प्रसंग और अंग्रेज़ी परामर्श-पाठ के अनुरूप स्वतंत्र आज्ञार्थक प्रवाह हिन्दी में अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। ‘परन्तु’ से विरोध, ‘आज्ञा नहीं मानते’ से अवज्ञा, तथा ‘वध और लूट’ से मूल की कठोरता सुरक्षित रखी गई है।
