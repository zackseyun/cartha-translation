review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the adversative force, the disobedient people, the unsparing-eye idiom, and the scope of "all your land." However, "वध और लूट के लिए सौंप दो" can suggest that the people are being assigned to carry out slaughter and plunder. The Greek "δοῦναι αὐτοὺς εἰς φόνον καὶ ἁρπαγήν" instead gives them over to slaughter and plunder.
  naturalness: '"तुम्हारी आँख दया न करे" is understandable but slightly incomplete in Hindi without explicitly restating the object. "उन पर तुम्हारी आँख दया न करे" is natural, direct, and retains the source image.'
  terminology: '"आज्ञा नहीं मानते," "वध," "लूट," and "पूरे देश" are appropriate modern-standard Hindi renderings. "वध और लूट के हवाले कर दो" preserves the intended grammatical relation more clearly than "के लिए सौंप दो."'
  issues:
  - severity: medium
    issue: Ambiguity in “वध और लूट के लिए सौंप दो”
    rationale: This phrasing may mean ‘hand them over in order to commit slaughter and plunder,’ rather than ‘hand them over to be subjected to slaughter and plunder.’ Recasting it as “वध और लूट के हवाले कर दो” resolves this Hindi ambiguity while retaining the source's terse expression.
  - severity: low
    issue: Object of the eye idiom is not repeated
    rationale: Adding “उन पर” makes the Hindi sentence more idiomatic and explicitly connects the lack of pity to the disobedient people, as in the Greek.
  revised_text: परन्तु जो आज्ञा नहीं मानते, उन पर तुम्हारी आँख दया न करे; तुम उन्हें अपने पूरे देश में वध और लूट के हवाले कर दो।
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek’s severe command and its eye/pity idiom, while making clear in idiomatic Hindi that the disobedient are handed over to slaughter and plunder, not commissioned to perform those acts. No footnotes are needed.
