  yaml_path: translation/deuterocanon/judith/002/024.yaml
  text: And he crossed the Euphrates and passed through Mesopotamia[a], and he tore down all the high cities along the torrent Abrona[b], until he came to the sea.
translation:
  language: hi
  text: और वह फ़रात नदी को पार करके मेसोपोटामिया से होकर गया, और अब्रोना नामक बरसाती नदी[b] के किनारे बसे सभी ऊँचे नगरों को ढहा दिया[a], यहाँ तक कि वह समुद्र तक पहुँच गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का शाब्दिक अर्थ ‘खोदकर आर-पार करना’ है। सैन्य प्रसंग में इसका आशय नगरों में सेंध लगाने या उन्हें ध्वस्त करने से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अब्रोना’ यूनानी पाठ में लिप्यंतरित स्थान-नाम है; इसकी सटीक भौगोलिक पहचान अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: παρῆλθεν
  choice: पार करके
  rationale: प्रत्यक्ष कर्म ‘फ़रात’ के साथ यह क्रिया नदी को पार करने का स्वाभाविक अर्थ देती है, न कि केवल उसके पास से निकलने का।
- source_word: διῆλθεν
  choice: से होकर गया
  rationale: यह संयुक्त क्रिया किसी क्षेत्र के आर-पार आगे बढ़ने को व्यक्त करती है; यह आधुनिक हिन्दी में सहज और दिशात्मक अर्थ के अनुरूप है।
- source_word: διέσκαψε
  choice: ढहा दिया
  rationale: क्रिया का शाब्दिक बिंब ‘खोदकर आर-पार करना’ है, पर नगरों के साथ सैन्य प्रसंग में दीवारें तोड़ने अथवा नगरों को ध्वस्त करने का भाव अधिक स्वाभाविक है; पादटिप्पणी शाब्दिक बिंब और अर्थगत अनिश्चितता बचाती है।
- source_word: πόλεις τὰς ὑψηλάς
  choice: ऊँचे नगरों
  rationale: ὑψηλάς का सीधा अर्थ ‘ऊँचे’ है। इससे ऊँचाई पर बसे या सुदृढ़ स्थिति वाले नगर अभिप्रेत हो सकते हैं, पर ‘गढ़वाले’ जोड़ना मूल से अधिक निश्चित होगा।
- source_word: χειμάρρου
  choice: बरसाती नदी
  rationale: χείμαρρος तेज बहने वाली मौसमी जलधारा या बरसाती नदी को दर्शाता है। ‘बरसाती नदी’ साधारण हिन्दी पाठक के लिए ‘टॉरेंट’ या ‘वाडी’ से अधिक स्पष्ट है।
- source_word: Ἀβρωνᾶ
  choice: अब्रोना
  rationale: यह यूनानी पाठ में लिप्यंतरित स्थान-नाम है; हिन्दी लिप्यंतरण इसकी अनिश्चित भौगोलिक पहचान को खुला रखता है।
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ θάλασσαν
  choice: यहाँ तक कि वह समुद्र तक पहुँच गया
  rationale: यह पदबंध यात्रा या अभियान के अंतिम भौगोलिक बिंदु को व्यक्त करता है; ‘समुद्र तक पहुँच गया’ हिन्दी में निकट और सहज है।
