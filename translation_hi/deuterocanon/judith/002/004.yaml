  yaml_path: translation/deuterocanon/judith/002/004.yaml
  text: And it happened[a], when he had finished his plan, that Nebuchadnezzar king of the Assyrians called Holofernes, the commander-in-chief of his forces, who was second after him, and said to him[c][b],
translation:
  language: hi
  text: 'और ऐसा हुआ कि जब उसने अपनी योजना पूरी कर ली, तब अश्शूरियों के राजा नबूकदनेस्सर ने अपनी सेना के प्रधान सेनापति होलोफेरनेस को बुलाया, जो पद में उसके ठीक बाद था,[a] और उससे कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके बाद दूसरा होते हुए”; अर्थात पद में वह राजा के ठीक नीचे था।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: और ऐसा हुआ
  rationale: यह यूनानी कथात्मक सूत्र को स्वाभाविक, गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὡς συνετέλεσεν
  choice: जब उसने ... पूरी कर ली
  rationale: यह पूर्ण हुई पूर्ववर्ती क्रिया और उसके बाद बुलाए जाने के क्रम को स्पष्ट करता है।
- source_word: τὴν βουλὴν αὐτοῦ
  choice: अपनी योजना
  rationale: βουλή के ‘योजना/परामर्श/संकल्प’ अर्थों में इस राजनीतिक-सैनिक प्रसंग के लिए ‘योजना’ सबसे स्वाभाविक है।
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: यह सामान्य अर्थ को सीधे व्यक्त करता है; राजकीय संदर्भ से आदेशपूर्वक बुलाने का भाव स्वतः स्पष्ट है।
- source_word: Ναβουχοδονοσὸρ βασιλεὺς Ἀσσυρίων
  choice: अश्शूरियों के राजा नबूकदनेस्सर
  rationale: यह नाम और जातीय राज-पद दोनों को स्पष्ट रखते हुए हिन्दी की स्वाभाविक पद-रचना अपनाता है।
- source_word: τὸν Ὀλοφέρνην
  choice: होलोफेरनेस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: ἀρχιστράτηγον τῆς δυνάμεως αὐτοῦ
  choice: अपनी सेना के प्रधान सेनापति
  rationale: ἀρχιστράτηγος सर्वोच्च सैन्य पद बताता है और δύναμις यहाँ सैन्य बल के अर्थ में है; ‘प्रधान सेनापति’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: δεύτερον ὄντα μετʼ αὐτόν
  choice: जो उसके बाद दूसरे स्थान पर था
  rationale: यह यूनानी की शाब्दिक रैंक-संबंधी अभिव्यक्ति को बनाए रखता है और होलोफेरनेस की राजा के ठीक नीचे की स्थिति बताता है।
- source_word: καὶ εἶπεν πρὸς αὐτόν
  choice: और उससे कहा
  rationale: आगामी प्रत्यक्ष कथन का स्वाभाविक हिन्दी परिचय; पद के अंत में द्विबिंदु इसी निरंतरता को दिखाता है।
