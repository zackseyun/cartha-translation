  yaml_path: translation/deuterocanon/judith/002/021.yaml
  text: And they advanced from Nineveh a journey of three days to the front of the plain of Baikteileth[a], and they encamped from Baikteileth near the mountain that is at the left hand of upper Cilicia.
translation:
  language: hi
  text: और वे नीनवे से तीन दिन की यात्रा करके बैकतेलैथ के मैदान के सामने पहुँचे, और बैकतेलैथ से, उस पर्वत के पास जो ऊपरी किलिकिया के बाईं ओर है, उन्होंने छावनी डाली।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध स्वेटे यूनानी प्रतिलेख की पंक्ति ‘ἐπʼ ἀρι-’ पर टूट जाती है। ‘जो ऊपरी किलिकिया के बाईं ओर है’ वाला अनुवाद इसके सामान्यतः माने जाने वाले शेष पाठ पर आधारित है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπῆλθον
  choice: पहुँचे
  rationale: यात्रा और सैन्य बढ़त के संदर्भ में यह स्वाभाविक हिन्दी है; क्रिया में निहित गमन को व्यक्त करती है, पर अनावश्यक रूप से युद्धात्मक अर्थ नहीं जोड़ती।
- source_word: ὁδὸν τριῶν ἡμερῶν
  choice: तीन दिन की यात्रा करके
  rationale: यह दूरी को यात्रा के समय से मापने वाला यूनानी मुहावरा है; हिन्दी में यह अर्थ स्पष्ट और सहज है।
- source_word: ἐπὶ πρόσωπον τοῦ πεδίου
  choice: मैदान के सामने
  rationale: मूल की स्थान-संबंधी अभिव्यक्ति ‘मैदान के मुख/सामने’ को संक्षिप्त और स्वाभाविक रूप में रखता है।
- source_word: Βαικτειλαίθ / Βαικτειλαὶθ
  choice: बैकतेलैथ
  rationale: स्थान-नाम का यूनानी उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है और दोनों छोटी वर्तनी-भिन्नताओं के लिए एक रूप रखा गया है।
- source_word: ἐπεστρατοπέδευσαν
  choice: छावनी डाली
  rationale: यह क्रिया विशेष रूप से, प्रायः सेना द्वारा, पड़ाव या शिविर स्थापित करने को बताती है; ‘छावनी डाली’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀπὸ Βαικτειλαὶθ
  choice: बैकतेलैथ से आगे
  rationale: ἀπό का मूल अर्थ ‘से’ सुरक्षित है; ‘आगे’ हिन्दी में गमन-संदर्भ को स्पष्ट करता है, यद्यपि स्थल-विवरण की कुछ कठिनता बनी रहती है।
- source_word: πλησίον τοῦ ὄρους
  choice: उस पहाड़ के पास
  rationale: स्थान-संबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: τοῦ ἐπʼ ἀριστερὰς τῆς ἄνω Κιλικίας
  choice: जो ऊपरी किलिकिया के बाईं ओर है
  rationale: मानक रूप से समझी गई पंक्ति की दिशा-सूचक अभिव्यक्ति को ‘पश्चिम’ जैसी व्याख्यात्मक दिशा में बदले बिना रखा गया है।
