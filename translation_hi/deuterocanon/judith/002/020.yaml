translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और मूल के निकट शैली अपनाई गई है। सामूहिक कर्ता ‘भीड़’ के अनुसार स्त्रीलिंग एकवचन क्रिया रखी गई है। उपमानों की पुनरावृत्ति और अंतिम कारणवाचक वाक्यांश को मूल की अलंकारिक तीव्रता बनाए रखने के लिए संरक्षित किया गया है।
