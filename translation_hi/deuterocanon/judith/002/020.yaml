  text: And a great mixed multitude went out with them[a], like locusts and like the sand of the earth, for there was no number because of their multitude.
translation:
  language: hi
  text: और एक बड़ी मिली-जुली भीड़ उनके साथ निकल पड़ी—टिड्डियों के समान और धरती की रेत के समान; क्योंकि उनकी बहुतायत के कारण उनकी कोई गिनती न थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολὺς ὁ ἐπίμικτος
  choice: एक बड़ी मिली-जुली भीड़
  rationale: विशेषण के संज्ञात्मक और सामूहिक प्रयोग को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यह सेना के साथ जुड़े विविध लोगों के बड़े समूह को दर्शाता है।
- source_word: συνεξῆλθον αὐτοῖς
  choice: भी उनके साथ निकल पड़ी
  rationale: संयुक्त क्रिया साथ जाने और बाहर निकलने, दोनों भावों को रखती है। ‘कूच किया’ अतिरिक्त सैनिक विशिष्टता जोड़ देता।
- source_word: ὡς ἀκρίς
  choice: टिड्डियों के समान
  rationale: संख्या की अत्यधिक विशालता बताने वाले मूल उपमान को ज्यों का त्यों रखता है। यूनानी में संज्ञा एकवचन रूप में है, पर सामूहिक उपमान के लिए हिन्दी में बहुवचन अधिक स्वाभाविक है।
- source_word: ὡς ἡ ἄμμος τῆς γῆς
  choice: धरती की रेत के समान
  rationale: मूल बाइबलीय बिंब और γῆς के व्यापक अर्थ को निकटता से सुरक्षित रखता है।
- source_word: οὐ γὰρ ἦν ἀριθμός
  choice: क्योंकि ... उनकी कोई गिनती न थी
  rationale: मूल के ‘कोई संख्या/गिनती न थी’ कथन को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἀπὸ πλήθους αὐτῶν
  choice: उनकी बहुतायत के कारण
  rationale: ἀπό के कारणवाचक बल और πλήθος के संज्ञात्मक रूप को सुरक्षित रखता है।
