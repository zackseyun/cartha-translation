  yaml_path: translation/deuterocanon/judith/002/025.yaml
  text: And he seized the territory of Cilicia[a], and cut down all who resisted him, and came as far as the borders of Japheth, to the south, opposite Arabia.
translation:
  language: hi
  text: और उसने किलिकिया के प्रदेश पर अधिकार कर लिया और उन सबको काट डाला जिन्होंने उसका विरोध किया। फिर वह दक्षिण की ओर, अरब के सामने, यापेत[a] की सीमाओं तक पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘यापेत’ है। इस स्थान की पहचान अनिश्चित है; कुछ व्याख्याकार इसे किसी अधिक परिचित स्थान-नाम से जोड़ते हैं, पर यहाँ मूल पाठ को बिना संशोधन के रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: κατελάβετο
  choice: अधिकार कर लिया
  rationale: यहाँ मध्यमवाच्य क्रिया किसी भूभाग को बलपूर्वक अपने नियंत्रण में लेने का भाव देती है; यह चयन स्वाभाविक हिन्दी में उसी अर्थ को व्यक्त करता है।
- source_word: τὰ ὅρια τῆς Κιλικίας
  choice: किलिकिया के प्रदेश
  rationale: ὅρια का मूल अर्थ सीमाएँ है, पर देश के नाम के साथ यहाँ यह उसकी क्षेत्रीय सीमा के भीतर के भूभाग के लिए लक्षणा से प्रयुक्त है।
- source_word: κατέκοψε
  choice: काट डाला
  rationale: सैन्य प्रसंग में यह क्रिया हिंसक संहार का सजीव भाव रखती है; ‘काट डाला’ उसकी तीव्रता को बनाए रखता है।
- source_word: πάντας τοὺς ἀντιστάντας αὐτῷ
  choice: उन सबको जिन्होंने उसका विरोध किया
  rationale: यह सक्रिय प्रतिरोध को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἦλθεν ἕως ὁρίων Ἰάφεθ
  choice: यापेत की सीमाओं तक पहुँचा
  rationale: यहाँ ὅρια सेना की बढ़त की अंतिम सीमा बताता है, इसलिए ‘सीमाओं तक’ उपयुक्त है; Ἰάφεθ को पाठ-साक्ष्य के अनुसार लिप्यंतरित किया गया है।
- source_word: τὰ πρὸς νότον
  choice: दक्षिण की ओर
  rationale: यह पद दक्षिणी दिशा अथवा स्थिति सूचित करता है; हिन्दी में ‘दक्षिण की ओर’ स्वाभाविक रहते हुए इसकी संभावित दिशात्मकता बनाए रखता है।
- source_word: κατὰ πρόσωπον τῆς Ἀραβίας
  choice: अरब के सामने
  rationale: भौगोलिक प्रयोग में यह मुहावरा ‘के सामने’ अथवा ‘के सम्मुख’ का अर्थ देता है; चयन सामान्य पाठक के लिए स्पष्ट है।
