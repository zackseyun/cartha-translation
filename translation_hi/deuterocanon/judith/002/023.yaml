  text: And he cut down Phud and Lud[a], and he plundered all the sons of Rasses and the sons of Ishmael who were opposite the wilderness[c][b], toward the south of the Chaldeans.
translation:
  language: hi
  text: और उसने फूद और लूद[a] को काट डाला, और रस्सेस के सब पुत्रों और इश्माएल के पुत्रों[b] को लूट लिया, जो वीराने के सामने और कसदियों के दक्षिण की ओर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फूत और लूद’; ये इन नामों की अधिक परिचित बाइबलीय वर्तनियाँ हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘इश्माएल के पुत्रों’ का अनुवाद ‘इश्माएली’ भी किया जा सकता है। मुख्य पाठ यूनानी की वंशगत अभिव्यक्ति को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διέκοψεν
  choice: तहस-नहस कर दिया
  rationale: क्रिया का मूल भाव काट डालने या चीर देने का है; यहाँ सैन्य प्रसंग में यह हिंसक पराजय और विनाश बताती है। स्वाभाविक हिन्दी के लिए ‘तहस-नहस कर दिया’ उस बल को बनाए रखता है, पर संहार की सीमा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὸ Φοὺδ καὶ Λούδ
  choice: फूद और लूद
  rationale: ये जाति अथवा स्थान के अनिश्चित व्यक्तिवाचक नाम हैं, इसलिए यूनानी रूपों का लिप्यंतरण किया गया है।
- source_word: ἐπρονόμευσεν
  choice: लूट लिया
  rationale: यह युद्ध में माल या सम्पत्ति लूटने की क्रिया है; ‘लूट लिया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: υἱοὺς πάντας Ῥασσεῖς
  choice: रस्सेस के सब पुत्रों
  rationale: कुछ असहज यूनानी वाक्य-विन्यास के बावजूद ‘पुत्रों’ से वंशगत-जातीय अभिव्यक्ति सुरक्षित रहती है; अनिश्चित समूह-नाम Ῥασσεῖς को ‘रस्सेस’ रूप में लिप्यंतरित किया गया है।
- source_word: υἱοὺς Ἰσμαήλ
  choice: इश्माएल के पुत्रों
  rationale: यूनानी के शाब्दिक वंशगत रूप को सुरक्षित रखा गया है; इसे अधिक सहज रूप में ‘इश्माएलियों’ भी कहा जा सकता है।
- source_word: τοὺς κατὰ πρόσωπον τῆς ἐρήμου
  choice: जो वीराने के सामने
  rationale: κατὰ πρόσωπον स्थान-संबंध में ‘सामने’, ‘सम्मुख’ अथवा ‘के आगे’ हो सकता है। ‘वीराने के सामने’ मूल की भौगोलिक अस्पष्टता बनाए रखता है।
- source_word: πρὸς νότον τῆς Χαλδαίων
  choice: कसदियों के दक्षिण की ओर
  rationale: πρὸς νότον दक्षिण की दिशा या अभिमुखता बताता है; संक्षिप्त यूनानी संबंध को हिन्दी में यथासंभव सुरक्षित रखा गया है।
- source_word: ἔρημος
  choice: वीराना
  rationale: यहाँ शब्द निर्जन भूभाग को सूचित करता है; ‘वीराना’ सामान्य पाठक के लिए सहज है और केवल रेतीले मरुस्थल का अनावश्यक अर्थ नहीं जोड़ता।
