  text: And they too decided to destroy all flesh who had not followed the word of his mouth[a][b].
translation:
  language: hi
  text: और उन्होंने भी उन सभी मनुष्यों को नष्ट करने का निश्चय किया जिन्होंने उसके मुँह से निकले वचन का अनुसरण नहीं किया था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘समस्त देह’; यह बाइबलीय मुहावरा यहाँ ‘सब लोग’ या ‘समस्त मानवजाति’ के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके मुँह से निकले वचन’ का अनुवाद ‘उसकी आज्ञा’ या ‘उसके द्वारा दिया गया आदेश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: और उन्होंने भी
  rationale: καί का संयोजक अर्थ और αὐτοί का बलात्मक/समावेशी भाव—कि वे भी इस निर्णय में शामिल हुए—दोनों स्वाभाविक हिन्दी में सुरक्षित रहते हैं।
- source_word: ἔκριναν
  choice: निश्चय किया
  rationale: यहाँ क्रिया विचार करके किसी निर्णय पर पहुँचने को व्यक्त करती है। ‘निश्चय किया’ न्यायिक निर्णय या औपचारिक राजाज्ञा का अतिरिक्त अर्थ जोड़े बिना आशय स्पष्ट करती है।
- source_word: ὀλεθρεῦσαι
  choice: नाश कर दें
  rationale: क्रिया पूर्ण विनाश या बरबादी के इरादे को व्यक्त करती है। ‘नाश करना’ प्रबल है, पर ‘सर्वथा मिटा देना’ जैसी अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: πᾶσαν σάρκα
  choice: सभी देहधारियों
  rationale: शाब्दिक रूप से ‘समस्त देह/सारा मांस’ एक बाइबलीय मुहावरा है, जो यहाँ लक्षित जीवित मनुष्यों के समूचे वर्ग को दर्शाता है। ‘देहधारी’ देह की मूल छवि को रखते हुए हिन्दी में अर्थबोध कराता है।
- source_word: οἳ οὐκ ἠκολούθησαν
  choice: जो ... के अनुसार नहीं चले थे
  rationale: ἀκολουθέω की मूल ‘पीछे चलने/अनुसरण करने’ की छवि रखी गई है; प्रसंग में इससे आज्ञा न मानने का भाव भी स्वतः स्पष्ट होता है। पूर्वकालिकता के लिए ‘चले थे’ प्रयुक्त है।
- source_word: τῷ λόγῳ
  choice: वचन
  rationale: λόγος यहाँ कही हुई बात, आदेश या आज्ञा हो सकता है। ‘वचन’ बोले गए कथन को व्यक्त करता है और उसे केवल औपचारिक ‘आदेश’ मानकर अस्पष्टता को समाप्त नहीं करता।
- source_word: τοῦ στόματος αὐτοῦ
  choice: उसके मुँह से निकले
  rationale: यूनानी का ‘उसके मुँह का’ सामी-प्रभावित प्रयोग बोले गए वचन को दर्शाता है। यह हिन्दी रूप मुँह की सजीव छवि बनाए रखते हुए स्वाभाविक है।
theological_decisions:
- issue: गैर-पौलुसी, बाइबलीय मुहावरे में σάρξ का अनुवाद
  choice: सभी देहधारियों
  alternative: सब लोगों / समस्त मानवजाति
  rationale: यहाँ σάρξ ‘पापी स्वभाव’ का धर्मवैचारिक अर्थ नहीं रखता, बल्कि जीवित देहधारियों के लिए सामूहिक मुहावरा है। चुना गया रूप देह की स्रोत-छवि बचाता है और किसी पौलुसी अर्थ को आयात नहीं करता।
- issue: λόγος को कथन या आदेश के रूप में समझना
  choice: वचन
  alternative: आज्ञा / आदेश
  rationale: प्रसंग में राजकीय आदेश का भाव संभव है, पर λόγος स्वयं अधिक व्यापक है। ‘वचन’ कथन और निर्देश—दोनों संभावनाएँ खुली रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘देहधारी’ स्रोत के बाइबलीय मुहावरे को बचाता है, जबकि ‘मुँह से निकला वचन’ शाब्दिक छवि और स्वाभाविक हिन्दी के बीच संतुलन रखता है।
