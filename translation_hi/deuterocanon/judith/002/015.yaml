  yaml_path: translation/deuterocanon/judith/002/015.yaml
  text: 'And he counted chosen men for battle formation[a], just as his lord had commanded him: one hundred twenty thousand, and twelve thousand mounted archers,'
translation:
  language: hi
  text: 'और उसने युद्ध-व्यूह के लिए चुने हुए पुरुषों की गिनती की, ठीक वैसे ही जैसे उसके स्वामी ने उसे आज्ञा दी थी: एक लाख बीस हज़ार[a] पुरुष और बारह हज़ार घुड़सवार धनुर्धर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से: “बारह मिरियड”; एक मिरियड दस हज़ार होता है।'
    reason: मूल यूनानी संख्या-प्रयोग को सुरक्षित रखते हुए मुख्य पाठ में उसका आधुनिक कुल योग स्पष्ट किया गया है।
lexical_decisions:
- source_word: ἠρίθμησεν
  choice: गिनती की
  rationale: क्रिया का मूल अर्थ गिनना या संख्या निर्धारित करना है। सैन्य प्रसंग में भी यह अनावश्यक रूप से औपचारिक भर्ती या जमावड़े का अर्थ नहीं जोड़ता।
- source_word: ἐκλεκτοὺς ἄνδρας
  choice: चुने हुए पुरुषों
  rationale: ἐκλεκτούς चयनित या उत्तम लोगों को और ἄνδρας स्पष्ट रूप से पुरुषों को दर्शाता है।
- source_word: εἰς παράταξιν
  choice: युद्ध-व्यूह के लिए
  rationale: παράταξις युद्ध के लिए सैनिकों की क्रमबद्ध तैनाती या व्यूह को दर्शाता है; ‘युद्ध-व्यूह’ संक्षिप्त और स्वाभाविक सैन्य पद है।
- source_word: καθότι
  choice: ठीक वैसे ही जैसे
  rationale: यह उसके कार्य को पहले दी गई आज्ञा के अनुरूप बताता है और तुलना की शक्ति को बनाए रखता है।
- source_word: ὁ κύριος αὐτοῦ
  choice: उसके स्वामी
  rationale: यहाँ κύριος परमेश्वर नहीं, होलोफेरनेस के मानवीय अधिपति को सूचित करता है; ‘स्वामी’ पदानुक्रम और अधिकार दोनों व्यक्त करता है।
- source_word: εἰς μυριάδας δέκα δύο
  choice: एक लाख बीस हज़ार
  rationale: बारह ‘मिरियड’ का कुल योग 1,20,000 है। आधुनिक हिन्दी में कुल संख्या स्पष्ट रूप से देना सहज और सटीक है।
- source_word: ἱππεῖς τοξότας
  choice: घुड़सवार धनुर्धर
  rationale: यह पद घुड़सवारी और धनुर्विद्या दोनों को जोड़ता है; हिन्दी में ‘घुड़सवार धनुर्धर’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: μυρίους δισχιλίους
  choice: बारह हज़ार
  rationale: यह संख्यात्मक अभिव्यक्ति दस हज़ार और दो हज़ार, अर्थात् कुल 12,000, को दर्शाती है।
theological_decisions:
- issue: गैर-ईश्वरीय सैन्य पदानुक्रम में κύριος का अनुवाद
  choice: उसके स्वामी
  alternative: उसके प्रभु
  rationale: इस प्रसंग में संदर्भ एक मानवीय वरिष्ठ अधिकारी का है। ‘स्वामी’ अधिकार-संबंध को बनाए रखता है और ईश्वरीय ‘प्रभु’ का अनुचित संकेत नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट सैन्य भाषा अपनाई गई है। ‘युद्ध-व्यूह’ और ‘घुड़सवार धनुर्धर’ स्रोत के विशिष्ट सैन्य अर्थ को बनाए रखते हैं; संख्याएँ पाठक-सुलभ शब्दों में दी गई हैं।
