  text: of the strongholds of upper Cilicia. And he took all his forces[a], the foot soldiers and the horsemen and his chariots, and went away into the hill country.
translation:
  language: hi
  text: ऊपरी किलिकिया के गढ़ों का।[a] फिर उसने अपनी सारी सेना—पैदल सैनिकों, घुड़सवारों और अपने रथों—को साथ लिया और पहाड़ी प्रदेश में चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक वाक्यांश, “ऊपरी किलिकिया के गढ़ों का,” उपलब्ध यूनानी पाठ में एक अधूरा वाक्यांश है और प्रतीत होता है कि यह पिछले पद की बात को पूरा करता है।
    reason: textual_variant
lexical_decisions:
- source_word: στερᾶς
  choice: गढ़ों
  rationale: संदर्भ में यह रूप किलेबंद स्थानों या सुदृढ़ सैन्य ठिकानों को दर्शाता है। ‘गढ़ों’ से सैन्य अर्थ संक्षिप्त और स्वाभाविक हिन्दी में बना रहता है।
- source_word: ἄνω Κιλικίας
  choice: ऊपरी किलिकिया
  rationale: ἄνω भौगोलिक अर्थ में ‘ऊपरी’ है; यह प्रादेशिक वर्णन को सीधे व्यक्त करता है।
- source_word: δύναμιν
  choice: सेना
  rationale: इस सैन्य संदर्भ में δύναμις अमूर्त सामर्थ्य नहीं, संगठित सैन्य बल है। आगे पैदल सैनिकों, घुड़सवारों और रथों का उल्लेख इसकी व्याप्ति स्पष्ट करता है।
- source_word: πεζοὺς
  choice: पैदल सैनिकों
  rationale: यह पैदल लड़ने वाले सैनिकों को दर्शाता है; आधुनिक हिन्दी में यह ‘पैदल सेना’ की तुलना में यहाँ सूची के सदस्य के रूप में अधिक स्पष्ट है।
- source_word: ἱππεῖς
  choice: घुड़सवारों
  rationale: यह घोड़ों पर सवार होकर लड़ने वाले सैनिकों का स्वाभाविक और ठोस हिन्दी पद है।
- source_word: ἅρματα
  choice: रथों
  rationale: सैन्य संदर्भ में इसका सामान्य अर्थ रथ है; ‘युद्ध-रथ’ जोड़ना अनावश्यक व्याख्या होता।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: यह पिछले स्थान से प्रस्थान और आगे की गति, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὀρεινήν
  choice: पहाड़ी प्रदेश
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण पहाड़ी या पर्वतीय भूभाग को दर्शाता है; ‘पहाड़ी प्रदेश’ स्पष्ट और स्वाभाविक है।
