  rationale: नींव रखने के क्रियार्थ को स्वाभाविक हिन्दी में व्यक्त करता है और माप को नींव की गहराई के रूप में समझता है; ‘हाथ’ प्राचीन ‘क्यूबिट’ का प्रचलित हिन्दी बाइबलीय समतुल्य है।
- source_word: πύλας διεγειρμένας εἰς ὕψος πηχῶν ἑβδομήκοντα
  choice: फाटकों को सत्तर हाथ की ऊँचाई तक उठाया
  rationale: διεγειρμένας के ‘ऊपर उठाए हुए’ निर्माण-बिंब को बनाए रखते हुए ऊँचाई का माप स्पष्ट करता है।
- source_word: τὸ πλάτος αὐτῆς πήχεις τεσσεράκοντα
  choice: उनकी चौड़ाई चालीस हाथ रखी
  rationale: माप-वर्णन को सहज हिन्दी में प्रस्तुत करता है। हिन्दी में ‘फाटकों’ के साथ सर्वनाम और क्रिया का बहुवचन स्वाभाविक है, यद्यपि यूनानी में सर्वनाम एकवचन है।
- source_word: εἰς ἐξόδους δυνάμεως δυνατῶν αὐτοῦ
  choice: ताकि उसके वीरों की सेना बाहर निकल सके
  rationale: ἐξόδους का मूल ‘बाहर निकलना’ और δυνάμεως तथा δυνατῶν के अलग-अलग अर्थ—‘सेना’ और ‘वीर’—दोनों बनाए रखता है। प्रयोजनवाचक हिन्दी मूल के संक्षिप्त सैन्य पदबंध को पठनीय बनाती है।
- source_word: διατάξεις τῶν πεζῶν αὐτοῦ
  choice: उसके पैदल सैनिक व्यूहों में खड़े किए जा सकें
  rationale: διατάξεις को सैन्य संदर्भ में व्यवस्थित दलों या व्यूहों के रूप में व्यक्त करता है; ‘पैदल सैनिक’ πεζῶν का स्पष्ट और सामान्य हिन्दी रूप है।
