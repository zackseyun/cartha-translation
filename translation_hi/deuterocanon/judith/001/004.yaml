  text: उसने उसकी नींव साठ हाथ की गहराई तक डाली; और उसके फाटकों को सत्तर हाथ की ऊँचाई तक उठाया, और उनकी चौड़ाई चालीस हाथ रखी, उसके वीरों की सेना के निकलने और उसके पैदल सैनिकों के व्यूहों के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
