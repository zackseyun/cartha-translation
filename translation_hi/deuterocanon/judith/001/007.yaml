  yaml_path: translation/deuterocanon/judith/001/007.yaml
  text: And Nebuchadnezzar king of the Assyrians sent to all who lived in Persia and to all who lived toward the west—to those living in Cilicia and Damascus[a], Lebanon and Anti-Lebanon, and to all who lived along the seacoast—
translation:
  language: hi
  text: और अश्शूरियों के राजा नबूकदनेस्सर ने फ़ारस में रहने वाले सभी लोगों और पश्चिम की ओर बसे सभी लोगों[a]—किलिकिया और दमिश्क में, लेबनान और एंटी-लेबनान में रहने वालों, तथा समुद्र-तट के साथ-साथ रहने वाले सभी लोगों—को संदेश भेजा—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पश्चिमी क्षेत्रों में रहने वाले सभी लोग।’ यूनानी में शाब्दिक रूप से, ‘पश्चिम की ओर रहने वाले सभी लोग।’
    reason: πρὸς δυσμαῖς की दिशात्मक भाषा को मुख्य पाठ में बनाए रखते हुए उसके सम्भावित क्षेत्रीय अर्थ को दर्शाना।
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: संदेश भेजा
  rationale: यूनानी क्रिया का मूल अर्थ ‘भेजा’ है और भेजी गई वस्तु को व्यक्त नहीं किया गया है। हिन्दी में भौगोलिक प्राप्तकर्ताओं के साथ ‘के पास भेजा’ अकेला अधूरा लगता, इसलिए प्रसंगानुकूल ‘संदेश’ स्पष्ट किया गया है, बिना संदेश की विषयवस्तु जोड़े।
- source_word: ἐπὶ πάντας τοὺς κατοικοῦντας
  choice: रहने वाले सभी लोगों … के पास
  rationale: ἀποστέλλω के साथ ἐπί यहाँ विरोध में चढ़ाई करने के बजाय संदेश के प्राप्तकर्ताओं की दिशा बताता है। यह हिन्दी रूप उसी प्राप्तकर्ता-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν Περσίδα
  choice: फ़ारस
  rationale: यह फ़ारस के भूभाग का प्रचलित आधुनिक हिन्दी नाम है।
- source_word: πρὸς δυσμαῖς
  choice: पश्चिम की ओर बसे
  rationale: यह रूप यूनानी पदबंध की दिशात्मकता बनाए रखता है और इसे किसी निश्चित नाम वाले ‘पश्चिमी प्रदेश’ में नहीं बदलता।
- source_word: κατοικοῦντας τὴν Κιλικίαν
  choice: किलिकिया … में रहने वालों
  rationale: स्थान के साथ κατοικέω का स्वाभाविक हिन्दी रूप ‘में रहने वाले’ है और यह यूनानी की पुनरावृत्त संरचना को पर्याप्त रूप से बनाए रखता है।
- source_word: Δαμασκόν
  choice: दमिश्क
  rationale: नगर के नाम का प्रचलित हिन्दी रूप।
- source_word: τὸν Λίβανον καὶ Ἀντιλίβανον
  choice: लबानोन और अन्ती-लबानोन
  rationale: दो अलग पर्वतीय क्षेत्रों के नामों को लिप्यंतरित किया गया है; Ἀντιλίβανον को अर्थानुवाद करके भ्रामक ‘लबानोन-विरोधी’ नहीं बनाया गया।
- source_word: κατὰ πρόσωπον παραλίας
  choice: समुद्र-तट के साथ-साथ
  rationale: यूनानी मुहावरा समुद्र की ओर मुख किए अथवा तटवर्ती विस्तार में बसे क्षेत्र को दर्शाता है। ‘साथ-साथ’ आधुनिक हिन्दी में तट के לאורך बसे लोगों का अर्थ सहजता से देता है।
