  text: उसकी चौड़ाई पचास हाथ थी। उसने उसके फाटकों पर सौ हाथ ऊँचे बुर्ज खड़े किए, और उसकी नींव की चौड़ाई साठ हाथ रखी।[a]
  philosophy: optimal-equivalence
