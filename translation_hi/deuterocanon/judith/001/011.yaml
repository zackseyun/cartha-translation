base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/011.yaml
  text: And all who inhabited the whole land treated the word of Nebuchodonosor king of the Assyrians with contempt, and they did not join him for the war, because they did not fear him, but he was before them like an ordinary man, and they sent his messengers back empty, in dishonor, from before him.
translation:
  language: hi
  text: और पूरे देश के सभी निवासियों ने अश्शूरियों के राजा नबूकदनेस्सर के संदेश को तुच्छ समझा[a] और युद्ध के लिए उसका साथ नहीं दिया, क्योंकि वे उससे नहीं डरते थे। उन्हें वह अपने ही समान एक मनुष्य लगता था[b]। उन्होंने उसके दूतों को खाली हाथ और अपमानित अवस्था में वापस भेज दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अश्शूरियों के राजा नबूकदनेस्सर की बात अथवा आज्ञा का तिरस्कार किया।” यूनानी शब्द का अर्थ “वचन,” “संदेश” या “आज्ञा” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह उनके सामने एक समान मनुष्य के जैसा था।” अर्थात वे उसे अपने ही स्तर का केवल एक मनुष्य समझते थे, जिससे डरने की आवश्यकता नहीं थी।
    reason: lexical_alternative
  - marker: c
    text: या, “उन्होंने उसके दूतों को निरादर के साथ निष्फल वापस भेज दिया।” यूनानी पदबंध में ‘उसके सामने/उपस्थिति से’ का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαύλισαν
  choice: तुच्छ जाना
  rationale: यह क्रिया किसी बात को कम महत्त्व का समझने और उसका तिरस्कार करने का भाव व्यक्त करती है; ‘तुच्छ जाना’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: οἱ κατοικοῦντες πᾶσαν τὴν γῆν
  choice: सारे देश के सभी निवासी
  rationale: πάντες और πᾶσαν, दोनों के व्यापक बल को बनाए रखते हुए यह हिन्दी में सहज है।
- source_word: τὸ ῥῆμα
  choice: संदेश
  rationale: सन्दर्भ में यह राजा द्वारा दूतों के माध्यम से पहुँचाई गई बात या माँग है। ‘संदेश’ ῥῆμα की अपेक्षित व्यापकता रखता है; ‘आज्ञा’ सम्भव है, पर अधिक निश्चित अर्थ आरोपित करती है।
- source_word: οὐ συνῆλθον αὐτῷ εἰς τὸν πόλεμον
  choice: युद्ध के लिए उसका साथ नहीं दिया
  rationale: वाक्यांश उसके साथ युद्ध के उद्देश्य से एकत्र होने या सम्मिलित होने को सूचित करता है; चुना हुआ रूप स्वाभाविक हिन्दी में यही अर्थ देता है।
- source_word: οὐκ ἐφοβήθησαν αὐτόν
  choice: वे उससे नहीं डरते थे
  rationale: यूनानी कथन का सीधा और स्पष्ट अनुवाद।
- source_word: ἦν ἐναντίον αὐτῶν ὡς ἀνὴρ ἴσος
  choice: उनकी दृष्टि में वह उन्हीं के समान एक साधारण मनुष्य था
  rationale: ἐναντίον αὐτῶν को दृष्टिकोण के अर्थ में और ἀνὴρ ἴσος को अपने ही स्तर का मनुष्य समझे जाने के अर्थ में व्यक्त करता है, बिना राजा की वास्तविक स्थिति पर कथाकार का निर्णय बनाए।
- source_word: ἀνέστρεψαν τοὺς ἀγγέλους αὐτοῦ κενούς
  choice: उन्होंने उसके दूतों को ... खाली हाथ उसके पास लौटा दिया
  rationale: ἀνέστρεψαν यहाँ वापस भेजने और κενούς निष्फल अथवा खाली हाथ लौटने का भाव देता है।
- source_word: ἐν ἀτιμίᾳ
  choice: अपमानित करके
  rationale: दूतों को अनादर और लज्जा के साथ लौटाने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: πρὸ προσώπου αὐτοῦ
  choice: उसके पास
  rationale: शाब्दिक ‘उसके सामने/मुख के आगे’ यहाँ वापसी की दिशा या उपस्थिति को सूचित करता है; ‘उसके पास लौटा दिया’ हिन्दी में स्पष्ट है।
