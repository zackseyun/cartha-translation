lexical_decisions:
- source_word: ἕως τοῦ ἐλθεῖν
  choice: तक
  rationale: यहाँ ἕως τοῦ + infinitive मुख्यतः स्थानिक विस्तार की सीमा बताता है। हिन्दी में ‘तक’ इस अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है; यूनानी में इसकी पुनरावृत्ति का संकेत पादटिप्पणी में दिया गया है।
- source_word: ἐπάνω
  choice: तक
  rationale: स्थान-नामों के साथ यह किसी स्थान की ओर पहुँचने अथवा वहाँ तक विस्तार का भाव देता है; हिन्दी ‘तक’ प्रसंगानुकूल है।
- source_word: Τάνεως
  choice: तानिस
  rationale: प्राचीन मिस्री नगर के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: Μέμφεως
  choice: मेम्फिस
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: κατοικοῦντας
  choice: रहनेवाले
  rationale: किसी स्थान में निवास करनेवालों को दर्शाता है; ‘रहनेवाले’ आधुनिक साधारण हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὴν Αἴγυπτον
  choice: मिस्र में
  rationale: यूनानी रचना में κατοικοῦντας का कर्म देश है, पर हिन्दी में निवास का भाव स्वाभाविक रूप से ‘मिस्र में रहनेवाले’ कहा जाता है।
- source_word: ἐπὶ τὰ ὅρια
  choice: सीमाओं तक
  rationale: ὅρια प्रादेशिक हदों या सीमाओं को दर्शाता है; बहुवचन ‘सीमाओं’ मूल रूप के अनुरूप है।
- source_word: Αἰθιοπίας
  choice: इथियोपिया
  rationale: यूनानी Αἰθιοπία का मानक आधुनिक हिन्दी रूप; इसे ‘कूश’ बनाकर स्रोत के नाम को नहीं बदला गया।
