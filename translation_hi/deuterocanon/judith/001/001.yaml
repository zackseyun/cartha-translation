    text: यूनानी पाठ इस पद के अंत में ‘और’ रखकर वाक्य को सीधे अगले पद में जारी रखता है; हिन्दी में इस अधूरे वाक्य की निरंतरता को अधिक स्वाभाविक रूप से दिखाने के लिए अल्पविराम रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἜΤΟΥΣ δωδεκάτου τῆς βασιλείας
  choice: शासन के बारहवें वर्ष में
  rationale: यह यूनानी काल-सूचक वाक्यांश राजकीय शासन की अवधि बताता है। आधुनिक हिन्दी में ‘शासन के बारहवें वर्ष में’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: Ναβουχοδονοσόρ
  choice: नबूकदनेस्सर
  rationale: यह नाम का प्रचलित हिन्दी बाइबलीय रूप है और यूनानी नाम से पहचाने जाने वाले व्यक्ति की पहचान बनाए रखता है।
- source_word: ὃς ἐβασίλευσεν Ἀσσυρίων
  choice: वह ... अश्शूरियों पर राज्य करता था
  rationale: सम्बन्धवाचक उपवाक्य और जनसमूह पर शासन—दोनों को स्पष्ट रखते हुए यूनानी क्रिया ἐβασίλευσεν का राजकीय अर्थ सुरक्षित किया गया है।
- source_word: ἐν Νινευῇ τῇ πόλει τῇ μεγάλῃ
  choice: नीनवे नामक महान नगर में
  rationale: स्थान और उसके वर्णन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘महान नगर’ यूनानी विशेषणात्मक पदबंध के निकट है।
- source_word: ἐν ταῖς ἡμέραις Ἀρφαξάδ
  choice: अरफक्सद के दिनों में
  rationale: यूनानी का पारंपरिक ऐतिहासिक काल-सूचक मुहावरा साहित्यिक किंतु सुबोध हिन्दी में सुरक्षित है।
- source_word: ὃς ἐβασίλευσεν Μήδων
  choice: जो ... मादियों पर राज्य करता था
  rationale: Μήδων जनसमूह को सूचित करता है, इसलिए किसी भूभाग के बजाय ‘मादियों’ का प्रयोग किया गया है।
- source_word: ἐν Ἐκβατάνοις
  choice: एकबतना में
  rationale: स्थानवाचक अर्थ को सीधे रखा गया है और नाम का सुगम हिन्दी लिप्यंतरण किया गया है।
- source_word: καὶ
  choice: ','
  rationale: यूनानी में पद के अंत का καὶ अगले पद में वाक्य जारी रखता है। हिन्दी में अंतिम अल्पविराम अधूरे वाक्य और निरंतरता को अधिक स्वाभाविक ढंग से दिखाता है।
