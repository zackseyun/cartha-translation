  text: नबूकदनेस्सर के शासन के बारहवें वर्ष में—वह नीनवे नामक महान नगर में अश्शूरियों पर राज्य करता था—अरफक्षद के दिनों में, जो एकबतना में मादियों पर राज्य करता था,[a]
  philosophy: optimal-equivalence
  footnotes:
