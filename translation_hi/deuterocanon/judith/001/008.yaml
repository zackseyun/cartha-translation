lexical_decisions:
- source_word: τοὺς ἐν τοῖς ἔθνεσι
  choice: अन्यजातियों के बीच रहनेवालों को
  rationale: τοὺς के व्यक्तिवाचक और कर्मकारक बल को बनाए रखता है। ἔθνεσι यहाँ लोगों या अन्य जातियों को सूचित कर सकता है; ‘अन्यजातियों’ से यह भौगोलिक सूची में स्वाभाविक रहता है, बिना इसे किसी विशिष्ट धार्मिक श्रेणी तक सीमित किए।
- source_word: Καρμήλου
  choice: करमेल
  rationale: मूल में ‘पर्वत’ स्पष्ट रूप से नहीं है, इसलिए केवल प्रचलित बाइबलीय स्थान-नाम रखा गया है।
- source_word: Γαλαὰδ
  choice: गिलाद
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और यूनानी स्थान-नाम के अनुरूप रूप।
- source_word: τὴν ἄνω Γαλιλαίαν
  choice: ऊपरी गलील
  rationale: ἄνω का भौगोलिक अर्थ ‘ऊपरी’ है; यह आधुनिक हिन्दी में क्षेत्र का स्पष्ट और स्वाभाविक नाम है।
- source_word: τὸ μέγα πεδίον
  choice: बड़ा मैदान
  rationale: πεδίον समतल विस्तृत भूभाग अर्थात मैदान को और μέγα उसके बड़े विस्तार को व्यक्त करता है।
- source_word: Ἐσδρήμ
  choice: एसद्रेम
  rationale: यूनानी पाठ के नाम को हिन्दी में निकट ध्वन्यात्मक रूप से रखा गया है; इसकी पहचान एसद्राएलोन/यिज्रेल के मैदान से होने की सम्भावना पाद-टिप्पणी में दी गई है।
