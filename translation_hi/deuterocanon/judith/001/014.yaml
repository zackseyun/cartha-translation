  text: And he gained control of his cities[a], and he came as far as Ecbatana, and he seized its towers and plundered its streets[b], and he turned its splendor into disgrace.
translation:
  language: hi
  text: और उसने उसके नगरों पर अधिकार कर लिया। फिर वह एकबतना तक पहुँचा; उसने उसके बुर्जों को अपने अधिकार में कर लिया, उसकी चौड़ी सड़कों[a] को लूटा और उसकी शोभा[b] को अपमान में बदल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ नगर की चौड़ी सड़कें या सार्वजनिक चौक भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी κόσμος का अर्थ ‘संसार’ नहीं, बल्कि नगर की सजावट, शोभा या वैभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν τῶν πόλεων αὐτοῦ
  choice: उसके नगरों पर अधिकार कर लिया
  rationale: κυριεύω सैन्य विजय के प्रसंग में प्रभुत्व या नियंत्रण प्राप्त करने का भाव देता है। ‘अधिकार कर लिया’ तत्काल विजय को स्वाभाविक हिन्दी में व्यक्त करता है, बिना दीर्घकालीन शासन का अनावश्यक संकेत दिए।
- source_word: ἀφίκετο ἕως Ἐκβατάνων
  choice: एकबतना तक पहुँचा
  rationale: ἀφικνέομαι और ἕως मिलकर अभियान की पहुँच की सीमा बताते हैं। ‘तक पहुँचा’ इस भाव को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: ἐκράτησεν τῶν πύργων
  choice: उसके बुर्जों को अपने अधिकार में कर लिया
  rationale: κρατέω के साथ संबंधकारक का अर्थ बलपूर्वक अधिकार प्राप्त करना हो सकता है। πύργοι के लिए ‘बुर्ज’ नगर की रक्षात्मक मीनारों के संदर्भ में उपयुक्त है।
- source_word: ἐπρονόμευσε τὰς πλατείας αὐτῆς
  choice: उसकी चौड़ी सड़कों को लूटा
  rationale: προνομεύω लूट लेने का अर्थ देता है, जबकि πλατεῖαι सामान्य गलियों के बजाय चौड़ी सड़कों या सार्वजनिक चौकों का संकेत दे सकता है। मुख्य पाठ में ‘चौड़ी सड़कें’ चुना गया और वैकल्पिक अर्थ पादटिप्पणी में रखा गया।
- source_word: τὸν κόσμον αὐτῆς
  choice: उसकी शोभा
  rationale: κόσμος यहाँ ‘संसार’ नहीं, बल्कि सजावट, सुव्यवस्थित सुंदरता या वैभव है। ‘शोभा’ नगर की दृश्य सुंदरता और अलंकरण दोनों को सहज हिन्दी में समेटती है।
- source_word: ἔθηκεν εἰς ὄνειδος
  choice: अपमान में बदल दिया
  rationale: यह पदबंध किसी वस्तु को निंदा, लज्जा या अपमान की दशा में पहुँचा देने का भाव रखता है। ‘अपमान में बदल दिया’ शोभा और अपमान के बीच मूल अलंकारिक उलटाव को बनाए रखता है।
