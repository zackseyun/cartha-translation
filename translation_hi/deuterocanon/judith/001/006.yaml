- source_word: οἱ κατοικοῦντες τὸν Εὐφράτην καὶ τὸν Τίγριν καὶ τὸν Ὑδάσπην
  choice: फरात, दजला और हिदास्पेस नदियों के किनारे रहनेवाले
  rationale: नदियों के नामों के साथ यूनानी प्रयोग को हिन्दी में स्वाभाविक रूप से ‘नदियों के किनारे’ कहा गया है। फरात और दजला के प्रचलित हिन्दी नाम रखे गए हैं, जबकि Ὑδάσπην का लिप्यंतरण किया गया है।
- source_word: πεδίῳ Ἀριὼχ ὁ βασιλεὺς Ἐλυμαίων
  choice: मैदान में एलूमाइयों का राजा अरियोक भी
  rationale: खंड में क्रिया अध्याहृत है और वह पहले आए συνήντησαν से समझी जाती है। इसलिए ‘भी’ जोड़कर पहले वाक्य की क्रिया से इसका संबंध स्पष्ट किया गया है, बिना किसी अतिरिक्त स्थान-नाम की कल्पना किए।
- source_word: Ἐλυμαίων
  choice: एलूमाइयों
  rationale: यह यूनानी जातिनाम Elymaioi को दर्शाता है; इसे व्यापक और संभावित रूप से भिन्न पहचान ‘एलामी’ में नहीं बदला गया।
- source_word: συνῆλθον
  choice: इकट्ठे हुए
  rationale: सामूहिक रूप से एकत्र होने का सामान्य और स्वाभाविक हिन्दी रूप है, जो सैनिक संदर्भ में भी उपयुक्त है।
- source_word: εἰς παράταξιν
  choice: युद्ध-पंक्ति में
  rationale: παράταξις सेना की सजी हुई युद्ध-रचना या पंक्ति का तकनीकी शब्द है। ‘युद्ध-पंक्ति’ उसका सैनिक भाव बनाए रखता है।
- source_word: υἱῶν Χελεούλ
