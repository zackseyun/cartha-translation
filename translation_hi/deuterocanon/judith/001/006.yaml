  yaml_path: translation/deuterocanon/judith/001/006.yaml
  text: And all who lived in the hill country joined him[a], and all who lived along the Euphrates and the Tigris and the Hydaspes, and in the plain of Ariok king of the Elymaeans[c][b]. And many nations assembled for battle with the sons of Cheleoul.
translation:
  language: hi
  text: और पहाड़ी प्रदेश में रहनेवाले सभी लोग उससे आ मिले[a]। फरात, दजला और हिदास्पेस नदियों के किनारे रहनेवाले सभी लोग, और मैदान में एलूमाइयों का राजा अरियोक[b] भी, उससे आ मिले। बहुत-से राष्ट्र खेलेऊल के पुत्रों की युद्ध-पंक्ति के लिए[c] इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का शाब्दिक अर्थ ‘उससे मिले’ या ‘उससे मिलने आए’ भी हो सकता है; इस सैनिक संदर्भ में उससे जा मिलने का भाव संभव है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी नाम Ἀριώχ का लिप्यंतरण ‘अर्योख’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘युद्ध-पंक्ति’ सेना की युद्ध के लिए सजी हुई पंक्ति या रचना को दर्शानेवाले यूनानी सैनिक शब्द का अनुवाद है। इस वाक्यांश का अर्थ यह भी हो सकता है कि राष्ट्र खेलेऊल के पुत्रों के साथ युद्ध के लिए इकट्ठे हुए।
    reason: textual_ambiguity
