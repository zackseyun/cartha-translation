lexical_decisions:
- source_word: παρετάξατο
  choice: युद्ध के लिए पंक्तिबद्ध किया
  rationale: सैन्य संदर्भ में मध्यवाच्य क्रिया युद्ध-व्यूह में सैनिकों को तैनात करने का भाव देती है; यह चयन उस अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: अपनी सेना को
  rationale: यहाँ δύναμις अमूर्त सामर्थ्य नहीं, बल्कि सैनिक बल को सूचित करता है। हिन्दी में ‘अपनी सेना’ प्रसंगानुकूल और स्पष्ट है।
- source_word: ἐκραταιώθη
  choice: प्रबल हुआ
  rationale: मूल क्रिया का शाब्दिक भाव ‘बलवान हुआ’ है, जबकि युद्ध-वृत्तांत में यह बढ़त या विजय की ओर संकेत करता है। ‘प्रबल हुआ’ मूल रूप और परिणाम के बीच की अर्थगत व्यापकता बनाए रखता है।
- source_word: ἀνέστρεψεν
  choice: खदेड़ दिया
  rationale: युद्ध के संदर्भ में इसका अर्थ शत्रु को उलटकर पीछे हटाना या भगा देना है। ‘खदेड़ दिया’ निर्णायक सैन्य पराजय को सहज हिन्दी में व्यक्त करता है।
- source_word: πᾶσαν τὴν δύναμιν Ἀρφαξὰδ
  choice: अरफकसद की सारी सेना
  rationale: δύναμις यहाँ संगठित सैन्य बल है; ‘सारी सेना’ सामान्य पाठक के लिए स्वाभाविक है और पूर्णता का भाव सुरक्षित रखता है।
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: उसकी पूरी घुड़सवार सेना
  rationale: ἵππος शाब्दिक रूप से ‘घोड़ा’ है, पर सामूहिक सैन्य प्रयोग में घुड़सवार दल को दर्शाता है। ‘घुड़सवार सेना’ इसका स्पष्ट आधुनिक हिन्दी समतुल्य है।
- source_word: πάντα τὰ ἅρματα αὐτοῦ
  choice: उसके सभी रथों
  rationale: ἅρματα युद्ध-रथों को सीधे सूचित करता है; ‘रथ’ संक्षिप्त, परिचित और सटीक है।
