  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। सैन्य शब्दावली स्पष्ट है, और ἐκραταιώθη के अर्थ को अत्यधिक निश्चित ‘जीत गया’ बनाने के बजाय ‘प्रबल हुआ’ रखा गया है। पद के अंत में यूनानी पाठ के अनुरूप वाक्य आगे जारी रहने का संकेत देने हेतु अल्पविराम रखा गया है।
