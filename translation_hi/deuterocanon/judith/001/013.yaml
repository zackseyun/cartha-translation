  text: और सत्रहवें वर्ष में उसने अपनी सेना को राजा अरफक्षद के विरुद्ध युद्ध के लिए पंक्तिबद्ध किया। वह अपने युद्ध में प्रबल हुआ और उसने अरफक्षद की सारी सेना, उसकी पूरी घुड़सवार सेना और उसके सभी रथों को परास्त कर पीछे हटा दिया,
