  text: और वह स्वयं अपनी सेना समेत उनके साथ एक सौ बीस दिन तक वापस लौटा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: लौटा और ... वहीं रहा
  rationale: ἀναστρέφω यहाँ प्रसंगानुसार केवल वापस लौटने ही नहीं, किसी स्थान पर रहकर समय बिताने का भाव भी दे सकता है। अवधि बताने वाले पद के साथ यह संयुक्त अनुवाद स्वाभाविक हिन्दी में दोनों संभावित अर्थों को समेटता है।
- source_word: μετʼ αὐτῶν
  choice: अपनी सेना के साथ
  rationale: μετά संबंधकारक के साथ संगति बताता है। निकटवर्ती ἡ δύναμις αὐτοῦ से स्पष्ट होता है कि ‘उनके साथ’ से अभिप्राय उसके सैनिक दल से है; हिन्दी में सर्वनाम के अस्पष्ट लगने से बचने के लिए इसे स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: स्पष्ट बलसूचक सर्वनाम का जोर बनाए रखता है कि सेनानायक व्यक्तिगत रूप से सेना के साथ था।
- source_word: ἡ δύναμις αὐτοῦ
  choice: अपनी सेना
  rationale: सैन्य आख्यान में δύναμις सशस्त्र सैन्य बल को सूचित करता है। ‘सेना’ आधुनिक हिन्दी में स्पष्ट, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐφʼ ἡμέρας ἑκατὸν εἴκοσι
  choice: एक सौ बीस दिन तक
  rationale: ἐπί और द्वितीया कालावधि व्यक्त करते हैं। ‘दिन तक’ हिन्दी में इस अवधि को सहज रूप से प्रकट करता है।
