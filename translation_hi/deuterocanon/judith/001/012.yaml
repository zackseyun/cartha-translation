base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/012.yaml
  text: And Nebuchadnezzar became very angry with all this land[a], and he swore by his throne and his kingdom that he would surely avenge himself on all the territories of Cilicia and Damascus and Syria, and put them to the sword—along with all who lived in Moab and the Ammonites and all Idumea and all those in Egypt[b]—until one came to the borders of the two seas.
translation:
  language: hi
  text: और नबूकदनेस्सर इस पूरे भूभाग पर बहुत क्रोधित हुआ। उसने अपने सिंहासन और अपने राज्य की शपथ खाकर कहा कि वह किलिकिया, दमिश्क और सीरिया के सभी क्षेत्रों से अवश्य प्रतिशोध लेगा और वहाँ के लोगों को तलवार से मार डालेगा—साथ ही मोआब के सभी निवासियों, अम्मोनियों, पूरे इदूमिया और मिस्र में रहने वाले सभी लोगों को भी—दो समुद्रों की सीमाओं तक पहुँचने तक[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “यदि वह प्रतिशोध न ले।” यूनानी शपथ-सूत्र यहाँ साधारण नकारात्मक शर्त के बजाय दृढ़ शपथ और संकल्प व्यक्त करता है। “दो समुद्र” संभवतः विचाराधीन भूभाग की सीमा बताने वाले समुद्रों की ओर संकेत करते हैं; पाठ उनका नाम नहीं बताता।
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: ἐθυμώθη ... σφόδρα
  choice: बहुत क्रोधित हुआ
  rationale: क्रोध में आने के भाव और σφόδρα की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ πᾶσαν τὴν γῆν ταύτην
  choice: इस सारे देश पर
  rationale: ἐπί यहाँ क्रोध के लक्ष्य को बताता है; γῆ का प्रसंगानुकूल अर्थ भूभाग या देश है।
- source_word: κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ
  choice: अपने सिंहासन और अपने राज्य की शपथ खाकर
  rationale: ὤμοσεν के साथ κατά शपथ के आधार को सूचित करता है; हिन्दी में यह मुहावरेदार और अर्थ-स्पष्ट है।
- source_word: εἰ μὴ ἐκδικήσει
  choice: अवश्य बदला लेगा
  rationale: शपथ-सूत्र में εἰ μή साधारण नकारात्मक शर्त नहीं, बल्कि दृढ़ संकल्प व्यक्त करता है; ἐκδικέω का भाव यहाँ प्रतिशोध का है।
- source_word: πάντα τὰ ὅρια
  choice: सभी प्रदेशों
  rationale: शाब्दिक अर्थ ‘सभी सीमाएँ’ है, पर यहाँ सीमाओं से घिरे भूभाग अभिप्रेत हैं; ‘प्रदेशों’ से भौगोलिक अर्थ स्पष्ट रहता है।
- source_word: ἀνελεῖν τῇ ῥομφαίᾳ
  choice: तलवार से मार डालेगा
  rationale: सैन्य हिंसा और वध के स्पष्ट भाव को बिना अनावश्यक प्राचीन मुहावरे के व्यक्त करता है।
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: अम्मोनियों
  rationale: ‘अम्मोन के पुत्रों’ का स्वाभाविक हिन्दी जातिनाम।
- source_word: πᾶσαν τὴν Ἰδουμαίαν
  choice: पूरे इदूमिया
  rationale: यूनानी भौगोलिक नाम Ἰδουμαία को सीधे सुरक्षित रखा गया है, इसे चुपचाप ‘एदोम’ में नहीं बदला गया।
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ τὰ ὅρια τῶν δύο θαλασσῶν
  choice: यहाँ तक कि वह दो समुद्रों की सीमाओं तक पहुँच जाए
  rationale: ἕως के सीमा-वाचक अर्थ को स्वाभाविक हिन्दी में रखा गया है। यूनानी में infinitive का कर्ता व्यक्त नहीं है; प्रसंग से नबूकदनेस्सर निहित प्रतीत होता है, इसलिए हिन्दी वाक्य की स्पष्टता हेतु ‘वह’ रखा गया है।
theological_decisions:
- issue: ὤμοσεν ... εἰ μὴ वाला शपथ-सूत्र
  choice: दृढ़ शपथ के रूप में ‘अवश्य बदला लेगा’
  alternative: शाब्दिक रूप से ‘यदि वह बदला न ले’ या ‘जब तक वह बदला न ले’
  rationale: यूनानी शपथ-सूत्र का बल निश्चय और प्रतिज्ञा पर है। शाब्दिक नकारात्मक शर्त हिन्दी में अर्थ को अस्पष्ट या उलटा कर सकती है; मुख्य पाठ में दृढ़ संकल्प रखा गया और शाब्दिक रूप पादटिप्पणी में बताया गया है।
- issue: ἐλθεῖν का अव्यक्त कर्ता
  choice: प्रसंगानुसार ‘वह’ अर्थात नबूकदनेस्सर
  alternative: कर्तारहित ‘दो समुद्रों की सीमाओं तक पहुँचने तक’
  rationale: यूनानी infinitive में कर्ता स्पष्ट नहीं है, पर हिन्दी में कर्तारहित रचना अस्वाभाविक और संदिग्ध होगी। प्रसंगगत निहित कर्ता रखा गया, जबकि भौगोलिक अभिव्यक्ति की अनिश्चितता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण कथात्मक शैली अपनाई गई है। लंबे यूनानी वाक्य को पठनीय बनाने के लिए एक पूर्ण विराम और डैश का प्रयोग किया गया है। स्थाननामों को यूनानी साक्ष्य के निकट रखते हुए हिन्दी में प्रचलित रूप दिए गए हैं; हिंसा और प्रतिशोध की कठोरता को नरम नहीं किया गया।
