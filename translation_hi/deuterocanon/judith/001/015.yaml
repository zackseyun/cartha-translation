  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। व्यक्तिवाचक नाम मूल यूनानी रूपों के निकट देवनागरी में दिए गए हैं। कठिन अंतिम कालगत पदबंध को सहज बनाने के लिए उसका अर्थ बदलने के बजाय उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
