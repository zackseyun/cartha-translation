lexical_decisions:
- source_word: ἔλαβε
  choice: पकड़ लिया
  rationale: सैनिक प्रसंग में यह शत्रु को अपने अधिकार में कर लेने का अर्थ देता है; ‘पकड़ लिया’ सहज हिंदी में बंदी बनाने या युद्ध में धर दबोचने की क्रिया को व्यक्त करता है।
- source_word: ἐν τοῖς ὄρεσι
  choice: पहाड़ों में
  rationale: बहुवचन ὄρεσι का सीधा और स्वाभाविक स्थानवाचक अनुवाद है।
- source_word: Ῥαγαῦ
  choice: रगाऊ
  rationale: स्वीटे के यूनानी पाठ Ῥαγαῦ का देवनागरी लिप्यंतरण किया गया है; दूसरी परंपराओं का स्थान-नाम मुख्य पाठ में नहीं मिलाया गया।
- source_word: κατηνάγκισεν
  choice: परास्त किया
  rationale: क्रिया बलपूर्वक दबाने या वश में करने का भाव रखती है। युद्ध के प्रसंग और भालों के साधनवाचक प्रयोग के साथ ‘परास्त किया’ स्वाभाविक और पर्याप्त रूप से सशक्त है।
- source_word: σιβύναις
  choice: भालों
  rationale: σιβύνη शिकार या युद्ध में प्रयुक्त भाले/बरछे जैसे हथियार को दर्शाता है। ‘भाला’ आधुनिक हिंदी में स्पष्ट और परिचित शब्द है।
- source_word: ἐξωλέθρευσεν
  choice: सर्वनाश कर दिया
  rationale: यह क्रिया केवल मार डालने से अधिक, पूर्ण विनाश का प्रबल भाव देती है; ‘सर्वनाश कर दिया’ उस तीव्रता को बनाए रखता है।
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: उस दिन तक
  rationale: यह यूनानी वाक्यांश का निकट और जानबूझकर अनिर्णायक अनुवाद है। ‘आज तक’ कहना ἐκείνης के संकेत को बदल देता, जबकि केवल ‘उस दिन’ कहना ἕως को दबा देता।
theological_decisions:
- issue: ἕως τῆς ἡμέρας ἐκείνης का कालगत अर्थ
  choice: उस दिन तक
  alternative: आज तक / उसी दिन
  rationale: मूल वाक्यांश का शाब्दिक कालगत तनाव बनाए रखा गया है। कथाकार के वर्तमान तक परिणाम बने रहने या उसी दिन विनाश पूरा होने में से किसी एक अर्थ को चुपचाप निश्चित नहीं किया गया।
