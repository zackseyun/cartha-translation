  rationale: यूनानी पाठ में स्पष्ट रूप से ποταμός, अर्थात ‘नदी’, है। अन्य बाइबिलीय परंपराओं के ‘नाले/वाडी’ को मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में रखा गया है।
