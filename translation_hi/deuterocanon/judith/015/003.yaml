  yaml_path: translation/deuterocanon/judith/015/003.yaml
  text: And those encamped in the hill country around Bethulia turned to flight[a]; then the sons of Israel, every man a warrior[c][b], poured out against them.
translation:
  language: hi
  text: और बेतूलिया के चारों ओर पहाड़ी प्रदेश में डेरा डाले हुए लोग भाग खड़े हुए[a]। तब इस्राएल के पुत्र[b]—हर एक पुरुष योद्धा—उन पर उमड़ पड़े[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भागने के लिए मुड़ गए”; अर्थात् वे भाग निकले।
    reason: lexical_alternative
  - marker: b
    text: अथवा “इस्राएली”; यूनानी में “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: c
    text: अथवा “उनके विरुद्ध झपट पड़े”; शाब्दिक चित्र है, “उन पर उंडेल दिए गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρεμβεβληκότες
  choice: डेरा डाले हुए लोग
  rationale: पूर्णकालिक कृदंत यहाँ संज्ञा के रूप में उन लोगों को दर्शाता है जो सैन्य पड़ाव में तैनात थे; यह हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐν τῇ ὀρεινῇ
  choice: पहाड़ी प्रदेश में
  rationale: ὀρεινή किसी एक पहाड़ के बजाय पहाड़ी या ऊँचे भूभाग को सूचित करता है।
- source_word: κύκλῳ Βαιτυλουὰ
  choice: बेतूलिया के चारों ओर
  rationale: κύκλῳ स्थान के चारों ओर या आसपास होने का भाव व्यक्त करता है।
- source_word: ἐτράπησαν εἰς φυγήν
  choice: भाग खड़े हुए
  rationale: यह यूनानी सैन्य मुहावरे का स्वाभाविक हिंदी रूप है; पादटिप्पणी में उसके अधिक शाब्दिक चित्र को सुरक्षित रखा गया है।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएल के पुत्र
  rationale: पारंपरिक जातीय अभिव्यक्ति और स्रोत के स्पष्ट पुल्लिंग रूप को बनाए रखता है।
- source_word: πᾶς ἀνὴρ πολεμιστής
  choice: हर एक योद्धा पुरुष
  rationale: πᾶς का वितरणात्मक बल तथा ἀνήρ का स्पष्ट पुरुषवाचक अर्थ दोनों सुरक्षित रहते हैं।
- source_word: ἐξέχυθησαν ἐπʼ αὐτούς
  choice: उन पर उमड़ पड़े
  rationale: ἐκχέω के उंडेले जाने वाले सजीव रूपक को सहज हिंदी में सैन्य दल के वेग से निकल पड़ने के रूप में व्यक्त करता है।
theological_decisions:
- issue: जातीय और सैन्य भाषा का स्पष्ट पुल्लिंग रूप
  choice: इस्राएल के पुत्र—हर एक योद्धा पुरुष
  alternative: इस्राएली—हर योद्धा
  rationale: यूनानी में υἱοί और ἀνήρ दोनों स्पष्ट रूप से पुल्लिंग हैं। चुना हुआ रूप इस भाषिक विशेषता को बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज वर्णनात्मक रूप अपनाया गया है। सैन्य प्रसंग को ‘डेरा डाले’, ‘भाग खड़े हुए’ और ‘उमड़ पड़े’ से स्पष्ट किया गया है; साथ ही स्रोत के सजीव मुहावरों और स्पष्ट पुरुषवाचक भाषा को सुरक्षित रखा गया है।
