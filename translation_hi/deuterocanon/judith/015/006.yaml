base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/006.yaml
  text: But the rest[a], those living in Bethulia, fell upon the camp of Assyria[c][b], and they pursued them and plundered it greatly.
translation:
  language: hi
  text: तब बैतूलिया में रहनेवाले बाकी लोग अश्शूर की छावनी[a] पर टूट पड़े। उन्होंने उनका पीछा किया[b] और बहुत लूटपाट की।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अश्शूरी छावनी।” यूनानी में शाब्दिक रूप से “अश्शूर की छावनी” है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी अभिव्यक्ति का शाब्दिक अर्थ “वे उनके पीछे गए” है; युद्ध के इस प्रसंग में आशय है कि उन्होंने उनका पीछा किया।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “और बहुत-सा माल लूट लिया” भी हो सकता है। यूनानी में लूट की कोई स्पष्ट वस्तु नहीं बताई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: तब ... बाकी लोग
  rationale: οἱ λοιποί शेष या बाकी लोगों को दर्शाता है। यहाँ δέ प्रसंग को आगे बढ़ाता और पिछले समूह से ध्यान हटाकर बैतूलिया में रह गए लोगों पर लाता है; इसलिए सहज हिन्दी में ‘तब’ चुना गया है।
- source_word: οἱ κατοικοῦντες Βαιτυλουὰ
  choice: बैतूलिया में रहनेवाले
  rationale: κατοικοῦντες का अर्थ किसी स्थान में निवास करना है। ‘रहनेवाले’ आधुनिक हिन्दी में स्वाभाविक है और कृदन्तीय रचना को बनाए रखता है।
- source_word: ἐπέπεσαν
  choice: पर टूट पड़े
  rationale: यह क्रिया अचानक और प्रबल आक्रमण का भाव देती है। ‘टूट पड़े’ उस जीवंत सैनिक बल को सामान्य ‘आक्रमण किया’ से अधिक अच्छी तरह व्यक्त करता है।
- source_word: τῇ παρεμβολῇ Ἀσσούρ
  choice: अश्शूर की छावनी
  rationale: सैनिक प्रसंग में παρεμβολή का अर्थ ‘छावनी’ है। संबंधकारक Ἀσσούρ को मूल यूनानी संरचना के निकट रहते हुए ‘अश्शूर की’ किया गया है।
- source_word: ἐπορεύοντο αὐτούς
  choice: उन्होंने उनका पीछा किया
  rationale: πορεύομαι सामान्यतः जाना या चलना है, पर यहाँ व्यक्ति-वाचक कर्म और युद्ध के प्रसंग में इसका अर्थ उनके पीछे जाना, अर्थात पीछा करना है। बहुवचन सर्वनाम की अस्पष्टता मूल के अनुसार रखी गई है।
- source_word: ἐλούτησαν σφόδρα
  choice: बहुत लूटपाट की
  rationale: क्रिया लूटने का और σφόδρα तीव्र मात्रा का भाव देता है। यूनानी में कोई स्पष्ट कर्म नहीं है, इसलिए हिन्दी में ‘छावनी को’ जैसा कर्म जोड़ने के बजाय स्वाभाविक अकर्मक अभिव्यक्ति चुनी गई है।
