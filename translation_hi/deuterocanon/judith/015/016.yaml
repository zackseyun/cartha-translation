  text: And Judith kept bringing forth this confession in all Israel[a], and all the people echoed this praise; and Judith said[b],
translation:
  language: hi
  text: 'और यूदीत सारे इस्राएल में धन्यवाद की इस स्तुति की अगुवाई करती रही[a], और सारी प्रजा ने उत्तर में यह स्तुति गाई[b]। तब यूदीत ने कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धन्यवाद’ के लिए यूनानी शब्द का अर्थ ‘सार्वजनिक अंगीकार’ या ‘स्तुति’ भी हो सकता है। यहाँ ‘अंगीकार’ का अर्थ पाप-स्वीकार अनिवार्यतः नहीं, बल्कि सार्वजनिक रूप से स्वीकार करना भी हो सकता है। क्रिया का अर्थ ‘आरम्भ करके अगुवाई की’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया प्रत्युत्तर में स्वर देने या प्रतिगान करने का संकेत देती है; अर्थात प्रजा ने इस स्तुति का उत्तर में गायन किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆρχεν
  choice: अगुवाई करने लगी
  rationale: यह रूप यहाँ ἐξάρχω से है और गीत अथवा सार्वजनिक वाणी का आरम्भ करके उसकी अगुवाई करने का भाव देता है। हिन्दी में यह चयन संगीतात्मक प्रसंग और अपूर्ण भूतकाल की आरम्भ होकर चलने वाली क्रिया—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐξομολόγησιν
  choice: धन्यवाद-गान
  rationale: बाइबलीय यूनानी में यह संज्ञा सार्वजनिक अंगीकार, धन्यवाद या स्तुति को सूचित कर सकती है। यहाँ सामूहिक गान के प्रसंग में ‘धन्यवाद-गान’ स्वाभाविक है, जबकि निकटवर्ती αἴνεσις से कुछ शब्दार्थिक भेद भी बना रहता है।
- source_word: ἐν παντὶ Ἰσραήλ
  choice: सारे इस्राएल में
  rationale: यह वाक्यांश भौगोलिक और सामुदायिक—दोनों संभावित अर्थों को खुला रखता है और आधुनिक हिन्दी में सहज है।
- source_word: ὑπεφώνει
  choice: उत्तर में ... गाने लगी
  rationale: क्रिया प्रत्युत्तर में स्वर देने अथवा प्रतिगान करने का संकेत देती है। यह अनुवाद सामूहिक और उत्तरात्मक गायन का भाव स्पष्ट करता है।
- source_word: πᾶς ὁ λαὸς
  choice: सारी प्रजा
  rationale: इस्राएल के समूचे जनसमुदाय के लिए ‘सारी प्रजा’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: αἴνεσιν
  choice: स्तुति
  rationale: यह संज्ञा यहाँ सार्वजनिक प्रशंसा अथवा स्तुति को दर्शाती है; ‘स्तुति’ हिन्दी बाइबलीय प्रयोग में सटीक और सुबोध है।
- source_word: εἶπεν
  choice: कहा
  rationale: आगामी प्रत्यक्ष वचन का सामान्य और स्वाभाविक कथात्मक परिचय।
theological_decisions:
- issue: क्या ἐξομολόγησις और αἴνεσις को एक ही शब्द ‘स्तुति’ से समतल कर दिया जाए
  choice: ‘धन्यवाद-गान’ और ‘स्तुति’ के रूप में भेद बनाए रखा गया
  alternative: दोनों को ‘स्तुति’ अथवा ‘स्तुति-गान’ कहना
  rationale: मूल यूनानी पास-पास दो अलग संज्ञाओं का प्रयोग करता है। भेद बनाए रखने से ἐξομολόγησις के धन्यवाद/सार्वजनिक अंगीकार के व्यापक भाव को मिटाए बिना काव्यात्मक संबंध स्पष्ट रहता है।
- issue: ἐξῆρχεν को केवल गीत आरम्भ करना माना जाए या उसकी अगुवाई करना
  choice: ‘अगुवाई करने लगी’
  alternative: ‘गाने लगी’ या ‘आरम्भ किया’
  rationale: ἐξάρχω दूसरे गायकों के सामने आरम्भ करके नेतृत्व करने का भाव दे सकता है, और अगली क्रिया में प्रजा का उत्तरात्मक स्वर इस अर्थ का समर्थन करता है। फिर भी पादटिप्पणी में सरल वैकल्पिक अर्थ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण कथात्मक-पद्यमय रजिस्टर अपनाया गया है। ‘धन्यवाद-गान’ और ‘स्तुति’ सामूहिक उपासना का प्रसंग स्पष्ट करते हैं; ‘अगुवाई करने लगी’ तथा ‘उत्तर में ... गाने लगी’ मूल की उत्तरात्मक गायन-रचना को स्वाभाविक हिन्दी में सामने लाते हैं।
