  yaml_path: translation/deuterocanon/judith/015/013.yaml
  text: And they gave Judith the tent of Holofernes[a], and all the silver vessels, and the couches, and the utensils, and all his furnishings. And she took them and placed them on her mule, and harnessed her wagons[b], and piled them on them.
translation:
  language: hi
  text: और उन्होंने होलोफेरनेस का तंबू, चाँदी की सारी वस्तुएँ, शय्याएँ, साज-सज्जा का सामान[a] और उसकी सारी सामग्री यूदीत को दे दी। उसने उन्हें लेकर अपनी खच्चर पर रख दिया, अपनी गाड़ियाँ जुताईं[b] और उन वस्तुओं को उन पर ढेर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘साज-सज्जा का सामान’ के लिए आया यूनानी शब्द ὅλκια दुर्लभ है और उसका अर्थ निश्चित नहीं है; इसका अर्थ ‘पर्दे’ या तंबू से जुड़ा कोई अन्य सामान भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश में बार-बार आए सर्वनामों का सम्भावित अर्थ है कि यूदीत ने उन वस्तुओं को गाड़ियों पर ढेर किया, यद्यपि यूनानी वाक्यरचना कुछ संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνήν
  choice: तंबू
  rationale: यह सैन्य शिविर में होलोफेरनेस के निवास-तंबू को दर्शाने वाला सामान्य और स्वाभाविक शब्द है।
- source_word: ἀργυρώματα
  choice: चाँदी की सारी वस्तुएँ
  rationale: यूनानी शब्द चाँदी से बनी वस्तुओं के लिए व्यापक है; यह अनुवाद उसे केवल भोजन के बर्तनों तक सीमित नहीं करता।
- source_word: κλίνας
  choice: पलंग
  rationale: κλίνη का अर्थ पलंग या लेटने का आसन हो सकता है। यहाँ चल संपत्ति की सूची में ‘पलंग’ सहज है और उपयोग को अनावश्यक रूप से भोज तक सीमित नहीं करता।
- source_word: ὅλκια
  choice: बर्तन
  rationale: यह दुर्लभ और अर्थ की दृष्टि से अनिश्चित शब्द है। सूची के संदर्भ में ‘बर्तन’ एक सम्भव संक्षिप्त अर्थ देता है, जबकि पादटिप्पणी अन्य सम्भावनाएँ सुरक्षित रखती है।
- source_word: σκευάσματα
  choice: साज-सामान
  rationale: यह उपकरणों, वस्तुओं या सामान के लिए व्यापक शब्द है; ‘साज-सामान’ सूची की अंतिम समावेशी श्रेणी के रूप में स्वाभाविक है।
- source_word: ἡμίονον
  choice: खच्चर
  rationale: यूनानी संज्ञा खच्चर को दर्शाती है; उसके लिंग को हिन्दी में बताना इस संदर्भ में आवश्यक नहीं है।
- source_word: ἔζευξεν
  choice: गाड़ियाँ जुताईं
  rationale: क्रिया का अर्थ जुए में जोड़ना या गाड़ी जोतना है। यह हिन्दी में परिवहन के लिए गाड़ियाँ तैयार कराने की स्वाभाविक अभिव्यक्ति है।
- source_word: ἁμάξας
  choice: गाड़ियाँ
  rationale: यह सामान ढोने वाले पहिएदार वाहनों के लिए उपयुक्त सामान्य हिन्दी शब्द है।
- source_word: ἐσώρευσεν
  choice: ढेर कर दिया
  rationale: यह मूल क्रिया के वस्तुओं को जमा करके लादने के ठोस चित्र को बनाए रखता है।
