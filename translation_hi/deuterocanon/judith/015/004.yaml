base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/004.yaml
  text: And Uzziah sent men to Bethomesthaim and Choba and Chola, and to all the territory of Israel, to report what had happened, and that all should rush out against the enemies for their destruction.
translation:
  language: hi
  text: और उज्जियाह ने बैतोमस्थाइम, खोबाई और खोला तथा इस्राएल के सारे क्षेत्र में दूत भेजे, ताकि वे जो कुछ हो चुका था उसका समाचार दें और सब लोग शत्रुओं के विरुद्ध उमड़ पड़ें, उनके विनाश के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “सब लोग शत्रुओं के विरुद्ध उंडेल दिए जाएँ”; यह बड़ी संख्या में लोगों के एक साथ आक्रमण के लिए उमड़ पड़ने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: सामान्य कथात्मक क्रिया; हिन्दी में कर्ता ‘उज्जियाह’ और कर्म ‘दूत’ के साथ स्वाभाविक रूप।
- source_word: Ὀζίας
  choice: उज्जियाह
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित व्यक्तिगत नाम; यूनानी रूप Ὀζίας के पहचाने जाने योग्य समतुल्य।
- source_word: Βαιτομασθαΐμ
  choice: बैतोमस्थाइम
  rationale: अनिश्चित स्थान-नाम को यूनानी रूप के निकट देवनागरी लिप्यंतरण में रखा गया है।
- source_word: Χωβὰι
  choice: खोबाई
  rationale: स्वीट पाठ के Χωβὰι का निकट लिप्यंतरण; अंतिम आयोटा को सुरक्षित रखा गया है।
- source_word: Χωλὰ
  choice: खोला
  rationale: यूनानी स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: इस्राएल के सारे क्षेत्र में
  rationale: ὅριον यहाँ केवल सीमा-रेखा नहीं, भूभाग या क्षेत्र को दर्शाता है; εἰς के साथ संदेश भेजने की दिशा हिन्दी में ‘में’ से स्वाभाविक है।
- source_word: τοὺς ἀπαγγέλλοντας
  choice: दूत ... ताकि वे ... समाचार दें
  rationale: संज्ञात्मक कृदंत उन भेजे गए व्यक्तियों और उनके कार्य दोनों को व्यक्त करता है; ‘दूत’ प्रसंगानुकूल और संक्षिप्त है।
- source_word: ὑπὲρ τῶν συντετελεσμένων
  choice: जो कुछ हो चुका था उसका समाचार
  rationale: पूर्ण कृदंत सम्पन्न घटनाओं की ओर संकेत करता है; हिन्दी वाक्य में रिपोर्ट करने का आशय स्पष्ट रहता है।
- source_word: ἵνα πάντες ἐκχυθῶσιν
  choice: सब लोग ... उमड़ पड़ें
  rationale: शाब्दिक अर्थ ‘उंडेल दिए जाएँ’ है, पर सैन्य प्रसंग में यह बड़ी संख्या में वेग से बाहर निकल पड़ने का मुहावरा है।
- source_word: τοῖς πολεμίοις
  choice: शत्रुओं ... के विरुद्ध
  rationale: गति और आक्रमण के प्रसंग में दत्तिव का स्वाभाविक हिन्दी रूप।
- source_word: εἰς τὴν ἀναίρεσιν αὐτῶν
  choice: उनका विनाश करने के लिए
  rationale: सैन्य प्रसंग में ἀναίρεσις हिंसक उन्मूलन या विनाश बताता है; क्रियात्मक हिन्दी उद्देश्य को स्पष्ट और स्वाभाविक रखती है।
theological_decisions:
- issue: सैन्य कथा में हिंसा की भाषा
  choice: उनका विनाश करने के लिए
  alternative: उनका वध करने के लिए
  rationale: मूल पाठ शत्रुओं के हिंसक उन्मूलन का उद्देश्य स्पष्ट करता है। ‘विनाश’ उसकी कठोरता बनाए रखता है, जबकि ‘वध’ विधि को आवश्यकता से अधिक विशिष्ट कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण कथात्मक स्तर रखा गया है। स्थान-नाम मूल यूनानी के निकट लिप्यंतरित हैं; सैन्य मुहावरे को मुख्य पाठ में अर्थानुसार और पादटिप्पणी में शाब्दिक भाव सहित दिया गया है।
