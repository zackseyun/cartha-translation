translation:
  language: hi
  text: और जब तंबुओं में रहनेवालों ने यह सुना, तो जो कुछ हुआ था उससे वे स्तब्ध रह गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह सामान्य संयोजक कथा के प्रवाह को बनाए रखता है और यूनानी से अधिक कालगत अर्थ नहीं जोड़ता।
- source_word: ὡς
  choice: जब
  rationale: यहाँ अओरिस्ट क्रिया के साथ ὡς कालवाचक उपवाक्य आरंभ करता है; ‘जब’ स्वाभाविक है और अनावश्यक तात्कालिकता नहीं जोड़ता।
- source_word: ἤκουσαν
  choice: सुना
  rationale: मूल अर्थ सुनना या समाचार सुनना है; ‘सुना’ सबसे सीधा और कम व्याख्यात्मक रूप है।
- source_word: οἱ ἐν τοῖς σκηνώμασιν ὄντες
  choice: तंबुओं में रहनेवालों
  rationale: यह उन लोगों को सूचित करता है जो तंबुओं में थे; लिंग को अनावश्यक रूप से निर्दिष्ट किए बिना यूनानी कृदंत-वाक्यांश का स्वाभाविक हिन्दी रूप देता है।
- source_word: σκηνώμασιν
  choice: तंबुओं
  rationale: सैन्य शिविर के प्रसंग में ‘तंबू’ आधुनिक हिन्दी में सर्वाधिक उपयुक्त और स्पष्ट है।
- source_word: ἐξέστησαν
  choice: स्तब्ध रह गए
  rationale: क्रिया विस्मय, मानसिक विचलन या अपने-आपे से बाहर हो जाने जैसी तीव्र प्रतिक्रिया व्यक्त कर सकती है; इस प्रसंग में ‘स्तब्ध रह गए’ आघात और अचंभे दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπὶ τὸ γεγονός
  choice: जो कुछ हुआ था उससे
  rationale: यह घट चुकी घटना को कारण या प्रतिक्रिया के आधार के रूप में दर्शाता है; यह रूप γεγονός की पूर्णतासूचक शक्ति को सहज हिन्दी में रखता है।
