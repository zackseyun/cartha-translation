base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/005.yaml
  text: But when the sons of Israel heard[a], they all together fell upon them and kept striking them down as far as Choba. Likewise, those from Jerusalem and from all the hill country also arrived, for the things that had happened in the camp of their enemies had been reported to them; and those in Gilead and those in Galilee outflanked them with a great slaughter[c][b], until they had passed Damascus and its borders.
translation:
  language: hi
  text: पर जब इस्राएल के पुत्रों ने यह सुना[a], तो वे सब एक साथ उन पर टूट पड़े और खोबा तक उन्हें मारते गए। इसी प्रकार यरूशलेम से और सारे पहाड़ी प्रदेश से भी लोग आ पहुँचे, क्योंकि उन्हें बता दिया गया था कि उनके शत्रुओं की छावनी में क्या हुआ था। और गिलाद तथा गलील के लोगों ने उनसे आगे निकलकर[b] उन्हें भारी चोट पहुँचाई[c], जब तक वे दमिश्क और उसकी सीमाओं से आगे नहीं निकल गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएलियों ने।’ यूनानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों ने’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनसे आगे निकलकर’ के लिए प्रयुक्त यूनानी सैन्य क्रिया का अर्थ पीछा करते समय उनसे आगे निकल जाना, उन्हें पछाड़ना, या उनका रास्ता काट देना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उन्हें बड़ी मार मारी’ अथवा ‘उन पर बड़ा प्रहार किया।’ युद्ध के इस संदर्भ में यह वाक्यांश भारी जनहानि का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी पारिवारिक पदबंध को स्पष्ट रूप से सुरक्षित रखा गया है; अधिक सहज विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: ὁμοθυμαδόν
  choice: सब एक साथ
  rationale: यह सामूहिक और एकजुट कार्रवाई का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπέπεσον ἐπʼ αὐτούς
  choice: उन पर टूट पड़े
  rationale: यूनानी सैन्य मुहावरे की तीव्रता और जीवंतता को बनाए रखता है।
- source_word: ἔκοπτον αὐτούς
  choice: उन्हें मारते गए
  rationale: अपूर्ण भूतकाल की निरंतर और बार-बार होती कार्रवाई को व्यक्त करता है, बिना हथियार विशेष मान लिए।
- source_word: ἕως Χωβά
  choice: खोबा तक
  rationale: स्थान-सूचक सीमा को स्वाभाविक हिन्दी में व्यक्त करते हुए यूनानी रूप से स्थाननाम का लिप्यंतरण करता है।
- source_word: ἐκ πάσης τῆς ὀρεινῆς
  choice: सारे पहाड़ी प्रदेश से
  rationale: भौगोलिक ऊँचे/पहाड़ी क्षेत्र का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: τῇ παρεμβολῇ
  choice: छावनी में
  rationale: सैन्य संदर्भ में παρεμβολή का स्वाभाविक अर्थ ‘छावनी’ है।
- source_word: ὑπερεκέρασαν αὐτούς
  choice: आगे से घेरकर
  rationale: पीछा करते समय शत्रु से आगे निकलने, उसके पार जाने या उसका रास्ता काटने के सामरिक भाव को संक्षेप में व्यक्त करता है; अर्थ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: πληγῇ μεγάλῃ
  choice: भारी संहार किया
  rationale: युद्ध के संदर्भ में बड़े प्रहार से हुई व्यापक जनहानि का सम्भावित भाव देता है; अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἕως οὗ παρῆλθον Δαμασκὸν καὶ τὰ ὅρια αὐτῆς
  choice: जब तक वे दमिश्क और उसकी सीमाओं से आगे नहीं निकल गए
  rationale: स्थान से आगे निकलने का भाव रखता है और बहुवचन कर्ता ‘वे’ की स्रोतगत संदर्भ-अस्पष्टता को नहीं सुलझाता।
