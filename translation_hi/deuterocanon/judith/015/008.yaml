  yaml_path: translation/deuterocanon/judith/015/008.yaml
  text: And Joakim the high priest and the council of the sons of Israel[a], who dwelt in Jerusalem, came to see the good things that the Lord had done for Israel[b], and to see Judith and speak peaceably with her.
translation:
  language: hi
  text: यरूशलेम में रहने वाले महायाजक योआकीम और इस्राएल की सन्तानों की परिषद प्रभु ने इस्राएल के लिए जो भलाई की थी उसे देखने, यूदीत को देखने और उससे शान्ति की बातें करने आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωακειὶμ
  choice: योआकीम
  rationale: नाम को स्वेटे के यूनानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है; इसे किसी भिन्न इब्रानी नाम-रूप में सामान्यीकृत नहीं किया गया।
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: महायाजक
  rationale: यह प्रधान याजकीय पद के लिए प्रचलित और स्वाभाविक हिन्दी पद है।
- source_word: ἡ γερουσία
  choice: महासभा
  rationale: यह प्राचीनों की शासकीय परिषद को सूचित करता है। ‘महासभा’ आधुनिक हिन्दी में संस्थागत अर्थ स्पष्ट करता है और रोमी ‘सीनेट’ का अनावश्यक रंग नहीं लाता।
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल की सन्तानों की
  rationale: यूनानी का पारिवारिक-जातीय पद शाब्दिक रूप से सुरक्षित है। हिन्दी में ‘सन्तान’ सामूहिक पद होने से पूरे इस्राएली समुदाय को समेटता है और मूल अभिव्यक्ति को मिटाता नहीं।
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλὴμ
  choice: जो यरूशलेम में रहते थे
  rationale: निकटतम पूर्ववर्ती संज्ञा-समूह, अर्थात महासभा के सदस्यों, से इसका सम्बन्ध रखा गया है; भाषा सहज और वर्तमान हिन्दी की है।
- source_word: τὰ ἀγαθὰ ἃ ἐποίησεν Κύριος τῷ Ἰσραήλ
  choice: प्रभु ने इस्राएल के लिए क्या-क्या भलाई की थी
  rationale: ‘भलाई’ τὰ ἀγαθὰ की व्यापकता बनाए रखती है—इसमें उपकारी कार्य और उनके अच्छे परिणाम दोनों आ सकते हैं—और इसे केवल ‘आशीषों’ तक सीमित नहीं करती।
- source_word: Κύριος
  choice: प्रभु
  rationale: ईश्वर के लिए κύριος का प्रतिष्ठित, गरिमापूर्ण और सामान्य हिन्दी समतुल्य।
- source_word: τοῦ ἰδεῖν τὴν Ἰουδεὶθ
  choice: यहूदीत को देखने
  rationale: दूसरे प्रयोजनवाचक infinitive को पहले के समान सीधे रूप में रखा गया है; ‘मिलने’ कहने से अधिक अर्थ जोड़ा जाता।
- source_word: λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: उससे शान्ति की बातें करने
  rationale: मूल की सामी-प्रभावित ‘उसके साथ शान्ति बोलना’ अभिव्यक्ति में ‘शान्ति’ को बनाए रखते हुए हिन्दी को बोधगम्य बनाया गया है; यह शांतिपूर्वक संबोधन या मंगलपूर्ण अभिनन्दन दोनों की सम्भावना खुली रखता है।
theological_decisions:
- issue: κύριος का ईश्वर-सूचक अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यह प्रसंग इस्राएल के पक्ष में कार्य करने वाले परमेश्वर का है। ‘प्रभु’ पारंपरिक और स्वाभाविक है, जबकि ‘स्वामी’ यहाँ मानवीय पद का आभास दे सकता है।
- issue: τῶν υἱῶν Ἰσραήλ की वाचिक पहचान
  choice: इस्राएल की सन्तानें
  alternative: इस्राएली
  rationale: मूल का पारिवारिक और वाचिक लोगों का पद सुरक्षित रखा गया है, पर हिन्दी में ऐसा रूप चुना गया है जो समुदाय को सामूहिक रूप से व्यक्त करता है।
- issue: λαλῆσαι ... εἰρήνην का आशय
  choice: शान्ति की बातें करना
  alternative: शांतिपूर्वक बात करना / मंगलकामना देना
  rationale: मूल वाक्यांश केवल बोलने के ढंग या औपचारिक बधाई में से किसी एक को निर्विवाद रूप से निर्धारित नहीं करता। मुख्य पाठ ‘शान्ति’ को सुरक्षित रखता है और पादटिप्पणी सम्भव अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘महायाजक’, ‘महासभा’, ‘प्रभु’ और ‘शान्ति’ जैसे प्रतिष्ठित बाइबलीय पद बनाए गए हैं। वाक्य को हिन्दी की स्पष्टता के लिए अर्धविराम और पुनरुक्त ‘वे ... भी आए’ से व्यवस्थित किया गया है, बिना तीन प्रयोजनवाचक यूनानी infinitives का आशय खोए।
