  terminology: “नृत्य-दल” appropriately preserves the group/dance ambiguity of χορός. “उत्सवी छड़ियाँ” is understandable for θύρσους, and the note properly identifies the Greek cultural term. “आशीर्वाद दिया” is the standard Hindi expression while preserving εὐλόγησαν’s blessing sense.
