  yaml_path: translation/deuterocanon/judith/015/014.yaml
  text: And every woman of Israel ran together to see her[a], and they blessed her, and they made a dance for her from among themselves; and she took thyrsi in her hands and gave them to the women with her[b],
translation:
  language: hi
  text: इस्राएल की हर स्त्री उसे देखने के लिए दौड़कर इकट्ठी हुई[a]। उन स्त्रियों ने उसे आशीर्वाद दिया और अपने ही बीच से उसके लिए एक नृत्य-दल बनाया। फिर उसने अपने हाथों में उत्सवी छड़ियाँ[b] लीं और उन्हें अपने साथ की स्त्रियों को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल की सभी स्त्रियाँ उसे देखने के लिए दौड़कर इकट्ठी हुईं।” यूनानी में सामूहिक अर्थ वाला एकवचन, “इस्राएल की हर स्त्री,” प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में इन्हें “थिर्सोस” कहा गया है—उत्सवों और शोभायात्राओं में काम आने वाली छड़ियाँ या दंड।
    reason: cultural_note
lexical_decisions:
- source_word: συνέδραμεν
  choice: दौड़कर इकट्ठी हुई
  rationale: क्रिया शीघ्रता से एक स्थान पर आ मिलने का भाव देती है; यह अनुवाद गति और सामूहिक जुटने, दोनों को बनाए रखता है।
- source_word: πᾶσα γυνὴ Ἰσραήλ
  choice: इस्राएल की हर स्त्री
  rationale: यूनानी के सामूहिक एकवचन को निकटता से सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: τοῦ ἰδεῖν αὐτήν
  choice: उसे देखने के लिए
  rationale: सकार्थक infinitive यहाँ उद्देश्य प्रकट करता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: εὐλόγησαν
  choice: उसे आशीष दी
  rationale: εὐλογέω का मूल धार्मिक और सम्मानसूचक अर्थ ‘आशीष देना’ सुरक्षित रखा गया है; केवल ‘प्रशंसा की’ कहने से इसका धार्मिक आयाम घट सकता था।
- source_word: ἐποίησαν αὐτῇ χορὸν ἐξ αὐτῶν
  choice: अपने ही बीच से उसके लिए एक नृत्य-दल बनाया
  rationale: χορός यहाँ उत्सवी सामूहिक नृत्य अथवा नृत्य करने वाले दल को सूचित कर सकता है। ‘नृत्य-दल’ समूह और नृत्य दोनों का भाव देता है, जबकि ‘अपने ही बीच से’ ἐξ αὐτῶν को व्यक्त करता है।
- source_word: θύρσους
  choice: उत्सवी छड़ियाँ
  rationale: इस सांस्कृतिक वस्तु का हिन्दी में कोई सर्वमान्य संक्षिप्त नाम नहीं है। अर्थपूर्ण सामान्य पद मुख्य पाठ को बोधगम्य रखता है और पादटिप्पणी यूनानी शब्द की विशिष्टता स्पष्ट करती है।
- source_word: ταῖς γυναιξὶν ταῖς μετʼ αὐτῆς
  choice: अपने साथ की स्त्रियों को
  rationale: यह जूडिथ के साथ उपस्थित अथवा चल रही स्त्रियों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
