  source_fidelity: 'The draft accurately represents the sequence and all principal Greek elements: the collective-singular expression for Israel’s women, their running together to see Judith, blessing her, forming a dance-group from among themselves, and Judith’s taking and distributing thyrsi. The purposive force of τοῦ ἰδεῖν is retained. A minor adjustment makes the collective-singular/plural shift smoother in Hindi without obscuring it.'
