  yaml_path: translation/deuterocanon/judith/015/009.yaml
  text: And when they entered to her[a], they all with one accord blessed her and said to her, “You are the exaltation of Jerusalem, you are the great boast of Israel[b], you are the great glory of our people.”
translation:
  language: hi
  text: जब वे उसके पास आए, तो उन सबने एक मन होकर उसे आशीर्वाद दिया और उससे कहा, “तुम यरूशलेम का उत्कर्ष[a] हो, तुम इस्राएल का महान गौरव हो, तुम हमारे लोगों का महान गर्व[b] हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम की ऊँचाई।” यूनानी शब्द में ऊँचा उठाए जाने का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमारे लोगों के लिए गर्व करने का महान कारण।” यूनानी संज्ञा किसी व्यक्ति या बात को गर्व करने का आधार बता सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: वे उसके पास भीतर आए
  rationale: εἰσῆλθον के प्रवेश करने और πρὸς αὐτήν के उसकी ओर/उसके पास आने—दोनों भावों को बनाए रखता है; केवल ‘उसके पास आए’ कहने से प्रवेश का भाव लुप्त हो जाता।
- source_word: εὐλόγησαν
  choice: आशीष दी
  rationale: क्रिया का सामान्य और प्रसंगानुकूल अर्थ ‘आशीष देना’ है; इसके बाद आने वाले सम्मानसूचक उद्गार इस औपचारिक भाव को पुष्ट करते हैं।
- source_word: πάντες ὁμοθυμαδόν
  choice: उन सबने एक मन होकर
  rationale: πάντες सामूहिक समावेश और ὁμοθυμαδόν एकमतता तथा साझा भाव को व्यक्त करता है।
- source_word: ὕψωμα
  choice: उत्कर्ष
  rationale: यह शब्द ऊँचाई या ऊँचा उठाए जाने की अवस्था का बिंब रखता है। ‘उत्कर्ष’ यरूशलेम को ऊँचा उठाने वाली उपलब्धि के रूप में यहूदीत की प्रशंसा करता है, बिना इसे केवल आंतरिक गर्व में बदलने के।
- source_word: γαυρίαμα
  choice: महान गौरव
  rationale: यह किसी ऐसी बात या व्यक्ति को दर्शाता है जिस पर सार्वजनिक रूप से गर्व किया जाए। ‘गौरव’ आधुनिक हिन्दी में सम्मानसूचक और स्वाभाविक है।
- source_word: καύχημα
  choice: महान अभिमान
  rationale: καύχημα का मूल भाव गर्व या गर्व करने के आधार का है। ‘अभिमान’ इसे बनाए रखता है और γαυρίαμα के लिए प्रयुक्त ‘गौरव’ से आलंकारिक भिन्नता भी बचाता है।
- source_word: τοῦ γένους ἡμῶν
  choice: हमारे लोगों का
  rationale: γένος यहाँ वंशगत-जातीय समुदाय को सूचित करता है। ‘हमारे लोग’ आधुनिक हिन्दी में सहज है और ‘जाति’ के संभावित भ्रामक सामाजिक अर्थों से बचता है।
theological_decisions:
- issue: यहूदीत के लिए ऊँचे नागरिक और राष्ट्रीय सम्मानसूचक संबोधन
  choice: तीनों समानांतर उपाधियों को सीधे सामुदायिक प्रशंसा के रूप में प्रस्तुत किया गया है।
  alternative: उन्हें हल्का करके केवल ‘यरूशलेम की शान’ जैसे सामान्य प्रशंसात्मक वाक्य कहना।
  rationale: यूनानी पाठ औपचारिक सार्वजनिक आशीर्वाद में यहूदीत की उद्धारकारी भूमिका का ऊँचा सम्मान करता है। अनुवाद इस आलंकारिक बल को न तो घटाता है, न किसी अतिरिक्त धार्मिक उपाधि में बदलता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक अभिनंदन के अनुकूल रखी गई है। ‘तुम’ वर्तमान मानक हिन्दी में सम्मानपूर्ण और सहज संबोधन देता है; तीन बार इसकी पुनरावृत्ति यूनानी के बलपूर्ण समानांतर विन्यास को बनाए रखती है।
