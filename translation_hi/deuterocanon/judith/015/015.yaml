base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/015.yaml
  text: And they crowned her with an olive wreath[a], she and the women with her. And she went before all the people in the dance, leading all the women, and every man of Israel followed, armed[b], with wreaths and with hymns in their mouths.
translation:
  language: hi
  text: तब उन्होंने उसे और उसके साथ की स्त्रियों को जैतून की मालाओं[a] से सजाया। वह नृत्य-जुलूस में[b] सब लोगों के आगे चली और सभी स्त्रियों की अगुवाई की। इस्राएल के सभी पुरुष हथियारबंद, मालाओं से सजे और अपने मुँह में स्तुतिगान लिए उसके पीछे चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘जैतून’ है; यहाँ संभवतः जैतून की डालियों से बनी उत्सवी या विजय-मालाएँ अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘नृत्य करती हुई’। यूनानी शब्द नृत्य करने की क्रिया अथवा संगठित सामूहिक नृत्य-जुलूस—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστεφανώσαντο τὴν ἐλαίαν
  choice: अपने सिरों पर जैतून की मालाएँ पहन लीं
  rationale: मध्यवाच्य बहुवचन क्रिया और उसके स्पष्ट स्त्रीलिंग कर्ताओं को देखते हुए इसका अर्थ है कि यूदीत और उसकी संगिनी स्त्रियों ने स्वयं को जैतून से अलंकृत किया। उत्सव और विजय के प्रसंग में ‘जैतून’ से जैतून की माला अभिप्रेत है।
- source_word: αὐτὴ καὶ αἱ μετʼ αὐτῆς
  choice: उसने और उसके साथ की स्त्रियों ने
  rationale: αὐτή और स्त्रीलिंग बहुवचन αἱ को क्रिया के संयुक्त कर्ता मानकर अनूदित किया गया है; आगे स्त्रियों का उल्लेख भी इस अर्थ की पुष्टि करता है।
- source_word: προῆλθεν παντὸς τοῦ λαοῦ
  choice: वह ... सब लोगों के आगे चली
  rationale: प्रसंग में क्रिया जुलूस के अग्रभाग में आगे बढ़ने को व्यक्त करती है, न कि केवल किसी स्थान से बाहर निकलने को।
- source_word: ἐν χορείᾳ
  choice: नृत्य करती हुई
  rationale: χορεία उत्सवी नृत्य अथवा सामूहिक नृत्य-जुलूस को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और व्यापक अर्थ फुटनोट में दिया गया है।
- source_word: ἡγουμένη πασῶν τῶν γυναικῶν
  choice: सभी स्त्रियों की अगुवाई की
  rationale: 'कृदंत यूदीत की भूमिका को स्पष्ट करता है: वह स्त्रियों के समूह के आगे नेतृत्व कर रही थी।'
- source_word: ἐνωπλισμένοι
  choice: हथियारों से सुसज्जित
  rationale: यह युद्ध-सामग्री या हथियार धारण किए होने का सीधा अर्थ देता है; ‘सुसज्जित’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: μετὰ στεφάνων
  choice: मालाएँ पहने
  rationale: विजयोत्सव के संदर्भ में στέφανοι राजमुकुट नहीं, उत्सवी या विजय-मालाएँ हैं।
- source_word: ὕμνων ἐν τῷ στόματι αὐτῶν
  choice: मुँह से स्तुतिगान गाते हुए
  rationale: शाब्दिक बिंब ‘उनके मुँह में स्तुतिगान’ है; हिन्दी में क्रियात्मक रूप अर्थ को स्पष्ट और स्वाभाविक रखता है, जबकि मुख से सामूहिक स्तुति करने का भाव सुरक्षित रहता है।
