  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। यूनानी मध्यवाच्य और स्त्रीलिंग कर्ताओं के कारण पहले वाक्य को यूदीत तथा उसकी संगिनी स्त्रियों द्वारा स्वयं मालाएँ पहनने के रूप में प्रस्तुत किया गया है। ‘स्तुतिगान’ धार्मिक उत्सव के स्वर को बनाए रखता है, और जहाँ यूनानी में वास्तविक अर्थगत विस्तार है वहाँ फुटनोट द्वारा अस्पष्टता सुरक्षित रखी गई है।
