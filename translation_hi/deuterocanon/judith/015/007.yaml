  yaml_path: translation/deuterocanon/judith/015/007.yaml
  text: But the sons of Israel[a], returning from the slaughter, took possession of the rest, and the villages and hamlets in the hill country and in the plain took much plunder[c][b], for there was a very great quantity.
translation:
  language: hi
  text: पर इस्राएल के पुत्र[a] मार-काट से लौटकर शेष पर अधिकार कर लिया; और पहाड़ी प्रदेश तथा मैदानी भाग के गाँवों और देहाती बस्तियों[b] ने बहुत-सी लूट[c] अपने अधिकार में कर ली, क्योंकि लूट बहुत अधिक थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली।” यूनानी में अधिक शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “गाँवों और देहाती आवासों।” यहाँ प्रयुक्त शब्द ग्रामीण घरों या छोटी देहाती बसाहटों का उल्लेख कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “युद्ध की बहुत-सी लूटी हुई सामग्री।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἰσραήλ
  choice: इस्राएल के पुत्र
  rationale: यूनानी मुहावरे का निकट और गरिमापूर्ण अनुवाद; सामान्य अर्थ ‘इस्राएली’ पादटिप्पणी में दिया गया है।
- source_word: ἀναστρέψαντες ἀπὸ τῆς κοπῆς
  choice: मार-काट से लौटकर
  rationale: कृदन्त की कालगत भूमिका और सैनिक प्रसंग में κοπή के हिंसक अर्थ, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκυρίευσαν τῶν λοιπῶν
  choice: बचे हुओं पर अधिकार कर गए
  rationale: τῶν λοιπῶν को संदर्भानुसार बचे हुए लोगों के रूप में समझते हुए κυριεύω का प्रभुत्व-सूचक अर्थ बनाए रखता है; ‘बाकी वस्तुओं पर कब्ज़ा’ वाली सम्भावना को अनावश्यक रूप से नहीं अपनाता।
- source_word: αἱ κῶμαι καὶ ἐπαύλεις
  choice: गाँवों और ग्रामीण बस्तियों
  rationale: κῶμαι के लिए ‘गाँव’ और ἐπαύλεις की ग्रामीण आवासों अथवा छोटी देहाती बसाहटों की व्यापकता के लिए ‘ग्रामीण बस्तियाँ’ स्पष्ट आधुनिक हिन्दी है।
- source_word: ἐν τῇ ὀρεινῇ καὶ πεδινῇ
  choice: पहाड़ी प्रदेश तथा मैदानी भाग
  rationale: दोनों भौगोलिक क्षेत्रों को सहज, मानक हिन्दी में अलग-अलग व्यक्त करता है।
- source_word: ἐκράτησαν πολλῶν λαφύρων
  choice: बहुत-सी लूट अपने अधिकार में कर ली
  rationale: κρατέω के पकड़ने/अधिकार में लेने और λάφυρα के युद्धजन्य लूट के अर्थ को संयुक्त रूप से व्यक्त करता है।
- source_word: ἦν γὰρ πλῆθος πολὺ σφόδρα
  choice: क्योंकि उसकी मात्रा अत्यन्त अधिक थी
  rationale: πλῆθος πολὺ σφόδρα के प्रबल परिमाण-बोध को बनाए रखते हुए सर्वनाम को निकटवर्ती लूट से जोड़ता है।
