base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/010.yaml
  text: You have done all these things by your hand[a]; you have done good things for Israel, and God has been pleased with them[b]. May you be blessed by the Almighty Lord forever.
translation:
  language: hi
  text: तुमने ये सब काम अपने हाथ से किए हैं; तुमने इस्राएल के लिए भले काम किए हैं[a], और परमेश्वर उनसे प्रसन्न हुआ है[b]। सर्वशक्तिमान प्रभु की ओर से तुम सदा धन्य हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के साथ भले काम।” यहाँ यूनानी वाक्यांश का आशय संभवतः इस्राएल के हित में काम करना है।
    reason: lexical_alternative
  - marker: b
    text: “उनसे” का संकेत संभवतः किए गए भले कामों की ओर है; यह इस्राएल के लोगों की ओर भी संकेत कर सकता है, हालाँकि इसकी संभावना कम है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησας πάντα ταῦτα
  choice: तुमने ये सब काम ... किए हैं
  rationale: ग्रीक के पूर्ण किए गए कार्यों को हिन्दी में स्वाभाविक पूर्ण पक्ष के साथ व्यक्त करता है और πάντα ταῦτα की बहुवचन भावना बनाए रखता है।
- source_word: ἐν χειρί σου
  choice: अपने हाथ से
  rationale: यह साधनवाचक मुहावरे की सजीवता को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὰ ἀγαθὰ μετὰ Ἰσραήλ
  choice: इस्राएल के लिए भलाई के काम
  rationale: τὰ ἀγαθὰ को ठोस बहुवचन अर्थ में रखा गया है। μετά का मूल अर्थ ‘साथ’ है, पर इस संदर्भ में वाक्यांश इस्राएल के हित में किए गए भले कार्यों को सूचित करता जान पड़ता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: εὐδόκησεν ἐπʼ αὐτοῖς
  choice: परमेश्वर उनसे प्रसन्न हुआ है
  rationale: ‘उनसे’ पूर्ववर्ती भलाई के कामों की ओर स्वाभाविक रूप से संकेत करता है, फिर भी हिन्दी में सर्वनाम का संदर्भ इतना खुला रहता है कि मूल की संभावित अस्पष्टता न मिटे।
- source_word: εὐλογημένη γίνου
  choice: तुम ... आशीषित रहो
  rationale: स्त्रीलिंग संबोधन हिन्दी में अलग रूप नहीं माँगता। यह आज्ञार्थक रूप को आशीर्वचन की कामनात्मक शक्ति के साथ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παρὰ τῷ παντοκράτορι κυρίῳ
  choice: सर्वशक्तिमान प्रभु की ओर से
  rationale: παρά के स्रोत/कर्ता-संबंध को व्यक्त करता है और κύριος को परंपरागत, स्पष्ट दिव्य उपाधि ‘प्रभु’ के रूप में रखता है।
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: सदा
  rationale: दीर्घ, निरंतर काल के इस ग्रीक मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: κύριος का दिव्य उपाधि के रूप में अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में κύριος परमेश्वर की उपाधि है; ‘प्रभु’ हिन्दी बाइबलीय भाषा में स्पष्ट और गैर-सांप्रदायिक है।
- issue: εὐλογημένη γίνου का बल
  choice: तुम सदा आशीषित रहो
  alternative: तुम आशीषित हो जाओ
  rationale: प्रसंग में यह केवल परिवर्तन की आज्ञा नहीं, बल्कि विधिवत दिया गया आशीर्वचन है; ‘रहो’ उसकी निरंतर और कामनात्मक शक्ति व्यक्त करता है।
- issue: ἐπʼ αὐτοῖς के सर्वनाम का संदर्भ
  choice: भलाई के काम प्रमुख संभावित संदर्भ, पर अस्पष्टता सुरक्षित
  alternative: इस्राएल के लोग
  rationale: निकटतम व्याकरणिक पूर्वपद τὰ ἀγαθὰ है, पर लोगों की ओर संकेत पूरी तरह असंभव नहीं; इसलिए मुख्य पाठ और पादटिप्पणी दोनों संभावनाओं को खुला रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने हाथ से’ मूल मुहावरे की सजीवता बचाता है, जबकि अंतिम वाक्य को स्वाभाविक हिन्दी आशीर्वचन के रूप में प्रस्तुत किया गया है।
