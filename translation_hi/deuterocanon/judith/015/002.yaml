  yaml_path: translation/deuterocanon/judith/015/002.yaml
  text: And terror and fear fell upon them[a], and no man remained standing before his neighbor any longer; but, scattering in all directions[b], they fled along every road of the plain and of the hill country.
translation:
  language: hi
  text: और उन पर आतंक और भय छा गया, और अब कोई भी व्यक्ति दूसरे के सामने खड़ा न रहा; बल्कि वे बिखरकर[a], एक साथ[b] मैदान और पहाड़ी प्रदेश के हर मार्ग से भागने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फैलकर”; इसका अधिक शाब्दिक अर्थ “उँडेल दिए जाकर” है। यूनानी शब्द घबराहट में सेना के टूटकर फैल जाने का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “एक ही समय पर।” इसका अनुवाद “एक मन होकर” भी हो सकता है, पर यहाँ संभवतः आशय सामंजस्यपूर्ण एकता से नहीं, बल्कि सबके एक साथ या एकाएक भागने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν ἐπʼ αὐτοὺς
  choice: उन पर ... छा गया
  rationale: यूनानी क्रिया किसी बात के अचानक आ पड़ने या हावी हो जाने का सजीव भाव देती है। हिंदी में “छा गया” आतंक और भय के आकस्मिक रूप से उन्हें जकड़ लेने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τρόμος καὶ φόβος
  choice: आतंक और भय
  rationale: दोनों यूनानी संज्ञाओं को अलग रखते हुए उनकी तीव्रता और पुनरुक्तिपरक बल सुरक्षित रखा गया है; τρόμος यहाँ केवल शारीरिक काँपना नहीं, बल्कि युद्धकालीन दहशत दर्शाता है।
- source_word: οὐκ ἦν ἄνθρωπος μένων
  choice: कोई भी आदमी ... टिका न रहा
  rationale: यह वाक्यांश किसी के भी अपने स्थान पर बने न रहने को दर्शाता है। “टिका न रहा” भगदड़ के संदर्भ में स्वाभाविक है और μένων के निरंतर बने रहने के भाव को रखता है।
- source_word: κατὰ πρόσωπον τοῦ πλησίον
  choice: अपने साथी के सामने
  rationale: शाब्दिक चित्र किसी निकटवर्ती व्यक्ति के मुख के सामने होने का है। सैनिक संदर्भ में πλησίον के लिए “साथी” संबंध और निकट उपस्थिति दोनों को सहजता से व्यक्त करता है।
- source_word: ἔτι
  choice: अब ... न रहा
  rationale: ἔτι पूर्व स्थिति के समाप्त होने का संकेत देता है। नकारात्मक हिंदी वाक्य में “अब ... न रहा” इसका स्वाभाविक समतुल्य है।
- source_word: ἐκχυθέντες
  choice: बिखरकर
  rationale: इस कृदंत का मूल चित्र उँडेल दिए जाने या फैल जाने का है। भागती सेना के संदर्भ में “बिखरकर” उस दृश्य को बिना अनावश्यक सैन्य व्याख्या जोड़े व्यक्त करता है।
- source_word: ὁμοθυμαδόν
  choice: एक साथ
  rationale: क्रिया-विशेषण सामूहिक या एक ही आवेग में हुई कार्रवाई बता सकता है। यहाँ “एक साथ” सकारात्मक सामंजस्य का अर्थ थोपे बिना मूल की संभावित सामूहिकता बनाए रखता है।
- source_word: ἔφευγον
  choice: भागने लगे
  rationale: यूनानी अपूर्णकाल चलती हुई भगदड़ का वर्णन करता है। हिंदी कथन में “भागने लगे” उस आरंभ और जारी गति को स्वाभाविक रूप देता है।
- source_word: ἐπὶ πᾶσαν ὁδὸν
  choice: हर सड़क पर
  rationale: यह उपलब्ध सभी मार्गों से होने वाली गति को दर्शाता है। “हर सड़क पर” व्यापक फैलाव को संक्षेप और स्पष्ट रूप में रखता है।
- source_word: τοῦ πεδίου καὶ τῆς ὀρεινῆς
  choice: मैदान और पहाड़ी प्रदेश
  rationale: πεδίον खुले समतल भूभाग और ὀρεινή पहाड़ी भूक्षेत्र को सूचित करते हैं। यह चयन दोनों भौगोलिक क्षेत्रों का स्वाभाविक हिंदी भेद बनाए रखता है।
