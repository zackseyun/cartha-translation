base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/001.yaml
  text: 'And when the uproar of the men around the council had ceased[a], Holofernes, commander-in-chief of the army of Asshur, said to Achior in the presence of all the assembly of foreigners:'
translation:
  language: hi
  text: 'और जब परिषद के चारों ओर मौजूद पुरुषों का कोलाहल थम गया, तब अश्शूर[a] की सेना के प्रधान सेनापति होलोफेरनेस ने परदेशियों की सारी सभा के सामने अकीओर से कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अश्शूरिया’। यूनानी पाठ में व्यक्तिवाचक नाम ‘अस्सूर’ है, जिसका अनुवाद व्यक्ति या जाति के नाम ‘अश्शूर’ अथवा राज्य के नाम ‘अश्शूरिया’ के रूप में किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέπαυσεν
  choice: थम गया
  rationale: यह क्रिया कोलाहल के पूरी तरह समाप्त हो जाने को दर्शाती है और ὡς के साथ अगले कथन से पहले की घटना को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: θροῦβος
  choice: कोलाहल
  rationale: यह शब्द केवल ध्वनि नहीं, बल्कि शोरभरी हलचल का भी भाव रखता है; ‘कोलाहल’ दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: συνεδρίας
  choice: परिषद
  rationale: यह विचार-विमर्श के लिए एकत्र निकाय या बैठक को सूचित करता है; ‘परिषद’ उसके संस्थागत भाव को बनाए रखता है।
- source_word: ἀρχιστράτηγος
  choice: प्रधान सेनापति
  rationale: यौगिक उपाधि सामान्य सेनापति से ऊँचे, सर्वोच्च सैन्य पद को दर्शाती है; आधुनिक हिन्दी में ‘प्रधान सेनापति’ स्पष्ट और गरिमापूर्ण है।
- source_word: δυνάμεως
  choice: सेना
  rationale: इस सैन्य प्रसंग में δύναμις सशस्त्र बल को सूचित करता है; ‘सेना’ सबसे स्वाभाविक अर्थ है।
- source_word: Ἀσσοὺρ
  choice: अश्शूर
  rationale: यूनानी पाठ में यह व्यक्तिवाचक नाम है; हिन्दी बाइबलीय परंपरा में प्रचलित ‘अश्शूर’ नाम को रखा गया है, जबकि राज्यवाचक अर्थ फुटनोट में दिया गया है।
- source_word: ἐναντίον
  choice: के सामने
  rationale: यहाँ वाक्यांश सार्वजनिक उपस्थिति में बोलने का भाव देता है; ‘के सामने’ स्थान और सार्वजनिकता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: δήμου
  choice: सभा
  rationale: यह एकत्र लोगों के सामूहिक निकाय को सूचित करता है; प्रसंग में ‘सभा’ उपयुक्त है।
- source_word: ἀλλοφύλων
  choice: परदेशियों
  rationale: यह दूसरे कुल या जाति के लोगों के लिए व्यापक पद है; ‘परदेशियों’ से किसी विशिष्ट जाति, जैसे पलिश्तियों, का अर्थ अनावश्यक रूप से नहीं जुड़ता।
- source_word: τῶν κύκλῳ τῆς συνεδρίας
  choice: परिषद के चारों ओर मौजूद पुरुषों
  rationale: अनुवाद κύκλῳ के स्थानगत अर्थ को बनाए रखता है और मूल में न बताई गई बैठने या खड़े होने की मुद्रा नहीं जोड़ता।
theological_decisions:
- issue: Ἀσσοὺρ को व्यक्ति/जाति के नाम या राज्य के नाम के रूप में प्रस्तुत करना
  choice: अश्शूर
  alternative: अश्शूरिया
  rationale: यूनानी रूप को पहले व्यक्तिवाचक नाम के रूप में रखना मूल की रूपगत अस्पष्टता को बचाता है; राज्यवाचक समझ को फुटनोट में पारदर्शी रूप से दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘कोलाहल’, ‘प्रधान सेनापति’ और ‘सभा’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल के औपचारिक स्वर को बनाए रखते हैं। फुटनोट-चिह्न को उसी शब्द ‘अश्शूर’ पर लगाया गया है जिससे उसका विकल्प संबंधित है।
