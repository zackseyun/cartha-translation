    text: या “मज़दूरी पर रखा हुआ आदमी” या “भाड़े का आदमी।” मूल शब्द का अर्थ वेतन लेकर सेवा करने वाला व्यक्ति है और प्रसंग में यह तिरस्कारपूर्ण संबोधन हो सकता है।
    reason: lexical_alternative
