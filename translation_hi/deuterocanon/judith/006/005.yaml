lexical_decisions:
- source_word: μισθωτὲ
  choice: मज़दूर
  rationale: यह शब्द मज़दूरी पर सेवा करने वाले व्यक्ति को दर्शाता है। संबोधन में निहित तिरस्कार को प्रसंग व्यक्त करता है; ‘मज़दूर’ अनावश्यक रूप से सैनिक अर्थ जोड़े बिना मूल अर्थ को सहज हिन्दी में रखता है।
- source_word: τοῦ Ἀμμών
  choice: अम्मोन के
  rationale: सम्बन्ध अथवा संबद्धता बताने वाले यूनानी सम्बन्धकारक को सीधे रखा गया है; इसे विशेषण ‘अम्मोनी’ में नहीं बदला गया।
- source_word: ἐλάλησας τοὺς λόγους τούτους
  choice: तूने ... ये बातें कही हैं
  rationale: मूल के भाषण-सन्दर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘ये वचन बोले’ की अपेक्षा यह अधिक सहज है।
- source_word: ἐν ἡμέρᾳ ἀδικίας σου
  choice: अपने अन्याय के दिन
  rationale: असामान्य मूल वाक्यांश को जानबूझकर निकटता से रखा गया है। ‘अन्याय’ नैतिक दोष, अपराध या विश्वासघाती आचरण के बीच मूल की सम्भावित व्यापकता बनाए रखता है।
- source_word: οὐκ ὄψῃ ἔτι τὸ πρόσωπόν μου
  choice: तू फिर मेरा मुख नहीं देखेगा
  rationale: ‘मुख देखना’ वाला मूल मुहावरा सुरक्षित है और हिन्दी में व्यक्तिगत उपस्थिति से वंचित किए जाने का भाव समझ में आता है।
- source_word: ἀπὸ τῆς ἡμέρας ταύτης
  choice: आज के दिन से
  rationale: समय-सूचक वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: ἕως οὗ ἐκδικήσω
  choice: जब तक कि मैं बदला न ले लूँ
  rationale: ἐκδικέω के दण्डात्मक प्रतिशोध के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और वाक्य को मूल की तरह इसी बिन्दु पर अधूरा रहने देता है।
theological_decisions:
- issue: शत्रुतापूर्ण राजकीय आरोप में ἀδικία का अर्थ
  choice: अपने अन्याय के दिन
  alternative: अपने अपराध के दिन / अपनी अधार्मिकता के दिन
  rationale: ‘अन्याय’ मूल शब्द के व्यापक नैतिक अर्थ के निकट है और यह निश्चित नहीं करता कि आरोप सामान्य नैतिक दोष, कोई खास अपराध या राजद्रोही आचरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्रत्यक्ष संबोधन में ‘तू’ मूल के एकवचन और अपमानजनक लहजे को व्यक्त करता है। पद यूनानी स्रोत की तरह ‘बदला लेने’ पर समाप्त होता है; अगले पद का कर्म यहाँ जोड़कर वाक्य को कृत्रिम रूप से पूरा नहीं किया गया।
