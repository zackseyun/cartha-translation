  text: But you[a], Achior, hireling of Ammon, who spoke these words in the day of your injustice[b], shall no longer see my face from this day until I take vengeance
translation:
  language: hi
  text: परन्तु हे अहीओर, अम्मोन के वेतनभोगी[a], जिसने अपने अन्याय के दिन[b] ये बातें कहीं, आज से तू फिर मेरा मुख नहीं देखेगा, जब तक कि मैं बदला न ले लूँ।
  philosophy: optimal-equivalence
  footnotes:
