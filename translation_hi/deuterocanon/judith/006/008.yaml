translation:
  language: hi
  text: और वह तब तक नाश नहीं होगा, जब तक तुम उनके साथ पूरी तरह नष्ट न कर दिए जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολῇ
  choice: नाश नहीं होगा
  rationale: ἀπόλλυμι के यहाँ अकर्मक अर्थ ‘नाश होना’ को व्यक्त करता है; यह ‘मार नहीं दिया जाएगा’ की अपेक्षा यूनानी वाक्य की अकर्मकता और व्यापक विनाश-बोध को बेहतर बनाए रखता है।
- source_word: ἕως οὗ
  choice: तब तक … जब तक
  rationale: यह मानक कालवाचक संबंध है। हिन्दी में ‘तब तक … जब तक’ स्वाभाविक रूप से यूनानी ‘until’ संरचना को व्यक्त करता है।
- source_word: ἐξολεθρευθῇς
  choice: पूरी तरह नष्ट न कर दिए जाओगे
  rationale: ἐξολεθρεύω साधारण विनाश से अधिक प्रबल, समूल या पूर्ण विनाश का भाव रखता है। ‘पूरी तरह’ इस तीव्रता को स्पष्ट करता है, और कर्मवाच्य रूप यूनानी कर्मवाच्य के अनुरूप है।
- source_word: μετʼ αὐτῶν
  choice: उनके साथ
  rationale: सहभागिता अथवा एक ही परिणति में सम्मिलित होने का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: καὶ
  choice: और
  rationale: साधारण समुच्चयबोधक संबंध को बिना विरोधात्मक अर्थ जोड़े सुरक्षित रखता है।
