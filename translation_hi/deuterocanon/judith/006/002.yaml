base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/002.yaml
  text: And who are you[a], Achior, and the hirelings of Ephraim among all the sons of Moab, that you have prophesied among us as you did today, and said that one should not make war against the house of Israel because their God will defend them? And who is God except Nebuchadnezzar? He himself will send his force and destroy them from the face of the earth[c][b], and their God will not rescue them.
translation:
  language: hi
  text: “और हे अखियोर, तू कौन है—और एप्रैम के वे मज़दूरी पर रखे हुए लोग कौन हैं जो मोआब के सब पुत्रों के बीच रहते हैं[a]—कि तूने आज हमारे बीच भविष्यवाणी की और कहा कि इस्राएल के वंश[b] से युद्ध न किया जाए, क्योंकि उनका परमेश्वर उनकी रक्षा करेगा? नबूकदनेस्सर को छोड़ और कौन ईश्वर है?[c] वही अपनी शक्ति भेजेगा और उन्हें धरती पर से मिटा देगा, और उनका परमेश्वर उन्हें नहीं बचाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्यरचना कठिन है। इसका अर्थ यह भी हो सकता है: “हे अखियोर और एप्रैम के मज़दूरी पर रखे हुए लोगो, मोआब के सब पुत्रों के बीच तुम कौन हो?” ‘मज़दूरी पर रखे हुए’ में तिरस्कार का भाव हो सकता है; संदर्भ में ‘भाड़े के सैनिक’ भी संभव है।'
    reason: textual_syntax_and_lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “इस्राएल का वंश/कुल” है; इससे जातीय और पैतृक संबंध पर बल पड़ता है।
    reason: lexical_alternative
  - marker: c
    text: “नबूकदनेस्सर को छोड़ और कौन ईश्वर है?” वक्ता का घमंडी दावा है, कथावाचक द्वारा उसकी ईश्वरता का समर्थन नहीं।
    reason: cultural_theological_note
