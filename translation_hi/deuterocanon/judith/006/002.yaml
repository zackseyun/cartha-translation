- source_word: μισθωτοὶ Ἐφράιμ
  choice: एप्रैम के वे मज़दूरी पर रखे हुए लोग
  rationale: μισθωτοί मूलतः वे लोग हैं जो मज़दूरी लेकर सेवा करते हैं; संदर्भ में इसका स्वर तिरस्कारपूर्ण हो सकता है, पर यूनानी शब्द अपने-आप में केवल सैनिक अर्थ तक सीमित नहीं है।
- source_word: ἐπροφήτευσας
  choice: तूने ... भविष्यवाणी की
  rationale: क्रिया के स्पष्ट भविष्यसूचक अर्थ को बनाए रखा गया है; वक्ता के उपहासपूर्ण या शत्रुतापूर्ण स्वर के कारण इसे सामान्य ‘कहा’ में नहीं बदला गया।
- source_word: τὸ γένος Ἰσραήλ
  choice: इस्राएल के वंश
  rationale: γένος में जातीय उद्गम, वंश और समुदाय का भाव है। ‘वंश’ आधुनिक हिन्दी में उस पैतृक संबंध को संक्षेप में सुरक्षित रखता है।
- source_word: μὴ πολεμῆσαι
  choice: युद्ध न किया जाए
  rationale: निर्भर infinitive के निषेधात्मक आशय को स्वाभाविक हिन्दी के कर्मवाच्य रूप में व्यक्त किया गया है।
- source_word: ὑπερασπιεῖ
  choice: रक्षा करेगा
  rationale: यह क्रिया किसी के पक्ष में खड़े होकर उसकी रक्षा करने का भाव रखती है; सैन्य संदर्भ में ‘रक्षा करेगा’ स्पष्ट और सहज है।
- source_word: θεὸς
  choice: ईश्वर / परमेश्वर
  rationale: इस्राएल के परमेश्वर के लिए प्रचलित ‘परमेश्वर’ रखा गया है, जबकि नबूकदनेस्सर के विषय में विधेयात्मक और ईशनिंदात्मक दावे में ‘ईश्वर’ रखा गया है ताकि वक्ता के दावे और कथावाचक की स्वीकृति में भेद बना रहे।
- source_word: τὸ κράτος αὐτοῦ
  choice: अपनी शक्ति
  rationale: κράτος शक्ति, सामर्थ्य या प्रभुत्व को दर्शाता है। यूनानी पाठ स्पष्ट रूप से ‘सेना’ नहीं कहता, इसलिए व्यापक ‘शक्ति’ चुना गया।
- source_word: ἐξολεθρεύσει ... ἀπὸ προσώπου τῆς γῆς
  choice: धरती पर से मिटा देगा
  rationale: बलपूर्वक पूर्ण विनाश और ‘पृथ्वी के मुख से’ वाले बाइबिलीय मुहावरे को स्वाभाविक आधुनिक हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: ῥύσεται
  choice: बचाएगा
  rationale: तात्कालिक सैन्य संकट से छुड़ाने या बचाने का अर्थ देता है और अनावश्यक रूप से व्यापक धर्मशास्त्रीय अर्थ नहीं जोड़ता।
theological_decisions:
- issue: नबूकदनेस्सर को ईश्वर कहने वाला दावा
  choice: नबूकदनेस्सर को छोड़ और कौन ईश्वर है?
  alternative: नबूकदनेस्सर को छोड़ और कौन परमेश्वर है?
  rationale: यूनानी लिपि में बड़े-छोटे अक्षर द्वारा धर्मशास्त्रीय भेद नहीं किया जा सकता। ‘ईश्वर’ और साथ की टिप्पणी यह स्पष्ट करते हैं कि यह पात्र का घमंडी, ईशनिंदात्मक दावा है, कथावाचक का अनुमोदन नहीं।
- issue: इस्राएल के समुदाय के लिए γένος
  choice: इस्राएल के वंश
  alternative: इस्राएल के लोग / इस्राएल का घराना
  rationale: ‘वंश’ मूल के जातीय और पैतृक आयाम को सुरक्षित रखता है; ‘लोग’ अधिक सामान्य है और ‘घराना’ मूल शब्द को एक विशेष बाइबिलीय सूत्र में बदल सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से स्पष्ट हिन्दी अपनाई गई है। अपमानजनक संबोधन में ‘तू’ वक्ता की अवमानना को व्यक्त करता है। आरंभिक यूनानी वाक्य की वास्तविक व्याकरणिक कठिनाई को मुख्य पाठ में पठनीय रूप देकर पादटिप्पणी में वैकल्पिक संरचना सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रमशः उपस्थित हैं।
