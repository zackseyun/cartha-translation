  yaml_path: translation/deuterocanon/judith/006/012.yaml
  text: And when the men of the city saw them on the top of the mountain, they took up their weapons and went out of the city to the top of the mountain; and every man who used a sling held back their ascent and kept throwing stones at them.
translation:
  language: hi
  text: जब नगर के पुरुषों ने उन्हें पहाड़ की चोटी पर देखा, तो उन्होंने अपने हथियार उठा लिए और नगर से निकलकर पहाड़ की चोटी की ओर बढ़े। तब गोफन चलाने वाले सभी पुरुषों ने उनकी चढ़ाई रोक दी और उन पर लगातार पत्थर फेंकते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὡς εἶδαν
  choice: जब ... देखा
  rationale: ὡς के साथ भूतकालिक क्रिया यहाँ समयसूचक है और नगर के पुरुषों की प्रतिक्रिया आरम्भ करने वाली घटना बताती है। हिन्दी में आरम्भिक καί को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: नगर के पुरुषों
  rationale: ग्रीक के स्पष्ट पुल्लिंग बहुवचन को बनाए रखते हुए आधुनिक और स्वाभाविक हिन्दी प्रयोग किया गया है।
- source_word: ἐπὶ τὴν κορυφὴν τοῦ ὄρους
  choice: पहाड़ की चोटी पर / पहाड़ की चोटी की ओर
  rationale: पहली बार वाक्यांश देखने की स्थिति बताता है, इसलिए ‘पर’; दूसरी बार गति की दिशा बताता है, इसलिए ‘की ओर’। इससे एक ही यूनानी वाक्यांश के प्रसंगगत कारक-संबंध स्पष्ट होते हैं।
- source_word: ἀνέλαβον τὰ ὅπλα αὐτῶν
  choice: अपने हथियार उठा लिए
  rationale: यह युद्ध के लिए हथियार हाथ में लेने का भाव व्यक्त करता है; ‘हथियार’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ἐπῆλθον ἔξω τῆς πόλεως
  choice: नगर से निकलकर ... की ओर बढ़े
  rationale: ἐπέρχομαι में केवल बाहर निकलने से अधिक लक्ष्य की ओर बढ़ने का भाव हो सकता है; ἔξω τῆς πόλεως स्रोत-बिंदु को स्पष्ट करता है।
- source_word: πᾶς ἀνὴρ σφενδονήτης
  choice: हर गोफन चलाने वाले पुरुष
  rationale: ἀνήρ के स्पष्ट पुरुष-संदर्भ और σφενδονήτης के ‘गोफन चलाने वाला’ अर्थ दोनों सुरक्षित रखे गए हैं; पाद-टिप्पणी संक्षिप्त वैकल्पिक पद देती है।
- source_word: διεκράτησαν τὴν ἀνάβασιν αὐτῶν
  choice: उनके चढ़ने का मार्ग रोक रखा
  rationale: क्रिया रोकने या नियंत्रण में रखने का भाव देती है और ἀνάβασις ऊपर चढ़ने अथवा चढ़ाई के मार्ग को सूचित कर सकती है। हिन्दी में यह स्थलाकृतिक और सैनिक दोनों भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔβαλλον ἐν λίθοις ἐπʼ αὐτούς
  choice: उन पर लगातार पत्थर फेंकते रहे
  rationale: अपूर्ण भूतकाल ἔβαλλον जारी या बार-बार होने वाली क्रिया दर्शाता है, जिसे ‘लगातार ... फेंकते रहे’ व्यक्त करता है।
