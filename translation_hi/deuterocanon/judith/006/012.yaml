  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘गोफन’ बाइबिलीय परिवेश का सटीक तथा हिन्दी में मान्य शब्द है। स्रोत में कर्ता-वचन की हल्की असंगति है—‘हर ... पुरुष’ के बाद बहुवचन क्रियाएँ आती हैं—इसलिए हिन्दी में पहले एकवचन वितरणात्मक क्रिया और फिर समूहगत बहुवचन क्रिया रखकर मूल तनाव को यथासंभव सुरक्षित किया गया है।
