  text: and then the iron of my army and the people of my servants will pass through your sides[a], and you will fall among their wounded when they return[c][b];
translation:
  language: hi
  text: तब मेरी सेना का लोहा[a] और मेरे सेवकों के जन तेरे पहलुओं[b] के आर-पार निकल जाएँगे, और जब वे लौटेंगे, तब तू उनके घायलों[c] के बीच गिर पड़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “मेरी सेना का लोहा” है। यहाँ “लोहा” हथियारों या सशस्त्र शक्ति के लिए प्रयुक्त हो सकता है; अधिक व्याख्यात्मक अनुवाद “मेरी सेना की तलवारें” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “तेरे पहलू” का अनुवाद प्रसंग के अनुसार “तेरे पार्श्व” या “तेरी पसलियाँ” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी वाक्यांश “उनके घायलों के बीच” संक्षिप्त और कुछ अस्पष्ट है। आशय संभवतः उन लोगों से है जिन्हें होलोफेरनेस की सेनाओं ने घायल किया होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: διελεύσεται
  choice: आर-पार निकल जाएँगे
  rationale: क्रिया का मूल अर्थ ‘होकर निकलना’ है। हिंसक सैनिक प्रसंग में ‘आर-पार निकलना’ गति और भेदने की निहित छवि दोनों को बनाए रखता है, बिना उसे केवल ‘काट डालना’ या ‘नष्ट करना’ बना देने के।
- source_word: ὁ σίδηρος
  choice: लोहा
  rationale: यूनानी में शाब्दिक रूप से ‘लोहा’ है, जो यहाँ लोहे के हथियारों या सशस्त्र शक्ति का लक्षणार्थक प्रयोग हो सकता है। ‘तलवारें’ कहने से ऐसा विशिष्ट हथियार जुड़ जाता जो मूल में स्पष्ट नहीं है।
- source_word: τῆς στρατείας μου
  choice: मेरी सेना का
  rationale: इस सैनिक संदर्भ में στρατεία अमूर्त ‘अभियान’ के बजाय सैन्य बल को सूचित करता है; इसलिए ‘सेना’ स्वाभाविक और सटीक है।
- source_word: ὁ λαὸς τῶν θεραπόντων μου
  choice: मेरे सेवकों के लोग
  rationale: λαός को ‘लोग’ और θεράποντες को ‘सेवक’ रखा गया है। यह अभिव्यक्ति मूल की कुछ असामान्य संरचना को बचाती है और उसे बिना आवश्यकता केवल ‘सैनिक’ नहीं बनाती।
- source_word: τὰς πλευράς σου
  choice: तेरे पहलुओं
  rationale: πλευρά का अर्थ पहलू, पार्श्व, पसली या सैन्य पार्श्व हो सकता है। ‘पहलू’ व्यक्तिगत और सामूहिक—दोनों संभावनाओं को अपेक्षाकृत खुला रखता है।
- source_word: πεσῇ
  choice: तू … गिर पड़ेगा
  rationale: ‘गिर पड़ना’ पराजय, घायल होने या मृत्यु की तीव्र छवि को बनाए रखता है, पर इनमें से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν τοῖς τραυματίαις αὐτῶν
  choice: उनके घायलों के बीच
  rationale: τραυματίαι घायल व्यक्तियों को दर्शाता है। αὐτῶν का संबंध संक्षिप्त और कुछ अस्पष्ट है; ‘उनके घायलों’ से वही व्याकरणिक संक्षिप्तता सुरक्षित रहती है।
- source_word: ὅταν ἐπιστρέψωσιν
  choice: जब वे लौटेंगे
  rationale: ὅταν के साथ विधिलिंग भावी समय को सूचित करता है। सैनिक प्रसंग में ‘जब वे लौटेंगे’ सहज है और ‘मुड़ेंगे’ की संभावित परंतु कम स्पष्ट व्याख्या नहीं थोपता।
