- source_word: ἀνταποστήσουσίν σε
  choice: तुम्हें ... वापस ले जाकर
  rationale: संदर्भ में क्रिया अखियोर को फिर पहाड़ी प्रदेश की ओर ले जाने का भौतिक और दिशात्मक भाव देती है; ‘वापस ले जाकर’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ δοῦλοί μου
  choice: मेरे सेवक
