- source_word: εἰς τὴν ὀρεινήν
  choice: पहाड़ी प्रदेश में
  rationale: ὀρεινή किसी पहाड़ी या ऊँचे भूभाग को सूचित करता है; ‘पहाड़ी प्रदेश’ स्पष्ट और स्वाभाविक भौगोलिक अभिव्यक्ति है।
- source_word: θήσουσίν σε
  choice: रख देंगे
  rationale: τίθημι का यहाँ अर्थ किसी व्यक्ति को निर्दिष्ट स्थान पर रखना है; ‘रख देंगे’ वर्तमान हिन्दी में सहज है।
- source_word: ἐν μιᾷ τῶν πόλεων
  choice: नगरों में से किसी एक में
  rationale: यह यूनानी वाक्यांश की अनिश्चित एकवचन संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τῶν ἀναβάσεων
  choice: चढ़ाइयों के
  rationale: ἀνάβασις का मूल अर्थ ‘चढ़ाई/ऊपर जाने का मार्ग’ है। मुख्य पाठ में शाब्दिक बहुवचन रखा गया है ताकि स्थलाकृतिक अर्थ को ‘दर्रों’ के रूप में निश्चित न कर दिया जाए।
