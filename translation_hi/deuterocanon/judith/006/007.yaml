  source_fidelity: 'The translation accurately represents the Greek sequence and syntax: Holofernes'' subordinates will take Achior back to the hill country and put him in one city associated with the ἀναβάσεις. ‘वापस ले जाकर’ suitably conveys the directional/return force of ἀνταποστήσουσιν, and the indefinite ‘किसी एक में’ preserves μία. The rendering ‘चढ़ाइयों के नगरों’ deliberately retains the source''s topographical ambiguity rather than prematurely fixing it as ‘mountain passes.’'
