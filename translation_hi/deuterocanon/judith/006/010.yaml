  text: καὶ προσέταξεν Ὁλοφέρνης τοῖς δούλοις αὐτοῦ, οἳ ἦσαν παρεστηκότες ἐν τῇ σκηνῇ αὐτοῦ, συλλαβεῖν τὸν Ἀχιὼρ καὶ ἀποκαταστῆσαι αὐτὸν εἰς Βετυλουὰ καὶ παραδοῦναι εἰς χεῖρας υἱῶν Ἰσραήλ.
