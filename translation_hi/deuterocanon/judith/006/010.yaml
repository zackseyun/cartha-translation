base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/010.yaml
  text: And Holofernes ordered his servants[a], who were standing by in his tent[b], to seize Achior and take him back to Bethyloua and hand him over into the hands of the sons of Israel.
translation:
  language: hi
  text: और होलोफेरनेस ने अपने उन दासों को, जो उसके तंबू में पास खड़े थे, आज्ञा दी कि वे अखियोर को पकड़ लें, उसे बेतुलूआ[a] वापस ले जाएँ और इस्राएल के पुत्रों[b] के हाथों में सौंप दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘बेतूलिया’; यह इस स्थान-नाम का अधिक पारंपरिक रूप है।
    reason: lexical_alternative
  - marker: b
    text: ‘इस्राएल के पुत्रों’ यूनानी अभिव्यक्ति का शाब्दिक अनुवाद है; यहाँ इसका संकेत सामूहिक रूप से इस्राएल के लोगों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक आदेश देने को व्यक्त करती है; ‘आज्ञा दी’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τοῖς δούλοις αὐτοῦ
  choice: अपने दासों को
  rationale: δοῦλοι अधीन और संभवतः बंधुआ घरेलू कर्मियों को सूचित करता है; ‘दास’ सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: παρεστηκότες
  choice: पास खड़े थे
  rationale: यह उपस्थित होकर सेवा के लिए तैयार खड़े रहने का भाव रखता है।
- source_word: ἐν τῇ σκηνῇ αὐτοῦ
  choice: उसके तंबू में
  rationale: सैनिक प्रसंग में σκηνή का अर्थ वास्तविक तंबू है, कोई उपासना-स्थल नहीं।
- source_word: συλλαβεῖν
  choice: पकड़ लें
  rationale: यह बलपूर्वक अभिरक्षा में लेने का भाव देता है, पर आधुनिक कानूनी ‘गिरफ़्तार करना’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἀποκαταστῆσαι αὐτὸν
  choice: उसे … वापस ले जाएँ
  rationale: प्रसंग में अखियोर को बेतुलूआ लौटा ले जाने की आज्ञा है; यह अनुवाद दिशा और वापसी दोनों को स्पष्ट करता है।
- source_word: Βετυλουὰ
  choice: बेतुलूआ
  rationale: यह स्वेटे के यूनानी स्थान-नाम का निकट देवनागरी लिप्यंतरण है; अधिक पारंपरिक रूप पादटिप्पणी में दिया गया है।
- source_word: παραδοῦναι εἰς χεῖρας
  choice: के हाथों में सौंप दें
  rationale: यह किसी को दूसरे के अधिकार में सौंपने के अर्थ और यूनानी के सजीव ‘हाथों में’ मुहावरे दोनों को सुरक्षित रखता है।
- source_word: υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी की स्पष्ट पुत्र-संबंधी और पुल्लिंग अभिव्यक्ति को बनाए रखा गया है; यह सामूहिक रूप से इस्राएल के लोगों को सूचित करती है।
theological_decisions:
- issue: δοῦλοι का सामाजिक अर्थ
  choice: दास
  alternative: सेवक
  rationale: होलोफेरनेस के अपने अधीनस्थ घरेलू जनों के इस प्रसंग में ‘दास’ मूल शब्द की बंधन और स्वामित्व-संबंधी शक्ति को अधिक स्पष्ट रखता है, यद्यपि ‘सेवक’ भी व्यापक अर्थ में संभव है।
- issue: υἱῶν Ἰσραήλ की लिंग-सूचक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल में υἱῶν (‘पुत्रों’) है। शाब्दिक संबंध को बनाए रखते हुए पादटिप्पणी स्पष्ट करती है कि वाक्यांश सामूहिक रूप से इस्राएल के लोगों के लिए प्रयुक्त है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘पकड़ लें’ और ‘सौंप दें’ सहज क्रियाएँ हैं, जबकि ‘दास’ और ‘इस्राएल के पुत्र’ मूल यूनानी की सामाजिक तथा संबंधपरक विशिष्टता को सुरक्षित रखते हैं।
