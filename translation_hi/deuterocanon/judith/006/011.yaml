translation:
  language: hi
  text: और उसके दासों ने उसे पकड़ लिया और छावनी से बाहर मैदान में ले गए। फिर वे मैदान के बीच से पहाड़ी प्रदेश में चढ़ गए और उन सोतों के पास पहुँचे जो बेतूलिया के नीचे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: सेवकों
  rationale: यहाँ शब्द होलोफेरनेस के अधीनस्थ जनों के लिए प्रयुक्त है। संदर्भ उनकी सेवा और अधीनता पर बल देता है, पर उनकी वैधानिक दास-स्थिति निश्चित नहीं करता; इसलिए स्वाभाविक हिंदी में ‘सेवकों’ चुना गया।
- source_word: συνέλαβον
  choice: पकड़ लिया
  rationale: क्रिया किसी व्यक्ति को बलपूर्वक थाम लेने का बोध देती है। ‘पकड़ लिया’ शारीरिक कार्रवाई व्यक्त करता है और ‘गिरफ्तार किया’ जैसा अनावश्यक कानूनी अर्थ नहीं जोड़ता।
- source_word: παρεμβολῆς
  choice: छावनी
  rationale: सैनिक प्रसंग में यह शब्द सेना के पड़ाव या कैंप को दर्शाता है; ‘छावनी’ सटीक और सहज हिंदी है।
- source_word: πεδίον / πεδινῆς
  choice: मैदान
  rationale: समतल भूभाग का अर्थ पहाड़ी प्रदेश के साथ स्पष्ट भौगोलिक विरोध बनाता है।
- source_word: ἀπῆραν
  choice: चढ़ गए
  rationale: क्रिया अकर्मक बहुवचन है; मैदान से पहाड़ी प्रदेश की ओर गति के संदर्भ में ‘चढ़ गए’ दिशा और व्याकरण दोनों को सुरक्षित रखता है, बिना ‘उसे’ को दोबारा कर्म बनाए।
- source_word: ἐκ μέσου τῆς πεδινῆς
  choice: मैदान के बीच से
  rationale: यह समतल प्रदेश के मध्य भाग से बाहर की ओर होने वाली गति को सरल, स्थानिक हिंदी में व्यक्त करता है।
- source_word: ὀρεινήν
  choice: पहाड़ी प्रदेश
  rationale: यह किसी एक पहाड़ के बजाय पहाड़ी या पर्वतीय भूभाग को सूचित करता है।
- source_word: παρεγένοντο
  choice: पहुँचे
  rationale: क्रिया किसी स्थान पर आ पहुँचने को दर्शाती है; हिंदी कथात्मक क्रम में ‘पहुँचे’ स्वाभाविक है।
- source_word: πηγάς
  choice: सोतों
  rationale: यह प्राकृतिक जलस्रोतों को दर्शाता है; ‘सोते’ भौगोलिक संदर्भ में संक्षिप्त और सटीक है।
- source_word: ὑποκάτω
  choice: नीचे
  rationale: यह बेतूलिया की तुलना में जलस्रोतों की निचली भौगोलिक स्थिति बताता है।
- source_word: Βετυλουά
  choice: बेतूलिया
  rationale: स्थान-नाम को प्रचलित हिंदी बाइबिलीय लिप्यंतरण के अनुकूल रूप में रखा गया है।
