- source_word: ἐπέστησαν αὐτῷ
  choice: उसके पास आ पहुँचे
  rationale: ἐφίστημι के यहाँ किसी के निकट आ जाने या उसके पास उपस्थित होने के व्यापक अर्थ को सुरक्षित रखता है; 'उसका सामना किया' अनावश्यक रूप से विरोध का भाव जोड़ सकता है।
- source_word: λύσαντες αὐτόν
