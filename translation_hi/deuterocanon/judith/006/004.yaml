base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/004.yaml
  text: For we will burn them up where they are[a], and their borders will be drenched with their blood, and their plains will be filled with their dead. The trace of their feet will not stand before us, but they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he said[b], ‘The words of his mouth will not prove empty.’
translation:
  language: hi
  text: क्योंकि हम उन्हें उन्हीं के बीच पूरी तरह जला डालेंगे, और उनकी सीमाएँ उनके लहू से सराबोर हो जाएँगी[a], और उनके मैदान उनके मृतकों से भर जाएँगे। उनके पैरों का निशान भी हमारे सामने टिक नहीं पाएगा[b], बल्कि वे पूरी तरह नष्ट हो जाएँगे—सारी पृथ्वी का स्वामी राजा नबूकदनेस्सर यह कहता है। क्योंकि उसने कहा, ‘उसके वचन निष्फल नहीं होंगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी सीमाएँ उनके लहू से मतवाली हो जाएँगी।” यूनानी में रक्तपात के लिए मतवालेपन का सजीव रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके पैरों का निशान हमारे विरुद्ध खड़ा नहीं रह पाएगा।” इसका आशय हो सकता है कि उनमें से कोई भी न तो बचा रहेगा, न आक्रमण का सामना कर पाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαύσομεν ... ἐν αὐτοῖς
  choice: हम उन्हें वहीं पूरी तरह जला डालेंगे जहाँ वे हैं
  rationale: κατακαίω के प्रबल विनाशकारी भाव को ‘पूरी तरह जला डालेंगे’ व्यक्त करता है। दोहराए गए सर्वनाम वाली कठिन यूनानी अभिव्यक्ति के स्थानवाचक भाव को स्वाभाविक हिन्दी में ‘वहीं...जहाँ वे हैं’ रखा गया है।
- source_word: τὰ ὅρια αὐτῶν
  choice: उनकी सीमाएँ
  rationale: ὅρια भौगोलिक सीमाओं अथवा सीमावर्ती भूभाग को सूचित करता है; ‘सीमाएँ’ मूल ठोस चित्र को बनाए रखता है।
- source_word: μεθυσθήσεται ἐν τῷ αἵματι αὐτῶν
  choice: उनके लहू से सराबोर हो जाएँगी
  rationale: क्रिया का शाब्दिक अर्थ ‘मतवाली हो जाएँगी’ है, पर भूमि के लिए यह रक्तपात का रूपक है। ‘लहू से सराबोर’ आधुनिक हिन्दी में उसका हिंसक और परिपूर्णता-सूचक भाव स्वाभाविक ढंग से देता है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: τὰ πεδία αὐτῶν
  choice: उनके मैदान
  rationale: πεδία खुले समतल भूभाग या मैदानों को दर्शाता है और यहाँ सैन्य-भौगोलिक संदर्भ के अनुकूल है।
- source_word: πληρωθήσεται νεκρῶν αὐτῶν
  choice: उनके मरे हुओं से भर जाएँगे
  rationale: νεκροί मृत व्यक्तियों या शवों को सूचित कर सकता है। ‘मरे हुओं’ मूल की अभिव्यक्ति को सीधे और गरिमापूर्ण ढंग से रखता है।
- source_word: οὐκ ἀντιστήσεται τὸ ἴχνος τῶν ποδῶν αὐτῶν κατὰ πρόσωπον ἡμῶν
  choice: उनके पैरों का निशान भी हमारे सामने टिक नहीं पाएगा
  rationale: ‘पैरों का निशान’ मूल के सजीव चित्र को बनाए रखता है। ‘भी’ वाक्य में निहित चरम बल को स्पष्ट करता है, जबकि ‘हमारे सामने टिक नहीं पाएगा’ ἀντιστήσεται और κατὰ πρόσωπον का स्वाभाविक हिन्दी रूप है।
- source_word: ἀπωλείᾳ ἀπολοῦνται
  choice: वे पूरी तरह नष्ट हो जाएँगे
  rationale: संज्ञा और समान-मूल क्रिया की यूनानी रचना अत्यंत जोरदार है; ‘पूरी तरह नष्ट’ उस बल को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: κύριος πάσης τῆς γῆς
  choice: सारी पृथ्वी का स्वामी
  rationale: यहाँ κύριος नबूकदनेस्सर की साम्राज्यवादी मानवीय उपाधि है। ‘स्वामी’ उसके दावे को व्यक्त करता है और परमेश्वर के लिए प्रयुक्त विशिष्ट ‘प्रभु’ उपाधि से अनावश्यक भ्रम नहीं पैदा करता।
- source_word: οὐ ματαιωθήσεται τὰ ῥήματα τῶν λόγων αὐτοῦ
  choice: उसके मुख से निकले वचन निष्फल नहीं होंगे
  rationale: यूनानी की पुनरुक्तिपूर्ण अभिव्यक्ति को सहज हिन्दी में वाणी-सूचक चित्र के साथ रखा गया है। ‘निष्फल नहीं होंगे’ ματαιόω का असफल या व्यर्थ सिद्ध न होने का भाव सुरक्षित रखता है।
theological_decisions:
- issue: नबूकदनेस्सर के लिए κύριος की उपाधि
  choice: सारी पृथ्वी का स्वामी
  alternative: सारी पृथ्वी का प्रभु
  rationale: संदर्भ में यह एक मानव राजा का दंभी सार्वभौमिक दावा है, कोई दिव्य उपाधि नहीं। ‘स्वामी’ यूनानी अर्थ को बनाए रखते हुए हिन्दी पाठक को परमेश्वर-सूचक ‘प्रभु’ समझने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य धमकी की कठोरता को नरम नहीं किया गया। मूल यूनानी के असामान्य ‘पैरों के निशान’ वाले चित्र और अंतिम कथन की तीसरे पुरुष की भाषा को बनाए रखा गया है।
