base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/017.yaml
  text: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
translation:
  language: hi
  text: तब उसने उत्तर में उन्हें होलोफेरनेस की परिषद् की बातें, वे सारी बातें जो उसने अश्शूर के पुत्रों[a] के शासकों के बीच कही थीं, और वे सभी डींग भरी बातें जो होलोफेरनेस ने इस्राएल के घराने के विरुद्ध[b] कही थीं, बताईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, अश्शूरी। यूनानी में शाब्दिक रूप से ‘अश्शूर के पुत्रों’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘विरुद्ध’ का अनुवाद ‘के विषय में’ भी हो सकता है; यहाँ प्रसंग होलोफेरनेस की शत्रुतापूर्ण और घमंडी वाणी का है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: तब उसने उत्तर में
  rationale: कृदन्त की उत्तरात्मक शक्ति को स्वाभाविक हिन्दी कथन में बनाए रखता है; ‘तब’ कथानक के प्रवाह को स्पष्ट करता है।
- source_word: ἀπήγγειλεν
  choice: बताईं
  rationale: यहाँ क्रिया किसी सभा से संबंधित बातों का विवरण पहुँचाने को व्यक्त करती है; ‘बताईं’ सामान्य आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘सूचित किया’ अनावश्यक रूप से औपचारिक होता।
- source_word: τὰ ῥήματα τῆς συνεδρείας Ὀλοφέρνου
  choice: होलोफेरनेस की परिषद् की बातें
  rationale: συνεδρεία को विचार-विमर्श करने वाली परिषद् के रूप में लिया गया है और ῥήματα की पुनरावृत्ति को ‘बातें’ से बनाए रखा गया है।
- source_word: ἐν μέσῳ τῶν ἀρχόντων
  choice: शासकों के बीच
  rationale: स्थानसूचक अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप है; इससे उनके समक्ष या उनकी उपस्थिति में बोलने का भाव भी बना रहता है।
- source_word: υἱῶν Ἀσσούρ
  choice: अश्शूर के पुत्रों
  rationale: यूनानी की शैलीगत जातीय अभिव्यक्ति को सामान्यीकृत करके केवल ‘अश्शूरियों’ में बदलने के बजाय यथावत रखा गया है।
- source_word: ἐμεγαλορρημόνησεν
  choice: डींग भरी बातें ... कही थीं
  rationale: दुर्लभ क्रिया में घमंडी और शेखीपूर्ण वाणी का भाव है; यह रूप पद में ‘बातों’ की पुनरावृत्ति भी बनाए रखता है।
- source_word: εἰς τὸν οἶκον Ἰσραήλ
  choice: इस्राएल के घराने के विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में εἰς की दिशात्मक शक्ति को ‘विरुद्ध’ स्वाभाविक और सटीक रूप से व्यक्त करता है।
theological_decisions:
- issue: υἱῶν Ἀσσούρ में जातीय designation
  choice: अश्शूर के पुत्रों
  alternative: अश्शूरी
  rationale: शाब्दिक शैली को सुरक्षित रखने से यूनानी पाठ की विशिष्ट जातीय अभिव्यक्ति बनी रहती है और उसे चुपचाप सामान्यीकृत नहीं किया जाता।
- issue: होलोफेरनेस की वाणी की दिशा
  choice: इस्राएल के घराने के विरुद्ध
  alternative: इस्राएल के घराने के विषय में
  rationale: निकटवर्ती घमंडी वाणी और व्यापक शत्रुतापूर्ण प्रसंग ‘विरुद्ध’ का समर्थन करते हैं, यद्यपि εἰς अपने आप में व्यापक अर्थ-क्षेत्र रखता है; इस विकल्प को पादटिप्पणी में पारदर्शी किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परिषद्’, ‘अश्शूर के पुत्रों’ और ‘इस्राएल के घराने’ जैसे पद स्रोत की औपचारिक तथा ऐतिहासिक शैली को बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनके विषय से मेल नहीं खाता था; हिन्दी मसौदे में [a] को ‘अश्शूर के पुत्रों’ और [b] को वाक्य के अंत में संबंधित अनुवाद-विकल्प के साथ रखा गया है।
