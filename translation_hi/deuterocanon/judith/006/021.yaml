base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/021.yaml
  text: And Uzziah took him from the assembly into his house[a], and made a feast for the elders[b]; and they called on the God of Israel for help all that night.
translation:
  language: hi
  text: और उज्जियाह उसे सभा[a] से अपने घर ले गया और बुज़ुर्गों के लिए भोज दिया[b]। उस पूरी रात वे सहायता के लिए इस्राएल के परमेश्वर को पुकारते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी ἐκκλησία का अर्थ एकत्र हुई सभा या समुदाय है, बाद के ईसाई अर्थ में “कलीसिया” नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “पीने की दावत दी” या “पेय का प्रबन्ध किया” है; यह वाक्यांश भोज की मेजबानी करने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: ले गया
  rationale: यहाँ क्रिया किसी व्यक्ति को अपने साथ एक स्थान से दूसरे स्थान तक ले जाने को व्यक्त करती है; हिन्दी में “ले गया” स्वाभाविक और सटीक है।
- source_word: ἐκ τῆς ἐκκλησίας
  choice: सभा से
  rationale: इस कथानक में ἐκκλησία एकत्र समुदाय की सभा है, बाद के मसीही अर्थ में “कलीसिया” नहीं।
- source_word: εἰς οἶκον ἑαυτοῦ
  choice: अपने घर
  rationale: यह उज्जियाह के निजी निवास को दर्शाता है; “अपने घर” सम्बन्ध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἐποίησεν πότον
  choice: भोज रखा
  rationale: शाब्दिक रूप से यह पीने की दावत कराने का मुहावरा है। “भोज रखा” आधुनिक हिन्दी में मेजबानी और सामूहिक दावत का भाव स्वाभाविक रूप से देता है।
- source_word: τοῖς πρεσβυτέροις
  choice: पुरनियों के लिए
  rationale: सन्दर्भ में ये केवल वृद्ध पुरुष नहीं, बल्कि समुदाय के मान्य अगुवे हैं; “पुरनिये” बाइबलीय हिन्दी में इस सामाजिक भूमिका को व्यक्त करता है।
- source_word: ἐπεκαλέσαντο
  choice: पुकारते रहे
  rationale: यह परमेश्वर से प्रार्थनापूर्वक सहायता माँगने को दर्शाता है। अवधि-सूचक वाक्यांश के साथ “पुकारते रहे” रात भर जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν θεὸν Ἰσραήλ
  choice: इस्राएल के परमेश्वर
  rationale: यह सम्बन्धवाचक उपाधि का सीधा और प्रचलित हिन्दी रूप है।
- source_word: εἰς βοήθειαν
  choice: सहायता के लिए
  rationale: यह दैवी सहायता पाने के उद्देश्य से की गई पुकार को व्यक्त करता है।
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: उस सारी रात
  rationale: यह समय की पूरी अवधि को दर्शाता है और यूनानी के “उस पूरी रात” के बल को बनाए रखता है।
