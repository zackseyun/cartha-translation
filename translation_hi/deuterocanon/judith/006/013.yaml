  text: And after going down below the mountain[a], they bound Achior and left him lying at the foot of the mountain, and they went away to their lord.
translation:
  language: hi
  text: और पहाड़ के नीचे उतरकर उन्होंने अखियोर को बाँध दिया और उसे पहाड़ की तलहटी में गिरा पड़ा छोड़ दिया[a]; फिर वे अपने स्वामी के पास चले गए।
  philosophy: optimal-equivalence
  footnotes:
