    text: या, “उसे पहाड़ की तलहटी में पड़ा हुआ छोड़ दिया।” यूनानी कृदंत यह संकेत देता है कि अखियोर को फेंक दिया गया था और उसे उसी अवस्था में छोड़ दिया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδύσαντες
  choice: नीचे उतरकर
  rationale: क्रियाविशेषणीय कृदंत नीचे की ओर जाने और उसके बाद हुई कार्रवाइयों का क्रम बताता है; यह हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὑποκάτω τοῦ ὄρους
  choice: पहाड़ के नीचे
  rationale: यह पहाड़ की अपेक्षा निचले स्थान को सूचित करता है; ‘पहाड़ के नीचे’ भूमिगत होने का अर्थ दिए बिना भौगोलिक संबंध बनाए रखता है।
- source_word: ἔδησαν
  choice: बाँध दिया
  rationale: δέω का सीधा अर्थ बाँधना है और यहाँ अखियोर को रोककर रखने की कार्रवाई व्यक्त होती है।
- source_word: ἀφῆκαν ἐρριμμένον
  choice: पटककर वहीं छोड़ दिया
  rationale: ἀφῆκαν छोड़ देने को और पूर्ण कर्मवाच्य कृदंत ἐρριμμένον पटक दिए जाने के फलस्वरूप बनी दशा को व्यक्त करता है; संयुक्त हिन्दी पदबंध हिंसक भाव और परिणामी स्थिति दोनों रखता है।
- source_word: ὑπὸ τὴν ῥίζαν τοῦ ὄρους
  choice: पहाड़ की तलहटी में
  rationale: ῥίζα का शाब्दिक अर्थ ‘जड़’ है, पर स्थल-वर्णन में यह पहाड़ के आधार या तलहटी को दर्शाता है।
- source_word: ἀπῴχοντο
  choice: चले गए
  rationale: यह उस स्थान से प्रस्थान करने को बताता है; ‘चले गए’ सहज आधुनिक हिन्दी है।
- source_word: πρὸς τὸν κύριον αὐτῶν
  choice: अपने स्वामी के पास
  rationale: κύριος यहाँ सैनिकों के मानवीय अधिकारी के लिए है; ‘स्वामी’ आदर और अधीनता का संबंध व्यक्त करता है, जबकि ‘के पास’ πρὸς की गंतव्य-दिशा देता है।
- source_word: τὸν Ἀχιὼρ
  choice: अखियोर
  rationale: यूनानी नाम Ἀχιώρ का देवनागरी में निकट और पठनीय लिप्यंतरण।
theological_decisions:
- issue: मानवीय अधिकारी के लिए κύριος का अनुवाद
  choice: अपने स्वामी के पास
  alternative: अपने मालिक के पास
  rationale: संदर्भ में यह परमेश्वर की उपाधि नहीं, बल्कि सैनिकों के मानवीय प्रधान को दर्शाता है। ‘स्वामी’ गरिमापूर्ण है और पदाधीन संबंध को बनाए रखता है; इसे ईश्वरीय नाम की तरह विशिष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, सहज और गरिमापूर्ण शैली। ‘पटककर वहीं छोड़ दिया’ यूनानी पूर्ण कर्मवाच्य कृदंत की हिंसक तथा परिणामी बारीकी को मुख्य पाठ में रखता है, और पादटिप्पणी अधिक रूप-समीपी विकल्प देती है।
