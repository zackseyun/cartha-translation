  text: Lord[a], God of heaven, look upon their arrogance, and have mercy on the humiliation of our people, and look upon the face of those sanctified to you on this day.
translation:
  language: hi
  text: “हे प्रभु, स्वर्ग के परमेश्वर, उनके घमंड पर दृष्टि कर; हमारे लोगों की दीन दशा पर दया कर; और जो तेरे लिए पवित्र किए गए हैं, उनके मुख पर आज दृष्टि कर।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो तेरे लिए समर्पित किए गए हैं” अथवा “तेरे पवित्र जन।” यूनानी में शाब्दिक अर्थ है, “जो तेरे लिए पवित्र किए गए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: ईश्वर को सीधे संबोधित करने वाला संबोधन-रूप; ‘हे प्रभु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: स्वर्ग के परमेश्वर
  rationale: सम्बन्धकारक संरचना और प्रचलित बाइबलीय उपाधि दोनों सुरक्षित रहते हैं।
- source_word: κάτιδε
  choice: दृष्टि कर
  rationale: प्रार्थना में ध्यानपूर्वक देखने और विचार करने की विनती को संक्षिप्त, गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τὰς ὑπερηφανίας αὐτῶν
  choice: उनके घमंड
  rationale: बहुवचन यूनानी रूप घमंडी अभिव्यक्तियों या कृत्यों को सूचित कर सकता है; हिन्दी में ‘घमंड’ सामूहिक अर्थ में स्वाभाविक है और अस्पष्टता बनाए रखता है।
- source_word: ἐλέησον
  choice: दया कर
  rationale: प्रार्थनात्मक प्रयोग में ἐλεέω का सीधा और प्रचलित हिन्दी रूप।
- source_word: τὴν ταπείνωσιν
  choice: अपमान
  rationale: यहाँ शत्रुओं के कारण झेली गई दीन दशा, नीचा किया जाना और अनादर अभिप्रेत हो सकते हैं; ‘अपमान’ प्रसंगगत पीड़ा को स्पष्ट रखता है।
- source_word: τοῦ γένους ἡμῶν
  choice: हमारी प्रजा
  rationale: γένος सामूहिक वंश-समुदाय को दर्शाता है; ‘प्रजा’ यहाँ इस्राएली जनसमुदाय के लिए स्वाभाविक है और आधुनिक ‘जाति’ की भ्रामक ध्वनि से बचता है।
- source_word: ἐπίβλεψον ἐπὶ τὸ πρόσωπον
  choice: मुख पर दृष्टि कर
  rationale: यूनानी की ठोस ‘मुख’ छवि और पहले अनुरोध के समानांतर देखने की क्रिया दोनों को बनाए रखता है।
- source_word: τῶν ἡγιασμένων σοι
  choice: जो तेरे लिए पवित्र किए गए हैं
  rationale: पूर्ण निष्क्रिय कृदन्त और σοι के समर्पण-संबंध को स्पष्ट रखता है, बिना इसे केवल अनुष्ठानिक अभिषेक या किसी विशेष वर्ग तक सीमित किए।
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: आज
  rationale: समय-सूचक वाक्यांश का आधुनिक, स्वाभाविक हिन्दी रूप; ‘इस दिन’ भी सम्भव है, पर ‘आज’ वही संकेत संक्षेप में देता है।
theological_decisions:
- issue: τῶν ἡγιασμένων σοι का अर्थ
  choice: जो तेरे लिए पवित्र किए गए हैं
  alternative: जो तेरे लिए समर्पित किए गए हैं; तेरे पवित्र जन
  rationale: पाठ लोगों को परमेश्वर के लिए पवित्र किए गए बताता है। चुना हुआ रूप पवित्रता और अलग किए जाने की धारणा को बनाए रखता है, पर उन्हें स्वर्गदूतों, पुरोहितों या किसी अन्य संकीर्ण वर्ग के रूप में निर्धारित नहीं करता।
- issue: ταπείνωσις की प्रसंगगत बारीकी
  choice: अपमान
  alternative: दीन दशा; दुर्दशा; नीचा किया जाना
  rationale: संज्ञा बाहरी दमन से उत्पन्न अपमान और निम्न दशा दोनों व्यक्त कर सकती है। ‘अपमान’ मुख्य प्रसंगगत भाव देता है, जबकि सम्भव व्यापक अर्थ को निर्णायक रूप से किसी निजी धार्मिक व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। ईश्वर के लिए निकट, पारंपरिक एकवचन ‘तेरे’ और आज्ञार्थक ‘कर’ प्रयुक्त हैं। यूनानी समानांतरता बनाए रखने के लिए ‘दृष्टि कर’ दोहराया गया है।
