base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/009.yaml
  text: And if you hope in your heart that they will not be taken[a], do not let your face fall. I have spoken[b], and none of my words will fail.
translation:
  language: hi
  text: और यदि तुम अपने मन में यह आशा रखते हो कि वे पकड़े नहीं जाएँगे[a], तो उदास मत हो। मैंने कह दिया है, और मेरी कही हुई कोई भी बात निष्फल नहीं होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे बंदी नहीं बनाए जाएँगे।” यहाँ यूनानी कर्मवाच्य का सैनिक अर्थ भी स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπερ
  choice: और यदि
  rationale: यह पूर्ववर्ती कथन से संबंध बनाए रखते हुए शर्त के हल्के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλπίζεις τῇ καρδίᾳ σου
  choice: तुम अपने मन में यह आशा रखते हो
  rationale: यूनानी में जारी आंतरिक आशा या भरोसे का भाव है। हिन्दी में ‘मन में’ वही आंतरिक अर्थ सहज रूप से देता है।
- source_word: οὐ λημφθήσονται
  choice: वे पकड़े नहीं जाएँगे[a]
  rationale: λαμβάνω का कर्मवाच्य यहाँ पकड़ लिए जाने का अर्थ देता है और प्रसंग में सैनिक रूप से बंदी बनाए जाने का अर्थ भी संभव है।
- source_word: μὴ συμπεσέτω σου τὸ πρόσωπον
  choice: तो उदास मत हो
  rationale: शाब्दिक रूप से चेहरा गिरने का यूनानी मुहावरा निराश या हताश होने को व्यक्त करता है; हिन्दी में शाब्दिक अनुवाद अस्वाभाविक होता।
- source_word: ἐλάλησα
  choice: मैंने कह दिया है
  rationale: यह पूर्ण और अधिकारपूर्ण घोषणा का स्वर बनाए रखता है तथा आगे आने वाले आश्वासन से स्वाभाविक रूप से जुड़ता है।
- source_word: οὐδὲν διαπεσεῖται τῶν ῥημάτων μου
  choice: मेरी कही हुई कोई भी बात निष्फल नहीं होगी
  rationale: διαπίπτω यहाँ कही हुई बात के विफल न होने या पूरा हुए बिना न रहने का भाव देता है; यह हिन्दी उस अर्थ को स्पष्ट रखते हुए भविष्यकाल बचाती है।
theological_decisions:
- issue: चेहरा गिरने के मुहावरे का अनुवाद
  choice: उदास मत हो
  alternative: तुम्हारा चेहरा न गिरे
  rationale: यह भावार्थ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है। शाब्दिक विकल्प यूनानी बिंब तो बचाता है, पर हिन्दी में अर्थ अस्पष्ट या कृत्रिम हो सकता है।
- issue: वचन के विफल न होने का अर्थ
  choice: मेरी कही हुई कोई भी बात निष्फल नहीं होगी
  alternative: मेरे वचनों में से कोई भी पूरा हुए बिना नहीं रहेगा
  rationale: चुना गया पाठ कथन की निश्चितता को सुरक्षित रखता है, पर उसे किसी विशिष्ट सैद्धान्तिक अर्थ से नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी के शाब्दिक मुख-मुद्रा वाले मुहावरे को स्वाभाविक हिन्दी भावार्थ में दिया गया है।
