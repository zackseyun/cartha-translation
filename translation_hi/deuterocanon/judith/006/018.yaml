  text: और लोग गिर पड़े और परमेश्वर की आराधना की, और ऊँचे स्वर से पुकार उठे और कहने लगे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσόντες
  choice: भूमि पर गिरकर
  rationale: अओरिस्ट कृदंत पहले हुई शारीरिक क्रिया को व्यक्त करता है। यह पदबंध मूल के गिरने के भाव और आराधना की विनीत मुद्रा—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ λαός
  choice: सब लोगों ने
  rationale: λαός सामूहिक रूप से उपस्थित लोगों को सूचित करता है। हिन्दी में बहुवचन क्रिया के साथ 'सब लोगों ने' प्रसंगानुकूल और सहज है।
- source_word: προσεκύνησαν
  choice: आराधना की
  rationale: τῷ θεῷ के साथ यह क्रिया यहाँ परमेश्वर के प्रति धार्मिक उपासना को स्पष्ट रूप से व्यक्त करती है; इसलिए केवल 'दण्डवत किया' की अपेक्षा 'आराधना की' अधिक सटीक है।
- source_word: τῷ θεῷ
  choice: परमेश्वर की
  rationale: हिन्दी बाइबलीय भाषा में θεός के लिए 'परमेश्वर' dignified और व्यापक रूप से समझा जाने वाला मानक रूप है। हिन्दी की संरचना के अनुसार संबंधकारक 'की' प्रयुक्त है।
- source_word: ἐβόησαν
  choice: ऊँचे स्वर से पुकारकर
  rationale: यह क्रिया तीव्र और श्रव्य पुकार को व्यक्त करती है। 'ऊँचे स्वर से' मूल में निहित तीव्रता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: λέγοντες
  choice: कहा
  rationale: वर्तमान कृदंत पुकार की विषय-वस्तु का परिचय देता है। हिन्दी में 'पुकारकर कहा' अगले पद से जुड़ने वाला स्वाभाविक कथात्मक रूप है।
