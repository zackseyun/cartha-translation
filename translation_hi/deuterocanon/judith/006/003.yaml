base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/003.yaml
  text: But we[a], his servants, will strike them down as one man, and they will not withstand the might of our horses.
translation:
  language: hi
  text: पर हम, उसके दास, उन पर ऐसे प्रहार करेंगे मानो वे एक ही मनुष्य हों[a], और वे हमारे घोड़ों के बल के सामने टिक नहीं पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक मनुष्य की तरह।” यूनानी मुहावरा या तो उनके विरुद्ध एकजुट कार्रवाई पर, या इस बात पर बल दे सकता है कि उन्हें मानो वे केवल एक मनुष्य हों, उतनी आसानी से परास्त कर दिया जाएगा।
    reason: शाब्दिक विकल्प और मुहावरे की वास्तविक अर्थगत अस्पष्टता स्पष्ट करना।
lexical_decisions:
- source_word: δοῦλοι
  choice: दास
  rationale: यह शब्द स्वामी के अधीन और उसके अधिकार में होने पर बल देता है। सैन्य निष्ठा के इस संदर्भ में ‘दास’ मूल की शक्ति को ‘सेवक’ से अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: πατάξομεν
  choice: प्रहार करेंगे
  rationale: क्रिया हिंसक अथवा सैन्य प्रहार को व्यक्त करती है। ‘प्रहार करेंगे’ परिणाम को अनावश्यक रूप से निश्चित किए बिना मूल क्रिया का सीधा अर्थ देता है।
- source_word: ὡς ἄνθρωπον ἕνα
  choice: मानो वे एक ही मनुष्य हों
  rationale: यह यूनानी मुहावरा शत्रुओं को एक व्यक्ति के समान समझकर उन पर सामूहिक प्रहार करने अथवा उन्हें बड़ी आसानी से परास्त करने—दोनों संभावित भावों को खुला रखता है।
- source_word: ὑποστήσονται
  choice: सामने टिक नहीं पाएँगे
  rationale: सैन्य संदर्भ में इसका अर्थ विरोधी शक्ति का सामना करना या उसके विरुद्ध डटे रहना है; यह हिंदी प्रयोग स्वाभाविक रूप से दोनों भाव समेटता है।
- source_word: κράτος
  choice: बल
  rationale: यहाँ शब्द युद्ध में प्रकट होने वाली प्रबल शक्ति को दर्शाता है। ‘बल’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: ἵππων
  choice: घोड़ों
  rationale: मूल पाठ सीधे ‘घोड़ों’ का उल्लेख करता है, न कि घुड़सवारों या अश्वसेना का; इसलिए उसी ठोस संज्ञा को रखा गया है।
theological_decisions:
- issue: δοῦλοι का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: वक्ता अपने स्वामी के प्रति पूर्ण अधीनता और स्वामित्व-संबंधी निष्ठा प्रकट करता है। ‘दास’ इस बल को बनाए रखता है, जबकि ‘सेवक’ इसे नरम कर सकता है; यहाँ किसी विशेष सांप्रदायिक अर्थ को नहीं जोड़ा गया है।
- issue: ὡς ἄνθρωπον ἕνα की अर्थगत अस्पष्टता
  choice: मुहावरे को ‘मानो वे एक ही मनुष्य हों’ के रूप में बनाए रखना
  alternative: हम सब एकजुट होकर उन पर प्रहार करेंगे / हम उन्हें एक अकेले मनुष्य जितनी आसानी से मार गिराएँगे
  rationale: यूनानी वाक्यांश एकजुट कार्रवाई, शत्रु को एक इकाई मानने, अथवा उसे आसानी से परास्त करने का भाव दे सकता है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता और पादटिप्पणी इस तनाव को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सैन्य संदर्भ के अनुरूप रखी गई है। ‘दास,’ ‘प्रहार,’ ‘बल’ और ‘टिक नहीं पाएँगे’ सामान्य पाठक के लिए बोधगम्य हैं; वाक्य की डींगपूर्ण स्वर-छटा भी बनी रहती है।
