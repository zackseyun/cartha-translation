  text: And he called together all the elders of the city, and all their young men and women ran together into the assembly, and they set Achior in the midst of all their people, and Uzziah asked him what had happened.
translation:
  language: hi
  text: और उसने नगर के सभी बुज़ुर्गों को बुलाकर इकट्ठा किया। उनके सभी युवक और स्त्रियाँ दौड़कर सभा में इकट्ठे हो गए। तब उन्होंने अखिओर को अपने सारे लोगों के बीच खड़ा किया, और ओज़ियास ने उससे पूछा कि क्या हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: बुलाकर इकट्ठा किया
  rationale: संयुक्त क्रिया में लोगों को बुलाने और एक साथ जुटाने, दोनों का भाव है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πρεσβυτέρους
  choice: पुरनियों
  rationale: यहाँ शब्द नगर के मान्य सामुदायिक अगुओं के लिए है, केवल अधिक आयु वाले पुरुषों के लिए नहीं। ‘पुरनियों’ से उसका संस्थागत भाव बना रहता है।
- source_word: συνέδραμον
  choice: दौड़कर … आ गए
  rationale: यूनानी क्रिया एक साथ दौड़कर या शीघ्रता से आने का भाव रखती है; अनुवाद उस तत्परता को सुरक्षित रखता है।
- source_word: πᾶς νεανίσκος … καὶ αἱ γυναῖκες
  choice: सभी युवक और स्त्रियाँ
  rationale: νεανίσκος व्याकरणतः एकवचन होते हुए यहाँ सामूहिक अर्थ में है। हिन्दी में बहुवचन ‘सभी युवक’ स्वाभाविक है, और स्त्रियों को समानांतर समूह के रूप में रखा गया है।
- source_word: ἐκκλησίαν
  choice: सभा
  rationale: यहाँ अर्थ नगर-समुदाय की एकत्र सभा है, बाद की कलीसियाई संस्था नहीं; ‘सभा’ स्पष्ट और अनैतिहासिक है।
- source_word: ἔστησαν
  choice: खड़ा किया
  rationale: सकर्मक प्रयोग का अर्थ किसी को एक स्थान पर खड़ा करना है; यह यूनानी संरचना और दृश्य दोनों को स्पष्ट रखता है।
- source_word: ἐν μέσῳ παντὸς τοῦ λαοῦ αὐτῶν
  choice: अपने सारे लोगों के बीच
  rationale: यह अकीओर को पूरे समुदाय के बीच खड़ा किए जाने पर बल देता है और हिन्दी में सहज है।
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: कथात्मक प्रसंग में यह सीधी पूछताछ को व्यक्त करने वाला स्वाभाविक हिन्दी शब्द है।
- source_word: τὸ συμβεβηκός
  choice: क्या हुआ था
  rationale: संज्ञा के रूप में प्रयुक्त पूर्ण कृदन्त घट चुकी घटना की ओर संकेत करता है; यह रूप उसके पूर्वकालिक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: Ἀχιὼρ / Ὀζείας
  choice: अकीओर / ओज़ियास
  rationale: नामों को उपलब्ध यूनानी रूपों के निकट देवनागरी में लिखा गया है, न कि अंग्रेज़ी वर्तनी से यांत्रिक रूप से लिया गया है।
