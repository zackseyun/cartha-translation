base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/006.yaml
  text: For their mighty one did not fall by the hands of young men[a], nor did sons of Titans strike him, nor did tall giants set upon him; but Judith daughter of Merari disabled him with the beauty of her face.
translation:
  language: hi
  text: क्योंकि उनका वीर न तो युवकों के हाथों गिरा, न टाइटनों के पुत्रों ने उस पर प्रहार किया, और न ऊँचे कद के दैत्य उस पर टूट पड़े; बल्कि मरारी की बेटी यूदीत ने अपने चेहरे की सुंदरता से उसे शक्तिहीन कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसे पंगु कर दिया।” यूनानी क्रिया का अर्थ किसी को शाब्दिक या लाक्षणिक रूप से पंगु, असमर्थ अथवा शक्तिहीन कर देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δυνατὸς αὐτῶν
  choice: उनका वीर
  rationale: δυνατός यहाँ संज्ञा के रूप में उनके शक्तिशाली पुरुष या योद्धा के लिए प्रयुक्त है। ‘उनका वीर’ काव्यात्मक गरिमा और संदर्भगत बल बनाए रखता है, पर किसी विशिष्ट सैनिक पद को नहीं जोड़ता।
- source_word: νεανίσκων
  choice: जवानों
  rationale: यह शब्द युवा पुरुषों को सूचित करता है। ‘जवानों’ आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाले अतिमानवी विरोधियों के साथ अलंकारिक तुलना बनाए रखता है।
- source_word: υἱοὶ Τιτάνων
  choice: टाइटनों के पुत्रों
  rationale: मूल यूनानी की मिथकीय छवि को सामान्य ‘बलवान पुरुषों’ में बदलने के बजाय सीधे सुरक्षित रखा गया है।
- source_word: ἐπάταξαν
  choice: मारा
  rationale: क्रिया का मूल अर्थ प्रहार करना या मारना है। ‘मारा’ स्पष्ट और संक्षिप्त है तथा मूल से आगे बढ़कर ‘मार गिराया’ जैसा परिणाम नहीं जोड़ता।
- source_word: ὑψηλοὶ γίγαντες
  choice: ऊँचे कद के दैत्य
  rationale: ὑψηλοί की ऊँचाई संबंधी ठोस छवि और γίγαντες की मिथकीय भव्यता दोनों को बनाए रखा गया है।
- source_word: ἐπέθεντο αὐτῷ
  choice: उस पर टूट पड़े
  rationale: यह हिन्दी मुहावरा किसी पर चढ़ आने या आक्रमण करने के यूनानी भाव को स्वाभाविक और सशक्त ढंग से व्यक्त करता है।
- source_word: παρέλυσεν
  choice: शक्तिहीन कर दिया
  rationale: क्रिया का अर्थ पंगु, असमर्थ या निष्प्रभावी कर देना हो सकता है। संदर्भ में यह यूदीत द्वारा उसे विवश और असहाय कर देने को व्यक्त करता है, बिना चिकित्सकीय लकवे को अनिवार्य बनाए।
- source_word: ἐν κάλλει προσώπου αὐτῆς
  choice: अपने मुख की सुंदरता से
  rationale: πρόσωπον की ठोस ‘मुख’ छवि को सुरक्षित रखते हुए साधनवाचक यूनानी वाक्यांश का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: θυγάτηρ Μεραρεί
  choice: मरारी की बेटी
  rationale: वंश-सूचक पद का सीधा और आधुनिक हिन्दी में स्वाभाविक रूप।
theological_decisions:
- issue: υἱοὶ Τιτάνων और γίγαντες की मिथकीय भाषा
  choice: ‘टाइटनों के पुत्र’ और ‘ऊँचे कद के दैत्य’ के रूप में मिथकीय शब्दावली को प्रत्यक्ष रखा गया।
  alternative: इन्हें सामान्य बनाकर ‘महाबली’ या ‘वीर पुरुष’ कहना।
  rationale: यूनानी पाठ अतिमानवी शक्ति वाली छवियों से जानबूझकर यूदीत की विजय का विरोधाभास तीव्र करता है; सामान्य शब्द इस काव्यात्मक प्रभाव को घटा देते।
- issue: παρέλυσεν का आशय
  choice: ‘शक्तिहीन कर दिया’
  alternative: ‘पंगु कर दिया’ या ‘नष्ट कर दिया’
  rationale: यह चयन शारीरिक लकवे को निश्चित किए बिना असहाय या निष्प्रभावी किए जाने का रूपकात्मक बल बनाए रखता है; साथ ही ‘नष्ट कर दिया’ जैसा अधिक परिणामपरक अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर गीतात्मक प्रसंग के अनुरूप गरिमामय और सशक्त रखी गई है। ‘वीर’, ‘टाइटनों के पुत्र’ और ‘ऊँचे कद के दैत्य’ मूल की उन्नत काव्यात्मक शैली बनाए रखते हैं; ‘उस पर टूट पड़े’ सहज हिन्दी में आक्रमण का तीखा भाव देता है।
