  alternative: प्रभु सर्वशक्तिमान
  rationale: दोनों यूनानी उपाधियों को सुरक्षित रखते हुए यह क्रम आधुनिक हिन्दी में एक संयुक्त दिव्य संबोधन के रूप में सहज है और परमेश्वर की सार्वभौम सामर्थ्य पर बल बनाए रखता है।
- issue: ἐν χειρὶ θηλείας में माध्यम/कर्तृत्व
  choice: एक स्त्री के हाथ से
  alternative: एक स्त्री के द्वारा
