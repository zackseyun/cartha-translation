- source_word: ἠθέτησεν
  choice: निष्फल कर दिया
  rationale: ἀθετέω यहाँ शत्रुओं की शक्ति और प्रयत्न को प्रभावहीन कर देने के अर्थ में है; यह विकल्प विजय के प्रसंग में अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह पूर्व प्रसंग में उल्लिखित शत्रुओं की ओर संकेत करने वाला सीधा बहुवचन कर्म है।
- source_word: ἐν χειρὶ
  choice: के हाथ से
  rationale: यह बाइबलीय मुहावरा किसी व्यक्ति को माध्यम या कर्तृत्व-साधन के रूप में प्रस्तुत करता है; हिन्दी में भी यह स्वाभाविक और बोधगम्य है।
- source_word: θηλείας
  choice: एक स्त्री
  rationale: शाब्दिक रूप से स्त्रीलिंग प्राणी का बोध कराने वाला यह शब्द इस मानवीय कथानक में स्वाभाविक रूप से ‘एक स्त्री’ है और अपेक्षाओं के उलटाव को बनाए रखता है।
