lexical_decisions:
- source_word: Κύριος
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त मानक दिव्य उपाधि है और κύριος का स्वाभाविक हिन्दी रूप है।
- source_word: Παντοκράτωρ
  choice: सर्वशक्तिमान
