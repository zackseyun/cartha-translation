  text: Her sandal captured his eye[a], and her beauty took his soul captive; the sword passed through his neck.
translation:
  language: hi
  text: यूदित की पादुका ने होलोफेर्नेस की आँख हर ली, और उसके सौन्दर्य ने उसके प्राणों को बंदी बना लिया; तलवार[a] उसकी गर्दन के आर-पार निकल गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कटार”; यूनानी शब्द ἀκινάκης पूर्वी प्रकार की छोटी तलवार या कटार को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σανδάλιον
  choice: पादुका
  rationale: यह शब्द सामान्य जूते के बजाय सैंडल-जैसी पादुका को सूचित करता है। ‘पादुका’ ठोस विवरण और काव्यात्मक गरिमा दोनों बनाए रखता है।
- source_word: ἥρπασε
  choice: हर ली
  rationale: मूल क्रिया का अर्थ बलपूर्वक छीनना या पकड़ लेना है। ‘आँख हर ली’ हिन्दी में काव्यात्मक रहते हुए उसके प्रबल आकर्षण और विजय-बिम्ब को व्यक्त करता है।
- source_word: ὀφθαλμὸν
  choice: आँख
  rationale: यूनानी में एकवचन और ठोस शब्द ‘आँख’ है; इसे ‘ध्यान’ या ‘दृष्टि’ बनाकर भावार्थ में नहीं बदला गया।
- source_word: κάλλος
  choice: सौन्दर्य
  rationale: यह शारीरिक रूप-लावण्य के लिए सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी पर्याय है।
- source_word: ᾐχμαλώτισεν
  choice: बंदी बना लिया
  rationale: क्रिया युद्ध में किसी को बंदी बनाने का बिम्ब रखती है। यह चयन विजय-गीत की सैनिक रूपक-भाषा को सुरक्षित रखता है।
- source_word: ψυχὴν
  choice: प्राणों
  rationale: यहाँ शब्द व्यक्ति के भीतरी जीवन या समूचे जीवित अस्तित्व को दर्शाता है। हिन्दी का रूढ़ बहुवचन ‘प्राणों’ काव्यात्मक है और अनावश्यक रूप से दार्शनिक अर्थ थोपने से बचता है।
- source_word: ἀκινάκης
  choice: तलवार
  rationale: यह पूर्वी प्रकार की छोटी तलवार या कटार का नाम है। मुख्य पाठ में सुबोध ‘तलवार’ रखा गया है और अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: διῆλθεν
  choice: आर-पार निकल गई
  rationale: यह मूल के ‘होकर निकलना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और केवल ‘बेध दिया’ कहने की अपेक्षा गति के बिम्ब को बनाए रखता है।
- source_word: τράχηλον
  choice: गर्दन
  rationale: यह यूनानी संज्ञा का सामान्य और सीधा हिन्दी पर्याय है; ‘गला’ की अपेक्षा शारीरिक स्थान को अधिक ठीक ढंग से दर्शाता है।
theological_decisions:
- issue: विजय-गीत में आकर्षण को व्यक्त करने वाली दो बंदी बनाने की उपमाएँ
  choice: दोनों खंडों में विजय और बंदी बनाए जाने का बिम्ब बनाए रखा गया—‘आँख हर ली’ और ‘प्राणों को बंदी बना लिया’।
  alternative: इसे ‘उसका ध्यान खींच लिया’ और ‘उसका मन जीत लिया’ जैसी सहज आकर्षण-भाषा में कहा जा सकता था।
  rationale: मूल कविता होलोफेरनेस के वध से पहले ही उसके पराजित हो जाने को सैनिक विजय की भाषा में चित्रित करती है। अधिक रोमानी भाषा इस जानबूझकर रखे गए तनाव को कम कर देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘पादुका’, ‘आँख हर ली’ और ‘प्राणों को बंदी’ जैसे प्रयोग गीत की समानांतर संरचना तथा विजय-बिम्ब को सँभालते हैं। हिन्दी में स्त्री और पुरुष दोनों के लिए ‘उसकी/उसके’ आने से सर्वनामगत अस्पष्टता बनी रहती है; मूल में भी संदर्भ के सहारे ही अधिकार-संबंध स्पष्ट है, इसलिए नाम जोड़कर पाठ को अधिक स्पष्ट नहीं किया गया।
