base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/016.yaml
  text: For every sacrifice for a pleasing aroma is a small thing[a], and all fat for your whole burnt offering is very little; but the one who fears the Lord is great forever.
translation:
  language: hi
  text: क्योंकि सुखद सुगन्ध के लिए चढ़ाया गया हर बलिदान छोटी-सी बात है, और तेरे लिए पूर्ण होमबलि में चढ़ाई गई सारी चरबी अत्यन्त थोड़ी है; परन्तु जो प्रभु का भय मानता है, वह सदा के लिए महान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमेशा”; यूनानी पद निरन्तर अवधि या स्थायी बने रहने—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μικρὸν
  choice: छोटी-सी बात
  rationale: यह विधेय विशेषण बलिदान के तुलनात्मक मूल्य को बताता है। ‘छोटी-सी बात’ इस तुलना को स्वाभाविक हिन्दी में रखता है, बिना बलिदान को तिरस्कारपूर्ण ढंग से ‘तुच्छ’ कहे।
- source_word: θυσία
  choice: बलिदान
  rationale: यह उपासना-संबंधी मानक शब्द है और यूनानी संज्ञा का सीधा, परिचित हिन्दी रूप है।
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: सुखद सुगन्ध के लिए
  rationale: यह बलिदान की स्वीकार्यता से जुड़ी सुगन्ध की उपासना-संबंधी छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐλάχιστον
  choice: अत्यन्त थोड़ी
  rationale: यह अतिशयोक्तिपूर्ण रूप पहले कथन को तीव्र करता है; स्त्रीलिंग ‘चरबी’ के साथ ‘अत्यन्त थोड़ी’ स्वाभाविक है।
- source_word: στέαρ
  choice: चरबी
  rationale: सन्दर्भ में बलिदान पर चढ़ाई जानेवाली चरबी अभिप्रेत है; ‘चरबी’ इसका सीधा और सामान्य हिन्दी रूप है।
- source_word: ὁλοκαύτωμά
  choice: पूर्ण होमबलि
  rationale: यह ऐसे बलिदान को दर्शाता है जो आग में पूरी तरह चढ़ाया जाता है। ‘पूर्ण होमबलि’ सामान्य ‘होमबलि’ से इस विशिष्टता को अधिक स्पष्ट रखता है।
- source_word: σοι
  choice: तेरे लिए
  rationale: एकवचन सम्बोधन में परमेश्वर को दिए जाने का दातृकारक सम्बन्ध स्पष्ट करता है और वाक्य में सीधी प्रार्थनात्मक वाणी बनाए रखता है।
- source_word: ὁ δὲ φοβούμενος τὸν κύριον
  choice: परन्तु प्रभु का भय माननेवाला
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त एक सामान्य सत्य व्यक्त करता है; यह रूप शाब्दिक भी है और स्वाभाविक भी।
- source_word: μέγας
  choice: महान है
  rationale: यह बलिदानों की लघुता के साथ मूल पाठ का सीधा अलंकारिक विरोध बनाए रखता है।
- source_word: διὰ παντός
  choice: सर्वदा
  rationale: यह निरन्तरता और स्थायी अवधि, दोनों की सम्भावना को संक्षेप में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बलिदान और प्रभु के भय का तुलनात्मक मूल्य
  choice: पद बलिदानों को तुलनात्मक रूप से छोटा और प्रभु का भय माननेवाले को महान बताता है।
  alternative: इसे इस आशय में समझा जा सकता है कि श्रद्धा के बिना बलिदान अपर्याप्त हैं, न कि वे अपने आप में छोटे हैं।
  rationale: यूनानी पाठ बलिदान की लघुता और प्रभु का भय माननेवाले की महानता का सीधा विरोध करता है। अनुवाद इस तनाव को बनाए रखता है और बलिदान-विरोधी निष्कर्ष नहीं जोड़ता।
- issue: κύριον का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस यूनानी यहूदी धार्मिक सन्दर्भ में यह परमेश्वर के लिए आदरपूर्ण मानक उपाधि है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, साधारण पाठकों के लिए सुबोध शैली रखी गई है। परमेश्वर को सीधे सम्बोधन के कारण ‘तेरे लिए’ रखा गया है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे वह सम्बन्धित है।
