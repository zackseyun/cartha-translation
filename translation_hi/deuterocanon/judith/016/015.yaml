  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। परमेश्वर के सीधे संबोधन में ‘तू/तेरा’ निकटता और एकवचन को स्पष्ट करता है। ‘जलराशियों’ और ‘मोम के समान’ से काव्यात्मक ब्रह्मांडीय बिंब सुरक्षित रहते हैं; दुर्लभ धार्मिक पारिभाषिक शब्दावली से बचा गया है।
