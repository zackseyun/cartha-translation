  yaml_path: translation/deuterocanon/judith/016/015.yaml
  text: For mountains will be shaken from their foundations with the waters[a], and rocks will melt like wax before your face; yet to those who fear you, you are gracious.
translation:
  language: hi
  text: क्योंकि पहाड़ अपनी नींवों से जलराशियों समेत हिलाए जाएँगे, और चट्टानें तेरे मुख के सामने[a] मोम के समान पिघल जाएँगी; फिर भी जो तेरा भय मानते हैं, उनके प्रति तू कृपालु रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा अधिक मुहावरेदार रूप में, “तेरी उपस्थिति से।” यूनानी में शाब्दिक अर्थ “तेरे मुख के सामने” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄρη
  choice: पहाड़
  rationale: यह भौतिक पर्वतों के लिए सामान्य शब्द है और पद की ब्रह्मांडीय काव्यात्मक छवि को बनाए रखता है।
- source_word: ἐκ θεμελίων
  choice: अपनी नींवों से
  rationale: वाक्यांश पहाड़ों के आधार से होने वाली उथल-पुथल व्यक्त करता है; ‘अपनी’ हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: σὺν ὕδασιν
  choice: जलराशियों समेत
  rationale: σύν साथ या सहभागिता का भाव देता है। ‘जलराशियाँ’ बहुवचन और मौलिक तत्त्व के काव्यात्मक बिंब दोनों को व्यक्त करता है।
- source_word: σαλευθήσεται
  choice: हिलाए जाएँगे
  rationale: भविष्यत् कर्मवाच्य का बल सुरक्षित रखते हुए यह प्रबल कम्पन या विचलन को व्यक्त करता है।
- source_word: πέτραι
  choice: चट्टानें
  rationale: पहाड़ों के समानांतर यहाँ बड़े पथरीले खंड अभिप्रेत हैं, इसलिए ‘पत्थर’ की अपेक्षा ‘चट्टानें’ अधिक उपयुक्त है।
- source_word: ἀπὸ προσώπου σου
  choice: तेरे मुख के सामने
  rationale: यह यूनानी के ठोस, मानवरूपी ‘तेरे मुख’ को बनाए रखता है; ‘तेरी उपस्थिति से’ अधिक मुहावरेदार विकल्प है और पादटिप्पणी में दिया गया है।
- source_word: ὡς κηρὸς
  choice: मोम के समान
  rationale: यह उपमा को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: τακήσονται
  choice: पिघल जाएँगी
  rationale: क्रिया का अर्थ गलना या द्रवित होना है; यह चट्टानों और मोम के बिंब को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔτι δὲ
  choice: फिर भी
  rationale: यह ब्रह्मांडीय भयावहता से परमेश्वर की कृपा की ओर होने वाले विरोधात्मक मोड़ को स्पष्ट करता है।
- source_word: τοῖς φοβουμένοις σε
  choice: जो तेरा भय मानते हैं
  rationale: ‘भय मानना’ श्रद्धापूर्ण भय और विस्मय की बाइबिलीय अर्थच्छटा को सुरक्षित रखता है, उसे केवल सम्मान तक सीमित नहीं करता।
- source_word: εὐιλατεύεις
  choice: तू कृपालु रहता है
  rationale: यह दुर्लभ क्रिया अनुकूल और दयापूर्ण भाव व्यक्त करती है। ‘कृपालु रहता है’ हिन्दी में सहज है और अर्थ को केवल दया दिखाने तक सीमित नहीं करता।
theological_decisions:
- issue: τοῖς φοβουμένοις σε में भय और श्रद्धा का संबंध
  choice: जो तेरा भय मानते हैं
  alternative: जो तेरी श्रद्धा करते हैं
  rationale: मुख्य पाठ ‘भय’ को बनाए रखता है ताकि परमेश्वर के सामने भय, विस्मय और श्रद्धा की संयुक्त बाइबिलीय अर्थच्छटा अनिर्णीत बनी रहे।
- issue: ἀπὸ προσώπου σου का मानवरूपी वर्णन
  choice: तेरे मुख के सामने
  alternative: तेरी उपस्थिति से
  rationale: मुख्य पाठ यूनानी के ठोस ‘मुख’ को सुरक्षित रखता है और उसे चुपचाप अमूर्त ‘उपस्थिति’ में नहीं बदलता; मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- issue: εὐιλατεύεις में ईश्वरीय अनुकूलता
  choice: उनके प्रति तू कृपालु रहता है
  alternative: तू उन पर दया करता है
  rationale: ‘कृपालु’ अनुकूल और दयापूर्ण भाव की व्यापकता को बनाए रखता है तथा दुर्लभ यूनानी क्रिया को किसी संकीर्ण प्रायश्चित्त-संबंधी तकनीकी अर्थ में नहीं बाँधता।
