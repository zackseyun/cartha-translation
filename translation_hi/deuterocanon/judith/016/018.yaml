  text: And when they came to Jerusalem, they worshiped God; and when the people had been purified, they offered up their burnt offerings and their freewill offerings and their gifts.
translation:
  language: hi
  text: जब वे यरूशलेम पहुँचे, तब उन्होंने परमेश्वर की आराधना की; और जब लोगों को शुद्ध किया गया, तब उन्होंने अपनी होमबलियाँ, स्वेच्छा-बलियाँ और भेंटें चढ़ाईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἦλθον
  choice: जब वे ... पहुँचे
  rationale: यह पद कथा की अगली घटना आरंभ करता है। हिन्दी में ‘जब वे ... पहुँचे’ स्वाभाविक रूप से काल-संबंध व्यक्त करता है; δέ को अलग संयोजक से व्यक्त करना आवश्यक नहीं है।
- source_word: προσεκύνησαν
  choice: उन्होंने ... आराधना की
  rationale: τῷ θεῷ के साथ और यरूशलेम के उपासना-संदर्भ में यह क्रिया केवल झुकने की शारीरिक मुद्रा नहीं, बल्कि परमेश्वर की आराधना को सूचित करती है।
- source_word: τῷ θεῷ
  choice: परमेश्वर की
  rationale: हिन्दी में ‘आराधना करना’ के साथ संबंधकारक ‘की’ स्वाभाविक है और यूनानी के अप्रत्यक्ष कर्म का अर्थ ठीक से देता है।
- source_word: ἡνίκα
  choice: जब
  rationale: यह कालवाचक संयोजक है; सरल ‘जब’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐκαθαρίσθη
  choice: शुद्ध हो गए
  rationale: निष्क्रिय क्रिया लोगों के शुद्ध किए जाने अथवा शुद्धता की अवस्था में आने को व्यक्त करती है। बलिदानों के निकट संदर्भ में ‘शुद्ध’ अनुष्ठानिक अर्थ के लिए उपयुक्त है, पर अनुवाद स्वयं प्रक्रिया का अनावश्यक विस्तार नहीं करता।
- source_word: ὁ λαός
  choice: लोग
  rationale: यह यहाँ एकत्र समुदाय के लिए है। ‘लोग’ सहज हिन्दी है और आधुनिक राष्ट्र-राज्य का अर्थ नहीं जोड़ता।
- source_word: ἀνήνεγκαν
  choice: चढ़ाईं
  rationale: बलिदान और भेंट के संदर्भ में ‘चढ़ाना’ ἀναφέρω के उपासना-संबंधी अर्थ का स्वाभाविक हिन्दी समतुल्य है।
- source_word: τὰ ὁλοκαυτώματα αὐτῶν
  choice: अपने होमबलि
  rationale: ‘होमबलि’ उस बलिदान को दर्शाता है जो पूर्णतः जलाया जाता था और हिन्दी बाइबलीय प्रयोग में सुबोध पारिभाषिक शब्द है; ‘अपने’ αὐτῶν को सुरक्षित रखता है।
- source_word: τὰ ἑκούσια αὐτῶν
  choice: स्वेच्छा-बलि
  rationale: ἑκούσια स्वेच्छा से दिए गए बलिदानों को दर्शाता है। ‘स्वेच्छा-बलि’ इसे होमबलि और सामान्य भेंटों से अलग रखता है।
- source_word: τὰ δόματα
  choice: भेंटें
  rationale: δόματα व्यापक रूप से दी गई वस्तुओं या उपहारों को दर्शाता है। ‘भेंटें’ धार्मिक संदर्भ में स्वाभाविक है और इसे पहले के दो बलिदान-वर्गों में नहीं मिलाता।
theological_decisions:
- issue: ἐκαθαρίσθη ὁ λαός में शुद्धता का स्वरूप
  choice: बलिदान चढ़ाने से पहले लोगों की अनुष्ठानिक शुद्धता
  alternative: लोगों की सामान्य नैतिक शुद्धि
  rationale: यरूशलेम में आराधना और उसके तुरंत बाद होमबलि, स्वेच्छा-बलि और भेंटें चढ़ाने का संदर्भ अनुष्ठानिक शुद्धता की ओर प्रबल संकेत करता है। फिर भी मुख्य पाठ केवल ‘शुद्ध हो गए’ कहता है, इसलिए वह मूल से अधिक स्पष्ट व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। बलिदान-संबंधी विशिष्ट पदों के लिए प्रचलित ‘होमबलि’, ‘स्वेच्छा-बलि’ और ‘भेंटें’ का प्रयोग कर तीनों यूनानी श्रेणियों का भेद बनाए रखा गया है।
