  yaml_path: translation/deuterocanon/judith/016/024.yaml
  text: And the house of Israel mourned for her seven days. And before she died, she divided her possessions among all who were nearest of kin to Manasseh her husband and to those nearest of kin of her family.
translation:
  language: hi
  text: इस्राएल के घराने ने सात दिन तक उसका शोक मनाया। मरने से पहले उसने अपनी संपत्ति अपने पति मनश्शे के सभी निकटतम संबंधियों और अपने कुल के निकटतम संबंधियों में बाँट दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्यांश कुछ संक्षिप्त है। इसका अनुवाद इस प्रकार भी किया जा सकता है: “उन सभी लोगों में जो उसके पति मनश्शे के सबसे निकट संबंधी थे, और उन लोगों में जो उसके अपने कुल के सबसे निकट संबंधी थे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπένθησεν αὐτήν
  choice: उसका शोक मनाया
  rationale: यह क्रिया मृत व्यक्ति के लिए शोक मनाने को व्यक्त करती है। हिंदी में ‘उसका शोक मनाया’ स्वाभाविक है और यूनानी कर्मवाचक संबंध को बनाए रखता है।
- source_word: οἶκος Ἰσραήλ
  choice: इस्राएल का घराना
  rationale: यह सामूहिक बाइबलीय मुहावरे को औपचारिक रूप से सुरक्षित रखता है; आशय समस्त इस्राएली समुदाय से है।
- source_word: ἡμέρας ἑπτά
  choice: सात दिन तक
  rationale: अवधि को आधुनिक हिंदी में सहज ढंग से व्यक्त करता है।
- source_word: διεῖλεν
  choice: बाँट दी
  rationale: संपत्ति के विभाजन अथवा वितरण के संदर्भ में यह निकट और स्वाभाविक हिंदी है।
- source_word: τὰ ὑπάρχοντα αὐτῆς
  choice: अपनी संपत्ति
  rationale: यह उसकी समस्त मिल्कियत और वस्तुओं के लिए प्रयुक्त व्यापक अभिव्यक्ति है।
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτήν
  choice: मरने से पहले
  rationale: πρό के साथ प्रयुक्त आर्टिक्युलर इनफिनिटिव पूर्वकालिक संबंध बताता है; यह उसका स्पष्ट और मुहावरेदार हिंदी रूप है।
- source_word: πᾶσι τοῖς ἔγγιστα
  choice: सभी निकटतम संबंधियों
  rationale: उत्तराधिकार के प्रसंग में substantival ἔγγιστα निकटतम संबंध रखने वाले लोगों को सूचित करता है।
- source_word: Μανασσῆ τοῦ ἀνδρὸς αὐτῆς
  choice: अपने पति मनश्शे
  rationale: संबंधकारक पदबंध मनश्शे की पहचान उसके पति के रूप में कराता है; हिंदी में यह क्रम स्पष्ट और स्वाभाविक है।
- source_word: τοῦ γένους αὐτῆς
  choice: अपने कुल
  rationale: γένος यहाँ परिवार, वंश अथवा कुल का अर्थ दे सकता है। ‘कुल’ निकट संबंध और वंशगत समूह दोनों को संक्षेप में व्यक्त करता है।
