  yaml_path: translation/deuterocanon/judith/016/004.yaml
  text: He said he would set my mountains on fire[a], and kill my young men with the sword, and throw my nursing children to the ground, and give my infants as plunder, and despoil my virgins.
translation:
  language: hi
  text: उसने कहा कि वह मेरे पहाड़ों को आग लगा देगा, मेरे युवकों को तलवार से मार डालेगा, मेरे दूध-पीते बच्चों को भूमि पर डाल देगा, मेरे नन्हे बच्चों को लूट का माल बना देगा, और मेरी कुँवारियों को लूट लेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अर्थ यह भी हो सकता है: “मेरी कुँवारियों के साथ यौन हिंसा करेगा।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “लूटना” या “छीन लेना” है, पर युद्धकालीन हिंसा के इस संदर्भ में इसमें यौन हिंसा का संकेत हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν + infinitives
  choice: उसने कहा कि वह ... देगा
  rationale: यूनानी में εἶπεν के बाद आए infinitives शत्रु की घोषित मंशा बताते हैं; हिंदी में ‘कहा कि वह...’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐμπρήσειν τὰ ὅρη μου
  choice: मेरे पहाड़ों को आग लगा देगा
  rationale: ἐμπρήσειν का अर्थ आग लगाना या जला देना है, और ὅρη का सीधा अर्थ ‘पहाड़’ है; यह अनुवाद काव्यात्मक दृश्य और कारक भाव दोनों रखता है।
- source_word: τοὺς νεανίσκους μου ἀνελεῖν ῥομφαίᾳ
  choice: मेरे जवानों को तलवार से मार डालेगा
  rationale: νεανίσκους युवा पुरुषों को सूचित करता है; ἀνελεῖν यहाँ हत्या करना और ῥομφαίᾳ साधन के रूप में तलवार को दर्शाता है। ‘जवान’ स्वाभाविक है और सैनिक होने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: τὰ θηλάζοντά μου θήσει εἰς ἔδαφος
  choice: मेरे दूध-पीते बच्चों को भूमि पर पटक देगा
  rationale: θηλάζοντα स्तनपान करने वाले बच्चों को दर्शाता है। θήσει εἰς ἔδαφος शाब्दिक रूप से भूमि पर रखेगा/डालेगा है; हिंसक अत्याचारों के प्रसंग में ‘पटक देगा’ उस शत्रुतापूर्ण क्रिया को स्पष्ट करता है।
- source_word: τὰ νήπιά μου δώσει εἰς προνομὴν
  choice: मेरे नन्हे बच्चों को लूट का माल बना देगा
  rationale: νήπια बहुत छोटे बच्चों को और προνομή लूट या युद्ध की लूट को दर्शाता है। हिंदी में ‘लूट का माल बना देगा’ बच्चों के साथ युद्ध-संपत्ति जैसा व्यवहार किए जाने का अर्थ साफ करता है।
- source_word: τὰς παρθένους σκυλεῦσαι
  choice: मेरी कुँवारियों को लूट लेगा
  rationale: παρθένους के स्पष्ट यौन-स्थिति सूचक अर्थ को ‘कुँवारियों’ से रखा गया है। σκυλεῦσαι का मूल अर्थ लूटना, वस्त्र/संपत्ति छीनना या उजाड़ना है; मुख्य पाठ इसे यौन हिंसा के अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: क्या कुँवारियों के विरुद्ध हिंसा को मुख्य पाठ में स्पष्ट रूप से यौन हिंसा कहा जाए
  choice: मेरी कुँवारियों को लूट लेगा
  alternative: मेरी कुँवारियों का शील भंग करेगा
  rationale: σκυλεῦσαι मुख्यतः लूटने या सब कुछ छीन लेने का व्यापक क्रिया-पद है। युद्धकालीन संदर्भ में यौन हिंसा निहित हो सकती है, पर यूनानी इसे स्पष्ट रूप से नहीं कहता; इसलिए मुख्य पाठ व्यापक अर्थ रखता है और संभावित कठोर अर्थ टिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘दूध-पीते बच्चे’, ‘नन्हे बच्चे’ और ‘कुँवारियाँ’ अलग-अलग यूनानी पदों का भेद बनाए रखते हैं। हिंसा को न तो नरम किया गया है, न यूनानी से अधिक निश्चित बनाया गया है।
