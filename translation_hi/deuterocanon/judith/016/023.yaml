  yaml_path: translation/deuterocanon/judith/016/023.yaml
  text: And she continued to prosper greatly[a], and she grew old in her husband's house for one hundred five years, and she set her maidservant free. Then she died in Bethulia[b], and they buried her in the cave of her husband Manasseh.
translation:
  language: hi
  text: वह बहुत ही महान होती गई[a]। वह अपने पति के घर में वृद्ध हुई और एक सौ पाँच वर्ष तक जीवित रही। उसने अपनी दासी[b] को स्वतंत्र कर दिया। फिर बेतूलिया में उसकी मृत्यु हुई, और लोगों ने उसे उसके पति मनश्शे की गुफा में दफ़नाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह बहुत उन्नति करती गई।” यूनानी में आगे बढ़ने या बढ़ते जाने के साथ अत्यन्त महान होने का प्रबल भाव है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द स्त्री परिचारिका या दासी को दर्शाता है। उसे स्वतंत्र किए जाने से संकेत मिलता है कि वह आश्रित या बंधनकारी सेवकाई की स्थिति में थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: προβαίνουσα μεγάλη σφόδρα
  choice: बहुत ही प्रतिष्ठित होती गई
  rationale: προβαίνω आगे बढ़ने या बढ़ते जाने का भाव देता है, जबकि μεγάλη σφόδρα अत्यधिक महानता अथवा प्रतिष्ठा पर बल देता है। यह अनुवाद सफलता या धन को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक हिन्दी में दोनों भाव रखता है।
- source_word: ἐγήρασεν ... ἔτη ἑκατὸν πέντε
  choice: वृद्ध हुई और एक सौ पाँच वर्ष की आयु तक पहुँची
  rationale: ἐγήρασεν के ‘वृद्ध हुई’ भाव को बनाए रखते हुए 105 वर्षों को उसके जीवन की आयु के रूप में स्पष्ट किया गया है, न कि केवल पति के घर में बिताई गई अवधि के रूप में।
- source_word: ἐν τῷ οἴκῳ τοῦ ἀνδρὸς αὐτῆς
  choice: अपने पति के घर में
  rationale: यह यूनानी संबंधवाचक और स्थानवाचक पदबंध का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: ἀφῆκεν τὴν ἅβραν αὐτῆς ἐλευθέραν
  choice: अपनी दासी को स्वतंत्र कर दिया
  rationale: ἅβρα स्त्री परिचारिका या दासी को सूचित करता है; ἐλευθέραν के साथ ἀφῆκεν यहाँ उसे अधीन स्थिति से मुक्त करने का स्पष्ट भाव देता है।
- source_word: ἀπέθανεν εἰς Βαιτυλουὰ
  choice: बेतूलिया में उसकी मृत्यु हुई
  rationale: उत्तरकालीन यूनानी में मृत्यु के क्रियापद के साथ εἰς यहाँ स्थान का संकेत देता है; हिन्दी में ‘में’ स्वाभाविक है।
- source_word: ἐν τῷ σπηλαίῳ τοῦ ἀνδρὸς αὐτῆς Μανασσῆ
  choice: उसके पति मनश्शे की गुफा में
  rationale: σπήλαιον का मूल अर्थ ‘गुफा’ है; दफ़नाने का प्रसंग इसे कब्र की गुफा के रूप में पर्याप्त रूप से स्पष्ट करता है।
theological_decisions:
- issue: यहूदीत की बढ़ती महानता या समृद्धि का अर्थ
  choice: बहुत ही प्रतिष्ठित होती गई
  alternative: बहुत उन्नति करती गई; बहुत समृद्ध होती गई; अत्यन्त महान होती गई
  rationale: यूनानी अभिव्यक्ति आगे बढ़ने और अत्यधिक महान होने का व्यापक भाव रखती है। ‘प्रतिष्ठित’ सामाजिक सम्मान को व्यक्त करता है, पर पादटिप्पणी मूल की व्यापकता और संभावित विकल्प सुरक्षित रखती है।
- issue: ἅβρα की सामाजिक स्थिति
  choice: दासी
  alternative: परिचारिका; दास स्त्री
  rationale: यह मानक δοῦλος शब्द नहीं है, फिर भी उसे स्वतंत्र किए जाने से बंधन या आश्रित सेवकाई की वास्तविक स्थिति सूचित होती है। ‘दासी’ आधुनिक हिन्दी में संक्षिप्त और प्रसंगानुकूल है; पादटिप्पणी इस अर्थ की बारीकी बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। छोटे वाक्यों से कथात्मक प्रवाह स्वाभाविक बनाया गया है। ‘प्रतिष्ठित होती गई’ मूल के संभावित सामाजिक-महानता के भाव को रखता है, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता सुरक्षित करती है।
