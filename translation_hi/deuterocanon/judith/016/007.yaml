- source_word: εἰς ὕψος
  choice: ऊपर उठाने के लिए
  rationale: यूनानी पदबंध संक्षिप्त है और ऊँचाई, उन्नयन या प्रतिष्ठा की छवि रखता है। यह चुनाव रूपक को बचाते हुए उद्देश्य का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῶν πονούντων
  choice: दुःख सहनेवालों
