base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/014.yaml
  text: Let all your creation serve you; for you spoke[a], and they came to be; you sent out your Spirit, and it formed them; and there is no one who will resist your voice.
translation:
  language: hi
  text: तेरी सारी सृष्टि तेरी सेवा करे; क्योंकि तूने कहा, और वे अस्तित्व में आ गए; तूने अपना आत्मा[a] भेजा, और उसने उनका निर्माण किया; और कोई ऐसा नहीं है जो तेरी वाणी का विरोध कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी श्वास’ अथवा ‘अपनी वायु’। सृष्टि के संदर्भ में यूनानी शब्द के ये तीनों अर्थ हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: δουλευσάτω
  choice: सेवा करे
  rationale: यह आज्ञार्थक रूप सृष्टि के परमेश्वर की अधीनता में रहकर उसकी सेवा करने का भाव देता है। ‘दास बने’ निर्जीव सृष्टि के संदर्भ में अनावश्यक रूप से कठोर होता।
- source_word: πᾶσα ἡ κτίσις σου
  choice: तेरी सारी सृष्टि
  rationale: एकवचन κτίσις यहाँ समष्टिगत अर्थ में पूरी सृष्टि को दर्शाता है।
- source_word: εἶπας
  choice: तूने कहा
  rationale: यह सरल और प्रत्यक्ष रूप से परमेश्वर के सृजनकारी कथन को व्यक्त करता है।
- source_word: ἐγενήθησαν
  choice: वे अस्तित्व में आ गए
  rationale: γίνομαι का यह रूप अस्तित्व में आने का भाव रखता है और ‘बनाए गए’ जैसा अधिक स्पष्ट कर्मवाच्य आरोपित नहीं करता।
- source_word: ἀπέστειλας
  choice: तूने ... भेजा
  rationale: ἀποστέλλω के भेजने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμά σου
  choice: अपना आत्मा
  rationale: सृष्टि-संदर्भ में πνεῦμα का प्रमुख संभावित अर्थ परमेश्वर का आत्मा है; ‘श्वास’ और ‘वायु’ की वास्तविक अर्थ-संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ᾠκοδόμησεν
  choice: उसने उन्हें रचा
  rationale: οἰκοδομέω का मूल भाव ‘निर्माण करना’ है; सृष्टि के काव्यात्मक संदर्भ में ‘रचा’ स्वाभाविक हिन्दी में उसके निर्माणकारी कार्य को व्यक्त करता है, यद्यपि मूल की ‘बनाने/निर्मित करने’ की छवि को कुछ सामान्य बनाता है।
- source_word: ἀντιστήσεται
  choice: सामना कर सके
  rationale: ἀνθίστημι का अर्थ विरुद्ध खड़े होना या प्रतिरोध करना है। ‘सामना कर सके’ वाणी के साथ सहज हिन्दी है और भावी कथन की असमर्थता को व्यक्त करता है।
- source_word: τῇ φωνῇ σου
  choice: तेरी वाणी
  rationale: φωνή की बोलने की प्रत्यक्ष छवि सुरक्षित रहती है; ‘आज्ञा’ अर्थ को आवश्यकता से अधिक स्पष्ट कर देती।
theological_decisions:
- issue: सृष्टि के संदर्भ में πνεῦμα का अर्थ
  choice: अपना आत्मा
  alternative: अपनी श्वास; अपनी वायु
  rationale: यूनानी शब्द आत्मा, श्वास और वायु—तीनों अर्थ रख सकता है। मुख्य पाठ में संदर्भतः प्रमुख ‘आत्मा’ रखा गया है और मूल की अर्थगत बहुलता पादटिप्पणी में संरक्षित है।
- issue: ᾠκοδόμησεν में सृजनकारी कार्य का स्वरूप
  choice: उसने उन्हें रचा
  alternative: उसने उनका निर्माण किया; उसने उन्हें स्थापित किया
  rationale: पद परमेश्वर के आत्मा को सृष्टि का निर्माणकारी कर्ता बताता है। ‘रचा’ इस आशय को व्यक्त करता है, बिना किसी विशिष्ट दार्शनिक सृष्टि-सिद्धांत को जोड़ने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। प्रार्थना/स्तुति के प्रत्यक्ष संबोधन के अनुरूप ‘तू/तेरी’ रखा गया है। मूल यूनानी के समान खंडों को अर्धविरामों से जोड़ा गया है।
