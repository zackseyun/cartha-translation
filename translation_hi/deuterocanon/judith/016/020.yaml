  choice: पवित्रस्थान
  alternative: पवित्र वस्तुएँ; पवित्र जन
  rationale: यरूशलेम के उपासना-संबंधी संदर्भ और ‘सामने’ के स्थानवाचक प्रयोग के कारण मन्दिर का पवित्र क्षेत्र सबसे सम्भावित अर्थ है। फिर भी यूनानी रूप नपुंसकलिंग ‘पवित्र वस्तुएँ/स्थान’ अथवा पुल्लिंग ‘पवित्र जन’ समझा जा सकता है, इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामुदायिक उत्सव के अनुकूल रूप। ‘आनन्द मनाते रहे’ निरन्तरता व्यक्त करता है; ‘पवित्रस्थान’ को एक शब्द में लिखकर मन्दिर-संबंधी तकनीकी अर्थ रखा गया है।
