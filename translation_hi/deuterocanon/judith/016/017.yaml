  yaml_path: translation/deuterocanon/judith/016/017.yaml
  text: Woe to the nations rising up against my people[a]; the Lord Almighty will take vengeance on them in the day of judgment, to put fire and worms in their flesh[b], and they will weep in pain forever.
translation:
  language: hi
  text: 'मेरे लोगों[a] के विरुद्ध उठ खड़े होने वाले राष्ट्रों पर धिक्कार है! सर्वशक्तिमान प्रभु न्याय के दिन उनसे बदला लेगा: वह उनकी देह में आग और कीड़े डालेगा, और वे पीड़ा का अनुभव करते हुए[b] सदा रोएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे कुल’ अथवा ‘मेरे जातीय समुदाय’; यूनानी γένος यूदिथ के अपने लोगों के समूह को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘संवेदना/अनुभूति में’; यहाँ शारीरिक दण्ड के प्रसंग में इसे ‘पीड़ा का अनुभव करते हुए’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ἔθνεσιν
  choice: राष्ट्रों पर धिक्कार है
  rationale: οὐαί की भविष्यद्वाणी-सदृश निंदा और न्यायिक चेतावनी को ‘धिक्कार’ व्यक्त करता है; ἔθνεσιν के लिए ‘राष्ट्रों’ विदेशी जनसमूहों का व्यापक अर्थ बनाए रखता है।
- source_word: ἐπανισταμένοις τῷ γένει μου
  choice: मेरे लोगों के विरुद्ध उठ खड़े होने वाले
  rationale: ἐπανισταμένοις की विरोधपूर्ण उठ खड़े होने की छवि सुरक्षित है। γένος यहाँ यहूदीत के अपने जातीय-समुदाय को सूचित करता है, इसलिए स्वाभाविक हिन्दी में ‘मेरे लोगों’ चुना गया है।
- source_word: Κύριος Παντοκράτωρ
  choice: सर्वशक्तिमान प्रभु
  rationale: यह प्रचलित, गरिमापूर्ण हिन्दी दैवी उपाधि है और प्रभु के सर्वाधिकार तथा सामर्थ्य को व्यक्त करती है।
- source_word: ἐκδικήσει αὐτοὺς
  choice: उनसे बदला लेगा
  rationale: क्रिया के प्रतिशोधात्मक न्याय का कठोर स्वर बनाए रखा गया है; केवल सामान्य ‘दण्ड देगा’ कहने से अर्थ कुछ नरम पड़ जाता।
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: न्याय के दिन
  rationale: यह स्वाभाविक हिन्दी है और यूनानी के न्यायिक तथा संभावित अंतिम-दिवस संबंधी संकेत को बिना अतिरिक्त व्याख्या के रखती है।
- source_word: δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν
  choice: वह उनकी देह में आग और कीड़े डाल देगा
  rationale: δοῦναι को प्रसंगानुसार परिणाम बताने वाले स्वतंत्र वाक्य में खोला गया है। ‘देह में’ εἰς σάρκας की कठोर शारीरिक छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: κλαύσονται ἐν αἰσθήσει
  choice: पीड़ा का अनुभव करते हुए रोएँगे
  rationale: κλαύσονται का सीधा अर्थ ‘रोएँगे’ है। αἴσθησις मूलतः संवेदना या अनुभूति है; दण्ड के प्रसंग में ‘पीड़ा का अनुभव’ अर्थ को स्पष्ट करता है, पर इसे केवल एक व्यवस्थित धर्मसैद्धान्तिक पद में सीमित नहीं करता।
- source_word: ἕως αἰῶνος
  choice: सदा तक
  rationale: यह वाक्यांश की दीर्घस्थायी, अनंतकालिक शक्ति को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दण्ड की अनुभूति और अवधि
  choice: वे सदा तक पीड़ा का अनुभव करते हुए रोएँगे
  alternative: वे युग तक संवेदना में रोएँगे
  rationale: कठोर दण्ड और उसकी अवधि को नरम नहीं किया गया। साथ ही αἴσθησις के ‘अनुभूति/संवेदना’ अर्थ को ‘पीड़ा का अनुभव’ के रूप में रखा गया है, ताकि सचेत शारीरिक कष्ट का प्रसंग स्पष्ट हो पर पद से अधिक विकसित धर्मसिद्धान्त न जोड़ा जाए।
- issue: ἐκδικήσει में प्रतिशोध और न्याय का संबंध
  choice: उनसे बदला लेगा
  alternative: उनका न्याय करेगा / उन्हें दण्ड देगा
  rationale: मूल क्रिया न्यायपूर्ण प्रतिशोध या बदला लेने का भाव रखती है। ‘बदला लेगा’ उस तनाव को सुरक्षित रखता है और उसे केवल तटस्थ न्याय-निर्णय में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और भविष्यद्वाणी-सदृश है। कठोर दण्डात्मक बिंबों को बिना नरम किए रखा गया है। ‘जाति’ के आधुनिक अस्पष्ट अर्थों से बचने के लिए γένος हेतु मुख्य पाठ में ‘लोगों’ और टिप्पणी में ‘कुल/जातीय समुदाय’ प्रयुक्त हैं।
