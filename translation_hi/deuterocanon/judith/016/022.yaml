  yaml_path: translation/deuterocanon/judith/016/022.yaml
  text: And many desired her[a], but no man knew her all the days of her life[b], from the day when Manasseh her husband died and was added to his people.
translation:
  language: hi
  text: बहुत-से पुरुष उसे पाने की इच्छा रखते थे, पर उसके पति मनश्शे के मरने और अपने लोगों में जोड़ दिए जाने[b] के दिन से लेकर उसके जीवन-भर, किसी पुरुष ने उसे नहीं जाना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, किसी पुरुष ने उसके साथ शारीरिक संबंध नहीं बनाए। यूनानी में शाब्दिक रूप से, ‘किसी पुरुष ने उसे नहीं जाना’ है; यहाँ ‘जानना’ यौन संबंध के लिए शिष्टोक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने लोगों में जा मिला।” यह मृत्यु के लिए प्रयुक्त बाइबलीय मुहावरा है।
    reason: lexical_alternative
