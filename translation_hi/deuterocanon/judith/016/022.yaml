theological_decisions:
- issue: οὐκ ἔγνω ἀνὴρ αὐτήν में यौन शिष्टोक्ति
  choice: मुख्य पाठ में ‘किसी पुरुष ने उसे नहीं जाना’ रखा गया।
  alternative: ‘किसी पुरुष ने उसके साथ शारीरिक संबंध नहीं बनाए।’
  rationale: मूल यूनानी स्पष्ट यौन क्रिया के बजाय शिष्टोक्ति प्रयोग करता है। उसे मुख्य पाठ में बनाए रखने से मूल का संयम और साहित्यिक तनाव सुरक्षित रहता है; फुटनोट आधुनिक पाठक के लिए आशय स्पष्ट करता है।
- issue: προσετέθη πρὸς τὸν λαὸν αὐτοῦ का मृत्यु-संबंधी मुहावरा
  choice: ‘अपने लोगों में मिला लिया गया’
  alternative: ‘अपने लोगों में जा मिला’ या ‘अपने लोगों के साथ इकट्ठा किया गया’
  rationale: चुना हुआ रूप यूनानी के कर्मवाच्य और ‘लोगों में जोड़े जाने’ की छवि दोनों को यथासंभव बनाए रखता है, बिना परलोक की दशा को व्याख्यायित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्य के लंबे क्रम को हिन्दी में स्वाभाविक बनाने के लिए कालवाचक उपवाक्य पहले रखा गया है। सभी फुटनोट-चिह्न अपने संबंधित पदबंधों पर लगाए गए हैं; परामर्शार्थ अंग्रेज़ी पाठ में चिह्नों की स्थिति और फुटनोट-विषय के बीच जो असंगति थी, उसे नहीं अपनाया गया।
