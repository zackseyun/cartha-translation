  yaml_path: translation/deuterocanon/judith/016/002.yaml
  text: For the Lord is a God who shatters wars; for in his camp, in the midst of the people, he rescued me from the hand of those pursuing me.
translation:
  language: hi
  text: क्योंकि प्रभु युद्धों को चकनाचूर करने वाला परमेश्वर है; क्योंकि अपनी छावनियों[a] में, लोगों के बीच, उसने मुझे मेरा पीछा करने वालों के हाथ से छुड़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “छावनियाँ” बहुवचन है। यहाँ पूर्वसर्ग का संबंध स्थान (‘छावनियों में’) या दिशा/प्रवेश (‘छावनियों के भीतर/की ओर’) से समझा जा सकता है।
    reason: मूल पाठ के बहुवचन और εἰς के कठिन स्थानात्मक-दिशात्मक संबंध को बनाए रखता है, बिना अप्रकट ‘पहुँचाकर’ क्रिया जोड़े।
lexical_decisions:
- source_word: συντρίβων πολέμους
  choice: युद्धों को चूर कर देता है
  rationale: सυντρίβω के ‘कुचलना/चकनाचूर करना’ वाले प्रबल बिंब और πολέμους के बहुवचन को बनाए रखता है; ‘युद्ध समाप्त करता है’ मूल रूपक को अनावश्यक रूप से सपाट कर देता।
- source_word: παρεμβολὰς αὐτοῦ
  choice: अपनी छावनियों
  rationale: παρεμβολάς का मूल पाठ बहुवचन है; आत्मवाचक ‘अपनी’ हिन्दी में कर्ता प्रभु की छावनियों को स्वाभाविक रूप से सूचित करता है।
- source_word: ἐξείλατό με ἐκ χειρὸς
  choice: उसने मुझे ... के हाथ से छुड़ाया
  rationale: यह हिन्दी मुहावरा उद्धार/बचाव और किसी की सत्ता या पकड़ से निकाले जाने—दोनों भावों को सुरक्षित रखता है।
- source_word: καταδιωκόντων με
  choice: जो मेरा पीछा कर रहे थे
  rationale: वर्तमान कृदंत की जारी पीछा करने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: θεὸς ... Κύριος में पदक्रम और विधेय-संबंध
  choice: प्रभु वह परमेश्वर है जो युद्धों को चूर कर देता है
  alternative: परमेश्वर, जो युद्धों को चूर करता है, प्रभु है
  rationale: यूनानी में क्रियापद निहित है और शब्दक्रम काव्यात्मक है। चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए ‘प्रभु’ और ‘परमेश्वर’ की पहचान तथा युद्धों को चूर करने वाले गुण—दोनों को बनाए रखता है।
- issue: εἰς παρεμβολὰς का स्थान अथवा दिशा-सूचक अर्थ
  choice: अपनी छावनियों में
  alternative: अपनी छावनियों में पहुँचा दिया / अपनी छावनियों की ओर
  rationale: εἰς सामान्यतः दिशा सूचित करता है, पर यहाँ ἐξείλατο के साथ वाक्य-संबंध असामान्य है और परामर्श-पाठ इसे स्थानवाचक समझता है। मुख्य पाठ में सहज स्थानवाचक रूप रखा गया है और अस्पष्टता पादटिप्पणी में बताई गई है, बिना ‘पहुँचा दिया’ जैसी अप्रकट क्रिया जोड़ने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘युद्धों को चूर कर देता है’ गीतात्मक और प्रबल मूल बिंब को बनाए रखता है; वाक्य की दोहरी ‘क्योंकि’ संरचना यूनानी के दोनों ὅτι को दर्शाती है।
