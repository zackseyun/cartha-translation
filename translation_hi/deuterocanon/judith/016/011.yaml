  yaml_path: translation/deuterocanon/judith/016/011.yaml
  text: Then my lowly ones shouted[a], and my weak ones were afraid and panicked; they raised their voice[b], and they were overthrown.
translation:
  language: hi
  text: तब मेरे दीन जनों ने ऊँची पुकार लगाई[a], और मेरे निर्बल जन डर गए और आतंकित हो उठे; उन्होंने अपनी आवाज़ ऊँची की, और वे धराशायी कर दिए गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘युद्ध की ललकार लगाई’; यूनानी क्रिया ज़ोरदार पुकार को दर्शाती है और इस प्रसंग में सैनिक ललकार का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश ‘वे धराशायी कर दिए गए’ में ‘वे’ किसे सूचित करता है, यह यूनानी वाक्य में स्पष्ट नहीं है। यह दीन और निर्बल जनों की ओर संकेत जारी रख सकता है, या निहित रूप से उनके विरोधियों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάλαξαν
  choice: ऊँची पुकार लगाई
  rationale: यह क्रिया ज़ोर से पुकारने या चिल्लाने को व्यक्त करती है और प्रसंग में युद्ध-ललकार का भाव भी रख सकती है। चुना गया रूप मूल अर्थ को बनाए रखते हुए सैनिक अर्थ को अनिवार्य नहीं बनाता।
- source_word: οἱ ταπεινοί μου
  choice: मेरे दीन जनों
  rationale: ταπεινοί सामाजिक रूप से दबे, नम्र या दीन लोगों को सूचित कर सकता है। ‘दीन जन’ व्यापक अर्थ और μου के संबंधसूचक भाव दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: οἱ ἀσθενοῦντές μου
  choice: मेरे निर्बल जन
  rationale: यहाँ कृदंत संज्ञा के रूप में उन लोगों के लिए है जो शक्तिहीन या कमज़ोर हैं; ‘निर्बल जन’ चिकित्सकीय अर्थ थोपे बिना इस भाव को व्यक्त करता है।
- source_word: ἐφοβήθησαν
  choice: डर गए
  rationale: यह अओरिस्ट रूप भयभीत होने की सीधी प्रतिक्रिया बताता है; ‘डर गए’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: ἐπτοήθησαν
  choice: आतंकित हो उठे
  rationale: यह क्रिया अचानक भय, आतंक या विचलन की तीव्र दशा व्यक्त करती है। ‘आतंकित हो उठे’ पहले आए साधारण भय से तीव्रता की प्रगति बनाए रखता है।
- source_word: ὕψωσαν τὴν φωνὴν αὐτῶν
  choice: उन्होंने अपनी आवाज़ ऊँची की
  rationale: यह यूनानी मुहावरे का निकट और स्वाभाविक हिन्दी रूप है; सामूहिक कर्ता के साथ ‘आवाज़’ का एकवचन भी सहज है।
- source_word: ἀνετράπησαν
  choice: वे धराशायी कर दिए गए
  rationale: क्रिया का निष्क्रिय रूप उलट दिए जाने, गिरा दिए जाने या परास्त किए जाने का परिणाम व्यक्त कर सकता है। ‘धराशायी कर दिए गए’ निष्क्रियता और विनाशकारी पराजय का भाव रखता है, पर केवल तकनीकी सैनिक शब्द तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: अंतिम निष्क्रिय क्रिया ἀνετράπησαν का कर्ता-संदर्भ
  choice: अनुवाद में केवल ‘वे’ रखा गया है, ताकि यूनानी की संक्षिप्त और संदिग्ध संदर्भ-रचना बनी रहे।
  alternative: स्पष्ट रूप से ‘दीन/निर्बल जन धराशायी किए गए’ कहना, अथवा निहित विषय मानकर ‘उनके शत्रु धराशायी किए गए’ कहना।
  rationale: तत्काल पूर्ववर्ती बहुवचन कर्ता से संबंध संभव है, पर प्रसंगगत रूप से विरोधियों की पराजय भी निहित समझी जा सकती है। उपलब्ध यूनानी पाठ स्वयं विषय-परिवर्तन स्पष्ट नहीं करता; इसलिए किसी पक्ष को जोड़कर निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दीन जन’ और ‘निर्बल जन’ काव्यात्मक समानांतरता को बनाए रखते हैं। अंतिम सर्वनाम की संदिग्धता जानबूझकर सुरक्षित रखी गई है।
