  yaml_path: translation/deuterocanon/judith/016/019.yaml
  text: And Judith dedicated to God all the equipment of Holofernes that the people had given her[b][a], and she gave to God as a dedicated offering the canopy that she had taken for herself from his bedchamber.
translation:
  language: hi
  text: और यहूदीत ने होलोफेरनेस का वह सारा सामान, जो लोगों ने उसे दिया था, परमेश्वर को समर्पित कर दिया; और उसने उस पलंग के परदे[a] को, जो उसने उसके शयनकक्ष से अपने लिए लिया था, परमेश्वर को समर्पित भेंट[b] के रूप में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मच्छरदानी” अथवा “पलंग की छतरी”।
    reason: यूनानी κωνώπιον के ये सभी अर्थ संभव हैं; प्रसंग किसी शय्या-संबंधी आवरण की ओर संकेत करता है।
  - marker: b
    text: इसका अर्थ “मन्नत की भेंट” या “परमेश्वर को समर्पित वस्तु” भी हो सकता है।
    reason: यूनानी ἀνάθημα किसी देवता को अर्पित और उसके लिए अलग की गई वस्तु के लिए प्रयुक्त होता है।
lexical_decisions:
- source_word: ἀνέθηκεν
  choice: परमेश्वर को समर्पित कर दिया
  rationale: यह क्रिया किसी वस्तु को देवता के लिए अर्पित या समर्पित करने का धार्मिक भाव रखती है; यह अनुष्ठान की ऐसी बारीकी नहीं जोड़ती जो मूल में स्पष्ट नहीं है।
- source_word: σκεύη
  choice: सामान
  rationale: बहुवचन σκεύη उपकरणों, वस्तुओं या साज-सामान का व्यापक अर्थ दे सकता है। यहाँ ‘सामान’ होलोफेरनेस की विविध वस्तुओं को स्वाभाविक और व्यापक ढंग से व्यक्त करता है।
- source_word: κωνώπιον
  choice: पलंग का परदा
  rationale: यह शब्द मच्छरदानी, पलंग के ऊपर की छतरी या उसके चारों ओर के परदे को सूचित कर सकता है। शयनकक्ष के प्रसंग में ‘पलंग का परदा’ सहज है और अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κοιτῶνος
  choice: शयनकक्ष
  rationale: κοιτών सोने के कमरे या शयनकक्ष को दर्शाता है; ‘शयनकक्ष’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: εἰς ἀνάθημα
  choice: समर्पित भेंट के रूप में
  rationale: ἀνάθημα परमेश्वर को अर्पित और उनके लिए अलग की गई वस्तु है। ‘समर्पित भेंट’ सामान्य ‘भेंट’ से अधिक स्पष्ट रूप से इसके धार्मिक समर्पण-भाव को व्यक्त करती है।
- source_word: τῷ θεῷ
  choice: परमेश्वर को
  rationale: समर्पण और देने के प्राप्तकर्ता को सीधा और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: वस्तुओं के धार्मिक समर्पण का स्वरूप
  choice: होलोफेरनेस के सामान और पलंग के परदे को परमेश्वर को समर्पित वस्तुओं के रूप में प्रस्तुत किया गया है।
  alternative: इसे तकनीकी रूप से ‘मन्नत की भेंट’ या अधिक सामान्य रूप से केवल ‘दे दिया’ कहा जा सकता था।
  rationale: यूनानी पाठ ἀνέθηκεν और ἀνάθημα, दोनों के द्वारा धार्मिक समर्पण पर बल देता है, पर यह नहीं बताता कि यह बलिदान था या इसकी कोई विशिष्ट मंदिर-विधि थी। अनुवाद उसी सीमा को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक गरिमा और सामान्य पाठक की सुबोधता को ध्यान में रखकर रखी गई है। ‘यहूदीत’, ‘होलोफेरनेस’ और ‘परमेश्वर’ नाम व धार्मिक संबोधन के मानक हिन्दी रूप हैं। वाक्य की दो समानांतर क्रियाएँ मूल यूनानी की संरचना और समर्पण के दोहरे उल्लेख को बनाए रखती हैं।
