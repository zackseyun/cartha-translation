translation:
  language: hi
  text: और जूडिथ के दिनों में इस्राएलियों को डरानेवाला फिर कोई न रहा, और उसकी मृत्यु के बाद भी बहुत दिनों तक कोई न रहा। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐκφοβῶν
  choice: डरानेवाला
  rationale: यूनानी कृदंत का व्यक्ति-सूचक रूप बनाए रखता है और तीव्र भय उत्पन्न करने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: इस्राएलियों को
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के स्थान पर आधुनिक हिन्दी में पूरे समुदाय के लिए स्वाभाविक और समावेशी सामुदायिक पद है।
- source_word: ἡμέρας πολλάς
  choice: बहुत दिनों तक
  rationale: अवधि बताने वाले यूनानी कर्मकारक का सहज हिन्दी रूप।
- source_word: ἀμήν
  choice: आमीन
  rationale: पारंपरिक ध्वन्यात्मक धार्मिक समापन को सुरक्षित रखता है।
theological_decisions:
- issue: शांति की अवधि का कथन
  choice: जूडिथ के जीवनकाल और उसकी मृत्यु के बाद बहुत दिनों तक डरानेवाले का न होना
  alternative: इसे स्थायी या अनिश्चितकालीन शांति के रूप में प्रस्तुत करना
  rationale: मूल पाठ केवल ‘बहुत दिनों तक’ कहता है; वह स्थायी शांति का दावा नहीं करता।
- issue: ‘इस्राएल के पुत्र’ की सामुदायिक पहचान
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह वाक्यांश सामूहिक जातीय-धार्मिक समुदाय को सूचित करता है, केवल पुरुष वंशजों को नहीं; इसलिए अर्थ को बिना संप्रदायगत विस्तार के स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फिर कोई न रहा’ से οὐκ ἦν ἔτι का अर्थ व्यक्त हुआ है। दूसरे खंड में ‘कोई न रहा’ की पुनरावृत्ति हिन्दी में संबंध स्पष्ट करती है, यद्यपि यूनानी में वह निहित है।
