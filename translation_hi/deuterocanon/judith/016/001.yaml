  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के अनुकूल रखी गई है। सभी आज्ञाएँ बहुवचन में हैं। ‘डफ’ और ‘झाँझ’ सामान्य पाठक के लिए सुलभ वाद्य-नाम हैं; ‘सुर में सजाओ’ मूल क्रिया की संगीतात्मक बहुअर्थता को बिना अत्यधिक तकनीकी भाषा के बनाए रखता है।
