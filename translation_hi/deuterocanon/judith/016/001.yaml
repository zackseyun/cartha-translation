  yaml_path: translation/deuterocanon/judith/016/001.yaml
  text: Begin the song to my God with tambourines[a]; sing to the Lord with cymbals; fit to him a psalm and praise[b]; exalt and call upon his name.
translation:
  language: hi
  text: डफ बजाकर मेरे परमेश्वर के लिए गीत आरम्भ करो[a]; झाँझ बजाकर प्रभु के लिए गाओ; उनके लिए भजन और स्तुति को सुर में सजाओ[b]; उनके नाम को ऊँचा उठाओ और उनका नाम लेकर पुकारो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे परमेश्वर के लिए डफ बजाकर अगुवाई करो।” आरम्भिक यूनानी क्रिया किसी गीत या संगीत को आरम्भ करने अथवा उसकी अगुवाई करने की आज्ञा है।
    reason: lexical_alternative
  - marker: b
    text: “सुर में सजाओ” का अर्थ “उनके लिए सामंजस्य से गाओ” या “उनके लिए व्यवस्थित करो” भी हो सकता है। यूनानी क्रिया भजन और स्तुति को उचित संगीत-रूप में मिलाने या सजाने की छवि रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξάρχετε
  choice: गीत आरम्भ करो
  rationale: बहुवचन आज्ञार्थक क्रिया संगीत-संदर्भ में गीत आरम्भ करने या उसकी अगुवाई करने को कहती है। यूनानी में कर्म निहित है; हिन्दी में ‘गीत’ जोड़ने से अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: τῷ θεῷ μου
  choice: मेरे परमेश्वर के लिए
  rationale: समर्पित संगीत के संदर्भ में दत्तिव को ‘के लिए’ स्वाभाविक रूप से व्यक्त करता है और προσωπिक संबंधसूचक ‘मेरे’ को बनाए रखता है।
- source_word: ἐν τυμπάνοις
  choice: डफ बजाकर
  rationale: τύμπανον हाथ से बजाया जाने वाला चौखटे वाला ढोल था। ‘डफ’ आधुनिक हिन्दी में सुबोध है; ‘बजाकर’ वाद्य-साधन का भाव स्पष्ट करता है।
- source_word: ᾄσατε
  choice: गाओ
  rationale: सरल बहुवचन आज्ञार्थक अर्थ सुरक्षित है; यहाँ अतिरिक्त रूप से ‘स्तुति’ जोड़ना अनावश्यक होगा।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: भक्ति-संगीत के संदर्भ में दत्तिव को स्वाभाविक हिन्दी में व्यक्त करता है; κύριος का मानक बाइबलीय रूप ‘प्रभु’ रखा गया है।
- source_word: ἐν κυμβάλοις
  choice: झाँझ बजाकर
  rationale: κύμβαλον धातु का तालवाद्य है; ‘झाँझ’ वर्तमान हिन्दी में परिचित और सटीक शब्द है।
- source_word: ἐναρμόσασθε
  choice: सुर में सजाओ
  rationale: क्रिया में मिलाने, व्यवस्थित करने और सामंजस्य बैठाने का संगीतात्मक भाव है। ‘सुर में सजाओ’ भजन और स्तुति को उपयुक्त संगीत-रूप देने की असामान्य छवि बनाए रखता है।
- source_word: ψαλμὸν καὶ αἶνον
  choice: भजन और स्तुति
  rationale: ψαλμός के लिए ‘भजन’ और αἶνος के लिए ‘स्तुति’ आधुनिक हिन्दी के स्वाभाविक, अलग-अलग उपासना-संबंधी पद हैं।
- source_word: ὑψοῦτε
  choice: ऊँचा उठाओ
  rationale: शाब्दिक ऊँचा करने से निकला महिमामंडन का भाव सुरक्षित रखता है और अगले कर्म ‘नाम’ के साथ सहज बैठता है।
- source_word: ἐπικαλεῖσθε
  choice: पुकारो
  rationale: उपासना और प्रार्थना में नाम लेकर पुकारने या आह्वान करने का अर्थ देता है; ‘नाम’ साझा कर्म होने से ‘उनके नाम को ... पुकारो’ अर्थपूर्ण है।
- source_word: τὸ ὄνομα αὐτοῦ
  choice: उनके नाम को
  rationale: मूल बाइबलीय मुहावरा बनाए रखा गया है। आदरसूचक बहुवचन सर्वनाम आधुनिक मानक हिन्दी में परमेश्वर के लिए स्वाभाविक है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ उपासना-संदर्भ में स्थापित और स्वाभाविक बाइबलीय पद है तथा अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ता।
- issue: ὑψοῦτε और ἐπικαλεῖσθε का साझा कर्म
  choice: उनके नाम को ऊँचा उठाओ और पुकारो
  alternative: उन्हें महान ठहराओ और उनके नाम को पुकारो
  rationale: यूनानी में ‘उनके नाम’ दोनों समन्वित क्रियाओं का कर्म माना जा सकता है। हिन्दी में उसी संरचना को बनाए रखने से मूल की व्याकरणिक कसावट और ‘नाम’ की धार्मिक छवि सुरक्षित रहती है।
