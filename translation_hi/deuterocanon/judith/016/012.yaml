  yaml_path: translation/deuterocanon/judith/016/012.yaml
  text: The sons of maidens pierced them through[a], and wounded them like the children of deserters[b]; they perished before the battle line of my Lord.
translation:
  language: hi
  text: युवतियों के पुत्रों ने उन्हें आर-पार बेध दिया, और भगोड़ों के बच्चों के समान उन्हें घायल करते रहे[a]; वे मेरे प्रभु की युद्ध-पंक्ति से नष्ट हो गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पक्षत्यागियों के बच्चों की तरह।” यूनानी शब्द अपना पक्ष छोड़कर भागने या दूसरे पक्ष में चले जाने वालों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “मेरे प्रभु की युद्ध-पंक्ति से।” यह पूर्वसर्गीय वाक्यांश कठिन है; इसका अर्थ “मेरे प्रभु की युद्ध-पंक्ति के सामने” या “युद्ध-विन्यास से बाहर” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ κορασίων
  choice: युवतियों के पुत्रों
  rationale: यह अनुवाद असामान्य यूनानी बिंब और मातृ-संबंध दोनों को बनाए रखता है। κοράσιον का अर्थ किशोरी या युवती हो सकता है; यहाँ स्वाभाविक आधुनिक हिन्दी के लिए ‘युवतियों’ चुना गया है।
- source_word: κατεκέντησαν
  choice: आर-पार बेध दिया
  rationale: संयुक्त क्रिया में तीव्रता है; ‘आर-पार बेध दिया’ उस बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παῖδας
  choice: बच्चों
  rationale: παῖς का अर्थ बच्चा, लड़का या सेवक हो सकता है। इस युद्ध-संबंधी उपमा में ‘बच्चों’ से असहायता या दुर्बलता का आशय सबसे स्वाभाविक रूप से प्रकट होता है।
- source_word: αὐτομολούντων
  choice: भगोड़ों के
  rationale: यह शब्द अपना पक्ष छोड़कर भागने या दूसरे पक्ष में चले जाने वालों के लिए प्रयुक्त होता है। ‘भगोड़ों’ में पलायन का भाव रहता है; ‘पक्षत्यागियों’ की सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: ἐτίτρωσκον
  choice: घायल करते रहे
  rationale: अपूर्ण भूतकाल रूप बार-बार या लगातार की गई क्रिया का संकेत देता है; ‘करते रहे’ उस पहलू को व्यक्त करता है।
- source_word: ἀπώλοντο
  choice: नष्ट हो गए
  rationale: यह परिणाम को व्यक्त करता है और नाश कराने वाले कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐκ παρατάξεως
  choice: युद्ध-पंक्ति के सामने
  rationale: παράταξις युद्ध-विन्यास या युद्ध-पंक्ति है। ἐκ के साथ वाक्यांश कठिन है; मुख्य पाठ में प्रसंगानुकूल स्थानिक अर्थ दिया गया है और अधिक शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: κυρίου μου
  choice: मेरे प्रभु
  rationale: व्यक्त possessive ‘मेरे’ को बनाए रखते हुए κύριος का श्रद्धापूर्ण और संदर्भानुकूल अनुवाद ‘प्रभु’ किया गया है; ‘परमेश्वर’ जोड़कर पाठ का विस्तार नहीं किया गया।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: भजन के संदर्भ में संबोधन परमेश्वर के लिए है। ‘मेरे प्रभु’ भक्तिपूर्ण अर्थ और यूनानी के स्पष्ट संबंधवाचक सर्वनाम दोनों को बनाए रखता है, जबकि ‘स्वामी’ यहाँ अनावश्यक रूप से मानवीय स्वामित्व का संकेत दे सकता है।
