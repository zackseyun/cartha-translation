  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। असामान्य मूल बिंब ‘युवतियों के पुत्रों’ को सहज बनाने के लिए हटाया नहीं गया। अपूर्ण भूतकाल को ‘घायल करते रहे’ से व्यक्त किया गया है और कठिन यूनानी संबंधों को पाद-टिप्पणियों में खुला रखा गया है।
