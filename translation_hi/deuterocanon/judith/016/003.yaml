  yaml_path: translation/deuterocanon/judith/016/003.yaml
  text: Assyria came from the mountains out of the north[a]; he came with myriads of his forces, whose multitude blocked up the wadis[b], and their horses covered the hills.
translation:
  language: hi
  text: अश्शूर उत्तर दिशा के पहाड़ों से आया; वह दसियों हज़ार की अपनी सेना के साथ आया। उनकी भीड़ ने बरसाती नालों[a] को रोक दिया, और उनके घोड़ों[b] ने पहाड़ियों को ढक लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘बरसाती धाराएँ’ अथवा उनके ‘सूखे पाट’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उनका घोड़ा’; यूनानी में एकवचन संभवतः पूरी घुड़सवार शक्ति के लिए सामूहिक रूप में प्रयुक्त है। इसलिए ‘उनकी घुड़सवार सेना’ भी अनुवाद हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσσούρ
  choice: अश्शूर
  rationale: यह यूनानी रूप अश्शूर/असीरियाई साम्राज्य को व्यक्तित्व देकर प्रस्तुत करता है। प्रचलित बाइबलीय नाम ‘अश्शूर’ रखने से एकवचन क्रियाओं और ‘वह’ का स्वाभाविक संबंध बना रहता है।
- source_word: ἐξ ὀρέων ἀπὸ βορρᾶ
  choice: उत्तर दिशा के पहाड़ों से
  rationale: यह वाक्यांश उत्तरी दिशा से जुड़े पहाड़ी भूभाग से आने की गति को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν μυριάσι δυνάμεων αὐτοῦ
  choice: अपनी सेनाओं के दसियों हज़ार सैनिकों के साथ
  rationale: μυριάσι की विशाल, दसियों हज़ार की संख्या और δυνάμεων के सैन्य अर्थ दोनों स्पष्ट होते हैं; हिन्दी में केवल ‘असंख्य’ कहने से संख्या-संबंधी काव्यात्मक अतिशयता कम हो जाती।
- source_word: χειμάρρους
  choice: बरसाती नालों
  rationale: यह शब्द मौसमी जलधाराओं अथवा उनके पाटों के लिए प्रयुक्त हो सकता है। ‘बरसाती नाले’ उस भौगोलिक चित्र को सामान्य आधुनिक हिन्दी में स्पष्ट रखते हैं।
- source_word: ἐνέφραξεν
  choice: रोक दिया
  rationale: क्रिया बंद करने, अवरुद्ध करने या मार्ग रोक देने का भाव देती है। सेना की भीड़ द्वारा जलमार्ग अवरुद्ध होने का चित्र इस चयन में बना रहता है।
- source_word: ἡ ἵππος αὐτῶν
  choice: उनके घोड़ों
  rationale: यूनानी में ‘घोड़ा’ एकवचन रूप में है, पर वह सामूहिक अर्थ में घुड़सवार शक्ति का संकेत दे सकता है। हिन्दी बहुवचन ‘घोड़ों’ मूल बिंब को सीधे रखता है और अनावश्यक रूप से ‘घुड़सवार सेना’ नहीं जोड़ता।
- source_word: βουνούς
  choice: पहाड़ियों
  rationale: βουνοί सामान्यतः छोटी ऊँचाइयों या पहाड़ियों को दर्शाता है और पहले आए ὄρη ‘पहाड़ों’ से चित्रात्मक भेद बनाए रखता है।
theological_decisions:
- issue: व्यक्तित्व दिए गए साम्राज्य का एकवचन विषय और उसके सैनिकों के बहुवचन संदर्भ
  choice: ‘अश्शूर ... आया; वह ... आया’ रखते हुए बाद में सैनिकों और घोड़ों के लिए बहुवचन प्रयोग किया गया है।
  alternative: पूरे पद में या तो केवल ‘असीरियाई’ एकवचन रखना, या सभी संदर्भों को बहुवचन में समान कर देना।
  rationale: मूल कविता साम्राज्य को एक व्यक्ति की तरह प्रस्तुत करती है, फिर उसकी घटक सेनाओं का बहुवचन में वर्णन करती है। इस संख्या-परिवर्तन को समतल करना मूल की अलंकारिक तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘दसियों हज़ार’ विशाल संख्या को सहज हिन्दी में व्यक्त करता है; ‘बरसाती नाले’ स्थानीय पाठक के लिए ‘वादी’ की अपेक्षा अधिक बोधगम्य है। अर्धविराम और दो वाक्यांश मूल की दोहराई गई ‘आया’ संरचना तथा आगे बढ़ते सैन्य चित्र को बनाए रखते हैं।
