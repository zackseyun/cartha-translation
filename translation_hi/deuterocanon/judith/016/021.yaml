  yaml_path: translation/deuterocanon/judith/016/021.yaml
  text: After these days[a], each one returned to his own inheritance, and Judith went away to Bethulia and remained on her own property[c][b], and in her time she became renowned throughout all the land.
translation:
  language: hi
  text: इन दिनों के बाद हर एक अपनी-अपनी विरासत की भूमि[a] पर लौट गया। यूदित बैतूलिया चली गई और अपनी संपत्ति[b] पर रहती रही; और अपने जीवनकाल में वह सारे देश में यशस्वी[c] हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी-अपनी आवंटित भूमि’ अथवा ‘अपने-अपने पैतृक भाग’ में। यूनानी शब्द विरासत में मिले भाग या आवंटित भूभाग का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी जागीर में’ अथवा ‘अपनी मिल्कियत पर’। यूनानी पद यूदित की अपनी संपत्ति या भू-स्वामित्व को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘सम्मानित’ अथवा ‘विख्यात’। यूनानी शब्द में सार्वजनिक यश के साथ आदर का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: इन दिनों के बाद
  rationale: यह पदबंध घटनाक्रम में काल-संबंधी परिवर्तन सूचित करता है। ‘इन दिनों के बाद’ यूनानी के निकट रहते हुए स्वाभाविक हिन्दी है।
- source_word: ἀνέζευξεν
  choice: लौट गया
  rationale: क्रिया मूलतः पड़ाव उठाकर चल देने का भाव रख सकती है, पर अपने-अपने भाग की ओर जाने के इस प्रसंग में ‘लौट गया’ गंतव्य और वापसी दोनों को सहज रूप से व्यक्त करता है।
- source_word: ἕκαστος εἰς τὴν κληρονομίαν αὐτοῦ
  choice: हर एक अपने निज भाग में
  rationale: ἕκαστος का वितरणात्मक भाव ‘हर एक’ से और κληρονομία का पैतृक अथवा आवंटित भूभाग का भाव ‘निज भाग’ से व्यक्त होता है।
- source_word: ἀπῆλθεν εἰς Βαιτυλουὰ
  choice: बैतूलिया चली गई
  rationale: ἀπῆλθεν प्रस्थान को सूचित करता है। हिन्दी में गंतव्य के साथ ‘चली गई’ यही भाव स्वाभाविक रूप से देता है।
- source_word: κατέμεινεν ἐπὶ τῆς ὑπάρξεως αὐτῆς
  choice: अपनी संपत्ति पर रहने लगी
  rationale: κατέμεινεν निरंतर निवास का और ὕπαρξις अपनी मिल्कियत अथवा संपदा का बोध कराता है। ‘रहने लगी’ प्रसंग में जारी निवास को सहज बनाता है।
- source_word: κατὰ τὸν καιρὸν αὐτῆς
  choice: अपने जीवनकाल में
  rationale: शाब्दिक ‘अपने समय में’ सम्भव है, किंतु यहाँ उसके जीवन की अवधि अभिप्रेत है; ‘अपने जीवनकाल में’ आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: ἔνδοξος
  choice: यशस्वी
  rationale: शब्द सार्वजनिक प्रतिष्ठा, आदर और ख्याति का भाव रखता है। ‘यशस्वी’ इस सम्मानित प्रसिद्धि को व्यक्त करता है और अनावश्यक धार्मिक अर्थ में ‘महिमामय’ कहने से बचता है।
- source_word: ἐν πάσῃ τῇ γῇ
  choice: सारे देश में
  rationale: यहाँ γῆ का संदर्भ पृथ्वी नहीं बल्कि देश अथवा भूभाग है। ‘सारे देश में’ व्यापक स्थानीय प्रतिष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भूमि-वापसी के प्रसंग में κληρονομία का अनुवाद
  choice: निज भाग
  alternative: विरासत; आवंटित भूमि; अपनी मिल्कियत
  rationale: ‘निज भाग’ पारिवारिक अथवा आवंटित भूमि का बाइबलीय भाव बनाए रखता है और इसे केवल सामान्य अचल संपत्ति तक सीमित नहीं करता।
- issue: यूदित की प्रतिष्ठा के लिए ἔνδοξος का अनुवाद
  choice: यशस्वी
  alternative: सम्मानित; विख्यात; महिमामय
  rationale: यहाँ कथन यूदित की सार्वजनिक प्रतिष्ठा के विषय में है। ‘यशस्वी’ आदरयुक्त ख्याति को सुरक्षित रखता है, जबकि ‘महिमामय’ अनावश्यक रूप से धर्मवैज्ञानिक अर्थ जगा सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। वाक्य-विन्यास सरल है, पर ‘निज भाग’ और ‘यशस्वी’ जैसे शब्द मूल के भूमि-अधिकार और सम्मानित ख्याति के भाव को बनाए रखते हैं। सभी पाद-टिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
