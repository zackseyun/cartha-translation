  text: I will sing to my God a new hymn[a]. Lord, you are great and glorious, marvelous in strength[b], unsurpassable.
translation:
  language: hi
  text: मैं अपने परमेश्वर के लिए एक नया स्तुतिगान गाऊँगी[a]। हे प्रभु, आप महान और महिमामय हैं, सामर्थ्य में अद्भुत और अद्वितीय[b] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक नया स्तुतिगीत।” यूनानी में “नया स्तुतिगान” (ὕμνον καινόν) है, जो विशेष रूप से प्रशंसा के गीत को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अजेय” अथवा “जिससे बढ़कर कोई नहीं।” यूनानी विशेषण ἀνυπέρβλητος का अर्थ है जिसे कोई पार न कर सके या परास्त न कर सके।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσω
  choice: मैं ... गाऊँगी
  rationale: यह ὑμνέω का भविष्यत् सक्रिय रूप है और स्तुति गाने को व्यक्त करता है। वक्ता यूदीत है, इसलिए हिन्दी में स्त्रीलिंग भविष्यत् रूप स्वाभाविक है।
- source_word: τῷ θεῷ μου
  choice: अपने परमेश्वर के लिए
  rationale: सम्प्रदान कारक उस परमेश्वर को सूचित करता है जिसके सम्मान में गीत गाया जाएगा; ‘के लिए’ आधुनिक हिन्दी में यह सम्बन्ध सहज रूप से व्यक्त करता है।
- source_word: ὕμνον καινόν
  choice: एक नया स्तुतिगान
  rationale: ὕμνος सामान्य गीत से अधिक स्पष्ट रूप से प्रशंसा का गीत है; ‘स्तुतिगान’ इस विशेष अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन रूप κύριε को हिन्दी में ‘हे प्रभु’ कहना प्रत्यक्ष सम्बोधन और गरिमापूर्ण काव्यात्मक शैली दोनों स्पष्ट करता है।
- source_word: μέγας
  choice: महान
  rationale: यह परमेश्वर की महानता का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἔνδοξος
  choice: महिमामय
  rationale: स्तुति के प्रसंग में यह शब्द वैभव, सम्मान और महिमा से युक्त होने का भाव देता है।
- source_word: θαυμαστὸς ἐν ἰσχύι
  choice: सामर्थ्य में अद्भुत
  rationale: यह अनुवाद यूनानी पूर्वसर्गीय रचना को निकटता से रखते हुए शक्ति के क्षेत्र में विस्मयकारी होने का भाव व्यक्त करता है।
- source_word: ἀνυπέρβλητος
  choice: अद्वितीय
  rationale: शब्द का अर्थ ऐसा होना है जिसे कोई पार न कर सके या मात न दे सके। ‘अद्वितीय’ व्यापक अतुलनीयता को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: परमेश्वर को प्रत्यक्ष सम्बोधन में κύριος का अनुवाद
  choice: हे प्रभु
  alternative: प्रभु
  rationale: κύριε प्रत्यक्ष सम्बोधन है। ‘हे’ यूनानी के किसी अलग शब्द का अनुवाद नहीं, पर हिन्दी में सम्बोधन को स्पष्ट और स्तुतिपरक शैली को गरिमामय बनाता है।
- issue: ἀνυπέρβλητος की शक्ति-संबंधी व्यंजना
  choice: अद्वितीय
  alternative: अजेय
  rationale: ‘अजेय’ सैन्य या संघर्ष-संबंधी अर्थ को प्रमुख बना देता, जबकि यूनानी शब्द का दायरा ‘जिससे बढ़कर कोई नहीं’ और ‘जिसे परास्त नहीं किया जा सकता’ दोनों तक है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और स्तुतिपरक है। स्त्री वक्ता के कारण ‘गाऊँगी’ रखा गया है। समानांतर विशेषणों को सहज हिन्दी वाक्य-लय में संयोजित किया गया है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
