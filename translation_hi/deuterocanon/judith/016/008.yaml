  choice: ‘उसे धोखा देने के लिए’ कहकर छल के उद्देश्य को सीधे व्यक्त किया गया है।
  alternative: ‘उसके धोखे के लिए’
  rationale: मूल पाठ ἀπάτη अर्थात छल की भाषा स्पष्ट रूप से प्रयोग करता है। अनुवाद न तो इसे नरम करता है और न अपनी ओर से नैतिक अनुमोदन या निंदा जोड़ता है।
