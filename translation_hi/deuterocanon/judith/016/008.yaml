lexical_decisions:
- source_word: ἐδήσατο τὰς τρίχας αὐτῆς
  choice: उसने अपने बाल ... बाँध लिए
  rationale: मध्यम वाच्य और बहुवचन ‘बालों’ को स्वाभाविक हिन्दी में आत्मवाचक ‘अपने बाल बाँध लिए’ के रूप में व्यक्त किया गया है।
- source_word: ἐν μίτρᾳ
  choice: सिरबंद से
  rationale: μίτρα यहाँ बाल बाँधने के लिए सिर पर पहनी जाने वाली पट्टी या बंधन है; ‘सिरबंद’ आधुनिक हिन्दी में संक्षिप्त और प्रसंगानुकूल है।
- source_word: ἔλαβεν
  choice: लिया
  rationale: यूनानी क्रिया का सीधा अर्थ ‘लिया’ है। ‘पहन लिया’ प्रसंग में संभव है, पर वह मूल से अधिक स्पष्टता जोड़ता।
- source_word: στολὴν λινῆν
  choice: मलमल का वस्त्र
  rationale: στολή को व्यापक ‘वस्त्र’ रखा गया है। λινῆν सन से बने महीन वस्त्र को दर्शाता है, जिसके लिए सहज हिन्दी में ‘मलमल’ चुना गया है।
- source_word: εἰς ἀπάτην αὐτοῦ
  choice: उसे धोखा देने के लिए
  rationale: εἰς के साथ ἀπάτη यहाँ उद्देश्य व्यक्त करता है और αὐτοῦ उस पुरुष को लक्ष्य बनाता है; यह हिन्दी में स्वाभाविक तथा प्रसंग-संगत अभिव्यक्ति है।
