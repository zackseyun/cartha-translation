base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/005.yaml
  text: But before you do these things[a], call Achior the Ammonite to me[c][b], so that he may see and recognize the one who has treated the house of Israel with contempt and has sent him to us as if to death.
translation:
  language: hi
  text: पर इन कामों को करने से पहले अम्मोनी अखीओर को मेरे पास बुलाओ, ताकि वह उस व्यक्ति को देखे और पहचान ले[a], जिसने इस्राएल के घराने का तिरस्कार किया और उसे[b] हमारे पास मानो मृत्यु के लिए[c] भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘देखे’ और ‘पहचान ले’—दो अलग क्रियाएँ—एक के बाद एक आई हैं, जो देखने से पहचानने की ओर बढ़ते हुए भाव को बल देती हैं।
    reason: lexical_alternative
  - marker: b
    text: '‘उसे’ से सबसे अधिक सम्भावना है कि अखीओर का संकेत हो: इस्राएल के घराने का तिरस्कार करने वाले ने अखीओर को उनके पास ऐसे भेजा था, मानो वह मृत्यु की ओर भेजा जा रहा हो।'
    reason: alternative_reading
  - marker: c
    text: या ‘उसकी मृत्यु के लिए’। यूनानी का अधिक शाब्दिक अर्थ ‘मानो मृत्यु के लिए’ है, जिससे यह भाव निकल सकता है कि उसे लगभग मरा हुआ मानकर सौंप दिया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ δὲ τοῦ ποιῆσαι ταῦτα
  choice: पर इन कामों को करने से पहले
  rationale: πρό के साथ articular infinitive समय की पूर्वता व्यक्त करता है; δέ को सहज संक्रमणसूचक ‘पर’ से व्यक्त किया गया है।
- source_word: καλέσατέ μοι
  choice: मेरे पास बुलाओ
  rationale: बहुवचन आज्ञार्थक καλέσατε और दत्तिव μοι का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: Ἀχιὼρ τὸν Ἀμμανείτην
  choice: अम्मोनी अखीओर
  rationale: व्यक्तिनाम का यूनानी-आधारित लिप्यंतरण किया गया है और जातिसूचक पद को प्रचलित हिन्दी रूप ‘अम्मोनी’ दिया गया है।
- source_word: ἵνα ἴδῃ ἐπιγνοῖ
  choice: ताकि वह ... देखे और पहचान ले
  rationale: दोनों उद्देश्यसूचक क्रियाओं को बनाए रखा गया है; ἐπιγινώσκω यहाँ देखने के बाद पहचानने या भली-भाँति जान लेने का भाव देता है।
- source_word: τὸν ἐκφαυλίσαντα
  choice: जिसने ... का तिरस्कार किया
  rationale: ἐκφαυλίζω के नीचा समझने, तुच्छ जानने और अपमानपूर्ण व्यवहार करने के अर्थ को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: इस्राएल के घराने
  rationale: यह इस्राएल की प्रजा के लिए मानक बाइबलीय अभिव्यक्ति है; ‘घराना’ उस सामूहिक अर्थ और शैली को सुरक्षित रखता है।
- source_word: καὶ αὐτὸν ... ἀποστείλαντα εἰς ἡμᾶς
  choice: और उसे हमारे पास ... भेज दिया था
  rationale: αὐτόν को सर्वनाम ही रखा गया है, ताकि यूनानी की संदर्भगत संरचना और उसकी हल्की अस्पष्टता बनी रहे; प्रसंग में इसका सर्वाधिक स्वाभाविक संकेत अखीओर की ओर है।
- source_word: ὡς εἰς θάνατον
  choice: मानो मरने के लिए
  rationale: ὡς की तुलनात्मक/संभाव्य छाया को ‘मानो’ से सुरक्षित रखा गया है; यह निर्णायक रूप से ‘उसकी मृत्यु के लिए’ कहने से कम व्याख्यात्मक है।
