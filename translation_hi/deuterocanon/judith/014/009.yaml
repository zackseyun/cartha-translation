  yaml_path: translation/deuterocanon/judith/014/009.yaml
  text: And when she stopped speaking[a], the people shouted with a loud voice and raised a joyful cry in their city.
translation:
  language: hi
  text: जब उसने बोलना बंद किया, तब लोगों ने ऊँचे स्वर में जयकार की[a] और अपने नगर में आनंद की पुकार उठाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ऊँची आवाज़ में पुकार उठे’; यूनानी क्रिया ऊँची पुकार को व्यक्त कर सकती है और कभी-कभी युद्धघोष के लिए भी आती है, पर यहाँ संदर्भ लोगों के उत्सवपूर्ण उल्लास का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: जब … तब
  rationale: यह पद अगले घटनाक्रम को समय-संबंधी ढंग से जोड़ता है। हिन्दी में ‘जब … तब’ स्वाभाविक रूप से वही संबंध स्पष्ट करता है।
- source_word: ἐπαύσατο λαλούσα
  choice: वह बोलना बंद कर चुकी
  rationale: ἐπαύσατο रुकने या बंद होने को और λαλούσα बोलने की चल रही क्रिया को व्यक्त करता है। यह अनुवाद पूर्णता का अनावश्यक अर्थ जोड़े बिना सहज हिन्दी देता है।
- source_word: ἠλάλαξεν
  choice: जयकार की
  rationale: यह क्रिया ऊँची पुकार, कभी-कभी युद्धघोष, के लिए प्रयुक्त हो सकती है। यहाँ लोगों की आनंदपूर्ण सामूहिक प्रतिक्रिया के संदर्भ में ‘जयकार की’ उपयुक्त है, जबकि पादटिप्पणी व्यापक अर्थ-संभावना सुरक्षित रखती है।
- source_word: ὁ λαὸς
  choice: लोगों ने
  rationale: λαός यहाँ नगर के लोगों को सामूहिक रूप से दर्शाता है। ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह पदबंध पुकार की प्रबल ध्वनि बताता है। ‘ऊँचे स्वर से’ यूनानी की ठोस अभिव्यक्ति को सहज हिन्दी में बनाए रखता है।
- source_word: ἔδωκεν φωνὴν εὐφρόσυνον
  choice: आनंद का नारा लगाया
  rationale: शाब्दिक रूप से ‘आनंदपूर्ण आवाज़ दी’ हिन्दी में अस्वाभाविक होता। ‘आनंद का नारा लगाया’ सार्वजनिक, उल्लासपूर्ण पुकार का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῇ πόλει αὐτῶν
  choice: अपने नगर में
  rationale: ‘अपने’ यूनानी αὐτῶν के संबंधसूचक अर्थ को सुरक्षित रखता है और हिन्दी में कर्ता के साथ स्वाभाविक है।
