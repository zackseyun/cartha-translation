base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/012.yaml
  text: But when the sons of Asshur saw them, they sent word to their leaders; and they came to the generals and commanders of thousands and to every one of their rulers.
translation:
  language: hi
  text: पर जब अश्शूर के पुत्रों ने उन्हें देखा, तो उन्होंने अपने अगुओं के पास संदेश भेजा; और वे सेनापतियों, सहस्रपतियों और उनके हर एक शासक के पास गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἀσσοὺρ
  choice: अश्शूर के पुत्रों
  rationale: यूनानी की शाब्दिक जातीय अभिव्यक्ति ‘अश्शूर के पुत्र’ को सुरक्षित रखा गया है। हिंदी में यह बोधगम्य है और इसे केवल ‘अश्शूरी’ बनाकर मूल रूपक को मिटाने की आवश्यकता नहीं है।
- source_word: ὡς εἶδον αὐτούς
  choice: जब ... उन्हें देखा
  rationale: ὡς और भूतकालीन क्रिया यहाँ समय-संबंध व्यक्त करते हैं। ‘जैसे ही’ संभव है, पर वह तात्कालिकता को मूल से अधिक प्रबल कर सकता है; इसलिए ‘जब’ चुना गया।
- source_word: διεπέμψαν
  choice: संदेश भेजा
  rationale: क्रिया किसी व्यक्ति या सूचना को भेजने का संकेत दे सकती है, जबकि कर्म व्यक्त नहीं है। ‘संदेश भेजा’ संप्रेषण का आशय स्वाभाविक ढंग से देता है और अनकहे ‘दूतों’ को नहीं जोड़ता।
- source_word: ἐπὶ τοὺς ἡγουμένους αὐτῶν
  choice: अपने अगुओं के पास
  rationale: ἡγούμενοι अधिकार रखने वाले नेतृत्वकर्ताओं को दर्शाता है। ‘अगुए’ व्यापक, प्रतिष्ठित और इस सैन्य प्रसंग के लिए उपयुक्त हिंदी शब्द है।
- source_word: στρατηγοὺς
  choice: सेनापतियों
  rationale: सैन्य प्रसंग में στρατηγοί उच्च सैन्य अधिकारियों या सेनानायकों को सूचित करता है; ‘सेनापति’ इसका स्पष्ट और स्वाभाविक हिंदी प्रतिरूप है।
- source_word: χιλιάρχους
  choice: सहस्रपतियों
  rationale: χιλίαρχος का मूल अर्थ एक हजार पर अधिकार रखने वाला सैन्य अधिकारी है। ‘सहस्रपति’ संख्यात्मक अर्थ को संक्षेप और गरिमापूर्ण ढंग से सुरक्षित रखता है।
- source_word: ἐπὶ πάντα ἄρχοντα αὐτῶν
  choice: अपने हर एक शासक के पास
  rationale: एकवचन के साथ πᾶς का वितरणात्मक बल ‘हर एक’ से स्पष्ट होता है। ‘शासक’ ἄρχων के व्यापक अधिकार-संबंधी अर्थ को बनाए रखता है।
