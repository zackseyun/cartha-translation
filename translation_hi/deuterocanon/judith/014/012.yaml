translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण कथात्मक शैली रखी गई है। सैन्य पदों के लिए ‘सेनापति’ और ‘सहस्रपति’ चुने गए हैं; ये सामान्य पाठक के लिए संदर्भ से समझने योग्य हैं और मूल पदानुक्रम को अपेक्षाकृत ठीक रखते हैं। सर्वनामों की संभावित संदर्भगत अस्पष्टता मूल के अनुरूप बनी हुई है।
