base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/002.yaml
  text: And it shall be[a], when dawn breaks and the sun rises upon the earth, each of you shall take up your weapons of war, and every mighty man shall go out beyond the city. You shall appoint a leader over them, as though going down to the plain against the advance guard of the sons of Asshur[b]; but you shall not go down.
translation:
  language: hi
  text: और ऐसा होगा कि जब पौ फटे और धरती पर सूर्य उग आए, तब तुममें से हर एक अपने युद्ध के हथियार उठा लेना, और हर बलवान पुरुष नगर से बाहर निकल जाना। उनके ऊपर एक अगुआ नियुक्त करना और ऐसा दिखाना मानो तुम अश्शूर के पुत्रों[b] की अग्रिम टुकड़ी[a] की ओर मैदान में उतर रहे हो; पर नीचे मत उतरना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अश्शूरियों की अग्रिम चौकी।” यूनानी προφυλακή का अर्थ अग्रिम टुकड़ी, अग्रिम चौकी या आगे की पहरेदारी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अश्शूर के पुत्र” यूनानी अभिव्यक्ति का शाब्दिक अनुवाद है; इसका संकेत अश्शूरी लोगों की ओर है।
    reason: cultural_note
lexical_decisions:
- source_word: διαφαύσῃ ὁ ὄρθρος
  choice: पौ फटे
  rationale: यह भोर का प्रकाश प्रकट होने के लिए स्वाभाविक और प्रचलित आधुनिक हिन्दी मुहावरा है।
- source_word: ἐξέλθῃ ὁ ἥλιος ἐπὶ τὴν γῆν
  choice: सूर्य धरती पर निकल आए
  rationale: ἐξέρχομαι की निकलने की गति और ἐπὶ τὴν γῆν की स्थानगत छवि को बनाए रखता है, यद्यपि हिन्दी में इसे स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἀναλήμψεσθε ... τὰ σκεύη τὰ πολεμικὰ
  choice: अपने युद्ध के हथियार उठा लेना
  rationale: सैन्य संदर्भ में उपकरणों को हाथ में लेने का आशय स्पष्ट करता है; आज्ञार्थक भाव वाले भविष्यकाल को हिन्दी निर्देश के रूप में प्रस्तुत करता है।
- source_word: πᾶς ἀνὴρ ἰσχύων
  choice: हर बलवान पुरुष
  rationale: ἀνήρ के स्पष्ट पुरुषवाची अर्थ और ἰσχύων की सामर्थ्य को सुरक्षित रखता है।
- source_word: δώσετε ἀρχηγὸν εἰς αὐτούς
  choice: उनके लिए एक अगुआ नियुक्त करना
  rationale: ἀρχηγός को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा δώσετε के प्रसंगगत अर्थ को नियुक्ति के रूप में स्पष्ट करता है।
- source_word: ὡς καταβαίνοντες ἐπὶ τὸ πεδίον
  choice: ऐसा दिखाना मानो तुम ... मैदान में उतर रहे हो
  rationale: ὡς में निहित दिखावे या योजनाबद्ध आभास को स्पष्ट करता है और Judith की सैन्य युक्ति को बिना बढ़ाए संप्रेषित करता है।
- source_word: εἰς τὴν προφυλακὴν υἱῶν Ἀσσούρ
  choice: अश्शूर के पुत्रों की अग्रिम टुकड़ी की ओर
  rationale: εἰς को तटस्थ दिशात्मक 'की ओर' से प्रस्तुत किया गया है; προφυλακή के सैन्य अर्थ और 'अश्शूर के पुत्रों' की मूल अभिव्यक्ति को बनाए रखा गया है।
- source_word: οὐ καταβήσεσθε
  choice: पर नीचे मत उतरना
  rationale: निषेधात्मक निर्देश को स्वाभाविक हिन्दी आज्ञार्थक रूप में देता है और पूर्ववर्ती 'उतर रहे हो' से जानबूझकर किया गया विरोध सुरक्षित रखता है।
theological_decisions:
- issue: πᾶς ἀνὴρ ἰσχύων में पुरुषवाची सैन्य पदनाम
  choice: हर बलवान पुरुष
  alternative: हर समर्थ व्यक्ति / हर योद्धा
  rationale: मूल यूनानी में सामान्य मनुष्यवाची शब्द नहीं, बल्कि ἀνήρ है; इसलिए सैन्य संदर्भ में उसके पुरुषवाची संकेत को तटस्थ नहीं किया गया।
- issue: υἱῶν Ἀσσούρ की जातिसूचक अभिव्यक्ति
  choice: अश्शूर के पुत्रों
  alternative: अश्शूरी लोग
  rationale: मूल की रूपकात्मक वंश-संबंधी अभिव्यक्ति सुरक्षित रखी गई है, जबकि पादटिप्पणी उसका जातिसूचक आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, निर्देशात्मक और गरिमापूर्ण रखी गई है। 'पौ फटे', 'अगुआ' और 'मैदान में उतरना' सामान्य पाठक के लिए सहज हैं। मूल के भविष्यकालीन निर्देशों को हिन्दी में स्वाभाविक आज्ञार्थक रूप दिया गया है।
