base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/013.yaml
  text: And they came to Holofernes’s tent[a], and said to the one over all his affairs, “Wake our lord at once, because the servants have dared to come down against us for battle, so that they may be utterly destroyed.”
translation:
  language: hi
  text: तब वे होलोफेरनेस के तंबू के पास पहुँचे और उसके सब काम-काज पर नियुक्त व्यक्ति[a] से बोले, “हमारे स्वामी को अभी जगा दो, क्योंकि उन दासों ने हम पर आक्रमण करने के लिए नीचे उतर आने का दुस्साहस किया है, ताकि उनका पूरी तरह नाश कर दिया जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी सभी वस्तुओं पर नियुक्त व्यक्ति”; अर्थात होलोफेरनेस का प्रधान प्रबंधक या परिचारक।
    reason: मूल यूनानी पदबंध असहज है और अधिकारी का निश्चित पदनाम नहीं बताता; टिप्पणी शाब्दिक रूप तथा सम्भावित कार्य दोनों स्पष्ट करती है।
lexical_decisions:
- source_word: παρεγένοντο ἐπὶ τὴν σκηνὴν
  choice: तंबू के पास पहुँचे
  rationale: सैन्य प्रसंग में σκηνή सामान्य तंबू है, और ἐπί के साथ यह वाक्यांश वहाँ पहुँचने का भाव देता है।
- source_word: τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ
  choice: उसके सब काम-काज पर नियुक्त व्यक्ति
  rationale: यूनानी पाठ का पदबंध कुछ असहज है, पर आशय होलोफेरनेस की सारी व्यवस्था पर नियुक्त मुख्य सेवक या अधिकारी से है। अनुवाद कोई ऐसा औपचारिक पदनाम नहीं जोड़ता जो मूल में स्पष्ट नहीं है।
- source_word: Ἔγειρον δὴ
  choice: अभी जगा दो
  rationale: आज्ञार्थक क्रिया और δή की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κύριον
  choice: स्वामी
  rationale: यहाँ κύριος मनुष्य-अधिपति होलोफेरनेस के लिए है, परमेश्वर की उपाधि के रूप में नहीं।
- source_word: οἱ δοῦλοι
  choice: उन दासों
  rationale: वक्ता शत्रुओं के लिए तिरस्कारपूर्ण अधीनता-सूचक शब्द इस्तेमाल करते हैं; ‘दास’ δοῦλοι की तीखी सामाजिक और अपमानजनक शक्ति को ‘सेवक’ से अधिक ठीक रखता है।
- source_word: καταβαίνειν ἐφʼ ἡμᾶς εἰς πόλεμον
  choice: हमारे विरुद्ध युद्ध करने के लिए नीचे उतर आने
  rationale: यह सैन्य आक्रमण के साथ मूल की स्थानिक ‘नीचे उतरने’ की छवि भी बनाए रखता है।
- source_word: ἵνα ἐξολοθρευθῶσιν εἰς τέλος
  choice: ताकि उनका पूरी तरह नाश कर दिया जाए
  rationale: ἐξολοθρεύω और εἰς τέλος मिलकर सम्पूर्ण विनाश पर बल देते हैं; कर्मवाच्य भी सुरक्षित रखा गया है।
theological_decisions:
- issue: सैन्य अपमान के प्रसंग में δοῦλοι का अनुवाद
  choice: दासों
  alternative: सेवकों
  rationale: यह सम्मानसूचक सेवा नहीं, बल्कि कथित रूप से अधीन शत्रुओं के लिए तिरस्कारपूर्ण संबोधन है; इसलिए ‘दास’ मूल की शक्ति और तनाव को अधिक स्पष्टता से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘काम-काज’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘स्वामी’, ‘दास’ और ‘दुस्साहस’ प्रसंग की अधीनता, तिरस्कार और सैन्य तात्कालिकता को बनाए रखते हैं।
