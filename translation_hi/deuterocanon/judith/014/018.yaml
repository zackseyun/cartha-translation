base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/018.yaml
  text: The servants have failed; one woman of the Hebrews has brought shame on the house of King Nebuchadnezzar. For look—Holofernes is lying on the ground[a], and his head is not on him.
translation:
  language: hi
  text: दासों[a] ने अपने कर्तव्य में चूक की है; इब्रानियों की एक स्त्री ने राजा नबूकदनेस्सर के घराने पर कलंक लगाया है। क्योंकि देखो—होलोफेरनेस भूमि पर पड़ा है, और उसका सिर उसके शरीर पर नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवकों’। यूनानी शब्द δοῦλοι प्रसंग के अनुसार दासों या सेवकों को सूचित कर सकता है; यहाँ दासत्व की स्थिति का अर्थ अधिक सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠθέτησαν
  choice: विश्वासघात किया है
  rationale: ἀθετέω यहाँ अधीनस्थों द्वारा अपने दायित्व और निष्ठा में घोर चूक को व्यक्त करता है। ‘विश्वासघात किया है’ आरोप की तीव्रता को रखता है, पर किसी कानूनी या वाचागत अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: οἱ δοῦλοι
  choice: दासों
  rationale: शाही-सैनिक घराने के इस प्रसंग में δοῦλοι अधिकाराधीन और बंधुआ हैसियत वाले सेवकों को सूचित करता है; इसलिए ‘दास’ मूल शब्द की सामाजिक स्थिति को ‘सेवक’ से अधिक स्पष्ट रूप में रखता है।
- source_word: ἐποίησεν αἰσχύνην
  choice: कलंक लगाया है
  rationale: यूनानी मुहावरे का शब्दशः अर्थ ‘लज्जा की’ है। हिन्दी में ‘घराने पर कलंक लगाया’ सार्वजनिक अपमान और उसके परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μία γυνὴ τῶν Ἑβραίων
  choice: इब्रानियों की एक स्त्री
  rationale: यह रूप μία के ‘एक’ पर दिए गए बल और स्त्री की इब्रानी पहचान, दोनों को बनाए रखता है।
- source_word: εἰς τὸν οἶκον τοῦ βασιλέως Ναβουχοδονόσορ
  choice: राजा नबूकदनेस्सर के घराने पर
  rationale: αἰσχύνη के साथ εἰς अपमान के घराने पर आने का भाव देता है। ‘घराना’ यहाँ केवल भवन नहीं, राजा के राजकीय परिवार और प्रतिष्ठान को सूचित करता है।
- source_word: χαμαί
  choice: भूमि पर पड़ा है
  rationale: χαμαί का मूल अर्थ ‘भूमि पर’ है; दृश्य में होलोफेरनेस की अवस्था स्पष्ट करने के लिए ‘पड़ा है’ स्वाभाविक हिन्दी है।
- source_word: ἡ κεφαλὴ οὐκ ἔστιν ἐπʼ αὐτῷ
  choice: उसका सिर उसके शरीर पर नहीं है
  rationale: यह यूनानी की कठोर, दृश्यात्मक अभिव्यक्ति को बनाए रखता है। ‘शरीर’ हिन्दी में αὐτῷ के आशय को स्पष्ट करता है, बिना वाक्य को केवल ‘उसका सिर काट दिया गया है’ के रूप में व्याख्यायित किए।
theological_decisions:
- issue: गैर-दृष्टान्तात्मक कथानक में δοῦλοι का अनुवाद
  choice: दासों
  alternative: सेवकों
  rationale: यहाँ शब्द शाही-सैनिक घराने में अधिकाराधीन व्यक्तियों के लिए है। ‘दास’ उनकी बंधुआ सामाजिक स्थिति को सुरक्षित रखता है, जबकि ‘सेवक’ उस अर्थ को नरम कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गम्भीर, नाटकीय और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘इब्रानियों की एक स्त्री’ मूल के बलाघात को और ‘उसका सिर उसके शरीर पर नहीं है’ मूल की स्तब्धकारी ठोस छवि को सुरक्षित रखते हैं।
