lexical_decisions:
- source_word: Ἀκούσατε δή μου
  choice: मेरी बात सुनो
  rationale: आज्ञार्थक क्रिया के साथ δή की आग्रह और तत्परता की छाया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी संबोधन पुल्लिंग बहुवचन है और प्रसंग में बेतूलिया के पुरुषों को संबोधित किया गया है।
- source_word: λαβόντες
  choice: ले जाकर
  rationale: यह कृदंत मुख्य आज्ञा से पहले होने वाली क्रिया बताता है; हिन्दी में ‘ले जाकर ... लटका दो’ क्रम और संबंध दोनों को सहज रूप से रखता है।
- source_word: τὴν κεφαλὴν ταύτην
  choice: इस सिर को
  rationale: मूल में केवल ‘यह सिर’ है; ‘कटा हुआ’ जोड़ना प्रसंगगत बात को पाठ में अनावश्यक रूप से स्पष्ट करना होगा।
- source_word: κρεμάσατε
  choice: लटका दो
  rationale: ठोस क्रिया और आज्ञार्थक बल को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τῆς ἐπάλξεως
  choice: कंगूरे पर
  rationale: ἐπάλξ नगर की रक्षात्मक दीवार के ऊपरी कंगूरे या परकोटे को सूचित करता है; ‘कंगूरा’ इस स्थापत्य और सैन्य संदर्भ को संक्षेप में व्यक्त करता है।
- source_word: τοῦ τείχους ὑμῶν
  choice: अपने शहरपनाह के
  rationale: τεῖχος प्रसंग में नगर की रक्षात्मक दीवार है। ‘शहरपनाह’ साधारण ‘दीवार’ की अपेक्षा इस अर्थ को अधिक स्पष्टता से देता है।
