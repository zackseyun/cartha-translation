base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/007.yaml
  text: And when they had taken him up[a], he fell at Judith’s feet and bowed before her, and he said, “Blessed are you in every dwelling of Judah and among every nation[b]; those who hear your name will be thrown into confusion.”
translation:
  language: hi
  text: जब उन्होंने उसे उठाया, तब वह यूदित के चरणों में गिर पड़ा और उसके सामने दण्डवत् हुआ। उसने कहा, “यहूदा के हर निवास[a] में और हर जाति में तुम धन्य हो; जो लोग तुम्हारा नाम सुनेंगे, वे विचलित हो जाएँगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के हर तम्बू में।” यूनानी शब्द का अर्थ ‘तम्बू’ अथवा अधिक व्यापक रूप में ‘निवास’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “व्याकुल हो जाएँगे” अथवा “हिल जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέλαβον
  choice: उठाया
  rationale: यहाँ क्रिया का स्वाभाविक अर्थ उसे उठाने या उठने में सहायता देने की ठोस क्रिया है; ‘ग्रहण किया’ संदर्भ में अधिक अस्पष्ट और अस्वाभाविक होता।
- source_word: προσέπεσεν τοῖς ποσὶν
  choice: चरणों में गिर पड़ा
  rationale: यह शारीरिक मुद्रा और सम्मान/विनय दोनों को स्वाभाविक हिन्दी मुहावरे में बनाए रखता है।
- source_word: προσεκύνησεν τῷ προσώπῳ αὐτῆς
  choice: उसके सामने दण्डवत् किया
  rationale: प्रसंग में यह एक मनुष्य के प्रति सम्मानपूर्ण प्रणति है। ‘दण्डवत् किया’ शारीरिक झुकाव को रखता है, जबकि ‘आराधना की’ जैसा ईश्वरीय उपासना का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: Εὐλογημένη σὺ
  choice: तू धन्य है
  rationale: यह आशीर्वाद की सीधी और गरिमापूर्ण अभिव्यक्ति है; संबोधन की निकटता और एकवचन को बनाए रखता है।
- source_word: ἐν παντὶ σκηνώματι Ἰούδα
  choice: यहूदा के हर निवास में
  rationale: σκηνώμα तम्बू या व्यापक अर्थ में निवास हो सकता है। मुख्य पाठ में ‘निवास’ स्वाभाविक है और पादटिप्पणी तम्बू वाले ठोस अर्थ को सुरक्षित रखती है।
- source_word: ἐν παντὶ ἔθνει
  choice: हर जाति के बीच
  rationale: यह यूदित की ख्याति को यहूदा से बाहर सभी जनसमुदायों तक फैलते हुए व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: ταραχθήσονται
  choice: विचलित हो जाएँगे
  rationale: यह भविष्यत् कर्मवाच्य के अशान्त, व्याकुल या हिल जाने के व्यापक भाव को रखता है, उसे केवल भय या भ्रम तक सीमित नहीं करता।
theological_decisions:
- issue: यूदित के प्रति προσκυνέω का अर्थ
  choice: सम्मानपूर्ण प्रणति के रूप में ‘दण्डवत् किया’
  alternative: ‘उसकी आराधना की’ या ‘उसके आगे झुका’
  rationale: क्रिया का लक्ष्य यहाँ मनुष्य यूदित है। चुना हुआ रूप शारीरिक प्रणति और सम्मान को व्यक्त करता है, पर दिव्य उपासना का अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘तू’ मूल यूनानी के एकवचन प्रत्यक्ष संबोधन और आशीर्वचन की काव्यात्मक निकटता को बनाए रखता है। पादटिप्पणी-चिह्न उन्हीं शब्दों पर लगाए गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
