base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/010.yaml
  text: And when Achior saw all that the God of Israel had done[a], he believed in God greatly, and he circumcised the flesh of his foreskin[b], and was joined to the house of Israel to this day.
translation:
  language: hi
  text: और जब अकीओर ने वह सब देखा जो इस्राएल के परमेश्वर ने किया था, तो उसने परमेश्वर पर बहुत विश्वास किया[a], अपनी अग्रत्वचा का खतना कराया, और आज के दिन तक इस्राएल के घराने में सम्मिलित कर लिया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने परमेश्वर पर बहुत भरोसा रखा।” यूनानी क्रिया विश्वास, आस्था या भरोसे पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल के घराने में जोड़ दिया गया।” यह अकीओर के इस्राएल की प्रजा में सम्मिलित होने का वर्णन है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: जब ... देखा
  rationale: एओरिस्ट कृदन्त मुख्य घटनाओं की समयगत, और प्रसंगतः कारणगत, परिस्थिति बताता है; आधुनिक हिन्दी में ‘जब ... देखा’ स्वाभाविक है।
- source_word: πάντα ὅσα ἐποίησεν ὁ θεὸς τοῦ Ἰσραήλ
  choice: वह सब ... जो इस्राएल के परमेश्वर ने किया था
  rationale: यह अभी-अभी वर्णित परमेश्वर के सभी कार्यों की समग्रता व्यक्त करता है; पूर्वकालिकता के लिए ‘किया था’ उपयुक्त है।
- source_word: ἐπίστευσεν τῷ θεῷ σφόδρα
  choice: उसने परमेश्वर पर बहुत विश्वास किया
  rationale: πιστεύω के विश्वास और भरोसे—दोनों अर्थक्षेत्रों को हिन्दी ‘विश्वास करना’ सँभालता है; दत्तिव परमेश्वर को विश्वास के लक्ष्य के रूप में और σφόδρα उसकी तीव्रता को दिखाता है।
- source_word: περιέτεμετο τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ
  choice: अपनी खलड़ी का खतना कराया
  rationale: मध्यवाच्य रूप को हिन्दी में ‘खतना कराया’ स्वाभाविक रूप से व्यक्त करता है और स्वयं पर हुई क्रिया का भाव बनाए रखता है; ‘खलड़ी’ शारीरिक संदर्भ को स्पष्ट रखती है।
- source_word: προσετέθη πρὸς τὸν οἶκον Ἰσραήλ
  choice: वह इस्राएल के घराने में मिला लिया गया
  rationale: कर्मवाच्य रूप और समुदाय में सम्मिलित किए जाने का भाव दोनों सुरक्षित हैं; ‘घराना’ οἶκος की बाइबलीय सामुदायिक अभिव्यक्ति बनाए रखता है।
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: आज के दिन तक ऐसा ही है
  rationale: वर्णनकर्ता के वर्तमान समय तक बनी स्थिति को हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परिवर्तन-सदृश प्रसंग में πιστεύω का अर्थ
  choice: उसने परमेश्वर पर बहुत विश्वास किया
  alternative: उसने परमेश्वर पर बहुत भरोसा रखा
  rationale: मूल क्रिया विश्वास, आस्था या भरोसा व्यक्त कर सकती है। मुख्य पाठ में ‘विश्वास’ शब्द-परिवार का संबंध सुरक्षित है, जबकि पादटिप्पणी वास्तविक अर्थ-विकल्प बताती है; बाद की कोई धर्मसैद्धान्तिक संकल्पना नहीं जोड़ी गई।
- issue: इस्राएल में सम्मिलित किया जाना
  choice: इस्राएल के घराने में मिला लिया गया
  alternative: इस्राएल के घराने में जोड़ दिया गया
  rationale: मूल का कर्मवाच्य और सामुदायिक समावेशन व्यक्त होता है, पर ‘धर्मान्तरित’ या किसी बाद के तकनीकी पद को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएल का परमेश्वर’ और ‘इस्राएल का घराना’ जैसी बाइबलीय अभिव्यक्तियाँ सुरक्षित हैं। शारीरिक विवरण में अनावश्यक शाब्दिक कठोरता से बचते हुए मूल का स्पष्ट अर्थ रखा गया है।
