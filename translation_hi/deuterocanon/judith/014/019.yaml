base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/019.yaml
  text: But when the commanders of the army of Assyria heard the words[a], they tore their tunics, and their souls were greatly troubled[b], and there arose a very great cry and outcry in the midst of the camp.
translation:
  language: hi
  text: पर जब अश्शूर की सेना के सेनापतियों ने वे बातें सुनीं, तो उन्होंने अपने अंगवस्त्र फाड़ डाले[a]। उनका मन अत्यन्त व्याकुल हो उठा[b], और छावनी के बीचोंबीच बहुत बड़ा चीत्कार और कोलाहल उठ खड़ा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंगवस्त्र फाड़ना शोक, आघात या गहरी व्यथा प्रकट करने की प्रचलित रीति थी।
    reason: cultural_note
  - marker: b
    text: या ‘उनका प्राण अत्यन्त व्याकुल हो उठा’ अथवा ‘उनकी आत्मा अत्यन्त व्याकुल हो उठी।’ यूनानी में शाब्दिक रूप से ‘उनका प्राण’ एकवचन में है और पूरे समूह के लिए सामूहिक भाव से प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν τὰ ῥήματα
  choice: पर जब ... ने ये बातें सुनीं
  rationale: ὡς अतीतकालीन क्रिया के साथ समयसूचक उपवाक्य बनाता है; δέ कथा में हल्का मोड़ दिखाता है। τὰ ῥήματα का आशय पहले कही गई बातों से है, इसलिए ‘ये बातें’ स्वाभाविक और संदर्भानुकूल है।
- source_word: οἱ ἄρχοντες τῆς δυνάμεως Ἀσσούρ
  choice: अश्शूर की सेना के सेनापति
  rationale: सैन्य संदर्भ में ἄρχοντες नेतृत्व करने वाले अधिकारी और δύναμις सैन्य बल को सूचित करता है। ‘सेनापति’ और ‘सेना’ आधुनिक हिन्दी में स्पष्ट हैं।
- source_word: τοὺς χιτῶνας αὐτῶν διέρρηξαν
  choice: उन्होंने अपने अंगरखे फाड़ डाले
  rationale: χιτών एक विशिष्ट पहना जाने वाला वस्त्र है; ‘अंगरखा’ सामान्य ‘वस्त्र’ की अपेक्षा ठोस चित्र बनाए रखता है। ‘फाड़ डाले’ क्रिया की तीव्रता और पूर्णता व्यक्त करता है।
- source_word: ἐταράχθη αὐτῶν ἡ ψυχὴ σφόδρα
  choice: उनका मन अत्यन्त व्याकुल हो उठा
  rationale: यूनानी में ψυχή एकवचन में सामूहिक भाव से आया है। हिन्दी का सामूहिक एकवचन ‘उनका मन’ इस रूप को स्वाभाविक ढंग से बचाता है; ‘अत्यन्त व्याकुल’ σφόδρα की तीव्रता व्यक्त करता है।
- source_word: ἐγένετο αὐτῶν κραυγὴ καὶ βοὴ μεγάλη σφόδρα
  choice: बहुत भारी चीत्कार और कोलाहल मच गया
  rationale: κραυγή और βοή के दोहरे शब्द-प्रयोग को ‘चीत्कार और कोलाहल’ से बनाए रखा गया है। ‘मच गया’ ἐγένετο का इस प्रसंग में स्वाभाविक हिन्दी रूप है, और ‘बहुत भारी’ μεγάλη σφόδρα की प्रबलता दर्शाता है।
- source_word: ἐν μέσῳ τῆς παρεμβολῆς
  choice: छावनी के बीच
  rationale: παρεμβολή यहाँ सैन्य छावनी है और ἐν μέσῳ का निकट तथा सहज अनुवाद ‘के बीच’ है।
theological_decisions:
- issue: ψυχή का मानव-अंतरंग संबंधी अर्थ और सामूहिक एकवचन
  choice: उनका मन
  alternative: उनका प्राण / उनकी आत्मा
  rationale: ψυχή यहाँ भावनात्मक रूप से व्याकुल आंतरिक जीवन को दर्शाता है। ‘मन’ हिन्दी में प्रसंगानुकूल है, जबकि पादटिप्पणी ‘प्राण’ और ‘आत्मा’ की वास्तविक शाब्दिक संभावनाओं को खुला रखती है और किसी विशिष्ट मानवशास्त्रीय सिद्धान्त को आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य पदावली स्पष्ट है; ‘अंगरखा’ प्राचीन वस्त्र का ठोस बिंब देता है। समानार्थी यूनानी युग्म को ‘चीत्कार और कोलाहल’ के रूप में बचाया गया है।
