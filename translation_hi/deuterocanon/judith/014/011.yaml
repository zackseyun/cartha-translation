  text: When dawn came up, they hung the head of Holofernes from the wall, and every man of Israel took up his weapons and went out in companies to the mountain passes.
translation:
  language: hi
  text: जब भोर हुई, तो उन्होंने होलोफेरनेस का सिर दीवार से लटका दिया[a], और इस्राएल के सभी पुरुषों ने अपने-अपने हथियार उठाए और टुकड़ियों में चढ़ाइयों की ओर निकल पड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दीवार पर।” यूनानी में शाब्दिक रूप से “दीवार से” है; इससे उस स्थान का संकेत मिलता है जहाँ से सिर प्रदर्शन के लिए लटकाया गया था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “चढ़ाइयों की ओर”; इससे ऊपर जाने वाले मार्ग या पहाड़ी दर्रे अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡνίκα δὲ ὁ ὄρθρος ἀνέβη
  choice: जब भोर हुई, तब
  rationale: यह स्वाभाविक आधुनिक हिन्दी में समय का परिवर्तन व्यक्त करता है। यूनानी में भोर के ‘ऊपर आने’ का बिंब है, पर हिन्दी में ‘भोर हुई’ उसी आशय को स्पष्ट और सहज रूप में पहुँचाता है; δὲ के हल्के संयोजक बल को ‘तब’ से व्यक्त किया गया है।
- source_word: ἐκρέμασαν τὴν κεφαλὴν Ὀλοφέρνου
  choice: उन्होंने होलोफेरनेस का सिर ... लटका दिया
  rationale: क्रिया के सामान्य अर्थ और सार्वजनिक प्रदर्शन की घटना को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ἐκ τοῦ τείχους
  choice: दीवार से
  rationale: ἐκ के मूल स्थान-संबंध को सुरक्षित रखता है—सिर दीवार के किसी बिंदु से लटकाया गया था। हिन्दी में ‘दीवार पर’ भी प्रसंगानुसार संभव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: इस्राएल के हर पुरुष
  rationale: यूनानी के स्पष्ट पुल्लिंग एकवचन और वितरणात्मक बल को बनाए रखता है।
- source_word: ἀνέλαβεν ... τὰ ὅπλα αὐτοῦ
  choice: अपने हथियार उठा लिए
  rationale: सैनिक प्रसंग में हथियार धारण करने का स्वाभाविक हिन्दी प्रयोग है; ὅπλα को केवल कवच तक सीमित नहीं करता।
- source_word: κατὰ σπείρας
  choice: टुकड़ियों में
  rationale: व्यवस्थित सैनिक समूहों का अर्थ सरल और प्रचलित हिन्दी में व्यक्त करता है, बिना किसी निश्चित तकनीकी इकाई का आकार आरोपित किए।
- source_word: ἐπὶ τὰς ἀναβάσεις
  choice: चढ़ाई वाले रास्तों की ओर
  rationale: शाब्दिक ‘चढ़ाइयों की ओर’ के भौगोलिक अर्थ को स्वाभाविक हिन्दी में रखता है और ‘पहाड़ी दर्रों’ जैसी अधिक निश्चित व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
