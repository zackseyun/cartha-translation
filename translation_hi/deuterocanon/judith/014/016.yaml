translation:
  language: hi
  text: और वह रोने, कराहने और ज़ोरदार पुकार के साथ ऊँचे स्वर में चिल्लाया, और उसने अपने वस्त्र फाड़ डाले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησεν
  choice: चिल्ला उठा
  rationale: यह क्रिया ऊँची और तीव्र पुकार को व्यक्त करती है; ‘चिल्ला उठा’ आकस्मिकता और प्रबल भाव, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह यूनानी मुहावरे का स्पष्ट और स्वाभाविक हिन्दी रूप है, जो आवाज़ की ऊँचाई बनाए रखता है।
- source_word: μετὰ κλαυθμοῦ
  choice: वह रोया
  rationale: κλαυθμός शोक में रोने को दर्शाता है। हिन्दी में अलग क्रिया के रूप में इसे रखना स्रोत की क्रमिक, तीव्र होती अभिव्यक्तियों को सहज बनाता है।
- source_word: στεναγμοῦ
  choice: कराहा
  rationale: στεναγμός कराहने अथवा गहरी आह भरने का भाव रख सकता है; इस तीव्र शोक-संदर्भ में ‘कराहा’ अधिक उपयुक्त है।
- source_word: βοῆς ἰσχυρᾶς
  choice: ज़ोर से विलाप करने लगा
  rationale: यह पहले आए ऊँचे स्वर की केवल पुनरावृत्ति न होकर तीव्र शोकपूर्ण पुकार को व्यक्त करता है; ‘विलाप’ प्रसंग को स्पष्ट करता है, जबकि ‘ज़ोर से’ ἰσχυρᾶς की शक्ति बनाए रखता है।
- source_word: διέρρηξεν
  choice: फाड़ डाले
  rationale: क्रिया वस्त्र फाड़ने की पूर्ण और प्रबल क्रिया बताती है; ‘फाड़ डाले’ आधुनिक हिन्दी में इसकी तीव्रता व्यक्त करता है।
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: अपने वस्त्र
  rationale: ‘वस्त्र’ गरिमापूर्ण और सांस्कृतिक शोक-क्रिया के अनुकूल है; आत्मवाचक ‘अपने’ हिन्दी में कर्ता से स्वामित्व स्वाभाविक रूप से जोड़ता है।
