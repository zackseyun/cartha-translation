  text: But when no one answered[a], he drew aside the curtain and went into the bedroom, and found him lying dead on the canopy[b], and his head had been taken from him.
translation:
  language: hi
  text: लेकिन जब किसी ने उत्तर नहीं दिया, तो वह परदा हटाकर शयनकक्ष में गया। वहाँ उसने उसे पलंग की छतरी[a] पर फेंका हुआ मृत पाया; उसका सिर उससे अलग कर दिया गया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पलंग की जाली पर’ अथवा ‘पलंग से जुड़े लटकते आवरण पर।’ यूनानी शब्द का ठीक-ठीक आशय अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, ‘उसका सिर उससे ले लिया गया था’; अर्थात उसका सिर काट दिया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ οὐθεὶς ἐπήκουσεν
  choice: लेकिन जब किसी ने उत्तर नहीं दिया
  rationale: संदर्भ में ἐπακούω किसी पुकार का प्रत्युत्तर देने के अर्थ में है; इसलिए स्वाभाविक हिन्दी में ‘उत्तर नहीं दिया’ उपयुक्त है।
- source_word: διαστείλας
  choice: परदा हटाकर
  rationale: क्रिया का मूल भाव किसी वस्तु को अलग या एक ओर करना है। शयनकक्ष के प्रसंग में निहित वस्तु परदा अथवा लटकता आवरण है।
- source_word: κοιτῶνα
  choice: शयनकक्ष
  rationale: κοιτών सोने के कमरे को दर्शाता है; ‘शयनकक्ष’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: ἐπὶ τῆς χελώνιδος
  choice: पलंग की छतरी पर
  rationale: χελωνίς यहाँ पलंग से जुड़ी छतरी, जाली या लटकते आवरण का संकेत देती है। मुख्य पाठ में ‘पलंग की छतरी’ बोधगम्य है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐρριμμένον νεκρόν
  choice: मृत पड़ा
  rationale: ἐρριμμένον फेंके जाने के परिणामस्वरूप पड़े होने की अवस्था बताता है। ‘मृत पड़ा’ सहज हिन्दी है; शरीर की स्थिति को व्यक्त करता है, यद्यपि ‘फेंका हुआ’ का बल कुछ मंद पड़ता है।
- source_word: ἡ κεφαλὴ αὐτοῦ ἀφῄρητο ἀπʼ αὐτοῦ
  choice: उसका सिर उससे अलग कर दिया गया था
  rationale: यह यूनानी की प्रत्यक्ष और आघातपूर्ण अभिव्यक्ति को बनाए रखता है तथा केवल संक्षिप्त व्याख्यात्मक शब्द ‘सिर काट दिया गया था’ में नहीं बदलता।
