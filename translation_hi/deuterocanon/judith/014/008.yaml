base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/008.yaml
  text: And now tell me what you have done in these days[a]. And Judith reported to him, in the midst of the people, all that she had done[b], from the day when she went out until the time when she was speaking to them.
translation:
  language: hi
  text: “और अब मुझे बताओ कि इन दिनों में तुमने क्या-क्या किया है।” तब यूदीत ने लोगों के बीच[a] उसे वह सब बताया जो उसने उस दिन से, जब वह बाहर निकली थी, लेकर उस समय तक, जब वह उनसे बात कर रही थी[b], किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों के सामने।” यूनानी पदबंध लोगों के बीच स्थित होने या सार्वजनिक रूप से उनके सामने बोलने—दोनों में से किसी बात पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब उसने उनसे बात की।” यूनानी क्रिया अपूर्ण भूतकाल में है; यह बोलने की जारी क्रिया पर बल दे सकती है या कथा में सामान्य भूतकाल के समान प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγγειλόν μοι
  choice: मुझे बताओ
  rationale: आज्ञार्थक क्रिया व्यक्तिगत रूप से पूरा वृत्तांत सुनाने को कहती है; ‘मुझे बताओ’ आधुनिक हिन्दी में स्वाभाविक है और μοι को स्पष्ट रखता है।
- source_word: ὅσα ἐποίησας
  choice: क्या-क्या किया है
  rationale: ὅσα किए गए सभी कार्यों की ओर संकेत करता है। ‘क्या-क्या’ उस बहुविधता को सहज हिन्दी में व्यक्त करता है, और ‘किया है’ हाल की घटनाओं से वर्तमान प्रश्न का संबंध बनाए रखता है।
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: इन दिनों में
  rationale: यह यूनानी काल-सूचक पदबंध का सीधा और अर्थ की दृष्टि से अनिर्णायक अनुवाद है; इसे केवल बीते हुए दिनों तक सीमित नहीं किया गया।
- source_word: ἀπήγγειλεν αὐτῷ
  choice: उसे ... बताया
  rationale: यह पहले प्रयुक्त ἀνάγγειλον से संबंधित क्रिया है और वृत्तांत देने का भाव रखती है। हिन्दी में ‘बताया’ स्वाभाविक है; ‘उसे’ αὐτῷ को व्यक्त करता है।
- source_word: ἐν μέσῳ τοῦ λαοῦ
  choice: लोगों के बीच
  rationale: यह स्थानगत अर्थ को सहज और स्पष्ट हिन्दी में रखता है, जबकि सार्वजनिक रूप से लोगों के सामने कहने की संभावित छाया को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: πάντα ὅσα ἦν πεποιηκυῖα
  choice: वह सब ... जो उसने ... किया था
  rationale: यूनानी परिप्रयुक्त पूर्णभूत रूप पहले पूरे हो चुके कार्यों को पीछे मुड़कर देखता है; हिन्दी का ‘किया था’ यही कालगत संबंध व्यक्त करता है।
- source_word: ἀφʼ ἧς ἡμέρας ἐξῆλθεν
  choice: उस दिन से ... जब वह बाहर निकली थी
  rationale: ἐξῆλθεν का मूल अर्थ ‘बाहर निकली’ है। अनुवाद अनावश्यक रूप से नगर या किसी विशेष स्थान को नहीं जोड़ता।
- source_word: ἕως οὗ ἐλάλει αὐτοῖς
  choice: उस समय तक जब वह उनसे बात कर रही थी
  rationale: ‘बात कर रही थी’ अपूर्ण भूतकाल ἐλάλει की जारी क्रिया को बनाए रखता है और αὐτοῖς को ‘उनसे’ के रूप में व्यक्त करता है।
