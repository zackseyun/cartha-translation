  text: And Bagoas went in and knocked on the curtain of the tent[b][a], for he assumed that he was sleeping with Judith.
translation:
  language: hi
  text: तब बगोआस अंदर गया और उसने तंबू के परदे को खटखटाया।[a] क्योंकि वह समझता था कि होलोफेरनेस यूदित के साथ सो रहा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसने तंबू के लटकते परदे को ठोका।” यूनानी क्रिया का अर्थ ‘ठोकना’ या ‘खटखटाना’ हो सकता है; यहाँ परदे पर संकेत देने का आशय है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में होलोफेरनेस का नाम नहीं, बल्कि पुरुषवाचक सर्वनाम है; प्रसंग से उसका संकेत होलोफेरनेस की ओर है। यह बगोआस का अनुमान है, प्रत्यक्ष कथन नहीं।
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: भीतर गया
  rationale: यह εἰσέρχομαι के भूतकालीन कथात्मक रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और स्थान के भीतर जाने की गति बनाए रखता है।
- source_word: ἔκρουσε
  choice: थपथपाया
  rationale: κρούω का मूल अर्थ प्रहार करना या खटखटाना है। कपड़े के परदे के प्रसंग में ‘थपथपाया’ संकेत देने की क्रिया को हिंसक अर्थ दिए बिना स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν αὐλαίαν τῆς σκηνῆς
  choice: तंबू के परदे पर
  rationale: αὐλαία यहाँ तंबू के प्रवेश का लटकता परदा है और σκηνή साधारण तंबू; ‘परदा’ और ‘तंबू’ स्पष्ट तथा प्रसंगानुकूल हैं।
- source_word: ὑπενόειτο
  choice: उसका अनुमान था
  rationale: यह बगोआस की धारणा या अनुमान को व्यक्त करता है, उसे निश्चित तथ्य के रूप में प्रस्तुत नहीं करता।
- source_word: αὐτὸν
  choice: होलोफेरनेस
  rationale: यूनानी में पुरुषवाचक सर्वनाम ‘उसे/वह’ है; हिन्दी में लगातार आने वाले सर्वनाम से बगोआस को ही सोता हुआ समझने की गलतफहमी हो सकती थी, इसलिए प्रसंग से स्पष्ट संदर्भित व्यक्ति का नाम रखा गया है।
- source_word: καθεύδειν μετὰ Ἰουδείθ
  choice: यूदित के साथ सो रहा है
  rationale: यह ‘सोना’ और μετά के सामान्य अर्थ ‘के साथ’ को बनाए रखता है तथा प्रसंगगत यौन संकेत को न तो मिटाता है, न उससे अधिक स्पष्ट करता है।
- source_word: Βαγώας / Ἰουδείθ
  choice: बगोआस / यूदित
  rationale: व्यक्तिनामों को यूनानी रूपों के निकट देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: यूदित के साथ सोने का आशय
  choice: ‘के साथ सो रहा है’ रखकर अभिव्यक्ति को संकेतात्मक रहने दिया गया है।
  alternative: इसे स्पष्ट रूप से यौन संबंध के अर्थ में खोलकर कहना।
  rationale: यूनानी καθεύδειν μετά का शाब्दिक कथन सोने का है; कथा में अधिक अंतरंग अर्थ का संकेत हो सकता है, पर पाठ उसे सीधे नहीं कहता।
- issue: बगोआस की धारणा और वास्तविकता
  choice: ‘उसका अनुमान था’ कहा गया है।
  alternative: होलोफेरनेस के यूदित के साथ सोने को तथ्य की तरह कहना।
  rationale: ὑπενόειτο धारणा/अनुमान व्यक्त करता है; अनुवाद को वह धारणा तथ्य के रूप में प्रमाणित नहीं करनी चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और कथात्मक रखी गई है। ‘थपथपाया’ कपड़े के परदे पर संकेत देने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। ‘यूदित के साथ सो रहा है’ मूल की संभावित दोहरी अर्थच्छाया को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
