lexical_decisions:
- source_word: ἀναλαβόντες
  choice: उठा लेने के बाद
  rationale: एओरिस्ट कृदन्त मुख्य क्रियाओं से पहले पूरी हुई क्रिया दिखाता है; यह प्रयोग क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οὗτοι
  choice: ये लोग
  rationale: संकेतवाचक शब्द का बल बनाए रखते हुए सैन्य प्रसंग में निहित बहुवचन व्यक्तियों को स्पष्ट करता है।
- source_word: τὰς πανοπλίας αὐτῶν
  choice: अपने सारे हथियार
  rationale: πανοπλία पूर्ण युद्ध-साज या समूचे हथियारों को सूचित करता है; 'सारे हथियार' सामान्य पाठक के लिए स्वाभाविक है और पूर्णता का भाव भी रखता है।
- source_word: τὴν παρεμβολὴν αὐτῶν
  choice: अपने छावनी में
  rationale: सैन्य प्रसंग में παρεμβολή का अर्थ छावनी है; αὐτῶν को 'अपने' से व्यक्त किया गया है।
- source_word: ἐγεροῦσι
  choice: जगाएँगे
  rationale: ἐγείρω यहाँ सोए हुए सैन्य अधिकारियों को जगाने के प्रत्यक्ष अर्थ में स्वाभाविक है; व्यापक 'सचेत करेंगे' की अपेक्षा मूल का ठोस भाव सुरक्षित रहता है।
- source_word: τοὺς στρατηγοὺς
  choice: सेनापतियों
  rationale: στρατηγός सैन्य कमांडरों को दर्शाता है; 'सेनापति' आधुनिक हिन्दी में गरिमापूर्ण और पद की अनावश्यक आधुनिक विशिष्टता से मुक्त है।
- source_word: τῆς δυνάμεως Ἀσσούρ
  choice: अश्शूर की सेना
  rationale: δύναμις इस सैन्य संबंध में सेना को सूचित करता है, और Ἀσσούρ का पारंपरिक हिन्दी बाइबलीय रूप 'अश्शूर' है।
