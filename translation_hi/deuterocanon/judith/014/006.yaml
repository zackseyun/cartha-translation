base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/006.yaml
  text: And they called Achior out of the house of Ozias. But when he came and saw the head of Holofernes in the hand of one man in the assembly of the people[a], he fell on his face, and his spirit failed.
translation:
  language: hi
  text: और उन्होंने अहीओर को ओजियास के घर से बुलाया। पर जब वह आया और उसने लोगों की सभा में एक आदमी के हाथ में होलोफेर्नेस का सिर देखा, तो वह मुँह के बल गिर पड़ा और उसकी सुध-बुध जाती रही[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी आत्मा/प्राण शिथिल हो गए” या “उसकी आत्मा/प्राण ने साथ छोड़ दिया।” यह यूनानी मुहावरा तीव्र आघात से शारीरिक रूप से ढहने या मूर्छा का भाव दे सकता है।
    reason: ἐξελύθη τὸ πνεῦμα αὐτοῦ के शाब्दिक ‘आत्मा/प्राण’ रूप और उसके प्रसंगानुकूल मुहावरेदार अर्थ—बिना मृत्यु या पूर्ण बेहोशी को निश्चित किए—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐκάλεσαν
  choice: उन्होंने ... बुलाया
  rationale: सामान्य कथात्मक क्रिया; ‘बुलाया’ स्वाभाविक है और ‘तलब किया’ की अपेक्षा कम प्रबल, इसलिए यूनानी के अनुरूप है।
- source_word: τὸν Ἀχιὼρ
  choice: अहीओर
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण।
- source_word: ἐκ τοῦ οἴκου Ὀζεία
  choice: ओजियास के घर से
  rationale: यहाँ οἶκος का भौतिक अर्थ ‘घर’ कथानक में सबसे उपयुक्त है।
- source_word: ὡς δὲ ἦλθεν
  choice: पर जब वह आया
  rationale: δέ के हल्के संक्रमण अथवा विरोध को ‘पर’ से रखा गया है; ὡς के कालवाचक प्रयोग को ‘जब’ व्यक्त करता है।
- source_word: ἴδεν τὴν κεφαλὴν Ὀλοφέρνου
  choice: उसने ... होलोफेरनेस का सिर देखा
  rationale: प्रत्यक्ष और स्वाभाविक हिन्दी, जो यूनानी संबंधवाचक रचना का अर्थ सुरक्षित रखती है।
- source_word: ἐν χειρὶ ἀνδρὸς ἑνὸς
  choice: एक पुरुष के हाथ में
  rationale: ἑνός की स्पष्ट एकवचनता को ‘एक’ से सुरक्षित रखा गया है; ‘पुरुष’ ἀνήρ को सामान्य ‘व्यक्ति’ की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: ἐν τῇ ἐκκλησίᾳ τοῦ λαοῦ
  choice: लोगों की सभा में
  rationale: इस पूर्व-ईसाई संदर्भ में ἐκκλησία एकत्र जनसमूह की सभा है, तकनीकी अर्थ में ‘कलीसिया’ नहीं।
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: वह मुँह के बल गिर पड़ा
  rationale: यूनानी शारीरिक प्रतिक्रिया का स्पष्ट और प्रचलित हिन्दी मुहावरा।
- source_word: ἐξελύθη τὸ πνεῦμα αὐτοῦ
  choice: उसकी चेतना जाती रही
  rationale: यह यूनानी मुहावरा शारीरिक शिथिलता अथवा मूर्छा का बोध कराता है। हिन्दी में ‘चेतना जाती रही’ उस घटना को स्वाभाविक ढंग से व्यक्त करती है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
theological_decisions:
- issue: ἐξελύθη τὸ πνεῦμα αὐτοῦ में πνεῦμα का अर्थ
  choice: मुख्य पाठ में ‘उसकी चेतना जाती रही’
  alternative: ‘उसकी आत्मा शिथिल हो गई’ अथवा ‘उसका प्राण छूट-सा गया’
  rationale: संदर्भ में यह मृत्यु या आत्मा के शरीर छोड़ने का सैद्धांतिक कथन नहीं, बल्कि तीव्र आघात से शारीरिक ढहने या मूर्छित होने का मुहावरा है। पादटिप्पणी शाब्दिक रूप और संभावित अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। नामों को यूनानी रूप के आधार पर देवनागरी में लिप्यंतरित किया गया है। ‘सभा’ चुना गया है ताकि बाद की तकनीकी कलीसियाई शब्दावली आरोपित न हो।
