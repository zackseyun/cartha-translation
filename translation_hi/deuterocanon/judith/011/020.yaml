  text: होलोफेरनेस और उसके सभी परिचारकों को उसकी बातें अच्छी लगीं। वे उसकी बुद्धिमानी पर चकित हुए और बोले,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: अच्छी लगीं
  rationale: यह ἀρέσκω के अनुकूल स्वीकार किए जाने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ λόγοι αὐτῆς
  choice: उसकी बातें
  rationale: λόγοι का अर्थ यहाँ उसके कहे हुए शब्द या कथन हैं; ‘बातें’ हिन्दी में स्वाभाविक है और बहुवचन भी बनाए रखता है।
- source_word: ἐναντίον Ὀλοφέρνου καὶ ἐναντίον πάντων τῶν θεραπόντων αὐτοῦ
  choice: होलोफेरनेस और उसके सभी सेवकों को
  rationale: ἐναντίον का मूल भाव ‘के सामने/उपस्थिति में’ है, पर ἤρεσαν के साथ हिन्दी में प्रसन्न होने वाले व्यक्तियों को ‘को’ से व्यक्त करना अधिक सहज और अर्थसंगत है।
- source_word: θεραπόντων
  choice: सेवकों
  rationale: θεράπων किसी अधिकारी के निजी परिचारक या सेवक को दर्शाता है। ‘सेवक’ सामान्य पाठक के लिए स्पष्ट है और दासत्व का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἐθαύμασαν
  choice: चकित हुए
  rationale: यह आश्चर्य और प्रशंसा दोनों की संभावना बनाए रखता है तथा आधुनिक हिन्दी में सहज है।
- source_word: ἐπὶ τῇ σοφίᾳ αὐτῆς
  choice: उसकी बुद्धि पर
  rationale: ἐπί + संप्रदान यहाँ आश्चर्य के आधार को बताता है; ‘बुद्धि पर चकित हुए’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: καὶ εἶπαν
  choice: और बोले,
  rationale: यह अगले पद में आने वाले प्रत्यक्ष कथन से वाक्य का संबंध बनाए रखता है; अंतिम अल्पविराम उसी निरंतरता को दिखाता है।
