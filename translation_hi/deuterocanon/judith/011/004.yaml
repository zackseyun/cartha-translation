  yaml_path: translation/deuterocanon/judith/011/004.yaml
  text: Take courage; you will live through this night and beyond. For there is no one who will wrong you; rather[a], he will treat you well, as is done for the servants of my lord King Nebuchadnezzar.
translation:
  language: hi
  text: हिम्मत रखो! तुम इस रात बची रहोगी और आगे भी जीवित रहोगी; क्योंकि कोई तुम्हारे साथ अन्याय नहीं करेगा, बल्कि तुम्हारे साथ भलाई करेगा, जैसा मेरे स्वामी राजा नबूकदनेस्सर के सेवकों[a] के साथ किया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दासों।” यूनानी शब्द का अर्थ प्रसंग के अनुसार “सेवक” या “दास” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρσει
  choice: हिम्मत रखो
  rationale: यह आश्वासन और साहस देने वाली आज्ञा है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐν τῇ νυκτὶ ταύτῃ ζήσῃ καὶ εἰς τὸ λοιπόν
  choice: तुम इस रात भी जीवित रहोगी और आगे भी
  rationale: यह अनुवाद वर्तमान रात में सुरक्षित जीवित रहने और उसके बाद भी जीवन बने रहने—दोनों भावों को रखता है। स्त्रीलिंग रूप प्रसंग में यूदीत को किए गए संबोधन के अनुरूप है।
- source_word: ἀδικήσει
  choice: तुम्हारे साथ अन्याय नहीं करेगा
  rationale: ἀδικέω के नैतिक अर्थ—किसी के साथ अनुचित या अन्यायपूर्ण व्यवहार करना—को बिना केवल शारीरिक हानि तक सीमित किए व्यक्त करता है।
- source_word: ἀλλʼ εὖ σε ποιήσει
  choice: बल्कि तुम्हारे साथ भलाई करेगा
  rationale: यूनानी के सामान्य एकवचन कर्ता और 'अच्छा करना/अच्छा व्यवहार करना' के अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: καθὰ γίνεται
  choice: जैसा ... के साथ किया जाता है
  rationale: यह सामान्य या प्रचलित व्यवहार बताने वाले यूनानी निष्क्रिय भाव को बनाए रखता है।
- source_word: τοῖς δούλοις
  choice: सेवकों
  rationale: राजदरबार के इस प्रसंग में 'सेवक' स्वाभाविक है, यद्यपि यूनानी शब्द दासत्व का अर्थ भी दे सकता है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοῦ κυρίου μου βασιλέως Ναβουχοδονόσορ
  choice: मेरे स्वामी राजा नबूकदनेस्सर के
  rationale: κύριος यहाँ सामाजिक आदरसूचक संबोधन है; 'मेरे स्वामी' राजकीय निष्ठा और सम्मान दोनों को व्यक्त करता है।
theological_decisions:
- issue: राजकीय प्रसंग में δοῦλοι का अनुवाद
  choice: सेवकों
  alternative: दासों
  rationale: तात्कालिक संदर्भ राजा की सेवा में रहने वालों के साथ होने वाले व्यवहार पर केंद्रित है, उनकी बंधुआ स्थिति पर नहीं। फिर भी मूल शब्द की वास्तविक अर्थ-सीमा बनाए रखने के लिए 'दासों' को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। संबोधित व्यक्ति यूदीत होने के कारण स्त्रीलिंग 'रहोगी' प्रयुक्त हुआ है। राजकीय आदरसूचक शैली के लिए 'मेरे स्वामी राजा' रखा गया है।
