base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/008.yaml
  text: For we have heard of your wisdom and the cunning of your soul[a], and it has been reported throughout all the earth that you alone are good in all the kingdom, mighty in knowledge[c][b], and marvelous in the armies of war.
translation:
  language: hi
  text: क्योंकि हमने आपकी बुद्धि और आपके मन की चतुर युक्तियों[a] के विषय में सुना है। सारी धरती[b] पर यह बताया गया है कि पूरे राज्य[c] में केवल आप ही उत्तम हैं, ज्ञान में सामर्थी हैं और युद्ध की सेनाओं में अद्भुत हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके प्राण की चतुर युक्तियों।” यूनानी ψυχή का अर्थ “प्राण,” “जीवन” या भीतरी व्यक्तित्व हो सकता है; यहाँ संभवतः विचार और योजना बनाने वाला भीतरी मन अभिप्रेत है। “चतुर युक्तियाँ” में प्रशंसनीय सूझ-बूझ और चालाकी—दोनों की छाया हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “सारे देश में।” यूनानी γῆ का अर्थ प्रसंग के अनुसार “देश/भूमि” या “धरती” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “हर राज्य में।” एकवचन यूनानी पदबंध का अधिक संभावित अर्थ उसका पूरा राज्य है, फिर भी व्याकरणतः व्यापक अर्थ संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: हमने ... सुना है
  rationale: यूनानी अओरिस्ट को इस भाषण-संदर्भ में वर्तमान प्रासंगिकता के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: यहाँ विवेक और समझ की प्रशंसा के लिए सामान्य तथा स्वाभाविक हिन्दी शब्द है।
- source_word: πανουργεύματα τῆς ψυχῆς σου
  choice: आपके मन की चतुर युक्तियाँ
  rationale: πανουργεύματα की बहुवचन योजना/युक्ति और उसकी प्रशंसात्मक अथवा धूर्ततापूर्ण दोनों संभावित छायाओं को बनाए रखता है; ψυχή यहाँ योजना बनाने वाले भीतरी मन को सूचित करती है।
- source_word: ἀνηγγέλη
  choice: यह बताया गया है
  rationale: यूनानी कर्मवाच्य को बनाए रखते हुए समाचार फैलने पर बल देता है, बताने वालों पर नहीं।
- source_word: πάσῃ τῇ γῇ
  choice: सारी धरती पर
  rationale: व्यापक, अतिशयोक्तिपूर्ण दरबारी प्रशंसा को दर्शाता है और γῆ के मूल अर्थ को बनाए रखता है।
- source_word: σὺ μόνος ἀγαθὸς
  choice: केवल आप ही उत्तम हैं
  rationale: μόνος के विशेष बल और ἀγαθός की व्यापक प्रशंसात्मक अर्थ-सीमा को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν πάσῃ βασιλείᾳ
  choice: पूरे राज्य में
  rationale: एकवचन βασιλείᾳ को उसके समूचे राज्य के रूप में पढ़ता है, न कि संसार के प्रत्येक राज्य के रूप में।
- source_word: δυνατὸς ἐν ἐπιστήμῃ
  choice: ज्ञान में सामर्थी
  rationale: बौद्धिक क्षमता के साथ शक्ति-सूचक असामान्य किंतु महिमामय यूनानी संयोजन को सुरक्षित रखता है।
- source_word: θαυμαστὸς ἐν στρατεύμασιν πολέμου
  choice: युद्ध की सेनाओं में अद्भुत
  rationale: मूल की औपचारिक और कुछ पुनरुक्त सैन्य अभिव्यक्ति को बिना 'नेतृत्व' या 'अभियान' जैसी अतिरिक्त व्याख्या जोड़े बनाए रखता है।
