base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/005.yaml
  text: And Judith said to him[a], “Receive the words of your servant, and let your maidservant speak before you[b], and I will not tell a lie to my lord this night.”
translation:
  language: hi
  text: और यहूदीत ने उससे कहा, “अपनी दासी[a] की बातें स्वीकार कीजिए, और अपनी सेविका को अपने सामने बोलने दीजिए। मैं आज रात अपने स्वामी[b] से झूठ नहीं बोलूँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दासी’ के लिए यूनानी शब्द δοῦλη है, जिसका अर्थ स्त्री सेविका या दासी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘स्वामी’ से अभिप्राय मानव अधिकारी होलोफेरनेस से है, परमेश्वर से नहीं। इसका अनुवाद ‘मालिक’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δέξαι
  choice: स्वीकार कर
  rationale: यह δέχομαι का एकवचन आज्ञार्थक रूप है। ‘स्वीकार कर’ उसकी बातों को ग्रहण करने का सीधा अनुरोध व्यक्त करता है; केवल सुनने का अर्थ नहीं देता।
- source_word: τὰ ῥήματα
  choice: बातें
  rationale: ῥήματα बोले गए शब्दों या कथनों को दर्शाता है। इस संवाद में ‘बातें’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: τῆς δούλης σου
  choice: अपनी दासी
  rationale: δοῦλη स्त्रीलिंग सेविका अथवा दास स्त्री को सूचित कर सकता है। ‘दासी’ हिन्दी में अधीन सामाजिक स्थिति और विनम्र आत्म-संबोधन दोनों को बनाए रखता है।
- source_word: λαλησάτω
  choice: बोलने दे
  rationale: λαλέω का तृतीय-पुरुष आज्ञार्थक रूप अनुमति या आग्रह व्यक्त करता है; ‘बोलने दे’ हिन्दी में इसे स्वाभाविक रूप से रखता है।
- source_word: ἡ παιδίσκη σου
  choice: अपनी सेविका
  rationale: παιδίσκη किसी युवती, दासी या स्त्री सेवक को सूचित कर सकता है। ‘सेविका’ पहले आए δοῦλη से कुछ शब्दगत भेद रखते हुए विनम्र स्त्रीलिंग आत्म-संबोधन को व्यक्त करता है।
- source_word: κατὰ πρόσωπόν σου
  choice: अपने सामने
  rationale: यह मुहावरा शाब्दिक रूप से ‘तेरे मुख के सामने’ है और किसी की उपस्थिति में बोलने को दर्शाता है। ‘अपने सामने’ प्रसंगानुकूल स्वाभाविक हिन्दी है।
- source_word: οὐκ ἀναγγελῶ ψεῦδος
  choice: कोई झूठ नहीं कहूँगी
  rationale: ἀναγγέλλω बताने या सूचित करने और ψεῦδος झूठ को दर्शाता है। हिन्दी में ‘झूठ कहना’ इस कथन का स्वाभाविक रूप है।
- source_word: τῷ κυρίῳ μου
  choice: अपने स्वामी से
  rationale: यहाँ κύριος परमेश्वर नहीं, मानव अधिकारी होलोफेरनेस के लिए आदरसूचक संबोधन है। ‘स्वामी’ मानवीय प्रभुता और दरबारी विनम्रता दोनों को व्यक्त करता है।
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: आज रात
  rationale: अभिव्यक्ति वर्तमान रात को सूचित करती है। ‘आज रात’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: δοῦλη और παιδίσκη—दो स्त्रीलिंग आत्म-संबोधनों का अनुवाद
  choice: क्रमशः ‘दासी’ और ‘सेविका’
  alternative: दोनों के लिए ‘दासी’ अथवा ‘सेविका’
  rationale: यूनानी पाठ दो अलग शब्दों का प्रयोग करता है। हिन्दी में अलग शब्द रखने से यह अलंकारिक भेद और यहूदीत का विनम्र आत्म-प्रस्तुतीकरण सुरक्षित रहता है, जबकि ‘दासी’ में δοῦλη की अधिक प्रबल अधीनता भी सुनाई देती है।
- issue: मानव अधिकारी के लिए κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु या मालिक
  rationale: संदर्भ में संबोधित व्यक्ति होलोफेरनेस है, परमेश्वर नहीं। ‘स्वामी’ सम्मान और अधीनता व्यक्त करता है, पर इसे दिव्य उपाधि के रूप में निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। यहूदीत के विनम्र दरबारी संबोधन को बनाए रखने के लिए ‘दासी’, ‘सेविका’ और ‘स्वामी’ रखे गए हैं। प्रत्यक्ष वचन में हिन्दी की स्वाभाविक सम्मानसूचक शैली के अनुसार ‘अपनी/अपने’ का प्रयोग किया गया है।
