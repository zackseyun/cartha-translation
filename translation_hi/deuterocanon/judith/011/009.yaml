base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/009.yaml
  text: And now[a], concerning the matter that Achior spoke in your council, we have heard his words, because the men of Bethulia spared him[b], and he reported to them everything that he had spoken from you.
translation:
  language: hi
  text: 'और अब, अकीओर ने तुम्हारी परिषद् में जो बात कही थी, उसके विषय में हमने उसकी बातें सुनी हैं: बैतूलिया के पुरुषों ने उसे बचा लिया[a], और उसने उन्हें वह सब बता दिया जो उसने तुम्हारे सामने कहा था।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे सुरक्षित रखा”; यूनानी क्रिया का अर्थ किसी को बचाना, सुरक्षित रखना, या जीवित रखना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो उसने तुम्हारे पास कहा था”; सम्भवतः इसका अर्थ है जो उसने तुम्हारी उपस्थिति में या तुम्हारे सामने कहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: बात
  rationale: यहाँ इसका अर्थ किसी एक शब्द से नहीं, बल्कि अकीओर द्वारा कही गई बात की विषयवस्तु से है।
- source_word: συνεδρείᾳ
  choice: परिषद्
  rationale: यह विचार-विमर्श करने वाली औपचारिक सभा को दर्शाता है; ‘परिषद्’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: ἠκούσαμεν τὰ ῥήματα αὐτοῦ
  choice: उसके शब्द हमने सुन लिए हैं
  rationale: यह यूनानी अभिव्यक्ति के वाचिक स्वरूप और सुनने से प्राप्त वर्तमान जानकारी, दोनों को बनाए रखता है।
- source_word: περιεποίησαντο
  choice: बचाए रखा
  rationale: क्रिया किसी व्यक्ति को सुरक्षित रखने या उसका जीवन बचाने का अर्थ दे सकती है; प्रसंग में अकीओर को जीवित और सुरक्षित रखने का भाव उपयुक्त है।
- source_word: οἱ ἄνδρες Βαιτυλουά
  choice: बैतूलिया के पुरुषों
  rationale: यूनानी में पुरुषवाचक संज्ञा स्पष्ट है, इसलिए उसे बनाए रखा गया है; स्थान-नाम को प्रचलित हिन्दी बाइबलीय रूप में दिया गया है।
- source_word: ἀπήγγειλεν
  choice: बता दिया
  rationale: प्रसंग में सूचना को विस्तार से दूसरों तक पहुँचाने का स्वाभाविक हिन्दी रूप है।
- source_word: παρὰ σοί
  choice: तुम्हारे सामने
  rationale: παρά + संप्रदान यहाँ उपस्थिति या निकटता का भाव दे सकता है; ‘तुम्हारे सामने’ स्वाभाविक हिन्दी में सम्भावित अर्थ व्यक्त करता है, जबकि शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
