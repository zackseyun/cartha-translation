base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/006.yaml
  text: And if you follow the words of your servant girl[a], God will fully accomplish the matter with you[b], and my lord will not depart from his purposes.
translation:
  language: hi
  text: और यदि आप अपनी दासी की बातों पर चलें[a], तो परमेश्वर आपके साथ इस काम को पूरी तरह पूरा करेगा[b], और मेरे स्वामी अपने उद्देश्यों से पीछे नहीं हटेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी दासी की बातें मानें।”
    reason: κατακολουθέω में किसी के पीछे चलने और उसकी बात मानने—दोनों का भाव हो सकता है।
  - marker: b
    text: या, “परमेश्वर आपके द्वारा इस काम को पूरी तरह पूरा करेगा।”
    reason: μετὰ σοῦ का शाब्दिक अर्थ ‘आपके साथ’ है, पर प्रसंग में साधनात्मक अर्थ ‘आपके द्वारा’ भी समझा जा सकता है।
lexical_decisions:
- source_word: κατακολουθήσῃς
  choice: के अनुसार चलें
  rationale: क्रिया का अर्थ पीछे चलना अथवा किसी की बात मानकर उसके अनुरूप आचरण करना है। यहाँ परामर्श पर अमल करने का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: λόγοις
  choice: बातों
  rationale: λόγοις का मूल अर्थ ‘शब्दों/बातों’ है; ‘बातों’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की व्यापकता बनाए रखता है।
- source_word: παιδίσκης
  choice: दासी
  rationale: यह शब्द युवा स्त्री सेविका को सूचित करता है। ‘दासी’ वक्ता की विनम्र आत्म-पहचान और सामाजिक भूमिका दोनों व्यक्त करता है, बिना दासत्व की प्रकृति को अनावश्यक रूप से निश्चित किए।
- source_word: τελείως
  choice: पूरी तरह
  rationale: यह क्रियाविशेषण कार्य के पूर्ण निष्पादन पर बल देता है।
- source_word: πρᾶγμα
  choice: इस काम
  rationale: πρᾶγμα का अर्थ मामला, कार्य या उपक्रम हो सकता है। प्रसंग में ‘इस काम’ सहज है और शब्द को किसी अधिक विशिष्ट योजना के रूप में सीमित नहीं करता।
- source_word: ποιήσει μετὰ σοῦ
  choice: आपके साथ ... पूरा करेगा
  rationale: μετά के ‘साथ’ वाले संबंध को सुरक्षित रखा गया है; ‘आपके द्वारा’ या ‘आपके लिए’ कहने से जो अधिक निश्चित अर्थ निकलता, उसे मुख्य पाठ में नहीं थोपा गया।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: θεός के लिए मानक, गरिमापूर्ण हिन्दी रूप।
- source_word: οὐκ ἀποστεῖται
  choice: पीछे नहीं हटेंगे
  rationale: यहाँ भाव अपने उपक्रमों से अलग होने, हटने या विमुख होने का है। ‘पीछे नहीं हटेंगे’ आधुनिक हिन्दी में स्वाभाविक है और केवल परिणामगत ‘असफलता’ कहने की अपेक्षा स्थानिक रूपक को बचाता है।
- source_word: ὁ κύριός μου
  choice: मेरे स्वामी
  rationale: κύριος यहाँ मानवीय वरिष्ठ होलोफेरनेस के लिए आदरसूचक संबोधन है; ‘स्वामी’ उस संबंध को स्पष्ट रखता है और परमेश्वर का संकेत नहीं देता।
- source_word: ἐπιτηδευμάτων
  choice: उद्देश्यों
  rationale: शब्द प्रयत्नों, उपक्रमों, अभ्यासों या योजनाबद्ध उद्देश्यों को सूचित कर सकता है। ‘उद्देश्यों’ व्यापकता बनाए रखता है और सैन्य ‘योजनाओं’ तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: मानवीय वरिष्ठ के लिए κύριος का अनुवाद
  choice: मेरे स्वामी
  alternative: मेरे प्रभु / मेरे मालिक
  rationale: यहाँ संदर्भ परमेश्वर का नहीं, होलोफेरनेस का है। ‘मेरे स्वामी’ आदरसूचक मानवीय पद को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- issue: कार्य पूरा करने में परमेश्वर और होलोफेरनेस के संबंध का अर्थ
  choice: परमेश्वर आपके साथ इस काम को पूरी तरह पूरा करेगा
  alternative: परमेश्वर आपके द्वारा इस काम को पूरा करेगा / परमेश्वर आपके लिए इसे पूरा करेगा
  rationale: यूनानी μετὰ σοῦ मूलतः ‘तुम्हारे साथ’ कहता है। साधन (‘आपके द्वारा’) या लाभार्थी (‘आपके लिए’) को निश्चित न करके मूल की संभावित अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। होलोफेरनेस के लिए आदरसूचक बहुवचन क्रिया-रूप (‘चलें’, ‘हटेंगे’) प्रयुक्त हैं। पाठ सामान्य पाठक के लिए सहज है, पर मूल यूनानी की संबंधगत अस्पष्टता और मानवीय κύριος का भेद सुरक्षित रखता है।
