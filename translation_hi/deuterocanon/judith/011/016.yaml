base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/016.yaml
  text: Therefore I[a], your servant, having learned all these things, fled from before them, and God sent me to do with you things at which the whole earth will be astonished[c][b], whenever they hear of them.
translation:
  language: hi
  text: इसलिए मैं, आपकी दासी, इन सब बातों को जानकर उनके सामने से भाग आई[a]; और परमेश्वर ने मुझे आपके साथ ऐसे काम करने के लिए भेजा है[b], जिन्हें सुनकर सारी पृथ्वी[c] चकित रह जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी उपस्थिति से।” यूनानी में शाब्दिक अर्थ “उनके सामने से” है।
    reason: lexical_alternative
  - marker: b
    text: या, “आपके साथ कुछ कार्य पूरे करने के लिए।” यूनानी वाक्यांश व्यापक है और यह स्पष्ट नहीं करता कि होलोफेरनेस इसमें ठीक किस प्रकार सम्मिलित है।
    reason: lexical_alternative
  - marker: c
    text: या, “सारा संसार”; अधिक सीमित अर्थ में, “सारा देश।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह पिछले कथनों से निकलने वाला निष्कर्ष व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἡ δούλη σου
  choice: आपकी दासी
  rationale: यह होलोफेरनेस के प्रति यूदित की विनम्र दरबारी आत्म-संज्ञा है; यहाँ दासत्व की कानूनी स्थिति पर बल नहीं है।
- source_word: ἐπιγνοῦσα ταῦτα πάντα
  choice: इन सब बातों को जानकर
  rationale: पूर्वकालिक कृदन्त द्वारा उसके भागने से पहले प्राप्त ज्ञान को संक्षेप और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἀπέδρων ἀπὸ προσώπου αὐτῶν
  choice: उनके सामने से भाग आई
  rationale: ‘सामने से’ यूनानी के सामी-प्रभावित ‘उनके मुख/उपस्थिति से’ को बनाए रखता है; ‘भाग आई’ वक्ता के वर्तमान स्थान की ओर गति के अनुकूल है।
- source_word: ἀπέστειλέν με ὁ θεός
  choice: परमेश्वर ने मुझे ... भेजा है
  rationale: यूदित के वर्तमान आगमन और उद्देश्य से संबद्ध पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसके दावे को कम या अधिक किए।
- source_word: ποιῆσαι μετὰ σοῦ πράγματα
  choice: आपके साथ ऐसे काम करने के लिए
  rationale: विस्तृत यूनानी पदबंध को जानबूझकर व्यापक रखा गया है; इससे यह तय नहीं किया जाता कि होलोफेरनेस सहभागी, साधन या लाभार्थी है।
- source_word: ἐκστήσεται πᾶσα ἡ γῆ
  choice: सारी पृथ्वी चकित रह जाएगी
  rationale: भविष्यकाल और तीव्र विस्मय को सुरक्षित रखता है; γῆ की व्यापक तथा स्थानीय दोनों संभावनाओं के लिए पादटिप्पणी दी गई है।
- source_word: ὅσο ἐὰν ἀκούσωσιν αὐτά
  choice: जिन्हें सुनकर
  rationale: यह कामों के सुने जाने को विस्मय का कारण बताता है और हिन्दी में अनावश्यक पुनरुक्ति के बिना स्वाभाविक है।
theological_decisions:
- issue: यूदित के कथन में परमेश्वर द्वारा भेजे जाने का दावा
  choice: सीधे कथन के रूप में ‘परमेश्वर ने मुझे ... भेजा है’
  alternative: ‘मेरे विचार से परमेश्वर ने भेजा’ या ‘उसने दावा किया कि परमेश्वर ने भेजा’
  rationale: मूल पाठ यूदित की वाणी को प्रत्यक्ष रूप में प्रस्तुत करता है। अनुवाद न तो इस दावे का अतिरिक्त अनुमोदन करता है, न उसे कमजोर करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथन। ‘आपकी दासी’ और आदरसूचक ‘आपके’ से दरबारी विनम्रता बनी रहती है। मूल की व्यापकता और कथात्मक-धर्मवैज्ञानिक तनाव को पादटिप्पणियों सहित सुरक्षित रखा गया है।
