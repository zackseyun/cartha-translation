  text: And he sent word to Jerusalem that those living there also had done these things[a], granting to those who had settled among them the release from the council of elders.
translation:
  language: hi
  text: और उसने यरूशलेम को संदेश भेजा कि वहाँ रहने वालों ने भी ये काम किए थे और उन्होंने उनके बीच आकर बसने वालों को बुज़ुर्गों की परिषद की ओर से रिहाई दी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रिहाई” के स्थान पर “क्षमा” या “माफी” भी संभव है। यूनानी शब्द ἄφεσις कानूनी-सामाजिक रिहाई और नैतिक-धार्मिक क्षमा, दोनों अर्थ दे सकता है; यहाँ बुज़ुर्गों की परिषद का उल्लेख प्रशासनिक अर्थ के पक्ष में है।
    reason: lexical_alternative
