- source_word: τοὺς μετοικίσαντας αὐτοῖς
  choice: उनके बीच आकर बसनेवालों
  rationale: स्थान बदलकर उनके समुदाय में निवास करने का भाव सुरक्षित रखता है, पर किसी तकनीकी कानूनी श्रेणी को नहीं जोड़ता।
- source_word: τὴν ἄφεσιν
  choice: रिहाई
  rationale: नागरिक-प्रशासनिक प्रसंग में छुटकारे या दायित्व से मुक्त किए जाने का अर्थ देता है; क्षमा का सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: παρὰ τῆς γερουσίας
  choice: पुरनियों की सभा से
  rationale: γερουσία की वृद्ध/वरिष्ठ जनों की शासकीय परिषद का अर्थ गरिमापूर्ण और बाइबलीय हिन्दी में व्यक्त करता है।
