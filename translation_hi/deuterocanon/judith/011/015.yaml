  text: And it will be that[a], when he reports it to them and they act, they will be given over to you for destruction on that day.
translation:
  language: hi
  text: और ऐसा होगा कि[a] जब वह उन्हें सूचना दे और वे ऐसा करें, तब उस दिन वे विनाश के लिए तुम्हें सौंप दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे ही वह उन्हें सूचना दे और वे ऐसा करें।” यूनानी ὡς ἂν अओरिस्ट सब्जंक्टिव क्रियाओं के साथ अनिश्चित भावी परिस्थिति व्यक्त कर सकता है; ποιήσωσιν का अधिक शाब्दिक अनुवाद “वे करें” भी हो सकता है।
    reason: ‘जैसे ही’ ὡς ἂν का संदर्भानुकूल वैकल्पिक भाव सुरक्षित रखता है, और पादटिप्पणी ποιήσωσιν के अनिर्दिष्ट कर्म को स्पष्ट किए बिना अधिक शाब्दिक विकल्प देती है।
lexical_decisions:
- source_word: ἔσται
  choice: ऐसा होगा
  rationale: यह εἰμί का भविष्यकालीन, प्रसंग-परिचायक प्रयोग है; ‘ऐसा होगा’ यूनानी संरचना को स्वाभाविक हिन्दी में रखता है।
- source_word: ὡς ἂν
  choice: जब
  rationale: अओरिस्ट सब्जंक्टिव क्रियाओं के साथ यह अनिश्चित भावी परिस्थिति व्यक्त करता है; ‘जब’ भावी शर्त को सहज रूप में बनाए रखता है।
- source_word: ἀναγγείλῃ αὐτοῖς
  choice: वह उन्हें इसकी सूचना दे
  rationale: ἀναγγέλλω सूचना देने या समाचार बताने का अर्थ रखता है; निहित कर्म को हिन्दी में ‘इसकी’ से स्वाभाविक बनाया गया है।
- source_word: ποιήσωσιν
  choice: वे उसके अनुसार करें
  rationale: ποιέω का मूल अर्थ ‘करना’ है। यूनानी में कर्म स्पष्ट नहीं है; ‘उसके अनुसार’ प्रसंगगत संबंध दिखाता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: δοθήσονταί σοι
  choice: वे तुम्हारे हाथ सौंप दिए जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य को सुरक्षित रखते हुए यह शत्रुतापूर्ण सुपुर्दगी को स्वाभाविक हिन्दी में व्यक्त करता है; ‘हाथ’ हिन्दी मुहावरे में निहित दत्तिव संबंध स्पष्ट करता है।
- source_word: εἰς ὄλεθρον
  choice: विनाश के लिए
  rationale: ὄλεθρος का अर्थ विनाश या बरबादी है; εἰς परिणाम अथवा उद्देश्य की दिशा बताता है।
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: यह मानक कालवाचक अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रूप से ‘उस दिन’ है।
