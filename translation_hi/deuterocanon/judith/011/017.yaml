base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/017.yaml
  text: for your servant is God-fearing[a], and serves the God of heaven night and day. And now I will remain with you, my lord, and your servant will go out by night into the valley, and I will pray to God[b], and he will tell me when they have committed their sin.
translation:
  language: hi
  text: क्योंकि आपकी दासी परमेश्वर का भय मानने वाली है[a] और रात-दिन स्वर्ग के परमेश्वर की सेवा करती है। अब, मेरे स्वामी, मैं आपके पास रहूँगी; और आपकी दासी रात को घाटी[b] में निकल जाएगी और परमेश्वर से प्रार्थना करेगी। तब वह मुझे बताएगा कि उन्होंने अपना पाप कब किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आपकी दासी’ का अनुवाद ‘गुलाम स्त्री’ भी हो सकता है (यूनानी δούλη); यहाँ यह विनम्र आत्म-संबोधन के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: ‘घाटी’ के लिए ‘खड्ड’ या ‘संकरी घाटी’ भी संभव है (यूनानी φάραγξ)।
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλη
  choice: दासी
  rationale: स्त्रीलिंग शब्द दासी/गुलाम स्त्री को सूचित कर सकता है; यहाँ होलोफेरनेस के सामने आदरसूचक आत्म-संदर्भ प्रमुख है, इसलिए स्वाभाविक हिन्दी ‘आपकी दासी’ चुना गया।
- source_word: θεοσεβής
  choice: परमेश्वर का भय माननेवाली
  rationale: यह प्रयोग परमेश्वर के प्रति श्रद्धापूर्ण भय को स्पष्ट रखता है और θεο- तत्त्व को सामान्य ‘धर्मपरायण’ में विलीन नहीं करता।
- source_word: θεραπεύουσα
  choice: सेवा करती है
  rationale: क्रिया धार्मिक सेवा, उपासना या परिचर्या का अर्थ दे सकती है; ‘सेवा’ निरंतर भक्ति को व्यक्त करते हुए अर्थ को केवल अनुष्ठानिक उपासना तक सीमित नहीं करती।
- source_word: νυκτὸς καὶ ἡμέρας
  choice: रात-दिन
  rationale: स्वाभाविक हिन्दी अभिव्यक्ति है और यूनानी के समग्र कालबोध को बनाए रखती है।
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: स्वर्ग के परमेश्वर
  rationale: संबंधकारक संरचना और पारंपरिक बाइबलीय उपाधि दोनों सुरक्षित रहते हैं।
- source_word: μενῶ παρὰ σοί
  choice: मैं आपके पास रहूँगी
  rationale: παρά के साथ यहाँ किसी की संगति या उपस्थिति में ठहरने का भाव है; यह हिन्दी में सहज और सटीक है।
- source_word: κύριε μου
  choice: मेरे स्वामी
  rationale: होलोफेरनेस के लिए प्रयुक्त आदरसूचक सामाजिक संबोधन है, कोई ईश्वरीय उपाधि नहीं।
- source_word: ἐξελεύσεται
  choice: निकल जाएगी
  rationale: शिविर या उपस्थित स्थान से बाहर जाने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατὰ νύκτα
  choice: रात को
  rationale: रात्रि के समय बाहर जाने के अर्थ का सहज आधुनिक हिन्दी रूप।
- source_word: φάραγγα
  choice: घाटी
  rationale: शब्द घाटी, खड्ड या संकरी दरारनुमा घाटी को सूचित कर सकता है; मुख्य पाठ में पठनीय व्यापक शब्द रखा गया और स्थलाकृतिक अस्पष्टता पादटिप्पणी में सुरक्षित की गई।
- source_word: προσεύξομαι πρὸς τὸν θεόν
  choice: परमेश्वर से प्रार्थना करेगी
  rationale: परमेश्वर की ओर निर्देशित प्रार्थना का सामान्य और स्पष्ट हिन्दी रूप।
- source_word: ἐρεῖ μοι
  choice: वह मुझे बताएगा
  rationale: साधारण भविष्यकालीन व्यक्तिगत सूचना का स्वाभाविक अनुवाद।
- source_word: πότε ἐποίησαν τὸ ἁμάρτημα αὐτῶν
  choice: उन्होंने अपना पाप कब किया है
  rationale: πότε का कालगत प्रश्न और पूर्ण किए गए अपराध का भाव बनाए रखा गया है; प्रसंग के आधार पर इसे भविष्यकालीन अनुमति या निर्णय के रूप में नहीं बदला गया।
theological_decisions:
- issue: δούλη के रूप में यहूदीत का आत्म-संदर्भ
  choice: दासी
  alternative: गुलाम स्त्री
  rationale: शब्द वास्तविक दासत्व भी बता सकता है, पर यहाँ दरबारी विनम्रता में आत्म-संदर्भ उसका तात्कालिक कार्य है। ‘दासी’ दोनों अर्थ-क्षेत्रों की कुछ गुंजाइश रखते हुए आधुनिक हिन्दी में प्रसंगानुकूल है।
- issue: θεραπεύουσα में धार्मिक सेवा का स्वरूप
  choice: सेवा करती है
  alternative: उपासना करती है
  rationale: यूनानी शब्द सेवा, परिचर्या और धार्मिक भक्ति के बीच व्यापक है; ‘उपासना’ चुनने से अर्थ अनावश्यक रूप से केवल आराधना-क्रिया तक सीमित हो सकता था।
- issue: पाप किए जाने के समय पर परमेश्वर का प्रकाशन
  choice: वह मुझे बताएगा कि उन्होंने अपना पाप कब किया है
  alternative: वह मुझे बताएगा कि वे अपना पाप कब करेंगे
  rationale: यूनानी ἐποίησαν रूपतः भूतकाल है। प्रसंग भविष्य में सूचना मिलने का है, पर पाठ में पाप को स्पष्ट भविष्यकाल में बदलना वास्तविक कालगत तनाव को मिटा देता; इसलिए मूल की अभिव्यक्ति सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यहूदीत के विनम्र दरबारी संबोधन के कारण ‘आपकी दासी’ और ‘मेरे स्वामी’ चुने गए हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a], [b] उपस्थित हैं।
