base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/002.yaml
  text: And now[a], if your people who live in the hill country had not treated me with contempt, I would not have raised my spear against them; but they themselves have brought these things on themselves.
translation:
  language: hi
  text: और अब, पहाड़ी प्रदेश में रहनेवाले तुम्हारे लोगों ने यदि मेरा तिरस्कार न किया होता,[a] तो मैं उनके विरुद्ध अपना भाला न उठाया होता; पर उन्होंने स्वयं ही यह सब अपने ऊपर ले आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे तुच्छ न समझा होता” अथवा “मेरा अपमान न किया होता।” यूनानी क्रिया में किसी को कम महत्त्व का समझकर उसके साथ व्यवहार करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαός σου
  choice: तुम्हारे लोग
  rationale: λαός यहाँ सामूहिक रूप से संबोधित व्यक्ति के लोगों को दर्शाता है; ‘तुम्हारे लोग’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ὁ κατοικῶν τὴν ὀρεινήν
  choice: पहाड़ी प्रदेश में रहनेवाले
  rationale: ὀρεινή संज्ञा के रूप में पहाड़ी या ऊँचे भूभाग को सूचित करता है; यह रूप भौगोलिक अर्थ को सहज हिन्दी में रखता है।
- source_word: εἰ μὴ ἐφαύλισάν με
  choice: यदि मेरा तिरस्कार न किया होता
  rationale: ἐφαυλίζω किसी को तुच्छ या कम महत्त्व का समझकर उसके साथ व्यवहार करने का भाव रखता है। ‘तिरस्कार करना’ इस भाव को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: οὐκ ἂν ἦρα
  choice: तो मैं ... न उठाता
  rationale: ἄν के साथ यह भूतकाल की तथ्य-विरुद्ध शर्त का परिणाम है; हिन्दी में ‘यदि ... न किया होता, तो ... न उठाता’ वही संबंध स्पष्ट करता है।
- source_word: τὸ δόρυ μου
  choice: अपना भाला
  rationale: δόρυ का सामान्य युद्ध-संबंधी अर्थ ‘भाला’ है। कर्ता से संबंध के कारण हिन्दी में ‘अपना’ स्वाभाविक है।
- source_word: ἐπʼ αὐτούς
  choice: उनके विरुद्ध
  rationale: शस्त्र उठाने के प्रसंग में ἐπί का विरोधात्मक अर्थ है, जिसे ‘विरुद्ध’ ठीक प्रकार व्यक्त करता है।
- source_word: ἀλλὰ αὐτοὶ ἑαυτοῖς ἐποίησαν ταῦτα
  choice: परन्तु उन्होंने स्वयं ही यह विपत्ति अपने ऊपर बुला ली है
  rationale: αὐτοὶ और ἑαυτοῖς आत्म-उत्तरदायित्व तथा स्वयं भुगते परिणाम पर बल देते हैं। ‘यह विपत्ति’ प्रसंगगत परिणाम को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि किसी अनकहे दैवी निर्णय को नहीं जोड़ती।
theological_decisions:
- issue: अन्तिम वाक्यांश में दोष और परिणाम की स्पष्टता
  choice: उन्होंने स्वयं ही यह विपत्ति अपने ऊपर बुला ली है
  alternative: उन्होंने स्वयं अपने साथ ये बातें की हैं
  rationale: पाठ विपत्ति का उत्तरदायित्व उन्हीं पर रखता है, पर उसे स्पष्ट रूप से दैवी दण्ड या भाग्य नहीं कहता। चुना हुआ अनुवाद स्वयं उत्पन्न परिणाम को व्यक्त करता है और अतिरिक्त धर्मवैज्ञानिक व्याख्या से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य। तथ्य-विरुद्ध शर्त को स्पष्ट रखा गया है। ‘रहनेवाले’ का संयुक्त रूप प्रकाशन-शैली के अनुरूप है; विरामचिह्न वाक्य की शर्त और परिणाम की संरचना स्पष्ट करते हैं।
