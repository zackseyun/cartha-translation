base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/018.yaml
  text: And when I come[a], I will open the way before you, and you will go out with all your force, and there is none among them who will stand against you.
translation:
  language: hi
  text: और जब मैं आऊँगी[a], तब मैं तुम्हारे आगे मार्ग खोल दूँगी; और तुम अपनी सारी सैन्य-शक्ति के साथ निकलोगे, और उनमें से कोई भी तुम्हारा सामना नहीं कर सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और आकर मैं तुम्हारे लिए पहले से खोल दूँगी।” यूनानी क्रिया का अर्थ पहले से खोलना भी हो सकता है; “मार्ग” प्रसंग से निहित है, मूल पाठ में स्पष्ट रूप से नहीं लिखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: जब मैं आऊँगी
  rationale: स्त्रीलिंग एकवचन अओरिस्ट कृदंत यहूदित की ओर संकेत करता है। हिन्दी में कालगत उपवाक्य स्वाभाविक है और मुख्य क्रिया से पहले उसके आने का क्रम बनाए रखता है।
- source_word: προανοίσω
  choice: मैं तुम्हारे आगे मार्ग खोल दूँगी
  rationale: भविष्यकालीन क्रिया में पहले से अथवा आगे खोलने का भाव है। यूनानी में कर्म व्यक्त नहीं है; प्रसंग के आधार पर ‘मार्ग’ जोड़ा गया है, जबकि ‘तुम्हारे आगे’ उपसर्ग के भाव को बनाए रखता है।
- source_word: ἐξελεύσῃ
  choice: तुम ... निकलोगे
  rationale: ἐξέρχομαι का मूल अर्थ बाहर जाना या निकलना है। सैन्य प्रसंग में ‘निकलोगे’ स्वाभाविक है और ‘कूच करोगे’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: σὺν πάσῃ τῇ δυνάμει σου
  choice: अपनी पूरी सेना के साथ
  rationale: δύναμις शक्ति, सामर्थ्य या सैन्य बल को सूचित कर सकता है। यहाँ सेनापति के अपने समस्त सैन्य दल के साथ निकलने का प्रसंग होने के कारण ‘पूरी सेना’ सामान्य हिन्दी में सर्वाधिक स्पष्ट है।
- source_word: οὐκ ἔστιν ὃς ἀντιστήσεταί σοι
  choice: कोई भी तुम्हारा सामना नहीं कर सकेगा
  rationale: ἀνθίστημι का अर्थ सामने खड़ा होना, विरोध करना या प्रतिरोध करना है। ‘सामना नहीं कर सकेगा’ सैन्य चित्र और भविष्यगत असमर्थता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξ αὐτῶν
  choice: उनमें से
  rationale: ἐξ यहाँ समूह में से किसी एक के न होने का अंशसूचक भाव रखता है; हिन्दी में ‘उनमें से’ इसका सीधा और स्वाभाविक रूप है।
