base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/022.yaml
  text: Holofernes said to her[a], “God has done well to send you ahead of the people, so that power might be in our hands[b]; but destruction is for those who have treated my lord with contempt.”
translation:
  language: hi
  text: होलोफेरनेस ने उससे कहा, “परमेश्वर ने तुम्हें लोगों से पहले भेजकर अच्छा किया, ताकि शक्ति हमारे हाथों में आ जाए[a]; किन्तु जिन्होंने मेरे स्वामी का तिरस्कार किया है, उनके लिए विनाश है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: ‘ताकि शक्ति हमारे हाथों में हो।’'
    reason: यूनानी ‘हमारे हाथों में शक्ति हो/आ जाए’ का शाब्दिक क्रम रखता है; ‘आ जाए’ अधिकार या नियंत्रण में आने का स्वाभाविक हिन्दी मुहावरा है।
  - marker: b
    text: 'या: ‘किन्तु विनाश उन लोगों के लिए है जिन्होंने मेरे स्वामी का तिरस्कार किया है।’ यूनानी में ‘विनाश’ पहले रखकर उस पर बल दिया गया है।'
    reason: मूल के क्रियारहित वाक्य और आरंभिक ‘विनाश’ के बलाघात को स्पष्ट करता है।
lexical_decisions:
- source_word: Εὖ ἐποίησεν
  choice: अच्छा किया है
  rationale: यह यूनानी मुहावरा किसी कार्य को उचित और लाभकारी ठहराता है। हिन्दी में ‘अच्छा किया है’ उसका स्वाभाविक मूल्यांकनात्मक भाव बनाए रखता है।
- source_word: ἀποστεῖλας
  choice: भेजकर
  rationale: यह ὁ θεός से जुड़ा एओरिस्ट कृदन्त है। ‘भेजकर’ मूल वाक्य-संरचना के निकट रहते हुए हिन्दी में सहज है।
- source_word: ἔμπροσθεν τοῦ λαοῦ
  choice: लोगों से पहले
  rationale: ἔμπροσθεν स्थान अथवा क्रम में आगे होने का भाव देता है। यहाँ यहूदित के लोगों से आगे निकलकर पहले पहुँचने का संदर्भ है; मूल में ‘तुम्हारे’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: τοῦ γενήθηναι
  choice: ताकि ... आ जाए
  rationale: सकार्थक आर्टिक्युलर इनफिनिटिव उद्देश्य या अपेक्षित परिणाम व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐν χερσὶν ἡμῶν
  choice: हमारे हाथों में
  rationale: यह अधिकार या नियंत्रण में आने का मुहावरा है। हिन्दी का समान मुहावरा स्रोत की सजीव अभिव्यक्ति बनाए रखता है।
- source_word: κράτος
  choice: शक्ति
  rationale: κράτος बल, सामर्थ्य या प्रभुत्व को सूचित कर सकता है। ‘शक्ति’ व्यापक अर्थ बनाए रखती है और प्रसंग में सैन्य नियंत्रण को अनावश्यक रूप से अधिक विशिष्ट नहीं करती।
- source_word: φαυλίσασι
  choice: तुच्छ समझते हैं
  rationale: क्रिया किसी को घटिया, नगण्य या आदर के अयोग्य मानने और उसके साथ वैसा व्यवहार करने का भाव रखती है। ‘तुच्छ समझना’ आधुनिक हिन्दी में यह अवमानना स्पष्ट करता है।
- source_word: τὸν κύριόν μου
  choice: मेरे स्वामी
  rationale: यहाँ κύριος एक मानवीय अधिपति के लिए प्रयुक्त है। ‘स्वामी’ सम्मान और अधीनता का भाव रखता है, पर दैवी उपाधि का भ्रम उत्पन्न नहीं करता।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: यह नाश या बरबादी का स्पष्ट अर्थ देता है और बाद की किसी विशिष्ट धर्मशास्त्रीय अवधारणा को आरोपित नहीं करता।
theological_decisions:
- issue: κύριος का मानवीय शासक के लिए प्रयोग
  choice: मेरे स्वामी
  alternative: मेरे प्रभु
  rationale: संदर्भ में यह इस्राएल के परमेश्वर की उपाधि नहीं, बल्कि होलोफेरनेस के मानवीय अधिपति का संबोधन है। ‘स्वामी’ इस भेद को स्पष्ट रखते हुए पद और अधीनता का भाव सुरक्षित रखता है।
- issue: अंतिम खंड में विनाश का कथन
  choice: उनका विनाश होगा
  alternative: उनके लिए विनाश है
  rationale: यूनानी में पूर्ण क्रिया नहीं है और ‘विनाश’ पर बल है। मुख्य पाठ का भविष्यसूचक हिन्दी रूप धमकी के प्रसंग में स्वाभाविक है; पादटिप्पणी अधिक शाब्दिक अस्तित्ववाचक रूप सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘होलोफेरनेस’, ‘परमेश्वर’ और ‘स्वामी’ सामान्य पाठक के लिए स्पष्ट हैं। वाक्य में मूल यूनानी का उद्देश्य-संबंध, अधिकार का ‘हाथों में’ मुहावरा और अंतिम विनाश-वचन का तनाव सुरक्षित रखा गया है।
