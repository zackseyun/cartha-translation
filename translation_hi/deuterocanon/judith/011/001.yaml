base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/001.yaml
  text: And Holofernes said to her[a], “Take courage, woman; do not be afraid in your heart[c][b], for I have harmed no man who has chosen to serve King Nebuchadnezzar of all the earth.”
translation:
  language: hi
  text: तब होलोफ़ेरनेस ने उससे कहा, “स्त्री, हिम्मत रखो; अपने मन में मत डरो। क्योंकि मैंने किसी ऐसे व्यक्ति को हानि नहीं पहुँचाई, जिसने सारी पृथ्वी के राजा नबूकदनेस्सर की सेवा करना चुना है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सारी पृथ्वी के राजा” वक्ता के साम्राज्यवादी दावे को व्यक्त करता है; यहाँ “पृथ्वी” के लिए प्रयुक्त यूनानी शब्द का अर्थ दूसरे संदर्भों में “भूमि” भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: Θάρσησον
  choice: हिम्मत रखो
  rationale: यह आज की स्वाभाविक हिन्दी में साहस बँधाने वाली आज्ञा है और यूनानी क्रिया का प्रोत्साहनात्मक बल बनाए रखती है।
- source_word: γύναι
  choice: स्त्री
  rationale: यह सीधे संबोधन को बिना अनावश्यक कोमलता या सामाजिक पदवी जोड़े व्यक्त करता है।
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: अपने मन में मत डरो
  rationale: ‘मन’ आधुनिक हिन्दी में भीतरी भाव-जगत को स्वाभाविक रूप से व्यक्त करता है और यूनानी के ‘अपने हृदय में’ वाले आंतरिक भय को बनाए रखता है।
- source_word: ἐκάκωσα
  choice: हानि नहीं पहुँचाई
  rationale: यह शारीरिक चोट, दुर्व्यवहार या व्यापक अहित में से किसी एक अर्थ को अनावश्यक रूप से निश्चित किए बिना κακόω का विस्तृत अर्थ देता है।
- source_word: ἄνθρωπον
  choice: किसी ... व्यक्ति को
  rationale: ἄνθρωπον यहाँ सामान्य अर्थ में किसी भी मनुष्य को सूचित करता है; ‘व्यक्ति’ आधुनिक हिन्दी में इस समावेशी सामान्य अर्थ को स्पष्ट रखता है।
- source_word: ὅστις ἡρέτικεν
  choice: जिसने ... चुना है
  rationale: यह चुनाव या वरीयता के अर्थ तथा पूर्ण किए गए निर्णय की प्रासंगिकता—दोनों को पठनीय हिन्दी में व्यक्त करता है।
- source_word: δουλεύειν
  choice: सेवा करना
  rationale: संदर्भ राजनीतिक अधीनता का है। ‘सेवा करना’ राजकीय निष्ठा को व्यक्त करता है, जबकि ‘दास होना’ यहाँ स्रोत से अधिक संकीर्ण और तीखा अर्थ दे सकता है।
- source_word: βασιλεῖ Ναβουχοδονόσορ
  choice: राजा नबूकदनेस्सर
  rationale: नाम के साथ राजकीय पदवी का यह क्रम हिन्दी में स्वाभाविक है; नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: πάσης τῆς γῆς
  choice: सारी पृथ्वी के
  rationale: γῆ का अर्थ ‘भूमि’ भी हो सकता है, पर यहाँ विश्वव्यापी राजसत्ता का साम्राज्यवादी दावा प्रमुख है; ‘सारी पृथ्वी’ उस अतिशयोक्तिपूर्ण दावे को सुरक्षित रखता है।
theological_decisions:
- issue: नबूकदनेस्सर की विश्वव्यापी राजसत्ता का दावा
  choice: सारी पृथ्वी के राजा
  alternative: सारी भूमि के राजा
  rationale: वाक्य को वक्ता के साम्राज्यवादी दावे के रूप में ज्यों का त्यों प्रस्तुत किया गया है, न कि कथाकार या अनुवाद की ओर से उस दावे की सत्यता की पुष्टि के रूप में।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। संबोधन में यूनानी की सीधाई बचाने के लिए ‘स्त्री’ रखा गया है, जबकि आज्ञाओं में स्वाभाविक आदरसूचक बहुवचन (‘रखो’, ‘डरो’) प्रयोग किया गया है। ‘अपने मन में’ शाब्दिक ‘अपने हृदय में’ की अपेक्षा सामान्य आधुनिक हिन्दी में अधिक सहज है, पर आंतरिक भय का बिंब बनाए रखता है।
