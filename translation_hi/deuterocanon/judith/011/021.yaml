lexical_decisions:
- source_word: Οὐκ ἔστιν τοιαύτη γυνὴ
  choice: इसके जैसी कोई स्त्री नहीं है
  rationale: यह स्वाभाविक हिन्दी में निषेधात्मक अस्तित्व-वाक्य को व्यक्त करता है और τοιαύτη के गुणसूचक तथा संकेतवाचक भाव को बनाए रखता है।
- source_word: ἀπʼ ἄκρου ἕως ἄκρου τῆς γῆς
  choice: धरती के एक छोर से दूसरे छोर तक
  rationale: यह समस्त धरती को समेटने वाली अतिशयोक्तिपूर्ण यूनानी अभिव्यक्ति का सहज हिन्दी रूप है। γῆ का अर्थ ‘धरती’ या ‘भूमि’ दोनों हो सकता है; प्रसंग में व्यापक अर्थ उपयुक्त है।
- source_word: ἐν καλῷ προσώπῳ
  choice: चेहरे की सुंदरता में
  rationale: यह उस गुण या क्षेत्र को स्पष्ट करता है जिसमें स्त्री को अनुपम कहा गया है; καλός और πρόσωπον यहाँ सुंदर मुखाकृति का संकेत देते हैं।
- source_word: καὶ συνέσει λόγων
  choice: और बातों की समझ-बूझ में
  rationale: σύνεσις समझ, सूझ-बूझ या विवेक को और λόγοι यहाँ बोले गए शब्दों या बातों को दर्शाता है। यह रूप बौद्धिक समझ और प्रभावपूर्ण वाणी—दोनों की संभावना खुली रखता है।
