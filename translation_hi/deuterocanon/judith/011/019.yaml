base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/019.yaml
  text: And I will lead you through the midst of Judea until you come opposite Jerusalem[a], and I will set your chariot in her midst, and you will drive them like sheep that have no shepherd, and not even a dog will growl with its tongue against you; for these things were spoken to me according to my foreknowledge, and they were reported to me[c][b], and I was sent to tell you.
translation:
  language: hi
  text: और मैं तुम्हें यहूदिया के बीच से ले जाऊँगी, जब तक कि तुम यरूशलेम के सामने न पहुँच जाओ[a]। मैं तुम्हारा रथ उसके बीच में खड़ा करूँगी, और तुम उन लोगों को ऐसी भेड़ों के समान हाँक ले जाओगे जिनका कोई चरवाहा नहीं है। तुम्हारे सामने कोई कुत्ता अपनी जीभ से गुर्राएगा तक नहीं[b]; क्योंकि ये बातें मुझे मेरे पूर्वज्ञान के अनुसार बताई गई हैं[c], और मुझे इनका समाचार दिया गया है; और मुझे तुम्हें ये बातें बताने के लिए भेजा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यरूशलेम के सम्मुख’ अथवा ‘यरूशलेम के आमने-सामने’।
    reason: lexical_alternative
  - marker: b
    text: ‘कोई कुत्ता अपनी जीभ से गुर्राएगा तक नहीं’ पूर्णतः प्रतिरोध न होने और निर्विघ्न आगे बढ़ने को व्यक्त करने वाला मुहावरेदार कथन है।
    reason: cultural_note
  - marker: c
    text: यहाँ ‘पूर्वज्ञान’ का अर्थ पहले से प्राप्त ज्ञान या अग्रिम जानकारी हो सकता है; यह आवश्यक नहीं कि यह कोई तकनीकी धर्मवैज्ञानिक दावा हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: मैं ... ले जाऊँगी
  rationale: ἄγω के भविष्यत् रूप और स्त्री वक्ता के अनुरूप; यह व्यक्तिगत रूप से मार्ग दिखाकर ले जाने का भाव रखता है।
- source_word: διὰ μέσου τῆς Ἰουδαίας
  choice: यहूदिया के बीच से
  rationale: स्थानगत सजीवता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἕως τοῦ ἐλθεῖν ἀπέναντι Ἰερουσαλήμ
  choice: जब तक कि तुम यरूशलेम के सामने न पहुँच जाओ
  rationale: ἀπέναντι का सामने/आमने-सामने का स्थानगत अर्थ सुरक्षित रखता है और नगर में प्रवेश का अर्थ नहीं जोड़ता।
- source_word: θήσω τὸν δίφρον σου
  choice: मैं तुम्हारा रथ ... खड़ा करूँगी
  rationale: सैनिक प्रसंग में δίφρος के लिए ‘रथ’ स्पष्ट है; ‘खड़ा करूँगी’ स्थापित करने का स्वाभाविक हिन्दी रूप है।
- source_word: ἐν μέσῳ αὐτῆς
  choice: उसके बीच में
  rationale: सर्वनाम का संदर्भ यरूशलेम से है; हिन्दी में अनावश्यक लिंग-मानवीकरण जोड़े बिना मूल संदर्भ स्पष्ट रहता है।
- source_word: ἄξεις αὐτούς
  choice: तुम उन लोगों को ... हाँक ले जाओगे
  rationale: आगे आने वाली भेड़ों की उपमा के साथ ‘हाँक ले जाना’ मूल चित्र को सटीक और स्वाभाविक बनाता है।
- source_word: ὡς πρόβατα οἷς οὐκ ἔστιν ποιμήν
  choice: ऐसी भेड़ों के समान ... जिनका कोई चरवाहा नहीं है
  rationale: नेतृत्वविहीन और असुरक्षित झुंड की बाइबलीय छवि को पूर्ण रूप में रखता है।
- source_word: οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ
  choice: कोई कुत्ता अपनी जीभ से गुर्राएगा तक नहीं
  rationale: γρύζω के गुर्राने के अर्थ और असामान्य पर स्पष्ट ‘अपनी जीभ से’ पदबंध दोनों को सुरक्षित रखता है।
- source_word: κατὰ πρόγνωσίν μου
  choice: मेरे पूर्वज्ञान के अनुसार
  rationale: πρόγνωσις का सीधा रूप रखते हुए इसके गैर-तकनीकी, पहले से प्राप्त ज्ञान के संभावित अर्थ को टिप्पणी में स्पष्ट किया गया है।
- source_word: ἀπηγγέλη μοι
  choice: मुझे इनका समाचार दिया गया है
  rationale: निष्क्रिय क्रिया से व्यक्त, किसी अन्य स्रोत द्वारा सूचना दिए जाने का भाव सुरक्षित रहता है।
- source_word: ἀπεστάλην ἀναγγεῖλαί σοι
  choice: मुझे तुम्हें ये बातें बताने के लिए भेजा गया है
  rationale: भेजे जाने और सूचना पहुँचाने—दोनों तत्वों को सरल, गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: यहूदीत के कथन में πρόγνωσις का अर्थ
  choice: ‘पूर्वज्ञान’ रखा गया है, जिसका आशय यहाँ पहले से प्राप्त ज्ञान या अग्रिम जानकारी भी हो सकता है।
  alternative: विशेष प्रकाशन, पूर्वाभास, या परमेश्वर के तकनीकी सर्वज्ञान-सिद्धांत का संकेत
  rationale: प्रसंग में यहूदीत होलोफेरनेस से रणनीतिक ढंग से बोल रही है और अग्रिम जानकारी पाने का दावा करती है। शब्द को सीधे रखते हुए किसी बाद के धर्मवैज्ञानिक तकनीकी अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। वक्ता यहूदीत होने के कारण स्त्रीलिंग क्रियारूप ‘ले जाऊँगी/करूँगी’ प्रयुक्त हैं। मूल की पुनरुक्ति—बातें बताई गईं, समाचार दिया गया, और बताने को भेजा गया—जानबूझकर बनाए रखी गई है।
