base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/023.yaml
  text: And now you are beautiful in your appearance and good in your words. For if you do as you have spoken[a], your God will be my God, and you will dwell in the house of King Nabuchodonosor, and you will be renowned throughout all the earth.
translation:
  language: hi
  text: और अब तुम अपने रूप में मनोहर और अपनी बातों में अच्छी हो। क्योंकि यदि तुम अपने कहे के अनुसार करोगी, तो तुम्हारा परमेश्वर[a] मेरा भी परमेश्वर होगा, और तुम राजा नबूकदनेस्सर के भवन में निवास करोगी और सारी पृथ्वी पर प्रसिद्ध हो जाओगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा देवता मेरा भी देवता होगा।” यूनानी शब्द θεός यहाँ ‘परमेश्वर’ या ‘देवता’ का भेद निश्चित नहीं करता; यह विकल्प वक्ता के तत्काल बहुदेववादी दृष्टिकोण को सामने रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστεία
  choice: मनोहर
  rationale: ἐν τῷ εἴδει σου के साथ यह बाहरी रूप की आकर्षक सुंदरता को व्यक्त करता है। ‘मनोहर’ प्रशंसात्मक और गरिमापूर्ण है, पर अनावश्यक रूप से रोमानी नहीं।
- source_word: εἶδος
  choice: रूप
  rationale: यहाँ दृश्य स्वरूप या बाहरी रूप अभिप्रेत है; ‘रूप’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: ἀγαθὴ ἐν τοῖς λόγοις σου
  choice: अपनी बातों में भली
  rationale: यह यूनानी समानांतर रचना को बनाए रखते हुए जूडिथ की वाणी की प्रशंसा व्यक्त करता है।
- source_word: ἐὰν ποιήσῃς καθὰ ἐλάλησας
  choice: यदि तुम अपने कहे के अनुसार करोगी
  rationale: यह कथन और उसके अनुरूप किए जाने वाले कार्य के संबंध को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: ὁ θεός σου ἔσται μού θεός
  choice: तुम्हारा परमेश्वर मेरा भी परमेश्वर होगा
  rationale: वाक्य में जूडिथ के परमेश्वर की ओर सीधा संकेत है। ‘भी’ हिन्दी में विधेय के भाव को स्वाभाविक बनाता है; वक्ता की मंशा से जुड़ी अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: καθιῇ
  choice: निवास करोगी
  rationale: शाब्दिक अर्थ ‘बैठोगी’ है, पर राजभवन के संदर्भ में यह स्थायी निवास या स्थान पाने का मुहावरेदार भाव देता है।
- source_word: οἶκος
  choice: भवन
  rationale: राजा के संदर्भ में ‘भवन’ शाब्दिक ‘घर’ की तुलना में अधिक स्वाभाविक और गरिमापूर्ण है, जबकि ‘दरबार’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: ὀνομαστὴ
  choice: प्रसिद्ध
  rationale: इसका अर्थ नामी या विख्यात होना है; ‘प्रसिद्ध’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: παρὰ πᾶσαν τὴν γῆν
  choice: सारी पृथ्वी पर
  rationale: यह वक्ता के व्यापक, सार्वभौमिक दावे को बनाए रखता है; इसे केवल स्थानीय ‘देश’ तक सीमित नहीं करता।
theological_decisions:
- issue: होलोफेरनेस के कथन में θεός का आशय और हिन्दी में उसका रूप
  choice: तुम्हारा परमेश्वर मेरा भी परमेश्वर होगा
  alternative: तुम्हारा देवता मेरा भी देवता होगा
  rationale: यूनानी लिपि बड़े और छोटे अक्षर के आधार पर ‘God/god’ का भेद तय नहीं करती। मुख्य पाठ जूडिथ के परमेश्वर की पहचान को दर्शाता है, जबकि पाद-टिप्पणी होलोफेरनेस के तत्काल मूर्तिपूजक दृष्टिकोण से संभव वैकल्पिक समझ को सुरक्षित रखती है; इससे कथन को निश्चित धर्म-स्वीकारोक्ति मानकर तनाव समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप रखा गया है। स्त्रीलिंग क्रियाएँ जूडिथ को संबोधन के अनुरूप हैं। वाक्य की प्रशंसात्मक समानांतरता तथा राजकीय संदर्भ को बनाए रखा गया है।
