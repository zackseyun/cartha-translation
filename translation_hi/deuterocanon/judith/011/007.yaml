base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/007.yaml
  text: For King Nebuchadnezzar[a], of all the earth, lives, and his dominion lives—he who sent you for the success of every living soul. For not only will men serve him because of you[c][b], but also the wild animals and the cattle and the birds of the sky will live under your strength for Nebuchadnezzar and all his house.
translation:
  language: hi
  text: क्योंकि सारी पृथ्वी का राजा नबूकदनेस्सर जीवित है, और उसका प्रभुत्व भी जीवित है! उसी ने तुम्हें हर प्राणी के कल्याण[a] के लिए भेजा है। न केवल मनुष्य तुम्हारे कारण उसकी सेवा करेंगे, बल्कि वन-पशु, पालतू पशु और आकाश के पक्षी भी तुम्हारे पराक्रम से नबूकदनेस्सर और उसके सारे घराने के लिए जीवित रहेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हर प्राणी के कल्याण’ का अनुवाद ‘हर जीवन की सफलता’, ‘हर प्राणी की उन्नति’ या ‘हर प्राणी को ठीक दशा में लाने’ भी किया जा सकता है। यहाँ यूनानी शब्द का अर्थ केवल देह से अलग आत्मा नहीं है।
    reason: lexical_alternative
  - marker: b
    text: 'अन्तिम वाक्यांश यूनानी में अत्यन्त संक्षिप्त है। इसका अर्थ इस प्रकार भी समझा जा सकता है: ‘नबूकदनेस्सर और उसके सारे घराने के लिए तुम्हारे पराक्रम से जीवित रहेंगे।’'
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ ... καὶ ζῇ
  choice: जीवित है ... और ... भी जीवित है
  rationale: दोहराए गए राजकीय, शपथ-सदृश उद्घोष को ज्यों का त्यों बनाए रखता है; इसे केवल ‘कायम है’ कहकर हल्का नहीं किया गया।
- source_word: βασιλεὺς Ναβουχοδονόσορ πάσης τῆς γῆς
  choice: सारी पृथ्वी का राजा नबूकदनेस्सर
  rationale: सम्बन्धकारक पदबंध को स्वाभाविक हिन्दी में राजा के सार्वभौम दावे के रूप में व्यक्त करता है, जैसा वक्तव्य की अतिशयोक्तिपूर्ण दरबारी भाषा में है।
- source_word: κράτος
  choice: प्रभुत्व
  rationale: यहाँ केवल शारीरिक सामर्थ्य नहीं, बल्कि प्रभावी राजकीय सत्ता अभिप्रेत है।
- source_word: κατόρθωσιν πάσης ψυχῆς
  choice: हर प्राणी की उन्नति
  rationale: ψυχή को यहाँ अमूर्त आत्मा तक सीमित न करके जीवित प्राणी के अर्थ में लिया गया है; κατόρθωσις के सफलता, समुचित व्यवस्था और हितकारी उन्नति के अर्थक्षेत्र को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἄνθρωποι
  choice: मनुष्य
  rationale: आगे पशुओं और पक्षियों से स्पष्ट विरोध होने के कारण समस्त मानवजाति का लिंग-समावेशी संकेत उपयुक्त है।
- source_word: δουλεύσουσιν
  choice: सेवा करेंगे
  rationale: साम्राज्यिक अधीनता का भाव रखता है, पर प्रसंग से अधिक विशिष्ट दासत्व-व्यवस्था आरोपित नहीं करता।
- source_word: διὰ σὲ
  choice: तुम्हारे कारण
  rationale: διά के साथ कर्मकारक यहाँ कारणसूचक है, साधनसूचक नहीं।
- source_word: θηρία τοῦ ἀγροῦ ... κτήνη ... πετεινὰ τοῦ οὐρανοῦ
  choice: वन-पशु, पालतू पशु और आकाश के पक्षी
  rationale: जंगली और घरेलू पशुओं का भेद रखते हुए पारंपरिक आकाशीय बिंब को आधुनिक, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς ἰσχύος σου
  choice: तुम्हारे पराक्रम से
  rationale: διά के साथ सम्बन्धकारक का साधनसूचक अर्थ सुरक्षित है; ἰσχύς को सैन्य सामर्थ्य के अनुकूल ‘पराक्रम’ कहा गया है।
- source_word: πάντα τὸν οἶκον αὐτοῦ
  choice: उसके सारे घराने
  rationale: ‘घराना’ राजा के परिवार, प्रतिष्ठान अथवा राजवंश—इन सम्भावनाओं को खुला रखता है।
theological_decisions:
- issue: नबूकदनेस्सर के सार्वभौम प्रभुत्व का शपथ-सदृश राजकीय उद्घोष
  choice: ‘सारी पृथ्वी का राजा ... जीवित है, और उसका प्रभुत्व भी जीवित है’ के रूप में अतिशयोक्तिपूर्ण कथन सुरक्षित रखा गया।
  alternative: इसे सामान्य दरबारी प्रशंसा या केवल ‘उसका शासन कायम है’ के रूप में सरल करना।
  rationale: यह यूदीत के रणनीतिक भाषण का कथानकगत अंश है। अनुवाद वक्ता के दावे को न तो धर्मसिद्ध सत्य घोषित करता है, न उसे नरम करके पाठ का तनाव मिटाता है।
- issue: πάσης ψυχῆς में ψυχή का आशय
  choice: ‘हर प्राणी’
  alternative: ‘हर आत्मा’ या ‘हर व्यक्ति’
  rationale: प्रसंग आगे मनुष्यों, पशुओं और पक्षियों तक फैलता है; इसलिए इसे केवल देहरहित आत्मा के धार्मिक अर्थ में सीमित करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘वन-पशु’ और ‘पालतू पशु’ जंगली तथा घरेलू जीवों का भेद स्पष्ट करते हैं; ‘आकाश के पक्षी’ मूल बाइबलीय बिंब बनाए रखता है। विस्मयादिबोधक चिह्न आरम्भिक शपथ-सदृश दरबारी उद्घोष की तीव्रता दर्शाता है।
