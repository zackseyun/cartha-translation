base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/013.yaml
  text: And the firstfruits of the grain and the tithes of the wine and of the oil[a], which they had set aside, having consecrated them for the priests who stand in Jerusalem before the face of our God—they have decided to consume[b], though it is not permitted for any of the people even to touch them with their hands.
translation:
  language: hi
  text: और अनाज की पहली उपज तथा दाखरस और तेल के दशमांश, जिन्हें उन्होंने यरूशलेम में हमारे परमेश्वर के सम्मुख खड़े याजकों के लिए पवित्र ठहराकर अलग रखा था—उनका उपभोग करने का उन्होंने निश्चय कर लिया है, यद्यपि प्रजा में से किसी के लिए उन्हें अपने हाथों से छूना तक उचित नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उचित नहीं है” का अनुवाद “अनुमति नहीं है” या “विधिसम्मत नहीं है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὰς τοῦ σίτου
  choice: अनाज की पहली उपज
  rationale: ἀπαρχή उपज के उस पहले अंश को सूचित करता है जो भेंट के रूप में अलग किया जाता था; σῖτος को अनावश्यक रूप से केवल गेहूँ तक सीमित न करके सामान्य अर्थ ‘अनाज’ रखा गया है।
- source_word: τὰς δεκάτας τοῦ οἴνου καὶ τοῦ ἐλαίου
  choice: दाखमधु और तेल के दशमांश
  rationale: δεκάτη का धार्मिक-आर्थिक अर्थ ‘दशमांश’ है; οἶνος के लिए ‘दाखमधु’ प्रसंगानुकूल और प्रतिष्ठित बाइबलीय हिन्दी है।
- source_word: ἃ ἐφυλάξαν
  choice: जिन्हें उन्होंने ... अलग रख छोड़ा था
  rationale: φυλάσσω यहाँ पवित्र उपयोग के लिए बचाकर रखने का भाव देता है; यह हिन्दी प्रयोग संरक्षण और आरक्षण दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἁγιάσαντες τοῖς ἱερεῦσιν
  choice: याजकों के लिए पवित्र करके
  rationale: सहभागी क्रिया पहले हो चुके पवित्रीकरण या समर्पण को दर्शाती है; सम्प्रदान कारक याजकों के उपयोग या लाभ के लिए समर्पण बताता है।
- source_word: τοῖς παρεστηκόσιν ἐν Ἰερουσαλὴμ ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν
  choice: यरूशलेम में हमारे परमेश्वर के सम्मुख सेवा में खड़े
  rationale: παρίστημι के ठोस ‘खड़े’ भाव को रखा गया है, जबकि मन्दिर के प्रसंग में निहित सेवा को स्पष्ट किया गया है। ἀπέναντι τοῦ προσώπου का स्वाभाविक हिन्दी रूप ‘सम्मुख’ परमेश्वर की उपस्थिति का भाव बनाए रखता है।
- source_word: κεκρίκασιν ἐξαναλῶσαι
  choice: खा डालने का निश्चय कर लिया है
  rationale: κεκρίκασιν दृढ़ निर्णय बताता है और ἐξαναλῶσαι इन खाद्य वस्तुओं को पूरी तरह खपा देने या खाने की ओर संकेत करता है; ‘खा डालना’ पूर्ण उपभोग की शक्ति बनाए रखता है।
- source_word: οὐδὲ ταῖς χερσὶν καθῆκεν ἅψασθαι οὐδένα τῶν ἐκ τοῦ λαοῦ
  choice: प्रजा में से किसी के लिए उन्हें अपने हाथों से छूना तक उचित नहीं है
  rationale: καθῆκεν में ‘उचित होना’ और प्रसंगगत निषेध दोनों की गुंजाइश है; मुख्य पाठ अधिक शाब्दिक ‘उचित नहीं’ रखता है और पादटिप्पणी नियामक विकल्प बताती है। ‘अपने हाथों से’ यूनानी बलाघात सुरक्षित रखता है।
theological_decisions:
- issue: याजकों के लिए रखी उपज की पवित्र स्थिति
  choice: उपज को याजकों के लिए विधिवत पवित्र करके अलग रखा गया था और सामान्य प्रजा को उसे छूना भी उचित नहीं था।
  alternative: इसे केवल व्यावहारिक रूप से बचाकर रखी गई उपज माना जा सकता है, बिना औपचारिक पवित्रीकरण के।
  rationale: ἐφυλάξαν और ἁγιάσαντες का संयोजन, याजकों का स्पष्ट उल्लेख और छूने तक का निषेध औपचारिक पवित्र स्थिति का प्रबल संकेत देते हैं।
- issue: καθῆκεν की नैतिक अथवा विधिक शक्ति
  choice: मुख्य पाठ में ‘उचित नहीं है’ रखा गया है।
  alternative: ‘अनुमति नहीं है’ अथवा ‘विधिसम्मत नहीं है’।
  rationale: क्रिया मूलतः उचित या शोभनीय होने का अर्थ दे सकती है, पर पवित्र वस्तुओं के प्रसंग में इसका बल विधिक निषेध जैसा भी हो सकता है; पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘याजक’, ‘दशमांश’ और ‘पवित्र’ जैसे स्थापित धार्मिक शब्द आवश्यक प्रसंगगत स्पष्टता देते हैं। यूनानी वाक्य की लंबी संरचना को एक ही प्रवाह में रखा गया है, पर डैश के द्वारा मुख्य आरोप को स्पष्ट किया गया है।
