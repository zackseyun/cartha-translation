base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/012.yaml
  text: For when their food had run out and all water had become scarce[a], they decided to use their livestock, and they determined to consume everything that God had commanded them by his laws not to eat.
translation:
  language: hi
  text: क्योंकि जब उनका भोजन समाप्त हो गया और सारा पानी भी दुर्लभ हो गया, तब उन्होंने अपने पशुओं पर हाथ डालने[a] का निश्चय किया; और जिन सब चीज़ों को परमेश्वर ने अपनी व्यवस्था के द्वारा उन्हें खाने से मना किया था, उन्हें भी खा डालने का उन्होंने निर्णय कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात अपने पशुओं को भोजन के रूप में उपयोग करने के लिए उनकी ओर मुड़ना। यूनानी मुहावरे का शाब्दिक अर्थ है, ‘अपने पशुओं पर टूट पड़ना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλειπεν αὐτοὺς τὰ βρώματα
  choice: उनका भोजन समाप्त हो गया
  rationale: यूनानी पदबंध खाद्य-सामग्री चुक जाने को दर्शाता है। सहज आधुनिक हिन्दी में यह पूर्ण अभाव का अर्थ स्पष्ट करता है।
- source_word: ἐσπανίσθη πᾶν ὕδωρ
  choice: सारा पानी भी दुर्लभ हो गया
  rationale: ἐσπανίσθη पानी के पूरी तरह समाप्त होने के बजाय उसकी व्यापक कमी बताता है; इसलिए ‘दुर्लभ हो गया’ इस भेद को बनाए रखता है।
- source_word: ἐβουλεύσαντο
  choice: निश्चय किया
  rationale: क्रिया विचार-विमर्श के बाद लिए गए निर्णय का बोध कराती है।
- source_word: ἐπιβαλεῖν τοῖς κτήνεσιν αὐτῶν
  choice: अपने पशुओं पर हाथ डालने
  rationale: यूनानी मुहावरे का बल बनाए रखते हुए यह बताता है कि वे विवश होकर अपने पालतू पशुओं को भोजन के लिए उपयोग करने वाले थे, पर मुख्य पाठ वध की क्रिया को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: κτήνεσιν
  choice: पशुओं
  rationale: यह संपत्ति के रूप में रखे जाने वाले पालतू पशुओं के लिए व्यापक और स्वाभाविक हिन्दी शब्द है।
- source_word: διεστείλατο αὐτοῖς ὁ θεὸς τοῖς νόμοις αὐτοῦ μὴ φαγεῖν
  choice: जिन सब चीज़ों को परमेश्वर ने अपनी व्यवस्था के द्वारा उन्हें खाने से मना किया था
  rationale: वाक्य को स्वाभाविक हिन्दी क्रम में रखते हुए ईश्वरीय निषेध और व्यवस्था में उसके आधार—दोनों को सुरक्षित रखा गया है। νόμοις बहुवचन है, पर इस यहूदी धार्मिक संदर्भ में ‘अपनी व्यवस्था’ सहज सामूहिक अभिव्यक्ति है।
- source_word: διέγνωσαν δαπανῆσαι
  choice: खा डालने का उन्होंने निर्णय कर लिया
  rationale: δαπανῆσαι का मूल भाव खर्च कर देने या समाप्त कर देने का है; खाद्य-संदर्भ में ‘खा डालने’ से उपभोग और समाप्ति दोनों का भाव आता है।
theological_decisions:
- issue: ईश्वरीय आहार-विषयक निषेध
  choice: परमेश्वर ने अपनी व्यवस्था के द्वारा उन्हें खाने से मना किया था
  alternative: परमेश्वर ने अपनी व्यवस्थाओं में उन्हें न खाने की आज्ञा दी थी
  rationale: यह पाठ निषेध को परमेश्वर की व्यवस्था में स्थापित करता है, पर किसी विशिष्ट तोराह-पद या बाद की धार्मिक व्याख्या को नहीं जोड़ता। ‘मना किया था’ हिन्दी में निषेध का सीधा और स्पष्ट रूप है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘व्यवस्था’ धार्मिक-कानूनी संदर्भ को बनाए रखती है; ‘पशुओं पर हाथ डालने’ की कठिन अभिव्यक्ति को पादटिप्पणी स्पष्ट करती है।
