- source_word: νῦν
  choice: अब
  rationale: यह कालवाचक क्रियाविशेषण होलोफेरनेस की बात में तत्काल अगले प्रश्न की ओर संकेत करता है।
- source_word: λέγε μοι
  choice: मुझे बताओ
  rationale: आज्ञार्थक क्रिया और अप्रत्यक्ष कर्म का आधुनिक हिन्दी में स्वाभाविक तथा सीधा रूप।
- source_word: τίνος ἕνεκεν
  choice: क्यों
  rationale: यह पद कारण पूछता है; ‘क्यों’ उसी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπέδρας ἀπʼ αὐτῶν
  choice: तुम उनसे भागकर
  rationale: ἀποδιδράσκω के भाग निकलने और ἀπό के अलगाव—दोनों भाव सुरक्षित रहते हैं।
- source_word: ἦλθες πρὸς ἡμᾶς
  choice: हमारे पास आई हो
  rationale: स्त्री पात्र को संबोधन के अनुसार हिन्दी में स्त्रीलिंग रखा गया है; संयुक्त वाक्य में पूर्ण वर्तमान रूप आगमन की वर्तमान प्रासंगिकता को स्वाभाविक बनाता है।
- source_word: ἥκεις
  choice: तुम ... आई हो
  rationale: ἥκω आगमन के परिणामस्वरूप उपस्थित होने का भाव रखता है, जिसे हिन्दी का पूर्ण वर्तमान व्यक्त करता है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार के लिए
  rationale: σωτηρία के बचाव/मुक्ति के व्यापक अर्थ को बनाए रखता है और केवल शारीरिक सुरक्षा तक अर्थ को सीमित नहीं करता; εἰς के लक्ष्यसूचक भाव को ‘के लिए’ से व्यक्त किया गया है।
theological_decisions:
- issue: कथात्मक संदर्भ में σωτηρία का अर्थ
  choice: उद्धार
  alternative: बचाव; मुक्ति; सुरक्षा
  rationale: ‘उद्धार’ σωτηρία की अर्थगत और सम्भावित धर्मवैचारिक व्यापकता सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में व्यावहारिक बचाव या सुरक्षा भी अभिप्रेत हो सकती है।
