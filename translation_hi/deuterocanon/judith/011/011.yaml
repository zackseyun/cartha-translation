base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/011.yaml
  text: And now[a], so that my lord may not become an outcast and ineffective, death will fall upon them, and sin has overtaken them[c][b], by which they provoke their God whenever they commit an offense.
translation:
  language: hi
  text: और अब, ऐसा न हो कि मेरे स्वामी निष्कासित और निष्फल हो जाएँ; मृत्यु उन पर आ पड़ेगी[a], और पाप ने उन्हें आ घेरा है—वह पाप जिसमें वे, जब कभी अनुचित काम करते हैं[b], अपने परमेश्वर को क्रोधित करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मृत्यु उनके चेहरे पर आ पड़ेगी।”
    reason: lexical_alternative
  - marker: b
    text: “अनुचित काम” का अनुवाद “बेतुका काम,” “लज्जाजनक काम” या “दुष्कर्म” भी हो सकता है। यूनानी शब्द अनुचित, मूर्खतापूर्ण अथवा नैतिक रूप से आपत्तिजनक आचरण को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκβολος
  choice: निकाल दिया जाए
  rationale: इस शब्द का मूल भाव बाहर फेंके या निष्कासित किए जाने का है। प्रसंग में यह स्वाभाविक हिन्दी है और होलोफेरनेस के असफल होकर लौटा दिए जाने की आशंका को व्यक्त करती है।
- source_word: ἄπρακτος
  choice: कुछ भी न कर पाएँ
  rationale: यह किसी कार्य को पूरा न कर पाने या निष्फल रह जाने का भाव रखता है। यह अनुवाद केवल सामान्य ‘असफल’ की अपेक्षा कार्य-अक्षमता के पक्ष को अधिक स्पष्ट रखता है।
- source_word: ἐπιπεσεῖται θάνατος ἐπὶ πρόσωπον αὐτῶν
  choice: मृत्यु उन पर आ पड़ेगी
  rationale: यूनानी में शाब्दिक रूप से मृत्यु के ‘उनके मुख पर’ आ पड़ने की अभिव्यक्ति है। हिन्दी मुहावरे में ‘उन पर आ पड़ेगी’ आकस्मिक और प्रबल संकट का भाव सुरक्षित रखता है।
- source_word: κατέλαβε
  choice: आ घेरा है
  rationale: क्रिया पकड़ लेने, जा पहुँचने या काबू में कर लेने का भाव देती है। ‘आ घेरा है’ पूर्व घटित क्रिया और उसकी वर्तमान परिणति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἁμάρτημα
  choice: पाप
  rationale: अगली उपवाक्य में उनके परमेश्वर को क्रोधित करने की बात होने से इसका धार्मिक और नैतिक भार बनाए रखना आवश्यक है।
- source_word: παροργιοῦσιν
  choice: क्रोधित करते हैं
  rationale: क्रिया विशेष रूप से क्रोध दिलाने या क्रोधित करने का अर्थ रखती है। हिन्दी में यह ‘उकसाते हैं’ से अधिक स्पष्ट है, पर कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ती।
- source_word: ἀτοπίαν
  choice: अनुचित काम
  rationale: शब्द अनुचित, बेतुके अथवा नैतिक रूप से आपत्तिजनक आचरण को सूचित कर सकता है। ‘अनुचित काम’ इस अर्थ-व्याप्ति को बिना ‘घोर अपराध’ जैसा अधिक तीखा अर्थ आरोपित किए सुरक्षित रखता है।
- source_word: ὁ κύριός μου
  choice: मेरे स्वामी
  rationale: यहाँ संबोधन मनुष्य होलोफेरनेस के लिए आदरसूचक है, कोई ईश्वरीय उपाधि नहीं। ‘मेरे स्वामी’ आधुनिक हिन्दी में उस सामाजिक संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: ἁμάρτημα के नैतिक-धार्मिक भार को बनाए रखना
  choice: पाप
  alternative: अपराध / कसूर
  rationale: परमेश्वर को क्रोधित करने का स्पष्ट संदर्भ सामान्य भूल की अपेक्षा धार्मिक-नैतिक उल्लंघन का संकेत देता है।
- issue: κύριος को मानवीय संबोधन के रूप में प्रस्तुत करना
  choice: मेरे स्वामी
  alternative: मेरे प्रभु / मेरे मालिक
  rationale: यह होलोफेरनेस के लिए दरबारी आदरसूचक संबोधन है। ‘प्रभु’ से अनावश्यक ईश्वरीय ध्वनि आ सकती है और ‘मालिक’ अपेक्षाकृत कम गरिमामय है।
- issue: मृत्यु और पाप से जुड़े कथनों का काल तथा तर्क-संबंध
  choice: ‘मृत्यु ... आ पड़ेगी’; ‘पाप ने ... आ घेरा है’
  alternative: दोनों को भविष्य या दोनों को भूतकाल में करना
  rationale: यूनानी पाठ भविष्य में आनेवाली मृत्यु और पहले ही उन्हें पकड़ चुके पाप के बीच तनाव रखता है; अनुवाद उसी भेद को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में यूनानी पाठ का भविष्यकाल बनाम पूर्ण हुई क्रिया का तनाव तथा ἀτοπία की अर्थगत व्यापकता सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
