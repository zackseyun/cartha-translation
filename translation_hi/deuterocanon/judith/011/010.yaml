base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/010.yaml
  text: Therefore[a], master lord, do not disregard his word, but lay it up in your heart, because it is true; for our people are not avenged, nor does the sword prevail against them[c][b], unless they sin against their God.
translation:
  language: hi
  text: इसलिए, हे स्वामी, हे प्रभु[a], उसकी बात को अनदेखा न कीजिए, बल्कि उसे अपने हृदय में रख लीजिए, क्योंकि वह सत्य है; क्योंकि न तो हमारे लोगों को दण्डित किया जाता है[b] और न ही तलवार उन पर प्रबल होती है, जब तक कि वे अपने ईश्वर के विरुद्ध पाप न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में दो संबोधन, δέσποτα और κύριε, प्रयुक्त हुए हैं; यहाँ दोनों को क्रमशः ‘स्वामी’ और ‘प्रभु’ से व्यक्त किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हमारे लोगों के विरुद्ध प्रतिशोध नहीं किया जाता।’ यूनानी क्रिया दण्डात्मक न्याय या प्रतिशोध किए जाने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को प्रस्तुत करता है और यूनानी के तार्किक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δέσποτα κύριε
  choice: हे स्वामी प्रभु
  rationale: 'दोनों संबोधन सुरक्षित रखे गए हैं: δέσποτα अधिकार रखने वाले स्वामी को और κύριε प्रभु को व्यक्त करता है। ‘हे’ हिन्दी में प्रत्यक्ष संबोधन स्पष्ट करता है।'
- source_word: μὴ παρέλθῃς τὸν λόγον αὐτοῦ
  choice: उसकी बात को अनदेखा न कीजिए
  rationale: λόγος यहाँ कही हुई बात या संदेश है और παρέρχομαι का भाव उसे टालने या उपेक्षित करने का है। आदरसूचक क्रिया होलोफेरनेस को किए गए संबोधन के अनुकूल है।
- source_word: κατάθου αὐτὸν ἐν τῇ καρδίᾳ σου
  choice: उसे अपने हृदय में रख लीजिए
  rationale: मूल का हृदय में रखने वाला रूपक बनाए रखते हुए भीतर ग्रहण करने और स्मरण रखने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἀληθής
  choice: सत्य
  rationale: यह कही हुई बात के सत्य होने का सीधा विधेय है; ‘सत्य’ संक्षिप्त, गरिमापूर्ण और स्पष्ट है।
- source_word: ἐκδικάται
  choice: दण्ड नहीं दिया जाता
  rationale: संदर्भ में निष्क्रिय क्रिया लोगों पर दण्डात्मक न्याय आने को व्यक्त करती है। ‘बदला नहीं लिया जाता’ शब्दार्थ की दूसरी संभावना है, पर हिन्दी में उससे यह भ्रम हो सकता है कि लोग स्वयं किसी और से बदला नहीं लेते।
- source_word: τὸ γένος ἡμῶν
  choice: हमारे लोगों
  rationale: γένος यहाँ यहूदी जन-समुदाय को सूचित करता है। ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक है और ‘जाति’ के संभावित आधुनिक सामाजिक अर्थों से बचता है।
- source_word: κατισχύει ῥομφαία ἐπʼ αὐτούς
  choice: तलवार उन पर प्रबल नहीं होती
  rationale: तलवार की ठोस सामरिक छवि और κατισχύω का प्रबल होने का भाव दोनों सुरक्षित रखे गए हैं।
- source_word: ἐὰν μὴ ἁμάρτωσιν εἰς τὸν θεὸν αὐτῶν
  choice: जब तक कि वे अपने ईश्वर के विरुद्ध पाप न करें
  rationale: यह उस एकमात्र शर्त को व्यक्त करता है जिसके अंतर्गत दण्ड या पराजय आ सकती है। ‘विरुद्ध पाप’ εἰς के संबंधात्मक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: δέσποτα κύριε का दोहरा संबोधन
  choice: हे स्वामी प्रभु
  alternative: हे सर्वोच्च प्रभु
  rationale: दो यूनानी उपाधियों को एक में मिलाने के बजाय दोनों को अलग-अलग व्यक्त किया गया है। साथ ही इसे ईश्वर के लिए विशिष्ट संबोधन नहीं बनाया गया, क्योंकि प्रसंग में यह होलोफेरनेस को संबोधित है।
- issue: इस्राएली जन की पराजय की पाप-संबंधी शर्त
  choice: जब तक कि वे अपने ईश्वर के विरुद्ध पाप न करें
  alternative: यदि वे अपने ईश्वर के विरुद्ध पाप न करें
  rationale: मूल कथन दण्ड और सैन्य पराजय को अपने ईश्वर के विरुद्ध पाप करने की शर्त से जोड़ता है। अनुवाद इस प्रबल धार्मिक दावे को नरम या व्याख्यायित नहीं करता।
- issue: ἐκδικάται का न्यायात्मक अर्थ
  choice: दण्ड नहीं दिया जाता
  alternative: उनसे बदला नहीं लिया जाता
  rationale: क्रिया में प्रतिशोध या न्याय लागू किए जाने की अर्थ-छाया हो सकती है। मुख्य पाठ में प्रसंगानुकूल दण्ड चुना गया है और दूसरी वास्तविक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरसूचक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। वाक्य में मूल की तर्क-श्रृंखला, हृदय का रूपक, तलवार की सामरिक छवि और पाप से जुड़ी धार्मिक शर्त सुरक्षित हैं।
