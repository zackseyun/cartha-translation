base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/014.yaml
  text: And bring about[a], upon all your nation and every tribe, recognition, so that they may know that you are the God of all power and might[b], and there is no other who defends the people of Israel except you.
translation:
  language: hi
  text: और तेरे समस्त लोगों और प्रत्येक गोत्र में तेरी ऐसी पहचान उत्पन्न कर[a], ताकि वे जानें कि तू ही समस्त सामर्थ्य और बल का परमेश्वर है, और इस्राएल के वंश की रक्षा करनेवाला तेरे सिवा कोई और नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहचान’ के स्थान पर ‘पूर्ण ज्ञान’ या ‘स्वीकार’ भी संभव है; यूनानी ἐπίγνωσιν।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον … ἐπίγνωσιν
  choice: यह पहचान उत्पन्न कर
  rationale: ποίησον का कारक भाव और उसके कर्म ἐπίγνωσιν का ‘पहचान/अभिज्ञान’ अर्थ साथ रखते हुए यह वाक्यांश स्वाभाविक हिन्दी देता है।
- source_word: ἐπὶ πᾶν τὸ ἔθνος σου καὶ πάσης φυλῆς
  choice: अपनी सारी प्रजा और हर गोत्र में
  rationale: ἔθνος के सामूहिक अर्थ को आधुनिक हिन्दी में ‘प्रजा’ से व्यक्त किया गया है; φυλή के वितरणात्मक एकवचन को ‘हर गोत्र’ रखा गया है। प्रसंग में ἐπί का आशय उस समुदाय के बीच पहचान उत्पन्न होने से है, इसलिए ‘में’ स्वाभाविक है।
- source_word: τοῦ εἰδῆσαι
  choice: ताकि वे जानें
  rationale: τοῦ सहित क्रियार्थक संज्ञा यहाँ प्रयोजन अथवा परिणाम बताती है; ‘ताकि’ इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: ὁ θεὸς πάσης δυνάμεως καὶ κράτους
  choice: समस्त सामर्थ्य और प्रभुत्व का परमेश्वर
  rationale: δύναμις को ‘सामर्थ्य’ और κράτος को ‘प्रभुत्व’ कहने से दोनों निकट किंतु अलग शक्ति-संबंधी धारणाएँ बनी रहती हैं।
- source_word: ὑπερασπίζων
  choice: रक्षा करनेवाला
  rationale: यह कृदंत सक्रिय रूप से बचाव या संरक्षण करनेवाले को दर्शाता है; ‘रक्षा करनेवाला’ युद्ध और उद्धार के प्रसंग में उपयुक्त है।
- source_word: τοῦ γένους Ἰσραήλ
  choice: इस्राएल के वंश
  rationale: γένος के वंशगत-सामुदायिक अर्थ को ‘वंश’ संक्षेप और गरिमा के साथ व्यक्त करता है, बिना आधुनिक नस्लीय शब्दावली आरोपित किए।
- source_word: εἰ μὴ σύ
  choice: तेरे सिवा कोई और नहीं
  rationale: यह यूनानी पद परमेश्वर की अनन्य भूमिका पर स्पष्ट बल देता है; हिन्दी अभिव्यक्ति उसी अपवर्जक अर्थ को बनाए रखती है।
theological_decisions:
- issue: इस्राएल की रक्षा में परमेश्वर की अनन्यता
  choice: इस्राएल के वंश की रक्षा करनेवाला तेरे सिवा कोई और नहीं है
  alternative: केवल तू ही इस्राएल के लोगों का रक्षक है
  rationale: मूल यूनानी के निषेधात्मक और अपवर्जक ढाँचे को ज्यों का त्यों रखा गया है; कथन को पद से परे किसी व्यापक सिद्धान्त में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर के लिए निकट और प्रत्यक्ष संबोधन ‘तू/तेरे’ रखा गया है।
