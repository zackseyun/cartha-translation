  yaml_path: translation/deuterocanon/judith/009/010.yaml
  text: Strike servant against ruler with the deceit of my lips[a], and ruler against his attendant; shatter their arrogance by the hand of a woman.
translation:
  language: hi
  text: मेरे होंठों के छल के द्वारा दास से शासक के विरुद्ध और शासक से उसके परिचारक के विरुद्ध प्रहार करवा; एक स्त्री के हाथ से उनके घमंड[a] को चकनाचूर कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके उठ खड़े होने’ अथवा ‘उनकी ढिठाई’ को; यूनानी संज्ञा दुर्लभ है और घमंड से ऊँचा उठने या विद्रोह में उठ खड़े होने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάταξον
  choice: प्रहार कर
  rationale: यह प्रत्यक्ष आज्ञार्थक क्रिया प्रबल आघात की प्रार्थना व्यक्त करती है। ‘प्रहार कर’ आधुनिक और गरिमापूर्ण है तथा अनिवार्य रूप से मृत्यु का अर्थ नहीं जोड़ता।
- source_word: δοῦλον
  choice: दास
  rationale: यह शब्द अधीन और बंधुआ सामाजिक स्थिति को सूचित करता है। ‘दास’ शासक के साथ निहित पदानुक्रमिक विरोध को ‘सेवक’ से अधिक स्पष्ट रखता है।
- source_word: ἐκ χειλέων ἀπάτης μου
  choice: मेरे होंठों के छल से
  rationale: यूनानी वाक्यांश में छल और वक्ता के होंठ दोनों स्पष्ट हैं तथा प्रसंग में यह साधन का भाव देता है। यह अनुवाद ‘शब्द’ जोड़े बिना प्रथम-पुरुष की छल-स्वीकृति बनाए रखता है।
- source_word: ἐπʼ ἄρχοντι
  choice: शासक के विरुद्ध
  rationale: πάταξον के साथ ἐπί यहाँ विरोध या आक्रमण की दिशा बताता है। ‘के विरुद्ध’ सहज हिन्दी में इस संबंध को व्यक्त करता है।
- source_word: ἄρχοντα
  choice: शासक
  rationale: यह अधिकार रखने वाले व्यक्ति के लिए व्यापक शब्द है। ‘शासक’ किसी विशेष राजकीय पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: θεράποντι
  choice: परिचारक
  rationale: θεράπων प्रायः निजी सेवा में लगे सहायक या अनुचर को दर्शाता है। ‘परिचारक’ इसे δοῦλος के लिए प्रयुक्त ‘दास’ से अलग रखता है।
- source_word: θραῦσον
  choice: चकनाचूर कर दे
  rationale: क्रिया निर्णायक रूप से तोड़ डालने का प्रबल भाव रखती है। ‘चकनाचूर कर दे’ उसकी तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἀνάστεμα
  choice: उनके घमंड
  rationale: दुर्लभ संज्ञा गर्वपूर्ण ऊँचाई, ढिठाई या उठ खड़े होने का भाव दे सकती है। प्रसंग में ‘घमंड’ नैतिक अभिप्राय को सहज रूप से व्यक्त करता है; शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: ἐν χειρὶ θηλείας
  choice: एक स्त्री के हाथ से
  rationale: यह कर्तृता या माध्यम व्यक्त करने वाला बाइबिलीय मुहावरा है। ‘स्त्री’ यूनानी में स्पष्ट स्त्रीलिंग कर्तृता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: यहूदीत की प्रार्थना में स्त्री की स्पष्ट कर्तृता
  choice: एक स्त्री के हाथ से
  alternative: स्त्री के द्वारा
  rationale: यूनानी θηλείας स्त्री होने को स्पष्ट रूप से चिह्नित करता है। इसे लिंग-निरपेक्ष न करके पाठ में शक्तिशाली लोगों को एक अप्रत्याशित स्त्री-साधन से गिराने का कथात्मक तनाव सुरक्षित रखा गया है।
- issue: छलपूर्ण वाणी का साधन बनना
  choice: मेरे होंठों के छल से
  alternative: मेरे छलपूर्ण होंठों से
  rationale: पाठ यहूदीत के छल को न तो छिपाता है, न उसकी नैतिक व्याख्या करता है। अनुवाद प्रार्थना में उपस्थित तनाव को बिना धर्मसैद्धांतिक समाधान जोड़े बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। ‘दास’, ‘शासक’ और ‘परिचारक’ मूल के तीन सामाजिक पदों का भेद बनाए रखते हैं। समानांतर वाक्य-विन्यास जानबूझकर संरक्षित है, यद्यपि मूल यूनानी में प्रहार के पक्षों का संबंध कुछ असामान्य और तनावपूर्ण है।
