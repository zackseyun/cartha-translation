  yaml_path: translation/deuterocanon/judith/009/005.yaml
  text: For you made those things before them, and those things and the things afterward and the things now and the things to come you planned[a][b], and what you planned came to be.
translation:
  language: hi
  text: क्योंकि तूने उनसे पहले की बातें बनाईं; और उन बातों, बाद की बातों, जो अब हैं, और जो आनेवाली हैं—इन सबकी तूने योजना बनाई[a][b]; और जिन बातों की तूने योजना बनाई, वे घटित हो गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘योजना बनाई’ के स्थान पर ‘विचार किया’ या ‘ठाना’ भी संभव है (διενοήθης)।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में समय-संबंधी अभिव्यक्तियाँ एक के बाद एक आती हैं: ‘उनसे पहले की बातें,’ ‘वे बातें,’ ‘बाद की बातें,’ ‘जो अब हैं,’ और ‘जो आनेवाली हैं।’ यह सभी कालों पर परमेश्वर के अधिकार को उभारता है।'
    reason: cultural_note
lexical_decisions:
- source_word: σὺ γὰρ
  choice: क्योंकि तूने
  rationale: γάρ प्रार्थना की अपील का आधार बताता है और σὺ पर बल है; हिंदी में ‘क्योंकि तूने’ कारणात्मक संबंध और संबोधन की निकटता दोनों बनाए रखता है।
- source_word: ἐποίησας
  choice: घटित किया
  rationale: ποιέω यहाँ व्यापक रूप से करने या अस्तित्व में लाने का भाव देता है। ‘घटित किया’ घटनाओं और कालक्रम के संदर्भ में स्वाभाविक है तथा अनावश्यक रूप से तकनीकी ‘सृष्टि की’ नहीं कहता।
- source_word: τὰ πρότερα ἐκείνων
  choice: उनसे पहले की बातों को
  rationale: यह संक्षिप्त यूनानी पदबंध πρότερα के पूर्वकालिक और ἐκείνων के तुलनात्मक संबंध को सुरक्षित रखता है, बिना ‘उन’ के संदर्भ को स्पष्ट करने का प्रयास किए।
- source_word: καὶ ἐκεῖνα
  choice: और उन बातों को
  rationale: ἐκεῖνα को अलग तत्व के रूप में रखा गया है, ताकि यूनानी की पुनरुक्त, क्रमबद्ध संरचना न मिटे।
- source_word: τὰ μετέπειτα
  choice: बाद की बातों को
  rationale: μετέπειτα समय में बाद में होने वाली बातों को दर्शाता है; यह चयन आसपास की बहुवचन संरचना के समानांतर है।
- source_word: τὰ νῦν
  choice: जो अब हैं
  rationale: νῦν वर्तमान समय को सूचित करता है। ‘जो अब हैं’ आधुनिक हिंदी में स्वाभाविक रहते हुए वर्तमान की वस्तुओं या घटनाओं की व्यापकता बनाए रखता है।
- source_word: τὰ ἐπερχόμενα
  choice: जो आनेवाली हैं
  rationale: ἐπερχόμενα निकट आती या भविष्य में होने वाली बातों को दर्शाता है; स्त्रीलिंग रूप ‘बातों’ से मेल खाता है।
- source_word: διενοήθης
  choice: तूने योजना बनाई
  rationale: διανοέομαι विचार करने, ठानने या उद्देश्य बनाने का अर्थ दे सकता है। संदर्भ में विचार के फलित होने के कारण ‘योजना बनाई’ उद्देश्यपूर्ण भाव को स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἐγενήθησαν
  choice: वे घटित हो गईं
  rationale: γίνομαι यहाँ विचारित बातों के वास्तविक हो जाने को व्यक्त करता है। ‘घटित हो गईं’ परिणामसूचक है और इसे केवल सृष्टि तक सीमित नहीं करता।
- source_word: ἃ ἐνενοήθης
  choice: जिन बातों की तूने योजना बनाई
  rationale: संबंधवाचक उपवाक्य परमेश्वर के पूर्व विचार या उद्देश्य की ओर लौटता है; समान हिंदी अभिव्यक्ति दोहराने से यूनानी का संबंध स्पष्ट रहता है।
theological_decisions:
- issue: भूत, वर्तमान और भविष्य पर परमेश्वर के ज्ञान तथा प्रभुत्व की भाषा
  choice: परमेश्वर के घटित करने और सभी कालों की योजना बनाने की भाषा रखी गई है, पर बाद की दार्शनिक या व्यवस्थित धर्मवैज्ञानिक शब्दावली नहीं जोड़ी गई।
  alternative: διενοήθης का अनुवाद केवल ‘विचार किया’ करना, या ἐποίησας को ‘सृष्टि की’ कहना।
  rationale: पद परमेश्वर की उद्देश्यपूर्ण सोच और उसके फलित होने पर बल देता है। ‘योजना बनाई’ इस उद्देश्य को व्यक्त करता है, जबकि ‘घटित किया’ ποιέω को तकनीकी सृष्टि-विधान में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। ‘तू’ मूल यूनानी के एकवचन प्रत्यक्ष संबोधन और प्रार्थना की निकटता को व्यक्त करता है। यूनानी की कुछ असहज किंतु अर्थपूर्ण पुनरुक्ति को जानबूझकर सुरक्षित रखा गया है।
