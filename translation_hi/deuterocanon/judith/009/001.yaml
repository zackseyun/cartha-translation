  yaml_path: translation/deuterocanon/judith/009/001.yaml
  text: But Judith fell on her face[a], and put ashes on her head, and uncovered the sackcloth she had been wearing. And at that very time the evening incense was being offered in Jerusalem in the house of God, and Judith cried out with a loud voice to the Lord[b],
translation:
  language: hi
  text: परन्तु यहूदित मुँह के बल गिर पड़ी, उसने अपने सिर पर राख डाली और अपने पहने हुए टाट को अनावृत कर दिया[a]। ठीक उसी समय यरूशलेम में परमेश्वर के भवन में उस संध्या की धूप चढ़ाई जा रही थी[b]। तब यहूदित ने ऊँचे स्वर से प्रभु को पुकारा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उसने अपने पहने हुए टाट को दिखाई देने योग्य कर दिया; यूनानी शब्द आवश्यक रूप से टाट उतारने का अर्थ नहीं देता।
    reason: lexical_alternative
  - marker: b
    text: यह यरूशलेम के पवित्रस्थान में संध्या के लिए नियत धूप-अर्पण था।
    reason: cultural_note
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: मुँह के बल गिर पड़ी
  rationale: यह यूनानी मुहावरा शोक, दीनता या विनती में मुँह के बल गिरने की ठोस मुद्रा व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए मूल बिंब को सुरक्षित रखता है।
- source_word: ἐπέθετο σποδὸν ἐπὶ τὴν κεφαλὴν αὐτῆς
  choice: अपने सिर पर राख डाली
  rationale: यह शोक का प्रचलित सांकेतिक कार्य है। यूनानी में σποδός एकवचन है, पर हिन्दी में पदार्थवाचक ‘राख’ स्वाभाविक है।
- source_word: ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον
  choice: जो टाट उसने पहन रखा था, उसे उघाड़ दिया
  rationale: ἐγύμνωσεν का अर्थ यहाँ टाट को उतारना नहीं, बल्कि उसे ढकने वाले वस्त्र से प्रकट या अनावृत करना है। ‘उघाड़ दिया’ इस क्रिया को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: ἦν ἄρτι προσφερόμενον
  choice: ठीक उसी समय ... चढ़ाई जा रही थी
  rationale: ἄρτι तत्कालिकता पर बल देता है और कृदन्तीय निष्क्रिय रचना जारी क्रिया बताती है; हिन्दी की अपूर्ण निष्क्रिय रचना दोनों भावों को व्यक्त करती है।
- source_word: εἰς τὸν οἶκον τοῦ θεοῦ
  choice: परमेश्वर के भवन में
  rationale: वाक्यांश का शाब्दिक भाव ‘परमेश्वर का भवन’ है और प्रसंग में यह यरूशलेम के पवित्रस्थान को दर्शाता है। ‘भवन’ मूल पदावली को ‘मन्दिर’ कहकर अधिक स्पष्ट करने से बचाता है।
- source_word: τὸ θυμίαμα τῆς ἑσπέρας ἐκείνης
  choice: उस संध्या की धूप
  rationale: θυμίαμα विशेष रूप से सुगन्धित धूप को सूचित करता है, सामान्य बलि को नहीं। ἐκείνης को ‘उस’ द्वारा स्पष्ट रूप से रखा गया है।
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से ... पुकारा
  rationale: यह अत्यावश्यक प्रार्थना या दुहाई की प्रबल अभिव्यक्ति है। यह हिन्दी में स्वाभाविक रूप से क्रिया और स्वर की तीव्रता दोनों रखती है।
- source_word: πρὸς Κύριον
  choice: प्रभु को
  rationale: πρός प्रार्थना की दिशा बताता है और Κύριος के लिए ‘प्रभु’ प्रतिष्ठित, गरिमामय तथा प्रसंगानुकूल हिन्दी पद है।
theological_decisions:
- issue: Κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ संबोधन परमेश्वर से की गई आराधनापूर्ण प्रार्थना का है। ‘प्रभु’ धार्मिक अर्थ और सामान्य बोध दोनों बनाए रखता है।
- issue: οἶκος τοῦ θεοῦ का उपासना-संबंधी आशय
  choice: परमेश्वर का भवन
  alternative: परमेश्वर का मन्दिर
  rationale: प्रसंग यरूशलेम के पवित्रस्थान का है, पर मूल यूनानी में ‘परमेश्वर का भवन’ है। उसी पदावली को रखने से मूल रूपक सुरक्षित रहता है और अर्थ को अनावश्यक रूप से अधिक विशिष्ट नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमामय और प्रार्थना-प्रसंग के अनुरूप रूप रखा गया है। ‘टाट’, ‘धूप चढ़ाना’ और ‘प्रभु’ जैसे व्यापक रूप से समझे जाने वाले बाइबिलीय पद प्रयुक्त हैं। विराम के अंत में अल्पविराम अगले पद में आने वाली प्रार्थना से वाक्य का संबंध बनाए रखता है।
