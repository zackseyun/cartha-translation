base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/013.yaml
  text: And make my words and deceit become their wound and bruise[b][a], they who have devised harsh things against your covenant and your sanctified house and the summit of Zion and the house possessed by your sons.
translation:
  language: hi
  text: और मेरी बात और छल को उनका घाव और चोट बना दे[a]—उन लोगों का, जिन्होंने तेरी वाचा, तेरे पवित्र किए हुए भवन, सिय्योन की चोटी, और तेरे पुत्रों के अधिकार में जो भवन है[b], उसके विरुद्ध कठोर योजनाएँ बनाई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस संक्षिप्त यूनानी वाक्य का अर्थ यह भी हो सकता है: “मेरी बात और छल को उनके लिए चोट और घाव का साधन बना दे।” बल या तो वक्ता द्वारा अपनाए गए साधन पर या शत्रुओं को होने वाले परिणाम पर हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “तेरे पुत्रों के अधिकार में जो भवन है” वाला यूनानी वाक्यांश कठिन है। इसका आशय परमेश्वर के लोगों के निवास या विरासत से हो सकता है—संभवतः उनकी भूमि या पवित्रस्थान से।
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς ... εἰς
  choice: '... को ... बना दे'
  rationale: आज्ञार्थक δὸς और परिणाम/उद्देश्य सूचक εἰς को साथ लेकर यह प्रयोग स्वाभाविक हिन्दी में उस साधन के परिणाम को व्यक्त करता है, बिना यह तय किए कि बल मुख्यतः साधन पर है या लगी हुई चोट पर।
- source_word: λόγον μου
  choice: मेरी बात
  rationale: λόγος यहाँ बोलकर कही जाने वाली बात को सूचित करता है। ‘मेरी बात’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल योजना या भाषण तक सीमित नहीं करता।
- source_word: ἀπάτην
  choice: छल
  rationale: यह शब्द धोखे या कपटपूर्ण युक्ति को सीधे व्यक्त करता है। ‘छल’ मूल पाठ के नैतिक तनाव को नरम किए बिना संक्षिप्त और गरिमापूर्ण हिन्दी देता है।
- source_word: εἰς τραῦμα καὶ μώλωπα αὐτῶν
  choice: उनके लिए घाव और चोट
  rationale: दो अलग चोट-सूचक संज्ञाओं को बनाए रखा गया है। ‘उनके लिए’ यूनानी की संक्षिप्त रचना में निहित लक्ष्य/परिणाम को हिन्दी में स्पष्ट करता है।
- source_word: διαθήκης σου
  choice: तेरी वाचा
  rationale: बाइबिलीय संदर्भ में διαθήκη के संबंधपरक और धर्मवैचारिक अर्थ को ‘वाचा’ ठीक प्रकार से बनाए रखता है।
- source_word: οἴκου ἡγιασμένου σου
  choice: तेरे पवित्र किए हुए भवन
  rationale: ἡγιασμένου पूर्ण कर्मवाच्य कृदंत है; ‘पवित्र किए हुए’ केवल ‘पवित्र’ कहने की अपेक्षा उस क्रियात्मक अर्थ को सुरक्षित रखता है।
- source_word: κορυφῆς Σιὼν
  choice: सिय्योन की चोटी
  rationale: κορυφή का ठोस स्थलाकृतिक बिंब ‘चोटी’ से सहज और निकट रूप में प्रकट होता है।
- source_word: οἴκου κατασχέσεως υἱῶν σου
  choice: तेरे पुत्रों के अधिकार वाला भवन
  rationale: κατάσχεσις में अधिकार, धारण या कब्जे का भाव है। कठिन यूनानी संबंध को अत्यधिक निर्णायक बनाए बिना पठनीय हिन्दी दी गई है; संभावित अर्थ फुटनोट में बताया गया है।
- source_word: ἐβουλεύσαντο σκληρά
  choice: क्रूर योजनाएँ रची हैं
  rationale: βουλεύομαι योजना बनाने या षड्यंत्र रचने और σκληρά कठोर/क्रूर बातों या कामों का बोध देता है। यह रूप वर्तमान हिन्दी में स्वाभाविक रहते हुए शत्रुतापूर्ण आशय को व्यक्त करता है।
theological_decisions:
- issue: यहूदीत की प्रार्थना में परमेश्वर से उसके छल को साधन बनाने का अनुरोध
  choice: मुख्य पाठ में ἀπάτην का सीधा अनुवाद ‘छल’
  alternative: धोखा; युक्ति
  rationale: मूल पाठ इस नैतिक तनाव को स्पष्ट रूप से रखता है। अनुवाद इसे नरम करके निष्पक्ष ‘युक्ति’ नहीं बनाता और न इसकी धर्मवैचारिक व्याख्या जोड़ता है।
- issue: διαθήκη का अनुवाद
  choice: वाचा
  alternative: संधि; करार
  rationale: ‘वाचा’ इस्राएल और परमेश्वर के बीच बाइबिलीय संबंध का अर्थ बनाए रखता है, जबकि सामान्य कानूनी समझौते तक इसे सीमित नहीं करता।
- issue: οἴκου κατασχέσεως υἱῶν σου की पहचान
  choice: तेरे पुत्रों के अधिकार वाला भवन
  alternative: तेरे पुत्रों का निवास/विरासत; परमेश्वर के लोगों की भूमि या पवित्रस्थान
  rationale: वाक्यांश पाठगत और अर्थगत रूप से कठिन है। मुख्य पाठ निकट अर्थ रखता है और फुटनोट संभावित संकेत देता है, पर भूमि और पवित्रस्थान में से किसी एक को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए निकट संबोधन ‘तेरी/तेरे’ प्रयुक्त है, जो एकवचन यूनानी संबोधन और हिन्दी बाइबिलीय प्रार्थना-परंपरा के अनुकूल है। कठिन अंतिम वाक्यांश को जानबूझकर पूरी तरह व्याख्यायित नहीं किया गया।
