  naturalness: The register is appropriately elevated and modern. The revision makes the infantry-strength phrase natural while retaining the underlying arm/strength image.
  terminology: “अश्शूरी,” “प्रभु,” “ढाल,” “भाला,” “धनुष,” and “गोफन” are suitable. “युद्धों को चूर-चूर कर देनेवाला” preserves the striking Greek image without doctrinal over-interpretation.
