    issue: “पैदल सैनिकों की भुजाओं पर इतराए हैं” is awkward and obscures the metaphorical sense
    rationale: βραχίων denotes an arm and, idiomatically here, military strength. In Hindi, boasting “on the arms” of soldiers is unnatural. “पैदल सैनिकों की भुजा-शक्ति पर” preserves the arm image and clearly conveys the intended military force.
