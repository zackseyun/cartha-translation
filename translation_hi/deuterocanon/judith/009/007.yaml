base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/007.yaml
  text: For behold[a], the Assyrians have multiplied in their strength; they have been exalted on horse and rider; they have boasted in the arm of foot soldiers; they have hoped in shield and spear and bow and sling, and they have not known that you are the Lord[b], the one who shatters wars.
translation:
  language: hi
  text: क्योंकि देख, अश्शूरी अपनी शक्ति में बहुत बढ़ गए हैं; वे घोड़े और सवार के बल पर ऊँचे उठे हैं; वे पैदल सैनिकों की भुजा-शक्ति पर इतराए हैं; उन्होंने ढाल, भाले, धनुष और गोफन पर भरोसा रखा है[a], और उन्होंने यह नहीं जाना कि तू प्रभु है—युद्धों को चूर-चूर कर देनेवाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ढाल, भाले, धनुष और गोफन पर आशा रखी है।” यूनानी क्रिया का अर्थ “आशा रखना” या “भरोसा करना” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “युद्धों को समाप्त करनेवाला।” शाब्दिक रूप से, “युद्धों को चूर-चूर करनेवाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: क्योंकि देख
  rationale: γάρ के कारणसूचक संबंध और ἰδού के ध्यान आकर्षित करने वाले बल, दोनों को प्रार्थना की गरिमामय शैली में बनाए रखता है।
- source_word: ἐπληθύνθησαν ἐν δυνάμει αὐτῶν
  choice: अपनी शक्ति में बहुत बढ़ गए हैं
  rationale: ἐπληθύνθησαν की वृद्धि और ἐν δυνάμει की मूल संरचना को बनाए रखते हुए यह संख्या और सैन्य सामर्थ्य—दोनों की संभावित छाया खुली रखता है।
- source_word: ὑψώθησαν ἐφʼ ἵππῳ καὶ ἀναβάτῃ
  choice: घोड़े और सवार के बल पर ऊँचे उठे हैं
  rationale: ὑψώθησαν के ऊँचा उठने के रूपक को सुरक्षित रखता है और ἐπί को यहाँ घुड़सवार सैन्य शक्ति के आधार के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; इसे केवल 'घमंडी हुए' कहकर अर्थ को सीमित नहीं करता।
- source_word: ἐγαυρίασαν ἐν βραχίονι πεζῶν
  choice: पैदल सैनिकों की भुजाओं पर इतराए हैं
  rationale: ἐγαυρίασαν के गर्वपूर्ण इतराने और βραχίων की ठोस 'भुजा' वाली छवि को बनाए रखता है; 'शक्ति' कर देने से मूल रूपक मिट जाता।
- source_word: ἤλπισαν
  choice: भरोसा रखा है
  rationale: हथियारों के संदर्भ में हिन्दी में 'भरोसा रखना' स्वाभाविक है। यूनानी क्रिया में 'आशा रखना' और 'भरोसा करना' दोनों अर्थ संभव हैं, इसलिए वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀσπίδι καὶ ἐν γαίσῳ καὶ τόξῳ καὶ σφενδόνῃ
  choice: ढाल, भाले, धनुष और गोफन पर
  rationale: चारों प्राचीन सैन्य साधनों को स्पष्ट, प्रचलित और अनावश्यक विशिष्टता से रहित हिन्दी में प्रस्तुत करता है।
- source_word: οὐκ ἔγνωσαν
  choice: उन्होंने यह नहीं जाना
  rationale: ज्ञान या पहचान की नैतिक-आध्यात्मिक विफलता को स्रोत की गंभीरता के साथ व्यक्त करता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: κύριος के ईश्वरीय संबोधन का मानक, गरिमामय हिन्दी रूप; स्रोत में न पाए जाने वाले विशिष्ट परमेश्वर-नाम को आरोपित नहीं करता।
- source_word: συντρίβων πολέμους
  choice: युद्धों को चूर-चूर कर देनेवाला
  rationale: συντρίβω की प्रबल और ठोस 'तोड़ डालने' वाली छवि को बनाए रखता है, बजाय इसे केवल 'युद्ध समाप्त करनेवाला' बनाकर रूपक को समतल करने के।
theological_decisions:
- issue: क्या κύριος को विशिष्ट परमेश्वर-नाम के रूप में प्रस्तुत किया जाए
  choice: प्रभु
  alternative: यहोवा / प्रभु परमेश्वर
  rationale: यूनानी स्रोत में κύριος है। 'प्रभु' शीर्षक की शक्ति बनाए रखता है और ऐसा नाम या विस्तार नहीं जोड़ता जो पाठ में नहीं है।
- issue: συντρίβων πολέμους को रूपक सहित रखना या परिणामपरक ढंग से कहना
  choice: युद्धों को चूर-चूर कर देनेवाला
  alternative: युद्धों को समाप्त करनेवाला
  rationale: मूल पाठ परमेश्वर को युद्धों को 'चूर करनेवाला' कहता है। इस असामान्य और प्रबल रूपक को बनाए रखना परमेश्वर द्वारा सैन्य शक्ति को तोड़ने की धार्मिक छवि तथा उसकी अंतर्निहित तनावपूर्ण भाषा की रक्षा करता है।
- issue: ἤλπισαν में आशा और भरोसे के बीच अर्थ
  choice: भरोसा रखा है
  alternative: आशा रखी है
  rationale: हथियारों को आधार बनाने के संदर्भ में 'भरोसा' आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि 'आशा' की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-गंभीर संबोधन “तू” मूल के σύ के अनुरूप है। सैन्य बिंबों—घोड़ा और सवार, भुजा, ढाल, भाला, धनुष और गोफन—को ठोस रूप में सुरक्षित रखा गया है; कठिन रूपक को अनावश्यक व्याख्या से सरल नहीं बनाया गया।
