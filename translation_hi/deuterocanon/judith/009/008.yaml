base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/008.yaml
  text: Lord is your name[a]; you, shatter their strength in your power, and break their might in your wrath; for they planned to profane your holy things, to defile the tabernacle, the resting place of your glorious name[b], and to cast down with the sword the horn of your altar.
translation:
  language: hi
  text: प्रभु आपका नाम है। आप अपनी सामर्थ्य से उनकी शक्ति चकनाचूर कर दीजिए और अपने क्रोध में उनका पराक्रम तोड़ दीजिए; क्योंकि उन्होंने आपकी पवित्र वस्तुओं[a] को अपवित्र करने, उस निवासस्थान को अशुद्ध करने जो आपके महिमामय नाम का विश्रामस्थान है, और तलवार से आपकी वेदी का सींग गिरा देने की योजना बनाई है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र वस्तुओं’ से पवित्र सामग्री के साथ-साथ पवित्र स्थान या परिसर भी अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘लोहे से’; यहाँ ‘लोहा’ संभवतः लोहे के हथियार के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος ὄνομά σοι
  choice: “प्रभु” आपका नाम है
  rationale: यूनानी की विधेयात्मक और संबोधन-सदृश संरचना को बनाए रखते हुए स्पष्ट किया गया है कि ‘प्रभु’ परमेश्वर का नाम/उपाधि कहा जा रहा है।
- source_word: ῥάξον ... τὴν ἰσχὺν
  choice: उनकी शक्ति चकनाचूर कर दीजिए
  rationale: ῥάξον के प्रबल, हिंसक रूप से तोड़ने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατάξον τὸ κράτος
  choice: उनका पराक्रम तोड़ दीजिए
  rationale: पहले क्रियापद से शब्दगत भेद रखते हुए κατάξον के तोड़ डालने और κράτος के प्रबल सामर्थ्य के भाव को सुरक्षित रखता है।
- source_word: ἐν τῷ θυμῷ σου
  choice: अपने क्रोध में
  rationale: ἐν की निकट औपचारिक संगति तथा θυμός के तीव्र क्रोध को बनाए रखता है, बिना उसे किसी विशिष्ट धर्मसैद्धांतिक व्याख्या में बदलने के।
- source_word: βεβηλῶσαι τὰ ἅγιά σου
  choice: आपकी पवित्र वस्तुओं को अपवित्र करने
  rationale: βεβηλόω में पवित्र को साधारण/अपवित्र ठहराने का उपासना-संबंधी भाव है; बहुवचन τὰ ἅγια को केवल भवन तक सीमित नहीं किया गया।
- source_word: τὸ σκήνωμα τῆς καταπαύσεως τοῦ ὀνόματος τῆς δόξης σου
  choice: उस निवासस्थान को ... जो आपके महिमामय नाम का विश्रामस्थान है
  rationale: σκήνωμα के निवास तथा καταπαύσεως के विश्रामस्थान—दोनों विचारों को बनाए रखता है; ‘महिमामय नाम’ हिन्दी में स्वाभाविक रूप से τοῦ ὀνόματος τῆς δόξης σου का भाव देता है।
- source_word: καταβαλεῖν σιδήρῳ κέρας θυσιαστηρίου σου
  choice: तलवार से आपकी वेदी का सींग गिरा देने
  rationale: καταβάλλω के नीचे गिराने के भाव और वेदी के ठोस ‘सींग’ को बनाए रखा गया है। σίδηρος का शाब्दिक अर्थ ‘लोहा’ है, पर यहाँ लोहे के हथियार, संभवतः तलवार, के लिए लक्षणा होने के कारण मुख्य पाठ में ‘तलवार’ और पादटिप्पणी में शाब्दिक विकल्प दिया गया है।
theological_decisions:
- issue: पवित्र वस्तुओं और पवित्र स्थान का दायरा
  choice: τὰ ἅγιά को ‘पवित्र वस्तुओं’ और σκήνωμα को अलग से ‘निवासस्थान’ कहा गया
  alternative: दोनों को सामान्यीकृत करके केवल ‘पवित्रस्थान’ कहना
  rationale: यूनानी पाठ पवित्र वस्तुओं/क्षेत्रों और दिव्य नाम के निवासस्थान का अलग-अलग उल्लेख करता है; इस ठोस उपासना-संबंधी भाषा को सपाट नहीं किया गया।
- issue: परमेश्वर के नाम का विश्रामस्थान
  choice: ‘आपके महिमामय नाम का विश्रामस्थान’
  alternative: ‘जहाँ आपकी महिमा रहती है’
  rationale: पाठ स्वयं ‘नाम’ को विश्राम से जोड़ता है। वैकल्पिक रूप इस तनावपूर्ण और विशिष्ट नाम-विषयक भाषा को व्याख्यात्मक ढंग से ‘महिमा’ में बदल देता।
- issue: वेदी का सींग
  choice: ठोस रूपक ‘वेदी का सींग’ बनाए रखा
  alternative: ‘वेदी का कोना’ या सामान्य ‘वेदी’
  rationale: κέρας वेदी की विशिष्ट संरचना और धार्मिक प्रतीकात्मकता को सूचित करता है; इसे सामान्यीकृत करना स्रोत की उपासना-संबंधी छवि को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ और विनम्र आज्ञार्थक ‘कर दीजिए’ प्रयुक्त हैं। कठिन उपासना-संबंधी शब्दावली को अनावश्यक रूप से सरल नहीं किया गया, पर वाक्यरचना सामान्य पाठक के लिए प्रवाहपूर्ण रखी गई है।
