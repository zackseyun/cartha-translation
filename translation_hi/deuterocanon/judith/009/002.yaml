base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/002.yaml
  text: And she said[a], “O Lord, God of my father Simeon, to whom you gave a sword in his hand for vengeance against foreigners, who loosed a virgin’s womb for defilement and bared the thigh for shame and profaned the womb for disgrace—though you said, ‘It shall not be so’[c][b]; but they did it.”
translation:
  language: hi
  text: और उसने कहा, “हे प्रभु, मेरे पूर्वज शिमोन के परमेश्वर, आपने उसके हाथ में परदेशियों से बदला लेने के लिए तलवार दी थी। उन्होंने एक कुँवारी की कोख को अशुद्ध करने के लिए खोल दिया,[a] लज्जित करने के लिए उसकी जाँघ उघाड़ी,[b] और अपमानित करने के लिए उसकी कोख को दूषित किया। क्योंकि आपने कहा था, ‘ऐसा नहीं होगा’;[c] फिर भी उन्होंने ऐसा किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उन्होंने उस कुँवारी का यौन उल्लंघन किया। यूनानी अभिव्यक्ति रूपकात्मक है, पर संदर्भ में आशय स्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: “जाँघ उघाड़ना” यौन लज्जा, अपमान और उल्लंघन की एक देहात्मक अभिव्यक्ति है।
    reason: cultural_note
  - marker: c
    text: यह प्रार्थना उत्पत्ति 34 में दीना के साथ हुए अत्याचार और उसके प्रतिशोध में शिमोन की हिंसा की ओर संकेत करती है।
    reason: cross_reference
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: परमेश्वर को सीधे संबोधित करने वाली प्रार्थना के लिए स्वाभाविक और गरिमापूर्ण हिन्दी; κύριος को यहाँ परमेश्वर के विशिष्ट नाम के रूप में नहीं थोपा गया।
- source_word: ὁ θεὸς τοῦ πατρὸς μου Συμεών
  choice: मेरे पूर्वज शिमोन के परमेश्वर
  rationale: πατήρ वंशगत पुरखे को सूचित करता है; आधुनिक हिन्दी में ‘पूर्वज’ जूडिथ और कुलपिता शिमोन के संबंध को ‘पिता’ की संभावित जैविक गलतफहमी से बचाते हुए व्यक्त करता है।
- source_word: ᾧ ἔδωκας ἐν χειρὶ ῥομφαίαν
  choice: आपने उसके हाथ में ... तलवार दी थी
  rationale: ἐν χειρί की ठोस अभिव्यक्ति को बनाए रखा गया है; हिन्दी में आदरार्थक दिव्य संबोधन ‘आप’ स्वाभाविक है।
- source_word: εἰς ἐκδίκησιν ἀλλογενῶν
  choice: परदेशियों से बदला लेने के लिए
  rationale: ἐκδίκησις का प्रतिशोधात्मक बल ‘बदला’ से और ἀλλογενῶν का व्यापक बाहरी-जन अर्थ ‘परदेशियों’ से व्यक्त होता है; ‘अन्यजातियों’ जैसा बाद का तकनीकी अर्थ नहीं थोपा गया।
- source_word: οἳ ἔλυσαν μήτραν παρθένου
  choice: उन्होंने एक कुँवारी की कोख को अशुद्ध करने के लिए खोल दिया
  rationale: ἔλυσαν के खोलने/ढीला करने के रूपक और μήτρα का ‘कोख’ बनाए रखते हुए यौन उल्लंघन को मुख्य पाठ में व्याख्यात्मक रूप से एक शब्द में सीमित नहीं किया गया।
- source_word: εἰς μίασμα
  choice: अशुद्ध करने के लिए
  rationale: μίασμα की नैतिक और अपवित्रकारी छाया को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ἐγύμνωσαν μηρὸν
  choice: उसकी जाँघ उघाड़ी
  rationale: यौन लज्जा और अपमान की मूल देहात्मक छवि सुरक्षित है; हिन्दी में स्त्री-संदर्भ स्पष्ट करने के लिए ‘उसकी’ जोड़ा गया।
- source_word: εἰς αἰσχύνην
  choice: लज्जित करने के लिए
  rationale: αἰσχύνη के लज्जा और अपमान के परिणाम को सहज हिन्दी क्रियात्मक रूप में व्यक्त करता है।
- source_word: ἐβεβήλωσαν μήτραν
  choice: उसकी कोख को दूषित किया
  rationale: βεβηλόω के अपवित्रीकरण के बल को ‘दूषित’ व्यक्त करता है और पहले ‘अशुद्ध’ से अनावश्यक शब्द-पुनरावृत्ति टालता है।
- source_word: εἰς ὄνειδος
  choice: अपमानित करने के लिए
  rationale: ὄνειδος के तिरस्कार और सार्वजनिक बदनामी के भाव को सुबोध आधुनिक हिन्दी में देता है।
- source_word: εἶπας γὰρ Οὐχ οὕτως ἔσται
  choice: क्योंकि आपने कहा था, ‘ऐसा नहीं होगा’
  rationale: γάρ को उसके सामान्य कारणसूचक अर्थ ‘क्योंकि’ से रखा गया है और निषेध की संक्षिप्तता सुरक्षित है।
- source_word: καὶ ἐποίησαν
  choice: फिर भी उन्होंने ऐसा किया
  rationale: शाब्दिक ‘और’ की अपेक्षा प्रसंग में निहित तीखे विरोध को स्वाभाविक हिन्दी में उभारता है, जबकि कर्म को ‘ऐसा’ द्वारा संदर्भ से ग्रहण किया गया है।
theological_decisions:
- issue: दीना के यौन उल्लंघन को कितनी स्पष्टता से व्यक्त किया जाए
  choice: मूल की तीन क्रमिक देहात्मक और अपवित्रीकरण-संबंधी छवियाँ बनाए रखी गईं, तथा पहले वाक्यांश पर स्पष्टकारी पादटिप्पणी दी गई।
  alternative: मुख्य पाठ में सीधे ‘उस कुँवारी का बलात्कार किया’ कहना।
  rationale: एक आधुनिक स्पष्ट शब्द घटना को साफ कर देता, पर यूनानी की रूपकात्मक पुनरुक्ति—कोख खोलना, जाँघ उघाड़ना, कोख दूषित करना—को संकुचित कर देता।
- issue: शिमोन की हिंसा और परमेश्वर की भूमिका
  choice: पाठ के दावे को बिना नैतिक समर्थन या खंडन जोड़े सीधे अनूदित किया गया कि परमेश्वर ने उसके हाथ में बदले के लिए तलवार दी।
  alternative: ‘दंड देने’ या ‘न्याय करने’ जैसे अधिक सकारात्मक धर्मवैज्ञानिक शब्दों से नरम करना।
  rationale: ἐκδίκησις का प्रतिशोधात्मक तनाव पाठ में वास्तविक है; अनुवाद को उसे सांप्रदायिक या व्याख्यात्मक ढंग से सुलझाना नहीं चाहिए।
- issue: ‘ऐसा नहीं होगा’ और अपराधियों के कार्य के बीच संबंध
  choice: ‘क्योंकि ... फिर भी’ द्वारा परमेश्वर के कथन और उनके किए के बीच तनाव रखा गया।
  alternative: γάρ को ‘फिर भी’ मानकर केवल विरोधसूचक संरचना बनाना।
  rationale: γάρ औपचारिक रूप से कारणसूचक है, जबकि अंतिम καί प्रसंग में विरोधात्मक परिणाम ग्रहण करता है; हिन्दी संरचना दोनों पक्षों को सुनाई देती है।
- issue: ἀλλογενῶν की सामुदायिक पहचान
  choice: परदेशियों
  alternative: अन्यजातियों
  rationale: ‘परदेशी’ जातीय-सामुदायिक बाहरीपन को व्यक्त करता है, पर बाद की ईसाई पारिभाषिक श्रेणी को अनावश्यक रूप से नहीं लाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, प्रार्थनामय और गरिमापूर्ण रखी गई है। परमेश्वर के लिए आदरार्थक ‘आप’ और संबोधन ‘हे प्रभु’ प्रयुक्त हैं। कठिन यौन-हिंसा संबंधी रूपकों को न तो अश्लील बनाया गया है, न इतना नरम कि उनका बल मिट जाए; आवश्यक स्पष्टता पादटिप्पणियों में दी गई है।
