base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/003.yaml
  text: Therefore you gave their rulers over to slaughter, and their bed, which was ashamed of their deceit, was deceived into blood; and you struck servants against princes, and princes upon their thrones.
translation:
  language: hi
  text: इन्हीं बातों के कारण तूने उनके शासकों को वध के लिए सौंप दिया, और उनके उस बिछौने को—जो उनके छल से लज्जित हुआ था—छल खाकर लहू में पड़ा रहने दिया[a]; तूने दासों को अधिपतियों पर और अधिपतियों को उनके सिंहासनों पर मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस वाक्य का यूनानी पाठ अत्यंत कठिन है। अधिक शाब्दिक रूप है: “और उनके बिछौने को, जो उनके छल से लज्जित हुआ था, छल खाकर लहू में।” ‘बिछौना’ का मानवीकरण और ‘लहू में’ का संबंध असामान्य है। अंतिम खंड में ‘अधिपतियों पर’ का अर्थ प्रहार का लक्ष्य या विरोधी संबंध है; इसे ‘अधिपतियों के विरुद्ध’ भी समझा जा सकता है।'
    reason: ἀπατηθεῖσαν εἰς αἷμα की असामान्य काव्यात्मक संरचना तथा ἐπί के संबंधगत सूक्ष्म अंतर को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: इन्हीं बातों के कारण
  rationale: यह पदबंध पिछले पद में बताए गए अपराधों का कारणात्मक संदर्भ देता है; हिन्दी में उसका संबंध स्पष्ट और स्वाभाविक रखा गया है।
- source_word: ἄρχοντας
  choice: शासकों
  rationale: यह सामान्य रूप से शासन करने वालों को दर्शाता है और बाद के δυνάσταις से हल्का भेद बनाए रखता है।
- source_word: στρωμνήν
  choice: बिछौने
  rationale: शय्या/बिस्तर के ठोस अर्थ को रखता है और प्रसंग में अपवित्र किए गए विवाह-बिछौने की ओर संकेत को खुला छोड़ता है।
- source_word: ἀπάτην
  choice: छल
  rationale: यूनानी शब्द की धोखे या कपट की धारणा को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δούλους
  choice: दासों
  rationale: सामाजिक अधीनता के स्पष्ट स्रोतार्थ को बनाए रखता है।
- source_word: δυνάσταις / δυνάστας
  choice: अधिपतियों
  rationale: शक्तिशाली पदाधिकारियों या राजपुरुषों का भाव देता है और ἄρχοντας के लिए प्रयुक्त 'शासकों' से शब्दगत भेद बनाए रखता है।
- source_word: ἐπάταξας
  choice: मार गिराया
  rationale: प्रहार करके संहार करने के प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बिछौने का मानवीकरण और कठिन यूनानी वाक्य-विन्यास
  choice: बिछौने को छल से लज्जित और फिर छल द्वारा लहू में डुबोया हुआ बताया गया
  alternative: बिछौने पर हुए छल से स्त्री के लज्जित होने या छल में पड़कर रक्तपात होने के रूप में स्पष्ट करना
  rationale: यूनानी पाठ में στρωμνήν स्त्रीलिंग कर्म है और उससे जुड़े कृदंत उसी के साथ व्याकरणिक रूप से मेल खाते हैं। पाठ की असामान्य काव्यात्मकता और वास्तविक अस्पष्टता को किसी एक व्याख्या में सीमित नहीं किया गया।
- issue: ἐπὶ δυνάσταις में ἐπί के संबंध का अर्थ
  choice: दासों को अधिपतियों के साथ मार गिराया
  alternative: दासों को अधिपतियों के विरुद्ध लगाया
  rationale: दत्तिव के साथ ἐπί यहाँ साथ/के ऊपर घटित प्रहार को व्यक्त कर सकता है, और अगला समानांतर खंड संहार का वर्णन करता है। फिर भी वैकल्पिक विरोधार्थ की संभावना फुटनोट में दर्ज की गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी अपनाई गई है। प्रार्थना में परमेश्वर के लिए एकवचन आत्मीय संबोधन 'तू' रखा गया है। कठिन काव्यात्मक बिंब को पूरी तरह समतल करने के बजाय सीमित रूप से स्वाभाविक बनाया गया है।
