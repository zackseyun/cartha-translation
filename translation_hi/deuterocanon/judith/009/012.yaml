base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/012.yaml
  text: Yes[a], yes, O God of my father and God of Israel’s inheritance, Master of the heavens and of the earth, Creator of the waters[b], King of all your creation, you—hear my prayer.
translation:
  language: hi
  text: हाँ, हाँ, हे मेरे पिता के परमेश्वर और इस्राएल की विरासत के परमेश्वर[a], आकाशों और पृथ्वी के स्वामी[b], जलराशियों के सृष्टिकर्ता, अपनी सारी सृष्टि के राजा—तू ही मेरी याचना सुन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ ‘इस्राएल को मिली विरासत के परमेश्वर’ भी हो सकता है; वाक्यांश को ‘इस्राएल की धरोहर के परमेश्वर’ के अर्थ में समझना भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: ‘स्वामी’ के लिए यूनानी शब्द देस्पोतेस है, जो ‘प्रभु’ के सामान्य यूनानी शब्द क्यूरियोस से अधिक प्रबल है और पूर्ण अधिकार पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὶ ναὶ
  choice: हाँ, हाँ
  rationale: दोहराए गए दृढ़ उद्गार को बिना किसी अन्य साहित्यिक परंपरा का रंग दिए सीधे और प्रार्थनापूर्ण ढंग से सुरक्षित रखता है।
- source_word: ὁ θεὸς τοῦ πατρὸς μου
  choice: हे मेरे पिता के परमेश्वर
  rationale: प्रार्थना में प्रत्यक्ष संबोधन स्पष्ट है; यूनानी के एकवचन ‘मेरे पिता’ को बनाए रखा गया है।
- source_word: θεὸς κληρονομίας Ἰσραήλ
  choice: इस्राएल की विरासत के परमेश्वर
  rationale: κληρονομία का मूल अर्थ विरासत, उत्तराधिकार या धरोहर है। संबंधकारक वाक्यांश की वास्तविक अस्पष्टता को सरल व्याख्या में विलीन नहीं किया गया।
- source_word: δέσποτα
  choice: स्वामी
  rationale: यह κύριος से अधिक प्रबल पद है और अधिकार तथा स्वामित्व का भाव रखता है। ‘स्वामी’ आधुनिक हिन्दी में गरिमापूर्ण और बोधगम्य रहते हुए उस अंतर को काफी हद तक बनाए रखता है।
- source_word: τῶν οὐρανῶν καὶ τῆς γῆς
  choice: आकाशों और पृथ्वी के
  rationale: यूनानी में ‘आकाश’ बहुवचन है; प्रार्थना की उन्नत शैली में हिन्दी बहुवचन को सुरक्षित रखा गया है।
- source_word: κτίστα τῶν ὑδάτων
  choice: जलराशियों के सृष्टिकर्ता
  rationale: κτίστης को ‘सृष्टिकर्ता’ और स्पष्ट बहुवचन ὑδάτων को स्वाभाविक हिन्दी में ‘जलराशियों’ से व्यक्त किया गया है।
- source_word: βασιλεῦ πάσης κτίσεώς σου
  choice: अपनी सारी सृष्टि के राजा
  rationale: इस विश्वव्यापी स्तुति-संदर्भ में κτίσις का सामूहिक अर्थ ‘सृष्टि’ उपयुक्त है; σου का संबंध ‘अपनी’ द्वारा सुरक्षित है।
- source_word: σὺ εἰσάκουσον
  choice: तू ही ... सुन
  rationale: स्पष्ट और बलयुक्त σὺ को ‘तू ही’ से व्यक्त किया गया है। प्रार्थना में εἰσακούω केवल ध्वनि सुनने के बजाय ध्यान देकर स्वीकार करने का भाव रखता है।
- source_word: τῆς δεήσεώς μου
  choice: मेरी याचना
  rationale: δέησις विशेष रूप से विनती या निवेदन है; ‘याचना’ उसकी प्रार्थनापूर्ण गंभीरता को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वर को संबोधित करते हुए δέσποτα का अनुवाद
  choice: स्वामी
  alternative: प्रभु; अधिपति
  rationale: मूल यूनानी δέσποτα, κύριος से भिन्न और अधिक प्रबल है। ‘स्वामी’ अधिकार और स्वामित्व का भाव रखता है; ‘प्रभु’ दोनों यूनानी पदों का भेद मिटा सकता है, जबकि ‘अधिपति’ अपेक्षाकृत कम सहज है।
- issue: θεὸς κληρονομίας Ἰσραήλ में संबंधकारक की व्याख्या
  choice: इस्राएल की विरासत के परमेश्वर
  alternative: इस्राएल की धरोहर परमेश्वर; इस्राएल को मिली विरासत के परमेश्वर
  rationale: यूनानी वाक्यांश यह पूरी तरह निश्चित नहीं करता कि परमेश्वर विरासत के परमेश्वर हैं, स्वयं इस्राएल की विरासत हैं, या इस्राएल की धरोहर से संबद्ध परमेश्वर हैं। मुख्य पाठ निकटतम संरचना रखता है और टिप्पणी अन्य सम्भावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। प्रत्यक्ष ईश-संबोधन में ‘हे’ और ‘तू’ का प्रयोग निकटता तथा मूल के एकवचन संबोधन को व्यक्त करता है; भाषा को अत्यधिक संस्कृतनिष्ठ या साम्प्रदायिक शब्दावली से बचाया गया है।
