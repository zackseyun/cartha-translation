  yaml_path: translation/deuterocanon/judith/009/006.yaml
  text: And what I planned stood ready[a], and they said, ‘Behold, we are here; for all your ways are prepared, and your judgment is in foreknowledge.’
translation:
  language: hi
  text: और जिन बातों का तूने संकल्प किया था, वे तत्पर होकर आ खड़ी हुईं और उन्होंने कहा, “देख, हम उपस्थित हैं; क्योंकि तेरे सभी मार्ग तैयार हैं, और तेरा न्याय पूर्वज्ञान में है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा न्याय पूर्वज्ञान के अनुसार है,” अथवा “तेरा न्याय तेरे पूर्वज्ञान में है।” यूनानी वाक्यांश संक्षिप्त है और इसका अर्थ यह हो सकता है कि परमेश्वर का न्यायिक निर्णय उसके पूर्वज्ञान में निहित है या उसके अनुसार है।
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: आ उपस्थित हुईं
  rationale: यह रूप संकल्प की गई बातों के सामने आ जाने और कार्यान्वयन के लिए उपस्थित होने को व्यक्त करता है; साथ का मानवीकरण अगले बहुवचन ‘उन्होंने कहा’ में सुरक्षित रहता है।
- source_word: ἃ ἐβουλεύσω
  choice: जिन बातों का तूने संकल्प किया था
  rationale: ἐβουλεύσω द्वितीय पुरुष एकवचन है, इसलिए यह परमेश्वर द्वारा संकल्प की गई बातों को दर्शाता है। ‘संकल्प’ योजना और दृढ़ अभिप्राय—दोनों भावों को स्वाभाविक, गरिमापूर्ण हिन्दी में रखता है।
- source_word: πάρεσμεν
  choice: हम उपस्थित हैं
  rationale: यह घोषणा उपस्थिति के साथ तत्परता का भी संकेत देती है। ‘हम उपस्थित हैं’ मानवीकृत संकल्पों की सीधी वाणी को बनाए रखता है।
- source_word: ὁδοί
  choice: मार्ग
  rationale: परमेश्वर के कार्य करने के तरीकों और व्यवहार के लिए ‘मार्ग’ व्यापक और प्रचलित समतुल्य है।
- source_word: ἕτοιμοι
  choice: तैयार हैं
  rationale: यह परिणामसूचक अवस्था को सीधे व्यक्त करता है कि परमेश्वर के सभी मार्ग पहले से तैयार हैं।
- source_word: κρίσις
  choice: न्याय
  rationale: यहाँ शब्द परमेश्वर के न्यायिक निर्णय की ओर संकेत करता है। ‘न्याय’ हिन्दी में निर्णय और न्यायकारी कार्य—दोनों संभावनाओं को खुला रखता है।
- source_word: πρόγνωσις
  choice: पूर्वज्ञान
  rationale: यह पहले से जानने के अर्थ का सीधा और स्थापित हिन्दी समतुल्य है तथा पद के धर्मवैचारिक तनाव को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के न्याय और πρόγνωσις का संबंध
  choice: तेरा न्याय पूर्वज्ञान में है
  alternative: तेरा न्याय पूर्वज्ञान के अनुसार है; तेरा न्याय तेरे पूर्वज्ञान में है
  rationale: यूनानी ἐν προγνώσει संक्षिप्त और अर्थ की दृष्टि से खुला है। मुख्य पाठ में ‘में’ रखकर यह तय नहीं किया गया कि संबंध अवस्थिति, आधार या अनुरूपता का है; संभावित स्पष्टार्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए पारंपरिक निकट संबोधन ‘तू/तेरा’ प्रयुक्त है। यूनानी पाठ के द्वितीय पुरुष ἐβουλεύσω के अनुसार अंग्रेज़ी परामर्श-पाठ के ‘what I planned’ को नहीं अपनाया गया; यहाँ अर्थ ‘जिन बातों का तूने संकल्प किया था’ है।
