  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरे/तुझे’ प्रयुक्त है। युद्ध, बंदीकरण और रक्त-अशुद्धता की कठोरता को नरम नहीं किया गया, जबकि अत्यधिक संस्कृतनिष्ठ या अप्रचलित शब्दावली से बचा गया है।
