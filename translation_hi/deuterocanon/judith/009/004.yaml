base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/004.yaml
  text: And you gave their wives as plunder[a], and their daughters into captivity, and all their spoils for division among the sons beloved by you, who also were zealous with your zeal and abhorred the defilement of their blood and called on you for help. O God, my God, hear me[b], the widow.
translation:
  language: hi
  text: और तूने उनकी स्त्रियों को लूट में दे दिया, उनकी बेटियों को बंदी बना दिया, और उनकी सारी युद्ध-लूट को तेरे द्वारा प्रेम किए गए पुत्रों में बाँटने के लिए दे दिया। उन्होंने तेरे उत्साह के लिए उत्साह दिखाया, अपने रक्त की अशुद्धता से घृणा की, और सहायता के लिए तुझे पुकारा। हे परमेश्वर, मेरे परमेश्वर, मेरी सुन; मैं विधवा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προνομὴν
  choice: लूट में
  rationale: यह युद्ध में अधिकार में ली गई वस्तु या व्यक्ति को सूचित करता है। ‘लूट में दे दिया’ स्त्रियों को युद्ध की लूट बनाए जाने का कठोर अर्थ स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: αἰχμαλωσίαν
  choice: बंदी बना दिया
  rationale: εἰς αἰχμαλωσίαν का परिणामसूचक अर्थ हिन्दी में इस क्रियात्मक अभिव्यक्ति से स्पष्ट और स्वाभाविक बनता है।
- source_word: σκῦλα
  choice: युद्ध-लूट
  rationale: यह युद्ध में छीनी गई संपत्ति के लिए प्रयुक्त सैन्य शब्द है। ‘युद्ध-लूट’ इसे पहले आए सामान्य ‘लूट’ से अर्थ की दृष्टि से जोड़ते हुए संदर्भ स्पष्ट करता है।
- source_word: διαίρεσιν
  choice: बाँटने के लिए
  rationale: यह अलग-अलग हिस्से करके वितरण करने का भाव रखता है; हिन्दी में संज्ञात्मक ‘विभाजन’ की अपेक्षा यह अधिक सहज है।
- source_word: υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: अपने प्रिय पुत्रों
  rationale: मूल में स्पष्ट रूप से ‘पुत्र’ और परमेश्वर द्वारा प्रेम किए जाने का भाव है। ‘अपने प्रिय पुत्रों’ स्वाभाविक हिन्दी में दोनों बातों को रखता है।
- source_word: ἐζήλωσαν τὸν ζῆλόν σου
  choice: तेरे उत्साह में उत्साही हुए
  rationale: यह मूल की समान-मूल शब्दावली और इस बात को बनाए रखता है कि उनका उत्साह परमेश्वर के उत्साह से संबंधित था, बिना इसे केवल सामान्य भक्ति में बदलने के।
- source_word: ἐβδελύξαντο
  choice: घृणा की
  rationale: यह नैतिक और धार्मिक विकर्षण का प्रबल भाव देता है और सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: μίασμα αἵματος αὐτῶν
  choice: उनके रक्त की अशुद्धता
  rationale: ‘अशुद्धता’ धार्मिक और नैतिक दूषण दोनों की संभावना बनाए रखती है; संबंधकारक पदबंध की अस्पष्टता भी अनावश्यक रूप से हल नहीं की गई।
- source_word: ἐπεκαλέσαντό σε εἰς βοήθειαν
  choice: सहायता के लिए तुझे पुकारा
  rationale: यह प्रार्थनापूर्ण आह्वान और सहायता माँगने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰσάκουσον ἐμοῦ
  choice: मेरी सुन
  rationale: यह प्रार्थना में सुनने और अनुकूल उत्तर देने की विनती के लिए संक्षिप्त, प्रतिष्ठित हिन्दी प्रयोग है।
- source_word: τῆς χήρας
  choice: मुझ विधवा की
  rationale: ‘मेरी सुन—मुझ विधवा की’ यूनानी के बलाघाती आत्म-निर्देश को रखता है और वक्ता की असुरक्षित सामाजिक स्थिति को उभारता है।
theological_decisions:
- issue: υἱῶν ἠγαπημένων ὑπὸ σοῦ में लिंग-सूचक पारिवारिक पद
  choice: अपने प्रिय पुत्रों
  alternative: अपनी प्रिय संतानों / अपने प्रिय लोगों
  rationale: मूल में υἱῶν स्पष्ट रूप से ‘पुत्रों’ का बहुवचन है। इसे लिंग-निरपेक्ष ‘संतानों’ या व्यापक ‘लोगों’ में बदलना स्रोत से अधिक व्याख्या जोड़ता।
- issue: ἐζήλωσαν τὸν ζῆλόν σου में समान-मूल उत्साह की अभिव्यक्ति
  choice: तेरे उत्साह में उत्साही हुए
  alternative: तेरे लिए जोश से भर गए / तेरी धुन में लग गए
  rationale: चुनी हुई अभिव्यक्ति मूल की पुनरुक्ति और परमेश्वर के अपने उत्साह में सहभागिता का तनाव बनाए रखती है; विकल्प इस संबंध को सरल भक्ति या मानवीय जोश में सीमित कर सकते हैं।
- issue: μίασμα αἵματος αὐτῶν में रक्त और अशुद्धता का संबंध
  choice: उनके रक्त की अशुद्धता
  alternative: उनके रक्त से हुआ अपवित्रीकरण / उनके द्वारा बहाए गए रक्त का दोष
  rationale: यूनानी संबंधकारक यह पूरी तरह निश्चित नहीं करता कि रक्त अशुद्धता का स्रोत, विषय या किसी व्यापक दूषण का संकेत है। इसलिए अनुवाद ने किसी एक ऐतिहासिक-नैतिक व्याख्या को मुख्य पाठ में आरोपित नहीं किया।
