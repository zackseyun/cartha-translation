  yaml_path: translation/deuterocanon/judith/009/011.yaml
  text: For your power is not in a multitude[a], nor is your dominion among the strong; rather, you are God of the lowly, helper of the lesser, supporter of the weak, shelter of the forsaken[b], savior of those without hope.
translation:
  language: hi
  text: क्योंकि आपकी सामर्थ्य जनसमूह में नहीं है, न आपका प्रभुत्व शक्तिशाली लोगों में है; बल्कि आप दीनों के परमेश्वर, छोटों के सहायक, निर्बलों के संभालनेवाले, जिन्हें खोया हुआ मानकर छोड़ दिया गया है उनके शरणदाता हैं[a], और आशाहीनों के उद्धारकर्ता हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निराश लोगों के’; यूनानी पद उन लोगों को भी दर्शा सकता है जिन्हें खोया हुआ मान लिया गया हो या जो स्वयं निराश हो चुके हों।
    reason: lexical_alternative
  - marker: b
    text: या ‘बचानेवाले’।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει
  choice: विशाल जनसमूह
  rationale: πλῆθος का मूल अर्थ बड़ी संख्या या जनसमूह है। यह अनुवाद संख्या की ठोस छवि बनाए रखता है, पर इसे केवल सेना तक सीमित नहीं करता।
- source_word: κράτος
  choice: सामर्थ्य
  rationale: κράτος प्रभावी बल या सत्ता-सामर्थ्य को व्यक्त करता है। ‘सामर्थ्य’ यहाँ स्वाभाविक है और अगले खंड के ‘प्रभुत्व’ से अलग भी रहता है।
- source_word: δυναστεία
  choice: प्रभुत्व
  rationale: δυναστεία शासकीय अधिकार या प्रभुता को दर्शाता है। ‘प्रभुत्व’ पद की गरिमा और राजनीतिक-सत्तात्मक अर्थ दोनों को सुरक्षित रखता है।
- source_word: ἐν ἰσχύουσιν
  choice: शक्तिशाली लोगों में
  rationale: यह वर्तमान कृदन्त का बहुवचन रूप है और उन लोगों की ओर संकेत करता है जो बलवान या सामर्थी हैं।
- source_word: ταπεινῶν
  choice: दीनों
  rationale: ταπεινός यहाँ सामाजिक रूप से नीचे किए गए, दबे या विनम्र लोगों को सूचित कर सकता है। आसपास के असुरक्षित समूहों की श्रृंखला में ‘दीनों’ व्यापक और उपयुक्त है।
- source_word: ἐλαττόνων
  choice: छोटों
  rationale: ἐλάττων तुलनात्मक अर्थ में ‘छोटा’ या ‘कमतर’ है। ‘छोटों’ से तुलनात्मक भाव बचता है; ‘सबसे छोटे’ कहने से अनावश्यक अतिशयोक्ति जुड़ जाती।
- source_word: βοηθός
  choice: सहायक
  rationale: βοηθός सहायता के लिए आने वाले व्यक्ति को दर्शाता है; ‘सहायक’ इसका स्पष्ट संज्ञात्मक रूप है।
- source_word: ἀντιλήμπτωρ
  choice: संभालनेवाले
  rationale: यह दुर्लभ संज्ञा किसी को थामने, सहारा देने या उसके पक्ष में सहायता करने वाले का भाव रखती है। ‘संभालनेवाले’ इस सहारा देने वाली छवि को बनाए रखता है और अगले ‘शरणदाता’ से अलग है।
- source_word: ἀσθενούντων
  choice: निर्बलों
  rationale: ἀσθενέω दुर्बलता, बीमारी या असमर्थता बता सकता है। यहाँ ‘निर्बलों’ इन संभावनाओं को किसी एक शारीरिक दशा तक सीमित नहीं करता।
- source_word: ἀπεγνωσμένων
  choice: जिनसे आशा छोड़ दी गई है
  rationale: ἀπεγνωσμένων उन लोगों को सूचित कर सकता है जिन्हें दूसरों ने खोया हुआ मानकर त्याग दिया हो, या जो स्वयं निराश हों। मुख्य पाठ निष्क्रिय अर्थ को सामने रखता है और पादटिप्पणी वैकल्पिक अर्थ बताती है।
- source_word: σκεπαστής
  choice: शरणदाता
  rationale: σκεπαστής ढकने, आश्रय देने या रक्षा करने वाले को दर्शाता है। ‘शरणदाता’ हिंदी में स्वाभाविक रहते हुए आश्रय की छवि बचाता है।
- source_word: ἀπηλπισμένων
  choice: आशाहीनों
  rationale: ἀπηλπισμένων उन लोगों को दर्शाता है जिन्होंने आशा खो दी है। ‘आशाहीनों’ संक्षिप्त है और पहले वाले ἀπεγνωσμένων से यथासंभव भेद रखता है।
- source_word: σωτήρ
  choice: उद्धारकर्ता
  rationale: σωτήρ बचाने, छुड़ाने या उद्धार करने वाले के लिए प्रयुक्त होता है। ‘उद्धारकर्ता’ धार्मिक गरिमा के साथ मूल की संज्ञात्मक शैली बनाए रखता है।
