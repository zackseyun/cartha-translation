  rationale: यूनानी पाठ ईश्वर के विषय में उपाधियों जैसी एक सघन, प्रार्थनात्मक श्रृंखला देता है। इसे बनाए रखने से मूल की लय और धर्मवैचारिक बल सुरक्षित रहता है तथा अनावश्यक व्याख्या नहीं जुड़ती।
- issue: ἀπεγνωσμένων और ἀπηλπισμένων के निकटवर्ती अर्थों में भेद
  choice: पहले को ‘जिनसे आशा छोड़ दी गई है’ और दूसरे को ‘आशाहीनों’ कहा गया
  alternative: दोनों को ‘निराश लोगों’ के रूप में समान करना
  rationale: दोनों पदों को एक ही हिंदी शब्द में मिला देने से यूनानी श्रृंखला का संभावित अंतर मिट जाता। मुख्य पाठ निष्क्रिय और आंतरिक निराशा के भावों में भेद रखता है, जबकि पादटिप्पणी पहले पद की वास्तविक अस्पष्टता स्वीकार करती है।
