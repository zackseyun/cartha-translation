  yaml_path: translation/deuterocanon/judith/009/009.yaml
  text: Look upon their arrogance; send your wrath upon their heads; give power to what I have planned by the hand of me[a], a widow.
translation:
  language: hi
  text: उनके घमंड पर दृष्टि कर; अपना क्रोध उनके सिर पर भेज; और जो मैंने ठाना है, उसके लिए मेरे—एक विधवा के—हाथ में सामर्थ्य दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने जो ठाना है, उसे मुझ विधवा के हाथ से सामर्थ्य दे।” यूनानी में अंतिम खंड का वाक्य-विन्यास संक्षिप्त है और इसे एक से अधिक, पर निकट अर्थों में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: βλέψον
  choice: दृष्टि कर
  rationale: यह आज्ञार्थक प्रार्थना है जिसमें परमेश्वर से उनकी दशा पर ध्यान देने की विनती की गई है। ‘दृष्टि कर’ प्रार्थनापूर्ण गरिमा बनाए रखता है।
- source_word: ὑπερηφανίαν
  choice: घमंड
  rationale: यह शब्द अहंकारी और दूसरों पर चढ़ बैठने वाले गर्व को व्यक्त करता है। ‘घमंड’ आधुनिक हिन्दी में सहज और नैतिक रूप से स्पष्ट है।
- source_word: ἀπόστειλον τὴν ὀργήν σου
  choice: अपना क्रोध ... भेज
  rationale: मूल के ‘भेज’ रूपक और न्यायकारी क्रोध, दोनों को सीधे बनाए रखा गया है।
- source_word: εἰς κεφαλὰς αὐτῶν
  choice: उनके सिर पर
  rationale: यूनानी में ‘सिरों’ बहुवचन है, पर हिन्दी में वितरक अर्थ के लिए सामूहिक एकवचन ‘उनके सिर पर’ अधिक स्वाभाविक है और न्याय के उन्हीं पर आ पड़ने का चित्र सुरक्षित रखता है।
- source_word: ἐν χειρί μου τῆς χήρας
  choice: मुझ विधवा के हाथ से
  rationale: ἐν χειρί यहाँ साधन या कर्तृत्व का भाव दे सकता है। यह अनुवाद ‘हाथ’ का ठोस बिंब और यहूदीत का विधवा होना स्पष्ट रखता है।
- source_word: ὃ διενοήθην
  choice: मैंने जो ठाना है
  rationale: διανοέομαι किसी विचार, संकल्प या योजना को मन में ठहराने का भाव देता है। ‘ठाना है’ प्रार्थना में स्वाभाविक है और छल का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: κράτος
  choice: सामर्थ्य
  rationale: κράτος बल, शक्ति या प्रभावी सामर्थ्य को दर्शाता है। ‘सामर्थ्य’ उस दैवी शक्ति को उपयुक्त रूप से व्यक्त करता है जिसकी यहूदीत अपने संकल्प के सफल होने के लिए याचना करती है।
theological_decisions:
- issue: κράτος, ἐν χειρί μου τῆς χήρας और ὃ διενοήθην वाले अंतिम खंड का संबंध
  choice: परमेश्वर से यह प्रार्थना कि यहूदीत ने जो ठाना है, उसे उसके—एक विधवा के—हाथ से प्रभावी सामर्थ्य मिले
  alternative: ‘मैं विधवा हूँ; मैंने जो ठाना है, उसके लिए मेरे हाथ में सामर्थ्य दे।’
  rationale: यूनानी वाक्य-विन्यास संक्षिप्त और एक से अधिक निकट अर्थों में ग्रहण करने योग्य है। मुख्य पाठ दैवी सामर्थ्य, यहूदीत के हाथ और उसके संकल्प—तीनों को बनाए रखता है; पादटिप्पणी ‘हाथ में सामर्थ्य’ वाली सम्भव संरचना देती है, बिना अस्पष्टता को अनुचित ढंग से समाप्त किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थनापरक स्तर रखा गया है। अर्धविराम मूल की क्रमिक विनतियों को अलग करते हैं। ‘मुझ विधवा’ में आत्म-पहचान का बल सुरक्षित है; अंतिम खंड की वास्तविक वाक्यगत अस्पष्टता पादटिप्पणी में दी गई है।
