  yaml_path: translation/deuterocanon/judith/013/015.yaml
  text: And coming forward, she showed them the head from the bag and said to them, “Look, the head of Holofernes, the commander-in-chief of the army of Asshur; and look, the canopy under which he was lying in his drunkenness. And the Lord struck him down by the hand of a woman.”
translation:
  language: hi
  text: आगे बढ़कर उसने झोले में से सिर उन्हें दिखाया और उनसे कहा, “देखो, अश्शूर की सेना के प्रधान सेनापति होलोफेरनेस का सिर! और देखो, वह मच्छरदानी जिसके नीचे वह अपने नशे में पड़ा था। प्रभु ने एक स्त्री के हाथ से उसे मार गिराया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πήρα
  choice: झोला
  rationale: यह यात्रा में साथ रखे जाने वाले थैले या झोले को सूचित करता है; ‘झोला’ सरल और प्रसंगानुकूल आधुनिक हिन्दी है।
- source_word: ἀρχιστράτηγος
  choice: प्रधान सेनापति
  rationale: पद की सर्वोच्च सैन्य कमान का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: δύναμις Ἀσσούρ
  choice: अश्शूर की सेना
  rationale: यहाँ δύναμις सैन्य बल के अर्थ में है और Ἀσσούρ को मूल के अनुरूप जाति/साम्राज्य के नाम के रूप में रखा गया है।
- source_word: κωνώπιον
  choice: मच्छरदानी
  rationale: शब्द मूलतः मच्छरों से बचाने वाले पलंग के जालीदार आवरण को सूचित करता है; सामान्य ‘छत्र’ की अपेक्षा यह अधिक विशिष्ट है।
- source_word: ἐν ταῖς μέθαις αὐτοῦ
  choice: अपने नशे में
  rationale: बहुवचन संज्ञा मद्यपान और उससे उत्पन्न नशे की दशा को व्यक्त करती है; हिन्दी में यह स्वाभाविक संक्षिप्त रूप है।
- source_word: ἐπάταξεν
  choice: मार गिराया
  rationale: प्रसंग में प्रहार का परिणाम मृत्यु है; यह क्रिया की शक्ति और परिणाम दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν χειρὶ θηλείας
  choice: एक स्त्री के हाथ से
  rationale: सेमिटिक साधनवाचक अभिव्यक्ति को हिन्दी में सहज रखते हुए स्त्रीलिंग संज्ञा का स्पष्ट अर्थ सुरक्षित किया गया है।
theological_decisions:
- issue: होलोफेरनेस की मृत्यु में प्रभु और स्त्री की भूमिका
  choice: “प्रभु ने एक स्त्री के हाथ से उसे मार गिराया”
  alternative: “एक स्त्री ने उसे मार गिराया”
  rationale: मूल पाठ दैवी कर्तृत्व और स्त्री को माध्यम—दोनों को एक साथ रखता है; अनुवाद इसी तनाव को बिना घटाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में ‘देखो’ मूल ἰδού की तात्कालिकता व्यक्त करता है। ‘मच्छरदानी’ κωνώπιον का ठोस अर्थ सुरक्षित रखती है।
