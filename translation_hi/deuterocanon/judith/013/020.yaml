base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/020.yaml
  text: And may God make these things for you into everlasting exaltation[a], to visit you with good things, because you did not spare your life on account of the humiliation of our people, but went out against our fallen condition, having walked straight before our God. And all the people said, “Amen, amen.”
translation:
  language: hi
  text: और परमेश्वर इन कामों को तुम्हारे लिए सदा के लिए महान सम्मान का कारण बनाए, ताकि वह भलाई के साथ तुम्हारी सुधि ले, क्योंकि हमारे लोगों के अपमान के कारण तुमने अपने प्राणों की परवाह नहीं की, बल्कि हमारी गिरी हुई दशा का सामना करने निकल पड़ीं और हमारे परमेश्वर के सामने सीधी राह पर चलकर ऐसा किया। तब सब लोगों ने कहा, “ऐसा ही हो, ऐसा ही हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “आमीन, आमीन।” यूनानी: “Γένοιτο, γένοιτο,” अर्थात् “ऐसा ही हो, ऐसा ही हो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαι σοι αὐτὰ ὁ θεὸς εἰς ὕψος αἰώνιον
  choice: परमेश्वर इन कामों को तुम्हारे लिए सदा के ऊँचे सम्मान का कारण बनाए
  rationale: αὐτά के बहुवचन को “इन कामों” से रखा गया है। εἰς ὕψος αἰώνιον की ऊँचाई वाली छवि को “ऊँचे सम्मान” में सुरक्षित रखते हुए वाक्य को स्वाभाविक हिन्दी बनाया गया है।
- source_word: τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς
  choice: और भलाई के साथ तुम्हारी सुधि ले
  rationale: ἐπισκέπτομαι में कृपापूर्वक ध्यान देने, देखने और देखभाल करने का भाव है; “सुधि लेना” इस दैवी अनुग्रह को व्यक्त करता है और ἐν ἀγαθοῖς को सामान्य “भलाई” के रूप में खुला रखता है।
- source_word: οὐκ ἐφείσω τῆς ψυχῆς σου
  choice: तुमने अपने प्राणों की परवाह नहीं की
  rationale: ψυχή यहाँ जोखिम में डाले गए जीवन को दर्शाता है। यह हिन्दी मुहावरा आत्म-त्याग और प्राण-संकट दोनों को स्पष्ट करता है।
- source_word: διὰ τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  choice: हमारे लोगों के अपमान के कारण
  rationale: ταπείνωσις के सार्वजनिक अपमान और दीन दशा के भाव में से “अपमान” प्रसंग के लिए उपयुक्त है; γένος को आधुनिक हिन्दी में स्वाभाविक सामुदायिक अर्थ वाला “लोग” कहा गया है।
- source_word: ἐπεξῆλθες πτώματι ἡμῶν
  choice: हमारी गिरी हुई दशा का सामना करने निकल पड़ीं
  rationale: ἐπεξέρχομαι के निकलकर विरोध या सामना करने के भाव और πτῶμα की गिरावट/पतन की छवि दोनों को रखा गया है। कठिन दत्तिव संबंध को किसी अधिक निश्चित अर्थ में नहीं बाँधा गया।
- source_word: ἐπʼ εὐθεῖαν πορευθεῖσα ἐνώπιον τοῦ θεοῦ ἡμῶν
  choice: हमारे परमेश्वर के सामने सीधे मार्ग पर चलीं
  rationale: “सीधे मार्ग” से εὐθεῖαν की ठोस मार्ग-छवि और नैतिक सच्चाई का संकेत दोनों बने रहते हैं।
- source_word: Γένοιτο, γένοιτο
  choice: ऐसा ही हो, ऐसा ही हो
  rationale: यह शाब्दिक इच्छा और सामुदायिक स्वीकृति दोनों व्यक्त करता है; यूनानी की पुनरुक्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: लोगों की सामूहिक प्रत्युत्तर-ध्वनि Γένοιτο, γένοιτο
  choice: ऐसा ही हो, ऐसा ही हो
  alternative: आमीन, आमीन
  rationale: “ऐसा ही हो” यूनानी के इच्छार्थक अर्थ को सीधे व्यक्त करता है, जबकि “आमीन” उसका परिचित उपासना-संबंधी समतुल्य है; विकल्प को पादटिप्पणी में रखा गया है।
- issue: परमेश्वर द्वारा ἐπισκέπτεσθαι का भाव
  choice: भलाई के साथ तुम्हारी सुधि ले
  alternative: तुम्हें आशीष दे
  rationale: “सुधि लेना” दैवी ध्यान और कृपापूर्ण देखभाल की व्यापकता बनाए रखता है तथा इसे केवल एक विशिष्ट धार्मिक सूत्र “आशीष देना” तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। स्त्रीलिंग क्रियाएँ जूडिथ को संबोधन स्पष्ट करती हैं। कठिन यूनानी पदबंधों में अनावश्यक सिद्धान्तगत या व्याख्यात्मक निश्चितता से बचते हुए उनकी मुख्य छवियाँ सुरक्षित रखी गई हैं।
