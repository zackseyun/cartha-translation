  text: And they all ran together[a], from the least to the greatest among them, because it seemed astonishing to them that she had come; and they opened the gate and welcomed them. After lighting a fire for light, they gathered around them.
translation:
  language: hi
  text: और उनमें छोटे से बड़े तक सभी दौड़कर इकट्ठे हो गए, क्योंकि यहूदित के आ जाने पर वे बहुत चकित थे। उन्होंने फाटक खोला और उन दोनों का स्वागत किया। रोशनी के लिए आग जलाकर वे उन दोनों के चारों ओर घेरा बनाकर खड़े हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέδραμον
  choice: दौड़कर इकट्ठे हो गए
  rationale: यह संयुक्त क्रिया शीघ्रता से एक स्थान पर आ जुटने का भाव व्यक्त करती है; यह अनुवाद गति और सामूहिकता दोनों को बनाए रखता है।
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: छोटे से बड़े तक
  rationale: यह समस्त समुदाय को समेटने वाला व्यापक मुहावरा है। हिंदी में यह रूप स्वाभाविक है और इसे केवल आयु या सामाजिक पद तक सीमित नहीं करता।
- source_word: παράδοξον
  choice: आश्चर्यजनक
  rationale: शब्द अपेक्षा के विपरीत और चकित करने वाली घटना को दर्शाता है; ‘आश्चर्यजनक’ नकारात्मक अर्थ जोड़े बिना इसे व्यक्त करता है।
- source_word: τοῦ ἐλθεῖν αὐτήν
  choice: उसका आना
  rationale: संज्ञार्थक क्रियारूप उनके आश्चर्य का कारण या विषय बताता है। ‘उसका आना’ यूनानी की अस्पष्टता को बनाए रखता है और संदर्भ से ‘लौटना’ नहीं जोड़ता।
- source_word: ἀπεδέξαντο
  choice: स्वागत किया
  rationale: क्रिया अनुकूल भाव से ग्रहण करने को बताती है; फाटक खोलने के प्रसंग में ‘स्वागत किया’ उपयुक्त है।
- source_word: ἅψαντες πῦρ
  choice: आग जलाकर
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया से पहले हुई कार्रवाई दिखाता है; हिंदी में ‘आग जलाकर’ क्रम को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: εἰς φάσιν
  choice: रोशनी के लिए
  rationale: वाक्यांश आग जलाने का उद्देश्य बताता है। यह रूप बिना किसी अतिरिक्त संकेतात्मक या सैन्य अर्थ के प्रयोजन स्पष्ट करता है।
- source_word: περιεκύκλωσαν
  choice: चारों ओर इकट्ठे हो गए
  rationale: मूल क्रिया चारों ओर घेरा बनाने का स्थानिक भाव देती है। स्वागत के इस प्रसंग में यह चयन अनावश्यक शत्रुतापूर्ण अर्थ से बचते हुए उस भाव को रखता है।
- source_word: αὐτάς
  choice: उनका / उनके
  rationale: स्त्रीलिंग बहुवचन सर्वनाम यहूदित और उसकी संगिनी दोनों की ओर संकेत करता है। हिंदी में सामान्य बहुवचन सर्वनाम स्वाभाविक है; संदर्भ फुटनोट में स्पष्ट किया गया है।
