translation:
  language: hi
  text: और वह पलंग के पास गई, उसके सिर के बालों को कसकर पकड़ लिया और बोली, “हे इस्राएल के परमेश्वर, आज के दिन मुझे सामर्थ्य दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: पास गई
  rationale: यह कृदन्त पलंग की ओर निकट जाने की क्रिया बताता है; ‘पास गई’ आधुनिक हिन्दी में स्वाभाविक और अर्थ के निकट है।
- source_word: κλίνης
  choice: पलंग
  rationale: κλίνη यहाँ सोने के पलंग या शय्या को दर्शाता है; कथा के इस प्रसंग में ‘पलंग’ सर्वसाधारण के लिए सबसे स्पष्ट शब्द है।
- source_word: ἐδράξατο
  choice: कसकर पकड़ लिया
  rationale: दράσσομαι का मध्यम रूप दृढ़ता से पकड़ लेने का भाव रखता है; ‘कसकर पकड़ लिया’ उस बलपूर्ण क्रिया को स्पष्ट करता है।
- source_word: τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: उसके सिर के बालों को
  rationale: यह चयन यूनानी के ‘उसके सिर के बाल’ वाले स्पष्ट और कुछ हद तक बलाघाती संबंध को सहज हिन्दी में बनाए रखता है।
- source_word: Κραταίωσόν με
  choice: मुझे सामर्थ्य दे
  rationale: आज्ञार्थक क्रिया तत्काल शक्ति प्रदान करने की प्रार्थना है; ‘मुझे सामर्थ्य दे’ संक्षिप्त, प्रार्थनापूर्ण और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ θεὸς Ἰσραήλ
  choice: हे इस्राएल के परमेश्वर
  rationale: यूनानी में कर्ताकारक रूप संबोधन के रूप में प्रयुक्त है; हिन्दी में ‘हे’ सीधे और गंभीर प्रार्थनात्मक संबोधन को व्यक्त करता है।
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: आज के दिन
  rationale: वाक्यांश इसी दिन पर समयगत बल देता है; ‘आज के दिन’ उसकी विशिष्टता और प्रार्थना की तात्कालिकता बनाए रखता है।
theological_decisions:
- issue: हिंसक छुटकारे के क्षण में परमेश्वर से यहूदीत की प्रार्थना
  choice: 'प्रार्थना को सीधे और गंभीर रूप में रखा गया है: ‘हे इस्राएल के परमेश्वर, आज के दिन मुझे सामर्थ्य दे।’'
  alternative: ‘हे इस्राएल के परमेश्वर, आज मुझे बलवन्त कर।’
  rationale: मूल पाठ इस छोटी प्रार्थना की कोई व्याख्या या नैतिक टिप्पणी नहीं जोड़ता। अनुवाद उसकी तात्कालिकता और इस्राएल के परमेश्वर से सीधे संबोधन को बिना नरम किए या विस्तार दिए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘शय्या’ की अपेक्षा ‘पलंग’ और ‘मुझे बलवन्त कर’ की अपेक्षा ‘मुझे सामर्थ्य दे’ सामान्य पाठक के लिए अधिक स्वाभाविक हैं।
