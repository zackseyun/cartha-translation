translation:
  language: hi
  text: परन्तु तम्बू में यूदित अकेली रह गई थी, और होलोफेरनेस अपने पलंग पर गिर पड़े थे[a], क्योंकि दाखमधु ने उन्हें पूरी तरह अपने वश में कर लिया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पलंग पर आगे की ओर गिरे पड़े थे।” यूनानी पूर्ण कृदन्त गिरने और उस दशा में पड़े रहने—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप के निकट: “क्योंकि दाखमधु उनके चारों ओर उँड़ेला हुआ था।” यह मुहावरेदार अभिव्यक्ति दाखमधु से पूरी तरह अभिभूत हो जाने का भाव देती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθη
  choice: रह गई थी
  rationale: यहाँ कर्मवाच्य रूप उस स्थिति को बताता है जिसमें दूसरों के चले जाने के बाद यहूदीत ही वहाँ शेष रही। हिन्दी में ‘रह गई थी’ स्वाभाविक रूप से यही भाव व्यक्त करता है।
- source_word: μόνη
  choice: केवल यहूदीत
  rationale: μόνη यहूदीत के अकेले रह जाने पर बल देता है; ‘केवल यहूदीत’ इस बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: σκηνῇ
  choice: तम्बू
  rationale: सैनिक छावनी के प्रसंग में σκηνή का सीधा और स्वाभाविक अर्थ ‘तम्बू’ है।
- source_word: προπεπτωκώς
  choice: औंधे पड़े थे
  rationale: प्रोπίπτω का पूर्ण कृदन्त आगे की ओर गिरने और उसी दशा में पड़े रहने का भाव देता है। ‘औंधे पड़े थे’ परिणामी अवस्था को स्पष्ट रखता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: κλίνην ἑαυτοῦ
  choice: अपने पलंग पर
  rationale: κλίνη पलंग या शय्या हो सकता है; इस दृश्य में ‘पलंग’ स्पष्ट, सामान्य और स्वाभाविक है। ἑαυτοῦ को ‘अपने’ से व्यक्त किया गया है।
- source_word: περικεχυμένος αὐτῷ ὁ οἶνος
  choice: दाखमधु ने उन्हें पूरी तरह अपने वश में कर लिया था
  rationale: यूनानी में दाखमधु व्याकरणिक कर्ता है और वाक्यांश शाब्दिक रूप से उसके चारों ओर उँड़ेल दिए जाने जैसा है। हिन्दी में यह शाब्दिक रूप अस्पष्ट होगा; चुना हुआ मुहावरेदार अनुवाद दाखमधु के कारण पूरी तरह बेसुध या अभिभूत होने का भाव और कर्ता-संरचना दोनों बनाए रखता है।
