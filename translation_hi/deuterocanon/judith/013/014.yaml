  text: And she said to them with a loud voice, “Praise God, praise him; praise God, who has not withdrawn his mercy from the house of Israel, but has shattered our enemies by my hand in this night.”
translation:
  language: hi
  text: तब उसने ऊँची आवाज़ में उनसे कहा, “परमेश्वर की स्तुति करो, उसकी स्तुति करो! परमेश्वर की स्तुति करो, जिसने इस्राएल के घराने पर से अपनी करुणा नहीं हटाई, बल्कि इसी रात मेरे हाथ से हमारे शत्रुओं को चूर कर दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἰνεῖτε
  choice: स्तुति करो
  rationale: आज्ञार्थक बहुवचन का स्वाभाविक और उपासना-संदर्भ के अनुरूप हिन्दी रूप।
- source_word: τὸ ἔλεος αὐτοῦ
  choice: अपनी करुणा
  rationale: ἔλεος यहाँ परमेश्वर की दयालु, वाचा-संबंधी कृपा को व्यक्त करता है; ‘करुणा’ इसे स्पष्ट और गरिमापूर्ण ढंग से संप्रेषित करता है।
- source_word: ἀπὸ τοῦ οἴκου Ἰσραήλ
  choice: इस्राएल के घराने पर से
  rationale: ‘घराना’ οἶκος के सामुदायिक अर्थ को बनाए रखता है, और ‘पर से ... नहीं हटाई’ हिन्दी में ἀπέστησεν ... ἀπό की गति और निषेध को व्यक्त करता है।
- source_word: ἔθραυσε
  choice: चूर कर दिया है
  rationale: क्रिया का मूल भाव तोड़ने अथवा कुचल देने का है; प्रसंग में शत्रुओं की निर्णायक पराजय को सशक्त रूप से व्यक्त करता है।
- source_word: διὰ χειρός μου
  choice: मेरे हाथ से
  rationale: यूनानी साधनवाचक मुहावरे को जानबूझकर निकट रूप में रखा गया है, जिससे परमेश्वर की क्रिया और यहूदीत के माध्यम होने—दोनों का तनाव बना रहे।
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: आज इसी रात
  rationale: शाब्दिक ‘इस रात में’ की अपेक्षा आधुनिक हिन्दी में समय-संदर्भ को स्वाभाविक बनाते हुए ‘इसी’ से ταύτῃ का संकेतात्मक बल सुरक्षित रखा गया है।
theological_decisions:
- issue: विजय का कर्ता और मानवीय माध्यम
  choice: “जिसने ... मेरे हाथ से ... चूर कर दिया है”
  alternative: “मेरे द्वारा हमारे शत्रुओं को पराजित किया”
  rationale: मूल पाठ परमेश्वर को कर्ता और यहूदीत के हाथ को माध्यम बताता है। निकट संरचना इस धार्मिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखती है।
- issue: इस्राएल के प्रति परमेश्वर की करुणा
  choice: “इस्राएल के घराने पर से अपनी करुणा नहीं हटाई”
  alternative: “इस्राएल के घराने को अपनी दया से वंचित नहीं किया”
  rationale: चुना गया रूप ἀφίστημι/ἀπό की स्थानिक छवि को बनाए रखता है और किसी विशिष्ट व्यवस्थित धर्मवैज्ञानिक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सार्वजनिक उद्घोषणा के अनुकूल है। आवृत्त ‘स्तुति करो’ को मूल की जोरदार पुनरुक्ति के कारण बनाए रखा गया है। उद्धरण में विस्मयादिबोधक चिह्न ऊँची आवाज़ और आह्वान का स्वाभाविक हिन्दी संकेत देता है।
