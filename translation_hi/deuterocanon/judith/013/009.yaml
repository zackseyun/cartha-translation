translation:
  language: hi
  text: और वह पलंग के पास गई और उसने उसके सिर के बालों को कसकर पकड़ लिया और बोली, “हे इस्राएल के परमेश्वर, आज मुझे सामर्थ्य दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: पास जाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले या उसके साथ हुई निकट आने की क्रिया बताता है; ‘पास जाकर’ हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κλίνης
  choice: पलंग
  rationale: κλίνη का अर्थ बिस्तर या पलंग है; इस दृश्य में ‘पलंग’ ठोस और सहज हिन्दी है।
- source_word: ἐδράξατο
  choice: कसकर पकड़ ली
  rationale: क्रिया दृढ़ और निर्णायक रूप से पकड़ने का भाव रखती है; ‘कसकर पकड़ ली’ हिंसक प्रसंग की तीव्रता को बिना अतिरंजना व्यक्त करता है।
- source_word: κόμης τῆς κεφαλῆς αὐτοῦ
  choice: उसके सिर के बालों को
  rationale: यह यूनानी संबंधकारक पदबंध की स्पष्टता और κεφαλή के उल्लेख को बनाए रखता है।
- source_word: Κραταίωσόν με
  choice: मुझे सामर्थ्य दे
  rationale: आज्ञार्थक क्रिया बलवान या समर्थ किए जाने की प्रार्थना है; यह आधुनिक हिन्दी में स्वाभाविक और प्रार्थनापूर्ण है।
- source_word: ὁ θεὸς Ἰσραήλ
  choice: हे इस्राएल के परमेश्वर
  rationale: प्रत्यक्ष संबोधन का भाव ‘हे’ से व्यक्त होता है; इस्राएल नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: आज
  rationale: शाब्दिक अर्थ ‘इस दिन’ है; इस प्रार्थना में ‘आज’ उसी तात्कालिक कालगत अर्थ को अधिक स्वाभाविक आधुनिक हिन्दी में देता है।
theological_decisions:
- issue: प्रार्थना में परमेश्वर का प्रत्यक्ष संबोधन
  choice: हे इस्राएल के परमेश्वर
  alternative: इस्राएल के परमेश्वर
  rationale: यूनानी पद प्रत्यक्ष संबोधन के रूप में प्रयुक्त है। ‘हे’ जोड़ने से कोई नया धर्मवैज्ञानिक आशय नहीं आता, बल्कि हिन्दी में संबोधन स्पष्ट होता है।
- issue: κραταιόω द्वारा मांगी गई सहायता का स्वरूप
  choice: मुझे सामर्थ्य दे
  alternative: मुझे दृढ़ कर
  rationale: क्रिया शक्ति या सामर्थ्य प्रदान करने का भाव रखती है। ‘सामर्थ्य दे’ शारीरिक शक्ति तक अर्थ को सीमित नहीं करती और मूल की व्यापकता बचाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। वाक्य में स्त्रीलिंग कर्ता स्पष्ट है; ‘कसकर पकड़ ली’ निर्णायक क्रिया को सहज हिन्दी में व्यक्त करता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
