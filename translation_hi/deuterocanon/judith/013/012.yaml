translation:
  language: hi
  text: जब उसके नगर के पुरुषों ने उसकी आवाज़ सुनी, तो वे जल्दी से अपने नगर के फाटक के पास नीचे उतरे और उन्होंने नगर के बुज़ुर्गों को इकट्ठा होने के लिए बुलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: जब
  rationale: यह यूनानी कथात्मक मुहावरा अगले घटनाक्रम का समय बताता है। हिन्दी में केवल ‘जब’ स्वाभाविक है; ‘और ऐसा हुआ कि जब’ अनावश्यक रूप से बोझिल होता।
- source_word: οἱ ἄνδρες τῆς πόλεως αὐτῆς
  choice: उसके नगर के पुरुषों
  rationale: ἄνδρες स्पष्ट रूप से पुरुषों को सूचित करता है, और αὐτῆς का संबंध यहूदित से है; इसलिए लिंग-विशिष्ट और संबंधसूचक अर्थ सुरक्षित रखा गया है।
- source_word: τὴν φωνὴν αὐτῆς
  choice: उसकी आवाज़
  rationale: φωνή का यहाँ सीधा अर्थ बोलने या पुकारने की आवाज़ है।
- source_word: ἐσπούδασαν τοῦ καταβῆναι
  choice: शीघ्रता से ... उतर आए
  rationale: ἐσπούδασαν कार्य की तत्परता और καταβῆναι नीचे की ओर गति व्यक्त करता है। ‘उतर आए’ प्रसंग में स्वाभाविक है, जबकि ‘जल्दी की कि उतरें’ अत्यधिक शाब्दिक होता।
- source_word: ἐπὶ τὴν πύλην τῆς πόλεως αὐτῶν
  choice: अपने नगर के फाटक पर
  rationale: αὐτῶν पुरुषों के अपने नगर की ओर संकेत करता है। हिन्दी का ‘अपने’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है; ἐπί + कर्मकारक को गंतव्य के भाव में ‘पर’ कहा गया है।
- source_word: συνεκάλεσαν
  choice: बुलाकर इकट्ठा किया
  rationale: संयुक्त क्रिया में बुलाने और एकत्र करने, दोनों का भाव है; यह हिन्दी अभिव्यक्ति उस सामूहिक आह्वान को स्पष्ट रखती है।
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: नगर के पुरनियों
  rationale: πρεσβύτεροι यहाँ नगर के मान्य वरिष्ठ अगुओं को दर्शाता है। ‘पुरनिये’ बाइबलीय किंतु समझ में आने वाला पद है और केवल आयु नहीं, सामुदायिक पद का संकेत देता है।
theological_decisions:
- issue: ἄνδρες का लिंग-विशिष्ट अनुवाद
  choice: पुरुषों
  alternative: लोगों / निवासियों
  rationale: मूल यूनानी में संज्ञा स्पष्टतः पुल्लिंग और लिंग-विशिष्ट है; व्यापक, लिंग-निरपेक्ष समूह कहना मूल की विशिष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। वाक्य-संरचना सहज है, जबकि ‘नगर’, ‘फाटक’ और ‘पुरनिये’ बाइबलीय-सार्वजनिक प्रसंग के अनुकूल औपचारिकता बनाए रखते हैं।
