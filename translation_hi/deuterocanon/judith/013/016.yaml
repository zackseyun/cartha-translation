base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/016.yaml
  text: And as the Lord lives, who guarded me on the way by which I went, my face deceived him to his destruction, and he did not commit sin with me, resulting in defilement and shame.
translation:
  language: hi
  text: 'और जीवित प्रभु की शपथ, जिन्होंने उस मार्ग पर मेरी रक्षा की जिस पर मैं चली: मेरे चेहरे[a] ने उसे उसके विनाश तक धोखा दिया, और उसने मेरे साथ ऐसा पाप नहीं किया जिससे अपवित्रता और लज्जा होती।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मेरे चेहरे ने उसे धोखा दिया”; यहाँ जूडिथ का आशय है कि उसके बाहरी रूप ने होलोफेरनेस को भ्रम में डाल दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῇ Κύριος
  choice: जीवित प्रभु की शपथ
  rationale: यह यूनानी की गंभीर शपथ-विधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और κύριος के लिए दिव्य उपाधि ‘प्रभु’ बनाए रखता है।
- source_word: διεφύλαξέν με
  choice: मेरी रक्षा की
  rationale: क्रिया में सुरक्षित रखने और संरक्षण देने, दोनों का भाव है; ‘रक्षा की’ प्रसंगानुकूल और सहज है।
- source_word: ἐν τῇ ὁδῷ μου ᾗ ἐπορεύθην
  choice: उस मार्ग पर ... जिस पर मैं चली
  rationale: मूल के ठोस ‘मार्ग’ रूपक और संबंधवाचक संरचना को बनाए रखता है; स्त्री वक्ता के कारण ‘चली’ प्रयुक्त है।
- source_word: ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου
  choice: मेरे मुख ने उसे धोखा दिया
  rationale: τὸ πρόσωπόν μου का निकट और चित्रात्मक अनुवाद है। प्रसंग में मुख से आशय जूडिथ के बाहरी रूप से है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: εἰς ἀπώλειαν αὐτοῦ
  choice: जो उसके विनाश का कारण बना
  rationale: εἰς के परिणामसूचक बल और ἀπώλεια के विनाश/सर्वनाश के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἐποίησεν ἁμάρτημα μετʼ ἐμοῦ
  choice: उसने मेरे साथ ऐसा पाप नहीं किया
  rationale: मूल की संयत और अपेक्षाकृत व्यापक अभिव्यक्ति को बनाए रखता है तथा यौन आशय को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: εἰς μίασμα καὶ αἰσχύνην
  choice: जिससे अपवित्रता और लज्जा होती
  rationale: μίασμα के नैतिक अथवा धार्मिक अशुद्धि के भाव और αἰσχύνη के लज्जा/अपमान के भाव को परिणाम के रूप में स्पष्ट, स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: शपथ-विधि में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος परमेश्वर की उपाधि है और गंभीर शपथ में प्रयुक्त हुआ है; ‘प्रभु’ स्थापित तथा प्रसंगानुकूल हिन्दी रूप है।
- issue: ‘उसने मेरे साथ पाप नहीं किया’ के यौन आशय को कितना स्पष्ट किया जाए
  choice: मूल की व्यापक और संयत भाषा बनाए रखना
  alternative: उसने मेरा यौन शोषण नहीं किया / उसने मेरे साथ पापपूर्ण संबंध नहीं बनाया
  rationale: यूनानी पाठ सीधे यौन क्रिया का नाम नहीं लेता; ‘अपवित्रता और लज्जा’ प्रसंगगत आशय बताता है। इसलिए अधिक स्पष्ट रूप जोड़ना मूल की संयत अभिव्यक्ति को अनावश्यक रूप से सीमित कर देता।
- issue: εἰς μίασμα καὶ αἰσχύνην का संबंध
  choice: पाप के परिणाम के रूप में ‘जिससे अपवित्रता और लज्जा होती’
  alternative: अपवित्रता और लज्जा के लिए
  rationale: εἰς उद्देश्य अथवा परिणाम दोनों व्यक्त कर सकता है। यहाँ हिन्दी में शाब्दिक ‘के लिए’ उद्देश्य का अस्वाभाविक या अस्पष्ट अर्थ दे सकता है; परिणामसूचक वाक्यांश प्रसंग को स्पष्ट करता है, फिर भी अपवित्रता और लज्जा दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। शपथ का गंभीर स्वर, मार्ग की ठोस छवि और अंतिम वाक्य की संयत अभिव्यक्ति सुरक्षित हैं।
