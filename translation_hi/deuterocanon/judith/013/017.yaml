  yaml_path: translation/deuterocanon/judith/013/017.yaml
  text: And all the people were greatly astonished[a], and bowing down they worshiped God and said with one accord, “Blessed are you, our God, who today have brought the enemies of your people to nothing.”
translation:
  language: hi
  text: तब सभी लोग बहुत चकित हो गए। उन्होंने झुककर परमेश्वर की आराधना की और एक मन होकर कहा, “हे हमारे परमेश्वर, आप धन्य हैं, क्योंकि आपने आज अपने लोगों के शत्रुओं को निष्प्रभावी कर दिया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने लोगों के शत्रुओं को तुच्छ ठहराया है” या “नष्ट कर दिया है।” यूनानी क्रिया का अर्थ किसी को नगण्य ठहराना या उसे विनाश तक पहुँचा देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστη ... σφόδρα
  choice: बहुत चकित हो गए
  rationale: यह संयोजन लोगों की अत्यंत प्रबल विस्मय-प्रतिक्रिया व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: κύψαντες
  choice: झुककर
  rationale: कृदन्त शारीरिक रूप से नीचे झुकने को बताता है और अगली आराधना-क्रिया से स्वाभाविक रूप से जुड़ता है।
- source_word: προσεκύνησαν
  choice: आराधना की
  rationale: क्रिया का कर्म परमेश्वर है, इसलिए यहाँ केवल सम्मान नहीं बल्कि आराधना अभिप्रेत है।
- source_word: ὁμοθυμαδόν
  choice: एक स्वर में
  rationale: यह सामूहिक एकमतता और संयुक्त उच्चारण को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Εὐλογητὸς εἶ
  choice: आप धन्य हैं
  rationale: यह परमेश्वर को सीधे संबोधित स्तुति-वाक्य है, आशीर्वाद की कामना मात्र नहीं।
- source_word: ἐξουδενώσας
  choice: मिट्टी में मिला दिया
  rationale: विजय के प्रसंग में क्रिया शत्रुओं को निष्प्रभावी, तुच्छ अथवा नष्ट कर देने का प्रबल भाव रखती है; यह हिन्दी मुहावरा उस प्रभावी पराजय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: आज
  rationale: मूल का काल-सूचक बल आधुनिक हिन्दी में संक्षेप और स्पष्टता से आता है।
- source_word: τοῦ λαοῦ σου
  choice: अपनी प्रजा
  rationale: सीधे परमेश्वर से संबोधन में हिन्दी का निजवाचक ‘अपनी’ स्वाभाविक है; ‘प्रजा’ बाइबलीय सामुदायिक अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: विजय के बाद समुदाय का परमेश्वर के प्रति कथन
  choice: 'सीधा स्तुति-संबोधन: “हे हमारे परमेश्वर, आप धन्य हैं”'
  alternative: 'वर्णनात्मक कथन: “हमारा परमेश्वर धन्य है”'
  rationale: ग्रीक में द्वितीय पुरुष εἶ स्पष्ट करता है कि लोग परमेश्वर के विषय में नहीं, सीधे परमेश्वर से बोल रहे हैं।
- issue: ἐξουδενώσας में परमेश्वर की कार्रवाई का स्वरूप
  choice: शत्रुओं को प्रभावी रूप से परास्त और निष्प्रभावी करना
  alternative: केवल शत्रुओं को तुच्छ समझना
  rationale: क्रिया दोनों अर्थ दे सकती है, पर इस विजय-प्रसंग में परिणामकारी पराजय प्रमुख है; पादटिप्पणी शब्द की व्यापक अर्थ-सीमा सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना के प्रसंग के अनुकूल रखी गई है। ‘एक स्वर में’ बोलचाल में सहज है, जबकि ‘प्रजा’ बाइबलीय गरिमा बनाए रखती है।
