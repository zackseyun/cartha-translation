lexical_decisions:
- source_word: ἀπῆλθοσαν
  choice: चले गए
  rationale: ἀπέρχομαι के भूतकालिक रूप में वहाँ से प्रस्थान करने का भाव है। ‘चले गए’ आधुनिक हिन्दी में स्वाभाविक और अर्थ के अनुरूप है।
- source_word: ἐκ προσώπου
  choice: वहाँ से
  rationale: यूनानी पदबंध का शाब्दिक भाव ‘सामने से/उपस्थिति से’ है, पर पाठ में यह स्पष्ट नहीं किया गया कि किसके सामने से। मुख्य पाठ में ‘वहाँ से’ स्वाभाविक हिन्दी देते हुए इस अस्पष्टता को बनाए रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: οὐδεὶς κατελείφθη
  choice: कोई भी न रह गया
  rationale: καταλείπω के कर्मवाच्य रूप का आशय है कि उस स्थान में कोई शेष नहीं रहा। यह हिन्दी प्रयोग स्पष्ट और स्वाभाविक है।
- source_word: ἐν τῷ κοιτῶνι
  choice: शयन-कक्ष में
  rationale: κοιτών निजी सोने के कमरे को दर्शाता है। ‘शयन-कक्ष’ गरिमापूर्ण, आधुनिक और सामान्यतः समझ में आने वाला शब्द है।
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: छोटे से लेकर बड़े तक
  rationale: यह समावेशी युग्म सब लोगों को, सम्भवतः पद या महत्त्व की पूरी श्रेणी में, सूचित करता है। हिन्दी मुहावरा मूल की व्यापकता बनाए रखता है और इसे आयु तक सीमित नहीं करता।
