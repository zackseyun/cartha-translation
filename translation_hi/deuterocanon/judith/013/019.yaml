- source_word: τοὺς οὐρανοὺς καὶ τὴν γῆν
  choice: आकाशों और पृथ्वी
  rationale: ‘आकाशों’ यूनानी बहुवचन को सुरक्षित रखता है और ‘पृथ्वी’ उसके एकवचन रूप का सीधा समतुल्य है।
- source_word: κατεύθυνέν
  choice: मार्गदर्शन किया
  rationale: क्रिया दिशा देने या किसी परिणाम की ओर ले जाने का भाव रखती है; यह चयन ईश्वरीय सक्रियता को बनाए रखता है, पर उससे अधिक कठोर कारणता नहीं जोड़ता।
- source_word: εἰς τραῦμα κεφαλῆς
  choice: सिर को घायल करने के लिए
  rationale: शाब्दिक रचना ‘सिर के घाव की ओर/के लिए’ है। हिन्दी में क्रियात्मक रूप अर्थ को स्वाभाविक बनाता है; मूल रचना की अस्पष्टता पाद-टिप्पणी में दी गई है।
- source_word: ἄρχοντος
  choice: शासक
  rationale: ἄρχων किसी शासन या नेतृत्व करने वाले व्यक्ति को सूचित करता है; ‘शासक’ राजनीतिक-सैन्य संदर्भ में व्यापक और स्पष्ट है।
- source_word: ἐχθρῶν ἡμῶν
  choice: हमारे शत्रुओं
  rationale: यह संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: यहूदीत के कार्य में परमेश्वर की भूमिका
  choice: घायल करने के लिए तुम्हारा मार्गदर्शन किया
  alternative: सिर पर घाव करने की ओर तुम्हें बढ़ाया
  rationale: यूनानी पाठ सफलता को परमेश्वर के निर्देशन से जोड़ता है। ‘मार्गदर्शन किया’ उस ईश्वरीय भूमिका को बनाए रखता है, लेकिन क्रिया से अधिक प्रबल कारणता का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और उपासना-संगत शैली अपनाई गई है। ‘आकाशों’ मूल के बहुवचन को सुरक्षित रखता है; कठिन यूनानी पदबंध को मुख्य पाठ में स्वाभाविक बनाया गया है और उसकी वास्तविक अस्पष्टता पाद-टिप्पणी में दी गई है।
