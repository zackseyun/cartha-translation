  yaml_path: translation/deuterocanon/judith/013/019.yaml
  text: And blessed is the Lord God[a], who created the heavens and the earth, who directed you to strike the head of the ruler of our enemies.
translation:
  language: hi
  text: और धन्य हैं प्रभु परमेश्वर, जिन्होंने आकाशों और पृथ्वी की सृष्टि की और तुम्हें हमारे शत्रुओं के शासक के सिर को घायल करने के लिए दिशा दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अधिक शाब्दिक अनुवाद हो सकता है: “जिन्होंने तुम्हें हमारे शत्रुओं के शासक के सिर पर घाव पहुँचाने की ओर बढ़ाया।” यूनानी पदबंध का शाब्दिक भाव है, “सिर के घाव की ओर/के लिए निर्देशित किया।”'
    reason: मूल यूनानी के दिशा अथवा उद्देश्य-सूचक पदबंध और संज्ञात्मक ‘घाव’ को सुरक्षित रखने वाला वैकल्पिक अनुवाद।
