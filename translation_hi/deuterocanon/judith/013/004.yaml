  text: And Judith told her female servant to stand outside her sleeping chamber and watch for her going out[a], as on previous days, for she said that she would go out for her prayer[b]; and she spoke to Bagoas according to these words.
translation:
  language: hi
  text: और यूदीत ने अपनी दासी से कहा कि वह उसके शयन-कक्ष के बाहर खड़ी रहे और यूदीत के बाहर जाने पर नज़र रखे[a], जैसा यूदीत प्रतिदिन करती थी; क्योंकि यूदीत ने कहा था कि वह प्रार्थना करने बाहर जाएगी। और उसने बगोआस से भी इन्हीं बातों के अनुसार बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जैसे दिन-प्रतिदिन।” यह यूदीत की प्रतिदिन बाहर जाकर प्रार्थना करने की स्थापित रीति को सूचित करता है।
    reason: lexical_alternative
