- source_word: καθάπερ καθʼ ἡμέρας
  choice: जैसा वह प्रतिदिन करती थी
  rationale: यूनानी पद का शब्दशः भाव ‘जैसे दिन-प्रतिदिन’ है। हिंदी में यह रूप उसकी स्थापित दैनिक रीति स्पष्ट करता है, जबकि कालगत संकेत प्रसंग से लिया गया है।
- source_word: ἐξελεύσεσθαι ... ἐπὶ τὴν προσευχὴν αὐτῆς
  choice: वह प्रार्थना करने बाहर जाएगी
  rationale: भविष्य अनंत रूप और उद्देश्यसूचक पद को स्वाभाविक हिंदी परोक्ष कथन में प्रस्तुत किया गया है।
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: यही बात कही
  rationale: इस मुहावरे का आशय है कि उसने बगोआस से भी उन्हीं बातों के अनुरूप कहा; हिंदी में ‘यही बात’ अर्थ को संक्षिप्त और स्वाभाविक ढंग से देता है।
