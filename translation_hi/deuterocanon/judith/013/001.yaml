base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/001.yaml
  text: When evening came[a], his servants hurried to depart; and Bagoas shut the tent from outside and excluded those in attendance from the presence of his lord, and they went away to their beds.
translation:
  language: hi
  text: जब संध्या हुई, तब उसके दासों ने विदा होने में जल्दी की। बगोआस ने तंबू को बाहर से बंद कर दिया और जो लोग उसके स्वामी की सेवा में उपस्थित थे, उन्हें उसके स्वामी की उपस्थिति से बाहर कर दिया; फिर वे अपने-अपने बिस्तरों पर चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψία
  choice: संध्या
  rationale: ὀψία ἐγένετο का स्वाभाविक काल-सूचक अर्थ ‘संध्या हुई’ है; यह यूनानी से अधिक प्रबल ‘रात हो गई’ नहीं कहता।
- source_word: ἐσπούδασαν
  choice: जल्दी करने लगे
  rationale: क्रिया तत्परता और शीघ्रता व्यक्त करती है; यह आधुनिक हिन्दी में सहज है।
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: उसके दास
  rationale: δοῦλοι स्वामी के अधिकार के अधीन घरेलू या अनुचर वर्ग को सूचित करता है। ‘दास’ सामाजिक अधीनता को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से बचाए रखता है।
- source_word: ἀναλύειν
  choice: वहाँ से जाने के लिए
  rationale: इस प्रसंग में इसका अर्थ रात के लिए सभा या सेवा-स्थान से विदा होना है; ‘वहाँ से जाना’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: συνέκλεισεν τὴν σκηνὴν ἔξωθεν
  choice: तम्बू को बाहर से बन्द कर दिया
  rationale: वाक्यांश बाहर की ओर से तम्बू बन्द करने की क्रिया बताता है; अनिश्चित रूप से ‘ताला लगाया’ कहना मूल से अधिक विशिष्ट होता।
- source_word: ἀπέκλεισεν τοὺς παρεστῶτας
  choice: सेवा में उपस्थित लोगों को ... हटा दिया
  rationale: παρεστῶτας उपस्थित अनुचरों को और ἀπέκλεισεν उन्हें पहुँच या उपस्थिति से अलग करने को दर्शाता है। संयुक्त हिन्दी अभिव्यक्ति प्रसंग को सहज रखती है।
- source_word: ἐκ προσώπου τοῦ κυρίου αὐτοῦ
  choice: अपने स्वामी के सामने से
  rationale: ἐκ προσώπου का अर्थ किसी की उपस्थिति या सामने से हटाना है। κύριος यहाँ होलोफेरनेस जैसे मानवीय अधिकारी के लिए है, इसलिए ‘स्वामी’ उपयुक्त है।
- source_word: ἀπῴχοντο εἰς τὰς κοίτας αὐτῶν
  choice: वे अपने-अपने बिस्तरों पर चले गए
  rationale: κοίτας बहुवचन में शयन-स्थानों या बिस्तरों को दर्शाता है। ‘अपने-अपने’ हिन्दी में इस वितरणात्मक बहुवचन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Βαγώας
  choice: बगोआस
  rationale: यूनानी नाम Βαγώας का देवनागरी लिप्यंतरण किया गया है।
theological_decisions:
- issue: अपोक्रिफा/द्वितीयकानूनी कथा में δοῦλοι का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: मूल शब्द अधीन सामाजिक स्थिति को व्यक्त करता है। ‘सेवक’ अधिक सहज किंतु नरम हो सकता है; मुख्य पाठ में ‘दास’ रखकर वास्तविक सामाजिक संबंध सुरक्षित किया गया है और पादटिप्पणी में प्रसंग स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘संध्या’, ‘स्वामी’ और ‘दास’ औपचारिकता बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
