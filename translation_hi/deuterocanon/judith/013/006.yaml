base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/006.yaml
  text: And Judith stood beside his bed and said in her heart[a], “Lord, God of all power, look upon the works of my hands at this hour[b], for the exaltation of Jerusalem.”
translation:
  language: hi
  text: और यूदीत उसके पलंग के पास खड़ी हुई और अपने हृदय में बोली[a], “हे प्रभु, समस्त सामर्थ्य के परमेश्वर, इस घड़ी मेरे हाथों के कामों पर दृष्टि कर, यरूशलेम के उत्थान के लिए[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मन-ही-मन कहा।” यूनानी में शाब्दिक रूप से “अपने हृदय में कहा” है—यह आंतरिक वाणी या मौन प्रार्थना के लिए बाइबलीय मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “यरूशलेम को ऊँचा उठाने के लिए” या “यरूशलेम की प्रतिष्ठा के लिए।” यूनानी अभिव्यक्ति यरूशलेम के उत्थान या प्रतिष्ठित होने की बात करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: στᾶσα
  choice: खड़ी हुई
  rationale: अओरिस्ट कृदंत पहले घटित क्रिया को सूचित करता है; हिन्दी में यह सरल और स्वाभाविक क्रम को बनाए रखता है।
- source_word: παρὰ τὴν κλίνην αὐτοῦ
  choice: उसके पलंग के पास
  rationale: παρά यहाँ निकट अथवा बगल में होने का बोध देता है, और κλίνη के लिए प्रसंगानुकूल सामान्य शब्द ‘पलंग’ है।
- source_word: εἶπεν ἐν τῇ καρδίᾳ ἑαυτῆς
  choice: अपने हृदय में कहा
  rationale: यह मूल पाठ की आंतरिक वाणी अथवा मौन प्रार्थना की बाइबलीय छवि को सुरक्षित रखता है।
- source_word: Κύριε ὁ θεὸς πάσης δυνάμεως
  choice: हे प्रभु, समस्त सामर्थ्य के परमेश्वर
  rationale: सम्बोधन और πάσης δυνάμεως की व्यापकता दोनों को निकटता से व्यक्त करता है।
- source_word: ἐπίβλεψον
  choice: दृष्टि कर
  rationale: यह परमेश्वर से ध्यान और अनुग्रहपूर्वक देखने की प्रार्थना को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ ὥρᾳ ταύτῃ
  choice: इस घड़ी
  rationale: मूल की समय-सूचक और गंभीर अभिव्यक्ति को बनाए रखता है।
- source_word: ἐπὶ τὰ ἔργα τῶν χειρῶν μου
  choice: मेरे हाथों के कामों पर
  rationale: मूल के बहुवचन और कर्मों के लिए प्रयुक्त शारीरिक रूपक को सुरक्षित रखता है।
- source_word: εἰς ὕψωμα Ἰερουσαλήμ
  choice: ताकि यरूशलेम ऊँचा उठाया जाए
  rationale: εἰς के प्रयोजन अथवा परिणाम और ὕψωμα की ऊपर उठाए जाने की छवि को सहज हिन्दी में व्यक्त करता है, बिना इसे केवल ‘उद्धार’ या ‘महिमा’ के रूप में सीमित किए।
theological_decisions:
- issue: यूदीत की आंतरिक प्रार्थना का वर्णन
  choice: अपने हृदय में कहा
  alternative: अपने आप से कहा
  rationale: वाणी परमेश्वर को संबोधित प्रार्थना है; ‘हृदय में’ मूल की बाइबलीय मानवशास्त्रीय छवि को बचाता है, जबकि पादटिप्पणी इसका व्यावहारिक अर्थ स्पष्ट करती है।
- issue: εἰς ὕψωμα Ἰερουσαλήμ का आशय
  choice: ताकि यरूशलेम ऊँचा उठाया जाए
  alternative: यरूशलेम के उत्थान के लिए
  rationale: यह ऊँचा उठाने की मूल रूपकात्मक भाषा और प्रयोजन/परिणाम की संभावित छाया को बनाए रखता है; ‘उद्धार’ जोड़कर आशय को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘हृदय में कहा,’ ‘इस घड़ी,’ और ‘मेरे हाथों के काम’ जैसी मूल बाइबलीय छवियाँ बनाए रखी गई हैं; कठिन अर्थ-छायाओं को पादटिप्पणियों में स्पष्ट किया गया है।
