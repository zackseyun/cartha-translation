- issue: ‘धन्य’ के साथ τῷ θεῷ τῷ ὑψίστῳ का संबंध
  choice: यहूदीत को परमप्रधान परमेश्वर की ओर से धन्य घोषित किया गया है
  alternative: यहूदीत परमप्रधान परमेश्वर के सामने अथवा उनकी दृष्टि में धन्य है
  rationale: वाक्य-विन्यास और आगे आने वाली तुलना यहूदीत की धन्य स्थिति की घोषणा का समर्थन करते हैं, न कि यह अर्थ कि वह परमेश्वर को धन्य कह रही है। फिर भी यूनानी सम्बन्धकारक रूप की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
