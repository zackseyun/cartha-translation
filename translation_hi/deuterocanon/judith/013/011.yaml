base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/011.yaml
  text: And Judith said from a distance to those guarding the gates[a], “Open up, open up the gate, for God, our God, is with us, still to show strength in Israel and power against our enemies, just as he has done today.”
translation:
  language: hi
  text: तब यहूदित ने दूर से फाटकों पर पहरा देने वालों से कहा, “खोलो, फाटक खोलो! क्योंकि परमेश्वर—हमारा परमेश्वर[a]—हमारे साथ है, ताकि वह इस्राएल में आगे भी अपना बल दिखाए और हमारे शत्रुओं के विरुद्ध अपना पराक्रम प्रकट करे, जैसा उसने आज किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘परमेश्वर, हमारा परमेश्वर’ है; यह पुनरावृत्ति बल देने के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μακρόθεν
  choice: दूर से
  rationale: यह क्रियाविशेषण स्थान की दूरी बताता है; ‘दूर से’ स्वाभाविक और सटीक आधुनिक हिन्दी है।
- source_word: τοῖς φυλάσσουσιν ἐπὶ τῶν πυλῶν
  choice: फाटकों पर पहरा देने वालों से
  rationale: φυλάσσω यहाँ चौकसी या रखवाली करने को सूचित करता है। ‘फाटकों’ में यूनानी बहुवचन सुरक्षित है।
- source_word: Ἀνοίξατε, ἀνοίξατε δὴ τὴν πύλην
  choice: खोलो, फाटक खोलो!
  rationale: दोहराया हुआ आदेश तात्कालिकता और आग्रह प्रकट करता है। हिन्दी में विस्मयादिबोधक चिह्न δὴ के बल को स्वाभाविक रूप से व्यक्त करता है, जबकि कर्म ‘फाटक’ यूनानी के समान एकवचन है।
- source_word: μεθʼ ἡμῶν
  choice: हमारे साथ है
  rationale: यूनानी में क्रिया निहित है; हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए ‘है’ जोड़ा गया है।
- source_word: ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: परमेश्वर—हमारा परमेश्वर
  rationale: θεός की पुनरावृत्ति को डैश के साथ रखा गया है, जिससे स्वीकारोक्तिपूर्ण बल बना रहता है और इसे दो अलग उपाधियों के रूप में नहीं पढ़ा जाता।
- source_word: ποιῆσαι ἔτι ἰσχὺν
  choice: ताकि वह … आगे भी अपना बल दिखाए
  rationale: शाब्दिक ‘बल करना’ हिन्दी में अस्वाभाविक है। ‘बल दिखाए’ यूनानी मुहावरे का अर्थ देता है और ἔτι की निरंतरता ‘आगे भी’ से व्यक्त होती है।
- source_word: κράτος κατὰ τῶν ἐχθρῶν ἡμῶν
  choice: हमारे शत्रुओं के विरुद्ध अपना पराक्रम प्रकट करे
  rationale: कράτος इस विजय-संदर्भ में प्रभावी और विजयी शक्ति को दर्शाता है। ‘पराक्रम’ इसे पहले आए ‘बल’ से कुछ अलग रखता है; κατά का विरोधात्मक भाव ‘के विरुद्ध’ से सुरक्षित है।
- source_word: καθὰ καὶ σήμερον ἐποίησεν
  choice: जैसा उसने आज किया है
  rationale: यह तुलना आज ही पूरी हुई उस कार्रवाई को वर्तमान कथन से जोड़ती है; हिन्दी पूर्णकाल इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ὁ θεὸς ὁ θεὸς ἡμῶν में परमेश्वर-संबंधी बलाघात
  choice: परमेश्वर—हमारा परमेश्वर
  alternative: हमारा परमेश्वर
  rationale: मूल पाठ में θεός की पुनरावृत्ति बल देने के लिए है। दोनों अंश रखने से यह बल सुरक्षित रहता है और कोई अतिरिक्त धर्मसैद्धांतिक उपाधि नहीं जोड़ी जाती।
- issue: ποιῆσαι वाले infinitive का संबंध
  choice: ‘ताकि’ के द्वारा उद्देश्य के रूप में
  alternative: ‘जो … आगे भी अपना बल दिखाएगा’ के द्वारा अपेक्षित आगामी कार्य के रूप में
  rationale: संदर्भ में infinitive परमेश्वर की उपस्थिति से जुड़े उद्देश्य या परिणामी कार्य को व्यक्त कर सकता है। ‘ताकि’ स्रोत की व्याकरणिक निर्भरता बनाए रखते हुए हिन्दी में सहज है, यद्यपि अपेक्षा का अर्थ भी संभव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। आज्ञा की तात्कालिकता के लिए पुनरावृत्ति सुरक्षित है; ‘बल’ और ‘पराक्रम’ निकट अर्थ रखते हुए ἰσχύς और κράτος के हल्के भेद को दर्शाते हैं।
