  yaml_path: translation/deuterocanon/judith/013/010.yaml
  text: And she struck his neck twice with all her strength[a], and removed his head, and rolled his body off the bed[b], and took the canopy down from the posts.
translation:
  language: hi
  text: और उसने अपनी पूरी ताकत से उसकी गर्दन पर दो बार वार किया और उसका सिर अलग कर दिया[a]। फिर उसने उसके शरीर को पलंग से नीचे लुढ़का दिया और खंभों पर लगी मच्छरदानी[b] उतार ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “उसका सिर हटा दिया” है; प्रसंग से स्पष्ट है कि उसने उसका सिर काटकर अलग कर दिया।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ “मच्छरदानी” या “पलंग के ऊपर की छतरी” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάταξεν εἰς τὸν τράχηλον αὐτοῦ δὶς
  choice: उसकी गर्दन पर दो बार वार किया
  rationale: πατάσσω एक जोरदार प्रहार को व्यक्त करता है; εἰς τὸν τράχηλον प्रहार का लक्ष्य और δὶς उसकी संख्या बताते हैं। ‘वार किया’ आधुनिक हिन्दी में हिंसक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῇ ἰσχύϊ αὐτῆς
  choice: अपनी पूरी ताकत से
  rationale: यह क्रिया के ढंग और बल को व्यक्त करने वाला स्वाभाविक हिन्दी रूप है; ‘पूरी’ प्रसंग में प्रयुक्त शक्ति की तीव्रता स्पष्ट करती है।
- source_word: ἀφεῖλεν τὴν κεφαλὴν αὐτοῦ
  choice: उसका सिर अलग कर दिया
  rationale: ἀφαιρέω का मूल अर्थ ‘हटा देना/ले लेना’ है, जबकि प्रसंग सिर काटकर अलग करने की क्रिया स्पष्ट करता है। ‘सिर अलग कर दिया’ परिणाम को स्पष्ट रखते हुए किसी अधिक विशिष्ट यूनानी क्रिया का आभास नहीं देता।
- source_word: ἀπεκύλισεν τὸ σῶμα αὐτοῦ ἀπὸ τῆς στρωμνῆς
  choice: उसके शरीर को पलंग से नीचे लुढ़का दिया
  rationale: ἀποκυλίω लुढ़काने या लुढ़काकर हटाने का बोध देता है और στρωμνή यहाँ सोने के पलंग या बिछौने को सूचित करता है। ‘शरीर’ σῶμα के अनुरूप है; मूल पाठ स्पष्ट रूप से ‘लाश’ नहीं कहता।
- source_word: ἀφεῖλε τὸ κωνώπιον ἀπὸ τῶν στύλων
  choice: खंभों पर लगी मच्छरदानी उतार ली
  rationale: κωνώπιον जालीदार मच्छरदानी या पलंग की छतरी हो सकता है। ‘मच्छरदानी’ इसका सीधा और सामान्य हिन्दी अर्थ है; ‘खंभों पर लगी’ और ‘उतार ली’ वस्तु की स्थिति तथा हटाए जाने को स्वाभाविक रूप में व्यक्त करते हैं।
theological_decisions:
- issue: सिर काटे जाने का कथात्मक स्पष्टिकरण
  choice: उसका सिर अलग कर दिया
  alternative: उसका सिर हटा दिया
  rationale: यूनानी ἀφεῖλεν अपने आप में ‘हटा दिया’ कहता है, पर तत्काल प्रसंग सिर को धड़ से अलग किए जाने को स्पष्ट करता है। मुख्य पाठ स्वाभाविक हिन्दी में परिणाम बताता है, और पादटिप्पणी मूल की अपेक्षाकृत व्यापक शब्दावली दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण कथात्मक हिन्दी में रखी गई है। हिंसक घटना को न तो नरम किया गया है, न मूल पाठ से अधिक चित्रात्मक बनाया गया है। दोनों पादटिप्पणी-चिह्न संबद्ध शब्दों के तुरंत बाद रखे गए हैं।
