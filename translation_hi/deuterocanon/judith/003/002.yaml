  text: Look[a], we, the servants of Nebuchodonosor the great king, lie before you[b]; deal with us as is pleasing in your sight.
translation:
  language: hi
  text: देखो, हम महान राजा नबूकदोनोसोर के सेवक तुम्हारे सामने पड़े हैं; तुम्हें जैसा अच्छा लगे, वैसा ही हमारे साथ करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करते हुए निवेदन आरम्भ करता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इसका संकेतात्मक बल बनाए रखता है।
- source_word: παῖδες
  choice: सेवक
  rationale: राजकीय अधीनता और विनम्र आत्म-परिचय के इस प्रसंग में ‘सेवक’ उपयुक्त है; ‘बालक’ अर्थ को गलत दिशा देगा और ‘दास’ आवश्यकता से अधिक बंधुआ स्थिति पर बल देगा।
- source_word: Ναβουχοδονοσὸρ
  choice: नबूकदोनोसोर
  rationale: नाम को यूनानी स्रोत-पाठ के रूप के अनुसार लिप्यंतरित किया गया है, अधिक परिचित इब्रानी-आधारित रूप से उसका सामंजस्य नहीं किया गया।
- source_word: βασιλέως μεγάλου
  choice: महान राजा
  rationale: यह राजकीय सम्मानसूचक पदवी का स्वाभाविक हिन्दी रूप है और μεγάλου का बल स्पष्ट रखता है।
- source_word: παρακείμεθα
  choice: तुम्हारे सामने पड़े हैं
  rationale: यह पूर्ण मध्य/कर्मवाच्य रूप सामने पड़े या प्रस्तुत होकर अधीन होने की सजीव छवि देता है; केवल ‘उपस्थित हैं’ कहने से वह बल घट जाता।
- source_word: χρῆσαι ἡμῖν
  choice: हमारे साथ करो
  rationale: प्रसंग में क्रिया का आशय है कि विजेता उनके साथ अपनी इच्छा के अनुसार व्यवहार करे। हिन्दी में ‘हमारा उपयोग करो’ अनावश्यक रूप से साधनात्मक और कठोर लगेगा।
- source_word: καθὼς ἀρεστόν ἐστιν τῷ προσώπῳ σου
  choice: तुम्हें जैसा अच्छा लगे
  rationale: शाब्दिक ‘तुम्हारे मुख के सामने जैसा प्रसन्नकर है’ एक सामी-प्रभावित यूनानी मुहावरा है; इसका स्वाभाविक आधुनिक हिन्दी समतुल्य ‘तुम्हें जैसा अच्छा लगे’ है।
