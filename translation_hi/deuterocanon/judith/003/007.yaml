  text: And they themselves, and all their surrounding region, received him with garlands and dances and tambourines.
translation:
  language: hi
  text: और उन्होंने स्वयं तथा उनके आस-पास के पूरे क्षेत्र ने मालाओं[b], नृत्यों और डफों के साथ उसका स्वागत किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे ग्रहण किया।” यूनानी क्रिया का अर्थ शाब्दिक रूप से “ग्रहण करना” और प्रसंगानुसार “स्वागत करना,” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पुष्पहारों।” यहाँ यूनानी शब्द उत्सव में पहनी या धारण की जाने वाली मालाओं अथवा पुष्पहारों को दर्शाता है, आवश्यक नहीं कि राजमुकुटों को।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: स्वागत किया
  rationale: δέχομαι का अर्थ ‘ग्रहण करना’ या ‘स्वागत करना’ हो सकता है। उत्सवी जुलूस के इस प्रसंग में ‘स्वागत किया’ आधुनिक हिन्दी में स्वाभाविक है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: αὐτὸν
  choice: उसका
  rationale: यह कर्मवाचक सर्वनाम प्रसंग में होलोफेरनेस की ओर संकेत करता है; हिन्दी की संयुक्त क्रिया ‘स्वागत किया’ के साथ ‘उसका’ स्वाभाविक रूप है।
- source_word: αὐτοὶ
  choice: उन्होंने स्वयं
  rationale: स्पष्ट यूनानी सर्वनाम में निहित बल को ‘स्वयं’ द्वारा सुरक्षित रखा गया है।
- source_word: πᾶσα ἡ περίχωρος αὐτῶν
  choice: उनके आस-पास के पूरे क्षेत्र ने
  rationale: περίχωρος आस-पास के भूभाग या जिले को दर्शाता है। हिन्दी में एकवचन सामूहिक कर्ता के रूप में ‘पूरे क्षेत्र ने’ मूल संरचना और अर्थ दोनों को स्पष्ट रखता है।
- source_word: μετὰ στεφάνων
  choice: मालाओं के साथ
  rationale: στέφανος पुष्पमाला, उत्सवी माला या मुकुटाकार हार हो सकता है। नृत्य और डफ के उत्सवी प्रसंग में ‘मालाएँ’ राजमुकुट का अनावश्यक भाव नहीं लाता।
- source_word: χορῶν
  choice: नृत्यों के साथ
  rationale: χορός नृत्य, नृत्य-मंडली या सामूहिक नृत्य का बोध करा सकता है। ‘नृत्य’ मूल की व्यापकता को बिना अनावश्यक विशिष्टीकरण के बनाए रखता है।
- source_word: τυμπάνων
  choice: डफों के साथ
  rationale: τύμπανον हाथ से बजाए जाने वाले चौखटे वाले ढोल या टैम्बरीन-सदृश वाद्य को दर्शाता है। ‘डफ’ आधुनिक हिन्दी में संक्षिप्त, परिचित और सांस्कृतिक रूप से उपयुक्त है।
