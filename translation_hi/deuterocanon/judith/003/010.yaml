base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/010.yaml
  text: And they encamped between Gaibai and the city of the Scythians[a], and he was there for a full month[c][b], to gather all the full complement of his forces.
translation:
  language: hi
  text: और उन्होंने गैबाई और स्कूथियों के नगर[a] के बीच पड़ाव डाला। वह वहाँ एक महीने तक[b] रहा, ताकि अपनी सेना की पूरी संख्या[c] इकट्ठा कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्कूथोपोलिस”; यूनानी में शाब्दिक अर्थ “स्कूथियों का नगर” है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में शाब्दिक रूप “दिनों का एक महीना” है; यह एक महीने की अवधि बताने वाला मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “अपनी सेना की सारी साज-सामग्री” अथवा “अपनी सेना की पूरी तैयारी”; यूनानी शब्द पूर्ण संख्या, साज-सामग्री या पूरी सैन्य तैयारी का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεστρατοπέδευσαν
  choice: पड़ाव डाला
  rationale: यह सैन्य दल द्वारा शिविर लगाने का स्वाभाविक और स्पष्ट हिन्दी प्रयोग है।
- source_word: ἀνὰ μέσον
  choice: के बीच
  rationale: इसके बाद दो स्थानों के नाम आते हैं, इसलिए यहाँ स्थान-संबंधी अर्थ ‘के बीच’ है।
- source_word: Γαιβαὶ
  choice: गैबाई
  rationale: यूनानी पाठ में दिए स्थान-नाम का लिप्यंतरण किया गया है; इसे किसी अन्य संभावित बाइबिलीय स्थान-नाम से नहीं मिलाया गया।
- source_word: Σκυθῶν πόλεως
  choice: स्कूथियों के नगर
  rationale: यूनानी पदबंध का पारदर्शी अर्थ सुरक्षित रखा गया है; प्रचलित स्थान-नाम ‘स्कूथोपोलिस’ पादटिप्पणी में दिया गया है।
- source_word: ἦν ἐκεῖ
  choice: वह वहाँ ... रहा
  rationale: यूनानी क्रिया एकवचन है और प्रसंग में सेनानायक की ओर संकेत करती है; हिन्दी में अवधि के साथ ‘रहा’ स्वाभाविक है।
- source_word: μῆνα ἡμερῶν
  choice: एक महीने तक
  rationale: शाब्दिक रूप ‘दिनों का एक महीना’ है, पर हिन्दी में अवधि व्यक्त करने का सहज रूप ‘एक महीने तक’ है; शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
- source_word: συλλέξαι
  choice: इकट्ठा कर सके
  rationale: उद्देश्यसूचक क्रिया का अर्थ सैन्य दल को एकत्र करना है; ‘ताकि ... कर सके’ हिन्दी में उद्देश्य स्पष्ट करता है।
- source_word: ἀπαρτίαν
  choice: पूरा दल
  rationale: सैन्य प्रसंग में यह पूर्ण संख्या या पूर्ण सैन्य पूरक का बोध करा सकता है। ‘पूरा दल’ सैनिकों की पूरी संख्या का सहज हिन्दी रूप है, जबकि अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: δυνάμεως αὐτοῦ
  choice: अपनी सेना का
  rationale: यहाँ δύναμις अमूर्त सामर्थ्य नहीं, सैन्य बल को दर्शाता है। हिन्दी में ‘सेना’ इस प्रसंग में स्पष्ट और स्वाभाविक है।
