  text: And he and his force went down to the coast[a], and he garrisoned the high cities, and they took chosen men from them into alliance.
translation:
  language: hi
  text: और वह अपनी सेना के साथ तटीय क्षेत्र में उतर गया। उसने ऊँचाई पर बसे नगरों में सैनिक तैनात किए, और उन्होंने[a] उन नगरों में से चुने हुए पुरुषों को गठबंधन में शामिल कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ क्रिया ‘उन्होंने … शामिल कर लिया’ बहुवचन में है, जबकि आस-पास की क्रियाएँ एकवचन में हैं—‘वह उतर गया’ और ‘उसने … तैनात किए।’ बहुवचन संभवतः उसके आदेश के अधीन काम कर रहे सैनिकों को सूचित करता है; कुछ अनुवाद इसे सरल करके ‘उसने … शामिल कर लिया’ करते हैं।
    reason: मूल पाठ में क्रिया के वचन का अप्रत्याशित परिवर्तन सुरक्षित रखना।
lexical_decisions:
- source_word: κατέβη
  choice: उतर गया
  rationale: यह καταβαίνω के दिशासूचक अर्थ ‘नीचे जाना/उतरना’ को स्वाभाविक हिन्दी में बनाए रखता है और अनावश्यक रूप से ‘कूच किया’ जैसा सैन्य भाव नहीं जोड़ता।
- source_word: παραλίαν
  choice: समुद्र-तट के क्षेत्र
  rationale: παραλία समुद्र-तट अथवा तटीय भूभाग को दर्शाता है; ‘क्षेत्र’ जोड़ने से स्पष्ट होता है कि आशय केवल तटरेखा नहीं, तटीय प्रदेश से है।
- source_word: δύναμις
  choice: सेना
  rationale: इस सैन्य प्रसंग में δύναμις सशस्त्र सैन्य बल को सूचित करता है; सामान्य हिन्दी पाठक के लिए ‘सेना’ स्पष्ट और स्वाभाविक है।
- source_word: ἐφρούρησε
  choice: सैनिक तैनात किए
  rationale: नगरों के संदर्भ में क्रिया का अर्थ उनकी रक्षा या नियंत्रण के लिए सैन्य चौकी स्थापित करना है; यह हिन्दी अभिव्यक्ति उस प्रसंगगत अर्थ को स्पष्ट करती है।
- source_word: πόλεις τὰς ὑψηλάς
  choice: ऊँचाई पर बसे नगरों
  rationale: ὑψηλάς का स्थलाकृतिक अर्थ ‘ऊँचे’ है। ‘ऊँचाई पर बसे’ स्वाभाविक हिन्दी है और ‘गढ़वाले’ या ‘सुदृढ़’ जैसा ऐसा अर्थ नहीं जोड़ता जो विशेषण में स्पष्ट नहीं है।
- source_word: ἔλαβον
  choice: उन्होंने … शामिल कर लिया
  rationale: यूनानी क्रिया बहुवचन है, इसलिए आसपास की एकवचन क्रियाओं के बावजूद हिन्दी में बहुवचन ‘उन्होंने’ रखा गया है। संख्या के इस परिवर्तन को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ἄνδρας ἐπιλέκτους
  choice: चुने हुए पुरुषों
  rationale: यह ἄνδρας के पुरुषवाचक अर्थ और ἐπιλέκτους के ‘चुने हुए’ अर्थ, दोनों को सीधे बनाए रखता है।
- source_word: εἰς συμμαχίαν
  choice: गठबंधन में शामिल
  rationale: यह वाक्यांश उन पुरुषों को सैन्य-राजनीतिक सहयोग में सम्मिलित किए जाने का भाव व्यक्त करता है और हिन्दी में स्वाभाविक है।
