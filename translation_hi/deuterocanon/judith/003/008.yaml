revisions:
- from: और उसने उनकी सारी सीमाओं को ढा दिया और उनके पवित्र उपवनों को काट डाला। उसे देश के सभी देवताओं को नष्ट कर देने की अनुमति दी गई थी, ताकि सब राष्ट्र केवल उसी की—नबूकदनेस्सर की—उपासना करें, और उनकी सभी भाषाएँ और उनके सभी गोत्र उसे देवता कहकर पुकारें।
  to: और उसने उनकी सारी सरहदें ढा दीं और उनके पवित्र उपवनों को काट डाला। उसे देश के सभी देवताओं को नष्ट कर देने की अनुमति दी गई थी, ताकि सब राष्ट्र केवल उसी की—नबूकदनेस्सर की—उपासना करें, और हर भाषा-समूह तथा हर गोत्र के लोग उसे देवता कहकर पुकारें।
  rationale: 'The revision preserves the Greek passive ambiguity in ‘उसे ... अनुमति दी गई थी,’ the exclusive force of μόνῳ (‘केवल उसी की’), and the ruler''s claimed—not affirmed—divine status (‘देवता कहकर’). It adjusts only two idiomatic points: boundaries are more naturally ‘सरहदें’ that are ‘ढा दीं,’ and the final coordinated ethnic-linguistic groups are expressed with ‘के लोग’ so that the verb of invocation has natural human subjects. No footnote is required because the renderings do not conceal a disputed textual reading or essential ambiguity.'
  reviewer_model: gpt-5.6-terra
