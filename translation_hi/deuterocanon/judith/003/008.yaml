base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/008.yaml
  text: And he tore down all their borders and cut down their sacred groves; and it had been granted to him to destroy all the gods of the land, so that all the nations might worship him alone—Nebuchadnezzar—and that all their tongues and all their tribes might call on him as god.
translation:
  language: hi
  text: और उसने उनकी सारी सरहदें ढा दीं और उनके पवित्र उपवनों को काट डाला। उसे देश के सभी देवताओं को नष्ट कर देने की अनुमति दी गई थी, ताकि सब राष्ट्र केवल उसी की—नबूकदनेस्सर की—उपासना करें, और हर भाषा-समूह तथा हर गोत्र के लोग उसे देवता कहकर पुकारें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρια
  choice: सीमाओं
  rationale: शब्द का मूल अर्थ सीमा या सरहद है; प्रसंग में विजित लोगों की सीमाओं अथवा सीमा-चिह्नों को ढाने का भाव सुरक्षित रहता है।
- source_word: ἄλση
  choice: पवित्र उपवनों
  rationale: ἄλσος धार्मिक उपासना से जुड़े वृक्ष-समूह या उपवन को दर्शाता है; केवल ‘वन’ कहने से इसका पूजा-संबंधी अर्थ खो जाता।
- source_word: τῆς γῆς
  choice: देश के
  rationale: यहाँ γῆ विजित भूभाग या देश के अर्थ में स्वाभाविक है, यद्यपि इसका व्यापक अर्थ ‘पृथ्वी’ भी हो सकता है।
- source_word: λατρεύσωσι
  choice: उपासना करें
  rationale: क्रिया धार्मिक सेवा और आराधना का संकेत देती है; नबूकदनेस्सर की देवत्व की माँग के संदर्भ में ‘उपासना’ उपयुक्त है।
- source_word: γλῶσσαι
  choice: भाषाएँ
  rationale: शाब्दिक अर्थ ‘जीभें’ है, पर जातीय-भाषायी समूहों के संदर्भ में आशय भाषाएँ बोलने वाले लोग हैं; आधुनिक हिन्दी में ‘भाषाएँ’ स्पष्ट और स्वाभाविक है।
- source_word: φυλαὶ
  choice: गोत्र
  rationale: φυλή वंशगत या जनजातीय समूह को व्यक्त करता है; ‘गोत्र’ संक्षिप्त रूप से उस सामुदायिक विभाजन को रखता है।
- source_word: ἐπικαλέσωνται αὐτὸν εἰς θεόν
  choice: उसे देवता कहकर पुकारें
  rationale: वाक्यांश में उसे देवता के रूप में संबोधित या स्वीकार करने का भाव है; यह अनुवाद उस दावे को व्यक्त करता है, बिना उसे सत्य ठहराए।
theological_decisions:
- issue: नबूकदनेस्सर के लिए देवत्व का दावा
  choice: ‘उसे देवता कहकर पुकारें’
  alternative: ‘उसे परमेश्वर मानकर पुकारें’
  rationale: यूनानी θεός यहाँ मूर्तिपूजक शासक द्वारा अपने लिए माँगे गए देवत्व को बताता है। ‘देवता’ प्रसंगानुकूल है और एकमात्र सच्चे परमेश्वर के साथ अनावश्यक समानता उत्पन्न नहीं करता।
- issue: ἐπικαλέομαι का अर्थ
  choice: कहकर पुकारें
  alternative: आह्वान करें
  rationale: मूल में संबोधन, नाम लेना या आह्वान करना संभव है। सहज हिन्दी में चुना गया रूप जानबूझकर लगाए गए ‘देवता’ के पद को स्पष्ट करता है, जबकि पूजा का विचार पहले ही λατρεύσωσι में उपस्थित है।
- issue: ἦν δεδομένον αὐτῷ की कर्तृवाचक अस्पष्टता
  choice: उसे ... अनुमति दी गई थी
  alternative: उसे ... अधिकार मिला था
  rationale: मूल निष्क्रिय रूप यह नहीं बताता कि अनुमति किसने दी। हिन्दी में भी कर्ता को अनिर्दिष्ट रखकर संभावित दैवी अनुमोदन या मानवीय आदेश को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। वाक्य मूल यूनानी के क्रम और तनाव के निकट है, पर अत्यधिक शाब्दिक ‘जीभें’ के स्थान पर सामान्य पाठक के लिए ‘भाषाएँ’ रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
