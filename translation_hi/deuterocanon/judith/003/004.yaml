base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/004.yaml
  text: Look[a], our cities also, and those who live in them, are your servants; come and deal with them as is good in your eyes.
translation:
  language: hi
  text: देखिए, हमारे नगर और उनमें रहनेवाले लोग भी आपके दास[a] हैं। आइए और उनके साथ वैसा व्यवहार कीजिए[b], जैसा आपकी दृष्टि में अच्छा हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गुलाम।” यहाँ यूनानी शब्द विजेता के अधीन दासत्व या पूर्ण अधीनता पर जोर देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनसे मिलिए” या “उनका सामना कीजिए।” संदर्भ में इसका भाव है कि वह उनके साथ अपनी इच्छा के अनुसार पेश आए।
    reason: source_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखिए
  rationale: यह शब्द सामने रखी जा रही बात पर जोर देकर ध्यान खींचता है। सम्मानसूचक ‘देखिए’ आधुनिक हिन्दी में स्वाभाविक है और सेनापति को संबोधन के अनुरूप है।
- source_word: πόλεις
  choice: नगर
  rationale: यह शहरी बस्तियों के लिए सामान्य यूनानी शब्द है; ‘नगर’ संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: οἱ κατοικοῦντες ἐν αὐταῖς
  choice: उनमें रहनेवाले लोग
  rationale: यह कृदन्तीय अभिव्यक्ति नगरों में निवास करनेवाले लोगों को दर्शाती है। यह अनुवाद हिन्दी में स्वाभाविक रहते हुए उसके क्रियात्मक भाव को बनाए रखता है।
- source_word: δοῦλοί
  choice: दास
  rationale: संदर्भ विजेता के सामने पूर्ण राजनीतिक अधीनता का है। ‘दास’ उस अधीन स्थिति को व्यक्त करता है, जबकि पादटिप्पणी अधिक स्पष्ट विकल्प ‘गुलाम’ देती है।
- source_word: ἐλθὼν
  choice: आइए
  rationale: यह कृदन्त अगले आदेश के साथ मिलकर आदेशात्मक अर्थ देता है। हिन्दी में इसे समन्वित आदरसूचक आदेश के रूप में व्यक्त करना स्वाभाविक है।
- source_word: ἀπάντησον αὐταῖς
  choice: उनके साथ वैसा व्यवहार कीजिए
  rationale: क्रिया का मूल अर्थ ‘मिलना/सामना करना’ है, पर नगरों के समर्पण के संदर्भ में आशय उनके साथ अपनी इच्छा के अनुसार पेश आने का है। पादटिप्पणी शाब्दिक संभावना सुरक्षित रखती है। स्त्रीलिंग सर्वनाम का व्याकरणिक पूर्वपद ‘नगर’ हैं, जिन्हें यहाँ उनके निवासियों सहित समझा गया है।
- source_word: ὡς ἔστιν ἀγαθὸν ἐν ὀφθαλμοῖς σου
  choice: जैसा आपकी दृष्टि में अच्छा हो
  rationale: यह किसी व्यक्ति के अपने निर्णय या इच्छा के अनुसार काम करने का सामी मुहावरा है। निकटवर्ती हिन्दी रूप मूल की चित्रात्मक भाषा और अर्थ दोनों को बनाए रखता है।
theological_decisions:
- issue: राजनीतिक समर्पण के संदर्भ में δοῦλοι का अनुवाद
  choice: दास
  alternative: गुलाम; सेवक
  rationale: वचन में नगर और निवासी विजयी शक्ति के सामने बिना शर्त अधीनता स्वीकार कर रहे हैं। ‘सेवक’ इस बाध्य अधीनता को कमजोर कर सकता है; ‘दास’ गरिमापूर्ण हिन्दी में उसका भार रखता है, और ‘गुलाम’ को पादटिप्पणी में स्पष्ट विकल्प के रूप में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक संबोधन रखा गया है, क्योंकि वक्ता विजयी सेनापति से बात कर रहे हैं। भाषा सरल और गरिमापूर्ण है। ‘आपकी दृष्टि में अच्छा’ मूल मुहावरे को जानबूझकर सुरक्षित रखता है।
