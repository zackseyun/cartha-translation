- source_word: ἀπήγγειλαν
  choice: समाचार दिया
  rationale: क्रिया किसी संदेश को पहुँचाने या लौटकर सूचना देने के अर्थ में है; ‘समाचार दिया’ दूत-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: इन वचनों के अनुसार
  rationale: यह चयन यूनानी संरचना को निकटता से सुरक्षित रखता है और संकेत देता है कि दिया गया समाचार पहले कहे गए शब्दों के अनुरूप था।
