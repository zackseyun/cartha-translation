base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/003.yaml
  text: Look[a], our homesteads and every field of wheat and the flocks and the herds and all the enclosures of our tents lie before you[b]; use them as pleases you.
translation:
  language: hi
  text: देखो[a], हमारे ग्रामीण घर-बार, गेहूँ के सारे खेत, भेड़-बकरियों के झुंड, मवेशियों के झुंड और हमारे तंबुओं के सभी बाड़े तुम्हारे सामने पड़े हैं[b]; जैसा तुम्हें अच्छा लगे, उनका उपयोग करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ग्रामीण घर-बार’ के लिए ‘खेतिहर निवास-स्थल’ भी संभव है। यूनानी शब्द (ἐπαύλεις) कृषि-परिवेश में स्थित ग्रामीण निवासों या संपत्तियों का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हमारे तंबुओं के सभी बाड़े।’ संभवतः इसका आशय उनके शिविरों अथवा पशुधन से जुड़े घेरे हुए स्थानों से है।
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह संबोधित व्यक्ति का ध्यान खींचने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग है और यूनानी शब्द की संकेतात्मक शक्ति बनाए रखता है।
- source_word: ἐπαύλεις
  choice: गाँव-घर
  rationale: यह कृषि-परिवेश में स्थित ग्रामीण निवासों अथवा आवासीय संपत्तियों का बोध कराता है; केवल ‘घर’ कहने की अपेक्षा इसका ग्रामीण संदर्भ अधिक स्पष्ट है।
- source_word: πᾶν πεδίον πυρῶν
  choice: गेहूँ के सारे खेत
  rationale: πεδίον यहाँ गेहूँ उगाई जाने वाली भूमि को सूचित करता है। हिन्दी में सामूहिक बहुवचन इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ποίμνια
  choice: भेड़-बकरियों के झुंड
  rationale: यह छोटे पालतू पशुओं के झुंडों को स्पष्ट करता है और अगले पद में आए गोवंशीय पशुओं से भेद बनाए रखता है।
- source_word: βουκόλια
  choice: मवेशियों के झुंड
  rationale: शब्द मुख्यतः गोवंशीय पशुधन के समूहों को सूचित करता है; ‘मवेशी’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘झुंड’ सामूहिक अर्थ बचाता है।
- source_word: μάνδραι
  choice: बाड़े
  rationale: यह पशुओं या शिविर-संपत्ति के लिए घेरे हुए स्थानों का सामान्य और सहज हिन्दी शब्द है, बिना उनके स्वरूप को अनावश्यक रूप से निश्चित किए।
- source_word: τῶν σκηνῶν ἡμῶν
  choice: हमारे तंबुओं के
  rationale: σκηναί का प्रत्यक्ष अर्थ ‘तंबू’ है; इसे बनाए रखने से मूल का शिविर-संबंधी दृश्य सुरक्षित रहता है।
- source_word: παράκεινται πρὸ προσώπου σου
  choice: तुम्हारे सामने पड़े हैं
  rationale: यह वस्तुओं के सामने उपस्थित और उपलब्ध होने की स्थानगत उपमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: χρῆσαι
  choice: उनका उपयोग करो
  rationale: संदर्भ में यह सूचीबद्ध संपत्ति को इस्तेमाल करने की अनुमति देने वाला आदेश है; हिन्दी में स्पष्टता के लिए ‘उनका’ जोड़ा गया है।
- source_word: καθʼ ὃ ἂν ἀρέσκῃ σοι
  choice: जैसा तुम्हें अच्छा लगे
  rationale: यह संबोधित व्यक्ति की इच्छा के अनुसार काम करने की खुली अनुमति को विनम्र और स्वाभाविक हिन्दी में व्यक्त करता है।
