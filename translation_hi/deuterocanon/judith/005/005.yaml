base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/005.yaml
  text: And Achior[a], the leader of all the sons of Ammon, said to him, “Let my lord now hear a word from the mouth of your servant, and I will tell you the truth about the people who dwell in this hill country near you[b], and no falsehood will come from the mouth of your servant.”
translation:
  language: hi
  text: तब सभी अम्मोनियों के अगुवे अखीओर[a] ने उससे कहा, “मेरे स्वामी अब आपके सेवक के मुँह से एक बात सुनें। मैं आपको उन लोगों के विषय में सत्य बताऊँगा, जो आपके निकट इस पहाड़ी प्रदेश में रहते हैं[b], और आपके सेवक के मुँह से कोई झूठ नहीं निकलेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अम्मोन के सभी पुत्रों का।” यूनानी में शाब्दिक रूप से “अम्मोन के सभी पुत्रों का अगुवा” है।
    reason: वंशसूचक जातिनाम के शाब्दिक रूप को सुरक्षित रखते हुए मुख्य पाठ में स्वाभाविक हिन्दी जातिनाम दिया गया है।
  - marker: b
    text: यूनानी में शाब्दिक क्रम है, “जो इस पहाड़ी प्रदेश में रहते हैं, आपके निकट रहने वाले।” अंतिम पदबंध का व्याकरणिक संबंध कुछ असामान्य है; अर्थ है कि वे आपके निवास या पड़ाव के निकट रहते हैं।
    reason: असामान्य कृदन्तीय रचना और उसकी सीमित व्याकरणिक अस्पष्टता को बिना अनुमानात्मक विस्तार के स्पष्ट करने के लिए।
lexical_decisions:
- source_word: Ἀχιὼρ
  choice: अखीओर
  rationale: यूनानी नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: ὁ ἡγούμενος
  choice: अगुवा
  rationale: यह पद नेतृत्व करने वाले व्यक्ति को दर्शाता है; ‘अगुवा’ आधुनिक हिन्दी में स्वाभाविक है और किसी अनिश्चित औपचारिक पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: πάντων υἱῶν Ἀμμών
  choice: अम्मोन की सारी संतानें
  rationale: मूल के वंशसूचक मुहावरे ‘अम्मोन के पुत्रों’ का भाव बनाए रखते हुए समावेशी और स्वाभाविक हिन्दी दी गई है; जातिनाम ‘अम्मोनी’ पादटिप्पणी में है।
- source_word: Ἀκουσάτω δὴ λόγον
  choice: अब ... एक बात सुने
  rationale: तृतीय-पुरुष आज्ञार्थक और δή की विनम्र तत्परता को दरबारी अनुरोध के रूप में रखा गया है।
- source_word: ὁ κύριός μου
  choice: मेरा स्वामी
  rationale: यहाँ κύριος परमेश्वर के लिए नहीं, एक मानवीय वरिष्ठ के प्रति आदरसूचक संबोधन है।
- source_word: ἐκ στόματος τοῦ δούλου σου
  choice: अपने सेवक के मुँह से
  rationale: δοῦλος यहाँ विनम्र दरबारी आत्म-संबोधन है; ‘सेवक’ प्रसंगानुकूल है और ‘मुँह से’ मूल रूपक को बनाए रखता है।
- source_word: ἀναγγελῶ σοι τὴν ἀλήθειαν
  choice: मैं आपको ... सच्ची बात बताऊँगा
  rationale: ἀναγγέλλω के बताने या सूचित करने के अर्थ और ἀλήθεια के सत्यभाव को सहज हिन्दी में व्यक्त किया गया है।
- source_word: τὴν ὀρεινὴν ταύτην
  choice: इस पहाड़ी प्रदेश
  rationale: ὀρεινή किसी पहाड़ी या पर्वतीय भूभाग को दर्शाता है; ‘पहाड़ी प्रदेश’ स्पष्ट और भौगोलिक रूप से उपयुक्त है।
- source_word: πλησίον σοῦ οἰκούντος
  choice: आपके निकट
  rationale: यूनानी पदबंध का आशय होलोफेरनेस के निवास या पड़ाव के निकटता से है; जटिल कृदन्तीय रचना की जानकारी पादटिप्पणी में सुरक्षित है।
- source_word: οὐκ ἐξελεύσεται ψεῦδος
  choice: कोई झूठ नहीं निकलेगा
  rationale: भाषण के मुँह से निकलने के मूल रूपक और दृढ़ आश्वासन दोनों को बनाए रखा गया है।
theological_decisions:
- issue: मानवीय संबोधन में κύριος का अनुवाद
  choice: मेरा स्वामी
  alternative: मेरे प्रभु
  rationale: प्रसंग में यह मानवीय सेनापति के लिए आदरसूचक संबोधन है, ईश्वरीय उपाधि नहीं; ‘स्वामी’ इस भेद को स्पष्ट रखता है।
- issue: दरबारी आत्म-संदर्भ में δοῦλος का अनुवाद
  choice: आपका सेवक
  alternative: आपका दास
  rationale: यहाँ शब्द सामाजिक दासता पर बल देने के बजाय विनम्र संबोधन-सूत्र के रूप में प्रयुक्त है; इसलिए ‘सेवक’ वाक्य-प्रयोग के अधिक अनुकूल है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। अखीओर की वाणी में वरिष्ठ अधिकारी के प्रति विनम्र दरबारी लहजा है। ‘जाति’ λαός के सामुदायिक अर्थ को व्यक्त करती है; वाक्य के अंतिम भाग में ‘मुँह से ... निकलेगा’ की पुनरुक्ति जानबूझकर मूल के शपथ-सदृश प्रभाव के लिए रखी गई है।
