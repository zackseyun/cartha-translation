    issue: The residence clause is placed before the famine clause’s completion in a way that slightly obscures the Greek narrative sequence.
    rationale: The Greek states descent to Egypt, explains the famine, then says they resided there as outsiders until they were sustained. Restoring this sequence improves fidelity and flow.
