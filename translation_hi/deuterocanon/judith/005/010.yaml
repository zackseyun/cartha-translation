  naturalness: “एक बहुत बड़ी जनसमुदाय” is grammatically incorrect in modern Hindi, since समुदाय is masculine and the phrase is less idiomatic than “बहुत बड़ा जनसमूह.” The revised wording is natural, clear, and retains the elevated narrative register.
  terminology: “अकाल,” “परदेशी,” “भरण-पोषण,” and “कुल” are suitable. “कुल” represents γένος without importing modern racial categories; the footnote appropriately preserves “वंश” and “लोग” as alternatives.
