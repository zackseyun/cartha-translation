base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/010.yaml
  text: And they went down into Egypt[a], for a famine covered the face of the land of Canaan, and they lived there as sojourners until they were sustained; and there they became a very great multitude, and there was no number to their family line.
translation:
  language: hi
  text: और वे मिस्र उतर गए, क्योंकि अकाल ने कनान की भूमि को ढक लिया था; और वे वहाँ परदेशी होकर तब तक रहे, जब तक उनका भरण-पोषण हुआ। वहाँ वे बढ़कर बहुत बड़ा जनसमूह बन गए, और उनके कुल[a] की कोई गिनती न थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके वंश’ अथवा ‘उनके लोग’; यूनानी γένος का अर्थ वंश, कुल या किसी समान पूर्वज से निकला समुदाय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβησαν
  choice: उतर गए
  rationale: मिस्र जाने के लिए प्रयुक्त दिशासूचक और बाइबलीय मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκάλυψεν
  choice: ढक लिया था
  rationale: अकाल द्वारा भूमि को ढक लेने के मूल बिंब को सुरक्षित रखता है।
- source_word: τὸ πρόσωπον τῆς γῆς Χανααν
  choice: कनान देश की धरती
  rationale: ग्रीक के भूमि-संबंधी बिंब को सहज हिन्दी में व्यक्त करता है; शाब्दिक ‘भूमि का मुख’ आधुनिक हिन्दी में अस्वाभाविक होता।
- source_word: λιμός
  choice: अकाल
  rationale: ऐतिहासिक कथानक में λιμός का सटीक और प्रचलित हिन्दी समतुल्य है।
- source_word: παρῴκησαν
  choice: परदेशी होकर रहे
  rationale: स्थायी बसावट के बजाय परदेश में अस्थायी निवासी के रूप में रहने का भाव सुरक्षित रखता है।
- source_word: μέχρις οὗ διετράφησαν
  choice: जब तक उनका भरण-पोषण हुआ
  rationale: निष्क्रिय क्रिया के पालन-पोषण अथवा जीवन-निर्वाह कराए जाने के व्यापक भाव को बनाए रखता है।
- source_word: ἐγένοντο ... εἰς πλῆθος πολύ
  choice: बढ़कर एक बहुत बड़ी जनसमुदाय बन गए
  rationale: परिणाम और अत्यधिक संख्या, दोनों पर दिए गए जोर को व्यक्त करता है।
- source_word: οὐκ ἦν ἀριθμὸς
  choice: कोई गिनती न थी
  rationale: असंख्यता के मूल मुहावरे का औपचारिक किंतु स्पष्ट हिन्दी रूप है।
- source_word: τοῦ γένους αὐτῶν
  choice: उनके कुल
  rationale: γένος के वंश, कुल अथवा समान पूर्वज से निकले समुदाय के भाव को आधुनिक नस्लीय श्रेणियों के बिना व्यक्त करता है।
theological_decisions:
- issue: τοῦ γένους αὐτῶν में जातीय अथवा वंशगत शब्दावली
  choice: उनके कुल
  alternative: उनके वंश / उनके लोग
  rationale: यहाँ बल समान पूर्वज से जुड़े कुल और उसकी संख्यात्मक वृद्धि पर है। ‘कुल’ इस वंशगत-सामुदायिक अर्थ को रखता है और ‘नस्ल’ या आधुनिक अर्थ वाले ‘जाति’ से उत्पन्न अनचाहे संकेतों से बचता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परदेशी होकर रहे’ और ‘भरण-पोषण’ मूल के निवास तथा निर्वाह-संबंधी सूक्ष्म अर्थों को सुरक्षित रखते हैं।
