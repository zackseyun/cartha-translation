lexical_decisions:
- source_word: κατεξήρανεν
  choice: सुखा दिया
  rationale: यह सकर्मक अभिव्यक्ति समुद्र को पूरी तरह सूखा कर मार्ग योग्य बना देने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
