- source_word: ἔμπροσθεν αὐτῶν
  choice: उनके सामने
  rationale: यह लोगों के आगे अथवा उनकी दृष्टि में हुए कार्य का स्थान-संबंधी भाव संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: निर्गमन की घटना के संकेत में ἐρυθρὰν θάλασσαν का अनुवाद
  choice: लाल समुद्र
  alternative: सरकंडों का समुद्र
  rationale: प्रस्तुत यूनानी साक्ष्य में ἐρυθρὰν θάλασσαν, अर्थात ‘लाल समुद्र’, है। इब्रानी ים סוף से जुड़ा वैकल्पिक अनुवाद पाठगत पारदर्शिता के लिए पादटिप्पणी में सुरक्षित रखा गया है, मुख्य पाठ में आरोपित नहीं किया गया।
