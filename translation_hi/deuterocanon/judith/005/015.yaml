  text: And they lived in the land of the Amorites[a], and by their strength they destroyed all the Heshbonites; and after crossing the Jordan[b], they took possession of all the hill country.
translation:
  language: hi
  text: और वे एमोरियों के देश में बस गए। उन्होंने अपने बल से[a] हेशबोन के सभी लोगों का सर्वनाश कर दिया; फिर यरदन पार करके उन्होंने पूरे पहाड़ी प्रदेश पर अधिकार कर लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने बल में”; अर्थ “अपने सामर्थ्य के द्वारा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पूरे पहाड़ी प्रदेश को विरासत में पाया।” यूनानी क्रिया विरासत या स्वामित्व के रूप में कुछ पाने का भाव रख सकती है; यहाँ यरदन पार करने के बाद भूभाग पर अधिकार करने की बात है।
    reason: lexical_alternative
