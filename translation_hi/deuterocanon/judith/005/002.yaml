  yaml_path: translation/deuterocanon/judith/005/002.yaml
  text: And he became very angry[a], and he summoned all the rulers of Moab, the generals of Ammon, and all the satraps of the coastland[b],
translation:
  language: hi
  text: और वह बहुत क्रोधित हुआ[a]; उसने मोआब के सभी शासकों, अम्मोन के सेनापतियों और समुद्र-तटीय प्रदेश के सभी क्षत्रपों[b] को बुलवाया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बड़े रोष से भर गया।” यूनानी पदबंध क्रोध की अत्यधिक तीव्रता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “समुद्र-तट” अथवा “तटीय क्षेत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: क्रोधित हुआ
  rationale: यह क्रिया क्रोध की अवस्था में आने को व्यक्त करती है। ‘क्रोधित हुआ’ आधुनिक हिन्दी में स्वाभाविक है और इस भाव को स्पष्ट रखता है।
- source_word: θυμῷ σφόδρα
  choice: बहुत
  rationale: यह पदबंध क्रोध की तीव्रता बढ़ाता है। हिन्दी में ‘बहुत क्रोधित हुआ’ मूल बल को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐκάλεσεν
  choice: बुलवाया
  rationale: शासक द्वारा अधिकारियों को अपने पास उपस्थित होने का आदेश देने के प्रसंग में ‘बुलवाया’ अधिकारपूर्ण बुलावे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄρχοντας
  choice: शासकों
  rationale: यह शब्द शासन करने वाले अधिकारियों को सूचित करता है। ‘शासक’ व्यापक, सुबोध और राजनीतिक प्रसंग के अनुकूल है।
- source_word: στρατηγοὺς
  choice: सेनापतियों
  rationale: यहाँ शब्द का सैन्य अर्थ प्रमुख है। ‘सेनापति’ उच्च सैन्य अधिकारियों के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्द है।
- source_word: σατράπας
  choice: क्षत्रपों
  rationale: ‘क्षत्रप’ फ़ारसी प्रशासनिक पद की ऐतिहासिक विशिष्टता बनाए रखता है; इसे सामान्य ‘राज्यपाल’ कहने से वह रंग खो जाता।
- source_word: τῆς παραλίας
  choice: समुद्र-तटीय प्रदेश के
  rationale: παραλία समुद्र के किनारे के भूभाग या जिले को सूचित करता है। ‘समुद्र-तटीय प्रदेश’ भौगोलिक अर्थ को स्पष्ट रखता है।
- source_word: Μωὰβ
  choice: मोआब
  rationale: यह नाम का हिन्दी बाइबलीय लिप्यंतरण है।
- source_word: Ἀμμὼν
  choice: अम्मोन
  rationale: यह नाम का हिन्दी बाइबलीय लिप्यंतरण है।
