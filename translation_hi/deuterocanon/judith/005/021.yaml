base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/021.yaml
  text: But if there is no lawlessness in their nation[a], let my lord pass by, lest perhaps their Lord and their God defend them, and we become a reproach before all the earth.
translation:
  language: hi
  text: पर यदि उनके राष्ट्र में कोई अधर्म नहीं है, तो मेरे स्वामी आगे बढ़ जाएँ[a], कहीं ऐसा न हो कि उनका प्रभु और उनका परमेश्वर उनकी रक्षा करे और हम सारी पृथ्वी के सामने अपमान के पात्र बन जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से: “स्वामी आगे बढ़ जाए।” प्रसंग में यह होलोफेरनेस के लिए आदरसूचक संबोधन है, परमेश्वर के लिए नहीं।'
    reason: पहले κύριος की सम्भावित औपचारिक अस्पष्टता और उसके प्रसंगानुसार मानवीय संदर्भ को स्पष्ट करना।
lexical_decisions:
- source_word: ἀνομία
  choice: अधर्म
  rationale: यह शब्द व्यवस्था-विरोधी आचरण और नैतिक बुराई—दोनों का भाव रखता है। ‘अधर्म’ आधुनिक हिन्दी में स्वाभाविक है और इसे किसी एक अपराध तक सीमित नहीं करता।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: यहाँ इस्राएल को एक सामूहिक राष्ट्रीय समुदाय के रूप में देखा गया है। ‘राष्ट्र’ इस अर्थ को ‘लोगों’ से अधिक स्पष्ट रखता है और ‘जाति’ के आधुनिक जाति-व्यवस्था वाले संभावित अर्थ से बचाता है।
- source_word: παρελθέτω
  choice: उनके पास से आगे बढ़ जाएँ
  rationale: आज्ञार्थक क्रिया का मूल भाव पास से निकल जाने या आगे बढ़ जाने का है। प्रसंग में यह होलोफेरनेस को आदरसूचक संबोधन के साथ उनसे उलझे बिना आगे निकल जाने की सलाह है।
- source_word: μή ποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह सम्भावित और अवांछित परिणाम की सावधानीपूर्ण चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπερασπίσῃ
  choice: रक्षा करे
  rationale: क्रिया किसी के पक्ष में खड़े होकर उसकी रक्षा करने का अर्थ देती है; ‘रक्षा करे’ सैन्य प्रसंग में स्पष्ट और सहज है।
- source_word: ὀνειδισμός
  choice: अपमान के पात्र
  rationale: शब्द सार्वजनिक तिरस्कार और बदनामी का बोध कराता है। ‘अपमान के पात्र’ बाहरी निंदा का भाव स्पष्ट करता है।
- source_word: πάσης τῆς γῆς
  choice: सारी पृथ्वी
  rationale: वाक्यांश व्यापक और आलंकारिक है; ‘सारी पृथ्वी’ यूनानी अभिव्यक्ति के विस्तार को बनाए रखता है।
- source_word: κύριος
  choice: मेरे स्वामी / उनका प्रभु
  rationale: पहला प्रयोग प्रसंगानुसार मानव अधिकारी होलोफेरनेस के आदरसूचक संबोधन के रूप में है, जबकि दूसरा ‘उनका परमेश्वर’ के साथ जुड़कर स्पष्टतः परमेश्वर को सूचित करता है।
theological_decisions:
- issue: एक ही वाक्य में κύριος के दो भिन्न संदर्भ
  choice: पहले प्रयोग को ‘मेरे स्वामी’ और दूसरे को ‘उनका प्रभु’ किया गया है।
  alternative: दोनों को केवल ‘प्रभु’ रखकर औपचारिक अस्पष्टता बनाए रखना।
  rationale: पहला प्रयोग व्याकरण की दृष्टि से अकेले देखने पर अस्पष्ट हो सकता है, पर तत्काल प्रसंग होलोफेरनेस को दी जा रही सलाह है; इसलिए मानव अधिकारी का आदरसूचक संबोधन सर्वाधिक सम्भावित है। दूसरा प्रयोग ‘उनका परमेश्वर’ के साथ है और इसलिए उसका ईश्वरीय संदर्भ स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अधर्म’, ‘प्रभु’ और ‘परमेश्वर’ से बाइबिलीय गरिमा बनी रहती है, जबकि वाक्य-विन्यास स्वाभाविक आधुनिक हिन्दी का है।
