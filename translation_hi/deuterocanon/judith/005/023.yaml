  text: For we will not be helped by the sons of Israel; for look, they are a people in whom there is neither strength nor might for strong battle formation.
translation:
  language: hi
  text: क्योंकि इस्राएल के पुत्रों से हमें सहायता नहीं मिलेगी; क्योंकि देखो, वे ऐसे लोग हैं जिनमें एक सुदृढ़ युद्ध-पंक्ति के लिए न तो बल है, न सामर्थ्य।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βοηθησόμεθα ἀπό
  choice: से हमें सहायता मिलेगी
  rationale: यूनानी निष्क्रिय भविष्यकाल और ἀπό को स्वाभाविक हिन्दी में व्यक्त करता है; नकार के साथ अर्थ है कि सहायता प्राप्त नहीं होगी।
- source_word: υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: मूल के संबंधवाचक बहुवचन का औपचारिक रूप सुरक्षित रखा गया है; यहाँ यह इस्राएली समुदाय का जातीय संबोधन है।
- source_word: ἰδού
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार को आधुनिक और प्रत्यक्ष हिन्दी में रखा गया है।
- source_word: δύναμις οὐδὲ κράτος
  choice: न तो बल है, न ही ... सामर्थ्य
  rationale: दो निकटार्थी सामर्थ्य-सूचक शब्दों का भेद हिन्दी में बल और सामर्थ्य द्वारा बनाए रखा गया है।
- source_word: εἰς παράταξιν ἰσχυράν
  choice: शक्तिशाली युद्ध-पंक्ति बनाने का
  rationale: παράταξις का सैनिक संदर्भ युद्ध के लिए व्यवस्थित पंक्ति या मोर्चाबंदी है; उद्देश्य/क्षमता का संबंध स्वाभाविक हिन्दी में व्यक्त किया गया है।
