base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/001.yaml
  text: And it was reported to Holofernes[a], the commander-in-chief of the forces of Assyria, that the sons of Israel had prepared for war, and had blocked the roads of the hill country and fortified every summit of every high mountain[b], and had set up obstacles in the plains.
translation:
  language: hi
  text: अश्शूर की सेना के प्रधान सेनापति होलोफेरनेस को यह समाचार दिया गया कि इस्राएलियों[a] ने युद्ध की तैयारी कर ली है, पहाड़ी प्रदेश के मार्गों को रोक दिया है, हर ऊँचे पहाड़ की चोटी को किलेबंद कर दिया है, और मैदानों में बाधाएँ[b] खड़ी कर दी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र”; यह इस्राएलियों के लिए प्रयुक्त एक प्रचलित जातीय पद है।
    reason: lexical_alternative
  - marker: b
    text: या “फंदे” अथवा “अवरोध”; यूनानी शब्द ऐसी वस्तु को दर्शा सकता है जो ठोकर खिलाए या फँसाए, पर यहाँ आशय सैन्य रक्षा के लिए रखी गई भौतिक बाधाओं से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: यह समाचार दिया गया
  rationale: यूनानी का कर्मवाच्य रूप सूचना पहुँचाए जाने को व्यक्त करता है और संदेशवाहक का उल्लेख नहीं करता; यह हिन्दी में स्वाभाविक कर्मवाच्य है।
- source_word: ἀρχιστρατήγῳ
  choice: प्रधान सेनापति
  rationale: यह पद सर्वोच्च सैन्य अधिकारी को दर्शाता है; ‘प्रधान सेनापति’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: δυνάμεως Ἀσσούρ
  choice: अश्शूर की सेना
  rationale: सैन्य प्रसंग में δύναμις का अर्थ सशस्त्र बल या सेना है; एकवचन ‘सेना’ हिन्दी में सहज सामूहिक अर्थ देता है।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएली
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यह एक प्रचलित जातीय पद है; ‘इस्राएली’ उसके आशय को स्वाभाविक और समावेशी हिन्दी में व्यक्त करता है।
- source_word: παρεσκευάσθησαν εἰς πόλεμον
  choice: युद्ध की तैयारी कर ली है
  rationale: वाक्य सूचना की विषयवस्तु बताता है; पूर्णता सूचक रूप पहले पूरी हो चुकी सैन्य तैयारी को स्पष्ट करता है।
- source_word: τὰς ὁδοὺς τῆς ὀρεινῆς συνέκλεισαν
  choice: पहाड़ी प्रदेश के मार्गों को रोक दिया है
  rationale: ὀρεινή पहाड़ी या पर्वतीय प्रदेश है और συνέκλεισαν यहाँ मार्ग बंद करने की रक्षात्मक कार्रवाई बताता है।
- source_word: ἐτείχισαν πᾶσαν κορυφὴν ὄρους ὑψηλοῦ
  choice: हर ऊँचे पहाड़ की चोटी को किलेबंद कर दिया है
  rationale: यह वितरक संरचना प्रत्येक ऊँचे पहाड़ की चोटी पर रक्षात्मक निर्माण का भाव देती है; ‘किलेबंद’ τειχίζω के सैन्य अर्थ को व्यक्त करता है।
- source_word: ἐν τοῖς πεδίοις σκάνδαλα
  choice: मैदानों में बाधाएँ
  rationale: σκάνδαλα मूलतः ठोकर या फँसाव उत्पन्न करने वाली वस्तुएँ हो सकती हैं; सैन्य प्रसंग में व्यापक ‘बाधाएँ’ उनके अनिश्चित भौतिक स्वरूप को बनाए रखता है।
theological_decisions:
- issue: οἱ υἱοὶ Ἰσραήλ का जातीय पद
  choice: इस्राएली
  alternative: इस्राएल के पुत्र / इस्राएल की संतान
  rationale: यहाँ वाक्यांश जैविक रूप से केवल पुरुष पुत्रों को सीमित नहीं करता, बल्कि पूरे जातीय समुदाय का पारंपरिक नाम है; मुख्य पाठ में स्वाभाविक अर्थ रखा गया और शाब्दिक रूप पादटिप्पणी में बताया गया।
- issue: σκάνδαλα का सैन्य अर्थ
  choice: बाधाएँ
  alternative: फंदे / अवरोध / ठोकर की वस्तुएँ
  rationale: प्रसंग भौतिक सैन्य रक्षा का है। ‘बाधाएँ’ बाद के रूपकात्मक या धर्मवैज्ञानिक अर्थ को आरोपित किए बिना यूनानी शब्द की अनिश्चितता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। सैन्य पदावली स्पष्ट रखी गई है। लंबे यूनानी वाक्य का क्रम यथासंभव सुरक्षित है, पर हिन्दी में स्वाभाविक प्रवाह हेतु संयोजन और क्रियारूप समायोजित किए गए हैं।
