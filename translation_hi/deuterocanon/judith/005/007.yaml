base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/007.yaml
  text: And formerly they lived as sojourners in Mesopotamia[a], because they were not willing to follow the gods of their fathers[b], who were in the land of the Chaldeans.
translation:
  language: hi
  text: और पहले वे मेसोपोटामिया में परदेशी होकर रहे[a], क्योंकि वे अपने पितरों के देवताओं के पीछे चलना नहीं चाहते थे, जो कसदियों के देश में थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेसोपोटामिया में परदेशी होकर रहे।” यूनानी क्रिया वहाँ विदेशी अथवा अस्थायी निवासी के रूप में रहने का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “जो कसदियों के देश में हो गए थे” या “अस्तित्व में आए थे” भी संभव है। “जो” का संबंध देवताओं से लिया जा सकता है, जैसा मुख्य पाठ में है; इसे पितरों से भी जोड़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: παρῴκησαν
  choice: परदेशियों के रूप में रहे
  rationale: यह क्रिया किसी स्थान में विदेशी या अस्थायी निवासी के रूप में रहने का भाव रखती है; केवल ‘रहे’ कहने से बाहरी व्यक्ति होने का भाव खो जाता।
- source_word: τὸ πρότερον
  choice: पहले
  rationale: यह कथानक के वर्तमान बिंदु से पूर्व के समय को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ Μεσοποταμίᾳ
  choice: मेसोपोटामिया में
  rationale: भौगोलिक नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: οὐκ ἐβουλήθησαν
  choice: नहीं चाहते थे
  rationale: मूल में इच्छा या अनिच्छा पर बल है; यह अनुवाद जानबूझकर किए गए चुनाव को व्यक्त करता है, पर ‘उन्होंने विद्रोह किया’ जैसी अधिक तीखी धारणा नहीं जोड़ता।
- source_word: ἀκολουθῆσαι
  choice: पीछे चलना
  rationale: धार्मिक निष्ठा के संदर्भ में भी मूल क्रिया ‘पीछे चलने’ की भाषा ही प्रयोग करती है; ‘पूजा करना’ अर्थ को अनावश्यक रूप से विशिष्ट बना देता।
- source_word: τοῖς θεοῖς τῶν πατέρων αὐτῶν
  choice: अपने पितरों के देवताओं
  rationale: ‘पितरों’ से वंशगत और पैतृक संबंध स्पष्ट रहता है और मूल के पुरुषवाची πατέρων का स्वरूप भी बना रहता है।
- source_word: οἳ ἐγένοντο ἐν γῇ Χαλδαίων
  choice: वे देवता कसदियों के देश में थे
  rationale: मुख्य पाठ में निकटतम व्याकरणिक पूर्वपद ‘देवताओं’ से संबंध लिया गया है और सहज हिन्दी के लिए ἐγένοντο को ‘थे’ किया गया है; यूनानी में संबंध ‘पितरों’ से भी समझा जा सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: पैतृक धर्म के त्याग को मूल से अधिक तीखा न बनाना
  choice: अपने पितरों के देवताओं के पीछे चलना नहीं चाहते थे
  alternative: अपने पूर्वजों के देवताओं की पूजा करने से उन्होंने इनकार कर दिया
  rationale: यूनानी पाठ अनिच्छा और पीछे चलने की बात करता है; वह यहाँ सीधे ‘पूजा’ की क्रिया या अधिक प्रबल विद्रोही शब्दावली नहीं अपनाता।
- issue: सापेक्ष उपवाक्य का संदर्भ
  choice: वे देवता कसदियों के देश में थे
  alternative: उनके पितर कसदियों के देश में हुए थे
  rationale: οἳ व्याकरण की दृष्टि से ‘देवताओं’ अथवा ‘पितरों’—दोनों से जुड़ सकता है। मुख्य पाठ निकटतम संभावित पूर्वपद को अपनाता है, जबकि वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पितर’, ‘देवता’ और ‘कसदियों का देश’ बाइबिलीय संदर्भ के अनुरूप हैं; वाक्य को स्वाभाविक बनाने के लिए अंतिम यूनानी सापेक्ष उपवाक्य को स्वतंत्र उपवाक्य के रूप में व्यक्त किया गया है।
