  yaml_path: translation/deuterocanon/judith/005/009.yaml
  text: And their God told them to go out from their sojourning and to go into the land of Canaan[a]; and they settled there[b], and became very wealthy in gold and silver and in very many livestock.
translation:
  language: hi
  text: और उनके परमेश्वर ने उनसे कहा कि वे अपने परदेशवास से निकलकर कनान देश में जाएँ[a]। वे वहाँ बस गए और उनके सोने-चाँदी और पशुधन में बहुत अधिक वृद्धि हुई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशवास’ का अर्थ परदेशियों के रूप में उनका निवास भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “वे सोने और चाँदी में और अत्यन्त अधिक पशुओं में बढ़ गए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... ἐξελθεῖν ... πορευθῆναι
  choice: ने उनसे कहा कि वे ... निकलकर ... जाएँ
  rationale: अनंत क्रियाओं के साथ εἶπεν यहाँ निर्देशात्मक कथन व्यक्त करता है। यह अनुवाद निर्देश का भाव रखता है, पर उसे स्पष्ट आदेश बनाकर अधिक प्रबल नहीं करता।
- source_word: παροικίας
  choice: परदेश में अपने निवास
  rationale: παροικία का आशय अपने देश से बाहर, परदेशी के रूप में निवास करना है। यह पद स्वाभाविक हिन्दी में उस परदेशी स्थिति को बनाए रखता है।
- source_word: γῆν Χανάαν
  choice: कनान देश
  rationale: γῆν को ‘देश’ से व्यक्त किया गया है और बाइबलीय भौगोलिक नाम ‘कनान’ सुरक्षित रखा गया है।
- source_word: κατῴκησαν
  choice: बस गए
  rationale: क्रिया वहाँ स्थायी रूप से निवास स्थापित करने का संकेत देती है; ‘बस गए’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἐπληθύνθησαν χρυσίῳ καὶ ἀργυρίῳ καὶ ἐν κτήνεσιν πολλοῖς σφόδρα
  choice: उनके सोने-चाँदी और पशुधन में बहुत अधिक वृद्धि हुई
  rationale: ἐπληθύνθησαν मूलतः बढ़ने या बहुत होने का भाव देता है। वस्तुओं के संदर्भ के कारण इसे केवल ‘धनी हो गए’ न बनाकर संपत्ति की वास्तविक वृद्धि के रूप में रखा गया है।
- source_word: κτήνεσιν
  choice: पशुधन
  rationale: κτήνη पालतू पशुओं की व्यापक श्रेणी है; ‘पशुधन’ इसे केवल गाय-बैल तक सीमित नहीं करता।
theological_decisions:
- issue: εἶπεν के साथ अनंत क्रियाओं में परमेश्वर के कथन का स्वरूप
  choice: परमेश्वर ने उनसे कहा कि वे निकलकर जाएँ
  alternative: परमेश्वर ने उन्हें निकलकर जाने की आज्ञा दी
  rationale: यूनानी में वचन निर्देशात्मक है, पर स्पष्ट ‘आज्ञा देना’ वाली क्रिया नहीं है। इसलिए निर्देश का बल रखा गया है और अनावश्यक रूप से उसे औपचारिक आज्ञा नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य अपनाया गया है। ‘परदेश में अपने निवास’ परदेशी होने की मूल धारणा रखता है; ‘पशुधन’ व्यापक और सामान्यतः बोधगम्य शब्द है।
