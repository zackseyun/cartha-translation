  yaml_path: translation/deuterocanon/judith/005/024.yaml
  text: Therefore we will indeed go up[a], and they will become food for all your army, master Holofernes.
translation:
  language: hi
  text: इसलिए निश्चय ही हम चढ़ाई करेंगे, और वे आपकी सारी सेना का ग्रास[a] बन जाएँगे, स्वामी होलोफेरनेस।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आहार’ अथवा ‘भक्षण की वस्तु’; यूनानी शब्द का शाब्दिक भाव ऐसी वस्तु है जिसे खा या निगल लिया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ δὴ
  choice: इसलिए निश्चय ही
  rationale: διό निष्कर्ष को और δή उस निष्कर्ष के दृढ़ बल को व्यक्त करता है; यह अनुवाद दोनों पक्षों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀναβησόμεθα
  choice: हम चढ़ाई करेंगे
  rationale: ἀναβαίνω का मूल अर्थ ऊपर जाना है, पर यहाँ सैन्य प्रसंग में आगे बढ़कर आक्रमण करने का भाव है; ‘चढ़ाई करेंगे’ स्थानगत और सैनिक दोनों अर्थों को समेटता है।
- source_word: ἔσονται εἰς
  choice: बन जाएँगे
  rationale: εἰμί के भविष्यकाल के साथ εἰς और कर्मकारक परिणामसूचक हैं; इसलिए केवल ‘होंगे’ की अपेक्षा ‘बन जाएँगे’ उपयुक्त है।
- source_word: κατάβρωμα
  choice: ग्रास
  rationale: यह शब्द खा या निगल ली जाने वाली वस्तु को दर्शाता है। ‘ग्रास’ मूल भक्षण-बिंब को संक्षिप्त और स्वाभाविक हिन्दी में रखता है तथा आसान शिकार का भाव भी दे सकता है।
- source_word: πάσης τῆς στρατειᾶς σου
  choice: आपकी सारी सेना का
  rationale: πάσης संपूर्णता और στρατειά सेना को व्यक्त करता है; ‘सारी सेना’ साधारण आधुनिक हिन्दी में पूर्ण बल का स्पष्ट संकेत देता है।
- source_word: δέσποτα
  choice: स्वामी
  rationale: δέσποτα अधिकार रखने वाले व्यक्ति के लिए सीधा संबोधन है। ‘स्वामी’ पदानुक्रम का भाव रखता है, पर इसे परमेश्वर-सूचक विशिष्ट उपाधि नहीं बनाता।
- source_word: Ὀλοφέρνη
  choice: होलोफेरनेस
  rationale: यूनानी नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: सीधे संबोधन में δέσποτα का अनुवाद
  choice: स्वामी
  alternative: प्रभु; अधिपति
  rationale: यहाँ शब्द κύριος नहीं, बल्कि δέσποτα है और एक सैन्य अधिकारी को संबोधित करता है। ‘स्वामी’ उसके अधिकार को व्यक्त करता है, बिना ऐसे धार्मिक अर्थ जोड़े जो यूनानी पाठ में आवश्यक नहीं हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सैन्य प्रसंग के अनुरूप रखी गई है। ‘चढ़ाई करेंगे’ और ‘ग्रास बन जाएँगे’ सामान्य पाठक के लिए स्वाभाविक हैं तथा यूनानी पाठ के स्थानगत, परिणामसूचक और भक्षण-संबंधी बिंबों को बनाए रखते हैं।
