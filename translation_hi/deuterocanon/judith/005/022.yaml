- source_word: ἐγόγγυσεν
  choice: कुड़कुड़ाने लगे
  rationale: यह दबे स्वर में असंतोष और विरोध प्रकट करने का भाव देता है, जो γογγύζω के अनुरूप है।
- source_word: πᾶς ὁ λαὸς ὁ κυκλῶν τὴν σκηνὴν καὶ περιστὼς
  choice: तंबू के चारों ओर खड़े सभी लोग
  rationale: दोनों यूनानी कृदंतों के स्थानगत भाव को संक्षिप्त, स्वाभाविक हिन्दी में समेटता है, बिना अलग-अलग समूह मानने के।
- source_word: οἱ μεγιστᾶνες Ὀλοφέρνου
  choice: होलोफेरनेस के सरदारों
  rationale: μεγιστᾶνες के उच्च पदस्थ प्रमुख व्यक्तियों के अर्थ को सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: οἱ κατοικοῦντες τὴν παραλίαν καὶ τὴν Μωὰβ
  choice: समुद्र-तट तथा मोआब में रहनेवाले सभी लोगों
  rationale: दोनों भौगोलिक क्षेत्रों को स्पष्ट रखता है और κατοικοῦντες के निवास-संबंधी अर्थ को स्वाभाविक हिन्दी देता है।
- source_word: συγκόψαι αὐτόν
  choice: उसे मार गिराया जाए
  rationale: यह हिंसक प्रहार के अर्थ को सुरक्षित रखता है, पर प्रहार के सटीक ढंग को निश्चित नहीं करता।
