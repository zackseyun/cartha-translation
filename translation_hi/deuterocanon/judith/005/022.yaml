  yaml_path: translation/deuterocanon/judith/005/022.yaml
  text: And it happened[a], when Achior had stopped speaking these words, that all the people around the tent and standing about began to grumble, and the nobles of Holofernes and all who lived by the seacoast and in Moab said to strike him down.
translation:
  language: hi
  text: जब अखियोर ये बातें कह चुका था, तब तंबू के चारों ओर खड़े सभी लोग बड़बड़ाने लगे। होलोफेरनेस के सरदारों और समुद्र-तट तथा मोआब में रहनेवाले सभी लोगों ने कहा कि उसे मार गिराया जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “उसे काट गिराया जाए” या “उसे मार डाला जाए” भी हो सकता है। यूनानी शब्द συγκόψαι हिंसक कार्रवाई बताता है, पर उसका ठीक तरीका पूरी तरह स्पष्ट नहीं करता।
    reason: lexical_alternative
