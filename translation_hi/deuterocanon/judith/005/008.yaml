base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/008.yaml
  text: They departed from the way of their fathers and worshiped the God of heaven[a], the God whom they had come to know. And they were driven out from before their gods, and fled to Mesopotamia[b], and lived there as foreigners for many days.
translation:
  language: hi
  text: वे अपने पुरखों की राह से हट गए और स्वर्ग के परमेश्वर की आराधना की—उस परमेश्वर की, जिसे वे जान गए थे।[a] तब लोगों ने उन्हें उनके देवताओं के सामने से निकाल दिया,[b] और वे मेसोपोटामिया भाग गए और बहुत दिनों तक वहाँ परदेशी बनकर रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे उन्होंने पहचान लिया था।” यूनानी शब्द जान लेने के साथ-साथ निर्णायक रूप से पहचान लेने पर भी बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में यह वाक्य संक्षिप्त है: निकालने वाले लोग स्पष्ट रूप से नामित नहीं हैं, और वाक्य का शाब्दिक रूप है, “उन्होंने उन्हें उनके देवताओं के सामने से निकाल दिया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξέβησαν ἐξ ὁδοῦ τῶν γονέων αὐτῶν
  choice: वे अपने पुरखों की राह से हट गए
  rationale: यूनानी मुहावरे में पैतृक ‘राह’ से निकलने का रूपक है। ‘राह से हट गए’ उस रूपक और पैतृक धार्मिक आचरण छोड़ने के आशय—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προσεκύνησαν
  choice: आराधना की
  rationale: इस धार्मिक संदर्भ में क्रिया केवल शारीरिक रूप से झुकने के बजाय उपासना को व्यक्त करती है।
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: स्वर्ग के परमेश्वर
  rationale: यह बाइबलीय उपाधि का सीधा, परिचित और गरिमापूर्ण हिन्दी रूप है।
- source_word: θεῷ ᾧ ἐπέγνωσαν
  choice: उस परमेश्वर की, जिसे वे जान गए थे
  rationale: ἐπιγινώσκω यहाँ जानने या पहचान लेने की निर्णायक घटना का संकेत दे सकता है। ‘जान गए थे’ इस अर्थ को सहज रूप से व्यक्त करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐξέβαλον αὐτοὺς ἀπὸ προσώπου τῶν θεῶν αὐτῶν
  choice: लोगों ने उन्हें उनके देवताओं के सामने से निकाल दिया
  rationale: यूनानी में सक्रिय बहुवचन कर्ता स्पष्ट नामित नहीं है और सर्वनाम-संबंध संक्षिप्त है। हिन्दी में अनिर्दिष्ट ‘लोगों ने’ सक्रिय वाच्य और निष्कासन का भाव रखता है; कठिन मूल रचना पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἔφυγον εἰς Μεσοποταμίαν
  choice: वे मेसोपोटामिया भाग गए
  rationale: ἔφυγον दबाव में पलायन को बताता है; ‘भाग गए’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: παρῴκησαν ἐκεῖ ἡμέρας πολλάς
  choice: बहुत दिनों तक वहाँ परदेशी बनकर रहे
  rationale: παροικέω में केवल रहने का नहीं, परदेशी के रूप में अस्थायी निवास करने का सामाजिक भाव भी है; ‘परदेशी बनकर रहे’ इसे सुरक्षित रखता है।
theological_decisions:
- issue: पैतृक धार्मिक मार्ग से हटकर स्वर्ग के परमेश्वर की आराधना
  choice: पाठ के अपने शब्दचित्र—पुरखों की राह से हटना और स्वर्ग के परमेश्वर की आराधना करना—को बनाए रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘उन्होंने अपने पुरखों का धर्म त्याग दिया’ कहा जा सकता था।
  rationale: ‘धर्म त्याग’ या बाद की धर्मवैज्ञानिक शब्दावली मूल में स्पष्ट नहीं है। अनुवाद वास्तविक धार्मिक परिवर्तन को दिखाता है, पर उसे किसी विशिष्ट सांप्रदायिक ढाँचे में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पुरखे’, ‘आराधना’, ‘परदेशी’ और ‘मेसोपोटामिया’ सामान्य बाइबलीय प्रयोग के अनुरूप हैं। सर्वनाम-संकुचन के कारण उत्पन्न मूल यूनानी अस्पष्टता को मुख्य पाठ में अनावश्यक रूप से उलझाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
