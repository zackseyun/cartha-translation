- source_word: ὁ λαὸς οὗτός
  choice: ये लोग
  rationale: λαός यहाँ एक सामूहिक जातीय समुदाय को सूचित करता है। आधुनिक हिन्दी में ‘ये लोग’ οὗτός के संकेतार्थ को स्वाभाविक रूप से बनाए रखता है; ‘यह प्रजा’ अधिक राजकीय और ‘यह जाति’ अनावश्यक रूप से वर्गीकरणात्मक लग सकता है।
- source_word: εἰσιν
