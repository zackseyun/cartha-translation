base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/012.yaml
  text: And they cried out to their God[a], and he struck the land of Egypt with plagues for which there was no healing; and the Egyptians drove them out from before them.
translation:
  language: hi
  text: और उन्होंने अपने परमेश्वर की दुहाई दी, और उसने मिस्र देश को ऐसी विपत्तियों से मारा जिनका कोई उपचार न था; और मिस्रियों ने उन्हें उनके सामने से[a] निकाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनकी उपस्थिति से’ अथवा ‘उनके पास से।’ यूनानी में ‘उनके सामने से’ निष्कासन के लिए प्रयुक्त सामी मुहावरे का शाब्दिक रूप है। संदर्भ में ‘उनके’ का अर्थ संभवतः मिस्रियों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν
  choice: दुहाई दी
  rationale: यह क्रिया ऊँचे स्वर में संकट के समय की गई पुकार या विनती दर्शाती है। ‘दुहाई दी’ परमेश्वर से सहायता की तीव्र पुकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπάταξεν
  choice: मारा
  rationale: मूल क्रिया का अर्थ प्रहार करना है। यहाँ कर्ता परमेश्वर है और साधन विपत्तियाँ हैं; ‘मारा’ क्रिया की शक्ति और दिव्य कार्रवाई को बिना पुरातन भाषा के बनाए रखता है।
- source_word: γῆν Αἴγυπτον
  choice: मिस्र देश
  rationale: γῆ यहाँ मिस्र के भूभाग या देश को सूचित करता है। ‘मिस्र देश’ ठोस भौगोलिक अर्थ को स्पष्ट और संक्षिप्त रूप से रखता है।
- source_word: πληγαῖς
  choice: विपत्तियों से
  rationale: निर्गमन की पृष्ठभूमि में यह शब्द परमेश्वर की ओर से आए प्रहारों या विपत्तियों को दर्शाता है। ‘विपत्तियाँ’ व्यापक अर्थ को बनाए रखता है और केवल रोगजन्य महामारियों तक सीमित नहीं करता।
- source_word: ἐν αἷς οὐκ ἦν ἴασις
  choice: जिनका कोई उपचार न था
  rationale: ἴασις का अर्थ उपचार या चंगाई है। यह रूपक मूल की उपचार-संबंधी भाषा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξέβαλον
  choice: निकाल दिया
  rationale: क्रिया बलपूर्वक बाहर करने या निष्कासित करने का भाव रखती है। संदर्भ में ‘निकाल दिया’ सहज है और मिस्र से इस्राएलियों के निष्कासन को व्यक्त करता है।
- source_word: ἀπὸ προσώπου αὐτῶν
  choice: अपने सामने से
  rationale: यह यूनानी में सुरक्षित सामी मुहावरा है, जिसका आशय अपनी उपस्थिति से दूर निकालना है। ‘अपने सामने से’ मूल बिंब और उसकी हल्की असामान्यता को बनाए रखता है।
theological_decisions:
- issue: अंतिम सर्वनाम αὐτῶν का संदर्भ
  choice: '‘अपने’ को मिस्रियों से संबंधित माना गया है: मिस्रियों ने इस्राएलियों को अपनी उपस्थिति से निकाल दिया।'
  alternative: व्याकरण की दृष्टि से इसे इस्राएलियों की उपस्थिति के संदर्भ में समझना अलग से संभव माना जा सकता है।
  rationale: निकटतम स्पष्ट कर्ता ‘मिस्री’ हैं और निष्कासन का सामी मुहावरा सामान्यतः निष्कासित करने वालों की उपस्थिति को सूचित करता है। फिर भी पादटिप्पणी मुहावरे का आशय स्पष्ट करती है, बिना मूल अभिव्यक्ति को मुख्य पाठ से हटाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दुहाई दी’ संकट में परमेश्वर से की गई तीव्र पुकार को व्यक्त करता है; ‘विपत्तियाँ’ निर्गमन-संदर्भ को बनाए रखते हुए अर्थ को केवल महामारी तक सीमित नहीं करता। पादटिप्पणी-चिह्न उस अंतिम वाक्यांश पर लगाया गया है जिसकी वह व्याख्या करता है।
