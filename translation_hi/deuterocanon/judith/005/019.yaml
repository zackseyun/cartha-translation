  yaml_path: translation/deuterocanon/judith/005/019.yaml
  text: And now[a], having turned back to their God, they came up from the dispersion where they had been scattered there, took possession of Jerusalem, where their sanctuary was, and settled in the hill country[b], because it had been deserted.
translation:
  language: hi
  text: और अब, अपने परमेश्वर की ओर लौटकर, वे उन स्थानों से ऊपर आए जहाँ वे तितर-बितर किए गए थे। उन्होंने यरूशलेम पर अधिकार कर लिया, जहाँ उनका पवित्रस्थान था, और पहाड़ी प्रदेश में बस गए, क्योंकि वह उजाड़ पड़ा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: अपने परमेश्वर की ओर फिरकर
  rationale: यह यूनानी वाक्यांश दिशा बदलने के रूपक के साथ अपने परमेश्वर के प्रति निष्ठा में लौटने का भाव रखता है; यह औपचारिक ‘धर्म-परिवर्तन’ का अर्थ नहीं थोपता।
- source_word: ἀνέβησαν
  choice: ऊपर आए
  rationale: क्रिया का मूल अर्थ ऊपर चढ़ना या ऊपर आना है और यहाँ भूगोल-संबंधी आरोहण का भाव सुरक्षित रहता है।
- source_word: ἐκ τῆς διασπορᾶς οὗ διεσπάρησαν ἐκεῖ
  choice: उन बिखरे हुए स्थानों से ... जहाँ वे तितर-बितर किए गए थे
  rationale: ‘बिखराव’ और वहाँ तितर-बितर किए जाने—दोनों भावों को स्वाभाविक हिन्दी में रखा गया है; यूनानी की स्थानवाचक पुनरुक्ति का अर्थ सुरक्षित है, पर असहज शब्दशः दोहराव नहीं किया गया।
- source_word: κατέσχον
  choice: अधिकार कर लिया
  rationale: यह ग्रहण करके अपने नियंत्रण या अधिकार में रखने का भाव व्यक्त करता है, बिना अनावश्यक रूप से आधुनिक सैन्य अर्थ जोड़ने के।
- source_word: τὸ ἁγίασμα
  choice: पवित्रस्थान
  rationale: यह पवित्र किए गए स्थान को दर्शाता है; ‘पवित्रस्थान’ पर्याप्त विशिष्ट है, पर यूनानी से अधिक संस्थागत विवरण नहीं जोड़ता।
- source_word: κατῳκίσθησαν
  choice: बस गए
  rationale: रूप निष्क्रिय होते हुए भी संदर्भ में निवास स्थापित करने का स्वाभाविक अर्थ देता है; आधुनिक हिन्दी में ‘बस गए’ सहज है।
- source_word: ἐν τῇ ὀρεινῇ
  choice: पहाड़ी प्रदेश में
  rationale: यह मानक भौगोलिक अभिव्यक्ति है और हिन्दी पाठक के लिए स्पष्ट तथा स्वाभाविक है।
- source_word: ὅτι ἦν ἔρημος
  choice: क्योंकि वह उजाड़ पड़ा था
  rationale: ἔρημος उजाड़, निर्जन या परित्यक्त होने का अर्थ दे सकता है। ‘उजाड़ पड़ा था’ इस अर्थ-व्याप्ति को कुछ हद तक खुला रखता और पूर्व अवस्था को व्यक्त करता है।
theological_decisions:
- issue: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν में परमेश्वर के साथ नवीकृत संबंध का भाव
  choice: अपने परमेश्वर की ओर फिरकर
  alternative: अपने परमेश्वर के पास लौटकर
  rationale: चुना हुआ पाठ पश्चात्ताप अथवा निष्ठा में वापसी की दिशात्मक छवि बनाए रखता है, पर किसी नए देवता को अपनाने या बाद की औपचारिक धर्मशास्त्रीय शब्दावली का अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और कथात्मक शैली। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। इस मसौदे में कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि प्रमुख अर्थगत विकल्प मुख्य पाठ में स्वाभाविक रूप से व्यक्त हैं।
