base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/020.yaml
  text: And now[a], master lord, if indeed there is an offense in this people and they are sinning against their God, and if we ascertain that this stumbling block is among them, then we will go up and make war against them;
translation:
  language: hi
  text: और अब, हे स्वामी, हे प्रभु, यदि इस प्रजा में कोई अपराध[a] है और वे अपने परमेश्वर के विरुद्ध पाप कर रहे हैं, और हम जाँच करके यह जान लें कि ठोकर का यह कारण उनमें है, तो हम चढ़ाई करेंगे और उनके विरुद्ध युद्ध करेंगे;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूल” अथवा “अनजाने में किया गया पाप”; यूनानी शब्द में अज्ञानवश किए गए गलत काम का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα κύριε
  choice: हे स्वामी प्रभु
  rationale: दोनों संबोधन शब्दों को बनाए रखता है और होलोफेरनेस के प्रति आदरपूर्ण, emphatic संबोधन व्यक्त करता है; यहाँ ‘प्रभु’ को परमेश्वर के विशिष्ट नाम के रूप में नहीं लिया गया है।
- source_word: ἀγνόημα
  choice: अपराध
  rationale: यह किसी दोषपूर्ण या पापमय काम को व्यक्त करता है, पर उसकी जानबूझकर या अनजाने में की गई प्रकृति को मुख्य पाठ में निश्चित नहीं करता।
- source_word: ἁμαρτάνουσιν εἰς τὸν θεὸν αὐτῶν
  choice: वे अपने परमेश्वर के विरुद्ध पाप कर रहे हैं
  rationale: वर्तमानकालीन, जारी क्रिया और पाप के परमेश्वर के विरुद्ध निर्देशित होने—दोनों को स्पष्ट करता है।
- source_word: ἐπισκεψόμεθα
  choice: हम जाँच करके जान लें
  rationale: क्रिया के जाँच-पड़ताल कर तथ्य निश्चित करने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σκάνδαλον
  choice: ठोकर का कारण
  rationale: मूल रूपक को बनाए रखते हुए ऐसी दोषपूर्ण बात का संकेत देता है जो उनके पतन का कारण बन सकती है।
- source_word: ἀναβησόμεθα
  choice: हम चढ़ाई करेंगे
  rationale: सैन्य संदर्भ में ऊपर बढ़ने और आक्रमण के लिए कूच करने के दोनों भावों को सहज हिन्दी में समेटता है।
- source_word: ἐκπολεμήσομεν
  choice: उनके विरुद्ध युद्ध करेंगे
  rationale: साधारण लड़ाई की अपेक्षा संगठित सैन्य कार्रवाई का सशक्त भाव व्यक्त करता है।
theological_decisions:
- issue: दोहरे संबोधन δέσποτα κύριε का अनुवाद
  choice: हे स्वामी प्रभु
  alternative: हे प्रभु; हे सर्वाधिकारी स्वामी
  rationale: संबोधन होलोफेरनेस से है, इस्राएल के परमेश्वर से नहीं। दोनों यूनानी पदों को बनाए रखना वक्तृता का जोर सुरक्षित रखता है, जबकि प्रसंग इसे दिव्य नाम समझने से रोकता है।
- issue: ἀγνόημα में अज्ञान या अनजानेपन की संभावित छाया
  choice: मुख्य पाठ में ‘अपराध’, पादटिप्पणी में ‘भूल’ अथवा ‘अनजाने में किया गया पाप’
  alternative: मुख्य पाठ में ‘अनजाने में किया गया पाप’
  rationale: यूनानी शब्द दोष के साथ अज्ञान की संभावना भी रखता है, किंतु उसे निश्चित रूप से अनजाना पाप कहना मूल की अस्पष्टता को अधिक सुलझा देगा।
- issue: σκάνδαλον का धार्मिक और परिणामसूचक रूपक
  choice: ठोकर का कारण
  alternative: फंदा; पतन का कारण; अपराध
  rationale: रूपक और संभावित धार्मिक प्रतिध्वनि सुरक्षित रहती है, बिना इसे केवल सामान्य अपराध या निश्चित दैवी दंड बना देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण सैन्य-राजकीय संबोधन रखा गया है। वाक्य की लंबी शर्तात्मक संरचना और अंत का अर्धविराम अगले पद से इसके संबंध को बनाए रखते हैं। ‘परमेश्वर’ इस्राएल के ईश्वर के लिए और ‘स्वामी प्रभु’ मानवीय अधिकारी होलोफेरनेस के संबोधन के लिए प्रयुक्त है।
