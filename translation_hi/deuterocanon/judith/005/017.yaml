base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/017.yaml
  text: And as long as they did not sin before their God[a], good things were with them[b], because a God who hates injustice is with them.
translation:
  language: hi
  text: और जब तक उन्होंने अपने परमेश्वर के सामने पाप नहीं किया, तब तक उनका भला होता रहा,[a] क्योंकि अन्याय से घृणा करनेवाला परमेश्वर उनके साथ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अच्छी वस्तुएँ उनके साथ थीं”; अर्थात उनकी दशा अच्छी थी या उनका कुशल-मंगल होता रहा।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἕως
  choice: और जब तक ... तब तक
  rationale: यह निरंतर बनी रहनेवाली समयगत शर्त को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐχ ἥμαρτον
  choice: उन्होंने ... पाप नहीं किया
  rationale: नकार सहित यूनानी एओरिस्ट की सरल भूतकालीन क्रिया को बिना पक्षगत अर्थ बढ़ाए सुरक्षित रखता है।
- source_word: ἐνώπιον τοῦ θεοῦ αὐτῶν
  choice: अपने परमेश्वर के सामने
  rationale: ἐνώπιον का उपस्थिति और नैतिक मूल्यांकन—दोनों से जुड़ा अर्थ बनाए रखता है।
- source_word: ἦν μετʼ αὐτῶν τὰ ἀγαθά
  choice: उनका भला होता रहा
  rationale: शाब्दिक रूप से 'अच्छी वस्तुएँ उनके साथ थीं' है; चुना हुआ रूप अनुकूल दशा और कुशल-मंगल का व्यापक भाव स्वाभाविक हिन्दी में देता है, बिना उसे केवल धन-संपन्नता तक सीमित किए।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह उनके भले का कारण स्पष्ट करता है।
- source_word: θεὸς μισῶν ἀδικίαν
  choice: अन्याय से घृणा करनेवाला परमेश्वर
  rationale: θεός के गुणात्मक बल को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; अनिश्चितता-सूचक 'एक परमेश्वर' बहुदेववादी अर्थ का भ्रम पैदा कर सकता है।
- source_word: ἀδικίαν
  choice: अन्याय
  rationale: यह शब्द के व्यापक नैतिक और न्याय-संबंधी अर्थ को बनाए रखता है और अनावश्यक पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: μετʼ αὐτῶν ἐστίν
  choice: उनके साथ है
  rationale: यूनानी के वर्तमान काल को सुरक्षित रखता है, जो पिछले वर्णन से परमेश्वर के स्थायी चरित्र और संबंध की ओर संकेत करता है।
theological_decisions:
- issue: ἦν और ἐστίν के बीच काल-परिवर्तन
  choice: पहले खंड में भूतकालीन 'होता रहा', अंतिम खंड में वर्तमान 'है' रखा गया।
  alternative: अंतिम खंड को भी 'था' कर देना।
  rationale: मूल यूनानी भूतकाल से वर्तमान काल में बदलता है। इसे बनाए रखने से परमेश्वर के चरित्र और साथ होने के स्थायी कथन को चुपचाप केवल अतीत तक सीमित नहीं किया जाता।
- issue: अनिर्दिष्ट θεός का हिन्दी रूप
  choice: अन्याय से घृणा करनेवाला परमेश्वर
  alternative: एक ऐसा परमेश्वर जो अन्याय से घृणा करता है
  rationale: यूनानी में बल परमेश्वर के गुण पर है, संख्या पर नहीं। हिन्दी में 'एक परमेश्वर' अनचाहा बहुदेववादी संकेत दे सकता है; विशेषणात्मक पदबंध गुणात्मक बल सुरक्षित रखता है।
- issue: ἀδικία का अनुवाद
  choice: अन्याय
  alternative: अधर्म; बुराई; गलत काम
  rationale: नैतिक और न्याय-संबंधी विस्तार को बनाए रखते हुए बाद की किसी विशिष्ट धर्मवैज्ञानिक शब्दावली को यहाँ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। 'उनका भला होता रहा' τὰ ἀγαθά की व्यापकता को रखता है और 'समृद्धि' की अपेक्षा अर्थ को केवल आर्थिक सफलता तक सीमित नहीं करता।
