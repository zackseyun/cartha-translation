  text: And they drove out from before them the Canaanite[a], the Perizzite, the Jebusite, the Shechemite, and all the Girgashites, and they lived in it for many days.
translation:
  language: hi
  text: और उन्होंने अपने सामने से कनानियों, परिज्जियों, यबूसियों, शकेम[a] और सभी गिरगाशियों को निकाल दिया; और वे उस देश में बहुत दिनों तक बसे रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘शकेम’ है। जातियों की इस सूची में इसका आशय शकेम नगर या शकेम के लोग हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλον
  choice: निकाल दिया
  rationale: यह क्रिया बलपूर्वक हटाने या खदेड़ने का भाव रखती है। ‘निकाल दिया’ आधुनिक हिन्दी में स्वाभाविक है और कथन की कठोरता को कम नहीं करता।
- source_word: ἐκ προσώπου αὐτῶν
  choice: अपने सामने से
  rationale: यह सामी प्रभाव वाला मुहावरा उनके सामने या उनकी उपस्थिति से हटाए जाने का अर्थ देता है। हिन्दी में ‘अपने सामने से’ मूल बिंब को समझने योग्य रूप में बनाए रखता है।
- source_word: τὸν Χαναναῖον καὶ τὸν Φερεζαῖον καὶ τὸν Ἰεβουσαῖον
  choice: कनानियों, परिज्जियों, यबूसियों
  rationale: यूनानी में एकवचन जातिनाम सामूहिक अर्थ में हैं। हिन्दी में इन जनसमूहों के लिए बहुवचन अधिक स्वाभाविक और स्पष्ट है।
- source_word: τὸν Συχέμ
  choice: शकेम[a]
  rationale: यूनानी रूप सीधे ‘शकेम’ है और जातिनामों की सूची में असामान्य है। इसे केवल ‘शकेम के लोग’ बनाकर अस्पष्टता मिटाने के बजाय नाम को ज्यों का त्यों रखा गया है और टिप्पणी में सम्भावनाएँ बताई गई हैं।
- source_word: πάντας τοὺς Γεργεσαίους
  choice: सभी गिरगाशियों
  rationale: πάντας तथा बहुवचन जातिनाम का सीधा और स्वाभाविक हिन्दी रूप ‘सभी गिरगाशियों’ है।
- source_word: κατῴκησαν
  choice: बसे रहे
  rationale: क्रिया निवास करने और बस जाने—दोनों का भाव दे सकती है। ‘बसे रहे’ आरम्भिक बसावट और लगातार निवास, दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐν αὐτῇ
  choice: उस देश में
  rationale: स्त्रीलिंग सर्वनाम का स्वाभाविक संदर्भ पहले उल्लिखित भूमि है। हिन्दी में केवल ‘उसमें’ अस्पष्ट होता, इसलिए संदर्भ को स्पष्ट करने हेतु ‘उस देश में’ कहा गया है।
- source_word: ἡμέρας πολλάς
  choice: बहुत दिनों तक
  rationale: यह अवधि सूचक प्रयोग है। ‘बहुत दिनों तक’ मूल के ‘बहुत दिन’ को बनाए रखते हुए सहज हिन्दी देता है।
theological_decisions:
- issue: विजय और पूर्व निवासियों को हटाने के कथन की कठोरता
  choice: निकाल दिया; फिर वे उस देश में बहुत दिनों तक बसे रहे
  alternative: वहाँ से हटाया और लंबे समय तक वहाँ रहे
  rationale: अनुवाद पूर्व निवासियों के निष्कासन और इस्राएलियों के बाद के निवास के ऐतिहासिक दावे को बिना नरम किए या अतिरिक्त धार्मिक औचित्य जोड़े प्रस्तुत करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। जातिनामों को हिन्दी के स्वाभाविक सामूहिक बहुवचन में रखा गया है। ‘शकेम’ की वास्तविक पाठगत अस्पष्टता मुख्य पाठ और पादटिप्पणी में सुरक्षित है।
