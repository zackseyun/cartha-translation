  text: And the king of Egypt rose up against them[a], and they dealt shrewdly with them in toil and brickmaking; they humbled them and made them servants.
translation:
  language: hi
  text: और मिस्र का राजा उनके विरुद्ध उठ खड़ा हुआ, और मिस्रियों ने उनके साथ कठोर श्रम और ईंटें बनाने के काम में चालाकी से व्यवहार किया[a]; उन्होंने उन्हें दबाया और दास बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उनके साथ कपट से व्यवहार किया” या “उन्होंने उन्हें चतुराई से वश में किया”; यूनानी क्रिया सोची-समझी, चालाक या कपटपूर्ण नीति अपनाने का भाव देती है।
    reason: lexical_alternative
