  verdict: revise
  source_fidelity: The draft accurately conveys the king's hostile action, the calculated treatment connected with forced labor and brickwork, humiliation, and enslavement. However, following the singular noun “राजा” with “उन्होंने” is potentially read in modern Hindi as an honorific singular referring back to the king, whereas the Greek switches to a genuine plural subject. Naming the plural as “मिस्रियों” safely preserves that distinction.
  naturalness: “धूर्तता से व्यवहार किया” is understandable but somewhat stiff in this context; “चालाकी से व्यवहार किया” is more idiomatic while retaining the calculated/crafty sense. “उन्हें दबाया” is more natural modern Hindi than “उन्हें दीन किया” for oppressive humbling.
  terminology: “दास” correctly represents the salient enslaved status conveyed by δούλους. “ईंटें बनाने का काम” naturally expresses πλίνθῳ in this forced-labor context without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: Plural subject after “मिस्र का राजा” is ambiguous in Hindi.
    rationale: “उन्होंने” may function as an honorific singular for “राजा,” but κατεσοφίσαντο is plural and is not the preceding singular king. “मिस्रियों ने” makes the source's number change clear.
  - severity: low
    issue: “धूर्तता से व्यवहार किया” and “दीन किया” are less natural choices for modern standard Hindi.
    rationale: “चालाकी से व्यवहार किया” retains the lexical ambiguity of calculated/crafty treatment, and “दबाया” naturally conveys oppressive humbling in the immediate context.
  revised_text: और मिस्र का राजा उनके विरुद्ध उठ खड़ा हुआ, और मिस्रियों ने उनके साथ कठोर श्रम और ईंटें बनाने के काम में चालाकी से व्यवहार किया[a]; उन्होंने उन्हें दबाया और दास बना दिया।
