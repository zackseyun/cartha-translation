  yaml_path: translation/deuterocanon/judith/005/003.yaml
  text: And he said to them, “Tell me, then, sons of Canaan, who is this people that dwells in the hill country, and which cities they inhabit, and the size of their military force, and in what their power and their strength consist, and who has risen over them as king, leading their army.”
translation:
  language: hi
  text: और उसने उनसे कहा, “तो मुझे बताओ, हे कनान के पुत्रों[a], यह कौन-से लोग हैं जो पहाड़ी प्रदेश में रहते हैं[b], वे किन नगरों में बसते हैं, उनकी सैन्य-शक्ति कितनी बड़ी है[c], उनका सामर्थ्य और बल किसमें निहित है, और कौन राजा उनके ऊपर उठ खड़ा हुआ है और उनकी सेना का नेतृत्व कर रहा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे कनानियो।” यूनानी में शाब्दिक रूप से “कनान के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: या “जो पर्वतीय क्षेत्र में बसे हैं।” यूनानी में शाब्दिक रूप से “जो पहाड़ी प्रदेश में बैठे हैं” है; यहाँ ‘बैठना’ निवास करने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “उनकी सेना की संख्या कितनी है” अथवा “उनका सैन्य बल कितना विस्तृत है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγγείλατέ δή μοι
  choice: तो मुझे बताओ
  rationale: आज्ञार्थक क्रिया सीधे विवरण माँगती है; δή के संवादगत बल को स्वाभाविक हिन्दी में ‘तो’ से व्यक्त किया गया है।
- source_word: υἱοὶ Χαναάν
  choice: हे कनान के पुत्रो
  rationale: यूनानी का शाब्दिक संबोधन सुरक्षित रखा गया है; आशय ‘कनानी लोगो’ भी हो सकता है।
- source_word: ὁ λαὸς οὗτος
  choice: यह कौन-से लोग हैं
  rationale: λαός एक सामूहिक जनसमुदाय को सूचित करता है। हिन्दी में बहुवचन-संगति अधिक स्वाभाविक है, यद्यपि यूनानी रूप एकवचन सामूहिक है।
- source_word: ὁ καθήμενος ἐν τῇ ὀρεινῇ
  choice: जो पहाड़ी प्रदेश में रहते हैं
  rationale: καθήμενος का शाब्दिक अर्थ ‘बैठा हुआ’ है, पर यहाँ निवास करने का मुहावरेदार अर्थ है; ὀρεινή को ‘पहाड़ी प्रदेश’ कहा गया है।
- source_word: αἱ κατοικοῦσιν πόλεις
  choice: वे किन नगरों में बसते हैं
  rationale: वाक्य-विन्यास असामान्य है, पर प्रसंग नगरों के विषय में पूछताछ का है; ‘बसते हैं’ κατοικέω के स्थायी निवास के भाव को दर्शाता है।
- source_word: τὸ πλῆθος τῆς δυνάμεως αὐτῶν
  choice: उनकी सैन्य-शक्ति कितनी बड़ी है
  rationale: सैन्य जाँच के प्रसंग में δύναμις सशस्त्र बल को और πλῆθος उसकी संख्या अथवा विस्तार को सूचित करता है।
- source_word: κράτος καὶ ἰσχύς
  choice: सामर्थ्य और बल
  rationale: दो निकटार्थी यूनानी शब्दों की आलंकारिक द्विरुक्ति को दो पृथक हिन्दी शब्दों से बनाए रखा गया है।
- source_word: ἐν τίνι
  choice: किसमें निहित है
  rationale: यह उनकी शक्ति के आधार या स्रोत के विषय में पूछता है; ‘निहित है’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνέστηκεν ἐπʼ αὐτῶν βασιλεὺς
  choice: उनका राजा बनकर उनके ऊपर उठ खड़ा हुआ है
  rationale: ἀνέστηκεν की ‘उठ खड़ा हुआ’ छवि और ἐπʼ αὐτῶν का ‘उनके ऊपर’ संबंध सुरक्षित रखा गया है; इसे केवल ‘शासन करता है’ कहकर अधिक निश्चित नहीं बनाया गया।
- source_word: ἡγούμενος στρατιᾶς αὐτῶν
  choice: उनकी सेना का नेतृत्व कर रहा है
  rationale: कृदंत राजा की साथ-साथ चल रही सैन्य नेतृत्व-भूमिका बताता है।
