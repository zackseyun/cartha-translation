base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/018.yaml
  text: But when they turned away from the path that he had appointed for them[a], they were utterly destroyed in many wars, to a very great extent[b], and they were taken captive into a land not their own, and the temple of their God was laid level with the ground, and their cities were seized by their adversaries.
translation:
  language: hi
  text: परन्तु जब वे उस मार्ग से हट गए जिसे उसने उनके लिए ठहराया था[a], तब वे अनेक युद्धों में अत्यन्त बड़े पैमाने पर नष्ट किए गए[b]; वे बंदी बनाकर ऐसे देश में ले जाए गए जो उनका अपना नहीं था; उनके परमेश्वर का मंदिर धरती के बराबर कर दिया गया; और उनके नगर उनके विरोधियों के अधिकार में आ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मार्ग’ का अर्थ यहाँ शाब्दिक सड़क नहीं, बल्कि परमेश्वर द्वारा उनके लिए ठहराया गया जीवन-आचरण का मार्ग है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में एक प्रबल अभिव्यक्ति है, जो विनाश की अत्यधिक व्यापकता या भीषणता पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστησαν ἀπὸ τῆς ὁδοῦ
  choice: मार्ग से हट गए
  rationale: यह प्रयोग निर्धारित जीवन-पथ से विचलित होने का अर्थ देता है। ‘हट गए’ नैतिक-धार्मिक भाव को व्यक्त करता है, पर औपचारिक धर्मत्याग का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἧς διέθετο αὐτοῖς
  choice: जिसे उसने उनके लिए ठहराया था
  rationale: मध्यवाच्य क्रिया यहाँ उनके लिए परमेश्वर द्वारा मार्ग नियत या निर्धारित किए जाने को दर्शाती है। ‘ठहराया’ वर्तमान मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐξωλεθρεύθησαν
  choice: उनका ... विनाश हुआ
  rationale: क्रिया का प्रबल विनाशकारी भाव सुरक्षित है। हिन्दी में अगले तीव्रतासूचक वाक्यांश के साथ यह अनावश्यक दोहराव के बिना तीव्रता व्यक्त करता है।
- source_word: ἐν πολλοῖς πολέμοις
  choice: अनेक युद्धों में
  rationale: πολέμοις का सीधा अर्थ ‘युद्धों’ है; इसे संकुचित करके केवल ‘लड़ाइयाँ’ नहीं किया गया।
- source_word: ἐπὶ πολὺ σφόδρα
  choice: बहुत ही बड़े पैमाने पर
  rationale: यह प्रबल वाक्यांश यहाँ विनाश की मात्रा या व्यापकता पर बल देता प्रतीत होता है। अनुवाद इसे छोड़े बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ᾐχμαλωτεύθησαν εἰς γῆν οὐκ ἰδίαν
  choice: बंदी बनाकर ऐसे देश में ले जाए गए जो उनका अपना नहीं था
  rationale: बंदी बनाए जाने की बाध्यकारी धारणा और भूमि के उनके अपने न होने का स्पष्ट विरोध—दोनों सुरक्षित रखे गए हैं।
- source_word: ὁ ναὸς τοῦ θεοῦ αὐτῶν
  choice: उनके परमेश्वर का मन्दिर
  rationale: यहूदी प्रसंग में ναός के लिए ‘मन्दिर’ सबसे स्पष्ट और स्वाभाविक शब्द है।
- source_word: ἐγενήθη εἰς ἔδαφος
  choice: धरती के बराबर कर दिया गया
  rationale: यूनानी मुहावरा मन्दिर के भूमि-स्तर तक ढहा दिए जाने का चित्र देता है; हिन्दी अभिव्यक्ति इस चित्र को स्वाभाविक रूप से बनाए रखती है।
- source_word: ἐκρατήθησαν ὑπὸ τῶν ὑπεναντίων
  choice: उनके नगरों पर उनके विरोधियों ने अधिकार कर लिया
  rationale: यह शत्रुओं द्वारा नगरों को अपने नियंत्रण में लेने का भाव स्पष्ट करता है। ‘अधिकार कर लिया’ कब्ज़े और नियंत्रण दोनों के लिए स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय न्याय में कर्तृत्व
  choice: लोगों के परमेश्वर द्वारा ठहराए मार्ग से हटने और उसके बाद आए विनाश, बंधुआई तथा मन्दिर-विध्वंस का संबंध बनाए रखा गया है, पर प्रत्येक विपत्ति का प्रत्यक्ष व्याकरणिक कर्ता परमेश्वर को नहीं बनाया गया।
  alternative: अधिक व्याख्यात्मक अनुवाद हर विपत्ति को सीधे परमेश्वर द्वारा किया गया बता सकता था; अधिक तटस्थ अनुवाद मार्ग से हटने और विपत्तियों के बीच का वाचा-संबंधी कारण-परिणाम धुंधला कर सकता था।
  rationale: यूनानी पाठ विपत्तियों को उनके निर्धारित मार्ग से हटने के बाद रखता है, किन्तु कर्मवाच्य क्रियाएँ हर खंड में परमेश्वर को प्रत्यक्ष कर्ता के रूप में जोड़ने की माँग नहीं करतीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘परन्तु’, ‘मन्दिर’ और संतुलित अर्धविरामों से शास्त्रीय गरिमा रखी गई है, जबकि दुर्बोध संस्कृतनिष्ठ शब्दावली से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
