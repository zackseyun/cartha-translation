base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/021.yaml
  text: For if we are captured like this[a], all Judea will be brought low, and our holy things will be plundered[d][c][b], and he will require their profanation from our blood.
translation:
  language: hi
  text: क्योंकि यदि हम इसी दशा में पकड़ लिए गए[a], तो सारा यहूदिया असहाय हो जाएगा[b], और हमारी पवित्र वस्तुएँ लूट ली जाएँगी; और वह उनके अपवित्रीकरण का हिसाब हमारे लहू से माँगेगा[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब हम इस प्रकार पकड़ लिए जाएँ।” यूनानी आरंभिक वाक्य-विन्यास असहज है; आशय यह है कि हमारी वर्तमान दशा में पकड़े जाने पर आगे यह विपत्ति आएगी।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “बैठ जाएगा।” यहाँ इसका भाव दबकर निष्क्रिय या असहाय हो जाने का हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “उनका अपवित्रीकरण” का अनुवाद “उनकी अपवित्रता” या “उन पवित्र वस्तुओं का अनादर” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: “हिसाब माँगेगा” का कर्ता यूनानी में नहीं बताया गया है। प्रसंग में संभवतः परमेश्वर अभिप्रेत है, जो इस अपवित्रीकरण के लिए उनके लहू की कीमत पर जवाबदेही ठहराएगा।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ' ἐν τῷ λημφθῆναι ἡμᾶς οὕτως
  choice: क्योंकि यदि हम इसी दशा में पकड़ लिए गए
  rationale: स्वीटे का आरंभिक यूनानी वाक्य-विन्यास असहज है, पर λημφθῆναι ἡμᾶς स्पष्टतः पकड़े जाने को व्यक्त करता है। प्रसंग में यह शर्तभावी चेतावनी है; οὕτως को ‘इसी दशा में’ कहना घेराबंदी की वर्तमान स्थिति को स्वाभाविक ढंग से दर्शाता है।
- source_word: καθήσεται
  choice: असहाय हो जाएगा
  rationale: क्रिया का शाब्दिक अर्थ ‘बैठ जाएगा’ है, किंतु यहाँ पूरे यहूदिया के दब जाने, निष्क्रिय पड़ जाने या असहाय होने का भाव है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और ठोस यूनानी बिंब पादटिप्पणी में सुरक्षित है।
- source_word: πᾶσα ἡ Ἰουδαία
  choice: सारा यहूदिया
  rationale: Ἰουδαία भौगोलिक प्रदेश है, लोगों का जातिनाम नहीं। ‘सारा यहूदिया’ इस संदर्भ को बनाए रखता है।
- source_word: προνομευθήσεται
  choice: लूट ली जाएँगी
  rationale: भविष्यत् कर्मवाच्य रूप शत्रुओं द्वारा लूटे जाने को दर्शाता है। ‘लूट ली जाएँगी’ आधुनिक हिन्दी में स्पष्ट सैन्य अर्थ देता है।
- source_word: τὰ ἅγια ἡμῶν
  choice: हमारी पवित्र वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन केवल एक मंदिर तक सीमित न होकर पवित्र वस्तुओं अथवा पवित्र स्थलों का व्यापक संकेत दे सकता है; बहुवचन अनुवाद इस व्यापकता को बचाता है।
- source_word: ζητήσει
  choice: वह ... हिसाब ... लेगा
  rationale: एकवचन क्रिया का कर्ता यूनानी में व्यक्त नहीं है। ‘वह’ इस व्याकरणिक एकवचन को बनाए रखता है, और ‘हिसाब लेना’ ζητέω के यहाँ प्रयुक्त जवाबदेही माँगने वाले न्यायिक भाव को सहज हिन्दी में प्रकट करता है।
- source_word: τὴν βεβήλωσιν αὐτῶν
  choice: उनकी अपवित्रता
  rationale: βεβήλωσις पवित्र वस्तुओं के अपवित्रीकरण या अनादर को सूचित करता है। ‘अपवित्रता’ dignified और समझने योग्य है; कर्तृवाचक प्रक्रिया पर जोर देने वाला ‘अपवित्रीकरण’ भी संभव है।
- source_word: ἐκ τοῦ αἵματος ἡμῶν
  choice: हमारे लहू से
  rationale: ग्रीक पदबंध संक्षिप्त और अर्थगत रूप से कठिन है। औपचारिक निकटता बनाए रखने के साथ हिन्दी में ‘हिसाब हमारे लहू से लेना’ रक्त की कीमत पर उत्तरदायित्व का कठोर भाव बचाता है, बिना उसे विस्तार से निश्चित किए।
theological_decisions:
- issue: ζητήσει का अव्यक्त कर्ता
  choice: मुख्य पाठ में ‘वह’ रखकर कर्ता को अनाम छोड़ा गया है।
  alternative: ‘परमेश्वर ... हिसाब लेगा’ अथवा अनिश्चित ‘हिसाब लिया जाएगा।’
  rationale: प्रसंग में कर्ता स्वाभाविक रूप से परमेश्वर समझा जा सकता है, पर यूनानी पाठ उसका नाम नहीं देता। इसलिए ‘परमेश्वर’ जोड़ना अस्पष्टता को अनुचित रूप से समाप्त करता।
- issue: ἐκ τοῦ αἵματος ἡμῶν में जवाबदेही का स्वरूप
  choice: ‘हमारे लहू से’ का कठोर रूपक बनाए रखा गया है।
  alternative: ‘हमारे प्राणों की कीमत पर’ या ‘हमसे हमारे लहू का बदला लेकर।’
  rationale: मूल पदबंध जवाबदेही, दंड और रक्त की कीमत के बीच तनाव रखता है। अधिक व्याख्यात्मक विकल्प किसी एक न्यायशास्त्रीय अर्थ को निश्चित कर देते।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘यहूदिया,’ ‘पवित्र वस्तुएँ,’ और ‘लहू’ बाइबिलीय संदर्भ को स्पष्ट रखते हैं; कठिन यूनानी वाक्यांशों की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
