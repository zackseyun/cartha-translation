base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/003.yaml
  text: For he happened to be binding the sheaf in the field[a], and the hot wind came upon his head, and he fell onto his bed and died in Bethulia, his city. And they buried him with his fathers in the field between Dothaim and Balamon.
translation:
  language: hi
  text: क्योंकि ऐसा हुआ कि वह खेत में पूला बाँध रहा था, और लू[a] उसके सिर पर आ लगी। वह अपने बिछौने पर गिर पड़ा और अपने नगर बैतूलिया में मर गया। उन्होंने उसे उसके पुरखों के साथ दोथैम और बलामोन के बीच के खेत में दफ़ना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झुलसानेवाली गर्मी।’ यूनानी शब्द καύσων का अर्थ तपती हुई हवा अथवा प्रचंड गर्मी, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτύγγανε
  choice: जब वह … रहा था, तभी
  rationale: यह रचना उस समय चल रही आकस्मिक परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करती है; केवल ‘वह था’ कहने से यह भाव खो जाता।
- source_word: δεσμεύοντος τὸ δράγμα
  choice: पूला बाँध रहा था
  rationale: δράγμα कटे हुए अनाज के एकत्र बंडल या पूले को दर्शाता है। यूनानी में एकवचन होने के कारण ‘पूला’ रखा गया है।
- source_word: ὁ καύσων
  choice: लू
  rationale: καύσων झुलसानेवाली गर्मी या तपती हवा, दोनों को सूचित कर सकता है। खेत के प्रसंग में ‘लू’ संक्षिप्त और स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἔπεσεν ἐπὶ τὴν κλίνην
  choice: अपने बिछौने पर गिर पड़ा
  rationale: κλίνη बिस्तर या लेटने के स्थान को दर्शाता है। ‘गिर पड़ा’ मूल की सजीवता बनाए रखता है और बीमारी का अतिरिक्त निदान नहीं जोड़ता।
- source_word: ἐτελεύτησεν
  choice: मर गया
  rationale: यह मृत्यु का सीधा कथन है; हिन्दी में स्पष्ट और स्वाभाविक रूप चुना गया है।
- source_word: Βαιτυλουὰ
  choice: बैतूलिया
  rationale: यूनानी स्थान-नाम का हिन्दी ध्वन्यंतरण, जो इस पुस्तक में प्रचलित रूप के निकट है।
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: उसके पुरखों के साथ
  rationale: यह पारिवारिक कब्र में पूर्वजों के साथ दफ़नाए जाने का परंपरागत कथन है। ‘पुरखे’ मूल के संबंधगत और बाइबिलीय भाव को सहज हिन्दी में रखता है।
- source_word: ἐν τῷ ἀγρῷ τῷ ἀνὰ μέσον Δωθαεὶμ καὶ Βαλαμών
  choice: दोतैम और बलामोन के बीच के खेत में
  rationale: ἀνὰ μέσον का स्थानगत अर्थ ‘के बीच’ है; वाक्य को आधुनिक हिन्दी में संक्षिप्त और स्पष्ट रखा गया है।
