  verdict: revise
  source_fidelity: Draft substantially reflects the Greek sequence, singular ‘sheaf,’ the ambiguous καύσων, death, and burial. However, ‘क्योंकि जब ... तभी’ recasts ἐτύγχανε as a simple temporal ‘when’ construction rather than retaining its circumstantial/incidental force. ‘दोतैम’ also does not represent the theta in Δωθαείμ as closely as ‘दोथैम.’
  naturalness: The narrative is clear and appropriately dignified. ‘पूला,’ ‘लू,’ ‘बिछौना,’ and ‘पुरखे’ are understandable in modern literary Hindi. Recasting the opening as ‘ऐसा हुआ कि...’ is natural while preserving the Greek nuance.
  terminology: ‘पूला’ suitably renders the singular δράγμα. ‘लू’ is a viable contextual rendering of καύσων, provided that the footnote preserves the alternative of scorching heat. ‘पुरखों के साथ’ appropriately conveys the conventional burial expression without overexplaining it. Place-name spelling is adjusted to ‘दोथैम’ for closer source-based transliteration.
  issues:
  - severity: medium
    issue: The opening ‘क्योंकि जब वह ... था, तभी’ reduces the circumstantial/happenstance force of ἐτύγγανε.
    rationale: The Greek does not merely state that the heat came while he was working; ἐτύγχανε marks that he happened to be engaged in this activity. A Hindi impersonal circumstantial construction preserves this without excessive literalness.
  - severity: low
    issue: ‘दोतैम’ omits the aspirated consonant represented by Greek theta in Δωθαείμ.
    rationale: ‘दोथैम’ more closely represents the source form and the established transliteration Dothaim.
  revised_text: क्योंकि ऐसा हुआ कि वह खेत में पूला बाँध रहा था, और लू[a] उसके सिर पर आ लगी। वह अपने बिछौने पर गिर पड़ा और अपने नगर बैतूलिया में मर गया। उन्होंने उसे उसके पुरखों के साथ दोथैम और बलामोन के बीच के खेत में दफ़ना दिया।
