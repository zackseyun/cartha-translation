  text: And she heard the evil words of the people against the ruler[a], because they had lost heart over the shortage of water; and she heard all the words that Ozias had spoken to them, that he had sworn to hand over the city to the Assyrians after five days.
translation:
  language: hi
  text: और यूदीत ने लोगों ने शासक के विरुद्ध जो बुरी बातें कहीं, वे सुनीं, क्योंकि पानी की कमी के कारण उनका साहस टूट गया था। उसने वे सारी बातें भी सुनीं जो उज्जियाह ने उनसे कही थीं—कि उज्जियाह ने उनसे शपथ खाई थी कि पाँच दिन बाद वह नगर को अश्शूरियों के हाथ सौंप देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर अश्शूरियों को समर्पित कर देगा।” यूनानी में शाब्दिक अर्थ “नगर को सौंप देगा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα τοῦ λαοῦ τὰ πονηρά
  choice: लोगों की वे बुरी बातें
  rationale: यह अनुवाद बोले गए शब्दों के ठोस भाव और उनके नकारात्मक नैतिक मूल्यांकन, दोनों को बनाए रखता है।
- source_word: ἐπὶ τὸν ἄρχοντα
  choice: शासक के विरुद्ध
  rationale: ἐπί यहाँ विरोध या प्रतिकूल संबोधन का भाव देता है; ἄρχων के सामान्य पदनाम को किसी अधिक विशिष्ट सरकारी पद में सीमित नहीं किया गया।
- source_word: ὠλιγοψύχησαν
  choice: उनका साहस टूट गया था
  rationale: यह स्वाभाविक आधुनिक हिन्दी में निराश और हतोत्साहित हो जाने का भाव व्यक्त करता है।
- source_word: ἐπὶ τῇ σπάνει τῶν ὑδάτων
  choice: पानी की कमी के कारण
  rationale: σπάνις अभाव या कमी को दर्शाता है; बहुवचन ὑδάτων यहाँ स्वाभाविक हिन्दी में सामूहिक 'पानी' के रूप में व्यक्त है।
- source_word: πάντας τοὺς λόγους
  choice: वे सारी बातें
  rationale: यह यूनानी के समग्र बल को रखता है, किंतु हिन्दी में अस्वाभाविक 'सारे शब्द' से बचता है।
- source_word: ὤμοσεν αὐτοῖς
  choice: उसने उनके सामने शपथ खाई थी
  rationale: शपथ का स्पष्ट तत्व सुरक्षित है; 'उनके सामने' हिन्दी में श्रोताओं के प्रति की गई शपथ को स्वाभाविक रूप देता है।
- source_word: παραδώσειν
  choice: सौंप देगा
  rationale: मूल क्रिया के व्यापक 'हाथ में दे देना' भाव को रखता है और मुख्य पाठ में तकनीकी सैन्य अर्थ को अनिवार्य नहीं बनाता।
- source_word: μετὰ ἡμέρας πέντε
  choice: पाँच दिन बाद
  rationale: μετά के साथ कर्मकारक का सामान्य कालगत अर्थ 'के बाद' है; इसे बिना आधार 'पाँच दिनों के भीतर' नहीं किया गया।
theological_decisions:
- issue: दूसरे श्रवण-वाक्य में कर्ता का उल्लेख
  choice: पहले वाक्य में 'यूदीत' और दूसरे में 'उसने'
  alternative: दोनों वाक्यों में 'यूदीत' कहना
  rationale: यूनानी पाठ में Ἰουδεὶθ दूसरे खंड में स्पष्ट नाम के रूप में आता है, पर हिन्दी में नाम को पहले ही रख देने से कर्ता स्पष्ट रहता है और दोहराव स्वाभाविक बनता है; कथात्मक अर्थ नहीं बदलता।
- issue: παραδώσειν का सैन्य अर्थ
  choice: नगर को अश्शूरियों के हाथ सौंप देगा
  alternative: नगर का अश्शूरियों के सामने आत्मसमर्पण कर देगा
  rationale: मूल क्रिया 'सौंपने' का व्यापक अर्थ रखती है। प्रसंग में आत्मसमर्पण निहित हो सकता है, पर मुख्य पाठ उस व्याख्या को अनावश्यक रूप से संकीर्ण नहीं करता।
