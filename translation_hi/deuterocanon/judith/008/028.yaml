  text: And Ozias said to her[a], “Everything you have said, you have spoken with a good heart, and there is no one who will oppose your words.”
translation:
  language: hi
  text: तब ओज़ियास ने उससे कहा, “तुमने जो कुछ कहा है, वह भले मन से कहा है,[a] और ऐसा कोई नहीं जो तुम्हारी बातों का विरोध करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ “भले हृदय से” है; इसका आशय केवल प्रभावशाली ढंग से बोलना नहीं, बल्कि नेक या सच्ची नीयत से बोलना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθῇ καρδίᾳ
  choice: भले मन से
  rationale: यह यूनानी मुहावरे के नैतिक और आंतरिक भाव को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है; यहाँ ‘हृदय’ का शाब्दिक अनुवाद अपेक्षाकृत कृत्रिम लगता।
- source_word: ἐλάλησας
  choice: कहा है
  rationale: पूर्ण हो चुकी वाणी को वर्तमान उत्तर से जोड़ता है। हिन्दी में पहले εἶπας और फिर ἐλάλησας के बीच कृत्रिम भेद करने के बजाय स्वाभाविक पुनरुक्ति रखी गई है।
- source_word: ἀντιστήσεται
  choice: विरोध करेगा
  rationale: यह भविष्यकाल और सामने खड़े होकर प्रतिवाद करने के अर्थ को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: τοῖς λόγοις σου
  choice: तुम्हारी बातों का
  rationale: बहुवचन का भाव बनाए रखते हुए जूडिथ की कही हुई सलाह और कथनों की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: Πάντα ὅσα εἶπας
  choice: तुमने जो कुछ कहा है
  rationale: अभिव्यक्ति की समग्रता को स्पष्ट और आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: Ὀζείας
  choice: ओज़ियास
  rationale: नाम को यूनानी पाठ के रूप के अनुसार लिप्यंतरित किया गया है, न कि उसके इब्रानी समकक्ष रूप के अनुसार।
