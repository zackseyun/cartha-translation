base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/026.yaml
  text: Remember what he did with Abraham[a], and how he tested Isaac, and what happened to Jacob in Mesopotamia of Syria while he was shepherding the sheep of Laban[b], his mother's brother.
translation:
  language: hi
  text: याद करो कि उसने अब्राहम के साथ क्या-क्या किया, और उसने इसहाक को किस प्रकार परखा[a], और सीरिया के मेसोपोटामिया[b] में याकूब के साथ क्या-क्या हुआ, जब वह अपनी माता के भाई लाबान की भेड़ों को चरा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी परीक्षा ली।” यूनानी क्रिया का अर्थ “परखना,” “परीक्षा लेना,” और कुछ प्रसंगों में “प्रलोभन देना” हो सकता है; यहाँ भाव बुराई की ओर लुभाने का नहीं, बल्कि परखने वाली परीक्षा का है।
    reason: lexical_alternative
  - marker: b
    text: “सीरिया का मेसोपोटामिया” यूनानी की भौगोलिक अभिव्यक्ति है; इसका अनुवाद “सीरियाई मेसोपोटामिया” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  choice: याद करो
  rationale: बहुवचन आज्ञार्थक exhortation को आधुनिक, सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅσα ἐποίησεν μετʼ Ἀβραάμ
  choice: उसने अब्राहम के साथ क्या किया
  rationale: μετά के ‘साथ’ वाले व्यापक भाव को बनाए रखता है और यह तय नहीं करता कि कार्य अब्राहम के लिए था या उसके प्रति। निहित कर्ता को सन्दर्भानुसार ‘उसने’ कहा गया है, ‘परमेश्वर’ स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: ἐπείρασεν
  choice: परखा
  rationale: यहाँ πειράζω का भाव किसी को बुराई के लिए लुभाना नहीं, बल्कि उसकी परीक्षा लेकर सिद्ध करना है; ‘परखा’ हिन्दी में इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅσα ἐγένετο τῷ Ἰακώβ
  choice: याकूब के साथ क्या-क्या हुआ
  rationale: यूनानी वाक्यांश उन व्यापक घटनाओं को बताता है जो याकूब के साथ घटीं; ‘क्या-क्या हुआ’ ὅσα के विस्तार को भी व्यक्त करता है।
- source_word: ἐν Μεσοποταμίᾳ τῆς Συρίας
  choice: सीरिया के मेसोपोटामिया में
  rationale: यूनानी भौगोलिक अभिव्यक्ति के सम्बन्धवाचक रूप को बनाए रखते हुए हिन्दी में समझने योग्य क्रम अपनाया गया है।
- source_word: ποιμαίνοντι τὰ πρόβατα
  choice: भेड़ों को चरा रहा था
  rationale: वर्तमान कृदन्त की जारी परिस्थिति और πρόβατα के ठोस अर्थ ‘भेड़ें’ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Λαβὰν τοῦ ἀδελφοῦ τῆς μητρὸς αὐτοῦ
  choice: अपनी माता के भाई लाबान की
  rationale: यूनानी में दिए स्पष्ट रिश्ते को ‘मामा’ में संक्षिप्त करने के बजाय उसी रूप में रखा गया है, और सम्बन्ध को हिन्दी के स्वाभाविक क्रम में व्यक्त किया गया है।
theological_decisions:
- issue: अब्राहम और इसहाक से जुड़े क्रियापदों का निहित कर्ता
  choice: निहित कर्ता को ‘उसने’ कहा गया, ‘परमेश्वर’ स्पष्टतः नहीं जोड़ा गया
  alternative: कर्ता को ‘परमेश्वर’ कहकर स्पष्ट करना
  rationale: यूनानी कर्ता को निहित रखता है। हिन्दी में क्रिया के लिए सर्वनाम स्वाभाविक है, पर ‘परमेश्वर’ जोड़ना स्रोत से अधिक स्पष्टता लाता; इसलिए ‘उसने’ स्रोत की संयमित अभिव्यक्ति बनाए रखता है।
- issue: ἐπείρασεν द्वारा वर्णित परीक्षा का स्वरूप
  choice: परखा
  alternative: परीक्षा ली; प्रलोभन दिया
  rationale: कुलपिताओं से सम्बन्धित प्रसंग में अर्थ सिद्ध करने वाली परीक्षा का है, बुराई की ओर लुभाने का नहीं। ‘परखा’ इस अर्थ को रखता है और अनुचित नैतिक आशय से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘याद करो,’ ‘परखा,’ और ‘भेड़ों को चरा रहा था’ आम पाठक के लिए सहज हैं; भौगोलिक अभिव्यक्ति की स्रोतगत विशिष्टता पादटिप्पणी सहित बनाए रखी गई है।
