lexical_decisions:
- source_word: ἀποστρέψαντες
  choice: मुड़कर
  rationale: यह एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई गति को दर्शाता है। ‘मुड़कर’ तंबू से दूर होने की दिशा को बनाए रखता है, पर इसे अनावश्यक रूप से पूर्ण प्रस्थान नहीं बनाता।
- source_word: σκηνῆς
  choice: तंबू
  rationale: σκηνή का सामान्य अर्थ ‘तंबू’ है। यहाँ प्रसंग किसी उपासना-स्थान वाले निवास-मंडप का नहीं, बल्कि कथा में वर्णित रहने के तंबू का है।
- source_word: ἐπορεύθησαν
  choice: चले गए
  rationale: यह गति की सामान्य कथात्मक क्रिया है। ‘चले गए’ आधुनिक हिन्दी में स्वाभाविक है और गंतव्य की ओर प्रस्थान को स्पष्ट करता है।
- source_word: διατάξεις
  choice: नियत स्थानों
  rationale: διάταξις व्यवस्थित नियुक्ति, निर्धारित स्थिति या चौकी को सूचित कर सकता है। ‘नियत स्थानों’ से प्रसंगानुकूल अर्थ मिलता है और यूनानी शब्द की व्यापकता भी बनी रहती है।
- source_word: αὐτῶν
  choice: अपने
  rationale: आत्मवाचक possessive प्रयोग हिन्दी में स्वाभाविक रूप से उसी कर्ता-समूह से संबंधित स्थानों को दर्शाता है।
