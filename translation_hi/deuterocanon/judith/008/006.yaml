  yaml_path: translation/deuterocanon/judith/008/006.yaml
  text: And she fasted all the days of her widowhood[a], except the days before Sabbaths and Sabbaths and the days before new moons and festivals and celebrations of the house of Israel.
translation:
  language: hi
  text: और वह अपने विधवापन के सारे दिनों में उपवास करती रही, केवल सब्तों से पहले के दिनों[a], सब्तों, नए चाँद से पहले के दिनों, पर्वों और इस्राएल के घराने के हर्षोत्सवों को छोड़कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘सब्तों से पहले के दिनों’ और ‘नए चाँद से पहले के दिनों’ के लिए संयुक्त शब्द हैं, जिनका शाब्दिक अर्थ क्रमशः ‘सब्तों से पहले’ और ‘नए चाँदों से पहले’ है।
    reason: यूनानी के पंचांग-संबंधी संयुक्त शब्दों की बनावट तथा वर्णनात्मक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: ἐνήστευε
  choice: उपवास करती रही
  rationale: अपूर्ण भूतकाल का क्रियारूप बीते समय में जारी अथवा नियमित अभ्यास बताता है; ‘करती रही’ इस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάσας τὰς ἡμέρας τῆς χηρεύσεως αὐτῆς
  choice: अपने विधवापन के सारे दिनों में
  rationale: यह वाक्यांश उसके विधवा-जीवन की पूरी अवधि को सूचित करता है और यूनानी की कालगत व्यापकता बनाए रखता है।
- source_word: χωρὶς
  choice: को छोड़कर
  rationale: यहाँ यह उपवास के नियम से सूचीबद्ध दिनों को बाहर रखता है; हिन्दी में ‘को छोड़कर’ स्पष्ट और स्वाभाविक है।
- source_word: προσαββάτων
  choice: विश्राम-दिनों से पहले के दिनों
  rationale: यूनानी संयुक्त शब्द उन दिनों को सूचित करता है जो विश्राम-दिनों से पहले आते हैं; वर्णनात्मक अनुवाद किसी बाद की तकनीकी उपाधि को पाठ में नहीं जोड़ता।
- source_word: σαββάτων
  choice: विश्राम-दिनों
  rationale: यूनानी बहुवचन आवर्ती साप्ताहिक पवित्र दिनों की ओर संकेत करता है; हिन्दी में भी बहुवचन रखा गया है।
- source_word: προνουμηνιῶν
  choice: नए चाँद के दिनों से पहले के दिनों
  rationale: यह προσαββάτων के समानांतर बना संयुक्त शब्द है और नए चाँद के पर्व से पहले के दिनों को दर्शाता है।
- source_word: ἑορτῶν
  choice: पर्वों
  rationale: यह धार्मिक उत्सव के अवसरों को दर्शाता है; ‘पर्व’ आधुनिक, सुबोध और गरिमापूर्ण हिन्दी है।
- source_word: χαρμοσυνῶν
  choice: आनंदोत्सवों
  rationale: यह आनंद मनाने के अवसरों को व्यक्त करता है; ‘आनंदोत्सव’ सूची के सामुदायिक और हर्षपूर्ण स्वर को बनाए रखता है।
- source_word: οἴκου Ἰσραήλ
  choice: इस्राएल के घराने के
  rationale: ‘घराना’ बाइबलीय सामुदायिक मुहावरे को बनाए रखता है और इसे केवल ‘इस्राएल’ कहकर सपाट नहीं करता।
theological_decisions:
- issue: यूदित के उपवास के अपवादों का स्वरूप
  choice: यूदित अपने विधवा-जीवन में नियमित रूप से उपवास करती थी, पर सूचीबद्ध पवित्र और आनंद के दिनों में नहीं।
  alternative: χωρὶς को ढीले अर्थ में लेकर सूचीबद्ध दिनों को उपवास के विशेष दिन समझना।
  rationale: इस प्रसंग में χωρὶς का स्वाभाविक अर्थ बहिष्करण है, और पवित्र तथा उत्सवी दिनों की सूची सामुदायिक आनंद के अवसरों पर उपवास न करने के अर्थ से मेल खाती है।
- issue: इस्राएली पंचांग के पदों का अनुवाद
  choice: पदों को वर्णनात्मक रूप में ‘विश्राम-दिनों से पहले के दिन’ और ‘नए चाँद के दिनों से पहले के दिन’ कहना।
  alternative: ‘तैयारी के दिन’ जैसे बाद के तकनीकी धार्मिक नामों का प्रयोग करना।
  rationale: यूनानी शब्द स्वयं पहले आने वाले दिनों का संकेत देते हैं; वर्णनात्मक हिन्दी स्रोत के प्रति निष्ठावान रहते हुए अनावश्यक उत्तरकालीन विशिष्टता से बचती है।
- issue: οἴκου Ἰσραήλ का संबंध
  choice: ‘इस्राएल के घराने के’ को निकटतम संज्ञा ‘आनंदोत्सवों’ के साथ व्यक्त करना।
  alternative: इसे ‘पर्वों’ और ‘आनंदोत्सवों’ दोनों पर समान रूप से लागू करके ‘इस्राएल के घराने के पर्वों और आनंदोत्सवों’ कहना।
  rationale: यूनानी में संबंधवाचक पद सूची के अंत में χαρμοσυνῶν के तुरंत बाद है; चुनी हुई रचना इस निकटता को बनाए रखती है, जबकि व्यापक सामुदायिक संबंध अर्थ में संभव बना रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज पर गरिमापूर्ण रखी गई है। ‘विश्राम-दिन’, ‘नया चाँद’, ‘पर्व’ और ‘इस्राएल का घराना’ सामान्य पाठक के लिए समझने योग्य रहते हुए बाइबलीय संदर्भ को बनाए रखते हैं।
