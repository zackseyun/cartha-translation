  yaml_path: translation/deuterocanon/judith/008/015.yaml
  text: For if he is not willing to help us within these five days[a], he himself has the authority, in whatever days he wishes, to shelter us[b], or even to destroy us before our enemies.
translation:
  language: hi
  text: क्योंकि यदि वह इन पाँच दिनों के भीतर हमारी सहायता करना न चाहे, तो उसी के पास अधिकार है कि वह जिन दिनों में चाहे, हमें आश्रय दे[a], या हमारे शत्रुओं के सामने[b] हमारा विनाश भी कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हमें सुरक्षित रखे।’ यूनानी क्रिया का शाब्दिक अर्थ ‘ढाँकना’ है; यहाँ इसका भाव सुरक्षा देनेवाला आश्रय है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हमारे शत्रुओं के चेहरे के सामने।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ βούληται
  choice: यदि वह ... करना न चाहे
  rationale: यह βούλομαι के इच्छा अथवा चुनाव संबंधी भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐν ταῖς πέντε ἡμέραις
  choice: इन पाँच दिनों के भीतर
  rationale: ἐν के काल-सूचक प्रयोग और प्रसंग में पहले निर्धारित पाँच दिन की समय-सीमा, दोनों को स्पष्ट करता है।
- source_word: βοηθῆσαι ἡμῖν
  choice: हमारी सहायता करना
  rationale: βοηθέω के व्यापक अर्थ ‘सहायता करना/सहायता को आना’ को बिना अनावश्यक रूप से ‘बचाना’ तक सीमित किए व्यक्त करता है।
- source_word: αὐτὸς ἔχει τὴν ἐξουσίαν
  choice: स्वयं उसी को अधिकार है
  rationale: αὐτός के बलाघात और ἐξουσία में निहित अधिकारपूर्ण स्वतंत्रता, दोनों को बनाए रखता है।
- source_word: ἐν αἷς θέλει ... ἡμέραις
  choice: वह जिन दिनों में चाहे
  rationale: परमेश्वर के समय-निर्धारण की स्वतंत्रता को व्यक्त करते हुए यूनानी वाक्य की ‘दिनों’ वाली अभिव्यक्ति को सुरक्षित रखता है।
- source_word: σκεπάσαι
  choice: आश्रय दे
  rationale: क्रिया का मूल भाव ‘ढाँकना’ है और यहाँ उसका आशय सुरक्षात्मक आश्रय देना है; ‘आश्रय दे’ आधुनिक हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी मूल बिंब बताती है।
- source_word: ὀλεθρεῦσαι
  choice: हमारा विनाश ... कर दे
  rationale: क्रिया के गंभीर और प्रत्यक्ष विनाशकारी अर्थ को बिना नरम किए व्यक्त करता है।
- source_word: πρὸ προσώπου τῶν ἐχθρῶν ἡμῶν
  choice: हमारे शत्रुओं के सामने
  rationale: ‘हमारे शत्रुओं के मुख के सामने’ इस शाब्दिक मुहावरे के सार्वजनिक/प्रत्यक्ष भाव को रखता है और यह नहीं जोड़ता कि विनाश अनिवार्यतः उन्हीं के हाथों होगा।
theological_decisions:
- issue: समय और परिणाम पर परमेश्वर का सर्वोच्च अधिकार
  choice: परमेश्वर को अपनी इच्छा के समय आश्रय देने अथवा विनाश करने—दोनों का अधिकार रखनेवाला कहा गया है।
  alternative: दूसरे विकल्प को इस प्रकार नरम करना कि परमेश्वर केवल शत्रुओं द्वारा विनाश होने देता है।
  rationale: यूनानी पाठ एक ही ἐξουσία के अधीन σκεπάσαι और ὀλεθρεῦσαι दोनों को समन्वित करता है। इसलिए अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है और प्रत्यक्ष कथन को केवल अनुमति देने के अर्थ में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वयं उसी को’ मूल के बलाघात को व्यक्त करता है। पादटिप्पणी-चिह्न उन शब्दों के ठीक बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
