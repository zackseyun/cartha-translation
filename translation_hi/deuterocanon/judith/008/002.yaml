  text: And her husband Manasseh was from her own tribe and her own family line[a]; and he died in the days of the barley harvest.
translation:
  language: hi
  text: और उसका पति मनश्शे उसी के गोत्र और उसी के कुल[a] का था; और वह जौ की कटनी के दिनों में मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी के गोत्र और उसी के पैतृक घराने का।” यूनानी में φυλή (“गोत्र”) और πατριά के बीच भेद है; दूसरा शब्द अधिक संकुचित रिश्तेदारी-समूह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήρ
  choice: पति
  rationale: सम्बन्धसूचक αὐτῆς के साथ यहाँ ἀνήρ का स्वाभाविक अर्थ ‘पति’ है।
- source_word: Μανασσης
  choice: मनश्शे
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: φυλή
  choice: गोत्र
  rationale: यह इस्राएल के व्यापक वंश-आधारित जनजातीय विभाग को दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘गोत्र’ स्वाभाविक और परिचित है।
- source_word: πατριά
  choice: कुल
  rationale: यह φυλή से संकुचित पैतृक रिश्तेदारी-समूह को दर्शाता है; ‘कुल’ आधुनिक हिन्दी में इस भेद को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ἡμέραις
  choice: के दिनों में
  rationale: यूनानी कालवाचक अभिव्यक्ति का रूप और अर्थ दोनों सुरक्षित रहते हैं।
- source_word: θερισμοῦ κριθῶν
  choice: जौ की कटनी
  rationale: सम्बन्धकारक रचना उस फसल को निर्दिष्ट करती है जिसकी कटनी हो रही थी; यह हिन्दी में सहज कृषि-संबंधी अभिव्यक्ति है।
