base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/022.yaml
  text: and the slaughter of our brothers[a], and the captivity of the land, and the desolation of our inheritance, will return upon our own heads among the nations where we will serve as servants there[b]; and we will become a stumbling block and a reproach before those who possess us.
translation:
  language: hi
  text: और हमारे भाइयों का वध, देश की बंधुआई, और हमारी विरासत का उजाड़—यह सब उन जातियों के बीच हमारे ही सिर पर लौट आएगा[a], जहाँ हम दासों के रूप में सेवा करेंगे[b]; और हम उनके सामने ठोकर का कारण और निन्दा का पात्र बन जाएँगे जिनके अधिकार में हम होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह इसे हमारे सिर पर लौटा देगा।” यूनानी क्रिया एकवचन है, पर इस उपवाक्य में उसका कर्ता स्पष्ट रूप से व्यक्त नहीं है।
    reason: alternative_reading
  - marker: b
    text: या, “जहाँ कहीं हम सेवा करें।” यूनानी क्रिया का अर्थ केवल “सेवा करना” भी हो सकता है, पर यहाँ बंधुआई के प्रसंग में दासत्व या बाध्य सेवा का भाव सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φόνον
  choice: वध
  rationale: यह युद्ध और हिंसा के संदर्भ में हत्या अथवा रक्तपात का बोध देता है; ‘वध’ उसकी गंभीरता बनाए रखता है, पर आधुनिक कानूनी अर्थ में ‘हत्या’ का आरोप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀδελφῶν
  choice: भाइयों
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है और यहाँ व्यापक रूप से साथी इस्राएलियों को सूचित कर सकता है; ‘भाइयों’ स्रोत-रूप को सुरक्षित रखता है।
- source_word: αἰχμαλωσίαν τῆς γῆς
  choice: देश का बंदी बनाया जाना
  rationale: αἰχμαλωσία बंदी बनाए जाने या बंदी दशा का बोध देता है और γῆ यहाँ लोगों के देश/भूमि को दर्शाता है। असामान्य मूल अभिव्यक्ति को सहज हिन्दी में यथासंभव बनाए रखा गया है।
- source_word: ἐρήμωσιν τῆς κληρονομίας ἡμῶν
  choice: हमारी विरासत का उजाड़ा जाना
  rationale: ἐρήμωσις उजाड़ या विनाश और κληρονομία विरासत को दर्शाते हैं; यह भूमि-संबंधी वाचा की अनुगूँज को बनाए रखता है।
- source_word: ἐπιστρέψει εἰς κεφαλὴν ἡμῶν
  choice: इन सबका फल हमारे ही सिर पर लौट आएगा
  rationale: मुहावरा दुष्परिणामों के स्वयं पर लौटने का बोध देता है। यूनानी क्रिया एकवचन है पर कर्ता स्पष्ट नहीं; हिन्दी में ‘इन सबका फल’ पूर्ववर्ती विपत्तियों को सामूहिक रूप से ग्रहण करता है और अस्पष्ट दैवी कर्ता जोड़ने से बचता है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: उन जातियों के बीच
  rationale: यह निर्वासन/बंदीपन के संदर्भ में अन्य राष्ट्रों या जातियों को दर्शाता है; ‘जातियों’ धार्मिक रूप से अधिक व्याख्यात्मक ‘अन्यजातियों’ से कम भारित है।
- source_word: δουλεύσωμεν
  choice: दासों के समान सेवा करेंगे
  rationale: δουλεύω सेवा करने के साथ दासत्व का अर्थ भी रखता है; बंदीपन के संदर्भ में बाध्य सेवा का भाव स्पष्ट किया गया है।
- source_word: πρόσκομμα
  choice: ठोकर का कारण
  rationale: मूल ठोकर लगने की उपमा को प्राकृतिक हिन्दी में सुरक्षित रखता है।
- source_word: ὄνειδος
  choice: निन्दा का पात्र
  rationale: दूसरों की दृष्टि में अपमान और तिरस्कार का विषय बनने का अर्थ व्यक्त करता है।
- source_word: τῶν κτωμένων ἡμᾶς
  choice: जो हमें अपने अधिकार में कर लेंगे
  rationale: κτάομαι प्राप्त करने या अपने अधिकार में लेने/रखने का बोध देता है। यह दासत्व-संदर्भ को बनाए रखता है, पर ‘मालिक’ जैसा संज्ञात्मक संबंध मूल में जोड़े बिना।
theological_decisions:
- issue: ἐπιστρέψει का अनुल्लिखित कर्ता
  choice: ‘इन सबका फल ... लौट आएगा’ कहकर वाक्य को निरपेक्ष रूप में प्रस्तुत किया गया है।
  alternative: ‘वह ... हमारे सिर पर लौटा देगा,’ जिसमें ‘वह’ संभवतः परमेश्वर की ओर संकेत करे।
  rationale: यूनानी में क्रिया एकवचन है, पर इस उपवाक्य में कर्ता व्यक्त नहीं है। परमेश्वर का नाम जोड़ना अस्पष्टता को समाप्त कर देता; निरपेक्ष हिन्दी परिणाम के लौटने का भाव रखते हुए अनकहे कर्ता को निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक-पाठ योग्य शैली रखी गई है। ‘विरासत’, ‘वध’, ‘उजाड़ा जाना’ और ‘निन्दा का पात्र’ मूल के औपचारिक तथा शोकपूर्ण स्वर को बनाए रखते हैं। पद आरम्भ में संयोजक ‘और’ रखा गया है क्योंकि यह पिछले कथन की निरन्तरता है।
