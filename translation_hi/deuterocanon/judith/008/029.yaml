base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/029.yaml
  text: For your wisdom did not become evident only today; rather[a], from the beginning of your days all the people have known your understanding, because the disposition of your heart is good.
translation:
  language: hi
  text: क्योंकि तुम्हारी बुद्धि आज ही प्रकट नहीं हुई है; बल्कि तुम्हारे जीवन के आरम्भ से ही सभी लोग तुम्हारी समझ को जानते आए हैं, क्योंकि तुम्हारे हृदय की प्रवृत्ति अच्छी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे हृदय की बनावट अच्छी है” अथवा “तुम्हारे हृदय का झुकाव अच्छा है।” यूनानी अभिव्यक्ति कुछ शाब्दिक है और हृदय के भीतरी गठन या रुझान की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐν τῇ σήμερον ἡ σοφία σου πρόδηλός ἐστιν
  choice: तुम्हारी बुद्धि आज ही प्रकट नहीं हुई है
  rationale: यूनानी वाक्य वर्तमान दिन और बहुत पहले से स्थापित ख्याति के बीच विरोध रखता है। ‘आज ही’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘प्रकट’ πρόδηλος के स्पष्ट/प्रत्यक्ष होने के अर्थ को सुरक्षित रखता है।
- source_word: ἀλλʼ ἀπʼ ἀρχῆς ἡμερῶν σου
  choice: बल्कि तुम्हारे जीवन के आरम्भ से ही
  rationale: शाब्दिक ‘तुम्हारे दिनों के आरम्भ से’ हिन्दी में असहज है; ‘जीवन के आरम्भ से ही’ उसी कालगत मुहावरे का स्पष्ट और स्वाभाविक रूप है।
- source_word: ἔγνω πᾶς ὁ λαὸς
  choice: सभी लोग ... जानते आए हैं
  rationale: यूनानी अओरिस्ट अतीत से स्थापित सामूहिक पहचान बताता है। हिन्दी का ‘जानते आए हैं’ आरम्भिक समय से वर्तमान तक चली आ रही ख्याति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν σύνεσίν σου
  choice: तुम्हारी समझ
  rationale: σύνεσις समझ, सूझ-बूझ या विवेक को सूचित करता है। ‘समझ’ सरल है और σοφία के लिए प्रयुक्त ‘बुद्धि’ से शब्दगत भेद भी बनाए रखता है।
- source_word: καθότι
  choice: क्योंकि
  rationale: यह संयोजक लोगों द्वारा उसकी समझ पहचाने जाने का कारण देता है; ‘क्योंकि’ आधुनिक हिन्दी में सीधा समतुल्य है।
- source_word: τὸ πλάσμα τῆς καρδίας σου
  choice: तुम्हारे हृदय की प्रवृत्ति
  rationale: πλάσμα का मूल भाव गढ़ी या आकार पाई हुई वस्तु है, पर यहाँ हृदय की भीतरी बनावट, झुकाव या रुझान अभिप्रेत है। ‘प्रवृत्ति’ अर्थ को सुबोध रखती है, जबकि पादटिप्पणी मूल रूपक की व्यापकता बताती है।
- source_word: ἀγαθόν
  choice: अच्छी है
  rationale: ἀγαθός की व्यापक नैतिक प्रशंसा के लिए ‘अच्छी’ सीधा और न्यूनतम व्याख्यात्मक विकल्प है।
theological_decisions:
- issue: ‘हृदय’ से जुड़ी बाइबलीय मानव-धारणा
  choice: ‘तुम्हारे हृदय की प्रवृत्ति’ में ‘हृदय’ को बनाए रखा गया
  alternative: ‘तुम्हारे मन की प्रवृत्ति’ अथवा ‘तुम्हारा चरित्र’
  rationale: मूल में καρδία व्यक्ति के भीतरी विचार और नैतिक झुकाव का केंद्र है। ‘हृदय’ को बनाए रखने से बाइबलीय अभिव्यक्ति सुरक्षित रहती है और ‘प्रवृत्ति’ अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण किंतु सहज शैली। ‘तुम्हारी’ का प्रयोग प्रसंग के प्रत्यक्ष संबोधन के अनुरूप है। वाक्य-रचना मूल के कारणात्मक आरम्भ और विरोधात्मक ‘बल्कि’ को बनाए रखती है।
