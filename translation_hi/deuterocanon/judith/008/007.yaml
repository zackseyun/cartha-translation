  yaml_path: translation/deuterocanon/judith/008/007.yaml
  text: And she was very beautiful in appearance and lovely to behold[a]; and Manasseh her husband had left her gold and silver and male servants and female servants and livestock and fields[b], and she remained over them.
translation:
  language: hi
  text: वह रूप में सुन्दर और देखने में अत्यन्त मनोहर थी। उसका पति मनश्शे उसके लिए सोना-चाँदी, दास-दासियाँ[a], पशुधन और खेत छोड़ गया था; और वह उन सब पर अधिकार रखती रही[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवक-सेविकाएँ।” यूनानी शब्द घरेलू दासों या सेवकों, दोनों को सूचित कर सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “वह उनकी देखरेख करती रही।” यूनानी अभिव्यक्ति में स्वामित्व, प्रबन्ध अथवा दोनों का भाव हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: καλὴ τῷ εἴδει
  choice: रूप में सुन्दर
  rationale: यह पदबंध नैतिक भलाई नहीं, बाहरी रूप-सौन्दर्य बताता है। यह अनुवाद दृश्य अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ὡραία τῇ ὄψει σφόδρα
  choice: देखने में अत्यन्त मनोहर
  rationale: ὡραία और ὄψις दृश्य आकर्षण पर बल देते हैं, जबकि σφόδρα तीव्रता प्रकट करता है। ‘अत्यन्त मनोहर’ पहले पदबंध की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: ὑπελείπετο αὐτῇ
  choice: उसके लिए ... छोड़ गया था
  rationale: सन्दर्भ में मृत पति द्वारा पीछे छोड़ी गई सम्पत्ति का भाव है। यह किसी औपचारिक वसीयत का दावा किए बिना पूर्वकालिक क्रिया व्यक्त करता है।
- source_word: παῖδας καὶ παιδίσκας
  choice: दास-दासियाँ
  rationale: सम्पत्ति-सूची में ये शब्द आश्रित घरेलू पुरुषों और स्त्रियों के लिए हैं और दासत्व का अर्थ ग्रहण कर सकते हैं। सूची में अन्य सम्पत्ति के साथ रखे जाने के कारण मुख्य पाठ में सामाजिक स्थिति को छिपाया नहीं गया है; ‘सेवक-सेविकाएँ’ को पादटिप्पणी में विकल्प रखा गया है।
- source_word: κτήνη
  choice: पशुधन
  rationale: यह शब्द सामान्य रूप से पाले हुए सम्पत्ति-पशुओं को दर्शाता है; ‘पशुधन’ आधुनिक हिन्दी में इसका व्यापक और सटीक समतुल्य है।
- source_word: ἀγρούς
  choice: खेत
  rationale: ἀγροί खेती की भूमि या खेतों को दर्शाता है; ‘खेत’ सीधा और सहज समतुल्य है।
- source_word: ἔμενεν ἐπʼ αὐτῶν
  choice: उन सब पर अधिकार रखती रही
  rationale: यूनानी पदबंध निरन्तर अधिपत्य, स्वामित्व या प्रबन्ध का संकेत दे सकता है। ‘अधिकार रखती रही’ मूल के ‘ऊपर’ वाले भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ठीक-ठीक प्रशासन का दावा नहीं करता।
theological_decisions:
- issue: सम्पत्ति-सूची में घरेलू आश्रितों की सामाजिक स्थिति
  choice: दास-दासियाँ
  alternative: सेवक-सेविकाएँ
  rationale: παῖδας/παιδίσκας अपने आप में सेवक या दास दोनों अर्थ दे सकते हैं, पर इस पद में उनका सम्पत्ति के बीच गिना जाना बन्धुआ स्थिति की सम्भावना को प्रमुख बनाता है। विकल्प पादटिप्पणी में सुरक्षित है।
- issue: ἔμενεν ἐπʼ αὐτῶν में स्वामित्व और प्रबन्ध का सम्बन्ध
  choice: उन सब पर अधिकार रखती रही
  alternative: वह उनकी देखरेख करती रही; वह उन पर बनी रही
  rationale: मूल अभिव्यक्ति यह पूरी तरह तय नहीं करती कि बल स्वामित्व पर है, प्रबन्ध पर, या दोनों पर। मुख्य पाठ स्वाभाविक हिन्दी में अधिकार का व्यापक भाव रखता है और पादटिप्पणी में अस्पष्टता बताता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानान्तर सौन्दर्य-वर्णन को हिन्दी में स्वाभाविक भिन्नता के साथ प्रस्तुत किया गया है। सम्पत्ति-सूची स्पष्ट और संक्षिप्त है; विवादित सामाजिक स्थिति तथा अन्तिम वाक्यांश की अर्थगत अस्पष्टता पादटिप्पणियों में सुरक्षित हैं।
