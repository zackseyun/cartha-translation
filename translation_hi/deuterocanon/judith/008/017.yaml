  yaml_path: translation/deuterocanon/judith/008/017.yaml
  text: Therefore[a], while we wait for the salvation that comes from him, let us call on him to help us, and he will hear our voice[b], if it is pleasing to him.
translation:
  language: hi
  text: इसलिए, उसकी ओर से आनेवाले उद्धार[a] की बाट जोहते हुए, हम अपनी सहायता के लिए उसे पुकारें; और यदि उसे अच्छा लगे, तो वह हमारी आवाज़[b] सुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘छुटकारे’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हमारी पुकार पर ध्यान देगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: διόπερ
  choice: इसलिए
  rationale: यह पूर्ववर्ती तर्क से निष्कर्ष निकालने वाला संबंधबोधक है; ‘इसलिए’ आधुनिक हिन्दी में इसका तार्किक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀναμένοντες
  choice: बाट जोहते हुए
  rationale: वर्तमान कृदन्त निरंतर और आशापूर्ण प्रतीक्षा का भाव देता है। ‘बाट जोहते हुए’ इस अपेक्षापूर्ण प्रतीक्षा को सहज हिन्दी में रखता है।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: संदर्भ में परमेश्वर द्वारा संकट से बचाए जाने का आशय है। ‘उद्धार’ दैवी बचाव का व्यापक धार्मिक भार बनाए रखता है, जबकि ‘छुटकारा’ प्रसंगानुकूल विकल्प है।
- source_word: τὴν παρ' αὐτοῦ
  choice: उसकी ओर से आनेवाले
  rationale: παρά के साथ संबंध स्रोत को दर्शाता है। यह वाक्यांश स्पष्ट करता है कि उद्धार उसी से आता है।
- source_word: ἐπικαλεσώμεθα
  choice: हम ... उसे पुकारें
  rationale: यह प्रथम पुरुष बहुवचन का आग्रहसूचक रूप है। ‘हम ... पुकारें’ सामूहिक प्रार्थनापूर्ण आह्वान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς βοήθειαν ἡμῶν
  choice: अपनी सहायता के लिए
  rationale: यह यूनानी पदबंध के उद्देश्य—हमारी सहायता—को निकटता और स्वाभाविकता से व्यक्त करता है।
- source_word: εἰσακούσεται
  choice: सुनेगा
  rationale: प्रार्थना के संदर्भ में क्रिया अनुकूल रूप से सुनने का संकेत दे सकती है; ‘सुनेगा’ उस अर्थ को आरोपित किए बिना निहित रहने देता है।
- source_word: τῆς φωνῆς ἡμῶν
  choice: हमारी आवाज़
  rationale: φωνή का सीधा अर्थ ‘आवाज़’ है। इसे बनाए रखने से ‘पुकार’ या ‘प्रार्थना’ जैसा अधिक विशिष्ट अर्थ अनावश्यक रूप से नहीं जोड़ा जाता।
- source_word: ἐὰν ἦν αὐτῷ ἀρεστόν
  choice: यदि उसे अच्छा लगे
  rationale: यह दैवी इच्छा पर निर्भर शर्त को सहज आधुनिक हिन्दी में व्यक्त करता है और यह तय नहीं करता कि परमेश्वर को क्या अच्छा लगना चाहिए।
theological_decisions:
- issue: σωτηρία का कथात्मक संकट में अर्थ
  choice: उद्धार
  alternative: छुटकारा
  rationale: तात्कालिक संदर्भ सामुदायिक या सैन्य संकट से बचाव का है, फिर भी यूनानी शब्द दैवी बचाने की व्यापक धार्मिक ध्वनि रखता है। ‘उद्धार’ मुख्य पाठ में दोनों स्तरों को खुला रखता है।
- issue: परमेश्वर के सुनने पर लगी शर्त
  choice: यदि उसे अच्छा लगे
  alternative: यदि यह उसे ग्रहणयोग्य हो
  rationale: मूल पाठ सुनने को परमेश्वर की प्रसन्नता पर निर्भर रखता है। अनुवाद इस तनाव को बनाए रखता है और शर्त को न तो हटाता है, न उसकी व्याख्या करके उसे निश्चित उत्तर के वादे में बदलता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपदेश के अनुकूल है। ‘बाट जोहते हुए’ अपेक्षापूर्ण प्रतीक्षा का स्वाभाविक हिन्दी मुहावरा है; ‘यदि उसे अच्छा लगे’ मूल की दैवी-इच्छा संबंधी शर्त को स्पष्ट किंतु अनिर्णीत रखता है।
