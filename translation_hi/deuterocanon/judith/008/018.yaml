base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/018.yaml
  text: For in our generations no tribe or clan or people or city has arisen from among us that worships gods made by hands[a], as happened in former days; nor is there any even to this day.
translation:
  language: hi
  text: क्योंकि हमारी पीढ़ियों में हमारे बीच से न कोई गोत्र, न कुल, न समुदाय और न नगर ऐसा उठा है जो हाथों से बनाए हुए देवताओं[a] की आराधना करता हो, जैसा पुराने दिनों में हुआ था; और आज के दिन भी ऐसा कोई नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मनुष्य के हाथों से बनाई हुई मूर्तियों।’ यूनानी में शाब्दिक रूप से ‘हाथों से बनाए हुए देवताओं’ लिखा है; यह मूर्तियों के लिए एक व्यंग्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστη
  choice: उठा है
  rationale: यहाँ क्रिया का अर्थ किसी समूह का प्रकट होना या उभरना है, न कि मृतकों में से जी उठना। ‘उठा है’ मूल रूपक को बनाए रखता है।
- source_word: ἐν ταῖς γενεαῖς ἡμῶν
  choice: हमारी पीढ़ियों में
  rationale: बहुवचन γενεαῖς successive generations को दर्शाता है और पहले के दिनों से वर्तमान का विरोध स्थापित करता है।
- source_word: φυλή
  choice: गोत्र
  rationale: इस्राएली संदर्भ में यह बड़े वंशगत सामाजिक विभाग, अर्थात् tribe, को सूचित करता है।
- source_word: πατριά
  choice: कुल
  rationale: यह गोत्र के भीतर की छोटी नातेदारी या वंशगत इकाई को व्यक्त करता है।
- source_word: δῆμος
  choice: समुदाय
  rationale: सूची में यह लोगों के संगठित समूह या जनसमुदाय को सूचित करता है; ‘समुदाय’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक प्रशासनिक विशिष्टता से बचता है।
- source_word: πόλις
  choice: नगर
  rationale: यह πόλις का सामान्य और गरिमापूर्ण हिन्दी प्रतिशब्द है।
- source_word: ἐξ ἡμῶν
  choice: हमारे बीच से
  rationale: यह वक्ता के अपने लोगों के भीतर से उत्पत्ति होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσκυνοῦσι
  choice: आराधना करता हो
  rationale: हाथों से बनाए देवताओं के संदर्भ में क्रिया का धार्मिक अर्थ प्रधान है। एकवचन क्रिया पूरी ‘न...न...’ सूची को सामूहिक इकाई के रूप में ग्रहण करती है।
- source_word: θεοῖς χειροποιήτοις
  choice: हाथों से बनाए हुए देवताओं
  rationale: यह यूनानी की शाब्दिक और व्यंग्यात्मक अभिव्यक्ति को सुरक्षित रखता है; ‘मूर्तियाँ’ अर्थ की व्याख्या करता, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: καθάπερ ἐγένετο ἐν ταῖς πρότερον ἡμέραις
  choice: जैसा पुराने दिनों में हुआ था
  rationale: यह इस्राएल के पहले के मूर्तिपूजक इतिहास और वर्तमान दावे के बीच विरोध को सीधे व्यक्त करता है।
- source_word: οὐδὲ ἔστιν ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: और आज के दिन भी ऐसा कोई नहीं है
  rationale: यह अतीत-संबंधी कथन के बाद यूनानी में दिए वर्तमानकालीन बल को बनाए रखता है।
theological_decisions:
- issue: θεοῖς χειροποιήτοις में मूर्तिपूजा-विरोधी अभिव्यक्ति
  choice: हाथों से बनाए हुए देवताओं
  alternative: मनुष्य के हाथों से बनाई हुई मूर्तियों
  rationale: मूल पाठ ‘देवताओं’ और ‘हाथों से बनाए हुए’ की जानबूझकर विडंबनापूर्ण संगति रखता है। मुख्य पाठ में वही तनाव रखा गया है, जबकि अधिक व्याख्यात्मक विकल्प पादटिप्पणी में है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। सामाजिक इकाइयों के क्रम को ‘गोत्र, कुल, समुदाय, नगर’ से सुरक्षित रखा गया है और मूल की मूर्तिपूजा-विरोधी विडंबना को मुख्य पाठ में बनाए रखा गया है।
