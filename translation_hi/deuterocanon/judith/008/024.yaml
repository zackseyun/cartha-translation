  yaml_path: translation/deuterocanon/judith/008/024.yaml
  text: Now[a], brothers, let us show our brothers that their life hangs on us[b], and that the holy things and the house and the altar rest on us.
translation:
  language: hi
  text: अब, भाइयो[a], हम अपने भाइयों को दिखाएँ कि उनका जीवन हम पर टिका है[b], और पवित्र वस्तुएँ, भवन और वेदी हम पर आश्रित हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ को यदि केवल पुरुषों के बजाय सबके लिए समावेशी संबोधन माना जाए, तो ‘भाइयो और बहनो’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उनका प्राण’; यहाँ सम्भवतः आशय उनके जीवन या जीवित बचने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी पद व्याकरण की दृष्टि से पुल्लिंग बहुवचन में सीधा संबोधन है। हिन्दी में ‘भाइयो’ उसका स्वाभाविक और लिंग-सटीक रूप है; सम्भावित समावेशी अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐπιδειξώμεθα
  choice: हम ... दिखाएँ
  rationale: यह परामर्शात्मक सम्भावनार्थक रूप सामूहिक आह्वान व्यक्त करता है। ‘हम ... दिखाएँ’ दृश्य कार्य द्वारा प्रमाणित करने का भाव सहज हिन्दी में रखता है।
- source_word: ἐξ ἡμῶν κρέμαται
  choice: हम पर टिका है
  rationale: यह चयन निर्भरता के साथ मूल के ठोस ‘लटकने/टिके होने’ के बिम्ब को भी बनाए रखता है।
- source_word: ἡ ψυχὴ αὐτῶν
  choice: उनका जीवन
  rationale: इस प्रसंग में ψυχή का आशय संकटग्रस्त समुदाय का जीवन या बचाव है, न कि अनिवार्य रूप से अभौतिक आत्मा। यूनानी का सामूहिक एकवचन भी सुरक्षित है।
- source_word: τὰ ἅγια
  choice: पवित्र वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन को व्यापक रूप से रखा गया है। इसे ‘पवित्रस्थान’ कहना सम्भव है, पर उससे बहुवचन और अगली अलग संज्ञाओं के बीच का भेद धुँधला हो सकता है।
- source_word: ὁ οἶκος
  choice: भवन
  rationale: मूल में सामान्यतः ‘घर/भवन’ है, जो इस उपासना-सन्दर्भ में मन्दिर-भवन की ओर संकेत करता है। ‘भवन’ हिन्दी में गरिमापूर्ण है और ‘मन्दिर’ को व्याख्यात्मक रूप से जोड़ने से बचता है।
- source_word: τὸ θυσιαστήριον
  choice: वेदी
  rationale: उपासना और बलिदान के प्रसंग में यह मानक, स्पष्ट हिन्दी समतुल्य है।
- source_word: ἐπεστήρισται ἐφʼ ἡμῖν
  choice: हम पर आश्रित हैं
  rationale: पूर्णकालिक रूप से उत्पन्न वर्तमान निर्भरता की दशा को स्वाभाविक हिन्दी में व्यक्त करता है; ‘टिकी हुई हैं’ भी सम्भव है, पर पहले खण्ड के ‘टिका है’ की अनावश्यक पुनरावृत्ति होगी।
theological_decisions:
- issue: सीधे संबोधन में लिंगयुक्त संबंध-सूचक भाषा
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग बहुवचन को सुरक्षित रखता है। यदि संबोधन पूरे समुदाय के लिए प्रतिनिधिक और समावेशी समझा जाए, तो वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- issue: ψυχή का अर्थ जीवन या आत्मा
  choice: उनका जीवन
  alternative: उनकी आत्मा
  rationale: प्रसंग घिरे हुए समुदाय के अस्तित्व और बचाव का है; इसलिए ‘जीवन’ उपयुक्त है और पाठ में आत्मा के स्वरूप पर अनपेक्षित धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: τὰ ἅγια का व्यापक या स्थानवाचक अर्थ
  choice: पवित्र वस्तुएँ
  alternative: पवित्रस्थान
  rationale: बहुवचन और उसके बाद अलग से भवन तथा वेदी के उल्लेख को सुरक्षित रखने के लिए व्यापक अर्थ चुना गया है; स्थानवाचक अर्थ सम्भव होने के कारण वैकल्पिक पठन स्वीकार्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक संबोधन वाला रूप अपनाया गया है। वाक्य की समानान्तर संरचना और सामूहिक उत्तरदायित्व की तात्कालिकता सुरक्षित रखी गई है। ‘भवन’ प्रसंग में मन्दिर-भवन को इंगित करता है, पर मूल से अधिक स्पष्ट व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
