  yaml_path: translation/deuterocanon/judith/008/033.yaml
  text: You stand at the gate tonight, and I will go out with my maidservant; and within the days after which you said you would hand over the city to our enemies, the Lord will visit Israel by my hand.
translation:
  language: hi
  text: “आज रात तुम लोग फाटक पर खड़े रहना। मैं अपनी दासी के साथ बाहर जाऊँगी। और उन दिनों के भीतर, जिनके बाद तुमने कहा था कि नगर को हमारे शत्रुओं के हाथ सौंप दोगे, प्रभु मेरे हाथ से इस्राएल की सुधि लेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσεσθε
  choice: खड़े रहना
  rationale: यह भविष्यत् मध्यम रूप यहाँ आदेश के अर्थ में स्वाभाविक है; हिन्दी में सीधा निर्देश प्रसंग के अनुकूल है।
- source_word: ἅβρα
  choice: दासी
  rationale: यह शब्द निजी महिला सेविका या परिचारिका को दर्शाता है; ‘दासी’ संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल है।
- source_word: ἐν ταῖς ἡμέραις μεθʼ ἃς
  choice: जिन दिनों के बाद … उन्हीं दिनों के भीतर
  rationale: यूनानी वाक्य की समय-सीमा कुछ असामान्य है। यह अनुवाद उस तनाव को बनाए रखते हुए बताता है कि कार्य निर्धारित अवधि समाप्त होने से पहले होगा।
- source_word: παραδῶσειν
  choice: हाथ सौंप देने
  rationale: नगर को शत्रुओं के अधिकार में देने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπισκέψεται
  choice: सुधि लेगा
  rationale: यहाँ क्रिया का अर्थ केवल ‘भेंट करना’ नहीं, बल्कि ध्यान देकर हस्तक्षेप करना है; ‘सुधि लेना’ इस व्यापक और धर्मवैज्ञानिक रूप से खुली अर्थ-छाया को बनाए रखता है।
- source_word: ἐν χειρί μου
  choice: मेरे हाथ से
  rationale: यूनानी मुहावरे में साधन या माध्यम का भाव है; हिन्दी का यह रूप स्त्री वक्ता के माध्यम से प्रभु के कार्य को स्पष्ट करता है।
theological_decisions:
- issue: प्रभु के हस्तक्षेप और यहूदीत की भूमिका का संबंध
  choice: प्रभु मेरे हाथ से इस्राएल की सुधि लेगा
  alternative: प्रभु मेरे द्वारा इस्राएल को बचाएगा
  rationale: मूल पाठ ‘बचाएगा’ स्पष्ट रूप से नहीं कहता। ‘सुधि लेगा’ ἐπισκέπτομαι की व्यापकता तथा दैवी कार्य और मानवीय माध्यम के बीच मूल तनाव को सुरक्षित रखता है।
- issue: Κύριος का अनुवाद
  choice: प्रभु
  alternative: याहवे
  rationale: स्वीट के यूनानी पाठ में Κύριος है; ‘प्रभु’ उसी पाठरूप का सीधा और हिन्दी बाइबलीय प्रयोग में परिचित समतुल्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रत्यक्ष वचन। बहुवचन ‘तुम लोग’ से ὑμεῖς का स्पष्ट संकेत मिलता है। स्त्री वक्ता के कारण ‘जाऊँगी’ रखा गया है। समय-संबंधी यूनानी संरचना को पूरी तरह सरल बनाकर उसकी वास्तविक अस्पष्टता मिटाई नहीं गई है।
