base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/016.yaml
  text: But do not hold the plans of the Lord our God as security[a], for God is not like a man, to be threatened, nor like a son of man[b], to be persuaded.
translation:
  language: hi
  text: पर तुम प्रभु हमारे परमेश्वर की योजनाओं को गिरवी मत रखो[a], क्योंकि परमेश्वर मनुष्य के समान नहीं कि उसे धमकाया जाए, और न मनुष्य के पुत्र के समान कि उसे राज़ी किया जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु हमारे परमेश्वर की योजनाओं को जमानत के रूप में मत रखो।” यूनानी में गिरवी या जमानत का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मनुष्य का पुत्र” सामी शैली में मानव-प्राणी के लिए प्रयुक्त अभिव्यक्ति है; यह मसीहाई उपाधि नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐνεχυράζετε
  choice: बंधक मत बनाओ
  rationale: क्रिया में गिरवी, जमानत या बंधक रखने का रूपक है। ‘बंधक मत बनाओ’ इस चित्र को स्वाभाविक हिन्दी में बनाए रखता है और संकेत करता है कि मनुष्य परमेश्वर की योजनाओं को अपनी शर्तों या समय-सीमा में नहीं बाँध सकते।
- source_word: βουλάς
  choice: योजनाओं
  rationale: βουλή यहाँ परामर्श, उद्देश्य या योजना को दर्शाता है। ‘योजनाएँ’ आधुनिक हिन्दी में स्पष्ट है और परमेश्वर के अभिप्रेत कार्यक्रम के अर्थ के अनुकूल है।
- source_word: κυρίου τοῦ θεοῦ ἡμῶν
  choice: हमारे प्रभु परमेश्वर
  rationale: यह κύριος और θεός दोनों को सुरक्षित रखते हुए यूनानी संबंध-वाचक संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπειληθῆναι
  choice: उसे धमकाया जाए
  rationale: निष्क्रिय अनंत क्रिया का सीधा अर्थ ‘धमकाया जाना’ है; इससे मनुष्य द्वारा दबाव डालने की असमर्थता स्पष्ट रहती है।
- source_word: διαπεισθῆναι
  choice: उसे मनाया जाए
  rationale: क्रिया किसी को राज़ी करने या अपने पक्ष में करने का भाव देती है। ‘मनाया जाए’ पहले निष्क्रिय पद के साथ समानांतर और सामान्य पाठक के लिए सहज है।
- source_word: υἱὸς ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह शाब्दिक सामी-शैली की अभिव्यक्ति को और ‘मनुष्य’ के साथ मूल समानांतरता को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि यहाँ आशय साधारण मानव से है।
theological_decisions:
- issue: परमेश्वर और मनुष्य के बीच मानव-सदृश दबाव तथा अनुनय का विरोध
  choice: वाक्य को इस निषेध के रूप में रखा गया है कि परमेश्वर को मनुष्य की तरह धमकाया या मनाया नहीं जा सकता।
  alternative: 'अधिक व्याख्यात्मक रूप: ‘परमेश्वर मनुष्य नहीं कि उस पर दबाव डालकर उसे अपने अनुसार किया जा सके।’'
  rationale: यूनानी पाठ ‘मनुष्य/मनुष्य के पुत्र’ और दो निष्क्रिय क्रियाओं के स्पष्ट समानांतर को रखता है। चुना हुआ रूप इसी तनाव को बचाता है और पद से आगे कोई व्यापक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बंधक बनाना’ मूल के गिरवी-जमानत रूपक को हिन्दी में अपेक्षाकृत स्वाभाविक ढंग से सुरक्षित रखता है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
