review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the divine-human contrast, the two passive infinitives, and the literal parallelism of “man” and “son of man.” However, “बंधक मत बनाओ” normally means “do not take hostage” in modern Hindi and does not convey the Greek pledge/collateral image of ἐνεχυράζετε.
  naturalness: “गिरवी मत रखो” is the standard and immediately intelligible Hindi expression for pledging property. “राज़ी किया जाए” is more exact and less potentially colloquial than “मनाया जाए” for διαπεισθῆναι, while retaining the passive parallel.
  terminology: “प्रभु हमारे परमेश्वर” naturally expresses κύριος τοῦ θεοῦ ἡμῶν. “मनुष्य के पुत्र” preserves the source’s deliberate Semitic-style expression; the note appropriately prevents it from being read here as a messianic title.
  issues:
  - severity: medium
    issue: “बंधक मत बनाओ” misrenders the pledge metaphor.
    rationale: In current Hindi, “बंधक बनाना” means taking a person hostage. The Greek ἐνεχυράζετε concerns a pledge, security, or collateral, for which “गिरवी रखना” is the appropriate equivalent.
  - severity: low
    issue: “मनाया जाए” is less precise for διαπεισθῆναι.
    rationale: It can mean being coaxed or placated. “राज़ी किया जाए” more directly conveys being persuaded or induced, without expanding the sense.
