  yaml_path: translation/deuterocanon/judith/008/034.yaml
  text: But you must not investigate my action, for I will not tell you until what I am doing has been completed.
translation:
  language: hi
  text: पर तुम मेरे काम की छानबीन न करना, क्योंकि मैं तुम्हें तब तक नहीं बताऊँगी, जब तक कि जो कुछ मैं कर रही हूँ वह पूरा न हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερευνήσετε
  choice: छानबीन न करना
  rationale: यह क्रिया किसी बात को गहराई से खोजने या जाँचने का भाव रखती है। भविष्यकालीन रूप यहाँ निषेधात्मक निर्देश की तरह प्रयुक्त है; इसलिए आधुनिक हिन्दी में “छानबीन न करना” स्वाभाविक और अर्थनिष्ठ है।
- source_word: τὴν πρᾶξίν μου
  choice: मेरे काम
  rationale: πρᾶξις यूदीत के कार्य या कार्यवाही को दर्शाता है। “मेरे काम” मूल संज्ञात्मक अभिव्यक्ति को बनाए रखते हुए साधारण आधुनिक हिन्दी में सहज है और इसे केवल मन की योजना नहीं बनाता।
- source_word: οὐ γὰρ ἐρῶ ὑμῖν
  choice: क्योंकि मैं तुम्हें ... नहीं बताऊँगी
  rationale: ἐρῶ यहाँ जानकारी प्रकट करने के अर्थ में है। वक्ता यूदीत स्त्री है, इसलिए “बताऊँगी” प्रसंग और हिन्दी व्याकरण दोनों के अनुरूप है।
- source_word: ἕως τοῦ τελεσθῆναι
  choice: तब तक ... जब तक ... पूरा न हो जाए
  rationale: यह रचना उस समय-सीमा को व्यक्त करती है जिसके पूरा होने तक यूदीत मौन रहेगी। “पूरा न हो जाए” यूनानी के पूर्ण किए जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἃ ἐγὼ ποιῶ
  choice: जो कुछ मैं कर रही हूँ
  rationale: यह यूदीत के जारी कार्यों की ओर संकेत करता है। “कर रही हूँ” वर्तमान और प्रगतिशील भाव को स्पष्ट रखता है, जबकि “जो कुछ” बहुविध कार्यों या पूरी कार्यवाही—दोनों की गुंजाइश बनाए रखता है।
