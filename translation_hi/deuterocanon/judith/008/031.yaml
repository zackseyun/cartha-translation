base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/031.yaml
  text: And now pray for us[a], because you are a devout woman, and the Lord will send rain to fill our cisterns, and we will not perish any longer.
translation:
  language: hi
  text: और अब हमारे लिए प्रार्थना करो, क्योंकि तुम एक धर्मपरायण स्त्री हो, और प्रभु वर्षा भेजेगा कि हमारे जलकुंड भर जाएँ, और हम फिर अभाव में न रहेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम फिर कमी में न रहेंगे” अथवा “हमारा पानी फिर न चुकेगा।” यूनानी में शाब्दिक रूप से है, “हम फिर नहीं चुकेंगे।”
    reason: ἐκλείψομεν के अर्थ में कमी पड़ना, चुक जाना, या समाप्त होना—इन निकटवर्ती अर्थों की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: δεήθητι περὶ ἡμῶν
  choice: हमारे लिए प्रार्थना करो
  rationale: प्रार्थना के संदर्भ में δέομαι के साथ περί किसी के पक्ष में विनती करने का भाव देता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: γυνὴ εὐσεβὴς
  choice: परमेश्वर का भय माननेवाली स्त्री
  rationale: εὐσεβής परमेश्वर के प्रति श्रद्धा और भक्तिभाव को व्यक्त करता है। यह वाक्यांश उस धार्मिक आशय को स्पष्ट रखता है, यद्यपि संक्षिप्त विकल्प ‘भक्त स्त्री’ भी संभव है।
- source_word: ἀποστελεῖ Κύριος τὸν ὑετόν
  choice: प्रभु वर्षा भेजेगा
  rationale: भविष्यकाल ἀποστελεῖ को भविष्यकाल में रखा गया है; Κύριος के लिए ‘प्रभु’ और ὑετός के लिए सहज ‘वर्षा’ चुना गया है।
- source_word: εἰς πλήρωσιν τῶν λάκκων ἡμῶν
  choice: जिससे हमारे जलकुंड भर जाएँगे
  rationale: εἰς πλήρωσιν उद्देश्य अथवा परिणाम सूचित करता है। सूखे और जल-संचय के प्रसंग में λάκκοι को ‘जलकुंड’ कहना सामान्य ‘गड्ढों’ से अधिक सुसंगत है।
- source_word: οὐκ ἐκλείψομεν ἔτι
  choice: फिर हमें किसी बात की घटी न होगी
  rationale: ἐκλείπω में चुक जाने, अभाव में पड़ने या समाप्त हो जाने का व्यापक भाव है। यह अनुवाद जल की कमी के प्रसंग में स्वाभाविक है और ‘नाश न होंगे’ जैसी अधिक निश्चित व्याख्या से बचता है।
theological_decisions:
- issue: Κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में Κύριος है; ‘प्रभु’ उसी को सीधे प्रस्तुत करता है और पाठ में इब्रानी परमेश्वर-नाम को पुनःस्थापित नहीं करता।
- issue: ἐκλείψομεν में संकट का स्वरूप
  choice: हमें किसी बात की घटी न होगी
  alternative: हम नाश न होंगे
  rationale: क्रिया अभाव, चुक जाने या समाप्त होने—सभी अर्थ दे सकती है। तत्काल प्रसंग जलाभाव का है, इसलिए ‘घटी’ उपयुक्त है; अधिक तीव्र ‘नाश’ को निर्विवाद अर्थ बनाना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘जलकुंड’ प्राचीन वर्षाजल-संग्रह की परिस्थिति को स्पष्ट करता है। मुख्य पाठ में [a] चिह्न उसी पदांश के बाद रखा गया है जिसकी वैकल्पिक व्याख्याएँ पादटिप्पणी में दी गई हैं।
