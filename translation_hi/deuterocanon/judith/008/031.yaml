- from: और अब हमारे लिए प्रार्थना करो, क्योंकि तुम परमेश्वर का भय माननेवाली स्त्री हो। तब प्रभु वर्षा भेजेगा, जिससे हमारे जलकुंड भर जाएँगे, और फिर हमें किसी बात की घटी न होगी।[a]
  to: और अब हमारे लिए प्रार्थना करो, क्योंकि तुम एक धर्मपरायण स्त्री हो, और प्रभु वर्षा भेजेगा कि हमारे जलकुंड भर जाएँ, और हम फिर अभाव में न रहेंगे।[a]
  rationale: The revision removes the unsupported temporal connector, uses a natural broad equivalent for εὐσεβής, and replaces the non-idiomatic final clause with wording that fits the drought context without asserting the stronger meaning “we will not perish.” The footnote remains anchored to the final ambiguous clause and records viable contextual alternatives.
