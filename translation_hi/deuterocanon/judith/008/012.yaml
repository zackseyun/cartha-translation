base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/012.yaml
  text: And now[a], who are you, that you have put God to the test this day[b], and have set yourselves above God among the sons of men?
translation:
  language: hi
  text: और अब, तुम कौन हो, जो आज ही परमेश्वर को परख चुके हो और मनुष्यों[b] के बीच परमेश्वर की जगह[a] ले बैठे हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मनुष्यों के बीच परमेश्वर की ओर से बोल रहे हो?” यूनानी पदबंध संक्षिप्त है; इसमें प्रयुक्त संबंधबोधक अव्यय परमेश्वर की ओर से कार्य करने का भाव भी दे सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “मनुष्यों के पुत्रों”; यह इब्रानी शैली की अभिव्यक्ति नश्वर मानवजाति के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσατε
  choice: परख चुके हो
  rationale: πειράζω यहाँ परमेश्वर को बुराई के लिए लुभाने का नहीं, बल्कि धृष्टतापूर्वक उसकी परीक्षा लेने का भाव रखता है। ‘परख चुके हो’ यूनानी एओरिस्ट और फटकार—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: आज ही
  rationale: यूनानी में दुहराया हुआ काल-सूचक प्रयोग बल देता है। ‘आज ही’ आधुनिक हिन्दी में उसी तात्कालिक और जोरदार भाव को स्वाभाविक रूप से रखता है।
- source_word: ὑπεῖρ τοῦ θεοῦ
  choice: परमेश्वर की जगह ले बैठे हो
  rationale: ὑπέρ सामान्यतः ‘के लिए/की ओर से’ कह सकता है, पर इस प्रसंग में सुननेवालों द्वारा परमेश्वर के लिए समय-सीमा ठहराने और उसका अधिकार अपने हाथ में लेने की फटकार है। यह चयन उस आशय को व्यक्त करता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: ἐν μέσῳ υἱῶν ἀνθρώπων
  choice: मनुष्यों के बीच
  rationale: शाब्दिक वाक्यांश ‘मनुष्यों के पुत्रों के बीच’ है, जो इब्रानी शैली में नश्वर मानवजाति को दर्शाता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: τίνες ἐστὲ ὑμεῖς
  choice: तुम कौन हो
  rationale: यह तीखी आलंकारिक चुनौती है। ‘तुम कौन हो’ मूल के निकट रहते हुए हिन्दी में सीधा और प्रभावशाली है; ‘तुम अपने आपको क्या समझते हो’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: परमेश्वर के अधिकार के संबंध में फटकार का आशय
  choice: सुननेवालों को परमेश्वर की जगह लेनेवाले बताया गया है।
  alternative: वे परमेश्वर की ओर से बोल रहे हैं, अथवा अपने को परमेश्वर से ऊपर रख रहे हैं।
  rationale: यूनानी पदबंध संक्षिप्त और अर्थ की दृष्टि से खुला है। प्रसंग परमेश्वर के लिए शर्तें और समय-सीमा निर्धारित करने की धृष्टता पर बल देता है, इसलिए ‘परमेश्वर की जगह’ मुख्य पाठ के लिए उपयुक्त है; फिर भी ‘परमेश्वर की ओर से’ वाला वास्तविक भाषिक विकल्प पाद-टिप्पणी में रखा गया है और ‘ऊपर’ के अधिक कठोर अर्थ को मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘तुम’ बहुवचन संबोधन की तीखी फटकार को स्वाभाविक हिन्दी में बनाए रखता है। ‘आज ही’ मूल की कालगत तीव्रता व्यक्त करता है। पाद-टिप्पणी चिह्न उसी शब्द या खंड के पास रखे गए हैं जिससे वे संबंधित हैं।
