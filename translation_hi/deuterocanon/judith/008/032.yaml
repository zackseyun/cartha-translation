  text: And Judith said to them[a], “Listen to me[c][b], and I will do a deed that will reach to generation after generation among the sons of our people.”
translation:
  language: hi
  text: और यहूदीत ने उनसे कहा, “मेरी बात सुनो[a]। मैं एक ऐसा काम करूँगी, जो हमारे लोगों के पुत्रों तक[b] पीढ़ी-दर-पीढ़ी[c] पहुँचेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी सुनो।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “पुत्रों” है; यहाँ इसका प्रयोग सामूहिक अर्थ में “संतानों” या “वंशजों” के लिए भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “पीढ़ियों की पीढ़ियों तक”; अर्थात लगातार आने वाली पीढ़ियों तक।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσατέ μου
  choice: मेरी बात सुनो
  rationale: आज्ञार्थक अभिव्यक्ति का यह स्वाभाविक आधुनिक हिन्दी रूप है; इसमें ध्यान देकर सुनने का भाव बना रहता है।
- source_word: ποιήσω πρᾶγμα
  choice: मैं एक ऐसा काम करूँगी
  rationale: ποιέω और πρᾶγμα का संयुक्त अर्थ यहाँ किसी ठोस, उद्देश्यपूर्ण कार्य को करना है। स्त्रीलिंग क्रिया-रूप वक्ता यहूदीत के अनुरूप है।
- source_word: ἀφίξεται
  choice: पहुँचेगा
  rationale: क्रिया का मूल अर्थ ‘पहुँचना/आ पहुँचना’ है। यह अनुवाद भावी पीढ़ियों तक उस कार्य के पहुँचने की स्रोत-पाठ की अलंकारिक भाषा को बनाए रखता है।
- source_word: εἰς γενεὰς γενεῶν
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह हिन्दी में स्वाभाविक अभिव्यक्ति है और यूनानी पदबंध की पुनरावृत्ति तथा लगातार आने वाली पीढ़ियों का भाव सुरक्षित रखती है।
- source_word: υἱοῖς
  choice: पुत्रों तक
  rationale: स्रोत में स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्रों’ का प्रयोग है; मुख्य पाठ में उसे बनाए रखा गया है, जबकि संभावित सामूहिक अर्थ पादटिप्पणी में बताया गया है।
- source_word: τοῦ γένους ἡμῶν
  choice: हमारे लोगों के
  rationale: यहाँ γένος साझी जातीय अथवा वंशगत पहचान वाले जनसमूह को सूचित करता है। ‘हमारे लोग’ आधुनिक हिन्दी में स्पष्ट है और ‘जाति’ के संभावित आधुनिक सामाजिक अर्थों से बचता है।
theological_decisions:
- issue: υἱοῖς τοῦ γένους ἡμῶν में पुल्लिंग सामूहिक अभिव्यक्ति
  choice: हमारे लोगों के पुत्रों
  alternative: हमारे लोगों की संतानों / हमारे लोगों के वंशजों
  rationale: यूनानी पाठ में ‘पुत्र’ का पुल्लिंग बहुवचन है। उसे मुख्य पाठ में सुरक्षित रखा गया है, पर यह मानकर अर्थ को केवल पुरुषों तक सीमित नहीं किया गया; व्यापक सामूहिक अर्थ पादटिप्पणी में दर्ज है।
- issue: कार्य का भावी पीढ़ियों तक ‘पहुँचना’
  choice: जो ... पीढ़ी-दर-पीढ़ी पहुँचेगा
  alternative: जिसका प्रभाव ... पीढ़ी-दर-पीढ़ी बना रहेगा
  rationale: स्रोत-पाठ केवल ‘पहुँचेगा’ कहता है और यह स्पष्ट नहीं करता कि पहुँचने से प्रभाव, स्मृति या प्रसिद्धि अभिप्रेत है। इसलिए व्याख्यात्मक संज्ञा जोड़कर इस अर्थगत खुलेपन को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पीढ़ी-दर-पीढ़ी पहुँचेगा’ स्रोत की कुछ असामान्य पर अर्थपूर्ण अलंकारिक रचना को बनाए रखता है।
