translation:
  language: hi
  text: और कोई भी ऐसा नहीं था जिसने उसके विरुद्ध कोई बुरी बात कही, क्योंकि वह परमेश्वर का बहुत भय मानती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπήνεγκεν αὐτῇ ῥῆμα πονηρόν
  choice: उसके विरुद्ध कोई बुरी बात कही हो
  rationale: शाब्दिक अर्थ ‘उस पर/उसके विरुद्ध बुरा वचन लाया’ है। स्वाभाविक आधुनिक हिन्दी में यह किसी के विरुद्ध बुरी या दोष लगाने वाली बात कहने को व्यक्त करता है, बिना इसे निश्चित रूप से औपचारिक आरोप तक सीमित किए।
- source_word: ἐφοβεῖτο τὸν θεὸν
  choice: परमेश्वर का ... भय मानती थी
  rationale: यह हिन्दी बाइबलीय प्रयोग श्रद्धापूर्ण भय और गहरी भक्ति—दोनों के लिए स्थान बनाए रखता है; केवल ‘आदर करती थी’ कहना मूल की तीव्रता घटा देता।
- source_word: σφόδρα
  choice: बहुत
  rationale: मूल क्रियाविशेषण की प्रबल मात्रा को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के भय का स्वरूप
  choice: परमेश्वर का बहुत भय मानती थी
  alternative: परमेश्वर का बहुत आदर करती थी
  rationale: मूल φοβέομαι में भय और श्रद्धा का तनाव बना रहता है। ‘भय मानना’ इसे सुरक्षित रखता है और किसी विशेष व्याख्यात्मक परंपरा को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की कारणसूचक संरचना और मूल का नकारात्मक कथन सुरक्षित है।
