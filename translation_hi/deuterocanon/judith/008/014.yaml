  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘थाह पाना’ मानवीय और दैवी मन की अगम्यता से जुड़ी मूल अलंकारिक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है। हृदय, मन, बुद्धि और विचार के चयन से मूल के निकटवर्ती किंतु भिन्न आंतरिक-बोध संबंधी शब्दों का अंतर यथासंभव सुरक्षित है।
