base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/014.yaml
  text: For you will not find the depths of a man's heart[a], nor will you discern the words of his mind. So how will you search out God, who made all these things, and know his mind, and understand his thought? By no means, brothers[b], provoke the Lord our God.
translation:
  language: hi
  text: क्योंकि तुम मनुष्य के हृदय की गहराई नहीं पा सकोगे[a], और न उसके मन की बातों को समझ सकोगे। तो फिर जिस परमेश्वर ने यह सब बनाया है, उसे तुम कैसे खोजोगे? तुम उसकी बुद्धि को कैसे जानोगे और उसके विचार को कैसे समझोगे? कदापि नहीं, भाइयो[b], हमारे प्रभु परमेश्वर को क्रोधित मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘मनुष्य के हृदय की गहराई।’ यूनानी में ‘मनुष्य’ का एकवचन रूप है, जो यहाँ सामान्य रूप से सभी मनुष्यों का प्रतिनिधित्व करता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘भाइयो और बहनो।’ यूनानी में शाब्दिक रूप से ‘भाइयो’ है; पुल्लिंग संबोधन पूरे समुदाय के लिए समावेशी भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βάθος καρδίας ἀνθρώπου
  choice: मनुष्य के हृदय की गहराई
  rationale: βάθος के एकवचन रूप को ‘गहराई’ और καρδία को भीतरी व्यक्तित्व के केंद्र के अर्थ में ‘हृदय’ कहा गया है। ἀνθρώπου यहाँ प्रतिनिधिक एकवचन है; ‘मनुष्य’ आधुनिक हिन्दी में सामान्य मानव-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εὑρήσετε
  choice: पा सकोगे
  rationale: भविष्यत् कथन यहाँ मानवीय असमर्थता पर बल देता है। ‘नहीं पा सकोगे’ हिन्दी में उस आशय को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: λόγους τῆς διανοίας αὐτοῦ
  choice: उसके मन की बातें
  rationale: λόγους को केवल ‘विचार’ में समेटने के बजाय ‘बातें’ कहा गया है, जिससे भीतर के व्यक्त विचारों की छवि बनी रहती है; διάνοια के लिए ‘मन’ सहज हिन्दी है।
- source_word: διαλήμψεσθε
  choice: समझ सकोगे
  rationale: क्रिया का आशय स्पष्ट रूप से ग्रहण या पहचान सकना है। ‘समझ सकोगे’ साधारण आधुनिक हिन्दी में बोध की क्षमता को व्यक्त करता है।
- source_word: ἐρευνήσετε
  choice: थाह पाओगे
  rationale: यह गहराई से खोजने और पूरी तरह जान लेने का भाव देता है। परमेश्वर के अगम्य स्वरूप के संदर्भ में ‘थाह पाना’ स्वाभाविक हिन्दी मुहावरा है।
- source_word: ὃς ἐποίησεν τὰ πάντα ταῦτα
  choice: जिस परमेश्वर ने ये सब वस्तुएँ बनाई हैं
  rationale: संबंधवाचक उपवाक्य और πάντα ταῦτα दोनों सुरक्षित हैं। ‘बनाई’ ἐποίησεν का सीधा और व्यापक अनुवाद है।
- source_word: νοῦν αὐτοῦ
  choice: उसकी बुद्धि
  rationale: νοῦς यहाँ परमेश्वर की बोधशील मति को दर्शाता है। ‘बुद्धि’ चुनने से निकटवर्ती διάνοια के लिए प्रयुक्त ‘मन’ से शब्दगत भेद भी बना रहता है।
- source_word: λογισμὸν αὐτοῦ
  choice: उसके विचार
  rationale: λογισμός विचार, तर्क या योजना हो सकता है। ‘विचार’ व्यापकता बनाए रखता है और इसे विशेष रूप से ‘योजना’ या ‘निर्णय’ बनाकर अर्थ को सीमित नहीं करता।
- source_word: κατανοήσετε
  choice: समझोगे
  rationale: क्रिया ध्यानपूर्वक ग्रहण करने या समझने का भाव रखती है; ‘समझोगे’ स्पष्ट और स्वाभाविक है।
- source_word: μηδαμῶς
  choice: कदापि नहीं
  rationale: यह प्रबल निषेध है। ‘कदापि नहीं’ उसकी गंभीरता और जोर को गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी में पुल्लिंग बहुवचन संबोधन है। मुख्य पाठ में उसी रूप को रखा गया है, जबकि संभावित समावेशी संबोधन को पादटिप्पणी में बताया गया है।
- source_word: μὴ παροργίζετε
  choice: क्रोध न दिलाओ
  rationale: παροργίζω का कारक भाव किसी को क्रोधित करने या उकसाने का है। ‘क्रोध न दिलाओ’ इसे आधुनिक हिन्दी में सीधे व्यक्त करता है।
theological_decisions:
- issue: ἀνθρώπου का प्रतिनिधिक एकवचन
  choice: मनुष्य के हृदय की गहराई
  alternative: किसी पुरुष के हृदय की गहराई
  rationale: संदर्भ समस्त मानवजाति की ज्ञान-सीमा की बात करता है। हिन्दी ‘मनुष्य’ यूनानी के प्रतिनिधिक एकवचन को बनाए रखते हुए अर्थ को किसी एक पुरुष तक सीमित नहीं करता; स्रोत की व्याकरणिक विशेषता पादटिप्पणी में स्पष्ट है।
- issue: ἀδελφοί का सामुदायिक संबोधन
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ में यूनानी का स्पष्ट पुल्लिंग रूप सुरक्षित रखा गया है। चूँकि यह संबोधन उपस्थित पूरे समुदाय को समावेशी रूप से भी लक्ष्य कर सकता है, वह संभावना पादटिप्पणी में दी गई है।
- issue: परमेश्वर के νοῦς और λογισμός के बीच संबंध
  choice: बुद्धि और विचार
  alternative: मन और योजना
  rationale: दोनों यूनानी संज्ञाओं को अलग रखा गया है और λογισμός को निश्चित ‘योजना’ बनाकर किसी विशेष धर्मवैज्ञानिक निष्कर्ष में सीमित नहीं किया गया।
