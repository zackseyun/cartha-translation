  text: But we have acknowledged no other god except him[a]; therefore we hope that he will not disregard us[c][b], nor our people.
translation:
  language: hi
  text: परन्तु हमने उसके सिवा किसी दूसरे ईश्वर को स्वीकार नहीं किया है[a]; इसलिए हमें आशा है कि वह न हमारी उपेक्षा करेगा[b], न हमारे वंश में से किसी व्यक्ति की[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमने उसके सिवा किसी दूसरे ईश्वर को जाना नहीं’ अथवा ‘पहचाना नहीं’।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह हमें अनदेखा नहीं करेगा’।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से ‘हमारे γένος में से’; γένος का अर्थ वंश, कुल या एक ही मूल से जुड़ा जन-समुदाय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: स्वीकार नहीं किया है
  rationale: ἐπιγινώσκω यहाँ केवल बौद्धिक रूप से जानने के बजाय पहचानने या मान्यता देने का भाव रख सकता है। ईश्वर के प्रति अनन्य निष्ठा के इस प्रसंग में ‘स्वीकार’ स्वाभाविक है, जबकि पादटिप्पणी में ‘जाना’ और ‘पहचाना’ सुरक्षित रखे गए हैं।
- source_word: ἕτερον θεὸν ... πλὴν αὐτοῦ
  choice: उसके सिवा किसी दूसरे ईश्वर को
  rationale: यह रचना किसी अन्य देवता की मान्यता का निषेध करती है। ‘उसके सिवा’ πλήν के अपवादसूचक बल को और ‘किसी दूसरे ईश्वर’ ἕτερον θεόν को स्पष्ट रखता है।
- source_word: ὅθεν
  choice: इसलिए
  rationale: ὅθεν पिछले कथन से निकलने वाला निष्कर्ष प्रस्तुत करता है; आधुनिक हिन्दी में ‘इसलिए’ उस तार्किक संबंध को सहज ढंग से व्यक्त करता है।
- source_word: ἐλπίζομεν
  choice: हमें आशा है
  rationale: यह आशा या अपेक्षा व्यक्त करता है। ‘हमें आशा है’ विश्वासपूर्ण रुख को बनाए रखता है, पर उसे पूर्ण निश्चितता में नहीं बदलता।
- source_word: οὐχ ὑπερόψεται
  choice: उपेक्षा नहीं करेगा
  rationale: ὑπεροράω का अर्थ अनदेखा करना, ध्यान न देना या तुच्छ समझना हो सकता है। ‘उपेक्षा’ यहाँ ईश्वर द्वारा अपने लोगों पर ध्यान न देने के आशय को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἀπὸ τοῦ γένους ἡμῶν
  choice: हमारे वंश में से किसी की
  rationale: ἀπό के ‘में से’ संबंध और γένος के वंश/कुल/जन-समुदाय संबंधी अर्थ को बनाए रखने के लिए यह रूप चुना गया है। हिन्दी में वाक्य पूरा करने हेतु ‘किसी की’ निहित कर्म को स्पष्ट करता है।
theological_decisions:
- issue: एकमात्र ईश्वर की अनन्य स्वीकृति
  choice: ‘उसके सिवा किसी दूसरे ईश्वर को स्वीकार नहीं किया’
  alternative: ‘उसके सिवा किसी दूसरे ईश्वर की उपासना नहीं की’
  rationale: यूनानी क्रिया स्पष्ट रूप से ‘उपासना करना’ नहीं कहती, बल्कि जानने, पहचानने या स्वीकार करने को व्यक्त करती है। इसलिए अनन्यता का धार्मिक बल रखा गया है, पर उपासना की अतिरिक्त धारणा मुख्य पाठ में नहीं जोड़ी गई।
- issue: γένος द्वारा सूचित सामुदायिक पहचान
  choice: ‘हमारे वंश में से किसी की’
  alternative: ‘हमारे लोगों की’ या ‘हमारी जाति की’
  rationale: γένος में साझा उत्पत्ति और वंश का भाव है। ‘जाति’ आधुनिक हिन्दी में सामाजिक जाति-व्यवस्था का भ्रामक अर्थ दे सकती है, जबकि ‘लोग’ वंशगत पहलू को कम कर देता है। ‘वंश’ मूल की अस्पष्ट सामुदायिक-वंशगत पहचान को बेहतर बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ विरोधसूचक δέ को, और संतुलित ‘न…न…’ रचना दोनों कर्मों को स्पष्ट करती है। ‘जाति’ से संभावित आधुनिक सामाजिक भ्रम से बचते हुए ‘वंश’ चुना गया है।
