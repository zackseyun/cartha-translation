base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/035.yaml
  text: Then Uzziah and the rulers said to her[a], “Go in peace, and may the Lord God go before you for vengeance on our enemies.”
translation:
  language: hi
  text: तब उज्जियाह और शासकों ने उससे कहा, “शांति से जाओ, और प्रभु परमेश्वर हमारे शत्रुओं से बदला लेने के लिए तुम्हारे आगे-आगे जाए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे शत्रुओं के विरुद्ध प्रतिकार करने के लिए” या “हमारे शत्रुओं के विरुद्ध न्याय के लिए।” यूनानी शब्द दंडात्मक प्रतिकार या न्यायोचित प्रतिशोध का अर्थ दे सकता है; युद्ध के इस संदर्भ में ‘बदला’ उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: यह सामान्य कथात्मक क्रिया है; हिन्दी में ‘कहा’ स्वाभाविक और स्रोत के निकट है।
- source_word: Ὀζίας
  choice: उज्जियाह
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा में प्रचलित रूप में दिया गया है।
- source_word: οἱ ἄρχοντες
  choice: शासकों
  rationale: यह शब्द अधिकार रखने वाले लोगों को सूचित करता है; ‘शासक’ उसके आधिकारिक भाव को बनाए रखता है।
- source_word: Πορεύου εἰς εἰρήνην
  choice: शान्ति से जाओ
  rationale: विदाई और आशीष के पारंपरिक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Κύριος ὁ θεὸς
  choice: प्रभु परमेश्वर
  rationale: मूल यूनानी में कोई संबंधवाचक सर्वनाम नहीं है; यह पदवी-युग्म का स्वाभाविक हिन्दी रूप है।
- source_word: ἔμπροσθέν σου
  choice: तुम्हारे आगे-आगे जाए
  rationale: शाब्दिक ‘तुम्हारे आगे’ में प्रसंगगत गति और अगुवाई का भाव निहित है; ‘आगे-आगे जाए’ उसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰς ἐκδίκησιν τῶν ἐχθρῶν ἡμῶν
  choice: हमारे शत्रुओं से बदला लेने के लिए
  rationale: युद्ध और छुटकारे के प्रसंग में ἐκδίκησις दंडात्मक प्रतिकार को व्यक्त करता है; हिन्दी में ‘शत्रुओं से बदला लेना’ स्वाभाविक है और मूल की तीव्रता को कम नहीं करता।
theological_decisions:
- issue: व्यवस्थाविवरणोत्तर यूनानी संदर्भ में Κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: मूल पाठ में Κύριος है, चतुरक्षरीय इब्रानी नाम प्रत्यक्ष रूप से नहीं; इसलिए ‘प्रभु’ स्रोत-सम्मत है और अनावश्यक विशिष्टता नहीं जोड़ता।
- issue: ἐκδίκησις का अर्थ-बल
  choice: बदला
  alternative: न्याय / दोषमुक्ति
  rationale: शत्रुओं के विरुद्ध सैन्य छुटकारे का संदर्भ दंडात्मक प्रतिकार का समर्थन करता है। ‘न्याय’ अर्थ को अधिक अमूर्त और ‘दोषमुक्ति’ अधिक नरम कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘शान्ति से जाओ’ आशीर्वचन का भाव रखता है, जबकि ‘आगे-आगे जाए’ दैवी अगुवाई की गतिशील छवि को व्यक्त करता है।
