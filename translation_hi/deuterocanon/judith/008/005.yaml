  - marker: b
    text: टाट मोटा और खुरदरा कपड़ा था, जिसे शोक, दुःख या दीनता के चिह्न के रूप में पहना जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: σκηνήν
  choice: तंबू
  rationale: यह यूनानी शब्द सामान्यतः तंबू या अस्थायी आश्रय को दर्शाता है। ‘तंबू’ सीधा और सहज हिन्दी पर्याय है तथा संरचना का स्वरूप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπὶ τοῦ δώματος
  choice: अपने घर की छत पर
  rationale: इस प्रसंग में δῶμα घर की सपाट छत के उपयोग योग्य खुले भाग को दर्शाता है। आधुनिक हिन्दी में ‘घर की छत पर’ स्वाभाविक और स्पष्ट है।
- source_word: σάκκον
  choice: टाट
  rationale: σάκκος मोटे, खुरदरे कपड़े को दर्शाता है जिसे शोक, दुःख या दीनता के चिह्न के रूप में पहना जाता था। हिन्दी बाइबलीय प्रयोग में ‘टाट’ संक्षिप्त और परिचित है।
- source_word: ἐπὶ τὴν ὀσφὺν αὐτῆς
  choice: अपनी कमर पर ... बाँधा
  rationale: ὀσφύς कमर के भाग को दर्शाता है। वस्त्र धारण करने की क्रिया के लिए ‘कमर पर ... बाँधा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: उसके विधवापन के वस्त्र
  rationale: यह चयन यूनानी की औपचारिक संज्ञात्मक अभिव्यक्ति को बनाए रखता है और इन वस्त्रों को केवल ‘शोक के कपड़े’ कहकर अर्थ को सीमित नहीं करता।
- source_word: ἦν ἐπʼ αὐτῆς
  choice: उस पर थे
  rationale: यूनानी वाक्यांश अवस्था बताता है। ‘उस पर थे’ मूल की औपचारिकता और शाब्दिक बनावट को सुरक्षित रखता है, जबकि भाव यह है कि वह उन वस्त्रों को पहने रहती थी।
