  yaml_path: translation/deuterocanon/judith/008/027.yaml
  text: For he did not test us by fire, as he did them, to examine their hearts; nor has he taken vengeance on us. Rather, the Lord scourges those who draw near to him for admonition.
translation:
  language: hi
  text: क्योंकि उसने हमें उस तरह आग से नहीं परखा, जिस तरह उसने उनके हृदयों की जाँच के लिए उन्हें आग से परखा था; और न उसने हमसे बदला लिया है। बल्कि, प्रभु अपने निकट आने वालों को चेतावनी देने के लिए कोड़े लगाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कोड़े लगाता है” का अर्थ यहाँ सुधार के लिए दी जानेवाली कठोर ताड़ना है; इसका अनुवाद “अनुशासित करता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπύρωσεν
  choice: आग में डालकर ... परखा
  rationale: क्रिया में जलाने या आग की कसौटी का ठोस बिंब है; εἰς ἔτασμόν के साथ यह परीक्षा की अग्निमय प्रक्रिया को व्यक्त करती है।
- source_word: εἰς ἔτασμόν τῆς καρδίας αὐτῶν
  choice: उनके हृदयों को जाँचने के लिए
  rationale: यह प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है और καρδίας के बाइबलीय 'हृदय' को बनाए रखता है।
- source_word: ἐξεδίκησεν
  choice: बदला लिया
  rationale: यह दंड मात्र नहीं, प्रतिशोध या न्याय चुकाने की प्रबल धारणा को सुरक्षित रखता है और आगे के सुधारात्मक प्रहार से उसका विरोध स्पष्ट करता है।
- source_word: εἰς νουθέτησιν
  choice: चेताने के लिए
  rationale: νουθέτησις सुधार के उद्देश्य से दी गई चेतावनी या समझाइश है; यहाँ यह प्रतिशोध के विपरीत सुधारात्मक प्रयोजन बताती है।
- source_word: μαστιγοῖ
  choice: कोड़े लगाता है
  rationale: यह क्रिया के ठोस और कठोर प्रहार-बिंब को बनाए रखता है; केवल 'अनुशासित करता है' कहना उसकी तीव्रता घटा देता।
- source_word: Κύριος
  choice: प्रभु
  rationale: यह κύριος का प्रचलित, गरिमापूर्ण हिन्दी बाइबलीय समतुल्य है।
- source_word: τοὺς ἐγγίζοντας αὐτῷ
  choice: अपने निकट आनेवालों को
  rationale: यह परमेश्वर के समीप आने के धार्मिक और संबंधपरक संकेत को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: दैवी ताड़ना के कठोर बिंब को बनाए रखना या उसे सामान्य अनुशासन में नरम करना
  choice: प्रभु ... कोड़े लगाता है
  alternative: प्रभु ... को अनुशासित करता है
  rationale: मूल μαστιγοῖ सचमुच कोड़े लगाने का रूपक है। पद प्रतिशोध और पीड़ादायक किंतु सुधारात्मक ताड़ना के बीच तनाव रखता है; अनुवाद उसे नरम नहीं करता।
- issue: दैवी कार्य को प्रतिशोध के बजाय सुधारात्मक चेतावनी के रूप में व्यक्त करना
  choice: चेताने के लिए
  alternative: अनुशासन देने के लिए
  rationale: νουθέτησις का प्रयोजन चेतावनी और सुधार है। यह ἐξεδίκησεν के प्रतिशोधात्मक अर्थ से स्पष्ट भेद रखता है।
- issue: पहले खंड में सर्वनाम-संदर्भ की कठिनता
  choice: जैसा उसने उन्हें उनके हृदयों को जाँचने के लिए परखा था
  alternative: जैसा उसने उन्हें जलाया था, उनके हृदयों की जाँच के लिए
  rationale: यूनानी वाक्य में 'उन्हें' और 'उनके हृदयों' का संबंध बना रहता है। हिन्दी में क्रिया को दोहराना तुलना स्पष्ट करता है, जबकि अग्नि-परीक्षा का बिंब पहले ही रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय स्वर रखा गया है। 'आग में डालकर परखा', 'हृदय', 'बदला लिया' और 'कोड़े लगाता है' मूल के ठोस बिंब तथा प्रतिशोध और सुधारात्मक ताड़ना के बीच अंतर को सुरक्षित रखते हैं।
