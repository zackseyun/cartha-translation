lexical_decisions:
- source_word: ἦν
  choice: रही
  rationale: अपूर्णकालीन क्रिया और साथ आए वर्तमान कृदंत का संयुक्त भाव एक निरंतर अवस्था बताता है; हिन्दी में ‘रही’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰουδεὶθ
  choice: यहूदित
  rationale: यूनानी नाम का हिन्दी बाइबलीय रूप, जो उसके ध्वन्यात्मक स्वरूप के निकट है।
- source_word: ἐν τῷ οἴκῳ αὐτῆς
  choice: अपने घर में
  rationale: यह सीधा स्थानवाचक अनुवाद है; हिन्दी में कर्ता की ओर लौटते संबंध के लिए ‘अपने’ स्वाभाविक है।
- source_word: χηρεύουσα
  choice: विधवा के रूप में
  rationale: कृदंत यहूदित की जारी वैधव्य-अवस्था दर्शाता है, न केवल पति की मृत्यु की घटना।
- source_word: ἔτη τρία καὶ μῆνας τέσσορες
  choice: तीन वर्ष और चार महीने तक
  rationale: यूनानी में यह अवधि का कर्मकारक है; हिन्दी का ‘तक’ उस पूरी अवधि को सहज ढंग से व्यक्त करता है।
