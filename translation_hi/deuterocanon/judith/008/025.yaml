base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/025.yaml
  text: Besides all this[a], let us give thanks to the Lord our God[b], who tests us just as he also tested our fathers.
translation:
  language: hi
  text: इन सब बातों के होते हुए भी हम अपने प्रभु परमेश्वर को धन्यवाद दें, जो हमारी परीक्षा लेता है[a], ठीक जैसे उसने हमारे पुरखों[b] की भी परीक्षा ली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस क्रिया का अर्थ “परखता है” या “आज़माता है” भी हो सकता है; कुछ प्रसंगों में इसका अर्थ “प्रलोभन देता है” होता है। यहाँ आशय परीक्षा लेकर परखने से है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक अर्थ “हमारे पिता” है; यहाँ आशय पिछली पीढ़ियों के पुरखों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα πάντα
  choice: इन सब बातों के होते हुए भी
  rationale: यह स्वाभाविक हिन्दी में पूर्ववर्ती कठिन परिस्थितियों के बावजूद उचित प्रतिक्रिया व्यक्त करता है और यूनानी पदबंध की रियायती शक्ति बनाए रखता है।
- source_word: εὐχαριστήσωμεν
  choice: हम ... धन्यवाद दें
  rationale: पहले पुरुष बहुवचन के आग्रहसूचक संभावनार्थक रूप को सामूहिक प्रोत्साहन के रूप में व्यक्त करता है।
- source_word: Κυρίῳ τῷ θεῷ ἡμῶν
  choice: अपने प्रभु परमेश्वर को
  rationale: दैवी उपाधि और समुदाय के परमेश्वर से संबंध—दोनों को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: πειράζει
  choice: परीक्षा लेता है
  rationale: क्रिया के वर्तमान काल और इस प्रसंग में परखने की धारणा को व्यक्त करता है, बिना उसे नैतिक बुराई के लिए लुभाने के अर्थ तक सीमित किए।
- source_word: καθὰ καὶ
  choice: ठीक जैसे ... भी
  rationale: तुलना और καί के योगात्मक बल—दोनों को बनाए रखता है।
- source_word: τοὺς πατέρας ἡμῶν
  choice: हमारे पुरखों
  rationale: इस्राएल की पिछली पीढ़ियों के लिए प्रयुक्त पुरुषवाची पारिवारिक अभिव्यक्ति को आधुनिक, समझने योग्य हिन्दी में रखता है।
theological_decisions:
- issue: परमेश्वर के कर्ता होने पर πειράζει का अर्थ
  choice: परीक्षा लेता है
  alternative: परखता है; आज़माता है; प्रलोभन देता है
  rationale: संदर्भ में वर्तमान संकट की तुलना पुरखों के अनुभव से है। ‘परीक्षा लेता है’ दैवी परख का भाव और उससे जुड़ा धर्मवैचारिक तनाव बनाए रखता है, जबकि ‘प्रलोभन देता है’ अनावश्यक रूप से नैतिक बुराई की ओर उकसाने का अर्थ ला सकता है।
- issue: τοὺς πατέρας ἡμῶν का रूप
  choice: हमारे पुरखों
  alternative: हमारे पूर्वजों; हमारे पितरों
  rationale: ‘पुरखे’ स्रोत के पुरुषवाची पारिवारिक रूप को बचाता है और सामान्य आधुनिक पाठक के लिए ‘पितर’ की अपेक्षा अधिक सहज है।
translation_notes:
  register: भाषा आधुनिक, सामुदायिक और गरिमापूर्ण रखी गई है। ‘अपने प्रभु परमेश्वर’ हिन्दी में संबंधसूचक भाव को स्वाभाविक बनाता है; ‘परीक्षा लेता है’ सामान्य वर्तमान में चल रही परिस्थिति पर भी लागू होता है।
