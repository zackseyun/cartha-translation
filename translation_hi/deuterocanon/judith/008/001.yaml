base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/001.yaml
  text: And in those days Judith heard[a], the daughter of Merari son of Ox son of Joseph son of Oziel son of Elkiah son of Eliou son of Chelkias son of Eliab son of Nathanael son of Salamiel son of Sarasadai son of Israel.
translation:
  language: hi
  text: उन दिनों यहूदित ने सुना[a]। वह मरारी की बेटी थी; मरारी ओक्स का पुत्र था, ओक्स योसेफ का पुत्र था, योसेफ ओजिएल का पुत्र था, ओजिएल एल्केया का पुत्र था, एल्केया एलीऊ का पुत्र था, एलीऊ खेल्कियास का पुत्र था, खेल्कियास एलेआब का पुत्र था, एलेआब नतनाएल का पुत्र था, नतनाएल सलामिएल का पुत्र था, सलामिएल सरसदाई का पुत्र था, और सरसदाई इस्राएल का पुत्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में यह नहीं बताया गया कि यहूदित ने क्या सुना; यह बात अगले पदों में आगे बताई जाती है। वंशावली के कई नाम उन नामों के यूनानी रूप हैं जो इब्रानी परंपरा में दूसरे रूपों में अधिक परिचित हैं; जैसे ओजिएल को उज्जीएल और सरसदाई को सूरीशद्दै से जोड़ा जा सकता है। मुख्य पाठ अनुमानित इब्रानी रूपों के बजाय यूनानी साक्ष्य का अनुसरण करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: सुना
  rationale: यूनानी क्रिया का सीधा अर्थ ‘सुना’ है। इस पद में सुनी गई बात का कर्म नहीं दिया गया, इसलिए ‘समाचार सुना’ या ‘पता चला’ जोड़ना उचित नहीं।
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों
  rationale: यह स्वाभाविक हिन्दी में प्रचलित कालसूचक अभिव्यक्ति है और यूनानी कथात्मक लय को बनाए रखती है।
- source_word: θυγάτηρ
  choice: बेटी
  rationale: वंशावली में स्त्री-संबंध का स्पष्ट और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: υἱοῦ
  choice: का पुत्र था
  rationale: बार-बार आए संबंधकारक वंशसूत्र ‘फलाँ का पुत्र’ को स्पष्ट करते हैं। हिन्दी में प्रत्येक नाम के साथ केवल ‘पुत्र’ दोहराने के बजाय पूर्ण संबंधों में प्रस्तुत करने से आशय स्पष्ट और वाक्य स्वाभाविक रहता है।
- source_word: Ἰουδεὶθ
  choice: यहूदित
  rationale: यूनानी नाम का हिन्दी में प्रचलित बाइबलीय रूप, जो स्रोत-रूप के निकट भी है।
- source_word: Μεραρὶ / Ὢξ / Ἰωσὴφ / Ὀζιὴλ / Ἐλκεία / Ἠλειοὺ / Χελκείου / Ἐλεὰβ / Ναθαναὴλ / Σαλαμιὴλ / Σαρασαδαὶ / Ἰσραήλ
  choice: मरारी / ओक्स / योसेफ / ओजिएल / एल्केया / एलीऊ / खेल्केयुस / एलेआब / नतनाएल / सलामिएल / सरसदाई / इस्राएल
  rationale: मुख्य पाठ यूनानी साक्ष्य के नाम-रूपों का देवनागरी लिप्यंतरण करता है; अनुमानित इब्रानी मूल रूपों को चुपचाप स्थापित नहीं करता। Χελκείου विभक्ति-रूप को उसके यूनानी नामरूप Χελκείας के अनुरूप ‘खेल्केयुस’ से दर्शाया गया है।
