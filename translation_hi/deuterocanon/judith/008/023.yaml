  text: क्योंकि हमारी दासता कृपादृष्टि की ओर नहीं मोड़ी जाएगी,[a] बल्कि प्रभु हमारा परमेश्वर उसे अपमान में बदल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि हमारी दासता का रुख कृपादृष्टि की ओर नहीं होगा, बल्कि प्रभु हमारा परमेश्वर उसे अपमान में बदल देगा।”
    reason: κατευθυνθήσεται εἰς χάριν के दिशात्मक रूपक का एक स्वाभाविक वैकल्पिक अनुवाद; ‘कृपादृष्टि’ यहाँ सामाजिक अनुकूलता को सूचित करता है।
lexical_decisions:
- source_word: κατευθυνθήσεται
  choice: का परिणाम ... होगा
  rationale: भविष्यत् कर्मवाच्य क्रिया यहाँ किसी दिशा या अंतिम परिणाम तक पहुँचने का भाव देती है। हिन्दी में ‘का परिणाम ... होगा’ इस प्रसंगगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δουλεία
  choice: दासता
  rationale: यह शब्द अधीनता या बँधी हुई दास-अवस्था को दर्शाता है; ‘दासता’ उसकी कठोरता को ‘सेवा’ जैसे नरम शब्द से कम नहीं करता।
- source_word: εἰς χάριν
  choice: कृपा
  rationale: यहाँ χάρις का अर्थ सामाजिक या राजनीतिक कृपादृष्टि/पक्षपातपूर्ण अनुकूलता है, न कि अनिवार्य रूप से उद्धार-संबंधी ‘अनुग्रह’। सहज हिन्दी में ‘कृपा’ इस अर्थ को रखती है।
- source_word: ἀτιμίαν
  choice: अपमान
  rationale: ἀτιμία मान-हानि, अनादर या बदनामी को सूचित करता है। ‘अपमान’ कृपा से होने वाले अनुकूल परिणाम के स्पष्ट विपरीत को व्यक्त करता है।
- source_word: θήσει αὐτήν
  choice: उसे ... में बदल देगा
  rationale: τίθημι यहाँ परिणामस्वरूप किसी अवस्था में कर देने का अर्थ रखता है। ‘में बदल देगा’ आधुनिक हिन्दी में उस परिणामी भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: प्रभु हमारा परमेश्वर
  rationale: यह पदबंध मूल यूनानी की उपाधि और संबंध—‘प्रभु’ तथा ‘हमारा परमेश्वर’—दोनों को बनाए रखता है।
theological_decisions:
- issue: इस्राएल की पराधीन अवस्था के लिए δουλεία का अनुवाद
  choice: दासता
  alternative: बंधन; पराधीनता
  rationale: प्रसंग केवल सामान्य सेवा का नहीं, अपमानजनक अधीनता का है। इसलिए अधिक प्रबल ‘दासता’ चुना गया है।
- issue: गैर-उद्धारात्मक प्रसंग में χάρις का अनुवाद
  choice: कृपा
  alternative: अनुग्रह; कृपादृष्टि
  rationale: यहाँ विरोध ‘अपमान’ से है, इसलिए आशय अनुकूल व्यवहार या कृपादृष्टि है। ‘कृपा’ सरल है और पद में कोई अतिरिक्त सिद्धान्तगत अर्थ नहीं जोड़ती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। मुख्य पाठ में यूनानी की दिशात्मक अभिव्यक्ति को स्वाभाविक परिणामवाचक हिन्दी में रखा गया है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
