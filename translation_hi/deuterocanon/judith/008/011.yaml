base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/011.yaml
  text: And they came to her[a], and she said to them, “Listen to me, rulers of those who dwell in Bethulia, for your word that you spoke against the people on this day is not right, and you have set up the oath that you spoke between God and yourselves, and said that you would hand over the city to our enemies if within these days the Lord does not turn back to help you.”
translation:
  language: hi
  text: और वे उसके पास आए। तब उसने उनसे कहा, “बैतूलिया में रहनेवालों के शासकों, मेरी बात सुनो। जो बात तुमने आज लोगों के विरुद्ध कही है, वह ठीक नहीं है। तुमने परमेश्वर और अपने बीच उस शपथ को ठहरा दिया है, जिसके विषय में तुमने कहा कि यदि इन्हीं दिनों में[a] प्रभु तुम्हारी सहायता करने के लिए न लौटे, तो तुम नगर को हमारे शत्रुओं के हाथ सौंप दोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “यदि उनमें नहीं” है; “उनमें” से सम्भवतः शपथ में पहले निर्धारित दिनों का संकेत है।
    reason: मूल पाठ के स्त्रीलिंग बहुवचन सर्वनाम का संदर्भ इस वाक्य में स्पष्ट नहीं है; अनुवाद में प्रसंगानुसार ‘इन्हीं दिनों में’ कहा गया है।
lexical_decisions:
- source_word: ἄρχοντες
  choice: शासको
  rationale: यह संबोधन नगर पर अधिकार रखनेवाले पदाधिकारियों के लिए है; ‘शासक’ उनके प्रशासनिक अधिकार को स्पष्ट रखता है।
- source_word: τῶν κατοικούντων ἐν Βαιτυλουά
  choice: बैतूलिया में रहनेवालों के
  rationale: कृदन्त κατοικούντων की क्रियात्मकता को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: οὐκ εὐθὺς ὁ λόγος ὑμῶν
  choice: जो बात तुमने ... कही है, वह ठीक नहीं है
  rationale: εὐθύς का मूल भाव ‘सीधा’ है, पर यहाँ नैतिक और व्यावहारिक औचित्य अभिप्रेत है; ‘ठीक नहीं’ हिन्दी का स्वाभाविक समतुल्य है।
- source_word: ἐναντίον τοῦ λαοῦ
  choice: लोगों के विरुद्ध
  rationale: ἐναντίον में ‘सामने’ और ‘विरुद्ध’ दोनों संभावनाएँ हैं; इस प्रसंग में निर्णय लोगों के अहित में होने के कारण ‘विरुद्ध’ उपयुक्त है।
- source_word: ἐστήσατε τὸν ὅρκον
  choice: उस शपथ को ठहरा दिया है
  rationale: ἵστημι के स्थापित या ठहराने के बिंब को रखा गया है और इसे केवल ‘शपथ खाई’ में समेटा नहीं गया।
- source_word: ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν
  choice: परमेश्वर और अपने बीच
  rationale: यह परमेश्वर और शासकों के बीच शपथ के गंभीर बंधन को दर्शाता है; ‘अपने’ प्रतिवाचक बल को बनाए रखता है।
- source_word: ἐκδώσειν τὴν πόλιν
  choice: नगर को ... के हाथ सौंप दोगे
  rationale: ἐκδίδωμι यहाँ नगर के समर्पण का अर्थ देता है; हिन्दी में ‘के हाथ सौंपना’ स्पष्ट और स्वाभाविक है।
- source_word: ἐὰν μὴ ἐν αὐταῖς
  choice: यदि इन्हीं दिनों में ... न
  rationale: स्त्रीलिंग बहुवचन सर्वनाम का व्यक्त संज्ञा यहाँ नहीं है, पर पूर्वप्रसंग में निर्धारित दिनों की अवधि है; पाठ में इसे स्पष्ट किया गया और शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν
  choice: प्रभु तुम्हारी सहायता करने के लिए न लौटे
  rationale: ἐπιστρέφω की लौटने या फिरने की गति को बनाए रखते हुए संक्षिप्त यूनानी रचना को समझने योग्य हिन्दी दी गई है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος परमेश्वर के लिए प्रयुक्त धार्मिक संबोधन है; ‘प्रभु’ उसका प्रचलित, गरिमापूर्ण और प्रसंगानुकूल हिन्दी रूप है।
- issue: ἐναντίον τοῦ λαοῦ की प्रसंगगत दिशा
  choice: लोगों के विरुद्ध
  alternative: लोगों के सामने
  rationale: यूनानी पद दोनों अर्थ दे सकता है। जूडिथ की फटकार उस निर्णय के लोगों के विरुद्ध या अहितकारी होने पर केंद्रित है, इसलिए मुख्य पाठ में ‘विरुद्ध’ चुना गया है, बिना कोई संप्रदायगत अर्थ जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन में बहुवचन ‘तुम’ रखा गया है। ‘बैतूलिया’ स्थान-नाम का हिन्दी लिप्यंतरण है। मुख्य पाठ में [a] उसी खंड के बाद रखा गया है जिसकी अंतर्निहित संज्ञा यूनानी में अस्पष्ट है।
