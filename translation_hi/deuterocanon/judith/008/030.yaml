  text: But the people became very thirsty[a], and they compelled us to do as we had said to them, and to bring upon ourselves an oath that we will not break.
translation:
  language: hi
  text: पर लोग बहुत प्यासे हो गए, और उन्होंने हमें विवश किया कि हमने उनसे जैसा कहा था, वैसा ही करें और अपने ऊपर ऐसी शपथ ले लें[a], जिसे हम नहीं तोड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने ऊपर शपथ ले आएँ”; अर्थात अपने आपको शपथ से बाँध लें।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησεν σφόδρα
  choice: बहुत प्यासे हो गए
  rationale: सामूहिक एकवचन ὁ λαός के साथ क्रिया और σφόδρα की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἠνάγκασαν
  choice: विवश किया
  rationale: यह प्रबल दबाव अथवा बाध्यता का भाव देता है और प्रसंग की गरिमा बनाए रखता है।
- source_word: ποιῆσαι ἡμᾶς καθὰ ἐλάλησαν αὐτοῖς
  choice: कि हमने उनसे जैसा कहा था, वैसा ही करें
  rationale: प्राप्त यूनानी वाक्य-विन्यास में पुरुष-संबंधी असंगति है; प्रसंग में इसका आशय अगुओं द्वारा लोगों से पहले कही गई बात के अनुसार कार्य करना है। अनुवाद उस अर्थ को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: ἐπαγαγεῖν ἐφʼ ἡμᾶς ὅρκον
  choice: अपने ऊपर ऐसी शपथ ले लें
  rationale: यूनानी मुहावरे ‘अपने ऊपर शपथ लाना’ का अर्थ अपने को शपथ से बाँधना है। मुख्य पाठ में बोधगम्य हिन्दी दी गई है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ὃν οὐ παραβησόμεθα
  choice: जिसे हम नहीं तोड़ेंगे
  rationale: शपथ के साथ παραβαίνω का स्वाभाविक हिन्दी अर्थ ‘शपथ तोड़ना’ है।
