  text: For this reason our fathers were handed over to the sword and to plundering, and they fell in a great slaughter before our enemies.
translation:
  language: hi
  text: इसी कारण हमारे पुरखे तलवार और लूट के हवाले कर दिए गए, और वे हमारे शत्रुओं के सामने बड़ी संख्या में मारे गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “वे एक बड़े शव-पुंज के रूप में गिरे”; यह असामान्य अभिव्यक्ति बड़ी संख्या में मारे गए लोगों की ओर संकेत करती है।
    reason: πτῶμα μέγα की असामान्य शाब्दिक छवि और उसके सामूहिक युद्ध-मृत्यु के अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: ὧν χάριν
  choice: इसी कारण
  rationale: यह कारणसूचक पदबंध है; निकटवर्ती संदर्भ से संबंध रखते हुए आधुनिक हिन्दी में स्वाभाविक रूप से कारण व्यक्त करता है।
- source_word: ἐδόθησαν
  choice: हवाले कर दिए गए
  rationale: निष्क्रिय क्रिया को बनाए रखते हुए शत्रु की सत्ता और विपत्ति के अधीन कर दिए जाने का भाव स्पष्ट करता है।
- source_word: εἰς ῥομφαίαν
  choice: तलवार के हवाले
  rationale: युद्ध में तलवार से मृत्यु के यूनानी मुहावरे को हिन्दी के परिचित बाइबलीय मुहावरे में व्यक्त करता है।
- source_word: εἰς διαρπαγήν
  choice: लूट के हवाले
  rationale: διαρπαγή वस्तुओं के बलपूर्वक छीने या लूटे जाने को सूचित करता है; समानांतर रचना को भी बनाए रखा गया है।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पुरखे
  rationale: यह पूर्वज पिताओं के ऐतिहासिक समूह को दर्शाता है; ‘पुरखे’ आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और स्रोत के पुरुषवाची रूप के अनुरूप है।
- source_word: ἔπεσον πτῶμα μέγα
  choice: बड़ी संख्या में मारे गए
  rationale: शाब्दिक अभिव्यक्ति ‘एक बड़ा पड़ा हुआ शव/पतन’ हिन्दी में अस्वाभाविक है; संदर्भ में इसका आशय भारी जनहानि है, जिसे स्पष्ट रखते हुए पादटिप्पणी में मूल रूप बताया गया है।
- source_word: ἐνώπιον τῶν ἐχθρῶν ἡμῶν
  choice: हमारे शत्रुओं के सामने
  rationale: ἐνώπιον का स्थानिक/उपस्थितिपरक अर्थ स्वाभाविक और औपचारिक हिन्दी में सुरक्षित है।
theological_decisions:
- issue: पूर्वजों के लिए पुरुषवाची पैतृक पद
  choice: हमारे पुरखे
  alternative: हमारे पूर्वज
  rationale: यूनानी πατέρες स्पष्टतः पैतृक, पुरुषवाची ऐतिहासिक पद है। ‘पुरखे’ उस रंग को बनाए रखता है, जबकि ‘पूर्वज’ अधिक लिंग-निरपेक्ष हो सकता है।
- issue: πτῶμα μέγα की संक्षिप्त और असामान्य छवि
  choice: बड़ी संख्या में मारे गए
  alternative: एक बड़ा शव-समूह बनकर गिर पड़े
  rationale: यूनानी वाक्यांश भारी युद्धजनित मृत्यु को व्यक्त करता है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया है, पर मूल की असामान्य शव/गिरने की छवि को पादटिप्पणी में सुरक्षित रखा गया है; किसी अतिरिक्त दैवी या सिद्धान्तगत कारण को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण ऐतिहासिक-बाइबलीय शैली। ‘हवाले कर दिए गए’ मूल के निष्क्रिय भाव को, और ‘पुरखे’ पैतृक ऐतिहासिक भाषा को बनाए रखता है।
