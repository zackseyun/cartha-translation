  yaml_path: translation/deuterocanon/judith/008/010.yaml
  text: And she sent her maid[a], who was in charge of all that belonged to her, and summoned Chabris and Charmis, the elders of her city.
translation:
  language: hi
  text: उसने अपनी सेविका[a] को, जो उसकी सारी संपत्ति की देखरेख करती थी, भेजकर अपने नगर के पुरनियों खाब्रीस और खार्मीस को बुलवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दासी’ अथवा ‘परिचारिका।’ यूनानी शब्द ἅβρα स्त्री परिचारिका को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστείλασα
  choice: भेजकर
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की सहायक क्रिया बताता है; ‘भेजकर ... बुलवाया’ हिन्दी में स्वाभाविक रूप से क्रियाक्रम और सेविका के माध्यम को व्यक्त करता है।
- source_word: ἅβραν
  choice: सेविका
  rationale: यह शब्द स्त्री परिचारिका या घरेलू दासी को सूचित करता है। ‘सेविका’ आधुनिक, सम्मानपूर्ण और सहज है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς
  choice: जो उसकी सारी संपत्ति की देखरेख करती थी
  rationale: ἐφεστῶσαν किसी कार्य या वस्तुओं पर नियुक्त निगरानी को और ὑπάρχουσιν उसकी संपत्ति/माल-असबाब को दर्शाता है; यह अनुवाद सेविका की प्रबंधकीय जिम्मेदारी स्पष्ट रखता है।
- source_word: ἐκάλεσεν
  choice: बुलवाया
  rationale: यूदित ने सेविका को भेजकर नगर के पुरनियों को अपने पास बुलाया; हिन्दी का प्रेरणार्थक रूप माध्यम और उद्देश्य दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Χαβρεὶν καὶ Χαρμεῖν
  choice: खाब्रीस और खार्मीस
  rationale: व्यक्तिवाचक नामों को यूनानी ध्वनियों के निकट देवनागरी में लिप्यंतरित किया गया है; अंतिम यूनानी विभक्ति-रूप के स्थान पर प्रचलित नामरूप रखा गया है।
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως αὐτῆς
  choice: अपने नगर के पुरनियों
  rationale: यहाँ πρεσβύτεροι केवल अधिक आयु के पुरुष नहीं, बल्कि नगर के मान्य अगुए हैं। ‘पुरनियों’ बाइबलीय हिन्दी में इस सामाजिक पद को संक्षेप और गरिमा से व्यक्त करता है, और ‘अपने’ αὐτῆς के संबंध को स्पष्ट करता है।
