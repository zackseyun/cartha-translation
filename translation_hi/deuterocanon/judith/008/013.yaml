base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/013.yaml
  text: And now you are testing the Lord Almighty[b][a], and you will never understand anything.
translation:
  language: hi
  text: और अब तुम सर्वशक्तिमान प्रभु को परख रहे हो[a], और कभी भी[b] कुछ नहीं समझ सकोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सर्वशक्तिमान प्रभु की जाँच कर रहे हो” अथवा “सर्वशक्तिमान प्रभु की थाह लेने का प्रयत्न कर रहे हो।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “युग तक।” इस मुहावरे का अर्थ यहाँ “सदा” या “कभी नहीं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάζετε
  choice: परख रहे हो
  rationale: यह क्रिया किसी की जाँच, छानबीन या परीक्षा करने का भाव रखती है। यहाँ यह परमेश्वर के विषय में मनुष्यों की धृष्टतापूर्ण जाँच को व्यक्त करती है; ‘परख रहे हो’ इस बहुअर्थकता को सहज हिन्दी में बनाए रखता है।
- source_word: κύριον Παντοκράτορα
  choice: सर्वशक्तिमान प्रभु
  rationale: ‘प्रभु’ κύριος का प्रतिष्ठित दैवी संबोधन है और ‘सर्वशक्तिमान’ Παντοκράτωρ की प्रभुसत्ता तथा सामर्थ्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐθὲν
  choice: कुछ नहीं
  rationale: यह यूनानी निषेध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐπιγνώσεσθε
  choice: समझ सकोगे
  rationale: संदर्भ में क्रिया का आशय केवल किसी तथ्य को जानना नहीं, बल्कि परमेश्वर को पूर्णतः समझ पाने से है। ‘समझ सकोगे’ इस ज्ञानात्मक बल को स्पष्ट करता है।
- source_word: ἕως τοῦ αἰῶνος
  choice: कभी भी
  rationale: शाब्दिक रूप से यह ‘युग तक’ है, पर यहाँ मुहावरे के रूप में स्थायी निषेध व्यक्त करता है। ‘कभी भी ... नहीं’ आधुनिक हिन्दी में ‘कदापि नहीं/सदा तक नहीं’ का स्वाभाविक समतुल्य है।
theological_decisions:
- issue: व्यवस्थाविवरणेतर यूनानी संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος परमेश्वर की उपाधि है और Παντοκράτωρ के साथ आया है; इसलिए ‘प्रभु’ दैवी संबोधन को ‘स्वामी’ से अधिक स्पष्ट और प्रतिष्ठित रूप में रखता है।
- issue: ἐξετάζετε में परमेश्वर के प्रति मानवीय जाँच का भाव
  choice: तुम ... परख रहे हो
  alternative: तुम ... की छानबीन कर रहे हो / तुम ... की परीक्षा ले रहे हो
  rationale: ‘परखना’ जाँचने और परीक्षा करने—दोनों संभावित अर्थों को खुला रखता है। इससे अनुचित मानवीय छानबीन पर पद की फटकार बनी रहती है, पर पाठ में किसी विशेष प्रलोभन या परीक्षा की धारणा अनावश्यक रूप से नहीं जोड़ी जाती।
- issue: ἕως τοῦ αἰῶνος की कालगत शक्ति
  choice: कभी भी ... नहीं
  alternative: युग तक ... नहीं / सदा तक ... नहीं
  rationale: प्रसंग में यह वाक्यांश स्थायी मानवीय असमर्थता व्यक्त करता है। मुहावरेदार हिन्दी अर्थ को स्पष्ट करती है, जबकि पाद-टिप्पणी शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परख रहे हो’ मूल क्रिया की जाँचने और परीक्षा करने की वास्तविक अर्थ-सीमा बनाए रखता है; ‘कभी भी ... नहीं’ यूनानी कालगत मुहावरे को स्वाभाविक हिन्दी निषेध में व्यक्त करता है।
