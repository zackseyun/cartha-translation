  yaml_path: translation/deuterocanon/judith/007/015.yaml
  text: And you will repay them with an evil recompense[b][a], because they rebelled and did not meet you in peace.
translation:
  language: hi
  text: और तू उन्हें बुरा प्रतिफल देगा, क्योंकि उन्होंने विद्रोह किया और वे तेरे सामने शांति से मिलने नहीं आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “तू उन्हें बुरा प्रतिदान देगा।” यूनानी में ‘प्रतिदान देना’ के लिए एक ही मूल की क्रिया और संज्ञा का प्रयोग है, जो प्रतिफल देने की बात पर बल देता है। “तेरे सामने शांति से मिलने नहीं आए” का अनुवाद “शांति से तुझसे मिलने के लिए आगे नहीं आए” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσεις … ἀνταπόδομα πονηρόν
  choice: बुरा प्रतिफल देगा
  rationale: क्रिया और उसी मूल की संज्ञा मिलकर प्रतिदान की बात पर बल देती हैं। हिन्दी में दोनों को ज्यों का त्यों दोहराने से वाक्य अस्वाभाविक होता; ‘प्रतिफल देगा’ उस भाव को स्वाभाविक रूप से व्यक्त करता है और ‘बुरा’ πονηρόν की कठोरता बनाए रखता है।
- source_word: ἀνθʼ ὧν
  choice: के बदले
  rationale: यह केवल कारण नहीं, बल्कि किए गए काम के प्रत्युत्तर में मिलने वाले प्रतिफल का संबंध भी व्यक्त करता है; ‘के बदले’ इस पारस्परिक भाव को सुरक्षित रखता है।
- source_word: ἐστασίασαν
  choice: विद्रोह करने
  rationale: यह क्रिया विद्रोही अथवा बगावती रुख अपनाने का अर्थ देती है; ‘विद्रोह करना’ आधुनिक मानक हिन्दी में स्पष्ट और सटीक है।
- source_word: οὐκ ἀπήντησαν τῷ προσώπῳ σου
  choice: तेरे सामने न आने
  rationale: ἀπαντάω में मिलने के लिए आगे आने का भाव हो सकता है, और ‘तेरे सामने’ προσώπῳ σου की उपस्थितिपरक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν εἰρήνῃ
  choice: शान्ति से
  rationale: यह शांतिपूर्ण ढंग अथवा शांतिपूर्ण मंशा—दोनों की सम्भावना खुली रखता है।
theological_decisions:
- issue: ईश्वर से कहे गए भविष्यकालीन प्रतिफल का स्वरूप
  choice: 'सीधे संबोधन में निश्चित भविष्यवचन: ‘तू … देगा’'
  alternative: 'प्रार्थनात्मक आज्ञार्थ: ‘तू … दे’'
  rationale: यूनानी पाठ में भविष्यकाल है। प्रसंग में यह प्रार्थना या भरोसे से कही गई अपेक्षा हो सकती है, पर हिन्दी अनुवाद व्याकरणिक भविष्यकाल को बनाए रखकर उस तनाव का निर्णय नहीं करता।
- issue: दण्ड के नैतिक वर्णन में πονηρόν
  choice: ‘बुरा प्रतिफल’
  alternative: ‘कठोर दण्ड’
  rationale: ‘बुरा’ मूल विशेषण की सीधी कठोरता और संभावित असहजता को बनाए रखता है; ‘कठोर दण्ड’ अर्थ की व्याख्या करके नैतिक तनाव को कम कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्रार्थना के सीधे संबोधन को बनाए रखने के लिए एकवचन ‘तू/तेरे’ रखा गया है। संज्ञेय पुनरुक्ति को मुख्य पाठ में स्वाभाविक हिन्दी बनाया गया और उसका मूल भाषिक बल पादटिप्पणी में बताया गया है।
