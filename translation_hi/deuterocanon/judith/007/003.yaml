  text: And they encamped in the valley near Bethulia[a], by the spring, and they extended in breadth toward Dothaim as far as Belbaim, and in length from Bethulia as far as Cyamon, which is opposite Esdraelon.
translation:
  language: hi
  text: और उन्होंने बैतूलिया के पास घाटी[a] में, सोते के निकट, पड़ाव डाला। उनका पड़ाव चौड़ाई में दोतैम की दिशा में बेलबैम तक और लंबाई में बैतूलिया से क्यामोन तक फैला हुआ था; क्यामोन एस्द्रेलोन के सामने है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द αὐλών का अर्थ कुछ संदर्भों में “आँगन” भी हो सकता है, पर यहाँ सोते और आसपास के भौगोलिक स्थानों का उल्लेख “घाटी” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλον
  choice: पड़ाव डाला
  rationale: सैन्य दल के शिविर लगाने के लिए आधुनिक और स्वाभाविक हिन्दी अभिव्यक्ति; यूनानी क्रिया के सैनिक संदर्भ को बनाए रखती है।
- source_word: ἐν τῷ αὐλῶνι
  choice: घाटी में
  rationale: यहाँ सोते और अन्य भौगोलिक स्थानों के उल्लेख से αὐλών का अर्थ भवन का आँगन नहीं, बल्कि घाटी या पहाड़ी द्रोणी है।
- source_word: πλησίον Βαιτυλουὰ
  choice: बैतूलिया के पास
  rationale: πλησίον की स्थान-सूचक निकटता को सीधे व्यक्त करता है; स्थान-नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: ἐπὶ τῆς πηγῆς
  choice: सोते के निकट
  rationale: πηγή प्राकृतिक जलस्रोत या सोते को दर्शाता है। हिन्दी में यह पद स्थल-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παρέτειναν
  choice: फैला हुआ था
  rationale: क्रिया यहाँ शिविर के भौगोलिक विस्तार को बताती है; हिन्दी वाक्य को स्वाभाविक बनाने के लिए कर्ता के रूप में 'उनका पड़ाव' स्पष्ट किया गया है।
- source_word: εἰς εὖρος
  choice: चौड़ाई में
  rationale: शिविर के एक आयाम को दर्शाता है और आगे आने वाले 'लंबाई में' के साथ स्पष्ट समानांतर बनाता है।
- source_word: ἐπὶ Δοθαειμ ἕως Βελβαΐμ
  choice: दोतैम की दिशा में बेलबैम तक
  rationale: ἐπί को दिशासूचक रखते हुए आरंभ-बिंदु को अनावश्यक रूप से निश्चित नहीं किया गया है।
- source_word: εἰς μῆκος
  choice: लंबाई में
  rationale: शिविर के दूसरे आयाम को स्पष्ट करता है और εἰς εὖρος के साथ संतुलन बनाए रखता है।
- source_word: ἕως Βαιτυλουὰ ἕως Κυαμῶνος
  choice: बैतूलिया से क्यामोन तक
  rationale: दोहराए गए ἕως से व्यक्त विस्तार को स्वाभाविक हिन्दी में 'से ... तक' द्वारा प्रस्तुत किया गया है; पहले संबंधसूचक पद का निहित होना स्वीकार किया गया है।
- source_word: ἀπέναντι Ἐσδρηλών
  choice: यिज्रेल के सामने
  rationale: ἀπέναντι का भौगोलिक अर्थ आमने-सामने या सामने स्थित होना है। Ἐσδρηλών के लिए प्रचलित बाइबिलीय हिन्दी नाम 'यिज्रेल' अपनाया गया है।
