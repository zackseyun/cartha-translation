lexical_decisions:
- source_word: ἀναλαβόντες
  choice: उठा लिए
  rationale: यह कृदन्त युद्ध के लिए हथियार हाथ में लेने और तैयार होने का भाव देता है; ‘उठा लिए’ स्वाभाविक और सटीक है।
- source_word: ἕκαστος
  choice: उनमें से हर एक
  rationale: यूनानी शब्द का वितरणात्मक अर्थ स्पष्ट रखता है और मूल में न होने वाले लिंग-सूचक शब्द को नहीं जोड़ता।
- source_word: τὰ σκεύη τὰ πολεμικὰ αὐτῶν
  choice: अपने युद्ध के हथियार
  rationale: σκεύη का अर्थ व्यापक रूप से उपकरण हो सकता है, पर πολεμικά और सैन्य प्रसंग यहाँ ‘हथियार’ को उपयुक्त बनाते हैं; αὐτῶν को ‘अपने’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἀνακαύσαντες πυράς
  choice: आग जलाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई कार्रवाई दिखाता है; ‘जलाकर’ वही क्रम संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: ἐπὶ τοὺς πύργους αὐτῶν
  choice: अपने बुर्जों पर
  rationale: ἐπί यहाँ स्थान का बोध देता है। सैन्य संरचना के लिए ‘बुर्ज’ आधुनिक हिन्दी में ‘मीनार’ से अधिक प्रसंगानुकूल है।
- source_word: ἔμενον φυλάσσοντες
  choice: पहरा देते रहे
  rationale: ἔμενον और वर्तमान कृदन्त का मेल लगातार जारी चौकसी को व्यक्त करता है; ‘देते रहे’ अवधि और सतर्कता दोनों को सहज हिन्दी में रखता है।
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: उस पूरी रात
  rationale: यह चयन पूरी अवधि और उस विशिष्ट रात के संकेत—दोनों को सुरक्षित रखता है।
