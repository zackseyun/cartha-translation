  yaml_path: translation/deuterocanon/judith/007/012.yaml
  text: Remain by your camp, securing every man from your force, and let your servants gain control of the spring of water that comes out from the foot of the mountain,
translation:
  language: hi
  text: अपनी सेना के हर पुरुष को सुरक्षित रखते हुए अपनी छावनी में ही ठहरे रहो; और तुम्हारे सेवक[a] उस जल के सोते पर अधिकार कर लें, जो पहाड़ की तलहटी[b] से निकलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे अधीनस्थ पुरुष”; यूनानी शब्द सेवकों, परिचारकों या अधीनस्थों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “पहाड़ की जड़”; यहाँ अर्थ पहाड़ का निचला भाग या तलहटी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάμεινον
  choice: ठहरे रहो
  rationale: आज्ञार्थक क्रिया किसी स्थान पर बने रहने का निर्देश देती है; ‘ठहरे रहो’ सैन्य प्रसंग में स्वाभाविक है और केवल प्रतीक्षा करने का भाव नहीं देता।
- source_word: παρεμβολῆς
  choice: छावनी
  rationale: सैन्य प्रसंग में यह शब्द सेना के पड़ाव या शिविर को सूचित करता है; ‘छावनी’ संक्षिप्त और स्पष्ट हिन्दी है।
- source_word: ἀσφαλίζων
  choice: सुरक्षित रखते हुए
  rationale: वर्तमान कृदन्त मुख्य आज्ञा के साथ चल रही सुरक्षा की कार्रवाई व्यक्त करता है।
- source_word: πάντα ἄνδρα ἐκ τῆς δυνάμεώς σου
  choice: अपनी सेना के हर पुरुष को
  rationale: πάντα ἄνδρα का वितरणात्मक और पुरुषवाची रूप ‘हर पुरुष’ में रखा गया है; δύναμις यहाँ अमूर्त सामर्थ्य नहीं, सैन्य बल को दर्शाता है।
- source_word: ἐπικρατησάτωσαν
  choice: अधिकार कर लें
  rationale: यह क्रिया किसी वस्तु या स्थान पर प्रभुत्व अथवा नियंत्रण प्राप्त करने का भाव देती है; जल-स्रोत के सामरिक प्रसंग में ‘अधिकार कर लें’ उपयुक्त है।
- source_word: οἱ παῖδές σου
  choice: तुम्हारे सेवक
  rationale: παῖδες का सीधा अर्थ सेवक या परिचारक हो सकता है, यद्यपि सैन्य प्रसंग में यह अधीनस्थ पुरुषों को भी सूचित कर सकता है; इस अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: πηγῆς τοῦ ὕδατος
  choice: जल-स्रोत
  rationale: यह ठोस प्राकृतिक जलधारा या सोते को दर्शाता है; ‘जल-स्रोत’ आधुनिक हिन्दी में स्पष्ट है और प्रसंग में किसी सामान्य जल-आपूर्ति के बजाय निश्चित स्रोत का बोध कराता है।
- source_word: ἐκπορεύεται
  choice: निकलता है
  rationale: क्रिया का मूल भाव बाहर आने या निकलने का है; ‘बहता है’ की अपेक्षा यह स्रोत की क्रिया के अधिक निकट है।
- source_word: ῥίζης τοῦ ὄρους
  choice: पहाड़ की जड़
  rationale: मूल पाठ का स्थलाकृतिक रूपक जानबूझकर सुरक्षित रखा गया है; हिन्दी में भी इसका अर्थ पहाड़ का निचला भाग समझा जा सकता है, जबकि पादटिप्पणी अधिक सामान्य विकल्प देती है।
