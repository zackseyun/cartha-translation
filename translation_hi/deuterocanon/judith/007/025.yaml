  yaml_path: translation/deuterocanon/judith/007/025.yaml
  text: And now there is no one to help us[a]; rather, God has delivered us into their hands[c][b], to be laid low before them in thirst and great destruction.
translation:
  language: hi
  text: और अब हमारी सहायता करनेवाला कोई नहीं है; बल्कि परमेश्वर ने हमें उनके हाथों में बेच दिया है[a], ताकि हम उनके सामने प्यास और भारी विनाश की दशा में धराशायी हो जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके हाथों में सौंप दिया है।” यूनानी क्रिया का शाब्दिक अर्थ “बेच दिया है” है; यह शत्रु की सत्ता में दे दिए जाने का अधिक प्रबल रूपक है।
    reason: lexical_alternative
  - marker: b
    text: “प्यास और भारी विनाश की दशा में” का अनुवाद “प्यास और भारी विनाश के कारण” भी हो सकता है। यूनानी वाक्यांश पतन की परिस्थिति अथवा उसके साधन को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βοηθός
  choice: हमारी सहायता करनेवाला
  rationale: संज्ञा का व्यक्तिगत अर्थ ‘हमारा सहायक’ है; यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उस भाव को स्पष्ट करता है।
- source_word: πέπρακεν
  choice: बेच दिया है
  rationale: πράσκω का मूल अर्थ ‘बेचना’ है। यह शत्रु की सत्ता में सौंप दिए जाने का तीखा रूपक है, इसलिए इसे केवल ‘सौंप दिया’ कहकर नरम नहीं किया गया।
- source_word: εἰς τὰς χεῖρας αὐτῶν
  choice: उनके हाथों
  rationale: यह किसी की सत्ता में दे दिए जाने का परिचित बाइबिलीय मुहावरा है और हिन्दी में स्वाभाविक है।
- source_word: τοῦ καταστρωθῆναι
  choice: धराशायी हो जाएँ
  rationale: यह पराजित होकर गिरा दिए जाने या मिट्टी में बिछा दिए जाने का भाव देता है; ‘धराशायी’ पराजय और पतन दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἐναντίον αὐτῶν
  choice: उनके सामने
  rationale: यहाँ स्थानिक और संबंधपरक अर्थ उपयुक्त है—शत्रुओं की उपस्थिति में धराशायी होना।
- source_word: ἐν δίψει
  choice: प्यास के कारण
  rationale: ἐν परिस्थिति अथवा साधन दोनों सूचित कर सकता है। इस संदर्भ में प्यास उनके पतन का कारण है; इसकी संभावित परिस्थितिजन्य व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: ἀπωλείᾳ μεγάλῃ
  choice: भारी विनाश
  rationale: ἀπώλεια का अर्थ विनाश या बरबादी है। ‘भारी विनाश’ μεγάλῃ की तीव्रता बनाए रखता है और अनावश्यक बाद की धर्मवैज्ञानिक छाया नहीं जोड़ता।
theological_decisions:
- issue: लोगों की पराजय में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर ने हमें उनके हाथों बेच दिया है
  alternative: परमेश्वर ने हमें उनके हाथों सौंप दिया है
  rationale: वक्ता विपत्ति का कारण स्पष्ट रूप से परमेश्वर के कार्य को मानता है। ‘बेच दिया’ यूनानी क्रिया के प्रबल रूपक और कथन के धर्मवैज्ञानिक तनाव दोनों को बनाए रखता है।
