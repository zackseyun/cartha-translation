    reason: lexical_alternative
lexical_decisions:
- source_word: Κρῖναι
  choice: न्याय करे
  rationale: अओरिस्ट ऑप्टेटिव यहाँ इच्छा अथवा गंभीर निवेदन व्यक्त करता है; हिन्दी में ‘परमेश्वर ... न्याय करे’ इस भाव को स्वाभाविक रूप से रखता है।
- source_word: ἀνὰ μέσον ὑμῶν καὶ ἡμῶν
  choice: तुम्हारे और हमारे बीच
  rationale: यह दो पक्षों के बीच निर्णय करने का मुहावरा है; चुना हुआ रूप स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: ἐποιήσατε ἐν ἡμῖν ἀδικίαν μεγάλην
  choice: हमारे साथ बड़ा अन्याय किया है
  rationale: यह अनुवाद ἀδικία के नैतिक और न्यायिक बल को बनाए रखते हुए हिन्दी में सहज है।
- source_word: οὐ λαλήσαντες εἰρηνικὰ
  choice: शान्ति की बात न करके
  rationale: εἰρηνικά शान्तिपूर्ण बातों अथवा शान्ति की शर्तों का संकेत दे सकता है; यह रूप मूल की अभिव्यक्ति और उसकी कुछ व्यापकता को सुरक्षित रखता है।
- source_word: μετὰ υἱῶν Ἀσσούρ
  choice: अश्शूर के पुत्रों से
  rationale: यूनानी के शाब्दिक ‘अश्शूर के पुत्र’ को मुख्य पाठ में रखा गया है; प्रसंग में इसका आशय अश्शूरियों से है।
theological_decisions:
- issue: ईश्वरीय न्याय की विनती
  choice: परमेश्वर तुम्हारे और हमारे बीच न्याय करे
  alternative: परमेश्वर तुम्हारे और हमारे बीच निर्णय करे
  rationale: यह परमेश्वर से मध्यस्थ न्यायाधीश के रूप में अपील है। ‘न्याय करे’ विनती/कामना के बल को रखता है और कोई अतिरिक्त सैद्धान्तिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘शान्ति की बात’ मूल की वाचिक अभिव्यक्ति को बनाए रखती है, और जातिवाचक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
