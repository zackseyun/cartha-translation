base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/011.yaml
  text: And now[a], master, do not fight against them as in a pitched battle, and not one man from your people will fall.
translation:
  language: hi
  text: और अब, स्वामी, उनसे मोर्चाबंद युद्ध न कीजिए[a], और आपकी प्रजा का एक भी पुरुष नहीं गिरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे उस रीति से युद्ध न कीजिए जैसे मोर्चाबंद युद्ध लड़ा जाता है।” यूनानी पदबंध सेनाओं के पंक्तिबद्ध होकर किए जाने वाले पारंपरिक युद्ध की ओर संकेत करता है।
    reason: यूनानी πόλεμος παρατάξεως में युद्ध के लिए सेना की मोर्चाबंदी का बिंब है। मुख्य पाठ इसे स्वाभाविक हिन्दी में व्यक्त करता है, और पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
lexical_decisions:
- source_word: δέσποτα
  choice: स्वामी
  rationale: यह किसी मानवीय अधिकारी को किया गया सम्मानपूर्ण सीधा संबोधन है। ‘स्वामी’ δέσποτα की अधिकार-सूचक भावना को व्यक्त करता है और इसे κύριος के सामान्य अनुवाद ‘प्रभु’ से अलग रखता है।
- source_word: μὴ πολέμει
  choice: युद्ध न कीजिए
  rationale: μή के साथ वर्तमान आज्ञार्थक क्रिया निषेध व्यक्त करती है। आदरसूचक एकवचन संबोधन के अनुरूप ‘न कीजिए’ स्वाभाविक हिन्दी है।
- source_word: καθὼς γίνεται πόλεμος παρατάξεως
  choice: मोर्चा बाँधकर आमने-सामने युद्ध
  rationale: παράταξις सेनाओं के युद्ध के लिए पंक्तिबद्ध या मोर्चाबंद होने को दर्शाता है। यह रूप परंपरागत खुले, आमने-सामने के युद्ध की सैन्य छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: οὐ πεσεῖται
  choice: नहीं गिरेगा
  rationale: सैन्य प्रसंग में πίπτω युद्ध में गिरने, प्रायः मारे जाने, को सूचित कर सकता है। ‘गिरेगा’ मूल रूपक और उसकी अंतर्निहित अस्पष्टता दोनों को सुरक्षित रखता है।
- source_word: ἀνὴρ εἷς
  choice: एक भी पुरुष
  rationale: यूनानी में पुरुषवाचक एकवचन संज्ञा के साथ संख्या ‘एक’ पर स्पष्ट बल है; ‘एक भी पुरुष’ उसी बल को बनाए रखता है।
- source_word: λαοῦ σου
  choice: आपकी प्रजा
  rationale: λαός का सामान्य अर्थ ‘लोग’ या ‘प्रजा’ है। सैन्य प्रसंग के बावजूद मूल पाठ ‘सेना’ या ‘सैनिक’ जैसा विशिष्ट शब्द नहीं कहता; ‘प्रजा’ संबोधित शासक के लोगों के अर्थ में स्वाभाविक है।
theological_decisions:
- issue: मानवीय अधिकारी के लिए प्रयुक्त संबोधन δέσποτα को κύριος से अलग रखना
  choice: स्वामी
  alternative: प्रभु; अधिपति; मालिक
  rationale: यहाँ संबोधन परमेश्वर का नहीं, एक मानवीय वरिष्ठ का है। ‘स्वामी’ अधिकार और सम्मान व्यक्त करता है, जबकि ‘प्रभु’ से होने वाला κύριος के साथ अनावश्यक विलय टलता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सैन्य प्रसंग के अनुकूल रखी गई है। ‘मोर्चा बाँधकर आमने-सामने’ साधारण पाठक के लिए बोधगम्य है और यूनानी की युद्ध-विन्यास संबंधी छवि को बनाए रखता है। संबोधन में आदरसूचक ‘आप’ का प्रयोग किया गया है।
