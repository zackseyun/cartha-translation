base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/027.yaml
  text: For it is better for us to become plunder for them[a]; for we will become servants, and our lives will be spared, and we will not see with our own eyes the death of our little children[d][c][b], and our wives and our children breathing out their lives.
translation:
  language: hi
  text: क्योंकि हमारे लिए यह बेहतर है कि हम उनकी लूट का माल[a] बन जाएँ; क्योंकि हम दास बनेंगे और हमारा जीवन बचा रहेगा[b], और हम अपनी आँखों के सामने[c] अपने नन्हे बच्चों की मृत्यु, और अपनी पत्नियों और बच्चों के प्राण निकलते हुए[d] नहीं देखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लूट” अथवा “युद्ध की लूट।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हमारा प्राण जीवित रहेगा।”
    reason: lexical_alternative
  - marker: c
    text: या “अपनी आँखों से।”
    reason: lexical_alternative
  - marker: d
    text: यूनानी में इसका भाव है कि उनका जीवन क्षीण होकर समाप्त हो रहा है, अर्थात वे सामने मर रहे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: बेहतर
  rationale: यह तुलनात्मक विशेषण परिस्थितियों में अधिक लाभकारी विकल्प को दर्शाता है; ‘बेहतर’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: γενηθῆναι αὐτοῖς εἰς διαρπαγήν
  choice: उनके लिए लूट का माल बन जाएँ
  rationale: वाक्यांश विजेताओं द्वारा लूट के रूप में पकड़ लिए जाने की कठोर स्थिति व्यक्त करता है; यह अनुवाद उस प्रत्यक्षता को बनाए रखता है।
- source_word: δούλους
  choice: दास
  rationale: विजय और आत्मसमर्पण के संदर्भ में यह स्वेच्छा से की जाने वाली सेवा नहीं, बल्कि बलपूर्वक अधीनता का संकेत देता है।
- source_word: ζήσεται ἡ ψυχὴ ἡμῶν
  choice: हमारा जीवन बचा रहेगा
  rationale: शाब्दिक रूप ‘हमारा प्राण जीवित रहेगा’ है; यहाँ आशय मृत्यु से बचकर जीवित रहने का है।
- source_word: τὸν θάνατον τῶν νηπίων ἡμῶν
  choice: अपने नन्हे बच्चों की मृत्यु
  rationale: νήπια बहुत छोटे बच्चों या शिशुओं को सूचित कर सकता है; ‘नन्हे बच्चे’ करुण भाव बनाए रखते हुए आयु को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: अपनी आँखों के सामने
  rationale: यह प्रत्यक्ष रूप से किसी घटना का साक्षी होने पर बल देने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: ἐκλειπούσας τὰς ψυχὰς αὐτῶν
  choice: प्राण निकलते हुए
  rationale: ἐκλείπω यहाँ जीवन के क्षीण होकर समाप्त होने को दर्शाता है; ‘प्राण निकलना’ मृत्यु-दृश्य की ठोसता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: विजय के संदर्भ में δοῦλος का अर्थ
  choice: दास
  alternative: सेवक
  rationale: यहाँ लोग मृत्यु के बदले बलपूर्वक अधीनता स्वीकार करने की बात कर रहे हैं; इसलिए ‘दास’ बंधुआ और अनैच्छिक स्थिति को ‘सेवक’ से अधिक स्पष्ट रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर और मार्मिक शैली रखी गई है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है; ‘दास’ विजय के बाद की अनैच्छिक अधीनता को स्पष्ट करता है, और अंतिम खंड में मूल यूनानी की दोहरी अभिव्यक्ति—नन्हे बच्चों की मृत्यु तथा पत्नियों और बच्चों के प्राण निकलना—सुरक्षित रखी गई है।
