  yaml_path: translation/deuterocanon/judith/007/010.yaml
  text: For this people[a], the sons of Israel, do not rely on their spears, but on the heights of their mountains, in which they themselves dwell[b]; for it is not easy to approach the summits of their mountains.
translation:
  language: hi
  text: क्योंकि इस्राएल के पुत्रों की यह प्रजा[a] अपने भालों पर नहीं, बल्कि अपने पहाड़ों की उन ऊँचाइयों पर भरोसा करती है, जिनमें वे स्वयं बसे हुए हैं; क्योंकि उनके पहाड़ों की चोटियों तक पहुँचना[b] आसान नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल की सन्तान” अथवा “इस्राएली।” यूनानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके पहाड़ों की चोटियों पर चढ़ना।” यूनानी क्रिया ऊँचे भूभाग की ओर ऊपर बढ़ने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς οὗτος τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों की यह प्रजा
  rationale: यह पदबंध λαός की सामूहिकता और υἱῶν Ἰσραήλ के शाब्दिक पुरुषवाचक रूप—दोनों को सुरक्षित रखता है; आधुनिक हिन्दी में वाक्य भी स्पष्ट रहता है।
- source_word: οὐ πέποιθαν ἐπὶ τοῖς δόρασιν αὐτῶν
  choice: अपने भालों पर भरोसा नहीं करती
  rationale: πέποιθαν स्थिर भरोसे को व्यक्त करता है और δόρασιν विशेष रूप से ‘भालों’ को, न कि सामान्य हथियारों को।
- source_word: ἀλλʼ ἐπὶ τοῖς ὕψεσι τῶν ὀρέων αὐτῶν
  choice: बल्कि अपने पहाड़ों की ऊँचाइयों पर
  rationale: ὕψεσι का स्थलाकृतिक अर्थ ‘ऊँचाइयाँ’ है; इससे किसी धार्मिक ‘ऊँचे स्थान’ का अनावश्यक भाव नहीं आता।
- source_word: ἐν οἷς αὐτοὶ ἐνοικοῦσιν ἐν αὐτοῖς
  choice: जहाँ वे स्वयं बसे हुए हैं
  rationale: यह αὐτοὶ के बलाघात को ‘स्वयं’ से बनाए रखता है, पर यूनानी की दोहरावपूर्ण संरचना को अस्वाभाविक हिन्दी में नहीं दोहराता।
- source_word: οὐ γὰρ ἔστιν εὐχερές
  choice: क्योंकि ... आसान नहीं है
  rationale: εὐχερές का सीधा और स्वाभाविक हिन्दी समतुल्य ‘आसान’ है।
- source_word: προσβῆναι ταῖς κορυφαῖς τῶν ὀρέων αὐτῶν
  choice: उनके पहाड़ों की चोटियों तक पहुँचना
  rationale: प्रसंग में προσβῆναι लक्ष्य की ओर बढ़ने या ऊपर चढ़कर पहुँचने का बोध दे सकता है; ‘तक पहुँचना’ इसकी व्यापकता बनाए रखता है और κορυφαῖς को ‘चोटियों’ के रूप में स्पष्ट करता है।
