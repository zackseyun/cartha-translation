  text: And the whole camp of Assyria remained around them—the foot soldiers and chariots and their horsemen—for thirty-four days; and all the water containers of all the inhabitants of Bethulia ran out,
translation:
  language: hi
  text: और अश्शूर की सारी छावनी—उसके पैदल सैनिक, रथ और घुड़सवार—चौंतीस दिन तक उन्हें चारों ओर से घेरे रही; और बैतूलुआ के सभी निवासियों के पानी के सारे बरतन खाली हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴ Ἀσσούρ
  choice: अश्शूर की सारी छावनी
  rationale: παρεμβολή यहाँ घेराबंदी करने वाली सैन्य छावनी/सेना को दर्शाता है; निकटवर्ती सैनिक वर्गों की सूची के साथ ‘छावनी’ स्वाभाविक और स्रोत-संगत है।
- source_word: ἔμεινεν κύκλῳ αὐτῶν
  choice: उन्हें चारों ओर से घेरे रही
  rationale: κύκλῳ का घेराव-संबंधी अर्थ स्पष्ट रखते हुए ἔμεινεν की निरंतरता को ‘रही’ से व्यक्त किया गया है।
- source_word: οἱ πεζοὶ καὶ ἅρματα καὶ οἱ ἱππεῖς αὐτῶν
  choice: उसके पैदल सैनिक, रथ और घुड़सवार
  rationale: तीनों सैन्य घटकों को सीधे और क्रम के अनुसार रखा गया है; αὐτῶν का संबंध अश्शूरी छावनी से ‘उसके’ द्वारा व्यक्त है।
- source_word: ἡμέρας τριάκοντα τέσσαρες
  choice: चौंतीस दिन तक
  rationale: अवधि का सामान्य आधुनिक हिन्दी रूप।
- source_word: ἐξέλιπεν ... πάντα τὰ ἀγγεῖα ... τῶν ὑδάτων
  choice: पानी के सारे बरतन खाली हो गए
  rationale: ἐκλείπω का मूल भाव समाप्त हो जाने/चुक जाने का है। यूनानी वाक्य में व्याकरणिक कर्ता ‘बरतन’ हैं, इसलिए हिन्दी में ‘बरतन खाली हो गए’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Βαιτυλουά
  choice: बैतूलुआ
  rationale: यूनानी स्थाननाम का निकट देवनागरी लिप्यंतरण।
