  yaml_path: translation/deuterocanon/judith/007/032.yaml
  text: And he dispersed the people to their camp[a], and they went away to the walls and towers of their city, and he sent the women and children to their houses[b]; and they were in great humiliation in the city.
translation:
  language: hi
  text: और उसने लोगों को उसके शिविर में तितर-बितर कर दिया, और वे अपने नगर की दीवारों और बुर्जों पर चले गए[a]। उसने स्त्रियों और बच्चों को उनके घरों को भेज दिया; और वे नगर में बड़ी दीन-दशा में थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘चला गया’ क्रिया एकवचन है, पर सन्दर्भ संकेत करता है कि दीवारों और बुर्जों पर जाने वाले वे लोग थे जिन्हें तितर-बितर किया गया था।
    reason: textual_variant
  - marker: b
    text: या, “बहुत अपमान, कष्ट, या दुर्दशा में थे।” यूनानी पद ऐसी दशा का संकेत करता है जिसमें लोग बहुत नीचे गिरा दिए गए हों; इसमें अपमान, पीड़ा और दुःख के भाव सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκόρπισεν
  choice: तितर-बितर कर दिया
  rationale: यह क्रिया एकत्र समूह को अलग-अलग फैला देने का भाव व्यक्त करती है। हिन्दी में यह पद उस गति को स्वाभाविक रूप से व्यक्त करता है, यद्यपि सन्दर्भ में इसका अर्थ भय से भागना नहीं, बल्कि लोगों को अलग-अलग भेजना है।
- source_word: λαόν
  choice: लोगों
  rationale: यहाँ शब्द केवल सैनिकों के लिए सीमित नहीं है, बल्कि एकत्र जनसमूह के लिए प्रयुक्त हुआ है।
- source_word: παρεμβολήν
  choice: शिविर
  rationale: सैन्य और घेराबन्दी के सन्दर्भ में ‘शिविर’ इसका सीधा और सहज हिन्दी रूप है।
- source_word: ἀπῆλθεν
  choice: वे ... चले गए
  rationale: यूनानी क्रिया एकवचन है, पर निकटवर्ती सन्दर्भ में नगर की शहरपनाह और बुर्जों की ओर जाने वाले बिखेरे गए लोग समझे जाते हैं। हिन्दी में बहुवचन अर्थ स्पष्ट किया गया है और पाठगत असंगति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τείχη
  choice: शहरपनाह
  rationale: यह नगर की रक्षात्मक दीवार को दर्शाता है; ‘शहरपनाह’ आधुनिक हिन्दी में ऐतिहासिक नगर-रक्षा के सन्दर्भ के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: πύργους
  choice: बुर्जों
  rationale: नगर की दीवार पर बने रक्षात्मक मीनारनुमा ढाँचों के लिए ‘बुर्ज’ स्वाभाविक और सन्दर्भानुकूल है।
- source_word: ἀπέστειλεν
  choice: भेज दिया
  rationale: यह बिना अतिरिक्त भाव जोड़े स्त्रियों और बच्चों को घरों की ओर रवाना करने की क्रिया को स्पष्ट करता है।
- source_word: ταπεινώσει πολλῇ
  choice: अत्यन्त दीन दशा
  rationale: यह अभिव्यक्ति बहुत नीचे गिरा दिए जाने, अपमान, कष्ट और विवशता के मिले-जुले भाव को बनाए रखती है। केवल ‘अपमान’ या केवल ‘संकट’ चुनने से यूनानी की अर्थ-व्याप्ति संकुचित हो सकती थी।
