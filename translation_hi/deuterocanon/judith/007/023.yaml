translation:
  language: hi
  text: और सभी लोग—नवयुवक, स्त्रियाँ और बच्चे—ओज़ियाह और नगर के शासकों के विरुद्ध इकट्ठे हुए, और वे ऊँचे स्वर से पुकार उठे और बुज़ुर्गों के विरुद्ध बोले,
