lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: इकट्ठे हुए
  rationale: यह क्रिया यहाँ अकर्मक सामूहिक अर्थ देती है—लोग एक समूह के रूप में एकत्र हुए। ‘इकट्ठे हुए’ सहज आधुनिक हिन्दी है।
- source_word: πᾶς ὁ λαός
  choice: सभी लोग
  rationale: यह पूरी जन-समुदाय को सूचित करता है; ‘सभी लोग’ हिन्दी में स्वाभाविक और व्यापक है।
- source_word: ἐπὶ Ὀζείαν
  choice: ओज़ियाह ... के विरुद्ध
  rationale: आगे ऊँचे स्वर में पुकारने और बुज़ुर्गों के विरुद्ध बोलने के कारण यहाँ ἐπί को विरोधात्मक अर्थ में लेना प्रसंगानुकूल है। नाम को यूनानी रूप के निकट ‘ओज़ियाह’ लिखा गया है।
- source_word: τοὺς ἄρχοντας τῆς πόλεως
  choice: नगर के शासकों
  rationale: ἄρχοντες नगर के अधिकार-संपन्न शासकीय अगुओं को सूचित करता है; यह अनुवाद किसी विशेष प्रशासनिक पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: οἱ νεανίσκοι
  choice: नवयुवक
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है और विशेष रूप से युवा पुरुषों को सूचित करता है।
- source_word: αἱ γυναῖκες
  choice: स्त्रियाँ
  rationale: यह स्त्रियों के स्पष्ट बहुवचन को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὰ παιδία
  choice: बच्चे
  rationale: यह बच्चों के लिए सामान्य शब्द है; ‘बच्चे’ सबसे स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से पुकारकर
  rationale: यह पुकारने की क्रिया और उसकी तीव्रता दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: εἶπαν ἐναντίον τῶν πρεσβυτέρων
  choice: बुज़ुर्गों के विरुद्ध यह कहना शुरू किया
  rationale: विरोध और शिकायत के प्रसंग में ἐναντίον का विरोधात्मक अर्थ उपयुक्त है। अपूर्ण कथन अगले पद में जारी रहने के कारण ‘यह कहना शुरू किया’ हिन्दी में स्वाभाविक संक्रमण देता है। πρεσβύτεροι के लिए ‘बुज़ुर्ग’ समुदाय के वरिष्ठ जनों का अर्थ बनाए रखता है।
