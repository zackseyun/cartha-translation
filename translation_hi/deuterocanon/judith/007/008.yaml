- source_word: ἡγούμενοι
  choice: अगुए
  rationale: यह नेतृत्व करने वालों के लिए सहज, गरिमापूर्ण हिन्दी है और पहले प्रयुक्त ‘शासक’ से शब्दगत अंतर बनाए रखती है।
- source_word: λαοῦ Μωὰβ
  choice: मोआब की प्रजा
  rationale: यह पूर्ण संबंधवाचक अभिव्यक्ति को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: στρατηγοὶ
  choice: सेनापति
  rationale: युद्ध-संदर्भ में सैन्य अधिकारियों के लिए यह सटीक और प्रचलित हिन्दी पद है।
- source_word: παραλίας
  choice: समुद्र-तट
  rationale: यह तटीय भूभाग को व्यक्त करता है; यहाँ किसी विशिष्ट समुद्र का नाम मूल पाठ में नहीं है।
- source_word: εἶπαν
  choice: बोले
  rationale: बहुवचन कर्ताओं के साथ कथात्मक संवाद आरम्भ करने के लिए स्वाभाविक हिन्दी रूप।
