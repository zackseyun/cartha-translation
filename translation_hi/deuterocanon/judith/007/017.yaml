  yaml_path: translation/deuterocanon/judith/007/017.yaml
  text: And the camp of the sons of Ammon moved on[a], and with them five thousand sons of Asshur[c][b], and they encamped in the valley and seized the waters and the springs of water of the sons of Israel.
translation:
  language: hi
  text: तब अम्मोनियों[a] की छावनी कूच कर गई, और उसके साथ अश्शूर के पाँच हज़ार लोग भी थे। उन्होंने घाटी[b] में डेरा डाला और इस्राएलियों के जल और जल के सोतों पर पहले ही अधिकार कर लिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अम्मोन के पुत्रों’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ भूभाग के अनुसार ‘सँकरी घाटी’, ‘खोखला निचला भूभाग’ या ‘पहाड़ों से घिरा मैदान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इस क्रिया में दूसरों से पहले पहुँचकर किसी स्थान को अपने नियंत्रण में लेने का भाव है; अनुवाद ‘पहले ही कब्ज़ा कर लिया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: कूच किया
  rationale: सैन्य वृत्तांत में यह क्रिया छावनी उठाकर आगे जाने को व्यक्त करती है; ‘कूच किया’ स्वाभाविक हिन्दी है और दिशा या आक्रामकता को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: παρεμβολὴ
  choice: छावनी
  rationale: यह संज्ञा सैन्य शिविर अथवा वहाँ डेरा डाले दल, दोनों का बोध करा सकती है। ‘छावनी’ मूल रूपक को बनाए रखती है।
- source_word: υἱῶν Ἀμμών
  choice: अम्मोनियों
  rationale: यूनानी का शाब्दिक अर्थ ‘अम्मोन के पुत्र’ है, पर आधुनिक हिन्दी में जातीय समूह के लिए ‘अम्मोनी’ अधिक स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: χιλιάδες πέντε υἱῶν Ἀσσούρ
  choice: अश्शूर के पाँच हज़ार लोग
  rationale: यह संख्या साथ चल रहे जातीय-सैन्य दल को दर्शाती है। ‘अश्शूर के ... लोग’ मूल के ‘अश्शूर के पुत्र’ के निकट रहते हुए हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: παρενέβαλον
  choice: डेरा डाला
  rationale: यह शिविर लगाने की मानक सैन्य क्रिया है; ‘डेरा डाला’ आधुनिक हिन्दी में सहज है।
- source_word: ἐν τῷ αὐλῶνι
  choice: घाटी में
  rationale: इस भौगोलिक प्रसंग में αὐλών किसी घाटी, सँकरे निचले भूभाग या पहाड़ों से घिरे मैदान को सूचित कर सकता है। ‘घाटी’ सबसे स्पष्ट सामान्य विकल्प है।
- source_word: προκατελάβοντο
  choice: पहले ही अधिकार कर लिया
  rationale: क्रिया में दूसरों से पहले पहुँचकर रणनीतिक रूप से अपने नियंत्रण में लेने का भाव है; इस अनुवाद में उसका पूर्वग्रहण संबंधी उपसर्ग भी व्यक्त होता है।
- source_word: τὰ ὕδατα καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: जल और जल-स्रोतों
  rationale: मूल पाठ जल तथा उसके सोतों/स्रोतों दोनों का उल्लेख करता है। हिन्दी में ‘जल और जल-स्रोतों’ पुनरुक्ति को कुछ हद तक बनाए रखते हुए अर्थ स्पष्ट करता है।
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: इस्राएलियों के
  rationale: शाब्दिक ‘इस्राएल के पुत्रों के’ की अपेक्षा आधुनिक हिन्दी में जातीय समुदाय के लिए ‘इस्राएलियों के’ स्वाभाविक और स्पष्ट है।
