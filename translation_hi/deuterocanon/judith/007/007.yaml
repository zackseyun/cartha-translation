  yaml_path: translation/deuterocanon/judith/007/007.yaml
  text: And he inspected the approaches to their city[a], and he took control of the springs of water and seized them, and he stationed camps of fighting men by them[c][b]; and he himself returned to his people.
translation:
  language: hi
  text: उसने उनके नगर तक ऊपर जानेवाले मार्गों[a] का निरीक्षण किया। फिर उसने जल के सोतों का चक्कर लगाया[b] और उन पर पहले ही अधिकार कर लिया। उसने उनके पास योद्धाओं की छावनियाँ स्थापित कर दीं; और वह स्वयं पड़ाव उठाकर अपने लोगों के पास चला गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उनके नगर की चढ़ाइयों’; अर्थात नगर तक ऊपर जानेवाले रास्ते।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ है; इसका अर्थ जलस्रोतों का चक्कर लगाना, उनकी निगरानी करना या उन्हें सुरक्षित करना भी हो सकता है।
    reason: lexical_ambiguity
  - marker: c
    text: यूनानी क्रिया में छावनी समेटकर कूच करने का भाव है; प्रसंग में वह अपने लोगों के पास गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεσκέψατο
  choice: निरीक्षण किया
  rationale: सैन्य प्रसंग में यह क्रिया मार्गों को सामरिक दृष्टि से जाँचने या परखने का भाव देती है; इसलिए सामान्य ‘भेंट की’ के बजाय ‘निरीक्षण किया’ उपयुक्त है।
- source_word: ἀναβάσεις
  choice: ऊपर जानेवाले मार्गों
  rationale: शब्द का मूल अर्थ ‘चढ़ाइयाँ’ है। यहाँ पहाड़ी नगर तक पहुँचने वाले चढ़ाई के रास्ते अभिप्रेत हैं; यह अनुवाद स्थलाकृतिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πηγὰς τῶν ὑδάτων
  choice: जल के सोतों
  rationale: यह ठोस जलस्रोतों, विशेषतः झरनों या सोतों, को सूचित करता है, जिनका सामरिक नियंत्रण महत्त्वपूर्ण था।
- source_word: ἐφώδευεν
  choice: चारों ओर गश्त लगाई
  rationale: दुर्लभ क्रिया में घूमकर निरीक्षण करने, चक्कर लगाने या सैन्य गश्त का भाव हो सकता है। ‘गश्त लगाई’ अगले अधिकार करने के कार्य से अलग रहते हुए सैन्य प्रसंग को व्यक्त करता है।
- source_word: προκατέλαβε
  choice: पहले ही अधिकार कर लिया
  rationale: उपसर्ग προ- रणनीतिक रूप से पहले पहुँचकर कब्ज़ा कर लेने का भाव देता है; ‘पहले ही अधिकार कर लिया’ इस सूक्ष्मता को सुरक्षित रखता है।
- source_word: ἐπέστησεν
  choice: तैनात कर दीं
  rationale: सैन्य बल या छावनी को किसी स्थान पर नियुक्त करने के लिए ‘तैनात’ स्वाभाविक और सटीक है।
- source_word: παρεμβολὰς
  choice: छावनियाँ
  rationale: शब्द सैन्य पड़ावों या छावनियों को दर्शाता है। बहुवचन को बनाए रखते हुए ‘छावनियाँ’ भौतिक सैन्य उपस्थिति व्यक्त करता है।
- source_word: ἀνδρῶν πολεμιστῶν
  choice: योद्धाओं की
  rationale: यूनानी पदबंध युद्ध करने वाले पुरुषों को स्पष्ट करता है। हिन्दी में ‘योद्धाओं’ से सैन्य भूमिका स्वाभाविक ढंग से व्यक्त होती है; पुरुषवाचक रूप भी बना रहता है।
- source_word: ἀνέζευξεν
  choice: पड़ाव उठाकर ... चला गया
  rationale: यह क्रिया प्रायः शिविर समेटकर कूच करने का भाव देती है। गंतव्य ‘अपने लोगों के पास’ है, इसलिए अनुवाद कूच और वापसी—दोनों संकेतों को बनाए रखता है।
