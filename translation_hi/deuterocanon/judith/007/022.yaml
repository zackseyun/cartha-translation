  yaml_path: translation/deuterocanon/judith/007/022.yaml
  text: And their little children lost heart[a], and the women and the young men were failing from thirst, and they were falling in the squares of the city and in the passages of the gates[b], and there was no strength left in them.
translation:
  language: hi
  text: उनके छोटे बच्चों का मन टूट गया[a], और स्त्रियाँ और युवक प्यास के मारे निढाल होते जा रहे थे। वे नगर के चौकों और फाटकों के प्रवेश-मार्गों[b] में गिर रहे थे, और उनमें अब कोई शक्ति बाकी न थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके शिशु हताश हो गए” अथवा “उनके छोटे बच्चों का हौसला चुक गया।” यूनानी में τὰ νήπια बहुत छोटे बच्चों, यहाँ तक कि शिशुओं, के लिए भी आ सकता है; और ἠθύμησεν मन का हताश होना या हौसला चुक जाना व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “नगर की चौड़ी सड़कों और फाटकों के गलियारों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθύμησεν
  choice: मन टूट गया
  rationale: यह अभिव्यक्ति साहस या हौसला चुक जाने का भाव स्वाभाविक हिन्दी में व्यक्त करती है, पर इसे पूर्ण निराशा या केवल शारीरिक मूर्छा तक सीमित नहीं करती।
- source_word: τὰ νήπια
  choice: छोटे बच्चे
  rationale: νήπια बहुत कम उम्र के बच्चों, यहाँ तक कि शिशुओं, को भी सूचित कर सकता है। ‘छोटे बच्चे’ व्यापकता और असहायता दोनों बनाए रखता है।
- source_word: ἐξέλιπον
  choice: निढाल होते जा रहे थे
  rationale: अपूर्ण भूतकाल लगातार बढ़ती शारीरिक दुर्बलता दिखाता है। यह अनुवाद प्यास से शक्ति चुकने की क्रमिक दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς δίψης
  choice: प्यास के मारे
  rationale: यह मूल के कारणसूचक अर्थ को सीधी और प्रचलित हिन्दी में रखता है।
- source_word: ἔπιπτον
  choice: गिर रहे थे
  rationale: अपूर्ण भूतकाल जारी या बार-बार होने वाली क्रिया को दिखाता है; ‘गिर रहे थे’ इस पक्ष को सुरक्षित रखता है।
- source_word: πλατείαις
  choice: चौकों
  rationale: यह नगर के चौड़े, खुले सार्वजनिक स्थानों का स्वाभाविक हिन्दी बोध देता है; ‘चौड़ी सड़कों’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: διόδοις τῶν πυλῶν
  choice: फाटकों के मार्गों
  rationale: यह नगर के फाटकों से जुड़े आने-जाने के रास्तों या मार्गिकाओं को निकटता से व्यक्त करता है, बिना उन्हें केवल फाटक मान लेने के।
- source_word: κραταίωσις
  choice: शक्ति
  rationale: संदर्भ में यह टिके रहने की सामर्थ्य या बल को दर्शाता है; प्यास और गिरने की स्थिति में ‘शक्ति’ स्पष्ट और सहज है।
- source_word: οὐκ ἦν ... ἔτι ἐν αὐτοῖς
  choice: उनमें अब कोई शक्ति बाकी न थी
  rationale: यह ἔτι के ‘अब और नहीं’ भाव तथा ‘उनमें’ की आंतरिक स्थिति, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
