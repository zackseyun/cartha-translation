base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/030.yaml
  text: And Uzziah said to them[a], “Take courage, brothers; let us hold out for five more days, within which the Lord our God will turn his mercy toward us, for he will not abandon us forever.”
translation:
  language: hi
  text: और उज्जियाह ने उनसे कहा, “भाइयो, हिम्मत रखो; हम पाँच दिन और धीरज धरें। इन पाँच दिनों में प्रभु हमारा परमेश्वर अपनी दया हमारी ओर फेरेगा, क्योंकि वह हमें सदा के लिए नहीं छोड़ेगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह हमें अंत तक नहीं छोड़ेगा” अथवा “वह हमें पूरी तरह नहीं छोड़ेगा।” यूनानी पदबंध का अर्थ अंतिम, स्थायी, या पूर्ण परित्याग न करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: हिम्मत रखो
  rationale: बहुवचन आज्ञार्थक का स्वाभाविक और स्पष्ट हिन्दी रूप; संकट में साहस बनाए रखने की पुकार को व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी में पुल्लिंग बहुवचन प्रत्यक्ष संबोधन है; हिन्दी संबोधन-रूप स्रोत की लिंग-सूचना बनाए रखता है।
- source_word: διακαρτερήσωμεν
  choice: हम ... धीरज धरें
  rationale: यह exhortative/hortatory subjunctive दबाव के बीच लगातार टिके रहने का आह्वान करता है; ‘धीरज धरें’ गरिमापूर्ण और सामान्य हिन्दी है।
- source_word: ἔτι πέντε ἡμέρας
  choice: पाँच दिन और
  rationale: ἔτι की अतिरिक्त अवधि का अर्थ सहज हिन्दी शब्दक्रम में सुरक्षित है।
- source_word: ἐν αἷς
  choice: इन्हीं दिनों में
  rationale: सापेक्ष कालावधि को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह अनावश्यक रूप से निश्चित किए कि कार्य पाँचवें दिन से पहले ही होगा।
- source_word: ἐπιστρέψει
  choice: फेरेगा
  rationale: सकर्मक प्रयोग में τὸ ἔλεος αὐτοῦ को हमारी ओर मोड़ने का दिशात्मक भाव देता है; ‘लौटाएगा’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: प्रभु हमारा परमेश्वर
  rationale: यूनानी पदक्रम और सम्बन्ध को स्पष्ट रखते हुए κύριος के लिए ‘प्रभु’ और θεός के लिए ‘परमेश्वर’ का मानक हिन्दी रूप।
- source_word: τὸ ἔλεος αὐτοῦ
  choice: अपनी दया
  rationale: ἔλεος का संक्षिप्त और धर्मवैचारिक रूप से पर्याप्त रूप; ‘करुणा’ भी सम्भव है, पर ‘दया’ इस क्रियात्मक प्रसंग में सहज है।
- source_word: ἐφʼ ἡμᾶς
  choice: हमारी ओर
  rationale: दया के लोगों की ओर फिरने की दिशात्मकता को स्पष्ट रूप से बनाए रखता है।
- source_word: οὐ γὰρ ἐγκαταλείψει ἡμᾶς εἰς τέλος
  choice: क्योंकि वह हमें सदा के लिए नहीं छोड़ेगा
  rationale: ἐγκαταλείπω का स्वाभाविक हिन्दी ‘छोड़ना’ है; εἰς τέλος यहाँ अंतिम अथवा स्थायी परित्याग का मुहावरेदार अर्थ दे सकता है, जिसे ‘सदा के लिए’ सुबोध रूप में व्यक्त करता है।
theological_decisions:
- issue: इस यूनानी यहूदी ग्रन्थ में इस्राएल के परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: स्रोत में κύριος है, स्पष्ट हिब्रू चतुरक्षरी नाम नहीं; इसलिए ‘प्रभु’ स्रोत-संगत है और अनावश्यक रूप से किसी पीछे माने गए हिब्रू पाठ को आरोपित नहीं करता।
- issue: ἀδελφοί का लिंग-सूचक संबोधन
  choice: भाइयो
  alternative: भाइयो और बहनो / साथियो
  rationale: स्रोत का रूप पुल्लिंग बहुवचन है। व्यापक समूह सम्भव होने पर भी मुख्य पाठ में समावेशी विस्तार जोड़ना स्रोत से आगे जाता।
- issue: εἰς τέλος का कालगत अथवा पूर्णतासूचक भाव
  choice: सदा के लिए
  alternative: अंत तक / पूरी तरह
  rationale: वाक्य में आश्वासन अंतिम या स्थायी परित्याग के निषेध का है। ‘सदा के लिए’ स्वाभाविक हिन्दी है, जबकि वैकल्पिक पूर्णतासूचक अर्थ भी स्वीकार्य बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। संवाद में ‘हिम्मत रखो’ और ‘धीरज धरें’ संकट तथा सामूहिक सहनशीलता दोनों व्यक्त करते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि εἰς τέλος का चुना हुआ मुहावरेदार रूप मुख्य पाठ में अर्थपूर्ण और स्वाभाविक है।
