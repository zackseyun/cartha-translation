  language: hi
  text: पर यदि ये दिन बीत जाएँ और हम तक सहायता न पहुँचे, तो मैं तुम्हारी बातों के अनुसार करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωσιν αὗται
  choice: ये दिन बीत जाएँ
  rationale: स्त्रीलिंग बहुवचन संकेतवाचक αὗται का आशय प्रसंग में पहले बताए गए दिनों से है; हिन्दी में संदर्भ स्पष्ट और स्वाभाविक रखने के लिए ‘दिन’ व्यक्त किया गया है।
- source_word: μὴ ἔλθῃ ἐφʼ ἡμᾶς βοήθεια
  choice: हम तक सहायता न पहुँचे
  rationale: ἔλθῃ ἐφʼ ἡμᾶς सहायता के उनके पास आने को व्यक्त करता है। ‘हम तक…न पहुँचे’ मूल दिशा-बोध को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है, बिना सहायता के स्रोत या स्वरूप को निश्चित किए।
- source_word: ποιήσω κατὰ τὰ ῥήματα ὑμῶν
  choice: मैं तुम्हारी बातों के अनुसार करूँगा
  rationale: κατὰ τὰ ῥήματα का निकट अर्थ ‘तुम्हारे शब्दों/बातों के अनुसार’ है; ‘बातों’ हिन्दी में पूर्व कही गई मांगों या प्रस्ताव को स्वाभाविक ढंग से दर्शाता है।
