base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/019.yaml
  text: And the sons of Israel cried out to the Lord their God[a], because their spirit had grown faint[b], because all their enemies had surrounded them and there was no escape from among them.
translation:
  language: hi
  text: और इस्राएल के पुत्रों[a] ने अपने प्रभु परमेश्वर को पुकारा, क्योंकि उनका मनोबल टूट गया था[b]; उनके सभी शत्रुओं ने उन्हें घेर लिया था और उनके बीच से निकल भागने का कोई मार्ग नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘इस्राएली’। यूनानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी आत्मा शिथिल पड़ गई थी’ अथवा ‘वे हिम्मत हार गए थे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएल के पुत्र
  rationale: यह यूनानी के पारिवारिक मुहावरे को औपचारिक रूप से सुरक्षित रखता है। सामान्य हिन्दी में इसका आशय ‘इस्राएली’ है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀνεβόησαν
  choice: पुकारा
  rationale: परमेश्वर की ओर संकट में की गई तीव्र पुकार के लिए यह स्वाभाविक हिन्दी है; यहाँ केवल ऊँची आवाज़ में चिल्लाना अभिप्रेत नहीं है।
- source_word: Κύριον θεὸν αὐτῶν
  choice: अपने प्रभु परमेश्वर
  rationale: ‘प्रभु’ κύριος के ईश्वरीय पदनाम को और ‘अपने ... परमेश्वर’ मूल के संबंधसूचक भाव को सुरक्षित रखता है।
- source_word: ὠλιγοψύχησεν τὸ πνεῦμα αὐτῶν
  choice: उनका मनोबल टूट गया था
  rationale: यह यूनानी अभिव्यक्ति के निरुत्साहित और साहसहीन हो जाने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है। ‘आत्मा क्षीण हो गई’ अधिक शब्दशः है, पर इस संदर्भ में अस्वाभाविक और संभावित रूप से भ्रामक हो सकता है।
- source_word: ἐκύκλωσαν
  choice: घेर लिया था
  rationale: यह शत्रुओं द्वारा चारों ओर से घेरे जाने को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है; पूर्ण भूतकाल पुकार से पहले बनी हुई परिस्थिति दिखाता है।
- source_word: οὐκ ἦν διαφυγεῖν ἐκ μέσου αὐτῶν
  choice: उनके बीच से निकल भागने का कोई मार्ग नहीं था
  rationale: यह अवैयक्तिक यूनानी रचना में निहित बच निकलने की असंभवता और शत्रुओं के घेरे के भीतर फँसे होने—दोनों भावों को सहज हिन्दी में रखता है।
theological_decisions:
- issue: κύριος का ईश्वरीय पदनाम
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रार्थना-सदृश इस संदर्भ में κύριος परमेश्वर के पदनाम के रूप में आया है; ‘प्रभु’ उसका मानक और धार्मिक रूप से तटस्थ हिन्दी रूप है।
- issue: οἱ υἱοὶ Ἰσραήλ का लिंगयुक्त सामूहिक मुहावरा
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मुख्य पाठ मूल यूनानी के पुरुषवाचक पारिवारिक मुहावरे और उसके बाइबलीय स्वर को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि सामूहिक आशय ‘इस्राएली’ है।
- issue: πνεῦμα का संदर्भगत अर्थ
  choice: मनोबल
  alternative: आत्मा
  rationale: यहाँ πνεῦμα मनुष्य के साहस और आंतरिक धैर्य के टूटने का संकेत देता है। ‘मनोबल’ संदर्भगत अर्थ देता है, जबकि पादटिप्पणी मूल रूपक और वैकल्पिक अनुवाद सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक स्वर रखा गया है। ‘इस्राएल के पुत्र’ मूल मुहावरे की औपचारिक प्रतिध्वनि बनाए रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज है।
