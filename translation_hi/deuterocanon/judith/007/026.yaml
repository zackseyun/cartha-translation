lexical_decisions:
- source_word: ἐπικαλέσασθε αὐτούς
  choice: उन्हें बुलाओ
  rationale: संदर्भ में इसका सीधा अर्थ संबोधित लोगों को बुलाने का आदेश है; यह प्रार्थना या सहायता के लिए पुकारने के अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἔκδοθε
  choice: हाथ सौंप दो
  rationale: नगर को शत्रु के अधिकार में दे देने का भाव स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: εἰς προνομήν
  choice: लूट के लिए
  rationale: यूनानी पद नगर को लूट का विषय बना देने को दर्शाता है; संक्षिप्त हिन्दी अभिव्यक्ति उसी कठोर आशय को बनाए रखती है।
- source_word: τῷ λαῷ Ὁλοφέρνου
  choice: होलोफेरनेस के लोगों
  rationale: λαός का सामान्य अर्थ 'लोग' रखा गया है; अगले पद δύναμις से सेना का विचार अलग से आता है।
- source_word: πάσῃ τῇ δυνάμει αὐτοῦ
  choice: उसकी सारी सेना
  rationale: सैन्य संदर्भ में δύναμις का स्वाभाविक अर्थ 'सेना' है; एकवचन सामूहिक बल को हिन्दी में स्पष्ट करता है।
