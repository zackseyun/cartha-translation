base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/004.yaml
  text: But the sons of Israel[a], when they saw their great number, were greatly troubled, and each said to his neighbor, “Now these men will lick up the whole face of the land[b], and neither the high mountains nor the ravines nor the hills will bear their weight.”
translation:
  language: hi
  text: पर इस्राएल के पुत्रों ने जब उनकी बड़ी संख्या देखी, तो वे बहुत घबरा गए, और हर एक ने अपने पास वाले से कहा, “अब ये लोग सारी भूमि की सतह को चाट जाएँगे[a], और न ऊँचे पहाड़, न खाइयाँ, न पहाड़ियाँ उनका भार सह पाएँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का शाब्दिक अर्थ “चाट जाना” है; यहाँ यह पूरी भूमि में फैलकर उसे भस्म कर देने के सजीव बिंब को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἰσραήλ
  choice: पर इस्राएल के पुत्रों
  rationale: यूनानी मुहावरे को निकटता से रखते हुए गरिमापूर्ण बाइबलीय भाषा बनाए रखता है; अधिक व्याख्यात्मक रूप ‘इस्राएली’ भी संभव है।
- source_word: ὡς ἴδον αὐτῶν τὸ πλῆθος
  choice: जब उनकी बड़ी संख्या देखी
  rationale: πλῆθος यहाँ विशाल जनसमूह अथवा संख्या को सूचित करता है; ‘बड़ी संख्या’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐταράχθησαν σφόδρα
  choice: बहुत घबरा गए
  rationale: ταράσσω से तीव्र व्याकुलता या अशांति व्यक्त होती है; यह अनिवार्य रूप से आतंक का अर्थ आरोपित नहीं करता।
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: एक-दूसरे से कहने लगे
  rationale: शाब्दिक ‘हर एक ने अपने निकटवर्ती से कहा’ का सामूहिक और स्वाभाविक हिन्दी रूप, बिना अर्थ बदले।
- source_word: Νῦν ἐκλείξουσιν οὗτοι
  choice: अब ये लोग ... चाट जाएँगे
  rationale: ἐκλείχω का सजीव शाब्दिक बिंब ‘चाट जाना’ है, जो पूर्ण भक्षण या सफाए का भाव रखता है।
- source_word: τὸ πρόσωπον τῆς γῆς πάσης
  choice: सारी भूमि का मुख
  rationale: यूनानी में सुरक्षित सामी शैली के मुहावरे को बनाए रखता है; आशय भूमि की पूरी सतह या विस्तार से है।
- source_word: οὔτε τὰ ὄρη τὰ ὑψηλὰ οὔτε αἱ φάραγγες οὔτε οἱ βουνοί
  choice: न ऊँचे पहाड़, न खाइयाँ, न पहाड़ियाँ
  rationale: तीनों भौगोलिक शब्दों का भेद सुरक्षित है; φάραγγες के लिए ‘खाइयाँ’ गहरी संकरी घाटियों का बोध कराता है।
- source_word: ὑποστήσονται τὸ βάρος αὐτῶν
  choice: उनका भार सह पाएँगी
  rationale: विशाल सेना के दबाव के नीचे टिकने या भार सहने का चित्र स्वाभाविक हिन्दी में व्यक्त होता है।
