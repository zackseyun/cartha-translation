  text: And the cisterns were being emptied, and they did not have enough water to drink for even one day, because it was given to them to drink by measure.
translation:
  language: hi
  text: और जल-कुंड खाली होते जा रहे थे, और उनके पास एक दिन के लिए भी जी भरकर पीने लायक पानी नहीं था, क्योंकि उन्हें नापकर[a] पानी पीने को दिया जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मापी हुई मात्रा में” अथवा “सीमित मात्रा में।” यूनानी में शाब्दिक अर्थ “माप के अनुसार” है, यानी पानी बाँटकर दिया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκοι
  choice: जल-कुंड
  rationale: घेराबंदी के प्रसंग में यह शब्द पानी जमा करने के लिए खोदे या बनाए गए कुंडों को दर्शाता है; ‘जल-कुंड’ साधारण गड्ढों के बजाय जल-संग्रह का भाव स्पष्ट करता है।
- source_word: ἐξεκενοῦντο
  choice: खाली होते जा रहे थे
  rationale: अपूर्ण भूतकाल पानी के लगातार घटने की प्रक्रिया दर्शाता है; यह अनुवाद उस जारी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ εἶχον πεῖν εἰς πλησμονὴν
  choice: जी भरकर पीने लायक पानी नहीं था
  rationale: εἰς πλησμονήν का मूल भाव ‘भरपूर होने तक’ है। यहाँ पानी का पूर्ण अभाव नहीं, बल्कि तृप्ति तक पीने के लिए उसकी अपर्याप्तता व्यक्त होती है।
- source_word: ἡμέραν μίαν
  choice: एक दिन के लिए भी
  rationale: यूनानी में शाब्दिक रूप से ‘एक दिन’ है; प्रसंग में न्यूनतम अवधि पर बल होने के कारण हिन्दी का ‘भी’ उस निहित बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν μέτρῳ
  choice: नापकर
  rationale: यह शाब्दिक ‘माप के अनुसार’ को संक्षेप और स्वाभाविक हिन्दी में रखता है तथा पानी की राशनबंदी का संकेत देता है।
- source_word: ἐδίδοσαν αὐτοῖς πεῖν
  choice: उन्हें ... पानी पीने को दिया जाता था
  rationale: मूल पाठ देने वालों की पहचान नहीं करता। हिन्दी का कर्मवाच्य अनिर्दिष्ट कर्ता और बार-बार की जाने वाली आपूर्ति—दोनों को सुरक्षित रखता है।
