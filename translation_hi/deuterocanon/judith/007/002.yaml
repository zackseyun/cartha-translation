base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/002.yaml
  text: And on that day every one of their mighty men broke camp[a]; and their fighting force of warrior men was one hundred seventy thousand foot soldiers and twelve thousand horsemen, besides the baggage train of the men who were on foot among them[b], a very great multitude.
translation:
  language: hi
  text: उस दिन उनके सभी वीर पुरुषों ने पड़ाव उठाया[a], और उनके युद्ध करनेवाले पुरुषों की सेना में एक लाख सत्तर हज़ार पैदल सैनिक और बारह हज़ार घुड़सवार थे, उनके बीच पैदल चलनेवाले पुरुषों के सामान को छोड़कर—जो बहुत ही बड़ी संख्या में थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कूच किया” अथवा “शिविर उठाकर चल पड़े।”
    reason: lexical_alternative
  - marker: b
    text: “सामान” के बाद का यूनानी वाक्य-विन्यास कठिन है। सम्भवतः आशय सेना के सामान और सहायक व्यवस्था के साथ पैदल चलनेवाले बहुत बड़ी संख्या के पुरुषों से है, जो ऊपर दी गई युद्धरत सैनिकों की संख्या के अतिरिक्त थे।
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνέζευξεν
  choice: पड़ाव उठाया
  rationale: सैन्य संदर्भ में यह क्रिया शिविर समेटकर प्रस्थान करने का बोध देती है; ‘पड़ाव उठाया’ दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πᾶς ἀνὴρ δυνατὸς αὐτῶν
  choice: उनके सभी वीर पुरुषों
  rationale: दυνατός का सामर्थ्य और सैन्य क्षमता से जुड़ा अर्थ बनाए रखते हुए ἀνήρ के पुरुषवाचक रूप को स्पष्ट रखा गया है।
- source_word: ἡ δύναμις αὐτῶν ἀνδρῶν πολεμιστῶν
  choice: उनके युद्ध करनेवाले पुरुषों की सेना
  rationale: δύναμις को इस सैनिक गणना में ठोस सैन्य बल के अर्थ में ‘सेना’ और ἀνδρῶν πολεμιστῶν को ‘युद्ध करनेवाले पुरुष’ कहा गया है, जिससे यूनानी की दोहरी अभिव्यक्ति बनी रहती है।
- source_word: πεζῶν
  choice: पैदल सैनिक
  rationale: घुड़सवारों के साथ विरोध में यह मुख्य युद्धरत पैदल सेना को सूचित करता है।
- source_word: ἵππων
  choice: घुड़सवार
  rationale: यद्यपि शब्द का शाब्दिक संबंध घोड़ों से है, सैनिकों की गणना में आशय सवार सैन्य दल से है।
- source_word: χωρὶς τῆς ἀποσκευῆς
  choice: इनके अतिरिक्त सामान
  rationale: ἀποσκευή सेना के साथ ले जाए जानेवाले सामान या साज-सामान को दर्शाता है; कठिन परवर्ती वाक्य-विन्यास के कारण ‘सामान’ तटस्थ रखा गया है।
- source_word: τῶν ἀνδρῶν οἳ ἦσαν πεζοὶ ἐν αὐτοῖς
  choice: और उनके बीच पैदल चलनेवाले पुरुष भी थे
  rationale: यूनानी वाक्यांश व्याकरण की दृष्टि से कठिन है। यह अनुवाद साथ चलनेवाले पैदल पुरुषों को मुख्य युद्ध-सैनिकों की घोषित संख्या में निश्चित रूप से मिलाए बिना अभिव्यक्त करता है।
- source_word: πλῆθος πολὺ σφόδρα
  choice: अत्यन्त विशाल जनसमूह
  rationale: यह पद अतिरिक्त साथ चलनेवाले समूह की असाधारण विशालता पर बल देता है।
