translation:
  language: hi
  text: और उनकी बातें होलोफेरनेस और उसके सब सेवकों को अच्छी लगीं, और उसने वैसा ही करने की आज्ञा दी जैसा उन्होंने कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: अच्छी लगीं
  rationale: यह प्रयोग प्रस्ताव को अनुकूल रूप से स्वीकार किए जाने को व्यक्त करता है; ‘अच्छी लगीं’ स्वाभाविक हिन्दी है और होलोफेरनेस तथा उसके सेवकों, दोनों को संबोधित भाव बनाए रखता है।
- source_word: οἱ λόγοι αὐτῶν
  choice: उनकी बातें
  rationale: शाब्दिक अर्थ ‘उनके शब्द’ है, पर प्रसंग में उनके कहे हुए परामर्श या प्रस्ताव की बात है; ‘उनकी बातें’ निकट और सहज अनुवाद है।
- source_word: θεραπόντων
  choice: सेवकों
  rationale: θεράπων किसी अधिकारी के निजी सेवक या परिचर को सूचित कर सकता है। ‘सेवकों’ सामान्य आधुनिक हिन्दी में स्पष्ट है और दासत्व का अनावश्यक संकेत नहीं देता।
- source_word: συνέταξε
  choice: आज्ञा दी
  rationale: यहाँ क्रिया अधिकारपूर्वक किसी काम को करने का आदेश देने के अर्थ में है; ‘आज्ञा दी’ सैन्य-अधिकारी के प्रसंग के अनुकूल है।
- source_word: ποιεῖν καθὰ ἐλάλησαν
  choice: वैसा ही करने ... जैसा उन्होंने कहा था
  rationale: यह आज्ञा की विषयवस्तु बताता है और यूनानी के ‘जैसा उन्होंने कहा’ संबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
