translation:
  language: hi
  text: हमारे स्वामी एक बात सुनें, ताकि आपकी सेना में कोई टूट न पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκουσάτω δὴ
  choice: सुनें
  rationale: तीसरे पुरुष का आज्ञार्थक रूप यहाँ किसी वरिष्ठ से किया गया विनम्र, किंतु आग्रहपूर्ण निवेदन है। हिन्दी का आदरसूचक बहुवचन ‘सुनें’ इस भाव को स्वाभाविक रूप से व्यक्त करता है; δὴ का आग्रह अलग शब्द जोड़ने के बजाय वाक्य के निवेदनात्मक स्वर में समाहित है।
- source_word: λόγον
  choice: मेरी बात
  rationale: ग्रीक में शाब्दिक रूप से ‘एक बात/वचन’ है। इस प्रसंग में वक्ता अपनी सलाह सुनने का अनुरोध करता है, इसलिए ‘मेरी बात’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὁ δεσπότης ἡμῶν
  choice: हमारे स्वामी
  rationale: δεσπότης अधिकार रखने वाले स्वामी या प्रभु को सूचित करता है। सैन्य वरिष्ठ के प्रति सम्मानपूर्ण संबोधन में ‘हमारे स्वामी’ अर्थ और सामाजिक संबंध दोनों को बनाए रखता है, बिना इसे परमेश्वर-संबंधी पद मानने के।
- source_word: ἵνα μὴ γένηται
  choice: ताकि ... न पड़े
  rationale: उद्देश्यवाचक उपवाक्य के भाव को स्वाभाविक हिन्दी में ‘ताकि ... न पड़े’ से व्यक्त किया गया है, जिसमें संभावित अनिष्ट को रोकने का आशय बना रहता है।
- source_word: θραῦσμα
  choice: टूट
  rationale: θραῦσμα का मूल भाव टूटने, दरार या विघटन का है। ‘टूट पड़ना’ सेना में हानिकारक विघटन या पराजय का संकेत देता है, पर उसकी सटीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν τῇ δυνάμει σου
  choice: आपकी सेना में
  rationale: δύναμις के अर्थों में शक्ति और सैन्य बल दोनों आते हैं। संदर्भ स्पष्टतः सैनिकों का है, इसलिए ‘सेना’ सामान्य हिन्दी पाठक के लिए ‘बल’ से अधिक स्पष्ट है; ἐν का ‘में’ भी सुरक्षित रखा गया है।
