base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/018.yaml
  text: And the sons of Esau and the sons of Ammon went up and camped in the hill country opposite Dothaim[a], and they sent some of their men toward the south and east, opposite Egrebel, which is near Chous, which is on the wadi Mochmour. And the rest of the Assyrian army camped on the plain and covered the whole face of the land, and their tents and their baggage were encamped in a very great multitude[b], and they were exceedingly numerous.
translation:
  language: hi
  text: एसाव के वंशज और अम्मोन के वंशज ऊपर चढ़े और दोताइम के सामने पहाड़ी प्रदेश में पड़ाव डाला। उन्होंने अपने कुछ लोगों को दक्षिण और पूर्व[a] की ओर, एग्रेबेल के सामने भेजा। एग्रेबेल खूस के पास है, और खूस मोखमूर नामक बरसाती नाले[b] के किनारे है। अश्शूरियों की बाकी सेना ने मैदान में पड़ाव डाला और पूरी धरती को ढक लिया। उनके तंबू और उनका सामान बहुत बड़े जमाव में डेरा डाले हुए थे, और उनकी संख्या अत्यन्त अधिक थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूर्व’ के लिए प्रयुक्त यूनानी शब्द का शाब्दिक सम्बन्ध सूर्योदय की दिशा से है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसी जलधारा या उसका पाट जिसमें प्रायः वर्षा के मौसम में पानी बहता है; अनुवाद ‘बरसाती नदी’ भी सम्भव है।
    reason: cultural_note
lexical_decisions:
- source_word: οἱ υἱοὶ Ἡσαῦ καὶ οἱ υἱοὶ Ἀμμών
  choice: एसाव के वंशज और अम्मोन के वंशज
  rationale: यहाँ ‘पुत्र’ जातीय समूहों को सूचित करता है; ‘वंशज’ आधुनिक हिन्दी में अभिप्रेत सामूहिक अर्थ स्पष्ट करता है।
- source_word: ἀνέβησαν
  choice: ऊपर चढ़े
  rationale: क्रिया के भौगोलिक आरोहण के अर्थ को सुरक्षित रखा गया है, क्योंकि अगला वाक्यांश पहाड़ी प्रदेश का उल्लेख करता है।
- source_word: παρενέβαλον
  choice: पड़ाव डाला
  rationale: सैन्य दल द्वारा शिविर लगाने का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ἐν τῷ ὄρει
  choice: पहाड़ी प्रदेश में
  rationale: एकवचन यूनानी पद यहाँ किसी एक शिखर के बजाय पर्वतीय भूभाग का बोध करा सकता है।
- source_word: ἀπέστειλαν ἐξ αὐτῶν
  choice: अपने कुछ लोगों को ... भेजा
  rationale: शाब्दिक अर्थ ‘अपने बीच से भेजा’ है; सन्दर्भ में सैन्य दल के कुछ लोगों को भेजना अभिप्रेत है।
- source_word: πρὸς νότον καὶ ἀπηλιώτην
  choice: दक्षिण और पूर्व की ओर
  rationale: ἀπηλιώτης पूर्व अर्थात सूर्योदय की दिशा को दर्शाता है; मुख्य पाठ में स्पष्ट दिशासूचक शब्द रखा गया है।
- source_word: χειμάρρου
  choice: बरसाती नाले
  rationale: यह पद मौसमी जलधारा अथवा उसके पाट का बोध कराता है; ‘बरसाती नाला’ सामान्य हिन्दी पाठक के लिए स्पष्ट भौगोलिक समतुल्य है।
- source_word: ἡ λοιπὴ στρατεία τῶν Ἀσσυρίων
  choice: अश्शूरियों की बाकी सेना
  rationale: στρατεία यहाँ सैन्य बल को सूचित करता है; ‘बाकी सेना’ λοιπή का अर्थ भी बनाए रखता है।
- source_word: ἐκάλυψαν πᾶν τὸ πρόσωπον τῆς γῆς
  choice: पूरी धरती को ढक लिया
  rationale: यूनानी मुहावरे ‘धरती के पूरे मुख’ को स्वाभाविक हिन्दी में प्रस्तुत करते हुए सेना के व्यापक फैलाव की छवि रखी गई है।
- source_word: αἱ σκηναὶ καὶ αἱ ἀποσκευαὶ αὐτῶν κατεστρατοπέδευσαν ἐν ὄχλῳ πολλῷ
  choice: उनके तंबू और उनका सामान बहुत बड़ी भीड़ के बीच फैला हुआ था
  rationale: मूल में तंबुओं और सामान के ‘डेरा डालने’ का असामान्य प्रयोग है; हिन्दी में दृश्य को स्वाभाविक बनाते हुए विशाल जमाव का भाव सुरक्षित रखा गया है।
