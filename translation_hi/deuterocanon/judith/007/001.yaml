base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/001.yaml
  text: On the next day Holofernes ordered all his army and all his people who had come for his alliance to break camp for Bethulia[a], to seize the passes of the hill country in advance[b], and to make war against the sons of Israel.
translation:
  language: hi
  text: अगले दिन होलोफेरनेस ने अपनी सारी सेना और अपने उन सभी लोगों को, जो उसके गठबंधन में शामिल होने आए थे[a], आदेश दिया कि वे पड़ाव उठाकर बैतूलुआ की ओर बढ़ें, पहाड़ी प्रदेश के चढ़ाई वाले मार्गों पर पहले ही अधिकार कर लें, और इस्राएल के पुत्रों[b] से युद्ध करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके सहयोगी बनकर आए थे।” यूनानी का अधिक शाब्दिक अर्थ है, “जो उसके गठबंधन के लिए आए थे।”
    reason: ‘गठबंधन में शामिल होने’ और ‘सहयोगी बनकर आने’ के संभावित भावों को सुरक्षित रखने के लिए।
  - marker: b
    text: या, “इस्राएलियों।” यूनानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: पारंपरिक पारिवारिक पदवी और उसके सहज जातिवाचक विकल्प, दोनों को दर्शाने के लिए।
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: अगले दिन
  rationale: यह पिछले घटनाक्रम के बाद वाले दिन को सूचित करने वाली स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: παρήγγειλεν
  choice: आदेश दिया
  rationale: सैन्य संदर्भ में यह अधिकारपूर्वक निर्देश देने का स्पष्ट और स्वाभाविक अनुवाद है।
- source_word: πάσῃ τῇ στρατείᾳ αὐτοῦ
  choice: अपनी सारी सेना
  rationale: στρατεία यहाँ सैन्य दल या सेना को दर्शाता है; ‘सारी सेना’ उसके सामूहिक विस्तार को बनाए रखता है।
- source_word: παντὶ τῷ λαῷ αὐτοῦ
  choice: अपने उन सभी लोगों को
  rationale: λαός का अर्थ केवल सैनिकों तक सीमित नहीं किया गया है; अगले संबंधवाचक उपवाक्य से इन लोगों की पहचान आगे स्पष्ट होती है।
- source_word: οἳ παρεγένοντο ἐπὶ τὴν συμμαχίαν αὐτοῦ
  choice: जो उसकी संधि में शामिल होने आए थे
  rationale: यह παρεγένοντο के ‘आए थे’ और συμμαχία के राजनीतिक-सैन्य गठबंधन के भाव को सहज हिन्दी में व्यक्त करता है; अधिक शाब्दिक और वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἀναζευγνύειν ἐπὶ Βαιτυλουὰ
  choice: पड़ाव उठाकर बैतूलुआ की ओर बढ़ें
  rationale: सैन्य प्रयोग में ἀναζευγνύειν पड़ाव हटाकर प्रस्थान करने को और ἐπί गंतव्य की दिशा को व्यक्त करता है।
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: पहाड़ी प्रदेश के चढ़ाई वाले मार्गों
  rationale: ἀναβάσεις मूलतः ऊपर चढ़ने के रास्तों या पहुँच-मार्गों को दर्शाता है; यह अनुवाद उन्हें केवल संकरे दर्रों तक सीमित नहीं करता।
- source_word: προκαταλαμβάνεσθαι
  choice: पहले ही अधिकार कर लें
  rationale: क्रिया में किसी स्थान पर दूसरों से पहले कब्ज़ा या अधिकार कर लेने का पूर्वगामी सैन्य भाव है।
- source_word: ποιεῖν πόλεμον πρὸς
  choice: से युद्ध करें
  rationale: यह यूनानी युद्ध-संबंधी मुहावरे का संक्षिप्त, वर्तमान हिन्दी में स्वाभाविक रूप है।
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यह पारंपरिक पारिवारिक जातीय पदवी को स्रोत के अनुसार बनाए रखता है, जबकि सहज सामुदायिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: जातीय-वाचक पारिवारिक पदवी τοὺς υἱοὺς Ἰσραήλ का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: स्रोत में प्रयुक्त पुल्लिंग पारिवारिक पदवी को बनाए रखने से बाइबलीय संबोधन और उसकी वंशगत प्रतिध्वनि सुरक्षित रहती है; इसे केवल आधुनिक जातिवाचक संज्ञा में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। सैन्य क्रियाओं को सामान्य पाठक के लिए स्पष्ट रखा गया है, पर ‘चढ़ाई वाले मार्गों’ और ‘इस्राएल के पुत्रों’ जैसे स्रोत-सापेक्ष पदों को अनावश्यक रूप से सरल नहीं किया गया।
