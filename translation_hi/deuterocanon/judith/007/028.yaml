base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/028.yaml
  text: We call heaven and earth and our God and Lord of our fathers to witness against you[a], who avenges us according to our sins and according to the sins of our fathers[b], that he may not act according to these words today.
translation:
  language: hi
  text: हम स्वर्ग और पृथ्वी, तथा अपने परमेश्वर और अपने पूर्वजों के प्रभु को तुम्हारे विरुद्ध साक्षी ठहराते हैं[a], जो हमारे पापों और हमारे पूर्वजों के पापों के अनुसार हमें दण्ड देता है[b], ताकि वह आज इन बातों के अनुसार न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “हम तुम्हें गवाही देते हैं।” यहाँ यूनानी वाक्यांश का आशय सम्भवतः स्वर्ग, पृथ्वी और परमेश्वर को उनके विरुद्ध औपचारिक रूप से साक्षी ठहराना है।
    reason: lexical_alternative
  - marker: b
    text: “हमें दण्ड देता है” का अनुवाद “हमारे पापों के अनुसार हमसे बदला लेता है” या “हमारे पापों के कारण हमें प्रतिफल देता है” भी हो सकता है। यहाँ भाव पाप के अनुरूप दैवी दण्ड का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρόμεθα ὑμῖν
  choice: हम तुम्हारे विरुद्ध ... को साक्षी ठहराते हैं
  rationale: क्रिया का रूप और ὑμῖν का सम्प्रदान-कारक शाब्दिक रूप से ‘हम तुम्हें गवाही देते हैं’ हो सकता है, पर सूचीबद्ध साक्षियों वाला औपचारिक प्रसंग उनके विरुद्ध साक्षी बुलाने का भाव देता है।
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: स्वर्ग और पृथ्वी
  rationale: यह समस्त सृष्टि को समेटने वाला प्रचलित युग्म है; हिन्दी में विभक्ति-चिह्न ‘को’ संयुक्त सूची के अंत में स्वाभाविक रूप से लागू होता है।
- source_word: τὸν θεὸν ἡμῶν καὶ κύριον τῶν πατέρων ἡμῶν
  choice: अपने परमेश्वर तथा अपने पूर्वजों के प्रभु
  rationale: दो समन्वित दैवी पदों को अलग-अलग बनाए रखा गया है; κύριος के लिए दैवी उपाधि ‘प्रभु’ उपयुक्त है।
- source_word: ἐκδικεῖ ἡμᾶς
  choice: हमें दण्ड देता है
  rationale: ἐκδικέω न्याय चुकाने, प्रतिशोध लेने या दण्ड देने का अर्थ रखता है। पापों के अनुसार हम पर होने वाली कार्रवाई के संदर्भ में ‘दण्ड देता है’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और इसे हमारे पक्ष में बदला लेने का भ्रम नहीं होने देता।
- source_word: κατὰ τὰς ἁμαρτίας ἡμῶν καὶ κατὰ τὰ ἁμαρτήματα τῶν πατέρων ἡμῶν
  choice: हमारे पापों और हमारे पूर्वजों के पापों के अनुसार
  rationale: κατά पापों के अनुरूप न्याय या प्रतिफल का संबंध व्यक्त करता है। दोनों निकटार्थक यूनानी संज्ञाओं को स्वाभाविक हिन्दी में ‘पाप’ कहा गया है।
- source_word: ἵνα μὴ ποιήσῃ κατὰ τὰ ῥήματα ταῦτα ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: ऐसा न हो कि वह आज इन बातों के अनुसार करे
  rationale: नकारात्मक ἵνα-वाक्य के आशंका/निवारण भाव को ‘ऐसा न हो कि’ से व्यक्त किया गया है। ‘इन बातों के अनुसार’ पिछले कथनों से संबंध बनाए रखता है और मूल की असहज पर वास्तविक अनिश्चितता को नहीं सुलझाता।
theological_decisions:
- issue: κύριος को दैवी उपाधि के रूप में व्यक्त करना
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ पद ‘हमारे पूर्वजों’ से जुड़ी हुई दैवी उपाधि है; ‘प्रभु’ उसका धार्मिक और वाचिक अनुनाद बनाए रखता है, बिना किसी सम्प्रदायगत विशेष अर्थ को जोड़ने के।
- issue: ἐκδικεῖ में दैवी न्याय का स्वरूप
  choice: हमें दण्ड देता है
  alternative: हमसे बदला लेता है / हमारे विरुद्ध न्याय चुकाता है
  rationale: वाक्य परमेश्वर की कार्रवाई को हमारे और पूर्वजों के पापों के अनुरूप बताता है। ‘दण्ड देता है’ प्रतिकूल न्याय का भाव स्पष्ट करता है, जबकि टिप्पणी में प्रतिशोध/प्रतिफल का व्यापक शाब्दिक क्षेत्र सुरक्षित रखा गया है।
- issue: ἵνα μὴ ποιήσῃ का प्रयोजन अथवा आशंका-सूचक बल
  choice: ऐसा न हो कि वह ... करे
  alternative: ताकि वह ... न करे
  rationale: दोनों अर्थ व्याकरणतः निकट हैं। प्रसंग में गंभीर चेतावनी और आशंका का स्वर हिन्दी के ‘ऐसा न हो कि’ से स्वाभाविक रूप में आता है, पर कथन के आशय को आगे बढ़कर निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पूर्वज’ सामान्य पाठक के लिए ‘पितरों’ से अधिक सहज है। अंतिम उपवाक्य की मूल यूनानी अस्पष्टता को व्याख्यात्मक विस्तार से नहीं हटाया गया।
