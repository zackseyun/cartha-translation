base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/029.yaml
  text: And there was great weeping in the midst of the whole assembly[a], all together, and they cried out to the Lord God with a loud voice.
translation:
  language: hi
  text: तब सारी सभा[a] के बीच एक साथ बड़ा रोना मच गया, और उन्होंने ऊँची आवाज़ में प्रभु परमेश्वर को पुकारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मंडली’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: मच गया
  rationale: कथात्मक अस्तित्वसूचक प्रयोग को हिंदी में स्वाभाविक ढंग से व्यक्त करता है और सामूहिक रोने के आरंभ का भाव देता है।
- source_word: κλαυθμὸς μέγας
  choice: बड़ा रोना
  rationale: κλαυθμός के वास्तविक रोने-विलाप करने के भाव और μέγας की तीव्रता, दोनों को सरल आधुनिक हिंदी में रखता है।
- source_word: ἐν μέσῳ τῆς ἐκκλησίας
  choice: सारी सभा के बीच
  rationale: ἐκκλησία यहाँ एकत्र समुदाय है, बाद की संस्थागत ‘कलीसिया’ नहीं; ‘सभा’ इस प्रसंग में स्पष्ट और अनैतिहासिक अर्थारोपण से मुक्त है।
- source_word: πάντων ὁμοθυμαδόν
  choice: सारी सभा ... एक साथ
  rationale: πάντων की समग्रता और ὁμοθυμαδόν की संयुक्त कार्रवाई दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐβόησαν
  choice: पुकारा
  rationale: परमेश्वर की ओर निर्देशित व्याकुल और ऊँची विनती को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πρὸς Κύριον τὸν θεὸν
  choice: प्रभु परमेश्वर को
  rationale: κύριος और θεός के संयुक्त ईश्वरीय संबोधन को प्रचलित, गरिमापूर्ण हिंदी में रखता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: करणवाचक दत्तिव और μεγάλῃ के ध्वनि-बल का सहज हिंदी रूप है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: यूनानी पाठ में κύριος है; ‘प्रभु’ उसका सीधा और प्रार्थना-संदर्भ के अनुकूल अनुवाद है, जबकि ‘यहोवा’ मूल यूनानी से आगे जाकर किसी अंतर्निहित हिब्रू रूप को निश्चित कर देगा।
- issue: ἐκκλησία का अनुवाद
  choice: सभा
  alternative: मंडली; कलीसिया
  rationale: यहाँ शब्द एकत्र लोगों के समुदाय को दर्शाता है। ‘सभा’ बाद की ईसाई संस्थागत धारणा आरोपित किए बिना प्रसंग का अर्थ सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘कलीसिया’ से बचकर प्राचीन यहूदी सामुदायिक सभा का प्रसंग बनाए रखा गया है।
