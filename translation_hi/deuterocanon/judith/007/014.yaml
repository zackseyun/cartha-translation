review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the military encampment, the purpose of preventing any one man from leaving the city, wasting away in famine, and collapse before the sword reaches them. However, “उनके सामने” unjustifiably resolves ἐπʼ αὐταῖς, whose feminine antecedent is contextually disputed/uncertain in this isolated verse; “उनके विरुद्ध” preserves the hostile positioning without specifying a spatial relation. “तब” adds a temporal inference not expressed by καί. The footnote should also retain the alternate force of καταστρωθήσονται, not only πλατεῖαι.
  naturalness: The Hindi is generally fluent and appropriately formal. “अकाल में घुलते जाएँगे” is understandable but less idiomatic for bodily wasting away; “अकाल से क्षीण होते जाएँगे” is natural and accurately preserves the progressive deterioration. “धराशायी हो जाएँगे” is suitable for the final verb.
  terminology: “पड़ाव डालेंगे,” “पहरा देने के लिए,” “नगर,” “अकाल,” and “तलवार” fit modern standard Hindi and the passage’s register. “निवास-स्थान” is acceptable for οἴκησις; the plural possessive is retained in “उनके निवास-स्थान की.”
  issues:
  - severity: medium
    issue: “उनके सामने” specifies the relation of ἐπʼ αὐταῖς too narrowly.
    rationale: The Greek feminine pronoun has an antecedent supplied by context, and the relation can be rendered adversatively in the siege context. “उनके विरुद्ध” does not impose the unsupported ‘in front of them’ interpretation.
  - severity: low
    issue: “तब” adds an explicit temporal sequence.
    rationale: The Greek uses καί; no temporal adverb is needed in Hindi.
  - severity: low
    issue: The footnote omits the lexical ambiguity of καταστρωθήσονται reflected in the English audit trail.
    rationale: The note anchor follows “चौड़ी सड़कों,” but the relevant Greek phrase includes both the location and the image of being cast/spread down. Retaining both alternatives better represents the source ambiguity.
  revised_text: और हम उनके विरुद्ध पहरा देने के लिए पड़ाव डालेंगे, ताकि नगर से एक भी पुरुष बाहर न निकल सके। वे, उनकी पत्नियाँ और उनके बच्चे अकाल से क्षीण होते जाएँगे; और तलवार उन पर आने से पहले ही वे उनके निवास-स्थान की चौड़ी सड़कों[a] पर धराशायी हो जाएँगे।
