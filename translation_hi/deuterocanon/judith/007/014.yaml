base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/014.yaml
  text: And we will encamp against them as a guard[a], so that not one man may go out from the city. And they, and their wives, and their children, will waste away in the famine, and before the sword comes upon them, they will be laid low in the streets of their dwellings.
translation:
  language: hi
  text: और हम उनके विरुद्ध पहरा देने के लिए पड़ाव डालेंगे, ताकि नगर से एक भी पुरुष बाहर न निकल सके। वे, उनकी पत्नियाँ और उनके बच्चे अकाल से क्षीण होते जाएँगे; और तलवार उन पर आने से पहले ही वे उनके निवास-स्थान की चौड़ी सड़कों[a] पर धराशायी हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके निवास-स्थान के चौकों में बिछे पड़े होंगे।” यूनानी शब्द πλατεῖαι का अर्थ चौड़ी सड़कें या सार्वजनिक चौक हो सकता है, और καταστρωθήσονται का अर्थ धराशायी होना या भूमि पर बिछ जाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβαλοῦμεν ἐπʼ αὐταῖς
  choice: हम उनके सामने ... पड़ाव डालेंगे
  rationale: क्रिया सैन्य पड़ाव डालने को बताती है। स्त्रीलिंग सर्वनाम का संदर्भ संभवतः पहले उल्लिखित जल-स्रोतों अथवा पहुँच-स्थानों से है; इसलिए अस्पष्ट ‘उनके विरुद्ध’ के बजाय घेराबंदी में सामने तैनाती का स्वाभाविक भाव रखा गया है।
- source_word: εἰς προφυλακὴν
  choice: पहरा देने के लिए
  rationale: यह पद पड़ाव के उद्देश्य—निगरानी और निकास रोकने—को व्यक्त करता है।
- source_word: τοῦ μὴ ἐξελθεῖν ἐκ τῆς πόλεως ἄνδρα ἕνα
  choice: ताकि नगर से एक भी पुरुष बाहर न निकल सके
  rationale: ‘एक भी पुरुष’ यूनानी के पुरुषवाचक एकवचन को बनाए रखता है और निषेधात्मक उद्देश्य को सहज हिन्दी में व्यक्त करता है।
- source_word: τακήσονται
  choice: घुलते जाएँगे
  rationale: मूल क्रिया का शाब्दिक भाव ‘पिघलना’ है, जो अकाल से धीरे-धीरे क्षीण होने के रूपक में प्रयुक्त है; ‘घुलते जाएँगे’ उस रूपक और क्रमिक क्षय दोनों को बचाता है।
- source_word: ἐν τῷ λιμῷ
  choice: अकाल में
  rationale: λιμός यहाँ घेराबंदी से उत्पन्न अकाल को सूचित करता है; कारण को अधिक स्पष्ट किए बिना मूल संबंध रखा गया है।
- source_word: ῥομφαίαν
  choice: तलवार
  rationale: यह बड़े धारदार हथियार के लिए प्रयुक्त शब्द है; प्रसंग में मानक और स्वाभाविक हिन्दी ‘तलवार’ है।
- source_word: καταστρωθήσονται
  choice: धराशायी हो जाएँगे
  rationale: क्रिया नीचे गिरा दिए जाने या भूमि पर बिछ जाने का भाव देती है। ‘धराशायी’ मृत्यु को अनावश्यक रूप से स्पष्ट किए बिना विनाशकारी पतन व्यक्त करता है।
- source_word: ἐν ταῖς πλατείαις
  choice: चौड़ी सड़कों पर
  rationale: πλατεῖαι चौड़ी सड़कों या सार्वजनिक चौकों दोनों को कह सकता है। मुख्य पाठ में व्युत्पत्तिगत रूप से निकट ‘चौड़ी सड़कें’ रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: τῆς οἰκήσεως αὐτῶν
  choice: अपने निवास-स्थान की
  rationale: οἴκησις का सामूहिक अर्थ बस्ती अथवा रहने का स्थान हो सकता है; एकवचन संबंध को ‘निवास-स्थान’ से बनाए रखा गया है।
