- source_word: τῆς πόλεως Βαιτυλουά
  choice: बेतूलिया नगर के
  rationale: πόλις के लिए सहज और गरिमापूर्ण ‘नगर’ रखा गया है तथा Βαιτυλουά को हिन्दी ध्वन्यंतरण में ‘बेतूलिया’ लिखा गया है।
- source_word: εὗρον
  choice: पाया
  rationale: मूल क्रिया का सामान्य अर्थ ‘पाना’ है; यहाँ इसका आशय फाटक पर उन व्यक्तियों से मिलने या उन्हें वहाँ उपस्थित पाने से है।
- source_word: ἐφεστῶτα ἐπʼ αὐτῇ
  choice: वहाँ ... खड़ा
  rationale: कृदंत उज्जियाह के खड़े या उपस्थित होने को बताता है और सर्वनाम का संकेत फाटक की ओर है। हिन्दी में ‘वहाँ खड़ा’ स्वाभाविक है।
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: नगर के बुज़ुर्ग
  rationale: πρεσβύτεροι यहाँ नगर के मान्य वरिष्ठ जन या अगुए हैं। ‘बुज़ुर्ग’ मूल के वरिष्ठता-संबंधी भाव को सरल आधुनिक हिन्दी में बनाए रखता है।
- source_word: Ὀζίαν ... Χάβρειν καὶ Χάρμειν
  choice: उज्जियाह ... खाब्रिस और खार्मिस
  rationale: व्यक्तिनामों को पहचानने योग्य हिन्दी बाइबलीय रूपों और यूनानी ध्वनियों के निकट ध्वन्यंतरित किया गया है।
