  yaml_path: translation/deuterocanon/judith/010/006.yaml
  text: And they went out to the gate of the city of Bethulia[a], and found Uzziah standing there, and Chabris and Charmis, the elders of the city.
translation:
  language: hi
  text: और वे बाहर निकलकर बेतूलिया नगर के फाटक की ओर गईं। वहाँ उन्होंने उज्जियाह को खड़ा[a] पाया, और नगर के बुज़ुर्ग खाब्रिस और खार्मिस को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘उस पर खड़ा’ है; ‘उस’ फाटक को सूचित करता है। संदर्भ में इसका अर्थ ‘फाटक पर’ या ‘फाटक के पास खड़ा’ हो सकता है।
    reason: मूल स्थान-सूचक वाक्यांश की शाब्दिक अभिव्यक्ति और संदर्भगत अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐξῆλθον ἐπὶ τὴν πύλην
  choice: फाटक की ओर बाहर निकलीं
