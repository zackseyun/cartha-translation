base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/004.yaml
  text: And she put sandals on her feet[a], and put on her anklets and bracelets and rings and earrings and all her jewelry; and she made herself very beautiful[b], to deceive the eyes of any men who might see her.
translation:
  language: hi
  text: और उसने अपने पैरों में सैंडल पहने और अपनी पायलें, कंगन, अंगूठियाँ, बालियाँ और अपने सारे गहने[a] पहन लिए। फिर उसने अपने को बहुत सुंदर बनाया, ताकि जितने भी पुरुष उसे देखें[b], उनकी आँखों को धोखा दे सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी सारी श्रृंगार-सामग्री’ अथवा ‘अपना पूरा साज-सिंगार।’ यहाँ यूनानी κόσμος का अर्थ सजावट या आभूषण है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे सभी पुरुष जो उसे देखें।’ यूनानी अभिव्यक्ति अनिश्चित और सामान्य है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν σανδάλια εἰς τοὺς πόδας αὐτῆς
  choice: अपने पैरों में सैंडल पहने
  rationale: यद्यपि ἔλαβεν का मूल अर्थ ‘लिया’ है, वस्त्राभूषण धारण करने के इस प्रसंग में स्वाभाविक हिन्दी ‘पहने’ है।
- source_word: περιέθετο
  choice: पहन लिए
  rationale: मध्यवाच्य क्रिया यहाँ अपने ऊपर आभूषण धारण करने को व्यक्त करती है; ‘पहन लिए’ सहज और स्पष्ट है।
- source_word: χλιδῶνας
  choice: पायलें
  rationale: आभूषणों की इस सूची में यह किसी विशिष्ट आभूषण का संकेत देता जान पड़ता है; ‘पायलें’ ठोस और सामान्य पाठक के लिए बोधगम्य है, यद्यपि शब्द में विलासपूर्ण आभूषण का व्यापक भाव संभव है।
- source_word: ψέλια
  choice: कंगन
  rationale: यह हाथ या बाँह पर पहने जाने वाले आभूषण को दर्शाता है; आधुनिक हिन्दी में ‘कंगन’ सबसे सहज समानार्थी है।
- source_word: δακτυλίους
  choice: अंगूठियाँ
  rationale: यह उँगलियों में पहनी जाने वाली अंगूठियों का सामान्य यूनानी शब्द है।
- source_word: ἐνώτια
  choice: बालियाँ
  rationale: यह कान के आभूषणों को दर्शाता है; ‘बालियाँ’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: πάντα τὸν κόσμον αὐτῆς
  choice: अपने सारे गहने
  rationale: κόσμος यहाँ ‘संसार’ नहीं, बल्कि सजावट या आभूषण के अर्थ में है। निकटवर्ती सूची के कारण ‘सारे गहने’ ठोस और पठनीय है; व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐκαλλωπίσατο σφόδρα
  choice: अपने को बहुत सुंदर बनाया
  rationale: मध्यवाच्य रूप आत्म-सज्जा और उसके परिणाम, दोनों को व्यक्त करता है; σφόδρα की तीव्रता ‘बहुत’ से सुरक्षित रहती है।
- source_word: εἰς ἀπάτησιν
  choice: धोखा दे सके
  rationale: वाक्यांश उद्देश्य प्रकट करता है और ἀπάτησις के छल या धोखे के स्पष्ट अर्थ को नरम नहीं करता।
- source_word: ὀφθαλμῶν ἀνδρῶν
  choice: पुरुषों की आँखों को
  rationale: मूल पाठ की ‘आँखों’ वाली सजीव छवि को बनाए रखा गया है।
- source_word: ὅσοι ἂν ἴδωσιν αὐτήν
  choice: जितने भी पुरुष उसे देखें
  rationale: ὅσοι ἄν के अनिश्चित और सामान्य भाव को हिन्दी में ‘जितने भी’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यहूदीत के सजने का नैतिक उद्देश्य
  choice: उसने पुरुषों की आँखों को धोखा देने के उद्देश्य से अपने को सुंदर बनाया।
  alternative: इसे केवल पुरुषों को आकर्षित या मोहित करने के रूप में नरम किया जा सकता था।
  rationale: ἀπάτησις स्पष्ट रूप से छल या धोखे को दर्शाता है। अनुवाद कथा में उपस्थित नैतिक तनाव को बनाए रखता है और उसका समाधान पाठक की ओर से नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। आभूषणों की ठोस सूची को बनाए रखा गया है और छल के उद्देश्य को बिना नरम किए स्पष्ट किया गया है। पादटिप्पणी-चिह्न संबंधित हिन्दी पदों के तुरंत बाद रखे गए हैं।
