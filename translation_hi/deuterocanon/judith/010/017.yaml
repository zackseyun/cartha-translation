  text: तब उन्होंने अपने बीच से सौ पुरुष चुने, और उन्हें उसके और उसकी दासी के साथ अनुरक्षक के रूप में भेजा; फिर वे उन दोनों को होलोफेरनेस के तंबू तक ले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλεξαν ἐξ αὐτῶν
  choice: अपने बीच से ... चुने
  rationale: यह चयन को एक बड़े समूह के भीतर से किए जाने का भाव स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἄνδρας ἑκατόν
  choice: सौ पुरुष
  rationale: मूल संख्या और पुरुषों के स्पष्ट उल्लेख को सीधे तथा गरिमापूर्ण ढंग से रखता है।
- source_word: παρέζευξαν
  choice: सुरक्षा के साथ ... ले गए
  rationale: संदर्भ में क्रिया साथ चलने या पहरेदार अनुरक्षण का भाव देती है; यह हिन्दी प्रयोग उस कार्य को स्पष्ट करता है और अगली क्रिया के साथ अनावश्यक पुनरुक्ति से बचता है।
- source_word: τῇ ἄβρᾳ αὐτῆς
  choice: उसकी दासी
  rationale: ἄβρα यहाँ यहूदीत के साथ रहने वाली स्त्री सेविका को सूचित करता है; 'दासी' संक्षिप्त, परिचित और प्रसंगानुकूल है।
- source_word: ἤγαγον
  choice: ले गए
  rationale: गंतव्य की ओर अगुवाई करके पहुँचाने के अर्थ को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: σκηνὴν
  choice: तंबू
  rationale: सैन्य पड़ाव में σκηνή का सामान्य और सीधा अर्थ 'तंबू' है।
- source_word: Ὀλοφέρνου
  choice: होलोफेरनेस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित ध्वन्यात्मक लिप्यंतरण।
