  yaml_path: translation/deuterocanon/judith/010/023.yaml
  text: When Judith came before him and his attendants[a], they all marveled at the beauty of her face; and falling on her face, she bowed down to him, and they raised her up.
translation:
  language: hi
  text: जब यूदीत उसके तथा उसके परिचारकों के सामने आई, तो वे सब उसके चेहरे की सुंदरता देखकर चकित रह गए। वह मुँह के बल गिर पड़ी और उसने उसे दण्डवत प्रणाम किया[a]; फिर उन्होंने उसे उठाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके प्रति दण्डवत सम्मान किया।” यूनानी क्रिया का अर्थ “आराधना करना” भी हो सकता है, पर यहाँ इसका प्रयोग एक मानवीय शासक के प्रति आदर प्रकट करने के लिए हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πρόσωπον αὐτοῦ … καὶ τῶν θεραπόντων αὐτοῦ
  choice: उसके और उसके सेवकों के सामने
  rationale: κατὰ πρόσωπον यहाँ किसी की उपस्थिति में आने का मुहावरा है। ‘सामने’ दरबारी प्रसंग में स्वाभाविक है और केवल आमने-सामने की भौतिक स्थिति पर अनावश्यक बल नहीं देता। θεράπων के लिए ‘सेवक’ साधारण आधुनिक हिन्दी है; यहाँ इसका अर्थ दास होना आवश्यक नहीं।
- source_word: ἐθαύμασαν
  choice: चकित रह गए
  rationale: क्रिया आश्चर्य और प्रशंसापूर्ण विस्मय व्यक्त करती है। यह प्रयोग आधुनिक हिन्दी में सहज है।
- source_word: ἐπὶ τῷ κάλλει τοῦ προσώπου
  choice: उसके चेहरे की सुंदरता देखकर
  rationale: κάλλος का सीधा अर्थ ‘सुंदरता’ और πρόσωπον का यहाँ स्पष्ट अर्थ ‘चेहरा’ है। ‘देखकर’ हिन्दी में विस्मय के कारण को स्वाभाविक रूप से जोड़ता है।
- source_word: πεσοῦσα ἐπὶ πρόσωπον
  choice: वह मुँह के बल गिर पड़ी
  rationale: यह अनुवाद मूल यूनानी की सजीव शारीरिक मुद्रा को बनाए रखता है और केवल अमूर्त ‘साष्टांग हुई’ कहकर दृश्य को संक्षिप्त नहीं करता।
- source_word: προσεκύνησεν αὐτῷ
  choice: उसने उसे दण्डवत प्रणाम किया
  rationale: मानवीय शासक के सामने इस प्रसंग में προσκυνέω आदर और अधीनता की शारीरिक अभिव्यक्ति बताता है। ‘दण्डवत प्रणाम’ मुद्रा और सम्मान दोनों व्यक्त करता है, बिना इसे अनिवार्य रूप से ईश्वरीय आराधना बनाने के।
- source_word: ἤγειραν αὐτήν
  choice: उन्होंने उसे उठाया
  rationale: बहुवचन कर्ता वहाँ उपस्थित लोगों, संभवतः सेवकों, की ओर संकेत करता है। ‘उठाया’ संक्षिप्त और मूल के अनुरूप है।
theological_decisions:
- issue: मानवीय सेनापति के लिए προσκυνέω का अर्थ
  choice: दण्डवत प्रणाम किया
  alternative: उसकी आराधना की / उसे दण्डवत सम्मान दिया
  rationale: क्रिया के अर्थ-क्षेत्र में आराधना भी आ सकती है, पर यहाँ उसका लक्ष्य एक मानवीय सेनापति है और दरबारी संदर्भ सम्मानपूर्वक दण्डवत होने का समर्थन करता है। पादटिप्पणी व्यापक अर्थ-क्षेत्र को छिपने नहीं देती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यूदीत’ नाम का प्रचलित हिन्दी बाइबलीय रूप है। वाक्य-विन्यास को यूनानी क्रम की कठोर नकल से बचाते हुए उसकी क्रियाओं और दरबारी दृश्य को सुरक्षित रखा गया है।
