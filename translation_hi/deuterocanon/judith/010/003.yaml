base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/003.yaml
  text: And she took off the sackcloth that she had been wearing[a], and removed the garments of her widowhood. She washed her body with water and anointed herself with rich perfume, arranged the hair of her head, put a headband on it, and put on her festive garments, with which she used to adorn herself during the days of her husband Manasseh’s life[c][b];
translation:
  language: hi
  text: उसने वह टाट उतार दिया जिसे वह पहने हुए थी, और अपने विधवापन के वस्त्र भी उतार दिए। उसने अपने शरीर को पानी से धोया, अपने ऊपर गाढ़ा सुगंधित लेप लगाया,[a] अपने सिर के बाल सँवारे, सिर पर पट्टी बाँधी,[b] और अपने उत्सव के वे वस्त्र पहन लिए जिनसे वह अपने पति मनश्शे के जीवनकाल में अपना श्रृंगार किया करती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भरपूर सुगंधित तेल लगाया।” यूनानी पद सुगंधित तेल अथवा लेप का अर्थ दे सकता है, और विशेषण उसके गाढ़ेपन या समृद्ध गुण को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सिरोवस्त्र पहना।” यूनानी शब्द सिर पर बाँधे जाने वाले पट्टे या सिर ढकने वाले अलंकृत वस्त्र के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιείλατο τὸν σάκκον ὃν ἐνεδύκει
  choice: वह टाट उतार दिया जिसे वह पहने हुए थी
  rationale: मध्यवाच्य क्रिया अपने शरीर से वस्त्र उतारने को व्यक्त करती है; पूर्वकालिक ἐνεδύκει को स्वाभाविक हिन्दी में जारी पूर्व अवस्था के रूप में रखा गया है।
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: अपने विधवापन के वस्त्र
  rationale: यह अभिव्यक्ति सामान्य शोक-वस्त्रों से अधिक स्पष्ट रूप से उसकी विधवा-अवस्था से जुड़े परिधान बताती है; मूल संबंध को बनाए रखा गया है।
- source_word: περιεκλύσατο τὸ σῶμα ὕδατι
  choice: अपने शरीर को पानी से धोया
  rationale: क्रिया शरीर को पानी से धोने का संकेत देती है; 'स्नान किया' की अपेक्षा यह मूल की क्रिया और कर्म दोनों को अधिक सीधे रखता है।
- source_word: ἔχρισατο μύρῳ παχεῖ
  choice: गाढ़े सुगंधित लेप से अपना अभिषेक किया
  rationale: μύρον सुगंधित तेल या लेप है और παχύς गाढ़ेपन अथवा समृद्ध गुण का बोध करा सकता है। 'सुगंधित लेप' हिन्दी में स्वाभाविक है और पदार्थ को केवल आधुनिक तरल इत्र नहीं बनाता।
- source_word: διέταξε τὰς τρίχας τῆς κεφαλῆς αὐτῆς
  choice: अपने सिर के बाल सँवारे
  rationale: διέταξε का आशय व्यवस्थित करने से है; 'सँवारे' किसी असिद्ध विधि, जैसे कंघी करना, को अनावश्यक रूप से निर्दिष्ट किए बिना सहज हिन्दी देता है।
- source_word: μίτραν
  choice: सिर पर पट्टी
  rationale: शब्द सिर पर बाँधे या रखे जाने वाले पट्टे अथवा सिरोवस्त्र को सूचित कर सकता है। मुख्य पाठ में न्यूनतम विशिष्ट 'पट्टी' रखी गई और व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τὰ ἱμάτια τῆς εὐφροσύνης αὐτῆς
  choice: अपने उत्सव के वे वस्त्र
  rationale: εὐφροσύνη आनन्द और उत्सव का भाव रखता है; वस्त्रों के संदर्भ में 'उत्सव के वस्त्र' शोक-वस्त्रों के साथ मूल विरोध को स्पष्ट रखता है।
- source_word: ἐν αἷς ἐστολίζετο
  choice: जिनसे ... अपना श्रृंगार किया करती थी
  rationale: ἐστολίζετο सजने-सँवरने या स्वयं को अलंकृत करने और अपूर्णकाल में अभ्यस्त क्रिया का बोध देता है; 'किया करती थी' उस आवृत्त भाव को सुरक्षित रखता है।
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς τοῦ ἀνδρὸς αὐτῆς Μανασσή
  choice: अपने पति मनश्शे के जीवनकाल में
  rationale: शाब्दिक 'जीवन के दिनों में' का स्वाभाविक आधुनिक हिन्दी समतुल्य 'जीवनकाल में' है; अर्थ में कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: विधवापन और शोक की छवि
  choice: टाट और विधवापन के वस्त्र—दोनों स्पष्ट उल्लेख बनाए रखे गए
  alternative: सामान्य रूप से केवल 'शोक के कपड़े' कहना
  rationale: पद में विधवा के शोक-परिधान से उत्सवी श्रृंगार की ओर जानबूझकर हुए परिवर्तन पर बल है। दोनों पदों को अलग रखना कथात्मक और सामाजिक अर्थ सुरक्षित रखता है, बिना कोई सांप्रदायिक व्याख्या जोड़े।
- issue: सुगंधित पदार्थ से अभिषेक
  choice: गाढ़े सुगंधित लेप से अपना अभिषेक किया
  alternative: महँगा इत्र लगाया
  rationale: मूल में पदार्थ की कीमत स्पष्ट नहीं है, और χρίω अभिषेक/लेपन की क्रिया व्यक्त करता है। इसलिए लागत या केवल आधुनिक इत्र का अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। 'टाट', 'विधवापन', 'अभिषेक' और 'उत्सव के वस्त्र' जैसे बाइबलीय-सांस्कृतिक शब्द मूल की छवियों को बनाए रखते हैं; वाक्य-रचना को हिन्दी के स्वाभाविक क्रम के अनुसार ढाला गया है।
