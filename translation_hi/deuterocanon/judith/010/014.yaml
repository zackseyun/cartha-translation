  text: And when the men heard her words and observed her face[b][a], she was exceedingly marvelous in beauty before them.
translation:
  language: hi
  text: जब उन पुरुषों ने उसकी बातें सुनीं और उसके चेहरे को ध्यान से देखा,[a] तो उन्हें उसका चेहरा अत्यन्त सुंदर और अद्भुत लगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके चेहरे को गौर से देखा”; यूनानी क्रिया ध्यानपूर्वक देखने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका चेहरा उनके सामने सौंदर्य में अत्यन्त अद्भुत था”; इसका अर्थ है कि उन्हें उसका चेहरा असाधारण रूप से सुंदर और अद्भुत दिखाई दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: जब ... सुनीं
  rationale: ὡς के साथ अओरिस्ट क्रिया यहाँ कालवाचक उपवाक्य बनाती है; ‘जब’ स्वाभाविक क्रम व्यक्त करता है, बिना तत्कालता को बढ़ाए।
- source_word: οἱ ἄνδρες
  choice: उन पुरुषों ने
  rationale: ἄνδρες का सामान्य अर्थ ‘पुरुष’ है। प्रसंग में वे पहरेदार हो सकते हैं, पर इस पद में यूनानी पाठ उन्हें स्पष्टतः ‘सैनिक’ नहीं कहता।
- source_word: τὰ ῥήματα αὐτῆς
  choice: उसकी बातें
  rationale: ῥήματα बोले गए शब्दों या कथनों को दर्शाता है; आधुनिक हिन्दी में ‘उसकी बातें’ सहज और अर्थनिष्ठ है।
- source_word: κατενόησαν
  choice: ध्यान से देखा
  rationale: κατανοέω सावधानीपूर्वक ध्यान देने या गौर से देखने का भाव रखता है। चेहरे के संदर्भ में ‘ध्यान से देखा’ इस सक्रिय, सजग अवलोकन को स्पष्ट करता है।
- source_word: τὸ πρόσωπον αὐτῆς
  choice: उसके चेहरे को
  rationale: πρόσωπον का प्रत्यक्ष अर्थ ‘चेहरा’ है; व्यापक ‘रूप’ के बजाय ठोस यूनानी अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ἦν ἐναντίον αὐτῶν
  choice: वह उन्हें ... लगी
  rationale: शाब्दिक भाव ‘वह उनके सामने/उनकी दृष्टि में थी’ है। हिन्दी में ‘उन्हें ... लगी’ स्वाभाविक ढंग से दर्शाता है कि उनकी दृष्टि में उसका सौंदर्य कैसा प्रतीत हुआ।
- source_word: θαυμάσιον
  choice: अद्भुत
  rationale: θαυμάσιος विस्मय और प्रशंसा उत्पन्न करने वाली बात को दर्शाता है; ‘अद्भुत’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: τῷ κάλλει
  choice: अपने सौंदर्य में
  rationale: दत्तिव यहाँ संबंध या क्षेत्र बताता है—सौंदर्य की दृष्टि से अद्भुत। ‘अपने सौंदर्य में’ यूनानी संरचना के निकट रहते हुए हिन्दी में स्पष्ट है।
- source_word: σφόδρα
  choice: अत्यन्त
  rationale: σφόδρα प्रबल तीव्रता व्यक्त करता है; ‘अत्यन्त’ ऊँचे कथात्मक स्तर को बनाए रखता है।
