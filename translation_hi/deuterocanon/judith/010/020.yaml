  to: और होलोफेरनेस के निकट रहनेवाले और उसके सभी सेवक बाहर आए, और वे उसे तंबू में ले गए।
  rationale: The revision uses “होलोफेरनेस के निकट रहनेवाले” to convey close proximity and possible attendance without eliminating the Greek participle’s literal sleep/lying sense, which is preserved in the footnote. It also replaces “तंबू के भीतर” with the more idiomatic “तंबू में,” while retaining the directional force through “ले गए.”
