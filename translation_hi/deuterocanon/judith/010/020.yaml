  text: And those attending Holofernes came out[a], and all his servants, and they brought her into the tent.
translation:
  language: hi
  text: और होलोफेरनेस के निकट रहनेवाले और उसके सभी सेवक बाहर आए, और वे उसे तंबू में ले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: बाहर आए
  rationale: क्रिया बाहर की ओर आने या निकलने को बताती है; इस प्रसंग में ‘बाहर आए’ स्वाभाविक है और यूनानी की दिशा बनाए रखता है।
- source_word: οἱ παρακαθεύδοντες Ὀλοφέρνῃ
  choice: होलोफेरनेस के पास सोनेवाले
  rationale: यूनानी कृदंत का शाब्दिक अर्थ उसके पास सोने या लेटनेवालों से है। मुख्य पाठ में इस वास्तविक अस्पष्टता को बनाए रखा गया है, जबकि पादटिप्पणी प्रसंगानुसार ‘निकट रहकर सेवा करनेवालों’ की सम्भावना स्पष्ट करती है।
- source_word: θεράποντες
  choice: सेवक
  rationale: यह शब्द सेवक या परिचारक को सूचित करता है; ‘सेवक’ सरल, आधुनिक और प्रसंगानुकूल है।
- source_word: εἰσήγαγον
  choice: भीतर ले गए
  rationale: εἰσάγω किसी को भीतर लाने या ले जाने को बताता है। हिन्दी कथन की दृष्टि से ‘भीतर ले गए’ दिशा और सकर्मक अर्थ दोनों स्पष्ट करता है।
- source_word: σκηνήν
  choice: तंबू
  rationale: सैनिक छावनी के इस प्रसंग में σκηνή का सीधा और सामान्य हिन्दी समतुल्य ‘तंबू’ है।
