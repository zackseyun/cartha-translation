  yaml_path: translation/deuterocanon/judith/010/005.yaml
  text: And she gave her maid a skin of wine and a flask of oil[a], and she filled a bag with barley meal and cakes of pressed figs and clean loaves; then she wrapped up all her vessels and placed them on her.
translation:
  language: hi
  text: और उसने अपनी दासी को दाखमधु की एक मशक और तेल की एक कुप्पी दी; फिर उसने एक झोले में जौ का आटा, दबाए हुए अंजीरों की टिकियाँ और शुद्ध रोटियाँ[a] भर दीं। उसने अपने सभी पात्र लपेटे और उन्हें उस दासी पर रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विधिपूर्वक शुद्ध रोटियाँ” अथवा “स्वच्छ रोटियाँ।” यूनानी पद ऐसी खाद्य सामग्री का संकेत दे सकता है जो शुद्धता-संबंधी नियमों के अनुसार तैयार की गई हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅβρᾳ
  choice: दासी
  rationale: यह शब्द यहाँ यहूदीत की स्त्री परिचारिका के लिए है। ‘दासी’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἀσκοπυτίνην οἶνον
  choice: दाखमधु की एक मशक
  rationale: संयुक्त संज्ञा चमड़े की मशक-जैसे पात्र को सूचित करती है; ‘दाखमधु की एक मशक’ पात्र और उसकी सामग्री दोनों को स्पष्ट रखता है।
- source_word: καψάκην ἐλαίου
  choice: तेल की एक कुप्पी
  rationale: संज्ञा छोटे, साथ ले जाने योग्य पात्र को सूचित करती है; ‘कुप्पी’ प्राचीन परिवेश में स्वाभाविक हिन्दी समतुल्य है।
- source_word: πῆραν
  choice: झोला
  rationale: यह यात्री की थैली या रसद रखने के झोले को दर्शाता है; ‘झोला’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ἀλφίτων
  choice: जौ का आटा
  rationale: बहुवचन संज्ञा सामान्यतः जौ से बने दलहनुमा आहार या आटे को सूचित करती है। प्रसंग और उपलब्ध पाठ-साक्ष्य के आधार पर ‘जौ का आटा’ खाद्य सामग्री का सहज अनुवाद है।
- source_word: παλάθης
  choice: दबाए हुए अंजीरों की टिकियाँ
  rationale: यह दबाकर बनाई गई अंजीर की टिकियों को दर्शाता है; अनुवाद उनकी सामग्री और बनाने की रीति दोनों स्पष्ट करता है।
- source_word: ἄρτων καθαρῶν
  choice: शुद्ध रोटियाँ
  rationale: καθαρός भौतिक स्वच्छता के साथ धार्मिक अथवा आहार-संबंधी शुद्धता का संकेत भी दे सकता है। ‘शुद्ध’ इस व्यापकता को बनाए रखता है।
- source_word: περιεδίπλωσε
  choice: लपेटे
  rationale: क्रिया चारों ओर मोड़ने या लपेटकर बाँधने का भाव देती है; सामान तैयार करने के प्रसंग में ‘लपेटे’ उपयुक्त है।
- source_word: τὰ ἄγγη αὐτῆς
  choice: अपने सभी पात्र
  rationale: ἄγγη पात्रों या बरतनों का व्यापक शब्द है; ‘पात्र’ उसके अर्थ को अनावश्यक विशिष्टता के बिना बनाए रखता है।
- source_word: ἐπέθηκε αὐτῇ
  choice: उन्हें उस दासी पर रख दिया
  rationale: स्त्रीलिंग सर्वनाम का सबसे स्वाभाविक पूर्वपद दासी है। ‘उस दासी’ कहने से हिन्दी में संदर्भ स्पष्ट होता है, पर पीठ या कंधों जैसी अनुपस्थित जानकारी नहीं जोड़ी जाती।
theological_decisions:
- issue: ἄρτων καθαρῶν में शुद्धता का आशय
  choice: शुद्ध रोटियाँ
  alternative: विधिपूर्वक शुद्ध रोटियाँ; स्वच्छ रोटियाँ
  rationale: यूनानी विशेषण अनुष्ठानिक या आहार-संबंधी शुद्धता का संकेत दे सकता है, लेकिन उसे तकनीकी धार्मिक अर्थ तक सीमित नहीं करता। मुख्य पाठ का ‘शुद्ध’ इस तनाव को सुरक्षित रखता है और पादटिप्पणी संभावित अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। प्राचीन यात्रा-सामग्री के लिए ‘मशक’, ‘कुप्पी’ और ‘झोला’ जैसे सुबोध शब्द चुने गए हैं। सर्वनाम की अस्पष्टता से बचने के लिए अंतिम वाक्य में ‘उस दासी’ कहा गया है; कोई अनुल्लिखित शारीरिक स्थान नहीं जोड़ा गया।
