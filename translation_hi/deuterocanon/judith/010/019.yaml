base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/019.yaml
  text: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
translation:
  language: hi
  text: वे उसके सौंदर्य को देखकर विस्मित हुए, और उसके कारण इस्राएल के पुत्रों[a] को देखकर भी विस्मित हुए। हर एक ने अपने पड़ोसी से कहा, “जिस लोगों के बीच ऐसी स्त्रियाँ हों, उन लोगों को कौन तुच्छ समझेगा? क्योंकि उनमें से एक भी पुरुष को छोड़ देना अच्छा नहीं है; जिन्हें छोड़ दिया जाएगा, वे सारी पृथ्वी को अपनी चतुराई से मात दे सकेंगे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “इस्राएली।” यूनानी में, “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: 'यह भी अनुवाद हो सकता है: “जो जीवित छोड़ दिए जाएँगे, वे सारे संसार को अपनी चतुराई से मात दे सकेंगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: चकित होते रहे
  rationale: अपूर्ण भूतकाल की निरंतरता और विस्मय दोनों को व्यक्त करता है; यूनानी में हुई पुनरावृत्ति भी हिन्दी में बनाए रखी गई है।
- source_word: κάλλει
  choice: सौंदर्य
  rationale: यहाँ Judith के रूप-सौंदर्य के लिए स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी की पुरुषवाची पारंपरिक अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखता है; इसका सामूहिक अर्थ इस्राएली लोग है।
- source_word: ἀπʼ αὐτῆς
  choice: उसके कारण
  rationale: Judith स्वयं इस्राएलियों के विषय में उनके विस्मय का कारण है; यह कारणवाचक अर्थ स्पष्ट रूप से व्यक्त होता है।
- source_word: καταφρονήσει
  choice: तुच्छ समझेगा
  rationale: यह καταφρονέω के अवमानना या नीचा समझने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λαοῦ
  choice: जाति
  rationale: इस प्रसंग में λαός एक विशिष्ट जातीय-राष्ट्रीय समुदाय, इस्राएल, को सूचित करता है; ‘जाति’ हिन्दी में इस सामूहिक अर्थ को सहजता से व्यक्त करता है।
- source_word: γυναῖκας τοιαύτας
  choice: ऐसी स्त्रियाँ
  rationale: यूनानी अभिव्यक्ति का संक्षिप्त, सीधा और स्वाभाविक अनुवाद है।
- source_word: οὐ καλόν ἐστιν
  choice: अच्छा नहीं है
  rationale: यह नैतिक, उचिततामूलक और रणनीतिक अर्थों के बीच यूनानी की व्यापकता को बनाए रखता है, बिना किसी एक अर्थ को अनावश्यक रूप से निश्चित किए।
- source_word: ὑπολειπέσθαι
  choice: छोड़ देना
  rationale: मूल क्रिया का अर्थ किसी को शेष रहने देना है; युद्ध-संदर्भ में जीवित छोड़ने का आशय निहित है, पर मुख्य पाठ उसे स्पष्ट करके मूल की अस्पष्टता को सीमित नहीं करता।
- source_word: ἄνδρα ἕνα
  choice: एक भी पुरुष
  rationale: ἄνδρα का पुरुषवाची अर्थ और ἕνα का जोर दोनों सुरक्षित रहते हैं।
- source_word: οἱ ἀφεθέντες
  choice: जो छोड़ दिए जाएँगे
  rationale: यूनानी कृदंत का अपेक्षाकृत औपचारिक और खुला अनुवाद है; ‘जीवित’ का युद्ध-संदर्भगत आशय पादटिप्पणी में दिया गया है।
- source_word: δυνήσονται κατασοφίσασθαι
  choice: अपनी चतुराई से मात दे सकेंगे
  rationale: यह केवल धोखा देने के बजाय बुद्धि या चालाकी में प्रतिद्वंद्वी से बढ़ जाने का भाव व्यक्त करता है।
- source_word: πᾶσαν τὴν γῆν
  choice: सारी पृथ्वी
  rationale: γῆ के मूल भौगोलिक अर्थ को बनाए रखता है; ‘सारा संसार’ सम्भव अर्थ के रूप में पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: इस्राएल के लिए पुरुषवाची सामूहिक भाषा
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल यूनानी की पुरुषवाची अभिव्यक्ति को सुरक्षित रखा गया है, जबकि पादटिप्पणी उसके सामूहिक आशय को स्पष्ट करती है।
- issue: युद्ध-संदर्भ में पुरुषवाची एकवचन
  choice: एक भी पुरुष
  alternative: एक भी व्यक्ति
  rationale: यूनानी में स्पष्ट रूप से ἄνδρα है और कथन युद्ध में पुरुष बचे रहने की बात करता है; इसलिए इसे लिंग-निरपेक्ष नहीं बनाया गया।
- issue: शेष छोड़े जाने का आशय
  choice: जो छोड़ दिए जाएँगे
  alternative: जो जीवित छोड़ दिए जाएँगे
  rationale: मुख्य पाठ यूनानी की संक्षिप्त अभिव्यक्ति बनाए रखता है; सैन्य प्रसंग से सम्भावित ‘जीवित’ अर्थ पादटिप्पणी में स्पष्ट किया गया है।
