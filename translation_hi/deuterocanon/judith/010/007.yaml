    text: यूनानी में यहाँ दोहरे बल के साथ शाब्दिक अर्थ है, “वे उसकी सुंदरता पर बहुत ही अधिक चकित हुए।”
    reason: यूनानी पदबंध ἐπὶ πολὺ σφόδρα की असामान्य रूप से प्रबल तीव्रता को स्पष्ट करना।
lexical_decisions:
- source_word: ὡς δὲ εἶδον αὐτήν
  choice: पर जब उन्होंने उसे देखा
  rationale: ὡς अोरिस्ट क्रिया के साथ कालवाचक उपवाक्य आरंभ करता है; δέ यहाँ हल्का संक्रमण या विरोध दर्शाता है, जिसे ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς
  choice: उसका चेहरा बदला हुआ था
  rationale: ἠλλοιωμένον परिवर्तन या बदली हुई दशा बताता है और τὸ πρόσωπον का सीधा अर्थ ‘चेहरा’ है।
- source_word: τὴν στολὴν μεταβεβληκυῖαν
  choice: उसने अपना पहनावा भी बदल लिया था
  rationale: μεταβεβληκυῖαν स्त्रीलिंग कर्मकारक कृदंत है और αὐτήν से मेल खाता है; τὴν στολήν उसका कर्म है। इसलिए यूनानी वाक्य-विन्यास का अर्थ है कि उसने अपना पहनावा बदला था, न कि केवल यह कि पहनावा अपने-आप बदला हुआ था।
- source_word: ἐθαύμασαν
  choice: वे ... चकित हुए
  rationale: क्रिया आश्चर्य और विस्मय व्यक्त करती है; ‘चकित हुए’ आधुनिक हिन्दी में सहज और अर्थानुकूल है।
- source_word: ἐπὶ τῷ κάλλει αὐτῆς
  choice: उसकी सुंदरता पर
  rationale: κάλλος का अर्थ ‘सुंदरता’ है; आश्चर्य की क्रिया के साथ ἐπί और संप्रदान कारक का स्वाभाविक हिन्दी रूप ‘... पर’ है।
- source_word: ἐπὶ πολὺ σφόδρα
  choice: अत्यंत
  rationale: दोहरा बलवर्धन बहुत अधिक तीव्रता व्यक्त करता है; मुख्य पाठ में ‘अत्यंत’ स्वाभाविक हिन्दी रखते हुए उस बल को संक्षेप में प्रकट करता है।
