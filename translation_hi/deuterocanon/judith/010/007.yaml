  text: But when they saw her[a], and her face had been changed and her clothing altered, they marveled very greatly at her beauty,
translation:
  language: hi
  text: पर जब उन्होंने उसे देखा—उसका चेहरा बदला हुआ था और उसने अपना पहनावा भी बदल लिया था—तो वे उसकी सुंदरता पर अत्यंत चकित हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
