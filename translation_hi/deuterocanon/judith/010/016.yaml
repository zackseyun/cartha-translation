lexical_decisions:
- source_word: στῇς ἐναντίον αὐτοῦ
  choice: तुम उसके सामने खड़ी हो
  rationale: क्रिया और प्रसंग में संबोधित व्यक्ति स्त्री है; यह पदबंध शासक के सम्मुख उपस्थित होने का स्वाभाविक हिन्दी रूप है।
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: अपने मन में मत डरना
  rationale: हृदय के भीतरी भय का अर्थ आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνάγγειλον
  choice: उसे बता देना
  rationale: मूल क्रिया का अर्थ सूचना देना या निवेदन करना है; यहाँ प्रत्यक्ष बातचीत के संदर्भ में यह सहज और पर्याप्त स्पष्ट है।
- source_word: κατὰ τὰ ῥήματά σου
  choice: जैसा तुमने कहा है, वैसा ही
  rationale: शाब्दिक 'तुम्हारे वचनों के अनुसार' की संभावित असहजता से बचते हुए उसके पहले से बताए कथन के अनुरूप बोलने का भाव बनाए रखता है।
- source_word: εὖ σε ποιήσει
  choice: वह तुम्हारे साथ अच्छा व्यवहार करेगा
  rationale: यूनानी मुहावरे का अर्थ लाभकारी या अनुकूल व्यवहार करना है; यह हिन्दी में स्वाभाविक समतुल्य है।
