translation:
  language: hi
  text: पर यदि तुम उसके सामने खड़ी हो, तो अपने मन में मत डरना; बल्कि जैसा तुम कहो, वैसा ही उसे बता देना, और वह तुम्हारे साथ अच्छा व्यवहार करेगा।
