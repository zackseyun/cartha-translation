  text: And it happened, when she stopped crying out to the God of Israel and finished all these words,
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह इस्राएल के परमेश्वर को पुकारना बंद कर चुकी थी और ये सारी बातें कह चुकी थी,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: जब
  rationale: यह यूनानी कथात्मक संक्रमण-सूत्र है। हिंदी में अगले वाक्य से जुड़ने वाले इस आश्रित उपवाक्य में अलग से ‘और ऐसा हुआ’ कहना बोझिल होता; ‘जब’ उसी कथात्मक गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς
  choice: जब
  rationale: यहाँ ὡς मुख्य क्रिया की कालगत परिस्थिति प्रस्तुत करता है; ‘जब’ आधुनिक हिंदी में स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: ἐπαύσατο βοῶσα
  choice: पुकारना बंद कर चुकी
  rationale: मध्यवाची क्रिया और वर्तमान कृदंत मिलकर प्रार्थना में ऊँचे या व्याकुल स्वर से पुकारने की क्रिया का रुकना बताते हैं। ‘पुकारना’ तीव्र विनती को व्यक्त करता है और ‘बंद कर चुकी’ पूर्वकालिक पूर्णता को स्पष्ट करता है।
- source_word: πρὸς τὸν θεὸν Ἰσραήλ
  choice: इस्राएल के परमेश्वर को
  rationale: यह मूल उपाधि और उसकी वाचागत प्रतिध्वनि को सुरक्षित रखता है; ‘को पुकारना’ हिंदी में स्वाभाविक कारक-रचना है।
- source_word: συνετέλεσεν
  choice: कह चुकी
  rationale: शाब्दिक अर्थ ‘पूरा किया’ है, पर λόγοι के साथ प्रसंगतः उसका बोलना समाप्त करना अभिप्रेत है। ‘ये सारी बातें कह चुकी’ आधुनिक हिंदी में स्वाभाविक ढंग से वही पूर्णता व्यक्त करता है।
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ये सारी बातें
  rationale: ῥήματα का शाब्दिक ‘वचन’ यहाँ हिंदी में अस्वाभाविक और अनावश्यक रूप से धार्मिक अर्थ वाला हो सकता है। ‘बातें’ पूर्ववर्ती प्रार्थना में कही गई समस्त बातों को स्पष्टतः संदर्भित करता है।
theological_decisions:
- issue: θεὸν Ἰσραήλ की उपाधि
  choice: इस्राएल के परमेश्वर
  alternative: इस्राएल का परमेश्वर
  rationale: ‘इस्राएल के परमेश्वर’ विभक्ति-युक्त वाक्य में स्वाभाविक है और यूनानी की वाचागत उपाधि तथा उसके संबंधगत भार को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। पद मूल यूनानी की तरह अगले वाक्य पर निर्भर कालगत उपवाक्य है, इसलिए अंत में अल्पविराम रखा गया है।
