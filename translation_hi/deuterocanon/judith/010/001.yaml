  terminology: ‘इस्राएल के परमेश्वर’ appropriately renders τὸν θεὸν Ἰσραήλ. ‘पुकारना’ adequately conveys the urgent prayer implied by βοῶσα, and ‘ये सारी बातें कह चुकी थी’ naturally renders the completion of ‘all these words.’
