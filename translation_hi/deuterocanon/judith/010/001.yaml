  rationale: The revision restores the omitted narrative formula Καὶ ἐγένετο as ‘और ऐसा हुआ कि’. It retains the source’s temporal, incomplete sentence structure, including the final comma, because the clause is designed to lead into the following wording. Past-perfect ‘कर चुकी थी’ gives natural Hindi expression to the prior completed actions in this narrative setting.
