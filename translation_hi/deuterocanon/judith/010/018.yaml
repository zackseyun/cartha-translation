  text: And there was a rush in the camp[a], for her arrival was reported through the tents; and they came and gathered around her as she stood outside the tent of Holofernes, until they announced her to him.
translation:
  language: hi
  text: तब छावनी में लोगों की भीड़ उमड़ पड़ी, क्योंकि उसके आने की खबर तंबुओं में पुकारकर फैलाई गई थी। वे आए और होलोफेरनेस के तंबू के बाहर खड़ी उसके चारों ओर जमा रहे, जब तक कि उन्होंने होलोफेरनेस को उसके बारे में सूचना नहीं दी।
  philosophy: optimal-equivalence
