- source_word: διεβοήθη
  choice: पुकार-पुकारकर फैला दी गई थी
  rationale: निष्क्रिय क्रिया में ऊँची आवाज़ से बात को व्यापक रूप से फैलाए जाने का भाव है।
- source_word: τὰ σκηνώματα
  choice: तंबुओं में
  rationale: यह छावनी के तंबू-निवासों का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἡ παρουσία αὐτῆς
  choice: उसके आने की खबर
  rationale: παρουσία मूलतः उसकी उपस्थिति भी हो सकता है, पर इस प्रसंग में उसके वहाँ आ पहुँचने की घटना की घोषणा प्रमुख है।
- source_word: ἐκύκλουν αὐτήν
  choice: उसके चारों ओर इकट्ठे हो गए
  rationale: यह चारों ओर घिरकर जमा होने की स्थानिक छवि को बनाए रखता है, बिना शत्रुतापूर्ण घेरे का अर्थ थोपे।
- source_word: ὡς ἱστήκει
  choice: वह ... खड़ी रही
  rationale: यह उस समय उसकी स्थिर अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔξω τῆς σκηνῆς Ὀλοφέρνου
  choice: होलोफेरनेस के तंबू के बाहर
  rationale: स्थान-सूचक यूनानी वाक्यांश का सीधा अनुवाद।
- source_word: προσήγγειλαν αὐτῷ περὶ αὐτῆς
  choice: उन्होंने उसके विषय में उसे सूचना न दे दी
  rationale: इसका अर्थ है कि उन्होंने होलोफेरनेस को उस स्त्री के वहाँ होने के विषय में खबर दी; हिन्दी में दोनों सर्वनामों का संदर्भ प्रसंग से स्पष्ट है।
