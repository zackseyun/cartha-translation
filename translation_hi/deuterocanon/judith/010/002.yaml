  yaml_path: translation/deuterocanon/judith/010/002.yaml
  text: And she rose from her prostration and called her maid Abra[a], and went down into the house in which she stayed during the days of her Sabbaths and during her festivals[b],
translation:
  language: hi
  text: तब वह अपनी दण्डवत् मुद्रा से उठी[a], उसने अपनी सेविका अब्रा को बुलाया और नीचे उतरकर उस घर में गई जहाँ वह सब्त के दिनों और अपने पर्वों के समय रहा करती थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने गिरने से।” यूनानी शब्द का अर्थ “गिरना” भी हो सकता है, पर यहाँ संभवतः प्रार्थना या शोक में भूमि पर दण्डवत् पड़ी यहूदीत की मुद्रा अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “सब्तों के दिनों” जैसा बहुवचन है। यह किसी एक सब्त के बजाय बार-बार किए जाने वाले सब्त-पालन को दर्शा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστη
  choice: उठी
  rationale: यहाँ क्रिया प्रार्थना में भूमि पर पड़ी हुई मुद्रा से उठने की क्रिया बताती है; ‘उठी’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀπὸ τῆς πτώσεως
  choice: अपनी दण्डवत् मुद्रा से
  rationale: πτῶσις का शाब्दिक अर्थ ‘गिरना’ हो सकता है, पर संदर्भ प्रार्थना में भूमि पर झुकने या पड़ने का है। ‘दण्डवत् मुद्रा’ भक्तिपूर्ण शारीरिक अवस्था को व्यक्त करती है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: क्रिया साधारणतः किसी को बुलाने को बताती है; ‘बुलवाया’ या ‘तलब किया’ यूनानी से अधिक औपचारिक या प्रबल होता।
- source_word: τὴν Ἄβραν αὐτῆς
  choice: अपनी सेविका अब्रा को
  rationale: Ἄβρα को व्यक्तिवाचक नाम मानते हुए ‘अब्रा’ रखा गया है। मूल पद में भूमिका-संज्ञा स्पष्ट नहीं है, पर संदर्भ में वह उसकी परिचारिका है; हिन्दी में संबंध स्पष्ट करने के लिए ‘सेविका’ स्वाभाविक है।
- source_word: κατέβη
  choice: नीचे गई
  rationale: καταβαίνω की दिशात्मकता को सीधे सुरक्षित रखता है और आधुनिक हिन्दी में सहज है।
- source_word: εἰς τὸν οἶκον
  choice: उस घर में
  rationale: εἰς भीतर की ओर गति दर्शाता है, इसलिए ‘घर में’ केवल ‘घर तक’ की अपेक्षा अधिक सटीक है।
- source_word: ἐν ᾧ διέτριβεν
  choice: जहाँ वह ... रहा करती थी
  rationale: अपूर्णकालीन διέτριβεν समय बिताने या ठहरने की अभ्यस्त क्रिया दर्शाता है; ‘रहा करती थी’ उसके नियमित ठहराव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ταῖς ἡμέραις τῶν σαββάτων
  choice: अपने सब्त के दिनों ... के समय
  rationale: बहुवचन σαββάτων और नियमित पालन दोनों को ‘सब्त के दिनों’ से सुरक्षित रखा गया है। αὐτῆς का संबंध संयुक्त वाक्यांश में उसके पर्वों से प्रत्यक्ष है और प्रसंगतः इन दिनों को भी उसके पालन के दिनों के रूप में समझा जाता है।
- source_word: ἐν ταῖς ἑορταῖς αὐτῆς
  choice: अपने पर्वों के समय
  rationale: ἑορταί धार्मिक पंचांग के उत्सवों को सूचित करता है; ‘पर्व’ आधुनिक धार्मिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: ἀπὸ τῆς πτώσεως में यहूदीत की शारीरिक और भक्तिपूर्ण मुद्रा
  choice: अपनी दण्डवत् मुद्रा से
  alternative: अपने गिरने से
  rationale: निकटवर्ती प्रसंग प्रार्थना और शोक का है, इसलिए भूमि पर दण्डवत् होने की मुद्रा अधिक संभावित है। फिर भी πτῶσις के सामान्य अर्थ ‘गिरना’ को पादटिप्पणी में रखा गया है ताकि मूल की शब्दार्थगत व्यापकता समाप्त न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘दण्डवत् मुद्रा’ devotional posture को स्पष्ट करता है, ‘नीचे गई’ स्थानगत गति सुरक्षित रखता है, और ‘सब्त के दिनों’ से मूल का बहुवचन बना रहता है।
