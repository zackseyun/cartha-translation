  yaml_path: translation/deuterocanon/judith/010/008.yaml
  text: And they said to her, “May the God of our fathers grant you favor, and bring your undertakings to completion for the boasting of the sons of Israel and the exaltation of Jerusalem.” And she bowed down to God.
translation:
  language: hi
  text: और उन्होंने उससे कहा, “हमारे पूर्वजों का परमेश्वर तुझे अनुग्रह दे[a] और तेरे प्रयत्नों[b] को इस्राएल के पुत्रों के गर्व का विषय और यरूशलेम की प्रतिष्ठा करने के लिए पूरा करे।” और उसने परमेश्वर को दण्डवत् किया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुझे अनुग्रह में दे”; अर्थात तुझे अनुग्रह, अनुकूल स्वीकृति, या सफलता प्रदान करे।
    reason: lexical_alternative
  - marker: b
    text: या “तेरी योजनाओं,” “तेरे कार्यों,” अथवा “तेरे उपक्रमों।” यूनानी शब्द किसी व्यक्ति के कामों, प्रयत्नों, या कार्य-योजना को व्यापक रूप से सूचित कर सकता है।
    reason: lexical_alternative
  - marker: d
    text: या “उसने परमेश्वर को प्रणाम किया,” “परमेश्वर के सामने झुक गई,” अथवा “परमेश्वर की आराधना की।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη ... εἰς χάριν
  choice: तुझे कृपापात्र बनाए
  rationale: यह यूनानी मुहावरे के शाब्दिक रूप, ‘कृपा में दे,’ को स्वाभाविक हिन्दी में व्यक्त करता है और अनुकूल स्वीकृति, सहायता या सफलता की गुंजाइश बनाए रखता है।
- source_word: τελειῶσαι
  choice: पूरा करे
  rationale: यह कामों को उनके अपेक्षित सफल परिणाम तक पहुँचाने का भाव संक्षेप और सहज रूप में देता है।
- source_word: τὰ ἐπιτηδεύματά σου
  choice: तेरे हाथ में लिए कामों
  rationale: यह योजनाओं, प्रयत्नों और किए जाने वाले कार्यों—इन सभी संभावित अर्थों को समेटने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: εἰς καύχημα
  choice: गौरव का कारण
  rationale: καύχημα किसी ऐसी बात को सूचित करता है जिस पर गर्व या उल्लास किया जा सके। ‘गौरव का कारण’ हिन्दी में सकारात्मक सार्वजनिक सम्मान का भाव देता है और ‘डींग’ जैसी नकारात्मक छाया से बचता है।
- source_word: υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यह स्रोत के औपचारिक वंश-संबंधी पदबंध को बनाए रखता है; यहाँ यह सामूहिक रूप से इस्राएल के लोगों को सूचित करता है।
- source_word: ὕψωμα
  choice: उत्कर्ष
  rationale: यह ऊँचा किए जाने, प्रतिष्ठा बढ़ने और सम्मानित होने की रूपकात्मक शक्ति को बनाए रखता है।
- source_word: προσεκύνησεν
  choice: दण्डवत किया
  rationale: यह श्रद्धापूर्वक झुकने या भूमि तक झुकने की देहगत क्रिया को व्यक्त करता है, बिना उसे केवल अमूर्त ‘आराधना’ में बदलने के।
theological_decisions:
- issue: आशीर्वचन में कृपा का आशय
  choice: तुझे कृपापात्र बनाए
  alternative: तुझ पर कृपा करे / तुझे अनुकूल स्वीकृति दे
  rationale: स्रोत यह स्पष्ट नहीं करता कि कृपा केवल परमेश्वर की प्रत्यक्ष कृपा है या मिशन में मिलने वाली अनुकूल स्वीकृति भी। चुना हुआ पाठ इस अर्थ-व्याप्ति को खुला रखता है।
- issue: καύχημα का सम्मान-संबंधी अर्थ
  choice: इस्राएल के पुत्रों के गौरव का कारण
  alternative: इस्राएल के पुत्रों के गर्व अथवा जयोल्लास का कारण
  rationale: आशीर्वचन के संदर्भ में ‘गौरव’ स्वाभाविक है, जबकि पादटिप्पणी मूल शब्द के गर्व या उल्लास के आधार वाले अधिक शाब्दिक भाव को सुरक्षित रखती है।
- issue: προσκυνέω में क्रिया और आराधना का संबंध
  choice: परमेश्वर के सामने दण्डवत किया
  alternative: परमेश्वर की आराधना की / परमेश्वर के सामने झुक गई
  rationale: यह अनुवाद श्रद्धा की शारीरिक क्रिया को सामने रखता है और पाठक पर ‘आराधना’ का अधिक अमूर्त अर्थ थोपता नहीं, यद्यपि संदर्भ में वह भाव निहित हो सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। संबोधन में एकवचन ‘तू/तेरे’ का रूप प्राचीन आशीर्वचन की निकटता और स्रोत के एकवचन को व्यक्त करता है; मुख्य वाक्य में अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘कृपापात्र,’ ‘गौरव,’ ‘उत्कर्ष’ और ‘दण्डवत’ जैसे परिचित धार्मिक-साहित्यिक शब्द रखे गए हैं।
