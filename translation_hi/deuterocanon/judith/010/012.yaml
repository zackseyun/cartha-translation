  yaml_path: translation/deuterocanon/judith/010/012.yaml
  text: And they seized her and asked her[a], “Who are you, and where are you coming from, and where are you going?” And she said, “I am a daughter of the Hebrews, and I am fleeing from before them[c][b], because they are about to be given over to you for consumption.”
translation:
  language: hi
  text: और उन्होंने उसे पकड़ लिया और उससे पूछा, “तुम किन लोगों की हो?[a] कहाँ से आ रही हो, और कहाँ जा रही हो?” उसने कहा, “मैं इब्रानियों की बेटी हूँ,[b] और उनके पास से भाग रही हूँ, क्योंकि वे तुम्हें भक्षण के लिए[c] सौंपे जाने वाले हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “तुम किनकी हो?” प्रश्न जातीय या राजनीतिक सम्बद्धता के विषय में हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, “मैं एक इब्रानी स्त्री हूँ।” यूनानी में शब्दशः “मैं इब्रानियों की बेटी हूँ” है।
    reason: lexical_alternative
  - marker: c
    text: या, “खा डाले जाने के लिए” अथवा “आहार बनने के लिए।” यूनानी अभिव्यक्ति में निगल लिए जाने की तीखी छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  choice: पकड़ लिया
  rationale: यहाँ क्रिया का अर्थ सैनिकों द्वारा यहूदीत को शारीरिक रूप से धर लेना है। ‘पकड़ लिया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग की आकस्मिकता बनाए रखता है।
- source_word: Τίνων εἶ
  choice: तुम किन लोगों में से हो?
  rationale: यूनानी का शब्दशः अर्थ ‘तुम किनकी हो?’ है, पर प्रश्न सम्भवतः जातीय या राजनीतिक सम्बद्धता पूछता है। मुख्य पाठ में आशय को स्वाभाविक हिन्दी में रखा गया है और शब्दशः सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: πόθεν ἔρχῃ
  choice: कहाँ से आ रही हो
  rationale: यह πόθεν की दिशासूचकता तथा चल रही यात्रा के प्रसंग को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ποῦ πορεύῃ
  choice: कहाँ जा रही हो
  rationale: यह πορεύομαι के जाने या यात्रा करने के सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Θυγάτηρ εἰμὶ τῶν Ἑβραίων
  choice: मैं इब्रानियों की बेटी हूँ
  rationale: ‘बेटी’ को बनाए रखने से यूनानी में उपस्थित पारिवारिक-जातीय मुहावरा सुरक्षित रहता है; इसे केवल ‘इब्रानी स्त्री’ बनाकर सपाट नहीं किया गया।
- source_word: ἀποδιδράσκω
  choice: भाग रही हूँ
  rationale: क्रिया भाग निकलने या बचकर भागने को दर्शाती है। वर्तमानकालीन ‘भाग रही हूँ’ यहूदीत के तत्काल कथन के अनुकूल है।
- source_word: ἀπὸ προσώπου αὐτῶν
  choice: उनके सामने से
  rationale: यह ‘उनके मुख/उपस्थिति के सामने से’ वाले स्रोत-मुहावरे को केवल ‘उनसे’ कहने की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: μέλλουσιν δόσθαι
  choice: सौंपे जाने वाले हैं
  rationale: यह μέλλω के निकट भविष्य और δόσθαι के कर्मवाच्य—दोनों को बनाए रखता है।
- source_word: εἰς κατάβρωμα
  choice: भक्षण के लिए
  rationale: κατάβρωμα खा डाले जाने या निगल लिए जाने की तीखी छवि रखता है। ‘भक्षण के लिए’ उस छवि को संक्षिप्त, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: यहूदीत की जातीय आत्म-पहचान
  choice: मैं इब्रानियों की बेटी हूँ
  alternative: मैं एक इब्रानी स्त्री हूँ
  rationale: यूनानी में θυγάτηρ (‘बेटी’) के साथ जनसमूह का सम्बन्धकारक रूप है। ‘बेटी’ रखने से लिंग और पारिवारिक-जातीय बिंब दोनों सुरक्षित रहते हैं।
- issue: इब्रानियों के आसन्न सौंपे जाने का कर्मवाच्य
  choice: वे भक्षण के लिए तुम्हारे हाथ सौंपे जाने वाले हैं
  alternative: तुम शीघ्र ही उन्हें खा डालोगे
  rationale: स्रोत यह नहीं बताता कि सौंपने वाला कौन है और कर्मवाच्य में तनाव बनाए रखता है; इसलिए कर्ता जोड़कर अर्थ को धर्मवैचारिक रूप से निर्धारित नहीं किया गया।
