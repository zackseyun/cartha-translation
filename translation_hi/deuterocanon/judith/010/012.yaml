  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और कथात्मक। ‘इब्रानियों की बेटी’, ‘उनके सामने से’ और ‘भक्षण के लिए’ जैसे अपेक्षाकृत औपचारिक पद स्रोत की विशिष्ट छवियों को बनाए रखने के लिए रखे गए हैं; कठिन या वैकल्पिक अर्थ पादटिप्पणियों में स्पष्ट किए गए हैं।
