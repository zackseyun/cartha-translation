base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/009.yaml
  text: And she said to them[a], “Order the gate of the city to be opened for me, and I will go out for the fulfillment of the words that you spoke with me.” So they instructed the young men to open it for her, just as she had said.
translation:
  language: hi
  text: उसने उनसे कहा, “आदेश दीजिए कि मेरे लिए नगर का फाटक खोल दिया जाए। तब मैं बाहर जाकर उन बातों को पूरा करूँगी जिनके बारे में आपने मुझसे बात की थी।” तब उन्होंने युवकों को उसके लिए फाटक खोलने का निर्देश दिया, जैसा उन्होंने कहा था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “जैसा उन्होंने कहा था” है। “उन्होंने” किसकी ओर संकेत करता है, यह पूरी तरह स्पष्ट नहीं है; यह उससे हुई बातचीत या यहूदित के अभी-अभी किए अनुरोध के अनुसार कार्य करने की ओर संकेत कर सकता है।
    reason: मूल यूनानी में अंतिम वाक्यांश का संदर्भ अस्पष्ट है; मुख्य पाठ सक्रिय बहुवचन को बनाए रखता है।
lexical_decisions:
- source_word: Ἐπιτάξατε
  choice: आदेश दीजिए
  rationale: बहुवचन आज्ञार्थक क्रिया का अधिकारपूर्ण भाव बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀνοῖξαί μοι τὴν πύλην τῆς πόλεως
  choice: कि मेरे लिए नगर का फाटक खोल दिया जाए
  rationale: आदेश के बाद आए अनन्तरूप को स्वाभाविक हिन्दी कर्मवाच्य उपवाक्य में व्यक्त करता है और ‘मेरे लिए’ का हितार्थक भाव सुरक्षित रखता है।
- source_word: ἐξελεύσομαι
  choice: मैं बाहर जाकर
  rationale: नगर से बाहर निकलने की गति को सहज हिन्दी में व्यक्त करता है; आगे का प्रयोजन उसी वाक्य से जोड़ा गया है।
- source_word: εἰς τελείωσιν τῶν λόγων
  choice: उन बातों को पूरा करूँगी
  rationale: τελείωσις के पूर्ण करने के भाव और λόγοι के प्रसंगानुसार ‘कही/चर्चित बातें या मामले’ के अर्थ को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: ὧν ἐλαλήσατε μετʼ ἐμοῦ
  choice: जिनके बारे में आपने मुझसे बात की थी
  rationale: μετʼ ἐμοῦ में निहित परस्पर बातचीत के भाव को एकतरफा ‘मुझसे कहा’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: συνέταξαν
  choice: निर्देश दिया
  rationale: अधीनस्थ जवानों को कार्य सौंपने का भाव देता है और पहले प्रयुक्त ‘आदेश’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: τοῖς νεανίσκοις
  choice: जवानों
  rationale: νεανίσκοι का सीधा और वर्तमान हिन्दी में सुबोध अर्थ है; पाठ में उनकी विशिष्ट भूमिका को अनुमान से नहीं जोड़ा गया।
- source_word: ἀνοῖξαι αὐτῇ
  choice: उसके लिए फाटक खोलने
  rationale: स्त्रीलिंग दत्तिव αὐτῇ का हितार्थक भाव रखता है और हिन्दी में स्पष्टता के लिए पहले उल्लिखित फाटक को दोहराता है।
- source_word: καθὼς ἐλάλησαν
  choice: जैसा कहा गया था
  rationale: यूनानी में क्रिया बहुवचन है, पर कथात्मक संदर्भ का संकेत पूरी तरह स्पष्ट नहीं है। हिन्दी का निर्वैयक्तिक रूप संभावित संदर्भों को समय से पहले निश्चित किए बिना वाक्य को स्वाभाविक रखता है।
