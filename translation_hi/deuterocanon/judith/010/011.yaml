  text: And they were going straight through the courtyard[a], and an Assyrian advance guard met her.
translation:
  language: hi
  text: और वे घाटी में सीधे आगे बढ़ रही थीं; तभी अश्शूरियों का एक अग्रिम सुरक्षा-दल उससे[a] मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “उससे” स्त्रीलिंग एकवचन है, जबकि इससे पहले “वे…बढ़ रही थीं” बहुवचन है। यहाँ कथा का ध्यान विशेष रूप से यहूदीत पर केंद्रित हो जाता है।
    reason: व्याकरणिक संख्या और कथा-केंद्र के इस परिवर्तन को स्पष्ट करना।
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: आगे बढ़ रही थीं
  rationale: अपूर्ण भूतकाल का रूप जारी गति को व्यक्त करता है; स्त्रीलिंग बहुवचन से यहूदीत और उसके साथ की दासी दोनों का संकेत बना रहता है।
- source_word: ἐν τῷ αὐλῶνι
  choice: घाटी में
  rationale: αὐλών भू-दृश्य के संदर्भ में घाटी, दर्रा या सँकरा निम्न मार्ग दर्शाता है। नगर से बाहर निकलने और अश्शूरी चौकी से भेंट होने के प्रसंग में ‘घाटी’ उपयुक्त है; इसे ‘आँगन’ कहना समान मूल वाले αὐλή से अर्थ मिलाने का जोखिम रखता है।
- source_word: εἰς εὐθεῖαν
  choice: सीधे
  rationale: यह क्रियाविशेषणीय पद बिना मुड़े सीधे दिशा में चलने का भाव देता है। ‘सीधे आगे बढ़ रही थीं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: συνήντησεν
  choice: मिला
  rationale: सυναντάω का सामान्य अर्थ मिलना या सामना होना है। यहाँ तटस्थ ‘मिला’ यूनानी पाठ से अधिक बलपूर्वक रोकने या पकड़ने का भाव नहीं जोड़ता।
- source_word: αὐτῇ
  choice: उससे
  rationale: यूनानी सर्वनाम स्त्रीलिंग एकवचन है। पहले बहुवचन कर्ता होने पर भी यहाँ कथा का ध्यान विशेष रूप से यहूदीत पर आ जाता है।
- source_word: προφυλακὴ
  choice: अग्रिम पहरेदार-दल
  rationale: προφυλακή मुख्य सेना से आगे तैनात सुरक्षा-दल या अग्रिम पहरे को दर्शा सकता है। ‘अग्रिम पहरेदार-दल’ व्यक्तियों के समूह को स्पष्ट करता है, जो उससे मिलता है।
- source_word: τῶν Ἀσσυρίων
  choice: अश्शूरियों का
  rationale: सम्बन्धकारक पद बताता है कि अग्रिम दल अश्शूरियों का था; यह हिन्दी में स्वाभाविक सम्बन्ध-वाचक रचना है।
