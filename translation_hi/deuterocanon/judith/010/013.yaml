base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/013.yaml
  text: And I am coming into the presence of Holofernes[a], the commander-in-chief of your forces, to announce words of truth, and I will show before him the way by which he will go and gain mastery over all the hill country, and not one flesh of his men, nor a breath of life, will be lacking.
translation:
  language: hi
  text: और मैं तुम्हारी सेनाओं के प्रधान सेनापति होलोफेरनेस की उपस्थिति में आ रही हूँ, ताकि सत्य की बातें सुनाऊँ। मैं उसके सामने वह मार्ग दिखाऊँगी जिस पर चलकर वह समूचे पहाड़ी प्रदेश पर अधिकार कर लेगा; और उसके आदमियों में से किसी एक की भी देह[a] या जीवन की साँस की कमी नहीं होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “एक मांस” है। यह असामान्य देहात्मक मुहावरा किसी भी सैनिक की देह या प्राण के अभाव न होने का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ ἔρχομαι
  choice: और मैं ... आ रही हूँ
  rationale: वर्तमान काल और वक्ता की तत्काल गति को स्वाभाविक हिन्दी में रखा गया है; वक्ता यहूदीत होने के कारण स्त्रीलिंग आवश्यक है।
- source_word: εἰς τὸ πρόσωπον Ὀλοφέρνου
  choice: होलोफेरनेस की उपस्थिति में
  rationale: यूनानी मुख-संबंधी मुहावरे का आशय किसी के सम्मुख या उसकी उपस्थिति में पहुँचना है।
- source_word: ἀρχιστρατήγου δυνάμεως ὑμῶν
  choice: तुम्हारी सेनाओं के प्रधान सेनापति
  rationale: ἀρχιστράτηγος सर्वोच्च सैन्य अधिकारी को और δύναμις यहाँ सैन्य बलों को सूचित करता है।
- source_word: τοῦ ἀναγγεῖλαι ῥήματα ἀληθείας
  choice: ताकि सत्य की बातें सुनाऊँ
  rationale: उद्देश्यवाचक infinitive स्पष्ट रखा गया है और ῥήματα ἀληθείας की गंभीर अभिव्यक्ति को सहज हिन्दी में सुरक्षित किया गया है।
- source_word: δείξω πρὸ προσώπου αὐτοῦ ὁδὸν
  choice: मैं उसके सामने वह मार्ग दिखाऊँगी
  rationale: मार्ग दिखाने का ठोस चित्र और πρὸ προσώπου का ‘उसके सामने’ भाव दोनों बनाए रखे गए हैं।
- source_word: καθʼ ἣν πορεύσεται
  choice: जिस पर चलकर वह
  rationale: सम्बन्धवाचक वाक्यांश मार्ग और आगे होने वाली सैन्य सफलता के बीच साधनात्मक संबंध व्यक्त करता है।
- source_word: κυριεύσει πάσης τῆς ὀρινῆς
  choice: समूचे पहाड़ी प्रदेश पर अधिकार कर लेगा
  rationale: κυριεύω का यहाँ सैन्य नियंत्रण प्राप्त करना और ὀρινή का पहाड़ी भूभाग अभिप्रेत है।
- source_word: οὐ διαφωνήσει
  choice: कम होगी
  rationale: इस प्रसंग में क्रिया का भाव असहमत होने के बजाय संख्या में किसी के अनुपस्थित या घट जाने का है; हिन्दी में ‘कम होगी’ उस असामान्य देह-साँस वाले मुहावरे से मेल खाता है।
- source_word: σὰρξ μία οὐδὲ πνεῦμα ζωῆς
  choice: न एक भी देह, न जीवन की एक साँस
  rationale: यूनानी की सजीव शारीरिक अभिव्यक्ति को व्याख्यात्मक रूप से ‘एक भी आदमी नहीं मरेगा’ कहकर समतल नहीं किया गया; σάρξ के लिए ‘देह’ आधुनिक हिन्दी में शाब्दिक और गरिमापूर्ण है।
theological_decisions:
- issue: गैर-पौलुसी, शाब्दिक सैन्य प्रसंग में σάρξ का अनुवाद
  choice: देह
  alternative: शरीर; आदमी; मांस
  rationale: यहाँ σάρξ पापी स्वभाव जैसी धर्मवैज्ञानिक धारणा नहीं, बल्कि सैनिकों के सजीव शरीर को सूचित करता है। ‘देह’ शारीरिक अर्थ और यूनानी की तीव्रता बनाए रखता है, जबकि ‘आदमी’ मुहावरे की छवि मिटा देता।
- issue: अंतिम वाक्यांश में जीवन-हानि की प्रतिज्ञा
  choice: न एक भी देह कम होगी, न जीवन की एक साँस
  alternative: उसका एक भी आदमी नहीं मरेगा
  rationale: स्रोत का वाक्य जान-बूझकर देह और जीवन की साँस को साथ रखता है। अधिक स्पष्ट विकल्प अर्थ बताता है, पर स्रोत की असामान्य और संभवतः अलंकारिक बनावट को समाप्त कर देता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सैन्य पद के लिए ‘प्रधान सेनापति’ और भूभाग के लिए ‘पहाड़ी प्रदेश’ सामान्य पाठकों के लिए सहज हैं। अंतिम यूनानी मुहावरे की असामान्यता जान-बूझकर कुछ हद तक सुरक्षित रखी गई है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
