  text: And Holofernes was reclining on his bed under the canopy[a], which was woven with purple, gold, emeralds, and costly stones.
translation:
  language: hi
  text: और होलोफेरनेस अपने पलंग पर उस शय्या-आवरण[a] के भीतर विश्राम कर रहा था, जो बैंगनी कपड़े, सोने, पन्नों और बहुमूल्य पत्थरों से बुना हुआ था।
  philosophy: optimal-equivalence
  footnotes:
