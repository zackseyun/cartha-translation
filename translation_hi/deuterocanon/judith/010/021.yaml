    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπαυόμενος
  choice: लेटा हुआ था
  rationale: यह कृदन्त पलंग पर विश्राम की अवस्था बताता है। आधुनिक हिन्दी में ‘लेटा हुआ था’ स्वाभाविक है और अनिश्चित रूप से भोज की मुद्रा का संकेत देने वाले ‘टेक लगाए’ से अधिक उपयुक्त है।
- source_word: κλίνης
  choice: पलंग
  rationale: κλίνη का अर्थ पलंग या दीवान हो सकता है; निजी कक्ष और उसके ऊपर के आवरण के संदर्भ में ‘पलंग’ सबसे सीधा अर्थ है।
- source_word: κωνωπίῳ
  choice: छत्र
  rationale: यह शब्द पलंग के ऊपर लगे जालीदार या परदेदार आवरण को दर्शा सकता है। विलासपूर्ण सामग्री के उल्लेख के कारण मुख्य पाठ में ‘छत्र’ सहज है; अधिक विशिष्ट विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: πορφύρας
  choice: बैंगनी कपड़े
  rationale: πορφύρα बैंगनी रंग की बहुमूल्य सामग्री या वस्त्र को सूचित करता है। बुनाई के संदर्भ में ‘बैंगनी कपड़े’ स्पष्ट और स्वाभाविक है।
- source_word: χρυσίου
  choice: सोने
  rationale: मूल पाठ सीधे सोने का उल्लेख करता है। ‘सोने के तार’ बुनाई से संभव संकेत है, पर वह मूल से अधिक विशिष्ट होगा।
- source_word: σμαράγδου
  choice: पन्नों
  rationale: σμαράγδος का प्रचलित हिन्दी समतुल्य ‘पन्ना’ है; यहाँ सामग्री की सूची में बहुवचन स्वाभाविक है।
- source_word: λίθων πολυτελῶν
  choice: बहुमूल्य पत्थरों
  rationale: πολυτελής उच्च मूल्य और विलासिता पर बल देता है; ‘बहुमूल्य पत्थर’ निकट और सहज अनुवाद है।
- source_word: καθυφασμένων
  choice: से बुना हुआ
  rationale: यह वस्त्र-कारीगरी में उल्लिखित सामग्रियों के समावेश को बताता है। ‘से बुना हुआ’ ‘कढ़ा हुआ’ की अपेक्षा कम व्याख्यात्मक है।
