base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/015.yaml
  text: And they said to her[a], “You have saved your life by hurrying down into the presence of our lord. And now come to his tent[b], and some from among us will escort you until they hand you over into his hands.”
translation:
  language: hi
  text: और उन्होंने उससे कहा, “तुमने हमारे स्वामी के सामने पहुँचने के लिए जल्दी से नीचे उतरकर अपना जीवन बचा लिया है। अब उसके तंबू के पास आओ; हममें से कुछ लोग तुम्हें साथ ले जाएँगे, जब तक कि तुम्हें उसके हाथों में[a] न सौंप दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके हाथों में सौंप दें” का अर्थ है उसके अधिकार या अभिरक्षा में सौंप देना।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σέσωκας τὴν ψυχήν σου
  choice: अपना जीवन बचा लिया है
  rationale: σῴζω के पूर्णकाल और ψυχή के इस प्रसंगगत अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है; यहाँ ψυχή व्यक्ति के जीवन को सूचित करता है।
- source_word: σπεύσασα καταβῆναι
  choice: शीघ्रता से नीचे उतरकर
  rationale: स्त्रीलिंग कृदन्त द्वारा बताए गए साधन अथवा परिस्थिति और καταβαίνω की नीचे की दिशा—दोनों को बनाए रखता है।
- source_word: εἰς πρόσωπον τοῦ κυρίου ἡμῶν
  choice: हमारे स्वामी के सामने आने के लिए
  rationale: εἰς πρόσωπον को उसके मुहावरेदार अर्थ ‘किसी के सम्मुख/उपस्थित होना’ में रखा गया है। κύριος यहाँ मानवीय सेनानायक के लिए है, इसलिए ‘स्वामी’ उपयुक्त है।
- source_word: πρόσελθε ἐπὶ τὴν σκηνὴν αὐτοῦ
  choice: उसके तंबू के पास आओ
  rationale: सैनिक परिवेश में σκηνή का अर्थ ‘तंबू’ है; πρόσελθε ἐπί को स्वाभाविक हिन्दी में समीप आने के आदेश के रूप में व्यक्त किया गया है।
- source_word: ἀφʼ ἡμῶν προπέμψουσίν σε
  choice: हममें से कुछ लोग तुम्हें ... साथ ले जाएँगे
  rationale: ἀφ’ ἡμῶν और बहुवचन क्रिया के आशय को स्पष्ट करता है कि उनके दल के सदस्य उसे आगे तक पहुँचाएँगे; ‘साथ ले जाएँगे’ escort की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἕως παραδῶσίν σε εἰς χεῖρας αὐτοῦ
  choice: जब तक वे तुम्हें उसके हाथों में न सौंप दें
  rationale: παραδίδωμι और εἰς χεῖρας के ठोस यूनानी मुहावरे को सुरक्षित रखते हुए अधिकार अथवा अभिरक्षा में सौंपे जाने का अर्थ देता है।
theological_decisions:
- issue: मानवीय शासक के लिए κύριος का अनुवाद
  choice: हमारे स्वामी
  alternative: हमारे प्रभु
  rationale: यहाँ संबोधन इस्राएल के परमेश्वर के लिए नहीं, एक मानवीय सेनानायक के लिए है। ‘स्वामी’ सामाजिक पद और अधीनता को व्यक्त करता है तथा अनावश्यक दैवी संकेत से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैनिक परिवेश के लिए ‘तंबू’ और मानवीय उच्चाधिकारी के लिए ‘स्वामी’ चुना गया है। यूनानी के ‘हाथों में’ मुहावरे को मुख्य पाठ में बनाए रखकर पादटिप्पणी में उसका आशय स्पष्ट किया गया है।
