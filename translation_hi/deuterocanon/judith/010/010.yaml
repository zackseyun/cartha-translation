  text: And they did so. Then Judith went out[a], she and her maid with her; and the men of the city kept watching her until she went down the mountain, until she passed through the valley, and they could no longer see her.
translation:
  language: hi
  text: उन्होंने वैसा ही किया। तब यहूदीत अपनी दासी के साथ बाहर निकली। नगर के पुरुष उस पर तब तक निगाह लगाए रहे, जब तक वह पहाड़ से नीचे नहीं उतर गई, और तब तक जब तक वह घाटी[a] से होकर नहीं निकल गई; फिर वे उसे और नहीं देख सके।
  philosophy: optimal-equivalence
  footnotes:
