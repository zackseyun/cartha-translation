- source_word: παιδίσκη
  choice: दासी
  rationale: यहूदीत के साथ चलने वाली अधीनस्थ स्त्री-सेविका का संक्षिप्त और प्रसंगानुकूल संकेत है।
- source_word: ἀπεσκόπευον
  choice: देखते रहे
  rationale: अपूर्ण भूतकाल में निहित लगातार देखते रहने की क्रिया को सुरक्षित रखता है।
- source_word: ἄνδρες τῆς πόλεως
  choice: नगर के पुरुष
  rationale: यूनानी पदबंध का सीधा और लिंग-सटीक अनुवाद है।
- source_word: ἕως οὗ κατέβη τὸ ὄρος
  choice: जब तक वह पहाड़ से नीचे उतरकर
  rationale: भौगोलिक गति और लगातार निगाह रखे जाने की समय-सीमा, दोनों को स्पष्ट करता है।
- source_word: αὐλών
  choice: घाटी
  rationale: इस प्रसंग में पर्वत से उतरने के बाद पार किए गए निचले भूभाग के लिए व्यापक और स्वाभाविक विकल्प है; शब्द के अन्य सम्भव भौगोलिक अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: οὐκ ἔτι ἐθεώρουν αὐτήν
  choice: फिर उनकी आँखों से ओझल नहीं हो गई
  rationale: उसे आगे देख न पाने की परिणति को सहज हिन्दी में व्यक्त करता है, बिना यह बताए कि उसने जानबूझकर स्वयं को छिपाया।
