  yaml_path: translation/deuterocanon/judith/012/011.yaml
  text: And he said to Bagoas the eunuch[a], who was in charge of all that belonged to him[b], “Go now and persuade the Hebrew woman who is with you to come to us and eat and drink with us.”
translation:
  language: hi
  text: और उसने खोजा बगोआस से, जो उसकी सारी संपत्ति और कामकाज का प्रभारी था, कहा, “अब जाओ और उस इब्रानी स्त्री को, जो तुम्हारे साथ है, मना लो कि वह हमारे पास आए और हमारे साथ खाए-पीए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βαγώᾳ
  choice: बगोआस
  rationale: व्यक्तिवाचक नाम का यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: εὐνούχῳ
  choice: खोजे
  rationale: यह यूनानी शब्द का सीधा और ऐतिहासिक दरबारी संदर्भ के अनुकूल हिन्दी रूप है; व्यापक अर्थ ‘दरबारी अधिकारी’ की संभावना पाद-टिप्पणी में रखी गई है।
- source_word: ἐφεστηκὼς ἐπὶ πάντων τῶν αὐτοῦ
  choice: जो उसकी सारी संपत्ति और कामकाज का प्रभारी था
  rationale: वाक्यांश समग्र प्रशासनिक देखरेख बताता है। ‘संपत्ति और कामकाज’ यूनानी के व्यापक ‘उसकी सभी चीज़ों/मामलों’ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Πεισὸν
  choice: मना लो
  rationale: आज्ञार्थक क्रिया का भाव उस स्त्री को आने के लिए राजी करने का है; ‘मना लो’ दबाव या बल का अनावश्यक अर्थ जोड़े बिना यह भाव देता है।
- source_word: τὴν γυναῖκα τὴν Ἑβραίαν
  choice: उस इब्रानी स्त्री को
  rationale: γυνή यहाँ ‘स्त्री’ है, ‘पत्नी’ नहीं; Ἑβραίαν का जातीय संकेत ‘इब्रानी’ के रूप में सुरक्षित रखा गया है।
- source_word: ἣ ἔστιν παρὰ σοὶ
  choice: जो तुम्हारे साथ है
  rationale: παρὰ σοὶ निकटता या साथ होने को बताता है। यह अनुवाद उसे बगोआस की संपत्ति या बंदिनी बताने से बचते हुए मूल की सामान्य अभिव्यक्ति बनाए रखता है।
- source_word: τοῦ ἐλθεῖν πρὸς ἡμᾶς
  choice: कि वह हमारे पास आकर
  rationale: साभिप्राय infinitive को हिन्दी में ‘कि’ उपवाक्य से स्वाभाविक रूप दिया गया है और ‘हमारे पास आने’ का अर्थ सुरक्षित है।
- source_word: φαγεῖν καὶ πιεῖν μεθʼ ἡμῶν
  choice: हमारे साथ खाए-पिए
  rationale: मूल की दोनों सीधी क्रियाओं और सहभागी भोज के भाव को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखा गया है।
