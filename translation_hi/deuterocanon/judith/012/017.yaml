  text: और होलोफर्नेस ने उससे कहा, “पीओ न, और हमारे साथ आनन्द मनाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίε δὴ
  choice: पीओ न
  rationale: πίε प्रत्यक्ष एकवचन आज्ञार्थक है और δή आग्रह/प्रोत्साहन का बल जोड़ता है। हिन्दी का ‘पीओ न’ आदेश को आमंत्रणपूर्ण आग्रह के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γενήθητι μεθʼ ἡμῶν εἰς εὐφροσύνην
  choice: हमारे साथ आनन्द मनाओ
  rationale: शाब्दिक रूप से ‘हमारे साथ आनन्द के लिए/में हो जाओ’ का आशय सामूहिक हर्ष में भाग लेना है। ‘हमारे साथ आनन्द मनाओ’ इस भाव को सहज और संक्षिप्त आधुनिक हिन्दी में रखता है।
- source_word: Ὀλοφέρνης
  choice: होलोफेरनेस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: εἶπεν πρὸς αὐτήν
  choice: उससे कहा
  rationale: πρός के साथ ‘कहा’ हिन्दी में स्वाभाविक रूप से ‘उससे कहा’ होता है और स्त्रीलिंग सर्वनाम का संदर्भ बनाए रखता है।
