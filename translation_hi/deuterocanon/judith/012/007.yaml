base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/007.yaml
  text: And Holofernes ordered the bodyguards not to hinder her[a]. So she remained in the camp for three days, and went out at night into the valley of Bethulia[b], and washed herself at the spring of water by the camp.
translation:
  language: hi
  text: होलोफेरनेस ने अंगरक्षकों को आदेश दिया कि वे उसे न रोकें। वह तीन दिन तक छावनी में रही। वह रात को बैतूलिया की घाटी[a] में निकल जाती और छावनी में पानी के सोते पर अपने को धोती थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घाटी’ के स्थान पर ‘खड्ड’ या ‘संकरी घाटी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया उसी शब्द-परिवार से है जो बाद में ‘बपतिस्मा’ के लिए भी प्रयुक्त हुआ। इस प्रसंग में इसका अर्थ अपने को पानी से धोना या स्नान करना है, मसीही बपतिस्मा नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: आदेश दिया
  rationale: यह क्रिया होलोफेरनेस के अधिकारपूर्ण निर्देश को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करती है।
- source_word: σωματοφύλαξι
  choice: अंगरक्षकों
  rationale: यूनानी संयुक्त शब्द व्यक्तिगत सुरक्षा करने वाले पहरेदारों को दर्शाता है; ‘अंगरक्षक’ इसका संक्षिप्त और प्रचलित हिन्दी समकक्ष है।
- source_word: μὴ διακωλύειν
  choice: न रोकें
  rationale: यह जूडिथ की आवाजाही में बाधा न डालने का भाव सहज आधुनिक हिन्दी में देता है।
- source_word: παρέμεινεν ἐν τῇ παρεμβολῇ ἡμέρας τρεῖς
  choice: तीन दिन तक छावनी में रही
  rationale: अवधि और सैन्य छावनी, दोनों को स्पष्ट रखते हुए हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: ἐξεπορεύετο κατὰ νύκτα
  choice: हर रात … निकल जाती
  rationale: अपूर्ण भूतकाल तीन दिनों के दौरान दोहराई गई क्रिया का संकेत दे सकता है; ‘हर रात’ उस कथात्मक पुनरावृत्ति को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: φάραγγα
  choice: घाटी
  rationale: शब्द संकरी घाटी, खड्ड या दर्रे जैसे भू-आकार को सूचित कर सकता है। मुख्य पाठ में व्यापक और सहज ‘घाटी’ रखा गया है, जबकि विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: Βαιτυλοῦα
  choice: बैतूलिया
  rationale: स्थान-नाम का देवनागरी रूप यूनानी ध्वनि और प्रचलित बाइबलीय नाम-रूप, दोनों के निकट है।
- source_word: ἐβαπτίζετο
  choice: स्नान करती थी
  rationale: मध्यवाच्य और अपूर्ण भूतकाल यहाँ अपने शरीर को पानी से धोने या नहाने की बार-बार की क्रिया बताते हैं। ‘स्नान करती थी’ बाद के मसीही पारिभाषिक अर्थ को मुख्य पाठ पर आरोपित नहीं करता।
- source_word: ἐπὶ τῆς πηγῆς τοῦ ὕδατος
  choice: पानी के सोते पर
  rationale: यह स्वाभाविक हिन्दी में जल-स्रोत के रूप में सोते को व्यक्त करता है और यूनानी की स्थान-सूचक रचना के निकट रहता है।
theological_decisions:
- issue: ἐβαπτίζετο का गैर-मसीही, कथात्मक प्रसंग में अर्थ
  choice: स्नान करती थी
  alternative: अपने को पानी में डुबोती थी; अपने को धोती थी
  rationale: यह क्रिया डुबोने, धोने या स्नान करने का अर्थ दे सकती है। प्रसंग पानी के सोते पर जूडिथ की रात्रिकालीन शारीरिक शुद्धि का है; इसलिए ऐसा रूप चुना गया है जो क्रिया को स्पष्ट रखे, पर बाद के मसीही बपतिस्मा-संबंधी अर्थ को अनावश्यक रूप से यहाँ न लाए।
- issue: ἐξεπορεύετο और ἐβαπτίζετο के अपूर्ण भूतकाल का कथात्मक बल
  choice: दोहराई जाने वाली रात्रिकालीन क्रिया
  alternative: केवल एक रात की साधारण भूतकालीन घटना
  rationale: तीन दिन रहने के उल्लेख के बाद दोनों अपूर्ण क्रियाएँ उसकी नियमित रात्रिकालीन गतिविधि का स्वाभाविक संकेत देती हैं; इसीलिए ‘हर रात’ और ‘करती थी’ रखा गया है, बिना इससे अधिक अनुष्ठानिक अर्थ निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। छोटे वाक्य साधारण पाठक के लिए स्पष्टता बढ़ाते हैं। ‘अंगरक्षक’, ‘छावनी’, ‘सोता’ और ‘स्नान’ जैसे शब्द स्रोत के सैन्य तथा भौगोलिक प्रसंग को बिना अनावश्यक संस्कृतनिष्ठता के व्यक्त करते हैं।
