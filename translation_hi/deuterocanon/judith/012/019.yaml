  yaml_path: translation/deuterocanon/judith/012/019.yaml
  text: And taking it[a], she ate and drank before him what her maidslave had prepared.
translation:
  language: hi
  text: और उसे लेकर, उसने उसके सामने वह खाया और पिया जो उसकी दासी[a] ने तैयार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्त्री-दास।” यूनानी शब्द δούλη का अर्थ दासी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβοῦσα
  choice: उसने लेकर
  rationale: यह λαμβάνω का एओरिस्ट कृदन्त है और खाने-पीने से पहले की क्रिया बताता है। यूनानी में कर्म निहित है; हिन्दी में भी संदर्भ से वह समझ में आता है।
- source_word: ἔφαγεν καὶ ἔπιεν
  choice: खाया और पिया
  rationale: दोनों एओरिस्ट क्रियाओं का सीधा और स्वाभाविक हिन्दी समन्वय है।
- source_word: κατέναντι αὐτοῦ
  choice: उसके सामने
  rationale: यह होलोफेरनेस की उपस्थिति में, उसके सम्मुख होने का स्थानिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἃ
  choice: वही ... जो
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम तैयार की गई खाने-पीने की वस्तुओं को सामूहिक रूप से सूचित करता है; ‘वही ... जो’ हिन्दी में सम्बन्ध स्पष्ट रखता है।
- source_word: ἡτοίμασεν
  choice: तैयार किया था
  rationale: तैयारी खाने-पीने से पहले हो चुकी थी; ‘किया था’ इस पूर्वकालिक सम्बन्ध को स्पष्ट करता है।
- source_word: ἡ δούλη αὐτῆς
  choice: उसकी दासी
  rationale: δούλη स्त्रीलिंग संज्ञा है जो बन्धुआ स्त्री-दास को सूचित कर सकती है। ‘दासी’ हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है तथा केवल सामान्य सेविका की अपेक्षा दासत्व का भाव बेहतर बनाए रखता है।
theological_decisions:
- issue: δούλη में सामाजिक हैसियत का निरूपण
  choice: दासी
  alternative: सेविका
  rationale: ‘सेविका’ स्रोत में सम्भावित बन्धुआ हैसियत को नरम कर सकती है। ‘दासी’ मूल शब्द के दासत्व-संबंधी अर्थ को बनाए रखती है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘दासी’ सामान्य पाठक के लिए परिचित है; पादटिप्पणी उसके ऐतिहासिक-सामाजिक अर्थ को स्पष्ट करती है।
