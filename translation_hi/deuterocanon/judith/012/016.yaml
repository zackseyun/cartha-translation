base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/016.yaml
  text: And when she entered[a], Judith reclined, and the heart of Holofernes was beside itself over her; his soul was shaken. He was very eager to have relations with her[b], and he was watching for an opportunity to deceive her from the day he saw her.
translation:
  language: hi
  text: और जब वह भीतर आई, तो यूदीथ भोज के लिए लेट गई[a]। होलोफेर्नेस का हृदय उसके कारण बेकाबू हो गया और उसकी आत्मा विचलित हो उठी। वह उसके साथ शारीरिक संबंध बनाने के लिए अत्यन्त लालायित था और जिस दिन से उसने उसे देखा था, तब से उसे छलने[b] का अवसर ढूँढ़ रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात भोज की प्राचीन रीति के अनुसार मेज़ के पास लेटकर भोजन करने लगी।
    reason: cultural_note
  - marker: b
    text: या “फुसलाने” अथवा “धोखा देने।” यूनानी शब्द का अर्थ “छलना” है; इस प्रसंग में इसमें लैंगिक उद्देश्य से बहकाना भी सम्मिलित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: भीतर आकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है; यह हिन्दी में स्वाभाविक रूप से क्रम को बनाए रखता है।
- source_word: ἀνέπεσεν
  choice: भोजन के लिए लेट गई
  rationale: भोज के प्रसंग में यह मेज़ पर लेटकर भोजन करने की प्राचीन रीति को सूचित करता है, केवल सामान्यतः लेटने को नहीं।
- source_word: ἐξέστη ἡ καρδία ... ἐπʼ αὐτῇ
  choice: हृदय उसके कारण बेकाबू हो गया
  rationale: यूनानी मुहावरा सामान्य संयम खो बैठने और उससे अभिभूत होने का तीव्र भाव देता है; 'उसके कारण' ἐπʼ αὐτῇ का कारणार्थ स्पष्ट करता है।
- source_word: ἐσαλεύθη ἡ ψυχὴ αὐτοῦ
  choice: उसका प्राण विचलित हो उठा
  rationale: ψυχή की आन्तरिक-जीवन संबंधी भाषा को बनाए रखते हुए σαλεύω की हलचल और अस्थिरता व्यक्त होती है।
- source_word: κατενθύμως σφόδρα
  choice: अत्यन्त लालायित था
  rationale: यह प्रबल आन्तरिक इच्छा और अभिप्राय व्यक्त करता है; हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τοῦ συγγενέσθαι μετʼ αὐτῆς
  choice: उसके साथ शारीरिक संबंध बनाने के लिए
  rationale: प्रसंग में यह लैंगिक मिलन का शिष्टोक्तिपूर्ण संकेत है; चयन अर्थ स्पष्ट करता है, पर अशिष्ट नहीं होता।
- source_word: ἐτήρει καιρόν
  choice: अवसर ढूँढ़ रहा था
  rationale: अपूर्ण भूतकाल निरन्तर प्रयास को और καιρός उपयुक्त अवसर को दर्शाता है।
- source_word: τοῦ ἀπατῆσαι αὐτήν
  choice: उसे छलने
  rationale: ἀπατάω का मूल अर्थ छलना या धोखा देना है; प्रसंग में लैंगिक चालबाज़ी निहित हो सकती है, पर उसे मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ἀφʼ ἧς ἡμέρας εἶδεν αὐτήν
  choice: जिस दिन से उसने उसे देखा था, उसी दिन से
  rationale: कालगत आरम्भ-बिन्दु को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: लैंगिक अभिप्राय की शिष्टोक्ति
  choice: उसके साथ शारीरिक संबंध बनाने
  alternative: उसके साथ सोने / उसके साथ होने
  rationale: यूनानी अभिव्यक्ति लैंगिक मिलन के लिए शिष्टोक्ति है। चयन आधुनिक पाठक के लिए अर्थ स्पष्ट रखता है और स्रोत की संयत शैली का यथासम्भव सम्मान करता है।
- issue: ψυχή की मानव-अन्तःकरण संबंधी भाषा
  choice: उसका प्राण विचलित हो उठा
  alternative: उसका मन विचलित हो उठा / उसका अन्तर्मन हिल उठा
  rationale: '''प्राण'' स्रोत की ψυχή-संबंधी भाषा को बनाए रखता है और इसे केवल मनोवैज्ञानिक भावना में सीमित नहीं करता।'
- issue: ἀπατάω में छल और लैंगिक बहकावे का संबंध
  choice: छलने
  alternative: फुसलाने / बहकाने
  rationale: मुख्य पाठ यूनानी शब्द का व्यापक मूल अर्थ रखता है; पादटिप्पणी प्रसंग में सम्भव लैंगिक चालबाज़ी को बताती है, बिना अस्पष्टता को समाप्त किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। 'भोजन के लिए लेट गई' सांस्कृतिक क्रिया को स्पष्ट करता है; 'शारीरिक संबंध' लैंगिक आशय को संयत ढंग से व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
