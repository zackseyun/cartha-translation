  text: And Judith said[a], “I will drink now, my lord, because my life has been magnified within me today beyond all the days since my birth.”
translation:
  language: hi
  text: और यहूदीत ने कहा, “अब मैं पीऊँगी, मेरे प्रभु, क्योंकि आज मेरे भीतर मेरा जीवन मेरे जन्म से लेकर अब तक के सभी दिनों से बढ़कर महान किया गया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आज मेरे भीतर मेरा जीवन मेरे जन्म से अब तक के किसी भी दिन की अपेक्षा अधिक महान बना दिया गया है।”
    reason: μεγαλύνω के कर्मवाच्य और παρά द्वारा व्यक्त तुलना का वैकल्पिक, थोड़ा अधिक प्रवाहपूर्ण हिंदी विन्यास।
lexical_decisions:
- source_word: Πίομαι
  choice: मैं पीऊँगी
  rationale: यह πίνω का भविष्यत् मध्यम रूप है और पीने के निमंत्रण पर यहूदीत की स्वेच्छापूर्ण सहमति व्यक्त करता है। हिंदी में “मैं पीऊँगी” भविष्यत् अर्थ और संकल्प—दोनों को स्वाभाविक रूप से रखता है।
- source_word: δή
  choice: अब
  rationale: यह अव्यय कथन में तात्कालिकता या हल्का बल जोड़ता है; इस प्रत्यक्ष कथन में “अब” सहज हिंदी है।
- source_word: κύριε
  choice: मेरे प्रभु
  rationale: यह होलोफेरनेस के लिए आदरसूचक संबोधन है। “मेरे प्रभु” उसकी विनम्रता को बनाए रखता है, जबकि संदर्भ स्पष्ट करता है कि यह ईश्वर के लिए प्रयुक्त संबोधन नहीं है।
- source_word: ἐμεγαλύνθη
  choice: महान किया गया है
  rationale: μεγαλύνω के अओरिस्ट कर्मवाच्य का मूल अर्थ “महान/बड़ा किया गया” है। यह चयन मूल के उन्नत और कुछ असामान्य रूपक को बनाए रखता है, उसे केवल प्रसन्नता या समृद्धि में नहीं बदलता।
- source_word: τὸ ζῆν μου
  choice: मेरा जीवन
  rationale: संज्ञीकृत क्रियार्थक रूप का शाब्दिक भाव “मेरा जीना” है; वर्तमान हिंदी में “मेरा जीवन” अर्थ को अधिक सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐν ἐμοὶ
  choice: मेरे भीतर
  rationale: मूल पाठ की आंतरिक और व्यक्तिगत अभिव्यक्ति को छोड़े बिना स्वाभाविक हिंदी देता है।
- source_word: σήμερον
  choice: आज
  rationale: समयवाचक क्रियाविशेषण का सीधा और आधुनिक हिंदी समतुल्य।
- source_word: παρὰ πάσας τὰς ἡμέρας
  choice: सभी दिनों से बढ़कर
  rationale: यहाँ παρά कर्मकारक के साथ तुलना व्यक्त करता है। “से बढ़कर” तुलनात्मक बल और कथन की उन्नत शैली दोनों को बनाए रखता है।
- source_word: τῆς γενέσεώς μου
  choice: मेरे जन्म से लेकर अब तक
  rationale: γένεσις यहाँ जन्म या उत्पत्ति को दर्शाता है। हिंदी में यह वाक्यांश जन्म से वर्तमान दिन तक की समयावधि स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यहूदीत के जीवन के “महान किए जाने” का आशय
  choice: रूपकपूर्ण और उन्नत अभिव्यक्ति “मेरे भीतर मेरा जीवन…महान किया गया है” को बनाए रखा गया है।
  alternative: “आज मैं पहले से कहीं अधिक जीवंत/आनंदित हूँ” या “आज मेरा जीवन सबसे अधिक समृद्ध हुआ है।”
  rationale: यूनानी पाठ μεγαλύνω को τὸ ζῆν μου के साथ प्रयोग करता है और केवल आनंद, जीवंतता या समृद्धि नहीं कहता। इसलिए व्याख्यात्मक तनाव को किसी एक सरल भाव में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण प्रत्यक्ष कथन। “मेरे प्रभु” मानवीय आदरसूचक संबोधन है। “मेरे भीतर मेरा जीवन…महान किया गया है” जानबूझकर कुछ उन्नत और असामान्य रखा गया है, क्योंकि मूल यूनानी भी रूपकपूर्ण है।
