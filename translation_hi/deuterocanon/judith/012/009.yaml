translation:
  language: hi
  text: और भीतर आने पर वह शुद्ध रहकर तम्बू में तब तक रही, जब तक कि साँझ के समय वह अपना भोजन न ले आई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσπορευομένη
  choice: भीतर आने पर
  rationale: वर्तमान कृदन्त को सहज कालवाचक रूप में व्यक्त किया गया है; इससे तम्बू में प्रवेश करने की क्रिया स्पष्ट रहती है।
- source_word: καθαρά
  choice: शुद्ध अवस्था में
  rationale: विशेषण सामान्य शुद्धता अथवा विधिगत शुद्धता, दोनों का संकेत दे सकता है। यह रूप मूल की व्यापकता बनाए रखता है और विधिगत अर्थ को अनिवार्य नहीं बनाता।
- source_word: παρέμενεν
  choice: रही
  rationale: अपूर्ण भूतकाल की जारी रहने वाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῇ σκηνῇ
  choice: तम्बू में
  rationale: σκηνή का सीधा और प्रसंगानुकूल अर्थ तम्बू है।
- source_word: μέχρι οὗ
  choice: तब तक ... जब तक कि
  rationale: यूनानी कालवाचक सीमा को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: προσηνέγκατο
  choice: भीतर ... ले आई
  rationale: प्रसंग में भोजन को अपने पास या तम्बू में लाने का भाव है; यह अनुवाद 'अर्पित किया' जैसे अनावश्यक बलिदानी अर्थ से बचता है।
- source_word: τὴν τροφὴν αὐτῆς
  choice: अपना भोजन
  rationale: τροφή भोजन या आहार को दर्शाता है; 'अपना भोजन' हिन्दी में स्वाभाविक रूप से αὐτῆς का सम्बन्ध भी व्यक्त करता है।
- source_word: πρὸς ἑσπέραν
  choice: साँझ के समय
  rationale: यह साँझ की ओर या साँझ के आसपास का समय बताता है; हिन्दी में यह सहज है और अत्यधिक निश्चित समय-बिन्दु नहीं थोपता।
theological_decisions:
- issue: क्या καθαρά को मुख्य पाठ में स्पष्ट रूप से विधिगत शुद्धता कहा जाए
  choice: मुख्य पाठ में सामान्य 'शुद्ध अवस्था में' रखा गया है
  alternative: '''विधि के अनुसार शुद्ध'' अथवा केवल ''शुद्ध'''
  rationale: प्रसंग में विधिगत शुद्धता का संकेत संभव है, पर यूनानी विशेषण अपने आप में केवल तकनीकी विधिगत अर्थ को अनिवार्य नहीं करता। पादटिप्पणी इस वास्तविक अर्थ-विस्तार को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। 'शुद्ध अवस्था में' मूल की अर्थगत अस्पष्टता बनाए रखता है; पादटिप्पणी में विधिगत अर्थ की संभावना दी गई है।
