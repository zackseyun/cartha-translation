  text: And when she went up[a], she was praying to the Lord God of Israel to direct her way for the exaltation of the sons of his people.
translation:
  language: hi
  text: और जब वह ऊपर आई, तब वह इस्राएल के प्रभु परमेश्वर से प्रार्थना करती रही कि वह उसके मार्ग को अपनी प्रजा के पुत्रों के उत्थान[a] के लिए सीधा करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपर उठाए जाने” अथवा “पुनःस्थापना।” यहाँ प्रयुक्त यूनानी संज्ञा दुर्लभ है और केवल शारीरिक रूप से ऊपर उठने के बजाय दशा या प्रतिष्ठा में उठाए जाने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: ऊपर आई
  rationale: क्रिया के भूतकालिक, स्थान-सूचक अर्थ ‘ऊपर आना’ को प्रसंगानुकूल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐδέετο
  choice: प्रार्थना करती रही
  rationale: परमेश्वर से विनती का भाव स्पष्ट करता है और अपूर्ण भूतकाल की जारी क्रिया को भी सुरक्षित रखता है।
- source_word: κυρίου θεοῦ Ἰσραὴλ
  choice: इस्राएल के प्रभु परमेश्वर
  rationale: यह यहूदी प्रार्थना में प्रयुक्त श्रद्धापूर्ण उपाधि का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: κατευθῦναι
  choice: सीधा करे
  rationale: मूल क्रिया में मार्ग को सीधा करने और दिशा देने, दोनों का बिंब है; ‘सीधा करे’ उस रूपक को बनाए रखता है।
- source_word: τὴν ὁδὸν αὐτῆς
  choice: उसके मार्ग को
  rationale: यह वास्तविक रास्ते और उसके अभियान अथवा कार्य-दिशा, दोनों अर्थों की संभावना खुली रखता है।
- source_word: εἰς ἀνάστημα
  choice: उत्थान के लिए
  rationale: दुर्लभ संज्ञा के ‘ऊपर उठाए जाने’, दशा-सुधार और पुनःस्थापना जैसे संभावित अर्थों को बिना किसी एक अर्थ तक सीमित किए संक्षेप में व्यक्त करता है।
- source_word: τῶν υἱῶν τοῦ λαοῦ αὐτοῦ
  choice: अपनी प्रजा के पुत्रों के
  rationale: मूल के स्पष्ट पुरुषवाची बहुवचन ‘पुत्रों’ को बनाए रखता है और αὐτοῦ का संबंध परमेश्वर से स्वाभाविक हिन्दी में ‘अपनी’ द्वारा व्यक्त करता है।
theological_decisions:
- issue: यहूदी प्रार्थना-सूत्र में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: ग्रीक पाठ में κύριος है; ‘प्रभु’ सम्मानसूचक अर्थ को स्पष्ट रखते हुए किसी विशिष्ट पुनर्निर्मित ईश्वरीय नाम को पाठ में नहीं जोड़ता।
- issue: υἱῶν की लिंग-सूचक भाषा
  choice: पुत्रों
  alternative: संतानों / लोगों
  rationale: मूल में पुरुषवाची बहुवचन स्पष्ट है, इसलिए उसे बनाए रखा गया है; उसे सामान्य ‘लोगों’ में बदलना स्रोत की अभिव्यक्ति को समतल कर देता।
- issue: ἀνάστημα का संदर्भगत आशय
  choice: उत्थान
  alternative: महिमा-वृद्धि / पुनःस्थापना / उद्धार
  rationale: यह दुर्लभ शब्द दशा या प्रतिष्ठा में ऊपर उठाए जाने का संकेत दे सकता है। ‘उत्थान’ इस व्यापकता को रखता है और किसी एक धर्मवैचारिक निष्कर्ष को अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मार्ग को सीधा करे’ मूल रूपक को सुरक्षित रखता है, जबकि ‘उत्थान’ दुर्लभ यूनानी पद की वास्तविक अस्पष्टता को पादटिप्पणी सहित बनाए रखता है।
