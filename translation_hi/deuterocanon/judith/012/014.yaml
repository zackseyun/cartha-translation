base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/014.yaml
  text: And Judith said to him[a], “And who am I to speak back to my lord? Whatever is pleasing in his eyes, I will quickly do, and this will be my joy until the day of my death.”
translation:
  language: hi
  text: और यहूदीत ने उससे कहा, “मैं कौन हूँ जो अपने स्वामी का विरोध करूँ?[a] जो कुछ उसकी दृष्टि में अच्छा होगा, उसे मैं तत्परता से करूँगी; और यह मेरे लिए मेरी मृत्यु के दिन तक आनन्द होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने स्वामी को उलटा उत्तर दूँ?” अथवा “अपने स्वामी की बात काटूँ?”
    reason: ἀντειποῦσα में विरोध करने, प्रत्युत्तर देने या बात काटने के निकटवर्ती अर्थ संभव हैं।
lexical_decisions:
- source_word: ἀντειποῦσα
  choice: बात का विरोध करूँ
  rationale: यह क्रिया प्रत्युत्तर में विरोध करने या बात काटने का भाव रखती है। हिन्दी में यह प्रयोग सामाजिक विनम्रता और मूल की संभावित विरोधात्मकता—दोनों को बनाए रखता है।
- source_word: τῷ κυρίῳ μου
  choice: अपने स्वामी की
  rationale: यहाँ κύριος परमेश्वर के लिए उपाधि नहीं, बल्कि होलोफेरनेस के लिए सम्मानसूचक संबोधन है। ‘स्वामी’ आधुनिक हिन्दी में इस अधीनतापूर्ण दरबारी संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πᾶν ὃ ἔσται ἐν τοῖς ὀφθαλμοῖς αὐτοῦ ἀρεστόν
  choice: जो कुछ उसकी दृष्टि में प्रसन्न करनेवाला होगा
  rationale: ‘उसकी दृष्टि में’ मूल यूनानी बिंब को बनाए रखता है और ἀρεστόν को उसकी स्वीकृति या प्रसन्नता के अर्थ में व्यक्त करता है।
- source_word: σπεύσασα
  choice: तत्परता से
  rationale: कृदन्त में शीघ्रता के साथ उत्सुक तत्परता का भाव भी है; ‘तत्परता से’ केवल गति की अपेक्षा इस भाव को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγαλλίαμα
  choice: आनन्द का कारण
  rationale: संज्ञा प्रबल आनन्द या उल्लास को सूचित करती है। ‘आनन्द का कारण’ वाक्य में स्वाभाविक है और भाव को अनावश्यक रूप से अतिरंजित नहीं करता।
- source_word: ἕως ἡμέρας θανάτου μου
  choice: मेरी मृत्यु के दिन तक
  rationale: यह मूल समय-सूचक अभिव्यक्ति का सीधा और गरिमापूर्ण अनुवाद है।
theological_decisions:
- issue: मानवीय संबोधन में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: संदर्भ में यह होलोफेरनेस के प्रति सामाजिक सम्मानसूचक संबोधन है, ईश्वरीय उपाधि नहीं। ‘स्वामी’ इस भेद को स्पष्ट रखता है और ‘प्रभु’ से उत्पन्न हो सकनेवाले दैवी संकेत से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यहूदीत की औपचारिक विनम्रता को सुरक्षित रखते हुए उसके कथन की अलंकारिक प्रकृति पर कोई अतिरिक्त व्याख्या आरोपित नहीं की गई।
