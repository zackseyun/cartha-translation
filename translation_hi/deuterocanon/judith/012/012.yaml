  text: क्योंकि देखो, यदि हम ऐसी स्त्री से बात किए बिना उसे जाने देंगे, तो यह हमारे लिए लज्जा की बात होगी; क्योंकि यदि हम उसे अपनी ओर न खींचें[a], तो वह हम पर हँसेगी।
  philosophy: optimal-equivalence
