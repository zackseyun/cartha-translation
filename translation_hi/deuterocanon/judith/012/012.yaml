- source_word: ἐπισπάσωμεθα
  choice: हम उसे अपनी ओर न खींचें
  rationale: क्रिया किसी को अपनी ओर खींचने का अर्थ देती है और संदर्भ में आकर्षित करने, फुसलाने या अपने वश में करने की ध्वनि रख सकती है; मुख्य पाठ अपेक्षाकृत खुला अर्थ सुरक्षित रखता है।
- source_word: καταγελάσεται ἡμῶν
  choice: वह हम पर हँसेगी
  rationale: यह सीधा अर्थ उपहास और सामाजिक अपमान की संदर्भगत ध्वनि को बनाए रखता है।
