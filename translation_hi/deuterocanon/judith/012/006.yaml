  text: And she arose toward the morning watch[a], and sent to Holofernes, saying, “Let my lord now give orders to allow your servant to go out for prayer.”
translation:
  language: hi
  text: और वह भोर के पहर के निकट उठी और होलोफेरनेस के पास यह संदेश भेजा, “मेरे स्वामी अब यह आदेश दें कि आपकी दासी[a] को प्रार्थना करने के लिए बाहर जाने दिया जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपकी गुलाम स्त्री।” यूनानी में यहाँ δούλη शब्द है, जिसका अर्थ प्रसंग के अनुसार सेविका या गुलाम स्त्री हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστη
  choice: उठी
  rationale: यहाँ क्रिया उस समय यूदित के उठने को बताती है; आधुनिक हिन्दी में ‘उठी’ सीधा और स्वाभाविक है।
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: भोर के पहर के निकट
  rationale: φυλακή रात के पहर को और ἑωθινή भोर के समय को सूचित करता है। ‘के निकट’ πρὸς की समय-संबंधी बारीकी को यथासंभव बनाए रखता है।
- source_word: ἀπέστειλεν πρὸς Ὁλοφέρνην
  choice: होलोफेरनेस के पास यह संदेश भेजा
  rationale: यूनानी प्रयोग में किसी व्यक्ति या संदेश को भेजना निहित है; हिन्दी में ‘संदेश भेजा’ कथन के आशय को स्पष्ट और सहज बनाता है।
- source_word: Ἐπιταξάτω δὴ
  choice: अब यह आदेश दें
  rationale: आज्ञार्थक क्रिया होलोफेरनेस से आधिकारिक निर्देश जारी करने का विनम्र अनुरोध करती है; δὴ का प्रसंगगत बल ‘अब’ से व्यक्त किया गया है।
- source_word: ὁ κύριός μου
  choice: मेरे स्वामी
  rationale: यहाँ κύριος परमेश्वर की उपाधि नहीं, बल्कि एक मानवीय अधिकारी के लिए आदरसूचक संबोधन है। ‘स्वामी’ हिन्दी में उस सामाजिक अधीनता और विनम्रता को व्यक्त करता है।
- source_word: ἐᾶσαι
  choice: जाने दिया जाए
  rationale: यह अनुमति देने का अर्थ व्यक्त करता है और ‘आदेश दें कि...जाने दिया जाए’ हिन्दी में स्वाभाविक वाक्य-विन्यास है।
- source_word: τὴν δούλην σου
  choice: आपकी दासी
  rationale: स्त्रीलिंग δούλη सेविका या दासी/गुलाम स्त्री दोनों का बोध करा सकता है। यहाँ यह यूदित का विनम्र आत्म-संबोधन है; ‘दासी’ सामाजिक अधीनता को बनाए रखते हुए प्रसंग में स्वाभाविक है।
- source_word: ἐπὶ προσευχὴν
  choice: प्रार्थना करने के लिए
  rationale: यह वाक्यांश बाहर जाने का उद्देश्य बताता है; हिन्दी में क्रियात्मक रूप अधिक सहज है।
- source_word: ἐξελθεῖν
  choice: बाहर जाने
  rationale: यह बाहर निकलने की सामान्य गति को सीधे व्यक्त करता है।
theological_decisions:
- issue: मानवीय अधिकारी के लिए κύριος का अनुवाद
  choice: मेरे स्वामी
  alternative: मेरे प्रभु
  rationale: संदर्भ में संबोधन होलोफेरनेस के लिए है, इसलिए ऐसा शब्द चुना गया है जो आदर और अधिकार तो व्यक्त करे, पर दिव्य उपाधि का अनावश्यक संकेत न दे।
- issue: यूदित के आत्म-संबोधन में δούλη का अनुवाद
  choice: आपकी दासी
  alternative: आपकी गुलाम
  rationale: यहाँ शब्द विनम्र, अधीनस्थ आत्म-संबोधन के रूप में प्रयुक्त है। ‘दासी’ उस भाव को स्वाभाविक रूप से व्यक्त करता है, जबकि संभावित दासत्व-अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। यूदित के विनम्र संबोधन और होलोफेरनेस के आदेश देने के अधिकार को स्पष्ट किया गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘morning watch’ के बाद था, पर उसकी सामग्री δούλη से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न ‘दासी’ के बाद रखा गया है।
