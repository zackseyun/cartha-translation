base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/015.yaml
  text: And after disrobing[a], she adorned herself with her garments and with all her feminine adornment; and her female servant came and spread out for her on the ground opposite Holofernes the fleeces that she had received from Bagoas for her daily use[c][b], so that she might recline on them while eating.
translation:
  language: hi
  text: और वस्त्र बदलने के बाद[a] उसने अपने वस्त्रों और स्त्रियोचित समस्त श्रृंगार से स्वयं को सजाया। तब उसकी दासी[b] ने आकर होलोफेरनेस के सामने भूमि पर उसके लिए वे ऊनदार खालें बिछा दीं, जो उसने बगोआस से अपने प्रतिदिन के उपयोग के लिए ली थीं, ताकि वह उन पर लेटकर भोजन कर सके।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वस्त्र उतारने के बाद”; अधिक शाब्दिक रूप से, “अलग होने के बाद।” यूनानी कृदन्त असामान्य है; प्रसंग से जान पड़ता है कि सजने से पहले उसने अपने पहले के वस्त्र हटाए या बदले।
    reason: lexical_alternative
  - marker: b
    text: “दासी” स्त्रीलिंग यूनानी शब्द δούλη का अनुवाद है, जो दासत्व की स्थिति वाली स्त्री सेविका को दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: उस समय भोज करते हुए करवट लेकर या टिककर लेटना प्रचलित रीति थी।
    reason: cultural_note
lexical_decisions:
- source_word: διαστασᾶσα
  choice: वस्त्र बदलने के बाद
  rationale: यह असामान्य कृदन्त मूलतः अलग होने का भाव दे सकता है, पर तत्काल प्रसंग में पहले के वस्त्र हटाकर सजने की तैयारी सूचित करता है। मुख्य पाठ में स्वाभाविक किंतु सावधान अनुवाद रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἐκοσμήθη
  choice: अपने आपको सजाया
  rationale: क्रिया केवल वस्त्र पहनने से अधिक, स्वयं को व्यवस्थित और अलंकृत करने का भाव रखती है।
- source_word: ἱματισμός
  choice: वस्त्रों
  rationale: सामूहिक अर्थ में बहुवचन हिन्दी में स्वाभाविक है और पहनावे को व्यक्त करता है।
- source_word: παντὶ τῷ κόσμῳ τῷ γυναικείῳ
  choice: स्त्रियों के सब प्रकार के श्रृंगार
  rationale: κόσμος यहाँ अलंकरण या सजने की सामग्री को दर्शाता है; इसे केवल आभूषण तक सीमित नहीं किया गया।
- source_word: δούλη
  choice: दासी
  rationale: स्त्रीलिंग शब्द उसकी सेविका होने के साथ अधीन/दास स्थिति भी बताता है; ‘दासी’ आधुनिक हिन्दी में संक्षिप्त और स्रोत के निकट है।
- source_word: ἔστρωσεν
  choice: बिछा दीं
  rationale: भूमि पर खालों को भोजन के लिए तैयार करके फैलाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χαμαὶ
  choice: भूमि पर
  rationale: स्थानसूचक क्रियाविशेषण का सीधा और परिवेश-निरपेक्ष अनुवाद।
- source_word: κώδια
  choice: ऊनदार खालें
  rationale: शब्द ऊन सहित खालों या ऊनी बिछावनों को सूचित कर सकता है; यह चयन सामग्री और उपयोग दोनों को स्पष्ट रखता है, बिना पशु-प्रजाति को अनावश्यक रूप से निश्चित किए।
- source_word: παρὰ Βαγώου
  choice: बगोआस से
  rationale: παρά के संबंधकारक प्रयोग में प्राप्ति के स्रोत को दर्शाता है।
- source_word: εἰς τὴν καθημερινὴν δίαιταν αὐτῆς
  choice: अपने प्रतिदिन के उपयोग के लिए
  rationale: δίαιτα जीवन-रीति, दिनचर्या या नियमित व्यवस्था का अर्थ दे सकता है; यहाँ भोजन के समय नियमित रूप से प्रयुक्त बिछावन के संदर्भ में यह सहज अनुवाद है।
- source_word: κατακλινομένην
  choice: लेटकर भोजन कर सके
  rationale: प्राचीन भोज में टिककर या लेटकर खाने की मुद्रा को व्यक्त करता है; ‘बैठकर’ कहना सांस्कृतिक विवरण खो देता।
