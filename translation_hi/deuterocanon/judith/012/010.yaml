  yaml_path: translation/deuterocanon/judith/012/010.yaml
  text: And on the fourth day[a], Holofernes gave a banquet for his servants alone[b], and he did not invite any of those in attendance.
translation:
  language: hi
  text: चौथे दिन होलोफेरनेस ने केवल अपने दासों के लिए मदिरा-भोज रखा[a] और सेवा के कामों में लगे लोगों में से किसी को भी उसमें नहीं बुलाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ मदिरापान के लिए रखा गया भोज या दावत है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी अभिव्यक्ति कुछ मुहावरेदार है; इसका आशय व्यावहारिक सेवा या निर्धारित कामों में लगे लोगों से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῇ ἡμέρᾳ τῇ τετάρτῃ
  choice: चौथे दिन
  rationale: यह यूनानी कथात्मक मुहावरा समय बताता है; संक्षिप्त हिंदी रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐποίησεν ... πότον
  choice: मदिरा-भोज रखा
  rationale: πότος विशेष रूप से मदिरापान से जुड़े भोज या दावत को दर्शाता है; ‘मदिरा-भोज’ साधारण ‘भोज’ से अधिक सटीक है।
- source_word: τοῖς δούλοις αὐτοῦ μόνοις
  choice: केवल अपने दासों के लिए
  rationale: δοῦλος अधीन और बंधित सामाजिक स्थिति को व्यक्त कर सकता है; ‘दास’ इस तथ्य को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है, जबकि μόνοις अतिथि-समूह की विशिष्टता बताता है।
- source_word: οὐκ ἐκάλεσεν
  choice: नहीं बुलाया
  rationale: भोज के प्रसंग में ‘बुलाया’ निमंत्रण देने का स्वाभाविक हिंदी रूप है।
- source_word: εἰς τὴν χρῆσιν
  choice: उसमें
  rationale: यहाँ वाक्यांश भोज के अवसर में सम्मिलित होने की ओर संकेत करता है; ‘उसमें’ पूर्वोक्त मदिरा-भोज से संबंध बनाए रखता है और यूनानी की असामान्य अभिव्यक्ति पर अनावश्यक अति-व्याख्या नहीं करता।
- source_word: τῶν πρὸς ταῖς χρείαις
  choice: सेवा के कामों में लगे लोगों में से
  rationale: अभिव्यक्ति व्यावहारिक सेवा या निर्धारित कामों में लगे व्यक्तियों की ओर संकेत करती है, पर उनका सटीक पद स्पष्ट नहीं करती; चुना हुआ रूप इस अस्पष्टता को बनाए रखता है।
