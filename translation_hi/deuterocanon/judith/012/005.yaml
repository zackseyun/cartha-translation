  text: And Holofernes’s attendants brought her into the tent[a], and she slept until the middle of the night; then she rose at the morning watch[b],
translation:
  language: hi
  text: होलोफ़ेरनेस के सेवक उसे तंबू में ले आए, और वह रात के मध्य तक[a] सोई; फिर भोर के पहर[b] वह उठी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आधी रात तक।’ यूनानी में शाब्दिक भाव है, ‘जब रात अपने मध्य में थी।’
    reason: lexical_alternative
  - marker: b
    text: ‘भोर का पहर’ प्राचीन काल में रात के पहरों में से सूर्योदय के निकट वाले पहर को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: θεράποντες
  choice: सेवक
  rationale: यह शब्द निजी सेवा या परिचर्या करने वालों को दर्शाता है। सैन्य शिविर के प्रसंग में ‘सेवक’ स्वाभाविक है और अपने आप दासता का अर्थ नहीं देता।
- source_word: σκηνήν
  choice: तंबू
  rationale: सैन्य शिविर के प्रसंग में σκηνή का सामान्य और स्पष्ट अर्थ ‘तंबू’ है।
- source_word: ὕπνωσεν
  choice: सोई
  rationale: यूनानी अओरिस्ट यहाँ सीधे उसके सोने का वर्णन करता है; ‘सोई’ संक्षिप्त और स्वाभाविक है।
- source_word: μέχρι μεσούσης τῆς νυκτός
  choice: रात के मध्य तक
  rationale: यह अभिव्यक्ति यूनानी वाक्यांश के शाब्दिक रूप और समय-संबंधी अर्थ दोनों को बनाए रखती है; अधिक मुहावरेदार विकल्प ‘आधी रात तक’ पादटिप्पणी में दिया गया है।
- source_word: ἀνέστη
  choice: उठी
  rationale: इस प्रसंग में क्रिया का अर्थ नींद से उठना है; आधुनिक हिन्दी में ‘उठी’ स्वाभाविक और स्पष्ट है।
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: भोर के पहर
  rationale: φυλακή रात के निगरानी-पहर को दर्शा सकता है, और πρός यहाँ उस पहर के आसपास का समय सूचित करता है। ‘भोर के पहर’ प्राचीन समय-विभाजन को बनाए रखते हुए सहज हिन्दी देता है।
