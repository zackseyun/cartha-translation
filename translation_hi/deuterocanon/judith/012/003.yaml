  yaml_path: translation/deuterocanon/judith/012/003.yaml
  text: And Holofernes said to her[a], “But if the things you have with you run out, from where shall we get for you provisions like them? For there is no one with us from your nation.”
translation:
  language: hi
  text: और होलोफेरनेस ने उससे कहा, “लेकिन यदि तुम्हारे साथ की चीज़ें समाप्त हो जाएँ, तो हम तुम्हारे लिए उनके जैसी रसद[a] कहाँ से लाएँगे? क्योंकि हमारे साथ तुम्हारे लोगों में से कोई नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भोजन-सामग्री” अथवा “आवश्यक सामग्री।” यहाँ यूनानी शब्द δύναμιν का प्रयोग असामान्य अर्थ में हुआ है; सामान्यतः इसका अर्थ “शक्ति” होता है, पर इस प्रसंग में यह संभवतः जीवन-निर्वाह की सामग्री को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλίπῃ
  choice: समाप्त हो जाएँ
  rationale: यह क्रिया किसी वस्तु के चुक जाने या उपलब्ध न रहने को व्यक्त करती है; साथ लाई गई वस्तुओं के संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: τὰ μετὰ σοῦ ὄντα
  choice: तुम्हारे पास की वस्तुएँ
  rationale: यूनानी पद का व्यापक अर्थ बनाए रखा गया है; संदर्भ से स्पष्ट होता है कि संकेत विशेष रूप से उसके साथ लाई गई भोजन-सामग्री की ओर है।
- source_word: ἐξοίσομεν
  choice: लाएँगे
  rationale: ἐκφέρω के मूल ‘बाहर लाना/ले आना’ भाव को प्रसंगानुकूल और सहज हिन्दी में व्यक्त करता है।
- source_word: δύναμιν
  choice: रसद
  rationale: δύναμις का सामान्य अर्थ ‘शक्ति’ है, पर यहाँ साथ लाई गई वस्तुओं के समान किसी पोषणकारी सामग्री की व्यवस्था करने की बात है; ‘रसद’ भोजन-सामग्री अथवा आवश्यक आपूर्ति का उपयुक्त व्यापक अर्थ देता है।
- source_word: ὁμοίαν αὐτοῖς
  choice: उनके जैसी
  rationale: यह साथ की वस्तुओं से की गई तुलना को संक्षिप्त और स्पष्ट रूप में सुरक्षित रखता है।
- source_word: ἐκ τοῦ ἔθνους σου
  choice: तुम्हारी जाति का
  rationale: ἔθνος यहाँ जूडिथ के जातीय समुदाय को सूचित करता है; ‘जाति’ आधुनिक राजनीतिक राष्ट्र की अपेक्षा इस जातीय अर्थ को अधिक निकटता से व्यक्त करती है।
