base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/013.yaml
  text: And Bagoas went out from the presence of Holofernes and went in to her and said[a], “Let this beautiful young woman not hesitate to come to my lord, to be honored before him, and to drink wine with us in gladness[b], and to become on this day like one of the daughters of the Assyrians who stand in the house of Nebuchadnezzar.”
translation:
  language: hi
  text: और बगोआस होलोफेरनेस के सामने से निकलकर उसके पास गया और बोला, “यह सुन्दर युवती[a] मेरे स्वामी के पास आने में संकोच न करे, ताकि वह उनके सामने सम्मान पाए, हमारे साथ आनन्दपूर्वक दाखमधु पीए, और आज अश्शूरियों की उन बेटियों में से एक जैसी बने, जो नबूकदनेस्सर के भवन में उपस्थित रहती हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह सुन्दर दासी”; यूनानी शब्द युवती, सेविका या दासी को सूचित कर सकता है, पर यहाँ यह चापलूसी भरे सम्बोधन के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “जो नबूकदनेस्सर के भवन में सेवा के लिए उपस्थित रहती हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἀπὸ προσώπου
  choice: होलोफेरनेस के सामने से निकलकर
  rationale: यूनानी मुहावरा किसी की उपस्थिति से चले जाने को दर्शाता है; ‘के सामने से’ दरबारी परिवेश और स्रोत की शाब्दिक छवि दोनों बनाए रखता है।
- source_word: εἰσῆλθεν πρὸς αὐτήν
  choice: उसके पास भीतर गया
  rationale: यह स्थानगत गति का वर्णन है। ‘भीतर गया’ कथा-क्रम को सुरक्षित रखता है और अनावश्यक यौनार्थ से बचता है।
- source_word: Μὴ ὀκνήσῃς
  choice: संकोच न करे
  rationale: ὀκνέω यहाँ हिचकिचाने या अनिच्छा दिखाने के अर्थ में है; हिन्दी में ‘संकोच न करे’ आमंत्रण के प्रसंग में स्वाभाविक है।
- source_word: ἡ παιδίσκη ἡ καλὴ
  choice: यह सुन्दर युवती
  rationale: παιδίσκη युवती के साथ-साथ दासी भी सूचित कर सकता है, पर यहाँ यह चापलूसी भरा सम्बोधन है। ‘युवती’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: δόξασθῆναι κατὰ πρόσωπον αὐτοῦ
  choice: उनके सामने सम्मान पाने
  rationale: यहाँ δοξάζω धार्मिक महिमा नहीं, होलोफेरनेस की उपस्थिति में प्राप्त होने वाला सम्मान बताता है।
- source_word: πίεσαι μεθʼ ἡμῶν εἰς εὐφροσύνην οἴνου
  choice: हमारे साथ आनन्दपूर्वक दाखमधु पीने
  rationale: वाक्यांश दाखमधु से जुड़ी उत्सवी प्रसन्नता व्यक्त करता है। ‘आनन्दपूर्वक दाखमधु पीने’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: γενηθήναι ... ὡς θυγάτηρ μία τῶν υἱῶν Ἀσσούρ
  choice: अश्शूरियों की ... बेटियों में से एक जैसी बनने
  rationale: ‘अश्शूर के पुत्रों’ यूनानी जातीय अभिव्यक्ति है, पर स्त्रीवाचक θυγάτηρ के साथ हिन्दी में उसका अभिप्राय स्वाभाविक रूप से ‘अश्शूरियों की बेटियों में से एक’ है। γενηθήναι में नई स्थिति या भूमिका ग्रहण करने का भाव ‘बनने’ से आता है।
- source_word: αἱ παρεστηκυῖαι ἐν οἴκῳ Ναβουχοδονόσορ
  choice: जो नबूकदनेस्सर के भवन में उपस्थित रहती हैं
  rationale: παρεστηκυῖαι का मूल भाव पास खड़े रहने या उपस्थित होकर सेवा देने का है। ‘उपस्थित रहती हैं’ भूमिका को अत्यधिक निश्चित किए बिना दरबारी आशय बनाए रखता है।
theological_decisions:
- issue: मानवीय दरबारी प्रसंग में κύριος का अनुवाद
  choice: मेरे स्वामी
  alternative: मेरे प्रभु
  rationale: यहाँ वक्ता परमेश्वर नहीं, होलोफेरनेस को संबोधित करता है। ‘मेरे स्वामी’ सामाजिक पदानुक्रम स्पष्ट करता है और ईश्वरीय उपाधि का भ्रम नहीं होने देता।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। दरबारी भाषा के लिए ‘मेरे स्वामी’, ‘सम्मान पाने’ और ‘उपस्थित रहती हैं’ चुने गए हैं। नामों के रूप: बगोआस, होलोफेरनेस, अश्शूरी और नबूकदनेस्सर। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।'
