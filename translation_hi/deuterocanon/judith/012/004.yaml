base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/004.yaml
  text: And Judith said to him[a], “As your life lives, my lord[c][b], your servant will not use up what is with me until he has accomplished by my hand what he has planned.”
translation:
  language: hi
  text: तब यहूदीत ने उससे कहा, “हे मेरे स्वामी, आपके जीवन की शपथ,[a] आपकी दासी मेरे पास जो कुछ है उसे तब तक खर्च नहीं करेगी, जब तक वह मेरे हाथ से वह पूरा न कर ले जिसकी उसने योजना बनाई है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आपका प्राण जीवित है”; यह शपथ खाने की अभिव्यक्ति है, अर्थात “जैसे निश्चय ही आप जीवित हैं।”
    reason: lexical_alternative
  - marker: c
    text: “वह” और “उसने” का कर्ता यूनानी में अनुक्त है; प्रसंग में इससे सबसे स्वाभाविक रूप से परमेश्वर अभिप्रेत है, जो यहूदीत के हाथ से अपनी योजना पूरी करेगा।
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῇ ἡ ψυχή σου
  choice: आपके जीवन की शपथ
  rationale: यह यूनानी शपथ-सूत्र का स्वाभाविक आधुनिक हिन्दी रूप है; इसका शाब्दिक अर्थ ‘आपका प्राण जीवित है’ है।
- source_word: κύριέ μου
  choice: हे मेरे स्वामी
  rationale: यह होलोफेरनेस के लिए आदरसूचक संबोधन है, परमेश्वर की उपाधि नहीं।
- source_word: ἡ δούλη σου
  choice: आपकी दासी
  rationale: विनम्र आत्म-संदर्भ में स्त्रीलिंग दास/सेविका का भाव रखता है; ‘दासी’ सामाजिक अधीनता और दरबारी विनय दोनों को संक्षेप में व्यक्त करता है।
- source_word: οὐ δαπανήσει
  choice: समाप्त नहीं करेगी
  rationale: साथ लाई वस्तुओं, विशेषतः भोजन-सामग्री, को खर्च या खपा देने का अर्थ प्रसंगानुकूल रूप से व्यक्त होता है।
- source_word: τὰ ὄντα μετʼ ἐμοῦ
  choice: अपने साथ की वस्तुएँ
  rationale: यूनानी के सामान्य और कुछ अस्पष्ट ‘जो मेरे साथ हैं’ को बनाए रखता है; प्रसंग में इससे सम्भवतः उसकी निजी भोजन-सामग्री अभिप्रेत है।
- source_word: ἕως ἄν ποιήσῃ
  choice: जब तक वह ... पूरा न कर ले
  rationale: कर्ता यूनानी में अनुक्त है; पुल्लिंग एकवचन ‘वह’ रखकर उसे मुख्य पाठ में परमेश्वर के रूप में स्पष्ट नहीं किया गया।
- source_word: ἐν χειρί μου
  choice: मेरे हाथ से
  rationale: मूल बाइबलीय अभिव्यक्ति और यहूदीत के माध्यम से कार्य होने की साधनात्मकता दोनों सुरक्षित रहती हैं।
- source_word: ἃ ἐβουλεύσατο
  choice: जिसकी उसने योजना बनाई है
  rationale: विचारपूर्वक ठहराने या योजना बनाने का अर्थ स्वाभाविक आधुनिक हिन्दी में देता है।
theological_decisions:
- issue: ποιήσῃ / ἐβουλεύσατο का अनुक्त कर्ता
  choice: मुख्य पाठ में केवल ‘वह/उसने’ रखा गया
  alternative: '‘परमेश्वर’ को स्पष्ट करना, अथवा कर्मवाच्य कहना: ‘जो ठहराया गया है वह मेरे हाथ से पूरा हो जाए’'
  rationale: यूनानी में कर्ता व्यक्त नहीं है। व्यापक प्रसंग में परमेश्वर सबसे स्वाभाविक अभिप्राय है, पर मुख्य पाठ में नाम जोड़ना मूल की अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। दरबारी आदर के लिए ‘हे मेरे स्वामी’ और विनम्र आत्म-संदर्भ के लिए ‘आपकी दासी’ रखा गया है। शपथ-सूत्र को शाब्दिक अस्वाभाविकता के बजाय हिन्दी मुहावरे में दिया गया, जबकि उसका शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
