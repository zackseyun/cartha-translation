  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘दाखमधु’ बाइबलीय संदर्भ में परिचित और स्पष्ट है। मुख्य पाठ में कारण-संबंध स्पष्ट किया गया है और पादटिप्पणी में ἀπʼ αὐτῆς के वैकल्पिक, अधिक शाब्दिक रूप दिए गए हैं।
