translation:
  language: hi
  text: और होलोफेर्नेस उसके कारण प्रसन्न हुआ, और उसने इतना अधिक दाखमधु पीया, जितना उसने जब से उसका जन्म हुआ था तब से किसी एक दिन में कभी नहीं पीया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠυφράνθη
  choice: बहुत प्रसन्न हुआ
  rationale: यह रूप उसके आनंदित या प्रसन्न हो जाने को व्यक्त करता है। हिन्दी में ‘प्रसन्न हुआ’ स्वाभाविक है; प्रसंग में तीव्रता स्पष्ट करने के लिए ‘बहुत’ रखा गया है।
- source_word: ἀπʼ αὐτῆς
  choice: उसके कारण
  rationale: 'ἀπό यहाँ स्रोत या कारण बताता है: होलोफेरनेस की प्रसन्नता का कारण जूडिथ थी। ‘उसके कारण’ यूनानी संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।'
- source_word: ἔπιεν οἶνον πολὺν σφόδρα
  choice: उसने इतनी अधिक दाखमधु पी
  rationale: πολὺν σφόδρα मात्रा पर प्रबल बल देता है। ‘इतनी अधिक’ आगे आने वाली तुलना से सहजता से जुड़ता और अत्यधिक मात्रा प्रकट करता है।
- source_word: ὅσον οὐκ ἔπιεν πώποτε
  choice: जितनी उसने ... कभी नहीं पी थी
  rationale: यह अनुवाद ὅσον द्वारा व्यक्त मात्रा की तुलना और οὐκ ... πώποτε के निषेध—‘कभी नहीं’—दोनों को बनाए रखता है।
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: किसी एक दिन में
  rationale: यह पद एक ही दिन की समयावधि पर बल देता है; ‘किसी एक दिन में’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἀφʼ οὗ ἐγεννήθη
  choice: अपने जन्म से लेकर उस दिन तक
  rationale: यूनानी पद उसके जन्म से उस अवसर तक की पूरी जीवनावधि बताता है। हिन्दी में यह रूप तुलना का समय-संबंध स्पष्ट करता है।
