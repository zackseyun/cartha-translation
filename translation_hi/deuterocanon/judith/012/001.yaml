  yaml_path: translation/deuterocanon/judith/012/001.yaml
  text: And he ordered that she be brought in where his silverware was kept[b][a], and he directed that food be prepared for her from his own dishes and that she drink from his wine.
translation:
  language: hi
  text: तब उसने आदेश दिया कि उसे उस जगह ले जाया जाए जहाँ उसके चाँदी के पात्र रखे जाते थे[a], और उसने निर्देश दिया कि उसके अपने पकवानों में से उसके लिए भोजन परोसा जाए[b] और वह उसकी दाखमधु में से पिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी चाँदी की वस्तुएँ।” यूनानी शब्द सामान्य रूप से चाँदी से बनी वस्तुओं को भी दर्शा सकता है; भोज के इस प्रसंग में पात्र अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “उसके पकवानों में से उसके लिए भोजन बिछाया जाए।” यहाँ प्रयुक्त यूनानी शब्द भोजन को सामने सजाकर रखने या परोसने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: उसने आदेश दिया
  rationale: यह क्रिया अधिकारपूर्वक आज्ञा देने का भाव रखती है; ‘आदेश दिया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: εἰσαγαγεῖν αὐτήν
  choice: उसे ... ले जाया जाए
  rationale: आश्रित infinitive का भाव है कि सेवक उसे भीतर या निर्दिष्ट स्थान पर ले जाएँ; हिन्दी का कर्मवाच्य इसे सहज रूप से व्यक्त करता है।
- source_word: οὗ ἔτιθετο
  choice: उस जगह ... रखे जाते थे
  rationale: अपूर्ण काल यहाँ वस्तुओं को नियमित रूप से रखे जाने या भंडारित होने का संकेत देता है।
- source_word: τὰ ἀργυρώματα αὐτοῦ
  choice: उसके चाँदी के पात्र
  rationale: ἀργυρώματα चाँदी की वस्तुओं को दर्शाता है; भोज के प्रसंग में ‘चाँदी के पात्र’ उपयुक्त है, पर व्यापक अर्थ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: συνέταξεν
  choice: उसने निर्देश दिया
  rationale: यह आगे की अधिकृत व्यवस्था या हिदायत को व्यक्त करता है; पहले आए ‘आदेश दिया’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: καταστρῶσαι
  choice: परोसा जाए
  rationale: मूल क्रिया बिछाने या सामने सजाकर रखने का भाव देती है; भोजन के संदर्भ में ‘परोसा जाए’ स्वाभाविक हिन्दी है।
- source_word: ἀπὸ τῶν ὀψοποιημάτων αὐτοῦ
  choice: उसके अपने पकवानों में से
  rationale: ὀψοποιήματα तैयार किए हुए व्यंजनों या पकवानों को दर्शाता है और αὐτοῦ उसके निजी भोजन-सामान पर बल देता है।
- source_word: τοῦ οἴνου αὐτοῦ πινεῖν
  choice: वह उसकी दाखमधु में से पिए
  rationale: यह उसके अपने मदिरा-भंडार में से पीने का अर्थ देता है; ‘में से’ सहभागी मात्रा के भाव को बनाए रखता है।
