  yaml_path: translation/deuterocanon/judith/012/002.yaml
  text: And Judith said[a], “I will not eat from them, lest it become a stumbling block; instead, provision will be made for me from the things that have accompanied me.”
translation:
  language: hi
  text: तब यहूदीत ने कहा, “मैं इनमें से नहीं खाऊँगी, कहीं यह ठोकर का कारण न बन जाए[a]। इसके बजाय, मेरे साथ आई हुई वस्तुओं में से मेरी व्यवस्था की जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ठेस पहुँचाने का कारण,” “बाधा,” अथवा “पतन का कारण।” यूनानी शब्द σκάνδαλον ठोकर या ठेस का कारण, बाधा, अथवा पतन का कारण दर्शा सकता है।
