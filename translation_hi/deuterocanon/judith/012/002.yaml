  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। स्त्री वक्ता के कारण ‘खाऊँगी’ और ‘लाई हूँ’ स्त्रीलिंग में हैं। ‘यहूदीत’ नाम यूनानी Ἰουδείθ का प्रचलित हिन्दी लिप्यंतरण है।
