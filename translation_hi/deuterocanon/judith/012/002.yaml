lexical_decisions:
- source_word: Οὐ φάγομαι ἐξ αὐτῶν
  choice: मैं इनमें से कुछ नहीं खाऊँगी
  rationale: भविष्यकालीन निषेध को स्पष्ट अस्वीकार के रूप में रखा गया है। ἐξ αὐτῶν का अंशवाचक भाव ‘इनमें से’ से सुरक्षित रहता है और संदर्भ में पहले प्रस्तुत भोज्य पदार्थों की ओर संकेत करता है।
- source_word: ἵνα μὴ γένηται σκάνδαλον
  choice: कहीं यह मेरे लिए ठोकर का कारण न बन जाए
  rationale: ‘कहीं ... न’ आशंकित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है। ‘ठोकर का कारण’ σκάνδαλον की रूपकात्मक नैतिक-धार्मिक शक्ति को बनाए रखता है; ‘मेरे लिए’ संदर्भगत अर्थ को स्पष्ट करता है, यद्यपि यूनानी में यह अप्रकट है।
- source_word: ἀλλʼ
  choice: इसके बजाय
  rationale: प्रस्तुत भोजन के निषेध और अपने साथ लाई सामग्री से व्यवस्था किए जाने के बीच स्पष्ट प्रतिकूल-विकल्पात्मक संबंध व्यक्त करता है।
- source_word: ἐκ τῶν ἠκολουθηκότων μοι
  choice: जो सामग्री मैं अपने साथ लाई हूँ, उसी में से
  rationale: शाब्दिक रूप से ‘जो वस्तुएँ मेरे साथ आई हैं’ का संकेत है। हिन्दी में ‘अपने साथ लाई सामग्री’ स्वाभाविक है और इसे केवल ‘भोजन’ कहकर मूल से अधिक संकीर्ण नहीं करता।
- source_word: χορηγηθήσεται
  choice: मुझे दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य को सुरक्षित रखते हुए आपूर्ति अथवा व्यवस्था का भाव सरल आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: यहूदीत के निषेध में σκάνδαλον का अर्थ
  choice: ठोकर का कारण
  alternative: अपराध; बाधा; पतन का कारण
  rationale: यह पद केवल सामाजिक अपमान का संकेत नहीं देता, बल्कि नैतिक अथवा धार्मिक चूक का कारण भी बता सकता है। रूपक को बनाए रखने से मूल की अर्थगत व्यापकता और तनाव सुरक्षित रहता है।
