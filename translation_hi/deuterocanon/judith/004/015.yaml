base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/015.yaml
  text: And Joakim the high priest[a], and all who stood before the Lord—the priests and those ministering to the Lord, with sackcloth girded around their waists—were offering the regular whole burnt offering, and the prayers, and the freewill gifts of the people[b],
translation:
  language: hi
  text: और महायाजक योआकीम और वे सभी जो प्रभु के सामने उपस्थित थे—अर्थात याजक और प्रभु की सेवा करनेवाले—अपनी कमर पर टाट बाँधे हुए, नियमित सर्वांग होमबलि[a], लोगों की प्रार्थनाएँ[b] और स्वेच्छा-भेंटें चढ़ा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निरंतर सर्वांग होमबलि।” यूनानी पद नियमित या लगातार चढ़ाई जाने वाली भेंट का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “लोगों की मन्नतें” अथवा “मन्नत की भेंटें।” यूनानी शब्द का अर्थ प्रार्थनाएँ भी हो सकता है और, बलिदानी प्रसंग में, मन्नतें भी।
    reason: genuine_ambiguity
lexical_decisions:
- source_word: Ἰωακεὶμ
  choice: योआकीम
  rationale: यूनानी नाम के स्वरूप का देवनागरी लिप्यंतरण; यह अनावश्यक रूप से किसी भिन्न इब्रानी रूप को आरोपित नहीं करता।
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: महायाजक
  rationale: यह इस पद का प्रचलित, स्वाभाविक और सटीक हिन्दी नाम है।
- source_word: οἱ παρεστηκότες ἐνώπιον Κυρίου
  choice: वे सभी जो प्रभु के सामने उपस्थित थे
  rationale: παρίστημι के उपस्थिति और सेवा में खड़े रहने के भाव को स्पष्ट आधुनिक हिन्दी में रखता है।
- source_word: Κυρίου / Κυρίῳ
  choice: प्रभु
  rationale: यूनानी κύριος के धार्मिक संबोधन को सुरक्षित रखता है, बिना मूल पाठ में न लिखे गए इब्रानी परमेश्वर-नाम को जोड़ने के।
- source_word: οἱ λειτουργοῦντες Κυρίῳ
  choice: प्रभु की सेवा करनेवाले
  rationale: मन्दिर-संबंधी पवित्र सेवा का भाव देता है और सामान्य पाठक के लिए स्वाभाविक है।
- source_word: σάκκους περιεζωσμένοι τὰς ὀσφύας αὐτῶν
  choice: अपनी कमर पर टाट बाँधे हुए
  rationale: शोक और दीनता के ठोस बाहरी चिह्न को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσέφερον
  choice: चढ़ा रहे थे
  rationale: अपूर्ण भूतकाल की जारी क्रिया और बलिदान चढ़ाने के धार्मिक प्रसंग—दोनों को व्यक्त करता है।
- source_word: τὴν ὁλοκαύτωσιν
  choice: सर्वांग होमबलि
  rationale: पूरी तरह जलाए जाने वाले बलिदान के अर्थ को संक्षिप्त धार्मिक हिन्दी में सुरक्षित रखता है।
- source_word: τοῦ ἐνδελεχισμοῦ
  choice: नियमित
  rationale: निरंतर अथवा नियमित रूप से चढ़ाई जाने वाली भेंट का भाव देता है; ‘प्रतिदिन’ कहना मूल से अधिक विशिष्ट होता।
- source_word: τὰς εὐχὰς
  choice: प्रार्थनाएँ
  rationale: εὐχή का सीधा और प्रसंग-संगत अर्थ लिया गया है; ‘मन्नतें’ भी संभव है, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὰ ἑκούσια δόματα
  choice: स्वेच्छा-भेंटें
  rationale: भेंटों के स्वेच्छिक स्वरूप और उपासना-संबंधी प्रसंग दोनों को स्पष्ट करता है।
theological_decisions:
- issue: यूनानी κύριος का ईश्वर-संबंधी अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: स्रोत यूनानी पाठ में κύριος है; ‘प्रभु’ उसी उपाधि को रखता है और पाठ में अनुपस्थित इब्रानी नाम को नहीं जोड़ता।
- issue: बलिदानी प्रसंग में εὐχαί का अर्थ
  choice: प्रार्थनाएँ
  alternative: मन्नतें अथवा मन्नत की भेंटें
  rationale: शब्द में प्रार्थना और मन्नत दोनों अर्थ संभव हैं। मुख्य पाठ में सामान्य प्रत्यक्ष अर्थ रखा गया है और वास्तविक सांस्कृतिक-धार्मिक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘टाट’, ‘महायाजक’, ‘होमबलि’ और ‘स्वेच्छा-भेंटें’ जैसे परिचित बाइबलीय शब्द प्रयुक्त हैं, पर वाक्य-विन्यास सहज हिन्दी का है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
