  text: उसने उनसे कहा कि वे पहाड़ी प्रदेश के चढ़ाई-मार्गों[a] को अपने अधिकार में कर लें, क्योंकि उन्हीं से होकर यहूदिया में प्रवेश किया जाता था। जो ऊपर चढ़कर आते, उन्हें रोकना आसान था, क्योंकि पहुँचने का मार्ग इतना सँकरा था कि सभी पुरुष एक साथ केवल दो-दो की पंक्ति में ही आगे बढ़ सकते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “पहाड़ी प्रदेश की चढ़ाइयाँ”; आशय पहाड़ी इलाके में ऊपर जाने वाली राहों या दर्रों से है।
    reason: lexical_alternative
  - marker: b
    text: अन्तिम यूनानी वाक्यांश संक्षिप्त और कठिन है। यहाँ उसका अर्थ यह लिया गया है कि मार्ग इतना सँकरा था कि पुरुष केवल दो-दो की पंक्ति में आगे बढ़ सकते थे।
    reason: alternative_reading
