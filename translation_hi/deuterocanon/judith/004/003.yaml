  text: for they had only recently come up from the captivity[a], and all the people of Judea had only recently been gathered together[c][b], and the vessels and the altar and the house had been consecrated from the defilement.
translation:
  language: hi
  text: क्योंकि वे कुछ ही समय पहले बंदीवास[a] से ऊपर आए थे, और यहूदिया के सारे लोग हाल ही में एकत्र किए गए थे, और पात्र, वेदी और भवन[b] अपवित्रता से निकालकर पवित्र किए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्वासन।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भवन” से आशय मन्दिर है।
    reason: cultural_note
lexical_decisions:
- source_word: προσφάτως
  choice: कुछ ही समय पहले
  rationale: यह स्वाभाविक आधुनिक हिन्दी में समय की निकटता और यूनानी क्रियाविशेषण के बल, दोनों को व्यक्त करता है।
- source_word: ἀναβεβηκότες
  choice: ऊपर आए थे
  rationale: पूर्ण कृदन्त के पूर्ववर्ती परिणाम और यहूदिया की ओर ‘ऊपर आने’ की भौगोलिक अभिव्यक्ति को सुरक्षित रखता है; केवल ‘लौटे थे’ कहना स्थानगत बारीकी खो देता।
- source_word: αἰχμαλωσίας
  choice: बंधुआई
  rationale: यह ज्ञात ऐतिहासिक बन्दी अवस्था को व्यक्त करता है और निर्वासन की अपेक्षा मूल शब्द के बन्दीपन वाले अर्थ के अधिक निकट है।
- source_word: νεωστὶ
  choice: हाल ही में
  rationale: दूसरी बार आए निकट-अतीत के संकेत को स्पष्ट करता है, पर हिन्दी में अनावश्यक शब्दशः पुनरावृत्ति से बचता है।
- source_word: συνελέλεκτο
  choice: फिर से एकत्र हुए थे
  rationale: मध्य/निष्क्रिय पूर्णभूत रूप से बनी सामुदायिक एकत्रता को सहज हिन्दी में व्यक्त करता है; ‘फिर से’ ऐतिहासिक पुनर्संग्रह का प्रसंग स्पष्ट करता है।
- source_word: σκεύη
  choice: पात्र
  rationale: मन्दिर के उपासना-संबंधी उपकरणों के लिए संक्षिप्त और प्रचलित बाइबलीय हिन्दी शब्द है; ‘पवित्र’ विशेषण मूल में नहीं जोड़ा गया।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: बलिदान की वेदी के लिए मानक और स्पष्ट हिन्दी पर्याय है।
- source_word: ὁ οἶκος
  choice: भवन
  rationale: मूल के ‘घर/भवन’ रूपक को बनाए रखता है; प्रसंग में इसका अभिप्राय मन्दिर है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: βεβηλώσεως
  choice: अपवित्रता
  rationale: किसी पवित्र वस्तु या स्थान को अपवित्र कर दिए जाने की अवस्था को सहज और धार्मिक रूप से तटस्थ हिन्दी में व्यक्त करता है।
- source_word: ἡγιασμένα
  choice: पवित्र किए गए थे
  rationale: पूर्ण निष्क्रिय भाव और पुनः पवित्र अवस्था में स्थापित किए जाने को स्पष्ट रखता है; ‘अभिषिक्त’ जैसे अधिक विशिष्ट अनुष्ठानिक अर्थ से बचता है।
- source_word: ἐκ
  choice: से निकालकर
  rationale: सिर्फ कालक्रमसूचक ‘के बाद’ के बजाय अपवित्र अवस्था से बाहर लाकर पवित्र किए जाने के स्रोत/निर्गमन संबंध को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मन्दिर और उसकी वस्तुओं की अपवित्रता के बाद पुनः पवित्रीकरण
  choice: अपवित्रता से निकालकर पवित्र किए गए थे
  alternative: अपवित्र किए जाने के बाद फिर पवित्र किए गए थे
  rationale: ἐκ को केवल कालक्रम में बदलने के बजाय अपवित्र अवस्था से पुनर्स्थापन का संबंध बनाए रखा गया है। साथ ही किसी विशिष्ट शुद्धिकरण-विधि का विवरण नहीं जोड़ा गया।
- issue: ὁ οἶκος का मन्दिर-संदर्भ
  choice: भवन
  alternative: मन्दिर
  rationale: मूल का शाब्दिक और श्रद्धापूर्ण ‘घर/भवन’ प्रयोग मुख्य पाठ में सुरक्षित है, जबकि पादटिप्पणी उसके स्पष्ट संदर्भ को बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किंतु सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में दो निकट-अतीत सूचकों का बल बनाए रखा गया है। ‘बंधुआई’ और ‘अपवित्रता’ जैसे शब्द धार्मिक-ऐतिहासिक प्रसंग के अनुकूल हैं; मुख्य पाठ में मूल की स्थानगत और पुनर्स्थापन संबंधी बारीकियाँ यथासंभव सुरक्षित हैं।
