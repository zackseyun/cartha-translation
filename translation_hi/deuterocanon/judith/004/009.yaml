base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/009.yaml
  text: And the sons of Israel did as Joakim the high priest and the council of the whole people of Israel[a], who sat in Jerusalem[c][b], instructed them.
translation:
  language: hi
  text: और इस्राएलियों[a] ने वैसा ही किया, जैसा महायाजक योआकीम और इस्राएल की सारी प्रजा की पुरनियों की परिषद ने—जो यरूशलेम में बैठे थे[b]—उन्हें निर्देश दिया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के पुत्र’; इसका अनुवाद ‘इस्राएल की संतान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘जो यरूशलेम में बैठे थे’; यह वाक्यांश महायाजक और परिषद दोनों को, अथवा परिषद के सदस्यों को, सूचित कर सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘आदेश दिया था’ अथवा ‘आज्ञा दी थी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में सामूहिक जातीय पहचान के लिए ‘इस्राएली’ अधिक स्वाभाविक और स्पष्ट है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐποίησαν ... καθὰ
  choice: वैसा ही किया, जैसा
  rationale: यह हिन्दी की स्वाभाविक सहसंबंधी रचना है और आदेश के अनुरूप कार्य करने का यूनानी भाव स्पष्ट रूप से व्यक्त करती है।
- source_word: συνέταξεν
  choice: निर्देश दिया
  rationale: क्रिया में अधिकारपूर्वक निर्देश देने या आदेश देने का भाव है। ‘निर्देश दिया’ अर्थ की व्यापकता बनाए रखता है, जबकि अधिक प्रबल विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: Ἰωακεὶμ
  choice: योआकीम
  rationale: यह रूप यूनानी नाम Ἰωακεὶμ का देवनागरी में निकट और हिन्दी-पाठक के लिए उच्चारणयोग्य लिप्यंतरण है।
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: महायाजक
  rationale: यह यहूदी धार्मिक पद के लिए मानक, संक्षिप्त और स्वाभाविक हिन्दी पद है।
- source_word: ἡ γερουσία
  choice: पुरनियों की परिषद
  rationale: γερουσία बुज़ुर्ग अगुओं की परिषद को दर्शाता है। ‘परिषद’ अकेले स्पष्ट है, पर ‘पुरनियों की’ जोड़ने से संस्था की प्रकृति भी व्यक्त होती है।
- source_word: παντὸς δήμου Ἰσραήλ
  choice: इस्राएल की सारी प्रजा की
  rationale: δῆμος यहाँ लोगों या समुदाय को दर्शाता है; ‘सारी प्रजा’ उसके व्यापक सामूहिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐκάθηντο ἐν Ἰερουσαλήμ
  choice: जो यरूशलेम में बैठे थे
  rationale: यह यूनानी के बैठनेवाले क्रियार्थ को निकटता से रखता है और बहुवचन संबंधवाचक उपवाक्य की संदर्भगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
theological_decisions:
- issue: इस्राएल का सामूहिक संबोधन
  choice: इस्राएली
  alternative: इस्राएल के पुत्र / इस्राएल की संतान
  rationale: ‘इस्राएली’ आधुनिक हिन्दी में सहज है और उसी सामूहिक समुदाय को दर्शाता है; स्रोत की वाचा-संबंधी पारिवारिक अभिव्यक्ति को पादटिप्पणी में रखा गया है।
- issue: यरूशलेम में बैठनेवालों की पहचान
  choice: संबंधवाचक उपवाक्य को महायाजक और परिषद के संयुक्त उल्लेख के बाद रखना
  alternative: इसे केवल परिषद के सदस्यों से जोड़ना
  rationale: यूनानी में οἱ ἐκάθηντο पुल्लिंग बहुवचन है, जबकि निकटतम संज्ञा γερουσία स्त्रीलिंग एकवचन है। इसलिए इसका व्याकरणिक संबंध पूरी नेतृत्व-मंडली अथवा परिषद के निहित सदस्यों से हो सकता है; पाठ इसे निर्णायक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरनियों की परिषद’ प्राचीन नेतृत्व-संस्था को स्पष्ट करता है, जबकि ‘बैठे थे’ स्रोत की संभावित औपचारिक तथा स्थानगत दोनों छायाओं को खुला रखता है।
