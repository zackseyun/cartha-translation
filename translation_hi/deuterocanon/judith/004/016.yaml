  yaml_path: translation/deuterocanon/judith/004/016.yaml
  text: And there was ashes on their turbans, and they were crying out to the Lord with all their strength, that he might look with favor on the whole house of Israel.
translation:
  language: hi
  text: उनकी पगड़ियों पर राख पड़ी थी, और वे अपनी पूरी शक्ति से प्रभु को पुकार रहे थे कि वह इस्राएल के समूचे घराने पर कृपादृष्टि करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σποδὸς
  choice: राख
  rationale: यूनानी एकवचन सामूहिक अर्थ में है; हिन्दी में ‘राख’ स्वाभाविक अगणनीय संज्ञा है और शोक तथा दीनता के प्रतीक को यथावत रखती है।
- source_word: κιδάρεις
  choice: पगड़ियाँ
  rationale: यह सिर पर बाँधे जाने वाले आवरणों को दर्शाता है; आधुनिक हिन्दी में ‘पगड़ी’ स्पष्ट और सहज शब्द है।
- source_word: ἐβόων
  choice: पुकार रहे थे
  rationale: अपूर्ण काल की निरंतर क्रिया और ऊँची, व्याकुल प्रार्थना—दोनों का भाव व्यक्त होता है।
- source_word: ἐκ πάσης δυνάμεως
  choice: अपनी पूरी शक्ति से
  rationale: मूल के बलपूर्वक और पूर्ण मनोयोग से पुकारने के भाव को सीधे सुरक्षित रखता है।
- source_word: ἐπισκέψασθαι ... εἰς ἀγαθὸν
  choice: कृपादृष्टि करे
  rationale: ἐπισκέπτομαι के ‘ध्यान देकर हस्तक्षेप/देखभाल करना’ और εἰς ἀγαθόν के हितकारी आशय को स्वाभाविक हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: πᾶν οἶκον Ἰσραήλ
  choice: इस्राएल के समूचे घराने
  rationale: ‘घराना’ सामूहिक वाचा-समुदाय के रूपक को बनाए रखता है; ‘समूचे’ πᾶν की व्यापकता व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय अनुग्रह के लिए प्रार्थना
  choice: कि वह ... कृपादृष्टि करे
  alternative: कि वह ... का भला करने के लिए सुधि ले
  rationale: मूल में उद्देश्य/आशय है कि प्रभु इस्राएल की ओर हित के लिए ध्यान दे। ‘कृपादृष्टि’ इसे संक्षेप और गरिमा से कहती है, बिना यह निर्धारित किए कि अपेक्षित हस्तक्षेप किस विशिष्ट रूप में होगा।
- issue: इस्राएल की सामूहिक पहचान
  choice: इस्राएल के समूचे घराने
  alternative: इस्राएल के सारे परिवार
  rationale: οἶκος Ἰσραήλ एक स्थापित सामूहिक रूपक है; ‘घराना’ उसे किसी एक जैविक परिवार तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की प्रार्थनात्मक तीव्रता तथा शोक के सांकेतिक दृश्य को बनाए रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं है।
