base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/014.yaml
  text: And the Lord heard their voice and looked upon their affliction[b][a], and the people were fasting for many days throughout all Judea and Jerusalem before the holy things of the Lord Almighty.
translation:
  language: hi
  text: और प्रभु ने उनकी आवाज़[a] सुनी और उनके संकट पर दृष्टि डाली। सारी यहूदिया और यरूशलेम में लोग बहुत दिनों तक सर्वशक्तिमान प्रभु की पवित्र वस्तुओं[b] के सामने उपवास करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी पुकार’। यूनानी में शाब्दिक रूप से ‘उनकी आवाज़’ है, पर प्रार्थना और संकट के इस संदर्भ में इसका अर्थ सहायता के लिए की गई पुकार भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पवित्रस्थान के सामने’ अथवा ‘पवित्र स्थानों के सामने’। यूनानी में ‘पवित्र’ बहुवचन रूप में है; इसका संकेत सर्वशक्तिमान प्रभु से संबंधित पवित्र वस्तुओं या पवित्र परिसरों की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: सुनी
  rationale: यह क्रिया सुनने या ध्यान देकर सुनने को व्यक्त करती है और प्रार्थना के उत्तर की अनकही संभावना रखती है; ‘सुनी’ उस संभावना को बिना स्पष्ट हस्तक्षेप में बदल दिए स्वाभाविक रूप से व्यक्त करती है।
- source_word: τῆς φωνῆς αὐτῶν
  choice: उनकी आवाज़
  rationale: φωνή का सीधा अर्थ ‘आवाज़’ है। संदर्भ में ‘पुकार’ संभव है, पर मुख्य पाठ में अधिक पारदर्शी अर्थ रखा गया है और संदर्भगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐπεῖδεν
  choice: दृष्टि डाली
  rationale: यह केवल देखने से अधिक ध्यानपूर्वक किसी की दशा की ओर देखने का भाव दे सकता है; ‘दृष्टि डाली’ इस भाव को गरिमापूर्ण और स्वाभाविक हिन्दी में रखता है।
- source_word: τὴν θλίψιν αὐτῶν
  choice: उनके संकट पर
  rationale: θλῖψις दबाव, कष्ट या विपत्ति की दशा बताता है। ‘संकट’ यहाँ सामूहिक दुःख और आसन्न खतरे दोनों के अनुकूल है।
- source_word: ἦν ὁ λαὸς νηστεύων
  choice: लोग ... उपवास करते रहे
  rationale: परिप्रयुक्त अपूर्णकाल जारी क्रिया बताता है; ‘करते रहे’ उसकी निरंतरता स्पष्ट करता है।
- source_word: ἡμέρας πλείους
  choice: बहुत दिनों तक
  rationale: यह वाक्यांश एक विस्तृत अवधि दर्शाता है; हिन्दी में ‘बहुत दिनों तक’ सहज और स्पष्ट है।
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: सारी यहूदिया और यरूशलेम में
  rationale: πάσῃ से क्षेत्र की व्यापकता पर बल मिलता है; यह अनुवाद उस विस्तार को बनाए रखता है।
- source_word: κατὰ πρόσωπον
  choice: के सामने
  rationale: इस मुहावरे का अर्थ ‘के सामने’ या ‘की उपस्थिति में’ है; cultic प्रसंग में ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: τῶν ἁγίων
  choice: पवित्र वस्तुओं
  rationale: बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘पवित्र वस्तुओं’ मूल के बहुवचन और उसकी अनिश्चितता को बनाए रखता है, जबकि ‘पवित्रस्थान’ अधिक व्याख्यात्मक होगा।
- source_word: Κυρίου Παντοκράτορος
  choice: सर्वशक्तिमान प्रभु
  rationale: यह संयुक्त ईश्वरीय उपाधि है; ‘सर्वशक्तिमान प्रभु’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और परंपरागत अर्थ के अनुरूप है।
theological_decisions:
- issue: κύριος का ईश्वरीय उपाधि के रूप में अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में κύριος परमेश्वर की उपाधि है। ‘प्रभु’ उस धार्मिक आशय को बनाए रखता है; ‘स्वामी’ उसे अनावश्यक रूप से सामान्य बना सकता है।
- issue: τῶν ἁγίων का cultic आशय
  choice: पवित्र वस्तुओं
  alternative: पवित्रस्थान / पवित्र स्थानों
  rationale: यूनानी रूप बहुवचन है और उसका संकेत पवित्र वस्तुओं, पवित्र परिसरों या व्यापक पवित्र व्यवस्था की ओर हो सकता है। मुख्य पाठ में बहुवचन ‘पवित्र वस्तुओं’ रखकर संदर्भ को किसी एक संस्थागत अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है, जिसमें साधारण पाठक के लिए स्पष्टता के साथ बाइबलीय गरिमा बनी रहे। ‘दृष्टि डाली’, ‘उपवास करते रहे’ और ‘के सामने’ स्वाभाविक हिन्दी देते हैं; मूल की cultic अस्पष्टता को मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
