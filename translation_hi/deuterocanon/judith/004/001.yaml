base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/001.yaml
  text: And the sons of Israel who lived in Judea heard all that Holofernes[a], the commander-in-chief of King Nebuchadnezzar of the Assyrians, had done to the nations[b], and how he had plundered all their sanctuaries and given them over to destruction.
translation:
  language: hi
  text: यहूदिया में रहनेवाले इस्राएल के पुत्रों[a] ने वह सब सुना जो अश्शूरियों के राजा नबूकदनेस्सर के प्रधान सेनापति होलोफेरनेस ने जातियों के साथ किया था, और यह भी कि उसने उनके सभी पवित्र स्थानों[b] को कैसे लूटा और उन्हें विनाश के हवाले कर दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल की संतान।” यूनानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “मंदिरों” अथवा “पवित्र वस्तुओं।” यूनानी शब्द पवित्र स्थानों या पवित्र वस्तुओं—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी पदबंध का जातीय-वाचायी और वाचा-संबंधी मुहावरा औपचारिक रूप से सुरक्षित रहता है। आधुनिक हिन्दी में यह बोधगम्य है; अधिक सहज विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: οἱ κατοικοῦντες ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया में रहनेवाले
  rationale: κατοικοῦντες के निवास करने के निरंतर भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντα ὅσα ἐποίησεν
  choice: वह सब ... जो ... किया था
  rationale: πάντα ὅσα की व्यापकता बनाए रखता है और पूर्वकालिक घटना के लिए हिन्दी में स्वाभाविक पूर्ण भूतकाल का प्रयोग करता है।
- source_word: ὁ ἀρχιστράτηγος
  choice: प्रधान सेनापति
  rationale: यह पद केवल सामान्य सेनापति नहीं, बल्कि सर्वोच्च सैन्य अधिकारी को दर्शाता है; ‘प्रधान सेनापति’ सटीक और प्रचलित हिन्दी है।
- source_word: τοῖς ἔθνεσιν
  choice: जातियों के साथ
  rationale: यहाँ ἔθνη उन विदेशी जातियों या राष्ट्रों को सूचित करता है जिन पर होलोफेरनेस ने आक्रमण किया; ‘अन्यजातियों’ जैसा बाद का धार्मिक अर्थ आरोपित नहीं किया गया।
- source_word: ἐσκύλευσεν
  choice: लूटा
  rationale: क्रिया का युद्ध-संदर्भ में लूटने या धन-संपत्ति छीन लेने का सजीव अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: τὰ ἱερὰ αὐτῶν
  choice: उनके सभी पवित्र स्थानों
  rationale: नपुंसकलिंग बहुवचन τὰ ἱερά पवित्र स्थलों, मंदिरों या पवित्र वस्तुओं को सूचित कर सकता है। संदर्भ में ‘पवित्र स्थान’ उपयुक्त है, जबकि व्यापक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἔδωκεν αὐτὰ εἰς ἀφανισμόν
  choice: उन्हें विनाश के हवाले कर दिया था
  rationale: ἔδωκεν का ‘सौंप देना’ और ἀφανισμός का पूर्ण विनाश या उजाड़—दोनों भाव सुरक्षित रहते हैं, बिना किसी विशिष्ट तकनीकी धार्मिक अवधारणा को आरोपित किए।
theological_decisions:
- issue: οἱ υἱοὶ Ἰσραήλ में जातीय और वाचा-संबंधी पहचान
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल का पुल्लिंग बहुवचन मुहावरा और उसका वाचा-संबंधी अनुनाद सुरक्षित रखा गया है। चूँकि हिन्दी में इसका शाब्दिक रूप समझ में आता है, उसे मुख्य पाठ में रखा गया और सहज सामूहिक विकल्प पादटिप्पणी में दिया गया।
- issue: τὰ ἱερὰ αὐτῶν का धार्मिक संदर्भ
  choice: उनके सभी पवित्र स्थानों
  alternative: उनके मंदिरों; उनकी पवित्र वस्तुओं
  rationale: यह चयन अन्य जातियों के उपासना-स्थलों की बात स्पष्ट करता है, पर यूनानी को केवल भवनों या केवल चल वस्तुओं तक सीमित नहीं करता। मूल की अर्थगत व्यापकता पादटिप्पणी में बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की कथात्मक गति बनाए रखते हुए यूनानी की समग्रता, सैन्य पद और पवित्र स्थलों से संबंधित अर्थगत व्यापकता सुरक्षित की गई है।
