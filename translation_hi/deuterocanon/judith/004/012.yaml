  text: And every man of Israel[a], and the women and the children, those dwelling in Jerusalem, fell on their faces before the temple, and put ashes on their heads, and spread out their sackcloth before the Lord,
translation:
  language: hi
  text: और इस्राएल का हर पुरुष, स्त्रियाँ और बच्चे—यरूशलेम में रहने वाले सभी लोग—मंदिर के सामने मुंह के बल गिर पड़े। उन्होंने अपने सिरों पर राख डाली और अपने टाट के वस्त्र प्रभु के सामने फैला दिए[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति असामान्य है। इसका अर्थ यह भी हो सकता है कि उन्होंने अपने टाट के वस्त्र प्रभु के सामने फैलाए, या टाट पहने हुए स्वयं को प्रभु के सामने फैलाया; ठीक शारीरिक क्रिया निश्चित नहीं है।
    reason: ἐξέτειναν τοὺς σάκκους αὐτῶν की असामान्य रचना और सम्भव क्रियात्मक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: इस्राएल का हर पुरुष
  rationale: ἀνήρ यहाँ पुरुष को सूचित करता है, क्योंकि आगे स्त्रियों और बच्चों का अलग उल्लेख है। ‘हर’ πᾶς के वितरणात्मक बल को बनाए रखता है।
- source_word: γυνὴ καὶ παιδία
  choice: स्त्रियाँ और बच्चे
  rationale: समन्वित सूची में γυνή का सामूहिक बहुवचन अर्थ है; ‘पत्नियाँ’ कहना वैवाहिक स्थिति को अनावश्यक रूप से निश्चित करता। παιδία के लिए सामान्य और स्वाभाविक ‘बच्चे’ उपयुक्त है।
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: यरूशलेम में रहनेवाली
  rationale: यह वाक्यांश यरूशलेम के निवासियों की पहचान करता है। हिन्दी वाक्य-विन्यास में इसे निकटस्थ ‘स्त्रियाँ और बच्चे’ से जोड़ा गया है, जबकि पूरी सूची का यरूशलेम-निवासी होना प्रसंग से स्पष्ट रहता है।
- source_word: ἔπεσον κατὰ πρόσωπον τοῦ ναοῦ
  choice: मन्दिर के सामने मुँह के बल गिर पड़े
  rationale: यह देह की दण्डवत मुद्रा और मन्दिर की ओर/उसके सामने स्थान—दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐσποδώσαντο τὰς κεφαλὰς αὐτῶν
  choice: अपने सिरों पर राख डाली
  rationale: यह शोक और विनती की रस्म में सिर पर राख रखने या डालने की ठोस क्रिया को सहज हिन्दी में बनाए रखता है।
- source_word: ἐξέτειναν τοὺς σάκκους αὐτῶν
  choice: अपने टाट के वस्त्र ... फैला दिए
  rationale: ἐκτείνω का मूल भाव फैलाना या आगे बढ़ाना है और σάκκοι यहाँ शोक में पहने जाने वाले टाट के वस्त्र हैं। अभिव्यक्ति असामान्य है, इसलिए मुख्य पाठ ठोस क्रिया देता है और पादटिप्पणी अनिश्चितता बताती है।
- source_word: κατὰ πρόσωπον Κυρίου
  choice: प्रभु के सामने
  rationale: यह परमेश्वर की उपस्थिति में होने का प्रचलित बाइबलीय मुहावरा है; ‘प्रभु के सामने’ हिन्दी में स्वाभाविक है और ‘मुख के सामने’ जैसी कृत्रिम शाब्दिकता से बचता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: इस यहूदी प्रसंग में κύριος इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘प्रभु’ इसका प्रतिष्ठित, स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: उपासना करनेवाली सभा का लिंग और आयु के अनुसार स्पष्ट उल्लेख
  choice: ‘इस्राएल का हर पुरुष ... स्त्रियाँ और बच्चे’ की सूची बनाए रखी गई।
  alternative: ‘सभी इस्राएली’
  rationale: यूनानी पाठ पुरुषों, स्त्रियों और बच्चों को स्पष्ट रूप से गिनाता है। इसे सामूहिक लिंग-निरपेक्ष पद में समेटने से मूल की आलंकारिक और सामाजिक विशिष्टता मिट जाती।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: पाठ में κύριος है और इस प्रसंग में वह इस्राएल के परमेश्वर को सूचित करता है। ‘प्रभु’ अर्थ को अनावश्यक रूप से किसी अधिक विशिष्ट पाठ-रूप में बदले बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल लेकिन गरिमापूर्ण शैली रखी गई है। ‘टाट के वस्त्र’ केवल ‘टाट’ की अपेक्षा शोक-वस्त्र का आशय स्पष्ट करता है। मूल पद आगे जारी रहने वाले वाक्य का अंश है, इसलिए अन्त में अल्पविराम रखा गया है।
