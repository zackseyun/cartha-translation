lexical_decisions:
- source_word: σφόδρα σφόδρα
  choice: बहुत ही अधिक
  rationale: यूनानी में दोहराव भय की तीव्रता पर असाधारण बल देता है; स्वाभाविक आधुनिक हिन्दी में ‘बहुत ही अधिक’ उसी प्रबलता को व्यक्त करता है।
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: उसके कारण
  rationale: यह सामी प्रभाव वाला यूनानी प्रयोग यहाँ उस व्यक्ति की उपस्थिति या उसके द्वारा उत्पन्न भय का कारण बताता है; ‘उसके कारण’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐταράχθησαν
  choice: घबरा उठे
  rationale: क्रिया गहरी व्याकुलता और अशान्ति व्यक्त करती है; ‘घबरा उठे’ प्रसंग में उस तीव्र प्रतिक्रिया को सहज हिन्दी में रखता है।
- source_word: τοῦ ναοῦ
  choice: मन्दिर
  rationale: यह यरूशलेम के पवित्र मन्दिर के लिए सामान्य और स्थापित हिन्दी पद है।
- source_word: Κυρίου θεοῦ αὐτῶν
  choice: अपने परमेश्वर प्रभु
  rationale: शब्द-क्रम को स्वाभाविक हिन्दी में रखते हुए ‘प्रभु’ और ‘परमेश्वर’ दोनों उपाधियों तथा ‘उनके’ सम्बन्ध को सुरक्षित रखा गया है।
