  text: And Joakim the high priest[a], who was in Jerusalem in those days, wrote to those living in Bethulia and Betomesthaim, which is opposite Esdraelon, facing the plain near Dothaim,
translation:
  language: hi
  text: और उन दिनों यरूशलेम में रहनेवाले महायाजक योआकीम ने बैतूलुआ और बैतोमेस्थैम के निवासियों को लिखा। बैतोमेस्थैम एस्रेलोन के सामने, दोथैम के निकट के मैदान के सामने स्थित है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν
  choice: लिखा
  rationale: ग्रीक क्रिया का सीधा अर्थ ‘लिखा’ है; मूल में ‘पत्र’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἱερεὺς ὁ μέγας
  choice: महायाजक
  rationale: यद्यपि पदबंध शब्दशः ‘याजक, वह महान’ है, आधुनिक हिन्दी में इस संस्थागत पद का स्वाभाविक और मानक रूप ‘महायाजक’ है।
- source_word: ὃς ἦν ἐν ταῖς ἡμέραις ἐν Ἰερουσαλήμ
  choice: उन दिनों यरूशलेम में रहनेवाले
  rationale: यह समय और स्थान दोनों को व्यक्त करता है तथा हिन्दी में योआकीम के विशेषण के रूप में सहज बैठता है।
- source_word: τοῖς κατοικοῦσι
  choice: के निवासियों को
  rationale: यह स्थानों में बसे लोगों को सूचित करने वाला संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: Βαιτουλουὰ
  choice: बैतूलुआ
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण, जिसमें स्रोत के स्वरक्रम को यथासंभव बनाए रखा गया है।
- source_word: Βαιτομεσθαίμ
  choice: बैतोमेस्थैम
  rationale: यूनानी स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: ἀπέναντι Ἐσρηλὼν
  choice: एस्रेलोन के सामने
  rationale: ἀπέναντι की भौगोलिक आमने-सामने अथवा विपरीत दिशा की भावना को स्पष्ट रखता है।
- source_word: κατὰ πρόσωπον τοῦ πεδίου
  choice: मैदान की ओर
  rationale: स्थानिक दिशा या अभिमुखता व्यक्त करने के लिए सहज हिन्दी; ‘सामने’ की तुरंत पुनरावृत्ति से बचते हुए अर्थ सुरक्षित रहता है।
- source_word: τοῦ πλησίον Δωθάειμ
  choice: दोथैम के पास के
  rationale: यह निकटता को स्पष्ट रूप से व्यक्त करता है और ‘मैदान’ को विशेषित करता है।
theological_decisions:
- issue: ἱερεὺς ὁ μέγας का पदनाम
  choice: महायाजक
  alternative: महान याजक
  rationale: शब्दशः संरचना ‘याजक, वह महान’ है, पर यह प्रचलित संस्थागत पदनाम है। ‘महायाजक’ आधुनिक हिन्दी में सटीक, गरिमापूर्ण और संप्रदाय-निरपेक्ष है।
- issue: सापेक्ष सर्वनाम ἥ का पूर्वपद
  choice: बैतोमेस्थैम
  alternative: बैतूलुआ और बैतोमेस्थैम का संयुक्त क्षेत्र
  rationale: स्त्रीलिंग एकवचन ἥ निकटतम स्त्रीलिंग एकवचन स्थान-नाम Βαιτομεσθαίμ की ओर स्वाभाविक रूप से संकेत करता है। इसे अलग वाक्य में स्पष्ट किया गया है, बिना अतिरिक्त भूगोल आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय गद्य। लंबे यूनानी वाक्य को पठनीयता और सापेक्ष सर्वनाम के स्पष्ट संबंध के लिए दो वाक्यों में बाँटा गया है। स्थान-नाम मूल यूनानी के निकट देवनागरी में दिए गए हैं।
