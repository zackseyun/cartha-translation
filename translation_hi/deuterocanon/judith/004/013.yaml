  yaml_path: translation/deuterocanon/judith/004/013.yaml
  text: And they covered the altar with sackcloth, and they cried out to the God of Israel together with fervor, that he might not give their little children over to plunder, and their women to spoil, and the cities of their inheritance to destruction, and the holy things to defilement and reproach, as something the nations would gloat over.
translation:
  language: hi
  text: और उन्होंने वेदी को टाट से ढक दिया, और एक मन होकर बड़े आग्रह से इस्राएल के परमेश्वर को पुकारा कि वह उनके छोटे बच्चों को लूटे जाने के लिए, उनकी स्त्रियों को युद्ध की लूट के रूप में[a], उनकी विरासत के नगरों को विनाश के लिए, और पवित्र वस्तुओं को अपवित्रीकरण और निंदा के लिए न सौंप दे, जिससे राष्ट्र हर्षित हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध में लूट के रूप में।” यूनानी शब्द युद्ध में प्राप्त लूट या माल-ए-गनीमत का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, “राष्ट्रों के लिए हर्ष का कारण।” यहाँ हर्ष का भाव शत्रुओं की विपत्ति पर दुर्भावनापूर्वक प्रसन्न होने या विजयोल्लास करने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ θυσιαστήριον
  choice: वेदी
  rationale: यह बलिदान चढ़ाने की वेदी को सूचित करता है; प्रसंग में सामान्य और स्वाभाविक हिन्दी शब्द पर्याप्त स्पष्ट है।
- source_word: σάκκῳ περιέβαλλον
  choice: टाट से ढक दिया
  rationale: περιβάλλω चारों ओर डालने या ढकने का भाव देता है; शोक और दीनता के चिह्न के रूप में टाट यहाँ स्वाभाविक है।
- source_word: ἐβόησαν ... ὁμοθυμαδὸν ἐκτενῶς
  choice: एक मन होकर बड़े आग्रह से ... पुकारा
  rationale: ἐβόησαν ऊँची और व्याकुल पुकार, ὁμοθυμαδόν सामूहिक एकमतता, और ἐκτενῶς तीव्र आग्रह व्यक्त करता है।
- source_word: τοῦ μὴ δοῦναι
  choice: कि वह ... हवाले न करे
  rationale: यह उनकी पुकार की विनती या उद्देश्य व्यक्त करता है; 'हवाले न करे' शत्रु के वश में सौंपे जाने का आशय स्पष्ट करता है।
- source_word: εἰς διαρπαγὴν
  choice: लूट का शिकार
  rationale: διαρπαγή हिंसक लूट और छीन लिए जाने को दर्शाता है; बच्चों के संबंध में 'लूट का शिकार' स्वाभाविक हिन्दी है।
- source_word: τὰ νήπια
  choice: छोटे बच्चों
  rationale: νήπια शिशुओं अथवा बहुत छोटे बच्चों को सूचित कर सकता है; यह चयन अर्थ को अनावश्यक रूप से केवल नवजातों तक सीमित नहीं करता।
- source_word: τὰς γυναῖκας εἰς προνομὴν
  choice: उनकी स्त्रियों को युद्ध की लूट
  rationale: γυναῖκας यहाँ सामूहिक रूप से स्त्रियों के लिए है और προνομή युद्ध में प्राप्त लूट या बंदियों की भाषा है।
- source_word: τὰς πόλεις τῆς κληρονομίας αὐτῶν
  choice: उनकी विरासत के नगरों
  rationale: κληρονομία विरासत का अर्थ और उसका धार्मिक-राष्ट्रीय अनुनाद दोनों बनाए रखती है।
- source_word: εἰς ἀφανισμὸν
  choice: विनाश
  rationale: ἀφανισμός पूर्ण उजाड़ या नष्ट किए जाने का प्रबल भाव रखता है; 'विनाश' संक्षिप्त और उपयुक्त है।
- source_word: τὰ ἅγια
  choice: पवित्र वस्तुओं
  rationale: नपुंसकलिंग बहुवचन को व्यापक रखा गया है; इसे केवल मन्दिर या पवित्रस्थान मान लेने से बचा गया है।
- source_word: εἰς βεβήλωσιν καὶ ὀνειδισμὸν
  choice: अपवित्रता और अपमान
  rationale: पहला शब्द पवित्र वस्तुओं के अपवित्रीकरण और दूसरा तिरस्कार या कलंक को व्यक्त करता है।
- source_word: ἐπίχαρμα τοῖς ἔθνεσιν
  choice: जो अन्यजातियों के लिए आनन्द का कारण बनता
  rationale: ἐπίχαρμα दूसरों की विपत्ति पर विरोधियों के आनन्द या विजयोल्लास का कारण सूचित करता है; मुख्य पाठ अपेक्षाकृत शाब्दिक है और पादटिप्पणी दुर्भावनापूर्ण आनन्द स्पष्ट करती है।
theological_decisions:
- issue: κληρονομία का वाचा-संबंधी और राष्ट्रीय अनुनाद
  choice: विरासत
  alternative: धरोहर; अधिकार में मिले नगर
  rationale: '''विरासत'' मूल शब्द का उत्तराधिकार-संबंधी भार बनाए रखता है, पर पद में न कही गई अतिरिक्त धर्मशास्त्रीय व्याख्या नहीं जोड़ता।'
- issue: τὰ ἅγια का संदर्भ
  choice: पवित्र वस्तुएँ
  alternative: पवित्रस्थान; पवित्र चीज़ें
  rationale: यूनानी बहुवचन का संदर्भ व्यापक और कुछ हद तक अनिश्चित है; इसे केवल भवन के अर्थ में सीमित नहीं किया गया।
- issue: ἐπίχαρμα में विरोधी आनन्द का स्वर
  choice: आनन्द का कारण
  alternative: उपहासपूर्ण विजयोल्लास का कारण; ऐसी बात जिस पर अन्यजातियाँ खुशियाँ मनाएँ
  rationale: मुख्य पाठ मूल की संक्षिप्तता और अस्पष्ट संबद्धता बनाए रखता है, जबकि पादटिप्पणी बताती है कि यह तटस्थ प्रसन्नता नहीं, बल्कि शत्रुतापूर्ण आनन्द हो सकता है।
