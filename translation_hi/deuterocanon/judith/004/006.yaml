  text: And they fortified the villages among them[a], and they stored up food supplies in preparation for war, because their fields had been newly harvested.
translation:
  language: hi
  text: और उन्होंने अपने बीच के गाँवों को किलेबन्द किया[a] और युद्ध की तैयारी के लिए खाद्य-सामग्री जमा कर ली, क्योंकि उनके खेतों की फसल हाल ही में काटी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके भीतर के गाँवों को।” यूनानी पदबंध स्थान-संबंध को पूरी तरह स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτείχισαντο
  choice: किलेबन्द किया
  rationale: मध्यवाची रूप स्थानों को दीवार या अन्य साधनों से सुरक्षित और रक्षणीय बनाने का भाव देता है; ‘किलेबन्द किया’ आधुनिक हिन्दी में इसे स्पष्ट रखता है, पर निर्माण के ठीक प्रकार को निर्धारित नहीं करता।
- source_word: τὰς ἐν αὐτοῖς κώμας
  choice: अपने बीच के गाँवों को
  rationale: κώμας का अर्थ ‘गाँव’ है। ἐν αὐτοῖς का स्थान-संबंध कुछ संक्षिप्त और अस्पष्ट है; ‘अपने बीच के’ उस अस्पष्टता को किसी विशिष्ट भौगोलिक अर्थ में सीमित किए बिना बनाए रखता है।
- source_word: παρέθεντο εἰς ἐπισιτισμὸν
  choice: खाद्य-सामग्री जमा कर ली
  rationale: इस प्रसंग में पदबंध आगामी आवश्यकता के लिए भोजन का प्रबंध करके उसे संचित रखने को व्यक्त करता है।
- source_word: εἰς παρασκευὴν πολέμου
  choice: युद्ध की तैयारी के लिए
  rationale: यह स्वाभाविक हिन्दी में युद्ध हेतु तैयारी के प्रयोजन को ठीक प्रकार व्यक्त करता है।
- source_word: προσφάτως
  choice: हाल ही में
  rationale: क्रिया-विशेषण निकट अतीत में हुई घटना को सूचित करता है।
- source_word: τεθερισμένα
  choice: फसल ... काटी गई थी
  rationale: θερίζω के पूर्ण निष्क्रिय कृदन्त का कृषि-संदर्भ में सहज हिन्दी रूप; पूर्ण पक्ष को ‘गई थी’ से व्यक्त किया गया है।
