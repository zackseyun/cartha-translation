  yaml_path: translation/deuterocanon/tobit/012/009.yaml
  text: Almsgiving rescues from death[a], and it will cleanse away every sin. Those who do acts of almsgiving and righteousness will be filled with life.
translation:
  language: hi
  text: ज़रूरतमंदों को दान देना मृत्यु से बचाता है, और वह हर पाप को दूर कर देगा। जो लोग दान और धार्मिकता के कार्य करते हैं, वे जीवन से भर जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे जीवन से तृप्त होंगे।”
    reason: πλησθήσονται ζωῆς में ‘भर जाने’ के साथ ‘तृप्त होने’ का अर्थ भी संभव है।
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: ज़रूरतमंदों को दान देना
  rationale: यह संज्ञा केवल दयालु स्वभाव नहीं, बल्कि ज़रूरतमंदों की सहायता के लिए किए गए ठोस दान को दर्शाती है। यह वाक्यांश आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ῥύεται
  choice: बचाता है
  rationale: क्रिया संकट से छुड़ाने या बचाने का अर्थ देती है। ‘मृत्यु से बचाता है’ सहज हिन्दी है और पाठ से आगे बढ़कर कोई अतिरिक्त उद्धारशास्त्रीय अर्थ नहीं जोड़ता।
- source_word: ἀποκαθαριεῖ
  choice: पूरी तरह शुद्ध कर देगा
  rationale: संयुक्त क्रिया गहन या पूर्ण शुद्धीकरण का भाव रखती है; ‘पूरी तरह’ उसके प्रबल अर्थ को व्यक्त करता है।
- source_word: πᾶσαν ἁμαρτίαν
  choice: हर पाप
  rationale: एकवचन संज्ञा के साथ πᾶσαν का व्यापक और वितरणात्मक बल ‘हर पाप’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἐλεημοσύνας καὶ δικαιοσύνας
  choice: दान और धार्मिकता के काम
  rationale: ग्रीक बहुवचन ठोस और बार-बार किए जाने वाले कार्यों की ओर संकेत करता है। ‘काम’ जोड़ने से व्यावहारिक अर्थ स्पष्ट होता है, जबकि ‘धार्मिकता’ प्रमुख बाइबिलीय शब्द को सुरक्षित रखता है।
- source_word: πλησθήσονται ζωῆς
  choice: जीवन से भर जाएँगे
  rationale: यह भविष्यकालीन कर्मवाच्य अभिव्यक्ति भर जाने या तृप्त होने—दोनों का भाव दे सकती है। मुख्य पाठ में सजीव रूपक को निकटता से रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दान, मृत्यु से छुटकारे और पाप-शुद्धि का संबंध
  choice: पाठ के सीधे कथन को बिना नरम किए रखा गया है कि दान देना मृत्यु से बचाता और हर पाप को शुद्ध करता है।
  alternative: इसे उदारता के व्यावहारिक लाभों के बारे में अतिशयोक्तिपूर्ण ज्ञान-साहित्य की उक्ति या पश्चाताप से जुड़ी वाचा-संबंधी भाषा मानना।
  rationale: ग्रीक पाठ यह दावा सीधे करता है। अनुवाद उस धार्मिक तनाव को बनाए रखता है और इसमें किसी बाद की सिद्धान्त-व्यवस्था या स्पष्टीकरण को नहीं जोड़ता।
- issue: δικαιοσύνας का व्यावहारिक और धार्मिक अर्थ
  choice: ‘धार्मिकता के काम’
  alternative: ‘न्याय के काम’ या ‘धार्मिक काम’
  rationale: बहुवचन और दान के साथ इसकी जोड़ी ठोस नेक आचरण की ओर संकेत करती है। ‘धार्मिकता के काम’ मूल बाइबिलीय धारणा और उसके व्यावहारिक बल दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘ज़रूरतमंदों को’ जोड़कर दान के विशिष्ट करुणामय अर्थ को स्पष्ट किया गया है; यह व्यापक ‘परोपकार’ से अधिक सटीक है।
