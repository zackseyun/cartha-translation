base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/012.yaml
  text: And now[a], when you and your bride Sarah were praying, I brought the memorial of your prayer before the Holy One. And when you were burying the dead[c][b], I likewise was with you.
translation:
  language: hi
  text: और अब, जब तुम और तुम्हारी दुल्हन सारा[a] प्रार्थना कर रहे थे, तब मैं तुम्हारी प्रार्थना का स्मरण[b] पवित्र परमेश्वर[c] के सामने ले गया। और जब तुम मृतकों को दफनाया करते थे, तब भी मैं तुम्हारे साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी पत्नी सारा’; यूनानी शब्द का अर्थ ‘दुल्हन’ या ‘नवविवाहिता पत्नी’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम्हारी प्रार्थना का स्मारक’; यहाँ धार्मिक अर्थ में परमेश्वर के सामने प्रस्तुत किए जाने वाले स्मारक-भेंट जैसा भाव भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से ‘पवित्र [जन/एक]’ है; संदर्भ में यह परमेश्वर को सूचित करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: अब
  rationale: यह सामान्य कालवाचक क्रिया-विशेषण है और कथन में स्वाभाविक संक्रमण दिखाता है।
- source_word: προσηύξω
  choice: प्रार्थना कर रहे थे
  rationale: कालसूचक उपवाक्य में प्रार्थना के अवसर पर जारी क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νύμφη
  choice: दुल्हन
  rationale: यूनानी शब्द दुल्हन या नवविवाहिता पत्नी को सूचित कर सकता है; ‘दुल्हन’ तत्कालीन विवाह-संदर्भ को बनाए रखता है।
- source_word: προσήγαγον
  choice: ले गया
  rationale: मूल क्रिया का अर्थ किसी वस्तु को निकट लाना या सामने प्रस्तुत करना है; अगले पद ‘के सामने’ से प्रस्तुति का भाव स्पष्ट होता है।
- source_word: μνημόσυνον
  choice: स्मरण-चिह्न
  rationale: यह ‘स्मरण’ या धार्मिक संदर्भ में स्मारक-भेंट जैसे भाव को व्यक्त कर सकता है। ‘स्मरण-चिह्न’ भेंट का विचार अनिवार्य बनाए बिना उस धार्मिक अनुगूँज को सुरक्षित रखता है।
- source_word: τῆς προσευχῆς ὑμῶν
  choice: तुम्हारी प्रार्थना का
  rationale: यूनानी में ‘प्रार्थना’ एकवचन है; हिन्दी में भी उसे बनाए रखा गया है।
- source_word: ἐνώπιον τοῦ ἁγίου
  choice: पवित्र जन के सामने
  rationale: यह यूनानी पदवी ‘पवित्र जन’ को निकटता से व्यक्त करती है और मुख्य पाठ में उसके संदर्भ को जरूरत से अधिक स्पष्ट नहीं करती।
- source_word: ἐθάπτες
  choice: दफनाया करते थे
  rationale: अपूर्ण भूतकाल बार-बार या जारी रहने वाली क्रिया का संकेत देता है; यह हिन्दी प्रयोग उसके आवृत्तिमूलक पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς νεκρούς
  choice: मृतकों को
  rationale: यह ‘मरे हुओं’ का स्वाभाविक, गरिमापूर्ण और सीधा हिन्दी रूप है।
- source_word: ὡσαύτως
  choice: तब भी
  rationale: संदर्भ में यह पिछली बात के अनुरूप रफाएल की उपस्थिति को जोड़ता है; ‘तब भी’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: συμπαρήμην σοι
  choice: मैं तुम्हारे साथ उपस्थित था
  rationale: यह साथ मौजूद रहने के संयुक्त भाव को ‘मैं तुम्हारे साथ था’ से कुछ अधिक स्पष्टता से सुरक्षित रखता है।
theological_decisions:
- issue: ἐνώπιον τοῦ ἁγίου में ‘पवित्र जन’ का संदर्भ
  choice: मुख्य पाठ में ‘पवित्र जन’, जिसे संदर्भ में परमेश्वर समझा गया है
  alternative: किसी पवित्र स्वर्गीय या स्वर्गदूतीय सत्ता का संदर्भ
  rationale: रफाएल प्रार्थना को दिव्य उपस्थिति में ले जाने की बात करता है, इसलिए संदर्भ परमेश्वर की ओर संकेत करता है। फिर भी मुख्य पाठ यूनानी पदवी की संक्षिप्तता और संभावित तनाव को बनाए रखता है; पहचान को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दफनाया करते थे’ आवृत्तिमूलक पक्ष को और ‘साथ उपस्थित था’ रफाएल की सह-उपस्थिति को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
