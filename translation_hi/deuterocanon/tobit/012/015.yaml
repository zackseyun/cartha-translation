    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαφαήλ
  choice: रफ़ाएल
  rationale: यूनानी व्यक्तिवाचक नाम का आधुनिक हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: εἷς ἐκ τῶν ἑπτὰ
