  text: मैं रफ़ाएल हूँ—उन सात पवित्र स्वर्गदूतों में से एक, जो पवित्र जनों[a] की प्रार्थनाएँ प्रस्तुत करते हैं और पवित्र परमेश्वर की महिमा के सम्मुख प्रवेश करते हैं।
  philosophy: optimal-equivalence
  footnotes:
