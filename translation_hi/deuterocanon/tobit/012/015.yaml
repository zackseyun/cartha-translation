- source_word: ἁγίων ἀγγέλων
  choice: पवित्र स्वर्गदूतों
  rationale: ἅγιος के लिए पारदर्शी ‘पवित्र’ और ἄγγελος के लिए हिन्दी बाइबलीय प्रयोग में सहज ‘स्वर्गदूत’ चुना गया है।
- source_word: προσαναφέρουσιν
  choice: प्रस्तुत करते हैं
  rationale: यह दिव्य उपस्थिति में प्रार्थनाएँ ले जाकर सामने रखने का भाव देता है, पर ‘चढ़ाते हैं’ जैसे बलिदान-संबंधी अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: τὰς προσευχὰς τῶν ἁγίων
  choice: पवित्र जनों की प्रार्थनाएँ
  rationale: ‘प्रार्थनाएँ’ προσευχαί का सीधा अर्थ है; ‘पवित्र जन’ यूनानी τῶν ἁγίων को पारदर्शी ढंग से व्यक्त करता और बाद की विशिष्ट धार्मिक पदवी का संकेत देने से बचता है।
- source_word: εἰσπορεύονται ἐνώπιον
  choice: के सामने प्रवेश करते हैं
  rationale: यह प्रवेश की गति और किसी की उपस्थिति के सामने आने—दोनों तत्वों को बनाए रखता है।
- source_word: τῆς δόξης τοῦ ἁγίου
  choice: परमपवित्र की महिमा
  rationale: δόξα को ‘महिमा’ के रूप में स्पष्ट रखा गया है; substantival τοῦ ἁγίου को परमेश्वर के श्रद्धापूर्ण शीर्षक के रूप में स्वाभाविक हिन्दी ‘परमपवित्र’ से व्यक्त किया गया है।
theological_decisions:
- issue: अंतिम पदबंध में τοῦ ἁγίου का संदर्भ
  choice: परमेश्वर को सूचित करने वाला दिव्य शीर्षक ‘परमपवित्र’
  alternative: ‘पवित्र की महिमा’ अथवा ‘पवित्र परमेश्वर की महिमा’
  rationale: स्वर्गीय दरबार के प्रसंग में यह पदबंध सबसे स्वाभाविक रूप से परमेश्वर की ओर संकेत करता है। ‘परमपवित्र’ हिन्दी में शीर्षक के रूप में सुबोध है और यूनानी में अनुपस्थित ‘परमेश्वर’ संज्ञा को सीधे नहीं जोड़ता।
- issue: τῶν ἁγίων का आशय
  choice: पवित्र जनों
  alternative: सन्तों
  rationale: यह यूनानी शब्द का मूल अर्थ और परमेश्वर के पवित्र लोगों का सामूहिक संदर्भ बनाए रखता है, जबकि ‘सन्त’ से जुड़ी बाद की विशिष्ट संस्थागत धारणाएँ आरोपित नहीं करता।
