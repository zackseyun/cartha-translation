lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: धन्यवाद दो
  rationale: परमेश्वर के लिए प्रयुक्त इस यूनानी क्रिया का यहाँ भाव पापों के अंगीकार से अधिक परमेश्वर को कृतज्ञतापूर्वक स्वीकार करने और उसकी स्तुति करने का है। ‘धन्यवाद दो’ प्रसंग में सबसे स्वाभाविक है; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἀναβαίνω
  choice: ऊपर जा रहा हूँ
  rationale: वर्तमान काल निकट भविष्य में होने वाली क्रिया को दर्शाता है। यह अनुवाद ऊपर की ओर जाने का भाव बनाए रखता है और ‘लौट रहा हूँ’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: τὸν ἀποστείλαντά με
  choice: उसके पास ... जिसने मुझे भेजा है
  rationale: कृदंत पदबंध को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य के रूप में रखा गया है। भेजनेवाले की पहचान को इस खंड में स्पष्ट रूप से ‘परमेश्वर’ कहकर नहीं जोड़ा गया।
- source_word: γράψατε
  choice: लिख दो
  rationale: बहुवचन आज्ञार्थक का सीधा और सहज हिन्दी रूप है, जो घटनाओं को लिखित रूप देने की आज्ञा व्यक्त करता है।
- source_word: πάντα τὰ συντελεσθέντα
  choice: जो कुछ घटित हो चुका है, वह सब
  rationale: यूनानी पूर्णकालिक निष्क्रिय कृदंत पूर्ण हो चुकी घटनाओं की ओर संकेत करता है। ‘घटित हो चुका है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए घटना और उसकी पूर्णता दोनों को व्यक्त करता है।
- source_word: εἰς βιβλίον
  choice: एक पुस्तक में
  rationale: यह लिखित दस्तावेज़ में सुरक्षित करने का सहज आधुनिक हिन्दी रूप है। ‘पुस्तक’ यूनानी βιβλίον को बिना अनावश्यक रूप से ‘पुस्तक-पत्र’ या ‘लपेटा हुआ ग्रंथ’ मान लेने के व्यक्त करता है।
theological_decisions:
- issue: राफाएल का अपने भेजनेवाले के पास ऊपर जाने का कथन
  choice: ऊपर जाने और भेजे जाने की भाषा को सीधे रखा गया है, पर भेजनेवाले का नाम इस खंड में नहीं जोड़ा गया।
  alternative: ‘मैं परमेश्वर के पास लौट रहा हूँ’ कहना।
  rationale: पद का संदर्भ दिव्य भेजनेवाले और स्वर्गीय आरोहण का संकेत देता है, फिर भी यूनानी पाठ इस उपवाक्य में भेजनेवाले को दोबारा स्पष्ट रूप से ‘परमेश्वर’ नहीं कहता और ‘लौटना’ भी नहीं कहता। अनुवाद इस निहितार्थ को बिना विस्तार दिए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बहुवचन आज्ञार्थक के लिए ‘दो’ और ‘लिख दो’ का प्रयोग हुआ है। अर्धविराम यूनानी वाक्य के दो मुख्य निर्देशों को स्पष्ट रूप से अलग करता है।
