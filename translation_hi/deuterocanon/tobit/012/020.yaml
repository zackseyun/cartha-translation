  text: And now give thanks to God[a], because I am ascending to the one who sent me; and write all that has been accomplished in a book.
translation:
  language: hi
  text: और अब परमेश्वर को धन्यवाद दो[a], क्योंकि मैं ऊपर उसी के पास जा रहा हूँ, जिसने मुझे भेजा है; और जो कुछ पूरा हो चुका है, वह सब एक पुस्तक में लिख दो।
  philosophy: optimal-equivalence
  footnotes:
