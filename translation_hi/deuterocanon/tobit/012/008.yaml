  yaml_path: translation/deuterocanon/tobit/012/008.yaml
  text: Prayer with fasting[a], almsgiving, and righteousness is good; a little with righteousness is better than much with unrighteousness[b]. It is good to do almsgiving rather than to store up gold.
translation:
  language: hi
  text: उपवास, दान और धार्मिकता के साथ प्रार्थना अच्छी है; अधर्म के साथ बहुत होने से धार्मिकता के साथ थोड़ा होना बेहतर है। सोना जमा करने से दान करना अच्छा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸν
  choice: अच्छा है / बेहतर है
  rationale: पहले कथन में सामान्य नैतिक मूल्यांकन के लिए ‘अच्छा है’ स्वाभाविक है; ἢ से बने मात्रात्मक विरोध में हिन्दी में तुलनात्मक अर्थ स्पष्ट करने के लिए ‘बेहतर है’ आवश्यक है।
- source_word: προσευχὴ μετὰ νηστείας
  choice: उपवास ... के साथ प्रार्थना करना
  rationale: μετά को ‘के साथ’ रखकर प्रार्थना और साथ जुड़ी साधनाओं का संबंध सुरक्षित रखा गया है, बिना कारण या साधन का अर्थ थोपे।
- source_word: ἐλεημοσύνης / ποιῆσαι ἐλεημοσύνην
  choice: दान / दान देना
  rationale: यहाँ शब्द जरूरतमंदों को दी जाने वाली सहायता का द्योतक है। आधुनिक हिन्दी में ‘दान’ और ‘दान देना’ स्पष्ट तथा स्वाभाविक हैं।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह चुनाव नैतिक-सामाजिक न्याय तक सीमित न रहकर परमेश्वर के सामने उचित आचरण के व्यापक धार्मिक अर्थ को सुरक्षित रखता है।
- source_word: τὸ ὀλίγον / πολὺ
  choice: थोड़ा धन / बहुत धन
  rationale: यूनानी में वस्तु अनिर्दिष्ट है, पर सोना जमा करने वाली अगली पंक्ति आर्थिक संपत्ति का संदर्भ स्पष्ट करती है। हिन्दी में केवल ‘थोड़ा/बहुत’ अस्पष्ट लगता, इसलिए ‘धन’ जोड़ा गया है।
- source_word: ἀδικίας
  choice: अधर्म
  rationale: δικαιοσύνη के विपरीत व्यापक नैतिक और धार्मिक गलत आचरण व्यक्त करने के लिए ‘अधर्म’ संक्षिप्त और प्रचलित है।
- source_word: καλὸν
  choice: उत्तम है
  rationale: καλόν के नैतिक रूप से श्रेष्ठ या भले होने के भाव को अंतिम तुलना में ‘उत्तम’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: θησαυρίσαι χρυσίον
  choice: सोना जमा करना
  rationale: यह संचय का तटस्थ अर्थ देता है और ‘लोभ से बटोरना’ जैसी अतिरिक्त निंदात्मक छाया नहीं जोड़ता।
theological_decisions:
- issue: δικαιοσύνη / ἀδικία का अनुवाद
  choice: धार्मिकता / अधर्म
  alternative: न्याय / अन्याय
  rationale: इस ज्ञान-साहित्यिक संदर्भ में सामाजिक न्याय का भाव संभव है, पर शब्दों का नैतिक-धार्मिक विस्तार भी है। मुख्य पाठ में ‘धार्मिकता/अधर्म’ उसी व्यापक तनाव को अधिक अच्छी तरह बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सूक्तिपरक रूप अपनाया गया है। ‘भिक्षादान’ की अपेक्षा ‘दान’ सामान्य पाठकों के लिए अधिक स्वाभाविक है। कोई पादटिप्पणी नहीं दी गई, इसलिए मुख्य पाठ में पादटिप्पणी-चिह्न आवश्यक नहीं हैं।
