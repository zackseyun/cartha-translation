translation:
  language: hi
  text: और वे दोनों घबरा उठे और मुँह के बल गिर पड़े, क्योंकि वे डर गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: घबरा उठे
  rationale: यह क्रिया अचानक भीतर से व्याकुल या विचलित हो उठने का भाव देती है। ‘घबरा उठे’ स्वाभाविक आधुनिक हिन्दी में इस आकस्मिक भावनात्मक हलचल को व्यक्त करता है, जबकि अगले उपवाक्य में भय स्पष्ट रूप से बताया गया है।
- source_word: οἱ δύο
  choice: वे दोनों
  rationale: संज्ञा के रूप में प्रयुक्त संख्या का स्वाभाविक हिन्दी रूप; संदर्भ में यह तोबीत और तोबियाह दोनों की ओर संकेत करता है।
- source_word: ἔπεσον ἐπὶ πρόσωπον
  choice: मुँह के बल गिर पड़े
  rationale: यह यूनानी अभिव्यक्ति भूमि की ओर मुँह करके गिरने की शारीरिक मुद्रा बताती है। यह अनुवाद साष्टांग मुद्रा का संकेत देता है, पर आराधना का ऐसा अर्थ नहीं जोड़ता जो मूल में स्पष्ट नहीं है।
- source_word: ἐφοβήθησαν
  choice: वे डर गए थे
  rationale: φοβέομαι यहाँ भयभीत होने को व्यक्त करता है। ‘डर गए थे’ कारणसूचक उपवाक्य में स्वाभाविक हिन्दी है और मुख्य घटना से पहले उत्पन्न भय को स्पष्ट करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι उनके मुँह के बल गिर पड़ने का कारण बताता है; ‘क्योंकि’ इस कारणात्मक संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: रफाएल के प्रकट होने पर उनकी प्रतिक्रिया का स्वरूप
  choice: पद भय के कारण मुँह के बल गिरने का वर्णन करता है; अनुवाद में आराधना की भाषा नहीं जोड़ी गई।
  alternative: इस मुद्रा को स्वर्गदूत के सामने श्रद्धापूर्ण दंडवत के रूप में भी समझा जा सकता है।
  rationale: यूनानी पाठ स्पष्ट रूप से कहता है कि वे डरने के कारण मुँह के बल गिरे। इसलिए शारीरिक मुद्रा और भय दोनों सुरक्षित रखे गए हैं, पर पद से अधिक प्रबल धार्मिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। ‘तब’ यूनानी καί को कथानक की स्वाभाविक अगली घटना के रूप में व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं।
