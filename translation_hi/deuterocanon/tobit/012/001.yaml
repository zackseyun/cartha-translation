base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/001.yaml
  text: Then Tobit called Tobias his son and said to him[a], “See, child, wages must be given to the man who went with you, and more must be added for him.”
translation:
  language: hi
  text: फिर तोबीत ने अपने पुत्र तोबियाह को बुलाकर उससे कहा, “देखो, बच्चे,[a] जो व्यक्ति तुम्हारे साथ गया था, उसे मज़दूरी देनी चाहिए और उसे कुछ अधिक भी देना चाहिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “बच्चे”; समानांतर सामी अभिव्यक्ति में “मेरे पुत्र” है। मुख्य पाठ यूनानी के स्नेहपूर्ण संबोधन को प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाकर
  rationale: किसी को अपने पास बुलाने के सामान्य कथात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ὅρα
  choice: देखो
  rationale: यह आज्ञार्थक शब्द आगे कही जाने वाली बात पर ध्यान दिलाता है; ‘देखो’ यूनानी की सीधी अभिव्यक्ति बनाए रखता है।
- source_word: τέκνον
  choice: मेरे बच्चे
  rationale: यूनानी में विशिष्ट ‘पुत्र’ के बजाय स्नेहपूर्ण संबोधन ‘बच्चे’ है। हिन्दी में ‘मेरे बच्चे’ पिता के आत्मीय संबोधन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μισθὸν
  choice: मज़दूरी
  rationale: यह यात्रा में साथ देने और सेवा करने के बदले देय पारिश्रमिक है; ‘मज़दूरी’ व्यापक ‘इनाम’ की तुलना में देय भुगतान को अधिक स्पष्ट करती है।
- source_word: τῷ ἀνθρώπῳ
  choice: जो व्यक्ति
  rationale: संदर्भ एक पुरुष साथी का है, पर हिन्दी में संबंधवाचक वाक्य के भीतर ‘जो व्यक्ति’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: τῷ συνελθόντι σοι
  choice: जो व्यक्ति तुम्हारे साथ गया था
  rationale: यूनानी कृदंत का निकट और सहज हिन्दी रूप है, जो साथ यात्रा करने का अर्थ सुरक्षित रखता है।
- source_word: προσθεῖναι αὐτῷ δεῖ
  choice: उसे कुछ अधिक भी देना चाहिए
  rationale: देῖ की आवश्यकता और προσθεῖναι के मूल भुगतान से अतिरिक्त देने—दोनों भावों को स्वाभाविक हिन्दी में रखता है; कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
