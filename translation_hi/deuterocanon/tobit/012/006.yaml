base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/006.yaml
  text: And calling the two of them privately[a], he said to them, “Bless God and give thanks to him; give him greatness, and give thanks to him before all the living for what he has done with you. It is good to bless God and to exalt his name, showing forth with honor the words of the works of God[c][b]; and do not be reluctant
translation:
  language: hi
  text: और उसने उन दोनों को एकांत में बुलाकर उनसे कहा, “परमेश्वर को धन्य कहो और उसका धन्यवाद करो; उसकी महानता का बखान करो[a], और उसने तुम्हारे साथ जो कुछ किया है[b], उसके लिए सब जीवित लोगों के सामने उसका धन्यवाद करो। परमेश्वर को धन्य कहना और उसके नाम को ऊँचा करना अच्छा है, परमेश्वर के कामों की बातें आदर के साथ प्रकट करते हुए; और मत…[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “उसे महानता दो”; भाव है उसकी महानता को स्वीकार करके उसका बखान करना।
    reason: lexical_alternative
  - marker: b
    text: “तुम्हारे साथ” का अर्थ यहाँ “तुम्हारे लिए” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ उपलब्ध यूनानी पाठ पद के अंत में “और मत…” कहकर अधूरा रुक जाता है; निषेध आगे जारी है।
    reason: textual_variant
lexical_decisions:
- source_word: καλέσας τοὺς δύο κρυπτῶς
  choice: उन दोनों को एकांत में बुलाकर
  rationale: यह यूनानी कृदंत-रचना को स्वाभाविक हिन्दी कथन में रखता है; κρυπτῶς यहाँ गुप्त षड्यंत्र के बजाय निजी रूप से अलग बुलाने का भाव देता है।
- source_word: Εὐλογεῖτε τὸν θεὸν
  choice: परमेश्वर को धन्य कहो
  rationale: ईश्वर की ओर निर्देशित εὐλογεῖν के बाइबलीय आशीर्वचनात्मक मुहावरे को बनाए रखता है और इसे केवल सामान्य ‘स्तुति’ में नहीं बदलता।
- source_word: ἐξομολογεῖσθε
  choice: उसका धन्यवाद करो
  rationale: इस प्रसंग में क्रिया पाप-स्वीकार के बजाय परमेश्वर के कामों की कृतज्ञ सार्वजनिक स्वीकृति व्यक्त करती है।
- source_word: μεγαλωσύνην δίδοτε αὐτῷ
  choice: उसकी महानता का बखान करो
  rationale: शाब्दिक ‘उसे महानता दो’ हिन्दी में अस्वाभाविक है; यह चयन परमेश्वर की महानता को मानने और घोषित करने का भाव सुरक्षित रखता है।
- source_word: ἐνώπιον πάντων τῶν ζώντων
  choice: सब जीवित लोगों के सामने
  rationale: मूल के व्यापक सार्वजनिक दायरे को स्पष्ट और लगभग औपचारिक हिन्दी में बनाए रखता है।
- source_word: περὶ ὧν ἐποίησεν μεθʼ ὑμῶν
  choice: उसने तुम्हारे साथ जो कुछ किया है
  rationale: μετά के ‘साथ’ अर्थ को सुरक्षित रखता है और ‘तुम्हारे लिए’ जैसी संभव पर अधिक व्याख्यात्मक समझ को मुख्य पाठ में नहीं थोपता।
- source_word: ὑψοῦν τὸ ὄνομα αὐτοῦ
  choice: उसके नाम को ऊँचा करना
  rationale: यह परमेश्वर का सार्वजनिक आदर करने वाले बाइबलीय मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τοὺς λόγους τῶν ἔργων τοῦ θεοῦ ἐντίμως ὑποδεικνύντες
  choice: परमेश्वर के कामों की बातें आदर के साथ प्रकट करो
  rationale: संक्षिप्त यूनानी पदबंध को अत्यधिक शाब्दिक और अस्पष्ट बनाए बिना ‘कामों की बातें’ तथा आदरपूर्वक उन्हें सामने लाने—दोनों तत्वों को रखता है।
- source_word: καὶ μὴ
  choice: और मत…
  rationale: दिए गए यूनानी साक्ष्य का वाक्य यहीं अधूरा रुकता है; इसलिए निषेध की अज्ञात क्रिया को अनुमान से नहीं भरा गया।
theological_decisions:
- issue: परमेश्वर की ओर निर्देशित εὐλογεῖτε का अर्थ
  choice: परमेश्वर को धन्य कहो
  alternative: परमेश्वर की स्तुति करो
  rationale: ‘धन्य कहो’ स्रोत के विशिष्ट blessing idiom को सुरक्षित रखता है, जबकि ‘स्तुति करो’ अर्थ को अधिक सामान्य बना देता।
- issue: ἐξομολογεῖσθε का प्रसंगगत अर्थ
  choice: धन्यवाद करो
  alternative: अंगीकार करो / स्तुति करो
  rationale: यहाँ परमेश्वर के कार्यों की सार्वजनिक और कृतज्ञ स्वीकृति केंद्र में है, पापों का अंगीकार नहीं।
- issue: μεθʼ ὑμῶν में परमेश्वर के कार्य का संबंध
  choice: तुम्हारे साथ जो कुछ किया
  alternative: तुम्हारे लिए जो कुछ किया
  rationale: मुख्य पाठ में यूनानी ‘साथ’ को रखा गया है; लाभार्थक ‘के लिए’ संभव अर्थ है और पादटिप्पणी में दिया गया है।
- issue: खंडित अंतिम निषेध
  choice: और मत…
  alternative: अगले पद के आधार पर निषेध पूरा करना
  rationale: प्रदान किया गया मूल पाठ καὶ μὴ पर समाप्त होता है; पाठ-साक्ष्य से आगे बढ़कर वाक्य पूरा करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक उपासना और सामान्य पाठ—दोनों के लिए बोधगम्य रूप अपनाया गया है। ‘परमेश्वर को धन्य कहो’ जैसे बाइबलीय पदबंध को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। अंतिम खंड को जानबूझकर अपूर्ण रखा गया है, क्योंकि उपलब्ध स्रोत भी वहीं खंडित है।
