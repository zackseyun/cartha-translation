base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/007.yaml
  text: Do not hesitate to acknowledge him[a]. It is good to conceal a king’s secret, but to reveal the works of God gloriously. Do what is good[b], and evil will not find you.
translation:
  language: hi
  text: उसे सार्वजनिक रूप से स्वीकार करने में संकोच न करो[a]। राजा का रहस्य छिपाना अच्छा है, पर परमेश्वर के कार्यों को महिमापूर्वक[b] प्रकट करना अच्छा है। भलाई करो, और बुराई तुम्हें नहीं पाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके प्रति अंगीकार करने,” “उसे धन्यवाद देने,” अथवा “खुले रूप से उसकी स्तुति करने।” यूनानी क्रिया प्रसंग के अनुसार सार्वजनिक स्वीकार, धन्यवाद, या स्तुति के इन अर्थों में प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “सम्मानपूर्वक” अथवा “उचित आदर के साथ।” यूनानी क्रियाविशेषण परमेश्वर के कार्यों को प्रकट करने की उपयुक्त रीति बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκνεῖτε
  choice: संकोच न करो
  rationale: यह बहुवचन निषेधात्मक आज्ञा झिझकने, पीछे हटने या देर करने का भाव रखती है। ‘संकोच न करो’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञा का बल बनाए रखता है।
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: उसका अंगीकार करने
  rationale: क्रिया प्रसंग के अनुसार अंगीकार करने, धन्यवाद देने या खुले रूप से स्तुति करने का अर्थ दे सकती है। यहाँ परमेश्वर के कार्य प्रकट करने का प्रसंग सार्वजनिक स्वीकारोक्ति की ओर संकेत करता है; ‘अंगीकार’ इस अर्थ-विस्तार को अपेक्षाकृत खुला रखता है।
- source_word: μυστήριον βασιλέως
  choice: राजा का रहस्य
  rationale: यहाँ μυστήριον किसी गोपनीय राजकीय बात को दर्शाता है, न कि किसी तकनीकी धर्मवैज्ञानिक ‘भेद’ को।
- source_word: καλὸν κρύψαι
  choice: छिपाना अच्छा है
  rationale: यह साधारण सत्य के रूप में कही गई सूक्तिपरक अभिव्यक्ति है; हिन्दी अनुवाद उसके नैतिक मूल्यांकन और संक्षिप्त शैली को बनाए रखता है।
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: परमेश्वर के कार्यों
  rationale: ‘कार्य’ ἔργα का पारदर्शी समतुल्य है और राजा के रहस्य के साथ मूल पाठ का विरोध बनाए रखता है।
- source_word: ἀνακαλύπτειν
  choice: प्रकट करना
  rationale: क्रिया का मूल भाव ढकी बात को खोलना या ज्ञात कराना है। ‘प्रकट करना’ इस प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: ἐνδόξως
  choice: महिमा के साथ
  rationale: यह क्रियाविशेषण परमेश्वर के कार्यों को प्रकट करने की रीति बताता है। ‘महिमा के साथ’ संभावित स्तुतिपरक भाव रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀγαθὸν ποιήσατε
  choice: भलाई करो
  rationale: यह सीधी नैतिक आज्ञा है। ‘भलाई करो’ सामान्य आधुनिक हिन्दी में सहज और अर्थ की दृष्टि से पर्याप्त है।
- source_word: κακὸν οὐχ εὑρήσει ὑμᾶς
  choice: बुराई तुम्हें नहीं पाएगी
  rationale: अनुवाद मूल की सजीव उपमा और κακόν की व्यापकता को बनाए रखता है; इसे केवल ‘हानि’ या ‘विपत्ति’ तक सीमित नहीं करता।
theological_decisions:
- issue: ἐξομολογεῖσθαι αὐτῷ का अर्थ
  choice: परमेश्वर का सार्वजनिक अंगीकार करना
  alternative: उसके सामने पाप मानना; उसे धन्यवाद देना; खुले रूप से उसकी स्तुति करना
  rationale: निकटवर्ती प्रसंग परमेश्वर के कार्यों को प्रकट करने की बात करता है, इसलिए सार्वजनिक अंगीकार या स्तुति का भाव अधिक संभावित है। फिर भी ‘अंगीकार’ और पादटिप्पणी मूल क्रिया की वास्तविक अर्थगत व्यापकता बनाए रखते हैं।
- issue: ἐνδόξως का बल
  choice: महिमा के साथ
  alternative: सम्मानपूर्वक; उचित आदर के साथ
  rationale: परमेश्वर के कार्यों के संबंध में क्रियाविशेषण स्तुतिपरक या महिमामय ढंग का संकेत दे सकता है। वैकल्पिक नैतिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: κακόν की व्यापकता
  choice: बुराई
  alternative: हानि; विपत्ति
  rationale: ‘बुराई’ नैतिक बुराई और आ पड़ने वाली हानि, दोनों की संभावना को खुला रखती है और मूल कथन के धर्मवैज्ञानिक तनाव को संकुचित नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। सूक्तिपरक वाक्य-विन्यास तथा ‘बुराई तुम्हें नहीं पाएगी’ की मूल रूपकात्मक अभिव्यक्ति सुरक्षित है। ‘अंगीकार’ धार्मिक प्रसंग में परिचित है, पर पादटिप्पणी उसे केवल पाप-स्वीकार तक सीमित होने से रोकती है।
