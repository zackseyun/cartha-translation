  text: And he said to them[a], “Do not be afraid; peace be with you. But bless God forever.”
translation:
  language: hi
  text: और उसने उनसे कहा, “मत डरो; तुम्हें शान्ति मिलेगी। परन्तु परमेश्वर को सदा धन्य कहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: मत डरो
  rationale: यह निषेधात्मक आज्ञा का स्वाभाविक और सीधा आधुनिक हिन्दी रूप है।
- source_word: εἰρήνη ὑμῖν ἔσται
  choice: तुम्हें शान्ति मिलेगी
  rationale: ἔσται के भविष्यकाल और ὑμῖν के सम्प्रदान भाव को स्पष्ट रखते हुए यह भावी आश्वासन व्यक्त करता है, केवल अभिवादन या आशीर्वचन नहीं।
- source_word: τὸν δὲ θεὸν
  choice: परन्तु परमेश्वर को
  rationale: δέ भय के विपरीत अपेक्षित प्रतिक्रिया की ओर हल्का मोड़ दिखाता है; ‘परन्तु’ इसे बनाए रखता है। θεός के लिए ‘परमेश्वर’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी है।
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: परमेश्वर के सम्बन्ध में εὐλογέω का अर्थ उसे धन्य कहना या उसकी स्तुति करना है। ‘धन्य कहो’ मूल क्रिया से निकट रहते हुए हिन्दी में बोधगम्य है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह अनन्त अवधि सूचित करने वाले यूनानी मुहावरे का सहज और संक्षिप्त हिन्दी रूप है।
theological_decisions:
- issue: शान्ति-वाक्य का बल
  choice: भविष्य का आश्वासन—‘तुम्हें शान्ति मिलेगी’
  alternative: अभिवादन या आशीर्वचन—‘तुम्हारे साथ शान्ति हो’
  rationale: यूनानी पाठ में भविष्यकाल ἔσται स्पष्ट है; इसलिए भय न करने की आज्ञा के बाद इसे भावी आश्वासन के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण बाइबलीय शैली। बहुवचन सम्बोधन ‘तुम’ के अनुरूप क्रियाएँ रखी गई हैं; अनावश्यक संस्कृतनिष्ठता और सम्प्रदायगत शब्दावली से बचा गया है।
