lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाकर
  rationale: καλέω का अओरिस्ट यहाँ ‘बुलाया’ के अर्थ में है। संयुक्त क्रिया ‘बुलाकर…कहा’ आधुनिक हिन्दी में स्वाभाविक कथा-प्रवाह देती है।
- source_word: τὸν ἄγγελον
  choice: स्वर्गदूत को
  rationale: ἄγγελος का सामान्य अर्थ ‘दूत’ हो सकता है, पर तोबीत 12 में यह पात्र एक स्वर्गीय प्राणी के रूप में पहचाना जाता है; इसलिए ‘स्वर्गदूत’ उपयुक्त है।
- source_word: Λάβε
  choice: ले लो
  rationale: λαμβάνω की आज्ञार्थक क्रिया यहाँ पारिश्रमिक का भाग स्वीकार करने के प्रस्ताव में है। ‘ले लो’ सीधे ‘लो’ की अपेक्षा स्वाभाविक और विनम्र है।
- source_word: τὸ ἥμισυ
  choice: आधा
  rationale: यह पद किसी समग्र राशि या वस्तु के आधे भाग को दर्शाता है; हिन्दी में ‘आधा’ सहज समतुल्य है।
- source_word: πάντων
  choice: जो कुछ… उसका
  rationale: πάντων व्यापक रूप से ‘सब कुछ’ को सूचित करता है। अधूरे संबंधवाचक वाक्य के साथ हिन्दी संरचना के लिए इसे ὧν के साथ मिलाकर ‘जो कुछ… उसका’ किया गया है।
- source_word: ὧν
  choice: जो कुछ… उसका
  rationale: ὧν संबंधवाचक सर्वनाम है, पर उपलब्ध यूनानी अंश इसके बाद बीच वाक्य में समाप्त होता है। दीर्घविराम उस अनुपलब्ध सामग्री को स्पष्ट करता है, जबकि हिन्दी में संबंधवाचक ढाँचा बचा रहता है।
