translation:
  language: hi
  text: क्योंकि वह मुझे स्वस्थ अवस्था में आपके पास ले आया, उसने मेरी पत्नी को चंगा किया और मेरा धन ले आया, और उसी प्रकार उसने आपको भी चंगा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑγιῆ
  choice: स्वस्थ-सलामत
  rationale: यह विशेषण शारीरिक स्वस्थता और सकुशल लौटने—दोनों का भाव दे सकता है; संयुक्त अभिव्यक्ति प्रसंग में इस व्यापक अर्थ को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: क्रिया का अर्थ रोग या दुर्बलता से स्वस्थ करना है; ‘चंगा किया’ पत्नी और पिता, दोनों के उपचार के लिए उपयुक्त और गरिमापूर्ण है।
- source_word: τὸ ἀργύριόν μου ἤνεγκεν
  choice: मेरा धन वापस ले आया
  rationale: ἀργύριον का संदर्भ यहाँ चाँदी अथवा धनराशि से है; प्रसंगगत वापसी को स्पष्ट करने के लिए ‘वापस ले आया’ रखा गया है।
- source_word: ὁμοίως
  choice: उसी प्रकार
  rationale: यह पत्नी के चंगे किए जाने और पिता के चंगे किए जाने के बीच स्पष्ट समानता बनाए रखता है।
