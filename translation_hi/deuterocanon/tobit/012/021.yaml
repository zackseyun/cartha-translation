lexical_decisions:
- source_word: ἀνέστησαν
  choice: उठ खड़े हुए
  rationale: यह ἀνίστημι का सरल कथात्मक प्रयोग है और शारीरिक रूप से उठने की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐκ εἶδον
  choice: दिखाई नहीं दिया
  rationale: ग्रीक का शाब्दिक अर्थ ‘उन्होंने उसे नहीं देखा’ है। हिन्दी में ‘उन्हें वह दिखाई नहीं दिया’ उसी प्रेक्षणात्मक दृष्टिकोण को सहज रूप से बनाए रखता है और असमर्थता या लुप्त होने की प्रक्रिया को स्पष्ट रूप से नहीं जोड़ता।
- source_word: αὐτόν
  choice: वह
  rationale: पुल्लिंग एकवचन कर्मवाचक सर्वनाम का संदर्भ प्रसंग में राफाएल से है; हिन्दी वाक्य-विन्यास में ‘उन्हें वह दिखाई नहीं दिया’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: क्या निहित अलौकिक अदृश्य होने को स्पष्ट रूप से कहा जाए
  choice: 'घटना को देखने वालों के अनुभव के रूप में रखना: ‘उन्हें वह दिखाई नहीं दिया’'
  alternative: वह उनकी आँखों से ओझल हो गया / वे उसे फिर नहीं देख सके
  rationale: ग्रीक मनुष्यों द्वारा देखे गए परिणाम को बताता है, पर उसके अदृश्य होने की प्रक्रिया को सीधे नहीं कहता। यह अनुवाद उसी संयम और निहित अलौकिक अर्थ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और कथात्मक। ‘पर’ प्रसंगगत परिणाम/विरोध को स्वाभाविक बनाता है, जबकि मूल के καί की कथात्मक कड़ी बनी रहती है।
