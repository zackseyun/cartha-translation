translation:
  language: hi
  text: और वृद्ध ने कहा, “यह उसके लिए उचित है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρεσβύτης
  choice: वृद्ध
  rationale: यह संज्ञा आयु में बड़े पुरुष को सूचित करती है; यहाँ संक्षिप्त और तटस्थ ‘वृद्ध’ मूल के सबसे निकट है।
- source_word: Δικαιοῦται αὐτῷ
  choice: यह उसके लिए उचित है
  rationale: यूनानी पदबंध में क्रिया तीसरे पुरुष एकवचन में है और αὐτῷ संप्रदान कारक में है। यह अनुवाद कथन की संक्षिप्तता और ‘उसके लिए न्यायोचित/उचित होने’ का भाव रखता है, बिना प्रसंग से ‘मज़दूरी’ या ‘हक़’ जैसे अनकहे शब्द जोड़ने के।
theological_decisions:
- issue: Δικαιοῦται को किसी व्यक्ति के धार्मिक ठहराए जाने के रूप में पढ़ना
  choice: इसे ‘यह उसके लिए उचित है’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘वह धर्मी ठहराया जाता है’ या ‘यह उसका हक़ है।’
  rationale: αὐτῷ का संप्रदान रूप और प्रसंग एक वस्तु या प्रस्ताव के उसके लिए उचित होने की ओर संकेत करते हैं। चुना हुआ पाठ धार्मिक ठहराए जाने का अनावश्यक धर्मशास्त्रीय अर्थ नहीं जोड़ता और ‘हक़’ जैसे अधिक स्पष्ट, पर मूल में अनकहे, अर्थ को भी मुख्य पाठ में नहीं डालता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। ‘वृद्ध’ मूल की संज्ञा को सीधे रखता है और ‘यह उसके लिए उचित है’ यूनानी कथन की असामान्य संक्षिप्तता तथा अर्थगत खुलापन बनाए रखता है।
