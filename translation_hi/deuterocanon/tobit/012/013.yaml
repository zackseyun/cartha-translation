review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal actions: prompt rising, leaving the meal, going to attend to the dead person, Raphael''s awareness, and his presence. The purpose relation is clearer if ''के लिए'' is retained. The Greek participle ἀγαθοποιῶν is better expressed idiomatically as Tobit''s ''भला काम'' in this immediate context rather than the awkward abstract phrase ''तुम्हारा भलाई करना.'''
  naturalness: The overall register is clear modern standard Hindi. 'तुम्हारा भलाई करना' is grammatically possible but noticeably less natural than 'तुम्हारा यह भला काम.' Moving the meal note directly to 'भोजन' also makes the reading flow and note reference clear.
  terminology: ‘मृत व्यक्ति’ appropriately preserves the personal reference of τὸν νεκρόν without prematurely substituting ‘शव.’ ‘लपेटने’ is a suitably close rendering of περιστείλῃς, with the broader burial-preparation sense preserved in the note. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: Footnote b is anchored at the end of the verse rather than on ‘भोजन.’
    rationale: Its content concerns ἄριστον (‘meal’), so its anchor must immediately follow ‘भोजन’ for an unambiguous and usable note reference.
  - severity: low
    issue: ‘तुम्हारा भलाई करना’ is unnatural Hindi.
    rationale: It is a literalized verbal noun construction. ‘तुम्हारा यह भला काम’ is idiomatic while retaining the contextual reference to Tobit's beneficent action.
  - severity: low
    issue: The purpose relation is slightly underexpressed in ‘लपेटने गए.’
    rationale: Adding ‘के लिए’ naturally represents ὅπως and makes explicit that Tobit went in order to perform the action.
