base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/013.yaml
  text: And when you did not hesitate to rise and leave your meal so that you might go and wrap the dead man[a], your doing good did not escape me[b], but I was with you.
translation:
  language: hi
  text: और जब तुम बिना हिचक उठे और अपना भोजन[b] छोड़कर उस मृत व्यक्ति को लपेटने[a] के लिए गए, तब तुम्हारा यह भला काम मुझसे छिपा न रहा; बल्कि, मैं तुम्हारे साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस मृत व्यक्ति को दफ़न के लिए तैयार करने।” यूनानी क्रिया शव को लपेटने या अन्य प्रकार से व्यवस्थित करने के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में “भोजन” के लिए ऐसा शब्द है जो दिन के प्रमुख भोजन को सूचित कर सकता है; यहाँ दिन का ठीक समय नहीं बताया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ὤκνησας
  choice: बिना हिचक
  rationale: यह यूनानी अभिव्यक्ति हिचकिचाने, संकोच करने या देर लगाने का भाव देती है। ‘बिना हिचक’ तत्परता और प्रशंसा—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀναστῆναι
  choice: उठे
  rationale: संदर्भ में इसका अर्थ भोजन के पास से उठना है; ‘उठे’ स्वाभाविक और मूल के निकट है।
- source_word: καταλιπεῖν τὸ ἄριστόν σου
  choice: अपना भोजन छोड़कर
  rationale: ἄριστον किसी भोजन, प्रायः दिन के प्रमुख भोजन, को सूचित कर सकता है; समय निश्चित न होने के कारण ‘भोजन’ अनावश्यक विशिष्टीकरण से बचता है।
- source_word: ὅπως ἀπελθὼν
  choice: गए
  rationale: यूनानी रचना प्रयोजन के साथ जाकर कार्य करने को व्यक्त करती है। हिन्दी में पूर्ववर्ती ‘छोड़कर’ और अगले क्रियार्थ के साथ ‘गए’ इस गति और उद्देश्य को स्वाभाविक रूप देता है।
- source_word: περιστείλῃς τὸν νεκρόν
  choice: उस मृत व्यक्ति को लपेटने
  rationale: περιστέλλω शव को लपेटने, ढकने या दफ़न के लिए व्यवस्थित करने का अर्थ दे सकता है। ‘लपेटने’ मूल क्रिया की ठोस छवि बनाए रखता है और पूर्ण दफ़न की क्रिया नहीं जोड़ता।
- source_word: οὐκ ἔλαθές με
  choice: मुझसे छिपा न रहा
  rationale: λανθάνω की यह रचना किसी बात के ध्यान से न छूटने या गुप्त न रहने का भाव देती है। यह हिन्दी में स्वाभाविक है और वक्ता की जानकारी को स्पष्ट रखती है।
- source_word: ἀγαθοποιῶν
  choice: तुम्हारा भलाई करना
  rationale: यह क्रियात्मक कृदंत है। ‘भलाई करना’ उसे केवल एक संज्ञात्मक ‘अच्छा काम’ में सीमित किए बिना नैतिक और क्रियात्मक बल बनाए रखता है।
- source_word: σὺν σοὶ ἤμην
  choice: मैं तुम्हारे साथ था
  rationale: यह सीधा अनुवाद रफ़ाएल की उपस्थिति के कथात्मक दावे को बिना विस्तार दिए सुरक्षित रखता है।
theological_decisions:
- issue: रफ़ाएल की उपस्थिति और जानकारी का स्वरूप
  choice: पद को इस सीधे कथन के रूप में रखा गया है कि तोबीत का भला करना रफ़ाएल से छिपा नहीं रहा और वह उसके साथ था।
  alternative: इसे विशेष स्वर्गदूतीय सर्वज्ञता, संरक्षण या मध्यस्थता के व्यापक सिद्धांत के रूप में स्पष्ट किया जा सकता था।
  rationale: यूनानी पाठ तत्काल कथानक में केवल जानकारी और साथ होने का दावा करता है। अनुवाद इससे आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘मृत व्यक्ति’ सामान्य पाठक के लिए स्पष्ट है; ‘शव’ की अपेक्षा यह व्यक्ति-केंद्रित भाव बनाए रखता है। भोजन के समय और शव-सज्जा की सीमा संबंधी मूल अस्पष्टता पादटिप्पणियों में सुरक्षित है।
