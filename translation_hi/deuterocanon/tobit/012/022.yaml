translation:
  language: hi
  text: और वे उसके महान और अद्भुत कामों का खुले तौर पर बखान करते रहे[a], क्योंकि[b] प्रभु का एक स्वर्गदूत[c] उन्हें दिखाई दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसके महान और अद्भुत कामों को खुले रूप से स्वीकार करते थे / उनके लिए धन्यवाद देते थे।” यूनानी क्रिया प्रसंग के अनुसार अंगीकार, खुली स्वीकृति, धन्यवाद या स्तुति का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “कि कैसे।” यहाँ यूनानी शब्द कारण भी बता सकता है और उनके बखान की विषय-वस्तु भी प्रस्तुत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “प्रभु का एक स्वर्गदूत।” कुछ अनुवादों में “प्रभु का स्वर्गदूत” मिलता है, पर यहाँ यूनानी पाठ निश्चित अर्थ की माँग नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογοῦντο
  choice: खुले तौर पर बखान करने लगे
  rationale: क्रिया खुले रूप से स्वीकार करने, धन्यवाद देने या स्तुति करने का भाव दे सकती है। यहाँ उसके कर्म इसका कर्म हैं, इसलिए ‘बखान’ सार्वजनिक रूप से उन कामों को स्वीकार करने और सुनाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; अपूर्ण भूतकाल को ‘करने लगे’ से प्रसंगानुकूल कथात्मक रूप दिया गया है।
- source_word: τὰ ἔργα τὰ μεγάλα καὶ θαυμαστὰ αὐτοῦ
  choice: उसके महान और अद्भुत कामों
  rationale: ‘काम’ ἔργα का सहज और निकट अर्थ है; ‘महान और अद्भुत’ दोनों विशेषणों को बनाए रखता है। αὐτοῦ को ‘उसके’ रखकर मूल का सर्वनाम और उसकी संदर्भगत खुलावट सुरक्षित रखी गई है।
- source_word: ὡς
  choice: क्योंकि
  rationale: यहाँ ὡς उनके बखान का आधार बताने वाला कारणसूचक अर्थ दे सकता है। हिन्दी में ‘क्योंकि’ कथानक-संबंध को स्पष्ट और स्वाभाविक बनाता है; ‘कि कैसे’ वाला संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ὤφθη
  choice: दिखाई दिया था
  rationale: ὤφθη का प्रचलित प्रकट होने वाला अर्थ है। ‘दिखाई दिया था’ निष्क्रिय रूप की छाया और बखान से पहले घट चुकी घटना, दोनों को व्यक्त करता है।
- source_word: ἄγγελος Κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: ἄγγελος के साथ लेख नहीं है, इसलिए ‘एक स्वर्गदूत’ अनिश्चित अर्थ को सुरक्षित रखता है और किसी विशिष्ट ‘प्रभु के दूत’ की पहचान नहीं थोपता।
theological_decisions:
- issue: ἄγγελος Κυρίου को निश्चित या अनिश्चित रूप में अनूदित करना
  choice: प्रभु का एक स्वर्गदूत
  alternative: प्रभु का स्वर्गदूत
  rationale: यूनानी पाठ में ἄγγελος से पहले लेख नहीं है। ‘एक’ अनिश्चित अर्थ को स्पष्ट करता है और ऐसी विशिष्ट धर्मवैज्ञानिक पहचान नहीं जोड़ता जिसकी इस शब्दावली में आवश्यकता नहीं है।
- issue: αὐτοῦ के संदर्भ को स्पष्ट करने के लिए ‘परमेश्वर’ जोड़ना या सर्वनाम बनाए रखना
  choice: उसके
  alternative: परमेश्वर के
  rationale: मूल में सर्वनाम है। ‘उसके’ रखने से संदर्भगत संबंध बना रहता है और अनुवाद मूल से अधिक स्पष्ट धर्मवैज्ञानिक पहचान नहीं जोड़ता।
