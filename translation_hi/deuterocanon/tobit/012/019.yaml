  text: All the days I was appearing to you[a], but I neither ate nor drank; rather, you were seeing a vision.
translation:
  language: hi
  text: उन सभी दिनों में मैं तुम्हें दिखाई देता रहा[a], पर मैंने न तो खाया, न पिया; बल्कि तुम एक दर्शन देख रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सभी दिनों में मैं तुम्हें दिखाई दिया ... पर तुम जो देख रहे थे, वह एक दर्शन था।” यूनानी की अपूर्ण भूतकाल की क्रियाएँ जारी रहने वाले भाव (“दिखाई देता रहा,” “देख रहे थे”) में या सामान्य भूतकाल की घटनाओं के रूप में समझी जा सकती हैं।
    reason: क्रिया-पक्ष से जुड़ा वैकल्पिक अनुवाद
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: उन सभी दिनों में
  rationale: यह पूरे संबंधित समय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और यूनानी के व्यापक काल-सूचक भाव को बनाए रखता है।
- source_word: ὠπτανόμην
  choice: मैं तुम्हें दिखाई देता रहा
  rationale: क्रिया के प्रकट होने अथवा दिखाई देने के अर्थ और अपूर्ण भूतकाल के जारी रहने वाले पक्ष—दोनों को व्यक्त करता है, बिना इस दृश्य उपस्थिति की प्रकृति को अतिरिक्त रूप से समझाए।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: सम्बन्धवाचक सम्प्रदान कारक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: οὐκ ἔφαγον οὐδὲ ἔπιον
  choice: मैंने न तो खाया, न पिया
  rationale: यूनानी की युग्मित नकारात्मक संरचना को संतुलित और सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: पहले कथन का केवल विरोध नहीं, बल्कि उसके स्थान पर सुधारात्मक स्पष्टीकरण प्रस्तुत करता है।
- source_word: ὅρασιν
  choice: एक दर्शन
  rationale: ὅρασις के अलौकिक दृश्य या प्रत्यक्षीकरण के अर्थ को व्यक्त करता है और उसे केवल भ्रम या दिखावा बनाकर नहीं प्रस्तुत करता।
- source_word: ὑμεῖς ἐθεωρεῖτε
  choice: तुम एक दर्शन देख रहे थे
  rationale: स्पष्ट सर्वनाम और अपूर्ण भूतकाल की जारी अनुभूति को बनाए रखता है; हिन्दी में यह वाक्यांश स्वाभाविक भी है।
theological_decisions:
- issue: राफाएल की दिखाई देने वाली उपस्थिति और उसके कार्यों की प्रकृति
  choice: पाठ यह कहता है कि राफाएल उन्हें दिखाई देता रहा, यद्यपि उसने वास्तव में खाया-पिया नहीं; वे जो देख रहे थे, उसे ‘दर्शन’ कहा गया है।
  alternative: इसे केवल ‘तुम्हें ऐसा लगा’ कहना, या यह मानना कि उन्होंने साधारण भौतिक घटनाओं को गलत समझा।
  rationale: यूनानी पाठ दिखाई देने, वास्तव में न खाने-पीने और दर्शकों द्वारा ὅρασις देखने के बीच स्पष्ट तनाव रखता है। अनुवाद उस तनाव को बनाए रखता है और स्वर्गदूत की देहधारिता के विषय में पाठ से आगे कोई निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘दर्शन’ बाइबिलीय सन्दर्भ में परिचित है, जबकि वाक्य-विन्यास बोलचाल से अधिक औपचारिक किंतु सहज है।
