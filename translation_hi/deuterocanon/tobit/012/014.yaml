  yaml_path: translation/deuterocanon/tobit/012/014.yaml
  text: And now God has sent me to heal you and Sarah your bride[a].
translation:
  language: hi
  text: और अब परमेश्वर ने मुझे तुम्हें और तुम्हारी बहू[a] सारा को चंगा करने के लिए भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी दुल्हन।” यूनानी शब्द νύμφη का अर्थ “दुल्हन/युवा पत्नी” या “बहू” हो सकता है; यहाँ संबोधन तोबीत से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: संयोजक और कालसूचक पद दोनों को सीधे रखते हुए राफाएल के कथन में आए परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπέστειλέν με ὁ θεὸς
  choice: परमेश्वर ने मुझे ... भेजा है
  rationale: ἀποστέλλω के पूर्ण हो चुके भेजने के कार्य और वर्तमान प्रसंग में उसके बने हुए परिणाम को हिन्दी के पूर्ण वर्तमान से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἰάσασθαί σε
  choice: तुम्हें ... चंगा करने के लिए
  rationale: ἰάομαι का व्यापक अर्थ ‘चंगा करना’ है; यह तोबीत की दृष्टिहीनता और सारा के कष्ट, दोनों पर लागू हो सकता है और उपचार का स्वरूप अनावश्यक रूप से सीमित नहीं करता।
- source_word: τὴν νύμφην σου Σάρραν
  choice: तुम्हारी बहू सारा
  rationale: वक्ता तोबीत को संबोधित कर रहा है और सारा उसके पुत्र तोबियास की पत्नी है, इसलिए सम्बन्धसूचक अर्थ ‘बहू’ प्रसंग में सर्वाधिक स्पष्ट है। यूनानी νύμφη में ‘दुल्हन/युवा पत्नी’ का अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: तोबीत के साथ सारा के सम्बन्ध में νύμφη का अर्थ
  choice: तुम्हारी बहू सारा
  alternative: तुम्हारी दुल्हन सारा / सारा, जो दुल्हन है
  rationale: νύμφη शब्द ‘बहू’ और ‘दुल्हन/युवा पत्नी’ दोनों अर्थ दे सकता है। क्योंकि संबोधन तोबीत से है, ‘तुम्हारी बहू’ पारिवारिक सम्बन्ध को सही ढंग से व्यक्त करता है; फिर भी विवाह-संबंधी वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है ताकि मूल की अर्थ-व्याप्ति दब न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘चंगा करना’ बाइबलीय संदर्भ में परिचित होने के साथ सामान्य पाठक के लिए भी स्पष्ट है।
