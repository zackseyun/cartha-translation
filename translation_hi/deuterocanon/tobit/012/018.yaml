base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/018.yaml
  text: For it was not by my own favor[a], but by the will of your God. Therefore bless him forever.
translation:
  language: hi
  text: क्योंकि यह मेरी अपनी कृपा[a] से नहीं, बल्कि तुम्हारे परमेश्वर की इच्छा से हुआ। इसलिए उसे सदा धन्य कहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी अपनी मेहरबानी।’ यूनानी χάρις का अर्थ ‘कृपा’ या ‘मेहरबानी’ हो सकता है; यहाँ आशय संभवतः राफाएल की अपनी पहल या उपकार से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: कृपा
  rationale: χάρις का सीधा अर्थ ‘कृपा’ या ‘अनुग्रह’ हो सकता है। यहाँ यह राफाएल की अपनी ओर से की गई मेहरबानी या पहल को सूचित करता है; ‘कृपा’ मूल की व्यापकता बनाए रखती है, और पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: θελήσει
  choice: इच्छा
  rationale: θέλημα यहाँ इच्छा या अभिप्राय बताता है। ‘तुम्हारे परमेश्वर की इच्छा’ हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: τοῦ θεοῦ ὑμῶν
  choice: तुम्हारे परमेश्वर
  rationale: यह संबंधसूचक पद सीधे संबोधित लोगों के परमेश्वर को दर्शाता है; एकवचन ‘तुम्हारे’ सामूहिक या आदरसूचक संबोधन के लिए भी सहज है।
- source_word: ὅθεν
  choice: इसलिए
  rationale: ὅθεν पिछले कथन से निकलने वाला निष्कर्ष और उसके आधार पर दी गई आज्ञा प्रस्तुत करता है।
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: εὐλογέω का शाब्दिक भाव किसी को धन्य कहना या उसका गुणगान करना है। परमेश्वर के संबंध में ‘धन्य कहो’ बाइबलीय गरिमा और आज्ञार्थक बल बनाए रखता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह यूनानी मुहावरा अनंत या निरंतर काल को दर्शाता है; ‘सदा’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἐμαυτοῦ
  choice: मेरी अपनी
  rationale: यह आत्मवाचक रूप निजी स्रोत या पहल पर बल देता है; ‘मेरी अपनी’ उस जोर को हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: राफाएल के कथन में χάρις का आशय
  choice: मुख्य पाठ में ‘मेरी अपनी कृपा’ रखा गया है, जबकि पादटिप्पणी इसे राफाएल की अपनी मेहरबानी या पहल के अर्थ में स्पष्ट करती है।
  alternative: ‘मेरी अपनी मेहरबानी’ या ‘अपनी ओर से की गई कृपा’ से अनुवाद करना।
  rationale: कथा का मुख्य बिंदु यह है कि राफाएल ने अपनी स्वतंत्र पहल से नहीं, बल्कि परमेश्वर की इच्छा से कार्य किया। फिर भी χάρις की वास्तविक शाब्दिक व्यापकता को केवल ‘पहल’ में सीमित करना उचित नहीं; इसलिए मुख्य पाठ और पादटिप्पणी मिलकर अर्थगत तनाव बनाए रखते हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘धन्य कहो’ ने εὐλογεῖτε की बाइबलीय अभिव्यक्ति को सुरक्षित रखा है; ‘हुआ’ प्रसंग में निहित घटना या सहायता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसका स्वरूप अनावश्यक रूप से निश्चित किए।
