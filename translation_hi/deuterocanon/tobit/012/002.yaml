  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। ‘पिताजी’ पारिवारिक आदर को स्वाभाविक ढंग से व्यक्त करता है। मुख्य पाठ यूनानी पर आधारित है; परोक्ष आधुनिक हिब्रू सामग्री को प्राचीन मूल-पाठ का साक्षी नहीं माना गया, केवल संदर्भगत पुष्टि के रूप में सीमित उपयोग किया गया है।
