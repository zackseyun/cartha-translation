  yaml_path: translation/deuterocanon/tobit/012/002.yaml
  text: And he said[a], “Father[b], I lose nothing by giving him half of what I have brought back.”
translation:
  language: hi
  text: और उसने कहा[a], “पिताजी, जो कुछ मैं वापस लाया हूँ[b], उसका आधा उसे देने पर भी मुझे कोई नुकसान नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “जो कुछ मैं वापस लाया हूँ, उसका आधा उसे दे देने पर मुझे हानि नहीं होती।” आशय यह है कि मार्गदर्शक को वापस लाई गई संपत्ति का आधा देने पर भी तोबियास घाटे में नहीं पड़ता।
    reason: lexical_alternative
  - marker: b
    text: सेमिटिक समानांतर में भी वहाँ से लाई गई धन-संपत्ति/वस्तुओं का आधा लेने का भाव है। यह समानांतर ‘वापस लाया हूँ’ की प्रसंगगत समझ का समर्थन करता है, पर स्वयं प्राचीन हिब्रू मूल-पाठ का साक्षी नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: Πάτερ
  choice: पिताजी
  rationale: यह पिता को किया गया सीधा संबोधन है। आधुनिक हिन्दी में ‘पिताजी’ स्वाभाविक, आदरपूर्ण और आत्मीय है; यूनानी में निहित संबंध को स्पष्ट करने के लिए अलग से ‘मेरे’ की आवश्यकता नहीं।
- source_word: οὐ βλάπτομαι
  choice: मुझे कोई हानि नहीं होगी
  rationale: यह रूप इस प्रसंग में भुगतान के कारण घाटे या नुकसान में न पड़ने का भाव देता है। ‘कोई हानि नहीं होगी’ आर्थिक अर्थ को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: δοὺς
  choice: दे देने से
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से जुड़ी परिस्थिति या साधन बताता है। ‘दे देने से’ पूर्ण भुगतान की कल्पना और उसके परिणाम, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: αὐτῷ
  choice: उसे
  rationale: यह रफाएल/अजर्याह की ओर संकेत करने वाला अप्रत्यक्ष कर्म है।
- source_word: τὸ ἥμυσυ
  choice: आधा
  rationale: नपुंसकलिंग संज्ञात्मक प्रयोग का सामान्य और स्पष्ट हिन्दी प्रतिरूप।
- source_word: ὧν ἐνήνοχα
  choice: जो कुछ मैं वापस लाया हूँ, उसका
  rationale: परफेक्ट क्रिया पूरी हो चुकी और वर्तमान में प्रासंगिक क्रिया को दर्शाती है। यात्रा से लौटकर लाई गई धन-संपत्ति के संदर्भ में ‘वापस लाया हूँ’ उपयुक्त है; परोक्ष सेमिटिक समानांतर भी ‘वहाँ से लाए’ धन का भाव पुष्ट करता है।
