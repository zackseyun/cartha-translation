  yaml_path: translation/deuterocanon/tobit/012/011.yaml
  text: I will certainly not hide any word from you[a]. I have indeed said, ‘It is good to hide a king’s secret[b], but to reveal the works of God gloriously.’
translation:
  language: hi
  text: मैं तुमसे कोई भी बात निश्चय ही नहीं छिपाऊँगा। मैंने तो कहा है, “राजा का रहस्य[a] छिपाना अच्छा है, पर परमेश्वर के कार्यों को महिमा के साथ[b] प्रकट करना अच्छा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् राजा की कोई गोपनीय बात; यहाँ ‘रहस्य’ आवश्यक रूप से कोई धर्मवैज्ञानिक रहस्य नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “सम्मानपूर्वक” अथवा “गौरवपूर्वक।” यह क्रियाविशेषण परमेश्वर के कार्यों को प्रकट करने के उचित ढंग का वर्णन कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ κρύψω
  choice: निश्चय ही नहीं छिपाऊँगा
  rationale: οὐ μή के साथ aorist subjunctive प्रबल निषेध और भविष्य का भाव देता है। यह अनुवाद उस दृढ़ आश्वासन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀφʼ ὑμῶν
  choice: तुमसे
  rationale: κρύπτω के साथ ἀπό और संबंधकारक किसी व्यक्ति से कोई बात छिपाने या रोक रखने का भाव व्यक्त करते हैं।
- source_word: πᾶν ῥῆμα
  choice: कोई भी बात
  rationale: शाब्दिक अर्थ ‘हर वचन/बात’ है; प्रसंग में आशय है कि राफाएल जो बताने वाला है, उसमें से कुछ भी नहीं छिपाएगा।
- source_word: εἴρηκα δὴ
  choice: मैं सच ही कह चुका हूँ
  rationale: Perfect εἴρηκα पहले कही गई और अब भी प्रासंगिक बात को दर्शाता है, जबकि δή बल देता है। ‘सच ही’ इस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: μυστήριον βασιλέως
  choice: राजा का रहस्य
  rationale: यहाँ μυστήριον किसी राजा की गोपनीय बात है, न कि अनिवार्य रूप से कोई धर्मवैज्ञानिक रहस्य। ‘राजा का रहस्य’ अर्थ और सूक्तिपरक शैली दोनों बनाए रखता है।
- source_word: κρύψαι καλόν
  choice: छिपाना अच्छा है
  rationale: Infinitive और καλόν मिलकर एक सामान्य सूक्ति व्यक्त करते हैं। हिन्दी में यह रचना संक्षिप्त और स्वाभाविक है।
- source_word: τὰ δὲ ἔργα τοῦ θεοῦ
  choice: पर परमेश्वर के कार्यों को
  rationale: δέ पहले खंड के साथ विरोध दिखाता है और ἔργα परमेश्वर के कामों या कृत्यों के व्यापक अर्थ को रखता है।
- source_word: ἀνακαλύπτειν
  choice: प्रकट करना
  rationale: क्रिया का अर्थ ढकी हुई बात को खोलना या ज्ञात कराना है। ‘प्रकट करना’ पहले खंड के ‘छिपाना’ के साथ स्पष्ट विरोध बनाता है।
- source_word: ἐνδόξως
  choice: महिमा के साथ
  rationale: क्रियाविशेषण का अर्थ महिमामय, गौरवपूर्ण या सम्मानजनक ढंग से हो सकता है। ‘महिमा के साथ’ मूल के δόξα-संबंधी भाव को बचाता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बुद्धि-साहित्य के प्रसंग में μυστήριον का अर्थ
  choice: रहस्य, अर्थात गोपनीय बात
  alternative: भेद या धर्मवैज्ञानिक रहस्य
  rationale: इस पद में शब्द राजकीय गोपनीयता को सूचित करता है। ‘रहस्य’ हिन्दी में उस अर्थ को रखता है, और पादटिप्पणी स्पष्ट करती है कि यहाँ बाद की धर्मवैज्ञानिक धारणा आरोपित नहीं की जानी चाहिए।
- issue: ἐνδόξως में महिमा और सम्मान के बीच अर्थगत तनाव
  choice: महिमा के साथ
  alternative: सम्मानपूर्वक / गौरवपूर्वक
  rationale: मूल क्रियाविशेषण दोनों छायाएँ ग्रहण कर सकता है। मुख्य पाठ परमेश्वर के कार्यों की घोषणा से जुड़ा महिमा का भाव रखता है, जबकि पादटिप्पणी रीति-सूचक ‘सम्मानपूर्वक’ अर्थ को सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण और सूक्तिपरक शैली अपनाई गई है। ‘तुमसे’ बहुवचन संबोधन के अनुरूप है। प्रबल निषेध को ‘निश्चय ही नहीं’ से और κρύψαι/ἀνακαλύπτειν के विरोध को ‘छिपाना/प्रकट करना’ से स्पष्ट रखा गया है।
