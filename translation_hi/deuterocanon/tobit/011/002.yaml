base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/002.yaml
  text: And Raphael said to Tobiah[a], “Do you not know, brother, how you left your father?”
translation:
  language: hi
  text: और रफ़ाएल ने तोबियाह से कहा, “भाई, क्या तुम नहीं जानते कि तुम अपने पिता को किस दशा में छोड़ आए थे?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम्हें याद नहीं कि तुम अपने पिता को कैसी दशा में छोड़ आए थे?” समानांतर सेमिटिक परंपरा पिता के अंधेपन को स्पष्ट करती है, पर यूनानी पाठ इसे संक्षेप में कहता है।
    reason: γινώσκεις और πῶς के प्रसंगगत विकल्प तथा समानांतर परंपरा की स्पष्टतर अभिव्यक्ति बताने के लिए।
lexical_decisions:
- source_word: Οὐ γινώσκεις
  choice: क्या तुम नहीं जानते
  rationale: γινώσκω का मूल अर्थ ‘जानना’ है; यहाँ प्रश्न तोबियाह को पहले से ज्ञात बात याद दिलाता है। यह अनुवाद ‘याद नहीं’ या ‘समझते नहीं’ की अपेक्षा यूनानी के अधिक निकट है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: सम्बोधन का शाब्दिक अर्थ ‘भाई’ है और यह आत्मीयता बनाए रखता है, भले ही यहाँ सगा भाई अभिप्रेत न हो।
- source_word: πῶς ἀφῆκες τὸν πατέρα σου
  choice: तुम अपने पिता को किस दशा में छोड़ आए थे
  rationale: πῶς शाब्दिक रूप से ‘कैसे’ है, पर इस प्रसंग में पिता की उस दशा की ओर संकेत करता है जिसमें तोबियाह उन्हें छोड़कर आया था। ‘किस दशा में’ स्वाभाविक हिन्दी में निहित अर्थ व्यक्त करता है, जबकि पिता के अंधेपन को मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ता।
- source_word: Ῥαφαὴλ πρὸς Τωβείαν
  choice: रफ़ाएल ने तोबियाह से
  rationale: व्यक्तिनामों को प्रचलित हिन्दी लिप्यंतरण में रखा गया है और πρὸς के वाचिक प्रयोग को ‘से कहा’ में स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: यूनानी के संक्षिप्त प्रश्न और समानांतर सेमिटिक परंपरा के विस्तृत कथन का संबंध
  choice: मुख्य पाठ में पिता की दशा का संकेत रखा गया है, पर अंधेपन को स्पष्टतः नहीं जोड़ा गया।
  alternative: “तुम जानते हो कि तुम्हारे पिता अंधे हैं।”
  rationale: प्राथमिक यूनानी पाठ पिता की दशा को πῶς के माध्यम से निहित रखता है। परोक्ष इब्रानी/अरामी-संबंधित परंपरा अंधेपन को स्पष्ट करती है, किंतु उसे यूनानी मुख्य पाठ में मिला देना स्रोत की संक्षिप्तता और वास्तविक निहितार्थ को बदल देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कथात्मक रूप। ‘किस दशा में छोड़ आए थे’ शाब्दिक ‘कैसे छोड़ा’ की अस्पष्ट हिन्दी से बचते हुए यूनानी में निहित दशागत अर्थ को सुरक्षित रखता है।
