  yaml_path: translation/deuterocanon/tobit/011/006.yaml
  text: And she noticed him coming and said to his father[a], “Look, my son is coming, and the man who went with him.”
translation:
  language: hi
  text: तब उसने उसे आते हुए देख लिया[a] और उसके पिता से कहा, “देखो, मेरा बेटा आ रहा है, और वह आदमी भी, जो उसके साथ गया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अर्थ ‘पहले ही देख लेना’, ‘ध्यान देना’ या ‘पहचान लेना’ हो सकता है। यहाँ वह उसे दूर से आते हुए देखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προενόησεν
  choice: देख लिया
  rationale: यह क्रिया यहाँ दूर से आते व्यक्ति को देख लेने या पहचान लेने का भाव देती है। ‘देख लिया’ स्वाभाविक हिन्दी है और पहचान की धारणा को मुख्य पाठ में आवश्यकता से अधिक निश्चित नहीं बनाती।
- source_word: ἐρχόμενον
  choice: आते हुए
  rationale: वर्तमान कृदंत वक्ता की ओर जारी गति व्यक्त करता है; ‘आते हुए’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचने वाला उद्गार है। ‘देखो’ आधुनिक हिन्दी में इसकी तात्कालिकता को सहज रूप से व्यक्त करता है।
- source_word: ὁ υἱός μου
  choice: मेरा बेटा
  rationale: मूल यूनानी के संबंधसूचक वाक्यांश का सीधा और सामान्य हिन्दी अनुवाद।
- source_word: ὁ ἄνθρωπος
  choice: वह आदमी
  rationale: मूल पाठ में संबंधसूचक शब्द ‘साथी’ नहीं, बल्कि सामान्य संज्ञा ‘आदमी’ है; ‘वह’ पहले से ज्ञात व्यक्ति की ओर संकेत को स्पष्ट करता है।
- source_word: ὁ πορευθεὶς μετʼ αὐτοῦ
  choice: जो उसके साथ गया था
  rationale: भूतकालिक कृदंत पहले आरम्भ हुई यात्रा की ओर संकेत करता है। यह रूप मूल के निकट और हिन्दी में स्पष्ट है।
