  text: And Raphael said[a], “I know that your father will open his eyes.”
translation:
  language: hi
  text: और रफ़ाएल ने कहा[a], “मैं जानता हूँ कि तुम्हारे पिता की आँखें खुल जाएँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं जानता हूँ कि तुम्हारे पिता की दृष्टि लौट आएगी।” यूनानी में शाब्दिक अभिव्यक्ति है, “तुम्हारे पिता अपनी आँखें खोलेंगे,” जो यहाँ दृष्टि लौटने का संकेत देती है।
    reason: शाब्दिक रूप और प्रसंगगत अर्थ—दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: Ῥαφαὴλ
  choice: रफ़ाएल
  rationale: यूनानी नाम का प्रचलित और स्वाभाविक हिन्दी लिप्यंतरण।
- source_word: Ἐπίσταμαι
  choice: मैं जानता हूँ
  rationale: यह क्रिया निश्चित ज्ञान व्यक्त करती है; ‘मैं जानता हूँ’ सीधा और स्वाभाविक अनुवाद है।
- source_word: ἀνοίξει τοὺς ὀφθαλμούς
  choice: आँखें खुल जाएँगी
  rationale: यूनानी में शाब्दिक रूप से ‘आँखें खोलेगा’ है, पर यहाँ यह दृष्टि लौटने का मुहावरा है। हिन्दी में ‘आँखें खुल जाएँगी’ उसी चित्रात्मक भाषा को रखते हुए अनचाहे आशय—सिर्फ पलकें खोलना—से बचाता है।
- source_word: ὁ πατήρ σου
  choice: तुम्हारे पिता
  rationale: यह सम्बोधित व्यक्ति के पिता को स्पष्ट रूप से दर्शाता है और आधुनिक मानक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: अंधेपन से चंगाई के लिए प्रयुक्त मुहावरा
  choice: मुख्य पाठ में ‘आँखें खुल जाएँगी’ रखकर आँख खुलने की स्रोत-भाषा की छवि बनाए रखना
  alternative: तुम्हारे पिता की दृष्टि लौट आएगी
  rationale: संदर्भ दृष्टि की बहाली का है, पर यूनानी पाठ सीधे ‘दृष्टि लौटना’ नहीं कहता। चित्रात्मक अभिव्यक्ति को बनाए रखने से कथन की साहित्यिक बनावट और उसका निहितार्थ दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रफ़ाएल’ और ‘पिता’ सामान्य पाठकों के लिए परिचित रूप हैं। मुख्य पाठ में स्वाभाविक हिन्दी मुहावरा रखा गया है, जबकि पाद-टिप्पणी यूनानी की सक्रिय संरचना और प्रसंगगत अर्थ बताती है।
