base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/001.yaml
  text: After these things[a], Tobiah also went on his way, blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: hi
  text: इन बातों के बाद तोबियाह भी परमेश्वर को धन्य कहता हुआ आगे चलता गया, क्योंकि परमेश्वर ने उसकी यात्रा को सफल बनाया था।[a] वह रगूएल और उसकी पत्नी एदना को बार-बार आशीर्वाद देता था। वह तब तक चलता गया, जब तक वे नीनवे के पास नहीं पहुँच गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने उसके मार्ग को सफल किया”; यह यूनानी मुहावरा बताता है कि परमेश्वर ने उसकी यात्रा को सफलता दी।
    reason: lexical_alternative
  - marker: b
    text: यह अंतिम यूनानी उपवाक्य व्याकरण की दृष्टि से कठिन है। इसका संभावित अर्थ है, “जब तक वे नीनवे के पास नहीं पहुँच गए”; इसे “जब तक वह नीनवे के पास नहीं पहुँच गया” भी समझा जा सकता है।
    reason: textual_uncertainty
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यूनानी के बहुवचन संकेतवाचक भाव को बनाए रखते हुए यह स्वाभाविक काल-संक्रमण है।
- source_word: ἐπορεύετο
  choice: आगे चलता गया / चलता गया
  rationale: अपूर्णकाल चलती हुई यात्रा को व्यक्त करता है; ‘चलता गया’ उसकी निरंतरता बनाए रखता है।
- source_word: εὐλογῶν τὸν θεόν
  choice: परमेश्वर को धन्य कहता था
  rationale: यह εὐλογέω का निकट और स्वाभाविक हिन्दी रूप है तथा ‘स्तुति’ कहकर मूल की विशिष्ट शब्दावली को सामान्यीकृत नहीं करता।
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: क्योंकि परमेश्वर ने उसकी यात्रा सफल की थी
  rationale: यूनानी मुहावरे का आशय है कि परमेश्वर ने उसके मार्ग को सफलता दी; स्पष्ट कर्ता जोड़कर दैवी कारण को स्वाभाविक हिन्दी में रखा गया है।
- source_word: κατευλόγει
  choice: बार-बार आशीर्वाद देता था
  rationale: अपूर्णकाल और सघन उपसर्ग निरंतर अथवा पुनरावृत्त आशीर्वाद का संकेत देते हैं।
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: रगूएल और उसकी पत्नी एदना
  rationale: यूनानी में एदना को रगूएल की पत्नी बताया गया है; हिन्दी में संबंध को अस्पष्ट होने से बचाने के लिए स्वाभाविक क्रम अपनाया गया है।
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: जब तक वे नीनवे के पास नहीं पहुँच गए
  rationale: वाक्यांश का प्रेषित यूनानी रूप कठिन है, पर बहुवचन क्रिया और यात्रा-संदर्भ नीनवे के निकट पहुँचने की ओर संकेत करते हैं; कठिनता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: θεός का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: इस्राएल के परमेश्वर के लिए हिन्दी बाइबिलीय गद्य में यह स्पष्ट, प्रतिष्ठित और सामान्य पद है; इससे कोई संप्रदायगत विशेषता नहीं जोड़ी जाती।
- issue: कठिन अंतिम उपवाक्य ἤγγισαν αὐτὸν εἰς Νινευή
  choice: वह तब तक चलता गया, जब तक वे नीनवे के पास नहीं पहुँच गए
  alternative: वह तब तक चलता गया, जब तक वह नीनवे के पास नहीं पहुँच गया
  rationale: मुख्य क्रिया एकवचन है, जबकि कठिन अंतिम उपवाक्य की क्रिया बहुवचन है। अनुवाद दोनों वचनों को बनाए रखता है और पादटिप्पणी में वैकल्पिक एकवचन समझ को स्वीकार करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक गद्य अपनाया गया है। ‘धन्य कहता था’ और ‘आशीर्वाद देता था’ मूल की समान मूल-शब्दावली को यथासंभव बनाए रखते हैं। अंतिम वाक्य में यूनानी के एकवचन और बहुवचन के तनाव को चुपचाप समतल नहीं किया गया।
