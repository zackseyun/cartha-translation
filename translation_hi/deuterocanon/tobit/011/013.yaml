- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: वह उससे लिपट गया
  rationale: यह गर्दन पर गिरने का पारंपरिक मुहावरा है, जिसका आशय भावुक आलिंगन है। शाब्दिक हिन्दी अस्वाभाविक होती, इसलिए मुहावरे का आशय मुख्य पाठ में दिया गया है और स्रोत-बिंब पादटिप्पणी में सुरक्षित है।
