translation:
  language: hi
  text: आओ, हम तुम्हारी पत्नी से आगे दौड़कर घर तैयार करें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘तुम्हारी पत्नी’ है। कथा के व्यापक प्रसंग के कारण कुछ पाठक यहाँ परिवार के किसी अन्य सदस्य का उल्लेख अपेक्षित समझ सकते हैं, पर उपलब्ध यूनानी साक्षी ‘तुम्हारी पत्नी’ ही पढ़ता है; इसलिए अनुवाद उसी का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: προδράμωμεν
  choice: आओ, हम ... आगे दौड़कर
  rationale: यह अओरिस्ट सब्जंक्टिव प्रोत्साहनसूचक है—‘आओ, हम आगे दौड़ें।’ ‘आगे दौड़कर’ मूल की तीव्र और सजीव गति को बनाए रखता है।
- source_word: ἔμπροσθεν
  choice: से आगे
  rationale: गति-सूचक क्रिया के साथ यह आगे निकलने या किसी के आगे जाने का भाव देता है। हिंदी में ‘से आगे दौड़कर’ स्वाभाविक है।
- source_word: τῆς γυναικός σου
  choice: तुम्हारी पत्नी
  rationale: γυνή का अर्थ स्त्री भी हो सकता है, पर संबंधसूचक σου और प्रसंग में इसका वैवाहिक अर्थ ‘पत्नी’ है।
- source_word: ἑτοιμάσωμεν
  choice: तैयार करें
  rationale: यह भी प्रोत्साहनसूचक सब्जंक्टिव है और पहली क्रिया के समानांतर है। ‘तैयार करें’ स्पष्ट और गरिमापूर्ण आधुनिक हिंदी है।
- source_word: τὴν οἰκίαν
  choice: घर
  rationale: οἰκία का अर्थ घर या घराना हो सकता है। आगमन से पहले व्यवस्था करने के इस प्रसंग में भौतिक निवास ‘घर’ अधिक संभावित है।
