- source_word: ἐκάθητο
  choice: बैठी हुई थी
  rationale: अपूर्ण काल हन्ना के लगातार बैठे रहने की अवस्था बताता है; संयुक्त वाक्य में ‘बैठी हुई ... देख रही थी’ स्वाभाविक हिन्दी है।
- source_word: περιβλεπομένη
