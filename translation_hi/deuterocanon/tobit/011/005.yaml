- source_word: εἰς τὴν ὁδόν
  choice: राह
  rationale: ὁδός यहाँ उस मार्ग को सूचित करता है जिससे उसका बेटा लौटने वाला था। ‘राह’ आधुनिक हिन्दी में इस प्रसंग और ‘राह देखना’ मुहावरे, दोनों के अनुकूल है।
- source_word: τὸν παῖδα αὐτῆς
  choice: अपने बेटे की
  rationale: παῖς प्रसंग में हन्ना के पुत्र तोबियाह को सूचित करता है। यूनानी की संक्षिप्त रचना को हिन्दी में ‘अपने बेटे की राह देख रही थी’ स्वाभाविक ढंग से व्यक्त करती है।
