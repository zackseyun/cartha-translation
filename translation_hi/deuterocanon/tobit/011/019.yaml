  text: और टोबियाह का विवाह सात दिन तक आनन्द के साथ मनाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: मनाया गया
  rationale: ἄγω का यह कर्मवाच्य रूप किसी आयोजन को सम्पन्न करने या मनाने के अर्थ में है; विवाह के प्रसंग में ‘मनाया गया’ स्वाभाविक हिन्दी है और कर्मवाच्य भाव भी बनाए रखता है।
- source_word: ὁ γάμος
  choice: विवाह
  rationale: γάμος विवाह अथवा उसके उत्सव को सूचित कर सकता है। सात दिनों और आनन्द के उल्लेख के कारण यहाँ विवाह-समारोह अभिप्रेत है; ‘विवाह ... मनाया गया’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: Τωβεία
  choice: टोबियाह का
  rationale: यह सम्बन्धकारक व्यक्तिवाचक नाम है। ‘टोबियाह’ मूल नाम का देवनागरी लिप्यन्तरण है और ‘का’ उसके सम्बन्ध को स्पष्ट करता है।
- source_word: μετʼ εὐφροσύνης
  choice: बड़े आनन्द के साथ
  rationale: यह पद उत्सव के साथ रहने वाले हर्ष को व्यक्त करता है। ‘आनन्द के साथ’ संज्ञात्मक रूप बनाए रखता है; ‘बड़े’ से प्रसंग का उल्लासपूर्ण उत्सवी भाव सहज हिन्दी में उभरता है।
- source_word: ἑπτὰ ἡμέρας
  choice: सात दिन तक
  rationale: यह अवधि बताने वाला कर्मकारक है। हिन्दी में ‘सात दिन तक’ उसकी कालावधि को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
