- source_word: συνεδήχθησαν
  choice: वे एक-दूसरे से मिले
  rationale: पाठ में प्रयुक्त क्रिया साथ आने या मिलने का अर्थ देती है। यह अनुवाद पुनर्मिलन की सम्भावना रखता है, पर उसे आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: διέτριψε
  choice: मलीं
  rationale: क्रिया का मूल अर्थ रगड़ना या मलना है। आँखों के सन्दर्भ में ‘आँखें मलीं’ स्वाभाविक है और उपचार की ऐसी अतिरिक्त विधि नहीं जोड़ता जो इस खंड में स्पष्ट नहीं है।
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: उनकी आँखें
  rationale: सन्दर्भ में सर्वनाम तोबित की आँखों को सूचित करता है। आदरसूचक हिन्दी के अनुसार ‘उनकी’ प्रयोग किया गया है।
