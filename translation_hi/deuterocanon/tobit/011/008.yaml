  yaml_path: translation/deuterocanon/tobit/011/008.yaml
  text: You shall anoint his eyes with the gall[a], and when it stings, he will rub them, and the white films will come away[c][b], and he will see you.
translation:
  language: hi
  text: तुम उसकी आँखों में पित्त[a] लगा देना। जब उसे चुभन होगी[b], तो वह उन्हें मलेगा और सफ़ेद परतें[c] उतर जाएँगी, और वह तुम्हें देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पित्त-रस।’ यूनानी शब्द पित्त को दर्शाता है, जिसका यहाँ औषधीय पदार्थ के रूप में उपयोग किया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जब उसे काटा या डँसा जाए’; यूनानी में आँखों में होने वाली तीखी चुभन के लिए सजीव शारीरिक भाषा है।
    reason: lexical_alternative
  - marker: c
    text: या ‘सफ़ेद धब्बे’ अथवा ‘सफ़ेद झिल्लियाँ।’ यह शब्द आँखों की सफ़ेद अपारदर्शिताओं को दर्शाता है; इसका अर्थ आवश्यक रूप से आधुनिक चिकित्सकीय अर्थ में ‘मोतियाबिंद’ नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγχρισον
  choice: लगा देना
  rationale: ἐγχρίω किसी पदार्थ को मलकर या फैलाकर लगाने की आज्ञा देता है। यहाँ ‘लगा देना’ स्वाभाविक आधुनिक हिन्दी है और क्रिया की प्रक्रिया को अनावश्यक धार्मिक अर्थ दिए बिना व्यक्त करता है।
- source_word: χολὴν
  choice: पित्त
  rationale: χολή का मूल अर्थ पित्त है; प्रसंग में इसे औषधीय पदार्थ के रूप में आँखों पर लगाया जाता है।
- source_word: δηχθεὶς
  choice: जब उससे चुभन होगी
  rationale: यह कृदन्त काटने या डंक जैसी तीखी अनुभूति का बोध देता है। हिन्दी में ‘चुभन होगी’ आँखों पर पड़ने वाले प्रभाव को स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी यूनानी की सजीव शारीरिक भाषा बताती है।
- source_word: διατρίψει
  choice: वह उन्हें मलेगा
  rationale: क्रिया अच्छी तरह रगड़ने या मलने का संकेत देती है। पूर्ववर्ती ‘आँखों’ के आधार पर ‘उन्हें’ जोड़ा गया है।
- source_word: ἀποβαλεῖται
  choice: उतर जाएँगी
  rationale: मध्यवाच्य रूप रगड़ने के परिणामस्वरूप सफ़ेद परतों के हट जाने को दर्शाता है। ‘उतर जाएँगी’ सहज हिन्दी है और अनावश्यक कर्तृवाच्य नहीं थोपता।
- source_word: τὰ λευκώματα
  choice: सफ़ेद झिल्लियाँ
  rationale: यह शब्द आँखों पर सफ़ेद अपारदर्शी धब्बों या परतों का संकेत करता है। ‘झिल्लियाँ’ पाठक को दृश्य रूप समझाती हैं, पर आधुनिक चिकित्सकीय निदान ‘मोतियाबिंद’ नहीं थोपतीं।
- source_word: ὄψεταί σε
  choice: वह तुम्हें देखेगा
  rationale: यूनानी पाठ सीधे यही कहता है। दृष्टि लौटने का भाव प्रसंग में निहित है, इसलिए उसे अलग से नहीं जोड़ा गया।
