translation:
  language: hi
  text: और उसने अपने पिता को थाम लिया और अपने पिता की आँखों पर पित्त लगाया, यह कहते हुए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάβετο
  choice: थाम लिया
  rationale: यह मध्यम रूप किसी को पकड़ने या थामने की ठोस क्रिया बताता है। संदर्भ में तोबियास औषधि लगाने से पहले अपने पिता को थामता है; यह अनावश्यक रूप से आलिंगन या केवल सहारा देने का अर्थ नहीं जोड़ता।
- source_word: προσέπασεν
  choice: लगाया
  rationale: क्रिया किसी पदार्थ को किसी सतह पर लगाने या पोतने को व्यक्त करती है। औषधीय संदर्भ में ‘लगाया’ सहज, स्पष्ट और आधुनिक हिन्दी है।
- source_word: χολήν
  choice: पित्त
  rationale: χολή का शाब्दिक अर्थ पित्त है और कथा में मछली से प्राप्त उपचारक पदार्थ इसी को कहा गया है। ‘पित्त’ हिन्दी में सटीक और सामान्यतः समझा जाने वाला शब्द है।
- source_word: ὀφθαλμούς
  choice: आँखों
  rationale: ὀφθαλμοί का सामान्य और स्वाभाविक हिन्दी समतुल्य ‘आँखें’ है।
- source_word: λέγων
  choice: वह कह रहा था
  rationale: वर्तमान कृदन्त अगली आयत में आने वाले कथन से वाक्य को जोड़ता है। हिन्दी में ‘वह कह रहा था’ इस जारी क्रिया और आगे खुलने वाली वाणी को स्वाभाविक रूप से बनाए रखता है।
