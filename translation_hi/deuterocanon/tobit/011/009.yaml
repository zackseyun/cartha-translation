lexical_decisions:
- source_word: προσδραμοῦσα
  choice: दौड़कर आई
  rationale: यह कृदन्त किसी की ओर दौड़कर आने का सजीव भाव व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον
  choice: गले से लिपट गई
  rationale: यूनानी का शाब्दिक चित्र ‘गर्दन पर गिर पड़ी’ है, पर यह भावपूर्ण आलिंगन का मुहावरा है। हिन्दी में ‘गले से लिपट गई’ अर्थ और भाव दोनों को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: τοῦ υἱοῦ αὐτῆς
  choice: अपने बेटे के
  rationale: υἱός का विशिष्ट अर्थ ‘बेटा/पुत्र’ है। सामान्य, आत्मीय प्रसंग में ‘अपने बेटे के’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: Εἶδόν σε
  choice: मैंने तुम्हें देख लिया
  rationale: ὁράω के अओरिस्ट रूप में पुनर्मिलन की पूर्ण हुई घटना और वर्तमान हर्ष दोनों निहित हैं। ‘देख लिया’ इस पूर्णता को व्यक्त करता है, बिना ‘पा लिया’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: παιδίον
  choice: बेटे
  rationale: यह स्नेहपूर्ण सम्बोधन है। यद्यपि इसका मूल अर्थ ‘बालक/बच्चा’ है, यहाँ माँ द्वारा अपने वयस्क पुत्र को सम्बोधित करने के लिए हिन्दी का ‘बेटे’ स्वाभाविक रूप से वही आत्मीयता देता है और अनावश्यक शैशवभाव से बचता है।
