base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/014.yaml
  text: And she wept and said[a], “Blessed are you, O God, and blessed is your name forever, and blessed are all your holy angels,”
translation:
  language: hi
  text: और वह रोई और बोली, “धन्य हैं आप, हे परमेश्वर! आपका नाम युगानुयुग[a] धन्य है, और आपके सभी पवित्र स्वर्गदूत धन्य हैं,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘युगों तक’ है; यह मुहावरा ‘सदा’ का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσεν
  choice: वह रोई
  rationale: क्रिया का अर्थ ‘रोई’ है। यूनानी क्रियारूप स्वयं लिंग नहीं बताता, पर निकटवर्ती कथा-संदर्भ में कर्ता अन्ना है; इसलिए स्त्रीलिंग स्वाभाविक और संदर्भानुकूल है।
- source_word: Εὐλογητὸς εἶ
  choice: धन्य हैं आप
  rationale: यह सीधे परमेश्वर को संबोधित आशीर्वचन है। ‘धन्य हैं आप’ यूनानी विशेषण और बाइबिलीय स्तुति-शैली दोनों को बनाए रखता है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: यहाँ परमेश्वर संबोधित व्यक्ति हैं; हिन्दी में ‘हे परमेश्वर’ प्रार्थनापूर्ण प्रत्यक्ष संबोधन को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τὸ ὄνομά σου
  choice: आपका नाम
  rationale: यह परमेश्वर के नाम, अर्थात उनकी प्रकट पहचान और सम्मान, के लिए प्रचलित बाइबिलीय अभिव्यक्ति है; यूनानी से अधिक विस्तार नहीं किया गया।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यूनानी मुहावरा स्थायी काल की ओर संकेत करता है। ‘युगानुयुग’ हिन्दी की स्वाभाविक बाइबिलीय अभिव्यक्ति है और बहुवचन ‘युगों’ की छवि भी बचाए रखती है।
- source_word: εὐλογημένοι
  choice: धन्य हैं
  rationale: यह पहले आशीर्वचन की घोषणात्मक शैली को आगे बढ़ाता है। इसे इच्छा-सूचक ‘धन्य हों’ बनाने के बजाय यूनानी विशेषण की सीधी घोषणा रखी गई है।
- source_word: πάντες οἱ ἅγιοι ἄγγελοί σου
  choice: आपके सभी पवित्र स्वर्गदूत
  rationale: ἅγιοι सीधे ἄγγελοι का विशेषण है; इसलिए ‘पवित्र स्वर्गदूत’ सरल वाक्यगत अर्थ है। πάντες को ‘सभी’ से पूर्ण रूप में व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर को संबोधित आशीर्वचन
  choice: ‘धन्य हैं आप, हे परमेश्वर’ के रूप में आशीर्वचन बनाए रखा गया।
  alternative: ‘आपकी स्तुति हो, परमेश्वर’
  rationale: मूल में εὐλογητ- शब्दावली तीन बार दोहराई गई है। ‘धन्य’ इस पुनरावृत्ति और धर्मवैचारिक भार को सुरक्षित रखता है; इसे सामान्य स्तुति-वाक्य में बदलना मूल की अभिव्यक्ति को समतल कर देता।
- issue: स्वर्गदूतों के विषय में घोषणात्मक या इच्छा-सूचक कथन
  choice: ‘धन्य हैं’
  alternative: ‘धन्य हों’
  rationale: यूनानी में विशेषण εὐλογημένοι है और स्पष्ट इच्छा-सूचक क्रिया नहीं है। इसलिए घोषणात्मक पाठ रखा गया, जबकि हिन्दी में संभव इच्छा-सूचक अर्थ को पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर प्रार्थना और आशीर्वचन की गरिमा बनाए रखने के लिए ‘हे परमेश्वर’ और ‘युगानुयुग’ जैसे परिचित बाइबिलीय पद चुने गए हैं। ‘आप’ आदरसूचक संबोधन है। विस्मयादिबोधक चिह्न हिन्दी में आशीर्वचन की इकाइयों को स्पष्ट करता है, जबकि अंतिम अल्पविराम स्रोत-अंश के आगे जारी रहने का संकेत बनाए रखता है।
