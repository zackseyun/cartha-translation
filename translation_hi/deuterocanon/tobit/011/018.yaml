  yaml_path: translation/deuterocanon/tobit/011/018.yaml
  text: And there was joy for all his brothers in Nineveh[a]. And Ahikar came, and Nasbas his cousin[b],
translation:
  language: hi
  text: और नीनवे में उसके सब भाइयों[a] को आनन्द हुआ। और अहीकर आया, और उसका चचेरा-ममेरा भाई नासबास भी[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके सब संबंधियों’ अथवा ‘उसके कुल-परिवार के सब लोगों’; यूनानी में ‘भाइयों’ शब्द व्यापक अर्थ में रिश्तेदारों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में यह पद ‘और उसका चचेरा-ममेरा भाई नासबास भी,’ पर समाप्त होता है और वाक्य सीधे अगले पद में जारी रहता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο χαρὰ
  choice: आनन्द हुआ
  rationale: यूनानी अस्तित्वसूचक अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है और परिणामी सामुदायिक आनन्द पर बल बनाए रखता है।
- source_word: πᾶσι τοῖς ἐν Νινευὴ ἀδελφοῖς αὐτοῦ
  choice: नीनवे में उसके सब भाइयों को
  rationale: πᾶσι की समग्रता, ἐν Νινευὴ का स्थानवाचक अर्थ और ἀδελφοῖς का शाब्दिक पुल्लिंग रूप सुरक्षित रखता है; दत्तिव को हिन्दी में ‘को’ से स्वाभाविक रूप दिया गया है।
- source_word: παρεγένετο
  choice: आया
  rationale: कथा में आगमन बताने वाला सरल और स्वाभाविक हिन्दी क्रियापद।
- source_word: Ἀχιάχαρος
  choice: अहीकर
  rationale: तौबीत की परम्परा में पहचाने जाने योग्य और हिन्दी उच्चारण के अनुकूल नाम-रूप।
- source_word: Νασβὰς
  choice: नासबास
  rationale: स्वीटे के यूनानी पाठ में दिए नाम का सीधा देवनागरी लिप्यंतरण; अन्य पाठ-साक्ष्यों के भिन्न नाम-रूप मुख्य पाठ में नहीं मिलाए गए।
- source_word: ὁ ἐξάδελφος αὐτοῦ
  choice: उसका चचेरा-ममेरा भाई
  rationale: ἐξάδελφος निकट पार्श्ववंशी संबंधी अर्थात cousin को दर्शाता है; हिन्दी में लिंग और संबंध स्पष्ट रखते हुए, पैतृक या मातृक पक्ष को अनावश्यक रूप से निश्चित न करने के लिए संयुक्त अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: ἀδελφοῖς αὐτοῦ का दायरा
  choice: मुख्य पाठ में ‘उसके सब भाइयों’
  alternative: उसके सब संबंधियों / उसके कुल-परिवार के सब लोगों
  rationale: यूनानी में शाब्दिक रूप से ‘भाइयों’ है, यद्यपि प्रसंग में इसका अर्थ व्यापक संबंधी या स्वजातीय भी हो सकता है। मुख्य पाठ स्रोत-रूप को बनाए रखता है और व्यापक अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद के अंत की अपूर्ण वाक्य-रचना और अल्पविराम जानबूझकर सुरक्षित हैं, क्योंकि यूनानी वाक्य अगले पद में जारी रहता है।
