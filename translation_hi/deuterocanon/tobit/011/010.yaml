  yaml_path: translation/deuterocanon/tobit/011/010.yaml
  text: “From now on I can die.” And both of them wept. Then Tobit went out toward the door and stumbled[a], but his son ran to him,
translation:
  language: hi
  text: “अब मैं चैन से मर सकती हूँ।”[a] और वे दोनों रो पड़े। तब तोबीत द्वार की ओर निकला और ठोकर खा गया; पर उसका पुत्र दौड़कर उसके पास पहुँचा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “अब से मैं मर जाऊँगी।” यह ऐसा भावसूचक कथन है जिससे वक्ता बताती है कि उसकी अभिलाषा पूरी हो गई है और अब वह शांति से मर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: अब
  rationale: यह कालवाचक पद ‘अब से’ का भाव देता है। भावपूर्ण हिन्दी कथन में ‘अब’ अधिक स्वाभाविक है और उस निर्णायक क्षण को स्पष्ट करता है।
- source_word: ἀποθανοῦμαι
  choice: मैं चैन से मर सकती हूँ
  rationale: व्याकरणतः यह भविष्यत् रूप ‘मैं मरूँगी’ है, पर प्रसंग में यह भविष्यवाणी नहीं, बल्कि पुत्र को देखने के बाद अभिलाषा पूरी होने और शांति से मृत्यु स्वीकार कर सकने का भावसूचक कथन है।
- source_word: ἔκλαυσαν
  choice: रो पड़े
  rationale: आओरिस्ट क्रिया से भाव का तत्काल फूट पड़ना व्यक्त होता है; ‘रो पड़े’ आधुनिक हिन्दी में इसे स्वाभाविक और गरिमापूर्ण ढंग से प्रकट करता है।
- source_word: ἀμφότεροι
  choice: वे दोनों
  rationale: मूल पाठ में दोनों व्यक्तियों का स्पष्ट उल्लेख है, जिसे हिन्दी में भी बनाए रखा गया है।
- source_word: ἐξήρχετο
  choice: निकला
  rationale: अपूर्ण भूतकाल बाहर की ओर हो रही गति बताता है; हिन्दी कथा-प्रवाह में ‘निकला’ इसे सहज रूप से व्यक्त करता है।
- source_word: πρὸς τὴν θύραν
  choice: द्वार की ओर
  rationale: πρός के दिशासूचक अर्थ को ‘की ओर’ से सुरक्षित रखा गया है।
- source_word: προσεκόπτεν
  choice: ठोकर खा गया
  rationale: προσκόπτω का अर्थ किसी वस्तु से टकराना या ठोकर खाना है। प्रसंग में तोबित की दृष्टिहीनता के कारण ‘ठोकर खा गया’ स्पष्ट और स्वाभाविक है।
- source_word: προσέδραμεν αὐτῷ
  choice: दौड़कर उसके पास पहुँचा
  rationale: क्रिया किसी व्यक्ति की ओर तेजी से दौड़ने को बताती है; यह हिन्दी अभिव्यक्ति गति और गंतव्य दोनों को स्पष्ट रखती है।
theological_decisions:
- issue: ἀποθανοῦμαι में भावसूचक मुहावरा
  choice: “मैं चैन से मर सकती हूँ”
  alternative: “अब से मैं मर जाऊँगी”
  rationale: पुनर्मिलन के प्रसंग में यह आसन्न मृत्यु की भविष्यवाणी नहीं, बल्कि अभिलाषा पूरी हो जाने के बाद शांति से मृत्यु स्वीकार करने की तत्परता व्यक्त करता है। अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है ताकि मूल की व्याकरणिक बनावट भी दिखाई दे।
- issue: कथानक में कर्ता की निरंतरता
  choice: द्वार की ओर निकलने और ठोकर खाने वाला तोबित है
  alternative: आसपास के वृत्तांत के कुछ दीर्घ-पाठीय रूपों में घटनाक्रम और कर्ताओं का विवरण भिन्न है
  rationale: दिए गए स्वेटे यूनानी पाठ में Τωβεὶτ स्पष्ट कर्ता है; इसलिए पाठीय परंपराओं के आधार पर इसे बदला नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। स्त्री वक्ता के अनुसार ‘सकती हूँ’ और पादटिप्पणी में ‘मर जाऊँगी’ रखा गया है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘ठोकर खा गया’ के बाद था, जबकि पादटिप्पणी ἀποθανοῦμαι से संबंधित है; इसलिए स्रोत-संगति हेतु [a] को उसी कथन के बाद रखा गया है।
