  text: because you afflicted me and had mercy on me. Behold[a], I see Tobiah my son. And his son entered rejoicing, and reported to his father the great things that had happened to him in Media.
translation:
  language: hi
  text: क्योंकि तूने मुझे पीड़ा दी और मुझ पर दया की। देख[a], मैं अपने पुत्र तोबियाह को देख रहा हूँ। और उसका पुत्र आनन्दित होकर भीतर आया और उसने अपने पिता को वे महान बातें बताईं जो मादै देश में उसके साथ घटी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो” अथवा “निहारो”; यूनानी उद्गार तत्काल सामने उपस्थित बात की ओर ध्यान दिलाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαστίγωσας
  choice: तूने मुझे पीड़ा दी
  rationale: क्रिया का मूल अर्थ कोड़े मारना या कठोर दण्ड देना हो सकता है, पर यहाँ व्यापक दुःख या ताड़ना का भाव प्रसंगानुकूल है। यह रूप परमेश्वर की प्रत्यक्ष भूमिका को बनाए रखता है, पर अनावश्यक रूप से शाब्दिक कोड़े मारने का चित्र नहीं जोड़ता।
- source_word: ἠλέησάς με
  choice: मुझ पर दया की
  rationale: ἐλεέω का स्वाभाविक हिन्दी रूप; यह पहले दिए गए दुःख के साथ मूल पाठ का तीखा विरोध बनाए रखता है।
- source_word: ἰδοὺ
  choice: देख
  rationale: तात्कालिक दृश्य की ओर ध्यान खींचने वाला सहज आधुनिक उद्गार, जो पुनः प्राप्त दृष्टि की जीवंतता बनाए रखता है।
- source_word: βλέπω
  choice: मैं ... देख रहा हूँ
  rationale: वर्तमान में वास्तव में दिखाई देने और सामने उपस्थित पुत्र को देखने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χαίρων
  choice: आनन्दित होता हुआ
  rationale: वर्तमान कृदन्त का भाव सुरक्षित रहता है और भीतर आते समय पुत्र की मनोदशा स्पष्ट होती है।
- source_word: ἀπήγγειλεν
  choice: बताईं
  rationale: समाचार या घटनाओं का वृत्तान्त देने के अर्थ में सामान्य, स्वाभाविक हिन्दी; अधिक औपचारिक 'सूचित किया' यहाँ अनावश्यक है।
- source_word: τὰ μεγάλα
  choice: वे सब महान बातें
  rationale: मूल की खुली अभिव्यक्ति को बनाए रखता है; इसे विशेष रूप से परमेश्वर के 'महान कार्य' कहकर अर्थ सीमित नहीं किया गया।
- source_word: τὰ γενόμενα αὐτῷ
  choice: जो ... उसके साथ घटी थीं
  rationale: तोबियाह के अनुभव में हुई घटनाओं को स्वाभाविक हिन्दी में व्यक्त करता है और αὐτῷ का संकेत सुरक्षित रखता है।
- source_word: ἐν τῇ Μηδείᾳ
  choice: मादै देश में
  rationale: प्राचीन क्षेत्र Media के लिए हिन्दी बाइबलीय भूगोल में समझ में आने वाला नाम; 'देश' जोड़ने से सामान्य पाठक के लिए स्थान-सूचक अर्थ स्पष्ट होता है।
theological_decisions:
- issue: दुःख और दया में परमेश्वर की भूमिका
  choice: “तूने मुझे पीड़ा दी और मुझ पर दया की” के रूप में दोनों क्रियाएँ सीधे परमेश्वर से जोड़ी गईं।
  alternative: “मुझ पर दुःख आया, फिर तूने मुझ पर दया की” या पहले खण्ड को निष्क्रिय बनाना।
  rationale: यूनानी पाठ परमेश्वर को दोनों क्रियाओं का स्पष्ट कर्ता बताता है। अनुवाद इस धर्मवैचारिक तनाव को नरम किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक रूप अपनाया गया है। परमेश्वर से प्रार्थनामय प्रत्यक्ष संबोधन में परम्परागत एकवचन ‘तू’ रखा गया है; शेष वाक्य सरल और सामान्य पाठकों के लिए सुबोध हैं।
