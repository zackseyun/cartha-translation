  yaml_path: translation/deuterocanon/tobit/011/016.yaml
  text: And Tobit went out to meet his daughter-in-law[a], rejoicing and blessing God, at the gate of Nineveh. And those who saw him walking were amazed[b], because he could see.
translation:
  language: hi
  text: और तोबीत अपनी बहू[a] से मिलने के लिए बाहर निकला, आनन्दित होकर और परमेश्वर को धन्य कहते हुए, नीनवे के फाटक पर। उसे चलते हुए देखने वाले लोग चकित थे[b], क्योंकि वह देख सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द νύμφη का अर्थ ‘दुल्हन’ या ‘बहू’ हो सकता है। यहाँ इसका संकेत सारा की ओर है, जो तोबीत की बहू थी।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी नामरूप ‘तोबेयास’ है; किंतु प्रसंग पिता तोबीत की ओर संकेत करता है, क्योंकि लोग उसके देख सकने पर चकित थे।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: गया
  rationale: यह बाहर निकलकर किसी से मिलने जाने की सामान्य कथात्मक क्रिया है; हिन्दी में केवल ‘गया’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: Τωβείας
  choice: तोबीत
  rationale: यूनानी नामरूप Τωβείας है, पर अंतिम उपवाक्य में उसके देख सकने पर लोगों का चकित होना स्पष्ट करता है कि यहाँ दृष्टि पाया हुआ पिता तोबीत अभिप्रेत है, पुत्र तोबियाह नहीं।
- source_word: εἰς συνάντησιν
  choice: से मिलने
  rationale: यह मुहावरा किसी के स्वागत में उससे मिलने जाने का भाव व्यक्त करता है; ‘से मिलने’ आधुनिक हिन्दी में सहज है।
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: अपनी बहू
  rationale: νύμφη का अर्थ ‘दुल्हन’ अथवा ‘बहू’ हो सकता है; इस पारिवारिक प्रसंग में सारा, तोबीत के पुत्र की पत्नी, अर्थात उसकी बहू है।
- source_word: χαίρων καὶ εὐλογῶν τὸν θεόν
  choice: आनन्दित होता और परमेश्वर को धन्य कहता जा रहा था
  rationale: दोनों वर्तमान कृदन्त साथ-साथ चल रही क्रियाओं/अवस्थाओं को व्यक्त करते हैं। ‘परमेश्वर को धन्य कहना’ εὐλογῶν की निकट और बोधगम्य अभिव्यक्ति है।
- source_word: πρὸς τῇ πύλῃ Νινευή
  choice: नीनवे के फाटक पर
  rationale: वाक्यांश नगर के फाटक पर या उसके निकट स्थान सूचित करता है; ‘फाटक पर’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐθαύμαζον
  choice: चकित थे
  rationale: अपूर्ण भूतकाल दर्शकों की जारी प्रतिक्रिया बताता है; ‘चकित थे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἱ θεωροῦντες αὐτὸν πορευόμενον
  choice: जो लोग उसे चलते हुए देख रहे थे
  rationale: यह रचना लोगों को तोबीत को चलते हुए ध्यान से देखते दिखाती है और यूनानी कृदन्तों का स्पष्ट हिन्दी रूप देती है।
- source_word: ὅτι ἔβλεψεν
  choice: कि वह देख सकता था
  rationale: यूनानी पाठ सीधे उसके देखने की बात कहता है। प्रसंग में यह दृष्टि लौटने का परिणाम है, किंतु अनुवाद ‘दृष्टि फिर मिल गई थी’ जैसी व्याख्यात्मक वृद्धि नहीं करता।
theological_decisions:
- issue: Τωβείας नामरूप से अभिहित व्यक्ति की पहचान
  choice: दृष्टि पाया हुआ पिता तोबीत
  alternative: पुत्र तोबियाह/टोबियास
  rationale: यद्यपि यूनानी नामरूप पुत्र के नाम जैसा लग सकता है, लोगों का इस कारण चकित होना कि वह देख सकता था, तत्काल प्रसंग में अंधे रहे और अब चंगे हुए पिता तोबीत से मेल खाता है। पाठ की कथात्मक पहचान को बनाए रखते हुए नामरूप की समस्या पादटिप्पणी में बताई गई है।
- issue: ὅτι ἔβλεψεν में चंगाई को स्पष्ट करना
  choice: ‘वह देख सकता था’—पाठ के कथन को निकटता से रखना
  alternative: ‘उसकी दृष्टि लौट आई थी’
  rationale: वैकल्पिक रूप प्रसंगगत अर्थ स्पष्ट करता है, पर यूनानी में केवल देखने की बात प्रत्यक्ष रूप से कही गई है। इसलिए अनुवाद अनावश्यक व्याख्यात्मक विस्तार से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल कथात्मक शैली रखी गई है। यूनानी कृदन्तों की एक साथ जारी क्रियाओं को सहज हिन्दी के लिए दो वाक्यों में व्यवस्थित किया गया है। ‘परमेश्वर को धन्य कहना’ स्रोत के εὐλογεῖν को ‘स्तुति करना’ में विलीन किए बिना व्यक्त करता है।
