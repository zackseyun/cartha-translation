translation:
  language: hi
  text: और मछली का पित्त[a] अपने हाथ में ले लो। वे चले, और कुत्ता उनके पीछे-पीछे आया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘पित्त’ या ‘पित्त-रस’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग की समानांतर सामी-रूप परंपरा कहीं अधिक विस्तृत है और उसमें तोबियाह द्वारा मछली का पित्त अपने पिता की आँखों पर लगाने पर ध्यान दिया गया है। मुख्य पाठ में यहाँ यूनानी का संक्षिप्त पाठ अपनाया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε
  choice: ले लो
  rationale: यह λαμβάνω का आदेशवाचक रूप है। ‘ले लो’ तत्काल और व्यावहारिक निर्देश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρὰ χεῖρα
  choice: अपने हाथ में
  rationale: यहाँ वाक्यांश का आशय वस्तु को हाथ में रखना है, न कि किसी को हाथ पकड़ाकर ले चलना।
- source_word: χολὴν τοῦ ἰχθύος
  choice: मछली का पित्त
  rationale: χολή का अर्थ ‘पित्त’ या ‘पित्त-रस’ हो सकता है। कथानक में मछली से निकाले गए औषधीय पदार्थ का उल्लेख है; ‘मछली का पित्त’ संक्षिप्त, स्वाभाविक और अर्थ-संगत है।
- source_word: ἐπορεύθησαν
  choice: वे आगे चले
  rationale: साधारण कथात्मक गति के साथ यात्रा जारी रखने का भाव व्यक्त होता है।
- source_word: συνῆλθεν
  choice: चला आया
  rationale: συνέρχομαι में साथ आने या जुड़कर चलने का भाव है। ὀπίσωθεν αὐτῶν के साथ ‘उनके पीछे-पीछे चला आया’ कुत्ते की साथ-साथ चलती गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ κύων
  choice: कुत्ता
  rationale: निश्चित उपपद उस कुत्ते की ओर संकेत करता है जिसका कथानक में पहले उल्लेख हो चुका है।
- source_word: ὀπίσωθεν αὐτῶν
  choice: उनके पीछे-पीछे
  rationale: यह स्थान और गति—दोनों का भाव देता है कि कुत्ता यात्रियों के पीछे चल रहा था।
