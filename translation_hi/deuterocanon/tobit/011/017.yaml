base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/017.yaml
  text: And Tobit gave thanks before them that God had shown them mercy. And when Tobit came near to Sarah his daughter-in-law[a], he blessed her, saying, “May you come in good health, daughter. Blessed is God, who has brought you to us, and your father and your mother.”
translation:
  language: hi
  text: और टोबित ने उन सबके सामने परमेश्वर को धन्यवाद दिया कि उसने उन पर दया की थी। जब टोबित अपनी बहू सारा के पास पहुँचा, तो उसने उसे आशीर्वाद देते हुए कहा, “बेटी, तुम स्वस्थ-सकुशल आओ। धन्य है परमेश्वर, जो तुम्हें हमारे पास लाया है, और तुम्हारे पिता और तुम्हारी माता[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ “और तुम्हारे पिता और तुम्हारी माता” पर अचानक समाप्त हो जाता है। इसे “और [धन्य हैं] तुम्हारे पिता और तुम्हारी माता” जैसे निहित अर्थ में समझा जा सकता है, पर इस पाठ-साक्षी में वह क्रिया लिखी नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογεῖτο
  choice: धन्यवाद दिया
  rationale: यहाँ ὅτι-वाक्य परमेश्वर की दया को कृतज्ञतापूर्वक स्वीकार करता है; प्रसंग पाप-स्वीकार का नहीं, सार्वजनिक धन्यवाद का है।
- source_word: ἐνώπιον αὐτῶν
  choice: उन सबके सामने
  rationale: यह अभिव्यक्ति सार्वजनिक रूप से उपस्थित लोगों के समक्ष धन्यवाद देने का भाव स्पष्ट करती है।
- source_word: ἠλέησεν αὐτοὺς
  choice: उसने उन पर दया की थी
  rationale: ἐλεέω के दया-संबंधी धार्मिक अर्थ को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: καὶ ὡς ἤγγισεν
  choice: जब ... के पास पहुँचा
  rationale: ὡς का कालवाचक अर्थ यहाँ सबसे स्वाभाविक है; ἤγγισεν निकट आने या पास पहुँचने को बताता है।
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: अपनी बहू
  rationale: νύμφη का अर्थ दुल्हन या बहू हो सकता है; टोबित के साथ संबंध की दृष्टि से सारा उसकी बहू है।
- source_word: κατευλόγησεν
  choice: आशीर्वाद देते हुए
  rationale: क्रिया आशीर्वाद देने को व्यक्त करती है; हिन्दी में अगले कथन से इसे सहज रूप से जोड़ा गया है।
- source_word: Ἔλθοις ὑγιαίνουσα
  choice: तुम स्वस्थ-सकुशल आओ
  rationale: यूनानी optative आगमन के समय कुशल-मंगल की कामना व्यक्त करता है; यह हिन्दी में आशीषात्मक कामना के रूप में स्वाभाविक है।
- source_word: θύγατερ
  choice: बेटी
  rationale: यह स्नेहपूर्ण पारिवारिक संबोधन है; यूनानी में ‘मेरी’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: εὐλογητὸς ὁ θεός
  choice: धन्य है परमेश्वर
  rationale: यह पारंपरिक आशीष-वाक्य को औपचारिक, स्पष्ट और स्रोत-समीप हिन्दी में रखता है।
- source_word: ὃς ἤγαγέν σε πρὸς ἡμᾶς
  choice: जो तुम्हें हमारे पास लाया है
  rationale: पूर्ण हुई क्रिया का वर्तमान परिणाम—सारा का अब परिवार के पास होना—‘लाया है’ से व्यक्त होता है।
- source_word: καὶ ὁ πατήρ σου καὶ ἡ μήτηρ σου
  choice: और तुम्हारे पिता और तुम्हारी माता भी
  rationale: प्रेषित यूनानी में यह पद बिना दोहराई हुई क्रिया के जुड़ता है; हिन्दी में ‘भी’ संबंध का संकेत देता है, पर लुप्त क्रिया को मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ता।
theological_decisions:
- issue: परमेश्वर के संबंध में ἐξωμολογεῖτο का अर्थ
  choice: सार्वजनिक धन्यवाद
  alternative: अंगीकार या स्तुति
  rationale: इसके बाद का कथन परमेश्वर द्वारा दिखाई गई दया बताता है, इसलिए यहाँ अपराध का अंगीकार नहीं, कृतज्ञ स्वीकारोक्ति और धन्यवाद अभिप्रेत है।
- issue: अंतिम पद की अपूर्ण वाक्य-रचना
  choice: मुख्य पाठ में अचानक जुड़े पद को सुरक्षित रखा और पादटिप्पणी दी
  alternative: ‘और धन्य हैं तुम्हारे पिता और तुम्हारी माता’ के रूप में लुप्त विधेय जोड़ना
  rationale: इस यूनानी साक्षी में माता-पिता के लिए ‘धन्य’ या अन्य कोई क्रिया दोहराई नहीं गई है; उसे जोड़ना संभावित अर्थ को निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘स्वस्थ-सकुशल’ आशीषात्मक अभिवादन को स्वाभाविक बनाता है। अंतिम यूनानी पद की वास्तविक वाक्यगत अपूर्णता को पादटिप्पणी में स्पष्ट किया गया है।
