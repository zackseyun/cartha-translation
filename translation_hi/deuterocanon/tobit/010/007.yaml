base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/007.yaml
  text: And she said to him[a], “Be quiet; do not mislead me. My child has perished.” And every day she would go out to the road by which he had departed, and by day she would eat no bread, and at night she did not cease mourning for Tobias her son, until the fourteen days of the wedding feast were completed[b], which Raguel had sworn that he should spend there.
translation:
  language: hi
  text: और उसने उससे कहा, “चुप रहो; मुझे बहकाओ मत। मेरा बच्चा मर गया है।[a]” वह हर दिन बाहर उस मार्ग पर जाती थी, जिस रास्ते से वह गया था। दिन में वह रोटी नहीं खाती थी, और रातों को अपने बेटे तोबियास के लिए विलाप करना बंद नहीं करती थी, जब तक विवाह-उत्सव के वे चौदह दिन पूरे न हो गए[b], जिन्हें रगुएल ने शपथ खाकर तोबियास से वहाँ बितवाने का वचन दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा बच्चा खो गया है।” यूनानी शब्द ἀπώλετο का अर्थ ‘खो जाना’ या ‘नष्ट हो जाना’ हो सकता है। यहाँ यह माँ की भयपूर्ण धारणा है, कथावाचक की ओर से उसकी मृत्यु की पुष्टि नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “विवाह के चौदह दिन।” यहाँ यह विवाह-उत्सव की अवधि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  choice: चुप रहो
  rationale: मौन रहने की तीखी आज्ञा को सहज और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: μὴ πλάνα με
  choice: मुझे बहकाओ मत
  rationale: क्रिया में भटकाने या भ्रम में डालने का भाव है; प्रसंग में यह झूठी तसल्ली को ठुकराता है, पर जानबूझकर छल करने का आरोप अनिवार्य नहीं बनाता।
- source_word: ἀπώλετο
  choice: नष्ट हो गया है
  rationale: यूनानी पद का अर्थ ‘खो गया’ अथवा ‘नाश हो गया’ हो सकता है। यह माँ की भयपूर्ण धारणा को तीखे रूप में रखता है; पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- source_word: τὸ παιδίον μου
  choice: मेरा बच्चा
  rationale: स्नेह और मातृशोक का भाव बनाए रखता है तथा बाद में आए स्पष्ट ‘अपने बेटे’ से अनावश्यक पुनरावृत्ति नहीं करता।
- source_word: καθʼ ἡμέραν
  choice: प्रतिदिन
  rationale: आवर्ती क्रिया के लिए स्वाभाविक और संक्षिप्त आधुनिक हिन्दी।
- source_word: εἰς τὴν ὁδὸν ἔξω οἵας ἀπῆλθεν
  choice: उस मार्ग पर बाहर जाती थी जिससे वह गया था
  rationale: उसके प्रतिदिन बाहर जाकर प्रस्थान वाले मार्ग को देखने का दृश्य सुरक्षित रखता है।
- source_word: ἡμέρας τε ἄρτον οὐκ ἤσθιεν
  choice: दिन में वह रोटी नहीं खाती थी
  rationale: ‘रोटी’ को सामान्य ‘भोजन’ में बदलने के बजाय मूल का ठोस शोक-संबंधी चित्र बनाए रखता है।
- source_word: οὐ διέλιμπανεν θρηνοῦσα
  choice: विलाप करना बंद नहीं करती थी
  rationale: अपूर्णकाल और कृदंत से व्यक्त निरंतर शोक को सहज हिन्दी में दर्शाता है।
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: विवाह-उत्सव के वे चौदह दिन
  rationale: यहाँ γάμος केवल वैवाहिक अवस्था नहीं, विवाह-समारोह की अवधि का संकेत करता है।
- source_word: ἃς ὤμοσεν Ῥαγουὴλ ποιῆσαι αὐτὸν ἐκεῖ
  choice: जिन्हें रगुएल ने शपथ खाकर उसे वहाँ बिताने को कहा था
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ असामान्य है; यह अनुवाद रगुएल द्वारा तोबियास को निर्धारित अवधि तक वहाँ रोके रखने का आशय पठनीय ढंग से देता है।
