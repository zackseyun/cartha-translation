    text: यूनानी पाठ में यहाँ ‘उसे’ का सर्वनाम दो बार आया है। यह बल देने के लिए अथवा नकल करते समय हुई पुनरावृत्ति हो सकती है; मुख्य पाठ में इसे स्वाभाविक हिंदी में एक बार रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπώλετο
  choice: मर गया है
  rationale: यहाँ ἀπόλλυμι का रूप माँ की इस भयपूर्ण धारणा को व्यक्त करता है कि उसका बेटा मर चुका है। हिंदी में ‘मर गया है’ स्वाभाविक है और अगले वाक्य में उसके विलाप करने से पुष्ट होता है।
- source_word: τὸ παιδίον
  choice: बच्चा
  rationale: παιδίον का सीधा अर्थ ‘बच्चा’ है। प्रसंग में यह उसके बेटे तोबियास के लिए मातृसुलभ संबोधन है।
- source_word: κεχρόνικεν
  choice: उसे गए बहुत देर हो गई है
  rationale: χρονίζω का पूर्णकालिक रूप लंबे समय तक ठहरने या देर होने का भाव देता है। यह हिंदी अभिव्यक्ति लंबे अभाव को स्वाभाविक रूप से बताती है और जानबूझकर देर करने का अर्थ नहीं जोड़ती।
- source_word: ἤρξατο θρηνεῖν
  choice: विलाप करने लगी
  rationale: यह वाक्यांश शोकपूर्ण क्रंदन आरंभ होने को व्यक्त करता है। ‘विलाप करने लगी’ गरिमापूर्ण और आधुनिक मानक हिंदी में स्पष्ट है।
- source_word: αὐτὸν αὐτὸν
  choice: उसके लिए
  rationale: प्रेषित यूनानी पाठ में सर्वनाम दो बार आया है। मुख्य पाठ में स्वाभाविक हिंदी के लिए इसे एक बार व्यक्त किया गया है और पुनरावृत्ति को पाद-टिप्पणी में सुरक्षित रखा गया है।
