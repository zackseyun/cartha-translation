  text: तब उसकी पत्नी ने उससे कहा, “बच्चा मर गया है, क्योंकि उसे गए बहुत देर हो गई है।” फिर वह उसके लिए विलाप करने लगी[a] और बोली,
  philosophy: optimal-equivalence
