  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल कथात्मक रूप अपनाया गया है। पारिवारिक सम्मान के अनुरूप ‘कर दीजिए’ रखा गया है। ἐλπίζουσιν की अर्थगत व्यापकता को मुख्य पाठ में ‘आशा’ द्वारा सुरक्षित रखा गया है; कोई पंथगत व्याख्या नहीं जोड़ी गई।
