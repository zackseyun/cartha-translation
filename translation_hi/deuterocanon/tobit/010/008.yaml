translation:
  language: hi
  text: तब तोबियास ने रगुएल से कहा, “मुझे विदा कर दीजिए, क्योंकि मेरे पिता और मेरी माता को अब यह आशा नहीं रही कि वे मुझे देखेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: तब ... ने कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; ‘तब’ प्रसंग की स्वाभाविक प्रगति दिखाता है, बिना विरोध का अनावश्यक भाव जोड़े।
- source_word: Τωβείας
  choice: तोबियास
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण किया गया है।
- source_word: τῷ Ῥαγουὴλ
  choice: रगुएल से
  rationale: यूनानी सम्प्रदान कारक को हिन्दी में स्वाभाविक अप्रत्यक्ष संबोधन के रूप में व्यक्त किया गया है।
- source_word: Ἐξαπόστειλόν με
  choice: मुझे विदा कर दीजिए
  rationale: आज्ञार्थक क्रिया विदा होने की अनुमति और रगुएल द्वारा भेजे जाने—दोनों भाव रखती है; आदरसूचक रूप पारिवारिक संबंध के संदर्भ में स्वाभाविक है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह अनुरोध का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὁ πατήρ μου καὶ ἡ μήτηρ μου
  choice: मेरे पिता और मेरी माता
  rationale: मूल यूनानी दोनों माता-पिता का अलग-अलग उल्लेख करता है; उसी स्पष्टता और बल को सुरक्षित रखा गया है।
- source_word: οὐκέτι
  choice: अब ... नहीं रही
  rationale: समय के साथ किसी अवस्था के समाप्त हो जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλπίζουσιν
  choice: आशा ... रही
  rationale: ἐλπίζω में ‘आशा रखना’ और ‘अपेक्षा करना’ दोनों अर्थ संभव हैं। यहाँ पुत्र को फिर देखने की आशा खो देने का भाव प्रसंगानुकूल है और मूल की भावात्मक तीव्रता बनाए रखता है।
- source_word: ὄψεσθαί με
  choice: कि वे मुझे देखेंगे
  rationale: भविष्यकालिक infinitive को हिन्दी में स्वाभाविक आश्रित उपवाक्य के रूप में प्रस्तुत किया गया है।
