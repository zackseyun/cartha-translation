base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/012.yaml
  text: And he said to his daughter[a], “Honor your parents-in-law; they are now your parents. May I hear a good report about you.” And he kissed her. And Edna said to Tobiah, “Beloved brother, may the Lord of heaven restore you, and may he grant me to see children from you and from Sarah my daughter, so that I may rejoice before the Lord. And look, I entrust my daughter to you as a deposit[b]; do not grieve her.”
translation:
  language: hi
  text: और उसने अपनी बेटी से कहा, “अपने सास-ससुर का आदर करना; अब वे ही तुम्हारे माता-पिता हैं। तुम्हारे विषय में मुझे अच्छी खबर सुनने को मिले।” फिर उसने उसे चूमा। एदना ने तोबियाह से कहा, “प्रिय भाई, स्वर्ग का प्रभु तुम्हें लौटा लाए[a], और मुझे तुम्हारी और मेरी बेटी सारा की संतान देखने दे, ताकि मैं प्रभु के सामने आनन्दित होऊँ। देखो, मैं अपनी बेटी को अमानत के तौर पर तुम्हें सौंपती हूँ[b]; उसे दुःख मत देना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें फिर से बहाल करे।” यूनानी क्रिया का अर्थ किसी को उसकी पूर्व दशा में बहाल करना या वापस ले आना, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, “मैं अपनी बेटी को तुम्हारी देखरेख में सौंपती हूँ।” यूनानी में अमानत या सौंपे गए दायित्व का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: आदर करना
  rationale: आज्ञार्थक क्रिया का नैतिक और पारिवारिक भार बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοὺς πενθερούς σου
  choice: अपने सास-ससुर
  rationale: यूनानी बहुवचन जीवनसाथी के माता-पिता को सामूहिक रूप से बताता है; हिन्दी में ‘सास-ससुर’ सटीक और सहज है।
- source_word: ἀκούσαιμί σου ἀκοὴν καλήν
  choice: तुम्हारे विषय में मुझे अच्छी खबर सुनने को मिले
  rationale: यह मुहावरा उस व्यक्ति के आचरण या कुशलता के विषय में अच्छा समाचार सुनने की इच्छा व्यक्त करता है।
- source_word: ἀδελφὲ ἀγαπητέ
  choice: प्रिय भाई
  rationale: स्नेहपूर्ण पारिवारिक सम्बोधन को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀποκαταστήσει σε
  choice: तुम्हें सकुशल वापस पहुँचाए
  rationale: विदाई और यात्रा के प्रसंग में क्रिया के ‘वापस ले आना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘बहाल करना’ का व्यापक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: ὁ κύριος τοῦ οὐρανοῦ
  choice: स्वर्ग का प्रभु
  rationale: सम्बन्धवाचक यूनानी पदबंध और ईश्वरीय उपाधि दोनों को सीधे और श्रद्धापूर्ण ढंग से रखता है।
- source_word: δῴη μοι ἰδεῖν σου παιδία ἐκ Σάρρας τῆς θυγατρός μου
  choice: मुझे तुम्हारी और मेरी बेटी सारा की संतान देखने दे
  rationale: ἐκ द्वारा सूचित माता-पिता से उत्पत्ति को स्पष्ट, सहज हिन्दी में व्यक्त करता है और दोनों अभिभावकों का उल्लेख बनाए रखता है।
- source_word: ἵνα εὐφρανθῶ ἐνώπιον τοῦ κυρίου
  choice: ताकि मैं प्रभु के सामने आनन्दित होऊँ
  rationale: उद्देश्यवाचक रचना और प्रभु की उपस्थिति में आनन्द करने का धार्मिक भाव सुरक्षित रहता है।
- source_word: παρατίθεμαί σοι ... ἐν παρακαταθήκῃ
  choice: मैं अपनी बेटी को धरोहर के रूप में तुम्हें सौंपती हूँ
  rationale: सौंपे गए मूल्यवान दायित्व या अमानत के रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μὴ λυπήσῃς αὐτήν
  choice: उसे दुःख मत देना
  rationale: कारणवाचक अर्थ—उसे शोक या पीड़ा न पहुँचाना—को साधारण आधुनिक हिन्दी में सटीक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय उपाधि κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος स्पष्ट रूप से परमेश्वर की उपाधि है; ‘प्रभु’ श्रद्धापूर्ण, प्रचलित और किसी विशेष सम्प्रदायगत व्याख्या से मुक्त है।
- issue: ἀποκαταστήσει में बहाली और सुरक्षित वापसी के बीच अर्थ-संभावना
  choice: मुख्य पाठ में ‘सकुशल वापस पहुँचाए’
  alternative: ‘तुम्हें फिर से बहाल करे’
  rationale: यात्रा और विदाई का प्रसंग सुरक्षित वापसी की ओर संकेत करता है, पर क्रिया का व्यापक ‘बहाल करना’ अर्थ पाद-टिप्पणी में रखा गया है ताकि वास्तविक अर्थ-विस्तार न मिटे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रखी गई है। पारिवारिक सम्बोधनों में ‘सास-ससुर’ और ‘प्रिय भाई’ जैसे स्वाभाविक रूप अपनाए गए हैं। ‘धरोहर’ मूल रूपक को बचाता है, जबकि पाद-टिप्पणी उसका व्यावहारिक आशय स्पष्ट करती है।
