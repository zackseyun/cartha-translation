  yaml_path: translation/deuterocanon/tobit/010/011.yaml
  text: Then Raguel rose and gave him Sarah his wife[a], and half of his possessions—servants and livestock and silver—and after blessing them he sent them away, saying, “May the God of heaven prosper you, children[b], before I die.”
translation:
  language: hi
  text: तब रगूएल उठा और उसने उसकी पत्नी सारा को उसके हवाले कर दिया, और अपनी संपत्ति का आधा भाग—दास,[a] पशु और चाँदी—भी उसे दे दिया। फिर उन्हें आशीर्वाद देकर उसने उन्हें विदा किया और कहा, “हे बच्चो, स्वर्ग का परमेश्वर मेरे मरने से पहले तुम्हें सफल करे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “शरीर”; संपत्ति की इस सूची में इसका आशय स्वामित्वाधीन मनुष्यों से है।
    reason: lexical_alternative
  - marker: b
    text: या, “स्वर्ग का परमेश्वर तुम्हें सफल करेगा।” यूनानी में भविष्यकालीन रूप है, जो यहाँ आशीर्वाद के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναστὰς
  choice: उठ खड़ा हुआ
  rationale: यह क्रिया आगे की कार्रवाई के लिए उठने को दर्शाती है और हिन्दी कथा-शैली में स्वाभाविक है।
- source_word: ἔδωκεν αὐτῷ Σάρραν τὴν γυναῖκα αὐτοῦ
  choice: उसकी पत्नी सारा को उसके साथ विदा किया
  rationale: शाब्दिक अर्थ ‘उसे उसकी पत्नी सारा दी’ है, पर यहाँ पिता द्वारा पत्नी को पति के साथ विदा करने का पारिवारिक भाव है; हिन्दी में यह रूप अधिक स्वाभाविक है और स्त्री को संपत्ति-सूची का हिस्सा समझे जाने से बचाता है।
- source_word: τὰ ἥμισυ τῶν ὑπαρχόντων
  choice: अपनी संपत्ति का आधा भाग
  rationale: ὑπάρχοντα के व्यापक संपत्ति-संबंधी अर्थ और आगे दी गई सूची को समेटता है।
- source_word: σώματα
  choice: दास-दासियाँ
  rationale: शाब्दिक अर्थ ‘शरीर’ है, किंतु संपत्ति की सूची में यह स्वामित्वाधीन मनुष्यों को सूचित करता है। ‘दास-दासियाँ’ सामाजिक वास्तविकता को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है, यद्यपि यूनानी में लिंग निर्दिष्ट नहीं है।
- source_word: κτήνη
  choice: पशु
  rationale: यह पालतू या संपत्ति के रूप में रखे जाने वाले जानवरों के लिए सामान्य शब्द है।
- source_word: ἀργύριον
  choice: चाँदी
  rationale: मूल का ठोस शब्द सुरक्षित रखा गया है; प्रसंग में यह धन के रूप में प्रयुक्त चाँदी हो सकती है।
- source_word: εὐλογήσας αὐτοὺς
  choice: उन दोनों को आशीर्वाद देकर
  rationale: बहुवचन सर्वनाम टोबियास और सारा की ओर संकेत करता है; ‘उन दोनों’ हिन्दी में संदर्भ स्पष्ट करता है।
- source_word: ἐξαπέστειλεν
  choice: विदा किया
  rationale: यात्रा पर रवाना करने के प्रसंग में यह हिन्दी का स्वाभाविक समतुल्य है।
- source_word: Εὐοδώσει ὑμᾶς
  choice: तुम्हें सफल करे
  rationale: रूप भविष्यकालीन है, पर विदाई के आशीर्वाद में इच्छार्थक प्रयोग स्वाभाविक है। ‘सफल करे’ यात्रा और व्यापक कुशलता, दोनों की संभावना खुली रखता है।
- source_word: τέκνα
  choice: हे बच्चो
  rationale: स्नेहपूर्ण संबोधन का बहुवचन रूप; मूल में ‘मेरे’ स्पष्ट रूप से नहीं है।
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: स्वर्ग का परमेश्वर
  rationale: यह यहूदी श्रद्धापूर्ण उपाधि का औपचारिक और परिचित हिन्दी रूप है।
- source_word: πρὸ τοῦ μὲ ἀποθανεῖν
  choice: मेरे मरने से पहले
  rationale: यूनानी infinitival construction का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: आशीर्वाद में Εὐοδώσει के भविष्यकालीन रूप का बल
  choice: इच्छा/प्रार्थना के रूप में ‘स्वर्ग का परमेश्वर तुम्हें सफल करे’
  alternative: 'भविष्यवाणी-सदृश कथन: ‘स्वर्ग का परमेश्वर तुम्हें सफल करेगा’'
  rationale: विदाई के समय पिता के आशीर्वाद में हिन्दी का इच्छार्थक रूप वाक्य के व्यवहारिक बल को ठीक से व्यक्त करता है; भविष्यकालीन संभावना पाद-टिप्पणी में सुरक्षित है।
- issue: संपत्ति-सूची में σώματα का अर्थ
  choice: मुख्य पाठ में ‘दास-दासियाँ’
  alternative: ‘शरीर’; या कम स्पष्ट ‘सेवक’
  rationale: ‘शरीर’ शाब्दिक है, पर इस सूची में मनुष्यों को संपत्ति मानने की ऐतिहासिक सामाजिक वास्तविकता इंगित होती है। ‘दास-दासियाँ’ उसे छिपाता नहीं; मूल की शाब्दिक अभिव्यक्ति पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य-विन्यास को हिन्दी में स्पष्ट बनाने के लिए सारा की विदाई और संपत्ति दिए जाने को अलग वाक्यों में रखा गया है। ‘दास-दासियाँ’ ऐतिहासिक कठोरता को अस्पष्ट नहीं करता, और भविष्यकाल/आशीर्वाद की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
