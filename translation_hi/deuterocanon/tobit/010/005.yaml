- source_word: Οὐ μέλει μοι
  choice: क्या मुझे इसकी चिंता नहीं है
  rationale: μέλει μοι चिंता या परवाह होने का भाव व्यक्त करता है। नकारात्मक आलंकारिक प्रश्न को बनाए रखने से वक्ता की गहरी व्यथा और आत्मग्लानि प्रकट होती है।
- source_word: τέκνον
  choice: मेरे बच्चे
  rationale: τέκνον स्नेहपूर्ण संबोधन है। हिन्दी में ‘मेरे बच्चे’ स्वाभाविक आत्मीयता व्यक्त करता है और यूनानी संज्ञा से लिंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀφῆκά σε
  choice: मैंने तुझे जाने दिया
  rationale: ἀφίημι यहाँ किसी को विदा होने देने या भेजने के अर्थ में है। ‘जाने दिया’ अनिच्छापूर्ण बिछोह के भाव और पूर्ण हो चुकी क्रिया को सुरक्षित रखता है।
- source_word: τὸ φῶς τῶν ὀφθαλμῶν μου
  choice: मेरी आँखों का उजाला
  rationale: यह अत्यंत प्रिय व्यक्ति के लिए प्रयुक्त स्नेहपूर्ण रूपक है। हिन्दी का प्रचलित मुहावरा मूल बिंब और उसकी भावात्मक तीव्रता दोनों को बनाए रखता है।
