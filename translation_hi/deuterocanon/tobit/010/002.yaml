base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/002.yaml
  text: he said[a], “Could it be that he has been delayed? Or could it be that Gabael has died, and no one is giving him the money?”
translation:
  language: hi
  text: उसने कहा[a], “कहीं ऐसा तो नहीं कि उनका अपमान हुआ है? या कहीं गबाएल मर तो नहीं गया, और कोई उसे वह धन नहीं दे रहा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ है, “उन्हें लज्जित किया गया है।” इसका संकेत किसी अपमानजनक बाधा या असफल प्रयास की ओर हो सकता है, पर ठीक परिस्थिति नहीं बताई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή ποτε
  choice: कहीं ऐसा तो नहीं कि
  rationale: यह वाक्यांश आशंकाभरे प्रश्न प्रस्तुत करता है; यह हिन्दी में चिंता और अनिश्चितता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατῄσχυνται
  choice: उसे लज्जित होना पड़ा है
  rationale: यूनानी क्रिया का मूल अर्थ लज्जित या अपमानित किया जाना है। यह अनुवाद किसी विशेष प्रकार की रुकावट मान लेने के बजाय मूल की अस्पष्टता बनाए रखता है।
- source_word: ἀπέθανεν
  choice: मर तो नहीं गया
  rationale: चिंतित प्रश्न के भीतर यूनानी क्रिया के सरल अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Γαβαήλ
  choice: गबाएल
  rationale: यूनानी नाम Γαβαήλ का देवनागरी लिप्यंतरण है; इसे अधिक परिचित किन्तु भिन्न नाम ‘गब्रिएल’ नहीं बनाया गया।
- source_word: δίδωσιν αὐτῷ τὸ ἀργύριον
  choice: कोई उसे वह धन नहीं दे रहा
  rationale: ἀργύριον यहाँ जमा की हुई राशि को सूचित करता है, इसलिए ‘धन’ आधुनिक हिन्दी में स्पष्ट है; ‘दे रहा’ मूल क्रिया के निकट रहता है और लौटाने या भुगतान की प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
