- source_word: κἀγὼ ἐξαποστελῶ πρὸς τὸν πατέρα σου
  choice: मैं तुम्हारे पिता के पास लोगों को भेजूँगा
  rationale: यूनानी क्रिया का मूल अर्थ ‘भेजना’ है। अगले बहुवचन क्रिया-रूप के कारण भेजे जाने वाले व्यक्तियों को ‘लोगों’ के रूप में स्पष्ट करना हिन्दी में स्वाभाविक है।
- source_word: δηλώσουσιν
  choice: वे ... बता देंगे
  rationale: बहुवचन क्रिया का अर्थ ‘वे प्रकट करेंगे/सूचित करेंगे’ है; ‘बता देंगे’ आधुनिक हिन्दी में सहज है और भेजे गए लोगों को कर्ता रहने देता है।
- source_word: τὰ κατὰ σέ
  choice: तुम्हारे विषय में सब कुछ
  rationale: मुहावरे का अर्थ संबोधित व्यक्ति से जुड़ी बातें या उसका हाल है। यह रूप अर्थ को स्पष्ट रखते हुए यूनानी की व्यापकता बनाए रखता है।
