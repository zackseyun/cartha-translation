  text: Then his father-in-law said to him[a], “Stay with me, and I will send word to your father, and they will make known to him the things concerning you.”
translation:
  language: hi
  text: तब उसके ससुर ने उससे कहा, “मेरे पास ठहरो। मैं तुम्हारे पिता के पास लोगों को भेजूँगा, और वे उन्हें तुम्हारे विषय की बातें बताएँगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘वे उन्हें तुम्हारे विषय की बातें बताएँगे’ बहुवचन है, यद्यपि ‘वे’ का कर्ता स्पष्ट नहीं किया गया है; सम्भवतः यह भेजे गए व्यक्तियों के लिए अनिश्चित बहुवचन है।
    reason: lexical_alternative
