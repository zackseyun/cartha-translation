- source_word: ἐλυπεῖτο
  choice: वह दुःखी था
  rationale: λυπέω का अपूर्ण भूतकालीन रूप यहाँ जारी भाव-दशा, अर्थात दुःख या व्यथा, व्यक्त करता है। ‘दुःखी था’ कारण को अनावश्यक रूप से निश्चित किए बिना इस अवस्था और उसके कालगत पक्ष को सहज आधुनिक हिन्दी में प्रकट करता है।
- source_word: λίαν
  choice: बहुत
  rationale: λίαν क्रिया में तीव्रता जोड़ता है। ‘बहुत’ सामान्य आधुनिक हिन्दी में दुःख की प्रबल मात्रा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
