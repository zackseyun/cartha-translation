  rationale: यूनानी में ऐतिहासिक वर्तमान काल, शाब्दिक रूप से ‘कहता है’, प्रयुक्त हुआ है। आधुनिक हिन्दी कथात्मक शैली में भूतकाल ‘ने कहा’ अधिक स्वाभाविक है।
- source_word: Ἐξαπόστειλόν
  choice: मुझे ... भेज दीजिए
  rationale: ἐξαποστέλλω की आज्ञार्थक क्रिया किसी को विदा करके किसी ओर भेजने का भाव रखती है। आदरसूचक ‘भेज दीजिए’ प्रसंगानुकूल, स्वाभाविक और दिशात्मक अर्थ को बनाए रखता है।
- source_word: πρὸς τὸν πατέρα μου
  choice: मेरे पिता के पास
  rationale: πρός के साथ कर्मकारक यहाँ किसी व्यक्ति की ओर गति दर्शाता है। ‘मेरे पिता के पास’ मूल पाठ का सीधा अनुवाद है; ‘घर’ या ‘वापस’ जोड़ना व्याख्यात्मक होता।
- source_word: Τωβείας
