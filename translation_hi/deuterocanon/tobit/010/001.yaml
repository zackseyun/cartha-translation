base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/001.yaml
  text: And Tobit his father counted each day[a]; and when the days of the journey were completed and they were not coming back[b],
translation:
  language: hi
  text: और उसका पिता तोबीत दिनों की गिनती करता रहता था; और जब यात्रा के दिन पूरे हो गए और वे नहीं आ रहे थे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे लौट नहीं रहे थे।” यूनानी क्रिया का अपूर्ण भूतकाल यह बता सकता है कि यात्रा का अपेक्षित समय बीत जाने पर भी वे अभी तक नहीं पहुँचे थे; प्रसंग में यह उनके नियत समय पर घर न लौटने का संकेत देता है। सामी समानांतर परंपरा इस दृश्य को बढ़ाकर दिनों और रातों की गिनती तथा माता-पिता के दुःख का उल्लेख करती है, पर मुख्य अनुवाद प्राथमिक यूनानी स्रोत के संक्षिप्त पाठ का अनुसरण करता है।
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ἐλογίζετο
  choice: गिनता रहता था
  rationale: ἑκάστης ἡμέρας के साथ यह बीतते दिनों की निरंतर गिनती का ठोस अर्थ देता है; अपूर्ण भूतकाल को भी स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἑκάστης ἡμέρας
  choice: हर दिन
  rationale: यह यूनानी के वितरणात्मक कालबोध को सरल और स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: ἐπληρώθησαν
  choice: पूरे हो गए
  rationale: समय की अपेक्षित अवधि समाप्त होने का सीधा अर्थ देता है और अनावश्यक धार्मिक अर्थच्छाया से बचता है।
- source_word: αἱ ἡμέραι τῆς πορείας
  choice: यात्रा के दिन
  rationale: यूनानी संरचना के निकट रहते हुए यात्रा की अपेक्षित अवधि को समझने योग्य ढंग से व्यक्त करता है।
- source_word: οὐκ ἤρχοντο
  choice: तब भी वे लौटते दिखाई नहीं दिए
  rationale: 'अपूर्ण भूतकाल में निहित जारी, अपूर्ण अपेक्षा को व्यक्त करता है: तय समय बीतने पर भी वे आते हुए नहीं दिखे। घर पर प्रतीक्षा के प्रसंग में ‘लौटते’ दिशात्मक भाव स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।'
- source_word: Καὶ
  choice: और
  rationale: कथात्मक संयोजक को सरलता से बनाए रखता है।
- source_word: Τωβεὶτ ὁ πατὴρ αὐτοῦ
  choice: उसका पिता तोबीत
  rationale: हिन्दी की स्वाभाविक शब्द-व्यवस्था में यूनानी के संबंध और समानाधिकरण, दोनों को स्पष्ट करता है।
