base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/013.yaml
  text: After these things Tobiah also went on his way[a], blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: hi
  text: इसके बाद टोबियाह भी अपनी यात्रा पर आगे बढ़ता गया। वह परमेश्वर को धन्य कहता जा रहा था, क्योंकि परमेश्वर ने उसकी यात्रा को सफल बनाया था[a]; और वह रगुएल और उसकी पत्नी एदना को बार-बार आशीष देता जा रहा था। वह आगे बढ़ता रहा, जब तक वे नीनवे के पास नहीं पहुँच गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से यूनानी में, “उसने उसके मार्ग को सफल किया”; यह एक मुहावरा है, जिसका अर्थ है कि परमेश्वर ने उसकी यात्रा को सफलता दी।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ यूनानी वाक्य-रचना असंगत है: क्रिया बहुवचन (“वे पास पहुँचे”) है, पर उसके साथ एकवचन सर्वनाम (“उसे”) आया है। मुख्य पाठ संभावित कथात्मक अर्थ देता है कि यात्री नीनवे के पास पहुँचे।'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह बहुवचन यूनानी पद का स्वाभाविक आधुनिक हिन्दी कथात्मक रूप है और पूर्ववर्ती घटनाओं से संबंध बनाए रखता है।
- source_word: ἐπορεύετο
  choice: अपने मार्ग पर आगे बढ़ा / आगे बढ़ता रहा
  rationale: अपूर्ण भूतकाल जारी यात्रा का बोध देता है; हिन्दी में प्रसंगानुसार इन रूपों से उस निरंतरता को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: εὐλογῶν τὸν θεόν
  choice: परमेश्वर को धन्य कहता जा रहा था
  rationale: यह εὐλογέω के मूल अर्थ और बाइबलीय धार्मिक भाषा को बनाए रखता है तथा जारी क्रिया भी व्यक्त करता है।
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: क्योंकि परमेश्वर ने उसकी यात्रा सफल की थी
  rationale: εὐοδόω और ὁδός का संयोग यात्रा को सफलता प्रदान करने का मुहावरा है। कर्ता को स्पष्ट करने के लिए हिन्दी में 'परमेश्वर' दोहराया गया है।
- source_word: κατευλόγει
  choice: बार-बार आशीष देता जा रहा था
  rationale: उपसर्गयुक्त क्रिया और अपूर्ण भूतकाल प्रबल अथवा निरंतर आशीष देने का भाव रखते हैं; यह हिन्दी रूप दोनों को सहजता से व्यक्त करता है।
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: रगुएल और उसकी पत्नी एदना
  rationale: यूनानी समानाधिकरण स्पष्ट करता है कि एदना रगुएल की पत्नी है; हिन्दी में स्वाभाविक शब्दक्रम अपनाया गया है।
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: जब तक वे नीनवे के पास नहीं पहुँच गए
  rationale: प्रेषित यूनानी में बहुवचन क्रिया और एकवचन सर्वनाम का असामंजस्य है। मुख्य पाठ यात्रियों के दल के नीनवे के निकट पहुँचने का संभावित कथात्मक अर्थ देता है और पादटिप्पणी कठिनाई बताती है।
theological_decisions:
- issue: यात्रा की सफलता का कर्ता
  choice: परमेश्वर ने टोबियाह की यात्रा सफल की
  alternative: परमेश्वर ने उसके मार्ग को समृद्ध किया, अथवा उसके व्यापक कार्य को सफलता दी
  rationale: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ स्वाभाविक रूप से यात्रा की सफलता परमेश्वर को श्रेय देता है। अनुवाद इस विधान को स्पष्ट रखता है, पर उससे आगे कोई धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। 'परमेश्वर को धन्य कहना' और मनुष्यों को 'आशीष देना' हिन्दी में क्रिया के भिन्न लक्ष्य स्पष्ट करते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
