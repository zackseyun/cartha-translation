translation:
  language: hi
  text: और टोबीत ने उससे कहा, “चुप रहो; चिंता मत करो। स्वस्थ रहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίγα
  choice: चुप रहो
  rationale: यह संक्षिप्त आज्ञार्थक रूप अन्ना को शांत करने के लिए है। ‘चुप रहो’ सीधा, स्वाभाविक और आधुनिक हिन्दी प्रयोग है।
- source_word: μὴ λόγον ἔχε
  choice: चिंता मत करो
  rationale: शाब्दिक अर्थ ‘कोई बात/मामला मत रखो’ है, जो हिन्दी में अस्पष्ट होगा। प्रसंग में टोबीत उसकी व्याकुलता शांत कर रहा है, इसलिए मुहावरेदार अर्थ ‘चिंता मत करो’ उपयुक्त है।
- source_word: ὑγίαινε
  choice: स्वस्थ रहो
  rationale: ὑγιαίνω का आज्ञार्थक रूप स्वास्थ्य और कुशलता से जुड़ा है। ‘स्वस्थ रहो’ मूल अर्थ को संक्षेप में बनाए रखता है, यद्यपि प्रसंग में यह कुशल रहने का प्रोत्साहन भी हो सकता है।
- source_word: λέγει αὐτῇ
  choice: उससे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है; मानक हिन्दी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है।
- source_word: Τωβείτ
  choice: टोबीत
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
