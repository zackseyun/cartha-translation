translation:
  language: hi
  text: और हे बेटे, मत डर कि हम गरीब हो गए हैं। यदि तू परमेश्वर का भय माने, हर पाप से दूर रहे और उसकी दृष्टि में वही करे जो उसे भाता है, तो तेरे पास बहुत कुछ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίον
  choice: हे बेटे
  rationale: संदर्भ में पिता अपने पुत्र को संबोधित कर रहा है; आधुनिक हिन्दी में यह स्वाभाविक और स्नेहपूर्ण है।
- source_word: ἐπτωχεύσαμεν
  choice: हम गरीब हो गए हैं
  rationale: ग्रीक पूर्ण भूतकाल से उत्पन्न वर्तमान दशा को सीधे व्यक्त करता है।
- source_word: φοβηθῇς τὸν θεόν
  choice: परमेश्वर का भय माने
  rationale: यह बाइबिलीय मुहावरा आतंक नहीं, बल्कि श्रद्धापूर्ण आज्ञाकारिता का भाव रखता है; ‘भय माने’ हिन्दी में इस तनाव को सुरक्षित रखता है।
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: हर पाप से दूर रहे
  rationale: ἀφίστημι का आशय पाप से हटना या उससे अलग रहना है।
- source_word: τὸ ἀρεστὸν ἐνώπιον αὐτοῦ
  choice: उसकी दृष्टि में वही करे जो उसे भाता है
  rationale: ‘उसके सामने प्रसन्न करने योग्य’ की अर्थ-संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπάρχει σοι πολλά
  choice: तेरे पास बहुत कुछ है
  rationale: बहुवचन नपुंसकलिंग πολλά को जानबूझकर सामान्य रखा गया है; इसे केवल धन या संपत्ति तक सीमित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर का भय और समृद्धि के बीच संबंध
  choice: शर्तवाचक कथन को ज्यों का त्यों रखा गया है
  alternative: इसे सांसारिक धन की सुनिश्चित प्रतिज्ञा के रूप में स्पष्ट करना
  rationale: मूल पाठ ‘बहुत कुछ’ कहता है और उसके स्वरूप को नहीं खोलता; अनुवाद उस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दिए गए यूनानी स्रोत का आरंभ इस वाक्य से होता है, जबकि संदर्भ-संख्या और अंग्रेज़ी परामर्श-पाठ उससे मेल नहीं खाते; इसलिए मसौदा सीधे उपलब्ध यूनानी वाक्य पर आधारित है। स्रोत में वाक्य के बाद आया अकेला αὐτῷ पाठगत रूप से असंबद्ध प्रतीत होता है और इस पद के अनुवाद में शामिल नहीं किया गया।
