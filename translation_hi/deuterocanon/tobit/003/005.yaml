  yaml_path: translation/deuterocanon/tobit/003/005.yaml
  text: And now your judgments are many and true in dealing with me concerning my sins and the sins of my fathers[a], because we did not keep your commandments[b]; for we did not walk in truth before you.
translation:
  language: hi
  text: और अब, मेरे पापों और मेरे पूर्वजों के पापों के विषय में तूने मेरे साथ जो बहुत-से न्याय-निर्णय किए हैं, वे सत्य हैं[a], क्योंकि हमने तेरी आज्ञाओं का पालन नहीं किया; हम तेरे सामने सत्य के अनुसार नहीं चले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे बहुत-से न्याय-निर्णय उचित हैं।’ यूनानी में शाब्दिक शब्द ‘सत्य’ है, जो इस प्रसंग में परमेश्वर के निर्णयों की उचितता की भी पुष्टि करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सत्य के अनुसार चलना’ बाइबिल का एक मुहावरा है, जिसका अर्थ परमेश्वर के सामने सच्चाई और विश्वासयोग्यता से जीवन बिताना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσεις
  choice: न्याय-निर्णय
  rationale: यह शब्द यहाँ परमेश्वर के न्यायिक व्यवहार अथवा निर्णयों को सूचित करता है। ‘न्याय-निर्णय’ औपचारिक अर्थ को बनाए रखता है और सामान्य हिन्दी में केवल ‘न्याय’ की अपेक्षा अधिक स्पष्ट है।
- source_word: ἀληθιναί
  choice: सत्य
  rationale: यूनानी विशेषण का सीधा अर्थ ‘सत्य’ है। प्रसंग में इससे निर्णयों की उचितता भी प्रकट होती है, पर ‘न्यायपूर्ण’ करने से मूल का व्यापक अर्थ संकुचित हो जाता।
- source_word: ἐξ ἐμοῦ ποιῆσαι
  choice: मेरे साथ व्यवहार करते हुए
  rationale: यूनानी पदबंध असामान्य है और तोबित के प्रति परमेश्वर के कार्य को व्यक्त करता है। यह अनुवाद अर्थ को स्वाभाविक हिन्दी में रखता है, बिना उसे अनावश्यक रूप से ‘मेरे विरुद्ध’ कहे।
- source_word: περὶ τῶν ἁμαρτιῶν μου καὶ τῶν πατέρων μου
  choice: मेरे पापों और मेरे पूर्वजों के पापों के विषय में
  rationale: περί यहाँ संबंध या आधार का भाव देता है। दूसरे ‘पापों’ को स्पष्ट रूप से दोहराने से हिन्दी में अर्थ अस्पष्ट नहीं रहता।
- source_word: ἐντολάς
  choice: आज्ञाओं
  rationale: यह वाचा और नैतिक दायित्व के भार को बनाए रखने वाला प्रचलित बाइबिलीय शब्द है।
- source_word: ἐπορεύθημεν ἐν ἀληθείᾳ
  choice: हम सत्य में नहीं चले
  rationale: ‘चलना’ जीवन-आचरण का बाइबिलीय रूपक बनाए रखता है और ‘सत्य में’ ἀληθείᾳ की व्यापकता—सच्चाई और विश्वासयोग्यता—को खुला रखता है।
- source_word: ἐνώπιόν σου
  choice: तेरे सामने
  rationale: यह परमेश्वर की उपस्थिति और दृष्टि में जीवन बिताने का संबंधपरक तथा न्यायिक भाव संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के निर्णयों को स्पष्ट रूप से ‘न्यायपूर्ण’ कहना या मूल के अनुसार ‘सत्य’ रखना
  choice: सत्य
  alternative: न्यायपूर्ण
  rationale: प्रसंग परमेश्वर के व्यवहार की उचितता स्वीकार करता है, पर मूल यूनानी में ἀληθιναί, अर्थात ‘सत्य’, है। इसे बनाए रखने से नैतिक निहितार्थ प्रसंग से उभरता है और मूल की शब्दावली सुरक्षित रहती है।
- issue: पूर्वजों के पापों को विरासत में मिले व्यक्तिगत दोष के रूप में समझाना या पारिवारिक-सामूहिक अंगीकार के रूप में रहने देना
  choice: मेरे पूर्वजों के पाप
  alternative: हमारे पैतृक पाप
  rationale: मूल पाठ सीधे ‘मेरे पापों और मेरे पूर्वजों के [पापों]’ की बात करता है। यह अनुवाद सामूहिक अंगीकार को रखता है, पर विरासत में मिले दोष के विषय में ऐसा सिद्धांत नहीं जोड़ता जिसे पद स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक रूप रखा गया है। परमेश्वर के लिए एकवचन निकटतासूचक ‘तू/तेरा’ शैली अपनाई गई है। ‘न्याय-निर्णय’ और ‘सत्य में चलना’ मूल की न्यायिक तथा बाइबिलीय रूपक-भाषा को सुरक्षित रखते हैं; मुहावरे की व्याख्या पादटिप्पणी में दी गई है।
