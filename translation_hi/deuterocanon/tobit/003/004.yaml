base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/004.yaml
  text: For they disobeyed your commandments, and you gave us over to plunder and captivity and death, and to become a proverb of reproach among all the nations where we have been scattered.
translation:
  language: hi
  text: क्योंकि उन्होंने तेरी आज्ञाओं का पालन नहीं किया; और तूने हमें लूट, बंदीपन और मृत्यु के हवाले कर दिया, और उन सब जातियों के बीच, जिनमें हम तितर-बितर किए गए हैं, निंदा की कहावत[a] बना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपमान का विषय” अथवा “बदनामी की कहावत।” यूनानी पद में “कहावत” और “निंदा” के भाव साथ जुड़े हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήκουσαν
  choice: उन्होंने ... पालन नहीं किया
  rationale: क्रिया का अर्थ आज्ञा को न सुनना अथवा न मानना है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और बहुवचन कर्ता को बनाए रखती है।
- source_word: ἐντολῶν
  choice: आज्ञाओं
  rationale: यह धार्मिक और वाचागत संदर्भ में यूनानी शब्द की औपचारिक शक्ति को सुरक्षित रखता है।
- source_word: ἔδωκας ἡμᾶς εἰς
  choice: तूने हमें ... के हाथ सौंप दिया
  rationale: यह विपत्ति के अधीन कर दिए जाने और परमेश्वर की न्यायिक सक्रियता—दोनों को स्पष्ट रखता है। 'के हाथ' हिन्दी मुहावरे के अनुसार जोड़ा गया है।
- source_word: διαρπαγήν
  choice: लूट
  rationale: यह लूटे जाने अथवा लूट का शिकार बनने का संक्षिप्त और सामान्य हिन्दी रूप है।
- source_word: αἰχμαλωσίαν
  choice: बँधुआई
  rationale: यह पकड़े जाकर पराधीन रहने की दशा को व्यक्त करता है और केवल भौगोलिक निर्वासन तक अर्थ को सीमित नहीं करता।
- source_word: θάνατον
  choice: मृत्यु
  rationale: यूनानी शब्द का सीधा अर्थ रखा गया है; इसे विनाश जैसे व्यापक अर्थ में नहीं बदला गया।
- source_word: παραβολὴν ὀνειδισμοῦ
  choice: निन्दा की कहावत
  rationale: यह 'कहावत/उपहास का विषय' और 'निन्दा/अपमान' के संयुक्त यूनानी बिम्ब को निकटता से सुरक्षित रखता है; सम्भावित मुहावरेदार अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: सब जातियों के बीच
  rationale: निर्वासन के संदर्भ में 'जातियाँ' व्यापक और उपयुक्त है; 'अन्यजाति' बाद की धार्मिक शब्दावली को अनावश्यक रूप से प्रमुख कर सकती है।
- source_word: ἐν οἷς ἐσκορπίσμεθα
  choice: जिनमें हम तितर-बितर किए गए हैं
  rationale: यह जातियों के बीच बिखराव, कर्मवाच्य और उसके वर्तमान परिणाम को बनाए रखता है।
theological_decisions:
- issue: सामूहिक अंगीकार और न्याय में परमेश्वर की सक्रियता
  choice: '''उन्होंने'' की अवज्ञा और ''तूने हमें ... सौंप दिया''—दोनों को यथावत रखा गया है।'
  alternative: '''हमने आज्ञा नहीं मानी'' कहना, अथवा परमेश्वर की सक्रियता घटाकर ''हम सौंप दिए गए'' कहना।'
  rationale: यूनानी पाठ अवज्ञा करने वालों के लिए तृतीय पुरुष बहुवचन और परिणाम भुगतने वाले समुदाय के लिए प्रथम पुरुष बहुवचन प्रयोग करता है, साथ ही सौंपने की क्रिया परमेश्वर को देता है। अनुवाद इस तनाव को नहीं मिटाता।
- issue: सार्वजनिक लज्जा का मुहावरा
  choice: मुख्य पाठ में 'निन्दा की कहावत' रखा गया है।
  alternative: '''अपमान का विषय'' या ''बदनामी का पर्याय''।'
  rationale: मुख्य पाठ स्रोत के कहावत/उपकथा वाले बिम्ब को बचाता है, जबकि पाद-टिप्पणी हिन्दी पाठक के लिए उसका मुहावरेदार आशय स्पष्ट करती है।
translation_notes:
  register: प्रार्थना के प्रसंग के अनुरूप परमेश्वर के लिए गरिमापूर्ण निकटवर्ती एकवचन 'तू/तेरी' रखा गया है। भाषा आधुनिक और सहज है, पर 'बँधुआई' तथा 'निन्दा' जैसे शब्द धार्मिक-ऐतिहासिक गम्भीरता बनाए रखते हैं।
