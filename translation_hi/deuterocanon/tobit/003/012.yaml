  terminology: ‘हे प्रभु’ is an appropriate reverent rendering of Κύριε. ‘चेहरा’ is more natural than ‘मुख’ in this modern-Hindi sentence while retaining the concrete bodily sense of πρόσωπον. The footnote should describe the literal alternative as an idiom of turning oneself toward God, rather than using the unnatural ‘लगाने’ phrasing.
