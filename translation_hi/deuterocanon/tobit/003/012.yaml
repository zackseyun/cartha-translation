lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: यह प्रार्थना में तत्काल मोड़ दिखाने वाला सीधा संक्रमण है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: संबोधन कारक को आधुनिक, स्वाभाविक और आदरपूर्ण हिन्दी में व्यक्त करता है।
- source_word: τοὺς ὀφθαλμούς μου
  choice: अपनी आँखें
  rationale: शारीरिक बिंब को बनाए रखता है; इसे केवल ‘दृष्टि’ कहने से मूल की ठोस भाषा कुछ कम हो जाती।
- source_word: τὸ πρόσωπόν μου
  choice: अपना मुख
  rationale: ‘आँखें’ के साथ जुड़ी शारीरिक और दिशात्मक छवि को सुरक्षित रखता है।
- source_word: εἰς σὲ
  choice: आपकी ओर
  rationale: परमेश्वर की ओर प्रार्थनापूर्वक उन्मुख होने की दिशा स्पष्ट करता है और आदरार्थी हिन्दी के अनुकूल है।
- source_word: δέδωκα
  choice: लगाया है
  rationale: पूर्ण काल के परिणामकारी भाव को रखते हुए यूनानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक ‘दे दिया है’ यहाँ असहज और भ्रामक हो सकता है।
theological_decisions:
- issue: प्रत्यक्ष संबोधन में κύριος का अनुवाद
  choice: हे प्रभु
  alternative: प्रभु
  rationale: यह परमेश्वर को संबोधित प्रार्थना है। ‘हे प्रभु’ हिन्दी में संबोधन को स्पष्ट और आदरपूर्ण बनाता है, बिना यूनानी पाठ से अधिक विशिष्ट वाचाई नाम जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनापूर्ण, गरिमामय और सामान्य पाठकों के लिए सहज। ‘मुख’ ने मूल के शारीरिक बिंब को बनाए रखा है, जबकि ‘आपकी ओर लगाया है’ यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
