lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: के बारे में बता रहा हूँ
  rationale: यह क्रिया दिखाने, ध्यान दिलाने या अवगत कराने का अर्थ दे सकती है। इस प्रसंग में धन को सामने रखकर दिखाने की अपेक्षा उसके विषय में पुत्र को बताना अधिक स्वाभाविक है; वर्तमान काल को ‘बता रहा हूँ’ से बनाए रखा गया है।
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: चाँदी की उन दस किक्कारों
  rationale: τάλαντον प्राचीन भार और मौद्रिक मात्रा है। बाइबलीय हिन्दी में प्रचलित ‘किक्कार’ इसे आधुनिक मुद्रा में बदले बिना ऐतिहासिक इकाई को सुरक्षित रखता है। निश्चित पदबंध को प्रसंगानुकूल ‘उन’ से व्यक्त किया गया है।
- source_word: παρεθέμην
  choice: जमा किया था
  rationale: मध्यवाच्य रूप किसी के पास धन सुरक्षित रखने के लिए सौंपने का भाव देता है। ‘जमा किया था’ वित्तीय संदर्भ में सहज और सटीक है।
- source_word: Γαβαήλῳ
  choice: गबाएल
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: τῷ τοῦ Γαβρεία
  choice: गब्रिया के पुत्र
  rationale: लेख के साथ संबंधकारक व्यक्तिगत नाम यहाँ पितृनाम द्वारा पहचान कराता है; आधुनिक हिन्दी में ‘गब्रिया के पुत्र’ स्वाभाविक है।
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: मादै के रागेस नगर में
  rationale: स्थाननाम का लिप्यंतरण रखा गया है और प्राचीन प्रदेश Media के लिए हिन्दी बाइबलीय रूप ‘मादै’ अपनाया गया है। स्पष्टता के लिए ‘नगर’ जोड़ा गया है।
