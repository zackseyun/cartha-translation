  yaml_path: translation/deuterocanon/tobit/003/008.yaml
  text: because she had been given to seven husbands[a], and Asmodeus, the evil demon, killed them before they could be with her as with wives. And they said to her, “Do you not understand that you are choking your husbands? Already you have had seven, and you have not benefited from even one of them.”
translation:
  language: hi
  text: क्योंकि वह सात पतियों से ब्याही गई थी, और दुष्ट आत्मा अस्मोदायोस ने उन्हें मार डाला था, इससे पहले कि वे उसके साथ दाम्पत्य संबंध बना पाते।[a] उन्होंने उससे कहा, “क्या तुम नहीं समझती कि तुम अपने पतियों का दम घोंट रही हो? तुम्हारे सात पति हो चुके हैं, और उनमें से एक से भी तुम्हें कोई लाभ नहीं हुआ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, उन पतियों के उसके साथ दाम्पत्य संबंध स्थापित करने से पहले। यूनानी में दाम्पत्य संयोग को शिष्टोक्ति में व्यक्त किया गया है।
    reason: lexical_alternative
