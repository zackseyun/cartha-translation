  text: Seek counsel from every wise person[a], and do not despise any useful counsel.
translation:
  language: hi
  text: हर बुद्धिमान व्यक्ति से सलाह लो, और किसी भी उपयोगी सलाह को तुच्छ न समझो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी भी लाभदायक सलाह की उपेक्षा न करो।”
    reason: καταφρονέω के लिए अपेक्षाकृत हलका विकल्प ‘उपेक्षा करना’ और χρησίμης के लिए ‘लाभदायक’ सम्भव हैं।
lexical_decisions:
- source_word: συμβουλίαν / συμβουλίας
  choice: सलाह
  rationale: यह संज्ञा निर्णय लेने के लिए दी जाने वाली सम्मति या परामर्श को दर्शाती है। आधुनिक हिन्दी में ‘सलाह’ दोनों वाक्यांशों में स्वाभाविक और स्पष्ट है।
- source_word: παρὰ παντὸς φρονίμου
  choice: हर बुद्धिमान व्यक्ति से
  rationale: παρά संबंधकारक के साथ स्रोत को दर्शाता है, इसलिए ‘से’; φρόνιμος यहाँ संज्ञा की तरह प्रयुक्त सामान्य विशेषण है, इसलिए लिंग-विशिष्ट ‘पुरुष’ के बजाय ‘बुद्धिमान व्यक्ति’ उपयुक्त है।
- source_word: ζήτησον
  choice: लो
  rationale: आज्ञार्थक ζήτησον सक्रिय रूप से सलाह खोजने या माँगने को कहता है। हिन्दी में ‘सलाह लो’ इस आशय का स्वाभाविक प्रयोग है।
- source_word: μὴ καταφρονήσῃς
  choice: तुच्छ न समझो
  rationale: καταφρονέω में केवल अनदेखा करने से अधिक, किसी वस्तु को हेय या तुच्छ मानने का भाव है; यह अनुवाद उस प्रबल अर्थ को बनाए रखता है।
- source_word: χρησίμης
  choice: उपयोगी
  rationale: यह शब्द ऐसी सलाह को बताता है जो काम की या लाभदायक हो; ‘उपयोगी’ इसका सीधा और सहज हिन्दी रूप है।
theological_decisions:
- issue: φρονίμου का सामान्य, लिंग-निरपेक्ष संदर्भ
  choice: बुद्धिमान व्यक्ति
  alternative: बुद्धिमान पुरुष
  rationale: यूनानी में पुरुषवाचक संज्ञा नहीं, बल्कि संज्ञा के रूप में प्रयुक्त विशेषण है, जिसका संदर्भ सामान्य है; इसलिए अनावश्यक पुरुष-विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सलाह’ की पुनरावृत्ति यूनानी में συμβουλία के दोनों प्रयोगों को प्रतिबिम्बित करती है और हिन्दी में अस्वाभाविक नहीं लगती।
