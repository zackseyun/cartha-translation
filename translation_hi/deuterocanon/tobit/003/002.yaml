base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/002.yaml
  text: You are righteous[a], Lord, and all your works and all your ways are mercy and truth, and you judge true and righteous judgment forever.
translation:
  language: hi
  text: हे प्रभु, आप धर्मी हैं, और आपके सभी कार्य और आपके सभी मार्ग करुणा और सत्य हैं[a]; आप सदा सच्चा और न्यायपूर्ण न्याय करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके सभी मार्ग करुणा के कार्य और विश्वासयोग्यता हैं।” यूनानी में “करुणा” के लिए प्रयुक्त बहुवचन शब्द करुणापूर्ण कार्यों को भी सूचित कर सकता है, और “सत्य” का अर्थ “विश्वासयोग्यता” भी हो सकता है।
    reason: शब्दार्थ के वास्तविक वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: Δίκαιος
  choice: धर्मी
  rationale: यह प्रभु के चरित्र का विधेयात्मक वर्णन है। ‘धर्मी’ नैतिक और धर्मवैचारिक अर्थ को स्वाभाविक बाइबलीय हिन्दी में रखता है; ‘न्यायी’ सम्भव है, पर आगे न्याय-संबंधी शब्दों के कारण उसे यहाँ नहीं चुना गया।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: परमेश्वर को सीधे संबोधन के लिए आधुनिक, गरिमापूर्ण और प्रचलित रूप।
- source_word: ἔργα
  choice: कार्य
  rationale: परमेश्वर जो कुछ करते हैं उसके व्यापक अर्थ को बिना संकुचित किए व्यक्त करता है।
- source_word: ὁδοί
  choice: मार्ग
  rationale: परमेश्वर के आचरण और शासन की रीति के लिए प्रचलित बाइबलीय रूपक को सुरक्षित रखता है।
- source_word: ἐλεημοσύναι
  choice: करुणा
  rationale: इस संदर्भ में परमेश्वर के मार्गों का वर्णन है, इसलिए मानव द्वारा दिए जाने वाले दान का संकीर्ण अर्थ उपयुक्त नहीं। यूनानी बहुवचन दयापूर्ण कार्यों का भाव भी दे सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ἀλήθεια
  choice: सत्य
  rationale: यूनानी शब्द का सीधा अर्थ सुरक्षित रखता है; ‘विश्वासयोग्यता’ का अर्थ-संकेत वास्तविक है और पादटिप्पणी में दिया गया है।
- source_word: κρίσιν ἀληθινὴν καὶ δικαίαν
  choice: सच्चा और न्यायपूर्ण न्याय
  rationale: दोनों विशेषणों को स्पष्ट रूप से बनाए रखता है और हिन्दी में ‘धर्मी न्याय’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: κρίνεις
  choice: न्याय करते हैं
  rationale: सीधा और स्वाभाविक हिन्दी प्रयोग, जो न्याय करने की क्रिया को व्यक्त करता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: स्थायी और निरंतर काल का सहज हिन्दी रूप; यहाँ यह परमेश्वर के न्याय करने को विशेषित करता है।
theological_decisions:
- issue: ἀλήθεια का अर्थ ‘सत्य’ रखा जाए या ‘विश्वासयोग्यता’
  choice: सत्य
  alternative: विश्वासयोग्यता
  rationale: मुख्य पाठ में यूनानी का सीधा अर्थ रखा गया है, जबकि करुणा के साथ इसकी जोड़ी में परमेश्वर की विश्वसनीयता का अर्थ-संकेत पादटिप्पणी में सुरक्षित है।
- issue: ἐλεημοσύναι के बहुवचन को अमूर्त ‘करुणा’ या ‘करुणा के कार्य’ के रूप में व्यक्त करना
  choice: करुणा
  alternative: करुणा के कार्य
  rationale: विधेय ‘आपके सभी मार्ग करुणा और सत्य हैं’ यूनानी की संक्षिप्तता और काव्यात्मक समानता को बनाए रखता है; बहुवचन का कार्यात्मक भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर के संबोधन में आदरसूचक बहुवचन ‘आप’ रखा गया है। ‘धर्मी’, ‘मार्ग’, ‘सत्य’ और ‘न्याय’ जैसे परिचित बाइबलीय पदों को सामान्य पाठक के लिए सहज वाक्य-विन्यास में रखा गया है।
