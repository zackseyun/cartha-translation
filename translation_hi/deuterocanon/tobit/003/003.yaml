base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/003.yaml
  text: Remember me and look upon me[a]; do not punish me for my sins and my errors done in ignorance, and for those of my fathers[c][b], which they committed before you.
translation:
  language: hi
  text: मुझे स्मरण कर और मुझ पर दृष्टि कर; मेरे पापों, अनजाने में किए गए मेरे अपराधों[a] और मेरे पूर्वजों के पापों के लिए मुझे दण्ड न दे[b]—उन पापों के लिए जो उन्होंने तेरे सामने किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ऐसे अपराध जो अज्ञान में या पूरी समझ के बिना किए गए हों।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे पापों का बदला न ले।” यूनानी क्रिया में बदला लेने या न्यायोचित प्रतिफल देने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητί μου
  choice: मुझे स्मरण कर
  rationale: प्रार्थना के संदर्भ में यह परमेश्वर से कृपापूर्वक ध्यान देने की विनती है। ‘स्मरण कर’ मूल क्रिया और गरिमापूर्ण प्रार्थना-शैली दोनों को बनाए रखता है।
- source_word: ἐπίβλεψον ἐπʼ ἐμέ
  choice: मुझ पर दृष्टि कर
  rationale: यह वाक्यांश ईश्वरीय ध्यान की याचना को प्रबल करता है। ‘दृष्टि कर’ आधुनिक हिन्दी में गरिमापूर्ण और बोधगम्य है।
- source_word: μὴ ἐκδίκῃς
  choice: दण्ड न दे
  rationale: ἐκδικέω प्रतिशोध लेने अथवा न्यायोचित प्रतिफल देने का अर्थ रख सकता है। पापों से जुड़ी इस पश्चात्तापपूर्ण प्रार्थना में ‘दण्ड न दे’ आशय को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: τὰς ἁμαρτίας μου
  choice: मेरे पापों
  rationale: ἁμαρτία के नैतिक और धार्मिक भार को व्यक्त करने वाला सीधा और प्रचलित हिन्दी पर्याय है।
- source_word: τοῖς ἀγνοήμασίν μου
  choice: अनजाने में किए गए मेरे अपराधों
  rationale: ἀγνόημα ऐसे अनुचित काम को सूचित करता है जो अज्ञान या पूरी जानकारी के अभाव में हुआ हो। यह अनुवाद उस सूक्ष्मता को ‘गलतियों’ से अधिक स्पष्टता से बनाए रखता है।
- source_word: τῶν πατέρων μου
  choice: मेरे पूर्वजों के पापों
  rationale: शाब्दिक अर्थ ‘मेरे पितरों/पिताओं’ है, पर यहाँ वंशगत पूर्वज अभिप्रेत हैं। हिन्दी में ‘पूर्वजों’ स्वाभाविक है। ‘पापों’ की पूर्ति प्रसंग और अगले संबंधवाचक उपवाक्य से स्पष्ट है।
- source_word: ἃ ἥμαρτον ἐνώπιόν σου
  choice: उन पापों के लिए जो उन्होंने तेरे सामने किए
  rationale: बहुवचन क्रिया ἥμαρτον का कर्ता निकटतम बहुवचन ‘पूर्वज’ है। ‘तेरे सामने’ ἐνώπιόν σου की संबंधपरक और न्यायिक छाया को बनाए रखता है।
theological_decisions:
- issue: संबंधवाचक उपवाक्य ἃ ἥμαρτον ἐνώπιόν σου का विस्तार
  choice: इसे विशेष रूप से पूर्वजों और उनके किए पापों से जोड़ा गया है।
  alternative: इसे पहले उल्लिखित सभी पापों का व्यापक सार भी समझा जा सकता है।
  rationale: बहुवचन क्रिया ἥμαρτον सबसे स्वाभाविक रूप से निकटतम बहुवचन पद ‘मेरे पूर्वजों’ की ओर संकेत करती है। अनुवाद व्यक्तिगत और पूर्वजों के पापों को अलग रखते हुए मूल का तनाव बनाए रखता है।
- issue: ἐκδικέω में दण्ड और प्रतिशोध की अर्थ-छाया
  choice: मुख्य पाठ में ‘दण्ड न दे’।
  alternative: ‘मेरे पापों का बदला न ले’ अथवा ‘उनका प्रतिफल न दे’।
  rationale: प्रसंग में याचना पापों के न्यायिक प्रतिफल से बचाए जाने की है। ‘दण्ड’ स्पष्ट है, जबकि मूल की अधिक तीखी प्रतिशोध/न्याय-वसूली की छाया पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे’ और आज्ञार्थक ‘कर/दे’ मूल यूनानी के सीधे एकवचन संबोधन को दर्शाते हैं। वाक्य को स्पष्ट बनाने के लिए ‘पूर्वजों के पापों’ और ‘उन पापों के लिए’ में ‘पाप’ की पूर्ति की गई है; इससे बहुवचन क्रिया का पूर्वजों से संबंध स्पष्ट रहता है।
