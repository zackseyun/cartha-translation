base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, as he wills. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: hi
  text: और हर समय प्रभु परमेश्वर को धन्य कहता रह, और उसी से माँग कि तेरे मार्ग सीधे हों[a] और तेरी सभी राहें और योजनाएँ सफल हों। क्योंकि किसी भी राष्ट्र के पास परामर्श नहीं है[b], बल्कि प्रभु स्वयं सब अच्छी वस्तुएँ देता है; और जिसे वह चाहता है, उसे दीन करता है—जैसा वह चाहता है। और अब, हे बालक, मेरी आज्ञाओं को स्मरण रख, और वे तेरे हृदय से मिट न जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का अधिक शाब्दिक अनुवाद ‘तेरे मार्ग सीधे बनें’ भी हो सकता है; वाक्यांश मार्गों के सीधे होने या सीधे किए जाने—दोनों भावों को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘किसी भी राष्ट्र के पास परामर्श नहीं है’ यूनानी में बहुत संक्षिप्त कथन है। इसका आशय यह हो सकता है कि कोई भी जनसमुदाय अपने आप में भरोसेमंद परामर्श नहीं रखता; इसके विपरीत प्रभु ही सब अच्छी वस्तुएँ देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: हर समय
  rationale: यह यूनानी पदबंध के व्यापक और निरंतर भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὐλόγει
  choice: धन्य कह
  rationale: यह εὐλογέω के मूल अर्थ और परमेश्वर के प्रति प्रयुक्त बाइबलीय अभिव्यक्ति को बनाए रखता है; केवल ‘स्तुति कर’ कहने से शब्द का विशिष्ट भाव कुछ कम हो जाता।
- source_word: Κύριον τὸν Θεόν
  choice: प्रभु परमेश्वर
  rationale: यह दोनों ईश्वरीय उपाधियों को उनके यूनानी क्रम में स्वाभाविक हिन्दी रूप देता है।
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: उसी से माँग
  rationale: ‘उसी’ स्रोत में आए बल और παρʼ के ‘से’ भाव, दोनों को स्पष्ट करता है।
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: कि तेरे मार्ग सीधे हों
  rationale: यह परिणामसूचक भाव को सरल हिन्दी में रखता है और ‘सीधे बनें’ तथा ‘सीधे किए जाएँ’ के बीच यूनानी की संभावित व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τρίβοι καὶ βουλαὶ
  choice: राहें और योजनाएँ
  rationale: ‘राहें’ ὁδοί के समानांतर मार्ग-रूपक को बनाए रखता है, जबकि ‘योजनाएँ’ यहाँ βουλαί के व्यावहारिक आशय को स्पष्ट करता है।
- source_word: εὐοδωθῶσιν
  choice: सफल हों
  rationale: यह अनुकूल परिणाम और उन्नति के भाव को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: किसी भी जाति के पास परामर्श नहीं है
  rationale: यह यूनानी कथन की संक्षिप्तता और असामान्यता को बनाए रखता है; ‘सच्चा’ या ‘विश्वसनीय’ जोड़कर अर्थ को चुपचाप निश्चित नहीं करता।
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: सब अच्छी वस्तुएँ देता है
  rationale: यह व्यापक अभिव्यक्ति और प्रभु की सक्रिय भूमिका दोनों को सीधे रूप में सुरक्षित रखता है।
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: जिसे वह चाहता है, उसे दीन करता है
  rationale: संदर्भ में ταπεινοῖ का लक्ष्य व्यक्ति समझना स्वाभाविक है। ‘दीन करता है’ सामाजिक और धार्मिक दोनों अर्थ-छायाएँ बनाए रखता है।
- source_word: μνημόνευε τῶν ἐντολῶν μου
  choice: मेरी आज्ञाओं को स्मरण रख
  rationale: यह स्मरण को लगातार बनाए रखने की आज्ञा और ἐντολαί की प्रामाणिकता, दोनों को व्यक्त करता है।
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: वे तेरे हृदय से मिट न जाएँ
  rationale: यह मिटाए जाने के रूपक और हृदय को स्मृति तथा निष्ठा के केंद्र के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: κύριος को परमेश्वर की उपाधि के रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος परमेश्वर के लिए श्रद्धापूर्ण उपाधि है; ‘प्रभु परमेश्वर’ आधुनिक हिन्दी की स्वाभाविक बाइबलीय अभिव्यक्ति है।
- issue: ὃ ἐὰν θέλῃ ταπεινοῖ में ईश्वरीय स्वतंत्रता और दीन किए जाने का कथन
  choice: जिसे वह चाहता है, उसे दीन करता है—जैसा वह चाहता है
  alternative: जो कुछ वह चाहता है, उसे नीचा करता है—जैसा उसे उचित लगता है
  rationale: चुना हुआ पाठ व्यक्तियों पर लागू ईश्वरीय क्रिया को संदर्भानुकूल ढंग से व्यक्त करता है और कथन की कठोरता को नरम या व्यवस्थित धर्मसिद्धांत में परिवर्तित नहीं करता।
- issue: πᾶν ἔθνος οὐκ ἔχει βουλήν का मनुष्य और परमेश्वर के परामर्श के बीच विरोध
  choice: किसी भी जाति के पास परामर्श नहीं है
  alternative: किसी भी जाति के पास अपने आप में विश्वसनीय परामर्श नहीं है
  rationale: मुख्य पाठ स्रोत की संक्षिप्त और तनावपूर्ण भाषा को रखता है; संभावित व्याख्या को पादटिप्पणी में दिया गया है ताकि मानव परामर्श के पूर्ण निषेध को अनजाने में न थोपा जाए।
