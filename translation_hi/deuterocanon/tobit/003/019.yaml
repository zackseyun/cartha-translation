  register: भाषा आधुनिक मानक हिन्दी में है, पर संबोधन और ज्ञानोपदेश के प्रसंग के अनुरूप गरिमापूर्ण बाइबलीय लहजा रखा गया है। ‘तू/तेरा’ के एकवचन आत्मीय रूप को ‘तेरे’ और आज्ञार्थक क्रियाओं में बनाए रखा गया है। ‘हे बालक’ παιδίον का औपचारिक किंतु स्पष्ट संबोधन है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित वाक्यांशों के ठीक बाद रखे गए हैं।
