  yaml_path: translation/deuterocanon/tobit/003/011.yaml
  text: And she prayed by the window and said[a], “Blessed are you, Lord my God, and blessed is your holy and honored name forever; let all your works bless you forever.”
translation:
  language: hi
  text: और उसने खिड़की के पास प्रार्थना की और कहा, “हे प्रभु, मेरे परमेश्वर, आप धन्य हैं; आपका पवित्र और आदरणीय नाम युगानुयुग धन्य है। आपके सभी कार्य सदा तक आपको धन्य कहें।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके सभी कार्य सदा तक आपकी स्तुति करें।” यूनानी में यहाँ उसी ‘धन्य’ शब्द-समूह की पुनरावृत्ति है जो पद में पहले आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθη
  choice: प्रार्थना की
  rationale: यह क्रिया विनती या याचना करने का भाव रखती है। इस प्रार्थना-संदर्भ में ‘प्रार्थना की’ स्वाभाविक है और मूल भाव को अनावश्यक रूप से तीव्र नहीं करती।
- source_word: πρὸς τῇ θυρίδι
  choice: खिड़की के पास
  rationale: θυρίς खिड़की या खुले झरोखे को दर्शाता है; यहाँ πρός के साथ स्थान-समीपता का अर्थ सबसे स्वाभाविक है।
- source_word: Εὐλογητὸς
  choice: धन्य
  rationale: परमेश्वर को संबोधित स्तुतिपरक विशेषण के लिए ‘धन्य’ प्रतिष्ठित, संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: Κύριε ὁ θεός μου
  choice: हे प्रभु, मेरे परमेश्वर
  rationale: सीधे ईश्वरीय संबोधन को हिन्दी के स्वाभाविक संबोधन-रूप में रखा गया है; κύριος के लिए ‘प्रभु’ उपयुक्त है।
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔντιμον
  choice: आपका पवित्र और आदरणीय नाम
  rationale: ἔντιμος में सम्मानित, प्रतिष्ठित या बहुमूल्य होने का भाव है; ‘आदरणीय’ नाम के प्रति श्रद्धा और प्रतिष्ठा को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: बहुवचन αἰῶνας की स्तुतिपरक और काल-विस्तार वाली अभिव्यक्ति को ‘युगानुयुग’ स्वाभाविक बाइबिलीय हिन्दी में सुरक्षित रखता है।
- source_word: εὐλογησάτωσάν σε
  choice: आपको धन्य कहें
  rationale: तीसरे पुरुष की आज्ञार्थक/कामनार्थक क्रिया को ‘कहें’ से स्वाभाविक बनाया गया है, जबकि εὐλογ- शब्द-समूह की पुनरावृत्ति ‘धन्य’ द्वारा बनी रहती है।
- source_word: πάντα τὰ ἔργα σου
  choice: आपके सभी कार्य
  rationale: ἔργα का अर्थ कर्म, कार्य या सृष्ट कृतियाँ हो सकता है। ‘कार्य’ इस व्यापकता को सुरक्षित रखता है और केवल प्राणियों या सृष्टि तक अर्थ सीमित नहीं करता।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा तक
  rationale: यह अभिव्यक्ति निरंतर काल को दर्शाती है; ‘सदा तक’ स्पष्ट और स्तुतिपरक शैली के अनुकूल है।
theological_decisions:
- issue: परमेश्वर के सीधे संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यह परमेश्वर से की गई प्रार्थना है। ‘प्रभु’ आधुनिक हिन्दी के धार्मिक प्रयोग में स्वाभाविक है और κύριος के ईश्वरीय संबोधन को ठीक प्रकार व्यक्त करता है।
- issue: परमेश्वर की ओर निर्देशित εὐλογέω का अर्थ
  choice: आपको धन्य कहें
  alternative: आपकी स्तुति करें
  rationale: यूनानी पाठ पहले आए ‘धन्य’ के समान εὐλογ- शब्द-समूह को दोहराता है। ‘धन्य कहें’ उस शाब्दिक संबंध को बनाए रखता है; ‘स्तुति करें’ अर्थ की स्वाभाविक व्याख्या है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त हुआ है। ‘युगानुयुग’ और ‘सदा तक’ मूल की समानार्थी किंतु अलग वचन वाली काल-अभिव्यक्तियों को सहज हिन्दी में प्रस्तुत करते हैं।
