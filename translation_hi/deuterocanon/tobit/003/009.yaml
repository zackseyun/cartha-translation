base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/009.yaml
  text: Why do you flog us? If they have died[a], go with them! May we never see a son or daughter from you forever.
translation:
  language: hi
  text: “तू हमें क्यों कोड़े मारती है? अगर वे मर गए हैं[a], तो उनके साथ चली जा! हम तेरा कोई बेटा या बेटी कभी न देखें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् संकेत रूप में, “जा, उनके साथ मर जा।” यूनानी में केवल “उनके साथ चली जा” है, पर यहाँ उसके मृत पतियों की बात हो रही है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖς
  choice: कोड़े मारती है
  rationale: यह क्रिया कोड़े लगाने या बेंत से मारने का कठोर अर्थ रखती है। हिंदी में यह मूल अपमान की तीव्रता और संबोधित स्त्री के लिए एकवचन रूप दोनों बनाए रखती है।
- source_word: βάδιζε μετʼ αὐτῶν
  choice: उनके साथ चली जा
  rationale: βάδιζε जाने या चलने की आज्ञा है। प्रसंग में मृत पतियों के साथ मृत्यु में जाने का संकेत है, पर मूल यूनानी में ‘मर जा’ स्पष्ट रूप से नहीं कहा गया; इसलिए संकेत को मुख्य पाठ में खुला रखा गया है।
- source_word: μὴ ἴδωμέν
  choice: हम ... कभी न देखें
  rationale: μή के साथ यह संभावनार्थक रूप प्रबल अभिशाप या कटु कामना व्यक्त करता है। ‘कभी न देखें’ εἰς τὸν αἰῶνα के साथ मिलकर उस बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: σου υἱὸν ἢ θυγατέρα
  choice: तेरा कोई बेटा या बेटी
  rationale: σου संबंध या स्वामित्व बताता है और प्रसंग में सारा की भावी संतान की ओर संकेत करता है। यह हिंदी अभिव्यक्ति अनावश्यक व्याख्यात्मक विस्तार किए बिना उसी आशय को रखती है।
- source_word: εἰς τὸν αἰῶνα
  choice: कभी न
  rationale: इस नकारात्मक अभिशाप में ‘कभी न’ आधुनिक हिंदी का स्वाभाविक समतुल्य है और स्थायी निषेध का भाव देता है।
theological_decisions:
- issue: ‘उनके साथ चली जा’ में निहित मृत्यु-संदर्भ
  choice: मुख्य पाठ में केवल ‘उनके साथ चली जा’ रखा गया है; मृत्यु में सम्मिलित होने का संकेत स्पष्ट नहीं जोड़ा गया।
  alternative: ‘जा, उनके साथ मर जा’
  rationale: यूनानी केवल ‘उनके साथ चली जा’ कहता है। मृत पतियों का संदर्भ अर्थ को स्पष्ट करता है, पर ‘मर जा’ मुख्य पाठ में जोड़ना स्रोत से अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी रखी गई है, जबकि दासी के कटु और अपमानजनक स्वर को नरम नहीं किया गया। ‘तू’ और स्त्रीलिंग क्रियाएँ मूल संबोधन के सामाजिक और भावात्मक तीखेपन को व्यक्त करती हैं।
