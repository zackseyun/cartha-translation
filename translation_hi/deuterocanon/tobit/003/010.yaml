  text: When she heard these things[a], she was deeply grieved, so that she wanted to hang herself. But she said, “I am my father’s only child. If I do this, it will be a disgrace to him, and I will bring his old age down with sorrow to Hades.”
translation:
  language: hi
  text: ये बातें सुनकर वह बहुत दुःखी हुई, यहाँ तक कि उसने फाँसी लगाकर जान देने की सोची। पर उसने कहा, “मैं अपने पिता की इकलौती संतान हूँ। यदि मैं ऐसा करूँगी, तो इससे उनका अपमान होगा, और मैं उनके बुढ़ापे को दुःख के साथ अधोलोक[a] में उतार दूँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मृतकों के लोक में” अथवा “कब्र में।” यूनानी पाठ में “हेडीस” है।
    reason: ᾅδης के मूल रूप और उसके सम्भव अर्थों को सुरक्षित रखना, बिना उसे ‘नरक’ के रूप में निश्चित किए।
lexical_decisions:
- source_word: ταῦτα ἀκούσασα
  choice: ये बातें सुनकर
  rationale: कालवाचक कृदन्त और संकेतवाचक ‘ये बातें’ दोनों को स्वाभाविक हिन्दी में बनाए रखता है, बिना संदर्भ को अनावश्यक रूप से स्पष्ट किए।
- source_word: ἐλυπήθη σφόδρα
  choice: वह बहुत दुःखी हुई
  rationale: यह भावनात्मक पीड़ा को सरल, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘बहुत’ σφόδρα के बल को बनाए रखता है।
- source_word: ὥστε ἀπάγξασθαι
  choice: यहाँ तक कि उसने फाँसी लगाकर जान देने की सोची
  rationale: ὥστε के परिणामसूचक बल तथा अगले वाक्य से प्रकट अधूरी, विचाराधीन क्रिया—दोनों को व्यक्त करता है; इसे न तो संपन्न कार्य और न ही अटल निश्चय बनाता है।
- source_word: Μία μέν εἰμι τῷ πατρί μου
  choice: मैं अपने पिता की इकलौती संतान हूँ
  rationale: ग्रीक में ‘एक/इकलौती’ का पारिवारिक आशय है; ‘संतान’ लिंग को अनावश्यक रूप से दोहराए बिना यह भी स्पष्ट करता है कि वह पिता की अकेली संतान है।
- source_word: ὄνειδος αὐτῷ ἔσται
  choice: इससे उनका अपमान होगा
  rationale: ὄνειδος के सामाजिक लज्जा, निन्दा और अपमान के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ γῆρας αὐτοῦ κατάξω
  choice: मैं उनके बुढ़ापे को … पहुँचा दूँगी
  rationale: मूल के ‘उनके बुढ़ापे को नीचे ले जाऊँगी’ मुहावरे की दिशा और कारणात्मकता को गन्तव्य ‘अधोलोक’ के साथ हिन्दी में बोधगम्य रखता है।
- source_word: μετʼ ὀδύνης
  choice: दुःख के साथ
  rationale: पिता के शोक और मानसिक वेदना को दर्शाता है और ὀδύνη की भावात्मक तीव्रता को बनाए रखता है।
- source_word: εἰς ᾅδου
  choice: अधोलोक में
  rationale: ᾅδης को ‘नरक’ बनाकर अधिक विशिष्ट धर्मवैज्ञानिक अर्थ आरोपित नहीं करता; ‘अधोलोक’ मृतकों के लोक का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: द्वितीयकानूनी यूनानी संदर्भ में ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: मृतकों का लोक; कब्र; हेडीस
  rationale: मूल पाठ ᾅδης कहता है। ‘अधोलोक’ मृत्यु के लोक की धारणा को बनाए रखता है, पर उसे दण्ड के स्थान ‘नरक’ के समान नहीं ठहराता। पादटिप्पणी मूल यूनानी संज्ञा और अर्थ-विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। पिता के लिए आदरसूचक बहुवचन रखा गया है। आत्महत्या के विचार को स्पष्ट रूप से, पर अनावश्यक विस्तार के बिना व्यक्त किया गया है।
