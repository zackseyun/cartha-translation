base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/006.yaml
  text: And now deal with me according to what is pleasing to you[a]. Command that my spirit be taken up, so that I may be released and become dust. For it is better for me to die than to live, because I have heard false reproaches, and there is great grief within me. Command that I be released now from this distress into the everlasting place[b], and do not turn your face away from me.
translation:
  language: hi
  text: और अब मेरे साथ वही कर जो तुझे भाए। आज्ञा दे कि मेरी आत्मा उठा ली जाए, ताकि मैं मुक्त हो जाऊँ और मिट्टी बन जाऊँ[a]। क्योंकि मेरे लिए जीने से मरना अच्छा है; मैंने झूठे ताने सुने हैं और मेरे भीतर बहुत दुःख है। आज्ञा दे कि मैं अब इस विपत्ति से मुक्त हो जाऊँ और उस अनन्त स्थान में पहुँचूँ[b]; अपना मुख मुझसे न फेर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘धरती बन जाऊँ’ है; मृत्यु के प्रसंग में यह मिट्टी में मिल जाने का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: ‘अनन्त स्थान’ मृतकों के स्थान के लिए एक सामान्य अभिव्यक्ति है; यूनानी पाठ यहाँ किसी अधिक विकसित पारिभाषिक या सिद्धान्तगत नाम का प्रयोग नहीं करता।
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸ ἀρεστόν σου
  choice: वही ... जो तुझे अच्छा लगे
  rationale: यह स्वाभाविक आधुनिक हिन्दी में परमेश्वर की इच्छा और उसे भाने वाली बात के अनुसार किए जाने का भाव बनाए रखता है।
- source_word: ἐπίταξον
  choice: आज्ञा दे
  rationale: क्रिया परमेश्वर से अधिकारपूर्वक आदेश देने की सीधी और गंभीर विनती व्यक्त करती है।
- source_word: ἀναλαβεῖν τὸ πνεῦμά μου
  choice: मेरी आत्मा उठा ली जाए
  rationale: ‘आत्मा’ πνεῦμα को स्पष्ट रूप से सुरक्षित रखता है और कर्मवाच्य ‘उठा ली जाए’ ἀναλαβεῖν के ऊपर उठाए जाने के भाव को बिना अतिरिक्त परलोक-सिद्धान्त जोड़े व्यक्त करता है।
- source_word: ἀπολυθῶ
  choice: मैं मुक्त हो जाऊँ
  rationale: यह मृत्यु के लिए प्रयुक्त ‘छोड़े जाने/मुक्त किए जाने’ के विनम्र रूपक को बनाए रखता है।
- source_word: γένωμαι γῆ
  choice: मिट्टी बन जाऊँ
  rationale: γῆ का मूल अर्थ धरती या मिट्टी है; मृत्यु के प्रसंग में ‘मिट्टी बन जाऊँ’ हिन्दी में स्वाभाविक है और मूल बिंब को भी सुरक्षित रखता है।
- source_word: λυσιτελεῖ μοι
  choice: मेरे लिए ... अच्छा है
  rationale: लाभकर या श्रेयस्कर होने की तुलना को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὀνειδισμοὺς ψευδεῖς
  choice: झूठे ताने
  rationale: ὀνειδισμός की अपमानजनक निन्दा और ψευδεῖς की असत्यता, दोनों को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λύπη ἐστὶν πολλὴ ἐν ἐμοί
  choice: मेरे भीतर बहुत गहरा दुःख है
  rationale: मूल के आन्तरिक दुःख और उसकी तीव्रता को स्पष्ट रखते हुए हिन्दी में सहज अभिव्यक्ति देता है।
- source_word: τῆς ἀνάγκης
  choice: इस विपत्ति से
  rationale: यहाँ ἀνάγκη बाध्यकारी संकट या कष्ट को सूचित करता है; प्रार्थना के प्रसंग में ‘विपत्ति’ उपयुक्त है।
- source_word: εἰς τὸν αἰώνιον τόπον
  choice: उस अनन्त स्थान में
  rationale: यह यूनानी की व्यापक अभिव्यक्ति को सीधे रखता है और उसे कब्र, अधोलोक या स्वर्ग जैसे अधिक विशिष्ट पारिभाषिक स्थान में नहीं बदलता।
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπʼ ἐμοῦ
  choice: अपना मुख मुझसे न फेर
  rationale: परमेश्वर के ध्यान या अनुग्रह के हटने का मूल बाइबलीय बिंब संक्षिप्त और प्रतिष्ठित हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: मृत्यु की प्रार्थना में मनुष्य-संबंधी शब्दावली
  choice: मेरी आत्मा उठा ली जाए
  alternative: मेरा जीवन ले लिया जाए
  rationale: मूल में πνεῦμα स्पष्ट रूप से है। इसलिए ‘आत्मा’ रखा गया है, पर वाक्य से मध्यवर्ती अवस्था के बारे में कोई विकसित सिद्धान्त नहीं निकाला गया।
- issue: मृत्यु के बाद के गन्तव्य का अर्थ
  choice: उस अनन्त स्थान में
  alternative: अनन्त घर में / कब्र में / सदा के लिए ठहराए गए स्थान में
  rationale: यूनानी पाठ केवल ‘अनन्त स्थान’ कहता है और अधोलोक, कब्र या स्वर्ग का नाम नहीं लेता; व्यापक और कुछ हद तक अस्पष्ट अभिव्यक्ति को यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक और सामान्य पाठक के लिए सुबोध शैली रखी गई है। परमेश्वर को संबोधन में एकवचन ‘तू’ के आदरपूर्ण बाइबलीय रूप (‘तुझे’, ‘कर’, ‘दे’) का प्रयोग हुआ है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान असंगत था; उसका विषय γένωμαι γῆ है, इसलिए हिन्दी मुख्य पाठ में चिह्न ‘मिट्टी बन जाऊँ’ के बाद रखा गया है।
