  yaml_path: translation/deuterocanon/tobit/003/017.yaml
  text: 'of the great Raphael. And he was sent to heal the two: to remove the white films from Tobit''s eyes[a], and to give Sarah daughter of Raguel to Tobiah son of Tobit as a wife, and to bind Asmodeus, the evil demon, because Tobiah was entitled to inherit her. At that same time Tobit returned and entered into his house, and Sarah daughter of Raguel came down from her upper room.'
translation:
  language: hi
  text: महान रफाएल की। और उसे उन दोनों को चंगा करने के लिए भेजा गया था—तोबीत की आँखों पर छाई सफेद झिल्लियाँ उतारने, रगूएल की बेटी सारा को तोबीत के बेटे तोबियाह को पत्नी के रूप में देने, और दुष्ट दानव असमोदियस को बाँधने के लिए; क्योंकि सारा को उत्तराधिकार में पाने का अधिकार तोबियाह का था।[a] उसी समय तोबीत लौटकर अपने घर में आया, और रगूएल की बेटी सारा अपनी ऊपरी कोठरी से नीचे उतरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्वाभाविक रूप में: “क्योंकि सारा से विवाह करने का अधिकार तोबियाह का था।” यूनानी पाठ में “उसे उत्तराधिकार में पाना” कहा गया है, जो इस कथा की वैधानिक और पारिवारिक व्यवस्था को दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ μεγάλου Ῥαφαήλ
  choice: महान रफाएल की
  rationale: यूनानी पाठ पद के आरम्भ में संबंधकारक खंड के रूप में पिछले संदर्भ से जुड़ा हुआ है। हिन्दी में भी इस अपूर्ण वाक्यांश को पूरा किए बिना रखा गया है, ताकि स्रोत की संरचना और पूर्ववर्ती पद से उसका संबंध बना रहे।
- source_word: ἀπεστάλη
  choice: उसे ... भेजा गया था
  rationale: कर्मवाच्य को बनाए रखा गया है और भेजने वाले को स्पष्ट नहीं किया गया, क्योंकि यूनानी पाठ भी उसे निहित ही छोड़ता है।
- source_word: ἰάσασθαι τοὺς δύο
  choice: उन दोनों को चंगा करने के लिए
  rationale: ἰάσασθαι आगे आने वाले पूरे कार्य-क्रम को नियंत्रित करता है; इसलिए चंगाई में तोबीत की शारीरिक दृष्टि-बहाली और सारा की दानवी बाधा से मुक्ति दोनों सम्मिलित हैं।
- source_word: λεπίσαι τὰ λευκώματα
  choice: आँखों पर छाई सफेद झिल्लियाँ उतारने
  rationale: λεπίσαι में परत या पपड़ी उतारने का भाव है और λευκώματα सफेद अपारदर्शी परतों को सूचित करता है। ‘मोतियाबिंद’ किसी आधुनिक चिकित्सकीय निदान को निश्चित कर देता, इसलिए उससे बचा गया है।
- source_word: δοῦναι ... γυναῖκα
  choice: सारा को ... तोबियाह की पत्नी बनाने
  rationale: यह विवाह-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, जबकि ‘देने’ की अत्यधिक कठोर शब्दशः अभिव्यक्ति से बचता है।
- source_word: δῆσαι Ἀσμοδαῖον τὸ πονηρὸν δαιμόνιον
  choice: दुष्ट दानव असमोदियस को बाँधने
  rationale: δῆσαι का सीधा अर्थ ‘बाँधना’ रखा गया है; πονηρόν को ‘दुष्ट’ और δαιμόνιον को साधारण पाठक के लिए स्पष्ट ‘दानव’ से व्यक्त किया गया है।
- source_word: ἐπιβάλλει κληρονομῆσαι αὐτήν
  choice: सारा को उत्तराधिकार में पाने का अधिकार तोबियाह का था
  rationale: विवाह के प्रसंग में असामान्य होने पर भी κληρονομῆσαι की उत्तराधिकार-संबंधी भाषा को मुख्य पाठ में सुरक्षित रखा गया है। ἐπιβάλλει के वैधानिक दावे को ‘अधिकार ... था’ व्यक्त करता है।
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: उसी समय
  rationale: यह यूनानी के कथात्मक समकालिकता पर दिए गए बल को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκ τοῦ ὑπερῴου αὐτῆς
  choice: अपनी ऊपरी कोठरी से नीचे उतरी
  rationale: ὑπερῷον घर की ऊपरी मंजिल का कमरा है; ‘ऊपरी कोठरी’ स्थान और प्राचीन घरेलू परिवेश दोनों को स्पष्ट करती है।
theological_decisions:
- issue: रफाएल के कार्य में ‘चंगा करने’ का विस्तार
  choice: ‘उन दोनों को चंगा करने’ को आगे बताए गए सभी कार्यों—तोबीत की आँखों की चंगाई और सारा की मुक्ति तथा विवाह—से जोड़ा गया है।
  alternative: ‘चंगा करना’ केवल तोबीत की शारीरिक चिकित्सा तक सीमित किया जा सकता था और सारा से संबंधित कार्यों को अलग माना जा सकता था।
  rationale: यूनानी वाक्य-विन्यास में ἰάσασθαι τοὺς δύο के बाद दोनों व्यक्तियों से संबंधित समानांतर अनंत क्रियाएँ आती हैं; व्यापक अर्थ को बनाए रखना पाठ की अपनी धर्मवैचारिक प्रस्तुति को सुरक्षित रखता है।
- issue: सारा के विषय में κληρονομῆσαι की वैधानिक-विवाहगत भाषा
  choice: मुख्य पाठ में ‘उत्तराधिकार में पाने का अधिकार’ रखा गया है।
  alternative: ‘उससे विवाह करने का अधिकार’ या ‘उससे विवाह करने की बारी उसी की थी।’
  rationale: स्रोत विवाह के प्रसंग में जानबूझकर उत्तराधिकार की भाषा का प्रयोग करता है। मुख्य पाठ उस तनाव को मिटाता नहीं; पादटिप्पणी स्वाभाविक अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरम्भ का संबंधकारक वाक्यांश जानबूझकर खंडित रखा गया है, क्योंकि यूनानी पद पिछले वाक्य से जुड़कर शुरू होता है। नामों का देवनागरी लिप्यंतरण किया गया है। असामान्य उत्तराधिकार-विवाह भाषा को सरल बनाकर मिटाने के बजाय पादटिप्पणी सहित सुरक्षित रखा गया है।
