  terminology: “धरती से मुक्त” appropriately retains the source’s indirect expression, without making the main text state death explicitly. “अपमान” is viable for ὀνειδισμός, though “तिरस्कार” better retains the sense of reproach/scorn rather than only the experience of being humiliated.
