    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπὸν
  choice: कह दे
  rationale: यह λέγω का आदेशवाचक रूप है और परमेश्वर से की गई सीधी विनती को व्यक्त करता है। ‘आज्ञा दे’ सम्भव है, पर वह यूनानी शब्द में निहित भाव को आवश्यकता से अधिक स्पष्ट कर देता; ‘कह दे’ मूल की वाणी-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: ἀπολῦσαί με
  choice: मुझे मुक्त कर दिया जाए
  rationale: ἀπολύω का अर्थ छोड़ना, मुक्त करना या विदा करना हो सकता है। यहाँ मृत्यु की अप्रत्यक्ष प्रार्थना के संदर्भ में ‘मुक्त’ मूल रूपक को बनाए रखता है। हिन्दी में ‘कर दिया जाए’ यूनानी infinitive रचना का स्वाभाविक रूपांतरण है और कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀπὸ τῆς γῆς
  choice: धरती से
  rationale: γῆ का अर्थ धरती, भूमि या जमीन हो सकता है। यहाँ स्थानीय भूमि नहीं, बल्कि धरती के जीवन से विदा होने का संकेत है; ‘धरती से’ मूल रूपक और उसकी गंभीरता दोनों को सुरक्षित रखता है।
- source_word: καὶ μὴ ἀκοῦσαί με μηκέτι
  choice: ताकि मैं फिर कभी … न सुनूँ
  rationale: दूसरा infinitive पहले अनुरोध के वांछित परिणाम को व्यक्त करता है। ‘फिर कभी … न’ μηκέτι के आगे से समाप्त हो जाने वाले भाव को सहज हिन्दी में प्रकट करता है।
- source_word: ὀνειδισμόν
  choice: अपमान
  rationale: यह शब्द तिरस्कार, लांछन या अपमानजनक उलाहने को दर्शा सकता है। ‘अपमान’ सार्वजनिक लज्जा और कटु वचनों के व्यापक भाव को रखता है, जबकि ‘ताना’ अर्थ को अधिक संकीर्ण कर देता।
theological_decisions:
- issue: परमेश्वर से प्रार्थना में मृत्यु के लिए अप्रत्यक्ष अभिव्यक्ति
  choice: मुझे धरती से मुक्त कर दिया जाए
  alternative: मुझे धरती से उठा ले
  rationale: यूनानी पाठ मृत्यु को सीधे नाम नहीं देता, बल्कि धरती से मुक्त किए जाने की विनती करता है। मुख्य पाठ उसी रूपक और उसके धर्मवैचारिक तनाव को बनाए रखता है; विकल्प अर्थ को अधिक स्पष्ट, पर अधिक व्याख्यात्मक बना देता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और प्रार्थनापूर्ण रखी गई है। ‘कह दे’ मूल आदेशवाचक क्रिया के निकट है, जबकि निष्क्रिय रचना हिन्दी में अगले infinitive को स्वाभाविक बनाती और अनकहे कर्ता को अनावश्यक रूप से निर्धारित करने से बचाती है।
