base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/015.yaml
  text: And I have not defiled my name[a], nor the name of my father, in the land of my captivity. I am my father’s only child, and he has no child who will inherit him, nor a near brother, nor does he have a son so that I might keep myself for him as a wife. Already seven have perished from me; why should I live? But if it does not seem good to you to put me to death, command that you look upon me and have mercy on me[c][b], and that I no longer hear reproach.
translation:
  language: hi
  text: और मैंने अपने बंदीवास की भूमि में न तो अपने नाम को कलंकित किया, न अपने पिता के नाम को। मैं अपने पिता की इकलौती संतान हूँ, और उनकी कोई संतान नहीं जो उनका वारिस हो; न कोई निकट भाई[a] है, और न उनका कोई पुत्र है, जिसके लिए मैं अपने आपको पत्नी के रूप में बचाए रखूँ। मैं पहले ही सात को खो चुकी हूँ[b]; फिर मैं क्यों जीवित रहूँ? पर यदि मुझे मार डालना तुझे उचित नहीं लगता, तो मेरी ओर दृष्टि करने और मुझ पर दया करने की आज्ञा दे[c], ताकि मुझे फिर कभी निंदा न सुननी पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोई निकट पुरुष-संबंधी’। यूनानी में शाब्दिक रूप से ‘निकट भाई’ है, पर संभव है कि आशय कुल के किसी निकट पुरुष-संबंधी से हो।
    reason: lexical_alternative
  - marker: b
    text: अर्थात्, कथानक के संदर्भ में सात पति; यहाँ यूनानी पाठ केवल ‘सात’ कहता है।
    reason: contextual_clarification
  - marker: c
    text: ‘निकट भाई’, ‘पुत्र’ और अपने आपको उसके लिए पत्नी के रूप में बचाए रखने वाला पूरा कथन यूनानी में वाक्य-विन्यास की दृष्टि से कठिन है; ‘दृष्टि करने और दया करने की आज्ञा दे’ भी यूनानी की असामान्य प्रार्थना-रचना को निकटता से दर्शाता है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ἐμόλυνα
  choice: कलंकित किया
  rationale: यह नैतिक अपवित्रता और प्रतिष्ठा पर लगे दाग—दोनों अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अपवित्र’ यहाँ अनावश्यक रूप से केवल अनुष्ठानिक अर्थ दे सकता था।
- source_word: ὄνομα
  choice: नाम
  rationale: यूनानी में दोनों बार शाब्दिक रूप से ‘नाम’ है; हिन्दी में भी यह पारिवारिक मान-सम्मान का भाव वहन कर सकता है।
- source_word: γῇ τῆς αἰχμαλωσίας μου
  choice: अपनी बंधुआई के देश में
  rationale: ‘बंधुआई’ αἰχμαλωσία के बंदी-दशा और परदेश-वास के करुण भाव को बनाए रखती है।
- source_word: μονογενής
  choice: इकलौती संतान
  rationale: वक्ता स्त्री है और आशय पिता की एकमात्र संतान होने से है; यह ‘एकलौती बेटी’ की अपेक्षा यूनानी की सामान्य संतान-संज्ञा के अधिक निकट है।
- source_word: κληρονομήσει αὐτόν
  choice: उनकी उत्तराधिकारी हो
  rationale: शाब्दिक ‘उन्हें विरासत में पाए’ हिन्दी में अस्पष्ट होगा; ‘उत्तराधिकारी’ पारिवारिक वारिस होने का स्वाभाविक अर्थ देता है।
- source_word: ἀδελφὸς ἐγγύς
  choice: निकट भाई
  rationale: वाक्यांश की कठिन और संभावित व्यापक कुल-संबंधी धारणा को मुख्य पाठ में शाब्दिक रूप से सुरक्षित रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
- source_word: συντηρήσω ἐμαυτὴν αὐτῷ γυναῖκα
  choice: जिसके लिए मैं अपने आपको पत्नी के रूप में बचाए रखूँ
  rationale: कठिन यूनानी संरचना को सुलझाए बिना स्वयं को किसी पुरुष के लिए भावी पत्नी के रूप में सुरक्षित रखने का आशय व्यक्त करता है।
- source_word: ἀπώλοντό μοι ἑπτά
  choice: मेरे सात पहले ही नष्ट हो चुके हैं
  rationale: मूल पाठ केवल ‘सात’ कहता है और व्यक्तिगत क्षति दर्शाता है; ‘पति’ को मुख्य पाठ में जोड़े बिना संदर्भ पादटिप्पणी में दिया गया है।
- source_word: δοκεῖ σοι
  choice: तुझे उचित नहीं लगता
  rationale: यह परमेश्वर को संबोधित प्रार्थना में ‘जो तुझे ठीक/उचित जान पड़े’ का भाव स्वाभाविक हिन्दी में देता है।
- source_word: ἐπίταξον ἐπιβλέψαι ἐπʼ ἐμέ
  choice: आज्ञा दे कि तू मेरी ओर दृष्टि करे
  rationale: यूनानी की असामान्य, गरिमापूर्ण प्रार्थना-शैली और ईश्वरीय अनुग्रहपूर्ण दृष्टि का मुहावरा सुरक्षित है।
- source_word: ὀνειδισμόν
  choice: निंदा
  rationale: यह अपमानजनक ताने और सामाजिक धिक्कार दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ‘सात’ की पहचान
  choice: मुख्य पाठ में केवल ‘मेरे सात’ रखा गया है।
  alternative: ‘मेरे सात पति’ या ‘मैं सात पतियों को खो चुकी हूँ।’
  rationale: कथानक से सात पतियों का संकेत स्पष्ट है, पर इस पद के यूनानी पाठ में ‘पति’ शब्द नहीं है; इसलिए मूल की संक्षिप्तता बनाए रखी गई है।
- issue: कठिन निकट-संबंधी और विवाह संबंधी उपवाक्य
  choice: ‘निकट भाई’ और ‘जिसके लिए मैं अपने आपको पत्नी के रूप में बचाए रखूँ’ के रूप में निकट अनुवाद।
  alternative: ‘निकट कुल-संबंधी ... जिससे मेरा विवाह हो सके।’
  rationale: यूनानी पाठ वाक्य-विन्यास और पारिवारिक संबंध की दृष्टि से कठिन है। अधिक स्पष्ट कानूनी या वैवाहिक व्याख्या थोपने के बजाय वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: परमेश्वर से मृत्यु की विनती
  choice: ‘यदि मुझे मार डालना तुझे उचित नहीं लगता’
  alternative: ‘यदि मुझे मृत्यु देना तेरी इच्छा नहीं है।’
  rationale: मूल में प्रत्यक्ष ‘मार डालना’ है; इसे केवल अमूर्त ‘मृत्यु देना’ या ‘इच्छा’ में बदलने से प्रार्थना का तनाव कम हो जाता।
