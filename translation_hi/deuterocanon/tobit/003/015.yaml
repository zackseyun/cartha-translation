  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तू’ प्रयुक्त है, जो बाइबलीय हिन्दी में प्रचलित है। ‘कलंकित’, ‘बंधुआई’, ‘दृष्टि’ और ‘निंदा’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए प्रसंग की गंभीरता बनाए रखते हैं।
