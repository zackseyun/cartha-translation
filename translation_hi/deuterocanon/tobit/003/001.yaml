translation:
  language: hi
  text: और दुखी होकर[a] मैं रोया, और पीड़ा में मैंने प्रार्थना की और कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी पाठ संक्षिप्त है: “और दुखी होकर मैं रोया, और पीड़ा में मैंने प्रार्थना की और कहा।” सामी रूप वाली एक पाठ-परंपरा आगे के विलाप को बहुत विस्तार देती है; फिर भी यह आरंभिक कथन यूनानी पाठ में स्पष्ट रूप से सुरक्षित है।'
    reason: textual_variant
lexical_decisions:
- source_word: λυπηθεὶς
  choice: दुखी होकर
  rationale: यह यूनानी अओरिस्ट कर्मवाच्य कृदंत व्यक्ति के दुख से प्रभावित होने की अवस्था बताता है; ‘दुखी होकर’ हिंदी में स्वाभाविक रहते हुए कृदंत का रूप और आगे के कार्यों की भावनात्मक पृष्ठभूमि बनाए रखता है।
- source_word: ἔκλαυσα
  choice: मैं रोया
  rationale: κλαίω का सीधा और सहज हिंदी रूप; इसमें मूल पाठ से अधिक तीव्रता नहीं जोड़ी गई है।
- source_word: προσηυξάμην
  choice: मैंने प्रार्थना की
  rationale: προσεύχομαι के इस रूप का स्वाभाविक हिंदी अनुवाद; इसकी तीव्रता साथ आए μετʼ ὀδύνης से व्यक्त होती है।
- source_word: μετʼ ὀδύνης
  choice: पीड़ा में
  rationale: ὀδύνη गहरी मानसिक या भावनात्मक वेदना दर्शाता है; ‘पीड़ा में’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: λέγων
  choice: और कहा
  rationale: यह कृदंत प्रार्थना की विषयवस्तु आरंभ करता है। हिंदी में ‘और कहा’ अधिक सहज कथात्मक संक्रमण है और आशय सुरक्षित रखता है।
