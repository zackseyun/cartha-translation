base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/007.yaml
  text: From what you have[a], give alms, and do not let your eye be grudging when you give alms. Do not turn your face away from any poor person[c][b], and the face of God will not be turned away from you.
translation:
  language: hi
  text: जो कुछ तुम्हारे पास है, उसमें से दान दो; और दान देते समय तुम्हारी आँख में कंजूसी न हो।[a] किसी भी गरीब से अपना मुँह न मोड़ो, और परमेश्वर भी तुमसे अपना मुख कभी नहीं मोड़ेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारी आँख ईर्ष्या न करे।” यह यूनानी मुहावरा दान देते समय मन में अनिच्छा, कुढ़न या कंजूसी होने की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “परमेश्वर का मुख” का अर्थ “परमेश्वर की उपस्थिति” भी समझा जा सकता है; पर यूनानी में शाब्दिक रूप से “मुख” है, जो पिछले वाक्यांश के “अपना मुँह” को प्रतिध्वनित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν ὑπαρχόντων σοι
  choice: जो कुछ तुम्हारे पास है, उसमें से
  rationale: यह उपलब्ध संपत्ति या साधनों में से देने का भाव व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ποίει ἐλεημοσύνην
  choice: दान दो
  rationale: यहाँ ἐλεημοσύνη जरूरतमंदों को दी जाने वाली ठोस सहायता या भिक्षादान है; सामान्य पाठक के लिए ‘दान दो’ स्पष्ट और सहज है।
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: तुम्हारी आँख कंजूसी न करे
  rationale: यह अनिच्छा या कुढ़ते हुए देने का यूनानी मुहावरा है। ‘आँख’ बनाए रखने से मूल बिंब बचता है, जबकि ‘कंजूसी न करे’ उसका आशय स्पष्ट करता है।
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: दान देते समय
  rationale: यहाँ infinitival construction समयसूचक है; यह हिन्दी रूप संक्षिप्त और स्वाभाविक है।
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου
  choice: अपना मुँह न मोड़ो
  rationale: ‘मुँह मोड़ना’ हिन्दी का स्वाभाविक मुहावरा है और अगले वाक्यांश में परमेश्वर के ‘मुख’ के साथ मूल की समानांतरता भी बनाए रखता है।
- source_word: ἀπὸ παντὸς πτωχοῦ
  choice: किसी भी गरीब से
  rationale: पुल्लिंग एकवचन रूप यहाँ वितरणात्मक और सामान्य अर्थ रखता है। हिन्दी ‘गरीब’ इस सामान्य अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: οὐ μὴ ἀποστραφῇ
  choice: कभी नहीं मोड़ा जाएगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘कभी नहीं’ से व्यक्त किया गया है और यूनानी के कर्मवाच्य रूप को भी सुरक्षित रखा गया है।
- source_word: τὸ πρόσωπον τοῦ θεοῦ
  choice: परमेश्वर का मुख
  rationale: शाब्दिक देहात्मक भाषा और ‘अपना मुँह’ के साथ जानबूझकर रची गई समानांतरता को बनाए रखता है; इसे ‘उपस्थिति’ कहना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: परमेश्वर के लिए देहात्मक ‘मुख’ की भाषा
  choice: परमेश्वर का मुख
  alternative: परमेश्वर की उपस्थिति
  rationale: यूनानी में मनुष्य और परमेश्वर दोनों के लिए एक ही शब्द πρόσωπον आया है। ‘मुख’ रखने से पारस्परिक मुँह मोड़ने की साहित्यिक और धर्मवैचारिक तीव्रता बनी रहती है।
- issue: πτωχοῦ का पुल्लिंग एकवचन रूप
  choice: किसी भी गरीब से
  alternative: किसी भी गरीब पुरुष से
  rationale: व्याकरणिक रूप पुल्लिंग एकवचन है, पर παντός के साथ इसका बल सामान्य और वितरणात्मक है। हिन्दी में ‘गरीब’ उस स्रोत-रूप को स्वाभाविक रूप से व्यक्त करता है और अर्थ को केवल पुरुषों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक रूप अपनाया गया है। ‘दान दो’ सामान्य पाठक के लिए स्पष्ट है; ‘आँख कंजूसी न करे’ और ‘परमेश्वर का मुख’ मूल यूनानी के प्रमुख बिंबों और समानांतरता को सुरक्षित रखते हैं।
