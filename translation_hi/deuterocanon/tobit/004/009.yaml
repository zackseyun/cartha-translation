  text: For you are storing up a good treasure for yourself for a day of need[a].
translation:
  language: hi
  text: क्योंकि तुम अपने लिए आवश्यकता के दिन के वास्ते एक अच्छा खजाना संचित कर रहे हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संकट के दिन के लिए,” “कष्ट के समय के लिए,” अथवा “मुसीबत के दिन के लिए।” यूनानी पद व्यापक है और आवश्यकता या कठिनाई की घड़ी, दोनों का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θέμα
  choice: धन
  rationale: यह संज्ञा रखी या जमा की हुई वस्तु को दर्शाती है। θησαυρίζεις के साथ ‘धन संचित’ यूनानी शब्द-संबंध और रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: ἀγαθὸν
  choice: उत्तम
  rationale: यह संचित धन की भलाई और मूल्य को व्यक्त करता है, बिना अर्थ को केवल आर्थिक मूल्य तक सीमित किए।
- source_word: θησαυρίζεις
  choice: संचित कर रहे हो
  rationale: वर्तमान काल और धन जमा करने के सक्रिय रूपक, दोनों को स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: σεαυτῷ
  choice: अपने लिए
  rationale: आत्मवाचक हितसूचक चतुर्थी का सीधा और स्वाभाविक अनुवाद है।
- source_word: εἰς ἡμέραν ἀνάγκης
  choice: संकट के दिन के लिए
  rationale: ἀνάγκη आवश्यकता, विवशता या विपत्ति-संकट को सूचित कर सकता है। ‘संकट’ प्रसंग की कठिन घड़ी को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी व्यापकता सुरक्षित रखती है।
theological_decisions:
- issue: दान के द्वारा धन संचित करने के रूपक का आशय
  choice: धन संचित करने का रूपक बनाए रखा गया है, पर इसे स्पष्ट रूप से पुण्य कमाने या स्वर्गीय प्रतिफल के सिद्धांत में नहीं बदला गया।
  alternative: इसे स्वर्गीय प्रतिफल अर्जित करना अथवा भविष्य के संकट के लिए व्यावहारिक प्रबंध करना कहा जा सकता था।
  rationale: यूनानी पाठ केवल यह कहता है कि संकट या आवश्यकता के दिन के लिए उत्तम धन संचित किया जा रहा है; वह इसके धर्मवैज्ञानिक तंत्र को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज संबोधन अपनाया गया है। ‘धन संचित करना’ मूल रूपक और उसके शब्द-संबंध को बनाए रखता है; पादटिप्पणी ἀνάγκης की अर्थ-व्याप्ति बताती है।
