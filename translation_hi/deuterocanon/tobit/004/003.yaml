base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/003.yaml
  text: And calling him[a], he said, “Child, if I die, bury me, and do not neglect your mother; honor her all the days of your life,”
translation:
  language: hi
  text: और उसने उसे बुलाकर कहा, “बेटे, यदि मैं मर जाऊँ, तो मुझे दफ़नाना और अपनी माँ की उपेक्षा न करना[a]; अपने जीवन के सभी दिनों में उसका आदर करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी माँ को अनदेखा न करना” अथवा “अपनी माँ की अवहेलना न करना।” समानान्तर सामी परम्परा में अधिक प्रबल अर्थ, “उसे न छोड़ना,” मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: बुलाकर
  rationale: पूर्वकालिक कृदंत को स्वाभाविक हिन्दी में ‘बुलाकर’ कहना घटनाक्रम और मुख्य क्रिया से उसका संबंध स्पष्ट रखता है।
- source_word: Παιδίον
  choice: बेटे
  rationale: सम्बोधन स्नेहपूर्ण और पारिवारिक है। प्रसंग में सम्बोधित व्यक्ति पुत्र है; इसलिए आधुनिक हिन्दी में ‘बेटे’ अधिक स्वाभाविक है, यद्यपि यूनानी शब्द अपने-आप में ‘बालक/सन्तान’ जितना व्यापक हो सकता है।
- source_word: ἐὰν ἀποθάνω
  choice: यदि मैं मर जाऊँ
  rationale: ἐάν के साथ विधिलिंग की शर्तसूचकता को बनाए रखता है; इसे निश्चित अर्थ वाले ‘जब मैं मरूँ’ में नहीं बदलता।
- source_word: θάψον με
  choice: मुझे दफ़नाना
  rationale: आज्ञार्थक भाव का सीधा, साधारण और वर्तमान हिन्दी में स्वाभाविक अनुवाद।
- source_word: μὴ ὑπερίδῃς
  choice: अपनी माँ की उपेक्षा न करना
  rationale: क्रिया का अर्थ किसी को अनदेखा करना, उसकी परवाह न करना या उसकी उपेक्षा करना है। ‘उपेक्षा न करना’ यहाँ व्यावहारिक पारिवारिक दायित्व व्यक्त करता है, बिना यूनानी से अधिक प्रबल ‘त्याग न देना’ को मुख्य पाठ में लाए।
- source_word: τίμα
  choice: आदर करना
  rationale: माता-पिता के प्रति अपेक्षित सम्मान के लिए प्रतिष्ठित बाइबिलीय और सहज आधुनिक हिन्दी अभिव्यक्ति।
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: अपने जीवन के सभी दिनों में
  rationale: मूल की व्यापक और गंभीर अभिव्यक्ति को निकटता से सुरक्षित रखता है; अधिक मुहावरेदार विकल्प ‘जीवन भर’ है।
theological_decisions:
- issue: यूनानी पाठ से अधिक विस्तृत समानान्तर सामी परम्परा का उपयोग
  choice: मुख्य पाठ स्वेटे के यूनानी पाठ तक सीमित है; समानान्तर सामी परम्परा केवल ‘उपेक्षा न करना’ की नैतिक तीव्रता समझने में सहायक है।
  alternative: समानान्तर परम्परा के आधार पर ‘उसे कभी न छोड़ना’ कहना या वहाँ के अतिरिक्त निर्देश इस पद में जोड़ना।
  rationale: प्राथमिक आधार उद्धृत यूनानी पाठ है। उपलब्ध हिब्रू पाठ प्राचीन मूल-पाठ नहीं, बल्कि अरामी पाण्डुलिपि से किया गया बाद का प्रत्यनुवाद है; अतः उससे यूनानी में अनुपस्थित सामग्री मुख्य पाठ में नहीं जोड़ी गई।
- issue: Παιδίον के पारिवारिक सम्बोधन की सीमा
  choice: प्रसंगानुसार ‘बेटे’
  alternative: ‘बालक’ या ‘मेरे बच्चे’
  rationale: ‘बेटे’ हिन्दी में पिता द्वारा पुत्र को दिए गए स्नेहपूर्ण निर्देश के लिए स्वाभाविक है। इससे प्रसंगगत लिंग स्पष्ट होता है, पर ‘मेरे’ जैसा यूनानी में अनुपस्थित स्वामित्वसूचक शब्द नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पारिवारिक सम्बोधन के अनुरूप रखी गई है। ‘दफ़नाना’ सामान्य आधुनिक हिन्दी है; ‘आदर करना’ नैतिक निर्देश की बाइबिलीय गंभीरता बनाए रखता है।
