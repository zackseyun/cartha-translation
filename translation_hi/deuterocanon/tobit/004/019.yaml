base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, just as he pleases. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: hi
  text: और हर समय प्रभु परमेश्वर को धन्य कहते रहो, और उससे माँगो कि तुम्हारे मार्ग सीधे हों और तुम्हारे हर पथ और योजना में सफलता मिले[a]। क्योंकि किसी भी राष्ट्र के पास परामर्श नहीं है[b]; परन्तु प्रभु स्वयं सब अच्छी वस्तुएँ देता है और जिसे वह चाहे, उसे दीन करता है[c], जैसा वह चाहता है। और अब, हे बालक, मेरी आज्ञाओं को याद रखना और उन्हें अपने हृदय से मिटने न देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘योजनाओं’ के स्थान पर ‘परामर्श’ या ‘अभिप्राय’ भी सम्भव है। यूनानी βουλαί में इन अर्थों की गुंजाइश है।
    reason: lexical_alternative
  - marker: b
    text: ‘किसी भी राष्ट्र के पास परामर्श नहीं है’ यूनानी में अचानक आया हुआ और अर्थ की दृष्टि से कठोर कथन है। सम्भवतः आशय यह है कि कोई भी राष्ट्र अपने आप में अंतिम या निर्णायक परामर्श नहीं रखता; इसके विपरीत प्रभु ही अच्छी वस्तुएँ देता है और जिसे चाहता है उसे दीन करता है।
    reason: alternative_reading
  - marker: c
    text: यूनानी सम्बन्धवाचक रूप संदर्भ के बाहर अधिक खुला है; इसे ‘जो कुछ वह चाहे’ भी समझा जा सकता है। निकट संदर्भ के कारण यहाँ व्यक्तिवाचक अर्थ, ‘जिसे वह चाहे’, लिया गया है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: हर समय
  rationale: यह यूनानी पद के व्यापक कालगत अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὐλόγει
  choice: धन्य कहो
  rationale: यह ‘आशीष देना/धन्य कहना’ के मूल अर्थ और परमेश्वर के विषय में प्रयुक्त बाइबलीय मुहावरे को बनाए रखता है; केवल ‘स्तुति करो’ कहना अर्थ को कुछ सामान्य बना देता।
- source_word: Κύριον τὸν Θεόν
  choice: प्रभु परमेश्वर
  rationale: यूनानी पाठ में उपस्थित दोनों उपाधियों को बिना ‘अपने’ जोड़े सीधे व्यक्त करता है।
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: उससे माँगो
  rationale: यह निवेदन और उसके स्रोत, दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: तुम्हारे मार्ग सीधे हों
  rationale: मार्ग के रूपक को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: τρίβοι
  choice: पथ
  rationale: यह ὁδοί के समानांतर मार्ग-रूपक को बनाए रखता है, साथ ही शब्दगत भेद भी दिखाता है।
- source_word: βουλαὶ
  choice: योजनाएँ
  rationale: पहले प्रयोग में यह व्यावहारिक योजनाओं या अभिप्रायों को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है; ‘परामर्श’ भी सम्भव है।
- source_word: εὐοδωθῶσιν
  choice: सफल हों
  rationale: यह अनुकूल परिणाम और उन्नति के भाव को पथों तथा योजनाओं दोनों के साथ सहज रूप से व्यक्त करता है।
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: किसी भी जाति के पास परामर्श नहीं है
  rationale: यह यूनानी की आकस्मिक और कठोर अभिव्यक्ति को नरम किए बिना रखता है; ‘जाति’ ἔθνος और ‘परामर्श’ βουλή का निकट अनुवाद है।
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: सब अच्छी वस्तुएँ देता है
  rationale: यह कथन की व्यापकता और भलाई, दोनों को सीधे व्यक्त करता है।
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: जिसे वह चाहे, उसे दीन कर देता है
  rationale: सन्दर्भ में इसे व्यक्तिवाचक समझना सबसे सुसंगत है, यद्यपि यूनानी रूप शाब्दिक रूप से अधिक खुला है; इस अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: παιδίον
  choice: हे बालक
  rationale: यह स्नेहपूर्ण सम्बोधन को बनाए रखता है और पाठ में अनुपस्थित ‘मेरे’ या अधिक विशिष्ट ‘पुत्र’ को नहीं जोड़ता।
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: उन्हें अपने हृदय से मिटने न देना
  rationale: यह मिटा दिए जाने की सशक्त छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος परमेश्वर के लिए प्रयुक्त है; ‘प्रभु’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और मूल उपाधि को ठीक से व्यक्त करता है।
- issue: मानवीय परामर्श और परमेश्वर की प्रभुता के बीच विरोध
  choice: जातियों के परामर्श के अभाव तथा प्रभु के देने और दीन करने के प्रबल कथन को बनाए रखा गया है।
  alternative: इसे नरम करके ‘मनुष्य की बुद्धि सीमित है’ या ‘मानवीय परामर्श अविश्वसनीय है’ कहना।
  rationale: मूल यूनानी स्पष्ट व्याख्या दिए बिना एक कठोर विरोध प्रस्तुत करता है। अनुवाद उस धर्मवैचारिक तनाव को न तो कम करता है, न किसी पंथगत निष्कर्ष से समझाता है।
- issue: ὃ ἐὰν θέλῃ ταπεινοῖ का संकेत
  choice: 'व्यक्तिवाचक अर्थ: ‘जिसे वह चाहे, उसे दीन कर देता है’'
  alternative: 'नपुंसकलिंगी शाब्दिक अर्थ: ‘जो कुछ वह चाहे, उसे नीचा करता है’'
  rationale: क्रिया ‘दीन करना’ और जातियों का निकट सन्दर्भ व्यक्तिवाचक अर्थ का समर्थन करते हैं, पर यूनानी ὃ की रूपगत खुली सम्भावना पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध बाइबलीय गद्य। ‘धन्य कहो’, ‘पथ’, ‘दीन’ और ‘हृदय’ जैसे पद मूल की छवियों और धार्मिक स्वर को बनाए रखते हैं, जबकि वाक्य-विन्यास वर्तमान हिन्दी के अनुकूल रखा गया है।
