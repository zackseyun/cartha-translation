base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/017.yaml
  text: Pour out your bread on the grave of the righteous[a], and give none to sinners.
translation:
  language: hi
  text: अपनी रोटियाँ धर्मियों की कब्र पर उँडेल देना[a], और पापियों को न देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मियों की कब्र के पास।” यह वाक्य अंत्येष्टि अथवा स्मृति के अवसर पर किए जाने वाले दान की ओर संकेत कर सकता है, पर यूनानी अभिव्यक्ति यहाँ यथासंभव शाब्दिक रखी गई है।
    reason: ἐπί स्थान के लिए ‘पर’ या प्रसंगानुसार ‘के पास’ व्यक्त कर सकता है; संबंधित प्रथा का ठीक स्वरूप अनिश्चित है।
lexical_decisions:
- source_word: ἔκχεον
  choice: उँडेल देना
  rationale: आज्ञार्थक क्रिया का मूल अर्थ ‘उँडेलना’ या ‘बहा देना’ है। यह असामान्य किंतु ठोस बिंब मूल यूनानी के अनुसार सुरक्षित रखा गया है।
- source_word: τοὺς ἄρτους σου
  choice: अपनी रोटियाँ
  rationale: यूनानी में संज्ञा बहुवचन है और विशेष रोटियों अथवा भोजन-वितरण का ठोस भाव देती है; इसलिए स्वाभाविक हिन्दी बहुवचन ‘रोटियाँ’ रखा गया है।
- source_word: ἐπὶ τὸν τάφον τῶν δικαίων
  choice: धर्मियों की कब्र पर
  rationale: ἐπί के स्थानगत अर्थ ‘पर’ और τάφος के सीधे अर्थ ‘कब्र’ को रखा गया है। इससे किसी अनिश्चित अंत्येष्टि या स्मारक-प्रथा की व्याख्या मुख्य पाठ में आरोपित नहीं होती।
- source_word: τῶν δικαίων
  choice: धर्मियों
  rationale: δικαίων का बाइबलीय नैतिक-धार्मिक अर्थ ‘धर्मी लोगों’ का है; संक्षिप्त और प्रचलित हिन्दी रूप ‘धर्मियों’ चुना गया है।
- source_word: καὶ μὴ δῷς
  choice: और ... न देना
  rationale: καί को सीधे ‘और’ तथा निषेधात्मक क्रिया को ‘न देना’ किया गया है। दूसरे उपवाक्य में कर्म को मूल की तरह निहित रहने दिया गया है।
- source_word: τοῖς ἁμαρτωλοῖς
  choice: पापियों को
  rationale: यह ἁμαρτωλός का पारदर्शी और बाइबलीय हिन्दी समतुल्य है।
theological_decisions:
- issue: अंत्येष्टि-संबंधी निर्देश का आशय
  choice: मुख्य पाठ में ‘धर्मियों की कब्र पर’ का ठोस और शाब्दिक बिंब सुरक्षित रखा गया है।
  alternative: धर्मियों के दफ़न के समय अपनी रोटियाँ बाँटना; धर्मियों की स्मृति में भोजन देना
  rationale: इस कथन के पीछे की सांस्कृतिक प्रथा निश्चित नहीं है। अतः मुख्य पाठ इसे अंत्येष्टि-भोज, शोककालीन दान या स्मारक-दान मानकर अस्पष्टता दूर नहीं करता।
- issue: पापियों के विषय में निषेध का विस्तार
  choice: ‘पापियों को न देना’—दूसरे उपवाक्य में वस्तु को निहित रखा गया है।
  alternative: पापियों को अपनी रोटियाँ न देना; ऐसे अंत्येष्टि-दान में पापियों को सम्मिलित न करना
  rationale: यूनानी में ‘देना’ का कर्म दूसरे उपवाक्य में स्पष्ट रूप से दुहराया नहीं गया। हिन्दी में भी उसे निहित रखने से मूल की संक्षिप्तता और संभावित अर्थ-विस्तार बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक रूप अपनाया गया है। ‘उँडेल देना’ जानबूझकर असामान्य रखा गया है ताकि मूल का ठोस बिंब व्याख्यात्मक ‘बाँट देना’ में न बदल जाए।
