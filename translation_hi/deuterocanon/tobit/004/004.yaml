base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/004.yaml
  text: And do what is pleasing to her[a], and do not grieve her. Remember, child, that she faced many dangers because of you while you were in the womb; when she dies[b], bury her beside me in one grave.
translation:
  language: hi
  text: और जो उसे अच्छा लगे, वही करना और उसे दुःखी न करना। बच्चे, याद रखना कि जब तुम उसके गर्भ में थे, तब तुम्हारे कारण उसने अनेक खतरों का सामना किया है।[a] जब वह मर जाए, तो उसे मेरे पास, एक ही कब्र में दफनाना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “उसने तुम्हारे कारण गर्भ में अनेक खतरे देखे हैं”; यह गर्भावस्था और प्रसव के दौरान उसके द्वारा झेले गए खतरों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसी समाधि में।”
    reason: alternative_reading
lexical_decisions:
- source_word: ποίει τὸ ἀρεστὸν αὐτῇ
  choice: जो उसे अच्छा लगे, वही करना
  rationale: ἀρεστός उस बात को सूचित करता है जो किसी को अच्छी या स्वीकार्य लगे। यह हिन्दी में स्वाभाविक है और αὐτῇ को स्पष्ट रूप से माता से जोड़ता है।
- source_word: μὴ λυπήσῃς αὐτήν
  choice: उसे दुःखी न करना
  rationale: λυπέω का अर्थ किसी को शोक, दुःख या व्यथा पहुँचाना है। ‘दुःखी न करना’ सहज और भावपूर्ण निषेध है।
- source_word: μνήσθητι, παιδίον
  choice: बच्चे, याद रखना
  rationale: παιδίον स्नेहपूर्ण संबोधन है। ‘बच्चे’ मूल शब्द की कोमलता बनाए रखता है और अनावश्यक रूप से स्वामित्वसूचक शब्द नहीं जोड़ता।
- source_word: πολλοὺς κινδύνους ἑόρακεν
  choice: उसने अनेक खतरों का सामना किया था
  rationale: शाब्दिक अर्थ ‘उसने अनेक खतरे देखे हैं’ है, पर यहाँ यूनानी मुहावरा गर्भावस्था और प्रसव के दौरान खतरे झेलने की ओर संकेत करता है। ‘सामना किया था’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: ἐπὶ σοὶ ἐν τῇ κοιλίᾳ
  choice: जब तुम उसके गर्भ में थे, तब तुम्हारे कारण
  rationale: ἐπὶ σοὶ को कारणवाचक और ἐν τῇ κοιλίᾳ को गर्भावस्था के संदर्भ में लिया गया है। हिन्दी वाक्य-विन्यास कारण और समय दोनों को स्पष्ट रखता है।
- source_word: ὅταν ἀποθάνῃ
  choice: जब वह मर जाए
  rationale: ὅταν के साथ विधिलिंग भविष्य की अपेक्षित किंतु अभी घटित न हुई घटना व्यक्त करता है; ‘जब ... मर जाए’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: θάψον αὐτὴν παρʼ ἐμοὶ
  choice: उसे मेरे पास ... दफनाना
  rationale: παρά के सम्प्रदान रूप से निकटता व्यक्त होती है। समाधि-संदर्भ में ‘मेरे पास’ स्पष्ट और स्वाभाविक है।
- source_word: ἐν ἑνὶ τάφῳ
  choice: एक ही कब्र में
  rationale: ἑνὶ τάφῳ का सीधा अर्थ ‘एक कब्र में’ है और यहाँ साझा समाधि का भाव है। ‘एक ही कब्र में’ हिन्दी में इस बल को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पारिवारिक संबोधन παιδίον
  choice: बच्चे
  alternative: बेटे; मेरे बच्चे
  rationale: मूल शब्द स्नेहपूर्ण है, पर उसमें न तो स्पष्ट स्वामित्वसूचक पद है और न व्याकरणतः ‘बेटा’ अनिवार्य है। ‘बच्चे’ इस संयम और स्नेह दोनों को बनाए रखता है।
- issue: ‘अनेक खतरे देखे हैं’ का मुहावरेदार अर्थ
  choice: अनेक खतरों का सामना किया था
  alternative: अनेक खतरे देखे थे
  rationale: शाब्दिक विकल्प हिन्दी में संभव है, किंतु संदर्भ में माता द्वारा गर्भावस्था और प्रसव के खतरे झेलना अभिप्रेत है। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- issue: ἐν ἑνὶ τάφῳ में साझा दफन का स्वरूप
  choice: एक ही कब्र में
  alternative: उसी समाधि में
  rationale: यूनानी पद एक कब्र/समाधि पर बल देता है, पर हिन्दी में इसे साझा कब्र या उसी समाधि के रूप में समझा जा सकता है। मुख्य पाठ निकट औपचारिक अर्थ रखता है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण पारिवारिक उपदेश का गरिमामय, सहज स्वर रखा गया है। ‘दफनाना’ सामान्य पाठक के लिए ‘समाधिस्थ करना’ से अधिक स्पष्ट है। विराम-चिह्नों द्वारा आज्ञाओं और स्मरण-वाक्य को स्वाभाविक रूप से अलग किया गया है।
