base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/014.yaml
  text: Do not let the wages of any man who works for you stay overnight with you, but pay him at once. If you serve God, it will be repaid to you. Watch yourself, child, in all your works, and be disciplined in all your conduct.
translation:
  language: hi
  text: जो कोई तुम्हारे यहाँ काम करे, उसकी मजदूरी रात भर अपने पास मत रोक रखना, बल्कि उसे तुरन्त चुका दो। यदि तुम परमेश्वर की सेवा करोगे, तो तुम्हें प्रतिफल दिया जाएगा। बच्चे, अपने हर काम में सावधान रहो और अपने सारे आचरण में अनुशासित रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθὸς
  choice: मजदूरी
  rationale: यह काम के बदले देय पारिश्रमिक को सहज और सटीक रूप से व्यक्त करता है।
- source_word: παντὸς ἀνθρώπου ὃς ἐὰν ἐργάσηται παρὰ σοὶ
  choice: जो कोई तुम्हारे यहाँ काम करे
  rationale: ἄνθρωπος यहाँ सामान्य मानव-संदर्भ में है; हिन्दी में ‘जो कोई’ लिंग-समावेशी और स्वाभाविक है, जबकि παρὰ σοὶ का अर्थ ‘तुम्हारे यहाँ/तुम्हारे लिए’ है।
- source_word: μὴ αὐλισθήτω
  choice: रात भर तुम्हारे पास न पड़ी रहे
  rationale: क्रिया का मूल भाव रात बिताने या रात भर ठहरे रहने का है; मजदूरी के संदर्भ में यह भुगतान रोककर रखने को दर्शाता है।
- source_word: παραυτίκα
  choice: तुरन्त
  rationale: बिना विलम्ब, उसी समय भुगतान करने का बल बनाए रखता है।
- source_word: ἀποδοθήσεταί σοι
  choice: तुम्हें उसका प्रतिफल दिया जाएगा
  rationale: यूनानी का कर्मवाच्य और प्रतिदान का भाव सुरक्षित है; देने वाले को पाठ स्वयं स्पष्ट नहीं करता।
- source_word: πρόσεχε σεαυτῷ
  choice: अपने ऊपर ध्यान रखो
  rationale: आत्म-सावधानी और स्वयं की निगरानी का सीधा भाव व्यक्त करता है।
- source_word: παιδίον
  choice: हे मेरे बच्चे
  rationale: स्नेहपूर्ण सम्बोधन को आधुनिक, गरिमामय हिन्दी में व्यक्त करता है।
- source_word: πεπαιδευμένος
  choice: अनुशासित
  rationale: शिक्षित, प्रशिक्षित और संयमित आचरण के प्रसंगगत भाव को संक्षेप में व्यक्त करता है।
- source_word: ἀναστροφῇ
  choice: आचरण
  rationale: जीवन-व्यवहार या चालचलन का नैतिक भाव यहाँ ‘आचरण’ से स्वाभाविक रूप से आता है।
theological_decisions:
- issue: सेवा के प्रतिफल का कर्ता
  choice: कर्मवाच्य ‘तुम्हें उसका प्रतिफल दिया जाएगा’
  alternative: ‘परमेश्वर तुम्हें उसका प्रतिफल देगा’
  rationale: मूल पाठ ἀποδοθήσεταί का कर्ता नहीं बताता। परमेश्वर को स्पष्ट कर्ता बनाना सम्भावित अर्थ है, पर अनुवाद में निहित अस्पष्टता बनाए रखना अधिक स्रोत-संगत है।
- issue: ἐὰν δουλεύσῃς τῷ θεῷ में सेवा का स्वरूप
  choice: ‘यदि तुम परमेश्वर की सेवा करोगे’
  alternative: ‘यदि तुम परमेश्वर के दास बनोगे’
  rationale: δουλεύω में दासवत सेवा का प्रबल भाव हो सकता है, किन्तु इस उपदेशात्मक प्रसंग में ‘सेवा करना’ स्वाभाविक है और मूल की धार्मिक निष्ठा को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; पिता द्वारा बच्चे को दिए जा रहे नैतिक उपदेश के अनुरूप स्नेहपूर्ण, स्पष्ट और गरिमामय शैली। वाक्य-रचना साधारण पाठक के लिए सहज रखी गई है, साथ ही यूनानी कर्मवाच्य और प्रतिफल देने वाले की अस्पष्टता सुरक्षित है।
