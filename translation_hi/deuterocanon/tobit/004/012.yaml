base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/012.yaml
  text: Guard yourself[a], child, from all sexual immorality, and first take a wife from the offspring of your fathers. Do not take a foreign woman who is not from the tribe of your father, because we are sons of the prophets. Remember, child, Noah, Abraham, Isaac, and Jacob, our fathers from of old, that they all took wives from among their brothers, and they were blessed in their children[b], and their offspring will inherit the land.
translation:
  language: hi
  text: बेटे, अपने आप को हर प्रकार की यौन अनैतिकता से बचाए रखना। सबसे पहले अपने पूर्वजों के वंश में से पत्नी लेना। पराए कुल की ऐसी स्त्री से विवाह न करना जो तुम्हारे पिता के गोत्र की न हो, क्योंकि हम भविष्यद्वक्ताओं के पुत्र हैं[a]। बेटे, पुराने समय के हमारे पूर्वजों—नूह, अब्राहम, इसहाक और याकूब—को याद रखना। उन सबने अपने भाइयों के परिवारों में से पत्नियाँ लीं[b], और अपनी सन्तानों में आशीष पाई; उनका वंश उस भूमि का उत्तराधिकारी होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “हम भविष्यद्वक्ताओं के वंशज हैं।” यूनानी में शाब्दिक रूप से “भविष्यद्वक्ताओं के पुत्र” है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में शाब्दिक रूप से “अपने भाइयों में से” है। यहाँ आशय अपने निकट कुटुम्ब या कुल में से है, न कि अपने सगे भाइयों में से।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσεχε σεαυτῷ
  choice: अपने आप को ... से बचाए रखना
  rationale: यह यूनानी मुहावरा सजग आत्म-संयम का निर्देश देता है। यह हिन्दी में स्वाभाविक है और कर्म से स्वयं को सुरक्षित रखने का भाव बनाए रखता है।
- source_word: παιδίον
  choice: बेटे
  rationale: यह पिता का अपनी सन्तान के प्रति स्नेहपूर्ण सम्बोधन है। प्रसंग में सम्बोधित व्यक्ति पुत्र है; ‘बेटे’ आधुनिक हिन्दी में स्वाभाविक और आत्मीय है।
- source_word: πάσης πορνείας
  choice: हर प्रकार की यौन अनैतिकता
  rationale: πορνεία व्यापक यौन दुराचार को सूचित करता है; यह अनुवाद उसे केवल किसी एक प्रकार के अवैध यौन सम्बन्ध तक सीमित नहीं करता।
- source_word: γυναῖκα πρῶτον λάβε
  choice: सबसे पहले ... पत्नी लेना
  rationale: ‘सबसे पहले’ πρῶτον के स्पष्ट प्राथमिकता-सूचक बल को सुरक्षित रखता है, जबकि ‘पत्नी लेना’ विवाह के प्रसंग को व्यक्त करता है।
- source_word: ἀπὸ τοῦ σπέρματος τῶν πατέρων σου
  choice: अपने पूर्वजों के वंश में से
  rationale: σπέρμα यहाँ जैविक बीज के बजाय वंश-परम्परा को सूचित करता है; ‘वंश’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: γυναῖκα ἀλλοτρίαν
  choice: पराई स्त्री
  rationale: ἀλλοτρία उस स्त्री को बताता है जो सम्बोधित व्यक्ति के पैतृक जनसमूह से बाहर है। अगला उपवाक्य इस सामाजिक-वंशगत अर्थ को स्पष्ट करता है।
- source_word: φυλῆς τοῦ πατρός σου
  choice: तुम्हारे पिता के गोत्र
  rationale: φυλή यहाँ पैतृक जनजातीय या वंशगत सम्बद्धता को दर्शाता है। ‘गोत्र’ हिन्दी पाठक के लिए पैतृक वंश-समूह का संक्षिप्त और बोधगम्य पद है, यद्यपि इसे आधुनिक हिन्दू गोत्र-व्यवस्था के तकनीकी अर्थ में नहीं लेना चाहिए।
- source_word: υἱοὶ προφητῶν ἐσμεν
  choice: हम भविष्यद्वक्ताओं के पुत्र हैं
  rationale: असामान्य यूनानी अभिव्यक्ति का शाब्दिक रूप बनाए रखा गया है, ताकि इसे चुपचाप ‘वंशज’ में बदलकर इसकी सम्भावित धार्मिक अनुगूँज समाप्त न हो।
- source_word: ἀπὸ τοῦ αἰῶνος
  choice: पुराने समय के
  rationale: यह पूर्वजों की प्राचीनता बताता है; चुना हुआ रूप सहज आधुनिक हिन्दी में वही अर्थ देता है।
- source_word: ἐκ τῶν ἀδελφῶν αὐτῶν
  choice: अपने भाइयों में से
  rationale: मुख्य पाठ में ἀδελφῶν का औपचारिक रूप सुरक्षित है। विवाह-सन्दर्भ में इसका आशय निकट कुटुम्ब या कुल से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: εὐλογήθησαν ἐν τοῖς τέκνοις αὐτῶν
  choice: अपनी सन्तानों में आशीष पाई
  rationale: 'यह ἐν की वास्तविक अस्पष्टता बनाए रखता है: आशीष सन्तानों में प्रकट हुई, उनके द्वारा मिली, या सन्तान-रूप में मिली—मुख्य पाठ किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।'
- source_word: τὸ σπέρμα αὐτῶν κληρονομήσει γῆν
  choice: उनका वंश उस भूमि का उत्तराधिकारी होगा
  rationale: वंश के लिए एकवचन सामूहिक भाव और κληρονομέω का उत्तराधिकार-संबन्धी अर्थ सुरक्षित है। प्रसंग में γῆ सामान्य पृथ्वी की अपेक्षा पूर्वजों से जुड़ी भूमि की ओर संकेत करती है।
theological_decisions:
- issue: ‘हम भविष्यद्वक्ताओं के पुत्र हैं’ का अर्थ, जबकि आगे कुलपिताओं की सूची है
  choice: मुख्य पाठ में ‘भविष्यद्वक्ताओं के पुत्र’ रखा गया
  alternative: ‘हम भविष्यद्वक्ताओं के वंशज हैं’
  rationale: यूनानी का विशिष्ट वाक्यांश और सूची के साथ उसका तनाव अनुवाद में सुरक्षित रहना चाहिए। सम्भावित वंशगत अर्थ पादटिप्पणी में दिया गया है।
- issue: विवाह-निर्देश में ‘भाइयों’ का कुटुम्ब-सूचक प्रयोग
  choice: मुख्य पाठ में ‘अपने भाइयों में से’ रखा गया और पादटिप्पणी जोड़ी गई
  alternative: ‘अपने कुटुम्बियों में से’ या ‘अपने कुल में से’
  rationale: यूनानी की स्पष्ट पुरुषवाची सम्बन्ध-संज्ञा बनाए रखते हुए पाठक को यह समझाना आवश्यक है कि यहाँ सगे भाइयों से विवाह का अर्थ नहीं है, बल्कि उनके कुटुम्ब या कुल की स्त्रियाँ अभिप्रेत हैं।
- issue: सन्तानों में मिली आशीष का माध्यम या स्वरूप
  choice: ‘अपनी सन्तानों में आशीष पाई’
  alternative: ‘अपनी सन्तानों के द्वारा आशीष पाई’ या ‘सन्तान की आशीष पाई’
  rationale: ἐν के अर्थ को केवल माध्यम या केवल सन्तान-प्राप्ति तक सीमित नहीं किया गया; मूल की बहुअर्थकता सुरक्षित है।
