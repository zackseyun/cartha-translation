  register: भाषा आधुनिक, गरिमापूर्ण और पारिवारिक उपदेश के अनुकूल रखी गई है। ‘बेटे’ आत्मीय सम्बोधन देता है; आज्ञाएँ सहज हिन्दी के ‘लेना/करना/रखना’ रूप में हैं। असामान्य वंशगत और धार्मिक पदों को सरल बनाकर मिटाने के बजाय पादटिप्पणियों से स्पष्ट किया गया है।
