  yaml_path: translation/deuterocanon/tobit/004/016.yaml
  text: Give from your bread to the hungry[a], and from your clothing to the naked. Whatever may abound to you, do as almsgiving[b], and do not let your eye be envious when you do almsgiving.
translation:
  language: hi
  text: अपनी रोटी में से भूखे को दो, और अपने कपड़ों में से नंगों को भी दो। जो कुछ तुम्हारे पास अधिक हो[a], उसे दान में दे दो; और दान देते समय तुम्हारी आँख न जले।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ तुम्हारे पास बचा हुआ हो।” यूनानी शब्द अधिकता या आवश्यकता से बचे हुए भाग—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक चित्र में ‘आँख’ जलती है; आशय है कि दान देते समय मन में जलन, खेद, या अनुदारता न हो।
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐκ τοῦ ἄρτου σου δίδου πεινῶντι
  choice: अपनी रोटी में से भूखे को दो
  rationale: ‘रोटी’ ἄρτος के ठोस चित्र को बनाए रखती है और हिन्दी में भोजन का व्यापक संकेत भी दे सकती है। ‘में से’ ἐκ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τῶν ἱματίων σου τοῖς γυμνοῖς
  choice: अपने कपड़ों में से वस्त्रहीनों को
  rationale: ἱμάτια के लिए ‘कपड़े’ सहज आधुनिक शब्द है। γυμνοῖς का आशय नंगे या पर्याप्त वस्त्र न रखने वालों से हो सकता है; ‘वस्त्रहीन’ अभाव को सीधे व्यक्त करता है, पर उसकी सीमा को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: πᾶν ὃ ἐὰν περισσεύσῃ σοι
  choice: जो कुछ तुम्हारे पास अधिक हो
  rationale: περισσεύω की ‘बहुतायत/आवश्यकता से अधिक होने’ की धारणा सुरक्षित रहती है। यह ‘बचा हुआ’ कहने से अधिक व्यापक है।
- source_word: ποίει ἐλεημοσύνην
  choice: उसे गरीबों को दान कर दो
  rationale: ἐλεημοσύνη यहाँ जरूरतमंदों को दिया जाने वाला ठोस दान है। ‘गरीबों को दान’ आधुनिक हिन्दी में स्पष्ट है और केवल सामान्य दयाभाव का अर्थ नहीं देता।
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: तुम्हारी आँख न कुढ़े
  rationale: यह अनुवाद मूल का ‘आँख’ वाला सजीव मुहावरा बनाए रखते हुए φθονέω के प्रसंगगत अर्थ—देने में मन का संकुचित होना या खेद करना—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: दान देते समय
  rationale: ἐν के साथ प्रयुक्त articular infinitive का कालवाचक अर्थ ‘करते समय’ है। संक्षिप्त हिन्दी पुनरुक्ति को सहज रखती है।
theological_decisions:
- issue: ἐλεημοσύνη का नैतिक आशय
  choice: गरीबों को दान
  alternative: दयाकर्म
  rationale: इस ज्ञान-साहित्यिक प्रसंग में शब्द जरूरतमंदों को वस्तुएँ देने की ठोस क्रिया बताता है। ‘दयाकर्म’ अधिक व्यापक और अमूर्त हो सकता है, इसलिए मुख्य पाठ में दान की विशिष्टता रखी गई है।
- issue: ‘आँख’ के मुहावरे का अनुवाद
  choice: मूल चित्र को रखते हुए ‘तुम्हारी आँख न कुढ़े’
  alternative: दान देने में कंजूसी न करो
  rationale: सिर्फ भावार्थ देने से मूल की प्रभावशाली शारीरिक उपमा मिट जाती। मुख्य पाठ चित्र को सुरक्षित रखता है और पादटिप्पणी उसका आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी अपनाई गई है। ‘रोटी’ और ‘आँख’ जैसे मूल चित्र सुरक्षित रखे गए हैं, जबकि ‘गरीबों को दान’ से ἐλεημοσύνη का ठोस सामाजिक अर्थ स्पष्ट किया गया है।
