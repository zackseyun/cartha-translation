base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/015.yaml
  text: And what you hate[a], do to no one. Do not drink wine to drunkenness, and do not let drunkenness go with you on your way.
translation:
  language: hi
  text: जिस बात से तुम घृणा करते हो[a], वैसा किसी के साथ न करो। दाख की मदिरा इतनी न पीना कि मदहोश हो जाओ, और मदहोशी तुम्हारी राह पर तुम्हारे साथ न चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हें अप्रिय लगता है, वैसा किसी के साथ न करो।”
    reason: ὃ μισεῖς को सक्रिय रूप में ‘जिस बात से तुम घृणा करते हो’ अथवा भाववाचक रूप में ‘जो तुम्हें अप्रिय लगता है’ समझा जा सकता है।
lexical_decisions:
- source_word: ὃ μισεῖς
  choice: जिस बात से तुम घृणा करते हो
  rationale: यह संबंधवाचक वाक्यांश व्यापक और नीतिवचनात्मक है। यह अनुवाद एकवचन संबोधन और ‘घृणा करने’ के सक्रिय अर्थ को बनाए रखता है; वैकल्पिक भाववाचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: μηδενὶ ποίησης
  choice: वह किसी के साथ न करो
  rationale: दत्तिव μηδενὶ उस व्यक्ति को सूचित करता है जिसके साथ वह काम नहीं करना है। ‘किसी के साथ न करो’ आधुनिक हिन्दी में निषेध की सार्वभौमिकता स्पष्ट रखता है।
- source_word: οἶνον
  choice: दाखमधु
  rationale: यह οἶνος का सटीक हिन्दी समतुल्य है और सामान्य मदिरा के बजाय अंगूर से बनी मदिरा का अर्थ बनाए रखता है।
- source_word: εἰς μέθην μὴ πίῃς
  choice: इतना न पीना कि मतवाले हो जाओ
  rationale: εἰς μέθην परिणाम या सीमा व्यक्त करता है। यह स्वाभाविक हिन्दी में नशे की अवस्था तक पीने के स्पष्ट निषेध को व्यक्त करता है।
- source_word: μὴ πορευθήτω μετὰ σοῦ μέθη
  choice: मतवालापन ... तुम्हारे साथ न चले
  rationale: यूनानी पाठ मतवालेपन को साथ चलने वाली वस्तु के रूप में व्यक्तित्व देता है। अनुवाद उस चित्र को समतल किए बिना सुरक्षित रखता है।
- source_word: ἐν τῇ ὁδῷ σου
  choice: तुम्हारे मार्ग में
  rationale: यह वास्तविक यात्रा और जीवन-मार्ग, दोनों की संभावित छवि को बनाए रखता है और किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: पारस्परिक नैतिक सिद्धांत की नकारात्मक अभिव्यक्ति
  choice: जिस बात से तुम घृणा करते हो, वह किसी के साथ न करो।
  alternative: जो तुम्हें अप्रिय लगता है, वह किसी के साथ न करो।
  rationale: यूनानी पाठ पारस्परिकता के सिद्धांत को नकारात्मक रूप में रखता है। मुख्य पाठ μισεῖς की सक्रिय क्रिया को निकटता से दर्शाता है, जबकि पादटिप्पणी सम्भव भाववाचक समझ को सुरक्षित रखती है; किसी विशेष धर्मसैद्धांतिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और सामान्य पाठकों के लिए बोधगम्य संबोधन रखा गया है। ‘दाखमधु’ स्रोत के ‘wine’ अर्थ की सटीकता रखता है, और अंतिम उपवाक्य में मतवालेपन के साथ चलने का मूल रूपक जानबूझकर सुरक्षित रखा गया है।
