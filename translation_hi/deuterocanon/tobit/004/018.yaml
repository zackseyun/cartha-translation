translation:
  language: hi
  text: हर बुद्धिमान व्यक्ति से सलाह लो, और किसी भी उपयोगी सलाह को तुच्छ न समझो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλίαν
  choice: सलाह
  rationale: यह संज्ञा विचारपूर्वक दी गई सम्मति या मार्गदर्शन को दर्शाती है। आधुनिक हिन्दी में ‘सलाह लेना’ स्वाभाविक है और ζητέω के साथ इसका आशय स्पष्ट करता है।
- source_word: παρὰ παντὸς φρονίμου
  choice: हर बुद्धिमान व्यक्ति से
  rationale: παρά के संबंधकारक प्रयोग से स्रोत का अर्थ ‘से’ निकलता है। φρόνιμος विवेकी, समझदार या बुद्धिमान व्यक्ति को दर्शाता है; यहाँ सामान्य नीतिवचन-सदृश निर्देश होने के कारण ‘व्यक्ति’ प्रतिनिधिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ζήτησον
  choice: लो
  rationale: ζητέω का मूल भाव सक्रिय रूप से खोजने का है; ‘सलाह लो’ हिन्दी में सलाह माँगने और पाने का प्रयत्न करने, दोनों को समेटने वाला स्वाभाविक आज्ञार्थक प्रयोग है।
- source_word: μὴ καταφρονήσῃς
  choice: तुच्छ न समझो
  rationale: καταφρονέω किसी को या किसी बात को हेय समझने अथवा अवमानना से ठुकराने का प्रबल भाव रखता है। ‘तुच्छ न समझो’ उस नैतिक तीव्रता को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: किसी भी उपयोगी सलाह को
  rationale: χρήσιμος का अर्थ उपयोगी या लाभकारी है। निषेधात्मक वाक्य में πάσης का वितरणात्मक बल हिन्दी में ‘किसी भी’ से स्वाभाविक रूप से व्यक्त होता है।
