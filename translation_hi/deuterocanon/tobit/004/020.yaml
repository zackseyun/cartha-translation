lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: के बारे में बता रहा हूँ
  rationale: क्रिया का अर्थ यहाँ धन को आँखों के सामने दिखाना आवश्यक नहीं, बल्कि उसका उल्लेख करके उसकी जानकारी देना भी हो सकता है। यह वर्तमान काल को स्वाभाविक हिन्दी में बनाए रखता है और प्रसंग के अनुसार अस्तित्व तथा ठिकाने की सूचना देने का भाव व्यक्त करता है।
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: चाँदी के उन दस तोड़ों
  rationale: प्राचीन भार और मुद्रा की इकाई τάλαντον को आधुनिक मूल्य में बदलने के बजाय पारंपरिक हिन्दी रूप ‘तोड़’ से रखा गया है; ‘चाँदी के’ धातु को स्पष्ट करता है। निश्चयवाचकता को प्रसंगानुकूल ‘उन’ से व्यक्त किया गया है।
- source_word: παρεθέμην
  choice: जमा किया था
  rationale: मध्यवाच्य रूप यहाँ धन को किसी व्यक्ति के पास सुरक्षित रखने के लिए सौंपने का संकेत देता है। ‘जमा किया था’ वित्तीय प्रसंग में स्वाभाविक और सटीक है।
- source_word: Γαβαήλῳ
  choice: गबाएल
  rationale: व्यक्तिवाचक नाम का यूनानी रूप से देवनागरी लिप्यंतरण किया गया है।
- source_word: τῷ τοῦ Γαβρεία
  choice: गब्रिया के पुत्र
  rationale: यूनानी लेख के साथ संबंधकारक पिता के नाम से व्यक्ति की पहचान कराता है; स्वाभाविक हिन्दी में ‘पुत्र’ जोड़ना आवश्यक है।
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: मादै देश के रागेस नगर में
  rationale: भौगोलिक संबंधकारक को सहज हिन्दी में ‘मादै देश के’ और स्थान को स्पष्ट करने के लिए ‘नगर’ के साथ व्यक्त किया गया है; Ῥάγοις का लिप्यंतरण ‘रागेस’ रखा गया है।
