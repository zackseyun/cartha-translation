base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/002.yaml
  text: And he said within himself[a], “I have asked for death; why should I not call Tobiah my son, so that I may instruct him before I die?”
translation:
  language: hi
  text: और उसने अपने मन में कहा[a], “मैंने मृत्यु माँगी है; तो फिर मैं अपने बेटे तोबियाह को क्यों न बुलाऊँ, ताकि अपने मरने से पहले उसे निर्देश दे सकूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'समानांतर सेमिटिक परंपरा इस विचार को विस्तार देती है: तोबीत अपने मरने से पहले तोबियाह को गबाएल के पास जमा किए गए धन के विषय में बताने के लिए बुलाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: अपने मन में कहा
  rationale: यह यूनानी मुहावरे के आंतरिक आत्म-संवाद को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है; केवल ‘सोचा’ कहना बोलने की छवि को कम कर देता।
- source_word: ᾐτησάμην θάνατον
  choice: मैंने मृत्यु माँगी है
  rationale: क्रिया पहले की गई माँग की ओर संकेत करती है जिसका वर्तमान विचार-विमर्श से संबंध है। मूल क्रिया केवल ‘माँगना’ कहती है, इसलिए ‘मृत्यु के लिए प्रार्थना की’ जैसी अधिक व्याख्यात्मक भाषा नहीं अपनाई गई।
- source_word: τί οὐ καλῶ
  choice: तो फिर ... क्यों न बुलाऊँ
  rationale: यह साधारण सूचना-प्रश्न नहीं, बल्कि आत्म-विचार में निर्णय की ओर बढ़ता हुआ प्रश्न है। ‘क्यों न बुलाऊँ’ उस विचारात्मक और आत्म-प्रेरक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Τωβείαν τὸν υἱόν μου
  choice: अपने बेटे तोबियाह को
  rationale: ‘तोबियाह’ नाम का सेमिटिक रूप है और ‘अपने बेटे’ हिन्दी में संबंध को सहज तथा स्पष्ट करता है।
- source_word: ὑποδείξω
  choice: निर्देश दे सकूँ
  rationale: क्रिया का अर्थ दिखाना, बताना या निर्देश देना हो सकता है। मृत्यु से पहले पिता द्वारा पुत्र को बुलाने के प्रसंग में ‘निर्देश देना’ व्यापक आशय को रखता है, बिना जमा धन का विशिष्ट विषय मुख्य पाठ में जोड़ने के।
- source_word: πρὶν ἀποθανεῖν με
  choice: अपने मरने से पहले
  rationale: यह स्पष्ट कालवाचक उपवाक्य है और आधुनिक हिन्दी में मूल का सीधा, स्वाभाविक अर्थ देता है।
theological_decisions:
- issue: ὑποδείξω के अर्थ पर समानांतर सेमिटिक परंपरा का प्रभाव
  choice: मुख्य पाठ में सामान्य अर्थ ‘उसे निर्देश दे सकूँ’ रखा गया है।
  alternative: ‘मरने से पहले उसे उस धन के विषय में बता दूँ।’
  rationale: प्राथमिक यूनानी पाठ निर्देश अथवा जानकारी देने की बात तो करता है, पर जमा धन का स्पष्ट उल्लेख नहीं करता। बाद की अप्रत्यक्ष इब्रानी सामग्री में मिला विस्तार पाठांतर-सूचना के रूप में उपयोगी है, पर उसे यूनानी-आधारित मुख्य पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण, पर सामान्य पाठक के लिए सुबोध। ‘अपने मन में कहा’ मूल की आंतरिक वाणी को और ‘क्यों न बुलाऊँ’ उसके विचारात्मक प्रश्न को सुरक्षित रखते हैं।
