base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/005.yaml
  text: All the days[a], child, remember the Lord our God. Do not desire to transgress his commandments. Practice righteousness all the days of your life, and do not walk in the ways of unrighteousness.
translation:
  language: hi
  text: बालक, हर दिन प्रभु हमारे परमेश्वर को स्मरण रखना। उसकी आज्ञाओं का उल्लंघन करने की इच्छा मत करना। अपने जीवन के सभी दिनों में धार्मिकता[a] का आचरण करना और अधार्मिकता के मार्गों पर मत चलना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय का आचरण करना ... अन्याय के मार्गों पर मत चलना।” यूनानी शब्द व्यक्तिगत नैतिकता और सामाजिक न्याय—दोनों अर्थ व्यक्त कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: हर दिन
  rationale: यह यूनानी वाक्यांश निरंतर, आजीवन स्मरण पर बल देता है; ‘हर दिन’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: παιδίον
  choice: बालक
  rationale: सम्बोधन का स्नेहपूर्ण भाव बना रहता है, जबकि यूनानी में निहित न होने के कारण ‘मेरे’ नहीं जोड़ा गया और ‘पुत्र’ कहकर लिंग को अधिक विशिष्ट नहीं बनाया गया।
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: हमारे परमेश्वर प्रभु
  rationale: यह κύριος को ‘प्रभु’ और θεὸς ἡμῶν को ‘हमारे परमेश्वर’ के रूप में सुरक्षित रखते हुए हिन्दी में एक स्वाभाविक श्रद्धापूर्ण पदबंध बनाता है।
- source_word: μνημόνευε
  choice: स्मरण रखना
  rationale: वर्तमान आज्ञार्थक निरंतर स्मरण का निर्देश देता है; ‘स्मरण रखना’ धार्मिक-नैतिक गंभीरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μὴ θελήσῃς παραβῆναι
  choice: उल्लंघन करने की इच्छा मत करना
  rationale: इससे θελήσῃς की इच्छात्मकता और παραβῆναι का उल्लंघन—दोनों व्यक्त होते हैं; इसे केवल ‘उल्लंघन मत करना’ बनाकर इच्छा के तत्व को हटाया नहीं गया।
- source_word: ἐντολάς
  choice: आज्ञाओं
  rationale: धार्मिक और नैतिक सन्दर्भ में यह प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: δικαιοσύνην ποίει
  choice: धार्मिकता का आचरण करना
  rationale: शाब्दिक अर्थ ‘धार्मिकता करना’ है; ‘आचरण करना’ निरंतर जीवन-व्यवहार को स्वाभाविक हिन्दी में व्यक्त करता है। δικαιοσύνη के ‘न्याय’ अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: अपने जीवन के सभी दिनों में
  rationale: मूल की पुनरावृत्ति और आजीवन अवधि दोनों को निकटता से सुरक्षित रखता है।
- source_word: μὴ πορευθῇς
  choice: मत चलना
  rationale: ‘मार्गों’ के साथ आचरण के बाइबलीय रूपक को बनाए रखता है।
- source_word: ταῖς ὁδοῖς τῆς ἀδικίας
  choice: अधार्मिकता के मार्गों पर
  rationale: बहुवचन ‘मार्गों’ को बनाए रखता और धार्मिकता/अधार्मिकता के मूल शब्दगत विरोध को स्पष्ट करता है।
theological_decisions:
- issue: δικαιοσύνη / ἀδικία के नैतिक युग्म का अनुवाद
  choice: धार्मिकता / अधार्मिकता
  alternative: न्याय / अन्याय
  rationale: यह पद व्यापक धार्मिक और नैतिक जीवन-व्यवहार के दो विरोधी मार्ग प्रस्तुत करता है। ‘धार्मिकता/अधार्मिकता’ उस व्यापकता और शब्दगत विरोध को बनाए रखता है; सामाजिक-नैतिक ‘न्याय/अन्याय’ अर्थ को पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। आज्ञार्थक वाक्यों में स्नेहपूर्ण पारिवारिक सम्बोधन और मूल की निरंतरता पर दी गई दोहरी जोर को सुरक्षित रखा गया है।
