base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/010.yaml
  text: For almsgiving rescues from death and will not allow one to enter into the darkness[a][b].
translation:
  language: hi
  text: क्योंकि दान देना मृत्यु से छुड़ाता है और किसी को अंधकार में प्रवेश नहीं करने देगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परोपकार” अथवा “दया के काम”; यूनानी शब्द विशेष रूप से जरूरतमंदों को दान देने की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “अंधकार” संभवतः मृत्यु के लोक या घोर अंधकार का बिंब है; यूनानी में यह चित्र संक्षिप्त और कुछ हद तक खुला छोड़ा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: दान देना
  rationale: यहाँ यूनानी संज्ञा जरूरतमंदों को ठोस रूप से सहायता या दान देने को दर्शाती है; आधुनिक हिन्दी में ‘दान देना’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: ἐκ θανάτου
  choice: मृत्यु से
  rationale: ἐκ छुटकारे के आरंभ-बिंदु को दर्शाता है; ‘मृत्यु से’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: ῥύεται
  choice: छुड़ाता है
  rationale: क्रिया संकट या खतरे से बचाने अथवा छुड़ाने का बोध देती है। ‘छुड़ाता है’ मूल दावे की प्रबलता बनाए रखता है और अनावश्यक व्यवस्थित धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: οὐκ ἐάσει
  choice: नहीं करने देगा
  rationale: भविष्यकालीन क्रिया रोकने या अनुमति न देने को व्यक्त करती है; हिन्दी में यह प्रयोग सहज है।
- source_word: εἰσελθεῖν
  choice: प्रवेश करना
  rationale: यह εἰσέρχομαι के क्रियारूप का सीधा और गरिमापूर्ण हिन्दी प्रतिरूप है।
- source_word: εἰς τὸ σκότος
  choice: अंधकार में
  rationale: ‘अंधकार’ यूनानी बिंब की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है; हिन्दी में भाववाचक संज्ञा के साथ अलग निश्चित उपपद नहीं होता।
theological_decisions:
- issue: क्या पद को इस तरह अनूदित किया जाए कि दान को उद्धार अर्जित करने का साधन बताया जाए
  choice: मूल पाठ का सीधा दावा बनाए रखा गया है कि दान देना मृत्यु से छुड़ाता है, पर इसे किसी विस्तृत धर्मसैद्धांतिक निष्कर्ष में नहीं बदला गया।
  alternative: ‘मृत्यु’ को केवल सांसारिक संकट मानना, या कथन को नरम करके ‘छुड़ा सकता है’ कहना।
  rationale: यूनानी पाठ कथन को बिना किसी संभावनासूचक नरमी के प्रस्तुत करता है। अनुवाद को न इसे कमजोर करना चाहिए, न बाद की धर्मवैज्ञानिक व्यवस्था से इसकी व्याख्या करनी चाहिए।
- issue: ‘अंधकार’ की पहचान
  choice: बिंब को केवल ‘अंधकार’ के रूप में खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से मृतकों का लोक, अधोलोक, या अंतिम दंड कहना।
  rationale: यूनानी पाठ अर्थ को संक्षिप्त और कुछ हद तक अनिर्धारित छोड़ता है; अनुवाद में किसी एक व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘दान देना’ आम पाठक के लिए ‘दानशीलता’ से अधिक ठोस है। मुख्य पाठ में मूल यूनानी की सीधी धर्मवैज्ञानिक तीव्रता और ‘अंधकार’ का खुला बिंब दोनों सुरक्षित रखे गए हैं।
