  yaml_path: translation/deuterocanon/tobit/004/021.yaml
  text: And do not be afraid[a], child, because we have become poor; you have much, if you fear God and turn away from every sin and do what is pleasing before him.
translation:
  language: hi
  text: और बेटे, इस बात से मत डर कि हम गरीब हो गए हैं; तुम्हारे पास बहुत कुछ है[a], यदि तुम परमेश्वर का भय मानो, हर पाप से दूर रहो और जो उसकी दृष्टि में भला है वही करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे लिए बहुत कुछ उपलब्ध है।” यूनानी अभिव्यक्ति किसी के अधिकार में मौजूद वस्तुओं या उसके लिए उपलब्ध साधनों—दोनों का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβοῦ
  choice: मत डर
  rationale: यह निषेधात्मक आज्ञा का स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: παιδίον
  choice: बेटे
  rationale: यह स्नेहपूर्ण सम्बोधन है; प्रसंग में पिता अपने पुत्र को सम्बोधित कर रहा है। यह हिन्दी में स्वाभाविक है और यूनानी में अनुपस्थित ‘मेरे’ को नहीं जोड़ता।
- source_word: ἐπτωχεύσαμεν
  choice: हम गरीब हो गए हैं
  rationale: अओरिस्ट क्रिया गरीबी की अवस्था में आ जाने का भाव देती है, जिसे ‘गरीब हो गए हैं’ स्पष्ट रूप से व्यक्त करता है।
- source_word: ὑπάρχει σοι πολλὰ
  choice: तुम्हारे पास बहुत कुछ है
  rationale: यह यूनानी पदबंध अधिकार में होने या उपलब्ध होने—दोनों का भाव दे सकता है। मुख्य पाठ में सबसे स्वाभाविक हिन्दी रखी गई है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐὰν φοβηθῇς τὸν θεὸν
  choice: यदि तुम परमेश्वर का भय मानो
  rationale: ‘परमेश्वर का भय मानना’ श्रद्धापूर्ण भय के लिए प्रचलित बाइबलीय अभिव्यक्ति है और मूल का धार्मिक भार बनाए रखती है।
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: हर पाप से दूर रहो
  rationale: यह पाप से अलग होने या हट जाने का नैतिक भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ποιήσῃς τὸ ἀρεστὸν
  choice: वही करो जो ... भला लगता है
  rationale: संज्ञा की तरह प्रयुक्त विशेषण का अर्थ ‘जो प्रसन्न करने वाला है’ है; हिन्दी में यह रचना स्पष्ट और सहज है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यह मूल के ‘उसकी उपस्थिति/दृष्टि में’ वाले मूल्यांकनात्मक और सम्बन्धपरक भाव को बनाए रखता है।
theological_decisions:
- issue: गरीबी के प्रसंग में ‘तुम्हारे पास बहुत कुछ है’ का अर्थ
  choice: 'कथन को व्यापक रखा गया है: परमेश्वर का भय मानने, पाप से दूर रहने और उसे भाने वाला काम करने की दशा में पुत्र के पास ‘बहुत कुछ’ है।'
  alternative: इसे केवल भौतिक समृद्धि की प्रतिज्ञा या केवल नैतिक-आत्मिक धन का उल्लेख माना जा सकता है।
  rationale: यूनानी पाठ धन के प्रकार को निश्चित नहीं करता। इसलिए अनुवाद न तो भौतिक समृद्धि की गारंटी जोड़ता है, न कथन को केवल आत्मिक अर्थ तक सीमित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। वाक्य की शर्तात्मक संरचना और मूल की अर्थगत व्यापकता सुरक्षित रखी गई है।
