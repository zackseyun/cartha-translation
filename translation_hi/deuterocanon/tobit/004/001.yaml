lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: यह स्वाभाविक आधुनिक हिन्दी है और यूनानी पदबंध के निश्चित समय-संदर्भ को बनाए रखता है।
- source_word: ἐμνήσθη
  choice: को ... की याद आई
  rationale: यूनानी क्रिया के ‘स्मरण किया/याद आया’ अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: περὶ τοῦ ἀργυρίου
  choice: उस चाँदी
  rationale: ἀργύριον का मूल अर्थ ‘चाँदी’ है, यद्यपि प्रसंग में इससे धन भी अभिप्रेत हो सकता है; इस वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ὃ παρέθετο
  choice: जिसे उसने ... के पास जमा किया था
  rationale: यहाँ παρατίθημι किसी व्यक्ति को धन सुरक्षित रखने के लिए सौंपने अथवा जमा करने का भाव देता है; पूर्वकालिकता के लिए ‘किया था’ उपयुक्त है।
- source_word: Γαβαήλῳ
  choice: गबाएल
  rationale: व्यक्तिनाम को यूनानी रूप Γαβαήλ के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: ἐν Ῥάγοις
  choice: रागेस नगर में
  rationale: स्थाननाम को यूनानी Ῥάγοις के अनुसार लिप्यंतरित किया गया है; स्पष्टता के लिए ‘नगर’ जोड़ा गया है, बिना स्थान की प्रकृति बदलने के।
- source_word: τῆς Μηδίας
  choice: मादै प्रदेश के
  rationale: यह रागेस को व्यापक क्षेत्र Media से संबद्ध करता है; ‘मादै’ हिन्दी बाइबलीय नाम-परंपरा में परिचित रूप है और ‘प्रदेश’ आधुनिक पाठक के लिए संबंध स्पष्ट करता है।
