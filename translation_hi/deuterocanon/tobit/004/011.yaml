lexical_decisions:
- source_word: δῶρον
  choice: उपहार
  rationale: यह शब्द सामान्यतः ‘उपहार’ या प्रसंगानुसार ‘भेंट’ का अर्थ रखता है। यहाँ ‘उपहार’ मूल कथन की व्यापकता बनाए रखता है और अनावश्यक रूप से उपासना-संबंधी अर्थ नहीं जोड़ता।
- source_word: ἐλεημοσύνη
  choice: दान देना
  rationale: यहाँ शब्द विशेष रूप से जरूरतमंदों को सहायता देने की ठोस क्रिया बताता है। आधुनिक हिन्दी में ‘दान देना’ सहज और स्पष्ट है।
- source_word: πᾶσι τοῖς ποιοῦσιν αὐτήν
  choice: उन सभी के लिए ... जो ऐसा करते हैं
  rationale: यह यूनानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है; इससे कार्य को वास्तव में करने का भाव बना रहता है।
- source_word: ἐνώπιον τοῦ ὑψίστου
  choice: परमप्रधान के सामने
  rationale: यह स्थान-संबंधी भाषा को बनाए रखता है और परमेश्वर की दृष्टि या उपस्थिति में किए जाने का भाव व्यक्त करता है।
- source_word: τοῦ ὑψίστου
  choice: परमप्रधान
  rationale: यह यहूदी यूनानी में प्रयुक्त श्रद्धापूर्ण ईश्वरीय उपाधि का मानक और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: दान देने को ‘उत्तम उपहार’ कहने का आशय
  choice: कथन को दान देने के सकारात्मक नैतिक और धार्मिक मूल्य की सीधी प्रशंसा के रूप में रखा गया है।
  alternative: इसे विशेष रूप से स्वर्गीय प्रतिफल या परमेश्वर को दी जाने वाली धार्मिक भेंट के रूप में समझना।
  rationale: यूनानी पाठ इतना ही कहता है कि परमप्रधान के सामने दान देना ऐसा करने वालों के लिए उत्तम उपहार है। अनुवाद में इससे आगे बढ़कर पुण्य द्वारा उद्धार या उपासना-विधि का सिद्धांत नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दान देना’ ने जरूरतमंदों को देने की ठोस क्रिया को व्यक्त किया है, जबकि ‘परमप्रधान’ ने ईश्वरीय उपाधि को सुरक्षित रखा है।
