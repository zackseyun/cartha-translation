base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/013.yaml
  text: And now[a], child, love your brothers, and do not become proud in your heart over your brothers and the sons and daughters of your people, so as to take a wife for yourself from among them. For in pride there is ruin and much disorder, and in uselessness there is decline and great want[b]; for uselessness is the mother of famine.
translation:
  language: hi
  text: और अब[a], बच्चे, अपने भाइयों से प्रेम कर और अपने मन में अपने भाइयों तथा अपने लोगों के बेटे-बेटियों से अपने को ऊँचा न समझ, ताकि तू उन्हीं में से अपने लिए पत्नी ले। क्योंकि घमंड में विनाश और बड़ी अव्यवस्था है, और अकर्मण्यता में गिरावट और भारी अभाव[b] है; क्योंकि अकर्मण्यता अकाल की माँ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस वाक्यांश का अनुवाद यह भी हो सकता है: “अपने भाइयों तथा अपने लोगों के बेटे-बेटियों के प्रति उस समय घमंड न कर, जब तू उन्हीं में से अपने लिए पत्नी ले।” यूनानी वाक्य-विन्यास संक्षिप्त है, इसलिए घमंड की चेतावनी और विवाह वाले खंड का आपसी संबंध एक से अधिक प्रकार से समझा जा सकता है।'
    reason: alternative_reading
  - marker: b
    text: “अकर्मण्यता” का अनुवाद “आलस्य” या, इस प्रसंग में कम संभव रूप से, “निकम्मापन” भी हो सकता है। गिरावट, अभाव और अकाल का निकट संदर्भ आलस्य या अनुत्पादक निष्क्रियता के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: बालक
  rationale: यह स्नेहपूर्ण प्रत्यक्ष संबोधन है। ‘बालक’ यूनानी शब्द के लघुतासूचक और पारिवारिक भाव को रखता है, बिना मूल में अनुपस्थित ‘मेरे’ को जोड़े।
- source_word: ἀγάπα
  choice: प्रेम कर
  rationale: सीधी आज्ञा का सरल और स्वाभाविक अनुवाद।
- source_word: ἀδελφούς
  choice: भाइयों
  rationale: यूनानी रूप पुल्लिंग बहुवचन है; आगे ‘बेटे-बेटियों’ का स्पष्ट विस्तार भी आता है, इसलिए यहाँ उसे सामान्यीकृत नहीं किया गया।
- source_word: ὑπερηφάνευε τῇ καρδίᾳ σου
  choice: अपने मन में घमंड न कर
  rationale: ‘मन’ भीतरी प्रवृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘घमंड’ आत्म-उत्कर्ष के नैतिक अर्थ को स्पष्ट रखता है।
- source_word: ἀπὸ τῶν ἀδελφῶν σου καὶ τῶν υἱῶν καὶ θυγατέρων τοῦ λαοῦ σου
  choice: अपने भाइयों तथा अपने लोगों के बेटे-बेटियों से
  rationale: घमंड के साथ ἀπό दूसरों के प्रति या उनसे अपने को ऊँचा मानने का भाव दे सकता है। हिन्दी में ‘से’ मूल की संक्षिप्तता और संबंधगत अस्पष्टता को अपेक्षाकृत खुला रखता है।
- source_word: λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
  choice: ताकि उन्हीं में से अपने लिए पत्नी ले
  rationale: अनन्त क्रिया का प्रयोजन/परिणाम-संबंध ‘ताकि’ से व्यक्त किया गया है; ‘अपने लिए पत्नी ले’ मूल मुहावरे के निकट है। इस खंड का पूर्ववर्ती चेतावनी से ठीक संबंध पादटिप्पणी में खुला रखा गया है।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: यह घमंड के विध्वंसकारी परिणाम को दृढ़ता से व्यक्त करता है, बिना किसी विशिष्ट पारलौकिक अर्थ को थोपे।
- source_word: ἀκαταστασία πολλή
  choice: बड़ी अव्यवस्था
  rationale: सामाजिक और व्यावहारिक अस्थिरता के व्यापक अर्थ को सहज हिन्दी में रखता है।
- source_word: ἀχρειότης
  choice: अकर्मण्यता
  rationale: शब्द का मूल दायरा अनुपयोगिता से लेकर निष्क्रियता तक हो सकता है। अभाव और अकाल का संदर्भ अनुत्पादक निष्क्रियता का समर्थन करता है; ‘अकर्मण्यता’ दोनों छायाओं को कुछ हद तक समेटती है।
- source_word: ἐλάττωσις
  choice: गिरावट
  rationale: घटने या कम होते जाने का व्यापक अर्थ रखता है और आर्थिक-सामाजिक संदर्भ में स्वाभाविक है।
- source_word: ἔνδεια μεγάλη
  choice: भारी अभाव
  rationale: गहरी कमी और दरिद्रता का भाव संक्षिप्त, वर्तमान हिन्दी में व्यक्त होता है।
- source_word: λιμοῦ
  choice: अकाल
  rationale: भोजन की व्यापक कमी या दुर्भिक्ष के लिए मानक और कहावत-संगत हिन्दी शब्द।
theological_decisions:
- issue: विवाह वाले खंड का सामाजिक-नैतिक संबंध
  choice: मुख्य पाठ घमंड की मनाही को अपने लोगों में से पत्नी लेने के प्रयोजन/परिणाम से जोड़ता है, पर संबंध को पादटिप्पणी द्वारा खुला रखता है।
  alternative: इसे अधिक संकीर्ण रूप से अपने ही लोगों में विवाह करने की आज्ञा, या पत्नी चुनते समय अपने लोगों के प्रति घमंड न करने की चेतावनी माना जा सकता है।
  rationale: यूनानी वाक्य-विन्यास संक्षिप्त है। किसी व्यापक वैवाहिक सिद्धांत को जोड़ने या केवल एक व्याख्या को निर्णायक बनाने के बजाय वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यीय लहजा रखा गया है। एकवचन संबोधन के अनुरूप ‘कर’ और ‘ले’ प्रयुक्त हैं। ‘अकर्मण्यता अकाल की माँ है’ मूल के सूक्तिपरक रूपक को ज्यों का त्यों बनाए रखता है।
