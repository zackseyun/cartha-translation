lexical_decisions:
- source_word: ὡς σοι ὑπάρχει κατὰ τὸ πλῆθος
  choice: तुम्हारे पास जितना है, यदि बहुत है तो उसी के अनुपात में
  rationale: ὡς σοι ὑπάρχει उपलब्ध संपत्ति को माप का आधार बनाता है और κατὰ τὸ πλῆθος उसकी अधिक मात्रा के अनुरूप देने का भाव रखता है। हिन्दी में स्पष्टता के लिए निहित विरोध को ‘यदि बहुत है’ से व्यक्त किया गया है।
- source_word: ποίησον ἐξ αὐτῶν ἐλεημοσύνην
  choice: उसमें से दान दो
  rationale: ἐλεημοσύνη यहाँ जरूरतमंदों को दिया जाने वाला ठोस दान है, केवल सामान्य दया नहीं; ἐξ αὐτῶν अपनी उपलब्ध संपत्ति में से देने को सूचित करता है।
- source_word: ἐὰν ὀλίγον σοι ὑπάρχῃ
  choice: यदि तुम्हारे पास थोड़ा है
  rationale: यह अधिक साधनों के विपरीत सीमित साधनों की सीधी और स्वाभाविक अभिव्यक्ति है।
- source_word: κατὰ τὸ ὀλίγον
  choice: उस थोड़े के अनुपात में
  rationale: κατά के आनुपातिक अर्थ को बनाए रखते हुए यह पहले खंड के साथ अलंकारिक समानता रखता है।
- source_word: μὴ φοβοῦ ποιεῖν ἐλεημοσύνην
  choice: दान देने से मत डरो
  rationale: φοβοῦ के शाब्दिक ‘डरना’ को सुरक्षित रखा गया है; पाठ कम साधन होने पर भी दान से पीछे न हटने को कहता है।
theological_decisions:
- issue: ἐλεημοσύνη का अनुवाद
  choice: दान / दान देना
  alternative: दया करना; भिक्षा देना
  rationale: इस यहूदी-यूनानी संदर्भ में शब्द जरूरतमंद को सहायता देने की ठोस धार्मिक-नैतिक क्रिया बताता है। आधुनिक हिन्दी में ‘दान’ स्वाभाविक और गरिमापूर्ण है; ‘दया’ बहुत व्यापक और ‘भिक्षा’ अनावश्यक रूप से संकीर्ण हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन एकवचन और आत्मीय है। भाषा सहज तथा गरिमापूर्ण रखी गई है। ‘अनुपात में’ दोनों खंडों में κατά की समानांतर आनुपातिक शक्ति को स्पष्ट करता है।
