base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/006.yaml
  text: For if you practice the truth[a], your works will prosper[b], and so will all who practice righteousness.
translation:
  language: hi
  text: क्योंकि सत्य का आचरण करने पर तुम्हारे काम सफल होंगे[b], और धार्मिकता का आचरण करनेवाले सभी लोगों के कामों में भी सफलता होगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ग्रीक वाक्यांश संक्षिप्त है; शाब्दिक भाव है, “तुम्हारे कामों में सफलताएँ होंगी।” इसका आशय कार्यों के अनुकूल परिणाम से है, केवल आर्थिक समृद्धि से नहीं।
    reason: source_compression
  - marker: c
    text: “धार्मिकता” का अनुवाद “न्याय” भी किया जा सकता है। ग्रीक δικαιοσύνη में नैतिक सीधाई और न्यायपूर्ण आचरण, दोनों अर्थ हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιοῦντός σου τὴν ἀλήθειαν
  choice: जब तुम सत्य का आचरण करोगे
  rationale: ग्रीक रचना शाब्दिक रूप से ‘तुम्हारे सत्य करने पर’ जैसी संक्षिप्त है। ‘सत्य का आचरण करना’ ἀλήθεια के नैतिक अर्थ—सच्चाई और विश्वासयोग्य जीवन—को बनाए रखता है, और ‘जब’ कालगत संबंध को बिना अनावश्यक रूप से शर्त में बदल दिए व्यक्त करता है।
- source_word: εὐοδίαι ἔσονται ἐν τοῖς ἔργοις σου
  choice: तुम्हारे काम सफल होंगे
  rationale: εὐοδία अनुकूल परिणाम या सफलता को सूचित करता है। यह स्वाभाविक हिन्दी है और केवल भौतिक समृद्धि का अर्थ नहीं थोपती।
- source_word: πᾶσι τοῖς ποιοῦσι τὴν δικαιοσύνην
  choice: धार्मिकता का आचरण करनेवाले सभी लोग
  rationale: वर्तमान कृदन्त नियमित, चरित्रगत आचरण बताता है। ‘धार्मिकता’ δικαιοσύνη की व्यापक नैतिक सीधाई को व्यक्त करती है, जबकि ‘न्याय’ सम्भव वैकल्पिक अर्थ है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस ज्ञान-साहित्यीय नैतिक उपदेश में शब्द का आशय न्यायिक निष्पक्षता तक सीमित न होकर परमेश्वर और मनुष्यों के सामने सीधे आचरण से है। फिर भी ‘न्याय’ की वास्तविक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: सत्यपूर्ण आचरण और सफलता का संबंध
  choice: पाठ के कथन को सीधे कारणात्मक/परिणामात्मक रूप में रखना
  alternative: इसे केवल सामान्य संभावना या भौतिक समृद्धि की गारंटी के रूप में स्पष्ट करना
  rationale: ग्रीक सत्य के आचरण के साथ कार्यों की सफलता जोड़ता है। अनुवाद इस तनाव को बनाए रखता है, न तो प्रतिज्ञा को कमजोर करता है और न सफलता को धन-संपत्ति तक सीमित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, सहज उपदेशात्मक शैली रखी गई है। ‘सत्य का आचरण’ और ‘धार्मिकता का आचरण’ ग्रीक की समानांतर ποιέω-रचनाओं को दर्शाते हैं। अंतिम खंड की ग्रीक दीर्घवृत्तता को स्पष्ट हिन्दी के लिए क्रिया दोहराकर खोला गया है।
