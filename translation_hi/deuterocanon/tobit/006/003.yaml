base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/003.yaml
  text: Then the young man went down to wash himself[a], and a fish leaped up from the river and tried to swallow the young man.
translation:
  language: hi
  text: तब वह युवक अपने को धोने के लिए नीचे उतरा, और नदी में से एक मछली उछलकर निकली और उस युवक को निगलना चाहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस युवक को निगलने की मंशा की” या “उस युवक को निगलने का प्रयत्न किया।” यूनानी क्रिया इच्छा या मंशा व्यक्त करती है; प्रसंग में इसे आक्रमण के प्रयास के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: वह युवक
  rationale: यह शब्द बालक या किशोर के लिए प्रयुक्त हो सकता है, पर यहाँ तोबियाह इतनी आयु का है कि यात्रा कर रहा है और स्वतंत्र रूप से कार्य करता है; इसलिए आधुनिक हिन्दी में ‘युवक’ प्रसंग के अनुकूल है। दोनों बार एक ही रूप रखा गया है।
- source_word: κατέβη
  choice: नीचे उतरा
  rationale: यह मूल क्रिया की ठोस दिशात्मक गति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: περικλύσασθαι
  choice: अपने को धोने के लिए
  rationale: मध्यमवाची रूप स्वयं को धोने का भाव देता है। ‘नहाने’ से पूर्ण स्नान या डुबकी का अनावश्यक संकेत मिल सकता था।
- source_word: ἀνεπήδησεν
  choice: उछलकर निकली
  rationale: क्रिया अचानक ऊपर की ओर उछलने का चित्र देती है; नदी के प्रसंग में ‘उछलकर निकली’ स्वाभाविक और सजीव है।
- source_word: ἰχθὺς
  choice: एक मछली
  rationale: यूनानी में संज्ञा बिना निश्चित उपपद के है और कथा में यह मछली का पहला उल्लेख है।
- source_word: ἀπὸ τοῦ ποταμοῦ
  choice: नदी से
  rationale: यह यूनानी पूर्वसर्गीय पद का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: ἐβουλήθη
  choice: चाहा
  rationale: क्रिया इच्छा, संकल्प या मंशा व्यक्त करती है। ‘चाहा’ मूल अर्थ को सीधे रखता है और उसे निश्चित रूप से वास्तविक प्रयास में नहीं बदलता।
- source_word: καταπεῖν
  choice: निगल जाना
  rationale: यह ‘नीचे निगलने’ का सीधा अर्थ देता है; ‘खा जाना’ या ‘चट कर जाना’ मूल से अधिक रंग जोड़ते।
