  source_fidelity: 'Draft correctly identifies the heart and liver and preserves the two distinct Greek expressions, δαιμόνιον and πνεῦμα πονηρόν. However, its final clause changes the referent: Greek οὐ μηκέτι ὀχληθῇ says that the afflicted man or woman will no longer be troubled, not that the spirit will no longer trouble that person. The revision retains the Greek passive sense without imposing a gender-specific Hindi verb form.'
  naturalness: ‘हृदय’ and ‘यकृत’ are accurate standard terms, though somewhat formal; they are appropriate for an anatomical reference in this register. The revised syntax makes the conditional instruction and its result clearer and avoids the misleading active final clause.
  terminology: ‘दुष्टात्मा’ for δαιμόνιον and ‘बुरी आत्मा’ for πνεῦμα πονηρόν preserve the source’s two expressions without asserting a doctrinal distinction beyond the text. ‘धुआँ करना’ conveys καπνίσαι as producing smoke by burning.
  issues:
  - severity: high
    issue: The last clause makes ‘वह आत्मा’ the subject and says it will no longer afflict the person.
    rationale: The Greek has a passive verb, ὀχληθῇ, whose implied subject is the man or woman who had been troubled. It states that the person will no longer be troubled; it does not explicitly state that the spirit will cease its action.
  - severity: medium
    issue: The placement of ‘किसी पुरुष या स्त्री’ initially makes it appear to modify only the condition, while the source also places the smoking action before that same person.
    rationale: ἐνώπιον ἀνθρώπου ἢ γυναικός directly modifies the instruction to smoke the organs. Repeating ‘उस पुरुष या स्त्री के सामने’ makes this relation clear in Hindi.
