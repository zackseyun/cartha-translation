  yaml_path: translation/deuterocanon/tobit/006/008.yaml
  text: And he said to him[a], “The heart and the liver—if a demon or an evil spirit troubles anyone, burn these as smoke before a man or a woman, and he or she will no longer be troubled.”
translation:
  language: hi
  text: और उसने उससे कहा, “हृदय और यकृत—यदि कोई दुष्टात्मा या बुरी आत्मा किसी पुरुष या स्त्री को सताती हो, तो इन्हें उस पुरुष या स्त्री के सामने जलाकर धुआँ करना; तब उसे फिर कभी नहीं सताया जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδία
  choice: हृदय
  rationale: यहाँ मछली के वास्तविक अंग का उल्लेख है; ‘हृदय’ शाब्दिक अर्थ को बनाए रखता है।
- source_word: ἧπαρ
  choice: यकृत
  rationale: यह वास्तविक शारीरिक अंग है; ‘यकृत’ सटीक और आधुनिक मानक हिन्दी का शब्द है।
- source_word: ἐάν τινα ὀχλῇ
  choice: यदि ... सताती हो
  rationale: ὀχλέω किसी को लगातार कष्ट या परेशानी देने का भाव रखता है; आत्मिक उत्पीड़न के इस प्रसंग में ‘सताना’ स्वाभाविक है।
- source_word: δαιμόνιον
  choice: दुष्टात्मा
  rationale: यह हिन्दी में दैत्यात्मक आत्मिक सत्ता के लिए प्रचलित बाइबलीय शब्द है और अगले पदबंध से समानार्थी होते हुए भी अलग अभिव्यक्ति बनाए रखता है।
- source_word: πνεῦμα πονηρόν
  choice: बुरी आत्मा
  rationale: यह पदबंध πνεῦμα और πονηρόν का सीधा अनुवाद है तथा δαιμόνιον के साथ प्रयुक्त दो अलग यूनानी अभिव्यक्तियों को पूरी तरह एक नहीं करता।
- source_word: ταῦτα δὲ καπνίσαι
  choice: इन्हें जलाकर धुआँ करना
  rationale: क्रिया का आशय अंगों को जलाकर उनसे धुआँ उत्पन्न करना है; अनुवाद क्रिया और उसके परिणाम दोनों को स्पष्ट करता है।
- source_word: ἐνώπιον ἀνθρώπου ἢ γυναικός
  choice: किसी पुरुष या स्त्री के सामने
  rationale: ἐνώπιον का स्थान-संबंधी अर्थ और मूल में पुरुष तथा स्त्री का स्पष्ट उल्लेख दोनों सुरक्षित हैं।
- source_word: οὐ μηκέτι ὀχληθῇ
  choice: फिर ... आगे कभी नहीं सताएगी
  rationale: οὐ μηκέτι की प्रबल निषेधात्मक शक्ति को ‘आगे कभी नहीं’ व्यक्त करता है और ὀχλέω के पहले प्रयोग के साथ शब्दगत संगति बनी रहती है।
theological_decisions:
- issue: दुष्टात्मा से उत्पीड़न और धुएँ के उपाय के विषय में कथन का स्वरूप
  choice: कथानक में दिए निर्देश को उसके अलौकिक भाषा-रूप सहित सीधे प्रस्तुत किया गया है।
  alternative: इसे केवल लोकविश्वास, प्रतीक या चिकित्सकीय उपाय के रूप में पुनर्व्याख्यायित करना।
  rationale: यूनानी पाठ स्पष्ट रूप से किसी दुष्टात्मा या बुरी आत्मा द्वारा सताए जाने और अंगों का धुआँ करने को उपाय के रूप में बताता है; अनुवाद को इस दावे को न तो नरम करना चाहिए, न उस पर अतिरिक्त धर्मसैद्धांतिक व्याख्या आरोपित करनी चाहिए।
- issue: अंतिम निष्क्रिय क्रिया में कर्ता की हिन्दी अभिव्यक्ति
  choice: स्वाभाविक हिन्दी के लिए ‘वह आत्मा उसे ... नहीं सताएगी’ के रूप में सक्रिय वाक्य प्रयोग किया गया है।
  alternative: ‘वह आगे कभी नहीं सताया जाएगा’ जैसे निष्क्रिय और पुल्लिंग-निर्भर रूप का प्रयोग।
  rationale: सक्रिय रूप पुरुष और स्त्री दोनों पर समान रूप से लागू होता है और यूनानी निष्क्रिय वाक्य का अर्थ बनाए रखता है; ‘वह आत्मा’ निकटवर्ती दुष्टात्मा/बुरी आत्मा की ओर संकेत करता है।
- issue: ἀνθρώπου ἢ γυναικός में लिंग का स्पष्ट उल्लेख
  choice: ‘किसी पुरुष या स्त्री’ रखा गया है।
  alternative: केवल ‘किसी व्यक्ति’ कहना।
  rationale: मूल पाठ दोनों का स्पष्ट उल्लेख करता है, इसलिए अनुवाद में यह भेद सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज और गरिमापूर्ण रखी गई है। ‘हृदय’ और ‘यकृत’ वास्तविक शारीरिक अंगों के सटीक नाम हैं। मूल के दो आत्मिक पदों को ‘दुष्टात्मा’ और ‘बुरी आत्मा’ के रूप में अलग रखा गया है।
