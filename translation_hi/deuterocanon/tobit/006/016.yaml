base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/016.yaml
  text: But the angel said to him[a], “Do you not remember the words that your father commanded you about taking a wife from your own kin? And now listen to me, brother, because she will be your wife, and pay no attention to the demon, for tonight she will be given to you as a wife.”
translation:
  language: hi
  text: लेकिन स्वर्गदूत ने उससे कहा, “क्या तुम्हें वे आज्ञाएँ याद नहीं हैं जो तुम्हारे पिता ने तुम्हें अपने ही कुल में से पत्नी लेने के विषय में दी थीं? अब मेरी सुनो, भाई, क्योंकि वह तुम्हारी पत्नी होगी। उस दुष्टात्मा पर ध्यान मत दो[a], क्योंकि आज रात वह तुम्हें पत्नी के रूप में दे दी जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस दुष्टात्मा की कोई चिंता न करो।” यूनानी मुहावरा शाब्दिक रूप से कहता है, “दुष्टात्मा के संबंध में कोई बात न रखो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέμνησαι
  choice: क्या तुम्हें ... याद नहीं
  rationale: यूनानी पूर्णकालीन रूप यहाँ वर्तमान अर्थ रखता है; यह हिंदी में स्वाभाविक स्मरणसूचक प्रश्न है।
- source_word: λόγων ὧν ἐνετείλατό σοι ὁ πατήρ σου
  choice: वे बातें ... जिनके विषय में तुम्हारे पिता ने तुम्हें आज्ञा दी थी
  rationale: λόγων के ‘बातें/वचन’ अर्थ और ἐνετείλατο की अधिकारपूर्ण आज्ञा—दोनों को बनाए रखता है। हिंदी वाक्य-विन्यास के लिए ‘जिनके विषय में’ जोड़ा गया है।
- source_word: ὑπὲρ τοῦ λαβεῖν σε γυναῖκα
  choice: कि तुम ... पत्नी लेना
  rationale: विवाह के स्रोत-समीप मुहावरे ‘पत्नी लेना’ को सुरक्षित रखता है; संदर्भ में अर्थ विवाह करना है।
- source_word: ἐκ τοῦ γένους σου
  choice: अपने ही कुल में से
  rationale: γένος यहाँ वंश अथवा नातेदारी-समूह को सूचित करता है। ‘कुल’ पारिवारिक-वंशगत अर्थ रखता है, बिना जाति या गोत्र को अनावश्यक रूप से निर्दिष्ट किए।
- source_word: ἄκουσόν μου
  choice: मेरी सुनो
  rationale: यह आधुनिक हिंदी में ध्यान से सुनने और बात मानने के आग्रह का स्वाभाविक रूप है, जबकि ‘मानो’ कहकर आशय को अधिक निश्चित नहीं करता।
- source_word: ἀδελφέ
  choice: भाई
  rationale: प्रत्यक्ष संबोधन का शाब्दिक और स्वाभाविक रूप, जो मूल की आत्मीयता बनाए रखता है।
- source_word: σοὶ ἔσται εἰς γυναῖκα
  choice: वही तुम्हारी पत्नी होगी
  rationale: यूनानी वैवाहिक मुहावरे को सहज हिंदी में व्यक्त करता है। स्त्रीलिंग सर्वनाम संदर्भित सारा की ओर संकेत करता है।
- source_word: τοῦ δαιμονίου μηδένα λόγον ἔχε
  choice: उस दुष्टात्मा की कोई चिंता न करो
  rationale: शाब्दिक मुहावरा ‘उस दुष्टात्मा का कोई लेखा/बात न रखो’ हिंदी में अस्वाभाविक है। ‘चिंता न करो’ संदर्भगत आशय देता है, जबकि वैकल्पिक अर्थ फुटनोट में रखा गया है।
- source_word: δαιμονίου
  choice: दुष्टात्मा
  rationale: आधुनिक मानक हिंदी में δαιμόνιον का स्पष्ट और सर्वबोध्य धार्मिक पद; इसे केवल सामान्य ‘आत्मा’ नहीं बनाया गया।
- source_word: τὴν νύκτα ταύτην
  choice: आज रात
  rationale: ‘इस रात’ का स्वाभाविक समकालीन हिंदी रूप।
- source_word: δοθήσεταί σοι αὕτη εἰς γυναῖκα
  choice: वह तुम्हें पत्नी के रूप में दे दी जाएगी
  rationale: मूल के भविष्यत् कर्मवाच्य और औपचारिक वैवाहिक अभिव्यक्ति दोनों को सुरक्षित रखता है; देने वाले को मूल की तरह अनिर्दिष्ट छोड़ा गया है।
theological_decisions:
- issue: विवाह और कुलगत दायित्व की भाषा
  choice: ‘पत्नी लेना’, ‘अपने ही कुल में से’, ‘तुम्हारी पत्नी’ और ‘पत्नी के रूप में दे दी जाएगी’
  alternative: सभी स्थानों पर केवल ‘विवाह करना’ और ‘रिश्तेदार’ जैसी सामान्यीकृत भाषा
  rationale: मूल में पत्नी और कुल की भाषा बार-बार आती है तथा अंतिम क्रिया कर्मवाच्य है। इसे बनाए रखने से उस सामाजिक-पारिवारिक ढाँचे को न तो नरम किया जाता है, न उस पर अतिरिक्त अनुमोदन या आलोचना थोपी जाती है।
- issue: अलौकिक संकट का नाम
  choice: दुष्टात्मा
  alternative: दुष्ट शक्ति; प्रेत; दानव
  rationale: δαιμόνιον एक व्यक्तिगत दुष्ट अलौकिक सत्ता को दर्शाता है। ‘दुष्टात्मा’ हिंदी में स्पष्ट और सामान्य है तथा अर्थ को अस्पष्ट शक्ति में नहीं बदलता।
- issue: दुष्टात्मा के प्रति निर्देश में निहित अस्पष्टता
  choice: मुख्य पाठ में ‘कोई चिंता न करो’, और वैकल्पिक अर्थ फुटनोट में
  alternative: ‘उस पर कोई ध्यान न दो’
  rationale: μηδένα λόγον ἔχε का यूनानी मुहावरा चिंता, विचार या ध्यान न देने की ओर जा सकता है। प्रसंग में भय/चिंता उपयुक्त है, पर वास्तविक अर्थ-व्याप्ति को फुटनोट में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भाई’, ‘अपने ही कुल’ और ‘पत्नी के रूप में दे दी जाएगी’ मूल के संबोधन, नातेदारी और कर्मवाच्य वैवाहिक ढाँचे को बनाए रखते हैं। मुख्य पाठ का [a] चिह्न संबंधित फुटनोट से स्पष्ट रूप से जुड़ा है।
