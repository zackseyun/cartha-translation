base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/006.yaml
  text: And the young man did as the angel told him. Then they roasted the fish and ate it[a], and both of them traveled on until they came near Ecbatana.
translation:
  language: hi
  text: और उस युवक ने वैसा ही किया जैसा स्वर्गदूत ने उससे कहा था। फिर उन्होंने मछली भूनकर खाई, और वे दोनों यात्रा करते रहे, यहाँ तक कि वे एकबतना के निकट पहुँच गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ का अर्थ है कि वे एकबतना के निकट पहुँचे; इससे यह आवश्यक रूप से नहीं निकलता कि वे नगर में पहुँच चुके थे।
    reason: यूनानी ἤγγισαν नगर की ओर पास आने या उसके निकट पहुँचने को व्यक्त करता है, पूर्ण आगमन को नहीं।
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: उस युवक
  rationale: यद्यपि παιδάριον का अर्थ ‘बालक’ भी हो सकता है, इस प्रसंग में तोबियास विवाह योग्य यात्री है; इसलिए ‘युवक’ स्वाभाविक है और उसकी युवावस्था भी बनाए रखता है।
- source_word: ἐποίησεν
  choice: ने वैसा ही किया
  rationale: यह सरल और स्वाभाविक रूप से बताता है कि युवक ने स्वर्गदूत की कही बात के अनुसार काम किया।
- source_word: ὡς εἶπεν αὐτῷ ὁ ἄγγελος
  choice: जैसा स्वर्गदूत ने उससे कहा था
  rationale: यह εἶπεν की सामान्य वाणी को सुरक्षित रखता है और उसे अनावश्यक रूप से औपचारिक आज्ञा नहीं बनाता।
- source_word: τὸν δὲ ἰχθὺν ὀπτήσαντες ἔφαγον
  choice: फिर उन्होंने मछली भूनकर खाई
  rationale: कृदंत और मुख्य क्रिया को आधुनिक हिन्दी में स्वाभाविक क्रम से व्यक्त किया गया है; ὀπτάω आग पर भूनने का अर्थ देता है।
- source_word: ὥδευον
  choice: यात्रा करते रहे
  rationale: अपूर्ण भूतकाल यात्रा की जारी अवस्था को दर्शाता है, जिसे ‘करते रहे’ स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀμφότεροι
  choice: वे दोनों
  rationale: यह स्पष्ट रखता है कि युवक और स्वर्गदूत दोनों साथ आगे बढ़े।
- source_word: ἕως ἤγγισαν
  choice: तब तक … जब तक … निकट पहुँच न गए
  rationale: यह अवधि की सीमा और ἤγγισαν के ‘पास आने’ के अर्थ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν Ἐκβατάνοις
  choice: एकबतना के निकट
  rationale: स्थान-नाम को हिन्दी में लिप्यंतरित किया गया है। क्रिया ἤγγισαν के साथ समग्र अर्थ नगर के पास पहुँचने का है, नगर के भीतर पूर्ण आगमन का नहीं।
