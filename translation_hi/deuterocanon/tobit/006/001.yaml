translation:
  language: hi
  text: और वह रोना बंद कर गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ अपनाया गया यूनानी पाठ बहुत संक्षिप्त है: “और वह रोना बंद कर गई।” इस पद की एक लंबी, सामी-संबद्ध परंपरा यात्रा के वृत्तांत को आगे बढ़ाती है (“वह युवक अपने मार्ग पर चला गया ...”), लेकिन वे शब्द यहाँ अनूदित मुख्य यूनानी पाठ में नहीं हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह संयोजक इस छोटे वाक्य को पिछले प्रसंग से सीधे जोड़ता है। ‘और’ यूनानी की सरल कथात्मक कड़ी को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπαύσατο
  choice: बंद कर दिया
  rationale: παύω के एओरिस्ट मध्य रूप का अर्थ यहाँ जारी क्रिया का रुक जाना है। ‘बंद कर दिया’ आधुनिक हिन्दी में सहज है और क्रिया की समाप्ति स्पष्ट करता है।
- source_word: κλαίουσα
  choice: रोना
  rationale: κλαίω का वर्तमान कृदंत जारी रोने की क्रिया बताता है। हिन्दी में ‘रोना बंद कर दिया’ इस कृदंत-रचना का स्वाभाविक और गरिमापूर्ण रूप है।
