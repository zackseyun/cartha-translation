base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/018.yaml
  text: Then the demon will smell it and flee[a], and it will never return forever. But when you go in to her, rise, both of you, and cry out to the merciful God, and he will save you and have mercy on you. Do not fear, because she had been prepared for you from eternity, and you will save her, and she will go with you, and I suppose that you will have children by her. And when Tobias heard these things, he kissed her[d][c][b], and his soul was bound to her very strongly.
translation:
  language: hi
  text: तब वह दुष्टात्मा उसकी गंध सूँघकर भाग जाएगी और फिर कभी नहीं लौटेगी। पर जब तुम उसके पास जाओ,[a] तब तुम दोनों उठकर दयालु परमेश्वर को पुकारना; वह तुम्हें बचाएगा और तुम पर दया करेगा। मत डर, क्योंकि वह अनादिकाल से तुम्हारे लिए तैयार की गई थी,[b] और तुम उसे बचाओगे। वह तुम्हारे साथ जाएगी, और मेरा मानना है कि उससे तुम्हारे बच्चे होंगे। जब तोबियास ने ये बातें सुनीं, तो उसने उसे चूमा, और उसका मन उससे बहुत गहराई से जुड़ गया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “उसके पास जाना” वैवाहिक संबंध का शिष्ट मुहावरा है।
    reason: cultural_note
  - marker: b
    text: “अनादिकाल से” का अनुवाद “बहुत पहले से” या “प्राचीनकाल से” भी हो सकता है; यूनानी पदबंध दूरस्थ प्राचीनता के साथ अनन्त समय-क्षितिज भी व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “उसकी आत्मा उससे बहुत दृढ़ता से जुड़ गई”; यह गहरे लगाव का सजीव मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσφρανθήσεται τὸ δαιμόνιον
  choice: वह दुष्टात्मा उसकी गंध सूँघकर
  rationale: क्रिया के ठोस अर्थ ‘सूँघना’ को बनाए रखा गया है। δαιμόνιον के लिए सहज और प्रचलित हिन्दी ‘दुष्टात्मा’ चुना गया है।
- source_word: οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος
  choice: फिर कभी नहीं लौटेगी
  rationale: यूनानी का बलयुक्त मुहावरा स्थायी रूप से न लौटने को व्यक्त करता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: προσπορεύῃ αὐτῇ
  choice: उसके पास पति के रूप में जाओ
  rationale: विवाह-शय्या के संदर्भ को अशिष्टता के बिना स्पष्ट करता है और केवल सामान्य निकटता समझे जाने से बचाता है।
- source_word: βοήσατε πρὸς τὸν ἐλεήμονα θεόν
  choice: दयालु परमेश्वर को पुकारना
  rationale: βοάω की आग्रहपूर्ण पुकार और ἐλεήμων की दयालुता दोनों सुरक्षित हैं।
- source_word: σώσει ὑμᾶς καὶ ἐλεήσει
  choice: वह तुम्हें बचाएगा और तुम पर दया करेगा
  rationale: दोनों यूनानी क्रियाओं को अलग-अलग और पारदर्शी रूप में रखा गया है।
- source_word: ἡτοίμασμένη ἦν ἀπὸ τοῦ αἰῶνος
  choice: अनादिकाल से तुम्हारे लिए तैयार की गई थी
  rationale: ἀπὸ τοῦ αἰῶνος की प्राचीन अथवा शाश्वत समय-सीमा को ‘अनादिकाल’ व्यक्त करता है, जबकि टिप्पणी वास्तविक अर्थ-विकल्प सुरक्षित रखती है।
- source_word: σὺ αὐτὴν σώσεις
  choice: तुम उसे बचाओगे
  rationale: σῴζω को पिछले वाक्य के अनुरूप ‘बचाना’ रखा गया है; संदर्भ दुष्टात्मा के घातक संकट से छुटकारे का है।
- source_word: ὑπολαμβάνω
  choice: मेरा मानना है
  rationale: वक्ता के अनुमान अथवा अपेक्षा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना उसे पूर्ण भविष्यवाणी बना देने के।
- source_word: ἐξ αὐτῆς παιδία
  choice: उससे तुम्हारी संतान होगी
  rationale: वैवाहिक मिलन से उत्पन्न बच्चों का अर्थ सम्मानपूर्ण और स्वाभाविक हिन्दी में दिया गया है।
- source_word: ἡ ψυχὴ αὐτοῦ ἐκολλήθη αὐτῇ σφόδρα
  choice: उसका मन उससे बहुत गहराई से जुड़ गया
  rationale: शाब्दिक ‘उसकी आत्मा उससे चिपक गई’ के तीव्र भावनात्मक लगाव को स्वाभाविक हिन्दी मुहावरे में रखा गया है।
theological_decisions:
- issue: ἀπὸ τοῦ αἰῶνος में समय की सीमा
  choice: अनादिकाल से
  alternative: बहुत पहले से / प्राचीनकाल से
  rationale: पदबंध दूरस्थ प्राचीनता अथवा अनन्त क्षितिज दोनों व्यक्त कर सकता है। मुख्य पाठ में प्रबल अर्थ रखा गया है और पाद-टिप्पणी में वास्तविक अस्पष्टता बताई गई है।
- issue: ‘तुम उसे बचाओगे’ का आशय
  choice: दुष्टात्मा के घातक संकट से कथानकगत छुटकारा
  alternative: सामान्य संरक्षण अथवा व्यापक आध्यात्मिक उद्धार
  rationale: निकट संदर्भ दुष्टात्मा के भागने और सारा के जीवन की रक्षा का है; पाठ में ‘बचाओगे’ रखा गया है, पर बाद की धर्मसैद्धान्तिक श्रेणियाँ आरोपित नहीं की गईं।
- issue: राफाएल के कथन ὑπολαμβάνω की निश्चितता
  choice: मेरा मानना है
  alternative: मुझे विश्वास है / मैं जानता हूँ
  rationale: यूनानी क्रिया अनुमान या अपेक्षा दर्शाती है; इसे अचूक दैवी घोषणा के रूप में अधिक निश्चित नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली। तोबियास के लिए एकवचन निकट संबोधन ‘तुम’ रखा गया है। दुष्टात्मा को हिन्दी व्याकरण के अनुसार स्त्रीलिंग सर्वनाम दिया गया है। मुख्य पाठ में अनावश्यक शाब्दिक कठोरता से बचते हुए यूनानी की पुनरावृत्ति, कथानकगत उद्धार और कालगत अस्पष्टता को सुरक्षित रखा गया है।
