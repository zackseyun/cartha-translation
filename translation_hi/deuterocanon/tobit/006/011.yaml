  yaml_path: translation/deuterocanon/tobit/006/011.yaml
  text: The angel said to the young man, “Brother, today we will lodge with Raguel. He is your relative, and he has a daughter named Sarah.”
translation:
  language: hi
  text: स्वर्गदूत ने उस जवान से कहा, “भाई, आज हम रगुएल के यहाँ रात बिताएँगे। वह तुम्हारा रिश्तेदार है, और उसकी एक बेटी है, जिसका नाम सारा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδαρίῳ
  choice: जवान
  rationale: संदर्भ में तोबियास यात्रा और विवाह की आयु का है; ‘जवान’ उसकी युवावस्था को स्वाभाविक हिन्दी में व्यक्त करता है और उसे छोटा बालक नहीं ठहराता।
- source_word: Ἀδελφέ
  choice: भाई
  rationale: यह सीधे संबोधन का आत्मीय, पारिवारिक शब्द है; ‘भाई’ यूनानी संबोधन का रूप और भाव दोनों बनाए रखता है।
- source_word: σήμερον
  choice: आज
  rationale: समयवाचक क्रियाविशेषण का सीधा और स्वाभाविक आधुनिक हिन्दी समतुल्य।
- source_word: αὐλισθησόμεθα
  choice: रात बिताएँगे
  rationale: क्रिया यात्रा के दौरान रात के लिए ठहरने का बोध देती है। यह रूप घर के भीतर या बाहर रहने का अनावश्यक निर्धारण नहीं करता।
- source_word: παρὰ Ῥαγουήλῳ
  choice: रगुएल के यहाँ
  rationale: यहाँ παρά के साथ चतुर्थी किसी व्यक्ति के घर या संग ठहरने का संकेत देती है; ‘के यहाँ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: συγγενής
  choice: रिश्तेदार
  rationale: यह सामान्य रक्त-संबंध को व्यक्त करता है और यूनानी में न दिए गए किसी अधिक विशिष्ट रिश्ते को नहीं जोड़ता।
- source_word: θυγάτηρ
  choice: बेटी
  rationale: मूल पारिवारिक पद का सीधा आधुनिक हिन्दी रूप।
- source_word: ὄνομα Σάρρα
  choice: जिसका नाम सारा है
  rationale: यूनानी नामकरण-वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी रूप।
