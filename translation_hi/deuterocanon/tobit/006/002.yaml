lexical_decisions:
- source_word: πορευόμενοι τὴν ὁδὸν
  choice: मार्ग पर चलते हुए
  rationale: यह यूनानी पदबंध जारी यात्रा को दर्शाता है। यह हिन्दी अभिव्यक्ति उसके अपूर्णतासूचक भाव और यात्रा के ठोस संदर्भ, दोनों को स्वाभाविक ढंग से बनाए रखती है।
- source_word: ἦλθον ἑσπέρας
  choice: शाम तक ... पहुँचे
  rationale: यह पदबंध पहुँचने का समय बताता है। ‘शाम तक पहुँचे’ सहज हिन्दी है और यह अर्थ सुरक्षित रखता है कि नदी तक पहुँचते-पहुँचते शाम हो गई थी।
- source_word: ἐπὶ τὸν Τίγριν ποταμόν
  choice: दजला नदी के पास
  rationale: गति के साथ ἐπί यहाँ नदी तक पहुँचने को व्यक्त करता है। हिन्दी में नदी के तटवर्ती स्थान पर पहुँचने के लिए ‘नदी के पास’ स्वाभाविक है। Τίγρις के लिए हिन्दी में प्रचलित नाम ‘दजला’ चुना गया है।
- source_word: ηὐλίζοντο
  choice: रात बिताने के लिए ठहर गए
  rationale: क्रिया यात्रा के दौरान रात के लिए डेरा डालने या ठहरने का भाव देती है। यह अनुवाद केवल औपचारिक आवास का संकेत दिए बिना रात्रि-विश्राम का आशय स्पष्ट करता है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: स्थानवाचक क्रियाविशेषण को ‘वहीं’ कहना पिछले उल्लिखित नदी-स्थल से उसका संबंध स्वाभाविक और स्पष्ट बनाता है।
