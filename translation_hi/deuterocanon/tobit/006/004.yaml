translation:
  language: hi
  text: लेकिन स्वर्गदूत ने उससे कहा, “मछली को पकड़ लो।” तब लड़के ने मछली को पकड़ लिया और उसे उछालकर ज़मीन पर फेंक दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιλαβοῦ τοῦ ἰχθύος
  choice: मछली को पकड़ लो
  rationale: ἐπιλαμβάνομαι का अर्थ किसी वस्तु को पकड़ लेना या थाम लेना है; यह सहज आधुनिक हिन्दी में आदेश की तात्कालिकता बनाए रखता है।
- source_word: τὸ παιδάριον
  choice: उस लड़के ने
  rationale: पद का अर्थ लड़का या बालक है; आधुनिक कथात्मक हिन्दी में ‘उस लड़के ने’ स्वाभाविक है।
- source_word: ἀνέβαλεν αὐτὸν ἐπὶ τὴν γῆν
  choice: उसे खींचकर किनारे पर चढ़ा लिया
  rationale: क्रिया में ऊपर अथवा बाहर भूमि पर ले आने का भाव है। नदी के प्रसंग में ‘किनारे पर चढ़ा लिया’ गन्तव्य स्पष्ट करता है, जबकि ‘खींचकर’ मछली को पानी से निकालने की क्रिया को सहज हिन्दी में व्यक्त करता है।
