base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/007.yaml
  text: And the young man said to the angel[a], “Azariah, brother, what are the liver and the heart and the gall of the fish for?”
translation:
  language: hi
  text: और उस युवक ने स्वर्गदूत से कहा, “अजर्याह भाई, मछली का यकृत, हृदय और पित्त[a] किस काम आते हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मछली का पित्त-द्रव।’ यूनानी χολή का अनुवाद ‘पित्त’ या ‘पित्त-द्रव’ किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: उस युवक
  rationale: यह शब्द बालक या युवा सेवक के लिए आ सकता है; कथा में तोबियास यात्रा और स्वतंत्र कार्य करने योग्य है, इसलिए ‘युवक’ उसकी आयु को बचकाना बनाए बिना व्यक्त करता है।
- source_word: τῷ ἀγγέλῳ
  choice: स्वर्गदूत से
  rationale: ἄγγελος का अर्थ ‘संदेशवाहक’ भी हो सकता है, पर इस कथा में साथी एक स्वर्गदूत है और यहाँ यूनानी पाठ उसे इसी रूप में पहचानता है।
- source_word: Ἀζαρία
  choice: अजर्याह
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: संबोधन का शाब्दिक अर्थ ‘भाई’ है। यहाँ यह आत्मीय या आदरपूर्ण संबोधन है; मूल की सामाजिक ध्वनि बनाए रखने के लिए इसे ‘मित्र’ नहीं किया गया।
- source_word: τί ἐστιν
  choice: किस काम आते हैं?
  rationale: शाब्दिक रूप ‘क्या हैं?’ है, किंतु प्रसंग में प्रश्न मछली के इन अंगों के प्रयोजन या उपयोग के बारे में है; हिन्दी में यह स्वाभाविक रूप उसी आशय को व्यक्त करता है।
- source_word: τὸ ἧπαρ
  choice: यकृत
  rationale: यह अंग का सटीक और मानक आधुनिक हिन्दी नाम है।
- source_word: ἡ καρδία
  choice: हृदय
  rationale: यहाँ शारीरिक अंग के लिए मानक हिन्दी शब्द चुना गया है।
- source_word: ἡ χολή
  choice: पित्त
  rationale: χολή का अर्थ पित्त अथवा कड़वा पित्त-द्रव हो सकता है। ‘पित्त’ आधुनिक हिन्दी में संक्षिप्त और शारीरिक संदर्भ में स्पष्ट है।
- source_word: τοῦ ἰχθύος
  choice: मछली का
  rationale: सम्बन्धकारक रूप स्पष्ट करता है कि ये अंग मछली के हैं।
theological_decisions:
- issue: स्वर्गदूतीय साथी के लिए ἀδελφέ का संबोधन
  choice: सीधे संबोधन में ‘भाई’ रखा गया
  alternative: ‘मित्र’ कहना या संबोधन छोड़ देना
  rationale: यह पद स्वर्गदूत और मनुष्य की शाब्दिक रिश्तेदारी का धर्मवैज्ञानिक दावा नहीं करता, बल्कि सामान्य आत्मीय संबोधन दिखाता है। फिर भी मूल शब्द की पारदर्शिता और निहित तनाव बनाए रखने के लिए ‘भाई’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यकृत’ और ‘हृदय’ शारीरिक अंगों के सटीक मानक नाम हैं; प्रश्नवाचक वाक्य हिन्दी में प्रयोजन पूछने के स्वाभाविक ढंग से रखा गया है।
