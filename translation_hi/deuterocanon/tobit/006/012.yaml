base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/012.yaml
  text: I will speak about her[a], so that she may be given to you as a wife, because her inheritance falls to you, and you alone are from her family[b]; and the young woman is beautiful and sensible.
translation:
  language: hi
  text: मैं उसके विषय में बात करूँगा, ताकि उसे तुम्हें पत्नी के रूप में दिया जाए, क्योंकि उसकी विरासत तुम्हें मिलती है[a], और उसके कुल के केवल तुम ही हो[b]; और वह युवती सुन्दर और समझदार है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी विरासत पर तुम्हारा अधिकार है” अथवा “उसकी विरासत का अधिकार तुम्हें मिलता है।” यूनानी में निकट संबंध से जुड़ा वैधानिक दावा या दायित्व व्यक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या, “केवल तुम ही उसके संबंधी हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλήσω περὶ αὐτῆς
  choice: मैं उसके विषय में बात करूँगा
  rationale: περὶ के साथ यह पदबंध उसके विषय में बात करने को व्यक्त करता है; प्रसंग में उसकी ओर से प्रस्ताव रखने का भाव निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट रूप से जोड़ना उचित नहीं।
- source_word: τοῦ δοθῆναί σοι αὐτὴν εἰς γυναῖκα
  choice: ताकि वह तुम्हें पत्नी के रूप में दी जाए
  rationale: τοῦ के साथ क्रियार्थक संज्ञा यहाँ उद्देश्य व्यक्त करती है; कर्मवाच्य रूप और विवाह का अर्थ दोनों सुरक्षित रखे गए हैं।
- source_word: σοὶ ἐπιβάλλει ἡ κληρονομία αὐτῆς
  choice: उसकी विरासत पर तुम्हारा अधिकार है
  rationale: ἐπιβάλλει यहाँ निकट संबंध के कारण उत्पन्न वैधानिक दावे या अधिकार का बोध कराता है। यह स्वाभाविक हिन्दी में कानूनी-सामाजिक आशय रखता है, बिना यह कहे कि विरासत पहले से उसके स्वामित्व में है।
- source_word: σὺ μόνος εἶ ἐκ τοῦ γένους αὐτῆς
  choice: उसके कुल में से केवल तुम ही हो
  rationale: ἐκ की दिशात्मकता और γένος के कुल/वंश-संबंधी अर्थ को बनाए रखा गया है। 'कुल' विवाह और विरासत के इस प्रसंग में 'परिवार' से अधिक सटीक है।
- source_word: τὸ κοράσιον
  choice: वह युवती
  rationale: विवाह योग्य स्त्री के प्रसंग में 'युवती' आधुनिक और सम्मानजनक है तथा 'लड़की' से उत्पन्न बाल्यावस्था का अनचाहा संकेत टालता है।
- source_word: καλὸν
  choice: सुन्दर
  rationale: भावी वधू के वर्णन में καλός शारीरिक सुन्दरता को व्यक्त करता है।
- source_word: φρόνιμόν
  choice: समझदार
  rationale: φρόνιμος व्यावहारिक बुद्धि और अच्छे विवेक का अर्थ देता है; 'समझदार' आधुनिक सामान्य हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: निकट संबंध, विवाह और विरासत के बीच वैधानिक संबंध
  choice: क्योंकि उसकी विरासत पर तुम्हारा अधिकार है, और उसके कुल में से केवल तुम ही हो
  alternative: क्योंकि उसकी विरासत तुम्हें मिलती है, और केवल तुम ही उसके संबंधी हो
  rationale: पाठ प्रस्तावित विवाह को कुल-संबंध और विरासत के अधिकार से जोड़ता है। चुना हुआ रूप इस कानूनी-सामाजिक तर्क को सुरक्षित रखता है, पर रीति की ऐसी विस्तृत व्याख्या नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। विरासत और कुल-संबंध की कानूनी छाया बनाए रखी गई है; वाक्य को अनावश्यक रूप से प्राचीन या व्याख्यात्मक नहीं बनाया गया।
