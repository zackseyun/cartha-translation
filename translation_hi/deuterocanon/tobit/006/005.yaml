base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/005.yaml
  text: And the angel said to him, “Cut open the fish, and after taking the heart and the liver and the gall, put them away safely.”
translation:
  language: hi
  text: और स्वर्गदूत ने उससे कहा, “मछली को चीरकर खोलो, और उसका हृदय, कलेजा और पित्त[a] निकालकर सुरक्षित रख लो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “पित्त” या “कड़वा पित्त-द्रव” हो सकता है; यह आवश्यक रूप से पित्ताशय को नहीं दर्शाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάτεμε
  choice: चीरकर खोलो
  rationale: क्रिया मछली को काटकर खोलने का निर्देश देती है, ताकि उसके अंग निकाले जा सकें। ‘चीरकर खोलो’ आधुनिक हिन्दी में ठोस और स्वाभाविक है।
- source_word: τὸν ἰχθύν
  choice: मछली को
  rationale: सप्रसंग निश्चित मछली के लिए सीधा और स्वाभाविक हिन्दी रूप।
- source_word: λαβὼν
  choice: निकालकर
  rationale: पूर्वकालिक कृदन्त मुख्य आज्ञा से पहले अंगों को लेने/निकालने की क्रिया बताता है। शरीर के अंगों के संदर्भ में ‘निकालकर’ हिन्दी में अधिक स्वाभाविक है।
- source_word: τὴν καρδίαν
  choice: उसका हृदय
  rationale: मानक शारीरिक अर्थ; ‘उसका’ स्पष्ट करता है कि अंग मछली के हैं।
- source_word: τὸ ἧπαρ
  choice: कलेजा
  rationale: ἧπαρ का अर्थ यकृत है; कथा के सामान्य, शारीरिक संदर्भ में ‘कलेजा’ साधारण पाठकों के लिए स्वाभाविक और सुबोध है।
- source_word: τὴν χολὴν
  choice: पित्त
  rationale: χολή का मूल अर्थ पित्त अथवा कड़वा पित्त-द्रव है। ‘पित्त’ सटीक आधुनिक हिन्दी है; यूनानी शब्द स्वयं पित्ताशय को निश्चित नहीं करता।
- source_word: θὲς ἀσφαλῶς
  choice: सुरक्षित रख लो
  rationale: यह संयोजन अंगों को आगे के उपयोग के लिए संभालकर रखने का निर्देश देता है। ‘सुरक्षित रख लो’ अर्थ और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
theological_decisions:
- issue: ὁ ἄγγελος की पहचान
  choice: स्वर्गदूत
  alternative: दूत
  rationale: यद्यपि ἄγγελος सामान्यतः ‘दूत’ भी हो सकता है, तोबीत की कथा में यह पात्र अलौकिक स्वर्गदूत है। ‘स्वर्गदूत’ कथा के अभिप्रेत अर्थ को बिना अतिरिक्त सिद्धान्त जोड़े स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कृदन्त और मुख्य आज्ञा का क्रम ‘निकालकर सुरक्षित रख लो’ से स्वाभाविक हिन्दी में व्यक्त हुआ है।
