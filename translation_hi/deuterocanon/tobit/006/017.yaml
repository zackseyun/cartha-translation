  text: And when you enter into the bridal chamber[a], take some of the incense ashes and place on them some of the fish’s heart and liver, and make smoke with them[b],
translation:
  language: hi
  text: और जब तुम विवाह-कक्ष में प्रवेश करो, तो धूप की राख[a] लो, और उस पर मछली के हृदय और कलेजे में से कुछ रखकर उससे धुआँ उत्पन्न करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘सुगंधित द्रव्यों की राख।’
    reason: lexical_alternative
  - marker: b
    text: अर्थात राख पर मछली के हृदय और कलेजे में से कुछ रखकर उससे धुआँ उत्पन्न करो; यूनानी क्रिया केवल ‘जलाने’ से अधिक विशिष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νυμφῶνα
  choice: विवाह-कक्ष
  rationale: यह विवाह-संबंधी उस निजी कक्ष को दर्शाता है जहाँ नवविवाहित दंपति जाते हैं। ‘विवाह-कक्ष’ आधुनिक हिन्दी में स्पष्ट है और मूल के वैवाहिक संदर्भ को बनाए रखता है।
- source_word: λήμψῃ
  choice: लो
  rationale: निर्देशों के इस क्रम में क्रिया का व्यावहारिक अर्थ किसी वस्तु को उपयोग के लिए लेना है।
- source_word: τέφραν θυμιαμάτων
  choice: धूप की राख
  rationale: τέφρα का अर्थ ‘राख’ और θυμιαμάτων का अर्थ धूप अथवा जलाए जाने वाले सुगंधित द्रव्य हैं। ‘धूप की राख’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: ἐπιθήσεις
  choice: उस पर ... रखो
  rationale: क्रिया किसी वस्तु को दूसरी वस्तु के ऊपर रखने का बोध कराती है। ‘उस पर’ का संकेत धूप की राख की ओर है।
- source_word: ἀπὸ τῆς καρδίας καὶ τοῦ ἥπατος τοῦ ἰχθύος
  choice: मछली के हृदय और कलेजे का कुछ अंश
  rationale: 'ἀπό यहाँ अंशसूचक है: पूरे अंग नहीं, बल्कि हृदय और कलेजे में से कुछ राख पर रखा जाना है। ‘कलेजा’ सामान्य आधुनिक हिन्दी में ‘यकृत’ से अधिक सहज है।'
- source_word: καπνίσεις
  choice: उससे धुआँ उठाओ
  rationale: यह क्रिया केवल जलाने के बजाय धुआँ उत्पन्न करने या धूनी देने की विशिष्ट क्रिया बताती है। यह अनुवाद उस भौतिक कार्य को रखता है, उसके परिणाम की व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: καπνίσεις द्वारा वर्णित अनुष्ठानिक अथवा औषधीय क्रिया
  choice: क्रिया को ठोस रूप में ‘धुआँ उठाओ’ कहना
  alternative: उन्हें बलि के रूप में जलाओ; कमरे में धूनी दो
  rationale: इस पद में यूनानी पाठ केवल धुआँ उत्पन्न करने की क्रिया बताता है। उसके प्रभाव को आगे के संदर्भ में समझाया गया है, इसलिए यहाँ भूत-निष्कासन या बलिदान का अर्थ जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। निर्देशात्मक भविष्यकाल को प्रसंगानुकूल आज्ञार्थक हिन्दी में प्रस्तुत किया गया है। ‘विवाह-कक्ष’ वैवाहिक परिवेश को सुरक्षित रखता है, जबकि ‘धुआँ उठाओ’ क्रिया की ठोस प्रकृति को बिना धार्मिक परिणाम जोड़े व्यक्त करता है।
