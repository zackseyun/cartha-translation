  yaml_path: translation/deuterocanon/tobit/006/013.yaml
  text: And now listen to me[a], and I will speak to her father; and when we return from Rages, we will arrange the marriage. For I know that Raguel will certainly not give her to another man contrary to the law of Moses, or he will incur death[b], because it is fitting for you to receive the inheritance rather than any other man.
translation:
  language: hi
  text: और अब मेरी बात सुनो, मैं उसके पिता से बात करूँगा; और जब हम रागेस से लौटेंगे, तब हम विवाह की व्यवस्था करेंगे। क्योंकि मैं जानता हूँ कि रागुएल मूसा की व्यवस्था का उल्लंघन करके उसे किसी दूसरे पुरुष को कदापि नहीं देगा; अन्यथा वह मृत्युदंड का भागी होगा। क्योंकि विरासत पाने का अधिकार किसी भी दूसरे पुरुष से पहले तुम्हारा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄκουσόν μου
  choice: मेरी बात सुनो
  rationale: आज्ञार्थक पद यहाँ ध्यान देकर मानने-सुनने का भाव रखता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λαλήσω τῷ πατρὶ αὐτῆς
  choice: मैं उसके पिता से बात करूँगा
  rationale: λαλέω के सामान्य अर्थ ‘बात करना/बोलना’ को बिना विषयवस्तु जोड़े सुरक्षित रखता है।
- source_word: ὅταν ὑποστρέψωμεν ἐκ Ῥάγων
  choice: जब हम रागेस से लौटेंगे
  rationale: ὅταν के साथ संभावित भाव वाले क्रियारूप का भविष्यकालिक समय-संबंध स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ποιήσωμεν τὸν γάμον
  choice: हम विवाह की व्यवस्था करेंगे
  rationale: शाब्दिक ‘विवाह करना/बनाना’ यूनानी मुहावरा है; प्रसंग में विवाह संपन्न कराने की तैयारी और व्यवस्था अभिप्रेत है।
- source_word: οὐ μὴ δῷ
  choice: कदापि नहीं देगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἀνδρὶ ἑτέρῳ
  choice: किसी दूसरे पुरुष को
  rationale: ἀνήρ का मूल अर्थ ‘पुरुष’ रखा गया है; विवाह का आशय प्रसंग से स्पष्ट है।
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: मूसा की व्यवस्था के विरुद्ध
  rationale: यद्यपि κατὰ सामान्यतः ‘के अनुसार’ है, निषेध और अगले मृत्यु-दायित्व वाले वाक्यांश के साथ आशय व्यवस्था का उल्लंघन करके किसी अन्य को देना है।
- source_word: ὀφειλέσει θάνατον
  choice: वह मृत्यु का दोषी होगा
  rationale: शाब्दिक ‘मृत्यु का ऋणी होगा’ दण्डनीयता का मुहावरा है; चुना हुआ रूप कानूनी दायित्व को सहज हिन्दी में देता है।
- source_word: τὴν κληρονομίαν σοὶ καθήκει λαβεῖν
  choice: विरासत पाने का अधिकार तुम्हारा है
  rationale: καθήκει में उचितता और देय अधिकार दोनों निहित हैं; प्रसंग में उत्तराधिकार पर प्राथमिक दावा प्रमुख है।
- source_word: ἢ πάντα ἄνθρωπον
  choice: किसी भी दूसरे पुरुष की अपेक्षा
  rationale: प्रेषित यूनानी शाब्दिक रूप से असहज है; तुलनात्मक आशय यह है कि तोबियास का दावा अन्य किसी पुरुष से पहले है।
theological_decisions:
- issue: मूसा की व्यवस्था के अधीन रागुएल के दायित्व की कानूनी शक्ति
  choice: रागुएल सारा को किसी दूसरे पुरुष को देकर व्यवस्था का उल्लंघन नहीं कर सकता; ऐसा करने पर वह मृत्यु का दोषी होगा।
  alternative: रागुएल मूसा की व्यवस्था के अनुसार उसे किसी दूसरे पुरुष को नहीं देगा।
  rationale: κατὰ का शाब्दिक ‘के अनुसार’ सम्भव है, पर निषेध के बाद आने वाला ‘मृत्यु का दोषी होगा’ स्पष्ट करता है कि यहाँ किसी दूसरे को देना व्यवस्था-विरुद्ध माना गया है।
- issue: विरासत पर तोबियास के दावे का स्वरूप
  choice: तोबियास को किसी अन्य पुरुष की अपेक्षा विरासत पाने का प्राथमिक अधिकार है।
  alternative: तोबियास के लिए विरासत लेना केवल उचित या शोभनीय है।
  rationale: καθήκει उचितता भी दर्शा सकता है, किंतु विवाह और निकट संबंधी के इस प्रसंग में तुलना प्राथमिक पात्रता या अधिकार की ओर संकेत करती है; इसे पूर्ण स्वामित्व से अधिक नहीं बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी नामों को ‘रागेस’ और ‘रागुएल’ रूप में रखा गया है। इस पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई; जहाँ यूनानी मुहावरा असहज है, अर्थ को मुख्य पाठ में स्पष्ट किया गया है।
