base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/015.yaml
  text: And now I am my father's only one[a], and I am afraid that if I go in, I will die, just as the former ones did, because a demon loves her, and it harms no one except those who approach her. And now I am afraid that I may die and bring down the life of my father and my mother in grief because of me to their grave[c][b]; and they have no other son who will bury them.
translation:
  language: hi
  text: और अब मैं अपने पिता का इकलौता बेटा हूँ। मुझे डर है कि यदि मैं उसके पास जाऊँ, तो पहले वालों की तरह मैं भी मर जाऊँगा, क्योंकि एक दुष्टात्मा उससे प्रेम करती है[a] और उसके पास जाने वालों के सिवा किसी को हानि नहीं पहुँचाती। अब मुझे डर है कि कहीं मैं मर न जाऊँ और मेरे कारण मेरे पिता और मेरी माता का जीवन शोक में उनकी कब्र तक न उतर जाए[b]। उनका कोई और बेटा भी नहीं है जो उन्हें दफनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से है, “एक दुष्टात्मा उससे प्रेम करती है”; यहाँ यह सारा के प्रति उसके घातक और अधिकारपूर्ण लगाव को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “जीवन ... कब्र तक उतर जाए” शोक के कारण मर जाने की सजीव अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: μόνος τῷ πατρί
  choice: अपने पिता का इकलौता बेटा
  rationale: μόνος का मूल भाव ‘अकेला/एकमात्र’ है; पिता के संबंध में और आगे ‘कोई और बेटा नहीं’ के स्पष्ट कथन के कारण हिन्दी में ‘इकलौता बेटा’ स्वाभाविक और संदर्भ-सटीक है।
- source_word: φοβοῦμαι μὴ εἰσελθὼν ἀποθάνω
  choice: मुझे डर है कि यदि मैं उसके पास जाऊँ ... मैं भी मर जाऊँगा
  rationale: εἰσελθών का शाब्दिक अर्थ ‘भीतर जाना’ है, पर यहाँ स्त्री के पास वैवाहिक रूप से जाने का संकेत है। हिन्दी में अनावश्यक रूप से अर्थ सीमित किए बिना भाव स्पष्ट किया गया है।
- source_word: οἱ πρότεροι
  choice: पहले वाले
  rationale: यह सारा के पिछले पतियों को संदर्भित करता है, पर यूनानी संक्षिप्त और कुछ हद तक अंतर्निहित है; ‘पहले वाले’ उसी अस्पष्टता को बनाए रखता है।
- source_word: δαιμόνιον
  choice: एक दुष्टात्मा
  rationale: यह कथानक में एक व्यक्तिगत, शत्रुतापूर्ण अलौकिक सत्ता है। आधुनिक हिन्दी में ‘दुष्टात्मा’ स्वाभाविक बाइबलीय पद है और इसे केवल सामान्य बुरे प्रभाव में नहीं बदलता।
- source_word: φιλεῖ αὐτήν
  choice: उससे प्रेम करती है
  rationale: φιλέω का सीधा अर्थ ‘प्रेम करना’ है। संदर्भ में लगाव घातक और अधिकारपूर्ण है, फिर भी अनुवाद मूल की असहज अभिव्यक्ति को नरम नहीं करता।
- source_word: ἀδικεῖ
  choice: हानि नहीं पहुँचाती
  rationale: संदर्भ में क्रिया का परिणाम शारीरिक विनाश है; ‘हानि पहुँचाना’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: τῶν προσαγόντων αὐτῇ
  choice: उसके पास जाने वालों
  rationale: वाक्यांश का भाव उसके निकट आने वालों का है, संदर्भतः विवाह के लिए; अनुवाद उस संदर्भ को रहने देता है पर उसे मुख्य पाठ में अत्यधिक स्पष्ट नहीं करता।
- source_word: κατάξω τὴν ζωὴν ... εἰς τὸν τάφον αὐτῶν
  choice: मेरे पिता और मेरी माता का जीवन शोक में उनकी कब्र तक न उतर जाए
  rationale: मूल की ‘जीवन को कब्र तक नीचे ले जाने’ वाली सजीव छवि सुरक्षित रखी गई है; हिन्दी वाक्य इसे मृत्यु के शोकपूर्ण परिणाम के रूप में समझने योग्य बनाता है।
- source_word: υἱὸς ἕτερος οὐχ ὑπάρχει αὐτοῖς ὃς θάψει αὐτούς
  choice: उनका कोई और बेटा भी नहीं है जो उन्हें दफनाए
  rationale: यह पुत्र के अंतिम संस्कार के कर्तव्य को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δαιμόνιον की प्रकृति
  choice: व्यक्तिगत दुष्टात्मा
  alternative: सामान्य अर्थ में कोई बुरी आत्मिक शक्ति
  rationale: यूनानी संज्ञा और तोबीत की कथा इसे इच्छाशक्ति और विशिष्ट कार्य वाली व्यक्तिगत आत्मिक सत्ता के रूप में प्रस्तुत करते हैं।
- issue: φιλεῖ αὐτήν में दुष्टात्मा का सारा से संबंध
  choice: ‘उससे प्रेम करती है’ की प्रत्यक्ष भाषा बनाए रखना
  alternative: ‘उस पर अधिकार जमाए हुए है’ या ‘उससे आसक्त है’
  rationale: वैकल्पिक अभिव्यक्तियाँ प्रसंग का आशय समझाती हैं, पर φιλεῖ के वास्तविक शब्द को व्याख्यात्मक रूप से बदल देती हैं। मूल का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। मूल की पुनरुक्ति (‘अब मुझे डर है’) और असहज धर्मवैचारिक तनाव (‘दुष्टात्मा ... प्रेम करती है’) बनाए रखे गए हैं। ‘दफनाए’ सामान्य पाठक के लिए ‘गाड़े’ से अधिक स्वाभाविक और सम्मानपूर्ण है।
