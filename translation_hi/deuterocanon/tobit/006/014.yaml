  yaml_path: translation/deuterocanon/tobit/006/014.yaml
  text: Then the young man said to the angel[a], “Azariah, brother, I have heard that the girl has been given to seven men[b], and that all of them were hindered in the bridal chamber.”
translation:
  language: hi
  text: तब उस युवक ने स्वर्गदूत से कहा, “भाई अजर्याह, मैंने सुना है कि उस लड़की का विवाह सात पुरुषों के साथ किया जा चुका है[a], और उन सभी को विवाह-कक्ष में रोक दिया गया था[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सात पतियों के साथ।” यूनानी में शाब्दिक रूप से “सात पुरुषों” है, पर विवाह का प्रसंग अधिक विशिष्ट अर्थ की अनुमति देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक भाव है, “विवाह-कक्ष में उन सबको रोक दिया गया था।” प्रसंग से पता चलता है कि पहले के वर विवाह पूरा नहीं कर सके, क्योंकि वहीं उनकी मृत्यु हो गई थी।
    reason: contextual_clarification
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: उस जवान
  rationale: यद्यपि παιδάριον का अर्थ ‘बालक’ भी हो सकता है, यहाँ तोबियाह विवाह योग्य यात्री है; इसलिए ‘जवान’ प्रसंगानुकूल और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τῷ ἀγγέλῳ
  choice: स्वर्गदूत से
  rationale: तोबित के प्रसंग में यह पात्र स्वर्गीय दूत है, इसलिए ἄγγελος के लिए ‘स्वर्गदूत’ स्पष्ट और उपयुक्त है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: प्रत्यक्ष संबोधन को बनाए रखा गया है; यहाँ यह आत्मीय संबोधन हो सकता है, अनिवार्यतः सगा संबंध नहीं।
- source_word: ἀκήκοα
  choice: मैंने सुना है
  rationale: यूनानी पूर्णकाल सुनने के वर्तमान परिणाम को व्यक्त करता है; ‘मैंने सुना है’ उस भाव को सुरक्षित रखता है।
- source_word: τὸ κοράσιον
  choice: उस लड़की
  rationale: ‘लड़की’ आधुनिक, सहज हिन्दी है और κοράσιον के आयु तथा सामाजिक भाव को बिना पुरातन शब्दावली के व्यक्त करता है।
- source_word: δεδόσθαι ἑπτὰ ἀνδράσιν
  choice: सात पुरुषों को दिया जा चुका है
  rationale: ‘दिया जाना’ यूनानी क्रिया के निकट रहता है, जबकि विवाह का आशय प्रसंग से स्पष्ट होता है; ‘पुरुषों’ ἀνδράσιν की वास्तविक शाब्दिक अस्पष्टता बनाए रखता है।
- source_word: ἐν τῷ νυμφῶνι
  choice: विवाह-कक्ष में
  rationale: νυμφών विवाह या दुल्हन-दूल्हे के कक्ष को दर्शाता है; ‘विवाह-कक्ष’ स्पष्ट, संक्षिप्त और गरिमापूर्ण है।
- source_word: ἀποκωλῦσαι
  choice: रोक दिया गया था
  rationale: क्रिया का मूल भाव रोकने या बाधा डालने का है। हिन्दी का कर्मवाच्य संक्षिप्त यूनानी वाक्य को सुबोध बनाता है, पर मृत्यु को मुख्य पाठ में स्पष्ट करके नहीं जोड़ता।
theological_decisions:
- issue: सारा के पिछले वरों की नियति को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘रोक दिया गया था’
  alternative: ‘मार डाला गया था’ अथवा ‘वे मर गए थे’
  rationale: इस पद में यूनानी क्रिया सीधे हत्या या मृत्यु नहीं, बल्कि रोकने की बात कहती है। व्यापक कथा उनकी मृत्यु बताती है, पर उसे यहाँ मुख्य पाठ में जोड़ना इस संक्षिप्त कथन की अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘भाई अजर्याह’ मूल के सीधे संबोधन को बनाए रखता है। मुख्य पाठ में यूनानी की संक्षिप्तता और अस्पष्टता सुरक्षित है; कथा से मिलने वाली अतिरिक्त स्पष्टता केवल पादटिप्पणी में दी गई है।
