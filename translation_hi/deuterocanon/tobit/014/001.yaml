  choice: धन्यवाद देना
  alternative: अंगीकार करना
  rationale: यह पद टोबीत के पिछले आशीर्वाद और स्तुतिपरक कथन का समापन करता है, इसलिए धन्यवाद का अर्थ संदर्भानुकूल है। फिर भी यूनानी शब्द की पश्चात्ताप-संबंधी सम्भावना को पादटिप्पणी में बनाए रखा गया है।
