lexical_decisions:
- source_word: ἐπαύσατο
  choice: समाप्त किया
  rationale: παύω के एओरिस्ट मध्य रूप का यहाँ अर्थ किसी चल रही क्रिया का अंत होना है। ‘समाप्त किया’ इस संक्षिप्त समापन-वाक्य में स्वाभाविक है और केवल अस्थायी रूप से रुकने का संकेत नहीं देता।
- source_word: ἐξομολογούμενος
  choice: धन्यवाद देना
  rationale: यह कृदंत अंगीकार करने और धन्यवाद अथवा स्तुति करने—दोनों अर्थों में आ सकता है। निकटवर्ती उपासना और आशीर्वाद के संदर्भ में ‘धन्यवाद देना’ मुख्य अर्थ के रूप में उपयुक्त है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: Τωβείτ
  choice: टोबीत
  rationale: यूनानी व्यक्तिगत नाम का आधुनिक हिन्दी में स्पष्ट और प्रचलित लिप्यंतरण।
