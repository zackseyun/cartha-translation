base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/003.yaml
  text: He had grown very old[a]; and he called his son and his grandsons, and said to him, “Child, take your sons. Look, I have grown old[b], and I am about to depart from life.”
translation:
  language: hi
  text: वह बहुत बूढ़ा हो गया था। उसने अपने बेटे और पोतों[a] को बुलाया और अपने बेटे से कहा, “बेटे, अपने बेटों को ले लो। देखो, मैं बूढ़ा हो गया हूँ और जीवन से विदा होने ही वाला हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “अपने बेटे और अपने बेटों”; संदर्भ में दूसरा पद उसके बेटे के बेटों, अर्थात उसके पोतों, के लिए समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अधिक शाब्दिक अर्थ है, “मैं जीने से दूर चले जाने की ओर हूँ”; यह मृत्यु के निकट होने का एक मुहावरेदार ढंग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλως δὲ ἐγήρασεν
  choice: वह बहुत बूढ़ा हो गया था
  rationale: μεγάλως यहाँ वृद्ध होने की अवस्था को तीव्र करता है। ‘बहुत बूढ़ा हो गया था’ सहज हिन्दी में पूर्ण हो चुकी उन्नत आयु को व्यक्त करता है; δέ के लिए अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: τὸν υἱὸν αὐτοῦ καὶ τοὺς υἱοὺς αὐτοῦ
  choice: अपने बेटे और पोतों
  rationale: दूसरा ‘उसके बेटे’ निकटवर्ती बेटे के पुत्रों को सूचित करता है, अर्थात वक्ता के पोते। मुख्य पाठ में ‘पोतों’ से सम्बन्ध स्वाभाविक और स्पष्ट होता है, जबकि पादटिप्पणी यूनानी की शाब्दिक संरचना बताती है।
- source_word: Τέκνον
  choice: बेटे
  rationale: τέκνον स्नेहपूर्ण पारिवारिक सम्बोधन है। प्रसंग में सम्बोधित व्यक्ति उसका पुत्र है, इसलिए आधुनिक हिन्दी में ‘बेटे’ स्वाभाविक रूप से अर्थ और आत्मीयता दोनों रखता है।
- source_word: λάβε τοὺς υἱούς σου
  choice: अपने बेटों को ले लो
  rationale: λάβε का सीधा आज्ञार्थ ‘ले लो’ है। ‘इकट्ठा करो’ या गन्तव्य सम्बन्धी कोई अतिरिक्त बात जोड़ने के बजाय स्रोत की संक्षिप्तता रखी गई है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ वर्तमान हिन्दी में गंभीर किन्तु अनार्किक रूप है।
- source_word: γεγήρακα
  choice: मैं बूढ़ा हो गया हूँ
  rationale: पूर्णकालिक रूप वृद्ध होने के परिणामस्वरूप वर्तमान अवस्था पर बल देता है; यह हिन्दी रचना उस परिणामी अवस्था को बनाए रखती है।
- source_word: πρὸς τὸ ἀποτρέχειν ἐκ τοῦ ζῇν εἰμί
  choice: जीवन से विदा होने ही वाला हूँ
  rationale: यूनानी का असामान्य मुहावरा शाब्दिक रूप से जीने से दूर चले जाने की निकटता व्यक्त करता है। ‘विदा होने ही वाला हूँ’ आसन्न मृत्यु और मूल की शिष्टोक्ति दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: आसन्न मृत्यु के लिए शिष्टोक्तिपूर्ण अभिव्यक्ति
  choice: जीवन से विदा होने ही वाला हूँ
  alternative: मैं मरने ही वाला हूँ
  rationale: स्रोत सीधे ‘मरना’ नहीं कहता, बल्कि जीवन से चले जाने का कोमल और कुछ असामान्य मुहावरा प्रयोग करता है। चुना हुआ पाठ मृत्यु का आशय स्पष्ट रखते हुए उस स्वर को नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज और गरिमापूर्ण रखी गई है। ‘बेटे’ पारिवारिक आत्मीयता व्यक्त करता है; ‘जीवन से विदा होना’ मूल की शिष्टोक्ति को बनाए रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] सम्बद्ध पदों पर दिए गए हैं।
