- source_word: ἀπέθανεν
  choice: मर गया
  rationale: यूनानी क्रिया मृत्यु को सीधे व्यक्त करती है; ‘मर गया’ सहज और स्पष्ट हिन्दी है तथा अनावश्यक शिष्टोक्ति से बचती है।
- source_word: ἐτῶν ἑκατὸν ἑπτὰ
  choice: एक सौ सात वर्ष की आयु में
  rationale: यह संबंधकारक पदबंध मृत्यु के समय उसकी आयु बताता है; चुना हुआ रूप आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐν Ἐκβατάνοις
  choice: एकबतना नगर में
  rationale: ἐν स्थान के भीतर होने को सूचित करता है। ‘नगर’ जोड़ने से अपरिचित स्थान-नाम हिन्दी पाठक के लिए स्पष्ट होता है, बिना अर्थ बदले।
- source_word: τῆς Μηδείας
  choice: मादै प्रदेश के
  rationale: संबंधकारक एकबतना की भौगोलिक पहचान बताता है। हिन्दी में ‘मादै प्रदेश के एकबतना’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
