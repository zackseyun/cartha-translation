  yaml_path: translation/deuterocanon/tobit/014/008.yaml
  text: And now[a], child, depart from Nineveh, because what the prophet Jonah spoke will surely happen.
translation:
  language: hi
  text: और अब, मेरे बच्चे[a], नीनवे से निकल जा, क्योंकि भविष्यद्वक्ता योना ने जो कुछ कहा था, वह अवश्य घटित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरे बेटे’; यूनानी शब्द τέκνον संतान के लिए स्नेहपूर्ण संबोधन है और प्रसंग के अनुसार दोनों प्रकार से अनूदित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνον
  choice: मेरे बच्चे
  rationale: यह संतान के लिए स्नेहपूर्ण संबोधन है। ‘मेरे बच्चे’ यूनानी शब्द की लिंग-अनिश्चितता बनाए रखता है और हिन्दी में अभिभावकीय संबोधन को स्वाभाविक बनाता है।
- source_word: ἄπελθε ἀπὸ Νινευή
  choice: नीनवे से निकल जा
  rationale: आज्ञार्थक क्रिया और ἀπό मिलकर नगर से अलग होकर चले जाने का निर्देश देते हैं। यह हिन्दी में सीधा और स्वाभाविक है।
- source_word: πάντως
  choice: अवश्य
  rationale: यह भविष्यवाणी के घटित होने की प्रबल निश्चितता व्यक्त करता है।
- source_word: ἔσται
  choice: घटित होगा
  rationale: शाब्दिक अर्थ ‘होगा’ है, पर भविष्यवाणी के प्रसंग में ‘घटित होगा’ अपेक्षित घटना के साकार होने को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἃ ἐλάλησεν
  choice: जो कुछ कहा था
  rationale: यह योना के भविष्यसूचक कथन की विषयवस्तु को समेटता है; हिन्दी में ‘जो कुछ कहा था’ सहज है और मूल के आशय के निकट रहता है।
- source_word: ὁ προφήτης Ἰωνᾶς
  choice: भविष्यद्वक्ता योना
  rationale: यह उपाधि और नाम को मूल क्रम के अनुरूप, प्रचलित बाइबिलीय हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: नीनवे के विषय में भविष्यवाणी की निश्चितता
  choice: ‘वह अवश्य घटित होगा’ के रूप में प्रबल निश्चितता बनाए रखी गई है।
  alternative: ‘वह निश्चित रूप से पूरा होगा’
  rationale: मूल पाठ भविष्यवाणी के परिणाम, समय या रीति की व्याख्या किए बिना उसके घटित होने पर बल देता है। ‘घटित होगा’ उसी तनाव को सुरक्षित रखता है और ‘पूरा होगा’ से आने वाली अतिरिक्त व्याख्यात्मक छाया से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेरे बच्चे’ में स्नेहपूर्ण पारिवारिक संबोधन है, जबकि ‘अवश्य घटित होगा’ भविष्यसूचक कथन की गंभीरता और निश्चितता बनाए रखता है।
