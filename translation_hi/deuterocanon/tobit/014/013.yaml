  text: And he grew old honorably[a], and he buried his parents-in-law with honor, and he inherited their property and that of Tobit his father.
translation:
  language: hi
  text: और वह सम्मानपूर्वक वृद्ध हुआ, और उसने अपने सास-ससुर को आदरपूर्वक दफ़नाया, और उनकी संपत्ति तथा अपने पिता तोबीत की संपत्ति विरासत में पाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγήρασεν
  choice: वृद्ध हुआ
  rationale: यह यूनानी क्रिया वृद्धावस्था तक पहुँचने या बूढ़ा होने की प्रक्रिया बताती है; ‘वृद्ध हुआ’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐντίμως
  choice: सम्मान के साथ
  rationale: यह आदरपूर्ण अथवा प्रतिष्ठित रीति से वृद्ध होने का भाव व्यक्त करता है और अगले क्रियाविशेषण से शब्दगत भेद बनाए रखता है।
- source_word: ἔθαψεν
  choice: दफ़नाया
  rationale: क्रिया का सीधा अर्थ दफ़नाना है; इसे अनावश्यक रूप से शिष्टोक्तिपूर्ण नहीं बनाया गया।
- source_word: τοὺς πενθεροὺς αὐτοῦ
  choice: अपने सास-ससुर को
  rationale: बहुवचन πενθερούς यहाँ पत्नी के माता-पिता को सूचित करता है; आधुनिक हिन्दी में ‘सास-ससुर’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: ἐνδόξως
  choice: प्रतिष्ठापूर्वक
  rationale: शब्द का अर्थ गौरवपूर्ण, भव्य या सम्मानजनक रीति से हो सकता है; अंत्येष्टि के संदर्भ में ‘प्रतिष्ठापूर्वक’ सम्मानजनक ढंग का भाव देता है, जबकि संभावित भव्यता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐκληρονόμησεν
  choice: उत्तराधिकारी हुआ
  rationale: यह विरासत में प्राप्त करने को दर्शाता है; ‘संपत्ति का उत्तराधिकारी हुआ’ हिन्दी में स्पष्ट और औपचारिक रूप से स्वाभाविक है।
- source_word: τὴν οὐσίαν αὐτῶν
  choice: उनकी संपत्ति
  rationale: οὐσία यहाँ धन-संपत्ति या जायदाद को दर्शाता है; ‘संपत्ति’ व्यापक और सहज हिन्दी पद है।
- source_word: καὶ Τωβεὶτ τοῦ πατρὸς αὐτοῦ
  choice: तथा अपने पिता तोबीत की संपत्ति
  rationale: यूनानी में दूसरी विरासत पिता तोबीत की संपत्ति है; हिन्दी में संज्ञा दोहराने से संबंध अस्पष्ट नहीं रहता।
