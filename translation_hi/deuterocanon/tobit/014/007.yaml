base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/007.yaml
  text: And all the nations will bless the Lord[a]. And his people will give thanks to God, and the Lord will exalt his people; and all who love the Lord God in truth and righteousness will rejoice[c][b], showing mercy to our brothers.
translation:
  language: hi
  text: और सभी राष्ट्र प्रभु को धन्य कहेंगे। उसकी प्रजा परमेश्वर का धन्यवाद करेगी, और प्रभु अपनी प्रजा को ऊँचा उठाएगा। और वे सभी जो सत्य और धार्मिकता[a] में प्रभु परमेश्वर से प्रेम करते हैं, हमारे भाइयों[b] पर दया दिखाते हुए आनन्दित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धार्मिकता’ का अनुवाद ‘न्याय’ भी हो सकता है; यहाँ संभवतः आशय भक्ति और आचरण की खराई से है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘हमारे भाई’; यह पद अपने परिजनों या समुदाय के सदस्यों के लिए व्यापक, प्रतिनिधिक अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσουσιν
  choice: धन्य कहेंगी
  rationale: क्रिया का सीधा अर्थ आशीष देना अथवा किसी को धन्य कहना है। यहाँ जातियाँ प्रभु को संबोधित करती हैं, इसलिए ‘धन्य कहेंगी’ स्वाभाविक हिन्दी में मूल क्रिया का भक्तिपरक भाव बनाए रखता है।
- source_word: πάντα τὰ ἔθνη
  choice: सभी जातियाँ
  rationale: ἔθνη का प्राथमिक अर्थ राष्ट्रों अथवा जातियों से है। ‘सभी जातियाँ’ सार्वभौमिक दायरे को बनाए रखता है और अनावश्यक रूप से केवल गैर-यहूदियों तक अर्थ सीमित नहीं करता।
- source_word: ἐξομολογήσεται
  choice: धन्यवाद करेगी
  rationale: बाइबलीय यूनानी में यह क्रिया स्वीकार करने, धन्यवाद देने या स्तुति करने का अर्थ रख सकती है। परमेश्वर के प्रति आराधनापूर्ण प्रतिक्रिया के इस संदर्भ में ‘धन्यवाद करेगी’ सबसे स्वाभाविक है।
- source_word: ὑψώσει
  choice: ऊँचा उठाएगा
  rationale: यह चयन ऊँचा करने के मूल रूपक और सम्मानित करने के भाव, दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐν ἀληθείᾳ καὶ δικαιοσύνῃ
  choice: सत्य और धार्मिकता में
  rationale: वाक्यांश परमेश्वर से प्रेम करने की रीति अथवा क्षेत्र बताता है। ‘धार्मिकता’ नैतिक खराई का भाव रखता है, जबकि ‘न्याय’ भी संभव है।
- source_word: ποιοῦντες ἔλεος
  choice: दया करते हुए
  rationale: शाब्दिक ‘दया करना’ से आशय दयापूर्ण व्यवहार करना है; हिन्दी में ‘दया करते हुए’ स्वाभाविक और स्रोत के निकट है।
- source_word: τοῖς ἀδελφοῖς ἡμῶν
  choice: हमारे भाइयों पर
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘भाइयों’ है। मुख्य पाठ उसी रूप को बनाए रखता है, जबकि पादटिप्पणी उसके संभावित प्रतिनिधिक सामुदायिक अर्थ को बताती है।
theological_decisions:
- issue: Κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: ‘प्रभु’ κύριος का स्थापित और संदर्भानुकूल हिन्दी रूप है; स्रोत-पाठ में यहाँ ईश्वरीय नाम अलग से नहीं लिखा गया।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ शब्द न्यायिक निष्पक्षता से अधिक परमेश्वर-भक्ति और आचरण की खराई को सूचित करता प्रतीत होता है; फिर भी ‘न्याय’ की संभावना पादटिप्पणी में सुरक्षित है।
- issue: ἀδελφοῖς का लिंग और दायरा
  choice: भाइयों
  alternative: भाइयों और बहनों / अपने समुदाय के लोगों
  rationale: मूल का व्याकरणिक पुल्लिंग रूप सुरक्षित रखा गया है, पर इसका प्रयोग व्यापक परिजन या समुदाय के लिए प्रतिनिधिक हो सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। समन्वित वाक्य-रचना मूल यूनानी के घोषणात्मक और भविष्यसूचक प्रवाह को बनाए रखती है।
