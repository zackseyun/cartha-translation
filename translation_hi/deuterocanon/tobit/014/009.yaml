base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/009.yaml
  text: But you, keep the law and the commandments, and become merciful and righteous, so that it may go well with you.
translation:
  language: hi
  text: पर तुम व्यवस्था और आज्ञाओं का पालन करना, और दयालु तथा धर्मी बनना, ताकि तुम्हारा भला हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τήρησον
  choice: पालन करना
  rationale: आज्ञार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और व्यवस्था तथा आज्ञाओं को मानते रहने का आशय रखता है।
- source_word: τὸν νόμον καὶ τὰ προστάγματα
  choice: व्यवस्था और आज्ञाओं
  rationale: νόμος के लिए प्रचलित बाइबलीय शब्द ‘व्यवस्था’ और προστάγματα के लिए सहज ‘आज्ञाएँ’ चुना गया है; दोनों पदों का भेद बनाए रखा गया है।
- source_word: γενοῦ
  choice: बनना
  rationale: ग्रीक में केवल ‘होना’ नहीं, बल्कि ‘बनना’ है; इसलिए परिवर्तन या विकसित होने की सूक्ष्मता सुरक्षित रखी गई है।
- source_word: φιλελεήμων
  choice: दयालु
  rationale: दया से प्रेम रखने और दया करने वाले स्वभाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: नैतिक और धार्मिक न्यायपरायणता के अर्थ को बाइबलीय हिन्दी में संक्षेप से व्यक्त करता है।
- source_word: ἵνα σοι καλῶς ἦν
  choice: ताकि तुम्हारा भला हो
  rationale: उद्देश्य/परिणाम के भाव और संबोधित व्यक्ति के कल्याण—‘तुम्हारे लिए अच्छा हो’—को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: आज्ञापालन और कल्याण का संबंध
  choice: ‘ताकि तुम्हारा भला हो’ के रूप में उद्देश्य/परिणाम का संबंध यथावत रखा गया है।
  alternative: इसे निश्चित प्रतिफल, उद्धार का आधार, या केवल सामान्य बुद्धि की सलाह के रूप में स्पष्ट करना।
  rationale: ἵνα-वाक्य का संबंध सुरक्षित रखा गया है, पर पाठ से आगे बढ़कर किसी विशिष्ट कर्म-सिद्धांत या उद्धारशास्त्रीय निष्कर्ष को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन एकवचन और आत्मीय है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘पर तुम’ से पूर्व कथन के साथ विरोध या विशेष बल का संकेत संरक्षित है।
