base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/012.yaml
  text: And when Hanna died[a], he buried her with his father. Then Tobias went away with his wife and his sons to Ecbatana, to Raguel his father-in-law.
translation:
  language: hi
  text: और जब हन्ना मर गई, तो उसने[a] उसे अपने पिता के साथ दफना दिया। इसके बाद तोबियास अपनी पत्नी और अपने बेटों के साथ एकबतना में अपने ससुर रगुएल के पास चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में इस वाक्यांश का शाब्दिक रूप है, “उसने उसे अपने पिता के साथ दफना दिया।” यहाँ दफनाने वाले का नाम नहीं दिया गया है; अगले वाक्यांश में यूनानी पाठ स्पष्ट रूप से तोबियास का नाम लेता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέθανεν
  choice: मर गई
  rationale: ἀποθνῄσκω मृत्यु को सीधे व्यक्त करता है; स्त्रीलिंग कर्ता हन्ना के अनुसार ‘मर गई’ सरल और स्वाभाविक है।
- source_word: ἔθαψεν
  choice: दफना दिया
  rationale: θάπτω का सीधा अर्थ दफनाना है; यह कथात्मक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: μετὰ τοῦ πατρὸς αὐτοῦ
  choice: अपने पिता के साथ
  rationale: μετά + संबंधकारक का मूल अर्थ ‘के साथ’ है। दफन के स्थान या ढंग को अधिक स्पष्ट किए बिना यूनानी की व्यापकता सुरक्षित रखी गई है; ‘अपने’ αὐτοῦ को क्रिया के निहित कर्ता से जोड़ता है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: ἀπέρχομαι यहाँ एक स्थान से दूसरे स्थान की ओर प्रस्थान को दर्शाता है; ‘चला गया’ आधुनिक हिन्दी में सहज है।
- source_word: γυναικὸς
  choice: पत्नी
  rationale: पारिवारिक और संबंधसूचक प्रसंग में γυνή का अर्थ स्पष्ट रूप से ‘पत्नी’ है।
- source_word: υἱῶν
  choice: बेटों
  rationale: υἱοί विशेष रूप से पुत्रों को सूचित करता है; इसे सामान्य ‘बच्चों’ में नहीं बदला गया।
- source_word: Ἐκβάτανα
  choice: एकबतना
  rationale: यूनानी स्थान-नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ
  choice: अपने ससुर रगुएल के पास
  rationale: व्यक्तिवाचक कर्म के साथ πρός यहाँ किसी व्यक्ति के पास जाने को दर्शाता है, और πενθερός का स्वाभाविक हिन्दी समतुल्य ‘ससुर’ है।
theological_decisions:
- issue: दफनाने वाली क्रिया का अनकहा कर्ता
  choice: पहली क्रिया में ‘उसने’ रखा गया और अगली क्रिया में यूनानी के अनुसार ‘टोबियास’ नाम स्पष्ट किया गया।
  alternative: पहली क्रिया के कर्ता को भी सीधे ‘टोबियास’ कहना।
  rationale: ἔθαψεν का कर्ता यूनानी में व्यक्त नहीं है, जबकि अगली उपवाक्य में Τωβίας स्पष्ट रूप से आता है। सर्वनाम और पादटिप्पणी मूल पाठ की अस्पष्टता को बिना सामंजस्य बैठाए सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘अपने पिता के साथ’ मूल यूनानी की स्थान-संबंधी व्यापकता बनाए रखता है और ‘ससुर … के पास’ हिन्दी में स्वाभाविक गंतव्य-प्रयोग है।
