  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘तुम लोग’ यूनानी बहुवचन आदेश को दिखाता है, जबकि ‘हे बच्चे’ व्यक्तिगत संबोधन को। ‘प्रतिफल’ की पुनरावृत्ति मूल के न्यायपूर्ण प्रत्युत्तर वाले शब्द-खेल को बनाए रखती है।
