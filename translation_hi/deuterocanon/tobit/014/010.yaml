base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/010.yaml
  text: And bury me properly[a], and your mother with me, and do not stay any longer in Nineveh. Child, see what Nadab did to Ahikar, who had reared him—how he brought him from the light into the darkness, and all that he repaid him. But Ahikar was saved, while that man received the repayment, and he himself went down into the darkness. Manasseh did acts of mercy, and he was saved from the deadly snare that Nadab had set for him[b]; but Nadab fell into the trap and perished.
translation:
  language: hi
  text: और मुझे ठीक से दफनाना, और तुम्हारी माता को मेरे साथ दफनाना; फिर तुम लोग नीनवे में और मत रहना। बेटे, देखो कि आदम[a] ने अहीकार के साथ क्या किया, जिसने उसका पालन-पोषण किया था—कैसे वह उसे उजाले से अँधेरे में ले गया और उसे जो कुछ बदले में दिया। पर अहीकार बच गया, जबकि आदम को उसका प्रतिफल मिला, और वह स्वयं अँधेरे में उतर गया। मनश्शे ने दया के काम किए[b] और वह मृत्यु के उस फंदे से बच गया जो आदम ने उसके लिए बिछाया था; पर आदम उसी फंदे में गिरा और नाश हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ में नाम ‘आदम’ है। यह आदि पुरुष आदम नहीं, बल्कि अहीकार की कथा का विश्वासघाती दरबारी है, जिसे कथा के अन्य रूपों में ‘नादाब’ या ‘नादान’ कहा गया है।
    reason: नाम की पहचान और पाठ-परंपरा का अंतर स्पष्ट करना।
  - marker: b
    text: या, ‘दान किया’; तोबीत में यूनानी शब्द ἐλεημοσύνη प्रायः जरूरतमंदों को दान देने के अर्थ में प्रयुक्त होता है।
    reason: अधिक विशिष्ट शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: θάψον με καλῶς
  choice: मुझे ठीक रीति से दफनाना
  rationale: θάπτω का सीधा अर्थ ‘दफनाना’ है। ‘ठीक रीति से’ καλῶς के अनुरूप उचित और भली प्रकार किए गए दफन को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना किसी विशेष धार्मिक संस्कार को जोड़े।
- source_word: μηκέτι αὐλισθῆτε εἰς Νινευή
  choice: फिर तुम लोग नीनवे में मत रहना
  rationale: बहुवचन क्रिया को ‘तुम लोग’ से सुरक्षित रखा गया है। αὐλίζομαι यहाँ केवल रात बिताने के बजाय किसी स्थान में ठहरे या बसे रहने का व्यापक अर्थ देता है।
- source_word: τέκνον
  choice: हे बच्चे
  rationale: यह स्नेहपूर्ण संबोधन है। ‘बेटे’ प्रसंगानुकूल हो सकता है, पर यूनानी संज्ञा स्वयं लिंग को उतनी स्पष्टता से निर्दिष्ट नहीं करती; इसलिए ‘बच्चे’ मूल रूप की व्यापकता बनाए रखता है।
- source_word: Ἀδὰμ
  choice: अदाम
  rationale: प्रदत्त यूनानी पाठ में यही व्यक्तिगत नाम है। अहीकार परंपरा के दूसरे रूपों के आधार पर इसे मुख्य पाठ में ‘नादाब’ कर देना मूल पाठ से मौन विचलन होता; पहचान-संबंधी सूचना पाद-टिप्पणी में दी गई है।
- source_word: Ἀχιαχάρῳ
  choice: अहीकार
  rationale: यह अहीकार कथा के प्रसिद्ध पात्र के नाम का हिन्दी में पठनीय और पहचाने जाने योग्य रूप है।
- source_word: τῷ θρέψαντι αὐτόν
  choice: अपने पालन-पोषण करनेवाले
  rationale: τρέφω यहाँ केवल भोजन देने के बजाय किसी को पालकर बड़ा करने का भाव रखता है। संबंधवाचक पदबंध को स्वाभाविक हिन्दी विशेषण-पदबंध में बदला गया है।
- source_word: ἐκ τοῦ φωτὸς ... εἰς τὸ σκότος
  choice: उजाले से अँधेरे में
  rationale: मूल के सजीव रूपक और उसके विरोध को सीधे तथा स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: ἀνταπέδωκεν / ἀνταπόδομα ἀπεδόθη
  choice: प्रतिफल दिया / प्रतिफल मिला
  rationale: दोनों स्थानों पर एक ही शब्द-परिवार रखकर यूनानी ἀνταποδ- की पुनरावृत्ति सुरक्षित की गई है। दूसरे प्रयोग में ‘उसके कर्मों का’ जोड़ हिन्दी में दंडात्मक प्रत्युत्तर का प्रसंग स्पष्ट करता है।
- source_word: ἔσωσεν / ἐσώθη
  choice: बच गया
  rationale: इस कथा-प्रसंग में σῴζω मृत्यु और षड्यंत्र से व्यावहारिक बचाव बताता है। ‘बच गया’ हिन्दी में वही अर्थ स्वाभाविक रूप से देता है और अनावश्यक रूप से पारलौकिक उद्धार का अर्थ आरोपित नहीं करता।
- source_word: ἐλεημοσύνην
  choice: दया के काम
  rationale: ἐλεημοσύνη दयापूर्ण परोपकार को दर्शाता है और तोबीत में प्रायः दान देने का विशिष्ट भाव भी रखता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और अधिक विशिष्ट विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: παγίδος θανάτου
  choice: मृत्यु के फंदे
  rationale: यह शाब्दिक चित्र और घातक परिणाम दोनों सुरक्षित रखता है; हिन्दी में ‘फंदा बिछाना’ भी स्वाभाविक मुहावरा है।
theological_decisions:
- issue: σῴζω का अर्थ
  choice: मृत्यु के संकट से बच जाना
  alternative: आध्यात्मिक या अनन्त उद्धार
  rationale: निकटवर्ती कथा में अहीकार और मनश्शे षड्यंत्र तथा मृत्यु के फंदे से बचते हैं। अतः पद को कथात्मक बचाव के रूप में प्रस्तुत किया गया है, न कि विकसित पारलौकिक उद्धार-सिद्धांत के रूप में।
- issue: ἐλεημοσύνη का दायरा
  choice: दया के काम
  alternative: दान देना
  rationale: शब्द दान को विशेष रूप से सूचित कर सकता है, पर दयापूर्ण कर्म का व्यापक अर्थ भी रखता है। मुख्य पाठ व्यापकता बनाए रखता है और विशिष्ट अर्थ पाद-टिप्पणी में सुरक्षित है।
- issue: अदाम नाम की पहचान
  choice: प्रदत्त यूनानी पाठ के अनुसार ‘अदाम’
  alternative: अहीकार परंपरा के अनुसार ‘नादाब’ या ‘नादान’
  rationale: मूल-पाठ में Ἀδὰμ है। पात्र को आदि पुरुष आदम मानने की भ्रांति से बचाने और वैकल्पिक पारंपरिक पहचान बताने के लिए पाद-टिप्पणी दी गई है, पर मुख्य पाठ को मौन रूप से संशोधित नहीं किया गया।
