base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/015.yaml
  text: And before he died[a], he heard of the destruction of Nineveh, which Nebuchadnezzar and Ahasuerus had taken captive; before dying, he rejoiced over Nineveh. Amen.
translation:
  language: hi
  text: और मरने से पहले उसने नीनवे के विनाश का समाचार सुना—उस नीनवे का, जिसे नबूकदनेस्सर और अहश्वेरोश ने बंदी बना लिया था।[a] मरने से पहले वह नीनवे पर आनन्दित हुआ। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नीनवे के विषय में कहा गया है कि नबूकदनेस्सर और अहश्वेरोश ने उसे बंदी बना लिया था। नीनवे के पतन के संबंध में इन शासकों की ऐतिहासिक पहचान पर व्याख्याकारों में मतभेद है; यहाँ मूल पाठ के नाम सुरक्षित रखे गए हैं।
    reason: ऐतिहासिक पहचान से जुड़ी पाठगत कठिनाई को बिना सामंजस्य किए स्पष्ट करना।
lexical_decisions:
- source_word: ἤκουσεν
  choice: समाचार सुना
  rationale: यहाँ क्रिया किसी घटना की सूचना मिलने को व्यक्त करती है; ‘समाचार सुना’ आधुनिक हिन्दी में स्वाभाविक है और मूल ‘सुना’ के अर्थ को बनाए रखता है।
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: मरने से पहले
  rationale: यूनानी कालवाचक रचना का सीधा, स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: ἀπωλίαν
  choice: विनाश
  rationale: इस ऐतिहासिक प्रसंग में यह नीनवे के नाश या पतन को सूचित करता है; ‘विनाश’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: ᾐχμαλώτισεν
  choice: बंदी बना लिया था
  rationale: क्रिया का मूल भाव बंदी बनाने या बंधुआई में ले जाने का है। नगर को कर्म बनाना मूल पाठ की लाक्षणिक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: Ναβουχοδονοσὸρ
  choice: नबूकदनेस्सर
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Ἀσύηρος
  choice: अहश्वेरोश
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप, जो यूनानी पाठ में दिए शासक के नाम को बिना ऐतिहासिक सामंजस्य के प्रस्तुत करता है।
- source_word: ἐχάρη
  choice: आनन्दित हुआ
  rationale: यह मूल के आनन्द करने के भाव को सटीक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ Νινευή
  choice: नीनवे के विषय में
  rationale: ἐπί आनन्द के विषय अथवा अवसर को सूचित कर सकता है। यह रूप उस अस्पष्टता को बनाए रखता है और स्वयं से ‘उसके पतन पर’ नहीं जोड़ता।
- source_word: ἀμήν
  choice: आमीन
  rationale: यूनानी पाठ में उपस्थित समापन शब्द को उसके प्रचलित हिन्दी रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: नीनवे पर अधिकार करने वाले शासकों की ऐतिहासिक पहचान
  choice: मुख्य पाठ में ‘नबूकदनेस्सर और अहश्वेरोश’ को ज्यों का त्यों बनाए रखना
  alternative: बाहरी ऐतिहासिक पुनर्निर्माण के अनुसार नामों को बदलना या नीनवे के पतन से जुड़े अन्य शासकों के नाम देना
  rationale: अनुवाद को उपलब्ध यूनानी साक्ष्य प्रस्तुत करना चाहिए, न कि ऐतिहासिक कठिनाई को चुपचाप सुधारना या किसी अन्य परंपरा से उसका सामंजस्य करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उस नीनवे का’ संबंधवाचक वाक्य को स्पष्ट करता है, जबकि नगर को ‘बंदी’ बनाए जाने की मूल लाक्षणिक अभिव्यक्ति सुरक्षित है। ‘नीनवे के विषय में’ आनन्द के कारण या विषय को अनावश्यक रूप से निश्चित नहीं करता।
