  yaml_path: translation/deuterocanon/tobit/014/002.yaml
  text: And he was fifty-eight years old when he lost his sight[a], and after eight years he regained it; and he did acts of mercy[c][b], and he continued to fear God.
translation:
  language: hi
  text: जब उसकी दृष्टि चली गई, तब वह अट्ठावन वर्ष का था; और आठ वर्ष बाद उसे फिर दिखाई देने लगा। वह दया के काम करता रहा[a] और भय मानता रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दान देता रहा।” यूनानी शब्द विशेष रूप से दान देने अथवा अधिक व्यापक अर्थ में दया के काम करने को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में केवल “भय मानता रहा” है; भय का कर्म नहीं बताया गया। भक्तिपूर्ण प्रसंग में संभवतः परमेश्वर का भय अभिप्रेत है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ἦν ἐτῶν πεντήκοντα ὀκτὼ
  choice: वह अट्ठावन वर्ष का था
  rationale: यूनानी में आयु बताने का सामान्य मुहावरा है; यह उसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ἀπώλεσεν τὰς ὄψεις
  choice: उसकी दृष्टि चली गई
  rationale: शाब्दिक बहुवचन ‘दृष्टियाँ’ हिन्दी में अस्वाभाविक होगा। यह मुहावरा दृष्टि खोने को व्यक्त करता है।
- source_word: μετὰ ἔτη ὀκτὼ
  choice: आठ वर्ष बाद
  rationale: काल-संबंधी वाक्यांश का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: ἀνέβλεψεν
  choice: उसे फिर दिखाई देने लगा
  rationale: अंधेपन अथवा चंगाई के प्रसंग में क्रिया का अर्थ फिर से देख पाना या दृष्टि लौटना है। चुना हुआ रूप पूर्ववर्ती दृष्टि-हानि से स्पष्ट संबंध रखता है।
- source_word: ἐποίει ἐλεημοσύνας
  choice: वह दया के काम करता रहा
  rationale: ἐλεημοσύνας विशेष रूप से दान देने और अधिक व्यापक रूप से दया के कामों—दोनों का बोध करा सकता है। अपूर्ण भूतकाल ἐποίει की निरंतरता ‘करता रहा’ में व्यक्त है।
- source_word: προσεθέτο φοβεῖσθαι
  choice: भय मानता रहा
  rationale: निर्माण में जारी रखने अथवा और आगे बढ़कर करने का भाव है। उपलब्ध यूनानी पाठ में भय का कर्म नहीं दिया गया, इसलिए मुख्य पाठ में ‘परमेश्वर’ जोड़कर अस्पष्टता को समाप्त नहीं किया गया।
theological_decisions:
- issue: φοβεῖσθαι का अनकहा कर्म
  choice: मुख्य पाठ में ‘भय मानता रहा’; कर्म को अनकहा रखा गया
  alternative: ‘परमेश्वर का भय मानता रहा’
  rationale: भक्ति-संबंधी प्रसंग में परमेश्वर का भय अभिप्रेत होना अत्यंत संभव है, पर उपलब्ध यूनानी वाक्य में ‘परमेश्वर’ या ‘प्रभु’ स्पष्ट रूप से नहीं है। इसलिए स्रोत की वास्तविक अंतर्निहितता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य को हिन्दी की स्वाभाविक लय के अनुसार दो वाक्यों में रखा गया है। ‘दृष्टि चली गई’ और ‘फिर दिखाई देने लगा’ यूनानी दृष्टि-संबंधी मुहावरों को सामान्य पाठक के लिए स्पष्ट रखते हैं; वहीं अंतिम क्रिया का अनकहा कर्म जानबूझकर नहीं भरा गया है।
