base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/005.yaml
  text: And God will again have mercy on them and bring them back to the land[a], and they will build the house, though not like the former one, until the times of the age are fulfilled. And after these things they will return from the captivities and build Jerusalem honorably, and the house of God in her will be built gloriously[c][b], just as the prophets spoke concerning her.
translation:
  language: hi
  text: और परमेश्वर उन पर फिर दया करेगा और उन्हें उस देश में लौटा लाएगा। वे उस भवन को बनाएँगे, पर वह पहले वाला जैसा नहीं होगा, जब तक युग के समय पूरे न हो जाएँ।[a] इसके बाद वे बन्धुआई के स्थानों से लौटेंगे[b] और यरूशलेम को सम्मान के साथ बनाएँगे। उसमें परमेश्वर का भवन महिमा के साथ बनाया जाएगा,[c] ठीक वैसे ही जैसे भविष्यद्वक्ताओं ने उसके विषय में कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘युग के समय’ का वाक्यांश ठहराए हुए उन समयों की ओर संकेत कर सकता है जो परमेश्वर की अधिक पूर्ण पुनर्स्थापना तक पहुँचते हैं; यूनानी अभिव्यक्ति इसका ठीक स्वरूप खुला छोड़ती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘बन्धुआइयों’ बहुवचन में है; इससे बन्धुआई के अनेक स्थानों या प्रसंगों का संकेत मिल सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में यरूशलेम का उल्लेख स्त्रीलिंग रूपों में किया गया है—‘उसमें’ और ‘उसके विषय में’।
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν ἐλεήσει αὐτοὺς ὁ θεός
  choice: परमेश्वर उन पर फिर दया करेगा
  rationale: ‘फिर’ नवीकृत ईश्वरीय कार्य को और ‘दया करेगा’ ἐλεέω के धार्मिक तथा करुणामय भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιστρέψει αὐτοὺς εἰς τὴν γῆν
  choice: उन्हें उस देश में लौटा लाएगा
  rationale: सकर्मक प्रयोग वापसी कराने का भाव देता है। यूनानी में निजवाचक सर्वनाम नहीं है, इसलिए ‘उनके देश’ के बजाय ‘उस देश’ रखा गया है।
- source_word: οἰκοδομήσουσιν τὸν οἶκον
  choice: वे उस भवन को बनाएँगे
  rationale: ‘भवन’ οἶκος को बनाए रखता है और तुरन्त ‘मन्दिर’ कहकर आशय को आवश्यकता से अधिक स्पष्ट नहीं करता; आगे ‘परमेश्वर का भवन’ सन्दर्भ खोल देता है।
- source_word: οὐχ οἷος ὁ πρότερος
  choice: पर वह पहलेवाले जैसा नहीं होगा
  rationale: तुलना और भिन्नता दोनों सुरक्षित हैं; ‘पर’ हिन्दी में निहित विरोध को सहज बनाता है।
- source_word: ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος
  choice: जब तक युग के समय पूरे न हो जाएँ
  rationale: καιροί और αἰών दोनों को स्पष्ट व्याख्या में बदले बिना रखा गया है, ताकि वाक्यांश का कालगत और युगान्त-सूचक खुलापन बना रहे।
- source_word: ἐκ τῶν αἰχμαλωσιῶν
  choice: बन्धुआइयों से
  rationale: कुछ असामान्य होने पर भी बहुवचन मूल यूनानी के बहुवचन को सुरक्षित रखता है; यह अनेक स्थानों या प्रसंगों की बन्धुआई की सम्भावना खुली छोड़ता है।
- source_word: ἐντίμως
  choice: सम्मान के साथ
  rationale: यह सम्मानजनक और प्रतिष्ठित ढंग का भाव देता है, बिना इसे केवल स्थापत्य की भव्यता तक सीमित किए।
- source_word: ἐνδόξως
  choice: महिमा के साथ
  rationale: δόξα से जुड़े धार्मिक अनुनाद को बनाए रखता है और केवल ‘भव्य रूप से’ कहने की तुलना में स्रोत के निकट है।
- source_word: καθὼς ἐλάλησαν περὶ αὐτῆς οἱ προφῆται
  choice: ठीक वैसे ही जैसे भविष्यद्वक्ताओं ने उसके विषय में कहा था
  rationale: भविष्यद्वक्ताओं की स्पष्ट गवाही और यरूशलेम की ओर संकेत दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: καιροὶ τοῦ αἰῶνος का कालगत अर्थ
  choice: युग के समय
  alternative: ठहराए हुए समय / युगान्त तक के समय
  rationale: मूल वाक्यांश युगान्त-सूचक हो सकता है, पर किसी विशिष्ट अन्त-समय योजना को निश्चित नहीं करता; अपेक्षाकृत औपचारिक अनुवाद इस तनाव को खुला रखता है।
- issue: ‘भवन’ का अभिप्रेत अर्थ
  choice: भवन
  alternative: मन्दिर
  rationale: सन्दर्भ मन्दिर की ओर संकेत करता है, लेकिन पहली बार यूनानी केवल ‘भवन/घर’ कहता है। आगे ‘परमेश्वर का भवन’ अर्थ को स्पष्ट करता है।
- issue: यरूशलेम का स्त्रीलिंग व्यक्तिकरण
  choice: हिन्दी में स्वाभाविक ‘उसमें/उसके’ के साथ पादटिप्पणी
  alternative: ‘उस नगरी में’ जैसे विस्तार द्वारा स्त्रीलिंग को मुख्य पाठ में स्पष्ट करना
  rationale: यूनानी स्त्रीलिंग रूपों को हिन्दी में कृत्रिम ढंग से आरोपित किए बिना पादटिप्पणी में साहित्यिक विशेषता बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘बन्धुआइयों’ और ‘युग के समय’ जानबूझकर कुछ औपचारिक रखे गए हैं, क्योंकि वे मूल यूनानी के बहुवचन और अर्थगत खुलेपन को सुरक्षित रखते हैं। ‘सम्मान के साथ’ और ‘महिमा के साथ’ द्वारा ἐντίμως तथा ἐνδόξως का भेद बनाए रखा गया है।
