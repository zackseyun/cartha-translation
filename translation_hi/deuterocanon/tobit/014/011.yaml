base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/011.yaml
  text: And now, children, see what almsgiving does, and how righteousness delivers. And while he was saying these things, his life came to an end on the bed. He was a hundred fifty-eight years old, and he buried him honorably.
translation:
  language: hi
  text: और अब, बच्चो, देखो कि दान देना क्या करता है और धार्मिकता[a] कैसे छुड़ाती है। जब वह ये बातें कह रहा था, तब बिस्तर पर उसके प्राण निकल गए[b]। वह एक सौ अट्ठावन वर्ष का था; और उसने उसे सम्मानपूर्वक दफ़नाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय।” यूनानी शब्द प्रसंग के अनुसार धार्मिकता या न्याय, दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका प्राण चुक गया” या “उसका प्राण निकल गया।” यह मृत्यु के लिए यूनानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: 'कुछ पाठक यहाँ “उन्होंने उसे सम्मानपूर्वक दफ़नाया” की अपेक्षा कर सकते हैं, पर इस यूनानी पाठ में क्रिया एकवचन है: “उसने उसे सम्मानपूर्वक दफ़नाया।”'
    reason: textual_variant
lexical_decisions:
- source_word: παιδία
  choice: बच्चो
  rationale: यह संबोधन बहुवचन है और वंशजों अथवा कम आयु के श्रोताओं के लिए प्रयुक्त हुआ है; ‘बच्चो’ स्वाभाविक पारिवारिक संबोधन है और लिंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἴδετε
  choice: देखो
  rationale: बहुवचन आज्ञार्थक क्रिया का प्रत्यक्ष और उपदेशात्मक बल बनाए रखता है।
- source_word: ἐλεημοσύνη
  choice: दान देना
  rationale: टोबित में यह शब्द जरूरतमंदों को ठोस रूप से सहायता देने का संकेत करता है; ‘दान देना’ आधुनिक हिन्दी में स्पष्ट है और केवल अमूर्त दयाभाव तक अर्थ सीमित नहीं करता।
- source_word: ποιεῖ
  choice: क्या करता है
  rationale: सरल वर्तमान काल तथा यूनानी वाक्य की खुली अभिव्यक्ति को बनाए रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यहाँ ज्ञान-साहित्य के नैतिक संदर्भ में सीधा और प्रतिष्ठित हिन्दी समतुल्य है; ‘न्याय’ भी शब्दार्थ की दृष्टि से संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ῥύεται
  choice: छुड़ाती है
  rationale: यह बचाव या छुटकारा देने का व्यापक अर्थ व्यक्त करता है और छुटकारे को केवल शारीरिक अथवा अंतिम उद्धार तक सीमित नहीं करता।
- source_word: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: उसके प्राण निकल गए
  rationale: मृत्यु का स्वाभाविक हिन्दी मुहावरा है, जो यूनानी के ‘उसका प्राण/जीवन चुक गया’ रूपक के निकट रहते हुए घटना को स्पष्ट करता है।
- source_word: κλίνη
  choice: बिस्तर
  rationale: मृत्यु के प्रसंग में सामान्य और स्वाभाविक हिन्दी शब्द।
- source_word: ἐτῶν ἑκατὸν πεντήκοντα ὀκτώ
  choice: एक सौ अट्ठावन वर्ष का था
  rationale: आयु-वर्णन का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: ἔθαψεν αὐτὸν ἐνδόξως
  choice: उसने उसे सम्मानपूर्वक दफ़नाया
  rationale: स्वीटे के पाठ में क्रिया एकवचन है और कर्ता प्रसंग से निहित है; ἐνδόξως यहाँ प्रतिष्ठापूर्ण अंत्येष्टि को दर्शाता है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस ज्ञानपरक नैतिक संदर्भ में ‘धार्मिकता’ उपयुक्त है, पर यूनानी शब्द ‘न्याय’ भी व्यक्त कर सकता है; वास्तविक अर्थगत संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: मृत्यु-संबंधी मुहावरा ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: उसके प्राण निकल गए
  alternative: उसका प्राण चुक गया / उसका जीवन समाप्त हो गया
  rationale: यह हिन्दी में मृत्यु को स्पष्ट करता है और यूनानी ψυχή को किसी विस्तृत मानव-स्वरूप संबंधी सिद्धांत में बदले बिना उसके मुहावरेदार बिंब को कुछ हद तक बनाए रखता है।
- issue: ἔθαψεν का एकवचन कर्ता
  choice: उसने उसे सम्मानपूर्वक दफ़नाया
  alternative: उन्होंने उसे सम्मानपूर्वक दफ़नाया
  rationale: दिए गए यूनानी साक्ष्य में क्रिया स्पष्टतः एकवचन है। यद्यपि प्रसंग के कारण कुछ पाठक बहुवचन की अपेक्षा कर सकते हैं, अनुवाद में मूल पाठ की व्याकरणिक असहजता को चुपचाप नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘बच्चो’ पारिवारिक संबोधन है, ‘दान देना’ सामान्य पाठक के लिए स्पष्ट है, और मूल यूनानी के असामान्य एकवचन अंतिम क्रिया को पादटिप्पणी सहित सुरक्षित रखा गया है।
