base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/004.yaml
  text: 'Go to Media[a], my child, because I am convinced that what Jonah the prophet spoke concerning Nineveh will happen: it will be overthrown. But in Media there will be peace for a while. And our brothers will be scattered from the good land, and Jerusalem will be desolate, and the house of God in it will be burned down[b], and it will be desolate until a time.'
translation:
  language: hi
  text: हे मेरे बच्चे, मादै देश[a] चले जाओ, क्योंकि मुझे पूरा विश्वास है कि नीनवे के विषय में योना भविष्यद्वक्ता ने जो कहा था, वह पूरा होगा—उसका विनाश कर दिया जाएगा। पर मादै देश में कुछ समय तक अपेक्षाकृत शांति रहेगी। हमारे भाई उस अच्छे देश से तितर-बितर कर दिए जाएँगे; यरूशलेम उजाड़ हो जाएगा, उसमें स्थित परमेश्वर का भवन[b] जला दिया जाएगा, और वह कुछ समय तक उजाड़ रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मादियों का देश।
    reason: स्थान-नाम की पहचान स्पष्ट करने के लिए।
  - marker: b
    text: यहाँ ‘परमेश्वर का भवन’ यरूशलेम के मन्दिर को दर्शाता है।
    reason: प्रसंगगत संकेत स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ἄπελθε εἰς τὴν Μηδείαν
  choice: मादै देश चले जाओ
  rationale: आज्ञार्थक क्रिया और दिशा दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘मादै देश’ स्थान-नाम को स्पष्ट करता है।
- source_word: τέκνον
  choice: हे मेरे बच्चे
  rationale: सम्बोधन का स्नेह बनाए रखता है और यूनानी शब्द से आगे बढ़कर लिंग निर्धारित नहीं करता।
- source_word: πέπεισμαι
  choice: मुझे पूरा विश्वास है
  rationale: पूर्णकालिक रूप से व्यक्त दृढ़ और स्थापित निश्चय को सहज हिन्दी में दर्शाता है।
- source_word: ὅσα ἐλάλησεν ... ὅτι καταστραφήσεται
  choice: जो कहा था, वह पूरा होगा—उसका विनाश कर दिया जाएगा
  rationale: भविष्यवाणी की विषय-वस्तु और उसके भावी घटित होने को स्पष्ट करता है; कर्मवाच्य भी सुरक्षित रहता है।
- source_word: ἔσται εἰρήνη μᾶλλον ἕως καιροῦ
  choice: कुछ समय तक अपेक्षाकृत शांति रहेगी
  rationale: μᾶλλον के तुलनात्मक भाव और ἕως καιροῦ की सीमित अवधि, दोनों को सुरक्षित रखता है।
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: हमारे भाई
  rationale: यूनानी पुल्लिंग बहुवचन का सीधा अनुवाद है और प्रसंग में सह-इस्राएलियों की ओर संकेत करता है।
- source_word: ἀπὸ τῆς ἀγαθῆς γῆς
  choice: उस अच्छे देश से
  rationale: ἀγαθῆς का मूल अर्थ ‘अच्छा’ बनाए रखता है और भूमि/देश की बाइबलीय अनुगूँज को अनावश्यक व्याख्या के बिना व्यक्त करता है।
- source_word: ἔρημος
  choice: उजाड़
  rationale: नगर और मन्दिर की तबाही के प्रसंग में वीरानी और विनाश का उपयुक्त भविष्यसूचक शब्द है।
- source_word: ὁ οἶκος τοῦ θεοῦ
  choice: परमेश्वर का भवन
  rationale: मूल रूपक को मुख्य पाठ में बनाए रखता है; पादटिप्पणी बताती है कि आशय यरूशलेम का मन्दिर है।
theological_decisions:
- issue: योना की भविष्यवाणी और उसके पूरे होने के बीच वाक्य-संबंध
  choice: जो कहा था, वह पूरा होगा—उसका विनाश कर दिया जाएगा
  alternative: योना भविष्यद्वक्ता ने नीनवे के विषय में जो कहा था कि उसका विनाश कर दिया जाएगा, उस पर मुझे विश्वास है
  rationale: यूनानी वाक्य की सम्भावित संरचना को पठनीय हिन्दी में प्रस्तुत करता है, पर भविष्यवाणी के स्वरूप या उसके धर्मवैज्ञानिक परिणामों को विस्तार से निर्धारित नहीं करता।
- issue: μᾶλλον में निहित तुलनात्मकता
  choice: अपेक्षाकृत शांति
  alternative: शांति
  rationale: मूल में उपस्थित तुलनात्मक पद को मिटाने के बजाय यह संकेत देता है कि मादै में शांति पूर्ण या निरपेक्ष सुरक्षा नहीं, बल्कि अन्य स्थानों की तुलना में अधिक हो सकती है।
- issue: ‘परमेश्वर का भवन’ की पहचान
  choice: मुख्य पाठ में ‘परमेश्वर का भवन’, पादटिप्पणी में ‘मन्दिर’
  alternative: मुख्य पाठ में सीधे ‘परमेश्वर का मन्दिर’
  rationale: मूल की अभिव्यक्ति सुरक्षित रहती है, जबकि प्रसंगगत पहचान पाठक के लिए स्पष्ट की जाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हे मेरे बच्चे’ पारिवारिक स्नेह व्यक्त करता है; ‘अपेक्षाकृत शांति’ मूल यूनानी की वास्तविक तुलनात्मक अस्पष्टता को सुरक्षित रखता है।
