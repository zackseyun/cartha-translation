  text: And all the nations will truly turn to fear the Lord God[a]; they will bury their idols.
translation:
  language: hi
  text: और सब जातियाँ सच्चे मन से प्रभु परमेश्वर का भय मानने के लिए मुड़ेंगी[a]; वे अपनी मूर्तियों को गाड़ देंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सच्चे मन से प्रभु परमेश्वर का भय मानने के लिए लौटेंगी।” यूनानी क्रिया का अर्थ “मुड़ना” या “लौटना” दोनों हो सकता है; यहाँ यह जातियों के निष्कपट रूप से परमेश्वर की ओर मुड़ने को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔθνη
  choice: सब जातियाँ
  rationale: यह पद संसार के सभी जनसमूहों की व्यापकता व्यक्त करता है; ‘सब जातियाँ’ स्वाभाविक बाइबलीय हिन्दी है और केवल गैर-यहूदियों तक अर्थ को सीमित नहीं करता।
- source_word: ἐπιστρέψουσιν
  choice: फिरेंगी
  rationale: क्रिया का अर्थ ‘मुड़ना’ या ‘लौटना’ हो सकता है। ‘की ओर फिरेंगी’ मन-परिवर्तन की दिशा को बनाए रखता है, पर बाद की तकनीकी धर्मशास्त्रीय शब्दावली नहीं जोड़ता।
- source_word: ἀληθινῶς
  choice: सच्चे मन से
  rationale: यह उनके फिरने और परमेश्वर का भय मानने की वास्तविकता तथा निष्कपटता बताता है। आधुनिक हिन्दी में ‘सच्चे मन से’ इस क्रियाविशेषण का स्वाभाविक अर्थ देता है।
- source_word: φοβεῖσθαι
  choice: भय मानने
  rationale: ‘भय मानना’ परमेश्वर के प्रति श्रद्धामय भय और अधीनता की बाइबलीय अभिव्यक्ति को सुरक्षित रखता है; केवल ‘आदर करना’ अर्थ को हल्का कर देता।
- source_word: Κύριον τὸν θεόν
  choice: प्रभु परमेश्वर
  rationale: यूनानी में कोई स्वत्ववाचक सर्वनाम नहीं है। ‘प्रभु परमेश्वर’ दोनों उपाधियों को बिना ‘अपने’ जोड़े स्पष्ट और परंपरानुकूल हिन्दी में रखता है।
- source_word: κατορύξουσιν
  choice: गाड़ देंगी
  rationale: क्रिया का मूल चित्र खोदकर भूमि में दबाने या गाड़ने का है। ‘गाड़ देंगी’ मूर्तियों के त्याग की सजीव क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ εἴδωλα αὐτῶν
  choice: अपनी मूर्तियों
  rationale: εἴδωλα धार्मिक संदर्भ में ‘मूर्तियाँ’ है, और αὐτῶν का स्वाभाविक हिन्दी रूप यहाँ ‘अपनी’ है।
theological_decisions:
- issue: क्या φοβεῖσθαι को नरम करके केवल ‘श्रद्धा करना’ कहा जाए
  choice: भय मानने
  alternative: श्रद्धा करने
  rationale: यूनानी पाठ परमेश्वर का भय मानने की प्रचलित बाइबलीय भाषा रखता है। इसे बनाए रखने से श्रद्धा, विस्मय और अधीनता का धर्मशास्त्रीय भार नष्ट नहीं होता।
- issue: क्या ἐπιστρέψουσιν को तकनीकी ‘धर्म-परिवर्तन’ की भाषा में व्यक्त किया जाए
  choice: की ओर फिरेंगी
  alternative: धर्म-परिवर्तन करेंगी
  rationale: मूल पाठ में मुड़ने/लौटने का रूपक है। ‘फिरेंगी’ उस रूपक और उसकी सम्भावित द्व्यर्थता को सुरक्षित रखता है, जबकि तकनीकी धार्मिक शब्दावली नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भय मानना’ बाइबलीय धर्मशास्त्रीय गहराई बनाए रखता है, जबकि ‘सच्चे मन से’ यूनानी क्रियाविशेषण को स्वाभाविक हिन्दी में व्यक्त करता है।
