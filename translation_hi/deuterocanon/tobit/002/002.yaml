base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/002.yaml
  text: And I saw much food[a], and I said to my son, “Go and bring whichever one of our brothers you may find in need, who remembers the Lord; and behold[c][b], I am waiting for you.”
translation:
  language: hi
  text: और मैंने बहुत-सा भोजन[a] देखा और अपने बेटे से कहा, “जाओ और हमारे भाइयों[b] में से जिस किसी ज़रूरतमंद को पाओ, जो प्रभु को स्मरण रखता हो, उसे ले आओ। और देखो, मैं तुम्हारी प्रतीक्षा कर रहा हूँ[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत-से पकवान” अथवा “बहुत-सा मांस”; यूनानी शब्द भोजन के साथ परोसे जाने वाले तैयार खाद्य पदार्थों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “हमारे भाइयों” का अर्थ तोबित के अपने लोगों या समुदाय के सदस्य हैं, केवल सगे भाई नहीं।
    reason: cultural_note
  - marker: c
    text: यूनानी पांडुलिपि-परंपरा में अंतिम शब्द कुछ असहज हैं; आशय यह है कि तोबित वहीं रहकर अपने बेटे के लौटने की प्रतीक्षा करता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐθεασάμην
  choice: मैंने ... देखा
  rationale: यहाँ θεάομαι का रूप सामान्य प्रत्यक्ष बोध बताता है; आधुनिक हिन्दी में ‘देखा’ स्वाभाविक और पर्याप्त है।
- source_word: ὄψα πολλά
  choice: बहुत-सा भोजन
  rationale: ὄψα तैयार भोजन, पकवान या रोटी के साथ खाई जाने वाली सामग्री को सूचित कर सकता है। ‘बहुत-सा भोजन’ अर्थ को बिना अनावश्यक रूप से सीमित किए व्यक्त करता है।
- source_word: Βάδισον
  choice: जाओ
  rationale: आज्ञार्थक βαδίζω का प्रसंगानुकूल और सहज हिन्दी रूप ‘जाओ’ है; शाब्दिक ‘चलो’ यहाँ भ्रम पैदा कर सकता है।
- source_word: ἄγαγε
  choice: ले आओ
  rationale: आज्ञार्थक ἄγω यहाँ किसी व्यक्ति को तोबित के पास लाने का निर्देश है, इसलिए ‘ले आओ’ स्पष्ट है।
- source_word: ὃν ἐὰν εὕρῃς
  choice: जिस किसी ... को पाओ
  rationale: ἐάν के साथ संबंधवाचक रचना अनिश्चितता व्यक्त करती है; ‘जिस किसी ... को पाओ’ उस खुले अर्थ को बनाए रखता है।
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: हमारे भाइयों में से
  rationale: मूल का पुरुषवाची पारिवारिक शब्द सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि आशय केवल सगे भाइयों से नहीं है।
- source_word: ἐνδεής
  choice: ज़रूरतमंद
  rationale: ἐνδεής अभाव या आवश्यकता में होने को दर्शाता है। ‘ज़रूरतमंद’ आर्थिक निर्धनता से अधिक व्यापक अर्थ बनाए रखता है।
- source_word: ὃς μέμνηται τοῦ κυρίου
  choice: जो प्रभु को स्मरण रखता हो
  rationale: μέμνηται निरंतर स्मरण या सचेत ध्यान का भाव रखता है। ‘स्मरण रखता हो’ पवित्र और सहज हिन्दी है तथा मूल की धार्मिक कसौटी को सुरक्षित रखता है।
- source_word: ἰδοὺ μένω σε
  choice: और देखो, मैं तुम्हारी प्रतीक्षा कर रहा हूँ
  rationale: प्रेषित यूनानी वाक्यांश व्याकरण की दृष्टि से कुछ असहज है। ‘देखो’ ἰδού को और ‘मैं तुम्हारी प्रतीक्षा कर रहा हूँ’ प्रसंगगत आशय को निकटता से व्यक्त करता है।
theological_decisions:
- issue: व्यवस्थाविवरणोत्तर कथा की भक्तिपरक अभिव्यक्ति में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριος है, इब्रानी दिव्य नाम नहीं; इसलिए ‘प्रभु’ मूल साक्ष्य के अधिक अनुरूप है।
- issue: ἀδελφῶν ἡμῶν का दायरा
  choice: हमारे भाइयों
  alternative: हमारे लोगों / हमारे इस्राएली भाइयों
  rationale: शब्द संभवतः तोबित के समुदाय या जाति के पुरुष सदस्यों को सूचित करता है, केवल जैविक सहोदरों को नहीं। मुख्य पाठ में मूल का संबंधसूचक शब्द रखा गया और व्यापक आशय पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘भोजन’, ‘प्रभु’ और ‘स्मरण रखता हो’ धार्मिक संदर्भ के अनुकूल हैं, पर भाषा अनावश्यक रूप से पुरातन नहीं है। पादटिप्पणी-चिह्न संबंधित पदों और वाक्यांशों के तुरंत बाद रखे गए हैं।
