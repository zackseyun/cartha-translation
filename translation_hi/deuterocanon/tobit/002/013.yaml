base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/013.yaml
  text: But when she came to me[a], she began to cry out, and I said to her, “Where is the young goat from? Is it stolen? Give it back to its owners, for it is not lawful to eat what is stolen.”
translation:
  language: hi
  text: पर जब वह मेरे पास आया, तो मिमियाने लगा[a]। मैंने उससे कहा, “बकरी का यह बच्चा कहाँ से आया? कहीं यह चोरी का तो नहीं है? इसे इसके मालिकों को लौटा दो, क्योंकि चोरी की चीज़ खाना जायज़ नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ “ऊँची आवाज़ निकालने लगा” या “पुकारने लगा” भी हो सकता है; यहाँ संदर्भ के अनुसार बकरी के बच्चे के लिए “मिमियाने लगा” किया गया है।
    reason: lexical_and_subject_ambiguity
lexical_decisions:
- source_word: ὅτε δὲ ἦλθεν πρὸς μέ
  choice: पर जब वह मेरे पास आया
  rationale: यूनानी में कर्ता व्यक्त नहीं किया गया है। निकट संदर्भ में बकरी का बच्चा स्वाभाविक कर्ता है; इसलिए हिन्दी में पुल्लिंग रूप रखा गया है, बिना अन्ना को कर्ता मानने के।
- source_word: ἤρξατο κράζειν
  choice: मिमियाने लगा
  rationale: κράζειν का सामान्य अर्थ ऊँची आवाज़ निकालना या पुकारना है। यहाँ कर्ता बकरी का बच्चा होने के कारण ‘मिमियाने लगा’ स्वाभाविक और संदर्भानुकूल है; शाब्दिक व्यापकता पादटिप्पणी में दी गई है।
- source_word: Πόθεν τὸ ἔριφον;
  choice: बकरी का यह बच्चा कहाँ से आया?
  rationale: πόθεν स्रोत या उत्पत्ति पूछता है और ἔριφον बकरी के बच्चे को सूचित करता है। यह हिन्दी में स्पष्ट और सहज प्रश्न है।
- source_word: μὴ κλεμμάιον ἐστίν;
  choice: कहीं यह चोरी का तो नहीं है?
  rationale: μή यहाँ आशंका से भरा प्रश्न व्यक्त करता है। ‘कहीं...तो नहीं’ उस संदेह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπόδος αὐτὸ τοῖς κυρίοις
  choice: इसे इसके मालिकों को लौटा दो
  rationale: ἀπόδος वापस करने की आज्ञा है और κυρίοις यहाँ पशु के स्वामियों को सूचित करता है, किसी धार्मिक अर्थ में ‘प्रभुओं’ को नहीं।
- source_word: οὐ γὰρ θεμιτὸν ἐστιν φαγεῖν κλεψιμαῖον
  choice: क्योंकि चोरी की चीज़ खाना जायज़ नहीं है
  rationale: θεμιτόν सामाजिक, नैतिक या विधिसम्मत अनुमति का भाव रखता है। ‘जायज़ नहीं’ साधारण आधुनिक हिन्दी में इस नैतिक-विधिक बल को सहजता से व्यक्त करता है।
theological_decisions:
- issue: θεμιτόν में निहित नैतिक-विधिक बल
  choice: चोरी की चीज़ खाना जायज़ नहीं है
  alternative: चोरी की चीज़ खाना उचित नहीं है
  rationale: ‘जायज़ नहीं’ केवल निजी नापसंदगी के बजाय निषिद्ध या अनुमत न होने का भाव बनाए रखता है, फिर भी किसी विशिष्ट बाद की धार्मिक विधि को पाठ में नहीं जोड़ता।
- issue: ἦλθεν और κράζειν का अव्यक्त कर्ता
  choice: बकरी के बच्चे को कर्ता मानते हुए ‘आया...मिमियाने लगा’
  alternative: अन्ना को कर्ता मानते हुए ‘आई...चिल्लाने लगी’
  rationale: यूनानी क्रियाओं में कर्ता स्पष्ट नहीं है, पर तत्काल संदर्भ और पशु की आवाज़ का उल्लेख बकरी के बच्चे को कर्ता मानने का समर्थन करता है। पाठ में किसी अतिरिक्त धार्मिक निष्कर्ष को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बकरी का बच्चा’ सामान्य पाठक के लिए तुरंत समझ में आता है। ‘जायज़’ प्रचलित आधुनिक हिन्दी में नैतिक अनुमति का अर्थ देता है और ‘विधिसम्मत’ की अपेक्षा कम तकनीकी है।
