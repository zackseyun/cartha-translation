base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/006.yaml
  text: And I remembered the prophecy of Amos[a], as he said, “Your festivals will be turned into mourning, and all your rejoicing into lamentation.” And I wept.
translation:
  language: hi
  text: और मुझे आमोस की भविष्यवाणी याद आई[a], जैसा उसने कहा था, “तुम्हारे पर्व शोक में बदल दिए जाएँगे, और तुम्हारे सारे हर्षोल्लास विलाप में बदल दिए जाएँगे।” और मैं रोया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह उद्धृत पंक्ति सेप्टुआजिन्ट परंपरा में आमोस 8:10 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐμνήσθην
  choice: मुझे … याद आई
  rationale: यूनानी रूप अर्थ की दृष्टि से सक्रिय है। यह हिन्दी में स्मरण होने की क्रिया को सहज और सीधे ढंग से व्यक्त करता है।
- source_word: προφητείας
  choice: भविष्यवाणी
  rationale: यहाँ एक विशिष्ट भविष्यसूचक वचन का उल्लेख है जिसे आगे उद्धृत किया गया है; ‘भविष्यवाणी’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: Στραφήσονται
  choice: बदल दिए जाएँगे
  rationale: भविष्यकालीन कर्मवाच्य को बनाए रखता है और पर्वों पर घटित होने वाले उलटाव को व्यक्त करता है, बिना उसके कर्ता को पाठ में जोड़ने के।
- source_word: ἑορταὶ
  choice: पर्व
  rationale: धार्मिक-सामुदायिक उत्सवों के लिए स्वाभाविक आधुनिक हिन्दी शब्द है और केवल भोज का संकुचित अर्थ नहीं देता।
- source_word: πένθος
  choice: शोक
  rationale: भीतरी दुःख के साथ सार्वजनिक मातम का अर्थ भी समेटता है और भविष्यसूचक उद्धरण के अनुकूल है।
- source_word: εὐφροσύναι
  choice: हर्ष
  rationale: आनंद और उल्लास की अभिव्यक्ति को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘सारा’ यूनानी πᾶσαι के व्यापक बल को रखता है।
- source_word: θρῆνον
  choice: विलाप
  rationale: साधारण उदासी के बजाय मुखर अथवा औपचारिक शोक-प्रकाशन को दर्शाता है और पंक्ति के काव्यात्मक समानांतर को बनाए रखता है।
- source_word: ἔκλαυσα
  choice: मैं रो पड़ा
  rationale: सरल भूतकालीन घटना और प्रसंग से उपजी तत्काल भावात्मक प्रतिक्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आमोस के अंतःस्थ उद्धरण का रूप
  choice: इसे बहुवचन ‘तुम्हारे’ के साथ सीधा भविष्यसूचक उद्धरण रखा गया है।
  alternative: इसे परोक्ष कथन बनाना अथवा एकवचन संबोधन मानना।
  rationale: यूनानी पाठ स्पष्ट रूप से आमोस के कथन का सीधा उद्धरण देता है और ὑμῶν बहुवचन है। इससे तोबित का इस्राएल की सामूहिक भविष्यसूचक चेतावनी से संबंध बना रहता है।
- issue: कर्मवाच्य में निहित कर्ता
  choice: ‘बदल दिए जाएँगे’ द्वारा कर्मवाच्य रखा गया है और परमेश्वर को स्पष्ट कर्ता के रूप में नहीं जोड़ा गया।
  alternative: ‘परमेश्वर तुम्हारे पर्वों को शोक में बदल देगा।’
  rationale: संदर्भ दिव्य न्याय का संकेत दे सकता है, पर यूनानी वाक्य कर्ता का नाम नहीं लेता; इसलिए वास्तविक अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यसूचक उद्धरण के अनुरूप रखी गई है। ‘पर्व—शोक’ और ‘हर्ष—विलाप’ का समानांतर विन्यास मूल यूनानी की काव्यात्मक संरचना को प्रतिबिंबित करता है।
