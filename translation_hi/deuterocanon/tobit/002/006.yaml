    rationale: The Greek has καὶ (“and”) at both points, not τότε (“then”). Omitting “तब” avoids adding temporal or consequential force.
  - severity: low
    issue: “मैं रो पड़ा” is more inceptive than the source.
    rationale: ἔκλαυσα simply reports that the speaker wept. “मैं रोया” is direct and preserves the aorist narration without suggesting a sudden onset.
  - severity: low
    issue: The second quoted clause leaves “बदल दिए जाएँगे” implicit.
    rationale: Hindi can allow the ellipsis, but repeating the verb more clearly preserves the Greek’s explicit parallel future passive construction.
