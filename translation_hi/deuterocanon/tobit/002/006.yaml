  terminology: “भविष्यवाणी,” “पर्व,” “शोक,” and “विलाप” are appropriate in register and meaning. “हर्षोल्लास” naturally conveys the plural εὐφροσύναι as communal/expressed rejoicings without narrowing it to private emotion.
  issues:
