  source_fidelity: The draft accurately represents the remembered prophecy, its plural addressees, the passive future reversals, and Tobit's weeping. However, the two occurrences of “तब” introduce a sequential emphasis not expressed in the Greek, and “रो पड़ा” adds an inceptive nuance beyond the simple aorist ἔκλαυσα.
