base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/014.yaml
  text: But she said[a], “It was given to me as a gift in addition to my wages.” But I did not believe her, and I told her to give it back to its owners; and I was embarrassed before her. Then she answered and said to me, “Where are your acts of mercy and your righteous deeds? Behold[d][c][b], everything about you is known.”
translation:
  language: hi
  text: पर उसने कहा, “यह मुझे मेरी मज़दूरी के अतिरिक्त[a] उपहार में दिया गया है।” मैंने उसकी बात पर विश्वास नहीं किया और उससे कहा कि उसे उसके मालिकों[b] को लौटा दे; और मुझे उसके सामने लज्जा आई[c]। तब उसने मुझे उत्तर दिया, “तुम्हारे दया के काम और तुम्हारे धर्म के काम[d] कहाँ हैं? देखो, तुम्हारे विषय में सब कुछ प्रकट है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह मुझे मेरी मज़दूरी के साथ मिला है” अथवा “यह मेरी मज़दूरी के रूप में मिला है।” यूनानी वाक्यांश वेतन से जुड़े इन अर्थों की अनुमति देता है; प्रसंग अतिरिक्त उपहार के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “स्वामियों”; यहाँ विवादित वस्तु जिनकी थी, उनके अर्थ में “मालिकों”।
    reason: lexical_alternative
  - marker: c
    text: यूनानी क्रिया का शाब्दिक अर्थ लाल पड़ने से जुड़ा है; यहाँ भाव लज्जित या संकोच में पड़ने का है।
    reason: lexical_alternative
  - marker: d
    text: “दया के काम” का अर्थ विशेष रूप से दान के काम भी हो सकता है; “धर्म के काम” का अनुवाद “धार्मिकता के काम” या “न्याय के काम” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δῶρον
  choice: उपहार
  rationale: यह सामान्य और स्वाभाविक हिन्दी शब्द है तथा घरेलू प्रसंग में किसी अतिरिक्त भेंट को स्पष्ट करता है।
- source_word: ἐπὶ τῷ μισθῷ
  choice: मेरी मज़दूरी के अतिरिक्त
  rationale: वाक्यांश वेतन से संबद्ध किसी वस्तु को दर्शाता है; प्रसंग में अन्ना का दावा है कि यह सामान्य मज़दूरी के ऊपर मिला उपहार था। अस्पष्ट वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: οὐκ ἐπίστευον αὐτῇ
  choice: मैंने उसकी बात पर विश्वास नहीं किया
  rationale: अपूर्ण भूतकालीन क्रिया को हिन्दी कथा-शैली में स्वाभाविक रूप से व्यक्त करता है और प्रथम पुरुष कथन बनाए रखता है।
- source_word: ἀποδιδόναι
  choice: लौटा दे
  rationale: विवादित वस्तु को वापस करने के आदेश के लिए संक्षिप्त और स्वाभाविक हिन्दी।
- source_word: τοῖς κυρίοις
  choice: उसके मालिकों
  rationale: κύριοις का शाब्दिक अर्थ ‘स्वामियों’ हो सकता है, पर यहाँ वस्तु के अधिकार रखने वालों का आशय है; ‘मालिकों’ से अनावश्यक धर्मवैज्ञानिक ध्वनि नहीं आती।
- source_word: ἠρυθρίων
  choice: मैं लज्जित हुआ
  rationale: क्रिया का शाब्दिक संबंध लाल पड़ने से है, किंतु प्रसंग में लज्जा या संकोच का सामाजिक-भावात्मक अर्थ प्रमुख है।
- source_word: ἐλεημοσύναι
  choice: दया के काम
  rationale: यह शब्द दान देने के विशेष अर्थ के साथ व्यापक दयापूर्ण कर्मों को भी सूचित कर सकता है; सरल हिन्दी में व्यापक नैतिक अर्थ सुरक्षित रहता है।
- source_word: δικαιοσύναι
  choice: धर्म के काम
  rationale: यूनानी बहुवचन यहाँ अमूर्त धार्मिक स्थिति के बजाय ठोस धर्ममय या न्यायोचित कर्मों को दर्शाता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: प्रत्यक्ष ध्यानाकर्षण और फटकार का बल आधुनिक, गरिमापूर्ण हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: γνωστὰ πάντα μετὰ σοῦ
  choice: तुम्हारे विषय में सब कुछ प्रकट है
  rationale: संक्षिप्त और कुछ अस्पष्ट यूनानी वाक्यांश को बिना यह तय किए व्यक्त करता है कि बात परमेश्वर के ज्ञान, सार्वजनिक प्रतिष्ठा या परिस्थिति के प्रत्यक्ष परिणाम की है।
theological_decisions:
- issue: δικαιοσύναι का बहुवचन नैतिक अर्थ
  choice: धर्म के काम
  alternative: धार्मिकता के काम; न्याय के काम
  rationale: यहाँ बहुवचन ठोस कर्मों की ओर संकेत करता है, किसी अमूर्त धार्मिक दर्जे की ओर नहीं। ‘धर्म के काम’ नैतिक-धार्मिक बल रखता है, यद्यपि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- issue: अन्तिम वाक्य में अन्ना की फटकार का आशय
  choice: तुम्हारे विषय में सब कुछ प्रकट है
  alternative: तुम्हारे साथ जो कुछ है, सब जाना हुआ है; तुम्हारी सारी बातें सामने हैं
  rationale: मूल वाक्य जानबूझकर संक्षिप्त और खुला है। अनुवाद यह निर्धारित नहीं करता कि कथन केवल परमेश्वर के ज्ञान, लोगों की धारणा या टोबित की दशा के प्रमाण को लक्ष्य करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रथम पुरुष कथा और अन्ना की तीखी फटकार सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद लगाए गए हैं; अन्तिम यूनानी वाक्य की वास्तविक अस्पष्टता को किसी एक धर्मवैज्ञानिक अर्थ में सीमित नहीं किया गया।
