base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/010.yaml
  text: And I did not know that sparrows were in the wall[a]; and while my eyes were open, the sparrows dropped warm dung into my eyes, and white films formed on my eyes. Then I went to physicians, but they did not help me[b]. But Achiacharus supported me until I went to Elymais.
translation:
  language: hi
  text: और मुझे मालूम नहीं था कि दीवार में गौरैयाँ थीं।[a] जब मेरी आँखें खुली हुई थीं, तब गौरैयों ने मेरी आँखों में गरम बीट गिरा दी, और मेरी आँखों में सफेद परतें बन गईं। तब मैं चिकित्सकों के पास गया, पर उनसे मुझे कोई लाभ नहीं हुआ।[b] और अखियाखार मेरा भरण-पोषण करता रहा, जब तक कि मैं एलिमाइस नहीं गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘छोटी चिड़ियाँ’; यूनानी शब्द का व्यापक अर्थ छोटी चिड़ियाँ भी हो सकता है, यद्यपि यहाँ ‘गौरैयाँ’ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ कहता है कि मेरी आँखों में ‘सफेद परतें’ या सफेद अपारदर्शिताएँ बन गई थीं। इसे प्रायः मोतियाबिंद जैसी अवस्था समझा जाता है, पर पाठ कोई सटीक चिकित्सकीय निदान नहीं देता।
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: गौरैयाँ
  rationale: यह शब्द सामान्यतः गौरैया, और कभी अधिक व्यापक अर्थ में छोटी चिड़िया, सूचित करता है। संदर्भ में ‘गौरैयाँ’ सबसे संभावित और स्वाभाविक है; व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐν τῷ τοίχῳ
  choice: दीवार में
  rationale: यूनानी पाठ का स्थान-सूचक वाक्यांश सीधे ‘दीवार में’ कहता है, संभवतः किसी दरार या खोखले स्थान का संकेत; अनावश्यक रूप से ‘छत पर’ नहीं किया गया।
- source_word: ἀνεῳγότων
  choice: जब मेरी आँखें खुली थीं
  rationale: समय-सूचक genitive absolute को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἀφώδευσαν
  choice: बीट कर दी
  rationale: क्रिया मलत्याग का स्पष्ट उल्लेख करती है। पक्षियों के संदर्भ में ‘बीट कर दी’ आधुनिक हिन्दी में स्वाभाविक है और मूल की ठोस अभिव्यक्ति बनाए रखता है।
- source_word: θερμὰ
  choice: गरम
  rationale: शब्द का अर्थ गरम या गर्माहट लिए हुए है; ‘गरम’ संदर्भ में सीधा और स्वाभाविक है।
- source_word: λευκώματα
  choice: सफेद झिल्लियाँ
  rationale: यह आँखों में बनी सफेद अपारदर्शी परतों या धब्बों का वर्णन करता है। ‘सफेद झिल्लियाँ’ बिना आधुनिक चिकित्सकीय निदान थोपे दृश्य अवस्था बताता है।
- source_word: ἰατρούς
  choice: वैद्यों
  rationale: यह चिकित्सकों के लिए सामान्य शब्द है। ‘वैद्य’ गरिमापूर्ण और ऐतिहासिक कथा के अनुकूल है, किसी विशेष चिकित्सा-पद्धति को यहाँ अभिप्रेत किए बिना।
- source_word: οὐκ ὠφέλησάν με
  choice: उनसे मुझे कोई लाभ नहीं हुआ
  rationale: मूल का अर्थ है कि चिकित्सक उसके लिए लाभकारी सिद्ध नहीं हुए; हिन्दी मुहावरा इसे सहजता से व्यक्त करता है।
- source_word: ἔτρεφέν με
  choice: मेरा भरण-पोषण करता रहा
  rationale: τρέφω का मूल अर्थ खिलाना-पिलाना है, पर आश्रित व्यक्ति की देखभाल और निर्वाह भी सूचित हो सकता है। ‘भरण-पोषण’ इस व्यापक अर्थ को सँभालता है।
- source_word: Ἐλυμαΐδα
  choice: एल्युमैस
  rationale: यूनानी स्थान-नाम का हिन्दी लिप्यंतरण है।
theological_decisions:
- issue: तोबित की आँखों की बीमारी का चिकित्सकीय स्वरूप
  choice: मूल के λευκώματα को वर्णनात्मक रूप से ‘सफेद झिल्लियाँ’ कहा गया है।
  alternative: ‘मोतियाबिंद’ या कोई अन्य निश्चित आधुनिक निदान
  rationale: मूल पाठ आँखों में सफेद अपारदर्शी संरचनाओं का वर्णन करता है, पर किसी सटीक आधुनिक रोग-नाम को निश्चित नहीं करता। वर्णनात्मक अनुवाद इस अनिश्चितता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथा-शैली अपनाई गई है। पक्षियों के मल के लिए स्वाभाविक ‘बीट’ और आश्रय/निर्वाह के लिए ‘भरण-पोषण’ चुना गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
