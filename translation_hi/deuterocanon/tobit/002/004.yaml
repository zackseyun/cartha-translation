  text: And I, before I had tasted anything, sprang up and removed him into a room until the sun set.
translation:
  language: hi
  text: और मैं कुछ चखने से पहले ही उछलकर उठा और उस शव को उठाकर सूर्य डूबने तक एक कमरे में रख आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὶν ἢ γεύσασθαί με
  choice: मेरे कुछ चखने से पहले ही
  rationale: γεύομαι का मूल अर्थ ‘चखना’ है; प्रसंग में भोजन करने का भाव है, पर स्रोत की ठोस अभिव्यक्ति बनाए रखी गई है।
- source_word: ἀναπηδήσας
  choice: उछलकर उठा
  rationale: क्रिया अचानक और तत्परता से उठ खड़े होने को व्यक्त करती है।
- source_word: ἀνειλόμην αὐτόν
  choice: उस शव को उठाकर ... रख आया
  rationale: मध्य रूप यहाँ मृत व्यक्ति को वहाँ से उठाकर सुरक्षित स्थान पर ले जाने का भाव देता है। ‘शव’ हिंदी में सर्वनाम का संदर्भ स्पष्ट करता है, क्योंकि पद अकेला उद्धृत होने पर ‘उसे’ अस्पष्ट हो सकता है।
- source_word: εἰς τι οἴκημα
  choice: एक कमरे में
  rationale: οἴκημα किसी कक्ष या रहने की जगह को दर्शा सकता है; ‘एक कमरा’ स्वाभाविक और पर्याप्त रूप से अनिश्चित अनुवाद है।
- source_word: ἕως οὗ ἔδυ ὁ ἥλιος
  choice: जहाँ वह सूर्यास्त तक पड़ा रहा
  rationale: शाब्दिक समय-सीमा ‘जब तक सूर्य डूबा’ है। हिंदी में कमरे में रखे शव की अवधि को स्वाभाविक ढंग से व्यक्त किया गया है, बिना बाद की कार्रवाई जोड़ने के।
