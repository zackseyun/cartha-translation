  text: And she would send it to the owners[a], and they also paid her wages, adding a young goat.
translation:
  language: hi
  text: और वह उसे अपने मालिकों[a] के पास भेजती थी, और उन्होंने भी उसे उसकी मज़दूरी चुकाई और उसके साथ बकरी का एक बच्चा भी दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वामियों।” यूनानी शब्द का अर्थ “मालिकों/स्वामियों” है; यहाँ आशय उन लोगों से है जिनके लिए वह काम करती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστελλεν
  choice: भेजती थी
  rationale: अपूर्ण भूतकाल यहाँ बार-बार या नियमित रूप से किए जाने वाले कार्य का संकेत देता है; इसलिए ‘भेजती थी’ स्वाभाविक रूप से उस अर्थ को व्यक्त करता है।
- source_word: τοῖς κυρίοις
  choice: उसके मालिकों के पास
  rationale: इस श्रम-संदर्भ में κύριοι उन लोगों को दर्शाता है जिनके लिए वह काम करती थी और जिनका तैयार माल लौटाती थी। ‘मालिकों’ मूल शब्द के अर्थ को बनाए रखता है, जबकि पाद-टिप्पणी संदर्भगत अर्थ स्पष्ट करती है।
- source_word: ἀπέδωκαν
  choice: देते थे
  rationale: μισθόν के साथ यह क्रिया मज़दूरी चुकाने के अर्थ में है। हिन्दी में ‘मज़दूरी देते थे’ सहज और स्पष्ट है तथा यूनानी अपूर्ण भूतकाल की आवृत्तिमूलकता को भी व्यक्त करता है।
- source_word: τὸν μισθόν
  choice: उसकी मज़दूरी
  rationale: μισθός श्रम के बदले मिलने वाले पारिश्रमिक को दर्शाता है; ‘मज़दूरी’ इस प्रसंग में सामान्य और सटीक हिन्दी है।
- source_word: προσδόντες
  choice: साथ में ... भी दे देते थे
  rationale: कृदंत मज़दूरी के अतिरिक्त कुछ दिए जाने का भाव रखता है; यह हिन्दी अभिव्यक्ति उस पूरक अर्थ और नियमित घटना दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἔριφον
  choice: बकरी का एक बच्चा
  rationale: ἔριφος बकरी के बच्चे को दर्शाता है। यह आधुनिक हिन्दी में स्पष्ट है और केवल ‘बच्चा’ कहने से होने वाली अस्पष्टता से बचाता है।
theological_decisions:
- issue: गैर-धार्मिक श्रम-संदर्भ में κυρίοις का अनुवाद
  choice: मालिकों
  alternative: नियोक्ताओं
  rationale: यहाँ बहुवचन κύριοι मनुष्य मालिकों अथवा काम देने वालों के लिए है, परमेश्वर की उपाधि के रूप में नहीं। ‘मालिकों’ यूनानी शब्द का सीधा अर्थ सुरक्षित रखता है; ‘नियोक्ताओं’ संदर्भगत व्याख्या है, जिसे पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी पाठ में भेजी जाने वाली वस्तु स्पष्ट रूप से दोहराई नहीं गई है, इसलिए हिन्दी में बोधगम्यता के लिए ‘तैयार किया हुआ काम’ जोड़ा गया है। दोनों मुख्य क्रियाओं के अपूर्ण भूतकाल को ‘भेजती थी’ और ‘देते थे’ से नियमित या बार-बार होने वाली क्रिया के रूप में व्यक्त किया गया है।
