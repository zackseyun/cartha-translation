base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/001.yaml
  text: When I had come down to my house[a], and Anna my wife and Tobiah my son were restored to me, on the feast of Pentecost, which is the holy feast of seven weeks, a fine meal was prepared for me[c][b], and I reclined to eat.
translation:
  language: hi
  text: जब मैं नीचे अपने घर आया और मेरी पत्नी अन्ना तथा मेरा पुत्र तोबियाह मुझे वापस मिल गए, तब पिन्तेकुस्त के पर्व पर—जो सात सप्ताहों का पवित्र पर्व है[a]—मेरे लिए बढ़िया भोजन तैयार किया गया[c]; और मैं भोजन करने के लिए टेक लगाकर बैठा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘सप्ताहों का पर्व।’ यूनानी पाठ ‘पिन्तेकुस्त’ कहता है और तुरन्त उसे ‘सात सप्ताहों का पवित्र पर्व’ बताता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में प्राचीन रीति के अनुसार भोजन के लिए टेक लगाकर बैठने या लेटने का भाव है।
    reason: cultural_note
  - marker: c
    text: इस पद की समानांतर सामी परंपरा अधिक विस्तृत है और उसमें तोबियाह को भोजन के लिए किसी निर्धन कुटुम्बी को बुलाने भेजा जाता है। यहाँ अनूदित छोटे यूनानी पाठ में वह सामग्री नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: κατῆλθον
  choice: उतरकर आया
  rationale: क्रिया के शाब्दिक दिशात्मक भाव ‘नीचे आया’ को बनाए रखता है; केवल ‘लौटा’ कहना इस सूक्ष्मता को मिटा देता।
- source_word: οἶκόν μου
  choice: अपने घर
  rationale: οἶκος के भौतिक ‘घर’ और व्यक्तिगत निवास—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπεδόθη μοι
  choice: मुझे वापस मिल गए
  rationale: शाब्दिक भाव ‘मुझे लौटा दिए गए’ है। वर्तमान प्रसंग में पत्नी और पुत्र से पुनर्मिलन के लिए यह स्वाभाविक हिन्दी है और निष्क्रिय क्रिया का पुनःप्राप्ति-भाव बचाती है।
- source_word: Ἄννα ἡ γυνή μου
  choice: मेरी पत्नी अन्ना
  rationale: यूनानी नामरूप Ἄννα का देवनागरी लिप्यंतरण और संबंध का सीधा अनुवाद।
- source_word: Τωβίας ὁ υἱός μου
  choice: मेरा पुत्र तोबियाह
  rationale: ‘तोबियाह’ नाम के सामी स्वरूप को पारदर्शी रूप से दर्शाता है; ‘पुत्र’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी है।
- source_word: ἐν τῇ πεντηκοστῇ ἑορτῇ
  choice: पिन्तेकुस्त के पर्व पर
  rationale: यूनानी πεντηκοστή का प्रचलित लिप्यंतरण रखा गया है, जबकि अगले वाक्यांश में उसका यहूदी पर्व-संबंध स्पष्ट होता है।
- source_word: ἁγία ἑπτὰ ἑβδομάδων
  choice: सात सप्ताहों का पवित्र पर्व
  rationale: यूनानी की संक्षिप्त व्याख्यात्मक पदावली को स्वाभाविक हिन्दी में स्पष्ट करता है और सप्ताहों के पर्व की पहचान बनाए रखता है।
- source_word: ἐγενήθη ἄριστον καλὸν μοι
  choice: मेरे लिए बढ़िया भोजन तैयार किया गया
  rationale: शाब्दिक ‘मेरे लिए अच्छा मध्याह्न-भोजन हुआ’ को सहज हिन्दी में व्यक्त करता है; καλόν का गुणात्मक भाव ‘बढ़िया’ से आता है।
- source_word: ἀνέπεσα τοῦ φαγεῖν
  choice: मैं भोजन करने के लिए मेज़ पर टेक लगाकर बैठा
  rationale: ἀναπίπτω के प्राचीन भोज में टेक लगाकर खाने के लिए बैठने/लेटने के सांस्कृतिक भाव को केवल ‘बैठ गया’ की अपेक्षा अधिक ठीक व्यक्त करता है।
theological_decisions:
- issue: यहूदी पर्व के संदर्भ में πεντηκοστή का नाम
  choice: पिन्तेकुस्त के पर्व पर—जो सात सप्ताहों का पवित्र पर्व है
  alternative: सप्ताहों के पर्व पर
  rationale: मूल यूनानी ‘पिन्तेकुस्त’ कहकर स्वयं सात सप्ताहों के पवित्र पर्व के रूप में उसकी व्याख्या करता है। दोनों अंश रखने से यूनानी साक्ष्य और यहूदी पर्व की पहचान, दोनों सुरक्षित रहते हैं।
- issue: Τωβίας के नाम का रूप
  choice: तोबियाह
  alternative: तोबियास
  rationale: तोबियाह सामी नाम को अधिक पारदर्शी रूप से दर्शाता है और उपलब्ध समानांतर परंपरा से भी मेल खाता है; इससे कोई सांप्रदायिक अर्थ आरोपित नहीं होता।
- issue: छोटे यूनानी पाठ और विस्तृत सामी समानांतर परंपरा का संबंध
  choice: मुख्य पाठ में छोटे यूनानी पाठ का अनुवाद
  alternative: तोबियाह को किसी निर्धन कुटुम्बी को बुलाने भेजने वाली विस्तृत सामग्री मुख्य पाठ में जोड़ना
  rationale: दिया गया प्राचीन यूनानी पाठ प्राथमिक आधार है। विस्तृत सामग्री इस यूनानी वाक्य में नहीं है और उपलब्ध हिब्रू पाठ स्वयं प्राचीन प्रत्यक्ष साक्षी नहीं, इसलिए अंतर को केवल पाठांतर-टिप्पणी में बताया गया है।
