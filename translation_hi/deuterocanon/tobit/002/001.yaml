  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पिन्तेकुस्त’ को लिप्यंतरित रखते हुए उसी वाक्य में ‘सात सप्ताहों का पवित्र पर्व’ कहकर अर्थ स्पष्ट किया गया है। ‘मेज़ पर टेक लगाकर बैठा’ प्राचीन भोजन-रीति को सामान्य पाठक के लिए समझने योग्य बनाता है।
