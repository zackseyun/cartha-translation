  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पिताजी’ पुत्र द्वारा पिता को किए गए सम्बोधन के लिए स्वाभाविक है। ‘फेंका पड़ा है’ यूनानी के परिणामी पक्ष को बनाए रखता है; ‘शव’ स्पष्टता के लिए जोड़ा गया है।
