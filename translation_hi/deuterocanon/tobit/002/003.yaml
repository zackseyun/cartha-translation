base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/003.yaml
  text: And he came and said[a], “Father, one of our own people has been strangled and thrown down in the marketplace.”
translation:
  language: hi
  text: और उसने आकर कहा, “पिताजी, हमारे अपने लोगों[a] में से एक व्यक्ति का गला घोंट दिया गया है और उसका शव बाज़ार में फेंका पड़ा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे कुटुम्बियों में से एक।” यूनानी शब्द γένος परिवार, कुल या अपने समुदाय के लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἶπεν
  choice: उसने आकर कहा
  rationale: पूर्वकालिक एओरिस्ट कृदन्त और मुख्य क्रिया के क्रम को स्वाभाविक हिन्दी कथन में सुरक्षित रखता है।
- source_word: Πάτερ
  choice: पिताजी
  rationale: प्रत्यक्ष सम्बोधन के लिए आधुनिक हिन्दी में स्वाभाविक और आदरपूर्ण रूप; यूनानी में निहित न होने के कारण अलग से ‘मेरे’ नहीं जोड़ा गया।
- source_word: εἷς ἐκ τοῦ γένους ἡμῶν
  choice: हमारे अपने लोगों में से एक व्यक्ति
  rationale: γένος परिवार, कुल या व्यापक समुदाय का सूचक हो सकता है। यह चयन निकट रक्त-सम्बन्ध को अनावश्यक रूप से निश्चित किए बिना सामुदायिक आत्मीयता व्यक्त करता है।
- source_word: ἐστραγγαλωμένος
  choice: गला घोंट दिया गया है
  rationale: पूर्ण निष्क्रिय कृदन्त मृत्यु की हिंसक रीति और उसके वर्तमान परिणाम को दर्शाता है; ‘फाँसी दी गई’ साधन को अधिक निश्चित कर देता।
- source_word: ἔρριπται
  choice: उसका शव … फेंका पड़ा है
  rationale: पूर्ण निष्क्रिय रूप फेंके जाने और अब वहीं पड़े होने, दोनों को व्यक्त करता है। हिन्दी में स्पष्टता के लिए ‘उसका शव’ कहा गया है, क्योंकि सन्दर्भ मृत व्यक्ति का है।
- source_word: ἐν τῇ ἀγορᾷ
  choice: बाज़ार में
  rationale: ἀγορά के सार्वजनिक बाज़ार अथवा नगर-चौक के अर्थ को सामान्य आधुनिक हिन्दी में सहजता से व्यक्त करता है।
theological_decisions:
- issue: γένος ἡμῶν का दायरा
  choice: 'सामुदायिक/जातीय आत्मीयता: ‘हमारे अपने लोगों में से’'
  alternative: 'निकट पारिवारिक सम्बन्ध: ‘हमारे परिवार में से’; वंशगत अर्थ: ‘हमारे कुल में से’'
  rationale: प्रसंग समुदाय के एक मृत सदस्य से सम्बन्धित है और उसे निकट रक्त-सम्बन्धी नहीं बताता। व्यापक अनुवाद मूल शब्द की अर्थगत गुंजाइश बनाए रखता है।
