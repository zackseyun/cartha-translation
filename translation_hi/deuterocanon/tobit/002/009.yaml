    rationale: ἀνέλυσα does not explicitly identify a destination or require ‘return’; rendering it as leaving the burial place better preserves the source’s directional restraint.
  - severity: low
    issue: The sole footnote marker occurs at the end of the sentence although its principal explanation concerns ‘अशुद्ध अवस्था.’
    rationale: Placing the anchor immediately after the expression it explains improves reference clarity.
