base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/009.yaml
  text: And on that very night[a], after I had gone out and buried him, I lay down to sleep in a defiled state beside the wall of the courtyard, and my face was uncovered.
translation:
  language: hi
  text: और उसी रात, उसे दफनाकर वहाँ से निकलने के बाद, मैं अशुद्ध अवस्था[a] में आँगन की दीवार के पास सोने के लिए लेट गया, और मेरा चेहरा ढका हुआ नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अशुद्ध’ से यहाँ शव को दफनाने के कारण हुई अनुष्ठानिक अशुद्धता अभिप्रेत है, नैतिक दोष नहीं।
    reason: मेμιαμμένος के अनुष्ठानिक अर्थ को स्पष्ट करना और उसे नैतिक अशुद्धता से अलग करना।
lexical_decisions:
- source_word: ἐν αὐτῇ τῇ νυκτί
  choice: उसी रात
  rationale: यह स्वाभाविक आधुनिक हिन्दी में संकेतवाचक बल और उसी रात होने की तात्कालिकता को सुरक्षित रखता है।
- source_word: ἀνέλυσα
  choice: लौटने के बाद
  rationale: ἀναλύω यहाँ दफनाने के बाद वहाँ से प्रस्थान या वापस आने का बोध देता है। प्रसंग में हिन्दी का ‘लौटने के बाद’ क्रिया-क्रम को सहज बनाता है, यद्यपि यूनानी क्रिया अपने आप में गंतव्य स्पष्ट नहीं करती।
- source_word: θάψας
  choice: उसे दफनाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई दफनाने की क्रिया बताता है; ‘उसे’ का कर्म पूर्व प्रसंग से निहित है।
- source_word: ἐκοιμήθην
  choice: सोने के लिए लेट गया
  rationale: यह रूप सोने अथवा सोने के लिए लेटने का अर्थ दे सकता है; स्थल-वर्णन के साथ ठोस क्रिया ‘लेट गया’ अधिक स्वाभाविक है।
- source_word: μεμιαμμένος
  choice: अशुद्ध अवस्था में
  rationale: पूर्ण कृदंत दफनाने से उत्पन्न बनी हुई धार्मिक-अनुष्ठानिक अशुद्धता की अवस्था दर्शाता है, नैतिक दोष नहीं।
- source_word: παρὰ τὸν τοῖχον τῆς αὐλῆς
  choice: आँगन की दीवार के पास
  rationale: स्थान-संबंधी यूनानी पदबंध का सीधा और आधुनिक हिन्दी रूप।
- source_word: τὸ πρόσωπόν μου ἀκάλυπτον ἦν
  choice: मेरा चेहरा खुला हुआ था
  rationale: πρόσωπον का स्पष्ट अर्थ ‘चेहरा’ है, ‘सिर’ नहीं; ‘खुला हुआ’ अगले प्रसंग के लिए आवश्यक शारीरिक स्थिति बनाए रखता है।
theological_decisions:
- issue: दफनाने के कारण अनुष्ठानिक अशुद्धता
  choice: अशुद्ध अवस्था में
  alternative: अपवित्र अवस्था में
  rationale: ‘अशुद्ध’ धार्मिक-अनुष्ठानिक स्थिति को व्यक्त करता है और नैतिक पाप का अनावश्यक अर्थ आरोपित नहीं करता; पादटिप्पणी इस भेद को स्पष्ट करती है।
- issue: ἀνέλυσα में गमन की दिशा
  choice: लौटने के बाद
  alternative: वहाँ से निकलने के बाद
  rationale: प्रसंग में दफनाने के स्थान से घर/आँगन की ओर लौटना स्वाभाविक है, पर मूल क्रिया दिशा को पूर्णतः निश्चित नहीं करती; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। ‘दफनाकर’, ‘आँगन’ और ‘चेहरा खुला हुआ’ सामान्य पाठक के लिए सहज हैं। मूल की कृदंतीय रचना को स्वाभाविक हिन्दी क्रिया-क्रम में बदला गया है, जबकि धार्मिक अशुद्धता और गमन-दिशा की सूक्ष्मता पादटिप्पणी में सुरक्षित रखी गई है।
