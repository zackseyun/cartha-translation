base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/005.yaml
  text: And when I returned[b][a], I washed myself and ate my bread in sorrow.
translation:
  language: hi
  text: लौटकर मैंने स्नान किया[a] और शोक में अपनी रोटी खाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में केवल “मैंने स्नान किया” है। प्रसंग में सम्भवतः मृत शरीर के कारण हुई अशुद्धि के बाद किए जाने वाले स्नान की बात है; समानांतर सामी पाठ-परम्परा शुद्धि के इस प्रसंग को अधिक स्पष्ट करती है।
    reason: cultural_note
  - marker: b
    text: या “अपना भोजन किया।” यूनानी में शाब्दिक रूप से “अपनी रोटी खाई” है; “रोटी” का अर्थ सामान्य भोजन भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψας
  choice: लौटने के बाद
  rationale: एओरिस्ट कृदन्त मुख्य क्रियाओं से पहले हुई क्रिया बताता है; यह हिन्दी में स्वाभाविक रूप से घटनाक्रम स्पष्ट करता है।
- source_word: ἐλουσάμην
  choice: मैंने स्नान किया
  rationale: मध्यवाच्य अपने को धोने या स्नान करने का भाव देता है। प्रसंग शुद्धि-स्नान की ओर संकेत करता है, पर यूनानी पाठ स्वयं केवल स्नान का उल्लेख करता है।
- source_word: ἤσθιον
  choice: खाई
  rationale: अपूर्ण भूतकाल को इस क्रमिक कथन में सामान्य भूतकाल से व्यक्त करना स्वाभाविक है।
- source_word: τὸν ἄρτον μου
  choice: अपनी रोटी
  rationale: ἄρτος का प्रत्यक्ष अर्थ ‘रोटी’ है, यद्यपि यह व्यापक अर्थ में भोजन भी बता सकता है; मुख्य पाठ में ठोस यूनानी अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ἐν λύπῃ
  choice: शोक में
  rationale: λύπη दुःख, शोक या संताप दर्शाता है; मृतक को दफनाने के प्रसंग में ‘शोक’ स्वाभाविक और अर्थ-संगत है।
theological_decisions:
- issue: स्नान को स्पष्ट रूप से धार्मिक शुद्धि-स्नान कहना या न कहना
  choice: मुख्य पाठ में केवल ‘मैंने स्नान किया’ रखा गया।
  alternative: मैंने शुद्धि के लिए स्नान किया / मैंने अपने को शुद्ध किया
  rationale: प्रसंग और समानांतर सामी परम्परा अशुद्धि के बाद शुद्धि की पृष्ठभूमि सुझाते हैं, पर यूनानी क्रिया इसे स्पष्ट रूप से धार्मिक शुद्धि नहीं कहती। इसलिए व्याख्यात्मक विस्तार को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्नान किया’ सामान्य पाठक के लिए स्वाभाविक है और यूनानी की अस्पष्टता बनाए रखता है; ‘अपनी रोटी’ मूल की ठोस अभिव्यक्ति को सुरक्षित रखता है।
