translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। आरम्भिक καί को 'और' से बनाए रखा गया है; अगले καί को हिन्दी में स्वाभाविक क्रम के लिए अलग से दोहराने के बजाय 'तब' से जोड़ा गया है। 'कब्र' प्रसंग से निहित है, पर यूनानी में स्पष्ट नहीं, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
