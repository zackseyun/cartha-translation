translation:
  language: hi
  text: और मैं रोया। जब सूर्य डूब गया, तब मैं गया और खोदकर उसे दफ़ना दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσα
  choice: मैं रोया
  rationale: κλαίω के अओरिस्ट रूप का सीधा और स्वाभाविक अर्थ है कि वक्ता रोया; यह औपचारिक शोक मनाने का अतिरिक्त भाव नहीं जोड़ता।
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: जब सूर्य डूब गया
  rationale: यह अभिव्यक्ति सूर्यास्त को पूर्ण हुई घटना के रूप में दिखाती है और उसके बाद हुई दफ़नाने की क्रिया का समय बताती है।
- source_word: ᾠχόμην
  choice: मैं गया
  rationale: कथा के इस संदर्भ में क्रिया का सरल अर्थ जाना या प्रस्थान करना है; 'मैं गया' आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὀρύξας
  choice: खोदकर
  rationale: अओरिस्ट कृदन्त का शाब्दिक अर्थ 'खोदने के बाद/खोदकर' है। यूनानी में खोदी गई वस्तु व्यक्त नहीं है, इसलिए हिन्दी में भी अनावश्यक रूप से 'कब्र' नहीं जोड़ी गई।
- source_word: ἔθαψα αὐτόν
  choice: उसे दफ़ना दिया
  rationale: θάπτω का सामान्य अर्थ दफ़नाना है। αὐτόν का पुल्लिंग संदर्भ हिन्दी के स्वाभाविक सर्वनाम 'उसे' से व्यक्त होता है।
