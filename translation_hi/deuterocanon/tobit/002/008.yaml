base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/008.yaml
  text: And the neighbors were mocking[a], saying, “He is no longer afraid of being put to death over this matter; he ran away, and look, he is burying the dead again.”
translation:
  language: hi
  text: और पड़ोसी उसका मज़ाक उड़ा रहे थे[a]। वे कह रहे थे, “उसे अब इस मामले के कारण मार डाले जाने का डर नहीं है! वह भाग गया था, और देखो, वह फिर मृतकों को दफ़ना रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: टोबीत की अन्य पाठ-परंपराएँ यहाँ बहुत भिन्न हैं। अरामी पांडुलिपि पर आधारित परोक्ष इब्रानी प्रत्यनुवाद में पड़ोसियों के उपहास और मृतकों को दफ़नाने के बजाय हन्ना कहती है कि टोबीत द्वारा किए गए दया और धार्मिकता के कार्य उसके संकट और अपमान के समय उसके काम नहीं आए।
    reason: textual_variant
lexical_decisions:
- source_word: οἱ πλησίον
  choice: पड़ोसी
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण निकट रहने वाले लोगों को दर्शाता है; आधुनिक हिन्दी में ‘पड़ोसी’ स्वाभाविक और सटीक है।
- source_word: ἐνέγελων
  choice: मज़ाक उड़ा रहे थे
  rationale: अपूर्ण भूतकाल लगातार या बार-बार हो रही उपहासपूर्ण क्रिया को दर्शाता है; यह प्रयोग उस पक्ष को सुरक्षित रखता है।
- source_word: Οὐκέτι φοβεῖται
  choice: अब इसे ... डर नहीं रहा
  rationale: οὐκέτι के ‘अब और नहीं’ भाव और वर्तमानकालीन भय की अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: φονευθῆναι
  choice: मार डाले जाने
  rationale: कर्मवाच्य क्रियार्थक संज्ञा किसी के द्वारा प्राण लिए जाने को बताती है। ‘मृत्युदंड’ कहना यूनानी पाठ से अधिक कानूनी विशिष्टता जोड़ देता।
- source_word: περὶ τοῦ πράγματος τούτου
  choice: इस बात के कारण
  rationale: यहाँ पदबंध पूर्ववर्ती कार्य के संबंध में हत्या के भय का कारण बताता है; हिन्दी में यह अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἀπέδρα
  choice: भाग गया था
  rationale: अतीत में हुई उसकी पूर्ववर्ती पलायन की घटना को दर्शाता है और पड़ोसियों के ताने का सीधा स्वर बनाए रखता है।
- source_word: καὶ ἰδοὺ
  choice: और देखो
  rationale: ἰδού ध्यान खींचने वाला कथन-सूचक है; ‘देखो’ आधुनिक हिन्दी में उसकी तात्कालिकता बनाए रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: कार्य की पुनरावृत्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: θάπτει τοὺς νεκρούς
  choice: मरे हुओं को दफ़ना रहा है
  rationale: प्रत्यक्ष कथन में वर्तमानकाल और ‘देखो’ के साथ जारी क्रिया का भाव है; ‘मरे हुओं’ से बहुवचन का सामूहिक अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: यूनानी साक्ष्य और भिन्न सामी पाठ-परंपरा के बीच चयन
  choice: मुख्य पाठ में यूनानी साक्ष्य के अनुसार पड़ोसियों का उपहास और मृतकों को दफ़नाने का उल्लेख रखा गया है।
  alternative: परोक्ष इब्रानी प्रत्यनुवाद में हन्ना टोबीत से कहती है कि उसके दया और धार्मिकता के काम संकट और अपमान में उसके काम नहीं आए।
  rationale: दिया गया प्राथमिक और उच्च-विश्वास वाला स्रोत स्वेट का यूनानी पाठ है। उल्लिखित इब्रानी पाठ प्राचीन इब्रानी साक्ष्य नहीं, बल्कि अरामी पांडुलिपि से किया गया उन्नीसवीं सदी का प्रत्यनुवाद है; इसलिए वह मुख्य पाठ को प्रतिस्थापित नहीं करता, पर पर्याप्त भिन्नता के कारण पादटिप्पणी में दर्ज होना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। पड़ोसियों के ताने की मौखिक तीक्ष्णता बनाए रखने के लिए प्रत्यक्ष कथन में ‘देखो’ और विस्मयादिबोधक चिह्न का प्रयोग किया गया है। ‘दफ़ना’ प्रचलित आधुनिक हिन्दी है और मृतकों के संस्कार के संदर्भ में स्पष्ट है।
