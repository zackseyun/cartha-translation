base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/006.yaml
  text: And the angel said to him[a], “I will go with you, and I am familiar with the way, and I have lodged with Gabael our brother.”
translation:
  language: hi
  text: और स्वर्गदूत ने उससे कहा, “मैं तुम्हारे साथ चलूँगा। मैं इस मार्ग से भली-भाँति परिचित हूँ[a], और हमारे भाई गबाएल के यहाँ ठहर चुका हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे इस मार्ग का अच्छा अनुभव है,” अर्थात् “मैं इस रास्ते को अच्छी तरह जानता हूँ।” सामी समानांतर पाठ भी सभी रास्तों को जानने की बात कहकर यही भाव स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύσομαι μετὰ σοῦ
  choice: मैं तुम्हारे साथ चलूँगा
  rationale: भविष्यकालीन क्रिया और μετά के सहचर्य-भाव को स्वाभाविक आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: τῆς ὁδοῦ ἐμπειρῶ
  choice: मैं इस मार्ग से भली-भाँति परिचित हूँ
  rationale: ἐμπειρῶ यहाँ मार्ग के व्यावहारिक ज्ञान या अनुभव को सूचित करता है। ‘परिचित हूँ’ यूनानी की संक्षिप्त अभिव्यक्ति को स्पष्ट रखता है, जबकि ‘भली-भाँति’ अनुभवजन्य परिचय का बल दर्शाता है।
- source_word: ὁδός
  choice: मार्ग
  rationale: यात्रा के प्रसंग में ὁδός का अर्थ रास्ता, मार्ग या यात्रा-पथ हो सकता है। ‘मार्ग’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: παρὰ Γαβαὴλ
  choice: गबाएल के यहाँ
  rationale: व्यक्ति के नाम के साथ παρά और ठहरने की क्रिया का आशय उसके घर या निवास पर ठहरना है; हिन्दी में ‘के यहाँ’ सबसे स्वाभाविक है।
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: हमारे भाई
  rationale: ἀδελφός का सीधा अर्थ ‘भाई’ है। यह यहाँ सहजातीय या संबंधी भी हो सकता है, पर मूल की पारिवारिक भाषा को बिना संकीर्ण व्याख्या के सुरक्षित रखा गया है।
- source_word: ηὐλίσθην
  choice: ठहर चुका हूँ
  rationale: αὐλίζομαι का अर्थ ठहरना, डेरा करना या रात बिताना है। पूर्ण भाव को ‘ठहर चुका हूँ’ सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὁ ἄγγελος की पहचान
  choice: स्वर्गदूत
  alternative: दूत
  rationale: तोबीत के कथानक में यह अलौकिक दूत है; ‘स्वर्गदूत’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट करता है, जबकि केवल ‘दूत’ मानवीय संदेशवाहक भी समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस मार्ग’ प्रसंग में निश्चित यात्रा-पथ को दर्शाता है। ‘हमारे भाई’ को जैविक भाई तक सीमित न करते हुए यूनानी की संभावित संबंधी या सहजातीय अर्थ-व्याप्ति खुली रखी गई है।
