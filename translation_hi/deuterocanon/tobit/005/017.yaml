  yaml_path: translation/deuterocanon/tobit/005/017.yaml
  text: They agreed to this[a]. Then he said to Tobiah, “Get ready for the journey, and may your journey be prosperous.” So his son prepared what was needed for the journey. Then his father said to him, “Go with the man, and may God, who dwells in heaven, make your journey prosper, and may his angel go with you.” So both went out to depart[b], and the boy’s dog went with them.
translation:
  language: hi
  text: वे इस बात पर सहमत हो गए। तब उसने तोबियाह से कहा, “यात्रा के लिए तैयार हो जाओ; तुम दोनों की यात्रा सफल हो[a]।” तब उसके बेटे ने यात्रा के लिए आवश्यक सामान तैयार किया। उसके पिता ने उससे कहा, “इस मनुष्य के साथ जाओ। स्वर्ग में निवास करने वाला परमेश्वर तुम दोनों की यात्रा सफल करे, और उसका स्वर्गदूत[b] तुम दोनों के साथ जाए।” तब वे दोनों जाने के लिए निकल पड़े, और लड़के का कुत्ता भी उनके साथ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में दोनों यात्रियों की यात्रा की सफलता के लिए की गई कामना व्यक्त होती है; इसका अनुवाद “तुम दोनों का मार्ग सफल हो” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का सामान्य अर्थ “दूत” भी हो सकता है, पर तोबित की कथा में यहाँ स्वर्गीय दूत का आशय सबसे अधिक संभावित है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐδόκησαν οὕτως
  choice: वे इस बात पर सहमत हो गए
  rationale: संदर्भ में यह प्रस्तावित व्यवस्था पर सहमति को व्यक्त करता है; केवल प्रसन्न होने का भाव यहाँ पर्याप्त नहीं है।
- source_word: Ἔτοιμος γίνου πρὸς τὴν ὁδόν
  choice: यात्रा के लिए तैयार हो जाओ
  rationale: आज्ञार्थक बल और आगामी यात्रा—दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: εὐοδωθεῖητε
  choice: तुम्हारी यात्रा सफल हो
  rationale: यूनानी इच्छार्थक रूप यात्रा में सफलता की कामना व्यक्त करता है; हिन्दी में यह संक्षिप्त आशीर्वचन स्वाभाविक है।
- source_word: τὰ πρὸς τὴν ὁδόν
  choice: यात्रा के लिए आवश्यक सामान
  rationale: वाक्यांश यात्रा की तैयारियों या सामग्री की ओर संकेत करता है, पर वस्तुओं को विशेष रूप से नहीं बताता।
- source_word: ὁ ἐν τῷ οὐρανῷ οἰκῶν θεός
  choice: स्वर्ग में निवास करनेवाला परमेश्वर
  rationale: वर्णनात्मक कृदन्त और मूल का गरिमापूर्ण स्वर सुरक्षित रहता है।
- source_word: εὐοδώσει τὴν ὁδὸν ὑμῶν
  choice: तुम दोनों की यात्रा सफल करे
  rationale: बहुवचन सर्वनाम को तोबियाह और उसके साथी के संदर्भ में स्पष्ट किया गया है; εὐοδόω का यात्रा-सफलता संबंधी अर्थ बना रहता है।
- source_word: ὁ ἄγγελος αὐτοῦ συμπορευθήτω ὑμῖν
  choice: उसका स्वर्गदूत तुम दोनों के साथ जाए
  rationale: तोबित की कथा में ἄγγελος एक स्वर्गीय प्राणी है; συμπορεύομαι का साथ यात्रा करने का भाव सहज हिन्दी में व्यक्त हुआ है।
- source_word: ἐξῆλθαν ἀμφότεροι ἀπελθεῖν
  choice: वे दोनों वहाँ से जाने को निकले
  rationale: यूनानी के ‘निकले’ और ‘जाने’ वाले कुछ हद तक पुनरुक्त कथन को अस्वाभाविक बनाए बिना सुरक्षित रखा गया है।
- source_word: ὁ κύων τοῦ παιδαρίου
  choice: लड़के का कुत्ता
  rationale: παιδάριον तोबियाह के लिए प्रयुक्त लघु/युवा-सूचक संज्ञा है; ‘लड़का’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ἄγγελος का आशय
  choice: स्वर्गदूत
  alternative: दूत
  rationale: शब्द सामान्यतः ‘दूत’ भी हो सकता है, पर तोबित की कथा में उसका स्वर्गीय आशय सबसे अधिक संभावित है। फुटनोट शाब्दिक विकल्प को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। पिता के पुत्र को संबोधन में ‘तुम’ और दोनों यात्रियों के लिए ‘तुम दोनों’ प्रयोग किया गया है। ‘स्वर्गदूत’ कथानक-संदर्भ को स्पष्ट करता है, जबकि फुटनोट मूल शब्द की व्यापकता बनाए रखता है।
