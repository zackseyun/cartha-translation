base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/002.yaml
  text: But how will I be able to get the money[b][a], since I do not know him?
translation:
  language: hi
  text: लेकिन मैं वह धन कैसे ले पाऊँगा,[a] जबकि मैं उसे जानता ही नहीं?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘वह चाँदी’ है; यहाँ आशय सुरक्षित रखने के लिए सौंपे गए धन से है।
    reason: lexical_alternative
  - marker: b
    text: 'समानांतर सामी परंपरा इस विचार को विस्तार से कहती है: ‘मैं गबाएल से धन कैसे ले सकूँगा? वह मुझे नहीं पहचानेगा और मैं उसे नहीं पहचानता।’ इससे स्पष्ट होता है कि दोनों एक-दूसरे से परिचित नहीं थे।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: लेकिन
  rationale: यह विरोधसूचक अव्यय पिछली बात के उत्तर में व्यावहारिक कठिनाई प्रस्तुत करता है; आधुनिक हिन्दी में ‘लेकिन’ स्वाभाविक है।
- source_word: πῶς δυνησομαι
  choice: कैसे ले पाऊँगा
  rationale: ‘कैसे’ प्रश्न की व्यावहारिकता और ‘पाऊँगा’ δύναμαι के भविष्यकालीन सामर्थ्य—दोनों को व्यक्त करता है।
- source_word: λαβεῖν
  choice: ले
  rationale: संदर्भ में जमा धन वापस प्राप्त करने की बात है। ‘ले’ मूल क्रिया के व्यापक अर्थ को बनाए रखता है और हिन्दी में सहज है।
- source_word: τὸ ἀργύριον
  choice: वह धन
  rationale: ἀργύριον का शाब्दिक अर्थ ‘चाँदी’ भी हो सकता है, पर यहाँ सुरक्षित रखने के लिए सौंपे गए धन का उल्लेख है। ‘वह’ पूर्वोक्त धन की निश्चितता दर्शाता है।
- source_word: καὶ
  choice: जबकि
  rationale: ग्रीक में औपचारिक रूप से ‘और’ है, पर यहाँ अगला वाक्यांश उठाई गई कठिनाई की परिस्थिति बताता है। ‘जबकि’ संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, उसे कठोर कारणात्मक निष्कर्ष में नहीं बदलता।
- source_word: οὐ γινώσκω αὐτόν
  choice: मैं उसे जानता ही नहीं
  rationale: यह उस व्यक्ति से परिचय या उसकी पहचान न होने को दर्शाता है। ‘ही’ प्रश्न में निहित कठिनाई पर स्वाभाविक बल देता है।
