  text: And he said to him[a], “Go, and do not delay.”
translation:
  language: hi
  text: और उसने उससे[a] कहा, “जाओ और देर मत करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी: “जाओ और देर मत करो।” इस खंड के सामी समानांतर सामग्री में आसपास के पदों में अधिक विस्तार मिलता है, पर यह आदेश स्वयं सीधा है और यहाँ अनुवाद में कोई महत्वपूर्ण परिवर्तन नहीं करता।'
    reason: cross_reference
lexical_decisions:
- source_word: Πορεύου
  choice: जाओ
  rationale: πορεύομαι का आज्ञार्थक रूप यहाँ प्रस्थान करने की सीधी आज्ञा देता है। “जाओ” संक्षिप्त, स्वाभाविक और मूल यूनानी के अनुरूप है।
- source_word: μὴ χρονίσῃς
  choice: देर मत करो
  rationale: χρονίζω का अर्थ देर करना या समय लगाना है। “देर मत करो” आधुनिक हिन्दी में स्पष्ट है और अनावश्यक पुरातनता के बिना निषेध का भाव बनाए रखता है।
- source_word: καὶ
  choice: और
  rationale: यह संयोजक पिछले कथन को आज्ञा से जोड़ता है; “और” यूनानी समन्वय को बिना अतिरिक्त कालगत अर्थ जोड़े सुरक्षित रखता है।
- source_word: εἶπεν αὐτῷ
  choice: उसने उससे कहा
  rationale: यह सामान्य कथात्मक अभिव्यक्ति है। यूनानी की तरह कर्ता और कर्म को सर्वनामों में ही रखते हुए संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
