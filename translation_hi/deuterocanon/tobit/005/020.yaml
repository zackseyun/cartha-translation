  text: For as it has been given to us by the Lord to live, this is enough for us.
translation:
  language: hi
  text: क्योंकि प्रभु की ओर से हमें जीने के लिए जो दिया गया है, वही हमारे लिए पर्याप्त है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς γὰρ
  choice: क्योंकि
  rationale: γάρ के व्याख्यात्मक कारणबोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ὡς को अलग से शब्दशः रखने पर हिन्दी असहज होती।
- source_word: δέδοται
  choice: वरदान मिला है
  rationale: पूर्णकालिक कर्मवाच्य के उस प्राप्त और अब भी विद्यमान परिणाम को व्यक्त करता है। 'वरदान' से देने की धारणा स्पष्ट होती है, जबकि इसे अत्यधिक तकनीकी नहीं बनाया गया।
- source_word: ἡμῖν
  choice: हमें
  rationale: प्राप्तकर्ता को सूचित करने वाले यूनानी सम्प्रदान कारक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ζῇν
  choice: जीने का
  rationale: क्रियार्थक infinitive को क्रियात्मक ही रखता है; इसे केवल अमूर्त 'जीवन' में नहीं बदलता।
- source_word: παρὰ τοῦ κυρίου
  choice: प्रभु की ओर से
  rationale: παρά के संबंध कारक द्वारा व्यक्त स्रोत को सुरक्षित रखता है और जीवन के दाता के रूप में प्रभु को स्पष्ट करता है।
- source_word: τοῦτο
  choice: वही
  rationale: पीछे बताए गए, प्रभु से मिले जीने के वरदान की ओर स्पष्ट रूप से संकेत करता है।
- source_word: ἱκανὸν
  choice: पर्याप्त
  rationale: संतोषजनक मात्रा अथवा sufficiency का अर्थ गरिमापूर्ण और सहज हिन्दी में देता है।
- source_word: ὑπάρχει
  choice: है
  rationale: ἱκανὸν ... ὑπάρχει की विधेयात्मक अभिव्यक्ति का स्वाभाविक हिन्दी रूप; 'अस्तित्व रखता है' यहाँ कृत्रिम होता।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: सन्दर्भ में जीवन का स्रोत परमेश्वर है। 'प्रभु' श्रद्धापूर्ण और प्रचलित बाइबलीय संबोधन है तथा अतिरिक्त सांप्रदायिक विशिष्टता नहीं जोड़ता।
- issue: जीवन को दैवी देन के रूप में व्यक्त करना
  choice: जीने का जो वरदान मिला है
  alternative: हमें जीना दिया गया है
  rationale: यूनानी कर्मवाच्य और दैवी स्रोत दोनों सुरक्षित रहते हैं, साथ ही हिन्दी स्वाभाविक बनती है। 'वरदान' देने की सकारात्मक धारणा व्यक्त करता है, पर जीवन की अवधि या स्वरूप के विषय में अतिरिक्त दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की कारणसूचक संरचना तथा प्रभु से प्राप्त वर्तमान जीवन की पर्याप्तता पर बल सुरक्षित है।
