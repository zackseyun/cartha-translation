  text: And Tobit said to him, “Brother, from what tribe and from what homeland are you? Show me.”
translation:
  language: hi
  text: और तोबीत ने उससे कहा, “भाई, तुम किस गोत्र के हो और किस देश के रहनेवाले हो? मुझे बताओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλῆς
  choice: गोत्र
  rationale: यहाँ वंशगत इस्राएली पहचान का संकेत है; ‘गोत्र’ आधुनिक हिन्दी बाइबल-परंपरा में सटीक और सहज है।
- source_word: πατρίδος
  choice: देश
  rationale: πατρίς मूल-स्थान, स्वदेश या पैतृक प्रदेश को दर्शा सकता है; प्रश्न में ‘किस देश के रहनेवाले’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπόδειξόν μοι
  choice: मुझे बताओ
  rationale: क्रिया का मूल भाव ‘दिखाना/स्पष्ट कराना’ है, पर पहचान संबंधी मौखिक प्रश्न के उत्तर में हिन्दी का स्वाभाविक अर्थ ‘बताओ’ है।
