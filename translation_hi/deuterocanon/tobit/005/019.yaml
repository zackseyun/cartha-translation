lexical_decisions:
- source_word: ἀργύριον τῷ ἀργυρίῳ
  choice: चाँदी को चाँदी के मुकाबले
  rationale: दोनों बार आए ठोस शब्द ‘चाँदी’ को बनाए रखा गया है। ‘के मुकाबले’ दत्तिव और इस संक्षिप्त कहावत के तुलनात्मक भाव को व्यक्त करता है, जबकि उसकी असामान्यता को पूरी तरह मिटाता नहीं।
- source_word: μὴ φθάσαι
  choice: मत आँको
  rationale: φθάνω का मूल भाव ‘आगे पहुँचना/बढ़ जाना’ है, पर यहाँ मुहावरे में धन को निर्णायक मूल्य न देने का आशय है। ‘मत आँको’ आधुनिक हिन्दी में मूल्यांकन का भाव देता है; शाब्दिक कठिनाई पादटिप्पणी में रखी गई है।
- source_word: περίψημα
  choice: कूड़ा
  rationale: शब्द का अर्थ पोंछकर या खुरचकर फेंकी जाने वाली वस्तु, मैल अथवा अपशिष्ट है। ‘कूड़ा’ साधारण पाठक के लिए स्पष्ट है और बच्चे के सामने धन के तीव्र अवमूल्यन को बनाए रखता है।
- source_word: τοῦ παιδίου ἡμῶν
  choice: हमारे बच्चे की तुलना में
  rationale: ग्रीक संबंधकारक संक्षिप्त और मुहावरेदार है। हिन्दी में यह विस्तार स्पष्ट करता है कि चाँदी को बच्चे के सापेक्ष तुच्छ माना गया है, बिना बच्चे के लिए किसी प्रायश्चित्त अथवा फिरौती का विशिष्ट अर्थ आरोपित किए।
- source_word: γένοιτο
  choice: ठहरे
  rationale: इच्छासूचक optative को ‘ठहरे’ से व्यक्त किया गया है, जो संकल्प/कामना का भाव और गरिमापूर्ण आधुनिक शैली दोनों बनाए रखता है।
theological_decisions:
- issue: धन और बच्चे के मूल्य की तुलना करने वाला संक्षिप्त यूनानी मुहावरा
  choice: धन को बच्चे की तुलना में कूड़ा समझने का भाव
  alternative: चाँदी को चाँदी से आगे न बढ़ने दो, बल्कि वह हमारे बच्चे के लिए अपमार्जन ठहरे
  rationale: वाक्य सिद्धान्तगत विवाद नहीं, बल्कि संकट में धन की अपेक्षा बच्चे के जीवन को अधिक मूल्य देने वाला कथन है। मुख्य पाठ अर्थ को सुबोध बनाता है, जबकि पादटिप्पणी मूल की शाब्दिक असामान्यता और संभावित अर्थ-छाया बचाती है।
