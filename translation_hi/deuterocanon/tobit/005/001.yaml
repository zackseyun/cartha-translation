  text: And Tobiah answered him[a], “Father, I will do everything that you have commanded me.”
translation:
  language: hi
  text: और तोबियाह ने उसे उत्तर दिया[a], “पिताजी, आपने मुझे जो कुछ करने की आज्ञा दी है, वह सब मैं करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समानांतर सामी-रूप वाले पाठ में स्पष्ट रूप से है, “तोबियाह ने अपने पिता को उत्तर दिया ... आपने मुझे जो कुछ आज्ञा दी है, मेरे पिता, वह सब मैं करूँगा।” मुख्य यूनानी पाठ में केवल “उसे उत्तर दिया” और सम्बोधन “पिता” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: उत्तर दिया
  rationale: यह कथात्मक कृदंत संवाद आरम्भ कराता है; हिन्दी में परिमित क्रिया स्वाभाविक है।
- source_word: Τωβίας
  choice: तोबियाह
  rationale: नाम का यह रूप सामी पृष्ठभूमि से मेल खाता है और हिन्दी में सहज है।
- source_word: αὐτῷ
  choice: उसे
  rationale: मुख्य यूनानी पाठ में सर्वनाम है, ‘अपने पिता को’ नहीं; अगले सम्बोधन से उसका संदर्भ स्पष्ट हो जाता है।
- source_word: Πάτερ
  choice: पिताजी
  rationale: सम्बोधन के रूप में यह आधुनिक हिन्दी में स्वाभाविक और आदरपूर्ण है; यूनानी में व्यक्त ‘मेरे’ को नहीं जोड़ा गया।
- source_word: ποιήσω
  choice: मैं करूँगा
  rationale: भविष्यकाल यहाँ आज्ञापालन के संकल्प को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάντα ὅσα
  choice: जो कुछ ... वह सब
  rationale: यह हिन्दी संरचना समग्रता और सम्बन्धवाचक अभिव्यक्ति दोनों को स्पष्ट रूप से बनाए रखती है।
- source_word: ἐντέταλσαί
  choice: आज्ञा दी है
  rationale: यूनानी पूर्णकाल पूर्व में दी गई और अब भी प्रासंगिक आज्ञा को दर्शाता है; हिन्दी पूर्णकाल इसका स्वाभाविक समतुल्य है।
- source_word: μοι
  choice: मुझे
  rationale: यह यूनानी सम्प्रदान कारक का स्वाभाविक हिन्दी रूप है।
