base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/005.yaml
  text: And he said to him[a], “Can I travel with you to Rages of Media[b], and are you familiar with the places?”
translation:
  language: hi
  text: और उसने उससे कहा, “क्या मैं तुम्हारे साथ मादै के रागेस[a] तक जा सकता हूँ? और क्या तुम उन जगहों से परिचित हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक रूप से “मादै के रागेस में” है; यात्रा के इस प्रसंग में इसका आशय गंतव्य, अर्थात “रागेस तक,” जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθῆναι
  choice: जा सकता हूँ
  rationale: πορεύομαι यहाँ किसी स्थान की यात्रा पर जाने को व्यक्त करता है। δύναμαι के साथ ‘जा सकता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और सामर्थ्यसूचक प्रश्न को स्पष्ट रखता है।
- source_word: μετὰ σοῦ
  choice: तुम्हारे साथ
  rationale: यह साथ चलने या यात्रा करने का सीधा अर्थ सुरक्षित रखता है।
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: मादै के रागेस तक
  rationale: यद्यपि ἐν का सामान्य अर्थ ‘में’ है, गति-सूचक क्रिया और यात्रा के इस प्रसंग में यह गंतव्य का बोध कराता है। ‘तक’ हिन्दी में गंतव्य को स्वाभाविक रूप से व्यक्त करता है, जबकि पाठगत विशेषता पादटिप्पणी में सुरक्षित है।
- source_word: Ῥάγοις
  choice: रागेस
  rationale: यह यूनानी स्थान-नाम Ῥάγοις के कर्तृकारक रूप Ῥάγαι का देवनागरी लिप्यंतरण है; हिन्दी में ‘रागेस’ यूनानी उच्चारण के निकट और स्पष्ट है।
- source_word: ἔμπειρος
  choice: परिचित
  rationale: ἔμπειρος अनुभव या व्यावहारिक जानकारी रखने का भाव देता है। स्थानों के संदर्भ में ‘परिचित’ सहज और सटीक है।
- source_word: τῶν τόπων
  choice: उन जगहों
  rationale: बहुवचन τόπων को बहुवचन ‘जगहों’ से रखा गया है। ‘उन’ यात्रा से संबंधित स्थानों की ओर स्वाभाविक संकेत करता है।
