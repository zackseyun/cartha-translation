base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/009.yaml
  text: And he went in and said to his father[a], “Look, I have found someone who will travel with me.” And he said, “Call him to me, so that I may learn what tribe he is from[c][b], and whether he is trustworthy to go with you.”
translation:
  language: hi
  text: और वह भीतर जाकर अपने पिता से बोला, “देखिए, मुझे एक व्यक्ति मिल गया है जो मेरे साथ यात्रा करेगा।” पिता ने कहा, “उसे मेरे पास बुलाओ, ताकि मैं जान लूँ कि वह किस गोत्र का है[a] और क्या वह तुम्हारे साथ जाने के लिए भरोसेमंद है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किस गोत्र का है” यूनानी पाठ में इस्राएली गोत्रीय पहचान के विषय में व्यक्त चिंता को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या “क्या वह तुम्हारे साथ जाने के लिए विश्वासयोग्य है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: भीतर जाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले भीतर जाने की क्रिया दिखाता है; ‘भीतर जाकर’ हिन्दी में क्रम को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। पुत्र द्वारा पिता को संबोधित करने के कारण आदरसूचक ‘देखिए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εὕρηκα
  choice: मुझे ... मिल गया है
  rationale: पूर्णकाल वर्तमान परिणाम पर बल देता है—यात्रा-साथी अब मिल चुका है। हिन्दी का ‘मिल गया है’ इस भाव को सहजता से रखता है।
- source_word: ὃς συμπορεύσεταί μοι
  choice: जो मेरे साथ यात्रा करेगा
  rationale: सहयात्रा का स्पष्ट अर्थ सुरक्षित रहता है और वाक्य सामान्य आधुनिक हिन्दी में सहज है।
- source_word: Φώνησον αὐτὸν πρὸς μέ
  choice: उसे मेरे पास बुलाओ
  rationale: आज्ञार्थक क्रिया बुलाने या अपने पास आने को कहने का अर्थ देती है; यह अनुवाद निकट और स्वाभाविक है।
- source_word: ἐπιγνῶ
  choice: मैं जान सकूँ
  rationale: यह निश्चित रूप से पता लगाने या पहचानने का भाव दे सकता है; संदर्भ में पिता उस व्यक्ति की पृष्ठभूमि जानना चाहता है।
- source_word: ποίας φυλῆς ἐστίν
  choice: वह किस गोत्र का है
  rationale: φυλή इस इस्राएली संदर्भ में वंशगत जनजातीय पहचान बताता है। हिन्दी बाइबलीय प्रयोग में ‘गोत्र’ इस पहचान को ‘परिवार’ जैसे सामान्य शब्द से अधिक ठीक रखता है।
- source_word: πιστὸς
  choice: भरोसेमंद
  rationale: संदर्भ यात्रा के लिए उस व्यक्ति की विश्वसनीयता का है; ‘भरोसेमंद’ व्यावहारिक और नैतिक दोनों आयाम रखता है, बिना अनावश्यक धर्मशास्त्रीय अर्थ जोड़े।
- source_word: τοῦ πορευθῆναι μετὰ σοῦ
  choice: तुम्हारे साथ जाने के लिए
  rationale: यह उस विषय को स्पष्ट करता है जिसमें व्यक्ति को भरोसेमंद होना चाहिए; हिन्दी में यह सीधा और स्वाभाविक है।
theological_decisions:
- issue: φυλή द्वारा व्यक्त सामाजिक-वंशगत पहचान
  choice: गोत्र
  alternative: वंश / कुल
  rationale: यूनानी पाठ में सामान्य पारिवारिक पृष्ठभूमि से अधिक विशिष्ट इस्राएली जनजातीय पहचान का संकेत है। ‘गोत्र’ उस सांस्कृतिक चिंता को सुरक्षित रखता है।
- issue: πιστός का चरित्रगत अर्थ
  choice: भरोसेमंद
  alternative: विश्वासयोग्य / निष्ठावान
  rationale: यहाँ प्रश्न यात्रा-साथी पर व्यावहारिक रूप से भरोसा कर सकने का है, न कि विश्वास-सिद्धांत का; इसलिए ‘भरोसेमंद’ संदर्भानुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक पारिवारिक संबोधन और गरिमापूर्ण कथात्मक शैली। ‘देखिए’ पुत्र से पिता की ओर सम्मान बनाए रखता है; ‘पिता ने कहा’ वक्ता को स्पष्ट करता है, यद्यपि यूनानी में केवल सर्वनाम है।
