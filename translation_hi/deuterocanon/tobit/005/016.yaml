lexical_decisions:
- source_word: ἔτι προσθήσω
  choice: कुछ और भी जोड़ दूँगा
  rationale: ἔτι के अतिरिक्तता-बोध और προσθήσω के भविष्यकालीन ‘जोड़ने’ को स्वाभाविक आधुनिक हिन्दी में साथ व्यक्त करता है।
- source_word: σοι ἐπὶ τὸν μισθόν
  choice: तुम्हारी मज़दूरी में
  rationale: ग्रीक में σοι और ἐπὶ τὸν μισθόν मिलकर पहले से तय पारिश्रमिक में अतिरिक्त भुगतान का अर्थ देते हैं; ‘मज़दूरी’ इस नियुक्ति-संदर्भ में सहज है।
- source_word: ἐὰν
  choice: यदि
  rationale: भविष्य से संबंधित सीधी शर्त को बिना अधिक कठोर बनाए व्यक्त करता है।
- source_word: ὑγιαίνοντες
  choice: स्वस्थ
  rationale: वर्तमान कृदन्त का मूल अर्थ शारीरिक रूप से स्वस्थ या भला-चंगा होना है; ‘स्वस्थ’ इस अर्थ को संक्षेप और स्पष्ट रूप से रखता है।
- source_word: ἐπιστρέψητε
  choice: लौट आओगे
  rationale: यात्रा के संदर्भ में क्रिया का अर्थ वापस आना है; ‘लौट आना’ आधुनिक हिन्दी में स्वाभाविक है।
