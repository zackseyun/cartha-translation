  text: And Tobit said to her[a], “Do not worry, sister; he will return safe and sound, and your eyes will see him.”
translation:
  language: hi
  text: तब तोबीत ने उससे कहा, “चिंता मत करो, बहन[a]; वह सकुशल लौट आएगा, और तुम्हारी आँखें उसे देखेंगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहन” मूल यूनानी का शाब्दिक संबोधन है। यहाँ तोबीत अपनी पत्नी से बात कर रहा है; यह शब्द सगी बहन के अर्थ में नहीं, बल्कि पारिवारिक/दांपत्य संबोधन के रूप में प्रयुक्त हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ λόγον ἔχε
  choice: चिन्ता मत करो
  rationale: यह यूनानी मुहावरा शाब्दिक रूप से ‘बात/मामला रखना’ कहता है, पर प्रसंग में व्याकुल पत्नी को आश्वस्त करने के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘चिन्ता मत करो’ इसका स्वाभाविक अर्थ देता है।
- source_word: ἀδελφή
  choice: बहन
  rationale: मूल यूनानी का शाब्दिक सम्बोधन ‘बहन’ है। यहाँ तोबीत अपनी पत्नी से बोल रहा है; फिर भी स्रोत की पारिवारिक/दाम्पत्य सम्बोधन-शैली को बनाए रखने के लिए ‘पत्नी’ से प्रतिस्थापित नहीं किया गया।
- source_word: ὑγιαίνων
  choice: स्वस्थ
  rationale: कृदन्त का अर्थ स्वस्थ या सकुशल अवस्था में होना है। ‘स्वस्थ लौटेगा’ यात्रा से वापसी के समय उसकी भली दशा को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἐλεύσεται
  choice: लौटेगा
  rationale: क्रिया का मूल अर्थ ‘आएगा’ है, पर पुत्र के घर से यात्रा पर निकलने के प्रसंग में हिन्दी का ‘लौटेगा’ निहित दिशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ ὀφθαλμοί σου ὄψονται αὐτόν
  choice: तुम्हारी आँखें उसे देखेंगी
  rationale: यूनानी में ‘तुम्हारी आँखें’ स्पष्ट रूप से आया है। इसे बनाए रखने से आश्वासन की दृश्यात्मकता और भावात्मक शक्ति सुरक्षित रहती है।
