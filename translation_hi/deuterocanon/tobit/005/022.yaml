  text: For a good angel will go with him, and his journey will be successful, and he will return in good health.
translation:
  language: hi
  text: क्योंकि एक भला स्वर्गदूत उसके साथ जाएगा, उसकी यात्रा सफल होगी, और वह स्वस्थ लौटेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: टोबीत के कथानक में यह किसी मानवीय संदेशवाहक के बजाय स्वर्गीय प्राणी को सूचित करता है; आधुनिक हिन्दी में ‘स्वर्गदूत’ इस आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀγαθὸς
  choice: भला
  rationale: यह विशेषण स्वर्गदूत के अच्छे अथवा हितकारी चरित्र को सीधे व्यक्त करता है। ‘भला’ सरल यूनानी अभिव्यक्ति को अनावश्यक विस्तार दिए बिना बनाए रखता है।
- source_word: συνπορεύσεται
  choice: साथ जाएगा
  rationale: संयुक्त क्रिया का अर्थ किसी के साथ मार्ग पर जाना है। ‘साथ जाएगा’ हिन्दी में स्वाभाविक है और गति का भाव बनाए रखता है।
- source_word: εὐοδωθήσεται
  choice: सफल होगी
  rationale: निष्क्रिय क्रिया यात्रा के अनुकूल और सफल होने का भाव देती है। ‘सफल होगी’ परिणाम का भाव स्पष्ट करती है और मूल के भविष्यकाल को सुरक्षित रखती है।
- source_word: ἡ ὁδὸς αὐτοῦ
  choice: उसकी यात्रा
  rationale: शाब्दिक अर्थ ‘उसका मार्ग’ है, पर इस यात्रा-संदर्भ में अभिप्राय पूरी यात्रा से है; ‘उसकी यात्रा’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: ὑποστρέψει
  choice: लौटेगा
  rationale: क्रिया का सीधा अर्थ वापस आना है। ‘लौटेगा’ संक्षिप्त, स्पष्ट और भविष्यकाल के अनुरूप है।
- source_word: ὑγιαίνων
  choice: स्वस्थ
  rationale: वर्तमान कृदंत लौटते समय स्वस्थ होने की दशा बताता है। ‘स्वस्थ लौटेगा’ स्वास्थ्य के विशिष्ट भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस संदर्भ में ἄγγελος का स्वरूप
  choice: स्वर्गीय प्राणी के अर्थ में ‘स्वर्गदूत’
  alternative: सामान्य अर्थ में ‘दूत’ या ‘संदेशवाहक’
  rationale: टोबीत के व्यापक कथानक में साथ चलने वाला पात्र स्वर्गीय प्राणी है। ‘स्वर्गदूत’ इसी कथात्मक संकेत को व्यक्त करता है, पर उसके कार्य या स्वरूप के बारे में कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। तीनों भविष्यकालीन कथनों की समानांतर संरचना सुरक्षित है। ‘क्योंकि’ γὰρ के कारणसूचक संबंध को बनाए रखता है।
