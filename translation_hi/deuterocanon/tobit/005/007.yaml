  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और संक्षिप्त शैली रखी गई है। यूनानी की संक्षिप्तता सुरक्षित है; पादटिप्पणी में समानांतर विस्तृत परंपरा स्पष्ट की गई है, पर उसे प्राचीन इब्रानी मूलपाठ के रूप में प्रस्तुत नहीं किया गया।
