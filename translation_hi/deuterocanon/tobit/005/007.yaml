base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/007.yaml
  text: And Tobiah said to him[a], “Wait for me, and I will tell my father.”
translation:
  language: hi
  text: और तोबियाह ने उससे कहा[a], “मेरी प्रतीक्षा करो, और मैं अपने पिता को बताऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ संक्षिप्त है: “और तोबियाह ने उससे कहा, ‘मेरी प्रतीक्षा करो, और मैं अपने पिता को बताऊँगा।’” एक समानांतर सामी-रूप साक्ष्य दृश्य का विस्तार करता है: तोबियाह ने अपने पिता को उस व्यक्ति के बारे में बताया जिसे उसने पाया था, और फिर उसे बुलाने बाहर गया। मुख्य पाठ यूनानी स्रोत का अनुसरण करता है; विस्तृत प्रसंग की जानकारी यहाँ दी गई है।'
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπόμεινόν με
  choice: मेरे लिए यहीं ठहरो
  rationale: यह आज्ञार्थक रूप इस प्रसंग में उस व्यक्ति से तब तक वहीं रुकने को कहता है, जब तक तोबियाह अपने पिता से बात करके लौटे। ‘यहीं ठहरो’ स्वाभाविक हिन्दी है; ‘मेरे लिए’ με के संबंध को बनाए रखता है।
- source_word: ἐρῶ
  choice: मैं ... बता दूँ
  rationale: λέγω के भविष्यत् रूप का मूल अर्थ ‘कहूँगा’ है, पर प्रसंग में आशय पिता को मिले हुए व्यक्ति के बारे में सूचना देना है। ‘बता दूँ’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῷ πατρί
  choice: अपने पिता को
  rationale: यूनानी में संबंधवाचक सर्वनाम नहीं है, किंतु सीधी बातचीत और प्रसंग से स्पष्ट है कि तोबियाह अपने ही पिता, तोबित, की बात कर रहा है। हिन्दी में ‘अपने पिता’ स्वाभाविक और संदर्भानुकूल है।
- source_word: Τωβίας
  choice: तोबियाह
  rationale: नाम का यह रूप उसके सामी मूल से मेल खाता है और ‘तोबित’ से पुत्र का भेद भी स्पष्ट रखता है।
