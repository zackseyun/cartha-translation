base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/014.yaml
  text: And he said to him[a], “May you come in health, brother; and do not be angry with me because I sought to learn your tribe and your family. And you indeed turn out to be my brother, from a good and noble lineage. For I knew Ananias and Jathan, the sons of Shemaiah the great, as we used to go together to Jerusalem to worship, bringing the firstborn and the tithes of the produce; and they were not led astray in the error of our brothers. You are from a good root[b], brother.”
translation:
  language: hi
  text: उसने उससे कहा, “भाई, तुम भले-चंगे रहो![a] मुझसे नाराज़ न होना कि मैंने तुम्हारा गोत्र और कुल जानना चाहा। तुम सचमुच उत्तम और भले वंश के मेरे भाई निकले। क्योंकि मैं महान शमायाह के पुत्र हनन्याह और यातान को जानता था; हम साथ-साथ आराधना करने के लिए यरूशलेम जाया करते थे, और पहलौठों तथा उपज के दशमांशों को ले जाते थे। वे हमारे भाइयों[b] के भटकाव में नहीं बहकाए गए। भाई, तुम एक अच्छी जड़ से हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम स्वस्थ होकर आओ।” यह कुशल-मंगल की पारंपरिक शुभकामना है; प्रसंग में इसे “कुशल से जाओ” भी समझा जा सकता है।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से आशय अपने समुदाय या इस्राएली जाति के लोगों से है, केवल सगे पुरुष भाइयों से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑγιαίνων ἔλθοις
  choice: तुम भले-चंगे रहो
  rationale: ग्रीक में शाब्दिक रूप से स्वास्थ्य सहित आने की कामना है। हिंदी में यह स्वाभाविक शुभकामना है, जबकि पादटिप्पणी शाब्दिक दिशा-संबंधी अस्पष्टता सुरक्षित रखती है।
- source_word: φυλήν
  choice: गोत्र
  rationale: इस्राएली वंशगत पहचान के प्रसंग में ‘गोत्र’ φυλή के सामाजिक और वंशावली-संबंधी अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πατριάν
  choice: कुल
  rationale: यह पैतृक घराने या वंश-समूह को सूचित करता है; ‘कुल’ संक्षिप्त, प्रचलित और प्रसंगानुकूल है।
- source_word: τυγχάνεις ἀδελφός μου
  choice: तुम तो मेरे भाई-बन्धु निकले
  rationale: ‘निकले’ खोज के परिणाम का भाव देता है, और ‘भाई-बन्धु’ सगे भाई तक अर्थ सीमित किए बिना पारिवारिक निकटता बनाए रखता है।
- source_word: καλῆς καὶ ἀγαθῆς γενεᾶς
  choice: एक अच्छे और प्रतिष्ठित वंश के
  rationale: दोनों विशेषणों को अलग रूप में रखा गया है; ‘प्रतिष्ठित’ यहाँ नैतिक और सामाजिक उत्तमता का भाव देता है, केवल कुलीन पदवी का नहीं।
- source_word: κοινῶς
  choice: साथ-साथ
  rationale: यह साझा तीर्थयात्रा का सरल और स्वाभाविक हिंदी रूप है।
- source_word: προσκυνεῖν
  choice: आराधना करने
  rationale: यरूशलेम की तीर्थयात्रा के संदर्भ में क्रिया उपासना को दर्शाती है; शारीरिक दण्डवत् का भाव अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: τὰ πρωτότοκα
  choice: पहलौठे
  rationale: यह चढ़ाए जाने वाले प्रथम जन्मे पशुओं के लिए पारंपरिक और संक्षिप्त धार्मिक शब्द है।
- source_word: τὰς δεκάτας τῶν γενημάτων
  choice: उपज के दशमांश
  rationale: यह कृषि-उत्पादन के दसवें भाग को स्पष्ट रखता है और उपज को केवल किसी एक फसल तक सीमित नहीं करता।
- source_word: ἐκ ῥίζης καλῆς
  choice: एक अच्छी जड़ से
  rationale: वंश के लिए प्रयुक्त मूल रूपक को सपाट ‘अच्छे परिवार’ में बदलने के बजाय सुरक्षित रखा गया है।
theological_decisions:
- issue: वंशगत और आत्मीयता-संबंधी शब्दावली
  choice: ‘गोत्र’, ‘कुल’, ‘भाई-बन्धु’, ‘वंश’ और ‘जड़’ जैसे पारिवारिक शब्द बनाए रखे गए
  alternative: सभी संबंधों को सामान्यीकृत करके केवल ‘रिश्तेदार’ या ‘अच्छा परिवार’ कहना
  rationale: पद में इस्राएली वंश, सामुदायिक पहचान और आराधना में निष्ठा पर बल है। मूल की विविध पारिवारिक छवियाँ बनाए रखने से यह सामाजिक-धार्मिक बनावट सुरक्षित रहती है।
- issue: भाई-बन्धुओं की भटकन
  choice: समुदाय के कुछ लोगों की धार्मिक भटकन का संकेत अस्पष्ट ही रखा गया
  alternative: इसे किसी विशेष ऐतिहासिक पंथत्याग या संप्रदाय से स्पष्ट रूप से जोड़ना
  rationale: ग्रीक पाठ केवल ‘हमारे भाइयों की भटकन’ कहता है; किसी विशिष्ट समूह या सिद्धान्त की पहचान जोड़ना स्रोत से आगे जाना होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी अपनाई गई है। वाक्यरचना को अत्यधिक संस्कृतनिष्ठ बनाने से बचते हुए ‘गोत्र’, ‘कुल’, ‘पहलौठे’ और ‘दशमांश’ जैसे प्रसंगगत धार्मिक-वंशावली शब्द सुरक्षित रखे गए हैं।
