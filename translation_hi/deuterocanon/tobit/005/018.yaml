  yaml_path: translation/deuterocanon/tobit/005/018.yaml
  text: But Anna his mother wept and said to Tobit[a], “Why did you send our child away? Is he not the staff of our hand as he goes in and goes out before us?”
translation:
  language: hi
  text: तब उसकी माँ अन्ना रोई और उसने तोबीत से कहा, “तुमने हमारे बच्चे को क्यों भेज दिया? क्या वह हमारे हाथ की लाठी नहीं है, जब वह हमारे सामने आता-जाता है?”[a]
  philosophy: optimal-equivalence
  footnotes:
