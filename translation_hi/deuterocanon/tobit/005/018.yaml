    text: “हमारे हाथ की लाठी” का अर्थ यहाँ “हमारा सहारा” भी हो सकता है। मुख्य पाठ में यूनानी का रूपक बनाए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκλαυσεν
  choice: रो पड़ी
  rationale: κλαίω के भूतकालिक रूप में रोने और विलाप का भाव है। ‘रो पड़ी’ अन्ना की तत्काल भावनात्मक प्रतिक्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξαπέστειλας
  choice: दूर भेज दिया
  rationale: ἐξαποστέλλω किसी को अपने पास से रवाना करने का भाव रखता है। ‘दूर भेज दिया’ अन्ना की दृष्टि से पुत्र के वियोग को स्पष्ट करता है।
- source_word: τὸ παιδίον ἡμῶν
  choice: हमारे बच्चे
  rationale: παιδίον का मूल अर्थ ‘बच्चा’ या ‘बालक’ है। ‘हमारे बच्चे’ मातृस्नेह को बनाए रखता है और आयु अथवा संबंध को मूल से अधिक निर्दिष्ट नहीं करता।
- source_word: ἡ ῥάβδος τῆς χειρὸς ἡμῶν
  choice: हमारे हाथ की लाठी
  rationale: यह कुछ सामी रंग लिए हुए सहारे का रूपक है। शाब्दिक बिंब को बनाए रखने से पाठ की विशिष्ट अभिव्यक्ति सुरक्षित रहती है; इसका आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν τῷ εἰσπορεύεσθαι αὐτὸν καὶ ἐκπορεύεσθαι
  choice: जो ... आता-जाता है
  rationale: यूनानी पदबंध उसके नियमित भीतर आने और बाहर जाने को दर्शाता है। स्वाभाविक हिन्दी का ‘आता-जाता’ वही प्रचलित गतिविधि और लय संक्षेप में व्यक्त करता है।
- source_word: ἐνώπιον ἡμῶν
  choice: हमारे सामने
  rationale: ἐνώπιον का सीधा अर्थ ‘सामने’ या ‘उपस्थिति में’ है। ‘हमारे सामने’ सरल और प्रसंगानुकूल है।
