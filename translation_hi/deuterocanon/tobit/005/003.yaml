translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पिता द्वारा पुत्र को दिए गए एकवचन आदेश के लिए ‘तेरे/ढूँढ़/जा’ का प्रयोग आत्मीय पारिवारिक संबोधन के रूप में किया गया है। यूनानी पाठ में χειρόγραφον के बाद किसी पादटिप्पणी की आवश्यकता नहीं रखी गई, क्योंकि स्रोत-साक्ष्य का निष्कर्ष सीधे ‘लिखित दस्तावेज़’ में व्यक्त है; उपलब्ध अंग्रेज़ी परत में पादटिप्पणी-चिह्न और पादटिप्पणी-सामग्री परस्पर असंगत दिखाई देते हैं।
