base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/003.yaml
  text: And he gave him the written note and said to him[a], “Find for yourself a man who will go with you, and I will give him wages while I live[b]; then go and get the silver.”
translation:
  language: hi
  text: और उसने उसे वह लिखित दस्तावेज़ दिया और उससे कहा, “अपने लिए एक ऐसा आदमी ढूँढ़, जो तेरे साथ यात्रा करे। जब तक मैं जीवित हूँ, मैं उसे मज़दूरी दूँगा। फिर जा और चाँदी[a] ले आ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धन।” यूनानी शब्द ἀργύριον का शाब्दिक अर्थ “चाँदी” है, पर इस प्रसंग में यह जमा किए गए धन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χειρόγραφον
  choice: लिखित दस्तावेज़
  rationale: शब्द का मूल अर्थ हाथ से लिखी हुई वस्तु या लिखत है। प्रसंग में यह जमा धन से जुड़ा पहचान-संबंधी दस्तावेज़ है; ‘लिखित दस्तावेज़’ उसके कानूनी स्वरूप को अनावश्यक रूप से निश्चित किए बिना ठोस अर्थ बनाए रखता है।
- source_word: Ζήτησον σεαυτῷ ἄνθρωπον
  choice: अपने लिए एक ऐसा आदमी ढूँढ़
  rationale: यूनानी में ἄνθρωπον एकवचन है और प्रसंग में पुरुष यात्रा-साथी की बात है। यह हिंदी में स्वाभाविक ढंग से उद्देश्य भी स्पष्ट करता है।
- source_word: συμπορεύσεταί σοι
  choice: जो तेरे साथ यात्रा करे
  rationale: संयुक्त क्रिया साथ चलने या यात्रा करने का बोध देती है। ‘साथ यात्रा करे’ गमन और संगति दोनों को बनाए रखता है।
- source_word: μισθὸν
  choice: मज़दूरी
  rationale: μισθός सेवा या काम के बदले दिए जाने वाले पारिश्रमिक को दर्शाता है; यात्रा-साथी को नियुक्त करने के प्रसंग में ‘मज़दूरी’ उपयुक्त है।
- source_word: ἕως ζῶ
  choice: जब तक मैं जीवित हूँ
  rationale: यह यूनानी वाक्यांश का सीधा और स्वाभाविक हिंदी रूप है तथा भुगतान के आश्वासन की काल-सीमा को खुला ही रखता है।
- source_word: λάβε πορευθεὶς τὸ ἀργύριον
  choice: फिर जा और चाँदी ले आ
  rationale: πορευθείς को स्वाभाविक हिंदी क्रम में ‘फिर जा’ किया गया है। ἀργύριον का ठोस अर्थ ‘चाँदी’ रखा गया है, जबकि पादटिप्पणी प्रसंगगत ‘धन’ का अर्थ बताती है।
