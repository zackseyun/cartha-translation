lexical_decisions:
- source_word: Φυλήν
  choice: गोत्र
  rationale: यह शब्द जनजातीय अथवा व्यापक कुलगत पहचान बताता है; बाइबिलीय वंश-संदर्भ में ‘गोत्र’ स्वाभाविक और सटीक है।
- source_word: πατριὰν
  choice: वंश
  rationale: यह पारिवारिक उद्गम या वंश-परंपरा का बोध कराता है और ‘गोत्र’ के साथ जुड़े वंशावली-संबंधी प्रश्न को स्पष्ट रखता है।
- source_word: μίσθιον
  choice: मज़दूर
  rationale: यह वेतन पर रखे गए व्यक्ति को दर्शाता है। ‘मज़दूर’ आधुनिक और सहज है; प्रश्न की संरचना से उसके भाड़े पर साथ जाने वाले व्यक्ति होने का अर्थ स्पष्ट होता है।
- source_word: συμπορεύσεται
  choice: साथ यात्रा करेगा
  rationale: क्रिया का अर्थ किसी के साथ मार्ग पर जाना है; ‘साथ यात्रा करेगा’ इस प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: Βούλομαι
  choice: मैं जानना चाहता हूँ
  rationale: यूनानी उत्तर में कर्म लुप्त है—शाब्दिक रूप से ‘मैं चाहता हूँ।’ पिछले प्रश्न से ‘जानना’ निहित है, इसलिए इसे मुख्य पाठ में स्पष्ट किया गया है और पादटिप्पणी में मूल की संक्षिप्तता बताई गई है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: शाब्दिक अर्थ ‘भाई’ है और यहाँ यह विनम्र संबोधन के रूप में प्रयुक्त हुआ है; पारदर्शिता के लिए इसे बनाए रखा गया है।
