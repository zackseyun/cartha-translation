  text: उसने उससे कहा, “क्या तुम गोत्र और वंश जानना चाहते हो, या ऐसा व्यक्ति जो मज़दूरी पर रखा गया हो और तुम्हारे पुत्र के साथ यात्रा करे?” तब तोबीत ने उससे कहा, “मैं जानना चाहता हूँ, भाई[a]।”
