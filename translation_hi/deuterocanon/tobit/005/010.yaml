  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। छोटे यूनानी वाक्यों का क्रम सुरक्षित है; दूसरे वाक्य में ‘दोनों’ स्वाभाविक हिन्दी और पारस्परिक अर्थ की स्पष्टता के लिए जोड़ा गया है।
