base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/010.yaml
  text: And he called him[a], and he went in, and they greeted one another.
translation:
  language: hi
  text: और उसने उसे बुलाया[a]। वह भीतर आया, और दोनों ने एक-दूसरे का अभिवादन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ यूनानी पाठ संक्षिप्त है: “और उसने उसे बुलाया; वह भीतर आया, और दोनों ने एक-दूसरे का अभिवादन किया।” तोबीत की एक विस्तृत सेमिटिक-रूप परंपरा में कथा के इस भाग में अधिक संवाद मिलता है, पर मुख्य पाठ इस अनुवाद के लिए प्रयुक्त उपलब्ध यूनानी साक्ष्य का अनुसरण करता है।'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: καλέω का सामान्य और प्रसंगानुकूल अर्थ यहाँ ‘बुलाना’ है; ‘आदेश देकर बुलाया’ अनावश्यक औपचारिकता जोड़ता और ‘निमंत्रित किया’ उद्देश्य को अधिक निश्चित कर देता।
- source_word: αὐτόν
  choice: उसे
  rationale: यह पुल्लिंग एकवचन कर्मवाचक सर्वनाम है; निकटवर्ती प्रसंग से उसका संकेत स्पष्ट होता है, इसलिए नाम जोड़ना आवश्यक नहीं।
- source_word: εἰσῆλθεν
  choice: भीतर आया
  rationale: εἰσέρχομαι भीतर प्रवेश करने को व्यक्त करता है। बुलाने वाले के दृष्टिकोण से हिन्दी में ‘भीतर आया’ स्वाभाविक है; ‘प्रवेश किया’ अपेक्षाकृत औपचारिक है।
- source_word: ἠσπάσαντο
  choice: अभिवादन किया
  rationale: ἀσπάζομαι सामान्यतः अभिवादन या स्वागत करने को व्यक्त करता है। ‘गले मिले’ ऐसा शारीरिक संकेत जोड़ता है जो यूनानी क्रिया में अनिवार्य नहीं।
- source_word: ἀλλήλους
  choice: एक-दूसरे का
  rationale: पारस्परिक सर्वनाम को हिन्दी में स्वाभाविक रूप से ‘एक-दूसरे का’ कहा गया है; ‘दोनों ने’ जोड़ने से पारस्परिक क्रिया स्पष्ट और सहज होती है।
