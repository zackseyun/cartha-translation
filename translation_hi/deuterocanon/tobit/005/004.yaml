base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/004.yaml
  text: And he went to look for a man[a], and he found Raphael, who was an angel, but he did not know it.
translation:
  language: hi
  text: और वह एक आदमी की तलाश में गया। उसे रफ़ाएल मिला, जो एक स्वर्गदूत[a] था, लेकिन उसे यह मालूम नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संदेशवाहक।” यूनानी शब्द के दोनों अर्थ हो सकते हैं, पर यहाँ कथावाचक रफ़ाएल को एक स्वर्गीय प्राणी के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη ζητῆσαι
  choice: तलाश में गया
  rationale: उद्देश्यसूचक infinitive के साथ यह आधुनिक हिन्दी में स्वाभाविक है और किसी व्यक्ति को खोजने के लिए जाने का भाव सुरक्षित रखता है।
- source_word: ἄνθρωπον
  choice: एक आदमी
  rationale: यूनानी में पुल्लिंग एकवचन है और प्रसंग में यात्रा के लिए एक पुरुष साथी की तलाश की जा रही है।
- source_word: εὗρεν
  choice: उसे ... मिला
  rationale: शाब्दिक ‘उसने पाया’ की अपेक्षा किसी व्यक्ति से भेंट होने के लिए यह हिन्दी की अधिक स्वाभाविक कथात्मक अभिव्यक्ति है।
- source_word: Ῥαφαήλ
  choice: रफ़ाएल
  rationale: यूनानी नाम का स्पष्ट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: शब्द सामान्यतः ‘संदेशवाहक’ भी हो सकता है, पर इस कथा में रफ़ाएल एक दिव्य प्राणी है; ‘स्वर्गदूत’ इस प्रसंगगत अर्थ को स्पष्ट करता है।
- source_word: οὐκ ᾔδει
  choice: वह यह नहीं जानता था
  rationale: यूनानी में कर्म निहित है; ‘यह’ रफ़ाएल के स्वर्गदूत होने की बात की ओर स्वाभाविक रूप से संकेत करता है।
theological_decisions:
- issue: रफ़ाएल की पहचान ἄγγελος के रूप में
  choice: मुख्य पाठ में ‘स्वर्गदूत’
  alternative: संदेशवाहक
  rationale: कथावाचक रफ़ाएल को दैवी स्वर्गदूत के रूप में पहचानता है, जबकि पात्र उसकी पहचान से अनजान है। मुख्य पाठ यह नाटकीय तनाव बनाए रखता है; पादटिप्पणी शब्द का व्यापक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो छोटे वाक्यों से घटनाक्रम स्पष्ट है और कथावाचक की जानकारी तथा पात्र की अनभिज्ञता के बीच का अंतर सुरक्षित रहता है।
