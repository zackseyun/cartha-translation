translation:
  language: hi
  text: तुम्हारे कुल और तुम्हारे नाम को जानने के लिए। पर उसने कहा[a], “मैं अजारियास हूँ—महान अननियास का पुत्र, तुम्हारे भाइयों में से।”
  philosophy: optimal-equivalence
  footnotes:
