    text: या “संबंधियों” अथवा “कुटुम्बियों”; इस संदर्भ में यूनानी शब्द “भाइयों” का प्रयोग व्यापक पारिवारिक संबंध के लिए भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνῶναι
  choice: जानने के लिए
  rationale: यह क्रिया यहाँ किसी की पहचान संबंधी जानकारी प्राप्त करने की इच्छा व्यक्त करती है; आधुनिक हिन्दी में यह सहज है और मूल के ज्ञानात्मक भाव को बनाए रखती है।
- source_word: γένος
  choice: कुल
  rationale: संदर्भ में यह जाति या प्रकार नहीं, बल्कि वंश अथवा संबंधी-समूह को सूचित करता है। ‘कुल’ संक्षिप्त, स्वाभाविक और वंशपरक अर्थ वाला है।
- source_word: ὄνομα
  choice: नाम
  rationale: यह सीधे पहचान बताने वाला सामान्य शब्द है।
- source_word: Ἐγὼ Ἀζαρίας
  choice: मैं अजर्याह हूँ
  rationale: नाम को हिन्दी बाइबलीय परंपरा में परिचित सेमेटिक रूप में दिया गया है, जबकि यूनानी Ἀζαρίας उसी नाम का रूप है।
- source_word: Ἀνανίου
  choice: हनन्याह का
  rationale: सम्बन्धकारक रूप पिता के नाम द्वारा पहचान बताता है; हिन्दी में परिचित सेमेटिक नाम-रूप अपनाया गया है।
- source_word: τοῦ μεγάλου
  choice: महान
  rationale: मूल विशेषण का सीधा अर्थ ‘महान’ है। ‘बड़ा’ या ‘प्रतिष्ठित’ जैसे अधिक व्याख्यात्मक अर्थ थोपे बिना सम्मानसूचक अस्पष्टता रखी गई है।
- source_word: τῶν ἀδελφῶν σου
  choice: तुम्हारे भाइयों में से
  rationale: सम्बन्धकारक बहुवचन यहाँ किसी संबंधी-समूह से जुड़ाव दर्शाता है। ‘में से’ हिन्दी में उस निहित समूह-संबंध को स्वाभाविक बनाता है, जबकि ‘भाइयों’ मूल के पुरुषवाचक संबंध-शब्द को सुरक्षित रखता है।
theological_decisions:
- issue: ἀδελφῶν का व्यापक पारिवारिक अथवा जातीय संबंध में प्रयोग
  choice: भाइयों
  alternative: संबंधियों / कुटुम्बियों
  rationale: मुख्य पाठ में मूल का पुरुषवाचक संबंध-शब्द रखा गया है। इस संदर्भ में उसका अर्थ सगे भाइयों से व्यापक, अर्थात् संबंधी या सहजातीय भी हो सकता है; इस संभावना को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। पद पूर्ववर्ती वाक्य से जुड़ते हुए आरम्भ होता है, इसलिए आरम्भिक क्रियार्थक खंड को स्रोत के अनुसार अपूर्ण वाक्य के रूप में रहने दिया गया है।
