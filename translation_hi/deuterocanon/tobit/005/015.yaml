  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। प्राचीन मुद्रा ‘द्राख्मा’ को आधुनिक मुद्रा में बदलने के बजाय लिप्यंतरित किया गया है। अंतिम प्रश्न की तुलनात्मक संरचना को बनाए रखा गया है, यद्यपि यूनानी की तरह उसमें कुछ संक्षिप्तता है।
