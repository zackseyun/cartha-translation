translation:
  language: hi
  text: लेकिन मुझे बताओ, मैं तुम्हें क्या मज़दूरी दूँ?[a] क्या मैं तुम्हें हर दिन एक द्राख्मा और तुम्हारी ज़रूरत की चीज़ें दूँ, जैसे अपने बेटे को देता हूँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें क्या भुगतान करूँ?” यूनानी पाठ सीधे पूछता है कि तोबीत उसे सेवा के बदले क्या देगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθὸν
  choice: मज़दूरी
  rationale: यह शब्द काम या सेवा के बदले दिए जाने वाले भुगतान को दर्शाता है; प्रसंग में ‘मज़दूरी’ सीधा और स्वाभाविक है।
- source_word: δραχμὴν τῆς ἡμέρας
  choice: हर दिन एक द्राख्मा
  rationale: संबंधकारक रचना दैनिक दर व्यक्त करती है। प्राचीन मुद्रा का नाम बनाए रखते हुए ‘हर दिन एक द्राख्मा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: τὰ δέοντά σοι
  choice: जो कुछ तुम्हें चाहिए
  rationale: यह वाक्यांश आवश्यक वस्तुओं या प्रबंध को व्यापक रूप से बताता है; यह अनुवाद बिना अनावश्यक विशिष्टीकरण के उसका अर्थ स्वाभाविक हिन्दी में रखता है।
- source_word: ὡς καὶ τῷ υἱῷ μου
  choice: वैसा ही जैसा मेरे बेटे को
  rationale: यह तुलना बताती है कि साथ जाने वाले व्यक्ति की आवश्यकताओं का प्रबंध उसी प्रकार होगा जिस प्रकार तोबीत के बेटे का।
- source_word: τίνα σοὶ ἔσομαι ... διδόναι
  choice: मैं तुम्हें क्या मज़दूरी दूँ?
  rationale: εἰμί के भविष्यत् रूप और धात्वर्थक क्रिया की रचना यहाँ अभिप्रेत भुगतान के विषय में सीधा प्रश्न है; हिन्दी में यह प्रयोग स्वाभाविक और अर्थनिष्ठ है।
