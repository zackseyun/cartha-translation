base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/022.yaml
  text: And Ahiacharus interceded for me[a], and I came to Nineveh. Now Ahiacharus was the cupbearer, keeper of the signet ring, administrator, and accountant, and Sacherdonos appointed him second in rank. He was my cousin.
translation:
  language: hi
  text: अहियाकर ने मेरे लिए निवेदन किया, और मैं नीनवे आया। अहियाकर प्यालावाहक, राजमुद्रा की अंगूठी का प्रभारी, प्रशासक और लेखाधिकारी था। सखेरदोनोस ने उसे पद में दूसरा नियुक्त किया था।[a] वह मेरा चचेरा भाई था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ शाब्दिक रूप से एक असामान्य पदबंध, ‘दूसरे का पुत्र’, है। इसका अर्थ अनिश्चित है, पर सामान्यतः इसे इस अर्थ में समझा जाता है कि अहियाकर राजा के ठीक बाद, अर्थात पद में दूसरा था।
    reason: textual_variant
lexical_decisions:
- source_word: ἠξίωσεν ... περὶ ἐμοῦ
  choice: मेरी ओर से निवेदन किया
  rationale: यह अभिव्यक्ति अहियाकर द्वारा तोबित के पक्ष में अनुरोध अथवा पैरवी करने का भाव देती है, पर किसी निश्चित कानूनी प्रक्रिया को नहीं जोड़ती।
- source_word: ἦλθον εἰς Νινευήν
  choice: मैं नीनवे आ गया
  rationale: ἔρχομαι का सामान्य अर्थ ‘आना/जाना’ है। प्रथम-पुरुष वृत्तांत में ‘आ गया’ स्वाभाविक है; ‘लौट आया’ मूल में स्पष्ट न होने वाली बात जोड़ता।
- source_word: οἰνοχόος
  choice: राजा का प्याला परोसनेवाला
  rationale: यह राजदरबार के ‘प्यालावाहक’ पद को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐπὶ τοῦ δακτυλίου
  choice: राजमुद्रा की अंगूठी का प्रभारी
  rationale: शाब्दिक अर्थ ‘अंगूठी के ऊपर/उसका अधिकारी’ है; राजकीय संदर्भ में यह राजा की मुहर लगी अंगूठी की जिम्मेदारी और उससे जुड़ा अधिकार दर्शाता है।
- source_word: διοικητής
  choice: प्रशासक
  rationale: यह व्यापक प्रशासनिक या प्रबंधकीय दायित्व को बिना अनावश्यक रूप से ‘राज्यपाल’ जैसा विशिष्ट पद बनाए व्यक्त करता है।
- source_word: ἐκλογιστής
  choice: लेखाधिकारी
  rationale: यह हिसाब-किताब और लेखों की देखरेख करनेवाले राजकीय अधिकारी का भाव देता है तथा आधुनिक ‘अकाउंटेंट’ की अपेक्षा दरबारी प्रसंग के अनुकूल है।
- source_word: κατέστησεν αὐτὸν
  choice: उसे ... नियुक्त किया था
  rationale: पदाधिकार के प्रसंग में καθίστημι का अर्थ किसी को पद पर ठहराना या नियुक्त करना है।
- source_word: υἱὸς ἐκ δευτέρας
  choice: अपने बाद दूसरे पद पर
  rationale: यूनानी पाठ की यह असामान्य और संभवतः पाठगत रूप से कठिन अभिव्यक्ति सामान्यतः राजा के ठीक बाद की पदवी के अर्थ में समझी जाती है; मुख्य पाठ में संभावित आशय दिया गया और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐξάδελφός μου
  choice: मेरा रिश्ते का भाई
  rationale: ἐξάδελφος चचेरे-ममेरे आदि भाई का बोध कराता है। हिन्दी में किसी एक पारिवारिक शाखा को अनावश्यक रूप से निश्चित किए बिना ‘रिश्ते का भाई’ स्वाभाविक सामान्य अभिव्यक्ति है।
