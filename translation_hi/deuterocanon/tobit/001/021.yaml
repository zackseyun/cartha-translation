  yaml_path: translation/deuterocanon/tobit/001/021.yaml
  text: And before fifty days had passed[a], his two sons killed him and fled to the mountains of Ararat. And Sacherdonos his son reigned in his place, and he appointed Achiacharos, the son of Anael, my brother's son[b], over all the accounts of his kingdom and over the whole administration.
translation:
  language: hi
  text: और पचास दिन भी नहीं बीते थे कि उसके दोनों बेटों ने उसे मार डाला और अरारात के पहाड़ों में भाग गए। उसका बेटा साखेरदोनोस[a] उसके स्थान पर राजा बना। साखेरदोनोस ने अखियाखारोस[b], जो मेरे भाई के बेटे अनाएल का बेटा था, को अपने राज्य के समस्त लेखा-जोखे और पूरे प्रशासन का प्रभारी नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: साखेरदोनोस अश्शूरी राजा के नाम का यूनानी रूप है; हिन्दी में इसे प्रायः एसरहद्दोन भी लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: अखियाखारोस नाम का यूनानी रूप है; इसका प्रचलित वैकल्पिक रूप अहीकार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διῆλθον ἡμέραι πεντήκοντα ἕως οὗ
  choice: पचास दिन भी नहीं बीते थे कि
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और घटना के बहुत थोड़े समय में घटने पर दिए गए बल को बनाए रखता है।
- source_word: ἀπέκτειναν
  choice: मार डाला
  rationale: यह क्रिया का सीधा और स्वाभाविक अर्थ देता है; ‘हत्या कर दी’ मूल पाठ की अपेक्षा नैतिक-कानूनी अर्थ को अधिक स्पष्ट कर सकता है।
- source_word: ἔφυγον εἰς τὰ ὄρη Ἀραράθ
  choice: अरारात के पहाड़ों में भाग गए
  rationale: ἔφυγον में हत्या के बाद पलायन का भाव है; εἰς को हिन्दी में गंतव्य के स्वाभाविक बोध के लिए ‘में’ कहा गया है।
- source_word: ἐβασίλευσεν ... ἀντʼ αὐτοῦ
  choice: उसके स्थान पर राजा हुआ
  rationale: यह राजगद्दी पर उत्तराधिकारी होने और उसके स्थान पर शासन आरम्भ करने—दोनों भावों को संक्षेप में व्यक्त करता है।
- source_word: ἔταξεν
  choice: अधिकारी नियुक्त किया
  rationale: प्रशासनिक प्रसंग में यह किसी व्यक्ति को औपचारिक रूप से दायित्व सौंपे जाने का स्वाभाविक हिन्दी रूप है।
- source_word: ἐπὶ πᾶσαν τὴν ἐκλογιστείαν
  choice: समस्त लेखा-जोखे का
  rationale: दुर्लभ संज्ञा का आशय हिसाब-किताब अथवा लेखांकन की समग्र जिम्मेदारी है; ‘लेखा-जोखा’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἐπὶ πᾶσαν τὴν διοίκησιν
  choice: पूरे प्रशासन का
  rationale: διοίκησις यहाँ राज्य के व्यापक प्रबंध और प्रशासनिक संचालन को सूचित करता है।
- source_word: Σαχερδονός / Ἀχιάχαρον / Ἀναήλ
  choice: साखेरदोनोस / अखियाखारोस / अनाएल
  rationale: नामों को स्वेटे के यूनानी पाठ के रूपों के अनुसार देवनागरी में लिप्यंतरित किया गया है, न कि अन्य ऐतिहासिक या भाषाई परंपराओं के अनुरूप बदलकर।
theological_decisions:
- issue: अन्य बाइबलीय या ऐतिहासिक परंपराओं में परिचित व्यक्तिगत नामों का रूप
  choice: मुख्य पाठ में यूनानी स्रोत के अनुरूप लिप्यंतरण
  alternative: साखेरदोनोस और अखियाखारोस के स्थान पर अधिक परिचित ऐतिहासिक रूप एसरहद्दोन और अहीकार
  rationale: यह सिद्धांतगत निर्णय नहीं, बल्कि स्रोत-पाठ के प्रति पारदर्शिता का प्रश्न है। मुख्य पाठ यूनानी साक्ष्य का अनुसरण करता है और परिचित वैकल्पिक नाम पादटिप्पणियों में दिए जाते हैं।
- issue: अखियाखारोस की वंशावली
  choice: ‘मेरे भाई के बेटे अनाएल के बेटे अखियाखारोस’
  alternative: ‘मेरे भाई अनाएल के बेटे अखियाखारोस’
  rationale: यूनानी पदबंध Ἀναὴλ υἱὸν τοῦ ἀδελφοῦ μου में ‘मेरे भाई का बेटा’ अनाएल का परिचय देता है; इसलिए अखियाखारोस वक्ता के भाई का पोता है, न कि स्वयं वक्ता के भाई अनाएल का बेटा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-विन्यास को हिन्दी की स्वाभाविकता के अनुसार बाँटा गया है। ‘लेखा-जोखा’ और ‘प्रशासन’ प्रशासनिक समानांतरता को स्पष्ट रखते हैं। सभी पादटिप्पणी-चिह्न संबंधित नामों के ठीक बाद लगाए गए हैं।
