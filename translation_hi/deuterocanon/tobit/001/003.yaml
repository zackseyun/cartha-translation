base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/003.yaml
  text: I[a], Tobit, walked in the ways of truth and righteousness all the days of my life[b], and I did many acts of mercy for my brothers and for my people who went with me into the land of the Assyrians, to Nineveh.
translation:
  language: hi
  text: मैं, तोबित, अपने जीवन के सभी दिनों में सत्य और धार्मिकता के मार्गों पर चलता रहा, और मैंने अपने भाइयों और अपने लोगों के लिए दया के बहुत-से काम किए[a], जो मेरे साथ अश्शूरियों के देश के नीनवे नगर में गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने बहुत दान दिया।” यूनानी पद विशेष रूप से दान देने का अर्थ रख सकता है, यद्यपि इसमें दया के व्यापक काम भी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοῖς ἀληθείας
  choice: सत्य ... के मार्गों पर
  rationale: यह अनुवाद आचरण के लिए प्रयुक्त बहुवचन मार्ग-रूपक और ἀλήθεια के नैतिक अर्थ, दोनों को बनाए रखता है।
- source_word: ἐπορευόμην
  choice: चलता रहा
  rationale: अपूर्ण भूतकाल जीवन भर के निरंतर आचरण को सूचित करता है; ‘चलता रहा’ नैतिक जीवन के बाइबलीय रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यहाँ न्यायिक निर्णय से अधिक तोबित के नैतिक और परमेश्वरनिष्ठ आचरण का वर्णन है; इसलिए ‘धार्मिकता’ उपयुक्त है।
- source_word: ἐλεημοσύνας πολλὰς ἐποίησα
  choice: दया के बहुत-से काम किए
  rationale: ἐλεημοσύνη विशेष रूप से दान देने का अर्थ रख सकता है, पर दया के व्यापक कार्यों को भी सूचित कर सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और संकीर्ण विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοῖς ἀδελφοῖς μου
  choice: अपने भाइयों
  rationale: यूनानी का पुल्लिंग बहुवचन सीधे रखा गया है; प्रसंग में इसका आशय केवल सगे भाइयों से नहीं, बल्कि इस्राएली बंधुओं या कुटुंबियों से भी हो सकता है।
- source_word: τῷ ἔθνει
  choice: अपने लोगों
  rationale: पहले पुरुष के जातीय-सामुदायिक प्रसंग में ‘अपने लोगों’ आधुनिक हिन्दी में ‘जाति’ या ‘राष्ट्र’ से अधिक स्वाभाविक है।
- source_word: τοῖς προπορευθεῖσιν μετʼ ἐμοῦ
  choice: जो मेरे साथ ... गए थे
  rationale: वाक्यांश का साझा गमन निर्वासन के प्रसंग में स्पष्ट किया गया है। προπορευθεῖσιν में आगे या पहले जाने की छाया संभव है, पर उसे शब्दशः रखने से हिन्दी अस्वाभाविक और आशय संदिग्ध हो जाता।
- source_word: εἰς χώραν Ἀσσυρίων
  choice: अश्शूरियों के देश
  rationale: यह यूनानी संबंधकारक संरचना को स्वाभाविक रूप से प्रतिबिंबित करता है और केवल ‘अश्शूर’ कहने की अपेक्षा मूल की पूर्णता बनाए रखता है।
- source_word: εἰς Νινευή
  choice: नीनवे
  rationale: नगर को अश्शूरियों के देश के गंतव्य के रूप में समानाधिकरण में रखा गया है।
theological_decisions:
- issue: ज्ञान-साहित्य के नैतिक आत्मवर्णन में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपरायणता / न्याय
  rationale: पद तोबित के जीवनभर के नैतिक और धार्मिक आचरण का सार देता है। ‘धार्मिकता’ इस व्यापक आयाम को बनाए रखती है, जबकि ‘न्याय’ अर्थ को सामाजिक या न्यायिक क्षेत्र तक सीमित कर सकता है।
- issue: ἐλεημοσύνη का व्यापक या विशिष्ट अर्थ
  choice: दया के काम
  alternative: दान दिया
  rationale: मूल शब्द भिक्षादान या दान देने के विशिष्ट अर्थ में आ सकता है, किंतु दयापूर्ण कार्यों का व्यापक अर्थ भी संभव है। अस्पष्टता को मुख्य पाठ और पादटिप्पणी के द्वारा सुरक्षित रखा गया है।
