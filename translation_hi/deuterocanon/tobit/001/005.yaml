base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/005.yaml
  text: and all the tribes that had apostatized were sacrificing to Baal the heifer[a], including the house of my father[b], Naphtali.
translation:
  language: hi
  text: और वे सभी गोत्र, जो सामूहिक रूप से धर्मत्याग कर चुके थे, बछिया-रूप बाअल को बलि चढ़ाते थे; मेरे पिता का नप्ताली-घराना भी उनमें था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'यूनानी के अंतिम शब्द संक्षिप्त हैं: शाब्दिक रूप से, “और मेरे पिता का नप्ताली-घराना।” आशय यह है कि तोबीत के पिता का अपना नप्ताली-घराना भी इस उपासना में सम्मिलित था।'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσαι αἱ φυλαί
  choice: वे सभी गोत्र
  rationale: इस्राएल के ऐतिहासिक-सामुदायिक संदर्भ में φυλαί का अर्थ जनजातीय विभाजन है; इसलिए ‘गोत्र’ स्वाभाविक और सटीक है।
- source_word: αἱ συναποστᾶσαι
  choice: जो साथ मिलकर विश्वास से फिर गए थे
  rationale: συν- सामूहिक सहभागिता और ἀποστᾶσαι धार्मिक विमुखता व्यक्त करता है। ‘विश्वास से फिर गए’ सामान्य पाठक के लिए ‘धर्मत्याग’ से अधिक सहज है, और ‘साथ मिलकर’ उपसर्ग का भाव रखता है।
- source_word: ἔθυον
  choice: बलि चढ़ाते थे
  rationale: अपूर्ण भूतकाल बार-बार अथवा निरंतर किए जाने वाले अतीत के कर्म को दर्शाता है।
- source_word: τῇ Βάαλ τῇ δαμάλει
  choice: बछिया-बाल
  rationale: दोनों शब्द समान कारक में हैं और बाल को गोवंशीय रूप से संबद्ध करते हैं। संयुक्त पद ग्रीक की असामान्य तथा कुछ हद तक अस्पष्ट अभिव्यक्ति को बनाए रखता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὁ οἶκος Νεφθαλεὶμ τοῦ πατρός μου
  choice: मेरे पूर्वज नप्ताली का घराना
  rationale: शाब्दिक ग्रीक संक्षिप्त और व्याकरण की दृष्टि से दबा हुआ है। यहाँ πατήρ वंशगत अर्थ में है; आधुनिक हिन्दी में ‘पूर्वज’ नप्ताली को तोबीत का तात्कालिक पिता समझने से बचाता है। ‘घराना’ οἶκος के वंशीय अर्थ को व्यक्त करता है।
theological_decisions:
- issue: συναποστᾶσαι की धार्मिक प्रकृति
  choice: विश्वास से फिर गए थे
  alternative: विद्रोह कर चुके थे / धर्मत्याग कर चुके थे
  rationale: बाल को बलि चढ़ाने का निकट संदर्भ विमुखता को केवल राजनीतिक विद्रोह नहीं, बल्कि धार्मिक और वाचागत फिराव बनाता है।
- issue: τῇ Βάαλ τῇ δαμάλει का संबंध
  choice: बछिया-बाल
  alternative: बाल नामक बछिया / बछिया के रूप में बाल / बछड़े-बाल
  rationale: ग्रीक Βάαλ और δαμάλει को समान कारक में रखता है, पर उनके ठीक संबंध को स्पष्ट नहीं करता। मुख्य पाठ इस तनाव को खुला रखता है और पादटिप्पणी शाब्दिक तथा प्रचलित वैकल्पिक समझ बताती है।
- issue: नप्ताली और ‘मेरे पिता’ का संबंध
  choice: मेरे पूर्वज नप्ताली
  alternative: मेरे पिता नप्ताली / मेरे पिता का नप्ताली-घराना
  rationale: ग्रीक का अंतिम वाक्यांश संक्षिप्त है। वंशगत संदर्भ में ‘पूर्वज’ स्वाभाविक अर्थ देता है, जबकि पादटिप्पणी मूल संरचना की अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘गोत्र’, ‘बलि चढ़ाते थे’ और ‘घराना’ बाइबलीय संदर्भ के अनुरूप हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं। ‘बछिया-बाल’ जानबूझकर कुछ असामान्य है, क्योंकि मूल यूनानी का पद भी असामान्य और अर्थगत रूप से तनावपूर्ण है।
