translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। राजकीय नियंत्रण को स्पष्ट करने के लिए शाब्दिक ‘उसके रास्ते’ के स्थान पर ‘उसके अधीन के रास्ते’ कहा गया है। ‘मादै प्रदेश’ पारंपरिक भौगोलिक नाम को आधुनिक पाठक के लिए स्पष्ट रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनकी सामग्री का क्रम असंगत था; हिन्दी में नामों से संबंधित टिप्पणी [a] और कठिन क्रिया से संबंधित टिप्पणी [b] के साथ सही स्थान पर दी गई है।
