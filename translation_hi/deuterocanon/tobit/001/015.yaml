  yaml_path: translation/deuterocanon/tobit/001/015.yaml
  text: And when Enemessar died[a], Achreil his son became king in his place, and his roads became unsafe[b], and I was no longer able to go into Media.
translation:
  language: hi
  text: जब एनेमेस्सार[a] मर गया, तो उसका पुत्र अख्रेइल उसकी जगह राजा बना। उसके अधीन के रास्ते असुरक्षित हो गए[b], और मैं अब मादै प्रदेश की यात्रा नहीं कर सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अनुवाद में प्रयुक्त यूनानी साक्षी में राजाओं के नाम एनेमेस्सार और अख्रेइल हैं। तोबित की अन्य पाठ-परंपराओं में इनके अलग वर्तनी-रूप और कहीं-कहीं अलग नाम भी मिलते हैं।
    reason: textual_variant
  - marker: b
    text: यहाँ जिस यूनानी क्रिया का अनुवाद “असुरक्षित हो गए” किया गया है, उसका रूप असामान्य है और उसका अर्थ निश्चित करना कठिन है। यात्रा के प्रसंग से अनुमान होता है कि रास्ते अव्यवस्थित या असुरक्षित हो गए थे, इसलिए तोबित आगे मादै प्रदेश नहीं जा सका।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
