- source_word: ἐβασίλευσεν
  choice: राजा बना
  rationale: यहाँ क्रिया पूर्ववर्ती राजा की मृत्यु के बाद पुत्र के राजसिंहासन पर आने को व्यक्त करती है।
- source_word: ἀντʼ αὐτοῦ
  choice: उसकी जगह
  rationale: उत्तराधिकार और प्रतिस्थापन दोनों का स्पष्ट, सहज हिन्दी रूप।
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: उसके अधीन के रास्ते
  rationale: यात्रा के प्रसंग में ὁδοί का अर्थ वास्तविक रास्ते या मार्ग है। सर्वनाम-संबंध को राजा के नियंत्रणाधीन क्षेत्र के रूप में व्यक्त किया गया है, न कि उसके व्यक्तिगत स्वामित्व के रूप में।
- source_word: ἠκαταστάτησαν
  choice: असुरक्षित हो गए
  rationale: यूनानी रूप असामान्य और अर्थ की दृष्टि से कठिन है। आगे यात्रा न कर पाने के प्रसंग में यह अनुवाद रास्तों की अव्यवस्था या असुरक्षा का व्यावहारिक परिणाम बताता है, पर उन्हें भौतिक रूप से पूर्णतः बंद नहीं ठहराता।
- source_word: οὐκέτι ἠδυνάσθην
  choice: मैं फिर ... नहीं कर सका
  rationale: पूर्व में संभव रही यात्रा अब संभव न रहने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πορευθῆναι εἰς τὴν Μηδείαν
  choice: मादै प्रदेश की यात्रा
  rationale: πορεύομαι के यात्रा-संबंधी अर्थ और Μηδεία की भौगोलिक दिशा को स्पष्ट करता है; 'प्रदेश' जोड़ने से आधुनिक पाठक इसे स्थान-नाम के रूप में सहजता से समझता है।
