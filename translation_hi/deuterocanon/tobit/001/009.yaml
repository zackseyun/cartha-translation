revisions:
- from: और जब मैं पुरुष हुआ, तब मैंने अपने पितृकुल के वंश में से हन्ना को पत्नी बनाया, और उससे मेरा पुत्र तोबियाह उत्पन्न हुआ।
  to: और जब मैं पुरुषावस्था को पहुँचा, तब मैंने हमारे पितृकुल के वंश में से अन्ना से विवाह किया, और उससे मैं तोबियाह का पिता बना।
  rationale: The revision preserves the Greek life-stage expression, marriage within the paternal family line, and the explicit maternal reference. It restores the Greek first-person paternal agency in idiomatic Hindi (‘मैं तोबियाह का पिता बना’) rather than implying only that a child was born. It also aligns Anna’s spelling with the primary Greek source and restores ‘हमारे.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:06:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the sequence and the patrilineal kinship sense, but it changes the Greek active paternal statement («I begot/fathered Tobiah by her») into an impersonal passive statement. It also uses हन्ना although the primary Greek source has Ἄννα (Anna).
  naturalness: ‘जब मैं पुरुष हुआ’ is understandable but not idiomatic modern standard Hindi for attaining adulthood. ‘पत्नी बनाया’ is possible but less natural than ‘से विवाह किया.’ The revised wording remains formal and clear while retaining the source’s sense.
  terminology: ‘पितृकुल’ suitably conveys πατριά. ‘हमारे’ must be retained, as the Greek has ἡμῶν (‘our’). The Greek name Ἄννα is best represented here as ‘अन्ना’; ‘तोबियाह’ is an acceptable Hindi rendering of Τωβίαν.
  issues:
  - severity: medium
    issue: The clause ‘उससे मेरा पुत्र तोबियाह उत्पन्न हुआ’ does not preserve the speaker’s active paternal role in ἐγέννησα ἐξ αὐτῆς.
    rationale: The Greek explicitly presents Tobit as the subject who begot/fathered Tobiah by Anna. Hindi should express his becoming Tobiah’s father, without using the misleading maternal idiom ‘जन्म दिया’ for a male speaker.
  - severity: medium
    issue: ‘हन्ना’ does not directly reflect the Greek name Ἄννα.
    rationale: Since the Greek is the designated primary anchor and the English audit trail also uses Anna, ‘अन्ना’ is the safer source-based Hindi form.
  - severity: low
    issue: ‘अपने पितृकुल’ omits the plural possessive ‘our.’
    rationale: The phrase τῆς πατριᾶς ἡμῶν refers to ‘our’ paternal family/clan, not merely the speaker’s own paternal family.
  - severity: low
    issue: ‘जब मैं पुरुष हुआ’ is unnatural modern Hindi.
    rationale: ‘जब मैं पुरुषावस्था को पहुँचा’ clearly denotes becoming a man/adult and fits a dignified modern biblical register.
  revised_text: और जब मैं पुरुषावस्था को पहुँचा, तब मैंने हमारे पितृकुल के वंश में से अन्ना से विवाह किया, और उससे मैं तोबियाह का पिता बना।
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek life-stage expression, marriage within the paternal family line, and the explicit maternal reference. It restores the Greek first-person paternal agency in idiomatic Hindi (‘मैं तोबियाह का पिता बना’) rather than implying only that a child was born. It also aligns Anna’s spelling with the primary Greek source and restores ‘हमारे.’
