base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/009.yaml
  text: And when I became a man[a], I took Anna as my wife from the seed of our ancestral family[b], and by her I fathered Tobiah.
translation:
  language: hi
  text: और जब मैं पुरुषावस्था को पहुँचा, तब मैंने हमारे पितृकुल के वंश में से अन्ना से विवाह किया, और उससे मैं तोबियाह का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγενόμην ἀνήρ
  choice: जब मैं पुरुष हुआ
  rationale: यह यूनानी मुहावरा पुरुष-वयस्कता तक पहुँचने को व्यक्त करता है; हिन्दी में यह मूल की लिंग-सूचक और जीवन-अवस्था संबंधी भाषा को बनाए रखता है।
- source_word: ἔλαβον Ἄνναν γυναῖκα
  choice: मैंने ... हन्ना को पत्नी बनाया
  rationale: यह विवाह के लिए प्रयुक्त यूनानी ‘स्त्री/पत्नी लेना’ मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἐκ τοῦ σπέρματος τῆς πατριᾶς ἡμῶν
  choice: अपने पितृकुल के वंश में से
  rationale: σπέρμα वंशज या वंश को और πατριά पिता की ओर से चले परिवार या कुल को सूचित करता है। यह रूप पितृवंशीय संबंध को स्पष्ट रखता है, पर हिन्दी में अस्वाभाविक ‘बीज’ से बचता है।
- source_word: ἐγέννησα ἐξ αὐτῆς
  choice: उससे मेरा पुत्र ... उत्पन्न हुआ
  rationale: यूनानी में वक्ता कर्ता है—उसने उससे संतान उत्पन्न की। हिन्दी का यह स्वाभाविक रूप मातृ-संदर्भ और वक्ता के पितृत्व दोनों को व्यक्त करता है, बिना प्राचीन ‘जन्माया’ जैसी असहज भाषा के।
- source_word: Τωβίαν
  choice: तोबियाह
  rationale: नाम के सामी मूल को पहचानने योग्य रखते हुए यूनानी रूप का हिन्दी लिप्यंतरण किया गया है।
- source_word: Ἄνναν
  choice: हन्ना
  rationale: यूनानी Ἄννα के पीछे स्थित सामी नाम को हिन्दी बाइबलीय परंपरा में परिचित ‘हन्ना’ रूप में रखा गया है।
theological_decisions:
- issue: पुरुष-वयस्कता की लिंग-सूचक भाषा
  choice: जब मैं पुरुष हुआ
  alternative: जब मैं वयस्क हुआ
  rationale: ἀνήρ विशेष रूप से पुरुष को सूचित करता है; जीवनी के इस प्रसंग में उसे लिंग-निरपेक्ष करना मूल की स्पष्टता घटा देता।
- issue: अपने पितृकुल के भीतर विवाह का संकेत
  choice: अपने पितृकुल के वंश में से
  alternative: अपने कुल में से
  rationale: मूल पाठ पितृपक्ष से जुड़े वंश पर बल देता है। अनुवाद इस बात को बनाए रखता है, पर इससे कोई अतिरिक्त वैधानिक या सांप्रदायिक निष्कर्ष नहीं निकालता।
- issue: ἐγέννησα में पितृत्व की अभिव्यक्ति
  choice: उससे मेरा पुत्र ... उत्पन्न हुआ
  alternative: मैंने उससे ... को जन्म दिया
  rationale: शाब्दिक विकल्प हिन्दी में पुरुष वक्ता के लिए भ्रमकारी होता। चुना गया रूप मूल के पितृत्व और स्त्री से उत्पत्ति—दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। ‘पितृकुल’ सामान्य ‘परिवार’ से कुछ अधिक औपचारिक है, पर πατριά के पितृवंशीय आशय को संक्षेप में और ठीक प्रकार व्यक्त करता है। वाक्य की पुनरुक्त ‘वंश/कुल’ संरचना मूल के σπέρμα और πατριά—दोनों संबंधसूचक पदों को दर्शाती है।
