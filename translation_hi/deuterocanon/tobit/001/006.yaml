base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/006.yaml
  text: But I alone would often go to Jerusalem for the feasts[a], as it is written for all Israel in an everlasting ordinance[b], bringing the firstfruits and the tithes of the produce and the first shearings.
translation:
  language: hi
  text: परन्तु मैं अकेला ही पर्वों के लिए बार-बार यरूशलेम जाता था, जैसा कि समस्त इस्राएल के लिए सदा की विधि में लिखा है, और उपज के पहले फल और दशमांश तथा ऊन की पहली कतराई का अंश[a] लेकर जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का यह दुर्लभ शब्द सम्भवतः पशुओं की पहली ऊन-कतराई से दिया जानेवाला अंश दर्शाता है; कुछ लोग इसे पशुपालन से मिलनेवाली पहली भेंट के अधिक व्यापक अर्थ में लेते हैं।
    reason: lexical_alternative
