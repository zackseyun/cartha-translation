- source_word: μόνος
  choice: मैं अकेला ही
  rationale: यह तोबीत की व्यक्तिगत निष्ठा पर बल देता है और उसके समुदाय के अन्य लोगों के साथ निहित विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπορευόμην πλεονάκις
  choice: बार-बार ... जाता था
  rationale: अपूर्ण भूतकाल और πλεονάκις मिलकर अतीत में बारंबार होनेवाली प्रथागत क्रिया व्यक्त करते हैं।
- source_word: ἐν Ἱεροσολύμοις
  choice: यरूशलेम जाता था
  rationale: यूनानी में गति-सूचक क्रिया के साथ ἐν है; प्रसंग में गंतव्य का भाव है, जिसे हिन्दी स्वाभाविक रूप से बिना किसी अतिरिक्त परसर्ग के व्यक्त करती है।
- source_word: ταῖς ἑορταῖς
  choice: पर्वों के अवसर पर
  rationale: यह इस्राएल के धार्मिक पर्वों को सूचित करता है और यात्रा के अवसर का भाव स्पष्ट करता है।
- source_word: καθὼς γέγραπται
  choice: जैसा कि ... लिखा है
  rationale: यह पवित्र विधान का परिचय देनेवाले प्रचलित सूत्र का स्वाभाविक हिन्दी रूप है।
- source_word: παντὶ τῷ Ἰσραήλ
  choice: समस्त इस्राएल के लिए
  rationale: विधान की सार्वदेशिक संबद्धता को सभी इस्राएलियों के लिए लागू होने के अर्थ में सुरक्षित रखता है।
- source_word: ἐν προστάγματι αἰωνίῳ
  choice: सदा की विधि में
  rationale: πρόσταγμα के प्रामाणिक विधान और αἰώνιος की स्थायी वैधानिक शक्ति को गरिमापूर्ण, सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπαρχάς
  choice: पहले फल
  rationale: कृषि-उपज के आरम्भिक अंश को परमेश्वर के लिए अर्पित करने का पंथीय अर्थ रखता है; सामान्य पाठक के लिए 'प्रथमफल' से अधिक सहज है।
- source_word: δεκάτας τῶν γενημάτων
  choice: उपज के ... दशमांश
  rationale: γενήματα कृषि-उत्पादन के लिए व्यापक शब्द है और δεκάται दसवें भाग की विधिक भेंट को सूचित करता है। हिन्दी वाक्य में 'उपज के' पहले फल और दशमांश दोनों से संबद्ध समझा जा सकता है।
- source_word: προκουρίας
  choice: ऊन की पहली कतरन[a]
  rationale: दुर्लभ शब्द का सबसे संभावित अर्थ पशुओं की पहली ऊन-कतराई से दिया जानेवाला भाग है; 'ऊन' जोड़ने से हिन्दी में आशय स्पष्ट होता है, जबकि पादटिप्पणी अनिश्चितता बचाती है।
- source_word: ἔχων
  choice: साथ ले जाता था
  rationale: सहभागी कृदन्त बताता है कि तोबीत इन भेंटों को अपने साथ लेकर जाता था; यह हिन्दी में क्रिया का व्यावहारिक बल सहज रूप से प्रकट करता है।
theological_decisions:
- issue: तोबीत की पर्व-यात्रा और भेंटों का स्वरूप
  choice: पद तोबीत को यरूशलेम-केंद्रित पर्व और भेंट संबंधी दायित्वों का व्यक्तिगत रूप से पालन करते हुए प्रस्तुत करता है।
  alternative: इसे विशिष्ट विधिक पालन के बजाय सामान्य धार्मिक निष्ठा का वर्णन माना जा सकता है।
  rationale: '''जैसा ... लिखा है'', ''समस्त इस्राएल'' और भेंटों की ठोस सूची स्पष्ट विधिक आज्ञापालन की ओर संकेत करती है।'
- issue: αἰωνίῳ का वैधानिक अर्थ
  choice: सदा की
  alternative: अनन्त; चिरस्थायी
  rationale: यह चयन विधान की निरंतर वैधता को बनाए रखता है, पर शब्द पर पाठ से आगे जानेवाला दार्शनिक कालार्थ आरोपित नहीं करता।
- issue: προκουρίας की दुर्लभता
  choice: मुख्य पाठ में संभावित पशुपालकीय अर्थ रखा गया और पादटिप्पणी में अनिश्चितता बताई गई।
  alternative: इसे व्यापक रूप से 'पशुधन की पहली भेंट' कहा जा सकता है।
  rationale: संभावित ठोस अर्थ को छिपाए बिना दुर्लभ यूनानी शब्द की वास्तविक अर्थगत अनिश्चितता सुरक्षित रहती है।
