  text: But one of the men in Nineveh went and informed the king about me[a], that I was burying them; and I hid myself. Then, realizing that I was being sought to be put to death[b], I withdrew in fear.
translation:
  language: hi
  text: परन्तु नीनवे में रहने वालों में से एक व्यक्ति[a] ने जाकर राजा को मेरे बारे में यह सूचना दी कि मैं उन लोगों को दफ़ना रहा था; और मैं छिप गया। फिर जब मुझे पता चला कि मेरी तलाश की जा रही थी ताकि मुझे मार डाला जाए[b], तो मैं डरकर वहाँ से चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नीनवे में रहने वालों में से एक।”
    reason: lexical_alternative
  - marker: b
    text: या, “वे मुझे मार डालने के लिए खोज रहे थे।” यूनानी में अधिक शाब्दिक रूप से, “मुझे मरने के लिए खोजा जा रहा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: ने जाकर
  rationale: यह अओरिस्ट कृदन्त मुख्य क्रिया ὑπέδειξε से पहले की क्रिया बताता है। ‘ने जाकर ... सूचना दी’ यूनानी क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἷς τῶν ἐν Νινευὴ
  choice: नीनवे में रहनेवालों में से एक व्यक्ति
  rationale: यूनानी पदबंध अधूरा-सा है—शाब्दिक अर्थ ‘नीनवे में [जो थे] उनमें से एक।’ ‘व्यक्ति’ जोड़ने से आधुनिक हिन्दी में आशय स्पष्ट होता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: ὑπέδειξε
  choice: यह सूचना दी
  rationale: इस प्रसंग में क्रिया किसी अधिकारी को किसी के विषय में जानकारी देने या खबर करने का अर्थ रखती है। ‘सूचना दी’ औपचारिक और स्वाभाविक है तथा ‘शिकायत की’ जैसा अतिरिक्त भाव नहीं जोड़ती।
- source_word: περὶ ἐμοῦ
  choice: मेरे बारे में
  rationale: यह पूर्वसर्गीय पदबंध का सीधा और आधुनिक हिन्दी रूप है।
- source_word: ὅτι θάπτω αὐτούς
  choice: कि मैं उन लोगों को दफ़ना रहा था
  rationale: अप्रत्यक्ष कथन में वर्तमान θάπτω जारी या बार-बार किए जानेवाले काम का बोध दे सकता है। कथावृत्त के भूतकाल में ‘दफ़ना रहा था’ इस पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκρύβην
  choice: मैं छिप गया
  rationale: रूप निष्क्रिय/मध्य है, पर प्रसंग में अकर्मक-आत्मवाचक अर्थ देता है। ‘छिप गया’ संक्षिप्त और स्पष्ट हिन्दी है।
- source_word: ἐπιγνοὺς
  choice: जब मुझे पता चला
  rationale: यह कृदन्त विकसित हो रही परिस्थिति के ज्ञान या पहचान को दर्शाता है। कालवाचक उपवाक्य हिन्दी कथन-प्रवाह में स्वाभाविक है।
- source_word: ζητοῦμαι ἀποθανεῖν
  choice: मुझे मार डालने के लिए खोजा जा रहा है
  rationale: यूनानी का संक्षिप्त निष्क्रिय विन्यास लगभग ‘मुझे मरने/मृत्यु के लिए खोजा जा रहा है’ है। चुना हुआ रूप निष्क्रियता और मृत्यु के उद्देश्य—दोनों को स्पष्ट रखते हुए सुबोध हिन्दी देता है।
- source_word: φοβηθεὶς
  choice: डरकर
  rationale: कृदन्त प्रस्थान की भावात्मक परिस्थिति या कारण बताता है। ‘डरकर’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀνεχώρησα
  choice: वहाँ से चला गया
  rationale: ἀναχωρέω का अर्थ हट जाना या प्रस्थान करना है। ‘वहाँ से चला गया’ सुरक्षा के लिए स्थान छोड़ने का भाव देता है, पर ‘भाग गया’ की अधिक तीव्र नाटकीयता नहीं जोड़ता।
theological_decisions:
- issue: उत्पीड़न के सामने तोबीत की प्रतिक्रिया का कथात्मक चित्रण
  choice: अन्तिम क्रिया को डरकर वहाँ से चले जाने के रूप में प्रस्तुत किया गया है।
  alternative: मैं डरकर भाग गया।
  rationale: पाठ वास्तविक भय और मृत्यु के खतरे को स्पष्ट करता है, पर ἀνεχώρησα अनिवार्य रूप से घबराकर भागने का अर्थ नहीं देता। इसलिए अनावश्यक नाटकीयता जोड़े बिना सावधानी से प्रस्थान करने का भाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक गद्य अपनाया गया है। ‘दफ़ना’, ‘सूचना दी’ और ‘मार डालने’ जैसे प्रचलित शब्द मूल के अर्थ और प्रसंग की गंभीरता बनाए रखते हैं। मूल यूनानी की निष्क्रिय रचना और उसके वैकल्पिक सक्रिय अर्थ को मुख्य पाठ तथा पादटिप्पणी में अलग-अलग सुरक्षित रखा गया है।
