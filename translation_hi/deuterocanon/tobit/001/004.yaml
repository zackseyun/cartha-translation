base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/004.yaml
  text: And when I was in my own country[a], in the land of Israel, while I was still young, the whole tribe of my father Naphtali fell away from the house of Jerusalem, which had been chosen from all the tribes of Israel for all the tribes to sacrifice there; and the temple, the dwelling place of the Most High[c][b], was consecrated and built for all generations.
translation:
  language: hi
  text: जब मैं अपने देश, इस्राएल की भूमि में था, और अभी जवान था, तब मेरे पिता का पूरा नप्ताली गोत्र यरूशलेम के भवन[a] से विमुख हो गया। यरूशलेम को इस्राएल के सभी गोत्रों में से इसलिए चुना गया था कि सभी गोत्र वहीं बलि चढ़ाएँ; और मंदिर—परमप्रधान का निवासस्थान—पवित्र ठहराया गया और सब पीढ़ियों के लिए बनाया गया[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ यहाँ ‘यरूशलेम के भवन’ और आगे आए ‘मंदिर’ के लिए अलग-अलग शब्द इस्तेमाल करता है। पहला संभवतः व्यापक रूप से यरूशलेम के पवित्रस्थान को दर्शाता है, जबकि दूसरा विशेष रूप से मंदिर को नाम देता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी पाठ के अंतिम शब्द पाठगत रूप से कठिन हैं और वाक्य केवल ‘सब के लिए’ (εἰς πάσας) पर अधूरा समाप्त होता है। वाक्य को सुसंगत बनाने के लिए अनुवाद में ‘सब पीढ़ियों के लिए’ दिया गया है; टोबित की दीर्घ पाठ-परंपरा स्थायी, पीढ़ीगत अर्थ का समर्थन करती है।
    reason: textual_variant
  - marker: c
    text: कुमरान में मिले टोबित के अंश इस पुस्तक में प्रायः दीर्घ यूनानी पाठ-परंपरा से अधिक मेल खाते हैं; फिर भी इस पद का अनुवाद स्वेट के यूनानी पाठ को आधार बनाकर किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: χώρα
  choice: देश
  rationale: ἐν τῇ χώρᾳ μου का स्वाभाविक हिन्दी रूप ‘अपने देश’ है; इसके बाद ‘इस्राएल की भूमि’ उसी देश की स्पष्ट पहचान देता है और यूनानी की पुनरुक्ति को बनाए रखता है।
- source_word: νεωτέρου μου ὄντος
  choice: जब मैं अभी जवान था
  rationale: यह कालसूचक पद टोबित की उस समय की कम आयु बताता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: ἀπέστη
  choice: विमुख हो गया
  rationale: क्रिया अलग होने या निष्ठा छोड़ने का भाव रखती है। ‘विमुख हो गया’ धार्मिक गंभीरता व्यक्त करता है, पर बाद की तकनीकी धर्मशास्त्रीय शब्दावली नहीं थोपता।
- source_word: οἶκος Ἱεροσολύμων
  choice: यरूशलेम का भवन
  rationale: यूनानी अभिव्यक्ति को जानबूझकर ‘मंदिर’ में समेटा नहीं गया, क्योंकि आगे ναός के लिए अलग से ‘मंदिर’ आया है।
- source_word: ἐκλεγείσης
  choice: चुना गया था
  rationale: यह यरूशलेम के चुने जाने का कर्मवाच्य भाव और कथा की पूर्वकालिक दृष्टि बनाए रखता है।
- source_word: εἰς τὸ θυσιάζειν
  choice: कि सभी गोत्र वहीं बलि चढ़ाएँ
  rationale: यह बलि चढ़ाने के उद्देश्य को स्पष्ट करता है; ‘वहीं’ चुने हुए यरूशलेम के स्थानगत संकेत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ναός
  choice: मंदिर
  rationale: यह सामान्य पाठक के लिए स्पष्ट है और पहले आए οἶκος से अभिव्यक्तिगत भेद बनाए रखता है।
- source_word: κατασκήνωσις
  choice: निवासस्थान
  rationale: यह परमप्रधान की उपस्थिति और निवास का भाव रखता है, बिना इसे तकनीकी रूप से ‘तम्बू’ या ‘निवास-मण्डप’ ठहराए।
- source_word: ὑψίστου
  choice: परमप्रधान
  rationale: यह ईश्वर की इस उपाधि का प्रचलित, गरिमापूर्ण और संक्षिप्त हिन्दी रूप है।
- source_word: ἡγιάσθη
  choice: पवित्र ठहराया गया
  rationale: यह मंदिर को पवित्र उपयोग के लिए अलग किए जाने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: ᾠκοδομήθη
  choice: बनाया गया था
  rationale: यह क्रिया के स्थापत्य अर्थ को बनाए रखता है; हिन्दी वाक्य में ‘निर्माण किया गया’ की अपेक्षा अधिक सहज है।
- source_word: εἰς πάσας
  choice: सब पीढ़ियों के लिए
  rationale: प्राप्त यूनानी पाठ ‘सब के लिए’ जैसे अधूरे स्त्रीलिंगी पद पर समाप्त होता है। वाक्य को सुसंगत बनाने के लिए दीर्घ यूनानी परंपरा के अनुरूप ‘पीढ़ियों’ की पूर्ति की गई है और इसे पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: नप्ताली के गोत्र का यरूशलेम की उपासना से हटना
  choice: विमुख हो गया
  alternative: विद्रोह कर बैठा / धर्मत्यागी हो गया
  rationale: ‘विमुख’ वाचा और उपासना से अलग होने की गंभीरता बनाए रखता है, पर मूल से अधिक स्पष्ट दोषारोपण या बाद की तकनीकी धारणा नहीं जोड़ता।
- issue: बलिदान के लिए यरूशलेम का चुना जाना
  choice: यरूशलेम को इस्राएल के सभी गोत्रों में से इसलिए चुना गया था कि सभी गोत्र वहीं बलि चढ़ाएँ
  alternative: सभी गोत्रों के बलिदान के लिए यरूशलेम चुना गया था
  rationale: यह यरूशलेम के चुनाव और सभी गोत्रों के केंद्रीय बलिदान-स्थल होने—दोनों कथनों को स्पष्ट रूप से सुरक्षित रखता है।
- issue: मंदिर को परमप्रधान का निवासस्थान कहना
  choice: मंदिर—परमप्रधान का निवासस्थान—
  alternative: परमप्रधान के निवास का मंदिर
  rationale: विराम-चिह्नों वाला रूप मूल के संबंध को स्पष्ट रखता है, पर ईश्वरीय उपस्थिति की प्रकृति को मूल से आगे परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘यरूशलेम का भवन’ कुछ असामान्य लग सकता है, पर मूल में οἶκος और ναός के जानबूझकर रखे गए भेद को सुरक्षित रखने के लिए इसे रखा गया और पादटिप्पणी से स्पष्ट किया गया है। कठिन अंतिम पद की पूर्ति मुख्य पाठ में पठनीय रूप से दी गई है, पर उसकी अनिश्चितता छिपाई नहीं गई।
