base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/010.yaml
  text: And when we were taken captive to Nineveh[a], all my brothers and those of my kindred ate from the bread of the Gentiles;
translation:
  language: hi
  text: जब हमें बंदी बनाकर नीनवे ले जाया गया, तब मेरे सभी भाई और मेरे कुल के लोग अन्यजातियों की रोटी[a] खाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘अन्यजातियों की रोटियाँ’; यहाँ ‘रोटी’ का आशय भोजन-सामग्री भी हो सकता है।
    reason: ‘रोटियाँ’ के शाब्दिक अर्थ और ‘भोजन’ के संभावित मुहावरेदार अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ᾐχμαλωτίσθημεν εἰς Νινευή
  choice: हमें बंदी बनाकर नीनवे ले जाया गया
  rationale: यूनानी कर्मवाच्य रूप जबरन बंदी बनाए जाने को और εἰς गंतव्य को व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए दोनों भाव सुरक्षित रखता है।
- source_word: πάντες οἱ ἀδελφοί μου
  choice: मेरे सभी भाई
  rationale: ἀδελφοί का सीधा अर्थ ‘भाई’ है; अगले व्यापक कुल-संबंधी पद से इसका भेद भी बना रहता है।
- source_word: οἱ ἐκ τοῦ γένους
  choice: मेरे कुल के लोग
  rationale: γένος यहाँ वंश अथवा विस्तृत कुटुंब-समूह को दर्शाता है। ‘कुल के लोग’ आधुनिक हिंदी में स्पष्ट है और आधुनिक अर्थ में ‘जाति’ कहने से उत्पन्न भ्रम से बचता है।
- source_word: ἤσθιον
  choice: खाते थे
  rationale: अपूर्ण भूतकालीन रूप निर्वासन के दौरान प्रचलित या बार-बार होने वाले आचरण का संकेत दे सकता है; ‘खाते थे’ इस पक्ष को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐκ τῶν ἄρτων τῶν ἐθνῶν
  choice: अन्यजातियों की रोटी
  rationale: ἄρτων का ठोस अर्थ ‘रोटियाँ’ है, पर यह भोजन-सामग्री का मुहावरा भी हो सकता है। ‘अन्यजातियों’ से यहूदी और गैर-यहूदी समुदायों का प्रसंगगत भेद प्रकट होता है।
theological_decisions:
- issue: ἐθνῶν का जातीय-धार्मिक आशय
  choice: अन्यजातियों
  alternative: राष्ट्रों / दूसरी जातियों
  rationale: तोबीत के निर्वासन-प्रसंग में यह शब्द इस्राएलियों के विपरीत गैर-इस्राएली लोगों को दर्शाता है; ‘अन्यजातियों’ से यह संबंध सुरक्षित रहता है।
- issue: भोजन को मुख्य पाठ में अशुद्ध कहना या न कहना
  choice: केवल ‘अन्यजातियों की रोटी’ कहना
  alternative: अन्यजातियों का अशुद्ध भोजन
  rationale: इस वाक्य में यूनानी पाठ भोजन को स्पष्ट रूप से ‘अशुद्ध’ नहीं कहता। इसलिए धार्मिक आहार-संबंधी निहितार्थ को अनुवाद में जोड़कर स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कुल के लोग’ विस्तृत पारिवारिक समूह को व्यक्त करता है, और ‘खाते थे’ यूनानी अपूर्ण भूतकाल के संभावित प्रचलित आचरण को दर्शाता है।
