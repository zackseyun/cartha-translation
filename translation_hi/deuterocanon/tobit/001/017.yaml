  yaml_path: translation/deuterocanon/tobit/001/017.yaml
  text: I gave my bread to the hungry and clothing to the naked[a], and if I saw any of my kin dead and thrown behind the wall of Nineveh, I buried him.
translation:
  language: hi
  text: मैं अपनी रोटियाँ भूखों को देता और वस्त्र उन लोगों को देता था जिनके पास पहनने को कुछ न था। और यदि मैं अपने लोगों में से किसी को मरा हुआ और नीनवे की नगर-दीवार के पीछे[a] फेंका हुआ देखता, तो उसे दफ़ना देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नीनवे की नगर-दीवार के बाहर।” यूनानी में शाब्दिक रूप से “पीछे” है; सम्भवतः आशय नगर की दीवार के पार फेंके गए शवों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἄρτους μου
  choice: अपनी रोटियाँ
  rationale: बहुवचन ἄρτους को ‘रोटियाँ’ कहना उसके वचन और भोजन बाँटने के ठोस चित्र को सुरक्षित रखता है; ‘अपनी’ मूल के संबंधसूचक भाव को व्यक्त करता है।
- source_word: ἐδίδουν
  choice: देता ... था
  rationale: अपूर्ण भूतकाल यहाँ बार-बार की जाने वाली आदतन सेवा का संकेत देता है, जिसे हिन्दी का ‘देता था’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς πεινῶσιν
  choice: भूखों को
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: ἱμάτια
  choice: वस्त्र
  rationale: यह आधुनिक, गरिमापूर्ण और पर्याप्त रूप से व्यापक शब्द है।
- source_word: τοῖς γυμνοῖς
  choice: उन लोगों को ... जिनके पास पहनने को कुछ न था
  rationale: γυμνός इस दान-संदर्भ में वस्त्रहीन या पर्याप्त कपड़ों से वंचित लोगों को बताता है; यह रूप हिन्दी में स्पष्ट है और अनावश्यक शारीरिक नग्नता पर बल नहीं देता।
- source_word: ἐκ τοῦ γένους μου
  choice: अपने लोगों में से
  rationale: γένος रिश्तेदारी, वंश या व्यापक जातीय समुदाय को सूचित कर सकता है। ‘अपने लोगों’ इस दायरे को संकीर्ण परिवार तक सीमित नहीं करता।
- source_word: ἐθεώρουν
  choice: देखता
  rationale: अपूर्ण भूतकाल की आदतन पुनरावृत्ति को शर्तीय वाक्य में ‘देखता’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τεθνηκότα
  choice: मरा हुआ
  rationale: पूर्ण कृदन्त व्यक्ति की मृत अवस्था को सीधे व्यक्त करता है।
- source_word: ἐρριμμένον
  choice: फेंका हुआ
  rationale: पूर्ण कृदन्त शव को फेंककर छोड़ दिए जाने की अवस्था और अपमानजनक व्यवहार को सुरक्षित रखता है।
- source_word: ὀπίσω τοῦ τείχους Νινευή
  choice: नीनवे की शहरपनाह के पीछे
  rationale: ὀπίσω का मूल स्थानिक चित्र ‘पीछे’ से सुरक्षित रहता है; ‘शहरपनाह’ नगर की रक्षात्मक दीवार को स्पष्ट करता है। सम्भावित अर्थ ‘बाहर’ को पादटिप्पणी में रखा गया है।
- source_word: ἔθαπτον αὐτόν
  choice: उसे दफ़ना देता था
  rationale: अपूर्ण भूतकाल आदतन कार्य बताता है; ‘उसे’ यूनानी पुल्लिंग सर्वनाम को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: γένος μου का सामाजिक दायरा
  choice: अपने लोगों में से
  alternative: अपने परिवार में से / अपने रिश्तेदारों में से
  rationale: मूल शब्द निकट परिवार और व्यापक वंशीय या सामुदायिक संबंध दोनों के लिए प्रयुक्त हो सकता है। चुना हुआ रूप इस अस्पष्टता को यथासम्भव खुला रखता है।
- issue: शव का शहरपनाह के सापेक्ष स्थान
  choice: शहरपनाह के पीछे
  alternative: शहरपनाह के बाहर
  rationale: मूल यूनानी ὀπίσω का सीधा अर्थ ‘पीछे’ है, यद्यपि प्रसंग में शहर से बाहर फेंके गए शव अभिप्रेत हो सकते हैं। मुख्य पाठ मूल चित्र रखता है और सम्भावित व्याख्या पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर कथन की गरिमा बनाए रखती है। ‘देता था,’ ‘देखता’ और ‘दफ़ना देता था’ से यूनानी अपूर्ण भूतकाल के आदतन भाव को उभारा गया है। पादटिप्पणी-चिह्न [a] उसी वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
