- source_word: ΒΙΒΛΟΣ λόγων
  choice: वचनों की पुस्तक
  rationale: शीर्षक-सदृश यूनानी पदबंध का औपचारिक और सेमिटिक रंग सुरक्षित रखा गया है। अधिक मुहावरेदार ‘वृत्तांत’ सम्भव है, पर वह λόγων (‘वचनों’) को संक्षिप्त कर देता।
- source_word: Τωβείτ
  choice: तौबीत
  rationale: यूनानी नाम का हिन्दी में सुबोध लिप्यंतरण।
- source_word: τοῦ Τωβιὴλ τοῦ Ἀνανιὴλ τοῦ Ἀδουὴλ τοῦ ΒαΓαβαήλ
  choice: तौबीएल का पुत्र, अनानीएल का पौत्र, अदूएल का परपौत्र और गाबाएल का वंशज
  rationale: लगातार संबंधकारक रूपों में निहित वंश-संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है। चौथी पीढ़ी के लिए असहज गढ़े हुए रिश्ते के बजाय ‘वंशज’ रखा गया।
- source_word: ΒαΓαβαήλ
  choice: गाबाएल
  rationale: मुख्य यूनानी रूप कठिन है; उपलब्ध समानांतर परंपराएँ गाबाएल/गाबीएल के निकट रूप का समर्थन करती हैं। पाठ की कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: ἐκ τοῦ σπέρματος Ἀσιήλ
  choice: असीएल के कुल से
  rationale: σπέρμα का शाब्दिक अर्थ ‘बीज’ है, पर वंशावली में इसका आशय कुल या वंश है; आधुनिक हिन्दी में ‘कुल’ स्वाभाविक और स्पष्ट है।
- source_word: ἐκ τῆς φυλῆς Νεφθαλείμ
  choice: नप्ताली के गोत्र से
  rationale: φυλή का इस्राएली वंश-संदर्भ में स्थापित हिन्दी समतुल्य ‘गोत्र’ है; Νεφθαλείμ के लिए प्रचलित बाइबलीय नाम ‘नप्ताली’ रखा गया।
