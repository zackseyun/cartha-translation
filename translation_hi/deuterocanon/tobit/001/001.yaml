base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/001.yaml
  text: The book of the words of Tobit son of Tobiel[a], son of Ananiel, son of Aduel, son of Gabael, from the seed of Asiel, from the tribe of Naphtali[b],
translation:
  language: hi
  text: 'तौबीत के वचनों की पुस्तक[b]: तौबीत तौबीएल का पुत्र था; तौबीएल अनानीएल का पुत्र था; अनानीएल अदूएल का पुत्र था; और अदूएल बागाबाएल[a] का पुत्र था। तौबीत असीएल के कुल और नप्ताली के गोत्र से था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह नाम यूनानी पाठ में कठिन रूप ‘बागाबाएल’ में मिलता है। कुछ पाठ-साक्ष्यों और बाद की परंपराओं में ‘गाबाएल’ या ‘गाबीएल’ के निकट रूप मिलते हैं।
    reason: alternative_reading
  - marker: b
    text: यूनानी का शाब्दिक पदबंध ‘तौबीत के वचनों की पुस्तक’ है। इसे ‘तौबीत का वृत्तांत’ या ‘तौबीत का लेखा’ भी कहा जा सकता है।
    reason: lexical_alternative
