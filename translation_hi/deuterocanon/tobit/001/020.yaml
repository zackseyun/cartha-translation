  yaml_path: translation/deuterocanon/tobit/001/020.yaml
  text: And all my possessions were plundered[a], and nothing was left to me except Anna my wife and Tobit my son.
translation:
  language: hi
  text: और मेरी सारी सम्पत्ति लूट ली गई, और मेरी पत्नी अन्ना और मेरे बेटे तोबीत के सिवा मेरे पास कुछ भी नहीं बचा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ आशय यह है कि उसकी सम्पत्ति लूट लिए जाने के बाद केवल उसकी पत्नी अन्ना और उसका बेटा तोबीत उसके साथ बचे थे; इसका अर्थ यह नहीं कि पत्नी और बेटा उसकी सम्पत्ति थे।
    reason: मूल यूनानी वाक्य की संरचना से उत्पन्न हो सकने वाली गलत समझ को स्पष्ट करना।
lexical_decisions:
- source_word: διηρπάγη
  choice: लूट ली गई
  rationale: यह निष्क्रिय क्रिया दूसरों द्वारा सम्पत्ति बलपूर्वक छीन लिए जाने का भाव व्यक्त करती है; ‘लूट ली गई’ उस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: मेरी सारी सम्पत्ति
  rationale: यह पद व्यक्ति की समस्त भौतिक सम्पत्ति को दर्शाता है; ‘सारी सम्पत्ति’ πάντα की पूर्णता और τὰ ὑπάρχοντα का व्यापक अर्थ दोनों बनाए रखता है।
- source_word: οὐ κατελείφθη μοι οὐδέν
  choice: मेरे पास कुछ भी नहीं बचा
  rationale: यह अनुवाद यूनानी निष्क्रिय अभिव्यक्ति को सहज हिन्दी में देते हुए οὐδέν के पूर्ण निषेध पर बल बनाए रखता है।
- source_word: πλὴν
  choice: के सिवा
  rationale: यह अपवाद को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἄννας
  choice: अन्ना
  rationale: यह यूनानी नाम Ἄννα का सीधा देवनागरी लिप्यंतरण है।
- source_word: Τωβεὶτ
  choice: तोबीत
  rationale: यह पद में आए यूनानी नाम Τωβεὶτ का निकट देवनागरी लिप्यंतरण है और पुस्तक के नाम से भी संगत है।
theological_decisions:
- issue: पत्नी और पुत्र का ‘सम्पत्ति’ के साथ अपवाद के रूप में उल्लेख
  choice: वाक्य की मूल संरचना बनाए रखी गई और अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया।
  alternative: वाक्य को इस प्रकार पुनर्गठित करना कि परिवार और सम्पत्ति के बीच कोई व्याकरणिक संबंध न दिखे।
  rationale: यूनानी पाठ की वास्तविक अभिव्यक्ति को सुरक्षित रखना उचित है, पर आधुनिक पाठक को यह स्पष्ट करना भी आवश्यक है कि पत्नी और पुत्र को सम्पत्ति नहीं कहा जा रहा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘सम्पत्ति’, ‘के सिवा’ और ‘कुछ भी नहीं बचा’ सामान्य पाठकों के लिए सहज हैं और यूनानी पाठ की पूर्ण हानि तथा अपवाद की संरचना बनाए रखते हैं।
