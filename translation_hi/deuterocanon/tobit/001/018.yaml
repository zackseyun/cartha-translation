base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/018.yaml
  text: And if Sennacherib the king killed any when he came fleeing from Judea[a], I buried them secretly; for in his anger he killed many, and the bodies were sought by the king, but they were not found.
translation:
  language: hi
  text: और यदि राजा सन्हेरीब[a] ने, जब वह यहूदिया से भागता हुआ आया, किसी को मार डाला था, तो मैंने उन्हें गुप्त रूप से दफ़नाया; क्योंकि उसने अपने क्रोध में बहुतों को मार डाला था। राजा ने शवों को ढूँढ़वाया, पर वे नहीं मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वेट के यूनानी पाठ में यहाँ “राजा अख्रेइल” (Ἀχρειλ ὁ βασιλεύς) है; प्रसंग में यह नाम सन्हेरीब के लिए प्रयुक्त समझा जाता है।
    reason: textual_variant
lexical_decisions:
- source_word: καὶ εἴ τινα
  choice: तब यदि उसने किसी को
  rationale: शर्तसूचक अनिश्चितता को बनाए रखता है। आगे आए बहुवचन αὐτούς के अनुरूप ‘उन्हें’ उन अलग-अलग लोगों की ओर संकेत करता है जिन्हें ऐसी स्थिति में तोबीत ने दफ़नाया।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: हत्या या मृत्युदंड में से किसी एक कानूनी अर्थ को अनावश्यक रूप से निश्चित किए बिना सामान्य और स्पष्ट अर्थ देता है।
- source_word: Ἀχρειλ ὁ βασιλεύς
  choice: राजा सन्हेरीब[a]
  rationale: कथानक में अभिप्रेत अश्शूरी राजा के प्रचलित हिन्दी नाम का उपयोग किया गया है; स्वेट के यूनानी पाठ का असामान्य नाम-रूप पादटिप्पणी में सुरक्षित है।
- source_word: ὅτε ἦλθεν φεύγων
  choice: जब ... भागता हुआ आया
  rationale: ἦλθεν की आगमन-क्रिया और φεύγων की भागने की क्रिया, दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐκ τῆς Ἰουδαίας
  choice: यहूदिया से
  rationale: हेलेनिस्टिक यूनानी में क्षेत्र के नाम Ἰουδαία का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: ἔθαψα αὐτοὺς κλέπτων
  choice: मैंने उन्हें चोरी-छिपे दफ़ना दिया
  rationale: κλέπτων यहाँ चोरी करने के बजाय गुप्त ढंग से कार्य करने का भाव देता है; ‘चोरी-छिपे’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ θυμῷ αὐτοῦ
  choice: अपने क्रोध में
  rationale: θυμός की तीव्र भावावस्था को बिना अतिरंजना के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξητήθη ὑπὸ τοῦ βασιλέως
  choice: राजा ने ... ढुँढ़वाया
  rationale: यूनानी कर्मवाच्य और राजकीय कर्तृत्व को सहज हिन्दी में कारणवाचक क्रिया द्वारा व्यक्त करता है—राजा ने स्वयं खोज की हो या अपने लोगों से करवाई हो, इसे अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὰ σώματα
  choice: शवों
  rationale: मारे गए लोगों के मृत शरीर यहाँ अभिप्रेत हैं; ‘शव’ प्रसंग में ‘शरीर’ से अधिक स्पष्ट है।
- source_word: οὐχ εὑρέθη
  choice: वे नहीं मिले
  rationale: यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ एकवचन क्रिया सामान्य है; हिन्दी में अर्थानुसार बहुवचन स्वाभाविक है।
theological_decisions:
- issue: अश्शूरी राजा के नाम का पाठ-रूप
  choice: मुख्य पाठ में ‘सन्हेरीब’, और यूनानी ‘अख्रेइल’ को पादटिप्पणी में
  alternative: मुख्य पाठ में ‘राजा अख्रेइल’
  rationale: यह सिद्धान्तगत निर्णय नहीं, बल्कि पाठगत पारदर्शिता का विषय है। निकटवर्ती कथानक सन्हेरीब की पहचान का समर्थन करता है, जबकि पादटिप्पणी प्रत्यक्ष यूनानी पाठ-रूप को छिपने नहीं देती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘चोरी-छिपे’ गुप्त दफ़न का जीवंत किंतु अनौपचारिक न लगने वाला मुहावरा है। वाक्य-विन्यास यूनानी की शर्तसूचक अनिश्चितता और एक से अधिक पीड़ितों की ओर संकेत—‘किसी’/‘उन्हें’—दोनों को बनाए रखता है।
