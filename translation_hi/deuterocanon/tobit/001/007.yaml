base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/007.yaml
  text: And I would give them to the priests[a], the sons of Aaron, for the altar, from the produce; I would give the tenth to the sons of Levi who minister in Jerusalem[b], and I would sell the second tenth and go and spend it in Jerusalem each year.
translation:
  language: hi
  text: और उन्हें मैं उपज में से वेदी के लिए हारून के वंशज याजकों को दिया करता था। दसवाँ भाग[a] मैं यरूशलेम में सेवा करनेवाले लेवी के वंशजों को देता था; और दूसरे दसवें भाग को बेच देता[b], फिर हर वर्ष यरूशलेम जाकर उसे खर्च करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दसवाँ भाग’ और ‘दूसरा दसवाँ भाग’ को अधिक प्रचलित धार्मिक भाषा में क्रमशः ‘दशमांश’ और ‘दूसरा दशमांश’ कहा जा सकता है। यूनानी पाठ में शाब्दिक रूप से ‘दसवाँ’ और ‘दूसरा दसवाँ’ है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ अनूदित क्रिया का अर्थ दूसरे दसवें भाग को बेचकर धन में बदलना भी समझा जा सकता है, ताकि वह धन यरूशलेम में खर्च किया जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδουν
  choice: दिया करता था / देता था
  rationale: अपूर्ण भूतकाल यहाँ बीते समय की नियमित प्रथा बताता है; हिन्दी में ‘दिया करता था’ और प्रसंगानुसार ‘देता था’ इस अभ्यस्त भाव को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρών
  choice: हारून के वंशज याजकों को
  rationale: यूनानी में याजकों की पहचान ‘हारून के पुत्रों’ के रूप में स्पष्ट है। ‘वंशज’ आधुनिक हिन्दी में जैविक पुत्रों तक सीमित हुए बिना उसी वंशगत आशय को व्यक्त करता है।
- source_word: πρὸς τὸ θυσιαστήριον τῶν γενημάτων
  choice: उपज में से वेदी के लिए जो कुछ होता
  rationale: संक्षिप्त यूनानी पदबंध में कृषि-उपज और वेदी के लिए दिए जाने का संबंध दोनों हैं। यह रूप अर्थ को स्पष्ट करता है, पर भेंट का कोई अधिक विशिष्ट प्रकार नहीं जोड़ता।
- source_word: τὴν δεκάτην
  choice: दसवाँ भाग
  rationale: यह यूनानी के शाब्दिक अर्थ को रखता है और आधुनिक हिन्दी में समझने योग्य है; प्रचलित धार्मिक पद ‘दशमांश’ पादटिप्पणी में दिया गया है।
- source_word: τοῖς υἱοῖς Λευεί
  choice: लेवी के वंशजों को
  rationale: मूल में ‘लेवी के पुत्र’ है। ‘वंशज’ वंशगत समुदाय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ
  choice: यरूशलेम में सेवा करनेवाले
  rationale: मन्दिर-उपासना के प्रसंग में θεραπεύω धार्मिक सेवा को सूचित करता है; ‘सेवा करनेवाले’ सहज है और अनावश्यक पदानुक्रम नहीं जोड़ता।
- source_word: τὴν δευτέραν δεκάτην
  choice: दूसरे दसवें भाग
  rationale: मूल का शाब्दिक रूप बनाए रखा गया है, जिससे अलग दूसरी देन का संकेत स्पष्ट रहता है; ‘दूसरा दशमांश’ पादटिप्पणी में दिया गया है।
- source_word: ἀπεπρατιζόμην
  choice: बेच देता
  rationale: क्रिया बेचने या बिक्री द्वारा मूल्य में बदलने को सूचित करती है। ‘बेच देता’ मूल क्रिया को सीधे रखता है; धन में बदलने की सम्भावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἐδαπάνων αὐτὰ
  choice: वहाँ उससे मिला धन खर्च करता था
  rationale: बेचने के बाद खर्च की जानेवाली वस्तु स्वाभाविक रूप से उससे प्राप्त धन है। हिन्दी में यह संबंध स्पष्ट करना वाक्य को सहज बनाता है और निकट प्रसंग से आगे नहीं जाता।
- source_word: καθʼ ἕκαστον ἐνιαυτόν
  choice: हर वर्ष
  rationale: वितरणात्मक पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप।
