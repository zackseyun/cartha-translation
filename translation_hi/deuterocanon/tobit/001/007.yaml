- issue: एक से अधिक दसवें भागों से संबंधित व्यवस्था-विषयक शब्दावली
  choice: मुख्य पाठ में ‘दसवाँ भाग’ और ‘दूसरा दसवाँ भाग’
  alternative: ‘दशमांश’ और ‘दूसरा दशमांश’
  rationale: शाब्दिक रूप यूनानी की अभिव्यक्ति और अलग-अलग देनों के बीच तनाव को बनाए रखता है; अधिक परिचित धार्मिक शब्द पादटिप्पणी में उपलब्ध है।
- issue: ἀπεπρατιζόμην का अर्थ
  choice: ‘बेच देता’
  alternative: ‘धन में बदल देता’
  rationale: यूनानी क्रिया सीधे बिक्री का अर्थ दे सकती है, जबकि आगे जाकर खर्च करने का प्रसंग धन में बदलने की व्यावहारिक परिणति दिखाता है। मुख्य पाठ में सीधा अर्थ और पादटिप्पणी में वैकल्पिक समझ रखी गई है।
