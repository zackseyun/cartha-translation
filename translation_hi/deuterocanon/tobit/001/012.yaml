  rationale: क्रिया का सीधा अर्थ याद या स्मरण करना है। ‘स्मरण किया’ गरिमापूर्ण बाइबिलीय भाषा है और परमेश्वर को लगातार ध्यान में रखने के भाव को अनुचित रूप से विस्तार नहीं देती।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर को
  rationale: सम्बन्धकारक पद यहाँ क्रिया का कर्म है; हिन्दी में इसे ‘को’ के साथ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐν ὅλῃ τῇ ψυχῇ μου
  choice: अपने सारे मन से
  rationale: यह वाक्यांश सम्पूर्ण आन्तरिक निष्ठा को व्यक्त करता है। हिन्दी में ‘सारे मन से’ स्वाभाविक और बाइबिलीय है; टिप्पणी में ‘प्राण’ देकर ψυχή की अधिक शाब्दिक सम्भावना सुरक्षित रखी गई है।
theological_decisions:
- issue: ψυχή का मानव-स्वरूप सम्बन्धी अर्थ
  choice: मन
  alternative: प्राण
  rationale: इस भक्तिपरक मुहावरे में ‘मन’ सामान्य हिन्दी पाठक के लिए सम्पूर्ण आन्तरिक लगाव को सहजता से व्यक्त करता है। फिर भी ψυχή को केवल मानसिक क्षमता तक सीमित न समझा जाए, इसलिए अधिक शाब्दिक ‘प्राण’ को पाद-टिप्पणी में रखा गया है।
