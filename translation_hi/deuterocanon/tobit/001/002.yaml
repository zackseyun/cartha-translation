base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/002.yaml
  text: who was taken captive in the days of Enemessaros king of the Assyrians[a], from Thisbe, which is to the south of Kedesh of Naphtali in Galilee[b], above Asher.
translation:
  language: hi
  text: जिसे अश्शूरियों के राजा एनेमेस्सार के दिनों में थिस्बे से बंदी बनाकर ले जाया गया था। थिस्बे गलील में नप्ताली के किडियोस के दाहिनी ओर और आशेर के ऊपर स्थित है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के स्थान-नाम और भौगोलिक संबंध कठिन हैं। यूनानी पाठ में ‘किडियोस’ है, जिसकी पहचान कभी-कभी केदेश से की जाती है। ‘दाहिनी ओर’ और ‘आशेर के ऊपर’ को अपेक्षाकृत शाब्दिक रखा गया है, क्योंकि उनकी ठीक दिशात्मक व्याख्या अनिश्चित है। ‘एनेमेस्सार’ की पहचान भी कभी-कभी अश्शूरी राजा शल्मनेसेर से की जाती है, पर यूनानी पाठ में एनेमेस्सार नाम ही है।
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: ᾐχμαλωτεύθη
  choice: बंदी बनाकर ले जाया गया था
  rationale: यूनानी कर्मवाच्य क्रिया बलपूर्वक बंदी बनाकर ले जाए जाने को व्यक्त करती है; यह अनुवाद उस गति और विवशता दोनों को बनाए रखता है।
- source_word: ἐν ἡμέραις
  choice: के दिनों में
  rationale: यह यूनानी काल-सूचक मुहावरे का स्वाभाविक और निकट हिन्दी रूप है।
- source_word: Ἐνεμεσσαάρου
  choice: एनेमेस्सार
  rationale: स्वीटे के यूनानी पाठ में प्राप्त नाम का लिप्यंतरण रखा गया है; इसे अनिश्चित ऐतिहासिक पहचान ‘शल्मनेसेर’ से नहीं बदला गया।
- source_word: ἐκ Θίσβης
  choice: थिस्बे से
  rationale: ἐκ मूल स्थान या प्रस्थान-बिंदु बताता है; ‘से’ इस संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐκ δεξιῶν
  choice: के दाहिनी ओर
  rationale: शाब्दिक स्थान-संबंध बनाए रखा गया है; इसे ‘दक्षिण’ कहना भौगोलिक अभिमुखता का अनिश्चित निष्कर्ष जोड़ देता।
- source_word: Κυδίως
  choice: किडियोस
  rationale: यूनानी पाठ में स्थान-नाम अस्पष्ट है; इसलिए अनुमानित पहचान ‘केदेश’ के बजाय प्रमाणित यूनानी रूप का लिप्यंतरण सुरक्षित है।
- source_word: τῆς Νεφθαλεὶμ
  choice: नप्ताली के
  rationale: सम्बन्धकारक रूप किडियोस को नप्ताली से संबद्ध करता है; हिन्दी में ‘के’ इस संबंध को बनाए रखता है।
- source_word: ἐν τῇ Γαλειλαίᾳ
  choice: गलील में
  rationale: यह भौगोलिक वाक्यांश का मानक और स्वाभाविक हिन्दी रूप है।
- source_word: ὑπεράνω Ἀσήρ
  choice: आशेर के ऊपर
  rationale: ‘ऊपर’ स्थान-सूचक अस्पष्टता को बनाए रखता है; ‘उत्तर में’ कहना पाठ से अधिक निश्चित व्याख्या होती।
