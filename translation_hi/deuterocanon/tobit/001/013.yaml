  text: And the Most High gave me favor and good standing before Enemessar[b][a], and I was his buyer.
translation:
  language: hi
  text: और परमप्रधान ने एनेमेस्सार के सामने मुझे कृपा और मनोहर रूप[a] दिया, और मैं उसका खरीदार[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपा और अच्छी प्रतिष्ठा।” यूनानी शब्द μορφή का अर्थ रूप या बाहरी स्वरूप हो सकता है; इस राजदरबारी प्रसंग में उसका ठीक आशय निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका क्रय-अधिकारी।” यूनानी में शाब्दिक अर्थ “खरीदार” है; सम्भवतः आशय राजकीय आवश्यकताओं की खरीद करने वाले अधिकारी से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: परमप्रधान
  rationale: यह यहूदी यूनानी में परमेश्वर की प्रचलित उपाधि है; हिन्दी बाइबलीय प्रयोग में ‘परमप्रधान’ इसके उपाधिगत बल को बनाए रखता है।
- source_word: χάριν
  choice: कृपा
  rationale: यहाँ राजदरबार में अनुकूल दृष्टि और स्वीकृति का भाव है; ‘कृपा’ स्वाभाविक है और μορφήν से अलग अर्थ बनाए रखती है।
- source_word: μορφήν
  choice: मनोहर रूप
  rationale: μορφή मूलतः रूप या बाहरी आकृति को सूचित करता है। ‘मनोहर रूप’ सकारात्मक भाव को व्यक्त करता है, पर इसे अमूर्त ‘प्रतिष्ठा’ बनाकर मूल की दृश्य देहात्मक संभावना को समाप्त नहीं करता।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह राजा की उपस्थिति और उसकी दृष्टि में होने, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἐνεμεσσάρου
  choice: एनेमेस्सार
  rationale: यूनानी पाठ के नामरूप का लिप्यंतरण किया गया है; इसे परिचित ऐतिहासिक नाम से सामंजस्य नहीं दिया गया।
- source_word: ἀγοραστής
  choice: खरीदार
  rationale: शब्द का प्रत्यक्ष अर्थ ‘खरीदार’ है। सम्भावित राजकीय क्रय-अधिकारी का अर्थ पाद-टिप्पणी में दिया गया है, ताकि मूल की सादगी और पद की सम्भावना दोनों बनी रहें।
theological_decisions:
- issue: ὁ ὕψιστος की ईश्वरीय उपाधि
  choice: परमप्रधान
  alternative: परमेश्वर
  rationale: उपाधि को सामान्य ईश्वर-संज्ञा में बदलने के बजाय उसके विशिष्ट बाइबलीय रूप को सुरक्षित रखा गया है।
- issue: χάριν καὶ μορφὴν का अर्थ-संबंध
  choice: कृपा और मनोहर रूप
  alternative: कृपा और अच्छी प्रतिष्ठा
  rationale: μορφή का मूल अर्थ रूप/आकृति है और दरबारी संदर्भ में उसका सटीक आशय अनिश्चित है; इसलिए पाठ में दृश्य अर्थ रखा और वैकल्पिक सामाजिक अर्थ पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य की आत्मकथात्मक शैली और यूनानी पाठ का समन्वयी ‘और…और’ विन्यास रखा गया है। सभी पाद-टिप्पणी चिह्न सम्बद्ध शब्दों के तुरन्त बाद लगाए गए हैं।
