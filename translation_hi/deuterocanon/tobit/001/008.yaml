base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/008.yaml
  text: And the third I would give to those to whom it was due[a], just as Deborah, my father's mother, commanded[c][b], because I was left an orphan by my father.
translation:
  language: hi
  text: और तीसरा भाग मैं उन लोगों को दिया करता था जिनका उस पर हक था[a], ठीक वैसे ही जैसे मेरे पिता की माता दबोरा[b] ने मुझे आज्ञा दी थी, क्योंकि पिता को खोकर मैं अनाथ रह गया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘तीसरा’; यूनानी में ‘भाग’ जैसे शब्द को प्रसंग से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात मेरी दादी; यूनानी में शाब्दिक रूप से ‘मेरे पिता की माता’।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से, ‘मैं अपने पिता द्वारा अनाथ छोड़ दिया गया था’; यहाँ आशय पिता को खोने के कारण अनाथ रह जाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν τρίτην
  choice: तीसरा भाग
  rationale: यूनानी में संज्ञा अध्याहृत है और प्रसंग किसी हिस्से की ओर संकेत करता है। हिन्दी में अर्थ स्पष्ट और स्वाभाविक रखने के लिए ‘भाग’ जोड़ा गया है।
- source_word: ἐδίδουν
  choice: दिया करता था
  rationale: अपूर्ण भूतकाल नियमित या बार-बार किए जाने वाले काम को व्यक्त करता है; ‘दिया करता था’ हिन्दी में इस पक्ष को स्वाभाविक रूप से दर्शाता है।
- source_word: οἷς καθήκει
  choice: जिनका उस पर हक था
  rationale: καθήκει उचित होने, देय होने या अधिकारपूर्वक मिलने का भाव रखता है। यह अनुवाद पात्रों को अनावश्यक रूप से अधिक विशिष्ट किए बिना अधिकार का भाव देता है।
- source_word: καθὼς ἐνετείλατο
  choice: ठीक वैसे ही जैसे ... ने मुझे आज्ञा दी थी
  rationale: क्रिया किसी निर्देश या आदेश का बोध कराती है। हिन्दी में कर्म ‘मुझे’ निहित अर्थ को स्पष्ट करता है।
- source_word: Δεββώρα
  choice: दबोरा
  rationale: यूनानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप सहज लिप्यंतरण।
- source_word: ἡ μήτηρ τοῦ πατρός μου
  choice: मेरे पिता की माता
  rationale: स्रोत की स्पष्ट संबंध-संज्ञा को बनाए रखा गया है; केवल ‘दादी’ कहने की अपेक्षा यह यूनानी संरचना के अधिक निकट है।
- source_word: διότι
  choice: क्योंकि
  rationale: यह दबोरा द्वारा आज्ञा दिए जाने का कारण प्रस्तुत करता है।
- source_word: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  choice: पिता के न रहने से मैं अनाथ हो गया था
  rationale: शाब्दिक ‘मैं अपने पिता द्वारा अनाथ छोड़ दिया गया’ हिन्दी में भ्रामक हो सकता है, मानो पिता ने जानबूझकर त्याग दिया हो। चुना हुआ रूप पिता की मृत्यु या अनुपस्थिति का आशय देता है, पर ‘मृत्यु’ को मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ता।
