base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/014.yaml
  text: Oh[a], blessed are those who love you; they will rejoice over your peace. Blessed are all who were grieved over your afflictions, because they will rejoice over you when they see all your glory; and my soul will rejoice forever.
translation:
  language: hi
  text: अहा, धन्य हैं वे जो तुझसे प्रेम करते हैं; वे तेरी शान्ति के कारण आनन्दित होंगे। धन्य हैं वे सभी जो तेरी विपत्तियों[a] से दुःखी हुए, क्योंकि वे तेरे कारण आनन्दित होंगे, जब वे तेरी सारी महिमा देखेंगे; और मेरा प्राण सदा आनन्दित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे कोड़ों,” “तेरी महामारियों,” अथवा “तेरी ताड़नाओं।” यूनानी शब्द μάστιξ का शाब्दिक अर्थ कोड़ा हो सकता है और लाक्षणिक रूप से दुःख के प्रहारों को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य
  rationale: यह यूनानी शब्द के आशीष और प्रशंसा से भरे धार्मिक भाव को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: οἱ ἀγαπῶντές σε
  choice: वे जो तुझसे प्रेम करते हैं
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त का सतत सम्बन्धपरक भाव स्पष्ट और स्वाभाविक हिन्दी में बना रहता है।
- source_word: χάρησονται / χαρήσονται
  choice: आनन्दित होंगे
  rationale: दोनों स्थानों पर एक ही यूनानी क्रिया की पुनरावृत्ति को हिन्दी में भी बनाए रखता है।
- source_word: ἐπὶ τῇ εἰρήνῃ σου
  choice: तेरी शान्ति पर
  rationale: ἐπί के कारण या अवसर के भाव को बनाए रखते हुए नगर की पुनःस्थापित कुशलता पर आनन्द प्रकट करता है।
- source_word: ὅσοι ἐλυπήθησαν
  choice: वे सभी जो ... से दुःखी हुए
  rationale: अतीत में अनुभव किए गए शोक को बिना मृत्यु-शोक का अतिरिक्त भाव जोड़े व्यक्त करता है।
- source_word: μάστιξίν
  choice: विपत्तियों
  rationale: यहाँ नगर पर पड़े दुःखद प्रहारों का व्यापक आलंकारिक अर्थ उपयुक्त है; शब्द की अधिक शाब्दिक सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: θεασάμενοι
  choice: जब वे ... देखेंगे
  rationale: 'कृदन्त का कालगत सम्बन्ध मुहावरेदार हिन्दी में व्यक्त होता है: महिमा देखने पर वे आनन्दित होंगे।'
- source_word: πᾶσαν τὴν δόξαν σου
  choice: तेरी सारी महिमा
  rationale: πᾶσαν की समग्रता और δόξα के गौरवपूर्ण अर्थ को सीधे बनाए रखता है।
- source_word: εὐφρανθήσεται
  choice: आनन्दित रहेगा
  rationale: भविष्य के आनन्द और उसके स्थायी बने रहने को εἰς τὸν αἰῶνα के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ ψυχή μου
  choice: मेरा प्राण
  rationale: वक्ता के आन्तरिक और सम्पूर्ण व्यक्तित्व को गरिमापूर्ण बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: स्थायी अवधि का संक्षिप्त, आधुनिक और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: स्त्रीलिंग एकवचन द्वितीय पुरुष सर्वनामों का सन्दर्भ
  choice: व्यक्तिरूप में सम्बोधित यरूशलेम/सिय्योन
  alternative: अधिक सामान्य रूप से परमेश्वर की प्रजा
  rationale: आस-पास के भजन में नगर को सीधे सम्बोधित करके उसकी शान्ति, विपत्तियों और महिमा की बात की गई है। मुख्य पाठ में नाम जोड़ने के बजाय 'तू/तेरी' रखा गया है, जिससे मूल की प्रत्यक्ष सम्बोधन-शैली और उसका सन्दर्भ दोनों बने रहते हैं।
