  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। व्यक्तिरूप यरूशलेम के लिए निकट, काव्यात्मक एकवचन सम्बोधन ‘तू/तेरी’ रखा गया है। आरम्भिक ὦ को ‘अहा’ से व्यक्त किया गया है, और आनन्द की आवर्ती शब्दावली को सम्भव सीमा तक बनाए रखा गया है।
