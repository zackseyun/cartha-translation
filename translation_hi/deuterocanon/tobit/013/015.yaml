lexical_decisions:
- source_word: εὐλόγει
  choice: धन्य कहो
  rationale: यह εὐλογέω के एकवचन आज्ञार्थक रूप की सीधी क्रिया-शक्ति और परमेश्वर के विषय में भला कहने की बाइबलीय अभिव्यक्ति को सुरक्षित रखता है; ‘स्तुति करो’ संभव है, पर अर्थ-क्षेत्र को कुछ संकरा कर देता है।
- source_word: τὸν θεὸν
  choice: परमेश्वर को
  rationale: निश्चित उपपद सहित कर्मकारक संज्ञा यहाँ स्वाभाविक हिन्दी में ‘परमेश्वर को’ होती है; अलग से ‘उस परमेश्वर’ कहना अनावश्यक होगा।
- source_word: τὸν βασιλέα
  choice: राजा
  rationale: यह ‘परमेश्वर’ के समानाधिकरण में आया राजकीय पद है। हिन्दी में इसी वाक्यांश के भीतर ‘महान राजा परमेश्वर’ कहने से पहचान और पद दोनों स्पष्ट रहते हैं।
- source_word: τὸν μέγαν
  choice: महान
  rationale: μέγας का सीधा और व्यापक अर्थ ‘महान’ है; ‘सामर्थी’ विशेष रूप से शक्ति पर बल देकर अर्थ को सीमित करता।
theological_decisions:
- issue: परमेश्वर के राजकीय पद का विन्यास
  choice: महान राजा परमेश्वर
  alternative: परमेश्वर, महान राजा
  rationale: यूनानी में ‘परमेश्वर’ के साथ ‘राजा, महान’ समानाधिकरण में है। चुना हुआ विन्यास स्वाभाविक, गरिमापूर्ण हिन्दी में उसी पहचान को बनाए रखता है और कोई अतिरिक्त धर्मवैज्ञानिक आशय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, आज्ञार्थक और गरिमापूर्ण। ‘धन्य कहो’ ने मूल क्रिया का बाइबलीय मुहावरा बचाया है। मूल में संबोधित व्यक्ति एकवचन है, पर हिन्दी आज्ञार्थक रूप संख्या के विषय में स्वाभाविक रूप से अस्पष्ट रह सकता है।
