base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/002.yaml
  text: For he afflicts and shows mercy; he brings down to Hades and brings up[a], and there is no one who will escape his hand.
translation:
  language: hi
  text: क्योंकि वही दुःख देता और दया करता है; वह अधोलोक में उतारता और वहाँ से ऊपर लाता है[a], और कोई भी उसके हाथ से बच नहीं सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र में उतारता और फिर ऊपर लाता है,” अथवा “मृतकों के लोक में उतारता और फिर ऊपर लाता है।” यूनानी में “अधोलोक।”
    reason: ग्रीक ᾅδης के लिए सम्भव शाब्दिक और व्याख्यात्मक विकल्प बताना।
lexical_decisions:
- source_word: μαστιγοῖ
  choice: दुःख देता है
  rationale: क्रिया का शाब्दिक अर्थ कोड़े मारना है, पर इस काव्यात्मक कथन में यह व्यापक रूप से कष्ट या अनुशासन देने को व्यक्त करती है। ‘दुःख देता है’ कठोरता बनाए रखते हुए अनावश्यक रूप से शारीरिक दंड तक अर्थ सीमित नहीं करता।
- source_word: ἐλεᾷ
  choice: दया करता है
  rationale: यह दया या करुणा दिखाने को व्यक्त करता है और पहले खंड के साथ स्वाभाविक विरोधी समानांतर बनाता है।
- source_word: κατάγει
  choice: उतारता है
  rationale: नीचे ले जाने की गति को सीधे व्यक्त करता है और ἀνάγει के ‘ऊपर लाता है’ के साथ समानांतरता बनाए रखता है।
- source_word: εἰς ᾅδην
  choice: अधोलोक में
  rationale: ग्रीक ᾅδης मृतकों के लोक को दर्शाता है। ‘अधोलोक’ आधुनिक हिन्दी में समझने योग्य है और इसे केवल कब्र तक सीमित नहीं करता।
- source_word: ἀνάγει
  choice: वहाँ से ऊपर लाता है
  rationale: κατάγει का प्रतिलोम है। ‘वहाँ से’ हिन्दी में निहित स्रोत को स्पष्ट करता है, जबकि मृत्यु से उद्धार और पुनरुत्थान के बीच की संभावित अर्थगत व्यापकता को खुला रखता है।
- source_word: οὐκ ἔστιν ὃς ἐκφεύξεται
  choice: कोई भी ... बच नहीं सकेगा
  rationale: यह स्वाभाविक आधुनिक हिन्दी में बच निकलने की असंभवता व्यक्त करता है और ग्रीक भविष्यकाल का भाव बनाए रखता है।
- source_word: τὴν χεῖρα αὐτοῦ
  choice: उसके हाथ से
  rationale: ‘हाथ’ सामर्थ्य और नियंत्रण का बाइबलीय रूपक है; मूर्त बिंब को बनाए रखना अर्थ की शक्ति सुरक्षित रखता है।
theological_decisions:
- issue: अधोलोक में उतारने और वहाँ से ऊपर लाने का अर्थ
  choice: मृत्यु और मृतकों के लोक पर परमेश्वर की सार्वभौमिक सत्ता का सामान्य कथन, बिना इसे स्पष्ट रूप से पुनरुत्थान की शिक्षा तक सीमित किए
  alternative: किसी को मृत्यु के निकट पहुँचाकर फिर जीवन बचाना; अथवा अधोलोक से पुनरुत्थान का स्पष्ट कथन
  rationale: विरोधी क्रियाएँ जीवन और मृत्यु पर परमेश्वर की सत्ता बताती हैं, पर पाठ यह निर्धारित नहीं करता कि आशय नश्वर संकट से बचाव है या अधिक स्पष्ट पुनरुत्थान। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘अधोलोक’ को मुख्य पाठ में रखकर मूल यूनानी शब्द का व्यापक भाव सुरक्षित किया गया है; पादटिप्पणी वैकल्पिक अभिव्यक्तियाँ देती है।
