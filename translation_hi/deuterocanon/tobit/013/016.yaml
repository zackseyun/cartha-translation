  text: For Jerusalem will be built with sapphire and emerald[a], and your walls with precious stones, and the towers and battlements with pure gold[c][b],
translation:
  language: hi
  text: क्योंकि यरूशलेम नीलम और पन्ने से बनाया जाएगा, और तेरी दीवारें बहुमूल्य पत्थरों से बनाई जाएँगी; तेरी मीनारें और रक्षा-प्राचीरें शुद्ध सोने से बनाई जाएँगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκοδομηθήσεται
  choice: बनाया जाएगा
  rationale: यह οἰκοδομέω का भविष्यत् कर्मवाच्य रूप है। ‘बनाया जाएगा’ इसका सीधा अर्थ रखता है; पुनर्स्थापना के प्रसंग में ‘फिर बनाया जाएगा’ संभव है, पर यूनानी में पुनर्निर्माण का भाव अलग से स्पष्ट नहीं किया गया।
- source_word: σαπφείρῳ καὶ σμαράγδῳ
  choice: नीलम और पन्ने से
  rationale: दोनों दत्तिव रूप यहाँ निर्माण-सामग्री या अलंकरण का भाव देते हैं। ‘से’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λίθῳ ἐντίμῳ
  choice: बहुमूल्य पत्थरों से
  rationale: यूनानी में एकवचन का सामूहिक अर्थ संभव है। हिन्दी में बहुवचन इस निर्माण-चित्र को अधिक स्वाभाविक रूप से व्यक्त करता है, जबकि ἐντίμῳ का मूल्यवान होने का भाव सुरक्षित रहता है।
- source_word: τὰ τείχη σου
  choice: तेरी दीवारें
  rationale: σου स्पष्टतः द्वितीय पुरुष एकवचन है। इसलिए यरूशलेम को सीधे संबोधित करने वाला ‘तेरी’ बनाए रखा गया है।
- source_word: οἱ πύργοι
  choice: तेरी मीनारें
  rationale: नगर की रक्षात्मक संरचनाओं के प्रसंग में ‘मीनारें’ πύργοι का सुबोध और स्वाभाविक हिन्दी समतुल्य है; पहले आए σου का संबंध समन्वित पदों पर भी स्वाभाविक रूप से लागू होता है।
- source_word: οἱ προμαχῶνες
  choice: बाहरी किलेबंदियाँ
  rationale: यह शब्द नगर की आगे या बाहर स्थित रक्षात्मक संरचनाओं को सूचित करता है। यह अनुवाद केवल सजावटी कंगूरों का संकीर्ण अर्थ लेने के बजाय व्यापक सैन्य-रक्षात्मक अर्थ सुरक्षित रखता है।
- source_word: χρυσίῳ καθαρῷ
  choice: शुद्ध सोने से
  rationale: दत्तिव रूप सामग्री का भाव देता है और καθαρῷ की शुद्धता को ‘शुद्ध’ सीधे व्यक्त करता है।
theological_decisions:
- issue: यरूशलेम के भावी वैभव और पुनर्स्थापना का चित्रण
  choice: भव्य निर्माण-सामग्री के काव्यात्मक चित्र को बिना उसकी प्रकृति निर्धारित किए यथावत रखना
  alternative: इसे केवल शाब्दिक वास्तु-विवरण या केवल प्रतीकात्मक पुनर्स्थापना के रूप में स्पष्ट करना
  rationale: यूनानी पाठ नीलम, पन्ने, बहुमूल्य पत्थरों और सोने की छवि देता है, पर यह निर्धारित नहीं करता कि वर्णन शाब्दिक, अतिशयोक्तिपूर्ण या प्रतीकात्मक है। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी अपनाई गई है। रत्नों और सोने की काव्यात्मक भव्यता को बनाए रखा गया है। ‘तेरी’ द्वारा यूनानी पाठ में विषय-वर्णन से सीधे संबोधन की ओर होने वाला परिवर्तन सुरक्षित रखा गया है; ‘बाहरी किलेबंदियाँ’ तकनीकी अर्थ को सामान्य पाठक के लिए स्पष्ट करती है।
