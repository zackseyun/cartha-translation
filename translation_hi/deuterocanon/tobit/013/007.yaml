base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/007.yaml
  text: I exalt my God[a], and my soul rejoices in the King of heaven, and it will exult in his greatness.
translation:
  language: hi
  text: मैं अपने परमेश्वर की महिमा करता हूँ; मेरा प्राण स्वर्ग के राजा में आनन्दित होता है[a], और उसकी महानता में उल्लसित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यह मध्य खंड संक्षिप्त और क्रियारहित है; उसका शाब्दिक रूप है, “और मेरा प्राण स्वर्ग के राजा को/के लिए।” यहाँ स्तुतिगीत के प्रसंग में सम्भावित अर्थ व्यक्त करने के लिए “आनन्दित होता है” जोड़ा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑψῶ
  choice: ऊँचा ठहराऊँगा
  rationale: यह भविष्यकालीन क्रिया किसी को ऊँचा करने अथवा ऊँचा मानकर उसकी स्तुति करने का भाव रखती है। ‘ऊँचा ठहराऊँगा’ मूल बिंब और स्तुतिपरक अर्थ दोनों को बनाए रखता है।
- source_word: ψυχή
  choice: मेरा प्राण
  rationale: मूल पाठ में केवल कर्ता-सर्वनाम नहीं, बल्कि ψυχή स्पष्ट रूप से आया है। ‘मेरा प्राण’ उसके काव्यात्मक और भक्तिपरक स्वर को सुरक्षित रखता है।
- source_word: βασιλεῖ τοῦ οὐρανοῦ
  choice: स्वर्ग के राजा में
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि है। दत्तिव कारक और सन्दर्भ के आधार पर पूरित आनन्द-क्रिया के साथ ‘में’ स्वाभाविक है।
- source_word: ἀγαλλιάσεται
  choice: मगन होगा
  rationale: भविष्यकालीन क्रिया अत्यन्त आनन्दित होने का प्रबल भाव व्यक्त करती है। ‘मगन होगा’ सामान्य ‘आनन्दित होगा’ से अलग, उल्लास की तीव्रता दिखाता है।
- source_word: μεγαλοσύνην
  choice: महानता
  rationale: यह शब्द महानता अथवा महिमा का बोध कराता है। ‘महानता’ सबसे सीधा और व्यापक हिन्दी प्रतिशब्द है।
- source_word: καὶ ἡ ψυχή μου τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: मेरा प्राण स्वर्ग के राजा में आनन्दित है
  rationale: यूनानी खंड में कोई स्पष्ट समापिका क्रिया नहीं है। स्तुतिगीत के प्रसंग में आनन्द की क्रिया जोड़ने से सम्भावित काव्यात्मक अर्थ सहज हिन्दी में व्यक्त होता है; अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: मध्य खंड में स्पष्ट क्रिया का न होना
  choice: इसे स्वर्ग के राजा में आनन्द व्यक्त करने वाली काव्यात्मक लोप-रचना माना गया और ‘आनन्दित है’ जोड़ा गया।
  alternative: इसे बिना क्रिया के ‘और मेरा प्राण स्वर्ग के राजा के लिए’ समझा जा सकता है, अथवा ‘स्तुति करता है’ जैसी दूसरी क्रिया पूरी की जा सकती है।
  rationale: मूल यूनानी पाठ संक्षिप्त और व्याकरणिक रूप से अपूर्ण है। प्रसंग आनन्द और स्तुति का है, इसलिए ‘आनन्दित है’ सम्भावित अर्थ देता है, पर पादटिप्पणी वास्तविक अस्पष्टता को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्तुतिगीत के अनुकूल रखी गई है। ‘मेरा प्राण’ काव्यात्मकता बनाए रखता है, जबकि ‘ऊँचा ठहराऊँगा’ शारीरिक रूप से उठाने की गलत छाप से बचते हुए मूल स्तुति-बिंब को सुरक्षित रखता है।
