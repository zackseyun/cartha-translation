translation:
  language: hi
  text: जो तुझसे बैर रखते हैं, वे सब शापित हैं; जो तुझसे प्रेम रखते हैं, वे सब सदा आशीष पाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικατάρατοι
  choice: शापित
  rationale: यह विशेषण शाप के अधीन होने की गंभीर, घोषणात्मक स्थिति व्यक्त करता है; ‘शापित’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: μισοῦντές
  choice: बैर रखते हैं
  rationale: कृदन्त का अर्थ ‘वे जो तुझसे घृणा/बैर रखते हैं’ है। यहाँ नगर को संबोधन और प्रेम के साथ नैतिक विरोध को देखते हुए ‘बैर रखते हैं’ सहज हिन्दी है और सक्रिय विरोध का भाव बनाए रखता है।
- source_word: εὐλογημένοι ἔσονται
  choice: आशीष पाएँगे
  rationale: यूनानी में भविष्यकाल स्पष्ट है और निष्क्रिय रूप आशीष प्राप्त करने को बताता है; ‘आशीष पाएँगे’ दोनों बातों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀγαπῶντές
  choice: प्रेम रखते हैं
  rationale: कृदन्त संज्ञात्मक है—‘वे जो तुझसे प्रेम करते हैं।’ ‘प्रेम रखते हैं’ पहले खंड के ‘बैर रखते हैं’ के समानांतर और प्राकृतिक है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह मुहावरा निरंतर और चिरस्थायी अवधि व्यक्त करता है; ‘सदा’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: यरूशलेम/सिय्योन के प्रति व्यवहार से जुड़ी आशीष और शाप की घोषणा
  choice: आशीष और शाप की भाषा को उसके सीधे और गंभीर वाचाई बल के साथ रखा गया है।
  alternative: इसे केवल सामाजिक प्रशंसा या निंदा के हल्के अर्थ में प्रस्तुत करना।
  rationale: ἐπικατάρατοι और εὐλογημένοι वास्तविक शाप और आशीष की प्रबल भाषा हैं; अनुवाद उस धार्मिक भार को कम नहीं करता।
- issue: पहले और दूसरे खंड के काल का अंतर
  choice: पहले खंड में वर्तमान स्थिति ‘शापित हैं’ और दूसरे में स्पष्ट भविष्य ‘आशीष पाएँगे’ रखा गया है।
  alternative: दोनों खंडों को एक ही काल में कर देना।
  rationale: पहला यूनानी खंड क्रियारहित घोषणात्मक वाक्य है, जबकि दूसरे में ἔσονται स्पष्ट भविष्यकाल है; हिन्दी में यह अंतर स्वाभाविक रूप से संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। एकवचन संबोधन के लिए ‘तुझसे’ रखा गया है, क्योंकि संदर्भ में यरूशलेम/सिय्योन को प्रत्यक्ष संबोधित किया गया है। कोई पादटिप्पणी आवश्यक नहीं।
