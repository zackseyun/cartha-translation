base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/009.yaml
  text: 'Jerusalem[a], city of the Holy One: he will scourge you for the works of your children[b], and again he will show mercy to the children of the righteous.'
translation:
  language: hi
  text: हे यरूशलेम, पवित्र प्रभु का नगर![a] वह तेरी संतानों के कामों के कारण तुझे कोड़े मारेगा, और फिर धर्मियों की संतानों पर दया करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध का अधिक सामान्य अनुवाद ‘पवित्र जन का नगर’ या ‘पवित्र का नगर’ भी हो सकता है; प्रसंग में इसका संकेत सम्भवतः परमेश्वर की ओर है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में दोनों स्थानों पर शाब्दिक शब्द ‘पुत्र’ है; यहाँ सामूहिक अर्थ के कारण ‘संतानें’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप; सम्बोधन को स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
- source_word: πόλις ἁγίου
  choice: पवित्र जन का नगर
  rationale: सम्बन्धकारक एकवचन को बनाए रखता है और प्रसंग में सम्भावित ईश्वरीय संकेत व्यक्त करता है, पर उसे सीधे ‘परमेश्वर’ कहकर अस्पष्टता समाप्त नहीं करता।
- source_word: μαστιγώσει
  choice: कोड़े लगाएगा
  rationale: क्रिया के दण्डात्मक और सजीव बिम्ब को सामान्य ‘दण्ड देगा’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: ἐπὶ τὰ ἔργα
  choice: कामों के कारण
  rationale: ἐπί और कर्मकारक यहाँ दण्ड के कारण या आधार को दर्शाते हैं; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τῶν υἱῶν σου
  choice: तेरी संतानों
  rationale: शाब्दिक अर्थ ‘तेरे पुत्रों’ है, पर नगर की सामूहिक सन्तति अथवा निवासियों के अर्थ में ‘संतानों’ अधिक सटीक है।
- source_word: πάλιν
  choice: फिर
  rationale: दण्ड के बाद दया की ओर होने वाले उलटाव और पुनरावृत्ति को संक्षेप में व्यक्त करता है।
- source_word: ἐλεήσει
  choice: दया करेगा
  rationale: क्रिया के सामान्य अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοὺς υἱοὺς τῶν δικαίων
  choice: धर्मियों की संतानों
  rationale: υἱούς के सामूहिक आशय को ‘संतानों’ और δικαίων के विशेषण-संज्ञा रूप को ‘धर्मियों’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘कोड़े लगाएगा’ और ‘दया करेगा’ का अनकहा कर्ता
  choice: हिन्दी में ‘वह’ जोड़ा गया है और प्रसंगानुसार उसका संकेत परमेश्वर की ओर है।
  alternative: कर्ता को अनकहा छोड़ना, अथवा ‘परमेश्वर’ को स्पष्ट रूप से लिखना।
  rationale: यूनानी क्रियाओं में कर्ता स्पष्ट संज्ञा के रूप में नहीं है। पिछले पदबंध ‘पवित्र जन का नगर’ और न्याय-दया के प्रसंग से परमेश्वर सबसे सम्भावित कर्ता है; ‘वह’ आवश्यक स्पष्टता देता है, पर स्रोत से अधिक स्पष्ट नाम नहीं जोड़ता।
- issue: ἁγίου का अभिप्राय
  choice: ‘पवित्र जन’—सम्भवतः परमेश्वर के लिए प्रयुक्त उपाधि।
  alternative: ‘पवित्र का’, ‘किसी पवित्र जन का’, अथवा नगर को स्वयं ‘पवित्र नगर’ कहना।
  rationale: सम्बन्धकारक रचना का सबसे स्वाभाविक अर्थ ‘पवित्र जन का नगर’ है। इससे ईश्वरीय संकेत बना रहता है और यूनानी की वास्तविक व्याकरणिक अस्पष्टता भी टिप्पणी में सुरक्षित रहती है।
- issue: पुल्लिंग पारिवारिक भाषा
  choice: υἱοί के दोनों प्रयोगों के लिए ‘संतानें’।
  alternative: ‘पुत्र’।
  rationale: यरूशलेम को सम्बोधित इस काव्यात्मक कथन में आशय सामूहिक है, केवल पुरुषों तक सीमित नहीं; इसलिए ‘संतानें’ लक्षित अर्थ को अधिक ठीक व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक सम्बोधन के अनुकूल रखी गई है। ‘तेरी’ का प्रयोग यरूशलेम को एकवचन नगर के रूप में सीधे सम्बोधित करने के कारण है। ‘कोड़े लगाएगा’ मूल के तीखे न्याय-बिम्ब को बनाए रखता है।
