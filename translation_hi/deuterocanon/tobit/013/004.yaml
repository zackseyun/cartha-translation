base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/004.yaml
  text: There declare his greatness[a], and exalt him before every living being; for he is our Lord[c][b], and he is our God and our Father forever.
translation:
  language: hi
  text: वहाँ उसकी महानता[a] प्रकट करो और हर जीवित प्राणी[b] के सामने उसे ऊँचा ठहराओ; क्योंकि वही हमारा प्रभु है, और वही हमारा परमेश्वर और हमारा पिता सदा-सर्वदा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका प्रताप दिखाओ।’ यूनानी क्रिया का अर्थ ‘दिखाना’ या ‘ज्ञात कराना’ हो सकता है, और संज्ञा का अनुवाद ‘प्रताप’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘हर जीवित [एक] के सामने।’ अभिव्यक्ति व्यापक है, यद्यपि प्रसंग में सबसे स्वाभाविक अर्थ सभी जीवित मनुष्य हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘सभी युगों तक।’ यूनानी अभिव्यक्ति कभी समाप्त न होने वाली अवधि पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण पिछले पद में आए अन्यजातियों के बीच के संदर्भ की ओर संकेत करता है; ‘वहाँ’ इसे बिना अतिरिक्त अर्थ जोड़े सीधे व्यक्त करता है।
- source_word: ὑποδείξατε
  choice: प्रकट करो
  rationale: बहुवचन आज्ञार्थक क्रिया का अर्थ दिखाना, जाहिर करना या ज्ञात कराना हो सकता है। सार्वजनिक गवाही और स्तुति के संदर्भ में ‘प्रकट करो’ स्वाभाविक है और इस अर्थ-सीमा को बनाए रखता है।
- source_word: τὴν μεγαλοσύνην αὐτοῦ
  choice: उसकी महानता
  rationale: μεγαλοσύνη महानता या प्रताप को दर्शाता है। ‘महानता’ स्पष्ट, व्यापक और मूल शब्द के निकट है।
- source_word: ὑψοῦτε αὐτόν
  choice: उसे ऊँचा उठाओ
  rationale: स्तुति के संदर्भ में ὑψόω किसी को ऊँचा ठहराने या उसका उत्कर्ष घोषित करने का रूपक है। हिंदी में ‘ऊँचा उठाओ’ मूल रूपक को बनाए रखता है।
- source_word: ἐνώπιον παντὸς ζῶντος
  choice: हर जीवित प्राणी के सामने
  rationale: यूनानी का शाब्दिक अर्थ ‘हर जीवित [एक] के सामने’ है। यह अनुवाद उसकी व्यापकता और एकवचन-वितरणात्मक बल को बनाए रखता है, यद्यपि प्रसंग में मुख्यतः जीवित मनुष्य अभिप्रेत हैं।
- source_word: καθότι
  choice: क्योंकि
  rationale: यह पहले दिए गए आदेशों का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: κύριος ἡμῶν
  choice: हमारा प्रभु
  rationale: κύριος के धार्मिक और स्वीकारोक्तिपरक प्रयोग के लिए ‘प्रभु’ मानक और उपयुक्त हिंदी शब्द है।
- source_word: θεὸς ... πατὴρ ἡμῶν
  choice: हमारा परमेश्वर और हमारा पिता
  rationale: यह पद एक ही सत्ता के लिए परमेश्वर और पिता—दोनों संबोधनों को साथ रखता है। हिंदी में दोनों के साथ ‘हमारा’ रखने से संबंध स्पष्ट रहता है और किसी एक पदवी को दूसरी में विलीन नहीं किया जाता।
- source_word: εἰς πάντας τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: शाब्दिक रूप से ‘सभी युगों तक’ अनंत अवधि पर बल देता है। ‘सदा-सर्वदा’ आधुनिक किंतु गरिमापूर्ण हिंदी में उसी निरंतरता को व्यक्त करता है।
theological_decisions:
- issue: ‘हमारा प्रभु,’ ‘परमेश्वर’ और ‘हमारा पिता’ पदवियों का परस्पर संबंध
  choice: 'तीनों पदवियों को उसी एक के विषय में स्वीकारोक्ति के रूप में रखा गया है: ‘वही हमारा प्रभु है, और वही ... हमारा परमेश्वर और हमारा पिता है।’'
  alternative: ‘वही हमारा प्रभु है, और परमेश्वर स्वयं हमारा पिता है।’
  rationale: यूनानी में αὐτός की पुनरावृत्ति बल देती है, जबकि θεός और πατήρ साथ आते हैं। चुना हुआ रूप एक ही कर्ता पर बल और पदवियों के संचय को बनाए रखता है, पर उनकी धर्मवैज्ञानिक व्याख्या को आगे बढ़ाकर तय नहीं करता।
- issue: εἰς πάντας τοὺς αἰῶνας का संबंध
  choice: ‘सदा-सर्वदा’ को संयुक्त कथन ‘हमारा परमेश्वर और हमारा पिता है’ के साथ रखा गया है।
  alternative: 'इसे केवल ‘पिता’ से जोड़ना: ‘हमारा परमेश्वर और सदा-सर्वदा हमारा पिता है।’'
  rationale: वाक्य के अंत में आया कालवाचक पदबंध व्याकरणतः निकटतम पदवी से जुड़ सकता है, पर पूरे स्वीकारोक्तिपरक कथन की स्थायी सत्यता भी व्यक्त कर सकता है। हिंदी में चुनी हुई स्थिति मूल की व्यापक और अनंतकालिक ध्वनि को स्वाभाविक रूप से संप्रेषित करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में है, पर प्रार्थना और सार्वजनिक स्तुति के अनुरूप गरिमापूर्ण रखी गई है। बहुवचन आज्ञार्थक रूपों ‘करो’ और ‘उठाओ’ से मूल के सामूहिक संबोधन को सुरक्षित रखा गया है। ‘हर जीवित प्राणी’ मूल की व्यापकता बनाए रखता है; फुटनोट में मानवीय प्रसंग स्पष्ट किया गया है।
