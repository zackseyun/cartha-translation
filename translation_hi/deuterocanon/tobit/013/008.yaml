    reason: lexical_alternative
lexical_decisions:
- source_word: λεγέτωσαν
  choice: बोलें
  rationale: यह λέγω का तीसरे पुरुष बहुवचन आज्ञार्थक रूप है। संक्षिप्त स्तुतिगान-संदर्भ में ‘बोलें’ इसकी व्यापकता और आह्वानात्मक भाव को बनाए रखता है, बिना कथन को अनावश्यक रूप से ‘घोषणा’ तक सीमित किए।
- source_word: πάντες
  choice: सब लोग
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘सब लोग’ आधुनिक हिन्दी में स्वाभाविक ढंग से इसकी सार्वभौमिकता व्यक्त करता है।
- source_word: ἐξομολογείσθωσαν
  choice: धन्यवाद करें
  rationale: बाइबलीय यूनानी में यह क्रिया अंगीकार करने, स्तुति करने या धन्यवाद देने के अर्थ में आ सकती है। इस स्तुतिगानात्मक प्रसंग में ‘धन्यवाद करें’ मुख्य पाठ के लिए सर्वाधिक स्वाभाविक है, जबकि अन्य वास्तविक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: αὐτῷ
  choice: उसका
  rationale: यह परमेश्वर की ओर संकेत करने वाला सम्प्रदान कारक सर्वनाम है। हिन्दी में ‘उसका धन्यवाद करें’ उसी संबंध को सहज और मुहावरेदार रूप में व्यक्त करता है।
- source_word: ἐν Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: ἐν के साथ स्थानवाचक रूप का स्वाभाविक आधुनिक हिन्दी अनुवाद ‘यरूशलेम में’ है।
theological_decisions:
- issue: आराधना के संदर्भ में ἐξομολογείσθωσαν का अर्थ
  choice: धन्यवाद करें
  alternative: उसके सामने अंगीकार करें; उसकी स्तुति करें
  rationale: क्रिया के अर्थ-क्षेत्र में अंगीकार, स्तुति और धन्यवाद सम्मिलित हैं। तोबीत 13 के स्तुतिगानात्मक संदर्भ में धन्यवाद मुख्य पाठ के लिए सबसे उपयुक्त है, पर अर्थगत अस्पष्टता पादटिप्पणी में स्पष्ट रूप से बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों यूनानी क्रियाओं के समांतर आज्ञार्थक भाव को ‘बोलें’ और ‘धन्यवाद करें’ से सुरक्षित रखा गया है।
