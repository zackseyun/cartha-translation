base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/011.yaml
  text: Many nations will come from far away to the name of the Lord God[a], carrying gifts in their hands, gifts for the King of heaven; generations of generations will give you exultation.
translation:
  language: hi
  text: बहुत-से राष्ट्र दूर-दूर से प्रभु परमेश्वर के नाम की ओर आएँगे, अपने हाथों में भेंटें लिए हुए और स्वर्ग के राजा के लिए भेंटें लेकर; पीढ़ियों की पीढ़ियाँ तुम्हें हर्षोल्लास देंगी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पीढ़ी-दर-पीढ़ी तुम्हारे लिए आनन्द लाएगी।” यूनानी में शाब्दिक रूप से है, “पीढ़ियों की पीढ़ियाँ तुम्हें हर्षोल्लास देंगी।”
    reason: γενεαὶ γενεῶν और δώσουσίν σοι ἀγαλλίαμα के लिए अधिक मुहावरेदार हिन्दी विकल्प देना, जबकि मुख्य पाठ में मूल की काव्यात्मक बनावट बनाए रखना।
lexical_decisions:
- source_word: ἔθνη πολλὰ
  choice: बहुत-से राष्ट्र
  rationale: ἔθνη का सामान्य अर्थ ‘राष्ट्र’ या ‘जातियाँ’ है। ‘राष्ट्र’ यहाँ व्यापक अंतरराष्ट्रीय दायरे को बनाए रखता है और अनावश्यक रूप से यहूदी–गैर-यहूदी भेद नहीं जोड़ता।
- source_word: μακρόθεν
  choice: दूर-दूर से
  rationale: यह दूरस्थ स्थान से आने का भाव व्यक्त करता है। ‘दूर-दूर से’ आधुनिक हिन्दी में स्वाभाविक है और अनेक राष्ट्रों के विभिन्न दूरस्थ स्थानों से आने की छवि भी रखता है।
- source_word: πρὸς τὸ ὄνομα Κυρίου τοῦ θεοῦ
  choice: प्रभु परमेश्वर के नाम की ओर
  rationale: πρός की दिशात्मकता और ‘नाम’ की बाइबलीय अभिव्यक्ति को बनाए रखा गया है। इसे केवल ‘आराधना करने’ या ‘यश के कारण’ कहने से मूल के व्यापक धार्मिक आशय को समय से पहले सीमित कर दिया जाता।
- source_word: δῶρα ἐν χερσὶν ἔχοντες
  choice: अपने हाथों में भेंटें लिये होंगे
  rationale: यह साथ-साथ होने वाली क्रिया को व्यक्त करता है और हाथों में भेंटें लेकर आने की ठोस तीर्थयात्रात्मक छवि बनाए रखता है।
- source_word: καὶ δῶρα τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: स्वर्ग के राजा के लिए भेंटें
  rationale: दूसरी बार आए δῶρα को दोहराकर मूल का बल बनाए रखा गया है; सम्प्रदान कारक को हिन्दी में स्वाभाविक ‘के लिए’ से व्यक्त किया गया है।
- source_word: γενεαὶ γενεῶν
  choice: पीढ़ियों की पीढ़ियाँ
  rationale: यह मूल की सामी शैली वाली संबंधकारक पुनरुक्ति और काव्यात्मक गरिमा को निकटता से सुरक्षित रखता है; अधिक मुहावरेदार विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: δώσουσίν σοι ἀγαλλίαμα
  choice: तुम्हें हर्षोल्लास देंगी
  rationale: ἀγαλλίαμα तीव्र आनन्द या उल्लास को दर्शाता है। कुछ असामान्य होते हुए भी ‘तुम्हें … देंगी’ यूनानी वाक्य-रचना और यरूशलेम को किए गए सीधे संबोधन को बनाए रखता है।
theological_decisions:
- issue: σοι में द्वितीय पुरुष सर्वनाम का संदर्भ
  choice: ‘तुम्हें’ द्वारा व्यक्त, संदर्भ में मानवीकृत यरूशलेम/सिय्योन से संबोधन
  alternative: सामान्य रूप से इस्राएल से संबोधन, या मानवीकरण पर बल दिए बिना नगर से संबोधन
  rationale: आसपास के स्तुतिगान में यरूशलेम को सीधे संबोधित किया गया है। पद में ‘यरूशलेम’ जोड़ने के बजाय केवल ‘तुम्हें’ रखने से काव्यात्मक संबोधन और उसकी निहित संदर्भगत अस्पष्टता सुरक्षित रहती है।
- issue: ‘प्रभु परमेश्वर के नाम की ओर’ का आशय
  choice: परमेश्वर के नाम की ओर श्रद्धापूर्ण तीर्थगमन की बाइबलीय अभिव्यक्ति को बनाए रखना
  alternative: ‘प्रभु परमेश्वर की आराधना करने’ या ‘प्रभु परमेश्वर की कीर्ति के कारण’
  rationale: वाक्यांश में आराधना और श्रद्धा निहित हो सकती है, पर यूनानी पाठ स्पष्ट रूप से ‘नाम की ओर’ कहता है। शाब्दिक बिंब को बनाए रखना अर्थ को किसी एक व्याख्यात्मक रूप तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘प्रभु परमेश्वर’, ‘स्वर्ग का राजा’ और ‘नाम की ओर’ जैसे बाइबलीय पदबंध सुरक्षित हैं; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ἀγαλλίαμα के लिए काव्यात्मक ‘हर्षोल्लास’ चुना गया है।
