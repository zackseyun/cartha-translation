base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/010.yaml
  text: Give thanks well to the Lord, and bless the King of the ages, so that his tent may again be built for you with joy; and so that he may gladden within you the captives and love within you the afflicted for all the generations of the age.
translation:
  language: hi
  text: प्रभु का भली-भाँति धन्यवाद कर, और युगों के राजा को धन्य कह, ताकि उसका तंबू तेरे लिए फिर से आनन्द के साथ बनाया जाए; और वह तेरे भीतर बंदियों को आनन्दित करे और तेरे भीतर दुःखियों से युग की सब पीढ़ियों तक प्रेम करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολόγου ... ἀγαθῶς
  choice: भली-भाँति धन्यवाद कर
  rationale: ἐξομολογέομαι यहाँ प्रभु की ओर संबोधित स्तुति/धन्यवाद का भाव रखता है; ἀγαθῶς को हटाए बिना स्वाभाविक हिन्दी में ‘भली-भाँति’ रखा गया है।
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: युगों के राजा
  rationale: बहुवचन αἰώνων की औपचारिक छवि और सार्वकालिक राजत्व को सुरक्षित रखता है।
- source_word: ἡ σκηνὴ αὐτοῦ
  choice: उसका तंबू
  rationale: σκηνή का मूर्त तंबू/निवास-स्थान वाला बिंब बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘मन्दिर’ नहीं किया गया।
- source_word: τοὺς αἰχμαλώτους
  choice: बँधुओं
  rationale: युद्धबंदी अथवा निर्वासन में पड़े लोगों का व्यापक अर्थ व्यक्त करता है।
- source_word: τοὺς ταλαιπώρους
  choice: दुःखियों
  rationale: कष्ट और दुर्दशा सहने वालों के लिए सहज, गरिमापूर्ण आधुनिक हिन्दी।
- source_word: εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος
  choice: युग की सब पीढ़ियों तक
  rationale: एकवचन αἰῶνος और पीढ़ियों की असामान्य मूल अभिव्यक्ति को सामान्यीकृत कर ‘सदा’ नहीं बनाया गया।
theological_decisions:
- issue: σκηνή की पहचान
  choice: तंबू
  alternative: मन्दिर/निवासस्थान
  rationale: मूल पाठ के निवास-तंबू वाले बिंब को बनाए रखा गया है और यरूशलेम अथवा मन्दिर की पहचान को अनकहे रूप में नहीं जोड़ा गया।
- issue: ἐν σοί की पुनरावृत्ति
  choice: दोनों पदबंधों में ‘तेरे भीतर’
  alternative: पहले ‘तेरे भीतर’ और दूसरे में लोप, अथवा ‘तेरे यहाँ’
  rationale: यूनानी पाठ दोनों क्रियाओं के साथ ἐν σοί दोहराता है; उसका स्थानिक और सम्भवतः सामुदायिक तनाव सुरक्षित रखा गया है।
- issue: ἀγαπήσαι का कर्ता
  choice: ‘वह’—प्रभु/युगों का राजा
  alternative: तंबू को कर्ता मानना या निष्क्रिय अनुवाद
  rationale: पिछले εὐφρᾶναι के समान उद्देश्यसूचक क्रियारूप के रूप में इसे दिव्य कर्ता से जोड़ा गया, जबकि भाव को अतिरिक्त धर्मवैज्ञानिक व्याख्या से नहीं बढ़ाया गया।
translation_notes:
  register: एकवचन स्त्रीलिंग संबोधन के अनुरूप ‘कर/कह’, ‘तेरे’ रखा गया है, क्योंकि प्रसंग में नगर को संबोधन है। भाषा आधुनिक और गरिमापूर्ण है; मूल की कुछ असामान्य संरचनाएँ—विशेषकर ‘तेरे भीतर’ और ‘युग की सब पीढ़ियाँ’—अर्थगत तनाव बचाने हेतु जानबूझकर रखी गई हैं।
