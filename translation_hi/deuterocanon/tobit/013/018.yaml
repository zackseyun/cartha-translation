  text: And all her streets will say[a], ‘Hallelujah and praise!’ saying, ‘Blessed is God, who has exalted all the ages.’
translation:
  language: hi
  text: और उसकी सभी गलियाँ कहेंगी[a], “हल्लेलूयाह और स्तुति! धन्य है परमेश्वर, जिसने सभी युगों को ऊँचा किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अर्थ सम्भवतः यह हो सकता है: “जो सदा-सर्वदा ऊँचा है” या “जो सभी युगों में ऊँचा है।” यूनानी में शाब्दिक रूप से है, “जिसने सभी युगों को ऊँचा किया,” जो एक असामान्य अभिव्यक्ति है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥῦμαι
  choice: गलियाँ
  rationale: यह शब्द नगर के भीतर की सड़कों या गलियों को दर्शाता है। ‘गलियाँ’ स्त्रीलिंग नगर के मानवीकरण के साथ स्वाभाविक है और मूल के बहुवचन को बनाए रखता है।
- source_word: ἀλληλουιά
  choice: हल्लेलूयाह
  rationale: यूनानी पाठ स्वयं इब्रानी उपासना-उद्गार का लिप्यंतरण रखता है; इसलिए हिन्दी में प्रचलित आराधनात्मक रूप रखा गया है।
- source_word: αἴνεσιν
  choice: स्तुति
  rationale: संज्ञा का मूल अर्थ ‘प्रशंसा/स्तुति’ है। ‘स्तुति’ यहाँ गरिमापूर्ण उपासना-भाषा में स्वाभाविक है।
- source_word: Εὐλογητός
  choice: धन्य है
  rationale: परमेश्वर के विषय में यह आशीर्वचनात्मक स्तुति की घोषणा है। ‘धन्य है परमेश्वर’ यूनानी विधेयात्मक रचना को बिना इसे इच्छा-वाचक बनाए सुरक्षित रखता है।
- source_word: ὕψωσεν
  choice: ऊँचा किया है
  rationale: ὑψόω का अर्थ ऊँचा उठाना या महिमान्वित करना है। ‘ऊँचा किया है’ असामान्य कर्म ‘सभी युगों’ के साथ मूल अभिव्यक्ति को अपेक्षाकृत पारदर्शी रखता है।
- source_word: πάντας τοὺς αἰῶνας
  choice: सभी युगों को
  rationale: यूनानी का शाब्दिक आशय ‘सभी युगों’ से है। वाक्यांश असामान्य है, इसलिए मुख्य पाठ में उसका तनाव बनाए रखा गया है, न कि उसे चुपचाप ‘सदा’ में बदल दिया गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में πάντας τοὺς αἰῶνας का अर्थ
  choice: सभी युगों को
  alternative: जो सदा-सर्वदा ऊँचा है / जो सब युगों में ऊँचा है
  rationale: मूल यूनानी व्याकरण में ‘सभी युगों’ को ὕψωσεν का कर्म बनाया गया है। यद्यपि कालवाचक भाव सम्भव है, मुख्य पाठ मूल की असामान्य और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति को सुरक्षित रखता है; अधिक मुहावरेदार समझ पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ और उपासना के अनुकूल शैली। नगर की गलियों के मानवीकरण को ‘कहेंगी’ से बनाए रखा गया है। ‘वे कहेंगी’ यूनानी के बहुवचन कृदन्त λέγοντες को स्वाभाविक हिन्दी में स्पष्ट करता है।
