base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/001.yaml
  text: Then Tobit wrote a prayer of rejoicing and said[a], “Blessed is the living God forever, and his kingdom.”
translation:
  language: hi
  text: तब तोबीत ने आनंद की एक प्रार्थना लिखी और कहा, “जीवित परमेश्वर सदा धन्य है, और उसका राज्य[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ यहाँ ‘और उसका राज्य’ शब्दों के साथ अचानक समाप्त हो जाता है। कुछ अनुवाद अर्थ पूरा करने के लिए ‘धन्य है’ जैसे शब्द जोड़ते हैं या इस पदबंध को ‘सदा’ से जोड़ते हैं। यहाँ मूल पाठ में स्पष्ट रूप से न कहे गए शब्द नहीं जोड़े गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγραφεν
  choice: लिखी
  rationale: यह क्रिया लिखित प्रार्थना का परिचय देती है। ‘लिखी’ यूनानी का सीधा और स्वाभाविक हिन्दी रूप है; ‘रची’ अनावश्यक साहित्यिक अर्थ जोड़ सकता है।
- source_word: προσευχὴν εἰς ἀγαλλίασιν
  choice: आनंद की एक प्रार्थना
  rationale: यह पदबंध प्रार्थना के आनंदपूर्ण स्वर या उद्देश्य को व्यक्त करता है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और यूनानी की उत्सवपूर्ण भावना बनाए रखता है।
- source_word: Εὐλογητὸς
  choice: धन्य
  rationale: स्तुतिपरक संदर्भ में ‘धन्य’ प्रचलित बाइबलीय और आराधनात्मक अर्थ को सुरक्षित रखता है।
- source_word: ὁ θεὸς ὁ ζῶν
  choice: जीवित परमेश्वर
  rationale: यह यूनानी विशेषणात्मक संरचना का स्वाभाविक तथा परिचित बाइबलीय हिन्दी रूप है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: यह अनंत अवधि व्यक्त करने वाले यूनानी मुहावरे का स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी अनुवाद है।
- source_word: βασιλεία
  choice: राज्य
  rationale: ‘राज्य’ संज्ञा-रूप और बाइबलीय ध्वनि दोनों को बनाए रखता है। ‘राज’ संभव है, पर वह शासन-क्रिया पर अधिक बल देता।
theological_decisions:
- issue: अंतिम क्रियारहित पद καὶ ἡ βασιλεία αὐτοῦ का अर्थ-संबंध
  choice: इसे संक्षिप्त और अपूर्ण रूप में ‘और उसका राज्य’ रखा गया है।
  alternative: ‘और उसका राज्य धन्य है’ अथवा ‘और उसका राज्य सदा बना रहता है’
  rationale: उपलब्ध यूनानी पाठ में अंतिम पद के लिए कोई स्पष्ट विधेय नहीं है। विधेय जोड़ने से एक संभावित अर्थ निश्चित हो जाता; इसलिए मूल की वास्तविक अस्पष्टता और अचानक समाप्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। अंतिम वाक्यांश की असामान्य अपूर्णता जानबूझकर सुरक्षित है और पादटिप्पणी में स्पष्ट की गई है।
