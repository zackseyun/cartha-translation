base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/005.yaml
  text: And he will scourge us for our injustices[a], and again he will show mercy and gather us from all the nations among which you were scattered.
translation:
  language: hi
  text: और वह हमारे अधर्मों के कारण हमें कोड़े लगाएगा; फिर वह दया करेगा और हमें उन सब राष्ट्रों में से इकट्ठा करेगा, जहाँ कहीं तुम तितर-बितर किए जाओगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ अंतिम उपवाक्य में ‘हमें/हमारे’ से बदलकर ‘तुम तितर-बितर किए जाओगे’ कहता है। कुछ अनुवाद इसे ‘हम तितर-बितर किए जाएँगे’ करके एकरूप बनाते हैं, पर यहाँ मूल पाठ का पुरुष-परिवर्तन सुरक्षित रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσει
  choice: कोड़े लगाएगा
  rationale: यह क्रिया शाब्दिक रूप से कोड़े मारने का बोध देती है और यहाँ परमेश्वर की कठोर ताड़ना के रूपक को सामान्य ‘दण्ड देगा’ की अपेक्षा अधिक स्पष्टता से बनाए रखती है।
- source_word: ἐν ταῖς ἀδικίαις ἡμῶν
  choice: हमारे अधर्म के कारण
  rationale: ἐν यहाँ प्रसंगानुसार कारण व्यक्त करता है। बहुवचन ἀδικίαις अनेक अन्यायपूर्ण या अधार्मिक कामों की ओर संकेत कर सकता है; स्वाभाविक हिन्दी में ‘हमारे अधर्म’ उसका सामूहिक भाव रखता है, बिना उसे केवल ‘पाप’ में समेटे।
- source_word: πάλιν
  choice: फिर
  rationale: यह ताड़ना के बाद दया और पुनर्स्थापना की ओर लौटने का क्रम तथा उलटाव व्यक्त करता है।
- source_word: ἐλεήσει
  choice: दया करेगा
  rationale: यह सरल और स्वाभाविक हिन्दी में दया दिखाने की क्रिया को स्पष्ट रखता है।
- source_word: συνάξει
  choice: इकट्ठा करेगा
  rationale: यह बिखरे हुए लोगों को पुनः एकत्र करने के पुनर्स्थापना-संबंधी अर्थ को सीधे व्यक्त करता है।
- source_word: ἐξ πάντων τῶν ἐθνῶν
  choice: उन सब राष्ट्रों में से
  rationale: ἔθνη यहाँ उन राष्ट्रों को दर्शाता है जिनके बीच लोग बिखेरे गए; ‘राष्ट्रों’ से अनावश्यक यहूदी–गैरयहूदी धार्मिक भेद आरोपित नहीं होता।
- source_word: οὗ ἐὰν σκορπισθῆτε ἐν αὐτοῖς
  choice: जिनके बीच तुम तितर-बितर किए गए थे
  rationale: यह राष्ट्रों को बिखराव के स्थान के रूप में पहचानता है और σκορπισθῆτε के दूसरे पुरुष बहुवचन तथा कर्मवाच्य को बनाए रखता है।
theological_decisions:
- issue: पहले पुरुष बहुवचन से अंतिम उपवाक्य में दूसरे पुरुष बहुवचन का परिवर्तन
  choice: ‘हमें … हमारे … हमें’ के बाद ‘तुम तितर-बितर किए गए थे’ रखा गया है।
  alternative: 'पूरे वाक्य को पहले पुरुष में समतल करना: ‘जिनके बीच हम तितर-बितर किए गए थे।’'
  rationale: यूनानी पाठ ἡμᾶς/ἡμῶν से σκορπισθῆτε की ओर स्पष्ट पुरुष-परिवर्तन करता है। इसे चुपचाप सामंजस्यपूर्ण बनाने के बजाय मूल पाठ की अलंकारिक और व्याख्यात्मक असंगति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज धार्मिक गद्य। ‘कोड़े लगाएगा’ मूल रूपक की कठोरता बनाए रखता है; ‘तितर-बितर किए गए’ निर्वासन और पुनः एकत्रीकरण की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
