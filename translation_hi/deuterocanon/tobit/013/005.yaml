review_pass:
  verdict: revise
  source_fidelity: Draft faithfully retains the first-person plural in the main clauses and the Greek's second-person plural in the final clause. However, σκορπισθῆτε is an aorist subjunctive governed by ἐάν ('wherever/where you may be scattered'), not straightforwardly a past indicative ('were scattered'). The revision preserves the indefinite prospective force as naturally as possible in Hindi.
  naturalness: The draft is generally clear and appropriately dignified. ‘अधर्मों’ is a natural enough plural in this register and more closely represents the plural ἀδικίαις than singular ‘अधर्म’. ‘जहाँ कहीं तुम तितर-बितर किए जाओगे’ is idiomatic and communicates the Greek indefinite clause.
  terminology: ‘कोड़े लगाएगा’ appropriately preserves the force of μαστιγώσει; ‘दया करेगा’ and ‘इकट्ठा करेगा’ are natural. ‘अधर्मों’ retains the plural moral-wrongdoing sense without reducing it to ‘पाप’. ‘राष्ट्रों’ is contextually suitable for ἐθνῶν.
  issues:
  - severity: medium
    issue: 'The final clause is translated as a past event: ‘जिनके बीच तुम तितर-बितर किए गए थे।’'
    rationale: The source has οὗ ἐὰν σκορπισθῆτε, with ἐάν plus aorist subjunctive, conveying an indefinite/prospective sense (‘wherever/where you may be scattered’). A past indicative does not adequately preserve this grammatical nuance.
  - severity: low
    issue: ‘अधर्म’ is singular although ἀδικίαις is plural.
    rationale: A collective singular can be defensible in Hindi, but plural ‘अधर्मों’ more directly retains the source’s reference to multiple wrongs/injustices and remains natural in elevated religious prose.
  revised_text: और वह हमारे अधर्मों के कारण हमें कोड़े लगाएगा; फिर वह दया करेगा और हमें उन सब राष्ट्रों में से इकट्ठा करेगा, जहाँ कहीं तुम तितर-बितर किए जाओगे।[a]
  revised_footnotes:
