base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/006.yaml
  text: If you turn to him with all your heart and with all your soul[a], to do what is true before him, then he will turn to you and will certainly not hide his face from you. See what he will do with you, and give thanks to him with your whole being; bless the Lord of righteousness[d][c][b], and exalt the King of the ages.
translation:
  language: hi
  text: 'यदि तुम अपने सारे हृदय और अपने सारे प्राण से उसकी ओर फिरो और उसके सामने सच्चाई का आचरण करो[a], तो वह भी तुम्हारी ओर फिरेगा और अपना मुख तुमसे कदापि न छिपाएगा। देखो कि वह तुम्हारे साथ क्या करेगा। अपने पूरे अस्तित्व से उसका धन्यवाद करो[b]; धार्मिकता के प्रभु[c] को धन्य कहो और युगों के राजा[d] को ऊँचा उठाओ।


    मैं अपनी बंधुआई के देश में उसका धन्यवाद करता हूँ और पापी जातियों को उसकी सामर्थ्य और महानता प्रकट करता हूँ। हे पापियो, लौट आओ और उसके सामने धार्मिकता का आचरण करो। कौन जानता है—शायद वह तुम्हें स्वीकार करे[e] और तुम पर दया करे?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके सामने सच्चाई करो”; अर्थात उसकी दृष्टि में सच्चाई या विश्वासयोग्यता से जीवन बिताओ।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “अपने पूरे शरीर से”; भाव सम्पूर्ण और साकार धन्यवाद का है।
    reason: lexical_alternative
  - marker: c
    text: या, “न्याय के प्रभु।”
    reason: alternative_reading
  - marker: d
    text: या, “सनातन राजा।”
    reason: lexical_alternative
  - marker: e
    text: यूनानी का शाब्दिक अर्थ “वह तुम्हें चाहे” भी हो सकता है; यहाँ भाव तुमसे प्रसन्न होने या तुम्हें अनुग्रहपूर्वक ग्रहण करने का हो सकता है।
    reason: ambiguity
lexical_decisions:
- source_word: ἐὰν ἐπιστρέψητε ... τότε ἐπιστρέψει
  choice: यदि तुम ... उसकी ओर फिरो ... तो वह भी तुम्हारी ओर फिरेगा
  rationale: एक ही यूनानी क्रिया की पुनरावृत्ति पश्चात्ताप और परमेश्वर के प्रत्युत्तर का पारस्परिक शब्द-साम्य बनाती है; हिन्दी में ‘फिरना’ दोनों स्थानों पर इसे बनाए रखता है।
- source_word: ἐν ὅλῃ καρδίᾳ ὑμῶν καὶ ἐν ὅλῃ τῇ ψυχῇ
  choice: अपने सारे हृदय और अपने सारे प्राण से
  rationale: यह पूर्ण समर्पण का पारंपरिक बाइबलीय सूत्र है; ‘हृदय’ और ‘प्राण’ दोनों स्रोत-शब्दों को स्पष्ट रखता है।
- source_word: ποιῆσαι ἐνώπιον αὐτοῦ ἀλήθειαν
  choice: उसके सामने सच्चाई का आचरण करो
  rationale: शाब्दिक ‘सच्चाई करना’ सामी शैली का प्रयोग है। ‘सच्चाई का आचरण’ उसकी विशिष्टता और नैतिक अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐ μὴ κρύψῃ τὸ πρόσωπον αὐτοῦ ἀφʼ ὑμῶν
  choice: अपना मुख तुमसे कदापि न छिपाएगा
  rationale: ‘कदापि नहीं’ οὐ μή की प्रबल निषेधात्मक शक्ति को और ‘मुख छिपाना’ मूल बिंब को सुरक्षित रखता है।
- source_word: ἐξομολογήσασθε αὐτῷ / ἐξομολογοῦμαι αὐτῷ
  choice: उसका धन्यवाद करो / उसका धन्यवाद करता हूँ
  rationale: स्तुति के इस प्रसंग में क्रिया का आशय पाप-स्वीकार से अधिक धन्यवाद और प्रशंसा है। एकरूप अनुवाद पद की काव्यात्मक संगति रखता है।
- source_word: ἐν ὅλῳ τῷ σώματι ὑμῶν
  choice: अपने पूरे अस्तित्व से
  rationale: यूनानी में शाब्दिक रूप से ‘पूरे शरीर से’ है; प्रसंग में यह सम्पूर्ण, साकार समर्पण को व्यक्त करता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: τὸν κύριον τῆς δικαιοσύνης
  choice: धार्मिकता के प्रभु
  rationale: यह दैवी उपाधि δικαιοσύνη की नैतिक और धर्मवैचारिक व्यापकता को बनाए रखती है; ‘न्याय के प्रभु’ सम्भव विकल्प है।
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: युगों के राजा
  rationale: यह αἰώνων के बहुवचन और स्तुतिपरक, ऊँचे स्वर को सीधे सुरक्षित रखता है।
- source_word: ἔθνεσιν ἁμαρτωλῶν
  choice: पापियों की जातियों के बीच
  rationale: यह वाक्यांश उन अन्यजातीय समुदायों को दर्शाता है जिनके बीच वक्ता बंधुआई में परमेश्वर की महिमा प्रकट करता है; हिन्दी में सम्बन्ध और परिवेश दोनों स्पष्ट किए गए हैं।
- source_word: τίς γινώσκει εἰ θελήσει ὑμᾶς
  choice: कौन जानता है—शायद वह तुम्हें स्वीकार करे
  rationale: εἰ के साथ प्रश्न अनिश्चित आशा व्यक्त करता है। θελήσει का शाब्दिक अर्थ ‘चाहे’ है, पर यहाँ किसी को अनुग्रहपूर्वक ग्रहण करने का भाव सम्भव है; अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: ποιήσει ἐλεημοσύνην ὑμῖν
  choice: तुम पर दया करे
  rationale: यहाँ ‘दया करना’ यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी समतुल्य है; इस प्रसंग में इसका अर्थ दान देना नहीं है।
theological_decisions:
- issue: दैवी उपाधि में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ शब्द की नैतिक और परमेश्वर-संबंधी व्यापकता को बनाए रखती है, जबकि ‘न्याय’ उसके न्यायिक पक्ष को अधिक प्रमुख करता है। विकल्प पादटिप्पणी में सुरक्षित है।
- issue: परमेश्वर के प्रत्युत्तर को शर्त और अनिश्चित आशा के रूप में व्यक्त करना
  choice: ‘तो वह भी तुम्हारी ओर फिरेगा’ और ‘शायद वह तुम्हें स्वीकार करे’
  alternative: अंतिम वाक्य को निश्चित प्रतिज्ञा बनाना
  rationale: पहला कथन स्पष्ट शर्त-परिणाम संरचना है, जबकि अंतिम τίς γινώσκει εἰ जानबूझकर अनिश्चित आशा व्यक्त करता है। दोनों के बीच का तनाव मूल पाठ के अनुसार बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किंतु सामान्य पाठक के लिए सुबोध रखी गई है। स्तुतिपरक उपाधियों में औपचारिकता बनाए रखी गई, जबकि सामी शैली के अस्वाभाविक शाब्दिक प्रयोगों को मुख्य पाठ में स्वाभाविक किया गया और पादटिप्पणियों में सुरक्षित रखा गया। मूल यूनानी में उपलब्ध पूरे पद का अनुवाद किया गया है, जिसमें अंग्रेज़ी परामर्श-पाठ से आगे आने वाला बंधुआई और पापियों को लौटने का आह्वान भी सम्मिलित है।
