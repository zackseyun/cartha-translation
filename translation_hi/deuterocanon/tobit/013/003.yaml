  yaml_path: translation/deuterocanon/tobit/013/003.yaml
  text: Give thanks to him[a], O sons of Israel, before the nations, because he himself has scattered us among them.
translation:
  language: hi
  text: हे इस्राएल के पुत्रों, राष्ट्रों के सामने उसका धन्यवाद करो[a], क्योंकि उसी ने हमें उनके बीच तितर-बितर किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे स्वीकार करो’ अथवा ‘उसकी स्तुति करो’; यूनानी क्रिया में स्वीकार करने, धन्यवाद देने और स्तुति करने जैसे अर्थ हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: उसका धन्यवाद करो
  rationale: बाइबलीय यूनानी में यह क्रिया अंगीकार करने, स्वीकार करने, धन्यवाद देने या स्तुति करने का भाव रख सकती है। यहाँ परमेश्वर के कामों की सार्वजनिक घोषणा के प्रसंग में ‘धन्यवाद करो’ स्वाभाविक है, जबकि पादटिप्पणी मूल की अर्थ-व्याप्ति सुरक्षित रखती है।
- source_word: αὐτῷ
  choice: उसका
  rationale: सम्प्रदान कारक परमेश्वर की ओर संकेत करता है। हिन्दी में ‘उसका धन्यवाद करो’ सबसे स्वाभाविक अभिव्यक्ति है।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: हे इस्राएल के पुत्रो
  rationale: मूल में स्पष्ट पुल्लिंग बहुवचन और संबोधन है; ‘हे’ संबोधन-बल तथा ‘पुत्रो’ उसका शाब्दिक लिंग सुरक्षित रखते हैं।
- source_word: ἐνώπιον τῶν ἐθνῶν
  choice: जाति-जाति के लोगों के सामने
  rationale: ἐνώπιον का सार्वजनिक रूप से ‘सामने/उपस्थिति में’ होने का भाव रखा गया है। τὰ ἔθνη के लिए यह पद आधुनिक हिन्दी में स्पष्ट करता है कि बात विभिन्न गैर-इस्राएली जनसमूहों की है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह उपदेश का कारण बताता है; आधुनिक हिन्दी में कारणसूचक बल स्पष्ट है।
- source_word: αὐτὸς
  choice: उसी ने
  rationale: बलाघाती सर्वनाम का जोर ‘उसी’ से सुरक्षित रहता है, पर इसमें ‘केवल वही’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ी गई।
- source_word: διέσπειρεν
  choice: तितर-बितर किया है
  rationale: क्रिया इस्राएल को विभिन्न जातियों के बीच बिखेरने के परमेश्वर के कार्य को व्यक्त करती है। पूर्ण वर्तमान रूप अतीत के कार्य और वर्तमान दशा का संबंध स्वाभाविक ढंग से दिखाता है।
- source_word: ἡμᾶς
  choice: हमें
  rationale: प्रत्यक्ष कर्म को सरल और स्पष्ट रूप में रखा गया है।
- source_word: ἐν αὐτοῖς
  choice: उनके बीच
  rationale: सर्वनाम पीछे उल्लिखित जाति-जाति के लोगों को संदर्भित करता है; व्यक्तियों और जनसमूहों के लिए ‘उनके बीच’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: इस्राएल के बिखराव को परमेश्वर का कार्य बताना
  choice: क्योंकि उसी ने हमें उनके बीच तितर-बितर किया है
  alternative: क्योंकि उसने हमें उनके बीच बिखर जाने दिया है
  rationale: यूनानी पाठ बिखराव का कार्य स्पष्ट रूप से परमेश्वर को सौंपता है। अनुवाद इस दावे को अनुमति मात्र में बदलकर नरम नहीं करता और न उसके लिए कोई अतिरिक्त कारण जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक आराधना के योग्य रखी गई है। ‘हे ... पुत्रो’ मूल के संबोधन और लिंग को सुरक्षित रखता है; ‘जाति-जाति के लोगों’ से τῶν ἐθνῶν का अर्थ सामान्य पाठक के लिए स्पष्ट होता है।
