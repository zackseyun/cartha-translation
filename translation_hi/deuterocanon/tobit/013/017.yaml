translation:
  language: hi
  text: और यरूशलेम की चौड़ी सड़कें बेरिल, कार्बंकल और सूफीर के पत्थरों से जड़ी होंगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यदि Σουφείρ को यूनानी पाठ के सीधे लिप्यंतरण के बजाय बाइबल में उल्लिखित स्थान ओपीर माना जाए, तो अनुवाद हो सकता है: ‘ओपीर के पत्थरों से।’'
    reason: alternative_reading
lexical_decisions:
- source_word: πλατεῖαι
  choice: चौड़ी सड़कें
  rationale: यह शब्द नगर की चौड़ी सड़कों या खुले स्थानों को दर्शा सकता है। यहाँ नगर-निर्माण के वर्णन में ‘चौड़ी सड़कें’ मूल अर्थ और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: βηρύλλῳ
  choice: पन्ने
  rationale: βήρυλλος एक बहुमूल्य रत्न का नाम है। आधुनिक सामान्य हिन्दी में ‘पन्ना’ समझने योग्य निकटतम पारंपरिक नाम है, यद्यपि प्राचीन खनिज की ठीक आधुनिक पहचान अनिश्चित हो सकती है।
- source_word: ἄνθρακι
  choice: लाल मणि
  rationale: रत्नों के इस प्रसंग में ἄνθραξ साधारण कोयला नहीं, अंगारे-सा चमकता लाल बहुमूल्य पत्थर है। ‘लाल मणि’ दुर्बोध तकनीकी नाम से बचते हुए उसकी रत्नात्मक छवि व्यक्त करता है।
- source_word: λίθῳ ἐκ Σουφεὶρ
  choice: सूफीर के पत्थरों
  rationale: यूनानी पाठ Σουφείρ को स्थान-नाम के रूप में प्रस्तुत करता है। मुख्य पाठ में उसी का प्रत्यक्ष लिप्यंतरण ‘सूफीर’ रखा गया है; ‘ओपीर’ संभावित पहचान के रूप में टिप्पणी में दिया गया है। हिन्दी में समूहवाचक अर्थ के लिए बहुवचन स्वाभाविक है।
- source_word: ψηφολογηθήσονται
  choice: पक्की की जाएँगी
  rationale: भवन-निर्माण के संदर्भ में क्रिया छोटे पत्थरों को बिछाकर पच्चीकारी अथवा फर्श बनाने का बोध देती है। सड़कों के साथ ‘पक्की की जाएँगी’ सहज आधुनिक हिन्दी है और सामग्री से सजाकर बिछाने का अर्थ संप्रेषित करता है।
