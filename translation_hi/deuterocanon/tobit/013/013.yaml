  text: Rejoice and exult over the sons of the righteous[a], because they will be gathered together and will bless the Lord of the righteous.
translation:
  language: hi
  text: धर्मियों के पुत्रों[a] के कारण आनन्दित हो और मगन हो, क्योंकि वे इकट्ठे किए जाएँगे और धर्मियों के प्रभु को धन्य कहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘धर्मियों की सन्तानें।’ यूनानी में ‘पुत्रों’ है, पर यह शब्द अधिक व्यापक रूप से वंशजों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρηθι
  choice: आनन्दित हो
  rationale: यह सीधी आज्ञा के रूप में स्वाभाविक हिन्दी है और χαίρω के प्रसन्न होने के भाव को व्यक्त करती है।
- source_word: ἀγαλλίασαι
  choice: मगन हो
  rationale: यह पहले क्रियापद के आनन्द को तीव्र करता है और अनावश्यक शब्द-पुनरावृत्ति से बचते हुए उत्सवपूर्ण भाव बनाए रखता है।
- source_word: ἐπὶ
  choice: के कारण
  rationale: सम्प्रदान कारक के साथ यहाँ यह आनन्द के अवसर या कारण को सूचित करता है; आधुनिक हिन्दी में यह सम्बन्ध स्पष्ट और स्वाभाविक है।
- source_word: τοῖς υἱοῖς τῶν δικαίων
  choice: धर्मियों के पुत्रों
  rationale: υἱοί स्पष्ट रूप से पुल्लिंग बहुवचन है। 'पुत्रों' स्रोत की लैंगिक अभिव्यक्ति को सुरक्षित रखता है, जबकि वंशजों या सन्तानों का व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: συναχθήσονται
  choice: वे इकट्ठे किए जाएँगे
  rationale: यह भविष्यत् कर्मवाच्य को सुरक्षित रखता है और सामूहिक पुनर्संग्रह के बाइबलीय भाव को व्यक्त करता है।
- source_word: εὐλογήσουσιν
  choice: धन्य कहेंगे
  rationale: परमेश्वर के लिए εὐλογέω का यह प्रतिष्ठित और अर्थ-स्पष्ट हिन्दी रूप है; केवल 'स्तुति करेंगे' कहने से मूल क्रिया का आशीर्वचनात्मक भाव कम हो जाता।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यह यहूदी धर्मग्रन्थीय सन्दर्भ में κύριος के श्रद्धापूर्ण दैवी पद को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν δικαίων
  choice: धर्मियों के
  rationale: यह सम्बन्धकारक संरचना को यथावत रखता है और उसे 'धर्मी प्रभु' जैसे विशेषणात्मक अर्थ में बदलकर अस्पष्टता का समाधान नहीं करता।
theological_decisions:
- issue: τοῖς υἱοῖς τῶν δικαίων में लैंगिक व वंशगत भाषा
  choice: धर्मियों के पुत्रों
  alternative: धर्मियों की सन्तानों
  rationale: यूनानी में स्पष्ट रूप से 'पुत्र' है, इसलिए मुख्य पाठ में स्रोत की लैंगिक अभिव्यक्ति रखी गई है। सम्भावित व्यापक, वंशगत अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- issue: τὸν κύριον τῶν δικαίων का सम्बन्ध
  choice: धर्मियों के प्रभु
  alternative: धर्मी प्रभु; प्रभु, जो धर्मी है
  rationale: सरलतम व्याकरणिक पठन सम्बन्धकारक है—वह प्रभु जो धर्मियों से सम्बद्ध है। इसे प्रभु की धार्मिकता बताने वाले विशेषण में बदलना यूनानी से अधिक व्याख्या जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण धर्मग्रन्थीय स्वर रखा गया है। ‘आनन्दित हो और मगन हो’ समानार्थी क्रियाओं की काव्यात्मक तीव्रता बनाए रखता है; ‘धन्य कहेंगे’ εὐλογέω का पारदर्शी दैवी-सन्दर्भित अनुवाद है।
