  yaml_path: translation/deuterocanon/tobit/009/005.yaml
  text: So Raphael went and lodged with Gabael[a], and he gave him the written note[b]; then Gabael brought out the money bags with the seals and gave them to him.
translation:
  language: hi
  text: तब रफाएल गया और गबाएल के यहाँ ठहरा। उसने गबाएल को लिखित दस्तावेज़[a] दिया; तब गबाएल ने मुहर लगे धन के थैले[b] निकाले और उसे दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऋणपत्र’ अथवा ‘वचनपत्र’। यूनानी शब्द χειρόγραφον किसी आर्थिक दावे या दायित्व को स्वीकार करने वाले लिखित दस्तावेज़ के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मुहरों में थैले’; अर्थात थैलों पर लगी मुहरें अब भी सही-सलामत थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: गया
  rationale: सरल कथात्मक भूतकाल में रफाएल के जाने को स्वाभाविक और सीधे ढंग से व्यक्त करता है।
- source_word: ηὐλίσθη παρὰ Γαβαήλ
  choice: गबाएल के यहाँ ठहरा
  rationale: αὐλίζομαι का अर्थ यात्रा के प्रसंग में ठहरना या रात बिताना है; παρά के साथ व्यक्ति का नाम उसके यहाँ ठहरने का भाव देता है।
- source_word: τὸ χειρόγραφον
  choice: लिखित दस्तावेज़
  rationale: यह किसी आर्थिक दावे या जमा धन से संबंधित हस्तलिखित प्रमाण-पत्र हो सकता है। ‘लिखित दस्तावेज़’ अर्थ को स्पष्ट रखता है, पर इसे अनावश्यक रूप से किसी एक आधुनिक कानूनी श्रेणी तक सीमित नहीं करता।
- source_word: προήνεγκεν
  choice: निकाले
  rationale: प्रसंग में सुरक्षित रखे थैलों को बाहर लाने की ठोस क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: τὰ θυλάκια
  choice: धन के थैले
  rationale: शब्द छोटे थैलों या थैलियों को दर्शाता है; कथा के प्रसंग से उनमें जमा धन होना स्पष्ट है।
- source_word: ἐν ταῖς σφραγῖσιν
  choice: मुहर लगे
  rationale: यूनानी वाक्यांश थैलों के मुहर सहित, अर्थात अब भी मुहरबंद, होने को दर्शाता है।
- source_word: ἔδωκεν αὐτῷ
  choice: उसे दे दिए
  rationale: हिन्दी में बहुवचन ‘थैले’ के अनुसार क्रिया को बहुवचन रखा गया है और प्राप्तकर्ता रफाएल को सर्वनाम से व्यक्त किया गया है।
