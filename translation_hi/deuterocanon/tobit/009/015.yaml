- source_word: ηυλογησεν
  choice: उसने … आशीष दी
  rationale: εὐλογέω का कथात्मक अओरिस्ट यहाँ स्वाभाविक रूप से किसी व्यक्ति को आशीष देने का अर्थ रखता है; ‘स्तुति की’ अर्थ को अनुचित रूप से बदल देगा।
- source_word: τους αιωνας
  choice: सदा के लिए
  rationale: युगों से जुड़ा यह यूनानी कालवाचक प्रयोग स्थायी अवधि व्यक्त करता है; आधुनिक हिन्दी में ‘सदा के लिए’ स्पष्ट और स्वाभाविक है।
- source_word: παντες
  choice: मुख्य पाठ में अनूदित नहीं
  rationale: दिए गए आलोचनात्मक उपकरण में πάντες केवल A पाठ-साक्षी के पाठांतर के रूप में है, इसलिए आधार-पाठ में ‘सब’ नहीं जोड़ा गया।
theological_decisions:
- issue: आशीष के वाक्यांश का पाठ-रूप
  choice: आधार-पाठ के संक्षिप्त कथन को ‘उसने उन्हें सदा के लिए आशीष दी’ के रूप में रखा गया।
  alternative: कुछ हाशियाई पाठ-साक्षी ‘शुद्ध और पवित्र आशीष से’ जोड़ते हैं; A में ‘सब’ और कालवाचक पद के आगे ‘सब’ भी मिलता है।
  rationale: आधार-पाठ और पाठांतरों का भेद बनाए रखने के लिए विस्तार को मुख्य पाठ में नहीं मिलाया गया; उल्लेखनीय लंबा पाठांतर पादटिप्पणी में सुरक्षित है।
