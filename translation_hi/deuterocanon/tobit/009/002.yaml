  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्थान-नामों के लिए ‘मादै’, ‘रागेस’ और ‘गबाएल’ अपनाए गए हैं। आज्ञार्थक शैली प्रत्यक्ष और कथानकानुकूल है; मूल की γάμος सम्बन्धी अर्थगत सम्भावना पादटिप्पणी में सुरक्षित है।
