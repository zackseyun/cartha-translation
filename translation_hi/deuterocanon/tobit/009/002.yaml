base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/002.yaml
  text: Take with yourself a servant and two camels, and go to Rages of Media, to Gabael, and bring me the money, and bring him with you to the wedding.
translation:
  language: hi
  text: “अपने साथ एक सेवक और दो ऊँट ले लो, और मादै के रागेस नगर में गबाएल के पास जाओ। मेरे लिए वह धन[a] ले आओ और उसे भी विवाह-उत्सव[b] में मेरे पास ले आओ।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘चाँदी’ है; यहाँ आशय गबाएल को सौंपे गए धन से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘विवाह में’ अथवा ‘विवाह-भोज में।’ यूनानी शब्द विवाह और उसके उत्सवी भोज—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: समानान्तर सामी परम्परा इस निर्देश को अधिक सेवकों तथा गबाएल के घर से जुड़ी अतिरिक्त बातों के साथ विस्तृत करती है; यहाँ आधार बनाया गया यूनानी पाठ संक्षिप्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε μετὰ σεαυτοῦ
  choice: अपने साथ ... ले लो
  rationale: यूनानी मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप; यात्रा में सेवक और ऊँटों को साथ लेने का निर्देश स्पष्ट रहता है।
- source_word: παῖδα
  choice: एक सेवक
  rationale: παῖς के अर्थों में बालक, युवक और सेवक सम्मिलित हैं। यात्रा के प्रसंग में ‘सेवक’ उपयुक्त है और बँधुआ स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: δύο καμήλους
  choice: दो ऊँट
  rationale: मूल संख्या और संज्ञा का सीधा अनुवाद।
- source_word: πορεύθητι ἐν Ῥάγοις τῆς Μηδείας παρὰ Γαβαήλ
  choice: मादै के रागेस में गबाएल के पास जाओ
  rationale: गति-सूचक क्रिया के साथ वाक्यांश गन्तव्य बताता है। ‘के पास’ व्यक्ति अथवा उसके निवास तक जाने का अर्थ देता है, बिना ‘घर’ शब्द जोड़े।
- source_word: κόμισαί μοι τὸ ἀργύριον
  choice: मेरे लिए वह धन ले आओ
  rationale: ἀργύριον का शाब्दिक अर्थ ‘चाँदी’ है, पर यहाँ गबाएल को सौंपे गए धन की बात है। κόμισαι में वापस लाकर देने का भाव है।
- source_word: καὶ αὐτὸν ἄγε μοι
  choice: और उसे भी मेरे पास ... ले आओ
  rationale: αὐτόν का संकेत गबाएल की ओर है। ἄγε को प्रसंगानुकूल ‘ले आओ’ किया गया है; ‘भी’ धन के साथ गबाएल को लाने के दूसरे निर्देश को स्वाभाविक ढंग से जोड़ता है।
- source_word: εἰς τὸν γάμον
  choice: विवाह-उत्सव में
  rationale: γάμος विवाह अथवा विवाह-भोज/समारोह को सूचित कर सकता है। यहाँ किसी व्यक्ति को बुलाने के प्रसंग में ‘विवाह-उत्सव’ स्वाभाविक है, जबकि पादटिप्पणी मूल की अर्थ-व्याप्ति सुरक्षित रखती है।
