  alternative: तोबियास ने अपनी पत्नी के ऊपर आशीष के वचन कहे
  rationale: पद आशीष देने की सूचना देता है, पर उसका विधान, रूप या शब्द नहीं बताता। सरल क्रियात्मक अभिव्यक्ति मूल पाठ की इस अनिर्दिष्टता को बनाए रखती है।
