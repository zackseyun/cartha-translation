lexical_decisions:
- source_word: ὤρθρευσαν
  choice: भोर को उठे
  rationale: यह क्रिया प्रातः जल्दी या भोर में उठने का भाव देती है; यह अनुवाद समय-संबंधी अर्थ को बनाए रखता है, बिना प्रस्थान का अर्थ जोड़े।
- source_word: κοινῶς
  choice: दोनों
  rationale: यहाँ क्रिया के साझा रूप से किए जाने का भाव है। हिन्दी में कर्ता के साथ ‘दोनों’ सहज और स्पष्ट है।
- source_word: ἦλθοσαν
  choice: आए
  rationale: यूनानी क्रिया का निकटतम सामान्य अर्थ ‘आए’ है; कथावाचक दृष्टिकोण को बदले बिना इसे रखा गया है।
- source_word: γάμον
  choice: विवाह
  rationale: γάμος विवाह अथवा विवाह-समारोह दोनों को सूचित कर सकता है। मुख्य पाठ में व्यापक शब्द ‘विवाह’ रखा गया है और दूसरा अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: εὐλόγησεν
  choice: आशीष दी
  rationale: यह εὐλογέω का स्वाभाविक हिन्दी रूप है और आशीष के किसी अनिर्दिष्ट धार्मिक विधान या शब्दावली को पाठ में नहीं जोड़ता।
- source_word: Τωβείας
  choice: तोबियास
  rationale: यह यूनानी नाम Τωβείας का हिन्दी में प्रचलित और स्रोत-संगत लिप्यंतरण है।
- source_word: γυναῖκα αὐτοῦ
  choice: अपनी पत्नी
  rationale: वैवाहिक प्रसंग में γυνή का अर्थ स्पष्टतः ‘पत्नी’ है; हिन्दी में कर्ता की अपनी पत्नी के लिए ‘अपनी’ स्वाभाविक है।
