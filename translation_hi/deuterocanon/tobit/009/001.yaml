lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाकर
  rationale: यहाँ καλέω प्रत्यक्ष कथन का परिचय देता है। ‘बुलाया’ भी संभव है, पर संयुक्त क्रिया ‘बुलाकर ... कहा’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी वाक्य-क्रम को स्पष्ट रखती है।
- source_word: Τωβίας
  choice: तोबियाह
  rationale: यह रूप नाम के सामी स्वरूप को दर्शाता है और पारंपरिक लातीनीकृत ‘टोबियास’ से अधिक स्रोताभिमुख है।
- source_word: Ῥαφαήλ
  choice: रफाएल
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित और उच्चारण-सुलभ लिप्यंतरण।
- source_word: Ἀζαρία
  choice: अजर्याह
  rationale: कथानक में रफाएल को उसके यात्रा-नाम ‘अजर्याह’ से संबोधित किया गया है; यूनानी पाठ इसे स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: सम्बोधन रूप का सीधा अर्थ ‘भाई’ है। यहाँ यह आत्मीय सम्बोधन हो सकता है, पर ‘मित्र’ कहना स्रोत के संबंध-सूचक शब्द की अधिक व्याख्या कर देगा।
