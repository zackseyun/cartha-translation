translation:
  language: hi
  text: और उसका पिता तोबीत हर दिन गिनती कर रहा था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पृष्ठ का यूनानी पाठ पाठ-परंपरा की दृष्टि से जटिल है और इसमें आसपास के प्रसंग की कुछ सामग्री दोहराई हुई प्रतीत होती है। यह वाक्यांश एक स्पष्ट इकाई है और इसका अनुवाद सीधे किया गया है; पृष्ठ के आगे के वाक्यों में विभिन्न पाठ-रूपों की परस्पर मिलती-जुलती सामग्री है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐλογίζετο
  choice: हिसाब लगा रहा था
  rationale: अपूर्ण भूतकाल रूप लगातार या बार-बार की जा रही क्रिया बताता है। संदर्भ में तोबीत अपने पुत्र की यात्रा के बीतते समय का हिसाब लगा रहा है; यह प्रयोग स्वाभाविक हिन्दी में अर्थ को स्पष्ट रखता है, पर जिस वस्तु का हिसाब था उसे मुख्य पाठ में अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἑκάστης ἡμέρας
  choice: हर दिन
  rationale: यह पद दैनिक पुनरावृत्ति का बोध कराता है। ‘हर दिन’ आधुनिक हिन्दी में संक्षिप्त, सहज और वितरणात्मक अर्थ के अनुरूप है।
- source_word: Τωβεὶθ ὁ πατὴρ αὐτοῦ
  choice: उसका पिता तोबीत
  rationale: यूनानी पाठ तोबीत का नाम लेकर उसे संबंधसूचक रूप में ‘उसका पिता’ बताता है। हिन्दी में यह क्रम संबंध और नाम दोनों को स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हिसाब लगा रहा था’ निरंतर क्रिया और संदर्भगत प्रतीक्षा को व्यक्त करता है, जबकि मूल की तरह हिसाब की वस्तु को इस छोटे वाक्य में अनकहा छोड़ता है।
