  language: hi
  text: और मेरे पिता दिन गिन रहे हैं; यदि मुझे बहुत देर हो जाए, तो वे बहुत व्याकुल हो जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμεῖ τὰς ἡμέρας
  choice: एक-एक दिन गिन रहे हैं
  rationale: वर्तमान काल की जारी क्रिया और प्रतीक्षा में बीतते दिनों पर पिता की सतत दृष्टि को स्वाभाविक हिन्दी में व्यक्त करता है। 'एक-एक' यूनानी में अलग शब्द के रूप में नहीं है, पर हिन्दी मुहावरे में 'दिन गिनना' की निरंतरता स्पष्ट करता है, बिना अर्थ बदले।
- source_word: χρονίσω μέγα
  choice: मैं बहुत देर करूँ
  rationale: ἐὰν के साथ प्रयुक्त संभावनार्थक रूप भविष्य की शर्त व्यक्त करता है। μέγα यहाँ क्रियाविशेषण की तरह देर की अवधि बढ़ाता है; 'बहुत देर करूँ' स्वाभाविक है और किसी बाहरी कारण से रोके जाने का अर्थ नहीं जोड़ता।
- source_word: ὀδυνηθήσεται λίαν
  choice: वे बहुत व्याकुल हो जाएँगे
  rationale: क्रिया तीव्र मानसिक पीड़ा, चिंता या शोक का बोध कराती है, और λίαν उसकी तीव्रता बढ़ाता है। प्रसंग में 'बहुत व्याकुल' आधुनिक, सहज और पर्याप्त रूप से प्रबल है।
