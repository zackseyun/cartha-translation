    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν ὡς εἶπεν
  choice: उसने जैसा कहा था, वैसा ही किया
  rationale: यूनानी तुलना-वाक्य की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति; पूर्व कथन के बाद हुई क्रिया को हिन्दी में स्पष्ट करने के लिए ‘कहा था’ रखा गया है।
- source_word: εἰσήγαγεν αὐτὴν ἐκεῖ
  choice: उसे वहाँ भीतर ले गया
  rationale: εἰσάγω के भीतर ले जाने के अर्थ और ἐκεῖ के स्पष्ट स्थान-सूचक भाव, दोनों को बनाए रखता है।
- source_word: ἔκλαυσεν
  choice: वह रो पड़ी
  rationale: निकटतम स्त्रीलिंग पात्र सारा को कर्ता मानते हुए आकस्मिक भावनात्मक प्रतिक्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπεδέξατο τὰ δάκρυα
  choice: आँसुओं को स्वीकार किया
  rationale: ἀποδέχομαι के ‘ग्रहण/स्वीकार करने’ के रूपक को मिटाए बिना करुणापूर्ण स्वीकृति का भाव बनाए रखता है।
- source_word: τῆς θυγατρὸς αὐτῆς
  choice: अपनी बेटी के
  rationale: पाठ में αὐτῆς स्त्रीलिंग है, पर प्रसंग में कार्यकर्ता रगूएल है और बेटी सारा है; ‘अपनी’ हिन्दी में उसी प्रसंगगत संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: εἶπεν αὐτῇ
  choice: उससे कहा
  rationale: संवाद आरम्भ करने वाले यूनानी सूत्र का संक्षिप्त और सामान्य हिन्दी रूप।
theological_decisions:
- issue: τῆς θυγατρὸς αὐτῆς में सर्वनाम का संदर्भ
  choice: प्रसंग के अनुसार ‘अपनी बेटी के’
  alternative: रूप की दृष्टि से शाब्दिक ‘उसकी बेटी के’, जहाँ ‘उसकी’ स्त्रीलिंग संदर्भ की ओर संकेत कर सकता है
  rationale: प्राप्त यूनानी पाठ में सर्वनाम स्त्रीलिंग है, किंतु कथानक रगूएल को कार्यकर्ता और सारा को उसकी बेटी बताता है। मुख्य पाठ में प्रसंगगत अर्थ दिया गया है और पाठगत असंगति को पादटिप्पणी में सुरक्षित रखा गया है; यह किसी धर्मसैद्धांतिक निष्कर्ष पर आधारित नहीं है।
