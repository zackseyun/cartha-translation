  yaml_path: translation/deuterocanon/tobit/007/002.yaml
  text: And Edna said to his wife[b][a], “How much the young man Tobit resembles my nephew!”
translation:
  language: hi
  text: और एदना ने उसकी पत्नी से कहा[a], “यह युवक तोबीत मेरे भतीजे[b] से कितना मिलता-जुलता है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में है, “एदना ने उसकी पत्नी से कहा,” पर सामी समानांतर पाठ में रगूएल अपनी पत्नी एदना से कहता है। प्रसंग से संकेत मिलता है कि यहाँ पाठ या उसके संप्रेषण में कोई गड़बड़ी हो सकती है।
    reason: textual_variant
  - marker: b
    text: या “मेरे चचेरे भाई”; यूनानी रिश्तेदारी-सूचक शब्द निकट पुरुष संबंधी के लिए अधिक व्यापक अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν
  choice: और ... ने ... कहा
  rationale: यूनानी कथा-संयोजक और कथन-क्रिया को सरल, स्वाभाविक हिन्दी में रखा गया है।
- source_word: Ἔδνα
  choice: एदना
  rationale: व्यक्तिनाम का यूनानी रूप के अनुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: उसकी पत्नी से
  rationale: γυνή यहाँ स्पष्ट रूप से ‘पत्नी’ के अर्थ में है; αὐτοῦ के तृतीय-पुरुष संबंधसूचक अर्थ को बनाए रखा गया है, यद्यपि प्रसंग में यह पाठ कठिन है।
- source_word: Ὡς ὅμοιος
  choice: कितना मिलता-जुलता है
  rationale: विस्मयवाचक ὡς और समानता-सूचक ὅμοιος का संयुक्त भाव सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ὁ νεανίσκος
  choice: यह युवक
  rationale: νεανίσκος का स्वाभाविक आधुनिक हिन्दी अर्थ ‘युवक’ है; हिन्दी में प्रसंगगत संकेत के लिए ‘यह’ उपयुक्त है।
- source_word: Τωβεὶτ
  choice: तोबीत
  rationale: यूनानी व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: τῷ ἀνεψιῷ μου
  choice: मेरे भतीजे
  rationale: ἀνεψιός का अधिक विशिष्ट अर्थ ‘भतीजा’ लिया गया है, जबकि इसके व्यापक रिश्तेदारी अर्थ की संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: वक्ता की पहचान और संबंधसूचक सर्वनाम
  choice: यूनानी पाठ के अनुसार ‘एदना ने उसकी पत्नी से कहा’
  alternative: ‘रगूएल ने अपनी पत्नी एदना से कहा’
  rationale: मुख्य यूनानी साक्ष्य Ἔδνα को वक्ता बताता है और साथ ही ‘उसकी पत्नी से’ कहता है, जो प्रसंग में असंगत प्रतीत होता है। सामी समानांतर में रगूएल अपनी पत्नी एदना से बोलता है। मुख्य पाठ को चुपचाप सुधारने के बजाय यूनानी की कठिनाई बनाए रखी गई और पाठांतर पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी पाठ की असहजता को मुख्य पाठ में सुरक्षित रखते हुए पाठ-संबंधी समस्या स्पष्ट पाद-टिप्पणी में बताई गई है।
