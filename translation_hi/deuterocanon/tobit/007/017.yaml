base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/017.yaml
  text: Take courage[a], child; may the Lord of heaven and earth grant you favor instead of this sorrow of yours. Take courage, daughter.
translation:
  language: hi
  text: हिम्मत रखो, बच्चे; स्वर्ग और पृथ्वी का प्रभु तुम्हारे इस दुःख के बदले तुम्हें कृपा[a] प्रदान करे। हिम्मत रखो, बेटी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनुग्रह’; यूनानी χάρις यहाँ दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρσει
  choice: हिम्मत रखो
  rationale: यह θαρσέω का आज्ञार्थक रूप है, जो दुःख में साहस बँधाता है। ‘हिम्मत रखो’ आधुनिक, स्वाभाविक हिन्दी है; यूनानी पाठ की पुनरावृत्ति दोनों स्थानों पर बनाए रखी गई है।
- source_word: τέκνον
  choice: बच्चे
  rationale: τέκνον स्नेहपूर्ण पारिवारिक सम्बोधन है और अपने आप में पुरुषवाचक नहीं है। सम्बोधन के रूप में ‘बच्चे’ सामान्य अर्थ बनाए रखता है तथा मूल में न पाए जाने वाले ‘मेरे’ को नहीं जोड़ता।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर की उपाधि है; यहूदी प्रार्थना के संदर्भ में ‘प्रभु’ स्वाभाविक और स्थापित अनुवाद है।
- source_word: τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: स्वर्ग और पृथ्वी का
  rationale: यह परमेश्वर के सार्वभौम प्रभुत्व को व्यक्त करने वाला व्यापक युग्म है। ‘स्वर्ग और पृथ्वी’ हिन्दी बाइबलीय भाषा में स्पष्ट और प्रचलित है।
- source_word: δῴη
  choice: प्रदान करे
  rationale: यह इच्छा अथवा प्रार्थना व्यक्त करने वाला विधिलिंग है। ‘प्रदान करे’ आशीर्वाद की भाषा में स्वाभाविक है और वाक्य का कामना-सूचक भाव बनाए रखता है।
- source_word: σοι χάριν
  choice: तुम्हें कृपा
  rationale: χάρις यहाँ परमेश्वर से मिलने वाली कृपालु भलाई या अनुकूलता को सूचित करता है। ‘कृपा’ सन्दर्भ के अनुरूप है, जबकि सम्भव विकल्प ‘अनुग्रह’ को पादटिप्पणी में रखा गया है।
- source_word: ἀντὶ τῆς λύπης σου ταύτης
  choice: तुम्हारे इस दुःख के बदले
  rationale: ἀντί विनिमय या प्रतिस्थापन का भाव देता है और λύπη दुःख या शोक को दर्शाता है। यह अनुवाद दोनों अर्थों को सीधे बनाए रखता है।
- source_word: θύγατερ
  choice: बेटी
  rationale: यह स्पष्ट स्त्रीलिंग पारिवारिक सम्बोधन है। अन्त में ‘बेटी’ रखने से सामान्य τέκνον से विशिष्ट θύγατερ की ओर मूल पाठ का बदलाव सुरक्षित रहता है।
theological_decisions:
- issue: परमेश्वर से की गई प्रार्थना में χάρις का अनुवाद
  choice: कृपा
  alternative: अनुग्रह
  rationale: यह प्रसंग किसी सैद्धान्तिक विवेचन का नहीं, बल्कि दुःखी बेटी को दिए जा रहे आशीर्वाद का है। ‘कृपा’ परमेश्वर की कृपालु भलाई को सहज रूप में व्यक्त करता है; ‘अनुग्रह’ भी शब्दार्थ की दृष्टि से सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, स्नेहपूर्ण और गरिमापूर्ण पारिवारिक सम्बोधन रखा गया है। प्रार्थना का कामना-सूचक भाव और आरम्भ-अन्त में दोहराया गया प्रोत्साहन सुरक्षित है।
