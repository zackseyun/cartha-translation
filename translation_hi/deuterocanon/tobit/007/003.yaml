  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रजिस्टर। ‘रहनेवाले’, ‘वंशजों’ और ‘बंदी बनाकर’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं; संबोधन ‘भाइयो’ मूल की आत्मीयता और पुल्लिंग बहुवचन दोनों बनाए रखता है।
