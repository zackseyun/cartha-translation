base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/003.yaml
  text: And Raguel asked them[a], “Where are you from, brothers?” And they said to him, “We are from the sons of Naphtali[b], the captives from Nineveh.”
translation:
  language: hi
  text: रगूएल ने उनसे पूछा, “भाइयो, तुम कहाँ के रहनेवाले हो?” उन्होंने उससे कहा, “हम नप्ताली के वंशजों[a] में से हैं, नीनवे से आए बंदियों[b] में से।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नप्ताली के पुत्रों में से।” इसका अर्थ नप्ताली के वंशजों या उसके गोत्र के लोगों से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “नीनवे से बंदियों में से।” “नीनवे से” का संबंध-विन्यास कठिन है; कथा के व्यापक प्रसंग में नप्ताली के लोग नीनवे में निर्वासन में हैं, पर यहाँ अनुवाद यूनानी के “से” को बनाए रखता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἠρώτησεν
  choice: पूछा
  rationale: सामान्य कथात्मक क्रिया के लिए सहज और सटीक आधुनिक हिन्दी।
- source_word: Πόθεν ἐστέ
  choice: तुम कहाँ के रहनेवाले हो
  rationale: मूल स्थान या समुदाय के विषय में पूछे गए प्रश्न का स्वाभाविक हिन्दी रूप।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी के पुल्लिंग बहुवचन संबोधन को बनाए रखता है और यहाँ आत्मीय संबोधन के रूप में स्वाभाविक है।
- source_word: Ἐκ τῶν υἱῶν Νεφθαλεὶ
  choice: नप्ताली के वंशजों में से
  rationale: शाब्दिक ‘नप्ताली के पुत्रों में से’ यहाँ वंश अथवा गोत्र-संबंध बताता है; ‘वंशजों’ से अर्थ स्पष्ट रहते हुए वंशगत भाव सुरक्षित रहता है।
- source_word: τῶν αἰχμαλώτων ἐκ Νινευή
  choice: जिन्हें बंदी बनाकर नीनवे ले जाया गया था
  rationale: αἰχμαλώτων की बलपूर्वक बंदी बनाए जाने की धारणा सुरक्षित रखता है। ἐκ Νινευή की सतही दिशा अस्पष्ट लग सकती है, पर प्रसंग में नीनवे निर्वासन का गंतव्य है; इसलिए अर्थगत रूप से स्वाभाविक हिन्दी दी गई है और पाठगत कठिनाई पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: नप्ताली से संबंध की प्रकृति
  choice: वंशजों में से
  alternative: नप्ताली के पुत्रों में से / नप्ताली के गोत्र में से
  rationale: यह मुख्यतः वंश और गोत्र दोनों की ओर संकेत कर सकता है; मुख्य पाठ में सहज वंशगत अभिव्यक्ति रखी गई और विकल्प पादटिप्पणी में दिए गए।
- issue: नीनवे के साथ बंदियों का संबंध
  choice: बंदी बनाकर नीनवे ले जाया गया था
  alternative: नीनवे से आए बंदी / नीनवे में निर्वासित लोग
  rationale: यूनानी ἐκ Νινευή शाब्दिक रूप से ‘नीनवे से’ है, पर टोबित की कथा में ये लोग नीनवे में निर्वासित हैं। मुख्य पाठ कथानक-संगत अर्थ देता है, जबकि वास्तविक पाठगत तनाव पादटिप्पणी में सुरक्षित है।
