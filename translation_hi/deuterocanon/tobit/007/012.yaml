base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/012.yaml
  text: And Raguel said[a], “Take her from now on according to the judgment. You are her brother, and she is yours[c][b]. And may the merciful God prosper what is best for you.”
translation:
  language: hi
  text: रगूएल ने कहा, “अब से निर्णय[b] के अनुसार उसे ग्रहण करो। तुम उसके भाई[a] हो और वह तुम्हारी है। दयालु परमेश्वर तुम्हारे लिए सबसे उत्तम बातों को सफल बनाए।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भाई’ का अर्थ सगा भाई नहीं, बल्कि पारिवारिक रीति के अनुसार विवाह के योग्य निकट संबंधी है।
    reason: cultural_note
  - marker: b
    text: या ‘न्यायिक निर्णय के अनुसार’ अथवा ‘विधिक आदेश के अनुसार’।
    reason: lexical_alternative
  - marker: c
    text: 'अधिक शाब्दिक रूप: ‘दयालु परमेश्वर तुम्हारे लिए सबसे उत्तम बातों को सफल करेगा।’ यूनानी में क्रिया भविष्यत् काल में है, जिसे यहाँ आशीर्वचन के रूप में व्यक्त किया गया है।'
    reason: lexical_and_discourse_alternative
lexical_decisions:
- source_word: Κομίζου
  choice: ग्रहण करो
  rationale: मध्यमवाच्य आज्ञार्थक रूप यहाँ सारा को पत्नी के रूप में स्वीकार करने और अपने साथ लेने का निर्देश देता है। ‘ग्रहण करो’ विवाह-संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह पदबंध नए वैवाहिक संबंध के आरंभ-बिंदु को सीधे व्यक्त करता है।
- source_word: κατὰ τὴν κρίσιν
  choice: निर्णय के अनुसार
  rationale: κρίσις का अर्थ न्याय, निर्णय या विधिक आदेश हो सकता है। ‘निर्णय’ औपचारिक भाव बनाए रखता है, पर उसके सटीक विधिक स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀδελφὸς
  choice: भाई
  rationale: यूनानी पाठ में शाब्दिक रूप से ‘भाई’ है। यहाँ यह निकट संबंधी के लिए व्यापक कुल-संबंधी भाषा है; मूल शब्द मुख्य पाठ में रखा गया और उसका संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐλεήμων
  choice: दयालु
  rationale: यह परमेश्वर के दया दिखाने वाले स्वभाव को व्यक्त करता है। आधुनिक हिन्दी में ‘दयालु’ सहज, स्पष्ट और धर्मशास्त्रीय रूप से उपयुक्त है।
- source_word: εὐοδώσει
  choice: सिद्ध करे
  rationale: क्रिया का अर्थ सफल करना या समृद्ध करना है। हिन्दी आशीर्वचन में ‘सिद्ध करे’ सफलता प्रदान करने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ κάλλιστα
  choice: उत्तम-से-उत्तम कार्य
  rationale: नपुंसकलिंग बहुवचन उत्कृष्टतम वस्तुओं या बातों का संकेत देता है। हिन्दी में क्रिया के साथ स्वाभाविकता के लिए ‘कार्य’ जोड़ा गया है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: विवाह के संदर्भ में संबंधसूचक शब्द
  choice: मुख्य पाठ में ‘भाई’ रखा गया है और पादटिप्पणी में उसके व्यापक कुल-संबंधी अर्थ को समझाया गया है।
  alternative: मुख्य पाठ में ‘निकट संबंधी’ या ‘कुटुम्बी’ लिखना।
  rationale: ἀδελφός की वास्तविक शब्दावली को बनाए रखना पाठ की पारिवारिक और विधिक भाषा को सुरक्षित रखता है तथा उसे शाब्दिक सहोदर संबंध मान लेने से बचाने के लिए पादटिप्पणी पर्याप्त स्पष्टीकरण देती है।
- issue: भविष्यत् सूचक आशीर्वचन
  choice: हिन्दी में ‘करे’ के द्वारा प्रार्थना या आशीष का भाव व्यक्त किया गया है।
  alternative: ‘दयालु परमेश्वर तुम्हारे लिए उत्तम-से-उत्तम बातों को सफल करेगा’ के रूप में सीधी भविष्यवाणी।
  rationale: यूनानी में भविष्यत् सूचक रूप है, पर वाक्य-प्रसंग में वह आशीर्वचन का कार्य करता है। हिन्दी में संभावनार्थक ‘करे’ उस वाक्-कार्य को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक भविष्यत् विकल्प पादटिप्पणी में दिया गया है।
- issue: τὰ κάλλιστα की अनिश्चित व्यापकता
  choice: ‘उत्तम-से-उत्तम कार्य’ द्वारा व्यापक शुभ-सफलता का भाव रखा गया है।
  alternative: ‘सबसे अच्छी वस्तुएँ’ या ‘जो सर्वोत्तम है’।
  rationale: मूल नपुंसकलिंग बहुवचन जानबूझकर व्यापक है। अनुवाद किसी विशिष्ट सांसारिक या आत्मिक वरदान को निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘ग्रहण करो’ विवाह-संदर्भ के अनुकूल है; ‘भाई’ मूल की संबंधसूचक असहजता को मिटाने के बजाय पादटिप्पणी सहित सुरक्षित रखता है।
