  text: And they slaughtered a ram from the flock and set out many dishes. Then Tobiah said to Raphael, “Azariah, brother, speak about the matter you were talking about on the journey, and let the matter be brought to completion.”
translation:
  language: hi
  text: और उन्होंने झुंड का एक मेढ़ा बलि चढ़ाया और बहुत-से व्यंजन परोसे। तब तोबियाह ने रफाएल से कहा, “अजर्याह भाई, उस विषय पर बात करो जिसके बारे में तुम यात्रा के दौरान कह रहे थे, और वह काम पूरा किया जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθυσαν
  choice: बलि किया
  rationale: क्रिया का मूल अर्थ वध/बलि करना है; प्रसंग भोज का है, फिर भी यूनानी में निहित बलि-संबंधी अर्थ को सुरक्षित रखा गया है।
- source_word: κριὸν προβάτων
  choice: झुंड में से एक मेढ़ा
  rationale: स्वाभाविक हिन्दी में उस नर भेड़ और उसके झुंड से चुने जाने, दोनों भावों को व्यक्त करता है।
- source_word: ὄψα πλείονα
  choice: बहुत-से व्यंजन
  rationale: ὄψα तैयार खाद्य-पदार्थों या साथ परोसे जाने वाले पकवानों को सूचित करता है; भोज के प्रसंग में 'व्यंजन' सहज है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: प्रत्यक्ष संबोधन की आत्मीयता को आधुनिक हिन्दी में बनाए रखता है।
- source_word: λάλησον ὑπὲρ ὧν ἔλεγες
  choice: जिस विषय में तुम ... बात कर रहे थे, उसके बारे में कहो
  rationale: यूनानी के शाब्दिक बहुवचन/संबंधवाचक रूप को प्रसंगगत एक विषय के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है, जैसा अगले पदांश के एकवचन πρᾶγμα से भी संकेत मिलता है।
- source_word: τελεσθήτω τὸ πρᾶγμα
  choice: वह काम पूरा हो जाए
  rationale: कर्मवाच्य आज्ञार्थक भाव और जानबूझकर सामान्य रखे गए πρᾶγμα को सुरक्षित रखता है।
theological_decisions:
- issue: ἔθυσαν में बलिदान और सामान्य वध के बीच अर्थ-छाया
  choice: बलि किया
  alternative: काटा
  rationale: मूल क्रिया के बलि-संबंधी अर्थ को मिटाना उचित नहीं, यद्यपि पाठ किसी विशिष्ट अनुष्ठान का विवरण नहीं देता।
- issue: τὸ πρᾶγμα की पहचान
  choice: वह काम
  alternative: विवाह की बात
  rationale: यूनानी पाठ सामान्य शब्द प्रयोग करता है; विवाह-संबंधी आशय निकट प्रसंग से समझा जा सकता है, पर उसे इस पद में स्पष्ट जोड़ना मूल की अस्पष्टता को समाप्त कर देता।
