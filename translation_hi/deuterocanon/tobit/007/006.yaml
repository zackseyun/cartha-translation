- source_word: ἀνεπήδησεν
  choice: झट से उठ खड़ा हुआ
  rationale: क्रिया अचानक और उत्सुकता से उठने का भाव व्यक्त करती है। यह हिन्दी में स्वाभाविक रहते हुए दृश्य की भावनात्मक तत्परता बनाए रखती है।
- source_word: κατεφίλησεν
  choice: बड़े स्नेह से चूमा
  rationale: यौगिक क्रिया साधारण चूमने की अपेक्षा अधिक प्रगाढ़ स्नेह का संकेत देती है। यह अनुवाद उस तीव्रता को व्यक्त करता है, पर यूनानी में न कही गई अलग क्रिया, जैसे गले लगाना, नहीं जोड़ता।
- source_word: ἔκλαυσε
  choice: रो पड़ा
  rationale: यह अचानक उमड़े भाव और आँसुओं को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ῥαγουὴλ
  choice: रगूएल
  rationale: नाम का लिप्यंतरण स्रोत के यूनानी रूप के अनुसार किया गया है।
- source_word: αὐτόν
  choice: उसे
  rationale: संदर्भ में यह सर्वनाम टोबियास के लिए है; हिन्दी में कर्मकारक रूप स्वाभाविक है।
