base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/011.yaml
  text: I gave my child to seven men[a], and whenever they went in to her, they died during the night. But for now, be cheerful. And Tobiah said[b], “I will taste nothing here until you settle and conclude the matter with me.”
translation:
  language: hi
  text: “मैंने अपनी संतान सात पुरुषों[a] को दी है, और जब भी वे उसके पास जाते थे, वे रात में मर जाते थे। लेकिन अब, प्रसन्न रहो।” तब तोबियाह ने कहा,[b] “जब तक आप मेरे साथ इस मामले को तय और पक्का न कर दें, तब तक मैं यहाँ कुछ नहीं चखूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘सात पुरुषों’ है। प्रसंग से स्पष्ट है कि ये वे पुरुष थे जिनसे उसका विवाह किया गया था; इसलिए ‘सात पतियों’ भी एक संभव प्रसंगानुकूल अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ अंतिम उपवाक्य का यूनानी पाठ कठिन है। अनुवाद उसके प्रकट आशय को व्यक्त करता है: तोबियाह तब तक भोजन करने से मना करता है, जब तक उसके साथ विवाह की व्यवस्था विधिवत निश्चित न कर दी जाए।'
    reason: textual_variant
lexical_decisions:
- source_word: τὸ παιδίον μου
  choice: अपनी बच्ची
  rationale: παιδίον का मूल अर्थ ‘बच्चा/छोटी संतान’ है। यहाँ रागुएल अपनी बेटी सारा की बात कर रहा है; ‘बच्ची’ उसके आत्मीय पारिवारिक संबोधन को बनाए रखता है।
- source_word: ἑπτὰ ἀνδράσιν
  choice: सात पुरुषों
  rationale: ἀνήρ का अर्थ ‘पुरुष’ या प्रसंगानुसार ‘पति’ हो सकता है। मुख्य पाठ यूनानी की अनिर्दिष्ट अभिव्यक्ति रखता है; विवाह का आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὁπότε ἐὰν εἰσεπορεύοντο πρὸς αὐτήν
  choice: जब-जब वे उसके पास भीतर गए
  rationale: यह यूनानी अभिव्यक्ति वैवाहिक/यौन संदर्भ में प्रयुक्त शिष्टोक्ति को सीधे स्पष्ट किए बिना बनाए रखती है।
- source_word: ἀπέθνησκον ὑπὸ νύκτα
  choice: वे रात में मर गए
  rationale: ὑπὸ νύκτα समयसूचक है, और अपूर्ण काल बार-बार घटित परिणाम को दर्शाता है; ‘जब-जब’ के साथ हिंदी में यह पुनरावृत्ति स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἀλλὰ τὸ νῦν ἔχων ἡδέως γίνου
  choice: पर अभी तुम प्रसन्न रहो
  rationale: प्राप्त यूनानी वाक्य-विन्यास असहज है, पर इसका स्पष्ट भाव उत्साहित या प्रसन्न रहने का आग्रह है। यह आधुनिक, गरिमापूर्ण हिंदी में उस भाव को संक्षेप में देता है।
- source_word: Οὐ γεύομαι οὐδὲν ὧδε
  choice: मैं यहाँ कुछ नहीं चखूँगा
  rationale: γεύομαι का शाब्दिक अर्थ ‘चखना’ है और यहाँ भोजन करने से इनकार का भाव देता है; हिंदी में वही बिंब स्वाभाविक है।
- source_word: ἕως ἂν στήσητε καὶ σταθῆτε πρὸς μέ
  choice: जब तक आप मेरे साथ इस बात को ठहरा और पक्का न कर दें
  rationale: दोनों यूनानी क्रियाओं का पाठ कठिन है। प्रसंग विवाह की व्यवस्था को औपचारिक रूप से निश्चित करने का है; ‘ठहरा और पक्का’ दोहरी क्रिया तथा पूर्ण निर्णय के भाव को बनाए रखता है।
