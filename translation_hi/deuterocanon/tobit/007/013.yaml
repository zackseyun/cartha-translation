  text: And he called Sarah his daughter[a], and taking her by the hand he gave her to Tobiah as a wife, and he said, “See, according to the law of Moses, take her and bring her to your father.” And he blessed them.
translation:
  language: hi
  text: तब उसने अपनी बेटी सारा को बुलाया, और उसका हाथ पकड़कर उसे पत्नी के रूप में तोबियाह को सौंप दिया। उसने कहा, “देखो, मूसा की व्यवस्था के अनुसार इसे ग्रहण करो[a] और अपने पिता के पास ले जाओ।” फिर उसने उन दोनों को आशीर्वाद दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसे ले लो”; यूनानी क्रिया का अर्थ लेना, ग्रहण करना या साथ ले जाना हो सकता है, पर अगली आज्ञा पहले ही पिता के पास ले जाने की गति व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: यहाँ क्रिया का सीधा अर्थ बुलाना है; प्रसंग अनावश्यक रूप से औपचारिक ‘तलब किया’ की माँग नहीं करता।
- source_word: λαβὼν τῆς χειρὸς αὐτῆς
  choice: उसका हाथ पकड़कर
  rationale: यह विवाह में सौंपने की ठोस क्रिया को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: παρέδωκεν αὐτὴν Τωβείᾳ γυναῖκα
  choice: उसे पत्नी के रूप में तोबियाह को सौंप दिया
  rationale: παραδίδωμι यहाँ विश्वासघात नहीं, बल्कि विवाह में औपचारिक रूप से सौंपना है; γυναῖκα का विधेयात्मक वैवाहिक अर्थ भी स्पष्ट रहता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संकेतक है; ‘देखो’ आधुनिक और गरिमापूर्ण है, जबकि ‘निहारो’ या ‘देख’ अप्राकृतिक अथवा अनुपयुक्त लगते हैं।
- source_word: κατὰ τὸν νόμον Μωυσέως
  choice: मूसा की व्यवस्था के अनुसार
  rationale: नामित मूसा और कानूनी-धार्मिक आधार दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: κομίζου
  choice: इसे ग्रहण करो
  rationale: इस आज्ञार्थक क्रिया में लेने, ग्रहण करने या साथ ले जाने का अर्थ हो सकता है। अगली आज्ञा यात्रा की दिशा व्यक्त करती है, इसलिए यहाँ विवाह-संबंध में ग्रहण करने का भाव उपयुक्त है।
- source_word: ἄπαγε πρὸς τὸν πατέρα σου
  choice: अपने पिता के पास ले जाओ
  rationale: यह किसी को साथ लेकर निर्दिष्ट गंतव्य की ओर जाने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐλόγησεν αὐτούς
  choice: उसने उन दोनों को आशीर्वाद दिया
  rationale: बहुवचन सर्वनाम का आशय नवविवाहित दोनों व्यक्तियों से है; ‘उन दोनों’ हिन्दी में संदर्भ को स्पष्ट करता है, बिना नई सूचना जोड़े।
theological_decisions:
- issue: द्वितीयकानूनी कथा में मूसा की व्यवस्था का स्पष्ट उल्लेख
  choice: “मूसा की व्यवस्था के अनुसार” को बिना नरम किए या विस्तृत किए रखा गया।
  alternative: “हमारी व्यवस्था के अनुसार” या केवल “व्यवस्था के अनुसार”
  rationale: यूनानी पाठ मूसा का स्पष्ट नाम लेता है। अनुवाद को बाद के ऐतिहासिक या कैनन-संबंधी धर्मसैद्धान्तिक निर्णय जोड़े बिना कथा के इस दावे को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। विवाह-सौंपने की औपचारिकता को ‘सौंप दिया’ से रखा गया है। सारा के लिए आज्ञाओं में ‘इसे’ मूल के स्त्रीलिंग सर्वनाम का स्वाभाविक हिन्दी संदर्भ है; यह अनादर सूचित करने के लिए नहीं है।
