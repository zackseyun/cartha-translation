base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/007.yaml
  text: And he said to him[a], “He is the son of a noble and good man.” And when he heard that Tobit had lost his eyes[b], he was grieved and wept.
translation:
  language: hi
  text: और उसने उससे कहा,[a] “वह एक भले और नेक मनुष्य का पुत्र है।” जब उसने सुना कि तोबीत ने अपनी आँखें खो दी थीं,[b] तो वह दुःखी हुआ और रो पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी यहाँ अपूर्ण है; शाब्दिक रूप से, “वह उस भले और नेक मनुष्य का है।” स्पष्टता और प्रसंग के आधार पर “पुत्र” जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “तोबीत की दृष्टि चली गई थी।” यूनानी में अधिक शाब्दिक रूप से, “उसने अपनी आँखें खो दी थीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου
  choice: यह एक भले और नेक मनुष्य का पुत्र है
  rationale: यूनानी वाक्यांश अपूर्ण है और उसमें ‘पुत्र’ स्पष्ट रूप से नहीं है, पर संबंधसूचक षष्ठी और प्रसंग पारिवारिक पहचान का संकेत देते हैं। सहज हिन्दी के लिए ‘पुत्र’ जोड़ा गया है और इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: καλοῦ καὶ ἀγαθοῦ
  choice: भले और नेक
  rationale: दोनों प्रशंसात्मक विशेषणों का भेद यथासंभव बनाए रखते हुए आधुनिक, स्वाभाविक और चरित्र-सूचक हिन्दी चुनी गई है।
- source_word: ἀκούσας
  choice: फिर जब उसने सुना
  rationale: यूनानी कृदन्त को सहज हिन्दी में कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: ἀπώλεσεν τοὺς ὀφθαλμοὺς ἑαυτοῦ
  choice: उसकी आँखें जाती रही थीं
  rationale: यह प्रयोग यूनानी के ठोस ‘अपनी आँखें खो दीं’ को दर्शाता है, पर हिन्दी में शारीरिक अंगों के नष्ट हो जाने का अनावश्यक अर्थ पैदा किए बिना दृष्टिहीनता का भाव देता है। ‘दृष्टि चली गई थी’ पादटिप्पणी में दिया गया है।
- source_word: ἐλυπήθη
  choice: दुःखी हुआ
  rationale: यह शोक और मनोव्यथा को सरल, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔκλαυσεν
  choice: रो पड़ा
  rationale: क्रिया की स्पष्ट भावात्मक प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आरम्भिक पहचान-सूत्र की यूनानी अपूर्णता
  choice: अर्थ की स्पष्टता के लिए ‘पुत्र’ जोड़ा गया
  alternative: शाब्दिक रूप में ‘वह उस भले और नेक मनुष्य का है’
  rationale: मूल यूनानी वास्तविक रूप से अपूर्ण है। हिन्दी में बिना पूर्ति के वाक्य अस्पष्ट और अस्वाभाविक होता; ‘पुत्र’ प्रसंगानुकूल न्यूनतम पूर्ति है, पर इसकी अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: तोबीत के अन्धेपन का ठोस अथवा अर्थपरक वर्णन
  choice: आँखें जाती रही थीं
  alternative: दृष्टि चली गई थी
  rationale: मुख्य पाठ यूनानी के ठोस शारीरिक बिम्ब के निकट रहता है, जबकि पादटिप्पणी उसका स्वाभाविक अर्थपरक विकल्प देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘भले और नेक’ दो यूनानी विशेषणों की संयुक्त प्रशंसा को सहज रूप में बनाए रखता है। हर पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
