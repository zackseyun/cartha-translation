  text: And he called Edna his wife, and taking a document, he wrote out a marriage contract[a], and they sealed it.
translation:
  language: hi
  text: फिर उसने अपनी पत्नी एदना को बुलाया। उसने एक दस्तावेज़ लेकर विवाह-अनुबंध[a] लिखा, और उन्होंने उस पर मुहर लगा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लिखित समझौता” अथवा केवल “अनुबंध”; यूनानी शब्द किसी औपचारिक लिखित कानूनी दस्तावेज़ को दर्शाता है। यहाँ विवाह के प्रसंग के कारण “विवाह-अनुबंध” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: यह यूनानी क्रिया के सामान्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अधिक औपचारिक ‘तलब किया’ की आवश्यकता नहीं है।
- source_word: Ἔδναν
  choice: एदना
  rationale: व्यक्तिवाचक नाम का यूनानी रूप से स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: γυναῖκα
  choice: पत्नी
  rationale: सम्बन्धसूचक αὐτοῦ और घरेलू प्रसंग में γυνή का अर्थ स्पष्ट रूप से ‘पत्नी’ है।
- source_word: λαβὼν βιβλίον
  choice: एक दस्तावेज़ लेकर
  rationale: βιβλίον पुस्तक, पत्र या लिखित दस्तावेज़ हो सकता है; कानूनी अनुबंध लिखने और मुहर लगाने के प्रसंग में ‘दस्तावेज़’ उसके कार्य को सबसे स्पष्ट रूप से बताता है।
- source_word: ἔγραψεν
  choice: लिखा
  rationale: सरल क्रिया मूल यूनानी के निकट है और हिन्दी में अनुबंध तैयार करने की क्रिया को पर्याप्त रूप से व्यक्त करती है।
- source_word: συγγραφήν
  choice: विवाह-अनुबंध
  rationale: शब्द का अर्थ औपचारिक लिखित समझौता या अनुबंध है; निकटवर्ती विवाह-प्रसंग के कारण ‘विवाह-अनुबंध’ स्वाभाविक और संदर्भसम्मत है, जबकि पादटिप्पणी व्यापक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ἐσφραγίσαντο
  choice: उन्होंने उस पर मुहर लगा दी
  rationale: क्रिया तृतीय पुरुष बहुवचन है और दस्तावेज़ को मुहरबंद करने की ठोस कार्रवाई बताती है; ‘उन्होंने’ इस बहुवचन को सुरक्षित रखता है।
