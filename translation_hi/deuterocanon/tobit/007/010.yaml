translation:
  language: hi
  text: और उसने रगूएल को यह बात बता दी। तब रगूएल ने तोबियाह से कहा, “खाओ, पियो और प्रसन्न रहो, क्योंकि मेरी बेटी को पत्नी के रूप में लेना तुम्हारे लिए उचित है; पर मैं तुम्हें सच्चाई बता दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέδωκεν τὸν λόγον
  choice: यह बात बता दी
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप; यहाँ λόγος किसी कथन या विषय की बात को सूचित करता है।
- source_word: ἡδέως γίνου
  choice: प्रसन्न रहो
  rationale: शाब्दिक अर्थ ‘आनन्दित/प्रसन्न हो’ है; भोज के प्रसंग में सहज और गरिमापूर्ण हिन्दी।
- source_word: τὸ παιδίον μου
  choice: मेरी बेटी
  rationale: यूनानी शब्द सामान्यतः ‘मेरी संतान’ कहता है, पर प्रसंग में रगूएल की बेटी सारा स्पष्ट रूप से अभिप्रेत है।
- source_word: λαβεῖν
  choice: पत्नी के रूप में लेना
  rationale: विवाह-संदर्भ को हिन्दी में स्पष्ट करता है; केवल ‘लेना’ अस्वाभाविक और अस्पष्ट होता।
- source_word: ὑποδείξω τὴν ἀλήθειαν
  choice: मैं तुम्हें सच्चाई बता दूँगा
  rationale: ὑποδείκνυμι का भाव किसी तथ्य को प्रकट या समझा देना है; वर्तमान प्रसंग में यही स्वाभाविक हिन्दी है।
