  yaml_path: translation/deuterocanon/tobit/007/015.yaml
  text: And they began to eat[a]. Then Raguel called Edna his wife and said to her, “Sister[b], prepare the other room and bring her in.”
translation:
  language: hi
  text: और वे खाने लगे। तब रगूएल ने अपनी पत्नी एदना को बुलाकर उससे कहा, “बहन[a], दूसरा कमरा[b] तैयार करो और उसे भीतर ले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहन” पत्नी के लिए रिश्ते-सूचक शाब्दिक सम्बोधन है। यह यूनानी शब्दावली को सुरक्षित रखता है और यहाँ आत्मीय घरेलू सम्बोधन के रूप में प्रयुक्त हुआ है।
    reason: cultural_note
  - marker: b
    text: या “दूसरा कक्ष।” यूनानी शब्द ταμεῖον भीतर के कमरे या कक्ष के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ἐσθίειν
  choice: वे खाने लगे
  rationale: यह स्वाभाविक हिन्दी में आरम्भसूचक यूनानी रचना ἄρχομαι + infinitive का सीधा अर्थ व्यक्त करता है।
- source_word: ἐκάλεσεν
  choice: बुलाकर
  rationale: घरेलू प्रसंग में साधारण रूप से बुलाने का भाव है; अधिक औपचारिक ‘तलब किया’ उपयुक्त नहीं होगा।
- source_word: Ἀδελφή
  choice: बहन
  rationale: पत्नी के लिए प्रयुक्त मूल पाठ के आत्मीय रिश्ते-सूचक सम्बोधन को बनाए रखता है।
- source_word: ἑτοίμασον
  choice: तैयार करो
  rationale: आज्ञार्थक क्रिया का स्पष्ट और आधुनिक हिन्दी रूप।
- source_word: τὸ ἕτερον ταμεῖον
  choice: दूसरा कमरा
  rationale: ταμεῖον भीतर के कमरे या कक्ष को सूचित कर सकता है; इस प्रसंग में ‘कमरा’ सबसे स्वाभाविक है और ἕτερον का अर्थ ‘दूसरा’ से सुरक्षित रहता है।
- source_word: εἴσαγε αὐτήν
  choice: उसे भीतर ले जाओ
  rationale: क्रिया किसी को अन्दर ले जाने या पहुँचाने का भाव देती है; स्त्रीलिंग सर्वनाम का प्रसंगगत संकेत सारा की ओर है।
