  text: And Edna his wife and Sarah his daughter wept[a], and they welcomed them eagerly.
translation:
  language: hi
  text: और उसकी पत्नी एदना और उसकी बेटी सारा रोईं, और उन्होंने बड़े उत्साह से उनका स्वागत किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उनका बड़ी आत्मीयता से स्वागत किया” अथवा “उन्होंने उनका सहर्ष स्वागत किया”; यूनानी क्रियाविशेषण तत्पर, पूरे मन से किए गए आतिथ्य पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔδνα
  choice: एदना
  rationale: व्यक्तिगत नाम का यूनानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: ἡ γυνὴ αὐτοῦ
  choice: उसकी पत्नी
  rationale: इस संदर्भ में γυνή वैवाहिक संबंध को स्पष्ट रूप से व्यक्त करता है; हिंदी में स्वाभाविक अधिकारसूचक रचना अपनाई गई है।
- source_word: Σάρρα
  choice: सारा
  rationale: व्यक्तिगत नाम का हिंदी में प्रचलित बाइबलीय रूप।
- source_word: ἡ θυγάτηρ αὐτοῦ
  choice: उसकी बेटी
  rationale: पारिवारिक संबंध को आधुनिक, सहज हिंदी में व्यक्त करता है।
- source_word: ἔκλαυσαν
  choice: रो पड़ीं
  rationale: स्त्रीलिंग बहुवचन कर्ताओं के अनुरूप स्वाभाविक हिंदी; यूनानी एओरिस्ट की घटना को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ὑπεδέξαντο
  choice: स्वागत किया
  rationale: आतिथ्य के इस प्रसंग में क्रिया का अर्थ केवल ग्रहण करना नहीं, बल्कि अतिथियों का स्वागत करना है।
- source_word: αὐτοὺς
  choice: उन लोगों का
  rationale: हिंदी में ‘स्वागत करना’ के साथ कर्म को संबंधसूचक रूप में रखना स्वाभाविक है; यह आगंतुकों की ओर संकेत करता है।
- source_word: προθύμως
  choice: बड़े उत्साह से
  rationale: यह तत्परता, हार्दिक इच्छा और उत्साहपूर्ण आतिथ्य का भाव बनाए रखता है।
