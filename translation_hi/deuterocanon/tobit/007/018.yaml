base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/018.yaml
  text: And Raguel called Edna his wife and said to her[a], “Sister[b], prepare the other chamber and bring her in there.”
translation:
  language: hi
  text: फिर रगूएल ने अपनी पत्नी एदना को बुलाकर उससे कहा, “बहन[a], दूसरा कमरा तैयार करो और उसे वहाँ ले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहन” यहाँ रगूएल द्वारा अपनी पत्नी को संबोधित करने का शब्द है; इसका अर्थ यह नहीं कि वह उसकी सगी बहन थी।
    reason: cultural_note
lexical_decisions:
- source_word: Ἀδελφή
  choice: बहन
  rationale: पत्नी को संबोधित करने वाला प्रत्यक्ष संबोधन है। शाब्दिक पारिवारिक संबोधन को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि इसका आशय जैविक संबंध बताना नहीं है।
- source_word: ἑτοίμασον
  choice: तैयार करो
  rationale: किसी स्थान को उपयोग के लिए तैयार करने की आज्ञा; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट।
- source_word: τὸ ἕτερον ταμεῖον
  choice: दूसरा कमरा
  rationale: ἕτερον का अर्थ यहाँ ‘दूसरा’ है और ταμεῖον भीतरी कक्ष या कमरे को सूचित कर सकता है। विवाह-प्रसंग में ‘कमरा’ सहज और पर्याप्त रूप से सटीक है।
- source_word: εἴσαγε αὐτήν
  choice: उसे वहाँ ले जाओ
  rationale: किसी व्यक्ति को निर्दिष्ट भीतरी स्थान में ले जाने की आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
