base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/001.yaml
  text: And he came to Ecbatana and arrived at the house of Raguel[a], and Sarah also met him. She greeted him, and he greeted them[b], and he brought them into the house.
translation:
  language: hi
  text: वह एकबतना आया और रगुएल के घर पहुँचा। सारा भी उससे मिली। सारा ने उसका अभिवादन किया, और उसने उनका अभिवादन किया। फिर वह उन्हें घर के भीतर ले गया।[a] [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में अंतिम वाक्य की क्रिया का कर्ता एकवचन है, लेकिन उसका नाम स्पष्ट रूप से नहीं दिया गया है।
    reason: alternative_reading
  - marker: b
    text: समानांतर सामी परंपरा में भी रगुएल के घर पहुँचने और अभिवादन करने का यही दृश्य मिलता है, यद्यपि शब्दों और कुछ विवरणों में अंतर है।
    reason: cross_reference
lexical_decisions:
- source_word: ἦλθεν
  choice: पहुँचा
  rationale: यह सामान्य गति-सूचक क्रिया है; नगर के गंतव्य के साथ ‘पहुँचा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: παρεγένετο
  choice: आया
  rationale: पहली क्रिया के बाद यह किसी विशिष्ट स्थान, रगुएल के घर, तक आने को बताती है; दोनों यूनानी क्रियाओं का हल्का भेद बनाए रखने के लिए अलग हिन्दी क्रिया रखी गई है।
- source_word: οἰκίαν
  choice: घर
  rationale: यहाँ प्राथमिक अर्थ भौतिक निवास है; ‘घर’ सहज है और प्रसंग में परिवार/गृहस्थी का भाव भी समेट सकता है।
- source_word: ὑπήντησεν
  choice: मिलने आई
  rationale: क्रिया सामने आकर मिलने का भाव दे सकती है। अलग अभिवादन-क्रिया आगे आने के कारण इसे ‘अभिवादन किया’ नहीं बनाया गया।
- source_word: ἐχαιρέτισεν
  choice: अभिवादन किया
  rationale: यह सामान्य अभिवादन-सूचक क्रिया का सीधा, गरिमापूर्ण और आधुनिक हिन्दी रूप है।
- source_word: αὐτὸς αὐτούς
  choice: उसने उन लोगों का अभिवादन किया
  rationale: यूनानी में पुल्लिंग एकवचन कर्ता और बहुवचन कर्म है, पर उनके स्पष्ट नाम नहीं दिए गए; सर्वनाम रखकर पाठ की वास्तविक संदर्भगत अस्पष्टता सुरक्षित की गई है।
- source_word: εἰσήγαγεν
  choice: घर के भीतर ले गया
  rationale: क्रिया किसी को अंदर लाने या ले जाने को व्यक्त करती है; यह हिन्दी में स्वाभाविक रूप से भीतर की ओर गति बताती है।
- source_word: Ἐκβάτανα
  choice: एकबतना
  rationale: यूनानी स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: Ῥαγουήλ
  choice: रगुएल
  rationale: यूनानी नामरूप के निकट और हिन्दी में सुबोध लिप्यंतरण।
- source_word: Σάρρα
  choice: सारा
  rationale: यूनानी नामरूप का प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: अंतिम उपवाक्य में कर्ता की पहचान
  choice: वह उन्हें घर के भीतर ले गया
  alternative: रगुएल उन्हें अपने घर के भीतर ले गया / वे घर के भीतर ले जाए गए
  rationale: εἰσήγαγεν एकवचन क्रिया है, इसलिए एक अप्रकट एकवचन कर्ता स्वाभाविक है; पर उपलब्ध यूनानी वाक्य उसका नाम स्पष्ट नहीं करता। किसी पात्र का नाम जोड़ने के बजाय सर्वनाम रखकर अस्पष्टता सुरक्षित की गई है।
- issue: अभिवादन वाले वाक्य में सर्वनामों के संदर्भ
  choice: सारा ने उसका अभिवादन किया, और उसने उन लोगों का अभिवादन किया
  alternative: सारा ने तोबीत के बेटे का अभिवादन किया, और उसने घरवालों का अभिवादन किया
  rationale: यूनानी पाठ केवल एकवचन ‘उसका/उसने’ और बहुवचन ‘उन लोगों’ देता है। नाम या समूह की पहचान जोड़ना पाठ से अधिक निश्चितता उत्पन्न करता, इसलिए सर्वनाम ही रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक गद्य अपनाया गया है। छोटे वाक्यों से घटनाक्रम स्पष्ट रखा गया है, जबकि यूनानी पाठ के अस्पष्ट सर्वनामों को नाम जोड़कर कृत्रिम रूप से निश्चित नहीं किया गया।
