translation:
  language: hi
  text: उन्होंने कहा, “वह जीवित और स्वस्थ है।”[a] और तोबियाह[b] ने कहा, “वह मेरे पिता हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से: “वह जीवित है और स्वस्थ है।”'
    reason: lexical_alternative
  - marker: b
    text: परंपरागत अनुवादों में इस नाम का रूप “तोबियास” भी मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ
  choice: जीवित है
  rationale: यहाँ वर्तमान काल का क्रियापद उस व्यक्ति की दशा बताता है; बातचीत के प्रसंग में ‘जीवित है’ स्वाभाविक और सटीक है।
- source_word: ὑγιαίνει
  choice: स्वस्थ है
  rationale: इस क्रियापद का अर्थ स्वस्थ या अच्छी दशा में होना है। ‘जीवित और स्वस्थ है’ युग्म को स्पष्ट और सहज रखता है।
- source_word: Πατήρ μου
  choice: मेरे पिता
  rationale: यूनानी संबंधवाचक पद का सीधा और स्वाभाविक हिन्दी रूप है। पिता के लिए आदरसूचक बहुवचन क्रिया ‘हैं’ आधुनिक मानक हिन्दी के अनुरूप है।
- source_word: Τωβίας
  choice: तोबियाह
  rationale: यह रूप यूनानी नाम के पीछे के सामी नाम को दर्शाता है और नामों के लिप्यंतरण की परियोजना-नीति के अनुरूप है।
theological_decisions:
- issue: Τωβίας नाम का रूप
  choice: तोबियाह
  alternative: तोबियास
  rationale: यह doctrinal प्रश्न नहीं है। ‘तोबियाह’ सामी नाम को अधिक स्पष्ट रूप से दर्शाता है, जबकि ‘तोबियास’ परंपरागत यूनानी-लातीनी रूप के निकट है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद की स्वाभाविकता के लिए καὶ ζῇ καὶ ὑγιαίνει का अनुवाद ‘जीवित और स्वस्थ है’ किया गया है। ‘पिता हैं’ में हिन्दी का सामान्य आदरसूचक प्रयोग अपनाया गया है।
