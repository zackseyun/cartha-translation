    text: या “हमारे संबंधी” अथवा “हमारे रिश्तेदार।” यूनानी में “हमारे भाई” है; यहाँ संभवतः इसका अर्थ सगा भाई नहीं, बल्कि व्यापक नातेदारी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκετε
  choice: क्या तुम ... को जानते हो?
  rationale: संदर्भ में यह व्यक्तिगत परिचय के विषय में प्रश्न है। आधुनिक हिन्दी में ‘जानते हो’ स्वाभाविक है और यूनानी क्रिया के आशय को ठीक व्यक्त करता है।
- source_word: Τωβεὶτ
  choice: तोबीत
  rationale: यूनानी नाम का प्रचलित और हिन्दी में सुबोध लिप्यंतरण।
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: हमारे भाई
  rationale: ἀδελφός का मूल पारिवारिक रूपक सुरक्षित रखा गया है। यहाँ इसका अर्थ सगा भाई न होकर व्यापक संबंधी या अपने समुदाय का व्यक्ति हो सकता है; इस संभावना को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘भाई’ का शाब्दिक अथवा व्यापक संबंधसूचक अर्थ
  choice: हमारे भाई
  alternative: हमारे संबंधी / हमारे रिश्तेदार
  rationale: यूनानी पाठ ‘भाई’ कहता है, इसलिए स्रोत की पारिवारिक भाषा मुख्य पाठ में रखी गई है; संदर्भ में संभावित व्यापक नातेदारी को निश्चित करके आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण संवाद-शैली। ‘तुम’ बहुवचन संबोधन के अनुरूप है। हिन्दी की स्वाभाविक पद-रचना के लिए संबंधसूचक पद नाम से पहले रखा गया है।
