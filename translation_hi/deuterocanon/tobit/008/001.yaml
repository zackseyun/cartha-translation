  rationale: यह स्वाभाविक हिन्दी में कालसूचक सम्बन्ध और कथा के अगले क्रम—दोनों को स्पष्ट करता है।
- source_word: συνετέλεσαν δειπνοῦντες
  choice: वे भोजन कर चुके
  rationale: सहायक क्रिया और कृदन्त का संयुक्त अर्थ भोजन समाप्त कर लेने का है; यह किसी आधुनिक, संस्कृति-विशिष्ट भोजन-नाम को आरोपित नहीं करता।
- source_word: εἰσήγαγον
  choice: वे … ले आए
  rationale: क्रिया किसी को भीतर या किसी की उपस्थिति में ले आने का भाव देती है। यूनानी में कर्ता बहुवचन है, पर उसकी पहचान नहीं बताई गई; हिन्दी में भी यह अनिश्चितता रखी गई है।
- source_word: Τωβείαν
  choice: टोबियाह
  rationale: नाम को सेमिटिक रूप के निकट देवनागरी में लिप्यंतरित किया गया है; पारंपरिक यूनानी-लातीनी रूप ‘टोबियास’ से बचा गया है।
- source_word: πρὸς αὐτήν
  choice: उसके पास
  rationale: πρός के दिशासूचक अर्थ ‘उसकी ओर/उसके पास’ को सहज हिन्दी में व्यक्त करता है, बिना वैवाहिक प्रसंग का अतिरिक्त अर्थ जोड़ने के।
theological_decisions:
- issue: Τωβείαν के नाम का रूप
  choice: टोबियाह
  alternative: टोबियास
  rationale: परियोजना की नाम-लिप्यंतरण नीति और सेमिटिक नाम-रूप के अनुरूप ‘टोबियाह’ चुना गया; इससे कोई सांप्रदायिक व्याख्या नहीं जुड़ती।
- issue: टोबियाह को लाने वालों की पहचान
  choice: अनिर्दिष्ट बहुवचन ‘वे’
  alternative: परिजन या सेवक
  rationale: यूनानी पाठ कर्ताओं की पहचान नहीं करता, इसलिए अनुमान लगाकर उन्हें परिजन या सेवक नहीं कहा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘जब … तब’ वाक्य-संबंध को स्वाभाविक बनाता है। मुख्य यूनानी पाठ संक्षिप्त है; समानांतर सेमिटिक परंपरा की विस्तृत सामग्री को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
