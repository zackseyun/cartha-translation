  yaml_path: translation/deuterocanon/tobit/008/001.yaml
  text: And when they had finished dining[b][a], they brought Tobiah in to her.
translation:
  language: hi
  text: जब वे भोजन कर चुके थे, तब वे टोबियाह को उसके पास ले आए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में है, “वे टोबियाह को उसके पास ले आए।” सेमिटिक समानांतर परंपरा इस दृश्य को विस्तार से बताती है: कमरा और बिछौना तैयार किए जाते हैं, दंपति कमरे में जाते हैं और उनके पीछे द्वार बंद कर दिया जाता है।'
    reason: alternative_reading
  - marker: b
    text: परंपरागत अनुवादों में इस नाम का रूप प्रायः “टोबियास” मिलता है; यहाँ यूनानी Τωβείαν को सेमिटिक रूप के निकट “टोबियाह” लिखा गया है।
    reason: lexical_alternative
