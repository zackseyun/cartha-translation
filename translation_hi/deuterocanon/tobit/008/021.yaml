  yaml_path: translation/deuterocanon/tobit/008/021.yaml
  text: and then[a], after taking half of his possessions, to go in good health to your father[b]; and the rest when I and my wife die.
translation:
  language: hi
  text: और तब वह उसकी सम्पत्ति का आधा भाग लेकर स्वस्थ रहकर तुम्हारे पिता के पास जाए;[a] और जो बाकी है, वह उसे तब मिले जब मैं और मेरी पत्नी दोनों मर जाएँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘पिता के पास’ है; प्रत्यक्ष सम्बोधन का प्रसंग ‘तुम्हारे पिता के पास’ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: अन्तिम उपवाक्य यूनानी में संक्षिप्त है—शाब्दिक रूप से, ‘और जो बाकी है, जब मैं मरूँ और मेरी पत्नी।’ आशय है कि बची हुई सम्पत्ति पति-पत्नी दोनों की मृत्यु के बाद दी जाएगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντα
  choice: लेकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है; हिन्दी में ‘लेकर’ क्रम और वाक्य-प्रवाह दोनों को स्वाभाविक रखता है।
- source_word: τὸ ἥμισυ τῶν ὑπαρχόντων αὐτοῦ
  choice: उसकी सम्पत्ति का आधा भाग
  rationale: ὑπάρχοντα यहाँ किसी व्यक्ति की सम्पत्ति या माल-मत्ता को दर्शाता है; ‘सम्पत्ति’ आधुनिक हिन्दी में स्पष्ट और व्यापक है।
- source_word: πορεύεσθαι
  choice: जाए
  rationale: गमन के सामान्य अर्थ को सहज हिन्दी में व्यक्त करता है और प्रसंग में निहित निर्देश/व्यवस्था के अनुरूप है।
- source_word: μετὰ ὑγείας
  choice: सकुशल
  rationale: यूनानी पद का मूल भाव स्वास्थ्य और कुशलता है; ‘सकुशल’ सुरक्षित और अच्छी दशा में पहुँचने के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς τὸν πατέρα
  choice: तुम्हारे पिता के पास
  rationale: यूनानी में सम्बन्धवाचक सर्वनाम नहीं है, पर प्रत्यक्ष सम्बोधन का प्रसंग पिता को सम्बोधित व्यक्ति का पिता ठहराता है।
- source_word: τὰ λοιπά
  choice: जो बाकी है
  rationale: यह सम्पत्ति के शेष भाग को स्पष्ट, सामान्य हिन्दी में व्यक्त करता है।
- source_word: ὅταν ἀποθάνω καὶ ἡ γυνή μου
  choice: जब मैं और मेरी पत्नी दोनों मर जाएँ
  rationale: यूनानी वाक्यांश संक्षिप्त है; ‘दोनों’ यह स्पष्ट करता है कि शेष भाग दोनों पति-पत्नी की मृत्यु के बाद मिलेगा, बिना मूल आशय बदले।
