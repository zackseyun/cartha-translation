translation:
  language: hi
  text: तब उसने घर के सेवकों को कब्र भर देने का आदेश दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: आदेश दिया
  rationale: केλεύω के अओरिस्ट रूप में अधिकारपूर्वक आदेश देने का भाव है; ‘आदेश दिया’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: τοῖς οἰκέταις
  choice: घर के सेवकों को
  rationale: οἰκέτης विशेष रूप से घराने से जुड़े सेवक या दास को सूचित करता है। ‘घर के सेवक’ घरेलू संदर्भ को बनाए रखता है, जबकि केवल ‘सेवक’ वह सूक्ष्मता खो सकता है और ‘दास’ यहाँ सामाजिक स्थिति को आवश्यकता से अधिक निश्चित कर सकता है।
- source_word: χῶσαι
  choice: भर देने
  rationale: χόω का अर्थ मिट्टी डालकर ढकना या भरना है। कब्र के संदर्भ में ‘भर देना’ उस तैयार कब्र को मिट्टी से बंद करने की ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν τάφον
  choice: कब्र
  rationale: τάφος का अर्थ कब्र या समाधि हो सकता है। इस प्रसंग में मिट्टी से भरे जाने वाले दफन-गड्ढे के लिए ‘कब्र’ सबसे स्वाभाविक और सटीक शब्द है।
