- source_word: ἐποίησεν
  choice: किया
  rationale: ποιέω का मूल अर्थ ‘करना/बनाना’ है, पर γάμον के साथ यह विवाह का आयोजन या उत्सव करने का मुहावरा है। ‘विवाह-भोज किया’ स्वाभाविक हिंदी में इस भाव को व्यक्त करता है।
