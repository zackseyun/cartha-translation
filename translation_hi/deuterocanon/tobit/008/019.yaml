- source_word: γάμον
  choice: विवाह-भोज
  rationale: γάμος विवाह, विवाह-उत्सव या उससे जुड़े भोज को सूचित कर सकता है। चौदह दिन की अवधि के संदर्भ में उत्सव/भोज का अर्थ अधिक स्वाभाविक है, फिर भी विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἡμερῶν δέκα τεσσάρων
  choice: चौदह दिन तक
  rationale: समय-सूचक संबंधकारक अवधि व्यक्त करता है; आधुनिक हिंदी में ‘चौदह दिन तक’ इसका स्वाभाविक रूप है।
