base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/003.yaml
  text: But when the demon smelled the odor[a], it fled to the remotest parts of Egypt, and the angel bound it.
translation:
  language: hi
  text: पर जब उस दुष्टात्मा ने वह गंध सूँघी, तो वह मिस्र के सबसे ऊपरी क्षेत्रों[a] में भाग गया, और स्वर्गदूत ने उसे बाँध दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र के सबसे दूरस्थ क्षेत्रों में”; इस पदबंध का भौगोलिक अर्थ “ऊपरी मिस्र में” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὠσφράνθη
  choice: सूँघी
  rationale: यह ὀσφραίνομαι का एओरिस्ट रूप है और यहाँ सक्रिय अर्थ में गंध को सूँघकर जान लेने की क्रिया बताता है।
- source_word: τὸ δαιμόνιον
  choice: दुष्टात्मा
  rationale: कथा में यह सारा को सताने वाली व्यक्तिगत और विरोधी आत्मिक सत्ता है; आधुनिक हिन्दी में ‘दुष्टात्मा’ स्वाभाविक और स्पष्ट है।
- source_word: τῆς ὀσμῆς
  choice: वह गंध
  rationale: ὀσμή सामान्यतः गंध को सूचित करता है। ‘गंध’ संदर्भ के धुएँ की महक को बिना सुखद सुगंध मान लिए व्यक्त करता है; ‘वह’ पूर्ववर्ती संदर्भ की ज्ञात गंध दर्शाता है।
- source_word: ἔφυγεν
  choice: भाग गया
  rationale: क्रिया भय या संकट से दूर भागने का बोध देती है; ‘भाग गया’ सहज आधुनिक हिन्दी है।
- source_word: εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: मिस्र के सबसे ऊपरी भागों में
  rationale: ἀνώτατα ‘सबसे ऊँचे/ऊपरी’ स्थानों का अतिशयोक्तिपरक रूप है। यह अनुवाद यूनानी की स्थानगत अभिव्यक्ति बनाए रखता है और उसे निर्णायक रूप से औपचारिक भौगोलिक नाम ‘ऊपरी मिस्र’ नहीं बनाता।
- source_word: ἔδησεν
  choice: बाँध दिया
  rationale: δέω का सामान्य अर्थ बाँधना है; यहाँ स्वर्गदूत द्वारा दुष्टात्मा को वश में किए जाने की ठोस क्रिया बनी रहती है।
- source_word: ὁ ἄγγελος
  choice: स्वर्गदूत
  rationale: संदर्भ में यह रफ़ाएल की ओर संकेत करता है, पर इस वाक्यांश में नाम नहीं है; इसलिए निश्चित एकवचन को ‘स्वर्गदूत’ से रखा गया है।
theological_decisions:
- issue: δαιμόνιον की कथात्मक प्रकृति
  choice: व्यक्तिगत विरोधी आत्मिक सत्ता के अर्थ में ‘दुष्टात्मा’
  alternative: ‘दुष्ट आत्मा’ या ‘दैत्य’
  rationale: पाठ इस सत्ता को सूँघने, भागने और स्वर्गदूत द्वारा बाँधे जाने वाले सक्रिय अलौकिक पात्र के रूप में प्रस्तुत करता है। ‘दुष्टात्मा’ इस दावे को कम किए बिना आधुनिक हिन्दी में स्पष्ट है।
- issue: εἰς τὰ ἀνώτατα Αἰγύπτου का भौगोलिक आशय
  choice: अपेक्षाकृत शाब्दिक ‘मिस्र के सबसे ऊपरी भागों में’
  alternative: ‘ऊपरी मिस्र में’ अथवा ‘मिस्र के सबसे दूर के प्रदेशों में’
  rationale: यूनानी शब्द ऊँचाई/ऊपरी दिशा का मूल अर्थ रखता है और संभवतः भौगोलिक ऊपरी मिस्र की ओर संकेत करता है। मुख्य पाठ इस संभावित संकेत को किसी तकनीकी स्थान-नाम में निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-संरचना यूनानी कथानक के क्रम—गंध सूँघना, भागना, फिर बाँधा जाना—को बनाए रखती है। कोई पादटिप्पणी नहीं दी गई, क्योंकि मुख्य पाठ में ‘सबसे ऊपरी भागों’ का अपेक्षाकृत शाब्दिक रूप मूल की भौगोलिक अनिश्चितता को पर्याप्त रूप से सुरक्षित रखता है।
