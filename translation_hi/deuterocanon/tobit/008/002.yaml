base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/002.yaml
  text: As he went in[a], he remembered the words of Raphael, and he took the ashes of the incense and placed the fish’s heart and liver on them, and made them smoke.
translation:
  language: hi
  text: जब वह भीतर जा रहा था[a], तब उसे रफाएल की बातें याद आईं। उसने धूप की राख ली, उस पर मछली का हृदय और कलेजा रखा, और उन्हें जलाया, जिससे धुआँ निकला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब वह जा रहा था।” यूनानी कृदंत सामान्य रूप से चलने या जाने का अर्थ भी दे सकता है; तत्काल प्रसंग और समानांतर सामी परंपरा इसे कमरे में प्रवेश करने के अर्थ में समझने का समर्थन करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενος
  choice: जब वह भीतर जा रहा था
  rationale: वर्तमान कृदंत चल रही गति को दर्शाता है। विवाह-कक्ष के तत्काल प्रसंग में ‘भीतर जा रहा था’ स्वाभाविक है; फिर भी यूनानी में ‘भीतर’ स्पष्ट न होने के कारण वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐμνήσθη
  choice: उसे ... याद आईं
  rationale: यह सीधा भूतकालीन अर्थ देता है और रफाएल के पहले दिए गए निर्देशों से संबंध बनाए रखता है।
- source_word: λόγων Ῥαφαήλ
  choice: रफाएल की बातें
  rationale: ‘बातें’ λόγων का सहज और व्यापक हिन्दी समतुल्य है; प्रसंग स्वयं बताता है कि वे निर्देशात्मक थीं।
- source_word: τέφραν τῶν θυμιαμάτων
  choice: धूप की राख
  rationale: यह संबंधकारक पदबंध का संक्षिप्त, स्वाभाविक हिन्दी रूप है और जलाई गई धूप के अवशेष को स्पष्ट करता है।
- source_word: ἐπέθηκεν
  choice: उस पर ... रखा
  rationale: क्रिया का अर्थ किसी वस्तु को दूसरी वस्तु के ऊपर रखना है। एकवचन ‘उस पर’ हिन्दी में ‘राख’ के अनुरूप है।
- source_word: καρδίαν τοῦ ἰχθύος
  choice: मछली का हृदय
  rationale: मूल के ठोस शारीरिक अंग को ठीक प्रकार से रखता है; ‘हृदय’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: ἧπαρ
  choice: कलेजा
  rationale: आधुनिक सामान्य हिन्दी में मछली के अंग के लिए ‘कलेजा’ स्वाभाविक है और यूनानी संज्ञा का स्पष्ट अर्थ देता है।
- source_word: ἐκάπνισεν
  choice: उन्हें सुलगाकर धुआँ किया
  rationale: क्रिया धुआँ उत्पन्न करने या धूनी देने की क्रिया बताती है। यह रूप वास्तविक क्रिया को स्पष्ट करता है और अनावश्यक तकनीकी या अनुष्ठानिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: इस दृश्य में यूनानी लघु पाठ और दीर्घ सामी/अन्य पाठ-परंपरा का संबंध
  choice: यूनानी में दी गई क्रिया का ही अनुवाद किया गया है; πορευόμενος को तत्काल विवाह-कक्ष के प्रसंग में ‘भीतर जा रहा था’ समझा गया है।
  alternative: केवल ‘जब वह जा रहा था’ कहना, अथवा दीर्घ पाठ की प्रार्थना-सामग्री जोड़कर पद का विस्तार करना।
  rationale: यूनानी पाठ प्राथमिक आधार है। प्रसंग प्रवेश का संकेत देता है, पर दीर्घ परंपरा की अतिरिक्त प्रार्थना-सामग्री इस पद में जोड़ना मूल यूनानी का अतिक्रमण होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली रखी गई है। ‘रफाएल’ नाम का प्रचलित हिन्दी रूप है। वाक्य-विन्यास को सहज बनाने के लिए यूनानी के लंबे समन्वित वाक्य को दो वाक्यों में बाँटा गया है।
