  verdict: revise
  source_fidelity: 'The draft accurately follows the Greek sequence: Tobiah remembers Raphael''s words, takes the incense ashes, puts the fish''s heart and liver on the ashes, and produces smoke. ‘भीतर जा रहा था’ is an interpretive contextual clarification of πορευόμενος; the footnote appropriately preserves the broader alternative. The final expression ‘उन्हें सुलगाकर धुआँ किया,’ however, is not idiomatic Hindi and makes the action less clear.'
  naturalness: The narrative is otherwise clear and suitably dignified in modern Hindi. ‘धुआँ किया’ is awkward in this construction. ‘उन्हें जलाया, जिससे धुआँ निकला’ is natural and communicates the smoke-producing action without introducing a technical ritual term.
  terminology: ‘धूप की राख,’ ‘मछली का हृदय,’ and ‘कलेजा’ are accurate and understandable. ‘रफाएल’ is retained as the draft’s established form. No doctrinal or harmonizing expansion is introduced.
  issues:
  - severity: medium
    issue: The phrase ‘उन्हें सुलगाकर धुआँ किया’ is idiomatically strained and has an unclear object/action relationship.
    rationale: ἐκάπνισεν describes causing smoke or fumigating by the materials just placed on the ashes. Hindi ‘धुआँ किया’ is not natural here. Recasting it as burning them so that smoke arose gives a clear, ordinary Hindi expression while retaining the physical action and avoiding a stronger ritual interpretation.
