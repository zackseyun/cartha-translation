  text: And Raguel got up[a], went and dug a grave, saying, “Perhaps he too may die.”
translation:
  language: hi
  text: तब रगूएल उठा, गया और उसने एक कब्र खोदी। उसने कहा, “कहीं यह भी न मर जाए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “कहीं ऐसा न हो कि यह भी मर जाए।” यूनानी वाक्य रगूएल की इस आशंका को व्यक्त करता है कि तोबियाह भी पहले के दूल्हों की तरह मर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: उठा
  rationale: यह क्रिया अगले कार्य से पहले रगूएल के उठने की सामान्य कथात्मक क्रिया बताती है; ‘उठा’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: ἐπορεύθη
  choice: गया
  rationale: यूनानी क्रिया का सीधा अर्थ ‘गया’ है। मूल पाठ में ‘बाहर’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ὤρυξεν τάφον
  choice: एक कब्र खोदी
  rationale: ὤρυξεν वास्तविक रूप से खोदने को और τάφον दफनाने की जगह को सूचित करता है; इस प्रसंग में ‘कब्र खोदी’ स्वाभाविक हिन्दी है।
- source_word: Μὴ καὶ οὗτος ἀποθάνῃ
  choice: कहीं यह भी न मर जाए
  rationale: यह हिन्दी संरचना μή के साथ प्रयुक्त संभावनार्थक क्रिया द्वारा व्यक्त भय और अनिश्चित आशंका को स्वाभाविक ढंग से बनाए रखती है; ‘भी’ पिछले दूल्हों जैसी आशंका को व्यक्त करता है।
