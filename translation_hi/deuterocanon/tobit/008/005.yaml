base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/005.yaml
  text: And Tobiah began to say[a], “Blessed are you, O God of our fathers, and blessed is your holy and glorious name forever; may the heavens and all your creation bless you.”
translation:
  language: hi
  text: तब तोबियाह ने कहना शुरू किया, “हे हमारे पूर्वजों के परमेश्वर, आप धन्य हैं; और आपका पवित्र और महिमामय नाम युगानुयुग धन्य है। स्वर्ग और आपकी सारी सृष्टि[a] आपको धन्य कहें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके सभी प्राणी।” यूनानी शब्द का अर्थ परमेश्वर की बनाई हुई सभी वस्तुएँ अथवा सभी सृजित प्राणी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο ... λέγειν
  choice: कहना शुरू किया
  rationale: ἄρχομαι के साथ infinitive आरंभ को व्यक्त करने वाला सामान्य यूनानी प्रयोग है; यह हिन्दी में स्वाभाविक रहते हुए प्रार्थना के आरंभ को स्पष्ट करता है।
- source_word: Εὐλογητὸς
  choice: धन्य हैं
  rationale: परमेश्वर को सीधे संबोधित करने वाले स्तुतिपरक सूत्र में ‘धन्य’ εὐλογητός का प्रतिष्ठित और सटीक हिन्दी समतुल्य है।
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: हे हमारे पूर्वजों के परमेश्वर
  rationale: πατέρων का शाब्दिक अर्थ ‘पितरों’ हो सकता है, पर आधुनिक सामान्य हिन्दी में वंशगत सामूहिक संदर्भ के लिए ‘पूर्वजों’ अधिक स्पष्ट और स्वाभाविक है; सम्बोधन को ‘हे’ से व्यक्त किया गया है।
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔνδοξον
  choice: आपका पवित्र और महिमामय नाम
  rationale: दोनों विशेषण सुरक्षित हैं; ‘पवित्र’ और ‘महिमामय’ आधुनिक गरिमापूर्ण बाइबलीय हिन्दी में स्वाभाविक हैं।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह यूनानी मुहावरे की स्थायी कालावधि को संक्षिप्त, प्रार्थनात्मक और परिचित हिन्दी में व्यक्त करता है।
- source_word: εὐλογησάτωσάν σε
  choice: आपको धन्य कहे
  rationale: आज्ञार्थक रूप यहाँ प्रार्थनात्मक कामना है। ‘धन्य कहे’ हिन्दी में सृष्टि द्वारा परमेश्वर की स्तुति का भाव ‘आशीर्वाद दे’ की संभावित भ्रांति के बिना व्यक्त करता है।
- source_word: οἱ οὐρανοὶ
  choice: स्वर्ग
  rationale: यूनानी बहुवचन है, किन्तु आधुनिक हिन्दी में सामूहिक ब्रह्मांडीय क्षेत्र के लिए ‘स्वर्ग’ अधिक स्वाभाविक है और अर्थ को नहीं घटाता।
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: आपकी सारी सृष्टि
  rationale: κτίσεις बहुवचन में परमेश्वर द्वारा रची सभी वस्तुओं या प्राणियों को व्यापक रूप से समेट सकता है; ‘सारी सृष्टि’ इस व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: πατέρων में पूर्वज-संबंधी भाषा
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों
  rationale: यूनानी शब्द पुल्लिंग है, पर सूत्र में वंशगत पूर्वजों का सामूहिक संकेत है। ‘पूर्वजों’ अर्थ को बिना सांप्रदायिक व्याख्या जोड़े आधुनिक पाठक के लिए स्पष्ट रखता है।
- issue: ब्रह्मांडीय स्तुति में κτίσεις का दायरा
  choice: आपकी सारी सृष्टि
  alternative: आपके सभी प्राणी
  rationale: κτίσεις रचे हुए प्राणियों तक सीमित नहीं होना चाहिए; इसमें समस्त सृजित व्यवस्था का व्यापक संकेत संभव है। पादटिप्पणी वास्तविक शब्दार्थगत विकल्प दर्ज करती है।
- issue: सृष्टि द्वारा परमेश्वर को εὐλογεῖν
  choice: आपको धन्य कहे
  alternative: आपकी स्तुति करे
  rationale: ‘धन्य कहे’ मूल क्रिया की आशीर्वचनात्मक भाषा सुरक्षित रखता है, जबकि इसे परमेश्वर को मनुष्य-सदृश लाभ देने के अर्थ में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के संबोधन में आदरसूचक ‘आप’ प्रयोग हुआ है। अत्यधिक संस्कृतनिष्ठ ‘पितरों’ के स्थान पर सहज ‘पूर्वजों’ चुना गया, जबकि ‘धन्य’ और ‘युगानुयुग’ जैसे परिचित बाइबलीय पद बनाए रखे गए हैं।
