lexical_decisions:
- source_word: πρὶν ἢ συντελεσθῆναι
  choice: पूरे होने से पहले
  rationale: यह काल-संबंधी रचना विवाह-अवधि की समाप्ति से पहले का समय बताती है; हिन्दी में यह स्वाभाविक और स्रोत के निकट है।
- source_word: τὰς ἡμέρας τοῦ γάμου
  choice: विवाह के दिन
  rationale: यह संबंधकारक पदबंध का सीधा अनुवाद है और प्रसंग में निश्चित विवाह-उत्सव अवधि को सहज ढंग से व्यक्त करता है।
- source_word: ἐνόρκως
  choice: शपथपूर्वक
  rationale: क्रिया-विशेषण बताता है कि रगुएल ने यह बात शपथ से बाँधकर कही; औपचारिक परंतु बोधगम्य हिन्दी में ‘शपथपूर्वक’ संक्षिप्त है।
- source_word: μὴ ἐξελθεῖν αὐτόν
  choice: वह विदा न हो
  rationale: अनन्त क्रिया वाला उपवाक्य रगुएल के कथन का आशय देता है। प्रसंग में स्थान छोड़कर जाने के लिए ‘विदा न हो’ स्वाभाविक है।
- source_word: ἐὰν μὴ πληρωθῶσιν
  choice: जब तक ... पूरे न हो जाएँ
  rationale: यूनानी में शाब्दिक रूप से ‘यदि/जब तक पूरे न हों’ का भाव है। हिन्दी में निषेध के साथ ‘जब तक ... न’ शर्त और अवधि—दोनों को स्पष्ट तथा स्वाभाविक रूप से रखता है।
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: विवाह के चौदह दिन
  rationale: अनुवाद संख्या और विवाह-अवधि के संबंध को स्पष्ट रखते हुए यूनानी पाठ के सभी अर्थ-तत्त्व सुरक्षित रखता है।
