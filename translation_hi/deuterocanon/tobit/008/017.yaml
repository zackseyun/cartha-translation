base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/017.yaml
  text: Blessed are you[a], because you have made me rejoice, and it has not happened to me as I suspected; rather, according to your abundant mercy, you have acted with us. Blessed are you, because you have shown mercy to two only children. Show them mercy, Master[c][b]; bring their life to completion in health with gladness and mercy.
translation:
  language: hi
  text: आप धन्य हैं, क्योंकि आपने मुझे आनन्द दिया है। जैसा मुझे अंदेशा था[a], वैसा मेरे साथ नहीं हुआ; बल्कि आपने अपनी अपार दया के अनुसार हमारे साथ व्यवहार किया है। आप धन्य हैं, क्योंकि आपने दो इकलौती सन्तानों[b] पर दया की है। हे स्वामी, उन पर दया कीजिए; उनका जीवन[c] स्वास्थ्य, आनन्द और दया के साथ पूर्ण कीजिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘जैसा मैंने समझा था’ भी हो सकता है। यूनानी क्रिया अनुमान या सन्देह व्यक्त कर सकती है; यहाँ प्रसंग आशंकित अपेक्षा की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दो इकलौती सन्तानें’ का अर्थ है कि इस दम्पति में से प्रत्येक अपने-अपने परिवार की इकलौती सन्तान था।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद ‘उनके जीवन पूरे कीजिए’ या ‘उन्हें अपना जीवन पूरा करने दीजिए’ भी हो सकता है। यूनानी में ‘जीवन’ सामूहिक एकवचन में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: आप धन्य हैं
  rationale: परमेश्वर को सम्बोधित आशीर्वाद-वाक्य का भक्तिपूर्ण और प्रचलित हिन्दी रूप; यह केवल ‘प्रशंसित’ कहने से अधिक निकटता से यूनानी विशेषण की विधा को बनाए रखता है।
- source_word: ηὔφρανάς
  choice: आपने मुझे आनन्दित किया है
  rationale: 'εὐφραίνω का कारक भाव स्पष्ट रखता है: परमेश्वर ने वक्ता को आनन्दित किया।'
- source_word: ὑπενόουν
  choice: मुझे अंदेशा था
  rationale: क्रिया अनुमान या सन्देह दोनों व्यक्त कर सकती है; कथा-सन्दर्भ में ‘अंदेशा’ आशंकित अपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है, पर उसे सीधे ‘भय’ नहीं बनाता।
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: अपनी अपार दया के अनुसार
  rationale: κατά को मानक अथवा अनुरूपता के रूप में और πολὺ ἔλεος को दया की प्रचुरता के रूप में सुरक्षित रखता है।
- source_word: ἐποίησας μεθʼ ἡμῶν
  choice: हमारे साथ व्यवहार किया है
  rationale: शाब्दिक ‘हमारे साथ किया’ हिन्दी में अस्वाभाविक है; ‘व्यवहार किया’ यूनानी मुहावरे की व्यापकता बनाए रखता है और दयापूर्ण कार्य का अनावश्यक विशिष्टीकरण नहीं करता।
- source_word: ἠλέησας
  choice: दया की है
  rationale: ἐλεέω का सीधा, स्वाभाविक रूप और पद में बार-बार आने वाली दया की विषयवस्तु को बनाए रखता है।
- source_word: δύο μονογενεῖς
  choice: दो इकलौती सन्तानों
  rationale: यहाँ μονογενής प्रत्येक व्यक्ति की पारिवारिक स्थिति बताता है; ‘इकलौती सन्तान’ बाद की मसीही धर्मवैज्ञानिक शब्दावली को इस प्रसंग में आयात नहीं करती।
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: परमेश्वर के अधिकारपूर्ण सम्बोधन को स्वाभाविक हिन्दी में व्यक्त करता है और κύριος के सामान्य अनुवाद ‘प्रभु’ से शब्दगत भेद बनाए रखता है।
- source_word: συντέλεσον τὴν ζωὴν αὐτῶν
  choice: उनका जीवन पूरा कीजिए
  rationale: जीवन की अवधि को उसके पूर्ण अन्त तक पहुँचाने की प्रार्थना व्यक्त करता है तथा यूनानी के सामूहिक एकवचन ‘जीवन’ को सुरक्षित रखता है।
- source_word: ἐν ὑγείᾳ
  choice: स्वास्थ्य में
  rationale: शारीरिक कुशलता का निकट और संक्षिप्त रूप।
- source_word: μετὰ εὐφροσύνης καὶ ἐλέους
  choice: आनन्द और दया के साथ
  rationale: आनन्दपूर्ण जीवन और बनी रहने वाली दया—दोनों को समान रूप से बनाए रखता है और ἔλεος की पुनरावृत्ति सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के लिए δέσποτα का अनुवाद
  choice: हे स्वामी
  alternative: हे प्रभु; हे सर्वाधिपति
  rationale: ‘स्वामी’ प्रभुत्व और अधिकार का भाव रखता है तथा δέσποτα को κύριος के सामान्य हिन्दी रूप ‘प्रभु’ में विलीन नहीं करता।
- issue: μονογενεῖς का आशय
  choice: दो इकलौती सन्तानें
  alternative: दो अद्वितीय जन; दो एकलौते जन्मे जन
  rationale: कथा में दोनों अपने-अपने परिवार की इकलौती सन्तान हैं। इसलिए यहाँ पारिवारिक अर्थ उपयुक्त है, न कि कोई तत्त्वमीमांसक या मसीह-विषयक अर्थ।
- issue: τὴν ζωὴν αὐτῶν का सामूहिक एकवचन
  choice: उनका जीवन
  alternative: उनके जीवन; उनकी आयु
  rationale: यूनानी की वास्तविक व्याकरणिक अस्पष्टता और सामूहिक एकवचन को मुख्य पाठ में बनाए रखा गया है; पादटिप्पणी स्वाभाविक बहुवचन सम्भावना बताती है।
