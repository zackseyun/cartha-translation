  yaml_path: translation/deuterocanon/tobit/008/016.yaml
  text: And Raguel blessed God[a], saying, “Blessed are you, O God, with every blessing; and may your holy ones bless you, and all your creatures[c][b]; may all your angels and your chosen ones bless you forever.”
translation:
  language: hi
  text: 'और रगूएल ने परमेश्वर को धन्य कहा: “हे परमेश्वर, आप हर आशीष के साथ धन्य हैं। आपके पवित्र जन और आपकी सारी सृष्टि आपको धन्य कहें; आपके सब स्वर्गदूत और आपके चुने हुए जन सदा आपको धन्य कहें।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλόγησεν / Εὐλογητὸς / εὐλογείτωσάν
  choice: धन्य कहा / स्तुति के योग्य / स्तुति करें
  rationale: मूल में एक ही शब्द-परिवार की पुनरावृत्ति है, पर आधुनिक हिन्दी में परमेश्वर के लिए प्रत्येक स्थान पर ‘आशीष देना’ या ‘धन्य करना’ अस्वाभाविक और भ्रामक होगा। प्रसंगानुसार ‘धन्य कहा’ और ‘स्तुति’ दैवी प्रशंसा का भाव स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: ἐν πάσῃ εὐλογίᾳ
  choice: हर प्रकार की स्तुति के योग्य
  rationale: शाब्दिक ‘हर आशीष में’ हिन्दी में अर्थ स्पष्ट नहीं करता। यह रूप व्यापक और उपासना-संबंधी भाव को सहज रूप से व्यक्त करता है।
- source_word: οἱ ἅγιοί σου
  choice: आपके पवित्र जन
  rationale: ‘पवित्र जन’ मूल का व्यापक अर्थ रखता है और बाद की विशिष्ट कलीसियाई शब्दावली आरोपित नहीं करता।
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: आपकी सारी सृष्टि
  rationale: κτίσεις बहुवचन है, किंतु हिन्दी में सामूहिक ‘सारी सृष्टि’ अधिक स्वाभाविक है और समस्त रची हुई वास्तविकता का व्यापक भाव बनाए रखता है।
- source_word: πάντες οἱ ἄγγελοί σου
  choice: आपके सब स्वर्गदूत
  rationale: ‘स्वर्गदूत’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और प्रतिष्ठित समतुल्य है; πάντες को ‘सब’ से व्यक्त किया गया है।
- source_word: οἱ ἐκλεκτοί σου
  choice: आपके चुने हुए जन
  rationale: यह पारदर्शी आधुनिक हिन्दी है और ‘चुने हुए’ की पहचान या वर्ग को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: उपासना-संबंधी प्रसंग में स्थायी काल का संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ‘पवित्र जन’ और ‘चुने हुए जन’ किन्हें सूचित करते हैं
  choice: दोनों व्यापक पदों को बिना व्याख्यात्मक सीमांकन के रखा गया है।
  alternative: दोनों को केवल स्वर्गीय प्राणी या केवल परमेश्वर के विश्वासयोग्य मनुष्य मानना।
  rationale: यूनानी पाठ इन समूहों की पहचान स्पष्ट नहीं करता और स्वर्गदूतों का अलग उल्लेख करता है; इसलिए मूल की अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में अर्थ स्वाभाविक रहते हुए मूल की अस्पष्टता सुरक्षित है।
