  yaml_path: translation/deuterocanon/tobit/008/007.yaml
  text: And now[a], Lord, I am not taking this my sister because of sexual immorality, but in truth[b]. Command that I may find mercy and that I and she may grow old together.
translation:
  language: hi
  text: और अब,[a] हे प्रभु, मैं अपनी इस बहन को यौन अनैतिकता के कारण नहीं, बल्कि सच्चे मन से ग्रहण कर रहा हूँ। आज्ञा दे कि तू मुझ पर और उस पर दया करे और हम दोनों साथ-साथ वृद्ध हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपनी इस बहन’ इस पुस्तक की निकट महिला संबंधी के लिए प्रयुक्त नातेदारी-भाषा है; इस प्रसंग में वह विवाह के लिए वैध संबंधिनी है। वैकल्पिक रूप से, ‘मेरी इस संबंधिनी’ कहा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: κύριε
  choice: हे प्रभु
  rationale: यह परमेश्वर को प्रार्थना में किया गया सीधा संबोधन है; ‘हे प्रभु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: πορνείαν
  choice: व्यभिचार की कामना
  rationale: πορνεία मूलतः अनुचित यौन आचरण को सूचित करता है; इस वैवाहिक प्रसंग में कारण या प्रेरणा का भाव है। ‘व्यभिचार की कामना’ केवल सामान्य आकर्षण कहने से अधिक स्पष्ट है, यद्यपि ‘अनैतिक यौन इच्छा’ भी संभव है।
- source_word: λαμβάνω
  choice: पत्नी के रूप में ग्रहण कर रहा हूँ
  rationale: क्रिया का शाब्दिक अर्थ ‘लेना/ग्रहण करना’ है, पर यहाँ विवाह का संदर्भ निश्चित है। ‘पत्नी के रूप में’ जोड़ने से हिन्दी में आशय स्पष्ट होता है और ‘ग्रहण’ स्रोत की अभिव्यक्ति को बनाए रखता है।
- source_word: τὴν ἀδελφήν μου ταύτην
  choice: अपनी इस बहन को
  rationale: ‘बहन’ मूल यूनानी के नातेदारी-संबंधी संबोधन को सुरक्षित रखता है; कथा में वह निकट संबंधी और वैध विवाह-संगिनी है।
- source_word: ἐπʼ ἀληθείας
  choice: सच्चे मन से
  rationale: शाब्दिक ‘सत्य में’ हिन्दी में अस्वाभाविक और अस्पष्ट होता। ‘सच्चे मन से’ निष्कपट तथा उचित वैवाहिक अभिप्राय का विरोधात्मक भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπίταξον
  choice: आज्ञा दे
  rationale: यूनानी क्रिया का बल ‘आज्ञा देना/ठहराना’ है; केवल ‘अनुदान दे’ कहने से उसका स्पष्ट आदेशात्मक रूप मंद पड़ जाता।
- source_word: ἐλεῆσαί με καὶ αὐτὴν
  choice: मुझ पर और इस पर दया हो
  rationale: पाठ में दया का संबंध ‘मुझ पर और उस पर’ दोनों से स्वाभाविक रूप से पढ़ा जा सकता है। निष्क्रिय हिन्दी रचना प्रार्थना के आदेशात्मक ढाँचे के साथ सुगम है।
- source_word: συγκαταγηρᾶσαι
  choice: हम दोनों साथ-साथ बूढ़े हों
  rationale: संयुक्त क्रिया का अर्थ साथ मिलकर वृद्ध होना है; यह दीर्घ साझा वैवाहिक जीवन की याचना व्यक्त करती है।
theological_decisions:
- issue: विवाह की प्रार्थना में ‘बहन’ का अर्थ
  choice: मुख्य पाठ में ‘बहन’ को बनाए रखा गया।
  alternative: निकट संबंधिनी / कुटुम्बिनी
  rationale: यूनानी में स्पष्टतः ἀδελφήν है। इसे व्याख्यात्मक शब्द से बदलना कथा की नातेदारी-भाषा को मिटा देता; विवाह का अर्थ ‘पत्नी के रूप में ग्रहण’ से स्पष्ट किया गया है।
- issue: ἐλεῆσαί का कर्ता और याचना की संरचना
  choice: ‘मुझ पर और इस पर दया हो’—दया दोनों के लिए माँगी गई है।
  alternative: ‘मुझे दया मिले, और मैं और यह साथ-साथ बूढ़े हों’
  rationale: यूनानी ἐλεῆσαί με καὶ αὐτὴν को ‘मुझ पर और उस पर दया करने’ के रूप में पढ़ना व्याकरणतः सीधा है; साथ ही अंतिम infinitive संयुक्त वृद्धावस्था की याचना करता है। हिन्दी में दोनों याचनाओं को समांतर रखा गया है।
- issue: πορνείαν का संदर्भगत आशय
  choice: ‘व्यभिचार की कामना’
  alternative: अनैतिक यौनाचार / वासना
  rationale: यह पद विवाह को केवल कामेच्छा से प्रेरित बताने से इनकार करता है, पर मूल शब्द की नैतिक तीक्ष्णता को मात्र ‘वासना’ तक सीमित नहीं करना चाहिए। चुना गया रूप दोनों पक्षों को साथ रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। ‘अपनी इस बहन’ स्रोत की सांस्कृतिक नातेदारी-भाषा को बनाए रखता है, जबकि ‘पत्नी के रूप में’ विवाह-संदर्भ को सामान्य पाठक के लिए स्पष्ट करता है। कोई पादटिप्पणी आवश्यक नहीं रखी गई, इसलिए मुख्य पाठ में पादटिप्पणी-चिह्न नहीं हैं।
