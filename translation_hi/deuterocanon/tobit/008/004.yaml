base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/004.yaml
  text: And when the two of them had been shut in together[a], Tobiah rose from the bed and said, “Get up, sister[b], and let us pray that the Lord may show us mercy.”
translation:
  language: hi
  text: जब उन दोनों को एक साथ भीतर बंद कर दिया गया[a], तब तोबियाह बिछौने से उठा और बोला, “उठो, बहन[b], और आओ हम प्रार्थना करें कि प्रभु हम पर दया करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “जब वे दोनों एक साथ बंद किए गए।” इसका संकेत उस जोड़े को एक साथ कमरे में बंद किए जाने से है।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में संबोधन सचमुच “बहन” है। इस कथा के प्रसंग में तोबियाह अपनी दुल्हन के लिए पारिवारिक संबंध और आत्मीयता की भाषा का प्रयोग करता है।
    reason: cultural_note
lexical_decisions:
- source_word: συνεκλείσθησαν
  choice: एक साथ भीतर बंद कर दिया गया
  rationale: यह अनुवाद यूनानी कर्मवाच्य और दोनों को एक ही कक्ष में बंद किए जाने के भाव को बनाए रखता है।
- source_word: ἀμφότεροι
  choice: उन दोनों
  rationale: यह जोड़े के दोनों व्यक्तियों पर यूनानी बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἀνέστη
  choice: उठा
  rationale: बिछौने से उठने की क्रिया के लिए यह सहज और गरिमापूर्ण हिन्दी है।
- source_word: κλίνης
  choice: बिछौने
  rationale: विवाह-कक्ष के प्रसंग में κλίνη का सामान्य अर्थ सोने का बिछौना है; यह आधुनिक पाठक के लिए स्पष्ट है।
- source_word: Ἀνάστηθι
  choice: उठो
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἀδελφή
  choice: बहन
  rationale: यूनानी संबोधन को व्याख्यात्मक रूप से बदलने के बजाय ज्यों का त्यों सुरक्षित रखा गया है; प्रसंगगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: προσευξώμεθα
  choice: आओ हम प्रार्थना करें
  rationale: प्रथम पुरुष आग्रहसूचक subjunctive को हिन्दी के स्वाभाविक सामूहिक निमंत्रण के रूप में व्यक्त करता है।
- source_word: ἐλεήσῃ
  choice: हम पर दया करे
  rationale: ἐλεέω के दया दिखाने के अर्थ को सरल, प्रचलित धार्मिक हिन्दी में व्यक्त करता है और उद्देश्यवाचक ἵνα की संभाव्यता बनाए रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: κύριος के लिए मानक, गरिमापूर्ण हिन्दी धार्मिक पद।
theological_decisions:
- issue: तोबियाह द्वारा अपनी दुल्हन के लिए ἀδελφή संबोधन
  choice: मुख्य पाठ में शाब्दिक रूप से “बहन”
  alternative: “प्रिय पत्नी” जैसे व्याख्यात्मक संबोधन का प्रयोग करना या संबंधसूचक शब्द हटा देना
  rationale: यूनानी पाठ स्पष्ट रूप से “बहन” कहता है। यह इस कथा में पारिवारिक संबंध और आत्मीयता की भाषा है; असामान्य लगने पर भी इसे बदलना स्रोत की सांस्कृतिक और कथात्मक विशेषता को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। “बिछौना,” “प्रभु,” और “दया करे” सामान्य पाठकों के लिए बोधगम्य हैं, जबकि “बहन” की स्रोतगत असामान्यता को पादटिप्पणी सहित सुरक्षित रखा गया है।
