base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/006.yaml
  text: You made Adam[a], and you gave him Eve as a helper and support, his wife; from these came the seed of mankind. You said, ‘It is not good for the man to be alone[b]; let us make for him a helper like himself.’
translation:
  language: hi
  text: तूने आदम को बनाया, और हव्वा को उसकी पत्नी, सहायक और सहारा के रूप में उसे दिया। उन दोनों से मानव-वंश उत्पन्न हुआ। तूने कहा, “मनुष्य का अकेला रहना अच्छा नहीं है[a]; हम उसके लिए उसके समान एक सहायक बनाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन उत्पत्ति 2:18 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησας
  choice: तूने ... बनाया
  rationale: ποιέω का सीधा और स्वाभाविक अनुवाद; यह κτίζω की अधिक विशिष्ट सृष्टि-संबंधी शब्दावली को अनावश्यक रूप से नहीं जोड़ता।
- source_word: Ἀδάμ
  choice: आदम
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: βοηθὸν ... στήριγμα
  choice: सहायक और सहारा
  rationale: दोनों ग्रीक संज्ञाओं को अलग रखते हुए क्रमशः सहायता और दृढ़ समर्थन का भाव व्यक्त करता है।
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: उसकी पत्नी हव्वा
  rationale: वैवाहिक संदर्भ में γυνή का अर्थ ‘पत्नी’ स्वाभाविक है; हिन्दी वाक्य-विन्यास में इसे हव्वा के साथ जोड़ने से ग्रीक समानाधिकरण स्पष्ट होता है।
- source_word: ἐκ τούτων
  choice: उन दोनों से
  rationale: ग्रीक बहुवचन संकेतवाचक का आशय आदम और हव्वा की जोड़ी है; हिन्दी में ‘उन दोनों’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: τὸ ἀνθρώπων σπέρμα
  choice: मानवजाति की संतान
  rationale: σπέρμα के वंश अथवा संतान के ठोस भाव को बनाए रखता है और ἀνθρώπων को समस्त मानवजाति के अर्थ में व्यक्त करता है।
- source_word: Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον
  choice: मनुष्य का अकेला रहना अच्छा नहीं है
  rationale: उत्पत्ति 2:18 की प्रतिध्वनि बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है; यहाँ ἄνθρωπος संदर्भतः आदम की ओर संकेत करता है, पर सामान्य ‘मनुष्य’ भी मूल की अर्थ-व्याप्ति सुरक्षित रखता है।
- source_word: ποιήσωμεν
  choice: हम ... बनाएँ
  rationale: प्रथम पुरुष बहुवचन विधिलिंग के परामर्शात्मक भाव को सुरक्षित रखता है।
- source_word: ὅμοιον αὐτῷ
  choice: उसी के समान
  rationale: ὅμοιος का सीधा अनुवाद है; इब्रानी पृष्ठभूमि से ‘उसके अनुरूप’ जैसी अधिक व्याख्यात्मक भाषा नहीं जोड़ी गई।
theological_decisions:
- issue: आदम और सामान्य ‘मनुष्य’ के बीच अर्थ-संबंध
  choice: पहले व्यक्तिवाचक ‘आदम’, बाद में मूल के τὸν ἄνθρωπον के लिए ‘मनुष्य’
  alternative: दोनों स्थानों पर ‘आदम’ अथवा दूसरे स्थान पर ‘उस पुरुष’
  rationale: प्रार्थना पहले आदम का नाम लेती है, फिर उत्पत्ति 2:18 की भाषा में ‘मनुष्य’ कहती है। यह रूप व्यक्तिगत संदर्भ और व्यापक मानवीय कथन—दोनों को खुला रखता है।
- issue: उत्पत्ति 2:18 की अंतर्पाठीय प्रतिध्वनि
  choice: ‘अकेला रहना अच्छा नहीं’ और ‘सहायक बनाएँ’ जैसी निकट शब्दावली
  alternative: अधिक सहज पर व्याख्यात्मक पुनर्कथन, जैसे ‘उसे एक संगिनी चाहिए’
  rationale: मूल प्रार्थना सृष्टि-वृत्तांत को स्पष्ट रूप से स्मरण करती है; निकट शब्दावली पाठक को वह संबंध सुनने देती है और लिंग-भूमिका संबंधी अतिरिक्त व्याख्या नहीं जोड़ती।
- issue: τὸ ἀνθρώπων σπέρμα की वंशगत छवि
  choice: मानवजाति की संतान
  alternative: मानवजाति
  rationale: केवल ‘मानवजाति’ कहने से σπέρμα की संतान/वंश वाली छवि मिट जाती; चुना हुआ रूप उसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: प्रार्थना में परमेश्वर के लिए निकट, एकवचन संबोधन ‘तू’ रखा गया है, जो हिन्दी बाइबल और भक्तिपरक भाषा में आदरहीन नहीं बल्कि आत्मीय और गंभीर है। शैली आधुनिक, स्पष्ट और गरिमापूर्ण है। ‘बीज’ की अत्यधिक शाब्दिकता के स्थान पर ‘संतान’ चुना गया है ताकि वंशगत बिंब बना रहे और वाक्य सामान्य पाठकों के लिए सहज हो।
