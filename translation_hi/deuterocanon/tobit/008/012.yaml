  text: And Edna said to his wife, “Send one of the servant girls, and let them see whether he is alive; but if not, so that we may bury him and no one may know.”
translation:
  language: hi
  text: और एदना ने अपनी पत्नी से कहा, “दासियों में से एक को भेजो, और वे जाकर देखें कि वह जीवित है या नहीं।[a] यदि वह जीवित न हो, तो हम उसे दफना दें और किसी को पता न चले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “वे ... देखें” बहुवचन में है, यद्यपि अभी केवल “दासियों में से एक” को भेजने के लिए कहा गया है। अनुवाद ने इसे एकवचन में बदलने के बजाय मूल शब्दावली को बनाए रखा है।
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπόστειλον
  choice: भेजो
  rationale: यह ἀποστέλλω का आज्ञार्थक रूप है; ‘भेजो’ सरल, स्वाभाविक और अर्थ के अनुरूप है।
- source_word: μίαν τῶν παιδισκῶν
  choice: दासियों में से एक को
  rationale: παιδίσκη घर की निम्न-स्थिति वाली स्त्री सेविका या दासी को सूचित करता है। ‘दासी’ उसके लिंग और आश्रित घरेलू पद, दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἰδέτωσαν
  choice: वे जाकर देखें
  rationale: यूनानी पाठ में क्रिया तीसरे पुरुष बहुवचन आज्ञार्थक है। पहले केवल एक दासी भेजने की बात होने पर भी बहुवचन को जानबूझकर सुरक्षित रखा गया है; ‘जाकर’ हिंदी में भेजे जाने और देखने के क्रम को स्वाभाविक बनाता है।
- source_word: εἰ ζῇ
  choice: कि वह जीवित है या नहीं
  rationale: जाँच के प्रसंग में εἰ का स्वाभाविक आधुनिक हिंदी रूप ‘कि ... या नहीं’ है।
- source_word: ἵνα θάψωμεν αὐτόν
  choice: तो हम उसे गाड़ दें
  rationale: ἵνα के साथ प्रयुक्त संभावनार्थक उद्देश्य को हिंदी के ‘तो ... दें’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: μηδεὶς γνῷ
  choice: और किसी को पता न चले
  rationale: यह गोपनीयता के अभिप्राय को दर्शाता है और यूनानी संभावनार्थक भाव को हिंदी निषेधात्मक विधि में बनाए रखता है।
