lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: बाहर जाकर
  rationale: स्त्रीलिंग कर्ता से जुड़ा एओरिस्ट कृदन्त बाहर की ओर जाने के बाद अगली क्रिया करने को दर्शाता है; ‘बाहर जाकर’ आधुनिक हिन्दी में इस क्रम को सहज रूप से व्यक्त करता है।
- source_word: ἀπήγγειλεν
  choice: बताया
  rationale: ἀπαγγέλλω यहाँ प्रतीक्षा कर रहे लोगों को समाचार देने के अर्थ में है। ‘बताया’ स्वाभाविक और स्पष्ट है; ‘सूचना दी’ की अपेक्षा कथा में कम दफ़्तरी लगता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: सम्प्रदान बहुवचन सर्वनाम को हिन्दी में अप्रत्यक्ष कर्म ‘उन्हें’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ὅτι
  choice: कि
  rationale: यह सूचना की विषय-वस्तु आरम्भ करता है, जिसके लिए हिन्दी में ‘कि’ सटीक और स्वाभाविक है।
- source_word: ζῇ
  choice: वह जीवित है
  rationale: ζάω का वर्तमानकालीन रूप शाब्दिक रूप से ‘जीता है/जीवित है’ कहता है। हिन्दी में भूतकालीन ‘बताया’ के बाद भी ‘जीवित है’ स्वाभाविक है और यूनानी वर्तमानकाल को सुरक्षित रखता है; निहित कर्ता प्रसंग में तोबियास है।
