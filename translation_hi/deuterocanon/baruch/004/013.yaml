  text: and they did not know his righteous decrees[a], nor did they walk in the ways of God's commandments[b], nor did they step onto the paths of discipline in his righteousness.
translation:
  language: hi
  text: और वे उसके विधि-विधानों को नहीं जानते थे, न वे परमेश्वर की आज्ञाओं के मार्गों पर चले, और न उन्होंने उसकी धार्मिकता[b] में अनुशासन[a] के पथों पर पाँव रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अनुशासन’ (यूनानी παιδεία) का अनुवाद ‘शिक्षा’ भी हो सकता है; इसमें केवल सुधार नहीं, बल्कि चरित्र गढ़ने वाली शिक्षा और प्रशिक्षण का भाव है।
    reason: lexical_alternative
  - marker: b
    text: ‘धार्मिकता’ का अनुवाद यहाँ ‘न्याय’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιώματα
  choice: विधि-विधान
  rationale: यह शब्द स्थापित नियमों, विधियों या अध्यादेशों को सूचित करता है। ‘विधि-विधान’ इसके नैतिक-कानूनी भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अलग विशेषण जोड़कर δικαι- धातु के भाव को आवश्यकता से अधिक स्पष्ट किए।
- source_word: ἔγνωσαν
  choice: नहीं जाना
  rationale: γινώσκω के सीधे अर्थ ‘जानना’ को बनाए रखता है और इसे केवल बौद्धिक समझ तक सीमित नहीं करता।
- source_word: ἐπορεύθησαν
  choice: चले
  rationale: ‘मार्गों पर चलना’ बाइबलीय नैतिक आचरण का स्वाभाविक और परिचित रूपक है।
- source_word: ὁδοῖς ἐντολῶν θεοῦ
  choice: परमेश्वर की आज्ञाओं के मार्गों पर
  rationale: मूल यूनानी की संबंध-संरचना को सुरक्षित रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: τρίβους
  choice: पथों
  rationale: यह घिसे हुए रास्ते या पगडंडी का बोध देता है; ‘पथ’ पहले आए ‘मार्ग’ से शब्दगत भेद भी बनाए रखता है।
- source_word: παιδίας (παιδεία)
  choice: अनुशासन
  rationale: यह शब्द सुधार, प्रशिक्षण और चरित्र-निर्माण करने वाली शिक्षा—इन सबका भाव रखता है। ‘अनुशासन’ इस नैतिक प्रशिक्षण को संक्षेप में व्यक्त करता है; ‘शिक्षा’ भी संभव है।
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: उसकी धार्मिकता में
  rationale: यूनानी की संक्षिप्त और कुछ हद तक अस्पष्ट रचना को निकटता से सुरक्षित रखता है। ‘धार्मिकता’ नैतिक और वाचागत भाव व्यक्त करती है, जबकि ‘न्याय’ भी संदर्भतः संभव है।
- source_word: ἐπέβησαν
  choice: कदम रखा
  rationale: ἐπιβαίνω के ठोस चित्र—किसी मार्ग पर पाँव रखने—को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यह प्रसंग मुख्यतः परमेश्वर की आज्ञाओं और चरित्र-निर्माणकारी अनुशासन से जुड़ा है; इसलिए ‘धार्मिकता’ नैतिक-धार्मिक अर्थ को व्यापक रूप से सुरक्षित रखती है। फिर भी यूनानी शब्द न्याय का भाव भी रख सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: αὐτοῦ का संदर्भ
  choice: उसकी
  alternative: परमेश्वर की
  rationale: सर्वनाम को मूल के समान रखा गया है। निकट संदर्भ में इसका संकेत परमेश्वर की ओर है, पर अनुवाद में संज्ञा दोहराकर मूल की सर्वनामिक अभिव्यक्ति को अनावश्यक रूप से स्पष्ट नहीं किया गया।
