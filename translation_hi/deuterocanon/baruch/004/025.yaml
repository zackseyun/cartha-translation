  choice: उनकी गर्दनों पर पाँव रखोगे
  rationale: पराजित शत्रुओं पर विजय के ठोस शारीरिक रूपक को बिना सामान्यीकृत किए बनाए रखता है।
theological_decisions:
- issue: लोगों के दुःख में परमेश्वर की भूमिका
  choice: क्रोध को स्पष्टतः ‘परमेश्वर की ओर से’ आया हुआ कहा गया
  alternative: इसे केवल ‘तुम पर आया क्रोध’ या व्याख्यात्मक रूप से ‘दण्ड’ कहना
  rationale: यूनानी पाठ परमेश्वर को स्रोत के रूप में स्पष्ट करता है; अनुवाद इस कठिन धार्मिक तनाव को न तो हटाता है, न ‘दण्ड’ कहकर उसकी व्याख्या तय करता है।
- issue: शत्रुओं पर विजय की हिंसक विजय-छवि
  choice: ‘उनकी गर्दनों पर पाँव रखोगे’ रूपक ज्यों का त्यों रखा गया
  alternative: ‘उन पर विजय पाओगे’ या ‘उन्हें अधीन करोगे’
  rationale: मूल पाठ का ठोस विजय-रूपक सामान्य भावार्थ में बदल देने से उसकी शक्ति कम हो जाती।
- issue: शत्रु के लिए एकवचन से बहुवचन में परिवर्तन
  choice: ‘उसका विनाश’ और ‘उनकी गर्दनों’ के रूप में संख्या-परिवर्तन सुरक्षित रखा गया
  alternative: दोनों वाक्यांशों को केवल एकवचन या केवल बहुवचन में समतल करना
  rationale: मूल में αὐτοῦ एकवचन और αὐτῶν बहुवचन है; यह शत्रु को एक विरोधी और सामूहिक शक्ति दोनों रूपों में प्रस्तुत कर सकता है, इसलिए अस्पष्टता बनाए रखी गई।
