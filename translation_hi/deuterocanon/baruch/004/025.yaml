  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सीधा रूप अपनाया गया है। ‘हे बच्चो’ सम्बोधन की ऊष्मा रखता है; ‘क्रोध’, ‘विनाश’ और ‘गर्दनों पर पाँव’ मूल की कठोरता और धार्मिक तनाव को नरम नहीं करते।
