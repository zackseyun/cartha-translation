  yaml_path: translation/deuterocanon/baruch/004/025.yaml
  text: Children[a], endure patiently the wrath that has come upon you from God. The enemy pursued you, but you will soon see his destruction, and you will step upon their necks.
translation:
  language: hi
  text: हे बच्चो,[a] जो क्रोध परमेश्वर की ओर से तुम पर आया है, उसे धीरज से सहो। शत्रु ने तुम्हारा पीछा किया, पर तुम शीघ्र ही उसका विनाश देखोगे और उनकी गर्दनों पर पाँव रखोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में आगे ‘उसका विनाश’ और फिर ‘उनकी गर्दनों’ कहा गया है। शत्रु के उल्लेख में एकवचन से बहुवचन का यह परिवर्तन संभवतः उसे एक विरोधी और एक सामूहिक शक्ति—दोनों रूपों में प्रस्तुत करता है।
    reason: मूल पाठ में शत्रु के लिए एकवचन αὐτοῦ से बहुवचन αὐτῶν में वास्तविक परिवर्तन है। मुख्य पाठ में यह परिवर्तन बनाए रखा गया है और यहाँ उसे स्पष्ट किया गया है।
