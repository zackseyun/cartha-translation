lexical_decisions:
- source_word: οἱ τρυφεροί μου
  choice: मेरे सुख-सुविधा में पले बच्चे
  rationale: τρυφερός कोमलता और आराम में पले होने का भाव देता है। विलाप के संदर्भ में यह उनकी पहले की सुखद दशा और अब की कठिनाई के बीच विरोध उभारता है। संदर्भ में वक्ता अपनी संतान के विषय में बोलती है, इसलिए ‘बच्चे’ स्वाभाविक है।
- source_word: ἐπορεύθησαν
  choice: चले गए
  rationale: πορεύομαι का सामान्य अर्थ जाना या यात्रा करना है। ‘ऊबड़-खाबड़ मार्गों पर चले गए’ हिन्दी में स्वाभाविक है और निर्वासन की दिशा को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: ὁδοὺς τραχείας
  choice: ऊबड़-खाबड़ मार्गों
  rationale: ὁδός ठोस रूप से मार्ग और τραχύς खुरदरा, दुर्गम या ऊबड़-खाबड़ दर्शाता है। यह चयन कठिन यात्रा की दृश्यात्मकता बनाए रखता है।
- source_word: ἤρθησαν
  choice: उठा ले जाए गए
  rationale: αἴρω का निष्क्रिय रूप यहाँ शत्रुओं द्वारा बलपूर्वक दूर ले जाए जाने का अर्थ देता है। यह यूनानी क्रिया की मूल छवि और बंदी बनाकर ले जाने के संदर्भ—दोनों को बनाए रखता है।
- source_word: ὡς ποίμνιον
  choice: जैसे ... झुंड
  rationale: ποίμνιον का अर्थ पशुओं, विशेषकर भेड़ों, का झुंड है। ‘झुंड’ सरल और स्वाभाविक है; ‘छोटा झुंड’ लघुता के भाव को आवश्यकता से अधिक उभारता।
- source_word: ἡρπασμένον
  choice: लूट लिया जाता है
  rationale: ἁρπάζω अचानक और बलपूर्वक छीन लेने या लूट ले जाने को व्यक्त करता है। पशु-झुंड के साथ हिन्दी में ‘झुंड लूट लेना’ स्वाभाविक है और हिंसक हरण का भाव रखता है।
- source_word: ὑπὸ ἐχθρῶν
  choice: शत्रुओं द्वारा
  rationale: ἐχθρῶν बहुवचन है; ‘शत्रुओं’ उसी संख्या को बनाए रखता है और किसी एक विशिष्ट शत्रु की पहचान नहीं जोड़ता।
theological_decisions:
- issue: झुंड के रूपक का आशय
  choice: वक्ता के बच्चों या लोगों को असहाय जन के रूप में दिखाया गया है, जिन्हें शत्रु बलपूर्वक ले गए।
  alternative: चित्र को केवल सामान्य दुःख का रूपक माना जा सकता है, बिना बंदी बनाकर ले जाए जाने पर बल दिए।
  rationale: यूनानी पाठ स्पष्ट रूप से उपमा देता है और शत्रुओं द्वारा झुंड के हरण की छवि रखता है। अनुवाद उस छवि को बनाए रखता है, पर उसे किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या में नहीं बदलता।
