  rationale: ‘परमेश्वर की आज्ञाओं’ के समानांतर आने के कारण यहाँ बाध्यकारी दैवी विधान का अर्थ प्रमुख है। ‘व्यवस्था’ हिन्दी बाइबिलीय प्रयोग में इस अर्थ को गरिमा और स्पष्टता से रखती है।
