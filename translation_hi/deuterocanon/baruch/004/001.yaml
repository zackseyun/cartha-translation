  yaml_path: translation/deuterocanon/baruch/004/001.yaml
  text: This is the book of the commandments of God[a], and the law that endures forever; all who hold fast to it are for life, but those who forsake it will die.
translation:
  language: hi
  text: यह परमेश्वर की आज्ञाओं की पुस्तक और सदा बनी रहने वाली व्यवस्था है। जो इसे थामे रहते हैं, उनके लिए जीवन है[a]; पर जो इसे छोड़ देते हैं, वे मर जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो इसे थामे रहते हैं, वे जीवित रहेंगे।” यूनानी में शाब्दिक अभिव्यक्ति “जो इसे थामे रहते हैं, जीवन के लिए” है; यह एक संक्षिप्त वाक्यांश है, जिसका विरोध “जो इसे छोड़ देते हैं, वे मर जाएँगे” से है।
    reason: मूल यूनानी की संक्षिप्त, क्रियारहित अभिव्यक्ति और उसके सम्भव स्पष्ट अनुवाद को बताना।
