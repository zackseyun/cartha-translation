theological_decisions:
- issue: ὁ αἰώνιος का ईश्वरीय संबोधन
  choice: सनातन परमेश्वर
  alternative: सनातन जन; अनन्तकालीन परमेश्वर
  rationale: यूनानी पाठ व्यक्तिगत नाम के बजाय ईश्वर की सनातनता दर्शाने वाली उपाधि देता है। चुना हुआ रूप उसका धार्मिक भार और सहज बोध दोनों बनाए रखता है।
