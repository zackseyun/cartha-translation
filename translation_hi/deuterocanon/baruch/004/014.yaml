  rationale: स्त्रीलिंग बहुवचन और सिय्योन से जुड़े आह्वान के कारण आसपास रहने वाली स्त्रियाँ संदर्भ में उपयुक्त हैं; मूल शब्द की ‘प्रवासी/परदेशी निवासी’ वाली वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: ἐπήγαγεν में दैवी कर्तृत्व
  choice: जिसे सनातन परमेश्वर ने उन पर आने दिया
  alternative: जिसे सनातन परमेश्वर उन पर लाया
  rationale: मूल पाठ विपत्ति का कर्ता ईश्वर को बताता है। हिन्दी का चुना रूप इस संबंध को बनाए रखता है, पर ‘दंडित किया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘पड़ोसिनें’ स्त्रीलिंग बहुवचन को स्वाभाविक रूप से व्यक्त करता है। मूल की पुनरुक्ति जानबूझकर रखी गई है और अर्थगत अस्पष्टता पादटिप्पणी में दी गई है।
