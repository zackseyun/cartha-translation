  text: सिय्योन की पड़ोसिनें आएँ[a], पड़ोसिनें आएँ[b], और मेरे बेटों और बेटियों को बंदी बनाए जाने को स्मरण करें, जिसे सनातन परमेश्वर ने उन पर लाया।
