- source_word: τῶν υἱῶν μου καὶ θυγατέρων
  choice: मेरे बेटे-बेटियों की
  rationale: यूनानी में पुत्रों और पुत्रियों दोनों का स्पष्ट उल्लेख है, जिसे सामूहिक ‘बच्चों’ में नहीं समेटा गया।
- source_word: ὁ αἰώνιος
  choice: सनातन परमेश्वर
  rationale: मूल में प्रयुक्त substantival divine epithet ‘सनातन’ का सम्मानजनक और स्पष्ट हिन्दी रूप; ‘परमेश्वर’ जोड़ने से संदर्भित सत्ता साफ होती है, बिना किसी विशिष्ट नाम को आयात किए।
