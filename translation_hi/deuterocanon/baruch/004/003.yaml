lexical_decisions:
- source_word: μὴ δῷς
  choice: न देना
  rationale: μή के साथ aorist subjunctive यहाँ सीधे निषेध को व्यक्त करता है। हिंदी में ‘न देना’ संक्षिप्त और स्वाभाविक है तथा ‘सौंप देना’ जैसे अधिक व्याख्यात्मक अर्थ से बचता है।
- source_word: ἑτέρῳ
  choice: किसी दूसरे को
  rationale: ἕτερος का सामान्य अर्थ ‘दूसरा’ या ‘भिन्न’ है। ‘किसी दूसरे को’ यूनानी की संक्षिप्तता और विरोध को बनाए रखता है।
- source_word: τὴν δόξαν σου
  choice: अपनी महिमा
  rationale: δόξα में महिमा, सम्मान या प्रतिष्ठा के अर्थ हो सकते हैं। ‘महिमा’ इसकी ऊँची और व्यापक अनुगूँज को बनाए रखती है, जबकि विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: τὰ συμφέροντά σοι
  choice: जो तुम्हारे हित में है
  rationale: नपुंसकलिंग बहुवचन τὰ συμφέροντα और σοι उन बातों को दर्शाते हैं जो संबोधित व्यक्ति या समुदाय के लिए लाभकारी हैं। सामूहिक अर्थ के बावजूद हिंदी में एकवचन-सदृश ‘जो ... है’ स्वाभाविक रूप से इस व्यापक समष्टि को व्यक्त करता है।
- source_word: ἔθνει ἀλλοτρίῳ
  choice: किसी पराए राष्ट्र को
  rationale: ἔθνος के लिए ‘राष्ट्र’ उपयुक्त है, और ἀλλότριος ऐसे राष्ट्र को दर्शाता है जो अपना नहीं है। ‘पराया’ इस संबंधपरक परकीयता को ‘विदेशी’ की अपेक्षा अधिक स्पष्ट रखता है।
theological_decisions:
- issue: ‘अपनी महिमा’ का संदर्भगत अर्थ
  choice: व्यापक ‘अपनी महिमा’ को बनाए रखना
  alternative: अपना सम्मान; परमेश्वर से मिली महिमा; अपनी वाचा-संबंधी विशेषता
  rationale: यूनानी पद स्वयं इसका संदर्भ निश्चित नहीं करता। ‘महिमा’ अर्थ को किसी एक धर्मवैचारिक व्याख्या तक सीमित किए बिना उसकी व्यापकता बनाए रखती है।
- issue: τὰ συμφέροντά σοι का अर्थ
  choice: जो तुम्हारे हित में है
  alternative: तुम्हारा कल्याण; तुम्हारे लाभ; जो तुम्हारे लिए लाभकारी है
  rationale: यह अभिव्यक्ति व्यापक है। सामान्य अनुवाद व्यावहारिक, सामुदायिक और वाचा-संबंधी संभावित अनुगूँजों को खुला रखता है।
