lexical_decisions:
- source_word: παρωξύνατε
  choice: क्रोधित किया
  rationale: यह क्रिया किसी को उकसाकर रोष दिलाने का भाव रखती है। इस मूर्तिपूजक बलिदान के प्रसंग में ‘क्रोधित किया’ स्वाभाविक हिन्दी है और परिणाम को आवश्यकता से अधिक विस्तृत नहीं करती।
- source_word: τὸν ποιήσαντα ὑμᾶς
  choice: अपने बनानेवाले को
  rationale: संज्ञा-सदृश कृदन्त का अर्थ ‘जिसने तुम्हें बनाया’ है। ‘अपने बनानेवाले’ से यूनानी संरचना का संबंध बना रहता है और हिन्दी संक्षिप्त व सहज रहती है।
- source_word: θύσαντες
  choice: बलि चढ़ाकर
  rationale: अओरिस्ट कृदन्त यहाँ मुख्य क्रिया के साधन या रीति को बताता है—उन्होंने बनानेवाले को कैसे क्रोधित किया। ‘बलि चढ़ाकर’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δαιμονίοις
  choice: दुष्टात्माओं को
  rationale: यहूदी-यूनानी शास्त्रीय प्रयोग में, विशेषकर बलिदान के संदर्भ में, शब्द परमेश्वर के विरोधी आत्मिक प्राणियों को सूचित करता है। आधुनिक हिन्दी में ‘दुष्टात्माओं’ इस नकारात्मक आत्मिक अर्थ को स्पष्ट करता है।
- source_word: καὶ οὐ θεῷ
  choice: परमेश्वर को नहीं
  rationale: θεῷ और δαιμονίοις दोनों संप्रदान कारक में हैं और बलि पानेवाले को बताते हैं। ‘परमेश्वर को नहीं’ उसी प्रत्यक्ष विरोध को बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजक बलिदान के संदर्भ में δαιμονίοις का आशय
  choice: दुष्टात्माओं
  alternative: देवताओं / आत्मिक शक्तियों
  rationale: मूल पाठ बलिदान को केवल निर्जीव मूर्तियों से नहीं, परमेश्वर के विरोधी आत्मिक प्राणियों से जोड़ता है। ‘दुष्टात्माओं’ इस धार्मिक भार को बनाए रखता है, जबकि ‘देवताओं’ से उनकी वैध दिव्यता का भ्रम हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘बलि चढ़ाकर’ प्रचलित धार्मिक अभिव्यक्ति है; वाक्यक्रम ने δαιμονίοις καὶ οὐ θεῷ के स्पष्ट विरोध को सुरक्षित रखा है।
