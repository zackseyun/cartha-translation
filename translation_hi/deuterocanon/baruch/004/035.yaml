  choice: सनातन
  alternative: अनन्त; सनातन परमेश्वर
  rationale: मूल यूनानी में परमेश्वर के लिए कोई स्पष्ट संज्ञा नहीं, बल्कि संज्ञा के रूप में प्रयुक्त विशेषण है। ‘सनातन’ उपाधि का स्वरूप और ईश्वरीय संकेत बनाए रखता है, जबकि ‘परमेश्वर’ जोड़ने से बचता है।
