  to: कोई मेरी दुर्दशा पर हर्षित न हो—मैं विधवा हूँ और बहुतों से छोड़ी गई हूँ। मैं अपनी सन्तानों के पापों के कारण उजाड़ हो गई हूँ, क्योंकि वे परमेश्वर की व्यवस्था से भटक गए।
