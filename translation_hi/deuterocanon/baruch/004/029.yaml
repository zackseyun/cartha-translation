  rationale: κακά यहाँ प्रसंगानुसार दुखद संकटों या आपदाओं को सूचित करता है। ‘विपत्तियाँ’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक ‘बुराइयों’ का अनावश्यक अर्थ आरोपित नहीं करता।
- source_word: τὴν αἰώνιον εὐφροσύνην
  choice: अनन्त आनन्द
  rationale: αἰώνιον की स्थायी, कभी समाप्त न होने वाली अवधि और εὐφροσύνη के हर्षपूर्ण आनन्द—दोनों को सहज तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: μετὰ τῆς σωτηρίας ὑμῶν
  choice: तुम्हारे उद्धार के साथ
  rationale: μετά की सहवर्तिता को ‘के साथ’ से सीधे रखा गया है। σωτηρία के धार्मिक और पुनर्स्थापनात्मक अर्थ को ‘उद्धार’ सुरक्षित रखता है।
