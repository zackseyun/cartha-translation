translation:
  language: hi
  text: तुम्हें राष्ट्रों के हाथ बेचा गया, विनाश के लिए नहीं; बल्कि क्योंकि तुमने परमेश्वर को क्रोधित किया, तुम्हें अपने विरोधियों के हाथ सौंप दिया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθητε
  choice: तुम्हें ... बेचा गया था
  rationale: अओरिस्ट कर्मवाच्य का अर्थ सुरक्षित रखते हुए विदेशी शक्तियों के अधीन किए जाने की बिक्री-संबंधी उपमा को ज्यों का त्यों रखा गया है।
- source_word: τοῖς ἔθνεσιν
  choice: राष्ट्रों के हाथ
  rationale: यहाँ ἔθνη निर्वासन के संदर्भ में विदेशी राष्ट्रों को सूचित करता है। ‘राष्ट्रों’ आधुनिक और धर्म-सांप्रदायिक भार से मुक्त है; ‘के हाथ’ स्वाभाविक हिन्दी में उनके अधिकार में जाने का भाव देता है।
- source_word: οὐκ εἰς ἀπώλειαν
  choice: पर विनाश के लिए नहीं
  rationale: εἰς के प्रयोजन/परिणाम के भाव तथा ἀπώλεια के विनाशार्थ को सुरक्षित रखा गया है, बिना इसे अनिवार्य रूप से ‘समूल नाश’ तक सीमित किए।
- source_word: διὰ δὲ τὸ παροργίσαι
  choice: बल्कि इसलिए कि तुमने ... को क्रोध दिलाया
  rationale: διά के साथ प्रयुक्त सविशेष infinitive का कारणार्थ ‘इसलिए कि’ से व्यक्त किया गया है। ‘क्रोध दिलाया’ παροργίζω के उकसाकर क्रोधित करने के भाव को सहज हिन्दी में रखता है।
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: इस यहूदी धर्मग्रंथीय संदर्भ में निश्चित θεός के लिए गरिमापूर्ण और प्रचलित हिन्दी पर्याय चुना गया है।
- source_word: παρεδόθητε
  choice: तुम्हें ... सौंप दिया गया
  rationale: कर्मवाच्य παραδίδωμι का दूसरे की सत्ता में दे दिए जाने वाला भाव स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: τοῖς ὑπεναντίοις
  choice: तुम्हारे विरोधियों के हाथ
  rationale: ὑπεναντίος उन लोगों को दर्शाता है जो किसी के विरुद्ध खड़े हैं। ‘विरोधियों’ मूल की व्यापकता को ‘शत्रुओं’ की अपेक्षा अधिक ठीक रखता है।
theological_decisions:
- issue: इस्राएल के निर्वासन और दंड का स्वरूप
  choice: राष्ट्रों के अधीन बेचा जाना विनाश के लिए नहीं था; परमेश्वर को क्रोध दिलाने के कारण उन्हें विरोधियों के हाथ सौंपा गया।
  alternative: इसे अंतिम विनाश के बजाय स्पष्ट रूप से सुधारात्मक अनुशासन कहा जा सकता था।
  rationale: यूनानी पाठ विनाश का निषेध और परमेश्वर को क्रोध दिलाने का कारण स्पष्ट करता है, पर दंड को स्वयं ‘सुधारात्मक’ नहीं कहता। इसलिए अनकही doctrinal व्याख्या जोड़े बिना मूल तनाव रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और साधारण पाठकों के लिए सहज रखी गई है। ‘बेचा गया’ और ‘सौंप दिया गया’ की समानांतर कर्मवाच्य रचना मूल के दो भिन्न यूनानी क्रियापदों को अलग रखते हुए पद की लय और न्याय-संबंधी गंभीरता बनाए रखती है।
