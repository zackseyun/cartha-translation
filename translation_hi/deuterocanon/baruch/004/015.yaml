  text: क्योंकि वह उनके विरुद्ध दूर से एक राष्ट्र ले आया—एक निर्लज्ज और अन्य भाषा बोलने वाला राष्ट्र[a], जिसने वृद्ध व्यक्ति का आदर नहीं किया और बच्चे पर दया नहीं की[b],
