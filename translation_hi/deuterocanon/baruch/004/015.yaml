    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπήγαγεν ἐπʼ αὐτούς
  choice: वह उन पर ... ले आया
  rationale: ἐπάγω के साथ ἐπʼ αὐτούς किसी आक्रमणकारी शक्ति को उनके विरुद्ध या उन पर ले आने का भाव देता है। हिंदी में यह वाक्य-विन्यास कारणात्मक और शत्रुतापूर्ण दोनों अर्थ बनाए रखता है।
- source_word: ἔθνος μακρόθεν
  choice: दूर से एक राष्ट्र
  rationale: ἔθνος को ‘राष्ट्र’ और μακρόθεν को ‘दूर से’ कहना मूल की पुनरावृत्ति और भौगोलिक दूरी को संक्षिप्त रूप से सुरक्षित रखता है।
- source_word: ἀναιδές
  choice: निर्लज्ज
  rationale: शब्द का मूल भाव लज्जा या संकोच का अभाव है। ‘निर्लज्ज’ ‘क्रूर’ की अपेक्षा अधिक शब्द-सटीक है और आगे वर्णित निर्दय व्यवहार से भी मेल खाता है।
- source_word: ἀλλόγλωσσον
  choice: दूसरी भाषा बोलने वाला
  rationale: यह संयुक्त शब्द किसी अन्य या विदेशी भाषा बोलने का संकेत देता है। यह अनुवाद आधुनिक हिंदी में स्वाभाविक है और उसे केवल जातीय ‘विदेशी’ अर्थ तक सीमित नहीं करता।
- source_word: οὐκ ᾐσχύνθησαν πρεσβύτην
  choice: बूढ़े व्यक्ति का आदर नहीं किया
  rationale: यहाँ αἰσχύνομαι वृद्ध के प्रति संकोचपूर्ण सम्मान या लिहाज़ रखने का सामाजिक भाव व्यक्त करता है। ‘आदर नहीं किया’ केवल भीतरी शर्म की अपेक्षा प्रसंग को अधिक स्पष्ट करता है।
- source_word: οὐδὲ παιδίον ἠλέησαν
  choice: और बच्चे पर दया नहीं की
  rationale: ἐλεέω का सीधा अर्थ दया या करुणा करना है। ‘बच्चे पर दया नहीं की’ समानांतर वाक्य-रचना और मूल की तीव्रता बनाए रखता है।
theological_decisions:
- issue: असहाय व्यक्तियों के लिए प्रतिनिधिक एकवचन
  choice: बूढ़े व्यक्ति ... बच्चे
  alternative: बूढ़ों ... बच्चों; वृद्ध ... शिशु
  rationale: यूनानी पाठ πρεσβύτην और παιδίον दोनों को एकवचन में रखता है। एकवचन बनाए रखने से प्रतिनिधिक अलंकार सुरक्षित रहता है; साथ ही παιδίον केवल शिशु तक सीमित नहीं है।
- issue: आक्रमणकारी राष्ट्र के कर्ता-संबंधी सर्वनाम का निहित अर्थ
  choice: जिसने
  alternative: जिन्होंने
  rationale: ἔθνος व्याकरणतः नपुंसकलिंग एकवचन है और उसके बाद बहुवचन क्रियाएँ आती हैं, जिनमें राष्ट्र के लोगों का सामूहिक भाव है। हिंदी में ‘जिसने’ निकटवर्ती एकवचन ‘राष्ट्र’ से सहज संबंध रखता है, जबकि सामूहिक अर्थ संदर्भ से बना रहता है।
