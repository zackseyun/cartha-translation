- from: क्योंकि मैंने तुम्हें शोक और रोते हुए विदा किया था, पर परमेश्वर तुम्हें आनन्द और हर्ष के साथ सदा के लिए मुझे लौटा देगा।
  to: क्योंकि मैंने तुम्हें शोक और विलाप के साथ विदा किया था, पर परमेश्वर तुम्हें आनन्द और हर्ष के साथ सदा के लिए मुझे लौटा देगा।
  rationale: The sole revision replaces the nonparallel participial phrase ‘रोते हुए’ with the noun ‘विलाप,’ preserving the Greek noun pair μετὰ πένθους καὶ κλαυθμοῦ in fluent, dignified Hindi. All other elements are retained, including the explicit ‘मुझे’ for μοι and the permanent sense of εἰς τὸν αἰῶνα.
