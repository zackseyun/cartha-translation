  text: For I sent you out with mourning and weeping[a], but God will give you back to me with joy and gladness forever.
translation:
  language: hi
  text: क्योंकि मैंने तुम्हें शोक और विलाप के साथ विदा किया था, पर परमेश्वर तुम्हें आनन्द और हर्ष के साथ सदा के लिए मुझे लौटा देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέπεμψα
  choice: मैंने ... विदा किया
  rationale: ἐκπέμπω का अर्थ बाहर या दूर भेजना है। प्रसंग में माता के रूप में यरूशलेम अपने निर्वासित बच्चों से बोलती है; ‘विदा किया’ अलगाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह संकेत दिए कि उसने अपनी इच्छा से उन्हें निकाला।
- source_word: μετὰ πένθους καὶ κλαυθμοῦ
  choice: शोक और रोते हुए
  rationale: πένθος शोक और κλαυθμός रोने या विलाप को दर्शाता है। यह अभिव्यक्ति दोनों भावों को अलग रखते हुए सहज हिन्दी देती है।
- source_word: ἀποδώσει ... μοι
  choice: मुझे लौटा देगा
  rationale: ἀποδίδωμι यहाँ वापस देने या लौटाने के अर्थ में है, और μοι स्पष्टतः ‘मुझे’ है। यह अनुवाद मातृरूप यरूशलेम के साथ संबंधपरक भाव को बनाए रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: यहाँ सामान्य ईश्वरीय संज्ञा है, कोई विशिष्ट वाचा-नाम नहीं। ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय गद्य में स्पष्ट और गरिमापूर्ण है।
- source_word: μετὰ χαρμοσύνης καὶ εὐφροσύνης
  choice: आनन्द और हर्ष के साथ
  rationale: दोनों यूनानी संज्ञाएँ निकटार्थी होते हुए भी मिलकर भाव की तीव्रता बढ़ाती हैं। दो हिन्दी शब्द इस युग्म को बनाए रखते हैं।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: इस प्रसंग में यह वाक्यांश स्थायी और निरंतर दशा का अर्थ देता है; ‘सदा के लिए’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: वक्ता और संबंधपरक रूपरेखा
  choice: मातृरूप यरूशलेम प्रथम पुरुष में कहती है कि परमेश्वर उसके बच्चों को ‘मुझे’ लौटा देगा।
  alternative: ‘परमेश्वर तुम्हें पुनःस्थापित करेगा’ जैसा निरपेक्ष अनुवाद।
  rationale: यूनानी μοι को स्पष्ट रूप से बनाए रखना आवश्यक है। आसपास के प्रसंग में यरूशलेम माता के रूप में व्यक्त है; इसलिए ‘मुझे लौटा देगा’ पारिवारिक और सामुदायिक रूपक को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली। ‘आनन्द’ और ‘हर्ष’ का युग्म मूल के दो निकटार्थी शब्दों को बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि ‘मुझे लौटा देगा’ यूनानी ἀποδώσει ... μοι का स्पष्ट अर्थ सीधे मुख्य पाठ में देता है।
