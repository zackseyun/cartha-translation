translation:
  language: hi
  text: और मैं उसके बहुत-से लोगों का उल्लास दूर कर दूँगा[a], और उसके अभिमान को शोक में बदल दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी बड़ी भीड़ का उल्लास।” यूनानी पदबंध उसकी बड़ी जनसंख्या को या उस जनसंख्या से उत्पन्न उल्लास को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके दर्प को शोक में” अथवा “उसके वैभव को शोक में।” यूनानी शब्द अभिमान के साथ-साथ गर्वपूर्ण प्रदर्शन या वैभव का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελῶ
  choice: दूर कर दूँगा
  rationale: περιαιρέω के भविष्यत्काल रूप का अर्थ हटाना या ले लेना है। ‘दूर कर दूँगा’ परमेश्वर की सीधी कार्रवाई को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀγαλλίαμα
  choice: उल्लास
  rationale: यह शब्द अत्यधिक आनन्द और हर्षोल्लास को दर्शाता है। ‘उल्लास’ संक्षिप्त, गरिमापूर्ण और वर्तमान हिन्दी में सहज है।
- source_word: τῆς πολυοχλίας
  choice: उसके बहुत-से लोगों का
  rationale: πολυοχλία बड़ी जनसंख्या, भारी भीड़ या बहुत-से लोगों को सूचित कर सकता है। यह चयन नगर के उल्लास को उसके बहुत-से निवासियों से जोड़ता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: ἀγαυρίαμα
  choice: अभिमान
  rationale: यह संज्ञा गर्व, दर्प या गर्वपूर्ण वैभव का बोध करा सकती है। ‘अभिमान’ मूल की आत्म-उन्नति की भावना को रखता है और ‘घमंड’ की अपेक्षा अर्थ-सीमा को कुछ अधिक खुला छोड़ता है।
- source_word: εἰς πένθος
  choice: शोक में
  rationale: εἰς यहाँ परिणति या परिवर्तन को दर्शाता है। ‘शोक में बदल दूँगा’ हिन्दी में स्पष्ट रूप से उसी परिणाम को व्यक्त करता है।
theological_decisions:
- issue: दूसरे उपवाक्य में क्रिया का लोप
  choice: हिन्दी में निहित क्रिया को ‘बदल दूँगा’ के रूप में स्पष्ट किया गया।
  alternative: 'यूनानी की संक्षिप्त रचना के निकट रहते हुए कहना: ‘और उसके अभिमान को शोक में।’'
  rationale: यूनानी में दूसरी क्रिया समानांतरता के कारण समझी जाती है। हिन्दी में उसे न देने पर वाक्य अधूरा और अस्वाभाविक लगता; ‘बदल दूँगा’ εἰς πένθος द्वारा सूचित परिणति को बिना किसी अतिरिक्त धर्मवैचारिक निष्कर्ष के स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक और गरिमापूर्ण रूप अपनाया गया है। नगर के लिए स्त्रीलिंग एकवचन ‘उसके’ रखा गया है। समानांतर काव्यात्मक संरचना सुरक्षित है, पर दूसरे उपवाक्य की निहित क्रिया को हिन्दी की स्पष्टता के लिए व्यक्त किया गया है।
