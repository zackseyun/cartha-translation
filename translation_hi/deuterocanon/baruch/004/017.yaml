lexical_decisions:
- source_word: ἐγὼ
  choice: मैं
  rationale: स्पष्ट सर्वनाम कर्ता पर बल देता है; हिन्दी में विरोधसूचक आरम्भ ‘पर मैं’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यह प्रसंग में हल्का विरोध या मोड़ दिखाता है; ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: τί
  choice: कैसे
  rationale: δύναμαι और सहायक क्रिया के साथ यहाँ शाब्दिक ‘क्या’ के बजाय सामर्थ्य पर प्रश्न करने वाला ‘कैसे’ स्वाभाविक अर्थ देता है।
- source_word: δυνατὴ
  choice: कर सकती हूँ
  rationale: स्त्रीलिंग विशेषण δυνατή वक्ता के स्त्री होने को सूचित करता है और सहायता करने की क्षमता व्यक्त करता है; हिन्दी में ‘सकती हूँ’ दोनों बातों को स्पष्ट रखता है।
- source_word: βοηθῆσαι
  choice: सहायता ... कर
  rationale: यह सहायता या मदद पहुँचाने को दर्शाता है; ‘सहायता करना’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: ὑμῖν
  choice: तुम्हारी
  rationale: यूनानी रूप बहुवचन सम्बोधन है। प्रसंग में सामूहिक श्रोताओं के लिए हिन्दी का ‘तुम्हारी’ स्वाभाविक है।
