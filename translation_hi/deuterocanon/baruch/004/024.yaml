  terminology: “बंधुआई,” “उद्धार,” and “महिमा” are suitable biblical-register Hindi. “सनातन” can function as the substantive divine title represented by τοῦ αἰωνίου; its genitive relation is made clearer as “सनातन की दीप्ति.”
  issues:
