  yaml_path: translation/deuterocanon/baruch/004/024.yaml
  text: For just as the neighbors of Zion have now seen your captivity[b][a], so they will soon see the salvation from your God that will come upon you with great glory and the splendor of the Eternal.
translation:
  language: hi
  text: क्योंकि जैसे सिय्योन के आस-पास रहने वालों ने अब तुम्हारी बंधुआई देखी है, वैसे ही वे शीघ्र ही उस उद्धार[a] को देखेंगे जो तुम्हारे परमेश्वर की ओर से बड़ी महिमा और सनातन[b] की दीप्ति के साथ तुम पर आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुटकारा”। यूनानी शब्द बचाव, छुटकारे या उद्धार को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सदा बने रहनेवाला”। यूनानी में यहाँ विशेषण संज्ञा के रूप में प्रयुक्त होकर परमेश्वर की उपाधि बनता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάροικοι Σειὼν
  choice: सिय्योन के आस-पास रहनेवाले
  rationale: πάροικοι यहाँ निकट रहनेवाले आसपास के लोगों को सूचित करता है। यह अनुवाद ‘परदेशी’ जैसी कानूनी या सामाजिक स्थिति को अनावश्यक रूप से नहीं जोड़ता।
- source_word: αἰχμαλωσίαν
  choice: बन्धुआई
  rationale: यह शत्रुओं द्वारा बंदी बनाए जाने की दशा को व्यक्त करता है और केवल भौगोलिक निर्वासन से अधिक निकटता से यूनानी अर्थ को रखता है।
- source_word: ἐν τάχει
  choice: शीघ्र ही
  rationale: भविष्य की प्रतिज्ञा में निकट समय का स्वाभाविक और स्पष्ट बोध देता है।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: यह बचाव और छुटकारे, दोनों के साथ परमेश्वर के व्यापक उद्धारकारी कार्य का धार्मिक भार भी बनाए रखता है।
- source_word: παρὰ τοῦ θεοῦ ὑμῶν
  choice: तुम्हारे परमेश्वर की ओर से
  rationale: παρά के संबंधकारक प्रयोग को स्रोत या उद्गम के रूप में स्पष्ट करता है।
- source_word: ἐπελεύσεται ὑμῖν
  choice: तुम पर आएगा
  rationale: ἐπέρχομαι की ‘किसी पर आना’ वाली शक्ति को बनाए रखता है और दैवी हस्तक्षेप के आगमन को व्यक्त करता है।
- source_word: μετὰ δόξης μεγάλης
  choice: बड़ी महिमा के साथ
  rationale: δόξα के बाइबलीय, विशेषतः दैवी, अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: λαμπρότητος
  choice: तेज
  rationale: यह चमक, दीप्ति और वैभव का संक्षिप्त तथा गरिमापूर्ण हिन्दी शब्द है।
- source_word: τοῦ αἰωνίου
  choice: सनातन
  rationale: यूनानी में विशेषण संज्ञा के रूप में दैवी उपाधि है। ‘सनातन’ उसी उपाधि-सदृश रूप को रखता है और पाठ में अनुपस्थित ‘परमेश्वर’ शब्द नहीं जोड़ता।
theological_decisions:
- issue: पुनर्स्थापना के प्रसंग में σωτηρία का अनुवाद
  choice: उद्धार
  alternative: छुटकारा
  rationale: तात्कालिक प्रसंग बन्धुआई से मुक्ति का है, पर यूनानी शब्द में परमेश्वर के व्यापक उद्धारकारी कार्य का अर्थ भी है; ‘उद्धार’ दोनों स्तरों को खुला रखता है।
- issue: τοῦ αἰωνίου को दैवी उपाधि के रूप में प्रस्तुत करना
  choice: सनातन
  alternative: सदा बने रहनेवाले
  rationale: मूल में निश्चित उपपद सहित विशेषण संज्ञा के समान प्रयुक्त है। ‘सनातन’ उपाधि का संक्षिप्त रूप बनाए रखता है और ‘परमेश्वर’ संज्ञा को दोहराकर नहीं जोड़ता।
- issue: ἐπελεύσεται ὑμῖν में आगमन की शक्ति
  choice: तुम पर आएगा
  alternative: तुम्हारे पास आएगा
  rationale: ‘तुम पर आएगा’ यूनानी क्रिया के प्रभावपूर्ण आगमन को सुरक्षित रखता है, बिना यह निश्चित किए कि उद्धार किस भौतिक दिशा से आता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘बन्धुआई’, ‘उद्धार’, ‘महिमा’ और ‘सनातन’ बाइबलीय भाव बनाए रखते हैं, जबकि वाक्य-विन्यास सहज हिन्दी में है।
