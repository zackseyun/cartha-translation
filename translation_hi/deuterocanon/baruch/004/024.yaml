    issue: Redundant construction around the arrival of salvation
    rationale: “तुम्हारे परमेश्वर की ओर से मिलनेवाला उद्धार ... जो ... तुम पर आएगा” expresses the arrival twice. The Greek has one finite relative clause, which can be represented more naturally by making the entire clause modify “उद्धार.”
  - severity: low
    issue: “तेज” only partially represents λαμπρότης in this context
    rationale: “दीप्ति” naturally expresses brightness/splendor and distinguishes the term from the preceding “महिमा” (δόξα).
