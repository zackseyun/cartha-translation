lexical_decisions:
- source_word: ἐπαγαγὼν
  choice: तुम पर आने दीं
  rationale: यह प्रयोग किसी बात को किसी पर ले आने या घटित कराने का भाव देता है। स्वाभाविक हिन्दी में यह कारणात्मक अर्थ बनाए रखता है, बिना दैवी कर्तृत्व को मिटाए।
- source_word: τὰ κακὰ
  choice: ये विपत्तियाँ
  rationale: यहाँ κακά प्रसंगानुसार दुःखद विपत्तियों या संकटों को दर्शाता है। ‘विपत्तियाँ’ नैतिक बुराइयों की अपेक्षा भोगे गए कष्टों का अर्थ अधिक स्पष्टता से व्यक्त करता है।
- source_word: ἐξελεῖται
  choice: छुड़ाएगा
  rationale: ἐξαιρέω का भविष्यत् मध्यम रूप संकट या शत्रु के अधिकार से बचाने अथवा छुड़ाने का अर्थ देता है; ‘छुड़ाएगा’ सहज और बाइबलीय हिन्दी है।
- source_word: ἐκ χειρὸς
  choice: के हाथ से
  rationale: यूनानी मुहावरे को हिन्दी में भी स्वाभाविक रूप से रखा जा सकता है; इसका आशय अधिकार या वश से है।
- source_word: ἐχθρῶν
  choice: शत्रुओं
  rationale: यह सामान्य बहुवचन अर्थ को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: न्याय और उद्धार में एक ही कर्ता की भूमिका
  choice: जिसने विपत्तियाँ आने दीं, वही छुड़ाएगा
  alternative: दैवी कारण को अस्पष्ट करते हुए केवल विपत्तियों के घटित होने और बाद में उद्धार का उल्लेख
  rationale: यूनानी में एक ही निश्चित कर्ता विपत्तियाँ लाने और लोगों को छुड़ाने—दोनों कार्यों से जुड़ा है। ‘वही’ इस तनाव को स्पष्ट रखता है; ‘आने दीं’ हिन्दी में कारणात्मक कर्तृत्व व्यक्त करता है, यद्यपि ‘ले आया’ की तुलना में कुछ कम प्रत्यक्ष है।
