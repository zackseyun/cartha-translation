review_pass:
  verdict: revise
  source_fidelity: The draft correctly distinguishes τέκνα ('children') from υἱούς ('sons') and preserves the singular feminine personification in the second clause. However, 'जिनकी दासता तेरे बच्चों ने की' is not idiomatic Hindi and can mean that the children exercised or carried out the cities' slavery, rather than that they were subjected to slave service under/for those cities. The Greek active ἐδούλευσαν with a dative requires an unambiguous expression of enslaved service.
  naturalness: The proposed revision is natural, concise, and suitably solemn in modern standard Hindi. 'दुर्दशाग्रस्त' conveys the lamenting force of δείλαιαι more clearly for cities than 'दीन,' and 'अपने यहाँ लिया' remains an idiomatic rendering of 'received.'
  terminology: '''बच्चों'' accurately renders the broader τέκνα, while ''पुत्रों'' retains the specific sense of υἱούς. ''दास बनकर सेवा की'' expresses the bondage inherent in δουλεύω without falsely changing the Greek active verb into a passive construction. The feminine verb ''जिसने'' continues the city’s feminine personification.'
  issues:
  - severity: high
    issue: The phrase 'जिनकी दासता तेरे बच्चों ने की' reverses or obscures the relation expressed by αἷς ἐδούλευσαν.
    rationale: In Hindi, doing 'someone's slavery' is unnatural and may suggest that the children imposed slavery. The source says that the children performed slave service in subjection to the cities.
  - severity: low
    issue: '''दीन'' is less precise and less natural for the lament over cities.'
    rationale: While not impossible, it commonly denotes poverty, meekness, or pitiable personal condition. 'दुर्दशाग्रस्त' more directly conveys the wretched, pitiful condition denounced in δείλαιαι.
  revised_text: दुर्दशाग्रस्त हैं वे नगर, जिनके अधीन तेरे बच्चों ने दास बनकर सेवा की[a]; दुर्दशाग्रस्त है वह, जिसने तेरे पुत्रों को अपने यहाँ लिया।
