- from: दीन हैं वे नगर, जिनकी दासता तेरे बच्चों ने की[a]; दीन है वह, जिसने तेरे पुत्रों को अपने यहाँ लिया।
  to: दुर्दशाग्रस्त हैं वे नगर, जिनके अधीन तेरे बच्चों ने दास बनकर सेवा की[a]; दुर्दशाग्रस्त है वह, जिसने तेरे पुत्रों को अपने यहाँ लिया।
  rationale: The revision removes the ambiguous and unidiomatic expression 'दासता ... ने की' and replaces it with 'जिनके अधीन ... दास बनकर सेवा की,' which preserves the Greek active verb, its dative relation to the cities, and the contextually strong sense of bondage. It also uses 'दुर्दशाग्रस्त' for the repeated lamenting adjective while preserving the source’s parallelism, the children/sons distinction, and the feminine singular personification.
