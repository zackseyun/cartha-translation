  text: Wretched are the cities to which your children were enslaved[a]; wretched is she who received your sons.
translation:
  language: hi
  text: दुर्दशाग्रस्त हैं वे नगर, जिनके अधीन तेरे बच्चों ने दास बनकर सेवा की[a]; दुर्दशाग्रस्त है वह, जिसने तेरे पुत्रों को अपने यहाँ लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन नगरों में तेरे बच्चों ने दासों की तरह सेवा की।” यूनानी क्रिया का अधिक शाब्दिक अनुवाद “सेवा की” हो सकता है, पर यहाँ प्रसंग दासता और बन्धन का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δείλαιαι / δείλαια
  choice: दीन हैं / दीन है
  rationale: यहाँ विशेषण करुणा और धिक्कार से भरी दुर्दशा व्यक्त करता है। ‘दीन’ उस विलापपूर्ण स्वर को बनाए रखता है और इसे सीधे ‘हाय’ में नहीं बदलता।
- source_word: αἱ πόλεις
  choice: वे नगर
  rationale: निश्चित पद उन विशेष नगरों की ओर संकेत करता है जो निर्वासन और दासता से जुड़े हैं; हिन्दी में ‘वे नगर’ स्वाभाविक है।
- source_word: αἷς ἐδούλευσαν
  choice: जिनकी दासता ... ने की
  rationale: δουλεύω का मूल रूप सक्रिय है और दत्तिवाचक सम्बन्ध उन नगरों के अधीन दास-सेवा को दर्शाता है। यह अनुवाद बन्धुआ अधीनता की तीव्रता तथा यूनानी वाक्य की सक्रिय संरचना दोनों को बनाए रखता है।
- source_word: τὰ τέκνα σου
  choice: तेरे बच्चों
  rationale: τέκνα व्यापक शब्द है, जिसमें पुत्र और पुत्रियाँ दोनों सम्मिलित हो सकते हैं; इसलिए ‘बच्चों’ उपयुक्त है।
- source_word: ἡ δεξαμένη
  choice: वह, जिसने ... अपने यहाँ लिया
  rationale: स्त्रीलिंग एकवचन कृदन्त किसी नगर को स्त्री के रूप में व्यक्त करता है। ‘वह’ इस मानवीकरण को बनाए रखता है, और ‘अपने यहाँ लिया’ δέχομαι के ग्रहण/स्वीकार करने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς υἱούς σου
  choice: तेरे पुत्रों
  rationale: υἱούς विशेष रूप से पुत्रों को दर्शाता है; पहले आए व्यापक ‘बच्चों’ से इस शब्दगत भेद को सुरक्षित रखा गया है।
theological_decisions:
- issue: निर्वासन और न्याय के प्रसंग में δουλεύω का अनुवाद
  choice: दासता ... ने की
  alternative: सेवा की / दास बना लिए गए
  rationale: प्रसंग जबरन अधीनता का है, इसलिए केवल ‘सेवा की’ अत्यन्त हल्का होगा। साथ ही यूनानी क्रिया सक्रिय है; ‘दासता की’ उस व्याकरणिक रूप और बन्धन के प्रबल अर्थ दोनों को रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त और विलापपूर्ण शैली रखी गई है। सिय्योन को संबोधन के कारण एकवचन आत्मीय ‘तेरे’ का प्रयोग किया गया है। समानान्तर वाक्य-विन्यास और नगर के स्त्रीरूप मानवीकरण को सुरक्षित रखा गया है।
