- source_word: κατελείφθην
  choice: छोड़ दी गई हूँ
  rationale: यूनानी कर्मवाच्य पीछे छोड़ दिए जाने और उससे बनी वर्तमान दशा को व्यक्त करता है। यह अनुवाद ‘त्याग दी गई’ जैसे अधिक प्रबल अर्थ को आरोपित नहीं करता। स्त्रीलिंग रूप प्रसंग में बोल रही मातृरूप नगरी के अनुरूप है।
- source_word: ἔρημος
  choice: सूनी
  rationale: इस शब्द में अकेले, निर्जन अथवा उजाड़ रह जाने के अर्थ समाए हैं। ‘सूनी’ हिन्दी में स्थान की वीरानी और वक्ता के अकेलेपन—दोनों को संक्षेप में बनाए रखता है।
