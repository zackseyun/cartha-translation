lexical_decisions:
- source_word: Θάρσει
  choice: हिम्मत रख
  rationale: एकवचन आज्ञार्थक रूप साहस और भरोसा रखने का आह्वान करता है। ‘हिम्मत रख’ आधुनिक, सहज हिन्दी में इसके प्रोत्साहनात्मक बल को बनाए रखता है।
- source_word: Ἰερουσαλήμ
  choice: हे यरूशलेम
  rationale: मानक हिन्दी नाम ‘यरूशलेम’ रखा गया है; ‘हे’ प्रत्यक्ष संबोधन को स्वाभाविक और स्पष्ट बनाता है।
- source_word: παρακαλέσει
  choice: सांत्वना देगा
  rationale: पीड़ित यरूशलेम के प्रसंग में παρακαλέω का भाव दिलासा और सांत्वना देना है; भविष्यकाल का अर्थ स्पष्ट रखा गया है।
- source_word: ὁ ὀνομάσας σε
  choice: जिसने तेरा नाम रखा है
  rationale: लेखयुक्त भूतकालिक कृदन्त को वर्णनात्मक उपवाक्य से व्यक्त किया गया है। इससे कर्ता की व्यक्तिगत सक्रियता बनी रहती है और पद में न दिया गया कोई ईश्वरीय नाम या पदवी नहीं जोड़ी जाती।
theological_decisions:
- issue: ‘जिसने तेरा नाम रखा है’ की पहचान
  choice: मुख्य पाठ में कर्ता को वर्णनात्मक रूप में रखना
  alternative: ‘परमेश्वर, जिसने तेरा नाम रखा है’ अथवा ‘प्रभु, जिसने तेरा नाम रखा है’
  rationale: संदर्भ में कर्ता परमेश्वर है, पर यूनानी पद यहाँ कोई ईश्वरीय नाम या पदवी स्पष्ट रूप से नहीं देता। वर्णनात्मक वाक्यांश मूल की साहित्यिक अभिव्यक्ति और उसकी निहित पहचान दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन वाला रूप। यरूशलेम को व्यक्तिवाचक स्त्री-सत्ता के रूप में संबोधित करने वाले प्रसंग के अनुरूप ‘तेरा/तुझे’ का प्रयोग किया गया है।
