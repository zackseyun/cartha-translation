- issue: ὁ ἅγιος की पहचान
  choice: उस पवित्र जन
  alternative: पवित्र परमेश्वर
  rationale: मूल पाठ यहाँ केवल संज्ञीकृत ‘पवित्र’ कहता है; अधिक स्पष्ट पहचान आरोपित न करके उसकी अभिव्यक्ति को यथासंभव सुरक्षित रखा गया है।
- issue: ‘अनन्त उद्धारकर्ता’ में αἰωνίου का संबंध
  choice: तुम्हारे अनन्त उद्धारकर्ता
  alternative: तुम्हें सदा उद्धार देने वाले
  rationale: विशेषण को सीधे उद्धारकर्ता से जोड़ने वाली मूल व्याकरणिक संरचना और उसकी संभावित धार्मिक व्यापकता बनाए रखी गई है।
