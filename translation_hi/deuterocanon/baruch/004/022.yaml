- source_word: ἐλεημοσύνῃ
  choice: दया
  rationale: यहाँ अर्थ परोपकारी दान से अधिक ईश्वरीय करुणा है, जो आने वाले उद्धार से जुड़ी है।
- source_word: ἐν τάχει
  choice: शीघ्र ही
  rationale: आगमन की निकटता अथवा तत्परता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σωτῆρος
