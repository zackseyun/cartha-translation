translation:
  language: hi
  text: क्योंकि मैंने तुम्हारे उद्धार के लिए अनन्त परमेश्वर पर आशा रखी है, और उस दया के कारण, जो तुम्हारे अनन्त उद्धारकर्ता की ओर से शीघ्र ही तुम्हारे पास आएगी, पवित्र परमेश्वर की ओर से मुझे आनन्द मिला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ αἰωνίῳ
  choice: अनन्त परमेश्वर
  rationale: विशेषण का संज्ञा के रूप में प्रयोग हुआ है; केवल ‘अनन्त’ की अपेक्षा हिन्दी में संदर्भित ईश्वरीय व्यक्ति को स्वाभाविक और स्पष्ट बनाता है।
