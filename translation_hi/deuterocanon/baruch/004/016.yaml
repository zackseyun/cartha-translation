  rationale: संदर्भ और ἠρήμωσαν के साथ इसका प्रयोग विधवा के अकेली तथा उजाड़ हो जाने की परिणामी दशा का समर्थन करता है, किंतु शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
