  choice: पारिवारिक और विधवा-संबंधी बिंब को मुख्य पाठ में यथावत रखना
  alternative: मुख्य पाठ में विधवा की पहचान यरूशलेम या सिय्योन के रूप में स्पष्ट कर देना
