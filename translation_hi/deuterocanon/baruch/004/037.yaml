    rationale: In modern standard Hindi, “जन” normally refers to a person or people, so the phrase reads as a human “holy person,” not as the divine title “the Holy One.”
  - severity: medium
    issue: “इकट्ठे होकर” does not adequately represent συνηγμένοι.
    rationale: The Greek perfect passive participle presents the sons as having been gathered. “एकत्र किए गए” preserves this passive restoration motif more closely.
