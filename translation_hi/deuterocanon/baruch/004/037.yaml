  yaml_path: translation/deuterocanon/baruch/004/037.yaml
  text: Look[a], your sons are coming, whom you sent away; they are coming, gathered from east to west at the word of the Holy One[b], rejoicing in the glory of God.
translation:
  language: hi
  text: देख, तेरे पुत्र आ रहे हैं, जिन्हें तूने दूर भेज दिया था। वे पवित्र परमेश्वर के वचन पर[a] पूर्व से पश्चिम तक एकत्र किए गए होकर आ रहे हैं और परमेश्वर की महिमा में[b] आनंदित हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र परमेश्वर के वचन के द्वारा।” यूनानी सम्प्रदान कारक का अर्थ वचन के साधन से अथवा उसके आदेश के प्रत्युत्तर में—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर की महिमा पर आनंदित हैं।” यूनानी रूप महिमा को आनंद का विषय या अवसर भी बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देख’ आधुनिक, स्वाभाविक और प्रत्यक्ष है।
- source_word: οἱ υἱοί σου
  choice: तेरे पुत्र
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्र’ है; यरूशलेम को एकवचन आत्मीय संबोधन दिया गया है।
- source_word: ἐξαπέστειλας
  choice: तूने दूर भेज दिया था
  rationale: क्रिया किसी को बाहर या दूर भेजने का भाव रखती है; पूर्ण भूतकाल निर्वासन की पृष्ठभूमि और अब लौटने के विरोधाभास को स्पष्ट करता है।
- source_word: συνηγμένοι
  choice: इकट्ठे होकर
  rationale: पूर्ण निष्क्रिय कृदन्त उन्हें ऐसे लोगों के रूप में दिखाता है जिन्हें एकत्र किया गया है; हिन्दी में यह रूप वाक्य के प्रवाह में स्वाभाविक है।
- source_word: ἀπʼ ἀνατολῶν ἕως δυσμῶν
  choice: पूर्व से पश्चिम तक
  rationale: यह पूरे भौगोलिक विस्तार को व्यक्त करने वाला संक्षिप्त युग्म है।
- source_word: τῷ ῥήματι
  choice: वचन पर
  rationale: सम्प्रदान कारक को उस वचन या आदेश के प्रत्युत्तर के रूप में समझा जा सकता है। साधनार्थक ‘वचन के द्वारा’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: τοῦ ἁγίου
  choice: पवित्र जन
  rationale: सव्यंजक विशेषण यहाँ परमेश्वर की उपाधि के रूप में संज्ञावत् प्रयुक्त है। ‘पवित्र जन’ उपाधि का रूप बनाए रखता है और मूल में निहित नाम को अनावश्यक रूप से नहीं जोड़ता।
- source_word: χαίροντες
  choice: आनन्दित हैं
  rationale: कृदन्त उनके आते समय की अवस्था बताता है; मुख्य वाक्य के साथ जोड़ा गया यह हिन्दी रूप सहज और स्पष्ट है।
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: परमेश्वर की महिमा में
  rationale: सम्प्रदान कारक आनन्द के क्षेत्र, विषय या अवसर को सूचित कर सकता है। ‘महिमा में’ निकट सम्बन्ध बनाए रखता है और किसी एक अर्थ को अत्यधिक निश्चित नहीं करता।
theological_decisions:
- issue: τοῦ ἁγίου में परमेश्वर की उपाधि
  choice: पवित्र जन
  alternative: पवित्र परमेश्वर
  rationale: मूल पाठ में विशेषण संज्ञावत् है और परमेश्वर के लिए श्रद्धापूर्ण उपाधि बनता है। ‘पवित्र जन’ उस संरचना को सुरक्षित रखता है; ‘पवित्र परमेश्वर’ अधिक स्पष्ट है, पर अगले पदांश से ‘परमेश्वर’ शब्द को पहले ही आयात कर देता।
- issue: τῷ ῥήματι का सम्बन्ध
  choice: पवित्र जन के वचन पर
  alternative: पवित्र जन के वचन के द्वारा
  rationale: यूनानी सम्प्रदान कारक आदेश के प्रत्युत्तर अथवा साधन—दोनों अर्थ दे सकता है। मुख्य पाठ में प्रत्युत्तर का स्वाभाविक हिन्दी रूप चुना गया और साधनार्थक सम्भावना पादटिप्पणी में सुरक्षित रखी गई।
- issue: परमेश्वर की महिमा के साथ आनन्द का सम्बन्ध
  choice: परमेश्वर की महिमा में आनन्दित
  alternative: परमेश्वर की महिमा पर आनन्दित
  rationale: यूनानी सम्प्रदान कारक आनन्द के क्षेत्र, विषय या अवसर को व्यक्त कर सकता है। मुख्य पाठ निकट सम्बन्ध को बनाए रखता है; पादटिप्पणी वैकल्पिक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर बाइबलीय गरिमा बनाए रखती है। यरूशलेम को व्यक्तिरूप में संबोधित किए जाने के कारण ‘तेरे/तूने’ रखा गया है। वाक्य को पठनीय बनाने के लिए यूनानी के एक दीर्घ वाक्य को दो हिन्दी वाक्यों में बाँटा गया है।
