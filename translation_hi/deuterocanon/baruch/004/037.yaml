  source_fidelity: The draft accurately conveys the return of the sons, their being gathered from east to west, and their rejoicing in God's glory. However, “पवित्र जन” ordinarily denotes a holy human person or holy people in modern Hindi and does not faithfully communicate the divine titular use of τοῦ ἁγίου (“the Holy One”). “इकट्ठे होकर” also weakens the passive-perfect sense of συνηγμένοι; they come as people who have been gathered.
  naturalness: The sentence is generally clear and has an appropriate elevated biblical register. “पवित्र परमेश्वर” is substantially clearer and more natural as a divine referent than “पवित्र जन.” “एकत्र किए गए” better preserves the source sense while remaining idiomatic.
  terminology: Use “पवित्र परमेश्वर” for the divine title here. This clarifies the referent without introducing a denominational interpretation. Retain “परमेश्वर की महिमा” for τῇ τοῦ θεοῦ δόξῃ. The alternate construals of τῷ ῥήματι and the dative with χαίροντες should remain footnoted.
