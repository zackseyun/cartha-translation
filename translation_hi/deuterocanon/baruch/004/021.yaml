    reason: cultural_note
lexical_decisions:
- source_word: Θαρρεῖτε
  choice: साहस रखो
  rationale: बहुवचन आज्ञार्थक क्रिया आत्मविश्वास और साहस बनाए रखने का आह्वान करती है। ‘साहस रखो’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: τέκνα
  choice: बच्चो
  rationale: सम्बोधन में प्रयुक्त बहुवचन का अर्थ ‘बच्चे/सन्तान’ है और इसमें किसी एक लिंग की सीमा नहीं है।
- source_word: βοήσατε πρὸς τὸν θεόν
  choice: परमेश्वर को पुकारो
  rationale: βοήσατε का आज्ञार्थक रूप जोर देकर पुकारने की तत्परता व्यक्त करता है; πρὸς τὸν θεόν उस पुकार की दिशा बताता है।
- source_word: ἐξελεῖται
  choice: छुड़ाएगा
  rationale: ἐξαιρέω का भविष्यत् रूप संकट या शत्रु के अधिकार से निकालने अथवा बचाने का अर्थ देता है। ‘छुड़ाएगा’ अगले वाक्यांशों के साथ स्वाभाविक बैठता है।
- source_word: ἐκ δυναστείας
  choice: दमनकारी सत्ता से
  rationale: δυναστεία यहाँ प्रभुत्व, आधिपत्य या दबाने वाली सत्ता को सूचित करता है। यह चयन सत्ता के भाव और प्रसंग में उसकी दमनकारी प्रकृति—दोनों को रखता है।
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: शत्रुओं के हाथ से
  rationale: मूल का ठोस बाइबलीय मुहावरा सुरक्षित रखा गया है; इसका आशय शत्रुओं के अधिकार या नियंत्रण से है।
theological_decisions:
- issue: परमेश्वर द्वारा भविष्य में छुटकारा
  choice: वह तुम्हें ... छुड़ाएगा
  alternative: वह तुम्हें ... बचाएगा
  rationale: यूनानी पाठ परमेश्वर के भावी उद्धारकारी कार्य का सीधा आश्वासन देता है। ‘छुड़ाएगा’ शत्रुओं के अधिकार से बाहर निकालने का अर्थ स्पष्ट करता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
- issue: ἐκ δυναστείας और ἐκ χειρὸς ἐχθρῶν का संबंध
  choice: दोनों ‘से’ वाक्यांशों को साथ बनाए रखा गया
  alternative: ‘शत्रुओं की दमनकारी सत्ता से’ के रूप में एक संयुक्त वाक्यांश
  rationale: यूनानी में दोनों अलग ἐκ-वाक्यांश हैं। हिन्दी में उन्हें अलग रखने से मूल की पुनरुक्ति और संभावित व्याख्यात्मक तनाव सुरक्षित रहता है; उन्हें चुपचाप एक ही अर्थ में विलीन नहीं किया गया।
