lexical_decisions:
- source_word: μακάριοί
  choice: धन्य
  rationale: यह केवल भावनात्मक प्रसन्नता नहीं, बल्कि अनुग्रहपूर्ण और सौभाग्यशाली दशा व्यक्त करता है; ‘धन्य’ बाइबलीय गरिमा बनाए रखता है।
- source_word: Ἰσραήλ
  choice: हे इस्राएल
  rationale: यूनानी में प्रत्यक्ष संबोधन है, जिसे हिन्दी में स्वाभाविक रूप से ‘हे इस्राएल’ से व्यक्त किया गया है।
- source_word: τὰ ἀρεστὰ τοῦ θεοῦ
  choice: जो बातें परमेश्वर को भाती हैं
  rationale: नपुंसकलिंग बहुवचन पदबंध परमेश्वर को स्वीकार्य या प्रसन्न करने वाली बातों को दर्शाता है; यह अनुवाद उसके व्यापक अर्थ को ‘व्यवस्था’ तक सीमित नहीं करता।
- source_word: ἡμῖν γνωστά ἐστιν
  choice: वे हमें मालूम हैं
  rationale: यह वर्तमान में ज्ञात होने की स्थिति व्यक्त करता है। ‘मालूम हैं’ सामान्य आधुनिक हिन्दी में सहज है और मूल में स्पष्ट न किए गए ‘प्रकट की गई हैं’ जैसे कर्मवाच्य भाव को नहीं जोड़ता।
theological_decisions:
- issue: इस्राएल के धन्य होने का आधार
  choice: इस्राएल धन्य है क्योंकि परमेश्वर को भाने वाली बातें उसे ज्ञात हैं।
  alternative: इसे विशेष रूप से ‘परमेश्वर की व्यवस्था हमें ज्ञात है’ कहना।
  rationale: संदर्भ में व्यवस्था और वाचा की शिक्षा का संकेत हो सकता है, पर यूनानी पाठ व्यापक रूप से ‘परमेश्वर को भाने वाली बातें’ कहता है; इसलिए अनुवाद उस अर्थ को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन वाला रूप। बहुवचन ‘जो बातें…वे’ मूल यूनानी के नपुंसकलिंग बहुवचन को स्वाभाविक हिन्दी में सुरक्षित रखता है।
