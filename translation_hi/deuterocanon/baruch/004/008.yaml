translation:
  language: hi
  text: तुम उस अनन्त परमेश्वर को भूल गए, जिसने तुम्हारा पालन-पोषण किया; और तुमने यरूशलेम को भी दुःखी किया, जिसने तुम्हें बड़ा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάθεσθε
  choice: तुम भूल गए
  rationale: यह क्रिया स्मरण खो देने या भूल जाने का आरोप व्यक्त करती है; सरल भूतकाल हिन्दी में इसके आरोपात्मक बल को स्वाभाविक रूप से रखता है।
- source_word: τὸν τροφεύσαντα ὑμᾶς
  choice: जिसने तुम्हारा पालन-पोषण किया
  rationale: τροφεύω पोषण करने और पालने का भाव रखता है। ‘पालन-पोषण किया’ शारीरिक भोजन तक अर्थ को सीमित किए बिना देखभाल का व्यापक भाव देता है।
- source_word: θεὸν αἰώνιον
  choice: अनन्त परमेश्वर
  rationale: αἰώνιος यहाँ परमेश्वर का विशेषण है। ‘अनन्त परमेश्वर’ आधुनिक धार्मिक हिन्दी में स्वाभाविक है और दैवी विशेषता को सुरक्षित रखता है।
- source_word: ἐλυπήσατε
  choice: तुमने … दुःखी किया
  rationale: λυπέω का अर्थ दुःख या शोक पहुँचाना है। यह चयन भावनात्मक और संबंधपरक आरोप दोनों को स्पष्ट रखता है।
- source_word: δὴ καὶ
  choice: और … भी
  rationale: καί का समावेशी अर्थ ‘भी’ से और δὴ का बल वाक्य-विन्यास तथा ‘और’ से पर्याप्त रूप से व्यक्त होता है।
- source_word: τὴν ἐκθρέψασαν ὑμᾶς
  choice: जिसने तुम्हें बड़ा किया
  rationale: ἐκτρέφω पाल-पोसकर बड़ा करने को दर्शाता है। यह पहले खंड के ‘पालन-पोषण’ से जुड़ा रहता है, फिर भी यरूशलेम की मातृवत भूमिका को अलग ढंग से व्यक्त करता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: प्रचलित हिन्दी रूप अपनाया गया है; स्त्रीलिंग कृदन्त के अनुरूप नगर का व्यक्तिकरण वाक्य में सुरक्षित है।
theological_decisions:
- issue: पालन करने वाली मातृवत हस्ती के रूप में यरूशलेम का व्यक्तिकरण
  choice: ‘यरूशलेम को भी दुःखी किया, जिसने तुम्हें बड़ा किया’ कहकर व्यक्तिकरण स्पष्ट रखा गया
  alternative: ‘तुम्हारी माता यरूशलेम’
  rationale: यूनानी स्त्रीलिंग कृदन्त यरूशलेम को व्यक्तिगत, मातृवत पालनकर्ता के रूप में प्रस्तुत करता है, पर मूल पाठ उसे स्पष्टतः ‘माता’ नहीं कहता; इसलिए यह शब्द नहीं जोड़ा गया।
- issue: αἰώνιον दैवी विशेषण का अनुवाद
  choice: अनन्त परमेश्वर
  alternative: सनातन परमेश्वर
  rationale: दोनों संभव हैं, पर ‘अनन्त’ सामान्य आधुनिक हिन्दी में अधिक सीधा है और परमेश्वर के कालातीत अथवा चिरस्थायी स्वरूप का दावा बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानान्तर संरचना तथा परमेश्वर और यरूशलेम के पालन-पोषण संबंधी चित्रों के बीच अंतर सुरक्षित रखा गया है।
