translation:
  language: hi
  text: क्योंकि मैंने आनन्द के साथ उनका पालन-पोषण किया, पर रोते और शोक मनाते हुए उन्हें विदा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθρεψα
  choice: मैंने…उनका पालन-पोषण किया
  rationale: यह क्रिया भोजन देने के साथ-साथ संतान को पालने की मातृसुलभ देखभाल भी व्यक्त कर सकती है; ‘पालन-पोषण किया’ दोनों पहलुओं को स्वाभाविक हिन्दी में समेटता है।
- source_word: μετʼ εὐφροσύνης
  choice: आनन्द के साथ
  rationale: यह पद आनन्द और हर्षपूर्ण अवस्था को व्यक्त करता है तथा μετά की साथ होने की भावना बनाए रखता है।
- source_word: ἐξαπέστειλα
  choice: उन्हें विदा किया
  rationale: संदर्भ में यह अपने पास से दूर भेजने और वियोग की भावना व्यक्त करता है; ‘विदा किया’ हिन्दी में इस भाव को सहजता से रखता है।
- source_word: μετὰ κλαυθμοῦ
  choice: रोते…हुए
  rationale: κλαυθμός विलापपूर्ण रोने को दर्शाता है। क्रियाविशेषणीय हिन्दी रचना भावनात्मक परिस्थिति को स्वाभाविक रूप से व्यक्त करती है।
- source_word: πένθους
  choice: शोक मनाते हुए
  rationale: πένθος हानि के कारण शोक या मातम को दर्शाता है; यह चुनाव ‘रोते’ के साथ अर्थपूर्ण समानांतर बनाता है।
theological_decisions:
- issue: वक्ता की मातृसुलभ वाणी और निर्वासन का संदर्भ
  choice: प्रथम पुरुष की क्रियाओं और भावनात्मक विरोध को सीधे रखा गया है; निर्वासन को स्पष्ट करने वाला कोई अतिरिक्त शब्द नहीं जोड़ा गया।
  alternative: मुख्य पाठ में ‘निर्वासन में’ या इसी प्रकार की व्याख्या जोड़ना।
  rationale: यूनानी पाठ इस पद में आनन्दपूर्वक पालने और शोकपूर्वक विदा करने का विरोध प्रस्तुत करता है, पर निर्वासन को स्पष्ट रूप से दोहराता नहीं। इसलिए निहित संदर्भ को बिना विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भावात्मक रूप अपनाया गया है। ‘पालन-पोषण’ मातृसुलभ देखभाल को और ‘विदा किया’ वियोग को स्वाभाविक ढंग से व्यक्त करता है।
