  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप चुना गया है। ‘उतार दिया’ और ‘पहन लिया’ का विरोध मूल के वस्त्र-रूपक को स्पष्ट रखता है। सभी पाद-टिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
