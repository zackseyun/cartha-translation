  yaml_path: translation/deuterocanon/baruch/004/020.yaml
  text: I have taken off the robe of peace[a], but I have put on the sackcloth of my supplication[b]; I will cry out to the Eternal One in my days.
translation:
  language: hi
  text: मैंने शांति का वस्त्र उतार दिया है और अपनी विनती का टाट[b] पहन लिया है; मैं अपने दिनों में सनातन[a] को पुकारूँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनन्त।’ यूनानी में शाब्दिक रूप से ‘सनातन’ है; यहाँ यह संज्ञा के समान परमेश्वर की उपाधि के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: ‘टाट’ खुरदरा वस्त्र था, जिसे शोक, पश्चात्ताप या संकट के चिह्न के रूप में पहना जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: ἐξεδυσάμην
  choice: मैंने ... उतार दिया है
  rationale: मध्यवाच्य रूप अपने शरीर से वस्त्र उतारने का भाव देता है; यह हिंदी प्रयोग स्वाभाविक है और वस्त्र-रूपक बनाए रखता है।
- source_word: τὴν στολὴν τῆς εἰρήνης
  choice: शांति का वस्त्र
  rationale: στολή एक लंबा या विशिष्ट वस्त्र हो सकता है। सामान्य किंतु गरिमापूर्ण ‘वस्त्र’ मूल रूपक को बिना अनावश्यक अलंकरण के व्यक्त करता है।
- source_word: ἐνεδυσάμην
  choice: पहन लिया है
  rationale: यह ἐξεδυσάμην के विपरीत क्रिया है और हिंदी में वस्त्र पहनने का स्वाभाविक ढंग है।
- source_word: σάκκον
  choice: टाट
  rationale: यह शोक, पश्चात्ताप या संकट के समय पहने जाने वाले खुरदरे वस्त्र को सूचित करता है; हिंदी बाइबलीय भाषा में ‘टाट’ परिचित और संक्षिप्त है।
- source_word: τῆς δεήσεώς μου
  choice: अपनी विनती का
  rationale: δέησις साधारण प्रार्थना से अधिक आग्रहपूर्ण याचना का भाव रखता है; ‘विनती’ उस भाव को सहज हिंदी में व्यक्त करती है।
- source_word: κεκράξομαι
  choice: पुकारूँगी
  rationale: κράζω ऊँची और व्याकुल पुकार का संकेत देता है। संदर्भ में वक्ता स्त्रीरूप में चित्रित यरूशलेम है, इसलिए हिंदी में स्त्रीलिंग भविष्यत् रूप आवश्यक है।
- source_word: τὸν αἰώνιον
  choice: सनातन
  rationale: मूल में विशेषण संज्ञा की तरह ईश्वरीय उपाधि के रूप में प्रयुक्त है। ‘सनातन’ इस विशिष्ट उपाधि को बनाए रखता है और ‘परमेश्वर’ या ‘प्रभु’ जैसा शब्द नहीं जोड़ता।
- source_word: ἐν ταῖς ἡμέραις μου
  choice: अपने दिनों में
  rationale: यह मूल समय-सूचक वाक्यांश का निकट रूप है; ‘जीवन भर’ कहने से मूल में निहित न होने वाला ‘सभी दिन’ का भाव जुड़ सकता था।
theological_decisions:
- issue: ईश्वरीय उपाधि τὸν αἰώνιον का अनुवाद
  choice: सनातन
  alternative: अनन्त जन / सनातन परमेश्वर
  rationale: यूनानी पाठ में ‘परमेश्वर’ या ‘प्रभु’ संज्ञा नहीं, बल्कि संज्ञा के रूप में प्रयुक्त ‘सनातन/अनन्त’ विशेषण है। इसलिए विशिष्ट उपाधि को बनाए रखा गया है और ईश्वरीय संज्ञा नहीं जोड़ी गई।
- issue: वक्ता के लिंग का हिंदी में प्रकटीकरण
  choice: पुकारूँगी
  alternative: मैं पुकारूँगा / लिंग से बचने के लिए वाक्य का पुनर्गठन
  rationale: यूनानी प्रथम पुरुष रूप स्वयं लिंग नहीं बताता, पर निकटवर्ती साहित्यिक संदर्भ में वक्ता माता के रूप में व्यक्त यरूशलेम है। हिंदी भविष्यत् क्रिया में लिंग चुनना आवश्यक है, इसलिए संदर्भानुसार स्त्रीलिंग रखा गया।
