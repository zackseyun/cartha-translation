theological_decisions:
- issue: स्त्रीलिंग कर्ता का संदर्भ
  choice: मुख्य पाठ में केवल स्त्रीलिंग सर्वनाम 'वह' और आत्मवाचक 'अपने' रखा गया है।
  alternative: मुख्य पाठ में उसे बाबुल या शत्रु नगर के रूप में स्पष्ट पहचानना।
  rationale: यूनानी पाठ स्त्रीलिंग एकवचन रूपों का प्रयोग करता है, पर इस पद में नाम नहीं बताता। सर्वनाम बनाए रखने से मूल की अनिर्दिष्टता सुरक्षित रहती है; सम्भावित पहचान पाद-टिप्पणी में दी गई है।
- issue: πτῶμα का अर्थ
  choice: पतन
  alternative: शव; विनाश
  rationale: πτῶσις के साथ समानांतरता और विपत्ति का प्रसंग यहाँ रूपकात्मक पतन को समर्थित करते हैं, न कि किसी वास्तविक शव को।
