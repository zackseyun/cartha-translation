  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली अपनाई गई है। 'आनन्दित हुई/प्रसन्न हुई' और 'गिरने/पतन' की युग्मित अभिव्यक्तियाँ यूनानी समानांतरता को स्वाभाविक हिन्दी में बनाए रखती हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
