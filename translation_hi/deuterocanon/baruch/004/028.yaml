translation:
  language: hi
  text: क्योंकि जैसे तुम्हारा मन परमेश्वर से भटकने पर लगा था, वैसे ही लौटते हुए उसे दस गुना खोजो[क]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “लौटते हुए उसे दस गुना खोजो।” यूनानी में शाब्दिक रूप से, “लौटते हुए उसे खोजने के लिए [इसे] दस गुना करो” है; जिस बात को दस गुना करना है, वह प्रसंग से निहित है।
    reason: The Greek imperative δεκαπλασιάσατε has an implied object; the note preserves the lexical ambiguity and the possible participial word order.
lexical_decisions:
- source_word: διάνοια
  choice: मन
  rationale: यहाँ यह लोगों की भीतरी सोच, रुझान और इच्छा को सूचित करता है; आधुनिक हिन्दी में ‘मन’ स्वाभाविक और व्यापक है।
- source_word: ἐγένετο … εἰς τὸ πλανηθῆναι
  choice: भटक जाने पर लगा था
  rationale: यह अभिव्यक्ति भटकाव की ओर बने मानसिक रुझान को दर्शाती है और यूनानी वाक्य के परिणामी भाव को सहज हिन्दी में रखती है।
- source_word: ἀπὸ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: ἀπό अलगाव का भाव देता है; ‘परमेश्वर से भटक जाना’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: δεκαπλασιάσατε
  choice: दस गुना अधिक
  rationale: क्रिया का मूल अर्थ ‘दस गुना करना’ है। प्रसंग में खोजने की तीव्रता निहित है, जिसे हिन्दी में स्पष्ट करना आवश्यक है।
- source_word: ἐπιστρέφοντες
  choice: लौटते हुए
  rationale: वर्तमान कृदन्त मुख्य आज्ञा के साथ-साथ होने वाले लौटने को व्यक्त करता है और परमेश्वर की ओर वापसी का भाव बनाए रखता है।
- source_word: ζητῆσαι αὐτόν
  choice: उसे … खोजो
  rationale: धार्मिक प्रसंग में ζητέω परमेश्वर को खोजने या उसकी ओर मन लगाने का मानक अर्थ रखता है; ‘खोजो’ गरिमापूर्ण और स्पष्ट है।
theological_decisions:
- issue: δεκαπλασιάσατε के दीर्घवृत्तात्मक प्रयोग को पश्चात्ताप और परमेश्वर की खोज से कैसे जोड़ा जाए
  choice: आज्ञा को ‘उसे दस गुना अधिक खोजो’ के रूप में व्यक्त किया गया।
  alternative: ‘लौटकर उसे दस गुना खोजो’ अथवा अधिक शाब्दिक ‘लौटते हुए [इसे] दस गुना करो।’
  rationale: यूनानी में जिस वस्तु को दस गुना करना है वह स्पष्ट रूप से कही नहीं गई, पर लौटने और परमेश्वर को खोजने के प्रसंग से खोज की तीव्रता निहित है। चुना हुआ रूप इसे पठनीय बनाता है, बिना किसी अतिरिक्त धर्मसैद्धान्तिक अर्थ के।
