  verdict: revise
  source_fidelity: The comparison, separation from God, return, and command to seek God are retained. The draft's “भटक जाने पर लगा था” is syntactically liable to mean “was engaged after going astray,” rather than expressing the mind's orientation toward straying. The revised wording clarifies the Greek infinitival sense without overreading its passive nuance. “दस गुना” better reflects δεκαπλασιάσατε than “दस गुना अधिक,” which can be understood as an additional tenfold amount.
  naturalness: “परमेश्वर से भटकने पर लगा था” is an idiomatic Hindi expression for being intent on or occupied with straying, and avoids the awkward temporal reading created by “भटक जाने पर.” The sentence remains direct and suitably dignified.
  terminology: “मन,” “परमेश्वर,” “लौटते हुए,” and “खोजो” are appropriate modern-standard Hindi equivalents. A note is warranted because the Greek imperative “make [it] tenfold” has an implied object and permits a slightly different word order.
  issues:
  - severity: medium
    issue: “भटक जाने पर लगा था” has an unintended temporal/grammatical ambiguity.
    rationale: The postposition “पर” can attach to the completed action “भटक जाना,” yielding “was intent after having strayed,” whereas εἰς τὸ πλανηθῆναι expresses movement or orientation toward going astray. “भटकने पर लगा था” directly expresses the intended inclination.
  - severity: low
    issue: “दस गुना अधिक” can be read as ‘an additional tenfold’ rather than simply ‘tenfold.’
    rationale: δεκαπλασιάσατε means ‘make tenfold.’ “दस गुना” is more exact while the footnote records the Greek ellipsis and alternative arrangement.
  revised_text: क्योंकि जैसे तुम्हारा मन परमेश्वर से भटकने पर लगा था, वैसे ही लौटते हुए उसे दस गुना खोजो[क]।
