lexical_decisions:
- source_word: Θαρρήσατε
  choice: हिम्मत रखो
  rationale: बहुवचन आज्ञार्थक रूप साहस बनाए रखने का आह्वान करता है। ‘हिम्मत रखो’ आधुनिक, स्वाभाविक और प्रोत्साहनपूर्ण हिन्दी है।
- source_word: τέκνα
  choice: हे बच्चो
  rationale: सम्बोधन बहुवचन का अर्थ ‘बच्चो’ है और इसमें स्त्री-पुरुष दोनों सम्मिलित हैं। ‘हे’ गरिमापूर्ण सम्बोधन को स्पष्ट करता है।
- source_word: βοήσατε
  choice: पुकारो
  rationale: βοάω का यह आज्ञार्थक रूप ऊँची और सहायता की अपेक्षा वाली पुकार को व्यक्त करता है। परमेश्वर के प्रति संबोधन में ‘पुकारो’ सहज और अर्थपूर्ण है।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वर को
  rationale: पुकारने की क्रिया के साथ πρὸς की दिशा हिन्दी में स्वाभाविक रूप से ‘परमेश्वर को’ द्वारा व्यक्त होती है।
- source_word: ἔσται ... μνεία
  choice: वह तुम्हें याद करेगा
  rationale: यूनानी में शाब्दिक भाव ‘तुम्हारा स्मरण होगा’ है। हिन्दी में कर्तृवाच्य अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल रचना को सुरक्षित रखती है।
- source_word: ὑπὸ τοῦ ἐπάγοντος
  choice: जो तुम पर यह विपत्ति लाया है
  rationale: सम्बन्धवाचक कृदन्त उस व्यक्ति को सूचित करता है जो अनकही वस्तु या विपत्ति को उन पर लाया। प्रसंग के आधार पर ‘विपत्ति’ स्पष्ट की गई है, पर कर्ता को सीधे ‘परमेश्वर’ कहकर मूल की अप्रत्यक्षता समाप्त नहीं की गई।
theological_decisions:
- issue: ‘जो तुम पर यह विपत्ति लाया है’ की पहचान
  choice: कर्ता को ‘जो ... लाया है’ के रूप में अप्रत्यक्ष रखा गया है; निकट प्रसंग में इसका संकेत परमेश्वर की ओर है।
  alternative: इसे सीधे ‘परमेश्वर, जिसने तुम पर यह विपत्ति लाई है’ कहा जा सकता था, अथवा कर्ता को और अधिक अस्पष्ट छोड़ा जा सकता था।
  rationale: पहले खंड में परमेश्वर का उल्लेख और बारूक में विपत्ति को दैवी न्याय के रूप में प्रस्तुत किया जाना इस पहचान का समर्थन करते हैं; फिर भी यूनानी पाठ दूसरे खंड में परमेश्वर का नाम दोहराता नहीं है। अनुवाद उसी अप्रत्यक्षता और धार्मिक तनाव को बनाए रखता है।
