- issue: κατέναντι τοῦ φωτὸς αὐτῆς का संबंध
  choice: ‘उसकी ज्योति के सामने की दीप्ति की ओर’—स्थानिक वाक्य-विन्यास को निकटता से रखा गया
  alternative: ‘उसकी ज्योति की दीप्ति की ओर’—पूरे पदबंध को अधिक मुहावरेदार संबंध के रूप में समझना
  rationale: यूनानी में κατέναντι का असामान्य स्थानिक बल वास्तविक है। मुख्य पाठ उसे बनाए रखता है, जबकि पादटिप्पणी संभावित मुहावरेदार समझ प्रस्तुत करती है।
