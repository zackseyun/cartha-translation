  choice: लौट आ
  rationale: यह आज्ञार्थक रूप मुड़ने या लौट आने का भाव रखता है। संदर्भ में ‘लौट आ’ स्वाभाविक है और दिशा-परिवर्तन का बल बनाए रखता है।
- source_word: Ἰακώβ
