  rationale: यूनानी पाठ में आए नाम को सीधे प्रचलित हिन्दी रूप में रखा गया है; इसे व्याख्यात्मक रूप से ‘इस्राएल’ नहीं बनाया गया।
- source_word: ἐπιλαβοῦ
  choice: थाम ले
  rationale: यह किसी को या किसी वस्तु को दृढ़ता से पकड़ने का ठोस भाव व्यक्त करता है; ‘थाम ले’ सहज हिन्दी है और ‘छीन ले’ जैसी अनावश्यक आक्रामकता से बचता है।
- source_word: αὐτῆς
  choice: उसे / उसकी
  rationale: स्त्रीलिंग सर्वनाम को बनाए रखने से निकटवर्ती व्यवस्था/बुद्धि का साहित्यिक मानवीकरण सुरक्षित रहता है। हिन्दी में ‘उसे’ व्याकरणतः लिंग नहीं दिखाता, पर बाद का ‘उसकी’ स्त्रीलिंग संदर्भ को व्यक्त करता है।
- source_word: διόδευσον
  choice: की ओर बढ़
  rationale: क्रिया मार्ग पर आगे जाने या अपना मार्ग बनाने को व्यक्त करती है। ‘की ओर बढ़’ गति और लक्ष्य दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: λάμψιν
  choice: दीप्ति
  rationale: यह चमक या प्रकाशमान आभा को दर्शाता है। ‘दीप्ति’ पद की गरिमा और φῶς से उसका शब्दगत भेद बनाए रखता है।
- source_word: κατέναντι
  choice: के सामने
  rationale: इसका मूल स्थानिक अर्थ ‘सामने’ या ‘आमने-सामने’ है। ‘के सामने’ औपचारिक निकटता रखते हुए हिन्दी में ‘के विपरीत’ से अधिक स्वाभाविक और संदर्भानुकूल है।
- source_word: φωτός
