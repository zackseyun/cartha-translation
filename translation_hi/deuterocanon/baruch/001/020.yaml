theological_decisions:
- issue: विपत्तियों और शाप का वाचा-संबंधी स्वरूप
  choice: पाठ को मूसा के द्वारा दिए गए वाचा-संबंधी न्यायों की पृष्ठभूमि में रखा गया है, बिना ‘वाचा’ शब्द जोड़े।
  alternative: इसे सामान्य दुर्भाग्यों और किसी असंबद्ध शाप का उल्लेख मानना।
  rationale: विपत्तियों और शाप का मेल, मूसा का उल्लेख, निर्गमन और देश की प्रतिज्ञा—ये सब व्यवस्थाविवरणीय वाचा-दंडों की ओर संकेत करते हैं; अनुवाद इस प्रतिध्वनि को बनाए रखता है पर व्याख्या को मूल पाठ में नहीं जोड़ता।
- issue: संबंधवाचक उपवाक्य का व्याकरणिक संबंध
  choice: ‘जिसे’ केवल ‘शाप’ से जोड़ा गया है।
  alternative: प्रभु द्वारा ठहराई गई वस्तुओं में ‘विपत्तियाँ और शाप’ दोनों को समान रूप से शामिल करना।
  rationale: यूनानी ἣν स्त्रीलिंग एकवचन है और सीधे स्त्रीलिंग एकवचन ἡ ἀρά (‘शाप’) से मेल खाता है; इसलिए मूल की व्याकरणिक सीमा सुरक्षित रखी गई है।
- issue: मूसा के साथ संप्रदान कारक का अर्थ
  choice: प्रभु ने शाप को ठहराकर मूसा को दिया/सौंपा।
  alternative: प्रभु ने शाप को मूसा के लिए नियुक्त किया, मानो मूसा उसका लक्ष्य हो।
  rationale: τῷ Μωυσῇ को आदेश या विधान पाने वाले के रूप में समझना प्रसंग के अनुकूल है; ‘मूसा के लिए’ कहना गलत रूप से मूसा को शाप का लाभार्थी या लक्ष्य बना सकता है।
