  rationale: यह परिचित बाइबिलीय रूपक को बनाए रखते हुए आधुनिक हिंदी में स्वाभाविक और चित्रात्मक है।
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: और आज भी ऐसा ही है
