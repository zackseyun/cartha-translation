base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/020.yaml
  text: And the calamities and the curse that the Lord appointed for Moses his servant clung to us[a], on the day when he brought our fathers out to give us a land flowing with milk and honey[c][b], as it is this day.
translation:
  language: hi
  text: और विपत्तियाँ[a] और वह शाप हमसे चिपक गए, जिसे प्रभु ने अपने सेवक[c] मूसा के लिए निर्धारित किया था[b], उस दिन जब उसने हमारे पूर्वजों को बाहर निकाला, ताकि हमें दूध और मधु से बहने वाला देश दे, जैसा आज के दिन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बुराइयाँ’; यहाँ यूनानी शब्द का आशय संभवतः नैतिक बुराइयों के बजाय विनाशकारी न्यायों से है।
    reason: lexical_alternative
  - marker: b
    text: ‘निर्धारित किया था’ का अनुवाद ‘ठहराया था,’ ‘विधान किया था,’ या ‘आज्ञा दी थी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘सेवक’ के लिए यूनानी शब्द का अर्थ ‘बालक’ या ‘संतान’ भी हो सकता है, पर यहाँ मूसा के लिए इसका अर्थ ‘सेवक’ है।
    reason: lexical_alternative
