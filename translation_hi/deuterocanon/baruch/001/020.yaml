- source_word: ἣν συνέταξεν Κύριος τῷ Μωυσῇ
  choice: जिसे प्रभु ने ... मूसा को ठहराकर दिया था
  rationale: स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम ἣν निकटतम स्त्रीलिंग एकवचन ‘शाप’ को संबोधित करता है। συνέταξεν और मूसा के संप्रदान कारक को ‘ठहराकर दिया’ आदेशित/निर्धारित करके मूसा को सौंपने के भाव में प्रस्तुत करता है।
- source_word: παιδὶ αὐτοῦ
  choice: अपने सेवक
