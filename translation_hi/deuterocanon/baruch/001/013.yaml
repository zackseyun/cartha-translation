  rationale: पाप के साथ यूनानी सम्प्रदान कारक यहाँ जिसके विरुद्ध अपराध हुआ उसे सूचित करता है; ‘के विरुद्ध’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: ὁ θυμὸς Κυρίου καὶ ἡ ὀργὴ αὐτοῦ
  choice: प्रभु का रोष और उसका क्रोध
  rationale: दोनों निकटार्थक यूनानी संज्ञाओं को अलग रखते हुए उनकी संचयी तीव्रता सुरक्षित रखी गई है।
- source_word: οὐκ ἀπέστρεψεν ... ἀφʼ ἡμῶν
  choice: हम पर से नहीं हटा है
  rationale: एकवचन क्रिया को संयुक्त भाव के साथ एकवचन में रखा गया और स्रोत की स्थानिक छवि सुरक्षित की गई।
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: आज के दिन तक
  rationale: मूल की समय-सूचक अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय रोष और क्रोध की दोहरी अभिव्यक्ति
  choice: ‘रोष’ और ‘क्रोध’ दोनों को बनाए रखा गया
  alternative: दोनों को मिलाकर केवल ‘क्रोध’ कहना
  rationale: मूल पाठ θυμός और ὀργή दोनों रखता है; उन्हें समेट देना उसकी आलंकारिक और धर्मवैचारिक तीव्रता घटाता।
- issue: क्रोध के न हटने का कर्ता
  choice: संयुक्त पद के बाद मूल की एकवचन क्रिया के अनुरूप ‘नहीं हटा है’
  alternative: हिन्दी व्याकरणानुसार बहुवचन ‘नहीं हटे हैं’
  rationale: यूनानी में क्रिया ἀπέστρεψεν एकवचन है, संभवतः संयुक्त अवधारणा को एक समग्र ईश्वरीय प्रतिक्रिया मानती है; हिन्दी में भी अर्थ समझ में आता है और यह विशेषता बची रहती है।
