  text: और हमारे लिए हमारे प्रभु परमेश्वर से प्रार्थना करो, क्योंकि हमने हमारे प्रभु परमेश्वर के विरुद्ध पाप किया है, और प्रभु का रोष और उसका क्रोध आज के दिन तक हम पर से नहीं हटे हैं।
