  choice: पात्र
  rationale: मंदिर के संदर्भ में यह पवित्र उपयोग की वस्तुओं या उपकरणों को दर्शाता है; ‘पात्र’ संक्षिप्त, गरिमापूर्ण और प्रचलित बाइबिलीय शब्द है।
- source_word: οἴκου Κυρίου
