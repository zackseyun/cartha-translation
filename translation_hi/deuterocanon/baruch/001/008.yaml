  rationale: infinitive को प्रयोजन के रूप में समझते हुए वस्तुओं को यहूदा लौटाने का भाव व्यक्त किया गया है; footnote संभावित वैकल्पिक संबंध को सुरक्षित रखता है।
- source_word: γῆν Ἰούδα
