  rationale: infinitive को प्रयोजन मानना वाक्य के प्रवाह में स्वाभाविक है, पर यूनानी संरचना में इसके संबंध की कुछ गुंजाइश है; इसलिए वैकल्पिक समझ footnote में दी गई है।
