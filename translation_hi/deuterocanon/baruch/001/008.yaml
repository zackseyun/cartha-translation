  text: जब उसने प्रभु के भवन के उन पात्रों को प्राप्त किया जिन्हें मंदिर से बाहर ले जाया गया था, ताकि वह उन्हें यहूदा की भूमि में वापस लौटा दे[a], सिवान महीने की दसवीं तारीख को—वे चाँदी के पात्र जिन्हें यहूदा के राजा, योशियाह के पुत्र सिदकियाह ने बनाए थे—
