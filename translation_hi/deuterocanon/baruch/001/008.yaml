  choice: बनवाया था
  rationale: राजा द्वारा राजकीय या मंदिर-संबंधी वस्तुओं के निर्माण का आदेश या प्रबंध कराना हिन्दी में ‘बनवाया’ से स्वाभाविक रूप से व्यक्त होता है; ‘था’ घटना से पूर्व का समय दिखाता है।
- source_word: Σεδεκίας υἱὸς Ἰωσεία βασιλεὺς Ἰούδα
  choice: यहूदा के राजा, योशियाह के पुत्र सिदकियाह
  rationale: सभी उपाधियों और वंश-संबंध को सुरक्षित रखते हुए हिन्दी का स्पष्ट क्रम अपनाया गया है।
theological_decisions:
- issue: मंदिर-संबंधी पदबंध में κύριος का अनुवाद
  choice: प्रभु
