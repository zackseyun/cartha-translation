  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। पद मूलतः अगले वाक्यांश की ओर बढ़ता हुआ प्रतीत होता है, इसलिए अंत में दीर्घ डैश रखा गया है। ‘प्रभु का भवन’ और ‘मंदिर’ के बीच मूल οἶκος और ναός का भेद यथासंभव बनाए रखा गया है।
