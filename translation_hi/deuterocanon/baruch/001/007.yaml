  yaml_path: translation/deuterocanon/baruch/001/007.yaml
  text: and they sent to Jerusalem[a], to Jehoiakim son of Hilkiah, son of Shallum, the priest, and to the priests, and to all the people who were found with him in Jerusalem,
translation:
  language: hi
  text: और उन्होंने यरूशलेम भेजा, याजक यहोयाकीम के पास—जो हिल्कियाह का पुत्र और शल्लूम का पोता था—तथा याजकों और उन सभी लोगों के पास, जो यरूशलेम में उसके[a] साथ पाए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘उसके साथ’ एकवचन है। इस पद में ‘उसके’ का संकेत किसकी ओर है, यह स्पष्ट नहीं; इसे अधिक सामान्य अर्थ में वहाँ उपस्थित लोगों के लिए भी समझा जा सकता है।
    reason: मूल पाठ की व्याकरणिक अस्पष्टता और एकवचन सर्वनाम को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: उन्होंने ... भेजा
  rationale: यूनानी क्रिया का सीधा अर्थ ‘भेजा’ है। मूल की तरह भेजी गई वस्तु को इस पद में अनिर्दिष्ट रखा गया है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यहाँ भेजे जाने की दिशा यरूशलेम की ओर है, पर आगे प्राप्तकर्ताओं को वहीं स्थित बताया गया है; हिंदी वाक्य में ‘यरूशलेम में ... के पास’ स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: πρὸς Ἰωακεὶμ ... τὸν ἱερέα
  choice: याजक यहोयाकीम के पास—जो हिल्कियाह का पुत्र और शल्लूम का पोता था—
  rationale: πρός प्राप्तकर्ता को सूचित करता है। ἱερεύς का अनुवाद ‘याजक’ किया गया है; मूल में ‘महायाजक’ नहीं है। वंशावली को स्वाभाविक हिंदी में पुत्र और पोता कहकर स्पष्ट किया गया है।
- source_word: τοὺς ἱερεῖς
  choice: याजकों
  rationale: ἱερεύς के बहुवचन का सीधा और प्रचलित हिंदी रूप।
- source_word: πάντα τὸν λαόν
  choice: उन सभी लोगों
  rationale: यूनानी सामूहिक पद का सहज आधुनिक हिंदी रूप, जो समग्रता बनाए रखता है।
- source_word: τοὺς εὑρεθέντας
  choice: जो ... पाए गए थे
  rationale: εὑρίσκω के कृदंत का औपचारिक अर्थ सुरक्षित रखा गया है; अधिक व्याख्यात्मक ‘जो उपस्थित थे’ नहीं अपनाया गया।
- source_word: μετ᾽ αὐτοῦ
  choice: उसके साथ
  rationale: प्रेषित यूनानी पाठ में सर्वनाम एकवचन है। उसका पूर्वपद स्पष्ट न होने पर भी इसे बहुवचन बनाकर सामान्यीकृत नहीं किया गया।
