base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/019.yaml
  text: From the day when the Lord brought our fathers out from the land of Egypt until this day[a], we have been disobedient to the Lord our God, and we have been negligent in not listening to his voice.
translation:
  language: hi
  text: जिस दिन प्रभु हमारे पुरखाओं को मिस्र देश से निकाल लाया, उस दिन से लेकर आज तक हम अपने प्रभु परमेश्वर की आज्ञा नहीं मानते आए हैं और उसकी वाणी न सुनने में लापरवाह रहे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “हम उसकी वाणी न सुनने में असावधान रहे हैं।” यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ है और विशेष रूप से हठी विद्रोह के बजाय लापरवाही, असावधानी या उपेक्षा का भाव दे सकती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῆς ἡμέρας ἧς ... καὶ ἕως τῆς ἡμέρας ταύτης
  choice: जिस दिन ... उस दिन से लेकर आज तक
  rationale: यह स्वाभाविक हिन्दी में उस बीते आरम्भ-बिंदु से वर्तमान तक जारी अवधि को स्पष्ट करता है।
- source_word: ἐξήγαγεν
  choice: निकाल लाया
  rationale: यह ‘बाहर लाने’ का अर्थ और मिस्र से निर्गमन की ध्वनि, दोनों बनाए रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यूनानी Κύριος का सीधा और प्रचलित हिन्दी धार्मिक पर्याय है; पाठ में यह इस्राएल के परमेश्वर को सूचित करता है।
- source_word: τοὺς πατέρας ἡμῶν
  choice: हमारे पुरखाओं
  rationale: यह इस्राएल की पिछली पुरुष-पीढ़ियों के संदर्भ को रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐκ γῆς Αἰγύπτου
  choice: मिस्र देश से
  rationale: ‘देश’ γῆς को व्यक्त करता है, जबकि ‘से निकाल लाया’ बाहर आने की प्रस्थानगत शक्ति को स्पष्ट करता है।
- source_word: ἤμεθα ἀπειθοῦντες
  choice: आज्ञा नहीं मानते आए हैं
  rationale: यह निर्गमन से वर्तमान तक चले आ रहे निरंतर अथवा बार-बार के अनाज्ञाकारी आचरण को सहज हिन्दी में व्यक्त करता है।
- source_word: πρὸς Κύριον θεὸν ἡμῶν
  choice: अपने परमेश्वर प्रभु की
  rationale: हिन्दी में ‘आज्ञा मानना’ के साथ संबंधकारक स्वाभाविक है और प्रभु को ‘हमारा परमेश्वर’ बताने वाला वाचाई संबंध सुरक्षित रहता है।
- source_word: ἐσχεδιάζομεν
  choice: लापरवाही करते आए हैं
  rationale: यह दुर्लभ क्रिया संभवतः असावधानी, उपेक्षा या बेपरवाही सूचित करती है। चुना गया रूप जानबूझकर किए विद्रोह का अर्थ आवश्यकता से अधिक प्रबल नहीं बनाता।
- source_word: πρὸς τὸ μὴ ἀκούειν τῆς φωνῆς αὐτοῦ
  choice: उसकी वाणी न सुनने में
  rationale: यह यूनानी रचना के संबंधगत अर्थ को रखता है और ‘वाणी सुनना’ वाली बाइबलीय अभिव्यक्ति को ‘वचन मानना’ में व्याख्यात्मक रूप से नहीं बदलता।
theological_decisions:
- issue: वाचाई संदर्भ में Κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मौजूद यूनानी स्रोत में Κύριος है; इसलिए ‘प्रभु’ स्रोत-रूप को दर्शाता है और पीछे संभावित इब्रानी दिव्य नाम को मुख्य पाठ में पुनर्निर्मित नहीं करता।
- issue: निर्गमन से वर्तमान तक अपराध की निरंतरता
  choice: आज्ञा नहीं मानते आए हैं ... लापरवाही करते आए हैं
  alternative: आज्ञा नहीं मानी ... लापरवाही की
  rationale: परिधीय यूनानी क्रियारूप और ‘आज तक’ जारी या बार-बार दोहराए गए व्यवहार की स्वीकारोक्ति प्रस्तुत करते हैं; हिन्दी का ‘आते आए हैं’ यह अवधि बनाए रखता है।
- issue: ἐσχεδιάζομεν में निहित दोष की तीव्रता
  choice: लापरवाही करते आए हैं
  alternative: हठ करते आए हैं
  rationale: यह दुर्लभ शब्द उपेक्षा या असावधानी का भाव दे सकता है। ‘हठ’ जानबूझकर प्रतिरोध को निश्चित कर देता, जबकि स्रोत की शाब्दिक अनिश्चितता को बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पुरखाओं’, ‘प्रभु’ और ‘वाणी’ बाइबलीय संदर्भ को बनाए रखते हैं, पर वाक्य-विन्यास सहज आधुनिक हिन्दी का है।
