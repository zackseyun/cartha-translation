base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/012.yaml
  text: And the Lord will give us strength and enlighten our eyes[a], and we will live under the shadow of Nebuchadnezzar king of Babylon and under the shadow of Belshazzar his son[b], and we will serve them many days and find favor before them.
translation:
  language: hi
  text: और प्रभु हमें बल देगा और हमारी आँखों को ज्योति देगा; हम बाबिल के राजा नबूकदनेस्सर की छाया में और उसके पुत्र बेलशस्सर की छाया में[a] जीवित रहेंगे। हम बहुत दिनों तक उनकी सेवा करेंगे और उनकी दृष्टि में कृपा पाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘के संरक्षण में’ अथवा ‘के आश्रय में’। यूनानी में शाब्दिक रूप से ‘की छाया में’ है; यह रूपक आश्रय और अधीनता—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके सामने कृपा पाएँगे’। यूनानी मुहावरे का शाब्दिक अर्थ यही है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχύν
  choice: बल
  rationale: यहाँ ἰσχύς ईश्वर से मिलने वाली सामर्थ्य और धैर्य को दर्शाता है। ‘बल’ संक्षिप्त, स्वाभाविक और अर्थ के निकट है।
- source_word: φωτίσει τοὺς ὀφθαλμοὺς ἡμῶν
  choice: हमारी आँखों को ज्योति देगा
  rationale: यह अनुवाद मूल रूपक को बनाए रखता है और पुनर्जीवन, स्पष्टता तथा नई आशा के संभावित भावों को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: ζησόμεθα
  choice: हम ... जीवित रहेंगे
  rationale: ζησόμεθα का सीधा अर्थ ‘हम जीवित रहेंगे’ है। ‘बचे रहेंगे’ संदर्भगत अर्थ हो सकता है, पर वह मूल से अधिक व्याख्यात्मक है।
- source_word: ὑπὸ τὴν σκιὰν
  choice: की छाया में
  rationale: यह रूपक संरक्षण और अधीनता—दोनों का संकेत दे सकता है। ‘छाया में’ इस अर्थगत तनाव को सुरक्षित रखता है।
- source_word: Ναβουχοδονοσὸρ
  choice: नबूकदनेस्सर
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित और पहचाना जाने वाला नाम-रूप।
- source_word: Βαλτασὰρ
  choice: बेलशस्सर
  rationale: हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला नाम-रूप, जो इस बेबीलोनी राजा के सामान्य रूप से मेल खाता है।
- source_word: δουλεύσομεν
  choice: हम ... सेवा करेंगे
  rationale: क्रिया दासत्व या अधीन सेवा को व्यक्त कर सकती है; इस राजनीतिक निर्वासन-संदर्भ में ‘सेवा करेंगे’ स्वाभाविक है और ‘दास बने रहेंगे’ की अपेक्षा कम अतिव्याख्यात्मक है।
- source_word: ἡμέρας πολλὰς
  choice: बहुत दिनों तक
  rationale: कालावधि बताने वाले यूनानी कर्मकारक का स्वाभाविक हिन्दी रूप।
- source_word: εὑρήσομεν χάριν ἐναντίον αὐτῶν
  choice: उनकी दृष्टि में कृपा पाएँगे
  rationale: यह मूल बाइबलीय मुहावरे ‘उनके सामने कृपा पाना’ को अर्थपूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजक साम्राज्यवादी राजाओं की ‘छाया में’ रहने का रूपक
  choice: ‘की छाया में’ रूपक को बनाए रखा गया।
  alternative: ‘के संरक्षण में’ अथवा ‘के शासन के अधीन’
  rationale: यूनानी अभिव्यक्ति आश्रय और राजनीतिक अधीनता दोनों का संकेत दे सकती है। किसी एक अर्थ को चुनने से पद का वास्तविक धार्मिक-राजनीतिक तनाव समाप्त हो जाता।
- issue: δουλεύσομεν में सेवा और दासत्व का संबंध
  choice: ‘हम ... सेवा करेंगे’
  alternative: ‘हम उनके दास रहेंगे’ अथवा ‘हम उनके अधीन रहेंगे’
  rationale: निर्वासन के इस संदर्भ में राजकीय अधीनता स्पष्ट है, पर वाक्य स्वयं दास-प्रथा को प्रमुख विषय नहीं बनाता। ‘सेवा करेंगे’ मूल क्रिया की व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘आँखों को ज्योति देना’ और ‘छाया में’ जैसे मूल रूपक सुरक्षित रखे गए हैं; वाक्य को हिन्दी में पठनीय बनाने के लिए दो वाक्यों में विभाजित किया गया है।
