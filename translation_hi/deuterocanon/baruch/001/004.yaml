  naturalness: “सामर्थी लोगों” is awkward in contemporary Hindi, and “प्राचीनों” can be understood as ancient persons/things rather than community elders. “प्रभावशाली लोगों” and “बुज़ुर्गों” are clear, dignified, and natural in public reading.
  terminology: “राजाओं के पुत्रों” properly preserves the relational wording without imposing the title “राजकुमार.” “बुज़ुर्गों” communicates the recognized senior/community-leader sense of πρεσβύτεροι in idiomatic modern Hindi. “सूद” should remain a transliteration, with its uncertainty noted.
