    rationale: The Greek denotes the powerful or socially prominent. “प्रभावशाली लोग” preserves this breadth in modern Hindi without introducing a narrower hereditary rank.
  - severity: medium
    issue: “प्राचीनों” is not a clear modern-Hindi rendering of τῶν πρεσβυτέρων.
    rationale: In current Hindi it can suggest ‘ancient ones’ rather than recognized elders. “बुज़ुर्गों” is idiomatic and retains the communal-senior sense.
  - severity: low
    issue: The location clause is more clearly attached to “all the people” when placed after that group as a dash clause.
    rationale: This reflects πάντων τῶν κατοικούντων ἐν Βαβυλῶνι while keeping the long Hindi sentence readily intelligible.
