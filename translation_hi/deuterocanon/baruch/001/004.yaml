  text: and in the hearing of the nobles and the sons of kings[a], and in the hearing of the elders, and in the hearing of all the people, from the least to the greatest[d][c][b], all who were dwelling in Babylon by the river Sud.
translation:
  language: hi
  text: और इसे प्रभावशाली लोगों और राजाओं के पुत्रों[a], बुज़ुर्गों, तथा छोटे से बड़े तक सभी लोगों को पढ़कर सुनाया गया—उन सबको जो बाबुल में सूद नदी के किनारे रहते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजकुमारों”; यूनानी में शाब्दिक रूप से “राजाओं के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: “सूद” यूनानी पाठ में दिए नदी-नाम का लिप्यंतरण है; इस नदी की ठीक पहचान अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ὠσίν / ἐν ὠσὶ
  choice: को … सुनाया गया
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘कानों में’ है। पूर्वपद के क्रियात्मक संदर्भ में यह बताता है कि पुस्तक इन समूहों को सुनाकर पढ़ी गई; हिन्दी में यह रूप स्वाभाविक है और बार-बार आए मुहावरे को बोझिल ढंग से नहीं दोहराता।
- source_word: τῶν δυνατῶν
  choice: सामर्थी लोगों
  rationale: δυνατοί शक्तिशाली, प्रभावशाली अथवा प्रतिष्ठित व्यक्तियों को सूचित कर सकता है। ‘सामर्थी लोग’ इस व्यापकता को बनाए रखता है और ‘कुलीन’ जैसे अधिक विशिष्ट सामाजिक वर्ग को आरोपित नहीं करता।
- source_word: υἱῶν τῶν βασιλέων
  choice: राजाओं के पुत्रों
  rationale: यूनानी संबंधसूचक बहुवचन को सीधे रखा गया है; ‘राजकुमारों’ से संभावित पदवी का अनावश्यक आरोपण होता।
- source_word: τῶν πρεσβυτέρων
  choice: प्राचीनों
  rationale: यहाँ शब्द समुदाय के मान्य वरिष्ठ अगुओं के लिए प्रयुक्त है, केवल अधिक आयु वाले पुरुषों के लिए नहीं। ‘प्राचीन’ बाइबलीय-सामुदायिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: छोटे से लेकर बड़े तक
  rationale: स्रोत का व्यापक सामाजिक समावेश दर्शाने वाला युग्म लगभग शाब्दिक रूप में सुरक्षित है; इसे केवल आयु-संबंधी ‘बच्चे से बूढ़े तक’ नहीं बनाया गया।
- source_word: πάντων τῶν κατοικούντων ἐν Βαβυλῶνι
  choice: उन सबको जो बाबुल में … रहते थे
  rationale: कृदन्तीय वाक्यांश को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में रखा गया है और ‘सब’ का समावेशी बल सुरक्षित है।
- source_word: ἐπὶ ποταμοῦ Σούδ
  choice: सूद नदी के किनारे
  rationale: ἐπί + संबंधकारक यहाँ नदी के पास अथवा तट पर निवास का स्थान बताता है। अनिश्चित नदी-नाम को यूनानी के अनुसार लिप्यंतरित किया गया है।
