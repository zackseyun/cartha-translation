  yaml_path: translation/deuterocanon/baruch/001/003.yaml
  text: And Baruch read the words of this book in the hearing of Jeconiah son of Jehoiakim, king of Judah, and in the hearing of all the people who came to the book,
translation:
  language: hi
  text: और बारूक ने इस पुस्तक के शब्द यहूदा के राजा यहोयाकीम के पुत्र यकोन्याह[b] के सुनते हुए, और उन सब लोगों के सुनते हुए पढ़े, जो पुस्तक के पास आए थे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जो पाठ सुनने आए थे” अथवा “जो ग्रंथ-पत्र के पास आए थे।” यूनानी पदबंध “पुस्तक के पास आए” असामान्य है, इसलिए अधिक व्याख्यात्मक अनुवाद भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: यकोन्याह यूनानी रूप पर आधारित नाम है; इसी राजा को इब्रानी नाम के आधार पर प्रायः यहोयाकीन भी कहा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέγνω
  choice: पढ़े
  rationale: क्रिया का मूल अर्थ ‘पढ़ना’ है। श्रोताओं के सुनते हुए पढ़ने का उल्लेख सार्वजनिक मौखिक पाठ को पर्याप्त रूप से स्पष्ट करता है, इसलिए ‘पढ़कर सुनाए’ जैसी अतिरिक्त स्पष्टता आवश्यक नहीं है।
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: इस पुस्तक के वचन
  rationale: ‘वचन’ लिखित रचना के शब्दों को व्यक्त करता है और λόγους की औपचारिक छवि बनाए रखता है; ‘पुस्तक’ आधुनिक पाठक के लिए स्वाभाविक है, यद्यपि मूल शब्द पुस्तक या ग्रंथ-पत्र दोनों को सूचित कर सकता है।
- source_word: ἐν ὠσὶν
  choice: के सुनते हुए
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘कानों में’ है। हिन्दी में ‘के सुनते हुए’ उसके श्रव्य और सार्वजनिक स्वरूप को सहज ढंग से व्यक्त करता है।
- source_word: Ἰεχονίου
  choice: यकोन्याह
  rationale: यह यूनानी नाम-रूप का निकट हिन्दी लिप्यंतरण है और प्रचलित बाइबलीय नाम-रूप से भी मेल खाता है।
- source_word: τῶν ἐρχομένων πρὸς τὴν βίβλον
  choice: जो पुस्तक के पास आए थे
  rationale: यह असामान्य यूनानी पदबंध के ठोस शब्द ‘पुस्तक’ को बनाए रखता है और अर्थ को चुपचाप ‘पाठ सुनने’ में नहीं बदलता। हिन्दी में पूर्व आगमन के प्रसंग को ‘आए थे’ स्वाभाविक रूप से व्यक्त करता है।
