  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्य के अंत में अल्पविराम रखा गया है, क्योंकि स्रोत-पाठ में यह वाक्य अगले पद में जारी रहता है। असामान्य ‘पुस्तक के पास’ को मूल की वास्तविक अस्पष्टता बचाने के लिए मुख्य पाठ में रखा गया है और पादटिप्पणी में सम्भावनाएँ दी गई हैं।
