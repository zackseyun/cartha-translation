base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/011.yaml
  text: And pray for the life of Nebuchodonosor king of Babylon[a], and for the life of Baltasar his son[b], so that their days may be like the days of heaven upon the earth.
translation:
  language: hi
  text: और बाबुल के राजा नबूखोदोनोसोर और उसके पुत्र बाल्तासार[b] के जीवन के लिए प्रार्थना करो, ताकि उनके दिन पृथ्वी पर आकाश के दिनों के समान हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थ को अधिक मुहावरेदार ढंग से यह भी कहा जा सकता है: “उनके दिन लंबे हों, जैसे पृथ्वी के ऊपर आकाश बना रहता है।” यूनानी पाठ दीर्घ जीवन के लिए एक सजीव रूपक रखता है।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में नाम नबूखोदोनोसोर और बाल्तासार हैं; अन्य बाइबलीय परंपराओं में इनके अधिक परिचित नाम-रूप मिलते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύξασθε
  choice: प्रार्थना करो
  rationale: यह बहुवचन आज्ञार्थक क्रिया है। ‘प्रार्थना करो’ उसके सीधे आह्वान और स्वाभाविक आधुनिक हिन्दी, दोनों को बनाए रखता है।
- source_word: περὶ τῆς ζωῆς
  choice: जीवन के लिए
  rationale: περί के साथ संबंधकारक यहाँ किसी के जीवन की ओर से की जाने वाली प्रार्थना बताता है। ‘जीवन के लिए’ ζωή के स्पष्ट अर्थ को बनाए रखता है; ‘कुशल-क्षेम के लिए’ अधिक व्याख्यात्मक होता।
- source_word: Ναβουχοδονοσὸρ
  choice: नबूखोदोनोसोर
  rationale: यह यूनानी नाम का सीधा देवनागरी लिप्यंतरण है; इसे अधिक परिचित इब्रानी-आधारित रूप से मिलाया नहीं गया है।
- source_word: Βαλτασὰρ
  choice: बाल्तासार
  rationale: यह यूनानी Βαλτασάρ का निकट देवनागरी लिप्यंतरण है और किसी अन्य पाठ-परंपरा के अधिक परिचित नाम-रूप को आरोपित नहीं करता।
- source_word: ἵνα ὦσιν αἱ ἡμέραι αὐτῶν
  choice: ताकि ... उनके दिन ... हों
  rationale: ‘ताकि’ ἵνα के प्रयोजन-सूचक भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς
  choice: पृथ्वी पर उनके दिन आकाश के दिनों के समान हों
  rationale: यह असामान्य किन्तु सजीव यूनानी रूपक को सुरक्षित रखता है और उसे केवल ‘बहुत लंबे हों’ कहकर व्याख्यात्मक ढंग से सपाट नहीं करता।
theological_decisions:
- issue: अंतिम वाक्यांश को दीर्घायु के मुहावरे के रूप में स्पष्ट करना या उसके रूपक को बनाए रखना
  choice: ‘पृथ्वी पर उनके दिन आकाश के दिनों के समान हों’ कहकर रूपक बनाए रखा गया।
  alternative: ‘पृथ्वी पर उनके दिन बहुत लंबे हों’ या ‘जब तक आकाश पृथ्वी के ऊपर है, तब तक उनके दिन बने रहें।’
  rationale: यूनानी पाठ का बिंब जानबूझकर सजीव और शास्त्रीय प्रतिध्वनि वाला है। उसे सुरक्षित रखने से वास्तविक अर्थ-संभावना और काव्यात्मक तनाव बना रहता है।
- issue: राजकीय नामों को परिचित बाइबलीय रूपों में सामान्य करना या यूनानी साक्ष्य से लिप्यंतरित करना
  choice: यूनानी रूपों से ‘नबूखोदोनोसोर’ और ‘बाल्तासार’।
  alternative: अधिक परिचित परंपरागत नाम-रूपों का प्रयोग।
  rationale: मूल यूनानी साक्ष्य की प्राथमिकता बनाए रखने के लिए नाम सीधे उसी से लिप्यंतरित किए गए हैं; सामान्यीकरण पाठ-परंपराओं के भेद को छिपा सकता था।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। राजकीय नामों का यूनानी से सीधा लिप्यंतरण किया गया है, जबकि अंतिम उपवाक्य की असामान्य रूपकात्मक बनावट को हिन्दी में समझने योग्य सीमा तक सुरक्षित रखा गया है।
