- source_word: υἱοῦ Μαασαίου υἱοῦ Σεδεκίου υἱοῦ Ἀσαδίου υἱοῦ Χελκίου
  choice: नेरियाह मासेयाह का पुत्र, मासेयाह सिदकियाह का पुत्र, सिदकियाह हसद्याह का पुत्र और हसद्याह हिल्कियाह का पुत्र था
  rationale: यूनानी की लगातार संबंधकारक वंशावली को हिन्दी में स्पष्ट पूर्ण वाक्यों के रूप में खोला गया है, पर प्रत्येक ‘पुत्र’ संबंध ज्यों का त्यों रखा गया है।
