  text: और ये उस पुस्तक के वचन हैं जिन्हें बाबेल में नेरियाह के पुत्र बारूक ने लिखा, जो मासेयाह का पुत्र था, जो सिदकियाह का पुत्र था, जो हसद्याह[a] का पुत्र था, जो हिल्कियाह का पुत्र था।
