    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  choice: धन
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, पर भेजी गई वस्तु से बलि-सामग्री खरीदने के लेन-देन वाले संदर्भ में ‘धन’ स्वाभाविक और सटीक है।
- source_word: ἀγοράσατε
  choice: मोल लेना
  rationale: खरीदने की आज्ञा को स्पष्ट, सामान्य और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὁλοκαυτώματα
  choice: होमबलियाँ
  rationale: पूरी तरह आग में जलाई जाने वाली बलियों के लिए यह प्रचलित बाइबलीय हिन्दी पद है।
- source_word: περὶ ἁμαρτίας
  choice: पापबलियाँ
