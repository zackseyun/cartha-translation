  text: And they said[a], ‘Behold, we have sent you money; and with the money buy burnt offerings and sin offerings and frankincense, and prepare a grain offering and offer them on the altar of the Lord our God,’
translation:
  language: hi
  text: और उन्होंने कहा, “देखो, हमने तुम्हारे पास धन भेजा है। उस धन से होमबलियाँ, पापबलियाँ और लोबान मोल लेना; अन्नबलि[a] तैयार करना और उन्हें हमारे प्रभु परमेश्वर की वेदी पर चढ़ाना।”
  philosophy: optimal-equivalence
  footnotes:
