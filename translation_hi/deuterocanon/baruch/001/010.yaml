- source_word: ποιήσατε μάννα
  choice: अन्नबलि तैयार करना
  rationale: यहाँ μάννα मरुभूमि के ‘मन्ना’ भोजन के बजाय अन्न से बनी बलि के अर्थ में समझा गया है; टिप्पणी में संभावित भ्रम स्पष्ट किया गया है।
- source_word: ἀνοίσατε
  choice: चढ़ाना
  rationale: वेदी पर बलि अर्पित करने की उपासना-संबंधी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: बलिदान चढ़ाने के स्थान के लिए मानक हिन्दी बाइबलीय पद।
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: हमारे प्रभु परमेश्वर
  rationale: यूनानी संबंधकारक रचना को स्वाभाविक हिन्दी में रखते हुए κύριος को ‘प्रभु’ के रूप में अनूदित करता है।
theological_decisions:
- issue: इस यूनानी यहूदी ग्रंथ में इस्राएल के परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक स्रोत में Κυρίου है, स्पष्ट हिब्रू चतुरक्षर नहीं; इसलिए ‘प्रभु’ स्रोत-साक्ष्य को सुरक्षित रखता है और ‘यहोवा’ को बिना आधार नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सुबोध किंतु उपासना-संबंधी प्रसंग के अनुरूप गरिमापूर्ण। ‘देखो’ ने Ἰδοὺ की ध्यान आकर्षित करने वाली शक्ति को स्वाभाविक हिन्दी में रखा है। आज्ञाओं के लिए आदरसूचक बहुवचन के अनुरूप क्रियारूप प्रयुक्त हैं।
