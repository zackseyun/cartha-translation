  source_fidelity: The draft accurately represents the directive future of ἀναγνώσεσθε, the dispatched book, the Lord's house, and the singular feast day followed by the unusual plural expression ἐν ἡμέραις καιροῦ. The purpose infinitive ἐξαγορεῦσαι is retained as proclamation. The revised wording makes the relation of public reading and proclamation clearer without adding a doctrinal interpretation.
  naturalness: ‘तुम ... पढ़ना’ is an acceptable directive in modern Hindi, but ‘पुस्तक को ... घोषित करने के लिए पढ़ना’ is syntactically cumbersome and can suggest that the physical book itself is being proclaimed. ‘इसका पाठ ... करना’ is idiomatic for a formal public reading and allows the proclamation purpose to modify the reading naturally.
  terminology: ‘प्रभु के भवन’ appropriately preserves οἶκος Κυρίου without introducing the divine name or reducing the phrase to a merely architectural ‘temple.’ ‘पर्व’ and ‘नियत अवसर’ suit the calendrical context. The deliberately unusual ‘नियत अवसरों के दिनों’ is retained in the main text and explained in the note.
