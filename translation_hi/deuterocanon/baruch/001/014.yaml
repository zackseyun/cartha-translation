    reason: स्रोत की असामान्य अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखते हुए स्वाभाविक विकल्प देना।
lexical_decisions:
- source_word: ἀναγνώσεσθε
  choice: पढ़ना
  rationale: भविष्यत् रूप यहाँ निर्देश का भाव देता है। हिंदी में अनौपचारिक भविष्यत् आज्ञार्थक ‘पढ़ना’ इस निर्देश को स्वाभाविक रूप से व्यक्त करता है; सार्वजनिक प्रसंग से ऊँचे स्वर में पढ़ना निहित है, पर उसे अलग से जोड़ा नहीं गया।
- source_word: τὸ βιβλίον τοῦτο
  choice: इस पुस्तक को
  rationale: βιβλίον पुस्तक, ग्रंथ या लिखित दस्तावेज़ को सूचित कर सकता है। ‘पुस्तक’ आधुनिक हिंदी में सहज है और सामग्री के भौतिक रूप को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: ἀπεστείλαμεν πρὸς ὑμᾶς
  choice: जो हमने तुम्हारे पास भेजी है
  rationale: अओरिस्ट पूर्ण हो चुके भेजने के कार्य को बताता है। हिंदी पूर्ण पक्ष वर्तमान निर्देश से उसके संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐξαγορεῦσαι
  choice: घोषित करने के लिए
  rationale: यह उद्देश्यसूचक क्रियारूप है और सार्वजनिक रूप से कह सुनाने या घोषित करने का भाव रखता है। उपासना-स्थल में सार्वजनिक पठन के संदर्भ में ‘घोषित करना’ औपचारिक सार्वजनिक संप्रेषण को बनाए रखता है।
- source_word: ἐν οἴκῳ Κυρίου
  choice: प्रभु के भवन में
  rationale: यह मंदिर या पवित्रस्थान के लिए बाइबिलीय पदबंध है। ‘प्रभु का भवन’ स्रोत की उपमा को बनाए रखता है, जबकि केवल ‘मंदिर’ कहने से उसका रूपक खो जाता।
- source_word: ἐν ἡμέρᾳ ἑορτῆς
  choice: पर्व के दिन
  rationale: ἑορτή धार्मिक पर्व या उत्सव को दर्शाता है। ‘पर्व के दिन’ आधुनिक हिंदी में स्पष्ट और धार्मिक पंचांग के अनुरूप है।
- source_word: ἐν ἡμέραις καιροῦ
  choice: नियत अवसरों के दिनों में
  rationale: καιρός उचित, नियत या ठहराए हुए समय को दर्शा सकता है। यूनानी पदबंध असामान्य है; यह अनुवाद उसकी ‘दिनों’ और ‘नियत समय’ दोनों धारणाओं को बनाए रखता है।
theological_decisions:
- issue: Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी स्रोत में Κυρίου है, प्रत्यक्ष रूप से इब्रानी दिव्य नाम नहीं। इसलिए ‘प्रभु’ पाठ से सबसे सीधे जुड़ा और धार्मिक रूप से तटस्थ अनुवाद है।
