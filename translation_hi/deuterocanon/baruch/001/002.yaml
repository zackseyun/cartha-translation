translation:
  language: hi
  text: पाँचवें वर्ष में, महीने के सातवें दिन,[a] उस समय जब कसदियों ने यरूशलेम पर अधिकार कर लिया और उसे आग से जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘महीने के सातवें में’ है; यहाँ सामान्य संक्षिप्त तिथि-वाक्यांश का अर्थ ‘महीने के सातवें दिन’ समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ πέμπτῳ
  choice: पाँचवें वर्ष में
  rationale: ἐν सहित कालवाचक पद का स्वाभाविक और मूल के निकट हिन्दी रूप।
- source_word: ἐν ἑβδόμῃ τοῦ μηνός
  choice: महीने के सातवें दिन
  rationale: स्त्रीलिंग क्रमवाचक ἑβδόμῃ में ἡμέρᾳ ('दिन') अध्याहृत है; यह सामान्य तिथि-सूचक प्रयोग है, सातवें महीने का उल्लेख नहीं।
- source_word: ἐν τῷ καιρῷ ᾧ
  choice: उस समय जब
  rationale: καιρός की स्पष्ट कालवाचकता को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἔλαβον
  choice: अधिकार कर लिया
  rationale: नगर के संदर्भ में λαμβάνω का सैन्य अर्थ है; यह 'ले लिया' से अधिक स्पष्ट है और 'जीत लिया' की अपेक्षा मूल क्रिया के व्यापक भाव के निकट है।
- source_word: οἱ Χαλδαῖοι
  choice: कसदियों
  rationale: यूनानी जातिनाम Χαλδαῖοι का परंपरागत और पाठ-सटीक हिन्दी रूप; इसे व्याख्यात्मक रूप से 'बाबेलवासियों' नहीं बनाया गया।
- source_word: ἐνέπρησαν αὐτὴν ἐν πυρί
  choice: उसे आग से जला दिया
  rationale: क्रिया और साधनवाचक ἐν πυρί दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; पूर्णतः भस्म कर देने का अतिरिक्त भाव नहीं जोड़ता।
