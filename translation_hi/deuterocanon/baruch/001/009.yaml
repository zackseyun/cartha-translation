  yaml_path: translation/deuterocanon/baruch/001/009.yaml
  text: after Nebuchadnezzar king of Babylon had taken Jeconiah and the rulers and the prisoners and the mighty men and the people of the land from Jerusalem into exile[a], and had brought him to Babylon.
translation:
  language: hi
  text: जब बाबुल का राजा नबूकदनेस्सर यकोन्याह, शासकों, बंदियों, सामर्थी पुरुषों और देश के लोगों को यरूशलेम से निर्वासन में ले गया था और उसे बाबुल ले आया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ एकवचन ‘उसे’ है, जो संभवतः विशेष रूप से यकोन्याह की ओर संकेत करता है; कुछ पाठक इसका आशय निर्वासित किए गए पूरे समूह के लिए ‘उन्हें’ समझ सकते हैं।
    reason: अंतिम सर्वनाम के एकवचन रूप और संभावित व्यापक अर्थ को पारदर्शी रखना।
lexical_decisions:
- source_word: μετὰ τὸ ἀποικίσαι
  choice: जब ... निर्वासन में ले गया था
  rationale: μετά के साथ प्रयुक्त substantival infinitive यहाँ पूर्वकालिक परिस्थिति बताता है। हिंदी में ‘जब ... ले गया था’ आश्रित वाक्य के रूप में स्वाभाविक है और ἀποικίζω के निर्वासित करने के कारक भाव को बनाए रखता है।
- source_word: Ναβουχοδονοσὸρ βασιλέα Βαβυλῶνος
  choice: बाबुल का राजा नबूकदनेस्सर
  rationale: उपाधि और नाम को आधुनिक हिंदी बाइबलीय प्रचलन के अनुसार रखा गया है; संबंधकारक Βαβυλῶνος का सीधा अर्थ ‘बाबुल का’ है।
- source_word: τὸν Ἰεχονίαν
  choice: यकोन्याह
  rationale: यह यूनानी Ἰεχονίας से निकट रूप है और इसे भिन्न इब्रानी नाम-रूप ‘यहोयाकीन’ में समरस नहीं करता।
- source_word: τοὺς ἄρχοντας
  choice: शासकों
  rationale: ἄρχοντες शासन या नेतृत्व करने वाले व्यक्तियों को दर्शाता है; ‘शासक’ इसके राजनीतिक भाव को बिना पद विशेष निर्धारित किए व्यक्त करता है।
- source_word: τοὺς δεσμώτας
  choice: बंदियों
  rationale: δεσμώτης मूलतः बंधन या कैद में पड़े व्यक्ति को दर्शाता है। ‘बंदी’ निर्वासितों से अलग इस स्रोत-शब्द की विशेषता बचाता है।
- source_word: τοὺς δυνατοὺς
  choice: सामर्थी पुरुषों
  rationale: δυνατοί सामाजिक, राजनीतिक या सैनिक रूप से प्रभावशाली पुरुषों को सूचित कर सकता है। ‘सामर्थी पुरुष’ इसकी व्यापकता और पुल्लिंग बहुवचन दोनों बनाए रखता है।
- source_word: τὸν λαὸν τῆς γῆς
  choice: देश के लोगों
  rationale: यह यूनानी पदबंध का पारदर्शी अनुवाद है। ‘साधारण लोग’ जैसा सामाजिक अर्थ संभव है, पर स्रोत में स्पष्ट न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἀπὸ Ἰερουσαλήμ
  choice: यरूशलेम से
  rationale: निर्वासन के आरंभ-स्थान को सीधे व्यक्त करता है।
- source_word: καὶ ἤγαγεν αὐτὸν εἰς Βαβυλῶνα
  choice: और उसे बाबुल पहुँचा दिया था
  rationale: αὐτόν स्पष्ट रूप से एकवचन ‘उसे’ है और स्वाभाविक रूप से यकोन्याह की ओर संकेत करता है। ‘पहुँचा दिया’ ἤγαγεν के कारक गतिशील भाव को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में सर्वनाम का वचन
  choice: मुख्य पाठ में एकवचन ‘उसे’ रखा गया।
  alternative: बहुवचन ‘उन्हें’, जिससे निर्वासित किए गए पूरे समूह का बोध हो।
  rationale: प्रदत्त यूनानी पाठ में αὐτόν एकवचन है और उसका निकटतम स्वाभाविक संदर्भ यकोन्याह है। सूची के कारण बहुवचन अर्थ अपेक्षित लग सकता है, इसलिए उसे चुपचाप बदलने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद स्रोत की तरह एक आश्रित कालवाचक वाक्य है, इसलिए अंत में पूर्णविराम होने पर भी इसका कथात्मक संबंध अगले पद से है। नामों में प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं और यूनानी की वास्तविक एकवचन अस्पष्टता सुरक्षित रखी गई है।
