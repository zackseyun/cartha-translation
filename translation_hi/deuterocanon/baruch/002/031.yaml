  rationale: भविष्यकाल के अर्थ को सीधे और स्वाभाविक रूप में व्यक्त करता है तथा पहचान और संबंधपरक ज्ञान की संभावित गहराई को सीमित नहीं करता।
- source_word: Κύριος
