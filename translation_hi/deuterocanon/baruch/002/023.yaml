base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/023.yaml
  text: I will cause the sound of gladness and the sound of rejoicing to cease from the cities of Judah and from the outskirts of Jerusalem[a], the sound of bridegroom and the sound of bride[b], and all the land will become impassable because of its inhabitants.
translation:
  language: hi
  text: मैं यहूदा के नगरों और यरूशलेम के बाहर से[a] हर्ष की ध्वनि और आनंद की ध्वनि, दूल्हे की ध्वनि और दुल्हन की ध्वनि बंद कर दूँगा; और अपने निवासियों के कारण सारी भूमि अगम्य हो जाएगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “यरूशलेम के बाहर से” है। कुछ अनुवाद समानांतर भविष्यद्वाणी-सूत्रों के प्रभाव में इसे “यरूशलेम की गलियों से” करते हैं, पर उपलब्ध यूनानी पाठ में “बाहर” लिखा है।
    reason: alternative_reading
  - marker: b
    text: 'अंतिम वाक्यांश यूनानी में कठिन है। इसका अर्थ यह भी हो सकता है: “सारी भूमि अगम्य और निवासियों से रहित हो जाएगी” या “सारी भूमि निवासियों से खाली हो जाएगी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλείψειν ποιήσω
  choice: बंद कर दूँगा
  rationale: ποιέω और क्रिया के अनंत रूप का यह प्रयोग स्पष्ट कारकता व्यक्त करता है। हिंदी में “बंद कर दूँगा” न्याय करने वाले कर्ता की सक्रिय भूमिका को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐκ πόλεων Ἰούδα καὶ ἔξωθεν Ἰερουσαλήμ
  choice: यहूदा के नगरों और यरूशलेम के बाहर से
  rationale: ἔξωθεν का सामान्य अर्थ “बाहर से” है। मूल यूनानी में “गलियों” का शब्द नहीं है, इसलिए परिचित समानांतर वचनों से सामंजस्य बैठाने के बजाय उपलब्ध पाठ की अभिव्यक्ति रखी गई है।
- source_word: φωνὴν εὐφροσύνης καὶ φωνὴν χαρμοσύνης
  choice: हर्ष और आनंद की आवाज़
  rationale: φωνή यहाँ उत्सव की सुनाई देने वाली ध्वनि या आवाज़ है। निकटार्थी εὐφροσύνη और χαρμοσύνη को “हर्ष” और “आनंद” कहकर काव्यात्मक युग्म बनाए रखा गया है।
- source_word: φωνὴν νυμφίου καὶ φωνὴν νύμφης
  choice: दूल्हे और दुल्हन की आवाज़
  rationale: यह पूर्ववर्ती φωνή की पुनरावृत्ति जारी रखता है और विवाहोत्सव के समाप्त हो जाने का स्वाभाविक हिंदी चित्र प्रस्तुत करता है।
- source_word: ἔσται πᾶσα ἡ γῆ εἰς ἄβατον
  choice: सारी भूमि अगम्य हो जाएगी
  rationale: ἄβατος का मूल भाव ऐसी जगह का है जिस पर चला या जिसे पार नहीं किया जा सकता। “अगम्य” इस विशिष्ट अर्थ को सामान्य “उजाड़” की अपेक्षा बेहतर बनाए रखता है।
- source_word: ἀπὸ ἐνοικούντων
  choice: अपने निवासियों के कारण
  rationale: यूनानी वाक्यांश कठिन और अर्थ की दृष्टि से संदिग्ध है। यह रूप ἀπό के कारण-संबंधी बल को निकटता से दर्शाता है, जबकि “निवासियों से रहित” वाला संभव अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या पाठ को यिर्मयाह में मिलने वाले अधिक परिचित न्याय-वचन के अनुरूप बनाया जाए
  choice: उपलब्ध यूनानी पाठ के “यरूशलेम के बाहर” और कठिन अंतिम वाक्यांश को बनाए रखना
  alternative: समानांतर भविष्यद्वाणी के आधार पर “यरूशलेम की गलियों से” और “निवासियों से रहित” लिखना
  rationale: मूल साक्ष्य को परिचित परंपरागत सूत्र के अनुसार चुपचाप बदलना उचित नहीं है। जहाँ यूनानी अभिव्यक्ति कठिन है, वहाँ मुख्य पाठ में उसकी कठिनाई रखकर संभावित दूसरा अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “अगम्य” अपेक्षाकृत साहित्यिक शब्द है, पर यहाँ ἄβατος के सटीक अर्थ—जिसे पार न किया जा सके—को संक्षेप में व्यक्त करता है।
