  text: क्योंकि मैं जानता था कि वे मेरी बात बिलकुल नहीं सुनेंगे, क्योंकि वे हठीले लोग हैं; पर अपने निर्वासन के देश में वे अपने मन की ओर लौटेंगे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे इसे मन में उतारेंगे”; अथवा, “वे अपने मन में लौटेंगे।” यूनानी का शाब्दिक अर्थ है, “वे अपने हृदय की ओर लौटेंगे।”
    reason: मूल यूनानी अभिव्यक्ति से मन में बात बैठने, अंतर्मुखी होने या मन फिराने—इन निकट अर्थों की संभावना है।
