- source_word: λαὸς σκληροτράχηλος
  choice: हठीले लोग
  rationale: शाब्दिक रूप ‘कठोर गर्दनवाले’ है, पर आधुनिक हिन्दी में ‘हठीले’ उसी रूपक का स्पष्ट और स्वाभाविक आशय देता है।
- source_word: ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν
  choice: वे अपने मन की ओर लौटेंगे
  rationale: यह असामान्य अभिव्यक्ति मूल के हृदय/अंतरात्मा की ओर लौटने वाले रूपक और उसकी वास्तविक अस्पष्टता को बनाए रखती है; ‘मन फिराएँगे’ कहने से पश्चात्ताप का अर्थ अधिक निश्चित हो जाता।
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  choice: अपने निर्वासन के देश में
  rationale: ἀποικισμός यहाँ स्वदेश से हटाकर परदेश में बसाए जाने की दशा बताता है; ‘निर्वासन’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: ‘अपने मन की ओर लौटेंगे’ का मुहावरेदार और धार्मिक आशय
  choice: मुख्य पाठ में मूल रूपक को बनाए रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिए गए।
  alternative: ‘वे इसे मन में उतारेंगे’ या ‘वे मन फिराएँगे’
  rationale: ग्रीक में लौटने/मुड़ने की क्रिया और ‘हृदय’ का स्पष्ट उल्लेख है, पर पश्चात्ताप के लिए अधिक प्रत्यक्ष शब्द नहीं है। इसलिए अंतर्मुखी परिवर्तन का संकेत रखा गया, उसे पूर्णतः स्पष्ट पश्चात्ताप में नहीं बदला गया।
