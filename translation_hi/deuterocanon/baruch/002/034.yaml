  yaml_path: translation/deuterocanon/baruch/002/034.yaml
  text: and I will bring them back to the land that I swore to their fathers—to Abraham and Isaac and Jacob—and they will rule over it; and I will multiply them[a], and they will certainly not be diminished.
translation:
  language: hi
  text: और मैं उन्हें उस देश में वापस ले आऊँगा, जिसे मैंने उनके पूर्वजों—अब्राहम, इसहाक और याकूब—को देने की शपथ खाई थी; वे उस पर प्रभुत्व करेंगे[a]। मैं उनकी संख्या बढ़ाऊँगा, और उनकी संख्या कभी कम न होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर अधिकार करेंगे।” यूनानी क्रिया का अर्थ प्रभुत्व करना या अधिकार में रखना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψω
  choice: वापस ले आऊँगा
  rationale: यहाँ सकर्मक भाव किसी को फिर उसी देश में पहुँचाने का है; यह हिन्दी में स्वाभाविक रहते हुए वापसी की गति को स्पष्ट करता है।
- source_word: γῆν
  choice: देश
  rationale: अब्राहम, इसहाक और याकूब से जुड़ी शपथ के संदर्भ में यह पूरी पृथ्वी नहीं, एक निश्चित देश को सूचित करता है।
- source_word: ὤμοσα
  choice: शपथ खाई थी
  rationale: क्रिया प्रतिज्ञा मात्र नहीं, शपथ लेने को स्पष्ट रूप से व्यक्त करती है; हिन्दी पदबंध उसके वाचाई और वाचा-संबंधी बल को बनाए रखता है।
- source_word: πατράσιν
  choice: पूर्वजों
  rationale: आधुनिक हिन्दी में ‘पिताओं’ इस संदर्भ में अस्वाभाविक और भ्रमकारी हो सकता है। साथ दिए गए अब्राहम, इसहाक और याकूब के नाम पितृपुरुषों की विशिष्ट पहचान बनाए रखते हैं।
- source_word: κυριεύσουσιν
  choice: अधिकार करेंगे
  rationale: यह पद प्रभुत्व स्थापित करने और अधिकार में लेने—दोनों निकट भावों को हिन्दी में समेट सकता है और केवल साधारण निवास का अर्थ नहीं देता।
- source_word: πληθυνῶ
  choice: उनकी संख्या बढ़ाऊँगा
  rationale: ‘बहुगुणित करूँगा’ की अपेक्षा यह साधारण आधुनिक हिन्दी में अधिक स्वाभाविक है और लोगों की संख्यात्मक वृद्धि का आशय स्पष्ट रखता है।
- source_word: οὐ μὴ σμικρυνθῶσιν
  choice: निश्चय ही घटने न पाएँगे
  rationale: ‘निश्चय ही’ यूनानी के प्रबल निषेध को व्यक्त करता है, और ‘घटने न पाएँगे’ जनसंख्या के कम न होने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: पितृपुरुषों से खाई गई शपथ पर आधारित पुनर्स्थापना
  choice: शपथ और अब्राहम, इसहाक तथा याकूब के नाम मुख्य पाठ में स्पष्ट रखे गए
  alternative: इसे सामान्य रूप में ‘पूर्वजों से किए गए वादे’ के रूप में कहना
  rationale: मूल पाठ पुनर्वापसी को परमेश्वर की विशिष्ट शपथ से जोड़ता है। नामों और शपथ की भाषा को बनाए रखना इस संबंध को सुरक्षित रखता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
- issue: κυριεύσουσιν में प्रभुत्व और अधिकार-ग्रहण के बीच अर्थ-तनाव
  choice: ‘उस पर अधिकार करेंगे’
  alternative: ‘उस पर शासन करेंगे’ या ‘उसके अधिकारी होंगे’
  rationale: चुना हुआ रूप भूमि पर प्रभुत्व और उसे अधिकार में रखने, दोनों संभावनाओं को खुला रखता है; पादटिप्पणी निकट वैकल्पिक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पूर्वजों’ सामान्य पाठक के लिए स्वाभाविक है, जबकि नामित पितृपुरुष मूल की विशिष्टता बनाए रखते हैं। वाक्य-विभाजन हिन्दी में पठनीयता बढ़ाता है, पर यूनानी के विचार-क्रम को सुरक्षित रखता है।
