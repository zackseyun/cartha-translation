    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησας εἰς ἡμᾶς
  choice: आपने हमारे साथ … व्यवहार किया है
  rationale: व्यक्तियों के साथ प्रयुक्त इस यूनानी मुहावरे का आशय उनके प्रति कार्य या व्यवहार करना है; शाब्दिक ‘हमारे लिए/हम पर किया’ हिन्दी में अस्पष्ट और अस्वाभाविक होता।
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: हे प्रभु, हमारे परमेश्वर
  rationale: सम्बोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है; κύριος का सामान्य और सटीक धार्मिक सम्बोधन ‘प्रभु’ है।
- source_word: ἐπιεικίαν
  choice: सहनशीलता
  rationale: प्रार्थना के प्रसंग में यह शब्द नरमी, रियायत और दंड देने में संयम का भाव रखता है। ‘सहनशीलता’ आधुनिक हिन्दी में सुबोध है और अगले पद ‘करुणा’ से इसे अलग रखता है।
- source_word: οἰκτειρμόν
  choice: करुणा
  rationale: यह शब्द दयापूर्ण संवेदना या रहम को व्यक्त करता है। ‘करुणा’ उसके भावात्मक पक्ष को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὸν μέγαν
  choice: महान
  rationale: विशेषण सीधे ‘करुणा’ को विशेषित करता है; ‘महान’ स्रोत के अर्थ को बिना विस्तार के व्यक्त करता है।
- source_word: κατὰ πᾶσαν ... καὶ κατὰ πάντα
  choice: अपनी पूरी … के अनुसार और अपनी सारी … के अनुसार
  rationale: दोनों κατὰ पदबंधों की पुनरावृत्ति बनाए रखी गई है, जबकि हिन्दी में सम्बद्ध संज्ञाओं के लिंग के अनुसार ‘पूरी’ और ‘सारी’ का प्रयोग हुआ है।
theological_decisions:
- issue: परमेश्वर की कृपापूर्ण प्रवृत्ति बताने वाले दो निकटार्थी शब्दों को अलग रखना
  choice: ἐπιείκεια के लिए ‘सहनशीलता’ और οἰκτειρμός के लिए ‘करुणा’
  alternative: दोनों को सामान्य रूप से ‘दया’ कहना; अथवा पहले को ‘क्षमाशीलता’ और दूसरे को ‘दया’ कहना
  rationale: यूनानी पाठ दो अलग शब्दों द्वारा परमेश्वर के दयालु व्यवहार की परिपूर्णता व्यक्त करता है। अलग हिन्दी शब्द उस आलंकारिक विस्तार को सुरक्षित रखते हैं, पर उनके बीच कोई कृत्रिम धर्मवैज्ञानिक भेद नहीं बनाते।
- issue: κύριος द्वारा परमेश्वर को सम्बोधित करना
  choice: प्रभु
  alternative: यहोवा
  rationale: उपलब्ध यूनानी स्रोत में κύριος है, इब्रानी परमेश्वर-नाम नहीं; इसलिए ‘प्रभु’ स्रोत-संगत है।
translation_notes:
  register: भाषा प्रार्थनापूर्ण और गरिमापूर्ण है, पर आधुनिक पाठक के लिए सीधी रखी गई है। यूनानी वाक्य की दोहरी ‘के अनुसार’ संरचना और पद के अंत का अल्पविराम सुरक्षित रखा गया है, क्योंकि विचार अगले पद में आगे बढ़ता है।
