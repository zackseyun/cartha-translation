  choice: महान सामर्थ्य से
  rationale: δύναμις के बल और क्षमता संबंधी अर्थ को गरिमापूर्ण बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: ἐν βραχίονι ὑψηλῷ
  choice: ऊँची उठी भुजा से
  rationale: ὑψηλός के ‘ऊँचा’ अर्थ को सुरक्षित रखता है और अधिक परिचित किंतु भिन्न ‘फैली हुई भुजा’ को मूल पाठ में नहीं मिलाता।
- source_word: ἐποίησας σεαυτῷ ὄνομα
  choice: अपने लिए ऐसा नाम बनाया
  rationale: स्पष्ट आत्मवाचक भाव और प्रतिष्ठा स्थापित करने के बाइबलीय मुहावरे को बनाए रखता है।
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: जो आज तक कायम है
  rationale: वर्तमान दिन तक बने रहने के सूत्रात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: निर्गमन में परमेश्वर के छुटकारे के कार्य का संचयी वर्णन
  choice: ‘शक्तिशाली हाथ… चिन्हों और अद्भुत कामों… महान सामर्थ्य… ऊँची उठी भुजा’ की पूरी शृंखला बनाए रखी गई
  alternative: सूची को संक्षिप्त करके केवल परमेश्वर की महान शक्ति कहना
  rationale: बार-बार आने वाले साधनवाचक पद निर्गमन की धर्मवैचारिक स्मृति और परमेश्वर की प्रकट सामर्थ्य पर बल देते हैं; उन्हें संक्षिप्त करना मूल की अलंकारिक और धर्मवैचारिक शक्ति घटाता।
