  text: And now[a], O Lord, God of Israel, who brought your people out of the land of Egypt with a mighty hand, with signs and wonders and with great power and with an uplifted arm, and made for yourself a name, as at this day,
translation:
  language: hi
  text: और अब, हे प्रभु, इस्राएल के परमेश्वर, आपने अपनी प्रजा को मिस्र देश से शक्तिशाली हाथ से, चिन्हों और अद्भुत कामों से, महान सामर्थ्य से और ऊँची उठी भुजा[a] से बाहर निकाला, और अपने लिए नाम बनाया, जैसा आज के दिन है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ऊँची भुजा।” यहाँ यूनानी में “ऊँची/उठी हुई भुजा” है, जो निर्गमन के कुछ अन्य प्रसंगों में मिलने वाले अधिक परिचित वाक्यांश “फैली हुई भुजा” से भिन्न है।
    reason: मूल यूनानी की विशिष्ट शब्दावली और परिचित वैकल्पिक निर्गमन-वाक्यांश के बीच भेद स्पष्ट करना।
