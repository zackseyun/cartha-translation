lexical_decisions:
- source_word: Τῷ κυρίῳ θεῷ ἡμῶν ἡ δικαιοσύνη
  choice: हमारे प्रभु परमेश्वर ही धर्मी हैं
  rationale: यूनानी में संबंधसूचक चतुर्थी के साथ भाव है कि धार्मिकता प्रभु परमेश्वर की है। हिन्दी में ‘ही धर्मी हैं’ इस आरोपण और आगे आने वाले विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δικαιοσύνη
  choice: धर्मी
  rationale: यहाँ शब्द परमेश्वर के सही और न्यायपूर्ण होने को व्यक्त करता है। ‘धर्मी’ इसकी नैतिक व्यापकता बनाए रखता है; ‘न्यायी’ भी संभव है, पर अर्थ को केवल न्यायिक पक्ष तक सीमित कर सकता है।
- source_word: ἡμῖν δὲ καὶ τοῖς πατράσιν ἡμῶν
  choice: पर हम और हमारे पूर्वज
  rationale: विरोधसूचक δὲ को ‘पर’ से और वर्तमान समुदाय के साथ पितरों के स्पष्ट समावेश को ‘हम और हमारे पूर्वज’ से रखा गया है।
- source_word: ἡ αἰσχύνη τῶν προσώπων
  choice: लज्जित हैं
  rationale: शाब्दिक अर्थ ‘चेहरों की लज्जा’ है, जो अपमान और कलंक की सामी पृष्ठभूमि वाला मुहावरा है। सहज आधुनिक हिन्दी में ‘लज्जित हैं’ उसका आशय देता है, जबकि पादटिप्पणी मूल बिंब सुरक्षित रखती है।
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: आज तक
  rationale: यह सूत्र वर्तमान में प्रत्यक्ष बनी हुई दशा को इंगित करता है। ‘आज तक’ हिन्दी में उस वर्तमान, जारी परिणाम को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
