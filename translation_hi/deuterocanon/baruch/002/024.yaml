base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/024.yaml
  text: And we did not listen to your voice to serve the king of Babylon[a], and you have fulfilled your words that you spoke by the hands of your servants the prophets[c][b], that the bones of our kings and the bones of our fathers would be brought out from their place.
translation:
  language: hi
  text: और हमने तेरी वाणी पर ध्यान नहीं दिया कि बाबेल के राजा की सेवा करें[a], और तूने अपने वे वचन पूरे किए, जो तूने अपने सेवक नबियों के हाथों[b] कहे थे—कि हमारे राजाओं की हड्डियाँ और हमारे पुरखों की हड्डियाँ उनके स्थान से बाहर निकाली जाएँगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमने तेरी आज्ञा नहीं मानी।” यूनानी में शाब्दिक रूप से परमेश्वर की वाणी न सुनने की बात है; प्रसंग में आज्ञापालन न करना निहित है।
    reason: lexical_alternative
  - marker: b
    text: “नबियों के हाथों” एक मुहावरा है, जिसका अर्थ है “नबियों के द्वारा।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात उनके दफ़नाने के स्थान से; यूनानी पाठ में केवल “उनके स्थान से” है।
    reason: cultural_note
