  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबलीय गद्य। ‘स्मरण करेंगे’, ‘मार्ग’ और ‘प्रभु’ औपचारिकता बनाए रखते हैं; ‘बुरे काम’ वाक्य को सामान्य पाठक के लिए स्पष्ट रखता है। असामान्य ‘हठीली पीठ’ स्रोत-सापेक्षता के कारण मुख्य पाठ में सुरक्षित है और पादटिप्पणी से समझाया गया है।
