  text: And they will turn away from their stiff neck and from their evil deeds[a], because they will remember the way of their fathers who sinned before the Lord.
translation:
  language: hi
  text: और वे अपनी हठीली पीठ[a] और अपने बुरे कामों से फिरेंगे, क्योंकि वे अपने उन पूर्वजों के मार्ग को स्मरण करेंगे जिन्होंने प्रभु के सामने पाप किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अपनी कठोर पीठ’। इसका भाव ‘अपनी हठधर्मिता’ हो सकता है। यूनानी पाठ में ‘पीठ’ है, अधिक परिचित ‘अकड़ी हुई गरदन’ नहीं।
    reason: मूल शारीरिक बिंब असामान्य है; टिप्पणी शाब्दिक रूप और रूपकात्मक अर्थ दोनों स्पष्ट करती है तथा निकटवर्ती प्रचलित मुहावरे से उसका भेद बताती है।
lexical_decisions:
- source_word: ἀποστρέψουσιν
  choice: वे ... से फिरेंगे
  rationale: भविष्यकाल और ἀπό के साथ दिशा-परिवर्तन को व्यक्त करता है; हिन्दी में पश्चात्ताप के संदर्भ में ‘से फिरना’ स्वाभाविक और सटीक है।
- source_word: ἀπὸ τοῦ νώτου αὐτῶν τοῦ σκληροῦ
  choice: अपनी हठीली पीठ से
  rationale: νώτου का शाब्दिक अर्थ ‘पीठ’ है, ‘गरदन’ नहीं। ‘हठीली’ रूपक का आशय संकेतित करता है, जबकि मूल शारीरिक बिंब सुरक्षित रहता है।
- source_word: πονηρῶν πραγμάτων αὐτῶν
  choice: अपने बुरे कामों से
  rationale: इस संदर्भ में πράγματα आचरण या कर्मों को दर्शाता है; ‘बुरे काम’ आधुनिक हिन्दी में सहज और नैतिक अर्थ में स्पष्ट है।
- source_word: μνησθήσονται
  choice: स्मरण करेंगे
  rationale: भविष्यकालीन क्रिया का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: τῆς ὁδοῦ
  choice: मार्ग को
  rationale: ὁδός के जीवन-आचरण संबंधी रूपक को बनाए रखता है।
- source_word: πατέρων αὐτῶν
  choice: अपने ... पूर्वजों
  rationale: यहाँ πατέρων वंशगत पुरखों को सूचित करता है; ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक है और ऐतिहासिक आशय को स्पष्ट रखता है।
- source_word: τῶν ἁμαρτόντων
  choice: जिन्होंने ... पाप किया था
  rationale: अओरिस्ट कृदन्त को पूर्वजों का वर्णन करने वाले स्वाभाविक सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: ἔναντι Κυρίου
  choice: प्रभु के सामने
  rationale: ἔναντι का स्थानिक-साक्षीभाव ‘सामने’ से सुरक्षित रहता है; इसे व्याख्यात्मक रूप से ‘प्रभु के विरुद्ध’ नहीं बनाया गया।
theological_decisions:
- issue: ‘हठीली पीठ’ के रूपक का अनुवाद
  choice: मूल पाठ के ‘पीठ’ वाले शारीरिक बिंब को बनाए रखना
  alternative: अपनी हठधर्मिता से; अपनी अकड़ी हुई गरदन से
  rationale: यूनानी में νῶτον ‘पीठ’ है। अधिक परिचित ‘अकड़ी गरदन’ कहना मूल बिंब को दूसरे बाइबलीय मुहावरे से बदल देता; केवल ‘हठधर्मिता’ कहना बिंब को मिटा देता।
- issue: πατέρων αὐτῶν का रूप
  choice: अपने पूर्वजों
  alternative: अपने पितरों; अपने बाप-दादों
  rationale: ‘पूर्वज’ आधुनिक मानक हिन्दी में वंशगत आशय को स्वाभाविक और गरिमापूर्ण ढंग से देता है; इसमें किसी विशिष्ट धार्मिक परंपरा का अतिरिक्त भाव नहीं आता।
- issue: Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: स्रोत यूनानी में Κύριος है; इसलिए ‘प्रभु’ प्रत्यक्ष और परंपरागत रूप से उपयुक्त है, जबकि किसी अनुमानित हिब्रू रूप को पाठ में आयात नहीं किया गया।
- issue: ἔναντι का संबंध
  choice: प्रभु के सामने पाप किया
  alternative: प्रभु के विरुद्ध पाप किया
  rationale: ‘सामने’ यूनानी पूर्वसर्ग की वास्तविक व्यापकता और तनाव को बनाए रखता है; ‘विरुद्ध’ नैतिक संबंध को अधिक स्पष्ट करके मूल से आगे जाता।
