lexical_decisions:
- source_word: ἠκούσαμεν
  choice: नहीं सुनी
  rationale: ἀκούω का अर्थ सुनना, ध्यान देना या आज्ञा मानना हो सकता है। यहाँ आज्ञाओं के अनुसार चलने की बात से आज्ञापालन का भाव निहित है, पर ‘नहीं सुनी’ मूल श्रवण-रूपक और बाइबलीय मुहावरे को सुरक्षित रखता है।
- source_word: τῆς φωνῆς αὐτοῦ
  choice: उसकी वाणी
  rationale: यूनानी पाठ में स्पष्टतः ‘उसकी वाणी’ है। ‘वाणी’ आधुनिक हिन्दी में गरिमापूर्ण और स्वाभाविक है तथा परमेश्वर के व्यक्तिगत संबोधन का भाव बनाए रखती है।
- source_word: πορεύεσθαι
  choice: चलें
  rationale: नैतिक और वाचा-संबंधी प्रसंग में πορεύομαι जीवन-आचरण के लिए ‘चलने’ का रूपक है। ‘चलें’ इस रूपक को बनाए रखता है।
- source_word: τοῖς προστάγμασιν
  choice: आज्ञाओं के अनुसार
  rationale: πρόσταγμα आदेश या आज्ञा को दर्शाता है। हिन्दी में ‘आज्ञाओं के अनुसार चलें’ अर्थ को स्पष्ट रखते हुए स्वाभाविक है; केवल ‘आज्ञाओं में चलें’ असहज होता।
- source_word: Κυρίου
  choice: प्रभु
  rationale: κύριος के लिए ‘प्रभु’ मानक, गरिमापूर्ण और सामान्य हिन्दी बाइबल-प्रयोग है।
- source_word: οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: जिन्हें उसने हमारे सामने रखा था
  rationale: शब्दशः भाव ‘जिन्हें उसने हमारे मुख के सामने दिया’ है। ‘हमारे सामने रखा’ स्थानिक रूपक और लोगों को आज्ञाएँ प्रस्तुत किए जाने का आशय स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ἠκούσαμεν को साधारण सुनने या आज्ञा मानने के रूप में अनूदित करना
  choice: उसकी वाणी नहीं सुनी
  alternative: उसकी आज्ञा नहीं मानी
  rationale: प्रसंग अवज्ञा का है, पर मूल पाठ सुनने का बाइबलीय मुहावरा इस्तेमाल करता है। चुना हुआ अनुवाद उस रूपक को बनाए रखता है और पादटिप्पणी उसका निहित अर्थ स्पष्ट करती है।
- issue: πορεύεσθαι के नैतिक रूपक को हिन्दी में बनाए रखना
  choice: आज्ञाओं के अनुसार चलें
  alternative: आज्ञाओं का पालन करें
  rationale: ‘चलें’ जीवन-आचरण के मूल रूपक को सुरक्षित रखता है, जबकि ‘के अनुसार’ आधुनिक हिन्दी में वाक्य को सहज बनाता है।
