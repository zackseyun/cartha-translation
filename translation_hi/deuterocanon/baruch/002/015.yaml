translation:
  language: hi
  text: जिससे सारी पृथ्वी जान ले कि आप, हे प्रभु, हमारे परमेश्वर हैं, क्योंकि इस्राएल और उसके वंश पर आपका नाम पुकारा गया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपका नाम इस्राएल और उसके वंश के ऊपर पुकारा गया है”; अधिक व्याख्यात्मक रूप में, “इस्राएल और उसका वंश आपके नाम से कहलाते हैं।” यूनानी मुहावरा परमेश्वर के साथ उनके संबंध, अपनत्व और पहचान को व्यक्त करता है।
    reason: lexical_alternative
