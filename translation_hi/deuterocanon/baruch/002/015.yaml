- source_word: ἵνα γνῷ
  choice: जिससे ... जान ले
  rationale: ἵνα के साथ विधिलिंग यहाँ उद्देश्य या परिणाम व्यक्त करता है। ‘जिससे ... जान ले’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस बल को बनाए रखता है।
- source_word: πᾶσα ἡ γῆ
  choice: सारी पृथ्वी
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है; यहाँ परमेश्वर की विश्वव्यापी पहचान के संदर्भ में ‘सारी पृथ्वी’ अधिक उपयुक्त है।
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: हे प्रभु, आप हमारे परमेश्वर हैं
  rationale: यूनानी वाक्य में सीधे संबोधन का भाव है। हिन्दी में ‘हे प्रभु’ और आदरसूचक ‘आप’ इसे स्पष्ट, स्वाभाविक और गरिमापूर्ण बनाते हैं।
- source_word: τὸ ὄνομά σου ἐπεκλήθη ἐπὶ
  choice: पर आपका नाम पुकारा गया है
  rationale: यह अनुवाद यूनानी मुहावरे के रूप को निकटता से रखता है और परमेश्वर से संबंधित होने, उसके नाम से पहचाने जाने तथा नाम पुकारे जाने के अर्थों को तुरंत किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: Ἰσραὴλ καὶ ἐπὶ τὸ γένος αὐτοῦ
  choice: इस्राएल और उसके वंश पर
  rationale: γένος यहाँ वंश या संतति को सूचित करता है। αὐτοῦ का एकवचन संबंध इस्राएल से है, इसलिए ‘उसके वंश’ मूल की व्याकरणिक बनावट को बनाए रखता है।
theological_decisions:
- issue: किसी प्रजा पर परमेश्वर का नाम पुकारे जाने का बाइबलीय मुहावरा
  choice: ‘इस्राएल और उसके वंश पर आपका नाम पुकारा गया है’ के रूप में मुहावरे को निकटता से बनाए रखा गया है।
  alternative: ‘इस्राएल और उसका वंश आपके नाम से कहलाते हैं’ अथवा ‘आपका नाम इस्राएल और उसके वंश के ऊपर पुकारा गया है।’
  rationale: यह वाक्य वाचा-संबंधी अपनत्व और परमेश्वर के साथ सार्वजनिक पहचान का संकेत देता है। मुख्य पाठ मूल मुहावरे की बहुअर्थकता बनाए रखता है, जबकि पादटिप्पणी उसके अधिक व्याख्यात्मक अर्थ को स्पष्ट करती है।
