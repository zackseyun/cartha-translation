translation:
  language: hi
  text: और उसने उन्हें हमारे चारों ओर के सब राज्यों के अधीन कर दिया, ताकि वे उन सभी लोगों के बीच निन्दा का विषय और उजाड़ बन जाएँ, जिनके बीच प्रभु ने उन्हें वहाँ तितर-बितर कर दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν ... ὑποχειρίους
  choice: अधीन कर दिया
  rationale: यह संयुक्त अभिव्यक्ति किसी को दूसरे के हाथ या अधिकार के नीचे कर देने का बोध कराती है। ‘अधीन कर दिया’ आधुनिक हिन्दी में राजनीतिक पराधीनता और विपत्ति—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάσαις ταῖς βασιλείαις ταῖς κύκλῳ ἡμῶν
  choice: हमारे चारों ओर के सब राज्यों के
  rationale: यह अनुवाद बहुवचन, समग्रता और स्थानवाचक κύκλῳ—तीनों को बनाए रखता है।
- source_word: εἰς ὀνειδισμόν
  choice: निन्दा के पात्र
  rationale: ὀνειδισμός सार्वजनिक तिरस्कार, लज्जा या निन्दा का भाव रखता है। व्यक्तियों के लिए ‘निन्दा के पात्र’ स्वाभाविक हिन्दी है और परिणामसूचक εἰς के अनुकूल है।
- source_word: ἄβατον
  choice: उजाड़
  rationale: शब्द का मूल भाव ऐसी जगह का है जहाँ जाया न गया हो या जाया न जा सके; न्याय और निर्वासन के इस प्रसंग में ‘उजाड़’ उसकी परिणामी दशा को संक्षेप में व्यक्त करता है। अधिक शाब्दिक संभावना पाद-टिप्पणी में रखी गई है।
- source_word: λαοῖς
  choice: लोगों
  rationale: λαοί यहाँ अनेक जनसमूहों को सूचित करता है। ‘लोगों’ से अर्थ सहज रहता है और इसे अनिवार्य रूप से राजनीतिक ‘राष्ट्रों’ तक सीमित नहीं किया जाता।
- source_word: διέσπειρεν
  choice: तितर-बितर कर दिया
  rationale: यह निर्वासन में लोगों को अलग-अलग स्थानों में बिखेर देने का सशक्त और प्रचलित हिन्दी रूप है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यूनानी Κύριος का सीधा, प्रतिष्ठित और सामान्य हिन्दी बाइबलीय प्रतिरूप ‘प्रभु’ है।
- source_word: ἐκεῖ
  choice: वहाँ/जहाँ ... कर दिया था
  rationale: यूनानी का स्थानवाचक बल हिन्दी के सम्बन्धवाचक वाक्य ‘जहाँ ...’ में स्वाभाविक रूप से समाहित है; अलग से ‘वहाँ’ जोड़ने पर हिन्दी में अनावश्यक पुनरुक्ति होती।
theological_decisions:
- issue: Κύριος की पहचान और अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: उपलब्ध यूनानी पाठ में Κύριος है। ‘प्रभु’ उसी पाठ का सीधा अनुवाद है और किसी अनुमानित इब्रानी आधार को मुख्य पाठ में नहीं लाता।
- issue: ἄβατον का न्याय-संबंधी अर्थ
  choice: उजाड़
  alternative: अगम स्थान / जहाँ चला न गया हो
  rationale: प्रसंग में यह निन्दा के समानांतर विपत्ति और वीरानी की दशा बताता है, फिर भी यूनानी शब्द की ‘अगम/अनछुई जगह’ वाली वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
- issue: क्रिया ἔδωκεν के कर्ता की स्पष्टता
  choice: उसने
  alternative: प्रभु ने
  rationale: इस खंड में आरम्भिक क्रिया का कर्ता सर्वनाम से निहित है; उसे तत्काल ‘प्रभु’ बनाकर स्पष्ट करना सम्भवतः सही संदर्भगत निष्कर्ष होता, पर मुख्य पाठ की अभिव्यक्ति से अधिक स्पष्टता जोड़ देता। इसलिए अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘अधीन कर दिया’, ‘निन्दा के पात्र’ और ‘तितर-बितर’ जैसे रूप स्रोत के न्याय, अपमान और निर्वासन के भाव को बिना अत्यधिक पुरातन शब्दावली के व्यक्त करते हैं।
