base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/001.yaml
  text: And the Lord has confirmed his word that he spoke against us and against our judges who judged Israel[a], and against our kings and against our rulers[b], and against the people of Israel and Judah.
translation:
  language: hi
  text: और प्रभु ने अपने उस वचन को पूरा किया, जो उसने हमारे विरुद्ध, इस्राएल का न्याय करनेवाले हमारे न्यायियों के विरुद्ध, हमारे राजाओं के विरुद्ध, हमारे शासकों के विरुद्ध, और इस्राएल और यहूदा के लोगों के विरुद्ध कहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पूरा किया” का अनुवाद “स्थिर किया” या “सिद्ध किया” भी हो सकता है। यूनानी क्रिया का शाब्दिक भाव किसी वचन को खड़ा करना है, अर्थात उसे प्रभावी करना या घटित कर देना। अंतिम पदबंध में यूनानी मूल एकवचन मानव-संज्ञा का सामूहिक रूप में प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: पूरा किया
  rationale: यहाँ ἵστημι का अर्थ बोले हुए वचन को प्रभावी करना या उसे घटित कर देना है। न्याय के प्रसंग में ‘पूरा किया’ स्वाभाविक हिंदी में चेतावनी के कार्यान्वयन को व्यक्त करता है, जबकि ‘स्थिर किया’ अधिक शाब्दिक पर कम सहज है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यूनानी Κύριος के लिए प्रतिष्ठित, गरिमापूर्ण और स्वाभाविक हिंदी समतुल्य।
- source_word: τὸν λόγον αὐτοῦ
  choice: अपने उस वचन को
  rationale: ‘वचन’ परमेश्वर द्वारा पहले कही गई बात की व्यापकता बनाए रखता है; ‘उस’ पिछले कथन की ओर संकेत को हिंदी में स्पष्ट करता है।
- source_word: ἐλάλησεν ἐφ᾽ ἡμᾶς
  choice: जो उसने हमारे विरुद्ध ... कहा था
  rationale: दंड के संदर्भ में ἐπί का भाव केवल ‘हमारे विषय में’ नहीं, बल्कि प्रतिकूल रूप से ‘हमारे विरुद्ध’ है।
- source_word: δικαστάς / τοὺς δικάσαντας τὸν Ἰσραήλ
  choice: इस्राएल का न्याय करनेवाले हमारे न्यायियों
  rationale: ‘न्यायी’ न्यायिक पद को बनाए रखता है और बाद के ἄρχοντες (‘शासक’) से भेद स्पष्ट करता है। कृदंत वाक्यांश को स्वाभाविक हिंदी विशेषण-रचना में रखा गया है।
- source_word: τοὺς ἄρχοντας
  choice: हमारे शासकों
  rationale: यह राजनीतिक शासन-अधिकार को व्यापक रूप में व्यक्त करता है और ‘राजाओं’ से अलग श्रेणी बनाए रखता है।
- source_word: ἄνθρωπον Ἰσραὴλ καὶ Ἰούδα
  choice: इस्राएल और यहूदा के लोगों
  rationale: एकवचन ἄνθρωπον यहाँ सामूहिक अर्थ में प्रयुक्त संक्षिप्त अभिव्यक्ति है। हिंदी में ‘लोगों’ इसका स्वाभाविक सामूहिक अर्थ देता है, बिना इसे केवल पुरुषों तक सीमित किए।
theological_decisions:
- issue: न्याय के प्रसंग में परमेश्वर के बोले हुए वचन का प्रभाव
  choice: प्रभु ने पहले कहे गए न्याय-वचन को पूरा किया
  alternative: प्रभु ने अपने वचन को स्थिर या प्रमाणित किया
  rationale: ‘हमारे विरुद्ध’ से आरंभ होने वाली सूची बताती है कि यह तटस्थ पुष्टि नहीं, बल्कि पहले घोषित न्याय का घटित होना है। ‘पूरा किया’ इस अर्थ को व्यक्त करता है, पर दंड के ऐसे विवरण नहीं जोड़ता जो मूल में नहीं हैं।
- issue: ἄνθρωπον का सामूहिक और व्याकरणिक रूप
  choice: इस्राएल और यहूदा के लोगों
  alternative: इस्राएल और यहूदा के मनुष्यों/पुरुषों
  rationale: संदर्भ में एकवचन मानव-संज्ञा पूरे समुदाय के लिए सामूहिक रूप से खड़ी है। ‘लोगों’ आधुनिक हिंदी में उसी सामूहिक अर्थ को स्पष्ट और स्वाभाविक रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण धार्मिक गद्य। मूल यूनानी की संचयी सूची और बार-बार आने वाले ‘विरुद्ध’ को बनाए रखा गया है। ‘न्यायी’ और ‘शासक’ द्वारा न्यायिक तथा राजनीतिक भूमिकाओं का भेद सुरक्षित है।
