- source_word: δικαίωμα τῷ κυρίῳ
  choice: उसे धर्मी नहीं मानेंगे
  rationale: शाब्दिक ‘प्रभु को धार्मिकता देना’ हिन्दी में अस्वाभाविक और अस्पष्ट होगा। यह रूप प्रभु की धार्मिकता अथवा उचितता को स्वीकार करने का भाव व्यक्त करता है, और ‘न्यायी’ की वैकल्पिक समझ पादटिप्पणी में रखता है।
