  rationale: ἡμᾶς (‘हम’) तथा दो बार आए एकवचन ἄνθρωπον को स्वाभाविक हिन्दी में वितरणसूचक ढंग से व्यक्त किया गया है। ‘कोई … और कोई’ हर प्रसंग में अलग-अलग व्यक्ति होने पर बल नहीं देता, पर यूनानी की पुनरावृत्ति को बनाए रखता है।
