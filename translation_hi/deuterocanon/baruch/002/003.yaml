- source_word: υἱοῦ αὐτοῦ
  choice: अपने बेटे का
  rationale: αὐτοῦ संबंधसूचक सर्वनाम है। हिन्दी में कर्ता के अपने पुत्र का संबंध स्वाभाविक और स्पष्ट रूप से ‘अपने बेटे’ से व्यक्त होता है; ‘अपने’ यहाँ यूनानी से अतिरिक्त जोर नहीं जोड़ता, बल्कि हिन्दी की अपेक्षित आत्मवाचक रचना है।
- source_word: θυγατρὸς αὐτοῦ
  choice: अपनी बेटी का
  rationale: पुत्र वाले समानांतर पद की तरह, संबंधसूचक अर्थ को हिन्दी की स्वाभाविक आत्मवाचक रचना ‘अपनी बेटी’ से व्यक्त किया गया है।
