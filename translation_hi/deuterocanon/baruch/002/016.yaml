- source_word: ἐκ τοῦ οἴκου τοῦ ἁγίου σου
  choice: अपने पवित्र भवन से
  rationale: οἶκος का मूल अर्थ ‘घर/भवन’ है। ‘भवन’ हिन्दी में परमेश्वर के पवित्र निवास के लिए गरिमापूर्ण है और ‘मन्दिर’ की अधिक विशिष्ट व्याख्या को मुख्य पाठ में नहीं थोपता।
- source_word: ἐννόησον εἰς ἡμᾶς
  choice: हमारी ओर ध्यान दे
  rationale: यह केवल मानसिक विचार नहीं, प्रार्थियों की ओर सचेत और कृपापूर्ण ध्यान करने का आग्रह व्यक्त करता है; εἰς की दिशात्मकता भी बनी रहती है।
- source_word: κλῖνον τὸ οὖς σου
  choice: अपना कान लगा
  rationale: मूल रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है। ‘कान झुका’ अधिक शाब्दिक है, पर सामान्य हिन्दी में कम सहज लगता है।
- source_word: ἄκουσον
  choice: सुन
  rationale: आज्ञार्थक क्रिया का सीधा, संक्षिप्त और प्रार्थनापूर्ण अनुवाद है।
theological_decisions:
- issue: οἶκος को सामान्य ‘भवन’ कहना या व्याख्यात्मक रूप से ‘मन्दिर’ कहना
  choice: पवित्र भवन
  alternative: पवित्र मन्दिर
  rationale: यूनानी में οἶκος है, ναός नहीं। इसलिए मुख्य पाठ स्रोत की कम विशिष्ट अभिव्यक्ति को सुरक्षित रखता है, जबकि सम्भावित पवित्र-मन्दिर अर्थ को पादटिप्पणी में दिया गया है।
- issue: κλῖνον τὸ οὖς σου के शारीरिक रूपक को बनाए रखना या केवल ‘हमारी सुन’ कहना
  choice: अपना कान लगा
  alternative: हमारी सुन
  rationale: रूपक प्रार्थना की विनती और निकटता को तीव्र करता है। इसे बनाए रखना मूल की काव्यात्मक और धार्मिक गंभीरता को सुरक्षित रखता है।
