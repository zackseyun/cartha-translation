    reason: οἶκος के शाब्दिक अर्थ और सन्दर्भगत ‘मन्दिर’ अर्थ—दोनों की सम्भावना स्पष्ट करना।
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में स्पष्ट करता है; दोनों occurrences में प्रार्थना का सीधा सम्बोधन बनाए रखा गया है।
