- source_word: τῷ βασιλεῖ Βαβυλῶνος
  choice: बाबेल के राजा की
  rationale: यह स्वाभाविक हिन्दी संबंध-रचना है और भौगोलिक-राजनीतिक संदर्भ को स्पष्ट रखती है।
theological_decisions:
- issue: ἀκούσητε में निहित आज्ञापालन को स्पष्ट करना
  choice: मुख्य पाठ में ‘प्रभु की वाणी न सुनो’ रखा गया
  alternative: ‘प्रभु की आज्ञा न मानो’
  rationale: यूनानी में शब्दशः सुनने की भाषा है, पर बाइबलीय प्रयोग में उसका आशय आज्ञा मानना भी हो सकता है। मुख्य पाठ मूल बिंब और अर्थगत तनाव दोनों को सुरक्षित रखता है।
