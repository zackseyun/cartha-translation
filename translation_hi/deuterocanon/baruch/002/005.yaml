  rationale: संदर्भ में यह उस रीति या बात को बताता है जिसमें पाप हुआ। हिन्दी में संयुक्त क्रिया-रचना स्वाभाविक है और मूल के ‘सुनना’ को सुरक्षित रखती है।
- source_word: τῆς φωνῆς αὐτοῦ
  choice: उसकी वाणी
  rationale: φωνή का मूल अर्थ ‘आवाज़/वाणी’ है। परमेश्वर के निर्देश के संदर्भ में ‘वाणी’ dignified और स्वाभाविक है, जबकि मुहावरे में आज्ञापालन का भाव भी निहित रहता है।
