- issue: ‘उसकी वाणी सुनना’ या ‘उसकी आज्ञा मानना’
  choice: उसकी वाणी नहीं सुनी
  alternative: उसकी आज्ञा नहीं मानी
  rationale: मुहावरे में आज्ञापालन शामिल है, पर मूल पाठ स्पष्ट रूप से ‘वाणी सुनने’ की भाषा रखता है। मुख्य पाठ में वही भाषा रखकर उसका निहित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
