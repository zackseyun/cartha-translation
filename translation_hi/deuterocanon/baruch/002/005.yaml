  rationale: ἁμαρτάνω के साथ आए संबंधकारक अर्थ को स्वाभाविक हिन्दी में ‘के विरुद्ध’ से व्यक्त किया गया है; ‘अपने’ यूनानी ‘हमारे’ का सहज हिन्दी रूप है।
- source_word: πρὸς τὸ μὴ ἀκούειν
