- issue: नीची स्थिति बताने वाली वाचा-शाप की रूपात्मक भाषा
  choice: वे नीचे हो गए, ऊपर नहीं
  alternative: वे नीची दशा में पहुँच गए, ऊँची दशा में नहीं
