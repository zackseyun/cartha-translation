lexical_decisions:
- source_word: ἃ
  choice: जिन्हें
  rationale: संबंधवाचक सर्वनाम पद को पिछले संदर्भ से जोड़ता है; हिन्दी में वचनानुसार ‘जिन्हें’ स्वाभाविक है।
- source_word: ἐλάλησεν
  choice: कहा था
  rationale: λαλέω के सामान्य वाचिक अर्थ को सहज हिन्दी में व्यक्त करता है; पूर्वसंदर्भ से जुड़ी घटना के कारण पूर्ण भूतकाल स्वाभाविक है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यूनानी पाठ में Κύριος है; ‘प्रभु’ उसका प्रतिष्ठित और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἐφ᾽ ἡμᾶς
  choice: हमारे विरुद्ध
  rationale: कहने की क्रिया और न्याय के संदर्भ में ἐπί + कर्मकारक का विरोधात्मक भाव है।
- source_word: πάντα τὰ κακὰ ταῦτα
  choice: वे सभी विपत्तियाँ
  rationale: यहाँ κακά नैतिक बुराइयों की अपेक्षा लोगों पर आई हानिकारक घटनाओं या दंडात्मक आपदाओं को सूचित करता है; ‘विपत्तियाँ’ आधुनिक हिन्दी में इस संदर्भ को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἦλθεν ἐφ᾽ ἡμᾶς
  choice: हम पर आ पड़ीं
  rationale: शाब्दिक ‘हम पर आईं’ की तुलना में ‘आ पड़ीं’ विपत्तियों के घटित होने का स्वाभाविक हिन्दी मुहावरा है और मूल अर्थ बनाए रखता है।
theological_decisions:
- issue: क्या τὰ κακά को नैतिक अर्थ में ‘बुराइयाँ’ कहा जाए या अनुभवगत अर्थ में ‘विपत्तियाँ’
  choice: विपत्तियाँ
  alternative: बुराइयाँ; आपदाएँ
  rationale: न्याय के इस संदर्भ में यह पद उन हानिकारक घटनाओं को बताता है जो लोगों पर आईं। ‘विपत्तियाँ’ दैवी न्याय के संदर्भ को न तो छिपाता है, न परमेश्वर को नैतिक बुराई का कर्ता बताने की अनावश्यक अस्पष्टता पैदा करता है।
