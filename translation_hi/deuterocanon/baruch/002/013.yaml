translation:
  language: hi
  text: तेरा क्रोध हम पर से हट जाए, क्योंकि उन जातियों के बीच, जहाँ तूने हमें तितर-बितर कर दिया, हम थोड़े ही बचे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήτω
  choice: हट जाए
  rationale: तीसरे पुरुष की आज्ञार्थक प्रार्थना को स्वाभाविक हिन्दी में रखा गया है; अर्थ है कि क्रोध उनसे फिर जाए।
- source_word: ὁ θυμός σου
  choice: तेरा क्रोध
  rationale: θυμός यहाँ प्रबल दैवी रोष का सूचक है; 'क्रोध' स्पष्ट, dignified और सामान्य हिन्दी है।
- source_word: κατελείφθημεν ὀλίγοι
  choice: हम थोड़े ही बचे हैं
  rationale: निष्क्रिय क्रिया और अल्प बचे होने की दशा, दोनों को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: उन जातियों के बीच
  rationale: ἔθνη को इस निर्वासन-संदर्भ में राजनीतिक या जातीय समुदायों के रूप में 'जातियाँ' कहा गया है।
- source_word: διέσπειρας
  choice: तितर-बितर कर दिया
  rationale: διασπείρω के बिखेरने/विभिन्न स्थानों में फैला देने के भाव को सुरक्षित रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: ग्रीक का स्थानवाचक बल हिन्दी में संबंधवाचक उपवाक्य 'जहाँ' के भीतर स्वाभाविक रूप से समाहित है; अलग 'वहाँ' दोहराने से हिन्दी असहज होती।
theological_decisions:
- issue: ईश्वर के क्रोध के हटने की प्रार्थना
  choice: ‘तेरा क्रोध हम पर से हट जाए’
  alternative: ‘तू अपना क्रोध हम पर से हटा ले’
  rationale: ग्रीक में कर्ता ‘तेरा क्रोध’ है और क्रिया तीसरे पुरुष की आज्ञार्थक है; चुना हुआ रूप इस संरचना और दैवी क्रोध के व्यक्त भाव को बनाए रखता है।
- issue: निर्वासन में बचे लोगों की संख्या
  choice: ‘हम थोड़े ही बचे हैं’
  alternative: ‘हममें से थोड़े ही छोड़ दिए गए हैं’
  rationale: चुना हुआ पाठ निष्क्रियता का परिणाम स्पष्ट करता है, बिना यह तय किए कि किसने उन्हें छोड़ा या बचाए रखा।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनामय, गंभीर और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरा’ रखा गया है। ग्रीक οὗ…ἐκεῖ की स्थानवाचक पुनरुक्ति को अस्वाभाविक शाब्दिक दोहराव के बजाय हिन्दी के ‘जहाँ’ में समाहित किया गया है।
