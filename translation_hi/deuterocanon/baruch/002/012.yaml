translation:
  language: hi
  text: हे प्रभु, हमारे परमेश्वर, हमने आपकी सभी विधियों के विरुद्ध पाप किया, अधार्मिक आचरण किया और अन्याय किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके सभी धर्ममय निर्णयों के विरुद्ध,” अथवा “आपकी सभी विधियों के संबंध में।” यूनानी वाक्यांश परमेश्वर के आदेशों या मानकों के साथ अधिक व्यापक संबंध भी व्यक्त कर सकता है।
    reason: ἐπί और δικαιώματα दोनों के संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: हमने पाप किया
  rationale: यह पाप की स्वीकारोक्ति करने वाला क्रियापद है। हिन्दी का सामान्य भूतकाल सामूहिक अंगीकार के प्रसंग में स्वाभाविक और मूल यूनानी के एओरिस्ट के निकट है।
- source_word: ἠσεβήσαμεν
  choice: भक्तिहीन आचरण किया
  rationale: क्रिया परमेश्वर के प्रति श्रद्धा या भक्ति के विपरीत आचरण को व्यक्त करती है। यह अनुवाद क्रियात्मक अर्थ बनाए रखता है और केवल स्थायी चरित्र-दोष बताने से बचता है।
- source_word: ἠδικήσαμεν
  choice: अन्याय किया
  rationale: यह क्रिया गलत या अन्यायपूर्ण काम करने को दर्शाती है। यहाँ कोई स्पष्ट कर्म नहीं है, इसलिए किसी विशेष व्यक्ति को हानि पहुँचाने का अर्थ जोड़ना उचित नहीं।
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: हे प्रभु, हमारे परमेश्वर
  rationale: सम्बोधन कारक को प्रार्थनापूर्ण और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त किया गया है; κύριος के लिए ‘प्रभु’ रखा गया है।
- source_word: ἐπὶ πᾶσιν τοῖς δικαιώμασίν σου
  choice: आपकी सभी विधियों के विरुद्ध
  rationale: पश्चात्ताप की इस स्वीकारोक्ति में ἐπί को ‘के विरुद्ध’ समझना प्रसंगानुकूल है। δικαιώματα के लिए ‘विधियाँ’ परमेश्वर के बाध्यकारी विधान या ठहराई हुई माँगों का व्यापक अर्थ बनाए रखता है।
theological_decisions:
- issue: परमेश्वर को सीधे सम्बोधित करते समय κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यूनानी पाठ में κύριος है; ‘प्रभु’ हिन्दी बाइबलीय भाषा में स्वाभाविक, गरिमापूर्ण और अनावश्यक रूप से इब्रानी दिव्य नाम को आयात न करने वाला अनुवाद है।
- issue: पश्चात्ताप की स्वीकारोक्ति में δικαιώματα का अर्थ
  choice: विधियाँ
  alternative: धर्ममय निर्णय; विधि-विधान; अपेक्षाएँ
  rationale: यहाँ शब्द परमेश्वर के बाध्यकारी मानकों या ठहराए हुए विधानों को सूचित कर सकता है। ‘विधियाँ’ कानूनी-वाचा संबंधी बल बनाए रखता है, पर अर्थ को केवल न्यायालयीन निर्णयों तक सीमित नहीं करता।
- issue: ἐπί के संबंधसूचक अर्थ की अस्पष्टता
  choice: के विरुद्ध
  alternative: के संबंध में
  rationale: स्वीकारोक्ति के प्रसंग में उल्लंघन का भाव प्रबल है, इसलिए मुख्य पाठ में ‘के विरुद्ध’ चुना गया है; फिर भी यूनानी वाक्यांश अधिक व्यापक संबंध भी व्यक्त कर सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और प्रार्थनापूर्ण रखी गई है। तीनों स्वीकारोक्तिपरक क्रियाओं को अलग-अलग बनाए रखा गया है। अन्त का डैश ‘आपकी सभी विधियों के विरुद्ध’ को तीनों क्रियाओं से जोड़ता है और यूनानी क्रम का बल भी बनाए रखता है।
