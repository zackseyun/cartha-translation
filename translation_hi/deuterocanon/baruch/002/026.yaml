base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/026.yaml
  text: And you made the house over which your name was called as it is this day[a], because of the wickedness of the house of Israel and the house of Judah.
translation:
  language: hi
  text: और जिस घर पर तेरा नाम पुकारा गया था[a], उसे तूने ऐसा कर दिया जैसा वह आज है—इस्राएल के घराने और यहूदा के घराने की दुष्टता के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप: “जो तेरे नाम से जाना जाता था” या “जो तेरा नाम धारण करता था।” यूनानी में शाब्दिक रूप से सामी अभिव्यक्ति “जिस पर तेरा नाम पुकारा गया था” है।'
    reason: नामकरण-सूत्र के शाब्दिक रूप और उसके स्वाभाविक हिन्दी अर्थ, दोनों को उपलब्ध कराना।
lexical_decisions:
- source_word: ἔθηκας
  choice: तूने ऐसा कर दिया
  rationale: यहाँ τίθημι घर को उसकी वर्तमान दशा में पहुँचा देने का भाव रखता है। यह अनुवाद परिणामसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, पर विनाश की कोई ऐसी क्रिया नहीं जोड़ता जिसका यूनानी में स्पष्ट उल्लेख नहीं है।
- source_word: τὸν οἶκον
  choice: घर
  rationale: शाब्दिक अर्थ ‘घर’ है और प्रसंग में इससे यरूशलेम का मन्दिर अभिप्रेत है। ‘घर’ रखने से मूल बाइबलीय रूपक और परमेश्वर के घर का भाव सुरक्षित रहता है।
- source_word: οὗ ἐπεκλήθη τὸ ὄνομά σου ἐπ᾽ αὐτῷ
  choice: जिस घर पर तेरा नाम पुकारा गया था
  rationale: यह यूनानी में सुरक्षित सामी नामकरण-सूत्र को निकटता से व्यक्त करता है। इसका आशय उस घर पर परमेश्वर के स्वामित्व, समर्पण और नाम की छाप से है; अधिक मुहावरेदार विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: जैसा वह आज है
  rationale: यह बाइबलीय मुहावरा घर की वर्तमान, प्रत्यक्ष दशा की ओर संकेत करता है। हिन्दी रूप अर्थ को स्पष्ट रखते हुए मूल की तुलना को बचाता है।
- source_word: πονηρίαν
  choice: दुष्टता
  rationale: पश्चात्ताप और न्याय के इस प्रसंग में यह नैतिक बुराई और भ्रष्ट आचरण दोनों को संक्षेप में व्यक्त करता है।
- source_word: οἴκου Ἰσραὴλ καὶ οἴκου Ἰούδα
  choice: इस्राएल के घराने और यहूदा के घराने
  rationale: ‘घराना’ मूल के सामूहिक और वाचा-संबंधी οἶκος को बनाए रखता है तथा इसे केवल भौगोलिक या जातीय नामों तक सीमित नहीं करता।
theological_decisions:
- issue: ‘घर’ और उस पर परमेश्वर का नाम पुकारे जाने का आशय
  choice: मुख्य पाठ में ‘घर’ तथा ‘जिस पर तेरा नाम पुकारा गया था’ रखा गया है।
  alternative: ‘वह मन्दिर जो तेरे नाम से जाना जाता है’ या ‘वह घर जो तेरा नाम धारण करता है।’
  rationale: प्रसंग में घर यरूशलेम का मन्दिर है, पर मूल केवल ‘घर’ कहता है। नाम पुकारे जाने का सामी सूत्र परमेश्वर के स्वामित्व, समर्पण और उपस्थिति का भार रखता है; इसलिए उसे मुख्य पाठ में पूरी तरह सपाट मुहावरे में नहीं बदला गया।
- issue: मन्दिर की वर्तमान दशा में परमेश्वर की क्रिया और लोगों की दुष्टता का संबंध
  choice: ‘उसे तूने ऐसा कर दिया जैसा वह आज है—…दुष्टता के कारण’
  alternative: ‘तूने उसे उजाड़ दिया’
  rationale: मूल परमेश्वर को वर्तमान दशा का कर्ता और इस्राएल तथा यहूदा की दुष्टता को उसका कारण बताता है, पर यहाँ विनाश की विशिष्ट क्रिया नहीं बताता। चुना हुआ रूप इस न्यायगत तनाव को सुरक्षित रखता है और अनावश्यक विस्तार नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी अपनाई गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरा’ मूल के एकवचन संबोधन को स्पष्ट रखता है। ‘घर’ और ‘घराना’ जैसे बाइबलीय शब्द प्रसंग में सहज हैं और मूल की शब्दावली भी सुरक्षित रखते हैं।
