translation:
  language: hi
  text: और प्रभु ने विपत्तियों पर निगाह रखी और उन्हें हम पर ले आया, क्योंकि प्रभु अपने सभी कार्यों में धर्मी है, जिन्हें करने की उसने हमें आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγρηγόρησεν
  choice: निगाह रखे रहा
  rationale: γρηγορέω का मूल भाव जागते हुए चौकस रहने का है। यहाँ यह आने वाली विपत्तियों के संबंध में प्रभु की सक्रिय सतर्कता बताता है; यह प्रयोग रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐπὶ τοῖς κακοῖς
  choice: विपत्तियों पर
  rationale: κακά यहाँ अगले वाक्यांश ‘उन्हें हम पर ले आया’ के कारण नैतिक बुराइयों के बजाय दंडस्वरूप आई विपत्तियों या आपदाओं को सूचित करता है।
- source_word: ἐπήγαγε
  choice: उन्हें हम पर ले आया
  rationale: ἐπάγω का अर्थ किसी वस्तु को किसी पर लाना है। ‘उन्हें’ पहले उल्लिखित विपत्तियों को स्पष्ट रूप से ग्रहण करता है और यूनानी की सक्रिय अभिव्यक्ति को बनाए रखता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: δίκαιος प्रभु के कार्यों की नैतिक सत्यता और न्यायसंगतता व्यक्त करता है। ‘धर्मी’ हिन्दी बाइबलीय प्रयोग में इस व्यापक भाव को बनाए रखता है; ‘न्यायी’ भी संदर्भानुकूल विकल्प है।
- source_word: ἐπὶ πάντα τὰ ἔργα αὐτοῦ
  choice: अपने उन सब कामों में
  rationale: यहाँ ἐπί क्षेत्र या संबंध का भाव देता है। ‘अपने ... सब कामों में’ αὐτοῦ और व्यापक πάντα दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἃ ἐνετείλατο ἡμῖν
  choice: जिनकी उसने हमें आज्ञा दी थी
  rationale: यूनानी संबंधवाचक उपवाक्य संक्षिप्त और कुछ तनावपूर्ण है। यह अनुवाद उसे ‘कामों’ से जोड़ता है और ἐντέλλομαι के आज्ञा देने के अर्थ को बिना अतिरिक्त व्याख्या के रखता है।
theological_decisions:
- issue: τὰ κακά को नैतिक ‘बुराइयाँ’ माना जाए या दंडस्वरूप ‘विपत्तियाँ’
  choice: विपत्तियाँ
  alternative: बुराइयाँ; आपदाएँ
  rationale: तत्काल अगला कथन कहता है कि प्रभु उन्हें इस्राएल पर ले आया; इसलिए संदर्भ में दंडस्वरूप आपदाएँ अभिप्रेत हैं। यह चयन प्रभु की सक्रिय न्यायकारी भूमिका को नरम नहीं करता, पर नैतिक बुराई का अनावश्यक अर्थ भी नहीं जोड़ता।
- issue: प्रभु के लिए δίκαιος का अनुवाद
  choice: धर्मी
  alternative: न्यायी
  rationale: ‘धर्मी’ नैतिक सहीपन और न्यायपूर्ण आचरण, दोनों के लिए पर्याप्त व्यापक है तथा पद के अगले कथन में प्रभु के सब कामों से स्वाभाविक रूप से जुड़ता है।
- issue: ἃ ἐνετείλατο ἡμῖν का पूर्वपद और अर्थ
  choice: इसे ‘कामों’ से जोड़ते हुए ‘जिनकी उसने हमें आज्ञा दी थी’
  alternative: ‘जो कुछ उसने हमें आज्ञा दी थी’; या इसे प्रभु के न्यायकारी कामों की आज्ञा से संबंधित समझना
  rationale: यूनानी में नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम ἃ निकटवर्ती τὰ ἔργα से व्याकरणतः मेल खाता है, यद्यपि अर्थ संक्षिप्त और असामान्य है। अनुवाद इस तनाव को विस्तृत व्याख्या से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘प्रभु’, ‘धर्मी’ और ‘आज्ञा’ बाइबलीय स्तर बनाए रखते हैं, जबकि वाक्यरचना अत्यधिक संस्कृतनिष्ठ नहीं है।
