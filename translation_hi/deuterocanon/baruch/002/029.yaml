base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/029.yaml
  text: If you do not listen to my voice[b][a], surely this great and vast multitude will be reduced to a few among the nations where I will scatter them there.
translation:
  language: hi
  text: यदि तुम मेरी वाणी नहीं सुनोगे, तो निश्चय ही यह बड़ी और विशाल जनराशि[a] उन जातियों के बीच, जहाँ मैं उन्हें तितर-बितर करूँगा, वहीं घटकर थोड़े-से लोगों तक रह जाएगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द βόμβησις का शाब्दिक अर्थ ‘भनभनाहट,’ ‘गर्जना’ या ‘कोलाहल’ हो सकता है। यहाँ ‘घटकर थोड़े-से लोग’ होने की बात के कारण इसे लोगों की बड़ी ‘जनराशि’ के अर्थ में लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में स्थानसूचक शब्दों की पुनरुक्ति है—शाब्दिक रूप से, ‘जहाँ मैं उन्हें तितर-बितर करूँगा, वहाँ।’ ‘वहीं’ उस बल को बनाए रखता है।
    reason: source_structure
lexical_decisions:
- source_word: Ἐὰν μὴ ἀκούσητε τῆς φωνῆς μου
  choice: यदि तुम मेरी वाणी नहीं सुनोगे
  rationale: ἀκούω यहाँ केवल ध्वनि सुनने के बजाय ध्यान देकर मानने का भाव रख सकता है। ‘मेरी वाणी सुनना’ मूल मुहावरे और उसकी वाचिक-अनुबंधात्मक गंभीरता, दोनों को सुरक्षित रखता है।
- source_word: εἰ μὴν
  choice: तो निश्चय ही
  rationale: यह पदबंध परिणाम की निश्चितता और चेतावनी की गंभीरता पर बल देता है।
- source_word: ἡ βόμβησις ἡ μεγάλη ἡ πολλὴ αὕτη
  choice: यह बड़ी और विशाल जनराशि
  rationale: βόμβησις का शाब्दिक क्षेत्र भनभनाहट, गर्जना या कोलाहल है, पर ‘घटकर थोड़े-से’ होने की अगली अभिव्यक्ति यहाँ लोगों की बड़ी संख्या की ओर संकेत करती है। ‘जनराशि’ इस प्रसंगगत संकेत को व्यक्त करती है, जबकि पादटिप्पणी मूल रूपक की अनिश्चितता बताती है। μεγάλη और πολλή के दोहरे बल को ‘बड़ी और विशाल’ से रखा गया है।
- source_word: ἀποστρέψει εἰς μικρὰν
  choice: घटकर थोड़े-से लोग रह जाएगी
  rationale: यूनानी अभिव्यक्ति संक्षिप्त और कुछ असामान्य है; संदर्भ में आशय बड़ी जनसंख्या के संख्या में बहुत कम हो जाने से है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: उन जातियों के बीच
  rationale: निर्वासन के संदर्भ में ἔθνη उन विदेशी जातियों या राष्ट्रों को सूचित करता है जिनमें लोग बिखेरे जाएँगे। ‘जातियों के बीच’ स्वाभाविक है और अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: οὗ διασπερῶ αὐτοὺς ἐκεῖ
  choice: जहाँ मैं उन्हें तितर-बितर करूँगा, वहीं
  rationale: οὗ और ἐκεῖ दोनों स्थान को दोहराकर बल देते हैं। हिंदी में ‘जहाँ... वहीं’ उस बल को बनाए रखता है, यद्यपि वाक्य के अंत में ‘वहीं’ शैलीगत रूप से चिह्नित है।
theological_decisions:
- issue: ईश्वरीय चेतावनी और निर्वासन में संख्या घटने का परिणाम
  choice: वचन को निर्वासन में लोगों की संख्या घट जाने की गंभीर ईश्वरीय चेतावनी के रूप में प्रस्तुत किया गया है, बिना पाठ से आगे बढ़कर दंड की कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
  alternative: βόμβησις को केवल ‘कोलाहल’ या ‘गर्जना’ मानकर कथन को जनसंख्या के बजाय ध्वनि के मंद पड़ने के विषय में समझना।
  rationale: ‘थोड़े-से’ और ‘जातियों के बीच’ का निकट संदर्भ लोगों के बड़े समुदाय के घटने की ओर अधिक प्रबलता से संकेत करता है; फिर भी βόμβησις की वास्तविक शाब्दिक असामान्यता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेरी वाणी,’ ‘निश्चय ही,’ और ‘तितर-बितर’ औपचारिक बाइबलीय स्वर बनाए रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं हैं। असामान्य अंतिम ‘वहीं’ मूल यूनानी की स्थानसूचक पुनरुक्ति को जानबूझकर दर्शाता है।
