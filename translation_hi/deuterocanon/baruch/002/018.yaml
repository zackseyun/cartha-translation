  to: परन्तु उसकी आत्मा, जो अपनी बड़ी विपत्ति से दुःखी है[a], जो झुकी हुई और निर्बल चलती है, और वे आँखें जो मंद पड़ रही हैं, और वह भूखी आत्मा—ये तुझे महिमा और धार्मिकता देंगे[b], हे प्रभु।
  rationale: The revision replaces the awkward repeated ‘प्राण’ with ‘आत्मा,’ preserving the Greek repetition of ψυχή and yielding natural Hindi in both clauses. It adjusts agreement accordingly and renders the failing-eyes image more idiomatically. The compressed and potentially elliptical force of ἐπὶ τὸ μέγεθος remains represented in the main text and explicitly safeguarded in footnote a; no doctrinal interpretation has been added.
