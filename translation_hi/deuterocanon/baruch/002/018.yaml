  yaml_path: translation/deuterocanon/baruch/002/018.yaml
  text: But the soul that is grieved over its great misery[a], that goes about bent over and weak, and the eyes that are failing and the soul that is hungry—these will give you glory and righteousness[b], O Lord.
translation:
  language: hi
  text: परन्तु उसकी आत्मा, जो अपनी बड़ी विपत्ति से दुःखी है[a], जो झुकी हुई और निर्बल चलती है, और वे आँखें जो मंद पड़ रही हैं, और वह भूखी आत्मा—ये तुझे महिमा और धार्मिकता देंगे[b], हे प्रभु।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी विपत्ति की महानता के कारण।” यूनानी वाक्यांश संक्षिप्त है और अधिक शाब्दिक रूप से केवल “महानता” की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “महिमा और न्याय देंगे।”
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχή
  choice: प्राण
  rationale: पद्य में दोहराया गया ψυχή व्यक्ति के भीतरी जीवन और समूचे पीड़ित अस्तित्व, दोनों को काव्यात्मक रूप से व्यक्त करता है; ‘प्राण’ इस बल को बनाए रखता है।
- source_word: λυπουμένη
  choice: दुःखी है
  rationale: वर्तमान कृदन्त निरन्तर शोक या व्यथा को दर्शाता है; ‘दुःखी है’ सहज और अर्थनिष्ठ है।
- source_word: ἐπὶ τὸ μέγεθος
  choice: अपनी बड़ी विपत्ति से
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। आस-पास की निर्बलता, भूख और बुझती आँखों के आधार पर ‘बड़ी विपत्ति’ अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक सम्भावना बचाती है।
- source_word: βαδίζει κύπτον καὶ ἀσθενοῦν
  choice: झुका हुआ और निर्बल चलता है
  rationale: यह चाल और निरन्तर शारीरिक दुर्बलता की छवि को सीधे और स्वाभाविक हिन्दी में रखता है।
- source_word: οἱ ὀφθαλμοὶ οἱ ἐκλείποντες
  choice: वे आँखें जो बुझती जा रही हैं
  rationale: ἐκλείπω यहाँ शक्ति चुकने या दृष्टि मंद पड़ने की ओर संकेत करता है; यह अभिव्यक्ति क्षीणता की काव्यात्मक छवि बनाए रखती है।
- source_word: πεινῶσα
  choice: भूखा
  rationale: यह जारी भूख का सीधा अनुवाद है और मूल से अधिक तीव्र अर्थ नहीं जोड़ता।
- source_word: δώσουσίν σοι δόξαν
  choice: तुझे महिमा देंगे
  rationale: मूल की प्रत्यक्ष कर्म-रचना को बनाए रखते हुए यह परमेश्वर की महिमा स्वीकार करने का भाव व्यक्त करता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह δικαιοσύνη के नैतिक खरेपन और उचितता के व्यापक अर्थ को रखता है; ‘न्याय’ सम्भव विकल्प है और पादटिप्पणी में दिया गया है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: ईश्वर को किए गए सम्बोधन के लिए मानक, गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: प्रभु को दी जाने वाली δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस प्रार्थना में पीड़ित जन परमेश्वर के नैतिक खरेपन को स्वीकार करते प्रतीत होते हैं; फिर भी न्याय का अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
