review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the sequence of the Greek faithfully: an afflicted soul/person, bowed and weak movement, failing eyes, hunger, and the future giving of glory and righteousness to the Lord. It appropriately retains the compressed sense of ἐπὶ τὸ μέγεθος in the main text and explains the literal ambiguity in footnote a. However, ‘प्राण’ can principally suggest breath or life in modern Hindi and is strained in the predicate ‘भूखा प्राण’; repeated ‘आत्मा’ more directly and consistently represents the repeated ψυχή.'
  naturalness: ‘भूखा प्राण’ is not idiomatic modern standard Hindi, and the masculine forms ‘झुका हुआ’ and ‘निर्बल’ sit less naturally with a referent rendered as ‘प्राण’ in this poetic context. ‘आत्मा’ permits natural feminine agreement and makes the repeated construction clear. ‘आँखें जो मंद पड़ रही हैं’ is a more ordinary Hindi expression for failing eyes than ‘बुझती जा रही हैं,’ while retaining the image of depletion.
  terminology: Use ‘आत्मा’ for ψυχή in both occurrences, preserving the source repetition and the lament-prayer register without forcing a doctrinal sense beyond the Greek. Retain ‘धार्मिकता’ for δικαιοσύνη, with ‘न्याय’ preserved as an alternative in the footnote. ‘हे प्रभु’ remains appropriate.
  issues:
  - severity: medium
    issue: ‘भूखा प्राण’ is unnatural and semantically less precise for ψυχὴ ἡ πεινῶσα.
    rationale: In contemporary Hindi, ‘प्राण’ commonly denotes breath, life-force, or dear life; describing it as ‘भूखा’ is awkward. ‘भूखी आत्मा’ is natural and reflects the repeated Greek ψυχή.
  - severity: low
    issue: The wording for failing eyes can be more idiomatic.
    rationale: ‘आँखें जो मंद पड़ रही हैं’ naturally expresses ὀφθαλμοὶ ... ἐκλείποντες (eyes giving out/growing dim) without suggesting literal extinguishing.
