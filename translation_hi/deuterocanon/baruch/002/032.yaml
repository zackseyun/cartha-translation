  choice: ‘मेरे नाम’ का मूल मुहावरा बनाए रखना
  alternative: ‘मेरी प्रतिष्ठा’ या ‘मैं कौन हूँ’
  rationale: ‘नाम’ में केवल संबोधन से अधिक, परमेश्वर की प्रकट पहचान और सम्मान का भाव हो सकता है। इसे यथावत रखना स्रोत की धर्मवैचारिक व्यापकता को सुरक्षित रखता है।
- issue: न्याय और पुनर्स्थापना के प्रसंग में ἀποικισμός का बल
  choice: ‘निर्वासन’
  alternative: ‘देश-निकाला’ या ‘जबरन विस्थापन’
  rationale: यह शब्द स्वदेश से हटाकर परदेश में बसाए जाने को इंगित कर सकता है। ‘निर्वासन’ इस प्रसंग में पर्याप्त व्यापक, स्वाभाविक और धर्म-सांप्रदायिक व्याख्या से मुक्त है।
