lexical_decisions:
- source_word: αἰνέσουσίν
  choice: स्तुति करेंगे
  rationale: भविष्यत् सक्रिय क्रिया αἰνέω मौखिक प्रशंसा या स्तुति को व्यक्त करती है। ‘स्तुति करेंगे’ आधुनिक हिन्दी में स्वाभाविक है और उपासना-संबंधी भाव बनाए रखती है।
- source_word: ἐν γῇ
