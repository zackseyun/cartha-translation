- source_word: ἀποικισμοῦ αὐτῶν
  choice: अपने निर्वासन की
  rationale: ἀποικισμός स्वदेश से हटाकर अन्यत्र बसाए जाने की दशा बता सकता है। न्याय और बिखराव के इस प्रसंग में ‘निर्वासन’ अर्थ को स्वाभाविक रूप से व्यक्त करता है; αὐτῶν को हिन्दी के कर्तृ-संदर्भ के अनुसार ‘अपने’ कहा गया है।
- source_word: μνησθήσονται
  choice: स्मरण करेंगे
  rationale: भविष्यत् मध्यम रूप का मूल अर्थ याद करना या मन में रखना है। ‘स्मरण करेंगे’ गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: τοῦ ὀνόματός μου
  choice: मेरे नाम को
  rationale: स्रोत का शाब्दिक बाइबलीय मुहावरा बनाए रखा गया है; यह परमेश्वर की प्रकट पहचान और सम्मान की व्यापक प्रतिध्वनि को बिना संकुचित किए रहने देता है।
