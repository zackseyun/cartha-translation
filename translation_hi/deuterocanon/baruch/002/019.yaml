  terminology: ‘प्रभु’ and ‘परमेश्वर’ are appropriate established Hindi biblical terms. ‘धर्मी कार्यों’ avoids the potentially broader sense of merely religious activity that ‘धार्मिक कार्यों’ can carry, while expressing righteous deeds well.
