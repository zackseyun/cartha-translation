translation:
  language: hi
  text: क्योंकि हम अपने पूर्वजों और अपने राजाओं के धर्मी कार्यों[a] के आधार पर आपके सामने[b] दया की याचना नहीं रखते, हे प्रभु, हमारे परमेश्वर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धर्मी कार्यों’ के लिए ‘धर्मी काम’ या ‘न्यायपूर्ण कार्य’ भी संभव हैं; यहाँ कम संभावित अर्थ ‘विधियाँ’ या ‘नियम’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘आपके मुख के सामने’; यह ‘आपकी उपस्थिति में’ के अर्थ का एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα
  choice: धर्ममय कामों
  rationale: पश्चात्ताप की इस प्रार्थना में पूर्वजों और राजाओं के संदर्भ से आशय उनके धार्मिक या न्यायपूर्ण कामों से है, न कि मुख्यतः विधियों से। यह चयन उनकी कथित धार्मिक योग्यता पर भरोसा न करने का भाव बनाए रखता है।
- source_word: καταβάλλομεν
  choice: रखते
  rationale: यहाँ क्रिया का ठोस अर्थ किसी वस्तु को सामने रखने का है; हिंदी में विनती के साथ ‘सामने रखते’ स्वाभाविक और चित्रात्मक दोनों है।
- source_word: τὸν ἔλεον
  choice: दया की अपनी विनती
  rationale: शाब्दिक ‘दया’ से ऐसा भ्रम हो सकता है कि प्रार्थी स्वयं दया अर्पित कर रहे हैं। प्रार्थना के प्रसंग में यह दया पाने की विनती है, इसलिए अर्थ को स्पष्ट किंतु संयत रूप में व्यक्त किया गया है।
- source_word: κατὰ πρόσωπόν σου
  choice: आपके सामने
  rationale: यूनानी पदबंध शाब्दिक रूप से ‘आपके मुख के सामने’ है और उपस्थिति में होने का मुहावरा है। ‘आपके सामने’ आधुनिक हिंदी में उसका स्वाभाविक तथा गरिमापूर्ण समतुल्य है।
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: हे प्रभु, हमारे परमेश्वर
  rationale: संबोधन और प्रार्थनापूर्ण गरिमा को बनाए रखते हुए κύριος को ‘प्रभु’ और θεὸς को ‘परमेश्वर’ कहा गया है।
theological_decisions:
- issue: क्या प्रार्थना पूर्वजों और राजाओं की धार्मिक योग्यता पर निर्भरता को नकारती है
  choice: वक्ता अपनी दया की विनती को पूर्वजों या राजाओं के धर्ममय कामों पर आधारित नहीं करते।
  alternative: δικαιώματα को पूर्वजों से संबंधित ‘विधियाँ’ या ‘नियम’ समझा जा सकता है।
  rationale: पश्चात्तापपूर्ण प्रार्थना का निकट प्रसंग योग्यता के आधार पर दावा करने के निषेध की ओर संकेत करता है; फिर भी पादटिप्पणी में वैधानिक अर्थ की वास्तविक शब्दार्थ-संभावना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण प्रार्थना-शैली। ‘आप’ से आदरपूर्ण प्रत्यक्ष संबोधन रखा गया है; संस्कृतनिष्ठ तकनीकी कानूनी भाषा से बचते हुए मूल की धार्मिक और मुहावरेदार छवि सुरक्षित रखी गई है।
