base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/021.yaml
  text: 'Thus says the Lord: Bow your shoulder and serve the king of Babylon[c][b][a], and dwell on the land that I gave to your fathers.'
translation:
  language: hi
  text: 'प्रभु यों कहते हैं: “अपने कंधे को झुकाओ[a] और बाबेल के राजा की सेवा करो; और उस भूमि पर बसे रहो[b], जिसे मैंने तुम्हारे पुरखों[c] को दिया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने कंधे को झुकाओ।” यह थोपी गई सेवा या जुए के अधीन होने का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस भूमि पर बस जाओ” अथवा “उस भूमि पर रहो।” यूनानी में शाब्दिक क्रिया “बैठो” है, जो यहाँ निवास करने के अर्थ में प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: c
    text: या, “तुम्हारे पूर्वजों।” यूनानी में शाब्दिक शब्द “पिताओं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως εἶπεν Κύριος
  choice: प्रभु यों कहते हैं
  rationale: यूनानी क्रिया रूपतः भूतकाल (‘कहा’) में है, पर यह नबूवत की प्रामाणिक वाणी का सूत्र है; आधुनिक हिन्दी में ‘यों कहते हैं’ उस जीवंत घोषणात्मक बल को स्वाभाविक ढंग से व्यक्त करता है। Κύριος का सामान्य और गरिमापूर्ण अनुवाद ‘प्रभु’ है।
- source_word: Κλίνατε τὸν ὦμον ὑμῶν
  choice: अपने कंधे को झुकाओ
  rationale: शब्दशः ‘अपने कंधे को झुकाओ।’ यह अधीन होकर श्रम या जुए का भार स्वीकार करने का चित्र है; ‘कंधा’ को बनाए रखने से मूल बिंब सुरक्षित रहता है।
- source_word: ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος
  choice: बाबेल के राजा की सेवा करो
  rationale: ἐργάζομαι का मूल अर्थ काम करना है, किंतु राजा के साथ दत्तिव कारक के इस प्रसंग में अधीन रहकर उसकी सेवा करना अभिप्रेत है। ‘सेवा करो’ हिन्दी में स्वाभाविक है और राजनीतिक अधीनता का भाव स्पष्ट करता है।
- source_word: καθίσατε ἐπὶ τὴν γῆν
  choice: उस भूमि पर बसे रहो
  rationale: καθίζω का शाब्दिक अर्थ ‘बैठना’ है, पर भूमि के संदर्भ में यह निवास करने या वहीं बने रहने का मुहावरेदार अर्थ देता है। ‘बसे रहो’ बसने और वहीं रहने—दोनों भावों को खुला रखता है।
- source_word: ἣν δέδωκα
  choice: जिसे मैंने ... दिया है
  rationale: यूनानी पूर्णकाल पहले दिए जाने और उसके वर्तमान परिणाम—भूमि अब भी दी हुई है—दोनों को दर्शाता है; हिन्दी पूर्ण भूत ‘दिया है’ इसे सहज रूप से व्यक्त करता है।
- source_word: τοῖς πατράσιν ὑμῶν
  choice: तुम्हारे पुरखों
  rationale: πατέρες शब्दशः ‘पिता’ का बहुवचन है और यहाँ पिछली पीढ़ियों के पुरुष पूर्वजों के लिए प्रयुक्त है। ‘पुरखे’ आधुनिक सामान्य हिन्दी में समझ आने वाला शब्द है और ‘पूर्वज’ की तुलना में मूल के पुरुषवाची रंग को अधिक बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय वाणी के सूत्र में Κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: यूनानी स्रोत में Κύριος है, कोई प्रत्यक्ष इब्रानी परमेश्वर-नाम नहीं। इसलिए ‘प्रभु’ मूल के स्तर पर रहता है और ऐसा विशिष्ट नाम नहीं जोड़ता जो इस पाठ में लिखा नहीं है।
- issue: τοῖς πατράσιν ὑμῶν का लिंग-सूचक पैतृक अर्थ
  choice: तुम्हारे पुरखों
  alternative: तुम्हारे पूर्वजों / तुम्हारे पितरों
  rationale: ‘पुरखों’ मूल के पुरुषवाची पैतृक संकेत को बनाए रखता है, जबकि ‘पूर्वजों’ उसे तटस्थ कर सकता है और ‘पितरों’ का संस्कृतनिष्ठ धार्मिक रंग सामान्य आधुनिक पाठक के लिए अनावश्यक रूप से विशिष्ट हो सकता है।
- issue: राजा के अधीन ἐργάσασθε का अर्थ
  choice: सेवा करो
  alternative: के लिए काम करो
  rationale: यह आदेश बाबेल के राजा की सत्ता के अधीन होने को सूचित करता है। ‘सेवा करो’ उस अधीनता को व्यक्त करता है, फिर भी इससे किसी विशेष धार्मिक या राजनीतिक सिद्धांत को पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। वाक्य में नबूवत की औपचारिक घोषणा बनी रहती है, जबकि ‘कंधे को झुकाओ’ जैसे मूल बिंब को समझाने के लिए पादटिप्पणी दी गई है। ‘बाबेल’ बाइबलीय स्थान-नाम के प्रचलित हिन्दी रूप के रूप में रखा गया है।
