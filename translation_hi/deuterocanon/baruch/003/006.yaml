translation:
  language: hi
  text: क्योंकि आप ही हमारे परमेश्वर प्रभु हैं, और हे प्रभु, हम आपकी स्तुति करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह प्रार्थना में पिछले निवेदन का आधार बताता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σὺ
  choice: आप ही
  rationale: यूनानी में स्पष्ट सर्वनाम पर बल है। आदरसूचक ‘आप’ के साथ ‘ही’ उस बल को सहज हिन्दी में बनाए रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ यह परमेश्वर की उपाधि है; ‘प्रभु’ इसका प्रचलित, गरिमापूर्ण और संदर्भानुकूल रूप है।
- source_word: ὁ θεὸς ἡμῶν
  choice: हमारे परमेश्वर
  rationale: यह यूनानी संबंधवाचक वाक्यांश का स्वाभाविक हिन्दी रूप है और ‘प्रभु’ की पहचान को स्पष्ट करता है।
- source_word: αἰνέσομέν
  choice: हम स्तुति करेंगे
  rationale: यह भविष्यकाल, कर्तृवाच्य, प्रथम पुरुष बहुवचन है; हिन्दी भविष्यकाल इसके कथनात्मक भाव को सुरक्षित रखता है और इसे आज्ञा या प्रोत्साहन में नहीं बदलता।
- source_word: σε
  choice: आपकी
  rationale: ‘स्तुति करना’ के साथ आधुनिक मानक हिन्दी में संबंधसूचक रचना ‘आपकी स्तुति’ स्वाभाविक है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन रूप को ‘हे प्रभु’ स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: दिव्य सम्बोधन और उपाधि के इस संदर्भ में ‘प्रभु’ स्थापित बाइबलीय अर्थ तथा प्रार्थनापूर्ण स्वर को बनाए रखता है; ‘स्वामी’ यहाँ अनावश्यक रूप से मानवीय स्वामित्व का भाव ला सकता है।
- issue: स्पष्ट सर्वनाम σὺ में निहित बल
  choice: आप ही
  alternative: आप
  rationale: ‘ही’ यूनानी के स्पष्ट और बलयुक्त सर्वनाम को दर्शाता है, बिना इस कथन में कोई अतिरिक्त सिद्धान्तगत विशिष्टता जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक दिव्य सम्बोधन ‘आप’ अपनाया गया है। भाषा संक्षिप्त, प्रार्थनापूर्ण और गरिमापूर्ण है; भविष्यकाल को प्रतिज्ञात्मक कथन के रूप में सुरक्षित रखा गया है।
