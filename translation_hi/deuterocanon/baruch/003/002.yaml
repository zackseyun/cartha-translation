lexical_decisions:
- source_word: ἄκουσον
  choice: सुन
  rationale: याचना के सीधे आज्ञार्थक स्वर को स्वाभाविक और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन को स्पष्ट करता है और Κύριε का प्रचलित, गरिमापूर्ण हिन्दी रूप देता है।
- source_word: ἐλέησον
  choice: दया कर
  rationale: दया की प्रार्थना को सीधे और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ प्रार्थना के कारण को प्रस्तुत करने वाले स्पष्ट कारणवाचक अर्थ को सुरक्षित रखता है।
- source_word: ἡμάρτομεν
  choice: हमने ... पाप किया है
  rationale: प्रथम पुरुष बहुवचन और पूर्ण हुई क्रिया के वर्तमान-सापेक्ष स्वीकारोक्ति भाव को व्यक्त करता है।
- source_word: ἐναντίον σου
  choice: तेरे विरुद्ध
  rationale: परमेश्वर के सम्मुख किए अपराध के संबंधपरक और नैतिक अर्थ को सीधे बनाए रखता है।
theological_decisions:
- issue: पाप की स्वीकारोक्ति और दया की याचना का संबंध
  choice: “क्योंकि” के द्वारा दोनों को कारणात्मक रूप से जोड़ा गया है।
  alternative: “कि” या “चूँकि”
  rationale: ὅτι का सामान्य कारणवाचक अर्थ यहाँ स्वाभाविक है; यह पाठ के तनाव को बनाए रखता है कि पाप की स्वीकारोक्ति के बीच ही दया माँगी जा रही है, बिना किसी अतिरिक्त प्रायश्चित्त-सिद्धान्त को जोड़े।
- issue: ईश्वर के लिए सम्बोधन-सर्वनाम
  choice: “हे प्रभु” के साथ निकट, एकवचन “तेरे”
  alternative: आदरार्थी “आपके”
  rationale: बाइबलीय प्रार्थना की सीधी सम्बोधन-शैली और मूल यूनानी के एकवचन σου को बनाए रखते हुए आधुनिक पाठक के लिए समझने योग्य रूप चुना गया है; इसका उद्देश्य अनादर नहीं, प्रार्थनात्मक निकटता है।
translation_notes:
