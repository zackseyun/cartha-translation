lexical_decisions:
- source_word: τῇ ὁδῷ
  choice: मार्ग पर
  rationale: ὁδός का मूल चित्र ‘मार्ग’ है और यहाँ यह जीवन-चाल का रूपक है। हिन्दी में ‘मार्ग पर चलना’ स्वाभाविक है और यूनानी रूपक को सुरक्षित रखता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: यह सीधा संबंधकारक है; ‘परमेश्वर के मार्ग’ से उस मार्ग का परमेश्वर से संबंध और उसके द्वारा निर्धारित जीवन-पथ दोनों व्यक्त होते हैं।
- source_word: εἰ ἐπορεύθης
  choice: यदि तुम ... चले होते
  rationale: εἰ के साथ अतीतकालीन ἐπορεύθης और उत्तरवाक्य में ἄν बीते समय की अपूर्ण, तथ्य-विरुद्ध शर्त व्यक्त करते हैं। ‘चले होते’ इस खेदपूर्ण आशय को स्वाभाविक हिन्दी में रखता है।
- source_word: κατῴκεις ἂν
  choice: तो ... रहते
  rationale: κατοικέω स्थायी रूप से रहने या बसने का भाव रखता है। शर्तीय वाक्य में ‘रहते’ स्वाभाविक हिन्दी है और केवल क्षणिक अनुभव के बजाय टिके रहने का अर्थ देता है।
- source_word: ἐν εἰρήνῃ
  choice: शान्ति से
  rationale: स्रोत में εἰρήνη एक अवस्था है। हिन्दी में ‘शान्ति से रहते’ स्वाभाविक रूप से शान्तिपूर्ण और सुरक्षित अवस्था में रहने का भाव व्यक्त करता है।
- source_word: τὸν αἰῶνα
  choice: सदा
  rationale: यहाँ पदबंध क्रियाविशेषण की तरह अनवरत अवधि बताता है। ‘सदा’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: शर्तीय रचना और निहित तथ्य-विरुद्ध भूतकाल
  choice: ‘यदि तुम ... चले होते, तो ... रहते’
  alternative: ‘यदि तुम ... चलते, तो ... रहते’
  rationale: यूनानी εἰ + aorist indicative और उत्तरवाक्य के ἄν से ऐसा बीता हुआ अवसर सूचित होता है जो वास्तव में पूरा नहीं हुआ। ‘चले होते’ इस तथ्य-विरुद्ध और विलापपूर्ण बल को स्पष्ट करता है।
- issue: ‘परमेश्वर के मार्ग’ का रूपक
  choice: रूपक को ‘परमेश्वर के मार्ग पर चलना’ के रूप में बनाए रखा गया
  alternative: ‘यदि तुम परमेश्वर की आज्ञा मानते’
  rationale: मूल पाठ ‘व्यवस्था’ या ‘आज्ञापालन’ नहीं, बल्कि ‘परमेश्वर का मार्ग’ कहता है। रूपक बनाए रखने से अर्थ को किसी संकीर्ण धार्मिक व्याख्या में नहीं बाँधा जाता।
- issue: εἰρήνη की अवस्था
  choice: ‘शान्ति से रहते’
  alternative: ‘शान्ति में निवास करते’
  rationale: ‘शान्ति में निवास’ अधिक शब्दानुवादी पर हिन्दी में कुछ कृत्रिम है। ‘शान्ति से रहते’ सामान्य पाठक के लिए स्वाभाविक रहते हुए स्थायी शान्ति की अवस्था व्यक्त करता है।
