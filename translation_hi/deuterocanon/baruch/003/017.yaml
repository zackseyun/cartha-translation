  rationale: धन-संचय के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀργύριον … χρυσίον
  choice: चाँदी और सोना
  rationale: दोनों बहुमूल्य धातुओं के स्पष्ट उल्लेख को अक्षुण्ण रखता है; ‘धन’ कहकर सामान्यीकृत नहीं करता।
- source_word: ᾧ ἐπεποίθεισαν ἄνθρωποι
  choice: जिस पर लोगों ने भरोसा रखा
  rationale: एकवचन सम्बन्धवाचक सर्वनाम को संचित चाँदी-सोने की संयुक्त सम्पत्ति से जोड़ता है। ‘लोगों’ से ἄνθρωποι का सामान्य मानव-सन्दर्भ और भूतकालिक भरोसा स्वाभाविक हिन्दी में आता है।
- source_word: οὐκ ἔστιν τέλος τῆς κτήσεως αὐτῶν
  choice: उनकी सम्पत्ति का कोई अन्त नहीं है
  rationale: अस्तित्ववाचक यूनानी कथन और κτῆσις के अर्जित सम्पत्ति/माल-मिल्कियत वाले व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: ἄνθρωποι का सामान्य मानव-सन्दर्भ
  choice: लोगों
  alternative: मनुष्यों
  rationale: यहाँ शब्द केवल पुरुषों को नहीं, सामान्यतः धन पर भरोसा रखने वाले लोगों को सूचित करता है। ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक है और कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: धन पर भरोसे का कर्म
  choice: जिस पर लोगों ने भरोसा रखा
  alternative: जिन पर लोगों ने भरोसा रखा
  rationale: यूनानी सम्बन्धवाचक सर्वनाम ᾧ एकवचन है, यद्यपि उसका आशय चाँदी-सोने से बनी संचित सम्पत्ति के सामूहिक विचार से है। हिन्दी में एकवचन रखकर इस व्याकरणिक तनाव को सुरक्षित किया गया है।
