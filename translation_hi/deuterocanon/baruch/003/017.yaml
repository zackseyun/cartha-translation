- source_word: ἐμπαίζοντες
  choice: खेल करते हैं
  rationale: यूनानी कृदन्त खेल, क्रीड़ा या किसी को खेल का साधन बनाने का भाव दे सकता है। प्रसंग सम्भवतः पक्षियों से जुड़ी शिकार-जैसी क्रीड़ा की ओर संकेत करता है, पर अनुवाद अनावश्यक रूप से ‘शिकार’ निश्चित नहीं करता।
- source_word: ὀρνέοις τοῦ οὐρανοῦ
  choice: आकाश के पक्षियों
  rationale: यह यूनानी पदबंध का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: θησαυρίζοντες
