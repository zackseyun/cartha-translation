  rationale: इस पद में कर्ता-संज्ञा दोहराई नहीं गई है। ‘वह’ हिन्दी में संदर्भ को बनाए रखता है, जबकि अनुवाद के भीतर व्यापक व्याख्यात्मक और धर्मवैज्ञानिक प्रश्न का अंतिम निर्णय नहीं करता।
