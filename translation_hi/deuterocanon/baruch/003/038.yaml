- source_word: ἐν τοῖς ἀνθρώποις
  choice: मनुष्यों के बीच
  rationale: ἀνθρώποις समस्त मानवजाति को सूचित करता है; ‘मनुष्यों’ आधुनिक हिन्दी में सटीक और लिंग-समावेशी है।
- source_word: συνανεστράφη
  choice: रहा
  rationale: क्रिया लोगों के साथ रहने और उनके बीच जीवन बिताने का भाव रखती है। संदर्भ में ‘मनुष्यों के बीच रहा’ संक्षिप्त, स्वाभाविक और अर्थपूर्ण है।
theological_decisions:
