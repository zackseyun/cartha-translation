base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/023.yaml
  text: And the sons of Hagar also[a], who seek understanding on the earth—the merchants of Merran and Teman, and the myth-makers and seekers of understanding—did not know the way of wisdom[b], nor did they remember her paths.
translation:
  language: hi
  text: हाजिरा के पुत्र भी, और वे जो पृथ्वी पर समझ की खोज करते हैं—मेर्रान[a] और तेमान के व्यापारी, मिथकों की बातें करनेवाले[b], और समझ के खोजी—बुद्धि का मार्ग न जान सके और न उसके पथों को स्मरण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ ‘मेर्रान’ है। यह स्थान-नाम असामान्य है और कुछ पाठ-परंपराएँ इसे अलग ढंग से पहचानती या सामान्यीकृत करती हैं; यहाँ उपलब्ध यूनानी रूप ही रखा गया है।
    reason: textual_variant
  - marker: b
    text: 'यूनानी शब्द का अर्थ ऐसे लोग हो सकता है जो मिथकों या कथाओं से संबंधित बातें कहते-सुनाते हैं; अन्य अनुवाद संभव है: ‘कथा सुनानेवाले’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε υἱοὶ Ἁγὰρ
  choice: हाजिरा के पुत्र भी
  rationale: υἱοί का सीधा अर्थ ‘पुत्र’ रखा गया है; τε की योगात्मक शक्ति को ‘भी’ से व्यक्त किया गया है।
- source_word: οἱ ἐκζητοῦντες τὴν σύνεσιν
  choice: जो ... समझ की खोज करते हैं
  rationale: ἐκζητέω की सक्रिय खोज का भाव ‘खोज करते हैं’ से और σύνεσις का अर्थ सहज आधुनिक हिन्दी में ‘समझ’ से व्यक्त होता है।
- source_word: οἱ ἐπὶ γῆς
  choice: पृथ्वी पर
  rationale: यूनानी पदबंध की व्यापक भौगोलिक ध्वनि बनाए रखी गई है; इसे अधिक सीमित ‘देश में’ नहीं किया गया।
- source_word: οἱ ἔμποροι τῆς Μερρὰν καὶ Θαιμάν
  choice: मेर्रान और तेमान के व्यापारी
  rationale: ἔμποροι के लिए स्वाभाविक ‘व्यापारी’ चुना गया है। Μερρὰν को उपलब्ध यूनानी पाठ के अनुसार लिप्यंतरित किया गया और Θαιμάν को हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘तेमान’ दिया गया।
- source_word: οἱ μυθολόγοι
  choice: मिथक-कथाएँ सुनानेवाले
  rationale: शब्द उन लोगों को सूचित करता है जो मिथकों या कथाओं का वर्णन करते हैं। यह रूप ‘कहानीकार’ की अपेक्षा मिथकीय तत्व को अधिक स्पष्ट रखता है, पर अनावश्यक रूप से उन्हें झूठा नहीं ठहराता।
- source_word: οἱ ἐκζητηταὶ τῆς συνέσεως
  choice: समझ के खोजी
  rationale: पहले आए σύνεσις और खोज के भाव की पुनरावृत्ति को बनाए रखने के लिए वही मूल शब्दावली रखी गई है।
- source_word: ὁδὸν δὲ σοφίας
  choice: बुद्धि का मार्ग
  rationale: ὁδός और σοφία की रूपकात्मक अभिव्यक्ति को सहज बाइबलीय हिन्दी में सुरक्षित रखा गया है; आगे τρίβους के लिए ‘पथ’ रखकर यूनानी भिन्नता भी बचाई गई है।
- source_word: οὐκ ἔγνωσαν
  choice: न जान सके
  rationale: यूनानी अओरिस्ट के पूर्ण निषेध को प्रसंगानुकूल हिन्दी में व्यक्त करता है।
- source_word: οὐδὲ ἐμνήσθησαν τὰς τρίβους αὐτῆς
  choice: और न उसके पथों को स्मरण रखा
  rationale: ἐμνήσθησαν का स्मरण-संबंधी अर्थ और τρίβους की पथ-छवि दोनों सुरक्षित हैं। ‘उसके’ का संकेत बुद्धि की ओर है।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: ‘उसके पथों’ द्वारा बुद्धि की ओर संकेत बनाए रखा
  alternative: ‘उन पथों’ या ‘बुद्धि के पथों’ की पुनरावृत्ति
  rationale: σοφία यूनानी में स्त्रीलिंग है और प्रसंग में मानवीकृत है। हिन्दी का ‘उसके’ व्याकरणिक लिंग प्रकट नहीं करता, फिर भी संदर्भ और मार्ग-पथ की छवि मानवीकरण को बनाए रखते हैं; कृत्रिम स्त्रीवाची सर्वनाम जोड़ना स्वाभाविक हिन्दी नहीं होता।
- issue: कठिन भौगोलिक नाम Μερρὰν
  choice: मेर्रान को उपलब्ध यूनानी पाठ के अनुसार रखा
  alternative: किसी अधिक परिचित स्थान-नाम के रूप में संशोधन
  rationale: स्रोत साक्षी में Μερρὰν ही है। अनिश्चित नाम को चुपचाप सामान्यीकृत करना पाठगत कठिनाई को छिपा देता, इसलिए पारदर्शिता के लिए लिप्यंतरण और पादटिप्पणी दी गई है।
translation_notes:
  register: आधुनिक, dignified और सामान्य पाठक के लिए बोधगम्य हिन्दी अपनाई गई है। वाक्य की सूची-संरचना को दीर्घ विराम से स्पष्ट किया गया है। ‘समझ’ की पुनरावृत्ति मूल यूनानी की आलंकारिक पुनरावृत्ति को बनाए रखती है; ‘मार्ग’ और ‘पथ’ ὁδός तथा τρίβοι के भेद को दर्शाते हैं।
