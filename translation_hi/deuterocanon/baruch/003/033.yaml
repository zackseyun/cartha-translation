- source_word: πορεύεται
  choice: वह चली जाती है
  rationale: सरल गति-सूचक अभिव्यक्ति प्रकाश के भेजे जाने पर जाने के चित्र को बनाए रखती है; भूतकाल में बदले बिना यूनानी वर्तमान काल भी सुरक्षित रहता है।
- source_word: ἐκάλεσεν αὐτό
  choice: उसने उसे पुकारा
  rationale: ‘पुकारा’ व्यक्तिगत संबोधन और काव्यात्मक समानांतरता को रखता है, बिना इसे अधिक औपचारिक ‘बुलावा’ या ‘आह्वान’ बनाने के।
- source_word: ὑπήκουσεν αὐτῷ
  choice: उसने उसकी आज्ञा मानी
  rationale: यहाँ क्रिया सुनकर अधीनतापूर्वक प्रत्युत्तर देने का भाव रखती है। ‘आज्ञा मानी’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τρόμῳ
  choice: काँपते हुए
  rationale: करण/रीति के अर्थ वाले dative को क्रियाविशेषणीय ढंग से प्रस्तुत किया गया है; इससे सृष्टि के विस्मयपूर्ण मानवीकरण की जीवंतता बनी रहती है।
theological_decisions:
- issue: ज्योति का परमेश्वर की आज्ञा मानने वाला मानवीकरण
  choice: मुख्य पाठ में मानवीकरण को सीधे बनाए रखा गया है।
  alternative: इसे प्राकृतिक व्यवस्था के निर्वैयक्तिक वर्णन के रूप में नरम करना।
  rationale: यूनानी पाठ ज्योति के जाने, पुकारे जाने और काँपते हुए आज्ञा मानने की बात स्पष्ट रूप से करता है। यह चित्र परमेश्वर की सृष्टि पर प्रभुता को काव्यात्मक ढंग से व्यक्त करता है।
- issue: ὁ ἀποστέλλων का कर्ता
  choice: संदर्भानुसार ‘वह’ से परमेश्वर को व्यक्त किया गया है।
  alternative: ‘वह जो ज्योति को भेजता है’ जैसा अधिक रूपगत अनुवाद।
  rationale: निश्चित participle संज्ञात्मक है और आसपास का संदर्भ कर्ता को परमेश्वर के रूप में पहचानता है। हिन्दी में ‘वह ... भेजता है’ अधिक स्वाभाविक है; रूपगत अंतर पादटिप्पणी में दिया गया है।
