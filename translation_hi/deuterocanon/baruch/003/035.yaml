base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/035.yaml
  text: He called them[a], and they said, ‘Here we are’[c][b]; they shone with gladness for the one who made them.
translation:
  language: hi
  text: उसने उन्हें पुकारा, और उन्होंने कहा, “हम यहाँ हैं।”[a] वे अपने बनानेवाले के लिए आनन्द से चमक उठे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् आकाशीय प्रकाशों या तारों ने मानो अपने सृष्टिकर्ता की पुकार का उत्तर दिया। इसका अनुवाद “उन्होंने उत्तर दिया, ‘हम उपस्थित हैं’” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अपने बनानेवाले के सामने” या “अपने बनानेवाले की ओर” भी सम्भव; यूनानी सम्प्रदान कारक यहाँ सम्बन्ध की एक से अधिक सूक्ष्म छायाएँ व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: उसने ... पुकारा
  rationale: καλέω के सामान्य अर्थ ‘पुकारना/बुलाना’ को स्वाभाविक हिन्दी में व्यक्त करता है और अगले उत्तर के साथ स्पष्ट संबंध बनाए रखता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन सर्वनाम पूर्ववर्ती प्रसंग के आकाशीय प्रकाशों/तारों की ओर संकेत करता है; हिन्दी में ‘उन्हें’ इस मानवीकरण को स्वाभाविक रूप से बनाए रखता है।
- source_word: εἶπον
  choice: उन्होंने कहा
  rationale: मूल क्रिया का सीधा अर्थ ‘उन्होंने कहा’ है। पुकार के बाद आने के कारण उत्तर देने का भाव प्रसंग से स्वतः स्पष्ट है।
- source_word: Πάρεσμεν
  choice: हम यहाँ हैं
  rationale: यह अभिव्यक्ति पुकारे जाने पर उपस्थिति और तत्परता दोनों बताती है; आधुनिक हिन्दी में ‘हम यहाँ हैं’ स्वाभाविक और स्पष्ट है।
- source_word: ἔλαμψαν
  choice: चमक उठे
  rationale: λάμπω का अर्थ चमकना है। ‘चमक उठे’ घटना की पूर्ण क्रिया और काव्यात्मक सजीवता को सहज हिन्दी में व्यक्त करता है।
- source_word: μετʼ εὐφροσύνης
  choice: आनन्द से
  rationale: εὐφροσύνη हर्ष अथवा आनन्द का बोध कराता है; ‘आनन्द से’ गरिमापूर्ण, सुबोध और संक्षिप्त है।
- source_word: τῷ ποιήσαντι αὐτούς
  choice: अपने बनानेवाले के लिए
  rationale: कृदन्त का अर्थ ‘जिसने उन्हें बनाया’ है। सम्बन्धसूचक यूनानी सम्प्रदान कारक को ‘के लिए’ से प्रस्तुत किया गया है, जबकि अन्य सम्भव सूक्ष्म अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: आकाशीय प्रकाशों का मानवीकृत उत्तर
  choice: तारों/आकाशीय प्रकाशों को पुकार का उत्तर देते और आनन्द से चमकते हुए सीधे चित्रित करना
  alternative: इसे निर्जीव खगोलीय वर्णन बनाकर मानवीकरण को मंद कर देना
  rationale: यूनानी पाठ सृष्टि को अपने सृष्टिकर्ता की पुकार का प्रत्युत्तर देते हुए काव्यात्मक रूप में प्रस्तुत करता है। अनुवाद इस धर्मवैचारिक और साहित्यिक तनाव को बिना समतल किए बनाए रखता है।
- issue: τῷ ποιήσαντι αὐτούς में सम्प्रदान कारक का सम्बन्ध
  choice: ‘अपने बनानेवाले के लिए’
  alternative: ‘अपने बनानेवाले के सामने’ अथवा ‘अपने बनानेवाले की ओर’
  rationale: यूनानी सम्प्रदान कारक प्रयोजन, सम्बन्ध या अभिमुखता की छाया रख सकता है। मुख्य पाठ में स्वाभाविक विकल्प चुना गया है और वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक गद्य। ‘बनानेवाले’ सामान्य पाठक के लिए सहज है और मूल के ποιήσαντι को सीधे व्यक्त करता है। मानवीकरण को अक्षुण्ण रखा गया है; पादटिप्पणियाँ उत्तर के भाव और सम्प्रदान कारक की वास्तविक अस्पष्टता स्पष्ट करती हैं।
