translation:
  language: hi
  text: क्योंकि आप सदा विराजमान रहते हैं[a], और हम सदा नाश होते जा रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदा बैठे रहते हैं।” यहाँ यूनानी में शाब्दिक रूप से बैठने या बैठे रहने की बात है; संदर्भ में इसका अर्थ सिंहासन पर विराजमान होना हो सकता है, पर ‘सिंहासन’ शब्द स्पष्ट रूप से नहीं आया है।
    reason: καθήμενος के शाब्दिक आसन-बोध और संभावित राजकीय अर्थ, दोनों को बिना मिलाए प्रस्तुत करना।
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पद संदर्भ में पिछली विनती का आधार या कारण बताता है; ‘क्योंकि’ यूनानी के कारणसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σὺ
  choice: आप
  rationale: स्पष्ट सर्वनाम को बनाए रखकर परमेश्वर और ‘हम’ के बीच के जोरदार विरोध को सुरक्षित रखा गया है; आदरसूचक रूप हिन्दी के प्रार्थनात्मक संदर्भ के अनुकूल है।
- source_word: καθήμενος
  choice: विराजमान रहते हैं
  rationale: यह बैठने की स्थिति और उसके निरंतर बने रहने का भाव व्यक्त करता है। ‘विराजमान’ परमेश्वर के संदर्भ में गरिमापूर्ण और स्वाभाविक है, पर मुख्य पाठ में सिंहासन शब्द नहीं जोड़ता।
- source_word: τὸν αἰῶνα
  choice: सदा
  rationale: अवधि बताने वाला यह पदबंध यहाँ अनंत या निरंतर काल का बोध देता है; ‘सदा’ संक्षिप्त और स्वाभाविक है तथा दोनों खंडों की समानांतरता बनाए रखता है।
- source_word: ἡμεῖς
  choice: हम
  rationale: स्पष्ट सर्वनाम को बनाए रखने से ‘आप’ और ‘हम’ का तीखा विरोध सुरक्षित रहता है।
- source_word: ἀπολλύμενοι
  choice: नाश होते जा रहे हैं
  rationale: वर्तमान कृदंत की जारी प्रक्रिया को व्यक्त करता है और विनाश, पतन या मिटते जाने के बीच स्रोत में उपस्थित अर्थ-विस्तार को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: क्या καθήμενος को स्पष्ट राजकीय अर्थ में ‘सिंहासन पर विराजमान’ कहा जाए
  choice: मुख्य पाठ में ‘विराजमान रहते हैं’
  alternative: ‘सिंहासन पर विराजमान रहते हैं’ या अधिक शाब्दिक ‘बैठे रहते हैं’
  rationale: परमेश्वर के संदर्भ में राजकीय या सिंहासनगत भाव संभव है, लेकिन यूनानी पाठ स्वयं ‘सिंहासन’ नहीं कहता। इसलिए मुख्य पाठ गरिमा और स्थायित्व का भाव रखता है, जबकि स्पष्ट सिंहासन-चित्र को पादटिप्पणी तक सीमित करता है।
- issue: दोनों बार τὸν αἰῶνα का अर्थ
  choice: दोनों खंडों में ‘सदा’
  alternative: दूसरे खंड में ‘लगातार’
  rationale: एक ही पदबंध की पुनरावृत्ति जानबूझकर परमेश्वर की स्थायी स्थिति और समुदाय के चलते हुए विनाश के बीच कठोर समानांतर विरोध बनाती है; समान अनुवाद इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक स्तर अपनाया गया है। ‘विराजमान रहते हैं’ और ‘नाश होते जा रहे हैं’ के माध्यम से स्थायी दिव्य स्थिति तथा जारी मानवीय विनाश का विरोध स्पष्ट रखा गया है।
