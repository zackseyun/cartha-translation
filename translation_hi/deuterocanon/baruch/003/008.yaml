  yaml_path: translation/deuterocanon/baruch/003/008.yaml
  text: Behold[a], today we are in our exile, where you scattered us, for reproach and for a curse and for payment, according to all the wrongdoings of our fathers, who turned away from the Lord our God.
translation:
  language: hi
  text: देखो, आज हम अपने निर्वासन में हैं, जहाँ तूने हमें तितर-बितर कर दिया—अपमान और शाप सहने तथा देनदारी चुकाने[a] के लिए, हमारे पुरखों के उन सब अधर्मों के अनुसार, जिन्होंने प्रभु हमारे परमेश्वर से मुँह मोड़ लिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दण्ड भुगतने’ अथवा ‘ऋण चुकाने’। यूनानी शब्द देनदारी, दायित्व, भुगतान या दण्ड का भाव दे सकता है; यहाँ प्रसंग परमेश्वर के न्याय का है।
    reason: lexical_alternative
