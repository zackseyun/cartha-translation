translation:
  language: hi
  text: किसने उसका स्थान पाया, और कौन उसके भंडारों[a] में प्रवेश किया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खज़ानों।” यूनानी शब्द का अर्थ खज़ाने स्वयं या उन्हें रखने के भंडार—दोनों हो सकता है। यहाँ “उनमें प्रवेश किया” कहे जाने के कारण मुख्य पाठ में “भंडारों” चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς εὗρεν
  choice: किसने पाया
  rationale: सीधे आलंकारिक प्रश्न और यूनानी एओरिस्ट की पूर्ण क्रिया को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν τόπον αὐτῆς
  choice: उसका स्थान
  rationale: τόπος का सामान्य अर्थ ‘स्थान’ है। यह बुद्धि के निवास या स्वरूप की अतिरिक्त व्याख्या किए बिना मूल रूपक को बनाए रखता है। हिन्दी का ‘उसका’ स्वाभाविक सर्वनाम है; यद्यपि उसमें व्याकरणिक लिंग प्रकट नहीं होता, संदर्भ में इसका पूर्वपद स्त्रीलिंग ‘बुद्धि’ है।
- source_word: εἰσῆλθεν εἰς
  choice: में प्रवेश किया
  rationale: यह भीतर की ओर गति को स्पष्ट करता है और यूनानी क्रिया तथा εἰς के संयुक्त बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τοὺς θησαυροὺς αὐτῆς
  choice: उसके भंडारों
  rationale: θησαυρός धन-संपदा अथवा उसे रखने के स्थान, दोनों को सूचित कर सकता है। ‘में प्रवेश किया’ के साथ स्थानवाचक ‘भंडारों’ अधिक संगत है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: ‘उसका/उसके’ द्वारा संदर्भगत मानवीकरण बनाए रखना
  alternative: अमूर्त अर्थ को अधिक स्पष्ट करने के लिए ‘बुद्धि का/बुद्धि के’ दोहराना
  rationale: यूनानी में αὐτῆς स्त्रीलिंग है और आसपास के प्रसंग में बुद्धि का मानवीकरण हुआ है। हिन्दी सर्वनाम लिंग नहीं दर्शाता, फिर भी उसका संदर्भ स्त्रीलिंग ‘बुद्धि’ से बना रहता है; संज्ञा को अनावश्यक रूप से दोहराए बिना मूल की अभिव्यक्ति सुरक्षित रहती है।
- issue: θησαυρούς की अर्थगत अस्पष्टता
  choice: मुख्य पाठ में स्थानवाचक ‘भंडारों’
  alternative: ‘खज़ानों’ अथवा ‘धन-संपदा’
  rationale: ‘प्रवेश किया’ स्थानवाचक अर्थ का समर्थन करता है, पर यूनानी शब्द में निहित ‘खज़ाने’ का अर्थ पादटिप्पणी में रखा गया है ताकि वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। प्रश्न की काव्यात्मक समानांतर रचना सुरक्षित है। पादटिप्पणी-चिह्न [a] उसी शब्द के बाद रखा गया है जिससे अर्थगत विकल्प संबंधित है।
