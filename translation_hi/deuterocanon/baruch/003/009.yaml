- source_word: ζωῆς
  choice: जीवन की
  rationale: यूनानी संबंधकारक की संक्षिप्तता और उसकी संभावित अर्थ-व्याप्ति—जीवन देने वाली, जीवन के लिए, या जीवन से संबंधित—को यथासंभव खुला रखा गया है।
- source_word: ἐνωτίσασθε
  choice: कान लगाओ
  rationale: ἐνωτίζομαι का बहुवचन आज्ञार्थक रूप कान देकर ध्यानपूर्वक सुनने का सजीव मुहावरा है। ‘कान लगाओ’ मूल बिंब और बहुवचन दोनों को सुरक्षित रखता है।
- source_word: γνῶναι
  choice: जानने के लिए
  rationale: यह उद्देश्य सूचित करने वाला infinitive है; ‘जानने के लिए’ उसके सीधे अर्थ और वाक्यगत संबंध को बनाए रखता है।
- source_word: φρόνησιν
  choice: विवेक
  rationale: φρόνησις व्यावहारिक समझ, सूझ-बूझ और विवेक को व्यक्त कर सकता है। ‘विवेक’ नैतिक-व्यावहारिक समझ का भाव रखते हुए संक्षिप्त और गरिमापूर्ण है।
theological_decisions:
- issue: ἐντολὰς ζωῆς में संबंधकारक का अर्थ
  choice: जीवन की आज्ञाएँ
  alternative: जीवन देने वाली आज्ञाएँ; जीवन के लिए आज्ञाएँ
  rationale: मूल यूनानी वाक्यांश यह निश्चित नहीं करता कि जीवन इन आज्ञाओं का परिणाम, उद्देश्य या गुण है। मुख्य पाठ में ‘जीवन की’ रखकर इस वास्तविक अर्थगत खुलापन को सुरक्षित रखा गया है।
- issue: इस्राएल को संबोधित आज्ञार्थक क्रियाओं की वचन-भिन्नता
  choice: ‘सुन’ एकवचन और ‘कान लगाओ’ बहुवचन
  alternative: दोनों क्रियाओं को हिन्दी में एक ही वचन में रखना
  rationale: यूनानी पाठ पहले इस्राएल को सामूहिक एकवचन मानता है, फिर बहुवचन आज्ञार्थक रूप प्रयोग करता है। अनुवाद इस परिवर्तन को समतल नहीं करता।
