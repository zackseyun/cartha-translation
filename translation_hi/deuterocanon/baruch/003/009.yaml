- source_word: Ἄκουε
  choice: सुन
  rationale: ἀκούω का एकवचन आज्ञार्थक रूप है और इस्राएल को एक सामूहिक इकाई के रूप में संबोधित करता है। ‘सुन’ उसकी संख्या और गंभीर आह्वान को बनाए रखता है।
- source_word: Ἰσραήλ
