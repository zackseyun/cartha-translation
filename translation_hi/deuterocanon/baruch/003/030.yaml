    reason: मूल यूनानी के स्त्रीलिंग सर्वनाम और बुद्धि के व्यक्तिरूपण को स्पष्ट करना।
lexical_decisions:
- source_word: τίς
  choice: कौन
  rationale: यह बुद्धि को मानवीय प्रयास से प्राप्त करने की असंभवता पर बल देने वाला आलंकारिक प्रश्न आरम्भ करता है।
- source_word: διέβη πέραν τῆς θαλάσσης
  choice: समुद्र के पार गया
  rationale: यह पूर्ण की गई गति और समुद्र के दूसरी ओर जाने का स्थानिक भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εὗρεν αὐτήν
  choice: उसे पा लिया
  rationale: ‘उसे’ का संदर्भ प्रसंग में व्यक्तिरूप में प्रस्तुत बुद्धि से है; ‘पा लिया’ यूनानी क्रिया के पूर्ण घटना-भाव को व्यक्त करता है।
- source_word: οἴσει αὐτὴν
  choice: उसे ले आएगा
  rationale: φέρω का अर्थ ‘लाना/ले आना’ है। यहाँ समुद्र पार से बुद्धि को प्राप्त करके लाने की कल्पना के कारण ‘ले आएगा’ हिन्दी में स्वाभाविक है, जबकि अलग से ‘वापस’ नहीं जोड़ा गया।
- source_word: χρυσίου ἐκλεκτοῦ
  choice: उत्तम सोने के बदले
  rationale: ἐκλεκτός मूल्यवान, चुने हुए या उत्कृष्ट सोने का बोध देता है। वाक्य में संबंध को विनिमय अथवा मूल्य के रूप में समझना सबसे स्वाभाविक है; ‘उत्तम सोना’ गरिमापूर्ण और सुबोध है।
theological_decisions:
- issue: αὐτήν द्वारा बुद्धि का स्त्रीलिंग व्यक्तिरूपण
  choice: मुख्य पाठ में स्वाभाविक हिन्दी सर्वनाम ‘उसे’ रखा और पादटिप्पणी में व्यक्तिरूपण स्पष्ट किया
  alternative: सर्वनाम के स्थान पर ‘उस बुद्धि को’ जोड़ना
  rationale: यूनानी में स्त्रीलिंग सर्वनाम प्रसंग की स्त्रीलिंग संज्ञा ‘बुद्धि’ की ओर संकेत करता है। हिन्दी का ‘उसे’ लिंग-निरपेक्ष है; पादटिप्पणी साहित्यिक-धर्मवैचारिक विशेषता बचाती है, बिना मूल सर्वनाम को संज्ञा में विस्तृत किए।
