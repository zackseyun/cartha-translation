lexical_decisions:
- source_word: ἐξεῦρεν
  choice: खोज निकाला
  rationale: यह संयुक्त क्रिया किसी वस्तु को खोज लेने या उसका पता लगा लेने का सक्रिय भाव देती है; ‘खोज निकाला’ साधारण ‘पाया’ से इस भाव को अधिक स्पष्ट रखता है।
- source_word: πᾶσαν ὁδὸν ἐπιστήμης
  choice: ज्ञान का हर मार्ग
  rationale: ὁδός के मार्ग-रूपक और ἐπιστήμης के सीधे अर्थ ‘ज्ञान’ दोनों को बनाए रखता है; इसे ‘बुद्धि’ कहकर σοφία का अर्थ आरोपित नहीं किया गया।
- source_word: ἔδωκεν αὐτήν
  choice: उसे ... दे दिया
  rationale: स्त्रीलिंग सर्वनाम αὐτήν पीछे आए ‘ज्ञान के मार्ग’ की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक और स्पष्ट है।
- source_word: τῷ παιδὶ αὐτοῦ
  choice: अपने सेवक[a]
  rationale: παῖς का अर्थ सेवक, बालक या पुत्र हो सकता है। परमेश्वर से याकूब के वाचागत संबंध में ‘सेवक’ उपयुक्त है, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता सुरक्षित रखती है।
- source_word: τῷ ἠγαπημένῳ ὑπʼ αὐτοῦ
  choice: अपने प्रिय
  rationale: इस निष्क्रिय कृदन्त का शाब्दिक भाव ‘उसके द्वारा प्रेम किया हुआ’ है; ‘अपने प्रिय’ आधुनिक हिन्दी में स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: Ἰακὼβ ... Ἰσραὴλ
  choice: याकूब ... इस्राएल
  rationale: दोनों नाम मूल के समानांतर विन्यास में रखे गए हैं और प्रचलित हिन्दी बाइबलीय वर्तनी अपनाई गई है।
theological_decisions:
- issue: परमेश्वर के संबंध में याकूब के लिए παῖς का अनुवाद
  choice: सेवक
  alternative: बालक या पुत्र
  rationale: वाचागत और शास्त्रीय प्रयोग में ‘सेवक’ संदर्भ के अनुकूल है, पर यूनानी शब्द की संतान-संबंधी संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: याकूब और इस्राएल को एक ही उल्लेख में मिला देना या दोनों को रखना
  choice: दोनों नाम समानांतर रूप में रखे गए
  alternative: ‘याकूब/इस्राएल’ के रूप में एक उल्लेख या केवल इस्राएली प्रजा के अर्थ में व्याख्या
  rationale: यूनानी पाठ दोनों नामों को अलग समानांतर पदों में प्रस्तुत करता है। दोनों को रखना काव्यात्मक बनावट और चुने हुए जन से संबंधित भाव को बिना संकुचित व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सहज शैली। ‘ज्ञान का हर मार्ग’ मूल रूपक को बनाए रखता है। दूसरे खंड में ‘याकूब ... इस्राएल’ को समान व्यक्ति/समुदाय के समानांतर संबोधनों की तरह स्वाभाविक हिन्दी विराम के साथ रखा गया है।
