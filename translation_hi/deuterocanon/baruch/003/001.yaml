    text: इसका अनुवाद ‘तंगी में पड़ा प्राण और मन से टूटी हुई आत्मा’ भी हो सकता है। यूनानी शब्द भारी क्लेश, घिर जाने और हिम्मत टूटने का भाव भी दे सकते हैं।
    reason: शब्दार्थ की वैकल्पिक सम्भावना और विलाप की भाव-तीव्रता स्पष्ट करना।
