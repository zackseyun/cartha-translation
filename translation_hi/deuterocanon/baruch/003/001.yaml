  text: हे सर्वशक्तिमान प्रभु, इस्राएल के परमेश्वर, संकटग्रस्त प्राण और हतोत्साहित आत्मा[a] ने आपको पुकारा है।
  philosophy: optimal-equivalence
  footnotes:
