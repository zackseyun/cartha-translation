- source_word: πνεῦμα ἀκηδιῶν
  choice: हतोत्साहित आत्मा
  rationale: πνεῦμα को भीतरी आत्मा और ἀκηδιῶν को साहस टूटने या मन बुझने की दशा के रूप में व्यक्त किया गया है, बिना इसे चिकित्सकीय निराशा का तकनीकी अर्थ दिए।
- source_word: κέκραγεν πρὸς σέ
  choice: ने आपको पुकारा है
  rationale: पूर्णकालिक क्रिया के पूरे हो चुके किंतु वर्तमान में प्रभावी पुकार के भाव को ‘पुकारा है’ से रखा गया है; ‘आपको’ आधुनिक, आदरपूर्ण प्रार्थना-भाषा है।
theological_decisions:
- issue: ψυχή और πνεῦμα का मानवशास्त्रीय युग्म
  choice: दोनों को अलग-अलग ‘प्राण’ और ‘आत्मा’ के रूप में रखा गया है।
  alternative: दोनों को मिलाकर ‘मन’ या ‘हृदय’ कहना।
  rationale: यूनानी पद काव्यात्मक समानांतरता में दो निकट, पर भिन्न भीतरी-मानवीय शब्द रखता है। उन्हें अलग रखने से पाठ की साहित्यिक और धर्मवैचारिक तनावपूर्ण व्यापकता बनी रहती है, बिना कोई कठोर तकनीकी मानवशास्त्र आरोपित किए।
- issue: संयुक्त पदों के साथ एकवचन क्रिया
  choice: ‘ने आपको पुकारा है’
  alternative: ‘आपको पुकारते हैं’
  rationale: यूनानी κέκραγεν एकवचन है और ‘प्राण’ तथा ‘आत्मा’ को एक ही व्यथित व्यक्ति के समानांतर वर्णन के रूप में ग्रहण करने की अनुमति देता है; हिन्दी में एकवचन पूर्ण क्रिया उसी संरचना को सुरक्षित रखती है।
