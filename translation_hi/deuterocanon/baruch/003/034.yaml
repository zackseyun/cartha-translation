- source_word: ἐν ταῖς φυλακαῖς αὐτῶν
  choice: अपने-अपने पहरों में
  rationale: φυλακή में पहर, निगरानी का समय, या चौकी का अर्थ हो सकता है। ‘अपने-अपने पहरों में’ मूल बिंब और तारों के लिए ठहराए गए स्थान अथवा समय—दोनों की सम्भावना बनाए रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: εὐφράνθησαν
  choice: आनन्दित हुए
  rationale: यह रूप आनन्द या प्रसन्नता व्यक्त करता है। ‘आनन्दित हुए’ तारों के मानवीकरण और पद के गरिमापूर्ण काव्यात्मक स्वर को बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यह संयोजक यहाँ पिछले कथन को आगे बढ़ाता है; हिन्दी में ‘और’ प्रसंग के प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
