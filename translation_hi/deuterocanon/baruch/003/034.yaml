- issue: तारों का काव्यात्मक मानवीकरण
  choice: ‘तारे... आनन्दित हुए’ को सीधे बनाए रखा गया है।
  alternative: इसे केवल निर्जीव खगोलीय गतिविधि के वर्णन के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ तारों को आनन्दित होते हुए दिखाता है और इस प्रकार सृष्टि को परमेश्वर की व्यवस्था के प्रति प्रत्युत्तर देते हुए चित्रित करता है। अनुवाद इस साहित्यिक और धर्मवैचारिक तनाव को निर्जीव वर्णन में नहीं बदलता।
