lexical_decisions:
- source_word: ἀπώλοντο
  choice: नष्ट हो गए
  rationale: यहाँ क्रिया विनाश या बरबादी को दर्शाती है। ‘नष्ट हो गए’ मृत्यु के ढंग को अनावश्यक रूप से निश्चित किए बिना यूनानी की गंभीरता और दोनों खंडों की पुनरावृत्ति बनाए रखता है।
- source_word: παρὰ τὸ μὴ ἔχειν
  choice: न होने के कारण
  rationale: παρὰ τό + infinitive कारण व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से उसी कारणात्मक संबंध को बनाए रखता है।
- source_word: φρόνησιν
  choice: समझ-बूझ
  rationale: φρόνησις में व्यावहारिक समझ और विवेक दोनों निहित हैं। ‘समझ-बूझ’ सामान्य आधुनिक हिंदी में सहज है और अर्थ को केवल बौद्धिक ज्ञान तक सीमित नहीं करता।
- source_word: διὰ τὴν ἀβουλίαν
  choice: अविवेकपूर्णता के कारण
  rationale: ἀβουλία विचार-विमर्श, उचित सलाह या सही निर्णय के अभाव को दर्शाता है। ‘अविवेकपूर्णता’ इस निर्णय-संबंधी कमी को संक्षेप और स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: αὐτῶν
  choice: अपनी ही
  rationale: यह स्पष्ट संबंधवाचक सर्वनाम को व्यक्त करता और बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े उनकी अपनी कमी पर बल बनाए रखता है।
theological_decisions:
- issue: विनाश का कारण
  choice: पद में बताए गए समझ-बूझ और विवेकपूर्ण विचार के अभाव को ही कारण के रूप में रखा गया है।
  alternative: इसे अधिक व्याख्यात्मक ढंग से ‘मूर्खता’ या ‘बुद्धिहीनता’ कहा जा सकता था।
  rationale: यूनानी पाठ कारण को ज्ञान और विचार-विमर्श से संबंधित शब्दों में व्यक्त करता है; अनुवाद इससे आगे बढ़कर कोई व्यापक नैतिक या धर्मसैद्धांतिक निदान नहीं जोड़ता।
