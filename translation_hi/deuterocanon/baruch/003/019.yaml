    reason: lexical_alternative
lexical_decisions:
- source_word: ἠφανίσθησαν
  choice: वे लुप्त हो गए
  rationale: यह रूप उनके दृष्टि और संसार से मिट जाने का परिणाम व्यक्त करता है। ‘लुप्त हो गए’ उस अर्थ को बनाए रखता है, पर अनावश्यक रूप से केवल शारीरिक विनाश नहीं बताता।
- source_word: εἰς ᾅδου
  choice: अधोलोक में
  rationale: यूनानी ᾅδης मृतकों के लोक को दर्शाता है। आधुनिक हिन्दी में ‘अधोलोक’ इस स्थानगत और ब्रह्मांड-संबंधी भाव को स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणी यूनानी शब्द और वैकल्पिक अर्थ स्पष्ट करती है।
- source_word: κατέβησαν
  choice: उतर गए
  rationale: क्रिया नीचे जाने या उतरने को व्यक्त करती है। ‘उतर गए’ अधोलोक की ओर गति को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἄλλοι
  choice: दूसरे
  rationale: यूनानी अनिश्चित बहुवचन में केवल ‘दूसरे’ कहता है; ‘मनुष्य’ जोड़ना आवश्यक नहीं है।
- source_word: ἀντανέστησαν
  choice: उठ खड़े हुए
  rationale: यह क्रिया पहले वालों के प्रत्युत्तर या क्रम में उठने का बिंब रखती है। ‘उठ खड़े हुए’ उस बिंब को बनाए रखता है, जबकि अगला वाक्यांश स्पष्ट करता है कि आशय उनकी जगह लेने से है, पुनरुत्थान से नहीं।
- source_word: ἀντʼ αὐτῶν
  choice: उनकी जगह
  rationale: ἀντί संबंधी पद प्रतिस्थापन या उत्तराधिकार दिखाता है। ‘उनकी जगह’ आधुनिक हिन्दी में इसका स्पष्ट और मुहावरेदार अनुवाद है।
theological_decisions:
- issue: द्वितीयकानूनी प्रज्ञा-साहित्य के प्रसंग में ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: हेडीस; कब्र; मृतकों का लोक; शीओल
  rationale: मूल साक्ष्य यूनानी है और उसमें ᾅδης है। ‘अधोलोक’ हिन्दी पाठक के लिए मृतकों के नीचे स्थित लोक की धारणा को स्पष्ट रखता है, पर इसे ‘नरक’ कहकर बाद की दंड-संबंधी धर्मवैज्ञानिक धारणा नहीं थोपता। ‘शीओल’ यहाँ उपस्थित न होने वाला इब्रानी शब्द होता; ‘कब्र’ मूल की व्यापक लोक-संबंधी धारणा को सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की समानांतर गति—लुप्त होना, अधोलोक में उतरना, और दूसरों का उनकी जगह उठना—को संक्षिप्त रूप में सुरक्षित रखा गया है।
