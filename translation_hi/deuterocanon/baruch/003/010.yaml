- source_word: συνεμιάνθης
  choice: अशुद्ध हो गया है
  rationale: यह क्रिया धार्मिक अथवा नैतिक अपवित्रता का संकेत दे सकती है; ‘अशुद्ध’ इसके व्यापक अर्थ को बनाए रखता है।
- source_word: τοῖς νεκροῖς
  choice: मरे हुओं के साथ
  rationale: सम्बद्धता सूचक दत्तिव को ‘के साथ’ से व्यक्त किया गया है, जिससे मृतकों के संपर्क से अशुद्धि और निर्वासन में मृत्यु-सदृश दशा—दोनों संकेत खुले रहते हैं।
