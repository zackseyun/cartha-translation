    text: या “हे इस्राएल, बात क्या है?” आरम्भिक यूनानी पद शोक प्रकट करने वाला प्रश्न भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मरे हुओं के साथ अशुद्ध हो गया है” मृतकों के संपर्क से होने वाली धार्मिक अशुद्धि की ओर, या निर्वासन में मृत्यु-सदृश दशा की ओर संकेत कर सकता है; यूनानी में दोनों अर्थों की प्रतिध्वनि संभव है।
    reason: alternative_reading
