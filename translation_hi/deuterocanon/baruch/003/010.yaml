  text: हे इस्राएल, तुझे क्या हुआ है?[a] तू शत्रुओं के देश में क्यों है? तू पराए देश में बूढ़ा हो गया है; तू मरे हुओं के साथ अशुद्ध हो गया है,[b]
  philosophy: optimal-equivalence
  footnotes:
