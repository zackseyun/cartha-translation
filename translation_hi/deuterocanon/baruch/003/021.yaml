    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: समझा
  rationale: यह क्रिया किसी बात का अर्थ ग्रहण करने या उसे समझने को व्यक्त करती है; ज्ञान के रूपकात्मक पथों के संदर्भ में ‘समझा’ स्वाभाविक और स्पष्ट है।
- source_word: τρίβους
  choice: पथों
  rationale: τρίβος का अर्थ पगडंडी, पथ या मार्ग हो सकता है। ‘पथों’ से मूल का रूपक बना रहता है और अगले ‘मार्ग’ से शब्दगत भेद भी दिखाई देता है।
- source_word: ἀντελάβοντο
  choice: उसे थामा
  rationale: मध्यवाच्य रूप यहाँ पकड़ने, थामने या ग्रहण करने का भाव दे सकता है। ‘उसे थामा’ ज्ञान को प्राप्त करने के रूपक को बचाता है और अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: οἱ υἱοὶ αὐτῶν
  choice: उनके पुत्र
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘उनके पुत्र’ है; इसलिए इसे सामान्यीकृत करके ‘संतान’ नहीं किया गया।
- source_word: πόρρω ἐγενήθησαν
  choice: बहुत दूर हो गए
  rationale: शाब्दिक भाव ‘दूर हो गए’ है। πόρρω की दूरी की प्रबलता व्यक्त करने के लिए ‘बहुत’ जोड़ा गया है।
- source_word: ἀπὸ τῆς ὁδοῦ αὐτῶν
  choice: अपने मार्ग से
  rationale: यूनानी में बहुवचन संबंधवाचक सर्वनाम के साथ एकवचन ‘मार्ग’ है। हिंदी में कर्ता की ओर लौटने वाला ‘अपने’ इस संरचना को स्वाभाविक रूप से व्यक्त करता है, बिना इसे ‘उसके मार्ग’ में बदलकर पाठ सुधारने के।
theological_decisions:
- issue: ज्ञान के लिए स्त्रीलिंग सर्वनाम
  choice: उसके / उसे
  alternative: ज्ञान के पथों / ज्ञान को
  rationale: आसपास के संदर्भ में स्त्रीलिंग αὐτῆς ज्ञान की ओर संकेत करता है। सर्वनाम बनाए रखने से मूल की साहित्यिक व्यक्तिकरण-शैली और संदर्भगत संबंध सुरक्षित रहते हैं।
- issue: अंतिम वाक्यांश की असहज संरचना
  choice: उनके पुत्र अपने मार्ग से बहुत दूर हो गए
  alternative: उनके पुत्र उस मार्ग से बहुत दूर चले गए
  rationale: प्राप्त यूनानी पाठ में αὐτῶν का स्वाभाविक अर्थ ‘उनका/अपने’ है, यद्यपि संदर्भ में वाक्यांश कुछ असहज है। मुख्य पाठ स्रोत के निकट रहता है और अधिक सहज व्याख्यात्मक रूप पादटिप्पणी में दिया गया है।
- issue: पुत्रों का लिंग-सूचक उल्लेख
  choice: उनके पुत्र
  alternative: उनकी संतान
  rationale: मूल में υἱοί स्पष्ट रूप से ‘पुत्र’ कहता है। यहाँ इसे लिंग-निरपेक्ष करने की कोई संदर्भगत आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पथ’ और ‘मार्ग’ मूल के τρίβος और ὁδός के शब्दगत भेद को बनाए रखते हैं; ‘थामा’ ज्ञान को पकड़ने या ग्रहण करने के रूपक को जीवित रखता है।
