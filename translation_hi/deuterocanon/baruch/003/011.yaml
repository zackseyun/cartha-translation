- source_word: ᾅδου
  choice: अधोलोक
  rationale: यूनानी ᾅδης मृतकों के लोक को सूचित करता है। ‘अधोलोक’ हिन्दी पाठक के लिए समझने योग्य है और इसे अंतिम दण्ड के स्थान ‘नरक’ के साथ नहीं मिलाता।
