  text: But he who knows all things knows her[a]; he found her out by his understanding. He who prepared the earth for everlasting time filled it with four-footed animals[c][b];
translation:
  language: hi
  text: परन्तु जो सब कुछ जानता है, वह उसे[a] जानता है; उसने अपनी समझ से उसे खोज निकाला। जिसने पृथ्वी को सदा के लिए[b] तैयार किया, उसी ने उसे चौपाए पशुओं से भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ से अभिप्राय प्रसंग में वर्णित बुद्धि है। यूनानी पाठ स्त्रीलिंग सर्वनाम द्वारा बुद्धि के व्यक्तिकरण को बनाए रखता है।
    reason: cultural_note
  - marker: b
    text: या ‘सर्वकाल के लिए’ अथवा ‘अनन्त काल के लिए’। ‘तैयार किया’ का अनुवाद ‘स्थापित किया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: जो सब कुछ जानता है
  rationale: भाववाचक रूप में प्रयुक्त यूनानी कृदन्त परमेश्वर को ऐसे व्यक्ति के रूप में प्रस्तुत करता है जिसकी पहचान सर्वज्ञता से है। यह हिन्दी रूप व्यापक अर्थ और वाक्य की गरिमा दोनों बनाए रखता है।
- source_word: γινώσκει αὐτήν
  choice: वह उसे जानता है
  rationale: αὐτήν निकटवर्ती प्रसंग की ‘बुद्धि’ की ओर संकेत करता है। हिन्दी का ‘उसे’ स्वाभाविक अनाफोरिक सर्वनाम है; टिप्पणी में यूनानी के स्त्रीलिंग व्यक्तिकरण को स्पष्ट किया गया है।
- source_word: ἐξεῦρεν αὐτήν
  choice: उसने ... उसे खोज निकाला
  rationale: ἐξευρίσκω में खोजकर पा लेने अथवा पता लगा लेने का भाव है। ‘खोज निकाला’ संयुक्त क्रिया की इस शक्ति को बनाए रखती है और ‘जानता है’ की केवल पुनरावृत्ति नहीं बनती।
- source_word: τῇ συνέσει αὐτοῦ
  choice: अपनी समझ से
  rationale: σύνεσις का अर्थ समझ या अंतर्दृष्टि है और सम्प्रदान कारक यहाँ साधन बताता है। ‘अपनी समझ से’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ κατασκευάσας τὴν γῆν
  choice: जिसने पृथ्वी को ... व्यवस्थित किया
  rationale: κατασκευάζω तैयार करने, सुसज्जित करने या व्यवस्थित करने का व्यापक भाव रखता है। ‘व्यवस्थित किया’ पृथ्वी को बसाने योग्य रूप देने के भाव को रखता है और सीधे ‘सृष्टि की’ कहकर क्रिया को अधिक सिद्धान्त-भारित नहीं बनाता।
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: सदा के लिए
  rationale: αἰών और χρόνος का संयुक्त वाक्यांश स्थायी अथवा अनन्त अवधि पर बल देता है। ‘सदा के लिए’ सहज हिन्दी में उसी दीर्घकालिक बल को व्यक्त करता है।
- source_word: ἐνέπλησεν αὐτὴν κτηνῶν τετραπόδων
  choice: उसे चौपाए पशुओं से भर दिया
  rationale: αὐτήν यहाँ पृथ्वी की ओर लौटता है और κτηνῶν τετραπόδων चार पैरों वाले पशुओं को बताता है। ‘चौपाए पशु’ स्पष्ट, सामान्य और गैर-तकनीकी हिन्दी है।
theological_decisions:
- issue: बुद्धि का व्यक्तिकरण
  choice: सर्वनाम ‘उसे’ रखा और पादटिप्पणी में बुद्धि-संदर्भ तथा यूनानी स्त्रीलिंग व्यक्तिकरण स्पष्ट किया
  alternative: बुद्धि को निर्जीव वस्तु मानकर केवल ‘इसे’ कहना, या मुख्य पाठ में हर बार ‘बुद्धि’ दोहराना
  rationale: यूनानी αὐτήν स्त्रीलिंग है और प्रसंग बुद्धि का व्यक्तिकरण करता है। हिन्दी में लिंग-निरपेक्ष कर्म-सर्वनाम स्वाभाविक है; पादटिप्पणी मूल साहित्यिक और धर्मवैचारिक स्वरूप को सुरक्षित करती है, बिना बुद्धि को अलग देवता ठहराए।
- issue: κατασκευάσας में परमेश्वर का कार्य
  choice: ‘व्यवस्थित किया’
  alternative: ‘सृष्टि की’ अथवा ‘तैयार किया’
  rationale: मूल क्रिया सीधे सामान्य सृष्टि-क्रिया नहीं है; इसमें तैयार करने, स्थापित करने या व्यवस्थित करने की अर्थ-सीमा है। चयन उसी सीमा में रहता है और अनावश्यक सिद्धान्तगत विशिष्टीकरण से बचता है।
- issue: पृथ्वी की स्थायी अवधि
  choice: ‘सदा के लिए’
  alternative: ‘सर्वकाल के लिए’ अथवा ‘अनन्त काल के लिए’
  rationale: मूल का αἰῶνα χρόνον दीर्घ और स्थायी अवधि पर बल देता है। सहज हिन्दी चुनी गई है, जबकि पादटिप्पणी अधिक शाब्दिक संभावनाएँ सुरक्षित रखती है।
