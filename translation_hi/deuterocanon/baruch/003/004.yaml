base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/004.yaml
  text: Lord Almighty[a], God of Israel, please hear the prayer of the dead of Israel and of the sons who sinned before you, who did not listen to the voice of you, their God, and the evils have clung to us.
translation:
  language: hi
  text: हे सर्वशक्तिमान प्रभु, इस्राएल के परमेश्वर, इस्राएल के मृत लोगों और उन पुत्रों की प्रार्थना सुन, जो तेरे सामने पाप करने वाले हैं और जिन्होंने तेरी वाणी नहीं सुनी—तू उनका परमेश्वर है—और विपत्तियाँ[a] हमसे चिपक गई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बुराइयाँ हमसे चिपक गई हैं।” इसका अर्थ “अनिष्ट” या “विपत्तियाँ” भी हो सकता है।
    reason: τὰ κακά की व्यापक अर्थ-सीमा तथा ἐκολλήθη के 'चिपकने' वाले सजीव रूपक को सुरक्षित रखना।
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: हे सर्वशक्तिमान प्रभु
  rationale: ईश्वर को संबोधित करने वाला स्वाभाविक और प्रतिष्ठित हिन्दी पदबंध; παντοκράτωρ की सार्वभौम सामर्थ्य को व्यक्त करता है।
- source_word: ἄκουσον δὴ
  choice: सुन
  rationale: δή की विनयपूर्ण आग्रह-ध्वनि प्रार्थना के समूचे संबोधन से स्पष्ट है; हिन्दी में आज्ञार्थक 'सुन' सीधा और प्रार्थनात्मक दोनों है।
- source_word: τῶν τεθνηκότων Ἰσραήλ
  choice: इस्राएल के मृतकों
  rationale: पूर्ण कृदन्त का स्पष्ट अर्थ 'जो मर चुके हैं' है; मूल की असामान्य और अर्थगर्भित अभिव्यक्ति को नरम नहीं किया गया।
- source_word: υἱῶν τῶν ἁμαρτανόντων ἐναντίον σου
  choice: उन पुत्रों की, जिन्होंने तेरे सामने पाप किया
  rationale: υἱῶν का पुरुषवाची अर्थ 'पुत्रों' रखा गया और ἐναντίον σου को 'तेरे सामने' देकर 'तेरे विरुद्ध' वाली व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
- source_word: οἳ οὐκ ἤκουσαν τῆς φωνῆς σου
  choice: उन्होंने ... तेरी वाणी पर ध्यान नहीं दिया
  rationale: ἀκούω के सुनने और मानने, दोनों संकेतों को हिन्दी का 'ध्यान नहीं दिया' स्वाभाविक ढंग से समेटता है, जबकि 'वाणी' श्रवण-बिंब बनाए रखती है।
- source_word: θεοῦ αὐτῶν
  choice: अपने परमेश्वर
  rationale: यूनानी में यह 'तेरी वाणी' के साथ संबंधसूचक समानाधिकरण है; हिन्दी में 'अपने परमेश्वर, तेरी वाणी' उसी संबंध को स्पष्ट और सुबोध रखता है।
- source_word: ἐκολλήθη ἡμῖν τὰ κακά
  choice: विपत्तियाँ हमसे आ लगी हैं
  rationale: κολλάω के चिपकने/लग जाने के सजीव बिंब को 'आ लगी' बनाए रखता है; प्रसंग में τὰ κακά दुष्कर्मों से अधिक आई हुई विपत्तियों या अनिष्टों को सूचित करता है।
theological_decisions:
- issue: '''इस्राएल के मृतकों'' का आशय'
  choice: मृत इस्राएलियों का शाब्दिक उल्लेख मुख्य पाठ में रखा गया।
  alternative: मृतप्राय या आत्मिक रूप से मृत इस्राएल
  rationale: τῶν τεθνηκότων का सीधा अर्थ मर चुके लोग है; संभावित आलंकारिक आशय को अनुवाद में निश्चित नहीं किया जाना चाहिए।
- issue: τὰ κακά का अर्थ
  choice: विपत्तियाँ
  alternative: बुराइयाँ / अनिष्ट
  rationale: वाचा के उल्लंघन के परिणामों के प्रसंग में ठोस आपदाएँ अधिक स्वाभाविक हैं, पर यूनानी शब्द व्यापक है; इसलिए वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया।
- issue: ἐναντίον σου का बल
  choice: तेरे सामने
  alternative: तेरे विरुद्ध
  rationale: पाप का प्रसंग विरोध का भाव जगा सकता है, किंतु पदबंध उपस्थित होने/सामने होने का अर्थ भी रखता है; मुख्य पाठ मूल की यह खुली अर्थ-सीमा बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली अपनाई गई है। ईश्वर के लिए पारंपरिक निकट संबोधन 'तेरे/तेरी' रखा गया है। वाक्य को सुबोध बनाने के लिए अल्पविराम और अर्धविराम प्रयुक्त हैं, पर मूल की समन्वयी संरचना और अर्थगत तनाव सुरक्षित है।
