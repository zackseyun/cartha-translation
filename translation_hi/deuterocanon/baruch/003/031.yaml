translation:
  language: hi
  text: कोई नहीं है जो उसका मार्ग जानता हो, न कोई जो उसकी राह पर विचार करता हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: कोई नहीं है
  rationale: यूनानी के नकारात्मक अस्तित्ववाचक कथन को स्वाभाविक हिन्दी में व्यक्त करता है और ऐसे किसी व्यक्ति के पूर्ण अभाव पर बल बनाए रखता है।
- source_word: ὁ γινώσκων
  choice: जो ... जानता हो
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त का सीधा और स्वाभाविक अर्थ है—ऐसा व्यक्ति जो जानता हो।
- source_word: τὴν ὁδὸν αὐτῆς
  choice: उसका मार्ग
  rationale: ὁδός के मार्ग-रूपक को बनाए रखता है; स्त्रीलिंग αὐτῆς निकटवर्ती सन्दर्भ में व्यक्तिरूप दी गई बुद्धि की ओर संकेत करता है। हिन्दी में ‘बुद्धि’ स्त्रीलिंग होने पर भी स्वाभाविक सर्वनाम ‘उसका’ होता है।
- source_word: οὐδὲ
  choice: न
  rationale: दूसरे समानान्तर नकारात्मक कथन को संक्षिप्त और काव्यात्मक ढंग से पहले कथन से जोड़ता है।
- source_word: ὁ ἐνθυμούμενος
  choice: जो ... विचार करता हो
  rationale: ἐνθυμέομαι यहाँ मन में ध्यान देने, सोचने या विचार करने का भाव देता है; ‘विचार करता हो’ स्मरण तक अर्थ को सीमित किए बिना इस भाव को व्यक्त करता है।
- source_word: τὴν τρίβον αὐτῆς
  choice: उसकी राह
  rationale: τρίβος के लिए ‘राह’ चुनने से ὁδός के ‘मार्ग’ के साथ अर्थगत समानता और काव्यात्मक शब्द-विविधता दोनों सुरक्षित रहती हैं।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम αὐτῆς का संदर्भ
  choice: ‘उसका/उसकी’ द्वारा व्यक्तिरूप दी गई बुद्धि की ओर संकेत
  alternative: बुद्धि को निराकार धारणा मानते हुए भी हिन्दी में यही व्याकरणिक रूप रखना
  rationale: आस-पास का प्रसंग बुद्धि का व्यक्तिरूपण करता है। अनुवाद उस साहित्यिक और धर्मवैचारिक तनाव को मिटाए बिना स्वाभाविक हिन्दी में स्त्रीलिंग संदर्भ बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मार्ग/राह’ की समानान्तर जोड़ी मूल के ὁδός/τρίβος भेद को सहज हिन्दी में सुरक्षित रखती है।
