lexical_decisions:
- source_word: οὗτος
  choice: यही है
  rationale: विधेय रूप में प्रयुक्त संकेतवाचक सर्वनाम को स्वाभाविक हिन्दी में “यही ... है” से व्यक्त किया गया है; “यही” पहचान के साथ विशिष्टता पर भी उचित बल देता है।
- source_word: ὁ θεὸς ἡμῶν
  choice: हमारा परमेश्वर
  rationale: यह स्वाभाविक हिन्दी संबंधसूचक रचना है और यूनानी के सामुदायिक अधिकार-संबंध को बनाए रखती है।
- source_word: οὐ λογισθήσεται
  choice: नहीं माना जाएगा
  rationale: λογίζομαι के भविष्यत् कर्मवाच्य का अर्थ गिना जाना, समझा जाना या माना जाना हो सकता है। “माना जाएगा” आधुनिक हिन्दी में सहज है और किसी को उसके तुल्य ठहराने की निषेधात्मक बात को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ἕτερος
  choice: किसी और को
  rationale: ἕτερος यहाँ किसी भिन्न अन्य के लिए है; नकार के साथ “किसी और को” स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: πρὸς αὐτόν
  choice: उसके समान
  rationale: इस प्रसंग में πρός संबंध या तुलना दर्शाता है। “उसके समान” तुलना का भाव स्पष्ट करता है और अस्पष्ट स्थानवाचक “उसके पास/बगल में” से बचता है।
theological_decisions:
- issue: तुलनात्मक वाक्यांश में परमेश्वर की अनन्यता
  choice: उसके समान किसी और को नहीं माना जाएगा
  alternative: उसके साथ किसी और को नहीं गिना जाएगा
  rationale: अनुवाद परमेश्वर की अनन्यता को व्यक्त करता है, पर मूल के कर्मवाच्य और तुलनात्मक स्वरूप को बनाए रखता है; इसे विस्तार देकर “कोई दूसरा परमेश्वर है ही नहीं” नहीं बनाया गया।
