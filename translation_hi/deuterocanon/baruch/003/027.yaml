  text: God did not choose these[b][a], nor did he give them the way of knowledge.
translation:
  language: hi
  text: परमेश्वर ने इन्हें[a] नहीं चुना, न ही उन्हें ज्ञान का मार्ग[b] दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें”; यूनानी में संकेतवाचक सर्वनाम है, जो आसपास के प्रसंग में बताए गए विशिष्ट लोगों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “समझ का मार्ग”; यूनानी का अधिक शाब्दिक अर्थ “ज्ञान का मार्ग” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ τούτους ἐξελέξατο
  choice: इन्हें नहीं चुना
  rationale: τούτους संकेतवाचक बहुवचन है और पहले बताए गए लोगों की ओर विशेष रूप से संकेत करता है; ‘इन्हें’ उसके संकेतवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है। ἐξελέξατο का सीधा और उपयुक्त अर्थ ‘चुना’ है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: आधुनिक हिन्दी बाइबलीय शैली में θεός के लिए यह स्पष्ट, प्रतिष्ठित और प्रचलित शब्द है।
- source_word: οὐδὲ
  choice: न ही
  rationale: यह दूसरे निषेधात्मक उपवाक्य को पहले से जोड़ता है और समानांतर निषेध को स्पष्ट रखता है।
- source_word: ὁδὸν ἐπιστήμης
  choice: ज्ञान का मार्ग
  rationale: यह यूनानी संबंधवाचक रचना का निकट और स्वाभाविक अनुवाद है तथा ज्ञान-साहित्य की ‘मार्ग’ वाली छवि को सुरक्षित रखता है।
- source_word: ἔδωκεν αὐτοῖς
  choice: उन्हें ... दिया
  rationale: ἔδωκεν का सामान्य अर्थ ‘दिया’ और αὐτοῖς का अर्थ ‘उन्हें’ है; यह हिन्दी में सहज संप्रदान रचना है।
theological_decisions:
- issue: τούτους के संकेतवाचक बल को बनाए रखना
  choice: इन्हें
  alternative: उन्हें
  rationale: मूल यूनानी किसी सामान्य समूह के बजाय आसपास के प्रसंग में पहले बताए गए विशिष्ट लोगों की ओर संकेत करता है; ‘इन्हें’ इस बल को बिना संदर्भ की अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- issue: ὁδὸν ἐπιστήμης को लक्ष्यसूचक या संबंधसूचक रूप में प्रस्तुत करना
  choice: ज्ञान का मार्ग
  alternative: ज्ञान तक पहुँचने का मार्ग / समझ का मार्ग
  rationale: यूनानी का शाब्दिक संबंध ‘ज्ञान का मार्ग’ है। ‘ज्ञान तक पहुँचने का मार्ग’ लक्ष्य का ऐसा भाव जोड़ सकता है जो मूल में स्पष्ट नहीं है, जबकि ‘समझ’ ἐπιστήμης का सम्भव पर कम सीधा अर्थ है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ज्ञान का मार्ग’ मूल की ज्ञान-साहित्य संबंधी छवि और उसकी संभावित अर्थगत व्यापकता को बनाए रखता है।
