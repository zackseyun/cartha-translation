base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/007.yaml
  text: For because of this you have put your fear in our hearts[a], that we may call on your name; and we will praise you in our exile[d][c][b], because we have turned away from our hearts every unrighteousness of our fathers who sinned before you.
translation:
  language: hi
  text: इसी कारण आपने अपना भय हमारे हृदय में डाला है[a], ताकि हम आपके नाम को पुकारें; और हम अपने निर्वासन में[b] आपकी स्तुति करेंगे, क्योंकि हमने अपने हृदय से अपने पितरों का सारा अधर्म[c] दूर कर दिया है, जिन्होंने आपके सामने पाप किया था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आपके प्रति भय’। यूनानी में शाब्दिक रूप से ‘आपका भय’ है—यह परमेश्वर के प्रति भय के लिए प्रयुक्त बाइबिलीय अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी बंधुआई में’। यूनानी शब्द निर्वासित किए जाने अथवा बंधुआई की दशा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘सारा अन्याय’ अथवा ‘हर दुष्कर्म’।
    reason: lexical_alternative
  - marker: d
    text: या ‘जिन्होंने आपके विरुद्ध पाप किया था’। यूनानी का अधिक शाब्दिक अर्थ ‘आपके सामने पाप किया था’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पदबंध पूर्ववर्ती प्रसंग से कारणात्मक संबंध व्यक्त करता है; ‘इसी कारण’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस बल को बनाए रखता है।
- source_word: ἔδωκας τὸν φόβον σου ἐπὶ καρδίαν ἡμῶν
  choice: आपने अपना भय हमारे हृदय में डाला है
  rationale: ἔδωκας का मूल अर्थ ‘दिया’ है, पर हिन्दी में हृदय के संदर्भ में ‘डाला है’ स्वाभाविक है। ‘अपना भय’ स्रोत के ‘तुम्हारा भय’ को व्याख्यात्मक रूप से केवल ‘श्रद्धा’ नहीं बनाता।
- source_word: ἐπικαλεῖσθαι τὸ ὄνομά σου
  choice: ताकि हम आपके नाम को पुकारें
  rationale: क्रियार्थक रूप को यहाँ उद्देश्य/परिणाम के रूप में समझा गया है। ‘नाम को पुकारना’ प्रार्थना और आराधना की बाइबिलीय अभिव्यक्ति को बनाए रखता है।
- source_word: ἐν τῇ ἀποικίᾳ ἡμῶν
  choice: अपने निर्वासन में
  rationale: संदर्भ में ἀποικία देश से निकाले जाने और परदेश में रहने की दशा को सूचित करता है; ‘निर्वासन’ सबसे स्पष्ट और प्रसंगानुकूल है।
- source_word: ἀπεστρέψαμεν ἀπὸ καρδίας ἡμῶν
  choice: हमने अपने हृदय से ... दूर कर दिया है
  rationale: यह हिन्दी में स्वाभाविक ढंग से हृदय से बुराई हटाने का भाव व्यक्त करता है और यूनानी के मुड़ने/दूर करने के अर्थ को सुरक्षित रखता है।
- source_word: πᾶσαν ἀδικίαν
  choice: सारा अधर्म
  rationale: ἀδικία नैतिक अन्याय, दुष्कर्म और अधार्मिकता को समेटता है। पश्चात्ताप की प्रार्थना में ‘अधर्म’ उपयुक्त धार्मिक-नैतिक विस्तार रखता है।
- source_word: πατέρων ἡμῶν
  choice: अपने ... पूर्वजों का
  rationale: यद्यपि यूनानी का शाब्दिक अर्थ ‘हमारे पिताओं’ है, इस संदर्भ में यह पिछली पीढ़ियों को सूचित करता है; ‘पूर्वज’ आधुनिक हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν ἡμαρτηκότων ἐναντίον σου
  choice: जिन्होंने आपके सामने पाप किया था
  rationale: ‘आपके सामने’ ἐναντίον σου की उपस्थिति और उत्तरदायित्व संबंधी छवि को बनाए रखता है; ‘आपके विरुद्ध’ भी प्रसंगगत अर्थ हो सकता है।
theological_decisions:
- issue: ‘आपका/अपना भय’ का अर्थ
  choice: ‘अपना भय’ रखा गया, इसे केवल ‘श्रद्धा’ के रूप में सीमित नहीं किया गया
  alternative: ‘आपके प्रति भय’ अथवा ‘आपके प्रति श्रद्धा’
  rationale: पश्चात्ताप के प्रसंग में यह परमेश्वर द्वारा दिया गया ऐसा भय है जो नाम पुकारने और स्तुति की ओर ले जाता है। अधिक प्रत्यक्ष अभिव्यक्ति भय, श्रद्धा और आज्ञाकारिता के बीच का धर्मवैज्ञानिक तनाव बनाए रखती है।
- issue: πατέρων का हिन्दी रूप
  choice: पूर्वजों
  alternative: पिताओं
  rationale: यहाँ अभिप्राय पिछली दोषी पीढ़ियों से है। ‘पूर्वजों’ हिन्दी में वंशगत संदर्भ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक ‘पिताओं’ को दर्ज करती है।
- issue: ἐναντίον σου में पाप का संबंध
  choice: आपके सामने पाप किया
  alternative: आपके विरुद्ध पाप किया
  rationale: प्रत्यक्ष अनुवाद परमेश्वर की उपस्थिति में किए गए पाप और उसके प्रति उत्तरदायित्व—दोनों को खुला रखता है; ‘विरुद्ध’ निहित नैतिक अर्थ है, पर वह स्थान-संबंधी रूपक को संकुचित कर देता है।
