  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण प्रार्थनात्मक स्तर अपनाया गया है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। ‘हृदय’, ‘नाम को पुकारना’, ‘अधर्म’ और ‘स्तुति’ जैसी बाइबिलीय अभिव्यक्तियाँ रखी गई हैं, पर वाक्य-विन्यास को सामान्य आधुनिक पाठक के लिए स्वाभाविक बनाया गया है।
