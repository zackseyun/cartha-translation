lexical_decisions:
- source_word: ὁ γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: θεὸς
  choice: परमेश्वर
  rationale: यहाँ संज्ञा इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: δείξει
  choice: दिखाएगा
  rationale: δείκνυμι के भविष्यत्काल का सीधा अर्थ है किसी वस्तु को दूसरों के सामने दृश्य या प्रकट करना।
- source_word: τῇ ὑπʼ οὐρανὸν πάσῃ
  choice: आकाश के नीचे सबको
  rationale: यह व्यापक अभिव्यक्ति समूचे संसार में रहने वालों की ओर संकेत करती है। अनुवाद मूल की ‘आकाश के नीचे’ वाली छवि और सर्वसमावेशी दायरा बनाए रखता है।
- source_word: τὴν σὴν
  choice: तुम्हारा
  rationale: द्वितीय पुरुष एकवचन का संबंधसूचक रूप यरूशलेम/सिय्योन को किए जा रहे सीधे संबोधन को बनाए रखता है।
- source_word: λαμπρότητα
  choice: वैभव
  rationale: λαμπρότης में चमक, भव्यता और प्रतिष्ठित शोभा के अर्थ सम्मिलित हैं। ‘वैभव’ इस प्रसंग में यरूशलेम की पुनर्स्थापित शानदार गरिमा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: λαμπρότητα में यरूशलेम की पुनर्स्थापित शोभा का स्वरूप
  choice: वैभव
  alternative: दीप्ति; महिमा; चमक
  rationale: ‘वैभव’ दृश्य भव्यता और सम्मान—दोनों को व्यक्त करता है, जबकि ‘महिमा’ यहाँ यूनानी δόξα न होने पर अनावश्यक रूप से अधिक धर्मवैचारिक अर्थ ग्रहण कर सकती है। पादटिप्पणी मूल शब्द के प्रकाश-संबंधी अर्थ को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सहज और गरिमापूर्ण वाक्य रखा गया है। ‘तुम्हारा’ यरूशलेम को व्यक्तिरूप में किए गए सीधे संबोधन को दर्शाता है; ‘आकाश के नीचे सबको’ मूल की व्यापक काव्यात्मक अभिव्यक्ति को सुरक्षित रखता है।
