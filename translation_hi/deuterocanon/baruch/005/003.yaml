    rationale: The Greek construction most naturally denotes the whole earth/world under heaven. The revision preserves that collective geographic scope while leaving the implied worldwide audience intact.
  - severity: low
    issue: ‘वैभव’ can suggest wealth or opulence more readily than the luminous, splendid sense of λαμπρότητα.
    rationale: ‘शोभा’ more directly expresses the visible magnificence intended by the Greek and remains suitably elevated.
