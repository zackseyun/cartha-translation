  naturalness: ‘आकाश के नीचे की सारी पृथ्वी को’ is clear, idiomatic modern Hindi and retains the source image. ‘तुम्हारी शोभा’ is natural in direct address to Jerusalem/Zion.
  terminology: ‘शोभा’ appropriately conveys λαμπρότητα as visible splendor/magnificence without narrowing it to material wealth, as ‘वैभव’ can do, or imposing the more established theological register of ‘महिमा.’
