  yaml_path: translation/deuterocanon/baruch/005/001.yaml
  text: Take off[a], O Jerusalem, the garment of your mourning and affliction[b], and put on forever the splendor of the glory from God.
translation:
  language: hi
  text: हे यरूशलेम, अपने शोक और दुर्दशा का वस्त्र उतार दे, और परमेश्वर से मिलनेवाली महिमा का वैभव सदा के लिए धारण कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔκδυσαι
  choice: उतार दे
  rationale: वस्त्र उतारने की क्रिया और एकवचन स्त्रीलिंग आज्ञा—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: στολὴν
  choice: वस्त्र
  rationale: एकवचन परिधान की रूपकात्मक छवि बनाए रखता है; यहाँ अधिक विशिष्ट ‘चोगा’ अनावश्यक होगा।
- source_word: πένθους
  choice: शोक
  rationale: व्यक्तिगत या सामुदायिक मातम और दुःख, दोनों के लिए उपयुक्त तथा वस्त्र-रूपक के साथ स्वाभाविक है।
- source_word: κακώσεώς
  choice: दुर्दशा
  rationale: पीड़ा, दमन और दयनीय दशा की व्यापक अर्थ-सीमा को किसी एक कारण तक सीमित किए बिना व्यक्त करता है।
- source_word: ἔνδυσαι
  choice: धारण कर
  rationale: पहली आज्ञा ‘उतार दे’ का स्वाभाविक प्रतिरूप है और वैभव को वस्त्र की तरह पहनने का रूपक बनाए रखता है।
- source_word: εὐπρέπειαν
  choice: वैभव
  rationale: शोभा, गरिमा और भव्यता के संयुक्त भाव को संक्षेप में व्यक्त करता है।
- source_word: δόξης
  choice: महिमा
  rationale: बाइबलीय यूनानी δόξα का स्थापित और धर्मवैचारिक रूप से उपयुक्त हिन्दी प्रतिशब्द है।
- source_word: παρὰ τοῦ θεοῦ
  choice: परमेश्वर से मिलनेवाली
  rationale: παρά + संबंधकारक द्वारा सूचित स्रोत को स्पष्ट करता है और यह संकेत नहीं देता कि वाक्यांश केवल ‘परमेश्वर की महिमा’ का स्वामित्व बता रहा है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: स्थायी और अनंत अवधि का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यरूशलेम का मानवीकरण
  choice: यरूशलेम को स्त्रीलिंग एकवचन में सीधे संबोधित कर वस्त्र उतारने और धारण करने की आज्ञाएँ दी गई हैं।
  alternative: रूपक हटाकर इसे केवल समुदाय के लिए सामान्य निर्देश के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ में प्रत्यक्ष संबोधन और वस्त्र बदलने की समांतर आज्ञाएँ हैं; इन्हें बनाए रखने से पुनर्स्थापित सिय्योन की भविष्यद्वक्तापूर्ण छवि सुरक्षित रहती है।
- issue: नए वैभव और महिमा का स्रोत
  choice: ‘परमेश्वर से मिलनेवाली महिमा’ द्वारा दिव्य स्रोत व्यक्त किया गया है।
  alternative: ‘परमेश्वर की महिमा’ कहना, जो स्वामित्व या पहचान का अर्थ भी दे सकता है।
  rationale: παρὰ τοῦ θεοῦ मुख्यतः उद्गम या स्रोत बताता है; इसलिए अनुवाद यरूशलेम को प्राप्त होनेवाली महिमा पर बल देता है।
- issue: εὐπρέπεια और δόξα का संबंध
  choice: संबंधकारक संरचना को ‘महिमा का वैभव’ के रूप में रखा गया है।
  alternative: दोनों पदों को मिलाकर केवल ‘महिमामय शोभा’ कहना।
  rationale: मूल की सघन और कुछ हद तक खुली संरचना को सुरक्षित रखते हुए दोनों अर्थपूर्ण संज्ञाओं को अलग रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे यरूशलेम’ काव्यात्मक प्रत्यक्ष संबोधन को बनाए रखता है; ‘वस्त्र उतार दे’ और ‘धारण कर’ मूल के समांतर परिधान-रूपक को स्पष्ट करते हैं।
