  text: For God will lead Israel with gladness[a], by the light of his glory, with mercy and righteousness from him.
translation:
  language: hi
  text: क्योंकि परमेश्वर इस्राएल को आनन्द के साथ, अपनी महिमा के प्रकाश के द्वारा, अपनी ओर से आनेवाली दया और धार्मिकता[a] सहित ले चलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘न्याय।’
    reason: δικαιοσύνη का अर्थ इस प्रसंग में ‘धार्मिकता’ के साथ-साथ ‘न्याय’ भी हो सकता है।
lexical_decisions:
- source_word: ἡγήσεται
  choice: ले चलेगा
  rationale: भविष्यत्कालीन क्रिया यहाँ किसी जनसमुदाय की अगुवाई करने का अर्थ देती है। ‘ले चलेगा’ पुनर्स्थापना और यात्रा के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μετʼ εὐφροσύνης
  choice: आनन्द के साथ
  rationale: यह पद आनन्दपूर्ण ढंग या आनन्द की संगति में अगुवाई किए जाने का भाव रखता है; यह अनुवाद अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τῷ φωτὶ τῆς δόξης αὐτοῦ
  choice: अपनी महिमा के प्रकाश के द्वारा
  rationale: 'सम्प्रदान कारक को यहाँ साधनवाचक समझना उपयुक्त है: परमेश्वर अपनी महिमा के प्रकाश के द्वारा इस्राएल की अगुवाई करता है।'
- source_word: ἐλεημοσύνῃ
  choice: दया
  rationale: δικαιοσύνῃ के साथ और परमेश्वर से आनेवाले गुण अथवा कार्य के रूप में प्रयुक्त होने के कारण यहाँ ‘दान’ की अपेक्षा ‘दया’ अधिक उपयुक्त है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यह शब्द परमेश्वर के सही और न्यायपूर्ण चरित्र तथा कार्य के व्यापक अर्थ को व्यक्त करता है। ‘न्याय’ सम्भव विकल्प है और पाद-टिप्पणी में दिया गया है।
- source_word: τῇ παρʼ αὐτοῦ
  choice: अपनी ओर से आनेवाली
  rationale: यह वाक्यांश दया और धार्मिकता का स्रोत परमेश्वर को बताता है। हिन्दी में यह रूप सम्बन्ध स्पष्ट करता है, जबकि इन दोनों गुणों को अलग-अलग परिभाषित नहीं करता।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: पुनर्स्थापना के इस प्रसंग में शब्द न्यायपूर्ण कार्य को भी समेट सकता है, पर ‘धार्मिकता’ उसके व्यापक बाइबलीय अर्थ को सुरक्षित रखती है। ‘न्याय’ को वैध वैकल्पिक अर्थ के रूप में पाद-टिप्पणी में रखा गया है।
