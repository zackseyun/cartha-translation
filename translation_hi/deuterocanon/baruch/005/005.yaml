  text: Rise up[a], Jerusalem, and stand on the height, and look toward the east, and see your children gathered from the setting of the sun to its rising, at the word of the Holy One[b], rejoicing in the remembrance of God.
translation:
  language: hi
  text: 'हे यरूशलेम, उठ और ऊँचे स्थान पर खड़ी हो जा। पूर्व की ओर देख और देख: तेरे बच्चे सूर्यास्त से सूर्योदय तक पवित्र जन के वचन पर[a] इकट्ठे किए गए हैं और परमेश्वर के स्मरण में[b] आनन्दित हो रहे हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र जन के वचन के द्वारा।” यूनानी में दत्तिव रूप साधन का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस कारण आनन्दित हो रहे हैं कि परमेश्वर ने उन्हें स्मरण किया,” अथवा “परमेश्वर को स्मरण करते हुए आनन्दित हो रहे हैं।” यूनानी वाक्यांश संक्षिप्त है और दोनों अर्थों की सम्भावना रखता है।
    reason: alternative_reading
