  text: For God has ordered that every high mountain and the everlasting hills be made low[a], and the valleys be filled for the leveling of the ground, so that Israel may walk safely in the glory of God.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने आदेश दिया है कि हर ऊँचा पहाड़ और सनातन पहाड़ियाँ नीची कर दी जाएँ, और भूमि को समतल करने के लिए घाटियाँ भर दी जाएँ, ताकि इस्राएल परमेश्वर की महिमा में[a] सुरक्षित चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की महिमा से” अथवा “परमेश्वर की महिमा के द्वारा।” यूनानी में यहाँ प्रयुक्त सम्प्रदान कारक का अर्थ परमेश्वर की महिमा के परिवेश में, उसके साथ, अथवा उसके द्वारा सुरक्षित चलना हो सकता है।
    reason: alternative_reading
