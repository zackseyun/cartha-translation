- issue: राजकीय उत्कर्ष की छवि
  choice: ‘मानो राजसिंहासन पर हों’ के रूप में उपमा सुरक्षित रखी गई है।
  alternative: इसे केवल ‘बड़े सम्मान के साथ’ कहकर अर्थ खोल देना।
  rationale: मूल की काव्यात्मक और कुछ संकुचित छवि पाठ की धार्मिक आशा और उत्कर्ष का हिस्सा है; उसे सपाट व्याख्या में बदलना उचित नहीं।
