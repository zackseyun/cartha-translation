theological_decisions:
- issue: निर्वासन और पुनर्स्थापन का विरोध
  choice: अपमानजनक पैदल प्रस्थान और परमेश्वर द्वारा महिमापूर्ण आगमन का विरोध स्पष्ट रखा गया है।
  alternative: ‘वापस ले आता है’ कहकर पुनरागमन को अधिक स्पष्ट करना।
