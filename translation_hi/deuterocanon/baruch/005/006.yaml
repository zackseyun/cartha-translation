translation:
  language: hi
  text: क्योंकि वे तेरे यहाँ से पैदल निकले थे, शत्रुओं के द्वारा ले जाए जा रहे थे; परन्तु परमेश्वर उन्हें तेरे पास ले आता है—महिमा के साथ उठाए जाते हुए, मानो राजसिंहासन पर हों।
  philosophy: optimal-equivalence
lexical_decisions:
