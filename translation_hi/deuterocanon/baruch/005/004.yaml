lexical_decisions:
- source_word: κληθήσεται
  choice: नाम रखेगा
  rationale: यूनानी भविष्यत् कर्मवाच्य का शाब्दिक रूप ‘नाम पुकारा जाएगा’ है, पर नाम प्रदान किए जाने के इस प्रसंग में हिन्दी का सक्रिय वाक्य ‘परमेश्वर... नाम रखेगा’ अधिक स्वाभाविक है और दैवी कर्तृत्व को सुरक्षित रखता है।
- source_word: τὸ ὄνομα
