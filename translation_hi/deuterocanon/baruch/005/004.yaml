  rationale: यह यरूशलेम को दिए जाने वाले पदनाम को व्यक्त करता है; ‘नाम’ बाइबलीय पहचान और नामकरण की भाषा को बनाए रखता है।
- source_word: παρὰ τοῦ θεοῦ
  choice: परमेश्वर
  rationale: παρά + संबंधकारक यहाँ नाम के स्रोत अथवा कर्ता को दर्शाता है; सक्रिय हिन्दी रचना में ‘परमेश्वर’ कर्ता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: यह स्थायी अवधि का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: εἰρήνη
  choice: शान्ति
  rationale: प्रदत्त नाम के पहले तत्व के रूप में मूल अर्थ और बाइबलीय अनुगूँज सुरक्षित रहती है।
- source_word: δικαιοσύνης
  choice: धार्मिकता की
  rationale: δικαιοσύνη का व्यापक नैतिक और वाचा-संबंधी अर्थ ‘धार्मिकता’ से सुरक्षित रहता है; ‘न्याय’ सम्भव विकल्प है।
- source_word: δόξα
  choice: महिमा
  rationale: यह दैवी रूप से दी गई गरिमा, गौरव और दीप्ति की बाइबलीय भाषा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θεοσεβείας
  choice: परमेश्वर-भक्ति की
  rationale: θεοσέβεια परमेश्वर के प्रति भक्ति, श्रद्धा और आदर का भाव रखता है; ‘परमेश्वर-भक्ति’ स्पष्ट है और केवल सामान्य धार्मिकता का अर्थ लेने से बचाता है।
