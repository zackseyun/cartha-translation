  rationale: काव्यात्मक नाम में ‘धार्मिकता’ शब्द नैतिक, संबंधपरक और वाचा-संबंधी व्यापकता को बनाए रखता है; ‘न्याय’ वैध किंतु अपेक्षाकृत संकुचित विकल्प है।
