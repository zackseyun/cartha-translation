base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/030.yaml
  text: But even so[a], although so many impulses of motherly love were drawing the mother toward sympathy[b], the all-varied tortures were not able by any one of them to turn aside her reason.
translation:
  language: hi
  text: फिर भी, यद्यपि संतान के प्रति प्रेम से जुड़ी इतनी सारी भावनाएँ माता को सहानुभूति[a] की ओर खींच रही थीं, नाना प्रकार की यातनाओं में से कोई भी उसकी तर्कबुद्धि[b] को विचलित न कर सकी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सहानुभूति” का अर्थ यहाँ उनके दुःख को स्वयं अनुभव करने जैसी करुणामय सहभागिता भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “तर्कबुद्धि” का अनुवाद “विवेक,” “दृढ़ निश्चय” या “तर्कपूर्ण निर्णय” भी किया जा सकता है। इस पुस्तक में यह शब्द प्रायः भावनाओं पर बुद्धि के शासन को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: फिर भी
  rationale: विरोध और प्रबल रियायत—दोनों भावों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καίπερ
  choice: यद्यपि
  rationale: यूनानी के रियायती अर्थ को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में रखता है।
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: संतान के प्रति प्रेम से जुड़ी इतनी सारी भावनाएँ
  rationale: φιλοτεκνία माता-पिता के अपनी संतान के प्रति प्रेम को सूचित करता है; बहुवचन अभिव्यक्ति उस प्रेम से उत्पन्न अनेक भावनात्मक खिंचावों को सामने लाती है।
- source_word: εἰς συμπάθειαν ἑλκόντων
  choice: सहानुभूति की ओर खींच रही थीं
  rationale: ἑλκόντων के खींचने वाले रूपक और συμπάθεια के सह-अनुभूति अथवा करुणामय भाव—दोनों को सुरक्षित रखता है।
- source_word: τὴν μητέρα
  choice: माता
  rationale: यूनानी में निश्चित संज्ञा है, कोई स्पष्ट स्वत्वसूचक सर्वनाम नहीं; हिन्दी में 'माता' प्रसंगानुकूल और गरिमापूर्ण है।
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: उनमें से किसी के कारण भी
  rationale: यह पाठ उस समूह के किसी एक सदस्य अथवा उससे संबंधित किसी एक प्रसंग के कारण भी तर्कबुद्धि न फिरने का भाव देता है; हिन्दी में संदर्भ की वास्तविक अस्पष्टता कुछ हद तक बनी रहती है।
- source_word: τὸν λογισμὸν αὐτῆς
  choice: उसकी तर्कबुद्धि
  rationale: λογισμός इस ग्रंथ का प्रमुख दार्शनिक शब्द है। 'तर्कबुद्धि' केवल संकल्प के बजाय विचारशील, नियंत्रक बुद्धि का भाव बनाए रखता है।
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: नाना प्रकार की यातनाएँ
  rationale: παντοίκιλοι की विविधता और βάσανοι की वास्तविक यातना—दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἴσχυσαν μετατρέψαι
  choice: विचलित न कर सकीं
  rationale: यातनाओं की असमर्थता और तर्कबुद्धि को उसके मार्ग से फेरने के प्रयास को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दार्शनिक रूप से महत्त्वपूर्ण λογισμός का अनुवाद
  choice: तर्कबुद्धि
  alternative: विवेक; दृढ़ निश्चय; तर्कपूर्ण निर्णय
  rationale: 4 मक्काबियों में यह शब्द भावनाओं पर बुद्धि के शासन की केंद्रीय धारणा से जुड़ा है। 'तर्कबुद्धि' उस वैचारिक सूत्र को बनाए रखता है, जबकि 'दृढ़ निश्चय' अर्थ को केवल इच्छाशक्ति तक सीमित कर सकता है।
- issue: ἐπʼ οὐδενὸς αὐτῶν के संकेत की अस्पष्टता
  choice: उनमें से किसी के कारण भी
  alternative: उनमें से किसी के मामले में भी; उन भावनाओं में से किसी के द्वारा भी
  rationale: सर्वनाम का ठीक संकेत व्याकरण और प्रसंग में पूर्णतः निर्विवाद नहीं है। चुना हुआ रूप किसी एक संतान/प्रसंग की ओर संभावित संकेत को खुला रखता है और अनावश्यक निश्चितता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। 'नाना प्रकार की यातनाएँ' साहित्यिक बल बनाए रखता है; 'तर्कबुद्धि' ग्रंथ की दार्शनिक शब्दावली को सुरक्षित करता है। फुटनोट चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
