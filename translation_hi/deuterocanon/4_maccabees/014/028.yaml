  yaml_path: translation/deuterocanon/4_maccabees/014/028.yaml
  text: But not only that[a]; rather, because of the noble goodness of her sons and their obedience to the law[b], her motherly affection for them was even greater.
translation:
  language: hi
  text: पर केवल इतना ही नहीं; बल्कि अपने पुत्रों के उदात्त सद्गुण और व्यवस्था के प्रति उनकी आज्ञाकारिता के कारण भी, उनके प्रति उसका मातृ-स्नेह और भी अधिक था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  choice: पर इतना ही नहीं; बल्कि
  rationale: यह पदबंध पिछले विचार से आगे बढ़कर एक और कारण जोड़ता है। यह हिन्दी अभिव्यक्ति उसके प्रबल आलंकारिक मोड़ को स्वाभाविक रूप में बनाए रखती है।
- source_word: καλοκἀγαθίαν
  choice: श्रेष्ठता और सदाचार
  rationale: यह संयुक्त धारणा चरित्र की श्रेष्ठता और नैतिक भलाई—दोनों को व्यक्त करती है; केवल ‘सद्गुण’ कहने से इसका एक पक्ष दब सकता है।
- source_word: τῶν υἱῶν
  choice: अपने पुत्रों की
  rationale: संदर्भ में ये उस माता के सात पुत्र हैं। यूनानी का पुल्लिंग-सूचक अर्थ बनाए रखते हुए हिन्दी में संबंध स्पष्ट किया गया है।
- source_word: εὐπείθειαν
  choice: आज्ञाकारिता
  rationale: यह शब्द स्वेच्छापूर्वक मानने या आज्ञापालन करने का भाव रखता है; व्यवस्था के संदर्भ में ‘आज्ञाकारिता’ स्पष्ट और स्वाभाविक है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: संदर्भ पूर्वजों से मिली यहूदी धार्मिक व्यवस्था का है। ‘व्यवस्था’ बाइबलीय संदर्भ में इस विशिष्ट अर्थ को संक्षेप में व्यक्त करती है।
- source_word: μείζω
  choice: और भी अधिक
  rationale: तुलनात्मक अर्थ स्पष्ट है और पिछले प्रसंग की अपेक्षा स्नेह की अधिकता बताता है।
- source_word: φιλοστοργίαν
  choice: मातृ-स्नेह
  rationale: मूल शब्द निकट पारिवारिक स्वाभाविक प्रेम बताता है। संदर्भ में कर्ता माता है, इसलिए ‘मातृ-स्नेह’ भाव और संबंध दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν αὐτοῖς ἔσχεν
  choice: उनके लिए उसका ... था
  rationale: यूनानी मुहावरा उनके प्रति उसके स्नेह को व्यक्त करता है। हिन्दी में इसे सहज संबंधवाचक रचना द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘व्यवस्था’ का संदर्भ
  choice: पूर्वजों से मिली यहूदी व्यवस्था अर्थात तोराह
  alternative: सामान्य नैतिक नियम
  rationale: 4 मक्काबियों में शहीदों की निष्ठा बार-बार पैतृक व्यवस्था के पालन से परिभाषित होती है; अतः यहाँ सामान्य कानून नहीं, विशिष्ट वाचाई व्यवस्था अभिप्रेत है।
- issue: परिवार-सूचक पद का लिंग
  choice: पुत्रों
  alternative: संतानों
  rationale: यूनानी υἱῶν विशेष रूप से पुत्रों को बताता है और प्रसंग माता के सात पुत्रों का है; इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘श्रेष्ठता और सदाचार’ मूल संयुक्त धारणा की दोनों छटाओं को बनाए रखता है, और ‘मातृ-स्नेह’ प्रसंगगत संबंध को संक्षेप तथा स्वाभाविक ढंग से स्पष्ट करता है।
