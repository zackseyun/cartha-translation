base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/017.yaml
  text: But even if they could not prevent it[a], flying around them on every side, grieving in their affection, and calling to them in their own voice, they would help their children in whatever way they could.
translation:
  language: hi
  text: फिर भी, यदि वे उसे रोक न पाते, तो वे उनके चारों ओर से उड़ते हुए[a], अपने स्वाभाविक स्नेह से व्यथित होकर और उन्हें अपनी ही आवाज़ से पुकारते हुए, जिस किसी भी तरह उनसे बन पड़े, अपने बच्चों की सहायता करते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ पक्षी का बिंब है: एक पक्षी-माता अपने बच्चों के चारों ओर उड़ती और अपनी आवाज़ से उन्हें पुकारती है।'
    reason: cultural_note
lexical_decisions:
- source_word: κωλύειν
  choice: रोकना
  rationale: यह क्रिया आनेवाली हानि या आक्रमण को रोकने अथवा बाधित करने का भाव देती है; ‘रोकना’ सहज है और साधन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: περιιπτάμενα κυκλόθεν αὐτῶν
  choice: उनके चारों ओर उड़ते हुए
  rationale: περιιπτάμενα पक्षियों के उड़ने और κυκλόθεν चारों ओर से घेरने का चित्र प्रस्तुत करता है; यह अनुवाद उस पक्षी-संबंधी बिंब को स्पष्ट रूप से बनाए रखता है।
- source_word: ἀλγοῦντα τῇ στοργῇ
  choice: अपने स्वाभाविक स्नेह के कारण व्यथित होकर
  rationale: στοργή स्वाभाविक पारिवारिक, विशेषतः माता-पिता और संतान के बीच के स्नेह को दर्शाता है, जबकि ἀλγοῦντα पीड़ा या व्यथा व्यक्त करता है। ‘स्वाभाविक स्नेह’ मातृत्व को शब्द में अनावश्यक रूप से जोड़ने से बचता है, क्योंकि वह प्रसंग से प्रकट है।
- source_word: ἀνακαλούμενα τῇ ἰδίᾳ φωνῇ
  choice: अपनी ही आवाज़ में उन्हें पुकारते हुए
  rationale: वाक्यांश अपनी विशिष्ट आवाज़ या पुकार से बच्चों को पुकारने का अर्थ देता है और पक्षियों के जीवंत बिंब को सुरक्षित रखता है।
- source_word: καθʼ ὃν δύναται τρόπον
  choice: जिस किसी प्रकार उनसे बन पड़े
  rationale: यह स्वाभाविक हिन्दी मुहावरा उपलब्ध हर संभव उपाय से सहायता करने की सीमित किंतु तत्पर क्षमता व्यक्त करता है।
- source_word: βοηθεῖ τοῖς τέκνοις
  choice: अपने बच्चों की सहायता करते हैं
  rationale: βοηθεῖ सहायता के लिए आने या मदद करने और τέκνοις संतान अथवा बच्चों को दर्शाता है; प्रसंग में ‘बच्चों’ सहज और स्पष्ट है।
theological_decisions:
- issue: मानवीय माता-पिता के स्नेह को समझाने वाला पक्षी-संबंधी बिंब
  choice: ‘चारों ओर उड़ते हुए’ कहकर बिंब को स्पष्ट रूप से बनाए रखना
  alternative: इसे सामान्य बनाकर केवल ‘उनके चारों ओर रहते हुए’ कहना
  rationale: यूनानी participle वास्तव में उड़ने की क्रिया बताता है। इसे बनाए रखने से लेखक की सजीव तुलना सुरक्षित रहती है और स्वाभाविक स्नेह को केवल अमूर्त चिंता में नहीं बदला जाता।
- issue: στοργή में मातृत्व को स्पष्ट रूप से जोड़ना या प्रसंग पर छोड़ना
  choice: ‘स्वाभाविक स्नेह’
  alternative: ‘मातृ-स्नेह’
  rationale: στοργή स्वयं स्वाभाविक पारिवारिक स्नेह बताता है; मातृत्व या माता-पिता का विशेष संबंध निकटवर्ती प्रसंग से आता है। इसलिए अनुवाद मूल की सीमा के भीतर रहता है और अर्थ को अनावश्यक रूप से संकरा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘जिस किसी प्रकार उनसे बन पड़े’ सीमित सामर्थ्य और हर संभव सहायता—दोनों भाव सहज रूप से व्यक्त करता है। पूर्ववर्ती प्रसंग में पक्षियों/जीवों का बहुवचन विषय होने के कारण हिन्दी में सामान्य बहुवचन पुल्लिंग क्रियारूप अपनाया गया है; इससे यूनानी के नपुंसकलिंग बहुवचन को किसी एक लिंग तक सीमित नहीं किया गया।
