translation:
  language: hi
  text: क्योंकि विवेकहीन पशु भी अपनी संतान के प्रति मनुष्यों जैसी सहानुभूति और ममता रखते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: क्योंकि ... भी
  rationale: यहाँ पदबंध स्थान नहीं, बल्कि पिछले कथन के समर्थन में कारण और बल प्रकट करता है; इसलिए ‘क्योंकि ... भी’ स्वाभाविक है।
- source_word: τὰ ἄλογα ζῷα
  choice: विवेकहीन पशु
  rationale: ἄλογα का आशय तर्क-विवेक की क्षमता से रहित जीवों से है और इसका मनुष्यों से स्पष्ट विरोध है; ‘विवेकहीन’ इस दार्शनिक भाव को संक्षेप में रखता है।
- source_word: τὴν πρὸς τὰ ἐξ αὐτῶν γεννώμενα
  choice: अपनी संतान के प्रति
  rationale: यूनानी का शाब्दिक अर्थ ‘उनसे उत्पन्न होने वालों के प्रति’ है; प्रसंग में वह उनकी अपनी संतान को दर्शाता है। हिंदी में ‘अपनी संतान’ स्पष्ट और स्वाभाविक है।
- source_word: ὁμοίαν ... τοῖς ἀνθρώποις
  choice: मनुष्यों जैसी
  rationale: यह पशुओं की सहानुभूति और ममता की तुलना मनुष्यों में पाई जाने वाली उन्हीं भावनाओं से करता है।
- source_word: συνπίθειαν
  choice: सहानुभूति
  rationale: शब्द सह-अनुभूति या भावनात्मक लगाव दर्शाता है; ‘सहानुभूति’ निकट और प्रचलित हिंदी समतुल्य है।
- source_word: στοργὴν
  choice: ममता
  rationale: στοργή विशेष रूप से स्वाभाविक पारिवारिक स्नेह, खासकर माता-पिता और संतान के लगाव, को दर्शाता है; संतान के प्रसंग में ‘ममता’ इस ऊष्मा को सहज ढंग से व्यक्त करती है।
