translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘कोटर’ और ‘दरार’ दृश्यात्मक तथा सामान्यतः बोधगम्य हैं। मूल यूनानी में निहित कर्ता को हिन्दी की आवश्यकता के अनुसार ‘वह’ से व्यक्त किया गया है, और संदर्भगत अस्पष्टता को पाद-टिप्पणी में बनाए रखा गया है।
