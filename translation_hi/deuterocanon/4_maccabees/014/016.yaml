base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/016.yaml
  text: But in the peaks of mountains and the clefts of ravines and the hollows of trees and their tops[a], making nests, it gives birth and keeps away the one who approaches.
translation:
  language: hi
  text: परन्तु पर्वतों की चोटियों पर, घाटियों की दरारों में, पेड़ों के कोटरों में और इनके छोरों पर[a] घोंसले बनाकर, वह बच्चों को जन्म देती है और पास आनेवाले को रोकती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “और इनके छोरों पर।” यहाँ संकेत इन स्थानों के ऊँचे, बाहरी, या अंतिम भागों की ओर हो सकता है।
    reason: τούτων ἄκρας का संबंध और स्थानगत अर्थ कुछ अस्पष्ट है; टिप्पणी अधिक शाब्दिक विकल्प और उसकी व्यापक अर्थ-सीमा को सुरक्षित रखती है।
lexical_decisions:
- source_word: τὰ δὲ κατὰ τὰς κορυφὰς ὀρέων
  choice: परन्तु पर्वतों की चोटियों पर
  rationale: κατά के स्थानवाचक भाव और पर्वतीय ऊँचाई की छवि को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: φαράγγων ἀπορρῶγας
  choice: घाटियों की दरारों में
  rationale: ἀπορρώξ टूटे हुए चट्टानी भाग, फटन या दरार का बोध देता है; ‘दरारों’ से दुर्गम आश्रय-स्थल की छवि स्पष्ट रहती है।
- source_word: δένδρων ὀπὰς
  choice: पेड़ों के कोटरों में
  rationale: ὀπή छेद या खोखली जगह है; घोंसले के प्रसंग में ‘कोटर’ सटीक, संक्षिप्त और प्रचलित हिन्दी शब्द है।
- source_word: τὰς τούτων ἄκρας
  choice: इनके ऊपरी सिरों पर
  rationale: ἄκρας का मूल भाव छोर, सिरा या ऊपरी भाग है। ‘इनके’ में τούτων का संदर्भ जानबूझकर खुला रखा गया है; उसे केवल पेड़ों तक सीमित नहीं किया गया।
- source_word: νοσσοποιούμενα
  choice: घोंसले बनाकर
  rationale: यह कृदन्त घोंसला बनाने या घोंसला बसाने की क्रिया बताता है। प्रसव का भाव अगले मुख्य क्रिया-पद ἀποτίκτει में अलग से व्यक्त है।
- source_word: ἀποτίκτει
  choice: वह बच्चे जनती है
  rationale: क्रिया संतान उत्पन्न करने को सीधे व्यक्त करती है। हिन्दी में स्त्रीलिंग ‘जनती है’ प्रसंगगत जननी के लिए स्वाभाविक है, जबकि कर्ता पूर्ववर्ती संदर्भ से ग्रहण किया जाता है।
- source_word: τὸν προσιόντα κωλύει
  choice: पास आनेवाले को रोकती है
  rationale: एकवचन कृदन्त की सामान्य अर्थवत्ता बनाए रखते हुए वाक्यांश को मूल के निकट रखा गया है; ‘रोकती है’ κωλύει का सीधा और स्वाभाविक अनुवाद है।
