  text: सातों भाइयों की परमेश्वर-भक्ति के विषय में पवित्र और सामंजस्यपूर्ण सहमतियाँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱερὰς
  choice: पवित्र
  rationale: यह शब्द परमेश्वर से संबंधित पवित्रता और ऊँचे धार्मिक भाव को व्यक्त करता है; आधुनिक हिन्दी में “पवित्र” स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐναρμόστους
  choice: सामंजस्यपूर्ण
  rationale: इसमें परस्पर ठीक बैठने और एक स्वर होने का भाव है; “सामंजस्यपूर्ण” उस रूपक और भाइयों की आंतरिक एकता, दोनों को बनाए रखता है।
- source_word: περὶ τῆς εὐσεβείας
  choice: परमेश्वर-भक्ति के विषय में
  rationale: εὐσέβεια यहाँ परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुरूप आचरण का केंद्रीय गुण है। “परमेश्वर-भक्ति” केवल सामान्य धार्मिकता की अपेक्षा आशय को अधिक स्पष्ट करती है।
- source_word: τῶν ἑπτὰ ἀδελφῶν
  choice: सातों भाइयों की
  rationale: संदर्भ में सात पुरुष सहोदर हैं। “सातों” उनकी संपूर्ण मंडली पर बल देता है और हिन्दी में स्वाभाविक है।
- source_word: συμφωνίας
  choice: एकमतता
  rationale: शब्द सहमति, मेल या एक स्वर होने को दर्शाता है। “एकमतता” भाइयों की संयुक्त निष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ἐναρμόστους के सामंजस्य-संबंधी भाव को अलग बनाए रखता है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: परमेश्वर-भक्ति
  alternative: धर्मपरायणता
  rationale: इस ग्रंथ में εὐσέβεια परमेश्वर और उसकी व्यवस्था के प्रति निष्ठावान श्रद्धा तथा आचरण को समेटता है। “परमेश्वर-भक्ति” इसके ईश्वराभिमुख भाव को स्पष्ट करता है, पर “धर्मपरायणता” भी संभव पारंपरिक अनुवाद है।
- issue: συμφωνίας के रूप और वचन की अस्पष्टता
  choice: हिन्दी में सामूहिक भाववाचक एकवचन “एकमतता”
  alternative: 'बहुवचन अर्थ: “एकमत अभिव्यक्तियाँ”'
  rationale: प्राप्त यूनानी रूप συμφωνίας को विशेषणों के साथ कर्मकारक बहुवचन समझा जा सकता है, जबकि परामर्श-पाठ इसे सामूहिक एकवचन अर्थ में लेता है। हिन्दी में अमूर्त सामूहिक “एकमतता” आशय को स्वाभाविक रखती है; पादटिप्पणी रूपगत संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और साहित्यिक अभिव्यक्ति रखी गई है। यह अंश पूर्ण वाक्य के बजाय एक पदबंध जैसा है, इसलिए मूल की खंडात्मक संरचना बनाए रखी गई है।
