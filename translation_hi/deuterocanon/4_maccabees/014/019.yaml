  yaml_path: translation/deuterocanon/4_maccabees/014/019.yaml
  text: For even bees[a], around the time of making honeycomb, defend themselves against those who approach, and, as with iron, strike with their stinger those who come near their brood[c][b], and defend them to the death.
translation:
  language: hi
  text: क्योंकि मधुमक्खियाँ भी छत्ता बनाने के समय[a] पास आनेवालों से अपनी रक्षा करती हैं और जो उनकी संतति[c] के निकट आते हैं, उन पर अपने डंक[b] से ऐसे प्रहार करती हैं मानो लोहे से प्रहार कर रही हों; और मृत्यु तक उसकी रक्षा करती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मोम उत्पन्न करने के समय” अथवा “छत्ता बनाने के मौसम में”; यूनानी शब्द विशेष रूप से मोम या छत्ते के निर्माण को दर्शाता है, केवल सामान्य रूप से शहद बनाने को नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “κέντρον से”; मधुमक्खियों के इस प्रसंग में इसका स्वाभाविक अर्थ “डंक” है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “उनकी संतति” है, जिससे अपनी संतान की रक्षा करने का चित्र उभरता है; यह तुलना आलंकारिक है, प्राणिविज्ञान का तकनीकी वर्णन नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: क्योंकि ... भी
  rationale: यह पद पिछले तर्क के समर्थन में एक बलयुक्त उदाहरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि ... भी’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μέλισσαι
  choice: मधुमक्खियाँ
  rationale: यह यूनानी प्राणीवाचक शब्द का सीधा और प्रचलित हिन्दी रूप है।
- source_word: περὶ τὸν τῆς κηρογονίας καιρὸν
  choice: छत्ता बनाने के समय
  rationale: κηρογονία मोम अथवा मोम के छत्ते के निर्माण को सूचित करता है। ‘छत्ता बनाना’ सामान्य पाठक के लिए स्वाभाविक है और इसे केवल शहद बनाने तक सीमित नहीं करता।
- source_word: ἐπαμύνονται
  choice: अपनी रक्षा करती हैं / रक्षा करती हैं
  rationale: क्रिया रक्षात्मक प्रतिरोध व्यक्त करती है। पहली बार कर्म स्पष्ट नहीं है, इसलिए ‘अपनी रक्षा करती हैं’; अंतिम बार संतति संदर्भ में होने के कारण ‘उनकी रक्षा करती हैं’ उपयुक्त है।
- source_word: τοὺς προσιόντας
  choice: पास आनेवालों / निकट आनेवालों
  rationale: वर्तमान कृदंत निकट आनेवाले लोगों या प्राणियों को तटस्थ रूप से बताता है; ‘आक्रमणकारी’ कहने से मूल से अधिक अर्थ जुड़ता।
- source_word: καθάπερ σιδήρῳ
  choice: ऐसे ... मानो लोहे से
  rationale: यह उपमा डंक की कठोर या प्रहारकारी शक्ति को लोहे से तुलना करती है; हिन्दी वाक्यक्रम में ‘मानो लोहे से’ स्पष्ट और स्वाभाविक है।
- source_word: τῷ κέντρῳ
  choice: अपने डंक से
  rationale: मधुमक्खियों के प्रसंग में κέντρον का स्वाभाविक ठोस अर्थ ‘डंक’ है।
- source_word: πλήσσουσι
  choice: मारती हैं
  rationale: यह प्रहार करने की क्रिया है; ‘मारती हैं’ सरल आधुनिक हिन्दी में प्रहार का अर्थ देता है, जबकि प्रसंग इसे मृत्यु देने के अर्थ में लेने को बाध्य नहीं करता।
- source_word: τῇ νοσσίᾳ αὐτῶν
  choice: अपनी संतति
  rationale: νοσσιά घोंसले की संतान अथवा बच्चों के समूह को दर्शाता है। ‘संतति’ मातृ-सुरक्षा के आलंकारिक भाव को बचाता है और मधुमक्खियों के लिए अस्वाभाविक ‘चूजे’ से बचता है।
- source_word: ἐπαμύνονται ἕως θανάτου
  choice: मृत्यु तक उनकी रक्षा करती हैं
  rationale: यह अंत तक बने रहनेवाली रक्षा को व्यक्त करता है। ‘मृत्यु तक’ यूनानी सीमा-वाक्यांश को सीधे बनाए रखता है।
