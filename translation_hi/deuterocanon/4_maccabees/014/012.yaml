lexical_decisions:
- source_word: μήτηρ
  choice: माँ
  rationale: यह आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा पद के भावनात्मक केंद्र में स्थित मातृ-संबंध को स्पष्ट रखता है।
- source_word: τῶν ἐπτὰ νεανίσκων
  choice: उन सात जवानों की
  rationale: νεανίσκων पुरुषवाचक युवाओं को सूचित करता है। ‘जवानों’ से उनकी आयु और पुरुषवाचकता बनी रहती है; ‘बेटों’ कहना इस पदांश में संबंध को समय से पहले व्याख्यायित करता।
- source_word: ὑπήνεγκεν
  choice: सहीं
  rationale: क्रिया पीड़ा को धैर्यपूर्वक सहने या झेलने का भाव देती है। ‘सहीं’ हिन्दी में स्वाभाविक है और माँ द्वारा अपने बच्चों की यातनाओं का भावनात्मक भार सहने के आशय को बनाए रखता है।
- source_word: στρέβλας
  choice: यातनाएँ
  rationale: शब्द सामान्यतः यातनाओं और अधिक विशिष्ट रूप से अंग मरोड़ने या रैक पर दी जाने वाली यातना का द्योतक हो सकता है। मुख्य पाठ में ‘यातनाएँ’ पठनीय रहते हुए व्यापक अर्थ सुरक्षित रखता है।
- source_word: τὰς ἐφʼ ἑνὶ ἑκάστῳ τῶν τέκνων
  choice: अपने हर एक बच्चे को दी गई यातनाएँ
  rationale: ἐφʼ ἑνὶ ἑκάστῳ का वितरणात्मक बल ‘हर एक’ से व्यक्त होता है, और τέκνων के लिए ‘बच्चे’ मातृ-संबंध को बनाए रखता है। ‘को दी गई’ हिन्दी में इस अर्थ को स्वाभाविक बनाता है कि यातना प्रत्येक बच्चे पर आई।
