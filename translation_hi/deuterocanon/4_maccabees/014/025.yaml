lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: जितनी अधिक ... उतना ही अधिक
  rationale: यह हिन्दी की स्वाभाविक सहसंबंधी तुलनात्मक रचना है और यूनानी के अनुपातसूचक बल को बनाए रखती है।
- source_word: ἀσθενέψυχοι
  choice: मन से दुर्बल
  rationale: यह यौगिक शब्द ψυχή की भीतरी मनोवृत्ति/प्राण-संबंधी छवि को बनाए रखता है और इसे केवल कायरता या भावुकता तक सीमित नहीं करता।
- source_word: πολυγονώτεραι
  choice: अधिक संतानें जननेवाली
  rationale: यह तुलनात्मक रूप और बहुत संतान उत्पन्न करने के अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ὑπάρχουσιν
  choice: होती हैं
  rationale: यहाँ क्रिया संबंधसूचक है; हिन्दी में ‘होती हैं’ स्वाभाविक सामान्य कथन बनाता है।
- source_word: αἱ μητέρες
  choice: माताएँ
  rationale: बहुवचन संज्ञा का सीधा और गरिमापूर्ण अनुवाद।
- source_word: φιλοτεκνότεραι
  choice: अपनी संतानों से प्रेम करती हैं
  rationale: शाब्दिक ‘अधिक संतान-प्रेमी’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और तुलनात्मकता ‘उतना ही अधिक’ से व्यक्त होती है।
