translation:
  language: hi
  text: इसके अतिरिक्त, उन्हें यातना सहने के लिए प्रेरित करते हुए, उनका उद्देश्य यह था कि वे न केवल पीड़ाओं को तुच्छ समझें, बल्कि अपने भाइयों के प्रति भ्रातृ-स्नेह से उपजी भावनाओं[a] पर भी नियंत्रण रखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाइयों के प्रति भ्रातृ-स्नेह के मनोवेगों।” यूनानी πάθη का अर्थ “मनोवेग” या “भावनाएँ” हो सकता है; यहाँ आशय है कि यातना के समय उन्हें अपने प्रबल पारिवारिक स्नेह पर भी नियंत्रण रखना था।
    reason: lexical_alternative
