- source_word: ὡς μὴ μόνον ... ἀλλὰ καί
  choice: उनका उद्देश्य यह था कि वे न केवल ... बल्कि ... भी
  rationale: यह संरचना अभिप्रेत परिणाम अथवा उद्देश्य को सहज आधुनिक हिन्दी में व्यक्त करती है।
- source_word: τῶν ἀλγηδόνων
  choice: पीड़ाओं
  rationale: यह यातना के अंतर्गत अनुभव की गई शारीरिक वेदनाओं को सीधे और पर्याप्त गंभीरता से व्यक्त करता है।
- source_word: περιφρονῆσαι
  choice: तुच्छ समझें
  rationale: क्रिया किसी वस्तु को नगण्य या हेय मानने का अर्थ देती है; ‘तुच्छ समझना’ आधुनिक हिन्दी में इस भाव को स्पष्ट रखता है।
- source_word: τῆς τῶν ἀδελφῶν φιλαδελφίας
  choice: अपने भाइयों के प्रति भ्रातृ-स्नेह
  rationale: यह भाइयों के लिए विशेष पारिवारिक प्रेम को व्यक्त करता है और यूनानी पदबंध के स्पष्ट भ्रातृ-संबंध को सुरक्षित रखता है।
- source_word: παθῶν
  choice: भावनाओं
  rationale: यहाँ शब्द तीव्र भावात्मक आवेगों को सूचित करता है जो विवेक के अधीन किए जाते हैं; ‘भावनाएँ’ सामान्य पाठक के लिए सहज है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: κρατῆσαι
  choice: नियंत्रण रखें
  rationale: क्रिया अधिकार पाने, वश में रखने या प्रबल होने का अर्थ देती है; यह पुस्तक के भावनाओं पर विवेक के शासन के विषय को बिना अनावश्यक तकनीकी भाषा के व्यक्त करती है।
