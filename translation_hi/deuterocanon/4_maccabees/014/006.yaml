base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/006.yaml
  text: For just as hands and feet move in harmony with the directions of the soul[a], so those holy youths also, as if by the immortal soul of godliness[b], were in harmony with death for its sake.
translation:
  language: hi
  text: क्योंकि जैसे हाथ और पाँव आत्मा के निर्देशों के अनुसार चलते हैं, वैसे ही वे पवित्र युवक भी मानो धर्मनिष्ठा की अमर आत्मा से प्रेरित होकर, उसकी खातिर मृत्यु का वरण करने पर सहमत हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “निर्देशों के अनुसार” और “सहमत हुए” में συμφων- शब्द-समूह की प्रतिध्वनि है, जो अंगों की आज्ञाकारिता और युवकों के एकजुट संकल्प को जोड़ती है। “धर्मनिष्ठा” के लिए “भक्ति” या “ईश्वर-भक्ति” भी कहा जा सकता है।
    reason: lexical_alternative_and_wordplay
lexical_decisions:
- source_word: καθάπερ ... οὕτως
  choice: जैसे ... वैसे ही
  rationale: यूनानी तुलना की दोनों कड़ियों को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: συμφώνως ... συνεφώνησαν
  choice: एक ताल में ... एकमत हो गए
  rationale: समान συμφων- धातु से बनी दोनों अभिव्यक्तियों के सामंजस्य और सहमति के संबंध को हिन्दी में निकटवर्ती शब्दों द्वारा व्यक्त करता है, यद्यपि हूबहू शब्द-पुनरावृत्ति स्वाभाविक नहीं होती।
- source_word: τοῖς τῆς ψυχῆς ἀφηγήμασιν
  choice: प्राण के निर्देशों
  rationale: ἀφηγήμασιν के मार्गदर्शन अथवा निर्देश के अर्थ को रखता है; ψυχή के लिए 'प्राण' इस देह-अंगों वाली उपमा में स्वाभाविक है और केवल बौद्धिक 'मन' तक अर्थ को सीमित नहीं करता।
- source_word: ἱεροὶ μειρᾶκες
  choice: पवित्र युवक
  rationale: ἱεροί की पवित्रता और μειρᾶκες की युवा पुरुषों वाली आयु-सूचना दोनों को सरल आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ὡς ὑπὸ ψυχῆς ἀθανάτου τῆς εὐσεβείας
  choice: मानो ईश्वर-भक्ति के अमर प्राण से प्रेरित होकर
  rationale: ὡς की उपमात्मकता, εὐσέβεια का धार्मिक भाव और अमर प्राण का मानवीकरण बनाए रखता है; 'प्रेरित होकर' ὑπό के प्रेरक प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς τὸν ὑπὲρ αὐτῆς ... θάνατον
  choice: उसके लिए मृत्यु को स्वीकार करने में
  rationale: मृत्यु की ओर सहमत होने और ईश्वर-भक्ति के निमित्त उसे सहने का आशय स्पष्ट करता है, बिना इसे आकस्मिक मृत्यु के अर्थ में सीमित किए।
theological_decisions:
- issue: εὐσέβεια का मानवीकरण और उसका 'अमर प्राण'
  choice: मानो ईश्वर-भक्ति के अमर प्राण से प्रेरित होकर
  alternative: मानो अमर प्राण अर्थात् ईश्वर-भक्ति से प्रेरित होकर
  rationale: वाक्य की आलंकारिक और कुछ हद तक संदिग्ध संरचना को बनाए रखता है तथा किसी वास्तविक पृथक अमर सत्ता के विषय में सिद्धान्तगत दावा नहीं बनाता।
- issue: मृत्यु के साथ सहमति का अर्थ
  choice: उसके लिए मृत्यु को स्वीकार करने में एकमत हो गए
  alternative: उसके लिए होने वाली मृत्यु के साथ एक ताल में हो गए
  rationale: यूनानी συνεφώνησαν की स्वेच्छापूर्ण सामूहिक सहमति को स्पष्ट करता है, पर यह नहीं जोड़ता कि उन्होंने मृत्यु चाही; वे ईश्वर-भक्ति के लिए उसे सहने पर सहमत हुए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। 'प्राण' देह और ψυχή की उपमा को बनाए रखता है; 'ईश्वर-भक्ति' εὐσέβεια के धार्मिक-नैतिक आशय को सांप्रदायिक विशिष्टता के बिना व्यक्त करता है।
