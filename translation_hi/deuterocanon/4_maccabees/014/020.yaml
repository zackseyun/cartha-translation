translation:
  language: hi
  text: पर अपने बच्चों के लिए ममता उन युवकों की उस माँ को डिगा न सकी, जो अब्राहम के साथ एकचित्त थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब्राहम-जैसी उन युवकों की माँ।” यूनानी में ὁμόψυχον (‘एकचित्त’, ‘एक मन की’) विशेषण उन युवकों की माँ के लिए आया है और अब्राहम के साथ उसकी समान आंतरिक मनोवृत्ति व्यक्त करता है।
    reason: ὁμόψυχον की विशेषणात्मक रचना को ‘अब्राहम-जैसी’ के रूप में भी समझा जा सकता है; मुख्य अनुवाद अब्राहम के साथ साझा मनोवृत्ति को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: μετεκίνησεν
  choice: डिगा न सकी
  rationale: क्रिया का मूल भाव किसी को उसकी स्थिति से हटा देना है; यहाँ यह माँ को उसके दृढ़ निश्चय से विचलित करने के अर्थ में है।
- source_word: συμπάθεια τέκνων
  choice: अपने बच्चों के प्रति ममता
  rationale: συμπάθεια निकट आत्मीय लगाव और कोमल अनुराग को व्यक्त करता है। मातृ-संदर्भ में ‘ममता’ स्वाभाविक हिन्दी है, और ‘अपने’ निहित पारिवारिक संबंध स्पष्ट करता है।
- source_word: ὁμόψυχον
  choice: समान मनवाली
  rationale: यह शब्द समान आंतरिक भाव, मनोवृत्ति या संकल्प को दर्शाता है। ‘समान मनवाली’ अब्राहम के साथ नैतिक-आत्मिक समानता रखता है, वंशगत संबंध नहीं जोड़ता।
- source_word: τῶν νεανιῶν μητέρα
  choice: उन जवानों की माँ
  rationale: νεανίαι युवा पुरुषों को दर्शाता है; ‘जवानों’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: अब्राहम के साथ तुलना का आशय
  choice: माँ को अब्राहम के समान आंतरिक मनोवृत्ति और दृढ़ता रखनेवाली बताया गया है।
  alternative: माँ को केवल ‘अब्राहम-जैसी’ कहना, या इसे अब्राहम से वंशगत संबंध मानना।
  rationale: ὁμόψυχον का अर्थ समान मन अथवा आत्मिक प्रवृत्ति होना है। यूनानी पाठ नैतिक-आत्मिक साम्य पर बल देता है, वंशावली पर नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘ममता’ मातृ-संदर्भ में συμπάθεια का स्वाभाविक अर्थ देता है; ‘डिगा न सकी’ दृढ़ निश्चय से हटाने के रूपक को बनाए रखता है।
