translation:
  language: hi
  text: पर देखो कि संतान-स्नेह कितना जटिल है[a]—वह सब कुछ अंतर की सहानुभूति[b] की ओर खींचता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मातृ-प्रेम’; निकटवर्ती प्रसंग सात भाइयों की माता का है, यद्यपि यूनानी शब्द का अर्थ अधिक व्यापक रूप से अपनी संतान के प्रति प्रेम है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘भीतरी अंगों की सह-अनुभूति’; भीतरी अंगों को गहरी भावनाओं का केंद्र माना जाता था।
    reason: source_idiom
lexical_decisions:
- source_word: θεωρεῖτε
  choice: ध्यान दो
  rationale: यह बहुवचन आज्ञार्थक क्रिया श्रोताओं को उदाहरण पर विचारपूर्वक दृष्टि डालने के लिए बुलाती है; ‘ध्यान दो’ आधुनिक हिन्दी में इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: πολυπλόκος
  choice: जटिल
  rationale: शब्द का मूल भाव अनेक तहों या परस्पर गुंथे पहलुओं वाला होना है। ‘जटिल’ उस बहुस्तरीयता को संक्षेप में व्यक्त करता है, बिना अर्थ में अतिरिक्त सकारात्मक या नकारात्मक व्याख्या जोड़े।
- source_word: φιλοτεκνίας
  choice: संतान के प्रति प्रेम
  rationale: यह संज्ञा अपनी संतान के प्रति प्रेम को दर्शाती है। प्रसंग में माता है, फिर भी यूनानी शब्द केवल मातृ-प्रेम तक सीमित नहीं है।
- source_word: στοργή
  choice: स्नेह
  rationale: στοργή स्वाभाविक पारिवारिक लगाव या अनुराग का द्योतक है; ‘स्नेह’ आधुनिक हिन्दी में इसका गरिमापूर्ण और सहज समतुल्य है।
- source_word: ἕλκουσα
  choice: खींचता है
  rationale: कृदंत संतान-प्रेम के स्नेह द्वारा लगाए जाने वाले आकर्षक बल का चित्र बनाए रखता है; हिन्दी वाक्य में इसे स्पष्ट क्रिया के रूप में रखा गया है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन यहाँ व्यापक अर्थ रखता है; ‘सब कुछ’ इस अनिर्दिष्ट समग्रता को बनाए रखता है।
- source_word: σπλάγχνων
  choice: अंतरतम
  rationale: शाब्दिक अर्थ शरीर के भीतरी अंग हैं, पर यूनानी भाव-भाषा में यह गहरी आंतरिक भावना का केंद्र है। ‘अंतरतम’ शारीरिक बिंब का भावार्थ स्वाभाविक हिन्दी में पहुँचाता है; शाब्दिकता पादटिप्पणी में सुरक्षित है।
- source_word: συμπάθειαν
  choice: साझी संवेदना
  rationale: शब्द किसी दूसरे के साथ अनुभूति या दुःख में सहभागी होने का भाव व्यक्त करता है। ‘साझी संवेदना’ आधुनिक हिन्दी में इस सह-अनुभूति को ‘दया’ मात्र तक सीमित नहीं करती।
theological_decisions:
- issue: शहीद भाइयों की माता के प्रसंग में φιλοτεκνία का दायरा
  choice: सामान्य अर्थ में ‘संतान के प्रति प्रेम’
  alternative: ‘मातृ-प्रेम’
  rationale: तात्कालिक प्रसंग माता पर केंद्रित है, किंतु यूनानी संज्ञा स्वयं माता तक सीमित नहीं होकर अपनी संतान के प्रति प्रेम बताती है। मुख्य पाठ उसकी व्यापकता रखता है और प्रसंगगत विकल्प पादटिप्पणी में देता है।
- issue: σπλάγχνων συμπάθειαν के शारीरिक बिंब और भावार्थ का संतुलन
  choice: मुख्य पाठ में ‘अंतरतम की साझी संवेदना’ और पादटिप्पणी में शाब्दिक बिंब
  alternative: ‘भीतरी अंगों की सहानुभूति’
  rationale: अत्यधिक शाब्दिक हिन्दी अस्वाभाविक और अस्पष्ट होती। चुना हुआ रूप गहरी आंतरिक सह-अनुभूति व्यक्त करता है, जबकि पादटिप्पणी मूल के शारीरिक रूपक को पारदर्शी बनाती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘संतान’ और ‘स्नेह’ पारिवारिक भाव को स्पष्ट करते हैं; ‘अंतरतम की साझी संवेदना’ मूल के गहरे सह-अनुभव को स्वाभाविक हिन्दी में व्यक्त करती है।
