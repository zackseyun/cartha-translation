  yaml_path: translation/deuterocanon/4_maccabees/014/007.yaml
  text: O most holy seven of harmonious brothers[a], for just as in the creation of the world the days are concerned with godliness[b],
translation:
  language: hi
  text: हे एकमत सात भाइयों के परमपवित्र समूह! क्योंकि जैसे संसार की रचना में दिन धर्मपरायणता[a] से जुड़े हैं, वैसे ही—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘भक्ति’ अथवा ‘धर्मनिष्ठा’। यूनानी: εὐσέβεια।'
    reason: lexical_alternative
  - marker: b
    text: यह तुलना अगले पद में पूरी होती है; यूनानी में यहाँ ‘क्योंकि जैसे’ से आरम्भ हुआ वाक्य अधूरा है।
    reason: cross_reference
lexical_decisions:
- source_word: πανάγιε
  choice: परमपवित्र
  rationale: सम्बोधन में प्रयुक्त इस विशेषण की अत्यन्त प्रबल पवित्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: συμφώνων
  choice: एकमत
  rationale: भाइयों की परस्पर सहमति और एकस्वरता का भाव संक्षेप और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: ἀδελφῶν
  choice: भाइयों
  rationale: यूनानी पुल्लिंग बहुवचन है और कथा के सात भाइयों को सूचित करता है।
- source_word: ἑβδομάς
  choice: सातों
  rationale: यह संज्ञा सात व्यक्तियों के एक समूह को दर्शाती है। हिन्दी में ‘सातों’ समूहगत भाव को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि यूनानी में समूह को एकवचन सम्बोधन माना गया है।
- source_word: κοσμοποιίας
  choice: संसार की रचना
  rationale: जगत् के बनाए जाने का स्पष्ट और सामान्य आधुनिक हिन्दी रूप।
- source_word: ἡμέραι
  choice: वे दिन
  rationale: पूर्वपरिचित सृष्टि-वर्णन के दिनों की ओर संकेत को स्पष्ट करते हुए मूल बहुवचन को बनाए रखता है।
- source_word: περὶ τὴν εὐσέβειαν
  choice: धर्मपरायणता से जुड़े थे
  rationale: संक्षिप्त यूनानी पदबंध का स्वाभाविक हिन्दी रूप; धार्मिक भक्ति और उसके अनुरूप आचरण—दोनों का नैतिक भाव बनाए रखता है।
theological_decisions:
- issue: εὐσέβεια का अनुवाद
  choice: धर्मपरायणता
  alternative: भक्ति; धर्मनिष्ठा
  rationale: इस ग्रन्थ में यह प्रमुख धार्मिक-नैतिक गुण है। ‘धर्मपरायणता’ ईश्वर के प्रति श्रद्धा और उसके अनुरूप निष्ठावान आचरण दोनों को व्यक्त करती है, बिना इसे केवल भावना या बाहरी धार्मिकता तक सीमित किए।
- issue: अधूरी उपमा की प्रस्तुति
  choice: ‘जैसे ... वैसे ही—’ कहकर वाक्य को अगले पद के लिए खुला रखना
  alternative: इस पद में ही तुलना का आशय पूरा कर देना
  rationale: यूनानी पाठ καθάπερ (‘जैसे’) से आरम्भ हुई तुलना को इस पद में पूरा नहीं करता। हिन्दी में इसे चुपचाप पूरा करना मूल की वाक्यगत अपूर्णता और अगले पद से उसके सम्बन्ध को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक सम्बोधन रखा गया है। ‘सातक’ जैसे तकनीकी और अस्वाभाविक शब्द से बचते हुए सामूहिक ἑβδομάς को ‘सातों’ कहा गया है। अन्त का दीर्घ विराम मूल यूनानी की अधूरी तुलना को दिखाता है।
