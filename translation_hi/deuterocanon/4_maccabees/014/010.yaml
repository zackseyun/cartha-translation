lexical_decisions:
- source_word: ὧν τί γένοιτο ἐπαλγέστερον;
  choice: इनसे अधिक पीड़ादायक और क्या हो सकता था?
  rationale: यह अनुवाद यूनानी तुलनात्मक पद ἐπαλγέστερον की पीड़ा-संबंधी तीव्रता और मूल के आलंकारिक प्रश्न, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὀξεῖα
  choice: तीखी
  rationale: मूल शब्द का अर्थ ‘तीखा’ या ‘प्रखर’ है। आग की शक्ति के लिए ‘तीखी’ मूल के सजीव रूपक को सुरक्षित रखता है।
- source_word: σύντομος
  choice: अल्पकालिक
  rationale: यहाँ शब्द का मूल अर्थ ‘संक्षिप्त’ या ‘थोड़े समय तक रहने वाला’ है। ‘अल्पकालिक’ आग की शक्ति के तीव्र किंतु थोड़े समय के प्रभाव को व्यक्त करता है और इसे केवल ‘तेज़’ अर्थ में सीमित नहीं करता।
- source_word: ἡ τοῦ πυρὸς οὖσα δύναμις
  choice: आग की शक्ति
  rationale: यह मूल की संरचना के निकट, स्पष्ट और गरिमापूर्ण हिन्दी है तथा आग को क्रियाशील विनाशकारी साधन के रूप में प्रस्तुत करता है।
- source_word: ταχέως διέλυσε τὰ σώματα
  choice: उसने शीघ्र ही शरीरों को नष्ट कर दिया
  rationale: ταχέως का सीधा अर्थ ‘शीघ्र’ है। διέλυσε में अलग कर देने, विघटित करने या नष्ट करने का भाव हो सकता है; प्रसंग में ‘नष्ट कर दिया’ स्वाभाविक है, जबकि उसकी व्यापक शब्दार्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
