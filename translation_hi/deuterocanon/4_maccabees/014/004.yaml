translation:
  language: hi
  text: उन सातों युवकों में से कोई भी कायर नहीं बना और न मृत्यु के सामने पीछे हटा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς ἐκ τῶν ἑπτὰ μειρακίων
  choice: उन सातों युवकों में से कोई भी
  rationale: यह पदबंध नकार को प्रत्येक युवक पर अलग-अलग लागू करता है। ‘युवक’ μειράκιον का स्वाभाविक आधुनिक हिन्दी रूप है और अनावश्यक बाल-सुलभ भाव से बचता है।
- source_word: ἐδειλίασεν
  choice: कायर नहीं बना
  rationale: δειλιάω में केवल भय अनुभव करने के बजाय कायर पड़ने या साहस खो देने का नैतिक भाव है; ‘कायर नहीं बना’ उस तीखेपन को बनाए रखता है।
- source_word: οὐδὲ
  choice: और न
  rationale: यह दूसरे निषेध को पहले से स्वाभाविक रूप से जोड़ता है।
- source_word: πρὸς τὸν θάνατον
  choice: मृत्यु के सामने
  rationale: ὀκνέω के साथ यह मृत्यु का सामना करते समय पीछे हटने का भाव देता है; हिन्दी में ‘मृत्यु के सामने’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ὤκνησεν
  choice: पीछे हटा
  rationale: ὀκνέω के हिचकने, सकुचाने या पीछे हटने के अर्थों में यहाँ शहादत के सामने न डिगने का भाव प्रमुख है।
theological_decisions:
- issue: सात युवकों के बाद यूनानी में एकवचन क्रिया
  choice: हिन्दी में ‘कोई भी ... नहीं ... और न ...’ की वितरक रचना रखी गई, जिसमें दोनों क्रियाएँ प्रत्येक युवक पर लागू होती हैं।
  alternative: बहुवचन रूप में ‘वे मृत्यु के सामने पीछे नहीं हटे’ कहना।
  rationale: यूनानी οὐδεὶς और दोनों एकवचन क्रियाएँ ‘उनमें से एक भी नहीं’ का वितरक अर्थ देती हैं। हिन्दी की यह रचना स्रोत की एकवचन-वितरक शक्ति को स्वाभाविक ढंग से सुरक्षित रखती है, इसलिए अलग टिप्पणी आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। ‘कायर नहीं बना’ मूल के नैतिक तीखेपन को और ‘मृत्यु के सामने पीछे हटा’ शहादत-संदर्भ के साहस को बनाए रखता है।
