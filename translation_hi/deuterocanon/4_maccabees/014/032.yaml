  yaml_path: translation/deuterocanon/4_maccabees/014/032.yaml
  text: O sacred nature[a], and parents’ affections, and filial love toward parents, and nurture[b], and mothers’ unconquerable passions.
translation:
  language: hi
  text: हे पवित्र प्रकृति—माता-पिता का स्नेह[a], संतान का माता-पिता के प्रति कोमल स्नेह, पालन-पोषण, और माताओं की अजेय भावनाएँ[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ ‘प्रेम-मंत्र’ या ‘प्रेम-आकर्षण’ भी हो सकता है; यहाँ आशय अधिक स्वाभाविक रूप से माता-पिता के आत्मीय स्नेह से है।
    reason: lexical_alternative
  - marker: b
    text: 'या ‘माताओं के अदम्य मनोभाव’; प्रसंग में कम संभावित अर्थ: ‘माताओं के अजेय दुःख।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: पवित्र प्रकृति
  rationale: φύσις के व्यापक अर्थ ‘प्रकृति/स्वाभाविक व्यवस्था’ को बनाए रखा गया है; प्रसंग में यह पारिवारिक संबंधों की प्राकृतिक और पवित्र शक्ति का भाव जगाता है, पर ‘बंधन’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: φίλτρα γονέων
  choice: माता-पिता का स्नेह
  rationale: φίλτρα का शाब्दिक संबंध प्रेम जगाने वाले आकर्षण या प्रेम-मंत्र से हो सकता है, किंतु यहाँ साहित्यिक अर्थ में आत्मीय स्नेह अधिक स्वाभाविक है।
- source_word: γονεύσιν φιλοστόργε
  choice: माता-पिता के प्रति संतान का सहज प्रेम
  rationale: γονεύσιν दत्तिव माता-पिता की ओर निर्देशित प्रेम बताता है और φιλοστόργος निकट पारिवारिक अनुराग को व्यक्त करता है। हिंदी में ‘संतान का सहज प्रेम’ उस संबंध को स्पष्ट और स्वाभाविक ढंग से प्रकट करता है।
- source_word: τροφεῖα
  choice: पालन-पोषण
  rationale: यह शब्द पोषण और बड़ा करने—दोनों पहलुओं को समेट सकता है; ‘पालन-पोषण’ आधुनिक हिंदी में दोनों को सहजता से व्यक्त करता है।
- source_word: μητέρων ἀδάμαστα πάθη
  choice: माताओं की अजेय भावनाएँ
  rationale: πάθη यहाँ मातृ-स्नेह की प्रबल भावनाओं का संकेत देता है, जबकि ἀδάμαστα उनकी ऐसी शक्ति बताता है जिसे वश में या पराजित नहीं किया जा सकता। ‘भावनाएँ’ नकारात्मक अर्थ से बचते हुए मूल की भावात्मक व्यापकता रखता है।
theological_decisions:
- issue: पारिवारिक भावनाओं से भरे पद को बाद की धार्मिक या नैतिक पारिभाषिक भाषा में ढालना
  choice: इसे प्राकृतिक पारिवारिक बंधनों और मातृभाव की शक्ति का अलंकारिक उद्गार मानकर अनूदित किया गया है।
  alternative: πάθη को ‘दुःख’ मानकर माताओं के अजेय कष्टों के रूप में पढ़ना।
  rationale: प्रसंग में पद कोई व्यवस्थित सैद्धांतिक दावा नहीं करता, बल्कि पारिवारिक अनुराग की पवित्रता और प्रबलता पर भावपूर्ण उद्गार है। फिर भी πάθη की ‘दुःख’ वाली संभावित अर्थच्छाया पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भावोत्तेजक रखी गई है। यूनानी के आवाहनात्मक विस्मय को ‘हे’ और विस्मयादिबोधक चिह्नों से व्यक्त किया गया है। सूची की काव्यात्मक लय बनाए रखते हुए कठिन शाब्दिक रूपों के स्थान पर सामान्य पाठक के लिए बोधगम्य पारिवारिक शब्दावली चुनी गई है।
