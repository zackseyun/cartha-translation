lexical_decisions:
- source_word: τί δεῖ
  choice: क्या आवश्यकता है
  rationale: यह यूनानी मुहावरा आवश्यकता पर प्रश्न उठाने वाला आलंकारिक प्रश्न है। ‘क्या आवश्यकता है’ उसके भाव और स्वाभाविक हिन्दी—दोनों को बनाए रखता है।
- source_word: διὰ τῶν ἀλόγων ζῴων
  choice: विवेकहीन पशुओं के उदाहरण से
  rationale: διά यहाँ पशुओं को उदाहरण या माध्यम बनाने का भाव देता है। ἄλογος का शाब्दिक आशय ‘तर्क-बुद्धि से रहित’ है; ‘विवेकहीन’ मनुष्य और पशु की तर्कक्षमता के निहित अंतर को सुबोध हिन्दी में व्यक्त करता है।
- source_word: ἐπιδεικνύναι
  choice: दिखाने
  rationale: क्रिया का अर्थ किसी बात को उदाहरण द्वारा प्रकट या प्रमाणित करना है। ‘दिखाने’ सरल और प्रसंगानुकूल है।
- source_word: συμπάθειαν
  choice: लगाव
  rationale: यहाँ शब्द आधुनिक अर्थ में केवल ‘सहानुभूति’ नहीं, बल्कि संतान के प्रति आत्मीय और कोमल भाव को दर्शाता है। ‘लगाव’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς τὰ τέκνα
  choice: संतानों के प्रति
  rationale: τέκνα का आशय बच्चे या संतान है। सामान्य कथन में ‘संतानों के प्रति’ संबंध को स्पष्ट रखता है और अनावश्यक रूप से स्वामित्व-सूचक सर्वनाम नहीं जोड़ता।
