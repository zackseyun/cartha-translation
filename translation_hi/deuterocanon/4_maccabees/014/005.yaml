  text: But all of them[a], as though running on a road to immortality, were hurrying toward death through tortures[b],
translation:
  language: hi
  text: परन्तु वे सभी, मानो अमरता की राह पर दौड़ रहे हों, यातनाओं से होकर मृत्यु की ओर तेज़ी से बढ़ रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले प्रसंग के साथ प्रबल विरोध दर्शाता है; ‘परन्तु’ गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: πάντες
  choice: वे सभी
  rationale: यह पहले से उल्लिखित पूरे समूह को सामूहिक रूप से संदर्भित करता है।
- source_word: ὥσπερ
  choice: मानो
  rationale: यह कथन को शाब्दिक तथ्य के बजाय उपमा के रूप में प्रस्तुत करता है।
- source_word: ἐπʼ ἀθανασίας ὁδὸν
  choice: अमरता की राह पर
  rationale: यह मूल के मार्ग-रूपक और ‘अमरता’ के प्रत्यक्ष धार्मिक अर्थ, दोनों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: τρέχοντες
  choice: दौड़ रहे हों
  rationale: वर्तमान कृदन्त उत्सुक और गतिशील क्रिया का चित्र प्रस्तुत करता है; ‘दौड़ रहे हों’ उपमा के साथ सहज बैठता है।
- source_word: ἐπὶ τὸν ... θάνατον
  choice: मृत्यु की ओर
  rationale: ἐπί के दिशासूचक भाव को व्यक्त करता है और पद के गति-संबंधी बिम्ब को बनाए रखता है।
- source_word: διὰ τῶν βασάνων
  choice: यातनाओं से होकर
  rationale: διά के माध्यम अथवा मार्ग के भाव और βασάνων की कठोर यातना—दोनों को व्यक्त करता है; यह अमरता की राह और मृत्यु की ओर गति के रूपक से भी जुड़ता है।
- source_word: ἔσπευδον
  choice: तेज़ी से बढ़ रहे थे
  rationale: अपूर्ण काल में जारी शीघ्र गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शहादत के प्रसंग में ἀθανασία का अर्थ
  choice: अमरता
  alternative: अनन्त जीवन
  rationale: यूनानी संज्ञा सीधे मृत्युहीनता अथवा अमरता को सूचित करती है। ‘अनन्त जीवन’ कहना सम्भव धार्मिक आशय की व्याख्या कर देता; ‘अमरता’ मूल शब्द और उसके धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर शैली गरिमापूर्ण रखी गई है। मार्ग, दौड़ और मृत्यु की ओर बढ़ने का संयुक्त रूपक यथासम्भव सुरक्षित रखा गया है।
