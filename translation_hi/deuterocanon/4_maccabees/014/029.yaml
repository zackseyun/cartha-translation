  yaml_path: translation/deuterocanon/4_maccabees/014/029.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving toward their brothers, and so devoted to their mother that, even to the point of death, they obeyed her by keeping the law.
translation:
  language: hi
  text: क्योंकि वे धर्मी और संयमी, साहसी और उदारचित्त, अपने भाइयों से प्रेम रखनेवाले थे; और अपनी माता से ऐसा प्रेम करनेवाले थे कि मृत्यु तक भी नियमों[a] का पालन करते हुए उसकी बात मानते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पैतृक नियमों” अथवा “विधि-विधानों”; यूनानी में यह बहुवचन है और उन वैध अपेक्षाओं की ओर संकेत करता है जिनका पालन करने के लिए वे दृढ़ थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοί
  choice: धर्मी
  rationale: सदाचार और धार्मिक निष्ठा—दोनों का भाव रखता है और गुणों की इस सूची के अनुकूल है।
- source_word: σώφρονες
  choice: संयमी
  rationale: आत्म-नियंत्रण और विवेकपूर्ण मर्यादा का संक्षिप्त, स्वाभाविक हिन्दी रूप है।
- source_word: ἀνδρεῖοι
  choice: साहसी
  rationale: यहाँ शब्द का आशय वीरता और धैर्य है; ‘साहसी’ अनावश्यक लैंगिक अर्थ जोड़े बिना इसे व्यक्त करता है।
- source_word: μεγαλόψυχοι
  choice: उदार हृदयवाले
  rationale: शाब्दिक ‘महान आत्मावाले’ की अपेक्षा यह महानचित्तता और ऊँचे नैतिक मनोभाव को सहज हिन्दी में प्रकट करता है।
- source_word: φιλάδελφοι
  choice: अपने भाइयों से प्रेम रखनेवाले
  rationale: कथा में पुरुष सहोदर भाइयों का उल्लेख है, इसलिए यूनानी के विशिष्ट पारिवारिक और पुल्लिंग संदर्भ को बनाए रखा गया है।
- source_word: φιλόμητρος
  choice: अपनी माता से उनका प्रेम इतना गहरा था
  rationale: माता के प्रति स्नेह और समर्पित निष्ठा दोनों को व्यक्त करता है तथा οὕτως ... ὥστε के परिणामसूचक वाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: μέχρι θανάτου
  choice: मृत्यु तक
  rationale: उनकी निष्ठा की अंतिम सीमा को संक्षिप्त और प्रबल ढंग से व्यक्त करता है।
- source_word: τὰ νόμιμα
  choice: विधि-विधान
  rationale: यूनानी बहुवचन है और उन मान्य धार्मिक नियमों या रीति-विधानों की ओर संकेत करता है जिन्हें वे निभाते रहे; हिन्दी बहुवचन मूल की व्यापकता बनाए रखता है।
- source_word: φυλάσσοντας
  choice: पालन करते हुए
  rationale: धार्मिक-कानूनी संदर्भ में φυλάσσω का अर्थ नियमों को मानना या उनका पालन करना है।
- source_word: πείθεσθαι αὐτῇ
  choice: उसकी बात मानी
  rationale: व्यक्तिवाचक सम्प्रदान के साथ πείθομαι यहाँ आज्ञापालन या बात मानने का अर्थ देता है; यह हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: यहूदी शहादत के संदर्भ में τὰ νόμιμα का अनुवाद
  choice: विधि-विधान
  alternative: व्यवस्था; पैतृक नियम; धार्मिक विधान
  rationale: बहुवचन यूनानी विशिष्ट मान्य नियमों और रीति-विधानों का बोध कराता है। ‘विधि-विधान’ इस बहुवचन और धार्मिक-कानूनी अर्थ को बनाए रखता है, जबकि केवल ‘व्यवस्था’ इसे एकवचन और अधिक निश्चित धार्मिक पद बना सकती है।
- issue: φιλάδελφοι में पारिवारिक लिंग-संदर्भ
  choice: अपने भाइयों से प्रेम रखनेवाले
  alternative: अपने भाई-बहनों से प्रेम रखनेवाले
  rationale: इस कथा में संबोधित संतानें परस्पर भाई हैं; अतः मूल और प्रसंग के पुल्लिंग पारिवारिक संदर्भ को सामान्यीकृत नहीं किया गया।
- issue: πείθεσθαι αὐτῇ और विधि-पालन का संबंध
  choice: विधि-विधानों का पालन करते हुए उसकी बात मानी
  alternative: उसके कहने से विधि-विधानों का पालन किया
  rationale: यूनानी रचना में आज्ञापालन और विधि-पालन का संबंध निकट है, पर कारण या साधन का संबंध पूर्णतः स्पष्ट नहीं किया गया। ‘करते हुए’ दोनों को साथ रखता है और मूल की संभावित अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। गुणों की सूची का लयात्मक क्रम सुरक्षित है; अत्यधिक संस्कृतनिष्ठ ‘महात्मा’ या अस्पष्ट ‘व्यवस्था’ से बचते हुए ‘उदार हृदयवाले’ और ‘विधि-विधान’ चुने गए हैं।
