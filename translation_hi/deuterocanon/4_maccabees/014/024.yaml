base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/024.yaml
  text: How can I describe the affection of parents for their children—the fervor that stamps into the small form of a child the marvelous likeness of soul and appearance[a], This is especially so because fathers make mothers more sympathetic toward those who have been born?
translation:
  language: hi
  text: मैं माता-पिता के संतान-प्रेम की उस प्रबल उष्मा का वर्णन कैसे करूँ, जो बालक की छोटी-सी आकृति में आत्मा और रूप की अद्भुत समानता अंकित कर देती है[a]—विशेषकर इसलिए कि पिता माताओं को जन्मे हुओं के प्रति और अधिक संवेदनशील बना देते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बालक की छोटी-सी आकृति में आत्मा और आकृति की अद्भुत समानता की मुहर लगा देती है।” यूनानी वाक्य अत्यंत सघन है और इसमें छाप या मुहर लगाने का दुर्लभ रूपक है।
    reason: दुर्लभ παιδοχαρακτήρ और ἐναποσφραγίζω की छवि तथा ψυχή/μορφή के वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: τίνα τρόπον ἠθολογήσῃμι
  choice: मैं ... का वर्णन कैसे करूँ
  rationale: दुर्लभ क्रिया ἠθολογέω यहाँ किसी भाव या स्वभाव को शब्दों में चित्रित करने का अर्थ देती है। हिंदी में यह आलंकारिक प्रश्न स्वाभाविक और स्पष्ट रहता है।
- source_word: φιλοτέκνα γονέων αἴθη
  choice: माता-पिता के संतान-प्रेम की उस प्रबल उष्मा
  rationale: αἴθη भावनात्मक ताप, आवेग या उत्कटता का बिंब रखता है; ‘प्रबल उष्मा’ उस बिंब को बचाती है, जबकि ‘संतान-प्रेम’ φιλοτέκνα का सहज अर्थ देता है।
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: आत्मा और रूप की ... समानता
  rationale: ψυχή भीतरी जीवन या आत्मा और μορφή बाहरी रूप को सूचित करता है। ‘आत्मा और रूप’ मूल की द्विपक्षीयता और संभावित अर्थ-विस्तार को बनाए रखता है।
- source_word: εἰς μικρὸν παιδοχαρακτῆρα
  choice: बालक की छोटी-सी छवि पर
  rationale: दुर्लभ संयुक्त शब्द παιδοχαρακτήρ बालक की आकृति, छाप या प्रतिरूप का बिंब देता है। ‘छवि’ पठनीय है और साथ आने वाली अंकन-मुद्रांकन की भाषा से मेल खाती है।
- source_word: θαυμάσιον ἐναποσφραγίζοντα
  choice: अद्भुत ... अंकित कर देती है
  rationale: ἐναποσφραγίζω मुहर लगाने या छाप अंकित करने का सशक्त रूपक है। ‘अंकित कर देती है’ आधुनिक हिंदी में इस बिंब को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μάλιστα διὰ τὸ
  choice: विशेषकर इसलिए कि
  rationale: कारणसूचक संबंध को स्पष्ट रखते हुए मूल के बलाघात को सुरक्षित करता है।
- source_word: τῶν πατέρων τοῖς γεννηθεῖσιν τὰς μητέρας καθιστᾶναι συμπαθεστέρας
  choice: पिता माताओं को अपनी जन्मी हुई संतानों के प्रति और अधिक संवेदनशील बना देते हैं
  rationale: वाक्य के असामान्य दावे और तुलनात्मक συμπαθεστέρας को बिना व्याख्यात्मक समाधान के सुरक्षित रखा गया है। ‘संवेदनशील’ साथ महसूस करने और कोमल अनुराग—दोनों अर्थों के लिए पर्याप्त व्यापक है।
theological_decisions:
- issue: पिता माताओं को संतानों के प्रति अधिक συμπαθεῖς बनाते हैं—इस कथन का आशय
  choice: असामान्य कारण-संबंध को ज्यों का त्यों रखा गया
  alternative: इसे माता-पिता की साझा समानता या मातृत्व-स्नेह की सामान्य व्याख्या बनाना
  rationale: यूनानी पाठ में पिता कर्ता और माताएँ कर्म हैं; इसे सहज बनाने के लिए संबंध उलटना या कोई अतिरिक्त धर्मवैचारिक/मनोवैज्ञानिक व्याख्या जोड़ना मूल की वास्तविक कठिनाई मिटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण आलंकारिक शैली रखी गई है। ‘प्रबल उष्मा’, ‘छवि’ और ‘अंकित’ मूल के भावात्मक ताप तथा मुद्रांकन-बिंब को बनाए रखते हैं; कठिन अंतिम कारण-वाक्य को जानबूझकर सरल व्याख्या में नहीं बदला गया।
