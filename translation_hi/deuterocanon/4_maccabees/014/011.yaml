base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/011.yaml
  text: And do not consider it remarkable if reason gained the mastery over those men in their torments[b][a], since even a woman's mind looked down on more severe pains.
translation:
  language: hi
  text: और इसे आश्चर्य की बात न समझो कि यातनाओं में विवेक ने उन पुरुषों पर विजय पाई,[a] क्योंकि एक स्त्री के मन ने तो और भी अनेक प्रकार की पीड़ाओं को तुच्छ जाना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यातनाओं में विवेक ने उन पुरुषों पर पूरी तरह प्रभुत्व पाया।”
    reason: περιεκράτησεν के निर्णायक प्रभुत्व अथवा विजय-सूचक अर्थ का वैकल्पिक रूप।
  - marker: b
    text: या, “और भी अनेक प्रकार की पीड़ाओं से ऊपर उठ गया”; कुछ लोग ‘अनेक प्रकार की’ को “अधिक कठोर” के अर्थ में समझते हैं।
    reason: ὑπερεφρόνησεν में तिरस्कार और ऊपर उठने का भाव है; πολυτροπωτέρων का प्राथमिक अर्थ बहुविधता है, यद्यपि संदर्भ में अधिक कठोर होने की व्याख्या भी संभव है।
lexical_decisions:
- source_word: θαυμαστόν ... ἡγεῖσθε
  choice: आश्चर्य की बात न समझो
  rationale: यह संयोजन किसी बात को आश्चर्यजनक मानने का निषेध करता है; यह हिन्दी में सहज और मूल के निकट है।
- source_word: λογισμός
  choice: विवेक
  rationale: यहाँ मनुष्य की तर्कशील, संयमी निर्णय-शक्ति अभिप्रेत है। ‘विवेक’ पुस्तक के दार्शनिक विषय को सामान्य हिन्दी में स्पष्ट रखता है।
- source_word: περιεκράτησεν
  choice: पूरी तरह हावी रहा
  rationale: क्रिया निर्णायक रूप से अधिकार या प्रभुत्व बनाए रखने का भाव देती है।
- source_word: ἐν ταῖς βασάνοις
  choice: यातनाओं के बीच
  rationale: संदर्भ में βάσανοι शहीदों को दी गई कठोर यातनाएँ हैं; ‘के बीच’ परिस्थितिगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅπου γε καί
  choice: क्योंकि ... तो
  rationale: यह पहले कथन को और अधिक प्रबल उदाहरण से पुष्ट करता है; ‘तो’ καί के बल को हिन्दी में उभारता है।
- source_word: γυναικὸς νοῦς
  choice: एक स्त्री का मन
  rationale: मूल में एकवचन और लिंग-सूचक विरोध स्पष्ट है; अनुवाद उसे बनाए रखता है।
- source_word: πολυτροπωτέρων
  choice: और भी अनेक प्रकार की
  rationale: तुलनात्मक विशेषण पीड़ाओं के अधिक बहुरूपी या विविध होने का संकेत देता है, केवल अधिक तीव्र होने का नहीं।
- source_word: ὑπερεφρόνησεν
  choice: तुच्छ जाना
  rationale: क्रिया किसी वस्तु को अपने से नीचे समझने, उसकी उपेक्षा करने या उससे ऊपर उठने का भाव रखती है।
- source_word: ἀλγηδόνων
  choice: पीड़ाओं
  rationale: शब्द शारीरिक या अनुभूत वेदनाओं को सूचित करता है; ‘पीड़ाएँ’ व्यापक और संदर्भानुकूल है।
theological_decisions:
- issue: λογισμός को शहादत और आत्मसंयम के दार्शनिक संदर्भ में व्यक्त करना
  choice: विवेक
  alternative: तर्कबुद्धि
  rationale: ‘विवेक’ तर्कपूर्ण निर्णय और आत्म-नियंत्रण दोनों का स्वाभाविक संकेत देता है, बिना बाद की किसी विशिष्ट दार्शनिक या सांप्रदायिक शब्दावली को आरोपित किए।
- issue: पुरुषों और एक स्त्री के बीच मूल का स्पष्ट विरोध
  choice: उन पुरुषों ... एक स्त्री का मन
  alternative: उन लोगों ... उसका मन
  rationale: मूल यूनानी दोनों ओर लिंग को स्पष्ट करता है; उसे तटस्थ बनाना लेखक के आलंकारिक विरोध को मिटा देता।
- issue: πολυτροπωτέρων में विविधता बनाम तीव्रता
  choice: और भी अनेक प्रकार की पीड़ाएँ
  alternative: और भी कठोर पीड़ाएँ
  rationale: शब्द का प्राथमिक बल बहुरूपता या अनेक प्रकारों पर है। संदर्भ में कठोरता निहित हो सकती है, पर उसे मुख्य पाठ में निश्चित कर देना मूल की अर्थ-व्याप्ति को संकरा करेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘विवेक’ को इस पुस्तक के प्रमुख दार्शनिक पद के रूप में रखा गया है। मुख्य पाठ में यूनानी के तुलनात्मक और बहुरूपी अर्थ को सुरक्षित रखा गया है; वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
