- source_word: σωτηρίας προσκαίρου
  choice: थोड़े समय की सुरक्षा
  rationale: यहाँ σωτηρία तत्काल मृत्यु से बचाए जाने को दर्शाता है और πρόσκαιρος उसके अस्थायी स्वरूप पर बल देता है; ‘सुरक्षा’ अनावश्यक पारलौकिक अर्थ से बचाती है।
- source_word: τῆς ἑπτὰ υἱῶν
  choice: उसके सातों पुत्रों की
  rationale: संदर्भ स्पष्ट करता है कि वे उसी माँ के पुत्र हैं; ‘सातों’ हिन्दी में सभी सात पुत्रों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: अत्याचारी के वादे के अनुसार
  rationale: κατά यहाँ ‘के अनुसार’ और ὑπόσχεσις शासक द्वारा उन्हें जीवित छोड़ने के वादे या प्रस्ताव को सूचित करता है।
theological_decisions:
- issue: शहादत के संदर्भ में εὐσέβεια का अनुवाद
  choice: परमेश्वर-भक्ति
  alternative: भक्ति; धर्मनिष्ठा; परमेश्वर के प्रति श्रद्धा
  rationale: यह चयन परमेश्वर और उसकी व्यवस्था के प्रति निष्ठा का धार्मिक-नैतिक भार बनाए रखता है, बिना किसी विशिष्ट सम्प्रदाय की शब्दावली जोड़े।
- issue: इस संदर्भ में σωτηρία का अनुवाद
  choice: सुरक्षा
