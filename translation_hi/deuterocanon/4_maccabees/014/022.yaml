translation:
  language: hi
  text: एक माँ के सामने दो बातें रखी थीं—परमेश्वर-भक्ति[a] और अत्याचारी के वादे के अनुसार उसके सातों पुत्रों की थोड़े समय की सुरक्षा[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भक्ति’, ‘धर्मनिष्ठा’ अथवा ‘परमेश्वर के प्रति श्रद्धा’; यूनानी εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘थोड़े समय की प्राण-रक्षा’; यूनानी पद अत्याचारी के वादे के अधीन कुछ समय के लिए जीवित बच जाने को दर्शाता है, आवश्यक रूप से व्यापक धार्मिक अर्थ में उद्धार को नहीं।
    reason: lexical_alternative
