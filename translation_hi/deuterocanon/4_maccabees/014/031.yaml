  text: पर माँ ने हर एक बेटे को अलग-अलग[a] और उन सबको एक साथ, भक्ति[b] के लिए मृत्यु की ओर बढ़ने को प्रोत्साहित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक-एक करके।”
    reason: lexical_alternative
  - marker: b
    text: “भक्ति” के लिए यूनानी शब्द परमेश्वर के प्रति श्रद्धापूर्ण आदर और निष्ठावान समर्पण को दर्शाता है। इसका अनुवाद “परमेश्वर के प्रति श्रद्धा” या “धर्मनिष्ठा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: पर
  rationale: यह पिछले प्रसंग से हल्का विरोध और बलयुक्त निरंतरता दिखाता है; आधुनिक हिन्दी में ‘पर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: καθʼ ἕνα
  choice: हर एक ... अलग-अलग
  rationale: यह मुहावरा वितरणात्मक अर्थ, अर्थात ‘एक-एक करके’ या ‘व्यक्तिगत रूप से’, देता है।
- source_word: παῖδα
  choice: बेटे
  rationale: παῖς सामान्यतः ‘बालक/संतान’ हो सकता है, पर यहाँ माँ के पुरुष बच्चों के प्रसंग में ‘बेटे’ पारिवारिक संबंध को ठीक व्यक्त करता है।
- source_word: ὁμοῦ πάντας
  choice: उन सबको एक साथ
  rationale: यह पहले आए व्यक्तिगत वितरण के साथ सामूहिक अर्थ का स्पष्ट विरोध-संतुलन बनाए रखता है।
- source_word: ἡ μήτηρ
  choice: माँ
  rationale: संदर्भ में निश्चित माँ स्पष्ट है; हिन्दी में ‘माँ’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπὶ ... προέτρεπεν
  choice: मृत्यु की ओर बढ़ने को प्रोत्साहित किया
  rationale: प्रयोग में दिशा और प्रेरित करने—दोनों का भाव है; यह हिन्दी वाक्यांश दोनों को व्यक्त करता है।
- source_word: τὸν ... θάνατον
  choice: मृत्यु
  rationale: यूनानी में मृत्यु को स्पष्ट लक्ष्य के रूप में रखा गया है; हिन्दी में बिना अतिरिक्त सर्वनाम के ‘मृत्यु’ उसकी तीक्ष्णता बनाए रखता है।
- source_word: τῆς εὐσεβείας
  choice: भक्ति के लिए
  rationale: εὐσέβεια यहाँ परमेश्वर के प्रति श्रद्धापूर्ण और निष्ठावान समर्पण को दर्शाता है; ‘भक्ति’ साधारण पाठक के लिए सहज है और धार्मिक आशय बनाए रखती है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: भक्ति के लिए
  alternative: परमेश्वर के प्रति श्रद्धा के लिए; धर्मनिष्ठा के लिए
  rationale: ‘भक्ति’ धार्मिक समर्पण और श्रद्धा को संक्षेप में व्यक्त करती है, पर किसी बाद की विशिष्ट सांप्रदायिक धारणा को आरोपित नहीं करती।
- issue: मृत्यु की ओर प्रेरित करने की कठोर अभिव्यक्ति
  choice: मृत्यु की ओर बढ़ने को प्रोत्साहित किया
  alternative: मृत्यु के लिए उकसाया
  rationale: προτρέπω प्रोत्साहन/अनुरोध का अर्थ देता है; ‘उकसाया’ अनावश्यक रूप से नकारात्मक नैतिक मूल्यांकन जोड़ सकता है।
