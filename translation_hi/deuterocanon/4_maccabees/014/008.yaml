    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह पिछले वर्णन से जुड़कर उनके आचरण की रीति और उसके परिणाम को बताता है।
- source_word: περὶ τὴν ἑβδομάδα
  choice: सातों के चारों ओर
  rationale: ἑβδομάς यहाँ सात व्यक्तियों के समूह को सूचित करता है। ‘सातों’ सामूहिक व्यक्तिगत संदर्भ को संक्षेप में रखता है और ‘चारों ओर’ περί का स्थान-संबंध व्यक्त करता है।
- source_word: χορεύοντες
  choice: नृत्य करते हुए
  rationale: यह शब्द सामूहिक अथवा वृत्ताकार नृत्य की छवि जगाता है; ‘नृत्य’ गरिमापूर्ण और स्पष्ट है, जबकि वृत्ताकार गति अगले क्रियापद में व्यक्त होती है।
- source_word: οἱ μεῖρακες
  choice: वे युवक
  rationale: यह युवा पुरुषों को सूचित करता है; ‘युवक’ आधुनिक हिन्दी में स्वाभाविक, लिंग-सटीक और प्रसंग के अनुरूप गरिमापूर्ण है।
- source_word: ἐκύκλουν
  choice: चक्कर लगाते रहे
  rationale: अपूर्ण भूतकाल लगातार या बार-बार होने वाली गोलाकार गति दर्शाता है; यह हिन्दी रूप उस जारी गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν βασάνων φόβον
  choice: यातनाओं का भय
  rationale: βάσανοι यहाँ दी जाने वाली शारीरिक यातनाएँ हैं; यह अनुवाद संबंधकारक रचना को सीधे और स्पष्ट रूप में रखता है।
- source_word: καταλύοντες
  choice: मिटाते गए
  rationale: क्रिया भय को ढहा देने अथवा निष्प्रभावी कर देने का भाव देती है। ‘मिटाते गए’ निर्णायक प्रभाव के साथ जारी प्रक्रिया को भी व्यक्त करता है।
theological_decisions:
- issue: ἑβδομάδα का संदर्भ
  choice: सात व्यक्तियों, अर्थात सात भाइयों, का सामूहिक उल्लेख
  alternative: सप्ताह
  rationale: शहादत के इस कथात्मक प्रसंग में ἑβδομάς कैलेंडर के सप्ताह के बजाय सात भाइयों के समूह को सूचित करता है। मुख्य पाठ में ‘सातों’ मूल की संक्षिप्तता बनाए रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। ‘नृत्य करते हुए’ और ‘चक्कर लगाते रहे’ मूल के दो अलग गतिसूचक पदों को बनाए रखते हैं; ‘मिटाते गए’ दोनों जारी क्रियाओं के समानांतर प्रभाव को व्यक्त करता है।
