translation:
  language: hi
  text: इस प्रकार वे युवक सातों[a] के चारों ओर नृत्य करते हुए चक्कर लगाते रहे और यातनाओं का भय मिटाते गए।
  philosophy: optimal-equivalence
  footnotes:
