- source_word: θλῖψιν
  choice: कष्ट
  rationale: यह शब्द उन जवानों की कठोर पीड़ा और विपत्ति को समेटता है। ‘कष्ट’ सहज आधुनिक हिन्दी है और किसी बाद की तकनीकी धर्मवैज्ञानिक धारणा को नहीं जोड़ता।
- source_word: νεανιῶν
