- source_word: φρίττομεν
  choice: सिहर उठते हैं
  rationale: यह भय और वीभत्सता से होने वाली तीव्र शारीरिक प्रतिक्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁρῶντες
  choice: अपनी आँखों से देख रहे थे
  rationale: ‘सुनने’ के साथ मूल के विरोध को स्पष्ट रखता है और प्रत्यक्ष साक्षी होने पर बल देता है।
- source_word: παραχρῆμα
  choice: उसी समय कहे गए
  rationale: यह धमकी के तत्काल, मौके पर दिए जाने का कालगत भाव व्यक्त करता है।
- source_word: ἀπειλῆς λόγον
  choice: धमकी के शब्द
  rationale: λόγον के वाणी/कथन संबंधी भाव और ἀπειλῆς के धमकी संबंधी अर्थ, दोनों को बनाए रखता है।
- source_word: πάσχοντες
  choice: उसे सह भी रहे थे
  rationale: 'यह क्रम के चरम बिंदु को स्पष्ट करता है: उन्होंने केवल देखा और सुना नहीं, बल्कि स्वयं उस कष्ट से गुजरे।'
