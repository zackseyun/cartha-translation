  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who, through seven pregnancies, had her affection for them deeply planted within her;
translation:
  language: hi
  text: परन्तु सभी माताओं में सातों की माता अपनी संतानों से सबसे अधिक प्रेम करनेवाली[a] बनी—वही, जिसके भीतर सात गर्भधारणों के द्वारा उनके प्रति स्नेह गहराई से रोपा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी संतानों से अधिक प्रेम करनेवाली।’ यूनानी में यहाँ तुलनात्मक रूप है; पर ‘सभी माताओं में’ के संदर्भ में उसका अर्थ सबसे बढ़कर मातृ-स्नेह रखनेवाली होने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πασῶν δὲ τῶν μητέρων
  choice: परन्तु सभी माताओं में
  rationale: संबंधकारक पदबंध का भाव तुलना के समूह, अर्थात् ‘सभी माताओं में’, का है। δέ को प्रसंग के हल्के विरोध अथवा संक्रमण के रूप में ‘परन्तु’ से व्यक्त किया गया है।
- source_word: ἐγένετο
  choice: बनी
  rationale: यह क्रिया केवल ‘थी’ नहीं, बल्कि बनने या सिद्ध होने का भाव रखती है; इसलिए ‘बनी’ उसके क्रियात्मक बल को बनाए रखता है।
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: सातों की माता
  rationale: यूनानी में शाब्दिक रूप से ‘सातों की माता’ है; इस उपवाक्य में ‘पुत्रों’ शब्द जोड़ना आवश्यक नहीं है।
- source_word: φιλοτεκνοτέρα
  choice: अपनी संतानों से सबसे अधिक प्रेम करनेवाली
  rationale: यह तुलनात्मक रूप है, पर ‘सभी माताओं में’ के साथ हिन्दी में श्रेष्ठतावाचक अभिव्यक्ति स्वाभाविक है। ‘संतानों’ बहुवचन उसके सात बच्चों के संदर्भ को स्पष्ट और सहज बनाता है।
- source_word: ἥτις
  choice: वही, जिसके
  rationale: संबंधवाचक सर्वनाम यहाँ केवल पहचान नहीं कराता, बल्कि उसके असाधारण संतान-प्रेम की व्याख्या आगे बढ़ाता है।
- source_word: ἑπτὰ κυοφορίας
  choice: सात गर्भधारणों के द्वारा
  rationale: κυοφορία गर्भावस्था अथवा गर्भ धारण किए रहने की अवधि को सूचित करता है। यह अनुवाद मातृत्व के शारीरिक अनुभव और साधनात्मक संबंध दोनों को बनाए रखता है।
- source_word: τὴν πρὸς αὐτοὺς ... φιλοστοργίαν
  choice: उनके प्रति स्नेह
  rationale: φιλοστοργία परिवार के सदस्यों के प्रति कोमल, स्वाभाविक लगाव है। ‘स्नेह’ प्रसंग में यह भाव देता है, बिना यूनानी में अनुपस्थित ‘मातृ’ विशेषण जोड़े।
- source_word: ἐπιφυτευομένην
  choice: गहराई से रोपा गया था
  rationale: यह शब्द रोपे या भीतर स्थापित किए जाने का रूपक रखता है। सहज हिन्दी के लिए निहित क्रिया को पूरा करते हुए ‘था’ लगाया गया है।
