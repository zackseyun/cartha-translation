  text: O reason[b][a], tyrant over the passions of children! And godliness is to a mother more longed for than children.
translation:
  language: hi
  text: हे विवेक, संतान के मनोवेगों के निरंकुश शासक! और ईश्वर-भक्ति माता को संतान से भी अधिक प्रिय है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμέ
  choice: विवेक
  rationale: इस पुस्तक में λογισμός उस विवेकपूर्ण बुद्धि या निर्णय-शक्ति को दर्शाता है जो मनोवेगों को वश में रखती है। ‘विवेक’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और दार्शनिक संदर्भ के अनुकूल है।
- source_word: τέκνων παθῶν
  choice: संतान के प्रति मनोवेगों
  rationale: संदर्भ माता के अपनी संतान के प्रति गहरे भावों का है; यूनानी संबंधकारक τέκνων को παθῶν का विषय अथवा लक्ष्य, दोनों समझा जा सकता है। मुख्य पाठ में प्रसंगानुकूल लक्ष्य-संबंध लिया गया है और दूसरा संभव अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: παθῶν
  choice: मनोवेगों
  rationale: πάθη यहाँ केवल दुःख नहीं, बल्कि वे प्रबल भावनात्मक आवेग हैं जिन पर विवेक शासन करता है। ‘मनोवेग’ इस दार्शनिक-नैतिक अर्थ को स्पष्ट करता है।
- source_word: τύραννε
  choice: निरंकुश शासन करनेवाले
  rationale: τύραννος की प्रबल रूपकात्मक छवि बनाए रखने के लिए केवल ‘स्वामी’ के बजाय कठोर और पूर्ण नियंत्रण व्यक्त करने वाला यह पद चुना गया है।
- source_word: εὐσέβεια
  choice: ईश्वर-भक्ति
  rationale: εὐσέβεια यहाँ सामान्य धार्मिकता नहीं, परमेश्वर के प्रति भक्तिपूर्ण निष्ठा है। ‘ईश्वर-भक्ति’ आधुनिक पाठक के लिए स्पष्ट है और बाद की किसी विशिष्ट पारिभाषिक धारणा को आरोपित नहीं करती।
- source_word: μητρί
  choice: माता के लिए
  rationale: संबंधसूचक संप्रदान कारक को स्वाभाविक हिन्दी में ‘माता के लिए’ से व्यक्त किया गया है।
- source_word: ποθεινοτέρα
  choice: अधिक अभिलषित
  rationale: ποθεινός तीव्र चाह या लालसा का भाव रखता है। ‘अधिक अभिलषित’ तुलनात्मक अर्थ और भावनात्मक बल दोनों को बनाए रखता है।
theological_decisions:
- issue: εὐσέβεια का ईश्वर-संबंधी आशय
  choice: ईश्वर-भक्ति
  alternative: भक्ति; धर्मपरायणता
  rationale: शहीदी के प्रसंग में यह शब्द परमेश्वर के प्रति ऐसी निष्ठा दर्शाता है जो मातृ-स्नेह से भी बढ़कर है। ‘ईश्वर-भक्ति’ उस दिशा को स्पष्ट करता है, पर किसी संप्रदायगत अवधारणा को नहीं जोड़ता।
- issue: पद को कथन मानना या दो संबोधनों वाला विस्मयादिबोधक वाक्य
  choice: दो संबोधनों वाला विस्मयादिबोधक वाक्य
  alternative: ‘और ईश्वर-भक्ति माता के लिए उसकी संतान से अधिक अभिलषित है।’
  rationale: आरंभिक Ὦ और समानांतर संज्ञात्मक रचना के कारण εὐσέβεια को भी संबोधन के रूप में पढ़ना स्वाभाविक है। फिर भी यूनानी में क्रिया का लोप होने के कारण कथनात्मक पाठ संभव है; इसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘हे’ और विस्मयादिबोधक चिह्न मूल के अलंकारिक उद्गार को बनाए रखते हैं; ‘मनोवेग’ और ‘अभिलषित’ दार्शनिक तथा भावात्मक बल के कारण चुने गए अपेक्षाकृत साहित्यिक, पर प्रचलित शब्द हैं।
