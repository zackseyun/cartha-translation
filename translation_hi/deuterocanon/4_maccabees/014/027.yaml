  yaml_path: translation/deuterocanon/4_maccabees/014/027.yaml
  text: and[a], though she was compelled to feel sympathy for them because of the many pains each one of them suffered[b], because of fear toward God she overlooked the temporary preservation of her children.
translation:
  language: hi
  text: और यद्यपि उनमें से हर एक की अनेक पीड़ाओं के कारण वह उनके प्रति सहानुभूति रखने को विवश थी, फिर भी परमेश्वर के भय[a] के कारण उसने अपने बच्चों की अस्थायी रक्षा[b] की उपेक्षा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर का भय’ का अर्थ परमेश्वर के प्रति श्रद्धा या विस्मय भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अस्थायी सुरक्षा’ अथवा ‘क्षणिक बचाव।’ यूनानी यहाँ तत्काल बचाए जाने या जीवित रहने की बात करता है; इसका अर्थ अनिवार्य रूप से धार्मिक अर्थ में ‘उद्धार’ नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠδῖνας
  choice: पीड़ाओं
  rationale: यह शब्द तीव्र वेदना या पीड़ा को व्यक्त करता है। शहादत के इस प्रसंग में ‘पीड़ाओं’ प्रत्येक पुत्र की शारीरिक यातना को स्वाभाविक हिंदी में व्यक्त करता है, बिना प्रसव-वेदना का अनावश्यक विशिष्ट बिंब जोड़े।
- source_word: συμπάθειαν
  choice: सहानुभूति
  rationale: यह शब्द दूसरे के दुःख में सहभागी भाव को दर्शाता है। ‘सहानुभूति’ माँ के अपने पुत्रों की पीड़ा से भावनात्मक रूप से जुड़ने का अर्थ सुरक्षित रखता है।
- source_word: ἠναγκασμένην ... ἔχειν
  choice: रखने को विवश होने
  rationale: यूनानी रचना बताती है कि अपने बच्चों की पीड़ाओं के कारण माँ का सहानुभूति अनुभव करना अवश्यंभावी था। यह हिंदी प्रयोग उस बाध्यकारी भाव को स्पष्ट रखता है।
- source_word: ὑπερείδειν
  choice: उपेक्षा की
  rationale: क्रिया का भाव किसी बात को एक उच्चतर निष्ठा के कारण पीछे रखना या उस पर ध्यान न देना है। ‘उपेक्षा की’ स्रोत की कठोर नैतिक विडंबना बनाए रखता है, जबकि पूर्ववर्ती सहानुभूति स्पष्ट करती है कि यह प्रेम के अभाव का संकेत नहीं है।
- source_word: πρόσκαιρον σωτηρίαν
  choice: अस्थायी रक्षा
  rationale: σωτηρία बचाव, रक्षा या उद्धार का अर्थ दे सकता है; πρόσκαιρον इसे सीमित अवधि का बताता है। यहाँ संदर्भ यातना से तत्काल शारीरिक बचाव का है, इसलिए ‘अस्थायी रक्षा’ आध्यात्मिक उद्धार का अनावश्यक अर्थ आरोपित नहीं करता।
- source_word: φόβον
  choice: भय
  rationale: यूनानी में सीधे ‘भय’ है। परमेश्वर के संदर्भ में इसमें श्रद्धा और विस्मय का भाव भी हो सकता है, पर ‘भय’ मूल पाठ की धार्मिक और नैतिक तीव्रता को बनाए रखता है।
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: उनमें से हर एक
  rationale: यह पदबंध पुत्रों की पीड़ा को सामूहिक रूप से नहीं, बल्कि प्रत्येक की अलग-अलग पीड़ा के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: शहादत के प्रसंग में σωτηρία का अर्थ
  choice: शारीरिक रक्षा या बचाव
  alternative: आध्यात्मिक उद्धार
  rationale: तात्कालिक प्रसंग बच्चों को यातना और मृत्यु से बचाने का है। ‘अस्थायी रक्षा’ इसी अर्थ को व्यक्त करता है और पद में निहित न होने वाला उद्धार-सिद्धांत आरोपित नहीं करता।
- issue: φόβος θεοῦ का बल
  choice: परमेश्वर का भय, जिसमें श्रद्धा का भाव निहित हो सकता है
  alternative: परमेश्वर के प्रति श्रद्धा या विस्मय
  rationale: ‘भय’ यूनानी शब्द के सीधे अर्थ और मातृ-सहानुभूति तथा परमेश्वर-निष्ठा के बीच के धार्मिक तनाव को सुरक्षित रखता है; संभावित श्रद्धापूर्ण अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। वाक्य का आरंभ ‘और’ से किया गया है क्योंकि यूनानी καί इसे पूर्ववर्ती कथन से जोड़ता है। मातृ-सहानुभूति और परमेश्वर के भय के कारण बच्चों की तात्कालिक रक्षा को पीछे रखने के बीच मूल पाठ का तनाव जानबूझकर बनाए रखा गया है।
