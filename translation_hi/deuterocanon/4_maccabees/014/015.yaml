  text: For even among birds[a], some, making their nests on houses, protect their young.
translation:
  language: hi
  text: क्योंकि पक्षियों में भी कुछ पालतू पक्षी[a] घरों की छतों पर घोंसले बनाकर अपने बच्चों की रक्षा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो पालतू होते हैं, वे घरों की छतों में घोंसले बनाकर अपने चूजों की रक्षा करते हैं।”
    reason: ἥμερα और छत से संबंधित ὀροφοποιοῦντα κατὰ τὰς οἰκίας को अधिक शाब्दिक ढंग से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: πετεινῶν
  choice: पक्षियों
  rationale: यह शब्द उड़नेवाले जीवों के व्यापक वर्ग को दर्शाता है; प्रसंग में स्वाभाविक और पर्याप्त रूप से सटीक हिन्दी शब्द ‘पक्षी’ है।
- source_word: ἥμερα
  choice: कुछ पालतू पक्षी
  rationale: ἥμερα का मूल अर्थ ‘पालतू’ या ‘मनुष्य के पास रहनेवाले’ है। τὰ μὲν के साथ यह पक्षियों के एक वर्ग की ओर संकेत करता है, इसलिए ‘कुछ पालतू पक्षी’ अर्थ और विभेद दोनों को सुरक्षित रखता है।
- source_word: κατὰ τὰς οἰκίας
  choice: घरों की छतों पर
  rationale: ὀροφοποιοῦντα के साथ यह घरों से संबंधित छत के स्थान को बताता है। ‘छतों पर’ सहज हिन्दी है, यद्यपि यूनानी वाक्यांश छतों के भीतर या आसपास का स्थान भी सूचित कर सकता है।
- source_word: ὀροφοποιοῦντα
  choice: घोंसले बनाकर
  rationale: यौगिक क्रिया छत से जुड़ी बसाहट या निर्माण को दर्शाती है। पक्षियों के प्रसंग में इसका स्वाभाविक आशय घोंसला बनाना है।
- source_word: προασπίζει
  choice: रक्षा करते हैं
  rationale: क्रिया का अर्थ आगे खड़े होकर बचाना या सुरक्षा देना है। ‘रक्षा करते हैं’ इसके सक्रिय सुरक्षात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: νεοττῶν
  choice: अपने बच्चों
  rationale: यह पक्षियों के नवजात या छोटे बच्चों को दर्शाता है। ‘अपने बच्चों’ सामान्य पाठक के लिए स्वाभाविक है और ‘चूजों’ की अपेक्षा व्यापकता बनाए रखता है।
