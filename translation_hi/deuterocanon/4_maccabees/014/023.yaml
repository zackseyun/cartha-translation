  text: He loved piety more[b][a], the piety that saves unto eternal life according to God.
translation:
  language: hi
  text: उसने भक्ति[a] को अधिक प्रेम किया—उस भक्ति को, जो परमेश्वर के अनुसार[b] अनन्त जीवन के लिए उद्धार करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ईश्वरपरायणता’ (εὐσέβεια)।
    reason: lexical_alternative
  - marker: b
    text: ‘परमेश्वर के अनुसार’ का अर्थ ‘परमेश्वर की इच्छा के अनुसार’ या ‘परमेश्वर की दृष्टि में’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उससे प्रकट होने वाले आचरण, दोनों को व्यक्त करता है। ‘भक्ति’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है; ‘ईश्वरपरायणता’ एक सम्भव विकल्प है।
- source_word: μᾶλλον
  choice: और भी अधिक
  rationale: यह तुलनात्मक प्राथमिकता व्यक्त करता है। प्रसंग में तुलना निहित है, इसलिए यह रूप यूनानी के बल को बनाए रखता है।
- source_word: ἠγάπησεν
  choice: प्रेम किया
  rationale: ἀγαπάω का सीधा अर्थ ‘प्रेम करना’ है। प्राथमिकता का भाव μᾶλλον से आ जाता है, इसलिए इसे अलग से ‘चुना’ या ‘प्रधान माना’ नहीं बनाया गया।
- source_word: τὴν σώζουσαν
  choice: उस भक्ति से, जो ... उद्धार करती है
  rationale: संज्ञा के साथ लगे निश्चित गुणवाचक कृदन्त को स्पष्ट करने के लिए ‘भक्ति’ दोहराई गई है और उसके उद्धारकारी कार्य को क्रियात्मक रूप में रखा गया है।
- source_word: εἰς αἰώνιον ζωὴν
  choice: अनन्त जीवन के लिए
  rationale: εἰς यहाँ लक्ष्य या परिणाम सूचित करता है। ‘के लिए’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस लक्ष्यगत अर्थ को सुरक्षित रखता है।
- source_word: κατὰ θεόν
  choice: परमेश्वर के अनुसार
  rationale: यूनानी पदबंध संक्षिप्त और अर्थ की दृष्टि से खुला है। निकटस्थ अनुवाद परमेश्वर की इच्छा, मानक या न्याय—इन सम्भावनाओं में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: κατὰ θεόν का सम्बन्ध भक्ति के स्वरूप या उसके अनन्त जीवन के लिए उद्धार करने से
  choice: परमेश्वर के अनुसार
  alternative: परमेश्वर की इच्छा के अनुसार; परमेश्वर की दृष्टि में
  rationale: यूनानी वाक्यांश यह स्पष्ट नहीं करता कि वह भक्ति के स्वरूप को विशेषित करता है या उसके उद्धारकारी लक्ष्य/परिणाम को। अपेक्षाकृत शाब्दिक रूप इस धार्मिक और वाक्यगत अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘उद्धार करती है’ धार्मिक प्रसंग में σώζουσαν का सटीक और परिचित रूप है। मूल यूनानी में कर्ता का सर्वनाम नहीं है; हिन्दी में ‘उसने’ लिंग को स्पष्ट किए बिना प्रसंगगत कर्ता को बनाए रखता है।
