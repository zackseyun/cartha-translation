  text: Six young men have overthrown your tyranny.
translation:
  language: hi
  text: हम छह युवकों ने तेरी तानाशाही को धराशायी कर दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἓξ
  choice: छह
  rationale: यह कर्ता की संख्या बताने वाली सीधी-सादी गणनावाचक संख्या है।
- source_word: μειράκια
  choice: युवकों
  rationale: यह शब्द वक्ता और उसके भाइयों को कम आयु के पुरुषों के रूप में प्रस्तुत करता है। ‘युवकों’ उनकी युवा अवस्था के साथ उनकी नैतिक जिम्मेदारी भी बनाए रखता है; ‘लड़कों’ से वे अनावश्यक रूप से बालक प्रतीत हो सकते हैं।
- source_word: κατελύσαμέν
  choice: धराशायी कर दिया है
  rationale: καταλύω यहाँ किसी सत्ता को गिरा देने या निष्प्रभावी कर देने के अर्थ में है। यह प्रयोग दमनकारी शासन पर उनकी निर्णायक नैतिक विजय की प्रबल अलंकारिक घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σου
  choice: तेरी
  rationale: यह एकवचन द्वितीय पुरुष का संबंधसूचक रूप है। अत्याचारी को सीधे और चुनौतीपूर्ण संबोधन के कारण ‘तेरी’ उपयुक्त है।
- source_word: τὴν τυραννίδα
  choice: तानाशाही
  rationale: τυραννίς अत्याचारी सत्ता या दमनकारी शासन को दर्शाता है। ‘तानाशाही’ आधुनिक हिन्दी में सीधा, सुबोध और प्रसंगानुकूल शब्द है।
theological_decisions:
- issue: सताने वाले शासक को चुनौती देते समय यूनानी भूतकालिक क्रिया का बल
  choice: ‘धराशायी कर दिया है’—पूर्ण कार्य के वर्तमान परिणाम को व्यक्त करने वाला रूप
  alternative: ‘धराशायी कर दिया’ अथवा ‘अंत कर दिया है’
  rationale: यूनानी एओरिस्ट कार्य को पूर्ण बताता है। इस अलंकारिक प्रसंग में हिन्दी का पूर्णतासूचक रूप यह दावा बनाए रखता है कि छह शहीदों की अटलता ने अत्याचारी की सत्ता को नैतिक अर्थ में पहले ही परास्त कर दिया है; इसे वास्तविक राजनीतिक सत्ता-परिवर्तन के रूप में सीमित या विस्तृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त, गरिमापूर्ण और चुनौतीपूर्ण है। ‘हम छह युवकों’ से यूनानी पदक्रम का बल स्वाभाविक हिन्दी में बना रहता है। एकवचन प्रत्यक्ष संबोधन में ‘तेरी’ जानबूझकर रखा गया है, क्योंकि वक्ता अत्याचारी को निर्भीकता से ललकार रहा है।
