translation:
  language: hi
  text: इसलिए यदि तुम्हें उन लोगों को यातना देना उचित लगता है जिन्होंने अशुद्ध करने वाला भोजन नहीं खाया है,[a] तो हमें यातना दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक अर्थ लगभग ‘जिन्होंने अशुद्धता नहीं खाई है’ है; प्रसंग में आशय अशुद्ध करने वाले भोजन को खाने से इनकार करने वालों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστʼ
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाला निष्कर्ष व्यक्त करता है; ‘इसलिए’ उसके तार्किक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰ σοὶ δοκεῖ
  choice: यदि तुम्हें … उचित लगता है
  rationale: δοκεῖ के साथ सम्प्रदान कारक यहाँ किसी को कुछ उचित या अच्छा लगने का भाव देता है; यह राजा को दी गई औपचारिक चुनौती को बनाए रखता है।
- source_word: βασανίζειν / βασάνιζε
  choice: यातना देना / यातना दो
  rationale: शहादत और दंड के इस प्रसंग में क्रिया शारीरिक उत्पीड़न को बताती है। एक ही हिन्दी पद की पुनरावृत्ति यूनानी की आलंकारिक दृढ़ता को सुरक्षित रखती है।
- source_word: μὴ μεμοφαγοῦντας
  choice: जिन्होंने अशुद्ध करने वाला भोजन नहीं खाया है
  rationale: यह रूप उन लोगों की ओर संकेत करता है जिन्होंने अशुद्धता लाने वाली निषिद्ध वस्तु खाने से इनकार किया है। प्रसंग से निहित ‘भोजन’ को स्पष्ट किया गया है, जबकि पूर्ण कृदन्त का पूर्ववर्ती परिणाम ‘नहीं खाया है’ में बना रहता है।
- source_word: βασάνιζε
  choice: हमें यातना दो
  rationale: यूनानी में कर्म व्यक्त नहीं है, पर वक्ता और उसके साथियों की चुनौती से ‘हमें’ स्पष्ट रूप से निहित है; इसे जोड़ने से हिन्दी स्वाभाविक और कथन स्पष्ट होता है।
theological_decisions:
- issue: μὴ μεμοφαγοῦντας में खाने की वस्तु को निहित रहने देना या स्पष्ट करना
  choice: ‘अशुद्ध करने वाला भोजन’ के रूप में स्पष्ट किया
  alternative: ‘जिन्होंने अशुद्धता नहीं खाई है’ अथवा केवल ‘जिन्होंने नहीं खाया है’
  rationale: यूनानी अभिव्यक्ति संक्षिप्त और असामान्य है, पर निकटवर्ती प्रसंग निषिद्ध, अशुद्ध करने वाले भोजन से इनकार को स्पष्ट करता है। हिन्दी में ‘भोजन’ जोड़ना अर्थ को स्वाभाविक बनाता है; पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
- issue: अंतिम आज्ञार्थक क्रिया के अव्यक्त कर्म को स्पष्ट करना
  choice: ‘हमें यातना दो’
  alternative: ‘यातना दो’
  rationale: मूल में कर्म अव्यक्त है, किंतु वक्ता की चुनौती में वह प्रसंगतः स्पष्ट है। हिन्दी में ‘हमें’ जोड़ने से लक्षित व्यक्ति स्पष्ट होता है, बिना कोई नया धर्मवैज्ञानिक दावा जोड़े।
- issue: भोजन को स्वयं अशुद्ध कहना या अशुद्ध करने वाला कहना
  choice: ‘अशुद्ध करने वाला भोजन’
  alternative: ‘अशुद्ध भोजन’
  rationale: यह चयन उस भोजन के अपवित्र करने वाले प्रभाव को व्यक्त करता है और यह अनावश्यक रूप से तय नहीं करता कि उसकी अशुद्धता को किस धर्मवैज्ञानिक श्रेणी में समझा जाए।
