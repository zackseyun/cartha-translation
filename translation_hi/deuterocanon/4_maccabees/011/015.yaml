translation:
  language: hi
  text: क्योंकि हम उन्हीं बातों के लिए जन्मे और पाले-पोसे गए हैं, इसलिए उसी प्रकार उन्हीं बातों के लिए मरना भी हमारा कर्तव्य है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὰ αὐτά
  choice: उन्हीं बातों के लिए
  rationale: यह व्यापक अभिव्यक्ति दिशा या उद्देश्य बताती है। इसे संकीर्ण करके ‘सिद्धांतों’ या ‘व्यवस्था’ नहीं किया गया, और अगले वाक्यांश की पुनरावृत्ति भी बनाए रखी गई है।
- source_word: γενηθέντες
  choice: जन्मे
  rationale: पारिवारिक और जीवन-वृत्त संबंधी संदर्भ में यह स्वाभाविक रूप से जन्म लेने का बोध कराता है।
- source_word: τραφέντες
  choice: पाले-पोसे गए
  rationale: यह केवल भोजन मिलने के बजाय पालन-पोषण और परवरिश, दोनों का भाव देता है।
- source_word: ὑπὲρ τῶν αὐτῶν
  choice: उन्हीं बातों के लिए
  rationale: यह साझा प्रतिबद्धताओं के लिए या उनके पक्ष में मरने का भाव रखता है; समान हिंदी अभिव्यक्ति यूनानी की जानबूझकर की गई पुनरावृत्ति बचाती है।
- source_word: ἀποθνήσκειν
  choice: मरना
  rationale: क्रिया स्वयं मृत्यु के कारक को स्पष्ट नहीं करती, इसलिए ‘मार डाला जाना’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ी गई।
- source_word: ὀφείλομεν
  choice: हमारा कर्तव्य है
  rationale: यह नैतिक दायित्व का स्वाभाविक और गरिमापूर्ण आधुनिक हिंदी रूप है।
- source_word: ὁμοίως
  choice: उसी प्रकार
  rationale: यह साझा जन्म और पालन-पोषण के अनुरूप साझा मृत्यु के दायित्व की समानता पर बल देता है।
theological_decisions:
- issue: τὰ αὐτά / τῶν αὐτῶν के अस्पष्ट व्यापक संदर्भ को ‘सिद्धांतों,’ ‘उद्देश्यों’ या ‘व्यवस्था’ के रूप में स्पष्ट करना या न करना
  choice: दोनों स्थानों पर व्यापक ‘उन्हीं बातों’ को बनाए रखना
  alternative: ‘उन्हीं सिद्धांतों,’ ‘उन्हीं उद्देश्यों’ या ‘उसी व्यवस्था’ के लिए
  rationale: आसपास के संदर्भ में व्यवस्था और साझा निष्ठाएँ निहित हो सकती हैं, पर इस पद में यूनानी पाठ वस्तु को स्पष्ट नहीं करता। व्यापक शब्दावली मूल की अर्थगत खुलावट और धार्मिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘पाले-पोसे गए’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘उन्हीं बातों’ की पुनरावृत्ति मूल यूनानी की व्यापकता और समानांतर रचना को सुरक्षित रखती है।
