base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/003.yaml
  text: But I came forward of my own accord[a], so that, after killing me also[b], you might incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: hi
  text: पर मैं स्वयं अपनी इच्छा से आगे आया[a], ताकि मुझे भी मार डालने के बाद तुम अपने और अधिक अन्यायों के लिए स्वर्गीय न्याय[b] से दण्ड पाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैं स्वयं अपनी ही पहल पर आगे आया।’
    reason: यूनानी पद वक्ता की स्वैच्छिक व्यक्तिगत पहल पर बल देता है।
  - marker: b
    text: या ‘स्वर्ग का न्याय’ अथवा ‘स्वर्गीय न्यायिक निर्णय।’
    reason: यूनानी δίκη का अर्थ यहाँ न्याय, न्यायिक निर्णय, या दण्ड देने वाली न्याय-व्यवस्था हो सकता है।
lexical_decisions:
- source_word: αὐτὸς δʼ ἀπʼ ἐμαυτοῦ
  choice: पर मैं स्वयं अपनी इच्छा से
  rationale: ‘स्वयं’ और ‘अपनी इच्छा से’ मिलकर वक्ता की व्यक्तिगत पहल तथा स्वेच्छा पर दिए गए यूनानी बल को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: παρῆλθον
  choice: आगे आया
  rationale: सन्दर्भ में वक्ता अत्याचारी के सामने अपने को स्वेच्छा से प्रस्तुत करता है; ‘आगे आया’ इस गति और प्रस्तुति दोनों को व्यक्त करता है।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्यसूचक सम्बन्ध को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κἀμέ
  choice: मुझे भी
  rationale: κἀμέ में निहित योगात्मक अर्थ को सुरक्षित रखता है और वक्ता को पहले मारे गए लोगों में सम्मिलित करता है।
- source_word: κατακτείνας
  choice: मार डालने के बाद
  rationale: एओरिस्ट कृदन्त की क्रिया को मुख्य क्रिया से पहले घटित दिखाता है और हत्या की तीव्रता को बनाए रखता है।
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: और भी अधिक अन्याय के कामों के कारण
  rationale: πλειόνων की तुलनात्मक/अतिरिक्त मात्रा तथा ἀδικημάτων के बहुविध अपराधपूर्ण कामों का भाव सहज हिन्दी में सुरक्षित रहता है।
- source_word: ὀφλήσῃς … τιμωρίαν
  choice: दण्ड के भागी बनो
  rationale: ὀφείλω के दायित्व या देनदारी के भाव को अत्यधिक कृत्रिम ‘दण्ड के ऋणी’ कहे बिना व्यक्त करता है।
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: स्वर्गीय न्याय
  rationale: यह पद दैवी या पारलौकिक प्रतिफलकारी न्याय की ओर संकेत करता है; अनावश्यक रूप से उसका व्यक्तिकरण नहीं करता।
theological_decisions:
- issue: τῇ οὐρανίᾳ δίκῃ का अर्थ
  choice: स्वर्गीय न्याय
  alternative: स्वर्ग का न्याय; स्वर्गीय न्याय-विधान
  rationale: ‘स्वर्गीय न्याय’ दैवी प्रतिफल के भाव को बनाए रखता है, पर यह निर्धारित नहीं करता कि δίκη को व्यक्तिरूप न्याय, न्यायिक निर्णय या न्याय-व्यवस्था समझना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दण्ड के भागी बनो’ न्यायिक दायित्व का भाव देता है, जबकि ‘स्वर्गीय न्याय’ मूल की धर्मवैचारिक व्यापकता और हल्की व्यक्तिकरण-सम्भावना को खुला रखता है।
