translation:
  language: hi
  text: ये बातें कहने के बाद वे उसे पहिए[a] के पास ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात शहादत के इस वृत्तांत में यातना देने के लिए इस्तेमाल किया गया पहिया।
    reason: cultural_note
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पूर्ववर्ती कथनों की ओर संकेत करता है; ‘ये बातें’ उसके बहुवचन अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰπόντα
  choice: कहने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है; ‘कहने के बाद’ इस कालगत संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: παρῆγον
  choice: वे ... ले गए
  rationale: यहाँ क्रिया किसी व्यक्ति को आगे किसी स्थान या साधन तक ले जाने का भाव देती है। हिन्दी में ‘ले गए’ स्वाभाविक है और बलपूर्वक पहुँचाए जाने के प्रसंग के अनुकूल है।
- source_word: ἐπὶ
  choice: के पास
  rationale: गति के साथ ἐπί लक्ष्य की ओर ले जाने को व्यक्त कर सकता है। ‘के पास’ इतना ही कहता है कि उसे यातना-साधन तक ले जाया गया, उस पर रख दिए जाने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: τὸν τροχόν
  choice: पहिए
  rationale: τροχός का मूल अर्थ ‘पहिया’ है। प्रसंग में यह यातना देने का उपकरण है, पर मुख्य पाठ में सामान्य शब्द रखकर उसका सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
