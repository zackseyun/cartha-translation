  yaml_path: translation/deuterocanon/4_maccabees/011/026.yaml
  text: Your fire is cold to us[a], your catapults are painless, and your violence is powerless.
translation:
  language: hi
  text: तेरी आग हमारे लिए ठंडी है, तेरे गुलेल-यंत्र[a] हमें कोई पीड़ा नहीं देते, और तेरी हिंसा शक्तिहीन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे यातना-यंत्र।” यूनानी शब्द καταπέλται का सामान्य अर्थ प्रक्षेपास्त्र फेंकने वाले “गुलेल-यंत्र” हैं, पर इस प्रसंग में इससे यातना देने के यंत्र भी अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πῦρ σου
  choice: तेरी आग
  rationale: मूल के ठोस और सीधे चित्र को बनाए रखता है; वक्ता अत्याचारी को एकवचन में संबोधित कर रहा है।
- source_word: ψυχρὸν ἡμῖν
  choice: हमारे लिए ठंडी है
  rationale: ψυχρόν का मूल अर्थ ‘ठंडी’ है और ἡμῖν संदर्भसूचक संप्रदान है। यह शहादत के प्रसंग की तीखी विरोधाभासी भाषा को नरम किए बिना सुरक्षित रखता है।
- source_word: ἄπονοι
  choice: हमें कोई पीड़ा नहीं देते
  rationale: शाब्दिक अर्थ ‘पीड़ारहित’ है; यंत्रों के साथ स्वाभाविक आधुनिक हिन्दी में क्रियात्मक वाक्यांश अर्थ को अधिक स्पष्टता से व्यक्त करता है।
- source_word: οἱ καταπέλται
  choice: तेरे गुलेल-यंत्र
  rationale: καταπέλται सामान्यतः प्रक्षेपास्त्र फेंकने वाले यंत्रों के लिए आता है। ‘गुलेल-यंत्र’ हिन्दी पाठक को यांत्रिक हथियार का बोध देता है, जबकि पादटिप्पणी प्रसंगगत यातना-यंत्र वाले अर्थ की संभावना सुरक्षित रखती है। यूनानी में यहाँ possessive नहीं है, पर संबोधन और दोनों ओर के σου के कारण हिन्दी में ‘तेरे’ स्वाभाविक समानांतरता देता है।
- source_word: ἀδύνατος
  choice: शक्तिहीन है
  rationale: विशेषण का अर्थ ‘असमर्थ/शक्तिहीन’ है। यह अत्याचारी की हिंसा के निष्फल होने की चुनौतीपूर्ण घोषणा बनाए रखता है।
- source_word: ἡ βία σου
  choice: तेरी हिंसा
  rationale: βία बल, जबरदस्ती या हिंसा का अर्थ दे सकता है। उत्पीड़न के प्रसंग में ‘हिंसा’ नैतिक भार और ठोस आशय दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: शहीदों की वाणी में विरोधाभासी अलंकार
  choice: आग को सीधे ‘ठंडी’ और हिंसा को ‘शक्तिहीन’ कहा गया है।
  alternative: भाव खोलकर कहना कि आग उन्हें ठंडी लगती है और यातनाएँ उन पर प्रभाव नहीं डालतीं।
  rationale: पद तापमान के बारे में तत्त्वमीमांसक दावा नहीं कर रहा, बल्कि अडिग सहनशीलता को चुनौतीपूर्ण विरोधाभास में व्यक्त करता है। सीधा अनुवाद इस तनाव को व्याख्या में विलीन नहीं करता।
- issue: καταπέλται का प्रसंगगत संकेत
  choice: मुख्य पाठ में शाब्दिक हथियार-संबंधी अर्थ ‘गुलेल-यंत्र’ रखा गया है।
  alternative: मुख्य पाठ में ‘यातना-यंत्र’ कहना।
  rationale: शब्द का सामान्य अर्थ यांत्रिक प्रक्षेपास्त्र-यंत्र है, किंतु शहादत के प्रसंग में यातना के उपकरणों का व्यापक संकेत संभव है। मुख्य पाठ और पादटिप्पणी मिलकर वास्तविक अस्पष्टता सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और चुनौतीपूर्ण स्वर रखा गया है। अत्याचारी को एकवचन अनौपचारिक ‘तेरी/तेरे’ संबोधन मूल भाषण की तीक्ष्णता व्यक्त करता है।
