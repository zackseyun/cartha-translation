  text: And after this one had died, the sixth youth was brought forward. When the tyrant asked whether he wanted to be released if he ate, he said,
translation:
  language: hi
  text: उसके भी मर जाने के बाद छठे युवक को आगे लाया गया। जब तानाशाह ने उससे पूछा कि क्या वह खाकर रिहा होना चाहता था, तो उसने कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τελευτήσαντος δὲ καὶ τούτου
  choice: उसके भी मर जाने के बाद
  rationale: यह संबंधवाचक कृदंत पिछले युवक की मृत्यु को अगली घटना से जोड़ता है। καὶ का अर्थ ‘भी’ रखकर यह दिखाया गया है कि वह भी अपने पहले भाइयों की तरह मर गया; ‘शहीद’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
- source_word: ὁ ἕκτος ... μειρακίσκος
  choice: छठे युवक
  rationale: ὁ ἕκτος क्रमसूचक पद है और μειρακίσκος कम आयु के पुरुष को दर्शाता है। ‘युवक’ आधुनिक हिन्दी में स्वाभाविक है और ‘बालक’ की अपेक्षा आयु को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἤγετο
  choice: आगे लाया गया
  rationale: ἄγω का अपूर्णकालिक कर्मवाच्य रूप यहाँ शासक के सामने सार्वजनिक रूप से पेश किए जाने का भाव रखता है; ‘आगे लाया गया’ इस प्रसंग में केवल ‘ले जाया गया’ से अधिक स्पष्ट है।
- source_word: τοῦ τυράννου
  choice: तानाशाह
  rationale: τύραννος शासक के लिए निंदात्मक शब्द है। ‘तानाशाह’ लेखक के नैतिक मूल्यांकन को बचाए रखता है और इसे तटस्थ ‘राजा’ या ‘शासक’ नहीं बनाता।
- source_word: εἰ βούλοιτο
  choice: क्या वह ... चाहता है
  rationale: βούλομαι इच्छा या चाह व्यक्त करता है। प्रश्नवाचक आश्रित वाक्य को सहज आधुनिक हिन्दी में ‘क्या वह ... चाहता है’ कहा गया है।
- source_word: φαγὼν ἀπολύεσθαι
  choice: खाकर रिहा होना
  rationale: खाना रिहाई की शर्त है। इस पद में भोजन की वस्तु नहीं बताई गई, इसलिए प्रसंग से ज्ञात निषिद्ध भोजन को अनुवाद में नहीं जोड़ा गया।
- source_word: ὁ δὲ ἔφη
  choice: उसने कहा,
  rationale: यह अगले पद में आने वाले उत्तर की भूमिका है। अल्पविराम वाक्य को जानबूझकर आगे खुला रखता है।
theological_decisions:
- issue: शासक के लिए τύραννος का नैतिक रूप से आरोपित संबोधन
  choice: तानाशाह
  alternative: राजा / शासक
  rationale: मूल लेखक एंटिओकस का तटस्थ पदनाम नहीं देता, बल्कि उसके शासन का नकारात्मक मूल्यांकन करता है; इसलिए उस तनाव को नरम नहीं किया गया।
- issue: खाए जाने वाले पदार्थ को स्पष्ट करना
  choice: केवल ‘खाकर’
  alternative: ‘निषिद्ध भोजन खाकर’ / ‘बलि का मांस खाकर’
  rationale: इस पद में खाने की वस्तु व्यक्त नहीं है। व्यापक प्रसंग उसे स्पष्ट करता है, पर उसे यहाँ जोड़ना मूल कथन का विस्तार होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-संरचना को स्वाभाविक हिन्दी में बाँटा गया है, जबकि मूल की क्रमिकता, शासक के प्रति निंदात्मक भाषा और अगले पद की ओर खुला उत्तर सुरक्षित हैं।
