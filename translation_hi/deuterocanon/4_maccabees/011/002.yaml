lexical_decisions:
- source_word: Οὐ μέλλω
  choice: मैं ... पीछे हटनेवाला नहीं हूँ
  rationale: μέλλω के साथ क्रियार्थक रूप यहाँ निकट और दृढ़ संकल्प को व्यक्त करता है। यह हिंदी प्रयोग वक्ता की तात्कालिक और अटल प्रतिज्ञा को स्वाभाविक ढंग से सामने लाता है।
- source_word: τύραννε
  choice: हे अत्याचारी
  rationale: संबोधन रूप शासक को सीधे और नैतिक रूप से आरोपित भाषा में पुकारता है। ‘अत्याचारी’ आधुनिक हिंदी में उसके दमनकारी चरित्र और टकरावपूर्ण स्वर दोनों को स्पष्ट करता है।
- source_word: πρὸς τὸν ... βασανισμόν
  choice: यातना सहने से
  rationale: παραιτεῖσθαι के साथ यह वाक्यांश उस यातना से बचने या पीछे हटने का भाव देता है। हिंदी में ‘यातना सहने से पीछे हटना’ संबंध को स्वाभाविक रूप से व्यक्त करता है, बिना यातना के स्वरूप का विस्तार किए।
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: सद्गुण के लिए
  rationale: यहाँ ἀρετή नैतिक उत्कृष्टता और साहसी चरित्र का द्योतक है। ‘सद्गुण’ ग्रंथ के नैतिक-दर्शन संबंधी भाव को साधारण आधुनिक हिंदी में बनाए रखता है।
- source_word: παραιτεῖσθαι
  choice: पीछे हटनेवाला
  rationale: क्रिया का अर्थ अस्वीकार करना या टालना हो सकता है, पर इस यातना-संदर्भ में उससे न घबराने और न हटने का भाव प्रमुख है। ‘पीछे हटना’ इस संदर्भगत अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: दार्शनिक और शहादत-संबंधी संदर्भ में ἀρετή का अर्थ
  choice: सद्गुण
  alternative: उत्कृष्टता
  rationale: 4 मक्काबियों में यह शब्द विवेकपूर्ण भक्ति, नैतिक चरित्र और दुःख में साहस से जुड़ा है। ‘सद्गुण’ इस नैतिक-दर्शन संबंधी अर्थ को संप्रदायगत व्याख्या जोड़े बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सीधा और टकरावपूर्ण संबोधन रखा गया है। वाक्य साधारण पाठक के लिए सहज है, जबकि मूल यूनानी की दृढ़ता और ‘अस्वीकार करने/पीछे हटने’ की अर्थगत गुंजाइश पादटिप्पणी में सुरक्षित है।
