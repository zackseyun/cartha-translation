base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/005.yaml
  text: Or does it not seem evil that we worship the Creator of all things and live according to his virtuous law?[a][b]
translation:
  language: hi
  text: या क्या यह बुरा नहीं लगता कि हम सबके सृष्टिकर्ता की आराधना करते हैं और उसकी उत्तम व्यवस्था के अनुसार जीवन बिताते हैं?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बुरा’ के स्थान पर ‘अनुचित’ या ‘दोषपूर्ण’ भी हो सकता है। यूनानी κακόν नैतिक रूप से बुरे, दोषयोग्य या गलत होने को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसकी उत्तम व्यवस्था’ का अनुवाद ‘उसकी सद्गुणमय व्यवस्था’ या ‘उसकी श्रेष्ठ व्यवस्था’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κακὸν
  choice: बुरा
  rationale: यह शब्द नैतिक रूप से बुरे, दोषपूर्ण या अनुचित होने का भाव रखता है। ‘बुरा’ प्रश्न की नैतिक तीव्रता बनाए रखते हुए सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐ δοκεῖ
  choice: क्या यह ... नहीं लगता
  rationale: δοκέω यहाँ प्रतीत होने या किसी निर्णय में ऐसा लगने का भाव देता है। हिन्दी की यह रचना आलंकारिक प्रश्न को स्वाभाविक रूप से व्यक्त करती है और मूल में अनुपस्थित ‘तुम्हें’ नहीं जोड़ती।
- source_word: τὸν πάντων κτίστην
  choice: सबके सृष्टिकर्ता
  rationale: κτίστης रचनेवाले या सृष्टिकर्ता को और πάντων उसकी सार्वभौमिकता को व्यक्त करता है। ‘सबके सृष्टिकर्ता’ संक्षिप्त, गरिमापूर्ण और व्यापक है।
- source_word: εὐσεβοῦμεν
  choice: आराधना करते हैं
  rationale: यह क्रिया देवता के प्रति श्रद्धा, भक्ति और धार्मिक सम्मान दिखाने को सूचित करती है। यहाँ इसका कर्म ‘सबके सृष्टिकर्ता’ है, इसलिए ‘आराधना’ धार्मिक आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: κατὰ
  choice: के अनुसार
  rationale: यहाँ κατά अनुरूपता या मानक के अनुसार चलने का भाव देता है।
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: उसकी उत्तम व्यवस्था
  rationale: ἔναρετος नैतिक उत्कृष्टता, सद्गुण और श्रेष्ठता का सूचक है। हिन्दी में व्यवस्था को ‘सद्गुणी’ कहना अस्वाभाविक होगा; ‘उत्तम व्यवस्था’ अर्थ और गरिमा दोनों बनाए रखती है।
- source_word: ζῶμεν
  choice: जीवन बिताते हैं
  rationale: यहाँ क्रिया केवल जीवित रहने के बजाय जीवन-आचरण को सूचित करती है; ‘जीवन बिताते हैं’ अगले पदबंध के साथ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के संबंध में εὐσεβοῦμεν का अनुवाद
  choice: आराधना करते हैं
  alternative: श्रद्धा रखते हैं; भक्ति करते हैं
  rationale: कर्म ‘सबके सृष्टिकर्ता’ होने के कारण यहाँ स्पष्ट धार्मिक भक्ति अभिप्रेत है। ‘आराधना’ इस दिशा को बिना अतिरिक्त सांप्रदायिक अर्थ जोड़े व्यक्त करती है।
- issue: ἢ से आरम्भ होने वाले आलंकारिक प्रश्न का बल
  choice: या क्या यह बुरा नहीं लगता कि...
  alternative: या क्या यह अनुचित नहीं लगता कि...
  rationale: आरम्भिक ‘या’ पिछले तर्क से संबंध बनाए रखता है। प्रश्नवाचक रूप मूल की प्रतिरक्षात्मक और आलंकारिक धार को सुरक्षित रखता है।
- issue: νόμος के लिए हिन्दी धार्मिक पद
  choice: व्यवस्था
  alternative: नियम; कानून
  rationale: यहाँ νόμος जीवन के धार्मिक और नैतिक मानक को सूचित करता है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में व्यापक और गरिमापूर्ण है, जबकि ‘कानून’ मुख्यतः नागरिक-विधिक अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हें’ नहीं जोड़ा गया, क्योंकि उसका यूनानी मूल में स्पष्ट प्रतिनिधित्व नहीं है। ‘सबके सृष्टिकर्ता’ πάντων की व्यापकता को संक्षेप में रखता है, और ‘उत्तम व्यवस्था’ ἔναρετος की नैतिक उत्कृष्टता को अस्वाभाविक हिन्दी से बचाते हुए व्यक्त करती है।
