  yaml_path: translation/deuterocanon/4_maccabees/011/023.yaml
  text: By bringing against yourself a great avenger as well[a], you innovator of tortures and enemy of those who are truly reverent.
translation:
  language: hi
  text: तुम अपने ही विरुद्ध एक महान प्रतिशोधकर्ता[a] को भी खड़ा कर रहे हो—हे नई-नई यातनाएँ गढ़ने वाले और जो सचमुच श्रद्धालु हैं उनके शत्रु!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक महान प्रतिशोधी आत्मा’; यूनानी शब्द किसी व्यक्तिगत प्रतिशोधकर्ता या प्रतिशोध लाने वाली शक्ति—दोनों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγαν
  choice: महान
  rationale: यह विशेषण ἀλάστορα की शक्ति और गंभीरता पर बल देता है; ‘महान’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: σοι
  choice: अपने ही विरुद्ध
  rationale: प्रसंग में यह दत्तिव कारक संबोधित अत्याचारी के लिए हानिकारक परिणाम व्यक्त करता है; आत्मवाचक ‘अपने ही’ उस पर स्वयं आनेवाले प्रतिफल को स्पष्ट करता है।
- source_word: προσβαλλὼν
  choice: खड़ा कर रहे हो
  rationale: क्रिया किसी को सामने या विरुद्ध लाने का भाव रखती है। हिन्दी में ‘अपने विरुद्ध ... खड़ा करना’ उस सक्रिय और शत्रुतापूर्ण अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ αὐτὸς
  choice: भी
  rationale: यहाँ योगात्मक बल को संक्षेप में रखा गया है; ‘भी’ निकटवर्ती प्रसंग से जुड़नेवाले परिणाम का संकेत देता है।
- source_word: ἀλάστορα
  choice: प्रतिशोधी
  rationale: यह शब्द व्यक्तिगत प्रतिशोध लेनेवाले अथवा प्रतिशोधकारी अलौकिक शक्ति—दोनों का बोध करा सकता है। मुख्य पाठ में ‘प्रतिशोधी’ व्यक्ति-सूचक अर्थ को बनाए रखता है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: καινοτόμε τῶν βασάνων
  choice: नई-नई यातनाएँ गढ़नेवाले
  rationale: शाब्दिक ‘यातनाओं के नवप्रवर्तक’ हिन्दी में कृत्रिम लगता है। यह रूप अभूतपूर्व यातनाएँ ईजाद करने के आरोप को स्पष्ट, सजीव और समकालीन भाषा में व्यक्त करता है।
- source_word: πολέμιε
  choice: शत्रु
  rationale: संबोधन में सीधी निंदा और व्यक्तिगत विरोध को सहजता से व्यक्त करता है।
- source_word: τῶν ἀληθῶς εὐσεβούντων
  choice: सच्ची श्रद्धा रखनेवालों
  rationale: εὐσεβέω परमेश्वर के प्रति श्रद्धापूर्ण भक्ति या धर्मनिष्ठा का सूचक है। यह रूप धार्मिक दिशा को बनाए रखता है और ἀληθῶς के बल को ‘सच्ची’ से व्यक्त करता है।
theological_decisions:
- issue: εὐσεβούντων में परमेश्वरमुखी श्रद्धा और धर्मनिष्ठ आचरण का संबंध
  choice: सच्ची श्रद्धा रखनेवालों
  alternative: सचमुच भक्तिमान लोगों
  rationale: चुना हुआ रूप परमेश्वर के प्रति श्रद्धा का भाव रखता है, पर किसी बाद की सांप्रदायिक पारिभाषिकता को पाठ में नहीं जोड़ता।
- issue: ἀλάστωρ का व्यक्तिगत या अलौकिक प्रतिशोधकारी अर्थ
  choice: प्रतिशोधी
  alternative: प्रतिशोधी आत्मा
  rationale: यूनानी शब्द की वास्तविक अर्थगत अनिश्चितता को मुख्य पाठ में व्यापक शब्द और पादटिप्पणी में स्पष्ट विकल्प द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और तीखे प्रत्यक्ष संबोधन के अनुरूप रखी गई है। पद मूलतः एक वाक्यांश के रूप में पिछले कथन से जुड़ता है; हिन्दी में विस्मयादिबोधक चिह्न उसके प्रबल धिक्कार-भाव को स्पष्ट करता है।
