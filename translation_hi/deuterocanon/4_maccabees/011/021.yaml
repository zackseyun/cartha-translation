lexical_decisions:
- source_word: ἀνίκητος
  choice: अजेय
  rationale: यह शब्द ऐसी वस्तु को व्यक्त करता है जिसे जीता या परास्त नहीं किया जा सकता। ‘अजेय’ यूनानी विशेषण की विधेयात्मक शक्ति को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह संयोजक आसपास के तर्क के समर्थन में कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट करता है।
- source_word: ὦ τύραννε
  choice: हे अत्याचारी
  rationale: ὦ प्रत्यक्ष संबोधन को चिह्नित करता है, जिसे ‘हे’ सुरक्षित रखता है। τύραννος यहाँ दमनकारी शासक के लिए निंदात्मक संबोधन है; ‘अत्याचारी’ आधुनिक हिन्दी में इसका स्वाभाविक रूप है।
- source_word: ἡ εὐσεβὴς ἐπιστήμη
  choice: परमेश्वर-भक्त समझ
  rationale: εὐσεβής परमेश्वर के प्रति श्रद्धा और भक्ति का भाव रखता है, जबकि ἐπιστήμη ज्ञान, समझ या विवेकपूर्ण बोध को सूचित करता है। ‘परमेश्वर-भक्त समझ’ धार्मिक और बौद्धिक दोनों आयामों को बनाए रखती है।
theological_decisions:
- issue: 4 मक्काबियों में εὐσεβὴς ἐπιστήμη का अनुवाद
  choice: परमेश्वर-भक्त समझ
  alternative: भक्तिपूर्ण विवेक; श्रद्धामय ज्ञान
  rationale: यह पुस्तक परमेश्वर के प्रति श्रद्धा से निर्देशित बुद्धिसंगत समझ की विजय का प्रतिपादन करती है। चुना हुआ रूप इस धार्मिक-बौद्धिक संश्लेषण को किसी बाद की तकनीकी दार्शनिक शब्दावली में सीमित किए बिना व्यक्त करता है; पादटिप्पणी वास्तविक शाब्दिक विस्तार को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘हे’ से यूनानी संबोधन की गंभीरता बनी रहती है; ‘परमेश्वर-भक्त समझ’ असामान्य किंतु बोधगम्य संधिबद्ध पद है, जो मूल की धार्मिक और बौद्धिक अर्थ-छटाओं को एक साथ रखता है।
