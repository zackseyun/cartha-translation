  text: As he was saying such things[a], the bodyguards bound him and dragged him to the wheel.
translation:
  language: hi
  text: जब वह ऐसी बातें कह रहा था, तब अंगरक्षकों ने उसे बाँध लिया और घसीटकर यातना-यंत्र[a] तक ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ ‘प्रक्षेपास्त्र-यंत्र’ हो सकता है; यहाँ इसका अर्थ यातना देने का कोई उपकरण है, जिसे कभी-कभी ‘चक्र’ समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαῦτα
  choice: ऐसी बातें
  rationale: यह नपुंसकलिंग बहुवचन संकेतवाचक शब्द उसकी कही हुई बातों की विषयवस्तु को सामान्य रूप से दर्शाता है; ‘ऐसी बातें’ स्वाभाविक हिन्दी है।
- source_word: λέγοντα
  choice: कह ही रहा था
  rationale: वर्तमान कृदन्त उसी समय जारी भाषण को दर्शाता है; ‘ही’ उसके बोलते रहने के बीच पकड़े जाने पर हल्का बल देता है।
- source_word: δορυφόροι
  choice: अंगरक्षक
  rationale: शाब्दिक अर्थ ‘भाला ढोनेवाले’ है, पर हेलेनिस्टिक प्रयोग में यह प्रायः शासकीय या राजकीय अंगरक्षकों के लिए आता है।
- source_word: δήσαντες
  choice: बाँध लिया
  rationale: अओरिस्ट कृदन्त बताता है कि घसीटने से पहले उन्होंने उसे बाँधा; हिन्दी में संयुक्त क्रिया कार्रवाई की पूर्णता और बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: εἵλκον
  choice: घसीटकर ... ले गए
  rationale: अपूर्ण भूतकाल का यह क्रियापद बलपूर्वक खींचकर ले जाने की कार्रवाई दर्शाता है; यह हिन्दी प्रयोग हिंसा और गमन दोनों स्पष्ट करता है।
- source_word: καταπέλτην
  choice: यातना-यंत्र
  rationale: शब्द सामान्यतः ‘गुलेल/प्रक्षेपास्त्र-यंत्र’ के लिए प्रयुक्त हो सकता है, किंतु यहाँ शहीदी यातना के प्रसंग में किसी यातना-उपकरण का द्योतक है। उपकरण का निश्चित प्रकार अस्पष्ट होने के कारण मुख्य पाठ में व्यापक अर्थ रखा गया है।
theological_decisions:
- issue: यातना के प्रसंग में καταπέλτην का अर्थ
  choice: यातना-यंत्र
  alternative: चक्र; प्रक्षेपास्त्र-यंत्र/गुलेल
  rationale: प्रसंग किसी यातना-उपकरण की ओर संकेत करता है, पर यूनानी शब्द उस उपकरण को निश्चित रूप से ‘चक्र’ नहीं ठहराता। इसलिए मुख्य पाठ वास्तविक शाब्दिक अनिश्चितता बनाए रखता है और पादटिप्पणी अन्य संभावनाएँ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अंगरक्षक’ प्रशासनिक भूमिका को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘यातना-यंत्र’ संदर्भ को स्पष्ट करते हुए उपकरण की वास्तविक पहचान संबंधी अनिश्चितता को सुरक्षित रखता है।
