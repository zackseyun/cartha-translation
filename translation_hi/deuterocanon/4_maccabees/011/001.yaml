- source_word: ἐναπέθανεν
  choice: मर गया
  rationale: क्रिया यातनापूर्ण व्यवहार के बीच या उसके परिणामस्वरूप हुई मृत्यु बताती है; सरल भूतकाल हिन्दी कथा-क्रम में स्वाभाविक है।
- source_word: ὁ πέμπτος
  choice: पाँचवें
  rationale: मूल में क्रमवाचक विशेषण संज्ञा की तरह प्रयुक्त है और संदर्भ से पाँचवाँ भाई अभिप्रेत है।
- source_word: παρεσήμαινεν
  choice: संकेत किया
  rationale: क्रिया का मूल अर्थ संकेत देना या जताना है। संकेत का आशय मूल यूनानी में स्पष्ट नहीं, इसलिए ‘आगे आया’ अथवा ‘तैयारी जताई’ जैसी व्याख्या पाठ में नहीं जोड़ी गई।
- source_word: λέγων
  choice: और कहा
  rationale: हिन्दी में आगामी प्रत्यक्ष कथन का स्वाभाविक परिचय है और यूनानी वर्तमान कृदंत का कथात्मक कार्य सुरक्षित रखता है।
