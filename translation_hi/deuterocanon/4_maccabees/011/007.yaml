translation:
  language: hi
  text: यदि तुम सचमुच मानवीय इच्छाओं की अनुभूति रखते और परमेश्वर की ओर से उद्धार की आशा रखते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴπερ
  choice: यदि सचमुच
  rationale: शर्त के साथ निहित बल ‘यदि वास्तव में’ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠσθάνου
  choice: तुम्हें … बोध होता
  rationale: क्रिया के अनुभव करने, महसूस करने या समझने के अर्थ-क्षेत्र को ‘बोध’ संक्षेप में बनाए रखता है।
- source_word: ἀνθρώπους πόθων
  choice: मानवीय अभिलाषाओं
  rationale: यूनानी पदबंध पाठगत अथवा व्याकरणिक रूप से असामान्य है; प्रसंग और प्रमाणित अंग्रेज़ी परामर्श-पाठ के अनुरूप इसे मानव-संबंधी इच्छाओं के अर्थ में रखा गया है, बिना किसी विशिष्ट प्रकार की इच्छा जोड़ने के।
- source_word: παρὰ θεῷ σωτηρίου
  choice: परमेश्वर से उद्धार पाने की
  rationale: παρά के स्रोत/आश्रय-संबंध और σωτήριον के छुटकारे या उद्धार के भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: σωτηρίου का धार्मिक अर्थ
  choice: उद्धार
  alternative: छुटकारा
  rationale: ‘उद्धार’ परमेश्वर से मिलने वाली मुक्ति का व्यापक अर्थ रखता है, पर पद में उसके स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- issue: παρὰ θεῷ में संबंध
  choice: परमेश्वर से
  alternative: परमेश्वर के पास
  rationale: यहाँ आशा के स्रोत को सामने रखना प्रमाणित अंग्रेज़ी परामर्श-पाठ और यूनानी παρά के सम्भव अर्थ से मेल खाता है; ‘परमेश्वर के पास’ भी व्याकरणतः सम्भव है, पर हिन्दी में कम स्पष्ट है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य की शर्तात्मक, अपूर्ण संरचना को मूल के अनुसार बनाए रखा गया है; सम्भवतः यह आसपास के वाक्य से जुड़ती है।
