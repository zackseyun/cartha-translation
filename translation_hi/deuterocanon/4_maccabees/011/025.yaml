  yaml_path: translation/deuterocanon/4_maccabees/011/025.yaml
  text: For your not being able to persuade our reason[a], nor to compel us to eat defiled food—is that not your defeat?
translation:
  language: hi
  text: क्योंकि तुम न तो हमारी विवेक-बुद्धि को बदल सके, न ही हमें मांस खाने[a] को विवश कर सके—क्या यह तुम्हारी हार नहीं है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् यहूदी व्यवस्था में निषिद्ध मांस का भक्षण। यूनानी शब्द का शाब्दिक अर्थ ‘मांस-भक्षण’ है।
    reason: शाब्दिक अर्थ और कथात्मक प्रसंग दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: μὴ δυνηθῆναί σε
  choice: तुम ... नहीं सके
  rationale: यूनानी पदबंध अक्षमता पर बल देता है। स्वाभाविक हिन्दी में ‘तुम ... नहीं सके’ उसी अर्थ और वक्ता के चुनौतीपूर्ण स्वर को स्पष्ट रखता है।
- source_word: μεταπεῖσαι τὸν λογισμὸν ἡμῶν
  choice: हमारी विवेक-बुद्धि को बदल सके
  rationale: λογισμός इस ग्रंथ में नैतिक विवेक और तर्कपूर्ण निर्णय का प्रमुख शब्द है। ‘विवेक-बुद्धि’ केवल सामान्य ‘मन’ से अधिक सटीक है, जबकि μεταπείθω में किसी के विचार या निश्चय को बदलने के लिए मनाने का भाव है।
- source_word: μήτε βιάσασθαι
  choice: न ही ... विवश कर सके
  rationale: βιάζομαι यहाँ बलपूर्वक बाध्य करने का अर्थ देता है। ‘विवश करना’ आधुनिक, गरिमापूर्ण हिन्दी में इस बलप्रयोग को व्यक्त करता है।
- source_word: πρὸς τὴν μεμοφαγίαν
  choice: मांस खाने
  rationale: दुर्लभ संज्ञा μεμοφαγία का शाब्दिक अर्थ ‘मांस-भक्षण’ है। मुख्य पाठ में सहज ‘मांस खाने’ रखा गया है; प्रसंग में यह व्यवस्था द्वारा निषिद्ध मांस है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: οὐ κατάλυσίς ἐστιν σου;
  choice: क्या यह तुम्हारी हार नहीं है?
  rationale: κατάλυσις का अर्थ विनाश, पराभव या पतन हो सकता है। इस चुनौतीपूर्ण अलंकारिक प्रश्न में ‘हार’ अर्थ को सहज और प्रभावपूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: λογισμός की दार्शनिक और धर्मवैचारिक महत्ता
  choice: विवेक-बुद्धि
  alternative: तर्क-बुद्धि; विवेकपूर्ण निर्णय; दृढ़ निश्चय
  rationale: 4 मक्काबियों में λογισμός भक्तिपूर्ण तर्कशील विवेक का केंद्रीय विचार है। ‘विवेक-बुद्धि’ नैतिक और बौद्धिक दोनों आयाम बचाती है, बिना उसे केवल इच्छाशक्ति या दृढ़ संकल्प बना देने के।
- issue: μεμοφαγία को प्रसंगानुसार कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘मांस खाने’, पादटिप्पणी में निषिद्ध मांस का प्रसंग
  alternative: निषिद्ध मांस खाने; अशुद्ध भोजन खाने
  rationale: यूनानी शब्द स्वयं मांस खाने को कहता है, जबकि कथा का प्रसंग बताता है कि वह यहूदी व्यवस्था में निषिद्ध मांस था। मुख्य पाठ मूल की शब्दगत सीमा रखता है और पादटिप्पणी प्रसंगगत अर्थ देती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। ‘विवेक-बुद्धि’ ग्रंथ के दार्शनिक स्वर को बनाए रखता है; समानांतर ‘न तो ... न ही’ संरचना और अंतिम अलंकारिक प्रश्न वक्ता की निर्भीक चुनौती को सुरक्षित रखते हैं।
