  text: And after heating sharp spits[a], they applied them to his back; and after piercing his sides, they burned his entrails from it.
translation:
  language: hi
  text: और उन्होंने नुकीली सीखों को तपा कर उसकी पीठ से लगाया; फिर उसके पार्श्वों को आर-पार छेदकर, उसकी अंतड़ियों को उससे[a] जलाते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘उससे’ है। इसका संकेत सम्भवतः यह है कि उसके पार्श्व छेदने के बाद आग उसके भीतर के अंगों तक पहुँची; पर वाक्यांश का ठीक स्थानिक सम्बन्ध अस्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀβελίσκους ὀξεῖς
  choice: नुकीली सीखों
  rationale: ὀβελίσκος छोटी धातु की सीख या छड़ है और ὀξύς उसकी नुकीली, भेदने योग्य धार पर बल देता है। ‘नुकीली सीखें’ यातना के उपकरण का रूप सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: πυρώσαντες
  choice: तपा कर
  rationale: यह पूर्वकालिक कृदन्त बताता है कि सीखों को पहले आग में बहुत गरम किया गया था। ‘तपा कर’ इस क्रम और तीव्र ताप दोनों को संक्षेप में व्यक्त करता है।
- source_word: τοῖς νώτοις προσέφερον
  choice: उसकी पीठ पर लगाया
  rationale: προσφέρω यहाँ किसी वस्तु को शरीर के पास लाकर उससे लगाना दर्शाता है। ‘लगाया’ क्रिया को स्पष्ट करती है, पर दबाने जैसी अतिरिक्त धारणा नहीं जोड़ती।
- source_word: τὰ πλευρὰ διαπείραντες
  choice: उसकी बगलें आर-पार छेदकर
  rationale: πλευρά शरीर के पार्श्व या बगलों को और διαπείρω आर-पार भेदने को दर्शाता है। यह अनुवाद शारीरिक स्थान और भेदन की तीव्रता दोनों बनाए रखता है।
- source_word: τὰ σπλάγχνα
  choice: उसकी अंतड़ियाँ
  rationale: इस प्रत्यक्ष शारीरिक संदर्भ में σπλάγχνα भावनाओं का नहीं, भीतर के अंगों का सूचक है। ‘अंतड़ियाँ’ मूल की दृश्य और कठोर शक्ति को बनाए रखता है।
- source_word: διέκαιον
  choice: जलाते रहे
  rationale: अपूर्ण भूतकाल चलती हुई यातना को दर्शाता है; ‘जलाते रहे’ उसकी निरंतरता व्यक्त करता है।
- source_word: ἀπʼ αὐτοῦ
  choice: उसके भीतर से
  rationale: शाब्दिक रूप ‘उससे’ या ‘उसी से’ है। बगलें आर-पार छेदे जाने के बाद अंतड़ियाँ जलाने के संदर्भ में ‘उसके भीतर से’ संभावित स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल की अस्पष्टता सुरक्षित रखती है।
