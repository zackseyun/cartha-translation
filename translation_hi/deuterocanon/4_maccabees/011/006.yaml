lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पहले कथन के साथ विरोध दर्शाने वाला संयोजक है; ‘परन्तु’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक का व्यापक संदर्भ बनाए रखने के लिए ‘ये बातें’ चुना गया है; इससे आशय को अनावश्यक रूप से किसी खास काम या कथन तक सीमित नहीं किया जाता।
- source_word: ὑμῶν
  choice: तुम्हारी ओर से
  rationale: संबंधकारक रूप यहाँ स्रोत अथवा संबंध प्रकट कर सकता है। ‘तुम्हारी ओर से’ प्रसंग में स्वाभाविक है, जबकि मूल की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: βασάνων
  choice: यातनाओं
  rationale: शहादत और शारीरिक पीड़ा के इस प्रसंग में शब्द का अर्थ परीक्षाओं के बजाय ठोस यातनाएँ है; बहुवचन भी सुरक्षित है।
- source_word: ἄξια
  choice: योग्य
  rationale: संबंधकारक के साथ यह योग्यता अथवा पात्रता व्यक्त करता है; ‘के योग्य’ यूनानी रचना के निकट और हिन्दी में बोधगम्य है।
