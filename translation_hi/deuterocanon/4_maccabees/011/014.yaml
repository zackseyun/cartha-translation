translation:
  language: hi
  text: मैं उम्र में अपने भाइयों से छोटा हूँ, पर समझ में उनके बराबर हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλικίᾳ
  choice: उम्र में
  rationale: यहाँ भाइयों के बीच तुलना कालानुक्रमिक आयु की है; इसलिए सहज आधुनिक हिन्दी में ‘उम्र में’ उपयुक्त है।
- source_word: ἀδελφῶν
  choice: अपने भाइयों से
  rationale: कथा-संदर्भ और पुल्लिंग बहुवचन विशेष रूप से वक्ता के भाइयों की ओर संकेत करते हैं। तुलना को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘से’ जोड़ा गया है।
- source_word: νεώτερος
  choice: छोटा
  rationale: उम्र के संदर्भ में ‘छोटा’ आधुनिक हिन्दी में ‘younger’ का स्वाभाविक और स्पष्ट रूप है।
- source_word: διανοίᾳ
  choice: समझ में
  rationale: यह शब्द यहाँ मानसिक समझ या विवेक का बोध कराता है और शारीरिक आयु के साथ अलंकारिक विरोध बनाता है।
- source_word: ἡλικιώτης
  choice: उनके बराबर
  rationale: शाब्दिक रूप से यह समवयस्क या समान स्तर के व्यक्ति को सूचित कर सकता है; यहाँ ‘समझ में’ के क्षेत्र में भाइयों के समान होने का अर्थ है, न कि समान आयु का।
theological_decisions:
- issue: νεώτερος और ἡλικιώτης के विरोध में ἡλικιώτης की व्याख्या
  choice: समझ में भाइयों के बराबर
  alternative: परिपक्वता में उनका समकक्ष / निर्णय-क्षमता में उनके समान
  rationale: पहला खंड स्पष्ट रूप से वक्ता को आयु में छोटा बताता है। इसलिए दूसरे खंड में ἡλικιώτης को शाब्दिक ‘समवयस्क’ कहना विरोधाभास उत्पन्न करेगा; τῇ διανοίᾳ के साथ यह मानसिक या विवेकपूर्ण समानता व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मैं … हूँ, पर … हूँ’ की समानांतर रचना यूनानी वाक्य के μὲν…δὲ विरोध को सहज हिन्दी में सुरक्षित रखती है।
