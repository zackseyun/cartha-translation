- source_word: ἐκσφονδυλιζόμενος
  choice: उसके जोड़ उखाड़े जा रहे थे
  rationale: क्रिया शरीर के जोड़ों अथवा कशेरुकाओं को हिंसापूर्वक विस्थापित करने का अर्थ देती है; यह हिन्दी में स्पष्ट है, पर अंग-भंग की सीमा को यूनानी से अधिक नहीं बढ़ाती।
- source_word: ὑπεκαίετο
  choice: नीचे से उसे जलाया जा रहा था
