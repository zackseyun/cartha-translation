base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/012.yaml
  text: “Good,” said the tyrant[a], though unwillingly, “he grants us favors—good indeed—by giving us the opportunity, through nobler sufferings[b], to display our endurance for our law.”
translation:
  language: hi
  text: “अच्छा,” वह अत्याचारी अनिच्छा से बोला[a], “वह हम पर उपकार कर रहा है—सचमुच अच्छा—हमें और भी उदात्त कष्टों[b] के द्वारा अपनी व्यवस्था के प्रति अपनी अटलता प्रदर्शित करने का अवसर देकर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “अपनी इच्छा के विरुद्ध” भी हो सकता है; वह अत्याचारी यह बात अनिच्छा से स्वीकार करता है।
    reason: lexical_alternative
  - marker: b
    text: 'यह कथन विडंबनापूर्ण है: अत्याचारी के दिए हुए कष्ट शहीदों के लिए अपनी व्यवस्था के प्रति अटलता दिखाने का अवसर बन जाते हैं।'
    reason: cultural_note
lexical_decisions:
- source_word: Καλῶς ... καλῶς
  choice: अच्छा ... सचमुच अच्छा
  rationale: पहला प्रयोग अनुमोदनसूचक उद्गार है और दूसरा उसी का बलपूर्ण पुनरावर्तन। हिन्दी में पुनरावृत्ति रखते हुए दूसरे स्थान पर ‘सचमुच’ जोड़ने से स्वाभाविक जोर बना रहता है।
- source_word: ἄκων
  choice: अनिच्छा से
  rationale: यह वक्ता की अनिच्छुक स्वीकृति को व्यक्त करता है; वाक्यक्रम में इसे ‘बोला’ के साथ रखना हिन्दी में स्वाभाविक है।
- source_word: ὁ τύραννος
  choice: वह अत्याचारी
  rationale: τύραννος का नकारात्मक और नैतिक रूप से आरोपित भाव सुरक्षित रहता है; केवल ‘राजा’ कहना इस भाव को कम कर देता।
- source_word: χάριτας ἡμῖν χαρίζῃ
  choice: वह हम पर उपकार कर रहा है
  rationale: 'सजातीय यूनानी पदों की विडंबना को सहज हिन्दी में व्यक्त करता है: यातना देने वाला अनजाने में मानो उपकार कर रहा है।'
- source_word: διὰ γενναιοτέρων πόνων
  choice: और भी उदात्त कष्टों के द्वारा
  rationale: तुलनात्मक γενναιοτέρων को ‘और भी उदात्त’ और यातनापूर्ण πόνοι को ‘कष्ट’ से व्यक्त किया गया है। ‘उदात्त’ इन कष्टों के नैतिक गौरव को रखता है, न कि उनकी क्रूरता को श्रेष्ठ बताता है।
- source_word: ἐπιδείξασθαι παρέχων
  choice: यह दिखाने का अवसर दे रहा है
  rationale: παρέχων द्वारा अवसर उपलब्ध कराने और ἐπιδείξασθαι द्वारा प्रत्यक्ष रूप से प्रदर्शित करने—दोनों भावों को स्वाभाविक हिन्दी में जोड़ा गया है।
- source_word: τὴν εἰς τὸν νόμον ἡμῶν καρτερίαν
  choice: कि हम अपनी व्यवस्था के प्रति कितने अटल हैं
  rationale: कारτερία का अर्थ यातना के बीच दृढ़ता या धीरज है और εἰς τὸν νόμον व्यवस्था की ओर निष्ठापूर्ण अभिमुखता बताता है। हिन्दी में यह खंड भाव को स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: यहूदी शहादत के प्रसंग में νόμος का अनुवाद
  choice: व्यवस्था
  alternative: कानून
  rationale: यहाँ संदर्भ पैतृक और ईश्वर-प्रदत्त धार्मिक व्यवस्था का है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में इस विशिष्ट अर्थ को व्यक्त करती है, जबकि ‘कानून’ सामान्य नागरिक विधान का आभास दे सकता है।
- issue: पीड़ा को ‘उदात्त’ कहने का आशय
  choice: ‘उदात्त’ को कष्ट सहने की नैतिक गरिमा से संबद्ध रखा गया
  alternative: अधिक कठोर कष्ट
  rationale: γενναιοτέρων तीव्रता मात्र नहीं, बल्कि श्रेष्ठता या कुलीन साहस का भाव देता है। अनुवाद यह दावा नहीं करता कि यातना स्वयं शुभ है; विडंबना यह है कि वही विश्वासयोग्यता दिखाने का अवसर बनती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी की विडंबना, ‘अच्छा’ की पुनरावृत्ति और व्यवस्था के प्रति अटलता का भाव सुरक्षित रखा गया है।
