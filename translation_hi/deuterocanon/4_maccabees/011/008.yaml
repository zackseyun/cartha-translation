lexical_decisions:
- source_word: νῦν
  choice: अब
  rationale: यह वर्तमान आरोप को आरम्भ करने वाला काल-सूचक और संवाद-सूचक शब्द है; ‘अब’ उसके तात्कालिक आलंकारिक बल को बनाए रखता है।
- source_word: ἰδὲ
  choice: देख!
  rationale: यह ध्यान आकर्षित करने वाली आज्ञा है। ‘देख!’ सीधे और टकरावपूर्ण संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀλλότριος ὢν θεοῦ
  choice: परमेश्वर से पराया होकर
  rationale: ἀλλότριος और सम्बन्धकारक θεοῦ परमेश्वर से अलगाव अथवा परायेपन का सम्बन्धात्मक भाव देते हैं। यह अनुवाद उस तीखे भाव को बनाए रखता है, पर उसे किसी बाद की पारिभाषिक धर्मशास्त्रीय श्रेणी में नहीं बदलता।
- source_word: πολεμεῖς
  choice: तू ... युद्ध कर रहा है
  rationale: क्रिया सक्रिय और प्रबल शत्रुता को दर्शाती है। ‘युद्ध कर रहा है’ उसके सामरिक बल को सामान्य ‘लड़ रहा है’ से अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: τοὺς εὐσεβοῦντας
  choice: वे लोग जो ... भक्ति रखते हैं
  rationale: वर्तमान कृदन्त निरन्तर श्रद्धा और धर्मनिष्ठ आचरण करने वालों को दर्शाता है; यह वाक्यांश आधुनिक हिन्दी में सहज है और जारी रहने वाले भाव को बनाए रखता है।
- source_word: εἰς τὸν θεόν
  choice: परमेश्वर के प्रति
  rationale: εὐσεβέω के साथ εἰς भक्ति के लक्ष्य अथवा दिशा को सूचित करता है; ‘के प्रति’ हिन्दी में स्वाभाविक रूप से यही सम्बन्ध व्यक्त करता है।
theological_decisions:
- issue: ἀλλότριος θεοῦ का सम्बन्धात्मक बल
  choice: परमेश्वर से पराया
  alternative: परमेश्वर से दूर हो गया; परमेश्वर का न होकर किसी और का
  rationale: सन्दर्भ में यह जातीय या सामाजिक विदेशीपन नहीं, बल्कि परमेश्वर के सम्बन्ध में अत्याचारी की अलग और विरोधी स्थिति बताता है। ‘पराया’ इस सम्बन्धात्मक और नैतिक तनाव को किसी अतिरिक्त धर्मशास्त्रीय निष्कर्ष के बिना बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रत्यक्ष हिन्दी। एकवचन ‘तू’ मूल यूनानी के तीखे, आमने-सामने के धिक्कार को व्यक्त करता है। विस्मयादिबोधक चिह्न ἰδὲ की ध्यानाकर्षक आज्ञा को स्पष्ट करता है।
