  yaml_path: translation/deuterocanon/4_maccabees/011/004.yaml
  text: O hateful and misanthropic man[b][a], what have we done that you are ravaging us in this way?
translation:
  language: hi
  text: हे घृणित और मनुष्य-द्वेषी व्यक्ति[a], हमने ऐसा क्या किया है कि तू हमें इस तरह तबाह कर रहा है[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘मनुष्यों से घृणा करने वाला’ या ‘मानवजाति का द्वेषी’।
    reason: lexical_alternative
  - marker: b
    text: ‘तबाह कर रहा है’ के लिए प्रयुक्त यूनानी क्रिया का अनुवाद ‘नष्ट कर रहा है’ या ‘उजाड़ रहा है’ भी हो सकता है; यह प्रायः हिंसक विनाश के लिए प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: हे
  rationale: प्रत्यक्ष संबोधन और तीखे प्रतिवाद का स्वर बनाए रखने के लिए स्वाभाविक हिन्दी संबोधन।
- source_word: μισάρετε
  choice: घृणित
  rationale: यह निंदा का प्रबल शब्द है; ‘घृणित’ उसके अपमानजनक भाव को बनाए रखता है और किसी ऐसे विशिष्ट घृणा-विषय को नहीं जोड़ता जो यूनानी रूप में स्पष्ट नहीं है।
- source_word: μισάνθρωπε
  choice: मनुष्य-द्वेषी व्यक्ति
  rationale: यह समास मनुष्यों से घृणा करने वाले को दर्शाता है। यह चयन मूल अर्थ और पिछले निंदात्मक संबोधन के साथ उसकी समानांतरता दोनों को स्पष्ट रखता है।
- source_word: τί δράσαντες
  choice: हमने ऐसा क्या किया है
  rationale: यूनानी कृदंत-रचना पूछती है कि उन्होंने कौन-सा काम किया जिससे ऐसा व्यवहार उचित ठहर सके; वर्तमान हिन्दी में यह उसका स्वाभाविक रूप है।
- source_word: πορθεῖς
  choice: तबाह कर रहा है
  rationale: क्रिया हिंसक विनाश, उजाड़ने या बरबाद करने का भाव देती है। यातना के प्रसंग में ‘तबाह कर रहा है’ इस प्रबल विनाशकारी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦτον ... τὸν τρόπον
  choice: इस तरह
  rationale: यह व्यवहार की रीति की ओर संकेत करने वाला क्रियाविशेषणीय प्रयोग है; ‘इस तरह’ उसके संकेतात्मक बल को सहज हिन्दी में बनाए रखता है।
