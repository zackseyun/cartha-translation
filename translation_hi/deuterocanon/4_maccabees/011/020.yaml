  yaml_path: translation/deuterocanon/4_maccabees/011/020.yaml
  text: But while he was being tortured[a], as one belonging to a holy age, he said, “For the sake of godliness, when so many brothers were called into training in sufferings, we were not conquered.”
translation:
  language: hi
  text: परन्तु जब उसे यातना दी जा रही थी, तब उसने पवित्र जीवन जीनेवाले के रूप में[a] कहा, “ईश्वर-भक्ति के कारण, जब हम इतने सारे भाई कष्ट सहने के प्रशिक्षण के लिए बुलाए गए, तब हम पराजित नहीं हुए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “पवित्रतासंगत आयु/युग का।” यूनानी पदबंध असामान्य है; αἰών का अर्थ जीवनकाल या जीवन-रीति भी हो सकता है। इसलिए इसका अर्थ “पवित्र जीवन-रीति वाला” भी लिया जा सकता है।'
    reason: ἱεροπρεποῦς αἰῶνος की शब्दार्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: βασανιζόμενος
  choice: जब उसे यातना दी जा रही थी
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त चल रही शारीरिक यातना को व्यक्त करता है; शहीदी प्रसंग में केवल मानसिक पीड़ा या सामान्य परीक्षा अभिप्रेत नहीं है।
- source_word: ἱεροπρεποῦς αἰῶνος
  choice: पवित्र जीवन से जुड़ा हुआ व्यक्ति होकर
  rationale: यह असामान्य यूनानी पदबंध पवित्रता के अनुरूप जीवन या अस्तित्व से संबंध सूचित कर सकता है। मुख्य पाठ में अर्थ को सहज रखा गया है, जबकि ‘आयु/युग’ की वास्तविक शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: εὐσέβειαν
  choice: ईश्वर-भक्ति
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा को व्यक्त करता है और 4 मकाबियों में व्यवस्था के प्रति विश्वासयोग्यता से जुड़े प्रमुख भाव को बनाए रखता है।
- source_word: γυμνασίαν πόνων
  choice: दुःखों के प्रशिक्षण
  rationale: γυμνασία के अभ्यास या प्रशिक्षण के रूपक और πόνων की पीड़ा/कष्ट की धारणा, दोनों को बनाए रखा गया है।
- source_word: ἀδελφοὶ
  choice: भाई
  rationale: प्रसंग में ये सचमुच उस शहीद के भाई हैं, कोई मिश्रित सामान्य समूह नहीं।
- source_word: κληθέντες
  choice: बुलाए गए
  rationale: कर्मवाच्य रूप बुलाए या आहूत किए जाने की व्यापक अर्थ-छाया को बनाए रखता है।
- source_word: οὐκ ἐνικήθημεν
  choice: पराजित नहीं हुए
  rationale: νικάω की विजय-पराजय संबंधी भाषा और कर्मवाच्य बल—यातना देनेवाले उन्हें जीत न सके—दोनों स्पष्ट रहते हैं।
theological_decisions:
- issue: ἱεροπρεποῦς αἰῶνος की व्याख्या
  choice: मुख्य पाठ में इसे वक्ता के पवित्र जीवन या अस्तित्व से संबंध के रूप में व्यक्त किया गया है।
  alternative: ‘पवित्र आयु का’ अथवा ‘पवित्र जीवन-क्रम वाला।’
  rationale: αἰών का अर्थ आयु, जीवनकाल या जीवन का ढंग हो सकता है। हिन्दी में ‘पवित्र आयु का’ केवल कालगत आयु का भ्रामक संकेत दे सकता है; इसलिए मुख्य पाठ सम्भावित जीवनगत अर्थ देता है और पाद-टिप्पणी मूल की असामान्यता तथा विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘दुःखों के प्रशिक्षण’ जानबूझकर कुछ असामान्य रखा गया है ताकि मूल का प्रशिक्षण/अभ्यास रूपक न मिटे। पाद-टिप्पणी का चिह्न [a] संबंधित पदबंध के ठीक बाद मुख्य पाठ में दिया गया है।
