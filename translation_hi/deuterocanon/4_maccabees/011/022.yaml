    reason: lexical_alternative
  - marker: b
    text: या ‘अपने भाइयों के साथ लिटाया जाऊँगा’; यूनानी कर्मवाच्य क्रिया का अधिक सामान्य अर्थ ‘रखा जाऊँगा’ भी हो सकता है, पर यहाँ सम्भवतः आशय मृत्यु में उनके साथ सम्मिलित होने से है।
