lexical_decisions:
- source_word: καλοκαγαθίᾳ
  choice: उत्तम नैतिकता से
  rationale: यह दत्तिव रूप उस नैतिक गुण या साधन को बताता है जिससे वक्ता सुसज्जित है। यूनानी शब्द कुलीनता और सदाचार से युक्त उत्कृष्ट चरित्र का बोध कराता है; ‘उत्तम नैतिकता’ इसे आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: καθωπλισμένος
  choice: हथियार बाँधे हुए
  rationale: यह καθοπλίζω का कृदन्त है, जिसका अर्थ पूरी तरह हथियारबंद या सुसज्जित होना है। यह चयन मूल युद्ध-संबंधी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τεθήσομαι
  choice: लिटाया जाऊँगा
  rationale: τίθημι का भविष्यत् कर्मवाच्य रूप है। शहादत के प्रसंग में यह भाइयों के साथ मृत्यु में रखे या लिटाए जाने की ओर संकेत करता है, पर ‘लिटाया जाऊँगा’ मूल की कर्मवाच्यता और कुछ अर्थगत खुलापन दोनों बचाता है।
- source_word: κἀγώ
  choice: मैं भी
  rationale: κἀγώ में καί और ἐγώ का संयोग है; ‘मैं भी’ भाइयों के साथ वक्ता की बलयुक्त सहभागिता को सहज हिन्दी में व्यक्त करता है।
- source_word: μετὰ τῶν ἀδελφῶν μου
  choice: अपने भाइयों के साथ
  rationale: μετά के साथ सम्बन्धकारक संगति दर्शाता है। प्रसंग वास्तविक भाइयों का है, इसलिए ‘भाइयों’ उपयुक्त है।
theological_decisions:
- issue: शहादत के प्रसंग में कर्मवाच्य τεθήσομαι का अर्थ
  choice: अपने भाइयों के साथ लिटाया जाऊँगा
  alternative: अपने भाइयों के साथ रखा जाऊँगा; अपने भाइयों के साथ विश्राम में लिटाया जाऊँगा
  rationale: तात्कालिक प्रसंग वक्ता के अपने शहीद भाइयों के साथ मृत्यु में सम्मिलित होने का है। फिर भी मूल क्रिया स्वयं ‘दफ़नाने’ या ‘विश्राम’ को स्पष्ट नहीं करती; इसलिए मुख्य पाठ मृत्यु-संबंधी संकेत देता है, जबकि पादटिप्पणी अधिक सामान्य अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘हथियार बाँधे हुए’ मूल के युद्ध-संबंधी रूपक को बचाता है, और ‘लिटाया जाऊँगा’ मृत्यु के प्रसंग को संकेतित करते हुए क्रिया के सामान्य कर्मवाच्य अर्थ को पूरी तरह बन्द नहीं करता।
