- from: क्योंकि हम पर जो पहरेदार नियुक्त हैं, वे किसी अत्याचारी के नहीं, बल्कि ईश्वरीय व्यवस्था के हैं; इसी कारण हमारी विवेक-बुद्धि अजेय है।[a]
  to: क्योंकि हमारे पहरेदार हम पर किसी अत्याचारी की ओर से नहीं, बल्कि ईश्वरीय व्यवस्था की ओर से नियुक्त हैं; इसलिए हमारी विवेक-बुद्धि अजेय है।[a]
  rationale: The revision makes the authority relationship governing the guards idiomatic and clear in Hindi, explicitly retains “our guards,” and preserves the Greek’s antithesis and philosophical conclusion. The lexical note remains appropriately anchored to λογισμός and continues to present the alternative without treating it as the only possible sense.
