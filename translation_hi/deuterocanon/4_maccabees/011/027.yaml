base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/027.yaml
  text: For our guards stand over us not for a tyrant[a], but for divine law; for this reason we have undefeated reason.
translation:
  language: hi
  text: क्योंकि हमारे पहरेदार हम पर किसी अत्याचारी की ओर से नहीं, बल्कि ईश्वरीय व्यवस्था की ओर से नियुक्त हैं; इसलिए हमारी विवेक-बुद्धि अजेय है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हमारी विवेक-बुद्धि अजेय है’ का अनुवाद ‘हमारे पास अपराजेय तर्कशक्ति है’ भी हो सकता है। यूनानी λογισμός 4 मक्काबियों में मनुष्य की तर्कशील और विवेकपूर्ण निर्णय-क्षमता के लिए प्रयुक्त एक प्रमुख शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τυράννου
  choice: अत्याचारी
  rationale: यह शब्द केवल तटस्थ शासक नहीं, बल्कि दमनकारी या निरंकुश शासक का नकारात्मक भाव रखता है।
- source_word: θείου νόμου
  choice: ईश्वरीय व्यवस्था
  rationale: विशेषण और संज्ञा के यूनानी पदबंध का निकट और स्वाभाविक हिन्दी रूप; ‘व्यवस्था’ यहाँ शासनकारी दैवी नियम का भाव व्यक्त करती है।
- source_word: προεστήκασιν ἡμῶν
  choice: हम पर ... नियुक्त हैं
  rationale: पूर्णकालीन क्रिया किसी के ऊपर निगरानी अथवा अधिकार के स्थान पर स्थापित होने की वर्तमान स्थिति बताती है।
- source_word: οἱ δορυφόροι
  choice: पहरेदार
  rationale: शाब्दिक अर्थ ‘भाला ढोने वाले’ है, पर प्रसंग में सशस्त्र रक्षकों या सेवकों की भूमिका अभिप्रेत है; ‘पहरेदार’ इसे बिना अनावश्यक विशिष्टता के व्यक्त करता है।
- source_word: ἀνίκητον
  choice: अजेय
  rationale: इसका अर्थ है जिसे जीता या परास्त न किया जा सके; ‘अजेय’ संक्षिप्त, प्रतिष्ठित और सहज हिन्दी है।
- source_word: λογισμόν
  choice: विवेक-बुद्धि
  rationale: 4 मक्काबियों में यह तर्कशील क्षमता और विचारपूर्ण निर्णय का प्रमुख दार्शनिक पद है; ‘विवेक-बुद्धि’ केवल सामान्य ‘मन’ की अपेक्षा इस भाव को अधिक स्पष्ट करती है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पूर्ववर्ती कथन से निकलने वाले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
theological_decisions:
- issue: मानवीय अत्याचारी और ईश्वरीय व्यवस्था के बीच अधिकार-संबंध का विरोध
  choice: पहरेदार किसी अत्याचारी के नहीं, बल्कि ईश्वरीय व्यवस्था के हैं
  alternative: पहरेदार किसी अत्याचारी की ओर से नहीं, बल्कि ईश्वरीय व्यवस्था की ओर से हम पर नियुक्त हैं
  rationale: यूनानी में संबंधसूचक पदबंध संक्षिप्त है और स्वामित्व, संबद्धता अथवा प्रतिनिधित्व का भाव दे सकता है। चुना गया रूप इस तनाव को बनाए रखता है और ‘के अधीन’ जैसे अधिक व्याख्यात्मक पद से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
