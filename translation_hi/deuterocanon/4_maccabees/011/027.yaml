  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य रूप। वाक्य में यूनानी विरोध-रचना ‘नहीं, बल्कि’ सुरक्षित रखी गई है; ‘विवेक-बुद्धि’ पुस्तक की दार्शनिक शब्दावली को सहज हिन्दी में व्यक्त करती है।
