translation:
  language: hi
  text: एक-एक को यातना सहते और जलाए जाते हुए देखकर[a], माँ ईश्वर-भक्ति के कारण नहीं बदली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक-एक को यातना-यंत्र पर कसा जाता और जलाया जाता देखकर।” ‘यातना सहते’ के पीछे की यूनानी क्रिया विशेष रूप से यातना-यंत्र पर कसने या मरोड़ने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἓν
  choice: एक-एक को
  rationale: यह यूनानी मुहावरा प्रत्येक व्यक्ति को अलग-अलग और क्रमशः देखने का भाव देता है। संदर्भ से पुत्र अभिप्रेत हैं, पर मूल पद में ‘पुत्र’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: στρεβλούμενον
  choice: यातना दी जाती
  rationale: क्रिया यातना दिए जाने को व्यक्त करती है और विशेष रूप से यातना-यंत्र पर कसने या मरोड़ने का संकेत भी दे सकती है। सामान्य अर्थ मुख्य पाठ में रखा गया और अधिक विशिष्ट अर्थ पाद-टिप्पणी में दिया गया।
- source_word: φλεγόμενον
  choice: जलाया जाता
  rationale: कृदंत आग में जलने या जलाए जाने का हिंसक दृश्य प्रस्तुत करता है। कर्मवाच्य रूप प्रसंग में पीड़ितों पर किए जा रहे अत्याचार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁρῶσα
  choice: देखकर
  rationale: यह कृदंत माँ द्वारा घटना को प्रत्यक्ष देखते रहने की परिस्थितिजन्य पृष्ठभूमि देता है; ‘देखकर’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: μήτηρ
  choice: माँ
  rationale: मूल में निश्चित पद के साथ केवल ‘माँ’ है। ‘माँ’ आधुनिक हिन्दी में सहज है और अनावश्यक संबंधसूचक सर्वनाम नहीं जोड़ता।
- source_word: οὐ μετεβάλετο
  choice: नहीं बदली
  rationale: मूल क्रिया का सामान्य अर्थ ‘बदलना’ है। यह अनुवाद जानबूझकर उस अस्पष्टता को बनाए रखता है कि परिवर्तन मन, निश्चय या आचरण में होता; ‘नहीं डिगी’ अधिक व्याख्यात्मक होता।
- source_word: διὰ τὴν εὐσέβειαν
  choice: ईश्वर-भक्ति के कारण
  rationale: εὐσέβεια यहाँ ईश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुसार जीवन को सूचित करती है। ‘ईश्वर-भक्ति’ साधारण पाठक के लिए स्पष्ट है और इसे केवल सामान्य धार्मिकता तक सीमित नहीं करती।
theological_decisions:
- issue: हेलेनवादी यहूदी शहादत-संदर्भ में εὐσέβεια का अनुवाद
  choice: ईश्वर-भक्ति
  alternative: धर्मनिष्ठा; श्रद्धापूर्ण भक्ति
  rationale: इस ग्रंथ में यह पद ईश्वर और उसकी व्यवस्था के प्रति भक्तिपूर्ण निष्ठा का प्रमुख सद्गुण है। ‘ईश्वर-भक्ति’ उसका धार्मिक लक्ष्य स्पष्ट करती है, जबकि किसी विशिष्ट संप्रदायगत अर्थ को नहीं थोपती।
- issue: οὐ μετεβάλετο में दृढ़ता के आशय को कितना स्पष्ट किया जाए
  choice: नहीं बदली
  alternative: नहीं डिगी; अपने निश्चय से नहीं हटी
  rationale: प्रसंग दृढ़ता का संकेत देता है, पर यूनानी क्रिया केवल परिवर्तन न होने की बात कहती है। ‘नहीं बदली’ मूल की अर्थगत खुलावट बनाए रखता है और मन या निश्चय जैसी कोई अप्रकट वस्तु नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में मूल यूनानी की संक्षिप्तता तथा ‘नहीं बदली’ की वास्तविक अर्थगत अस्पष्टता सुरक्षित है।
