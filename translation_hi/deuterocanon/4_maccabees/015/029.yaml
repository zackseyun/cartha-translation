  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक प्रत्यक्ष संबोधन रखा गया है। समानांतर उपाधियों को सहज संज्ञा-पदबंधों में व्यक्त किया गया है। मुख्य पाठ में [a] और [b] दोनों चिह्न उपस्थित हैं; [b] अंतिम जटिल पदबंध से जुड़ा है।
