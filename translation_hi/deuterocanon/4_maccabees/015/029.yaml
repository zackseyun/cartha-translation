base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/029.yaml
  text: O mother of the nation[a], avenger of the law, defender of godliness[b], and prizewinner in the struggle through motherly affections.
translation:
  language: hi
  text: हे राष्ट्र की माता[a], व्यवस्था की ओर से न्याय दिलानेवाली, धर्मपरायणता की रक्षिका, और ममता से जुड़े संघर्ष की विजेता[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों की माता” अथवा “जातीय समुदाय की माता”; यूनानी शब्द ἔθνος किसी राष्ट्र, जनसमुदाय या जातीय समुदाय को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अंतःकरण की गहरी भावनाओं के माध्यम से हुए संघर्ष की पुरस्कार-विजेता।” यूनानी शब्द σπλάγχνα गहरे स्नेह या करुणा, यहाँ विशेषकर मातृसुलभ ममता, का बोध करा सकता है; इस पदबंध में उस ममता और संघर्ष का संबंध संक्षिप्त रूप में व्यक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: माता
  rationale: प्रत्यक्ष संबोधन और ऊँची अलंकारिक शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔθνους
  choice: जाति की
  rationale: ἔθνος के सामूहिक अर्थ को रखता है; यहाँ 'जाति' किसी सामाजिक वर्ण के बजाय राष्ट्र, जन या जातीय समुदाय का बोध कराती है, इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἔκδικε τοῦ νόμου
  choice: व्यवस्था का पक्ष लेकर न्याय करनेवाली
  rationale: ἔκδικος में किसी की ओर से न्याय दिलाने अथवा प्रतिशोध लेने का प्रबल भाव है। हिन्दी 'बदला लेनेवाली' अनावश्यक रूप से निजी हिंसा सुझा सकता है; यह रूप न्यायिक और समर्थक दोनों भाव बचाता है।
- source_word: ὑπερασπίστεια τῆς εὐσεβείας
  choice: भक्ति की रक्षक
  rationale: ὑπερασπίστεια सक्रिय रक्षा का और εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा तथा उसके अनुरूप आचरण का संकेत देता है।
- source_word: διὰ σπλάγχνων ἀγῶνος
  choice: ममता से उपजे संघर्ष में
  rationale: संक्षिप्त यूनानी वाक्यांश में गहरी आंतरिक, विशेषतः मातृ-सुलभ करुणा से जुड़ा संघर्ष है। यह अनुवाद संबंध को स्पष्ट करता है, पर उसे केवल साधन या केवल विरोध के रूप में कठोरता से निर्धारित नहीं करता।
- source_word: ἀθλοφόρε
  choice: पुरस्कार जीतनेवाली
  rationale: यह प्रतियोगिता में पुरस्कार पानेवाले को दर्शाता है और ἀγών के संघर्ष/प्रतियोगिता रूपक को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: εὐσέβεια का धार्मिक अर्थ
  choice: भक्ति
  alternative: धर्मपरायणता; श्रद्धा
  rationale: यहाँ परमेश्वर और उसकी व्यवस्था के प्रति श्रद्धापूर्ण निष्ठा तथा आचरण की प्रशंसा है। 'भक्ति' आधुनिक हिन्दी में सुबोध है और किसी बाद की विशिष्ट पारिभाषिक धर्मशिक्षा को आरोपित नहीं करती।
- issue: διὰ σπλάγχνων ἀγῶνος में मातृभाव और संघर्ष का संबंध
  choice: ममता से उपजे संघर्ष में
  alternative: अंतःकरण की भावनाओं के संघर्ष में; मातृ-करुणा के द्वारा हुए संघर्ष में
  rationale: διὰ और संक्षिप्त संबंध में वास्तविक अस्पष्टता है। संदर्भ मातृ-स्नेह से उत्पन्न कठिन नैतिक परीक्षा की ओर संकेत करता है; मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी शाब्दिक चित्र तथा अस्पष्टता सुरक्षित रखती है।
