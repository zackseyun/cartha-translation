translation:
  language: hi
  text: उसने भक्ति को अधिक प्रेम किया—उस भक्ति को, जो परमेश्वर के अनुसार[a] अनन्त जीवन के लिए उद्धार करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो परमेश्वर के अनुरूप अनन्त जीवन के लिए उद्धार करती है।” यूनानी पदबंध का अर्थ परमेश्वर की इच्छा या मानक के अनुरूप भी हो सकता है।
    reason: κατὰ θεόν के संक्षिप्त और कुछ अस्पष्ट अर्थ का वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: यहाँ शब्द परमेश्वर के प्रति श्रद्धापूर्ण समर्पण और उससे प्रकट होने वाले निष्ठावान आचरण की प्रमुख सद्गुण-संज्ञा है। ‘भक्ति’ आधुनिक हिन्दी में इस धार्मिक और आचरणगत अर्थ को संक्षेप में व्यक्त करती है।
- source_word: μᾶλλον
  choice: अधिक
  rationale: तुलनात्मक क्रियाविशेषण प्रसंग में दूसरे स्वाभाविक लगाव की अपेक्षा भक्ति को अधिक प्रेम करने का भाव देता है; ‘अधिक’ इस तुलना को खुला रखता है।
- source_word: ἠγάπησεν
  choice: प्रेम किया
  rationale: क्रिया का सीधा अर्थ ‘प्रेम किया’ है। वरीयता का भाव μᾶλλον में है, इसलिए क्रिया में अलग से ‘चुना’ या ‘वरीयता दी’ नहीं जोड़ा गया।
- source_word: τὴν σώζουσαν
  choice: उस भक्ति से, जो … उद्धार करती है
  rationale: वर्तमान कृदन्त εὐσέβειαν का विशेषण है। भक्ति को दोहराकर बनाई गई सम्बन्धवाचक रचना हिन्दी में स्वाभाविक रहते हुए उसके विशेषणात्मक बल को स्पष्ट करती है।
- source_word: εἰς αἰώνιον ζωὴν
  choice: अनन्त जीवन के लिए
  rationale: εἰς यहाँ लक्ष्य या परिणाम दर्शाता है। ‘के लिए’ सहज हिन्दी में उस लक्ष्यगत अर्थ को बनाए रखता है।
- source_word: κατὰ θεόν
  choice: परमेश्वर के अनुसार
  rationale: यूनानी पदबंध संक्षिप्त और अर्थ की दृष्टि से कुछ खुला है। अपेक्षाकृत शाब्दिक अनुवाद यह तय नहीं करता कि आशय परमेश्वर की इच्छा, मानक या स्वीकृति के अनुरूप होना है।
theological_decisions:
- issue: उद्धार और भक्ति के सम्बन्ध में κατὰ θεόν का अर्थ
  choice: ‘परमेश्वर के अनुसार’ रखकर अर्थगत संक्षिप्तता और अस्पष्टता को सुरक्षित रखा गया।
  alternative: ‘परमेश्वर की इच्छा के अनुरूप’, ‘परमेश्वर के मानक के अनुसार’, या ‘परमेश्वर की दृष्टि में’।
  rationale: यह पदबंध यहाँ कोई स्पष्ट, मानकीकृत धर्मसैद्धान्तिक सूत्र नहीं है। अधिक व्याख्यात्मक अनुवाद अनावश्यक रूप से उसके अर्थ को केवल एक विकल्प तक सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘उद्धार’ पाठ के धार्मिक सन्दर्भ और σώζουσαν के बचाने वाले अर्थ को बनाए रखता है; डैश मूल यूनानी की विशेषणात्मक पुनरुक्ति को स्वाभाविक हिन्दी में स्पष्ट करता है।
