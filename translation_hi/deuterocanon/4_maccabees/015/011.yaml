  text: Nevertheless[a], although so many impulses of motherly affection were drawing the mother toward sympathy, the all-varied tortures were not able, by any of them, to turn aside her reason.
translation:
  language: hi
  text: फिर भी, यद्यपि संतान-स्नेह से जुड़ी इतनी सारी भावनाएँ उस माता को सहानुभूति की ओर खींच रही थीं, नाना प्रकार की यातनाएँ उनमें से किसी के द्वारा भी उसके विवेक[a] को विचलित नहीं कर सकीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसकी तर्कपूर्ण निर्णय-शक्ति’; यूनानी शब्द λογισμός इस पुस्तक का एक प्रमुख शब्द है और तर्कपूर्ण विचार-शक्ति पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: फिर भी
  rationale: यह पद पिछले प्रसंग के विपरीत एक प्रबल रियायती मोड़ व्यक्त करता है; ‘फिर भी’ आधुनिक हिन्दी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: संतान-स्नेह से जुड़ी इतनी सारी भावनाएँ
  rationale: φιλοτεκνία अपनी संतान के प्रति गहरे प्रेम को सूचित करता है। अमूर्त यूनानी पदबंध को हिन्दी में भावार्थ खोए बिना सहज बनाया गया है।
- source_word: εἰς συμπάθειαν ἑλκόντων
  choice: करुणा की ओर खींच रही थीं
  rationale: ἑλκόντων के खींचने वाले बिंब को बनाए रखा गया है; यहाँ συμπάθεια दुख में सहभागी होने से उपजी करुणा को व्यक्त करता है।
- source_word: τὴν μητέρα
  choice: उस माता
  rationale: यूनानी में स्पष्ट संबंधवाचक सर्वनाम नहीं है। ‘उस माता’ संदर्भ को स्पष्ट रखते हुए औपचारिक कथन-शैली बनाए रखता है।
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: उनमें से किसी के विषय में भी
  rationale: ἐπί + संबंधकारक को ‘किसी के मामले/विषय में’ समझा गया है, जो प्रसंग में पुत्रों की ओर संकेत करता है। सर्वनाम का पूर्वपद यूनानी में निहित है, इसलिए हिन्दी में भी ‘उनमें से’ द्वारा कुछ संदर्भगत खुलापन रखा गया है।
- source_word: τὸν λογισμὸν αὐτῆς
  choice: उसके विवेक
  rationale: λογισμός इस पुस्तक का प्रमुख दार्शनिक शब्द है और विचार-विवेक की शक्ति को दर्शाता है। ‘विवेक’ हिन्दी में तर्कपूर्ण निर्णय-शक्ति और नैतिक स्थिरता दोनों का संकेत देता है।
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: नाना प्रकार की यातनाएँ
  rationale: παντοίκιλοι की विविधता और βάσανοι की यातना-संबंधी तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ἴσχυσαν μετατρέψαι
  choice: विचलित नहीं कर सकीं
  rationale: ἰσχύω + infinitive असमर्थता या सफल न हो पाने को और μετατρέπω दिशा बदलने को व्यक्त करता है; ‘विचलित नहीं कर सकीं’ दोनों भावों को संक्षेप में रखता है।
theological_decisions:
- issue: दार्शनिक रूप से महत्त्वपूर्ण λογισμός का अनुवाद
  choice: विवेक
  alternative: तर्कपूर्ण निर्णय-शक्ति / बुद्धि / संकल्प
  rationale: ‘विवेक’ मनुष्य की विचारपूर्वक निर्णय करने वाली शक्ति को सामने रखता है और 4 मक्काबियों में भावावेगों पर λογισμός के शासन की मुख्य विषयवस्तु को सुरक्षित रखता है। केवल ‘संकल्प’ कहने से इसके तर्क-बोध का पक्ष दब जाता।
- issue: ἐπʼ οὐδενὸς αὐτῶν में αὐτῶν का संदर्भ
  choice: उनमें से किसी के विषय में भी
  alternative: इनमें से किसी भी भावना के कारण
  rationale: निकटवर्ती व्याकरणिक पूर्वपद भावनात्मक प्रेरणाएँ हो सकती हैं, पर शहादत-प्रसंग और ‘किसी के विषय में’ वाला प्रयोग पुत्रों की ओर संकेत कर सकता है। अनुवाद सर्वनाम को खुला रखता है और पादटिप्पणी में वैकल्पिक संबंध स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथन-शैली रखी गई है। ‘संतान-स्नेह’, ‘करुणा’, ‘विवेक’ और ‘यातनाएँ’ सामान्य पाठक के लिए बोधगम्य हैं, साथ ही मूल के दार्शनिक और भावनात्मक तनाव को बनाए रखते हैं।
