base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/013.yaml
  text: O sacred nature[a], and the affections of parents, and filial love toward parents, and nurture[b], and the unconquerable passions of mothers.
translation:
  language: hi
  text: 'हे पवित्र प्रकृति[a], माता-पिता का स्नेह, माता-पिता के प्रति संतान का प्रेम, पालन-पोषण, और माताओं की अदम्य भावनाएँ[b]!


    [a] “प्रकृति” का अर्थ “प्राकृतिक बंधन” भी हो सकता है; यूनानी शब्द परिवार के स्नेह में प्रकट होने वाली प्राकृतिक व्यवस्था की ओर संकेत कर सकता है।


    [b] यहाँ “भावनाएँ” से आशय प्रबल स्नेह और मनोभावों से है, न कि आवश्यक रूप से अनियंत्रित अभिलाषाओं से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रकृति” का अर्थ “प्राकृतिक बंधन” भी हो सकता है; यूनानी शब्द परिवार के स्नेह में प्रकट होने वाली प्राकृतिक व्यवस्था की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भावनाएँ” से आशय प्रबल स्नेह और मनोभावों से है, न कि आवश्यक रूप से अनियंत्रित अभिलाषाओं से।
    reason: lexical_clarification
lexical_decisions:
- source_word: φύσις ἱερά
  choice: पवित्र प्रकृति
  rationale: φύσις का सीधा अर्थ “प्रकृति” या “स्वभाव” है और ἱερά उसे पवित्र बताता है। इस आलंकारिक संबोधन में यह परिवार के प्राकृतिक बंधन को मानवीकृत करता है; इसलिए सीधे और गरिमापूर्ण पद को रखा गया है।
- source_word: φίλτρα γονέων
  choice: माता-पिता का स्नेह
  rationale: φίλτρα यहाँ प्रेम, अनुराग या स्नेह को दर्शाता है; पारिवारिक संदर्भ में “स्नेह” स्वाभाविक है और इसके संभावित जादुई अर्थ से बचाता है।
- source_word: γονεύσιν φιλοστόργε
  choice: माता-पिता के प्रति संतान का प्रेम
  rationale: φιλοστόργος निकट पारिवारिक अनुराग का बोध कराता है और γονεύσιν उस अनुराग का लक्ष्य माता-पिता को बताता है। “संतान का प्रेम” संबंध की दिशा स्पष्ट करता है, यद्यपि यूनानी अभिव्यक्ति अत्यंत संक्षिप्त है।
- source_word: τροφεῖα
  choice: पालन-पोषण
  rationale: यह शब्द बच्चे को पालने, पोसने और बड़ा करने से जुड़ी देखभाल को समेटता है। आधुनिक हिन्दी में “पालन-पोषण” इसका व्यापक और सहज रूप है।
- source_word: μητέρων ἀδάμαστα πάθη
  choice: माताओं की अदम्य भावनाएँ
  rationale: ἀδάμαστα का अर्थ जिसे वश में या पराजित न किया जा सके है; πάθη यहाँ तीव्र भावनाओं या स्नेह को दर्शाता है। “अदम्य भावनाएँ” तीव्रता बनाए रखती हैं और विकृत कामनाओं का अनावश्यक संकेत नहीं देतीं।
theological_decisions:
- issue: क्या यह परिवार की किसी सिद्धान्तगत पवित्र व्यवस्था की घोषणा है या प्राकृतिक पारिवारिक बंधनों की शक्ति का आलंकारिक उद्गार
  choice: प्राकृतिक पारिवारिक स्नेह की पवित्रता और शक्ति की प्रशंसा करता आलंकारिक उद्गार
  alternative: मूल्यांकन के बिना केवल मातृ और पारिवारिक बंधनों की शक्ति का विलापपूर्ण आह्वान
  rationale: Ὦ तथा संज्ञा-पदों की क्रमिक शृंखला ऊँचे भाव का संबोधन बनाती है। “पवित्र” ἱερά का मूल्यांकन सुरक्षित रखता है, पर इसे अलग धार्मिक सिद्धान्त की घोषणा नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक उद्गार। आरम्भिक “हे” पूरे समन्वित पद-क्रम पर लागू माना गया है; प्रत्येक पद के पहले उसे दोहराकर वाक्य को बोझिल नहीं बनाया गया। “माता-पिता” और “संतान” सामान्य पाठक के लिए संबंधों की दिशा स्पष्ट करते हैं।
