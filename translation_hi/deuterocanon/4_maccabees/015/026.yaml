  text: a mother holding two votes on behalf of her children[a], one deadly and one saving,
translation:
  language: hi
  text: एक माता अपनी संतानों के लिए दो मत[a] हाथ में लिए हुए थी—एक मृत्यु लाने वाला और दूसरा बचाने वाला—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दो मतपत्र”; अधिक शाब्दिक रूप से “दो कंकड़,” क्योंकि यूनानी शब्द मूलतः मतदान में प्रयुक्त कंकड़ को दर्शाता था।
    reason: ψῆφος के ठोस मूल अर्थ और उससे विकसित मतदान-संबंधी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: δύο ψήφους
  choice: दो मत
  rationale: ψῆφος मूलतः मतदान में प्रयुक्त कंकड़ और फिर उससे डाले गए मत को दर्शाता है। ‘दो मत’ निर्णय के रूपक को स्वाभाविक हिन्दी में बनाए रखता है; ठोस मूल बिंब को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κρατοῦσα
  choice: हाथ में लिए हुए थी
  rationale: वर्तमान कृदन्त का ठोस भाव सुरक्षित रहता है और हिन्दी वाक्य में माता द्वारा दोनों मतों को धारण करने का चित्र सहज बनता है।
- source_word: μήτηρ
  choice: एक माता
  rationale: अनिश्चित, बिना उपपद वाले यूनानी संज्ञा-प्रयोग को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: θανατηφόρον
  choice: मृत्यु लाने वाला
  rationale: विशेषण का शाब्दिक ‘मृत्यु-वहक’ भाव स्पष्ट करता है और σωτήριον के समानांतर रहता है।
- source_word: σωτήριον
  choice: बचाने वाला
  rationale: जीवन-रक्षा या छुटकारा देने के व्यापक अर्थ को बनाए रखता है, पर इस छोटे खंड में किसी अधिक विशिष्ट धर्मवैज्ञानिक अर्थ को आरोपित नहीं करता।
- source_word: ὑπὲρ τέκνων
  choice: अपनी संतानों के लिए
  rationale: निर्णय का संबंध संतानों से और उनके हित में होने—दोनों भावों को संक्षेप में व्यक्त करता है; प्रसंग से स्वाभाविक स्वत्व ‘अपनी’ स्पष्ट होता है।
theological_decisions:
- issue: शहादत के प्रसंग में σωτήριον का अनुवाद
  choice: बचाने वाला
  alternative: उद्धार लाने वाला
  rationale: ‘बचाने वाला’ मृत्यु के विपरीत संरक्षण/छुटकारे का अर्थ खुला रखता है और इस वाक्यांश से अधिक विशिष्ट उद्धार-सिद्धान्त निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। मूल यूनानी वाक्यांश की अपूर्ण, आगे जारी रहने वाली संरचना दिखाने के लिए अंत में डैश रखा गया है।
