  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who through seven pregnancies had her affection for them deeply planted within her;
translation:
  language: hi
  text: परन्तु सभी माताओं में सातों की माता[a] अपनी सन्तानों से सबसे अधिक प्रेम करनेवाली थी; सात गर्भधारणों के द्वारा उनके प्रति उसका स्वाभाविक स्नेह उसके भीतर रोपा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘सातों की माता।’ प्रसंग से स्पष्ट है कि वे उसके सात पुत्र थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτεκνωτέρα
  choice: अपनी सन्तानों से सबसे अधिक प्रेम करनेवाली
  rationale: यह तुलनात्मक रूप है, जो ‘सभी माताओं में’ के साथ प्रसंगानुसार सर्वोच्चता व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए सन्तानों के प्रति असाधारण प्रेम को सुरक्षित रखता है।
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: सातों की माता
  rationale: यूनानी में शाब्दिक रूप से ‘सातों की माता’ है; प्रसंग उन्हें उसके सात पुत्रों के रूप में पहचानता है, पर मुख्य पाठ में ‘पुत्रों’ जोड़ना व्याख्यात्मक होता।
- source_word: κυοφορίαις
  choice: सात गर्भधारणों के द्वारा
  rationale: κυοφορία गर्भधारण अथवा गर्भावस्था को सूचित करता है। यह अनुवाद मातृत्व के उस ठोस शारीरिक अनुभव को बनाए रखता है जिस पर वाक्य बल देता है।
- source_word: ἐπιφυτευομένην
  choice: उसके भीतर रोपा गया था
  rationale: शब्द में रोपने या कलम लगाने का रूपक है। ‘भीतर रोपा गया’ उस रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: φιλοστοργίαν
  choice: स्वाभाविक स्नेह
  rationale: φιλοστοργία परिवार के सदस्यों के बीच कोमल, सहज आत्मीय स्नेह को दर्शाता है। ‘स्वाभाविक स्नेह’ मातृ-सन्दर्भ में अर्थ को सुरक्षित रखता है, बिना मूल में अनुपस्थित विशेषण जोड़कर अर्थ सीमित किए।
- source_word: πρὸς αὐτούς
  choice: उनके प्रति
  rationale: यह स्नेह की दिशा उन सातों की ओर दर्शाता है और यूनानी संरचना का निकट, स्वाभाविक हिन्दी समतुल्य है।
