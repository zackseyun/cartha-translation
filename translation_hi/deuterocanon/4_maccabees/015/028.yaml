lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह संयोजक पिछले प्रसंग के विपरीत बात प्रस्तुत करता है; ‘परन्तु’ संक्षिप्त और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: θεοσεβοῦς
  choice: परमेश्वर का भय मानने वाले
  rationale: यह विशेषण परमेश्वर के प्रति श्रद्धा और भक्ति को व्यक्त करता है तथा यूनानी में अब्राहम का विशेषण है; यह चयन स्पष्ट परमेश्वर-संदर्भ बनाए रखता है।
- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: καρτερίας
  choice: दृढ़ता
  rationale: यह दबाव या दुःख में धैर्यपूर्ण स्थिरता और सहनशीलता को दर्शाता है; ‘दृढ़ता’ नैतिक आदर्श के प्रसंग में स्वाभाविक है।
- source_word: ἡ θυγάτηρ
  choice: उस बेटी
  rationale: यूनानी में निश्चित पदबंध ‘वह/उस बेटी’ है और कोई स्पष्ट संबंधसूचक सर्वनाम नहीं है; इसलिए ‘उसकी बेटी’ जोड़ने से बचा गया है।
- source_word: ἐμνήσθη
  choice: स्मरण किया
  rationale: क्रिया का अर्थ याद करना या मन में लाना है; ‘स्मरण किया’ वर्तमान, गरिमापूर्ण हिन्दी में उपयुक्त है।
theological_decisions:
- issue: θεοσεβοῦς में स्पष्ट परमेश्वर-संदर्भ
  choice: परमेश्वर का भय मानने वाले अब्राहम
  alternative: भक्त अब्राहम / परमेश्वर-भक्त अब्राहम
  rationale: यूनानी शब्द में θεο- (‘परमेश्वर’) स्पष्ट है। चुना हुआ रूप इसे बनाए रखता है और विशेषण को यूनानी की तरह अब्राहम से सीधे जोड़ता है, बिना इसे सामान्य सदाचार तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। यूनानी शब्दक्रम और संबंधों को जहाँ स्वाभाविक हो वहाँ निकटता से रखा गया है; कोई अनावश्यक संबंधसूचक सर्वनाम नहीं जोड़ा गया।
