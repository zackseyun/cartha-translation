  yaml_path: translation/deuterocanon/4_maccabees/015/022.yaml
  text: How greatly and how many times, then, was the mother tortured with torments while her sons were being tortured with wheels and cauteries?
translation:
  language: hi
  text: तब, जब पुत्रों को पहियों और दहकते लोहे के औज़ारों[b] से यातना दी जा रही थी, वह माँ कितनी भीषण और कितनी-कितनी यातनाएँ झेल रही थी?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में ‘यातना देना’ और ‘यातनाएँ’ एक ही मूल के शब्द हैं; इस पुनरुक्ति से कथन का आलंकारिक बल बढ़ता है। इसे अधिक शब्दशः इस प्रकार भी कहा जा सकता है: ‘वह माँ कितनी भीषण और कितनी-कितनी यातनाओं से यातना पा रही थी?’'
    reason: lexical_alternative
  - marker: b
    text: अर्थात जलाने या दागने के उपकरण; अनुवाद ‘तपते लोहे’ या ‘दागने के लोहे’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πηλίκοις
  choice: कितनी भीषण
  rationale: यह प्रश्नवाचक विशेषण यातनाओं की प्रचंडता पर बल देता है। ‘कितनी भीषण’ हिन्दी में स्वाभाविक रहते हुए आलंकारिक तीव्रता बनाए रखता है।
- source_word: πόσαις
  choice: कितनी-कितनी
  rationale: πηλίκοις के साथ मिलकर यह यातनाओं की बहुलता अथवा बारंबारता दर्शाता है। ‘कितनी-कितनी’ मूल की विस्मयात्मक-प्रश्नात्मक शैली को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τότε
  choice: तब
  rationale: यह कथानक के उस समय और आलंकारिक संक्रमण को संक्षेप में चिह्नित करता है।
- source_word: ἡ μήτηρ
  choice: वह माँ
  rationale: यूनानी में निश्चित उपपद है, पर स्पष्ट संबंधवाचक सर्वनाम नहीं। ‘वह माँ’ संदर्भ को स्पष्ट रखता है, बिना ‘उनकी’ जोड़कर मूल से अधिक कहे।
- source_word: βασανιζομένων
  choice: यातना दी जा रही थी
  rationale: वर्तमानकालिक कृदंत पुत्रों पर चल रही कठोर यातना को दिखाता है; हिन्दी का अपूर्ण कर्मवाच्य इस निरंतरता को बनाए रखता है।
- source_word: τροχοῖς
  choice: पहियों
  rationale: यह बहुवचन करण कारक का सीधा अनुवाद है; ‘यातना-चक्र’ या ‘रैक’ कहना व्याख्या को मूल में जोड़ देता।
- source_word: καυτηρίοις
  choice: दहकते लोहे के औज़ारों
  rationale: शब्द जलाने, दागने या दहन द्वारा उपचार/यातना देने वाले उपकरणों को सूचित करता है। यह चयन आधुनिक पाठक के लिए स्पष्ट है और ‘दागने के लोहे’ से कुछ व्यापक रहता है।
- source_word: ἐβασανίζετο ... βασάνοις
  choice: यातनाएँ झेल रही थी
  rationale: मूल में एक ही धातु से बने क्रिया और संज्ञा की जानबूझकर पुनरुक्ति है। शब्दशः हिन्दी अत्यंत अस्वाभाविक होती, इसलिए मुख्य पाठ में तीव्र अर्थ रखा गया है और पुनरुक्ति को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: माँ की यातना का स्वरूप
  choice: माँ की पीड़ा को वास्तविक और अत्यंत प्रबल बताया गया है, पर यह नहीं कहा गया कि उन्हीं उपकरणों से उसे भी शारीरिक यातना दी गई।
  alternative: माँ स्वयं भी पहियों और दहकते औज़ारों से शारीरिक रूप से यातना पा रही थी; अथवा यहाँ केवल साधारण भावनात्मक दुःख अभिप्रेत है।
  rationale: वाक्य-विन्यास पहियों और दहकते औज़ारों को सीधे पुत्रों की यातना से जोड़ता है। माँ के लिए प्रयुक्त βασαν- शब्दावली उसकी पीड़ा की चरम तीव्रता बताती है, किंतु उसके साधन को निश्चित नहीं करती। अनुवाद इसी तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। मूल के आलंकारिक प्रश्न को प्रश्नचिह्न सहित बनाए रखा गया है। ‘कितनी-कितनी’ बहुलता और बारंबारता दोनों की गुंजाइश रखता है; ‘दहकते लोहे के औज़ार’ तकनीकी शब्दावली से बचते हुए उपकरणों का स्वरूप स्पष्ट करता है।
