  text: परमेश्वर के भय के कारण उसने अपने बच्चों के अस्थायी बचाव की परवाह नहीं की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὸν ... φόβον
  choice: भय के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है। ‘भय’ मूल शब्द की प्रबलता को बनाए रखता है; परमेश्वर के प्रति इसका संबंध श्रद्धापूर्ण भय का संकेत देता है।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वर के प्रति
  rationale: πρός यहाँ भय की दिशा या उसके विषय को व्यक्त करता है। ‘के प्रति’ आधुनिक हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: ὑπερεῖδεν
  choice: परवाह नहीं की
  rationale: क्रिया का अर्थ जानबूझकर किसी बात को गौण मानना या उस पर ध्यान न देना है। यहाँ माता बच्चों के संकट से अनजान नहीं थी, बल्कि उसने उनकी तात्कालिक रक्षा को उच्चतर निष्ठा के सामने प्राथमिकता नहीं दी।
- source_word: τὴν ... σωτηρίαν
  choice: रक्षा
  rationale: इस प्रसंग में σωτηρία आत्मिक उद्धार नहीं, बल्कि यातना और मृत्यु से शारीरिक बचाव या प्राणों की रक्षा को दर्शाता है। ‘रक्षा’ इस ठोस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: πρόσκαιρον
  choice: थोड़े समय की
  rationale: यह विशेषण सीमित अवधि तक रहने वाली रक्षा को बताता है। ‘थोड़े समय की’ ‘अस्थायी’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज है और कालगत सीमा स्पष्ट रखता है।
- source_word: τῶν τέκνων
  choice: अपने बच्चों की
  rationale: τέκνα का अर्थ ‘बच्चे’ है। प्रसंग में वे इसी माता के बच्चे हैं, इसलिए हिन्दी में ‘अपने’ स्वाभाविक रूप से निहित संबंध को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के संबंध में φόβος का भाव
  choice: परमेश्वर के प्रति भय
  alternative: परमेश्वर के प्रति श्रद्धा / परमेश्वर का भय मानना
  rationale: ‘भय’ मूल शब्द की तीव्रता और बाइबिलीय धार्मिक तनाव को बनाए रखता है; ‘परमेश्वर के प्रति’ यह स्पष्ट करता है कि यह परमेश्वराभिमुख श्रद्धापूर्ण भय है, केवल आतंक नहीं।
- issue: इस प्रसंग में σωτηρία का अर्थ
  choice: सीमित समय की शारीरिक रक्षा
  alternative: छुटकारा / बचाव / उद्धार
  rationale: πρόσκαιρον अर्थ को सांसारिक और अल्पकालिक बचाव तक सीमित करता है। ‘रक्षा’ आत्मिक या अनन्त उद्धार का भाव अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परवाह नहीं की’ माता की अनभिज्ञता नहीं, बल्कि उच्चतर निष्ठा के कारण तात्कालिक रक्षा को गौण मानने का भाव व्यक्त करता है।
