    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: अंतरतम भावनाओं
  rationale: शाब्दिक अर्थ शरीर के भीतरी अंग हैं, पर यहाँ यह गहरी आंतरिक भावनाओं का मुहावरा है। यह चयन देहगत रूपक की छाया रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: εὐσεβὴς λογισμός
  choice: परमेश्वर-भक्त विवेक
  rationale: यह 4 मक्काबियों का प्रमुख पद है और परमेश्वर के प्रति श्रद्धा से संचालित तर्कशील विवेक को दर्शाता है। इस रूप में धार्मिक और बौद्धिक दोनों पहलू बने रहते हैं।
- source_word: ἐν αὐτοῖς τοῖς πάθεσιν
  choice: उन्हीं यातनाओं के बीच
  rationale: संदर्भ में πάθη आंतरिक आवेग नहीं, बल्कि भोगी जा रही पीड़ाएँ अथवा यातनाएँ हैं; 'उन्हीं' यूनानी बलाघात को व्यक्त करता है।
- source_word: ἀνδρειώσας
  choice: साहसी बनाकर
  rationale: कृदन्त का अर्थ साहस देना या वीर बनाना है। 'साहसी बनाकर' इसे सामान्य 'मजबूत करके' की अपेक्षा अधिक प्रत्यक्ष रूप से व्यक्त करता है।
- source_word: ἐτέτεινεν
  choice: पूरा जोर लगाया
  rationale: क्रिया खिंचाव और प्रबल प्रयत्न का बोध कराती है। हिन्दी का यह मुहावरा भावनात्मक और संकल्पगत तनाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν πρόσκαιρον φιλοτεκνίαν
  choice: अपनी संतान के प्रति उसके क्षणिक स्नेह
  rationale: φιλοτεκνία माता-पिता का संतान-स्नेह है और πρόσκαιρον उसे वर्तमान समय से सीमित या क्षणिक बताता है। अनुवाद स्नेह को अपने-आप में बुरा कहे बिना विरोध को सुरक्षित रखता है।
- source_word: παροδεῖν
  choice: अनदेखा करने
  rationale: क्रिया का अर्थ पास से निकल जाना, ध्यान न देना या जानबूझकर दरकिनार करना है। 'अनदेखा करना' प्रसंग में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: εὐσεβὴς λογισμός का अनुवाद
  choice: परमेश्वर-भक्त विवेक
  alternative: भक्तिपूर्ण विवेक; धर्मनिष्ठ तर्कबुद्धि
  rationale: यह पद न केवल सामान्य बुद्धि, बल्कि परमेश्वर के प्रति भक्ति से संचालित विवेक को सूचित करता है। चयन दोनों आयामों को रखता है और किसी बाद की दार्शनिक या सांप्रदायिक श्रेणी को नहीं थोपता।
- issue: πρόσκαιρον φιλοτεκνίαν में मातृ-स्नेह और निष्ठा का तनाव
  choice: अपनी संतान के प्रति उसके क्षणिक स्नेह
  alternative: उसका अस्थायी मातृ-स्नेह
  rationale: मूल पाठ स्वाभाविक संतान-स्नेह की वास्तविकता को नकारता नहीं, बल्कि उसे वर्तमान काल तक सीमित स्नेह के रूप में स्थायी धार्मिक निष्ठा के सामने रखता है। 'क्षणिक' इस तनाव को बिना नैतिक अतिशयोक्ति के बनाए रखता है।
