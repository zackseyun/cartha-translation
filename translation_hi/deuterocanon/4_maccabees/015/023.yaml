translation:
  language: hi
  text: परन्तु परमेश्वर-भक्त विवेक[a] ने, उन्हीं यातनाओं के बीच उसकी अंतरतम भावनाओं को साहस देकर, उन्हें उसके क्षणिक संतान-स्नेह[b] को अनदेखा करने के लिए दृढ़तापूर्वक उन्मुख किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भक्तिपूर्ण विवेक।” यूनानी पद 4 मक्काबियों में परमेश्वर के प्रति श्रद्धा से संचालित विवेक के लिए बार-बार प्रयुक्त एक प्रमुख अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
