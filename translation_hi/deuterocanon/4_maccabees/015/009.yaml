  yaml_path: translation/deuterocanon/4_maccabees/015/009.yaml
  text: And not only that, but because of the nobility of her sons and their obedience to the law, she had an even greater motherly affection for them.
translation:
  language: hi
  text: इतना ही नहीं, बल्कि अपने पुत्रों के श्रेष्ठ चरित्र और व्यवस्था के प्रति उनकी आज्ञाकारिता के कारण उनके लिए उसका मातृ-स्नेह और भी बढ़ गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  choice: इतना ही नहीं, बल्कि
  rationale: यह पदबंध पिछले विचार में एक और बात जोड़ता है; आधुनिक हिन्दी में यह संचयी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καλοκἀγαθίαν
  choice: श्रेष्ठ चरित्र
  rationale: यह शब्द नैतिक उत्कृष्टता और भले, उदात्त आचरण का बोध कराता है। ‘श्रेष्ठ चरित्र’ साधारण पाठक के लिए स्पष्ट है और केवल सामाजिक कुलीनता का भ्रम नहीं पैदा करता।
- source_word: εὐπείθειαν
  choice: आज्ञाकारिता
  rationale: व्यवस्था के प्रति स्वेच्छापूर्ण और तत्पर अधीनता यहाँ अभिप्रेत है; ‘आज्ञाकारिता’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: νόμον
  choice: व्यवस्था
  rationale: संदर्भ में पैतृक यहूदी धर्म-व्यवस्था अभिप्रेत है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित है और यूनानी पद की विधिक-धार्मिक व्यापकता बनाए रखती है।
- source_word: μείζω
  choice: और भी बढ़ गया था
  rationale: तुलनात्मक भाव को सहज हिन्दी क्रियात्मक अभिव्यक्ति में प्रस्तुत किया गया है, जिससे पहले से विद्यमान स्नेह के अधिक होने का अर्थ स्पष्ट रहता है।
- source_word: φιλοστοργίαν
  choice: मातृ-स्नेह
  rationale: यूनानी शब्द स्वाभाविक पारिवारिक स्नेह का द्योतक है; इस प्रसंग में कर्ता माता है और स्नेह उसके पुत्रों के प्रति है, इसलिए ‘मातृ-स्नेह’ संदर्भगत अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: φιλοστοργίαν में मातृभाव को स्पष्ट करना
  choice: मातृ-स्नेह
  alternative: पारिवारिक स्नेह / स्वाभाविक स्नेह
  rationale: मूल शब्द सामान्यतः परिवार के भीतर के स्वाभाविक स्नेह को व्यक्त करता है, पर इस वाक्य में माता का अपने पुत्रों के प्रति प्रेम विशेष रूप से अभिप्रेत है। ‘मातृ-स्नेह’ कोई नया धर्मवैचारिक दावा जोड़े बिना संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- issue: νόμον की धार्मिक विशिष्टता
  choice: व्यवस्था
  alternative: कानून / धर्म-व्यवस्था
  rationale: संदर्भ यहूदी पैतृक व्यवस्था की ओर संकेत करता है, किंतु यूनानी में यहाँ अतिरिक्त व्याख्यात्मक विशेषण नहीं है। इसलिए मुख्य पाठ में केवल ‘व्यवस्था’ रखकर स्रोत की संक्षिप्तता और संदर्भगत अर्थ दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। वाक्य का संचयी संक्रमण, नैतिक उत्कृष्टता, व्यवस्था के प्रति आज्ञाकारिता और माता के बढ़े हुए स्नेह—इन सभी को मूल क्रम के निकट रखते हुए स्वाभाविक हिन्दी में व्यक्त किया गया है।
