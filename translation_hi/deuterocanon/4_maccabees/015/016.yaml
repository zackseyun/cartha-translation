lexical_decisions:
- source_word: σάρκας
  choice: मांस के लोथड़े
  rationale: σάρξ के बहुवचन का यहाँ मूर्त और वीभत्स अर्थ है; ‘मांस के लोथड़े’ शहीदी-यातना के संदर्भ में केवल ‘शरीर’ की अपेक्षा अधिक सटीक है।
- source_word: ὥσπερ
  choice: मानो ... की तरह
  rationale: यह तुलना का संकेत देता है; हिन्दी में ‘मानो ... की तरह’ इस चौंकाने वाले दृश्यात्मक उपमान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσωπεῖα
  choice: मुखौटे
  rationale: यह शब्द सामान्यतः चेहरे पर लगाए जाने वाले, विशेषकर नाटकीय, मुखौटों को दर्शाता है; यहाँ शाब्दिक ‘चेहरे’ अर्थ लेना उचित नहीं है।
- source_word: προκειμένας
  choice: सामने पड़े थे
  rationale: πρόκειμαι का अर्थ सामने पड़ा या रखा होना है। ‘सामने पड़े थे’ कारकता को अनावश्यक रूप से निश्चित किए बिना दृश्यात्मक अर्थ बनाए रखता है।
