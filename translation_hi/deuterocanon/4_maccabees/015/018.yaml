  choice: ‘संपूर्ण परमेश्वर-भक्ति को जन्म दिया’ के रूप में प्रसव-रूपक को बनाए रखा गया।
  alternative: ‘संपूर्ण परमेश्वर-भक्ति को प्रकट किया’ या ‘उत्पन्न किया’
  rationale: ἀποκυήσασα स्पष्ट रूप से जन्म देने की भाषा है। इसे सामान्य ‘उत्पन्न किया’ में बदलने से माता से जुड़ी मूल अलंकारिक छवि मंद पड़ जाती।
- issue: μόνη का विशिष्ट बल
  choice: ‘अकेली स्त्री’
  alternative: ‘अद्वितीय स्त्री’
  rationale: मूल में ‘एकमात्र/अकेली’ और ‘अद्वितीय’ दोनों भाव सम्भव हैं। मुख्य पाठ अधिक सीधा अर्थ रखता है और विकल्प पादटिप्पणी में देता है।
