revisions:
- from: अहा! धीरता में नरों से अधिक उदात्त, और सहनशीलता में पुरुषों से अधिक पुरुषार्थी[a]!
  to: अहा! धीरता में नरों से अधिक उदात्त, और सहनशीलता में पुरुषों से भी बढ़कर पौरुषमयी[a]!
  rationale: Revised only the final comparative and its note. “पौरुषमयी” conveys masculine-coded valor and preserves the rhetorical reversal, whereas “पुरुषार्थी” introduces the unrelated modern sense of diligence or purposeful effort. The distinct “नरों” and “पुरुषों” contrast, the two virtues, and the exclamatory register remain intact.
  reviewer_model: gpt-5.6-terra
