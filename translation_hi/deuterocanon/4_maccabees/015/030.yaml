  yaml_path: translation/deuterocanon/4_maccabees/015/030.yaml
  text: O more noble than males in courage[a], and more manly than men in endurance.
translation:
  language: hi
  text: अहा! धीरता में नरों से अधिक उदात्त, और सहनशीलता में पुरुषों से भी बढ़कर पौरुषमयी[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सहनशीलता में पुरुषों से अधिक साहसी।” यूनानी शब्द का अर्थ साहसी या पौरुषपूर्ण हो सकता है और वह “पुरुष” के लिए प्रयुक्त शब्द से बना है; इसलिए यहाँ पुरुषोचित वीरता के विचार पर जानबूझकर शब्द-खेल है।
    reason: मूल यूनानी के साहस/पौरुष के दोहरे अर्थ और “पुरुषों” के साथ उसके शब्द-खेल को स्पष्ट करना।
lexical_decisions:
- source_word: ἀρρένων
  choice: नरों
  rationale: यह शब्द मूलतः पुरुष-लिंग के प्राणियों को सूचित करता है। “नरों” से आगे आने वाले ἀνδρῶν (“पुरुषों”) के साथ जानबूझकर किया गया भेद बना रहता है।
- source_word: πρὸς καρτερίαν
  choice: धीरता में
  rationale: καρτερία दृढ़ता, धैर्य और विपत्ति में साहसपूर्वक टिके रहने का भाव रखता है; “धीरता” इन पहलुओं को संक्षेप में समेटता है।
- source_word: γενναιοτέρα
  choice: अधिक उदात्त
  rationale: γενναῖος में कुलीनता, उदात्तता और वीर भाव का संगम हो सकता है। “अधिक उदात्त” नैतिक ऊँचाई को बनाए रखता है और धीरता के प्रसंग से साहस का भाव भी मिलता है।
- source_word: ἀνδρῶν
  choice: पुरुषों
  rationale: ἀνήρ वयस्क पुरुष को सूचित करता है। “पुरुषों” का प्रयोग पहले के “नरों” से शब्दगत अंतर को सुरक्षित रखता है।
- source_word: πρὸς ὑπομονὴν
  choice: सहनशीलता में
  rationale: ὑπομονή कठिनाई के नीचे धैर्यपूर्वक टिके रहने और सहने का भाव देता है; यहाँ “सहनशीलता” स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἀνδρειοτέρα
  choice: अधिक पुरुषार्थी
  rationale: ἀνδρεῖος ἀνήρ से बना है और साहस के साथ पुरुषोचित वीरता का स्पष्ट शब्द-खेल रखता है। “पुरुषार्थी” हिंदी में वीरता का भाव देते हुए पुरुष-संबंधी आलंकारिक प्रतिध्वनि भी बचाता है।
theological_decisions:
- issue: माता की प्रशंसा में लिंग-संबंधी तुलनात्मक अलंकार
  choice: “नरों से अधिक … पुरुषों से अधिक पुरुषार्थी” कहकर पुरुष-वाचक तुलना और उसके उलटाव को स्पष्ट रखा गया है।
  alternative: लिंग-संबंधी शब्द-खेल हटाकर केवल “सबसे अधिक साहसी” या “पुरुषों से अधिक वीर” कहना।
  rationale: यूनानी पाठ जानबूझकर एक स्त्री को उन गुणों में पुरुषों से श्रेष्ठ बताता है जिन्हें उस संस्कृति में पुरुषोचित समझा जाता था। इसे निष्प्रभावी करना मूल की आलंकारिक और वैचारिक धार को घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और विस्मयात्मक शैली रखी गई है। यूनानी ὦ को “अहा!” से व्यक्त किया गया है, जिससे मूल का भावपूर्ण उद्गार बना रहता है; वाक्य की संक्षिप्त, काव्यात्मक संरचना भी सुरक्षित है।
