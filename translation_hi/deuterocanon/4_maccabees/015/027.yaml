translation:
  language: hi
  text: मैं उस उद्धार को नहीं पहचान सकी, जो सात पुत्रों को थोड़े समय के लिए बचाए रख रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उस छुटकारे को नहीं पहचान सकी, जो सात पुत्रों को थोड़े समय के लिए बचाए रख रहा था।”
    reason: σωτηρία का अर्थ ‘उद्धार’ या ‘छुटकारा’ हो सकता है; यहाँ तत्काल आशय कुछ समय के लिए रक्षा या बचाव का है।
lexical_decisions:
- source_word: οὐκ ἐπέγνων
  choice: मैंने ... नहीं पहचाना
  rationale: ἐπιγινώσκω यहाँ सामने उपस्थित बात को पहचानने या उसकी वास्तविकता ग्रहण करने का भाव रखता है। ‘नहीं पहचाना’ इस अर्थ को बिना केवल बौद्धिक ‘समझने’ तक सीमित किए सुरक्षित रखता है।
- source_word: τὴν σώζουσαν ... σωτηρίαν
  choice: उस उद्धार को ..., जो ... बचा रहा था
  rationale: σωτηρία और σώζουσαν की एक ही शब्द-मूल से बनी पुनरुक्ति को हिन्दी में ‘उद्धार’ और ‘बचा रहा था’ द्वारा यथासंभव स्पष्ट रखा गया है। इससे अस्थायी प्राण-रक्षा का संदर्भ सामने आता है, जबकि ‘उद्धार’ का व्यापक धार्मिक अर्थ भी पूरी तरह मिटता नहीं।
- source_word: ἑπτὰ υἱοὺς
  choice: सात पुत्रों
  rationale: υἱούς का विशिष्ट अर्थ ‘पुत्र’ है, और प्रसंग भी माता के सात पुत्रों का है; इसलिए इसे लिंग-निरपेक्ष ‘बच्चों’ नहीं किया गया।
- source_word: πρὸς ὀλίγον χρόνον
  choice: थोड़े समय के लिए
  rationale: यह वाक्यांश सीमित अवधि बताता है। चुना हुआ रूप स्वाभाविक आधुनिक हिन्दी में उस अस्थायी अवधि को स्पष्ट रखता है।
theological_decisions:
- issue: शहादत के प्रसंग में σωτηρία का आशय
  choice: मुख्य पाठ में ‘उद्धार’, जिसे ‘बचा रहा था’ द्वारा तत्काल और अस्थायी प्राण-रक्षा के रूप में स्पष्ट किया गया है
  alternative: ‘मुक्ति’ अथवा केवल ‘प्राण-रक्षा’, जिसमें क्रमशः व्यापक धार्मिक अर्थ अधिक उभर सकता है या पूरी तरह दब सकता है
  rationale: πρὸς ὀλίγον χρόνον तत्काल, सीमित अवधि की रक्षा को अग्रभूमि में रखता है; फिर भी σωτηρία के व्यापक अर्थ-संकेत को समाप्त न करने के लिए ‘उद्धार’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी की जानबूझकर असहज लगने वाली ‘उद्धार ... बचा रहा था’ संरचना को अर्थगत तनाव और समान शब्द-मूल की प्रतिध्वनि बचाने के लिए कुछ हद तक बनाए रखा गया है।
