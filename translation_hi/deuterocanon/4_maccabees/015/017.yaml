  text: हे माँ, तुम अब उन पीड़ाओं से परखी गई हो जो उन्हें जन्म देते समय की प्रसव-वेदनाओं[a] से भी अधिक कड़वी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके संबंध में प्रसव-वेदनाएँ”; अर्थात उन्हें जन्म देते समय की वेदनाएँ।
    reason: ἐπʼ αὐτοῖς का संबंध पुत्रों से है, पर यूनानी पदबंध हिन्दी की अपेक्षा अधिक संक्षिप्त और कुछ हद तक खुला है।
lexical_decisions:
- source_word: πικροτέρων
  choice: अधिक कड़वी
  rationale: तुलनात्मक विशेषण के शाब्दिक ‘अधिक कड़वी’ रूप को रखा गया है, ताकि पीड़ा की तीव्रता के साथ मूल रूपक और वाक्य की भावात्मक शक्ति भी बनी रहे।
- source_word: μήτηρ
  choice: हे माँ
  rationale: यह स्त्री को किया गया सीधा संबोधन है; ‘हे माँ’ आधुनिक हिन्दी में स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: πόνων
  choice: पीड़ाओं
  rationale: यहाँ शब्द उन कष्टदायक अनुभवों को सूचित करता है जिनसे माँ परखी गई। ‘पीड़ाओं’ आगे आने वाली प्रसव-वेदनाओं से तुलना को सहज रखता है।
- source_word: πειρασθεῖσα
  choice: परखी गई हो
  rationale: कृदन्त में किसी कठिन अनुभव से गुजरने और उसके द्वारा परीक्षा होने—दोनों का भाव संभव है। ‘परखी गई हो’ नैतिक दृढ़ता के संकेत को बचाता है, पर उसका परिणाम नहीं जोड़ता।
- source_word: ἤπερ
  choice: से भी अधिक
  rationale: यह वर्तमान पीड़ाओं और पहले की प्रसव-वेदनाओं के बीच तुलना कराता है; हिन्दी में ‘से भी अधिक’ तुलनात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν ἐπʼ αὐτοῖς ὠδίνων
  choice: इन्हें जन्म देते समय हुई प्रसव-वेदनाओं
  rationale: ὠδίνων प्रसव की वेदनाओं को दर्शाता है और ἐπʼ αὐτοῖς उन पुत्रों से उनका संबंध बताता है। हिन्दी रूप अर्थ स्पष्ट करता है, पर संबंध को केवल ‘उनके कारण’ के रूप में सीमित नहीं करता।
