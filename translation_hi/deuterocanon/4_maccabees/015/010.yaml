  yaml_path: translation/deuterocanon/4_maccabees/015/010.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving their brothers, and so devoted to their mother that, even while keeping the law's requirements to the point of death[b], they obeyed her.
translation:
  language: hi
  text: क्योंकि वे धर्मी और संयमी, साहसी, उदार-हृदय और अपने भाइयों से प्रेम करनेवाले थे। वे अपनी माता के प्रति इतना स्नेह रखते थे कि मृत्यु तक व्यवस्था के विधानों[a] का पालन करते हुए उसकी आज्ञा मानते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कानूनसम्मत नियम” या “व्यवस्था द्वारा निर्धारित रीति-रिवाज।”
    reason: τὰ νόμιμα नियमों, विधानों या व्यवस्था-निर्धारित प्रथाओं को सूचित कर सकता है।
  - marker: b
    text: या, “उसकी बात मानते थे” या “उसके कहने के अनुसार चलते थे।”
    reason: πείθεσθαι का अर्थ किसी की आज्ञा मानना, उसकी बात मानना, या उसके कहने के अनुसार चलना हो सकता है।
lexical_decisions:
- source_word: δίκαιοι
  choice: धर्मी
  rationale: यहाँ यह शब्द नैतिक और धार्मिक खराई को व्यक्त करता है; ‘धर्मी’ इस यहूदी शहादत-संदर्भ में ‘न्यायी’ से अधिक उपयुक्त है।
- source_word: σώφρονες
  choice: संयमी
  rationale: यह विवेकपूर्ण आत्म-संयम और इच्छाओं पर नियंत्रण का बोध कराता है; ‘संयमी’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: ἀνδρεῖοι
  choice: साहसी
  rationale: शब्द का आशय वीरता और साहस है; ‘साहसी’ अनावश्यक लैंगिक अर्थ जोड़े बिना इसे स्पष्ट करता है।
- source_word: μεγαλόψυχοι
  choice: उदार-हृदय
  rationale: शाब्दिक भाव ‘महान आत्मा वाले’ है। ‘उदार-हृदय’ ऊँचे और विशाल चरित्र का स्वाभाविक हिन्दी रूप है।
- source_word: φιλάδελφοι
  choice: अपने भाइयों से प्रेम करनेवाले
  rationale: तात्कालिक संदर्भ वास्तविक भाइयों का है, इसलिए पारिवारिक और पुल्लिंग संदर्भ को सामान्यीकृत नहीं किया गया।
- source_word: φιλόμητρος
  choice: अपनी माता से भी इतना प्रेम करते थे
  rationale: यह विशेषण माता के प्रति स्नेह और निष्ठा व्यक्त करता है। हिन्दी में क्रियात्मक रूप अधिक सहज है और οὕτως ὥστε की परिणामसूचक रचना को स्पष्ट रखता है।
- source_word: μέχρι θανάτου
  choice: मृत्यु तक
  rationale: यह उनकी निष्ठा की अंतिम सीमा बताता है; सीधा रूप मूल की संक्षिप्तता बनाए रखता है।
- source_word: τὰ νόμιμα
  choice: विधि-विधान
  rationale: यह पैतृक व्यवस्था द्वारा निर्धारित नियमों या प्रथाओं को सूचित करता है। ‘विधि-विधान’ अर्थ को किसी एक प्रकार के धार्मिक नियम तक सीमित नहीं करता।
- source_word: φυλάσσοντας
  choice: पालन करते हुए
  rationale: τὰ νόμιμα के साथ इसका अर्थ निर्धारित विधानों को मानना या उनका पालन करना है।
- source_word: πείθεσθαι αὐτῇ
  choice: उसकी बात मानते थे
  rationale: πείθομαι में आज्ञापालन, बात मानने या समझाए जाने का भाव हो सकता है। ‘उसकी बात मानते थे’ मातृ-संबंध के संदर्भ में स्वाभाविक है और अत्यधिक कठोर आदेशात्मक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: δίκαιοι का नैतिक-धार्मिक बल
  choice: धर्मी
  alternative: न्यायी
  rationale: यह गुण-सूची व्यवस्था के प्रति निष्ठावान जीवन का वर्णन करती है; ‘धर्मी’ व्यापक नैतिक-धार्मिक अर्थ को सुरक्षित रखता है।
- issue: φιλάδελφοι में पारिवारिक लिंग-संदर्भ
  choice: अपने भाइयों से प्रेम करनेवाले
  alternative: अपने भाई-बहनों से प्रेम करनेवाले
  rationale: कथा में सात वास्तविक भाइयों की बात है; इसलिए मूल के विशिष्ट पारिवारिक संदर्भ को बनाए रखा गया है।
- issue: माता की बात मानना और व्यवस्था का पालन
  choice: दोनों को साथ-साथ प्रस्तुत किया गया
  alternative: माता की बात को व्यवस्था के पालन के विपरीत प्रस्तुत करना
  rationale: मूल पाठ इन दोनों निष्ठाओं में टकराव नहीं बताता। अतः अनावश्यक विरोध उत्पन्न किए बिना वाक्य में दोनों को साथ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। गुण-सूची की लय बचाने के लिए संक्षिप्त विशेषण चुने गए हैं और लंबे यूनानी वाक्य को पठनीयता हेतु दो हिन्दी वाक्यों में बाँटा गया है।
