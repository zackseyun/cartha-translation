    issue: “यातनाओं के बीच” for ἐπὶ τῶν βασάνων
    rationale: The phrase presents the sons as located amid tortures, whereas the Greek describes their eyes as looking upon/at the tortures. The object of their gaze should be expressed directly.
  - severity: low
