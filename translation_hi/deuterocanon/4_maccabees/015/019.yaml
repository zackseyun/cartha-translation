base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/019.yaml
  text: Nor[a], as a third son was breathing his last, did you weep when you saw the eyes of each one, bull-like, looking upon the tortures and the same torment[c][b], and their nostrils foretelling death.
translation:
  language: hi
  text: जब तीसरा पुत्र प्राण छोड़ रहा था[a], तब भी तुम नहीं रोईं; न ही जब तुमने उनमें से हर एक की आँखों को बैल की तरह[b] यातनाओं और उसी क्रूर दुर्व्यवहार को देखते हुए, और उनकी नासिकाओं को उनकी मृत्यु का पूर्वसंकेत देते हुए देखा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तीसरे के प्राण छोड़ते समय भी।” यूनानी आरंभ अंडाकार है; ‘पुत्र’ आसपास के प्रसंग से स्पष्ट होता है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “बैल की तरह।” यह संभवतः यातना के सामने पुत्रों की उग्र और अडिग दृष्टि का वर्णन करता है।
    reason: cultural_note
  - marker: c
    text: 'यूनानी में यह एक तीखी शारीरिक छवि है: उनकी नासिकाएँ उनकी मृत्यु का पूर्वसंकेत दे रही थीं। संभवतः निकट मृत्यु के समय उनकी दिखाई देने वाली साँस का उल्लेख है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ τρίτος ἀποψύχων
  choice: जब तीसरा पुत्र भी प्राण छोड़ रहा था
  rationale: यूनानी वाक्यांश अंडाकार है और संज्ञा व्यक्त नहीं करता; आसपास के प्रसंग से ‘पुत्र’ अभिप्रेत है। ἀποψύχων का जीवंत भाव ‘प्राण छोड़ रहा था’ से व्यक्त होता है।
- source_word: θεωροῦσα
  choice: जब तुमने ... देखा
  rationale: यह कृदंत माता के प्रत्यक्ष रूप से देखने को दर्शाता है और मुख्य क्रिया ‘तुम नहीं रोईं’ से स्वाभाविक रूप में जुड़ता है।
- source_word: ταυρηδὸν
  choice: बैल की-सी दृढ़ता से
  rationale: शब्दशः यह बैल-जैसे ढंग को व्यक्त करता है। हिंदी में यह रूप दृष्टि की उग्र और अडिग मुद्रा को स्वाभाविक ढंग से सामने लाता है, जबकि उपमा को बनाए रखता है।
- source_word: ἐπὶ τῶν βασάνων ὁρῶντας τὸν αὐτὸν αἰκισμόν
  choice: यातनाओं के बीच उसी क्रूर दुर्व्यवहार को निहारते
  rationale: βάσανοι यातनाओं को और αἰκισμός क्रूर दुर्व्यवहार, अपमानजनक अत्याचार या विकृतिकरण को सूचित कर सकता है। दोनों शब्दों का भेद बनाए रखने के लिए अलग हिंदी पद चुने गए हैं।
- source_word: τοὺς μυκτῆρας προσημειουμένους αὐτῶν τὸν θάνατον
  choice: उनकी नासिकाओं को उनकी मृत्यु का पूर्वसंकेत देते
  rationale: यह जानबूझकर यूनानी की तीखी शारीरिक छवि को बनाए रखता है; संभवतः मरते हुए व्यक्तियों की साँस उनकी निकट मृत्यु का दिखाई देने वाला संकेत है।
- source_word: οὐκ ἔκλαυσας
  choice: तब भी तुम नहीं रोईं
  rationale: κλαίω का सामान्य अर्थ रोना है। स्त्रीलिंग संबोधन प्रसंग में माता को सीधे संबोधित किए जाने से स्पष्ट है।
theological_decisions:
- issue: अंडाकार आरंभ में निहित कर्ता की पूर्ति
  choice: ‘तीसरा पुत्र’
  alternative: केवल ‘तीसरा’
  rationale: मूल यूनानी संज्ञा छोड़ देता है, पर निकटवर्ती प्रसंग माता के पुत्रों के विषय में है। ‘पुत्र’ जोड़ना केवल संदर्भ को स्पष्ट करता है, कोई नया धर्मवैचारिक दावा नहीं जोड़ता।
- issue: बैल की उपमा का संबंध
  choice: इसे पुत्रों की दृष्टि की दृढ़ता से जोड़ा गया
  alternative: इसे यातना के समय उनके समग्र आचरण से जोड़ना
  rationale: ταυρηδόν वाक्य-विन्यास में आँखों और देखने के वर्णन के निकट है; इसलिए इसे दृष्टि से जोड़ना मूल संरचना के अधिक निकट है, यद्यपि व्यापक साहस का भाव भी संभव है।
- issue: दो नकारात्मक खंडों की संरचना
  choice: दोनों प्रसंगों में ‘तब भी तुम नहीं रोईं’ स्पष्ट किया गया
  alternative: मूल की खंडित रचना को एक ही लंबे वाक्य में रखना
  rationale: यूनानी पाठ पूर्ववर्ती आलंकारिक क्रम पर निर्भर अंडाकार वाक्यों का प्रयोग करता है। हिंदी में मुख्य कथन दोहराने से अर्थ स्पष्ट होता है और माता की अडिगता पर मूल बल बना रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘प्राण छोड़ना’, ‘क्रूर दुर्व्यवहार’ और ‘पूर्वसंकेत’ मूल की गंभीरता तथा शारीरिक तीव्रता रखते हैं। स्त्रीलिंग ‘रोईं’ माता को किए गए प्रत्यक्ष संबोधन के अनुरूप है।
