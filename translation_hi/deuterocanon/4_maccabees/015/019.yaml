    rationale: ταυρηδόν evokes a bull-like manner but does not specifically state “steadfastness.” Retaining “बैल की तरह” preserves the image without narrowing it.
  - severity: low
    issue: Two independent “तब भी तुम नहीं रोईं” clauses obscure the Greek’s coordinated οὐδέ … οὐδέ structure
    rationale: A coordinated Hindi construction more closely conveys the accumulating rhetorical force while remaining readable.
