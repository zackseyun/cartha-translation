base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/032.yaml
  text: So you also[a], guardian of the law, though surrounded on every side by the flood of passions and pressed by the fierce winds of your sons’ torments[b], bravely endured the storms of godliness.
translation:
  language: hi
  text: इसी प्रकार, हे व्यवस्था की रक्षिका, तुम भी मनोवेगों[a] की बाढ़ से चारों ओर घिरी हुई और अपने पुत्रों की यातनाओं रूपी प्रचंड हवाओं से दबी हुई, परमेश्वर-भक्ति[b] के तूफ़ानों को साहस के साथ सहती रहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वासनाओं” अथवा “दुःखों।” यूनानी शब्द πάθη 4 मक्काबियों में प्रायः उन मनोवेगों या भावनात्मक आवेगों के लिए आता है जिन्हें विवेक को वश में रखना है।
    reason: lexical_alternative
  - marker: b
    text: या, “धर्मनिष्ठा।” यहाँ यूनानी शब्द εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा को दर्शाता है। “परमेश्वर-भक्ति के तूफ़ान” का अर्थ परमेश्वर-भक्ति के कारण आए तूफ़ान भी हो सकता है।
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: νομοφύλαξ
  choice: व्यवस्था की रक्षिका
  rationale: यह संबोधित स्त्री को परमेश्वर की व्यवस्था की रक्षा और पालन करनेवाली के रूप में दर्शाता है; स्त्रीलिंग ‘रक्षिका’ यूनानी संदर्भ के अनुरूप है।
- source_word: πάθη
  choice: मनोवेग
  rationale: 4 मक्काबियों में यह विचार और विवेक द्वारा वश में किए जानेवाले भावनात्मक आवेगों का प्रमुख शब्द है। ‘मनोवेग’ आधुनिक हिन्दी में इस दार्शनिक अर्थ को ‘भावनाओं’ से अधिक सटीक और ‘वासनाओं’ से कम संकीर्ण रूप में व्यक्त करता है।
- source_word: κατακλυσμός
  choice: बाढ़
  rationale: मूल के प्रबल जल-रूपक को सहज और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: καρτεροῖς ἀνέμοις
  choice: प्रचंड हवाओं
  rationale: καρτερός की शक्ति और कठोरता को व्यक्त करते हुए तूफ़ान के विस्तृत रूपक को बनाए रखता है।
- source_word: ταῖς τῶν υἱῶν βασάνοις
  choice: अपने पुत्रों की यातनाओं रूपी
  rationale: यह उन यातनाओं को दर्शाता है जो उसके पुत्रों ने सहीं; ‘रूपी’ हवाओं और यातनाओं के रूपक-संबंध को हिन्दी में स्पष्ट करता है।
- source_word: συνεχομένη
  choice: दबाई जाती हुई
  rationale: चारों ओर से दबाव में होने का भाव देता है और प्रचंड हवाओं के रूपक के साथ स्वाभाविक बैठता है।
- source_word: γενναίως
  choice: साहस के साथ
  rationale: γενναίως में निहित वीरता और दृढ़ साहस को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπέμεινας
  choice: सहती रहीं
  rationale: लंबे और कठिन कष्ट के बीच दृढ़तापूर्वक टिके रहने का भाव व्यक्त करता है; स्त्री-संबोधन के अनुसार क्रिया स्त्रीलिंग है।
- source_word: εὐσέβεια
  choice: परमेश्वर-भक्ति
  rationale: परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुरूप जीवन—दोनों का संकेत देता है, बिना किसी संप्रदायगत अर्थ को जोड़े।
- source_word: χειμῶνας
  choice: तूफ़ानों
  rationale: शाब्दिक ‘सर्दियों’ के बजाय यहाँ प्रसंगानुकूल रूपकात्मक अर्थ है, जो पहले आए बाढ़ और हवाओं के चित्र को आगे बढ़ाता है।
theological_decisions:
- issue: दार्शनिक-शहादती प्रसंग में πάθη का अर्थ
  choice: मनोवेग
  alternative: वासनाएँ; भावनाएँ; दुःख
  rationale: इस पुस्तक का केंद्रीय विषय भक्तिपूर्ण विवेक द्वारा πάθη को वश में करना है, इसलिए आंतरिक भावनात्मक आवेगों का अर्थ प्रमुख है। फिर भी बाहरी ‘दुःखों’ की संभावना टिप्पणी में सुरक्षित रखी गई है।
- issue: εὐσέβεια का धार्मिक आशय
  choice: परमेश्वर-भक्ति
  alternative: धर्मनिष्ठा; भक्ति
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धा और निष्ठापूर्ण आचरण को दर्शाता है। ‘परमेश्वर-भक्ति’ संदर्भ को स्पष्ट करता है, पर किसी विशिष्ट सांप्रदायिक सिद्धांत को नहीं जोड़ता।
- issue: τοὺς τῆς εὐσεβείας χειμῶνας में संबंधकारक की व्याख्या
  choice: परमेश्वर-भक्ति के तूफ़ान
  alternative: परमेश्वर-भक्ति के कारण आए तूफ़ान; धर्मनिष्ठा की परीक्षाएँ
  rationale: संक्षिप्त संबंधकारक संरचना मूल की अर्थगत कसावट और संभावित अस्पष्टता को बनाए रखती है; मुख्य पाठ यह निश्चित नहीं करता कि तूफ़ान भक्ति से संबंधित हैं या भक्ति के कारण आए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध स्तर रखा गया है। बाढ़, हवाओं और तूफ़ानों के क्रमिक रूपक सुरक्षित हैं। स्त्री को सीधे संबोधित किए जाने के कारण ‘रक्षिका’ और ‘सहती रहीं’ का प्रयोग किया गया है।
