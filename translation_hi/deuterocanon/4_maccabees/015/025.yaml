- source_word: καθάπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γὰρ के व्याख्यात्मक संबंध और καθάπερ की उपमा—दोनों को बनाए रखता है; वाक्य आगे जारी रहने के कारण आरंभ को जानबूझकर अपूर्ण रखा गया है।
- source_word: ἐν βουλευτηρίῳ τῇ ἑαυτῆς ψυχῇ
  choice: अपनी ही आत्मा में, मानो किसी मंत्रणा-सभा में
  rationale: ψυχή के लिए ‘आत्मा’ मूल की मानवशास्त्रीय गहराई रखता है, और βουλευτήριον के विचार-विमर्श वाले रूपक को ‘मंत्रणा-सभा’ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: δεινοὺς ... συμβούλους
  choice: भयंकर सलाहकारों
  rationale: δεινός की भयावह और प्रबल शक्ति तथा συμβούλους के सभा-संबंधी रूपक को बनाए रखता है।
- source_word: ὁρῶσα
  choice: देख रही थी
  rationale: वर्तमान कृदंत को हिंदी की स्वाभाविक क्रियात्मक रचना में व्यक्त किया गया है, जबकि चल रही आंतरिक अनुभूति का भाव बना रहता है।
- source_word: φύσιν
  choice: स्वभाव
  rationale: यह प्राकृतिक प्रवृत्ति या सहज प्रकृति को इंगित करता है; ‘स्वभाव’ संक्षिप्त है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: γένεσιν
  choice: जन्म का बंधन
  rationale: मातृ-संदर्भ में केवल अमूर्त ‘जन्म’ की अपेक्षा संतान को जन्म देने से उत्पन्न संबंध का आशय अधिक स्पष्ट करता है, फिर भी γένεσις के जन्म/उत्पत्ति संबंधी अर्थ पर आधारित है।
- source_word: φιλοτεκνίαν
  choice: अपनी संतानों के प्रति प्रेम
  rationale: संतानों से प्रेम का सीधा अर्थ देता है और केवल मातृ-स्नेह जैसे अधिक व्याख्यात्मक पद तक सीमित नहीं करता।
- source_word: τέκνων στρέβλαν
  choice: अपनी संतानों की यातना
  rationale: στρέβλα मूलतः यातना के यंत्र, विशेषतः ऐंठने वाले यातना-चक्र, को सूचित कर सकता है; यहाँ लक्षणा द्वारा संतानों पर हुई यातना अर्थपूर्ण है। अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
