  text: क्योंकि जैसे वह अपनी ही आत्मा में, मानो किसी मंत्रणा-सभा में, भयंकर सलाहकारों को देख रही थी—स्वभाव, जन्म, अपनी संतानों के प्रति प्रेम और अपनी संतानों की यातना[a]—
