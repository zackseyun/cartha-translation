  text: क्योंकि माताएँ जितनी अधिक मन से दुर्बल[a] और जितनी अधिक संतानों वाली होती हैं, उतनी ही अधिक वे अपनी संतानों से प्रेम करती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘मन से दुर्बल’ के लिए वैकल्पिक अनुवाद: ‘कम साहस वाली।’ यूनानी शब्द ἀσθενόψυχοι मन या आत्मिक-साहस की दुर्बलता बताता है; इसका आशय भावनात्मक दुर्बलता से लेकर साहस की कमी तक हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: '‘अपनी संतानों से प्रेम करती हैं’ का अधिक शाब्दिक रूप: ‘संतान-प्रेमी होती हैं’ (φιλοτεκνώτεραι)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: जितनी अधिक ... उतनी ही अधिक
  rationale: यह तुलनात्मक सहसंबंधी रचना यूनानी वाक्य के अनुपातात्मक तर्क को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: ἀσθενόψυχοι
  choice: दुर्बल-मन वाली
  rationale: यह यौगिक शब्द मन/प्राण की दुर्बलता व्यक्त करता है। यह चयन अर्थ को केवल कायरता तक सीमित किए बिना मूल रूपक को काफी निकटता से रखता है।
- source_word: πολυγονώτεραι
  choice: अधिक संतानवती
  rationale: तुलनात्मक रूप अधिक संतान होने या अधिक संतान उत्पन्न करने वाली होने का भाव देता है। ‘अधिक संतानवती’ तुलनात्मकता को संक्षेप में सुरक्षित रखता है।
- source_word: ὑπάρχουσιν
  choice: होती हैं
  rationale: यहाँ क्रिया विधेय विशेषणों के साथ अस्तित्वसूचक/संयोजक रूप में है; हिन्दी में ‘होती हैं’ स्वाभाविक है।
- source_word: αἱ μητέρες
  choice: माताएँ
  rationale: विषय-संज्ञा का सीधा और गरिमापूर्ण हिन्दी अनुवाद।
- source_word: φιλοτεκνώτεραι
  choice: अपनी संतानों से प्रेम करती हैं
  rationale: शब्द संतान के प्रति गहरे स्नेह को व्यक्त करता है। तुलनात्मक बल ‘उतनी ही अधिक’ में सुरक्षित है।
