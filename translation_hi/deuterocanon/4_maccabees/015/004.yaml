base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/004.yaml
  text: Oh[a], how can I describe the child-loving affections of parents, who imprint the likeness of soul and form in the small, marvelous character of a child[c][b], especially since mothers make fathers more sympathetic toward their children who have been born.
translation:
  language: hi
  text: ओह[a], माता-पिता के अपनी संतान के प्रति प्रेम-भरे उन भावों का मैं किस प्रकार वर्णन करूँ, जो आत्मा और रूप की समानता[b] को बालक की छोटी-सी, अद्भुत छवि में मानो मुहर की तरह अंकित कर देते हैं—विशेषकर इसलिए कि जन्मी हुई संतानों[c] के प्रति माताएँ पिताओं से अधिक संवेदनशील होती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वर्णन करूँ’ का अनुवाद ‘चित्रित करूँ’, ‘प्रस्तुत करूँ’ या ‘चरित्र उकेरूँ’ भी हो सकता है; यूनानी क्रिया की शैली अलंकारिक और ऊँची है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘आत्मा और रूप की समानता’; अर्थात भीतरी स्वभाव और बाहरी आकृति, दोनों में समानता।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से ‘जो जन्मे हैं’ है; इससे बच्चे या संतान अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθολογήσαιμι
  choice: वर्णन करूँ
  rationale: यह अलंकारिक प्रश्न भावों को शब्दों में चित्रित या प्रस्तुत करने की कठिनाई व्यक्त करता है। ‘वर्णन करूँ’ सहज हिन्दी है; पादटिप्पणी ऊँची अलंकारिक ध्वनि बताती है।
- source_word: φιλότεκνα γονέων πάθη
  choice: माता-पिता के अपनी संतान से प्रेम से भरे भाव
  rationale: φιλότεκνα अपनी ही संतान के प्रति प्रेम को सूचित करता है, और πάθη यहाँ गहरे भावनात्मक लगाव के अर्थ में है, न कि अनियंत्रित वासनाओं के अर्थ में।
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: आत्मा और रूप की समानता
  rationale: यह भीतर के स्वभाव और बाहरी रूप, दोनों में समानता को बनाए रखता है और यूनानी पदों को किसी एक मनोवैज्ञानिक अर्थ में सीमित नहीं करता।
- source_word: παιδοχαρακτῆρα
  choice: बच्चे की छोटी-सी अद्भुत छवि
  rationale: दुर्लभ संयुक्त शब्द बच्चे में दिखाई देने वाली आकृति/छाप का बोध कराता है। निकटवर्ती मुहर लगाने की क्रिया के साथ ‘छवि’ प्राकृतिक हिन्दी देती है, जबकि पादटिप्पणी मूल रूपक स्पष्ट करती है।
- source_word: ἐναποσφραγίζοντα
  choice: मानो मुहर की तरह अंकित कर देते हैं
  rationale: क्रिया भीतर या ऊपर मुहर से छाप देने का सजीव रूपक रखती है; ‘अंकित’ के साथ स्पष्ट उपमा आधुनिक हिन्दी में इसे समझने योग्य बनाती है।
- source_word: συμπαθεστέρας
  choice: अधिक संवेदनशील
  rationale: तुलनात्मक रूप संतानों के दुःख-सुख से अधिक गहरे सह-अनुभव या कोमल भावनात्मक जुड़ाव को व्यक्त करता है।
- source_word: τῶν πατέρων ... τὰς μητέρας ... συμπαθεστέρας
  choice: माताएँ पिताओं से अधिक संवेदनशील होती हैं
  rationale: τὰς μητέρας infinitive का कर्ता और τῶν πατέρων तुलना का संबंधकारक है; अतः यूनानी का अर्थ माताओं की तुलना पिताओं से करता है, न कि यह कि माताएँ पिताओं को अधिक संवेदनशील बनाती हैं।
theological_decisions:
- issue: ‘आत्मा और रूप की समानता’ में मनुष्य-विज्ञान संबंधी अर्थ
  choice: आंतरिक और बाहरी दोनों समानताओं को मुख्य पाठ में बनाए रखा
  alternative: इसे केवल ‘स्वभाव और शक्ल की समानता’ कहना
  rationale: यहाँ आत्मा पर कोई व्यवस्थित धर्मसैद्धान्तिक परिभाषा नहीं दी गई, फिर भी ψυχή और μορφή दोनों स्पष्ट रूप से उपस्थित हैं। दोनों को बनाए रखने से कथन की व्यापकता और अलंकारिक तनाव सुरक्षित रहता है।
- issue: माता और पिता की तुलनात्मक संवेदनशीलता
  choice: ‘माताएँ पिताओं से अधिक संवेदनशील होती हैं’
  alternative: ‘माताएँ पिताओं को अधिक संवेदनशील बनाती हैं’
  rationale: यूनानी वाक्यरचना में माताएँ कर्ता, ‘अधिक संवेदनशील’ विधेय और पिता तुलना का मानक हैं। अंग्रेज़ी परामर्श-पाठ का वैकल्पिक वाक्य-विन्यास मूल स्रोत से समर्थित नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और भावप्रधान रखी गई है। आरम्भिक ‘ओह’ मूल के विस्मयात्मक Ὦ को बनाए रखता है। वाक्य की अलंकारिक लंबाई सुरक्षित है, पर डैश से अंतिम कारणवाचक उपवाक्य स्पष्ट किया गया है। अंतिम तुलना का अनुवाद सीधे यूनानी वाक्यरचना से किया गया है, क्योंकि उपलब्ध अंग्रेज़ी परामर्श-पाठ उस संबंध को उलट देता है।
