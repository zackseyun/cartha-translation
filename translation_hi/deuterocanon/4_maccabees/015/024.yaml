  yaml_path: translation/deuterocanon/4_maccabees/015/024.yaml
  text: Even while seeing the destruction of her seven children and the intricate variety of the tortures[a], the noble mother, after embracing them all[b], let them go because of her faith toward God.
translation:
  language: hi
  text: अपने सातों बच्चों का विनाश और यातनाओं के अनेक जटिल रूप देखते हुए भी, उस वीर माता ने उन सबको गले लगाने के बाद[a], परमेश्वर के प्रति अपने विश्वास[b] के कारण उन्हें जाने दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस क्रिया का अर्थ ‘उन सबका अभिवादन करने के बाद’ या ‘उन सबको विदा कहने के बाद’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘परमेश्वर पर अपने भरोसे के कारण’; अथवा ‘परमेश्वर के प्रति अपनी निष्ठा के कारण’।
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: देखते हुए भी
  rationale: यह रियायती भाव व्यक्त करता है और ὁρῶσα के चलते हुए दृश्य को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἑπτὰ τέκνων
  choice: अपने सातों बच्चों
  rationale: τέκνα का अर्थ ‘बच्चे’ है; यद्यपि व्यापक प्रसंग में वे पुत्र हैं, यहाँ यूनानी शब्द के व्यापक अर्थ को रखा गया है। ‘अपने’ सम्बन्ध को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἀπώλειαν
  choice: विनाश
  rationale: शब्द का मूल बल नाश या बरबादी पर है; इस प्रसंग में इसमें बच्चों की मृत्यु भी निहित है, पर अनुवाद उसे आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: τὴν τῶν στρεβλῶν πολύπλοκον ποικιλίαν
  choice: यातनाओं के अनेक जटिल रूप
  rationale: यह सहज हिन्दी में यातनाओं की बहुविधता और जटिलता दोनों व्यक्त करता है; στρεβλά यातना-यंत्रों या उनसे दी जाने वाली यातनाओं की ओर संकेत कर सकता है।
- source_word: ἀπάσασα
  choice: उन सबको गले लगाने के बाद
  rationale: ἀσπάζομαι अभिवादन करने, स्नेह से गले लगाने या विदा कहने का अर्थ दे सकता है। मातृ-सन्दर्भ में ‘गले लगाना’ सम्भाव्य है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἡ γενναία μήτηρ
  choice: उस वीर माता
  rationale: γενναία में साहस और नैतिक उदात्तता दोनों का भाव है; ‘वीर’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἐξελυσεν
  choice: उन्हें जाने दिया
  rationale: क्रिया का मूल भाव खोल देने या मुक्त कर देने का है। यहाँ माता ने बच्चों को मृत्यु का सामना करने से नहीं रोका; ‘जाने दिया’ इस रूपक को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: διὰ τὴν πρὸς θεὸν πίστιν
  choice: परमेश्वर के प्रति अपने विश्वास के कारण
  rationale: διά और कर्मकारक कारण व्यक्त करते हैं; πρὸς सम्बन्ध की दिशा को ‘के प्रति’ बनाए रखता है, और πίστις का मुख्य अनुवाद ‘विश्वास’ है।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; निष्ठा
  rationale: यहाँ πίστις परमेश्वर पर भरोसे या परमेश्वर के प्रति निष्ठा का भाव भी दे सकता है। मुख्य पाठ में व्यापक और पारम्परिक ‘विश्वास’ रखा गया है, और वास्तविक अर्थ-विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘बच्चों’ ने यूनानी τέκνα की व्यापकता, ‘यातनाओं के अनेक जटिल रूप’ ने बहुविधता और जटिलता, तथा ‘जाने दिया’ ने मूल क्रिया के रूपकात्मक खुलेपन को सुरक्षित रखा है।
