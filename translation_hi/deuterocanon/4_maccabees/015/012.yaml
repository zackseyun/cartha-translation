  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: hi
  text: परन्तु माँ ने हर बेटे को अलग-अलग[a] और उन सबको एक साथ, परमेश्वर-भक्ति के लिए मृत्यु[b] की ओर बढ़ने को प्रोत्साहित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक-एक बेटे को ... और सबको एक साथ।” यूनानी पाठ में माँ के प्रत्येक बेटे को अलग-अलग प्रोत्साहित करने और उन सभी को एक समूह के रूप में प्रोत्साहित करने के बीच विरोध है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर-भक्ति की मृत्यु की ओर,” अर्थात ऐसी मृत्यु की ओर जिसे परमेश्वर के प्रति भक्ति अथवा श्रद्धा के कारण सहा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: परन्तु
  rationale: यह पिछले प्रसंग से हल्का विरोध अथवा बलयुक्त संक्रमण दिखाता है; हिन्दी में ‘परन्तु’ इसे गरिमापूर्ण और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καθʼ ἕνα παῖδα
  choice: हर एक बेटे को अलग-अलग
  rationale: καθʼ ἕνα का वितरणात्मक अर्थ ‘एक-एक करके/अलग-अलग’ है, और प्रसंग में παῖδα माँ के पुत्रों के लिए प्रयुक्त है।
- source_word: ὁμοῦ πάντας
  choice: उन सबको एक साथ
  rationale: ὁμοῦ सामूहिकता और πάντας पूर्ण समष्टि को व्यक्त करता है; यह अनुवाद दोनों बातों को बनाए रखता है।
- source_word: ἡ μήτηρ
  choice: माँ
  rationale: पहले से ज्ञात माता का सहज हिन्दी उल्लेख; ‘माँ’ आधुनिक पाठक के लिए स्वाभाविक और भावानुकूल है।
- source_word: ἐπὶ ... προέτρεπεν
  choice: मृत्यु की ओर बढ़ने को प्रोत्साहित किया
  rationale: προτρέπω प्रेरित या प्रोत्साहित करने और ἐπί लक्ष्य की दिशा का भाव देता है; हिन्दी वाक्यांश आग्रह के साथ उस दिशात्मक अर्थ को भी स्पष्ट करता है।
- source_word: τὸν ... θάνατον
  choice: मृत्यु
  rationale: यूनानी पाठ सीधे ‘मृत्यु’ कहता है; प्रसंग शहादत का है, पर उसे मुख्य पाठ में अधिक विशिष्ट नहीं बनाया गया।
- source_word: τῆς εὐσεβείας
  choice: परमेश्वर-भक्ति के लिए
  rationale: εὐσέβεια यहाँ परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा को सूचित करता है; ‘परमेश्वर-भक्ति’ सामान्य ‘धार्मिकता’ से अधिक स्पष्ट है, जबकि जननात्मक सम्बन्ध को ‘के लिए’ द्वारा प्रसंगानुकूल रूप से व्यक्त किया गया है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: परमेश्वर-भक्ति
  alternative: भक्ति; धर्मनिष्ठा; परमेश्वर के प्रति श्रद्धा
  rationale: पुस्तक में भाइयों की मृत्यु परमेश्वर और उसकी व्यवस्था के प्रति निष्ठा से जुड़ी है। ‘परमेश्वर-भक्ति’ धार्मिक आयाम स्पष्ट करती है, पर किसी बाद की सांप्रदायिक पारिभाषिकता को नहीं थोपती।
- issue: τῆς εὐσεβείας और θάνατον के बीच जननात्मक सम्बन्ध
  choice: परमेश्वर-भक्ति के लिए मृत्यु
  alternative: परमेश्वर-भक्ति की मृत्यु
  rationale: यूनानी रचना ऐसी मृत्यु को दर्शाती है जो εὐσέβεια से सम्बद्ध है। मुख्य पाठ में प्रयोजन/कारण का स्वाभाविक अर्थ दिया गया है, जबकि टिप्पणी गुणसूचक सम्भावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किन्तु गरिमापूर्ण शैली। ‘बेटे’ प्रसंगगत पुरुष संतानों को स्पष्ट करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में रखे गए हैं।
