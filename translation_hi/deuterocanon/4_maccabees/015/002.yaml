  text: a mother[a], with two things set before her—piety[b], and the temporary safety of her seven sons according to the tyrant’s promise—
translation:
  language: hi
  text: एक माँ के सामने दो बातें रखी थीं—परमेश्वर के प्रति भक्ति[a] और अत्याचारी के वादे के अनुसार उसके सात पुत्रों की कुछ समय की सुरक्षा[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के प्रति श्रद्धा” अथवा “धर्मनिष्ठा।”
    reason: lexical_alternative
  - marker: b
    text: या, “कुछ समय की प्राणरक्षा।” यूनानी शब्द का अर्थ “छुटकारा” या “उद्धार” भी हो सकता है, पर यहाँ अत्याचारी के वादे के अंतर्गत थोड़े समय के लिए जीवन बचाए जाने की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: एक माँ
  rationale: संज्ञा अनिश्चित रूप में है और वाक्य के प्रवाह में परिस्थितिजन्य ढंग से आती है; ‘एक माँ’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: δυεῖν προκειμένων
  choice: के सामने दो बातें रखी थीं
  rationale: यह पदबंध माँ के सामने निर्णय के लिए उपस्थित दो विषयों की परिस्थिति बताता है और मूल के ‘सामने रखे जाने’ वाले रूपक को बनाए रखता है।
- source_word: εὐσεβείας
  choice: परमेश्वर के प्रति भक्ति
  rationale: यहाँ εὐσέβεια का अर्थ परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा है; यह अनुवाद धार्मिक अभिमुखता को स्पष्ट करते हुए सहज हिन्दी देता है।
- source_word: σωτηρίας προσκαίρου
  choice: कुछ समय की सुरक्षा
  rationale: σωτηρία यहाँ प्राणों के बचाए जाने या सुरक्षित रहने को सूचित करता है, जबकि πρόσκαιρος उसके अस्थायी होने पर बल देता है; ‘उद्धार’ से उत्पन्न हो सकने वाला अनावश्यक पारलौकिक अर्थ टाला गया है।
- source_word: τῆς ἑπτὰ υἱῶν
  choice: उसके सात पुत्रों की
  rationale: ‘उसके’ जोड़ने से μήτηρ के साथ पुत्रों का संबंध हिन्दी में स्वाभाविक रूप से स्पष्ट होता है।
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: अत्याचारी के वादे के अनुसार
  rationale: κατά यहाँ वादे की शर्तों या कथन के अनुरूप होने का भाव देता है; ‘वादा’ ὑπόσχεσις का सरल और वर्तमान हिन्दी रूप है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: परमेश्वर के प्रति भक्ति
  alternative: धर्मनिष्ठा; परमेश्वर के प्रति श्रद्धा
  rationale: विरोध परमेश्वर के प्रति निष्ठा और अस्थायी शारीरिक सुरक्षा के बीच है। चुना हुआ रूप धार्मिक आशय स्पष्ट करता है, पर किसी संप्रदाय-विशेष की शब्दावली नहीं जोड़ता।
- issue: गैर-पारलौकिक प्रसंग में σωτηρία का अनुवाद
  choice: कुछ समय की सुरक्षा
  alternative: अस्थायी प्राणरक्षा; कुछ समय का छुटकारा
  rationale: अत्याचारी का वादा पुत्रों के जीवन को फिलहाल बख्शने से संबंधित है, अनन्त उद्धार से नहीं। फिर भी पादटिप्पणी मूल शब्द के बचाव या छुटकारे वाले अर्थ की गुंजाइश सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल यूनानी अंश वाक्य का अपूर्ण भाग है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है। ‘माँ’ सामान्य पाठक के लिए स्वाभाविक है; ‘अत्याचारी’ τύραννος की नकारात्मक शक्ति को व्यक्त करता है।
