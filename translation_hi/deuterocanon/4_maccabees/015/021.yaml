lexical_decisions:
- source_word: σειρήνιοι μελῳδίαι
  choice: मोहिनी स्त्रियों के गीत
  rationale: यह यूनानी मिथकों की Sirens और उनके लुभावने गायन का संकेत सुरक्षित रखता है; आधुनिक हिन्दी में केवल लिप्यंतरण की अपेक्षा यह अधिक बोधगम्य है।
- source_word: κύκνιοι ... φωναί
  choice: हंसों जैसी ... ध्वनियाँ
  rationale: विशेषण κύκνιοι के हंस-सदृश काव्यात्मक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πρὸς θηλυκίαν
  choice: स्त्रैण ध्वनियाँ
  rationale: असामान्य यूनानी अभिव्यक्ति को उसके ध्वनि-संबंधी और स्त्री-सुलभ गुण के साथ रखा गया है, बिना उसे मनमाने ढंग से 'मोहकता' में बदलने के।
- source_word: ἐφέλκονται
  choice: खींचती हैं
  rationale: क्रिया के आकर्षित करने अथवा अपनी ओर खींचने के सजीव भाव को सुरक्षित रखता है।
- source_word: τέκνων φωναί
  choice: बच्चों के स्वर
  rationale: जननवाचक संरचना और भावपूर्ण श्रव्य बिंब को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετὰ βασάνων
  choice: यातनाओं के बीच
  rationale: बहुवचन βασάνων और उन परिस्थितियों की तीव्रता को बनाए रखता है जिनमें बच्चे पुकार रहे हैं।
- source_word: μητέρα φωνούντων
  choice: अपनी माँ को पुकारते
  rationale: φωνέω के ऊँचे स्वर से पुकारने के भाव को सहज हिन्दी में व्यक्त करता है; 'अपनी' संबंध को स्पष्ट करता है, पर अर्थ में कोई नया पात्र नहीं जोड़ता।
