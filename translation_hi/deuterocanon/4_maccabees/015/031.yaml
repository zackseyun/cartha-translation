base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/031.yaml
  text: For just as Noah’s ark[a], being borne along in the world-filling flood, steadfastly endured the waves,
translation:
  language: hi
  text: क्योंकि जिस प्रकार नूह का जहाज़ संसार को भर देने वाले जलप्रलय में बहाया जाता हुआ[a] दृढ़तापूर्वक लहरों को सह गया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार को भर देने वाले जलप्रलय में बहता हुआ।”
    reason: यूनानी कर्मवाच्य कृदन्त κοσμοφορουμένη का अर्थ जलप्रलय के द्वारा आगे ले जाया जाना या बहाया जाना है।
lexical_decisions:
- source_word: καθάπερ
  choice: जिस प्रकार
  rationale: यह तुलना का आरंभ करता है; ‘जिस प्रकार’ स्वाभाविक और गरिमापूर्ण हिन्दी में उपमा की शक्ति बनाए रखता है।
- source_word: Νῶε
  choice: नूह
  rationale: बाइबलीय नाम का प्रचलित हिन्दी रूप।
- source_word: κιβωτός
  choice: जहाज़
  rationale: नूह के प्रसंग में यह उस विशाल जलयान का स्वाभाविक और प्रचलित हिन्दी नाम है; सामान्य अर्थ ‘सन्दूक’ यहाँ उपयुक्त नहीं।
- source_word: κοσμοπληθεῖ
  choice: संसार को भर देने वाले
  rationale: यूनानी संयुक्त विशेषण जलप्रलय के सर्वव्यापी विस्तार को व्यक्त करता है; यह अनुवाद उसके ‘संसार को भरने’ वाले शाब्दिक चित्र को सुरक्षित रखता है।
- source_word: κατακλυσμῷ
  choice: जलप्रलय
  rationale: नूह के प्रसंग में ‘जलप्रलय’ सामान्य ‘बाढ़’ से अधिक सटीक है और विनाशकारी व्यापक बाढ़ का बोध कराता है।
- source_word: κοσμοφορουμένη
  choice: बहता हुआ
  rationale: कर्मवाच्य कृदन्त जहाज़ के जल के द्वारा आगे ले जाए जाने को दर्शाता है। सहज हिन्दी के लिए ‘बहता हुआ’ चुना गया है, जबकि संयुक्त शब्द की संभावित व्यापकता पादटिप्पणी में दी गई है।
- source_word: καρτερῶς
  choice: दृढ़ता से
  rationale: यह धैर्यपूर्वक टिके रहने और सहने का भाव व्यक्त करता है, जो 4 मक्काबियों में प्रमुख विषय है।
- source_word: ὑπήνεγκεν
  choice: सहता रहा
  rationale: क्रिया का अर्थ दबाव के नीचे टिके रहना या सहना है; अपूर्णतासूचक हिन्दी रूप लहरों के बीच जारी धैर्यपूर्ण सहन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κλύδωνας
  choice: लहरों
  rationale: यह उफनती या अशांत लहरों को दर्शाता है; ‘लहरों’ स्पष्ट और साधारण आधुनिक हिन्दी है।
theological_decisions:
- issue: नूह के जलप्रलय के चित्र का प्रतीकात्मक या प्रतिरूपात्मक विस्तार
  choice: उपमा को पाठ में जितना कहा गया है उतना ही सीधे रखा गया है।
  alternative: इसे शहादत या किसी बाद के धर्मसैद्धान्तिक प्रतिरूप के रूप में स्पष्ट करके बढ़ाना।
  rationale: इस खंड में नूह का जहाज़ दृढ़ सहनशीलता की तुलना के रूप में आता है। अनुवाद बाद की प्रतीकात्मक व्याख्या जोड़े बिना उसी तुलना को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। पद आगे आने वाली तुलना से जुड़ा हुआ खंड है, इसलिए अंत में अल्पविराम रखा गया है। ‘दृढ़ता से’ पुस्तक के सहनशीलता-विषय को बिना अतिरिक्त धर्मसैद्धान्तिक अर्थ जोड़े व्यक्त करता है।
