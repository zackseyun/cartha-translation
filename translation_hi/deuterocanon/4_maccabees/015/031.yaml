  verdict: revise
  source_fidelity: The draft preserves the comparison, Noah’s ark, the world-filling flood, and the waves. However, «सहता रहा» introduces an ongoing/imperfective nuance not expressed by the Greek aorist ὑπήνεγκεν. The footnote’s added ‘इधर-उधर’ is not supported by κοσμοφορουμένη in this context.
  naturalness: The Hindi is generally clear and appropriately elevated. Recasting the passive participle as «बहाया जाता हुआ» better represents the Greek passive and is natural in this literary comparison. «दृढ़तापूर्वक ... सह गया» gives a concise, completed action suitable to the Greek.
  terminology: «नूह का जहाज़», «जलप्रलय», and «लहरें» are suitable modern Hindi biblical terms. «संसार को भर देने वाला» retains the explicit imagery of κοσμοπληθής without expanding it into an interpretive claim.
  issues:
  - severity: medium
    issue: Aspect of «सहता रहा»
    rationale: ὑπήνεγκεν is aorist, denoting that the ark endured/bore the waves; the Hindi progressive «सहता रहा» adds an unmarked continuing-action nuance. «सह गया» more closely conveys the completed verbal presentation while retaining endurance.
  - severity: medium
    issue: Unsupported ‘इधर-उधर’ in footnote
    rationale: The source participle κοσμοφορουμένη conveys being borne/carried along, but does not specifically state that the ark was being carried ‘here and there.’ The note should give only the supported passive alternative.
  revised_text: क्योंकि जिस प्रकार नूह का जहाज़ संसार को भर देने वाले जलप्रलय में बहाया जाता हुआ[a] दृढ़तापूर्वक लहरों को सह गया,
  revised_footnotes:
  - marker: a
    text: या, “संसार को भर देने वाले जलप्रलय में बहता हुआ।”
