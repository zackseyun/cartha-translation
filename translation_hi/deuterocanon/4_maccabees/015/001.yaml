base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/001.yaml
  text: O reasoning[a], tyrant over the passions of children! And godliness is to a mother more longed-for than children.
translation:
  language: hi
  text: हे विवेक[a], संतानों के मनोवेगों के निरंकुश शासक! और माता के लिए ईश्वर-भक्ति उसकी संतानों से भी अधिक अभिलषित है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य अत्यंत संक्षिप्त और अलंकारपूर्ण है। आरम्भ का अनुवाद इस प्रकार भी किया जा सकता है: “हे विवेक, मनोवेगों के निरंकुश शासक!”; इस स्थिति में “संतानों के” का वाक्यगत संबंध अलग समझा जाएगा।'
    reason: alternative_reading
  - marker: b
    text: अर्थात्, “माता के लिए ईश्वर-भक्ति उसकी संतानों से भी अधिक चाहने योग्य है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμέ
  choice: विवेक
  rationale: यह संबोधन उस अनुशासित विचार-शक्ति को व्यक्त करता है जो 4 मकाबियों का केंद्रीय विषय है। ‘विवेक’ आधुनिक हिन्दी में स्वाभाविक है और केवल अमूर्त ‘तर्क’ की अपेक्षा नैतिक निर्णय तथा आत्म-संयम का भाव भी रखता है।
- source_word: τέκνων
  choice: संतानों के / संतानों से
  rationale: τέκνα का अर्थ बच्चे या संतान है। पहली बार संबंधकारक की संक्षिप्त यूनानी रचना को ‘संतानों के’ से रखा गया है; दूसरी बार तुलना को स्वाभाविक हिन्दी में ‘संतानों से’ कहा गया है।
- source_word: παθῶν
  choice: मनोवेगों
  rationale: इस पुस्तक में πάθη प्रायः उन भावनात्मक आवेगों और इच्छाओं को सूचित करता है जिन पर विवेक शासन करता है। ‘मनोवेग’ इस दार्शनिक अर्थ को ‘दुःखों’ या केवल ‘भावनाओं’ से अधिक ठीक व्यक्त करता है।
- source_word: τύραννε
  choice: निरंकुश शासक
  rationale: मूल का ‘तानाशाह/निरंकुश शासक’ वाला सजीव और कुछ विरोधाभासी रूपक बनाए रखा गया है। ‘स्वामी’ अधिक सहज होता, पर मूल की प्रबल प्रभुता को मंद कर देता।
- source_word: εὐσέβεια
  choice: ईश्वर-भक्ति
  rationale: यहाँ शब्द परमेश्वर और उसकी व्यवस्था के प्रति भक्तिपूर्ण निष्ठा को सूचित करता है। ‘ईश्वर-भक्ति’ सामान्य पाठक के लिए स्पष्ट है और बाद की किसी विशिष्ट सांप्रदायिक शब्दावली को नहीं जोड़ता।
- source_word: μητρί
  choice: माता के लिए
  rationale: सम्प्रदान कारक उस मूल्यांकन को दर्शाता है जो माता की दृष्टि से किया गया है; हिन्दी में ‘माता के लिए’ स्वाभाविक है।
- source_word: ποθεινοτέρα
  choice: अधिक अभिलषित
  rationale: तुलनात्मक विशेषण किसी वस्तु के अधिक चाहने या लालसा करने योग्य होने का भाव देता है। ‘अधिक अभिलषित’ मूल की भावात्मक तीव्रता को बनाए रखता है।
theological_decisions:
- issue: यहूदी शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: ईश्वर-भक्ति
  alternative: भक्ति; धर्मनिष्ठा; श्रद्धा
  rationale: पद में माता का अपनी संतानों के प्रति स्वाभाविक लगाव परमेश्वर के प्रति निष्ठा के साथ रखा गया है। ‘ईश्वर-भक्ति’ इस दिशा को स्पष्ट करता है, पर कोई उत्तरकालीन तकनीकी धर्मवैज्ञानिक अर्थ नहीं थोपता।
- issue: पहले खंड की संक्षिप्त और संदिग्ध यूनानी वाक्यरचना
  choice: संबंधकारक τέκνων को παθῶν के साथ रखते हुए मूल की आकस्मिक, विस्मयात्मक शैली बनाए रखना
  alternative: ‘हे विवेक, मनोवेगों के निरंकुश शासक!’ और ‘संतानों’ को वाक्य में किसी दूसरे ढंग से जोड़ना
  rationale: शब्दक्रम स्वाभाविक रूप से ‘संतानों के मनोवेगों’ की अनुमति देता है, पर यूनानी अत्यंत संक्षिप्त है। इसलिए मुख्य पाठ में निकटतम रचना रखी गई है और वैकल्पिक विश्लेषण पादटिप्पणी में बताया गया है।
- issue: माता और संतानों की तुलना की तीव्रता
  choice: ईश्वर-भक्ति को संतानों से अधिक अभिलषित कहना
  alternative: माता अपनी संतानों से अधिक ईश्वर-भक्ति से प्रेम करती है
  rationale: मुख्य पाठ मूल की तुलना को बनाए रखता है और उसे माता की भावनाओं के बारे में अधिक विस्तृत मनोवैज्ञानिक कथन में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। विस्मयात्मक संबोधन और ‘निरंकुश शासक’ का प्रबल रूपक मूल की वक्तृत्वपूर्ण शैली बचाते हैं; ‘अभिलषित’ थोड़ा साहित्यिक होते हुए भी प्रसंग की गंभीरता और ποθεινοτέρα की लालसापूर्ण शक्ति के अनुकूल है।
