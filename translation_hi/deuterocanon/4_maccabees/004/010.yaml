  yaml_path: translation/deuterocanon/4_maccabees/004/010.yaml
  text: And when Apollonius came up with an armed force to seize the money[a], horse-mounted angels appeared beforehand from heaven[b], flashing around with their weapons and putting great fear and terror into them.
translation:
  language: hi
  text: जब अपुल्लोनियुस धन लूटने के लिए हथियारों से सुसज्जित सेना के साथ आगे बढ़ा, तब स्वर्ग से घोड़ों पर सवार स्वर्गदूत उनके सामने प्रकट हुए; वे अपने हथियारों के साथ चारों ओर बिजली-सी चमकते हुए उस सेना के लोगों में बड़ा भय और आतंक भर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνιόντος
  choice: आगे बढ़ा
  rationale: यह अपुल्लोनियुस की लक्ष्य की ओर सैन्य गति को स्वाभाविक हिन्दी में व्यक्त करता है; केवल भौगोलिक ‘ऊपर जाने’ का अनावश्यक अर्थ नहीं थोपता।
- source_word: καθωπλισμένης στρατιᾶς
  choice: हथियारों से सुसज्जित सेना
  rationale: यूनानी पद सेना के हथियारबंद और तैयार होने पर बल देता है; यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: πρὸς τὴν τῶν χρημάτων ἁρπαγήν
  choice: धन लूटने के लिए
  rationale: ἁρπαγή में बलपूर्वक छीनने या लूटने का भाव है; ‘लूटने’ से कार्य की हिंसक और अवैध प्रकृति बनी रहती है।
- source_word: οὐρανόθεν
  choice: स्वर्ग से
  rationale: अलौकिक स्वर्गदूतों के प्रकट होने के प्रसंग में यह केवल भौतिक आकाश की अपेक्षा कथ्य का धार्मिक आशय अधिक ठीक व्यक्त करता है।
- source_word: προυφάνησαν
  choice: प्रकट हुए
  rationale: क्रिया का मुख्य अर्थ सामने प्रकट होना है। यहाँ ‘पहले से’ कहना हिन्दी में अनिश्चित काल-संबंध जोड़ सकता है, जबकि προ- को सामने आने के भाव में समझा जा सकता है।
- source_word: ἔφιπποι ἄγγελοι
  choice: घोड़ों पर सवार स्वर्गदूत
  rationale: यह दोनों तत्वों—उनकी स्वर्गदूतीय पहचान और अश्वारूढ़ रूप—को सीधे और बिना अस्पष्ट उपपद के सुरक्षित रखता है।
- source_word: περιαστράπτοντες τοῖς ὅπλοις
  choice: उनके हथियार चारों ओर बिजली की तरह चमक रहे थे
  rationale: περιαστράπτω की चारों ओर विद्युत-जैसी चमक की सजीव छवि को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: ἐνιόντες
  choice: भर रहे थे
  rationale: यह भीतर उत्पन्न करने या डालने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और कृदन्तीय जारी क्रिया का भाव रखता है।
- source_word: φόβον τε καὶ τρόμον
  choice: बड़ा भय और आतंक
  rationale: दो निकटार्थी संज्ञाओं की तीव्रता और πολύν से व्यक्त परिमाण दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: οὐρανόθεν का अलौकिक प्रसंग में अनुवाद
  choice: स्वर्ग से
  alternative: आकाश से
  rationale: कथा इन आकृतियों को स्वर्गदूत कहती है; इसलिए ‘स्वर्ग से’ पाठ में निहित अलौकिक आयाम को व्यक्त करता है, बिना अतिरिक्त धर्मसिद्धान्त जोड़े।
- issue: ἔφιπποι ἄγγελοι की पहचान और दृश्य रूप
  choice: घोड़ों पर सवार स्वर्गदूत
  alternative: अश्वारोही दूत
  rationale: ‘स्वर्गदूत’ उनकी पहचान और ‘घोड़ों पर सवार’ उनका दृश्य रूप स्पष्ट रखता है; ‘दूत’ अकेले मानवीय संदेशवाहक भी समझा जा सकता है।
- issue: προυφάνησαν में προ- की व्याख्या
  choice: प्रकट हुए
  alternative: पहले ही प्रकट हुए
  rationale: उपसर्ग सामने प्रकट होने की दिशा सूचित कर सकता है; ‘पहले ही’ आक्रमण की समयरेखा को मूल से अधिक निश्चित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। शैली कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई संकेतक नहीं है।
