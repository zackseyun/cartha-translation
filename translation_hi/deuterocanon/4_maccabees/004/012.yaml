  yaml_path: translation/deuterocanon/4_maccabees/004/012.yaml
  text: For he said that he had sinned, so that he was worthy even to die, and that, if he were saved, he would sing the blessedness of the holy place to all people.
translation:
  language: hi
  text: क्योंकि वह कहता था कि उसने पाप किया था और इसलिए वह मरने के भी योग्य था; और यदि उसे बचा लिया जाता, तो वह पवित्र स्थान की धन्यता का सब लोगों के सामने गुणगान करता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पवित्र स्थान की धन्यता की सब लोगों के सामने स्तुति करता।” यूनानी क्रिया भजन के रूप में गाने के साथ-साथ सामान्य रूप से स्तुति करने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: वह कहता था
  rationale: अपूर्ण भूतकाल चल रहे या बार-बार किए गए कथन का संकेत दे सकता है; ‘कहता था’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡμαρτηκώς
  choice: उसने पाप किया है
  rationale: पूर्ण कृदन्त बीते कर्म और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त करता है; कथन के परोक्ष रूप में यह स्वीकारोक्ति स्वाभाविक है।
- source_word: ὥστε καὶ ἀποθανεῖν ἄξιος ὑπάρχειν
  choice: इसलिए वह मरने के भी योग्य है
  rationale: ὥστε परिणामसूचक है और ἄξιος के साथ infinitive दंड के योग्य होने का भाव देता है; ‘भी’ καί की तीव्रता रखता है।
- source_word: πᾶσίν τε ἀνθρώποις
  choice: सब लोगों के सामने
  rationale: सम्प्रदान कारक प्रशंसा के श्रोताओं को सूचित करता है; हिन्दी में सार्वजनिक उद्घोषणा के लिए ‘सब लोगों के सामने’ स्वाभाविक है।
- source_word: ὑμνήσειεν
  choice: गुणगान करेगा
  rationale: यह क्रिया भजनात्मक स्तुति या प्रशंसा का बोध कराती है; ‘गुणगान’ गायन और व्यापक प्रशंसा दोनों की छाया बनाए रखता है।
- source_word: σωθεὶς
  choice: यदि उसे बचा लिया जाए
  rationale: संदर्भ में कृदन्त शर्तसूचक है और मृत्यु से बचाए जाने को सूचित करता है, न कि अनिवार्य रूप से पारिभाषिक आध्यात्मिक उद्धार को।
- source_word: τὴν τοῦ ἱεροῦ τόπου μακαριότητα
  choice: पवित्र स्थान की धन्यता
  rationale: यह अनुवाद μακαριότης की blessedness और ἱερὸς τόπος की शाब्दिक संरचना को संक्षिप्त, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: σωθεὶς का आशय
  choice: मृत्यु से बचाया जाना
  alternative: व्यापक धार्मिक अर्थ में उद्धार पाना
  rationale: कथा-संदर्भ में वक्ता मृत्यु से बचने के बाद पवित्र स्थान का सार्वजनिक गुणगान करने की बात करता है; मूल शब्दावली बाद की पारिभाषिक उद्धार-धारणा को अनिवार्य नहीं बनाती।
- issue: मरने के योग्य होने का कथन
  choice: वक्ता की अपनी पाप-स्वीकारोक्ति और दंड-योग्यता के रूप में रखा गया
  alternative: ईश्वरीय अंतिम न्याय पर सार्वभौमिक सिद्धान्त के रूप में विस्तार करना
  rationale: पद केवल पात्र के कथन को प्रस्तुत करता है; उससे आगे कोई सिद्धान्त आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘पवित्र स्थान’ मूल पदबंध को बनाए रखता है और ‘गुणगान’ ὑμνήσειεν की भजनात्मक तथा सामान्य प्रशंसात्मक दोनों छायाओं को समेटता है।
