  yaml_path: translation/deuterocanon/4_maccabees/004/003.yaml
  text: Simon[a], being hostile to the king’s interests, reported that many tens of thousands of private funds had been stored in the treasuries of Jerusalem, not connected with the temple[c][b], but that these belonged to King Seleucus.
translation:
  language: hi
  text: शमौन राजा के हितों का विरोधी था[a]। उसने सूचना दी कि यरूशलेम के खज़ानों में निजी धन की कई दसियों हज़ार की रकमें[b] जमा हैं। वे मन्दिर की साझी सम्पत्ति नहीं हैं[c], बल्कि राजा सेल्यूकुस की हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी वाक्यांश का रूप असामान्य और संक्षिप्त है। इसका सम्बन्ध “राजा के मामलों,” “राजा के पक्ष” या “राजा के हितों” से भी समझा जा सकता है; प्रसंग के आधार पर यहाँ विरोधी भाव लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “निजी धन की बहुत-सी दस हज़ार की राशियाँ।”
    reason: lexical_alternative
  - marker: c
    text: या, “मन्दिर के साथ साझा नहीं हैं” अथवा “मन्दिर से संबद्ध नहीं हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω
  choice: शमौन राजा के हितों का विरोधी था
  rationale: मुद्रित यूनानी वाक्यांश व्याकरण और अर्थ की दृष्टि से संक्षिप्त तथा कठिन है; कथा में शमौन की मुखबिरी और राजकीय दावे की पृष्ठभूमि विरोधी भाव का समर्थन करती है। अस्पष्टता को पादटिप्पणी में बनाए रखा गया है।
- source_word: μηνύων
  choice: उसने सूचना दी
  rationale: यह क्रिया किसी बात को प्रकट करने या अधिकारियों को उसकी खबर देने को सूचित करती है; प्रसंग में आरोप का भाव है, पर मुख्य पाठ में अनावश्यक रूप से तीखा शब्द नहीं जोड़ा गया।
- source_word: πολλὰς ἰδιωτικῶν χρημάτων μυριάδας
  choice: निजी धन की कई दसियों हज़ार की रकमें
  rationale: मυριάς की दस हज़ार वाली संख्यात्मक शक्ति और ἰδιωτικῶν χρημάτων के निजी स्वामित्व—दोनों को यथासंभव स्वाभाविक हिन्दी में रखा गया है।
- source_word: γαζοφυλακίοις
  choice: खज़ानों
  rationale: यह शब्द धन रखने के कोष-कक्षों या खज़ानों को दर्शाता है; संक्षिप्त आधुनिक हिन्दी में ‘खज़ानों’ स्वाभाविक है।
- source_word: τεθησαυρίσθαι
  choice: जमा हैं
  rationale: पूर्ण infinitive पहले से संचित रखे गए धन को दर्शाता है; हिन्दी में ‘जमा हैं’ उस परिणामी अवस्था को सहज रूप से व्यक्त करता है।
- source_word: τῷ ἱερῷ μὴ ἐπικοινωνούσας
  choice: मन्दिर की साझी सम्पत्ति नहीं हैं
  rationale: ἐπικοινωνέω यहाँ मन्दिर के साथ साझा स्वामित्व या सहभागिता न होने का भाव देता है; पादटिप्पणी में व्यापक वैकल्पिक अर्थ भी दिया गया है।
- source_word: προσήκειν ταῦτα Σελεύκῳ τῷ βασιλεῖ
  choice: राजा सेल्यूकुस की हैं
  rationale: वित्तीय-कानूनी प्रसंग में προσήκειν अधिकार या स्वामित्व के दावे को व्यक्त करता है; हिन्दी में यह सरल और स्पष्ट समतुल्य है।
theological_decisions:
- issue: यरूशलेम के खज़ानों में रखे धन का स्वरूप
  choice: धन को निजी जमा राशि और मन्दिर की साझी सम्पत्ति से अलग बताया गया है।
  alternative: वाक्यांश का अर्थ यह भी हो सकता है कि वह धन मन्दिर के उपयोग में साझे तौर पर उपलब्ध नहीं था या सामान्य रूप से मन्दिर से संबद्ध नहीं था।
  rationale: ἰδιωτικῶν χρημάτων धन को निजी बताता है और μὴ ἐπικοινωνούσας τῷ ἱερῷ मन्दिर के साथ उसकी साझेदारी या संबद्धता का निषेध करता है। अनुवाद इसे मन्दिर की अपनी सम्पत्ति मानकर नहीं चलता, पर अर्थ-सीमा को पादटिप्पणी में खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘शमौन,’ ‘मन्दिर,’ ‘खज़ाना’ और ‘राजा सेल्यूकुस’ सामान्य पाठक के लिए परिचित रूप हैं। कठिन यूनानी वाक्यांश और निजी धन के मन्दिर से सम्बन्ध की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित रखी गई है।
