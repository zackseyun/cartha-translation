base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/013.yaml
  text: Distressed by these words[a], Onias the high priest, although otherwise being careful lest King Seleucus might ever think that Apollonius had been done away with by human plotting and not by divine justice[b], offered some prayer concerning him.
translation:
  language: hi
  text: इन बातों से व्यथित होकर महायाजक ओनियास ने—यद्यपि वह इस बात को लेकर भी सतर्क था कि कहीं राजा सेल्यूकस यह न समझ बैठे कि अपोल्लोनियस का अंत किसी मानवीय षड्यंत्र से हुआ था, न कि ईश्वरीय न्याय से[a]—उसके विषय में प्रार्थना में कुछ कहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपोल्लोनियस को किसी मानवीय षड्यंत्र से मारा गया था, न कि ईश्वरीय न्याय के कारण।”
    reason: ἀνηρῆσθαι का अधिक स्पष्ट अर्थ ‘मारा गया’ हो सकता है, और θείας δίκης को कारणात्मक ढंग से भी व्यक्त किया जा सकता है।
  - marker: b
    text: यूनानी में शाब्दिक रूप से है, “उसने उसके विषय में प्रार्थना में कुछ कहा।” इससे यह स्पष्ट नहीं होता कि प्रार्थना अपोल्लोनियस के लिए थी या उससे जुड़े मामले के बारे में।
    reason: περὶ αὐτοῦ और अनिश्चित τι से उत्पन्न संदर्भगत अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: ἐπαχθεὶς τοῖς λόγοις
  choice: इन बातों से व्यथित होकर
  rationale: ἐπαχθείς भावनात्मक बोझ या पीड़ा को व्यक्त करता है; ‘व्यथित’ इस भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है। λόγοις को प्रसंगानुसार ‘बातों’ कहा गया है।
- source_word: καίπερ ἄλλως εὐλαβηθεὶς
  choice: हालाँकि दूसरी ओर उसे ... आशंका भी थी
  rationale: εὐλαβηθεὶς यहाँ धार्मिक श्रद्धा से अधिक सावधान, आशंकित चिंता का भाव रखता है। ἄλλως को ‘दूसरी ओर’ कहने से उस अतिरिक्त विचार का संकेत मिलता है, बिना उसे मुख्य कारण के रूप में अत्यधिक निश्चित किए।
- source_word: μὴ ποτε νομίσειεν
  choice: कहीं ... यह न समझ बैठे
  rationale: यह हिन्दी प्रयोग किसी संभावित निष्कर्ष को लेकर आशंका व्यक्त करता है और μὴ ποτε की भावी संभावना तथा सावधानी दोनों को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: ἐξ ἀνθρωπίνης ἐπιβουλῆς
  choice: किसी मानवीय षड्यंत्र से
  rationale: ἐπιβουλή किसी व्यक्ति के विरुद्ध रची गई योजना या षड्यंत्र को दर्शाता है। ‘मानवीय षड्यंत्र’ ईश्वरीय न्याय के साथ मूल विरोध को बनाए रखता है।
- source_word: θείας δίκης
  choice: ईश्वरीय न्याय
  rationale: θείας का विशेषणात्मक रूप और δίκης का न्याय-संबंधी अर्थ सीधे बने रहते हैं; ‘परमेश्वर का दंड’ कहने से स्रोत की अपेक्षा अर्थ अधिक विशिष्ट हो जाता।
- source_word: ἀνηρῆσθαι
  choice: का अंत ... हुआ था
  rationale: ἀναιρέω यहाँ मार डाले जाने या मिटा दिए जाने का अर्थ रख सकता है। ‘अंत हुआ’ औपचारिक स्वर बनाए रखता है, जबकि अधिक स्पष्ट ‘मारा गया’ को पादटिप्पणी में दिया गया है।
- source_word: ηὔξατό τι περὶ αὐτοῦ
  choice: उसके विषय में कुछ प्रार्थना की
  rationale: τι की अनिश्चितता को ‘कुछ’ और περὶ αὐτοῦ की अस्पष्टता को ‘उसके विषय में’ सुरक्षित रखता है; इससे यह तय नहीं किया जाता कि प्रार्थना अपोल्लोनियस के लिए थी या उससे जुड़े विषय के बारे में।
theological_decisions:
- issue: θείας δίκης में ईश्वरीय कर्तृत्व और न्याय का स्वरूप
  choice: ईश्वरीय न्याय
  alternative: परमेश्वर का न्याय; ईश्वरीय दंड
  rationale: मूल यूनानी विशेष रूप से ‘ईश्वरीय’ कहता है और δίκη न्याय, न्यायिक निर्णय या दंड का भाव ले सकता है। चुना हुआ रूप इस दावे को बनाए रखता है कि घटना मात्र मानवीय षड्यंत्र का परिणाम नहीं थी, पर उसके स्वरूप को अनावश्यक रूप से सीमित नहीं करता।
- issue: περὶ αὐτοῦ का संदर्भ
  choice: उसके विषय में कुछ प्रार्थना की
  alternative: उसके लिए प्रार्थना की; इस मामले के बारे में प्रार्थना की
  rationale: यूनानी वाक्य यह स्पष्ट नहीं करता कि ओनियास ने अपोल्लोनियस के हित में प्रार्थना की या उससे संबंधित परिस्थिति के विषय में। तटस्थ हिन्दी मूल की वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज रखी गई है। लंबे यूनानी वाक्य की संरचना को डैशों के भीतर आशंका-संबंधी उपवाक्य रखकर सुरक्षित किया गया है, ताकि मुख्य कथन स्पष्ट रहे। व्यक्तिनाम ‘ओनियास’, ‘सेल्यूकस’ और ‘अपोल्लोनियस’ प्रचलित यूनानी रूपों के निकट लिप्यंतरित हैं।
