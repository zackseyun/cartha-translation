  text: राजा सेल्यूकुस की मृत्यु के बाद, उसका पुत्र अन्तियोकुस एपिफ़ानेस राजसत्ता का उत्तराधिकारी बना। वह एक घमण्डी और दुर्जेय[a] मनुष्य था।
