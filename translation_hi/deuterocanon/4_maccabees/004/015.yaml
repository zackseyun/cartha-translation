lexical_decisions:
- source_word: Τελευτήσαντος
  choice: की मृत्यु के बाद
  rationale: τελευτάω के एओरिस्ट संबंध-निरपेक्ष प्रयोग का समय-संबंधी अर्थ स्वाभाविक हिन्दी में व्यक्त करता है और मुख्य घटना से पहले हुई मृत्यु को स्पष्ट रखता है।
- source_word: διάδεχεται
  choice: उत्तराधिकारी हुआ
  rationale: यह क्रिया राजकीय पद या अधिकार के क्रमिक उत्तराधिकार को सूचित करती है; यह चयन ‘कब्ज़ा किया’ जैसे अनावश्यक बलपूर्ण अर्थ से बचता है।
- source_word: τὴν ἀρχήν
  choice: शासन का
  rationale: ἀρχή यहाँ शासकीय अधिकार या राजसत्ता को दर्शाता है। ‘शासन का उत्तराधिकारी हुआ’ स्वाभाविक हिन्दी में इस राजनीतिक अर्थ को व्यक्त करता है, बिना इसे विशेष रूप से ‘राज्य’ या ‘साम्राज्य’ कहे।
- source_word: Ἐπιφανής
  choice: एपिफ़ानेस
  rationale: यह शासक की प्रचलित ऐतिहासिक उपाधि/नाम का भाग है, इसलिए इसका अर्थानुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: ἀνὴρ
  choice: मनुष्य
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग एकवचन है; यहाँ ‘मनुष्य’ वर्णनात्मक पदबंध में गरिमापूर्ण और सहज है।
- source_word: ὑπερήφανος
  choice: घमण्डी
  rationale: यह शब्द अहंकार और दर्प का नकारात्मक भाव रखता है; ‘घमण्डी’ सामान्य आधुनिक हिन्दी में इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: δεινός
  choice: दुर्जेय
  rationale: δεινός के अर्थ-क्षेत्र में भयंकर, भय उत्पन्न करने वाला और प्रबल/दुर्जेय शामिल हैं। इस प्रतिकूल चरित्र-वर्णन में ‘दुर्जेय’ उसकी सामर्थ्य और भयावहता दोनों की गुंजाइश बनाए रखता है।
