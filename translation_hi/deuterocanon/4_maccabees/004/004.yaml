  text: When Apollonius learned each of these things[a], he praised Simon for his loyalty to the king, but went up to Seleucus and reported the treasury of funds;
translation:
  language: hi
  text: इन सब बातों में से हर एक का पता चलने पर अपोल्लोनियुस ने राजा के प्रति शिमोन की हितचिंता की प्रशंसा तो की, पर सेल्युकस के पास ऊपर जाकर धन के भंडार की सूचना दी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने धन-भंडार की बात बता दी।” यूनानी क्रिया का अर्थ सूचना देना या रिपोर्ट करना हो सकता है; कुछ संदर्भों में उसमें किसी छिपी बात को प्रकट करने का भाव भी हो सकता है।
    reason: κατήμηνυε के तटस्थ ‘सूचना देना/रिपोर्ट करना’ और संदर्भानुसार अधिक तीखे ‘भेद प्रकट करना’ वाले संभावित भाव को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: τούτων ἕκαστα
  choice: इन सब बातों में से हर एक
  rationale: यह पदबंध प्रत्येक बात को अलग-अलग या विस्तार से जानने का वितरणात्मक भाव रखता है; हिन्दी में यह रूप उस भाव को स्पष्ट बनाए रखता है।
- source_word: γνούς
  choice: पता चलने पर
  rationale: यह एओरिस्ट कृदन्त मुख्य घटनाओं से पहले जानकारी मिलने की परिस्थिति बताता है; यह हिन्दी कथन में स्वाभाविक है।
- source_word: τῆς εἰς τὸν βασιλέα κηδεμονίας
  choice: राजा के हित के लिए ... चिंता
  rationale: κηδεμονία यहाँ राजा के प्रति दिखाई गई देखभाल, हितचिंता या निष्ठापूर्ण सरोकार को व्यक्त करता है। ‘हित के लिए चिंता’ संरक्षक-जैसी चिंता को रखता है, पर तकनीकी ‘अभिभावकता’ नहीं थोपता।
- source_word: ἐπαινεί
  choice: प्रशंसा ... की
  rationale: वर्तमान रूप यहाँ ऐतिहासिक कथन में है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: ἀναβὰς
  choice: के पास गया
  rationale: क्रिया का शाब्दिक अर्थ ‘ऊपर गया’ है, पर यहाँ यात्रा या राजकीय केंद्र तक जाने का कथात्मक प्रयोग संभव है। लक्ष्य-व्यक्ति के पास जाना हिन्दी में स्वाभाविक है और अनिश्चित भूगोल नहीं जोड़ता।
- source_word: κατήμηνυε
  choice: सूचना दे दी
  rationale: क्रिया किसी बात की खबर देने, सूचित करने या कभी भेद खोलने का अर्थ दे सकती है। मुख्य पाठ में तटस्थ ‘सूचना दे दी’ रखा गया है और अधिक तीखा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τὸν τῶν χρημάτων θησαυρόν
  choice: धन-भंडार
  rationale: यह वाक्यांश संग्रहित धन वाले भंडार को बताता है। ‘धन-भंडार’ संक्षिप्त, स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ Ἀπολλώνιος
  choice: अपोल्लोनियुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: Σίμωνι
  choice: शिमोन
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित देवनागरी रूप।
- source_word: Σέλευκον
  choice: सेल्युकस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
