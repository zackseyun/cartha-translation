translation:
  language: hi
  text: और वह, जो आश्चर्यजनक ढंग से बच गया था, राजा को अपने साथ घटी घटनाएँ बताने के लिए चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδόξως
  choice: आश्चर्यजनक ढंग से
  rationale: यह क्रियाविशेषण असाधारण अथवा अपेक्षा के विपरीत रीति से घटने का भाव देता है। यह चयन उसके बचने की चकित करने वाली प्रकृति को बनाए रखता है, पर अनावश्यक रूप से चमत्कार का अर्थ नहीं जोड़ता।
- source_word: διασωθεὶς
  choice: बच गया था
  rationale: अकर्मक भाव वाला यह भूतकालिक कृदंत संकट से सुरक्षित निकल आने को व्यक्त करता है। आधुनिक हिन्दी में ‘बच गया था’ स्वाभाविक है और पूर्वघटित बचाव को स्पष्ट करता है।
- source_word: ᾤχετο
  choice: वहाँ से चला गया
  rationale: यह रूप प्रस्थान का अर्थ देता है। ‘वहाँ से चला गया’ प्रसंग में सहज है और मूल के जाने के भाव को स्पष्ट रखता है।
- source_word: δηλώσων
  choice: बताने के लिए
  rationale: 'भविष्यकालिक कृदंत यहाँ उद्देश्य बताता है: वह राजा को घटना की सूचना देने गया। ‘बताने के लिए’ सामान्य आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से पर्याप्त है।'
- source_word: τὰ συμβάντα αὐτῷ
  choice: अपने साथ घटी घटनाएँ
  rationale: संज्ञीकृत कृदंत और सम्प्रदान कारक उन घटनाओं का संकेत करते हैं जो उसने स्वयं झेली थीं। यह अभिव्यक्ति मूल का व्यक्तिगत अनुभव और घटनाओं की बहुवचनात्मकता दोनों बनाए रखती है।
