base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/016.yaml
  text: He deposed Onias from the high priesthood and appointed Jason[a], his brother, as high priest, after he promised to give, if he would grant him the office, three thousand six hundred sixty talents per year.
translation:
  language: hi
  text: उसने ओनियास को महायाजक के पद से हटाकर ओनियास के भाई यासोन को महायाजक नियुक्त किया। यासोन ने वादा किया था कि यदि उसे यह पद सौंप दिया जाए, तो वह हर वर्ष 3,660 टैलेंट[a] देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में सामान्यतः ‘देने’ का शब्द है, ‘भुगतान करने’ का नहीं; इस भुगतान का भ्रष्ट स्वरूप संदर्भ से समझ में आता है।
    reason: ‘देना’ के निकट अनुवाद को बनाए रखते हुए ‘भुगतान करना’ वाली संभावित व्याख्या और उसके संदर्भगत नैतिक संकेत को स्पष्ट करना।
lexical_decisions:
- source_word: καταλύσας
  choice: पद से हटाकर
  rationale: यहाँ क्रिया का अर्थ ओनियास की पदावधि समाप्त करके उसे औपचारिक रूप से महायाजक-पद से हटाना है, न कि उसका विनाश करना।
- source_word: τὸν Ὀνίαν τῆς ἀρχιερωσύνης
  choice: ओनियास को महायाजक के पद से
  rationale: संबंधकारक पदबंध इस संदर्भ में महायाजकीय पद से वंचित किए जाने को व्यक्त करता है; हिन्दी में यह संरचना स्पष्ट और स्वाभाविक है।
- source_word: κατέστησεν ἀρχιερέα
  choice: महायाजक नियुक्त किया
  rationale: यह किसी औपचारिक पद पर स्थापना या नियुक्ति को दर्शाता है।
- source_word: ὑποσχόμενον δώσειν
  choice: यासोन ने वादा किया था ... देगा
  rationale: कृदंत यासोन से संबंधित है। अलग वाक्य में उसका नाम दोहराने से हिन्दी में कर्ता स्पष्ट रहता है, जबकि ‘देगा’ यूनानी के सामान्य ‘देने’ के अर्थ को सुरक्षित रखता है।
- source_word: εἰ ἐπιτρέψειεν αὐτῷ τὴν ἀρχήν
  choice: यदि वह उसे यह पद सौंप दे
  rationale: ἀρχή यहाँ प्रसंगानुसार माँगे गए महायाजकीय पद अथवा अधिकार को सूचित करता है। ‘यह पद’ स्वाभाविक हिन्दी है और प्रसंग को अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: κατʼ ἐνιαυτόν
  choice: हर वर्ष
  rationale: यह वार्षिक भुगतान को संक्षिप्त और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τρισχίλια ἑξακόσια ἑξήκοντα τάλαντα
  choice: 3,660 तालन्त
  rationale: मूल संख्या ठीक-ठीक रखी गई है और प्राचीन भार तथा मुद्रा की इकाई ‘तालन्त’ को लिप्यंतरित किया गया है।
theological_decisions:
- issue: यासोन द्वारा दी जाने वाली राशि का नैतिक स्वरूप
  choice: मुख्य पाठ में केवल ‘देगा’ कहा गया है; इसे स्पष्ट रूप से ‘रिश्वत’ नहीं कहा गया।
  alternative: ‘भुगतान करेगा’ या ‘रिश्वत देगा’ कहना।
  rationale: यूनानी पाठ निर्धारित वार्षिक राशि देने के वादे का वर्णन करता है, पर रिश्वत के लिए कोई स्पष्ट शब्द नहीं रखता। संदर्भ में भ्रष्टाचार का संकेत रहते हुए भी अनुवाद उस नैतिक निष्कर्ष को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। लंबे यूनानी वाक्य को दो वाक्यों में बाँटकर यासोन को वादे का कर्ता स्पष्ट किया गया है। सर्वनामों की मूल संबंध-रचना यथासंभव रखी गई है और किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
