lexical_decisions:
- source_word: ὥστε
  choice: यहाँ तक कि
  rationale: यह पद पिछले प्रसंग के परिणाम को आगे बढ़ाता है; हिंदी वाक्य में स्त्रियों तक दंड पहुँचने की परिणति और तीव्रता स्वाभाविक रूप से व्यक्त होती है।
- source_word: γυναῖκας
  choice: स्त्रियों को
  rationale: शब्द सामान्यतः स्त्रियों को दर्शाता है; संदर्भ से वे माताएँ हैं, पर मूल से अधिक विशिष्टता नहीं जोड़ी गई।
- source_word: ὅτι
  choice: के कारण
  rationale: यहाँ ὅτι दंड का कारण बताता है—उन्होंने बच्चों का खतना किया था।
- source_word: περιέτεμον
  choice: खतना करने
  rationale: इम्परफेक्ट रूप पूर्वकालीन/प्रचलित क्रिया को दर्शाता है; कारणवाचक हिंदी संरचना में पूर्वता संदर्भ से स्पष्ट है।
- source_word: τὰ παιδία
  choice: अपने बच्चों का
  rationale: शाब्दिक अर्थ 'बच्चों' है; संबंधवाचक 'अपने' संदर्भ में स्वाभाविक है, जबकि 'लड़कों' कहना मूल से अधिक विशिष्ट होता।
- source_word: μετὰ τῶν βρεφῶν
  choice: उनके शिशुओं समेत
  rationale: βρέφη बहुत छोटे बच्चों या शिशुओं को दर्शाता है; 'समेत' साथ में दंडित किए जाने को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: κατακρημνίζεσθαι
  choice: ऊँचाई से नीचे फेंक दिया गया
  rationale: क्रिया हिंसापूर्वक किसी ऊँचे स्थान से नीचे फेंके जाने का अर्थ देती है; 'चट्टान' जैसी अनुल्लिखित स्थलाकृति नहीं जोड़ी गई।
- source_word: προειδυίας
  choice: हालाँकि वे पहले से जानती थीं
  rationale: कृदंत स्त्रियों के पूर्वज्ञान को बताता है; 'हालाँकि' प्रसंगानुकूल concessive तनाव को व्यक्त करता है।
- source_word: τοῦτο πείσονται
  choice: कि उनके साथ ऐसा ही होगा
  rationale: πείσονται का अर्थ यहाँ किसी घटना या पीड़ा को भुगतना है; हिंदी में यह रूप स्वाभाविक है और भविष्य की अपेक्षा को बनाए रखता है।
