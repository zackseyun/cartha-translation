  alternative: वाचा का चिह्न देना / धार्मिक रीति पूरी करना
  rationale: मूल पाठ यहूदी वाचागत आचरण को दंड का प्रत्यक्ष कारण बताता है। सीधा अनुवाद ऐतिहासिक और धर्मवैचारिक तनाव को बिना नरम किए सुरक्षित रखता है।
