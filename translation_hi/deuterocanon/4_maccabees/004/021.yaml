  text: क्योंकि जब वह मिस्र में टॉलेमी से युद्ध कर रहा था, तब उसने यह भी सुना कि उसके मर जाने की खबर[a] फैलने पर यरूशलेम के लोग अत्यन्त आनन्दित थे; इसलिए उसने तुरन्त उनके विरुद्ध कूच किया।
