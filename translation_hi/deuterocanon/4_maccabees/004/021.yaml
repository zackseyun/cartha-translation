    text: या ‘उसके मर जाने की अफवाह’। यूनानी शब्द φήμη का अर्थ खबर, अफवाह या लोगों में फैली चर्चा हो सकता है; मुख्य पाठ में तटस्थ शब्द ‘खबर’ रखा गया है।
