  yaml_path: translation/deuterocanon/4_maccabees/004/001.yaml
  text: For a certain Simon[a], opposing Onias, who had once held the high priesthood for life, a noble and good man, when he was unable, though slandering him in every way, to harm him on behalf of the nation, went away as an exile[b], intending to betray his homeland.
translation:
  language: hi
  text: क्योंकि शमौन नाम का एक व्यक्ति ओनियास का विरोध करता था—ओनियास वह व्यक्ति था जो कभी जीवन भर महायाजक रहा था और एक सम्माननीय तथा भला मनुष्य था। शमौन हर प्रकार से उस पर झूठे आरोप लगाता रहा, पर राष्ट्र से जुड़े विषयों में[a] उसे हानि पहुँचाने में असमर्थ रहा; इसलिए वह निर्वासित होकर[b] चला गया, अपनी मातृभूमि से विश्वासघात करने के इरादे से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अर्थ ‘राष्ट्र के संबंध में’ या, संभवतः, ‘राष्ट्र की ओर से’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भगोड़े के रूप में’; यूनानी शब्द निर्वासित व्यक्ति अथवा भागे हुए व्यक्ति, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιπολιτευόμενος
  choice: विरोध करता था
  rationale: यह कृदन्त सक्रिय विरोध को व्यक्त करता है और इसमें राजनीतिक विरोध की छाया हो सकती है। ‘विरोध करता था’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक रूप से तकनीकी नहीं बनाता।
- source_word: τὸν ποτε τὴν ἀρχιερωσύνην ἔχοντα διὰ βίου
  choice: जिसने कभी जीवन भर के लिए महायाजक का पद धारण किया था
  rationale: ‘कभी’ पूर्व अवस्था को और ‘जीवन भर के लिए’ पद की निर्धारित अवधि को बनाए रखता है; इस प्रकार यूनानी वाक्यांश का असामान्य कालगत तनाव भी मिटाया नहीं गया।
- source_word: καλὸν καὶ ἀγαθὸν ἄνδρα
  choice: एक श्रेष्ठ और भला मनुष्य
  rationale: यह प्रशंसात्मक युग्म व्यक्ति के सम्माननीय और नैतिक रूप से अच्छे चरित्र को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: διαβάλων
  choice: उस पर झूठे आरोप लगाता रहा
  rationale: διαβάλλω दुर्भावनापूर्ण आरोप लगाने या बदनाम करने का भाव रखता है। यह चयन उस शत्रुतापूर्ण आशय को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: राष्ट्र से जुड़े विषयों में
  rationale: ὑπέρ का सटीक संबंध संदिग्ध है। यह सावधान अनुवाद राष्ट्रीय अथवा सार्वजनिक क्षेत्र का संकेत देता है, पर ‘राष्ट्र की ओर से’ जैसे अधिक निश्चित अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- source_word: οὐκ ἴσχυεν κακῶσαι
  choice: उसे हानि पहुँचाने में सफल न हो सका
  rationale: यह रचना हानि पहुँचाने में असमर्थता व्यक्त करती है। हिन्दी चयन विरोधी प्रयास और उसकी विफलता दोनों को स्वाभाविक ढंग से रखता है।
- source_word: φυγὰς ᾤχετο
  choice: निर्वासित होकर चला गया
  rationale: φυγάς निर्वासित व्यक्ति अथवा भागे हुए व्यक्ति, दोनों को सूचित कर सकता है। मुख्य पाठ में ‘निर्वासित’ कथात्मक प्रसंग के अनुकूल है और विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὴν πατρίδα προδώσων
  choice: अपनी मातृभूमि से विश्वासघात करने के इरादे से
  rationale: भविष्यकालिक कृदन्त उद्देश्य या मंशा प्रकट करता है। ‘मातृभूमि’ πατρίς के पैतृक और देशगत भाव को गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
