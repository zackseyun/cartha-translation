  text: Therefore[a], since his decrees were being despised by the people, he himself was forcing each one of the nation, by tortures, after tasting defiling foods, to renounce Judaism.
translation:
  language: hi
  text: इसलिए, चूँकि लोग उसके आदेशों का तिरस्कार कर रहे थे, वह स्वयं उस जाति के हर एक व्यक्ति को यातनाएँ देकर, अशुद्ध करनेवाले भोजन का स्वाद चखने के बाद, यहूदी धर्म त्यागने के लिए विवश करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόγματα
  choice: आदेशों
  rationale: राजकीय संदर्भ में यह शासक के प्राधिकारी आदेशों को दर्शाता है; ‘आदेश’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: κατεφρονεῖτο
  choice: तिरस्कार करते रहे
  rationale: अपूर्णकाल निरंतर चल रहे तिरस्कार या अवहेलना को व्यक्त करता है; सक्रिय हिन्दी रचना यूनानी कर्मवाच्य का अर्थ सहज रूप से देती है।
- source_word: διὰ βασάνων
  choice: यातनाएँ देकर
  rationale: यह शारीरिक यातना के माध्यम से की गई जबरदस्ती को स्पष्ट करता है और यूनानी बहुवचन की पुनरावृत्त अथवा विविध यातनाओं की शक्ति बनाए रखता है।
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: उस जाति के हर एक व्यक्ति को
  rationale: ‘हर एक व्यक्ति’ वितरणात्मक बल और व्यक्तिगत रूप से निशाना बनाए जाने पर जोर देता है; ‘उस जाति’ यहाँ यहूदी जनसमुदाय को सूचित करता है।
- source_word: μιερῶν ... τροφῶν
  choice: अशुद्ध करनेवाले भोजनों
  rationale: μιερός ऐसे भोजन को दर्शाता है जिसके सेवन से धार्मिक अपवित्रता आती है; यह रूप केवल भोजन की अपनी अवस्था नहीं, उसके अपवित्रकारी प्रभाव को भी व्यक्त करता है।
- source_word: ἀπογευομένους
  choice: स्वाद चखने
  rationale: मूल क्रिया का प्राथमिक अर्थ चखना है। हिन्दी वाक्य में यह यातना द्वारा विवश किए गए कार्यों की प्रक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐξόμνυσθαι
  choice: त्यागने
  rationale: संदर्भ में इसका व्यापक अर्थ अपने धार्मिक-सामुदायिक निष्ठा का परित्याग करना है; संभावित शपथ-संबंधी अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὸν Ἰουδαϊσμόν
  choice: यहूदी धर्म
  rationale: आधुनिक सामान्य हिन्दी में यह धार्मिक निष्ठा और परंपरा का सीधा, सुबोध नाम है; इसे केवल विश्वास या केवल जातीय पहचान तक सीमित नहीं किया गया।
theological_decisions:
- issue: τὸν Ἰουδαϊσμόν का अर्थ-क्षेत्र
  choice: यहूदी धर्म
  alternative: यहूदी जीवन-पद्धति
  rationale: संदर्भ में धार्मिक निष्ठा, प्रथा और सामुदायिक पहचान साथ जुड़े हैं। ‘यहूदी धर्म’ संक्षिप्त और पारदर्शी है, जबकि व्यापक जीवन-पद्धति का आशय संदर्भ में खुला रहता है।
- issue: ἐξόμνυσθαι में शपथ का संभावित भाव
  choice: मुख्य पाठ में ‘त्यागने’
  alternative: ‘शपथ खाकर उससे मुकरने’
  rationale: क्रिया त्याग या अस्वीकार को स्पष्ट रूप से व्यक्त करती है, पर शपथ-संबंधी व्युत्पत्तिगत अथवा प्रयोगगत भाव भी संभव है। मुख्य पाठ को अनावश्यक रूप से संकीर्ण किए बिना विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की लंबी संरचना को हिन्दी में स्वाभाविक बनाया गया है, पर निरंतर तिरस्कार, व्यक्तिगत रूप से हर सदस्य पर अत्याचार, अपवित्रकारी भोजन और धर्मत्याग के सभी मुख्य अर्थ सुरक्षित हैं।
