  text: And when the nation was raging at the proposal and speaking against it[a], they considered it utterly dreadful if those who had entrusted their deposits to the sacred treasury should be deprived of them[b], since
translation:
  language: hi
  text: और जब जनसमुदाय उस प्रस्ताव पर क्रुद्ध होकर उसके विरुद्ध बोल रहा था, तब उन्होंने यह माना कि यदि पवित्र कोष[a] में अपनी धरोहरें सौंपने वाले अपनी धरोहरों से वंचित कर दिए जाएँ, तो यह अत्यन्त भयानक होगा, क्योंकि—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग से यह यरूशलेम के मन्दिर का कोष है।
    reason: cultural_note
  - marker: b
    text: इस पद में वाक्य पूरा नहीं होता; ‘क्योंकि’ से आरम्भ हुआ कारण अगले पद में जारी रहता है।
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ ἔθνους
  choice: जनसमुदाय
  rationale: यहाँ ἔθνος सामूहिक रूप से यहूदी जनता को दर्शाता है। आधुनिक हिन्दी में ‘जनसमुदाय’ इस सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है और ‘राष्ट्र’ के आधुनिक राज्य-संबंधी अर्थ से बचाता है।
- source_word: πρὸς τὸν λόγον
  choice: उस प्रस्ताव पर
  rationale: λόγος का अर्थ कथन, विषय या प्रस्ताव हो सकता है। प्रसंग में मन्दिर के धन से संबंधित घोषित योजना पर प्रतिक्रिया है, इसलिए ‘प्रस्ताव’ उपयुक्त है; ‘उस’ पूर्ववर्ती प्रसंग से संबंध स्पष्ट करता है।
- source_word: σχετλιάζοντος
  choice: रोष प्रकट कर रहा था
  rationale: यह कृदन्त तीव्र आक्रोश या क्षोभ व्यक्त करता है। ‘रोष प्रकट करना’ भाव की तीव्रता और सार्वजनिक प्रतिक्रिया दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀντιλέγοντός τε
  choice: और उसका विरोध भी कर रहा था
  rationale: ἀντιλέγω का मूल भाव किसी बात के विरुद्ध बोलना या आपत्ति करना है। ‘विरोध’ भावगत प्रतिक्रिया से अलग उसके मुखर प्रतिवाद को व्यक्त करता है, जबकि ‘भी’ τε के संयोजक बल को दर्शाता है।
- source_word: πάνδεινον
  choice: अत्यन्त भयानक
  rationale: πάνδεινον में δεινός का प्रबलित अर्थ है। ‘अत्यन्त भयानक’ उसके तीव्र मूल्यांकन को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: νομίσαντες
  choice: उन्होंने यह समझा
  rationale: यहाँ νομίζω किसी बात को ऐसा मानने या उसका निर्णय करने के अर्थ में है। ‘समझा’ स्वाभाविक है और इसके बाद आने वाली विषयवस्तु को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: οἱ τὰς παρακαταθήκας πιστεύσαντες
  choice: अपनी धरोहरें सौंपने वाले
  rationale: παρακαταθήκη सुरक्षित रखने के लिए सौंपी गई वस्तु या जमा है, और πιστεύω यहाँ भरोसे के साथ सौंपने का भाव रखता है। ‘धरोहरें सौंपना’ संपत्ति और विश्वास—दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: τῷ ἱερῷ θησαυρῷ
  choice: पवित्र कोष में
  rationale: ἱερός कोष की पवित्र, मन्दिर-संबंधी प्रकृति बताता है। ‘पवित्र कोष’ यूनानी अभिव्यक्ति के निकट है; हिन्दी में स्थान/जमा के लक्ष्य के लिए ‘में’ स्वाभाविक है।
- source_word: στερηθήσονται
  choice: उनसे वंचित हो जाएँ
  rationale: στερέω का कर्मवाच्य अर्थ किसी वस्तु से वंचित किया जाना या उसे खो देना है। ‘उनसे वंचित हो जाएँ’ धरोहरों की ओर स्पष्ट संकेत करते हुए कर्मवाच्य भाव बनाए रखता है।
- source_word: ὡς
  choice: क्योंकि—
  rationale: पद के अंत में ὡς अगले पद में आने वाले कारण का आरम्भ करता है। ‘क्योंकि’ कारणसूचक संबंध रखता है और दीर्घ विराम-चिह्न बताता है कि वाक्य अगले पद में पूरा होगा।
theological_decisions:
- issue: मन्दिर-संबंधी भाषा को बाद की धर्मसैद्धान्तिक धारणाओं से मुक्त रखना
  choice: पवित्र कोष
  alternative: मन्दिर का कोष
  rationale: यूनानी ἱερός सीधे कोष को पवित्र बताता है; प्रसंग से यह यरूशलेम के मन्दिर का कोष है। मुख्य पाठ में ‘पवित्र कोष’ मूल शब्दावली को सुरक्षित रखता है और पादटिप्पणी प्रसंगगत पहचान स्पष्ट करती है।
- issue: पद के अंत में अधूरे कारणसूचक वाक्य को बनाए रखना
  choice: क्योंकि—
  alternative: ‘क्योंकि’ को हटाकर वाक्य को इसी पद में पूरा करना
  rationale: मूल पाठ का अंतिम ὡς कारण आरम्भ करता है जो अगले पद में जारी रहता है। उसे हटाने या कारण स्वयं जोड़ने से मूल की वाक्यगत अपूर्णता और अगले पद से संबंध मिट जाएगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गरिमापूर्ण रखी गई है। ‘जनसमुदाय’ आधुनिक राजनीतिक अर्थ वाले ‘राष्ट्र’ से बचते हुए सामूहिक जनता को दर्शाता है। मूल यूनानी की लंबी वाक्य-रचना को पठनीय बनाया गया है, पर उसका कारणसूचक अधूरापन सुरक्षित रखा गया है।
