lexical_decisions:
- source_word: τῶν δὲ ἱερέων
  choice: जब याजक
  rationale: ἱερεῖς के लिए यहूदी मंदिर-संदर्भ में ‘याजक’ मानक और सटीक है। संबंधकारक निरपेक्ष रचना तथा δέ को प्रसंगगत पृष्ठभूमि दिखाने वाले ‘जब’ से व्यक्त किया गया है।
- source_word: μετὰ γυναικῶν καὶ παιδίων
  choice: स्त्रियों और बच्चों के साथ
  rationale: यूनानी पाठ केवल ‘स्त्रियों और बच्चों के साथ’ कहता है; स्त्रियों को याजकों की पत्नियाँ बताने वाला संबंध मूल में नहीं जोड़ा गया है।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर में
  rationale: ἱερόν सामान्यतः पूरे मंदिर-परिसर को सूचित कर सकता है; ‘मंदिर’ स्वाभाविक है और इसे केवल भीतरी पवित्रस्थान तक सीमित नहीं करता।
- source_word: ἱκετευόντων
  choice: विनती कर रहे थे
  rationale: यह कृदंत अत्यंत आग्रहपूर्ण प्रार्थना को व्यक्त करता है; ‘विनती’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: ὑπερασπίσαι
  choice: रक्षा करे
  rationale: क्रिया किसी के पक्ष में खड़े होकर बचाव करने का भाव रखती है; संकटग्रस्त पवित्र स्थान के संदर्भ में ‘रक्षा करे’ उपयुक्त है।
- source_word: τοῦ καταφρονουμένου τόπου
  choice: उस स्थान की ... जिसका तिरस्कार किया जा रहा था
  rationale: καταφρονουμένου एक वर्तमान कर्मवाच्य कृदंत है, इसलिए जारी अपमानपूर्ण व्यवहार को स्पष्ट रखा गया है। τόπος का शाब्दिक ‘स्थान’ भी सुरक्षित है।
theological_decisions:
- issue: ‘स्थान’ (τόπος) का संकेत
  choice: मंदिर से संबद्ध पवित्र स्थान, जिसे तिरस्कारपूर्ण खतरे का सामना था
  alternative: व्यापक रूप से नगर, अथवा संकुचित अर्थ में केवल पवित्रस्थान
  rationale: निकटवर्ती वाक्यांश ‘मंदिर में’ के कारण संकेत सर्वाधिक स्वाभाविक रूप से मंदिर-स्थल की ओर है; फिर भी अनुवाद में ‘स्थान’ रखकर यूनानी की सीमा और संभावित व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को इसके आगे जारी रहने वाले यूनानी वाक्यांश के अनुरूप अल्पविराम पर छोड़ा गया है। भाषा साधारण पाठक के लिए सहज रखते हुए मंदिर-संदर्भ की गरिमा बनाए रखती है।
