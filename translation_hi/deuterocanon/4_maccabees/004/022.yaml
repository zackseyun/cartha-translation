  text: And when he had subdued them[a], he issued a decree that if any of them were found living according to the ancestral law, they should be put to death.
translation:
  language: hi
  text: और उन्हें उजाड़ देने के बाद उसने यह राजाज्ञा जारी की कि यदि उनमें से कोई अपने पुरखों की व्यवस्था के अनुसार जीवन बिताता पाया जाए[a], तो उसे मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पुरखों की व्यवस्था के अनुसार आचरण करते दिखाई दें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπόρθησεν
  choice: उजाड़ देने
  rationale: यह क्रिया बलपूर्वक ध्वंस करने, लूटने या रौंद डालने का बोध कराती है। ‘उजाड़ देने’ सैन्य हिंसा और विनाश को बनाए रखता है; केवल ‘अधीन कर लेने’ से इसका विध्वंसकारी बल कम हो जाता।
- source_word: δόγμα ἔθετο
  choice: यह राजाज्ञा जारी की
  rationale: यह पदबंध शासक द्वारा आधिकारिक आदेश घोषित किए जाने को व्यक्त करता है। ‘राजाज्ञा जारी की’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग का शासकीय स्वर बनाए रखता है।
- source_word: φαίνοιεν
  choice: पाया जाए
  rationale: मूल अर्थ ‘दिखाई दे’ या ‘प्रकट हो’ है, पर दंडादेश के प्रसंग में यह किसी व्यक्ति के ऐसे आचरण करते हुए पहचाने या पाए जाने का भाव देता है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: τῷ πατρίῳ ... νόμῳ
  choice: अपने पुरखों की व्यवस्था के अनुसार
  rationale: πάτριος विरासत में मिली पैतृक या पूर्वजों की परंपरा को दर्शाता है, और νόμος यहाँ उस समुदाय की व्यवस्था/कानून है। यह अभिव्यक्ति जातीय-धार्मिक निरंतरता बनाए रखती है।
- source_word: πολιτευόμενοι
  choice: जीवन बिताता
  rationale: यह कृदंत किसी नियम के अधीन अपना आचरण और जीवन-पद्धति चलाने का भाव देता है। ‘जीवन बिताता’ निरंतर जीवन-व्यवहार को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: θάνοιεν
  choice: उसे मार डाला जाए
  rationale: यद्यपि क्रिया का शाब्दिक अर्थ ‘मर जाएँ’ है, राजाज्ञा में यह दंडस्वरूप मृत्यु लागू किए जाने का आशय रखती है। हिन्दी का कर्मवाच्य इस न्यायिक-दंडात्मक बल को स्पष्ट करता है।
theological_decisions:
- issue: τῷ πατρίῳ νόμῳ में यहूदी पहचान-सूचक पैतृक व्यवस्था
  choice: अपने पुरखों की व्यवस्था
  alternative: पैतृक व्यवस्था / अपने पूर्वजों की व्यवस्था
  rationale: यह अनुवाद विरासत में मिली यहूदी जीवन-व्यवस्था को व्यक्त करता है, बिना किसी बाद की संप्रदायगत शब्दावली को आरोपित किए।
- issue: ἐπόρθησεν में विजय और विनाश का संबंध
  choice: उजाड़ देने
  alternative: अधीन कर लेने / रौंद डालने
  rationale: यूनानी क्रिया में केवल राजनीतिक अधीनता नहीं, बल्कि हिंसक विध्वंस का अर्थ भी प्रबल है। इसलिए पाठ के कठोर स्वर को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। ‘राजाज्ञा’ शासकीय प्रसंग को स्पष्ट करती है; ‘पुरखों की व्यवस्था’ सामान्य पाठक के लिए स्वाभाविक रहते हुए मूल के पैतृक और सामुदायिक भाव को बनाए रखती है।
