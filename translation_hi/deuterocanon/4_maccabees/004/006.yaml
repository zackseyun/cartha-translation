  text: with the accursed Simon and a very heavy force[a]. After coming forward, he said that he had come by the king’s commands[b], in order to take the private funds of the treasury.
translation:
  language: hi
  text: शापित शिमोन और एक अत्यन्त दुर्जेय सेना[a] के साथ। पास आकर उसने कहा कि वह राजा की आज्ञा से आया है, कोषागार का निजी धन[b] लेने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘एक अत्यन्त भारी सेना’। इसका अर्थ ‘बहुत बड़ी सेना’ या ‘अत्यन्त प्रबल और भयावह सेना’ भी हो सकता है; यूनानी में ‘भारी’ शब्द सेना की दमनकारी या दुर्जेय शक्ति के लिए रूपक रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: इससे सम्भवतः कोषागार में रखा वह धन अभिप्रेत है जिसे निजी संपत्ति या जमा धन माना जाता था; आवश्यक नहीं कि इसका अर्थ पूरा कोषागार हो।
    reason: cultural_note
lexical_decisions:
- source_word: καταράτου
  choice: शापित
  rationale: यह विशेषण किसी शाप के अधीन या शाप के योग्य व्यक्ति के लिए प्रयुक्त होता है; ‘शापित’ इसकी तीखी निंदात्मक शक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: βαρυτάτου στρατοῦ
  choice: एक अत्यन्त दुर्जेय सेना
  rationale: βαρύς का मूल अर्थ ‘भारी’ है, पर सेना के संदर्भ में यह उसकी प्रबल, दमनकारी या भयावह सामर्थ्य का रूपक हो सकता है। ‘अत्यन्त दुर्जेय सेना’ हिन्दी में स्वाभाविक रहते हुए उस सैन्य भय और भार को व्यक्त करती है; केवल ‘बहुत बड़ी सेना’ कहना संख्या को अनावश्यक रूप से निश्चित कर देता।
- source_word: προσελθών
  choice: पास आकर
  rationale: कृदन्त मुख्य कथन से पहले हुए निकट आने को बताता है। ‘पास आकर’ क्रम और गति दोनों को संक्षेप में व्यक्त करता है।
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: राजा की आज्ञाओं के अनुसार
  rationale: यहाँ सम्प्रदान कारक आदेश के आधार, अधिकार या माध्यम को सूचित कर सकता है। यह अनुवाद उस संबंध को स्पष्ट रखता है, बिना यह तय किए कि उसके पास कोई लिखित राजाज्ञा थी।
- source_word: ἥκειν
  choice: आया है
  rationale: ἥκω आने और फलस्वरूप उपस्थित होने का भाव देता है। ἔλεγεν के बाद परोक्ष कथन को हिन्दी में स्वाभाविक रूप से ‘उसने कहा कि वह … आया है’ कहा गया है।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्य सूचित करता है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τὰ ἰδιωτικὰ … χρήματα
  choice: निजी धन
  rationale: ἰδιωτικός सार्वजनिक या पवित्र संपत्ति से अलग निजी अथवा व्यक्तिगत संपत्ति को सूचित करता है, और χρήματα यहाँ आर्थिक धनराशि है। ‘निजी धन’ इस भेद को बिना अधिक व्याख्या जोड़े बनाए रखता है।
- source_word: τοῦ γαζοφυλακίου
  choice: कोषागार का
  rationale: γαζοφυλάκιον का अर्थ कोषागार या कोष-कक्ष है। मूल पद में ‘मन्दिर’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: λάβοι
  choice: ले जाए
  rationale: ὅπως के साथ यह अभीष्ट कार्य बताता है। संदर्भ विरोधपूर्ण है, फिर भी क्रिया स्वयं ‘छीनना’ अनिवार्य नहीं करती; इसलिए व्यापक अर्थ वाला ‘ले जाए’ चुना गया है।
theological_decisions:
- issue: क्या कोषागार को मुख्य पाठ में ‘मन्दिर का कोषागार’ कहा जाए
  choice: कोषागार
  alternative: मन्दिर का कोषागार
  rationale: व्यापक प्रसंग यरूशलेम के मन्दिर से संबंधित है, पर इस वाक्यांश में यूनानी शब्द केवल ‘कोषागार’ कहता है। मुख्य पाठ में ‘मन्दिर’ जोड़ने से प्रसंगगत पहचान को शब्द के प्रत्यक्ष अर्थ में मिला दिया जाता।
- issue: कोषागार के धन को निजी बताने का आशय
  choice: कोषागार का निजी धन
  alternative: कोषागार में जमा लोगों का निजी धन
  rationale: मूल यूनानी निजी धन और कोषागार का संबंध बताता है, पर स्वामित्व या जमा किए जाने की पूरी व्यवस्था स्पष्ट नहीं करता। संक्षिप्त मुख्य पाठ इस तनाव को रखता है और पादटिप्पणी संभावित आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, कथात्मक और गरिमापूर्ण रखी गई है। पद पूर्ववर्ती वाक्य से जुड़े एक खंड से आरम्भ होता है, इसलिए आरम्भिक ‘… के साथ’ संरचना को मूल के अनुसार बनाए रखा गया है। ‘दुर्जेय सेना’ शाब्दिक ‘भारी सेना’ की अपेक्षा हिन्दी में अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल रूपक और अन्य संभावनाएँ सुरक्षित रखती है।
