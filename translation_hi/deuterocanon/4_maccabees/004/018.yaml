lexical_decisions:
- source_word: ἐξεζήτησεν
  choice: ढूँढ़कर निशाना बनाया
  rationale: क्रिया उद्देश्यपूर्ण और गहन खोज का भाव रखती है। प्रसंग में यह निष्पक्ष जाँच नहीं, बल्कि राष्ट्र को शत्रुतापूर्वक लक्ष्य बनाने की ओर संकेत करती है; संयुक्त हिन्दी पद दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ ἔθνος
  choice: उस राष्ट्र
  rationale: एकवचन सामूहिक संज्ञा का जातीय-राजनीतिक भाव बनाए रखा गया है। यूनानी पाठ में स्पष्ट रूप से न जोड़े गए ‘यहूदी’ शब्द को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐξεπολίτευσεν
  choice: जीवन-रीति में ढाल दिया
  rationale: πολιτεύω से बनी यह क्रिया सार्वजनिक आचरण, नागरिक जीवन या सामुदायिक जीवन-व्यवस्था को आकार देने का भाव दे सकती है। ‘ढाल दिया’ इसके कारक और परिणामसूचक बल को व्यक्त करता है, बिना इसे केवल कुछ अलग-अलग काम करवाने तक सीमित किए।
- source_word: ἐπὶ πᾶσαν παρανομίαν
  choice: हर प्रकार के व्यवस्था-उल्लंघन वाली
  rationale: παρανομία कानून या मान्य व्यवस्था के विरुद्ध आचरण को दर्शाता है और यहाँ पैतृक धार्मिक व्यवस्था के उल्लंघन की ध्वनि भी रखता है। ‘हर प्रकार के’ πᾶσαν की व्यापकता व्यक्त करता है।
theological_decisions:
- issue: यहूदी व्यवस्था के प्रसंग में παρανομία का नैतिक और धार्मिक अर्थ
  choice: व्यवस्था-उल्लंघन
  alternative: अधर्म; दुष्टता; कानूनहीनता
  rationale: यह पद केवल सामान्य बुराई नहीं, बल्कि मान्य व्यवस्था के विरुद्ध जाने को व्यक्त करता है। ‘व्यवस्था-उल्लंघन’ पैतृक व्यवस्था की संभावित ध्वनि बनाए रखता है, पर मुख्य पाठ में इसे किसी विशिष्ट संहिता तक अनावश्यक रूप से सीमित नहीं करता।
- issue: ἐξεπολίτευσεν में बलपूर्वक अलग-अलग पाप करवाना बनाम सामुदायिक जीवन को बदलना
  choice: जीवन-रीति में ढाल दिया
  alternative: हर प्रकार के व्यवस्था-उल्लंघन की ओर ले गया
  rationale: क्रिया में नागरिक या सार्वजनिक जीवन-व्यवहार को आकार देने का संभावित भाव है। चुना हुआ पाठ उस सामुदायिक आयाम को बनाए रखता है और केवल पृथक कृत्यों का अर्थ नहीं देता।
