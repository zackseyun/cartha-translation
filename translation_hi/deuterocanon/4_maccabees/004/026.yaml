  text: Therefore[a], since his decrees were being despised by the people, he himself was compelling each and every one of the nation, by tortures, after tasting defiling foods[b], to renounce Judaism.
translation:
  language: hi
  text: इसलिए, क्योंकि लोग उसके आदेशों का तिरस्कार कर रहे थे, वह स्वयं उस राष्ट्र के हर एक व्यक्ति को यातनाएँ देकर, अपवित्र करने वाले भोजन[a] चखने के बाद, यहूदी धर्म त्यागने की शपथ लेने[b] के लिए विवश करता था।
  philosophy: optimal-equivalence
  footnotes:
