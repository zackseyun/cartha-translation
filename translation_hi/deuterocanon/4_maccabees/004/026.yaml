- issue: μιερῶν τροφῶν का बल
  choice: अशुद्ध करने वाले भोजन
  alternative: अपवित्र भोजन
  rationale: यह चयन भोजन की सामान्य गंदगी नहीं, बल्कि उसे खाने से होने वाली अनुष्ठानिक अपवित्रता को उभारता है।
- issue: ἐξόμνυσθαι में शपथ का भाव
  choice: त्यागने की शपथ लेना
  alternative: त्याग देना
  rationale: मूल क्रिया औपचारिक या शपथपूर्वक अस्वीकार का अर्थ रख सकती है; मुख्य पाठ में इसे रखना अर्थगत बल को सुरक्षित करता है।
