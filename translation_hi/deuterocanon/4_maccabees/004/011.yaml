base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/011.yaml
  text: So Apollonius[a], having fallen half-dead upon the lifeless court of the sanctuary, stretched out his hands to heaven and with tears begged the Hebrews to pray for him[c][b], so that they might appease the heavenly host.
translation:
  language: hi
  text: तब अपोल्लोनियुस अधमरा होकर पवित्रस्थान के निर्जीव प्रांगण[a] में गिर पड़ा। उसने अपने हाथ स्वर्ग की ओर फैलाए और आँसू बहाते हुए इब्रानियों से विनती की कि वे उसके लिए[b] प्रार्थना करके स्वर्गीय सेना[c] को प्रसन्न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान का घिरा हुआ परिसर।” यूनानी शब्द किसी घिरे हुए पवित्र क्षेत्र, अहाते या प्रांगण को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसके विषय में प्रार्थना करें”; यहाँ भाव उसके लिए प्रार्थना करने का है।
    reason: lexical_alternative
  - marker: c
    text: या “स्वर्ग की सेना।” यूनानी पाठ यह स्पष्ट नहीं करता कि इसका संकेत स्वर्गदूतों की ओर है या किसी व्यापक स्वर्गीय शक्ति की ओर।
    reason: alternative_reading
lexical_decisions:
- source_word: καταπεσὼν
  choice: गिर पड़ा
  rationale: अओरिस्ट कृदंत मुख्य विनती से पहले हुई घटना बताता है। हिन्दी में अलग पूर्ण क्रिया वाक्यक्रम और दृश्य की स्वाभाविकता दोनों बनाए रखती है।
- source_word: ἡμιθανὴς
  choice: अधमरा होकर
  rationale: यह यूनानी यौगिक शब्द का निकट, सजीव और सामान्य हिन्दी समतुल्य है; इसका अर्थ लगभग मर चुका भी हो सकता है।
- source_word: ἄψυχον
  choice: निर्जीव
  rationale: शाब्दिक अर्थ ‘जीवनरहित’ है। यह मरते हुए मनुष्य और निर्जीव पवित्र परिसर के बीच यूनानी पाठ के प्रभाव को बनाए रखता है।
- source_word: τοῦ ἱεροῦ περίβολον
  choice: पवित्रस्थान का प्रांगण
  rationale: περίβολος किसी घिरे हुए परिसर, अहाते या प्रांगण को दर्शाता है और ἱερόν पूरे पवित्र परिसर को सूचित कर सकता है। ‘पवित्रस्थान का प्रांगण’ आधुनिक हिन्दी में सहज है।
- source_word: τὰς χεῖρας ἐκτείνων εἰς τὸν οὐρανὸν
  choice: अपने हाथ स्वर्ग की ओर फैलाए
  rationale: यह याचना की मुद्रा और ऊपर की दिशा दोनों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παρεκάλει
  choice: विनती की
  rationale: आँसुओं और संकट के संदर्भ में यह आग्रहपूर्ण याचना का भाव देता है, पर अनावश्यक अतिशयोक्ति नहीं करता।
- source_word: ὅπως περὶ αὐτοῦ εὐξόμενοι
  choice: कि वे उसके लिए प्रार्थना करके
  rationale: περὶ αὐτοῦ शाब्दिक रूप से ‘उसके विषय में’ है, पर यहाँ प्रार्थना की मध्यस्थतापूर्ण दिशा हिन्दी में ‘उसके लिए’ से स्वाभाविक रूप से व्यक्त होती है। फुटनोट शाब्दिक संभावना सुरक्षित रखता है।
- source_word: ἐξευμενίσωνται
  choice: शांत करें
  rationale: क्रिया किसी सत्ता को प्रसन्न या अनुकूल करने का अर्थ रखती है। संकट के इस संदर्भ में ‘शांत करें’ सरल और अर्थानुकूल है, जबकि तकनीकी प्रायश्चित्त-शब्दावली से बचता है।
- source_word: τὸν ἐπουράνιον στρατόν
  choice: स्वर्गीय सेना
  rationale: στρατός का मूल अर्थ सेना या सैन्य समूह है। यह चयन सामूहिक स्वर्गीय शक्ति को बनाए रखता है और उसे सीधे परमेश्वर या स्वर्गदूतों के रूप में निश्चित नहीं करता।
theological_decisions:
- issue: ‘स्वर्गीय सेना’ का अभिप्रेत संदर्भ
  choice: पाठ में इसे ‘स्वर्गीय सेना’ ही रखा गया है और इसकी पहचान अधिक संकीर्ण रूप से नहीं की गई।
  alternative: इसे स्वर्गदूतों की सेना अथवा परमेश्वर के लिए आदरसूचक परोक्ष उल्लेख माना जा सकता है।
  rationale: यूनानी τὸν ἐπουράνιον στρατόν सामूहिक स्वर्गीय सत्ता का उल्लेख करता है, पर उसके सदस्यों या सटीक संदर्भ को स्पष्ट नहीं करता। अनुवाद इस धार्मिक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अधमरा’, ‘विनती’ और ‘स्वर्गीय सेना’ मूल की सजीवता बनाए रखते हैं। लंबे यूनानी वाक्य को हिन्दी में दो वाक्यों में बाँटा गया है, बिना घटनाक्रम या संबंध बदले।
