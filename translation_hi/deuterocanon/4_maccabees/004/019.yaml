  text: so that he not only built a gymnasium at the very citadel of our homeland[b][a], but also abolished the guardianship of the temple.
translation:
  language: hi
  text: इसका परिणाम यह हुआ कि उसने न केवल हमारी मातृभूमि के दुर्ग में ही एक व्यायामशाला बनवाई,[a] बल्कि मंदिर की अभिरक्षा भी समाप्त कर दी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारी मातृभूमि के अक्रा में ही,” यदि ἄκρα को सामान्य ‘दुर्ग’ के बजाय यरूशलेम के विशिष्ट दुर्ग का नाम माना जाए।
    reason: alternative_reading
  - marker: b
    text: या, “मंदिर की देखरेख” या “मंदिर का संरक्षण।” यूनानी में मंदिर को ढहा देने की नहीं, उसकी संरक्षणात्मक अथवा प्रशासनिक अभिरक्षा समाप्त करने की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसका परिणाम यह हुआ कि
  rationale: यह पद पिछले कार्यों के परिणाम को व्यक्त करता है; हिन्दी में यह प्रयोग उसके परिणामसूचक बल को स्वाभाविक ढंग से प्रकट करता है।
- source_word: μὴ μόνον ... ἀλλὰ καὶ
  choice: न केवल ... बल्कि ... भी
  rationale: मूल यूनानी की संतुलित सहसम्बन्धी रचना और उसके आलंकारिक बल को बनाए रखता है।
- source_word: ἐπʼ αὐτῇ τῇ ἄκρᾳ
  choice: ठीक दुर्ग पर
  rationale: ἄκρα किसी ऊँचे किले या दुर्ग को सूचित कर सकता है और αὐτῇ का बल ‘ठीक’ से व्यक्त होता है; सम्भावित विशिष्ट स्थान-नाम ‘अक्रा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῆς πατρίδος ἡμῶν
  choice: हमारी मातृभूमि के
  rationale: πατρίς की पैतृक अथवा स्वदेशीय भूमि की भावना को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: γυμνάσιον
  choice: व्यायामशाला
  rationale: यह हेलेनवादी शारीरिक प्रशिक्षण और शिक्षा की विशिष्ट संस्था है; प्रचलित हिन्दी शब्द मूल संस्था की पहचान को पर्याप्त रूप से बनाए रखता है।
- source_word: κατασκευάσαι
  choice: बनवाई
  rationale: कर्ता द्वारा संस्था का निर्माण अथवा स्थापना कराए जाने का स्वाभाविक हिन्दी रूप; प्रसंग में केवल अपने हाथों बनाने का भाव आवश्यक नहीं है।
- source_word: καταλῦσαι
  choice: समाप्त कर दी
  rationale: अमूर्त प्रशासनिक व्यवस्था के साथ यह क्रिया ‘नष्ट करने’ के बजाय हटाने या भंग करने का अर्थ देती है।
- source_word: κηδεμονίαν
  choice: देखरेख की व्यवस्था
  rationale: यह संरक्षण, उत्तरदायित्व और प्रशासनिक देखभाल के संयुक्त भाव को सहज हिन्दी में व्यक्त करता है, बिना किसी अधिक विशिष्ट संस्थागत सिद्धान्त को आरोपित किए।
- source_word: τοῦ ἱεροῦ
  choice: मन्दिर की
  rationale: इस प्रसंग में ἱερόν मन्दिर-परिसर को सूचित करता है; ‘मन्दिर’ सर्वाधिक स्पष्ट और मानक हिन्दी रूप है।
theological_decisions:
- issue: यरूशलेम के सन्दर्भ में ἄκρα का ऐतिहासिक-स्थानिक अर्थ
  choice: मुख्य पाठ में वर्णनात्मक रूप ‘दुर्ग’
  alternative: विशिष्ट स्थान-नाम ‘अक्रा’
  rationale: यूनानी संज्ञा स्वयं दुर्ग या किलेबन्द ऊँचाई का अर्थ रखती है। मुख्य पाठ पठनीय रहता है, जबकि सम्भावित ऐतिहासिक स्थान-नाम पादटिप्पणी में सुरक्षित है।
- issue: κηδεμονία τοῦ ἱεροῦ का आशय
  choice: मन्दिर की देखरेख की व्यवस्था समाप्त करना
  alternative: मन्दिर का संरक्षण अथवा अभिरक्षण समाप्त करना
  rationale: वाक्य मन्दिर के भौतिक विध्वंस की नहीं, उसकी संरक्षणात्मक या प्रशासनिक देखरेख हटाने की बात करता है; अनुवाद इससे अधिक विशिष्ट व्यवस्था नहीं मानता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यायामशाला’ हेलेनवादी संस्था की सांस्कृतिक विशिष्टता बनाए रखती है। ‘देखरेख की व्यवस्था’ औपचारिक अर्थ को स्पष्ट करती है, पर किसी अनिर्दिष्ट प्रशासनिक ढाँचे को अनावश्यक रूप से निश्चित नहीं करती।
