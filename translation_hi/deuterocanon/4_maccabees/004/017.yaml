lexical_decisions:
- source_word: ἐπέτρεψεν
  choice: अनुमति दी
  rationale: यह क्रिया किसी कार्य को करने की इजाज़त या अधिकार देने का भाव व्यक्त करती है; ‘अनुमति दी’ औपचारिक नियुक्ति का अतिरिक्त अर्थ जोड़े बिना मूल भाव रखता है।
- source_word: ἀρχιερασθαι
  choice: महायाजक के रूप में सेवा करने
  rationale: यह अनंत क्रिया महायाजक का पद धारण करने मात्र से अधिक, उस पद का कार्य करने को व्यक्त करती है। यह हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τοῦ ἔθνους
  choice: राष्ट्र का
  rationale: यहूदी सामुदायिक और राजनीतिक संदर्भ में ἔθνος लोगों को एक राष्ट्रीय इकाई के रूप में दर्शाता है; ‘राष्ट्र’ इस अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀφηγεῖσθαι
  choice: नेतृत्व करने
  rationale: क्रिया का अर्थ प्रधान के रूप में आगे चलना या अगुवाई करना हो सकता है। ‘नेतृत्व करने’ व्यापक अर्थ बनाए रखता है और ‘शासन करने’ की अपेक्षा कम कठोर राजनीतिक अर्थ आरोपित करता है।
theological_decisions:
- issue: उसे दिए गए अधिकार का दायरा
  choice: अनुमति महायाजक के रूप में सेवा करने और राष्ट्र का नेतृत्व करने—दोनों के लिए दी गई है।
  alternative: दूसरे पदबंध का अधिक राजनीतिक अनुवाद ‘राष्ट्र पर शासन करने’ हो सकता है।
  rationale: यूनानी में अनुमति देने वाली एक ही क्रिया के अधीन दो समन्वित अनंत क्रियाएँ हैं। अनुवाद धार्मिक और नागरिक—दोनों आयामों को बनाए रखता है, पर राजनीतिक अधिकार की तीव्रता को मूल से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘और’ से यूनानी δέ का हल्का संयोजक भाव रखा गया है; संदर्भ के बिना अनावश्यक रूप से ‘परन्तु’ जैसा तीखा विरोध नहीं जोड़ा गया।
