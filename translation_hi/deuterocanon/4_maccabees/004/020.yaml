translation:
  language: hi
  text: इन बातों के कारण ईश्वरीय न्याय, क्रोधित होकर, स्वयं अंतियोकस के विरुद्ध युद्ध किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: इन्हीं बातों के कारण
  rationale: यह पदबंध पूर्ववर्णित कार्यों की ओर संकेत करते हुए कारण बताता है; ‘इन्हीं’ उस पीछे की ओर संकेत और बल दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγανακτήσασα
  choice: क्रोधित होकर
  rationale: कृदन्त मुख्य क्रिया से पहले उत्पन्न तीव्र रोष को व्यक्त करता है। ‘क्रोधित होकर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका क्रियाविशेषणात्मक संबंध बनाए रखता है।
- source_word: ἡ θεία δίκη
  choice: ईश्वरीय न्याय
  rationale: δίκη न्याय, न्यायिक दण्ड या प्रतिफल का बोध करा सकता है। यहाँ उसका मानवीकरण हुआ है; ‘ईश्वरीय न्याय’ इस अमूर्त किंतु सक्रिय शक्ति को बिना सीधे ‘परमेश्वर’ कहे सुरक्षित रखता है।
- source_word: αὐτόν τοι τὸν Ἀντίοχον
  choice: स्वयं अन्तियोकुस
  rationale: αὐτόν और τοι अन्तियोकुस पर विशेष बल देते हैं। ‘स्वयं अन्तियोकुस’ लक्ष्य की इस emphatic पहचान को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπολέμησεν
  choice: के विरुद्ध युद्ध करने लगा
  rationale: क्रिया सशक्त युद्ध-संबंधी रूपक है। प्रसंग में यह आरम्भिक/घटनात्मक भाव के साथ ईश्वरीय न्याय की सक्रिय शत्रुता दिखाती है; हिन्दी का यह रूप मानवीकरण को स्पष्ट रखता है।
theological_decisions:
- issue: δίκη का मानवीकरण
  choice: ‘ईश्वरीय न्याय’ को क्रोधित होकर युद्ध करते हुए प्रस्तुत करना
  alternative: ‘ईश्वरीय दण्ड’ या ‘परमेश्वर का न्याय’ कहना
  rationale: यूनानी पाठ δίκη को ऐसी सक्रिय सत्ता के रूप में चित्रित करता है जो क्रोधित होती और युद्ध करती है। चुना हुआ रूप इस साहित्यिक-धर्मवैचारिक तनाव को बनाए रखता है और इसे न तो केवल दण्ड में सीमित करता है, न सीधे परमेश्वर का पर्याय बनाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘अन्तियोकुस’ यूनानी Ἀντίοχος का निकट देवनागरी रूप है। वाक्य में ईश्वरीय न्याय के मानवीकरण और युद्ध-रूपक को जानबूझकर सुरक्षित रखा गया है।
