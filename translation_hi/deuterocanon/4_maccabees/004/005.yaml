lexical_decisions:
- source_word: λαβὼν
  choice: पा लेने के बाद
  rationale: यह λαμβάνω का एओरिस्ट कृदन्त है और मुख्य क्रिया से पहले पूरी हुई कार्रवाई बताता है। प्रसंग में अधिकार को ग्रहण करने के लिए हिंदी में ‘अधिकार पा लेने के बाद’ स्वाभाविक है।
- source_word: τὴν περὶ αὐτῶν ἐξουσίαν
  choice: उन पर अधिकार
  rationale: ἐξουσία यहाँ अधिकार या नियंत्रण को सूचित करता है; περὶ αὐτῶν के साथ ‘उन पर अधिकार’ स्पष्ट और सहज हिंदी है।
- source_word: ταχὺ
  choice: शीघ्र ही
  rationale: यह क्रिया की तेजी बताने वाला क्रियाविशेषण है। ‘शीघ्र ही’ गरिमापूर्ण आधुनिक हिंदी में इसकी व्यापकता बनाए रखता है और ‘तुरंत’ जैसी अधिक प्रबल तात्कालिकता नहीं जोड़ता।
- source_word: εἰς τὴν πατρίδα ἡμῶν
  choice: हमारे देश में
  rationale: πατρίς अपनी जन्मभूमि, मातृभूमि या स्वदेश का बोध कराता है। ‘हमारे देश में’ सामान्य पाठक के लिए स्वाभाविक है और εἰς की गतिशील दिशा को ‘में’ के साथ व्यक्त करता है।
