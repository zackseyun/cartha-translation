lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: ‘क्योंकि’ व्याख्यात्मक γάρ को और ‘जैसे’ तुलनात्मक ὥσπερ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ πατὴρ Ἀαρὼν
  choice: पिता हारून
  rationale: πατήρ यहाँ हारून के लिए पूर्वज-सम्मानसूचक पद है; ‘पिता हारून’ उसके आदरसूचक बल को संक्षेप में सुरक्षित रखता है।
- source_word: τῷ θυμιατηρίῳ καθωπλισμένος
  choice: धूपदान से शस्त्र-सज्जित होकर
  rationale: करण कारक के साथ धूपदान को साधन के रूप में रखता है और καθωπλισμένος की युद्ध-संबंधी सजीव छवि को केवल ‘सुसज्जित’ कहकर हल्का नहीं करता।
- source_word: διὰ τοῦ ἔθνοπλήθους ἐπιτρέχων
  choice: जनसमूह के बीच से दौड़े
  rationale: घने जनसमूह के बीच तेज गति से आगे बढ़ने का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: τὸν ἐμπυριστὴν ἄγγελον
  choice: अग्नि लानेवाले दूत
  rationale: दूत का अग्नि से सक्रिय संबंध बनाए रखता है, पर मुख्य पाठ में उसे निश्चित रूप से ‘विनाश करनेवाला दूत’ नहीं ठहराता।
- source_word: ἐνίκησεν
  choice: पर विजयी हुए
  rationale: νικάω की विजय-संबंधी भाषा को गरिमापूर्ण और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: हारून द्वारा रोकी गई विपत्ति से जुड़े दूत की पहचान
  choice: अग्नि लानेवाले दूत
  alternative: अग्नि का दूत; विनाश करनेवाला दूत
  rationale: यूनानी पद दूत को अग्नि से जोड़ता है, पर उसकी पहचान को स्पष्ट रूप से ‘विनाश करनेवाला दूत’ नहीं कहता। इसलिए संभावित गिनती 16-संबंधी संकेत को पादटिप्पणी में रखा गया है और मुख्य पाठ की अस्पष्टता सुरक्षित है।
