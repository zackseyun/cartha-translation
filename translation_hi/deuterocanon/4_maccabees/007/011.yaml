  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘शस्त्र-सज्जित’ मूल की युद्धात्मक उपमा को सुरक्षित रखता है। पद आगे जारी रहने वाली तुलना का आरंभ है, इसलिए अंत में अल्पविराम रखा गया है।
