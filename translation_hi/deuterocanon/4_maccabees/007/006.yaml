base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/006.yaml
  text: O priest[a], worthy of the priesthood, you did not defile your sacred teeth, nor did you make your stomach—which had room for godliness and purity—a partner in defiling food.
translation:
  language: hi
  text: हे याजक, याजकाई के योग्य, तूने अपने पवित्र दाँतों को अशुद्ध नहीं किया, और न अपने उस पेट को—जिसने परमेश्वर के प्रति भक्ति और शुद्धता को स्थान दिया था—अपवित्र भोजन करने में सहभागी बनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और न अपने पेट को अपवित्र भोजन में सहभागी बनाया।” यूनानी शब्द ऐसे भोजन में सहभागिता का संकेत देता है जो धार्मिक या नैतिक अशुद्धता लाता है।
    reason: दुर्लभ यूनानी संयुक्त शब्द μιεροφαγίᾳ में अपवित्र भोजन करने की क्रिया और अपवित्र भोजन—दोनों का भाव सम्भव है।
lexical_decisions:
- source_word: Ὦ ἄξιε τῆς ἱερωσύνης ἱερεῦ
  choice: हे याजक, जो याजक-पद के योग्य है
  rationale: सम्बोधन और प्रशंसा दोनों को बनाए रखता है तथा ἱερεῦ और ἱερωσύνης की जानबूझकर की गई पुनरुक्ति को हिन्दी में व्यक्त करता है।
- source_word: ἐμίανας
  choice: अशुद्ध नहीं किया
  rationale: यहाँ धार्मिक तथा नैतिक अपवित्रता का भाव है; ‘अशुद्ध करना’ आधुनिक हिन्दी में सहज रहते हुए शुद्धता-संबंधी भाषा को बनाए रखता है।
- source_word: τοὺς ἱεροὺς ὀδόντας
  choice: अपने पवित्र दाँतों को
  rationale: मूल की असाधारण और सजीव शारीरिक छवि को बिना अमूर्त बनाए सुरक्षित रखता है।
- source_word: θεοσέβειαν
  choice: परमेश्वर के प्रति भक्ति
  rationale: θεοσέβεια का अर्थ परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा है; यह पद ‘धार्मिकता’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: καθαρισμόν
  choice: शुद्धता
  rationale: सन्दर्भ में धार्मिक और नैतिक शुद्धता दोनों का संकेत है; ‘शुद्धता’ इस तनाव को किसी एक अनुष्ठानिक अर्थ तक सीमित नहीं करती।
- source_word: χωρήσασαν γαστέρα
  choice: उस पेट को—जिसमें ... के लिए स्थान था
  rationale: χωρέω के ‘स्थान रखना/समाना’ वाले रूपक को हल्की स्वाभाविकता के साथ बनाए रखता है।
- source_word: ἐκοινώνησας
  choice: सहभागी बनाया
  rationale: क्रिया के साहचर्य अथवा सहभागिता के भाव को और वाक्य में पेट को सहभागी बनाने की संरचना को सुरक्षित रखता है।
- source_word: μιεροφαγίᾳ
  choice: अशुद्ध करनेवाले भोजन में
  rationale: यह दुर्लभ संयुक्त शब्द अशुद्ध अथवा अपवित्र भोजन करने में सहभागिता को सूचित करता है। मुख्य पाठ में भोजन का आशय स्पष्ट है, जबकि पादटिप्पणी ‘खाने’ की सम्भावना सुरक्षित रखती है।
theological_decisions:
- issue: शारीरिक अंगों पर लागू धार्मिक शुद्धता की भाषा
  choice: ‘पवित्र दाँत’ और भक्ति तथा शुद्धता के लिए स्थान रखने वाले पेट की ठोस छवि बनाए रखी गई
  alternative: इसे सामान्य कथन के रूप में प्रस्तुत करना कि उसने अशुद्ध भोजन खाने से इनकार किया
  rationale: यूनानी पाठ जानबूझकर सजीव शारीरिक और धार्मिक भाषा का प्रयोग करता है। इसे बनाए रखने से आहार-संबंधी निष्ठा और शहादत की अलंकारिक शक्ति सुरक्षित रहती है।
- issue: μιεροφαγίᾳ में भोजन और खाने के बीच अर्थगत अस्पष्टता
  choice: मुख्य पाठ में ‘अशुद्ध करनेवाले भोजन में’
  alternative: ‘अशुद्ध करनेवाले खाने में’ अथवा ‘अपवित्र भोजन करने में’
  rationale: यह शब्द अशुद्ध वस्तु खाने और उस खाने की क्रिया में सहभागिता—दोनों को छू सकता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी वैकल्पिक क्रियात्मक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक सम्बोधन रखा गया है। ‘तूने’ एकवचन प्राचीन सम्बोधन की सीधी शक्ति बनाए रखता है; भाषा को अत्यधिक संस्कृतनिष्ठ बनाने से बचते हुए याजक-पद, पवित्रता और सहभागिता की धार्मिक शब्दावली सुरक्षित रखी गई है।
