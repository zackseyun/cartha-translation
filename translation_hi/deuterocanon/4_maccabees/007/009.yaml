  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की तीन समानांतर क्रियाएँ और कर्म बनाम कथन का विरोध सुरक्षित है। ‘विधि-निष्ठ जीवन-रीति’ पैतृक व्यवस्था के प्रति निष्ठा का भाव देता है, पर किसी विशिष्ट सांप्रदायिक शब्दावली को नहीं थोपता।
