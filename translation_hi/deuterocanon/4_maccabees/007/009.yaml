  yaml_path: translation/deuterocanon/4_maccabees/007/009.yaml
  text: You[a], father, confirmed our law-abiding way by our endurance unto glory, and, speaking honorably of holiness, you did not abolish it, and by your deeds you certified the words of philosophy[b].
translation:
  language: hi
  text: हे पिता, आपने धीरज के द्वारा हमारी विधि-निष्ठ रीति को महिमा के लिए[a] दृढ़ ठहराया; पवित्रता का आदरपूर्वक उल्लेख करके आपने उसे निरस्त नहीं किया, और अपने कामों के द्वारा दर्शन के कथनों[b] को प्रमाणित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘महिमा के परिणामस्वरूप।’ यूनानी εἰς δόξαν लक्ष्य या परिणाम—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दर्शन की शिक्षाओं/दलीलों।’ यूनानी λόγοι का अर्थ ‘कथन,’ ‘तर्क’ या ‘शिक्षाएँ’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: हे पिता
  rationale: यह बिना किसी संबंधवाचक सर्वनाम के एकवचन संबोधन है; इसलिए ‘हे हमारे पिता’ नहीं जोड़ा गया। ‘हे’ हिन्दी में संबोधन को स्वाभाविक और स्पष्ट बनाता है।
- source_word: εὐνομίαν ἡμῶν
  choice: हमारी विधि-निष्ठ जीवन-रीति
  rationale: εὐνομία केवल वैधानिकता नहीं, बल्कि उत्तम व्यवस्था अथवा विधि के अनुसार जीने की रीति को व्यक्त करता है। यह चयन उसके व्यावहारिक और नैतिक दोनों पक्षों को रखता है।
- source_word: διὰ τῶν ὑπομονῶν
  choice: हमारे धीरज के द्वारा
  rationale: ὑπομονή कष्ट में टिके रहने और धीरज धरने का भाव देता है; διά के साथ संबंधकारक साधन को दर्शाता है। यूनानी बहुवचन को सहज हिन्दी में सामूहिक एकवचन से व्यक्त किया गया है। ‘हमारे’ यूनानी में अलग से नहीं है, पर प्रसंग और निकटवर्ती ἡμῶν के संबंध को दर्शाता है; इसे ‘आपके’ नहीं किया गया।
- source_word: εἰς δόξαν
  choice: महिमा तक
  rationale: εἰς में लक्ष्य अथवा परिणाम की दिशा निहित है। ‘महिमा तक’ इस गति को बनाए रखता है, जबकि उसकी संभावित लक्ष्यगत व्याख्या पादटिप्पणी में दी गई है।
- source_word: ἐκύρωσας
  choice: दृढ़ ठहराया
  rationale: क्रिया किसी बात को वैध, पुष्ट अथवा स्थापित करने का भाव देती है। ‘दृढ़ ठहराया’ पिता के सहनशील आचरण द्वारा जीवन-रीति की पुष्टि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἁγιαστίαν
  choice: पवित्रता
  rationale: यह संज्ञा पवित्रता अथवा पावन दशा को सूचित करती है; धार्मिक-नैतिक प्रसंग में ‘पवित्रता’ सर्वाधिक सहज है।
- source_word: σεμνολογήσας
  choice: आदरपूर्वक बोलकर
  rationale: यह कृदंत गरिमापूर्ण अथवा श्रद्धापूर्ण वाणी का भाव रखता है। इसे केवल ‘सम्मान करके’ या ‘महिमा करके’ कहना मूल की वाचिक धारणा को मिटा देता।
- source_word: οὐ κατέλυσας
  choice: उसे निष्फल नहीं किया
  rationale: καταλύω यहाँ कथित पवित्रता को अपने आचरण से गिरा देने, निरस्त करने या प्रभावहीन बनाने का भाव देता है। ‘निष्फल नहीं किया’ हिन्दी में इस अर्थ को स्पष्ट रखता है, बिना भौतिक विनाश का भ्रम पैदा किए।
- source_word: διὰ τῶν ἔργων
  choice: अपने कामों के द्वारा
  rationale: διά साधन बताता है और ἔργα कथनों के विपरीत प्रत्यक्ष कर्मों को। एकवचन संबोधन के कारण हिन्दी में स्वाभाविक रूप से ‘अपने’ प्रयुक्त है।
- source_word: ἐπιστοποίησας
  choice: प्रमाणित किया
  rationale: क्रिया साक्ष्य देकर पुष्टि या प्रमाणीकरण करने का अर्थ रखती है; कामों द्वारा कथनों की सत्यता सिद्ध करने के लिए ‘प्रमाणित किया’ सटीक और सहज है।
- source_word: τοὺς τῆς φιλοσοφίας λόγους
  choice: दर्शन के कथनों
  rationale: φιλοσοφία को पुस्तक की यूनानी दार्शनिक शब्दावली के अनुरूप ‘दर्शन’ रखा गया है। λόγοι का मूल वाचिक अर्थ ‘कथनों’ में बचता है, जबकि ‘शिक्षाओं’ और ‘तर्कों’ की संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: 4 मकाबियों में φιλοσοφία का अर्थ
  choice: दर्शन
  alternative: बुद्धि अथवा विवेकपूर्ण शिक्षा
  rationale: रचना जानबूझकर हेलेनिस्टिक दार्शनिक शब्दावली का उपयोग करती है। ‘दर्शन’ उस वैचारिक संसार को सुरक्षित रखता है और उसे सामान्य ‘बुद्धि’ में नहीं बदलता।
- issue: धीरज का संबंध
  choice: हमारे धीरज के द्वारा
  alternative: आपके धीरज के द्वारा अथवा धीरज के द्वारा
  rationale: यूनानी διὰ τῶν ὑπομονῶν में स्पष्ट संबंधवाचक सर्वनाम नहीं है। निकटवर्ती ἡμῶν के कारण ‘हमारे’ संभव है और प्रमाणित परामर्श-पाठ भी यही संबंध रखता है; ‘आपके’ जोड़ना मूल से अधिक स्पष्टता थोपता।
