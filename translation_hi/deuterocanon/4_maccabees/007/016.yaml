lexical_decisions:
- source_word: γέρων
  choice: एक वृद्ध
  rationale: यह संज्ञा एक वृद्ध पुरुष को सूचित करती है। ‘एक वृद्ध’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी के पुल्लिंग एकवचन को बनाए रखती है।
- source_word: τῶν μέχρι θανάτου βασάνων
  choice: मृत्यु तक की यातनाओं
  rationale: βάσανοι कठोर शारीरिक यातनाओं को दर्शाता है, और μέχρι θανάτου उनकी सीमा मृत्यु तक बताता है। यह संक्षिप्त अनुवाद मूल की तीव्रता और विस्तार दोनों सुरक्षित रखता है।
- source_word: περιεφρόνησεν
  choice: तुच्छ जाना
  rationale: क्रिया का अर्थ किसी वस्तु को बहुत कम महत्त्व देना या उसका तिरस्कार करना है। ‘तुच्छ जाना’ यह भाव व्यक्त करता है कि वृद्ध ने यातनाओं को अपनी निष्ठा की तुलना में नगण्य समझा।
- source_word: διʼ εὐσέβειαν
  choice: ईश्वर-भक्ति के कारण
  rationale: इस पुस्तक में εὐσέβεια विशेष रूप से परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा का भाव रखती है। διά का कारणवाचक अर्थ मुख्य पाठ में स्वाभाविक है; प्रयोजनवाचक संभावना पादटिप्पणी में रखी गई है।
- source_word: ὁμολογουμένως
  choice: निस्संदेह
  rationale: यह क्रियाविशेषण ऐसी परिणति को व्यक्त करता है जिसे स्वीकार्य या स्पष्ट माना गया है। ‘निस्संदेह’ हिन्दी में उसके आलंकारिक निष्कर्ष-बल को सहज रूप से पहुँचाता है।
- source_word: ἡγεμὼν
  choice: शासक
  rationale: दार्शनिक संदर्भ में यह शासन या नियंत्रण रखने वाले को दर्शाता है। ‘शासक’ भावावेगों पर विवेक की प्रभुता को स्पष्ट करता है।
- source_word: τῶν παθῶν
  choice: भावावेगों
  rationale: यहाँ πάθη सामान्य भावनाएँ या दुःख नहीं, बल्कि मनुष्य को प्रेरित और विचलित करने वाले प्रबल आवेग हैं। ‘भावावेग’ दार्शनिक अर्थ को रखता है और ‘वासनाएँ’ के अनावश्यक संकुचित अर्थ से बचता है।
- source_word: ὁ εὐσεβὴς λογισμός
  choice: भक्तिपूर्ण विवेक
  rationale: 'यह पुस्तक का केंद्रीय पद है: ऐसा विचारशील विवेक जो परमेश्वर के प्रति भक्ति से निर्देशित है। ‘भक्तिपूर्ण विवेक’ उसके बौद्धिक और भक्तिपरक दोनों आयामों को सहज हिन्दी में बनाए रखता है।'
theological_decisions:
- issue: ὁ εὐσεβὴς λογισμός का दार्शनिक-धार्मिक अर्थ
  choice: भक्तिपूर्ण विवेक
  alternative: ईश्वर-भक्ति से निर्देशित विवेक; धर्मनिष्ठ तर्कबुद्धि
  rationale: चुना हुआ रूप विवेक की शासनकारी बुद्धि और उसकी भक्तिपरक दिशा दोनों को व्यक्त करता है, बिना किसी बाद की सांप्रदायिक या दार्शनिक व्यवस्था को पाठ पर आरोपित किए।
- issue: διʼ εὐσέβειαν का कारणवाचक अथवा प्रयोजनवाचक बल
  choice: ईश्वर-भक्ति के कारण
  alternative: ईश्वर-भक्ति के लिए
  rationale: संदर्भ में वृद्ध द्वारा यातनाओं को तुच्छ जानने का कारण अधिक प्रमुख प्रतीत होता है, पर यूनानी पदबंध प्रयोजन का निकट अर्थ भी दे सकता है; इसलिए उस संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पुस्तक के केंद्रीय दार्शनिक शब्दों के लिए ‘भक्तिपूर्ण विवेक’ और ‘भावावेग’ चुने गए हैं, ताकि पाठ स्वाभाविक हिन्दी में रहे और मूल की वैचारिक धार भी सुरक्षित रहे।
