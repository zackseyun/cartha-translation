  text: अतः, यदि एक वृद्ध ने ईश्वर-भक्ति के कारण[a] मृत्यु तक की यातनाओं को तुच्छ जाना, तो निस्संदेह भक्तिपूर्ण विवेक भावावेगों का शासक है।
