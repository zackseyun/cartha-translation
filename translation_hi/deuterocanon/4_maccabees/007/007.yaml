base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/007.yaml
  text: O you who are in harmony with the law and a philosopher of the divine way of life[a][b].
translation:
  language: hi
  text: हे व्यवस्था से सामंजस्य रखनेवाले[a] और ईश्वरीय जीवन-पद्धति के दार्शनिक[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था के अनुरूप रहनेवाले” अथवा “व्यवस्था से सहमत रहनेवाले।” यूनानी शब्द में सुर मिलने या सामंजस्य का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर-भक्त जीवन-पद्धति के दार्शनिक” अथवा “ईश्वरीय जीवन के दार्शनिक।” यूनानी पद जीवन को जीने के ढंग और परमेश्वर के प्रति भक्ति से चिह्नित जीवन—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: हे
  rationale: सम्बोधन-सूचक अव्यय का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; यह यूनानी वाक्य की ऊँची आलंकारिक शैली बनाए रखता है।
- source_word: σύμφωνε
  choice: सामंजस्य रखनेवाले
  rationale: σύμφωνος में सहमति के साथ स्वर-सामंजस्य का रूपक भी निहित है। यह चयन उस रूपक को बचाते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: यहाँ षष्ठी रूप σύμφωνε पर निर्भर है और यहूदी सन्दर्भ में पैतृक/ईश्वरीय व्यवस्था की ओर संकेत करता है। हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ νόμος का सुस्थापित और सहज रूप है।
- source_word: καὶ
  choice: और
  rationale: दोनों सम्बोधनात्मक विशेषणों को जोड़नेवाला सामान्य समुच्चयबोधक।
- source_word: φιλόσοφε
  choice: दार्शनिक
  rationale: ‘दार्शनिक’ यूनानी दार्शनिक शब्दावली को स्पष्ट रूप से सुरक्षित रखता है; ‘ज्ञानी’ या ‘चिंतक’ अर्थ को अनावश्यक रूप से सामान्य बना देते।
- source_word: θείου
  choice: ईश्वरीय
  rationale: θεῖος का निकट और औपचारिक हिन्दी रूप, जो इसे सीधे ‘परमेश्वर का’ कहकर सम्बन्ध को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: βίου
  choice: जीवन-पद्धति
  rationale: βίος यहाँ केवल जीवन-अस्तित्व नहीं, बल्कि जीने के ढंग या आचरण-पद्धति को भी व्यक्त कर सकता है। ‘जीवन-पद्धति’ इस भाव को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: θείου βίου का अर्थ
  choice: ईश्वरीय जीवन-पद्धति
  alternative: परमेश्वर-भक्त जीवन-पद्धति; ईश्वरीय जीवन
  rationale: चुना हुआ रूप यूनानी की संक्षिप्त, ऊँची शैली और उसकी वास्तविक अर्थगत खुलावट को बनाए रखता है। ‘परमेश्वर-भक्त’ सम्भव भावार्थ है, पर वह θεῖος को अधिक व्याख्यात्मक बना देता है।
- issue: νόμου को विशिष्ट उपाधि की तरह प्रस्तुत करना
  choice: व्यवस्था
  alternative: मूसा की व्यवस्था
  rationale: सन्दर्भ में मूसा की व्यवस्था अभिप्रेत होने की सम्भावना प्रबल है, पर यूनानी पद स्वयं ‘मूसा की’ नहीं कहता। इसलिए अनकहा विशेषण नहीं जोड़ा गया।
translation_notes:
  register: गरिमापूर्ण प्रत्यक्ष सम्बोधन रखा गया है। ‘सामंजस्य’ मूल के संगीतात्मक रूपक को और ‘दार्शनिक’ पुस्तक की विशिष्ट दार्शनिक शब्दावली को सुरक्षित रखते हैं; भाषा आधुनिक मानक हिन्दी में है।
