  yaml_path: translation/deuterocanon/4_maccabees/007/017.yaml
  text: But perhaps some might say[a], “Not all gain mastery over their passions[b], because not all have prudent reason.”
translation:
  language: hi
  text: लेकिन शायद कुछ लोग कहें, “सभी लोग अपने मनोवेगों पर काबू नहीं पा लेते[a], क्योंकि सभी लोगों के पास विवेकशील तर्कबुद्धि नहीं होती[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने मनोवेगों पर प्रभुत्व प्राप्त नहीं करते” अथवा “अपने मनोवेगों को वश में नहीं कर पाते।”
    reason: lexical_alternative
  - marker: b
    text: या “सभी के पास सूझ-बूझ वाली तर्कबुद्धि नहीं होती।” यहाँ यूनानी शब्द उस विवेकपूर्ण तर्क और निर्णय-क्षमता को दर्शाता है जो 4 मक्काबियों के तर्क का एक केंद्रीय विषय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσως δʼ ἂν εἴποιέν τινες
  choice: पर शायद कुछ लोग कहें
  rationale: ἴσως तथा ἄν के साथ संभावनार्थक प्रयोग एक काल्पनिक आपत्ति को अनिश्चित रूप में प्रस्तुत करता है; यह हिंदी वाक्यांश उस आलंकारिक और संभावनात्मक भाव को स्वाभाविक ढंग से रखता है।
- source_word: τῶν παθῶν
  choice: अपने मनोवेगों
  rationale: इस पुस्तक के दार्शनिक संदर्भ में πάθη बाहरी दुःखों के बजाय उन भावों, इच्छाओं और आवेगों को सूचित करता है जिन्हें तर्कबुद्धि नियंत्रित करती है। ‘मनोवेग’ अर्थ को व्यापक रखता है और ‘वासनाएँ’ जैसे संकुचित या नैतिक रूप से अतिरंजित शब्द से बचता है।
- source_word: οὐ πάντες περικρατοῦσιν
  choice: सभी लोग ... काबू नहीं पा लेते
  rationale: περικρατέω का भाव किसी वस्तु पर प्रभुत्व या नियंत्रण प्राप्त करना है। ‘काबू पा लेना’ आधुनिक हिंदी में स्वाभाविक है और अर्जित आत्म-संयम का भाव बनाए रखता है।
- source_word: φρόνιμον
  choice: विवेकशील
  rationale: φρόνιμος व्यावहारिक बुद्धिमत्ता, समझदारी और उचित निर्णय-क्षमता का बोध कराता है; ‘विवेकशील’ इस नैतिक-दर्शन संबंधी गुण को स्पष्ट करता है।
- source_word: τὸν λογισμόν
  choice: तर्कबुद्धि
  rationale: λογισμός 4 मक्काबियों में विवेकपूर्ण तर्क और निर्णय की केंद्रीय मानवीय क्षमता है। ‘तर्कबुद्धि’ साधारण ‘बुद्धि’ से अधिक विशिष्ट होते हुए भी पठनीय है।
- source_word: φρόνιμον ἔχουσιν τὸν λογισμόν
  choice: सभी की तर्कबुद्धि विवेकशील नहीं होती
  rationale: यह संरचना तर्कबुद्धि के मात्र अस्तित्व को नकारने के बजाय उसके विवेकशील गुण का वर्णन करती है। हिंदी में यह रूप मूल के विधेय विशेषण का भाव स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: नैतिक आत्म-संयम और तर्कबुद्धि के संबंध का मानवशास्त्रीय-दर्शन संबंधी कथन
  choice: विफलता का कारण यह बताया गया है कि हर व्यक्ति की तर्कबुद्धि विवेकशील अवस्था में नहीं होती।
  alternative: इसे इस अर्थ में लिया जा सकता है कि हर व्यक्ति अपनी तर्कबुद्धि का विवेकपूर्वक प्रयोग नहीं करता, अथवा कुछ लोगों में तर्कबुद्धि ही नहीं है।
  rationale: ἔχουσιν के साथ विधेय विशेषण φρόνιμον तर्कबुद्धि की गुणवत्ता को प्रमुखता देता है। इसलिए अनुवाद न तो केवल उसके प्रयोग की बात जोड़ता है, न मानव तर्कक्षमता के पूर्ण अभाव का दावा करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सहज, किंतु गरिमापूर्ण रखी गई है। ‘मनोवेग’ और ‘तर्कबुद्धि’ दार्शनिक संदर्भ की सटीकता बनाए रखते हैं; वाक्य-विन्यास काल्पनिक आपत्ति के रूप को स्पष्ट करता है।
