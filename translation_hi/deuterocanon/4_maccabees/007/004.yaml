base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/004.yaml
  text: No city under siege ever held out against many and varied siege engines as that most holy man[a], while his sacred soul was being burned by tortures and the wheel[b], stirred up those besieging him through the reason that defends godliness.
translation:
  language: hi
  text: घेराबंदी के समय किसी नगर ने भी अनेक और तरह-तरह के युद्ध-यंत्रों का सामना उतनी दृढ़ता से कभी नहीं किया, जितनी दृढ़ता से उस परम पवित्र पुरुष ने किया। यातनाओं और मरोड़ने वाले यंत्रों[a] से अपनी पवित्र आत्मा तक दग्ध होते हुए उसने ईश्वर-भक्ति की रक्षा करने वाली तर्क-बुद्धि[b] के द्वारा उसे घेरे हुए लोगों को झकझोर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘यातना देने के लिए मरोड़ने वाले यंत्र’ या अधिक सामान्य रूप से ‘यातना-यंत्र’ भी हो सकता है; ठीक किस यंत्र की बात है, यह निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “ईश्वर-भक्ति की रक्षा करने वाली तर्क-बुद्धि के कारण।” यहाँ यूनानी शब्द ‘तर्क-बुद्धि’ पर विशेष बल देता है।
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: नगर
  rationale: घेराबंदी के सैन्य रूपक में ‘नगर’ स्वाभाविक और सटीक है।
- source_word: μηχανήμασιν
  choice: युद्ध-यंत्रों
  rationale: घेराबंदी के संदर्भ में यह सामान्य उपकरण नहीं, आक्रमण में प्रयुक्त सैन्य यंत्र सूचित करता है।
- source_word: ἀντέσχεν
  choice: सामना ... दृढ़ता से किया
  rationale: यह दीर्घ प्रतिरोध और टिके रहने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πανάγιος
  choice: परम पवित्र
  rationale: शब्द की प्रबल, प्रशंसात्मक पवित्रता को गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἱερὰν ψυχὴν
  choice: पवित्र आत्मा
  rationale: मूल के धार्मिक और मनोवैज्ञानिक बल को बनाए रखता है; यहाँ ‘जीवन’ की अपेक्षा ‘आत्मा’ अधिक निकट है।
- source_word: αἰκισμοῖς
  choice: यातनाओं
  rationale: क्रूर दुर्व्यवहार और शारीरिक पीड़ा के आशय को स्पष्ट रूप से व्यक्त करता है।
- source_word: στρέβλαις
  choice: मरोड़ने वाले यंत्रों
  rationale: शब्द मरोड़ या ऐंठन पहुँचाने वाले यातना-उपकरणों को सूचित करता है; किसी एक निश्चित यंत्र को अनावश्यक रूप से निर्धारित नहीं किया गया।
- source_word: πυρπολούμενος
  choice: झुलसते हुए
  rationale: मूल की दहकने या आग से पीड़ित होने की तीव्र उपमा को हिन्दी में स्वाभाविक रखते हुए व्यक्त करता है।
- source_word: ἐκίνησεν
  choice: विचलित कर दिया
  rationale: उसकी दृढ़ता से आक्रमणकारियों के हिल उठने या अस्थिर होने का भाव देता है, बिना उनकी प्रतिक्रिया को अधिक निश्चित किए।
- source_word: τοὺς πολιορκοῦντας
  choice: अपने घेरने वालों
  rationale: नगर की घेराबंदी वाले विस्तृत रूपक को शहीद के अत्याचारियों पर लागू रखता है।
- source_word: λογισμόν
  choice: तर्क-बुद्धि
  rationale: यह केवल तर्क की क्रिया नहीं, मनुष्य की विचारशील और आत्म-नियंत्रक शक्ति है; संयुक्त पद हिन्दी पाठक के लिए इस अर्थ को अधिक स्पष्ट करता है।
- source_word: ὑπερασπίζοντα τῆς εὐσεβείας
  choice: ईश्वर-भक्ति की रक्षा करने वाली
  rationale: सक्रिय प्रतिरक्षा के भाव और परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: εὐσέβεια का अनुवाद
  choice: ईश्वर-भक्ति
  alternative: भक्ति; धर्मनिष्ठा
  rationale: संदर्भ में यह केवल सामान्य सदाचार नहीं, परमेश्वर के प्रति श्रद्धा और निष्ठा से जुड़ा आचरण है। ‘ईश्वर-भक्ति’ आधुनिक हिन्दी में इसे स्पष्ट करता है, पर किसी संप्रदाय-विशेष का अर्थ नहीं जोड़ता।
- issue: 4 मक्काबियों में λογισμός
  choice: तर्क-बुद्धि
  alternative: विवेक; तर्क; विचारशील बुद्धि
  rationale: पुस्तक में यह आवेगों पर शासन करने वाली विचारशील शक्ति का प्रमुख पद है। ‘तर्क-बुद्धि’ उसके बौद्धिक और नैतिक दोनों आयामों को रखता है।
- issue: διὰ τὸν ὑπερασπίζοντα का संबंध
  choice: साधन—‘के द्वारा’
  alternative: कारण—‘के कारण’
  rationale: διά के साथ कर्मकारक यहाँ उस तर्क-बुद्धि को माध्यम अथवा प्रभावकारी शक्ति बता सकता है; कारणार्थक अर्थ भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। मूल के विस्तृत घेराबंदी-रूपक, ऊँचे प्रशंसात्मक स्वर और तर्क-बुद्धि बनाम यातना के तनाव को सुरक्षित रखा गया है।
