  text: For only the wise and self-controlled man is courageous[a], master of the passions.
translation:
  language: hi
  text: क्योंकि केवल बुद्धिमान और संयमी पुरुष[a] ही साहसी और मनोवेगों का स्वामी होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘व्यक्ति’ अथवा ‘मनुष्य’; यूनानी में यहाँ पुल्लिंग एकवचन रूप है, जिसका इस नैतिक कथन में सामान्य अर्थ में प्रयोग हुआ है।
    reason: स्रोत के व्याकरणिक लिंग और कथन के सामान्य आशय, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: μόνος
  choice: केवल ... ही
  rationale: यह पद कथन की विशिष्टता और बल को व्यक्त करता है; हिन्दी में ‘केवल ... ही’ इसका स्वाभाविक रूप है।
- source_word: σοφὸς
  choice: बुद्धिमान
  rationale: नैतिक-दर्शन के इस संदर्भ में यह व्यावहारिक और नैतिक बुद्धि रखने वाले व्यक्ति को सूचित करता है।
- source_word: σώφρων
  choice: संयमी
  rationale: यह विवेकपूर्ण आत्म-संयम और अनुशासित नियंत्रण को व्यक्त करता है, जो मनोवेगों पर प्रभुत्व के अगले कथन के अनुकूल है।
- source_word: ἀνδρεῖός
  choice: साहसी
  rationale: यह धैर्य और वीरता के गुण को बताता है; ‘साहसी’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से पुरुषत्व का भाव नहीं जोड़ता।
- source_word: τῶν παθῶν
  choice: मनोवेगों का
  rationale: यहाँ πάθη उन भावनात्मक आवेगों और प्रवृत्तियों को सूचित करता है जिन्हें विवेक के अधीन रखा जाना है; ‘मनोवेग’ इसे केवल काम-वासनाओं या बाहरी दुखों तक सीमित नहीं करता।
- source_word: κύριος
  choice: स्वामी
  rationale: यह गैर-ईश्वरीय संदर्भ में अधिकार और नियंत्रण को सूचित करता है; ‘स्वामी’ संज्ञात्मक रूप और प्रभुत्व, दोनों को बनाए रखता है।
- source_word: ὁ σοφὸς καὶ σώφρων
  choice: बुद्धिमान और संयमी पुरुष
  rationale: यूनानी में निश्चित उपपद के साथ पुल्लिंग एकवचन विशेषण संज्ञा के समान प्रयुक्त हैं। हिन्दी में ‘पुरुष’ उस व्याकरणिक रूप को स्पष्ट करता है, जबकि पादटिप्पणी इसके सामान्य नैतिक प्रयोग को बताती है।
theological_decisions:
- issue: नैतिक सूक्ति में सामान्य अर्थ वाला पुल्लिंग एकवचन
  choice: पुरुष
  alternative: व्यक्ति / मनुष्य
  rationale: यूनानी अभिव्यक्ति पुल्लिंग एकवचन में है, यद्यपि सूक्ति का आशय सामान्य है। मुख्य पाठ स्रोत के रूप को बनाए रखता है और पादटिप्पणी सामान्य आशय स्पष्ट करती है।
- issue: गैर-ईश्वरीय संदर्भ में κύριος
  choice: स्वामी
  alternative: प्रभु / नियंत्रण रखने वाला
  rationale: यहाँ कोई ईश्वरीय उपाधि नहीं, बल्कि मनोवेगों पर अधिकार अभिप्रेत है। ‘स्वामी’ इस संज्ञात्मक और शासकीय भाव को संक्षेप में सुरक्षित रखता है।
- issue: दो विधेयों का संबंध
  choice: साहसी और मनोवेगों का स्वामी
  alternative: साहसी, मनोवेगों का स्वामी
  rationale: यूनानी में दोनों पद ἐστιν के विधेय हैं। हिन्दी में ‘और’ उनका संबंध स्पष्ट करता है, बिना यह तय किए कि एक गुण दूसरे की व्याख्या मात्र है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मनोवेग’ दार्शनिक संदर्भ में ‘भावनाएँ’, ‘वासनाएँ’ और ‘दुःख’ जैसे अधिक संकीर्ण विकल्पों से बेहतर व्यापकता देता है।
