  yaml_path: translation/deuterocanon/4_maccabees/007/013.yaml
  text: And yet[a], most astonishingly, though he was an old man, with the pains of his body already loosened, and his flesh relaxed, and even his sinews worn out, he renewed his youth.
translation:
  language: hi
  text: फिर भी, सबसे आश्चर्य की बात यह थी कि वह वृद्ध होते हुए भी—जब शरीर के कष्ट उसे पहले ही शिथिल कर चुके थे, उसका मांस ढीला पड़ गया था, और उसके स्नायु भी थक चुके थे—फिर जवान हो उठा।[a]
  philosophy: optimal-equivalence
  footnotes:
