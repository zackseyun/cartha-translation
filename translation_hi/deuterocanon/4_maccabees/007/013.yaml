- source_word: καίτοι
  choice: फिर भी
  rationale: यह पद पिछले कथन के साथ एक बलपूर्ण विरोध अथवा रियायत का संबंध जोड़ता है; ‘फिर भी’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ θαυμασιώτατον
  choice: सबसे आश्चर्य की बात
  rationale: नपुंसकलिंग अतिशयोक्तिपरक पदबंध को संज्ञात्मक रूप में लेना यूनानी संरचना और उसके चरमबिंदु-सूचक बल दोनों को स्पष्ट रखता है।
- source_word: γέρων ὤν
  choice: बूढ़ा होने पर भी
  rationale: 'कृदन्त का प्रसंगगत रियायती भाव स्पष्ट किया गया है: वृद्धावस्था के बावजूद उसमें नई जवानी दिखाई दी।'
- source_word: λελυμένων ἤδη τῶν τοῦ σώματος πόνων
  choice: उसके शरीर की शक्ति पहले ही क्षीण हो चुकी थी
  rationale: πόνοι मूलतः श्रम, परिश्रम, कष्ट अथवा श्रम करने वाली शारीरिक क्षमता का संकेत कर सकता है। वृद्ध देह के वर्णन में ‘शरीर की शक्ति’ प्रसंगानुकूल है; λελυμένων के ढीला पड़ने/छूट जाने के बिंब को ‘क्षीण’ स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे यातना की पीड़ा घटने के अर्थ में लेने के।
- source_word: περικεχαλασμένων δὲ τῶν σαρκῶν
  choice: देह का मांस ढीला पड़ गया था
  rationale: σάρκες यहाँ भौतिक देह के मांस को सूचित करता है और χαλάω ढीला पड़ने का भाव देता है। ‘देह का मांस’ मूल बिंब को ‘मांसपेशियाँ’ जैसे अधिक विशिष्ट अर्थ में सीमित नहीं करता।
- source_word: κεκμηκότων δὲ καὶ τῶν νεύρων
  choice: उसकी नसें भी थक चुकी थीं
  rationale: νεῦρα प्राचीन शारीरिक प्रयोग में नसों, स्नायुओं अथवा कण्डराओं को सूचित कर सकता है। सामान्य हिन्दी में ‘नसें’ बोधगम्य है, जबकि ‘थक चुकी थीं’ κεκμηκότων की पूर्ण हुई थकावट को रखता है।
- source_word: ἀνενέασεν
  choice: वह फिर से जवान हो उठा
  rationale: क्रिया का अर्थ फिर जवान होना अथवा युवावस्था का नवीकरण पाना है। यह रूप हिन्दी में जीवंत और स्वाभाविक है तथा यह तय नहीं करता कि परिवर्तन अक्षरशः शारीरिक था या साहस और शक्ति का आलंकारिक नवीकरण।
theological_decisions:
- issue: ἀνενέασεν में अक्षरशः कायाकल्प और युवोचित शक्ति के आलंकारिक नवीकरण के बीच संभावित तनाव
  choice: वह फिर से जवान हो उठा
  alternative: उसमें युवावस्था का बल फिर जाग उठा
  rationale: मुख्य पाठ यूनानी क्रिया की सशक्त और कुछ हद तक खुली अभिव्यक्ति को बनाए रखता है; अधिक व्याख्यात्मक विकल्प को पादटिप्पणी में रखा गया है ताकि आलंकारिक अर्थ को मुख्य पाठ में अनिवार्य न बनाया जाए।
- issue: σάρξ का वृद्ध देह के भौतिक वर्णन में अर्थ
  choice: देह का मांस
  alternative: मांसपेशियाँ
  rationale: यहाँ शब्द का नैतिक या पाप-स्वभाव संबंधी अर्थ नहीं है। भौतिक ‘मांस’ मूल शब्द की व्यापकता को ‘मांसपेशियाँ’ की अपेक्षा अधिक ठीक से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वृद्ध शरीर के क्रमिक वर्णन को लय देने के लिए दीर्घ विराम-चिह्नों का प्रयोग किया गया है। ‘नसें’ सामान्य हिन्दी के लिए चुना गया है, यद्यपि यूनानी νεῦρα में स्नायु या कण्डराएँ भी सम्मिलित हो सकती हैं।
