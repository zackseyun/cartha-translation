  text: For[a], like a sheer cliff, father Eleazar, stretching out his own mind[b], broke around himself the surging waves of the passions that were raging.
translation:
  language: hi
  text: क्योंकि पिता एलीआज़र ने, मानो खड़ी, आगे निकली चट्टान[a] की तरह अपने मन[b] को तानकर, अपने चारों ओर उमड़ती वासनाओं की उन्मत्त लहरों को तोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खड़ी, आगे निकली चट्टान’ के लिए प्रयुक्त यूनानी पद का अर्थ ‘खड़ी ऊँचाई’ या ‘दुर्गम शैल-शिखर’ भी हो सकता है। बिंब किसी तीखी, आगे उभरी चट्टानी ऊँचाई का है, जिसके सामने लहरें टूटती हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘मन’ से आशय एलीआज़र की विचारशील मानसिक शक्ति और दृढ़ संकल्प से है। ‘वासनाएँ’ अनियंत्रित आवेगों और लालसाओं को सूचित करती हैं।
    reason: cultural_note
lexical_decisions:
- source_word: πρόκρημνον ἄκραν
  choice: समुद्र के ऊपर निकली हुई खड़ी चट्टान
  rationale: यूनानी पद समुद्र के सामने तीखे ढंग से आगे निकली दुर्गम चट्टानी ऊँचाई का बिंब देता है। यह अनुवाद उस समुद्री रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διάνοιαν
  choice: मन
  rationale: यहाँ शब्द एलीआज़र की विचारशील मानसिक शक्ति और दृढ़ संकल्प को सूचित करता है। ‘मन’ सहज हिन्दी है और आगे की व्याख्या किए बिना मूल की व्यापकता बचाता है।
- source_word: ἐκτείνας
  choice: आगे बढ़ाकर
  rationale: मूल क्रिया फैलाने या आगे की ओर तानने का ठोस बिंब रखती है; इसे चट्टान के समुद्र की ओर निकले होने के रूपक से जोड़ा गया है।
- source_word: περιέκλασεν
  choice: चारों ओर ... तोड़ दिया
  rationale: क्रिया के περι- उपसर्ग की स्थानिक शक्ति को ‘चारों ओर’ से और लहरों के चट्टान से टकराकर टूटने के बिंब को ‘तोड़ दिया’ से सुरक्षित रखा गया है।
- source_word: μαινομένους
  choice: उन्मत्त
  rationale: यह शब्द हिंसक और बेकाबू अवस्था दर्शाता है। ‘उन्मत्त’ वासनाओं और उनसे संबद्ध लहरों—दोनों के रूपक के अनुकूल है।
- source_word: παθῶν
  choice: वासनाओं
  rationale: 4 मक्काबियों में πάθη अनियंत्रित आवेगों, लालसाओं और मनोवेगों के लिए प्रमुख नैतिक-दार्शनिक शब्द है। ‘वासनाएँ’ यहाँ केवल सामान्य भावनाओं के बजाय अव्यवस्थित इच्छाओं का भाव देता है।
- source_word: κλύδωνας
  choice: उमड़ती ... लहरों
  rationale: संज्ञा तूफानी, उफनती समुद्री लहरों को दर्शाती है। ‘उमड़ती लहरें’ गति और प्रचंडता दोनों व्यक्त करती हैं।
theological_decisions:
- issue: 4 मक्काबियों में मन और वासनाओं का नैतिक-दार्शनिक संघर्ष
  choice: διάνοια को ‘मन’ और πάθη को ‘वासनाएँ’ रखा गया है।
  alternative: इन्हें अधिक व्याख्यात्मक ढंग से ‘विवेक-बुद्धि’ और ‘भावनाएँ’ कहा जा सकता था।
  rationale: मूल पद रूपक के द्वारा मानसिक दृढ़ता और अनियंत्रित आवेगों का विरोध दिखाता है। चुने हुए शब्द इस तनाव को बनाए रखते हैं, पर सभी भावनाओं को स्वभावतः बुरा नहीं ठहराते और बाद की किसी विशिष्ट दार्शनिक या संप्रदायगत शब्दावली को नहीं थोपते।
