  yaml_path: translation/deuterocanon/4_maccabees/007/022.yaml
  text: And knowing that it is blessed to endure every pain for the sake of virtue[a], would he not prevail over the passions for the sake of godliness?
translation:
  language: hi
  text: और यह जानते हुए कि सद्गुण के लिए हर पीड़ा सहना धन्य बात है, क्या वह ईश्वर-भक्ति[a] के कारण मनोवेगों पर अधिकार न पा लेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धर्मपरायणता’। यूनानी शब्द का अर्थ ईश्वर के प्रति श्रद्धापूर्ण निष्ठा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: यह जानते हुए
  rationale: कृदन्त की संक्षिप्तता और मुख्य आलंकारिक प्रश्न के लिए उसके कारणसूचक संबंध—दोनों को बनाए रखता है।
- source_word: διὰ τὴν ἀρετήν
  choice: सद्गुण के लिए
  rationale: ἀρετή यहाँ नैतिक उत्कृष्टता या सद्गुण को सूचित करता है; यह चयन उद्देश्य/कारण की यूनानी अर्थ-छाया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάντα πόνον
  choice: हर पीड़ा
  rationale: πόνος में पीड़ा, कष्ट और कठिन श्रम की अर्थ-छायाएँ हैं। प्रसंग में सहन की जाने वाली पीड़ा उपयुक्त है और मूल के व्यापक एकवचन भाव को बनाए रखती है।
- source_word: ὑπομένειν
  choice: सहना
  rationale: दुःख के नीचे दृढ़ बने रहने के भाव को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: μακάριόν ἐστιν
  choice: धन्य बात है
  rationale: यह केवल लाभकारी या सौभाग्यपूर्ण होने के बजाय नैतिक-धार्मिक धन्यता का मूल्यांकन व्यक्त करता है।
- source_word: περικρατήσειεν
  choice: अधिकार न पा लेगा
  rationale: क्रिया का आशय किसी वस्तु पर प्रभुत्व या नियंत्रण प्राप्त करना है; नकारात्मक आलंकारिक प्रश्न की अपेक्षित सकारात्मक शक्ति भी बनी रहती है।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: 4 मकाबियों के दार्शनिक-नैतिक संदर्भ में πάθη बाहरी दुःख नहीं, भीतर के प्रबल भावात्मक आवेग हैं। ‘मनोवेग’ इस तकनीकी अर्थ को ‘भावनाएँ’ से अधिक स्पष्ट और ‘वासनाएँ’ से कम संकीर्ण रूप में रखता है।
- source_word: διὰ τὴν εὐσέβειαν
  choice: ईश्वर-भक्ति के कारण
  rationale: εὐσέβεια श्रद्धापूर्ण धार्मिक निष्ठा का बोध कराता है। ‘ईश्वर-भक्ति’ इसके ईश्वराभिमुख पक्ष को सामान्य आधुनिक हिन्दी में स्पष्ट करता है, जबकि ‘के कारण’ διὰ के कारणसूचक भाव को खुला रखता है।
theological_decisions:
- issue: सद्गुण, मनोवेग और εὐσέβεια के बीच नैतिक-धार्मिक संबंध
  choice: ‘सद्गुण’, ‘मनोवेग’ और ‘ईश्वर-भक्ति’
  alternative: ‘नैतिक उत्कृष्टता’, ‘भावनाएँ/आवेग’ और ‘धर्मपरायणता’
  rationale: यह रूपान्तरण ग्रन्थ के यूनानी नैतिक दर्शन और यहूदी ईश्वर-निष्ठा, दोनों को बनाए रखता है; मनोवेगों को केवल बाहरी कष्ट या सभी भावनाओं के समान नहीं ठहराता।
- issue: आलंकारिक प्रश्न की शक्ति
  choice: ‘क्या वह ... अधिकार न पा लेगा?’
  alternative: 'सकारात्मक कथन: ‘वह ... अधिकार पा लेगा’'
  rationale: मूल यूनानी की प्रश्नात्मक रचना और उसमें निहित अपेक्षित सकारात्मक उत्तर को बिना सपाट कथन में बदलें सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘धन्य बात है’ धार्मिक-मूल्यांकन को स्वाभाविक बनाता है। पादटिप्पणी-चिह्न को अंग्रेज़ी परामर्श-पाठ की असंगत स्थिति के बजाय उसके वास्तविक यूनानी पद εὐσέβεια के अनुवाद ‘ईश्वर-भक्ति’ पर रखा गया है।
