  yaml_path: translation/deuterocanon/4_maccabees/007/008.yaml
  text: Such men must be those who establish the law with their own blood[a], and defend it with noble sweat through sufferings unto death.
translation:
  language: hi
  text: ऐसे ही लोग होने चाहिए जो अपने ही लहू से व्यवस्था को स्थापित करते हैं[a] और वीरतापूर्ण पसीना बहाते हुए, मृत्यु तक के कष्टों के बीच उसकी रक्षा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था को बनाए रखते हैं।” यूनानी क्रिया का अर्थ बनाना, उत्पन्न करना, या किसी बात को स्थापित करना हो सकता है। यहाँ आशय नई व्यवस्था बनाने का नहीं, बल्कि विश्वासयोग्य आचरण द्वारा व्यवस्था को स्थापित या दृढ़ करने का जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτους
  choice: ऐसे ही ... वे लोग
  rationale: यह उन जैसे व्यक्तियों की ओर संकेत करता है जिनकी अभी चर्चा हुई है। हिंदी में यह स्वाभाविक है और यूनानी के प्रकार-सूचक बल को बनाए रखता है।
- source_word: δεῖ εἶναι
  choice: होने चाहिए
  rationale: यह आवश्यक आदर्श को व्यक्त करता है; हिंदी में ‘होने चाहिए’ प्रसंगानुकूल और सहज है।
- source_word: τοὺς δημιουργοῦντας τὸν νόμον
  choice: जो ... व्यवस्था को प्रतिष्ठित करते हैं
  rationale: δημιουργέω का मूल अर्थ बनाना या उत्पन्न करना हो सकता है, पर यहाँ विधान रचने की नहीं, अपने विश्वासयोग्य आचरण द्वारा व्यवस्था को प्रभावी और प्रमाणित ठहराने की बात है। ‘प्रतिष्ठित करते हैं’ इस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यह यहूदी संदर्भ में ईश्वर-प्रदत्त पैतृक व्यवस्था को सूचित करता है। ‘व्यवस्था’ हिंदी बाइबलीय प्रयोग में स्पष्ट और प्रतिष्ठित शब्द है।
- source_word: ἰδίῳ αἵματι
  choice: अपने ही लहू से
  rationale: करणवाचक दत्तिव को बनाए रखते हुए ‘ही’ स्वकीय रक्त के बल को उभारता है; ‘लहू’ वाक्य की शारीरिक और बलिदानी तीव्रता बनाए रखता है।
- source_word: γενναίῳ ἱδρῶτι
  choice: उत्तम साहस के साथ
  rationale: शाब्दिक ‘उदात्त पसीने से’ आधुनिक हिंदी में अस्वाभाविक और अस्पष्ट होगा। यह चयन γενναῖος के उदात्त/वीर भाव तथा ἱδρώς से व्यक्त कठिन परिश्रम को मुहावरेदार ढंग से संप्रेषित करता है, यद्यपि ठोस ‘पसीना’ रूपक मंद पड़ता है।
- source_word: τοῖς μέχρι θανάτου πάθεσιν
  choice: मृत्यु तक के कष्ट सहते हुए
  rationale: μέχρι θανάτου सहन की सीमा को मृत्यु तक बताता है और πάθη को वास्तविक कष्टों के रूप में रखता है, बिना यह निश्चित किए कि मृत्यु घट चुकी है।
- source_word: ὑπερασπίζοντας
  choice: उसके पक्ष में संघर्ष करते हैं
  rationale: क्रिया किसी के बचाव में खड़े होकर लड़ने का भाव रखती है। ‘उसके पक्ष में संघर्ष’ केवल मौखिक प्रतिरक्षा के बजाय सक्रिय रक्षा को प्रकट करता है।
theological_decisions:
- issue: δημιουργοῦντας τὸν νόμον का अर्थ
  choice: व्यवस्था को प्रतिष्ठित करते हैं
  alternative: व्यवस्था को बनाए रखते हैं; व्यवस्था को बनाते हैं
  rationale: शहीद नई व्यवस्था नहीं बनाते; उनका रक्त और धीरज व्यवस्था की वैधता और प्रभाव को अपने आचरण में स्थापित करते हैं। वैकल्पिक अर्थ की वास्तविक गुंजाइश पादटिप्पणी में सुरक्षित रखी गई है।
- issue: γενναίῳ ἱδρῶτι की ठोस उपमा
  choice: उत्तम साहस के साथ
  alternative: वीरतापूर्ण पसीने से; उदात्त परिश्रम से
  rationale: शाब्दिक हिंदी अर्थ को धुंधला कर सकती है। चुना हुआ पाठ वीरतापूर्ण कठिन प्रयास को स्पष्ट करता है, लेकिन किसी विशिष्ट मत-सिद्धांत को नहीं जोड़ता।
- issue: μέχρι θανάτου की सीमा
  choice: मृत्यु तक के कष्ट
  alternative: मृत्यु देने वाले कष्ट; मरते दम तक के कष्ट
  rationale: यूनानी केवल मृत्यु तक की सीमा बताता है; अनुवाद यह तय नहीं करता कि मृत्यु पहले ही हो चुकी है या वह सहनशीलता की चरम सीमा है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘व्यवस्था’ बाइबलीय संदर्भ को स्पष्ट रखता है। मुख्य पाठ में अत्यधिक अस्वाभाविक ‘उदात्त पसीना’ से बचते हुए साहसी श्रम का अर्थ दिया गया है; मृत्यु तक की सीमा जानबूझकर अनिर्णीत रखी गई है।
