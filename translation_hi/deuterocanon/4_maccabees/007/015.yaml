base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/015.yaml
  text: O blessed old age[a], and venerable gray hair, and a law-abiding life, which a faithful seal of death brought to completion.
translation:
  language: hi
  text: अहा, धन्य वृद्धावस्था, आदरणीय पके बाल, और व्यवस्था के अनुसार जिया गया जीवन—जिसे मृत्यु की विश्वसनीय मुहर[a] ने पूर्णता तक पहुँचा दिया!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु की सच्ची अथवा भरोसेमंद मुहर।” यूनानी में रूपक बहुत संक्षिप्त है; इसका अर्थ यह भी हो सकता है कि मृत्यु ने ऐसे जीवन की प्रामाणिकता की विश्वसनीय पुष्टि की।
    reason: πιστή और σφραγίς के अर्थ-संबंध तथा रूपक की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: μακαρίου γήρως
  choice: धन्य वृद्धावस्था
  rationale: μακάριος यहाँ केवल भावनात्मक प्रसन्नता नहीं, बल्कि प्रशंसनीय और सौभाग्यशाली अवस्था का बोध कराता है। ‘धन्य’ पद्य के ऊँचे प्रशंसात्मक स्वर को बनाए रखता है।
- source_word: σεμνῆς πολιᾶς
  choice: आदरणीय पके बाल
  rationale: σεμνός गरिमा और आदर का, और πολιᾶς वृद्धावस्था के श्वेत या पके बालों का बोध कराता है। यह हिन्दी में स्वाभाविक रहते हुए मूल बिंब को सुरक्षित रखता है।
- source_word: βίου νομίμου
  choice: व्यवस्था के अनुसार जिया गया जीवन
  rationale: νόμιμος का अर्थ विधि या व्यवस्था के अनुरूप है। पुस्तक के यहूदी शहादत-संदर्भ में ‘व्यवस्था’ पैतृक धार्मिक व्यवस्था की ओर संकेत बनाए रखती है, जबकि अनावश्यक व्याख्या नहीं जोड़ती।
- source_word: πιστὴ ... σφραγὶς
  choice: विश्वसनीय मुहर
  rationale: πιστός यहाँ मुहर की प्रामाणिकता या भरोसेमंद पुष्टि को व्यक्त करता है। ‘विश्वसनीय’ मूल के असामान्य किंतु सघन रूपक को बनाए रखता है।
- source_word: θανάτου σφραγὶς
  choice: मृत्यु की ... मुहर
  rationale: सम्बन्धकारक रचना को सीधे रखा गया है, ताकि मृत्यु द्वारा जीवन की पुष्टि या परिपूर्णता का मूल रूपक सुरक्षित रहे।
- source_word: ἐτελείωσεν
  choice: पूर्णता तक पहुँचा दिया
  rationale: क्रिया पूर्ण करने, परिपूर्ण बनाने या लक्ष्य तक पहुँचाने का अर्थ दे सकती है। यह चयन भाव की गंभीरता बनाए रखता है, पर किसी बाद की तकनीकी धर्मवैज्ञानिक धारणा को नहीं थोपता।
theological_decisions:
- issue: यहूदी शहादत-संदर्भ में βίου νομίμου का आशय
  choice: व्यवस्था के अनुसार जिया गया जीवन
  alternative: नियमों का पालन करनेवाला जीवन; विधिसम्मत जीवन
  rationale: यह पद सामान्य नागरिक कानून से बढ़कर यहूदी पैतृक व्यवस्था के प्रति निष्ठा की ओर संकेत करता है। ‘व्यवस्था के अनुसार’ उस संदर्भ को सुनाई देता रहने देता है, पर मूल से अधिक स्पष्ट नहीं करता।
- issue: ἐτελείωσεν में पूर्णता या सिद्धता का भाव
  choice: पूर्णता तक पहुँचा दिया
  alternative: पूर्ण कर दिया; सिद्ध कर दिया
  rationale: शहादत के संदर्भ में क्रिया जीवन की परिणति और पूर्णता दोनों का बोध करा सकती है। चुना गया रूप इस तनाव को बनाए रखता है और किसी विशिष्ट सिद्धान्त को निर्णायक नहीं बनाता।
- issue: πιστὴ θανάτου σφραγὶς के संक्षिप्त रूपक का अर्थ
  choice: मृत्यु की विश्वसनीय मुहर
  alternative: मृत्यु की सच्ची मुहर; मृत्यु द्वारा भरोसेमंद पुष्टि
  rationale: मूल में मृत्यु जीवन को पूर्ण करनेवाली मुहर है; वह उसकी सच्चाई की पुष्टि भी कर सकती है। मुख्य पाठ रूपक को सीधे रखता है और व्याख्यात्मक संभावना पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, उद्घोषात्मक स्वर रखा गया है। ‘अहा’ यूनानी ὦ की भावपूर्ण प्रशंसा व्यक्त करता है। ‘पके बाल’ सामान्य पाठक के लिए सहज है और वृद्धावस्था के मूल बिंब को बनाए रखता है।
