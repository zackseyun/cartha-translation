  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘विवेक’ पुस्तक की केंद्रीय λογισμός शब्दावली के लिए लगातार रखा गया है। ‘इसहाक-सदृश’ कुछ साहित्यिक है, पर मूल विशेषण और उसके संकेत को संक्षेप में सुरक्षित रखता है।
