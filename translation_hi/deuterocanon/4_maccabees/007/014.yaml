lexical_decisions:
- source_word: πνεύματι
  choice: आत्मा
  rationale: यहाँ शब्द विवेक से उत्पन्न आंतरिक प्रेरक शक्ति या मनोभाव को दर्शाता है, न कि पवित्र आत्मा को। ‘आत्मा’ मूल रूपक को बनाए रखता है।
- source_word: λογισμοῦ / λογισμῷ
  choice: विवेक
  rationale: 4 मकाबियों में λογισμός अनुशासित विवेक है, जो मनोवेगों पर शासन करता है। दोनों स्थानों पर ‘विवेक’ रखने से मूल की पुनरावृत्ति सुनाई देती है।
- source_word: Ἰσακείῳ
  choice: इसहाक-सदृश
  rationale: यह विशेषण इसहाक से समानता प्रकट करता है। ‘इसहाक-सदृश’ उसके उदाहरण की ओर संकेत को सुरक्षित रखता है, पर उसे व्याख्यात्मक विस्तार नहीं देता।
- source_word: πολυκέφαλον
  choice: अनेक सिरों वाले
  rationale: यौगिक विशेषण का सजीव और सीधा अर्थ सुरक्षित रखा गया है।
- source_word: στρέβλαν
  choice: यातना-यंत्र
  rationale: στρέβλα किसी यातना देने वाले उपकरण को सूचित करता है। उपलब्ध यूनानी पाठ अकेले उसके ठीक यांत्रिक रूप को निश्चित नहीं करता; इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया और ‘चक्र’ को पाद-टिप्पणी में विकल्प दिया गया है।
- source_word: ἠκύρωσεν
  choice: निष्प्रभावी कर दिया
  rationale: क्रिया का अर्थ किसी वस्तु को अमान्य अथवा उसके उद्देश्य में प्रभावहीन कर देना है। यह स्वाभाविक हिन्दी में उस यातना-यंत्र की विफलता व्यक्त करता है।
theological_decisions:
- issue: τῷ πνεύματι τοῦ λογισμοῦ में ‘आत्मा’ का स्वरूप
  choice: विवेक की आंतरिक प्रेरक शक्ति, पवित्र आत्मा का स्पष्ट उल्लेख नहीं
  alternative: विवेक का मन; विवेक की शक्ति
  rationale: निकटवर्ती प्रसंग विवेक द्वारा पीड़ा और मनोवेगों पर विजय पर केंद्रित है। मूल में दिव्य आत्मा का स्पष्ट संकेत न होने के कारण अनुवाद उसे धर्मवैज्ञानिक रूप से विशिष्ट नहीं बनाता।
- issue: इसहाक की ओर संकेत का बल
  choice: समानता सूचित करने वाला ‘इसहाक-सदृश विवेक’
  alternative: इसहाक का विवेक; इसहाक के उदाहरण पर आधारित विवेक
  rationale: विशेषण स्वामित्व से अधिक समानता व्यक्त करता है। यह रूप संकेत को बनाए रखता है और उसकी व्याख्या को मुख्य पाठ में अनावश्यक रूप से नहीं खोलता।
