  terminology: “अत्याचारी,” “धमकियाँ,” and “यातनाएँ” appropriately represent τύραννος, ἀπειλαί, and βάσανοι. “तूफ़ानी लहरें” adequately renders the rough-sea imagery of τρικυμίαις.
