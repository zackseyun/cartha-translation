  text: For just as the reasoning of our father Eleazar[a], like an excellent helmsman, was steering the ship of godliness on the sea of the passions[b],
translation:
  language: hi
  text: क्योंकि हमारे पिता एलीआज़र का विवेक एक अत्यन्त कुशल कर्णधार के समान मनोवेगों[b] के महासागर में ईश्वर-भक्ति[a] के जहाज़ को दिशा दे रहा था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मपरायणता।” यूनानी εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण भक्ति और उसके अनुरूप विश्वासयोग्य आचरण को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी πάθη यहाँ संभवतः “मनोवेगों” या प्रबल भावनात्मक आवेगों को सूचित करता है, जो 4 मक्काबियों का एक प्रमुख विषय है; केवल “कष्टों” को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: क्योंकि ... के समान
  rationale: ‘क्योंकि’ पूर्ववर्ती कथन से व्याख्यात्मक संबंध और ‘के समान’ उपमा—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
- source_word: ἄριστος κυβερνήτης
  choice: एक अत्यन्त कुशल कर्णधार
  rationale: ‘कर्णधार’ नौका को दिशा देने वाले व्यक्ति की छवि बनाए रखता है; ‘अत्यन्त कुशल’ यहाँ ἄριστος की गुणात्मक श्रेष्ठता व्यक्त करता है।
- source_word: ὁ ... λογισμός
  choice: विवेक
  rationale: इस पुस्तक में λογισμός मनोवेगों पर शासन करने वाली विचारशील नैतिक निर्णय-शक्ति है। ‘विवेक’ आधुनिक हिन्दी में इस सक्रिय नैतिक-बौद्धिक अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦ πατρὸς ἡμῶν Ἐλεαζάρου
  choice: हमारे पिता एलीआज़र का
  rationale: संबंधकारक रचना और सम्मानसूचक पारिवारिक संबोधन दोनों सुरक्षित रखे गए हैं।
- source_word: πηδαλιουχῶν
  choice: दिशा दे रहा था
  rationale: यह चयन पतवार द्वारा नौका को नियंत्रित करने की निरंतर क्रिया को सहज हिन्दी में व्यक्त करता है और कर्णधार की उपमा से मेल खाता है।
- source_word: τὴν τῆς εὐσεβείας ναῦν
  choice: ईश्वर-भक्ति के जहाज़
  rationale: εὐσέβεια यहाँ परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुरूप आचरण को सूचित करता है। ‘ईश्वर-भक्ति’ धार्मिक आशय स्पष्ट रखते हुए जहाज़ की उपमा बचाती है।
- source_word: ἐν τῷ τῶν παθῶν πελάγει
  choice: मनोवेगों के महासागर में
  rationale: πέλαγος की विस्तृत समुद्री छवि के लिए ‘महासागर’ और पुस्तक के नैतिक-मनोवैज्ञानिक संदर्भ में πάθη के लिए ‘मनोवेग’ चुना गया है।
theological_decisions:
- issue: λογισμός का दार्शनिक और नैतिक अर्थ
  choice: विवेक
  alternative: तर्कशील बुद्धि; विचार-शक्ति
  rationale: ‘विवेक’ तर्क, नैतिक निर्णय और आत्म-नियंत्रण के संयुक्त भाव को व्यक्त करता है, पर इसे केवल अमूर्त बुद्धि या किसी बाद की दार्शनिक प्रणाली तक सीमित नहीं करता।
- issue: εὐσέβεια का धार्मिक आशय
  choice: ईश्वर-भक्ति
  alternative: धर्मपरायणता; श्रद्धापूर्ण निष्ठा
  rationale: यह चयन परमेश्वर के प्रति श्रद्धा और विश्वासी आचरण दोनों का संकेत देता है; पादटिप्पणी वास्तविक अर्थ-परास को खुला रखती है।
- issue: πάθη का अर्थ
  choice: मनोवेग
  alternative: वासनाएँ; भावनाएँ; कष्ट
  rationale: 4 मक्काबियों के प्रमुख विषय के अनुसार यहाँ आंतरिक आवेग और भावनात्मक शक्तियाँ अभिप्रेत होने की अधिक संभावना है। फिर भी शब्द का अर्थ-परास पादटिप्पणी में बताया गया है और इसे केवल ‘कष्ट’ नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कर्णधार,’ ‘महासागर’ और ‘जहाज़’ से मूल नौकायन-रूपक सुरक्षित है। पद के अंत की अल्पविराम-युक्त अपूर्णता जानबूझकर रखी गई है, क्योंकि यूनानी वाक्य अगले पद में जारी रहता है।
