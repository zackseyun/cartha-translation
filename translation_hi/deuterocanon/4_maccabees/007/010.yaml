  text: हे एलीआज़र, यातनाओं से भी अधिक प्रबल वृद्ध, आग से भी अधिक प्रचंड बुज़ुर्ग, और दुखों से भी महान राजा![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वृद्ध,’ ‘बुज़ुर्ग’ और ‘राजा’ यहाँ एलीआज़र को दिए गए काव्यात्मक सम्मान-संबोधन हैं; ‘राजा’ किसी राजनीतिक पद का कथन नहीं, बल्कि दुखों पर उसके प्रभुत्व का रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: βασάνων
  choice: यातनाओं
  rationale: शहादत के इस प्रसंग में यह शब्द सामान्य परीक्षा नहीं, बल्कि दी जाने वाली यातना और उससे होने वाली पीड़ा को दर्शाता है।
- source_word: βιαιότερε
  choice: अधिक प्रबल
  rationale: शाब्दिक अर्थ ‘अधिक बलवान/उग्र’ है; यहाँ एलीआज़र की नैतिक दृढ़ता को यातनाओं की हिंसक शक्ति से भी बढ़कर बताया गया है। ‘अधिक प्रबल’ इस अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: γέρων
  choice: वृद्ध
  rationale: सम्मानपूर्ण संबोधन के रूप में ‘वृद्ध’ चुना गया है और अगले समानार्थी संबोधन से भेद बनाए रखा गया है।
- source_word: πυρός
  choice: आग
  rationale: यूनानी का सीधा अर्थ और प्रसंग में अग्नि-यातना का संकेत सुरक्षित रहता है।
- source_word: εὐτονώτερε
  choice: अधिक तेजस्वी
  rationale: εὔτονος में बल, तीव्रता और दृढ़ता का भाव है। आग के साथ तुलना में ‘तेजस्वी’ उसकी तीव्रता और एलीआज़र के अदम्य उत्साह—दोनों को व्यक्त करता है, यद्यपि शब्द में निहित ‘दृढ़/सशक्त’ भाव भी संभव है।
- source_word: πρεσβῦτα
  choice: बुज़ुर्ग
  rationale: यह भी वृद्ध पुरुष का संबोधन है; ‘वृद्ध’ और ‘बुज़ुर्ग’ की विविधता यूनानी के दो निकटवर्ती किंतु अलग शब्दों को बनाए रखती है।
- source_word: παθῶν
  choice: दुखों
  rationale: यहाँ भावनात्मक वासनाएँ नहीं, सहन किए गए कष्ट और पीड़ाएँ अभिप्रेत हैं।
- source_word: μέγιστε
  choice: से भी महान
  rationale: रूप मूलतः सर्वोच्चता व्यक्त करता है, पर संबंधकारक के साथ तुलनात्मक आशय है; हिन्दी में ‘से भी महान’ समानांतर अलंकार को स्पष्ट करता है।
- source_word: βασιλεῦ
  choice: राजा
  rationale: शाब्दिक संबोधन सुरक्षित रखा गया है; प्रसंग में यह राजनीतिक पद नहीं, दुखों पर एलीआज़र के प्रभुत्व का रूपक है।
- source_word: Ἐλεαζάρ
  choice: एलीआज़र
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: एलीआज़र के लिए रूपकात्मक सम्मान-संबोधन
  choice: ‘वृद्ध… बुज़ुर्ग… राजा’ के उन्नत संबोधनों को बनाए रखा गया।
  alternative: इन्हें सपाट वर्णन में बदलना, जैसे ‘तुम यातनाओं से अधिक प्रबल… हो।’
  rationale: यूनानी पाठ विस्मयपूर्ण संबोधनों की शृंखला है। इन्हें बनाए रखने से शहीद की प्रशंसा का काव्यात्मक तनाव सुरक्षित रहता है और ‘राजा’ को वास्तविक राजनीतिक पद मानने की व्याख्या आरोपित नहीं होती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और उच्च काव्यात्मक हिन्दी। यूनानी के तीन समानांतर विस्मयात्मक संबोधनों को सुरक्षित रखा गया है, पर अस्वाभाविक शाब्दिकता से बचने के लिए βιαιότερε को ‘अधिक प्रबल’ और εὐτονώτερε को प्रसंगानुकूल ‘अधिक तेजस्वी’ किया गया है।
