- source_word: τὸ φαίνεσθαί τινας
  choice: कुछ लोगों का ... दिखाई देना
  rationale: यह पदबंध articular infinitive की संज्ञात्मक भूमिका तथा φαίνεσθαι में निहित दिखाई देने और वास्तविक होने के बीच के अंतर—दोनों को बनाए रखता है।
- source_word: παθοκρατεῖσθαι
  choice: मनोविकारों के वश में
  rationale: यौगिक क्रिया πάθη द्वारा नियंत्रित होने को बताती है। 'वश में' शासन अथवा नियंत्रण की छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: πάθος (within παθοκρατεῖσθαι)
  choice: मनोविकार
  rationale: इस ग्रंथ के दार्शनिक संदर्भ में यह उन इच्छाओं, आवेगों और भावनात्मक वृत्तियों को सूचित करता है जिन पर विवेक को शासन करना चाहिए; 'मनोविकार' यहाँ केवल आधुनिक अर्थ के मानसिक रोग को अभिप्रेत नहीं करता।
- source_word: διὰ τὸν ἀσθενῆ λογισμόν
  choice: अपने दुर्बल विवेक के कारण
  rationale: διά के कारणार्थ को 'के कारण' और λογισμός की तर्कपूर्ण निर्णय-क्षमता को 'विवेक' से व्यक्त किया गया है। 'अपने' हिन्दी में यह स्पष्ट करता है कि दुर्बल विवेक उन्हीं कुछ लोगों का है।
theological_decisions:
- issue: विवेक और मनोविकारों के बीच दार्शनिक विरोध
  choice: λογισμός को 'विवेक' और παθοκρατεῖσθαι को 'मनोविकारों के वश में' कहा गया है।
  alternative: '''बुद्धि'' और ''भावनाओं से पराजित'''
  rationale: चुना हुआ रूप ग्रंथ में विवेक के शासन और मनोविकारों के नियंत्रण की मूल अवधारणा को बनाए रखता है, पर किसी बाद की धार्मिक अथवा मनोवैज्ञानिक प्रणाली को पाठ में नहीं जोड़ता।
- issue: प्रतीत होने वाले प्रतिकूल उदाहरण का तार्किक प्रभाव
  choice: उसका दिखाई देना पहले के दावे का 'खंडन नहीं करता'।
  alternative: '''किसी बात के विरोध में नहीं है'''
  rationale: ἐναντιοῦται का मूल विरोधार्थ बना रहता है, जबकि तर्क-वितर्क के संदर्भ में 'खंडन नहीं करता' अधिक स्पष्ट और स्वाभाविक हिन्दी है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, तर्कप्रधान किंतु सामान्य पाठक के लिए सुबोध रूप। 'मनोविकार' को दार्शनिक अर्थ में आवेगों और वासनात्मक भावों के लिए प्रयोग किया गया है; वाक्य में कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
