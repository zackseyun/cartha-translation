translation:
  language: hi
  text: परन्तु जो लोग पूरे हृदय से[a] परमेश्वर-भक्ति का ध्यान रखते हैं, केवल वे ही शरीर के आवेगों[b] को वश में रख सकते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने सारे हृदय से।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘शरीर की वासनाओं पर अधिकार पा सकते हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ
  choice: परन्तु
  rationale: यह पिछले कथन के साथ विरोध या अंतर को चिह्नित करता है; ‘परन्तु’ उसकी प्रतिकूलार्थक शक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ὅσοι
  choice: जो लोग
  rationale: यह बहुवचन में लोगों के एक पूरे वर्ग को सूचित करता है; ‘जो लोग’ समावेशी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: τῆς εὐσεβείας
  choice: परमेश्वर-भक्ति
  rationale: यहाँ εὐσέβεια परमेश्वर और उसकी व्यवस्था के प्रति भक्तिपूर्ण निष्ठा का केंद्रीय सद्गुण है। ‘परमेश्वर-भक्ति’ केवल सामान्य धार्मिकता की अपेक्षा इसके ईश्वराभिमुख अर्थ को अधिक स्पष्ट रखती है।
- source_word: προνοοῦσιν
  choice: चिन्ता करते हैं
  rationale: क्रिया सक्रिय सरोकार, ध्यान और तत्परता व्यक्त करती है। ‘चिन्ता करते हैं’ यहाँ भय नहीं, बल्कि किसी बात की परवाह और देखभाल करने के अर्थ में प्रयुक्त है।
- source_word: ἐξ ὅλης καρδίας
  choice: पूरे हृदय से
  rationale: यह सम्पूर्ण आंतरिक समर्पण व्यक्त करता है और यूनानी रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οὗτοι μόνοι
  choice: केवल वे ही
  rationale: यह आगे बताई गई सामर्थ्य को उसी समूह तक सीमित करने वाले जोर को स्पष्ट रूप से बनाए रखता है।
- source_word: δύνανται κρατεῖν
  choice: वश में रख सकते हैं
  rationale: κρατεῖν यहाँ नियंत्रण या प्रभुत्व रखने का अर्थ देता है। ‘वश में रख सकते हैं’ सामर्थ्य और प्रभावी संयम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν τῆς σαρκὸς παθῶν
  choice: शरीर के आवेगों
  rationale: इस नैतिक-दर्शन संबंधी संदर्भ में πάθη का अर्थ दुःख नहीं, बल्कि प्रबल भावनाएँ, इच्छाएँ या आवेग है। ‘आवेग’ अर्थ को केवल यौन वासना तक सीमित नहीं करता; ‘शरीर के’ σάρξ के देहगत पक्ष को बनाए रखता है।
theological_decisions:
- issue: नैतिक-मानवशास्त्रीय संदर्भ में σάρξ का अनुवाद
  choice: शरीर
  alternative: मांस; पापी स्वभाव
  rationale: यह पद देह से जुड़े आवेगों की बात करता है, पर ‘पापी स्वभाव’ जैसी अधिक व्याख्यात्मक और धर्मसैद्धांतिक अभिव्यक्ति की माँग नहीं करता। हिन्दी में ‘शरीर’ स्रोत के देहगत अर्थ को स्पष्ट रखते हुए अनावश्यक सिद्धान्तगत निष्कर्ष से बचता है।
- issue: εὐσέβεια का ईश्वराभिमुख अर्थ
  choice: परमेश्वर-भक्ति
  alternative: भक्ति; धार्मिकता; श्रद्धा
  rationale: पुस्तक के संदर्भ में यह परमेश्वर और उसकी व्यवस्था के प्रति भक्तिपूर्ण निष्ठा का बोध कराता है। ‘परमेश्वर-भक्ति’ इस दिशा को स्पष्ट करता है, जबकि केवल ‘धार्मिकता’ नैतिक आचरण तक सीमित समझी जा सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘पूरे हृदय से’ शास्त्रीय रूपक को बनाए रखता है; ‘आवेगों’ से πάθη की व्यापकता बचती है और अर्थ को केवल यौन वासनाओं तक सीमित करने से बचा गया है।
