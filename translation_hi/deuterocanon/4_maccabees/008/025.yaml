  - marker: a
    text: 'यहाँ उपलब्ध यूनानी पाठ की वाक्य-रचना अधूरी है—शाब्दिक रूप से: “न तो/यहाँ तक कि नहीं, व्यवस्था स्वयं, स्वेच्छा से, हमें।” वर्ग कोष्ठकों में दिए गए शब्द पठनीयता के लिए संपादकीय पूर्ति हैं; उपलब्ध पाठ में वे पूर्ण रूप से प्रमाणित नहीं हैं। ‘स्वेच्छा से’ का वाक्य में सटीक संबंध भी इस खंडित अंश में अनिश्चित है।'
