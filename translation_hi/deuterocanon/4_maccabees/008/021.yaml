lexical_decisions:
- source_word: γῆρας
  choice: बुढ़ापा
  rationale: यह संज्ञा वृद्धावस्था को दर्शाती है। यूनानी पाठ में यह अकेला और आकस्मिक शब्द है, इसलिए अर्थ जोड़कर वाक्य पूरा करने के बजाय उसकी खंडित बनावट सुरक्षित रखी गई है।
- source_word: ἐνθυμηθῶμεν
  choice: हम विचार करें
  rationale: यह प्रथम पुरुष बहुवचन का प्रेरणार्थक संभावनार्थक रूप है; ‘हम विचार करें’ सामूहिक आत्मचिंतन के आह्वान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπειθοῦντες
  choice: यदि हम आज्ञा न मानें
  rationale: यद्यपि यूनानी में यह वर्तमान कृदंत है, यहाँ इसका परिस्थितिजन्य/शर्तसूचक बल है। ‘यदि’ उस व्यावहारिक चेतावनी को स्पष्ट करता है, बिना कारणता को अनावश्यक रूप से कठोर बनाए।
- source_word: τεθνηξόμεθα
  choice: हम मरेंगे
  rationale: θνῄσκω का भविष्यकालीन रूप परिणाम को सीधे व्यक्त करता है; ‘हम मरेंगे’ सरल, स्वाभाविक और अर्थ की दृष्टि से सटीक है।
