  text: When the tyrant saw them surrounding their mother in the middle as if in a chorus[a], he was impressed by them, and astonished at their good bearing and noble birth, he smiled at them; and calling them near, he said[b],
translation:
  language: hi
  text: जब उस अत्याचारी ने उन्हें मानो किसी नृत्य-मंडली की तरह अपनी माता को बीच में घेरे हुए देखा[a], तो वह उनसे प्रभावित हुआ। उनके सुंदर रूप और कुलीन वंश पर चकित होकर वह उनकी ओर मुस्कराया और उन्हें पास बुलाकर बोला,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो किसी गायक-दल में।” यूनानी शब्द सामूहिक गायन अथवा गोलाकार नृत्य करने वाले दल, दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ἰδὼν
  choice: जब ... ने उन्हें ... देखा
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी कथन के लिए ‘जब ... देखा’ के रूप में व्यक्त किया गया है।
- source_word: ὁ τύραννος
  choice: उस अत्याचारी
  rationale: τύραννος यहाँ सताने वाले शासक के लिए नकारात्मक और मूल्यांकनात्मक पद है; ‘अत्याचारी’ इस भाव को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: καθάπερ ἐν χορῷ
  choice: मानो किसी नृत्य-मंडली की तरह
  rationale: χορός में सामूहिक गायन के साथ गोलाकार नृत्य का बिंब भी निहित है। संदर्भ में माता को घेरे होने के कारण ‘नृत्य-मंडली’ उस समन्वित घेरे का दृश्य स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: περιέχοντας μέσην τὴν μητέρα
  choice: अपनी माता को बीच में घेरे हुए
  rationale: यह अनुवाद भाइयों द्वारा माता को घेरने और माता के मध्य में होने—दोनों स्थानिक बातों को सुरक्षित रखता है।
- source_word: ᾔσθετο ἐπʼ αὐτοῖς
  choice: वह उनसे प्रभावित हुआ
  rationale: वाक्यांश यहाँ उन पर ध्यान जाने से बढ़कर उनके द्वारा मन पर पड़े प्रभाव का संकेत देता है; फिर भी इसकी अपेक्षाकृत हल्की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: τῆς εὐπρεπείας
  choice: उनके गरिमामय रूप
  rationale: εὐπρέπεια आकर्षक बाहरी रूप, सुघड़ता और गरिमापूर्ण व्यक्तित्व को समेट सकता है। ‘गरिमामय रूप’ संदर्भ में रूप और शालीनता दोनों को व्यक्त करता है।
- source_word: τῆς εὐγενίας
  choice: कुलीनता
  rationale: εὐγένεια प्रायः उत्तम या कुलीन वंश का बोध कराता है। ‘कुलीनता’ मूल की संक्षिप्तता बनाए रखती है और केवल नैतिक चरित्र तक अर्थ सीमित नहीं करती।
- source_word: ἐκπλαγεὶς
  choice: चकित होकर
  rationale: यह तीव्र प्रतिक्रिया दर्शाने वाला कृदंत है; ‘चकित होकर’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: προσεμειδίασεν αὐτοῖς
  choice: वह उनकी ओर मुस्कराया
  rationale: क्रिया उनके प्रति या उनकी ओर मुस्कराने को दर्शाती है; यह हिन्दी प्रयोग स्वाभाविक और अर्थ-सटीक है।
- source_word: πλησίον καλέσας
  choice: उन्हें पास बुलाकर
  rationale: यह अगले वचन से पहले उन्हें निकट बुलाने की क्रिया को संक्षेप और सहज ढंग से व्यक्त करता है।
- source_word: ἔφη
  choice: बोला
  rationale: कथात्मक संवाद के आरम्भ में ‘बोला’ सरल और स्वाभाविक है।
