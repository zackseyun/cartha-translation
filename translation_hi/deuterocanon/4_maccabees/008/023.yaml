lexical_decisions:
- source_word: τί
  choice: क्यों
  rationale: यहाँ τί विचार-विमर्शात्मक आलंकारिक प्रश्न आरम्भ करता है, इसलिए ‘क्यों’ स्वाभाविक है।
- source_word: ἐξάγομεν ἑαυτοὺς
  choice: हम अपने आपको ... दूर करें
  rationale: शाब्दिक अर्थ ‘अपने आपको बाहर ले जाएँ’ है; हिन्दी में ‘से दूर करें’ उसी रूपक को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ ἡδίστου βίου
  choice: इस अत्यन्त सुखद जीवन से
  rationale: ἡδίστου उत्कृष्टतम अवस्था सूचित करता है और βίου यहाँ जीवन अथवा जीवन-दशा है; ‘अत्यन्त सुखद जीवन’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: καὶ
  choice: और
  rationale: दोनों क्रियाओं के साधारण समन्वय को बनाए रखता है।
- source_word: ἀποστεροῦμεν ἑαυτοὺς
  choice: अपने आपको वंचित करें
  rationale: ἀποστερέω का अर्थ किसी को किसी वस्तु से वंचित करना है। उपलब्ध यूनानी में वंचित किए जाने की वस्तु व्यक्त नहीं है, इसलिए हिन्दी में भी उसे नहीं जोड़ा गया।
