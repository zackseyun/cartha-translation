  text: मधुर संसार के…[a] हम अनिवार्यता के साथ ज़ोर-ज़बरदस्ती न करें,[b] और न अपने ही यातना-यंत्र को लेकर व्यर्थ गर्व करें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी अंश यहाँ संबंधकारक (‘मधुर संसार के’) से आरम्भ होता है और पिछले वाक्य पर निर्भर है; दीर्घविराम उसी अपूर्ण जुड़ाव को दिखाता है। ‘संसार’ से आशय वर्तमान सांसारिक जीवन भी हो सकता है।
    reason: textual_context
  - marker: b
    text: या, ‘जो अनिवार्य है उसे समय से पहले न बुलाएँ’ अथवा ‘अनिवार्यता के साथ बलपूर्वक व्यवहार न करें।’ यूनानी अभिव्यक्ति संक्षिप्त है और संभवतः अनिवार्य परीक्षा को उतावलेपन से आगे खींचने की बात करती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘अपने ही रैक को लेकर।’ यूनानी शब्द शरीर को मरोड़कर यातना देने वाले यंत्र को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γλυκέος κόσμου
  choice: मधुर संसार
  rationale: ‘मधुर’ मूल रूपक को बनाए रखता है और यहाँ वर्तमान सांसारिक जीवन के आकर्षण को व्यक्त करता है। यूनानी पद संबंधकारक में है और उपलब्ध अंश पिछले वाक्य से जुड़ा हुआ है, इसलिए हिंदी में अपूर्णता को दीर्घविराम से दिखाया गया है।
- source_word: μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: हम अनिवार्यता पर ज़ोर न डालें
  rationale: यह संक्षिप्त और असामान्य यूनानी अभिव्यक्ति बलपूर्वक दबाव डालने और अनिवार्य घटना को आगे खींचने—दोनों अर्थों की संभावना रखती है। हिंदी मुख्य पाठ जानबूझकर इस तनाव को पूरी तरह नहीं सुलझाता।
- source_word: μηδὲ κενοδοξήσωμεν
  choice: और न … व्यर्थ गर्व करें
  rationale: क्रिया में खोखले या निरर्थक आत्मगौरव का भाव है; ‘व्यर्थ गर्व’ आधुनिक हिंदी में स्वाभाविक रहते हुए इस तत्व को बनाए रखता है।
- source_word: ἐπὶ τῇ ἑαυτῶν στρέβλῃ
  choice: अपने ही यातना-यंत्र को लेकर
  rationale: στρέβλη यातना देने के लिए प्रयुक्त यंत्र, विशेषतः शरीर मरोड़ने वाले रैक, को सूचित करता है। ‘यातना-यंत्र’ सामान्य पाठक के लिए स्पष्ट है और किसी अत्यधिक विशिष्ट संरचना को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: μὴ βιαζώμεθα τὴν ἀνάγκην का आशय
  choice: मुख्य पाठ में ‘अनिवार्यता पर ज़ोर न डालें’ रखकर संपीड़ित अभिव्यक्ति की अस्पष्टता बनाए रखी गई है।
  alternative: ‘जो अनिवार्य है उसे समय से पहले न बुलाएँ’ अथवा ‘अनिवार्यता के विरुद्ध बल प्रयोग न करें।’
  rationale: शहादत की निकटवर्ती पृष्ठभूमि में वाक्य अनिवार्य परीक्षा को उतावलेपन से आगे खींचने के विरुद्ध हो सकता है, पर यूनानी स्वयं यह नहीं बताता कि बल अनिवार्यता को शीघ्र लाने के लिए है या उसके विरुद्ध। इसलिए किसी एक व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। स्रोत के आरम्भिक संबंधकारक खंड को कृत्रिम रूप से पूर्ण वाक्य में नहीं बदला गया; दीर्घविराम से उसके पिछले संदर्भ पर निर्भर होने का संकेत दिया गया है।
