base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/016.yaml
  text: 'And through their blessed courage they brought down his tyranny. Yet let us consider this: if some among them had been fainthearted and unmanly, what words would they have used? Would it not have been these?'
translation:
  language: hi
  text: 'और अपनी प्रशंसनीय सद्गुण[a] के द्वारा उन्होंने उसकी तानाशाही को ध्वस्त कर दिया। फिर भी, हम विचार करें: यदि उनमें से कुछ लोग भीरु और पुरुषोचित साहस से रहित[b] होते, तो वे किन शब्दों का प्रयोग करते? क्या वे इन्हीं शब्दों का प्रयोग न करते?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी कुलीनता,” “अपनी धन्यता,” अथवा संभवतः “उस श्रेष्ठता के द्वारा जिसके लिए वे प्रशंसा के योग्य थे।” यूनानी शब्द दुर्लभ है और यहाँ बोली गई आशीष के बजाय किसी प्रशंसनीय गुण का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में शाब्दिक भाव “पुरुषत्व से रहित” है। पुस्तक की सद्गुण-संबंधी भाषा में यह लिंग-आधारित अभिव्यक्ति है; अन्य अनुवाद हो सकते हैं: “साहसहीन” या “कायर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς εὐλογιστίας
  choice: अपने प्रशंसनीय सद्गुण के द्वारा
  rationale: εὐλογιστία एक दुर्लभ अमूर्त संज्ञा है। प्रसंग में यह मौखिक आशीष से अधिक किसी सराहनीय नैतिक श्रेष्ठता का बोध कराती है। ‘प्रशंसनीय सद्गुण’ इस प्रशंसात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी शब्द की अनिश्चितता बनाए रखती है।
- source_word: τὴν τυραννίδα αὐτοῦ κατέλυσαν
  choice: उन्होंने उसकी तानाशाही को ध्वस्त कर दिया
  rationale: καταλύω यहाँ अत्याचारी सत्ता को गिरा देने या निष्प्रभावी कर देने के रूपक में है। ‘ध्वस्त कर दिया’ उसकी प्रबलता को बनाए रखता है।
- source_word: καίτοι λογισώμεθα
  choice: फिर भी, हम विचार करें
  rationale: यह वाक्य एक काल्पनिक तर्क पर विचार करने का आह्वान करता है। हिन्दी में यह प्रथम-पुरुष बहुवचन के प्रोत्साहनात्मक भाव को सहज रूप से व्यक्त करता है।
- source_word: δειλόψυχοί
  choice: कायर मन के
  rationale: यह यौगिक शब्द भीतर से भयभीत या दुर्बल-हृदय होने का अर्थ देता है। ‘कायर मन के’ उसके मनोवैज्ञानिक और नैतिक पक्ष दोनों को रखता है।
- source_word: ἄνανδροι
  choice: पुरुषोचित साहस से रहित
  rationale: मूल यूनानी शब्द स्पष्टतः लिंग-आधारित है और तत्कालीन सद्गुण-विमर्श में पुरुषत्व तथा साहस के विपरीत गुण बताता है। यह अनुवाद उस आलंकारिक भेद को बनाए रखता है, पर आधुनिक हिन्दी के अत्यधिक अपमानजनक ‘नामर्द’ से बचता है।
- source_word: ποίοις ἂν ἐχρήσαντο λόγοις
  choice: वे कैसी बातें कहते
  rationale: λόγοις यहाँ आगे आने वाले कथनों की ओर संकेत करता है। ‘कैसी बातें कहते’ हिन्दी में स्वाभाविक है और प्रश्न के काल्पनिक भाव को व्यक्त करता है।
- source_word: οὐχὶ τούτοις;
  choice: क्या वे यही बातें न कहते?
  rationale: τούτοις आगे आने वाले कथन की ओर संकेत करता है। यह रूप मूल के अपेक्षित सकारात्मक उत्तर वाले आलंकारिक प्रश्न को सुरक्षित रखता है।
theological_decisions:
- issue: ἄνανδροι में लिंग-आधारित सद्गुण-भाषा
  choice: पुरुषोचित साहस से रहित
  alternative: कायर; साहसहीन; नामर्द
  rationale: लेखक की सद्गुण-संबंधी भाषा में पुरुषत्व और साहस का ऐतिहासिक संबंध स्पष्ट है। उसे पूरी तरह तटस्थ करने के बजाय अर्थ को बनाए रखा गया है, पर ऐसा आधुनिक शब्द नहीं चुना गया जो मूल से अधिक भड़काऊ लगे।
- issue: εὐλογιστία का दुर्लभ और अनिश्चित अर्थ
  choice: प्रशंसनीय सद्गुण
  alternative: धन्यता; कुलीनता; प्रशंसनीय श्रेष्ठता; धन्य साहस
  rationale: शब्द किसी प्रशंसनीय नैतिक गुण की ओर संकेत करता प्रतीत होता है, पर उसका सटीक आशय अनिश्चित है। मुख्य पाठ में पठनीय व्यापक अभिव्यक्ति और पादटिप्पणी में विकल्प देकर इस तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, तर्कप्रधान शैली रखी गई है। आलंकारिक प्रश्नों की श्रृंखला और आगे आने वाले कथन की ओर संकेत सुरक्षित है। दुर्लभ εὐλογιστία तथा लिंग-आधारित ἄνανδροι की जटिलता पादटिप्पणियों में स्पष्ट की गई है।
