translation:
  language: hi
  text: ये बातें कहते हुए, उसने यातना के उपकरण सामने लाने का आदेश दिया, ताकि वह भय दिखाकर भी उन्हें अपवित्र भोजन खाने के लिए राज़ी कर सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα δὲ λέγων
  choice: जब वह ये बातें कह रहा था
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ समय-संबंध व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से उस साथ-साथ चल रही क्रिया को बनाए रखता है।
- source_word: ἐκέλευσεν
  choice: उसने ... आदेश दिया
  rationale: यह अधिकारपूर्वक आज्ञा देने का सामान्य और प्रसंगानुकूल अर्थ है।
- source_word: εἰς τὸ ἔμπροσθεν προτεθῆναι
  choice: सामने लाने
  rationale: यह यातना के उपकरणों को आगे लाकर सामने प्रदर्शित करने का भाव संक्षेप में व्यक्त करता है।
- source_word: τὰ βασανιστήρια
  choice: यातना के उपकरण
  rationale: बहुवचन संज्ञा यहाँ केवल अमूर्त यातनाओं के बजाय यातना देने के साधनों या उपकरणों को सूचित कर सकती है।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्यवाचक उपवाक्य को स्पष्ट और स्वाभाविक हिंदी में प्रस्तुत करता है।
- source_word: καὶ διὰ τοῦ φόβου
  choice: डर के द्वारा भी
  rationale: καὶ साधन पर बल देता है और पहले के समझाने के प्रयासों के बाद डर का सहारा लेने की तीव्रता को बनाए रखता है।
- source_word: πείσειεν
  choice: मना सके
  rationale: यूनानी क्रिया का सामान्य अर्थ मनाना या राज़ी करना है; यातना के संदर्भ के बावजूद इसे सीधे ‘मजबूर करना’ कहना मूल से अधिक निर्णायक होता।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह सताए जा रहे भाइयों की ओर संकेत करने वाला प्रत्यक्ष कर्म है।
- source_word: μιεροφαγῆσαι
  choice: अपवित्र भोजन खाने
  rationale: यह संयुक्त क्रिया ऐसे भोजन को खाने का अर्थ देती है जो धार्मिक या नैतिक दृष्टि से दूषित करता है। ‘अपवित्र भोजन’ धार्मिक संदर्भ को स्पष्ट रखता है और केवल सड़े या खराब भोजन का भौतिक अर्थ उत्पन्न नहीं करता।
theological_decisions:
- issue: यहूदी शहादत के संदर्भ में μιεροφαγῆσαι का अनुवाद
  choice: अपवित्र भोजन खाने
  alternative: अशुद्ध भोजन खाने; दूषित भोजन खाने
  rationale: प्रसंग व्यवस्था द्वारा निषिद्ध भोजन से इनकार का है। ‘अपवित्र’ दूषण के धार्मिक और नैतिक बल को सुरक्षित रखता है, जबकि ‘अशुद्ध’ एक अधिक तकनीकी धार्मिक श्रेणी समझी जा सकती है और ‘दूषित’ हिंदी में खराब या विषाक्त भोजन का भ्रम पैदा कर सकता है। विकल्प को पादटिप्पणी में रखा गया है ताकि मूल की अर्थ-सीमा बनी रहे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यातना के उपकरण’ दृश्य में सामने रखी जाने वाली वस्तुओं को स्पष्ट करता है। ‘मना सके’ मूल क्रिया की मनाने वाली अर्थ-छाया को बनाए रखता है, जबकि पूरा प्रसंग उस मनाने के जबरदस्ती और भययुक्त स्वरूप को स्वयं स्पष्ट करता है।
