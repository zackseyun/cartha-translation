  yaml_path: translation/deuterocanon/4_maccabees/008/009.yaml
  text: And after changing your way of life[a], enjoy your youth. But if by your disobedience you provoke me to anger, you will force me, through dreadful punishments, to destroy each one of you by tortures.
translation:
  language: hi
  text: और अपनी जीवन-रीति बदलकर अपनी जवानी का आनंद लो; क्योंकि यदि तुम अपनी अवज्ञा से मुझे क्रोध दिलाओगे[a], तो तुम मुझे विवश करोगे कि मैं भयानक दंडों के द्वारा तुममें से एक-एक को यातनाएँ देकर नष्ट कर दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “यदि तुम अपनी अवज्ञा के द्वारा मेरे साथ क्रोधपूर्वक व्यवहार करोगे।” यूनानी वाक्यांश कठिन है; मुख्य पाठ में उसका संभावित आशय दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταδιαιτηθέντες
  choice: अपनी जीवन-रीति बदलकर
  rationale: यह कृदंत जीवन जीने के ढंग या आचार में परिवर्तन को दर्शाता है। यह स्वाभाविक हिन्दी है और मूल में स्पष्ट न होने वाली ‘पश्चात्ताप’ जैसी धार्मिक धारणा नहीं जोड़ती।
- source_word: ἐντρυφήσατε
  choice: आनंद लो
  rationale: आज्ञार्थक क्रिया यहाँ सुख लेने या आनंद मनाने का भाव देती है। ‘विलास करो’ अनावश्यक नैतिक नकारात्मकता जोड़ सकता है।
- source_word: ταῖς νεότησιν ὑμῶν
  choice: अपनी जवानी का
  rationale: यूनानी बहुवचन को हिन्दी में जीवन की युवा अवस्था के रूप में एकवचन ‘जवानी’ कहना स्वाभाविक है।
- source_word: ὀργίλως ... διαθῆσθε
  choice: मुझे क्रोध दिलाओगे
  rationale: कठिन यूनानी रचना का प्रसंगानुकूल अर्थ यह है कि उनकी अवज्ञा वक्ता को क्रोधित अवस्था में पहुँचा देगी। वैकल्पिक अधिक शाब्दिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ἀπειθείας
  choice: अवज्ञा
  rationale: यह आज्ञा न मानने या अनुपालन से इनकार करने का सीधा और संक्षिप्त हिन्दी रूप है।
- source_word: δειναῖς κολάσεσιν
  choice: भयानक दंडों के द्वारा
  rationale: यह दंडों की तीव्रता और साधनात्मक संबंध, दोनों को बनाए रखता है।
- source_word: βασάνων
  choice: यातनाएँ देकर
  rationale: इस न्यायिक और हिंसक प्रसंग में βάσανος यातना या कठोर शारीरिक पीड़ा को सूचित करता है।
- source_word: ἀπολέσαι
  choice: नष्ट कर दूँ
  rationale: यह ἀπόλλυμι के मूल भाव को बनाए रखता है; प्रसंग में इसका आशय यातनाओं से मृत्यु देना है।
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: तुममें से एक-एक को
  rationale: यह दोहरे वितरणात्मक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ἐὰν ὀργίλως με διαθῆσθε की कठिन और संभावित रूप से अस्पष्ट रचना
  choice: यदि तुम अपनी अवज्ञा से मुझे क्रोध दिलाओगे
  alternative: यदि तुम अपनी अवज्ञा के कारण मेरे साथ क्रोधपूर्वक व्यवहार करोगे
  rationale: अगले उपवाक्य में वक्ता के विवश होकर दंड देने की धमकी के कारण मुख्य पाठ में कारक अर्थ अधिक संगत है। फिर भी यूनानी वाक्यांश का अधिक शाब्दिक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। धमकी की कठोरता तथा ‘दंडों’ और ‘यातनाओं’ की मूल पुनरुक्ति को बनाए रखा गया है।
