base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/026.yaml
  text: Why has such contentiousness been instilled in us[a], and why does deadly endurance please us, when it is possible to live in tranquility by obeying the king, after becoming afraid of the tortures that lead to death?
translation:
  language: hi
  text: मृत्यु की ओर ले जानेवाली यातनाओं से डरकर; हमारे भीतर ऐसी कलहप्रियता कहाँ से समा गई है[a], और हमें यह प्राणघातक धीरज क्यों भाता है, जबकि राजा की बात मानकर निश्चिंत जीवन जीना हमारे लिए संभव है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वीट के यूनानी पाठ में आरम्भिक पदों का वाक्य-संबंध कठिन है। आशय यह प्रतीत होता है कि मृत्यु की ओर ले जानेवाली यातनाओं से डरकर राजा की बात मान लेने पर हमारे लिए निश्चिंत जीवन उपलब्ध था।
    reason: textual_variant
lexical_decisions:
- source_word: θανατοῖ φοβηθέντας τὰ βασανιστήρια
  choice: मृत्यु की ओर ले जानेवाली यातनाओं से डरकर
  rationale: यूनानी पद-विन्यास कठिन है; यह अनुवाद मृत्यु से जुड़ी यातनाओं के भय को व्यक्त करता है और अनिश्चित वाक्य-संबंध को डैश द्वारा खुला रखता है।
- source_word: πόθεν
  choice: कहाँ से
  rationale: मूल के उद्गम-सूचक प्रश्न को बनाए रखता है और हिन्दी में कारण पर किया गया आलंकारिक प्रश्न भी स्वाभाविक सुनाई देता है।
- source_word: ἡ τοσαύτη ἐντέτηκεν φιλονεικία
  choice: हमारे भीतर ऐसी झगड़ालू हठधर्मिता ... समा गई है
  rationale: φιλονεικία के कलहप्रिय, नकारात्मक भाव और ἐντέτηκεν के भीतर गहरे समा जाने के चित्र—दोनों को व्यक्त करता है।
- source_word: ἡ θανατηφόρος ... καρτερία
  choice: यह प्राणघातक धीरज
  rationale: कार्टेरिया के धीरज/दृढ़ सहनशीलता और θανατηφόρος की मृत्युकारक अथवा मृत्यु की ओर ले जानेवाली अस्पष्टता को संक्षेप में सुरक्षित रखता है।
- source_word: ἀρέσκει
  choice: हमें ... भाता है
  rationale: व्यक्तिगत आकर्षण या प्रसन्नता का भाव स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: παρὸν
  choice: हमारे लिए संभव है
  rationale: उपलब्ध संभावना का अर्थ स्पष्ट करता है, बिना इसे कठोर शर्तवाचक संरचना में बदलने के।
- source_word: μετὰ ἀταραξίας ζῆν
  choice: निश्चिंत जीवन जीना
  rationale: व्यवधान, अशांति और भय से मुक्त जीवन का सहज हिन्दी रूप है।
- source_word: τῷ βασιλεῖ πεισθέντας
  choice: राजा की बात मानकर
  rationale: πεισθέντας में निहित मान जाने/आज्ञापालन करने का व्यावहारिक अर्थ व्यक्त करता है, जबकि जबरन किसी खास अर्थ को नहीं थोपता।
theological_decisions:
- issue: राजा के भाषण में भाइयों की दृढ़ता का मूल्यांकन
  choice: नकारात्मक शब्दावली—“झगड़ालू हठधर्मिता” और “प्राणघातक धीरज”—बनाए रखी गई है।
  alternative: इसे सकारात्मक रूप में “उत्साह,” “साहस,” या “शहीदी दृढ़ता” कहना।
  rationale: यह राजा की ओर से उन्हें लज्जित करके झुकाने का प्रयास है; कथावाचक की समग्र प्रशंसा को इस विरोधी वक्ता के शब्दों में मिला देना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। डैश आरम्भिक यूनानी खंड की वाक्यगत कठिनाई दिखाता है। “हठधर्मिता” यहाँ किसी धार्मिक सम्प्रदाय का संकेत नहीं, बल्कि वक्ता की दृष्टि में अड़ियल और कलहप्रिय रवैये का वर्णन है।
