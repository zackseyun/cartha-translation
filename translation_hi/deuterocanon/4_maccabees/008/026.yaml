  to: मृत्यु की ओर ले जानेवाली यातनाओं से डरकर; हमारे भीतर ऐसी कलहप्रियता कहाँ से समा गई है[a], और हमें यह प्राणघातक धीरज क्यों भाता है, जबकि राजा की बात मानकर निश्चिंत जीवन जीना हमारे लिए संभव है?
