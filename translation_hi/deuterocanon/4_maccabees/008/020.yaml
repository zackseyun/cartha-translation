  yaml_path: translation/deuterocanon/4_maccabees/008/020.yaml
  text: Let us have mercy on our own youth[a], and let us pity our mother’s old age,
translation:
  language: hi
  text: आओ, हम अपनी जवानी पर दया करें और अपनी माँ के बुढ़ापे पर तरस खाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक रूप से ‘और हम माँ की [दशा/बात] पर तरस खाएँ’ है; इस पाठ-साक्षी में संज्ञा व्यक्त नहीं की गई है। प्रसंग के आधार पर ‘बुढ़ापा’ सबसे संभावित अर्थ मानकर जोड़ा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐλεήσωμεν
  choice: आओ, हम ... पर दया करें
  rationale: यह प्रथम पुरुष बहुवचन का प्रोत्साहनसूचक रूप है। ‘दया करें’ करुणा की अपील को सीधे व्यक्त करता है और ‘अपने प्राण बचाएँ’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: τὰς ἑαυτῶν ἡλικίας
  choice: अपनी जवानी
  rationale: ἡλικία आयु, जीवन-अवस्था या युवावस्था को सूचित कर सकता है। यहाँ युवा भाइयों से अपने युवा जीवनों का विचार करने को कहा जा रहा है, इसलिए ‘अपनी जवानी’ प्रसंग और भाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατοικτειρήσωμεν
  choice: तरस खाएँ
  rationale: यह भी प्रथम पुरुष बहुवचन का प्रोत्साहनसूचक रूप है और करुणामय सहानुभूति व्यक्त करता है। ‘तरस खाएँ’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τὸ τῆς μητρὸς
  choice: अपनी माँ के बुढ़ापे
  rationale: स्वीट के पाठ में संबंधवाचक पद के बाद संज्ञा लुप्त है। प्रसंग के आधार पर माँ की वृद्धावस्था सबसे संभावित पूर्ति है; हिन्दी में ‘बुढ़ापे’ उस अभिप्राय को स्पष्ट करता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
