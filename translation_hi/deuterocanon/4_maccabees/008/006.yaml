base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/006.yaml
  text: I urge you, by agreeing with me, to enjoy my friendship[a]; for just as I have power to punish those who disobey my commands[b], so also to do good to those who obey me well.
translation:
  language: hi
  text: मैं तुमसे आग्रह करता हूँ कि मेरी बात मानकर[a] मेरी मित्रता[b] का लाभ उठाओ; क्योंकि जैसे मेरे आदेशों की अवज्ञा करनेवालों को दंड देने की शक्ति मुझमें है, वैसे ही सहजता से मेरी आज्ञा माननेवालों का भला करने की शक्ति भी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे आगे झुककर” अथवा “मुझसे सहमत होकर”; यहाँ का यूनानी प्रयोग कुछ कठिन है, पर वक्ता के प्रति अनुपालन की माँग स्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: राजकीय प्रसंग में “मेरी मित्रता” का अर्थ “मेरी कृपादृष्टि” या “मेरा अनुग्रह” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: मैं तुमसे आग्रह करता हूँ
  rationale: यहाँ शासक केवल विनम्र निवेदन नहीं, बल्कि दबाव से भरा प्रबल आग्रह कर रहा है; ‘आग्रह करता हूँ’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस बल को व्यक्त करता है।
- source_word: συνείξαντάς μοι
  choice: मेरी बात मानकर
  rationale: यह कठिन कृदन्तीय प्रयोग वक्ता के प्रति सहमति, समर्पण या अनुपालन का भाव रखता है। ‘मेरी बात मानकर’ हिन्दी में साधनसूचक संबंध को बनाए रखता है और प्रसंगानुकूल अनुपालन व्यक्त करता है।
- source_word: τῆς ἐμῆς ἀπολαῦσαι φιλίας
  choice: मेरी मित्रता का लाभ उठाओ
  rationale: ἀπολαύω किसी वस्तु का उपभोग या उससे लाभ पाने को और φιλία मित्रता को सूचित करता है। राजकीय प्रसंग में मित्रता के साथ कृपादृष्टि का भाव भी है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: δύναμιν
  choice: शक्ति
  rationale: वक्ता दंड और लाभ—दोनों देने की वास्तविक सामर्थ्य का दावा करता है। ‘शक्ति’ व्यावहारिक सामर्थ्य और पद से प्राप्त बल दोनों को समेटती है।
- source_word: κολάζειν
  choice: दंड देने
  rationale: राजकीय आदेशों का उल्लंघन करनेवालों के विरुद्ध दंडात्मक कार्रवाई इस क्रिया का स्पष्ट प्रसंगगत अर्थ है।
- source_word: τοὺς ἀπειθοῦντάς μου τοῖς ἐπιτάγμασιν
  choice: मेरे आदेशों की अवज्ञा करनेवालों
  rationale: ἀπειθέω आदेश न मानने या उसका विरोध करने और ἐπιτάγματα आधिकारिक आदेशों को दर्शाता है; यह हिन्दी पदबंध दोनों अर्थों को स्पष्टता से रखता है।
- source_word: εὐεργετεῖν
  choice: भला करने
  rationale: क्रिया का अर्थ लाभ पहुँचाना या उपकार करना है। ‘भला करने’ लाभ के स्वरूप को अनावश्यक रूप से सीमित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: τοὺς εὐπειθοῦντάς μου
  choice: सहजता से मेरी आज्ञा माननेवालों
  rationale: εὐπειθέω केवल आज्ञापालन नहीं, बल्कि तत्पर या सहज अनुपालन का भाव भी दे सकता है। यह अनुवाद उस अतिरिक्त भाव को पठनीय हिन्दी में बनाए रखता है।
theological_decisions:
- issue: शासक द्वारा प्रस्तुत φιλία का स्वरूप
  choice: मुख्य पाठ में ‘मित्रता’
  alternative: कृपादृष्टि; राजकीय अनुग्रह
  rationale: φιλία का प्रत्यक्ष अर्थ ‘मित्रता’ है, पर शासक के मुख से यह संरक्षण और राजकीय अनुग्रह का राजनीतिक अर्थ भी रख सकती है। मुख्य पाठ मूल शब्द का व्यक्तिगत स्वर बनाए रखता है और पादटिप्पणी उसके संरक्षकतापरक अर्थ को खोलती है।
- issue: συνείξαντάς μοι में सहमति और समर्पण के बीच तनाव
  choice: ‘मेरी बात मानकर’
  alternative: मेरे आगे झुककर; मुझसे सहमत होकर
  rationale: यूनानी रूप कुछ कठिन है और सहमति से लेकर समर्पण तक का भाव दे सकता है। मुख्य पाठ अनुपालन का व्यापक अर्थ रखता है, जबकि पादटिप्पणी वास्तविक विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। शासक की दबावपूर्ण वाणी को ‘आग्रह’, ‘आदेश’, ‘दंड’ और ‘शक्ति’ से व्यक्त किया गया है; साथ ही यूनानी पाठ की अस्पष्टताओं को मुख्य पाठ में जबरन हल करने के बजाय पादटिप्पणियों में सुरक्षित रखा गया है।
