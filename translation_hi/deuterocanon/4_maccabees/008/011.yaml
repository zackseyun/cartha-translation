  text: And I pity your beauty. Will you not consider this—that nothing lies before you[a], if you disobey, except to die amid tortures?
translation:
  language: hi
  text: और मुझे तुम्हारे सुंदर रूप पर तरस आता है। क्या तुम इस पर विचार नहीं करोगे कि यदि तुम आज्ञा न मानो, तो यातनाओं के बीच मरने के सिवा तुम्हारे लिए और कुछ नहीं रखा हुआ है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “यातनाओं के साथ मरना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐμορφίας
  choice: सुंदर रूप
  rationale: यह संज्ञा शारीरिक सुंदरता या सुडौल रूप को दर्शाती है। ‘सुंदर रूप’ आधुनिक हिन्दी में स्वाभाविक है और केवल अमूर्त ‘सुंदरता’ की अपेक्षा व्यक्तियों के बाहरी रूप की ओर अधिक स्पष्ट संकेत करता है।
- source_word: οἰκτείρομαι
  choice: मुझे … पर तरस आता है
  rationale: यह क्रिया दया या करुणा अनुभव करने को व्यक्त करती है। यह हिन्दी प्रयोग संक्षिप्त है और वक्ता के दिखावटी, दबाव डालने वाले दयाभाव को बनाए रखता है।
- source_word: διαλογιεῖσθε
  choice: क्या तुम यह नहीं सोचोगे
  rationale: क्रिया का अर्थ विचार करना, मन में तर्क करना या सोच-विचार करना हो सकता है। आलंकारिक प्रश्न में यह सरल और स्वाभाविक हिन्दी है।
- source_word: ἀπειθήσασιν
  choice: यदि तुम आज्ञा न मानो
  rationale: कृदंत अवज्ञा या आज्ञा मानने से इनकार दर्शाता है। शर्तसूचक अनुवाद वाक्य की धमकीपूर्ण संरचना को स्पष्ट करता है; यूनानी में कर्म स्पष्ट न होने के कारण ‘मेरी’ नहीं जोड़ा गया।
- source_word: ἀπόκειται
  choice: तुम्हारे लिए … रखा है
  rationale: क्रिया का मूल भाव किसी परिणाम का रखा या नियत होना है। यह चयन उस भाव को बनाए रखता है और हिन्दी में स्वाभाविक भी है।
- source_word: στρεβλῶν
  choice: यातनाओं
  rationale: बहुवचन रूप मरोड़ने या यातना-यंत्र से जुड़ी यातनाओं को सूचित करता है। ‘यातनाओं’ स्पष्ट और प्रसंगानुकूल है; किसी खास यंत्र को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀποθανεῖν
  choice: मरने
  rationale: अनंत क्रिया का सीधा अर्थ ‘मरना’ है। आसपास का वाक्यांश यातना का ढंग स्पष्ट कर देता है, इसलिए ‘मार डाले जाने’ जैसा विस्तार आवश्यक नहीं।
