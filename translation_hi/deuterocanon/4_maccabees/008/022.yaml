lexical_decisions:
- source_word: συγγνώσεται
  choice: क्षमा कर देगा
  rationale: यहाँ भविष्यत् रूप का अर्थ दोष की परिस्थिति को ध्यान में रखकर क्षमा करना है; व्यक्तिगत कर्म ‘हमें’ के साथ यह स्वाभाविक और नैतिक-न्यायिक संदर्भ के अनुकूल है।
- source_word: ἡ θεία δίκη
  choice: ईश्वरीय न्याय
  rationale: δίκη में न्याय, न्याय-निर्णय या दण्ड के अर्थ संभव हैं। ‘ईश्वरीय न्याय’ इस बहुअर्थकता और न्याय के मानवीकरण—उसके क्षमा करने—को यथासंभव सुरक्षित रखता है।
- source_word: διʼ ἀνάγκην
  choice: विवश होकर
  rationale: यह पद बाहरी बाध्यता के कारण किए गए कार्य को दर्शाता है और आधुनिक हिन्दी में सहज ढंग से अगले कृदन्त से जुड़ता है।
- source_word: τὸν βασιλέα
  choice: राजा से
  rationale: βασιλεύς का सीधा अर्थ ‘राजा’ है; φοβηθεῖσιν के साथ हिन्दी में भय का लक्ष्य ‘से’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: φοβηθεῖσιν
  choice: डर जाएँ
  rationale: अओरिस्ट निष्क्रिय कृदन्त यहाँ भयभीत हो जाने का भाव देता है। शर्त-सदृश कथन में ‘डर जाएँ’ स्वाभाविक है और भय में प्रवेश करने की छाया बनाए रखता है।
theological_decisions:
- issue: δίκη को व्यापक ‘न्याय’ मानें या दण्डात्मक ‘न्याय-निर्णय/दण्ड’
  choice: ईश्वरीय न्याय
  alternative: ईश्वरीय न्याय-निर्णय; ईश्वरीय दण्ड
  rationale: मूल में न्याय को क्षमा करते हुए दिखाया गया है। व्यापक ‘न्याय’ उस धार्मिक तनाव को बनाए रखता है कि ईश्वरीय न्याय विवशता को ध्यान में रख सकता है, जबकि ‘दण्ड’ अर्थ को अनावश्यक रूप से संकीर्ण कर देगा।
- issue: διʼ ἀνάγκην और कृदन्त को कारणात्मक कथन मानें या संभाव्य शर्त
  choice: यदि हम विवश होकर राजा से डर जाएँ
  alternative: क्योंकि हम विवश होकर राजा से डर गए
  rationale: वक्ता भविष्य में संभावित समझौते के लिए क्षमा की दलील दे रहा है; हिन्दी में ‘यदि…तो’ इस आशय को स्पष्ट और स्वाभाविक बनाता है, यद्यपि यूनानी व्याकरण को अधिक औपचारिक रूप से कारणात्मक भी समझा जा सकता है।
