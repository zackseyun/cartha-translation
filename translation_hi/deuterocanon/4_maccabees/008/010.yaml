  text: Therefore have pity on yourselves[a], on whom even I, your enemy, have pity because of your age.
translation:
  language: hi
  text: इसलिए अपने ऊपर दया करो; तुम पर तो मैं भी, तुम्हारा शत्रु होकर, तुम्हारी आयु[a] के कारण दया करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी युवावस्था के कारण।” यूनानी शब्द किसी व्यक्ति की आयु के साथ-साथ उसके जीवन की विशेष अवस्था को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελεήσατε
  choice: दया करो
  rationale: यह भूतकालिक आज्ञार्थक रूप करुणा दिखाने की सीधी अपील करता है। ‘दया करो’ आधुनिक हिन्दी में स्वाभाविक और भाव की दृष्टि से उपयुक्त है।
- source_word: ἑαυτούς
  choice: अपने ऊपर
  rationale: आत्मवाचक सर्वनाम को हिन्दी में ‘अपने ऊपर’ कहना स्वाभाविक है और स्वयं के प्रति दया का भाव स्पष्ट रखता है।
- source_word: οὓς
  choice: तुम पर
  rationale: सम्बन्धवाचक सर्वनाम पहले आए ‘अपने ऊपर’ को फिर से ग्रहण करता है। हिन्दी में स्वतंत्र उपवाक्य ‘तुम पर तो’ मूल सम्बन्ध को सहज रूप से व्यक्त करता है।
- source_word: ὁ πολέμιος
  choice: तुम्हारा शत्रु
  rationale: शाब्दिक अर्थ ‘शत्रु’ है; प्रसंग में वक्ता स्वयं को सुननेवालों का शत्रु बताता है, इसलिए सम्बन्धसूचक ‘तुम्हारा’ स्पष्ट और स्वाभाविक है।
- source_word: ἔγωγε
  choice: मैं भी
  rationale: बलाघाती प्रथम पुरुष का आशय है कि शत्रु होने पर भी वक्ता दया करता है। ‘मैं भी’ इस अलंकारिक बल को सहज हिन्दी में बनाए रखता है।
- source_word: τῆς ἡλικίας
  choice: तुम्हारी आयु के कारण
  rationale: ἡλικία सामान्यतः आयु या जीवन की अवस्था को सूचित कर सकता है और प्रसंग में युवावस्था का विशेष अर्थ भी सम्भव है। मुख्य पाठ में व्यापक अर्थ रखा गया है।
theological_decisions:
- issue: ἡλικία का विशिष्ट आशय
  choice: तुम्हारी आयु के कारण
  alternative: तुम्हारी युवावस्था के कारण
  rationale: यूनानी शब्द सामान्य आयु अथवा जीवन की अवस्था को दर्शा सकता है। प्रसंग युवावस्था की ओर संकेत कर सकता है, पर दिए गए यूनानी पाठ में संकुचित अर्थ अनिवार्य नहीं है; इसलिए मुख्य पाठ व्यापक अर्थ रखता है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की बलाघाती तुलना को ‘तुम पर तो मैं भी’ और विरोधी सम्बन्ध को ‘तुम्हारा शत्रु होकर’ से व्यक्त किया गया है।
