lexical_decisions:
- source_word: περίφρονες
  choice: तुच्छ समझते थे
  rationale: यह विशेषण केवल कष्ट सहने या उनसे उदासीन रहने की नहीं, बल्कि उन्हें हेय समझकर उनकी अवहेलना करने की प्रबल भावना व्यक्त करता है। हिंदी में क्रियात्मक पदबंध अधिक स्वाभाविक है।
- source_word: τῶν παθῶν
  choice: कष्टों को
  rationale: शहादत और यातना के इस प्रसंग में πάθη का आशय भीतरी वासनाओं के बजाय झेले गए कष्टों से है।
- source_word: αὐτοκράτορες
  choice: अधिकार रखते थे
  rationale: शब्द अपने ऊपर स्वयं शासन करने से आगे, किसी वस्तु पर प्रभुत्व या नियंत्रण रखने का भाव देता है। यह रूप हिंदी में स्वाभाविक रहते हुए उस प्रभुत्व को बनाए रखता है।
- source_word: τῶν ἀλγηδόνων
  choice: पीड़ाओं पर
  rationale: ἀλγηδών विशेषतः शारीरिक दर्द या पीड़ा को दर्शाता है। ‘पीड़ाओं’ से मूल का बहुवचन और शारीरिक वेदना का भाव सुरक्षित रहता है।
theological_decisions:
- issue: शारीरिक कष्ट पर विवेक अथवा आत्म-संयम के प्रभुत्व का स्वरूप
  choice: पद को कष्टों की अवहेलना और पीड़ाओं पर अधिकार के संक्षिप्त कथन के रूप में रखा गया है।
  alternative: इसे स्तोइक निर्विकारता या विवेक द्वारा वासनाओं पर विजय की स्पष्ट दार्शनिक घोषणा के रूप में विस्तारित किया जा सकता था।
  rationale: यूनानी वाक्य संक्षिप्त और वर्णनात्मक है। अनुवाद उसके आत्म-नियंत्रण और पीड़ा पर प्रभुत्व के दावे को बनाए रखता है, पर ऐसी दार्शनिक या सांप्रदायिक व्याख्या नहीं जोड़ता जो इस पद में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘कष्ट’ और ‘पीड़ा’ के भेद से πάθη तथा ἀλγηδόνες की निकटवर्ती किंतु अलग अभिव्यक्तियाँ सुरक्षित रखी गई हैं; भाषा में अनावश्यक दार्शनिक विस्तार नहीं जोड़ा गया।
