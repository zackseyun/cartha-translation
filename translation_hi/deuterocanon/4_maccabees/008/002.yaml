  text: Then[a], becoming deeply agitated, he ordered that others from among the Hebrews of that age be brought in; and if they would eat meat from the thigh, to release those who were brought in, but if they objected[c][b], to torture them more severely.
translation:
  language: hi
  text: तब वह अत्यन्त उद्विग्न हो उठा और उसने आज्ञा दी कि इब्रानियों में से उसी आयु-वर्ग के कुछ और लोगों को लाया जाए।[a] यदि वे जाँघ का मांस खा लें,[b] तो उन्हें छोड़ दिया जाए; पर यदि वे विरोध करें, तो उन्हें और अधिक कठोर यातना दी जाए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में आयु का स्पष्ट उल्लेख है; अर्थ यह भी हो सकता है, ‘उसी आयु के कुछ और इब्रानियों को।’
    reason: lexical_alternative
  - marker: b
    text: दिए गए यूनानी पाठ का शाब्दिक अर्थ ‘जाँघ का मांस खाना’ है। प्रसंग के कारण कुछ लोग इसे निषिद्ध मांस, विशेषकर सूअर के मांस, के संदर्भ में समझते हैं।
    reason: source_ambiguity
  - marker: c
    text: ‘और अधिक कठोर’ के लिए प्रयुक्त यूनानी शब्द का शाब्दिक अर्थ ‘अधिक कड़वे ढंग से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: तब
  rationale: यह कथानक में अगले निर्णायक कदम को सूचित करता है। हिन्दी में ‘तब’ स्वाभाविक है; δὴ का बल आगे के प्रसंग से व्यक्त हो जाता है।
- source_word: σφόδρα περιπαθὼς
  choice: अत्यन्त उद्विग्न हो उठा
  rationale: περιπαθών तीव्र भावात्मक विक्षोभ बताता है, पर केवल क्रोध या केवल दुःख निश्चित नहीं करता। ‘उद्विग्न’ इस अस्पष्टता को बनाए रखता है और σφόδρα की तीव्रता ‘अत्यन्त’ से व्यक्त होती है।
- source_word: ἐκέλευσεν
  choice: उसने आज्ञा दी
  rationale: राजकीय आदेश के लिए यह गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: ἄλλους ἐκ τῆς ἡλικίας τῶν Ἑβραίων
  choice: इब्रानियों में से उसी आयु-वर्ग के कुछ और लोगों
  rationale: ἡλικία में आयु अथवा जीवन-अवस्था का स्पष्ट संकेत है। ‘उसी आयु-वर्ग’ उसे सामान्य ‘कुछ और इब्रानियों’ में विलीन नहीं होने देता।
- source_word: ἀγαγεῖν
  choice: लाया जाए
  rationale: आज्ञा पर निर्भर अनन्त क्रिया को हिन्दी में कर्मवाच्य रूप से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: μηροφαγοῖεν
  choice: जाँघ का मांस खा लें
  rationale: दिए गए यूनानी पाठ में μηρο- ‘जाँघ’ और -φαγοῖεν ‘खाएँ’ है। इसलिए संदर्भ के आधार पर इसे चुपचाप ‘सूअर का मांस’ नहीं बनाया गया।
- source_word: ἀπολύειν ἀγώντας
  choice: उन्हें छोड़ दिया जाए
  rationale: प्रेषित वाक्यांश का रूप कठिन है; प्रसंग में शर्त मानने वाले लाए गए व्यक्तियों की रिहाई अभिप्रेत है। हिन्दी में अनावश्यक कर्ता जोड़े बिना परिणाम स्पष्ट रखा गया है।
- source_word: ἀντιλέγοιεν
  choice: वे विरोध करें
  rationale: क्रिया का मूल अर्थ बोलकर प्रतिवाद या आपत्ति करना है। ‘विरोध करें’ केवल मौन अस्वीकार से अधिक निकट है।
- source_word: πικρότερον βασανίζειν
  choice: पहले से भी अधिक कठोर यातना दी जाए
  rationale: πικρότερον का शाब्दिक बिंब ‘अधिक कड़वाहट से’ है, लेकिन यातना के प्रसंग में इसका स्वाभाविक अर्थ अधिक कठोरता है। तुलनात्मक बल ‘पहले से भी अधिक’ से स्पष्ट किया गया है।
theological_decisions:
- issue: राजा की भावात्मक अवस्था
  choice: अत्यन्त उद्विग्न
  alternative: अत्यन्त क्रोधित / बहुत दुःखी
  rationale: περιπαθών तीव्र भावावेग व्यक्त करता है, पर भाव को निश्चित रूप से क्रोध या दुःख नहीं ठहराता। अनुवाद ने इसी तनाव को खुला रखा है।
- issue: μηροφαγοῖεν में खाए जाने वाले मांस की पहचान
  choice: जाँघ का मांस
  alternative: सूअर का मांस / अशुद्ध मांस
  rationale: निकटवर्ती शहादत-वृत्तांत में सूअर के मांस का प्रसंग हो सकता है, पर दिए गए स्रोत-पाठ का रूप सीधे ‘जाँघ का मांस खाना’ कहता है। धर्मशास्त्रीय संदर्भ के कारण शब्दरूप को बदला नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। भावात्मक अस्पष्टता, आयु-संदर्भ, कठिन प्रेषित वाक्यांश और μηροφαγοῖεν के वास्तविक शब्दरूप को दबाया नहीं गया; आवश्यक स्पष्टीकरण पादटिप्पणियों में दिया गया है।
