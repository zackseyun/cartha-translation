  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘दार्शनिक तर्कों’ जानबूझकर कुछ विशिष्ट है, क्योंकि मूल यूनानी में दर्शन-संबंधी शब्द स्पष्ट रूप से उपस्थित है।
