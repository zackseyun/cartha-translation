translation:
  language: hi
  text: लेकिन जब उन्होंने उन्हें फुसलाने वाली बातें[a] सुनीं और भयानक यातनाएँ[b] देखीं, तो वे न केवल नहीं डरे, बल्कि उस अत्याचारी के विरुद्ध दार्शनिक तर्क भी किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मनाने वाली बातें’ या ‘लुभाने वाली बातें’ भी हो सकता है। यूनानी शब्द धमकियों से पहले या उनके साथ उन्हें अपने पक्ष में करने के प्रयासों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘भयानक बातें’ है; यहाँ प्रसंग में इससे उनके सामने रखी गई यातनाएँ या भयावह दृश्य अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में भाव है, ‘अत्याचारी के विरुद्ध दार्शनिक ढंग से तर्क किया।’ इससे पुस्तक का तर्कपूर्ण, दार्शनिक प्रतिरोध पर बल बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγωγὰς
  choice: फुसलाने वाली बातें
  rationale: यह शब्द किसी को अपनी ओर मोड़ने या मना लेने के प्रयासों को दर्शाता है। सुनने की क्रिया के साथ यह हिंदी में स्वाभाविक है और प्रलोभन तथा मनुहार—दोनों की गुंजाइश बनाए रखता है।
- source_word: δεινά
  choice: भयानक यातनाएँ
  rationale: शब्द का मूल अर्थ व्यापक रूप से ‘भयानक बातें/दृश्य’ है, पर शहीदी और अत्याचार के निकट संदर्भ में यातनाएँ अभिप्रेत हैं। ‘भयानक’ मूल शब्द की तीव्रता को भी बनाए रखता है।
- source_word: οὐ μόνον οὐκ ἐφοβήθησαν
  choice: न केवल भय नहीं माना
  rationale: यह यूनानी की बलाघाती ‘न केवल...नहीं’ संरचना को सुरक्षित रखते हुए स्वाभाविक और गरिमापूर्ण हिंदी देता है।
- source_word: ἀντεφιλοσόφησαν
  choice: दार्शनिक तर्कों से ... प्रतिवाद किया
  rationale: दुर्लभ संयुक्त क्रिया में प्रत्युत्तर या विरोध और दर्शन—दोनों भाव हैं। यह अनुवाद पुस्तक में तर्कपूर्ण दार्शनिक प्रतिरोध के विशेष विषय को स्पष्ट रखता है।
- source_word: τῷ τυράννῳ
  choice: उस अत्याचारी
  rationale: ‘अत्याचारी’ यूनानी में निहित शासक के नैतिक मूल्यांकन को ‘राजा’ की अपेक्षा अधिक ठीक रूप में व्यक्त करता है।
theological_decisions:
- issue: 4 मक्काबियों में φιλοσοφ- शब्दावली का अनुवाद
  choice: मुख्य पाठ में ‘दार्शनिक तर्कों’ को स्पष्ट रखा गया
  alternative: केवल ‘उस अत्याचारी का विरोध किया’ या ‘उससे तर्क किया’
  rationale: लेखक यहूदी शहीदों के धैर्य और प्रतिरोध को तर्क तथा दर्शन की भाषा में प्रस्तुत करता है; सामान्य ‘तर्क किया’ इस महत्वपूर्ण वैचारिक परत को दबा देता।
- issue: ἀντεφιλοσόφησαν में विरोध और संवाद का संबंध
  choice: ‘उस अत्याचारी का प्रतिवाद किया’
  alternative: ‘उस अत्याचारी से दार्शनिक ढंग से तर्क किया’
  rationale: संयुक्त क्रिया का ἀντι- अंश प्रतिरोध या प्रत्युत्तर का भाव रखता है। ‘प्रतिवाद’ उस विरोध को सुरक्षित रखता है, जबकि पादटिप्पणी शाब्दिक बनावट स्पष्ट करती है।
