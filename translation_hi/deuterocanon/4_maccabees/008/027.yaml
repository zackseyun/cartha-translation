lexical_decisions:
- source_word: ἀλλὰ
  choice: लेकिन
  rationale: यह पिछले प्रसंग से प्रबल विरोध दिखाता है; आधुनिक हिन्दी में ‘लेकिन’ स्वाभाविक और स्पष्ट है।
- source_word: τούτων οὐδὲν
  choice: इनमें से कोई बात
  rationale: यह पहले कही गई संभावित बातों या विचारों की ओर संकेत करने वाली अंशवाचक अभिव्यक्ति है।
- source_word: οἱ νεανίαι
  choice: जवानों
  rationale: यह उन युवा पुरुषों के लिए है; ‘जवान’ साधारण आधुनिक हिन्दी में स्वाभाविक है और उनकी युवावस्था स्पष्ट करता है।
- source_word: βασανίζεσθαι μέλλοντες
  choice: जिन्हें यातना दी जाने वाली थी
  rationale: μέλλω के साथ कृदन्त निकट भविष्य की क्रिया बताता है, और शहादत के इस प्रसंग में βασανίζω शारीरिक यातना का बोध कराता है।
- source_word: εἶπον
  choice: कही
  rationale: सरल भूतकालीन कथन है; हिन्दी में ‘बात न कही’ सहज रूप है।
- source_word: οὐδὲ ἐνεθυμήθησαν
  choice: और न अपने मन में ऐसा कुछ सोचा
  rationale: ἐνθυμέομαι का अर्थ भीतर विचार करना या मन में किसी विचार को स्थान देना हो सकता है; यह अनुवाद निहित कर्म को स्पष्ट करते हुए अर्थ की व्यापकता बनाए रखता है।
theological_decisions:
- issue: शहादत के प्रसंग में βασανίζεσθαι की तीव्रता
  choice: यातना दी जाने वाली थी
  alternative: सताया जाने वाला था / परखा जाने वाला था
  rationale: प्रसंग न्यायिक शारीरिक दुर्व्यवहार का है; ‘यातना’ उसकी गंभीरता को ठीक रूप में व्यक्त करता है और कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्य की दो समानांतर नकारात्मक क्रियाओं—न कहना और मन में न सोचना—को सुरक्षित रखा गया है।
