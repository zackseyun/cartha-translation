  text: So comply, and you will receive ruling offices over my affairs, if you renounce the ancestral ordinance of your way of life.
translation:
  language: hi
  text: इसलिए मेरी बात मानो और अपने पूर्वजों से मिली जीवन-पद्धति का विधान त्याग दो; तब तुम्हें मेरे प्रशासन में शासन के पद मिलेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστεύσατε
  choice: मेरी बात मान लो
  rationale: यहाँ राजा युवकों से अपने प्रस्ताव को स्वीकार कर उसके अनुसार चलने को कह रहा है; प्रसंग में इसका अर्थ केवल बौद्धिक ‘विश्वास करना’ नहीं, बल्कि उसकी बात मानना है।
- source_word: ἀρχὰς ... ἡγεμονικὰς
  choice: अधिकार के पद
  rationale: यह पदसमूह शासन अथवा नेतृत्व का अधिकार देने वाले उच्च पदों को सूचित करता है।
- source_word: ἐπὶ τῶν ἐμῶν πραγμάτων
  choice: मेरे राज-काज में
  rationale: राजा के मुख से τὰ ἐμὰ πράγματα उसके मामलों, प्रशासन या राजकीय कार्यों को दर्शाता है; ‘राज-काज’ आधुनिक हिन्दी में इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν πάτριον ὑμῶν τῆς πολιτείας θεσμόν
  choice: अपने पुरखों की जीवन-व्यवस्था के विधान
  rationale: πάτριον पैतृक/पुरखों से मिला हुआ, πολιτεία सामुदायिक जीवन-पद्धति या जीवन-व्यवस्था, और θεσμός स्थापित विधान को सूचित करता है।
theological_decisions:
- issue: πιστεύσατε को धार्मिक ‘विश्वास’ के रूप में समझना
  choice: मेरी बात मान लो
  alternative: विश्वास करो
  rationale: वक्ता अत्याचारी राजा है और वाक्य पद व लाभ के बदले पैतृक विधान त्यागने का प्रस्ताव देता है; इसलिए आज्ञापालन/सहमति का अर्थ प्रसंगानुकूल है और धार्मिक विश्वास का अनावश्यक संकेत नहीं देता।
- issue: पैतृक विधान की पहचान
  choice: जीवन-व्यवस्था के विधान
  alternative: धर्म-विधान
  rationale: यूनानी पाठ व्यापक πολιτεία का उल्लेख करता है। ‘धर्म-विधान’ अर्थ को केवल धार्मिक क्षेत्र तक सीमित कर सकता है, जबकि पाठ सामुदायिक और नैतिक जीवन-पद्धति का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। संबोधन बहुवचन अनौपचारिक ‘लो/दो’ में है, जो राजा के अधिकारपूर्ण स्वर और युवकों से सीधे संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। अर्धविराम शर्त और प्रतिफल का संबंध स्पष्ट करता है।
