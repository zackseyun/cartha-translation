  text: When the tyrant had given these orders[a], seven brothers were brought in with their aged mother[b], handsome and modest and noble and gracious in every way.
translation:
  language: hi
  text: जब अत्याचारी ने ये आदेश दे दिए, तब सात भाई अपनी वृद्ध माता के साथ लाए गए[a]। वे रूपवान, मर्यादाशील, उदात्त और हर तरह से मनोहर थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लाए जाते हुए उपस्थित हुए”; यूनानी में उनके पहुँचने और बाध्य होकर ले जाए जाने के भाव साथ जुड़े हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “हर बात में मनभावने थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα διαταξαμένου
  choice: जब ... ने ये आदेश दे दिए
  rationale: संबंधकारक निरपेक्ष रचना अत्याचारी की पहले पूरी हो चुकी कार्रवाई दिखाती है। यह चयन διατάσσω के अधिकारपूर्ण आदेश देने के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: τοῦ τυράννου
  choice: अत्याचारी
  rationale: τύραννος यहाँ तटस्थ शासकीय उपाधि नहीं, बल्कि लेखक का नकारात्मक नैतिक मूल्यांकन है; ‘अत्याचारी’ उस भाव को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: παρῆσαν ἀγόμενοι
  choice: पकड़कर लाए गए
  rationale: यूनानी पदबंध उनके पहुँचने और दूसरों द्वारा ले जाए जाने—दोनों को जोड़ता है। ‘पकड़कर लाए गए’ प्रसंग में निहित बाध्यता को सहज हिन्दी में व्यक्त करता है।
- source_word: μετὰ γεραιᾶς μητρός
  choice: अपनी वृद्ध माता के साथ
  rationale: γεραιός अधिक आयु को दर्शाता है। ‘वृद्ध माता’ गरिमापूर्ण है; सम्बन्धसूचक ‘अपनी’ हिन्दी में स्पष्ट करता है कि वह सातों भाइयों की माता थीं।
- source_word: ἑπτὰ ἀδελφοί
  choice: सात भाई
  rationale: पुल्लिंग बहुवचन ἀδελφοί यहाँ पुरुष सहोदरों को निर्दिष्ट करता है।
- source_word: καλοί
  choice: रूपवान
  rationale: व्यक्तिगत गुणों की इस सूची में καλός उनके सुंदर रूप को सूचित करता है; ‘रूपवान’ पुरुष बहुवचन के अनुकूल और गरिमापूर्ण है।
- source_word: αἰδήμονες
  choice: मर्यादाशील
  rationale: शब्द लज्जा-बोध, संकोच और सामाजिक शालीनता का गुण व्यक्त करता है। ‘मर्यादाशील’ आधुनिक हिन्दी में इस नैतिक-सामाजिक भाव को संतुलित रूप से रखता है।
- source_word: γενναῖοι
  choice: उदात्त
  rationale: γενναῖος कुलीनता, श्रेष्ठ चरित्र और साहस तक फैला अर्थ रख सकता है। ‘उदात्त’ यहाँ गुण-सूची के व्यापक नैतिक भाव को रखता है और केवल वंश या वीरता तक अर्थ को सीमित नहीं करता।
- source_word: ἐν παντὶ χαρίεντες
  choice: हर तरह से मनोहर
  rationale: χαρίεις आकर्षक व्यवहार, सौम्यता और मनोहरता व्यक्त करता है; ἐν παντί उसके सर्वांगीण होने पर बल देता है।
theological_decisions:
- issue: अन्तियोकस के लिए τύραννος का मूल्यांकनात्मक प्रयोग
  choice: अत्याचारी
  alternative: राजा / शासक
  rationale: मूल पाठ जानबूझकर नैतिक रूप से नकारात्मक पद इस्तेमाल करता है। तटस्थ पद चुनना लेखक की अलंकारिक और नैतिक दृष्टि को दबा देता।
