  text: Why do we delight ourselves in empty schemes and dare a death-bringing disobedience?[a][b]
translation:
  language: hi
  text: हम व्यर्थ योजनाओं से स्वयं को क्यों प्रसन्न करें और मृत्यु लाने वाली अवज्ञा करने का दुस्साहस क्यों करें?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खोखली योजनाओं से” अथवा “निष्फल संकल्पों से।”
