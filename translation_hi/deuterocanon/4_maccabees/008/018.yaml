  - marker: b
    text: शाब्दिक अर्थ, “मृत्यु लाने वाली अवज्ञा”; या, “घातक अवज्ञा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: क्यों
  rationale: यहाँ τί एक भर्त्सनापूर्ण आलंकारिक प्रश्न आरम्भ करता है; आधुनिक हिन्दी में ‘क्यों’ उसका स्वाभाविक रूप है।
- source_word: βουλήμασιν κενοῖς
  choice: व्यर्थ योजनाओं से
  rationale: βουλήμασιν योजनाओं या संकल्पों को और κενοῖς उनके खोखले अथवा निष्फल होने को व्यक्त करता है। ‘व्यर्थ योजनाएँ’ दोनों भावों को सहज हिन्दी में रखता है।
- source_word: ἑαυτοὺς εὐφραινόμεν
  choice: अपने मन को बहलाएँ
  rationale: यूनानी पदबंध का शाब्दिक भाव स्वयं को प्रसन्न करना है। सन्दर्भ में ‘अपने मन को बहलाएँ’ निरर्थक योजनाओं में झूठा संतोष पाने की नैतिक विडंबना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θανατηφόρον
  choice: मृत्यु लाने वाली
  rationale: यह यौगिक विशेषण शाब्दिक रूप से ‘मृत्यु लाने वाला’ है; यह अनुवाद उसके कारणात्मक चित्र को ‘घातक’ जैसे संक्षिप्त विकल्प की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: ἀπειθίαν
  choice: अवज्ञा
  rationale: ἀπειθία आज्ञा न मानने या मानने से इनकार करने को दर्शाता है। ‘अवज्ञा’ सटीक और गरिमापूर्ण है तथा ‘विद्रोह’ जैसा अतिरिक्त तीखापन नहीं जोड़ता।
- source_word: τολμῶμεν
  choice: दुस्साहस करें
  rationale: τολμῶμεν यहाँ अनुचित और जोखिमपूर्ण साहस को व्यक्त करता है। ‘दुस्साहस करें’ आलंकारिक आत्म-भर्त्सना को स्पष्ट रखता है।
theological_decisions:
- issue: ἀπειθία का नैतिक स्वरूप
  choice: अवज्ञा
  alternative: विद्रोह; उद्दंडता; अविश्वास
  rationale: पद मृत्यु की ओर ले जाने वाली आज्ञा-अस्वीकृति की निन्दा करता है, पर यूनानी शब्द अपने आप में अधिक सिद्धान्तगत ‘अविश्वास’ या अधिक प्रबल ‘विद्रोह’ की माँग नहीं करता।
- issue: θανατηφόρον का संबंध
  choice: अवज्ञा को ‘मृत्यु लाने वाली’ कहना
  alternative: ‘घातक अवज्ञा’
  rationale: यूनानी विशेषण सीधे ἀπειθίαν को विशेषित करता है। कारणात्मक अर्थ को खुला रखते हुए यह नहीं बताया गया कि मृत्यु किस विशिष्ट रीति से आती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सहज प्रश्नात्मक वाक्य। दोहराया गया ‘क्यों’ हिन्दी में समानांतर क्रियाओं को स्पष्ट करता है। ‘अपने मन को बहलाएँ’ εὐφραινόμεν के प्रसन्न होने के भाव को सन्दर्भगत आत्म-प्रवंचना के साथ व्यक्त करता है; पादटिप्पणियाँ वास्तविक शब्दार्थ-विकल्प सुरक्षित रखती हैं।
