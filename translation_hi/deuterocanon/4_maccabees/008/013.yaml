base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/013.yaml
  text: Then[a], when the bodyguards set out wheels, joint-rackers, stretching-machines, clawing hooks, catapults, cauldrons[b], frying pans, thumbscrews, iron hands, wedges, and the live coals of the fire, the tyrant took up the matter and said,
translation:
  language: hi
  text: तब, जब अंगरक्षकों ने पहिए, जोड़ तोड़ने के यंत्र, शरीर मरोड़ने के यंत्र, नुकीले हुक, कटापल्ट,[a] कड़ाहे, तवे, उँगलियाँ दबाने के यंत्र,[b] लोहे के हाथ, पच्चर और आग के धधकते अंगारे सामने रखे, तो अत्याचारी ने उत्तर में कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ सामान्यतः युद्ध में प्रयुक्त ‘कटापल्ट’ लिखा है। यातना-साधनों की इस सूची में यह असामान्य है, फिर भी अनुवाद ने मूल पाठ को किसी अनुमानित यातना-उपकरण से नहीं बदला है।
    reason: textual_or_lexical_difficulty
  - marker: b
    text: इस पद के कई उपकरणों के यूनानी नाम दुर्लभ या तकनीकी हैं, इसलिए कुछ अनुवाद अनुमानित हैं। ‘जोड़ तोड़ने के यंत्र’ का अर्थ ‘अंग तोड़ने के यंत्र,’ ‘शरीर मरोड़ने के यंत्र’ का अर्थ ‘यातना की टिकठियाँ,’ और ‘उँगलियाँ दबाने के यंत्र’ का अर्थ ‘उँगलियाँ कसने के यंत्र’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχούς
  choice: यातना के पहिए
  rationale: मूल अर्थ ‘पहिए’ है; यातना-साधनों की सूची में कार्य स्पष्ट करने के लिए ‘यातना के’ जोड़ा गया है, बिना किसी अधिक विशिष्ट यांत्रिक पहचान का दावा किए।
- source_word: ἀρθρενβόλους
  choice: जोड़ उखाड़ने के यंत्र
  rationale: यह दुर्लभ संयुक्त शब्द जोड़ों या अंगों पर प्रहार करने वाले उपकरण को सूचित करता है; हिन्दी में संभावित कार्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: στρεβλωτήριά
  choice: शरीर मरोड़ने के यंत्र
  rationale: शब्द मरोड़ने और यातना देने से संबंधित है; यह अनिश्चित तकनीकी नाम के बजाय यंत्र के संभावित कार्य को व्यक्त करता है।
- source_word: τροχαντῆρας
  choice: नुकीले काँटे
  rationale: दुर्लभ तकनीकी शब्द संभवतः खींचने या नोचने वाले हुकनुमा साधनों को दर्शाता है; ‘नुकीले काँटे’ साधन का रूप बताता है, पर अत्यधिक निश्चितता से बचता है।
- source_word: καταπέλτας
  choice: गुलेलें
  rationale: यूनानी का सामान्य अर्थ युद्ध में प्रयुक्त प्रक्षेपास्त्र-यंत्र है। सूची में असामान्य होने पर भी पाठ को अनुमान से बदलने के बजाय यही अर्थ रखा गया है।
- source_word: λέβητας
  choice: कड़ाहे
  rationale: यह उबालने या गरम करने का बड़ा धातु-पात्र है; ‘कड़ाहे’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: τήγανά
  choice: तवे
  rationale: गरम करने या पकाने के उथले पात्र का सीधा और सामान्य हिन्दी पर्याय।
- source_word: δακτυλήθρας
  choice: उँगलियाँ कसने के यंत्र
  rationale: शब्द उँगलियों से संबंधित किसी दबाने या जकड़ने वाले उपकरण को दर्शाता है; ‘अँगूठा-पेंच’ से अधिक व्यापक यह अनुवाद मूल की अनिश्चितता बचाता है।
- source_word: χεῖρας σιδηρᾶς
  choice: लोहे के हाथ
  rationale: मूल का शाब्दिक और सजीव रूप सुरक्षित रखा गया है; संभव है कि इससे लोहे के पंजेनुमा पकड़ने वाले उपकरण अभिप्रेत हों।
- source_word: σφῆνας
  choice: पच्चर
  rationale: यह सामान्य शाब्दिक अर्थ है; यातना में इनके ठीक उपयोग के विषय में पाठ अधिक नहीं बताता।
- source_word: τὰ ζώπυρα τοῦ πυρός
  choice: आग के धधकते अंगारे
  rationale: वाक्यांश जलते या सुलगते अंगारों को दर्शाता है; हिन्दी रूप मूल की तीव्र दृश्यात्मकता रखता है।
- source_word: οἱ δορυφόροι
  choice: अंगरक्षक
  rationale: शाब्दिक अर्थ ‘भाला ढोने वाले’ है, पर राजकीय प्रसंग में पदगत अर्थ अंगरक्षक है।
- source_word: ὑπολαβὼν
  choice: बात अपने हाथ में लेकर
  rationale: यहाँ कृदंत का अर्थ बोलने की बारी लेना या बात संभालना है; हिन्दी मुहावरा कथन के आरंभ की भूमिका व्यक्त करता है।
theological_decisions:
- issue: शासक के लिए मूल्यांकनात्मक पद τύραννος
  choice: अत्याचारी
  alternative: राजा / शासक
  rationale: मूल शब्द लेखक का नकारात्मक नैतिक मूल्यांकन व्यक्त करता है। ‘अत्याचारी’ इसे सुरक्षित रखता है और पद को तटस्थ नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। तकनीकी यातना-उपकरणों के दुर्लभ नामों में जहाँ पहचान अनिश्चित है वहाँ कार्यपरक हिन्दी चुनी गई और पादटिप्पणी में अनिश्चितता स्पष्ट की गई। सूची की कठोर लय और अंत का अपूर्ण कथन अगले पद की ओर प्रवाह बनाए रखते हैं।
