base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/005.yaml
  text: Young men[a], I warmly admire the beauty of each one of you, and, valuing so highly the number of so many brothers, I not only urge you not to go mad with the same madness as the old man who has already been tortured, but also—
translation:
  language: hi
  text: “हे युवको, मैं तुममें से हर एक के सौंदर्य की हार्दिक सराहना करता हूँ और इतने सारे भाइयों की बड़ी संख्या को अत्यंत मूल्यवान समझते हुए, मैं तुम्हें न केवल यह सलाह देता हूँ कि उस वृद्ध को जिस पागलपन ने घेरा था, उसी पागलपन में पागल न बनो—जिसे पहले ही यातना दी जा चुकी है—बल्कि यह भी—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ यहाँ “बल्कि यह भी” पर रुकता है; वाक्य अगले पद में आगे जारी रहता है।
    reason: textual_variant
lexical_decisions:
- source_word: Ὦ νεανίαι
  choice: हे जवानो
  rationale: यह पुरुष युवकों को किया गया सीधा संबोधन है; ‘हे जवानो’ आधुनिक, स्वाभाविक और लिंग-सटीक है।
- source_word: φιλοφρόνως
  choice: हार्दिक
  rationale: यह क्रियाविशेषण सद्भावपूर्ण, आत्मीय भाव व्यक्त करता है; ‘हार्दिक’ वक्ता की प्रशंसात्मक गर्मजोशी रखता है।
- source_word: καθʼ ἑνὸς ἑκάστου ὑμῶν
  choice: तुममें से हर एक
  rationale: यह यूनानी पदबंध प्रत्येक व्यक्ति पर अलग-अलग बल देता है।
- source_word: θαυμάζω τὸ κάλλος
  choice: सुंदरता की ... सराहना करता हूँ
  rationale: θαυμάζω यहाँ प्रशंसा या विस्मय व्यक्त कर सकता है; संदर्भ में ‘सराहना’ प्रशंसात्मक कथन के लिए स्वाभाविक है, जबकि κάλλος की ‘सुंदरता’ बनी रहती है।
- source_word: τὸ πλῆθος τοσούτων ἀδελφῶν
  choice: इतने सारे भाइयों की संख्या
  rationale: यह अनुवाद πλῆθος और τοσούτων दोनों को व्यक्त करता है और ἀδελφῶν को वास्तविक पुरुष भाई-समूह के रूप में रखता है।
- source_word: ὑπερτιμῶν
  choice: बहुत महत्त्व देता हूँ
  rationale: कृदंत अत्यधिक मूल्य या आदर देने का भाव रखता है; हिन्दी में यह वाक्य-विन्यास स्वाभाविक है।
- source_word: οὐ μόνον συμβουλεύω
  choice: न केवल यह सलाह देता हूँ
  rationale: συμβουλεύω का मूल भाव सलाह देना या आग्रह करना है; राजा की वक्तृता में ‘सलाह देता हूँ’ उसका ऊपर से सद्भावपूर्ण दिखने वाला स्वर बनाए रखता है।
- source_word: μὴ μανῆναι ... μανίαν
  choice: उसी पागलपन में न पड़ो
  rationale: ‘पागलपन’ μανίαν को स्पष्ट रखता है; हिन्दी में ‘पागल हो जाने के उसी पागलपन’ जैसा सजातीय दोहराव अस्वाभाविक होता, इसलिए अर्थ और ताने का स्वर स्वाभाविक रूप में रखा गया है।
- source_word: τῷ προβασανισθέντι γέροντι
  choice: उस वृद्ध की तरह ... जिसे पहले ही यातना दी जा चुकी है
  rationale: अओरिस्ट कर्मवाच्य कृदंत भाषण से पहले दी गई यातना को दर्शाता है; ‘वृद्ध’ γέρων का गरिमापूर्ण सामान्य हिन्दी रूप है।
- source_word: ἀλλὰ καὶ
  choice: बल्कि यह भी—
  rationale: स्रोत पद मध्य-वाक्य में समाप्त होता है; दीर्घ विराम-चिह्न अगले पद में जारी विचार को बिना पूरा किए दर्शाता है।
theological_decisions:
- issue: ἀδελφῶν का पुरुष सहोदर-संदर्भ
  choice: भाइयों
  alternative: भाई-बहनों
  rationale: संदर्भ सात पुत्रों/भाइयों का है; यहाँ पुल्लिंग बहुवचन समावेशी या सामान्य नहीं है।
- issue: पद के अंत में अधूरा उपवाक्य
  choice: ‘बल्कि यह भी—’ कहकर अधूरापन बनाए रखना
  alternative: अगले पद की सामग्री जोड़कर वाक्य पूरा करना
  rationale: प्रदत्त यूनानी पाठ ἀλλὰ καὶ पर रुकता है; अनकही सामग्री जोड़ना स्रोत से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन और राजा की ऊपर से प्रशंसात्मक, भीतर से दबावपूर्ण वक्तृता सुरक्षित रखी गई है। मुख्य पाठ में [a] चिह्न अधूरे वाक्य के ठीक बाद रखा गया है।
