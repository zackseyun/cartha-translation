  yaml_path: translation/deuterocanon/4_maccabees/008/017.yaml
  text: Alas for us! How miserable and utterly foolish we are! When the king urges us and calls us to receive a benefit[a], should we not be persuaded by him?
translation:
  language: hi
  text: हाय, हम कितने दयनीय और नितांत मूर्ख हैं! जब राजा हमें मना रहा है और उपकार का प्रस्ताव देकर हमें बुला रहा है, तो क्या हम उसकी बात न मानें?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो क्या हम उसकी बात मानने के लिए राज़ी न हों?” यूनानी πεισθείημεν का अर्थ किसी के द्वारा राज़ी किया जाना है और, प्रसंगानुसार, उसकी बात मानना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ τάλανες ἡμεῖς
  choice: हाय हम पर! हम कितने दयनीय हैं
  rationale: यह पदबंध दुःख और दयनीयता की तीव्र विस्मयात्मक अभिव्यक्ति है। यह हिन्दी रूप उसके भावात्मक बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: λίαν ἀνόητοι
  choice: नितांत मूर्ख
  rationale: λίαν की तीव्रता को ‘नितांत’ और ἀνόητοι को सामान्य, स्पष्ट हिन्दी ‘मूर्ख’ से व्यक्त किया गया है।
- source_word: βασιλέως
  choice: राजा
  rationale: संदर्भ में एक विशिष्ट राजा की बात है; हिन्दी में ‘राजा’ स्वाभाविक रूप से उसी पहचाने हुए व्यक्ति को सूचित करता है।
- source_word: παρακαλοῦντος
  choice: समझा रहा है
  rationale: यहाँ παρακαλέω का अर्थ आग्रहपूर्वक मनाना या प्रेरित करना है। ‘समझा रहा है’ आगे आने वाले πεισθείημεν के साथ स्वाभाविक हिन्दी संबंध बनाता है।
- source_word: ἐπὶ εὐεργεσίᾳ φωνοῦντος
  choice: हमारा भला करने के लिए बुला रहा है
  rationale: εὐεργεσία उपकार या लाभ को दर्शाता है। यह अनुवाद राजा द्वारा लाभ देने के प्रस्ताव को स्पष्ट और सहज हिन्दी में व्यक्त करता है, बिना यह तय किए कि उसका प्रस्ताव वास्तव में हितकारी था।
- source_word: μὴ πεισθείημεν αὐτῷ;
  choice: तो क्या हम उसकी बात न मानें?
  rationale: πεισθείημεν में राजी होने, झुकने और बात मानने की अर्थ-छायाएँ हैं। ‘उसकी बात मानें’ हिन्दी में इस प्रसंग की प्रेरणा और अपेक्षित अनुपालन दोनों को स्वाभाविक रूप से समेटता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
