  text: But the tyrant interrupted and said[a], “Young men, be afraid, and the justice you revere will be merciful to you if, under compulsion, you break the law.”
translation:
  language: hi
  text: उन्होंने अपनी बात रखी। पर तानाशाह ने बात काटकर कहा, “नौजवानो, डरो! जिस न्याय[a] का तुम आदर करते हो, वह विवश होकर व्यवस्था का उल्लंघन करने पर तुम पर दयालु होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस न्यायनिर्णय अथवा दंड का तुम आदर करते हो।” यूनानी शब्द δίκη का अर्थ न्याय, न्यायनिर्णय या दंड हो सकता है।
    reason: δίκη के शब्दार्थगत विकल्पों को सुरक्षित रखता है; इस संदर्भ में मुख्य पाठ का “न्याय” σέβεσθε के साथ सबसे स्वाभाविक है।
lexical_decisions:
- source_word: προέθεσαν
  choice: उन्होंने ये सब उनके सामने रख दिया
  rationale: क्रिया बहुवचन कर्तृवाच्य है और उसका कर्म पिछले प्रसंग से समझा जाता है। हिन्दी में ‘ये सब’ उस पूर्वगामी सामग्री की ओर संकेत करता है, बिना यहाँ कोई नया कर्म जोड़कर अर्थ को सीमित किए।
- source_word: ὑπολαβών
  choice: बात काटकर
  rationale: संवाद के इस प्रसंग में क्रिया किसी की बात के बीच में बोल उठने या बात अपने हाथ में लेने का भाव देती है; ‘बात काटकर’ विरोधात्मक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τύραννος
  choice: तानाशाह
  rationale: यह शब्द तटस्थ ‘शासक’ नहीं, बल्कि नकारात्मक नैतिक मूल्यांकन रखता है; ‘तानाशाह’ उस भाव को बनाए रखता है।
- source_word: Μειράκια
  choice: नौजवानो
  rationale: सम्बोधन युवकों के लिए है। ‘नौजवानो’ आधुनिक और सहज है तथा ‘लड़को’ की अपेक्षा कम बालसुलभ है।
- source_word: φοβήθητε
  choice: डरो
  rationale: आज्ञार्थक रूप की सीधी और जोरदार अभिव्यक्ति।
- source_word: δίκην
  choice: न्याय
  rationale: σέβεσθε के साथ यह उस न्याय को सूचित कर सकता है जिसका वे श्रद्धापूर्वक आदर करते हैं। फिर भी यूनानी शब्द में न्यायनिर्णय या दंड का अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: σέβεσθε
  choice: आदर करते हो
  rationale: यह श्रद्धापूर्ण सम्मान का भाव देता है; ‘पूजा करते हो’ कहना अनावश्यक रूप से अधिक विशिष्ट होता।
- source_word: ἵλεως
  choice: दयालु
  rationale: शब्द अनुकूल या कृपापूर्वक व्यवहार करने का भाव रखता है। यहाँ तानाशाह का दावा है कि विवशता में किए गए उल्लंघन पर न्याय नरमी दिखाएगा।
- source_word: διʼ ἀνάγκην
  choice: विवश होकर
  rationale: बाहरी दबाव या बाध्यता के कारण किए गए कार्य को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρανομήσασιν
  choice: व्यवस्था का उल्लंघन करोगे
  rationale: क्रिया का अर्थ विधि के विरुद्ध काम करना है। यह रूप कानूनी-नैतिक अर्थ को बनाए रखता है और प्रसंग में मानी गई धार्मिक व्यवस्था की ओर भी स्वाभाविक संकेत करता है।
theological_decisions:
- issue: नैतिक अपील में δίκη का अर्थ
  choice: न्याय
  alternative: न्यायनिर्णय या दंड
  rationale: तानाशाह का तर्क यह है कि युवकों द्वारा आदर किया जाने वाला न्याय विवशता में हुए उल्लंघन पर दया करेगा। σέβεσθε के कारण ‘न्याय’ मुख्य पाठ में अधिक उपयुक्त है, पर शब्द की दंडात्मक अथवा न्यायनिर्णय-संबंधी संभावना पादटिप्पणी में रखी गई है।
- issue: विवशता और व्यवस्था-उल्लंघन का नैतिक संबंध
  choice: तानाशाह के दावे को उसी के कथन के रूप में बिना समर्थन या खंडन के प्रस्तुत किया गया
  alternative: विवशता को स्वतः दोषमुक्त करने वाली व्याख्या जोड़ना
  rationale: मूल पाठ तानाशाह की नैतिक दलील प्रस्तुत करता है; अनुवाद को उसकी धार्मिक वैधता स्वयं तय नहीं करनी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘तानाशाह’, ‘नौजवानो’ और ‘विवश होकर’ सामान्य पाठक के लिए स्पष्ट हैं। आरम्भिक προέθεσαν को अंग्रेज़ी परामर्श-पाठ के विपरीत छोड़ा नहीं गया, क्योंकि वह उपलब्ध यूनानी पद का हिस्सा है; उसके अनुक्त कर्म को ‘ये सब’ के रूप में प्रसंग-सापेक्ष रखा गया है।
