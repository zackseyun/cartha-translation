  yaml_path: translation/deuterocanon/4_maccabees/008/019.yaml
  text: Shall we not fear the tortures[a], brothers, and reckon with the threats of the torments, and flee this empty glory and deadly arrogance?
translation:
  language: hi
  text: हे भाइयो, क्या हम यातनाओं से नहीं डरेंगे, यातना की धमकियों को ध्यान में नहीं रखेंगे, और इस व्यर्थ की शान और विनाशकारी दंभ[a] से दूर नहीं भागेंगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह खोखली महिमा और विनाश लाने वाला अहंकार।”
    reason: κενοδοξία के लिए ‘खोखली महिमा’ और ὀλεθροφόρον ἀλαζονία के लिए ‘विनाश लाने वाला अहंकार’ निकटवर्ती शाब्दिक विकल्प हैं; मुख्य पाठ अधिक स्वाभाविक आधुनिक हिन्दी प्रयोग करता है।
lexical_decisions:
- source_word: οὐ φοβησόμεθα
  choice: क्या हम ... नहीं डरेंगे
  rationale: भविष्यकालीन क्रिया यहाँ विचारोत्तेजक आलंकारिक प्रश्न का भाग है। यह रूप प्रश्न और आह्वान—दोनों का बल बनाए रखता है।
- source_word: ἄνδρες ἀδελφοί
  choice: हे भाइयो
  rationale: यह पुरुष भाइयों को किया गया गंभीर संबोधन है। ‘हे भाइयो’ आधुनिक हिन्दी में स्वाभाविक है और मूल का पुल्लिंग संदर्भ बनाए रखता है।
- source_word: τὰ βασανιστήρια
  choice: यातनाओं
  rationale: संदर्भ में इसका अर्थ यातना अथवा यातना-दंड है। ‘यातनाओं’ सीधा और सहज है; ‘यातना के उपकरणों’ से अर्थ अनावश्यक रूप से सीमित हो जाता।
- source_word: λογιούμεθα
  choice: गंभीरता से ... लेंगे
  rationale: क्रिया का भाव किसी बात का हिसाब रखना, उस पर विचार करना या उसे महत्त्व देना है। ‘गंभीरता से लेना’ साधारण आधुनिक हिन्दी में यही आशय स्पष्ट करता है।
- source_word: τὰς τῶν βασάνων ἀπειλάς
  choice: यातना देने की धमकियों
  rationale: सम्बन्धकारक पदबंध यातनाओं से जुड़ी धमकियों को दर्शाता है। हिन्दी में ‘यातना देने की धमकियाँ’ अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: φεύξομεν
  choice: दूर ... भागेंगे
  rationale: मूल क्रिया का सजीव अर्थ ‘भागना’ है। ‘दूर भागना’ नैतिक अस्वीकार की तीव्रता बनाए रखता है।
- source_word: τὴν κενοδοξίαν ταύτην
  choice: इस खोखली महिमा
  rationale: κενοδοξία व्यर्थ या खोखली महिमा और आत्म-महत्त्व का भाव व्यक्त करता है। ‘खोखली महिमा’ मूल बिंब को पारदर्शी ढंग से बनाए रखता है।
- source_word: ὀλεθροφόρον ἀλαζονίαν
  choice: विनाशकारी अहंकार
  rationale: ὀλεθροφόρος विनाश लाने वाला और ἀλαζονία घमंड, दंभ या डींग को सूचित करता है। ‘विनाशकारी अहंकार’ संक्षिप्त, स्वाभाविक और अर्थपूर्ण है।
theological_decisions:
- issue: तीन समन्वित क्रियाओं में फैला आलंकारिक प्रश्न
  choice: पूरे वाक्य को एक आलंकारिक प्रश्न के रूप में रखा गया और हिन्दी में प्रत्येक क्रिया के साथ ‘नहीं’ दोहराया गया।
  alternative: 'इसे कथनात्मक प्रतिज्ञा बनाना: ‘हम यातनाओं से नहीं डरेंगे ... बल्कि ... से भागेंगे।’'
  rationale: यूनानी वाक्य-विन्यास और प्रश्नचिह्न आलंकारिक प्रश्न का समर्थन करते हैं। हिन्दी में ‘नहीं’ की पुनरावृत्ति आरंभिक οὐ के व्यापक प्रभाव को स्पष्ट करती है, बिना प्रश्न को साधारण कथन में बदले।
- issue: लिंग-विशिष्ट संबोधन ἄνδρες ἀδελφοί
  choice: ‘हे भाइयो’
  alternative: ‘हे भाई-बहनो’ या ‘हे लोगो’
  rationale: कथा-संदर्भ और यूनानी संबोधन स्पष्ट रूप से पुरुष भाइयों की ओर संकेत करते हैं। समावेशी विकल्प मूल के इस विशेष संदर्भ को मिटा देते।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। आलंकारिक प्रश्न की तीव्रता और भाइयों को सीधे संबोधन को सुरक्षित रखा गया है। ‘गंभीरता से लेना’ शाब्दिक ‘हिसाब लगाना’ की अपेक्षा वर्तमान हिन्दी में अधिक स्वाभाविक है।
