  rationale: τύραννος की दमनकारी नैतिक-राजनीतिक शक्ति बनाए रखी गई है; ‘वह’ पूर्वप्रसंग में ज्ञात व्यक्ति की ओर संकेत करता है।
- source_word: μὴ δυνηθεὶς
  choice: क्योंकि ... नहीं कर सका
  rationale: ग्रीक कृदंत अत्याचारी की हार का कारण बताता है। हिन्दी में कारणवाचक उपवाक्य अधिक स्वाभाविक है।
- source_word: ἀναγκάσαι
  choice: विवश ... कर सका
  rationale: यह दबाव डालकर किसी से कार्य कराने का प्रबल भाव सुरक्षित रखता है।
- source_word: γέροντα
  choice: उस वृद्ध को
  rationale: यद्यपि यूनानी संज्ञा अनिश्चित रूप में है, प्रसंग पहले से ज्ञात वृद्ध पुरुष की ओर संकेत करता है; ‘उस’ यह संदर्भ स्पष्ट करता है।
- source_word: μαιροφαγῆσαι
  choice: अशुद्ध करने वाला भोजन खाने
  rationale: दुर्लभ क्रिया ऐसा भोजन खाने का संकेत देती है जिसे यहूदी व्यवस्था के अनुसार अशुद्धकारी माना जाता है। यह रूप केवल ‘मांस’ या केवल ‘निषिद्ध’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
