- source_word: ἐνικήθη
  choice: हार गया
  rationale: νικάω के कर्मवाच्य का सरल और स्वाभाविक हिन्दी रूप, जो अत्याचारी की विफलता स्पष्ट करता है।
- source_word: περιφανὴς
  choice: कुख्यात
  rationale: शब्द मूलतः विख्यात या सबकी दृष्टि में प्रमुख होने का भाव रखता है; अत्याचारी के संदर्भ में ‘कुख्यात’ उसकी सार्वजनिक बदनामी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ τύραννος
