translation:
  language: hi
  text: तो कोई कह सकता है, “यदि विवेक मनोवेगों को वश में रखता है, तो वह विस्मृति और अज्ञान को वश में क्यों नहीं रखता?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  choice: तो ... क्यों
  rationale: यह पद तर्क के बीच उठाई गई आपत्ति को प्रस्तुत करता है। हिंदी में ‘तो ... क्यों’ प्रश्न की स्वाभाविकता और निष्कर्षसूचक बल बनाए रखता है।
- source_word: εἴποι τις ἄν
  choice: कोई कह सकता है
  rationale: ἄν के साथ संभावनार्थक optative एक काल्पनिक वक्ता की आपत्ति सूचित करता है; ‘कोई कह सकता है’ इसका स्वाभाविक हिंदी रूप है।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: यहाँ πάθη उन भावनात्मक इच्छाओं और आवेगों को दर्शाता है जिन पर λογισμός के नियंत्रण की चर्चा है। ‘मनोवेग’ इस दार्शनिक-नैतिक अर्थ को केवल सामान्य ‘भावनाओं’ की अपेक्षा अधिक ठीक से व्यक्त करता है।
- source_word: ὁ λογισμὸς
  choice: विवेक
  rationale: यह शब्द तर्कपूर्ण निर्णय करने वाली मानवीय क्षमता को सूचित करता है। आधुनिक हिंदी में ‘विवेक’ संक्षिप्त, स्वाभाविक और इस प्रसंग के दार्शनिक अर्थ के अनुकूल है।
- source_word: κρατεῖ
  choice: नियंत्रण रखता है
  rationale: κρατέω यहाँ किसी पर अधिकार अथवा वश रखने के अर्थ में है। दोनों बार एक ही वाक्यांश रखने से यूनानी की पुनरावृत्ति और तर्कगत विरोध सुरक्षित रहते हैं।
- source_word: λήθης
  choice: भूलने
  rationale: λήθη स्मृति से चूकने या भूल जाने की अवस्था है। ‘भूलने’ सामान्य आधुनिक हिंदी में स्पष्ट है और ἀγνοία से इसका भेद बनाए रखता है।
- source_word: ἀγνοίας
  choice: अज्ञान
  rationale: ἀγνοία का सीधा अर्थ ज्ञान का अभाव है; ‘अज्ञान’ इसके अमूर्त और दार्शनिक स्वर को बनाए रखता है।
theological_decisions:
- issue: πάθη और λογισμός का मानव-स्वभाव संबंधी दार्शनिक अर्थ
  choice: πάθη के लिए ‘मनोवेग’ और λογισμός के लिए ‘विवेक’
  alternative: ‘भावनाएँ’ और ‘तर्क-बुद्धि’
  rationale: यह चयन ग्रंथ के उस मूल तनाव को बनाए रखता है जिसमें विवेक मनुष्य के आवेगों पर नियंत्रण रखता है, जबकि यह दावा नहीं किया जाता कि वह हर मानसिक सीमा को मिटा देता है। ‘मनोवेग’ सामान्य भावनाओं को अपने आप नैतिक रूप से दोषपूर्ण ठहराने से बचाता है, और ‘विवेक’ तर्कपूर्ण निर्णय-क्षमता को सहज हिंदी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; तर्कपूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। काल्पनिक आपत्तिकर्ता के कथन को उद्धरण-चिह्नों में रखा गया है। यूनानी में κρατεῖ की पुनरावृत्ति को दोनों खंडों में ‘नियंत्रण रखता है’ द्वारा सुरक्षित रखा गया है।
