base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/009.yaml
  text: 'And even if someone is stingy[a], he is restrained by the law through reason, neither gleaning the unharvested crops nor going over the vineyards again. And in other matters as well it is possible to recognize this: that reason is the master over the passions.'
translation:
  language: hi
  text: 'यदि कोई कंजूस भी हो, तो व्यवस्था उसे विवेक के द्वारा वश में रखती है: वह न तो उस फसल को बटोरता है जो अभी काटी नहीं गई है, और न दाखबारियों को फिर से बीनता है।[a] दूसरी बातों में भी यह पहचाना जा सकता है कि विवेक आवेगों पर शासन करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शाब्दिक रूप में: “दाखबारियों को फिर से बीनता है”—अर्थात पहली बार दाख तोड़े जाने के बाद बची हुई दाख बटोरता है।'
    reason: दुर्लभ यूनानी क्रिया के शाब्दिक कृषि-संबंधी भाव और पुनरावृत्त कार्य को स्पष्ट करना।
lexical_decisions:
- source_word: φειδωλός
  choice: कंजूस
  rationale: यहाँ शब्द ऐसे व्यक्ति को दर्शाता है जिसकी प्रवृत्ति अपने लाभ के लिए अधिकाधिक बटोरने या रोक रखने की है। ‘मितव्ययी’ अनावश्यक रूप से सकारात्मक होता, जबकि ‘कंजूस’ प्रसंग का नकारात्मक नैतिक भाव सहज हिन्दी में व्यक्त करता है।
- source_word: κρατεῖται
  choice: वश में रखती है
  rationale: निष्क्रिय क्रिया का अर्थ नियंत्रण या रोक के अधीन होना है। हिन्दी में व्यवस्था को कर्ता बनाकर कहना स्वाभाविक है और यूनानी अर्थ को सुरक्षित रखता है।
- source_word: διὰ τὸν λογισμόν
  choice: विवेक के द्वारा
  rationale: λογισμός इस पुस्तक में सोच-समझकर निर्णय करने वाली शक्ति है। ‘विवेक’ सामान्य पाठक के लिए सहज है और केवल औपचारिक तर्क के बजाय नैतिक-युक्तिसंगत निर्णय का भाव भी रखता है।
- source_word: ἐπικαρπούμενος τοὺς ἀμήτους
  choice: कटनी के बाद खेत में बची उपज बटोरता
  rationale: कृषि-संदर्भ और समानांतर दाखबारी-वाक्यांश इसे कटनी के बाद बची उपज बटोरने की ओर संकेत करते हैं। यह रूपान्तरण उस प्राचीन कृषि-क्रिया को आधुनिक हिन्दी में स्पष्ट करता है, बिना ‘अकटे खेत’ जैसे भ्रामक अर्थ के।
- source_word: ἐπιρρωγολογούμενος τοὺς ἀμπελῶνας
  choice: दाखबारियों में बची हुई दाख दोबारा चुनता है
  rationale: दुर्लभ क्रिया पहली बार फल तोड़े जाने के बाद बचे गुच्छों या दानों को फिर बटोरने का भाव देती है। ‘दोबारा चुनता’ पुनरावृत्त क्रिया को स्पष्ट करता है।
- source_word: ἐπὶ τῶν ἑτέρων
  choice: इसी तरह, दूसरी बातों में भी
  rationale: यह अभिव्यक्ति कृषि-उदाहरण से सिद्धान्त को अन्य क्षेत्रों तक फैलाती है। चुना हुआ रूप स्वाभाविक हिन्दी में वही विस्तार व्यक्त करता है।
- source_word: ἐπιγνῶναι
  choice: यह पहचाना जा सकता है
  rationale: यहाँ क्रिया उदाहरणों से किसी बात को समझने या पहचानने का अर्थ देती है; ‘पहचाना जा सकता है’ सम्भावना और निष्कर्ष दोनों को बनाए रखता है।
- source_word: παθῶν
  choice: आवेगों
  rationale: इस दार्शनिक प्रसंग में πάθη उन आन्तरिक प्रेरक वेगों को दर्शाता है जिन्हें नियंत्रित किया जाना है। ‘भावनाएँ’ बहुत तटस्थ और व्यापक है, जबकि ‘वासनाएँ’ बहुत संकीर्ण; ‘आवेग’ उपयुक्त मध्य मार्ग है।
- source_word: ὁ λογισμὸς κρατῶν
  choice: विवेक आवेगों पर शासन करता है
  rationale: कर्तृवाचक कृदन्त विवेक की नियंत्रक प्रभुता पर बल देता है। ‘शासन करता है’ इस बल को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
theological_decisions:
- issue: 4 मक्काबियों में λογισμός की दार्शनिक-मानववैज्ञानिक भूमिका
  choice: विवेक
  alternative: तर्कबुद्धि
  rationale: पुस्तक की धारणा केवल अमूर्त तर्क नहीं, बल्कि आस्था और व्यवस्था से निर्देशित विचारशील निर्णय की है। ‘विवेक’ इस व्यापकता को रखता है; ‘तर्कबुद्धि’ अधिक तकनीकी और संकीर्ण लग सकती है।
- issue: πάθη का नैतिक-दर्शन संबंधी बल
  choice: आवेग
  alternative: मनोभाव / वासनाएँ
  rationale: पाठ सभी भावनाओं को बुरा नहीं ठहराता, बल्कि उन प्रेरक आवेगों की बात करता है जिन पर विवेक शासन करता है। ‘आवेग’ इस तनाव को बिना अतिरिक्त धार्मिक अर्थ जोड़े सुरक्षित रखता है।
- issue: व्यवस्था और विवेक के बीच साधनात्मक संबंध
  choice: व्यवस्था उसे विवेक के द्वारा वश में रखती है
  alternative: विवेक के कारण वह व्यवस्था के अधीन रहता है
  rationale: यूनानी वाक्य में व्यक्ति व्यवस्था के अधीन नियंत्रित होता है और विवेक उस नियंत्रण का माध्यम है। चुना हुआ वाक्य इस संबंध को स्पष्ट रखता है, पर यह तय नहीं करता कि विवेक व्यवस्था से स्वतंत्र है या उसी से गठित।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। कृषि-संबंधी प्राचीन क्रियाओं को स्पष्ट करने के लिए ‘कटनी के बाद’ और ‘बची हुई’ जोड़ा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘stingy’ के बाद था, पर उसकी सामग्री दाखबारी वाली क्रिया से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [a] को उसी वाक्यांश के बाद रखा गया है।
