  text: For prudent reason drives away all these vicious passions[a], just as it also drives away anger; for it is master even over this.
translation:
  language: hi
  text: क्योंकि संयमी बुद्धि[a] इन सभी कुत्सित मनोवेगों को दूर हटा देती है, जैसे वह क्रोध को भी दूर करती है; क्योंकि वह उस पर भी प्रभुत्व रखती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘आत्मसंयमी मन’ भी हो सकता है। यूनानी पद ὁ σώφρων νοῦς में विवेकशील क्षमता और अनुशासित आत्मसंयम—दोनों भाव सम्मिलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόηθη πάθη
  choice: कुत्सित मनोवेग
  rationale: πάθη यहाँ दुःख नहीं, बल्कि मन में उठने वाले ऐसे आवेग हैं जिन्हें विवेक के अधीन रखना है; κακόηθη उनकी नैतिक रूप से बुरी और हानिकारक प्रकृति बताता है। ‘कुत्सित मनोवेग’ इस दार्शनिक-नैतिक अर्थ को स्पष्ट रखता है।
- source_word: ὁ σώφρων νοῦς
  choice: संयमी बुद्धि
  rationale: νοῦς के विचार-विवेक वाले पक्ष को ‘बुद्धि’ और σώφρων के आत्मसंयम तथा संतुलन को ‘संयमी’ व्यक्त करता है। यह पद के दोनों अर्थ-घटकों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπωθεῖται
  choice: दूर हटा देती है
  rationale: क्रिया सक्रिय रूप से परे धकेलने या दूर करने का बोध देती है; यह अनुवाद उस प्रभावी प्रतिरोध को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θυμόν
  choice: क्रोध
  rationale: इस प्रसंग में θυμός उस आवेग का नाम है जिस पर बुद्धि अधिकार रखती है; इसलिए ‘क्रोध’ सबसे स्पष्ट अर्थ है।
- source_word: δεσπόζει
  choice: अधिकार रखती है
  rationale: क्रिया स्वामित्वपूर्ण शासन या नियंत्रण व्यक्त करती है। ‘अधिकार रखती है’ स्रोत की प्रबल नियंत्रण-भाषा को बनाए रखता है और हिन्दी में सहज है।
theological_decisions:
- issue: ὁ σώφρων νοῦς का मानव-स्वभाव और दर्शन संबंधी अर्थ
  choice: संयमी बुद्धि
  alternative: विवेकशील बुद्धि; आत्मसंयमी मन
  rationale: पुस्तक का तर्क केवल सामान्य समझ या मानसिक अवस्था के विषय में नहीं, बल्कि आत्मसंयम से युक्त विवेकशील क्षमता के मनोवेगों पर शासन के विषय में है। ‘संयमी बुद्धि’ इस तनाव को किसी विशेष धार्मिक मत की ओर मोड़े बिना सुरक्षित रखता है।
