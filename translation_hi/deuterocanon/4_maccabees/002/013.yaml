lexical_decisions:
- source_word: μὴ νομίσητε
  choice: न समझिए
  rationale: यह पद किसी बात के विषय में मूल्यांकन करने से रोकता है। आदरसूचक बहुवचन में ‘न समझिए’ स्वाभाविक और स्पष्ट है।
- source_word: παράδοξον
  choice: आश्चर्य की बात
  rationale: यहाँ शब्द का अर्थ अपेक्षा के विपरीत या चकित करने वाली बात है। ‘आश्चर्य की बात’ आधुनिक हिन्दी में सहज है और अनावश्यक तकनीकी भाव से बचता है।
- source_word: ὅπου
  choice: कि
  rationale: शाब्दिक अर्थ ‘जहाँ’ है, पर इस संक्षिप्त यूनानी रचना में यह उस परिस्थिति या तथ्य को सामने लाता है जिसे आश्चर्यजनक नहीं मानना चाहिए। हिन्दी में ‘कि’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔχθραν
  choice: वैरभाव
  rationale: यह शब्द शत्रुता या बैर की अवस्था को सूचित करता है। ‘वैरभाव’ भावनात्मक और संबंधपरक दोनों पहलुओं को बनाए रखता है।
- source_word: ὁ λογισμός
  choice: विवेक
  rationale: 4 मक्काबियों में यह मनुष्य की तर्कसंगत, निर्णयकारी क्षमता का प्रमुख शब्द है। ‘विवेक’ सामान्य हिन्दी में बोधगम्य है और केवल विचार-प्रक्रिया के बजाय संयमकारी बुद्धि का भाव भी देता है।
- source_word: ἐπικρατεῖν δύναται
  choice: विजय पा सकता है
  rationale: δύναται सामर्थ्य और ἐπικρατεῖν किसी पर प्रबल होने को व्यक्त करता है। ‘विजय पा सकता है’ दोनों अर्थों को स्वाभाविक हिन्दी में रखता है।
- source_word: διὰ τὸν νόμον
  choice: व्यवस्था के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या प्रेरक आधार बताता है। ‘के कारण’ यूनानी की कारणगत अस्पष्टता को बनाए रखता है और उद्देश्य का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: νόμον
  choice: व्यवस्था
  rationale: संदर्भ यहूदी धार्मिक व्यवस्था अर्थात तोराह का है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित है और मूल के सामान्य संज्ञा-रूप को बनाए रखता है।
theological_decisions:
- issue: 4 मक्काबियों में λογισμός का दार्शनिक-धर्मवैज्ञानिक अर्थ
  choice: विवेक
  alternative: तर्क-बुद्धि; विचार-शक्ति
  rationale: पुस्तक का विषय भक्तिपूर्ण विवेक का आवेगों पर प्रभुत्व है। ‘विवेक’ इस निर्णयकारी और संयमकारी क्षमता को व्यक्त करता है, बिना बाद की किसी विशिष्ट दार्शनिक प्रणाली को आरोपित किए।
- issue: διὰ τὸν νόμον का बल
  choice: व्यवस्था के कारण
  alternative: व्यवस्था के लिए; व्यवस्था के निमित्त
  rationale: यूनानी पदबंध कारण और प्रेरणा के बीच कुछ खुलापन रखता है। ‘के कारण’ इस संबंध को सीधे व्यक्त करता है, पर इसे केवल साधन या यांत्रिक कारण नहीं बनाता।
