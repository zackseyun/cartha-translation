  register: आधुनिक मानक हिन्दी में आदरसूचक बहुवचन और गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘विवेक’ को पुस्तक के प्रमुख दार्शनिक शब्द के रूप में स्थिर रखा गया है; ‘व्यवस्था’ से तोराह का संकेत मिलता है, पर मूल से अधिक स्पष्ट धार्मिक शीर्षक नहीं जोड़ा गया।
