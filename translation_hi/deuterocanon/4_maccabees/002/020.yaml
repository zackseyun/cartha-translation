lexical_decisions:
- source_word: εἰ μὴ γὰρ
  choice: क्योंकि यदि ... नहीं
  rationale: γάρ के व्याख्यात्मक अर्थ और εἰ μή की नकारात्मक शर्त—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐδύνατο
  choice: रख सकता
  rationale: δύναμαι की सामर्थ्य-सूचक अपूर्णकालिक क्रिया को प्रतिकल्पित शर्त के अनुरूप व्यक्त करता है।
- source_word: τῶν θυμῶν
  choice: मनोवेगों
  rationale: यहाँ θυμός का बहुवचन केवल क्रोध नहीं, बल्कि विवेक के अधीन किए जाने वाले प्रबल भावात्मक आवेगों का व्यापक द्योतक है।
- source_word: ὁ λογισμός
  choice: विवेक
  rationale: ग्रंथ के दार्शनिक संदर्भ में λογισμός तर्क-विवेक अथवा निर्णय करने वाली विवेकशील शक्ति को दर्शाता है; ‘विवेक’ वर्तमान हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: κρατεῖν
  choice: पर नियंत्रण रखना
  rationale: κρατέω के प्रभुत्व अथवा वश में रखने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἂν εἶπεν
  choice: उसने ... न कहा होता
  rationale: ἄν सहित भूतकालिक क्रिया की तथ्य-विपरीत परिणति को हिन्दी के ‘न कहा होता’ द्वारा सुरक्षित रखा गया है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: पूर्व कथन की रीति अथवा विषय की ओर संकेत करने वाला स्पष्ट और गरिमापूर्ण हिन्दी प्रयोग है।
theological_decisions:
- issue: λογισμός का दार्शनिक-मानवशास्त्रीय अर्थ
  choice: विवेक
  alternative: तर्कशक्ति
  rationale: ‘विवेक’ मनोवेगों को नियंत्रित करने वाली विचारशील शक्ति का अर्थ देता है, पर किसी विशिष्ट सांप्रदायिक मानवशास्त्र को आरोपित नहीं करता।
- issue: θυμοί का अर्थ-क्षेत्र
  choice: मनोवेगों
  alternative: क्रोधों
  rationale: बहुवचन और पुस्तक के व्यापक दार्शनिक तर्क के कारण इसे केवल क्रोध तक सीमित करना अनुचित होगा; ‘मनोवेग’ भावात्मक आवेगों की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और दार्शनिक तर्क के अनुकूल है। ‘विवेक’ और ‘मनोवेग’ सामान्य पाठक के लिए समझने योग्य रहते हुए मूल की वैचारिक भिन्नता को बनाए रखते हैं।
