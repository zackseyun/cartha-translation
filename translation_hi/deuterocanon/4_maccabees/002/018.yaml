translation:
  language: hi
  text: क्योंकि, जैसा मैं कह चुका हूँ, विवेकशील बुद्धि मनोवेगों पर विजय पाने और उनमें से कुछ की दिशा बदलने तथा कुछ को निष्प्रभावी तक कर देने में समर्थ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρων
  choice: विवेकशील
  rationale: यहाँ शब्द अनुशासित, संतुलित और सही निर्णय करने वाली बुद्धि का गुण बताता है; ‘विवेकशील’ आधुनिक हिन्दी में इस नैतिक-बौद्धिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: νοῦς
  choice: बुद्धि
  rationale: प्रसंग में यह मनुष्य की तर्कशील और निर्णयकारी क्षमता है। ‘बुद्धि’ सामान्य पाठक के लिए सहज है और केवल सामान्य ‘मन’ की अपेक्षा दार्शनिक अर्थ को अधिक स्पष्ट रखती है।
- source_word: κατὰ τῶν παθῶν
  choice: मनोवेगों पर
  rationale: πάθη यहाँ सामान्य दुःख नहीं, बल्कि मनुष्य को प्रेरित या विचलित करने वाले आवेग और भावात्मक प्रवृत्तियाँ हैं। ‘पर’ ἀριστεῦσαι के साथ उनकी तुलना में श्रेष्ठता और उन पर विजय का भाव देता है।
- source_word: ἀριστεῦσαι
  choice: विजय पाने
  rationale: क्रिया का मूल भाव श्रेष्ठ सिद्ध होने या बाज़ी मारने का है; इस संघर्षात्मक प्रसंग में ‘विजय पाने’ से उसका आशय स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: μεταθεῖναι
  choice: दिशा बदलने
  rationale: यह कुछ मनोवेगों को मिटाने के बजाय बदलने या दूसरी ओर मोड़ने का संकेत देता है। ‘दिशा बदलने’ से अगले अधिक प्रबल ἀκυρῶσαι के साथ भेद बना रहता है।
- source_word: ἀκυρῶσαι
  choice: निष्प्रभावी कर देने
  rationale: क्रिया का अर्थ किसी चीज़ को प्रभावहीन या अमान्य कर देना है। मनोवेगों के संबंध में ‘निष्प्रभावी’ कानूनी अर्थ वाले ‘अमान्य’ से अधिक स्वाभाविक है।
- source_word: τὰ μὲν αὐτῶν ... τὰ δὲ καί
  choice: उनमें से कुछ ... और कुछ ... भी
  rationale: यह संरचना मनोवेगों के दो भिन्न परिणामों का विरोध दिखाती है; ‘भी’ दूसरे और अधिक निर्णायक परिणाम पर καί का बल बनाए रखता है।
theological_decisions:
- issue: νοῦς और πάθη का मानव-स्वभाव संबंधी दार्शनिक चित्रण
  choice: पद को विवेकशील बुद्धि द्वारा मनोवेगों पर विजय के रूप में रखा गया है, बिना बाद की किसी विशिष्ट धर्मसैद्धांतिक व्यवस्था को आरोपित किए।
  alternative: νοῦς को ‘मन’ और πάθη को व्यापक रूप से ‘भावनाएँ’ कहना।
  rationale: ग्रन्थ का तर्क यूनानी-यहूदी दार्शनिक संदर्भ में तर्कशील क्षमता और आवेगों के शासन से जुड़ा है। ‘बुद्धि’ और ‘मनोवेग’ उस तनाव को बनाए रखते हैं तथा यह नहीं कहते कि हर भावना अपने-आप में बुरी है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में डैश का प्रयोग अंतिम दो समानांतर क्रियाओं को मुख्य दावे की व्याख्या के रूप में स्पष्ट करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
