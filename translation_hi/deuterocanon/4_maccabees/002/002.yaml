- source_word: Ἰωσὴφ
  choice: यूसुफ
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप।
- source_word: ἐπαινεῖται
  choice: की प्रशंसा की जाती है
  rationale: यूनानी वर्तमानकालीन कर्मवाच्य का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: τῷ λογισμῷ διανοίᾳ
  choice: विवेकपूर्ण सोच के द्वारा
  rationale: पाठ में λογισμός और διάνοια का संयोजन व्याकरणतः कुछ असहज है। यह अनुवाद दोनों को मिटाए बिना तर्कशील मानसिक नियंत्रण का संयुक्त भाव सहज हिन्दी में देता है।
- source_word: περιεκράτησεν
  choice: पर अधिकार कर लिया
  rationale: क्रिया किसी प्रवृत्ति पर प्रभुत्व या नियंत्रण पा लेने को व्यक्त करती है।
- source_word: τῆς ἡδυπαθείας
  choice: सुख-लिप्सा
  rationale: ἡδυπάθεια सुख में आसक्ति अथवा सुख-भोग की लालसा को दर्शाता है; ‘सुख-लिप्सा’ संक्षेप में उसी नकारात्मक नैतिक भाव को व्यक्त करती है।
