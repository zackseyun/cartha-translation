  choice: κενοδοξίας = ‘खोखली महिमा’; ἀλαζονίας = ‘डींग मारना’; μεγαλαυχίας = ‘घमंड’
  alternative: व्यर्थ गौरव / शेखी / अहंकार
  rationale: यूनानी में संबंधित किंतु अलग दोष क्रमशः दिए गए हैं। हिन्दी में भी उन्हें एक ही ‘अभिमान’ शब्द में समेटने के बजाय उनकी संचयी अलंकारिक शक्ति और अर्थभेद सुरक्षित रखा गया है।
