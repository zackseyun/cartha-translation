    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῶν βιαιοτέρων ... παθῶν
  choice: अधिक प्रबल मनोवेगों पर भी
  rationale: κρατεῖν के साथ यह पदबंध उन तीव्र और बलवान भावावेगों पर विवेक के प्रभुत्व को व्यक्त करता है। यहाँ πάθη का अर्थ ‘दुःख’ नहीं, बल्कि मनोवेग है।
- source_word: κρατεῖν
  choice: प्रभुत्व रखता है
  rationale: यह अनुवाद विवेक की श्रेष्ठता और नियंत्रण—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ λογισμός
  choice: विवेक
  rationale: इस पुस्तक में यह तर्कशील निर्णय-शक्ति का प्रमुख दार्शनिक शब्द है। ‘विवेक’ आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है तथा केवल अमूर्त ‘तर्क’ से अधिक उपयुक्त रूप से उस नियंत्रक क्षमता को व्यक्त करता है।
- source_word: φαίνεται
  choice: यह स्पष्ट है
  rationale: क्रिया का आशय किसी बात का दिखाई देना या प्रमाणित होना है; ‘यह स्पष्ट है’ हिन्दी में सहज रूप से उसकी प्रत्यक्षता व्यक्त करता है।
- source_word: φιλαρχίας
  choice: सत्ता की लालसा
  rationale: यह शब्द शासन या प्रधानता पाने की इच्छा बताता है। ‘सत्ता की लालसा’ आधुनिक पाठक के लिए स्पष्ट है और इसे सामान्य महत्त्वाकांक्षा तक सीमित नहीं करता।
- source_word: κενοδοξίας
  choice: खोखली महिमा
  rationale: यूनानी पद का शाब्दिक चित्र ‘रिक्त/व्यर्थ महिमा’ है। ‘खोखली महिमा’ उस चित्र को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: ἀλαζονίας
  choice: डींग मारना
  rationale: यह दिखावटी आत्म-प्रशंसा और शेखी का भाव रखता है; क्रियात्मक हिन्दी अभिव्यक्ति इसे अगले, अधिक सामान्य घमंड से अलग करती है।
- source_word: μεγαλαυχίας
  choice: घमंड
  rationale: यह आत्म-बड़ाई और अहंकारी ऊँचाई का भाव व्यक्त करता है। ‘घमंड’ सामान्य पाठक के लिए स्पष्ट है और ‘डींग मारना’ से भिन्न आंतरिक अभिमान को दर्शाता है।
- source_word: βασκανίας
  choice: ईर्ष्या
  rationale: इस दोष-सूची में केंद्रीय अर्थ ईर्ष्या है, यद्यपि शब्द में दुर्भावना या बुरी नज़र का भाव भी हो सकता है; वह विस्तार पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: 4 मक्काबियों में दार्शनिक मुख्य शब्द ὁ λογισμός का अनुवाद
  choice: विवेक
  alternative: तर्क-बुद्धि; विवेकपूर्ण निर्णय
