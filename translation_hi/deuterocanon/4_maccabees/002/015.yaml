  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। दार्शनिक शब्दावली को अत्यधिक संस्कृतनिष्ठ बनाने से बचते हुए ‘विवेक’ और ‘मनोवेग’ द्वारा मूल तर्क का संबंध स्पष्ट रखा गया है।
