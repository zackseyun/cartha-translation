  text: और प्रतीत होता है कि विवेक अधिक प्रबल मनोवेगों पर भी प्रभुत्व रखता है—सत्ता की लालसा, खोखली महिमा[a], डींगबाज़ी, अहंकार और ईर्ष्या[b]।
