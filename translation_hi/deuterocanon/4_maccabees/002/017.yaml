  yaml_path: translation/deuterocanon/4_maccabees/002/017.yaml
  text: For although Moses was angered against Dathan and Abiron, he did nothing against them in anger, but with reason he restrained anger.
translation:
  language: hi
  text: यद्यपि मूसा दातान और अबीरोन[a] पर क्रोधित थे, फिर भी उन्होंने उनके विरुद्ध क्रोध में आकर कुछ नहीं किया, बल्कि विवेक से अपने क्रोध को वश में रखा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “अबीरोन”; परंपरागत नाम “अबीराम” है।
    reason: lexical_alternative
  - marker: b
    text: या, “तर्कपूर्ण निर्णय से अपने क्रोध को नियंत्रित किया।” यूनानी अभिव्यक्ति विवेक द्वारा आवेगों पर नियंत्रण पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμούμενος
  choice: क्रोधित तो हुए
  rationale: यह कृदन्त मूसा के वास्तविक क्रोध को व्यक्त करता है; ‘तो’ आगे आने वाले विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: γέ τοι
  choice: क्योंकि … तो हुए, फिर भी
  rationale: इन निपातों के बलाघाती और प्रसंगगत concessive भाव को हिन्दी की ‘तो … फिर भी’ रचना से व्यक्त किया गया है; आरम्भिक ‘क्योंकि’ पद को पिछले तर्क से जोड़ता है।
- source_word: κατὰ Δαθὰν καὶ Ἀβειρών
  choice: दातान और अबीरोन पर
  rationale: κατά यहाँ विरोध की दिशा बताता है। नामों को यूनानी पाठ के रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: οὐ θυμῷ τι κατ᾽ αὐτῶν ἐποίησεν
  choice: उन्होंने क्रोध में आकर उनके विरुद्ध कुछ नहीं किया
  rationale: θυμῷ के भाव अथवा प्रेरक साधन को सहज हिन्दी में व्यक्त करते हुए यह स्पष्ट रखा गया है कि मूसा ने क्रोध के वशीभूत होकर कार्य नहीं किया।
- source_word: λογισμῷ
  choice: विवेक से
  rationale: यह शब्द 4 मक्काबियों में आवेगों पर शासन करने वाली तर्कशील समझ का प्रमुख दार्शनिक पद है। ‘विवेक’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और नैतिक-बौद्धिक दोनों अर्थों को वहन करता है।
- source_word: τὸν θυμὸν διήτησεν
  choice: अपने क्रोध को वश में रखा
  rationale: क्रिया यहाँ क्रोध को नियंत्रित या संचालित करने का भाव देती है। ‘वश में रखा’ क्रोध के अस्तित्व को नकारे बिना उस पर विवेक के नियंत्रण को स्पष्ट करता है।
theological_decisions:
- issue: λογισμός के दार्शनिक अर्थ और पुस्तक के केंद्रीय विषय को कैसे व्यक्त किया जाए
  choice: विवेक से
  alternative: तर्कपूर्ण निर्णय से
  rationale: ‘विवेक’ साधारण पाठक के लिए सहज रहते हुए तर्कशील निर्णय द्वारा आवेग पर नियंत्रण का अर्थ रखता है; अधिक तकनीकी विकल्प मुख्य पाठ को बोझिल कर देता।
- issue: Ἀβειρών नाम का रूप
  choice: अबीरोन
  alternative: अबीराम
  rationale: मुख्य पाठ में परिचित परंपरागत रूप को आरोपित करने के बजाय यूनानी स्रोत-पाठ के नामरूप को प्राथमिकता दी गई है; परिचित रूप पादटिप्पणी में दिया गया है।
- issue: διήτησεν में नियंत्रण की सीमा
  choice: वश में रखा
  alternative: नियंत्रित किया / शासन किया
  rationale: पाठ यह नहीं कहता कि मूसा को क्रोध था ही नहीं, बल्कि यह कि विवेक ने उस पर प्रभुत्व रखा। चुना हुआ वाक्यांश इसी तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘क्रोधित तो हुए, फिर भी’ वास्तविक क्रोध और विवेकपूर्ण संयम के विरोध को स्पष्ट करता है। ‘विवेक’ को पुस्तक के दार्शनिक संदर्भ के अनुरूप रखा गया है, और दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
