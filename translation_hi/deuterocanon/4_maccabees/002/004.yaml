translation:
  language: hi
  text: और विवेक न केवल सुखभोग-लिप्सा की उन्मत्त करने वाली उकसाहट पर, बल्कि हर इच्छा पर भी प्रभुत्व रखता दिखाई देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λογισμός
  choice: विवेक-बुद्धि
  rationale: यहाँ शब्द केवल तर्क करने की प्रक्रिया नहीं, बल्कि नैतिक रूप से अनुशासित विचार-शक्ति को दर्शाता है। ‘विवेक-बुद्धि’ उसके बौद्धिक और नैतिक दोनों पहलुओं को सहज हिन्दी में बनाए रखता है।
- source_word: φαίνεται
  choice: दिखाई देती है
  rationale: यह यूनानी क्रिया कथन को प्रत्यक्ष या स्पष्ट होने के रूप में प्रस्तुत करती है। यह अनुवाद न तो इसे केवल अनिश्चित आभास बनाता है, न औपचारिक रूप से सिद्ध होने का अतिरिक्त भाव जोड़ता है।
- source_word: ἐπικρατεῖν
  choice: प्रभुत्व रखती
  rationale: इस क्रिया में किसी पर प्रभावी नियंत्रण या श्रेष्ठता रखने का भाव है। ‘प्रभुत्व रखती’ दार्शनिक कथन की शक्ति को सुरक्षित रखता है।
- source_word: τὴν τῆς ἡδυπαθείας οἰστρηλασίαν
  choice: सुखभोग की लिप्सा की उन्मत्त प्रेरणा
  rationale: यह दुर्लभ और सघन यूनानी पद सुख-विलास की चाह से उकसाए या डंक मारे जाने जैसी उन्मत्त गति का रूपक प्रस्तुत करता है। हिन्दी पदबंध उसके उकसाने और उन्मत्त करने—दोनों भावों को व्यक्त करता है।
- source_word: πάσης ἐπιθυμίας
  choice: हर इच्छा
  rationale: ἐπιθυμία इच्छा, लालसा या कामना के लिए व्यापक शब्द है; ‘हर इच्छा’ πάσης की सार्वभौमिकता और मूल की व्यापक अर्थ-सीमा बनाए रखता है।
theological_decisions:
- issue: वासनाओं पर विवेक-बुद्धि के प्रभुत्व का मानवशास्त्रीय-दर्शनात्मक दावा
  choice: विवेक-बुद्धि को सुखभोग से जुड़ी उन्मत्त प्रेरणा और हर इच्छा पर प्रभुत्व रखते हुए प्रस्तुत किया गया है
  alternative: इसे केवल ऐसा आभास माना जाए कि विवेक-बुद्धि प्रभुत्व रखती है, या इसका नियंत्रण कुछ इच्छाओं तक सीमित समझा जाए
  rationale: पद पुस्तक के केंद्रीय तर्क के अनुसार विवेक-बुद्धि की वासनाओं पर श्रेष्ठता व्यक्त करता है। साथ ही ‘दिखाई देती है’ φαίνεται को बनाए रखता है और कथन को मूल से अधिक निरपेक्ष या औपचारिक रूप से सिद्ध नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘विवेक-बुद्धि’ पुस्तक के दार्शनिक स्वर को बनाए रखता है, जबकि कठिन रूपक को मुख्य पाठ में स्वाभाविक हिन्दी में खोला गया है और उसके वैकल्पिक रूप पाद-टिप्पणी में दिए गए हैं।
