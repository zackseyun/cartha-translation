- source_word: τῶν ἑβδομάδων ἐνστασῶν
  choice: जब सातवाँ वर्ष आता है
  rationale: शाब्दिक ‘सातों/सप्ताहों के आने पर’ इस कानूनी संदर्भ में सातवें वर्ष की ऋण-मुक्ति की ओर संकेत करता है; मुख्य पाठ में संकेत का आशय स्पष्ट किया गया है और पादटिप्पणी में शाब्दिक रूप रखा गया है।
- source_word: χρεοκοπούμενος
  choice: ऋण माफ़ करके उसकी हानि स्वयं सहता है
  rationale: कृदंत में ऋण छोड़ देने और फलतः ऋणदाता द्वारा आर्थिक हानि उठाने, दोनों का भाव संभव है; संयुक्त रूप दोनों पहलुओं को बिना अनावश्यक रूप से किसी एक तक सीमित किए व्यक्त करता है।
theological_decisions:
- issue: τῶν ἑβδομάδων ἐνστασῶν में सातवें वर्ष की व्यवस्था का संकेत
  choice: मुख्य पाठ में ‘जब सातवाँ वर्ष आता है’
  alternative: ‘जब सातों/सप्ताह आते हैं’
  rationale: व्यवस्थाविवरण की ऋण-मुक्ति संबंधी पृष्ठभूमि संदर्भ से प्रबल है, पर यूनानी की संक्षिप्त अभिव्यक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: χρεοκοπούμενος में ऋण-मुक्ति बनाम निजी आर्थिक हानि
  choice: ‘ऋण माफ़ करके उसकी हानि स्वयं सहता है’
  alternative: केवल ‘ऋण माफ़ करता है’ अथवा केवल ‘ऋण की हानि सहता है’
  rationale: यूनानी शब्द ऋण के कारण हानि उठाने पर बल दे सकता है, जबकि कानूनी संदर्भ ऋण छोड़ने की क्रिया बताता है। मुख्य पाठ दोनों को साथ रखकर वास्तविक अर्थगत तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘व्यवस्था’ धार्मिक-कानूनी νόμος के लिए, ‘धन से प्रेम करनेवाला’ मूल शब्द की छवि बनाए रखने के लिए, और ‘वश में करता है’ स्वाभाविक आत्म-संयम व्यक्त करने के लिए चुना गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
