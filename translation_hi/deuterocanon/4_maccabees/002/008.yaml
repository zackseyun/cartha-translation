  yaml_path: translation/deuterocanon/4_maccabees/002/008.yaml
  text: Therefore[a], even if someone is money-loving, by living under the law he compels his own way of life, lending to those in need without interest, and when the seventh year arrives[b], canceling the debt.
translation:
  language: hi
  text: 'इसलिए, यदि कोई धन से प्रेम करनेवाला भी हो, तो व्यवस्था के अनुसार जीवन जीते हुए वह अपने स्वभाव को वश में करता है: वह ज़रूरतमंदों को बिना ब्याज के उधार देता है और, जब सातवाँ वर्ष आता है[a], तब ऋण माफ़ करता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जब सप्तक आ उपस्थित होते हैं”; यह सातवें वर्ष में ऋण-मुक्ति की व्यवस्था की ओर संकेत है।
    reason: cross_reference
  - marker: b
    text: या, “ऋण के कारण आर्थिक हानि सहता है”; यूनानी कृदंत ऋण माफ़ करने में ऋणदाता को होनेवाली वित्तीय हानि पर बल दे सकता है।
    reason: lexical_alternative
