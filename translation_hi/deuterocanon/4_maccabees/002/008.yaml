- source_word: φιλάργυρός
  choice: धन से प्रेम करनेवाला
  rationale: यह शब्द धन के प्रति प्रेम को सीधे व्यक्त करता है और ‘लालची’ जैसे अधिक व्याख्यात्मक शब्द से बचता है।
- source_word: βιάζεται τὸν ἑαυτοῦ τρόπον
  choice: अपनी ही प्रवृत्ति को वश में करता है
  rationale: यूनानी पदबंध अपने स्वभावगत ढंग या झुकाव पर बलपूर्वक नियंत्रण करने का भाव रखता है; हिन्दी में यह अभिव्यक्ति उसी आत्म-संयम को स्वाभाविक ढंग से बताती है।
- source_word: τοῖς δεομένοις
