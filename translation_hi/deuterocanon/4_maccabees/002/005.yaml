lexical_decisions:
- source_word: λέγει
  choice: कहती है
  rationale: वर्तमान काल में आया क्रिया-रूप पवित्रशास्त्रीय उद्धरण का परिचय देता है; हिन्दी में ‘कहती है’ स्वाभाविक है।
- source_word: γοῦν
  choice: इसलिए
  rationale: यह अव्यय पिछले तर्क से निष्कर्षात्मक अथवा पुष्टिकारक संबंध जोड़ता है; यहाँ ‘इसलिए’ उस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: यह मूसा की व्यवस्था में दी गई आज्ञा की ओर संकेत करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्पष्ट और प्रतिष्ठित पद है।
- source_word: Οὐκ ἐπιθυμήσεις
  choice: लालच न करना
  rationale: ἐπιθυμέω यहाँ दूसरे की वस्तु पाने की प्रबल और अनुचित इच्छा को दर्शाता है। ‘लालच न करना’ आधुनिक हिन्दी में नैतिक निषेध को स्पष्ट करता है और दशाज्ञा की परिचित भाषा से भी मेल खाता है।
- source_word: τὴν γυναῖκα
  choice: पत्नी
  rationale: τοῦ πλησίον σου के साथ संबंधपरक अर्थ वैवाहिक है, इसलिए ‘पत्नी’ उपयुक्त है।
- source_word: τοῦ πλησίον σου
  choice: अपने पड़ोसी की
  rationale: यह स्वामित्व-संबंध को सहज हिन्दी में व्यक्त करता है; πλησίον के लिए ‘पड़ोसी’ प्रचलित बाइबलीय पद है।
- source_word: οὐδὲ ὅσα
  choice: और न किसी ऐसी वस्तु का
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक पद का भाव समावेशी है; हिन्दी में ‘किसी ऐसी वस्तु’ स्पष्ट और स्वाभाविक है।
- source_word: τῷ πλησίον σού ἐστιν
  choice: जो तेरे पड़ोसी की है
  rationale: यूनानी संरचना स्वामित्व व्यक्त करती है; यह हिन्दी रूप मूल की अपेक्षाकृत निकट और स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: दशाज्ञा के उद्धरण में ἐπιθυμέω का अनुवाद
  choice: लालच न करना
  alternative: इच्छा न करना
  rationale: संदर्भ मनोवेग और इच्छा पर विवेक के शासन की चर्चा करता है, पर इस आज्ञा में क्रिया किसी दूसरे की पत्नी या संपत्ति पर अनुचित अभिलाषा लगाने को बताती है। ‘लालच’ इस नैतिक अर्थ को साधारण आधुनिक हिन्दी में अधिक ठीक ढंग से व्यक्त करता है; व्यापक शाब्दिक विकल्प ‘इच्छा’ अनावश्यक रूप से हर प्रकार की इच्छा को निषिद्ध समझा जा सकता है।
