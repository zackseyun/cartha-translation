  text: For the law also prevails over affection toward parents[a], not betraying virtue on account of them[b];
translation:
  language: hi
  text: क्योंकि व्यवस्था माता-पिता के प्रति स्नेह पर भी प्रबल होती है[a] और उनके कारण सद्गुण को धोखा नहीं देती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “माता-पिता के प्रति सद्भाव पर भी अधिकार रखती है”; अथवा “माता-पिता के प्रति निष्ठा से भी अधिक प्रबल रहती है।”
    reason: εὐνοία और κρατεῖ में क्रमशः सद्भाव/निष्ठा तथा प्रभुत्व/प्रधानता की अर्थ-छायाएँ संभव हैं।
  - marker: b
    text: या, “उनकी खातिर सद्गुण को नहीं छोड़ती।”
    reason: δι᾽ αὐτούς हेतु या कारण दोनों व्यक्त कर सकता है, और καταπροδίδωμι का अर्थ पूरी तरह त्याग देना भी हो सकता है।
lexical_decisions:
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: सप्रत्यय यूनानी पद और 4 मक्काबियों के यहूदी नैतिक संदर्भ में यह मूसा की व्यवस्था/तोरा की ओर संकेत करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्वाभाविक और सुसंगत है।
- source_word: τῆς πρὸς γονεῖς εὐνοίας
  choice: माता-पिता के प्रति स्नेह
  rationale: εὔνοια सद्भाव, अनुराग या हितैषी भावना को व्यक्त करता है। ‘स्नेह’ पारिवारिक भाव को सहज हिन्दी में रखता है, पर इसे आज्ञापालन का अर्थ नहीं देता।
- source_word: κρατεῖ
  choice: पर भी प्रबल रहती है
  rationale: κρατέω यहाँ किसी पर सामर्थ्य या नैतिक प्रधानता रखने का भाव देता है। ‘प्रबल रहती है’ व्यवस्था और माता-पिता के प्रति स्नेह के बीच नैतिक प्राथमिकता को व्यक्त करता है।
- source_word: μὴ καταπροδιδοὺς
  choice: विश्वासघात नहीं करती
  rationale: καταπροδίδωμι केवल छोड़ देने से अधिक तीव्र, धोखे से सौंप देने या विश्वासघात करने का भाव रखता है। स्त्रीलिंग क्रिया ‘करती’ हिन्दी में ‘व्यवस्था’ से मेल खाती है और यूनानी कृदंत का कर्ता भी वही रहता है।
- source_word: τὴν ἀρετήν
  choice: सद्गुण
  rationale: ἀρετή इस ग्रंथ के दार्शनिक-नैतिक संदर्भ में नैतिक श्रेष्ठता या virtue का प्रमुख पद है; ‘सद्गुण’ उसका संक्षिप्त और गरिमापूर्ण हिन्दी रूप है।
- source_word: δι᾽ αὐτούς
  choice: उनके कारण
  rationale: διά के साथ कर्मकारक कारण या हेतु बताता है। बहुवचन सर्वनाम निकटवर्ती ‘माता-पिता’ की ओर संकेत करता है; ‘उनके कारण’ इस संबंध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: व्यवस्था और माता-पिता के प्रति स्नेह की नैतिक प्राथमिकता
  choice: व्यवस्था को माता-पिता के प्रति स्नेह से भी अधिक प्रबल बताया गया है और उसी को सद्गुण से विश्वासघात न करने वाला कर्ता रखा गया है।
  alternative: व्यवस्था माता-पिता के प्रति स्नेह को नियंत्रित या अनुशासित करती है, बिना यह कहे कि दोनों हर स्थिति में टकराते हैं।
  rationale: κρατεῖ प्रधानता या नियंत्रण—दोनों का भाव ग्रहण कर सकता है। ‘प्रबल रहती है’ नैतिक प्राथमिकता को व्यक्त करता है, जबकि वचन को हर पारिवारिक स्थिति पर लागू होने वाले निरपेक्ष संघर्ष में नहीं बदलता। यूनानी में νόμος ही नकारात्मक कृदंत का व्याकरणिक कर्ता है, इसलिए व्यवस्था का मानवीकरण सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध और हल्का दार्शनिक-नैतिक रजिस्टर रखा गया है। ‘व्यवस्था’ तथा ‘सद्गुण’ ग्रंथ के धार्मिक और दार्शनिक संदर्भ को बनाए रखते हैं। यूनानी वाक्य के मानवीकरण और उसकी संभावित नैतिक तनातनी को सरल व्याख्या से समाप्त नहीं किया गया।
