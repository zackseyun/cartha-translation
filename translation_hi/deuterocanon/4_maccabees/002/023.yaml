base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/023.yaml
  text: And to him he gave a law[a], according to which, by conducting himself as a citizen[b], he would rule a kingdom that was self-controlled and just and good and courageous.
translation:
  language: hi
  text: और उसने उसे एक व्यवस्था दी, जिसके अनुसार नागरिक जीवन जीते हुए[a] वह ऐसे राज्य[b] पर शासन करे जो संयमी, न्यायपूर्ण, अच्छा और साहसी हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नागरिक के रूप में आचरण करते हुए”; यूनानी क्रिया में सार्वजनिक अथवा राजनीतिक जीवन का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “राज्य” का अनुवाद “राजसत्ता” या “राजत्व” भी हो सकता है; यूनानी शब्द शासित क्षेत्र अथवा राजकीय शासन—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: उसे
  rationale: यह सम्प्रदान कारक सर्वनाम ἔδωκεν (‘दिया’) के साथ पिछले प्रसंग में उल्लिखित व्यक्ति को सूचित करता है।
- source_word: νόμον
  choice: एक व्यवस्था
  rationale: νόμος यहाँ शासक को दी गई मार्गदर्शक विधि या नियम है; ‘व्यवस्था’ आधुनिक हिन्दी में इसके नैतिक और विधिक दोनों आयामों को समेटती है।
- source_word: καθʼ ὃν
  choice: जिसके अनुसार
  rationale: यह पद उस व्यवस्था को आगे बताए गए नागरिक आचरण और शासन की रीति से स्पष्ट रूप से जोड़ता है।
- source_word: πολιτευόμενος
  choice: नागरिक जीवन जीते हुए
  rationale: πολιτεύομαι नगर-राज्य के सदस्य के रूप में जीवन और आचरण करने का नागरिक-राजनीतिक भाव रखता है। यह अनुवाद उसे केवल ‘शासन करने’ या निजी आत्म-संयम तक सीमित नहीं करता।
- source_word: βασιλεύσειε
  choice: शासन करे
  rationale: यह optative भूतकालीन कथन में अभिप्रेत या संभावित परिणाम व्यक्त करता है; हिन्दी का ‘करे’ उस भाव को स्वाभाविक ढंग से बनाए रखता है।
- source_word: βασιλείαν
  choice: राज्य
  rationale: βασιλεία का अर्थ राज्य, राजसत्ता या राजत्व हो सकता है। यहाँ शासन की वस्तु के रूप में ‘राज्य’ सीधा और सुबोध है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: σώφρονά
  choice: संयमी
  rationale: यह शब्द विवेकपूर्ण आत्म-संयम और मर्यादा का बोध देता है, जो 4 मकाबियों के नैतिक बलाघात के अनुकूल है।
- source_word: δικαίαν
  choice: न्यायपूर्ण
  rationale: राजनीतिक संदर्भ में यह सार्वजनिक न्याय के चरित्र को ‘धर्मी’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀγαθήν
  choice: अच्छा
  rationale: व्यापक सकारात्मक विशेषण को बिना अनावश्यक अर्थ-विस्तार के सीधे रूप में रखा गया है।
- source_word: ἀνδρείαν
  choice: साहसी
  rationale: यह सद्गुण के रूप में धैर्य और वीरता को व्यक्त करता है, पर मूल शब्द की प्राचीन लैंगिक छाया को आधुनिक हिन्दी में अनावश्यक रूप से नहीं लाता।
theological_decisions:
- issue: राजत्व के साथ πολιτευόμενος के नागरिक भाव का अनुवाद
  choice: ‘नागरिक जीवन जीते हुए’ द्वारा नागरिक-राजनीतिक अर्थ बनाए रखा गया है।
  alternative: ‘अपने को संचालित करते हुए’, ‘व्यवस्था के अनुसार जीते हुए’ या ‘राज्य चलाते हुए’।
  rationale: लेखक के तर्क में राजा भी व्यवस्था के अधीन नागरिक आचरण करता है। मूल के इस तनाव को केवल राजकीय प्रशासन या निजी आत्म-नियंत्रण में समेटना उचित नहीं है।
- issue: राजनीतिक सद्गुण-सूची में δικαίαν
  choice: न्यायपूर्ण
  alternative: धर्मी
  rationale: यहाँ विशेषण राज्य अथवा राजसत्ता के सार्वजनिक और नैतिक चरित्र का वर्णन करता है; इसलिए ‘न्यायपूर्ण’ प्रसंग के अधिक अनुकूल है।
- issue: βασιλείαν का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘राज्य’, पर ‘राजसत्ता’ और ‘राजत्व’ की सम्भावना पादटिप्पणी में सुरक्षित।
  alternative: राजसत्ता या राजत्व
  rationale: यूनानी शब्द शासित क्षेत्र और शासनाधिकार दोनों को सूचित कर सकता है; पाठ किसी एक अर्थ को पूर्णतः अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विशेषणों को मूल के अनुसार ‘राज्य’ से जोड़ा गया है, यद्यपि ‘संयमी’ और ‘साहसी’ का राज्य के लिए प्रयोग अलंकारिक प्रतीत हो सकता है; यह मूल यूनानी की नैतिक-राजनीतिक अभिव्यक्ति को सुरक्षित रखता है।
