base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/007.yaml
  text: For how is a man who is by habit eating only one kind of food[a], and is a glutton and a drunkard, retrained, if it is not clear that reason is master of the passions?
translation:
  language: hi
  text: क्योंकि जो मनुष्य स्वभाव से केवल एक ही प्रकार का भोजन खाने वाला[a], पेटू और शराबी हो, उसे फिर से कैसे प्रशिक्षित किया जाता है, जब तक यह स्पष्ट न हो कि बुद्धि आवेगों पर शासन करती है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ यूनानी शब्द का अर्थ “भोजन के विषय में बहुत नखरे करने वाला” या “विशेष व्यंजनों की लालसा रखने वाला” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह पद पिछले तर्क के समर्थन में एक व्याख्यात्मक आलंकारिक प्रश्न आरम्भ करता है।
- source_word: τίνα τρόπον
  choice: कैसे
  rationale: ‘किस प्रकार’ का स्वाभाविक और अर्थपूर्ण हिन्दी रूप।
- source_word: μονοφάγος
  choice: केवल एक ही प्रकार का भोजन खाने वाला
  rationale: दुर्लभ यूनानी शब्द का सबसे सीधा रूप यही है; इसकी संभावित विशेषार्थी व्याख्याएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: τὸ ἦθος
  choice: स्वभाव से
  rationale: यह स्थायी आदत अथवा चरित्रगत प्रवृत्ति को व्यक्त करता है।
- source_word: γαστρίμαργος
  choice: पेटू
  rationale: अत्यधिक खाने की आदत के लिए संक्षिप्त और प्रचलित हिन्दी शब्द।
- source_word: μέθυσος
  choice: शराबी
  rationale: यह केवल तत्कालीन नशे की दशा नहीं, बल्कि मद्यपान की चरित्रगत आदत बताता है।
- source_word: μεταπαιδεύεται
  choice: फिर से प्रशिक्षित किया जाता है
  rationale: क्रिया में दोबारा शिक्षा या प्रशिक्षण देकर व्यवहार बदलने का भाव है।
- source_word: δῆλον
  choice: स्पष्ट
  rationale: प्रमाणित या प्रत्यक्ष होने का स्वाभाविक हिन्दी समतुल्य।
- source_word: κύριός ἐστιν
  choice: शासन करती है
  rationale: यहाँ आशय अधिकार और नियंत्रण से है, किसी ईश्वरीय उपाधि से नहीं; हिन्दी में क्रियात्मक रूप अधिक स्वाभाविक है।
- source_word: τῶν παθῶν
  choice: मन के आवेगों पर
  rationale: दार्शनिक संदर्भ में यह मनुष्य को प्रभावित करने वाली प्रबल भावनात्मक और कामनात्मक प्रवृत्तियों को समेटता है।
- source_word: ὁ λογισμός
  choice: बुद्धि
  rationale: यह विचार-विवेक करने और मनुष्य के आचरण का निर्देशन करने वाली तार्किक क्षमता को दर्शाता है।
theological_decisions:
- issue: गैर-ईश्वरीय दार्शनिक संदर्भ में κύριος
  choice: शासन करती है
  alternative: स्वामी है
  rationale: वाक्य बुद्धि के मनोवेगों पर नियंत्रण की बात करता है; यहाँ ‘प्रभु’ जैसी ईश्वरीय उपाधि अभिप्रेत नहीं है।
- issue: πάθη का नैतिक-दार्शनिक अर्थ
  choice: मन के आवेग
  alternative: वासनाएँ; मनोविकार
  rationale: यह चयन शब्द की व्यापकता बनाए रखता है और उसे केवल कामेच्छा या रोगात्मक भावों तक सीमित नहीं करता।
- issue: τις का सामान्य मानवीय उदाहरण
  choice: जो मनुष्य
  alternative: जो व्यक्ति; कोई पुरुष
  rationale: यूनानी में उदाहरण सामान्य है; ‘मनुष्य’ प्रतिनिधिक मानवीय अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है, बिना उसे केवल पुरुषों तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। आलंकारिक प्रश्न, प्रशिक्षण का शैक्षिक भाव और बुद्धि तथा आवेगों के बीच दार्शनिक तनाव सुरक्षित हैं।
