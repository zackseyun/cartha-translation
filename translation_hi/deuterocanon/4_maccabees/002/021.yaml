translation:
  language: hi
  text: क्योंकि जब परमेश्वर ने मनुष्य की रचना की, तब उसने उसमें भावात्मक आवेग और स्वभावगत प्रवृत्तियाँ रोप दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁπηνίκα
  choice: जब
  rationale: यह भूतकाल की एक निश्चित परिस्थिति बताने वाला कालवाचक संयोजक है; अओरिस्ट क्रियाओं के साथ ‘जब’ स्वाभाविक और सटीक है।
- source_word: κατεσκεύασεν
  choice: रचना की
  rationale: क्रिया जान-बूझकर बनाने या गढ़ने का भाव रखती है। हिन्दी में ‘रचना की’ गरिमापूर्ण और स्वाभाविक है तथा ‘निर्माण किया’ की यांत्रिक ध्वनि से बचती है।
- source_word: τὸν ἄνθρωπον
  choice: मनुष्य
  rationale: एकवचन यहाँ समस्त मानवजाति का प्रतिनिधित्व करता है; ‘मनुष्य’ आधुनिक मानक हिन्दी में इस व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ πάθη
  choice: भावनाएँ
  rationale: दार्शनिक संदर्भ में यह बाहरी दुःखों के बजाय मन के भावात्मक आवेगों को सूचित करता है। ‘भावनाएँ’ सामान्य पाठक के लिए स्पष्ट है, यद्यपि इसमें प्रबल मनोवेग भी सम्मिलित हैं।
- source_word: τὰ ἤθη
  choice: चारित्रिक प्रवृत्तियाँ
  rationale: यह स्वभाव में जमे हुए गुणों, रुझानों या dispositions को दर्शाता है; ‘चारित्रिक प्रवृत्तियाँ’ केवल आदतों या सामाजिक आचरण तक अर्थ को सीमित नहीं करती।
- source_word: περιεφύτευσεν
  choice: उसके भीतर ... रोप दीं
  rationale: यह पौधा रोपने के रूपक द्वारा भीतर स्थापित करने का भाव देता है। हिन्दी वाक्य में ‘भीतर’ अन्तर्निहितता को स्पष्ट करता है और ‘रोप दीं’ मूल रूपक बचाए रखता है।
theological_decisions:
- issue: मनुष्य की रचना में भावनाओं और चारित्रिक प्रवृत्तियों की परमेश्वर-प्रदत्त स्थिति
  choice: सीधे कहा गया है कि परमेश्वर ने इन्हें मनुष्य के भीतर रोपा।
  alternative: इन्हें केवल तटस्थ क्षमताएँ या बाद में विकसित हुए गुण बताना।
  rationale: यूनानी पाठ स्वयं πάθη और ἤθη को περιεφύτευσεν का कर्म बनाता है। इसलिए कथन के धर्मवैज्ञानिक तनाव को नरम किए बिना बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और दार्शनिक संदर्भ के अनुकूल रूप। ‘रचना की’ और ‘रोप दीं’ मूल की निर्माण तथा रोपण-संबंधी छवियों को स्वाभाविक हिन्दी में रखते हैं।
