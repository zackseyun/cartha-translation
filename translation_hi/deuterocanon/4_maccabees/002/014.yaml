translation:
  language: hi
  text: और न वह शत्रुओं के लगाए हुए पेड़-पौधों को काटता है, बल्कि शत्रुओं की वस्तुओं को उन लोगों के लिए सुरक्षित रखता है जिन्होंने उन्हें खो दिया है[a], और जो गिरा हुआ है उसे उठाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिन्होंने उन्हें नष्ट किया है।’ यूनानी सक्रिय कृदन्त का निहित कर्म स्पष्ट नहीं है। ‘जो नष्ट हो गए हैं’ के लिए मूल में अपेक्षित मध्यम/कर्मवाच्य रूप नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: और न
  rationale: यह पिछले निषेध से जुड़े एक और आचरण का वर्णन करता है; ‘और न’ हिन्दी में इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: δενδροτομῶν
  choice: पेड़-पौधों को काटता है
  rationale: क्रिया पेड़ या लकड़ी काटने को सूचित करती है। आगे φυτά के व्यापक अर्थ को देखते हुए संयुक्त अभिव्यक्ति रखी गई है।
- source_word: τὰ ἥμερα ... φυτά
  choice: लगाए हुए पेड़-पौधे
  rationale: ἥμερα का आशय जंगली के विपरीत मनुष्य द्वारा उगाए या सँवारे गए पौधों से है। ‘लगाए हुए’ सामान्य पाठक के लिए स्वाभाविक है और केवल फलदार वृक्षों तक अर्थ को सीमित नहीं करता।
- source_word: τῶν πολεμίων
  choice: शत्रुओं के
  rationale: यह सीधा संबंधकारक है, जो इन पेड़-पौधों को शत्रुओं से संबद्ध करता है।
- source_word: τὰ δὲ τῶν ἐχθρῶν
  choice: बल्कि शत्रुओं की ... वस्तुओं को
  rationale: δέ पहले व्यवहार के विपरीत दूसरा व्यवहार प्रस्तुत करता है। नपुंसक बहुवचन τὰ को हिन्दी में प्रसंगानुकूल ‘वस्तुओं’ से स्पष्ट किया गया है।
- source_word: τοῖς ἀπολέσασιν
  choice: खोई हुई ... उनके लिए
  rationale: ἀπολέσασιν सक्रिय कृदन्त है और यहाँ स्वाभाविक रूप से ‘जिन्होंने उन्हें खो दिया’ का अर्थ देता है। हिन्दी में पुनरुक्ति से बचते हुए खोई हुई वस्तुओं को उन्हीं शत्रुओं के लिए सुरक्षित रखने का संबंध व्यक्त किया गया है।
- source_word: διασώζων
  choice: सुरक्षित रखता है
  rationale: क्रिया किसी वस्तु को नष्ट होने से बचाकर सलामत रखने का भाव देती है।
- source_word: τὰ πεπτωκότα
  choice: जो गिर पड़े हैं
  rationale: मूल में यह संज्ञीकृत पूर्ण कृदन्त व्यापक और कुछ अस्पष्ट है। हिन्दी में उसकी व्यक्ति/जीव/वस्तु संबंधी अनिश्चितता को यथासंभव खुला रखा गया है।
- source_word: συνεγείρων
  choice: उठाने में हाथ बँटाता है
  rationale: συν- उपसर्ग साथ मिलकर उठाने का भाव दे सकता है; यह हिन्दी अभिव्यक्ति उस सहयोगात्मक अर्थ को स्वाभाविक रूप से प्रकट करती है।
theological_decisions:
- issue: शत्रु की संपत्ति के प्रति नैतिक आचरण
  choice: पद को शत्रुओं की लगाई वनस्पति नष्ट न करने, उनकी खोई वस्तुएँ सुरक्षित रखने और गिरे हुओं को उठाने में सहायता करने के रूप में अनूदित किया गया है।
  alternative: τοῖς ἀπολέσασιν को ‘जो नष्ट हो गए हैं’ मानकर शत्रुओं की वस्तुएँ उनके नष्ट हो चुके स्वामियों के बाद भी बचाए रखने का अर्थ देना।
  rationale: सक्रिय रूप ἀπολέσασιν यहाँ ‘जिन्होंने खो दिया’ के अर्थ का अधिक सीधे समर्थन करता है। वाक्य में शत्रु की खोई संपत्ति बचाने और गिरे हुए को उठाने का नैतिक समानांतर भी बनता है; ‘नष्ट हो चुके स्वामी’ जोड़ना मूल में निहित संबंध को अनावश्यक रूप से निश्चित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य पूर्ववर्ती प्रसंग से जुड़ा होने के कारण ‘और न’ से आरंभ होता है। ‘जो गिर पड़े हैं’ में मूल की व्यापकता बनाए रखी गई है, जबकि συνεγείρων के συν-भाव को ‘हाथ बँटाता है’ से व्यक्त किया गया है।
