  text: And yet, when the law tells us not to desire, I could much more persuade you that reason is able to master desires, just as it also masters the passions that hinder righteousness.
translation:
  language: hi
  text: फिर भी, जब व्यवस्था ने हमें लालसा न करने की आज्ञा दी है, तो मैं आपको और भी अधिक समझा सकता हूँ कि विवेक लालसाओं पर नियंत्रण रख सकता है, जैसे वह धार्मिकता में बाधक आवेगों पर भी नियंत्रण रख सकता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: यह मूसा की व्यवस्था के लिए प्रचलित और संदर्भानुकूल हिन्दी पद है।
- source_word: ἐπιθυμεῖν / ἐπιθυμιῶν
  choice: लालसा करना / लालसाएँ
  rationale: यहाँ निषिद्ध इच्छा का भाव है; समान मूल वाले यूनानी शब्दों की पुनरावृत्ति हिन्दी में भी सुरक्षित रखी गई है।
- source_word: ὁ λογισμός
  choice: विवेक
  rationale: ग्रंथ के दार्शनिक संदर्भ में यह तर्कशील विचार-शक्ति को दर्शाता है; ‘विवेक’ साधारण पाठक के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: κρατεῖν
  choice: नियंत्रण रखना
  rationale: इसका अर्थ वश में रखना या प्रभुत्व रखना है; चुना गया रूप क्षमता और आत्मसंयम दोनों को स्पष्ट करता है।
- source_word: παθῶν
  choice: आवेगों
  rationale: यह केवल भावनाओं तक सीमित नहीं, बल्कि मनुष्य को प्रभावित करने वाले प्रबल मनोवेगों का द्योतक है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: नैतिक सहीपन और धर्मसम्मत आचरण, दोनों का पारंपरिक बाइबलीय अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: λογισμός की नैतिक क्षमता
  choice: ‘विवेक ... नियंत्रण रख सकता है’ के रूप में लेखक का दावा यथावत रखा गया
  alternative: इसे परमेश्वर-प्रदत्त विवेक या अनुग्रह से समर्थित विवेक कहना
  rationale: यूनानी पाठ इस वाक्य में क्षमता का दावा करता है, पर उसका स्रोत स्पष्ट नहीं करता; इसलिए अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
- issue: व्यवस्था के कथन का काल
  choice: ‘व्यवस्था ने ... कहा है’
  alternative: ‘व्यवस्था कहती है’
  rationale: εἴρηκεν पूर्णकाल है और पूर्व में कही गई आज्ञा की वर्तमान वैधता का संकेत देता है; हिन्दी पूर्णकाल इसे स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। यूनानी वाक्य की तर्कपूर्ण संरचना तथा ‘लालसा’ की शब्दगत पुनरावृत्ति सुरक्षित रखी गई है।
