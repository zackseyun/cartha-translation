translation:
  language: hi
  text: 'और वह बच्चों के प्रति प्रेम को भी अपने वश में रखता है[a] और उनकी दुष्टता के कारण उन्हें दण्ड देता है; वह मित्रों से लगाव पर भी प्रभुत्व रखता है और बुराई के कारण उन्हें फटकारता है।


    [a] शाब्दिक रूप से, “बच्चों का प्रेम” और “मित्रों की घनिष्ठ संगति”; यहाँ आशय अपने बच्चों और मित्रों के प्रति स्नेह या लगाव से है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बच्चों का प्रेम” और “मित्रों की घनिष्ठ संगति”; यहाँ आशय अपने बच्चों और मित्रों के प्रति स्नेह या लगाव से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κυριεύει
  choice: नियंत्रण रखता है
  rationale: क्रिया प्रभुता या वश रखने का प्रबल भाव व्यक्त करती है। हिंदी में यह प्रयोग स्वाभाविक है और प्राकृतिक स्नेह पर संयम के अधिकार को स्पष्ट करता है।
- source_word: τῆς τέκνων φιλίας
  choice: बच्चों के प्रति प्रेम
  rationale: यूनानी संबंधकारक पदबंध का आशय बच्चों की ओर निर्देशित, विशेषतः अपनी संतान के प्रति, प्रेम है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: διὰ κακίαν αὐτῶν
  choice: उनकी दुष्टता के कारण
  rationale: διὰ के साथ कर्मकारक यहाँ कारण बताता है; κακία नैतिक बुराई या दुष्टता को सूचित करता है।
- source_word: κολάζων
  choice: दण्ड देता है
  rationale: यह कृदन्त बच्चों के अनुचित आचरण के प्रत्युत्तर में दण्ड देने की क्रिया बताता है; इसे केवल सुधारने के अर्थ तक नरम नहीं किया गया।
- source_word: τῆς φίλων συνηθείας
  choice: मित्रों से लगाव
  rationale: συνήθεια आदतन संगति, घनिष्ठ परिचय और उससे उत्पन्न संबंध या लगाव को सूचित कर सकता है। 'लगाव' इस प्रसंग में संबंधात्मक शक्ति को सहज हिंदी में व्यक्त करता है।
- source_word: δεσπόζει
  choice: अधिकार रखता है
  rationale: यह κυριεύει के समानांतर प्रभुता और नियंत्रण का भाव रखता है। अलग किंतु निकटार्थी हिंदी पदावली यूनानी समानांतरता को बनाए रखती है।
- source_word: διὰ πονηρίας
  choice: उनकी बुराई के कारण
  rationale: पद में सर्वनाम व्यक्त नहीं है, पर बहुवचन αὐτούς और मित्रों का निकट संदर्भ हिंदी में 'उनकी' को स्वाभाविक बनाता है। πονηρία नैतिक बुराई को दर्शाता है।
- source_word: ἐξελέγχων
  choice: फटकारता है
  rationale: क्रिया दोष सिद्ध करने, गलत काम उजागर करने या धिक्कारने का अर्थ दे सकती है। व्यक्तियों को उनके बुरे आचरण के लिए संबोधित करने के इस प्रसंग में 'फटकारता है' उपयुक्त है, जबकि न्यायालय-संबंधी अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: क्रियाओं का अव्यक्त कर्ता
  choice: मुख्य पाठ में संदर्भगत कर्ता को केवल 'वह' कहा गया है।
  alternative: इस पद में कर्ता को स्पष्ट रूप से 'विवेकपूर्ण संयम' या 'विवेक' कहना।
  rationale: यूनानी पद में कर्ता-संज्ञा दोहराई नहीं गई है; वह आसपास के तर्क से समझी जाती है। 'वह' मूल की व्याकरणिक अपूर्णता और संदर्भ-निर्भरता को बनाए रखता है तथा किसी व्याख्यात्मक संज्ञा को पद में नहीं जोड़ता।
- issue: प्राकृतिक स्नेह पर प्रभुता का स्वरूप
  choice: पाठ इसे बच्चों या मित्रों के प्रति प्रेम के उन्मूलन के रूप में नहीं, बल्कि उस लगाव पर नियंत्रण के रूप में प्रस्तुत करता है।
  alternative: यह समझना कि पद प्राकृतिक प्रेम को अपने आप में बुरा ठहराता है।
  rationale: दण्ड और फटकार का कारण बच्चों तथा मित्रों की दुष्टता या बुराई है, स्वयं प्रेम नहीं। इसलिए अनुवाद नियंत्रण और नैतिक निर्णय के बीच मूल संबंध बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। 'दण्ड' नैतिक-न्यायिक गंभीरता रखता है, जबकि 'फटकारता है' ἐξελέγχων के दोष दिखाने और भर्त्सना करने वाले भाव को स्वाभाविक ढंग से व्यक्त करता है। समानांतर यूनानी क्रियाओं के लिए 'नियंत्रण रखता है' और 'अधिकार रखता है' चुने गए हैं।
