lexical_decisions:
- source_word: νέος
  choice: जवान
  rationale: यह शब्द उसकी युवावस्था बताता है। ‘जवान’ आधुनिक, सहज और संदर्भानुकूल है।
- source_word: ἀκμάζων
  choice: पूर्ण समर्थ
  rationale: कृदंत अपने उत्कर्ष और पूरे शारीरिक सामर्थ्य में होने का भाव देता है; πρὸς συνουσιασμόν के साथ यह यौन-सामर्थ्य की ओर संकेत करता है।
- source_word: πρὸς συνουσιασμόν
  choice: संभोग के लिए
  rationale: इस प्रसंग में συνουσιασμός साथ रहने के बजाय यौन-संबंध को सूचित करता है। ‘संभोग’ स्पष्ट, गरिमापूर्ण और प्रचलित शब्द है।
- source_word: ἠκύρωσεν
  choice: निष्प्रभावी कर दिया
  rationale: क्रिया किसी वस्तु को अमान्य, विफल या प्रभावहीन कर देने का भाव रखती है। यहाँ नैतिक आवेग पर निर्णायक नियंत्रण के लिए ‘निष्प्रभावी कर दिया’ स्वाभाविक है।
- source_word: τῷ λογισμῷ
  choice: विवेक के द्वारा
  rationale: λόγισμος इस पुस्तक का प्रमुख नैतिक-दार्शनिक पद है, जो विचारशील विवेक द्वारा वासनाओं पर शासन को व्यक्त करता है।
- source_word: οἶστρον
  choice: उकसाहट
  rationale: शब्द डंक, अंकुश, तीव्र प्रेरणा या उन्मत्त आवेग का रूपक व्यक्त कर सकता है। ‘उकसाहट’ उसके प्रेरक बल को सहज हिन्दी में रखती है, जबकि रूपक के विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: τῶν παθῶν
  choice: वासनाओं की
  rationale: इस रचना में πάθη उन प्रबल कामनाओं और आवेगों के लिए आता है जिन पर विवेक शासन करता है। ‘वासनाएँ’ इस यौन संदर्भ और नैतिक शब्दावली दोनों के अनुकूल है।
theological_decisions:
- issue: λόγισμος को इस प्रकार प्रस्तुत करना कि 4 मक्काबियों में वासनाओं पर उसके शासन का मुख्य विषय बना रहे
  choice: विवेक
  alternative: तर्क-बुद्धि
  rationale: ‘विवेक’ सामान्य पाठक के लिए सहज है और विचारपूर्वक सही निर्णय करने तथा आवेगों को नियंत्रित करने की क्षमता व्यक्त करता है; यह किसी बाद की विशिष्ट दार्शनिक या संप्रदायगत परिभाषा को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण रखी गई है। ‘संभोग’ मूल के यौन आशय को बिना अनावश्यक व्यंजना के स्पष्ट करता है। पादटिप्पणी-चिह्न को οἶστρον के अनुवाद ‘उकसाहट’ पर रखा गया है, क्योंकि विकल्प उसी यूनानी शब्द से संबंधित हैं।
