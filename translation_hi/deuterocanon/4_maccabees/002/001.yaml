translation:
  language: hi
  text: और इसमें क्या आश्चर्य है कि सौंदर्य में सहभागिता के संबंध में आत्मा की इच्छाएँ निष्प्रभावी कर दी जाती हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो सुंदर है उसमें सहभागी होने के संबंध में।” यूनानी वाक्यांश अमूर्त है और इसे अधिक स्पष्ट रूप में भी व्यक्त किया जा सकता है।
    reason: κάλλος और μετουσία के वैकल्पिक, अधिक ठोस अनुवाद को दर्ज करना तथा मूल की अमूर्तता और संभावित अर्थ-भेद को सुरक्षित रखना।
lexical_decisions:
- source_word: τί θαυμαστόν
  choice: इसमें क्या आश्चर्य है
  rationale: यूनानी आलंकारिक प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और उसके आश्चर्यसूचक बल को बनाए रखता है।
- source_word: ἐπιθυμίαι
  choice: इच्छाएँ
  rationale: यह व्यापक और अपेक्षाकृत तटस्थ शब्द है; ‘वासना’ अनावश्यक रूप से नैतिक या शारीरिक अर्थ जोड़ देती।
- source_word: ψυχῆς
  choice: आत्मा की
  rationale: इस हेलेनवादी दार्शनिक-यहूदी संदर्भ में ψυχή के मानव-स्वभाव संबंधी अर्थ को सुरक्षित रखता है; ‘मन’ इसका अर्थ बहुत संकीर्ण कर देता।
- source_word: πρὸς
  choice: के संबंध में
  rationale: यहाँ πρὸς इच्छाओं के निष्प्रभावी किए जाने को सौंदर्य में सहभागिता से जोड़ता है। यह चयन संबंध को बनाए रखता है, पर उसकी दिशा को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: τοῦ κάλλους
  choice: सौंदर्य
  rationale: यूनानी अमूर्त संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप है; ‘नैतिक उत्कृष्टता’ जैसा अर्थ मूल से अधिक व्याख्या जोड़ता।
- source_word: μετουσίαν
  choice: सहभागिता
  rationale: दार्शनिक अमूर्तता और किसी वस्तु में भाग लेने या साझा होने के भाव को बनाए रखता है।
- source_word: ἀκυροῦνται
  choice: निष्प्रभावी कर दी जाती हैं
  rationale: निष्क्रिय क्रिया का यह रूप इच्छाओं के प्रभाव या बल को विफल किए जाने का अर्थ स्पष्ट करता है; ‘रद्द’ इस संदर्भ में अत्यधिक कानूनी सुनाई देता।
theological_decisions:
- issue: दार्शनिक-यहूदी संदर्भ में ψυχή का मानव-स्वभाव संबंधी अर्थ
  choice: आत्मा
  alternative: मन; भीतरी व्यक्तित्व; जीवन
  rationale: यह पुस्तक बुद्धि और अभिलाषाओं के संबंध पर विचार करती है। ‘आत्मा’ उस वैचारिक संसार को बनाए रखता है और पाठ को केवल आधुनिक मनोविज्ञान की भाषा में सीमित नहीं करता।
- issue: κάλλος का अमूर्त नैतिक-सौंदर्यात्मक अर्थ
  choice: सौंदर्य
  alternative: जो सुंदर है; श्रेष्ठता
  rationale: मूल पाठ सीधे ‘सौंदर्य’ कहता है। प्रसंग में नैतिक सुंदरता का संकेत संभव है, किंतु मुख्य पाठ में उसे निश्चित कर देना मूल की अर्थगत खुलावट को मिटा देगा।
- issue: ἀκυροῦνται की शक्ति
  choice: निष्प्रभावी कर दी जाती हैं
  alternative: निरस्त कर दी जाती हैं; विफल हो जाती हैं
  rationale: यह अनुवाद निष्क्रिय रूप और इच्छाओं के प्रभावहीन किए जाने दोनों को सुरक्षित रखता है, बिना यह तय किए कि वे पूर्णतः मिट जाती हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘सहभागिता’ दार्शनिक अमूर्तता को बनाए रखती है, जबकि ‘निष्प्रभावी कर दी जाती हैं’ अत्यधिक संस्कृतनिष्ठ या कानूनी अभिव्यक्ति से बचते हुए यूनानी निष्क्रिय क्रिया का बल व्यक्त करता है।
