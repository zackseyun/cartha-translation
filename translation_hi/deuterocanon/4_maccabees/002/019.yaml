review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Jacob, Simeon and Levi, the Shechemites, the collective character of the killing, and the Genesis quotation. However, ‘क्योंकि ... क्यों’ is not idiomatic Hindi for ἐπεὶ διὰ τί; ‘बल्कि’ introduces an unsupported contrast; and ‘शिमोन और लेवी के साथियों’ can exclude Simeon and Levi themselves, whereas τοὺς περὶ Συμεὼν καὶ Λευεὶν denotes them together with their party.
  naturalness: The sentence is understandable but syntactically strained. ‘तो फिर ... क्यों’ supplies a natural explanatory rhetorical question, and recasting the participial phrase yields clear modern Hindi without resolving the compressed Greek beyond what the syntax supports.
  terminology: ‘परम बुद्धिमान पूर्वज याकूब,’ ‘शकेमवासी,’ and ‘क्रोध शापित हो’ are appropriate. ‘संहार किया’ better represents the force of ἀποσφάξαντας than the comparatively weak ‘मार डाला था.’ ‘विवेक से नहीं’ retains the ambiguity and proximity of μὴ λογισμῷ to the killing.
  issues:
  - severity: medium
    issue: The phrase ‘शिमोन और लेवी के साथियों’ may exclude Simeon and Levi.
    rationale: The περί construction normally encompasses the named persons and those associated with them. Hindi should explicitly include both the brothers and their group.
  - severity: medium
    issue: ‘बल्कि’ adds a contrast not present in the Greek.
    rationale: μὴ λογισμῷ qualifies the slaughter; it is not contrasted with the fact that the Shechemites were killed collectively.
  - severity: medium
    issue: ‘क्योंकि ... क्यों’ is unnatural Hindi.
    rationale: Though intended to preserve both ἐπεί and διὰ τί, it is not a natural rhetorical-question construction in modern standard Hindi.
  revised_text: तो फिर हमारे परम बुद्धिमान पूर्वज याकूब शिमोन और लेवी तथा उनके साथियों को दोष क्यों देते हैं, जिन्होंने शकेमवासियों का विवेक से नहीं, एक पूरे जनसमूह के रूप में, संहार किया था, यह कहते हुए,[a] “उनका क्रोध शापित हो!”
  revised_footnotes:
  - marker: a
    text: यह कथन उत्पत्ति 49:7 की प्रतिध्वनि है।
    reason: cross_reference
  revision_rationale: The revision preserves the explanatory force of ἐπεί in idiomatic Hindi (‘तो फिर’), represents the περί group inclusively, and attaches ‘विवेक से नहीं’ directly to the collective slaughter without importing a contrast. ‘संहार किया’ conveys the strong violence of ἀποσφάξαντας while ‘एक पूरे जनसमूह के रूप में’ retains ἐθνηδόν.
