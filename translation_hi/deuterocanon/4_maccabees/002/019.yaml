revisions:
- from: क्योंकि हमारे परम बुद्धिमान पूर्वज याकूब शिमोन और लेवी के साथियों को दोष क्यों देते हैं, जिन्होंने विवेक के अनुसार नहीं, बल्कि शकेमवासियों को पूरे समुदाय के रूप में मार डाला था? वे कहते हैं,[a] “उनका क्रोध शापित हो!”
  to: तो फिर हमारे परम बुद्धिमान पूर्वज याकूब शिमोन और लेवी तथा उनके साथियों को दोष क्यों देते हैं, जिन्होंने शकेमवासियों का विवेक से नहीं, एक पूरे जनसमूह के रूप में, संहार किया था, यह कहते हुए,[a] “उनका क्रोध शापित हो!”
  rationale: The revision preserves the explanatory force of ἐπεί in idiomatic Hindi (‘तो फिर’), represents the περί group inclusively, and attaches ‘विवेक से नहीं’ directly to the collective slaughter without importing a contrast. ‘संहार किया’ conveys the strong violence of ἀποσφάξαντας while ‘एक पूरे जनसमूह के रूप में’ retains ἐθνηδόν.
  reviewer_model: gpt-5.6-terra
