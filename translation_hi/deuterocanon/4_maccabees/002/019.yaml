base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/019.yaml
  text: For why does our all-wise father Jacob blame those around Simeon and Levi for slaughtering the Shechemites en masse[a], not with reason, saying[b], “Cursed be their anger”?
translation:
  language: hi
  text: तो फिर हमारे परम बुद्धिमान पूर्वज याकूब शिमोन और लेवी तथा उनके साथियों को दोष क्यों देते हैं, जिन्होंने शकेमवासियों का विवेक से नहीं, एक पूरे जनसमूह के रूप में, संहार किया था, यह कहते हुए,[a] “उनका क्रोध शापित हो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन उत्पत्ति 49:7 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπεὶ διὰ τί
  choice: क्योंकि ... क्यों
  rationale: यह पिछले तर्क से जुड़ा कारणसूचक आलंकारिक प्रश्न है। हिन्दी में ‘क्योंकि ... क्यों’ कुछ पुनरुक्तिपूर्ण होते हुए भी ἐπεί के संबंधसूचक और διὰ τί के प्रश्नात्मक, दोनों बलों को बनाए रखता है।
- source_word: ὁ πάνσοφος ἡμῶν πατὴρ Ἰακώβ
  choice: हमारे परम बुद्धिमान पूर्वज याकूब
  rationale: πάνσοφος की उत्कट प्रशंसात्मकता के लिए ‘परम बुद्धिमान’ स्वाभाविक और गरिमापूर्ण है। πατήρ यहाँ वंशगत पूर्वज के अर्थ में है, इसलिए ‘पूर्वज’ आधुनिक पाठक के लिए अधिक स्पष्ट है।
- source_word: τοὺς περὶ Συμεὼν καὶ Λευεὶν
  choice: शिमोन और लेवी के साथियों को
  rationale: οἱ περὶ किसी व्यक्ति और उसके साथ जुड़े दल को सूचित कर सकता है। ‘साथियों’ से समूह का भाव आता है, पर उसकी ठीक सदस्यता अनावश्यक रूप से निश्चित नहीं होती।
- source_word: αἰτιᾶται
  choice: दोष देते हैं
  rationale: यहाँ क्रिया निंदा या दोषारोपण व्यक्त करती है; ‘दोष देना’ सरल, वर्तमान और प्रसंगानुकूल है।
- source_word: μὴ λογισμῷ
  choice: विवेक के अनुसार नहीं
  rationale: λογισμός इस पुस्तक में तर्कशील विवेक का प्रमुख शब्द है। यह रूप यूनानी की नकारात्मक और संक्षिप्त अभिव्यक्ति को बनाए रखते हुए वध की विवेक-विरुद्ध प्रकृति बताता है।
- source_word: τοὺς Σικιμίτας
  choice: शकेमवासियों को
  rationale: यह शकेम नगर के निवासियों का जातिवाचक नाम है; हिन्दी में स्थाननाम से बना ‘शकेमवासी’ स्पष्ट और स्वाभाविक है।
- source_word: ἐθνηδόν
  choice: पूरे समुदाय के रूप में
  rationale: क्रियाविशेषण सामूहिक रूप से, एक जनसमूह मानकर किए गए वध को दर्शाता है। यह अनुवाद ‘जाति’ के आधुनिक जैविक अर्थ से बचते हुए सामूहिकता बनाए रखता है।
- source_word: ἀποσφάξαντας
  choice: मार डाला था
  rationale: मूल क्रिया हिंसक संहार की प्रबलता रखती है। ‘मार डाला’ सामान्य पाठक के लिए स्वाभाविक है; पूरे समुदाय के संदर्भ से व्यापक संहार का बल स्पष्ट रहता है।
- source_word: Ἐπικατάρατος ὁ θυμὸς αὐτῶν
  choice: उनका क्रोध शापित हो
  rationale: यह उत्पत्ति 49:7 की प्रतिध्वनि है। ‘शापित हो’ विध्यर्थक और तीव्र निंदात्मक बल को बनाए रखता है।
theological_decisions:
- issue: μὴ λογισμῷ का संबंध और याकूब के निर्णय की तर्कसंगतता
  choice: 'वाक्यांश को वध करनेवालों के कृत्य से जोड़ा गया है: उन्होंने ‘विवेक के अनुसार नहीं’ काम किया।'
  alternative: इसे याकूब के दोष देने से जोड़कर ‘याकूब उन्हें अकारण दोष नहीं देते’ समझा जा सकता है।
  rationale: शब्दक्रम में μὴ λογισμῷ सहभागी क्रिया ἀποσφάξαντας के ठीक पहले है और पुस्तक का प्रसंग विवेक के विरुद्ध आवेगपूर्ण हिंसा की निंदा करता है। फिर भी यूनानी वाक्य संक्षिप्त है; वैकल्पिक संबंध को निर्णय-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण रखी गई है। ‘परम बुद्धिमान’ से ऊँची आलंकारिक शैली बनी रहती है, जबकि ‘पूर्वज’, ‘साथी’ और ‘शकेमवासी’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ में यूनानी के संक्षिप्त μὴ λογισμῷ को सहज हिन्दी में व्यक्त किया गया है, बिना किसी संप्रदायगत व्याख्या को जोड़ने के।
