translation:
  language: hi
  text: और वह अपनी पत्नी के प्रति स्नेह पर भी विजय पाता है[a], जब वह व्यवस्था-विरोधी आचरण के कारण उसे ताड़ना देता है।
  philosophy: optimal-equivalence
  footnotes:
