    text: या, “अपनी पत्नी के प्रति प्रेम पर प्रबल होता है।” यूनानी पदबंध विवाह के भीतर स्नेहपूर्ण लगाव को दर्शाता है, और क्रिया का अर्थ “विजय पाना,” “प्रबल होना,” या “अधिकार रखना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικρατεῖ
  choice: नियंत्रण रखता है
  rationale: क्रिया का अर्थ किसी पर प्रबल होना अथवा उस पर अधिकार रखना है। यहाँ यह विवेक द्वारा वैवाहिक स्नेह को वश में रखने के प्रसंग में है; ‘नियंत्रण रखता है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस अर्थ को व्यक्त करता है।
- source_word: τῆς πρὸς γαμετὴν φιλίας
  choice: अपनी पत्नी के प्रति स्नेह
  rationale: γαμετή का अर्थ ‘पत्नी’ और φιλία का अर्थ स्नेहपूर्ण लगाव है। यह पदबंध वैवाहिक आत्मीयता को सूचित करता है, न कि केवल कामना को।
- source_word: διὰ παρανομίαν
  choice: व्यवस्था-विरोधी आचरण के कारण
  rationale: παρανομία व्यवस्था या विधि के विरुद्ध आचरण को दर्शाता है। यह चयन मूल के नैतिक-विधिक बल को बनाए रखता है और हिन्दी में ‘अधर्म’ जैसी व्यापक धार्मिक व्याख्या नहीं जोड़ता।
- source_word: ἀπελέγχων
  choice: दोषी ठहराता है
  rationale: यह कृदन्त किसी की गलती प्रकट करके उसे धिक्कारने या दोष बताने का भाव रखता है। ‘दोषी ठहराता है’ इस प्रसंग में नैतिक प्रतिवाद का भाव स्पष्ट करता है।
- source_word: αὐτήν
  choice: उसे
  rationale: स्त्रीलिंग सर्वनाम का पूर्वपद γαμετήν, अर्थात पत्नी, है। हिन्दी में ‘उसे’ स्वाभाविक है और संदर्भ में स्पष्ट रहता है।
theological_decisions:
- issue: नैतिक व्यवस्था के सामने वैवाहिक स्नेह पर विवेक का शासन
  choice: पद को इस दावे के रूप में प्रस्तुत किया गया है कि व्यवस्था-विरोधी आचरण पर पत्नी को दोषी ठहराते समय व्यक्ति अपने वैवाहिक स्नेह को भी नियंत्रण में रखता है।
  alternative: क्रिया को केवल स्नेह को सीमित या संयमित करने के अपेक्षाकृत दुर्बल अर्थ में लिया जा सकता है।
  rationale: आसपास के तर्क में विवेक के आवेगों और लगावों पर प्रबल होने की बात है। अनुवाद उस प्रबल दावे को रखता है, पर बाद की किसी विशिष्ट धार्मिक शिक्षा को इसमें नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘व्यवस्था-विरोधी आचरण’ मूल के विधिक-नैतिक अर्थ को सुरक्षित रखता है; फुटनोट ἐπικρατεῖ की वास्तविक अर्थगत व्यापकता को दर्शाता है।
