translation:
  language: hi
  text: उदाहरण के लिए, तुममें से कोई भी इच्छा को काटकर अलग नहीं कर सकता; पर तर्क-बुद्धि यह संभव कर सकती है कि वह इच्छा का दास न बने।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷον
  choice: उदाहरण के लिए
  rationale: यह पद पिछले तर्क को स्पष्ट करने के लिए एक उदाहरण प्रस्तुत करता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐπιθυμίαν / τῇ ἐπιθυμίᾳ
  choice: इच्छा / इच्छा के
  rationale: दोनों स्थानों पर एक ही यूनानी शब्द का प्रयोग हुआ है। ‘इच्छा’ उसके व्यापक अर्थ को बनाए रखता है; ‘लालसा’ या ‘वासना’ अर्थ को अनावश्यक रूप से तीव्र या संकीर्ण कर देती।
- source_word: τις ὑμῶν
  choice: तुममें से कोई भी
  rationale: यूनानी पाठ में पहले खंड का कर्ता ‘तुममें से कोई’ है, न कि ‘तर्क-बुद्धि’। नकार के साथ यह स्वाभाविक हिन्दी में ‘तुममें से कोई भी ... नहीं’ बनता है।
- source_word: ἐκκόψαι
  choice: काटकर अलग करना
  rationale: यह चयन यूनानी क्रिया के सजीव काटने के रूपक को सुरक्षित रखता है, जबकि केवल ‘मिटाना’ उस बिंब को खो देता।
- source_word: δουλωθῆναι
  choice: दास बनना
  rationale: निष्क्रिय क्रिया में दासता का रूपक स्पष्ट है; ‘वश में होना’ इसे अनावश्यक रूप से नरम कर देता।
- source_word: ὁ λογισμός
  choice: तर्क-बुद्धि
  rationale: यह 4 मकाबियों का प्रमुख दार्शनिक शब्द है और मनुष्य की तर्क करने तथा निर्णय लेने वाली क्षमता को दर्शाता है। ‘विवेक’ अधिक सहज होता, पर वह नैतिक अंतःकरण का अतिरिक्त भाव ला सकता है।
- source_word: παρασχέσθαι
  choice: यह संभव कर सकती है
  rationale: क्रिया यहाँ किसी अवस्था को उपलब्ध कराने या संभव बनाने का भाव देती है; हिन्दी अभिव्यक्ति मूल वाक्य की क्षमता-संबंधी बात को स्पष्ट रखती है।
theological_decisions:
- issue: इच्छा और तर्क-बुद्धि के संबंध में मानव-स्वभाव का दावा
  choice: मनुष्य इच्छा को स्वयं समाप्त नहीं कर सकता, पर तर्क-बुद्धि उसे इच्छा का दास न बनने में समर्थ बना सकती है।
  alternative: तर्क-बुद्धि स्वयं इच्छा को काट नहीं सकती, पर वह इच्छा की अधीनता से बचा सकती है।
  rationale: यूनानी में पहले खंड का कर्ता τις ὑμῶν (‘तुममें से कोई’) और दूसरे का कर्ता ὁ λογισμός (‘तर्क-बुद्धि’) है। अनुवाद इस व्याकरणिक भेद और इच्छा के उन्मूलन तथा उस पर शासन करने के बीच के दार्शनिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘तर्क-बुद्धि’ दार्शनिक पदावली को बनाए रखता है, और ‘काटकर अलग करना’ मूल रूपक को स्वाभाविक हिन्दी में व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ के विपरीत पहले खंड में ‘तर्क-बुद्धि’ को कर्ता नहीं बनाया गया, क्योंकि मूल यूनानी स्पष्ट रूप से ‘तुममें से कोई’ कहता है।
