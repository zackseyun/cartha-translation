  yaml_path: translation/deuterocanon/4_maccabees/003/003.yaml
  text: No one can cut anger out of your soul[a], but it is possible to help with anger.
translation:
  language: hi
  text: तुम में से कोई भी अपने मन से क्रोध को काटकर निकाल नहीं सकता, पर क्रोध की सहायता करना संभव है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक व्याख्यात्मक अनुवाद हो सकता है: “क्रोध का उपयोग करना संभव है” या “क्रोध को अच्छे उद्देश्य की ओर मोड़ा जा सकता है।” यूनानी में शाब्दिक रूप से “क्रोध की सहायता करना” है।'
    reason: अंतिम यूनानी वाक्यांश की असामान्य भाषा और उसके संभावित अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: θυμόν / τῷ θυμῷ
  choice: क्रोध
  rationale: θύμος यहाँ क्रोध या उग्र भावावेग को दर्शाता है। दोनों बार एक ही शब्द ‘क्रोध’ रखने से यूनानी की पुनरावृत्ति और नैतिक-मनोवैज्ञानिक संदर्भ सुरक्षित रहते हैं।
- source_word: ἐκκόψαι
  choice: काटकर निकालना
  rationale: ἐκκόπτω का मूल बिंब काटकर अलग करने का है। ‘काटकर निकालना’ केवल ‘दूर करना’ की अपेक्षा इस सजीव रूपक को अधिक स्पष्टता से बनाए रखता है।
- source_word: ψυχῆς
  choice: मन
  rationale: ψυχή यहाँ व्यक्ति के भीतरी भाव-जगत का संकेत करती है। आधुनिक हिन्दी में ‘मन’ इस नैतिक-मनोवैज्ञानिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; ‘आत्मा’ इस संदर्भ में अनावश्यक रूप से आध्यात्मिक या पारिभाषिक अर्थ ग्रहण कर सकती है।
- source_word: δυνατὸν βοηθῆσαι
  choice: सहायता करना संभव है
  rationale: वाक्यांश की शाब्दिक और जानबूझकर चौंकाने वाली भाषा को रखा गया है। इससे यूनानी पाठ की अस्पष्टता बनी रहती है और अर्थ को ‘नियंत्रित करना’ या ‘सदुपयोग करना’ कहकर पहले से तय नहीं किया जाता।
theological_decisions:
- issue: अंतिम वाक्यांश τῷ θυμῷ δυνατὸν βοηθῆσαι का अर्थ
  choice: ‘क्रोध की सहायता करना संभव है’ के निकट-शाब्दिक और विरोधाभासी कथन को बनाए रखना
  alternative: ‘क्रोध का सदुपयोग करना संभव है,’ ‘क्रोध को अच्छे उद्देश्य की ओर मोड़ा जा सकता है,’ या ‘क्रोध को नियंत्रित किया जा सकता है’
  rationale: यूनानी कथन संक्षिप्त और असामान्य है। अधिक सहज व्याख्यात्मक अनुवाद अध्याय के व्यापक तर्क से कोई एक निष्कर्ष पाठ में जोड़ देगा। मुख्य पाठ में तनाव बनाए रखकर संभावित आशय को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘तुम में से कोई भी’ बहुवचन ὑμῶν को व्यक्त करता है, जबकि ‘अपने मन से’ हिन्दी में प्रत्येक संबोधित व्यक्ति के भीतरी जीवन का स्वाभाविक बोध कराता है।
