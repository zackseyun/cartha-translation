- source_word: λαθόντες
  choice: नज़र से बचकर
  rationale: यह क्रिया किसी व्यक्ति को पता चले बिना निकल जाने का भाव देती है; यह हिंदी प्रयोग उस अर्थ को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: τοὺς τῶν πυλῶν ἀκροφύλακας
  choice: फाटकों के पहरेदारों
  rationale: यह पद फाटकों पर तैनात चौकसी करनेवाले रक्षकों को सूचित करता है।
- source_word: διεξῄεσαν
  choice: आगे बढ़ते गए
  rationale: अपूर्ण भूतकाल निरंतर जारी गति का संकेत देता है; ‘बढ़ते गए’ उस प्रगतिशील भाव को सुरक्षित रखता है।
- source_word: εὑράμενοι
  choice: रास्ता बनाते हुए
  rationale: यूनानी में शाब्दिक अर्थ ‘पाकर/ढूँढ़कर’ है, पर उसका कर्म व्यक्त नहीं है। प्रसंग में छावनी से होकर निकलने का मार्ग पाने या बनाने का भाव है; हिंदी में ‘रास्ता बनाते हुए’ स्वाभाविक है, जबकि संक्षिप्त मूल वाक्य की अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: κατὰ πᾶν τὸ τῶν πολεμίων στρατόπεδον
  choice: शत्रुओं की पूरी छावनी में से
  rationale: κατά के स्थानगत भाव और πᾶν की व्यापकता को ‘पूरी ... में से’ व्यक्त करता है; बहुवचन ‘शत्रुओं’ मूल τῶν πολεμίων के रूप को बनाए रखता है।
