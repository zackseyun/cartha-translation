lexical_decisions:
- source_word: τότε δὴ γενομένης ἑσπέρας
  choice: तब जब शाम हो गई
  rationale: γενομένης ἑσπέρας समयसूचक संबंधवाचक स्वतंत्र पदबंध है; यह शाम हो चुकने की परिस्थिति बताता है। δὴ को अलग से भारी बल दिए बिना ‘तब’ में प्रसंगानुकूल रूप से समाहित किया गया है।
- source_word: ἱδρῶν
  choice: पसीने से लथपथ
  rationale: वर्तमान कृदन्त आगमन के समय उसकी शारीरिक दशा बताता है; यह स्वाभाविक और सजीव हिन्दी है।
- source_word: σφόδρα κεκμηκώς
  choice: अत्यन्त थका हुआ
  rationale: σφόδρα तीव्रता बताता है और पूर्ण कृदन्त κεκμηκώς परिश्रम से उत्पन्न बनी हुई थकान की दशा व्यक्त करता है।
- source_word: ἐπὶ τὴν βασίλειον σκηνήν
  choice: राजकीय तम्बू के पास
  rationale: βασίλειος का सीधा अर्थ ‘राजकीय’ है और σκηνή सैन्य प्रसंग में ‘तम्बू’; ἐπί + कर्मकारक यहाँ गमन के लक्ष्य तक या उसके निकट पहुँचने को व्यक्त कर सकता है।
- source_word: περὶ ἣν
  choice: जिसके चारों ओर
  rationale: περί का स्थानवाचक अर्थ तम्बू को घेरे हुए छावनी के दृश्य को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁ πᾶς τῶν προγόνων στρατός
  choice: उसके पूर्वजों की सारी सेना
  rationale: यूनानी पदबंध संक्षिप्त है। ‘पूर्वजों’ προγόνων के वंश-संबंधी अर्थ को बिना किसी ऐतिहासिक पहचान को जोड़े बनाए रखता है; हिन्दी में प्रसंगगत ‘उसके’ आवश्यक स्पष्टता देता है।
- source_word: ἐστρατοπέδευκεν
  choice: ने पड़ाव डाला था
  rationale: क्रिया का पूर्णकालिक रूप आगमन से पहले स्थापित छावनी की परिणामी स्थिति दिखाता है; ‘पड़ाव डाला था’ हिन्दी में उस पूर्ववर्ती क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘पूर्वजों’ का ऐतिहासिक संदर्भ
  choice: वंश-संबंधी अभिव्यक्ति को अनिर्दिष्ट रखा गया
  alternative: इसे इस्राएल के अतीत के किसी विशेष राजा या पूर्वजों की सेना के रूप में स्पष्ट करना
