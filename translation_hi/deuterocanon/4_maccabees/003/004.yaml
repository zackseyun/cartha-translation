  text: Reason cannot cut off any one of your evil tendencies[c][b][a], but it is able to join in helping you not to bend to that evil tendency.
translation:
  language: hi
  text: तुम में से कोई भी अपनी दुष्प्रवृत्ति[a] को काटकर अलग नहीं कर सकता[b], पर विवेक-बुद्धि उस दुष्प्रवृत्ति के आगे न झुकने[c] में सहायता दे सकती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसके अन्य संभव अर्थ हैं ‘दुष्टता’, ‘दुर्भाव’ या ‘बुरा स्वभाव’। यूनानी शब्द किसी एक बुरे काम की अपेक्षा बुरे नैतिक स्वभाव को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “काट नहीं सकता” या “काटकर अलग नहीं कर सकता।”'
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक अर्थ: “उस दुष्प्रवृत्ति से न झुकाया जाना”; अर्थात उसके वश में न होना।'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακοήθειάν / κακοηθείᾳ
  choice: दुष्प्रवृत्ति / उस दुष्प्रवृत्ति
  rationale: यह शब्द किसी एक बुरे काम से अधिक, बुरे नैतिक स्वभाव या भीतर की दूषित प्रवृत्ति को दर्शाता है। दूसरी बार संकेतवाचक रूप रखने से यूनानी लेख का पूर्वसंदर्भ स्पष्ट होता है।
- source_word: τις ὑμῶν
  choice: तुम्हारी किसी भी
  rationale: निषेध के साथ यह प्रयोग वितरणात्मक अर्थ देता है—उन दुष्प्रवृत्तियों में से किसी एक को भी।
- source_word: οὐ δύναται ἐκκόψαι
  choice: जड़ से काट नहीं सकती
  rationale: ἐκκόπτω के काट देने या काटकर अलग करने के सजीव रूपक को स्वाभाविक हिन्दी में सुरक्षित रखा गया है; यहाँ पूर्णतः मिटा देने का भाव है।
- source_word: τὸ μὴ καμφθῆναι
  choice: आगे न झुकने
  rationale: यूनानी निष्क्रिय रूप का शाब्दिक अर्थ ‘न झुकाया जाना’ है; नैतिक संदर्भ में इसका आशय दबाव के आगे न झुकना या वश में न होना है। हिन्दी में रूपक और अर्थ दोनों बनाए रखे गए हैं।
- source_word: ὁ λογισμὸς
  choice: विवेक-बुद्धि
  rationale: इस पुस्तक में λογισμός नैतिक निर्णय करने वाली तर्कशील क्षमता का प्रमुख विषयगत शब्द है। ‘विवेक-बुद्धि’ केवल सामान्य सोच की अपेक्षा उसके बौद्धिक और नैतिक दोनों पहलुओं को व्यक्त करता है।
- source_word: συμμαχῆσαι
  choice: तुम्हारा साथ दे सकती है
  rationale: क्रिया में सहयोगी या सहयोद्धा बनकर सहायता करने का भाव है। ‘साथ देना’ उस सहयोगी सहायता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से युद्ध-संबंधी भाषा थोपे।
- source_word: δυνατὸν
  choice: दे सकती है
  rationale: यहाँ δυνατός सामर्थ्य व्यक्त करता है और पहले आए ‘नहीं सकती’ के साथ स्पष्ट विरोध बनाए रखता है।
theological_decisions:
- issue: विवेक-बुद्धि की शक्ति और दुष्प्रवृत्ति के बीच संबंध
  choice: विवेक-बुद्धि दुष्प्रवृत्ति को समूल मिटा नहीं सकती, किंतु मनुष्य को उसके आगे न झुकने में वास्तविक सहायता दे सकती है।
  alternative: वाक्य को अधिक व्यापक रूप में ऐसा समझा जा सकता है कि विवेक-बुद्धि किसी भी बुराई को हटा ही नहीं सकती; या अंतिम खंड को केवल ‘बुराई का विरोध करने में सहायता करती है’ कहा जा सकता है।
  rationale: यूनानी पाठ ἐκκόψαι (‘काट देना’) और μὴ καμφθῆναι (‘न झुकाया जाना’) के बीच जानबूझकर भेद करता है। अनुवाद विवेक की सीमित किंतु वास्तविक नैतिक सामर्थ्य का यह तनाव बनाए रखता है और बाद की किसी विशिष्ट मानवशास्त्रीय शिक्षा को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज। ‘विवेक-बुद्धि’ को पुस्तक के प्रमुख विषयगत शब्द के रूप में संगत रखने योग्य माना गया है। ‘जड़ से काटना’, ‘आगे झुकना’ और ‘साथ देना’ यूनानी पाठ के क्रमशः उन्मूलन, झुकने और सहयोगी सहायता के रूपकों को स्वाभाविक हिन्दी में बनाए रखते हैं।
