- from: परन्तु शत्रुओं के बीच के पानी[a] की एक विवेकहीन लालसा उसे कसकर सुखा-सिकोड़ रही थी और उसे शिथिल करते हुए जला रही थी।[b]
  to: परन्तु शत्रुओं के पास के पानी[a] की एक विवेकहीन लालसा उसे कसती हुई उसे सुखा-सिकोड़ रही थी, और उसे ढीला करते हुए उसे जला रही थी।[b]
  rationale: Revision is needed to represent ἐπιτείνουσα as a separate personified action and to make the rendering of παρὰ τοῖς πολεμίοις more idiomatic in Hindi. The source’s compressed and paradoxical sequence—tightening, shriveling, loosening, burning—has otherwise been retained without interpretation.
  reviewer_model: gpt-5.6-terra
