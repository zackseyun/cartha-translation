review_pass:
  verdict: revise
  source_fidelity: Draft preserves the adversative, indefiniteness, plural ‘enemies,’ the reason/passion contrast in ἀλόγιστος, and the compressed personification. However, ‘उसे कसकर सुखा-सिकोड़ रही थी’ makes ‘कसकर’ function chiefly as an adverb modifying ‘सुखा-सिकोड़,’ rather than retaining ἐπιτείνουσα as desire’s distinct action upon him. The revision makes that participial action explicit. ‘शत्रुओं के पास के पानी’ is a more idiomatic Hindi rendering of παρὰ τοῖς πολεμίοις while retaining the source’s location/association ambiguity.
  naturalness: The revised wording is modern, formal Hindi and keeps the deliberately harsh, paradoxical imagery understandable. ‘उसे कसती हुई’ is clearer and more natural than attaching ‘कसकर’ directly to the compound verb.
  terminology: ‘विवेकहीन लालसा’ appropriately conveys ἀλόγιστος ἐπιθυμία and maintains the work’s contrast between reason and passion without importing doctrinal interpretation. ‘ढीला करते हुए’ preserves the concrete metaphor of λύουσα better than an explanatory paraphrase.
  issues:
  - severity: medium
    issue: The force of ἐπιτείνουσα is not syntactically distinct in the draft.
    rationale: In ‘उसे कसकर सुखा-सिकोड़ रही थी,’ ‘कसकर’ can be read merely as ‘intensely/tightly’ drying and shriveling him. Greek presents desire as first exerting a tightening/straining action on him, then shriveling him.
  - severity: low
    issue: ‘शत्रुओं के बीच के पानी’ is somewhat awkward and may imply water physically situated in the midst of persons.
    rationale: παρὰ with the dative can indicate water located with, at, or in the possession of the enemies. ‘शत्रुओं के पास के पानी’ is idiomatic while leaving the precise setting open.
  revised_text: परन्तु शत्रुओं के पास के पानी[a] की एक विवेकहीन लालसा उसे कसती हुई उसे सुखा-सिकोड़ रही थी, और उसे ढीला करते हुए उसे जला रही थी।[b]
