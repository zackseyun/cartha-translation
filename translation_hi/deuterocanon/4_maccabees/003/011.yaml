base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/011.yaml
  text: But some irrational desire for the water among the enemies[a], tightening itself upon him, shriveled him, and while loosening him[b], burned him up.
translation:
  language: hi
  text: परन्तु शत्रुओं के पास के पानी[a] की एक विवेकहीन लालसा उसे कसती हुई उसे सुखा-सिकोड़ रही थी, और उसे ढीला करते हुए उसे जला रही थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शत्रुओं के शिविर में मौजूद पानी।” यूनानी पद का शाब्दिक अर्थ शत्रुओं के “पास,” “साथ,” या “बीच” का पानी है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ बिंब बहुत संक्षिप्त है: लालसा को मानो एक व्यक्ति के रूप में दिखाया गया है, जो उसे कसती भी है और ढीला भी करती है, और फिर जलाती है। इससे तीव्र प्यास के परस्पर-विरोधी शारीरिक प्रभाव सामने आते हैं।'
    reason: cultural_note
lexical_decisions:
