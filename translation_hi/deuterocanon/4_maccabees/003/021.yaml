  to: तब वास्तव में कुछ लोगों ने सामूहिक सद्भाव के विरुद्ध विद्रोह छेड़कर[a] विपत्तियों का अनेक प्रकार से उपयोग किया।[b]
  rationale: Only a minor idiomatic correction is needed. Replacing ‘विपत्तियों को ... अपने काम में लिया’ with ‘विपत्तियों का ... उपयोग किया’ improves natural modern Hindi while preserving the source’s ambiguity and the footnoted stronger alternative.
