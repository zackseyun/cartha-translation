lexical_decisions:
- source_word: λογισμός
  choice: विवेक
  rationale: यहाँ यह शब्द तर्कपूर्ण विचार और नैतिक निर्णय की क्षमता को दर्शाता है; आधुनिक हिन्दी में ‘विवेक’ संक्षिप्त, स्वाभाविक और दार्शनिक संदर्भ के अनुकूल है।
- source_word: ἐκριζωτής
  choice: जड़ से उखाड़ने वाला
  rationale: यह अभिव्यक्ति यूनानी शब्द में निहित जड़ से उखाड़ने के ठोस रूपक को बनाए रखती है और पूर्णतः मिटा देने का भाव देती है।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: इस नैतिक-दर्शन संबंधी संदर्भ में πάθη केवल सामान्य भावनाएँ या कष्ट नहीं, बल्कि मनुष्य को प्रेरित और विचलित करने वाले प्रबल भावात्मक आवेग हैं; ‘मनोवेग’ इस व्यापकता को अपेक्षाकृत स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνταγωνιστής
  choice: संघर्ष करने वाला
  rationale: यह शब्द विरोध में खड़े होकर मुकाबला करने वाले को सूचित करता है। ‘संघर्ष करने वाला’ यह स्पष्ट रखता है कि विवेक मनोवेगों को समाप्त नहीं करता, बल्कि उनसे निरंतर जूझता है।
theological_decisions:
- issue: विवेक और मनोवेगों का संबंध
  choice: विवेक मनोवेगों को पूरी तरह मिटाता नहीं, बल्कि उनसे संघर्ष करता है।
  alternative: विवेक मनोवेगों का नाश करने वाला नहीं, बल्कि उनका विरोधी है।
  rationale: 'अनुवाद मूल के निषेध और विरोध के बीच तनाव को बनाए रखता है: विवेक की भूमिका मनोवेगों का उन्मूलन नहीं, उनका प्रतिरोध करना है। इसमें बाद की धार्मिक या दार्शनिक धारणाएँ नहीं जोड़ी गई हैं।'
