  register: भाषा आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण रखी गई है। ‘विवेक’ तथा ‘मनोवेग’ दार्शनिक अर्थ को साधारण पाठकों के लिए समझने योग्य रखते हैं; ‘जड़ से उखाड़ने वाला’ मूल रूपक को प्रत्यक्ष रूप से सुरक्षित करता है।
