  yaml_path: translation/deuterocanon/4_maccabees/003/018.yaml
  text: and to wrestle down the pains of the body[a], though they are extreme, and by the nobility and goodness of reason to spurn all the dominion of the passions.
translation:
  language: hi
  text: और शारीरिक पीड़ाओं को, चाहे वे कितनी ही प्रचंड क्यों न हों, कुश्ती में पछाड़ देना, और विवेक की श्रेष्ठता और भलाई के बल पर मनोवेगों के हर प्रकार के प्रभुत्व को तुच्छ समझकर ठुकरा देना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “थूककर दूर कर देना”; यूनानी क्रिया तिरस्कार के साथ अस्वीकार करने का सजीव बिंब प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλγηδόνας
  choice: पीड़ाओं
  rationale: यह शब्द शारीरिक दर्द या कष्ट को दर्शाता है; ‘पीड़ाओं’ से अर्थ स्वाभाविक रूप से व्यक्त होता है और अनावश्यक अतिशयोक्ति नहीं आती।
- source_word: καθʼ ὑπερβολὴν οὔσας
  choice: चाहे वे कितनी ही प्रचंड क्यों न हों
  rationale: यह वाक्यांश पीड़ाओं की अत्यधिक तीव्रता बताता है। स्वीकारात्मक-विरोधी रचना यूनानी भाव को सहज हिन्दी में रखती है।
- source_word: καταπαλαῖσαι
  choice: कुश्ती में पछाड़ देना
  rationale: क्रिया में मल्लयुद्ध करके विरोधी को परास्त करने का सजीव बिंब है; केवल ‘जीत लेना’ कहने से यह रूपक खो जाता।
- source_word: καλοκἀγαθίας
  choice: श्रेष्ठता और भलाई
  rationale: संयुक्त यूनानी धारणा में उदात्त श्रेष्ठता और नैतिक भलाई दोनों निहित हैं; दोनों पद रखने से इसका अर्थ एक अमूर्त शब्द में सीमित नहीं होता।
- source_word: λογισμοῦ
  choice: विवेक
  rationale: 4 मक्काबियों में यह शासन करने वाली तर्कशील निर्णय-शक्ति का प्रमुख पद है। ‘विवेक’ सामान्य पाठक के लिए स्वाभाविक है और केवल ‘मन’ से अधिक सटीक है।
- source_word: ἀποπτύσαι
  choice: तुच्छ समझकर ठुकरा देना
  rationale: क्रिया का शाब्दिक बिंब ‘थूककर दूर करना’ है और लाक्षणिक अर्थ घृणा या तिरस्कार के साथ अस्वीकार करना है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और सजीव शाब्दिक बिंब पादटिप्पणी में दिया गया है।
- source_word: πάσας τὰς τῶν παθῶν ἐπικρατείας
  choice: मनोवेगों के हर प्रकार के प्रभुत्व
  rationale: ἐπικρατεία नियंत्रणकारी सत्ता या प्रभुत्व है और बहुवचन πάσας के कारण ‘हर प्रकार’ उपयुक्त है। ‘मनोवेग’ πάθη को केवल काम-वासनाओं तक सीमित किए बिना भावनात्मक और इच्छात्मक आवेगों को समेटता है।
theological_decisions:
- issue: दार्शनिक रूप से महत्त्वपूर्ण λογισμός का अनुवाद
  choice: विवेक
  alternative: तर्कशील निर्णय-शक्ति; बुद्धि
  rationale: पुस्तक का केंद्रीय तर्क मनोवेगों पर भक्तिपूर्ण λογισμός के शासन से संबंधित है। ‘विवेक’ इस निर्णयकारी तर्क-शक्ति को सुबोध और गरिमापूर्ण हिन्दी में व्यक्त करता है, जबकि ‘बुद्धि’ अधिक व्यापक और ‘तर्कशील निर्णय-शक्ति’ अधिक तकनीकी है।
- issue: πάθη के अर्थ-क्षेत्र को बनाए रखना
  choice: मनोवेग
  alternative: वासनाएँ; भावनाएँ; मनोविकार
  rationale: यहाँ πάθη उन आंतरिक आवेगों और अनुभूतियों को सूचित करता है जो मनुष्य पर प्रभुत्व जमा सकती हैं। ‘वासनाएँ’ अर्थ को इच्छाओं तक संकुचित कर सकती है, ‘भावनाएँ’ अत्यधिक तटस्थ है, और ‘मनोविकार’ आधुनिक हिन्दी में रोगात्मक अर्थ ला सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। मल्लयुद्ध का यूनानी रूपक स्पष्ट रखा गया है। वाक्य का आरंभ ‘और’ तथा क्रियाओं का कृदंत-सदृश अनंत रूप पूर्ववर्ती प्रसंग से इसके व्याकरणिक संबंध को बनाए रखते हैं। पादटिप्पणी-चिह्न उसी पद के बाद रखा गया है जिसकी व्याख्या पादटिप्पणी करती है।
