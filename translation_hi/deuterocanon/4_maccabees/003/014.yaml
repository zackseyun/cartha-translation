  text: And after courageously finding the spring[a], they filled the king’s drink from it.
translation:
  language: hi
  text: और साहसपूर्वक उस सोते को ढूँढ़ लेने के बाद, उन्होंने उसमें से राजा के लिए पीने का पानी भर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνευράμενοι
  choice: ढूँढ़ लेने के बाद
  rationale: यह एओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया दिखाता है; यह प्रयोग हिन्दी में क्रम को स्वाभाविक और स्पष्ट रखता है।
- source_word: θαρραλέως
  choice: साहसपूर्वक
  rationale: क्रियाविशेषण निर्भीकता और साहस को व्यक्त करता है; यह औपचारिक होने के साथ सामान्य पाठक के लिए स्पष्ट है।
- source_word: τὴν πηγὴν
  choice: उस सोते को
  rationale: πηγή यहाँ पानी के प्राकृतिक स्रोत को दर्शाता है। हिन्दी में 'सोता' इस कथात्मक प्रसंग में 'झरना' की अपेक्षा अधिक सटीक है; निर्देशवाचक 'उस' पूर्वप्रसंग में पहचाने गए स्रोत को इंगित करता है।
- source_word: ἐξ αὐτῆς
  choice: उसमें से
  rationale: स्त्रीलिंग सर्वनाम पहले उल्लिखित पानी के सोते की ओर लौटता है; हिन्दी में यह स्वाभाविक संदर्भ है।
- source_word: ἐγέμισαν
  choice: भर लिया
  rationale: एओरिस्ट की पूर्ण कथात्मक क्रिया व्यक्त होती है। 'लिया' पानी प्राप्त करने के उद्देश्य को स्वाभाविक हिन्दी में दर्शाता है, बिना मूल अर्थ में नई सूचना जोड़े।
- source_word: τῷ βασιλεῖ
  choice: राजा के लिए
  rationale: यूनानी संप्रदान कारक को सीधे लाभार्थी अर्थ में रखा गया है, जिससे मूल की व्याकरणिक अस्पष्टता को अधिकारसूचक बनाकर अनावश्यक रूप से सीमित नहीं किया जाता।
- source_word: τὸ ποτόν
  choice: पेय
  rationale: ποτόν पीने की वस्तु या पेय को दर्शाता है। 'पेय' संक्षिप्त, स्पष्ट और गरिमापूर्ण हिन्दी है; सोते का उल्लेख इसे पानी के रूप में संदर्भित करता है।
