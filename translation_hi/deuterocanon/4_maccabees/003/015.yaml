base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/015.yaml
  text: And even while burning with thirst[b][a], he reasoned that it would be an utterly dreadful danger to the soul if the drink were regarded as equivalent to blood.
translation:
  language: hi
  text: परन्तु प्यास से जलते हुए भी उसने विचार किया कि उस पेय को रक्त के बराबर मानना आत्मा के लिए अत्यन्त भयानक[a] संकट है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द πάνδεινον ‘भयानक’ के भाव को बहुत तीव्र करता है; इसका अर्थ ‘सर्वथा भयावह’ भी दिया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: वाक्य का आशय संभवतः यह है कि उस पेय को ग्रहण करना उसे रक्त के समतुल्य मानने के बराबर था।
    reason: cultural_note
lexical_decisions:
- source_word: διαπυρούμενος
  choice: जलते हुए
  rationale: यह शब्द तीव्र ताप या आग से दहकने का सजीव बिंब देता है; प्यास के संदर्भ में ‘प्यास से जलते हुए’ स्वाभाविक हिन्दी में उस रूपक को बनाए रखता है।
- source_word: δίψαν
  choice: प्यास
  rationale: संज्ञा का सीधा और सामान्य हिन्दी समतुल्य।
- source_word: ἐλογίσατο
  choice: तर्क करके यह समझा
  rationale: क्रिया विचारपूर्ण नैतिक विवेचना को व्यक्त करती है। ‘तर्क करके’ 4 मक्काबियों में तर्क-बुद्धि के विषयगत महत्त्व को उभारता है, जबकि ‘यह समझा’ वाक्य को स्वाभाविक बनाता है।
- source_word: πάνδεινον
  choice: अत्यन्त भयानक
  rationale: यह यौगिक विशेषण भयावहता को बहुत तीव्र करता है; ‘अत्यन्त भयानक’ उसका बल बनाए रखते हुए सहज आधुनिक हिन्दी है।
- source_word: κίνδυνον
  choice: संकट
  rationale: यहाँ नैतिक और आत्मिक हानि के गंभीर खतरे के लिए स्वाभाविक तथा गरिमापूर्ण शब्द।
- source_word: τῇ ψυχῇ
  choice: आत्मा के लिए
  rationale: ψυχή का अर्थ ‘जीवन’ भी हो सकता है, पर इस नैतिक-विवेचनात्मक संदर्भ में ‘आत्मा’ भीतरी नैतिक अस्तित्व की चिंता को बेहतर ढंग से व्यक्त करता है, बिना किसी विस्तृत उत्तरवर्ती सिद्धान्त को आरोपित किए।
- source_word: λογισθὲν
  choice: मानना
  rationale: निष्क्रिय कृदन्त किसी वस्तु को विचार या आकलन में कुछ ठहराए जाने का भाव देता है। हिन्दी में क्रियार्थक रचना अधिक स्वाभाविक है।
- source_word: ἰσοδύναμον
  choice: बराबर
  rationale: शब्द समान मूल्य, शक्ति या प्रभाव का भाव देता है। ‘बराबर’ सरल है और तुलना को स्पष्ट रखता है।
- source_word: τὸ ποτόν
  choice: उस पेय
  rationale: निश्चित पद संदर्भ में उपस्थित विशिष्ट पेय की ओर संकेत करता है; ‘उस पेय’ हिन्दी में यह निश्चितता स्पष्ट करता है।
- source_word: αἵματι
  choice: रक्त
  rationale: मूल शब्द का सीधा अनुवाद; औपचारिक और धार्मिक-सांस्कृतिक संदर्भ में ‘रक्त’ उपयुक्त है।
theological_decisions:
- issue: नैतिक उपदेश के संदर्भ में ψυχή का अर्थ
  choice: आत्मा
  alternative: जीवन / प्राण
  rationale: यह पद केवल शारीरिक जीवन के जोखिम की नहीं, बल्कि विवेकपूर्ण निर्णय से जुड़ी भीतरी नैतिक हानि की बात करता प्रतीत होता है। ‘आत्मा’ इस अर्थ-क्षेत्र को सुरक्षित रखता है, यद्यपि यूनानी शब्द में ‘जीवन’ का अर्थ भी संभव है।
- issue: पेय और रक्त की तुलना का आशय
  choice: उस पेय को रक्त के बराबर मानना
  alternative: उस पेय को पीना रक्त ग्रहण करने के समान समझना
  rationale: यूनानी वाक्य-विन्यास संक्षिप्त है और पेय को रक्त के समतुल्य ठहराता है। मुख्य पाठ तुलना को सीधे रखता है; फुटनोट संभावित व्यवहारगत आशय समझाता है, पर उसे मूल से अधिक निश्चित नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘प्यास से जलते हुए’ मूल के सजीव रूपक को रखता है। ‘तर्क करके यह समझा’ दार्शनिक-विवेचनात्मक स्वर को सहज हिन्दी में व्यक्त करता है। सभी फुटनोट चिह्न मुख्य पाठ में उपस्थित हैं।
