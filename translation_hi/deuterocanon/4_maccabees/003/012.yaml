  text: Therefore, while the defenders were indignant at the king’s desire, two young soldiers, steadfast men, ashamed by the king’s desire, armed themselves with full armor, and, taking a water jar, went over the enemy stockades.
translation:
  language: hi
  text: इसलिए, जब रक्षक राजा की इच्छा पर रोष प्रकट कर रहे थे, तब दो दृढ़ युवा सैनिकों ने, राजा की इच्छा से लज्जित होकर,[a] पूरा कवच पहन लिया और एक घड़ा लेकर[b] शत्रुओं की मोर्चाबंदी पार कर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा की इच्छा के कारण लज्जा से प्रेरित होकर।” यूनानी वाक्यांश संक्षिप्त है और प्रतिक्रिया की ठीक छाया अस्पष्ट रहने देता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी शब्द का अर्थ घड़ा या सुराही है; प्रसंग में यह सम्भवतः पानी का घड़ा था।
    reason: cultural_note
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से परिणाम या निष्कर्ष का संबंध दिखाता है।
- source_word: ὑπερασπιστῶν
  choice: रक्षक
  rationale: यह उन लोगों को सूचित करता है जो किसी की रक्षा में खड़े हैं; सैन्य संदर्भ में यह सहज और पर्याप्त व्यापक है।
- source_word: ἐπὶ τῇ τοῦ βασιλέως ἐπιθυμίᾳ
  choice: राजा की इच्छा पर
  rationale: ἐπιθυμία इच्छा, लालसा या अभिलाषा हो सकती है; तटस्थ ‘इच्छा’ संदर्भ को अनावश्यक रूप से नहीं खोलती।
- source_word: σχετλιάζόντων
  choice: रोष प्रकट कर रहे थे
  rationale: यह तीव्र अप्रसन्नता और आक्रोश व्यक्त करता है तथा हिन्दी में स्वाभाविक है।
- source_word: δύο νεανίσκοι στρατιῶται καρτεροί
  choice: दो दृढ़ युवा सैनिक
  rationale: νεανίσκοι को सैनिकों के साथ जोड़कर और καρτεροί को ‘दृढ़’ कहकर यूनानी पदसमूह को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: καταιδεσθέντες
  choice: लज्जित होकर
  rationale: मध्य/निष्क्रिय कृदन्त उनके भीतर उत्पन्न लज्जा या संकोच का भाव देता है; कारण का सटीक संबंध कुछ संकुचित है, इसलिए पादटिप्पणी दी गई है।
- source_word: τὰς πανοπλίας καθωπλίσαντο
  choice: अपने पूरे हथियार बाँध लिए
  rationale: πανοπλία संपूर्ण युद्ध-साज को सूचित करता है और मध्यवाच्य क्रिया स्वयं को उससे सज्जित करने का भाव देती है।
- source_word: κάλπιν
  choice: एक घड़ा
  rationale: κάλπις घड़े या सुराही जैसे पात्र को दर्शाता है; सम्भवतः यह पानी के लिए था, पर मूल में ‘पानी’ स्पष्ट नहीं है।
- source_word: ὑπερέβησαν τοὺς τῶν πολεμίων χάρακας
  choice: शत्रुओं की मोर्चाबंदी पार कर गए
  rationale: χάρακες सैन्य खूंटों, बाड़ों या घेराबंदी की रक्षात्मक संरचनाओं को दर्शाता है; ‘मोर्चाबंदी’ हिन्दी में व्यापक अर्थ सुरक्षित रखती है।
