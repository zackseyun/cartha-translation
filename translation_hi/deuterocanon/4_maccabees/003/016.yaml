    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह शब्द पिछले कथन से निकला निष्कर्ष व्यक्त करता है; ‘इसलिए’ आधुनिक हिन्दी में इस तार्किक संबंध को स्वाभाविक ढंग से प्रकट करता है।
- source_word: ἀντιθεὶς
  choice: के विरुद्ध ... को खड़ा किया
  rationale: ἀντίθημι के ठोस विरोधात्मक भाव को बनाए रखता है और बताता है कि यह जानबूझकर किया गया प्रतिरोध था।
- source_word: τῇ ἐπιθυμίᾳ
  choice: लालसा
  rationale: ἐπιθυμία यहाँ प्रबल इच्छा या कामना का बोध कराता है। ‘लालसा’ व्यापक होने के साथ उस तीव्र इच्छात्मक बल को भी व्यक्त करती है।
- source_word: τὸν λογισμόν
  choice: विवेक
  rationale: 4 मक्काबियों में λογισμός उस तर्कशील निर्णय-शक्ति का प्रमुख शब्द है जो इच्छाओं और आवेगों का शासन करती है। ‘विवेक’ साधारण पाठक के लिए स्वाभाविक और दार्शनिक विरोध के लिए पर्याप्त है।
- source_word: ἔσπεισεν
  choice: अर्घ्य के रूप में उंडेल दिया
  rationale: σπένδω केवल उंडेलने के बजाय पेय-बलि या अर्घ्य चढ़ाने की क्रिया को सूचित करता है; यह अनुवाद उस उपासना-संबंधी अर्थ को स्पष्ट करता है।
- source_word: τὸ πόμα
  choice: उस पेय को
  rationale: πόμα का सीधा अर्थ ‘पेय’ है। निश्चित उपपद के कारण ‘उस’ रखा गया है, जबकि अर्घ्य का भाव क्रिया से व्यक्त किया गया है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के लिए
  rationale: यह संप्रदान कारक अर्घ्य के प्राप्तकर्ता या जिसके सम्मान में वह चढ़ाया गया, उसे दर्शाता है; हिन्दी में ‘परमेश्वर के लिए’ स्वाभाविक है।
theological_decisions:
- issue: σπένδω और τὸ πόμα में उपासना-संबंधी अर्घ्य का भाव
  choice: वाक्य को परमेश्वर के लिए पेय अर्घ्य उंडेलने की क्रिया के रूप में अनूदित किया गया।
  alternative: 'अधिक शाब्दिक रूप में: ‘उसने पेय को परमेश्वर के लिए उंडेल दिया।’'
  rationale: यूनानी क्रिया σπένδω स्वयं अर्घ्य या पेय-बलि चढ़ाने का अर्थ रखती है। इसे स्पष्ट करना पाठ के धार्मिक आशय को सामने लाता है, बिना उसमें कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘विवेक’ और ‘लालसा’ के विरोध से मूल यूनानी का दार्शनिक तनाव सुरक्षित रहता है।
