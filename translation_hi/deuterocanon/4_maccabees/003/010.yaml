lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: परन्तु राजा
  rationale: δέ यहाँ पिछले प्रसंग से हल्का विरोध या संक्रमण दर्शाता है; ‘परन्तु’ उस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὡς μάλιστα διψῶν
  choice: बहुत प्यासा था
  rationale: ὡς μάλιστα प्यास की तीव्रता पर बल देता है। ‘बहुत प्यासा’ आधुनिक हिन्दी में स्वाभाविक है और अतिरंजित अर्थ जोड़े बिना तीव्रता व्यक्त करता है।
- source_word: καίπερ ἀφθόνους ἔχων πηγάς
  choice: फिर भी, भरपूर जल-स्रोत होते हुए
  rationale: καίπερ का रियायती भाव ‘फिर भी ... होते हुए’ से व्यक्त होता है। πηγαί के लिए ‘जल-स्रोत’ चुना गया है, जो झरनों या सोतों के व्यापक अर्थ को समेटता और सहज हिन्दी देता है।
- source_word: οὐκ ἠδύνατο διʼ αὐτῶν
  choice: वह उनसे ... न कर सका
  rationale: यह असमर्थता और उन्हीं जल-स्रोतों को साधन मानने के भाव, दोनों को संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: ἰάσασθαι τὴν δίψαν
  choice: अपनी प्यास दूर न कर सका
  rationale: मुख्य पाठ में यह मुहावरेदार हिन्दी है। यूनानी ἰάομαι के मूल ‘चंगा करना/ठीक करना’ वाले चिकित्सकीय रूपक को पादटिप्पणी में सुरक्षित रखा गया है।
