base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/020.yaml
  text: For since our fathers had deep peace because of their law-abidingness[a], and prospered, so that even Seleucus Nicanor, the king of Asia, set apart money for them for the sacred service and approved their polity[b],
translation:
  language: hi
  text: क्योंकि हमारे पूर्वजों को उनके नियमबद्ध जीवन[a] के कारण गहरी शांति मिली हुई थी और वे फल-फूल रहे थे, यहाँ तक कि एशिया के राजा सेल्युकस निकानोर ने भी उनकी पवित्र सेवा के लिए धन अलग रखा और उनकी नागरिक व्यवस्था[b] को स्वीकृति दी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुव्यवस्था के कारण” अथवा “विधि-पालन के कारण।” यूनानी शब्द विधि के अधीन सुव्यवस्थित जीवन को दर्शा सकता है और इसमें यहूदी व्यवस्था के प्रति निष्ठा का भाव भी निहित हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके संविधान” अथवा “उनकी सामुदायिक शासन-व्यवस्था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: βαθεῖαν εἰρήνην
  choice: गहरी शांति
  rationale: βαθεῖαν के ‘गहरी’ रूपक को बनाए रखता है और केवल ‘बहुत शांति’ कहकर उसके आलंकारिक बल को कम नहीं करता।
- source_word: διὰ τὴν εὐνομίαν
  choice: उनके नियमबद्ध जीवन के कारण
  rationale: εὐνομία का आशय विधि के अधीन सुव्यवस्थित और नियमपालक जीवन से है। यह हिन्दी अभिव्यक्ति उस व्यापक अर्थ को रखती है, पर इसे केवल मूसा की व्यवस्था के पालन तक सीमित नहीं करती।
- source_word: ἔπραττον καλῶς
  choice: वे फल-फूल रहे थे
  rationale: यूनानी मुहावरा उनके अच्छे हाल और उन्नति को बताता है; ‘फल-फूल रहे थे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀφορίσαι
  choice: अलग रखा
  rationale: यह किसी विशेष उद्देश्य के लिए धन निर्धारित करने या सुरक्षित रखने का भाव व्यक्त करता है।
- source_word: χρήματα εἰς τὴν ἱερουργίαν
  choice: पवित्र सेवा-कार्य के लिए धन
  rationale: ἱερουργία पवित्र या मन्दिर-संबंधी सेवा को सूचित करता है; यह अनुवाद उसके धार्मिक स्वरूप को रखता है और अनावश्यक रूप से उसे केवल पुरोहिताई तक सीमित नहीं करता।
- source_word: τὴν πολιτίαν αὐτῶν
  choice: उनकी नागरिक व्यवस्था
  rationale: πολιτεία यहाँ समुदाय की सार्वजनिक, संवैधानिक या नागरिक व्यवस्था को सूचित कर सकता है। ‘नागरिक व्यवस्था’ साधारण हिन्दी में बोधगम्य रहते हुए उस राजनीतिक-सामुदायिक अर्थ को बनाए रखती है।
- source_word: ἀποδέχεσθαι
  choice: स्वीकृति दी
  rationale: यह राजकीय अनुकूल स्वीकार या अनुमोदन के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βασιλέα Σέλευκον τὸν Νικάνορα
  choice: एशिया के राजा सेल्युकस निकानोर
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और यूनानी पदबंध को स्पष्ट हिन्दी क्रम में रखा गया है।
theological_decisions:
- issue: यहूदी पहचान के संदर्भ में εὐνομία का अर्थ
  choice: नियमबद्ध जीवन
  alternative: सुव्यवस्था; विधि-पालन
  rationale: प्रसंग में यहूदी व्यवस्था के प्रति निष्ठा निहित हो सकती है, फिर भी यूनानी संज्ञा अपने आप में अधिक व्यापक है और विधि के अधीन सुव्यवस्थित जीवन भी व्यक्त करती है। मुख्य पाठ उस व्यापकता को बनाए रखता है और पादटिप्पणी विकल्प स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की कारणात्मक गति को ‘क्योंकि’ और ‘यहाँ तक कि’ से व्यक्त किया गया है। पद स्वतंत्र हिन्दी वाक्य के रूप में पूर्ण किया गया है, जबकि अगले प्रसंग की ओर ले जाने वाला तर्कसंबंध बना रहता है।
