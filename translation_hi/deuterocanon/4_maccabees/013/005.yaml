base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/005.yaml
  text: How then can one fail to acknowledge in these men the mastery over suffering that comes from blessedness[a], since they were not turned aside even by the pains of fire?
translation:
  language: hi
  text: तो फिर इन लोगों में सद्विवेक का भावावेशों पर प्रभुत्व कौन स्वीकार न करेगा[a], क्योंकि आग से हुई पीड़ाएँ भी उन्हें उनके संकल्प से हटा न सकीं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक औपचारिक रूप में: “उत्तम विवेक की भावावेशों पर प्रभुता।” यूनानी पदबंध दुर्लभ और कठिन है। “भावावेशों” में तीव्र भावनाएँ या आवेग अभिप्रेत हैं; संदर्भ में पीड़ाओं पर विजय का भाव भी सम्मिलित हो सकता है।'
    reason: दुर्लभ εὐλογιστία और παθοκρατία की दार्शनिक अर्थ-सीमा तथा संदर्भगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν ... ὁμολογεῖν
  choice: तो फिर ... कौन स्वीकार न करेगा
  rationale: यह स्वाभाविक हिन्दी आलंकारिक प्रश्न यूनानी वाक्य की उस शक्ति को बनाए रखता है जिसके अनुसार यह निष्कर्ष मानना अनिवार्य है।
- source_word: τούτοις
  choice: इन पुरुषों में
  rationale: समर्पित भाइयों में प्रकट गुण को पहचानने का भाव स्पष्ट करता है।
- source_word: τὴν τῆς εὐλογιστίας παθοκρατίαν
  choice: उस धन्य विवेक से उत्पन्न मनोविकारों पर प्रभुत्व
  rationale: दुर्लभ εὐλογιστία को संदर्भानुसार सद्गुणी और धन्य विवेक के रूप में तथा παθοκρατία को भावनात्मक आवेगों/वेदनाओं पर नियंत्रण के रूप में प्रस्तुत करता है। मुख्य पाठ पठनीय है, जबकि पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता बनाए रखती है।
- source_word: οἱ ... οὐκ ἐπεστράφησαν
  choice: उन्हें उनके संकल्प से हटा न सकीं
  rationale: निष्क्रिय यूनानी रूप का अर्थ दबाव के कारण अपने मार्ग या निश्चय से फेर दिए जाने का है; हिन्दी में यह कारणात्मक रचना स्वाभाविक और स्पष्ट है।
- source_word: τῶν μὲν διὰ πυρὸς ἀλγηδόνων
  choice: आग से होनेवाली पीड़ाएँ भी
  rationale: διὰ πυρός में आग के साधन होने का भाव और ἀλγηδόνων में तीव्र पीड़ाओं का अर्थ सुरक्षित है; 'भी' प्रसंग के बल को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: τῆς εὐλογιστίας παθοκρατία का दुर्लभ दार्शनिक-नैतिक अर्थ
  choice: धन्य विवेक से उत्पन्न मनोविकारों पर प्रभुत्व
  alternative: धन्यता/भक्ति से संबंधित भावावेशों अथवा पीड़ा पर प्रभुत्व
  rationale: 4 मक्काबियों में विवेक द्वारा मनोविकारों को वश में रखने का केंद्रीय विचार है। फिर भी εὐλογιστία और παθοκρατία दोनों की अर्थ-सीमा खुली रखने के लिए पादटिप्पणी में अधिक औपचारिक विकल्प दिया गया है; किसी संप्रदायगत सिद्धांत को निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। 'मनोविकार' यहाँ आधुनिक चिकित्सकीय रोगार्थ में नहीं, बल्कि दार्शनिक अर्थ में भावनात्मक आवेगों और वेदनाओं के लिए प्रयुक्त है, इसलिए पादटिप्पणी स्पष्टीकरण देती है।
