  text: क्योंकि जैसे अपने मनोवेगों के दास बने लोगों ने विलासपूर्ण भोजन किया[a]—क्योंकि हम कहते थे कि वे इन्हीं से पराजित हो चुके थे—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वादिष्ट व्यंजन खाए” अथवा “नफ़ासत से खाते रहे”; यूनानी क्रिया दुर्लभ है और परिष्कृत, भोग-विलासी खान-पान का भाव देती है।
    reason: दुर्लभ यूनानी क्रिया ἡμεροφάγησαν के शाब्दिक दायरे और सम्भव वैकल्पिक अनुवादों को बताने के लिए।
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक और ὥσπερ के तुलनात्मक बल, दोनों को बनाए रखता है; वाक्य आगे जारी रहने का संकेत भी देता है।
- source_word: τοῖς πάθεσιν δουλωθέντες
  choice: अपने मनोवेगों के दास बने
  rationale: δουλόω के दासता-बिंब को स्पष्ट रखता है। इस नैतिक-दर्शन संबंधी प्रसंग में πάθη बाहरी दुख नहीं, मनुष्य को वश में करने वाले आवेग या वासनात्मक मनोवेग हैं; ‘मनोवेग’ अर्थ को किसी एक प्रकार की इच्छा तक सीमित नहीं करता।
- source_word: ἡμεροφάγησαν
  choice: स्वादिष्ट और बढ़िया भोजन किया
  rationale: यह दुर्लभ क्रिया परिष्कृत, सुख-विलासी ढंग से खाने का भाव देती है। चुना हुआ पद सामान्य हिन्दी में समझने योग्य है और भोजन-संबंधी आशय को स्पष्ट रखता है।
- source_word: ἐλέγομεν γὰρ
  choice: क्योंकि हम कहते थे
  rationale: अपूर्ण भूतकाल ἐλέγομεν के चलते रहने या पूर्व कथन की ओर संकेत करने वाले पक्ष को ‘कहते थे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τούτοις νενικῆσθαι
  choice: वे इन्हीं से पराजित हो चुके थे
  rationale: νικάω के विजय-पराजय बिंब और पूर्ण infinitive से व्यक्त परिणामी अवस्था को सुरक्षित रखता है। ‘इन्हीं’ निकटवर्ती मनोवेगों की ओर संकेत करता है, पर यूनानी सर्वनाम की संदर्भगत संक्षिप्तता भी बनी रहती है।
theological_decisions:
- issue: πάθη का नैतिक-मनोवैज्ञानिक अर्थ
  choice: मनोवेग
  alternative: दुःख; भावनाएँ; वासनाएँ
  rationale: 4 मक्काबियों में विवेक और πάθη के बीच नैतिक-दर्शन संबंधी संघर्ष है। ‘मनोवेग’ इस व्यापक संकल्पना को रखता है, जबकि ‘दुःख’ यहाँ प्रसंगविरुद्ध और ‘वासनाएँ’ कुछ अधिक संकीर्ण हो सकता है।
- issue: δουλωθέντες में दासता का बिंब
  choice: दास बने
  alternative: अधीन हुए; वश में हुए
  rationale: यहाँ बंधन और पराजय का रूपक महत्वपूर्ण है; इसलिए स्रोत का तीखा दासता-बिंब नरम नहीं किया गया।
- issue: τούτοις का पूर्वसंदर्भ
  choice: इन्हीं से
  alternative: उनसे; इन बातों से
  rationale: सर्वनाम संभवतः उल्लिखित मनोवेगों की ओर लौटता है। अनुवाद संदर्भ को खुला रखते हुए किसी अतिरिक्त व्याख्या को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली। पद मूल यूनानी की अधूरी तुलनात्मक संरचना और अंत के दीर्घ विराम को बनाए रखता है, क्योंकि विचार अगले पद में पूरा होता है।
