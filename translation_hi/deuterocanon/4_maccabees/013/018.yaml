  yaml_path: translation/deuterocanon/4_maccabees/013/018.yaml
  text: And Jacob will welcome you[a], and all the fathers will praise you. And as each one of their brothers was being taken away, those who remained were saying, “Do not disgrace us, brother[b], nor prove false to those who died before us.”
translation:
  language: hi
  text: और याकूब तुम्हारा स्वागत करेगा[a], और सभी पूर्वज तुम्हारी प्रशंसा करेंगे। जब उनके भाइयों में से एक-एक को खींचकर अलग ले जाया जा रहा था, तब जो शेष रह गए थे, वे कहते थे, “भाई, हमें लज्जित न करना, और जो हमसे पहले मर चुके हैं, उन्हें झूठा न ठहराना[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें ग्रहण करेगा” अथवा “तुमसे मिलकर तुम्हारा अभिनंदन करेगा।”
    reason: lexical_alternative
  - marker: b
    text: या “जो हमसे पहले मर चुके हैं, उनके प्रति झूठा सिद्ध न होना”; अर्थात पहले मर चुके भाइयों की गवाही और उदाहरण से विश्वासघात न करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδέξονται
  choice: स्वागत करेगा
  rationale: क्रिया में ग्रहण करने और आदरपूर्वक स्वागत करने, दोनों का भाव है; ‘स्वागत करेगा’ परलोक में सम्मानपूर्ण ग्रहण के प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ πατέρες
  choice: सभी पूर्वज
  rationale: शाब्दिक अर्थ ‘पिता’ है, पर यहाँ पूज्य पितृपुरुषों/पुरखों का सामूहिक उल्लेख है; आधुनिक हिन्दी में ‘पूर्वज’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: ἐπαινέσουσιν
  choice: प्रशंसा करेंगे
  rationale: यह यूनानी क्रिया प्रशंसा या सराहना करने को दर्शाती है; ‘प्रशंसा करेंगे’ इसका सीधा और गरिमापूर्ण अनुवाद है।
- source_word: ἐνὶ ἑκάστῳ τῶν ἀποσπωμένων αὐτῶν ἀδελφῶν
  choice: जब उनके भाइयों में से एक-एक को खींचकर अलग ले जाया जा रहा था
  rationale: ‘एक-एक’ वितरणात्मक बल को और ‘खींचकर अलग ले जाया जा रहा था’ ἀποσπωμένων में निहित बलपूर्वक अलग किए जाने की प्रक्रिया को बनाए रखता है।
- source_word: οἱ περιλειπόμενοι
  choice: जो शेष रह गए थे
  rationale: यह उस समय पीछे बचे भाइयों को दर्शाता है, न कि अंततः जीवित बच जाने वालों को।
- source_word: Μὴ καταισχύνῃς ἡμᾶς
  choice: हमें लज्जित न करना
  rationale: इसमें सार्वजनिक अपमान और कुल/समूह को शर्मिंदा करने का भाव है; ‘लज्जित’ गरिमापूर्ण तथा सहज है।
- source_word: μηδὲ ψεύσῃ τοὺς προαποθανόντας
  choice: जो हमसे पहले मर चुके हैं, उनके प्रति झूठा सिद्ध न होना
  rationale: ψεύσῃ का प्रयोग यहाँ केवल झूठ बोलने से अधिक, पहले मरने वालों की गवाही या उदाहरण के प्रति असत्य सिद्ध होने का भाव दे सकता है। यह अनुवाद उस संबंधपरक अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: परलोक में स्वागत करने वाले ‘याकूब’ की पहचान
  choice: नाम ‘याकूब’ को व्यक्तिगत पितृपुरुष के रूप में बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘याकूब’ को सामूहिक रूप से इस्राएल का संकेत समझना।
  rationale: ‘सभी पूर्वज’ के साथ इसका संयोजन पितृपुरुष याकूब की ओर अधिक स्वाभाविक संकेत करता है, फिर भी मुख्य पाठ में कोई अतिरिक्त पहचान नहीं जोड़ी गई।
- issue: पहले मर चुके भाइयों के प्रति ‘झूठा सिद्ध’ होना
  choice: असामान्य किंतु अर्थपूर्ण वाक्यांश को बनाए रखा गया है।
  alternative: ‘उनकी गवाही से विश्वासघात न करना’ या ‘उन्हें झूठा न ठहराना’।
  rationale: मूल क्रिया झूठा पड़ने, छल करने या किसी को झूठा सिद्ध करने के बीच अर्थगत तनाव रखती है; अधिक व्याख्यात्मक विकल्प को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, श्रव्य और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। संबोधन एकवचन है, इसलिए ‘तुम्हारा/तुम्हें’ और ‘भाई’ रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
