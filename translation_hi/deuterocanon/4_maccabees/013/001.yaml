base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/001.yaml
  text: Therefore[a], since the seven brothers looked down on pains even to death[c][b], it is acknowledged from every side that godly reason is sovereign over the passions.
translation:
  language: hi
  text: तो फिर,[a] चूँकि सातों भाइयों ने मृत्यु तक की यातनाओं को तुच्छ समझा, हर ओर से यह स्वीकार किया जाता है कि ईश्वरभक्त विवेक[b] आवेगों[c] पर पूर्ण प्रभुत्व रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तो फिर’ का अनुवाद ‘अतः’ या ‘इसलिए’ भी हो सकता है; यूनानी पदबंध पिछले तर्क से निष्कर्ष निकालता है।
    reason: lexical_alternative
  - marker: b
    text: ‘ईश्वरभक्त विवेक’ का अनुवाद ‘धर्मपरायण बुद्धि’ भी किया जा सकता है। यह 4 मक्काबियों का प्रमुख पद है और ईश्वर के प्रति श्रद्धा से निर्देशित विचारशील निर्णय-शक्ति को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘आवेग’ केवल सामान्य भावनाएँ नहीं, बल्कि ग्रन्थ के नैतिक तर्क में वे प्रबल इच्छाएँ और प्रेरणाएँ हैं जिन्हें वश में रखना होता है।
    reason: cultural_note
lexical_decisions:
- source_word: δὲ τοίνυν
  choice: तो फिर
  rationale: यह पदबंध पिछले तर्क से निकलने वाला निष्कर्ष प्रस्तुत करता है। ‘तो फिर’ आधुनिक हिन्दी में उसके अनुमानात्मक और संक्रमणकारी दोनों बलों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν μέχρι θανάτου πόνων
  choice: मृत्यु तक की यातनाओं को
  rationale: πόνοι यहाँ पीड़ा या कष्ट को सूचित करता है और μέχρι θανάτου उसकी चरम सीमा—मृत्यु तक—बताता है। प्रसंग में भाइयों पर दी गई यातनाओं के कारण ‘यातनाओं’ उपयुक्त और सजीव है।
- source_word: ὑπερεφρόνησαν
  choice: तुच्छ समझा
  rationale: क्रिया का अर्थ किसी वस्तु को अपने विचार या चिंता के योग्य न मानना है। ‘तुच्छ समझा’ अवमानना के भाव को रखता है, पर अनावश्यक नैतिक कठोरता नहीं जोड़ता।
- source_word: οἱ ἑπτὰ ἀδελφοί
  choice: सातों भाइयों ने
  rationale: लेख सहित संख्या और ज्ञात समूह का भाव हिन्दी के स्वाभाविक ‘सातों भाइयों’ से प्रकट होता है।
- source_word: συνομολογεῖται ἀπανταχόθεν
  choice: हर ओर से यह स्वीकार किया जाता है
  rationale: निष्क्रिय क्रिया सामूहिक स्वीकृति व्यक्त करती है, जबकि ἀπανταχόθεν का दिशात्मक भाव ‘हर ओर से’ में बना रहता है।
- source_word: αὐτόδεσπότος
  choice: स्वयं प्रभुता रखता है
  rationale: दुर्लभ विशेषण अपने भीतर अथवा अपने अधिकार से स्वामी होने का भाव देता है। ‘स्वयं प्रभुता रखता है’ उसके αὐτο- तत्व और वास्तविक नियंत्रण दोनों को सुरक्षित रखता है।
- source_word: τῶν παθῶν
  choice: आवेगों पर
  rationale: इस ग्रन्थ में πάθη केवल सामान्य भावनाएँ नहीं, बल्कि वे प्रबल मनोप्रेरणाएँ हैं जिन्हें विवेक नियंत्रित करता है। ‘आवेग’ आधुनिक हिन्दी में इस नैतिक-मनोवैज्ञानिक अर्थ के निकट है।
- source_word: ὁ εὐσεβὴς λογισμός
  choice: ईश्वरभक्त विवेक
  rationale: λογισμός विचारशील निर्णय-शक्ति है और εὐσεβής उसे ईश्वर के प्रति श्रद्धा से आकार पाने वाली बताता है। ‘ईश्वरभक्त विवेक’ धार्मिक और बौद्धिक दोनों आयामों को संक्षेप में रखता है।
theological_decisions:
- issue: εὐσεβὴς λογισμός के धार्मिक और बौद्धिक दोनों पक्षों को व्यक्त करना
  choice: ईश्वरभक्त विवेक
  alternative: धर्मपरायण बुद्धि
  rationale: ‘ईश्वरभक्त’ श्रद्धा की दिशा स्पष्ट करता है और ‘विवेक’ नियंत्रक निर्णय-शक्ति को दर्शाता है; इससे इसे न तो केवल तर्कबुद्धि बनाया गया है, न किसी विशिष्ट सम्प्रदाय की संकल्पना।
- issue: πάθη का नैतिक-मनोवैज्ञानिक अर्थ
  choice: आवेग
  alternative: मनोविकार
  rationale: ‘मनोविकार’ आधुनिक हिन्दी में रोगात्मक अर्थ ग्रहण कर सकता है, जबकि ‘आवेग’ उन प्रबल प्रेरणाओं को व्यक्त करता है जिन पर विवेक प्रभुता रखता है, बिना सभी भावनाओं को बुरा ठहराए।
- issue: αὐτόδεσπότος में निहित स्वाधीन प्रभुता
  choice: स्वयं प्रभुता रखता है
  alternative: स्वामी है
  rationale: सिर्फ ‘स्वामी’ कहने से αὐτο- का आत्माधीन अथवा अपने अधिकार से शासन करने का बल दब जाता; ‘स्वयं’ मूल की इस विशेषता को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यातना’, ‘विवेक’, ‘आवेग’ और ‘प्रभुता’ जैसे शब्द दार्शनिक गंभीरता बनाए रखते हैं, पर अत्यधिक संस्कृतनिष्ठ या पुरातन शैली से बचते हैं।
