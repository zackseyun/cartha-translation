  yaml_path: translation/deuterocanon/4_maccabees/013/022.yaml
  text: The souls of brothers are affectionate in embraces[c][b][a], and they grow much stronger through living together and through daily familiarity and the rest of their upbringing.
translation:
  language: hi
  text: भाइयों की आत्माएँ आलिंगनों में स्नेहपूर्ण होती हैं[a]; और साथ रहने[b], प्रतिदिन के मेल-जोल और उनकी अन्य शिक्षा-दीक्षा[c] के कारण वे और भी अधिक प्रबल होती जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भाई-प्रेमी आत्माएँ, जो आलिंगनों में स्नेहपूर्ण हैं।” यूनानी वाक्यांश अत्यंत संक्षिप्त है; ‘भाई-प्रेमी’ का संबंध ‘आत्माओं’ से किस प्रकार जोड़ा जाए, इसमें कुछ गुंजाइश है।
    reason: lexical_alternative
  - marker: b
    text: “साथ रहने” का अनुवाद “संगति” या “साथ-साथ पलने-बढ़ने” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “अन्य शिक्षा-दीक्षा” का अनुवाद “बाकी परवरिश” या “अन्य प्रशिक्षण” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισμάτων
  choice: आलिंगन में
  rationale: यह शब्द बाँहों में भरने या आलिंगन का ठोस चित्र प्रस्तुत करता है। यूनानी वाक्यांश संक्षिप्त और क्रियारहित है; ‘आलिंगन में’ इस चित्र को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: φιλάδελφοι
  choice: भाइयों की … परस्पर प्रेम से भरी
  rationale: इसका शाब्दिक भाव ‘भाई से प्रेम रखनेवाला’ है। प्रसंग सात वास्तविक भाइयों का है, इसलिए ‘भाइयों’ रखा गया है; ‘परस्पर प्रेम से भरी’ विशेषण के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ψυχαί
  choice: आत्माएँ
  rationale: यहाँ शब्द भाइयों के भीतरी जीवन और स्नेह को सूचित करता है। ‘आत्माएँ’ मूल का ऊँचा भाव और मानव-स्वरूप संबंधी वजन बनाए रखता है।
- source_word: αὔξονται σφοδρότερον
  choice: और भी अधिक प्रबल होती जाती हैं
  rationale: क्रिया वृद्धि और तुलनात्मक क्रियाविशेषण बढ़ती तीव्रता बताते हैं। यह अनुवाद आत्माओं के पारस्परिक स्नेह के दृढ़ होने का भाव देता है, बिना हिंसक अर्थ जोड़े।
- source_word: διὰ συντροφίας
  choice: साथ-साथ पलने-बढ़ने के कारण
  rationale: συντροφία संगति, साथ रहने या साथ पाले जाने को व्यक्त कर सकता है। पारिवारिक प्रसंग में ‘साथ-साथ पलने-बढ़ने’ साझा जीवन और परवरिश दोनों को समेटता है।
- source_word: τῆς καθʼ ἡμέραν συνηθείας
  choice: प्रतिदिन के मेल-जोल
  rationale: यह पद दिन-प्रतिदिन की अभ्यस्त निकटता और नियमित संपर्क को दर्शाता है। ‘मेल-जोल’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: τῆς ἄλλης παιδίας
  choice: शेष शिक्षा-दीक्षा
  rationale: यह पद बाकी परवरिश, शिक्षा या प्रशिक्षण को सूचित कर सकता है। ‘शिक्षा-दीक्षा’ उसके व्यापक निर्माणकारी भाव को बनाए रखता है, जबकि ‘शेष’ ἄλλης की संगति को दर्शाता है।
theological_decisions:
- issue: वास्तविक भाइयों के प्रसंग में लिंग-सूचक पारिवारिक भाषा
  choice: भाइयों
  alternative: भाई-बहनों
  rationale: कथा में सात पुरुष सहोदर भाइयों की बात है; इसलिए सामान्य समावेशी शब्द के बजाय प्रसंगानुकूल ‘भाइयों’ अधिक सटीक है।
- issue: ψυχαί को भीतरी स्नेह या व्यक्तियों के रूप में समझना
  choice: आत्माएँ
  alternative: मन / व्यक्तित्व
  rationale: ‘आत्माएँ’ मूल शब्द की मानव-स्वरूप संबंधी गहराई और साहित्यिक गरिमा बचाता है। वाक्य में उनकी बढ़ती प्रबलता स्नेह के भीतरी बंधन को इंगित करती है, पर अनुवाद इसे किसी विशिष्ट दार्शनिक सिद्धांत में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी के संक्षिप्त, कुछ अस्पष्ट आरंभ को मुख्य पाठ में स्वाभाविक बनाया गया है और वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
