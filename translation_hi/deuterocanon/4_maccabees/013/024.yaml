base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/024.yaml
  text: For they had a firmer harmony with one another[a]; for, having been trained by the same law, having practiced the same virtues, and having been brought up in a righteous way of life[b], they were drawn more closely together.
translation:
  language: hi
  text: उनकी आपसी एकता अधिक दृढ़ थी।[a] क्योंकि उन्होंने एक ही व्यवस्था की शिक्षा पाई थी, उन्हीं सद्गुणों का अभ्यास किया था और धर्मी जीवन-पद्धति में साथ-साथ पले-बढ़े थे; इससे वे एक-दूसरे के और निकट आ गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें एक-दूसरे के प्रति अधिक दृढ़ एकमतता थी।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अंतिम उपवाक्य बहुत संक्षिप्त है; आशय यह है कि व्यवस्था, सद्गुणों और धर्मी जीवन में मिली उनकी समान परवरिश ने उन्हें परस्पर और अधिक निकट कर दिया।
    reason: alternative_reading
lexical_decisions:
- source_word: θέστερον
  choice: अधिक दृढ़
  rationale: यह तुलनात्मक रूप एकता की अधिक स्थिरता या मजबूती व्यक्त करता है; ‘अधिक दृढ़’ उसके तुलनात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁμόνοιαν
  choice: आपसी एकता
  rationale: यह शब्द मन और उद्देश्य की सहमति तथा पारस्परिक मेल को व्यक्त करता है। ‘आपसी एकता’ सामान्य पाठक के लिए सहज है और πρὸς ἀλλήλους के संबंधपरक भाव को भी समेटता है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: 4 मक्काबियों के यहूदी संदर्भ में यह पैतृक यहूदी व्यवस्था की ओर संकेत करता है। ‘व्यवस्था’ बाइबलीय हिन्दी में स्थापित और यहाँ पर्याप्त रूप से स्पष्ट है।
- source_word: παιδευθέντες
  choice: शिक्षा पाई थी
  rationale: क्रिया में शिक्षा, अनुशासन और नैतिक गठन का भाव है। ‘शिक्षा पाई’ सहज हिन्दी है; आगे सद्गुणों और जीवन-पद्धति का उल्लेख इसके गठनात्मक पक्ष को स्पष्ट करता है।
- source_word: ἐξασκήσαντες
  choice: अभ्यास किया था
  rationale: यह सक्रिय और अनुशासित अभ्यास को सूचित करता है। ‘अभ्यास किया’ सद्गुणों को व्यवहार में साधने का भाव बनाए रखता है।
- source_word: ἀρετάς
  choice: सद्गुणों
  rationale: हेलेनवादी नैतिक भाषा में यह नैतिक गुणों या उत्कृष्टताओं को दर्शाता है; ‘सद्गुण’ आधुनिक हिन्दी में इसका स्पष्ट समतुल्य है।
- source_word: συντραφέντες
  choice: साथ-साथ पले-बढ़े थे
  rationale: क्रिया में साथ पालन-पोषण पाने का भाव निहित हो सकता है। भाइयों की साझा परवरिश के संदर्भ में यह अनुवाद उस पारस्परिक आयाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ δικαίῳ ... βίῳ
  choice: धर्मी जीवन-पद्धति में
  rationale: यह वाक्यांश नैतिक रूप से सही जीवन के क्षेत्र और ढंग को बताता है। ‘धर्मी जीवन-पद्धति’ केवल एक गुण नहीं, बल्कि जीने के पूरे ढंग को व्यक्त करती है।
- source_word: μᾶλλον ἐφʼ αὐτοὺς ἤγαγον
  choice: इससे वे एक-दूसरे के और निकट आ गए
  rationale: यूनानी उपवाक्य संक्षिप्त और व्याकरणतः दुरूह है। संदर्भ में पहले कही गई साझा शिक्षा, सद्गुण-साधना और परवरिश उनके बढ़े हुए पारस्परिक निकटपन का कारण हैं; हिन्दी रूप अर्थ को स्पष्ट करते हुए μᾶλλον का तुलनात्मक बल बचाता है।
theological_decisions:
- issue: यहूदी शहीदी-वृत्तांत में νόμος का संदर्भ
  choice: ‘एक ही व्यवस्था’ को भाइयों को गढ़ने वाली साझा यहूदी व्यवस्था के रूप में रखा गया
  alternative: सामान्य नैतिक नियम
  rationale: 4 मक्काबियों में νόμος सामान्यतः पैतृक यहूदी व्यवस्था को दर्शाता है। मुख्य पाठ में केवल ‘व्यवस्था’ कहने से मूल की संक्षिप्तता बनी रहती है और अनावश्यक सांप्रदायिक विस्तार नहीं जुड़ता।
- issue: साझी धार्मिक-नैतिक परवरिश और पारस्परिक एकता का संबंध
  choice: साझी शिक्षा, सद्गुण-साधना और धर्मी जीवन को उनकी बढ़ी हुई निकटता का कारण बताया गया
  alternative: अंतिम यूनानी शब्दों का अत्यंत शाब्दिक किंतु अस्पष्ट अनुवाद
  rationale: मूल का अंतिम उपवाक्य संकुचित है, पर संदर्भ कारणात्मक संबंध स्पष्ट करता है। इसे स्वाभाविक हिन्दी में व्यक्त किया गया है और पादटिप्पणी में मूल की संक्षिप्तता बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य रखा गया है। ‘व्यवस्था’, ‘सद्गुण’ और ‘धर्मी जीवन-पद्धति’ मूल के यहूदी तथा नैतिक संदर्भ को बनाए रखते हैं। वाक्य की पुनरुक्त कारण-संरचना को सुरक्षित रखा गया है, जबकि अंतिम संक्षिप्त यूनानी उपवाक्य को पठनीय हिन्दी में स्पष्ट किया गया है।
