  yaml_path: translation/deuterocanon/4_maccabees/013/009.yaml
  text: Let us die as brothers[a], brothers, for the sake of the law; let us imitate the three young men in Syria[b], who despised the furnace of equal torment.
translation:
  language: hi
  text: भाइयो, हम भाई-भाई की तरह व्यवस्था के लिए मरें। हम सीरिया में उन तीन युवकों[a] का अनुकरण करें, जिन्होंने समान यातना वाली भट्ठी[b] को तुच्छ जाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संकेत दानिय्येल 3 में वर्णित तीन यहूदी युवकों की ओर है। यूनानी पाठ यहाँ “सीरिया” कहता है; इसलिए अधिक परिचित “बाबुल” के स्थान पर वही रखा गया है।
    reason: cross_reference
  - marker: b
    text: “समान यातना वाली” के पीछे प्रयुक्त यूनानी विशेषण दुर्लभ और अर्थ की दृष्टि से कठिन है। इसका आशय संभवतः ऐसी भट्ठी से है जिसकी यातना तुलनीय या समान थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφικῶς
  choice: भाई-भाई की तरह
  rationale: यह क्रियाविशेषण साथ मरने में भाइयों की एकजुटता व्यक्त करता है और अगले संबोधन ἀδελφοί की पुनरुक्ति को भी बनाए रखता है।
- source_word: ἀποθάνωμεν
  choice: हम ... मरें
  rationale: अओरिस्ट सब्जंक्टिव यहाँ सामूहिक आह्वान है; हिंदी में ‘हम ... मरें’ उसका स्वाभाविक रूप है।
- source_word: ἀδελφοὶ
  choice: भाइयो
  rationale: कथा में संबोधन वास्तविक पुरुष सहोदरों से है, इसलिए लिंग-सटीक संबोधन रखा गया है।
- source_word: περὶ τοῦ νόμου
  choice: व्यवस्था के लिए
  rationale: περί के साथ संबंधकारक यहाँ व्यवस्था के प्रति निष्ठा के कारण या उसके पक्ष में प्राण देने का भाव व्यक्त करता है।
- source_word: μιμησώμεθα
  choice: हम ... का अनुकरण करें
  rationale: मूल के सामूहिक प्रोत्साहन और प्रत्यक्ष ‘अनुकरण’ की भाषा को सुरक्षित रखता है।
- source_word: τοὺς τρεῖς τοὺς ἐπὶ τῆς Συρίας νεανίσκους
  choice: सीरिया के उन तीन युवकों
  rationale: मूल पाठ के भौगोलिक नाम ‘सीरिया’ को बाबुल से समरूप किए बिना रखा गया है; ‘युवक’ νεανίσκους का सहज आधुनिक हिंदी रूप है।
- source_word: ἰσοπαίδος
  choice: समान पीड़ा देने वाली
  rationale: यह दुर्लभ और कठिन विशेषण भट्ठी से जुड़ा है। अनुवाद तुलना और यातना की समानता का संकेत देता है, पर उसके अनिश्चित सटीक अर्थ को पादटिप्पणी में स्पष्ट करता है।
- source_word: καμίνου
  choice: भट्ठी
  rationale: अग्निमय दंड और दानिय्येल 3 के प्रसंग में यह स्वाभाविक तथा प्रचलित हिंदी शब्द है।
- source_word: κατεφρόνησαν
  choice: तुच्छ जाना
  rationale: क्रिया भयावह यातना को हेय समझने या उसकी परवाह न करने की प्रबल अलंकारिक भावना रखती है।
theological_decisions:
- issue: दानिय्येल 3 का संकेत और भौगोलिक शब्दावली
  choice: सीरिया के उन तीन युवकों
  alternative: बाबुल के तीन युवक
  rationale: यूनानी पाठ स्पष्ट रूप से सीरिया कहता है। परिचित दानिय्येल-वृत्तांत से सामंजस्य बैठाने के लिए मूल भौगोलिक शब्द को बदलना उचित नहीं है।
- issue: ἀδελφοί का लिंग-सटीक अनुवाद
  choice: भाइयो
  alternative: भाई-बहनो / सहोदरो
  rationale: यहाँ वक्ता अपने वास्तविक पुरुष सहोदरों को संबोधित कर रहा है, किसी मिश्रित या सामान्य समुदाय को नहीं।
- issue: ἰσοπαίδος की अर्थगत अनिश्चितता
  choice: समान पीड़ा देने वाली
  alternative: उनकी भट्ठी के समान / समान रूप से प्रचंड
  rationale: विशेषण दुर्लभ और अर्थ की दृष्टि से कठिन है। मुख्य पाठ तुलना और कष्ट का भाव संप्रेषित करता है, जबकि पादटिप्पणी अनिश्चितता को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘भाई-भाई की तरह, भाइयो’ जैसी मूल पुनरुक्ति को हिंदी में उलटकर ‘भाइयो, हम भाई-भाई की तरह’ किया गया है, जिससे अर्थ और वक्तृत्व-बल दोनों स्वाभाविक रहें। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
