lexical_decisions:
- source_word: καθοπλισώμεθα
  choice: हम अपने आपको ... से सुसज्जित करें
  rationale: प्रथम पुरुष बहुवचन का प्रोत्साहनात्मक भाव सुरक्षित रहता है। ‘सुसज्जित करें’ युद्ध-सज्जा के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοιγαροῦν
  choice: इसलिए
  rationale: यह पिछले कथन से निकला निष्कर्ष सूचित करने वाला अव्यय है।
- source_word: τῇ ... παθοκρατίᾳ
  choice: मनोवेगों पर प्रभुत्व से
  rationale: करण कारक उस साधन को बताता है जिससे सुसज्जित होना है। ‘प्रभुत्व’ केवल दमन नहीं, बल्कि मनोवेगों को वश में रखने का अर्थ देता है।
- source_word: τοῦ θείου λογισμοῦ
  choice: ईश्वर-भक्त विवेक से मिलने वाले
  rationale: सम्बन्धकारक को स्रोत के अर्थ में मुख्य पाठ में व्यक्त किया गया है, पर उसका स्वामित्व अथवा कर्तृत्वसूचक अर्थ भी सम्भव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: θείου
  choice: ईश्वर-भक्त
  rationale: यह धार्मिक-नैतिक गुण को व्यक्त करता है और ‘दैवी’ से उत्पन्न किसी अमूर्त तत्त्वमीमांसात्मक संकेत से बचता है।
- source_word: λογισμοῦ
  choice: विवेक
  rationale: इस पुस्तक में यह नैतिक निर्णय करने वाली तर्कशील क्षमता है; आधुनिक हिन्दी में ‘विवेक’ इस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यहूदी नैतिक-दर्शन के सन्दर्भ में θεῖος λογισμός का अनुवाद
  choice: ईश्वर-भक्त विवेक
  alternative: दैवी विवेक
  rationale: चुना हुआ रूप परमेश्वर के प्रति भक्ति से संचालित नैतिक तर्कशीलता को व्यक्त करता है, बिना बाद की तत्त्वमीमांसात्मक या मसीह-विषयक धारणाएँ जोड़े।
- issue: τοῦ θείου λογισμοῦ सम्बन्धकारक का अर्थ
  choice: विवेक से मिलने वाला प्रभुत्व
  alternative: ईश्वर-भक्त विवेक का प्रभुत्व
  rationale: मुख्य पाठ स्रोत का अर्थ स्पष्ट करता है, जबकि यूनानी में प्रभुत्व को विवेक का अपना प्रभुत्व समझना भी सम्भव है; वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
