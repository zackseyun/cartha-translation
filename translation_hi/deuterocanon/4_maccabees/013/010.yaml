translation:
  language: hi
  text: अपनी भक्ति का प्रदर्शन करने में हम कायर न बनें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी भक्ति का प्रदर्शन करते हुए हम साहस न खोएँ।”
    reason: δειλανδρήσωμεν का अर्थ ‘साहस खोना’ भी हो सकता है; ἀπόδειξις के लिए ‘प्रदर्शन’ एक निकटवर्ती वैकल्पिक अभिव्यक्ति है।
lexical_decisions:
- source_word: μὴ
  choice: न
  rationale: यह निषेधवाचक शब्द प्रथम पुरुष बहुवचन के आग्रहसूचक क्रियारूप के साथ है; हिन्दी में ‘हम ... न बनें’ स्वाभाविक है।
- source_word: δειλανδρήσωμεν
  choice: हम कायर न बनें
  rationale: क्रिया का अर्थ कायर होना या साहसहीन व्यवहार करना है। यह अनुवाद उपदेश की नैतिक तीव्रता बनाए रखता है।
- source_word: πρὸς
  choice: में
  rationale: यहाँ πρός अगले संज्ञा-पदबंध के संबंध या क्षेत्र को सूचित करता है; हिन्दी में ‘... करने में’ स्वाभाविक रूप से वही भाव देता है।
- source_word: τὴν ... ἀπόδειξιν
  choice: प्रमाणित करने
  rationale: ἀπόδειξις का अर्थ प्रमाण, प्रदर्शन या प्रत्यक्ष सिद्ध करना हो सकता है। क्रियात्मक हिन्दी पदबंध सहज है और भक्ति को आचरण से सिद्ध करने का भाव रखता है।
- source_word: τῆς εὐσεβίας
  choice: भक्ति
  rationale: εὐσέβεια यहाँ परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुरूप आचरण को व्यक्त करता है। ‘भक्ति’ सामान्य आधुनिक हिन्दी में बोधगम्य है; मूल में स्वामित्व-सूचक सर्वनाम न होने के कारण ‘हमारी’ मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: शहादत के लिए प्रोत्साहन के संदर्भ में εὐσέβεια का अनुवाद
  choice: भक्ति
  alternative: धर्मनिष्ठा; ईश्वर-भक्ति
  rationale: ‘भक्ति’ परमेश्वर के प्रति निष्ठापूर्ण समर्पण का भाव देती है और किसी बाद की तकनीकी धर्मवैज्ञानिक धारणा को आरोपित नहीं करती। ‘धर्मनिष्ठा’ नैतिक आचरण पर अधिक बल दे सकती है, जबकि ‘ईश्वर-भक्ति’ अर्थ को स्पष्ट करती है पर मूल से अधिक स्पष्ट विस्तार है।
- issue: ἀπόδειξις को प्रमाण या प्रदर्शन के रूप में समझना
  choice: प्रमाणित करने
  alternative: प्रकट करने
  rationale: यह चयन निष्ठा को परीक्षा में आचरण द्वारा सिद्ध करने का बल बनाए रखता है। ‘प्रकट करने’ भी संभव है और सार्वजनिक प्रदर्शन के पक्ष को उभारता है; इस वास्तविक अर्थ-संभवता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और आग्रहसूचक शैली। ‘कायर न बनें’ मूल की तीव्र नैतिक भाषा को बनाए रखता है।
