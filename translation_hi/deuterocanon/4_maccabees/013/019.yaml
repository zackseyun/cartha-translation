  yaml_path: translation/deuterocanon/4_maccabees/013/019.yaml
  text: And you are not ignorant of the affections of human nature[a], which the divine and all-wise providence apportioned to those who are born through the fathers, having planted them through the mother's womb;
translation:
  language: hi
  text: और तुम मानव-स्वभाव के स्नेह-बंधनों से अनजान नहीं हो[a], जिन्हें दैवी और सर्वबुद्धिमान व्यवस्था ने पिताओं के द्वारा जन्म लेनेवालों को बाँटा और मातृगर्भ में उन्हें रोपकर दिया;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मानवता के स्वाभाविक स्नेह’ अथवा ‘मानवीय लगाव।’ यूनानी शब्द φίλτρα यहाँ जादुई तावीज़ों या प्रेम-मंत्रों के लिए नहीं, बल्कि स्नेह के प्रबल बंधनों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἀγνοεῖτε
  choice: तुम ... से अनजान नहीं हो
  rationale: निषेधात्मक अभिव्यक्ति मूल के प्रत्यक्ष संबोधन और आलंकारिक बल को बनाए रखती है; ‘तुम नहीं जानते’ अर्थ को उलट देता।
- source_word: τὰ τῆς ἀνθρωπότητος φίλτρα
  choice: मानव-स्वभाव के स्नेह-बंधन
  rationale: φίλτρα यहाँ जादुई आकर्षण नहीं, बल्कि मनुष्य होने से जुड़े प्रबल भावनात्मक लगाव या बंधन हैं। ‘स्नेह-बंधन’ भाव और बंधन दोनों पहलुओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνθρωπότητος
  choice: मानव-स्वभाव
  rationale: संदर्भ समस्त मानव-समुदाय से अधिक मनुष्य होने के स्वाभाविक गुण और भावनाओं की ओर संकेत करता है।
- source_word: θεία καὶ πάνσοφος πρόνοια
  choice: दिव्य और सर्वबुद्धिमान विधान
  rationale: ‘विधान’ πρόνοια में निहित बुद्धिमत्तापूर्ण दैवी व्यवस्था और देखरेख को व्यक्त करता है, जबकि ‘दिव्य’ और ‘सर्वबुद्धिमान’ दोनों यूनानी विशेषणों को सुरक्षित रखते हैं।
- source_word: ἔμερισεν
  choice: बाँटा
  rationale: क्रिया का आशय उचित अंश देना या वितरित करना है; ‘बाँटा’ सामान्य पाठक के लिए सहज रहते हुए इस अर्थ को रखता है।
- source_word: τοῖς γεννωμένοις
  choice: जन्म लेनेवालों को
  rationale: यह वर्तमान कृदन्त के सामान्य और समूहवाचक अर्थ को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: διὰ τῶν πατέρων
  choice: पिताओं के माध्यम से
  rationale: मूल में पिता-पक्ष का स्पष्ट उल्लेख है; उसे सामान्यीकृत करके केवल ‘माता-पिता’ नहीं किया गया।
- source_word: φυτεύσασα
  choice: रोपा
  rationale: जीवन और स्नेह को गर्भ में पौधे की तरह स्थापित करने की मूल रूपकात्मक छवि सुरक्षित रखी गई है।
- source_word: διὰ τῆς μητρῴας γαστρός
  choice: माता के गर्भ के माध्यम से
  rationale: यह मातृ-गर्भ के स्पष्ट उल्लेख और διά के माध्यमसूचक भाव दोनों को निकटता से व्यक्त करता है।
theological_decisions:
- issue: πρόνοια का दार्शनिक-धार्मिक अर्थ
  choice: विधान
  alternative: पूर्वचिन्ता / देखरेख
  rationale: ‘विधान’ दैवी बुद्धि द्वारा व्यवस्थित संचालन का भाव देता है, पर किसी बाद की विशिष्ट सम्प्रदायगत परिभाषा को आरोपित नहीं करता।
- issue: पिता और माता की जनन-संबंधी भूमिकाओं का पृथक उल्लेख
  choice: ‘पिताओं के माध्यम से’ और ‘माता के गर्भ के माध्यम से’ दोनों को बनाए रखना
  alternative: ‘माता-पिता के द्वारा’ कहकर सामान्यीकृत करना
  rationale: यूनानी पाठ पिता और मातृ-गर्भ का अलग-अलग उल्लेख करता है; इस तनावपूर्ण और कुछ असामान्य रचना को मिटाना स्रोत से अनावश्यक विचलन होता।
