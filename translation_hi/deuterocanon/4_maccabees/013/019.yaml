  register: भाषा आधुनिक मानक हिन्दी में है, पर 4 मकाबियों की उन्नत आलंकारिक शैली के अनुरूप गरिमापूर्ण रखी गई है। ‘सर्वबुद्धिमान विधान’ कुछ औपचारिक है, किन्तु πάνσοφος πρόνοια की दार्शनिक-धार्मिक गंभीरता को साधारण पाठक के लिए पर्याप्त स्पष्टता से बनाए रखता है।
