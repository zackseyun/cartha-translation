translation:
  language: hi
  text: क्योंकि परमेश्वर-भक्ति के साथ-साथ वह उनके लिए भाइयों के परस्पर प्रेम को अधिक प्रिय बनाती जा रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν
  choice: के साथ-साथ
  rationale: यह पूर्वसर्ग संगति का भाव व्यक्त करता है; हिन्दी में यह प्रयोग दोनों सद्गुणों के साथ विकसित किए जाने को स्वाभाविक ढंग से दर्शाता है।
- source_word: εὐσεβείᾳ
  choice: परमेश्वर-भक्ति
  rationale: यहाँ शब्द का आशय परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा से है। ‘परमेश्वर-भक्ति’ धार्मिक दिशा को स्पष्ट रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: ποθεινοτέραν
  choice: और भी अधिक प्रिय
  rationale: ποθεινός का तुलनात्मक रूप चाहने योग्य, लालायित करने वाला या अत्यन्त प्रिय होने का भाव रखता है। ‘और भी अधिक प्रिय’ तुलनात्मक बल को बनाए रखता है; ‘भी’ को σὺν... के साथ समवर्ती गुण-वृद्धि के हिन्दी मुहावरे के रूप में लिया गया है, न कि अलग यूनानी कण के अनुवाद के रूप में।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: 'सम्प्रदान कारक उनके दृष्टिकोण या अनुभव के संदर्भ को बताता है: भाईचारे का प्रेम उन्हें अधिक प्रिय होता गया।'
- source_word: κατεσκεύαζεν
  choice: बनाती जा रही थी
  rationale: अपूर्ण भूतकाल निरन्तर या क्रमिक क्रिया का संकेत देता है। यह पद चरित्र को गढ़ने के प्रसंग में ‘लगातार अधिक प्रिय बनाना’ व्यक्त करता है।
- source_word: φιλαδελφίαν
  choice: भाईचारे का प्रेम
  rationale: तात्कालिक संदर्भ में ये वास्तविक भाई हैं। यह अनुवाद पारिवारिक विशिष्टता को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: सद्गुण के रूप में εὐσέβεια का अनुवाद
  choice: परमेश्वर-भक्ति
  alternative: भक्ति; धर्मपरायणता; श्रद्धा
  rationale: इस ग्रन्थ में यह सद्गुण परमेश्वर के प्रति निष्ठा और भक्तिपूर्ण जीवन को सूचित करता है। ‘परमेश्वर-भक्ति’ इसकी ईश्वराभिमुखता स्पष्ट करती है, पर किसी सम्प्रदाय-विशेष की धारणा नहीं जोड़ती।
- issue: ποθεινοτέραν के तुलनात्मक बल की अभिव्यक्ति
  choice: और भी अधिक प्रिय
  alternative: अधिक प्रिय; अधिक चाहने योग्य
  rationale: यूनानी तुलनात्मक रूप ‘अधिक’ की माँग करता है। हिन्दी में ‘और भी अधिक प्रिय’ उस बढ़ती हुई आत्मीय चाह को स्वाभाविक रूप से व्यक्त करता है, यद्यपि यूनानी में ‘भी’ के लिए पृथक कण नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। स्त्रीलिंग कर्ता को पूर्ववर्ती प्रसंग की माता के अनुरूप ‘वह’ से बनाए रखा गया है।
