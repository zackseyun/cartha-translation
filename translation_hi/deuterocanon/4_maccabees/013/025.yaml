lexical_decisions:
- source_word: ὁμόγνοια
  choice: एक-मनता
  rationale: यह शब्द समान मनोभाव या साझा दृष्टिकोण को व्यक्त करता है। ‘एक-मनता’ इस आंतरिक समानता को बनाए रखता है और आगे आने वाले ὁμόνοια के अनुवाद ‘मेल’ से भेद भी रखता है।
- source_word: καλοκἀγαθίας
  choice: श्रेष्ठता और भलाई
  rationale: यह संक्षिप्त यूनानी पद नैतिक श्रेष्ठता और भलाई के संयुक्त आदर्श को सूचित करता है। दोनों पहलुओं को स्पष्ट रखने के लिए इसे केवल ‘सद्गुण’ कहकर संक्षिप्त नहीं किया गया।
- source_word: ἐπέτεινεν
  choice: और भी दृढ़ कर दिया
  rationale: क्रिया का मूल भाव खींचकर बढ़ाने या तीव्र करने का है। संबंधों के संदर्भ में ‘और भी दृढ़ कर दिया’ स्वाभाविक रूप से बढ़ती हुई शक्ति को व्यक्त करता है।
- source_word: ὁμόνοιαν
  choice: मेल
  rationale: यह पारस्परिक सहमति, एकता या सामंजस्य को दर्शाता है। ‘मेल’ सरल और स्वाभाविक हिन्दी है तथा पहले आए ὁμόγνοια के ‘एक-मनता’ से अलग अर्थ-छाया बनाए रखता है।
- source_word: πρὸς ἀλλήλους
  choice: आपसी
  rationale: यह पारस्परिक संबंध को व्यक्त करता है; ‘आपसी मेल’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
