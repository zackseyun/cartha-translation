  yaml_path: translation/deuterocanon/4_maccabees/013/011.yaml
  text: And one said[a], “Take courage, brother,” while another said, “Endure nobly.”
translation:
  language: hi
  text: और एक ने कहा[a], “भाई, साहस रखो,” जबकि दूसरे ने कहा, “गरिमा के साथ धीरज धरो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “एक कहता था ... पर दूसरा ...”; इससे भाइयों में क्रमशः बोलने वाले अलग-अलग व्यक्तियों का संकेत मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρρει
  choice: साहस रखो
  rationale: यह आज्ञार्थक क्रिया उत्साह और निर्भीकता का आह्वान करती है। ‘साहस रखो’ स्वाभाविक आधुनिक हिन्दी में इसके प्रोत्साहनात्मक बल को बनाए रखता है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: यह पुल्लिंग एकवचन संबोधन है और प्रसंग में सगे भाइयों में से एक को संबोधित करता है।
- source_word: Εὐγενῶς
  choice: गरिमा के साथ
  rationale: यह क्रिया-विशेषण धीरज धरने के सम्मानपूर्ण, उदात्त ढंग को व्यक्त करता है। ‘गरिमा के साथ’ केवल वीरता नहीं, बल्कि नैतिक प्रतिष्ठा का भाव भी सुरक्षित रखता है।
- source_word: καρτέρησον
  choice: धीरज धरो
  rationale: यह आज्ञार्थक रूप पीड़ा में दृढ़तापूर्वक टिके रहने का आह्वान करता है। ‘धीरज धरो’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ὁ μέν ... ὁ δέ
  choice: एक ... दूसरे
  rationale: यह सहसंबंधी रचना दो वक्ताओं में भेद करती है। हिन्दी में ‘एक ... दूसरे’ अनुपस्थित संज्ञा को जोड़े बिना अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔλεγεν
  choice: ने कहा
  rationale: यूनानी अपूर्णकाल निरंतर या बार-बार कहने का संकेत दे सकता है, पर यहाँ संवादात्मक कथन में सामान्य भूतकाल अधिक स्वाभाविक है; अवधि पर विशेष बल नहीं है।
