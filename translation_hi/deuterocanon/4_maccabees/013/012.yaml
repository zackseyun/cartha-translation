  yaml_path: translation/deuterocanon/4_maccabees/013/012.yaml
  text: But he kept saying[a], “Remember from whom you come, and by what father's hand you are to be slaughtered.”
translation:
  language: hi
  text: पर वह बार-बार कहता था, “याद रखो कि तुम कहाँ से हो[a], या किस पिता के हाथ से तुम्हारा वध किया जाना है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याद रखो कि तुम किस वंश से हो।” यूनानी अभिव्यक्ति सामान्यतः उद्गम-स्थान पूछ सकती है, पर यहाँ संदर्भ वंश और पारिवारिक पहचान की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔλεγεν
  choice: पर वह बार-बार कहता था
  rationale: δέ प्रसंग में मोड़ दिखाता है, और अपूर्णकाल ἔλεγεν चलती या दोहराई जाती वाणी का संकेत दे सकता है; इसलिए केवल ‘उसने कहा’ के बजाय ‘बार-बार कहता था’ रखा गया है।
- source_word: Μνήσθητε
  choice: याद रखो
  rationale: आज्ञार्थक रूप के सीधे और स्वाभाविक बल को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πόθεν ἐστέ
  choice: तुम कहाँ से हो
  rationale: πόθεν का प्रत्यक्ष अर्थ स्थान या उद्गम के विषय में ‘कहाँ से’ है। संदर्भ में यह वंशगत मूल की ओर भी संकेत कर सकता है; उस अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἢ
  choice: या
  rationale: यूनानी संयोजक ἢ का सामान्य और प्रत्यक्ष अर्थ ‘या’ है। अंग्रेज़ी परामर्श-पाठ के ‘and’ को मूल पाठ पर प्राथमिकता नहीं दी गई।
- source_word: τίνος πατρὸς χειρὶ
  choice: किस पिता के हाथों
  rationale: τίνος पहचान के विषय में प्रश्न करता है, πατρός ‘पिता’ है, और χειρί कर्ता अथवा माध्यम को चित्रात्मक ढंग से ‘हाथों’ द्वारा व्यक्त करता है।
- source_word: σφαγιασθῆναι
  choice: तुम्हारा वध होना है
  rationale: क्रिया हिंसक ढंग से मार डालने या वध करने का बोध देती है। ‘वध’ उसकी तीव्रता बनाए रखता है, पर अनिवार्य रूप से कोई अतिरिक्त बलिदानी धर्मार्थ नहीं जोड़ता।
theological_decisions:
- issue: πόθεν ἐστέ में स्थान और वंश के बीच अर्थगत तनाव
  choice: मुख्य पाठ में ‘तुम कहाँ से हो’
  alternative: ‘तुम किस वंश से हो’ या ‘तुम किनसे उत्पन्न हुए हो’
  rationale: मुख्य पाठ यूनानी अभिव्यक्ति के सामान्य अर्थ को बनाए रखता है, जबकि शहीदी और पैतृक उदाहरण के संदर्भ में संभावित वंशगत संकेत पादटिप्पणी में दिया गया है।
- issue: σφαγιασθῆναι का बलिदानी अथवा सामान्य हिंसक अर्थ
  choice: ‘वध होना’
  alternative: ‘बलि किया जाना’ या ‘मार डाला जाना’
  rationale: ‘वध’ मूल क्रिया की कठोरता को बनाए रखता है, लेकिन संदर्भ से अधिक विशिष्ट बलिदानी धर्मशास्त्र आरोपित नहीं करता।
- issue: ἢ का संबंधसूचक बल
  choice: ‘या’
  alternative: ‘और’
  rationale: प्रदत्त यूनानी पाठ में ἢ स्पष्ट रूप से वैकल्पिक संयोजक है। वाक्य की असामान्य संक्षिप्तता को किसी व्याख्यात्मक ‘और’ से चुपचाप समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘बार-बार कहता था’ अपूर्णकालीन पक्ष को, ‘किस पिता के हाथों’ मूल की सजीव छवि को, और ‘वध’ हिंसक क्रिया की तीव्रता को सुरक्षित रखता है। प्रदत्त यूनानी पाठ की संक्षिप्त और कुछ असामान्य वाक्यरचना को अत्यधिक व्याख्या से नहीं भरा गया है।
