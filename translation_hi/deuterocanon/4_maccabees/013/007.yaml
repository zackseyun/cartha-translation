base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/007.yaml
  text: Thus the seven-towered blessedness of the young men[a], having fortified the harbor of godliness, conquered the licentiousness of the passions.
translation:
  language: hi
  text: इस प्रकार उन युवकों की सात बुर्जोंवाली सद्बुद्धि[a] ने ईश्वर-भक्ति के बंदरगाह को किलेबंद करके मनोविकारों की उच्छृंखलता पर विजय पाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युवकों का सात परकोटोंवाला सद्विवेक”; अधिक भावार्थ के साथ, “सात युवकों का दृढ़ सद्विवेक।” यूनानी वाक्यांश अत्यंत रूपकात्मक है।
    reason: दुर्लभ संज्ञा εὐλογιστία और यौगिक विशेषण ἑπτάπυργος के अर्थ तथा सात युवकों की ओर संकेत की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἑπτάπυργος
  choice: सात बुर्जोंवाली
  rationale: यौगिक विशेषण का शाब्दिक दुर्ग-चित्र सुरक्षित रहता है और सात युवकों की ओर संभावित संकेत भी बना रहता है।
- source_word: εὐλογιστία
  choice: सद्बुद्धि
  rationale: यह दुर्लभ संज्ञा प्रशंसनीय, उचित विचारशीलता को व्यक्त करती है। ‘सद्बुद्धि’ हिन्दी में स्वाभाविक है और पुस्तक में तर्क-बुद्धि तथा मनोविकारों के संघर्ष के संदर्भ से मेल खाती है।
- source_word: νεανίσκων
  choice: युवकों
  rationale: पुल्लिंग बहुवचन को सहज आधुनिक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: ὀχυρώσασα
  choice: किलेबंद करके
  rationale: मूल के सैन्य और दुर्ग-संबंधी बिंब को बनाए रखता है।
- source_word: λιμένα
  choice: बंदरगाह
  rationale: मूल अर्थ और आश्रय-स्थल के रूपक, दोनों को स्पष्ट रखता है।
- source_word: εὐσεβείας
  choice: ईश्वर-भक्ति
  rationale: यहाँ परमेश्वर और उसकी व्यवस्था के प्रति श्रद्धापूर्ण निष्ठा अभिप्रेत है; ‘ईश्वर-भक्ति’ आधुनिक पाठक के लिए धार्मिक आयाम स्पष्ट करती है।
- source_word: παθῶν
  choice: मनोविकारों
  rationale: दार्शनिक-नैतिक संदर्भ में यह अनियंत्रित भावों और आवेगों को सूचित करता है, केवल शारीरिक दुःखों या यौन वासनाओं को नहीं।
- source_word: ἀκολασίαν
  choice: उच्छृंखलता
  rationale: असंयम और बेलगाम भोग-प्रवृत्ति का व्यापक अर्थ देता है, बिना इसे केवल यौन दुराचार तक सीमित किए।
- source_word: ἐνίκησεν
  choice: विजय पाई
  rationale: मूल क्रिया के विजयी और सैन्य भाव को दुर्ग-रूपक के अनुरूप बनाए रखता है।
theological_decisions:
- issue: ἡ ἑπτάπυργος τῶν νεανίσκων εὐλογιστία का अत्यंत रूपकात्मक अनुवाद
  choice: उन युवकों की सात बुर्जोंवाली सद्बुद्धि
  alternative: सात युवकों का दृढ़ सद्विवेक
  rationale: मुख्य पाठ मूल की असामान्य दुर्ग-छवि और व्याकरणिक संबंध को सुरक्षित रखता है। अधिक व्याख्यात्मक विकल्प सात भाइयों के सामूहिक दृढ़ निश्चय को सामने लाता है, पर मूल रूपक को समतल कर देता है।
- issue: εὐσεβεία का धार्मिक आशय
  choice: ईश्वर-भक्ति
  alternative: धर्मनिष्ठा
  rationale: इस ग्रंथ में यह गुण परमेश्वर और उसकी व्यवस्था के प्रति श्रद्धापूर्ण निष्ठा से जुड़ा है। ‘ईश्वर-भक्ति’ उस धार्मिक केंद्र को स्पष्ट रखती है, जबकि ‘धर्मनिष्ठा’ कुछ अधिक व्यापक हो सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बुर्जोंवाली’, ‘बंदरगाह’ और ‘किलेबंद’ मूल की संयुक्त दुर्ग तथा सुरक्षित आश्रय की छवि को जानबूझकर बनाए रखते हैं; वाक्य की काव्यात्मक असामान्यता स्रोत की अलंकारिक शैली का भाग है।
