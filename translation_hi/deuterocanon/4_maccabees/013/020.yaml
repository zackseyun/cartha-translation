lexical_decisions:
- source_word: ἐν ᾗ
  choice: जिसमें
  rationale: स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम का संबंध पिछले प्रसंग के किसी स्त्रीलिंग पूर्वपद से है। इस खंड में वह पूर्वपद नहीं है, इसलिए ‘जिसमें’ संबंध को बनाए रखते हुए उसकी पहचान निर्धारित नहीं करता।
- source_word: ἀδελφοὶ
  choice: भाई
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है और यहाँ सगे पुरुष भाई अभिप्रेत हैं।
- source_word: τὸν ἴσον ... χρόνον
  choice: समान अवधि तक
  rationale: यह पदबंध समय की बराबर अवधि व्यक्त करता है; ‘समान अवधि तक’ हिंदी में स्वाभाविक और अर्थ-सटीक है।
- source_word: κατοικήσαντες
  choice: रहे
  rationale: क्रिया का मूल भाव निवास करने या रहने का है; ‘रहे’ संक्षिप्त और सहज है।
- source_word: ἐν τῷ αὐτῷ χρόνῳ
  choice: एक ही समय में
  rationale: यह एक साथ होने या एक ही काल में होने का भाव सुरक्षित रखता है।
- source_word: πλασθέντες
  choice: आकार पाए
  rationale: निष्क्रिय कृदंत रचे या गढ़े जाने का संकेत देता है, संभवतः गर्भ में निर्माण का; ‘आकार पाए’ हिंदी में सहज रहते हुए इस भाव को बनाए रखता है।
- source_word: ἀπὸ τοῦ αὐτοῦ αἵματος
  choice: एक ही रक्त से
  rationale: समान जैविक उद्गम की ठोस रक्त-छवि को बिना रूपक बदलकर सुरक्षित रखा गया है।
- source_word: αὐξηθέντες
  choice: बढ़े
  rationale: कृदंत वृद्धि और विकास व्यक्त करता है; ‘बढ़े’ सीधा और प्रसंगानुकूल है।
- source_word: διὰ τῆς αὐτῆς
  choice: और उसी…
  rationale: उपलब्ध यूनानी पाठ स्त्रीलिंग ‘उसी’ के बाद अपेक्षित संज्ञा के बिना बीच वाक्य में समाप्त हो जाता है। हिंदी में भी अपूर्णता रखी गई है, न कि लुप्त शब्द की कल्पना की गई।
