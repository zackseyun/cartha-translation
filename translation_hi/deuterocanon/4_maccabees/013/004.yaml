lexical_decisions:
- source_word: οὐκ ἔστιν παριδεῖν
  choice: अनदेखी करना असम्भव है
  rationale: यह यूनानी अवैयक्तिक रचना किसी बात की उपेक्षा कर सकने की असम्भवता व्यक्त करती है; आधुनिक हिन्दी में यह सहज और अर्थनिष्ठ है।
- source_word: ἡγεμονίαν
  choice: शासन
  rationale: यह शब्द नेतृत्व, शासन या नियंत्रक अधिकार का बोध कराता है; प्रसंग में बुद्धि की नियामक सत्ता अभिप्रेत है।
- source_word: τῆς διανοίας
  choice: बुद्धि
  rationale: διάνοια मन, समझ या विवेकशील विचार-शक्ति को सूचित कर सकता है। यहाँ नैतिक निर्णय करने और मनोविकारों को नियंत्रित करने वाली शक्ति प्रमुख है; हिन्दी में ‘बुद्धि’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἐπεκράτησαν
  choice: विजय पाई
  rationale: क्रिया का अर्थ अधिक शक्तिशाली सिद्ध होना या किसी पर प्रबल होना है; ‘पर विजय पाई’ दोनों पर प्रभुत्व का स्पष्ट, स्वाभाविक हिन्दी रूप है।
- source_word: πάθους
  choice: मनोविकार
  rationale: इस दार्शनिक प्रसंग में πάθος केवल कष्ट नहीं, बल्कि मन को प्रभावित करने वाली आवेगात्मक प्रवृत्ति है। ‘मनोविकार’ इसे बाहरी पीड़ा से अलग रखता है।
- source_word: πόνων
  choice: पीड़ाओं
  rationale: बहुवचन πόνοι यहाँ यातना से उत्पन्न शारीरिक कष्टों की ओर संकेत करता है; ‘पीड़ाओं’ अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: καὶ πάθους καὶ πόνων
  choice: मनोविकार और पीड़ाओं—दोनों पर
  rationale: दोहराए गए καὶ की सहसंबंधी संरचना को ‘दोनों’ द्वारा स्पष्ट किया गया है, जिससे आन्तरिक आवेग और बाहरी शारीरिक पीड़ा के दो क्षेत्र सुरक्षित रहते हैं।
theological_decisions:
- issue: διάνοια को ऐसी हिन्दी में प्रस्तुत करना जो ग्रन्थ में बुद्धि द्वारा मनोविकारों पर शासन की दार्शनिक धारणा को बनाए रखे
  choice: बुद्धि
  alternative: मन; समझ; विवेक
  rationale: ‘बुद्धि’ विचार और निर्णय की शासक क्षमता को सामने लाती है, पर इसे किसी बाद की सम्प्रदायगत मानव-विज्ञान संबंधी धारणा से नहीं बाँधती। ‘मन’ सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘बुद्धि के शासन’ मूल की दार्शनिक भाषा को बनाए रखता है, जबकि ‘मनोविकार’ और ‘पीड़ाएँ’ आन्तरिक आवेग तथा बाहरी कष्ट के भेद को स्पष्ट रखते हैं।
