base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/027.yaml
  text: But likewise[a], although nature and custom and the dispositions of virtue were drawing together for them the affections of brotherhood, those who were left behind endured, because of piety, as they watched their brothers, being tortured to death, objects of pity[b].
translation:
  language: hi
  text: पर उसी प्रकार, यद्यपि स्वभाव, रीति और सद्गुण के नैतिक स्वभाव उन्हें भाईचारे के स्नेह से बाँध रहे थे,[a] फिर भी जो शेष रह गए थे, उन्होंने धर्मनिष्ठा के कारण करुणा जगाते अपने भाइयों को मृत्यु तक यातना पाते देखते हुए सहन किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाईचारे के स्नेह’ का अनुवाद ‘भाईचारे के स्नेह-बंधन’ या ‘भाईचारे के प्रेम’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी वाक्य कई कृदंतों को संक्षिप्त रूप में जोड़ता है। अधिक शाब्दिक क्रम है: ‘जो शेष रह गए थे, उन्होंने धर्मनिष्ठा के कारण, अपने भाइयों को करुणा जगाते हुए मृत्यु तक यातना पाते देखते हुए, सहन किया।’'
    reason: compressed_syntax
lexical_decisions:
- source_word: φίλτρα
  choice: स्नेह-बंधन
  rationale: यहाँ शब्द का अर्थ जादुई ‘मोहक वस्तुओं’ से नहीं, बल्कि भाईचारे से उत्पन्न गहरे भावनात्मक लगाव और बंधनों से है। ‘स्नेह-बंधन’ दोनों पहलुओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συναξόντων
  choice: एक साथ दृढ़ कर रहे थे
  rationale: क्रिया में साथ लाने या एकत्र करने का भाव है। इस प्रसंग में स्वभाव, रीति और सद्गुणी चरित्र मिलकर भाईचारे के स्नेह को प्रबल करते हैं; इसलिए यह रूप शाब्दिक आधार और आशय दोनों को रखता है।
- source_word: ἀνέσχοντο
  choice: सह लिया
  rationale: यह क्रिया तीव्र भावनात्मक पीड़ा के बीच सहन करने का भाव देती है। हिन्दी वाक्य में ‘यह सह लिया कि ... देखें’ उसके कर्म-संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: 4 मकाबियों में यह परमेश्वर और उसकी व्यवस्था के प्रति श्रद्धापूर्ण निष्ठा का प्रमुख नैतिक-धार्मिक शब्द है। ‘भक्ति’ साधारण आधुनिक हिन्दी में बोधगम्य है और किसी विशिष्ट सम्प्रदाय की शब्दावली नहीं थोपता।
- source_word: οἱ ὑπολελειμμένοι
  choice: जो भाई अभी शेष थे
  rationale: यह उन भाइयों को बताता है जिन्हें उस समय तक मारा नहीं गया था। ‘अभी’ प्रसंगगत अस्थायित्व व्यक्त करता है और ‘बचे हुए’ से अंतिम रूप से जीवित बच जाने का भ्रम टालता है।
- source_word: κατοικτιζομένους
  choice: दया के पात्र
  rationale: निष्क्रिय कृदंत उन यातना सहते भाइयों को करुणा या दया जगाने वाले बताता है। ‘दया के पात्र’ इस अर्थ को संक्षेप में सुरक्षित रखता है।
- source_word: μέχρι θανάτου βασανιζομένους
  choice: मृत्यु तक यातना पाते
  rationale: वाक्यांश ऐसी यातना बताता है जो मृत्यु की सीमा तक चलती है। ‘मृत्यु तक’ मूल की सीमा-सूचक अभिव्यक्ति को ‘यातना देकर मार डालना’ जैसे अधिक निर्णायक रूप में बदले बिना रखता है।
- source_word: τῶν τῆς ἀρετῆς ἠθῶν
  choice: सद्गुणी चरित्र
  rationale: ἤθη यहाँ सद्गुण से बने नैतिक स्वभाव या चरित्रगत गुणों को सूचित करता है। ‘सद्गुणी चरित्र’ हिन्दी में सहज है और συνηθείας के लिए प्रयुक्त ‘रीति’ से अनावश्यक पुनरुक्ति नहीं करता।
- source_word: συνηθείας
  choice: रीति
  rationale: शब्द आदत, प्रचलित व्यवहार या परिचित संगति का अर्थ दे सकता है। ‘रीति’ इस व्यापकता को संक्षेप में रखती है, यद्यपि ‘साथ रहने की आदत’ भी प्रसंगानुकूल सम्भव है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: भक्ति
  alternative: ईश्वर-परायणता; श्रद्धापूर्ण निष्ठा
  rationale: यहाँ सहनशीलता परमेश्वर और उसकी व्यवस्था के प्रति निष्ठा से उत्पन्न होती है। ‘भक्ति’ इस धार्मिक प्रेरणा को स्पष्ट रखती है, पर बाद की किसी विशिष्ट धर्मशास्त्रीय परिभाषा को नहीं जोड़ती।
- issue: भाईचारे की भाषा का लिंग-सटीक रूप
  choice: भाईचारा / भाई
  alternative: बंधुत्व / सहोदर
  rationale: मूल में ἀδελφότης और ἀδελφοί हैं तथा प्रसंग वास्तविक भाइयों का है। इसलिए सामान्य आधुनिक हिन्दी में ‘भाईचारा’ और ‘भाई’ रखना अर्थ और लिंग-संदर्भ दोनों के प्रति सटीक है।
- issue: भक्ति और पारिवारिक स्नेह के बीच तनाव
  choice: ‘फिर भी’ द्वारा दोनों प्रेरणाओं का वास्तविक तनाव बनाए रखा
  alternative: भक्ति ने पारिवारिक स्नेह को दबा दिया
  rationale: मूल यह नहीं कहता कि भाईचारे का प्रेम समाप्त हो गया; उलटे वह प्रबल था, और उसी के बावजूद भक्ति के कारण उन्होंने दृश्य सहा। अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भक्ति’, ‘स्नेह-बंधन’ और ‘दया के पात्र’ जैसे परिचित शब्द मूल की नैतिक तथा भावनात्मक गंभीरता बनाए रखते हैं। लम्बे यूनानी वाक्य को एक ही हिन्दी वाक्य में रखा गया है, पर ‘यद्यपि ... फिर भी’ और ‘यह सह लिया कि’ के सहारे उसका तर्क-संबंध स्पष्ट किया गया है।
