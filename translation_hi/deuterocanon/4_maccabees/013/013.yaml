theological_decisions:
- issue: εὐσέβεια को इस पुस्तक के केंद्रीय सद्गुण के रूप में व्यक्त करना
  choice: ईश्वर-भक्ति
  alternative: धर्मपरायणता; भक्ति
  rationale: ‘ईश्वर-भक्ति’ निष्ठा को सामान्य धार्मिकता तक सीमित न करके स्पष्टतः परमेश्वर की ओर उन्मुख रखता है।
- issue: τὰς ψυχάς में ψυχή का अर्थ
  choice: जीवन
  alternative: आत्माएँ; प्राण
  rationale: यहाँ वक्ता परमेश्वर से मिले जीवन को शहादत में अर्पित करने को तैयार हैं। ‘आत्माएँ’ कहना संभव है, पर वह ऐसा विशिष्ट देह-आत्मा संबंधी दावा सुझा सकता है जिसकी प्रसंग को आवश्यकता नहीं; मूल की अर्थ-सम्भावना पादटिप्पणी में दी गई है।
- issue: व्यवस्था के प्रति φυλακή का स्वरूप
  choice: व्यवस्था की चौकसी
  alternative: व्यवस्था का पालन; व्यवस्था की रक्षा
  rationale: यह चयन सजग निष्ठा और पहरेदारी के मूल बिंब को रखता है, बिना इसे केवल आज्ञापालन या किसी संप्रदायगत धारणा में बदलने के।
