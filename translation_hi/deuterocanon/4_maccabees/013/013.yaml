base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/013.yaml
  text: Because of godliness Isaac endured[a]. And each one, while looking at the others, all together cheerful and very courageous, said[c][b], “Let us dedicate ourselves to God with our whole heart—to the one who gave us our lives—and let us use our bodies to keep watch over the law.”
translation:
  language: hi
  text: परमेश्वर-भक्ति के कारण इसहाक ने धीरज से सहा[a]। और वे सब एक-दूसरे की ओर देखते हुए, प्रसन्न और अत्यन्त साहसी होकर, एक साथ कहने लगे, “आओ, हम अपने पूरे हृदय से स्वयं को परमेश्वर को—जिसने हमें जीवन दिया है[b]—समर्पित कर दें, और व्यवस्था की रक्षा में अपने शरीरों का उपयोग करें[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर-भक्ति’ के स्थान पर ‘धर्मपरायणता’ भी सम्भव है। यूनानी εὐσέβεια परमेश्वर के प्रति श्रद्धा और निष्ठापूर्ण आचरण, दोनों का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जिसने प्राण/आत्माएँ दीं।’ यूनानी ψυχή का अर्थ ‘जीवन’, ‘प्राण’ या ‘आत्मा’ हो सकता है; यहाँ प्रसंग में ‘जीवन’ सम्भवतः अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात, ‘व्यवस्था की रखवाली में अपने शरीरों को लगाएँ।’ यूनानी में सजग पहरेदारी का बिंब है, केवल सामान्य ‘पालन’ का नहीं।
    reason: lexical_alternative
