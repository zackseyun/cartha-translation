- source_word: ἐφορῶντες ... ἀλλήλους
  choice: एक-दूसरे की ओर देख रहा था
  rationale: यह परस्पर देखने के भाव को सुरक्षित रखता है। आरम्भिक ‘हर एक’ के साथ एकवचन और अगले उपवाक्य में सामूहिक बहुवचन यूनानी वाक्य की गति को दर्शाते हैं।
- source_word: φαιδροὶ καὶ μάλα θαρραλέοι
  choice: प्रसन्न और अत्यन्त साहसी
  rationale: φαιδρός के उजले अथवा प्रसन्न मुखभाव और μάλα द्वारा तीव्र किए गए साहस—दोनों को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ἀφιερώσωμεν ἑαυτούς
  choice: स्वयं को ... समर्पित कर दें
  rationale: यह स्वेच्छापूर्ण अर्पण का गंभीर भाव रखता है, पर अत्यधिक पारिभाषिक धार्मिक शब्दावली से बचता है।
- source_word: τῷ δόντι τὰς ψυχάς
  choice: जिसने हमें जीवन दिया है
  rationale: ψυχή का अर्थ ‘प्राण/जीवन’ या ‘आत्मा’ हो सकता है। शहादत के प्रसंग में जीवनदाता परमेश्वर का भाव प्रमुख है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: χρήσωμεν ... τὰ σώματα
  choice: अपने शरीरों का उपयोग करें
  rationale: χράομαι के ‘किसी साधन का उपयोग करना’ अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῇ περὶ τὸν νόμον φυλακῇ
  choice: व्यवस्था की चौकसी करने के लिए
