  text: For great is the struggle of the soul and the danger laid up in eternal torment for those who transgress the commandment of God.
translation:
  language: hi
  text: क्योंकि आत्मा का संघर्ष बड़ा है, और परमेश्वर की आज्ञा का उल्लंघन करनेवालों के लिए अनन्त यातना में रखा हुआ खतरा भी बड़ा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχῆς ἀγὼν
  choice: आत्मा का संघर्ष
  rationale: यह पदबंध आत्मा से संबंधित गंभीर संघर्ष को व्यक्त करता है; ‘संघर्ष’ ἀγών के प्रतियोगिता/मुकाबले के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κίνδυνος
  choice: खतरा
  rationale: इसका सीधा अर्थ संकट या खतरा है; आधुनिक सामान्य हिन्दी में ‘खतरा’ सबसे स्पष्ट है।
- source_word: ἐν αἰωνίῳ βασάνῳ κείμενος
  choice: अनन्त यातना में पड़ा हुआ
  rationale: κείμενος के ‘स्थित/पड़ा हुआ’ भाव और ἐν के स्थान-संबंध को बनाए रखा गया है; इसे भविष्य के दंड के रूप में अधिक स्पष्ट करके मूल की तनावपूर्ण संरचना को नहीं सुलझाया गया।
- source_word: παραβαίνουσι τὴν ἐντολὴν τοῦ θεοῦ
  choice: परमेश्वर की आज्ञा का उल्लंघन करनेवालों
  rationale: παραβαίνω के सीमा या आदेश लाँघने के अर्थ को ‘उल्लंघन करना’ ठीक और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: αἰωνίῳ βασάνῳ की अवधि और स्वरूप
  choice: अनन्त यातना
  alternative: युगान्तकारी यातना / चिरस्थायी यातना
  rationale: αἰώνιος का यहाँ स्वाभाविक अर्थ स्थायी या अनन्त है; ‘अनन्त यातना’ मूल के दंड-विषयक कथन को बिना सांप्रदायिक व्याख्या जोड़े व्यक्त करता है।
- issue: κείμενος का संबंध
  choice: खतरा अनन्त यातना में पड़ा हुआ है
  alternative: अनन्त यातना का खतरा उनके लिए रखा हुआ है
  rationale: यूनानी में κείμενος व्याकरणतः κίνδυνος से संबद्ध है। अनुवाद उसी असामान्य किंतु अर्थपूर्ण संबंध को रखता है और ‘laid up’ जैसे भाव को चुपचाप भविष्यकालीन आरक्षण में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। यूनानी वाक्य की कारणसूचक शुरुआत (‘क्योंकि’) तथा दोनों विशेषणों के साझा ‘बड़ा’ भाव को हिन्दी में स्वाभाविक स्पष्टता के लिए दोहराया गया है।
