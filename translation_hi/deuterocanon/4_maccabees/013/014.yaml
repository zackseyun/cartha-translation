  source_fidelity: 'The hortatory first-person plural and the qualifying force of δοκοῦντα are retained. However, the draft''s “मार डालता हुआ प्रतीत होता है” reads as an ongoing action (“seems to be killing”), whereas the Greek infinitive more broadly expresses the action attributed to the person: “seems/appears to kill.”'
  naturalness: The revision is natural, concise modern standard Hindi. “मार डालने वाला प्रतीत होता है” avoids an unintended progressive sense while retaining the formal but accessible register of “प्रतीत होता है.”
  terminology: “मार डालना” is an appropriate direct rendering of ἀποκτείνειν. The footnote preserves the viable nuances of δοκοῦντα without turning the contextual implication of merely apparent power into an asserted doctrinal interpretation in the main text.
  issues:
  - severity: medium
    issue: The phrase “मार डालता हुआ प्रतीत होता है” introduces a progressive/action-in-progress nuance.
    rationale: The Greek has δοκοῦντα followed by an infinitive (ἀποκτενεῖν), not a participle denoting someone presently engaged in killing. Hindi should express the person as appearing to be one who kills, or as appearing able/intending to kill, without specifying ongoing action.
