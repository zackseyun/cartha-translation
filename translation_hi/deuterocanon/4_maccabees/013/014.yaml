  text: Let us not fear the one who seems to kill[a].
translation:
  language: hi
  text: हम उससे न डरें जो मार डालने वाला प्रतीत होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मार डालता दिखाई देता है,” अथवा “जिसके बारे में समझा जाता है कि वह मार सकता है।” यूनानी में उसकी शक्ति के केवल प्रतीत होने पर बल है।
    reason: δοκοῦντα के “प्रतीत होना,” “दिखाई देना,” और “समझा जाना” जैसे निकट अर्थों तथा उनसे उत्पन्न अर्थ-छाया को स्पष्ट करना।
lexical_decisions:
- source_word: μὴ φοβηθῶμεν
  choice: हम ... न डरें
  rationale: μή के साथ प्रथम पुरुष बहुवचन विधिलिंग यहाँ सामूहिक आग्रह व्यक्त करता है; ‘हम ... न डरें’ इस प्रेरणात्मक भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τὸν δοκοῦντα
  choice: उससे जो ... प्रतीत होता है
  rationale: δοκέω का प्रमुख भाव ‘प्रतीत होना/दिखाई देना’ है। ‘प्रतीत होता है’ वास्तविकता और बाहरी आभास के बीच मूल यूनानी में निहित तनाव को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ἀποκτενεῖν
  choice: मार डालता हुआ
  rationale: ἀποκτείνω का सीधा अर्थ ‘मार डालना’ है। यह ‘वध करना’ की अपेक्षा साधारण पाठक के लिए अधिक स्वाभाविक है और क्रिया की तीव्रता भी स्पष्ट रखता है।
theological_decisions:
- issue: τὸν δοκοῦντα ἀποκτενεῖν में वास्तविक और केवल प्रतीत होने वाली सामर्थ्य का तनाव
  choice: जो मार डालता हुआ प्रतीत होता है
  alternative: जो मार डालने में समर्थ समझा जाता है
  rationale: मुख्य पाठ δοκέω के ‘प्रतीत होना’ वाले सीधे अर्थ को रखता है, जिससे सताने वाले की शक्ति के आभासी या सीमित होने का संकेत मिलता है; पर यह स्पष्ट रूप से ‘समर्थ’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘प्रतीत होता है’ गरिमापूर्ण किंतु सामान्यतः बोधगम्य है; ‘मार डालना’ मूल क्रिया का सीधा और स्वाभाविक अनुवाद है।
