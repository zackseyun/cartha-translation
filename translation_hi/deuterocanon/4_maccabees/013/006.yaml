  text: For just as towers on harbor breakwaters[a], beating back the threats of the waves, provide a calm harbor for those sailing in,
translation:
  language: hi
  text: क्योंकि जैसे बंदरगाहों के तरंगरोधी बाँधों पर बने बुर्ज, लहरों की धमकियों को पीछे हटाते हुए, भीतर आने वाले नाविकों के लिए शांत लंगरगाह प्रदान करते हैं,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक संबंध और καθάπερ की उपमा—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προβλῆτες λιμένων πύργοι
  choice: बंदरगाहों के आगे निकले हुए बुर्ज
  rationale: προβλῆτες का मूल भाव आगे निकले या प्रक्षेपित होने का है और πύργοι का अर्थ बुर्ज है; यह अनुवाद स्रोत की ठोस समुद्री छवि को बिना अनावश्यक तकनीकी शब्द जोड़े व्यक्त करता है।
- source_word: τὰς κυμάτων ἀπειλάς
  choice: लहरों की धमकियों
  rationale: ἀπειλάς का शाब्दिक अर्थ ‘धमकियाँ’ है; इससे लहरों का मानवीकरण और उनके भयावह बल की छवि सुरक्षित रहती है।
- source_word: ἀνακόπτοντες
  choice: रोककर
  rationale: क्रिया लहरों के बल को रोकने या पीछे हटाने की सक्रिय क्रिया दर्शाती है; ‘रोककर’ संक्षिप्त और सहज है।
- source_word: γαληνὸν παρέχουσιν
  choice: शांत बनाए रखते हैं
  rationale: γαληνός विशेषकर समुद्र की शांति बताता है और यहाँ τὸν ὅρμον के साथ विधेयात्मक है; हिन्दी में ‘लंगरगाह को शांत बनाए रखते हैं’ इस संबंध को स्पष्ट करता है।
- source_word: τοῖς εἰσπλέουσιν
  choice: भीतर आते नाविकों के लिए
  rationale: यह वर्तमान कृदंत जहाज़ से बंदरगाह के भीतर प्रवेश करने वालों को दर्शाता है; ‘नाविकों’ से समुद्री प्रसंग स्पष्ट रहता है।
- source_word: τὸν ὅρμον
  choice: लंगरगाह
  rationale: ὅρμος बंदरगाह, लंगर डालने की जगह या सुरक्षित आश्रय का द्योतक हो सकता है; ‘लंगरगाह’ इसे पहले आए λιμένων से अलग रखते हुए समुद्री अर्थ को सटीक रूप से व्यक्त करता है।
