  to: क्योंकि जैसे बंदरगाहों के तरंगरोधी बाँधों पर बने बुर्ज, लहरों की धमकियों को पीछे हटाते हुए, भीतर आने वाले नाविकों के लिए शांत लंगरगाह प्रदान करते हैं,
