  source_fidelity: The translation preserves the adversative contrast (νυνὶ δὲ ... ἀλλὰ), the intentionally elliptical ‘not so,’ the instrumental force of τῷ ... λογισμῷ, divine commendation in παρὰ θεῷ, and victory over πάθη. ‘मनोवेगों’ appropriately represents the philosophical sense of πάθη as affective impulses/passions rather than external sufferings.
  naturalness: The Hindi is modern, clear, and suitably dignified. ‘पर अब ऐसा नहीं है; बल्कि...’ is a natural enough rendering of the emphatic corrective contrast. The relative clause is readable and does not over-explain the Greek.
  terminology: ‘विवेकपूर्ण विचार’ is a viable, accessible rendering of λόγισμος in this context, and the note responsibly records ‘विवेक-बुद्धि’ and ‘तर्कपूर्ण निर्णय’ as alternatives. ‘मनोवेग’ maintains the book’s ethical-philosophical register without narrowing the term to sexual desire or suffering.
