  yaml_path: translation/deuterocanon/4_maccabees/013/003.yaml
  text: But now it is not so; rather[a], by the reasoning that is praised by God, they overcame the passions.
translation:
  language: hi
  text: पर अब ऐसा नहीं है; बल्कि उन्होंने उस विवेकपूर्ण विचार[a] के द्वारा, जिसकी परमेश्वर प्रशंसा करता है, मनोवेगों पर विजय पाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस विवेक-बुद्धि के द्वारा, जो परमेश्वर की दृष्टि में प्रशंसनीय है।” यूनानी शब्द का अनुवाद “विवेक-बुद्धि,” “विचार” या “तर्कपूर्ण निर्णय” किया जा सकता है।
    reason: λόγισμος की अर्थ-सीमा और παρὰ θεῷ के संबंधपरक वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: यह पिछले कथन से विरोध प्रकट करता है और आधुनिक हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: οὐχ οὕτως
  choice: ऐसा नहीं है
  rationale: यूनानी वाक्य की संकेतात्मक और कुछ हद तक अपूर्ण तुलना को बिना अनावश्यक स्पष्टीकरण के बनाए रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: नकार के बाद आने वाले सुधारात्मक विरोध को स्पष्ट रूप से व्यक्त करता है।
- source_word: τῷ ἐπαινουμένῳ λογισμῷ
  choice: उस विवेकपूर्ण विचार के द्वारा, जिसकी ... प्रशंसा करता है
  rationale: λόγισμος यहाँ नैतिक रूप से अनुशासित सोच या तर्कपूर्ण निर्णय का प्रमुख दार्शनिक शब्द है। ‘विवेकपूर्ण विचार’ उसकी सक्रिय और विचारशील प्रकृति को सहज हिन्दी में व्यक्त करता है; करण कारक को ‘के द्वारा’ से दर्शाया गया है।
- source_word: παρὰ θεῷ
  choice: जिसकी परमेश्वर प्रशंसा करता है
  rationale: ἐπαινουμένῳ के साथ यह पदबंध सबसे स्वाभाविक रूप से परमेश्वर को प्रशंसा करने वाला बताता है। यह भाव हिन्दी में कर्तृवाच्य रूप से स्पष्ट और स्वाभाविक है।
- source_word: περιεγένοντο
  choice: विजय पाई
  rationale: किसी विरोधी शक्ति से बढ़कर सिद्ध होने या उस पर प्रबल होने का अर्थ सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν παθῶν
  choice: मनोवेगों पर
  rationale: पुस्तक के दार्शनिक संदर्भ में πάθη उन भावनात्मक आवेगों को दर्शाता है जिन पर विवेक शासन करता है; ‘मनोवेग’ इसे केवल बाहरी दुःख या काम-वासना तक सीमित नहीं करता।
theological_decisions:
- issue: 4 मक्काबियों में प्रमुख शब्द λόγισμος का अनुवाद
  choice: विवेकपूर्ण विचार
  alternative: विवेक-बुद्धि; तर्कपूर्ण निर्णय
  rationale: यह चुनाव केवल अमूर्त बुद्धि नहीं, बल्कि सक्रिय नैतिक विचार और निर्णय को व्यक्त करता है। साथ ही पाद-टिप्पणी मूल शब्द की अर्थ-सीमा को खुला रखती है।
- issue: ἐπαινουμένῳ के साथ παρὰ θεῷ का अर्थ
  choice: जिसकी परमेश्वर प्रशंसा करता है
  alternative: जो परमेश्वर की दृष्टि में प्रशंसनीय है
  rationale: इस रचना में परमेश्वर को प्रशंसा का स्रोत समझना सबसे स्वाभाविक है, पर वैकल्पिक संबंधपरक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मनोवेग’ दार्शनिक संदर्भ को बनाए रखते हुए ‘वासनाएँ’ से उत्पन्न हो सकने वाली अत्यधिक संकीर्ण यौन धारणा और ‘दुःख’ से उत्पन्न बाहरी पीड़ा की धारणा से बचाता है।
