lexical_decisions:
- source_word: ἀσκήσεως
  choice: अनुशासित अभ्यास
  rationale: यह संज्ञा नियमित साधना, प्रशिक्षण या अनुशासनपूर्ण अभ्यास को दर्शाती है। ‘अनुशासित अभ्यास’ अर्थ को स्पष्ट रखता है और बाद की तकनीकी तपस्वी शब्दावली को अनावश्यक रूप से नहीं लाता।
- source_word: ἐν νόμῳ θεοῦ
  choice: परमेश्वर की व्यवस्था के अधीन
  rationale: यह वाक्यांश उनके अभ्यास को परमेश्वर की व्यवस्था के दायरे और अधिकार में रखता है; ‘के अधीन’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φιλαδελφίας
  choice: भाईचारा
  rationale: संदर्भ सात सगे भाइयों का है। ‘भाईचारा’ उनके पारिवारिक स्नेह और आपसी बंधन को संक्षेप तथा स्वाभाविक रूप में व्यक्त करता है।
- source_word: συμπαθούσης
  choice: परस्पर संवेदना रखनेवाला
  rationale: कृदन्त साझा अनुभूति और एक-दूसरे के दुःख में सहभागी होने का भाव देता है। इसे ‘भाईचारा’ का विशेषण बनाकर यूनानी वाक्य-संबंध बनाए रखा गया है।
- source_word: καθεστηκυίας
  choice: स्थापित हो चुका था
  rationale: पूर्णकालिक कृदन्त किसी बन चुकी और कायम अवस्था को दर्शाता है; ‘हो चुका था’ उस परिणामी स्थिति को व्यक्त करता है।
- source_word: οἱ ἑπτὰ ἀδελφοὶ
  choice: सातों भाई
  rationale: यूनानी पाठ स्पष्टतः पुरुष भाई-बहनों में भाइयों की बात करता है; हिन्दी में ‘सातों भाई’ इस निर्दिष्ट समूह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: συνπα-
  choice: एक साथ—
  rationale: उपलब्ध पाठ शब्द के बीच में टूट जाता है। दिखाई देने वाला συν- उपसर्ग साथ या संयुक्तता का संकेत देता है, इसलिए ‘एक साथ—’ केवल उतना ही अर्थ देता है जितना सुरक्षित रूप से कहा जा सकता है; डैश अपूर्णता दिखाता है।
theological_decisions:
- issue: लिंग-विशिष्ट पारिवारिक भाषा
  choice: सातों भाई
  alternative: सातों सहोदर
  rationale: मूल यूनानी में पुरुषवाची ‘भाई’ है और कथा पुरुष सहोदरों की है; इसलिए लिंग को तटस्थ नहीं किया गया।
- issue: पद के अंत में अधूरा स्रोत-पाठ
  choice: दिखाई देने वाले संयुक्तता-सूचक उपसर्ग का सीमित अनुवाद करके डैश और पाद-टिप्पणी देना
  alternative: किसी अन्य संस्करण के आधार पर पूरा क्रियापद पुनर्निर्मित करना
  rationale: दिया गया यूनानी साक्ष्य συνπα- पर बीच शब्द में समाप्त होता है। अनिश्चित क्रिया को पूरा मान लेना अस्पष्टता मिटा देता; सीमित अनुवाद और डैश पाठ की वास्तविक स्थिति को पारदर्शी रखते हैं।
