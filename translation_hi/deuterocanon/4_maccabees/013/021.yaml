    reason: alternative_reading
lexical_decisions:
- source_word: ψυχῆς
  choice: प्राण में
  rationale: यहाँ संबंधकारक को ‘किस दृष्टि से’ के अर्थ में लिया गया है। ‘प्राण’ व्यक्ति के भीतरी जीवन पर बल देता है और ‘आत्मा’ से जुड़ी अनावश्यक सांप्रदायिक व्याख्या से बचता है।
- source_word: τελεσφορηθέντες
  choice: पूरी परिपक्वता तक पहुँचाए गए
  rationale: यह अनुवाद पूर्णता या परिपक्वता तक लाए जाने के अर्थ और यूनानी के कर्मवाच्य भाव—दोनों को बनाए रखता है।
- source_word: διὰ τῶν ἴσων ... χρόνων
  choice: समान समयावधियों के बाद
  rationale: वाक्यांश भाई-बहनों के गर्भकाल अथवा विकास की बराबर अवधियों की ओर संकेत करता है; हिंदी में यह रूप स्वाभाविक और स्पष्ट है।
- source_word: ἀποτεχθέντες
  choice: जन्म दिए गए
  rationale: कर्मवाच्य कृदंत गर्भ से बाहर लाए जाने या जन्म दिए जाने को व्यक्त करता है; इस रूप में मातृ-संदर्भ भी बना रहता है।
- source_word: γαλακτοποτοῦντες
  choice: दूध पीते रहे
  rationale: संयुक्त क्रिया का सीधा अर्थ दूध पीना है; भूतकालिक निरंतर रूप साझा शैशव-पोषण को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πηγῶν
  choice: सोतों
  rationale: शब्द का शाब्दिक अर्थ जलस्रोत या सोता है। यहाँ यह माता के दूध के स्रोतों की सजीव उपमा है, जिसे मूल की तरह स्पष्ट रूप से ‘स्तन’ कहे बिना रखा गया है।
- source_word: ἀφʼ οὗ
  choice: तभी से
  rationale: सापेक्ष रूप संख्या और लिंग में पहले आए बहुवचन ‘सोतों’ से मेल नहीं खाता, इसलिए इसे प्रचलित कालवाचक प्रयोग ‘तभी से’ समझना व्याकरणतः अधिक संभावित है; स्रोत-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: συντρέφονται
  choice: साथ-साथ पाले-पोसे जाते रहे हैं
  rationale: συν- का ‘साथ’ वाला भाव और τρέφω का पोषण तथा पालन-पोषण—दोनों इस अनुवाद में व्यक्त होते हैं।
theological_decisions:
- issue: ψυχή का मानव-संबंधी अर्थ
  choice: प्राण
  alternative: आत्मा
  rationale: संदर्भ में शब्द व्यक्ति के भीतरी जीवन या जीवित सत्ता को सूचित कर सकता है। ‘प्राण’ इस मानववैज्ञानिक तनाव को रखता है और किसी निश्चित शरीर-आत्मा सिद्धांत को आरोपित नहीं करता।
- issue: ἀφʼ οὗ का संबंध
  choice: कालवाचक—‘तभी से’
  alternative: स्रोतवाचक—‘जिनसे’
  rationale: यूनानी रूप का πηγῶν से व्याकरणिक मेल न होना कालवाचक अर्थ के पक्ष में है, पर निकटस्थ दूध-स्रोत की छवि के कारण स्रोतवाचक समझ भी संभव है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिंदी अपनाई गई है। वाक्य मूल पाठ की तरह एक बड़े वाक्य का आश्रित अंश है, इसलिए अंत में अल्पविराम रखा गया है। ‘सोतों’ से मातृ-दूध की मूल रूपकात्मक छवि सुरक्षित रहती है, जबकि ‘पाले-पोसे’ में साझा पालन का भाव स्पष्ट होता है।
