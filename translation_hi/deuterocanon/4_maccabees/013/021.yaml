    issue: ‘समान समयावधियों के बाद’ for διὰ τῶν ἴσων χρόνων
    rationale: διά with the genitive denotes extent through/during, not temporal succession ‘after.’
  - severity: medium
    issue: ‘तभी से’ and the tense chain over-specify the construction
    rationale: The antecedent of singular ἀφʼ οὗ is syntactically difficult/disputed. ‘तभी से’ is plausible, but ‘पीते रहे’ and ‘जाते रहे हैं’ add a completed-and-continuing timeline. The text can preserve the ambiguity more economically.
  - severity: low
    issue: ‘प्राण में’ and ‘जन्म दिए गए’ are not idiomatic here
    rationale: Modern Hindi normally uses ‘मन से/भीतर से परिपक्व’ and ‘जन्मे’ in this context; the latter adequately conveys the passive birth event.
