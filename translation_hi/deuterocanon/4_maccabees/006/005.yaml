base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/005.yaml
  text: But the noble-minded and truly well-born Eleazar[a], as though being tortured in a dream, was not turned aside in any way.
translation:
  language: hi
  text: परन्तु उदात्त-चित्त और सचमुच उच्च कुल में जन्मा एलीआज़र, मानो स्वप्न में उसे यातना दी जा रही हो,[a] किसी भी तरह विचलित नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यह एक उपमा है—अर्थात, “मानो स्वप्न में”; इसका अर्थ यह नहीं कि एलीआज़र सचमुच स्वप्न देख रहा था।
    reason: उपमा की प्रकृति और सम्भावित शाब्दिक गलतफहमी स्पष्ट करना।
lexical_decisions:
- source_word: μεγαλόφρων
  choice: उदात्त-चित्त
  rationale: यह शब्द मन की महानता और उच्च नैतिक साहस को व्यक्त करता है। ‘उदात्त-चित्त’ इसे εὐγενής के कुल-संबंधी अर्थ से अलग बनाए रखता है।
- source_word: εὐγενής
  choice: उच्च कुल में जन्मा
  rationale: यहाँ शब्द का मूल अर्थ अच्छे या प्रतिष्ठित कुल में जन्म लेने से है। इस स्पष्ट पदबंध से पहले विशेषण की आंतरिक उदात्तता और इस विशेषण की वंश-संबंधी छटा आपस में नहीं मिलतीं।
- source_word: ὡς ἀληθῶς
  choice: सचमुच
  rationale: यह एलीआज़र के वर्णन पर बल देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὥσπερ ἐν ὀνείρῳ
  choice: मानो स्वप्न में
  rationale: ‘मानो’ यूनानी की तुलनात्मक उपमा को सुरक्षित रखता है और इसे वास्तविक स्वप्नावस्था का कथन नहीं बनने देता।
- source_word: βασανιζόμενος
  choice: उसे यातना दी जा रही हो
  rationale: शहीदी के इस प्रसंग में क्रिया शारीरिक यातना को सूचित करती है; कर्मवाच्य रचना यूनानी कृदन्त की दिशा भी बनाए रखती है।
- source_word: κατ᾽ οὐδὲν τρόπον
  choice: किसी भी तरह नहीं
  rationale: यह पूर्ण निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μετετρέπετο
  choice: विचलित नहीं हुआ
  rationale: यह अपने मार्ग या दृढ़ता से न हटने का भाव देता है, पर मूल में स्पष्ट न किए गए ‘निश्चय’ जैसे कर्म को पाठ में नहीं जोड़ता।
theological_decisions:
- issue: यातना के बीच एलीआज़र की अवस्था
  choice: 'वाक्य को उपमा के रूप में रखा गया है: वह मानो स्वप्न में यातना सह रहा था और विचलित नहीं हुआ।'
  alternative: इसे वास्तविक स्वप्नावस्था या संवेदनहीनता का दावा माना जा सकता था।
  rationale: ὥσπερ स्पष्ट रूप से तुलना प्रस्तुत करता है। इसलिए अनुवाद उसकी अडिगता और अनुभव की स्वप्न-जैसी छवि को बनाए रखता है, पर उसके शरीर या चेतना के विषय में कोई अतिरिक्त दार्शनिक अथवा धर्मवैज्ञानिक दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उदात्त-चित्त’ और ‘उच्च कुल में जन्मा’ द्वारा मूल के दो अलग विशेषणों—आंतरिक महानता और कुलीन जन्म—का भेद सुरक्षित है।
