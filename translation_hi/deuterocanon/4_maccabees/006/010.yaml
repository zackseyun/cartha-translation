  yaml_path: translation/deuterocanon/4_maccabees/006/010.yaml
  text: And like a noble athlete[a], though being beaten, the old man was defeating those who were torturing him.
translation:
  language: hi
  text: और एक वीर खिलाड़ी[a] की तरह, मार खाते हुए भी वह वृद्ध अपने यातना देने वालों को पराजित करता जा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वीर प्रतियोगी।’ यूनानी शब्द खेल अथवा सार्वजनिक प्रतियोगिता में भाग लेने वाले व्यक्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: की तरह
  rationale: यह तुलना आरम्भ करता है; ‘की तरह’ हिन्दी में स्वाभाविक ढंग से उपमा को बनाए रखता है।
- source_word: γενναῖος
  choice: वीर
  rationale: यह साहस और उदात्तता दोनों का भाव दे सकता है; यहाँ यातना सहते वृद्ध के साहस को व्यक्त करने के लिए ‘वीर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀθλητής
  choice: खिलाड़ी
  rationale: मूल शब्द खेल अथवा सार्वजनिक प्रतियोगिता में भाग लेने वाले प्रतियोगी का चित्र प्रस्तुत करता है। ‘खिलाड़ी’ उस रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: τυπτόμενος
  choice: मार खाते हुए भी
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त लगातार पड़ रहे प्रहारों को दर्शाता है। ‘भी’ यातना और विजय के बीच निहित विरोध को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: ἐνίκα
  choice: पराजित करता जा रहा था
  rationale: अपूर्ण भूतकाल चलती हुई अथवा बार-बार प्रकट होती विजय का संकेत देता है; यह रूप उसकी निरन्तरता और प्रतियोगिता के चित्र दोनों को बनाए रखता है।
- source_word: τοὺς βασανίζοντας
  choice: अपने यातना देने वालों को
  rationale: शहादत के प्रसंग में βασανίζω शारीरिक यातना देने को दर्शाता है। हिन्दी में सम्बन्ध स्पष्ट करने के लिए ‘अपने’ प्रयुक्त है।
- source_word: ὁ γέρων
  choice: वह वृद्ध
  rationale: मूल का अर्थ वृद्ध पुरुष है। ‘वह वृद्ध’ आयु और खिलाड़ी-सदृश विजय के बीच प्रभावशाली विरोध बनाए रखता है और किसी धार्मिक पद का संकेत नहीं देता।
theological_decisions:
- issue: यातना-सहन को खेल-प्रतियोगिता की विजय के रूप में चित्रित करना
  choice: ‘वीर खिलाड़ी’ और ‘पराजित करता जा रहा था’ के द्वारा मूल रूपक को प्रत्यक्ष रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘वीरतापूर्वक सहकर अपने यातना देने वालों पर जय पा रहा था’ कहा जा सकता था।
  rationale: मूल यूनानी वृद्ध की सहनशीलता को स्पष्टतः एक प्रतियोगी की विजय के रूप में प्रस्तुत करता है। सीधे रूपक को बनाए रखने से लेखक का नैतिक और आलंकारिक तनाव सुरक्षित रहता है, बिना यह तय किए कि यह विजय किस विशिष्ट धार्मिक अर्थ में है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। ‘मार खाते हुए भी’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘पराजित करता जा रहा था’ यूनानी अपूर्ण भूतकाल की निरन्तरता और प्रतियोगिता के रूपक को व्यक्त करता है।
