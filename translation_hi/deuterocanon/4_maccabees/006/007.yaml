  text: And falling to the ground because his body could not bear the pains[a], he kept his reason upright and unbending.
translation:
  language: hi
  text: और पीड़ाएँ सहने में उसका शरीर असमर्थ होने के कारण वह भूमि पर गिर रहा था, फिर भी उसने अपनी विवेक-बुद्धि[a] को सीधी और अडिग बनाए रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तर्कपूर्ण निर्णय-शक्ति”; यूनानी शब्द तर्क पर आधारित नैतिक निर्णय करने वाली बुद्धि का दार्शनिक भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πίπτων
  choice: गिर रहा था
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ जारी क्रिया को व्यक्त करता है। ‘गिर रहा था’ शारीरिक पतन और मानसिक दृढ़ता के बीच विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔδαφος
  choice: भूमि
  rationale: यह उस सतह को दर्शाता है जिस पर वह गिर रहा था; यातना के प्रसंग में ‘भूमि’ स्पष्ट और गरिमापूर्ण है।
- source_word: ἀπὸ τοῦ μὴ φέρειν
  choice: सहने में ... असमर्थ होने के कारण
  rationale: यह रचना गिरने का कारण बताती है; हिन्दी में कारणसूचक रूप मूल अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ σῶμα
  choice: उसका शरीर
  rationale: यूनानी में निश्चित उपपद है, पर प्रसंग स्पष्ट करता है कि बात उसी के शरीर की है; हिन्दी में संबंधसूचक सर्वनाम स्वाभाविक है।
- source_word: τὰς ἀλγηδόνας
  choice: पीड़ाएँ
  rationale: शब्द तीव्र शारीरिक वेदनाओं को दर्शाता है। ‘पीड़ाएँ’ सीधा, सुबोध और प्रसंगानुकूल है।
- source_word: ὀρθὸν εἶχεν
  choice: सीधा ... बनाए रखा
  rationale: यह किसी वस्तु को सीधी दशा में स्थिर रखने का बिंब है; अनुवाद नैतिक और बौद्धिक दृढ़ता के रूपक को सुरक्षित रखता है।
- source_word: ἀκλινῆ
  choice: अडिग
  rationale: मूल अर्थ न झुकने या एक ओर न मुड़ने का है; यहाँ दबाव के सामने न डिगने का भाव है। ‘अडिग’ स्वाभाविक हिन्दी में वही दृढ़ता व्यक्त करता है।
- source_word: τὸν λογισμόν
  choice: अपनी विवेक-बुद्धि
  rationale: 4 मकाबियों में λογισμός तर्कशील और नैतिक निर्णय करने वाली शक्ति का प्रमुख दार्शनिक पद है। ‘विवेक-बुद्धि’ केवल सामान्य ‘मन’ की अपेक्षा इस अर्थ को बेहतर सुरक्षित रखती है।
theological_decisions:
- issue: दार्शनिक रूप से महत्त्वपूर्ण λογισμός का अनुवाद
  choice: विवेक-बुद्धि
  alternative: तर्कपूर्ण निर्णय-शक्ति; बुद्धि
  rationale: पुस्तक में यह शब्द भक्तिपूर्ण तर्क-बुद्धि द्वारा शारीरिक वेदना और मनोवेगों पर नियंत्रण के केंद्रीय विषय से जुड़ा है। ‘विवेक-बुद्धि’ इस वैचारिक भार को संक्षिप्त और गैर-सांप्रदायिक रूप में व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘सीधा और अडिग’ मूल के शारीरिक रूपक को विवेक-बुद्धि पर लागू रूप में सुरक्षित रखता है; ‘फिर भी’ यूनानी वाक्य में निहित शारीरिक पतन और आंतरिक दृढ़ता के विरोध को स्पष्ट करता है।
