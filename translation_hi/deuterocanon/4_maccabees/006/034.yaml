  yaml_path: translation/deuterocanon/4_maccabees/006/034.yaml
  text: And it is right for us to acknowledge that reason is sovereign[b][a], since it even prevails over outward pains.
translation:
  language: hi
  text: और यह उचित है कि हम स्वीकार करें कि प्रभुत्व तर्कबुद्धि का है,[a] क्योंकि वह बाहर से आने वाली पीड़ाओं[b] पर भी विजय पाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तर्कबुद्धि का नियंत्रण है’ अथवा ‘सामर्थ्य तर्कबुद्धि का है।’ यूनानी पदबंध तर्कबुद्धि की शासनकारी शक्ति पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बाहरी पीड़ाओं।’ इसका अर्थ स्वयं के बाहर से आने वाली पीड़ाएँ हैं, जिनमें संभवतः शारीरिक पीड़ा भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιόν ἐστιν
  choice: उचित है
  rationale: यह निर्वैयक्तिक यूनानी पदबंध किसी बात को नैतिक और तार्किक रूप से सही या उचित बताता है; आधुनिक हिन्दी में ‘उचित है’ स्वाभाविक है।
- source_word: ὁμολογεῖν
  choice: स्वीकार करना
  rationale: यहाँ अर्थ पाप मान लेने का नहीं, बल्कि तर्क से निकले निष्कर्ष को खुले रूप से मानने या स्वीकार करने का है।
- source_word: τὸ κράτος εἶναι τοῦ λογισμοῦ
  choice: प्रभुत्व तर्कबुद्धि का है
  rationale: κράτος सामर्थ्य, नियंत्रण और शासनकारी प्रभुत्व को व्यक्त करता है, जबकि λογισμός मनुष्य की विचार-विवेक करनेवाली क्षमता है। यह रचना यूनानी के ‘प्रभुत्व ... का है’ संबंध को बनाए रखती है।
- source_word: ὅπου γε καὶ
  choice: क्योंकि ... भी
  rationale: संदर्भ में यह पदबंध पिछले दावे का जोरदार आधार देता है; ‘क्योंकि ... भी’ कारण और बल, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: τῶν ἔξωθεν ἀλγηδόνων
  choice: बाहर से आनेवाली पीड़ाओं
  rationale: ἔξωθεν का मूल अर्थ ‘बाहर से’ है और ἀλγηδόνες पीड़ाएँ हैं। यह अनुवाद शारीरिक यातना की संभावित ओर संकेत करता है, पर उसे मूल से अधिक निश्चित नहीं बनाता।
- source_word: ἐπικρατεῖ
  choice: विजय पाती है
  rationale: क्रिया का अर्थ किसी पर प्रबल होना या काबू पाना है। ‘विजय पाती है’ तर्कबुद्धि की श्रेष्ठ नियंत्रक शक्ति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: 4 मकाबियों में λογισμός की दार्शनिक-मानववैज्ञानिक शक्ति
  choice: प्रभुत्व तर्कबुद्धि का है
  alternative: तर्कबुद्धि का नियंत्रण है; विवेक प्रबल है
  rationale: पद यहाँ पीड़ा के सामने मनुष्य की विचारशील, निर्णयकारी क्षमता की शासनकारी शक्ति की बात करता है। ‘तर्कबुद्धि’ इस दार्शनिक अर्थ को सुरक्षित रखती है और इसे अंतःकरण या किसी बाद की विशिष्ट धर्मवैज्ञानिक धारणा तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मुख्य दार्शनिक शब्द λογισμός के लिए ‘तर्कबुद्धि’ चुना गया है, ताकि केवल ‘तर्क’ या नैतिक ‘विवेक’ की अपेक्षा विचार और निर्णय करनेवाली मानवीय क्षमता अधिक स्पष्ट हो।
