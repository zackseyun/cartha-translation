  text: When they saw that he was so noble-minded in the face of these compulsions, and that he was not even changing toward pity for them, they led him to the fire.
translation:
  language: hi
  text: जब उन्होंने देखा कि वह इन बाध्यकारी दबावों[a] का इतने उदात्त मन से[b] सामना कर रहा था और उन पर दया करने के लिए भी अपना मन नहीं बदल रहा था,[c] तब वे उसे आग की ओर ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बाध्यकारी दबावों” के लिए “मजबूरियों,” “विवशकारी दबावों,” या “बाध्य करनेवाली यातनाओं” का अनुवाद भी संभव है। यूनानी शब्द यहाँ उस पर डाले जा रहे बाहरी दबाव को दर्शाता है, साधारण आवश्यकता को नहीं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द मन की महानता, उदात्तता या ऊँचे आत्मबल का भाव रखता है; इसका अर्थ केवल सामान्य साहस नहीं है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से, “उनकी दया की ओर भी नहीं बदल रहा था।” “उनकी” को यहाँ उन लोगों के लिए दया के उद्देश्य के रूप में समझा गया है: वह उन पर दया करने के लिए अपना मन नहीं बदल रहा था। यूनानी संबंधवाचक रूप में कुछ व्याकरणिक गुंजाइश रहती है, पर “उनके दया दिखाने पर” इस प्रसंग में कम संभावित है।'
    reason: ambiguity
lexical_decisions:
- source_word: Πρὸς τὰς ἀνάγκας
  choice: इन दबावों के सामने
  rationale: यहाँ ἀνάγκας साधारण आवश्यकताओं के बजाय उस पर डाले जा रहे बाध्यकारी दबावों को सूचित करता है; πρός के साथ यह वाक्यांश उनका सामना करने का भाव देता है।
- source_word: μεγαλοφρονοῦντα
  choice: इतनी उदात्त मनोवृत्ति बनाए हुए था
  rationale: यह कृदंत मन की महानता, ऊँचे आत्मबल और उदात्त वृत्ति को व्यक्त करता है। यह अनुवाद इसे केवल सामान्य साहस तक सीमित नहीं करता।
- source_word: πρὸς τὸν οἰκτιρμὸν αὐτῶν μεταβαλλόμενον
  choice: उनके दया दिखाने पर भी अपना मन नहीं बदल रहा था
  rationale: μεταβάλλω यहाँ मनोवृत्ति बदलने का भाव रखता है। αὐτῶν को स्वत्व-संबंधी मानकर ‘उनकी दया’ समझना यूनानी वाक्य-विन्यास और प्रसंग—जहाँ दूसरे लोग उस पर दया दिखाते हैं—दोनों के अनुकूल है।
- source_word: ἐπὶ τὸ πῦρ
  choice: आग की ओर
  rationale: ἐπί के साथ कर्मकारक गति को आग की ओर दर्शाता है; यह अनुवाद उसे तत्काल आग में डाल दिए जाने की बात अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἦγον
  choice: ले गए
  rationale: ἄγω का अपूर्णकालिक रूप यहाँ पहरे में किसी को गंतव्य की ओर ले जाने की क्रिया बताता है।
