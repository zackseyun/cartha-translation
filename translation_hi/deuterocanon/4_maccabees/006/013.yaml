lexical_decisions:
- source_word: ἐν συμπαθείᾳ
  choice: उससे सहानुभूति रखते थे
  rationale: यह पद उनकी भावनात्मक दशा और व्यवहार का ढंग बताता है। यह अनुवाद συμπάθεια के सहानुभूति-भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῆς συνηθείας
  choice: उसके साथ पुराने परिचय के कारण
  rationale: συνήθεια यहाँ परिचय, घनिष्ठ संपर्क या लंबे समय की संगति का बोध करा सकता है। ‘पुराना परिचय’ संबंध की अवधि को व्यक्त करता है, पर इसे अनावश्यक रूप से मित्रता नहीं बनाता।
- source_word: ἐν θαυμαστῷ τῆς καρτερίας
  choice: उसके धीरज पर चकित होकर
  rationale: वाक्यांश उसके कष्ट-सहन को देखकर उत्पन्न विस्मय या प्रशंसा व्यक्त करता है। ‘चकित होकर’ θαυμαστόν के विस्मय को और ‘धीरज’ καρτερία की अडिग सहनशीलता को संक्षेप में रखता है।
- source_word: προσίοντες αὐτῷ
  choice: उसके पास आए
  rationale: यह उसके निकट आने की वास्तविक क्रिया को सहज कथात्मक हिन्दी में व्यक्त करता है।
- source_word: τινες τῶν τοῦ βασιλέως
  choice: राजा के लोगों में से कुछ
  rationale: यूनानी अभिव्यक्ति राजा से संबद्ध लोगों को बताती है, पर उनका निश्चित पद नहीं बताती। यह चयन सेवक, अधिकारी या अंगरक्षक जैसी अनिश्चित भूमिकाएँ आरोपित नहीं करता।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण भूतकाल चलती हुई वाणी को दर्शाता है और अगली आयत में आने वाले कथन की भूमिका बनाता है। हिन्दी में ‘कहने लगे’ इस कथात्मक प्रवाह को स्वाभाविक रूप से बनाए रखता है।
