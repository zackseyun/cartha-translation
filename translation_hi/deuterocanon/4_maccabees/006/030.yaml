  yaml_path: translation/deuterocanon/4_maccabees/006/030.yaml
  text: And after saying these things[a], the holy man nobly gave himself over to the tortures, and he stood firm by reason for the law, even to the tortures of death.
translation:
  language: hi
  text: और ये बातें कहने के बाद, उस पवित्र पुरुष ने गरिमापूर्वक यातनाओं का सामना किया[a], और वह व्यवस्था के कारण विवेक के बल पर मृत्युदायक यातनाओं तक भी दृढ़ता से डटा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ है और उसका ठीक अर्थ निश्चित करना कठिन है; इससे यह भाव भी निकल सकता है कि उसने मृत्यु या यातना का आमने-सामने मुकाबला किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: और ये बातें कहने के बाद
  rationale: ग्रीक कृदन्तीय वाक्यांश कार्यों का क्रम बताता है; यह हिन्दी में स्वाभाविक रूप से वही क्रम बनाए रखता है।
- source_word: ὁ ἱερὸς ἀνὴρ
  choice: उस पवित्र पुरुष
  rationale: ἱερός यहाँ पवित्र चरित्र सूचित करता है और ἀνήρ का स्पष्ट पुल्लिंग अर्थ ‘पुरुष’ से सुरक्षित रहता है।
- source_word: εὐγενῶς
  choice: महान साहस के साथ
  rationale: यह अभिव्यक्ति εὐγενῶς के उदात्त, गरिमामय और साहसी आचरण को सामान्य आधुनिक हिन्दी में व्यक्त करती है।
- source_word: ταῖς βασάνοις
  choice: यातनाओं का
  rationale: शहादत के प्रसंग में βάσανοι शारीरिक यातनाओं को दर्शाता है; ‘यातनाएँ’ स्पष्ट और स्वाभाविक शब्द है।
- source_word: ἐναντεθάνει
  choice: सामना किया
  rationale: दुर्लभ और कठिन क्रिया में मृत्यु अथवा यातना से आमने-सामने भिड़ने का भाव संभव है; ‘सामना किया’ इस भाव को अनावश्यक रूप से निश्चित किए बिना व्यक्त करता है।
- source_word: μέχρι τῶν θανάτου βασάνων
  choice: मृत्यु तक पहुँचानेवाली यातनाओं के बीच भी
  rationale: μέχρι सीमा की चरम अवस्था और θανάτου βασάνων प्राणघातक यातना का भाव देता है; हिन्दी रूप वाक्य के स्वाभाविक क्रम में उस चरम सीमा को स्पष्ट करता है।
- source_word: ἀντέστη
  choice: दृढ़ता से डटा रहा
  rationale: क्रिया प्रतिरोध करने और अटल खड़े रहने दोनों का भाव रखती है; चुना हुआ रूप दोनों पहलुओं को समेटता है।
- source_word: τῷ λογισμῷ
  choice: विवेक के बल पर
  rationale: 4 मकाबियों में λογισμός तर्कशील विवेक अथवा बुद्धिसंगत आत्म-नियंत्रण का प्रमुख विचार है; यह रूप केवल व्यक्तिगत विचार-प्रक्रिया की अपेक्षा उस नैतिक-बौद्धिक शक्ति को बेहतर व्यक्त करता है।
- source_word: διὰ τὸν νόμον
  choice: व्यवस्था के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या प्रेरणा बताता है; ‘व्यवस्था के कारण’ इस संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: दार्शनिक रूप से महत्त्वपूर्ण λογισμός का अनुवाद
  choice: विवेक
  alternative: तर्क-बुद्धि; विचार-शक्ति
  rationale: पुस्तक में यह शब्द वासनाओं पर शासन करनेवाले तर्कशील नैतिक विवेक का संकेत देता है। ‘विवेक’ आधुनिक हिन्दी में बोधगम्य है और किसी बाद की विशिष्ट दार्शनिक या सांप्रदायिक शब्दावली को आरोपित नहीं करता।
- issue: ἀνήρ का स्पष्ट पुल्लिंग संदर्भ
  choice: पुरुष
  alternative: मनुष्य; व्यक्ति
  rationale: मूल यूनानी वयस्क पुरुष के लिए स्पष्ट शब्द प्रयोग करता है; इसलिए लिंग-विशिष्टता सुरक्षित रखी गई है।
- issue: διὰ τὸν νόμον में प्रेरणा का संबंध
  choice: व्यवस्था के कारण
  alternative: व्यवस्था के लिए
  rationale: ग्रीक व्याकरण कारण अथवा आधार को स्पष्टतः स्वीकार करता है। यह चयन उसकी व्यवस्था-निष्ठा को दर्शाता है, पर वाक्य को किसी अतिरिक्त धर्मवैज्ञानिक दावे में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’ νόμος के धार्मिक-साहित्यिक संदर्भ को बनाए रखता है। मुख्य पाठ में फुटनोट चिह्न [a] सम्मिलित है।
