  yaml_path: translation/deuterocanon/4_maccabees/006/025.yaml
  text: There[a], while burning him with instruments devised for torture[c][b], they flung themselves upon him and poured foul-smelling broths into his nostrils.
translation:
  language: hi
  text: वहाँ वे यातना देने के लिए बड़ी दुष्टता से बनाए गए उपकरणों से उसे झुलसाते हुए[a] उस पर झपट पड़े[b] और उसके नथुनों में दुर्गंधयुक्त तरल[c] उँडेलते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टतापूर्वक गढ़े गए उपकरणों से उसे जलाते हुए।” यूनानी पद ऐसे उपकरणों पर बल देता है जिन्हें हानि पहुँचाने के लिए कौशल से बनाया गया था।
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर कूद पड़े।” यूनानी क्रिया वेग से उछलकर आक्रमण करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या, “दुर्गंधयुक्त शोरबे।” यहाँ प्रयुक्त यूनानी संज्ञा रस, शोरबे या किसी तरल मिश्रण को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνθα
  choice: वहाँ
  rationale: यह दृश्य के स्थान की ओर संकेत करने वाला क्रियाविशेषण है; ‘वहाँ’ इसकी सजीव स्थानवाचक शक्ति को बनाए रखता है।
- source_word: διὰ κακοτέχνων ὀργάνων
  choice: यातना देने के लिए बड़ी दुष्टता से बनाए गए उपकरणों से
  rationale: κακότεχνος में हानिकारक उद्देश्य से कौशलपूर्वक रचे जाने का भाव है और ὄργανα उपकरण हैं। प्रसंग के अनुसार ये यातना के उपकरण हैं; अनुवाद दुर्भावनापूर्ण निर्माण और साधन—दोनों भाव व्यक्त करता है।
- source_word: καταφλέγοντες
  choice: झुलसाते हुए
  rationale: क्रिया तीव्र रूप से जलाने या झुलसाने को व्यक्त करती है। ‘झुलसाते हुए’ यातना की जारी क्रिया को स्वाभाविक हिन्दी में रखता है।
- source_word: ὑπερίπτοσαν
  choice: उस पर झपट पड़े
  rationale: दुर्लभ क्रिया में किसी पर उछलकर या वेग से टूट पड़ने का भाव हो सकता है। ‘झपट पड़े’ हिंसक गति को व्यक्त करता है और अनावश्यक रूप से दिशा निश्चित नहीं करता।
- source_word: δυσώδεις χυλούς
  choice: दुर्गंधयुक्त तरल
  rationale: δυσώδης दुर्गंध का और χυλός रस, शोरबा अथवा किसी तरल मिश्रण का बोध करा सकता है। नथुनों में उँडेलने के प्रसंग में व्यापक ‘तरल’ सबसे स्वाभाविक है और मूल की अर्थ-सीमा सुरक्षित रखता है।
- source_word: μυκτῆρας
  choice: नथुनों
  rationale: यूनानी बहुवचन सामान्यतः नाक के छिद्रों को स्पष्ट रूप से बताता है; ‘नथुनों’ वही शारीरिक सटीकता रखता है।
- source_word: κατέχεον
  choice: उँडेलते रहे
  rationale: अपूर्ण भूतकाल जारी या बार-बार की गई क्रिया का संकेत दे सकता है। ‘उँडेलते रहे’ उस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
