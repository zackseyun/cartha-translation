  register: आधुनिक मानक हिन्दी में सजीव किंतु गरिमापूर्ण वर्णन रखा गया है। यातना की कठोरता को कम नहीं किया गया, पर अत्यधिक तकनीकी या अस्वाभाविक शब्दावली से बचा गया है। क्रियाओं में जारी क्रिया और हिंसक गति को स्पष्ट रखा गया है; χυλός और ὑπερίπτοσαν की वास्तविक शब्दार्थगत व्यापकता पादटिप्पणियों में सुरक्षित है।
