  yaml_path: translation/deuterocanon/4_maccabees/006/006.yaml
  text: But no—no—no! Lifting his eyes high toward heaven[a], the old man was exposing his flesh to the whips, and was streaming with blood[c][b], and his sides were being pierced.
translation:
  language: hi
  text: पर नहीं—नहीं—नहीं! अपनी आँखें ऊपर स्वर्ग की ओर उठाकर, वह वृद्ध कोड़ों के आगे अपना मांस उघाड़े जा रहा था[a]; वह लहू से तर होता जा रहा था[b], और उसके पार्श्व बेधे जा रहे थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोड़ों के प्रहारों से उसका मांस दिखाई देने लगा था।” यूनानी क्रिया का अर्थ मांस को प्रकट करना अथवा प्रकट होते दिखाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उससे लहू बहता जा रहा था।” यूनानी अभिव्यक्ति लगातार बहते या शरीर पर फैलते लहू पर बल देती है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसकी पसलियाँ बेधी जा रही थीं।” यूनानी शब्द शरीर के पार्श्वों या विशेष रूप से पसलियों के क्षेत्र को बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἀλλὰ ἀλλὰ
  choice: पर नहीं—नहीं—नहीं!
  rationale: तीन बार दोहराया गया ἀλλά अचानक और अत्यंत बलपूर्ण प्रतिवाद व्यक्त करता है। हिन्दी में केवल ‘पर, पर, पर’ अस्वाभाविक होता; ‘पर नहीं—नहीं—नहीं!’ उसका भावात्मक वेग बनाए रखता है।
- source_word: ὑψηλοὺς ἀντείνας ... τοὺς ὀφθαλμούς
  choice: अपनी आँखें ऊपर ... उठाकर
  rationale: ἀντείνας ऊपर की ओर फैलाने या उठाने की शारीरिक क्रिया बताता है; यह हिन्दी में स्वाभाविक और दृश्यात्मक है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर
  rationale: धार्मिक शहादत के प्रसंग में οὐρανός के लिए ‘स्वर्ग’ उपयुक्त है, जबकि ‘की ओर’ दिशा बताता है और स्वर्ग में प्रवेश का अर्थ नहीं जोड़ता।
- source_word: ἀπέφαινετο ταῖς μάστιξιν τὰς σάρκας
  choice: कोड़ों के सामने अपना मांस उघाड़े जा रहा था
  rationale: ἀπέφαινετο में प्रकट करने या दिखाई देने देने का भाव है और ταῖς μάστιξιν को कोड़ों के साथ संबद्ध दत्तिव माना गया है। अपूर्णकाल ongoing दृश्य को बनाए रखता है; संभावित अधिक निष्क्रिय अर्थ पादटिप्पणी में दिया गया है।
- source_word: τὰς σάρκας
  choice: अपना मांस
  rationale: यहाँ σάρξ शारीरिक यातना के संदर्भ में प्रत्यक्ष देह-मांस है; ‘मांस’ उस ठोस और कठोर चित्र को सुरक्षित रखता है।
- source_word: ὁ γέρων
  choice: वह वृद्ध
  rationale: γέρων उसकी अधिक आयु पर बल देता है। ‘वह वृद्ध’ आधुनिक हिन्दी में सम्मानपूर्ण, संक्षिप्त और स्वाभाविक है।
- source_word: κατερρεῖτο τῷ αἵματι
  choice: वह लहू से तर होता जा रहा था
  rationale: अपूर्णकाल लगातार बहते या शरीर पर फैलते लहू का दृश्य देता है। ‘तर होता जा रहा था’ संचयी परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि बहने का वैकल्पिक बिंब पादटिप्पणी में रखा गया है।
- source_word: τὰ πλευρά
  choice: उसके शरीर के दोनों ओर का भाग
  rationale: πλευρά शरीर के पार्श्वों या अधिक विशेष रूप से पसलियों के क्षेत्र को बता सकता है। मुख्य पाठ व्यापक अर्थ रखता है और संकीर्ण विकल्प पादटिप्पणी में देता है।
- source_word: κατετιτρώσκετο
  choice: बेधा जा रहा था
  rationale: अपूर्णकाल निष्क्रिय रूप बार-बार या लगातार किए जा रहे घावों को दर्शाता है। ‘बेधा जा रहा था’ इसकी तीव्रता और जारी क्रिया दोनों बनाए रखता है।
theological_decisions:
- issue: σάρκας का शाब्दिक या रूपक अर्थ
  choice: शाब्दिक शारीरिक ‘मांस’
  alternative: ‘शरीर’ या ‘त्वचा’
  rationale: प्रसंग प्रत्यक्ष शारीरिक यातना का है; यहाँ कोई नैतिक या धर्मवैज्ञानिक रूपक संकेतित नहीं है।
- issue: οὐρανός का अर्थ
  choice: स्वर्ग
  alternative: आकाश
  rationale: ऊपर उठी दृष्टि का धार्मिक प्रसंग ‘स्वर्ग’ का समर्थन करता है, पर पाठ में प्रार्थना या किसी विशिष्ट धर्मसैद्धांतिक निष्कर्ष को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘वृद्ध’, ‘लहू’, ‘मांस’ और ‘बेधा’ जैसे शब्द गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य हैं। अपूर्णकालीन क्रियाओं को ‘जा रहा था’ से व्यक्त कर यातना की लगातार चलती क्रिया सुरक्षित रखी गई है; डैश और तीन बार ‘नहीं’ मूल के आकस्मिक भावात्मक बल को दर्शाते हैं।
