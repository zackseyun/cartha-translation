translation:
  language: hi
  text: हम, जो अब्राहम की संतान हैं, इतना बुरा न सोचें कि हिम्मत हारकर हमारे लिए अशोभनीय नाटक में भूमिका निभाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖδες
  choice: संतान
  rationale: यहाँ अब्राहम के वंशजों की सामूहिक पहचान व्यक्त होती है; ‘संतान’ स्त्री-पुरुष दोनों को समेटता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μαλακοψυχήσαντας
  choice: हिम्मत हारकर
  rationale: शब्द का भाव मन से दुर्बल या कायर पड़ जाने का है; यह प्रयोग आधुनिक हिन्दी में उसी मानसिक दुर्बलता को सहज रूप से व्यक्त करता है।
- source_word: ἀπρεπὲς ἡμῖν δρᾶμα
  choice: ऐसा अशोभनीय काम ... जो हमें शोभा नहीं देता
  rationale: ἀπρεπές और ἡμῖν दोनों को स्पष्ट रखते हुए कार्य की अनुचितता और वक्ताओं की पहचान के प्रतिकूल होने का भाव सुरक्षित किया गया है।
- source_word: ὑποκρίνασθαι
  choice: करने का ढोंग करें
  rationale: क्रिया में किसी भूमिका को निभाने या कार्य का दिखावा करने का भाव है; प्रसंग में वास्तविक कार्य के बजाय उसका छलपूर्ण अभिनय अभिप्रेत है।
