- source_word: μάστιξιν
  choice: कोड़ों से
  rationale: Instrumental dative plural; ‘कोड़े’ आधुनिक हिन्दी में स्पष्ट और सुलभ है तथा यातना के साधन को ठीक व्यक्त करता है।
- source_word: κατήκιζον
  choice: यातना देते रहे
  rationale: Imperfect काल लगातार चल रही दुर्व्यवहारपूर्ण कार्रवाई को दर्शाता है। ‘यातना देते रहे’ उसकी अवधि और गंभीरता दोनों को व्यक्त करता है।
