    text: “उनके लिए” यूनानी के प्रतिनिधिक भाव को बनाए रखता है, पर यह नहीं बताता कि हमारा दण्ड उनके लिए किस विशिष्ट धर्मसैद्धान्तिक ढाँचे के अनुसार प्रभावी माना गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ἵλεως γενοῦ
  choice: दया कर
  rationale: यह यूनानी मुहावरा अनुग्रहपूर्ण दया की प्रार्थना है। ‘दया कर’ आधुनिक हिन्दी में स्वाभाविक और प्रार्थनापूर्ण है तथा ‘प्रसन्न हो’ जैसे कम स्पष्ट विकल्प से अधिक ठीक अर्थ देता है।
- source_word: τῷ ἔθνει σου
  choice: अपनी प्रजा पर
  rationale: ἔθνος यहाँ वाचा-समुदाय को सामूहिक रूप में दर्शाता है। ‘प्रजा’ परमेश्वर से उसके लोगों का संबंध और सामूहिक भाव दोनों व्यक्त करती है; हिन्दी की स्वाभाविक कारक-रचना के अनुसार ‘पर’ रखा गया है।
- source_word: ἀρκεσθεὶς
  choice: पर्याप्त मानकर
  rationale: यह कृदन्त किसी बात को काफी या पर्याप्त स्वीकार करने का भाव देता है। ‘पर्याप्त मानकर’ उस निवेदन को स्पष्ट रखता है कि वक्ताओं का दुःख ही काफी माना जाए।
- source_word: τῇ ἡμετέρᾳ ... δίκῃ
  choice: हमें मिले दण्ड को
  rationale: δίκη यहाँ न्याय के अमूर्त सिद्धान्त के बजाय झेले जा रहे दण्ड को सूचित करता है। ‘हमें मिले दण्ड’ हिन्दी में स्वाभाविक रूप से वक्ताओं के दण्डित दुःख को व्यक्त करता है।
- source_word: περὶ αὐτῶν
  choice: उनकी ओर से
  rationale: संबंधकारक के साथ περί का अर्थ ‘उनके विषय में’ भी हो सकता है, पर इस मध्यस्थतापूर्ण प्रसंग में प्रतिनिधिक भाव प्रमुख है। ‘उनकी ओर से’ उस भाव को बनाए रखता है और बाद की किसी विशिष्ट प्रायश्चित्त-व्याख्या को आरोपित नहीं करता।
theological_decisions:
- issue: περὶ αὐτῶν में शहीदों के दुःख का प्रतिनिधिक भाव
  choice: दण्ड को प्रजा की ओर से मिला हुआ बताया गया है, पर उसके कार्य करने की कोई विस्तृत धर्मसैद्धान्तिक प्रणाली नहीं जोड़ी गई।
  alternative: इसे केवल ‘उनके विषय में’ या ढीले अर्थ में ‘उनके लिए’ समझना।
  rationale: निकटवर्ती प्रसंग मध्यस्थतापूर्ण है और यूनानी वाक्य वक्ताओं के दण्ड को प्रजा से प्रतिनिधिक रूप में जोड़ता है। अनुवाद इस तनाव को सुरक्षित रखता है, उसे बाद के किसी नामित प्रायश्चित्त-सिद्धान्त में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण प्रार्थना-शैली में है। परमेश्वर को संबोधित एकवचन आज्ञार्थक ‘कर’ बाइबलीय हिन्दी में निकटता और विनती दोनों व्यक्त करता है। वाक्यक्रम यूनानी के कृदन्तीय संबंध को स्वाभाविक हिन्दी में कारण/आधार के रूप में सामने रखता है।
