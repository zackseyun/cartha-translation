  text: अपने राष्ट्र पर दया कर, और उनके लिए हमारे दण्ड को पर्याप्त मान[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके संबंध में हमारे दण्ड से संतुष्ट होकर।”
    reason: lexical_alternative
