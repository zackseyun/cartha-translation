review_pass:
  verdict: revise
  source_fidelity: Draft captures the conditional rhetorical claim, lifelong conduct up to old age, truth, lawfully maintaining δόξα, and the prospective change of course. However, its word order makes the participial actions sound merely prior to the present decision rather than continuing life practice, and “उससे मिली प्रतिष्ठा” adds an acquisitive nuance not expressed by φυλάσσω (“guard/maintain”).
  naturalness: The Hindi is generally idiomatic and appropriately dignified. Recasting the conditional clause with finite perfect verbs makes the long sentence clearer and more natural without losing its intentionally unfinished, comma-ended form.
  terminology: “विवेकहीन,” “सत्य,” “प्रतिष्ठा,” and “व्यवस्था” are suitable. “विधिपूर्वक” renders νομίμως more directly than “व्यवस्था के अनुसार” while retaining the legal/observant sense. The referent of ἐπ’ αὐτῶν is syntactically uncertain; “उस पर आधारित” preserves its dependence on the preceding life of truth without over-specifying it.
  issues:
  - severity: medium
    issue: “उससे मिली प्रतिष्ठा”
    rationale: The Greek says to preserve/guard the reputation or glory “upon/based on” the preceding referent(s); it does not explicitly say that the reputation was received or bestowed. “मिली” therefore introduces a small additional nuance.
  - severity: low
    issue: Temporal framing of the participles
    rationale: “...जीने और ...बनाए रखने के बाद” can suggest completed acts followed by a new stage. The Greek participles describe the established life pattern that grounds the conditional claim; finite perfect forms express this more smoothly in Hindi.
  revised_text: क्योंकि यदि हमने बुढ़ापे तक अपना सारा जीवन सत्य के अनुसार बिताया है और उस पर आधारित प्रतिष्ठा को विधिपूर्वक बनाए रखा है, तो अब अपना मार्ग बदल लेना सचमुच विवेकहीन होगा,
  revised_footnotes: []
  revision_rationale: The revision retains the source’s conditional structure and trailing comma while replacing the added “मिली” nuance, making the ongoing lifelong conduct clearer, and rendering νομίμως more directly. “उस पर आधारित” cautiously retains the dependent sense of ἐπ’ αὐτῶν without resolving its debated antecedent beyond what the Hindi sentence can naturally bear.
