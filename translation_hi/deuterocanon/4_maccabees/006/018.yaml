  text: For it would indeed be irrational, if, after living our whole life up to old age in truth and lawfully preserving the reputation founded on it, we should now change course,
translation:
  language: hi
  text: क्योंकि यदि हमने बुढ़ापे तक अपना सारा जीवन सत्य के अनुसार बिताया है और उस पर आधारित प्रतिष्ठा को विधिपूर्वक बनाए रखा है, तो अब अपना मार्ग बदल लेना सचमुच विवेकहीन होगा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογιστον
  choice: विवेकहीन बात
  rationale: यह शब्द तर्क या विवेक के विरुद्ध होने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: πρὸς ἀλήθειαν
  choice: सत्य के अनुसार
  rationale: πρός के मानक/अनुरूपता वाले भाव को सुरक्षित रखता है और केवल अस्पष्ट 'सत्य में' से अधिक स्पष्ट है।
- source_word: τὸν μέχρι γήρως βίον
  choice: बुढ़ापे तक अपना पूरा जीवन
  rationale: βίον की जीवन-अवधि और μέχρι γήρως की सीमा दोनों को स्पष्ट करता है।
- source_word: τὴν ἐπ’ αὐτῶν δόξαν
  choice: उससे मिली प्रतिष्ठा
  rationale: δόξα यहाँ सार्वजनिक मान-सम्मान या प्रतिष्ठा है; बहुवचन αὐτῶν का पूर्ववर्ती जीवन और सत्यनिष्ठ आचरण समष्टिगत रूप से लिया गया है, जिसे हिन्दी में सहज रूप से 'उससे' कहा गया है।
- source_word: νομίμως φυλάσσοντες
  choice: व्यवस्था के अनुसार बनाए रखने
  rationale: νομίμως में नियमसंगत/व्यवस्था-अनुरूप आचरण का भाव है; प्रसंग की व्यवस्था-निष्ठा को बिना संप्रदायगत विस्तार के व्यक्त करता है।
- source_word: μεταβαλοίμεθα
  choice: अपना मार्ग बदल लें
  rationale: शाब्दिक 'बदल जाएँ' की अपेक्षा प्रसंग में जीवन-नीति से पलटने का भाव स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: ἀλήθεια और νόμιμος का संबंध
  choice: '''सत्य के अनुसार'' और ''व्यवस्था के अनुसार'' को अलग-अलग बनाए रखा'
  alternative: दोनों को मिलाकर 'सच्चाई और व्यवस्था के प्रति निष्ठावान' कहना
  rationale: यूनानी पाठ के दो पृथक विचारों और उनके बीच विद्यमान नैतिक तनाव को सुरक्षित रखा गया है।
- issue: δόξα का अर्थ
  choice: प्रतिष्ठा
  alternative: महिमा
  rationale: यहाँ वृद्ध वक्ता के जीवन से अर्जित सार्वजनिक सम्मान का संदर्भ अधिक संभावित है; धार्मिक 'महिमा' अनावश्यक धर्मवैज्ञानिक अर्थ जोड़ सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य के अंत में अल्पविराम रखा गया है, क्योंकि यूनानी पाठ और संदर्भ में विचार अगली आयत में जारी रहता है।
