- from: क्योंकि यह सचमुच विवेकहीन बात होगी कि हम, बुढ़ापे तक अपना पूरा जीवन सत्य के अनुसार जीने और उससे मिली प्रतिष्ठा को व्यवस्था के अनुसार बनाए रखने के बाद, अब अपना मार्ग बदल लें,
  to: क्योंकि यदि हमने बुढ़ापे तक अपना सारा जीवन सत्य के अनुसार बिताया है और उस पर आधारित प्रतिष्ठा को विधिपूर्वक बनाए रखा है, तो अब अपना मार्ग बदल लेना सचमुच विवेकहीन होगा,
  rationale: The revision retains the source’s conditional structure and trailing comma while replacing the added “मिली” nuance, making the ongoing lifelong conduct clearer, and rendering νομίμως more directly. “उस पर आधारित” cautiously retains the dependent sense of ἐπ’ αὐτῶν without resolving its debated antecedent beyond what the Hindi sentence can naturally bear.
