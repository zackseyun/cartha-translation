  text: Then indeed one of the cruel guards[a], leaping at his sides, kept striking him so that, when he fell[b], he might rise again.
translation:
  language: hi
  text: तब उन क्रूर अंगरक्षकों[a] में से एक उसके पहलुओं की ओर झपटता हुआ उसे लातें मारता रहा, ताकि वह गिरते हुए फिर खड़ा हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘भाला धारण करने वालों’; इससे शासक के अंगरक्षक या पहरेदार अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: λάξ ... ἔτυπτεν
  choice: लातें मारता रहा
  rationale: λάξ का अर्थ ‘पैर से/लात मारकर’ है और अपूर्ण भूतकाल ἔτυπτεν लगातार या बार-बार मारने की क्रिया दिखाता है।
- source_word: τῶν πικρῶν
  choice: उन क्रूर
  rationale: व्यक्तियों के लिए πικρός यहाँ शाब्दिक ‘कड़वा’ नहीं, बल्कि कठोर और निर्दयी स्वभाव व्यक्त करता है।
- source_word: δορυφόρων
  choice: अंगरक्षकों
  rationale: शब्द का शाब्दिक अर्थ ‘भाला धारण करने वाले’ है, पर राजकीय संदर्भ में यह अंगरक्षकों या पहरेदारों के लिए प्रयुक्त होता है।
- source_word: εἰς τοὺς κενεῶνας
  choice: उसके पहलुओं पर
  rationale: κενεών शरीर के दोनों ओर पसलियों और कूल्हों के बीच के भाग को सूचित करता है; ‘पहलू’ आधुनिक हिन्दी में इस शारीरिक स्थान को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐναλλόμενος
  choice: झपटकर
  rationale: कृदंत अचानक और बलपूर्वक उसकी ओर या उस पर उछलने की सजीव गति व्यक्त करता है।
- source_word: ὅπως ἐξανίσταιτο πίπτων
  choice: ताकि गिरते समय वह फिर उठ खड़ा हो जाए
  rationale: ὅπως उद्देश्य व्यक्त करता है; पीटे जाने का लक्ष्य यह था कि यातना से गिरता हुआ व्यक्ति दोबारा अपने पैरों पर खड़ा हो। ‘उठ खड़ा हो’ शारीरिक क्रिया को स्पष्ट रखता है।
theological_decisions:
- issue: ἐξανίσταιτο को पुनरुत्थान-संबंधी भाषा समझे जाने की संभावना
  choice: फिर उठ खड़ा हो जाए
  alternative: फिर जी उठे
  rationale: इस यातना-वृत्तांत में क्रिया का आशय गिरने के बाद शारीरिक रूप से दोबारा खड़ा होना है। ‘जी उठे’ अनावश्यक रूप से पुनरुत्थान का धार्मिक अर्थ ला सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्य की कठोरता के अनुरूप रखी गई है। ‘पहलुओं’ शरीर के दोनों किनारों को सूचित करता है और ‘लातें मारता रहा’ यूनानी λάξ तथा अपूर्ण भूतकाल की आवृत्तिमूलक शक्ति को स्पष्ट रूप से सुरक्षित रखता है।
