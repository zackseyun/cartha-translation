  text: Even if it is ridiculous, I demonstrate not only that reason has gained mastery over pains, but also that it rules over pleasures and does not yield to them.
translation:
  language: hi
  text: चाहे यह हास्यास्पद ही क्यों न हो, मैं यह दिखाता हूँ कि विवेक ने न केवल पीड़ाओं पर विजय पाई है, बल्कि वह सुखों को भी वश में रखता है और उनके आगे नहीं झुकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ καὶ γελοῖον
  choice: चाहे यह हास्यास्पद ही क्यों न हो
  rationale: यह पदबंध अधूरा-सा और रियायती है। यह अनुवाद γελοῖον के ‘हास्यास्पद’ अर्थ को बनाए रखते हुए यूनानी वाक्य की वास्तविक अस्पष्टता को नहीं मिटाता।
- source_word: ἀλγηδόνων
  choice: पीड़ाओं
  rationale: यह शब्द दर्द अथवा पीड़ा के अनुभवों को बताता है। संदर्भ यातना का है, फिर भी ‘यातनाओं’ कहना मूल शब्द की तीव्रता को अनावश्यक रूप से बढ़ा देता।
- source_word: ἐπιδείκνυμι
  choice: मैं यह दिखाता हूँ
  rationale: क्रिया का अर्थ प्रत्यक्ष रूप से दिखाना या प्रदर्शित करना है। आधुनिक हिन्दी में ‘दिखाता हूँ’ स्वाभाविक है और वक्ता के सार्वजनिक प्रमाण का भाव रखता है।
- source_word: κεκρατηκέναι τὸν λογισμόν
  choice: विवेक ने ... विजय पाई है
  rationale: पूर्णकालिक infinitive प्राप्त और बनी हुई विजय को सूचित करता है। ‘विजय पाई है’ उस सिद्ध अवस्था को व्यक्त करता है।
- source_word: τὸν λογισμόν
  choice: विवेक
  rationale: इस ग्रंथ में λογισμός आवेगों पर शासन करने वाली तर्कशील निर्णय-शक्ति का प्रमुख शब्द है। ‘विवेक’ साधारण आधुनिक हिन्दी में स्वाभाविक है और केवल अमूर्त तर्क के बजाय नैतिक-तर्कशील निर्णय का भाव भी देता है।
- source_word: τῶν ἡδονῶν κρατεῖν
  choice: सुखों को भी वश में रखता है
  rationale: κρατέω यहाँ अधिकार अथवा प्रभुत्व रखने का भाव देता है। ‘वश में रखता है’ उसी नियंत्रण को सहज हिन्दी में व्यक्त करता है।
- source_word: μηδὲ αὐταῖς ὑπείκειν
  choice: और उनके आगे नहीं झुकता
  rationale: ὑπείκω का अर्थ रास्ता देना, हार मानना या झुकना है। यह रूप सुखों के दबाव के सामने अडिग रहने की छवि को सुरक्षित रखता है।
theological_decisions:
- issue: शहादत के दार्शनिक संदर्भ में λογισμός का अनुवाद
  choice: विवेक
  alternative: तर्कबुद्धि; तर्कशील निर्णय-शक्ति
  rationale: ग्रंथ का तर्क है कि धर्मनिष्ठ विवेक आवेगों पर प्रभुत्व रखता है। ‘विवेक’ इस अवधारणा को पठनीय हिन्दी में रखता है, बिना बाद की किसी विशिष्ट दार्शनिक या साम्प्रदायिक शब्दावली को आरोपित किए।
- issue: यातना के संदर्भ के कारण ἀλγηδόνων को अधिक तीव्र बनाना या न बनाना
  choice: पीड़ाओं
  alternative: यातनाओं; दुखों
  rationale: तात्कालिक संदर्भ कठोर यातना का है, पर संज्ञा का मूल अर्थ ‘पीड़ाएँ’ है। इसलिए अनुवाद शब्द में ऐसी अतिरिक्त तीव्रता नहीं जोड़ता जो केवल संदर्भ से आती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। ‘विवेक’ को इस ग्रंथ के प्रमुख दार्शनिक पद λογισμός के लिए रखा गया है। आरम्भिक यूनानी पदबंध की संक्षिप्त और कुछ अस्पष्ट प्रकृति को व्याख्यात्मक पूर्ति से नहीं सुलझाया गया।
