review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two distinct Greek terms τύπος and παράδειγμα as “नमूना” and “उदाहरण,” and correctly keeps the reference to young people broad. However, “बन जाएँगे” makes the optative γενοίμεθα sound like a definite future assertion rather than the potential/consequential sense of the Greek. “अशुद्ध भोजन करने” is understandable but less idiomatic and can suggest preparing a meal rather than consuming something defiled.
  naturalness: “भक्ति-विहीनता” is grammatically possible but notably stiff and uncommon in modern standard Hindi. “अधार्मिकता” is more natural in this elevated context. “अपवित्र वस्तु खाने” is idiomatic and expresses the broad, non-technical sense of μιαροφαγίας without adding “forbidden.”
  terminology: “अधार्मिकता” retains the religious-moral force of ἀσεβείας without imposing a sectarian interpretation. “अपवित्र वस्तु खाने” preserves the source’s general notion of eating what is defiled; it does not over-specify the food as legally forbidden. The lexical distinction between “नमूना” and “उदाहरण” is retained.
  issues:
  - severity: medium
    issue: Definite future force in “बन जाएँगे”
    rationale: The Greek optative γενοίμεθα is potential/consequential in force. “बन जाएँ” better reflects this than a definite future form.
  - severity: medium
    issue: Awkward and potentially imprecise wording “अशुद्ध भोजन करने”
    rationale: In Hindi this can be read as the act of making/providing an impure meal. “अपवित्र वस्तु खाने” naturally denotes consuming what is defiled and retains the Greek’s breadth.
  - severity: low
    issue: Markedly unnatural term “भक्ति-विहीनता”
    rationale: Although semantically defensible, it is less natural than “अधार्मिकता” in modern standard Hindi and does not improve source fidelity.
  revised_text: और हम स्वयं युवाओं के लिए अधार्मिकता का एक नमूना बन जाएँ, ताकि हम अपवित्र वस्तु खाने का उदाहरण बनें।
  revised_footnotes: []
  revision_rationale: The revision changes the first verb to a potential form, improves idiomatic Hindi, and maintains the source’s rhetorical differentiation between τύπος (“नमूना”) and παράδειγμα (“उदाहरण”). It also renders μιαροφαγίας broadly as eating something defiled, without importing the more specific idea of legally forbidden food.
