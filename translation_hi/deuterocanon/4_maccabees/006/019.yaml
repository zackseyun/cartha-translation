  text: and we ourselves would become a pattern of ungodliness for the young[a], so that we might become an example of eating what is defiled.
translation:
  language: hi
  text: और हम स्वयं युवाओं के लिए अधार्मिकता का एक नमूना बन जाएँ, ताकि हम अपवित्र वस्तु खाने का उदाहरण बनें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύπος
  choice: नमूना
  rationale: यह शब्द किसी प्रतिरूप, ढाँचे या अनुकरणीय नमूने को सूचित कर सकता है। παράδειγμα से शब्दगत भेद बनाए रखने के लिए यहाँ “नमूना” चुना गया है।
- source_word: ἀσεβείας
  choice: भक्ति-विहीनता
  rationale: यह परमेश्वर के प्रति श्रद्धा या भक्ति के अभाव को व्यक्त करता है; “भक्ति-विहीनता” धार्मिक-नैतिक अर्थ को आधुनिक, बोधगम्य हिन्दी में बनाए रखता है।
- source_word: τοῖς νέοις
  choice: युवाओं के लिए
  rationale: νέοι व्यापक रूप से युवा लोगों को सूचित कर सकता है; हिन्दी में “युवाओं” लिंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: παράδειγμα
  choice: उदाहरण
  rationale: सामान्य अर्थ “उदाहरण” है। τύπος के लिए “नमूना” रखने से दोनों निकटार्थी यूनानी शब्दों का अलंकारिक भेद बचता है।
- source_word: μιαροφαγίας
  choice: अशुद्ध भोजन करने
  rationale: यह संयुक्त संज्ञा दूषित/अशुद्ध वस्तु खाने या अशुद्ध भोजन की क्रिया को सूचित करती है। “अशुद्ध भोजन करने” हिन्दी में स्वाभाविक है और संदर्भ से अधिक तकनीकी विशिष्टता नहीं जोड़ता।
- source_word: γενοίμεθα / γενώμεθα
  choice: बन जाएँगे / बनें
  rationale: पहला रूप आशंकित परिणाम और दूसरा उद्देश्य/परिणाम की संभावना व्यक्त करता है; हिन्दी में क्रमशः भविष्यसूचक “बन जाएँगे” और “ताकि…बनें” इस भेद को स्वाभाविक रूप से व्यक्त करते हैं।
theological_decisions:
- issue: ἀσεβείας का धार्मिक-नैतिक बल
  choice: भक्ति-विहीनता
  alternative: अधर्म / ईश्वर-विमुखता
  rationale: यह केवल सामाजिक अनुचितता नहीं, बल्कि परमेश्वर के प्रति श्रद्धाहीन आचरण बताता है। “भक्ति-विहीनता” उस तनाव को बिना किसी सांप्रदायिक अर्थ के बनाए रखता है।
- issue: μιαροφαγίας की विशिष्टता
  choice: अशुद्ध भोजन करने
  alternative: अपवित्र वस्तु खाने / निषिद्ध भोजन करने
  rationale: संदर्भ में व्यवस्था द्वारा वर्जित भोजन निहित है, पर यूनानी शब्द स्वयं अपेक्षाकृत व्यापक है। अतः “निषिद्ध” जोड़ने के बजाय मूल की अस्पष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज वाक्य-विन्यास। τύπος और παράδειγμα के लिए अलग शब्द रखकर मूल की समानांतर किन्तु भिन्न अभिव्यक्ति सुरक्षित की गई है।
