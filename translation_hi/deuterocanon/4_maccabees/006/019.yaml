revisions:
- from: और हम स्वयं युवाओं के लिए भक्ति-विहीनता का नमूना बन जाएँगे, ताकि हम अशुद्ध भोजन करने का उदाहरण बनें।
  to: और हम स्वयं युवाओं के लिए अधार्मिकता का एक नमूना बन जाएँ, ताकि हम अपवित्र वस्तु खाने का उदाहरण बनें।
  rationale: The revision changes the first verb to a potential form, improves idiomatic Hindi, and maintains the source’s rhetorical differentiation between τύπος (“नमूना”) and παράδειγμα (“उदाहरण”). It also renders μιαροφαγίας broadly as eating something defiled, without importing the more specific idea of legally forbidden food.
