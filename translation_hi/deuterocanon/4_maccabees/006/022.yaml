  text: In response to this[a], you, O children of Abraham, die nobly for the sake of godliness.
translation:
  language: hi
  text: इस बात के उत्तर में, हे अब्राहम की संतानो, तुम ईश्वर-भक्ति[a] के लिए उदात्त भाव से मरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भक्ति।” यूनानी शब्द εὐσέβεια ईश्वर के प्रति श्रद्धापूर्ण समर्पण को दर्शाता है, जो निष्ठावान आचरण में प्रकट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: इस पर
  rationale: यह संक्षिप्त और स्वाभाविक हिंदी पदबंध पिछली बात के प्रति प्रतिक्रिया का संकेत देता है और यूनानी की संबंधसूचक व्यापकता बनाए रखता है।
- source_word: ὑμεῖς μέν
  choice: तुम तो
  rationale: ‘तुम’ सर्वनाम की प्रबलता और μέν के हल्के विषयगत अथवा विरोधसूचक बल को हिंदी का ‘तो’ सहज रूप से व्यक्त करता है।
- source_word: ὦ Ἀβραὰμ παῖδες
  choice: हे अब्राहम की संतानों
  rationale: ‘संतानों’ पारिवारिक और वाचा-संबंधी भाव को बनाए रखता है, जबकि παῖδες को अनावश्यक रूप से केवल पुरुष वंशजों तक सीमित नहीं करता; ‘हे’ संबोधन की ऊँची आलंकारिक शैली को सुरक्षित रखता है।
- source_word: εὐγενῶς
  choice: उदात्त भाव से
  rationale: यह नैतिक महानता और श्रेष्ठ मनोभाव का बोध कराता है, पर अर्थ को केवल वीरता या साहस तक सीमित नहीं करता।
- source_word: ὑπὲρ τῆς εὐσεβείας
  choice: ईश्वर-भक्ति के लिए
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उससे प्रकट होने वाले आचरण—दोनों को सहज आधुनिक हिंदी में व्यक्त करता है; ‘के लिए’ बलिदानी संदर्भ में ὑπέρ का स्वाभाविक रूप है।
- source_word: τελευτᾶτε
  choice: मरते हो
  rationale: क्रिया जीवन के अंत अथवा मृत्यु को सूचित करती है। सीधा हिंदी रूप अर्थ को स्पष्ट रखता है; गरिमा पहले ही εὐγενῶς के अनुवाद में व्यक्त है।
theological_decisions:
- issue: शहादत के संदर्भ में εὐσέβεια का अनुवाद
  choice: ईश्वर-भक्ति
  alternative: भक्ति; ईश्वर के प्रति श्रद्धापूर्ण निष्ठा
  rationale: ‘ईश्वर-भक्ति’ धार्मिक श्रद्धा और विश्वासयोग्य आचरण दोनों को व्यक्त करती है, बिना इसे किसी बाद की विशिष्ट धर्मवैज्ञानिक पारिभाषिकता में बाँधे।
