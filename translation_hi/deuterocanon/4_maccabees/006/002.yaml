lexical_decisions:
- source_word: καὶ πρῶτον μὲν
  choice: और सबसे पहले
  rationale: καί के संयोजक भाव और πρῶτον μέν से आरम्भ होने वाले क्रम—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: περιέδυσαν
  choice: उसके कपड़े उतार दिए
  rationale: क्रिया किसी व्यक्ति के वस्त्र उतार देने को व्यक्त करती है; यह हिन्दी में स्पष्ट और स्वाभाविक है तथा अपमानजनक कार्रवाई का भाव रखती है।
- source_word: τὸν γεραιὸν
  choice: उस वृद्ध पुरुष
  rationale: γεραιός का सीधा अर्थ वृद्ध या वयोवृद्ध व्यक्ति है। ‘वृद्ध पुरुष’ सम्मानजनक और आधुनिक मानक हिन्दी है।
- source_word: ἐκκεκοσμημένον
  choice: सुशोभित था
  rationale: पूर्ण कृदन्त किसी गुण से सुसज्जित या अलंकृत होने का भाव देता है; रूपक को हिन्दी में बनाए रखने के लिए ‘सुशोभित’ उपयुक्त है।
- source_word: τὴν περὶ τὴν εὐσέβειαν εὐσχημοσύνην
  choice: धर्मनिष्ठा की गरिमा
  rationale: εὐσχημοσύνη में शालीनता, शोभा और गरिमामय आचरण का भाव है, जबकि περὶ τὴν εὐσέβειαν उसे ईश्वरपरायण जीवन से जोड़ता है। संक्षिप्त यूनानी अभिव्यक्ति का गरिमापूर्ण और सुबोध हिन्दी रूप।
- source_word: εὐσέβειαν
  choice: धर्मनिष्ठा
  rationale: 4 मकाबियों में यह ईश्वर और उसकी व्यवस्था के प्रति भक्तिपूर्ण निष्ठा का प्रमुख नैतिक-धार्मिक गुण है। ‘धर्मनिष्ठा’ इस सक्रिय निष्ठा को ‘भक्ति’ की अपेक्षा अधिक व्यापक रूप से व्यक्त करती है।
theological_decisions:
- issue: 4 मकाबियों में εὐσέβεια का अनुवाद
  choice: धर्मनिष्ठा
  alternative: ईश्वर-भक्ति
  rationale: ‘धर्मनिष्ठा’ ईश्वर और उसकी व्यवस्था के प्रति श्रद्धापूर्ण, आचरणगत निष्ठा को समेटती है। ‘ईश्वर-भक्ति’ भी सम्भव है, पर वह शब्द के नैतिक और विधि-निष्ठ आयाम को कुछ संकुचित कर सकती है।
- issue: वस्त्र उतारने और आन्तरिक गरिमा के बीच विरोधाभास
  choice: दोनों को अलग लेकिन साथ जुड़े कथनों के रूप में रखना
  alternative: ऐसा विस्तार करना मानो वे उसकी गरिमा भी छीन सके
  rationale: यूनानी में शारीरिक रूप से कपड़े उतारने की क्रिया और धर्मनिष्ठा से प्राप्त गरिमा साथ रखी गई हैं। अनुवाद यह दावा नहीं करता कि उत्पीड़क उसकी आन्तरिक गरिमा वास्तव में छीन सके।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथन। ‘कपड़े उतार दिए’ क्रिया को स्पष्ट करता है, जबकि ‘सुशोभित था’ मूल के रूपक और वृद्ध की नैतिक गरिमा को सुरक्षित रखता है।
