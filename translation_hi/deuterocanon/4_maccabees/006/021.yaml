  yaml_path: translation/deuterocanon/4_maccabees/006/021.yaml
  text: and shall we be despised by the tyrant as unmanly[a], yet not defend our divine law even to death?
translation:
  language: hi
  text: और क्या उस अत्याचारी शासक की दृष्टि में हम नामर्द ठहरें, फिर भी हम मृत्यु तक अपने ईश्वरीय विधान की रक्षा न करें?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταφρονηθῶμεν
  choice: तुच्छ जाने
  rationale: यूनानी कर्मवाच्य रूप किसी की दृष्टि में घृणा या तिरस्कार का पात्र समझे जाने का भाव देता है; हिंदी में कर्तृवाच्य पुनर्गठन अधिक स्वाभाविक है और वही मान-अपमान का बल बनाए रखता है।
- source_word: τύραννος
  choice: अत्याचारी
  rationale: यह शब्द किसी तटस्थ राजा या शासक के बजाय क्रूर, निरंकुश शासक का बोध कराता है; ‘अत्याचारी’ आधुनिक हिंदी में उसका नैतिक मूल्यांकन स्पष्ट रखता है।
- source_word: ἄνανδροι
  choice: नामर्द
  rationale: यूनानी शब्द शाब्दिक रूप से पुरुषोचित साहस के अभाव का लिंग-विशिष्ट अपमान है। ‘नामर्द’ उस तीखी, लिंग-आधारित वक्तृता को बनाए रखता है; अर्थगत विकल्प ‘कायर’ पादटिप्पणी में दिया गया है।
- source_word: θεῖον
  choice: ईश्वरीय
  rationale: विशेषण विधान को परमेश्वर से संबंधित या उसका ठहराया हुआ बताता है; ‘ईश्वरीय’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: νόμον
  choice: विधान
  rationale: इस यहूदी संदर्भ में νόμος परमेश्वर-प्रदत्त व्यवस्था को सूचित करता है। ‘विधान’ धार्मिक-कानूनी अर्थ को गरिमा के साथ व्यक्त करता है और केवल आधुनिक नागरिक कानून का आभास नहीं देता।
- source_word: μέχρι θανάτου
  choice: मृत्यु तक
  rationale: यह वाक्यांश प्रतिबद्धता की अंतिम सीमा—मृत्यु—तक डटे रहने का भाव सीधे व्यक्त करता है।
- source_word: προασπίσαιμεν
  choice: रक्षा करें
  rationale: क्रिया का मूल चित्र किसी वस्तु के आगे ढाल थामने का है और विस्तार से उसका बचाव करने का अर्थ देती है; ‘रक्षा करें’ हिंदी में उपयुक्त और स्वाभाविक है।
theological_decisions:
- issue: ἄνανδροι में लिंग-विशिष्ट अपमान
  choice: नामर्द
  alternative: कायर
  rationale: मूल की दलील केवल सामान्य कायरता नहीं, पुरुषोचित साहस से रहित ठहराए जाने की सामाजिक लज्जा पर आधारित है। मुख्य पाठ में उस तनाव को बनाए रखा गया है, जबकि पादटिप्पणी अर्थगत विकल्प स्पष्ट करती है।
- issue: νόμος का धार्मिक आशय
  choice: ईश्वरीय विधान
  alternative: ईश्वरीय व्यवस्था / परमेश्वर की व्यवस्था
  rationale: θεῖον νόμον को उसके परमेश्वर-संबंधी अधिकार सहित रखा गया है, पर मूल विशेषण को संबंधवाचक वाक्यांश में विस्तार देकर किसी अतिरिक्त doctrinal दावे को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु तीखा आलंकारिक प्रश्न। ‘नामर्द’ जानबूझकर मूल के अपमानजनक और लिंग-विशिष्ट बल को रखता है; इसे समर्थन या सामान्य प्रयोग के रूप में नहीं, वक्ता पर लगाए जाने वाले तिरस्कार के रूप में पढ़ा जाना चाहिए।
