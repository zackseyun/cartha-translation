  text: Why are you irrationally destroying yourself with these evils[a], Eleazar?
translation:
  language: hi
  text: “एलीआज़र, तुम इन विपत्तियों से[a] विवेकहीन होकर अपने आपको क्यों नष्ट कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन विपत्तियों के द्वारा” अथवा “इन विपत्तियों के बीच”; यूनानी दत्तिव साधन या परिस्थिति, दोनों का भाव दे सकता है। प्रसंग में यह एलीआज़र पर ढाए जा रहे कष्टों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: क्यों
  rationale: यहाँ प्रश्न किसी वस्तु के विषय में नहीं, बल्कि एलीआज़र के आचरण के कारण या उद्देश्य पर उलाहना देने के लिए है; इसलिए हिन्दी में ‘क्यों’ स्वाभाविक है।
- source_word: τοῖς κακοῖς τούτοις
  choice: इन विपत्तियों से
  rationale: κακά का अर्थ व्यापक है और यहाँ एलीआज़र पर आ रहे दुःखद तथा हानिकारक कष्टों की ओर संकेत करता है। ‘विपत्तियों’ मूल की व्यापकता बनाए रखता है और ‘यातनाओं’ जितना विशिष्ट नहीं है। करण/परिस्थिति सूचक दत्तिव को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: σεαυτὸν
  choice: अपने आपको
  rationale: यह ἀπόλλυες का प्रत्यक्ष निजवाचक कर्म है; ‘अपने आपको’ स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ἀλογίστως
  choice: विवेकहीन होकर
  rationale: यह शब्द तर्क, विचार या विवेक के बिना काम करने का भाव देता है। ‘विवेकहीन होकर’ पुस्तक में विवेक और आवेग के बीच उपस्थित तनाव को बनाए रखता है।
- source_word: ἀπόλλυες
  choice: नष्ट कर रहे हो
  rationale: क्रिया वक्ता के आरोप में चल रही आत्म-विनाशकारी प्रक्रिया व्यक्त करती है। यूनानी का अपूर्ण भूतकाल प्रसंगगत प्रत्यक्ष संबोधन में वर्तमान में जारी कार्य के रूप में स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: Ἐλεάζαρ
  choice: एलीआज़र
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय प्रयोग के अनुरूप लिप्यंतरित किया गया है।
theological_decisions:
- issue: एलीआज़र की शहादत के प्रसंग में κακοῖς का अर्थ
  choice: व्यापक अर्थ वाला ‘विपत्तियों’
  alternative: ‘यातनाओं’, ‘कष्टों’ या ‘बुराइयों’
  rationale: मूल यूनानी शब्द किसी विशिष्ट तकनीकी प्रकार की यातना तक सीमित नहीं है। ‘विपत्तियों’ प्रसंग के दुःख और हानि को व्यक्त करते हुए मूल की नैतिक तथा क्लेश-संबंधी व्यापकता को खुला रखता है।
- issue: ἀλογίστως में विवेक और आवेग का तनाव
  choice: ‘विवेकहीन होकर’
  alternative: ‘मूर्खतापूर्वक’ या ‘बिना सोचे-समझे’
  rationale: ‘विवेकहीन’ λόγος से संबंधित तर्क-विवेक के भाव को अधिक स्पष्टता से सुरक्षित रखता है और वक्ता के आरोप को किसी विशेष धर्मवैधानिक व्याख्या में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष संबोधन के अनुरूप रखी गई है। ‘विवेकहीन होकर’ दार्शनिक शब्दावली को सामान्य पाठक के लिए समझने योग्य रखते हुए मूल पुस्तक के विवेक-विषयक स्वर को सुरक्षित करता है।
