  rationale: यहाँ μέλλω निरपेक्ष रूप में कार्रवाई टालने या हिचकने पर अधीर प्रश्न व्यक्त करता है, केवल भविष्य की क्रिया नहीं।
- source_word: οἱ δὲ
  choice: लेकिन तुम
  rationale: δὲ विरोध अथवा प्रसंग-मोड़ दिखाता है, और आगे का प्रश्न रक्षकों को सीधे संबोधित करता है; इसलिए ‘लेकिन तुम’ स्वाभाविक और अर्थनिष्ठ है।
