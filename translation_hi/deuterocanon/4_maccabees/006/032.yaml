base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/032.yaml
  text: For if the passions had gained mastery over reason[b][a], I would have given them testimony to my self-control.
translation:
  language: hi
  text: क्योंकि यदि मनोवेग विवेक पर हावी हो गए होते, तो मैं उनके प्रभुत्व की गवाही देता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो मैं उन्हें प्रबलता का प्रमाण देता।”
    reason: ग्रीक वाक्यांश को अधिक शाब्दिक ढंग से भी समझा जा सकता है; ‘प्रभुत्व’ का संबंध प्रसंगतः मनोवेगों से है।
lexical_decisions:
- source_word: πάθη
  choice: मनोवेग
  rationale: यहाँ शब्द बाहरी दुःखों के बजाय मनुष्य के भीतर उठने वाले भावनात्मक आवेगों के लिए प्रयुक्त दार्शनिक-नैतिक पद है। ‘मनोवेग’ इस अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λογισμοῦ
  choice: विवेक
  rationale: यहाँ λογισμός भावनात्मक आवेगों के विपरीत खड़ी तर्क-विवेक की शक्ति को दर्शाता है; ‘विवेक’ इस नैतिक और बौद्धिक अर्थ को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: κεκράτηκει
  choice: हावी हो गए होते
  rationale: क्रिया किसी पर अधिकार या विजय पाने का भाव रखती है। यह पदबंध उसके पूर्ण भूतकालिक और काल्पनिक बल को सहज हिन्दी में बनाए रखता है।
- source_word: ἀπεδόμην
  choice: मैं ... गवाही देता
  rationale: ἀποδίδωμι का अर्थ यहाँ किसी को गवाही देना या उसके पक्ष में प्रमाण प्रस्तुत करना है। हिन्दी वाक्य में ‘देता’ प्रतिकल्पित परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπικρατίας
  choice: प्रभुत्व
  rationale: यह संज्ञा प्रबल होने, विजय पाने या सर्वोच्च अधिकार रखने का भाव देती है। संदर्भ में यह मनोवेगों के विवेक पर कथित प्रभुत्व की ओर संकेत करती है; यूनानी में ‘मेरे’ जैसा कोई स्पष्ट सर्वनाम नहीं है।
- source_word: μαρτυρίαν
  choice: गवाही
  rationale: यह चुनाव यूनानी शब्द के साक्ष्य या गवाही वाले अर्थ और उसके न्यायिक रंग को सुरक्षित रखता है।
theological_decisions:
- issue: विवेक और मनोवेगों के बीच नैतिक-दर्शन संबंध
  choice: मूल पाठ के ‘मनोवेग’ और ‘विवेक’ के स्पष्ट विरोध को बनाए रखा गया है।
  alternative: ‘यदि मेरी इच्छाएँ मेरी बेहतर समझ पर जीत गई होतीं’ जैसे अधिक व्याख्यात्मक शब्दों में कहना।
  rationale: व्याख्यात्मक विकल्प पाठ की दार्शनिक शब्दावली को हल्का कर देता और ‘मनोवेगों’ को केवल इच्छाओं तक सीमित कर सकता था।
- issue: τὴν τῆς ἐπικρατίας μαρτυρίαν का संबंध
  choice: ‘उनके प्रभुत्व की गवाही’—अर्थात मनोवेगों के प्रबल होने के पक्ष में गवाही।
  alternative: ‘अपने आत्मसंयम की गवाही’ अथवा ‘उन्हें प्रभुत्व का प्रमाण’।
  rationale: τούτοις निकटतम रूप से मनोवेगों को सूचित करता है, और ἐπικρατίας में प्रथम पुरुष स्वामित्व व्यक्त नहीं है। फिर भी ग्रीक संज्ञा-समूह संक्षिप्त है, इसलिए अधिक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मनोवेग’ और ‘विवेक’ दार्शनिक विरोध को बनाए रखते हैं, जबकि ‘हावी होना’ वाक्य को सहज हिन्दी बनाता है।
