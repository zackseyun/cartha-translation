translation:
  language: hi
  text: इसलिए, यह सर्वमान्य है कि भक्तिपूर्ण विवेक मनोवेगों का स्वामी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: यह सर्वमान्य है
  rationale: यह क्रियाविशेषण किसी बात के स्वीकृत या सर्वसम्मत निष्कर्ष होने का भाव देता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकाले गए निष्कर्ष को स्पष्ट करता है।
- source_word: δεσπότης
  choice: स्वामी
  rationale: यह नियंत्रण और अधिकार रखने वाले को सूचित करता है; यहाँ दार्शनिक संदर्भ में विवेक की शासक भूमिका व्यक्त होती है।
- source_word: τῶν παθῶν
  choice: मनोवेगों का
  rationale: इस ग्रंथ के नैतिक-दार्शनिक संदर्भ में πάθη उन प्रबल भावनाओं, इच्छाओं और आवेगों को सूचित करता है जिन पर विवेक शासन करता है; ‘मनोवेग’ हिन्दी में इस व्यापक अर्थ को संक्षेप में रखता है।
- source_word: ὁ εὐσεβὴς λογισμός
  choice: भक्तिपूर्ण विवेक
  rationale: λογισμός यहाँ विचार करने और नैतिक निर्णय लेने की शक्ति है, जबकि εὐσεβής परमेश्वर के प्रति श्रद्धा-भक्ति से उसके निर्देशित होने को बताता है।
theological_decisions:
- issue: εὐσεβής को दार्शनिक-धार्मिक पदबंध में व्यक्त करना
  choice: भक्तिपूर्ण
  alternative: ईश्वरपरायण; धर्मनिष्ठ
  rationale: ‘भक्तिपूर्ण’ यह स्पष्ट करता है कि विवेक स्वायत्त बुद्धि मात्र नहीं, बल्कि परमेश्वर के प्रति भक्ति से निर्देशित विवेक है; साथ ही यह किसी संप्रदाय-विशेष का अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘विवेक’ को यहाँ केवल अंतःकरण नहीं, बल्कि तर्कपूर्ण नैतिक निर्णय-शक्ति के अर्थ में लिया गया है।
