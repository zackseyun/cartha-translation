lexical_decisions:
- source_word: νυνὶ δέ
  choice: पर अब
  rationale: यह पद तर्क में हल्का विरोध और नया मोड़ दिखाता है; ‘पर अब’ दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λογισμοῦ
  choice: विवेक
  rationale: यहाँ शब्द नैतिक निर्णय करने वाली उस बुद्धि का सूचक है जो मनोविकारों को नियंत्रित करती है। ‘विवेक’ संक्षिप्त, स्वाभाविक और पुस्तक के दार्शनिक संदर्भ के अनुकूल है।
- source_word: τὰ πάθη
  choice: मनोविकारों
  rationale: इस संदर्भ में πάθη दुःख नहीं, बल्कि मनुष्य को विचलित करने वाले आवेगों और वासनात्मक भावों को दर्शाता है। ‘मनोविकार’ विवेक के साथ उसके नैतिक-दार्शनिक विरोध को व्यक्त करता है।
- source_word: νικήσαντος
  choice: ने ... विजय पा ली है
  rationale: यूनानी कृदंत पूर्ण हो चुकी विजय को दर्शाता है; हिन्दी में कारणसूचक उपवाक्य के भीतर यह रूप स्वाभाविक है।
- source_word: αὐτῷ
  choice: उसे
  rationale: सर्वनाम का संबंध ‘विवेक’ से है; हिन्दी में ‘उसे’ अमूर्त संज्ञा के लिए स्वाभाविक है और अनावश्यक व्यक्तिकरण नहीं करता।
- source_word: προσηκόντως
  choice: उचित रूप से
  rationale: यह औचित्य और उपयुक्तता का भाव व्यक्त करता है; ‘उचित रूप से’ मूल के मूल्यांकनात्मक बल को बनाए रखता है।
- source_word: τὴν τῆς ἡγεμονίας ... ἐξουσίαν
  choice: शासन का अधिकार
  rationale: यह पदबंध नेतृत्व या शासन करने की सत्ता और अधिकार दोनों को व्यक्त करता है। ‘शासन का अधिकार’ स्वाभाविक हिन्दी में दोनों तत्वों को संक्षेप में समेटता है।
- source_word: προσνέμομεν
  choice: हम ... देते हैं
  rationale: क्रिया किसी को उसका उचित भाग या अधिकार प्रदान करने का भाव रखती है; ‘देते हैं’ हिन्दी में सहज है, जबकि वाक्य का प्रसंग इसे औपचारिक अधिकार प्रदान करने के अर्थ में स्पष्ट करता है।
theological_decisions:
- issue: λογισμός और πάθη का मानव-स्वभाव संबंधी दार्शनिक निरूपण
  choice: λογισμός को ‘विवेक’ और πάθη को ‘मनोविकार’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘विवेकपूर्ण निर्णय’ तथा ‘भावनाएँ’, ‘आवेग’ या ‘दुःख’ कहा जा सकता है।
  rationale: पद 4 मकाबियों के केंद्रीय विचार को व्यक्त करता है कि अनुशासित नैतिक विवेक अविवेकी आवेगों पर शासन करता है। यह चयन उस तनाव को बनाए रखता है और बाद की किसी विशिष्ट धर्मवैज्ञानिक मानव-रचना को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘विवेक’ और ‘मनोविकार’ से मूल का दार्शनिक विरोध स्पष्ट होता है; ‘शासन का अधिकार’ पदबंध को अनावश्यक रूप से तकनीकी बनाए बिना ἡγεμονία और ἐξουσία दोनों का भाव देता है।
