lexical_decisions:
- source_word: Πείσθητι
  choice: मानो
  rationale: यह πείθω का अओरिस्ट निष्क्रिय आज्ञार्थक रूप है, जिसका शाब्दिक भाव ‘मान जाओ’ हो सकता है; पर राजकीय आज्ञाओं के संदर्भ में इसका स्वाभाविक अर्थ उनका पालन करना है। ‘मानो’ इस आग्रह और आज्ञापालन—दोनों भावों को संक्षेप में रखता है।
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: राजा की आज्ञाएँ
  rationale: ἐντολαί अधिकारपूर्ण आदेशों को दर्शाता है। ‘आज्ञाएँ’ राजकीय अधिकार का बल बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἑτέρωθεν
  choice: दूसरी ओर से
  rationale: क्रियाविशेषण का स्थानिक अर्थ ‘किसी दूसरी ओर/जगह से’ है। इसे मुख्य पाठ में बनाए रखने से यूनानी की वास्तविक अभिव्यक्ति सुरक्षित रहती है और केवल ‘एक और घोषक’ अर्थ निर्धारित नहीं किया जाता।
- source_word: κῆρυκος
  choice: एक घोषक
  rationale: κῆρυξ किसी आधिकारिक सार्वजनिक घोषणा करने वाले व्यक्ति को दर्शाता है। ‘घोषक’ इस भूमिका को ‘दूत’ की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: ἐπιβοῶντος
  choice: पुकार रहा था
  rationale: यह कृदन्त ऊँची आवाज़ में पुकारने या घोषणा करने को दर्शाता है। ‘पुकार रहा था’ प्रसंग की जारी पृष्ठभूमि और सार्वजनिक पुकार—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
