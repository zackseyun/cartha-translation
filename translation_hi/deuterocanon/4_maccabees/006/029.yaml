  yaml_path: translation/deuterocanon/4_maccabees/006/029.yaml
  text: Make my blood their purification[b][a], and take my life in exchange for theirs.
translation:
  language: hi
  text: मेरे लहू को उनके लिए शुद्धि बना दे[a], और उनके प्राणों के बदले मेरा प्राण ले ले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे लहू को उनके लिए शुद्धिकरण बना दे।” यूनानी शब्द καθαρσόν धार्मिक अथवा बलिदानी अर्थ में शुद्धि या शुद्धिकरण को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक भाव है, “उनके प्राणों के विनिमय में मेरा प्राण ले ले।” यह वाक्यांश एक जीवन के बदले दूसरे जीवन का भाव व्यक्त करता है। “उनकी फिरौती के रूप में” भी संभव है, पर वह अधिक व्याख्यात्मक अनुवाद होगा।
    reason: alternative_reading
lexical_decisions:
- source_word: καθαρσόν
  choice: शुद्धि
  rationale: यह शब्द यहाँ विधेय रूप में प्रयुक्त होकर धार्मिक अथवा बलिदानी संदर्भ में शुद्ध करने या शुद्धि प्रदान करने का भाव रखता है। ‘शुद्धि’ इस अर्थ को बनाए रखता है, पर इसे बाद की किसी विशिष्ट प्रायश्चित्त-संबंधी पारिभाषिक धारणा में सीमित नहीं करता।
- source_word: αἷμα
  choice: लहू
  rationale: मूल पाठ में स्पष्ट रूप से रक्त का उल्लेख है। ‘लहू’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा पद के बलिदानी स्वर को बनाए रखता है।
- source_word: ἀντίψυχον
  choice: प्राणों के बदले
  rationale: यह संयुक्त शब्द एक जीवन के स्थान पर दूसरे जीवन के दिए जाने का विनिमय अथवा प्रतिस्थापन व्यक्त करता है। ‘के बदले’ उस बल को स्पष्ट रखता है, बिना ‘फिरौती’ जैसे अधिक व्याख्यात्मक अर्थ को अनिवार्य बनाए।
- source_word: ψυχήν
  choice: प्राण
  rationale: शहादत के इस संदर्भ में ψυχή मुख्यतः समर्पित किए जा रहे जीवन को सूचित करता है, न कि केवल देह से पृथक आत्मा को। ‘प्राण’ हिन्दी में इस जीवन-अर्पण को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: λάβε
  choice: ले ले
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; परमेश्वर से की गई इस विनती में मूल का स्पष्ट आग्रह बनाए रखता है।
theological_decisions:
- issue: शहीद की प्रार्थना में बलिदानी शुद्धि और जीवन के प्रतिस्थापन की भाषा
  choice: शुद्धि और ‘प्राणों के बदले मेरा प्राण’ की स्पष्ट भाषा को बनाए रखना
  alternative: ‘मेरे लहू से उनका प्रायश्चित्त कर, और मेरा जीवन उनकी फिरौती के रूप में स्वीकार कर’
  rationale: यूनानी पाठ धार्मिक शुद्धि और एक जीवन के बदले दूसरे जीवन की स्पष्ट भाषा रखता है। चुना हुआ अनुवाद इस धर्मवैज्ञानिक तनाव को न तो कम करता है, न उसे बाद की अधिक विकसित पारिभाषिक धारणाओं—जैसे ‘प्रायश्चित्त’ या ‘फिरौती’—में निश्चित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। ‘लहू’ और ‘प्राण’ सामान्य पाठकों के लिए बोधगम्य रहते हुए बलिदानी संदर्भ का भार बनाए रखते हैं।
