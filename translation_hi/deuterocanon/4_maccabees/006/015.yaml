translation:
  language: hi
  text: हम पका हुआ भोजन तुम्हारे सामने रख देंगे; पर तुम सूअर का मांस चखने का बहाना करके अपनी जान बचा लो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच जाओ।” यहाँ आशय तत्काल मृत्यु से अपनी जान बचाने का है।
    reason: semantic_clarification
lexical_decisions:
- source_word: ἡψημένων
  choice: पका हुआ
  rationale: यह शब्द आग या गरमी से तैयार किए गए भोजन को दर्शाता है। यूनानी पाठ केवल भूनने की विधि निश्चित नहीं करता, इसलिए व्यापक और स्वाभाविक ‘पका हुआ’ चुना गया है।
- source_word: βρωμάτων
  choice: भोजन
  rationale: βρῶμα सामान्य रूप से खाने की वस्तु या भोजन है; इसे केवल ‘मांस’ तक सीमित करना आवश्यक नहीं।
- source_word: παραθήσομεν
  choice: तुम्हारे सामने रख देंगे
  rationale: भोजन के प्रसंग में παρατίθημι का अर्थ किसी के सामने भोजन रखना या परोसना है। यह अनुवाद क्रिया के ठोस भाव को बनाए रखता है।
- source_word: ὑποκρινόμενος
  choice: दिखावा करके
  rationale: कृदंत यहाँ झूठा आभास देने या ऐसा अभिनय करने का भाव व्यक्त करता है।
- source_word: τῶν ὑείων
  choice: सूअर का मांस
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ सूअर से बनी खाने की वस्तु, प्रसंगतः सूअर के मांस, को दर्शाता है। आधुनिक हिन्दी में ‘सूअर का मांस’ स्पष्ट और स्वाभाविक है।
- source_word: ἀπογεύσασθαι
  choice: चखने
  rationale: ἀπογεύομαι का सीधा अर्थ किसी वस्तु का स्वाद लेना या उसे थोड़ा चखना है।
- source_word: σώθητι
  choice: अपनी जान बचा लो
  rationale: इस प्रसंग में आदेश तत्काल शारीरिक मृत्यु से बच निकलने के लिए है। ‘अपनी जान बचा लो’ इस आशय को स्पष्ट करता है और अनावश्यक धार्मिक अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: यहूदी आहार-विधि के संदर्भ में τῶν ὑείων का अर्थ
  choice: सूअर का मांस
  alternative: सूअर से बनी वस्तुएँ
  rationale: दबाव निषिद्ध सूअर-मांस खाने का दिखावा करने पर है। ‘सूअर का मांस’ सामान्य पाठक के लिए निषेध का विषय सीधे व्यक्त करता है।
- issue: σώθητι का आशय
  choice: अपनी जान बचा लो
  alternative: बच जाओ
  rationale: यहाँ बात तत्काल प्राणरक्षा की है, न कि किसी विशिष्ट धर्मवैज्ञानिक उद्धार-अर्थ की।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और प्रत्यक्ष कथन। ‘पका हुआ भोजन’ यूनानी की व्यापक पाक-संबंधी अभिव्यक्ति को बनाए रखता है; ‘भुना हुआ’ कहकर तैयारी की विधि को अनावश्यक रूप से निश्चित नहीं किया गया।
