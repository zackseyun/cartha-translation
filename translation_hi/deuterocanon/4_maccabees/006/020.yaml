  text: For it would be shameful if we should live on for a little while, and that while being mocked by everyone for cowardice.
translation:
  language: hi
  text: क्योंकि यदि हम थोड़े समय और जीवित रहें और उस दौरान कायरता के कारण सबके उपहास का पात्र बने रहें, तो यह लज्जाजनक होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρόν
  choice: लज्जाजनक
  rationale: यह शब्द नैतिक अपमान और अनादर का भाव व्यक्त करता है; ‘लज्जाजनक’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἐπιβιώσομεν
  choice: हम ... और जीवित रहें
  rationale: संयुक्त क्रिया वर्तमान संकट के बाद भी जीवन जारी रहने का भाव देती है; ‘और जीवित रहें’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὀλίγον χρόνον
  choice: थोड़े समय
  rationale: यह अवधि-सूचक कर्मकारक का सहज हिन्दी रूप है और जीवन की अल्प अवधि पर दिए गए बल को बनाए रखता है।
- source_word: καταγελώμενοι
  choice: उपहास का पात्र बने रहें
  rationale: वर्तमानकालिक कर्मवाच्य कृदंत लगातार सार्वजनिक उपहास सहने का भाव देता है; यह हिन्दी प्रयोग उस निरंतरता और अपमान दोनों को व्यक्त करता है।
- source_word: πρὸς ἀπάντων
  choice: सबके
  rationale: यह उपहास करने वालों की सार्वभौमिकता को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐπὶ δειλίᾳ
  choice: कायरता के कारण
  rationale: यह उपहास का आधार या कारण बताता है; ‘कायरता’ शहादत के प्रसंग में δειλία की नैतिक तीव्रता को ठीक प्रकार व्यक्त करता है।
- source_word: καὶ τοῦτον
  choice: और उस दौरान
  rationale: पुल्लिंग सर्वनाम χρόνον की ओर संकेत करता है और उस थोड़े समय के दौरान होने वाले उपहास को जोड़ता है; यह रूप अनावश्यक अतिरिक्त बल जोड़े बिना सम्बन्ध स्पष्ट करता है।
