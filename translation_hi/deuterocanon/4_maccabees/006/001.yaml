  yaml_path: translation/deuterocanon/4_maccabees/006/001.yaml
  text: After he had spoken against the tyrant’s persuasions in this way[c][b][a], the bodyguards came forward and harshly dragged Eleazar to the tortures.
translation:
  language: hi
  text: एलिआज़र ने अत्याचारी के मनाने के प्रयासों[a] का इस प्रकार विरोध किया; तब अंगरक्षक[b] आगे आए और उसे बड़ी कठोरता से[c] यातना देने के लिए घसीट ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समझाने-बुझाने की बातें’; यूनानी शब्द प्रोत्साहन या आग्रह को भी व्यक्त कर सकता है, पर यहाँ अत्याचारी द्वारा एलिआज़र को अपनी बात मानने के लिए तैयार करने का प्रयास अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘भालाधारी’; यह शब्द राजा के सशस्त्र परिचारकों के लिए प्रयुक्त होता था।
    reason: lexical_alternative
  - marker: c
    text: या ‘क्रूरतापूर्वक’; यूनानी क्रियाविशेषण उनके व्यवहार की तीव्र कठोरता पर बल देता है।
    reason: lexical_alternative
