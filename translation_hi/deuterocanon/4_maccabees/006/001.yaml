- source_word: πικρῶς
  choice: बड़ी कठोरता से
  rationale: यहाँ क्रियाविशेषण उनके व्यवहार की तीव्र कठोरता और क्रूरता पर बल देता है; शाब्दिक ‘कटुता से’ हिन्दी में इस क्रिया के साथ अस्वाभाविक होता।
- source_word: ἔσυραν
  choice: घसीट ले गए
  rationale: यह साधारणतः ले जाने के बजाय बलपूर्वक खींचे जाने की हिंसा को सुरक्षित रखता है।
- source_word: ἐπὶ τὰ βασανιστήρια
  choice: यातना के साधनों तक
  rationale: बहुवचन संज्ञा यातना के उपकरणों, अथवा उनसे संबद्ध स्थान, की ओर संकेत कर सकती है। यह चयन ठोस बहुवचन अर्थ को बनाए रखता है और अनावश्यक रूप से ‘यातना-कक्ष’ निर्धारित नहीं करता।
- source_word: τὸν Ἐλεάζαρον
  choice: एलिआज़र
  rationale: व्यक्तिनाम को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
