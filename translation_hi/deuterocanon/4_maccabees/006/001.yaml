- source_word: δορυφόροι
  choice: अंगरक्षक
  rationale: शाब्दिक अर्थ ‘भालाधारी’ है, पर राजकीय प्रसंग में यह सशस्त्र परिचारकों अथवा अंगरक्षकों की पदवी है।
- source_word: παραστάντες
