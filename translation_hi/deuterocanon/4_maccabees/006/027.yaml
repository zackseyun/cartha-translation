  yaml_path: translation/deuterocanon/4_maccabees/006/027.yaml
  text: You know[a], O God, that though it is possible for me to be saved[b], I am dying in burning torments because of the law.
translation:
  language: hi
  text: हे परमेश्वर, तू जानता है कि मेरे लिए बच निकलना[a] संभव होते हुए भी, मैं व्यवस्था के कारण[b] जलाने वाली यातनाओं में मर रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बच जाना,’ ‘सुरक्षित रहना,’ अथवा ‘बचाया जाना’; यहाँ आशय यह है कि शारीरिक रूप से बचने का मार्ग वक्ता के लिए खुला है।
    reason: lexical_alternative
  - marker: b
    text: या ‘व्यवस्था के लिए’ अथवा ‘व्यवस्था की खातिर।’ संकेत उत्पीड़न के बीच मूसा की व्यवस्था के प्रति अटल निष्ठा की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ οἶσθα
  choice: तू जानता है
  rationale: बलाघाती सर्वनाम और जानने की सामान्य क्रिया को सीधी प्रार्थनात्मक सम्बोधन-शैली में रखा गया है।
- source_word: θεέ
  choice: हे परमेश्वर
  rationale: सम्बोधन कारक को हिन्दी की स्वाभाविक, गरिमापूर्ण प्रार्थनात्मक अभिव्यक्ति में प्रस्तुत करता है।
- source_word: παρὸν μοι
  choice: मेरे लिए ... सम्भव होते हुए भी
  rationale: यह वाक्यांश बताता है कि वक्ता के सामने बचने का मार्ग खुला है; कृदन्त की प्रसंगगत रियायती शक्ति को ‘होते हुए भी’ व्यक्त करता है।
- source_word: σῴζεσθαι
  choice: बच जाना
  rationale: सन्दर्भ में मुख्य अर्थ यातना और मृत्यु से शारीरिक रूप से बच निकलना है। ‘बच जाना’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से पारिभाषिक धार्मिक अर्थ नहीं थोपता।
- source_word: βασάνοις καυστικαῖς
  choice: जलानेवाली यातनाओं में
  rationale: βασάνοις यातनाओं को और καυστικαῖς उनके जलाने या झुलसानेवाले स्वरूप को दर्शाता है; ‘में’ परिस्थिति के भीतर मृत्यु को व्यक्त करता है।
- source_word: ἀποθνῄσκω
  choice: मर रहा हूँ
  rationale: यूनानी वर्तमान काल की तात्कालिक और जारी क्रिया को हिन्दी का अपूर्ण वर्तमान स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διὰ τὸν νόμον
  choice: व्यवस्था के कारण
  rationale: διά के कारणात्मक अर्थ और νόμος के यहूदी धार्मिक व्यवस्था-सन्दर्भ को निकटता से रखता है; निष्ठा का आशय प्रसंग से उभरता है, जोड़े गए शब्दों से नहीं।
theological_decisions:
- issue: शहादत के प्रसंग में σῴζεσθαι का अर्थ
  choice: मुख्यतः शारीरिक मृत्यु और यातना से बच जाना
  alternative: बचाया जाना; सुरक्षित निकल जाना; उद्धार पाना
  rationale: तात्कालिक विरोध उस उपलब्ध मार्ग और यातना में वास्तविक मृत्यु के बीच है। अनुवाद बाद के पारिभाषिक आध्यात्मिक उद्धार का अर्थ नहीं थोपता।
- issue: διὰ τὸν νόμον का भाव
  choice: व्यवस्था के कारण
  alternative: व्यवस्था के लिए; व्यवस्था की खातिर
  rationale: यूनानी कारण को सीधे व्यक्त करता है, जबकि प्रसंग इसे व्यवस्था के प्रति दृढ़ निष्ठा के कारण हुई शहादत के रूप में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रत्यक्ष प्रार्थना। ‘तू’ यहाँ परमेश्वर को निकट और एकवचन सम्बोधन है, अनादर सूचक नहीं। ‘व्यवस्था’ νόμος के मूसा की व्यवस्था-सन्दर्भ को बनाए रखता है। मुख्य पाठ में फुटनोट-चिह्न अर्थानुसार सही पदों—‘बच जाना’ [a] और ‘व्यवस्था के कारण’ [b]—पर लगाए गए हैं।
