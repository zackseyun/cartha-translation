lexical_decisions:
- source_word: ἱδρῶν … τὸ πρόσωπον
  choice: उसका चेहरा पसीने से तर था
  rationale: यूनानी वर्तमान कृदंत चल रही शारीरिक दशा बताता है। यह हिन्दी में स्वाभाविक ढंग से चेहरे पर आए प्रचुर पसीने को व्यक्त करता है।
- source_word: γέ τοι
  choice: निश्चय ही
  rationale: यह पद-समूह कथन पर बल देता है; ‘निश्चय ही’ उस बल को संक्षेप में बनाए रखता है।
- source_word: ἐπασθμαίνων σφοδρῶς
  choice: बुरी तरह हाँफ रहा था
  rationale: क्रिया कठिन, श्रमपूर्ण श्वास लेने को और क्रिया-विशेषण उसकी तीव्रता को व्यक्त करता है।
- source_word: ὑπʼ αὐτῶν τῶν βασανιζόντων
  choice: यहाँ तक कि उसे यातना देनेवाले स्वयं भी
  rationale: '‘स्वयं भी’ और ‘यहाँ तक कि’ मिलकर यूनानी की बलाघाती रचना को स्वाभाविक हिन्दी में व्यक्त करते हैं: उसके अपने यातना देनेवाले भी प्रभावित हुए।'
- source_word: ἐθαυμάζετο
  choice: चकित थे
  rationale: निष्क्रिय क्रिया उसके प्रति विस्मय और प्रशंसापूर्ण आश्चर्य व्यक्त करती है। ‘चकित थे’ उस विस्मय को रखता है, जबकि संदर्भ उसका सकारात्मक कारण स्पष्ट करता है।
- source_word: ἐπὶ τῇ εὐψυχίᾳ
  choice: उसके साहस पर
  rationale: εὐψυχία यातना के बीच साहस और मनोबल को दर्शाता है; ‘साहस’ सामान्य पाठक के लिए स्पष्ट और सटीक है।
