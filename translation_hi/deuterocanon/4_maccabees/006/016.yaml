  rationale: διά के करण/माध्यम संबंधी भाव को सहज हिन्दी में सलाह को यातना बढ़ाने वाले साधन के रूप में व्यक्त किया गया है। ‘उस’ निकटवर्ती प्रसंग में कही गई विशिष्ट सलाह को सूचित करता है।
- source_word: αἰκισθείς
  choice: यातना दी हो
  rationale: निष्क्रिय कृदंत αἰκισθείς दुर्व्यवहार या यातना दिए जाने को बताता है; शहादत के प्रसंग में ‘यातना’ इसकी गंभीरता को स्पष्ट रखता है।
- source_word: ἀνεβόησεν
  choice: पुकार उठा
  rationale: यह ऊँची आवाज़ में अचानक बोल उठने का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
