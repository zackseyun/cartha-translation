base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/007.yaml
  text: But if it were possible for us[a], as for a painter, to depict the godliness of your story, would not those who looked on shudder at a mother of seven children enduring varied tortures, because of godliness, all the way to death?
translation:
  language: hi
  text: पर यदि हमारे लिए किसी चित्रकार की तरह तुम्हारी कथा में प्रकट ईश्वर-भक्ति[a] को चित्रित करना संभव होता, तो क्या देखनेवाले सात बच्चों की एक माँ को ईश्वर-भक्ति के कारण अनेक प्रकार की यातनाएँ मृत्यु तक सहती हुई देखकर न सिहर उठते?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, दोनों स्थानों पर “धर्मनिष्ठा”।
    reason: εὐσέβεια के अर्थक्षेत्र में ईश्वर-भक्ति, धार्मिक निष्ठा और धर्मपरायणता सम्मिलित हैं; विकल्प वास्तविक शब्दार्थगत विस्तार को दर्शाता है।
lexical_decisions:
- source_word: Εἰ δὲ ἔξον ἡμῖν ἦν
  choice: पर यदि हमारे लिए ... संभव होता
  rationale: ἔξον ἦν की काल्पनिक संभावना अथवा अनुमति को स्वाभाविक हिन्दी में व्यक्त करता है और शर्तवाचक बल बनाए रखता है।
- source_word: ὥσπερ τινός, ζωγραφῆσαι
  choice: किसी चित्रकार की तरह ... चित्रित करना
  rationale: वाक्यांश संक्षिप्त और कुछ हद तक दीर्घवृत्तीय है; ζωγραφέω के दृश्य रूपक को बनाए रखते हुए τινός में निहित किसी चित्र बनानेवाले व्यक्ति को स्पष्ट करता है।
- source_word: τὴν τῆς ἱστορίας σου εὐσέβειαν
  choice: तुम्हारी कथा में प्रकट ईश्वर-भक्ति
  rationale: ἱστορία को आधुनिक तकनीकी ‘इतिहास’ के बजाय कथा/वृत्तांत के अर्थ में लिया गया है। सम्बन्धकारक रचना को सहज हिन्दी में खोला गया है, जबकि εὐσέβεια का ईश्वर की ओर उन्मुख भाव सुरक्षित है।
- source_word: οὐκ ἂν ἔφριττον οἱ θεωροῦντες
  choice: तो क्या देखनेवाले ... न सिहर उठते
  rationale: मूल के आलंकारिक प्रश्न और φρίσσω की तीव्र शारीरिक-भावात्मक प्रतिक्रिया, दोनों को बनाए रखता है।
- source_word: μητέρα ἑπτὰ τέκνων
  choice: सात बच्चों की एक माँ
  rationale: τέκνα सामान्यतः ‘बच्चे’ है; निकटवर्ती कथा के आधार पर इसे अनावश्यक रूप से ‘पुत्र’ नहीं बनाया गया।
- source_word: ποικίλας βασάνους
  choice: अनेक प्रकार की यातनाएँ
  rationale: ποικίλος में प्रकारों की विविधता और βάσανος में यातना का कठोर अर्थ, दोनों स्पष्ट होते हैं।
- source_word: διʼ εὐσέβειαν
  choice: ईश्वर-भक्ति के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा प्रेरणा बताता है; εὐσέβεια के लिए वही शब्द दोहराकर लेखक का विषयगत जोर सुरक्षित रखा गया है।
- source_word: μέχρι θανάτου ὑπομενούσαν
  choice: यातनाएँ मृत्यु तक सहती रही
  rationale: ὑπομένω के धैर्यपूर्वक सहने और μέχρι θανάτου की अंतिम सीमा—मृत्यु—दोनों को सीधी, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: ईश्वर-भक्ति
  alternative: धर्मनिष्ठा; भक्ति
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा को सूचित करता है। ‘ईश्वर-भक्ति’ उस ईश्वराभिमुखता को स्पष्ट रखता है, पर किसी विशिष्ट सम्प्रदाय की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण और वाचनयोग्य शैली। चित्रकारी के रूपक, आलंकारिक प्रश्न, यातनाओं की विविधता और ‘मृत्यु तक’ की सीमा को सुरक्षित रखा गया है। सर्वनाम ‘तुम्हारी’ मूल के एकवचन सम्बोधन को दर्शाता है।
