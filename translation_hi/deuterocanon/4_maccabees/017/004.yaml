  verdict: revise
  source_fidelity: The draft conveys the inferential exhortation, direct address, holy-inner-character compound, endurance-hope, courage, and orientation toward God. However, ‘थामे रह’ intensifies ἔχουσα (‘having/holding’) by adding an explicit continuative ‘keep holding,’ and ‘परमेश्वर की ओर लगी’ is less natural Hindi than an adjectival expression of the hope’s Godward orientation.
  naturalness: ‘साहस रख’ is understandable but the non-honorific singular is stylistically jarring with the dignified vocative ‘हे ... माता.’ ‘साहस रखो’ is natural modern Hindi. Reordering the participial phrase before the main imperative makes the syntax clear without turning the Greek participle into a second imperative.
  terminology: ‘पवित्र अंतःकरणवाली’ is a defensible idiomatic rendering of ἱερόψυχε and avoids implying the technical expression ‘पवित्र आत्मा.’ ‘धीरज,’ ‘आशा,’ and ‘परमेश्वर’ suit the register. ‘वीरतापूर्वक’ adequately represents γενναίως without merely repeating ‘साहस.’
  issues:
  - severity: medium
    issue: ‘थामे रह’ overstates ἔχουσα.
    rationale: The Greek participle means ‘having’ or ‘holding’; it does not explicitly contain the perseverative force of ‘रह.’ A more neutral participial expression preserves the source wording.
  - severity: medium
    issue: The phrase ‘परमेश्वर की ओर लगी धीरज की आशा’ is awkward and can obscure what is oriented toward God.
    rationale: πρὸς θεόν qualifies the hope’s orientation. ‘परमेश्वर की ओर उन्मुख ... आशा’ expresses this relation clearly while retaining its directional openness.
  - severity: low
    issue: Register mismatch in ‘साहस रख.’
    rationale: The Greek is singular, but respectful singular ‘रखो’ is the normal Hindi form when addressing a mother in this elevated context.
