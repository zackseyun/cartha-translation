  yaml_path: translation/deuterocanon/4_maccabees/017/004.yaml
  text: Therefore take courage[a], O mother of a holy soul, holding fast the hope of endurance with noble courage toward God.
translation:
  language: hi
  text: इसलिए, हे पवित्र अंतःकरणवाली[a] माता, परमेश्वर की ओर उन्मुख धीरज की आशा को वीरतापूर्वक धारण किए हुए साहस रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ एक संयुक्त विशेषण है, जिसका अधिक शाब्दिक अनुवाद ‘पवित्र-आत्मावाली’ या ‘पवित्र-प्राणवाली’ हो सकता है। यहाँ इसका अर्थ माता के पवित्र भीतरी व्यक्तित्व या चरित्र से है, न कि किसी विशिष्ट धर्मवैज्ञानिक पद से।
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρρει
  choice: साहस रख
  rationale: यह θαρρέω का आज्ञार्थक रूप है और साहस बनाए रखने का आह्वान करता है। ‘साहस रख’ आधुनिक, स्वाभाविक और exhortatory बल वाला हिंदी प्रयोग है।
- source_word: τοιγαροῦν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्ष निकालने वाला अव्यय है; ‘इसलिए’ उसके अनुमानात्मक संबंध को स्पष्ट रखता है।
- source_word: μῆτηρ
  choice: माता
  rationale: स्त्री को सीधे संबोधित किया गया है। ‘माता’ गरिमापूर्ण और सामान्य आधुनिक हिंदी है।
- source_word: ἱερόψυχε
  choice: पवित्र अंतःकरणवाली
  rationale: यह ἱερός (‘पवित्र’) और ψυχή (‘प्राण/आत्मा/भीतरी व्यक्तित्व’) से बना संबोधन है। ‘अंतःकरण’ यहाँ पवित्र भीतरी चरित्र को स्वाभाविक हिंदी में व्यक्त करता है और ‘पवित्र आत्मा’ नामक विशिष्ट धर्मवैज्ञानिक पद से अनचाहा भ्रम टालता है। शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐλπίδα
  choice: आशा
  rationale: यह शब्द का सामान्य और प्रसंगानुकूल अर्थ है।
- source_word: ὑπομονῆς
  choice: धीरज की
  rationale: शहीदी के प्रसंग में ὑπομονή दृढ़तापूर्वक सहते रहने को बताता है। ‘धीरज’ सरल है, जबकि संबंधकारक की संक्षिप्तता और संभावित अर्थगत खुलापन भी बनाए रखता है।
- source_word: γενναίως
  choice: वीरतापूर्वक
  rationale: γενναίως में बहादुरी के साथ उदात्तता का भाव भी हो सकता है। ‘वीरतापूर्वक’ θάρρει के ‘साहस रख’ को केवल दोहराए बिना उसके नैतिक साहस को व्यक्त करता है।
- source_word: ἔχουσα
  choice: थामे रह
  rationale: मूल participle आशा को रखे होने की रीति बताता है। हिंदी में ‘थामे रह’ उस निरंतरता को स्वाभाविक रूप से व्यक्त करता है, यद्यपि मूल क्रिया का मूल अर्थ केवल ‘रखना/धारण करना’ भी हो सकता है।
- source_word: πρὸς θεόν
  choice: परमेश्वर की ओर लगी
  rationale: πρός के दिशात्मक या उन्मुखता वाले अर्थ को सुरक्षित रखा गया है। इसे ‘परमेश्वर पर’ नहीं बनाया गया, ताकि मूल में स्पष्ट न किया गया संबंध चुपचाप निश्चित न हो जाए।
theological_decisions:
- issue: ἱερόψυχε में पवित्रता और भीतरी व्यक्तित्व का संबंध
  choice: पवित्र अंतःकरणवाली
  alternative: पवित्र आत्मावाली
  rationale: चुना हुआ रूप धार्मिक पवित्रता को बनाए रखते हुए माता के भीतरी चरित्र की प्रशंसा करता है। ‘पवित्र आत्मावाली’ अधिक शाब्दिक हो सकता है, पर हिंदी में वह ‘पवित्र आत्मा’ संबंधी विशिष्ट धर्मवैज्ञानिक अर्थ का भ्रम उत्पन्न कर सकता है।
- issue: πρὸς θεόν द्वारा आशा की दिशा
  choice: परमेश्वर की ओर लगी धीरज की आशा
  alternative: परमेश्वर पर धीरज की आशा
  rationale: मूल यूनानी दिशा या उन्मुखता व्यक्त करता है। ‘परमेश्वर पर’ हिंदी में विश्वास का अधिक निश्चित संबंध जोड़ देता; इसलिए अधिक खुला दिशात्मक रूप रखा गया है।
