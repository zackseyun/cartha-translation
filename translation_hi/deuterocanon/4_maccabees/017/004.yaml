  to: इसलिए, हे पवित्र अंतःकरणवाली[a] माता, परमेश्वर की ओर उन्मुख धीरज की आशा को वीरतापूर्वक धारण किए हुए साहस रखो।
  rationale: Revision retains the compact Greek vocative and the Godward orientation of the hope, while replacing an added perseverative nuance with ‘धारण किए हुए,’ improving the attachment of ‘परमेश्वर की ओर,’ and using respectful modern Hindi address. The footnote preserves the lexical alternatives for ψυχή while preventing a misleading technical reading of ‘पवित्र आत्मा.’
