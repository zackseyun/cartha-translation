  register: आधुनिक मानक हिंदी में गरिमापूर्ण प्रत्यक्ष संबोधन रखा गया है। ‘माता’, ‘साहस रख’ और ‘वीरतापूर्वक थामे रह’ सामान्य पाठक के लिए बोधगम्य हैं। वाक्य की काव्यात्मक गंभीरता बचाने के लिए ‘परमेश्वर की ओर लगी धीरज की आशा’ रखा गया है, और यूनानी संयुक्त विशेषण की कठिनाई पादटिप्पणी में स्पष्ट की गई है।
