  text: and that the tyrant should be punished and the homeland should be purified[a].
translation:
  language: hi
  text: और अत्याचारी को दण्ड दिया जाए और मातृभूमि को शुद्ध किया जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्मल किया जाए।” यूनानी शब्द धार्मिक, नैतिक या राष्ट्रीय अशुद्धि से शुद्ध किए जाने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τύραννον
  choice: अत्याचारी
  rationale: यह शब्द यहाँ केवल शासक नहीं, बल्कि दमनकारी और निरंकुश शासक के लिए निन्दात्मक रूप से प्रयुक्त है; ‘अत्याचारी’ उस नैतिक तीखेपन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τιμωρηθῆναι
  choice: दण्ड दिया जाए
  rationale: यह अओरिस्ट कर्मवाच्य क्रियारूप अत्याचारी के दण्ड पाने को व्यक्त करता है। यह अनुवाद न्यायिक और प्रतिफलात्मक भाव रखता है, पर बदला लेने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: πατρίδα
  choice: मातृभूमि
  rationale: यह शब्द अपनी पैतृक या जन्मभूमि को सूचित करता है। ‘मातृभूमि’ आधुनिक हिन्दी में स्वाभाविक है और देश के साथ आत्मीय तथा राष्ट्रीय सम्बन्ध को बनाए रखता है।
- source_word: καθαρισθῆναι
  choice: शुद्ध किया जाए
  rationale: यह क्रिया अशुद्धि से शुद्ध किए जाने को दर्शा सकती है और यहाँ धार्मिक, नैतिक तथा राष्ट्रीय पुनर्स्थापना के संकेतों को खुला रखती है।
theological_decisions:
- issue: मातृभूमि के शुद्ध किए जाने का आशय
  choice: ‘मातृभूमि को शुद्ध किया जाए’—धार्मिक, नैतिक और राष्ट्रीय, सभी सम्भावित आयामों को खुला रखता है।
  alternative: मातृभूमि को कलंक से मुक्त किया जाए
  rationale: सन्दर्भ में शहीदों की मृत्यु और प्रायश्चित-सदृश विषयों के कारण यूनानी अभिव्यक्ति केवल राजनीतिक मुक्ति से व्यापक हो सकती है। इसलिए अनुवाद उसके अर्थ को किसी एक प्रकार की अशुद्धि तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। दोनों कर्मवाच्य क्रियाओं की समानान्तर रचना मूल यूनानी के समन्वय को बनाए रखती है; आरम्भिक ‘और’ यह संकेत देता है कि पद पिछले वाक्य की विचार-श्रृंखला को आगे बढ़ाता है।
