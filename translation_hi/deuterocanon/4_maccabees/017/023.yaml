  yaml_path: translation/deuterocanon/4_maccabees/017/023.yaml
  text: For when the tyrant Antiochus saw their courage and virtue and their endurance in tortures[a], he proclaimed their endurance as an example to his soldiers.
translation:
  language: hi
  text: क्योंकि जब अत्याचारी अन्तियोकस ने उनकी वीरता[a], सद्गुण और यातनाओं में उनके धीरज को देखा, तो उसने अपने सैनिकों के लिए उनके धीरज को एक आदर्श के रूप में घोषित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक भाव ‘पुरुषोचित साहस’ या ‘पुरुषोचित दृढ़ता’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνδρίαν
  choice: वीरता
  rationale: यह शब्द पुरुषोचित साहस और दृढ़ता का बोध कराता है। मुख्य पाठ में ‘वीरता’ स्वाभाविक और गरिमापूर्ण हिन्दी है; यूनानी शब्द की स्पष्ट पुरुष-संबंधी छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀρετὴν
  choice: सद्गुण
  rationale: यहाँ नैतिक उत्कृष्टता या श्रेष्ठ चरित्र अभिप्रेत है; ‘सद्गुण’ इस नैतिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: βασάνοις
  choice: यातनाओं
  rationale: शहीदी के इस प्रसंग में शब्द सामान्य परीक्षाओं के बजाय दी गई शारीरिक यातनाओं को सूचित करता है।
- source_word: ὑπομονὴν
  choice: धीरज
  rationale: यह पीड़ा के अधीन अटल सहनशीलता को दर्शाता है। दोनों बार एक ही शब्द रखकर यूनानी पुनरुक्ति सुरक्षित रखी गई है।
- source_word: ἀφιδὼν
  choice: देखा
  rationale: कृदन्त का अर्थ देखने या ध्यान से अवलोकन करने का है; ‘जब ... देखा’ हिन्दी में स्वाभाविक कालवाचक वाक्य बनाता है।
- source_word: ἀνεκήρυξεν
  choice: घोषित किया
  rationale: क्रिया में सार्वजनिक रूप से घोषित करने का भाव है, जिसे ‘घोषित किया’ औपचारिक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: ὑπόδειγμα
  choice: एक आदर्श
  rationale: शब्द दूसरों के सामने रखे गए उदाहरण या अनुकरणीय नमूने को दर्शाता है; सैनिकों के प्रसंग में ‘आदर्श’ स्वाभाविक है।
- source_word: στρατιώτας
  choice: सैनिकों
  rationale: यह अन्तियोकुस के अधीन सैन्यकर्मियों का सीधा उल्लेख है।
theological_decisions:
- issue: ἀνδρία का लिंग-सूचक नैतिक अर्थ
  choice: मुख्य पाठ में ‘वीरता’, और पादटिप्पणी में ‘पुरुषोचित साहस/दृढ़ता’
  alternative: पुरुषार्थ; मर्दानगी; साहस
  rationale: ‘मर्दानगी’ आधुनिक हिन्दी में शारीरिक या सांस्कृतिक पुरुषत्व का अनपेक्षित अर्थ ला सकती है, जबकि ‘पुरुषार्थ’ के भारतीय दार्शनिक अर्थ भी हैं। ‘वीरता’ पठनीय रहते हुए मूल गुण को व्यक्त करती है और पादटिप्पणी यूनानी की पुरुष-संबंधी छाया को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण शैली। यूनानी वाक्य की तीन प्रशंसित विशेषताओं और ὑπομονή की पुनरावृत्ति को बनाए रखा गया है। ‘अत्याचारी’ पद τύραννος के नकारात्मक राजनीतिक और नैतिक भाव को व्यक्त करता है।
