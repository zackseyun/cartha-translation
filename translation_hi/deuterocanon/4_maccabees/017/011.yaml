  text: For truly the contest that came about through them was divine[a].
translation:
  language: hi
  text: क्योंकि वास्तव में उनके माध्यम से घटित हुआ संघर्ष दिव्य था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके द्वारा संपन्न किया गया दिव्य संघर्ष।” यूनानी वाक्यांश इस बात पर बल दे सकता है कि संघर्ष उनके माध्यम से घटित हुआ, अथवा कि वह उनके द्वारा संपन्न हुआ।
    reason: διʼ αὐτῶν γεγενημένος में माध्यमगत अर्थ और अधिक कर्तृत्वपूर्ण वैकल्पिक समझ—दोनों की संभावना को सुरक्षित रखना।
lexical_decisions:
- source_word: Ἀληθῶς
  choice: सचमुच
  rationale: यह क्रियाविशेषण कथन की सत्यता पर बल देता है; ‘सचमुच’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका गंभीर आलंकारिक बल बनाए रखता है।
- source_word: ἀγών
  choice: संघर्ष
  rationale: यहाँ शहीदों की धीरजपूर्ण परीक्षा और सार्वजनिक मुकाबले का भाव है। हिन्दी में ‘संघर्ष’ इस व्यापक आशय को स्वाभाविक रूप से व्यक्त करता है; ‘प्रतियोगिता’ प्रसंग में अनावश्यक रूप से खेल-कूद जैसा सुनाई दे सकती है।
- source_word: θεῖος
  choice: दिव्य
  rationale: विशेषण संघर्ष के ईश्वरीय स्वरूप अथवा गुण को बताता है। ‘दिव्य’ इसका सीधा और गरिमापूर्ण हिन्दी रूप है, जो इसे केवल ‘परमेश्वर की ओर से’ कहकर अर्थ को संकुचित नहीं करता।
- source_word: ὁ διʼ αὐτῶν γεγενημένος
  choice: उनके द्वारा हुआ
  rationale: διά के साथ संबंधकारक माध्यम अथवा कर्तृत्व का संकेत देता है, और γεγενημένος घटित होकर अस्तित्व में आए संघर्ष को व्यक्त करता है। ‘उनके द्वारा हुआ’ शहीदों की माध्यमगत भूमिका को रखते हुए उन्हें उसके दिव्य स्वरूप का अंतिम स्रोत नहीं बनाता।
theological_decisions:
- issue: διʼ αὐτῶν में शहीदों की भूमिका को कैसे समझा जाए
  choice: संघर्ष ‘उनके द्वारा हुआ’, अर्थात उनके माध्यम से घटित हुआ।
  alternative: ‘उनके द्वारा पूरा किया गया दिव्य संघर्ष’ अथवा ‘उनके जीवन में घटित संघर्ष’।
  rationale: διά + संबंधकारक सामान्यतः माध्यम या कर्तृत्व दर्शाता है। चुना हुआ अनुवाद इस तनाव को बनाए रखता है कि संघर्ष दिव्य है, फिर भी वह इन विश्वासयोग्य जनों के माध्यम से घटित हुआ; वह न तो उनके प्रत्यक्ष कर्तृत्व को जरूरत से अधिक बढ़ाता है, न उनकी भूमिका मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘संघर्ष’ ἀγών के शहादत-संदर्भित मुकाबले को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी यूनानी वाक्यांश की वैकल्पिक व्याख्या सुरक्षित रखती है।
