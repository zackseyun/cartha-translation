  yaml_path: translation/deuterocanon/4_maccabees/017/002.yaml
  text: O mother[a], who with your seven children brought down the tyrant’s violence, and nullified his evil schemes, and displayed the nobility of faith.
translation:
  language: hi
  text: हे माँ, तुमने अपने सात बच्चों के साथ मिलकर तानाशाह की हिंसा को परास्त कर दिया, उसकी दुष्ट योजनाओं को निष्फल कर दिया, और विश्वास की उदात्तता[a] प्रकट की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वास का साहस’ अथवा ‘निष्ठा की उदात्त दृढ़ता’; यूनानी वाक्यांश विश्वास से प्रकट होने वाली उदात्तता या विश्वासपूर्ण भक्ति की साहसी दृढ़ता—दोनों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μήτηρ
  choice: हे माँ
  rationale: प्रत्यक्ष संबोधन और प्रशंसात्मक, ऊँचे आलंकारिक स्वर को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: σὺν ἑπτὰ παισίν
  choice: अपने सात बच्चों के साथ मिलकर
  rationale: παῖς का मूल अर्थ ‘बच्चा’ या संदर्भानुसार ‘पुत्र’ हो सकता है। यहाँ उसके पुत्र अभिप्रेत हैं, पर ‘बच्चों’ से यूनानी पद की व्यापकता बनी रहती है; ‘अपने’ मातृ-संबोधन से स्वाभाविक रूप से स्पष्ट है।
- source_word: καταλύσασα
  choice: परास्त कर दिया
  rationale: क्रिया किसी शक्ति को गिरा देने, नष्ट करने या विफल कर देने का भाव रखती है। तानाशाह की हिंसक शक्ति के विरुद्ध ‘परास्त’ स्वाभाविक और सशक्त है।
- source_word: τὴν τοῦ τυράννου βίαν
  choice: तानाशाह की हिंसा
  rationale: βία बल, जबरदस्ती या हिंसा को दर्शाता है; उत्पीड़न के इस संदर्भ में ‘हिंसा’ सबसे सीधा विकल्प है।
- source_word: ἀκυρώσασα
  choice: निष्फल कर दिया
  rationale: इसका अर्थ किसी बात को अप्रभावी या निष्प्रभाव कर देना है; ‘निष्फल’ योजनाओं के संदर्भ में सहज हिन्दी है।
- source_word: τὰς κακὰς ἐπινοίας αὐτοῦ
  choice: उसकी दुष्ट योजनाओं
  rationale: ἐπινοία योजना, युक्ति या षड्यंत्रकारी सोच को सूचित करता है; ‘दुष्ट योजनाएँ’ अर्थ को स्पष्ट रखती हैं और अनावश्यक विस्तार नहीं करतीं।
- source_word: ἐπιδείξασα
  choice: प्रकट की
  rationale: क्रिया सार्वजनिक रूप से दिखाने या प्रमाणित करने का भाव देती है; ‘प्रकट की’ प्रशंसात्मक संदर्भ में स्वाभाविक है।
- source_word: τὴν τῆς πίστεως γενναιότητα
  choice: विश्वास की उदात्तता
  rationale: γενναιότης में उदात्तता, कुलीन नैतिक महानता और साहस—इन सबका भाव हो सकता है। ‘उदात्तता’ मुख्य पाठ में इस व्यापक नैतिक उत्कृष्टता को बनाए रखती है, जबकि टिप्पणी साहस और निष्ठा के संभावित बल को बताती है।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: निष्ठा
  rationale: यहाँ धार्मिक उत्पीड़न के बीच अडिग समर्पण का संदर्भ है। ‘विश्वास’ मूल पद का सामान्य और स्वाभाविक अनुवाद है, किंतु ‘निष्ठा’ का भाव भी संदर्भ में संभव है।
- issue: γενναιότης के नैतिक भाव का अनुवाद
  choice: उदात्तता
  alternative: साहस
  rationale: यूनानी पद नैतिक श्रेष्ठता और साहसी दृढ़ता दोनों व्यक्त कर सकता है। मुख्य पाठ में किसी एक भाव को अत्यधिक संकीर्ण न करते हुए ‘उदात्तता’ रखा गया है।
