  register: भाषा आधुनिक, गरिमापूर्ण और प्रशंसात्मक है। ‘हे माँ’ मूल के भावपूर्ण संबोधन को बनाए रखता है। तीनों स्त्रीलिंग कृदंतों को क्रमबद्ध पूर्ण क्रियाओं में व्यक्त किया गया है ताकि हिन्दी वाक्य स्वाभाविक रहे।
