review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the contest imagery, personified virtue, incorruptibility, and life of long duration. However, the Greek form δοκιμάζουσι is morphologically active (dative plural), not a passive form meaning simply “being tested.” The Hindi “परखे जा रहे लोगों” therefore does not reflect the wording as printed. Rendering it as people who prove themselves/come through the test by endurance best preserves the likely contextual force without treating the passive sense as grammatical.
  naturalness: The present Hindi is generally clear and dignified. “दीर्घकालीन जीवन” is understandable but somewhat bureaucratic; “दीर्घ जीवन” is more idiomatic and retains the source’s deliberately nontechnical expression.
  terminology: “सद्गुण,” “अविनश्वरता,” and “विजय” are suitable. “प्रतियोगिता का अध्यक्ष था” more precisely conveys the athletic official/presiding role of ἀθλοθέτει than the broader “प्रतियोगिता का संचालन कर रहा था.”
  issues:
  - severity: medium
    issue: 'δοκιμάζουσι has been rendered as passive: “परखे जा रहे लोगों.”'
    rationale: The printed Greek is active in form. In this context it can naturally be rendered as those who prove themselves or come through the test by endurance. A passive translation follows the English audit trail but lacks direct grammatical support from the supplied Greek.
  - severity: low
    issue: “दीर्घकालीन जीवन” is stylistically stiff.
    rationale: “दीर्घ जीवन” is natural modern Hindi and conveys ζωῇ πολυχρονίῳ without importing the stronger term “अनन्त जीवन.”
  revised_text: क्योंकि उस समय सद्गुण धीरज के द्वारा परीक्षा में खरे उतरने वालों के लिए प्रतियोगिता का अध्यक्ष था; विजय अविनश्वरता में[a], दीर्घ जीवन में थी।
  revised_footnotes:
  - marker: a
    text: या, “अनन्त जीवन में।” यूनानी में शाब्दिक रूप से “दीर्घ जीवन में” है; साथ का वाक्यांश “अविनश्वरता में” इस वाक्यांश को अनन्त जीवन के अर्थ में समझे जाने का संकेत दे सकता है।
    reason: alternative_reading
  revision_rationale: The revision corrects the active force of δοκιμάζουσι as printed, while retaining the contextual connection with endurance and avoiding a speculative object for the participle. It also refines the contest-official metaphor and uses more idiomatic Hindi for the long-duration life phrase. The footnote anchor remains attached to “अविनश्वरता,” as in the supplied audit trail.
