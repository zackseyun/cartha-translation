  yaml_path: translation/deuterocanon/4_maccabees/017/012.yaml
  text: For virtue was then presiding over the contest for those being tested through endurance; the victory was in incorruptibility[a], in long-lasting life.
translation:
  language: hi
  text: क्योंकि उस समय सद्गुण धीरज के द्वारा परखे जा रहे लोगों की प्रतियोगिता का संचालन कर रहा था; विजय अविनश्वरता में[a], दीर्घकालीन जीवन में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनन्त जीवन में।” यूनानी का शाब्दिक अर्थ “दीर्घ अवधि वाले जीवन में” है; साथ आया “अविनश्वरता में” इस वाक्यांश को अनन्त जीवन के अर्थ में समझे जाने का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀθλοθέτει
  choice: प्रतियोगिता का संचालन कर रहा था
  rationale: यह दुर्लभ क्रिया प्राचीन खेल-प्रतियोगिता के अध्यक्ष या निर्णायक द्वारा प्रतियोगिता आयोजित और संचालित करने की छवि रखती है। यह अनुवाद उस रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀρετή
  choice: सद्गुण
  rationale: यहाँ ἀρετή नैतिक उत्कृष्टता का मानवीकरण है; ‘सद्गुण’ आधुनिक हिन्दी में इसका संक्षिप्त और स्थापित समतुल्य है।
- source_word: διʼ ὑπομονῆς
  choice: धीरज के द्वारा
  rationale: ὑπομονή परीक्षा के बीच दृढ़तापूर्वक टिके रहने को दर्शाता है, और ‘के द्वारा’ διά के साधनात्मक अर्थ को बनाए रखता है।
- source_word: δοκιμάζουσι
  choice: परखे जा रहे लोगों
  rationale: संदर्भ में यह उन शहीदों की ओर संकेत करता है जो यातना के अधीन परीक्षा से गुजर रहे हैं; हिन्दी का कर्मवाच्य इस अर्थ को स्पष्ट रखता है।
- source_word: τὸ νῖκος
  choice: विजय
  rationale: यह सीधा समतुल्य है और पहले खंड की प्रतियोगिता-संबंधी छवि को आगे बढ़ाता है।
- source_word: ἐν ἀφθαρσίᾳ
  choice: अविनश्वरता में
  rationale: ἀφθαρσία नाश या क्षय से परे होने की अवस्था बताता है। ‘अविनश्वरता’ हिन्दी में अर्थपूर्ण है और केवल ‘अमरता’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐν ζωῇ πολυχρονίῳ
  choice: दीर्घकालीन जीवन में
  rationale: πολυχρόνιος का शाब्दिक अर्थ दीर्घ अवधि तक रहने वाला है। ‘दीर्घकालीन जीवन’ स्रोत की अभिव्यक्ति को सुरक्षित रखता है और मुख्य पाठ में ‘अनन्त जीवन’ का अधिक निश्चित धर्मवैज्ञानिक अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: क्या ζωῇ πολυχρονίῳ का अनुवाद ‘अनन्त जीवन’ किया जाए
  choice: दीर्घकालीन जीवन
  alternative: अनन्त जीवन
  rationale: यूनानी वाक्यांश सीधे तौर पर दीर्घ अवधि वाले जीवन की बात करता है, न कि ‘अनन्त’ के सामान्य शब्द का प्रयोग करता है। फिर भी साथ आया ‘अविनश्वरता’ और शहीदों के प्रतिफल का प्रसंग अनन्त जीवन की ओर संकेत कर सकता है, इसलिए वह संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रतियोगिता का रूपक सुरक्षित है; ‘सद्गुण’ का पुल्लिंग प्रयोग उसके मानवीकरण और हिन्दी संज्ञा के व्याकरणिक लिंग के अनुरूप है।
