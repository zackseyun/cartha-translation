  verdict: revise
  source_fidelity: Draft preserves the architectural imagery and the enduring of a metaphorical earthquake, but it misplaces γενναίως by attaching ‘with courage’ to the roof’s being established rather than to the mother’s endurance. ‘बच्चों के स्तंभ’ is also syntactically ambiguous in Hindi and can imply a pillar belonging to the children rather than a pillar constituted by or associated with them.
  naturalness: The present line is understandable but heavily compressed. Reordering the modifiers makes the metaphor and the action more idiomatic while retaining the verse’s unfinished, continuing syntax.
  terminology: ‘छत,’ ‘स्तंभ,’ ‘यातनाएँ,’ and ‘भूकंप’ are appropriate, concrete equivalents. ‘अपने बच्चों’ is warranted by the immediate referent, while the footnote preserves the lexical alternative ‘पुत्रों.’
  issues:
  - severity: medium
    issue: ‘साहस के साथ’ modifies ‘दृढ़ता से टिकी हुई’ in the draft.
    rationale: γενναίως most naturally modifies ὑπήνεγκας (‘you bravely endured/bore’), whereas ἱδρυμένη describes the roof as firmly established.
  - severity: medium
    issue: ‘बच्चों के स्तंभ पर’ is structurally ambiguous.
    rationale: It may be read as ‘on the children’s pillar.’ Recasting as ‘अपने बच्चों रूपी स्तंभ पर’ makes the intended architectural relationship explicit without abandoning the metaphor.
  - severity: low
    issue: ‘यातनाओं से आए भूकंप’ is less direct than the Greek means expression.
    rationale: ‘यातनाओं के द्वारा आए भूकंप’ more clearly represents διὰ τῶν βασάνων while retaining the metaphorical earthquake.
  revised_text: क्योंकि जैसे तुम अपने बच्चों रूपी स्तंभ पर दृढ़ता से टिकी हुई छत के समान थीं, वैसे ही तुमने यातनाओं के द्वारा आए भूकंप को साहसपूर्वक और बिना डिगे सह लिया,
  revised_footnotes:
