  text: For just as you[a], like a roof firmly established upon the pillar of the children, bravely bore the earthquake through tortures without wavering,
translation:
  language: hi
  text: क्योंकि जैसे तुम अपने बच्चों रूपी स्तंभ पर दृढ़ता से टिकी हुई छत के समान थीं, वैसे ही तुमने यातनाओं के द्वारा आए भूकंप को साहसपूर्वक और बिना डिगे सह लिया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक संबंध और καθάπερ की तुलना—दोनों को बनाए रखता है; पद आगे जारी रहने के कारण वाक्य का रूप भी खुला रहता है।
- source_word: στέγη
  choice: छत
  rationale: मूल वास्तु-रूपक को उसके ठोस और सामान्य अर्थ में सुरक्षित रखता है।
- source_word: ἐπὶ τοῦ στύλου
  choice: स्तंभ पर
  rationale: संरचना को सहारा देने वाले खंभे का वास्तु-बिंब बनाए रखता है; ‘स्तंभ’ गरिमापूर्ण और सहज है।
- source_word: τῶν παίδων
  choice: बच्चों
  rationale: παῖδες का व्यापक अर्थ बनाए रखता है, यद्यपि कथा-संदर्भ में ये उस स्त्री के पुत्र हैं; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: γενναίως ἱδρυμένη
  choice: साहस के साथ दृढ़ता से टिकी हुई
  rationale: γενναίως को समीपवर्ती कृदंत ἱδρυμένη से जोड़ते हुए साहस और स्थिर स्थापना—दोनों भाव व्यक्त करता है; हिंदी में कृत्रिम कर्मवाच्य से बचता है।
- source_word: ἀκλινῶς
  choice: बिना डिगे
  rationale: न झुकने या न हटने के शाब्दिक बिंब और मानसिक दृढ़ता, दोनों को संक्षेप में व्यक्त करता है।
- source_word: ὑπήνεγκας
  choice: सह गईं
  rationale: भार या आघात को झेलने का अर्थ देता है और स्त्री संबोधन के अनुरूप है।
- source_word: διὰ τῶν βασάνων
  choice: यातनाओं से आए
  rationale: διά को यहाँ माध्यम अथवा कारण के रूप में स्वाभाविक हिंदी में व्यक्त करता है और यातनाओं तथा रूपकात्मक भूकंप का संबंध स्पष्ट रखता है।
- source_word: σεισμόν
  choice: भूकंप
  rationale: ‘छत’ और ‘स्तंभ’ के साथ चल रहे वास्तु-रूपक को सपाट किए बिना मूल शब्द का प्रत्यक्ष अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: माता का वास्तु-रूपक में चित्रण
  choice: ‘छत,’ ‘स्तंभ’ और ‘भूकंप’ के रूपक को ज्यों का त्यों बनाए रखना
  alternative: भावार्थ में कहना कि उसने अपने बच्चों को संरक्षण दिया और उनकी यातनाएँ दृढ़ता से सहीं
  rationale: यूनानी पाठ का आशय घने और जानबूझकर प्रयुक्त वास्तु-बिंबों द्वारा व्यक्त होता है; उसका अर्थ खोलकर लिख देना मूल की काव्यात्मक और धार्मिक तनावपूर्ण शक्ति को घटा देता।
- issue: τῶν παίδων की पारिवारिक विशिष्टता
  choice: मुख्य पाठ में ‘बच्चों’
  alternative: ‘पुत्रों’
  rationale: कथा-संदर्भ पुत्रों की ओर संकेत करता है, पर यूनानी संज्ञा अपने आप में अधिक व्यापक है। मुख्य पाठ में व्यापकता और पादटिप्पणी में संदर्भगत विकल्प दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण पर समझने योग्य शैली अपनाई गई है। पद मूल में अगले विचार से जुड़ा हुआ है, इसलिए अंत में अल्पविराम रखा गया है। ‘साहस के साथ दृढ़ता से टिकी हुई’ यूनानी शब्दक्रम के अनुसार γενναίως को ἱδρυμένη से जोड़ता है, जबकि ‘बिना डिगे’ ὑπήνεγκας की सहनशीलता को विशेषित करता है।
