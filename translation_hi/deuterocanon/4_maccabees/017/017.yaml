  text: Indeed, the tyrant himself and all their council marveled at their endurance, because of which they now stand beside the divine throne and live the blessed age.
translation:
  language: hi
  text: निश्चय ही, उस अत्याचारी स्वयं और उसकी पूरी परिषद ने उनके धैर्य को देखकर अचंभित हुए; उसी धैर्य के कारण वे अब दिव्य सिंहासन के सामने[a] खड़े हैं और धन्य युग में जीते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दिव्य सिंहासन के पास।” यूनानी अभिव्यक्ति का अर्थ सिंहासन की उपस्थिति में खड़े होना या उसके निकट उपस्थित रहना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “धन्य युग जीते हैं”; संदर्भ में यह धन्य चिरस्थायी अवस्था की ओर संकेत करता जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτός γέ τοι
  choice: निश्चय ही, स्वयं
  rationale: कण-समूह कथन को बल देता है और αὐτός व्यक्ति पर जोर डालता है; यह संयोजन आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ τύραννος
  choice: उस अत्याचारी
  rationale: τύραννος यहाँ अन्तियोकुस के प्रति लेखक की प्रतिकूल दृष्टि दिखाता है; ‘अत्याचारी’ तटस्थ ‘राजा’ की अपेक्षा इस भाव को बनाए रखता है।
- source_word: τὸ συνέδριον αὐτῶν
  choice: उसकी पूरी परिषद
  rationale: συνέδριον शासक की सभा अथवा न्यायिक परिषद को सूचित करता है; ‘परिषद’ संस्था का स्वरूप अनावश्यक रूप से निश्चित किए बिना औपचारिक भाव देता है। सन्दर्भानुसार αὐτῶν को स्वाभाविक हिन्दी में एकवचन शासक से जोड़ा गया है।
- source_word: ἐξεθαύμασαν
  choice: अचम्भा किया
  rationale: क्रिया तीव्र विस्मय व्यक्त करती है; यह चयन प्रशंसा का अतिरिक्त भाव आरोपित नहीं करता।
- source_word: ὑπομονήν
  choice: धीरज
  rationale: यातना के बीच अडिग सहनशीलता और दृढ़ बने रहने का भाव संक्षिप्त तथा सामान्य आधुनिक हिन्दी में व्यक्त होता है।
- source_word: διʼ ἣν
  choice: उसी धीरज के कारण
  rationale: सम्बन्धवाचक सर्वनाम का पूर्वपद स्पष्ट करके कारणात्मक सम्बन्ध को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: τῷ θείῳ ... θρόνῳ
  choice: दिव्य सिंहासन
  rationale: θείῳ विशेषणात्मक रूप से ‘दिव्य’ है; यह अनुवाद यूनानी अभिव्यक्ति के अनुरूप है और उसे स्पष्टतः ‘परमेश्वर का’ कहकर विस्तार नहीं देता।
- source_word: παρεστήκασιν
  choice: सामने खड़े हैं
  rationale: पूर्णकालिक रूप वर्तमान में बनी हुई स्थिति दर्शाता है। दत्तिव के साथ क्रिया सिंहासन की उपस्थिति में उपस्थित रहने का भाव दे सकती है; ‘सामने’ स्वाभाविक हिन्दी है, जबकि वैकल्पिक स्थानगत अर्थ पादटिप्पणी में रखा गया है।
- source_word: τὸν μακάριον ... αἰῶνα
  choice: धन्य युग
  rationale: यह यूनानी पद का निकट अनुवाद है और उसे सीधे ‘अनन्तकाल’ बनाकर व्याख्यात्मक रूप से निश्चित नहीं करता।
- source_word: βιοῦσιν
  choice: जीवन जीते हैं
  rationale: βιόω का जीवन बिताने का सक्रिय भाव हिन्दी की स्वाभाविक अभिव्यक्ति ‘जीवन जीना’ से व्यक्त किया गया है।
theological_decisions:
- issue: शहीदों के मरणोत्तर प्रतिफल का स्वरूप
  choice: उन्हें अभी दिव्य सिंहासन के सामने खड़ा और धन्य युग का जीवन जीता हुआ बताया गया है।
  alternative: वे दिव्य सिंहासन के पास खड़े हैं और धन्य अनन्त अवस्था का आनन्द लेते हैं।
  rationale: यूनानी पाठ νῦν और वर्तमान-अर्थ वाले क्रियारूपों से उनकी वर्तमान प्रतिष्ठित अवस्था चित्रित करता है। अनुवाद इस चित्र को बनाए रखता है, पर इसे बाद की किसी व्यवस्थित मरणोत्तर शिक्षा में नहीं बदलता।
- issue: παρεστήκασιν और दत्तिव का स्थानगत सम्बन्ध
  choice: दिव्य सिंहासन के सामने
  alternative: दिव्य सिंहासन के पास
  rationale: क्रिया का अर्थ उपस्थिति में खड़े होना या सेवा के लिए उपस्थित रहना हो सकता है; ‘सामने’ मुख्य पाठ में सहज है, पर ‘पास’ भी सम्भव होने के कारण पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धन्य युग’ जैसे असामान्य किन्तु महत्त्वपूर्ण मूल रूपक को मुख्य पाठ में बनाए रखकर उसकी सम्भावित व्याख्या पादटिप्पणी में दी गई है।
