lexical_decisions:
- source_word: ἐθαύμασαν
  choice: सराहना नहीं की
  rationale: क्रिया में विस्मय और प्रशंसा दोनों के भाव हो सकते हैं। इस प्रसंग में शहीदों के धैर्य की प्रशंसा प्रमुख है, जबकि अगली क्रिया चकित होने का भाव स्पष्ट करती है।
- source_word: ἀθλητάς
  choice: पहलवानों
  rationale: यह प्रतियोगिता में भाग लेने वालों के लिए प्रयुक्त शब्द है। ‘पहलवान’ आधुनिक हिन्दी में संघर्ष और प्रतियोगिता का रूपक बनाए रखता है और इसे केवल ‘वीर’ कहकर रूपक को मिटाता नहीं।
- source_word: νομοθεσίας
  choice: व्यवस्था
  rationale: यहाँ शब्द विधि-विधान अथवा दी गई व्यवस्था को सूचित करता है। धार्मिक-साहित्यिक हिन्दी में ‘व्यवस्था’ स्वाभाविक है और ‘विधान-निर्माण’ जैसी प्रक्रियात्मक अभिव्यक्ति से अधिक उपयुक्त है।
- source_word: ἀληθείας
  choice: सत्य
  rationale: सम्बन्धकारक रूप को संज्ञा के रूप में रखते हुए इसका नैतिक और धर्मवैचारिक भार सुरक्षित रखा गया है।
- source_word: τῆς ἀληθείας νομοθεσίας
  choice: सत्य की व्यवस्था
  rationale: यूनानी सम्बन्धकारक संरचना को बनाए रखने से ‘सत्य की व्यवस्था’ और ‘सच्ची व्यवस्था’ दोनों सम्भावित अर्थों के बीच का तनाव अनावश्यक रूप से समाप्त नहीं होता।
- source_word: ἐξεπλάγησαν
  choice: चकित नहीं हुआ
  rationale: यह तीव्र विस्मय सूचित करता है। ‘चकित’ पहली क्रिया की प्रशंसात्मक छाया से इसे अलग रखते हुए समानांतर आलंकारिक प्रश्न को स्वाभाविक हिन्दी देता है।
- source_word: τίνες
  choice: कौन था
  rationale: दोहराए गए आलंकारिक प्रश्नों में हिन्दी का एकवचन ‘कौन था’ सार्वभौमिक आशय को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शहीदों के लिए ἀθλητάς का रूपक
  choice: प्रतियोगितात्मक रूपक को ‘पहलवानों’ के रूप में स्पष्ट रखा गया।
  alternative: ‘वीरों’, ‘योद्धाओं’ या ‘समर्थकों’ के रूप में अर्थ खोलना
  rationale: लेखक सद्गुण और व्यवस्था के प्रति निष्ठा को प्रतियोगिता के रूप में चित्रित करता है; रूपक बनाए रखने से सैन्य अथवा मात्र सम्मानसूचक अर्थ आरोपित नहीं होता।
- issue: τῆς ἀληθείας νομοθεσίας का सम्बन्ध
  choice: ‘सत्य की व्यवस्था’
  alternative: ‘सच्ची व्यवस्था’
  rationale: यूनानी वाक्यांश को सम्बन्धकारक भी समझा जा सकता है और व्यवस्था को ‘सच्ची’ बताने वाला भी। मुख्य पाठ अधिक औपचारिक संरचना रखता है और पादटिप्पणी दूसरा स्वाभाविक अर्थ बताती है।
