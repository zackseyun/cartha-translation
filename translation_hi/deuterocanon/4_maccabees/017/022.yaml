  yaml_path: translation/deuterocanon/4_maccabees/017/022.yaml
  text: as though they had become a ransom for the sin of the nation[a], and through the blood of those devout ones and their propitiatory death, divine providence preserved Israel[b], though it had been mistreated before.
translation:
  language: hi
  text: मानो वे राष्ट्र के पाप के लिए छुड़ौती बन गए हों[a]। उन धर्मनिष्ठ लोगों के रक्त और उनकी प्रायश्चित्तकारी मृत्यु[b] के द्वारा, ईश्वरीय विधान ने पहले से पीड़ित इस्राएल को बचा लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘राष्ट्र के पाप के लिए प्राणों की छुड़ौती’ अथवा ‘राष्ट्र के पाप के बदले दिए गए प्राण।’
    reason: ἀντίψυχον में छुड़ौती, जीवन के बदले जीवन, और प्रतिस्थापन के परस्पर जुड़े अर्थ संभव हैं।
  - marker: b
    text: ‘प्रायश्चित्तकारी’ के लिए प्रयुक्त यूनानी शब्द का अनुवाद ‘कोप-शामक’ भी हो सकता है; अन्य संदर्भों में यही शब्द ‘दया-आसन’ के लिए आता है।
    reason: ἱλαστηρίου के बलिदानी और उपासना-संबंधी अर्थ-क्षेत्र को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀντίψυχον
  choice: प्राण-मूल्य
  rationale: यह शब्द किसी प्राण के बदले दिए जाने वाले मूल्य या जीवन-विनिमय का भाव रखता है। ‘प्राण-मूल्य’ संक्षिप्त रूप में उसके छुड़ौती और प्रतिस्थापन—दोनों भावों को बनाए रखता है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: यहाँ नैतिक और धार्मिक दोष का अर्थ है; ‘पाप’ उस भार को ‘अपराध’ या ‘भूल’ की अपेक्षा अधिक ठीक रूप से सुरक्षित रखता है।
- source_word: εὐσεβῶν
  choice: धर्मनिष्ठ
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धा और भक्ति रखने वालों का वर्णन करता है। ‘धर्मनिष्ठ’ आधुनिक, सम्मानपूर्ण और सहज हिन्दी है।
- source_word: ἱλαστηρίου
  choice: प्रायश्चित्तकारी
  rationale: यह विशेषण यहाँ मृत्यु के प्रायश्चित्त या दोष-निवारणकारी प्रभाव को बताता है। ‘प्रायश्चित्तकारी मृत्यु’ हिन्दी में स्वाभाविक रहते हुए बलिदानी संदर्भ को बनाए रखती है।
- source_word: θανάτου
  choice: मृत्यु
  rationale: संज्ञा शहीदों की मृत्यु को इस्राएल के बचाव के साधन के रूप में प्रस्तुत करती है; सीधा अनुवाद उपयुक्त है।
- source_word: θεία πρόνοια
  choice: ईश्वरीय प्रबंध
  rationale: यह पद परमेश्वर की पूर्वदर्शी और संरक्षणकारी व्यवस्था को दर्शाता है। ‘ईश्वरीय प्रबंध’ इस धार्मिक धारणा को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: προκακωθέντα
  choice: पहले से पीड़ित
  rationale: कृदंत इस्राएल पर पहले आ चुकी पीड़ा या दुर्व्यवहार को दर्शाता है। यह अनुवाद προ- के कालगत भाव और कर्मवाच्य अर्थ दोनों को रखता है।
- source_word: διέσωσεν
  choice: सुरक्षित बचा लिया
  rationale: संयुक्त क्रिया संकट के बीच पूर्ण संरक्षण या सकुशल निकालने का भाव देती है; यह पद उस बल को सामान्य ‘बचाया’ से अधिक स्पष्ट करता है।
theological_decisions:
- issue: शहीदों की मृत्यु के लिए ἱλαστηρίου का अर्थ
  choice: प्रायश्चित्तकारी मृत्यु
  alternative: कोप-शामक मृत्यु; प्रायश्चित्त का साधन बनी मृत्यु; दया-आसन से संबंधित मृत्यु
  rationale: संदर्भ में यह शब्द किसी वास्तविक उपासना-वस्तु का नाम नहीं, बल्कि मृत्यु के प्रभाव का विशेषण है। ‘प्रायश्चित्तकारी’ पाप-निवारण के भाव को रखता है, पर यह तय नहीं करता कि इसका मुख्य पक्ष दोष-मोचन है या कोप-शमन।
- issue: ἀντίψυχον γεγονότας में प्रतिस्थापन का स्वरूप
  choice: प्राण-मूल्य बन गए हों
  alternative: प्राणों की छुड़ौती बन गए हों; बदले में दिए गए प्राण बन गए हों
  rationale: यूनानी पाठ विनिमय या प्रतिस्थापन की भाषा बोलता है, पर उसके ठीक धर्मवैज्ञानिक तंत्र को नहीं समझाता। ‘प्राण-मूल्य’ उस तनाव को बिना अधिक व्याख्या जोड़े बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। बलिदान और प्रायश्चित्त की शब्दावली को अत्यधिक सांप्रदायिक व्याख्या दिए बिना संरक्षित किया गया है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में रखे गए हैं।
