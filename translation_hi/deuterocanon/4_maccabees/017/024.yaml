  text: And it made them noble and courageous in infantry combat and siege warfare[a], and after sacking them[c][b], he conquered all the enemies.
translation:
  language: hi
  text: और इसने उन्हें पैदल युद्ध[a] और घेराबंदी में उदात्त और साहसी बनाया; और उजाड़ने के बाद[b] उसने[c] सभी शत्रुओं पर विजय पाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पैदल लड़ाई’; यूनानी शब्द का शाब्दिक संबंध पैदल लड़ने से है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी का अर्थ ‘लूटकर नष्ट करने’ या ‘उजाड़ने’ से है और प्रायः इसका संबंध नगरों या गढ़ों से होता है; यहाँ उसका कर्म स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
  - marker: c
    text: इस वाक्य में कर्ता दबा हुआ और कुछ अस्पष्ट है। यूनानी के अंतिम कृदंत और क्रिया पुल्लिंग एकवचन में हैं; अनुवाद ने व्यापक प्रसंग से किसी कर्ता का नाम जोड़कर इस अस्पष्टता को दूर नहीं किया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχεν
  choice: बनाया
  rationale: यहाँ दोहरे कर्म-सदृश विन्यास में क्रिया परिणामसूचक/कारक अर्थ देती है—‘उन्हें उदात्त और साहसी बनाया।’
- source_word: γενναίους
  choice: उदात्त
  rationale: γενναῖος में चरित्र की श्रेष्ठता और वीरता दोनों का भाव हो सकता है। अगले विशेषण में साहस व्यक्त होने के कारण ‘उदात्त’ दोनों विशेषणों का अंतर बनाए रखता है।
- source_word: ἀνδρείους
  choice: साहसी
  rationale: यह युद्ध-संबंधी धैर्य और वीरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक लैंगिक अर्थ जोड़े।
- source_word: εἰς πεζομαχίαν
  choice: पैदल युद्ध के लिए
  rationale: πεζομαχία का मूल अर्थ पैदल लड़ने वालों का युद्ध है; ‘पैदल युद्ध’ इसे ‘आमने-सामने की लड़ाई’ से अधिक ठीक रूप में रखता है।
- source_word: πολιορκίαν
  choice: घेराबंदी
  rationale: यह नगर या गढ़ को घेरकर किए जाने वाले सैन्य अभियान का सीधा और प्रचलित हिन्दी रूप है।
- source_word: ἐκπορθήσας
  choice: उजाड़ डालकर
  rationale: क्रिया लूटकर नष्ट करने या ध्वस्त करने का अर्थ देती है। यूनानी में कर्म नहीं दिया गया है, इसलिए हिन्दी में भी किसी नगर, गढ़ या व्यक्ति को स्पष्ट कर्म नहीं बनाया गया।
- source_word: ἐνίκησεν
  choice: विजय पाई
  rationale: νικάω का अर्थ जीतना या पराजित करना है; ‘सभी शत्रुओं पर विजय पाई’ गरिमापूर्ण और स्वाभाविक सैन्य अभिव्यक्ति है।
- source_word: πάντας τοὺς πολεμίους
  choice: सभी शत्रुओं
  rationale: यूनानी पाठ में ‘उसके’ नहीं है, इसलिए स्वामित्वसूचक सर्वनाम नहीं जोड़ा गया।
theological_decisions:
- issue: ἔσχεν के निहित कर्ता और बाद के पुल्लिंग एकवचन कृदंत/क्रिया का संबंध
  choice: पहले खंड में ‘इसने’ और अंतिम खंड में ‘उसने’ रखकर यूनानी की संक्षिप्त तथा कुछ अस्पष्ट कर्ता-संरचना को बनाए रखा गया।
  alternative: व्यापक प्रसंग के आधार पर दोनों स्थानों पर ‘विवेक’, ‘माता’ या किसी अन्य निश्चित कर्ता का नाम जोड़ना।
  rationale: इस पद में कर्ता स्पष्ट संज्ञा से नहीं बताया गया, और क्रियारूपों के बीच तनाव है। मुख्य पाठ में किसी एक प्रसंगगत पहचान को निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध सैन्य-वर्णन। ‘उदात्त और साहसी’ मूल के दो निकट किंतु भिन्न गुणों को अलग रखता है। अर्धविराम दोनों संकुचित खंडों के बीच संबंध और अचानक कर्ता-संक्रमण को स्पष्ट किए बिना पठनीय बनाता है।
