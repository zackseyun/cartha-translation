  text: The tyrant kept struggling[a], but the world and the life of mankind were watching.
translation:
  language: hi
  text: तानाशाह उनसे संघर्ष करता रहा[a], पर संसार और मानव-जीवन देखते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “तानाशाह संघर्ष कर रहा था; पर संसार और मनुष्यों का जीवन देख रहा था।” ‘उनसे’ प्रसंग के आधार पर जोड़ा गया है।
    reason: यूनानी क्रिया में प्रतिपक्ष व्यक्त नहीं है; हिंदी में संदर्भगत पूर्ति को स्पष्ट करने और अधिक शाब्दिक विकल्प देने के लिए।
lexical_decisions:
- source_word: ὁ τύραννος
  choice: अत्याचारी
  rationale: यह शब्द दमनकारी शासक का नकारात्मक नैतिक भाव व्यक्त करता है; हिंदी में ‘अत्याचारी’ स्वाभाविक और सशक्त है।
- source_word: ἀντηγωνίζετο
  choice: उनसे संघर्ष करता रहा
  rationale: अपूर्ण भूतकाल जारी संघर्ष को दर्शाता है। यूनानी में प्रतिपक्ष का कर्म निहित है; संदर्भ से शहीदों की ओर संकेत स्पष्ट होने के कारण ‘उनसे’ जोड़ा गया है और इसे पादटिप्पणी में बताया गया है।
- source_word: ὁ δὲ κόσμος
  choice: पर संसार
  rationale: δέ यहाँ अत्याचारी के संघर्ष और व्यापक दर्शक-मंडल के देखने के बीच विरोध अथवा दृश्य-परिवर्तन प्रकट करता है।
- source_word: ὁ τῶν ἀνθρώπων βίος
  choice: मानव-जीवन
  rationale: यह ऊँची, सामूहिक और कुछ हद तक मानवीकृत अभिव्यक्ति है; ‘मानव-जीवन’ उसका व्यापक अर्थ बनाए रखता है।
- source_word: ἐθεώρει
  choice: यह सब देखते रहे
  rationale: अपूर्ण भूतकाल लगातार देखते रहने का भाव देता है। संयुक्त, मानवीकृत कर्ता के साथ बहुवचन हिंदी में स्वाभाविक है; ‘यह सब’ दृश्य के अवलोकन को स्पष्ट करता है।
theological_decisions:
- issue: ‘संसार’ और ‘मानव-जीवन’ का दर्शकों के रूप में मानवीकरण
  choice: मुख्य पाठ में मानवीकृत चित्रण बनाए रखा गया।
  alternative: इसे अमूर्त रूप में ‘मानव-जीवन का संसार देख रहा था’ कहना।
  rationale: यूनानी घटना को सार्वजनिक और विश्वव्यापी मानवीय दृश्य के रूप में प्रस्तुत करता है; मानवीकरण बनाए रखने से अलंकारिक प्रभाव सुरक्षित रहता है और कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जुड़ता।
- issue: ἀντηγωνίζετο के निहित प्रतिपक्ष को व्यक्त करना
  choice: संदर्भ के आधार पर ‘उनसे’ जोड़ा गया और पादटिप्पणी दी गई।
  alternative: कर्म को अव्यक्त रखते हुए ‘अत्याचारी संघर्ष करता रहा’ कहना।
  rationale: यूनानी में प्रतिपक्ष स्पष्ट रूप से व्यक्त नहीं है, किंतु प्रसंग में पीड़ित जन उसका लक्ष्य हैं। ‘उनसे’ सहज हिंदी देता है, जबकि पादटिप्पणी मूल की संरचनात्मक अस्पष्टता सुरक्षित रखती है।
