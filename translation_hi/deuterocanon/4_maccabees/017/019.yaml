  text: And so these men also[a], having been made holy through God, have been honored not only with this honor, but also because through them our nation did not let the enemies prevail,
translation:
  language: hi
  text: इसलिए परमेश्वर द्वारा पवित्र किए गए ये लोग भी सम्मानित हुए हैं—न केवल इस सम्मान से, बल्कि इस कारण भी कि उनके कारण शत्रु हमारे राष्ट्र पर प्रबल नहीं हो सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ οὗτοι οὖν
  choice: इसलिए ये लोग भी
  rationale: οὖν का निष्कर्षसूचक भाव ‘इसलिए’ से और καί का समावेशी भाव ‘भी’ से व्यक्त होता है। οὗτοι के लिए ‘ये लोग’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἁγιασθέντες
  choice: पवित्र किए जाकर
  rationale: यह ἁγιάζω का एओरिस्ट कर्मवाच्य कृदन्त है। ‘पवित्र किए जाकर’ कर्मवाच्य और मुख्य क्रिया से पूर्व की क्रिया दोनों को बनाए रखता है; ‘अभिषिक्त’ या ‘समर्पित’ अनावश्यक रूप से अर्थ को संकरा कर देते।
- source_word: διὰ θεοῦ
  choice: परमेश्वर के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन अथवा कर्तृत्व व्यक्त कर सकता है। हिन्दी में ‘परमेश्वर के द्वारा’ दिव्य कर्तृत्व को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; वैकल्पिक ‘परमेश्वर के माध्यम से’ अधिक शब्दशः है, पर यहाँ कुछ कृत्रिम लग सकता है।
- source_word: τετίμηνται
  choice: सम्मानित हुए हैं
  rationale: यह τιμάω का पूर्णकालिक कर्मवाच्य रूप है, जिसमें दिए गए सम्मान का वर्तमान परिणाम निहित है। ‘सम्मानित हुए हैं’ इस कर्मवाच्य और स्थायी परिणति को सहज हिन्दी में रखता है।
- source_word: ταύτῃ τῇ τιμῇ
  choice: इस सम्मान से
  rationale: यहाँ चतुर्थी कारक साधन अथवा सम्बन्ध का भाव देता है। ‘इस सम्मान से’ τετίμηνται और τιμή के शब्दगत सम्बन्ध को भी बनाए रखता है।
- source_word: τῷ διʼ αὐτοὺς
  choice: इस बात से भी कि उनके कारण
  rationale: लेख सहित अगला वाक्यांश सम्मान के एक अतिरिक्त आधार को बताता है। ‘इस बात से भी कि’ उस संज्ञीकृत उपवाक्य को और ‘उनके कारण’ διά के कारणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἔθνος ἡμῶν
  choice: हमारे राष्ट्र
  rationale: ἔθνος यहाँ यहूदी राष्ट्रीय समुदाय को सूचित करता है। ‘राष्ट्र’ उसके सामूहिक और राष्ट्रीय भाव को ‘लोगों’ से अधिक ठीक रखता है।
- source_word: τοὺς πολεμίους
  choice: शत्रुओं को
  rationale: निश्चित लेख प्रसंग में पहचाने हुए विरोधियों की ओर संकेत करता है। हिन्दी वाक्य-विन्यास में ‘शत्रुओं को’ सीधा और स्पष्ट है।
- source_word: μὴ ἐπικρατῆσαι
  choice: प्रबल नहीं होने दिया
  rationale: ἐπικρατέω का अर्थ प्रबल होना, विजय पाना या अधिकार जमा लेना है। यूनानी के संक्षिप्त और कुछ कठिन वाक्य-विन्यास को हिन्दी में ‘प्रबल नहीं होने दिया’ परिणामात्मक अर्थ और राष्ट्र की सक्रिय भूमिका दोनों के साथ व्यक्त करता है।
theological_decisions:
- issue: शहीदों के प्रसंग में ἁγιασθέντες का अर्थ
  choice: उन्हें परमेश्वर के द्वारा पवित्र किया गया बताया गया है।
  alternative: उन्हें अधिक संकीर्ण उपासना-संबंधी अर्थ में परमेश्वर द्वारा समर्पित या प्रतिष्ठित माना जाए।
  rationale: प्रसंग उनकी निष्ठा, सम्मान और उनके कारण राष्ट्र को मिली रक्षा पर बल देता है। ‘पवित्र किए गए’ वास्तविक पवित्र स्थिति को व्यक्त करता है, पर बलिदानी पद या किसी विशिष्ट धार्मिक संस्कार का अर्थ आरोपित नहीं करता।
- issue: διὰ θεοῦ में दिव्य कर्तृत्व
  choice: परमेश्वर के द्वारा
  alternative: परमेश्वर के माध्यम से
  rationale: सम्बन्धकारक के साथ διά कर्तृत्व या माध्यम दोनों का भाव दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘के द्वारा’ रखा गया है, जबकि पादटिप्पणी अधिक शब्दशः विकल्प को सुरक्षित रखती है।
- issue: राष्ट्र और शत्रुओं के बीच μὴ ἐπικρατῆσαι का सम्बन्ध
  choice: उनके कारण हमारे राष्ट्र ने शत्रुओं को प्रबल नहीं होने दिया।
  alternative: उनके कारण शत्रु हमारे राष्ट्र पर प्रबल नहीं हुए।
  rationale: यूनानी में दोनों संज्ञाएँ कर्मकारक रूप में हैं और रचना संक्षिप्त है। चुना गया पाठ उपलब्ध वाक्यक्रम तथा अंग्रेज़ी परामर्श-पाठ की सक्रिय रचना को बनाए रखता है; वैकल्पिक रूप उसी ऐतिहासिक परिणाम को निष्क्रिय दृष्टि से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्र किए जाकर’ और ‘सम्मानित हुए हैं’ से मूल के कर्मवाच्य रूप सुरक्षित हैं। अंतिम उपवाक्य को हिन्दी में स्पष्ट करने के लिए सीमित वाक्य-विस्तार किया गया है, पर विजय अथवा राष्ट्रीय उद्धार की कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ी गई।
