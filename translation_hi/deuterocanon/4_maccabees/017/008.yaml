  rationale: संकेतवाचक पद आगे आने वाली स्मारक-वाणी की ओर इंगित करता है। ‘बातें’ निहित कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς ἀπὸ τοῦ ἔθνους
  choice: राष्ट्र के लोगों के
  rationale: शाब्दिक भाव ‘राष्ट्र से संबंध रखने वालों’ का है। ‘राष्ट्र के लोग’ सामूहिक-राष्ट्रीय अर्थ बनाए रखता है और अनकहे ‘हमारे’ को नहीं जोड़ता।
- source_word: εἰς μνείαν
  choice: स्मरण के लिए
  rationale: यह उद्देश्य अथवा स्मारक-भाव व्यक्त करता है; हिन्दी में ‘स्मरण के लिए’ सीधा और स्वाभाविक है।
- source_word: λεγόμενα
