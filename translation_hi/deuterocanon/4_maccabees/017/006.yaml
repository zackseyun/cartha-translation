  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-समीप भाषा रखी गई है। ‘संतानोत्पत्ति’ कुछ औपचारिक है, पर मूल संज्ञा का ठोस अर्थ और वंशगत संदर्भ स्पष्ट रखती है।
