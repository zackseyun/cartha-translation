- source_word: ἦ γὰρ
  choice: क्योंकि ... हुई थी
  rationale: γάρ पिछले कथन का कारण बताता है, इसलिए ‘क्योंकि’ उपयुक्त है; ἦ भूतकाल की अवस्था व्यक्त करता है, जिसे यहाँ ‘हुई थी’ से स्वाभाविक हिन्दी मिली है।
- source_word: ἡ παιδοποιία σου
  choice: तुम्हारी संतानोत्पत्ति
  rationale: παιδοποιία संतान उत्पन्न करने या जन्म देने को दर्शाता है। ‘संतानोत्पत्ति’ संक्षिप्त है और मातृत्व जैसे अधिक व्यापक अर्थ को नहीं जोड़ता। σου उस माता को सीधे संबोधित करने वाला एकवचन संबंधसूचक है।
- source_word: ἀπὸ Ἀβραὰμ
  choice: अब्राहम से
  rationale: ἀπό यहाँ स्रोत या वंशगत उद्गम दर्शाता है। ‘से’ मूल अभिव्यक्ति को संक्षिप्त रूप में बनाए रखता है।
- source_word: τοῦ παιδός
  choice: सेवक
  rationale: παῖς का अर्थ ‘बालक/संतान’ अथवा ‘सेवक’ हो सकता है। अब्राहम के लिए आदरसूचक धार्मिक प्रयोग में ‘सेवक’ संदर्भ के अधिक अनुकूल है; फिर भी शब्द की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: अब्राहम के लिए παῖς का अर्थ
  choice: सेवक अब्राहम
  alternative: बालक अब्राहम; दास अब्राहम
  rationale: यह पद संभवतः अब्राहम को परमेश्वर की सेवा करने वाले सम्मानित व्यक्ति के रूप में संबोधित करता है। ‘सेवक’ इस आदरसूचक भाव को रखता है, जबकि ‘दास’ अनावश्यक रूप से सामाजिक बंधन पर बल दे सकता है। ‘बालक’ शब्दार्थतः संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
