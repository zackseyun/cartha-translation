lexical_decisions:
- source_word: θεοσέβεια
  choice: परमेश्वर-भक्ति
  rationale: यह संज्ञा परमेश्वर के प्रति श्रद्धा और समर्पण को व्यक्त करती है। ‘परमेश्वर-भक्ति’ इसके स्पष्ट ईश्वराभिमुख अर्थ को बनाए रखती है और सामान्य ‘भक्ति’ से अधिक सटीक है।
- source_word: ἐνίκα
  choice: विजयी हुई
  rationale: क्रिया प्रतियोगिता में जीतने या विजयी होने का भाव देती है। ‘विजयी हुई’ अगले मुकुट-विषयक रूपक के साथ स्वाभाविक रूप से जुड़ती है।
- source_word: τοὺς ἑαυτῆς
  choice: अपने ही
  rationale: यह आत्मवाचक संबंध बताता है कि खिलाड़ी उसी व्यक्तिरूप परमेश्वर-भक्ति के हैं; ‘ही’ इस अपनेपन पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀθλητάς
  choice: खिलाड़ियों
  rationale: यूनानी शब्द खेल-प्रतियोगिता में भाग लेने वालों का स्पष्ट रूपक रखता है। ‘खिलाड़ी’ आधुनिक हिन्दी में बोधगम्य है और इसे ‘वीर’ या पहले से विजयी ‘विजेता’ बनाकर अर्थ नहीं बढ़ाता।
- source_word: στεφανοῦσα
  choice: विजय-मुकुट पहनाया
  rationale: कृदन्त प्रतियोगिता के विजेताओं को पुष्पमुकुट देने की छवि प्रस्तुत करता है। हिन्दी में ‘विजय-मुकुट पहनाना’ उस प्राचीन सम्मान-क्रिया और रूपक दोनों को स्पष्ट तथा संक्षिप्त रखता है।
theological_decisions:
- issue: θεοσέβεια का मानवीकरण
  choice: ‘परमेश्वर-भक्ति’ को स्त्रीलिंग व्यक्तिरूप में रखते हुए ‘उसने’ और मुकुट पहनाने की क्रिया से मानवीकरण व्यक्त किया गया है।
  alternative: 'मानवीकरण को कम स्पष्ट रखते हुए कहना: ‘परन्तु परमेश्वर-भक्ति की विजय हुई और उसके अपने खिलाड़ियों को मुकुट मिला।’'
  rationale: यूनानी पाठ में स्त्रीलिंग संज्ञा स्वयं विजयी होकर अपने खिलाड़ियों को मुकुट पहनाती है। हिन्दी में ‘भक्ति’ स्वाभाविक रूप से स्त्रीलिंग है, इसलिए बिना कोई अतिरिक्त धार्मिक पात्र गढ़े मूल मानवीकरण सुरक्षित रखा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। ‘परमेश्वर-भक्ति’, ‘खिलाड़ी’ और ‘विजय-मुकुट’ मिलकर मूल की खेल-प्रतियोगिता संबंधी छवि बनाए रखते हैं; स्त्रीलिंग मानवीकरण हिन्दी में स्वाभाविक है।
