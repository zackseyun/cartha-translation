review_pass:
  verdict: revise
  source_fidelity: Draft correctly conveys the reported nature of the statement, the royal guards, her deliberate act, and the pyre. However, “पकड़ लिया जाने वाला था” is aspectually too completed for ἔμελλεν ... συλλαμβάνεσθαι (“was about to be seized”), and “वे” supplies a definite subject where the Greek leaves the prospective toucher unspecified.
  naturalness: The Hindi is generally clear and dignified. “पकड़ी जाने वाली थी” is more natural and accurately prospective; “कोई ... छू न सके” retains the Greek’s unspecified subject.
  terminology: “राजा के अंगरक्षक” appropriately renders δορυφόροι in context, and “चिता” accurately represents πυρά. “मार डाले जाने के लिए” naturally communicates πρὸς θάνατον without importing a formal legal category.
  issues:
  - severity: medium
    issue: The prospective passive is rendered as completed seizure.
    rationale: ἔμελλεν ... συλλαμβάνεσθαι means she was about to be seized, not that she was about to have already been seized. Replace “पकड़ लिया जाने वाला था” with “पकड़ी जाने वाली थी.”
  - severity: low
    issue: The subject of “छू न सकें” is made specifically the guards.
    rationale: The Greek has an unexpressed singular subject in ψαύσειεν and need not restrict the potential toucher to the guards. “कोई ... छू न सके” preserves this openness.
  - severity: low
    issue: The reported-claim footnote anchor is placed at the end rather than on the reporting clause.
    rationale: Since the note explains “कुछ ... कहते थे,” its anchor should immediately follow that clause for clear attachment.
