  yaml_path: translation/deuterocanon/4_maccabees/017/001.yaml
  text: Some of the king’s guards also said that when she too was about to be seized for death[b][a], she threw herself onto the pyre so that they might not touch any part of her body.
translation:
  language: hi
  text: राजा के अंगरक्षकों[a] में से कुछ यह भी कहते थे[b] कि जब वह भी मार डाले जाने के लिए पकड़ी जाने वाली थी, तो उसने अपने आप को चिता पर फेंक दिया, ताकि कोई उसके शरीर के किसी भी भाग को छू न सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजा के पहरेदार’; शाब्दिक अर्थ ‘भाला उठाने वाले’ है। यूनानी शब्द शाही अंगरक्षकों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यह बात कुछ अंगरक्षकों के कथन के रूप में दी गई है, कथावाचक के निर्विवाद कथन के रूप में नहीं।
    reason: reported_claim
lexical_decisions:
- source_word: δορυφόρων
  choice: राजा के अंगरक्षकों
  rationale: शब्द का शाब्दिक अर्थ ‘भाला उठाने वाले’ है, पर यह प्रायः शाही अंगरक्षकों के लिए प्रयुक्त होता है। प्रसंग से ‘राजा के’ स्पष्ट है और आधुनिक हिन्दी में संस्थागत भूमिका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: συλλαμβάνεσθαι
  choice: पकड़ लिया जाने वाला था
  rationale: निष्क्रिय रूप बलपूर्वक अधिकार में लिए जाने को दर्शाता है। यह अनावश्यक आधुनिक कानूनी अर्थ वाले ‘गिरफ़्तार’ की अपेक्षा प्रसंग के अनुकूल है।
- source_word: πρὸς θάνατον
  choice: मृत्यु के लिए
  rationale: यह यूनानी पद मृत्यु को पकड़े जाने का अभिप्रेत परिणाम बताता है। संक्षिप्त और गंभीर अभिव्यक्ति मूल की संरचना को सुरक्षित रखती है।
- source_word: ψαύσειέν
  choice: छू न सकें
  rationale: ψαύω का मूल अर्थ छूना या हाथ लगाना है। यहाँ शारीरिक संपर्क रोकना अभिप्रेत है।
- source_word: τι τοῦ σώματος αὐτῆς
  choice: उसके शरीर के किसी भी अंग को
  rationale: यूनानी अंशवाचक रचना का स्वाभाविक हिन्दी रूप है और तनिक भी शारीरिक संपर्क न होने का भाव स्पष्ट करता है।
- source_word: ἑαυτὴν ἔρριψεν
  choice: उसने अपने आपको ... फेंक दिया
  rationale: प्रतिवर्ती और जानबूझकर किए गए प्रबल कार्य को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατὰ τῆς πυρᾶς
  choice: चिता पर
  rationale: πυρά सामान्य आग नहीं, बल्कि लकड़ियों से बनाई गई चिता है। ‘चिता पर’ गंतव्य और विशिष्ट वस्तु दोनों को स्पष्ट करता है।
theological_decisions:
- issue: माता के अंतिम कार्य का कथात्मक स्वरूप
  choice: इसे कुछ अंगरक्षकों द्वारा कही गई बात के रूप में प्रस्तुत किया गया है कि उसने जानबूझकर अपने आपको चिता पर फेंक दिया।
  alternative: इसे कथावाचक का निर्विवाद प्रत्यक्ष कथन मानना, अथवा हिंसक कार्य को नरम भाषा में व्यक्त करना।
  rationale: ἔλεγον ... τινές कथन को स्पष्ट रूप से ‘कुछ लोग कहते थे’ वाली रिपोर्ट के रूप में सीमित करता है। अनुवाद इस दूरी को बनाए रखता है और कार्य की कठोरता को भी नहीं छिपाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्पष्ट शैली रखी गई है। ‘राजा के अंगरक्षक’, ‘मृत्यु के लिए’ और ‘चिता’ मूल यूनानी की संस्थागत भूमिका, संक्षिप्त गंभीरता और वस्तुगत विशिष्टता को बनाए रखते हैं।
