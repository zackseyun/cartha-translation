  yaml_path: translation/deuterocanon/4_maccabees/017/009.yaml
  text: Here lie buried an aged priest[a], and an aged woman, and seven children, because of a tyrant’s violence, who wanted to abolish the commonwealth of the Hebrews.
translation:
  language: hi
  text: यहाँ एक वृद्ध याजक, एक वृद्ध स्त्री और सात पुत्र दफ़न हैं, उस अत्याचारी की हिंसा के कारण जो इब्रानियों की सामुदायिक व्यवस्था[a] को मिटा देना चाहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “इब्रानियों की जीवन-पद्धति” या “इब्रानियों का संविधान” भी हो सकता है। यूनानी शब्द किसी जनसमुदाय के व्यवस्थित सामूहिक जीवन को दर्शाता है, केवल उसके निजी धार्मिक विश्वास को नहीं।
    reason: πολιτεία की सामुदायिक, नागरिक और जीवन-पद्धति संबंधी अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: Ἐντάφθα
  choice: यहाँ
  rationale: यह स्थानसूचक क्रियाविशेषण समाधिलेख-जैसी आरंभिक शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γέρων ἱερεύς
  choice: एक वृद्ध याजक
  rationale: γέρων उन्नत आयु दर्शाता है; ‘वृद्ध’ गंभीर और सम्मानपूर्ण है, और ἱερεύς के लिए ‘याजक’ उपयुक्त धार्मिक पदनाम है।
- source_word: γυνὴ γεραιά
  choice: एक वृद्ध स्त्री
  rationale: यह γέρων ἱερεύς के समानांतर आयु और गरिमापूर्ण स्मारकीय स्वर को बनाए रखता है।
- source_word: ἑπτὰ παῖδες
  choice: सात बालक
  rationale: παῖδες का मूल अर्थ बच्चे या बालक हो सकता है। निकटवर्ती कथा उन्हें पुत्रों के रूप में पहचानती है, पर इस पद में संबंधसूचक शब्द नहीं है; ‘बालक’ पुरुषवाचक संदर्भ और यूनानी की अपेक्षाकृत व्यापक अभिव्यक्ति दोनों के निकट रहता है।
- source_word: ἐγκεκήδευνται
  choice: दफ़न हैं / दफ़न हुए
  rationale: पूर्ण कर्मवाच्य दफ़न किए जाने से उत्पन्न वर्तमान अवस्था बताता है। पहले वाक्य में ‘दफ़न हैं’ उस अवस्था को और दूसरे में ‘दफ़न हुए’ उसके कारण-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τυράννου βίαν
  choice: उस अत्याचारी की हिंसा के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण प्रकट करता है; ‘हिंसा’ βία का सीधा अर्थ और ‘अत्याचारी’ τύραννος का स्वाभाविक हिन्दी रूप है।
- source_word: τὴν Ἑβραίων πολιτίαν
  choice: इब्रानियों की सामुदायिक व्यवस्था
  rationale: πολιτεία केवल निजी विश्वास नहीं, बल्कि किसी जनसमुदाय के व्यवस्थित, विधि-शासित सामूहिक जीवन और उसकी नागरिक-संवैधानिक व्यवस्था को समेटता है। ‘सामुदायिक व्यवस्था’ इस व्यापकता को अपेक्षाकृत सहज हिन्दी में रखता है; अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: καταλῦσαι
  choice: मिटा देना
  rationale: यहाँ क्रिया का लक्ष्य किसी स्थापित सामुदायिक व्यवस्था को समाप्त करना है। ‘मिटा देना’ साधारण पाठक के लिए स्पष्ट है और विनाश अथवा उन्मूलन की शक्ति बनाए रखता है।
- source_word: θέλοντος
  choice: जो ... चाहता था
  rationale: संबंधवाचक उपवाक्य हिन्दी में स्पष्ट रूप से बताता है कि व्यवस्था को मिटाने की इच्छा अत्याचारी की थी।
theological_decisions:
- issue: यहूदी शहादत के प्रसंग में πολιτεία का आशय
  choice: इब्रानियों की सामुदायिक व्यवस्था
  alternative: इब्रानियों की जीवन-पद्धति; इब्रानियों का संविधान
  rationale: शब्द पैतृक विधि के अधीन इब्रानी लोगों के सामूहिक और सुव्यवस्थित जीवन को सूचित करता है। इसे केवल ‘धर्म’ कहना अर्थ को निजी विश्वास तक सीमित कर देता, जबकि ‘संविधान’ अकेले आधुनिक राजकीय दस्तावेज़ का भ्रामक आभास दे सकता है। मुख्य पाठ और पादटिप्पणी मिलकर मूल की अर्थ-व्याप्ति और अस्पष्टता बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और समाधिलेख-सदृश रखी गई है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है ताकि अत्याचारी से संबंधित उपवाक्य का संबंध स्पष्ट रहे। ‘दफ़न’ सामान्य आधुनिक प्रयोग है; अत्यधिक संस्कृतनिष्ठ ‘समाधिस्थ’ से बचा गया है।
