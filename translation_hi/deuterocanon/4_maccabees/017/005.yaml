base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/005.yaml
  text: Not so does the moon stand in majesty in heaven with the stars[a], as you, having guided your seven sons, equal to the stars, toward godliness[b], have come to stand honored before God and have been established in heaven with them.
translation:
  language: hi
  text: जिस प्रकार चन्द्रमा आकाश में तारों के साथ गरिमामय होकर स्थापित नहीं है, उसी प्रकार तुम भी नहीं—तुमने अपने सात तारों-समान पुत्रों को धर्मपरायणता की ओर प्रकाशित करके परमेश्वर के समक्ष आदरणीय होकर स्थान पाया है और उनके साथ स्वर्ग में स्थिर की गई हो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अनुवाद ‘प्रकाश की ओर ले जाकर’ या ‘ज्योति देकर’ भी किया जा सकता है। इसमें प्रकाश देने, प्रकाशित करने और प्रकाश की ओर मार्गदर्शन करने के परस्पर जुड़े भाव हैं।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप में: ‘उनके साथ आकाश में स्थिर की गई हो।’ ‘आकाश’ और ‘स्वर्ग’ के लिए यूनानी में एक ही शब्द है; इस प्रसंग में यह पुत्रों के साथ स्वर्गीय सम्मान का संकेत देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: σελήνη
  choice: चन्द्रमा
  rationale: यह सामान्य खगोलीय अर्थ है; हिन्दी में बिना निश्चयवाचक उपपद के भी स्वाभाविक रूप से निश्चित चन्द्रमा का बोध होता है।
- source_word: σεμνὴ
  choice: गरिमा से
  rationale: शब्द प्रतिष्ठा, गौरव और गरिमामय भव्यता व्यक्त करता है; इस तुलना में ‘गरिमा से प्रतिष्ठित’ स्वाभाविक और उदात्त है।
- source_word: καθεστήκεν / καθεστήκας
  choice: प्रतिष्ठित है / सम्मानित हुई हो
  rationale: दोनों रूप किसी दशा में स्थापित या स्थित होने का भाव देते हैं। हिन्दी में शब्दशः एक ही क्रिया दोहराने के बजाय चन्द्रमा की गरिमा और माता के परमेश्वर-सम्मुख सम्मान को स्पष्ट करते हुए अलंकारिक समानता बनाए रखी गई है।
- source_word: ἰσαστέρους
  choice: तारों के समान
  rationale: समास का मूल अर्थ तारों के तुल्य है। यह पुत्रों को तारों से जोड़ने वाली उपमा को स्पष्ट रखता है।
- source_word: ἑπτὰ παῖδας
  choice: सात पुत्रों
  rationale: παῖδας का अर्थ संतान या बालक हो सकता है, पर कथा-संदर्भ में सातों पुरुष संतान हैं; इसलिए ‘पुत्रों’ सटीक है।
- source_word: φωταγωγήσασα
  choice: ज्योति से मार्ग दिखाकर
  rationale: क्रिया में प्रकाश देने, प्रकाश तक ले जाने या प्रकाश के द्वारा मार्गदर्शन करने की छवि है। यह चयन खगोलीय ज्योति की अलंकारिक पृष्ठभूमि को बनाए रखते हुए माता के मार्गदर्शन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς τὴν εὐσέβειαν
  choice: भक्ति की ओर
  rationale: εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुरूप आचरण को दर्शाता है। ‘भक्ति’ आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है, बिना किसी संप्रदायगत अर्थ को जोड़े।
- source_word: ἔντιμος ... θεῷ
  choice: परमेश्वर की दृष्टि में सम्मानित
  rationale: ἔντιμος आदर और मूल्यवान समझे जाने का भाव देता है; θεῷ के साथ ‘परमेश्वर की दृष्टि में’ हिन्दी में संबंध को साफ व्यक्त करता है।
- source_word: ἐστήρισαι
  choice: स्थापित की गई हो
  rationale: यह दृढ़ किए या स्थिर रूप से रखे जाने का भाव देता है। कर्मवाच्य अभिव्यक्ति माता की स्थायी स्वर्गीय स्थिति को दर्शाती है, पर उसके ढंग के बारे में अनावश्यक विस्तार नहीं करती।
- source_word: ἐν οὐρανῷ σὺν αὐτοῖς
  choice: उनके साथ स्वर्ग में
  rationale: οὐρανός का अर्थ आकाश या स्वर्ग दोनों हो सकता है। शहीद पुत्रों के साथ माता की अंतिम स्थिति के संदर्भ में ‘स्वर्ग’ उपयुक्त है; वास्तविक भाषिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम वाक्यांश में οὐρανός का अर्थ ‘आकाश’ हो या ‘स्वर्ग’
  choice: स्वर्ग
  alternative: आकाश
  rationale: आरम्भ में दृश्य चन्द्रमा और तारों का आकाश है, जबकि अंतिम कथन माता के अपने शहीद पुत्रों के साथ स्थापित होने की बात करता है। प्रसंग स्वर्गीय सम्मान की ओर संकेत करता है, फिर भी यूनानी शब्द की ‘आकाश’ वाली सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमामय किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। चन्द्रमा, तारे और ज्योति की परस्पर जुड़ी काव्यात्मक छवि सुरक्षित है। मुख्य पाठ में डैश केवल लम्बे कृदन्तीय अंश को स्पष्ट करने के लिए प्रयुक्त हैं। सभी पादटिप्पणी-चिह्न संबंधित अस्पष्ट पदों के ठीक बाद रखे गए हैं।
