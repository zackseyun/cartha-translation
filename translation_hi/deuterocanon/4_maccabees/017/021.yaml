translation:
  language: hi
  text: और अत्याचारी को दण्ड दिया जाए और मातृभूमि को शुद्ध किया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύραννον
  choice: अत्याचारी
  rationale: यहाँ शब्द उस दमनकारी शासक को सूचित करता है जो विश्वासयोग्य लोगों को सताता है। ‘अत्याचारी’ आधुनिक हिन्दी में उसके शासकीय और नैतिक दमन, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τιμωρηθῆναι
  choice: दण्ड दिया जाए
  rationale: अओरिस्ट कर्मवाच्य अनंत रूप को हिन्दी में कर्मवाच्य संभावनार्थक अभिव्यक्ति से रखा गया है; इससे दण्ड पाने का भाव स्पष्ट रहता है।
- source_word: πατρίδα
  choice: मातृभूमि
  rationale: यह शब्द पैतृक या अपनी देशभूमि का बोध कराता है। ‘मातृभूमि’ वर्तमान हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा केवल भौगोलिक क्षेत्र से अधिक सामुदायिक लगाव को भी बनाए रखता है।
- source_word: καθαρισθῆναι
  choice: शुद्ध किया जाए
  rationale: कर्मवाच्य रूप को बनाए रखते हुए यह चयन धार्मिक, नैतिक और सामुदायिक शुद्धि की संभावित व्यापकता को सुरक्षित रखता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दो समानांतर परिणामों को यूनानी पाठ की सरल समन्वयी संरचना के अनुरूप जोड़ा गया है।
theological_decisions:
- issue: मातृभूमि की शुद्धि का आशय
  choice: ‘मातृभूमि को शुद्ध किया जाए’—व्यापक अभिव्यक्ति, जिसमें धार्मिक, नैतिक और सामुदायिक शुद्धि समाहित हो सकती है
  alternative: ‘देश को मलिनता से मुक्त किया जाए’—जो अशुद्धि हटाने पर अधिक बल देता और अर्थ को कुछ संकरा कर देता
  rationale: यूनानी पाठ यह निर्धारित नहीं करता कि शुद्धि केवल धार्मिक, नैतिक अथवा राजनीतिक है; अतः अनुवाद जानबूझकर इस अर्थगत व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और गरिमापूर्ण रखी गई है। पद मूलतः पिछले प्रसंग से जुड़ा वाक्यांश है, इसलिए आरम्भिक ‘और’ सुरक्षित रखा गया है।
