  yaml_path: translation/deuterocanon/4_maccabees/017/018.yaml
  text: For Moses says[b][a], “And all the holy ones are under your hands.”
translation:
  language: hi
  text: क्योंकि मूसा भी कहता है, “और वे सभी जो पवित्र किए गए हैं[a], तेरे हाथों के नीचे हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अलग ठहराए गए जन” अथवा “पवित्र जन।” यूनानी शब्द उन लोगों को दर्शाता है जिन्हें पवित्र किया गया या किसी विशेष उद्देश्य के लिए अलग ठहराया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “तेरे हाथों के नीचे।” यह चित्र परमेश्वर की सामर्थ्य, देखभाल या अधिकार के अधीन होने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि … भी
  rationale: γάρ कथन को पिछले विचार के आधार से जोड़ता है, जबकि καί मूसा की गवाही को अतिरिक्त समर्थन के रूप में प्रस्तुत करता है।
- source_word: φησιν
  choice: कहता है
  rationale: यूनानी वर्तमानकालीन उद्धरण-सूत्र को हिन्दी में स्वाभाविक साहित्यिक वर्तमान के रूप में रखा गया है।
- source_word: οἱ ἡγιασμένοι
  choice: वे सभी जो पवित्र किए गए हैं
  rationale: ἁγιάζω का पूर्ण कर्मवाच्य कृदन्त उन लोगों को दर्शाता है जिन्हें पवित्र किया गया या अलग ठहराया गया है; यह अनुवाद उस कर्मवाच्य और परिणामी अवस्था को स्पष्ट रखता है।
- source_word: ὑπὸ τὰς χεῖράς σου
  choice: तेरे हाथों के नीचे
  rationale: बहुवचन ‘हाथों’ और स्थान-संबंधी रूपक को बिना केवल ‘अधिकार में’ जैसे अर्थ में सीमित किए यथासंभव सीधे रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: मूसा के कथन में परमेश्वर के हाथों के नीचे होने का आशय
  choice: ठोस रूपक ‘तेरे हाथों के नीचे’ को मुख्य पाठ में बनाए रखा गया
  alternative: ‘तेरे अधिकार में’ या ‘तेरी सुरक्षा में’
  rationale: यूनानी वाक्य शक्ति, देखभाल या अधिकार की ओर संकेत कर सकता है, पर इनमें से किसी एक आशय को निश्चित नहीं करता; इसलिए वास्तविक अर्थगत विस्तार को टिप्पणी में रखा गया है।
- issue: ἡγιασμένοι का कर्मवाच्य धार्मिक अर्थ
  choice: ‘पवित्र किए गए’
  alternative: ‘पवित्र जन’ या ‘अलग ठहराए गए जन’
  rationale: यह रूप व्यक्तियों की केवल अंतर्निहित विशेषता नहीं, बल्कि उन्हें पवित्र किए जाने की परिणामी अवस्था व्यक्त करता है; मुख्य अनुवाद इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। परमेश्वर को संबोधित एकवचन ‘तेरे’ मूल के σου को सुरक्षित रखता है और उद्धरण की शास्त्रीय गंभीरता के अनुरूप है। दोनों टिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
