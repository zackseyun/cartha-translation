theological_decisions:
- issue: शहादत के प्रसंग में ἐξεδίκησαν का अर्थ
  choice: उनकी विश्वासयोग्य सहनशीलता ने राष्ट्र को न्याय दिलाया
  alternative: उन्होंने राष्ट्र का बदला लिया; उन्होंने राष्ट्र का पक्ष सही सिद्ध किया
