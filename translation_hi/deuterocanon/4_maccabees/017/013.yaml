translation:
  language: hi
  text: एलिआज़र संघर्ष में अगुवाई कर रहा था[a]; सात पुत्रों की माता खिलाड़ी की तरह प्रतिस्पर्धा कर रही थी; और भाई संघर्ष कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में प्रतियोगिता और संघर्ष से जुड़ी तीन भिन्न क्रियाएँ हैं: एलिआज़र संघर्ष में आगे था या अगुवाई कर रहा था, माता एथलीट की तरह प्रतिस्पर्धा कर रही थी, और भाई संघर्ष कर रहे थे।'
    reason: यूनानी क्रियाओं की साझा प्रतियोगितात्मक छवि तथा उनके अलग-अलग सूक्ष्म अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: προηγωνίζετο
  choice: इस संघर्ष में सबसे आगे होकर लड़ रहा था
  rationale: अपूर्णकालीन क्रिया किसी जारी संघर्ष को दिखाती है, और उपसर्ग προ- एलिआज़र के दूसरों से पहले अथवा उनके आगे होकर जूझने का भाव रखता है। यह अनुवाद अगुवाई और संघर्ष—दोनों को बनाए रखता है।
- source_word: ἐνήθλει
  choice: खिलाड़ी के समान संघर्ष कर रही थी
  rationale: ἀθλέω से बनी यह क्रिया स्पष्ट रूप से खेल-प्रतियोगिता का बिंब रखती है। आधुनिक हिन्दी में क्रियात्मक अर्थ स्पष्ट रखने के लिए ‘खिलाड़ी के समान संघर्ष’ कहा गया है।
- source_word: ἠγωνίζοντο
  choice: संघर्ष कर रहे थे
  rationale: ἀγωνίζομαι प्रतियोगिता, जद्दोजहद या लड़ाई का व्यापक अर्थ दे सकता है। ‘संघर्ष’ शहादत के प्रसंग में वास्तविक युद्ध को अनावश्यक रूप से निश्चित किए बिना उस अर्थ-क्षेत्र को बनाए रखता है।
- source_word: μήτηρ τῶν ἑπτὰ παίδων
  choice: सात पुत्रों की माता
  rationale: παῖδες का अर्थ बच्चे भी हो सकता है, पर कथा के संदर्भ में ये सात पुरुष संतान और परस्पर भाई हैं; इसलिए ‘पुत्रों’ अधिक सटीक है।
- source_word: ἀδελφοὶ
  choice: वे भाई
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है और सात पुरुष भाइयों की ओर संकेत करता है। ‘वे’ से पहले उल्लिखित पुत्रों के साथ संबंध स्पष्ट होता है।
theological_decisions:
- issue: पूरे पद में प्रतियोगिता और संघर्ष के रूपक को बनाए रखना
  choice: तीनों उपवाक्यों में संघर्ष का साझा बिंब रखते हुए अलग-अलग हिन्दी अभिव्यक्तियाँ प्रयोग की गईं
  alternative: इसे केवल ‘धीरज धरना’ या ‘साहस से दुःख सहना’ कहना
  rationale: यूनानी पाठ तीन भिन्न लेकिन परस्पर संबंधित प्रतियोगितात्मक क्रियाओं से शहादत को महान संघर्ष के रूप में चित्रित करता है। सामान्य सहनशीलता की भाषा इस अलंकारिक तनाव को मिटा देती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सहज रखी गई है। ‘माता’ कथा की गंभीरता के अनुकूल है; ‘खिलाड़ी के समान’ यूनानी के खेल-संबंधी रूपक को स्वाभाविक हिन्दी में व्यक्त करता है।
