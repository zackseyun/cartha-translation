lexical_decisions:
- source_word: κυριωτάτη
  choice: सर्वोपरि
  rationale: यह सर्वोच्च प्रभुत्व या प्रधानता का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: φρόνησις
  choice: विवेक
  rationale: यहाँ शब्द व्यावहारिक बुद्धिमत्ता और सही निर्णय की क्षमता को दर्शाता है; ‘विवेक’ इस दार्शनिक संदर्भ में सहज हिन्दी विकल्प है।
- source_word: λογισμός
  choice: बुद्धि
  rationale: इस ग्रंथ में यह विचारशील, तर्कशील मन का बोध कराता है; साधारण पाठक के लिए ‘बुद्धि’ स्पष्ट है।
- source_word: παθῶν
  choice: वासनाओं
  rationale: यह मनुष्य को प्रभावित करने वाली तीव्र इच्छाओं और आवेगों के व्यापक अर्थ को व्यक्त करता है।
- source_word: ἐπικρατεῖ
  choice: अधिकार पाती है
  rationale: मूल में विजय पाकर नियंत्रण या प्रभुत्व स्थापित करने का भाव है; यह चयन उसी सक्रिय अर्थ को बनाए रखता है।
theological_decisions:
- issue: φρόνησις और λογισμός का संबंध
  choice: दोनों को क्रमशः ‘विवेक’ और ‘बुद्धि’ कहकर अलग रखा गया है
  alternative: दोनों को लगभग समानार्थी ‘समझ’ और ‘तर्क’ के रूप में प्रस्तुत करना
  rationale: 'मूल यूनानी दो भिन्न अवधारणाएँ रखता है: विवेक वह प्रधान गुण है जिससे तर्कशील बुद्धि वासनाओं पर अधिकार पाती है; इस भेद को मिटाना उचित नहीं।'
- issue: ἐξ ἧς का आशय
  choice: ‘उसी से’
  alternative: ‘जिससे’ या ‘जिसके कारण’
  rationale: स्त्रीलिंग संबंधवाचक सर्वनाम निकटतम पद φρόνησις की ओर संकेत करता है; कारण अथवा स्रोत का संबंध अनावश्यक रूप से अधिक स्पष्ट किए बिना रखा गया है।
