  text: So then[a], let us examine whether reason is master over the passions.
translation:
  language: hi
  text: तो फिर, आइए जाँच करें कि क्या विवेक मनोवेगों का स्वामी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तर्कशील निर्णय मनोवेगों पर पूर्ण अधिकार रखता है।”
    reason: λoγισμός के ‘तर्कशील निर्णय’ और αὐτοκράτωρ के पूर्ण, स्वतंत्र प्रभुत्व के अधिक तकनीकी दार्शनिक अर्थ को दर्शाने वाला विकल्प।
lexical_decisions:
- source_word: Ζητοῦμεν
  choice: हम इस बात की जाँच करें
  rationale: वर्तमानकालीन प्रथम पुरुष बहुवचन यहाँ विचार-विमर्श के लिए आमंत्रण देता है। यह रूप यूनानी के ‘हम खोजते/पूछते हैं’ की अपेक्षा स्वाभाविक हिन्दी में उसी विवेचनात्मक बल को व्यक्त करता है।
- source_word: δὴ τοίνυν
  choice: तो फिर
  rationale: दोनों अव्यय पिछले कथन से संक्रमण और निष्कर्षात्मक संबंध दिखाते हैं; ‘तो फिर’ आधुनिक हिन्दी में दोनों भाव संक्षेप में रखता है।
- source_word: αὐτοκράτωρ
  choice: स्वामी
  rationale: यह शब्द स्वतंत्र अधिकार और पूर्ण नियंत्रण रखने का भाव देता है। ‘मनोवेगों पर स्वामी’ इस नैतिक-दार्शनिक संदर्भ में प्रभुत्व का अर्थ रखता है, बिना उसे अनावश्यक रूप से राजनीतिक बनाए।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: हेलेनवादी नैतिक विमर्श में πάθη केवल तटस्थ भावनाएँ नहीं, बल्कि मनुष्य को प्रेरित या विचलित करने वाले प्रबल भाव और आवेग हैं। ‘मनोवेग’ इस व्यापक दार्शनिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ λογισμός
  choice: विवेक
  rationale: यहाँ λογισμός विचार करने और उचित निर्णय लेने वाली तर्कशील क्षमता को सूचित करता है। ‘विवेक’ सामान्य पाठक के लिए सुबोध है और केवल ‘मन’ कहने से अधिक सटीक है।
theological_decisions:
- issue: πάθη के संबंध में λογισμός का दार्शनिक-मानवशास्त्रीय अर्थ
  choice: विवेक मनोवेगों पर स्वामी है
  alternative: तर्कशील निर्णय मनोवेगों पर संप्रभु है
  rationale: मुख्य पाठ पुस्तक के केंद्रीय प्रश्न—तर्कशील विवेक का मनोवेगों पर अधिकार—को स्पष्ट रखता है। वैकल्पिक अधिक तकनीकी अभिव्यक्ति पादटिप्पणी में देकर मूल की अर्थ-सीमा सुरक्षित रखी गई है, बिना बाद की धर्मवैज्ञानिक श्रेणियाँ आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और तर्क-विमर्श के अनुकूल है। ‘विवेक’ तथा ‘मनोवेग’ सामान्य बोधगम्यता और दार्शनिक सटीकता के बीच संतुलन रखते हैं।
