translation:
  language: hi
  text: और सुख के अंतर्गत एक दुष्ट प्रवृत्ति भी होती है, जो सभी मनोवेगों में सबसे अधिक बहुरूपी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ... τῇ ἡδονῇ
  choice: सुख के भीतर
  rationale: ἐν के समावेशात्मक अर्थ को रखते हुए यह बताता है कि दुष्ट प्रवृत्ति सुख की श्रेणी या क्षेत्र के भीतर पाई जाती है।
- source_word: κακοήθης διάθεσις
  choice: दुष्ट प्रवृत्ति
  rationale: διάθεσις यहाँ स्वभावगत झुकाव या प्रवृत्ति है, और κακοήθης उसके नैतिक रूप से बुरे चरित्र को व्यक्त करता है।
- source_word: πολυτροπωτάτη
  choice: सबसे अधिक बहुरूपी
  rationale: πολύτροπος का उत्कृष्टतम रूप अनेक ढंग, रूप या चालें धारण करने का भाव देता है; ‘बहुरूपी’ इसकी बहुविधता को बिना सकारात्मक अर्थ जोड़े व्यक्त करता है।
- source_word: πάντων τῶν παθῶν
  choice: सभी मनोवेगों में
  rationale: इस दार्शनिक संदर्भ में πάθη ऐसे भावात्मक आवेग हैं जिन्हें विवेक के अधीन होना चाहिए; ‘मनोवेग’ आधुनिक हिन्दी में इस नैतिक-मनोवैज्ञानिक अर्थ को स्पष्ट रखता है।
- source_word: οὖσα
  choice: जो ... है
  rationale: सम्बन्धवाचक उपवाक्य यूनानी कृदन्त का स्वाभाविक हिन्दी रूप है और वर्णनात्मक सम्बन्ध को बनाए रखता है।
theological_decisions:
- issue: हेलेनिस्टिक यहूदी दार्शनिक संदर्भ में πάθη का अनुवाद
  choice: मनोवेग
  alternative: वासनाएँ; भावनाएँ; मनोविकार
  rationale: ‘मनोवेग’ विवेक द्वारा नियंत्रित किए जाने वाले भावात्मक आवेगों को दर्शाता है। ‘भावनाएँ’ अत्यधिक व्यापक और नैतिक रूप से तटस्थ है, जबकि ‘वासनाएँ’ अर्थ को मुख्यतः कामना तक सीमित कर सकती है और ‘मनोविकार’ रोगात्मक भाव जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और दार्शनिक तर्क के अनुकूल। ‘बहुरूपी’ को ‘बहुमुखी’ पर वरीयता दी गई, क्योंकि ‘बहुमुखी’ अक्सर प्रशंसात्मक सुनाई देता है।
