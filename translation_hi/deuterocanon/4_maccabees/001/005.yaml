base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/005.yaml
  text: How then[a], perhaps some might say, if reason rules over the passions, does it not also master forgetfulness and ignorance? In attempting to say this, they are being ridiculous.
translation:
  language: hi
  text: तो शायद कुछ लोग कहें, “यदि विवेक मनोवेगों पर शासन करता है, तो वह विस्मरण और अज्ञान पर प्रभुत्व क्यों नहीं रखता?” ऐसा कहने का प्रयास करके वे उपहासास्पद बनते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसा कहने का प्रयास करना उपहासास्पद है।” यूनानी वाक्यांश γελοῖον ἐπιχειροῦντες λέγειν को निर्वैयक्तिक रूप में या स्वयं आपत्ति करने वालों के विषय में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς οὖν
  choice: तो ... क्यों
  rationale: यह पद पिछले तर्क से जुड़ी आपत्ति को प्रश्न के रूप में प्रस्तुत करता है; हिंदी में ‘तो ... क्यों’ उसके तार्किक प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἴσως εἴποιεν ἄν τινες
  choice: शायद कुछ लोग कहें
  rationale: ἴσως तथा optative + ἄν संभावित और अनिश्चित आपत्ति सूचित करते हैं; यह हिंदी प्रयोग दोनों भावों को बनाए रखता है।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: यहाँ πάθη बाहरी दुःख नहीं, बल्कि विवेक द्वारा नियंत्रित किए जाने वाले भीतर के आवेगों और प्रबल भावों को सूचित करता है। ‘मनोवेग’ दार्शनिक अर्थ रखते हुए सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट है।
- source_word: ὁ λογισμὸς
  choice: विवेक
  rationale: यह शब्द तर्कपूर्ण विचार और निर्णय की मानवीय क्षमता को सूचित करता है। ‘विवेक’ आधुनिक हिंदी में सहज है और केवल ‘मन’ की अपेक्षा अधिक सटीक है।
- source_word: κρατεῖ
  choice: शासन करता है
  rationale: κρατέω यहाँ प्रभुत्व या नियंत्रण रखने का भाव देता है; ‘शासन करता है’ पुस्तक के नैतिक तर्क की शक्ति बनाए रखता है।
- source_word: λήθης καὶ ἀγνοίας
  choice: भूल और अज्ञान
  rationale: दोनों संज्ञाओं का सीधा और स्वाभाविक हिंदी रूप है; ‘भूल’ स्मृति की विफलता और ‘अज्ञान’ ज्ञान के अभाव को अलग रखता है।
- source_word: οὐ δεσπόζει
  choice: अधिकार क्यों नहीं रखता
  rationale: δεσπόζω प्रभुत्व रखने का प्रबल भाव देता है। प्रश्नवाचक हिंदी रचना में यह स्वाभाविक है और κρατεῖ से शब्दगत भेद भी बनाए रखती है।
- source_word: γελοῖον ἐπιχειροῦντες λέγειν
  choice: ऐसा कहने का प्रयास करके वे उपहासास्पद बनते हैं
  rationale: मुख्य पाठ इसे निहित आपत्तिकर्ताओं से जोड़ता है, पर यूनानी रचना का निर्वैयक्तिक अर्थ भी संभव है; इसलिए वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: 4 मक्काबियों में मानव-स्वभाव संबंधी दार्शनिक शब्दावली
  choice: λογισμός को ‘विवेक’ और πάθη को ‘मनोवेग’
  alternative: ‘तर्क-बुद्धि’ और ‘वासनाएँ’ अथवा ‘भावनाएँ’
  rationale: यह युग्म पुस्तक के उस केंद्रीय तर्क को बनाए रखता है जिसमें तर्कपूर्ण नैतिक निर्णय भीतर के प्रबल आवेगों पर शासन करता है। ‘वासनाएँ’ अर्थ को संकीर्ण कर सकता है और ‘भावनाएँ’ सभी भावों को नकारात्मक ठहराने का आभास दे सकता है।
- issue: γελοῖον और कृदंत रचना का संबंध
  choice: उपहास को निहित आपत्तिकर्ताओं पर लागू करना
  alternative: 'निर्वैयक्तिक रूप से कहना: ‘ऐसा कहने का प्रयास करना उपहासास्पद है’'
  rationale: यूनानी दोनों प्रकार से समझी जा सकती है। मुख्य पाठ व्यक्तिवाचक संबंध को अपनाता है, जबकि वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। दार्शनिक शब्दावली में ‘विवेक’ और ‘मनोवेग’ चुने गए हैं, तथा प्रश्न को हिंदी में स्वाभाविक प्रत्यक्ष कथन के रूप में विरामचिह्नित किया गया है।
