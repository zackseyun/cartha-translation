lexical_decisions:
- source_word: πρὸ
  choice: से पहले
  rationale: यह कालसूचक संबंध व्यक्त करता है और बताता है कि भय पीड़ा से पूर्व होता है।
- source_word: πόνου / τὸν πόνον
  choice: पीड़ा
  rationale: πόνος का अर्थ परिश्रम या कष्ट भी हो सकता है, पर भय से पहले और शोक के बाद की इस सूक्तिपरक क्रमबद्धता में अनुभवगत ‘पीड़ा’ सबसे उपयुक्त है।
- source_word: φόβος
  choice: भय
  rationale: φόβος का सीधा, तटस्थ और स्वाभाविक हिन्दी समतुल्य ‘भय’ है।
- source_word: μετὰ
  choice: के बाद
  rationale: कर्मकारक के साथ इसका प्रयोग यहाँ कालक्रम में बाद की अवस्था बताता है।
- source_word: λύπη
  choice: शोक
  rationale: λύπη दुःख, उदासी या शोक को व्यक्त कर सकता है; यहाँ पीड़ा के भावात्मक परिणाम के लिए ‘शोक’ संक्षिप्त और गरिमापूर्ण है।
