lexical_decisions:
- source_word: ἐπιθυμιῶν
  choice: इच्छाओं
  rationale: यह व्यापक और स्वाभाविक शब्द है, जो यहाँ इच्छाओं के दार्शनिक वर्गीकरण को अनावश्यक रूप से नकारात्मक बनाए बिना व्यक्त करता है।
- source_word: ψυχικαί
  choice: प्राण से जुड़ी
  rationale: यह σωματικαί के साथ मूल मानवशास्त्रीय विरोध को बनाए रखता है और आधुनिक हिन्दी में 'आत्मिक' से उत्पन्न संभावित धार्मिक अर्थारोपण से बचता है।
- source_word: σωματικαί
  choice: शरीर से
  rationale: यह ψυχικαί का स्पष्ट और स्वाभाविक समानांतर है।
- source_word: λογισμός
  choice: विवेक
  rationale: इस ग्रंथ में यह तर्कशील विचार अथवा निर्णय-शक्ति का प्रमुख दार्शनिक पद है; 'विवेक' आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: ἐπικρατεῖ
  choice: प्रभुत्व रखता है
  rationale: यह क्रिया किसी पर प्रभावी रूप से शासन करने, प्रबल होने या नियंत्रण रखने का भाव देती है।
- source_word: φαίνεται
  choice: स्पष्ट रूप से
  rationale: यह उस बात को व्यक्त करता है जो तर्क या निरीक्षण से प्रत्यक्ष सिद्ध होती दिखती है, यद्यपि वैकल्पिक रूप में 'प्रतीत होता है' संभव है।
theological_decisions:
- issue: ψυχικαί और σωματικαί के बीच मानवशास्त्रीय भेद
  choice: कुछ इच्छाएँ 'प्राण से जुड़ी' और कुछ 'शरीर से' हैं
  alternative: कुछ मानसिक और कुछ शारीरिक हैं
  rationale: मूल पाठ के वर्गों को बनाए रखते हुए किसी विकसित आत्मा-शरीर द्वैतवाद को उसमें आरोपित नहीं किया गया।
- issue: λογισμός ἐπικρατεῖ का बल
  choice: विवेक दोनों पर स्पष्ट रूप से प्रभुत्व रखता है
  alternative: विवेक दोनों पर प्रबल होता हुआ दिखाई देता है
  rationale: चुना हुआ पाठ विवेक की शासनकारी श्रेष्ठता व्यक्त करता है; पादटिप्पणी φαίνεται की अधिक प्रतीयमान और ἐπικρατεῖ की अधिक क्रियात्मक व्याख्या सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज दार्शनिक शैली। 'प्राण से जुड़ी' को 'आत्मिक' के स्थान पर चुना गया है, ताकि ψυχικαί को अनावश्यक रूप से धार्मिक अर्थ न दिया जाए।
