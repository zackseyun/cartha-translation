  yaml_path: translation/deuterocanon/4_maccabees/001/015.yaml
  text: Therefore[a], reason is a mind that, with right living, gives preference to the word of wisdom.
translation:
  language: hi
  text: अतः, विवेक वह मन है जो सही जीवन-आचरण के साथ प्रज्ञा के वचन[a] को प्रधानता देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रज्ञा के सिद्धांत’ अथवा ‘प्रज्ञा के विवेचन।’ यूनानी λόγος का अर्थ ‘वचन,’ ‘कथन,’ ‘विवेचन’ या ‘सिद्धांत’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμός
  choice: विवेक
  rationale: यहाँ इस शब्द की दार्शनिक परिभाषा दी जा रही है और इसका आशय सोच-विचार करके निर्णय करने वाली बुद्धि से है। ‘विवेक’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा नैतिक संदर्भ में भी उपयुक्त बैठता है।
- source_word: νοῦς
  choice: मन
  rationale: यह शब्द मानसिक क्षमता या मन-बुद्धि को सूचित करता है। परिभाषात्मक वाक्य में ‘मन’ सबसे सीधा और सहज हिन्दी पर्याय है।
- source_word: μετὰ ὀρθοῦ βίου
  choice: सही जीवन-आचरण के साथ
  rationale: यह पदबंध नैतिक रूप से उचित जीवन और व्यवहार दोनों को जोड़ता है। ‘जीवन-आचरण’ βίος के जीवन-क्रम को व्यक्त करता है, जबकि ‘सही’ ὀρθός की नैतिक दिशा बनाए रखता है।
- source_word: προτιμῶν
  choice: प्रधानता देता है
  rationale: कृदंत किसी वस्तु को दूसरी वस्तुओं से बढ़कर चुनने या मान देने का भाव रखता है। ‘प्रधानता देता है’ इस तुलनात्मक बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν σοφίας λόγον
  choice: प्रज्ञा के वचन
  rationale: λόγος यहाँ वचन, शिक्षा, विवेचन या सिद्धांत का अर्थ दे सकता है। ‘प्रज्ञा के वचन’ यूनानी संरचना और अर्थ की व्यापकता को यथासंभव बनाए रखता है; पादटिप्पणी अन्य संभावनाएँ बताती है।
theological_decisions:
- issue: λόγος को अत्यधिक संकीर्ण दार्शनिक या धर्मशास्त्रीय अर्थ दिए बिना प्रस्तुत करना
  choice: प्रज्ञा के वचन
  alternative: प्रज्ञा का सिद्धांत; प्रज्ञा का विवेचन; प्रज्ञा की शिक्षा
  rationale: इस प्रसंग में λόγος प्रज्ञा की व्यक्त शिक्षा, तर्कपूर्ण विवेचना या मार्गदर्शक सिद्धांत को सूचित कर सकता है। मुख्य पाठ में अपेक्षाकृत खुला ‘वचन’ रखा गया है और अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है, ताकि वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विवेक’ और ‘प्रज्ञा’ दार्शनिक संदर्भ को व्यक्त करते हैं, जबकि ‘सही जीवन-आचरण’ नैतिक जीवन के व्यावहारिक पक्ष को स्पष्ट करता है।
