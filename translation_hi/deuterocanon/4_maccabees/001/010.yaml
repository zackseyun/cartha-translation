base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/010.yaml
  text: Therefore[a], it is incumbent on me to praise the men who, at this time, died with their mother for the sake of nobility and goodness; and, as for honors[b], to pronounce them blessed.
translation:
  language: hi
  text: अतः सद्गुणों के विषय में, उस समय अपनी माता के साथ उदात्तता और भलाई के लिए मर गए पुरुषों की प्रशंसा करना मेरा दायित्व है; और सम्मान[a] के विषय में, उन्हें धन्य ठहराना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम यूनानी पदबंध संक्षिप्त और कुछ कठिन है। इसका अर्थ यह भी हो सकता है: “और उन्हें धन्य कहकर सम्मानित करना।”'
    reason: alternative_reading
lexical_decisions:
- source_word: τῶν μὲν οὖν ἀρετῶν
  choice: इसलिए ... सद्गुणों के लिए
  rationale: μὲν οὖν आगे की बात को पूर्ववर्ती तर्क से जोड़ता है, जबकि τῶν ἀρετῶν प्रशंसा के संबंध अथवा आधार को बताता है। हिंदी में इस संबंध को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐπεστί μοι ἐπαινεῖν
  choice: मेरे लिए यह उचित है कि मैं ... प्रशंसा करूँ
  rationale: ἐπεστί μοι किसी दायित्व या वक्ता पर आए उचित कार्य का भाव देता है। यह अनुवाद औपचारिक स्वर बचाता है, पर अत्यधिक कठोर 'मेरा कर्तव्य है' से बचता है।
- source_word: τοὺς ... ἀποθανόντας ... ἄνδρας
  choice: उन पुरुषों ... जो ... मर गए
  rationale: ἄνδρας का पुरुषवाचक संदर्भ बनाए रखा गया है और कृदंत को स्वाभाविक हिंदी संबंधवाचक उपवाक्य में बदला गया है।
- source_word: κατὰ τοῦτον τὸν καιρόν
  choice: उस समय
  rationale: वाक्यांश चर्चा में आए ऐतिहासिक समय की ओर संकेत करता है; हिंदी में 'उस समय' संदर्भानुकूल और सहज है।
- source_word: ὑπὲρ τῆς καλοκἀγαθίας
  choice: श्रेष्ठता और भलाई की खातिर
  rationale: καλοκἀγαθία में कुलीन/उत्तम चरित्र और नैतिक भलाई का संयुक्त आदर्श है। 'श्रेष्ठता और भलाई' दोनों पहलुओं को सामान्य आधुनिक हिंदी में व्यक्त करता है।
- source_word: μετὰ τῆς μητρός
  choice: अपनी माता के साथ
  rationale: यह उन पुरुषों और उनकी माता के साझा मरण को दर्शाता है। 'अपनी माता' हिंदी में संबंध स्पष्ट करता है।
- source_word: τῶν δὲ τιμῶν μακαρισμῷ ὤν
  choice: और जहाँ तक सम्मान की बात है, उन्हें धन्य कहूँ
  rationale: यूनानी पदबंध संक्षिप्त और व्याकरणतः कठिन है। अनुवाद प्रशंसा के बाद सम्मान के रूप में उन्हें धन्य कहने का संभावित अर्थ रखता है और कठिनाई को पादटिप्पणी में बताता है।
theological_decisions:
- issue: शहादत के प्रसंग में καλοκἀγαθία
  choice: श्रेष्ठता और भलाई
  alternative: सद्गुण; नैतिक उत्कृष्टता
  rationale: संयुक्त नैतिक और सम्मानसूचक अर्थ को बनाए रखा गया है, बिना किसी बाद की तकनीकी धर्मशास्त्रीय धारणा को आरोपित किए।
- issue: ἄνδρας का लिंग-सटीक अनुवाद
  choice: पुरुषों
  alternative: लोगों; जनों
  rationale: मूल पाठ का स्पष्ट पुल्लिंग संदर्भ निष्प्रभावी नहीं किया गया।
- issue: समापन पदबंध का अर्थ
  choice: सम्मान के रूप में उन्हें धन्य कहना
  alternative: उन्हें धन्य कहकर सम्मानित करना
  rationale: पाठ की संक्षिप्तता और संभावित अस्पष्टता को पूर्णतः हल किया हुआ न दिखाकर मुख्य पाठ में एक पठनीय अर्थ और पादटिप्पणी में वैकल्पिक गठन दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, वक्तृता-सुलभ शैली रखी गई है। 'माता', 'सद्गुण', 'श्रेष्ठता' और 'धन्य' जैसे शब्द औपचारिक प्रसंग के अनुरूप हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं।
