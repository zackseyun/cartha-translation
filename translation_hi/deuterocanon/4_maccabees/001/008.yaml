  text: But I could prove this far more from the courage of Eleazar, the seven brothers, and their mother, who died for the sake of virtue.
translation:
  language: hi
  text: परन्तु इसे मैं उन लोगों की वीरता से और भी अधिक सिद्ध कर सकता हूँ जो सद्गुण के लिए मर गए—अर्थात् एलीआज़र, सात भाई और उनकी माता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολὺ δὲ πλέον
  choice: परन्तु ... और भी अधिक
  rationale: तुलनात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है और पिछले तर्क के साथ विरोधात्मक संबंध व्यक्त करता है।
- source_word: ἀποδείξαιμι
  choice: मैं ... सिद्ध कर सकता हूँ
  rationale: संभाव्य विधि के तर्कात्मक आशय को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνδραγαθείας
  choice: वीरता
  rationale: यहाँ एलीआज़र और परिवार की मृत्यु के प्रसंग में साहसपूर्ण उत्कृष्टता का अर्थ है; ‘वीरता’ संक्षिप्त और स्वाभाविक है।
- source_word: ὑπὲρ ἀρετῆς
  choice: सद्गुण के लिए
  rationale: ἀρετή के नैतिक अर्थ को बिना किसी विशिष्ट सांप्रदायिक व्याख्या के सुरक्षित रखता है।
- source_word: ἀποθανόντων
  choice: जो ... मर गए
  rationale: संबंधवाचक कृदन्त को सहज हिन्दी उपवाक्य में व्यक्त करता है।
- source_word: Ἐλεαζάρου τε καὶ ἑπτὰ ἀδελφῶν καὶ τῆς τούτων μητρός
  choice: अर्थात् एलीआज़र, सात भाई और उनकी माता
  rationale: यूनानी सूची और ‘इनकी माता’ के संबंध को स्पष्ट तथा स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: ἀρετή का अर्थ
  choice: सद्गुण
  alternative: धर्मनिष्ठा
  rationale: मूल का व्यापक नैतिक-दार्शनिक अर्थ बनाए रखने और धार्मिक अर्थ को अनावश्यक रूप से संकीर्ण न करने के लिए।
