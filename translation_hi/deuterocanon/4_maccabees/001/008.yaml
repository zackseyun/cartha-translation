  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की तर्कात्मक गति और शहीदों की सूची को स्पष्ट रखने के लिए डैश तथा ‘अर्थात्’ का प्रयोग किया गया है।
