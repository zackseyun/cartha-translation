translation:
  language: hi
  text: 'अतः, सुख और पीड़ा शरीर और आत्मा के दो पौधे हैं, और इन भावावेगों की बहुत-सी उपशाखाएँ हैं:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ οὖν
  choice: इसलिए, जैसे ... वैसे ही
  rationale: οὖν पूर्व तर्क से निष्कर्षात्मक संबंध दिखाता है और καθάπερ तुलना आरम्भ करता है; हिन्दी में ‘जैसे ... वैसे ही’ से तुलना स्पष्ट और स्वाभाविक होती है।
- source_word: τοῦ σώματος καὶ τῆς ψυχῆς
  choice: शरीर और प्राण के
  rationale: यहाँ ψυχή शरीर के साथ मानव के आंतरिक, चेतन पक्ष का द्योतक है। ‘प्राण’ दार्शनिक युग्म को बनाए रखता है और केवल ‘जीवन’ अर्थ तक सीमित नहीं करता।
- source_word: φυτῶν
  choice: अंकुर
  rationale: φυτά मूलतः उगी हुई वनस्पतियों या पौधों को दर्शाता है। ‘अंकुर’ आगे आने वाले παραφυάδες के शाखायुक्त वनस्पति-रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: ἡδονῆς τε καὶ πόνου
  choice: सुख और पीड़ा
  rationale: यह दार्शनिक विवेचन के दो मूल अनुभवों का सीधा और आधुनिक हिन्दी युग्म है।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: इस संदर्भ में πάθη उन भावात्मक आवेगों को सूचित करता है जिन पर विवेक को शासन करना है; ‘मनोवेग’ आधुनिक पाठक के लिए ‘वासनाएँ’ या ‘दुःख’ से अधिक सटीक है।
- source_word: παραφυάδες
  choice: शाखाएँ निकलती हैं
  rationale: शब्द मुख्य पौधे से निकली पार्श्व-वृद्धियों को दर्शाता है। यह चयन वनस्पति-रूपक और सुख-पीड़ा से अन्य मनोवेगों की उत्पत्ति—दोनों को स्पष्ट करता है।
theological_decisions:
- issue: σώματος καὶ ψυχῆς में मानव-संबंधी युग्म
  choice: शरीर और प्राण
  alternative: शरीर और आत्मा
  rationale: ψυχή यहाँ शरीर के विपरीत मानव के आंतरिक या चेतन पक्ष को दर्शाता है, पर पद बाद की व्यवस्थित धर्मशास्त्रीय परिभाषा नहीं देता। ‘प्राण’ उस अर्थ-विस्तार को खुला रखता है, जबकि ‘आत्मा’ अधिक निश्चित पारिभाषिक अर्थ ग्रहण कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अंकुर’ और ‘शाखाएँ निकलती हैं’ पूरे वाक्य में यूनानी वनस्पति-रूपक को बनाए रखते हैं; ‘मनोवेग’ दार्शनिक संदर्भ में πάθη का सहज हिन्दी रूप है।
