  yaml_path: translation/deuterocanon/4_maccabees/001/004.yaml
  text: but it also is shown to rule over the passions that hinder righteousness[a], such as malice, and over the passions that hinder courage—anger, pain, and fear.
translation:
  language: hi
  text: बल्कि यह भी प्रकट होता है कि वह उन मनोवेगों पर प्रभुत्व रखता है जो धार्मिकता[a] में बाधा डालते हैं, जैसे दुर्भावना; और उन मनोवेगों पर भी जो साहस में बाधा डालते हैं—क्रोध, पीड़ा और भय।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय।”
    reason: δικαιοσύνη इस सद्गुण-संदर्भ में ‘न्याय’ भी अर्थ दे सकता है।
lexical_decisions:
- source_word: κυριεύειν
  choice: प्रभुत्व रखता है
  rationale: यह क्रिया नियंत्रण और अधिकार रखने का भाव व्यक्त करती है। ‘प्रभुत्व रखता है’ यूनानी के शासन/वश में रखने के अर्थ को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- source_word: ἀναφαίνεται
  choice: प्रकट होता है
  rationale: यह रूप किसी बात के स्पष्ट या प्रमाणित होकर सामने आने को व्यक्त करता है; तर्कपूर्ण प्रसंग में ‘प्रकट होता है’ स्वाभाविक है।
- source_word: ἐμποδιστικῶν
  choice: में बाधा डालने वाले
  rationale: संबंधवाचक पदबंध आधुनिक हिन्दी में स्वाभाविक ढंग से संबंधित सद्गुण को रोकने का अर्थ व्यक्त करता है।
- source_word: παθῶν
  choice: मनोवेगों
  rationale: दार्शनिक संदर्भ में πάθη बाहरी कष्ट नहीं, बल्कि मन को प्रभावित करने वाले आवेग या भाव हैं। ‘मनोवेग’ इस नैतिक-मनोवैज्ञानिक अर्थ को स्पष्ट रखता है।
- source_word: δικαιοσύνης
  choice: धर्मनिष्ठा
  rationale: δικαιοσύνη यहाँ एक नैतिक सद्गुण है। ‘धर्मनिष्ठा’ को मुख्य पाठ में रखा गया है, जबकि समान रूप से संभव ‘न्याय’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: κακοηθείας
  choice: दुर्भावना
  rationale: यह शब्द बुरे स्वभाव या किसी के प्रति बुरी नीयत को सूचित करता है; ‘दुर्भावना’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: ἀνδρείας
  choice: साहस
  rationale: हेलेनिस्ती सद्गुण-भाषा में यह वीरता या धैर्यपूर्ण साहस का बोध कराता है। ‘साहस’ स्पष्ट है और अनावश्यक लैंगिक अर्थ से बचता है।
- source_word: θυμοῦ
  choice: क्रोध
  rationale: साहस में बाधा डालने वाले मनोवेगों की सूची में इसका नकारात्मक अर्थ ‘क्रोध’ उपयुक्त है।
- source_word: πόνου
  choice: पीड़ा
  rationale: इस नैतिक संदर्भ में शारीरिक या मानसिक कष्ट का सीधा अर्थ ‘पीड़ा’ उपयुक्त है।
- source_word: φόβου
  choice: भय
  rationale: मूल शब्द का सामान्य और प्रसंगानुकूल अर्थ ‘भय’ है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धर्मनिष्ठा
  alternative: न्याय
  rationale: शब्द नैतिक धार्मिकता और न्याय—दोनों अर्थ दे सकता है। मुख्य पाठ में व्यापक नैतिक गुण ‘धर्मनिष्ठा’ रखा गया है और इस दार्शनिक सद्गुण-सूची में संभव ‘न्याय’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की समानांतर यूनानी संरचना को दोनों प्रकार के बाधक मनोवेगों के लिए बनाए रखा गया है; पूर्वपद की ओर संकेत करने वाला ‘वह’ भी मूल की संदर्भ-निर्भरता को सुरक्षित रखता है।
