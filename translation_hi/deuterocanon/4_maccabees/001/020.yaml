  yaml_path: translation/deuterocanon/4_maccabees/001/020.yaml
  text: The two most comprehensive kinds of passions are pleasure and pain[a]; and each of these is by nature also connected with the soul.
translation:
  language: hi
  text: भावावेगों के दो सबसे व्यापक प्रकार हैं—सुख और पीड़ा[a]; और इनमें से प्रत्येक का स्वभावतः आत्मा से भी संबंध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भावावेगों की दो सर्वाधिक व्यापक प्रकृतियाँ हैं—सुख और पीड़ा।” यूनानी भाषा संक्षिप्त है और ‘प्रकार’ के स्थान पर अधिक शाब्दिक रूप से ‘प्रकृतियाँ’ कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παθῶν
  choice: भावावेगों
  rationale: इस दार्शनिक संदर्भ में πάθος केवल दुःख नहीं, बल्कि मन पर प्रभाव डालने वाले आवेगों और अनुभूतियों को सूचित करता है। ‘भावावेग’ इसके नैतिक-मनोवैज्ञानिक अर्थ को व्यक्त करता है।
- source_word: φύσεις
  choice: प्रकार
  rationale: शाब्दिक अर्थ ‘प्रकृतियाँ’ है, पर यहाँ सुख और पीड़ा को भावावेगों की व्यापक श्रेणियों के रूप में वर्गीकृत किया गया है; इसलिए मुख्य पाठ में ‘प्रकार’ अधिक स्वाभाविक है।
- source_word: περιεκτικώταται
  choice: सबसे व्यापक
  rationale: यह श्रेष्ठतम अवस्था वाला रूप उन श्रेणियों को दर्शाता है जिनमें अन्य भावावेग समाहित हो सकते हैं।
- source_word: ἡδονή
  choice: सुख
  rationale: नैतिक और दार्शनिक विवेचन में ἡδονή का सहज और मानक हिन्दी प्रतिशब्द।
- source_word: πόνος
  choice: पीड़ा
  rationale: ἡδονή के विपरीत यहाँ शारीरिक या मानसिक कष्ट का भाव है; ‘पीड़ा’ दोनों आयामों के लिए उपयुक्त है।
- source_word: ἑκάτερον
  choice: इनमें से प्रत्येक
  rationale: पहले बताए गए दोनों—सुख और पीड़ा—की ओर अलग-अलग संकेत करता है।
- source_word: περὶ τὴν ψυχὴν
  choice: आत्मा से भी संबंध
  rationale: शाब्दिक ‘आत्मा के चारों ओर’ हिन्दी में अस्पष्ट होगा। यहाँ वाक्यांश आत्मा के साथ स्वाभाविक संबंध व्यक्त करता है।
- source_word: πέφυκεν
  choice: स्वभावतः
  rationale: φύω का पूर्णकालिक रूप किसी अंतर्निहित प्राकृतिक अवस्था या संबंध को व्यक्त करता है।
theological_decisions:
- issue: ψυχή का मानवशास्त्रीय अर्थ
  choice: आत्मा
  alternative: जीवन; अंतर्मन; स्वयं
  rationale: इस दार्शनिक-मनोवैज्ञानिक प्रसंग में ψυχή केवल जैविक जीवन नहीं, मनुष्य के भीतरी पक्ष को सूचित करती है। ‘आत्मा’ मूल की पारंपरिक व्यापकता बनाए रखता है, बिना इससे आगे कोई विशिष्ट सिद्धान्त आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज दार्शनिक शैली रखी गई है। ‘भावावेग’ तकनीकी अर्थ को बनाए रखते हुए ‘वासनाएँ’ जैसे अधिक नैतिक रूप से आरोपित शब्द से बचता है।
