  yaml_path: translation/deuterocanon/4_maccabees/001/009.yaml
  text: For all these[a], having disregarded the pain even unto death[b], demonstrated that reason rules over the passions.
translation:
  language: hi
  text: क्योंकि इन सबने मृत्यु तक की पीड़ा को तुच्छ समझकर[a] यह दिखा दिया कि विवेक मनोवेगों पर प्रभुत्व रखता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु तक की पीड़ा की उपेक्षा करके।”
    reason: lexical_alternative
  - marker: b
    text: या, “विवेकपूर्ण निर्णय मनोवेगों पर अधिकार रखता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅπαντες ... οὗτοι
  choice: इन सबने
  rationale: यह संयुक्त अभिव्यक्ति पूरे संदर्भित समूह को समेटती है और यूनानी संकेतवाचक सर्वनाम का स्वाभाविक हिन्दी रूप देती है।
- source_word: ἕως θανάτου πόνον
  choice: मृत्यु तक की पीड़ा
  rationale: यह पीड़ा की चरम सीमा को सीधे व्यक्त करता है, पर मूल पाठ से आगे बढ़कर शहादत को स्पष्ट रूप से नहीं जोड़ता।
- source_word: ὑπεριδόντες
  choice: तुच्छ समझकर
  rationale: क्रिया में न केवल अनदेखा करने, बल्कि पीड़ा की शक्ति को अपने ऊपर निर्णायक न मानने का भाव है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐπεδείξαντο
  choice: यह दिखा दिया
  rationale: उनके सहने को लेखक के तर्क के प्रमाण के रूप में प्रस्तुत करता है; सामान्य पाठक के लिए ‘प्रदर्शित किया’ से अधिक सहज है।
- source_word: ὁ λογισμός
  choice: विवेक
  rationale: यह अनुशासित तार्किक निर्णय-क्षमता को व्यक्त करता है और इसे केवल बुद्धि, मन या अंतःकरण तक सीमित नहीं करता।
- source_word: περικρατεῖ
  choice: प्रभुत्व रखता है
  rationale: यह श्रेष्ठ नियंत्रण और अधिकार के प्रबल अर्थ को सुरक्षित रखता है।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: इस दार्शनिक संदर्भ में यह अनियंत्रित भावनात्मक और प्रेरक आवेगों को दर्शाता है; ‘दुःखों’ कहना अर्थ को संदर्भविरुद्ध संकुचित कर देता।
theological_decisions:
- issue: ὁ λογισμός को ऐसी हिन्दी में व्यक्त करना जो पुस्तक के दार्शनिक तर्क को सुरक्षित रखे
  choice: विवेक
  alternative: विवेकपूर्ण निर्णय
  rationale: ‘विवेक’ पठनीय और संक्षिप्त है तथा मनोवेगों को नियंत्रित करने वाली तर्कसंगत निर्णय-शक्ति का बोध कराता है, बिना इसे किसी बाद की विशिष्ट धर्मशास्त्रीय श्रेणी के समान ठहराए।
- issue: ἕως θανάτου πόνον में शहादत के संदर्भ को कितना स्पष्ट किया जाए
  choice: मृत्यु तक की पीड़ा
  alternative: मृत्यु तक पहुँचा देने वाली पीड़ा
  rationale: मूल वाक्य पीड़ा की चरम सीमा बताता है, लेकिन इस खंड में शहादत शब्द का प्रयोग नहीं करता; इसलिए संदर्भ को अपना काम करने दिया गया है।
- issue: ὑπεριδόντες में उपेक्षा और तिरस्कार के बीच अर्थ-संतुलन
  choice: तुच्छ समझकर
  alternative: उपेक्षा करके
  rationale: चुना हुआ रूप पीड़ा को नगण्य मानने की रूपकात्मक शक्ति बनाए रखता है; पादटिप्पणी अधिक तटस्थ विकल्प देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘विवेक’, ‘मनोवेग’ और ‘प्रभुत्व’ पुस्तक के दार्शनिक तर्क की गंभीरता बनाए रखते हैं, जबकि वाक्य-रचना सामान्य पाठक के लिए स्पष्ट है। पादटिप्पणी-चिह्न उन्हीं पदबंधों के बाद रखे गए हैं जिनके वैकल्पिक अनुवाद दिए गए हैं।
