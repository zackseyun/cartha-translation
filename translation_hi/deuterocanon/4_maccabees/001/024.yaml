lexical_decisions:
- source_word: θυμός
  choice: क्रोध
  rationale: संदर्भ में यह तीव्र भावावेग, विशेषतः क्रोध, को दर्शाता है; ‘क्रोध’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: κοινὸν πάθος
  choice: दोनों से जुड़ा हुआ मनोभाव
  rationale: κοινόν यहाँ सुख और पीड़ा के साथ साझा संबंध व्यक्त करता है, जबकि πάθος मन पर घटित होने वाले भाव या आवेग को; यह अनुवाद ‘साझा’ की कृत्रिमता से बचते हुए अर्थ बनाए रखता है।
- source_word: ἡδονῆς καὶ πόνου
  choice: सुख और पीड़ा
  rationale: ἡδονή के लिए ‘सुख’ और πόνος के लिए ‘पीड़ा’ सामान्य, सटीक और प्रसंगानुकूल हिन्दी शब्द हैं।
- source_word: ἐννοηθῇ
  choice: विचार करे
  rationale: यह ध्यानपूर्वक मन में लाने या सोचने का भाव देता है; ‘विचार करे’ सहज हिन्दी है।
- source_word: περιέπεσεν
  choice: आ घेरा था
  rationale: क्रिया का शाब्दिक भाव किसी पर आ पड़ने या उसे घेर लेने का है; ‘आ घेरा’ क्रोध के अचानक व्यक्ति पर छा जाने की छवि सुरक्षित रखता है।
theological_decisions:
- issue: क्रोध का सुख और पीड़ा से संबंध
  choice: ‘दोनों से जुड़ा हुआ’ कहकर संबंध को खुला रखा गया है
  alternative: ‘सुख और पीड़ा में समान रूप से पाया जाने वाला’
  rationale: यूनानी वाक्य संबंध की सटीक मनोवैज्ञानिक प्रकृति नहीं बताता; इसलिए अनुवाद उसे कारण, परिणाम या नैतिक दोष के रूप में निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में दार्शनिक किंतु सामान्य पाठक के लिए बोधगम्य शैली। वाक्य की शर्तसूचक संरचना और मूल की मनोवैज्ञानिक अस्पष्टता सुरक्षित रखी गई है।
