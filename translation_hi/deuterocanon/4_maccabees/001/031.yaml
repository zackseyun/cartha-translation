- source_word: δὴ τοίνυν
  choice: इसलिए
  rationale: ये दोनों अव्यय पिछले विवेचन से निष्कर्ष की ओर संक्रमण दिखाते हैं; ‘इसलिए’ इस तार्किक संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐστὶν
  choice: का अर्थ है
  rationale: शाब्दिक ‘है’ संभव है, पर परिभाषात्मक वाक्य में ‘का अर्थ है’ अधिक स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: ἐπικράτεια
  choice: अधिकार
  rationale: यह शब्द किसी वस्तु पर प्रभुत्व या नियंत्रण रखने का भाव देता है। ‘अधिकार’ इच्छाओं पर प्रभावी शासन को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῶν ἐπιθυμιῶν
  choice: इच्छाओं पर
  rationale: ἐπιθυμίαι का यहाँ व्यापक नैतिक अर्थ ‘इच्छाएँ’ है; सम्बन्धकारक को हिन्दी में ‘पर’ के साथ व्यक्त करना ἐπικράτεια के शासनात्मक भाव के अनुकूल है।
