base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/011.yaml
  text: For those men became even more admirable[a], not only to all people for their courage and endurance, but also to those who tortured them; they became the cause of the overthrow of the tyranny against the nation, having conquered the tyrant by endurance[b], so that through them the fatherland was purified.
translation:
  language: hi
  text: क्योंकि वे लोग अपने साहस और धीरज के कारण न केवल सब लोगों की दृष्टि में, बल्कि उन्हें यातना देने वालों की दृष्टि में भी अधिक प्रशंसनीय हो गए। वे इस राष्ट्र के विरुद्ध की तानाशाही के पतन का कारण बने; उन्होंने धीरज के द्वारा तानाशाह को पराजित किया, जिससे उनके द्वारा मातृभूमि शुद्ध हुई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शुद्ध हुई” का अनुवाद “शुद्ध की गई” या “स्वच्छ की गई” भी हो सकता है। इसमें नैतिक, धार्मिक या राष्ट्रीय पुनर्स्थापना की अनुगूँज संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: θαυμαστότεροι
  choice: और अधिक प्रशंसनीय
  rationale: तुलनात्मक अर्थ को बनाए रखते हुए नैतिक सराहना का भाव व्यक्त करता है; ‘अधिक अद्भुत’ की अपेक्षा प्रसंग में अधिक स्वाभाविक है।
- source_word: ἀνδρίᾳ
  choice: साहस
  rationale: यहाँ शब्द वीरता को सूचित करता है; आधुनिक हिन्दी में ‘साहस’ स्पष्ट और अनावश्यक रूप से लिंग-सूचक नहीं है।
- source_word: ὑπομονῇ
  choice: धीरज
  rationale: पीड़ा के बीच दृढ़ बने रहने का भाव देता है और दोनों प्रयोगों में समान रूप से स्वाभाविक है।
- source_word: αἰκισαμένων
  choice: उन्हें यातना देनेवालों
  rationale: कृदन्त में निहित क्रूर दुर्व्यवहार को स्पष्ट करता है, बिना हिंसा की तीव्रता घटाए।
- source_word: αἴτιοι κατέστησαν
  choice: कारण बने
  rationale: यूनानी मुहावरे की कारणात्मक भूमिका को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καταλυθῆναι
  choice: अंत
  rationale: अत्याचारी शासन को समाप्त कर दिए जाने का भाव देता है; हिन्दी में ‘अत्याचार का अंत’ राजनीतिक और नैतिक दोनों संदर्भों में सहज है।
- source_word: τὴν κατὰ τοῦ ἔθνους τυραννίδα
  choice: उस अत्याचार ... जो इस जाति के विरुद्ध था
  rationale: ἔθνος को संदर्भानुसार ‘जाति’ और τυραννίς को दमनकारी शासन के अर्थ में ‘अत्याचार’ दिया गया है।
- source_word: νικήσαντες τὸν τύραννον
  choice: उन्होंने ... अत्याचारी को पराजित किया
  rationale: विजय के प्रबल रूपक को सुरक्षित रखता है और हिन्दी में कर्ता तथा साधन को स्पष्ट करता है।
- source_word: ὥστε καθαρσθῆναι
  choice: जिसके परिणामस्वरूप ... शुद्ध हुई
  rationale: ὥστε के परिणामार्थक बल और καθαρσθῆναι के नैतिक, धार्मिक अथवा पुनर्स्थापनात्मक खुले अर्थ को बनाए रखता है।
- source_word: πατρίδα
  choice: मातृभूमि
  rationale: πατρίς की जन्मभूमि/स्वदेश की धारणा तथा पद की उन्नत आलंकारिक शैली को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पीड़ितों के द्वारा मातृभूमि के शुद्ध होने का अर्थ
  choice: ‘उनके द्वारा मातृभूमि शुद्ध हुई’ कहकर लेखक के कारणात्मक तथा शुद्धिकरण-संबंधी दावे को बनाए रखा गया है।
  alternative: इसे केवल राजनीतिक मुक्ति, केवल नैतिक या अनुष्ठानिक शुद्धि, अथवा स्पष्ट प्रायश्चित्त-सिद्धान्त के रूप में समझना।
  rationale: καθαρσθῆναι में शुद्ध किए जाने का व्यापक अर्थ है। पद स्वयं इसके तंत्र को निश्चित नहीं करता, इसलिए अनुवाद राजनीतिक पुनर्स्थापना और धार्मिक-नैतिक अनुगूँज के बीच का तनाव खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मातृभूमि’ मूल के उन्नत वक्तृत्वपूर्ण स्वर को बनाए रखता है। लंबे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है, पर तर्क और कारण-परिणाम संबंध सुरक्षित हैं।
