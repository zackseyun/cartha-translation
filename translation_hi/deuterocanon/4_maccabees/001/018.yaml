  text: And the forms of wisdom are prudence and justice and courage and self-control[a].
translation:
  language: hi
  text: 'और बुद्धि के रूप हैं: विवेक, न्याय[a], साहस और आत्म-संयम।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धार्मिकता’। यहाँ सद्गुणों की सूची है, इसलिए ‘न्याय’ को मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴδεα
  choice: रूप
  rationale: यहाँ εἴδεα बुद्धि के उन घटक रूपों या प्रकारों को दर्शाता है जिनमें वह प्रकट होती है। ‘रूप’ यूनानी के निकट रहते हुए हिन्दी में स्वाभाविक है।
- source_word: καθεστᾶσιν
  choice: हैं
  rationale: इस सूची-वाक्य में क्रिया स्थापित पहचान या गठन बताती है; हिन्दी की सहज योजक क्रिया ‘हैं’ इसका पर्याप्त और स्वाभाविक अनुवाद है।
- source_word: φρόνησις
  choice: विवेक
  rationale: दार्शनिक सद्गुणों की सूची में φρόνησις व्यावहारिक और समझदार निर्णय-क्षमता को दर्शाता है। ‘विवेक’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और सुबोध है।
- source_word: δικαιοσύνη
  choice: न्याय
  rationale: यहाँ शब्द यूनानी दार्शनिक सद्गुण-सूची में है, इसलिए ‘धार्मिकता’ की अपेक्षा ‘न्याय’ उसके नैतिक-सामाजिक अर्थ को अधिक ठीक व्यक्त करता है।
- source_word: ἀνδρία
  choice: साहस
  rationale: ἀνδρία दृढ़ता और वीरता के सद्गुण का नाम है। ‘साहस’ आधुनिक हिन्दी में स्पष्ट है और शब्द की व्युत्पत्ति का भ्रामक लिंग-विशेष अर्थ नहीं लाता।
- source_word: σωφροσύνη
  choice: आत्म-संयम
  rationale: यह शब्द इच्छाओं और आचरण पर अनुशासित नियंत्रण के सद्गुण को व्यक्त करता है; ‘आत्म-संयम’ वर्तमान हिन्दी में सहज और सटीक है।
theological_decisions:
- issue: दार्शनिक सद्गुण-सूची में δικαιοσύνη का अनुवाद
  choice: न्याय
  alternative: धार्मिकता
  rationale: निकट संदर्भ चार प्रमुख सद्गुणों की सूची है, न कि विशेष रूप से वाचा या धार्मिक स्थिति की चर्चा। इसलिए ‘न्याय’ मुख्य पाठ में उपयुक्त है, जबकि व्यापक बाइबलीय अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। दार्शनिक सद्गुण-सूची की औपचारिकता बनाए रखने के लिए समानांतर संज्ञाओं और स्पष्ट विराम-चिह्न का प्रयोग किया गया है।
