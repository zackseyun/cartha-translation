base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/033.yaml
  text: For why is it that[a], when we are moved toward the forbidden foods, we turn away from the pleasures that come from them? Is it not because reason is able to prevail over desires? I think so.
translation:
  language: hi
  text: क्योंकि जब हम वर्जित भोजनों की ओर खिंचते हैं, तो उनसे मिलने वाले सुखों से मुँह क्यों मोड़ लेते हैं? क्या इसलिए नहीं कि विवेक लालसाओं[a] को वश में कर सकता है? मेरा तो यही मानना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भोजन की लालसाएँ’; यहाँ यूनानी शब्द शारीरिक चाह, विशेषकर भोजन की तीव्र चाह, पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ πόθεν
  choice: क्योंकि ... क्यों
  rationale: ἐπεὶ पिछले तर्क से व्याख्यात्मक संबंध जोड़ता है और πόθεν अलंकारिक प्रश्न उठाता है। हिंदी में विभाजित रचना ‘क्योंकि ... क्यों’ दोनों बलों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: κινούμενοι πρὸς
  choice: की ओर खिंचते हैं
  rationale: यह भीतर से उत्पन्न झुकाव या प्रेरणा को दर्शाता है; ‘खिंचते हैं’ निष्क्रिय/मध्यवाच्य भाव और आकर्षण दोनों को सहज हिंदी में बनाए रखता है।
- source_word: τὰς ἀπειρημένας τροφάς
  choice: वर्जित भोजनों
  rationale: ἀπειρημένας का अर्थ निषिद्ध या मना किया हुआ है और τροφάς यहाँ खाने की वस्तुओं को सूचित करता है। ‘वर्जित भोजन’ संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: ἀποτρεπόμεθα
  choice: मुँह मोड़ लेते हैं
  rationale: क्रिया किसी वस्तु से अपने को फेर लेने का चित्र प्रस्तुत करती है। यह हिंदी मुहावरा उस चित्र और स्वैच्छिक विरति को बनाए रखता है।
- source_word: τὰς ἐξ αὐτῶν ἡδονάς
  choice: उनसे मिलनेवाले सुखों
  rationale: वाक्यांश उन भोजनों से उत्पन्न आनंद को बताता है; चुना हुआ रूप संबंध को बिना अनावश्यक व्याख्या के स्पष्ट करता है।
- source_word: ὁ λογισμός
  choice: विवेक
  rationale: इस ग्रंथ में λογισμός उस विचारशील, निर्णयकारी क्षमता को दर्शाता है जो इच्छाओं पर शासन कर सकती है। ‘विवेक’ साधारण आधुनिक हिंदी में स्वाभाविक है और केवल औपचारिक तर्क तक अर्थ को सीमित नहीं करता।
- source_word: τῶν ὀρέξεων ἐπικρατεῖν
  choice: लालसाओं को वश में कर सकता है
  rationale: ἐπικρατεῖν का भाव अधिक शक्तिशाली होकर नियंत्रण करने का है और ὀρέξεις इच्छाओं, विशेषतः शारीरिक भूख या चाह, को दर्शाता है। यह अनुवाद कथन की शासन-संबंधी शक्ति को स्वाभाविक हिंदी में रखता है।
- source_word: ἐγὼ μὲν οἶμαι
  choice: मेरा तो यही मानना है
  rationale: μὲν के व्यक्तिगत बल और वक्ता की संयत किन्तु सकारात्मक सहमति को यह रूप सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: 4 मकाबियों में λογισμός का दार्शनिक-मानवशास्त्रीय अर्थ
  choice: विवेक
  alternative: तर्क-बुद्धि
  rationale: यहाँ बात मनुष्य की उस विचारशील क्षमता की है जो शारीरिक लालसाओं को नियंत्रित कर सकती है। ‘विवेक’ इस दावे को स्पष्ट रखता है, पर बाद की किसी विशिष्ट धार्मिक या दार्शनिक प्रणाली को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। अलंकारिक प्रश्न, आकर्षण से दूर होने का चित्र और विवेक तथा लालसा के बीच मूल दार्शनिक तनाव सुरक्षित हैं।
