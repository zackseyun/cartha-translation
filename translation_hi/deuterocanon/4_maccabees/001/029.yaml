  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु बोधगम्य शैली रखी गई है। दुर्लभ πανεγώργος के लिए जानबूझकर कुछ असामान्य ‘सर्वकार्यकारी’ चुना गया और पादटिप्पणी में सहज विकल्प दिया गया। स्त्रीलिंग क्रिया ‘करती है’ ‘विवेक-बुद्धि’ के अनुसार है। मुख्य वाक्य में यूनानी की संचयी कृदन्त-श्रृंखला और ‘कच्ची सामग्री’ का रूपक सुरक्षित रखा गया है।
