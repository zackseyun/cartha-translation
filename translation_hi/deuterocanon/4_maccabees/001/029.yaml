translation:
  language: hi
  text: इनमें से प्रत्येक—सर्वकार्यकारी विवेक-बुद्धि—अच्छी तरह शुद्ध करके, छाँटकर, गूँथकर, सींचकर और हर प्रकार से नया रूप देकर, स्वभावों और मनोवेगों की कच्ची सामग्री को वश में करती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν ἕκαστος
  choice: इनमें से प्रत्येक को
  rationale: यह पद पहले कही गई बातों की ओर लौटता है और ἕκαστος के वितरणात्मक भाव को बनाए रखता है। हिन्दी में आरम्भिक कर्म को स्पष्ट करने के लिए ‘को’ लगाया गया है।
- source_word: ὁ πανεγώργος λογισμός
  choice: सर्वकार्यकारी विवेक-बुद्धि
  rationale: λογισμός पुस्तक की मुख्य संकल्पना है—वह तर्कशील, निर्णयकारी बुद्धि जो मनोवेगों को नियंत्रित करती है। दुर्लभ πανεγώργος उसकी सर्वांगीण सक्रियता और प्रभावशीलता पर बल देता है; ‘सर्वकार्यकारी’ उसी असामान्य सक्रिय भाव को सुरक्षित रखता है।
- source_word: περικαθαίρων
  choice: पूरी तरह शुद्ध करके
  rationale: περι- क्रिया की व्यापकता या पूर्णता को तीव्र करता है; यह चयन समग्र शुद्धीकरण का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποκνίζων
  choice: छाँटकर
  rationale: दुर्लभ क्रिया अनावश्यक या खुरदरे अंश को काटकर अथवा खुरचकर हटाने का संकेत देती है। ‘छाँटना’ विनाश के बजाय चुनकर हटाने और सँवारने का भाव देता है।
- source_word: περιπλέκων
  choice: गूँथकर
  rationale: क्रिया लपेटने, परस्पर बुनने या गूँथने की कारीगरी-संबंधी छवि रखती है; ‘गूँथना’ हिन्दी में उस रूपाकार देने वाली छवि को बनाए रखता है।
- source_word: ἐπάρδων
  choice: ऊपर उठाकर
  rationale: यह क्रम में उन्नत करने या उठाने की क्रिया जोड़ता है। ‘ऊपर उठाकर’ संभावित रूपक को किसी अमूर्त आध्यात्मिक अर्थ में सीमित नहीं करता।
- source_word: πάντα τρόπον μεταχέων
  choice: हर प्रकार से नया रूप देकर
  rationale: μεταχέω पुनः ढालने या रूप बदलने की कारीगरी-संबंधी छवि रखता है; यह अनुवाद व्यापक परिवर्तन और सामग्री को नया आकार देने—दोनों भावों को व्यक्त करता है।
- source_word: ἐξημεροῖ
  choice: वश में करती है
  rationale: क्रिया जंगली या उग्र वस्तु को पालतू, सौम्य अथवा सभ्य बनाने का अर्थ रखती है। यहाँ ‘वश में करना’ अनियंत्रित भीतरी प्रवृत्तियों पर विवेक-बुद्धि के नियंत्रण को स्पष्ट करता है।
- source_word: τὰς τῶν ἠθῶν καὶ παθῶν ὕλας
  choice: चरित्र और मनोवेगों की कच्ची सामग्री
  rationale: ὕλη मूलतः लकड़ी, पदार्थ या रूप दिए जाने योग्य सामग्री है; ‘कच्ची सामग्री’ इस रूपक को स्पष्ट रखती है। ἤθη नैतिक स्वभाव अथवा चरित्र और πάθη भीतरी भावात्मक आवेगों को दर्शाते हैं; ‘मनोवेग’ बाहरी दुःखों वाला अर्थ लेने से बचाता है।
theological_decisions:
- issue: 4 मकाबियों के दार्शनिक-धार्मिक तर्क में λογισμός का अनुवाद
  choice: विवेक-बुद्धि
  alternative: तर्क-बुद्धि; विवेक; विचारशील मन
  rationale: यहाँ शब्द केवल तार्किक प्रक्रिया नहीं, बल्कि भक्ति के अनुरूप मनोवेगों पर शासन करने वाली निर्णयकारी बुद्धि को दर्शाता है। ‘विवेक-बुद्धि’ सामान्य पाठक के लिए बोधगम्य रहते हुए इस व्यापक भूमिका को सुरक्षित रखती है।
- issue: πάθη का अर्थ
  choice: मनोवेग
  alternative: भावनाएँ; वासनाएँ; दुःख
  rationale: इस प्रसंग में πάθη बाहरी कष्ट नहीं, बल्कि बुद्धि द्वारा साधे जाने वाले भीतरी भावात्मक आवेग हैं। ‘मनोवेग’ उन्हें केवल पापमय वासनाओं तक सीमित नहीं करता।
- issue: विवेक-बुद्धि द्वारा भीतरी सामग्री को साधने की छवि
  choice: कारीगरी और वशीकरण की मिली-जुली रूपक-श्रृंखला बनाए रखना
  alternative: इसे सामान्य रूप से ‘चरित्र सुधारती है’ कहना
  rationale: यूनानी पाठ जानबूझकर कई क्रियाओं को एकत्र करता है और अंत में ἐξημεροῖ कहता है। रूपकों को समतल कर देना लेखक के दार्शनिक तनाव और विवेक-बुद्धि की सक्रिय भूमिका को घटा देता।
