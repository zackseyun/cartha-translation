base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/034.yaml
  text: Therefore[a], though we desire creatures from the water, birds[b], and four-footed animals—all kinds of food forbidden to us by the law—we abstain because of the mastery of reason.
translation:
  language: hi
  text: इसलिए, यद्यपि हमें जलचरों[a], पक्षियों, चौपायों और व्यवस्था के अनुसार हमारे लिए वर्जित हर प्रकार के भोजन की इच्छा होती है, फिर भी हम विवेक के प्रभुत्व[b] के कारण उनसे परहेज़ करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पानी में रहने वाले जीव’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘विवेक की प्रबलता/सर्वोच्चता’। यहाँ विवेक से आशय व्यवस्था द्वारा अनुशासित उस बुद्धि से है जो शारीरिक इच्छाओं पर शासन करती है।
    reason: lexical_and_contextual_clarification
lexical_decisions:
- source_word: τοιγαροῦν
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले तर्क से निकलने वाला परिणाम बताता है; ‘इसलिए’ आधुनिक हिन्दी में इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: ἐνύδρων
  choice: जलचरों
  rationale: यह शब्द पानी में रहने वाले जीवों को व्यापक रूप से दर्शाता है; ‘जलचर’ मछलियों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐπιθυμοῦντες
  choice: इच्छा होने पर भी
  rationale: कृदन्त वास्तविक इच्छा को व्यक्त करता है, पर मुख्य क्रिया ‘परहेज़ करते हैं’ के संदर्भ में इसका भाव रियायती है; हिन्दी में ‘होने पर भी’ इस तनाव को स्पष्ट रखता है।
- source_word: ὀρνέων
  choice: पक्षियों
  rationale: सामान्य यूनानी शब्द के लिए यह सहज, आधुनिक और व्यापक हिन्दी पद है।
- source_word: τετραπόδων
  choice: चौपायों
  rationale: यह यूनानी के ‘चार पैरों वाले प्राणी’ के चित्र को संक्षिप्त और प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: παντοίων βρωμάτων
  choice: हर प्रकार के उस भोजन
  rationale: यह वाक्यांश निषिद्ध खाद्य वस्तुओं की व्यापकता बताता है और पहले गिनाए गए जीवों को भोजन के रूप में स्पष्ट करता है।
- source_word: τῶν ἀπηγορευμένων ἡμῖν κατὰ τὸν νόμον
  choice: जो व्यवस्था के अनुसार हमारे लिए वर्जित है
  rationale: ‘के अनुसार’ κατὰ का संबंध बनाए रखता है और ‘व्यवस्था’ बाइबलीय विधान के लिए स्वाभाविक हिन्दी पद है।
- source_word: ἀπέχομεθα
  choice: हम ... उनसे परहेज़ करते हैं
  rationale: यह भोजन के संदर्भ में जान-बूझकर न ग्रहण करने या दूर रहने का स्वाभाविक हिन्दी रूप है।
- source_word: διὰ τὴν τοῦ λογισμοῦ ἐπικράτειαν
  choice: विवेक के प्रभुत्व के कारण
  rationale: यह वाक्यांश विवेकपूर्ण बुद्धि की इच्छाओं पर शासन करने वाली शक्ति को व्यक्त करता है और पुस्तक के केंद्रीय विषय को बनाए रखता है।
theological_decisions:
- issue: 4 मकाबियों के दार्शनिक-धार्मिक तर्क में λόγισμος का अर्थ
  choice: विवेक
  alternative: तर्क-बुद्धि; विवेकपूर्ण निर्णय; बुद्धि
  rationale: यहाँ λόγισμος केवल सोचने की क्षमता नहीं, बल्कि व्यवस्था से अनुशासित वह विवेकपूर्ण बुद्धि है जो कामनाओं पर शासन करती है। ‘विवेक’ मुख्य पाठ में संक्षिप्त और सुबोध है; पादटिप्पणी इसके व्यापक संदर्भ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मुख्य वाक्य में यूनानी की लंबी संबंधसूचक रचना को डैश के भीतर स्पष्टीकरण देकर स्वाभाविक हिन्दी क्रम में रखा गया है। ‘व्यवस्था’ बाइबलीय νόμος के लिए और ‘विवेक’ पुस्तक के प्रमुख दार्शनिक पद λόγισμος के लिए चुना गया है।
