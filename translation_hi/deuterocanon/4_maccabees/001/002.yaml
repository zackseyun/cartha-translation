  yaml_path: translation/deuterocanon/4_maccabees/001/002.yaml
  text: For the discourse is indeed necessary for understanding[b][a], and it contains praise of the greatest virtue—I mean prudence.
translation:
  language: hi
  text: क्योंकि यह विवेचन ज्ञान के लिए सचमुच आवश्यक है, और यह उस सबसे महान सद्गुण—अर्थात् विवेकपूर्ण बुद्धि—के योग्य है तथा उसकी प्रशंसा समेटे हुए है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझ के लिए।” यूनानी εἰς ἐπιστήμην का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “व्यावहारिक बुद्धि।” यूनानी φρόνησις नैतिक मामलों में विवेकपूर्ण निर्णय करने की क्षमता को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖος
  choice: आवश्यक
  rationale: यह शब्द केवल उपयोगिता नहीं, बल्कि आवश्यकता व्यक्त करता है; ‘आवश्यक’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: εἰς ἐπιστήμην
  choice: ज्ञान प्राप्त करने के लिए
  rationale: ἐπιστήμη अनुशासित ज्ञान या समझ को सूचित कर सकता है। ‘ज्ञान प्राप्त करने के लिए’ प्रयोजन का भाव स्पष्ट रखता है, जबकि ‘समझ के लिए’ भी सम्भव है।
- source_word: λόγος
  choice: विवेचन
  rationale: यहाँ λόγος किसी एक शब्द को नहीं, बल्कि तर्कपूर्ण और क्रमबद्ध चर्चा को दर्शाता है; ‘विवेचन’ उस दार्शनिक-साहित्यिक संदर्भ के अनुकूल है।
- source_word: τῆς μεγίστης ἀρετῆς
  choice: सबसे महान सद्गुण
  rationale: ἀρετή यहाँ नैतिक-दार्शनिक अर्थ में गुण या उत्कृष्टता है। ‘सद्गुण’ लेखक की नैतिक शब्दावली को सहज हिन्दी में बनाए रखता है।
- source_word: φρονήσεως
  choice: विवेक-बुद्धि
  rationale: φρόνησις नैतिक परिस्थितियों में उचित निर्णय करने वाली व्यावहारिक बुद्धि को दर्शाता है। ‘विवेक-बुद्धि’ उसके बौद्धिक और नैतिक दोनों पक्षों को व्यक्त करती है।
- source_word: περιέχει ἔπαινον
  choice: प्रशंसा भी समाई हुई है
  rationale: यह पदबंध बताता है कि विवेचन में उक्त सद्गुण की प्रशंसा सम्मिलित है। यह हिन्दी प्रयोग मूल के ‘अपने भीतर रखने’ के रूपक को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: दार्शनिक सद्गुण-संबंधी शब्दावली को बाद की सिद्धान्तगत श्रेणियों से बचाकर प्रस्तुत करना
  choice: ἀρετή के लिए ‘सद्गुण’ और φρόνησις के लिए ‘विवेक-बुद्धि’
  alternative: ‘उत्कृष्टता’ और ‘व्यावहारिक बुद्धि’
  rationale: इस अंश का स्वर नैतिक-दर्शन का है। चुने गए शब्द उस वैचारिक संदर्भ को बनाए रखते हैं और किसी विशिष्ट सम्प्रदायगत शिक्षा को आरोपित नहीं करते।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘विवेचन’, ‘सद्गुण’ और ‘विवेक-बुद्धि’ आरम्भिक दार्शनिक स्वर को बनाए रखते हैं।
