base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/035.yaml
  text: For the passions of desires are held in check[a], being turned back by the self-controlled mind; and all the body's impulses are governed by reason.
translation:
  language: hi
  text: क्योंकि इच्छाओं के आवेग संयमी मन द्वारा पीछे मोड़े जाकर रोके जाते हैं; और शरीर की सारी प्रवृत्तियाँ विवेक द्वारा सम्मान पाने की आकांक्षा की ओर उन्मुख की जाती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शरीर की सारी प्रवृत्तियाँ विवेक द्वारा नियंत्रित होती हैं।” यहाँ प्रयुक्त यूनानी क्रिया असामान्य है और उसमें सम्मान चाहने या उत्साह से किसी लक्ष्य की आकांक्षा करने का भाव है।
    reason: φιλοτιμοῦνται के सम्मान/आकांक्षा-संबंधी शाब्दिक अर्थ और प्रसंगगत ‘नियमन’ के अर्थ के बीच वास्तविक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀντέχεται
  choice: काबू में रखे जाते हैं
  rationale: यह क्रिया विरोध करने, रोकने या नियंत्रण में रखने का भाव देती है। यहाँ विनाश नहीं, बल्कि संयमी मन द्वारा आवेगों को वश में रखने की बात है।
- source_word: τὰ τῶν ὀρέξεων πάθη
  choice: इच्छाओं से उठने वाले प्रबल आवेग
  rationale: πάθη नैतिक मनोविज्ञान में तीव्र भावनात्मक आवेगों को और ὀρέξεις इच्छाओं या लालसाओं को सूचित करता है। यह स्वाभाविक हिन्दी ग्रीक के दोनों स्तरों को यथासंभव बनाए रखती है।
- source_word: σώφρονος νοὸς
  choice: संयमी मन
  rationale: σώφρων में आत्म-संयम और स्वस्थ समझ दोनों निहित हैं; प्रसंग में संक्षिप्त 'संयमी मन' उपयुक्त है।
- source_word: ἀνακαμπτόμενα
  choice: पीछे मोड़कर
  rationale: मूल शब्द में वापस या पीछे मोड़ने का चित्र है, जिसे केवल 'रोकना' कहकर समतल नहीं किया गया।
- source_word: φιλοτιμοῦνται
  choice: सम्मान की ओर लगाई जाती हैं
  rationale: यह असामान्य प्रयोग सम्मान चाहने, उत्साहपूर्वक आकांक्षा करने या किसी ऊँचे लक्ष्य की ओर लगने का भाव रखता है। मुख्य पाठ उस विशिष्ट अर्थ को बनाए रखता है, जबकि पादटिप्पणी प्रसंगगत विकल्प बताती है।
- source_word: κινήματα
  choice: प्रेरणाएँ
  rationale: शाब्दिक अर्थ 'गतियाँ' या 'हलचलें' है, पर इस नैतिक-मनोवैज्ञानिक प्रसंग में शरीर के भीतर उठने वाली प्रेरणाएँ अभिप्रेत हैं।
- source_word: λογισμοῦ
  choice: विवेक
  rationale: यह पुस्तक का प्रमुख दार्शनिक शब्द है और तर्कपूर्ण निर्णय करने वाली बुद्धि को दर्शाता है; हिन्दी में 'विवेक' इसका स्वाभाविक और संक्षिप्त रूप है।
theological_decisions:
- issue: मानवीय नैतिक मनोविज्ञान
  choice: पद को संयमी मन और विवेक द्वारा इच्छाओं तथा शारीरिक प्रेरणाओं के नियमन के रूप में प्रस्तुत किया गया है।
  alternative: आवेगों को स्पष्टतः 'पापी स्वभाव' या सभी शारीरिक प्रेरणाओं को अपने-आप बुरा कहा जा सकता था।
  rationale: ग्रीक पाठ हेलेनिस्टिक यहूदी नैतिक चिंतन की भाषा में बोलता है और बाद की धर्मवैज्ञानिक श्रेणियाँ नहीं जोड़ता।
- issue: φιλοτιμοῦνται का असामान्य अर्थ
  choice: सम्मान की ओर लगाई जाती हैं
  alternative: विवेक के अधीन रखी जाती हैं / विवेक द्वारा नियंत्रित होती हैं
  rationale: मूल क्रिया में सम्मान और उत्सुक आकांक्षा का वास्तविक अर्थ है। केवल 'नियंत्रित' कहना प्रसंग को सहज बनाता, पर मूल की विशिष्टता मिटा देता; इसलिए वैकल्पिक प्रसंगगत अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘संयमी मन’ और ‘विवेक’ दार्शनिक शब्दावली को अनावश्यक तकनीकीपन के बिना बनाए रखते हैं।
