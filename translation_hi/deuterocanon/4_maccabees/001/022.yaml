lexical_decisions:
- source_word: ἡδονή
  choice: सुख
  rationale: यहाँ इंद्रियजन्य या अनुभूत प्रसन्नता के सामान्य अर्थ में प्रयुक्त है; ‘सुख’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐπιθυμία
  choice: इच्छा
  rationale: प्रसंग में किसी सुख की ओर अग्रसर चाह का अर्थ है; ‘इच्छा’ अनावश्यक रूप से इसे पापपूर्ण ‘वासना’ नहीं बनाती।
- source_word: χαρά
  choice: आनंद
  rationale: ἡδονή से भेद बनाए रखते हुए उसके बाद उत्पन्न हर्ष को व्यक्त करता है।
- source_word: πρὸ ... μετὰ
  choice: पहले ... बाद
  rationale: मूल यूनानी के कालिक क्रम को सीधे और स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: μὲν οὖν ... δὲ
  choice: इसलिए ... और
  rationale: οὖν का निष्कर्षसूचक संबंध ‘इसलिए’ से व्यक्त किया गया है; μὲν...δὲ की संतुलित तुलना हिन्दी में ‘और’ तथा समानांतर रचना से स्पष्ट है।
