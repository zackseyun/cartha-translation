  yaml_path: translation/deuterocanon/4_maccabees/001/030.yaml
  text: For reason is the guide of the virtues and the master of the passions. Therefore, I will first demonstrate through the restraining works of self-control that reason is self-governing over the passions.
translation:
  language: hi
  text: क्योंकि विवेक सद्गुणों का मार्गदर्शक और मनोवेगों का स्वामी है। इसलिए मैं पहले संयम के नियंत्रणकारी कार्यों के द्वारा यह सिद्ध करूँगा कि विवेक मनोवेगों पर स्वयं प्रभुत्व रखता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμός
  choice: विवेक
  rationale: यहाँ शब्द विचारशील, तर्कपूर्ण नैतिक बुद्धि को दर्शाता है; ‘विवेक’ आधुनिक हिन्दी में इस भाव को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀρετῶν
  choice: सद्गुणों
  rationale: नैतिक उत्कृष्टताओं के बहुवचन के लिए प्रचलित और उपयुक्त हिन्दी पद।
- source_word: παθῶν
  choice: मनोवेगों
  rationale: संदर्भ में इच्छाओं, भावनाओं और आवेगों की व्यापक श्रेणी अभिप्रेत है; ‘मनोवेग’ केवल दुःख या वासना तक अर्थ को सीमित नहीं करता।
- source_word: αὐτοκράτωρ
  choice: स्वामी
  rationale: पहले कथन में इसका अर्थ अधिकार रखने वाला या नियंत्रक है; ‘स्वामी’ रूपक की शक्ति बनाए रखता है।
- source_word: κωλυτικῶν τῆς σωφροσύνης ἔργων
  choice: उन कर्मों के द्वारा, जो संयम में बाधा डालते हैं
  rationale: 'ग्रीक संबंध को औपचारिक रूप से सुरक्षित रखा गया है: ये ऐसे कर्म हैं जो σωφροσύνη को रोकते या बाधित करते हैं, न कि स्वयं संयम के रोकने वाले कार्य।'
- source_word: σωφροσύνης
  choice: संयम
  rationale: इस प्रसंग में आत्मसंयम और विवेकपूर्ण मर्यादा का नैतिक गुण अभिप्रेत है; सहज हिन्दी में ‘संयम’ उपयुक्त है।
- source_word: αὐτοδέσποτος
  choice: स्वयं शासन करता है
  rationale: शाब्दिक भाव ‘अपने अधिकार में/स्वामी’ है। यहाँ मनोवेगों के संबंध में विवेक की स्वाधीन शासकीय क्षमता को प्राकृतिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: मानवीय विवेक और मनोवेगों के बीच अधिकार-संबंध
  choice: ‘विवेक मनोवेगों पर स्वयं शासन करता है’
  alternative: ‘विवेक मनोवेगों पर सर्वसत्ता रखता है’
  rationale: αὐτοδέσποτος की स्वाधीनता को रखा गया है, पर ऐसा शब्द नहीं चुना गया जो निरपेक्ष या दैवी सर्वसत्ता का अतिरिक्त धार्मिक अर्थ जोड़ दे।
- issue: κωλυτικῶν का σωφροσύνης से संबंध
  choice: ‘जो संयम में बाधा डालते हैं’
  alternative: ‘संयम के रोकने वाले कार्यों के द्वारा’
  rationale: ग्रीक व्याकरण के अनुसार कर्म संयम में बाधक हैं। इससे लेखक की आगामी परीक्षा—संयम के विरोधी व्यवहारों के बीच विवेक की शक्ति—स्पष्ट रहती है और पाठ का तनाव मिटाया नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। दार्शनिक शब्दावली में ‘विवेक’, ‘सद्गुण’, ‘मनोवेग’ और ‘संयम’ का सुसंगत प्रयोग किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
