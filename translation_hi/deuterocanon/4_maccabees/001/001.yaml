base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/001.yaml
  text: Since I am about to demonstrate a most philosophical argument—whether devout reason is master of the passions—I would rightly advise you to give eager attention to philosophy[a].
translation:
  language: hi
  text: मैं एक अत्यन्त दार्शनिक तर्क प्रस्तुत करने जा रहा हूँ—कि क्या धर्मनिष्ठ विवेक मनोवेगों पर पूर्ण प्रभुत्व रखता है—इसलिए मैं आपको उचित ही सलाह दूँगा कि दर्शन पर उत्साहपूर्वक ध्यान दें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि क्या धर्मनिष्ठ विवेक मनोवेगों का पूर्ण स्वामी है।”
    reason: αὐτόδεσποτος के ‘पूर्ण प्रभुत्व’ और τῶν παθῶν के संबंधसूचक genitive को अधिक संक्षिप्त, निकट रूप में व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ΦΙΛΟΣΟΦΩΤΑΤΟΝ λόγον
  choice: इस अत्यन्त दार्शनिक तर्क को
  rationale: λόγος यहाँ आगामी विवेचन या तर्क को सूचित करता है, केवल ‘वचन’ को नहीं; अतिशयोक्तिपरक φιλοσοφώτατον को ‘अत्यन्त दार्शनिक’ से बनाए रखा गया है।
- source_word: ἐπιδείκνυσθαι μέλλων
  choice: प्रस्तुत करने जा रहा हूँ
  rationale: μέλλων आसन्न अभिप्राय बताता है और ἐπιδείκνυσθαι किसी तर्क को सामने रखकर प्रदर्शित करने का भाव देता है। ‘प्रस्तुत करने जा रहा हूँ’ आधुनिक हिन्दी में स्वाभाविक है और दावे को अनावश्यक रूप से ‘सिद्ध’ तक प्रबल नहीं करता।
- source_word: εἰ
  choice: कि क्या
  rationale: यहाँ εἰ परोक्ष प्रश्न आरम्भ करता है; ‘कि क्या’ उस प्रश्नात्मक अनिश्चितता को स्पष्ट रखता है।
- source_word: αὐτόδεσποτός
  choice: स्वयं पूर्ण अधिकार रखता है
  rationale: यौगिक शब्द स्वतंत्र या अपने बल पर प्रभुता रखने का अर्थ देता है। यह अनुवाद केवल सामान्य नियंत्रण की अपेक्षा उसकी प्रबलता को सुरक्षित रखता है।
- source_word: τῶν παθῶν
  choice: मनोवेगों पर
  rationale: हेलेनवादी दार्शनिक संदर्भ में πάθη भावनात्मक आवेगों और वासनात्मक प्रवृत्तियों का व्यापक वर्ग है। ‘मनोवेग’ आधुनिक हिन्दी में इस दार्शनिक अर्थ को अपेक्षाकृत संक्षेप में व्यक्त करता है।
- source_word: ὁ εὐσεβὴς λογισμός
  choice: भक्तिपूर्ण विवेक
  rationale: εὐσεβής की ईश्वरभक्ति और λογισμός की तर्क-विवेक संबंधी शक्ति दोनों को बनाए रखा गया है; ‘विवेक’ यहाँ केवल विचार की क्रिया नहीं, मार्गदर्शक तार्किक क्षमता है।
- source_word: συμβουλεύσαιμʼ ἂν ὑμῖν ὀρθῶς
  choice: तो उचित ही होगा कि मैं आपको ... सलाह दूँ
  rationale: optative के साथ ἄν विनम्र और औपचारिक परामर्श व्यक्त करता है; ὀρθῶς का मूल्यांकनात्मक भाव ‘उचित ही होगा’ में समाहित है।
- source_word: ὅπως προθύμως προσέχητε τῇ φιλοσοφίᾳ
  choice: कि ... दर्शन पर उत्साहपूर्वक ध्यान देने
  rationale: προθύμως तत्परता और उत्साह, तथा προσέχητε सावधान ध्यान को व्यक्त करता है। τῇ φιλοσοφίᾳ को सामान्य अर्थ में ‘दर्शन’ रखा गया है।
theological_decisions:
- issue: εὐσεβὴς λογισμός में धार्मिक भक्ति और दार्शनिक विवेक दोनों को सुरक्षित रखना
  choice: भक्तिपूर्ण विवेक
  alternative: धर्मनिष्ठ तर्कबुद्धि
  rationale: ‘भक्तिपूर्ण’ εὐσεβής के ईश्वराभिमुख धार्मिक आयाम को और ‘विवेक’ λογισμός की नियामक तार्किक क्षमता को सहज हिन्दी में जोड़ता है, बिना इसे केवल लौकिक बुद्धि या किसी विशिष्ट सम्प्रदायगत धारणा में सीमित किए।
- issue: αὐτόδεσποτός की प्रभुता की तीव्रता
  choice: स्वयं पूर्ण अधिकार रखता है
  alternative: स्वामी है
  rationale: मूल यौगिक में स्वतंत्र और पूर्ण प्रभुता का संकेत है। मुख्य पाठ में इसे स्पष्ट किया गया है, जबकि पादटिप्पणी अधिक संक्षिप्त वैकल्पिक रूप देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सुबोध शैली अपनाई गई है। लेखक के औपचारिक आरम्भ और दार्शनिक शब्दावली को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या अकादमिक भाषा से बचा गया है।
