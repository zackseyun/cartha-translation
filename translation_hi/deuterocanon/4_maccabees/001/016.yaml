lexical_decisions:
- source_word: σοφία
  choice: बुद्धि
  rationale: यह अमूर्त संज्ञा पद की परिभाषात्मक और दार्शनिक शैली को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: δὴ τοίνυν
  choice: अतः
  rationale: यह कण-समूह पिछले विचार से निकाले गए निष्कर्ष या तार्किक संक्रमण को सूचित करता है; ‘अतः’ संक्षिप्त और गरिमापूर्ण है।
- source_word: γνῶσις
  choice: ज्ञान
  rationale: यह यूनानी संज्ञा का सीधा समतुल्य है और यहाँ दी जा रही दार्शनिक परिभाषा के अनुकूल है।
- source_word: θείων
  choice: ईश्वरीय
  rationale: πραγμάτων के साथ यह ईश्वर या दिव्य क्षेत्र से संबंधित विषयों को दर्शाता है; ‘ईश्वरीय’ नैतिक अर्थ जोड़ने से बचता है।
- source_word: ἀνθρωπίνων
  choice: मानवीय
  rationale: यह ‘ईश्वरीय’ का स्वाभाविक समानांतर है और सभी मनुष्यों से संबंधित विषयों को समावेशी ढंग से व्यक्त करता है।
- source_word: πραγμάτων
  choice: विषयों
  rationale: दार्शनिक संदर्भ में यह व्यापक ‘बातों/मामलों’ को दर्शाता है; ‘विषयों’ से ज्ञान के क्षेत्र का अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: τῶν τούτων αἰτίων
  choice: उनके कारणों
  rationale: αἰτίων का दार्शनिक अर्थ ‘कारणों’ है और τούτων पहले बताए गए ईश्वरीय तथा मानवीय विषयों की ओर लौटता है।
