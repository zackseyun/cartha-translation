    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ σῶμα
  choice: और शरीर के संबंध में
  rationale: κατά + कर्मकारक यहाँ उस क्षेत्र या पहलू को बताता है जिसमें ये दुर्गुण गिने गए हैं। यह अनुवाद शारीरिक क्षेत्र को स्पष्ट रखता है और δέ की संयोजक भूमिका को ‘और’ से व्यक्त करता है।
- source_word: παντοφαγία
  choice: हर प्रकार का भोजन खाना
  rationale: यह यौगिक शब्द सब प्रकार की चीज़ें खाने को सूचित करता है। सहज आधुनिक हिन्दी में यह अर्थ स्पष्ट है और इसे केवल अधिक मात्रा में खाने के अर्थ में सीमित नहीं करता।
- source_word: λαμαργία
  choice: पेटूपन
  rationale: यह लालच से या अति मात्रा में खाने की आदत का प्रचलित और संक्षिप्त हिन्दी नाम है।
- source_word: μονοφαγία
  choice: अकेले खाना
  rationale: इस नैतिक दुर्गुण-सूची में इसका संभावित अर्थ दूसरों से अलग होकर अकेले खाना है। शब्द की रचना से ‘एक ही प्रकार का भोजन खाना’ भी संभव है, इसलिए वह विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: μονοφαγία का अर्थ
  choice: अकेले खाना
  alternative: एक ही प्रकार का भोजन खाना / केवल एक प्रकार का आहार लेना
  rationale: यह मुख्यतः शब्दार्थ और संदर्भ से जुड़ा प्रश्न है। दुर्गुणों की सूची में ‘अकेले खाना’ सामाजिक रूप से अनुचित शारीरिक आदत के रूप में उपयुक्त बैठता है; फिर भी यूनानी शब्द की संरचना दूसरे अर्थ की वास्तविक संभावना रखती है, इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण दुर्गुण-सूची। दुर्लभ तकनीकी शब्द के स्थान पर स्पष्ट पदबंध रखा गया है; समानांतर संज्ञात्मक रूप बनाए रखने के लिए तीनों मद क्रियामूलक संज्ञा-पदबंधों में हैं।
