base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/006.yaml
  text: For reason does not rule over one's own passions[a], but over those things opposed to justice and courage and self-control and prudence; and over these, not so as to destroy them, but so as not to yield to them.
translation:
  language: hi
  text: क्योंकि विवेक अपने मनोवेगों पर शासन नहीं करता, बल्कि उन मनोवेगों पर करता है जो न्याय[a], साहस, आत्म-संयम और व्यावहारिक बुद्धि के विरोधी हैं; और उन पर भी इसलिए नहीं कि वह उन्हें मिटा दे, बल्कि इसलिए कि उनके आगे न झुके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धार्मिकता’।
    reason: δικαιοσύνη का अर्थ ‘न्याय’ और ‘धार्मिकता’ दोनों हो सकता है; यहाँ यूनानी सद्गुण-सूची के कारण मुख्य पाठ में ‘न्याय’ रखा गया है।
lexical_decisions:
- source_word: λογισμός
  choice: विवेक
  rationale: यहाँ शब्द तर्कपूर्ण विचार और नैतिक निर्णय करने वाली मानवीय क्षमता को दर्शाता है। ‘विवेक’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और दार्शनिक प्रसंग के अनुकूल है।
- source_word: κρατεῖ
  choice: शासन करता
  rationale: κρατέω प्रभुत्व या नियंत्रण रखने का भाव देता है। ‘शासन करना’ मूल के प्रभुत्व-संबंधी रूपक को बनाए रखता है।
- source_word: παθῶν
  choice: मनोवेगों
  rationale: इस नैतिक-दर्शन संबंधी प्रसंग में πάθη दुखों के बजाय भावनात्मक आवेगों या passions को सूचित करता है। ‘मनोवेग’ इसका पर्याप्त व्यापक और तटस्थ हिन्दी रूप है।
- source_word: τῶν ... ἐναντίων
  choice: उन मनोवेगों पर ... जो ... के विरोधी हैं
  rationale: यूनानी में विशेषण संज्ञा के रूप में प्रयुक्त है और पिछले ‘मनोवेगों’ से उसका आशय स्पष्ट होता है। हिन्दी में संज्ञा दोहराने से संदर्भ स्वाभाविक और स्पष्ट रहता है।
- source_word: δικαιοσύνης
  choice: न्याय
  rationale: यह चार यूनानी नैतिक सद्गुणों की सूची है; अतः ‘न्याय’ इस दार्शनिक संदर्भ में ‘धार्मिकता’ से अधिक उपयुक्त है।
- source_word: ἀνδρείας
  choice: साहस
  rationale: यह नैतिक दृढ़ता और वीरता के सद्गुण को दर्शाता है। ‘साहस’ सहज है और अनावश्यक लैंगिक अर्थ से बचता है।
- source_word: σωφροσύνης
  choice: आत्म-संयम
  rationale: यह अपने आवेगों पर अनुशासित नियंत्रण रखने का सद्गुण है। ‘आत्म-संयम’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: φρονήσεως
  choice: व्यावहारिक बुद्धि
  rationale: φρόνησις व्यवहार में उचित निर्णय लेने वाली बुद्धि है। ‘व्यावहारिक बुद्धि’ इसे सामान्य ‘बुद्धि’ या व्यापक ‘ज्ञान’ से अलग रखती है।
- source_word: καταλῦσαι
  choice: मिटा दे
  rationale: यहाँ अर्थ विरोधी मनोवेगों को समाप्त या निष्प्रभावी कर देने का है। ‘मिटा देना’ स्वाभाविक हिन्दी में इस प्रबल अर्थ को व्यक्त करता है।
- source_word: μὴ εἴξαι
  choice: उनके आगे न झुके
  rationale: εἴκω का अर्थ दबाव के आगे हार मानना या रास्ता देना है। ‘आगे न झुकना’ हिन्दी में इस भाव को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
theological_decisions:
- issue: यूनानी सद्गुण-सूची में δικαιοσύνη का अनुवाद
  choice: न्याय
  alternative: धार्मिकता
  rationale: निकटवर्ती शब्द साहस, आत्म-संयम और व्यावहारिक बुद्धि के साथ मिलकर यूनानी नैतिक दर्शन के चार प्रमुख सद्गुणों की सूची बनाते हैं। इसलिए मुख्य पाठ में ‘न्याय’ चुना गया है, जबकि शब्द का संभव व्यापक नैतिक अर्थ पादटिप्पणी में रखा गया है।
- issue: ἑαυτοῦ का संबंध
  choice: अपने मनोवेगों
  alternative: विवेक के अपने मनोवेगों
  rationale: यूनानी व्याकरण में आत्मवाचक सर्वनाम का संबंध ‘विवेक’ से समझा जा सकता है, पर हिन्दी में ‘विवेक के अपने मनोवेग’ अस्वाभाविक और अवधारणात्मक रूप से भारी पड़ता है। ‘अपने मनोवेगों’ मूल की आत्मवाचकता और उसकी संभावित अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। दार्शनिक शब्दावली में ‘विवेक’, ‘मनोवेग’ और ‘व्यावहारिक बुद्धि’ का प्रयोग अर्थ की सटीकता तथा सहजता के संतुलन के लिए किया गया है।
