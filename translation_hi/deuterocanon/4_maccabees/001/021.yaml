  text: There are also ancient sequences of passions concerning pleasure and pain[a].
translation:
  language: hi
  text: सुख और पीड़ा से संबंधित मनोवेगों की शृंखलाएँ भी प्राचीन हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुख और पीड़ा के संबंध में मनोवेगों के क्रम भी प्राचीन हैं।”
    reason: ἀκολουθίαι के लिए ‘शृंखलाएँ’ और ‘क्रम’ दोनों संभव हैं; वैकल्पिक अनुवाद मूल वाक्य-संरचना को अधिक निकटता से दिखाता है।
lexical_decisions:
- source_word: παλαιαὶ
  choice: प्राचीन
  rationale: यह इन शृंखलाओं के बहुत पुराने और लंबे समय से चले आनेवाले स्वरूप को व्यक्त करता है; ‘पुरानी’ की अपेक्षा ‘प्राचीन’ मूल की गंभीरता को बेहतर बनाए रखता है।
- source_word: περὶ τὴν ἡδονὴν καὶ τὸν πόνον
  choice: सुख और पीड़ा से संबंधित
  rationale: περὶ के संदर्भ अथवा क्षेत्र-सूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और सुख तथा पीड़ा के साथ संबंध को अनावश्यक रूप से कारणात्मक नहीं बनाता।
- source_word: παθῶν
  choice: मनोवेगों
  rationale: यहाँ πάθη हेलेनवादी दार्शनिक संदर्भ में ऐसे आवेगों अथवा भावात्मक प्रवृत्तियों को सूचित करता है जिन पर विवेक शासन कर सकता है। ‘मनोवेग’ केवल सामान्य भावनाओं या शारीरिक कष्टों का अर्थ देने से बचता है।
- source_word: ἀκολουθίαι
  choice: शृंखलाएँ
  rationale: बहुवचन संज्ञा एक के पीछे एक आनेवाले क्रमों या सिलसिलों को दर्शाती है। ‘शृंखलाएँ’ इस क्रमबद्धता को पठनीय हिन्दी में बनाए रखता है; पादटिप्पणी में अधिक शाब्दिक ‘क्रम’ दिया गया है।
theological_decisions:
- issue: 4 मक्काबियों में πάθη का दार्शनिक-मानववैज्ञानिक अर्थ
  choice: मनोवेग
  alternative: भावनाएँ; वासनाएँ; कष्ट
  rationale: इस पुस्तक के तर्क में यह शब्द उन भावात्मक अथवा अविवेकी आवेगों के लिए आता है जिन्हें विवेक वश में रखता है। ‘मनोवेग’ इस तकनीकी अर्थ को रखता है, जबकि ‘भावनाएँ’ अत्यधिक व्यापक, ‘वासनाएँ’ अत्यधिक नैतिकीकृत और ‘कष्ट’ इस प्रसंग में भ्रामक होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। दार्शनिक शब्दावली को अत्यधिक संस्कृतनिष्ठ बनाने से बचते हुए ‘मनोवेग’, ‘शृंखलाएँ’ और ‘प्राचीन’ चुने गए हैं।
