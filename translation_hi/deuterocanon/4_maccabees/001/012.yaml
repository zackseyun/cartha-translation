  choice: बोलना सम्भव होगा
  rationale: ἐξέσται के सम्भावना-वाले अर्थ को मुख्य पाठ में रखता है; अनुमति का सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀρξαμένων τῆς ὑποθέσεως
  choice: पहले विषय का आरम्भ करके
  rationale: प्रदत्त यूनानी में रूप-सामंजस्य की कठिनाई है, पर वाक्य का अभिप्राय चर्चा के विषय से आरम्भ करने का है; हिन्दी इसे सहज participial ढंग से व्यक्त करती है।
- source_word: ὅπερ εἴωθα ποιεῖν
  choice: जैसा मैं किया करता हूँ
  rationale: लेखक की अपनी सामान्य रीति के उल्लेख को स्पष्ट और स्वाभाविक रखता है।
- source_word: εἰς τὸν περὶ αὐτῶν τρέψομαι λόγον
  choice: मैं उनके विषय की चर्चा की ओर मुड़ूँगा
  rationale: τρέψομαι की दिशा बदलने वाली छवि और λόγος के औपचारिक विमर्शार्थ को बनाए रखता है।
- source_word: αὐτῶν
  choice: उनके
  rationale: यूनानी सर्वनाम की संदर्भगत अस्पष्टता को मुख्य पाठ में यथासम्भव सुरक्षित रखता है।
- source_word: δόξαν διδοὺς
  choice: महिमा दूँगा
  rationale: परमेश्वर को महिमा अर्पित करने की प्रचलित और सटीक धार्मिक अभिव्यक्ति है।
- source_word: τῷ πανσόφῳ θεῷ
  choice: परम बुद्धिमान परमेश्वर
  rationale: πανσόφῳ के अत्युच्च ज्ञान-बुद्धि के भाव को सुबोध और गरिमामय हिन्दी में व्यक्त करता है, बिना उसे ‘सर्वज्ञ’ के अलग दार्शनिक अर्थ में बदलने के।
theological_decisions:
- issue: πανσόφῳ θεῷ का ईश्वरीय विशेषण
  choice: परम बुद्धिमान परमेश्वर
  alternative: सर्वबुद्धिमान परमेश्वर
  rationale: चुना हुआ रूप आधुनिक हिन्दी में अधिक स्वाभाविक है और परमेश्वर की सर्वोच्च बुद्धि का स्तुतिपरक भाव बनाए रखता है; ‘सर्वज्ञ’ कहने से मूल के ज्ञान और बुद्धि के बीच का भेद मिट सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। वाक्य की यूनानी वक्तृत्वपूर्ण गति को बनाए रखने के लिए डैश का प्रयोग किया गया है; अस्पष्ट सर्वनाम और ἐξέσται की अर्थ-सम्भावना को पादटिप्पणियों में सुरक्षित रखा गया है।
