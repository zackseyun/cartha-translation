  yaml_path: translation/deuterocanon/4_maccabees/001/012.yaml
  text: But even about this it will now be possible to speak at once[a], beginning with the subject, as I am accustomed to do, and thus I will turn to the discourse about them[b], giving glory to the all-wise God.
translation:
  language: hi
  text: पर इस विषय पर भी अब इसी समय बोलना सम्भव होगा[a], विषय का आरम्भ करके—जैसा मैं किया करता हूँ—और इस प्रकार मैं उनके बारे में चर्चा की ओर मुड़ूँगा[b], परम बुद्धिमान परमेश्वर को महिमा देते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस विषय पर भी अब इसी समय बोलने की अनुमति होगी”; यूनानी शब्द ἐξέσται सम्भावना के साथ-साथ अनुमति का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उनके” आगे की चर्चा में आने वाले व्यक्तियों की ओर संकेत कर सकता है; निकट प्रसंग के आधार पर “इन बातों” का अर्थ भी सम्भव है।
    reason: alternative_reading
