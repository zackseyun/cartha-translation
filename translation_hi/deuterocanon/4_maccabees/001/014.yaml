  yaml_path: translation/deuterocanon/4_maccabees/001/014.yaml
  text: But let us determine what reason is[a], and what passion is, and how many kinds of passions there are[c][b], and whether reason rules over all these.
translation:
  language: hi
  text: तो आइए, हम विचार करें[a] कि विवेक क्या है, मनोवेग क्या है,[b] मनोवेगों के कितने प्रकार हैं, और क्या विवेक इन सब पर शासन करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेद करके समझें” अथवा “जाँचें।” यूनानी क्रिया में श्रेणियों को अलग पहचानने और उनका स्वरूप निर्धारित करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मनोवेग” के लिए “भावावेग” या “आवेग” भी संभव है; यहाँ यूनानी शब्द दुःख नहीं, बल्कि दार्शनिक अर्थ में मन को प्रभावित और प्रेरित करने वाले भावों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρίνωμεν
  choice: आइए हम विचार करें
  rationale: प्रेरणार्थक संभावनार्थक क्रिया साझा जाँच का आमंत्रण देती है। यहाँ श्रेणियों में भेद करने के साथ उनका स्वरूप निर्धारित करने का भाव है; आधुनिक हिन्दी में ‘विचार करें’ इस जाँचपरक लहजे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λογισμός
  choice: विवेक
  rationale: यहाँ यह तर्कपूर्ण निर्णय करने वाली क्षमता को सूचित करता है, जो पुस्तक की केंद्रीय धारणा है। ‘विवेक’ साधारण पाठक के लिए बोधगम्य है और केवल तर्क-प्रक्रिया की अपेक्षा निर्णयकारी बुद्धि का भाव बेहतर रखता है।
- source_word: πάθος
  choice: मनोवेग
  rationale: दार्शनिक प्रसंग में शब्द का अर्थ दुःख नहीं, बल्कि मन को प्रेरित करने वाला भाव या आवेग है। ‘मनोवेग’ आधुनिक हिन्दी में इस व्यापक प्रभावकारी शक्ति को व्यक्त करता है और ‘विवेक’ के साथ मूल विरोध बनाए रखता है।
- source_word: πόσα παθῶν εἰδέα
  choice: मनोवेगों के कितने प्रकार हैं
  rationale: εἰδέα यहाँ रूपों या वर्गों को दर्शाता है। ‘प्रकार’ स्पष्ट, स्वाभाविक और वर्गीकरण के भाव के अनुकूल है।
- source_word: ἐπικρατεῖ
  choice: शासन करता है
  rationale: क्रिया प्रभुत्व या अधिकार रखने का अर्थ देती है। ‘शासन करता है’ मूल की शासकीय उपमा को बनाए रखता है और मात्र नियंत्रण से अधिक व्यापक प्रभुत्व व्यक्त करता है।
- source_word: τούτων
  choice: इन सब
  rationale: संकेतवाचक सर्वनाम पहले बताए गए मनोवेगों की ओर लौटता है। ‘इन सब’ उसके संकेत और समग्रता दोनों को बनाए रखता है।
theological_decisions:
- issue: λογισμός और πάθος के दार्शनिक विरोध का अनुवाद
  choice: विवेक ... मनोवेग
  alternative: तर्कबुद्धि ... आवेग; तर्क ... भावनाएँ
  rationale: यह पद मनोवेगों पर तर्कपूर्ण निर्णय-क्षमता के प्रभुत्व से संबंधित पुस्तक के मुख्य तर्क की भूमिका बाँधता है। चुनी हुई शब्दावली मूल दार्शनिक तनाव को बनाए रखती है, पर उसे आधुनिक मनोविज्ञान की संकीर्ण श्रेणियों में नहीं बदलती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विवेक’ और ‘मनोवेग’ दार्शनिक स्वर को सुरक्षित रखते हुए अत्यधिक तकनीकी शब्दावली से बचते हैं।
