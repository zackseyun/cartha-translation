translation:
  language: hi
  text: अतः मैं आपको अनेक पक्षों से और अनेक प्रकार से[a] दिखा सकता हूँ कि भक्तिपूर्ण विवेक[b] मनोवेगों पर पूर्ण प्रभुत्व रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनेक ओरों से और भिन्न-भिन्न प्रकार से।” दोनों यूनानी क्रियाविशेषण तर्क प्रस्तुत करने के अनेक पक्षों और प्रकारों पर बल देते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “ईश्वरभक्त तर्कबुद्धि।” यह इस ग्रन्थ का प्रमुख पद है और परमेश्वर के प्रति श्रद्धा-भक्ति से निर्देशित विवेक को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλαχόθεν … καὶ ἀλλαχόθεν
  choice: अनेक दृष्टियों और भिन्न-भिन्न दिशाओं से
  rationale: दोनों युग्मित क्रियाविशेषण अनेक तर्क-दृष्टियों और विभिन्न ओरों से प्रमाण प्रस्तुत करने की बात पर बल देते हैं; हिन्दी में यह अभिव्यक्ति उनके संचयी तथा कुछ हद तक भिन्न अर्थों को बनाए रखती है।
- source_word: ἔχοιμʼ ἂν
  choice: मैं … दिखा सकता हूँ
  rationale: ἄν के साथ optative सम्भावना या सामर्थ्य व्यक्त करता है; ‘सकता हूँ’ आधुनिक हिन्दी में इसका स्वाभाविक रूप है।
- source_word: ἐπιδεῖξαι
  choice: दिखा सकता हूँ
  rationale: यहाँ क्रिया का अर्थ तर्क द्वारा दिखाना या प्रदर्शित करना है; ‘सिद्ध कर सकता हूँ’ मूल से अधिक निर्णायक हो सकता था।
- source_word: αὐτοκράτωρ
  choice: पूरा अधिकार रखता है
  rationale: शब्द पूर्ण शासकीय सामर्थ्य या प्रभुत्व व्यक्त करता है। यह रूप शासन के भाव को स्वाभाविक हिन्दी में स्पष्ट करता है और ‘स्वेच्छाचारी’ जैसे आधुनिक नकारात्मक अर्थ से बचता है।
- source_word: τῶν παθῶν
  choice: मनोवेगों पर
  rationale: इस ग्रन्थ के नैतिक-दार्शनिक प्रसंग में πάθη उन भावात्मक इच्छाओं और आवेगों को सूचित करता है जिन पर विवेक शासन करता है; ‘मनोवेग’ केवल सामान्य ‘भावनाओं’ से अधिक सटीक है।
- source_word: ὁ εὐσεβὴς λογισμός
  choice: भक्तिपूर्ण विवेक
  rationale: λογισμός यहाँ तर्कशील विचार-विवेक है और εὐσεβής परमेश्वर के प्रति श्रद्धा-भक्ति से निर्देशित उसके स्वरूप को बताता है। ‘भक्तिपूर्ण विवेक’ धार्मिक और बौद्धिक दोनों पक्षों को सहज हिन्दी में रखता है।
theological_decisions:
- issue: ὁ εὐσεβὴς λογισμός का ग्रन्थ-विषयक अर्थ
  choice: भक्तिपूर्ण विवेक
  alternative: ईश्वरभक्त तर्कबुद्धि; श्रद्धापूर्ण विवेक
  rationale: यह पद न तो निरपेक्ष बुद्धिवाद बताता है और न केवल धार्मिक भावना, बल्कि परमेश्वर के प्रति भक्ति से संचालित तर्कशील विवेक को सूचित करता है। चुना गया रूप किसी बाद की विशिष्ट साम्प्रदायिक धारणा को नहीं जोड़ता।
- issue: αὐτοκράτωρ के शासन-दावे की तीव्रता
  choice: मनोवेगों पर पूरा अधिकार रखता है
  alternative: मनोवेगों का स्वामी है; मनोवेगों को वश में रखता है
  rationale: मूल में पूर्ण अधिकार का प्रबल दावा है। ‘पूरा अधिकार’ उस तीव्रता को बनाए रखता है, जबकि इसे यह कहकर कम नहीं करता कि विवेक केवल मनोवेगों को कुछ हद तक नियंत्रित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। ‘मनोवेग’ नैतिक-दार्शनिक प्रसंग को बनाए रखता है, और ‘भक्तिपूर्ण विवेक’ पुस्तक के केंद्रीय पद के धार्मिक तथा तर्कशील दोनों आयामों को व्यक्त करता है।
