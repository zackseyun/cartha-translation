lexical_decisions:
- source_word: κατὰ μὲν ψυχῆς
  choice: आत्मा के विरुद्ध
  rationale: κατά के साथ संबंधकारक यहाँ उन दुर्गुणों को प्रस्तुत करता है जो आत्मा के प्रतिकूल हैं; ‘आत्मा के विरुद्ध’ इस विरोधात्मक बल और ψυχή के मानव-आंतरिक अर्थ को सुरक्षित रखता है।
- source_word: ἀλαζονία
  choice: घमंड
  rationale: यह शब्द डींगपूर्ण अभिमान और अहंकारी आत्म-प्रदर्शन को दर्शाता है; ‘घमंड’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट नैतिक शब्द है।
- source_word: φιλαργυρία
  choice: धन का लोभ
  rationale: शाब्दिक अर्थ ‘चाँदी/धन से प्रेम’ है। ‘धन का लोभ’ हिन्दी में सहज है और धन के प्रति अनुचित आसक्ति का नकारात्मक भाव स्पष्ट करता है।
- source_word: φιλοδοξία
  choice: मान-सम्मान की लालसा
  rationale: यह प्रतिष्ठा, सम्मान या यश पाने की आसक्ति को व्यक्त करता है। ‘मान-सम्मान की लालसा’ इसे तटस्थ ‘महत्त्वाकांक्षा’ समझे जाने से बचाती है।
- source_word: φιλονεικία
  choice: झगड़ालूपन
  rationale: यह विवाद या कलह करने की प्रवृत्ति है; ‘झगड़ालूपन’ साधारण आधुनिक हिन्दी में स्पष्ट और नैतिक रूप से नकारात्मक है।
- source_word: βασκανία
  choice: ईर्ष्या
  rationale: दुर्गुणों की इस सूची में ‘ईर्ष्या’ सबसे स्पष्ट अर्थ है, जबकि शब्द में दुर्भावनापूर्ण दृष्टि अथवा ‘बुरी नज़र’ का सांस्कृतिक अर्थ भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
