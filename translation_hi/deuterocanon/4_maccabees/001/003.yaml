translation:
  language: hi
  text: यदि ऐसा है, तो यह स्पष्ट है कि विवेक आत्म-संयम में बाधा डालने वाले आवेगों—पेटूपन और लालसा—पर प्रबल हो सकता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वास्तव में ऐसा प्रतीत होता है कि विवेक आत्म-संयमी लोगों को बाधित करने वाले आवेगों—पेटूपन और लालसा—पर प्रबल है।” σωφρονούντων वाला यूनानी पदबंध संक्षिप्त है; इसे अधिक औपचारिक, किंतु कम स्पष्ट ढंग से भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ ἄρα
  choice: यदि, तो
  rationale: εἰ की शर्त और ἄρα के निष्कर्षसूचक भाव—दोनों को संक्षेप में बनाए रखता है। यह वाक्य अगले तर्क की शर्त प्रस्तुत करता है।
- source_word: τῶν σωφρονούντων
  choice: जो आत्म-संयम में बाधा डालते हैं
  rationale: यूनानी पदबंध संक्षिप्त और वाक्य-विन्यास की दृष्टि से कठिन है। प्रसंग में इसका स्वाभाविक अर्थ उन आवेगों से है जो आत्म-संयम को रोकते हैं; अधिक शब्दशः विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κωλυτικῶν παθῶν
  choice: उन आवेगों ... जो ... बाधा डालते हैं
  rationale: κωλυτικός बाधा देने वाला है और πάθη यहाँ मनुष्य को प्रभावित करने वाली प्रबल इच्छाओं या आवेगों को सूचित करता है। आधुनिक हिन्दी में ‘आवेग’ इस दार्शनिक संदर्भ में ‘विकार’ की अपेक्षा कम व्याख्यात्मक और अधिक सहज है।
- source_word: ὁ λογισμός
  choice: विवेक
  rationale: 4 मक्काबियों में λογισμός तर्कपूर्ण निर्णय करने वाली मानवीय क्षमता का मुख्य दार्शनिक शब्द है। ‘विवेक’ साधारण हिन्दी में स्वाभाविक है और केवल अमूर्त तर्क के बजाय निर्णयकारी बुद्धि का भाव देता है।
- source_word: φαίνεται ἐπικρατεῖν
  choice: यह स्पष्ट होता है कि ... अधिकार पा सकता है
  rationale: φαίνεται के प्रकट या सिद्ध होने के भाव और ἐπικρατεῖν के प्रबल होने अथवा अधिकार पाने के भाव को संयुक्त रूप से व्यक्त करता है; ‘पा सकता है’ तर्क में निहित सामर्थ्य को स्पष्ट करता है।
- source_word: γαστριμαργίας
  choice: पेटूपन
  rationale: यह भोजन की अति-लालसा या अतिभक्षण को दर्शाता है। ‘पेटूपन’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: ἐπιθυμίας
  choice: लालसा
  rationale: ἐπιθυμία व्यापक प्रबल इच्छा या चाह को सूचित करता है। ‘लालसा’ उसकी तीव्रता बनाए रखती है, पर अर्थ को केवल यौन वासना तक सीमित नहीं करती।
theological_decisions:
- issue: 4 मक्काबियों में λογισμός का दार्शनिक-मानवशास्त्रीय अर्थ
  choice: विवेक
  alternative: तर्क-बुद्धि; विचारशील बुद्धि
  rationale: पद मनुष्य की उस निर्णयकारी बौद्धिक क्षमता को दर्शाता है जो आवेगों पर शासन कर सकती है। ‘विवेक’ इस दावे को बाद की किसी विशिष्ट दार्शनिक या सांप्रदायिक शब्दावली से बाँधे बिना व्यक्त करता है।
- issue: τῶν σωφρονούντων वाले संक्षिप्त पदबंध का संबंध
  choice: इसे कार्यात्मक रूप से आत्म-संयम में बाधा डालने वाले आवेगों के रूप में समझना
  alternative: ‘आत्म-संयमी लोगों के बाधक आवेग’ जैसा अधिक शब्दशः पाठ
  rationale: यूनानी वाक्यांश वास्तविक रूप से संदिग्ध और संकुचित है। मुख्य पाठ प्रसंगानुकूल अर्थ देता है, जबकि पादटिप्पणी अधिक औपचारिक संभावना को बनाए रखती है।
- issue: ἐπιθυμία की सीमा
  choice: लालसा
  alternative: इच्छा; वासना
  rationale: यहाँ संदर्भ ने अभी इसे केवल यौन इच्छा तक सीमित नहीं किया है। इसलिए व्यापक अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विवेक’, ‘आवेग’, ‘आत्म-संयम’, ‘पेटूपन’ और ‘लालसा’ दार्शनिक तर्क को बिना अनावश्यक तकनीकीपन के व्यक्त करते हैं। यूनानी की वाक्य-विन्यासगत अस्पष्टता को मुख्य पाठ में सहज रूप दिया गया है और वास्तविक वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
