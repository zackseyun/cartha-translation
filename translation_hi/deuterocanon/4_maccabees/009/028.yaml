  text: Dragging him by the tendons with their iron hands[a], the leopard-like beasts stripped away all his flesh, even to his beard, and the skin of his head; but as he endured this grievous pain steadfastly, he said[d][c][b],
translation:
  language: hi
  text: लोहे के हाथों[b] से उसे कंडराओं से पकड़कर खींचते हुए, तेंदुए-जैसे जंगली पशुओं[c] ने उसकी कंडराओं से लेकर दाढ़ी तक का सारा मांस और उसके सिर की खाल[d] खींचकर उतार दी; पर वह इस भीषण पीड़ा को दृढ़ता से सहते हुए बोला,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: शाब्दिक रूप से, ‘लोहे के हाथों से।’ यह लोहे के औज़ारों का वर्णन हो सकता है या पशु-सदृश अत्याचारियों की पकड़ की कठोरता को उभार सकता है; यूनानी अभिव्यक्ति स्वयं अस्पष्ट है।
    reason: lexical_ambiguity
  - marker: c
    text: या, ‘तेंदुओं ने।’ यूनानी में अधिक शाब्दिक रूप से, ‘तेंदुए-जैसे जंगली पशु’ है।
    reason: lexical_alternative
  - marker: d
    text: या, ‘सिर की त्वचा’; यूनानी में ‘सिर की खाल’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τενόντων
  choice: उसकी कंडराओं को
  rationale: τένων शरीर की कंडरा या स्नायु को दर्शाता है। ‘कंडराओं’ से शारीरिक विवरण बना रहता है; ἀπό के आरंभ-बिंदु वाले अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ταῖς σιδηραῖς χερσὶν
  choice: लोहे के हाथों से
  rationale: χείρ का सीधा अर्थ ‘हाथ’ है। ‘लोहे के पंजे’ या ‘लोहे के औज़ार’ कहने से अधिक व्याख्या जुड़ जाती; मूल का तीखा और कुछ हद तक अस्पष्ट बिंब रखा गया है।
- source_word: ἐπισπασάμενοι
  choice: खींचते हुए
  rationale: क्रिया किसी वस्तु को अपनी ओर खींचने का भाव देती है। कृदंत का जारी क्रिया वाला रूप हिन्दी में स्वाभाविक रूप से रखा गया है।
- source_word: μέχρι γε τῶν γενείων
  choice: दाढ़ी तक
  rationale: γενεῖον ठुड्डी अथवा दाढ़ी के क्षेत्र को दर्शा सकता है; γε सीमा पर बल देता है, जिसे ‘तक’ व्यक्त करता है।
- source_word: τὴν σάρκα πᾶσαν
  choice: सारा मांस
  rationale: यहाँ σάρξ शाब्दिक शारीरिक अर्थ में है; ‘सारा मांस’ स्पष्ट और स्वाभाविक है।
- source_word: τὴν τῆς κεφαλῆς δορὰν
  choice: उसके सिर की खाल
  rationale: δορά त्वचा या खाल है। ‘सिर की खाल’ मूल अभिव्यक्ति के निकट है और ‘खोपड़ी की त्वचा’ की अपेक्षा अधिक सहज है।
- source_word: οἱ παρδάλιοι θῆρες
  choice: तेंदुए-जैसे हिंस्र पशुओं
  rationale: παρδάλιος विशेषण है और θῆρες को तेंदुए-जैसा बताता है। इसलिए केवल ‘तेंदुओं’ के बजाय विशेषणात्मक तुलना सुरक्षित रखी गई है।
- source_word: ἀπέσυραν
  choice: उतार दी
  rationale: क्रिया खींचकर अलग करने का अर्थ देती है। मांस और सिर की खाल के संदर्भ में ‘उतार दी’ परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βαρέως ... καρτερῶν
  choice: इस भीषण पीड़ा को दृढ़ता से सहते हुए
  rationale: βαρέως पीड़ा की भारी या कठोर तीव्रता और καρτερέω अटल सहनशीलता को व्यक्त करता है। हिन्दी वाक्य दोनों पक्षों—पीड़ा की भीषणता और सहने की दृढ़ता—को बनाए रखता है।
- source_word: ἔλεγεν
  choice: कहता गया
  rationale: अपूर्णकालिक रूप जारी अथवा आरंभ होती वाणी का संकेत देता है; अगले पद में कथन जारी रहने के कारण ‘कहता गया’ उपयुक्त है।
