base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/032.yaml
  text: But you[a], by the threats of your ungodliness, are being tortured; and you will not escape, most defiled tyrant, the punishments of divine wrath.
translation:
  language: hi
  text: परन्तु तुम अपनी अभक्ति की धमकियों के बीच यातना भुगत रहे हो[a]; और हे परम अपवित्र अत्याचारी शासक, तुम ईश्वरीय क्रोध के दण्डों से बच नहीं पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपनी अभक्ति की धमकियों से यातना भुगत रहे हो।” यूनानी वाक्यांश संक्षिप्त है; ἐν का अर्थ “के बीच” अथवा, प्रसंगानुसार, “से” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βασανίζῃ
  choice: स्वयं यातना पा रहे हो
  rationale: यूनानी रूप वर्तमानकालीन मध्यम/कर्मवाच्य है और ‘यातना पाना’ इसका स्वाभाविक अर्थ है। ‘स्वयं’ सम्बोधित अत्याचारी पर लौटती हुई यातना का संकेत देता है, पर कर्तृवाच्य ‘अपने को यातना देते हो’ जितना निश्चित नहीं बनाता।
- source_word: ἐν ταῖς τῆς ἀσεβείας ἀπειλαῖς
  choice: अपनी अभक्ति की धमकियों से
  rationale: ἀπειλαί का सीधा अर्थ ‘धमकियाँ’ है; ἐν को यहाँ साधनसूचक ‘से’ समझना संक्षिप्त यूनानी वाक्यांश को निकटता से रखता है। सम्बन्ध की संकुचित और कुछ अस्पष्ट प्रकृति को पादटिप्पणी में वैकल्पिक रूप से सुरक्षित रखा गया है।
- source_word: ἀσεβείας
  choice: अभक्ति
  rationale: ‘अभक्ति’ धार्मिक और नैतिक दुष्टता दोनों का बोध कराती है तथा आधुनिक हिन्दी में ‘ईश्वर-विमुखता’ की अपेक्षा अधिक संक्षिप्त है।
- source_word: μιερώτατε
  choice: परम अपवित्र
  rationale: विशेषण का अतिशयोक्तिपूर्ण रूप नैतिक तथा धार्मिक अशुद्धता का तीखा आरोप लगाता है; ‘परम अपवित्र’ उस बल को बनाए रखता है।
- source_word: τύραννε
  choice: अत्याचारी
  rationale: सम्बोधन में यह केवल शासक नहीं, क्रूर और अन्यायी निरंकुश शासक को दर्शाता है; हिन्दी में ‘अत्याचारी’ स्वाभाविक और निन्दात्मक है।
- source_word: τὰς ... δίκας
  choice: दण्डों
  rationale: यहाँ δίκαι न्याय के कार्यान्वयन के रूप में मिलने वाले दण्डों को दर्शाता है, न कि अमूर्त ‘न्याय’ को। बहुवचन रखा गया है।
- source_word: θείας ὀργῆς
  choice: ईश्वरीय क्रोध
  rationale: θείας विशेषण है; ‘ईश्वरीय’ मूल की अभिव्यक्ति को बनाए रखता है और सीधे ‘परमेश्वर का’ कहकर उसे अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: θείας ὀργῆς का सन्दर्भ
  choice: ईश्वरीय क्रोध
  alternative: परमेश्वर का क्रोध
  rationale: यूनानी पाठ सीधे परमेश्वर की संज्ञा नहीं, बल्कि ‘ईश्वरीय’ विशेषण का प्रयोग करता है। अनुवाद वही रूप रखता है, जबकि सन्दर्भ में परमेश्वर की ओर संकेत स्पष्ट बना रहता है।
- issue: βασανίζῃ में वाच्य और काल
  choice: स्वयं यातना पा रहे हो
  alternative: तुम यातना पाओगे
  rationale: मूल रूप वर्तमानकालीन मध्यम/कर्मवाच्य है। वर्तमान को बनाए रखने से वक्ता द्वारा अत्याचारी की धमकियों को उसकी अपनी यातना के रूप में प्रस्तुत करने का तनाव सुरक्षित रहता है; भविष्य का दण्ड अगले खण्ड में स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और तीखे प्रत्यक्ष सम्बोधन के साथ रखी गई है। ‘हे परम अपवित्र अत्याचारी’ मूल के प्रबल सम्बोधन को सुरक्षित रखता है। अर्धविराम दोनों न्याय-वक्तव्यों के घनिष्ठ सम्बन्ध को दिखाता है।
