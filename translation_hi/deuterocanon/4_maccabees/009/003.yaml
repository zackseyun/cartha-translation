  yaml_path: translation/deuterocanon/4_maccabees/009/003.yaml
  text: Counselor of lawlessness[a], tyrant, do not hate us; rather, have mercy on us more than on them.
translation:
  language: hi
  text: हे अधर्म के सलाहकार[a], अत्याचारी, हमसे घृणा न कर; बल्कि उन लोगों से बढ़कर हम पर दया कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य बहुत संक्षिप्त है; उसका अधिक शाब्दिक रूप है: “हे सलाहकार, अधर्म के अत्याचारी, हमसे उनसे बढ़कर घृणा न करते हुए, हम पर दया कर।” मुख्य पाठ में “उन लोगों से बढ़कर” का संबंध “हम पर दया कर” से जोड़ा गया है। पर उसका संबंध “हमसे घृणा न कर” से भी हो सकता है: “हमसे उनसे बढ़कर घृणा न कर।” इस पदबंध का अर्थ “उन लोगों के कारण” भी समझा जा सकता है।'
    reason: मूल यूनानी की संकुचित संरचना तथा ὑπὲρ αὐτούς के घृणा, दया, या कारण से संबंधित वैकल्पिक अर्थों को स्पष्ट करना।
lexical_decisions:
- source_word: σύμβουλε
  choice: सलाहकार
  rationale: यह संबोधनवाचक एकवचन है और सामान्यतः ‘सलाहकार’ या ‘परामर्शदाता’ का अर्थ देता है। यहाँ ‘सलाहकार’ सहज और सीधा है।
- source_word: τύραννε
  choice: अत्याचारी
  rationale: यह सताने वाले शासक को सीधे संबोधित करता है। ‘अत्याचारी’ उसके निरंकुश और नैतिक रूप से निंदनीय आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρανομίας
  choice: अधर्म के
  rationale: यह ‘व्यवस्था-विरोध, विधि-भंग या अधर्म’ का बोध कराने वाला संबंधकारक रूप है। ‘अधर्म के सलाहकार’ यूनानी की संक्षिप्त संरचना और नैतिक आरोप को बनाए रखता है।
- source_word: μὴ … μισῶν
  choice: घृणा न कर
  rationale: μή के साथ वर्तमान कृदंत यहाँ निषेधात्मक भाव देता है; हिन्दी में सीमित क्रिया से इसे स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ὑπὲρ αὐτοὺς
  choice: उन लोगों से बढ़कर
  rationale: ὑπέρ के साथ कर्मकारक तुलना का अर्थ दे सकता है। यह पदबंध यूनानी में संक्षिप्त और कुछ हद तक अस्पष्ट है, इसलिए मुख्य पाठ में तुलनात्मक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἡμᾶς
  choice: हमसे / हम पर
  rationale: यूनानी में सर्वनाम दो बार आया है—पहली बार घृणा के संबंध में और दूसरी बार दया के कर्म के रूप में। हिन्दी में दोनों को उनकी क्रियाओं के अनुसार स्वाभाविक कारकों में रखा गया है।
- source_word: ἐλέα
  choice: दया कर
  rationale: ἐλεέω का आज्ञार्थक भाव दया या करुणा दिखाने की विनती करता है। ‘दया कर’ संक्षिप्त, गंभीर और प्रसंगानुकूल है।
theological_decisions:
- issue: दोहराए गए ἡμᾶς और ὑπὲρ αὐτούς का संबंध
  choice: वक्ता अत्याचारी से कहता है कि वह उनसे घृणा न करे, बल्कि ‘उन लोगों से बढ़कर’ उन पर दया करे।
  alternative: इसका अर्थ ‘उन लोगों के कारण हमसे घृणा न कर; हम पर दया कर’ अथवा ‘उनसे बढ़कर हमसे घृणा न करते हुए हम पर दया कर’ भी समझा जा सकता है।
  rationale: प्रेषित यूनानी वाक्य संक्षिप्त और व्याकरणतः असहज है। ὑπέρ के साथ कर्मकारक सामान्यतः तुलना व्यक्त कर सकता है, पर वाक्य-विन्यास यह स्पष्ट नहीं करता कि तुलना ‘घृणा’ से जुड़ती है या ‘दया’ से। मुख्य पाठ अर्थपूर्ण तुलनात्मक विनती देता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता बचाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सीधा संबोधन रखा गया है। एकवचन ‘कर’ तीखे प्रत्यक्ष संबोधन और मूल यूनानी के एकवचन रूप को दर्शाता है। ‘अधर्म’ धार्मिक-नैतिक संदर्भ में παρανομία की व्यवस्था-विरोधी धार को बनाए रखता है।
