translation:
  language: hi
  text: इसलिए, जब यातना देने वालों[a] को आज्ञा दी गई, तो वे उनमें सबसे बड़े को आगे ले आए। उसका कुरता फाड़ने के बाद, उन्होंने उसके हाथों और बाँहों को दोनों ओर पट्टों से बाँध दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यातना देने वाले’ के लिए प्रयुक्त यूनानी कर्तावाचक संज्ञा का यह रूप पाठ और शब्द-प्रयोग की दृष्टि से असामान्य है; प्रसंग से स्पष्ट है कि ये राजा के वे लोग थे जो यातना दे रहे थे।
    reason: textual_variant
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह पिछले प्रसंग के परिणामस्वरूप अगली कार्रवाई का परिचय देता है; ‘इसलिए’ स्वाभाविक और स्पष्ट संबंध व्यक्त करता है।
- source_word: τὸν πρεσβύτατον αὐτῶν
  choice: उन भाइयों में सबसे बड़े को
  rationale: πρεσβύτατον सर्वोच्च अवस्था सूचित करता है, अर्थात केवल किसी बड़े को नहीं बल्कि समूह में सबसे बड़े भाई को; प्रसंग से ‘भाइयों’ का संबंध स्पष्ट है।
- source_word: κελευσθέντες
  choice: जब ... को आज्ञा मिली
  rationale: अओरिस्ट कर्मवाच्य कृदंत को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: οἱ μιστισταί
  choice: यातना देने वालों
  rationale: पाठ में कर्तावाचक संज्ञा का रूप असामान्य है, पर प्रसंग इसे राजा के उन लोगों के रूप में स्पष्ट करता है जो यातना दे रहे थे; ‘यातना देने वाले’ निष्पादन से अधिक तत्काल क्रिया पर केंद्रित है।
- source_word: παρήγαγον
  choice: आगे ले आए
  rationale: क्रिया किसी व्यक्ति को अधिकारियों या उपस्थित लोगों के सामने आगे प्रस्तुत करने का भाव रखती है।
- source_word: διαρρήξαντες τὸν χιτῶνα
  choice: उसका कुरता फाड़कर खोल दिया
  rationale: χιτών शरीर पर पहना जाने वाला अंदरूनी वस्त्र है; ‘कुरता’ आधुनिक हिन्दी में समझने योग्य निकटतम शब्द है और ‘फाड़कर खोल दिया’ हिंसक तैयारी को व्यक्त करता है।
- source_word: διέδησαν
  choice: बाँध दिया
  rationale: क्रिया दृढ़ता से बाँधने या कसने का अर्थ देती है; हिन्दी में ‘बाँध दिया’ स्पष्ट और स्वाभाविक है।
- source_word: τὰς χεῖρας αὐτοῦ καὶ τοὺς βραχίονας
  choice: उसके हाथों और बाँहों को
  rationale: दोनों शारीरिक अंगों का सीधा भेद बनाए रखा गया है और शरीर-रचना को अनावश्यक रूप से अधिक विशिष्ट नहीं किया गया।
- source_word: ἱμᾶσιν
  choice: पट्टों से
  rationale: ἱμάς पट्टे या चमड़े की पट्टी को सूचित कर सकता है; ‘पट्टों’ से सामग्री अनिश्चित रहते हुए बाँधने के साधन का अर्थ स्पष्ट होता है।
- source_word: ἑκατέρωθεν
  choice: दोनों ओर
  rationale: यह द्विपार्श्वीय स्थिति को दर्शाता है; ‘दोनों ओर’ संक्षिप्त और स्वाभाविक हिन्दी है।
