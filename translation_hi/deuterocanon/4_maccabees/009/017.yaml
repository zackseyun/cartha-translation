  text: But he said, “Your device is not so strong, you limbs of a demon, as to lead my reason away. Cut off my limbs, and burn my flesh, and wrench my joints.”
translation:
  language: hi
  text: लेकिन उसने कहा, “हे दानव के अंगो! तुम्हारा तरीका[a] इतना शक्तिशाली नहीं है कि मेरी विवेक-बुद्धि को डिगा सके। मेरे अंग काटो, मेरा मांस जलाओ और मेरे जोड़ मरोड़ो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तरीका” का अनुवाद “साधन,” “उपाय,” या “युक्ति” भी हो सकता है।
    reason: यूनानी τρόπος का अर्थ-क्षेत्र व्यापक है; यहाँ वह यातना देने के तरीके या साधन को सूचित करता है।
lexical_decisions:
- source_word: τρόπος
  choice: युक्ति
  rationale: यहाँ शब्द अत्याचारियों द्वारा अपनाए गए साधन या उपाय को सूचित करता है; ‘युक्ति’ उसके योजनाबद्ध तरीके और विफल प्रयास—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: μεροὶ δαῖμον
  choice: दुष्टात्मा के अंगो
  rationale: मूल का तीखा और असामान्य संबोधन शाब्दिक रूप से सुरक्षित रखा गया है; अत्याचारी मानो दुष्टात्मा के अंग हैं।
- source_word: λογισμός
  choice: विवेक-बुद्धि
  rationale: 4 मकाबियों में यह मनुष्य की तर्कशील, नैतिक रूप से निर्णय करने वाली शक्ति का प्रमुख शब्द है। ‘विवेक-बुद्धि’ केवल अमूर्त तर्क या सामान्य मन की अपेक्षा इस अर्थ-क्षेत्र को बेहतर व्यक्त करती है।
- source_word: ἆξαι
  choice: डिगा सके
  rationale: शाब्दिक अर्थ ‘ले जाए/बहका ले जाए’ है; इस प्रसंग में आशय उसकी विवेक-बुद्धि को दृढ़ स्थिति से हटाने या वश में करने का है।
- source_word: στρεβλοῦτε
  choice: मरोड़ो
  rationale: यह क्रिया जोड़ों को बलपूर्वक ऐंठने या विकृत करने की यातना बताती है; ‘मरोड़ो’ सीधा और प्रभावी हिन्दी रूप है।
theological_decisions:
- issue: λογισμός की भूमिका
  choice: विवेक-बुद्धि
  alternative: तर्क / मन
  rationale: पुस्तक में λογισμός नैतिक और तर्कशील आत्मसंयम का केंद्रीय विचार है। अनुवाद इसे न तो केवल बौद्धिक तर्क तक सीमित करता है, न किसी विशिष्ट दार्शनिक या सांप्रदायिक सिद्धांत में बदलता है।
- issue: μεροὶ δαῖμον का रूपक
  choice: दुष्टात्मा के अंगो
  alternative: दुष्टात्मा के सेवको
  rationale: ‘सेवक’ अर्थ को समझा देता, पर मूल के देह-संबंधी रूपक और उसी वाक्य में आने वाले अपने ‘अंगों’ के साथ उसकी तीखी शब्द-संगति को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यातना की आज्ञाएँ मूल की कठोरता के अनुरूप सीधी हैं। ‘अरे दुष्टात्मा के अंगो!’ असामान्य है, पर मूल यूनानी के जानबूझकर तीखे संबोधन और अंग-संबंधी शब्द-संगति को सुरक्षित रखता है।
