  text: And when all had marveled at his steadfast courage[a], the guards led in the second after the first in age, and after fitting iron claws onto his hands[c][b], they bound him to the instruments and the catapult.
translation:
  language: hi
  text: जब सब लोग उसके दृढ़ साहस पर चकित हो गए, तब अंगरक्षक उस भाई को ले आए जो पहले के बाद आयु-क्रम में दूसरा था। फिर उन्होंने लोहे के हाथों में तीखे नाखून जड़कर[a] उसे यातना के उपकरणों और कटापल्ट से बाँध दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लोहे के हाथ’ और ‘तीखे नाखून’ का अर्थ संभवतः हाथों के आकार के लोहे के यातना-उपकरण हैं, जिनमें नाखूनों या पंजों जैसी तीखी नोकें लगी थीं। यूनानी वाक्यांश यह स्पष्ट नहीं करता कि ये उपकरण उसके शरीर पर ठीक कैसे लगाए गए थे।
    reason: सांस्कृतिक और शाब्दिक स्पष्टीकरण
  - marker: b
    text: यूनानी शब्द का सामान्य अर्थ प्राचीन प्रक्षेपक यंत्र, अर्थात् ‘कटापल्ट’, है। इस यातना-प्रसंग में यह किसी यांत्रिक यातना-उपकरण को सूचित कर सकता है; इसका सटीक रूप अनिश्चित है।
    reason: शाब्दिक विकल्प और प्रसंगगत अनिश्चितता
lexical_decisions:
- source_word: θαυμασάντων
  choice: चकित हो गए
  rationale: अपूर्ण नहीं बल्कि मुख्य घटना से पहले पूरी हुई प्रतिक्रिया व्यक्त करने वाले यूनानी एओरिस्ट कृदंत का स्वाभाविक हिन्दी रूप।
- source_word: καρτεροψυχίαν
  choice: दृढ़ साहस
  rationale: यह शब्द पीड़ा के बीच आत्मिक दृढ़ता और साहस—दोनों का भाव रखता है; ‘दृढ़ साहस’ आधुनिक हिन्दी में दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: δορυφόροι
  choice: अंगरक्षक
  rationale: शाब्दिक अर्थ ‘भाला ढोने वाले’ है, पर यह पद राजकीय पहरेदारों या अंगरक्षकों के लिए प्रयुक्त होता था; प्रसंग में ‘अंगरक्षक’ स्वाभाविक है।
- source_word: τὸν καθʼ ἡλικίαν τοῦ προτέρου δεύτερον
  choice: उस भाई को ... जो आयु में पहले भाई के बाद दूसरे स्थान पर था
  rationale: वाक्यांश भाई की आयु-क्रम में स्थिति बताता है। यह रूप मूल की कुछ असामान्य संरचना को स्पष्ट, किंतु बिना अनावश्यक व्याख्या के, व्यक्त करता है।
- source_word: σιδηρᾶς ... χεῖρας
  choice: लोहे के हाथ
  rationale: मूल में χεῖρας का सीधा अर्थ ‘हाथ’ है। इसे ‘पंजे’ मात्र कहना अगले पद ὄνυξιν के साथ भेद मिटा देता; इसलिए मूल बिंब सुरक्षित रखा गया है।
- source_word: ὀξέσι τοῖς ὄνυξιν
  choice: तीखे पंजों वाले
  rationale: ὄνυξ नाखून, पंजा या तालोन का अर्थ दे सकता है। यातना-यंत्र के उभरे हुए तीखे, हुक-जैसे भागों के लिए ‘तीखे पंजे’ सजीव और प्रसंगानुकूल है।
- source_word: ὀργάνοις
  choice: यातना के औज़ारों
  rationale: शब्द सामान्यतः औज़ार या उपकरण है; यहाँ यातना का प्रसंग उसका प्रयोजन स्पष्ट करता है, इसलिए हिन्दी में यह हल्का स्पष्टीकरण स्वाभाविक है।
- source_word: καταπέλτῃ
  choice: यंत्र-धनुष
  rationale: καταπέλτης सामान्यतः प्राचीन प्रक्षेपक युद्ध-यंत्र है। ‘यंत्र-धनुष’ उसके मूल चित्र को रखता है, जबकि पादटिप्पणी प्रसंग में संभावित यातना-यंत्र का अर्थ बताती है।
- source_word: προσεδήσαν
  choice: से बाँध दिया
  rationale: क्रिया का अर्थ किसी वस्तु से बाँधना या कसकर लगा देना है; ‘से बाँध दिया’ हिन्दी में सीधा और स्वाभाविक है।
