lexical_decisions:
- source_word: περὶ ὃν
  choice: उस पर
  rationale: 'यह पदबंध पहले बताए गए यातना-यंत्र की ओर संकेत करता है। κατατεινόμενος के साथ इसका स्थानवाचक अर्थ स्वाभाविक है: युवक को उस यंत्र पर या उसके सहारे तानकर बाँधा जा रहा था।'
- source_word: κατατεινόμενος
  choice: खींचकर बाँधा जा रहा था
  rationale: वर्तमान मध्य/कर्मवाच्य कृदंत यहाँ युवक को यातना-यंत्र पर कसकर ताने जाने की चलती हुई क्रिया बताता है। हिंदी में संयुक्त अभिव्यक्ति यंत्र पर खींचे और जकड़े जाने, दोनों भावों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: εὐγενὴς
  choice: कुलीन
  rationale: शब्द जन्मगत प्रतिष्ठा और चरित्रगत उदात्तता, दोनों का संकेत दे सकता है। ‘कुलीन’ मूल अर्थ के निकट रहते हुए युवक की गरिमा भी बनाए रखता है।
- source_word: νεανίας
  choice: युवक
  rationale: यह आयु का सीधा और आधुनिक मानक हिंदी में स्वाभाविक सूचक है।
- source_word: ἔξαρθρος ἐγίνετο
  choice: अंग-अंग से जोड़ों से उखड़ता जा रहा था
  rationale: ἔξαρθρος का अर्थ ‘जोड़ से बाहर’ है और अपूर्णकालीन ἐγίνετο जारी प्रक्रिया दिखाता है। यह अनुवाद शरीर के क्रमशः जोड़ उखड़ने का भाव रखता है, पर अंग काटे जाने का अधिक तीव्र अर्थ नहीं जोड़ता।
