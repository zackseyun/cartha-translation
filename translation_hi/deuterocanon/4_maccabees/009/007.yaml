  text: Go on, then, tyrant; and if you kill our lives because of godliness, do not suppose that by torturing us you are harming us.
translation:
  language: hi
  text: “तो फिर, हे अत्याचारी शासक, आज़मा ले! और यदि तू भक्ति के कारण हमारे प्राण भी ले ले, तो यह मत समझना कि हमें यातना देकर तू हमें हानि पहुँचा रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεῖραζε
  choice: आज़मा ले
  rationale: आज्ञार्थक क्रिया चुनौती देने के भाव में है; ‘आज़मा ले’ उस उकसाने वाली दृढ़ता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τύραννε
  choice: हे अत्याचारी
  rationale: प्रत्यक्ष संबोधन और τύραννος के दमनकारी शासक संबंधी नकारात्मक भाव, दोनों सुरक्षित रहते हैं।
- source_word: ψυχὰς
  choice: प्राण
  rationale: यहाँ θανατώσεις के साथ अर्थ जीवित प्राण/जीवन लेने का है; ‘प्राण ले ले’ स्वाभाविक हिन्दी है और अनावश्यक रूप से किसी विशिष्ट आत्मा-सिद्धान्त को आरोपित नहीं करता।
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: ईश्वर के प्रति श्रद्धापूर्ण निष्ठा और धार्मिक आचरण का भाव संक्षेप में व्यक्त होता है।
- source_word: βασανίζων
  choice: यातना देकर
  rationale: शारीरिक उत्पीड़न का स्पष्ट और प्रसंगानुकूल अनुवाद।
- source_word: βλάπτειν
  choice: हानि कर रहा है
  rationale: मूल के सामान्य ‘नुकसान पहुँचाना’ भाव को बिना यह तय किए बनाए रखता है कि कथन शारीरिक, नैतिक या अंतिम हानि की ओर संकेत करता है।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: प्राण
  alternative: आत्माएँ / जीवन
  rationale: मृत्यु देने की क्रिया के साथ ‘प्राण लेना’ प्रसंगानुकूल है। इससे ψυχή को केवल देह से पृथक अमर ‘आत्मा’ के तकनीकी अर्थ में बाँधने से बचते हुए मूल की व्यक्ति-जीवन संबंधी व्यापकता बनी रहती है।
- issue: यातना के बावजूद हानि न होने का दावा
  choice: ‘हमारी हानि कर रहा है’ को सामान्य और खुला रखा गया
  alternative: ‘वास्तविक/आत्मिक हानि’ जोड़ना
  rationale: मूल पाठ हानि के प्रकार की व्याख्या नहीं करता; अतिरिक्त विशेषण धर्मवैचारिक निष्कर्ष थोपते।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, निर्भीक और प्रत्यक्ष चुनौती का स्वर। एकवचन ‘तू’ अपमानजनक लापरवाही नहीं, बल्कि अत्याचारी के सामने वक्ता की निर्भीक अवज्ञा व्यक्त करता है।
