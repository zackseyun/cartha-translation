  text: Imitate me[a], brothers, he said, on the rack; do not desert by abandoning the struggle when I have not left it, nor through me renounce the brotherhood of courage. Wage the holy and noble campaign for godliness[c][b],
translation:
  language: hi
  text: यातना-यंत्र पर पड़े हुए उसने कहा, “भाइयो, मेरा अनुकरण करो[a]। जब मैं संघर्ष नहीं छोड़ रहा हूँ, तब तुम भी उसे छोड़कर भगोड़े मत बनो[b] और मेरे कारण साहस के भाईचारे को मत त्यागो। परमेश्वर-भक्ति[c] के लिए पवित्र और श्रेष्ठ युद्ध लड़ो,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे उदाहरण पर चलो।” यूनानी अभिव्यक्ति यातना-यंत्र के ठोस बिंब को भी जगाती है।
    reason: lexical_alternative
  - marker: b
    text: या “अपनी सैनिक पंक्ति मत छोड़ो।” यूनानी क्रिया में सैनिक अर्थ है।
    reason: lexical_alternative
  - marker: c
    text: या “धर्मपरायणता।” यहाँ अर्थ परमेश्वर के प्रति श्रद्धापूर्ण और निष्ठावान जीवन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στρεβλὰς
  choice: यातना-यंत्र पर
  rationale: पाठ का रूप कठिन है, पर प्रसंग विशेष रूप से शरीर को मरोड़ने या खींचने वाले यातना-यंत्र की ओर संकेत करता है। ठोस बिंब को सामान्य ‘यातना सहते हुए’ में विलीन नहीं किया गया।
- source_word: Μιμήσασθέ με
  choice: मेरा अनुकरण करो
  rationale: आज्ञार्थक क्रिया वक्ता के उदाहरण का अनुसरण करने का सीधा आह्वान करती है; यह हिन्दी में संक्षिप्त और अर्थनिष्ठ है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: कथा में संबोधित व्यक्ति उसके वास्तविक भाई हैं, इसलिए पुल्लिंग और पारिवारिक संबोधन बनाए रखा गया है।
- source_word: μὴ λειπὼν τὸν ἀγῶνα
  choice: मैंने यह संघर्ष नहीं छोड़ा है
  rationale: ἀγών परीक्षा, प्रतियोगिता या संघर्ष का बिंब रखता है। ‘संघर्ष’ यातना के प्रसंग और आगे की सैनिक भाषा—दोनों से स्वाभाविक रूप से जुड़ता है।
- source_word: λειποτακτήσητε
  choice: अपनी पंक्ति से मत भागो
  rationale: क्रिया सैनिक पंक्ति छोड़कर भागने या भगोड़ा बनने का भाव रखती है। हिन्दी में यह सैनिक रूपक को स्पष्ट और स्वाभाविक रखती है।
- source_word: ἐξομόσησθέ
  choice: मुकर न जाओ
  rationale: यह शपथपूर्वक नकारने, त्यागने या संबंध से मुकरने का अर्थ दे सकती है। ‘मुकर न जाओ’ भारपूर्ण है, पर शपथ के भाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὴν τῆς εὐψυχίας ἀδελφότητα
  choice: साहस के भाईचारे
  rationale: εὐψυχία विपत्ति में साहस और दृढ़ मन का भाव रखता है, जबकि ἀδελφότης भाइयों के साझा बंधन को व्यक्त करता है। असामान्य किंतु अर्थपूर्ण संबंध को सरल करके मिटाया नहीं गया।
- source_word: ἱερὰν καὶ εὐγενῆ στρατείαν στρατεύσασθε
  choice: यह पवित्र और श्रेष्ठ युद्ध लड़ो
  rationale: सजातीय संज्ञा-क्रिया सैनिक अभियान का सघन रूपक बनाती हैं। हिन्दी में ‘युद्ध लड़ो’ उस बल और कुछ हद तक पुनरुक्ति को बनाए रखता है।
- source_word: περὶ τῆς εὐσεβείας
  choice: परमेश्वर-भक्ति के लिए
  rationale: εὐσέβεια यहाँ परमेश्वर के प्रति श्रद्धापूर्ण, आचरण में प्रकट निष्ठा को दर्शाती है। ‘परमेश्वर-भक्ति’ सामान्य ‘भक्ति’ की संभावित अस्पष्टता को दूर करती है, बिना इसे किसी संप्रदायगत अर्थ में सीमित किए।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अर्थ
  choice: परमेश्वर-भक्ति
  alternative: धर्मपरायणता / भक्ति
  rationale: यह शब्द केवल भीतरी धार्मिक भावना नहीं, बल्कि उत्पीड़न में परमेश्वर के प्रति अटल निष्ठा को भी व्यक्त करता है। ‘परमेश्वर-भक्ति’ इस संबंध को स्पष्ट रखते हुए नैतिक और उपासना-संबंधी दोनों आयामों को खुला रखती है।
- issue: ἀδελφοί का लिंग और संबंध
  choice: भाइयो
  alternative: भाई-बहनो / साथियो
  rationale: इस कथा में संबोधित लोग वास्तविक भाई हैं; अतः समावेशी सामान्यीकरण कथात्मक तथ्य को धुंधला कर देता।
- issue: साहस और भाईचारे का संबंध
  choice: साहस के भाईचारे से मुकर न जाओ
  alternative: हम भाइयों के साहस को मत त्यागो
  rationale: वैकल्पिक रूप अधिक सहज है, पर अमूर्त संज्ञा ἀδελφότης को ‘हम भाइयों’ में बदलकर व्याकरणिक और वैचारिक तनाव को सुलझा देता। मुख्य पाठ यूनानी की विशिष्ट अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध स्तर रखा गया है। सैनिक रूपकों—पंक्ति छोड़ना और युद्ध लड़ना—को संरक्षित किया गया है। वाक्य को हिन्दी में स्पष्ट बनाने के लिए यूनानी कृदंत-रचना को दो समन्वित वाक्यांशों में खोला गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
