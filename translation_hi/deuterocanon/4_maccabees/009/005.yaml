  yaml_path: translation/deuterocanon/4_maccabees/009/005.yaml
  text: But you are trying to frighten us by threatening us with death through tortures[a], as though you had not learned from Eleazar a little while ago.
translation:
  language: hi
  text: पर तुम यातनाओं के द्वारा हमें मार डालने की धमकी देकर हमें डराते हो, मानो तुमने थोड़ी ही देर पहले एलीआज़र से कुछ सीखा ही न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो तुमने अभी हाल में एलीआज़र से कुछ भी न सीखा हो।” यह कथन व्यंग्यात्मक और अलंकारिक है; इसका शाब्दिक अर्थ यह नहीं कि उसने एलीआज़र का उदाहरण देखा ही नहीं था।
    reason: अलंकारिक अर्थ और वैकल्पिक शब्दावली को स्पष्ट करना
lexical_decisions:
- source_word: ἐκφοβεῖς
  choice: डराना चाहते हो
  rationale: वर्तमानकालीन सक्रिय क्रिया यहाँ भय उत्पन्न करने के प्रयास का संकेत देती है। यह अभिव्यक्ति प्रसंग के तिरस्कारपूर्ण प्रत्युत्तर को स्वाभाविक आधुनिक हिन्दी में रखती है।
- source_word: ἀπειλῶν
  choice: धमकी से
  rationale: कृदंत मुख्य क्रिया के साधन को बताता है—वह धमकी देकर उन्हें डराना चाहता है। हिन्दी में ‘धमकी से’ यही संबंध संक्षेप और सहज रूप में व्यक्त करता है।
- source_word: διὰ τῶν βασάνων ἡμῖν θάνατον
  choice: हमें यातनाएँ देकर मार डालने
  rationale: διά के साथ संबंधकारक यातनाओं को मृत्यु का साधन बताता है। ‘यातनाएँ देकर मार डालने’ यूनानी अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है और βασάνων के बहुवचन भाव को बनाए रखता है।
- source_word: πρὸ βραχέως
  choice: थोड़ी ही देर पहले
  rationale: यह मुहावरा थोड़े समय पूर्व की घटना बताता है; ‘थोड़ी ही देर पहले’ निकट अतीत और कथात्मक संदर्भ दोनों को स्पष्ट रखता है।
- source_word: παρὰ Ἐλεαζάρου μαθών
  choice: एलीआज़र से कुछ सीखा
  rationale: μανθάνω के साथ παρά और संबंधकारक सीखने के स्रोत को दर्शाते हैं। ‘एलीआज़र से ... सीखा’ उसके हाल के उदाहरण से मिलने वाली शिक्षा की ओर संकेत बनाए रखता है।
theological_decisions:
- issue: ὥσπερ οὐχί से आरम्भ होने वाली अलंकारिक तुलना का बल
  choice: मानो तुमने ... कुछ सीखा ही न हो
  alternative: हालाँकि तुमने ... एलीआज़र से सीख लिया था
  rationale: यूनानी वाक्य शासक के आचरण को इस प्रकार व्यंग्यपूर्वक प्रस्तुत करता है, मानो एलीआज़र का उदाहरण उसे कोई शिक्षा दे ही न सका हो। ‘मानो ... न हो’ मूल की तुलना, व्यंग्य और तनाव को बिना व्याख्यात्मक निष्कर्ष थोपे सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यातनाएँ देकर मार डालने’ औपचारिक ‘यातनाओं के द्वारा मृत्यु’ की अपेक्षा अधिक स्वाभाविक है, जबकि मूल का साधन-संबंध सुरक्षित रहता है।
