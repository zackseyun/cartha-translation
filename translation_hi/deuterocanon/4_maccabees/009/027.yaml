  rationale: प्रसंग उत्पीड़न के सामने उसकी दृढ़ नैतिक इच्छा पर बल देता है। 'संकल्प' इच्छात्मक और नैतिक पक्ष बनाए रखता है, पर किसी बाद की धर्मसैद्धांतिक धारणा को नहीं जोड़ता।
