  rationale: γνώμη यहाँ मात्र राय नहीं, बल्कि स्थिर इच्छा या मनोभाव है; εὐγενῆ नैतिक उत्कृष्टता व्यक्त करता है, जिसे 'उदात्त' स्वाभाविक रूप से संप्रेषित करता है।
