  yaml_path: translation/deuterocanon/4_maccabees/009/001.yaml
  text: What are you waiting for[b][a], O tyrant? For we are ready to die rather than transgress the commandments of our fathers.
translation:
  language: hi
  text: “हे अत्याचारी, तू क्यों हिचकिचा रहा है?[a] क्योंकि हम अपने पितरों की आज्ञाओं[b] का उल्लंघन करने के बजाय मरने के लिए तैयार हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू किस बात की प्रतीक्षा कर रहा है?” यूनानी मुहावरा देर करने या हिचकिचाने—दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी पैतृक आज्ञाओं।” इसका आशय यहूदी परंपरा में पूर्वजों से मिली आज्ञाओं से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί μέλλεις
  choice: तू क्यों हिचकिचा रहा है?
  rationale: यह मुहावरा कार्य करने में देर या हिचकिचाहट को चुनौतीपूर्ण प्रश्न के रूप में व्यक्त करता है। ‘क्यों हिचकिचा रहा है’ यूनानी की वाक्पटु चुनौती को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: ὦ τύραννε
  choice: हे अत्याचारी
  rationale: τύραννος यहाँ दमनकारी शासक के लिए निंदात्मक संबोधन है। ‘हे अत्याचारी’ प्रत्यक्ष संबोधन और नैतिक निंदा दोनों को बनाए रखता है।
- source_word: ἑτοῖμοι
  choice: तैयार
  rationale: शब्द तत्परता या तैयारी को दर्शाता है; ‘तैयार’ इसका सहज हिन्दी समानार्थी है।
- source_word: ἀποθνήσκειν
  choice: मरने
  rationale: यूनानी क्रिया का सीधा अर्थ ‘मरना’ है। प्रसंग में हत्या किए जाने की बात है, पर मूल पाठ यहाँ कर्मवाच्य रूप स्पष्ट नहीं करता।
- source_word: ἢ
  choice: के बजाय
  rationale: यहाँ ἢ दो विकल्पों में तुलना दिखाता है, जिसमें आज्ञा-उल्लंघन की अपेक्षा मृत्यु स्वीकार की जाती है।
- source_word: παραβαίνειν
  choice: उल्लंघन करने
  rationale: यह आज्ञा की सीमा लाँघने या उसे तोड़ने का अर्थ देता है। ‘उल्लंघन’ धार्मिक-नैतिक प्रसंग के अनुरूप गरिमापूर्ण और स्पष्ट है।
- source_word: τὰς πατρίους ἡμῶν ἐντολάς
  choice: अपने पितरों की आज्ञाओं
  rationale: πατρίους विरासत में मिली पैतृक/पूर्वजों की परंपरा को सूचित करता है। ‘अपने पितरों की आज्ञाएँ’ मूल के पुरुषवाची पैतृक संकेत को बनाए रखता है।
theological_decisions:
- issue: πατρίους ἡμῶν में पैतृक भाषा
  choice: अपने पितरों की आज्ञाओं
  alternative: अपनी पैतृक आज्ञाओं / अपने पूर्वजों से मिली आज्ञाओं
  rationale: यूनानी में पैतृक, पुरुषवाची पूर्वज-संबंधी भाषा है। ‘पितरों’ उस रूप को सुरक्षित रखता है, जबकि फुटनोट स्पष्ट करता है कि आशय विरासत में मिली यहूदी आज्ञाओं से है।
- issue: मृत्यु और आज्ञा-उल्लंघन के बीच विकल्प
  choice: उल्लंघन करने के बजाय मरने के लिए तैयार
  alternative: मरने या आज्ञाओं का उल्लंघन करने के लिए तैयार
  rationale: व्याकरणिक रूप से ἢ तुलना का चिह्न है; प्रसंग में वक्ता दोनों विकल्पों के लिए तैयार नहीं, बल्कि उल्लंघन की अपेक्षा मृत्यु चुनते हैं। ‘के बजाय’ इस निहित विरोध को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और चुनौतीपूर्ण शैली रखी गई है। राजा को संबोधित एकवचन ‘तू’ मूल की निर्भीकता और तिरस्कार को व्यक्त करता है; ‘हे’ संबोधन को साहित्यिक गरिमा देता है।
