lexical_decisions:
- source_word: ἡμεῖς μὲν γὰρ
  choice: क्योंकि हम तो
  rationale: ‘क्योंकि’ γάρ के कारणसूचक अर्थ को और ‘हम तो’ सर्वनाम के बल तथा μὲν से संकेतित आगामी विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆσδε τῆς κακοπαθείας
  choice: इस कष्ट के द्वारा
  rationale: κακοπάθεια पीड़ादायक कठिनाई या कष्ट को सूचित करता है; ‘इस’ समीपवाची संकेत को और ‘के द्वारा’ διά के साधनात्मक भाव को बनाए रखता है।
- source_word: ὑπομονῆς
  choice: धीरज
  rationale: यह कठिन परिस्थिति में दृढ़तापूर्वक टिके रहने का भाव देता है और आधुनिक हिन्दी में संक्षिप्त तथा सहज है।
- source_word: τὰ τῆς ἀρετῆς ἆθλα
  choice: सद्गुण के पुरस्कार
  rationale: ἆθλα प्रतियोगिता में पाए जाने वाले पुरस्कार हैं, जबकि ἀρετή यहाँ नैतिक सद्गुण या उत्कृष्टता को सूचित करता है; यह चुनाव प्रतियोगितात्मक रूपक को बनाए रखता है।
- source_word: οἴσομεν
  choice: जीत लेंगे
  rationale: ἆθλα के साथ φέρω का भाव पुरस्कार ‘ले जाने’ या ‘जीत लेने’ का है; ‘जीत लेंगे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रतियोगिता की छवि बनाए रखता है।
theological_decisions:
- issue: हेलेनवादी यहूदी शहादत-वर्णन में ἀρετή का अनुवाद
  choice: सद्गुण
  alternative: नैतिक उत्कृष्टता
  rationale: ‘सद्गुण’ पुस्तक की नैतिक शब्दावली को संक्षेप में व्यक्त करता है और पाठ में कोई बाद की साम्प्रदायिक या सिद्धान्तगत धारणा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘हम तो’ μὲν से संकेतित प्रसंगगत विरोध को खुला रखता है; पद के खंडात्मक स्वरूप के कारण अंत में अल्पविराम रखा गया है।
