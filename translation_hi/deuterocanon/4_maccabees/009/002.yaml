  yaml_path: translation/deuterocanon/4_maccabees/009/002.yaml
  text: For we would rightly bring shame on our ancestors if we did not make use of obedience to the law as our counselor and judgment[a].
translation:
  language: hi
  text: क्योंकि यदि हम व्यवस्था की आज्ञाकारिता से सलाह और विवेक का मार्गदर्शन न लें, तो हम उचित ही अपने पूर्वजों के लिए लज्जा का कारण बनेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि यदि हम व्यवस्था की आज्ञाकारिता से सलाह और समझ न लें, तो हम उचित ही अपने पूर्वजों के सामने लज्जित होंगे।”
    reason: αἰσχυνόμεθα को ‘लज्जित होना’ और συμβούλῳ καὶ γνώσει को ‘सलाह और समझ’ के रूप में समझने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: αἰσχυνόμεθα
  choice: हम ... अपने पूर्वजों को लज्जित करेंगे
  rationale: मध्य/कर्मवाच्य रूप और कर्मकारक τοὺς προγόνους के कारण मुख्य पाठ में पूर्वजों को लज्जित अथवा अपमानित करने का भाव रखा गया है; हिन्दी में ‘लज्जित करेंगे’ इस कारक-बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: προγόνους
  choice: अपने पूर्वजों
  rationale: यह पहले की पीढ़ियों को सूचित करता है; ‘पूर्वज’ आधुनिक, गरिमापूर्ण और सहज हिन्दी है।
- source_word: εἰκότως
  choice: उचित ही
  rationale: यह किसी परिणाम के उचित या युक्तिसंगत होने का नैतिक भाव व्यक्त करता है।
- source_word: τῇ τοῦ νόμου εὐπειθείᾳ
  choice: व्यवस्था की आज्ञाकारिता
  rationale: εὐπείθεια तत्पर आज्ञापालन को सूचित करता है; ‘आज्ञाकारिता’ व्यवस्था-केंद्रित नैतिक बल को बनाए रखती है।
- source_word: συμβούλῳ
  choice: अपना सलाहकार
  rationale: χράομαι के साथ प्रयुक्त दत्तिव συμβούλῳ उस भूमिका को बताता है जिसमें आज्ञाकारिता का उपयोग किया जाता है; ‘सलाहकार’ मूल के व्यक्तिकरण को सुरक्षित रखता है।
- source_word: γνώσει
  choice: विवेक
  rationale: γνῶσις का मूल अर्थ ज्ञान है, पर συμβούλῳ के साथ इस नैतिक संदर्भ में यह व्यावहारिक समझ या परख का भाव देता है; ‘विवेक’ हिन्दी में इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: χρησαίμεθα
  choice: न बनाएँ
  rationale: शाब्दिक अर्थ ‘उपयोग करें’ है, किंतु किसी वस्तु को सलाहकार और विवेक के रूप में उपयोग करने की हिन्दी अभिव्यक्ति ‘अपना ... बनाएँ’ अधिक स्वाभाविक है और साधनात्मक भाव बनाए रखती है।
theological_decisions:
- issue: αἰσχυνόμεθα ... τοὺς προγόνους में पूर्वजों के साथ नैतिक संबंध
  choice: व्यवस्था के प्रति आज्ञाकारिता न रखने से पूर्वज लज्जित होंगे।
  alternative: वक्ता अपने पूर्वजों के सामने लज्जित होंगे।
  rationale: कर्मकारक τοὺς προγόνους मुख्यतः पूर्वजों को लज्जा से प्रभावित पक्ष बताता है, इसलिए मुख्य पाठ में पैतृक विरासत को अपमानित करने का अर्थ रखा गया है। फिर भी क्रिया के मध्य/कर्मवाच्य रूप के कारण ‘पूर्वजों के सामने लज्जित होना’ संभव है, अतः उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘व्यवस्था’ धार्मिक विधि के स्थापित अर्थ में, ‘पूर्वज’ अनार्काइक ‘पुरखों’ के स्थान पर, और वाक्य-रचना गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है।
