- source_word: μετασχηματιζόμενος
  choice: रूपांतरित हो रहा हो
  rationale: वर्तमान मध्य/कर्मवाच्य कृदन्त में चल रहे परिवर्तन का भाव है; यह पद उस ऊँची आलंकारिक शैली को भी बनाए रखता है।
- source_word: εἰς ἀφθαρσίαν
  choice: अक्षयता में
  rationale: ἀφθαρσία का अर्थ नाश या क्षय से परे अवस्था है। ‘अक्षयता’ इस व्यापक अर्थ को रखती है और इसे केवल अनन्त जीवन तक सीमित नहीं करती।
- source_word: ὑπέμεινεν
  choice: सहा
  rationale: पीड़ा के अधीन दृढ़ बने रहने का अर्थ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐγενῶς
  choice: बड़े साहस और गौरव के साथ
  rationale: क्रियाविशेषण केवल वीरता नहीं, बल्कि उच्च और गरिमामय आचरण भी व्यक्त करता है; संयुक्त पदबंध हिन्दी पाठक के लिए दोनों भाव स्पष्ट करता है।
- source_word: τὰς
  choice: इन्हें
  rationale: दिया हुआ यूनानी अंश स्त्रीलिंग बहुवचन कर्मकारक उपपद पर टूट जाता है। प्रवाहमान हिन्दी के लिए ‘इन्हें’ रखा गया है, जबकि पादटिप्पणी स्रोत की अपूर्णता स्पष्ट करती है।
theological_decisions:
- issue: शहादत के प्रसंग में εἰς ἀφθαρσίαν का आशय
  choice: अक्षयता में
  alternative: अमरता में; अविनश्वरता में
  rationale: यूनानी शब्द नाशरहित या अक्षय अवस्था को सूचित करता है और केवल कभी न मरने का अर्थ अनिवार्य नहीं करता। ‘अक्षयता’ उसके व्यापक युगान्तकारी और नैतिक अनुनाद को बिना किसी अधिक विशिष्ट धर्मसैद्धान्तिक निष्कर्ष के सुरक्षित रखती है।
- issue: ὥσπερ के कारण रूपांतरण की प्रत्यक्षता
  choice: मानो ... रूपांतरित हो रहा हो
  alternative: जैसे वह ... रूपांतरित हो रहा था
  rationale: ‘मानो’ तुलना को बनाए रखता है और यह निश्चित नहीं करता कि कथन शाब्दिक, दर्शनात्मक या आलंकारिक रूपांतरण का दावा कर रहा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। ‘अक्षयता’ ऊँची धार्मिक-अलंकारिक भाषा को सुरक्षित रखती है; ‘बड़े साहस और गौरव के साथ’ εὐγενῶς के नैतिक और वीरतापूर्ण दोनों पहलुओं को सहज हिन्दी में व्यक्त करता है।
