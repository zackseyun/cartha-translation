lexical_decisions:
- source_word: ἀλλʼ
  choice: परन्तु
  rationale: यह संयोजक पिछले वर्णन के साथ स्पष्ट विरोध दर्शाता है; ‘परन्तु’ आधुनिक, गरिमापूर्ण हिन्दी में स्वाभाविक है।
- source_word: ὥσπερ
  choice: मानो ... हो
  rationale: यह वास्तविक रूपांतरण का सीधा दावा किए बिना उपमा या तुलनात्मक चित्र प्रस्तुत करता है।
- source_word: ἐν πυρί
