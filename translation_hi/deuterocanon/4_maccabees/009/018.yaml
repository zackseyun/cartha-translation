  text: क्योंकि मैं सभी यातनाओं के द्वारा तुम्हें विश्वास दिला दूँगा कि केवल इब्रानियों के पुत्र ही[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से “इब्रानियों के पुत्र”; वैकल्पिक अनुवाद: “इब्रानी युवक” या “इब्रानियों के बालक।”'
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध यूनानी पाठ यहाँ अलग से देखने पर वाक्य-विन्यास की दृष्टि से अधूरा प्रतीत होता है और संभवतः अगले पद में जारी रहता है; इस अनुवाद में अनकही बात जोड़कर वाक्य पूरा नहीं किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: διὰ πασῶν ... τῶν βασάνων
  choice: इन सभी यातनाओं के द्वारा
  rationale: διά के साथ संबंधकारक साधन या माध्यम प्रकट करता है, और बहुवचन πασῶν ... τῶν βασάνων का अर्थ ‘सभी यातनाएँ’ है। यह अनुवाद यूनानी वाक्य-विन्यास और व्यापकता दोनों को सुरक्षित रखता है।
- source_word: πείσω ὑμᾶς
  choice: तुम्हें विश्वास दिला दूँगा
  rationale: πείσω भविष्यकाल में ‘विश्वास दिलाऊँगा/कायल कर दूँगा’ का भाव देता है। यह यातनाओं के बीच प्रत्यक्ष प्रमाण द्वारा श्रोताओं को आश्वस्त करने के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: μόνοι
  choice: केवल ... ही
  rationale: μόνοι की विशिष्टतासूचक शक्ति को हिन्दी में ‘केवल ... ही’ से स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: οἱ παῖδες Ἑβραίων
  choice: इब्रानियों के पुत्र
  rationale: παῖδες संदर्भ में उन पुरुष भाइयों को सूचित करता है; ‘पुत्र’ उसके पुल्लिंग और वंशगत अर्थ को बनाए रखता है, जबकि संबंधकारक Ἑβραίων को ‘इब्रानियों के’ के रूप में संरक्षित किया गया है।
theological_decisions:
- issue: παῖδες का लिंग-सूचक अनुवाद
  choice: पुत्र
  alternative: बालक; युवक; संतान
  rationale: संदर्भ विशिष्ट पुरुष भाइयों का है, इसलिए ‘पुत्र’ उचित है। ‘संतान’ लिंगगत विशिष्टता को कम कर देता, जबकि ‘युवक’ मूल संबंधकारक और पारिवारिक भाव को समतल कर देता।
- issue: अपूर्ण यूनानी उपवाक्य
  choice: वाक्य को ‘ही’ पर अपूर्ण रहने देना
  alternative: अगले पद का अनुमानित आशय जोड़कर वाक्य पूरा करना
  rationale: प्राप्त यूनानी पाठ इस स्थान पर अकेले देखने पर वाक्य-विन्यास की दृष्टि से अधूरा है और संभवतः अगले पद में जारी रहता है। अनकहे शब्द जोड़ना वास्तविक पाठगत तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज रखी गई है। ‘विश्वास दिला दूँगा’ सामान्य पाठक के लिए स्वाभाविक है; ‘कायल कर दूँगा’ की अपेक्षा इसका भाव अधिक औपचारिक है। मूल पाठ की अपूर्णता को जानबूझकर सुरक्षित रखा गया है।
