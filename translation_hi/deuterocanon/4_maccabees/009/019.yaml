  yaml_path: translation/deuterocanon/4_maccabees/009/019.yaml
  text: They are unconquerable on behalf of virtue[a]. While he was still saying these things, they spread fire beneath him, and, by intensifying the wheel[c][b], they tightened it further.
translation:
  language: hi
  text: “सद्गुण के लिए वे अजेय हैं[a]।” वह अभी ये बातें कह ही रहा था कि उन्होंने उसके नीचे आग फैला दी और पहिए[b] को और झकझोरते हुए उसे और अधिक कसते गए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सद्गुण की खातिर।” यूनानी वाक्यांश उस उद्देश्य या कारण को सूचित कर सकता है जिसके लिए कोई कार्य करता या दुःख सहता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यातना देने के लिए प्रयुक्त पहिया।
    reason: cultural_note
  - marker: c
    text: अंतिम क्रिया का सटीक आशय कठिन है; वह पहिए पर तनाव या कसाव और बढ़ाने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἀρετῆς
  choice: सद्गुण के लिए
  rationale: ὑπέρ के साथ संबंधकारक यहाँ उस उद्देश्य या कारण को व्यक्त करता है जिसके लिए वे यातना सहते हैं। ‘सद्गुण’ ἀρετή की नैतिक-दार्शनिक अर्थछाया को संक्षेप और स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀνίκητοι
  choice: अजेय
  rationale: यह विशेषण ‘जिसे जीता न जा सके’ का भाव देता है; ‘अजेय’ आधुनिक हिन्दी में स्पष्ट और सशक्त है।
- source_word: ταῦτα λέγων ἔτι
  choice: वह अभी ये बातें कह ही रहा था
  rationale: ἔτι और वर्तमान कृदंत चल रहे कथन के बीच अगली कार्रवाई आरम्भ होने का भाव देते हैं; ‘ये बातें’ बहुवचन ταῦτα को दर्शाता है।
- source_word: πῦρ ἐπέστρωσαν
  choice: उन्होंने उसके नीचे आग फैला दी
  rationale: ἐπιστρώννυμι का मूल भाव फैलाने या बिछाने का है। यातना के प्रसंग में ‘उसके नीचे’ संदर्भ से पूरित है और क्रिया को बोधगम्य बनाता है।
- source_word: διερεθίζοντες τὸν τροχόν
  choice: पहिए को और उग्र करते हुए
  rationale: διερεθίζω उकसाने, भड़काने या तीव्र करने का भाव देता है। यूनानी में पहिया ‘घुमाने’ की क्रिया स्पष्ट नहीं है, इसलिए ‘और उग्र करते हुए’ तीव्रता को रखता है और अनावश्यक यांत्रिक विवरण नहीं जोड़ता।
- source_word: προσεπικατέτεινον
  choice: उसे अधिक कस दिया
  rationale: यह कठिन, गहनार्थक संयुक्त क्रिया तनाव या खिंचाव और बढ़ाने की ओर संकेत करती है। प्रसंग में ‘उसे अधिक कस दिया’ पीड़ित पर बढ़ते दबाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दार्शनिक और शहादत-संबंधी प्रसंग में ἀρετή का अनुवाद
  choice: सद्गुण
  alternative: नैतिक उत्कृष्टता
  rationale: ‘सद्गुण’ पुस्तक की नैतिक-दार्शनिक शब्दावली को सुरक्षित रखता है और किसी बाद की विशिष्ट धार्मिक पारिभाषिकता को आरोपित नहीं करता।
- issue: τροχός को यातना के उपकरण के रूप में कितना स्पष्ट करना है
  choice: मुख्य पाठ में ‘पहिया’
  alternative: यातना का पहिया
  rationale: यूनानी में केवल ‘पहिया’ है। स्रोत की संक्षिप्तता बनाए रखने के लिए मुख्य पाठ उसी रूप को रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। उद्धरण को पिछले कथन की समाप्ति मानकर उद्धरण-चिह्न दिए गए हैं। अस्पष्ट यांत्रिक प्रक्रिया को ‘पहिया घुमाना’ कहकर निश्चित नहीं किया गया; मूल की तीव्रता और अंतिम कसाव अलग-अलग बनाए रखे गए हैं।
