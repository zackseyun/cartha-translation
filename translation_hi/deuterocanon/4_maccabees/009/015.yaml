base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/015.yaml
  text: Most defiled tyrant[a], enemy of heavenly justice, and savage-minded man, you are not torturing me in this way because I have committed murder, nor because I have acted impiously, but because I am defending the divine law.
translation:
  language: hi
  text: “हे अत्यन्त अपवित्र अत्याचारी, स्वर्गीय न्याय[a] के शत्रु और क्रूरचित्त! तू मुझे इस प्रकार यातना इसलिए नहीं दे रहा कि मैंने हत्या की है, न इसलिए कि मैंने कोई अधर्म किया है, बल्कि इसलिए कि मैं ईश्वरीय व्यवस्था की रक्षा कर रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वर्गीय दण्ड।’ यूनानी शब्द व्यापक अर्थ में न्याय अथवा न्याय के फलस्वरूप मिलनेवाले दण्ड—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μιερώτατε
  choice: अत्यन्त अपवित्र
  rationale: यह विशेषण का संबोधनात्मक अत्युत्तम रूप है और धार्मिक तथा नैतिक अशुद्धता का तीखा आरोप लगाता है। ‘अत्यन्त अपवित्र’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῆς οὐρανίου δίκης
  choice: स्वर्गीय न्याय
  rationale: δίκη का अर्थ न्याय, न्यायिक दण्ड या न्यायपूर्ण प्रतिफल हो सकता है। ‘स्वर्गीय न्याय’ व्यापक नैतिक-न्यायिक अर्थ को बनाए रखता है और किसी एक प्रकार के दण्ड तक सीमित नहीं करता।
- source_word: ὠμόφρον
  choice: क्रूर-हृदय
  rationale: यह यौगिक शब्द क्रूर या निर्दयी मनोवृत्ति व्यक्त करता है। ‘क्रूर-हृदय’ आंतरिक स्वभाव पर बल देते हुए हिन्दी में स्पष्ट और प्रभावशाली है।
- source_word: καταικίζεις
  choice: यातना दे रहा
  rationale: शहादत और शारीरिक दुर्व्यवहार के संदर्भ में यह क्रिया हिंसक उत्पीड़न बताती है; ‘यातना दे रहा’ उस ठोस अर्थ और वर्तमान क्रिया दोनों को व्यक्त करता है।
- source_word: ἀνδροφονήσαντά
  choice: मैंने हत्या की है
  rationale: कृदन्त मनुष्य-वध या हत्या करने को बताता है। ‘हत्या की है’ अपराध के औपचारिक आशय को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: ἀσεβήσαντα
  choice: मैंने कोई अधर्म किया है
  rationale: यह शब्द ईश्वर या पवित्र कर्तव्यों के विरुद्ध आचरण को सूचित करता है। ‘अधर्म किया’ धार्मिक आयाम बनाए रखता है, यद्यपि हिन्दी में इसका अर्थ कुछ व्यापक भी हो सकता है।
- source_word: θείου νόμου
  choice: ईश्वरीय व्यवस्था
  rationale: θείου विशेषण का औपचारिक साम्य ‘ईश्वरीय’ से और νόμος का इस धार्मिक प्रसंग में स्वाभाविक अनुवाद ‘व्यवस्था’ से होता है।
- source_word: προασπίζοντα
  choice: रक्षा कर रहा हूँ
  rationale: क्रिया का अर्थ किसी के आगे खड़े होकर उसकी रक्षा करना या उसके पक्ष में लड़ना है। ‘रक्षा कर रहा हूँ’ स्पष्ट रूप से यही सक्रिय समर्थन व्यक्त करता है।
theological_decisions:
- issue: τῆς οὐρανίου δίκης में δίκη का अर्थ
  choice: व्यापक नैतिक-न्यायिक अर्थ में ‘स्वर्गीय न्याय’
  alternative: ‘स्वर्गीय दण्ड’ या ‘स्वर्गीय न्याय-दण्ड’
  rationale: यहाँ वक्ता अत्याचारी को स्वर्ग से आनेवाली न्यायपूर्ण व्यवस्था और प्रतिफल का विरोधी कहता है। ‘न्याय’ मूल शब्द की व्यापकता बनाए रखता है और उसके समय या स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: अनुवाद आधुनिक मानक हिन्दी में है, पर शहीद के तीखे और गरिमापूर्ण संबोधन को बनाए रखने के लिए ‘अत्यन्त अपवित्र’, ‘क्रूर-हृदय’ और ‘ईश्वरीय व्यवस्था’ जैसे कुछ औपचारिक पद रखे गए हैं। एकवचन ‘तू’ मूल यूनानी के सीधे, निंदात्मक संबोधन की तीव्रता व्यक्त करता है। फुटनोट चिह्न उसी पद ‘स्वर्गीय न्याय’ के बाद रखा गया है जिसकी वैकल्पिक व्याख्या दी गई है।
