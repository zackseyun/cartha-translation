  text: When they said these things[a], the tyrant was angered not only as against men who were disobedient, but was also enraged as against the ungrateful.
translation:
  language: hi
  text: जब उन्होंने ये बातें कहीं,[a] तो अत्याचारी उनके प्रति न केवल उन्हें आज्ञा न माननेवाले समझकर क्रोधित हुआ, बल्कि उन्हें कृतघ्न समझकर भी भड़क उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उन्होंने ये बातें कहीं, तो अत्याचारी न केवल आज्ञा न माननेवालों के विरुद्ध क्रोधित हुआ, बल्कि कृतघ्नों के विरुद्ध भी भड़क उठा।” यूनानी में दोनों विशेषण पुल्लिंग बहुवचन में हैं, पर उनके साथ कोई संज्ञा स्पष्ट रूप से नहीं दी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद भाइयों की पिछली बातों की ओर संकेत करता है; ‘ये बातें’ बहुवचन और प्रसंग-संबंध दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: εἰπόντων
  choice: जब उन्होंने ... कहीं
  rationale: यह संबंधकारक निरपेक्ष रचना में भूतकालिक कृदन्त है; ‘जब’ स्वाभाविक कालगत संबंध देता है, बिना क्रम को आवश्यकता से अधिक निश्चित किए।
- source_word: ὁ τύραννος
  choice: अत्याचारी
  rationale: τύραννος में दमनकारी शासक के प्रति लेखक का नकारात्मक मूल्यांकन निहित है; ‘राजा’ या ‘शासक’ इस धार को मंद कर देता।
- source_word: οὐ μόνον ... ἀλλʼ ... καὶ
  choice: न केवल ... बल्कि ... भी
  rationale: यूनानी सहसंबंधी रचना को प्रचलित और समानांतर हिन्दी रूप में व्यक्त किया गया है।
- source_word: ὡς κατὰ ἀπειθούντων
  choice: उन पर ... मानो वे आज्ञा न माननेवाले हों
  rationale: ὡς अत्याचारी की दृष्टि या आरोप को दर्शाता है और κατά संबंधकारक के साथ विरोधी भाव देता है। ‘मानो’ इस दृष्टिकोण को तथ्य के रूप में घोषित करने से बचाता है।
- source_word: ἐχαλέπαινεν
  choice: क्रोधित हुआ
  rationale: क्रिया तीव्र रोष व्यक्त करती है; हिन्दी में ‘क्रोधित हुआ’ गरिमापूर्ण और स्पष्ट है। प्रसंग में क्रोध के बढ़ने का भाव अगली तीव्रतर अभिव्यक्ति से उभरता है।
- source_word: ὡς καὶ κατὰ ἀχαρίστων
  choice: ऐसे लोगों पर भी ... मानो वे कृतघ्न हों
  rationale: फिर से ὡς अत्याचारी की धारणा को चिह्नित करता है; ἀχάριστος का स्वाभाविक हिन्दी समतुल्य ‘कृतघ्न’ है। संज्ञा निहित होने के कारण ‘ऐसे लोगों’ की पूर्ति की गई है।
- source_word: ὠργίσθη
  choice: भड़क उठा
  rationale: यह तीव्र क्रोध की परिणति व्यक्त करता है। ‘भड़क उठा’ पहले क्रियापद से भेद बनाए रखते हुए अओरिस्ट के अधिक निर्णायक भाव को स्वाभाविक हिन्दी में देता है।
