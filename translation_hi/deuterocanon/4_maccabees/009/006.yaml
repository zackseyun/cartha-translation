  yaml_path: translation/deuterocanon/4_maccabees/009/006.yaml
  text: But if the old men of the Hebrews died after enduring tortures because of godliness, how much more rightly should we, the young men, die, having disregarded the tortures of your compulsion, which the aged instructor also conquered.
translation:
  language: hi
  text: “पर यदि इब्रानियों के वृद्ध भक्ति के कारण यातनाएँ सहकर मर गए, तो हम युवाओं का मरना और भी अधिक न्यायोचित होगा, जिन्होंने तुम्हारी ज़बरदस्ती की यातनाओं को तुच्छ समझा है—वे यातनाएँ जिन पर उस वृद्ध शिक्षक ने भी विजय पाई।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धा और धर्मनिष्ठ आचरण, दोनों को समेटता है; ‘भक्ति’ प्रसंग में स्वाभाविक और संक्षिप्त है।
- source_word: βασανισμοὺς / βασάνους
  choice: यातनाएँ
  rationale: दोनों रूप शारीरिक उत्पीड़न और कठोर यातना को दर्शाते हैं; हिन्दी में एकरूपता रखी गई है।
- source_word: τῶν σῶν ἀναγκῶν
  choice: तुम्हारे दबाव से दी जाने वाली
  rationale: ἀνάγκη यहाँ शासक द्वारा बलपूर्वक बाध्य करने के अर्थ में है; संबंधवाचक यूनानी वाक्यांश को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ὑπεριδόντες
  choice: परवाह नहीं की
  rationale: शाब्दिक अर्थ ‘अनदेखा करना/तुच्छ समझना’ है; यहाँ यातनाओं से न डरने और उन्हें महत्व न देने का भाव है।
- source_word: παιδευτὴς
  choice: शिक्षक
  rationale: यह शिक्षा देने वाले गुरु या प्रशिक्षक को सूचित करता है; ‘शिक्षक’ सामान्य आधुनिक हिन्दी में उपयुक्त है।
- source_word: ἐνίκησεν
  choice: विजय पाई
  rationale: यूनानी क्रिया के विजय-संबंधी रूपक को बनाए रखता है, अर्थात यातनाएँ उसे अपने संकल्प से डिगा न सकीं।
theological_decisions:
- issue: διὰ τὴν εὐσέβειαν में मृत्यु और भक्ति का संबंध
  choice: भक्ति के कारण
  alternative: भक्ति की खातिर
  rationale: मूल में कारण और निष्ठा के लिए सहने—दोनों की छाया संभव है; सीधा कारणवाचक अनुवाद अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- issue: ἀποθάνοιμεν ἂν δικαιότερον की नैतिक तुलना
  choice: हम युवाओं के लिए मरना और भी अधिक उचित होगा
  alternative: हम युवाओं का मरना अधिक न्यायोचित होगा
  rationale: यह वक्ता की तुलनात्मक नैतिक दलील को बनाए रखता है, बिना शहादत के विषय में कोई अतिरिक्त धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी उद्धृत वाणी, गंभीर और साहसी स्वर। ‘वृद्ध जन’ तथा ‘वृद्ध शिक्षक’ से γέροντες और γέρων का संबंध सुरक्षित रखा गया है। वाक्य को पठनीय बनाने के लिए अर्धविराम और कारणसूचक उपवाक्य का प्रयोग किया गया है।
