  yaml_path: translation/deuterocanon/4_maccabees/009/004.yaml
  text: For we consider your pity for our unlawful deliverance to be harsher than death itself[a].
translation:
  language: hi
  text: क्योंकि हम मानते हैं कि हमें व्यवस्था के विरुद्ध बचाने के लिए दिखाई गई तुम्हारी दया स्वयं मृत्यु से भी अधिक कठोर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे व्यवस्था-विरुद्ध प्राणरक्षण पर तुम्हारी दया”; अथवा, “हमें अनुचित रीति से बचाने के उद्देश्य से की गई तुम्हारी करुणा।”
    reason: ‘दया’, ‘व्यवस्था के विरुद्ध’ और ‘बचाने’ से संबद्ध यूनानी पदबंध के वैकल्पिक, किंतु संभव अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: χαλεπώτερον
  choice: अधिक कठोर
  rationale: तुलनात्मक रूप किसी बात के अधिक कठिन, दुःखद या असह्य होने का भाव देता है। यहाँ नैतिक और भावनात्मक तीव्रता के लिए ‘अधिक कठोर’ उपयुक्त है।
- source_word: αὐτοῦ τοῦ θανάτου
  choice: स्वयं मृत्यु से भी
  rationale: तुलना में आए संबंधकारक और बलसूचक αὐτοῦ को स्वाभाविक हिन्दी में ‘स्वयं मृत्यु से भी’ व्यक्त करता है।
- source_word: νομίζομεν
  choice: हम मानते हैं
  rationale: यह विचारपूर्वक किए गए आकलन या निर्णय को व्यक्त करता है; ‘हम मानते हैं’ आधुनिक हिन्दी में सहज है।
- source_word: ἔλεον
  choice: दया
  rationale: यहाँ अत्याचारी द्वारा प्राण छोड़ देने के प्रस्ताव के अर्थ में करुणा या रहम है। ‘दया’ सामान्य और गरिमापूर्ण है तथा अनावश्यक धर्मवैज्ञानिक अर्थ नहीं जोड़ती।
- source_word: παρανόμῳ
  choice: व्यवस्था के विरुद्ध
  rationale: παράνομος का अर्थ नियम या व्यवस्था के विरुद्ध है। प्रसंग में यह पैतृक व्यवस्था का उल्लंघन करके जीवन बचाने को दर्शाता है।
- source_word: σωτηρίᾳ
  choice: बचाने
  rationale: यहाँ आशय मृत्यु से प्राण बचाने का है, धर्मवैज्ञानिक उद्धार का नहीं। क्रियात्मक रूप हिन्दी में संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐπὶ τῇ παρανόμῳ σωτηρίᾳ ἡμῶν
  choice: हमें व्यवस्था के विरुद्ध बचाने के लिए
  rationale: यह पदबंध दया के उद्देश्य या संदर्भ को बताता है—ऐसे उपाय से उन्हें जीवित रखना जिसमें व्यवस्था का उल्लंघन हो।
theological_decisions:
- issue: क्या σωτηρία को धर्मवैज्ञानिक ‘उद्धार’ के रूप में अनूदित किया जाए
  choice: बचाने
  alternative: उद्धार
  rationale: पद का विषय व्यवस्था तोड़कर शारीरिक मृत्यु से बचना है, न कि सिद्धान्तगत या आत्मिक उद्धार। इसलिए ‘बचाने’ मूल प्रसंग को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘व्यवस्था’ से प्रसंग की पैतृक धार्मिक व्यवस्था का संकेत मिलता है, और वाक्य की कठोर नैतिक अस्वीकृति सुरक्षित रहती है।
