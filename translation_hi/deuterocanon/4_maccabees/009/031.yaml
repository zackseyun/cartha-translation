  text: For I, by the pleasures that come through virtue, lighten the pain.
translation:
  language: hi
  text: क्योंकि मैं सद्गुण से मिलने वाले मधुर सुखों के द्वारा पीड़ा को हल्की करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέσι … ἡδοναῖς
  choice: सुखों के द्वारा
  rationale: दोनों शब्द सुख और आनंद के अर्थ-क्षेत्र से हैं; दत्तिव कारक यहाँ साधन बताता है। हिन्दी में दोनों को अलग-अलग दोहराना अस्वाभाविक होता, इसलिए संयुक्त वाक्यांश मूल के आशय और उसके विरोधाभास—पीड़ा के बीच सद्गुणजनित सुख—को बनाए रखता है।
- source_word: διὰ τὴν ἀρετήν
  choice: सद्गुण से मिलनेवाले
  rationale: διά के साथ कर्मकारक कारण या माध्यम का संबंध व्यक्त कर सकता है। यहाँ सुखों का संबंध सद्गुण से उनके स्रोत या अवसर के रूप में है; यह प्रयोग उस संबंध को स्वाभाविक हिन्दी में खुला रखता है।
- source_word: τὸν πόνον
  choice: पीड़ा को
  rationale: πόνος परिश्रम, कष्ट या पीड़ा हो सकता है। यातना के तात्कालिक संदर्भ में ‘पीड़ा’ शारीरिक दुःख को सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐπικουφίζομαι
  choice: हल्का कर लेता हूँ
  rationale: क्रिया बोझ या तीव्रता कम करने का रूपक रखती है। ‘हल्का कर लेता हूँ’ मध्यमवाच्य की आत्म-संबद्ध छाया और मूल रूपक दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀρετή का नैतिक-दार्शनिक बल
  choice: सद्गुण
  alternative: श्रेष्ठता
  rationale: 4 मक्काबियों में ἀρετή नैतिक उत्कृष्टता, विवेकपूर्ण भक्ति और दुःख में दृढ़ता से जुड़ी है। ‘सद्गुण’ इस नैतिक-दार्शनिक अर्थ को सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सहज रखी गई है। ‘सुखों’ और ‘पीड़ा’ का जानबूझकर रखा गया विरोध मूल कथन के नैतिक विरोधाभास को सुरक्षित करता है।
