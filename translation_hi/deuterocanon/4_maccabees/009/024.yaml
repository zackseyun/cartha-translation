revisions:
- from: जिसके द्वारा हमारा धर्ममय और पैतृक दैवी विधान[a], राष्ट्र पर कृपालु होकर, उस शापित[b] अत्याचारी को दण्ड दे।
  to: जिसके द्वारा हमारी न्यायपूर्ण और पैतृक देखरेख, राष्ट्र के प्रति अनुकूल होकर, उस शापित तानाशाह को दण्ड दे।
  rationale: The revision corrects the central lexical mismatch by replacing ‘दैवी विधान’ with ‘देखरेख,’ which can convey providential oversight without importing an explicit divine subject or the distinct sense of a decree. It also renders τύραννος as ‘तानाशाह,’ retains the optative in ‘दण्ड दे,’ and uses a more natural Hindi construction for favorable disposition toward the nation. Footnote a is adjusted to explain the chosen sense without claiming that ‘विधान’ is the primary meaning in this context.
  reviewer_model: gpt-5.6-terra
