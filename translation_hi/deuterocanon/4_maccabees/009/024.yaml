translation:
  language: hi
  text: जिसके द्वारा हमारी न्यायपूर्ण और पैतृक देखरेख, राष्ट्र के प्रति अनुकूल होकर, उस शापित तानाशाह को दण्ड दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διʼ ἧς
  choice: जिसके द्वारा
  rationale: διά के साथ सम्बन्धवाचक सर्वनाम यहाँ साधन व्यक्त करता है और पिछले स्त्रीलिंग पूर्वपद की ओर संकेत करता है; हिन्दी में ‘जिसके द्वारा’ उस सम्बन्ध को बिना पूर्वपद की पहचान जोड़े बनाए रखता है।
- source_word: ἵλεως
  choice: कृपालु
  rationale: ἵλεως का आशय अनुकूल अथवा कृपापूर्वक प्रवृत्त होना है। ‘कृपालु’ राष्ट्र के प्रति अनुग्रह का भाव स्वाभाविक हिन्दी में व्यक्त करता है, जबकि केवल ‘दयालु’ दया के पक्ष को कुछ अधिक सीमित कर सकता है।
- source_word: ἡ δικαία καὶ πάτριος ἡμῶν πρόνοια
  choice: हमारा धर्ममय और पैतृक दैवी विधान
  rationale: πρόνοια यहाँ ऊँचे धार्मिक सन्दर्भ में संरक्षणकारी दैवी व्यवस्था या providence को सूचित करता है; ‘दैवी विधान’ हिन्दी में इस भाव का परिचित और गरिमापूर्ण रूप है। δικαία के लिए ‘धर्ममय’ न्याय और धार्मिक शुद्धता दोनों को खुला रखता है, और πάτριος के लिए ‘पैतृक’ पूर्वजों से प्राप्त परम्परा का संकेत देता है, न कि केवल पितृवत स्वभाव का।
- source_word: τῷ ἔθνει
  choice: राष्ट्र पर
  rationale: दत्तिव कारक ἵλεως γενηθεῖσα से जुड़कर उस समुदाय को बताता है जिसके प्रति विधान अनुकूल हुआ। ‘राष्ट्र पर कृपालु’ आधुनिक हिन्दी में स्वाभाविक है और यहूदी जनसमुदाय के सामूहिक अर्थ को रखता है।
- source_word: γενηθεῖσα
  choice: होकर
  rationale: अओरिस्ट कृदन्त की पूर्ववर्ती या परिणामी क्रिया को हिन्दी में ‘होकर’ सहज रूप से व्यक्त करता है।
- source_word: τιμωρήσειεν
  choice: दण्ड दे
  rationale: ऑप्टेटिव का इच्छासूचक या संभावनात्मक स्वर प्रसंग में हिन्दी विधिलिंग ‘दे’ से सुरक्षित रहता है; इसे निश्चित भविष्य नहीं बनाया गया।
- source_word: τὸν ἀλάστορα τύραννον
  choice: उस शापित अत्याचारी
  rationale: ἀλάστωρ तीव्र निन्दात्मक शब्द है और शापग्रस्त, विनाशकारी या प्रतिशोध से जुड़े व्यक्ति को सूचित कर सकता है। मुख्य पाठ में ‘शापित’ सबसे स्वाभाविक है; वैकल्पिक गहन अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘हमारा धर्ममय और पैतृक दैवी विधान’ का आशय
  choice: इस्राएल की पूर्वज-परम्परा से सम्बद्ध परमेश्वर की संरक्षणकारी व्यवस्था का श्रद्धापूर्ण संकेत
  alternative: एक अधिक अमूर्त और निर्वैयक्तिक पूर्वचिन्तन या व्यवस्था
  rationale: प्रसंग में πρόνοια धार्मिक भार रखता है, पर यूनानी पाठ सीधे ‘परमेश्वर’ शब्द नहीं जोड़ता। ‘दैवी विधान’ उस धार्मिक संकेत को बनाए रखता है, और पादटिप्पणी मूल की अल्प स्पष्टता बताती है।
- issue: τιμωρήσειεν का भाव
  choice: इच्छा या सम्भावना को खुला रखने वाला ‘दण्ड दे’
  alternative: निश्चित कथन ‘दण्ड देगा’ अथवा अधिक प्रतिशोधात्मक ‘बदला ले’
  rationale: ऑप्टेटिव को निश्चित भविष्य या स्पष्ट प्रतिशोध में बदलना मूल की व्याकरणिक और धार्मिक तनावशीलता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पैतृक’ कुछ औपचारिक है, पर πάτριος के ‘पूर्वजों से प्राप्त’ अर्थ को संक्षेप में सँभालता है। वाक्य की प्रार्थनात्मक/इच्छासूचक गति बनाए रखने के लिए अन्त में ‘दण्ड दे’ रखा गया है।
