  text: And though the framework of his bones was already burned all around[a], the noble-minded and Abraham-like young man did not groan.
translation:
  language: hi
  text: और उस उदात्त-मन, अब्राहम-सदृश युवक ने—जिसकी हड्डियों का ढाँचा पहले ही चारों ओर से जल चुका था[a]—कराह नहीं की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी हड्डियों की संरचना पहले ही चारों ओर से पिघल चुकी थी।” यूनानी में आग से हड्डियों के ढाँचे के हर ओर प्रभावित होने का सजीव चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετηγμένον
  choice: चारों ओर से झुलस चुका था
  rationale: यह पूर्ण कृदंत तीव्र ताप से चारों ओर प्रभावित हो चुकने की दशा बताता है। अग्नि-यातना के संदर्भ में ‘झुलस चुका था’ स्वाभाविक हिन्दी है, जबकि ‘पिघल चुका था’ अधिक शाब्दिक विकल्प है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πῆγμα
  choice: ढाँचा
  rationale: यह किसी जुड़ी या ठोस बनाई हुई संरचना को सूचित करता है; ‘हड्डियों का ढाँचा’ शरीर की अस्थि-संरचना के ठोस बिंब को सहज हिन्दी में व्यक्त करता है।
- source_word: μεγαλόφρων
  choice: उदात्त-मन
  rationale: शब्द ऊँचे साहस, मनोबल और गरिमा का भाव रखता है। ‘उदात्त-मन’ इस नैतिक-मनोवैज्ञानिक गुण को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: Ἀβραμιαῖος
  choice: अब्राहम-सदृश
  rationale: विशेषण यहाँ अब्राहम के समान चरित्र या भक्ति को सूचित करता है; यह केवल वंशगत पहचान नहीं बताता।
- source_word: νεανίας
  choice: युवक
  rationale: यह युवा पुरुष के लिए सामान्य यूनानी शब्द है; ‘युवक’ आधुनिक मानक हिन्दी में स्वाभाविक और सटीक है।
- source_word: οὐκ ἐστέναξεν
  choice: कराह तक नहीं की
  rationale: στενάζω पीड़ा में कराहने या आह भरने को व्यक्त करता है। यातना के प्रसंग में ‘कराह’ उपयुक्त है, और ‘तक’ उसकी असाधारण सहनशीलता पर मूल कथन के बल को स्वाभाविक हिन्दी में उभारता है।
theological_decisions:
- issue: Ἀβραμιαῖος को चरित्रसूचक विशेषण के रूप में प्रस्तुत करना
  choice: अब्राहम-सदृश
  alternative: अब्राहमी; अब्राहम का वंशज
  rationale: प्रसंग युवक के विश्वास और धैर्य की प्रशंसा करते हुए उसे अब्राहम के समान दिखाता है। इसलिए चरित्रगत समानता को बनाए रखा गया है, केवल जातीय वंश का अर्थ नहीं लिया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘हड्डियों का ढाँचा’ मूल के ठोस शारीरिक बिंब को बनाए रखता है; ‘उदात्त-मन’ और ‘अब्राहम-सदृश’ प्रशंसात्मक किंतु गैर-सांप्रदायिक अभिव्यक्तियाँ हैं।
