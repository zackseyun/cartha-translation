translation:
  language: hi
  text: पर जब वे उसे कोड़ों से मारते-मारते थक गए और कुछ भी हासिल न कर सके, तो उन्होंने उसे यातना-चक्र पर चढ़ा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύπτοντες
  choice: मारते-मारते
  rationale: वर्तमान कृदन्त बार-बार किए जा रहे प्रहार को दर्शाता है; हिन्दी में यह पुनरुक्ति निरंतर क्रिया को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ταῖς μάστιξιν
  choice: कोड़ों से
  rationale: μάστιξ दण्ड देने के लिए प्रयुक्त कोड़े को सूचित करता है; ‘कोड़ों’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ἐκοπίασαν
  choice: थक गए
  rationale: क्रिया परिश्रम से थक जाने का अर्थ देती है; यह संक्षिप्त और कथात्मक सन्दर्भ के अनुकूल है।
- source_word: μηδὲν ἀνύοντες
  choice: कुछ भी हासिल न कर सके
  rationale: वाक्यांश इच्छित परिणाम प्राप्त न कर पाने को दर्शाता है; यह अनुवाद उस विफलता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀνέβαλον
  choice: चढ़ा दिया
  rationale: सन्दर्भ में इसका अर्थ व्यक्ति को किसी उपकरण पर उठा या रख देना है; ‘चढ़ा दिया’ ἐπί के साथ गति और स्थापित किए जाने दोनों को व्यक्त करता है।
- source_word: ἐπὶ τὸν τροχόν
  choice: यातना-चक्र पर
  rationale: τροχός यहाँ यातना देने का चक्राकार उपकरण है; ‘यातना-चक्र’ सामान्य पहिए से उसका भेद पाठ में ही स्पष्ट करता है।
