lexical_decisions:
- source_word: Ὡς ἡδὺς
  choice: कितनी मधुर है
  rationale: विस्मयात्मक बल और मृत्यु को ‘मधुर’ कहने वाले मूल के सशक्त विरोधाभास को बनाए रखता है।
- source_word: πᾶς τρόπος θανάτου
  choice: हर प्रकार की मृत्यु
  rationale: मृत्यु के किसी भी ढंग को समेटने वाले व्यापक, वितरणात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ यह कारण या प्रेरणा बताता है; हिन्दी में अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: τὴν πάτριον ἡμῶν εὐσέβειαν
  choice: पूर्वजों से मिली हमारी धर्मनिष्ठा
  rationale: πάτριον की पूर्वजों से प्राप्त विरासत और εὐσέβεια की श्रद्धापूर्ण धार्मिक निष्ठा—दोनों को व्यक्त करता है।
- source_word: ἔφη τε
  choice: फिर उसने ... कहा
  rationale: कथन की अगली कड़ी का सरल परिचय देता है; τε के संयोजक भाव को ‘फिर’ से स्वाभाविक बनाया गया है।
- source_word: πρὸς τὸν τύραννον
  choice: अत्याचारी शासक से
  rationale: τύραννος के निंदात्मक अर्थ को बनाए रखते हुए यह स्पष्ट करता है कि संबोधित व्यक्ति एक शासक है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: धर्मनिष्ठा
  alternative: ईश्वर-भक्ति; भक्ति
  rationale: यह शब्द पूर्वजों से प्राप्त व्यवस्था के प्रति निष्ठा में प्रकट श्रद्धापूर्ण धार्मिक जीवन को सूचित करता है। ‘धर्मनिष्ठा’ इसे केवल सांस्कृतिक परंपरा या निजी भक्तिभाव तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘मधुर’ मूल के जानबूझकर रखे गए विरोधाभास को सुरक्षित रखता है; ‘अत्याचारी शासक’ τύραννος की नैतिक तीव्रता को व्यक्त करता है।
