base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/030.yaml
  text: Do you not think[a], O most savage tyrant of all, that you are now being tortured more than I am[b], seeing the proud reasoning of your tyranny being conquered by our endurance for the sake of godliness?
translation:
  language: hi
  text: क्या तुम नहीं सोचते[a], हे सब अत्याचारियों में सबसे क्रूर, कि अब तुम मुझसे अधिक यातना पा रहे हो, यह देखकर कि तुम्हारी तानाशाही की दंभी सोच हमारी परमेश्वर-भक्ति के लिए हमारे धीरज से पराजित हो रही है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम्हें ऐसा नहीं लगता?”
    reason: δοκεῖς का अर्थ “सोचना,” “मानना,” या “लगना” हो सकता है।
  - marker: b
    text: “यह देखकर कि” का अनुवाद “क्योंकि तुम देख रहे हो” या “जब तुम देख रहे हो” भी हो सकता है। “सोच” के लिए यूनानी शब्द का अर्थ “तर्क,” “विचार,” या “मानसिकता” भी हो सकता है। अंतिम वाक्यांश का अर्थ परमेश्वर के प्रति हमारी भक्ति से प्रेरित या उसके लिए किया गया हमारा धीरज है।
    reason: ὁρῶν के वाक्यगत संबंध, λογισμός के शब्दार्थ-विस्तार, और διὰ τὴν εὐσέβειαν ἡμῶν के संबंध को खुला रखता है।
lexical_decisions:
- source_word: Οὐ δοκεῖς
  choice: क्या तुम नहीं समझते
  rationale: यह यूनानी मुहावरे के आलंकारिक प्रश्न और चुनौतीपूर्ण स्वर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὦ πάντων ὠμότατε τύραννε
  choice: हे सभी अत्याचारियों में सबसे क्रूर
  rationale: ὠμότατε की उत्कृष्टतम क्रूरता और πάντων के व्यापक तुलनात्मक बल को स्पष्ट रखता है।
- source_word: πλεῖον ἐμοῦ σε νῦν βασανίζεσθαι
  choice: इस समय तुम मुझसे भी अधिक यातना सह रहे हो
  rationale: यातना की वही शब्दावली बनाए रखकर अत्याचारी और शहीद के बीच व्यंग्यपूर्ण उलटाव सुरक्षित रहता है।
- source_word: ὁρῶν
  choice: क्योंकि तुम देख रहे हो
  rationale: वर्तमान कृदन्त का परिस्थितिजन्य तथा संभावित कारणसूचक संबंध पठनीय हिन्दी में व्यक्त होता है।
- source_word: τὸν τῆς τυραννίδος ὑπερήφανον λογισμὸν
  choice: तुम्हारे अत्याचार की घमंडी विचारधारा
  rationale: λογισμός के विचार, तर्क और नियंत्रक मानसिकता संबंधी अर्थ-विस्तार को यहाँ 'विचारधारा' स्वाभाविक रूप से समेटता है; पुस्तक में बुद्धि-विचार की प्रमुख विषयवस्तु भी बनी रहती है।
- source_word: ὑπὸ τῆς ... ὑπομονῆς
  choice: धीरज से टिके रहने के द्वारा
  rationale: ὑπομονή का अर्थ पीड़ा के नीचे दृढ़तापूर्वक सहते रहने का है; यह पद उस सक्रिय स्थिरता को स्पष्ट करता है।
- source_word: διὰ τὴν εὐσέβειαν ἡμῶν
  choice: परमेश्वर के प्रति हमारी भक्ति के कारण
  rationale: εὐσέβεια को केवल धार्मिक रीति नहीं, बल्कि परमेश्वर के प्रति भक्तिपूर्ण निष्ठा के रूप में स्पष्ट करता है और διά के कारण अथवा प्रेरणा संबंधी बल को बनाए रखता है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: परमेश्वर के प्रति हमारी भक्ति
  alternative: हमारी धर्मपरायणता; भक्ति के लिए
  rationale: यह पद परमेश्वर के प्रति ऐसी निष्ठा बताता है जो धीरज को प्रेरित करती है। हिन्दी में संबंध को स्पष्ट करना अर्थ को संप्रदायगत दिशा दिए बिना स्वाभाविक बनाता है।
- issue: 4 मक्काबियों में λογισμός, जहाँ बुद्धि और विचार प्रमुख विषय हैं
  choice: विचारधारा
  alternative: तर्क; मानसिकता; विचार
  rationale: प्रसंग अत्याचारी की घमंडी शासकीय सोच या योजना को व्यक्त करता है। 'विचारधारा' इस अर्थ को सहज हिन्दी में रखती है, जबकि पादटिप्पणी वास्तविक शब्दार्थ-विस्तार को सुरक्षित रखती है।
- issue: ὁρῶν का वाक्यगत संबंध
  choice: कारणसूचक—क्योंकि तुम देख रहे हो
  alternative: जबकि तुम देख रहे हो; यह देखते हुए
  rationale: कृदन्त कारणसूचक या परिस्थितिजन्य दोनों हो सकता है। मुख्य पाठ में स्वाभाविक कारणसूचक अर्थ लिया गया है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन और आलंकारिक प्रश्न का गरिमापूर्ण, तीखा स्वर बनाए रखा गया है। कठिन दार्शनिक शब्दावली को साधारण पाठक के लिए सुबोध रखा गया, पर λογισμός और εὐσέβεια की अर्थगत गहराई पादटिप्पणियों में सुरक्षित है।
