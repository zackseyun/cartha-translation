lexical_decisions:
- source_word: κατὰ πᾶν μέλος
  choice: एक-एक अंग
  rationale: यह वितरणसूचक पद शरीर के प्रत्येक अंग को क्रमशः यातना दिए जाने का भाव रखता है; ‘एक-एक अंग’ आधुनिक हिन्दी में स्वाभाविक और सजीव है।
- source_word: κλώμενος
  choice: तोड़ा जा रहा था
  rationale: वर्तमान कर्मवाच्य कृदन्त यातना के दौरान जारी शारीरिक तोड़े जाने को व्यक्त करता है; यह ‘कुचला’ या ‘चूर-चूर किया’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: κατηγόρει
  choice: वह उन्हें धिक्कारता रहा
  rationale: अपूर्ण भूतकाल निरंतर क्रिया दर्शाता है। इस प्रसंग में क्रिया औपचारिक अभियोग से अधिक यातना देने वालों की निंदा या भर्त्सना का अर्थ देती है, जिसे ‘धिक्कारता रहा’ सहज रूप से व्यक्त करता है।
- source_word: λέγων
  choice: और कहता गया
  rationale: यह कृदन्त अगले पद में आने वाली वाणी का परिचय देता है; ‘कहता गया’ जारी क्रिया और आगे खुलते वाक्य—दोनों को बनाए रखता है।
