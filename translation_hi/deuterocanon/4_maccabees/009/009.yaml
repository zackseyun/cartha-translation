  yaml_path: translation/deuterocanon/4_maccabees/009/009.yaml
  text: But because of our sacred murder[a], you will, by divine justice[b], endure a sufficient eternal torment by fire.
translation:
  language: hi
  text: परन्तु हमारी हत्या के कारण—जो पवित्रता का भी अपमान है[a]—तुम ईश्वरीय न्याय के हाथों[b] आग के द्वारा भरपूर और अनन्त यातना सहोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हमारी धर्मद्रोही हत्या’ अथवा ‘हम पवित्र जनों की हत्या’।
    reason: μιεροφονία दुर्लभ शब्द है। इसमें हत्या के साथ पवित्रता के उल्लंघन का भाव है और संदर्भ में यह वक्ताओं की हत्या को सूचित करता है।
  - marker: b
    text: या, ‘ईश्वरीय न्याय के अधीन’।
    reason: ὑπὸ τῆς θείας δίκης ईश्वरीय न्याय को यातना देने वाले न्यायिक कर्ता के रूप में प्रस्तुत करता है; ‘के अधीन’ इस संबंध को अपेक्षाकृत कम प्रत्यक्ष ढंग से व्यक्त करता है।
lexical_decisions:
- source_word: μιεροφονίαν
  choice: धर्मद्रोही हत्या
  rationale: यह दुर्लभ संयुक्त शब्द हत्या के साथ पवित्रता के उल्लंघन का भाव जोड़ता है। ‘धर्मद्रोही हत्या’ उस अपवित्र और निन्दनीय कृत्य को व्यक्त करती है, जबकि ‘हमारी’ से स्पष्ट होता है कि वक्ता अपने और अपने साथियों के मारे जाने की बात कर रहा है।
- source_word: αὐτάρκη καρτερήσεις
  choice: पूरी ... यातना सहोगे
  rationale: कार्तेरेओ का अर्थ दृढ़ता से सहना है, और αὐτάρκη दण्ड के पर्याप्त या पूर्ण होने पर बल देता है। स्वाभाविक हिन्दी में ‘पूरी ... यातना सहोगे’ इस तीव्रता को बनाए रखता है।
- source_word: ὑπὸ τῆς θείας δίκης
  choice: ईश्वरीय न्याय के अधीन
  rationale: δίκη में न्याय, न्यायिक प्रतिफल और दण्ड—तीनों की छाया है। ‘ईश्वरीय न्याय के अधीन’ साधन या कर्ता-संबंध को बनाए रखते हुए अर्थ को केवल ‘दण्ड’ तक सीमित नहीं करता।
- source_word: αἰώνιον βάσανον
  choice: अनन्त यातना
  rationale: αἰώνιος दीर्घ अथवा अनन्त अवधि और βάσανος कठोर पीड़ा या यातना व्यक्त करता है। ‘अनन्त यातना’ मूल की कठोरता को बिना अतिरिक्त सिद्धान्त जोड़कर सुरक्षित रखती है।
- source_word: διὰ πυρός
  choice: आग के द्वारा
  rationale: सम्बन्धकारक के साथ διά यहाँ साधन को दर्शाता है। ‘आग के द्वारा’ यूनानी रचना का सीधा और स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: दण्ड की अवधि और प्रकृति
  choice: आग के द्वारा पूरी और अनन्त यातना
  alternative: आग में सदा की यातना
  rationale: अनुवाद αἰώνιον और βάσανον की अवधि तथा कठोरता को बनाए रखता है, पर बाद की व्यवस्थित धर्मशास्त्रीय व्याख्याओं को पद में नहीं जोड़ता।
- issue: θεία δίκη का न्यायिक अर्थ
  choice: ईश्वरीय न्याय के अधीन
  alternative: परमेश्वर के दण्ड से
  rationale: चुना हुआ रूप न्याय और प्रतिफल दोनों की सम्भावना सुरक्षित रखता है; विकल्प इसे केवल दण्ड के अर्थ में संकुचित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धर्मद्रोही हत्या’ जानबूझकर कुछ असामान्य है, क्योंकि मूल यूनानी पद भी दुर्लभ और अर्थ-सघन है; पादटिप्पणी उसकी सम्भव व्याख्याएँ सुरक्षित रखती है।
