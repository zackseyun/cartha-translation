  rationale: ἰχώρ घाव से बहने या रिसने वाले द्रव को दर्शा सकता है। केवल ‘शारीरिक द्रव’ कहने की अपेक्षा यह हिन्दी में अधिक स्पष्ट है और प्रसंग के वीभत्स यथार्थ को बनाए रखता है।
- source_word: ἐσβέννυτο
  choice: बुझता जा रहा था
  rationale: अपूर्ण काल जारी क्रिया दर्शाता है; ‘बुझता जा रहा था’ अंगारों के क्रमशः बुझने का भाव स्पष्ट करता है।
- source_word: περὶ τοὺς ἄξονας
  choice: धुरियों के चारों ओर
  rationale: ἄξονες यंत्र के अक्षों या धुरियों को दर्शाता है; ‘धुरियाँ’ हिन्दी में यांत्रिक और ठोस चित्र प्रस्तुत करता है।
- source_word: τοῦ ὀργάνου
  choice: यातना-यंत्र
  rationale: ὄργανον सामान्यतः साधन या यंत्र है; निकट प्रसंग में यह यातना देने वाला उपकरण है। ‘यातना-यंत्र’ अर्थ स्पष्ट करता है, बिना किसी विशेष बनावट को अनावश्यक रूप से निर्धारित किए।
- source_word: περιέρεον αἱ σάρκες
  choice: मांस बह रहा था
  rationale: यूनानी में σάρκες बहुवचन है, पर हिन्दी में मानव ऊतक के लिए सामूहिक एकवचन ‘मांस’ स्वाभाविक है। περιέρεον की जारी गति ‘बह रहा था’ से सुरक्षित रहती है।
