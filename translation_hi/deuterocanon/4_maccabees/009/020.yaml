  text: और पहिया चारों ओर लहू से दूषित हो रहा था[a], अंगारों का ढेर स्रावों की बूंदों से बुझता जा रहा था[b], और यातना-यंत्र[c] की धुरियों के चारों ओर मांस बह रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चारों ओर लहू से सन रहा था।” यूनानी क्रिया का अर्थ दागदार होना भी हो सकता है, पर इसमें दूषित या अशुद्ध होने की अर्थ-छाया भी है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “इखोर के टपकावों से।” यूनानी शब्द घावों से बहने वाले द्रव को सूचित कर सकता है; यहाँ उसे “स्रावों की बूंदों” कहा गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “उपकरण” अथवा “साधन।” यहाँ यूनानी शब्द यातना देने वाले पूरे यंत्र के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
