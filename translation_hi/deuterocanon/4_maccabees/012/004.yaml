base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/004.yaml
  text: You see the outcome of your brothers’ madness[a]; for because of disobedience they have been tortured and have died. But you, if you do not obey, will yourself also die before your time[c][b], after being miserably tortured.
translation:
  language: hi
  text: “तुम अपने भाइयों की मूर्खतापूर्ण सनक का परिणाम[a] देख रहे हो; क्योंकि आज्ञा न मानने के कारण उन्हें यातना दी गई और वे मर चुके हैं[b]। पर यदि तुम नहीं मानोगे[c], तो तुम भी बुरी तरह यातना सहकर समय से पहले मर जाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाइयों की मूर्खतापूर्ण सनक का अंत।”
    reason: lexical_alternative
  - marker: b
    text: “यातना” के लिए प्रयुक्त यूनानी क्रिया विशेष रूप से शरीर को यातना-यंत्र पर खींचने या मरोड़ने का अर्थ भी दे सकती है।
    reason: cultural_note
  - marker: c
    text: या “यदि तुम राज़ी नहीं होगे”; यहाँ इसका व्यावहारिक अर्थ आज्ञा मानना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονοίας
  choice: मूर्खतापूर्ण सनक
  rationale: यह शब्द विवेकहीनता अथवा विकृत निर्णय-बुद्धि का तिरस्कारपूर्ण आरोप व्यक्त करता है। वक्ता की शत्रुतापूर्ण भाषा बनाए रखने के लिए यह पद स्वाभाविक है, जबकि केवल ‘मूर्खता’ कुछ हल्का पड़ सकता है।
- source_word: τὸ τέλος
  choice: परिणाम
  rationale: संदर्भ में भाइयों के आचरण के फलस्वरूप उनके साथ जो हुआ, उसकी ओर संकेत है। ‘परिणाम’ आधुनिक हिन्दी में स्वाभाविक है; ‘अंत’ भी संभव है।
- source_word: ἀπείθειαν
  choice: आज्ञा न मानने
  rationale: यहाँ आशय शासक की माँग मानने से इनकार करना है। क्रियात्मक रूप हिन्दी में अगले πεισθείης के साथ संबंध भी स्पष्ट रखता है।
- source_word: στρεβλωθέντες
  choice: यातना देकर
  rationale: क्रिया विशेष रूप से शरीर को खींचने या मरोड़ने वाली यातना का संकेत दे सकती है, पर मुख्य पाठ में सामान्य ‘यातना’ अनावश्यक रूप से उपकरण निश्चित किए बिना अर्थ व्यक्त करती है।
- source_word: τεθήκασιν
  choice: मार डाले गए हैं
  rationale: इस संदर्भ में पूर्णकालिक क्रिया मृत्यु की अवस्था बताती है। कर्मवाच्य अभिव्यक्ति यातना और मृत्यु के हिंसक प्रसंग को स्वाभाविक हिन्दी में जोड़ती है।
- source_word: πεισθείης
  choice: नहीं मानोगे
  rationale: शाब्दिक अर्थ ‘राज़ी न होओ’ हो सकता है, किंतु यहाँ व्यावहारिक आशय राजा की आज्ञा के आगे झुकना है। ‘मानोगे’ इस अर्थ को व्यक्त करते हुए मनवाए जाने की छाया भी कुछ हद तक बनाए रखता है।
- source_word: ταλαί
  choice: बुरी तरह
  rationale: यह संबोधित व्यक्ति की दुर्दशा पर दया अथवा तिरस्कार का भाव जोड़ता है। हिन्दी में क्रियाविशेषण के रूप में यह यातना की तीव्रता और वक्ता का भाव स्वाभाविक ढंग से देता है।
- source_word: βασανισθεὶς
  choice: यातना सहकर
  rationale: कृदंत मृत्यु से पहले होने वाली कठोर पीड़ा बताता है; ‘सहकर’ घटनाक्रम को संक्षिप्त और स्पष्ट रखता है।
- source_word: πρὸ ὥρας
  choice: समय से पहले
  rationale: यह असामयिक अथवा अकाल मृत्यु का मुहावरा है। ‘समय से पहले’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा किसी ईश्वरीय नियत समय को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: भाइयों के आचरण के बारे में वक्ता का मूल्यांकन
  choice: ‘मूर्खतापूर्ण सनक’ के रूप में वक्ता की निंदात्मक भाषा को सुरक्षित रखा गया है।
  alternative: ‘मूर्खता’, ‘विवेकहीनता’
  rationale: यह अत्याचारी की सीधी और शत्रुतापूर्ण वाणी है, कथाकार का निष्पक्ष अथवा धर्मवैज्ञानिक निर्णय नहीं। अनुवाद वक्ता की कटुता को नरम नहीं करता, न उसे कथाकार की स्वीकृति बनाता है।
- issue: πεισθείης में मनाए जाने और आज्ञापालन का संबंध
  choice: मुख्य पाठ में ‘नहीं मानोगे’ रखा गया है।
  alternative: ‘राज़ी नहीं होगे’, ‘आज्ञा नहीं मानोगे’
  rationale: यह चुनाव व्यावहारिक अनुपालन और मनाए जाने—दोनों अर्थों के बीच की मूल तनावपूर्ण व्यापकता को यथासंभव बनाए रखता है; पादटिप्पणी विकल्प स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज प्रत्यक्ष-वचन रखा गया है। वक्ता की धमकी और तिरस्कार स्पष्ट हैं। वाक्यक्रम को हिन्दी के स्वाभाविक प्रवाह के अनुसार ढाला गया है, और सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
