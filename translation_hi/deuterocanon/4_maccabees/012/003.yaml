- source_word: παρηγορεῖν
  choice: हौसला बढ़ाने
  rationale: यहाँ शब्द सांत्वना देने या प्रोत्साहित करने, दोनों अर्थ दे सकता है; यातना के सामने मनाने वाले भाषण के प्रसंग में ‘हौसला बढ़ाने’ उपयुक्त है, यद्यपि विडंबनापूर्ण स्वर संभव है।
- source_word: ἐπειρᾶτο
