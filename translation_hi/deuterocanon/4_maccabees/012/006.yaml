  yaml_path: translation/deuterocanon/4_maccabees/012/006.yaml
  text: And while urging these things[a], he sent for the boy’s mother, so that, having pity on her after she had been deprived of so many sons, he might persuade her to make the one remaining compliant for his deliverance.
translation:
  language: hi
  text: और इन बातों का आग्रह करते हुए उसने उस लड़के की माँ को बुलवा भेजा, ताकि इतने बेटों से वंचित हो चुकी उस पर तरस खाकर उसे इस बात के लिए राज़ी करे कि वह अपने बचे हुए बेटे को उसके बचाव[a] के लिए मान जाने को तैयार कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उद्धार’। यूनानी शब्द का अर्थ व्यापक हो सकता है, पर यहाँ सबसे स्वाभाविक संकेत मृत्यु से शारीरिक रूप से बचाए जाने की ओर है।
    reason: σωτηρίαν के व्यापक और प्रसंगगत अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: παρακαλῶν
  choice: आग्रह करते हुए
  rationale: यह कृदन्त प्रसंग में गंभीर और लगातार समझाने या दबाव डालने का भाव रखता है; ‘आग्रह’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल सांत्वना या प्रोत्साहन नहीं बनाता।
- source_word: μετεπέμψατο
  choice: बुलवा भेजा
  rationale: मध्यवाच्य क्रिया का अर्थ किसी को बुलाने के लिए संदेश भेजना है। ‘बुलवा भेजा’ राजदरबार के प्रसंग में स्वाभाविक रहते हुए अनावश्यक रूप से बलपूर्वक गिरफ्तारी का भाव नहीं जोड़ता।
- source_word: ἐλεήσας
  choice: तरस खाकर
  rationale: यहाँ शासक के बताए गए दयाभाव को व्यक्त किया गया है। ‘तरस खाकर’ सामान्य और प्रसंगानुकूल है तथा ‘दया करके’ की अपेक्षा कम धार्मिक रंग रखता है।
- source_word: στερηθεῖσαν
  choice: वंचित हो चुकी
  rationale: यूनानी कर्मवाच्य रूप केवल स्वाभाविक हानि नहीं, बल्कि उससे बेटों के छीन लिए जाने का भाव रखता है; ‘वंचित हो चुकी’ उस कर्मवाच्य अर्थ को बनाए रखता है।
- source_word: παρορμήσειεν
  choice: प्रेरित करे
  rationale: क्रिया किसी को एक कार्य की ओर उकसाने या प्रवृत्त करने को बताती है। ‘प्रेरित करे’ हिन्दी में स्पष्ट है, जबकि ‘भड़काए’ प्रसंग से अधिक कठोर होगा।
- source_word: σωτηρίαν
  choice: बचाव
  rationale: तात्कालिक प्रसंग शेष बेटे को मृत्यु से बचाने का है। ‘बचाव’ शारीरिक रक्षा का मुख्य भाव देता है, जबकि व्यापक ‘उद्धार’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εὐπειθῆ ποιῆσαι
  choice: बात मानने को तैयार कर दे
  rationale: मुहावरे का अर्थ किसी को मान जाने वाला या अनुकूल बनाना है। यह हिन्दी अभिव्यक्ति दबावपूर्ण प्रसंग में स्वाभाविक है और ‘आज्ञाकारी’ शब्द से उत्पन्न सकारात्मक नैतिक अर्थ से बचती है।
- source_word: τὸν περιλειπόμενον
  choice: अपने बचे हुए बेटे
  rationale: कृदन्त उस एकमात्र पुत्र को सूचित करता है जो अभी शेष है। सम्बन्ध और संख्या को हिन्दी में स्पष्ट करने के लिए ‘अपने बचे हुए बेटे’ कहा गया है।
theological_decisions:
- issue: शहादत के प्रसंग में σωτηρίαν का अर्थ
  choice: तात्कालिक शारीरिक बचाव
  alternative: व्यापक अर्थ में ‘उद्धार’ या ‘मुक्ति’
  rationale: राजा का उद्देश्य शेष पुत्र को मान जाने पर मृत्यु से बचाना है, इसलिए मुख्य पाठ में ‘बचाव’ सर्वाधिक स्वाभाविक है। फिर भी यूनानी शब्द का व्यापक अर्थ संभव होने से उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य की यूनानी उद्देश्य-रचना को बनाए रखते हुए हिन्दी में सम्बन्धों को स्पष्ट किया गया है।
