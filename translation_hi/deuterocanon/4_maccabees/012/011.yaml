base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/011.yaml
  text: “You unholy man,” she said[a], “most ungodly tyrant of all wicked men, were you not ashamed, after receiving good things and kingship from God[b], to kill his servants and torture the practitioners of godliness?”
translation:
  language: hi
  text: उसने कहा[a], “हे अपवित्र मनुष्य, सब दुष्टों में सबसे अधर्मी अत्याचारी! परमेश्वर से अच्छी वस्तुएँ और राजसत्ता पाकर भी क्या तुझे उसके सेवकों को मार डालने और भक्ति का अभ्यास करने वालों[b] को यातना देने में लज्जा नहीं आई?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में बोलनेवाली स्त्री का संकेत क्रिया से नहीं, प्रसंग से मिलता है; इसलिए “उसने कहा” प्रसंगानुसार है।
    reason: source_ambiguity
  - marker: b
    text: “भक्ति का अभ्यास करने वालों” का अनुवाद “धर्मनिष्ठा के साधक” भी हो सकता है। यूनानी पद में किसी अनुशासन का निरंतर अभ्यास करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνόσιε
  choice: हे अपवित्र मनुष्य
  rationale: सम्बोधन रूप और धार्मिक-नैतिक निंदा दोनों को स्पष्ट रखता है; ‘अपवित्र’ ἀνόσιος के अर्थ के निकट है।
- source_word: πάντων τῶν πονηρῶν ἀσεβέστατε τύραννε
  choice: सब दुष्टों में सबसे अधर्मी अत्याचारी
  rationale: यूनानी के अतिशयोक्तिपूर्ण, एक के बाद एक रखे गए निंदात्मक शब्दों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐκ ᾐδέσθης
  choice: क्या तुझे ... लज्जा नहीं आई?
  rationale: आलंकारिक प्रश्न और नैतिक भर्त्सना को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρὰ τοῦ θεοῦ λαβὼν τὰ ἀγαθὰ καὶ τὴν βασιλείαν
  choice: परमेश्वर से अच्छी वस्तुएँ और राजसत्ता पाकर भी
  rationale: τὰ ἀγαθὰ की व्यापकता को बिना ‘आशीषें’ जोड़कर रखता है; βασιλεία यहाँ भूभाग से अधिक प्रदत्त राजकीय अधिकार या पद है।
- source_word: τοὺς θεράποντας αὐτοῦ
  choice: उसके सेवकों
  rationale: परमेश्वर की सेवा और उससे संबंध को दर्शाता है, पर कोई विशिष्ट धार्मिक पद नहीं जोड़ता।
- source_word: κατακτείνειν
  choice: मार डालने
  rationale: क्रिया की प्रत्यक्ष और तीव्र घातकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς τῆς εὐσεβείας ἀσκητάς
  choice: भक्ति का अभ्यास करनेवालों
  rationale: ἀσκητής में निहित अनुशासित अभ्यास का भाव रखता है और बाद की तकनीकी संन्यास-संबंधी धारणा आरोपित नहीं करता।
- source_word: στρεβλοῦν
  choice: यातना देने
  rationale: शब्द यातना, सम्भवतः शरीर को खींचकर यातना देने, का बोध कराता है; सामान्य अनुवाद साधन को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: यहूदी शहादत-संदर्भ में εὐσέβεια का अनुवाद
  choice: भक्ति
  alternative: धर्मनिष्ठा
  rationale: ‘भक्ति’ परमेश्वर के प्रति समर्पण और आचरण दोनों के लिए सामान्य तथा बोधगम्य है; साथ का ‘अभ्यास’ अनुशासित जीवन का भाव सुरक्षित रखता है।
- issue: परमेश्वर से संबंधित θεράποντας का अनुवाद
  choice: सेवक
  alternative: परिचारक
  rationale: ‘सेवक’ संबंध और सेवा दोनों बताता है, जबकि पाठ में कोई विशिष्ट धार्मिक पद निर्धारित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण और तीखी भर्त्सना वाला है। ‘तुझे’ अत्याचारी को सीधे संबोधित करने की एकवचन निकटता तथा अवमानना को व्यक्त करता है।
