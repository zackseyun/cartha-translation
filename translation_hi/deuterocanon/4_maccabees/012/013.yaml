  yaml_path: translation/deuterocanon/4_maccabees/012/013.yaml
  text: Were you not ashamed[a], though you are a man, most beastly one, to cut out the tongues of those who share the same sufferings and have come from the same elements, and after mutilating him in this way[b], to torture him?
translation:
  language: hi
  text: मनुष्य होते हुए भी, हे अत्यन्त पशुवत् व्यक्ति, क्या तुझे तुम्हारी ही तरह अनुभूतियाँ रखने वाले[a] और उन्हीं तत्त्वों से बने लोगों[b] की जीभें काट डालने, और इस व्यक्ति को इस प्रकार विकृत करके उसे यातना देने में लज्जा नहीं आई?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हारी ही जैसी दशाओं अथवा भावों के अधीन लोग।’ यूनानी शब्द समान अनुभवों, अवस्थाओं या भावों में सहभागी होने का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘तत्त्व’ यूनानी दार्शनिक शब्द στοιχεῖα को दर्शाता है; यहाँ आशय मनुष्यों की समान भौतिक संरचना से है।
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ᾐδέσθης
  choice: क्या तुझे ... लज्जा नहीं आई?
  rationale: यह धिक्कार व्यक्त करनेवाला प्रश्न है। ‘लज्जा नहीं आई’ यूनानी क्रिया के नैतिक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἄνθρωπος ὢν
  choice: मनुष्य होते हुए भी
  rationale: 'संदर्भ में कृदन्त वाक्यांश रियायती अर्थ देता है: मनुष्य होकर भी वह अमानवीय व्यवहार करता है।'
- source_word: θηριωδέστατε
  choice: हे अत्यन्त पशुवत् व्यक्ति
  rationale: सम्बोधन में प्रयुक्त अतिशयोक्तिपूर्ण विशेषण पशु-जैसी चरम क्रूरता दर्शाता है; ‘पशुवत्’ मूल बिम्ब को सुरक्षित रखता है।
- source_word: τοὺς ὁμοιοπαθεῖς
  choice: अपने जैसी ही अनुभूतियों वाले
  rationale: यह चयन समान अनुभव, दशा या भावों के अधीन होने की मूल अस्पष्टता को यथासम्भव बनाए रखता है; केवल तत्कालीन यातना तक अर्थ को सीमित नहीं करता।
- source_word: καὶ ἐκ τῶν αὐτῶν γεγονότας στοιχείων
  choice: और उन्हीं तत्वों से बने लोगों
  rationale: यह वाक्यांश मनुष्यों की समान भौतिक संरचना की ओर संकेत करता है। ‘तत्व’ दार्शनिक शब्दावली को बनाए रखते हुए हिन्दी में सुबोध है।
- source_word: γλωττοτομῆσαι
  choice: जीभें काट डालने
  rationale: संयुक्त यूनानी क्रिया जीभ काटने का स्पष्ट अर्थ देती है; ‘काट डालने’ से हिंसक और निर्णायक कार्य स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: καὶ τοῦτον καταικίσας τὸν τρόπον
  choice: और इस व्यक्ति का इस प्रकार अंग-भंग करके
  rationale: καταικίζω घोर दुर्व्यवहार, विकृति या अंग-भंग का अर्थ दे सकता है। निकट संदर्भ में जीभ काटना होने से ‘अंग-भंग’ उपयुक्त है; एकवचन τοῦτον को ‘इस व्यक्ति’ से स्पष्ट रखा गया है।
- source_word: βασανίσαι
  choice: उसे यातना देने
  rationale: शहीदी और शारीरिक हिंसा के इस संदर्भ में क्रिया कठोर शारीरिक यातना को दर्शाती है।
theological_decisions:
- issue: ἄνθρωπος ὢν ... θηριωδέστατε में मनुष्य और पशु का विरोध
  choice: ‘मनुष्य होते हुए भी, हे अत्यन्त पशुवत् व्यक्ति’ द्वारा विरोध को स्पष्ट बनाए रखा गया है।
  alternative: ‘मनुष्य होकर भी, हे अत्यन्त क्रूर व्यक्ति’
  rationale: पद की नैतिक विडम्बना इस बात पर निर्भर है कि मनुष्य पशु-जैसा आचरण कर रहा है। ‘पशुवत्’ मूल बिम्ब को सुरक्षित रखता है और कोई अतिरिक्त धर्मसैद्धान्तिक दावा नहीं जोड़ता।
- issue: मनुष्य की संरचना के लिए στοιχεῖα का अर्थ
  choice: मुख्य पाठ में ‘तत्वों’ रखा गया है।
  alternative: ‘मूल घटकों’ या ‘एक ही भौतिक संरचना’
  rationale: लेखक की दार्शनिक शब्दावली और सभी मनुष्यों की समान भौतिक उत्पत्ति का संकेत सुरक्षित रहता है; अधिक व्याख्यात्मक अर्थ मुख्य पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर धिक्कारपूर्ण सम्बोधन और वाक्य की तीखी आलंकारिक शक्ति बनाए रखने के लिए गरिमापूर्ण शब्दावली अपनाई गई है। बहुवचन समूह (‘लोगों की जीभें’) से एकवचन पीड़ित (‘इस व्यक्ति’) की ओर मूल पाठ के परिवर्तन को जानबूझकर सुरक्षित रखा गया है।
