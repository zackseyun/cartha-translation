- source_word: ἀπαντυμολοῶ
  choice: मुकरूँगा
  rationale: यह दबाव में किसी बात को अस्वीकार करने, उससे फिर जाने या उसका परित्याग करने का भाव व्यक्त करता है। हिंदी में ‘गवाही से मुकरना’ स्वाभाविक है और मूल के नकारात्मक अर्थ को स्पष्ट रखता है।
- source_word: μαρτυρίας
  choice: गवाही
  rationale: मूल शब्द का सामान्य अर्थ ‘गवाही’ या ‘साक्ष्य’ है। प्रसंग में शहादत की प्रतिध्वनि भी है, पर उसे मुख्य पाठ में स्पष्ट करके अनुवाद करना अर्थ की सीमा से आगे जाता।
- source_word: τῶν ἀδελφῶν μου
  choice: अपने भाइयों की
  rationale: कथा में संकेत वक्ता के पुरुष सहोदर भाइयों की ओर है; इसलिए लिंग-विशिष्ट ‘भाइयों’ उपयुक्त है।
