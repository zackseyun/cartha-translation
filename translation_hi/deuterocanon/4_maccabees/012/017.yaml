- issue: क्या μαρτυρίας का अनुवाद स्पष्ट रूप से शहादत के अर्थ में किया जाए
  choice: गवाही
  alternative: साक्ष्य; शहादत
  rationale: यहाँ यूनानी संज्ञा अपने सामान्य अर्थ में बनी हुई है, यद्यपि पूरे प्रसंग में उसके साथ शहादत का भाव जुड़ा है। ‘शहादत’ मुख्य पाठ में रखने से निहित धार्मिक अर्थ को अनावश्यक रूप से निश्चित कर दिया जाता।
