  text: But even in the present life[a], and after you die, he will punish you.
translation:
  language: hi
  text: परन्तु वह तुम्हें इस वर्तमान जीवन में भी और मरने के बाद भी दण्ड देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὲ
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष एकवचन कर्मकारक सर्वनाम है और भावी क्रिया का सीधा कर्म है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन के साथ विरोध अथवा प्रत्युत्तर का संबंध दिखाता है; यहाँ ‘परन्तु’ उसका स्वाभाविक रूप है।
- source_word: καὶ ... καὶ
  choice: भी ... और ... भी
  rationale: पहला καὶ वर्तमान जीवन को दण्ड के दायरे में विशेष रूप से सम्मिलित करता है, जबकि दूसरा मृत्यु के बाद की अवस्था को उससे जोड़ता है।
- source_word: ἐν τῷ νῦν βίῳ
  choice: इस वर्तमान जीवन में
  rationale: शाब्दिक अर्थ ‘अब के जीवन में’ है; चुना हुआ रूप वर्तमान सांसारिक जीवन और मृत्यु के बाद की अवस्था के बीच का अंतर स्पष्ट रखता है।
- source_word: θανόντα
  choice: मरने के बाद
  rationale: θνῄσκω का अओरिस्ट कृदन्त σὲ के साथ मेल खाता है और यहाँ कालगत अर्थ देता है—मृत्यु हो जाने के बाद।
- source_word: τιμωρήσεται
  choice: वह ... दण्ड देगा
  rationale: यह तृतीय पुरुष एकवचन भावी रूप है। कर्ता इस उपवाक्य में अनुक्त है, इसलिए हिन्दी में ‘वह’ रखकर कर्तृवाच्य और मूल की अनिर्दिष्टता दोनों सुरक्षित हैं।
theological_decisions:
- issue: भावी क्रिया का अनुक्त कर्ता
  choice: वह तुम्हें ... दण्ड देगा
  alternative: तुम्हें ... दण्ड मिलेगा
  rationale: यूनानी क्रिया तृतीय पुरुष एकवचन है, कर्मवाच्य नहीं। इसलिए कर्ता का नाम जोड़े बिना ‘वह’ द्वारा कर्तृवाच्य बनाए रखा गया है।
- issue: दण्ड का कालगत विस्तार
  choice: इस वर्तमान जीवन में भी और मरने के बाद भी
  alternative: अब और मृत्यु के बाद
  rationale: मूल पाठ सांसारिक जीवन और मृत्यु के बाद—दोनों अवस्थाओं को स्पष्ट रूप से सम्मिलित करता है; अनुवाद इस तनाव को न तो नरम करता है, न विस्तार से सिद्धान्तबद्ध करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘दण्ड देगा’ प्रसंग के दण्डात्मक अर्थ को व्यक्त करता है, जबकि अधिक विशिष्ट ‘बदला लेगा’ को नहीं अपनाता।
