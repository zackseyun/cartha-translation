  text: परन्तु जो सम्मान के साथ मरे, उन्होंने परमेश्वर के प्रति अपनी भक्ति को पूरा किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परमेश्वर के प्रति अपनी ईश्वर-परायणता।’
    reason: εὐσέβεια के लिए निकट शाब्दिक विकल्प; यह परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा का भाव व्यक्त करता है।
lexical_decisions:
- source_word: ἀλλ᾽
  choice: परन्तु
  rationale: यह पिछले प्रसंग से विरोध दर्शाता है; ‘परन्तु’ संक्षिप्त और गरिमापूर्ण संयोजक है।
- source_word: οἱ μὲν
  choice: जिन्होंने
  rationale: οἱ उन व्यक्तियों को सूचित करता है और μέν विरोध के एक पक्ष को चिह्नित करता है; हिन्दी में आगे के विपरीत पक्ष के बिना μέν का अलग अनुवाद अस्वाभाविक होता।
- source_word: εὐγενῶς
  choice: उदात्त भाव से
  rationale: यह क्रिया-विशेषण मृत्यु के श्रेष्ठ, सम्माननीय और साहसी ढंग को व्यक्त करता है; ‘उदात्त भाव से’ आधुनिक हिन्दी में इस नैतिक मूल्यांकन को बनाए रखता है।
- source_word: ἀποθανόντες
  choice: प्राण दिए
  rationale: शहादत के प्रसंग में यह स्वाभाविक हिन्दी अभिव्यक्ति है और पूर्ण हो चुकी मृत्यु को व्यक्त करती है, बिना मूल में निहित सम्माननीय भाव को खोए।
- source_word: ἐπλήρωσαν
  choice: पूर्ण किया
  rationale: क्रिया भर देने, पूरा करने या परिपूर्ण अभिव्यक्ति तक पहुँचाने का भाव रखती है; ‘पूर्ण किया’ इस बात को खुला रखता है कि मृत्यु ने उनकी भक्ति को चरम परिणति दी।
- source_word: τὴν ... εὐσέβειαν
  choice: अपनी भक्ति
  rationale: यहाँ εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुरूप आचरण है; ‘भक्ति’ साधारण आधुनिक पाठकों के लिए स्वाभाविक है और केवल बाहरी धार्मिकता तक सीमित नहीं।
- source_word: εἰς τὸν θεόν
  choice: परमेश्वर के प्रति
  rationale: εἰς भक्ति की दिशा या अभिमुखता बताता है; ‘के प्रति’ हिन्दी में इस सम्बन्ध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: भक्ति
  alternative: ईश्वर-परायणता; श्रद्धा
  rationale: ‘भक्ति’ परमेश्वर के प्रति भीतरी श्रद्धा और व्यवहार में प्रकट निष्ठा दोनों को समेट सकती है। यह किसी बाद की तकनीकी धर्मशास्त्रीय धारणा को नहीं थोपती; विकल्पों को पादटिप्पणी में रखा गया है।
- issue: ἐπλήρωσαν में पूर्णता का स्वरूप
  choice: भक्ति को पूर्ण किया
  alternative: भक्ति को उसकी पूर्णता तक पहुँचाया; भक्ति का पालन पूरा किया
  rationale: मूल क्रिया पूर्णता या परिपूर्ति बताती है, पर उसका ठीक तात्त्विक ढंग निर्दिष्ट नहीं करती। संक्षिप्त अनुवाद उसी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज पाठ। ‘प्राण दिए’ शहादत-संदर्भ में स्वाभाविक है; ‘उदात्त भाव से’ εὐγενῶς के सम्माननीय और साहसी भाव को व्यक्त करता है।
