translation:
  language: hi
  text: और वे युवक की प्रतिज्ञा पर विशेष रूप से प्रसन्न होकर, उसके बन्धन तुरंत खोल दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιχαρέντες
  choice: प्रसन्न होकर
  rationale: यह कृदन्त किसी बात पर प्रसन्न होने का भाव व्यक्त करता है और मुख्य क्रिया से इसका स्वाभाविक संबंध बनाए रखता है।
- source_word: μάλιστα
  choice: विशेष रूप से
  rationale: यह उनकी प्रसन्नता के प्रमुख कारण पर बल देता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐπαγγελίᾳ
  choice: वचन
  rationale: यहाँ शब्द युवक द्वारा दी गई प्रतिज्ञा या आश्वासन को सूचित करता है। ‘वचन’ प्रसंग में संक्षिप्त और स्वाभाविक है, जबकि अर्थ को किसी अधिक तकनीकी धार्मिक अर्थ तक सीमित नहीं करता।
- source_word: τοῦ παιδός
  choice: उस युवक के
  rationale: παῖς आयु और प्रसंग के अनुसार बालक, लड़का या युवक हो सकता है। यहाँ मकाबी भाइयों में से एक का उल्लेख है, इसलिए ‘युवक’ छोटे बच्चे का भ्रामक संकेत देने से बचता है।
- source_word: ταχέως
  choice: तुरंत
  rationale: यह उनकी शीघ्र और तत्पर कार्रवाई को सहज हिन्दी में व्यक्त करता है।
- source_word: ἔλυσαν
  choice: खोलने लगे
  rationale: λύω का मूल अर्थ खोलना या बन्धन से मुक्त करना है। यातना के प्रसंग में ‘उसे खोलने लगे’ उसके बन्धन खोलने की ठोस क्रिया व्यक्त करता है; यूनानी का सरल भूतकाल हिन्दी कथा-प्रवाह में आरम्भिक क्रिया के रूप में स्वाभाविक ढंग से प्रस्तुत हुआ है।
