lexical_decisions:
- source_word: πεισθεὶς
  choice: यदि तुम मान जाओ
  rationale: यह πείθω का एओरिस्ट कर्मवाच्य कृदंत है, जो प्रसंग में शर्त का भाव देता है। ‘यदि तुम मान जाओ’ आधुनिक हिन्दी में स्वाभाविक है और सहमत होने अथवा आग्रह के आगे झुकने की संदर्भगत छाया को खुला रखता है।
- source_word: φίλος
  choice: मित्र
  rationale: मूल अर्थ ‘मित्र’ है। राजदरबार के संदर्भ में इससे कृपापात्र अथवा राजकीय सहयोगी का संकेत मिल सकता है, पर अनुवाद में उस विशेष अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ἔσῃ
  choice: बनोगे
  rationale: εἰμί के भविष्यकाल को हिन्दी में इस प्रसंग में ‘मित्र बनोगे’ कहना ‘मित्र होगे’ से अधिक स्वाभाविक है और आशय को नहीं बदलता।
- source_word: τῶν ἐπὶ τῆς βασιλείας πραγμάτων
  choice: राज्य के कामकाज
  rationale: πράγματα का अर्थ मामले, कार्य या कामकाज हो सकता है। βασιλεία के साथ यह राजकीय प्रशासन से जुड़े कार्यों को सूचित करता है; ‘राज्य के कामकाज’ स्पष्ट और सहज हिन्दी है।
- source_word: ἀφήγησιν
  choice: प्रबंध तुम्हारे हाथ में होगा
  rationale: यहाँ दुर्लभ संज्ञा नेतृत्व, निर्देशन या प्रशासन का बोध कराती है। यह हिन्दी अभिव्यक्ति सौंपे गए प्रशासनिक अधिकार को स्वाभाविक ढंग से व्यक्त करती है, बिना पूर्ण सार्वभौम शासन का अर्थ आरोपित किए।
