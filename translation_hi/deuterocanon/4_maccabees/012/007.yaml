lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्के संयोजक के रूप में कथा को आगे बढ़ाता है; प्रबल विरोध का भाव नहीं है।
- source_word: προτρεψαμένης
  choice: प्रोत्साहित किया
  rationale: प्रτρέπω का कृदन्त सक्रिय उत्साहवर्धन या प्रेरणा व्यक्त करता है। ‘प्रोत्साहित किया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के अनुरूप पर्याप्त बल रखता है।
- source_word: τῇ Ἑβραΐδι φωνῇ
  choice: इब्रानी भाषा में
  rationale: यहाँ φωνή केवल ध्वनि नहीं, बोली या भाषा को सूचित करता है। यह पदबंध स्पष्ट करता है कि माँ ने उससे किस भाषा में बात की।
- source_word: ὡς ἐροῦμεν
  choice: जैसा कि हम ... बताएँगे
  rationale: भविष्यकालीन क्रिया लेखक की उस टिप्पणी को बनाए रखती है जिसमें वह आगे इसका वर्णन करने का संकेत देता है।
- source_word: μετὰ μικρὸν ὕστερον
  choice: थोड़ी देर बाद
  rationale: यह वाक्यांश निकट आगामी कथन की ओर संकेत करता है और हिन्दी में सहज है।
