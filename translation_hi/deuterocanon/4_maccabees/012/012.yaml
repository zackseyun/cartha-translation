translation:
  language: hi
  text: इन बातों के कारण, ईश्वरीय न्याय तुम्हारे लिए अधिक सघन और अनन्त आग तथा यातनाएँ संचित कर रहा है, जो समूचे युग भर तुम्हें नहीं छोड़ेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθ᾽ ὧν
  choice: इन कामों के बदले
  rationale: यह पदबंध प्रतिफल या दण्ड के कारण का भाव देता है; संदर्भ में ‘इन कामों के बदले’ स्वाभाविक और स्पष्ट है।
- source_word: ταμιεύεταί σε
  choice: तुम्हारे लिए ... संचित कर रहा है
  rationale: ταμιεύομαι का मूल भाव भंडार में रख छोड़ना या संचित करना है; यह आने वाले दण्ड के सुरक्षित रखे जाने की छवि बनाए रखता है।
- source_word: ἡ θεία δίκη
  choice: ईश्वरीय न्याय
  rationale: δίκη यहाँ न्याय और उसके दण्डकारी परिणाम दोनों को व्यक्त करता है; ‘ईश्वरीय न्याय’ इस मानवीकरण को सुरक्षित रखता है।
- source_word: πυκνοτέρῳ
  choice: और भी सघन
  rationale: शब्द का मूल अर्थ ‘अधिक घना/सघन’ है। आग के साथ यह असामान्य पर जानबूझकर तीव्र चित्र है, इसलिए इसे केवल ‘अधिक तीव्र’ बनाकर सामान्य नहीं किया गया।
- source_word: αἰωνίῳ πυρὶ
  choice: अनन्त आग
  rationale: αἰώνιος का यहाँ दण्ड की दीर्घ और अतिकालिक अवधि वाला स्वाभाविक अर्थ लिया गया है।
- source_word: βασάνοις
  choice: यातनाएँ
  rationale: बहुवचन रूप शारीरिक अथवा दण्डात्मक पीड़ाओं को दर्शाता है; ‘यातनाएँ’ उसका सीधा और वर्तमान हिन्दी रूप है।
- source_word: εἰς ὅλον τὸν αἰῶνα
  choice: समूचे युग भर
  rationale: मूल में αἰών संज्ञा का स्पष्ट कालगत रूप है। ‘समूचे युग भर’ उसे ‘सदा’ में समतल किए बिना उसकी अभिव्यक्ति सुरक्षित रखता है।
- source_word: οὐκ ἀνήσουσί σε
  choice: तुम्हें नहीं छोड़ेंगी
  rationale: ἀνίημι यहाँ छोड़ देने, ढील देने या मुक्त करने का भाव रखता है; यातनाओं को कर्ता मानते हुए ‘नहीं छोड़ेंगी’ सहज है।
theological_decisions:
- issue: αἰώνιος और εἰς ὅλον τὸν αἰῶνα के पारस्परिक कालगत भाव
  choice: ‘अनन्त आग’ और ‘समूचे युग भर’—दोनों अलग अभिव्यक्तियाँ रखी गईं
  alternative: दोनों को ‘सदा-सर्वदा’ या ‘हमेशा’ के रूप में समान कर देना
  rationale: यूनानी पद एक ही वाक्य में विशेषण αἰώνιος और संज्ञात्मक वाक्यांश ὅλον τὸν αἰῶνα दोनों इस्तेमाल करता है। अनुवाद उनकी वास्तविक शब्दगत भिन्नता और संभावित तनाव को बिना सिद्धान्तगत निष्कर्ष थोपे बनाए रखता है।
- issue: सापेक्ष सर्वनाम αἱ का पूर्वपद
  choice: ‘जो ... नहीं छोड़ेंगी’ को निकटतम स्त्रीलिंग बहुवचन ‘यातनाएँ’ से जोड़ा गया
  alternative: आग और यातनाओं दोनों को संयुक्त कर्ता मानना
  rationale: यूनानी αἱ स्त्रीलिंग बहुवचन है और βασάνοις के लिंग-वचन से मेल खाता है, जबकि πυρί नपुंसकलिंग एकवचन है। इसलिए व्याकरणतः यातनाएँ ही सर्वाधिक स्वाभाविक पूर्वपद हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए बोधगम्य रूप। ‘सघन आग’ जानबूझकर कुछ असामान्य रखा गया है, क्योंकि मूल यूनानी की छवि भी असामान्य है। कोई सम्प्रदायगत व्याख्या नहीं जोड़ी गई।
