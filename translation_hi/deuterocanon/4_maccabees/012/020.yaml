translation:
  language: hi
  text: इन बातों को प्रार्थना में कहने के बाद उसने अपने आप को तवों पर फेंक दिया; और इस तरह उसने प्राण त्याग दिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उसने लौटा दिया” या “उसने सौंप दिया”; अर्थात उसने अपना जीवन दे दिया।
    reason: ἀπέδωκεν में कर्म व्यक्त नहीं किया गया है; यह पादटिप्पणी उसके अधिक शाब्दिक अर्थ और प्रसंगगत आशय को बताती है।
lexical_decisions:
- source_word: καὶ ταῦτα κατευξάμενος
  choice: यह प्रार्थना करने के बाद
  rationale: κατευξάμενος का पूर्वकालिक भाव मुख्य क्रिया से पहले पूरी हुई प्रार्थना को दर्शाता है। ταῦτα पिछली कही हुई बातों की ओर संकेत करता है; हिन्दी में ‘यह प्रार्थना’ उसी संदर्भ को स्वाभाविक रूप से समेटता है।
- source_word: ἑαυτὸν ἔρριψεν
  choice: उसने अपने-आप को ... फेंक दिया
  rationale: निजवाचक सर्वनाम और ῥίπτω का संयोजन जानबूझकर स्वयं को जोर से डालने की क्रिया व्यक्त करता है।
- source_word: κατὰ τῶν τηγάνων
  choice: तवों पर
  rationale: κατά के साथ संबंधकारक यहाँ नीचे की ओर किसी वस्तु पर पड़ने की गति बताता है, और τηγάνων यातना में प्रयुक्त तवों या चपटे धातु-पात्रों को दर्शाता है। मूल पद में ‘तपते’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: καὶ οὕτως ἀπέδωκεν
  choice: और इस तरह उसने प्राण त्याग दिए
  rationale: ἀπέδωκεν का मूल अर्थ ‘लौटा दिया/सौंप दिया’ है, पर यहाँ कर्म लुप्त है और शहादत के प्रसंग में इसका आशय मृत्यु है। ‘प्राण त्याग दिए’ हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: शहादत के वर्णन में ἀπέδωκεν का लुप्त कर्म
  choice: उसने प्राण त्याग दिए
  alternative: उसकी मृत्यु हो गई; उसने लौटा दिया/सौंप दिया
  rationale: यूनानी पाठ ‘प्राण’ या ‘आत्मा’ को स्पष्ट रूप से नहीं कहता। मुख्य पाठ में हिन्दी मुहावरा अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी मूल की संक्षिप्तता और अस्पष्ट कर्म को सुरक्षित रखती है; इससे आत्मा या जीवन के विषय में कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और कथात्मक है। ‘तवों’ सामान्य पाठक के लिए स्पष्ट है, और मूल में निहित न होने के कारण ‘तपते’ नहीं जोड़ा गया। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिसे वह स्पष्ट करता है।
