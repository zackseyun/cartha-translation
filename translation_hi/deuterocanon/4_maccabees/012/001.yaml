translation:
  language: hi
  text: और जब वह भी कड़ाह में फेंके जाने के बाद धन्य होकर मर गया, तब सातवाँ, जो सबमें सबसे छोटा था, आगे आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίως
  choice: धन्य रीति से
  rationale: यह क्रियाविशेषण मृत्यु के ढंग का सकारात्मक और सम्मानसूचक मूल्यांकन करता है। ‘धन्य रीति से’ शहादत के प्रसंग में इसके भाव को बनाए रखता है और इसे केवल प्रसन्न मन से मरने के अर्थ तक सीमित नहीं करता।
- source_word: ἐναπέθανεν
  choice: मर गया
  rationale: संयुक्त क्रिया आरोपित परिस्थिति में मृत्यु को सूचित करती है; हिंदी में ‘मर गया’ स्वाभाविक है, जबकि साथ का कृदंत उस परिस्थिति को स्पष्ट करता है।
- source_word: καταβληθείς
  choice: फेंके जाने के बाद
  rationale: अओरिस्ट कर्मवाच्य कृदंत बलपूर्वक डाले जाने और मुख्य क्रिया से पहले घटित होने को दर्शाता है।
- source_word: λέβητα
  choice: कड़ाह
  rationale: λέβης एक बड़े धातु-पात्र या कड़ाह को दर्शाता है; यातना के इस प्रसंग में ‘कड़ाह’ सटीक और सहज हिंदी है।
- source_word: παρεγίνετο
  choice: आगे आया
  rationale: कथा में यह अगले भाई के परीक्षा के लिए सामने आने को दर्शाता है; ‘आगे आया’ गति और घटनाक्रम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ πάντων νεώτερος
  choice: जो सबमें सबसे छोटा था
  rationale: यह पद सातवें भाई को पूरे समूह में आयु की दृष्टि से सबसे छोटा बताता है। संबंधवाचक उपवाक्य हिंदी में पहचान को स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: शहादत के प्रसंग में μακαρίως का अनुवाद
  choice: धन्य रीति से मर गया
  alternative: सुखपूर्वक मर गया; धन्य होकर मर गया
  rationale: यूनानी पाठ मृत्यु को आदरणीय और धन्य ठहराता है, केवल भावनात्मक प्रसन्नता नहीं बताता। ‘धन्य रीति से’ क्रियाविशेषण का बल और पाठ का मूल्यांकन सुरक्षित रखता है, बिना किसी अतिरिक्त उत्तरकालीन सिद्धांत को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिंदी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘कड़ाह’ और ‘आगे आया’ जैसे प्रचलित शब्द चुने गए हैं। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
