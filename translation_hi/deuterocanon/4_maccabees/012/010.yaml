- source_word: ἐπὶ πλησίον
  choice: के बिलकुल पास गया
  rationale: यह यूनानी पदबंध निकटता के साथ उसकी ओर बढ़ने का भाव भी समेटे हुए है। हिन्दी में ‘के बिलकुल पास गया’ गति और निकट पहुँचने—दोनों को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῶν τηγάνων
  choice: उन कड़ाहों
  rationale: τήγανον खाना पकाने या तलने का चौड़ा पात्र है; इस प्रसंग में इन्हीं गरम पात्रों को यातना के साधन के रूप में इस्तेमाल किया जा रहा है। ‘कड़ाहों’ सामान्य हिन्दी में प्रसंगानुकूल और समझने योग्य है, जबकि ‘तवों’ से केवल सपाट तवे का अधिक संकीर्ण बोध हो सकता है। ‘उन’ से पहले उल्लिखित यातना-साधनों की निश्चितता प्रकट होती है।
- source_word: ἔφη
  choice: बोला
  rationale: यह कथात्मक शैली में सीधे कथन का सामान्य परिचायक है। ‘बोला’ आधुनिक हिन्दी में सहज है और आगे आने वाले उद्धरण की भूमिका बनाता है।
