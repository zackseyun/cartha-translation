  text: Release me[a], he says, so that I may tell the king and all his friends who are with him.
translation:
  language: hi
  text: “मुझे छोड़ दो,” वह कहता है, “ताकि मैं राजा और उसके साथ के सभी मित्रों[a] से बात कर सकूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके साथ के सभी सहयोगियों” अथवा “उसके साथ के सभी दरबारियों।” यूनानी φίλοι का अर्थ निजी मित्र या राजा के सहयोगी/दरबारी हो सकता है; मुख्य पाठ में सबसे सीधा अर्थ “मित्रों” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπόλυσόν με
  choice: मुझे छोड़ दो
  rationale: ἀπόλυσον प्रत्यक्ष, एकवचन आज्ञार्थक रूप है और बंधन अथवा हिरासत से मुक्त करने की विनती व्यक्त करता है। ‘मुझे छोड़ दो’ आधुनिक हिन्दी में स्वाभाविक है और कानूनी अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: φησίν
  choice: वह कहता है
  rationale: यूनानी में यह कथात्मक ऐतिहासिक वर्तमान है; हिन्दी में वर्तमान काल बनाए रखने से कथन की सजीवता बनी रहती है।
- source_word: εἴπω
  choice: ताकि मैं … से बात कर सकूँ
  rationale: आज्ञार्थक क्रिया के बाद आया अओरिस्ट संभावनार्थक रूप उद्देश्य व्यक्त करता है। सम्बोधित व्यक्तियों के लिए सम्प्रदान कारक होने से ‘से बात कर सकूँ’ सहज हिन्दी है; यह किसी अनुल्लिखित संदेश की विषयवस्तु नहीं जोड़ता।
- source_word: τῷ βασιλεῖ
  choice: राजा
  rationale: εἴπω के साथ सम्प्रदान कारक में आया पद सम्बोधित व्यक्ति को दर्शाता है; ‘से बात’ की हिन्दी संरचना में ‘राजा’ के साथ परसर्ग ‘से’ संयुक्त रूप से लागू होता है।
- source_word: τοῖς σὺν αὐτῷ φίλοις πᾶσιν
  choice: उसके साथ के सभी मित्रों
  rationale: πᾶσιν को ‘सभी’, σὺν αὐτῷ को ‘उसके साथ के’, और φίλοις को उसके सीधे अर्थ ‘मित्रों’ से व्यक्त किया गया है। φίλοι राजकीय सहयोगियों या दरबारियों के लिए भी प्रयुक्त हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
