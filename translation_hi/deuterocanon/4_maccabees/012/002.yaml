translation:
  language: hi
  text: उस पर अत्याचारी को दया आई[a]; यद्यपि उसके भाइयों के कारण उसे बड़ी क्रूर यातना सहनी पड़ी थी, फिर भी अत्याचारी ने देखा कि वह पहले ही बेड़ियों में जकड़ा हुआ था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का शाब्दिक अर्थ ‘उसके भाइयों द्वारा उसके साथ बड़ी क्रूरता की गई थी’ भी हो सकता है। यहाँ ‘उसके भाइयों के कारण’ अनुवाद किया गया है, क्योंकि संदर्भ में भाइयों द्वारा स्वयं उसे सताना अस्पष्ट और कठिन प्रतीत होता है।
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: κατοικτειρήσας
  choice: दया आई
  rationale: यह कृदंत दया या करुणा अनुभव करने को व्यक्त करता है। हिंदी में ‘उस पर ... को दया आई’ स्वाभाविक है और भावात्मक बल बनाए रखता है।
- source_word: ὁ τύραννος
  choice: अत्याचारी
  rationale: τύραννος यहाँ सताने वाले शासक के लिए नैतिक रूप से निंदात्मक पद है; ‘अत्याचारी’ उस मूल्यांकन को तटस्थ ‘राजा’ या ‘शासक’ से बेहतर सुरक्षित रखता है।
- source_word: καίπερ
  choice: यद्यपि ... फिर भी
  rationale: यह प्रबल विरोधसूचक रियायत दर्शाता है; आधुनिक मानक हिंदी में यह संरचना संबंध स्पष्ट करती है।
- source_word: δεινῶς ... κακισθείς
  choice: बड़ी क्रूर यातना सहनी पड़ी थी
  rationale: संयुक्त पद कठोर और भयावह दुर्व्यवहार दर्शाते हैं। कथा के यातना-संदर्भ में यह स्वाभाविक है, पर किसी विशिष्ट यातना-विधि को नहीं जोड़ता।
- source_word: ὑπὸ τῶν ἀδελφῶν αὐτοῦ
  choice: उसके भाइयों के कारण
  rationale: ὑπό के साथ कर्मवाच्य प्रयोग सामान्यतः कर्ता दर्शाता है, पर यहाँ भाइयों द्वारा प्रत्यक्ष दुर्व्यवहार का अर्थ कथानक से असंगत हो सकता है। ‘के कारण’ ग्रीक की वास्तविक अस्पष्टता और संभावित पाठगत कठिनाई को सुरक्षित रखता है।
- source_word: ὁρῶν
  choice: देखा
  rationale: कृदंत का कर्ता अत्याचारी है; हिंदी में सीमित क्रिया से कर्ता और दृश्य संबंध अधिक स्पष्ट और स्वाभाविक बनते हैं।
- source_word: ἤδη
  choice: पहले ही
  rationale: यह अवस्था के उस समय तक लागू हो चुकने को सीधे व्यक्त करता है।
- source_word: τὰ δεσμὰ περικείμενον
  choice: बेड़ियों में जकड़ा हुआ था
  rationale: περίκειμαι का मूल बिंब बंधनों के उसके चारों ओर पड़े होने का है। हिंदी में ‘बेड़ियों में जकड़ा’ स्वाभाविक है और बंधी हुई अवस्था स्पष्ट करता है।
theological_decisions:
- issue: ἀδελφῶν का लिंग-सूचक संबंधवाचक अर्थ
  choice: भाइयों
  alternative: भाई-बहनों
  rationale: कथा पुरुष सहोदरों से संबंधित है; इसलिए पुल्लिंग को सामान्यीकृत नहीं किया गया।
- issue: τύραννος का मूल्यांकनात्मक पद
  choice: अत्याचारी
  alternative: राजा / शासक
  rationale: मूल पाठ की नैतिक निंदा को तटस्थ राजनीतिक पद से नरम नहीं किया गया।
- issue: ὑπὸ τῶν ἀδελφῶν αὐτοῦ की कठिन एजेंसी
  choice: उसके भाइयों के कारण
  alternative: उसके भाइयों द्वारा
  rationale: शाब्दिक व्याकरण ‘भाइयों द्वारा’ की ओर संकेत कर सकता है, किंतु कथा-संदर्भ में यह कठिन है। अनुवाद कारणात्मक संभावना रखता है और पादटिप्पणी में शाब्दिक विकल्प देता है, ताकि तनाव चुपचाप हल न हो।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पद एक बड़े वाक्य का आरंभिक, अपूर्ण खंड है; इसलिए अंत में अल्पविराम रखा गया है। मुख्य पाठ में पादटिप्पणी-चिह्न [a] उपस्थित है।
