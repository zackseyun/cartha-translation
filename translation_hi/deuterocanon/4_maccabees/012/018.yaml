  yaml_path: translation/deuterocanon/4_maccabees/012/018.yaml
  text: But I call upon the God of my fathers[b][a], that he may be merciful to my nation.
translation:
  language: hi
  text: परन्तु मैं अपने पूर्वजों के परमेश्वर को पुकारता हूँ[a] कि वह मेरे लोगों पर दया करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने पैतृक परमेश्वर को’ अथवा ‘अपने पितरों के परमेश्वर को।’
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे वंश पर,’ ‘मेरे समुदाय पर,’ अथवा अधिक शाब्दिक रूप में ‘मेरी जाति पर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλοῦμαι
  choice: पुकारता हूँ
  rationale: यह क्रिया परमेश्वर से की गई गंभीर, प्रार्थनापूर्ण पुकार को व्यक्त करती है। ‘पुकारता हूँ’ सहज हिन्दी है और ‘आह्वान करता हूँ’ की अपेक्षा कम अनुष्ठानिक सुनाई देती है।
- source_word: τὸν πατρῷον θεόν
  choice: अपने पूर्वजों के परमेश्वर को
  rationale: πατρῷος उस परमेश्वर को दर्शाता है जो वक्ता के पितरों अथवा पूर्वजों का परमेश्वर है। यह अभिव्यक्ति पैतृक-ऐतिहासिक संबंध को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: ὅπως
  choice: कि
  rationale: यह पुकार के अभिप्राय या अपेक्षित परिणाम को प्रस्तुत करता है; हिन्दी में ‘कि’ यहाँ संक्षिप्त और स्वाभाविक है।
- source_word: ἐλέως γένηται
  choice: दया करे
  rationale: शाब्दिक रूप ‘दयालु हो’ हो सकता है, पर इस प्रार्थना में हिन्दी का ‘दया करे’ उसी विनती को अधिक स्वाभाविक ढंग से व्यक्त करता है और परमेश्वर के स्वभाव में परिवर्तन का अनावश्यक संकेत नहीं देता।
- source_word: τῷ γένει μου
  choice: मेरे लोगों पर
  rationale: γένος का अर्थ वंश, कुल, जातीय समुदाय या लोग हो सकता है। उत्पीड़न के प्रसंग में वक्ता का व्यापक समुदाय अभिप्रेत जान पड़ता है; ‘मेरे लोग’ आधुनिक हिन्दी में स्पष्ट है और ‘जाति’ के संभावित भ्रामक आधुनिक अर्थों से बचता है।
theological_decisions:
- issue: τῷ γένει μου का दायरा
  choice: मेरे लोगों पर
  alternative: मेरे वंश पर; मेरे समुदाय पर; मेरी जाति पर
  rationale: यूनानी पद व्यापक अर्थ रखता है। प्रसंग पूरे यहूदी समुदाय के साथ एकजुटता की ओर संकेत करता है, पर पादटिप्पणी वंशगत अर्थ की वास्तविक संभावना को भी सुरक्षित रखती है।
- issue: πατρῷον θεόν का संबंधपरक अर्थ
  choice: अपने पूर्वजों के परमेश्वर
  alternative: अपने पैतृक परमेश्वर; अपने पितरों के परमेश्वर
  rationale: चुना हुआ रूप परमेश्वर और वक्ता के पूर्वजों के ऐतिहासिक संबंध को व्यक्त करता है, बिना किसी अतिरिक्त सांप्रदायिक व्याख्या को जोड़े।
- issue: ἐλέως γένηται में γένηται का भाव
  choice: दया करे
  alternative: दयालु हो; दयालु सिद्ध हो
  rationale: प्रार्थना परमेश्वर की दया की याचना करती है। सहज हिन्दी में क्रियात्मक रूप उपयुक्त है और इसे परमेश्वर के चरित्र में बदलाव के कथन के रूप में नहीं पढ़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनापरक रखी गई है। ‘परन्तु’ δέ के हल्के विरोध अथवा प्रसंगगत संक्रमण को दर्शाता है। ‘परमेश्वर’ यहूदी एकेश्वरवादी प्रसंग के अनुरूप मानक हिन्दी रूप है।
