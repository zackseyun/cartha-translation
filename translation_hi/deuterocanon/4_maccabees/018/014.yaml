  text: And he kept reminding you of the Scripture of Isaiah that says[a], “Even if you pass through fire, a flame will not burn you.”
translation:
  language: hi
  text: 'और वह तुम्हें यशायाह के पवित्र ग्रंथ के उस वचन की बार-बार याद दिलाता था, जो कहता है[a]: “यदि तुम आग में से होकर भी जाओ, तो ज्वाला तुम्हें नहीं जलाएगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह उद्धरण यशायाह 43:2 की प्रतिध्वनि है। यहाँ 4 मक्काबियों में यूनानी शब्द-विन्यास है: “ज्वाला तुम्हें नहीं जलाएगी।”'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπεμίμνησκεν
  choice: बार-बार याद दिलाता था
  rationale: अपूर्ण भूतकाल क्रिया के जारी रहने या दोहराए जाने का भाव व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से उस पक्ष को बनाए रखता है।
- source_word: τὴν Ἡσαΐου γραφὴν
  choice: यशायाह के पवित्रशास्त्र के इस वचन
  rationale: यहाँ γραφή किसी सामान्य लेख के बजाय यशायाह के पवित्रशास्त्रीय पाठ को दर्शाता है। ‘इस वचन’ आगामी उद्धरण से संबंध को हिंदी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: τὴν λέγουσαν
  choice: 'इस वचन की ...:'
  rationale: यूनानी कृदंत उद्धरण प्रस्तुत करता है। हिंदी में ‘इस वचन की ... याद’ और उसके बाद द्विबिंदु वही कार्य स्वाभाविक ढंग से करते हैं।
- source_word: Κἂν
  choice: यदि ... भी
  rationale: καὶ ἐάν के रियायती सशर्त भाव को आधुनिक हिंदी में ‘यदि ... भी’ ठीक प्रकार व्यक्त करता है।
- source_word: διὰ πυρὸς διέλθῃς
  choice: तुम आग में से होकर ... जाओ
  rationale: यह आग के बीच से गुजरने की मूल छवि और सशर्त क्रिया-भाव को बनाए रखता है।
- source_word: φλὸξ
  choice: ज्वाला
  rationale: ‘ज्वाला’ पहले आए ‘आग’ से अलग एकवचन चित्र को बनाए रखती है और गरिमापूर्ण, सहज हिंदी है।
- source_word: οὐ κατακαύσει σε
  choice: तुम्हें नहीं जलाएगी
  rationale: यह सुरक्षा के आशय को बिना ‘भस्म’ जैसे अधिक प्रबल अर्थ जोड़े सीधे व्यक्त करता है।
theological_decisions:
- issue: यशायाह के उद्धरण को परिचित बाइबलीय शब्दावली से मिलाना
  choice: 4 मक्काबियों में दिए गए यूनानी पाठ का स्वतंत्र अनुवाद
  alternative: यशायाह 43:2 के किसी प्रचलित हिंदी अनुवाद की शब्दावली ज्यों की त्यों अपनाना
  rationale: मूल-पाठ की प्राथमिकता के अनुसार उद्धरण को 4 मक्काबियों के अपने यूनानी रूप से अनूदित किया गया है; उसे किसी परिचित अनुवाद से समरूप नहीं किया गया।
- issue: ὑπεμίμνησκεν का क्रिया-पक्ष
  choice: दोहराव/निरंतरता को ‘बार-बार याद दिलाता था’ से व्यक्त करना
  alternative: केवल ‘याद दिलाया’
  rationale: यूनानी अपूर्ण भूतकाल में निहित जारी या पुनरावृत्त कार्य को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। ‘पवित्रशास्त्र’ धार्मिक संदर्भ में γραφή का स्पष्ट अनुवाद है, जबकि उद्धरण में ‘आग’ और ‘ज्वाला’ की अलग-अलग छवियाँ सुरक्षित रखी गई हैं।
