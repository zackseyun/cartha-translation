  text: He held up Solomon before us as a proverb, the one who says, “It is a tree of life for all who do his will.”
translation:
  language: hi
  text: 'उसने हमारे सामने सुलैमान के इन शब्दों को नीतिवचन के रूप में उद्धृत किया: “यह उन सबके लिए जीवन का वृक्ष है जो उसकी इच्छा पूरी करते हैं।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह उन सबके लिए जीवन का वृक्ष है जो इसकी इच्छा पूरी करते हैं।” यूनानी सर्वनाम किसी अवैयक्तिक संदर्भ की ओर भी संकेत कर सकता है, यद्यपि प्रसंग में परमेश्वर की ओर संकेत अधिक संभावित है।
    reason: alternative_reading
  - marker: b
    text: यह कथन नीतिवचन 3:18 की रूपांतरित प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαροιμίαζεν
  choice: नीतिवचन के रूप में प्रस्तुत करता था
  rationale: यह क्रिया किसी को लोकोक्ति अथवा नीतिवचन के रूप में उद्धृत करने का भाव देती है। यहाँ कर्म सुलैमान हैं, इसलिए अनुवाद उनके प्रामाणिक कथन को श्रोताओं के सामने रखने का संबंध बनाए रखता है।
- source_word: τὸν Σαλομῶντα
  choice: सुलैमान
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय रूप प्रयोग किया गया है; विभक्ति से वे उद्धृत नीतिवचन के प्रामाणिक वक्ता ठहरते हैं।
- source_word: ἡμῖν
  choice: हमारे सामने
  rationale: सम्प्रदान कारक उन लोगों को दर्शाता है जिनके सामने यह नीतिवचन प्रस्तुत किया गया था।
- source_word: τὸν λέγοντα
  choice: जो कहते हैं
  rationale: संज्ञीकृत वर्तमान कृदन्त सुलैमान को उद्धृत कथन के वक्ता के रूप में पहचानता है; आदरसूचक बहुवचन आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Ξύλον ζωῆς
  choice: जीवन का वृक्ष
  rationale: यह नीतिवचन 3:18 के प्रज्ञा-साहित्यिक पदबंध की प्रतिध्वनि है और हिन्दी बाइबल की परिचित अभिव्यक्ति भी है।
- source_word: πᾶσιν τοῖς ποιοῦσιν
  choice: जो-जो ... पूरी करते हैं, उन सबके लिए
  rationale: यह विन्यास निर्दिष्ट कार्य करने वाले प्रत्येक व्यक्ति को समाविष्ट करता है और हिन्दी में सर्वसमावेशी बल को स्पष्ट रखता है।
- source_word: αὐτοῦ τὸ θέλημα
  choice: उसकी इच्छा
  rationale: सर्वनाम का रूप अपने आप में पुल्लिंग या नपुंसकलिंग संदर्भ की अनुमति देता है। मुख्य पाठ में प्रसंगानुसार परमेश्वर की इच्छा अभिप्रेत है, जबकि वैकल्पिक संदर्भ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: उसकी इच्छा—प्रसंगानुसार परमेश्वर की इच्छा
  alternative: इसकी इच्छा—अर्थात जीवन के वृक्ष या निहित प्रज्ञा की इच्छा
  rationale: कथन नीतिवचन 3:18 को रूपांतरित करता है, और निकट प्रसंग परमेश्वर के प्रति निष्ठा पर केंद्रित है। फिर भी यूनानी सर्वनाम का व्याकरणिक संदर्भ पूर्णतः निश्चित नहीं है, इसलिए वैकल्पिक पठन पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज स्तर रखा गया है। “नीतिवचन के रूप में प्रस्तुत करता था” मूल क्रिया की उद्धरणात्मक और लोकोक्तिपरक शक्ति को बनाए रखता है; “जो-जो ... उन सबके लिए” सार्वत्रिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
