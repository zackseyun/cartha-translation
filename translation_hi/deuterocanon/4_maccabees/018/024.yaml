  text: जिसकी महिमा युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: जिसकी
  rationale: सम्बन्धवाचक सर्वनाम के चतुर्थी रूप को हिन्दी में स्वाभाविक सम्बन्धसूचक रचना से व्यक्त किया गया है; यह पिछले कथन में उल्लिखित व्यक्ति की ओर संकेत करता है और यूनानी सम्बन्धवाचक संरचना को बनाए रखता है।
- source_word: ἡ δόξα
  choice: महिमा
  rationale: उपासना और स्तुतिवचन के प्रसंग में δόξα का प्रचलित, गरिमापूर्ण और अर्थसंगत हिन्दी पर्याय ‘महिमा’ है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह यूनानी मुहावरा अनन्त काल की प्रबल अभिव्यक्ति है। ‘युगानुयुग’ उसका संक्षिप्त, स्वाभाविक और पारंपरिक हिन्दी रूप है।
- source_word: ἀμήν
  choice: आमीन
  rationale: समापन के उपासनात्मक सूत्र को उसके प्रचलित हिन्दी लिप्यंतरण में रखा गया है; यह ‘ऐसा ही हो’ जैसे व्याख्यात्मक अनुवाद से अधिक सीधे मूल रूप और धार्मिक प्रयोग को सुरक्षित रखता है।
theological_decisions:
- issue: क्रियारहित स्तुतिवचन
  choice: महिमा ... होती रहे
  alternative: महिमा ... है
  rationale: यूनानी में क्रिया व्यक्त नहीं है। ‘होती रहे’ स्तुतिपरक कामनात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘है’ इसे केवल तथ्यात्मक कथन बना सकता है। मूल की क्रियारहितता के कारण निहित भाव में कुछ खुलापन है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त, गरिमापूर्ण और उपासनात्मक रखी गई है। ‘जिसकी’ से मूल का सम्बन्धवाचक रूप सुरक्षित है और पूर्ववर्ती प्रसंग पर उसकी निर्भरता अनावश्यक रूप से स्पष्ट नहीं की गई।
