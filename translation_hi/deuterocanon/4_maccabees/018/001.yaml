  yaml_path: translation/deuterocanon/4_maccabees/018/001.yaml
  text: O children[a], descendants of the seed of Abraham, Israelites, obey this law[b], and be godly in every way.
translation:
  language: hi
  text: हे अब्राहम की संतति के वंशजो[a], हे इस्राएली संतानो, इस व्यवस्था की आज्ञा मानो और हर प्रकार से भक्तिपूर्ण आचरण करो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब्राहम की संततियों के वंशज।” मूल यूनानी अभिव्यक्ति असामान्य रूप से परतदार और जोरदार है तथा पैतृक पहचान पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “हर प्रकार से भक्ति का आचरण करो” या “हर प्रकार से श्रद्धापूर्वक जीवन जियो।” यूनानी क्रिया परमेश्वर का आदर करने वाले भक्तिपूर्ण आचरण को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
