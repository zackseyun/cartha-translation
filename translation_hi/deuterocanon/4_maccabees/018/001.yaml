  register: आधुनिक मानक हिन्दी में गरिमापूर्ण वक्तृत्व-शैली रखी गई है। ‘हे’ मूल सम्बोधन का ऊँचा स्वर बनाए रखता है; ‘सन्तानो’ सामूहिक और स्वाभाविक है। पैतृक पहचान की यूनानी परतदारता को मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
