  rationale: सम्बोधन की विस्मयात्मक और ऊँची वक्तृत्व-शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῶν Ἀβραμιαίων σπερμάτων ἀπόγονοι
  choice: अब्राहम के वंश से उत्पन्न वंशजो
  rationale: मूल यूनानी में वंश और वंशज की जानबूझकर परतदार, जोरदार अभिव्यक्ति है। हिन्दी वाक्यांश उस पैतृक पहचान पर दिए गए बल को पूरी तरह सपाट किए बिना व्यक्त करता है।
- source_word: παῖδες
  choice: सन्तानो
  rationale: सामूहिक पारिवारिक सम्बोधन को व्यक्त करता है और केवल पुरुषों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: Ἰσραηλεῖται
  choice: इस्राएली
  rationale: जातीय और राष्ट्रीय पहचान के लिए प्रचलित हिन्दी रूप।
- source_word: πείθεσθε
  choice: पालन करो
  rationale: व्यवस्था के साथ प्रयुक्त क्रिया यहाँ केवल सहमत होने के बजाय व्यावहारिक आज्ञापालन बताती है।
- source_word: τῷ νόμῳ τούτῳ
  choice: इस व्यवस्था
  rationale: सन्दर्भ में यह इस्राएल को दी गई पैतृक व्यवस्था, अर्थात तोराह, की ओर संकेत करता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
- source_word: πάντα τρόπον
  choice: हर प्रकार से
  rationale: आचरण की सर्वांगीणता बताने वाले यूनानी क्रियाविशेषणीय पद का सहज हिन्दी रूप।
- source_word: εὐσεβεῖτε
  choice: भक्तिपूर्ण जीवन जियो
  rationale: क्रिया केवल भीतरी श्रद्धा नहीं, बल्कि परमेश्वर का आदर करने वाले व्यवहार और जीवन को दर्शाती है।
theological_decisions:
- issue: ‘इस व्यवस्था’ का सन्दर्भ
  choice: इस्राएल की पैतृक वाचा-संबंधी व्यवस्था, अर्थात तोराह
  alternative: सामान्य नैतिक नियम
  rationale: इस्राएलियों को सम्बोधन और 4 मकाबियों का प्रसंग विशिष्ट रूप से पैतृक व्यवस्था की ओर संकेत करते हैं, सामान्य नैतिकता की ओर नहीं।
- issue: εὐσεβεῖτε में धार्मिक आचरण का बल
  choice: भक्तिपूर्ण जीवन जियो
  alternative: श्रद्धालु बनो / भक्ति दिखाओ
  rationale: यह अनुवाद परमेश्वर के प्रति आदर और उससे निकलने वाले जीवन-व्यवहार दोनों को रखता है, बिना किसी सम्प्रदायगत धारणा को जोड़ने के।
