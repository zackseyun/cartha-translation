lexical_decisions:
- source_word: Αὕτη
  choice: यही
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम का संबंध निकटवर्ती पूर्व कथन से है। ‘यही’ संदर्भ को अनावश्यक रूप से किसी स्त्री या वस्तु तक सीमित किए बिना उसके बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ζωὴ
  choice: जीवन
  rationale: यहाँ संज्ञा का सीधा अर्थ ‘जीवन’ है; ‘जीवन-पद्धति’ कहना मूल में निहित न होने वाली व्याख्या जोड़ता।
- source_word: ὑμῶν
  choice: तुम्हारा / तुम्हारे
  rationale: द्वितीय पुरुष बहुवचन संबंधकारक को हिन्दी में प्रसंगानुकूल स्वत्वसूचक रूपों से व्यक्त किया गया है।
- source_word: μακαριότης
  choice: धन्यता
  rationale: यह शब्द केवल भावनात्मक ‘खुशी’ नहीं, बल्कि धन्य होने की उन्नत नैतिक-धार्मिक अवस्था व्यक्त करता है।
- source_word: ἡμερῶν
  choice: दिनों
  rationale: बहुवचन संबंधकारक का निकट और स्वाभाविक अनुवाद; ‘जीवनकाल’ अर्थ को अधिक स्पष्ट करके मूल की अभिव्यक्ति बदल देता।
