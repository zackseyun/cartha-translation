base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/012.yaml
  text: And Phinehas the zealot was speaking to us[b][a], and Hananiah and Azariah and Mishael in the fire were teaching you.
translation:
  language: hi
  text: वह हमें उत्साही पीनहास[a] के बारे में बताता था, और तुम्हें आग में रहने वाले हनन्याह, अजर्याह और मीशाएल[b] के बारे में सिखाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्साह से भरा पीनहास।” यूनानी शब्द पीनहास के विशिष्ट उत्साह को उभारता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आग में रहने वाले हनन्याह, अजर्याह और मीशाएल।” यह पद इन तीनों को आग में होने के उनके अनुभव से पहचानता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: बताया करता था
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार किए जाने वाले कथन का भाव देता है। यहाँ व्यक्ति के कर्मों की कथा सुनाने के अर्थ में यह स्वाभाविक हिन्दी है।
- source_word: τὸν ζηλωτὴν Φινεές
  choice: उत्साही पीनहास
  rationale: ζηλωτής पीनहास को उसके प्रबल उत्साह के लिए पहचानता है। ‘उत्साही’ इस भाव को रखता है और बाद के किसी राजनीतिक दल से जुड़ा अर्थ नहीं लाता। नाम का रूप प्रचलित बाइबलीय हिन्दी के अनुसार रखा गया है।
- source_word: ἐδίδασκεν
  choice: शिक्षा दिया करता था
  rationale: अपूर्ण भूतकाल बार-बार दी जाने वाली शिक्षा का भाव रखता है और समानांतर ἔλεγεν के पक्ष को भी व्यक्त करता है।
- source_word: τοὺς ἐν πυρὶ
  choice: आग में पड़े
  rationale: यह पद तीनों युवकों को उनकी अग्नि-परीक्षा के आधार पर पहचानता है। ‘पड़े’ यहाँ उस दशा में होने का स्वाभाविक हिन्दी संकेत है, न कि गिरने का दावा।
- source_word: Ἀνανίαν καὶ Ἀζαρίαν καὶ Μισαήλ
  choice: हनन्याह, अजर्याह और मीशाएल
  rationale: हिब्रू मूल से जुड़े ये नाम आधुनिक हिन्दी बाइबल-पाठकों के लिए पहचाने जाने योग्य रूपों में दिए गए हैं।
theological_decisions:
- issue: उदाहरणात्मक पात्रों और शिक्षा देने वाले कर्ता का संबंध
  choice: पीनहास और तीनों युवकों को उस शिक्षा की विषयवस्तु माना गया है जो पूर्वप्रसंग का एकवचन कर्ता देता था।
  alternative: इन पात्रों को रूपकात्मक ढंग से स्वयं बोलने और शिक्षा देने वाले कर्ता समझा जा सकता है।
  rationale: यूनानी में τὸν ζηλωτὴν और τοὺς ἐν πυρὶ कर्मकारक हैं, जबकि ἔλεγεν और ἐδίδασκεν एकवचन क्रियाएँ हैं। इसलिए स्रोत की व्याकरणिक बनावट पूर्वप्रसंग के कर्ता द्वारा इन उदाहरणों के विषय में बताने और सिखाने का समर्थन करती है; फिर भी उनके उदाहरणात्मक प्रभाव को अनावश्यक रूप से विस्तार देकर सिद्धांत नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वह’ पूर्वप्रसंग के एकवचन कर्ता को जारी रखता है। समानांतर अपूर्ण भूतकालों के लिए ‘बताया करता था’ और ‘शिक्षा दिया करता था’ चुने गए हैं।
