  yaml_path: translation/deuterocanon/4_maccabees/018/011.yaml
  text: And he recounted to us Abel[a], who was slain by Cain, and Isaac being offered up as a whole burnt offering, and Joseph in prison.
translation:
  language: hi
  text: और वह हमें कैन के हाथों मारे गए हाबिल, होमबलि के रूप में चढ़ाए जा रहे इसहाक[a], और बंदीगृह में पड़े यूसुफ के विषय में पढ़कर सुनाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में होमबलि की विशिष्ट बलिदानी भाषा प्रयुक्त है; इससे उत्पत्ति 22 की घटना का संकेत मिलता है। इसहाक वास्तव में जलाए नहीं गए थे।
    reason: बलिदानी पद का शाब्दिक भाव और उत्पत्ति 22 का संकेत स्पष्ट करना।
lexical_decisions:
- source_word: ἀνεγίνωσκεν … ἡμῖν
  choice: वह हमें … पढ़कर सुनाता था
  rationale: ἀναγινώσκω का सामान्य अर्थ ‘पढ़ना’ है; अपूर्ण काल किसी बीती हुई, बार-बार होने वाली क्रिया को सूचित करता है। ‘पढ़कर सुनाता था’ श्रोताओं के सामने पवित्र कथाएँ पढ़े जाने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: τὸν ἀναιρεθέντα Ἄβελ ὑπὸ Κάϊν
  choice: कैन के हाथों मारे गए हाबिल
  rationale: ἀναιρέω यहाँ हिंसक रूप से मार डालने को दर्शाता है। ‘के हाथों मारे गए’ कर्ता और कर्म का संबंध स्पष्ट तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τὸν ὁλοκαυτούμενον Ἰσαάκ
  choice: होमबलि के रूप में चढ़ाए जा रहे इसहाक
  rationale: ὁλοκαυτούμενον में पूर्णतः जलाए जाने वाले बलिदान की पारिभाषिक भाषा है। यह अनुवाद उत्पत्ति 22 के बलिदानी संकेत को बनाए रखता है, पर ऐसा नहीं कहता कि इसहाक वास्तव में जला दिए गए थे।
- source_word: τὸν ἐν φυλακῇ Ἰωσήφ
  choice: बंदीगृह में पड़े यूसुफ
  rationale: ἐν φυλακῇ का सीधा अर्थ कैद या बंदीगृह में होना है। ‘बंदीगृह में पड़े’ यूसुफ की उस दशा को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: Ἄβελ / Κάϊν / Ἰσαάκ / Ἰωσήφ
  choice: हाबिल / कैन / इसहाक / यूसुफ
  rationale: नामों के लिए हिन्दी बाइबल परंपरा में प्रचलित और सामान्य पाठकों को परिचित रूप अपनाए गए हैं।
theological_decisions:
- issue: इसहाक के लिए बलिदानी शब्दावली
  choice: होमबलि के रूप में चढ़ाए जा रहे इसहाक
  alternative: होमबलि किए जा रहे इसहाक
  rationale: यूनानी शब्द इसहाक को होमबलि की प्रक्रिया में प्रस्तुत करता है। चुना हुआ रूप उस धार्मिक-साहित्यिक संकेत को सुरक्षित रखता है, साथ ही यह गलत धारणा उत्पन्न नहीं करता कि बलिदान वास्तव में पूरा हुआ था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पढ़कर सुनाता था’ अपूर्ण काल की पुनरावृत्त क्रिया को दर्शाता है; तीनों उदाहरण समानांतर वाक्य-विन्यास में रखे गए हैं।
