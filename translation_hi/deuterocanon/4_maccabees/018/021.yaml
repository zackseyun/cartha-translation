lexical_decisions:
- source_word: τὰς τῶν ὀμμάτων κόρας
  choice: उनकी आँखों की पुतलियों को
  rationale: κόρας यहाँ आँख के शारीरिक अंग, अर्थात् पुतलियों, को दर्शाता है। यह अनुवाद सटीक और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐπήρωσεν
  choice: क्षत-विक्षत कर दिया
  rationale: क्रिया का अर्थ अंगभंग करना, अपंग कर देना या बुरी तरह क्षति पहुँचाना है। यह चयन मूल की हिंसा को व्यक्त करता है, पर ‘निकाल दिया’ जैसी अधिक विशिष्ट क्रिया आरोपित नहीं करता।
- source_word: γλώσσας ἐξέτεμεν
  choice: उनकी जीभें काट निकालीं
  rationale: ἐκτέμνω किसी अंग को काटकर निकालने का भाव रखता है। बहुवचन ‘जीभें’ और प्रसंग से स्पष्ट ‘उनकी’ हिन्दी में स्वाभाविक हैं।
- source_word: βασάνοις ποικίλαις
  choice: तरह-तरह की यातनाएँ देकर
  rationale: यह साधनवाचक दत्तिव विभिन्न प्रकार की यातनाओं के माध्यम से मारने का भाव देता है। यह अभिव्यक्ति सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀπέκτεινεν
  choice: उन्हें मार डाला
  rationale: यह सामान्यतः ‘मार डालना’ है। मूल यूनानी में कर्म दोबारा व्यक्त नहीं है, पर हिन्दी में संदर्भित बहुवचन पीड़ितों के लिए ‘उन्हें’ आवश्यक और स्वाभाविक है।
