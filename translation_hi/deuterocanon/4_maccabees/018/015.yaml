  text: भजन-रचयिता दाऊद ने हमें गाकर सुनाया, “धर्मियों के बहुत-से संकट हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ὑμνογράφον
  choice: भजन-रचयिता
  rationale: यह शब्द भजनों अथवा स्तुतिगीतों की रचना करने वाले को दर्शाता है। प्रसंग में यह दाऊद के लिए प्रयुक्त विशेषण है; ‘भजन-रचयिता’ मूल बिंब को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: ἐμελῴδει
  choice: गाया
  rationale: क्रिया किसी धुन में गाने या गाकर सुनाने का भाव रखती है। ‘गाया’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: सम्प्रदान कारक यहाँ श्रोताओं अथवा लाभ पाने वालों को सूचित करता है। ‘हमारे लिए’ स्वाभाविक हिन्दी है; ‘हमें’ भी संभव है।
- source_word: Δαυεὶδ
  choice: दाऊद
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: Πολλαὶ αἱ θλίψεις
  choice: बहुत-से संकट आते हैं
  rationale: शाब्दिक संरचना ‘संकट बहुत हैं’ है। हिन्दी में ‘बहुत-से संकट आते हैं’ अधिक स्वाभाविक है और उद्धृत भजन का आशय सुरक्षित रखता है।
- source_word: τῶν δικαίων
  choice: धर्मियों पर
  rationale: यूनानी संबंधकारक शाब्दिक रूप से ‘धर्मियों के संकट’ है; हिन्दी में संकट झेलने वालों के लिए ‘धर्मियों पर’ सहज अभिव्यक्ति है।
theological_decisions:
- issue: ὑμνογράφος का दाऊद से संबंध
  choice: ‘भजन-रचयिता’ को ‘दाऊद’ का समानाधिकरण मानना
  alternative: ‘भजनकार दाऊद’ अथवा ‘भजन लिखने वाले दाऊद’
  rationale: संक्षिप्त यूनानी वाक्य-विन्यास में यह पद दाऊद का परिचय देता है, न कि उस व्यक्ति को जिसे लेकर दाऊद ने गाया। अनुवाद इसी संबंध को स्पष्ट करता है और किसी अतिरिक्त सिद्धान्तगत पहचान को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भजन-रचयिता’ मूल यूनानी पद का बिंब बचाता है, जबकि मुख्य वाक्य हिन्दी के स्वाभाविक क्रम में है।
