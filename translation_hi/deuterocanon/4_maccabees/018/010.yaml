  text: जो, जब वह अब भी हमारे साथ थे, तुम्हें व्यवस्था और भविष्यद्वक्ताओं[b] की शिक्षा देते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सिखा रहे थे’ अथवा ‘सिखाया करते थे’; यूनानी अपूर्ण भूतकालीन क्रिया निरंतर या नियमित अतीत की क्रिया पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘व्यवस्था और भविष्यद्वक्ता’ से इस्राएल के पवित्र शास्त्र, विशेषकर तोराह और भविष्यद्वक्ताओं के लेख, अभिप्रेत हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: जो
  rationale: यह संबंधवाचक सर्वनाम पिछले प्रसंग में आए व्यक्ति की ओर संकेत करता है; ‘जो’ यूनानी वाक्य-संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐδίδασκεν
  choice: शिक्षा देते थे
  rationale: अपूर्ण भूतकालीन क्रिया निरंतर या प्रचलित अतीत की क्रिया व्यक्त कर सकती है। ‘शिक्षा देते थे’ इस पक्ष को स्वाभाविक हिन्दी में खुला रखता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह बहुवचन कर्मकारक सर्वनाम है; प्रसंग के अनेक संबोधित जनों के लिए ‘तुम्हें’ उपयुक्त है।
- source_word: ἔτι ὢν σὺν ἡμῖν
  choice: जब वह अब भी हमारे साथ थे
  rationale: यह कालसूचक परिस्थितिजन्य वाक्यांश है। अनुवाद ἔτι के ‘अब भी’ और σὺν ἡμῖν के ‘हमारे साथ’ दोनों भावों को सुरक्षित रखता है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यहाँ νόμος इस्राएल की तोराह अथवा पवित्र व्यवस्था की ओर संकेत करता है; ‘व्यवस्था’ प्रतिष्ठित और स्पष्ट हिन्दी पद है।
- source_word: καὶ τοὺς προφήτας
  choice: और भविष्यद्वक्ताओं
  rationale: यह ‘व्यवस्था’ के साथ प्रचलित शास्त्रीय युग्म बनाता है और भविष्यद्वक्ताओं के अधिकृत लेखों अथवा संदेश की ओर संकेत करता है।
theological_decisions:
- issue: क्या ‘व्यवस्था और भविष्यद्वक्ताओं’ को शास्त्र के तकनीकी विभागों के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘व्यवस्था और भविष्यद्वक्ताओं’ रखा गया और शास्त्रीय आशय पादटिप्पणी में बताया गया
  alternative: ‘व्यवस्था और भविष्यद्वक्ताओं के लेख’
  rationale: यूनानी पाठ में ‘लेख’ शब्द नहीं है। संक्षिप्त मूल अभिव्यक्ति को बनाए रखना उसके वास्तविक अर्थ-विस्तार और पारंपरिक शास्त्रीय संकेत दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। बहुवचन संबोधन के लिए ‘तुम्हें’ और एकवचन पुरुष के लिए आदरसूचक ‘थे’ प्रयोग किया गया है। वाक्य पिछले प्रसंग से जुड़ा संबंधवाचक खंड है, इसलिए आरंभिक ‘जो’ बनाए रखा गया है।
