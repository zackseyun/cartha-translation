translation:
  language: hi
  text: 'तब वह यरूशलेम से कूच करके फ़ारसियों के विरुद्ध छावनी डाल बैठा। और सात लड़कों की माँ अपने बच्चों में से हर एक से ये बातें भी कहती थी:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε δὴ
  choice: तब
  rationale: ‘तब’ कथानक के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है; δὴ का बल पूरे प्रसंगगत संक्रमण में निहित है, इसलिए ‘निश्चय ही’ जैसा कृत्रिम जोड़ नहीं किया गया।
- source_word: ὑπάρας
  choice: कूच करके
  rationale: पूर्वकालिक कृदन्त मुख्य क्रिया से पहले यरूशलेम से प्रस्थान को बताता है। सैन्य प्रसंग में ‘कूच करके’ स्वाभाविक और सटीक है।
- source_word: ἐστρατοπέδευσεν
  choice: छावनी डाल बैठा
  rationale: यह सैन्य क्रिया छावनी स्थापित करने को व्यक्त करती है। ‘डाल बैठा’ पूर्ण हुई मुख्य क्रिया को प्रवाहपूर्ण कथात्मक हिन्दी में रखता है।
- source_word: ἐπὶ Πέρσας
  choice: फ़ारसियों के विरुद्ध
  rationale: सैन्य प्रसंग में ἐπί और कर्मकारक विरोधी लक्ष्य की ओर अभियान या मोर्चाबंदी को सूचित करते हैं।
- source_word: ἡ μήτηρ τῶν ἑπτὰ παίδων
  choice: सात लड़कों की माँ
  rationale: παῖδες यहाँ सात पुरुष संतानों को दर्शाता है; ‘लड़कों’ से आयु और मातृ-संबंध का स्वर बना रहता है, जबकि इसे अधिक विशिष्ट υἱοί के समान नहीं बनाया जाता।
- source_word: Ἔλεγεν
  choice: कहती थी
  rationale: अपूर्ण भूतकाल का अपूर्णतापरक या पुनरावृत्त भाव हिन्दी के ‘कहती थी’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: καὶ ταῦτα
  choice: भी ... ये बातें
  rationale: ‘भी’ additive καί को और ‘ये बातें’ ταῦτα को सुरक्षित रखता है। हिन्दी के स्वाभाविक शब्दक्रम के अनुसार दोनों को अलग रखा गया है।
- source_word: ἑνὶ ἑκάστῳ τοῖς τέκνοις
  choice: अपने बच्चों में से हर एक से
  rationale: यह स्पष्ट वितरणात्मक अर्थ को व्यक्त करता है और τέκνα के व्यापक, संबंधपरक अर्थ के लिए ‘बच्चों’ को बनाए रखता है।
theological_decisions:
- issue: मातृ-संदर्भ में लिंगसूचक पारिवारिक शब्द
  choice: παῖδες के लिए ‘लड़कों’ और τέκνοις के लिए ‘बच्चों’ का प्रयोग
  alternative: दोनों स्थानों पर ‘बेटों’ अथवा दोनों स्थानों पर ‘बच्चों’ का प्रयोग
  rationale: यूनानी पाठ दो अलग शब्दों का प्रयोग करता है। पहला प्रसंगानुसार पुरुष बच्चों को बताता है, जबकि दूसरा व्यापक संबंधपरक शब्द है; अलग अनुवाद मूल की शब्दगत विविधता और अर्थ-सीमा दोनों को बनाए रखता है।
