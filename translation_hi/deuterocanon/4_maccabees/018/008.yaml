  yaml_path: translation/deuterocanon/4_maccabees/018/008.yaml
  text: No destroyer in the desolate wilderness ruined me in the open field[a], nor did the serpent, destroyer through deceit, violate the purity of my virginity; but I remained with my husband through the time of my prime.
translation:
  language: hi
  text: न तो उजाड़ प्रदेश में विनाश करनेवाले, मैदान में विध्वंस करनेवाले, ने मुझे नष्ट किया; न ही छल द्वारा विनाश करनेवाले सर्प[a] ने मेरे कौमार्य की पवित्रता भंग की; पर मैं अपनी यौवनावस्था भर अपने पति के साथ रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘छल द्वारा विनाश करनेवाला साँप।’ यूनानी में ‘सर्प’ के आसपास हानि और विनाश बतानेवाले कई शब्द एक साथ रखे गए हैं, जिससे छल द्वारा विनाश करनेवाले सर्प की एक सघन छवि बनती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διέφθειρέν
  choice: बरबाद किया
  rationale: क्रिया विनाश या भ्रष्ट किए जाने, दोनों का बोध करा सकती है। यहाँ यौन-हानि से जुड़े समानांतर कथन में ‘बरबाद किया’ शारीरिक और नैतिक क्षति की व्यापकता बनाए रखता है।
- source_word: λυμεὼν
  choice: लुटेरे / विनाश करनेवाले
  rationale: यह संज्ञा हानि पहुँचाने या उजाड़नेवाले व्यक्ति के लिए है। दोनों स्थानों पर एक ही हिंदी शब्द रखने से वाक्य अस्वाभाविक होता; इसलिए पहले प्रसंग में ‘लुटेरे’ और सर्प के साथ ‘विनाश करनेवाले’ रखा गया है, जबकि विनाशकारी भाव दोनों में बना रहता है।
- source_word: τῆς ἐρημίας
  choice: उजाड़ प्रदेश के
  rationale: यह निर्जन और उजाड़ स्थान का बोध देता है। ‘उजाड़ प्रदेश’ आधुनिक हिंदी में स्वाभाविक है और इसे किसी विशिष्ट भौगोलिक मरुभूमि तक सीमित नहीं करता।
- source_word: φθορεὺς ἐν πεδίῳ
  choice: मैदान में विनाश करनेवाले
  rationale: φθορεύς पहले आए विनाशकारी अभिकर्ता का लगभग समानार्थी विशेषण है और ἐν πεδίῳ का शाब्दिक अर्थ ‘मैदान में’ है। डैश से यूनानी की संकुचित समानाधिकरण रचना को पठनीय रूप में रखा गया है।
- source_word: ἐλυμήνατό
  choice: पवित्रता भंग की
  rationale: कौमार्य के संदर्भ में क्रिया सामान्य हानि से बढ़कर यौन उल्लंघन का संकेत देती है। ‘पवित्रता भंग की’ गरिमापूर्ण और स्पष्ट है, पर अनावश्यक रूप से दृश्यात्मक नहीं।
- source_word: τὰ ἁγνὰ τῆς παρθενίας
  choice: मेरे कौमार्य की पवित्रता
  rationale: बहुवचन-संज्ञीकृत τὰ ἁγνά का हिंदी में स्वाभाविक भाववाचक रूप ‘पवित्रता’ है; ‘कौमार्य’ शील और विवाहपूर्व अक्षत अवस्था के संदर्भ को बनाए रखता है।
- source_word: ἀπάτης
  choice: छल से
  rationale: संबंधकारक सर्प के विनाशकारी कार्य के साधन या गुण को व्यक्त कर सकता है। ‘छल से’ इस संबंध को संक्षेप में रखता है और संभावित आदिम सर्प-संकेत को बिना विस्तार दिए सुरक्षित करता है।
- source_word: ὄφις
  choice: सर्प
  rationale: ‘सर्प’ गरिमापूर्ण साहित्यिक रजिस्टर और संभावित धार्मिक-साहित्यिक अनुगूँज को साधारण ‘साँप’ से बेहतर बनाए रखता है।
- source_word: ἔμεινα
  choice: रही
  rationale: यह स्थिर बने रहने या निरंतर रहने का अर्थ देता है। हिंदी में ‘रही’ वैवाहिक संगति की अवधि को सहज रूप से व्यक्त करता है।
- source_word: χρόνον ἀκμῆς
  choice: अपनी यौवनावस्था भर
  rationale: ἀκμή जीवन की चरम, पुष्ट या प्रधान अवस्था को सूचित करता है। इस संदर्भ में ‘यौवनावस्था भर’ अवधि और यौन परिपक्वता, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: σὺν ἀνδρί
  choice: अपने पति के साथ
  rationale: ἀνήρ का अर्थ ‘पुरुष’ या ‘पति’ हो सकता है। वक्ता के कौमार्य और बाद की वैवाहिक संगति के आत्मकथात्मक संदर्भ में ‘पति’ सबसे संगत अर्थ है; स्वामित्वसूचक अर्थ हिंदी में स्वाभाविकता हेतु जोड़ा गया है।
theological_decisions:
- issue: छल करनेवाले सर्प की संभावित अदन-संबंधी अनुगूँज और वक्ता का यौन पवित्रता का दावा
  choice: मुख्य पाठ में ‘सर्प’ और ‘छल से’ रखा गया है, पर संकेत की व्याख्या नहीं जोड़ी गई।
  alternative: ‘साँप’ जैसे अधिक सामान्य शब्द से अनुगूँज को कम करना, अथवा इसे स्पष्ट रूप से अदन के सर्प के रूप में पहचानना।
  rationale: यूनानी पाठ स्वयं ὄφις और ἀπάτης देता है, जो छल करनेवाले सर्प की अनुगूँज उत्पन्न कर सकते हैं। अनुवाद उस साहित्यिक-धर्मवैचारिक संभावना को सुरक्षित रखता है, पर उसकी पहचान को निश्चित सिद्धांत नहीं बनाता।
- issue: वक्ता के ‘कौमार्य’ और पति के साथ रहने के कथनों का संबंध
  choice: 'दोनों कथनों को पाठ के क्रम और तनाव सहित रखा गया है: उसकी कौमार्य-पवित्रता का उल्लंघन नहीं हुआ, और वह अपनी यौवनावस्था भर पति के साथ रही।'
  alternative: ‘कौमार्य’ को व्यापक रूप से केवल वैवाहिक शुचिता कहना या पति के साथ रहने को कौमार्य की समाप्ति की व्याख्या से जोड़ना।
  rationale: पाठ दोनों बातों को साथ रखता है और उनके सटीक संबंध की व्याख्या नहीं करता। हिंदी अनुवाद भी इस तनाव को हल किए बिना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। पहले उपवाक्य में यूनानी के समानाधिकरण और निकटार्थी विनाशकारी शब्दों की सघनता को डैश द्वारा बचाया गया है। ‘कौमार्य की पवित्रता भंग की’ संवेदनशील यौन संदर्भ को स्पष्ट लेकिन अश्लीलतारहित ढंग से व्यक्त करता है।
