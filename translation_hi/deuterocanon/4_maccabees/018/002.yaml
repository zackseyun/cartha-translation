  text: knowing that godly reason is master of the passions[b][a], and not only of inward sufferings but also of outward pains.
translation:
  language: hi
  text: यह जानते हुए कि परमेश्वर-भक्त विवेक[a] मनोवेगों[b] पर अधिकार रखता है—और केवल भीतरी मनोवेगों पर ही नहीं, बल्कि बाहर से आनेवाली पीड़ाओं पर भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भक्तिपूर्ण तर्क-बुद्धि।” यूनानी पद 4 मकाबियों में परमेश्वर के प्रति श्रद्धा से आकार पाए विवेक के लिए एक प्रमुख अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ भीतरी πάθη—अर्थात मनोवेगों या आवेगों—को बाहर से होनेवाली पीड़ाओं (πόνοι) से अलग करता है।
    reason: lexical_distinction
lexical_decisions:
- source_word: γινώσκοντες
  choice: यह जानते हुए
  rationale: यूनानी वर्तमान कृदंत का संबंध बनाए रखता है और उसके कालगत अथवा कारणगत भाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: πάθη यहाँ दार्शनिक-नैतिक अर्थ में उन आंतरिक भावों और आवेगों को सूचित करता है जिन पर विवेक शासन करता है; इसे πόνων से अलग रखा गया है।
- source_word: δεσπότης ἐστίν
  choice: पर अधिकार रखता है
  rationale: शासन और नियंत्रण का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे किसी ईश्वरीय उपाधि के रूप में प्रस्तुत किए।
- source_word: ὁ εὐσεβὴς λογισμός
  choice: परमेश्वर-भक्त विवेक
  rationale: λογισμός के तर्कशील विवेक और εὐσεβής की परमेश्वर के प्रति श्रद्धा—दोनों को बनाए रखता है।
- source_word: τῶν ἔνδοθεν
  choice: भीतरी
  rationale: ἔξωθεν के साथ मूल का भीतर-बाहर विरोध सुरक्षित रखता है।
- source_word: τῶν ἔξωθεν πόνων
  choice: बाहर से आनेवाली पीड़ाओं
  rationale: बाहरी स्रोत से होनेवाले दर्द या कष्ट को स्पष्ट करता है और उसे आंतरिक πάθη से अलग रखता है।
theological_decisions:
- issue: ὁ εὐσεβὴς λογισμός की धार्मिक और दार्शनिक संयुक्त धारणा
  choice: परमेश्वर-भक्त विवेक
  alternative: भक्तिपूर्ण तर्क-बुद्धि
  rationale: चुना हुआ रूप यह स्पष्ट करता है कि यहाँ केवल लौकिक बुद्धिवाद नहीं, बल्कि परमेश्वर के प्रति श्रद्धा से आकार पाया विवेक अभिप्रेत है; साथ ही यह किसी विशिष्ट संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: πάθη और πόνοι के बीच भेद
  choice: मनोवेगों / पीड़ाओं
  alternative: भावनाओं / कष्टों
  rationale: मूल में आंतरिक आवेगों और बाहर से होनेवाली यातना के बीच जानबूझकर किया गया अंतर सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। ‘परमेश्वर-भक्त विवेक’ पुस्तक की केंद्रीय धार्मिक-दर्शनात्मक अभिव्यक्ति को संक्षेप में रखता है। मुख्य वाक्य में ‘भीतरी मनोवेगों’ की पुनरावृत्ति मूल के τῶν ἔνδοθεν के निहित संज्ञार्थ को स्पष्ट करने के लिए है।
