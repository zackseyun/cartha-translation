  yaml_path: translation/deuterocanon/4_maccabees/018/009.yaml
  text: But when these sons had reached adulthood[a], their father died. Blessed was that man, for after experiencing the life of having good children[b], he did not suffer the season of childlessness.
translation:
  language: hi
  text: जब ये पुत्र वयस्क हो गए, तब उनके पिता की मृत्यु हो गई। वह मनुष्य धन्य था, क्योंकि सुयोग्य संतान से संपन्न जीवन का अनुभव करने के बाद[a] उसे संतानहीनता के समय की पीड़ा नहीं सहनी पड़ी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अच्छी संतान होने के जीवन को जानने के बाद।” यूनानी εὐτεκ्नία संतान से संपन्न होने की धन्य और सकारात्मक दशा का बोध कराता है; संदर्भ में संतान की योग्यता का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: कथा के संदर्भ में, उसकी मृत्यु अपने पुत्रों की मृत्यु से पहले हुई; इसलिए उसे उनके बाद संतानहीन रह जाने का संताप नहीं सहना पड़ा।
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐνηλίκων γενομένων
  choice: वयस्क हो गए
  rationale: यह पदबंध पूर्ण आयु या वयस्कता तक पहुँचने को दर्शाता है। हिन्दी में क्रियात्मक रूप स्वाभाविक है और पूर्वकालिक भाव बनाए रखता है।
- source_word: ἐτελεύτησεν
  choice: मृत्यु हो गई
  rationale: क्रिया का अर्थ जीवन के अंत तक पहुँचना और सामान्यतः मरना है। पिता के लिए यह स्पष्ट तथा गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: μακάριος
  choice: धन्य
  rationale: यह शब्द प्रशंसनीय और अनुगृहीत दशा का बोध देता है; ‘धन्य’ इसके ऊँचे नैतिक-धार्मिक स्वर को बनाए रखता है।
- source_word: εὐτεκνίας
  choice: संतान-सुख
  rationale: यह संतान से संपन्न होने की अच्छी और वांछनीय दशा को व्यक्त करता है। संदर्भ में पुत्रों की योग्यता भी निहित है; ‘संतान-सुख’ इस सकारात्मक भाव को सहज हिन्दी में रखता है।
- source_word: τὸν ... βίον ἐπιστήσας
  choice: अपना जीवन पूरा किया
  rationale: ἐπιστήσας को ἐφίστημι के सकर्मक प्रयोग के रूप में लेकर जीवन को समाप्त या पूरा करने का भाव व्यक्त किया गया है। यह मूल यूनानी की व्याकरणिक आकृति को प्राथमिकता देता है और हिन्दी में आत्महत्या का अनचाहा संकेत पैदा नहीं करता।
- source_word: ἀτεκνίας
  choice: संतानहीनता
  rationale: यह बिना संतान रह जाने की दशा को सीधे व्यक्त करता है; कथा-संदर्भ में इसका आशय पुत्रों की मृत्यु के बाद उनसे वंचित हो जाना है।
- source_word: οὐκ ὠδυνήθη
  choice: पीड़ा नहीं सही
  rationale: क्रिया गहरी वेदना या संताप भोगने का अर्थ देती है। यह चयन उस भावनात्मक तीव्रता को संक्षेप में बनाए रखता है।
- source_word: καιρόν
  choice: समय
  rationale: καιρός किसी विशेष परिस्थिति से चिह्नित अवधि या अवसर को दर्शाता है। ‘संतानहीनता का समय’ आधुनिक हिन्दी में स्वाभाविक है और केवल कालक्रम से अधिक स्थितिजन्य भाव रखता है।
theological_decisions:
- issue: पुत्रों की भावी मृत्यु के संबंध में पिता के धन्य होने का आधार
  choice: पिता को इसलिए धन्य कहा गया है कि उसकी मृत्यु पुत्रों से वंचित होने की पीड़ादायक अवस्था से पहले हुई।
  alternative: यह केवल संतानवान और निःसंतान जीवन का सामान्य विरोध हो सकता है, भावी शहादत से इसका विशेष संबंध न हो।
  rationale: निकटवर्ती कथा पुत्रों की मृत्यु पर केंद्रित है, इसलिए संतानहीनता का भाव उनसे बाद में वंचित हो जाने की अवस्था की ओर स्वाभाविक संकेत करता है। मुख्य पाठ इस संकेत को खुला रखता है और टिप्पणी उसे संदर्भ के रूप में स्पष्ट करती है।
- issue: τὸν τῆς εὐτεκνίας βίον ἐπιστήσας का अर्थ
  choice: उसने संतान-सुख में अपना जीवन पूरा किया।
  alternative: उसने अच्छी संतान होने के जीवन का अनुभव किया।
  rationale: ἐπιστήσας का रूप जीवन को अंत तक लाने या पूरा करने के अर्थ का समर्थन करता है, जबकि परामर्श-पाठ इसे अनुभव करने के अर्थ में लेता है। मुख्य अनुवाद मूल रूप के अधिक प्रत्यक्ष अर्थ को अपनाता है और पादटिप्पणी वास्तविक व्याख्यात्मक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘वयस्क’, ‘धन्य’ और ‘संतानहीनता’ स्पष्ट औपचारिक शब्द हैं, जबकि ‘संतान-सुख’ εὐτεκνία के सकारात्मक भाव को साधारण पाठक के लिए सहज बनाता है।
