  yaml_path: translation/deuterocanon/4_maccabees/018/003.yaml
  text: For this reason[a], because of their godliness, when those men gave up their bodies to those sufferings, they were not only admired by men, but were also counted worthy of a divine share.
translation:
  language: hi
  text: इसी कारण कि उन्होंने परमेश्वर-भक्ति के कारण अपने शरीर उन कष्टों के हवाले कर दिए, वे न केवल मनुष्यों द्वारा सराहे गए, बल्कि एक ईश्वरीय भाग[a] के योग्य भी ठहराए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परमेश्वर से मिला भाग’ अथवा ‘ईश्वरीय में सहभागिता।’ यूनानी पदबंध संक्षिप्त है और परमेश्वर द्वारा दिए गए भाग या ईश्वरीय में सहभागिता, दोनों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: इसी कारण
  rationale: यह मुहावरा पिछले कथन से निकलने वाले कारण या परिणाम की ओर संकेत करता है। ‘इसी कारण’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ववर्ती प्रसंग से संबंध बनाए रखता है।
- source_word: διὰ τὴν εὐσέβειαν
  choice: परमेश्वर-भक्ति के लिए
  rationale: εὐσέβεια यहाँ परमेश्वर और उसकी व्यवस्था के प्रति श्रद्धापूर्ण निष्ठा को दर्शाता है। ‘परमेश्वर-भक्ति’ धार्मिक आशय को स्पष्ट रखता है, जबकि ‘के लिए’ उनके कष्ट सहने के प्रेरक उद्देश्य को व्यक्त करता है।
- source_word: προέμενοι τὰ σώματα τοῖς πόνοις
  choice: अपने शरीर यातनाओं के हवाले कर दिए
  rationale: προέμενοι स्वेच्छा से सौंप देने या छोड़ देने का भाव रखता है। यह अनुवाद शहादत के प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है, पर अनावश्यक रूप से बलिदान-संबंधी पारिभाषिक भाषा नहीं जोड़ता। πόνοις के लिए ‘यातनाओं’ से यहाँ की तीव्र शारीरिक पीड़ा स्पष्ट होती है।
- source_word: ἐκεῖνοι
  choice: उन लोगों ने
  rationale: ἐκεῖνοι पुल्लिंग कर्ता है और पहले वर्णित शहीदों की ओर संकेत करता है। इसे πόνοις का विशेषण मानना व्याकरणतः संभव नहीं, क्योंकि उसके लिए दत्तिव बहुवचन ἐκείνοις अपेक्षित होता।
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: न केवल ... बल्कि ... भी
  rationale: मूल यूनानी की तुलनात्मक संरचना को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ὑπὸ τῶν ἀνθρώπων ἐθαυμάσθησαν
  choice: मनुष्यों ने उनकी प्रशंसा की
  rationale: यूनानी कर्मवाच्य का अर्थ सक्रिय हिन्दी वाक्य में अधिक स्वाभाविक ढंग से आता है। ‘मनुष्यों’ से अगले खंड के ईश्वरीय संदर्भ के साथ मानव–ईश्वरीय विरोध बना रहता है।
- source_word: θείας μερίδος
  choice: एक ईश्वरीय भाग
  rationale: संक्षिप्त यूनानी पदबंध यह खुला छोड़ता है कि यह परमेश्वर से मिला भाग है या ईश्वरीय क्षेत्र/वास्तविकता में सहभागिता। ‘ईश्वरीय भाग’ इस अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: κατηξιώθησαν
  choice: योग्य ठहराए गए
  rationale: क्रिया किसी को योग्य मानने या घोषित करने का भाव देती है। ‘योग्य ठहराए गए’ उसके मूल्यांकनात्मक और गरिमापूर्ण स्वर को सुरक्षित रखता है।
theological_decisions:
- issue: θείας μερίδος का आशय
  choice: एक ईश्वरीय भाग
  alternative: परमेश्वर से मिला भाग; ईश्वरीयता में सहभागिता
  rationale: मूल पदबंध पुरस्कार के रूप में परमेश्वर द्वारा दिए गए भाग और ईश्वरीय भागीदारी—दोनों अर्थों की संभावना रखता है। मुख्य पाठ किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। मूल पाठ में ἐκεῖνοι कर्ता (‘वे लोग’) है; इसलिए अंग्रेज़ी परामर्श-पाठ में ‘those sufferings’ से जुड़ी व्याकरणिक असंगति का अनुसरण नहीं किया गया। फुटनोट-चिह्न को उसी पदबंध ‘ईश्वरीय भाग’ पर लगाया गया है जिसकी वैकल्पिक व्याख्याएँ फुटनोट में दी गई हैं।
