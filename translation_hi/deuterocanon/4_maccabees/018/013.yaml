  text: And he also glorified Daniel in the lions’ pit[a], whom he also called blessed.
translation:
  language: hi
  text: और वह सिंहों के गड्ढे में दानिय्येल की भी महिमा करता था[a] और उसे धन्य भी कहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिंहों की माँद में।” यूनानी में शाब्दिक रूप से “सिंहों के गड्ढे में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόξαζεν
  choice: महिमा करता था
  rationale: δοξάζω का मूल भाव महिमा देना, आदर करना या प्रशंसा करना हो सकता है। यहाँ मनुष्य दानिय्येल कर्म का लक्ष्य है; फिर भी स्रोत की ऊँची प्रशंसात्मक भाषा और अपूर्ण भूतकाल की निरंतरता बनाए रखने के लिए ‘महिमा करता था’ चुना गया है।
- source_word: ἐν λάκκῳ λεόντων
  choice: सिंहों के गड्ढे में पड़े
  rationale: λάκκος का सीधा अर्थ गड्ढा या कुंड है। ‘माँद’ परिचित बाइबलीय अभिव्यक्ति है, पर ‘गड्ढा’ यूनानी शब्द के अधिक निकट है। ‘पड़े’ जोड़ने से हिन्दी में दानिय्येल की उस परिस्थिति का स्वाभाविक बोध होता है, बिना स्रोत का आशय बदलने के।
- source_word: ἐμακάριζεν
  choice: धन्य कहता था
  rationale: μακαρίζω किसी को धन्य कहना या मानना है। ‘धन्य कहता था’ क्रियात्मक अर्थ और अपूर्ण भूतकाल दोनों को स्पष्ट रखता है।
- source_word: καὶ ... καί
  choice: भी ... भी
  rationale: दोनों καί को ‘भी’ से व्यक्त करने पर पूर्ववर्ती सूची से संबंध और संचयी बल हिन्दी में स्वाभाविक ढंग से बना रहता है।
- source_word: ὃν
  choice: उसे
  rationale: सम्बन्धवाचक सर्वनाम दानिय्येल की ओर लौटता है। हिन्दी में ‘और उसे’ मूल संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: दानिय्येल के लिए प्रयुक्त महिमा की भाषा
  choice: ‘महिमा करता था’ द्वारा ऊँची सम्मानसूचक भाषा को बनाए रखा गया है, पर इसे उपासना के अर्थ में स्पष्ट नहीं किया गया।
  alternative: ‘आदर करता था’ या ‘प्रशंसा करता था’
  rationale: δοξάζω यहाँ दानिय्येल जैसे मानवीय आदर्श के लिए प्रयुक्त है। नरम विकल्प सम्भव हैं, किंतु वे यूनानी की प्रशंसात्मक तीव्रता घटा देते हैं; इसलिए स्रोत में निहित तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। वाक्य में दोनों ‘भी’ मूल के दोहरे καί को दर्शाते हैं; ‘महिमा करता था’ जानबूझकर स्रोत की ऊँची प्रशंसात्मक भाषा सुरक्षित रखता है।
