  yaml_path: translation/deuterocanon/4_maccabees/018/017.yaml
  text: He bore witness to Ezekiel[a], who says[b], “Will these dry bones live?”
translation:
  language: hi
  text: 'उसने यहेजकेल[a] को, जो कहता है, साक्षी के रूप में प्रस्तुत किया[b]: “क्या ये सूखी हड्डियाँ जीवित होंगी?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह यहेजकेल 37:3 की ओर संकेत है, जहाँ सूखी हड्डियों की तराई के दर्शन में यही प्रश्न पूछा गया है।
    reason: cross_reference
  - marker: b
    text: या, “यहेजकेल की गवाही का सहारा लिया” अथवा “यहेजकेल की बात की पुष्टि की।” यूनानी क्रिया में गवाही को सामने रखने या उससे पुष्टि करने का भाव है और उसका एक ही हिन्दी पद में ठीक-ठीक अनुवाद करना कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστοποιεῖτο
  choice: साक्षी ठहराया
  rationale: यह क्रिया यहाँ किसी की गवाही को पुष्टिकारक साक्ष्य के रूप में सामने रखने का भाव देती है। ‘साक्षी ठहराया’ उसके गवाही-संबंधी अर्थ को बनाए रखता है, जबकि पादटिप्पणी अन्य सम्भव अर्थ स्पष्ट करती है।
- source_word: τὸν Ἰεζεκιὴλ
  choice: यहेजकेल
  rationale: हिन्दी बाइबलीय परम्परा में प्रचलित मानक नाम-रूप अपनाया गया है।
- source_word: τὸν λέγοντα
  choice: यह कहनेवाले
  rationale: वर्तमान कृदन्त उद्धरण का परिचय देता है; हिन्दी में यह रचना यूनानी संरचना और शास्त्रीय कथन की वर्तमान साक्षी—दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: Εἰ ζήσεται
  choice: क्या ... जीवित होंगी?
  rationale: यहाँ εἰ अप्रत्यक्ष/विचारात्मक प्रश्न के रूप में प्रयुक्त है। हिन्दी में ‘क्या’ वास्तविक प्रश्न को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ ὀστᾶ τὰ ξηρὰ ταῦτα
  choice: ये सूखी हड्डियाँ
  rationale: यह हिन्दी का स्वाभाविक शब्दक्रम है और यहेजकेल 37 के सूखी हड्डियों वाले दर्शन की प्रतिध्वनि को स्पष्ट रखता है।
theological_decisions:
- issue: यहेजकेल के उद्धरण और पुनर्जीवन की छवि का निर्वाह
  choice: वक्ता को यहेजकेल को साक्षी ठहराते और केवल प्रश्न उद्धृत करते हुए प्रस्तुत किया गया है।
  alternative: ‘उसने यहेजकेल की गवाही का सहारा लिया’ अथवा ‘उसने यहेजकेल की बात की पुष्टि की।’
  rationale: पद यहेजकेल 37 की ओर संकेत करके मृत्यु के पार जीवन की आशा जगाता है, पर इस प्रश्न से आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष स्वयं नहीं देता। इसलिए अनुवाद उस तनाव और संकेतात्मकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘साक्षी ठहराया’ कुछ औपचारिक है, पर संदर्भ के गवाही-संबंधी अर्थ को सुरक्षित रखता है; पादटिप्पणी अधिक सहज वैकल्पिक अभिव्यक्तियाँ देती है।
