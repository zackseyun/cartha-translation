  yaml_path: translation/deuterocanon/4_maccabees/018/018.yaml
  text: For she did not forget the song that Moses taught[a], which teaches, ‘I kill, and I make alive.’
translation:
  language: hi
  text: क्योंकि वह उस गीत को नहीं भूली जिसे मूसा ने सिखाया था[a] और जो यह सिखाता है, “मैं मार डालूँगा और जीवित करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह पंक्ति व्यवस्थाविवरण 32:39 में मूसा के गीत की प्रतिध्वनि है। उस पद के कुछ अनुवादों में “मैं मारता हूँ और जीवित करता हूँ” मिलता है; पर यहाँ यूनानी क्रियाएँ भविष्यकाल में हैं: “मैं मार डालूँगा और जीवित करूँगा।”'
    reason: cross_reference
lexical_decisions:
- source_word: ᾠδήν
  choice: गीत
  rationale: ‘गीत’ इसका सीधा, स्वाभाविक और व्यापक हिन्दी अर्थ है; ‘स्तुतिगान’ कहने से मूल में निहित न होने वाली प्रशंसा की विशेषता जुड़ जाती।
- source_word: ἐδίδαξεν
  choice: सिखाया था
  rationale: यह क्रिया मूसा द्वारा गीत सिखाए जाने की बीती हुई क्रिया बताती है; हिन्दी में ‘था’ प्रसंगगत पूर्वकाल को स्वाभाविक बनाता है।
- source_word: οὐκ ἐπελάθετο
  choice: नहीं भूली
  rationale: यह मूल के स्मरण-विस्मरण संबंधी सीधे अर्थ को बनाए रखता है और स्त्रीलिंग कर्ता के अनुरूप है।
- source_word: τὴν διδάσκουσαν
  choice: जो यह सिखाता है
  rationale: यूनानी कृदंत ‘गीत’ को शिक्षा देने वाला बताता है। हिन्दी में ‘गीत’ पुल्लिंग होने के कारण ‘सिखाता’ व्याकरणानुसार है; ‘यह’ आगे के उद्धरण को सहजता से प्रस्तुत करता है।
- source_word: Ἐγὼ ἀποκτενῶ, καὶ ζῆν ποιήσω
  choice: मैं मार डालूँगा और जीवित करूँगा
  rationale: दोनों यूनानी क्रियाएँ भविष्यकाल में हैं। ‘जीवित करूँगा’ ζῆν ποιήσω की कारणवाचक शक्ति को संक्षेप और स्पष्ट रूप से बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाले संयोजक का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: मूसा के गीत से उद्धृत परमेश्वर की आत्म-घोषणा का काल और कारणवाचक अर्थ
  choice: मैं मार डालूँगा और जीवित करूँगा
  alternative: मैं मारता हूँ और जीवित करता हूँ; मैं मृत्यु देता हूँ और जीवन देता हूँ
  rationale: इस पद के यूनानी पाठ में क्रियाएँ स्पष्टतः भविष्यकाल में हैं, इसलिए परिचित व्यवस्थाविवरणीय रूप से सामंजस्य बैठाने के बजाय इसी पाठ का काल रखा गया है। ‘जीवित करूँगा’ जीवन प्रदान करने की परमेश्वर की कारणवाचक क्रिया और कथन में उपस्थित प्रभुसत्ता—दोनों को बिना नरम किए व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनयोग्य शैली रखी गई है। ‘वह’ से प्रसंग की स्त्रीलिंग कर्ता सुरक्षित रहती है। उद्धरण में भविष्यकाल मूल यूनानी के अनुसार रखा गया है और किसी परिचित अनुवाद के वर्तमानकाल से उसका मौन सामंजस्य नहीं किया गया।
