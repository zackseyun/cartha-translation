base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/020.yaml
  text: How bitter was that day—and yet not bitter—when the bitter Greek tyrant[a], after kindling fire in the cruel cauldrons and, in boiling rage, bringing the seven boys to the catapult and again to his tortures[b],
translation:
  language: hi
  text: वह दिन कितना कटु था—और फिर भी कटु नहीं[a]—जब यूनानियों के उस कटु तानाशाह ने क्रूर कड़ाहों में आग भड़काकर और उबलते क्रोध में सातों बालकों को कैटापल्ट[b] पर और फिर अपनी यातनाओं के लिए ले जाकर,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“और फिर भी कटु नहीं” यूनानी पाठ के विरोधाभास को बनाए रखता है: वह दिन यातना के कारण कटु था, पर शहीदों के धीरज, निष्ठा और उनसे जुड़े सम्मान की दृष्टि से कटु नहीं था।'
    reason: rhetorical_ambiguity
  - marker: b
    text: या “यातना-चक्र” अथवा “यातना-यंत्र।” यूनानी शब्द सामान्यतः कैटापल्ट या ऐसे ही प्रक्षेपक-यंत्र को दर्शाता है, पर यहाँ संभवतः यातना देने के लिए प्रयुक्त किसी खींचने वाले यंत्र का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πικρᾶς / πικρὸς
  choice: कटु
  rationale: एक ही मूल की पुनरावृत्ति दिन और तानाशाह दोनों के लिए रखी गई है, ताकि यूनानी का शब्दालंकार और भावात्मक तीखापन बना रहे। हिंदी में यह प्रयोग कुछ अलंकारिक है, पर अर्थगम्य और गरिमापूर्ण है।
- source_word: ἡμέρας
  choice: दिन
  rationale: यह ठोस काल-सूचक संज्ञा का सीधा और स्वाभाविक अनुवाद है।
- source_word: Ἑλλήνων τύραννος
  choice: यूनानियों का तानाशाह
  rationale: सम्बन्धकारक Ἑλλήνων को सुरक्षित रखता है; इसे केवल जातिवाचक विशेषण बनाकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: πῦρ φλέξας
  choice: आग भड़काकर
  rationale: कृदन्त की पूर्वकालिक क्रिया और दृश्य की तीव्रता दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: λέβησι ὠμοῖς
  choice: क्रूर कड़ाहों में
  rationale: λέβης के लिए 'कड़ाह' और प्रसंगगत ὠμός के लिए 'क्रूर' चुना गया है; यातना के उपकरणों को अलंकारिक रूप से क्रूर कहा गया है।
- source_word: ζέουσιν θυμοῖς
  choice: उबलते क्रोध में
  rationale: ताप और रोष की संयुक्त छवि रखता है तथा गर्म कड़ाहों के साथ निहित शब्दचित्र को बनाए रखता है।
- source_word: ἀγαγὼν
  choice: ले जाकर
  rationale: अओरिस्ट कृदन्त को मुख्य वाक्य से जुड़ी पूर्वकालिक क्रिया के रूप में रखा गया है। उपलब्ध यूनानी अंश अधूरा होने के कारण हिंदी भी जानबूझकर अगले वाक्यांश की प्रतीक्षा करती है।
- source_word: καταπέλτην
  choice: गुलेल-यंत्र
  rationale: शब्द का सामान्य अर्थ युद्ध में प्रयुक्त प्रक्षेपक या कैटापल्ट है। यातना-प्रसंग में यह खींचने वाले किसी यंत्र का नाम हो सकता है; उस संभावना को पादटिप्पणी में रखा गया है।
- source_word: βασάνους αὐτοῦ
  choice: अपनी यातनाओं
  rationale: बहुवचन βάσανοι और αὐτοῦ के सम्बन्ध को स्वाभाविक हिंदी में व्यक्त करता है तथा तानाशाह की यातना-व्यवस्था की ओर संकेत करता है।
- source_word: τοὺς ἑπτὰ παῖδας
  choice: सातों बालकों
  rationale: παῖδες की आयु और संतान—दोनों से जुड़ी व्यापकता को यथासंभव बनाए रखता है; 'पुत्रों' कहकर उस अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया जिसे यहाँ υἱοί से व्यक्त नहीं किया गया।
theological_decisions:
- issue: καὶ οὐ πικρᾶς का विरोधाभास
  choice: और फिर भी कटु नहीं
  alternative: और कटु नहीं
  rationale: यह पीड़ा की कटुता और शहीदों की निष्ठा से जुड़े गौरवपूर्ण परिणाम के बीच यूनानी पाठ का तनाव बनाए रखता है; मुख्य पाठ में उसका कारण जोड़कर विरोधाभास को समाप्त नहीं किया गया।
- issue: शहादत के प्रसंग में καταπέλτης का अर्थ
  choice: गुलेल-यंत्र
  alternative: यातना-चक्र या यातना-यंत्र
  rationale: मुख्य पाठ में सामान्य कोशगत अर्थ के निकट रहा गया है, जबकि प्रसंगगत यातना-उपकरण की संभावना पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, कथात्मक और किंचित अलंकारिक रूप अपनाया गया है। 'कटु' की जानबूझकर पुनरावृत्ति मूल यूनानी शब्दालंकार को रखती है। स्रोत पद इस स्थान पर वाक्य के बीच समाप्त होता है, इसलिए अनुवाद भी अल्पविराम पर समाप्त होकर उसकी अपूर्ण वाक्य-संरचना सुरक्षित रखता है।
