base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/004.yaml
  text: And because of them the nation was at peace[a], and, having renewed good order in the homeland[b], it has besieged the enemies completely.
translation:
  language: hi
  text: और उन्हीं के कारण राष्ट्र शांति से रहा[a], और अपनी मातृभूमि में सुव्यवस्था को फिर से स्थापित करके उसने शत्रुओं की पूरी तरह घेराबंदी कर रखी है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हीं के द्वारा’; यूनानी पद कारण अथवा साधन—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया ‘घेराबंदी करना’ से बनी एक प्रबल रूप वाली क्रिया है। इसका अधिक शाब्दिक अनुवाद ‘शत्रुओं को पूरी तरह घेर लिया है’ भी हो सकता है; प्रसंग में इससे उनकी पराजय या निष्कासन का संकेत हो सकता है, पर क्रिया स्वयं उसे स्पष्ट रूप से नहीं कहती।
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ αὐτοὺς
  choice: उन्हीं के कारण
  rationale: διά के साथ कर्मकारक यहाँ सबसे स्वाभाविक रूप से कारण व्यक्त करता है; ‘उन्हीं’ पूर्वोक्त शहीदों पर बल बनाए रखता है, जबकि साधनवाचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εἰρήνευσεν
  choice: शांति रही
  rationale: क्रिया का अर्थ शांति में रहना या शांतिपूर्ण अवस्था में होना है; यह अनुवाद किसी औपचारिक शांति-संधि का अनावश्यक संकेत नहीं देता।
- source_word: τὸ ἔθνος
  choice: राष्ट्र
  rationale: यहाँ यह यहूदी जनसमुदाय को सामूहिक और राष्ट्रीय अर्थ में दर्शाता है।
- source_word: εὐνομίαν
  choice: सुव्यवस्था
  rationale: यह शब्द अच्छे नियम-कानून के अधीन व्यवस्थित दशा को व्यक्त करता है; ‘सुव्यवस्था’ वैधानिकता और सुशासन, दोनों के व्यापक भाव को समेटती है।
- source_word: τὴν ἐπὶ τῆς πατρίδος
  choice: अपनी मातृभूमि में
  rationale: वाक्यांश पूर्वजों की भूमि में पुनः स्थापित व्यवस्था का स्थान बताता है; ‘मातृभूमि’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀνανεωσάμενος
  choice: फिर से स्थापित करके
  rationale: कृदंत उस कार्य को मुख्य सैन्य परिणाम से पूर्व या उसके साथ घटित दिखाता है; ‘फिर से स्थापित’ पुनर्स्थापन का भाव स्पष्ट करता है।
- source_word: ἐκπεπολιόρκηκε
  choice: घेराबंदी के द्वारा पूरी तरह निकाल बाहर किया है
  rationale: पूर्णकालिक और गहन क्रिया घेराबंदी तथा उसके परिणामी निष्कासन को व्यक्त कर सकती है। मुख्य पाठ परिणामसूचक अर्थ रखता है, जबकि अधिक शाब्दिक ‘पूरी तरह घेर लिया’ पादटिप्पणी में दिया गया है।
- source_word: τοὺς πολεμίους
  choice: शत्रुओं
  rationale: सैन्य प्रसंग में यह सीधा, प्रचलित और अर्थ-पारदर्शी अनुवाद है।
theological_decisions:
- issue: शहीदों और राष्ट्र की शांति के बीच कारणात्मक संबंध
  choice: पाठ स्पष्ट रूप से कहता है कि उन्हीं के कारण राष्ट्र में शांति रही।
  alternative: ‘उन्हीं के द्वारा’ साधनात्मक संबंध को अधिक प्रमुखता दे सकता है।
  rationale: यूनानी पाठ उनकी कारणात्मक अथवा साधनात्मक भूमिका स्वीकार करता है, पर इस एक पद में प्रायश्चित्त का कोई विस्तृत सिद्धांत निर्धारित नहीं करता; इसलिए कथन की शक्ति और उसकी सीमा दोनों सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। वाक्य में ‘राष्ट्र’ को दोनों मुख्य क्रियाओं का कर्ता बनाए रखा गया है। कारणात्मक और साधनात्मक अर्थों की वास्तविक अस्पष्टता तथा अंतिम सैन्य क्रिया की परिणामसूचक/शाब्दिक संभावनाएँ पादटिप्पणियों में सुरक्षित हैं।
