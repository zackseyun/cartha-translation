  yaml_path: translation/deuterocanon/4_maccabees/018/005.yaml
  text: And the tyrant Antiochus has been punished also on earth[a], and is punished with eternal things; for he was utterly unable to compel the people of Jerusalem to adopt foreign ways and to abandon the customs of their fathers' nation,
translation:
  language: hi
  text: और अत्याचारी अन्तियोकस पृथ्वी पर भी दण्डित हो चुका है और अनन्त दण्ड भोग रहा है[a]; क्योंकि वह यरूशलेम के लोगों को विदेशी रीति अपनाने और अपने पूर्वजों के राष्ट्र की जीवन-पद्धति से दूर होने के लिए बाध्य करने में किसी भी तरह सफल नहीं हुआ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ “अनन्त” शब्द के साथ “दण्ड” संज्ञा स्पष्ट रूप से नहीं लिखी गई है। इसका अर्थ “अनन्त काल तक दण्डित हो रहा है” या “अनन्त दण्डों से दण्डित हो रहा है” भी हो सकता है।
    reason: मूल यूनानी में ἀϊδίων के साथ लुप्त संज्ञा से उत्पन्न अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: τύραννος
  choice: अत्याचारी
  rationale: यह शब्द केवल तटस्थ ‘शासक’ नहीं, बल्कि दमनकारी शासन का नैतिक मूल्यांकन व्यक्त करता है।
- source_word: τετιμώρηται
  choice: दण्ड पा चुका है
  rationale: पूर्णकाल पृथ्वी पर दिए जा चुके दण्ड और उसके वर्तमान परिणाम को व्यक्त करता है।
- source_word: ἀϊδίων κολάζεται
  choice: अनन्त दण्ड भोग रहा है[a]
  rationale: वर्तमानकालीन दण्ड और ἀϊδίων की अनन्तता को सहज हिन्दी में व्यक्त किया गया है; मूल यूनानी में संज्ञा लुप्त होने की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: οὐδὲν οὐδαμῶς ἴσχυσεν
  choice: किसी भी तरह सफल नहीं हुआ
  rationale: दोहरा निषेध अन्तियोकुस की पूर्ण विफलता पर बल देता है।
- source_word: τοὺς Ἱεροσολυμείτας
  choice: यरूशलेम के लोगों
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ढंग से नगर के निवासियों को सूचित करता है।
- source_word: ἀλλοφυλῆσαι
  choice: विदेशी रीति अपनाने
  rationale: सन्दर्भ में यह किसी दूसरे देश में बसने के बजाय विदेशी जातियों की सांस्कृतिक-धार्मिक रीति अपनाने को सूचित करता है।
- source_word: τῶν πατρίων ἐθνῶν ἐκδιαιτηθῆναι
  choice: अपने पुरखों के राष्ट्र की जीवन-पद्धति छोड़ने
  rationale: यह कठिन और संक्षिप्त यूनानी वाक्यांश में पुरखों, जातीय पहचान और जीवन-व्यवहार—तीनों के सम्बन्ध को यथासम्भव बनाए रखता है।
theological_decisions:
- issue: ἀϊδίων κολάζεται में अन्तियोकुस के पृथ्वी के बाद के दण्ड का स्वरूप
  choice: अनन्त दण्ड भोग रहा है
  alternative: अनन्त काल तक दण्ड भोग रहा है; अथवा अनन्त दण्डों से दण्डित हो रहा है
  rationale: पद पृथ्वी पर मिले दण्ड के अतिरिक्त जारी रहने वाले अनन्त दण्ड की पुष्टि करता है, पर यूनानी में ἀϊδίων के साथ अपेक्षित संज्ञा स्पष्ट नहीं है; इसलिए दण्ड की रीति या संरचना को और अधिक परिभाषित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद के अन्त की अल्पविराम-रचना बनाए रखी गई है, क्योंकि यूनानी वाक्य आगे जारी रहता है।
