translation:
  language: hi
  text: जिनके कारण ईश्वरीय न्याय ने उस अभिशप्त व्यक्ति[a] का पीछा किया है और आगे भी उसका पीछा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस अपवित्र व्यक्ति’ अथवा ‘उस घृणित व्यक्ति’; यूनानी शब्द दुर्लभ है और उसमें प्रबल नैतिक तथा धार्मिक निन्दा का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: जिनके कारण
  rationale: ὑπέρ के कारणसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और पहले बताए गए कामों को सम्बोधित करने वाले बहुवचन सम्बन्धवाचक रूप को बनाए रखता है।
- source_word: ἡ θεία δίκη
  choice: ईश्वरीय न्याय
  rationale: δίκη में न्याय और दण्डात्मक प्रतिफल—दोनों का भाव हो सकता है। यह चयन उसके न्यायिक तथा प्रतिशोधात्मक बल को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: μετῆλθεν
  choice: पीछा किया है
  rationale: क्रिया में दण्ड देने के उद्देश्य से किसी के पीछे पड़ने का भाव है। यह पूर्ण हो चुकी कार्रवाई को अगले भविष्यकालीन कथन से जोड़ती है।
- source_word: καὶ μετελεύσεται
  choice: और आगे भी करेगा
  rationale: मूल यूनानी में उसी क्रिया की पुनरावृत्ति है। हिन्दी में पहले आए ‘पीछा’ को न दोहराते हुए ‘करेगा’ उसी अर्थ को स्वाभाविक ढंग से जारी रखता है; ‘आगे भी’ भावी दण्डात्मक कार्रवाई को स्पष्ट करता है।
- source_word: τὸν ἀλιόστορα
  choice: उस अभिशप्त व्यक्ति
  rationale: यह दुर्लभ और अत्यन्त निन्दात्मक पद सम्भवतः शाप या धार्मिक अपवित्रता के अधीन व्यक्ति को सूचित करता है। ‘अभिशप्त व्यक्ति’ इसका प्रबल नैतिक-धार्मिक भाव पठनीय हिन्दी में व्यक्त करता है; अनिश्चित सूक्ष्मार्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय प्रतिफल के प्रसंग में δίκη का अनुवाद
  choice: ईश्वरीय न्याय
  alternative: ईश्वरीय दण्ड; ईश्वरीय प्रतिशोध
  rationale: पद परमेश्वर की दण्डात्मक कार्रवाई प्रस्तुत करता है, पर उसे केवल प्रतिशोध या केवल दण्ड तक सीमित नहीं करता। ‘ईश्वरीय न्याय’ न्याय के सिद्धान्त और उसके क्रियान्वित दण्ड—दोनों के बीच मूल पाठ का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वाक्य पिछले प्रसंग पर निर्भर खण्ड है, इसलिए ‘जिनके कारण’ से आरम्भ होने वाली उसकी संरचना सुरक्षित रखी गई है।
