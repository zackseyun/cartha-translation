base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/023.yaml
  text: But the children of Abraham[a], together with their victory-bearing mother, are gathered to the place of their fathers[b], having received pure and immortal souls from God.
translation:
  language: hi
  text: परन्तु अब्राहम के पुत्र[a] अपनी प्रतियोगिता का पुरस्कार पानेवाली माता[b] के साथ अपने पूर्वजों के स्थान में संगति में सम्मिलित किए गए हैं; उन्होंने परमेश्वर से शुद्ध और अमर आत्माएँ पाई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पद का अर्थ ‘अब्राहम की संतान’ भी हो सकता है; यहाँ प्रसंग में ये पुरुष भाई हैं, इसलिए ‘पुत्र’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द में प्रतियोगिता में प्राप्त पुरस्कार की छवि है; इसका अनुवाद ‘पुरस्कार-विजेता माता’ या ‘विजयी माता’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀβραμιαῖοι ... παῖδες
  choice: अब्राहम के पुत्र
  rationale: Ἀβραμιαῖοι अब्राहम से संबंध या वंश को दर्शाता है और παῖδες यहाँ प्रसंग के पुरुष शहीद भाइयों को सूचित करता है; इसलिए ‘पुत्र’ लिंग और तात्कालिक संदर्भ दोनों को सुरक्षित रखता है।
- source_word: σὺν τῇ ἀθλοφόρῳ μητρὶ
  choice: अपनी विजय-मुकुट धारण करनेवाली माता के साथ
  rationale: ἀθλοφόρος प्रतियोगिता में पुरस्कार पाने या उसे धारण करने की यूनानी क्रीड़ा-छवि रखता है। ‘विजय-मुकुट धारण करनेवाली’ शहादत के संघर्ष और पुरस्कार, दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς πατέρων χῶρον
  choice: अपने पूर्वजों के स्थान में
  rationale: χῶρος स्थान या प्रदेश है और πατέρων यहाँ पितरों/पूर्वजों का संकेत देता है। यह अनुवाद स्वर्ग, परलोक या किसी अधिक विकसित पारिभाषिक धारणा को जोड़े बिना पैतृक गंतव्य को बनाए रखता है।
- source_word: συναγελιᾶζονται
  choice: संगति करते हैं
  rationale: यह विरल क्रिया साथ रहने, किसी समुदाय में सम्मिलित होने या संगति करने का भाव देती है। ‘संगति करते हैं’ केवल निष्क्रिय रूप से इकट्ठा किए जाने की अपेक्षा मूल के सामुदायिक अर्थ को अधिक स्पष्ट रखता है।
- source_word: ψυχὰς
  choice: आत्माएँ
  rationale: ἁγνὰς καὶ ἀθανάτους तथा मृत्यु के बाद पुरस्कार के प्रसंग में ψυχή का ‘आत्मा’ अर्थ सर्वाधिक उपयुक्त है।
- source_word: ἁγνὰς καὶ ἀθανάτους
  choice: शुद्ध और अमर
  rationale: ἁγνός का मूल भाव शुद्ध/पवित्र और ἀθάνατος का अमर है; यह युग्म सरल और सटीक रूप में सुरक्षित है।
- source_word: ἀπειληφότες
  choice: पाई हैं
  rationale: ἀπολαμβάνω का कृदन्त यहाँ परमेश्वर से प्राप्त करने को दर्शाता है; ‘पाई हैं’ स्वाभाविक हिन्दी है और पूर्ववर्ती कर्ता के साथ ठीक बैठता है।
- source_word: παρὰ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: सम्बन्धकारक के साथ παρά स्रोत बताता है; ‘परमेश्वर से’ बिना अतिरिक्त बिंब जोड़े इसे सीधे व्यक्त करता है।
theological_decisions:
- issue: εἰς πατέρων χῶρον में मृत्यु के बाद का चित्र
  choice: अपने पूर्वजों के स्थान में
  alternative: अपने पूर्वजों के लोक में / अपने पूर्वजों की मंडली में
  rationale: यूनानी पाठ पैतृक गंतव्य और संगति का संकेत देता है, पर उसे स्वर्ग, फिरदौस या ‘अब्राहम की गोद’ नहीं कहता। ‘स्थान’ इस अनिश्चितता और संयम को बनाए रखता है।
- issue: ψυχὰς ἁγνὰς καὶ ἀθανάτους का मानव-स्वरूप संबंधी अर्थ
  choice: शुद्ध और अमर आत्माएँ
  alternative: शुद्ध और अमर जीवन
  rationale: शहादत और मरणोत्तर प्रतिफल के प्रसंग में ‘आत्माएँ’ मूल कथन को अधिक सीधे सुरक्षित रखता है; अनुवाद यह अतिरिक्त स्पष्टीकरण नहीं देता कि आत्माएँ कब या किस प्रकार अमर हुईं।
- issue: ἀθλοφόρος की संघर्ष और पुरस्कार संबंधी छवि
  choice: विजय-मुकुट धारण करनेवाली माता
  alternative: पुरस्कार-विजेता माता / विजयी माता
  rationale: मूल पद क्रीड़ा-प्रतियोगिता और प्राप्त पुरस्कार दोनों की छवि रखता है। ‘विजयी’ अकेला पुरस्कार की छवि को सपाट कर देता, जबकि ‘विजय-मुकुट’ उसे दृश्य और बोधगम्य बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय गद्य। ‘माता’, ‘पूर्वज’, ‘परमेश्वर’ और ‘आत्माएँ’ सामान्य पाठकों के लिए परिचित हैं। विरल यूनानी क्रिया συναγελιᾶζονται के सामुदायिक भाव के कारण ‘संगति करते हैं’ चुना गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
