base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/007.yaml
  text: For I remained a pure virgin[a], and I did not go beyond my father's house; rather[b], I guarded the rib that had been built.
translation:
  language: hi
  text: क्योंकि मैं शुद्ध कुँवारी रही, और मैंने अपने पिता के घर की सीमा नहीं लाँघी[a]; और मैं उस पसली की रक्षा करती रही जो बनाई गई थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपने पिता का घर छोड़कर बाहर नहीं गई।” यूनानी अभिव्यक्ति पिता के घर की वास्तविक सीमा के भीतर रहने और उसकी मर्यादा का उल्लंघन न करने—दोनों का संकेत दे सकती है।
    reason: alternative_reading
  - marker: b
    text: या, “उस पार्श्व की रक्षा करती रही जिसे बनाया गया था।” यह वाक्य संभवतः उत्पत्ति में स्त्री को आदम की पसली या पार्श्व से बनाए जाने की ओर संकेत करता है और यहाँ सुरक्षित रखी गई शुचिता का संकोचपूर्ण रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθην
  choice: रही
  rationale: क्रिया का मूल अर्थ ‘हुई/बनी’ है, पर यहाँ वक्ता अपने कौमार्य और शुचिता की बनी रही अवस्था का वर्णन करती है; इसलिए हिन्दी में ‘रही’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: παρθένος ἁγνή
  choice: शुद्ध कुँवारी
  rationale: παρθένος का अर्थ ‘कुँवारी’ और ἁγνή का यहाँ नैतिक तथा यौन शुचिता से संबंध है। ‘शुद्ध कुँवारी’ दोनों तत्वों को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: οὐχ ὑπερέβην
  choice: सीमा नहीं लाँघी
  rationale: ὑπερβαίνω का अर्थ किसी सीमा के पार जाना या उसका उल्लंघन करना है। ‘सीमा नहीं लाँघी’ घर की भौतिक सीमा और उसकी नैतिक मर्यादा—दोनों संभावनाएँ खुली रखता है।
- source_word: πατρικὸν οἶκον
  choice: अपने पिता के घर
  rationale: यह पिता के घराने या गृहस्थ परिवार को सूचित करता है। प्रथम पुरुष प्रसंग के कारण हिन्दी में ‘अपने’ स्वाभाविक है।
- source_word: ἐφύλασσον
  choice: रक्षा करती रही
  rationale: अपूर्ण भूतकाल निरंतर क्रिया व्यक्त करता है। ‘रक्षा करती रही’ उस लगातार सावधानी और संरक्षण को बनाए रखता है जो रूपक में निहित है।
- source_word: τὴν ᾠκοδομημένην πλευράν
  choice: उस पसली ... जिसे बनाया गया था
  rationale: πλευρά के अर्थ ‘पसली’ और ‘बगल/पार्श्व’ दोनों हैं। οἰκοδομέω (‘बनाना’) के साथ यह उत्पत्ति में स्त्री को आदम की पसली से बनाए जाने की ओर संकेत करता है; ‘पसली’ उस संकेत को मुख्य पाठ में बनाए रखता है।
theological_decisions:
- issue: ‘बनाई गई पसली’ में उत्पत्ति-वृत्तांत का संकेत
  choice: रूपक को बिना खोले मुख्य पाठ में ‘उस पसली ... जिसे बनाया गया था’ रखा गया है।
  alternative: इसे स्पष्ट करके ‘मैंने अपनी पवित्रता की रक्षा की’ कहना, अथवा πλευρά को ‘पार्श्व’ कहना।
  rationale: यूनानी पाठ सीधा कथन नहीं, बल्कि असामान्य और संकेतपूर्ण भाषा प्रयोग करता है। रूपक को बनाए रखने से उत्पत्ति-वृत्तांत की साहित्यिक प्रतिध्वनि सुरक्षित रहती है और अनुवाद मूल से अधिक स्पष्ट यौन व्याख्या नहीं जोड़ता।
- issue: ‘पिता के घर की सीमा नहीं लाँघी’ का आशय
  choice: ऐसी अभिव्यक्ति चुनी गई है जिसमें स्थान-संबंधी और नैतिक—दोनों अर्थ संभव हैं।
  alternative: केवल ‘मैं अपने पिता का घर छोड़कर नहीं गई’ या केवल ‘मैंने अपने पिता के घर की मर्यादा का उल्लंघन नहीं किया।’
  rationale: यूनानी वाक्य पिता के घर की वास्तविक सीमा के भीतर रहने और उसके अनुशासन या मर्यादा का उल्लंघन न करने—दोनों का संकेत दे सकता है; अनुवाद इस तनाव को हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘शुद्ध कुँवारी’, ‘सीमा नहीं लाँघी’ और ‘रक्षा करती रही’ स्वाभाविक हिन्दी देते हैं, जबकि अंतिम असामान्य रूपक को मूल की साहित्यिक और धर्मवैचारिक अस्पष्टता सहित सुरक्षित रखा गया है।
