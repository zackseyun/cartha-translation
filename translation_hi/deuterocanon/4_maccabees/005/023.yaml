  yaml_path: translation/deuterocanon/4_maccabees/005/023.yaml
  text: For it teaches us self-control, so that we may master all pleasures and desires, and to practice courage, so that we may willingly endure every pain;
translation:
  language: hi
  text: क्योंकि वह हमें संयम सिखाती है, ताकि हम सभी सुखों और इच्छाओं पर काबू रख सकें, और साहस का अभ्यास करना सिखाती है, ताकि हम हर पीड़ा स्वेच्छा से सह सकें;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: संयम
  rationale: यहाँ यह नैतिक सद्गुण अपने ऊपर अनुशासित नियंत्रण को दर्शाता है; आगे सुखों और इच्छाओं पर काबू रखने की बात इसी अर्थ को स्पष्ट करती है।
- source_word: ἐκδιδάσκει
  choice: सिखाती है
  rationale: क्रिया गहन शिक्षा का भाव रख सकती है, पर आधुनिक हिन्दी में ‘सिखाती है’ स्पष्ट और स्वाभाविक है। स्त्रीलिंग रूप का संबंध पिछले प्रसंग की ‘व्यवस्था’ से है।
- source_word: κρατεῖν
  choice: काबू रखें
  rationale: मूल क्रिया किसी पर अधिकार या प्रभुत्व रखने का सक्रिय भाव देती है; ‘काबू रखें’ साधारण आधुनिक हिन्दी में यही अर्थ व्यक्त करता है।
- source_word: ἡδονῶν
  choice: सुखों
  rationale: मूल शब्द सामान्य रूप से सुख या आनंद को दर्शाता है; ‘इंद्रिय-सुख’ कहना अनावश्यक रूप से अर्थ को संकीर्ण कर देता।
- source_word: ἐπιθυμιῶν
  choice: इच्छाओं
  rationale: यह व्यापक इच्छाओं को सूचित करता है; ‘वासनाओं’ से अनुचित रूप से केवल नकारात्मक या यौन अर्थ प्रमुख हो सकता है।
- source_word: ἀνδρείαν
  choice: साहस
  rationale: हेलेनवादी नैतिक प्रयोग में यह धैर्यपूर्ण वीरता या साहस का सद्गुण है; ‘साहस’ स्वाभाविक है और लिंग-विशेष अर्थ नहीं जोड़ता।
- source_word: ἐξασκεῖν
  choice: अभ्यास कराती है
  rationale: क्रिया किसी सद्गुण को सक्रिय रूप से विकसित करने या साधने का भाव देती है।
- source_word: πόνον
  choice: पीड़ा
  rationale: शहादत और यातना के प्रसंग में शब्द दुःख या कष्ट सहने को दर्शाता है; ‘पीड़ा’ उसका सीधा और व्यापक अनुवाद है।
- source_word: ἑκουσίως
  choice: स्वेच्छा से
  rationale: यह अपनी इच्छा से दुःख स्वीकार करने पर बल देता है; ‘स्वेच्छा से’ इस नैतिक पहलू को स्पष्ट रखता है।
- source_word: ὑπομένειν
  choice: सहें
  rationale: मूल क्रिया किसी कठिनाई के अधीन टिके रहने और उसे सहने का अर्थ देती है; यहाँ ‘पीड़ा सहें’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: दार्शनिक-शहादत प्रसंग में यूनानी नैतिक सद्गुणों का अनुवाद
  choice: σωφροσύνη को ‘संयम’ और ἀνδρεία को ‘साहस’ कहना
  alternative: ‘आत्म-संयम’/‘समझदारी’ तथा ‘वीरता’/‘धैर्य’
  rationale: मानक आधुनिक नैतिक शब्द मूल सद्गुणों का अर्थ स्पष्ट रखते हैं और न तो पुरातन भाषा जोड़ते हैं, न पुरुष-केंद्रित अर्थ।
- issue: ὥστε के साथ infinitive की अर्थछाया
  choice: ‘ताकि हम ... रखें/सहें’
  alternative: ‘जिससे हम ... रखते/सहते हैं’
  rationale: यह रचना शिक्षा और अभ्यास के अपेक्षित परिणाम या उद्देश्य को व्यक्त कर सकती है। ‘ताकि’ इस संबंध को स्वाभाविक हिन्दी में रखता है, बिना उद्देश्य और परिणाम के बीच की सूक्ष्मता को सिद्धान्तगत रूप से कठोर बनाने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल नैतिक शब्दावली। यूनानी वाक्य की समानांतर रचना—संयम/साहस और सुख-इच्छाओं पर काबू/पीड़ा सहना—यथासंभव सुरक्षित रखी गई है।
