review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the two ethical virtues, mastery over pleasures and desires, voluntary endurance, and the scope of "all/every." However, "साहस का अभ्यास कराती है" changes the governing sense from instruction to causation: ἐκδιδάσκει governs the parallel instruction, while ἐξασκεῖν is an infinitive expressing practicing/cultivating courage.'
  naturalness: The Hindi is generally modern and clear. Recasting the second coordinated phrase as "साहस का अभ्यास करना सिखाती है" is both more idiomatic in this syntactic context and more faithful to the Greek structure.
  terminology: '"संयम," "साहस," "सुखों," "इच्छाओं," "पीड़ा," and "स्वेच्छा से" are appropriate modern-standard Hindi renderings. "काबू रख सकें" naturally conveys the active mastery intended by κρατεῖν.'
  issues:
  - severity: medium
    issue: '"साहस का अभ्यास कराती है" renders ἐξασκεῖν as a separate causative finite verb.'
    rationale: The Greek has one main verb, ἐκδιδάσκει ("teaches/instructs"), followed by coordinated infinitival content. The draft's causative "कराती है" can imply that the subject makes people practice courage, rather than teaching them to cultivate it.
  revised_text: क्योंकि वह हमें संयम सिखाती है, ताकि हम सभी सुखों और इच्छाओं पर काबू रख सकें, और साहस का अभ्यास करना सिखाती है, ताकि हम हर पीड़ा स्वेच्छा से सह सकें;
  revised_footnotes: []
  revision_rationale: The revision retains the draft's vocabulary and parallel purpose/result clauses, while making explicit in Hindi that the subject teaches both self-control and the practice of courage. This restores the Greek syntactic relationship without adding interpretation.
