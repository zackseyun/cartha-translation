  yaml_path: translation/deuterocanon/4_maccabees/005/016.yaml
  text: But we[a], Antiochus, being persuaded by a divine law, order our lives by it, and we consider no compulsion to be stronger than obedience to our law.
translation:
  language: hi
  text: हे अन्तियोकस, हम ईश्वरीय व्यवस्था से आश्वस्त होकर[a] उसी के अनुसार जीवन जीते हैं, और हम किसी भी दबाव को अपनी व्यवस्था के पालन से अधिक प्रबल नहीं मानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ईश्वरीय व्यवस्था से विश्वास दिलाए जाने के कारण हम उसी के अनुसार अपना जीवन चलाते हैं।”
    reason: πεπεισμένοι के कर्मवाच्य, पूर्णकालिक परिणामी भाव और πολιτευόμεθα के ‘अपना जीवन चलाना/आचरण करना’ अर्थ का निकटतर विकल्प।
lexical_decisions:
- source_word: θείῳ νόμῳ
  choice: ईश्वरीय व्यवस्था
  rationale: यह पद व्यवस्था के ईश्वरीय स्वरूप या उद्गम को व्यक्त करता है। ‘ईश्वरीय व्यवस्था’ स्वाभाविक हिन्दी है और यूनानी की गुणात्मक अभिव्यक्ति को किसी एक अर्थ तक सीमित नहीं करती।
- source_word: πεπεισμένοι
  choice: आश्वस्त होकर
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त ऐसी मनःस्थिति दर्शाता है जो समझाए या विश्वस्त किए जाने के फलस्वरूप स्थिर हो चुकी है। ‘आश्वस्त होकर’ इस परिणामी अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: πολιτευόμεθα
  choice: उसी के अनुसार जीवन जीते हैं
  rationale: क्रिया का अर्थ नागरिक समुदाय के सदस्य के रूप में आचरण करना या अपना जीवन चलाना हो सकता है। प्रसंग में व्यवस्था द्वारा निर्देशित जीवन-पद्धति प्रमुख है।
- source_word: οὐδεμίαν ἀνάγκην
  choice: किसी भी दबाव को ... नहीं
  rationale: यहाँ ἀνάγκη अमूर्त आवश्यकता के बजाय अन्तियोकुस द्वारा डाले जा रहे बाध्यकारी दबाव को सूचित करता है।
- source_word: βιαιοτέραν
  choice: अधिक प्रबल
  rationale: तुलनात्मक विशेषण दबाव की बलवत्ता बताता है। ‘अधिक प्रबल’ हिन्दी में स्वाभाविक रहते हुए तुलना को बनाए रखता है।
- source_word: τῆς πρὸς τὸν νόμον ἡμῶν εὐπειθείας
  choice: अपनी व्यवस्था के प्रति आज्ञाकारिता से
  rationale: εὐπείθεια तत्पर आज्ञापालन या अनुपालन दर्शाता है। ‘आज्ञाकारिता’ समुदाय की अपनी व्यवस्था के प्रति निष्ठापूर्ण अधीनता को स्पष्ट रूप से व्यक्त करती है।
theological_decisions:
- issue: मूसा की व्यवस्था का ईश्वरीय स्वरूप
  choice: ईश्वरीय व्यवस्था
  alternative: परमेश्वर से मिली व्यवस्था
  rationale: अनिर्दिष्ट θείῳ νόμῳ व्यवस्था के ईश्वरीय गुण या उद्गम, दोनों की ओर संकेत कर सकता है। ‘ईश्वरीय व्यवस्था’ इस अर्थ-विस्तार को बनाए रखती है और उद्गम को अनावश्यक रूप से अधिक स्पष्ट नहीं करती।
- issue: आज्ञाकारिता और बाहरी दबाव के बीच तुलना
  choice: किसी भी दबाव को ... आज्ञाकारिता से अधिक प्रबल नहीं मानते
  alternative: हमारी आज्ञाकारिता हर दबाव से अधिक प्रबल है
  rationale: चुना हुआ रूप यूनानी की नकारात्मक तुलनात्मक संरचना को बनाए रखता है और आज्ञाकारिता को केवल मानवीय इच्छाशक्ति या किसी विशेष धार्मिक सिद्धान्त के रूप में पुनर्परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। सम्बोधन के लिए ‘हे अन्तियोकुस’ रखा गया है। ‘व्यवस्था’ इस यहूदी प्रसंग में νόμος के धार्मिक-सामुदायिक अर्थ को ‘कानून’ की अपेक्षा अधिक उपयुक्त ढंग से व्यक्त करती है।
