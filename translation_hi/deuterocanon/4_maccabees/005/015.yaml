  text: 'And having taken the right to speak, he began to address the assembly as follows:'
translation:
  language: hi
  text: 'और बोलने की अनुमति पाकर, वह सभा को इस प्रकार संबोधित करने लगा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: पाकर
  rationale: यह aorist participle मुख्य क्रिया से पहले की परिस्थिति बताता है। यहाँ ‘पाकर’ स्वाभाविक है और यह अनावश्यक रूप से अधिकार छीन लेने का भाव नहीं देता।
- source_word: τοῦ λέγειν
  choice: बोलने की
  rationale: संज्ञा ἐξουσίαν के साथ यह articular infinitive अधिकार या अनुमति के क्षेत्र को व्यक्त करता है; हिन्दी में ‘बोलने की अनुमति’ स्वाभाविक है।
- source_word: ἐξουσίαν
  choice: अनुमति
  rationale: ἐξουσία अधिकार, स्वतंत्रता या अनुमति का अर्थ दे सकता है। इस सार्वजनिक भाषण के प्रसंग में ‘अनुमति’ सहज है और किसी आधिकारिक पदाधिकार का अतिरिक्त भाव नहीं जोड़ता।
- source_word: ἤρξατο
  choice: लगा
  rationale: Infinitive के साथ ἄρχομαι का आरंभसूचक अर्थ है; ‘संबोधित करने लगा’ आधुनिक हिन्दी में स्वाभाविक ढंग से ‘आरंभ किया’ का भाव देता है।
- source_word: δημηγορεῖν
  choice: सभा को संबोधित करने
  rationale: यह क्रिया एकत्र लोगों के सामने सार्वजनिक भाषण देने को सूचित करती है। ‘सभा को संबोधित करना’ उसके सार्वजनिक और औपचारिक भाव को बनाए रखता है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह आगे आने वाले भाषण का परिचय देता है; ‘इस प्रकार’ हिन्दी में सीधी उक्ति से पहले उपयुक्त और गरिमापूर्ण है।
