lexical_decisions:
- source_word: ἀλλʼ
  choice: लेकिन
  rationale: यह पिछले कथन के विपरीत एक प्रबल मोड़ दर्शाता है; आधुनिक हिन्दी में ‘लेकिन’ स्वाभाविक और पर्याप्त रूप से बलवान है।
- source_word: οὐ
  choice: नहीं
  rationale: यूनानी पाठ की स्पष्ट साधारण निषेधवाचकता को बिना अतिरिक्त तीव्रता जोड़े सुरक्षित रखता है।
- source_word: γελάσεις
  choice: हँसोगे
  rationale: यह γελάω का भविष्यकालीन रूप है, जिसका मूल अर्थ ‘हँसना’ है; उपहास का भाव प्रसंग और ‘मुझ पर’ से प्रकट होता है।
- source_word: κατʼ ἐμοῦ
  choice: मुझ पर
  rationale: हँसी के साथ κατά और संबंधकारक उस व्यक्ति की ओर निर्देशित तिरस्कारपूर्ण क्रिया दर्शाते हैं; हिन्दी में ‘मुझ पर हँसना’ स्वाभाविक मुहावरा है।
- source_word: τοῦτον τὸν γέλωτα
  choice: इस तरह
  rationale: शाब्दिक ‘यह हँसी हँसना’ हिन्दी में अत्यंत अस्वाभाविक है। ‘इस तरह’ संकेतवाचक बल को बनाए रखते हुए उसी उपहासपूर्ण हँसी की ओर संकेत करता है।
