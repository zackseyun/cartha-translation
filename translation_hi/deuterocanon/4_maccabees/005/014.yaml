  text: When the tyrant was urging him in this way toward the lawless eating of flesh, Eleazar asked to speak.
translation:
  language: hi
  text: जब अत्याचारी इस प्रकार उसे व्यवस्था-विरुद्ध मांस खाने के लिए उकसा रहा था, तब एलीआज़र ने बोलने की अनुमति माँगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύραννος
  choice: अत्याचारी
  rationale: यहाँ शब्द उस निरंकुश और उत्पीड़क शासक को दर्शाता है; ‘अत्याचारी’ आधुनिक हिन्दी में इस नकारात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔκθεσμον
  choice: व्यवस्था-विरुद्ध
  rationale: शब्द का अर्थ स्थापित विधि या व्यवस्था के विरुद्ध है। प्रसंग में यह परमेश्वर की व्यवस्था द्वारा निषिद्ध भोजन को सूचित करता है, पर अनुवाद उस संकेत को विस्तार देकर स्पष्ट सिद्धांत में नहीं बदलता।
- source_word: σαρκοφαγίαν
  choice: मांस खाने
  rationale: शाब्दिक भाव ‘मांस-भक्षण’ है; ‘मांस खाने’ साधारण आधुनिक हिन्दी में अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἐποτρύνοντος
  choice: उकसा रहा था
  rationale: क्रिया जोर देकर प्रेरित या दबाव डालने का भाव रखती है; ‘उकसाना’ उस सक्रिय आग्रह को व्यक्त करता है।
- source_word: λόγον ᾔτησεν
  choice: बोलने की अनुमति माँगी
  rationale: मुहावरे का आशय बोलने का अवसर माँगना है; केवल ‘वचन माँगा’ हिन्दी में अस्पष्ट और अस्वाभाविक होता।
theological_decisions:
- issue: ἔκθεσμος में निहित व्यवस्था का स्वरूप
  choice: व्यवस्था-विरुद्ध
  alternative: अवैध / अधर्मपूर्ण
  rationale: यह चयन विधि/व्यवस्था से प्रत्यक्ष संबंध बनाए रखता है और यह अनावश्यक रूप से तय नहीं करता कि बात केवल राजकीय कानून की है या सामान्य नैतिक अधर्म की; प्रसंग पाठक को मूसा की व्यवस्था का संकेत देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी संबंधवाचक संरचना को स्वाभाविक हिन्दी काल-वाक्य में बदला गया है।
