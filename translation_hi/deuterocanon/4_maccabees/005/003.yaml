  text: परन्तु यदि कुछ लोग अशुद्ध करनेवाला भोजन खाना न चाहें,[a] तो उन्हें पहिए पर यातना देकर मार डाला जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपवित्र भोजन खाना” अथवा “अशुद्ध मांस खाना।” यूनानी क्रिया में ही धार्मिक रीति से अशुद्ध करनेवाली वस्तु खाने का भाव है; इस उपवाक्य में भोजन का अलग कर्म नहीं दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “पहिए पर अंग तुड़वाकर।” यूनानी कृदन्त पहिए से दी जानेवाली यातना को सूचित करता है; यातना की ठीक विधि पूरी तरह स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ τινες
  choice: परन्तु यदि कुछ लोग
  rationale: यह पद एक अतिरिक्त सशर्त स्थिति प्रस्तुत करता है। बहुवचन अनिश्चित सर्वनाम τινες के लिए ‘कुछ लोग’ स्वाभाविक और अर्थ-सटीक है।
- source_word: μὴ θέλοιεν
  choice: न चाहें
  rationale: θέλω इच्छा या चाह को व्यक्त करता है; ‘न चाहें’ केवल बाहरी इनकार के बजाय मूल की इच्छात्मक सूक्ष्मता बनाए रखता है।
- source_word: μιεροφαγῆσαι
  choice: अशुद्ध करनेवाला भोजन खाना
  rationale: यह संयुक्त क्रिया ऐसे पदार्थ को खाने का भाव देती है जो धार्मिक रीति से मनुष्य को अशुद्ध करता है। मूल में कर्म अलग से नहीं आया है, इसलिए हिन्दी में अर्थ स्पष्ट करने हेतु ‘भोजन’ जोड़ा गया है।
- source_word: τούτους
  choice: उन्हें
  rationale: यह सर्वनाम पहले बताए गए ‘कुछ लोगों’ की ओर लौटता है; ‘उन्हें’ सहज हिन्दी है।
- source_word: τροχισθέντας
  choice: पहिए पर यातना देकर
  rationale: कृदन्त पहिए से दी जानेवाली यातना या दंड को सूचित करता है। ‘पहिए पर यातना देकर’ विधि को व्यक्त करता है, पर ‘अंग तोड़ना’ जैसी ऐसी विशिष्टता नहीं जोड़ता जो यूनानी शब्द में अनिवार्य नहीं है।
- source_word: ἀναιρεθῆναι
  choice: मार डाला जाए
  rationale: यहाँ क्रिया का अर्थ प्राण लेना है। निष्क्रिय ‘मार डाला जाए’ आदेशात्मक-न्यायिक संदर्भ और यूनानी निष्क्रिय रूप दोनों को स्वाभाविक हिन्दी में रखता है।
