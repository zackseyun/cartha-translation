    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ἂν
  choice: भी नहीं पाएगा
  rationale: यह संयोजन प्रसंग में प्रबल निषेध या असंभवता व्यक्त करता है। हिंदी में ‘भी नहीं पाएगा’ उसकी जोरदार चुनौती को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκκόψεις
  choice: निकालकर
  rationale: क्रिया का मूल अर्थ ‘काटकर निकालना’ है। आँखों के संदर्भ में ‘आँखें निकालना’ आधुनिक हिंदी का स्वाभाविक और पर्याप्त रूप से सजीव प्रयोग है।
- source_word: τὰ ὄμματα
  choice: मेरी आँखें
  rationale: बहुवचन संज्ञा का सामान्य अर्थ ‘आँखें’ है; यहाँ किसी लाक्षणिक अर्थ का संकेत नहीं है।
- source_word: τὰ σπλάγχνα
  choice: मेरे भीतरी अंगों
  rationale: यह शब्द शरीर के अंदरूनी अंगों या अंतड़ियों को दर्शाता है। ‘भीतरी अंग’ शारीरिक अर्थ को स्पष्ट, गरिमापूर्ण और आधुनिक हिंदी में बनाए रखता है।
- source_word: τήξεις
  choice: गला
  rationale: क्रिया का अर्थ ‘गलाना’ या ‘पिघला देना’ है। ‘गला देना’ हिंसक शारीरिक बिंब को अनावश्यक व्याख्या के बिना बनाए रखता है।
