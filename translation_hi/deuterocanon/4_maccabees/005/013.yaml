base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/013.yaml
  text: 'For consider this also: even if there is some overseeing power of this religion[b][a], it would pardon you for the lawlessness done under compulsion in all these things.'
translation:
  language: hi
  text: 'क्योंकि यह भी विचार करो: यदि इस धर्म की देखरेख करने वाली कोई शक्ति है भी,[a] तो वह विवश होकर किए गए विधि-उल्लंघन के लिए तुम्हें इन सभी बातों में क्षमा कर देगी।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस धर्म पर निगाह रखने वाली कोई शक्ति।” यूनानी पाठ इस शक्ति की पहचान स्पष्ट नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: या, “वह तुम्हें हर बात में, विवशता में किए गए अपराध के लिए क्षमा कर देगी।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνθυμήθητι
  choice: सोचो
  rationale: यह आज्ञार्थक क्रिया मन में विचार करने या ध्यान देने का आग्रह करती है। ‘सोचो’ सहज आधुनिक हिन्दी में उसके आग्रहपूर्ण बल को बनाए रखता है।
- source_word: θρησκείας
  choice: धर्म
  rationale: वक्ता यहूदी धार्मिक व्यवस्था और आचरण का कुछ बाहरी ढंग से उल्लेख कर रहा है। ‘धर्म’ इस व्यापक अर्थ को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: ἐποπτικὴ δύναμις
  choice: देखरेख करने वाली कोई शक्ति
  rationale: यूनानी पद किसी ऐसी शक्ति को सूचित करता है जो देखती या निगरानी रखती है। यह अनुवाद उसकी पहचान को परमेश्वर, ईश्वरीय विधान या किसी रक्षक सत्ता के रूप में निश्चित नहीं करता।
- source_word: συγγνωμονήσειέν
  choice: क्षमा कर देगी
  rationale: शर्त वाले वाक्य में संभावनार्थक optative उस काल्पनिक परिणाम को व्यक्त करता है जो हिन्दी में ‘तो ... कर देगी’ से स्वाभाविक रूप से सामने आता है। ‘क्षमा’ अपराध के नैतिक-विधिक भार को बनाए रखता है।
- source_word: παρανομίᾳ
  choice: विधि-उल्लंघन
  rationale: यह शब्द विधि के विरुद्ध किए गए कार्य को दर्शाता है। ‘विधि-उल्लंघन’ यहाँ यह स्पष्ट करता है कि दबाव में किया जाने वाला कार्य यहूदी व्यवस्था के विरुद्ध होगा, बिना उसे हल्का किए।
- source_word: διʼ ἀνάγκην
  choice: दबाव के कारण
  rationale: संदर्भ में ἀνάγκη स्वेच्छा के बजाय बाध्यता या विवशता को सूचित करता है। ‘दबाव के कारण’ आधुनिक हिन्दी में इस आशय को साफ और सहज रखता है।
- source_word: ἐπὶ πᾶσιν
  choice: इन सभी बातों में
  rationale: यह पद संदर्भ में माँगे जा रहे सभी विधि-विरोधी कामों की ओर व्यापक संकेत करता है। ‘इन सभी बातों में’ उस संदर्भगत व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ‘देखरेख करने वाली शक्ति’ की पहचान
  choice: धर्म पर दृष्टि रखने वाली अनिर्दिष्ट शक्ति
  alternative: सीधे परमेश्वर; ईश्वरीय विधान; धर्म की कोई रक्षक सत्ता
  rationale: यूनानी पाठ परमेश्वर का नाम नहीं लेता और कथन को ‘यदि ... कोई शक्ति है भी’ के रूप में प्रस्तुत करता है। इसलिए अनुवाद वक्ता के संशयपूर्ण और जानबूझकर अनिर्दिष्ट कथन को बनाए रखता है।
- issue: दबाव में किए गए उल्लंघन की क्षम्यता
  choice: वक्ता के काल्पनिक तर्क के रूप में क्षमा का दावा
  alternative: दबाव अपने-आप उल्लंघन को निर्दोष बना देता है
  rationale: पाठ उत्पीड़क वक्ता का तर्क प्रस्तुत करता है; वह इस सिद्धांत की सार्वभौमिक सत्यता घोषित नहीं करता। अनुवाद इस तनाव को कथन के भीतर ही रहने देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वक्ता के तर्कपूर्ण स्वर के अनुरूप रखी गई है। ‘है भी’ यूनानी εἰ καί की concessive छाया और वक्ता के संशय को व्यक्त करता है; ‘विधि-उल्लंघन’ धार्मिक व्यवस्था के विरुद्ध आचरण का विधिक-नैतिक अर्थ सुरक्षित रखता है।
