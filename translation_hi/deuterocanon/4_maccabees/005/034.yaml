  yaml_path: translation/deuterocanon/4_maccabees/005/034.yaml
  text: I will not deny you[a], O law-trained discipline, nor will I spare you[b], beloved self-control.
translation:
  language: hi
  text: मैं तेरे प्रति झूठा नहीं ठहरूँगा[a], हे शिक्षा देनेवाली व्यवस्था; और हे प्रिय आत्म-संयम, मैं तुझे बचाकर नहीं रखूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझसे झूठ नहीं बोलूँगा,” अथवा “मैं तुझे धोखा नहीं दूँगा।” यूनानी क्रिया किसी व्यक्ति से झूठ बोलने के साथ-साथ उसके प्रति झूठा या असत्य सिद्ध होने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं तुझे नहीं बख्शूँगा।” यहाँ व्यवस्था और आत्म-संयम को व्यक्तियों के समान सीधे संबोधित किया गया है। ‘बचाकर नहीं रखूँगा’ इस असामान्य, व्यक्ति-रूप संबोधन में ‘न बख्शने’ के भाव को बिना हिंसक अर्थ दिए व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: ψεύσομαί σε
  choice: मैं तेरे प्रति झूठा नहीं ठहरूँगा
  rationale: ψεύδομαι का मूल संबंध झूठ या असत्य से है; व्यक्ति-कर्म के साथ यह उसके प्रति अविश्वासी या झूठा सिद्ध होने का भाव भी दे सकता है। यह अनुवाद उस निष्ठा-प्रतिज्ञा को बनाए रखते हुए मूल की अस्पष्टता को पूरी तरह मिटाता नहीं।
- source_word: παιδευτὰ νόμε
  choice: हे शिक्षा देनेवाली व्यवस्था
  rationale: दोनों शब्द संबोधन में हैं और νόμος को व्यक्ति-रूप में शिक्षक या अनुशासक के रूप में प्रस्तुत करते हैं। ‘व्यवस्था’ यहूदी धार्मिक-सांस्कृतिक संदर्भ में νόμος का स्वाभाविक हिन्दी रूप है, जबकि ‘शिक्षा देनेवाली’ παιδευτά के प्रशिक्षण और अनुशासन—दोनों भावों को व्यक्त करता है।
- source_word: φείσομαί σε
  choice: मैं तुझे बचाकर नहीं रखूँगा
  rationale: φείδομαι का अर्थ किसी को बचाना, छोड़ देना या उसका पूरा उपयोग न करना हो सकता है। आत्म-संयम जैसी सद्गुण को सीधे संबोधित करते समय शाब्दिक ‘तुझे नहीं बख्शूँगा’ हिन्दी में अनुचित हिंसक अर्थ दे सकता है; ‘बचाकर नहीं रखूँगा’ उस तनाव को बनाए रखता है कि वक्ता इस सद्गुण को कष्ट के समय पूरी तरह काम में लाएगा।
- source_word: φίλη
  choice: प्रिय
  rationale: संबोधन में φίλη स्नेह और मूल्यवान लगाव व्यक्त करता है। ‘प्रिय’ आधुनिक, गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: ἐγκράτεια
  choice: आत्म-संयम
  rationale: ἐγκράτεια इच्छाओं और आवेगों पर अधिकार रखने की सद्गुण है। ‘आत्म-संयम’ स्पष्ट और प्रचलित हिन्दी है तथा ‘संयम’ के केवल आहार या यौन-संदर्भ तक सीमित होने की संभावना घटाता है।
theological_decisions:
- issue: व्यवस्था और आत्म-संयम का मानवीकरण
  choice: दोनों को सीधे संबोधित व्यक्ति-रूप सद्गुणों के रूप में रखा गया है।
  alternative: सीधे संबोधन को हटाकर व्यवस्था से मिलनेवाली शिक्षा और आत्म-संयम के विषय में अमूर्त कथन करना।
  rationale: यूनानी पाठ के संबोधन-रूप और अलंकारिक उद्बोधन को बनाए रखना लेखक की साहित्यिक शैली तथा नैतिक तर्क को सुरक्षित रखता है और कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
- issue: φείσομαί के असामान्य प्रयोग का आशय
  choice: ‘बचाकर नहीं रखूँगा’ के द्वारा आत्म-संयम को पूरी तरह काम में लाने का भाव रखा गया है।
  alternative: शाब्दिक ‘तुझे नहीं बख्शूँगा’ या व्याख्यात्मक ‘मैं तेरा पूरा उपयोग करूँगा’।
  rationale: पहला विकल्प हिन्दी में भ्रामक हिंसक भाव देता है, जबकि दूसरा मूल की असामान्य अभिव्यक्ति को अत्यधिक स्पष्ट कर देता है। चुना हुआ रूप अर्थ और साहित्यिक तनाव के बीच संतुलन रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, अलंकारिक संबोधन रखा गया है। ‘हे’ का सीमित प्रयोग मूल के दोनों संबोधनों को स्पष्ट करता है। एक ही वाक्य में ‘तेरे/तुझे’ का एकवचन रूप व्यक्ति-रूप सद्गुणों के प्रति निकट, प्रत्यक्ष संबोधन को बनाए रखता है।
