  yaml_path: translation/deuterocanon/4_maccabees/005/027.yaml
  text: But tyrannically you are not only compelling us to break the law[a], but also to eat, so that you may further mock us with this most hateful defilement by food.
translation:
  language: hi
  text: पर अत्याचारी ढंग से तुम हमें न केवल व्यवस्था तोड़ने, बल्कि खाने के लिए भी विवश कर रहे हो, ताकि तुम खाने से होने वाली हमारी इस अत्यंत घृणित अपवित्रता[a] को लेकर हमारा और भी उपहास कर सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारा यह अत्यंत घृणित अशुद्ध भोजन” अथवा “हमारा यह अत्यंत घृणित अपवित्र खाना।” यूनानी का यह दुर्लभ शब्द खाने और धार्मिक या नैतिक अपवित्रता—दोनों के भावों को जोड़ता है।
    reason: दुर्लभ संयुक्त यूनानी शब्द के वैकल्पिक अर्थों और उसकी वास्तविक बहुअर्थकता को सुरक्षित रखना।
lexical_decisions:
- source_word: τυραννικὸν
  choice: अत्याचारी ढंग से
  rationale: यह विशेषण यहाँ क्रियाविशेषण-सदृश रूप में शासक के दमनकारी आचरण को दर्शाता है; यह अनुवाद आरोप की तीव्रता बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ἀναγκάζεις
  choice: विवश कर रहे हो
  rationale: वर्तमान काल में बलपूर्वक बाध्य करने का अर्थ स्पष्ट करता है।
- source_word: παρανομεῖν
  choice: व्यवस्था तोड़ने
  rationale: क्रिया का अर्थ कानून के विरुद्ध चलना है। प्रसंग में यह यहूदी व्यवस्था/तोरा है, पर मूल में ईश्वर या पैतृक जैसे विशेषण नहीं जोड़े गए हैं।
- source_word: ἐσθίειν
  choice: खाने
  rationale: सरल और प्रत्यक्ष अनुवाद, जो मूल के सामान्य क्रियापद को बनाए रखता है।
- source_word: ὅπως
  choice: ताकि
  rationale: शासक के उद्देश्य को व्यक्त करने वाले प्रयोजनवाचक संबंध को सुरक्षित रखता है।
- source_word: ἐχθίστῃ
  choice: अत्यंत घृणित
  rationale: मूल के अतिशयोक्तिपूर्ण भाव और वक्ता की प्रबल घृणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μιεροφαγίᾳ
  choice: भोजन से होने वाली ... अपवित्रता
  rationale: यह दुर्लभ संयुक्त शब्द खाने और धार्मिक/नैतिक अपवित्रता, दोनों धारणाओं को जोड़ता है। चुना हुआ रूप खाने से उत्पन्न अपवित्रता पर बल देता है, जबकि विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: ἔτι
  choice: और भी
  rationale: पहले से हो रहे अपमान में अतिरिक्त उपहास जुड़ने का भाव देता है।
- source_word: ἐγγελάσῃς
  choice: हमारी ... हँसी उड़ा सको
  rationale: किसी पर हँसने, उसका उपहास करने या उसे तुच्छ ठहराने का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मक्काबी शहादत के प्रसंग में παρανομεῖν की ‘व्यवस्था’
  choice: व्यवस्था तोड़ने
  alternative: परमेश्वर की व्यवस्था तोड़ने; पैतृक व्यवस्था का उल्लंघन करने
  rationale: प्रसंग से तोरा का संकेत स्पष्ट है, पर यूनानी पाठ केवल कानून/व्यवस्था के विरुद्ध कार्य करने की बात कहता है। इसलिए मुख्य पाठ में अतिरिक्त धर्मवैज्ञानिक विशेषण नहीं जोड़ा गया।
- issue: μιεροφαγίᾳ में अपवित्रता का स्वरूप
  choice: भोजन से होने वाली हमारी ... अपवित्रता
  alternative: हमारा अपवित्र भोजन; हमारा अपवित्रतापूर्ण खाना; भोजन द्वारा अपवित्रीकरण
  rationale: दुर्लभ संयुक्त शब्द खाने की क्रिया और उससे जुड़ी धार्मिक अथवा नैतिक अपवित्रता को एक साथ रखता है। मुख्य पाठ इस संबंध को स्पष्ट करता है, पर पादटिप्पणी मूल की शब्दगत बहुअर्थकता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यवस्था’ मक्काबी प्रसंग में तोरा की ओर संकेत करती है, लेकिन मूल से अधिक स्पष्ट धर्मवैज्ञानिक विस्तार नहीं किया गया। ‘अपवित्रता’ धार्मिक और नैतिक अशुद्धि के व्यापक भाव को बनाए रखती है।
