  yaml_path: translation/deuterocanon/4_maccabees/005/008.yaml
  text: For it is foolish not to enjoy the pleasant things that are without reproach[a], and unjust to turn away from the gifts of nature.
translation:
  language: hi
  text: क्योंकि जिन सुखों पर कोई निन्दा नहीं, उनका आनन्द न लेना मूर्खता है[a], और प्रकृति के उपहारों से मुँह मोड़ना अन्याय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्दोष सुखों का आनन्द न लेना मूर्खता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητον
  choice: मूर्खता
  rationale: यह शब्द समझ-बूझ के अभाव को व्यक्त करता है; ‘मूर्खता’ आधुनिक हिन्दी में स्वाभाविक है और कथन की बौद्धिक-नैतिक धार बनाए रखता है।
- source_word: ἀπολαύειν
  choice: आनन्द लेना
  rationale: यहाँ आशय सुखद वस्तुओं का उपभोग करके प्रसन्नता पाने से है; ‘आनन्द लेना’ स्पष्ट और सहज हिन्दी है।
- source_word: τῶν χωρὶς ὀνείδους ἡδέων
  choice: जिन सुखद बातों में कोई निन्दा नहीं
  rationale: ἡδέων को व्यापक रूप से ‘सुखद बातें’ और χωρὶς ὀνείδους को ‘जिनमें कोई निन्दा नहीं’ कहा गया है, ताकि सुख तथा उसकी नैतिक सीमा दोनों स्पष्ट रहें।
- source_word: ἄδικον
  choice: अन्याय
  rationale: ‘अन्याय’ यूनानी शब्द की नैतिक तीव्रता को ‘गलत’ जैसे अपेक्षाकृत हल्के विकल्प से बेहतर बनाए रखता है।
- source_word: ἀποστρέφεσθαι
  choice: मुँह मोड़ना
  rationale: मध्यवाच्य क्रिया स्वयं को किसी वस्तु से फेर लेने का चित्र देती है; ‘मुँह मोड़ना’ इस बिम्ब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὰς τῆς φύσεως χάριτας
  choice: प्रकृति के उपहार
  rationale: χάριτας यहाँ प्रकृति से मिलने वाले लाभकारी वरदानों या देनों का बोध कराता है; ‘प्रकृति के उपहार’ सहज है और अनावश्यक उत्तरवर्ती धर्मवैज्ञानिक अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: प्राकृतिक सुखों का नैतिक मूल्यांकन
  choice: पद केवल उन्हीं सुखद बातों का अनुमोदन करता है जिनमें निन्दा की कोई बात नहीं है।
  alternative: इसे संक्षेप में ‘निर्दोष सुख’ कहा जा सकता है।
  rationale: χωρὶς ὀνείδους सुखद बातों को स्पष्ट रूप से सीमित करता है; इसलिए अनुवाद न तो प्रत्येक सुख को उचित ठहराता है, न उस सकारात्मक कथन को कमजोर करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज और गरिमापूर्ण रखी गई है। ‘निन्दा’, ‘आनन्द’ और ‘अन्याय’ नैतिक-वक्तृत्वात्मक स्वर को बनाए रखते हैं, जबकि ‘सुखद बातें’ सामान्य पाठक के लिए व्यापक और सुबोध है।
