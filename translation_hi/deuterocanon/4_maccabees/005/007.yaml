lexical_decisions:
- source_word: διὰ τί γὰρ
  choice: भला, ... क्यों
  rationale: ‘भला’ γάρ के तर्कपूर्ण और चुनौतीपूर्ण बल को स्वाभाविक हिन्दी प्रश्न में बनाए रखता है।
- source_word: τῆς φύσεως
  choice: प्रकृति ने
  rationale: सम्बन्धकारक निरपेक्ष रचना को हिन्दी में कर्तृवाचक उपवाक्य के रूप में व्यक्त किया गया है; यहाँ φύσις का सामान्य अर्थ ‘प्रकृति’ उपयुक्त है।
- source_word: κεχαρισμένης
  choice: बनाया है
  rationale: पूर्ण कृदन्त द्वारा सूचित प्रदान की गई परिणामी विशेषता को सहज हिन्दी में व्यक्त करता है, बिना ‘अनुग्रह’ का अनावश्यक धार्मिक भाव जोड़े।
- source_word: καλλίστην
  choice: सर्वोत्तम
  rationale: καλός के उत्कृष्टतावाचक रूप की प्रबलता बनाए रखता है; प्रसंग में यह आकर्षक या उत्तम खाद्य होने का दावा है।
- source_word: τὴν τοῦδε τοῦ ζῴου σαρκοφαγίαν
  choice: इस पशु का मांस खाना
  rationale: शाब्दिक ‘मांस-भक्षण’ की अपेक्षा साधारण आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि पशु और उसके मांस का ठोस संदर्भ सुरक्षित रहता है।
- source_word: βδελύττεις
  choice: घृणा करते हो
  rationale: यह क्रिया तीव्र विकर्षण और घिन को व्यक्त करती है; ‘घृणा करना’ स्पष्ट, सशक्त और वर्तमान हिन्दी में सहज है।
