  rationale: आज्ञार्थक क्रिया उपकरणों को उपयोग के लिए तैयार करने का निर्देश देती है।
- source_word: τὸ πῦρ
  choice: आग को
  rationale: यह प्रसंग में उपस्थित विशिष्ट आग को सूचित करता है और हिन्दी में सीधा, स्वाभाविक रूप है।
- source_word: ἔκφυσα
  choice: फूँककर ... तेज़ कर दो
  rationale: क्रिया आग पर फूँक मारकर उसे अधिक प्रचंड करने का चित्र प्रस्तुत करती है; हिन्दी में संयुक्त अभिव्यक्ति अर्थ और क्रिया-चित्र दोनों स्पष्ट करती है।
- source_word: σφοδρότερον
  choice: और भी तेज़
  rationale: तुलनात्मक क्रियाविशेषण बढ़ी हुई तीव्रता व्यक्त करता है; ‘और भी’ तुलना और वृद्धि दोनों सुरक्षित रखता है।
