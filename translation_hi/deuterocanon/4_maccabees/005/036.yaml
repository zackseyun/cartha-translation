  text: Nor will you defile my mouth, made venerable by old age, nor the years of a law-abiding life.
translation:
  language: hi
  text: तुम न तो मेरे मुँह को अशुद्ध करोगे, जिसे वृद्धावस्था ने आदरणीय बनाया है, और न ही व्यवस्था के अनुसार जिए हुए मेरे जीवन की आयु को।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιαινεῖς
  choice: अशुद्ध कर पाओगे
  rationale: क्रिया का मूल अर्थ अपवित्र या दूषित करना है; प्रसंग में निषेध के साथ दृढ़ प्रतिरोध का भाव है।
- source_word: τὸ σεμνὸν γήρως στόμα
  choice: मेरे मुँह को, जिसे बुढ़ापे ने आदरणीय बनाया है
  rationale: ग्रीक पदक्रम में στόμα मुख्य संज्ञा है और γήρως को इस सम्मान का आधार मानना स्वाभाविक है; इससे वृद्धावस्था से प्राप्त गरिमा सुरक्षित रहती है।
- source_word: νομίμου βίου
  choice: व्यवस्था के अनुसार बिताए मेरे जीवन
  rationale: νόμιμος यहाँ केवल सामान्यतः ‘कानून मानने वाला’ नहीं, बल्कि व्यवस्था के अनुरूप जीवन का संकेत देता है।
- source_word: ἡλικίαν
  choice: वर्षों को
  rationale: ἡλικία आयु, जीवनकाल या जीवन की अवस्था को सूचित कर सकता है; यहाँ वृद्ध वक्ता के व्यवस्था-अनुरूप बीते जीवनकाल के लिए स्वाभाविक हिन्दी ‘वर्षों’ है।
theological_decisions:
- issue: ‘व्यवस्था’ का आशय
  choice: व्यवस्था के अनुसार
  alternative: कानून का पालन करते हुए
  rationale: यहूदियों की धार्मिक व्यवस्था की पृष्ठभूमि को बनाए रखता है, पर पाठ में अनावश्यक रूप से ‘मूसा की’ नहीं जोड़ता।
- issue: मुँह और जीवन-वर्षों को अशुद्ध करने का संबंध
  choice: दोनों को एक ही क्रिया ‘अशुद्ध कर पाओगे’ के अधीन रखा
  alternative: दूसरे खंड में ‘कलंकित’ जैसी अलग क्रिया जोड़ना
  rationale: ग्रीक में दूसरी क्रिया निहित है; उसी क्रिया को बनाए रखने से कथन की तीक्ष्ण समानांतरता और संभावित रूपकगत तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, दृढ़ और सहज शैली। ‘बुढ़ापा’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘आदरणीय’ से σεμνός की प्रतिष्ठा व्यक्त होती है।
