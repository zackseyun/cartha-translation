  text: My fathers will welcome me as a champion[a], since I did not fear your constraints, even unto death.
translation:
  language: hi
  text: मेरे पूर्वज एक संघर्षकर्ता के रूप में मेरा स्वागत करेंगे[a], क्योंकि मैं मृत्यु तक की तुम्हारी बाध्यताओं से नहीं डरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “मेरे पूर्वज मुझे संघर्ष/प्रतियोगिता के लिए स्वीकार करेंगे।” यूनानी में खेल-प्रतियोगिता या युद्ध-सदृश संघर्ष की बिंबावली है; इस असामान्य वाक्यांश का सटीक व्याकरणिक संबंध कुछ अस्पष्ट है।
    reason: मूल यूनानी की असामान्य संघर्ष-संबंधी अभिव्यक्ति और उसकी वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀγών᾽
  choice: एक वीर योद्धा के रूप में
  rationale: ग्रीक का संक्षिप्त रूप संघर्ष, प्रतियोगिता या युद्ध-सदृश परीक्षा की बिंबावली रखता है, पर इस वाक्य में उसका शाब्दिक अनुवाद हिन्दी में अस्वाभाविक होगा। ‘वीर योद्धा’ सम्मानपूर्वक स्वीकार किए जाने और मृत्यु तक डटे रहने का भाव व्यक्त करता है; मूल की असामान्य अभिव्यक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οἱ πατέρες
  choice: मेरे पूर्वज
  rationale: यहाँ आशय निकटतम पिता या माता-पिता से नहीं, बल्कि पहले के पितृपुरुषों से है। आधुनिक हिन्दी में ‘मेरे पूर्वज’ अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: προσδέξονται
  choice: मेरा स्वागत करेंगे
  rationale: क्रिया अनुकूल और प्रसन्नतापूर्वक ग्रहण किए जाने का संकेत देती है; इसलिए केवल ‘स्वीकार करेंगे’ की अपेक्षा ‘स्वागत करेंगे’ अधिक उपयुक्त है।
- source_word: μὴ φοβηθέντα
  choice: क्योंकि मैं ... नहीं डरा
  rationale: अओरिस्ट कृदन्त वक्ता को ऐसे व्यक्ति के रूप में वर्णित करता है जो अत्याचार से नहीं डरा। हिन्दी में कारणसूचक उपवाक्य इस संबंध को सहजता से व्यक्त करता है।
- source_word: σου
  choice: तुम्हारी
  rationale: यह अत्याचारी शासक की ओर संकेत करने वाला सीधा संबंधसूचक रूप है।
- source_word: τὰς μέχρι θανάτου ἀνάγκας
  choice: तुम्हारी उस ज़बरदस्ती ... जो मृत्यु तक ले जाती है
  rationale: ἀνάγκας यहाँ आवश्यकता नहीं, बल्कि बाध्यकारी दबाव या ज़ोर-जबरदस्ती को दर्शाता है। μέχρι θανάτου उसकी चरम सीमा—मृत्यु—बताता है। यह हिन्दी रूप coercion और उसके घातक विस्तार दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: ‘पूर्वजों’ की पहचान और मृत्यु के बाद स्वागत
  choice: वक्ता अपने पूर्वजों द्वारा स्वागत किए जाने की आशा व्यक्त करता है।
  alternative: इसे केवल आदरणीय पितृपुरुषों की सामान्य स्वीकृति माना जा सकता है, बिना मृत्यु के बाद के स्वागत पर विशेष बल दिए।
  rationale: शहादत और मृत्यु तक न डरने का संदर्भ मृत्यु के बाद पूर्वजों द्वारा स्वागत का संकेत देता है। अनुवाद इसी कथन तक सीमित रहता है और परलोक के विषय में कोई विस्तृत सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘वीर योद्धा’ मूल की संघर्ष-बिंबावली को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक और अस्पष्ट विकल्प दर्ज करती है।
