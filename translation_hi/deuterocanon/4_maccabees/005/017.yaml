translation:
  language: hi
  text: इसी कारण हम निश्चय ही किसी भी प्रकार से व्यवस्था का उल्लंघन करना उचित नहीं समझते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: इसी कारण
  rationale: यह पूर्ववर्ती तर्क से निष्कर्ष निकालने वाला संबंधसूचक है; ‘इसी कारण’ इसके कारणात्मक और निष्कर्षात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὴ
  choice: निश्चय ही
  rationale: यह कथन पर बल देने वाला निपात है; ‘निश्चय ही’ बल को बनाए रखता है, बिना अर्थ को अनावश्यक रूप से बढ़ाए।
- source_word: κατʼ οὐδένα τρόπον
  choice: किसी भी प्रकार से
  rationale: नकार के साथ यह पदबंध पूर्ण निषेध व्यक्त करता है; हिन्दी वाक्य में ‘नहीं’ के साथ ‘किसी भी प्रकार से’ वही व्यापक निषेध देता है।
- source_word: παρανομεῖν
  choice: व्यवस्था का उल्लंघन करना
  rationale: क्रिया का अर्थ विधि या व्यवस्था के विरुद्ध चलना है। यह चयन कानूनी और नैतिक दोनों भावों को स्पष्ट तथा गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἀξιοῦμεν
  choice: उचित नहीं समझते
  rationale: यहाँ क्रिया किसी कार्य को उचित या योग्य मानने के विचारपूर्ण निर्णय को व्यक्त करती है; यूनानी निषेध को हिन्दी में स्वाभाविक रूप से इसी पदबंध के साथ रखा गया है।
theological_decisions:
- issue: νόμος-सम्बन्धी भाव का स्वरूप
  choice: ‘व्यवस्था’ को बिना अतिरिक्त विशेषण के रखा गया है।
  alternative: ‘मूसा की व्यवस्था’ या ‘पैतृक व्यवस्था’
  rationale: इस पद में व्यवस्था के साथ कोई स्पष्ट विशेषण नहीं है। प्रसंग यहूदी पैतृक व्यवस्था की ओर संकेत करता है, पर अनुवाद में उसे स्पष्ट रूप से जोड़ना मूल से अधिक निश्चितता लाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निश्चय ही’ δὴ के बल को व्यक्त करता है, जबकि निषेध को हिन्दी की स्वाभाविक संरचना में ‘उचित नहीं समझते’ के साथ रखा गया है।
