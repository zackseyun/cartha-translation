    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
  choice: बूढ़ा
  rationale: यह शब्द अधिक आयु को दर्शाता है। विधेयात्मक वाक्य में ‘इतना बूढ़ा’ सहज और सीधे रूप में यूनानी अभिव्यक्ति को रखता है।
- source_word: ἀνδρῶδης
  choice: पुरुषोचित दृढ़ता वाला
  rationale: यूनानी शब्द का पुरुष-संबंधी आलंकारिक बल बनाए रखते हुए यह पूर्ण-वयस्क साहस और दृढ़ता का भाव देता है; केवल ‘परिपक्व’ कहने से मूल का लैंगिक और वक्तृत्वात्मक रंग मिट जाता।
- source_word: εὐσέβειαν
  choice: परमेश्वर-भक्ति
  rationale: यहाँ शब्द परमेश्वर और उसकी व्यवस्था के प्रति श्रद्धापूर्ण निष्ठा का प्रमुख सद्गुण व्यक्त करता है। ‘परमेश्वर-भक्ति’ आधुनिक हिन्दी में इसका धार्मिक अभिमुखीकरण स्पष्ट करता है।
- source_word: νεάζειν
  choice: युवा रहे
  rationale: यह रूप युवा होने या बने रहने का भाव देता है और शारीरिक बुढ़ापे के विपरीत विवेक की युवावस्था वाले रूपक को सुरक्षित रखता है।
- source_word: λογισμόν
  choice: विवेक
  rationale: 4 मकाबियों में यह तर्कपूर्ण निर्णय-शक्ति के लिए एक केंद्रीय दार्शनिक शब्द है। हिन्दी में ‘विवेक’ मन की सामान्य धारणा से अधिक स्पष्ट रूप से नैतिक और तर्कपूर्ण निर्णय-क्षमता को व्यक्त करता है।
- source_word: ὥστε μοι ... μὴ νεάζειν τὸν λογισμόν
  choice: कि ... मेरा विवेक युवा न रहे
  rationale: ὥστε और क्रियार्थक संज्ञा का परिणामसूचक ढाँचा तथा मूल का निषेध दोनों बनाए गए हैं। वाक्य की असामान्य आलंकारिक तन्यता को सरल अर्थ लगाकर हटाया नहीं गया।
theological_decisions:
- issue: यहूदी शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: परमेश्वर-भक्ति
  alternative: भक्ति; धर्मनिष्ठा; श्रद्धा
  rationale: पद उत्पीड़न के बीच परमेश्वर के प्रति अटल निष्ठा की बात करता है। ‘परमेश्वर-भक्ति’ धार्मिक दिशा स्पष्ट रखता है, जबकि ‘धर्मनिष्ठा’ अपेक्षाकृत व्यापक और ‘श्रद्धा’ कुछ कम क्रियाशील हो सकती है।
- issue: ἀνδρῶδης का लैंगिक और वक्तृत्वात्मक बल
  choice: पुरुषोचित दृढ़ता वाला
  alternative: परिपक्व; बलवान; साहसी
  rationale: मूल शब्द स्पष्ट रूप से पुरुष-संबंधी है। चुना हुआ रूप इस विशेषता को सुरक्षित रखता है और साथ ही आधुनिक हिन्दी में इसे वयस्क दृढ़ता के अर्थ में समझने योग्य बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘पुरुषोचित दृढ़ता वाला’ मूल की लैंगिक और आलंकारिक विशेषता को बनाए रखता है, यद्यपि पूरे वाक्य की तर्क-संरचना हिन्दी में भी जानबूझकर कुछ तनावपूर्ण रहती है।
