base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/010.yaml
  text: If[a], while vainly boasting about the truth, you still despise even me at the cost of your own punishment[b], will you not wake up from your foolish philosophy?
translation:
  language: hi
  text: यदि तुम सत्य के विषय में खोखला घमंड करते हुए भी मेरा भी तिरस्कार अपने ही दंड की कीमत पर करोगे[a], तो क्या तुम अपने इस प्रलापपूर्ण दर्शन[b] से जागोगे नहीं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने ही दंड के लिए” अथवा “अपने ऊपर दंड लाते हुए।” यूनानी वाक्यांश का संबंध और बल कुछ अस्पष्ट है, पर आशय संभवतः यह है कि ऐसा तिरस्कार उसी व्यक्ति के लिए दंड का कारण बनेगा।
    reason: lexical_alternative
  - marker: b
    text: या, “बकबक-भरे दर्शन” अथवा “मूर्खतापूर्ण दर्शन।” यहाँ प्रयुक्त विशेषण खोखली, निरर्थक या बकबक से भरी बात का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κενοδοξῶν
  choice: खोखला घमंड करते हुए
  rationale: कृदंत निराधार या व्यर्थ आत्म-गौरव व्यक्त करता है; यह चयन उसकी क्रियात्मकता और निंदात्मक भाव दोनों बनाए रखता है।
- source_word: περὶ τὸ ἀληθές
  choice: सत्य के विषय में
  rationale: यह वाक्यांश सत्य के संबंध में किए जा रहे घमंड को बताता है और वस्तु को स्पष्ट रखते हुए अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: κἀμοῦ
  choice: मेरा भी
  rationale: κἀμοῦ में καί का ‘भी’ भाव है; इससे वक्ता के अपने प्रति किए गए तिरस्कार पर भी बल पड़ता है।
- source_word: καταφρονήσεις
  choice: तिरस्कार करोगे
  rationale: क्रिया घृणापूर्ण उपेक्षा या नीचा समझने का प्रबल भाव व्यक्त करती है।
- source_word: ἐπὶ τῇ ἰδίᾳ τιμωρίᾳ
  choice: अपने ही लिए दंड मोल लोगे
  rationale: पूर्वसर्गीय वाक्यांश का सटीक संबंध कुछ अस्पष्ट है, पर प्रसंग में तिरस्कार का परिणाम स्वयं सुनने वाले के दंड के रूप में सामने आता है; सहज हिन्दी में यह कारण-परिणाम स्पष्ट करता है।
- source_word: οὐκ ἐξυπνώσεις
  choice: क्या ... जागोगे नहीं?
  rationale: भविष्यकालीन आलंकारिक प्रश्न जागने के रूपक को सुरक्षित रखता है और सकारात्मक प्रत्युत्तर की अपेक्षा प्रकट करता है।
- source_word: φλυάρου φιλοσοφίας
  choice: बकवादी दर्शन
  rationale: φλύαρος केवल ‘मूर्खतापूर्ण’ नहीं, बल्कि खोखली, बेसिर-पैर या निरर्थक बातें करने का भाव भी रखता है; ‘बकवादी’ इस विशिष्ट तिरस्कारपूर्ण अर्थ को बचाता है।
- source_word: ὑμῶν
  choice: अपने लोगों के
  rationale: यूनानी सर्वनाम बहुवचन है, जबकि संबोधित व्यक्ति एकवचन है। हिन्दी में ‘अपने लोगों के’ इस संख्या-भेद को स्पष्ट करता है, यद्यपि शाब्दिक रूप ‘तुम लोगों का’ भी संभव है।
theological_decisions:
- issue: फटकार का आलंकारिक और दार्शनिक स्वर
  choice: इसे तीखी नैतिक चुनौती के रूप में रखा गया है और ‘दर्शन’ शब्द को उसके प्राचीन वाद-विवाद के संदर्भ में रहने दिया गया है।
  alternative: अंतिम खंड को अधिक व्याख्यात्मक रूप में ‘अपने लोगों की बेसिर-पैर की विचारधारा से होश में आओगे’ कहा जा सकता है।
  rationale: मूल पाठ यहूदी नैतिक तर्क में दार्शनिक शब्दावली का प्रयोग करता है। अनुवाद उसका विवादात्मक स्वर बनाए रखता है, पर बाद की धार्मिक या आधुनिक वैचारिक श्रेणियाँ नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सीधा और तीखा वादात्मक स्वर रखा गया है। एकवचन संबोधन और बहुवचन ὑμῶν के भेद को ‘अपने लोगों के’ द्वारा व्यक्त किया गया है।
