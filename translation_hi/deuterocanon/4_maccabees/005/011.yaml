  yaml_path: translation/deuterocanon/4_maccabees/005/011.yaml
  text: and you will scatter the nonsense of your reasonings[a], and, taking up a mind worthy of your age, you will philosophize about the truth of what is beneficial[b],
translation:
  language: hi
  text: और तुम अपने तर्कों की बकवास को दूर कर दोगे[a], और अपनी आयु के योग्य बुद्धि ग्रहण करके, जो हितकर है उसके सत्य पर दार्शनिक मनन करोगे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने विचारों की मूर्खता को तितर-बितर कर दोगे,” अथवा “अपनी दलीलों की बकवास को दूर कर दोगे।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का अर्थ “दार्शनिक चिंतन करना” या “दर्शन में लगना” है; यहाँ शब्दावली जानबूझकर दार्शनिक है, केवल सामान्य सोच-विचार की नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἀποσκεδάσεις
  choice: दूर कर देगा
  rationale: क्रिया का मूल बिंब तितर-बितर करने या हटा देने का है। हिन्दी में ‘दूर कर देगा’ मानसिक निरर्थकता के संदर्भ में स्वाभाविक है, जबकि पाद-टिप्पणी मूल के अधिक चित्रात्मक विकल्प सुरक्षित रखती है।
- source_word: λῆρον τῶν λογισμῶν
  choice: अपने तर्कों की निरर्थकता
  rationale: λῆρος मूर्खतापूर्ण या निरर्थक बात को और λογισμοί विचारों, तर्कों या दलीलों को सूचित कर सकता है। ‘तर्कों की निरर्थकता’ बौद्धिक संदर्भ और तिरस्कारपूर्ण बल दोनों बनाए रखता है।
- source_word: ἄξιον τῆς ἡλικίας
  choice: अपनी आयु के योग्य
  rationale: यह यूनानी पदबंध के निकट है और ‘परिपक्वता’ जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀναλαβὼν νοῦν
  choice: बुद्धि अपनाकर
  rationale: शाब्दिक अर्थ ‘मन/बुद्धि को ग्रहण करके’ है। ‘बुद्धि अपनाकर’ यूनानी रूपक को पठनीय आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φιλοσοφήσεις
  choice: दार्शनिक मनन करेगा
  rationale: क्रिया स्पष्ट रूप से दर्शन करने या दार्शनिक चिंतन में लगने को व्यक्त करती है। ‘दार्शनिक मनन’ इस विशिष्ट शब्दावली को बचाते हुए हिन्दी में ‘दर्शन करेगा’ की संभावित अस्पष्टता से बचता है।
- source_word: τὴν τοῦ συμφέροντος ἀλήθειαν
  choice: जो हितकर है उसकी सच्चाई
  rationale: सम्बन्धकारक रचना को निकटता से रखते हुए συμφέρον को ‘जो हितकर है’ कहा गया है; इससे उपयोगी, लाभदायक या वास्तविक हित की अर्थ-सीमा खुली रहती है।
theological_decisions:
- issue: 4 मक्काबियों की दार्शनिक शब्दावली
  choice: ‘तर्कों,’ ‘बुद्धि’ और ‘दार्शनिक मनन’ जैसी स्पष्ट बौद्धिक शब्दावली बनाए रखना
  alternative: इसे सामान्य नैतिक भाषा में ‘विचार,’ ‘समझ’ और ‘सोच-विचार’ कहना
  rationale: लेखक यहूदी निष्ठा और नैतिक विवेक को जानबूझकर दार्शनिक श्रेणियों में प्रस्तुत करता है। सामान्य नैतिक भाषा इस वैचारिक तनाव और साहित्यिक रंग को मंद कर देती।
