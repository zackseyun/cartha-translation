  text: I will not pity my own old age so much that I would, by my own act, abolish the ancestral law.
translation:
  language: hi
  text: मैं अपने बुढ़ापे पर इतनी दया नहीं करूँगा कि अपने ही हाथों अपने पूर्वजों की व्यवस्था को रद्द कर दूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ οὕτως ... ὥστε
  choice: इतनी ... नहीं ... कि
  rationale: यह यूनानी रचना मात्रा और उसके संभावित परिणाम का संबंध व्यक्त करती है—‘इतनी सीमा तक नहीं कि।’ हिंदी में यह संरचना स्वाभाविक और अर्थनिष्ठ है।
- source_word: οἰκτειρήσω
  choice: दया नहीं करूँगा
  rationale: क्रिया दया या करुणा करने का भाव रखती है। ‘बचा लूँगा’ कहना व्यावहारिक परिणाम को मूल कथन से अधिक स्पष्ट कर देता।
- source_word: τὸ ἐμαυτοῦ γῆρας
  choice: अपने बुढ़ापे पर
  rationale: γῆρας का अर्थ बुढ़ापा है और ἐμαυτοῦ आत्म-संबंध पर बल देता है। ‘अपने बुढ़ापे’ से यह बल सहज हिंदी में बना रहता है।
- source_word: με διʼ ἐμαυτοῦ
  choice: अपने ही हाथों
  rationale: वाक्यांश वक्ता की अपनी भूमिका और उत्तरदायित्व पर बल देता है। ‘अपने ही हाथों’ इसे मुहावरेदार हिंदी में व्यक्त करता है, बिना यह संकेत दिए कि कार्य सचमुच हाथ से किया जाएगा।
- source_word: τὸν πάτριον νόμον
  choice: अपने पूर्वजों की व्यवस्था
  rationale: πάτριος विरासत में मिली, पूर्वजों से संबंधित परंपरा को सूचित करता है। यहूदी संदर्भ में ‘व्यवस्था’ νόμος के धार्मिक और विधिक आशय को स्वाभाविक रूप से व्यक्त करती है।
- source_word: καταλῦσαι
  choice: निष्फल कर दूँ
  rationale: यहाँ क्रिया व्यवस्था को अपने आचरण से गिराने, निष्प्रभावी करने या उसकी सत्ता को नकारने का भाव रखती है। ‘निष्फल कर दूँ’ ‘नष्ट कर दूँ’ की भौतिक ध्वनि से बचते हुए अर्थ को व्यक्त करता है।
theological_decisions:
- issue: यहूदी शहादत के संदर्भ में πάτριον νόμον का अनुवाद
  choice: अपने पूर्वजों की व्यवस्था
  alternative: पैतृक व्यवस्था; पूर्वजों का विधान
  rationale: यह अभिव्यक्ति विरासत में मिली यहूदी व्यवस्था और परंपरा की ओर संकेत करती है। ‘पूर्वजों की व्यवस्था’ ऐतिहासिक-सामुदायिक संबंध तथा νόμος का धार्मिक-विधिक अर्थ दोनों बनाए रखती है, बिना बाद की किसी सांप्रदायिक शब्दावली को आरोपित किए।
- issue: καταλῦσαι की तीव्रता
  choice: निष्फल कर दूँ
  alternative: नष्ट कर दूँ; रद्द कर दूँ; तोड़ दूँ
  rationale: वक्ता के एक निजी कृत्य द्वारा पूरी व्यवस्था को औपचारिक रूप से समाप्त करना अभिप्रेत नहीं है; कथन अपने आचरण से उसकी सत्ता को गिराने या नकारने की गंभीरता व्यक्त करता है। ‘निष्फल’ इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज रूप अपनाया गया है। आत्म-संबंधी बल को ‘अपने’ और ‘ही’ से सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
