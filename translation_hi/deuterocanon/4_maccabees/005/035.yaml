base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/035.yaml
  text: Nor will I disgrace you[a], O philosophical reason, nor will I renounce you[b], honored priesthood and knowledge of the law.
translation:
  language: hi
  text: मैं तुम्हें अपमानित नहीं करूँगा, हे दार्शनिक विवेक,[a] और न ही तुम्हें त्यागूँगा, हे सम्मानित याजकत्व और व्यवस्था का ज्ञान।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दार्शनिक तर्क-बुद्धि।’ यूनानी संबोधन φιλόσοφε λόγε संक्षिप्त और अलंकारपूर्ण है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हे सम्मानित याजकत्व और व्यवस्था की निपुण समझ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: καταισχυνῶ
  choice: लज्जित करूँगा
  rationale: भविष्यत् सक्रिय रूप यहाँ संबोधित आदर्शों को अपमान या लज्जा में डालने का भाव व्यक्त करता है; ‘लज्जित करूँगा’ सम्मान-लज्जा की अर्थछाया बनाए रखता है।
- source_word: φιλόσοφε λόγε
  choice: हे दार्शनिक विवेक
  rationale: λόγος को यहाँ व्यक्तिरूप देकर संबोधित किया गया है और φιλόσοφος उसका विशेषण है। ‘दार्शनिक विवेक’ चिंतनशील तर्क-बुद्धि का स्वाभाविक हिन्दी रूप है और दोनों घटकों को बनाए रखता है।
- source_word: ἑξαρνήσομαί
  choice: त्याग करूँगा
  rationale: ἐξαρνέομαι साधारण इनकार से अधिक, नाता तोड़ने या परित्याग करने का भाव देता है; ‘त्याग करना’ इस प्रतिज्ञात्मक संदर्भ में स्वाभाविक है।
- source_word: ἱεροσύνη τιμία
  choice: आदरणीय याजकपद
  rationale: ἱεροσύνη याजकीय पद या याजकत्व को और τιμία उसके सम्मानित तथा मूल्यवान स्वरूप को व्यक्त करता है। ‘याजकपद’ संस्था/पद का अर्थ स्पष्ट रखता है।
- source_word: νομοθεσίας ἐπιστήμη
  choice: व्यवस्था का ज्ञान
  rationale: ἐπιστήμη ज्ञान या निपुण समझ है, जबकि νομοθεσία विधान अथवा दी हुई व्यवस्था को सूचित कर सकती है। यहूदी संदर्भ में ‘व्यवस्था का ज्ञान’ संक्षिप्त और बोधगम्य है।
theological_decisions:
- issue: दार्शनिक विवेक, याजकपद और व्यवस्था के ज्ञान का व्यक्तिरूप में प्रत्यक्ष संबोधन
  choice: तीनों पदों को संबोधन के रूप में रखा गया है और दूसरे खंड में एक ही ‘तुम्हारा’ के अंतर्गत याजकपद तथा व्यवस्था के ज्ञान को जोड़ा गया है।
  alternative: अंतिम दोनों संज्ञाओं को ‘दार्शनिक विवेक’ की समानाधिकरण व्याख्या मानना, या पूरे कथन को केवल दर्शन और यहूदी परंपरा न छोड़ने की सामान्य घोषणा बनाना।
  rationale: यूनानी में संबोधनात्मक रूप और द्वितीय पुरुष सर्वनाम अलंकारिक व्यक्तिरूप को प्रमुख बनाते हैं। हिन्दी में संबोधन बनाए रखने से इस तनाव को किसी एक व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रतिज्ञात्मक शैली रखी गई है। ‘हे’ प्रत्यक्ष संबोधन और व्यक्तिरूप को स्पष्ट करता है; ‘व्यवस्था’ यहूदी धार्मिक विधान के लिए प्रचलित बाइबलीय पद है।
