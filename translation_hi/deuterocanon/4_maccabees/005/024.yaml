base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/024.yaml
  text: And it trains in righteousness[a], so that one may be fair in all matters of conduct, and it teaches piety[b], so that one may worship only the God who truly exists with due majesty.
translation:
  language: hi
  text: और वह धार्मिकता[a] का प्रशिक्षण देती है, ताकि मनुष्य अपने आचरण के हर क्षेत्र में निष्पक्ष रहे; और वह भक्ति[b] की शिक्षा देती है, ताकि वह केवल उसी परमेश्वर की महिमा के अनुरूप आराधना करे जो वास्तव में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय’। यूनानी शब्द धार्मिकता अथवा न्याय, दोनों का बोध करा सकता है; यहाँ नैतिक गठन के व्यापक संदर्भ में ‘धार्मिकता’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: 'वैकल्पिक अनुवाद: ‘ताकि वह केवल सच्चे परमेश्वर की आराधना करे।’ यूनानी में शाब्दिक बल उस परमेश्वर पर है ‘जो है’, अर्थात झूठे देवताओं के विपरीत जो वास्तव में है।'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यहाँ शब्द नैतिक गठन और सदाचार को सूचित करता है। ‘धार्मिकता’ परियोजना के सामान्य समतुल्य को बनाए रखता है, जबकि ‘न्याय’ की प्रासंगिक छाया पादटिप्पणी में दी गई है।
- source_word: παιδεύει
  choice: प्रशिक्षण देती है
  rationale: यह क्रिया केवल जानकारी देने के बजाय अनुशासन, अभ्यास और नैतिक गठन का भाव रखती है।
- source_word: διὰ πάντων τῶν ἠθῶν
  choice: अपने पूरे आचरण में
  rationale: ἤθη आदतों, चरित्र और व्यवहार के समूचे क्षेत्र को दर्शाता है; यह हिंदी में संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: ἰσονομεῖν
  choice: सबके साथ समान व्यवहार करे
  rationale: क्रिया का मूल भाव समानता और निष्पक्ष व्यवहार है। यह अनुवाद कानूनी तकनीकीपन से बचते हुए व्यावहारिक नैतिक आशय स्पष्ट करता है।
- source_word: εὐσεβείαν
  choice: भक्ति
  rationale: यह परमेश्वर के प्रति श्रद्धायुक्त निष्ठा को व्यक्त करता है; आधुनिक हिंदी में ‘भक्ति’ सहज और धार्मिक संदर्भ के अनुकूल है।
- source_word: σέβειν
  choice: आराधना करे
  rationale: परमेश्वर को कर्म का स्पष्ट लक्ष्य मानते हुए यह क्रिया धार्मिक श्रद्धा और उपासना का भाव रखती है।
- source_word: μόνον τὸν ὄντα θεὸν
  choice: केवल उसी परमेश्वर ... जो वास्तव में अस्तित्व में है
  rationale: यह संरचना झूठे देवताओं के विपरीत परमेश्वर के वास्तविक अस्तित्व पर दिए गए यूनानी बल को बनाए रखती है।
- source_word: μεγαλοπρεπῶς
  choice: महिमा के अनुरूप
  rationale: क्रियाविशेषण महानता और वैभव के योग्य रीति का संकेत देता है; यह हिंदी अभिव्यक्ति परमेश्वर की महिमा के अनुरूप आराधना का आशय स्वाभाविक ढंग से देती है।
theological_decisions:
- issue: गैर-पौलिनी नैतिक संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: मुख्य पाठ में व्यापक नैतिक खरेपन को रखा गया है, पर समान व्यवहार के निकट संदर्भ के कारण ‘न्याय’ भी वास्तविक अर्थ-संभावना है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: μόνον τὸν ὄντα θεὸν का बल
  choice: केवल उसी परमेश्वर ... जो वास्तव में अस्तित्व में है
  alternative: केवल सच्चे परमेश्वर की
  rationale: चुना हुआ रूप परमेश्वर के वास्तविक होने पर यूनानी पाठ के अस्तित्वगत बल को बनाए रखता है और झूठे देवताओं के साथ निहित विरोध को अनावश्यक विस्तार के बिना व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘मनुष्य’ का प्रयोग यूनानी में निहित सामान्य कर्ता को स्पष्ट करता है। समानांतर वाक्य-विन्यास में ‘प्रशिक्षण’ और ‘शिक्षा’ का भेद मूल की παιδεύει/διδάσκει भिन्नता को कुछ हद तक सुरक्षित रखता है।
