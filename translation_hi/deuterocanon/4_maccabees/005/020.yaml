translation:
  language: hi
  text: क्योंकि छोटी हों या बड़ी, बातों में व्यवस्था का उल्लंघन करना एक ही बात है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छोटी और बड़ी बातों में व्यवस्था का उल्लंघन करना समतुल्य है।”
    reason: ἰσοδύναμόν के अधिक औपचारिक, निकटवर्ती विकल्प को दर्शाता है।
lexical_decisions:
- source_word: παρανομεῖν
  choice: व्यवस्था का उल्लंघन करना
  rationale: यह यूनानी क्रिया व्यवस्था के विरुद्ध आचरण करने को दर्शाती है। ‘व्यवस्था का उल्लंघन करना’ इसका विधिक और नैतिक बल स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν μικροῖς καὶ ἐν μεγάλοις
  choice: छोटी बातों में और बड़ी बातों में
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त हैं और छोटी तथा बड़ी बातों का विरोध प्रस्तुत करते हैं। यह चयन यूनानी की संक्षिप्त समानांतर संरचना बनाए रखता है।
- source_word: ἰσοδύναμόν
  choice: समान
  rationale: इस शब्द का अर्थ बल, मूल्य या प्रभाव में बराबर होना है। ‘समान’ प्रबल समतुल्यता-वचन को सुरक्षित रखता है, पर दंड या परिणाम हर दृष्टि से एक-जैसे होने का अतिरिक्त दावा नहीं जोड़ता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के संबंध में इस वाक्य की व्याख्यात्मक या कारणसूचक भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: छोटे और बड़े उल्लंघनों की नैतिक समानता
  choice: पद यह कहता है कि छोटी और बड़ी बातों में व्यवस्था का उल्लंघन करना समान है।
  alternative: हर उल्लंघन व्यवस्था का उल्लंघन तो है, पर उसकी गंभीरता या परिणाम आवश्यक रूप से हर दृष्टि से समान नहीं हैं।
  rationale: ἰσοδύναμόν ἐστιν एक प्रबल समानता व्यक्त करता है। अनुवाद उस तनाव को बनाए रखता है, लेकिन समान दंड, दोष या परिणाम का विस्तृत सिद्धांत पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और विधिक-नैतिक भाव वाली है। ‘व्यवस्था’ यहूदी व्यवस्था के संदर्भ को सुरक्षित रखती है, और ‘समान’ मूल पाठ की जानबूझकर प्रबल किंतु सीमा-अनिर्धारित समानता को बनाए रखता है।
