translation:
  language: hi
  text: जो वस्तुएँ हमारी आत्माओं के अनुकूल थीं[a], उन्हें उसने हमें खाने की अनुमति दी; पर जो उनके प्रतिकूल थीं, उनका मांस खाने से उसने हमें मना किया।
  philosophy: optimal-equivalence
  footnotes:
