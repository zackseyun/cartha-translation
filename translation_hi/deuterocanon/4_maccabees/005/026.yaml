    text: या, “जो वस्तुएँ हमारी आत्माओं से मेल खाती थीं”; इसके विपरीत, आगे “जो उनके विरुद्ध थीं।” यूनानी आत्मा के साथ नैतिक अनुरूपता या असंगति पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκειωθησόμενα
  choice: अनुकूल होनेवाली थीं
  rationale: यह भविष्यकालिक कृदन्त उन वस्तुओं को दर्शाता है जो आत्माओं के अनुरूप, उनसे मेल खानेवाली या उनके लिए उचित होंगी। ‘अनुकूल’ इस संबंध को सहज हिन्दी में व्यक्त करता है और नैतिक अनुरूपता की गुंजाइश बनाए रखता है।
- source_word: ψυχαῖς
  choice: आत्माओं
  rationale: यहाँ शब्द केवल जैविक जीवन नहीं, बल्कि मनुष्य के भीतरी नैतिक जीवन को सूचित करता है; इसलिए ‘आत्माओं’ मूल का नैतिक-मानवशास्त्रीय बल सुरक्षित रखता है।
- source_word: ἐπέτρεψεν
  choice: अनुमति दी
  rationale: व्यवस्था-संबंधी प्रसंग में यह ईश्वरीय अनुमति को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἐναντιωθησόμενα
  choice: प्रतिकूल होनेवाली थीं
  rationale: यह भविष्यकालिक कृदन्त उन वस्तुओं को दर्शाता है जो आत्माओं के विरुद्ध या उनसे असंगत होंगी। ‘प्रतिकूल’ विरोध के नैतिक भाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἐκώλυσεν
  choice: मना किया
  rationale: यहाँ क्रिया अनुमति के समानांतर निषेध प्रकट करती है; ‘मना किया’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: σαρκοφαγεῖν
  choice: मांस खाने
  rationale: यह यौगिक क्रिया शाब्दिक रूप से ‘मांस खाना’ बताती है। यह चुनाव पहले आए ‘खाने’ के साथ समानता रखते हुए σαρκο- का ठोस अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: आहार-विधान के संबंध में ψυχαῖς का मानवशास्त्रीय और नैतिक बल
  choice: ‘आत्माओं’ रखा और ‘अनुकूल…प्रतिकूल’ की अनुरूपता बनाए रखी
  alternative: ‘जीवनों’, ‘प्राणों’ या ‘स्वयं हमारे’ के रूप में अधिक ठोस अथवा सामान्य अनुवाद
  rationale: पद आहार की वस्तुओं और भीतरी नैतिक जीवन के बीच अनुरूपता अथवा विरोध प्रस्तुत करता है। ‘आत्माओं’ इस दावे को बनाए रखता है, पर इसे बाद के किसी विशिष्ट धर्मसिद्धान्त में विस्तृत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। भविष्यकालिक यूनानी कृदन्तों की समानांतर रचना को ‘होनेवाली थीं’ से सुरक्षित रखा गया है; अर्धविराम दोनों विपरीत खंडों को स्पष्ट करता है।
