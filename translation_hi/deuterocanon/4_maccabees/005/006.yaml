base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/006.yaml
  text: Before I begin the tortures against you[a], old man, I would advise you of this, so that by tasting the pork you might save yourself. For I respect your age and your gray hair, though after having had it for so long a time[b], you do not seem to me to philosophize by practicing the religion of the Jews.
translation:
  language: hi
  text: “हे वृद्ध, मैं तुम पर यातनाएँ आरम्भ करने से पहले तुम्हें यह सलाह देना चाहूँगा कि सूअर का मांस चखकर तुम अपनी जान बचा सको।[a] क्योंकि मैं तुम्हारी उम्र और तुम्हारे पके बालों का आदर करता हूँ; हालाँकि इतने लंबे समय से इन पके बालों को धारण किए हुए भी, मुझे नहीं लगता कि यहूदियों के धर्म का पालन करते हुए तुम दर्शन के अनुसार आचरण करते हो।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ताकि तुम बच जाओ।” प्रसंग में आशय यातना और मृत्यु से अपनी जान बचाने का है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का मूल अर्थ “दर्शन करना” है; यहाँ उसका आशय दार्शनिक ढंग से आचरण करना है। इससे इस पुस्तक में बार-बार आने वाली दर्शन और विवेक की भाषा बनी रहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἄρξασθαι τῶν κατὰ σοῦ βασάνων
  choice: मैं तुम पर यातनाएँ आरम्भ करूँ, उससे पहले
  rationale: πρίν के कालसूचक अर्थ और वक्ता के प्रथम-पुरुष भाव को स्वाभाविक हिन्दी में रखा गया है। βάσανοι यहाँ आसन्न शारीरिक यातनाओं को सूचित करता है और κατὰ σοῦ का बल ‘तुम पर’ से व्यक्त होता है।
- source_word: ὦ πρεσβῦτα
  choice: हे वृद्ध
  rationale: यह उम्रदराज़ व्यक्ति के लिए प्रत्यक्ष संबोधन है, किसी पदाधिकारी के लिए ‘प्राचीन’ या ‘पुरनिया’ नहीं। ‘हे वृद्ध’ गरिमापूर्ण होने के साथ संबोधन की स्पष्टता बनाए रखता है।
- source_word: συμβουλεύσαιμʼ ἂν σοι ταῦτα
  choice: तुम्हें यह सलाह देना चाहूँगा
  rationale: ἄν सहित optative विनम्र या कुछ नरम ढंग से रखा गया प्रस्ताव व्यक्त करता है; ‘देना चाहूँगा’ धमकी के बीच उस बनावटी विनम्रता को दर्शाता है।
- source_word: ὅπως ἀπογευσάμενος τῶν ὑείων σώζοιο
  choice: सूअर का मांस थोड़ा-सा चख लो, ताकि तुम अपनी जान बचा सको
  rationale: ὑεῖα सूअर के मांस को दर्शाता है और ἀπογεύομαι थोड़ी मात्रा चखने का भाव देता है। प्रसंग में σώζοιο यातना और मृत्यु से शारीरिक रूप से बचने की बात है।
- source_word: αἰδοῦμαι γάρ σου τὴν ἡλικίαν καὶ τὴν πολιάν
  choice: क्योंकि मैं तुम्हारी उम्र और तुम्हारे पके बालों का आदर करता हूँ
  rationale: αἰδέομαι यहाँ सम्मान या लिहाज़ के अर्थ में है। πολιὰ वृद्धावस्था के सफेद या धूसर बालों को सूचित करता है, जिसके लिए ‘पके बाल’ सहज हिन्दी है।
- source_word: ἣν μετὰ τοσοῦτον ἔχων χρόνον
  choice: इतने लंबे समय से ये पके बाल होने पर भी
  rationale: स्त्रीलिंग संबंधवाचक सर्वनाम ἣν निकटवर्ती πολιάν की ओर संकेत करता है। हिन्दी में उसी संदर्भ को स्पष्ट रखते हुए लंबे समय का भाव भी व्यक्त किया गया है।
- source_word: οὔ μοι δοκεῖς φιλοσοφεῖν
  choice: मुझे नहीं लगता कि … तुम दर्शन का अभ्यास कर रहे हो
  rationale: φιλοσοφεῖν को केवल ‘समझदार होना’ नहीं बनाया गया, क्योंकि दर्शन की भाषा इस पुस्तक का प्रमुख आवर्ती विषय है। ‘दर्शन का अभ्यास’ आधुनिक हिन्दी में अर्थबोध बनाए रखता है।
- source_word: τῇ Ἰουδαίων … θρησκείᾳ
  choice: यहूदियों के धर्म का पालन करके
  rationale: θρησκεία यहाँ धार्मिक आचरण या धर्म को दर्शाता है। ‘धर्म का पालन’ हिन्दी में स्वाभाविक है और व्यवहारगत अर्थ को व्यक्त करता है।
theological_decisions:
- issue: σώζοιο में उद्धार का स्वरूप
  choice: आसन्न यातना या मृत्यु से अपनी जान बचाना
  alternative: व्यापक या आध्यात्मिक अर्थ में ‘उद्धार पाना’
  rationale: वक्ता निषिद्ध मांस खाने के बदले एलीआज़र को शारीरिक दंड से बचने का प्रस्ताव दे रहा है; यहाँ आध्यात्मिक उद्धार का अर्थ जोड़ना प्रसंग से परे होगा।
- issue: φιλοσοφεῖν का अनुवाद
  choice: दर्शन का अभ्यास करना
  alternative: समझदारी से काम लेना / बुद्धिमान होना
  rationale: 4 मक्काबियों में विवेक, सद्गुण और दर्शन की शब्दावली जानबूझकर बार-बार आती है। स्पष्ट दार्शनिक भाषा बनाए रखने से पुस्तक की वैचारिक बनावट सुरक्षित रहती है।
- issue: यहूदी धार्मिक पालन और दर्शन के बीच वक्ता का आरोप
  choice: वक्ता के दृष्टिकोण के रूप में तनाव को यथावत रखना
  alternative: वाक्य को इस प्रकार स्पष्ट करना कि यहूदी धर्म या तो सच्चा दर्शन है या दर्शन के विरुद्ध है
  rationale: मूल वाक्य अत्याचारी की आलोचनात्मक दृष्टि प्रस्तुत करता है; अनुवाद को उसकी बात में किसी सम्प्रदायगत या व्याख्यात्मक निष्कर्ष को नहीं जोड़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संबोधन में वक्ता की कठोरता और सलाह में उसकी बनावटी विनम्रता दोनों सुरक्षित हैं। ‘दर्शन का अभ्यास’ कुछ औपचारिक है, पर मूल की प्रमुख वैचारिक शब्दावली बचाने के लिए जानबूझकर रखा गया है।
