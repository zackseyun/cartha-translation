  yaml_path: translation/deuterocanon/4_maccabees/005/025.yaml
  text: Therefore we do not eat defiling food[a]; for because we believe that the law has been established by God, we know that the Creator of the world, in giving the law[b], also sympathizes with our nature.
translation:
  language: hi
  text: इसलिए हम अशुद्ध भोजन नहीं खाते[a]; क्योंकि हम विश्वास करते हैं कि परमेश्वर ने व्यवस्था स्थापित की है, हम जानते हैं कि संसार का सृष्टिकर्ता भी व्यवस्था देते समय प्रकृति के अनुरूप हमारे प्रति सहानुभूति रखता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “इसलिए हम अशुद्ध वस्तु नहीं खाते।”'
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी वाक्य का अर्थ यह भी समझा जा सकता है: “संसार का सृष्टिकर्ता, हमारे प्रति सहानुभूति रखते हुए, प्रकृति के अनुसार विधान करता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: μιεροφαγοῦμεν
  choice: अशुद्ध भोजन नहीं खाते
  rationale: यह संयुक्त क्रिया अशुद्ध या दूषित वस्तु खाने को व्यक्त करती है। हिन्दी में निहित कर्म ‘भोजन’ को स्पष्ट करने से आहार-विधि का संदर्भ स्वाभाविक रहता है, जबकि अधिक विशिष्ट धार्मिक श्रेणी नहीं जोड़ी जाती।
- source_word: πιστεύοντες
  choice: क्योंकि हम विश्वास करते हैं
  rationale: संदर्भ में कृदन्त कारण बताता है कि वे ऐसा भोजन क्यों नहीं खाते; ‘क्योंकि’ इस कारणात्मक संबंध को सहज हिन्दी में स्पष्ट करता है।
- source_word: καθέστασθαι
  choice: स्थापित की है
  rationale: पूर्णकालिक क्रिया व्यवस्था के स्थापित किए जाने और उसके प्रभावी बने रहने—दोनों का संकेत देती है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: सव्यधिक पद यहाँ यहूदी जीवन को संचालित करने वाली विशिष्ट ईश्वरीय व्यवस्था की ओर संकेत करता है; बाइबलीय हिन्दी में ‘व्यवस्था’ इसका स्वाभाविक पद है।
- source_word: κατὰ φύσιν
  choice: हमारी प्रकृति के प्रति
  rationale: यह वाक्यांश συμπαθεῖ और ἡμῖν के साथ मिलकर सृष्टिकर्ता की मनुष्य की प्रकृति के अनुरूप सहानुभूति या संवेदनशीलता व्यक्त करता है। वैकल्पिक व्याकरणिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: συμπαθεῖ
  choice: सहानुभूति रखता है
  rationale: यह क्रिया साथ अनुभव करने या किसी के प्रति संवेदनशील और विचारशील होने का भाव रखती है; ‘सहानुभूति रखता है’ संबंधपरक अर्थ को बनाए रखता है।
- source_word: νομοθετῶν
  choice: व्यवस्था देते समय
  rationale: कृदन्त सृष्टिकर्ता को विधान करने की क्रिया में प्रस्तुत करता है। ‘व्यवस्था देते समय’ पूर्वोक्त ‘व्यवस्था’ से संबंध स्पष्ट और हिन्दी में स्वाभाविक रखता है।
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: संसार का सृष्टिकर्ता
  rationale: यह उपाधि विश्वव्यापी सृजन-संबंधी अर्थ और धर्मवैचारिक गरिमा दोनों को सीधे बनाए रखती है।
theological_decisions:
- issue: निषिद्ध भोजन से इनकार का आशय
  choice: कथन ईश्वरीय व्यवस्था के अनुसार अशुद्ध माने गए भोजन को न खाने की बात करता है।
  alternative: क्रिया का अनुवाद ‘हम अशुद्ध वस्तु नहीं खाते’ या ‘हम खाकर स्वयं को अशुद्ध नहीं करते’ भी हो सकता है।
  rationale: संयुक्त यूनानी क्रिया में अशुद्ध वस्तु खाने का भाव अंतर्निहित है और निकट संदर्भ निषिद्ध भोजन का है। मुख्य पाठ में ‘भोजन’ स्पष्ट करना पठनीयता बढ़ाता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- issue: विधान करते समय परमेश्वर और प्रकृति का संबंध
  choice: सृष्टिकर्ता व्यवस्था देते हुए हमारी प्रकृति के प्रति सहानुभूति रखता है।
  alternative: वाक्यांश का अर्थ यह भी हो सकता है कि सृष्टिकर्ता प्रकृति के अनुसार विधान करते हुए हमारे प्रति सहानुभूतिशील है।
  rationale: ἡμῖν के साथ συμπαθεῖ ‘हमारे प्रति’ सहानुभूति की ओर संकेत करता है, जबकि κατὰ φύσιν उस सहानुभूति को प्रकृति के अनुरूप बताता प्रतीत होता है। फिर भी कृदन्त और वाक्यांश का संबंध कुछ अस्पष्ट है, इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘व्यवस्था’ और ‘सृष्टिकर्ता’ जैसे परिचित बाइबलीय पद बनाए गए हैं। मूल यूनानी में κατὰ φύσιν के व्याकरणिक संबंध की वास्तविक अस्पष्टता को मुख्य पाठ में अत्यधिक बोझिल किए बिना पादटिप्पणी में सुरक्षित रखा गया है।
