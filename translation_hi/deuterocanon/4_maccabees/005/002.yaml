translation:
  language: hi
  text: उसने अंगरक्षकों[a] को आदेश दिया कि वे इब्रानियों में से हर एक को घसीटकर अलग ले जाएँ और उसे सूअर का मांस तथा मूर्तियों के लिए बलि चढ़ाया हुआ मांस[b] चखने के लिए मजबूर करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहरेदारों”; शाब्दिक रूप से “भाला धारण करने वालों।”
    reason: lexical_alternative
  - marker: b
    text: या “मूर्तियों को चढ़ाया हुआ भोजन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκέλευεν
  choice: उसने ... आदेश दिया
  rationale: यह पद अधिकारपूर्वक आज्ञा देने को व्यक्त करता है। यूनानी अपूर्णकाल जारी या बार-बार दिए जा रहे आदेश का संकेत दे सकता है, किंतु इस प्रसंग में हिन्दी का सामान्य कथात्मक रूप स्वाभाविक है।
- source_word: τοῖς δορυφόροις
  choice: अंगरक्षकों
  rationale: शाब्दिक अर्थ ‘भाला धारण करने वाले’ है, पर यह शब्द शासक के सशस्त्र अंगरक्षकों या पहरेदारों के लिए प्रयुक्त हो सकता है। प्रसंग में ‘अंगरक्षक’ उनकी भूमिका स्पष्ट करता है।
- source_word: ἕνα ἕκαστον τῶν Ἐβραίων
  choice: इब्रानियों में से हर एक को
  rationale: ἕνα ἕκαστον का वितरणात्मक और बलात्मक भाव प्रत्येक व्यक्ति को अलग-अलग लक्ष्य बनाए जाने पर जोर देता है; Ἐβραίων का सीधा रूप ‘इब्रानियों’ रखा गया है।
- source_word: περισπᾶσθαι
  choice: घसीटकर अलग ले जाएँ
  rationale: क्रिया किसी को खींचकर या घसीटकर दूसरों से अलग ले जाने का भाव रखती है। यह अनुवाद बलपूर्वक किए गए व्यवहार और अलगाव, दोनों को व्यक्त करता है।
- source_word: κρεῶν ὑείων
  choice: सूअर का मांस
  rationale: यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा निषिद्ध आहार के आशय को ठीक तरह व्यक्त करता है।
- source_word: εἰδωλοθύτων
  choice: मूर्तियों को बलि चढ़ाया हुआ मांस
  rationale: शब्द मूर्तियों के लिए बलि की गई वस्तुओं को दर्शाता है। κρεῶν के साथ समन्वय और प्रसंग के कारण ‘मांस’ स्पष्ट करना स्वाभाविक है, जबकि व्यापक अर्थ फुटनोट में सुरक्षित है।
- source_word: ἀναγκάζειν
  choice: मजबूर करें
  rationale: यह बलपूर्वक बाध्य करने का सीधा और सहज हिन्दी रूप है।
- source_word: ἀπογεύεσθαι
  choice: चखने के लिए
  rationale: क्रिया विशेष रूप से चखने या थोड़ा ग्रहण करने को व्यक्त कर सकती है। ‘खाने’ के बजाय ‘चखने’ से मूल की सूक्ष्मता और थोड़ी मात्रा से भी धार्मिक उल्लंघन का तनाव बना रहता है।
theological_decisions:
- issue: Ἐβραίων की पहचान
  choice: इब्रानियों
  alternative: यहूदियों
  rationale: मूल यूनानी में स्पष्ट रूप से ‘इब्रानियों’ है। इसे ‘यहूदियों’ से बदलने के बजाय जातीय-ऐतिहासिक शब्दावली सुरक्षित रखी गई है।
- issue: ἀπογεύεσθαι में निषिद्ध भोजन में सहभागिता की मात्रा
  choice: चखने
  alternative: खाने या ग्रहण करने
  rationale: मूल पाठ पूर्ण भोजन करने की अपेक्षा चखने पर जोर दे सकता है। इस रूप को रखने से यह तनाव बना रहता है कि थोड़ी-सी सहभागिता भी विवश धार्मिक उल्लंघन होती।
- issue: εἰδωλοθύτων का दायरा
  choice: मूर्तियों को बलि चढ़ाया हुआ मांस
  alternative: मूर्तियों को चढ़ाया हुआ भोजन
  rationale: तत्काल वाक्य में मांस का प्रसंग इस विशिष्ट रूप का समर्थन करता है, पर यूनानी शब्द का दायरा बलि चढ़ाए गए भोजन तक विस्तृत हो सकता है; इसलिए विकल्प फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘घसीटकर अलग ले जाएँ’ से शारीरिक बल और एक-एक व्यक्ति को अलग किए जाने का भाव सुरक्षित है। सभी फुटनोट-चिह्न मुख्य पाठ में संबंधित शब्द के तुरंत बाद रखे गए हैं।
