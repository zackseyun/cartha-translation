base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/018.yaml
  text: And yet[a], even if our law were not truly divine, as you suppose, though we think it to be divine, even so you would have no right to nullify our honor in matters of piety.
translation:
  language: hi
  text: फिर भी, यदि हमारी व्यवस्था सचमुच ईश्वरीय न होती, जैसा कि तुम मानते हो, यद्यपि हम उसे ईश्वरीय मानते हैं, तो भी तुम्हें हमारी धर्मपरायणता से जुड़ी प्रतिष्ठा[a] को अमान्य ठहराने का अधिकार न होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मपरायणता के कारण हमारी प्रतिष्ठा।” यूनानी वाक्यांश धर्मपरायणता पर आधारित सम्मानजनक स्थान या ख्याति का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοι
  choice: फिर भी
  rationale: यह पद बलपूर्ण रियायती-विरोधी मोड़ लाता है; ‘फिर भी’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατὰ ἀλήθειαν
  choice: सचमुच
  rationale: यह क्रियाविशेषणीय पदबंध ‘वास्तव में’ या ‘सत्यतः’ का अर्थ देता है; ‘सचमुच’ सहज और सटीक है।
- source_word: ὁ νόμος ἡμῶν
  choice: हमारी व्यवस्था
  rationale: संदर्भ यहूदी तोराह का है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित है और केवल सामान्य कानून से अधिक व्यापक आशय रखती है।
- source_word: θεῖος
  choice: ईश्वरीय
  rationale: यह यूनानी विशेषण के ‘divine’ अर्थ को सीधे रखता है और उसे व्याख्यात्मक रूप से ‘परमेश्वर द्वारा दी गई’ नहीं बनाता।
- source_word: ὑπολαμβάνεις
  choice: तुम मानते हो
  rationale: विरोधी के अनुमान या धारणा को सहज हिन्दी में व्यक्त करता है; प्रसंग का हल्का चुनौतीपूर्ण स्वर बना रहता है।
- source_word: νομίζομεν
  choice: हम ... मानते हैं
  rationale: वक्ता के दृढ़ मत को दर्शाता और ὑπολαμβάνεις के साथ शाब्दिक-संरचनात्मक विरोध बनाए रखता है।
- source_word: οὐδὲ οὕτως ἔχων
  choice: तो भी
  rationale: काल्पनिक रियायत के बाद आने वाले निष्कर्ष को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἦν ... ἀκυρῶσαι
  choice: तुम्हें ... मिटा देने का अधिकार न होता
  rationale: यूनानी रचना औचित्य अथवा अधिकार के अभाव का बोध कराती है। ‘अधिकार न होता’ उसके नैतिक-विधिक बल को स्पष्ट रखता है; ‘मिटा देना’ ἀκυρόω के निष्प्रभावी या अमान्य करने के भाव को संदर्भानुकूल व्यक्त करता है।
- source_word: τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν
  choice: परमेश्वर के प्रति हमारी श्रद्धा से प्राप्त सम्मान
  rationale: δόξα यहाँ सम्मानित प्रतिष्ठा और εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा को दर्शाते हैं। यह अनुवाद धार्मिक और सामाजिक दोनों आयाम सुरक्षित रखता है।
theological_decisions:
- issue: व्यवस्था का θεῖος होना
  choice: ‘ईश्वरीय’ रखा गया
  alternative: ‘परमेश्वर से मिली’ अथवा ‘परमेश्वर-प्रदत्त’
  rationale: मूल पाठ व्यवस्था की दिव्य स्थिति के विषय में आलंकारिक रियायत प्रस्तुत करता है। ‘ईश्वरीय’ यूनानी दावे की सीमा को बनाए रखता है और उसमें अधिक विस्तृत सिद्धान्त नहीं जोड़ता।
- issue: εὐσέβεια का अर्थ
  choice: ‘परमेश्वर के प्रति श्रद्धा’
  alternative: ‘भक्ति’, ‘धर्मपरायणता’ अथवा ‘ईश्वरभक्ति’
  rationale: इस ग्रन्थ में εὐσέβεια परमेश्वर के प्रति आदर और उसके अनुरूप निष्ठावान आचरण की प्रमुख सद्गुण-संज्ञा है। चुना हुआ पदबंध आधुनिक पाठक के लिए स्पष्ट है और केवल भावनात्मक भक्ति तक अर्थ को सीमित नहीं करता।
- issue: δόξα का सामाजिक-धार्मिक बल
  choice: ‘श्रद्धा से प्राप्त सम्मान’
  alternative: ‘श्रद्धा के लिए हमारी प्रतिष्ठा’
  rationale: मूल वाक्यांश सम्मान और प्रतिष्ठा दोनों अर्थ दे सकता है। मुख्य पाठ में सम्मान रखा गया है और वैकल्पिक प्रतिष्ठा को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे यूनानी रियायती वाक्य की तर्क-रचना को डैशों से स्पष्ट किया गया है। ‘व्यवस्था’, ‘ईश्वरीय’ और ‘श्रद्धा’ जैसे शब्द धार्मिक संदर्भ बनाए रखते हैं, पर किसी विशिष्ट सम्प्रदाय की शब्दावली नहीं थोपते।
