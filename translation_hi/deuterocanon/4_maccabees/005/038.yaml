  yaml_path: translation/deuterocanon/4_maccabees/005/038.yaml
  text: For you may indeed tyrannize over the ungodly[a], but over my reasonings concerning godliness you will rule neither by words nor by deeds.
translation:
  language: hi
  text: क्योंकि भक्तिहीनों पर तो तू अत्याचारपूर्वक शासन करेगा, पर धर्मपरायणता के विषय में मेरे विवेकपूर्ण विचारों को न तो शब्दों से वश में कर सकेगा, न कार्यों से।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβῶν
  choice: अधर्मियों
  rationale: यह संबंधकारक बहुवचन उन लोगों को दर्शाता है जिन पर अत्याचारी शासन करता है। ‘अधर्मी’ εὐσέβεια के धार्मिक-नैतिक विलोम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τυραννήσεις
  choice: अत्याचारपूर्वक शासन करेगा
  rationale: यह क्रिया निरपेक्ष शासन नहीं, बल्कि अत्याचारी प्रभुत्व व्यक्त करती है। यह अनुवाद उसके दमनकारी भाव को स्पष्ट रखता है।
- source_word: τῶν ... λογισμῶν
  choice: मेरे तर्कपूर्ण विचारों
  rationale: λογισμός इस पुस्तक में विवेकपूर्ण नैतिक चिंतन का प्रमुख शब्द है। ‘तर्कपूर्ण विचार’ साधारण पाठक के लिए बोधगम्य रहते हुए इस वैचारिक अर्थ को सुरक्षित रखता है।
- source_word: περὶ τῆς εὐσεβείας
  choice: परमेश्वर-भक्ति के विषय में
  rationale: εὐσέβεια यहाँ परमेश्वर और उसकी व्यवस्था के प्रति भक्तिपूर्ण निष्ठा दर्शाता है। ‘परमेश्वर-भक्ति’ धार्मिक आशय को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δεσπόσεις
  choice: अधिकार कर सकेगा
  rationale: क्रिया का अर्थ स्वामी बनकर वश में करना है। प्रसंग में बाहरी अत्याचार के विपरीत वक्ता के भीतरी विवेक पर प्रभुत्व की असमर्थता बताई गई है।
- source_word: οὔτε λόγοις ... οὔτε δι᾽ ἔργων
  choice: न तो शब्दों से ... न कामों से
  rationale: यह यूनानी की संतुलित दोहरी नकारात्मक रचना और वाणी तथा कार्य के साधनों का विरोध सुरक्षित रखता है।
theological_decisions:
- issue: ἀσεβῶν और εὐσεβείας के धार्मिक-नैतिक विरोध को सुरक्षित रखना
  choice: अधर्मियों / परमेश्वर-भक्ति
  alternative: भक्तिहीनों / भक्ति; अपवित्र लोगों / धर्मपरायणता
  rationale: चुने हुए शब्द अत्याचारी की बाहरी सत्ता और वक्ता की परमेश्वर के प्रति विवेकपूर्ण निष्ठा के बीच तनाव को स्पष्ट करते हैं, बिना किसी संप्रदायगत अर्थ को जोड़ने के।
- issue: λογισμῶν को केवल भावनात्मक ‘विश्वास’ मानने के बजाय विवेकपूर्ण चिंतन के रूप में रखना
  choice: तर्कपूर्ण विचारों
  alternative: धारणाओं; विवेकपूर्ण निर्णयों
  rationale: 4 मक्काबियों के व्यापक तर्क में λογισμός विवेकशील नैतिक विचार-विमर्श का केंद्रीय पद है; इसलिए इसे केवल ‘विश्वास’ कहना मूल की दार्शनिक धार को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष संबोधन रखा गया है। μὲν ... δέ की विरोधात्मक संरचना ‘तो ... पर’ से और οὔτε ... οὔτε की समानांतरता ‘न तो ... न’ से व्यक्त की गई है।
