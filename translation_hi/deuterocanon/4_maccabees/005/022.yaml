  yaml_path: translation/deuterocanon/4_maccabees/005/022.yaml
  text: But you mock our philosophy[a], as though we did not live in it with blessedness.
translation:
  language: hi
  text: पर तुम हमारे दर्शन का उपहास करते हो, मानो हम उसके अनुरूप विवेकपूर्ण जीवन न जीते हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विवेकपूर्ण’ का अनुवाद ‘सुविचारपूर्वक,’ ‘समझदारी से,’ या ‘सुयुक्ति के साथ’ भी किया जा सकता है। यूनानी εὐλογιστίας एक दुर्लभ संज्ञा है, जिसका यहाँ आशय अच्छे विचार-विवेक या उचित तर्क से है।
    reason: दुर्लभ यूनानी शब्द εὐλογιστίας की वास्तविक अर्थ-सीमा को स्पष्ट करना।
lexical_decisions:
- source_word: χλευάζεις
  choice: उपहास करते हो
  rationale: यह क्रिया हँसी उड़ाने और तिरस्कार करने का भाव व्यक्त करती है; ‘उपहास करना’ सीधे संबोधन की तीक्ष्णता और गरिमा दोनों बनाए रखता है।
- source_word: φιλοσοφίαν
  choice: दर्शन
  rationale: लेखक यहूदी धर्मनिष्ठ, विवेक-संचालित जीवन-पद्धति को सचेत रूप से ‘दर्शन’ कहता है। इसलिए इसे केवल ‘शिक्षा’ या ‘जीवन-पद्धति’ बनाकर उसका आलंकारिक ढाँचा नहीं बदला गया।
- source_word: ὥσπερ
  choice: मानो
  rationale: यह राजा की उस धारणा को असत्य या व्यंग्यात्मक तुलना के रूप में प्रस्तुत करता है; आधुनिक हिन्दी में ‘मानो’ स्वाभाविक है।
- source_word: εὐλογιστίας
  choice: समझ-बूझ के साथ
  rationale: इस दुर्लभ संज्ञा का संबंध उचित विचार, विवेक या युक्तिसंगतता से है। प्रसंग में ‘समझ-बूझ’ लेखक के विवेक-संबंधी विषय को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν αὐτῇ βιούντων
  choice: उसके अनुसार … जीवन जीते
  rationale: शाब्दिक अर्थ ‘उसमें जीवन जीते’ है, पर दर्शन के संदर्भ में हिन्दी का ‘उसके अनुसार जीवन जीना’ उसी आशय को अधिक स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: φιλοσοφία का आशय
  choice: मुख्य पाठ में ‘दर्शन’ बनाए रखा गया
  alternative: हमारी जीवन-पद्धति; हमारी शिक्षा
  rationale: 4 मक्काबियों का लेखक यहूदी धर्मनिष्ठा और विवेकपूर्ण जीवन को दर्शन की श्रेणी में प्रस्तुत करता है। ‘दर्शन’ उसके अपने वैचारिक ढाँचे को सुरक्षित रखता है और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: εὐλογιστίας का अर्थ
  choice: समझ-बूझ के साथ
  alternative: सुविवेक से; युक्तिसंगत ढंग से; आदरपूर्वक/सुखपूर्वक
  rationale: शब्द दुर्लभ है, पर उसका रूप और पुस्तक में विवेक की केंद्रीय भूमिका ‘उचित विचार’ या ‘सुविवेक’ की दिशा में संकेत करती है। इसे ‘धन्यता’ कहना संभव शब्द-संबंधी प्रतिध्वनि पर निर्भर है और इस प्रसंग में तर्क-विवेक के भाव को दबा सकता है; अतः मुख्य पाठ में विवेक का अर्थ रखा गया और वैकल्पिक संभावना पादटिप्पणी में बताई गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘दर्शन’ लेखक की औपचारिक वैचारिक शब्दावली को बनाए रखता है, जबकि ‘समझ-बूझ के साथ जीवन जीना’ सामान्य पाठक के लिए स्वाभाविक है। वाक्य में प्रत्यक्ष संबोधन की कठोरता और तर्कपूर्ण गरिमा दोनों सुरक्षित रखी गई हैं।
