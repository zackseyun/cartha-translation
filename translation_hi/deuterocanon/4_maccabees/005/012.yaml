    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσας
  choice: के आगे झुककर
  rationale: यह एओरिस्ट कृदन्त साधन या परिस्थिति का भाव देता है। प्रसंग में इससे राजा की माँग के प्रति दीनतापूर्वक झुकना या अधीन होना व्यक्त होता है; यह अनुवाद शारीरिक और सम्मानसूचक भाव बनाए रखता है, पर इसे अनिवार्य रूप से धार्मिक ‘आराधना’ नहीं ठहराता।
- source_word: μου
  choice: मेरी
  rationale: यह παρηγορίαν से संबद्ध वक्ता का सीधा संबंधसूचक सर्वनाम है।
- source_word: τὴν φιλάνθρωπον παρηγορίαν
  choice: मेरी इस मानवतापूर्ण समझाइश
  rationale: φιλάνθρωπος का अर्थ मनुष्यों के प्रति दयालु या मानवतापूर्ण है, जबकि παρηγορία यहाँ सांत्वना से अधिक समझाने-बुझाने वाली अपील है। ‘मानवतापूर्ण’ राजा की अपनी प्रस्तुति को दर्शाता है, उसे वस्तुतः दयालु घोषित नहीं करता।
- source_word: οἰκτειρήσεις
  choice: दया करोगे
  rationale: भविष्यत्कालीन क्रिया का मूल अर्थ दया या करुणा करना है। अपने ही बुढ़ापे के संदर्भ में यह स्वयं को बचाने की अपील व्यक्त करती है।
- source_word: τὸ σεαυτοῦ γῆρας
  choice: अपने बुढ़ापे पर
  rationale: γῆρας का स्वाभाविक हिन्दी रूप ‘बुढ़ापा’ है और σεαυτοῦ का आत्मवाचक बल ‘अपने’ से सुरक्षित रहता है।
theological_decisions:
- issue: प्रसंग में προσκυνέω का बल
  choice: के आगे झुककर
  alternative: दण्डवत करके; सम्मान प्रकट करके; आराधना करके
  rationale: क्रिया दण्डवत होने, अधीनता या सम्मान प्रकट करने और धार्मिक संदर्भ में आराधना करने तक का अर्थ रख सकती है। वाक्य में इसका संबंध राजा की ‘समझाइश’ स्वीकार करने से है, इसलिए ‘झुककर’ सर्वाधिक स्वाभाविक है; फिर भी जबरन धर्मत्याग के व्यापक प्रसंग में आराधना का भाव संभव है, जिसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘मानवतापूर्ण’ वक्ता के आत्मवर्णन की विडंबना बनाए रखता है, और ‘समझाइश’ παρηγορία के प्रेरक या मनाने वाले भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
