  text: But when many had been seized, one man, first from the flock, a Hebrew named Eleazar, a priest by birth, trained in the law in knowledge, advanced in age, and known to many around the tyrant because of his age, opened his mouth.
translation:
  language: hi
  text: परन्तु जब बहुत-से लोग पकड़ लिए गए, तब उस झुंड[a] में से सबसे पहले एलीआज़र नामक एक इब्रानी ने अपना मुँह खोला। वह याजकीय वंश का, व्यवस्था का विद्वान[b], बहुत वृद्ध था, और उसकी आयु के कारण तानाशाह के निकट रहने वाले बहुत-से लोग उसे जानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समूह।” यूनानी में शाब्दिक अर्थ “झुंड” है, जो यहाँ इब्रानियों के समुदाय के लिए रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या “व्यवस्था में निपुण।” यूनानी शब्द व्यवस्था-विषयक विद्वत्ता को सूचित करता है, आधुनिक अर्थ में पेशेवर वकील को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: συναρπασθέντων
  choice: पकड़ लिए गए
  rationale: यह बलपूर्वक पकड़े जाने का भाव व्यक्त करता है, पर पकड़ने के ढंग के बारे में मूल से अधिक विवरण नहीं जोड़ता।
- source_word: ἀγέλης
  choice: झुंड
  rationale: मूल यूनानी का शाब्दिक रूपक सुरक्षित रहता है; यहाँ यह पकड़े गए इब्रानियों के समुदाय के लिए प्रयुक्त है।
- source_word: Ἑβραῖος
  choice: इब्रानी
  rationale: मूल में स्पष्ट रूप से ‘इब्रानी’ है; ‘यहूदी’ या ‘इस्राएली’ कहना अधिक व्याख्यात्मक होता।
- source_word: τὸ γένος ἱερεύς
  choice: जन्म से याजक
  rationale: यह उसके याजकीय वंश या कुल को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν ἐπιστήμην νομικός
  choice: व्यवस्था का ज्ञाता
  rationale: यह व्यवस्था-विषयक विद्वत्ता को व्यक्त करता है और आधुनिक पेशेवर ‘वकील’ का भ्रामक अर्थ नहीं लाता।
- source_word: τὴν ἡλικίαν προήκων
  choice: बहुत वृद्ध
  rationale: वाक्यांश आयु में बहुत आगे बढ़े होने को बताता है; यह आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: πολλοῖς τῶν περὶ τὸν τύραννον
  choice: अत्याचारी के आस-पास के बहुत-से लोग
  rationale: यह शासक के निकटवर्ती लोगों या उसके मंडल का अर्थ देता है और यूनानी संरचना के निकट रहता है।
- source_word: γνώριμος
  choice: उसे जानते थे
  rationale: सक्रिय हिन्दी वाक्य मूल के ‘परिचित/ज्ञात’ होने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἠνῴχετο τὸ στόμιον αὐτοῦ
  choice: उसने अपना मुँह खोला
  rationale: यह बोलना आरम्भ करने की मूल अलंकारिक और गंभीर अभिव्यक्ति को सुरक्षित रखता है।
