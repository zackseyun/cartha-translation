    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἑκατέρου
  choice: दोनों में से प्रत्येक के द्वारा
  rationale: ἑκάτερος विशेष रूप से दो व्यक्तियों या वस्तुओं में से प्रत्येक को सूचित करता है; यह रूप यूनानी के वितरणात्मक अर्थ और διά के माध्यम-सूचक भाव, दोनों को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछली बात का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: ὡς ὁμοίως
  choice: समान रूप से
  rationale: यह पदबंध समानता पर बल देता है; ‘समान रूप से’ उसका संक्षिप्त और सहज हिन्दी रूप है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: संदर्भ में νόμος यहूदी व्यवस्था अर्थात तोराह को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ इसका परिचित और उपयुक्त अनुवाद है।
- source_word: ὑπερηφανεῖται
  choice: गर्व करती है
  rationale: क्रिया गर्व करने या गौरव अनुभव करने का भाव व्यक्त करती है। स्त्रीलिंग ‘व्यवस्था’ के साथ यह सजीव मानवीकरण को स्पष्ट रूप से बनाए रखती है।
theological_decisions:
- issue: व्यवस्था का मानवीकरण
  choice: ‘व्यवस्था ... गर्व करती है’ के रूप में मानवीकरण को बनाए रखा गया है।
  alternative: ‘दोनों के द्वारा व्यवस्था का समान रूप से सम्मान होता है।’
  rationale: यूनानी पाठ व्यवस्था को सीधे गर्व करने वाली के रूप में प्रस्तुत करता है। इसे निष्क्रिय ‘सम्मान होता है’ में बदलना मूल की अलंकारिक और वैचारिक तीव्रता को कम कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य संक्षिप्त, गरिमापूर्ण और मूल यूनानी की मानवीकृत अभिव्यक्ति के निकट रखा गया है; ‘दोनों में से प्रत्येक’ दो के वितरणात्मक संदर्भ को स्पष्ट करता है।
