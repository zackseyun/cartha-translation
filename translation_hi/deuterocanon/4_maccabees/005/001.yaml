lexical_decisions:
- source_word: Προκαθίσας
  choice: आसन ग्रहण करके बैठा
  rationale: यह कृदंत अन्तियोकुस को अधिकारपूर्ण ढंग से पहले से बैठे हुए दिखाता है। ‘आसन ग्रहण करके बैठा’ दृश्य और उसकी औपचारिकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γέ τοι
  choice: तब
  rationale: ये अव्यय प्रसंग को आगे बढ़ाते हुए हल्का बल देते हैं। हिन्दी में ‘तब’ इस संक्रमण को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: μετὰ τῶν συνέδρων
  choice: अपने सभासदों के साथ
  rationale: σύνεδροι परिषद में साथ बैठने वाले सदस्य हैं। ‘सभासद’ एक औपचारिक किंतु सहज आधुनिक हिन्दी शब्द है और उन्हें केवल निजी सलाहकार नहीं बनाता।
- source_word: ὁ τύραννος
  choice: अत्याचारी
  rationale: मूल यूनानी पद अन्तियोकुस के लिए स्पष्टतः नकारात्मक और मूल्यांकनात्मक है। ‘अत्याचारी’ इस भाव को बनाए रखता है, जबकि ‘राजा’ या ‘शासक’ उसे अनुचित रूप से तटस्थ कर देते।
- source_word: ἐπὶ τινος ὑψηλοῦ τόπου
  choice: किसी ऊँचे स्थान पर
  rationale: τινος की अनिश्चितता और ὑψηλοῦ τόπου की ऊँचाई दोनों सीधे व्यक्त होती हैं। यह अनुवाद किसी धार्मिक ‘ऊँचे स्थान’ का अर्थ आरोपित नहीं करता।
- source_word: τῶν στρατευμάτων αὐτῶν
  choice: उनके सैनिक-दल
  rationale: στρατεύματα बहुवचन में संगठित सैन्य टुकड़ियों को दर्शाता है। αὐτῶν के बहुवचन को ‘उनके’ द्वारा सुरक्षित रखा गया है, उसे चुपचाप केवल अन्तियोकुस का नहीं बनाया गया।
- source_word: παρεστηκότων
  choice: खड़े थे
  rationale: यह कृदंत सैनिक-दलों की वहाँ उपस्थित, खड़ी हुई अवस्था का दृश्य प्रस्तुत करता है।
- source_word: κυκλόθεν
  choice: चारों ओर
  rationale: यह चारों तरफ से घेरे होने का बोध संक्षिप्त और स्वाभाविक हिन्दी में देता है।
- source_word: εὐόπλων
  choice: पूरी तरह हथियारबंद
  rationale: यह सैनिक-दलों के युद्ध के लिए भली-भाँति सुसज्जित होने और दृश्य के धमकीपूर्ण वातावरण को स्पष्ट करता है।
theological_decisions:
- issue: τύραννος में अन्तियोकुस के प्रति लेखक का मूल्यांकन
  choice: मुख्य पाठ में नकारात्मक पद ‘अत्याचारी’ रखा गया
  alternative: ‘शासक’ या ‘राजा’
  rationale: मूल पाठ तटस्थ राजकीय उपाधि नहीं, बल्कि नैतिक रूप से निंदात्मक संबोधन प्रयोग करता है। इसे बनाए रखना लेखक की वाणी को सुरक्षित रखता है और पाठ से बाहर की कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। पद के अंत में अल्पविराम रखा गया है, क्योंकि यूनानी वाक्य अगले पद में जारी रहता है। ‘अन्तियोकुस’ प्रचलित हिन्दी बाइबलीय लिप्यंतरण है; ‘सभासद’ औपचारिक परिषद का भाव देता है।
