  text: तब अत्याचारी अन्तियोकुस अपने सभासदों के साथ किसी ऊँचे स्थान[a] पर आसन ग्रहण करके बैठा, और उनके पूरी तरह हथियारबंद सैनिक-दल चारों ओर खड़े थे,
