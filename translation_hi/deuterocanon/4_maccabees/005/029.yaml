translation:
  language: hi
  text: और मैं व्यवस्था का पालन करने के विषय में पूर्वजों की पवित्र शपथों की भी उपेक्षा नहीं करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूर्वजों’ के लिए ‘पितरों’ का अनुवाद भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε
  choice: की भी ... नहीं
  rationale: यह पहले से चली आ रही निषेधात्मक शृंखला को जोड़ता है; हिन्दी में ‘भी ... नहीं’ स्वाभाविक रूप से ‘न ही’ का भाव देता है।
- source_word: ἱεροὺς
  choice: पवित्र
  rationale: शपथों की धार्मिक पवित्रता और गंभीरता को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν προγόνων
  choice: पूर्वजों की
  rationale: πρόγονοι का सामान्य अर्थ पूर्वज है। यूनानी में यहाँ ‘हमारे’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: περὶ τοῦ φυλάξαι τὸν νόμον
  choice: व्यवस्था का पालन करने के विषय में
  rationale: περί के साथ प्रयुक्त क्रियार्थक संज्ञा शपथों की विषयवस्तु बताती है; यह रूप उस संबंध को स्पष्ट रखता है और φυλάσσω के आज्ञापालन-संबंधी अर्थ को सुरक्षित रखता है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यह यहूदी धार्मिक व्यवस्था, अर्थात तोराह, की ओर संकेत करता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में सुबोध है, जबकि मूल पाठ स्वयं विशिष्ट नाम या अतिरिक्त विशेषण नहीं जोड़ता।
- source_word: ὅρκους
  choice: शपथों
  rationale: ὅρκος विधिवत और गंभीर शपथ को दर्शाता है, केवल सामान्य प्रतिज्ञा को नहीं।
- source_word: οὐ παρήσω
  choice: उपेक्षा नहीं करूँगा
  rationale: παρίημι यहाँ अनदेखा करने या महत्त्व न देने के अर्थ में है; ‘उपेक्षा’ शपथों के साथ स्वाभाविक है और ‘त्याग दूँगा’ जैसी अधिक प्रबल व्याख्या से बचती है।
theological_decisions:
- issue: τῶν προγόνων में पैतृक/पूर्वज-संबंधी भाषा
  choice: पूर्वजों की
  alternative: पितरों की
  rationale: πρόγονοι वंशगत पूर्वजों को दर्शाता है। आधुनिक हिन्दी में ‘पूर्वज’ स्वाभाविक और अर्थ-सटीक है; ‘पितर’ संभव है, पर वह अनावश्यक रूप से पुरातन या विशेष धार्मिक अर्थ ग्रहण कर सकता है।
- issue: τὸν νόμον का संदर्भ
  choice: व्यवस्था
  alternative: व्यवस्था अर्थात यहूदी पैतृक व्यवस्था/तोराह
  rationale: संदर्भ यहूदी व्यवस्था की ओर संकेत करता है, पर मुख्य पाठ में मूल की संक्षिप्तता बनाए रखी गई है और ‘तोराह’ जैसी व्याख्यात्मक स्पष्टता नहीं जोड़ी गई।
- issue: शपथों और व्यवस्था-पालन का संबंध
  choice: व्यवस्था का पालन करने के विषय में ... शपथों
  alternative: व्यवस्था का पालन करने की ... शपथों
  rationale: περὶ τοῦ φυλάξαι शपथों की विषयवस्तु या संबंध को व्यक्त करता है। ‘के विषय में’ इस संबंध की हल्की अस्पष्टता बचाता है; केवल ‘पालन करने की’ शपथों को स्वयं पूर्वजों द्वारा खाई गई प्रतिज्ञाओं के रूप में कुछ अधिक निश्चित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। वाक्य को पूर्ववर्ती निषेधात्मक क्रम से जोड़ने के लिए आरंभ में ‘और’ तथा ‘भी ... नहीं’ रखा गया है।
