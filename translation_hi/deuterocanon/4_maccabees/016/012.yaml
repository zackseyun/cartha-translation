review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains both coordinated negations, the mother as the implied feminine subject, the partitive sense of 'any of them,' the purposive clause, and the contemporaneous sense of the genitive absolute. However, 'पीछे हटाने' can suggest physically moving someone backward and does not clearly convey ἀποτρέπω here, namely attempting to dissuade someone from a chosen course.
  naturalness: The sentence is broadly intelligible, but 'इसलिए पीछे हटाने' is awkward Hindi, and 'शोकित हुई' is somewhat bookish. 'इस उद्देश्य से ... विमुख करने' expresses the purpose and deterrent sense more clearly; 'उसे दुःख हुआ' is natural modern standard Hindi while retaining the stated grief/sorrow without specifying an outward act of mourning.
  terminology: No doctrinal terminology is involved. The revised wording avoids importing an explanation of the mother's motives or inner psychology beyond the Greek statement.
  issues:
  - severity: medium
    issue: ‘पीछे हटाने’ is semantically underspecified for ἀπέτρεπεν.
    rationale: In this context the verb means trying to turn/dissuade someone from their course, not merely making them move back. ‘विमुख करने’ communicates this sense without implying that she succeeded.
  - severity: low
    issue: ‘इसलिए ... कि’ is less idiomatic for the purposive construction in this sentence.
    rationale: ‘इस उद्देश्य से ... कि’ gives the ἵνα purpose clause clearly and naturally.
  - severity: low
    issue: ‘शोकित हुई’ is unnecessarily formal in modern standard Hindi.
    rationale: ‘उसे दुःख हुआ’ naturally conveys ἐλυπήθη and does not narrow it to formal mourning or visible lament.
  revised_text: न तो उसने उनमें से किसी को भी इस उद्देश्य से विमुख करने का प्रयत्न किया कि वह न मरे, और न ही उनके मरते समय उसे दुःख हुआ।
  revised_footnotes: []
  revision_rationale: The revision clarifies the contextual deterrent sense of ἀπέτρεπεν, preserves the distributive singular implied by ‘किसी’ and the Greek purpose clause, and renders the contemporaneous grief clause in idiomatic modern Hindi. It adds no theological or psychological interpretation.
