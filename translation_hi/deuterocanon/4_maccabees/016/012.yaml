  text: Nor did she try to turn any of them away so that they might not die, nor did she grieve as they were dying.
translation:
  language: hi
  text: न तो उसने उनमें से किसी को भी इस उद्देश्य से विमुख करने का प्रयत्न किया कि वह न मरे, और न ही उनके मरते समय उसे दुःख हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέτρεπεν
  choice: पीछे हटाने का प्रयत्न नहीं किया
  rationale: यह क्रिया किसी को उसके मार्ग या निश्चय से विमुख करने का भाव रखती है। अपूर्ण भूतकाल जारी या बार-बार किए जाने वाले प्रयास की गुंजाइश देता है; इसलिए यह अनुवाद सफलतापूर्वक रोक देने का अर्थ नहीं थोपता।
- source_word: αὐτῶν τινα
  choice: उनमें से किसी को भी
  rationale: अंशवाचक अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और प्रत्येक पुत्र के संबंध में निषेध का वितरणात्मक बल बनाए रखता है।
- source_word: ἵνα μὴ ἀποθάνωσιν
  choice: इसलिए ... कि वह मर न जाए
  rationale: ἵνα-वाक्य उद्देश्य व्यक्त करता है। एकवचन ‘वह’ का संबंध ‘किसी’ से है और यूनानी बहुवचन के वितरणात्मक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλυπήθη
  choice: शोकित हुई
  rationale: क्रिया गहरे दुःख या संताप को व्यक्त करती है। ‘शोकित हुई’ गरिमापूर्ण और बोधगम्य है, पर मृत्यु के बाद औपचारिक विलाप का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ὡς ἀποθνῃσκόντων
  choice: उनके मरते समय
  rationale: संबंधकारक निरपेक्ष रचना मुख्य क्रिया के समकालीन परिस्थिति को बताती है; वर्तमान कृदन्त की जारी प्रक्रिया हिन्दी में ‘मरते समय’ से स्पष्ट होती है।
theological_decisions:
- issue: निहित कर्ता का संदर्भ
  choice: स्त्रीलिंग ‘उसने/वह’ द्वारा निकटवर्ती प्रसंग की माता को कर्ता बनाया गया है।
  alternative: कर्ता को यथासंभव निहित छोड़ना।
  rationale: यूनानी में कर्ता निहित है, पर प्रसंग माता की पहचान करता है। हिन्दी क्रिया का स्त्रीलिंग रूप इसे स्वाभाविक ढंग से स्पष्ट करता है और नया आशय नहीं जोड़ता।
- issue: माता के शोकित न होने का कथन
  choice: कथन को बिना मनोवैज्ञानिक या धार्मिक व्याख्या जोड़े सीधे रखा गया है।
  alternative: इसे दुःख की पूर्ण अनुपस्थिति, भावनात्मक कठोरता, या केवल बाहरी विलाप न करने के रूप में स्पष्ट करना।
  rationale: ἐλυπήθη दुःख का कथन करता है, पर पद स्वयं उसके भीतरी भाव और बाहरी अभिव्यक्ति के बीच कोई विशिष्ट भेद नहीं करता; इसलिए तनाव को अनिर्णीत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण वाक्य-विन्यास। ‘और न’ से यूनानी के दोहरे οὐδέ का समानांतर निषेध सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं है।
