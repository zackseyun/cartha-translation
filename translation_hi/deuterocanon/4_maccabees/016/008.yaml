  verdict: revise
  source_fidelity: The draft accurately conveys the maternal address, childbirth pains, endurance, and the comparative burden of childrearing. However, the Greek is a declarative lament ("I endured"), not an explicit rhetorical question. Rendering it as a question adds a discourse form not marked in the source. Also, πολλὰς is better represented by “बहुत-सी/अनेक” than the contextually intensified “इतनी.”
  naturalness: The proposed declarative wording is natural, solemn modern standard Hindi. “प्रसव-वेदनाएँ” and “पालन-पोषण” suit the elevated lament while remaining clear.
  terminology: “हे बच्चो,” appropriately retains the direct collective address without specifying sons. “प्रसव-वेदनाएँ,” “चिंताएँ,” and “पालन-पोषण” faithfully represent ὠδῖνας, φροντίδας, and ἀνατροφῆς. “उनसे भी अधिक कष्टदायक” clearly retains the comparative force of χαλεπωτέρας.
  issues:
  - severity: medium
    issue: The main text recasts a declarative statement as a rhetorical question.
    rationale: 'μάτην ... ὑπέμεινα is grammatically a direct assertion: “In vain ... I endured.” The source''s lamenting force can be preserved in Hindi without adding interrogative syntax.'
  - severity: low
    issue: “इतनी” is less precise than a direct quantifier for πολλὰς.
    rationale: πολλὰς means “many”; “बहुत-सी” preserves this quantity without adding the demonstrative/intensifying nuance of “so many.”
  - severity: medium
    issue: The footnote presents the source-shaped declarative as merely an alternative to the interrogative main text.
    rationale: Since the declarative is the source form, it should be in the main text; the footnote should instead give a genuine lexical alternative.
