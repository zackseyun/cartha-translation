    text: या, “... अनेक प्रसव-वेदनाएँ और तुम्हारे पालन-पोषण की उनसे भी अधिक कठिन चिंताएँ व्यर्थ ही सहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μάτην
  choice: व्यर्थ ही
  rationale: यह क्रियाविशेषण निष्फलता का भाव व्यक्त करता है; माँ के शोकपूर्ण आलंकारिक प्रश्न में यह स्वाभाविक और प्रभावशाली है।
- source_word: ἐφʼ ὑμῖν
  choice: तुम्हारे लिए
  rationale: यह बच्चों के संबंध में और उनके कारण सही गई पीड़ा को व्यक्त करता है; हिंदी में ‘तुम्हारे लिए’ मातृ-संदर्भ में सहज है।
- source_word: ὦ παῖδες
  choice: हे बच्चो
  rationale: παῖδες यहाँ संबोधित संतानों को दर्शाता है। ‘बच्चो’ लिंग को अनावश्यक रूप से सीमित किए बिना प्रत्यक्ष संबोधन बनाए रखता है।
- source_word: πολλὰς ... ὠδῖνας
  choice: प्रसव की इतनी पीड़ाएँ
  rationale: ὠδῖνας प्रसव-वेदनाओं का ठोस मातृ-चित्र प्रस्तुत करता है; πολλὰς को हिंदी के स्वाभाविक विलाप में ‘इतनी’ से व्यक्त किया गया है।
- source_word: ὑπέμεινα
  choice: सहीं
  rationale: क्रिया धीरज से सहने का अर्थ देती है। हिंदी में स्त्री वक्ता के अनुरूप ‘सहीं’ रखा गया है।
- source_word: χαλεπωτέρας
  choice: उनसे भी अधिक कठिन
  rationale: तुलनात्मक अर्थ स्पष्ट करता है कि पालन-पोषण की चिंताएँ प्रसव-पीड़ाओं से भी अधिक कठिन थीं।
- source_word: φροντίδας
  choice: चिंताएँ
  rationale: यह देखभाल से जुड़ी मानसिक चिंता और बोझ दोनों को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἀνατροφῆς
  choice: पालन-पोषण की
  rationale: यह बच्चों को बड़ा करने और सँभालने की पूरी प्रक्रिया का प्रचलित तथा गरिमापूर्ण हिंदी पद है।
