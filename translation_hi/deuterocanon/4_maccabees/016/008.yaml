  text: In vain[a], O children, did I endure many birth pains for you, and the more grievous anxieties of raising you.
translation:
  language: hi
  text: हे बच्चो, मैंने तुम्हारे लिए बहुत-सी प्रसव-वेदनाएँ और तुम्हारे पालन-पोषण की उनसे भी अधिक कष्टदायक चिंताएँ व्यर्थ ही सहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
