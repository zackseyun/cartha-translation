  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सजीव रखी गई है। ‘वध’, ‘पैतृक’ और ‘तलवारधारी’ मूल की ऊँची, नाटकीय शैली सँभालते हैं; दूसरे खंड में ‘इसहाक’ की पुनरावृत्ति हिन्दी में कर्ता की संभावित उलझन दूर करती है।
