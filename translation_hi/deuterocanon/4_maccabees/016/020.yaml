  text: for whose sake even our father Abraham hurried to slaughter Isaac[a], his son, the ancestor of the nation, and, seeing the ancestral hand bearing the sword descending upon him[b], did not shrink back.
translation:
  language: hi
  text: जिसके लिए हमारे पिता अब्राहम ने भी अपने पुत्र इसहाक को—जो इस जाति का पूर्वज था[a]—वध करने में शीघ्रता दिखाई; और इसहाक अपने पिता का तलवार लिए हाथ अपने ऊपर उतरता देखकर भी भय से पीछे नहीं हटा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो इस जाति का जनक बनने वाला था।” यूनानी समास ἐθνοπάτωρ किसी जाति या प्रजा के पूर्वज अथवा मूल जनक को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “दुबका नहीं” अथवा “भय से काँपा नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὃν
  choice: जिसके कारण
  rationale: संबंधवाचक पद कारण या प्रेरक आधार बताता है और उसका पूर्वपद पिछले संदर्भ में रहने देता है; उसे पाठ में स्पष्ट करके अस्पष्टता मिटाई नहीं गई।
- source_word: ἔσπευδεν
  choice: शीघ्रता की
  rationale: क्रिया में तत्परता और तेजी, दोनों का भाव है। यह हिन्दी में स्वाभाविक रहते हुए यूनानी की तीव्रता बनाए रखता है।
- source_word: σφαγιάσαι
  choice: वध करने
  rationale: यह सामान्यतः मारने से अधिक प्रबल और बलि-वध से जुड़ा शब्द है। ‘बलि चढ़ाने’ से परिचित उत्पत्ति-वृत्तांत की शब्दावली आरोपित होती, जबकि ‘काट डालने’ से शैली अनावश्यक रूप से कठोर होती।
- source_word: τὸν ἐθνοπάτορα υἱὸν ... Ἰσαάκ
  choice: अपने पुत्र इसहाक को—जो इस जाति का पूर्वज था
  rationale: ἐθνοπάτωρ इसहाक को किसी जाति या प्रजा का जनक/पूर्वज बताता है। संबंध स्पष्ट करने के लिए हिन्दी में व्याख्यात्मक उपवाक्य आवश्यक है।
- source_word: πατρῴαν χεῖρα
  choice: पैतृक हाथ
  rationale: πατρῷος का अर्थ पितृ-संबंधी अथवा पूर्वजों से जुड़ा हो सकता है। प्रसंग में यह इसहाक के पिता अब्राहम का हाथ है, पर ऊँची आलंकारिक शैली बनाए रखने के लिए ‘पैतृक’ रखा गया।
- source_word: ξιφηφόρον
  choice: तलवारधारी
  rationale: समास का शाब्दिक अर्थ ‘तलवार धारण किए हुए’ है। ‘तलवारधारी’ संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: καταφερομένην ἐπʼ αὐτόν
  choice: अपने ऊपर ... नीचे आते
  rationale: वर्तमान कृदंत इसहाक की ओर नीचे लाए जा रहे हाथ का सजीव दृश्य प्रस्तुत करता है; अनुवाद उस गतिशीलता को बनाए रखता है।
- source_word: οὐκ ἔπτηξεν
  choice: भय से पीछे नहीं हटा
  rationale: क्रिया भयभीत होकर सिकुड़ने, दुबकने या पीछे हटने का भाव देती है। यह चयन भीतरी भय और बाहरी प्रतिक्रिया दोनों को व्यक्त करता है।
theological_decisions:
- issue: अब्राहम और इसहाक के प्रसंग को उत्पत्ति की परिचित बलिदान-शब्दावली से प्रस्तुत करना या यूनानी की कठोर अभिव्यक्ति बनाए रखना
  choice: ‘वध करने में शीघ्रता की’
  alternative: ‘बलि चढ़ाने को तत्पर हुए’ अथवा ‘अर्पित करने की तैयारी की’
  rationale: मूल क्रिया हिंसक और बलि-वध संबंधी है। नरम या परिचित धर्मशास्त्रीय अभिव्यक्ति लेखक की जानबूझकर रखी गई नाटकीय तीव्रता घटा देती।
- issue: διʼ ὃν के पूर्वपद की पहचान
  choice: ‘जिसके कारण’ कहकर पूर्वपद को संदर्भ पर निर्भर रहने देना
  alternative: पिछले संदर्भ से किसी व्यक्ति, सिद्धांत या सद्गुण का नाम जोड़ देना
  rationale: यूनानी वाक्य स्वयं पूर्वपद को नामित नहीं करता। उसे स्पष्ट करना वास्तविक संदर्भगत अस्पष्टता को अनावश्यक रूप से सुलझा देता।
- issue: οὐκ ἔπτηξεν का कर्ता हिन्दी में स्पष्ट करना
  choice: दूसरे खंड में ‘इसहाक’ दोहराना
  alternative: व्याकरणिक कर्ता को निहित छोड़कर ऐसा हिन्दी वाक्य बनाना जिसमें अब्राहम को कर्ता समझा जा सकता हो
  rationale: यूनानी में अर्थतः इसहाक ही अपने ऊपर हाथ आते देखता और नहीं घबराता है। हिन्दी में नाम दोहराने से केवल वाक्य-संबंध स्पष्ट होता है, कोई नया धर्मशास्त्रीय दावा नहीं जुड़ता।
