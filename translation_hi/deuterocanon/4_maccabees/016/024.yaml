  text: By these words the mother of seven[a], encouraging each one of her sons, persuaded them rather to die than to transgress the commandment of God[b];
translation:
  language: hi
  text: इन शब्दों से[a] सात पुत्रों की माँ[b] ने अपने एक-एक पुत्र को प्रोत्साहित करके परमेश्वर की आज्ञा का उल्लंघन करने के बजाय मर जाने के लिए राज़ी किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन शब्दों के माध्यम से।” यूनानी पदबंध साधन या माध्यम का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अक्षरशः, “सात की माँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τούτων τῶν λόγων
  choice: इन बातों के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ साधन या माध्यम व्यक्त करता है। ‘इन बातों के द्वारा’ इस अर्थ को स्पष्ट रखता है; ‘इन शब्दों के द्वारा’ अधिक अक्षरशः विकल्प है।
- source_word: ἡ ἑπτάμητωρ
  choice: सात पुत्रों की माँ
  rationale: यह समास अक्षरशः ‘सात की माँ’ को दर्शाता है। आधुनिक हिन्दी में स्वाभाविक स्पष्टता के लिए ‘पुत्रों’ कहा गया है, जिसकी पुष्टि अगले ही पदबंध τῶν υἱῶν से होती है।
- source_word: ἕνα ἕκαστον τῶν υἱῶν
  choice: अपने एक-एक पुत्र को
  rationale: ἕνα ἕκαστον का वितरणात्मक और बलयुक्त अर्थ ‘एक-एक’ से सुरक्षित रहता है। विषय माँ होने के कारण ‘अपने’ हिन्दी में स्वाभाविक संबंध स्पष्ट करता है।
- source_word: παρακαλοῦσα
  choice: प्रोत्साहित करते हुए
  rationale: संदर्भ में क्रिया का अर्थ केवल आग्रह करना नहीं, बल्कि यातना के सामने दृढ़ बने रहने के लिए उत्साह और साहस देना भी है।
- source_word: ἔπεισε
  choice: राज़ी कर लिया
  rationale: πείθω मनाने या सहमत कराने को व्यक्त करता है। ‘राज़ी कर लिया’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया के सफल परिणाम को बनाए रखता है।
- source_word: μᾶλλον ἀποθανεῖν, ἢ παραβῆναι
  choice: उल्लंघन करने के बजाय मर जाने
  rationale: μᾶλλον … ἢ की तुलना में आज्ञा-भंग के ऊपर मृत्यु को चुनने का भाव है। ‘के बजाय’ इस विकल्प को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: परमेश्वर की आज्ञा
  rationale: ἐντολή के धार्मिक और नैतिक अर्थ के लिए ‘आज्ञा’ स्वाभाविक तथा गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: ἑπτάμητωρ में पुत्रों का स्पष्ट उल्लेख
  choice: सात पुत्रों की माँ
  alternative: सात की माँ
  rationale: यूनानी समास स्वयं संक्षिप्त है, पर अगला पदबंध स्पष्टतः पुत्रों का उल्लेख करता है। हिन्दी में अस्पष्ट या अस्वाभाविक अभिव्यक्ति से बचते हुए ‘पुत्रों’ मुख्य पाठ में रखा गया और अक्षरशः रूप पादटिप्पणी में दिया गया।
- issue: παραβῆναι τὴν ἐντολὴν τοῦ θεοῦ का नैतिक-विधिक स्वर
  choice: परमेश्वर की आज्ञा का उल्लंघन करना
  alternative: परमेश्वर की आज्ञा तोड़ना
  rationale: ‘उल्लंघन’ मूल क्रिया की नैतिक और विधिक गंभीरता बनाए रखता है, बिना कोई अतिरिक्त सांप्रदायिक अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘माँ’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘उल्लंघन’ ईश्वरीय आज्ञा के संदर्भ की गरिमा और गंभीरता बनाए रखता है।
