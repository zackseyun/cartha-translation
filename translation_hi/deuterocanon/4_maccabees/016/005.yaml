  text: 'For consider this also: if the woman had been fainthearted, though she was a mother, she would have wailed over them; and perhaps she would have spoken like this:'
translation:
  language: hi
  text: 'इस पर भी विचार करो: यदि वह स्त्री भीरु होती, तो वह, माँ होते हुए भी, उनका विलाप करती; और शायद वह इस प्रकार कहती:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλογίσασθαι
  choice: विचार करो
  rationale: यह क्रिया श्रोताओं के सामने एक और बात सोचने के लिए रखती है। हिन्दी में ‘विचार करो’ स्वाभाविक है और इसके आह्वानात्मक बल को बनाए रखता है।
- source_word: δειλόψυχος
  choice: कायर मन की
  rationale: यह संयुक्त विशेषण साहस या मनोबल की कमी दर्शाता है। ‘कायर मन की’ नैतिक-मनोवैज्ञानिक अर्थ को व्यक्त करता है और केवल क्षणिक भय से अधिक स्थायी मनोदशा का संकेत देता है।
- source_word: γυνή
  choice: वह स्त्री
  rationale: यहाँ शब्द का अर्थ ‘स्त्री’ है; अगले पदबंध में उसे अलग से माँ कहा गया है। ‘माँ’ अनुवाद करने से μήτηρ οὖσα का विशेष बल दब जाता।
- source_word: καίπερ μήτηρ οὖσα
  choice: माँ होते हुए भी
  rationale: καίπερ की रियायती भावना को स्पष्ट रखते हुए यह स्वाभाविक हिन्दी में मातृत्व और कल्पित कायरता के बीच के तनाव को सुरक्षित रखता है।
- source_word: ὠλοφύρετο
  choice: विलाप करती
  rationale: क्रिया शोक की मुखर अभिव्यक्ति बताती है। ‘विलाप करती’ गरिमापूर्ण और सामान्यतः समझ में आने वाला हिन्दी प्रयोग है।
- source_word: ἐπʼ αὐτοῖς
  choice: उनके लिए
  rationale: संदर्भ में यह उसके पुत्रों को लेकर किए गए विलाप का संकेत है। ‘उनके लिए’ हिन्दी में स्वाभाविक है और संबंध को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: ἴσως
  choice: शायद
  rationale: यह कल्पित कथन को अनिश्चित और संभाव्य रूप में प्रस्तुत करता है; ‘शायद’ उसी संयमित भाव को बनाए रखता है।
- source_word: ταῦτα οὕτως εἶπεν
  choice: वह इस प्रकार कहती
  rationale: यह आगे आने वाली कल्पित वाणी का परिचय देता है। ‘इस प्रकार कहती’ आधुनिक, गरिमापूर्ण और स्पष्ट हिन्दी है।
theological_decisions:
- issue: मातृभाव और धैर्यपूर्ण साहस के बीच रियायती तनाव
  choice: 'वाक्य को एक कल्पित विरोध के रूप में रखा गया है: यदि वह कायर मन की होती, तो माँ होते हुए भी विलाप करती।'
  alternative: अधिक व्याख्यात्मक रूप से यह कहना कि स्वाभाविक मातृस्नेह के कारण वह अवश्य विलाप करती।
  rationale: यूनानी पाठ मातृत्व और असाधारण दृढ़ता के बीच तनाव रखता है, पर मातृस्नेह पर अतिरिक्त नैतिक टिप्पणी नहीं करता। अनुवाद उसी तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है। आरंभिक infinitive को प्रसंगानुकूल प्रत्यक्ष आह्वान ‘विचार करो’ से व्यक्त किया गया है। कोई पादटिप्पणी आवश्यक नहीं है।
