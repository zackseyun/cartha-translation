base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/014.yaml
  text: O mother, soldier of devotion to God, though old and a woman, by endurance you conquered even a tyrant, and in deeds and words you were found stronger than a man.
translation:
  language: hi
  text: हे माँ, परमेश्वर के प्रति भक्ति की सैनिक[a], वृद्धा और स्त्री होते हुए भी तुमने अपने धीरज से एक अत्याचारी को भी हरा दिया, और तुम कर्मों और वचनों में एक पुरुष से अधिक सामर्थी पाई गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर के प्रति भक्ति’ का अनुवाद ‘परमेश्वर के प्रति श्रद्धा’ या ‘धर्मपरायणता’ भी हो सकता है। यूनानी शब्द εὐσέβεια श्रद्धा, भक्ति और धर्मपरायण आचरण का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσέβειαν θεοῦ
  choice: परमेश्वर-भक्ति
  rationale: यह पद परमेश्वर के प्रति श्रद्धा, निष्ठा और भक्तिपूर्ण आचरण को व्यक्त करता है। ‘परमेश्वर-भक्ति’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा सम्बन्ध की कुछ व्याकरणिक अस्पष्टता बनाए रखता है।
- source_word: στρατιῶτι
  choice: सैनिक
  rationale: माँ को भक्ति के संघर्ष में रूपकात्मक सैनिक कहने वाली युद्ध-संबंधी छवि को सीधे बनाए रखा गया है।
- source_word: πρεσβῦτι καὶ γυνή
  choice: वृद्ध और स्त्री होते हुए भी
  rationale: दोनों विशेषताओं को सुरक्षित रखते हुए concessive अलंकारिक बल स्पष्ट किया गया है; पाठ इन्हीं के बावजूद उसकी विजय पर बल देता है।
- source_word: διὰ καρτερίαν
  choice: अपने धीरज से
  rationale: καρτερία दुःख के बीच दृढ़ धीरज और सहनशीलता का बोध कराता है; ‘से’ διά के साधनात्मक अर्थ को व्यक्त करता है।
- source_word: τύραννον ἐνίκησας
  choice: एक अत्याचारी को भी हरा दिया
  rationale: ‘अत्याचारी’ τύραννος के दमनकारी शासक-संबंधी अर्थ को सुबोध ढंग से देता है और ‘भी’ प्रसंगगत जोर को व्यक्त करता है।
- source_word: ἔργοις ... καὶ λόγοις
  choice: कामों और वचनों में
  rationale: कर्म और वाणी के स्पष्ट समानांतर को बनाए रखा गया है; ‘वचनों’ से यहाँ बोले गए शब्द अभिप्रेत हैं।
- source_word: δυνατωτέρα ... ἀνδρός
  choice: एक पुरुष से अधिक सामर्थी
  rationale: तुलनात्मक अर्थ और स्त्री/पुरुष का जानबूझकर किया गया लैंगिक विरोध दोनों सुरक्षित हैं।
- source_word: εὑρέθης ἂν
  choice: पाई गईं
  rationale: मूल के निष्क्रिय ‘पाई गईं’ को बनाए रखा गया है। ἄν से जुड़ी पाठगत/वाक्यगत सूक्ष्मता का हिन्दी में निश्चितता बढ़ाकर समाधान नहीं किया गया।
theological_decisions:
- issue: εὐσέβεια की धार्मिक प्रकृति
  choice: परमेश्वर-भक्ति
  alternative: परमेश्वर के प्रति श्रद्धा / धर्मपरायणता
  rationale: यहाँ शब्द किसी विशिष्ट सम्प्रदायगत सिद्धान्त का नाम नहीं, बल्कि परमेश्वर की ओर उन्मुख श्रद्धा और निष्ठा है। चुना हुआ रूप सामान्य पाठक के लिए स्वाभाविक है।
- issue: अंतिम खंड में लैंगिक तुलना
  choice: ‘स्त्री’ और ‘एक पुरुष’ का स्पष्ट विरोध बनाए रखना
  alternative: ‘किसी भी व्यक्ति से अधिक सामर्थी’
  rationale: यूनानी पाठ की अलंकारिक धार उम्र और स्त्री होने के बावजूद विजय तथा पुरुष से तुलना पर निर्भर है; इसे लिंग-निरपेक्ष करना मूल के तनाव को मिटा देता।
- issue: सैनिक का रूपक
  choice: रूपक को सीधे ‘सैनिक’ के रूप में रखना
  alternative: परमेश्वर-भक्ति के लिए लड़नेवाली
  rationale: सीधा रूपक मूल की संक्षिप्तता और युद्धात्मक कल्पना को अधिक ठीक से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। संबोधन में आदरार्थक स्त्रीलिंग क्रियाएँ हैं। ‘हे माँ’ और ‘सैनिक’ मूल के ऊँचे, प्रशंसात्मक तथा युद्धात्मक स्वर को बनाए रखते हैं।
