translation:
  language: hi
  text: और इसी कारण तुम्हें परमेश्वर के लिए हर पीड़ा सहनी चाहिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद पिछले तर्क की ओर संकेत करते हुए उससे निष्कर्ष निकालता है; ‘इसी कारण’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὀφίλετε
  choice: तुम्हें ... चाहिए
  rationale: यह नैतिक दायित्व व्यक्त करता है। ‘चाहिए’ उपदेशात्मक आग्रह को बनाए रखता है, पर ‘अवश्य’ जैसी अधिक कठोर अनिवार्यता नहीं जोड़ता।
- source_word: πάντα πόνον
  choice: हर पीड़ा
  rationale: πόνος में पीड़ा, कष्ट या कठिन परिश्रम का भाव हो सकता है। अध्याय के शारीरिक यातना और शहादत-संबंधी संदर्भ में ‘हर पीड़ा’ ठोस अर्थ को बनाए रखता है।
- source_word: ὑπομένειν
  choice: सहनी
  rationale: क्रिया का अर्थ दुःख के नीचे दृढ़तापूर्वक टिके रहना या उसे सहना है; ‘सहनी’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: διὰ τὸν θεόν
  choice: परमेश्वर के लिए
  rationale: यहाँ διά के साथ कर्मकारक प्रेरणा अथवा उद्देश्य का भाव देता है। ‘परमेश्वर के लिए’ निष्ठा के कारण पीड़ा सहने का आशय सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: ὀφίλετε में नैतिक दायित्व की तीव्रता
  choice: उपदेशात्मक दायित्व—‘तुम्हें ... चाहिए’
  alternative: कठोर अनिवार्यता—‘तुम्हें ... अवश्य सहनी है’
  rationale: यूनानी क्रिया वास्तविक नैतिक दायित्व बताती है, पर प्रसंग में यह उपदेशात्मक संबोधन है। ‘चाहिए’ बाध्यता को सुरक्षित रखता है और अनावश्यक रूप से उसे पूर्ण विवशता नहीं बनाता।
- issue: διὰ τὸν θεόν में प्रेरणा और उद्देश्य
  choice: ‘परमेश्वर के लिए’
  alternative: ‘परमेश्वर के कारण’
  rationale: दोनों अर्थ व्याकरणतः निकट हैं, पर प्रसंग विश्वासयोग्य निष्ठा के कारण पीड़ा सहने का है। ‘परमेश्वर के लिए’ इस भक्तिपरक प्रेरणा को बिना अतिरिक्त सिद्धान्त जोड़े व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली। बहुवचन संबोधन ‘तुम्हें’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं है।
