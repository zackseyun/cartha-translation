  yaml_path: translation/deuterocanon/4_maccabees/016/013.yaml
  text: But[a], having a mind like adamant, and sending the number of her sons on to immortality, she was all the more urging them toward death for the sake of godliness, pleading with them.
translation:
  language: hi
  text: परन्तु उसका मन वज्र के समान अटूट था, और वह अपने पुत्रों की संख्या को अमरता की ओर आगे भेज रही थी[a]; वह उनसे विनती करते हुए उन्हें ईश्वरभक्ति के लिए मृत्यु की ओर जाने को और भी अधिक प्रेरित करती रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पुत्रों की संख्या को अमरता में प्रत्युत्तर की तरह प्रतिध्वनित कर रही थी।” यहाँ प्रयुक्त यूनानी कृदन्त असामान्य और रूपकात्मक है; इसलिए बिंब का सटीक आशय स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδάμαντινον
  choice: वज्र के समान अटूट
  rationale: यह विशेषण अत्यन्त कठोर और न टूटने वाली वस्तु का बिंब देता है। ‘वज्र के समान अटूट’ आधुनिक हिन्दी में उस दृढ़ता और मूल रूपक, दोनों को बनाए रखता है।
- source_word: νοῦν
  choice: मन
  rationale: νοῦς यहाँ उसकी भीतरी मानसिक दृढ़ता को सूचित करता है। ‘संकल्प’ अर्थ की व्याख्या कर देता, जबकि ‘मन’ स्रोत की व्यापकता बनाए रखता है।
- source_word: ἀντικτυποῦσα
  choice: आगे भेज रही थी
  rationale: यह कृदन्त असामान्य और रूपकात्मक है। प्रसंग में यह पुत्रों की गिनती को अमरता की दिशा में अग्रसर करने का संकेत देता है; फिर भी सटीक बिंब अनिश्चित है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: εἰς ἀθανασίαν
  choice: अमरता की ओर
  rationale: εἰς दिशा या लक्ष्य व्यक्त करता है। ‘की ओर’ उस गति को रखता है और प्राप्ति की प्रक्रिया को अनावश्यक रूप से निश्चित नहीं बनाता।
- source_word: τὸν τῶν υἱῶν ἀριθμόν
  choice: अपने पुत्रों की पूरी गिनती
  rationale: शाब्दिक अर्थ ‘पुत्रों की संख्या’ है। ‘पूरी गिनती’ हिन्दी में स्वाभाविक है और इस बात पर बल बनाए रखती है कि उसके पुत्र सामूहिक रूप से दृष्टि में हैं।
- source_word: μᾶλλον
  choice: और भी अधिक
  rationale: यह तुलनात्मक क्रियाविशेषण उसके आग्रह की तीव्रता बढ़ाता है।
- source_word: εὐσεβείας
  choice: ईश्वरभक्ति
  rationale: 4 मकाबियों में यह शब्द परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुसार आचरण को व्यक्त करता है। ‘ईश्वरभक्ति’ इस ईश्वराभिमुख अर्थ को स्पष्ट और संप्रदाय-निरपेक्ष रूप में रखता है।
- source_word: προετρέπετο
  choice: प्रेरित करती रही
  rationale: क्रिया प्रबल आग्रह या प्रोत्साहन व्यक्त करती है। ‘प्रेरित करती रही’ अपूर्णकालिक क्रिया की निरंतरता को भी स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: ἱκετεύουσα
  choice: विनती करते हुए
  rationale: यह कृदन्त उसके आग्रह में निहित भावनात्मक तीव्रता और याचना को बनाए रखता है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: ईश्वरभक्ति
  alternative: भक्ति; श्रद्धापूर्ण निष्ठा
  rationale: यह शब्द परमेश्वर और उसकी व्यवस्था के प्रति निष्ठा को सूचित करता है। ‘ईश्वरभक्ति’ ईश्वराभिमुखता को स्पष्ट रखता है, पर किसी बाद की विशिष्ट धर्मवैज्ञानिक धारणा को नहीं जोड़ता।
- issue: καὶ εἰς ἀθανασίαν ἀντικτυποῦσα τὸν τῶν υἱῶν ἀριθμόν के रूपक की व्याख्या
  choice: अपने पुत्रों की पूरी गिनती को अमरता की ओर आगे भेज रही थी
  alternative: अपने पुत्रों की गिनती को अमरता में प्रतिध्वनित कर रही थी
  rationale: यूनानी वाक्यांश असामान्य और अर्थ-सघन है। मुख्य पाठ दिशा और गति का बोध देता है, जबकि पादटिप्पणी ध्वनि अथवा प्रत्युत्तर के संभावित रूपक को सुरक्षित रखती है; इस प्रकार अमरता और पुत्रों की मृत्यु के संबंध को किसी एक सिद्धान्त में नहीं बाँधा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वज्र के समान अटूट’ मूल कठोरता के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है। कठिन मध्यवर्ती उपवाक्य को जानबूझकर पूरी तरह व्याख्यायित नहीं किया गया; उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
