  yaml_path: translation/deuterocanon/4_maccabees/016/018.yaml
  text: Do not let the younger men be terrified by the tortures. Remember that for the sake of the God of the world you have partaken of this[a], and have enjoyed life;
translation:
  language: hi
  text: कम उम्र के युवकों को यातनाओं से भयभीत न होने दो। स्मरण रखो कि संसार के परमेश्वर[a] के लिए तुम सहभागी हुए हो और जीवन का आनंद पाया है;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “संसार के परमेश्वर।” इसका आशय संसार पर प्रभुता रखने वाले परमेश्वर से भी हो सकता है।
    reason: यूनानी संबंधकारक पदबंध का सीधा रूप और उसका संभावित सार्वभौम-अधिपत्य संबंधी अर्थ दोनों सुरक्षित रखना।
lexical_decisions:
- source_word: τοὺς νεωτέρους
  choice: युवा जनों को
  rationale: तुलनात्मक विशेषण का बहुवचन यहाँ समूह के कम आयु वाले सदस्यों, प्रसंगतः छोटे भाइयों, को सूचित करता है। ‘युवा जनों’ से आयु-संबंधी अर्थ बना रहता है और हिन्दी स्वाभाविक रहती है।
- source_word: καταπλαγῆναι τὰς βασάνους
  choice: यातनाओं से भयभीत न होने दो
  rationale: καταπλαγῆναι तीव्र भय से अभिभूत होने का भाव देता है और βάσανος यहाँ न्यायिक यातना को दर्शाता है। उपलब्ध यूनानी खंड में आश्रित कर्मकारक-पद और infinitive है; निषेधात्मक आग्रह को हिन्दी में स्वाभाविक बनाने के लिए ‘न होने दो’ रखा गया है।
- source_word: ἀναμνήσθητε
  choice: स्मरण रखो
  rationale: यह बहुवचन आज्ञार्थक रूप है, जो जानबूझकर याद करने का आग्रह करता है।
- source_word: διὰ τὸν θεὸν τοῦ κόσμου
  choice: संसार के परमेश्वर के लिए
  rationale: διά के साथ कर्मकारक कारण अथवा निमित्त का अर्थ देता है। τοῦ κόσμου का औपचारिक संबंध θεόν से है; मुख्य पाठ उसका सीधा रूप रखता है और संभावित सार्वभौम-अधिपत्य का आशय पादटिप्पणी में बताता है।
- source_word: μετελάβετε
  choice: तुमने इसमें भाग लिया है
  rationale: क्रिया का अर्थ किसी वस्तु में हिस्सा लेना या सहभागी होना है, पर उपलब्ध यूनानी पाठ में उसका कर्म व्यक्त नहीं है। ‘इसमें’ न्यूनतम पूर्ति है और अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: τοῦ βίου ἀπελαύσατε
  choice: जीवन का आनंद पाया है
  rationale: ἀπολαύω संबंधकारक के साथ किसी वस्तु का आनंद या लाभ पाने का अर्थ देता है; यह हिन्दी अभिव्यक्ति अर्थ और गरिमा दोनों बनाए रखती है।
theological_decisions:
- issue: θεὸν τοῦ κόσμου का अर्थ
  choice: संसार के परमेश्वर
  alternative: संसार के अधिपति परमेश्वर
  rationale: मुख्य पाठ यूनानी संबंधकारक रचना को निकटता से सुरक्षित रखता है। संदर्भ में यह संसार पर परमेश्वर की प्रभुता सूचित कर सकता है, पर ‘अधिपति’ को पाठ में जोड़ने के बजाय यह व्याख्या पादटिप्पणी में दी गई है।
- issue: μετελάβετε का अव्यक्त कर्म
  choice: इसमें भाग लिया है
  alternative: भाग लिया है
  rationale: हिन्दी में वाक्य को सुबोध बनाने के लिए एक न्यूनतम संकेत जोड़ा गया है, किंतु यूनानी पाठ यह स्पष्ट नहीं करता कि किसमें भाग लिया गया; अतः अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आग्रहपूर्ण शैली रखी गई है। ‘परमेश्वर’ द्वितीय-मंदिर यहूदी एकेश्वरवादी प्रसंग के लिए स्वाभाविक है। पद के अंत का अर्धविराम आगे जारी विचार का संकेत देता है।
