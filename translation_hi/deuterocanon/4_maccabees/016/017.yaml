translation:
  language: hi
  text: पूर्वजों से मिली व्यवस्था के लिए सहर्ष। क्योंकि यह लज्जाजनक है कि इस वृद्ध ने तो परमेश्वर-भक्ति[a] के कारण की पीड़ाएँ सह लीं, पर तुम—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धर्मपरायणता।’ यूनानी εὐσέβεια परमेश्वर के प्रति श्रद्धा और निष्ठापूर्ण भक्ति को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद में वाक्य अधूरा है और अगले पद में जारी रहता है।
    reason: cross_reference
lexical_decisions:
- source_word: προθύμως
  choice: सहर्ष
  rationale: यह क्रिया-विशेषण इच्छापूर्वक और तत्पर मन से किए गए कार्य को दर्शाता है। ‘सहर्ष’ स्वेच्छा और तत्परता—दोनों भावों को संक्षेप में रखता है।
- source_word: ὑπὲρ τοῦ πατρίου νόμου
  choice: पूर्वजों से मिली व्यवस्था के लिए
  rationale: ὑπέρ यहाँ ‘के लिए/की खातिर’ का भाव देता है, और πατρίου νόμου उस धार्मिक व्यवस्था को दर्शाता है जो पूर्वजों से विरासत में मिली है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए ऐतिहासिक-सामुदायिक अर्थ बचाता है।
- source_word: αἰσχρόν
  choice: लज्जा की बात
  rationale: शब्द नैतिक लज्जा या अपमानजनक असंगति को व्यक्त करता है। ‘लज्जा की बात’ उपदेशात्मक स्वर में स्वाभाविक हिन्दी है।
- source_word: τὸν ... γέροντα τοῦτον
  choice: इस वृद्ध पुरुष ने
  rationale: τοῦτον का संकेतार्थ ‘इस’ से और γέροντα का आयु-संबंधी अर्थ ‘वृद्ध पुरुष’ से स्पष्ट होता है; इससे श्रोताओं के साथ किया गया अलंकारिक विरोध भी बना रहता है।
- source_word: ὑπομεῖναι
  choice: सह लीं
  rationale: क्रिया कठिन पीड़ा के नीचे दृढ़ रहकर उसे सहने का अर्थ देती है। हिन्दी वाक्य-संरचना में पूर्ण क्रिया ‘सह लीं’ पूर्ववर्ती वृद्ध और आगे आने वाले ‘तुम’ के बीच विरोध को स्पष्ट रखती है।
- source_word: τὰς ... ἀλγηδόνας
  choice: पीड़ाएँ
  rationale: ἀλγηδών शारीरिक या तीव्र दुख-दर्द को दर्शाता है। ‘पीड़ाएँ’ पर्याप्त व्यापक है और ‘यातनाएँ’ जैसा अतिरिक्त बल नहीं जोड़ता।
- source_word: διὰ τὴν εὐσέβειαν
  choice: परमेश्वर-भक्ति के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है। εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुरूप आचरण को सूचित करती है; ‘परमेश्वर-भक्ति’ इसका ईश्वराभिमुख भाव स्पष्ट करती है।
theological_decisions:
- issue: शहादत के प्रसंग में εὐσέβεια का अनुवाद
  choice: परमेश्वर-भक्ति
  alternative: धर्मपरायणता; भक्ति
  rationale: प्रसंग में यह केवल सामान्य नैतिक शिष्टता नहीं, बल्कि परमेश्वर और उसकी व्यवस्था के प्रति श्रद्धापूर्ण निष्ठा है। ‘परमेश्वर-भक्ति’ इस दिशा को स्पष्ट करती है, जबकि पादटिप्पणी वैकल्पिक अर्थ-सरणी को सुरक्षित रखती है।
- issue: खंडित वाक्य को पूरा न करना
  choice: ‘पर तुम—’ पर वाक्य को खुला छोड़ा गया है
  alternative: अगले पद का आशय जोड़कर वाक्य पूरा करना
  rationale: यूनानी स्रोत में इस पद का वाक्य δέ के बाद अधूरा है और अगले पद में जारी रहता है। अनुवाद में उसे चुपचाप पूरा करना स्रोत की संरचना और अलंकारिक तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज रूप रखा गया है। आरम्भिक वाक्यांश स्रोत की तरह पिछले पद से जुड़ा हुआ खंड है। ‘व्यवस्था’ यहूदी धार्मिक विधान के अर्थ में प्रयुक्त है।
