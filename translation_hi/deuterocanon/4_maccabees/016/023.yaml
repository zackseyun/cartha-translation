  yaml_path: translation/deuterocanon/4_maccabees/016/023.yaml
  text: For[a], though they knew that reverence toward God is not irrational, they did not shrink back from the pains.
translation:
  language: hi
  text: क्योंकि[a] वे यह जानते हुए कि परमेश्वर के प्रति श्रद्धा रखना विवेकहीन नहीं है, पीड़ाओं से पीछे नहीं हटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य बहुत संक्षिप्त है। अधिक शाब्दिक रूप से: “यह जानते हुए कि श्रद्धालु होना विवेकहीन नहीं है, पीड़ाओं का विरोध न करना।” यहाँ यूनानी रचना में इन खंडों का संबंध संक्षिप्त रूप में व्यक्त है।'
    reason: मूल यूनानी की संकुचित वाक्य-रचना और संभावित वैकल्पिक संबंध को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀλόγιστον
  choice: विवेकहीन नहीं
  rationale: यह विशेषण ‘तर्कहीन/विवेकहीन’ का भाव देता है। नकारात्मक रूप बनाए रखने से यूनानी रचना और इस पुस्तक में भक्ति तथा विवेक के संबंध पर दिया गया बल सुरक्षित रहता है।
- source_word: εἰδότας
  choice: वे जानते थे
  rationale: यह कृदंत मुख्य कथन की पृष्ठभूमि बताता है। हिंदी में पूर्ण क्रिया के रूप में इसे रखना स्पष्ट और स्वाभाविक है; ‘इसलिए’ प्रसंग में निहित तार्किक संबंध को व्यक्त करता है।
- source_word: εὐσεβεῖν
  choice: परमेश्वर के प्रति श्रद्धा रखना
  rationale: क्रिया का अर्थ भक्तिपूर्वक आचरण करना अथवा श्रद्धा रखना है, विशेषतः परमेश्वर के प्रति। यह हिंदी में धार्मिक आशय स्पष्ट करता है, यद्यपि यूनानी में ‘परमेश्वर’ अलग शब्द के रूप में नहीं है।
- source_word: μὴ ἀνθίστασθαι
  choice: पीछे नहीं हटे
  rationale: शाब्दिक अर्थ ‘सामना न करना/विरोध न करना’ है। पीड़ाओं के साथ प्रयुक्त होने पर यहाँ भाव उनके सामने न झुकने या उनसे पीछे न हटने का है; चुना हुआ रूप स्वाभाविक हिंदी में धीरज को व्यक्त करता है।
- source_word: τοῖς πόνοις
  choice: पीड़ाओं
  rationale: πόνος पीड़ा, कष्ट या कठिन परिश्रम को सूचित कर सकता है। शहादत के इस प्रसंग में ‘पीड़ाओं’ मूल अर्थ को बिना ‘यातनाओं’ जितना तीव्र बनाए व्यक्त करता है।
theological_decisions:
- issue: भक्ति और विवेक का संबंध
  choice: वाक्य को इस अर्थ में प्रस्तुत किया गया है कि परमेश्वर के प्रति श्रद्धा विवेकहीन नहीं है।
  alternative: 'इसे अत्यंत शाब्दिक और संकुचित ढंग से इस प्रकार भी जोड़ा जा सकता है: ‘यह जानते हुए कि श्रद्धालु होना विवेकहीन नहीं है—पीड़ाओं का विरोध न करना।’'
  rationale: यूनानी वाक्य संक्षिप्त और कुछ हद तक अस्पष्ट है, पर पुस्तक के व्यापक तर्क में सबसे संगत अर्थ यही है कि सच्ची भक्ति विवेक के विरुद्ध नहीं और इसी कारण विश्वासी पीड़ाओं से पीछे नहीं हटे। पादटिप्पणी मूल की संकुचित रचना को सामने रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और शहादत के प्रसंग के अनुकूल भाषा रखी गई है। ‘विवेकहीन नहीं’ मूल के नकारात्मक रूप को बनाए रखता है; ‘पीड़ाओं से पीछे नहीं हटे’ शाब्दिक ‘विरोध नहीं किया’ की अपेक्षा हिंदी में अधिक स्वाभाविक है।
