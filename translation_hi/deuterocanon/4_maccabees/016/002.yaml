  yaml_path: translation/deuterocanon/4_maccabees/016/002.yaml
  text: So I have shown that not only did men master the passions[a], but even a woman despised the greatest tortures.
translation:
  language: hi
  text: इस प्रकार मैंने दिखा दिया कि न केवल पुरुषों ने मनोवेगों पर अधिकार पाया, बल्कि एक स्त्री ने भी सबसे बड़ी यातनाओं को तुच्छ समझा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबसे बड़ी यातनाओं की भी परवाह नहीं की।”
    reason: ὑπερεφρόνησεν में तुच्छ मानने, तिरस्कार करने और परवाह न करने के निकटवर्ती भाव हैं।
lexical_decisions:
- source_word: ἀπέδειξα
  choice: मैंने दिखा दिया
  rationale: यह क्रिया ‘दिखाना, सिद्ध करना, प्रमाणित करना’ व्यक्त कर सकती है। यहाँ लेखक पिछले तर्क का निष्कर्ष प्रस्तुत कर रहा है, इसलिए ‘दिखा दिया’ स्वाभाविक है और औपचारिक प्रमाण का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: οὖν
  choice: इस प्रकार
  rationale: यह पिछले विवेचन से निकलने वाले निष्कर्ष को सूचित करता है; ‘इस प्रकार’ उस तार्किक संबंध को सहज हिन्दी में बनाए रखता है।
- source_word: τῶν παθῶν
  choice: मनोवेगों
  rationale: 4 मक्काबियों में πάθη मुख्यतः उन आंतरिक आवेगों और भावनात्मक प्रवृत्तियों के लिए आता है जिन पर विवेक शासन करता है; यहाँ इसका अर्थ बाहरी दुःख नहीं है।
- source_word: ἄνδρες
  choice: पुरुषों
  rationale: यूनानी शब्द विशेष रूप से पुरुषों को दर्शाता है और आगे ‘एक स्त्री’ के साथ जानबूझकर किया गया लैंगिक विरोध बनाए रखता है।
- source_word: ἐπεκράτησαν
  choice: पर अधिकार पाया
  rationale: क्रिया किसी वस्तु पर नियंत्रण या प्रभुत्व प्राप्त करने का भाव देती है; यह प्रयोग मनोवेगों को वश में करने का अर्थ स्पष्ट करता है।
- source_word: γυνή
  choice: एक स्त्री
  rationale: अनिश्चित एकवचन यहाँ उदाहरणस्वरूप उस माता की ओर संकेत करता है; ‘एक स्त्री’ स्रोत के आलंकारिक विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν μεγίστων βασάνων
  choice: सबसे बड़ी यातनाओं
  rationale: βάσανοι शहीदी के प्रसंग में यातना या कठोर पीड़ा को सूचित करता है, और μεγίστων का श्रेष्ठतम भाव ‘सबसे बड़ी’ से सुरक्षित रहता है।
- source_word: ὑπερεφρόνησεν
  choice: तुच्छ समझा
  rationale: क्रिया का अर्थ किसी वस्तु को नगण्य मानना, उसका तिरस्कार करना या उसकी परवाह न करना है। ‘तुच्छ समझा’ यातनाओं के सामने स्त्री के निर्भय अवमान को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: 4 मक्काबियों में πάθη का मानव-स्वभाव संबंधी अर्थ
  choice: मनोवेग
  alternative: भावनाएँ; दुःख
  rationale: पुस्तक का केंद्रीय तर्क विवेक द्वारा आंतरिक मनोवेगों पर शासन से संबंधित है। ‘दुःख’ करने पर बाहरी यातनाओं का अर्थ निकलता, जो यहाँ उपयुक्त नहीं है; केवल ‘भावनाएँ’ कहना भी शब्द के आवेगात्मक नैतिक आयाम को कुछ मंद कर देता।
- issue: ἄνδρες और γυνή के बीच लैंगिक विरोध
  choice: पुरुषों … एक स्त्री
  alternative: लोगों … एक स्त्री
  rationale: पद जानबूझकर पहले के पुरुष उदाहरणों की तुलना उस माता से करता है। लिंग-निरपेक्ष अनुवाद स्रोत की इस आलंकारिक संरचना को मिटा देता।
- issue: यातनाओं के प्रति ὑπερεφρόνησεν का भाव
  choice: तुच्छ समझा
  alternative: परवाह नहीं की; तिरस्कार किया
  rationale: पाठ यह नहीं कहता कि यातनाएँ वस्तुतः छोटी थीं, बल्कि यह कि स्त्री ने उन्हें अपने संकल्प के सामने नगण्य माना। चुना गया रूप इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य रखा गया है। ‘मनोवेग’ दार्शनिक आशय को सुरक्षित रखते हुए ‘वासनाएँ’ के संभावित संकीर्ण या मुख्यतः काम-संबंधी अर्थ से बचता है। पद का पुरुष–स्त्री विरोध यथावत रखा गया है।
