  yaml_path: translation/deuterocanon/4_maccabees/016/010.yaml
  text: O I[a], the mother of many and of beautiful children, a widow and alone[b], much-lamenting woman!
translation:
  language: hi
  text: हाय! मैं, बहुत-से सुंदर[a] बच्चों वाली स्त्री, विधवा और अकेली, बहुत विलाप करने वाली[b] हूँ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सुंदर’ के स्थान पर ‘श्रेष्ठ’ या ‘उत्तम’ भी सम्भव है; यूनानी शब्द शारीरिक सुंदरता अथवा सराहनीय उत्कृष्टता, दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ ‘बहुत विलाप करने वाली’ या ‘बहुत शोक करने वाली’ है; इसे ‘जिसके लिए बहुत विलाप किया जाता है’ भी समझा जा सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ὦ
  choice: हाय!
  rationale: यह विस्मयादिबोधक यहाँ शोकपूर्ण आत्म-विलाप आरम्भ करता है; आधुनिक हिन्दी में ‘हाय!’ उसका भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: πολύπαις
  choice: बहुत-से … बच्चों वाली
  rationale: यूनानी संयुक्त विशेषण का अर्थ बहुत बच्चे होना है; यह रूप γυνή के साथ उसके विशेषण-संबंध को बनाए रखता है।
- source_word: καλλίπαις
  choice: सुंदर बच्चों वाली
  rationale: शब्द का सीधा अर्थ सुंदर या अच्छे बच्चों वाली स्त्री हो सकता है। मुख्य पाठ में अपेक्षाकृत प्रत्यक्ष ‘सुंदर’ रखा गया है और उत्कृष्टता का वैकल्पिक भाव पादटिप्पणी में दिया गया है।
- source_word: γυνή
  choice: स्त्री
  rationale: मूल में स्पष्ट रूप से ‘स्त्री’ है। मातृत्व प्रसंग से ज्ञात है, पर मुख्य पाठ में ‘माँ’ रखकर मूल संज्ञा को बदलना आवश्यक नहीं।
- source_word: χήρα
  choice: विधवा
  rationale: यह उसके वैवाहिक और शोकपूर्ण जीवन-स्थान को सीधे व्यक्त करता है।
- source_word: μόνη
  choice: अकेली
  rationale: यह उसके एकाकी रह जाने पर बल देता है।
- source_word: πολύθρηνος
  choice: शोक से व्याकुल
  rationale: यूनानी विशेषण प्रचुर विलाप या शोक का बोध देता है। हिन्दी में यह वाक्यांश उसकी गहन, जारी पीड़ा को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
