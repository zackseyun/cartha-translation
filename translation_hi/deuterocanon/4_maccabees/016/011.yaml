translation:
  language: hi
  text: जो कहती, “मैं मर भी जाऊँ, तो भी मेरे पुत्रों में से कोई मुझे दफनानेवाला न होगा।”[a] परन्तु उस पवित्र और परमेश्वर-भक्त माता ने इस विलाप से उनमें से किसी के लिए विलाप नहीं किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ अचानक प्रथम पुरुष में माता की वाणी प्रस्तुत करता है। वाक्य संक्षिप्त है; उसका निकटतर अर्थ है: “मैं मर भी जाऊँ, तो भी मेरे पुत्रों में से कोई मुझे दफनानेवाला न होगा।”'
    reason: मूल की अचानक बदली हुई वाचिक संरचना तथा ‘पुत्रों में से कोई’ वाले अंशसूचक प्रयोग को स्पष्ट करना।
lexical_decisions:
- source_word: ἣ
  choice: जो कहती
  rationale: स्त्रीलिंग संबंधवाचक सर्वनाम पहले उल्लिखित माता की ओर संकेत करता है। आगे अचानक आए प्रथम पुरुष को स्वाभाविक हिन्दी में उसकी वाणी के रूप में प्रस्तुत करने के लिए ‘कहती’ जोड़ा गया है।
- source_word: οὐδʼ ἂν ἀποθάνω
  choice: जब मैं मरूँगी भी
  rationale: 'ἄν के साथ प्रथम पुरुष संभावनार्थक रूप भावी/अनिश्चित अवसर को व्यक्त करता है; οὐδέ का निषेध मुख्य कथन पर लागू समझना वाक्य-संरचना और अर्थ दोनों के अनुकूल है: ‘मेरी मृत्यु पर भी ... कोई नहीं होगा।’'
- source_word: θάπτοντα τῶν υἱῶν ἕξω τινά
  choice: मुझे दफनाने के लिए मेरा कोई बेटा नहीं होगा
  rationale: 'ἕξω को ἔχω का भविष्यकाल, ‘मेरे पास/मुझे ... होगा,’ और θάπτοντα को τινά का विशेषणवत् कृदन्त माना गया है: ‘पुत्रों में से कोई जो दफनाए।’ प्रसंगानुसार दफनाए जाने वाली माता स्वयं है।'
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: अपेक्षित मातृ-विलाप और माता की वास्तविक प्रतिक्रिया के बीच प्रबल विरोध दिखाता है।
- source_word: τούτῳ τῷ θρήνῳ
  choice: इस प्रकार
  rationale: शाब्दिक अर्थ ‘इस विलाप से/इस विलाप के द्वारा’ है। हिन्दी में अगले ‘विलाप’ के साथ असहज पुनरुक्ति से बचते हुए उसी आशय को स्वाभाविक रूप दिया गया है।
- source_word: οὐδένα ὀλοφύρετο
  choice: उनमें से किसी के लिए विलाप नहीं किया
  rationale: क्रिया गहरे शोक को मुखर विलाप के रूप में व्यक्त करती है; οὐδένα का संदर्भ उसके पुत्रों से है।
- source_word: ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ
  choice: उस पवित्र और परमेश्वर-भक्त माता
  rationale: ἱερά की धार्मिक गरिमा ‘पवित्र’ से और θεοσεβής की स्पष्ट ईश्वर-केंद्रित भक्ति ‘परमेश्वर-भक्त’ से व्यक्त होती है।
theological_decisions:
- issue: θεοσεβής का अनुवाद
  choice: परमेश्वर-भक्त
  alternative: धर्मपरायण
  rationale: यह शब्द सामान्य धार्मिकता नहीं, विशेष रूप से परमेश्वर के प्रति श्रद्धा और भक्ति बताता है; इसलिए ईश्वर-संदर्भ को स्पष्ट रखा गया है।
- issue: आरम्भिक खंड में प्रथम पुरुष और निषेध
  choice: “जब मैं मरूँगी भी, तब मुझे दफनाने के लिए मेरा कोई बेटा नहीं होगा”
  alternative: “यदि मैं न मरूँ, तो अपने किसी बेटे को दफनाऊँगी”
  rationale: मूल में ἀποθάνω प्रथम पुरुष है, पर θάπτοντα कर्मकारक पुल्लिंग कृदन्त है और ἕξω ἔχω का भविष्यकाल हो सकता है। इसलिए माता के अपने मरने और पुत्र द्वारा उसे दफनाने का आशय व्याकरणतः अधिक संगत है; पाठ की अचानक प्रथम-पुरुष वाणी को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दफनाने’ और ‘विलाप’ जैसे प्रचलित शब्द चुने गए हैं। पद अगले वाक्य में जारी प्रतीत होता है, इसलिए अन्त में अल्पविराम रखा गया है।
