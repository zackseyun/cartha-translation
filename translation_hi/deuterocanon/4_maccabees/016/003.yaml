base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/003.yaml
  text: And the lions around Daniel were not so savage[a], nor the blazing furnace with its fiercest fire against Mishael, as that mother's own nature was inflamed by love for her children when she saw her seven sons being tortured.
translation:
  language: hi
  text: और न तो दानिय्येल के चारों ओर के सिंह इतने हिंस्र थे, न मीशाएल के विरुद्ध अपनी प्रचंडतम आग के साथ धधकती भट्ठी इतनी उग्र थी, जितना कि अपने बच्चों के प्रेम से उस माता का स्वभाव भीतर ही भीतर जल रहा था[a], जब वह अपने सातों पुत्रों को यातना सहते देख रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने बच्चों के प्रेम के कारण और भी प्रचंड रूप से जल रहा था।” यूनानी क्रिया माता की भीतरी पीड़ा के लिए आग का बिंब प्रयोग करती है।
    reason: दुर्लभ यूनानी क्रिया की वैकल्पिक व्याख्या और अग्नि-रूपक को स्पष्ट करना।
lexical_decisions:
- source_word: οἱ περὶ Δανιὴλ λέοντες
  choice: दानिय्येल के चारों ओर के सिंह
  rationale: οἱ περὶ के स्थानिक-संबंधसूचक भाव को सीधे और स्वाभाविक ढंग से व्यक्त करता है तथा दानिय्येल की कथा के सिंहों की ओर संकेत बनाए रखता है।
- source_word: ἄγριοι
  choice: हिंस्र
  rationale: सिंहों की खतरनाक क्रूरता व्यक्त करता है; केवल ‘जंगली’ कहने से संदर्भ की तीव्रता घट जाती।
- source_word: Μισαὴλ
  choice: मीशाएल
  rationale: यूनानी रूप के पीछे स्थित इब्रानी नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ἐκφλεγομένη κάμινος λαβροτάτῳ πυρί
  choice: धधकती भट्ठी अपनी प्रचंडतम आग के साथ
  rationale: ἐκφλεγομένη की सक्रिय ज्वाला और λαβροτάτῳ के अतिशयोक्तिपूर्ण बल, दोनों को सुरक्षित रखता है।
- source_word: φιλοτεκνίας
  choice: अपने बच्चों के प्रेम से
  rationale: अपनी संतानों के प्रति माता के स्नेह को स्पष्ट करता है और अमूर्त ‘संतान-प्रेम’ की अपेक्षा सहज हिन्दी देता है।
- source_word: πειράλειεν
  choice: भीतर ही भीतर जल रहा था
  rationale: दुर्लभ क्रिया के अग्नि-बिंब को माता की आंतरिक पीड़ा पर लागू करते हुए बनाए रखता है; ‘भीतर ही भीतर’ रूपक का भावगत क्षेत्र स्पष्ट करता है।
- source_word: ἐκείνη φύσις
  choice: उस माता का स्वभाव
  rationale: शाब्दिक ‘वह प्रकृति’ हिन्दी में अस्पष्ट होता; संदर्भ के आधार पर माता को स्पष्ट करना अर्थ नहीं बदलता।
- source_word: ὁρῶσα
  choice: जब वह ... देख रही थी
  rationale: वर्तमान कृदंत की कालगत और चलती हुई दृष्टि को स्वाभाविक हिन्दी उपवाक्य में व्यक्त करता है।
- source_word: βασανιζομένους
  choice: यातना सहते
  rationale: शहादत के संदर्भ में वास्तविक शारीरिक यातना को सीधे व्यक्त करता है।
theological_decisions:
- issue: माता की भीतरी दशा के लिए अग्नि-रूपक
  choice: ‘भीतर ही भीतर जल रहा था’ द्वारा अग्नि-रूपक बनाए रखा गया
  alternative: ‘अत्यन्त व्याकुल था’ या ‘पीड़ा से तड़प रहा था’
  rationale: पद का अलंकार सिंहों और भट्ठी की बाहरी भयावहता की तुलना माता के भीतर जलती पीड़ा से करता है; रूपक हटाने पर मूल की नाटकीय तुलना मंद पड़ जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। तुलनात्मक वाक्य की दीर्घ संरचना मूल यूनानी की वक्तृता को सुरक्षित रखते हुए हिन्दी में स्पष्ट की गई है। ‘दानिय्येल’ और ‘मीशाएल’ बाइबलीय नाम-रूप रखे गए हैं।
