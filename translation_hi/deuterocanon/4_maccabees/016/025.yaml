  text: And even more, by seeing this—that after dying for God they live to God, just as Abraham and Isaac and Jacob, and all the patriarchs do—
translation:
  language: hi
  text: और इससे भी बढ़कर, यह देखकर कि परमेश्वर के लिए मरने के बाद वे परमेश्वर के लिए जीवित हैं[a]—ठीक वैसे ही जैसे अब्राहम, इसहाक, याकूब और सभी कुलपिता—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “वे परमेश्वर के लिए जीवित हैं।” यहाँ ‘परमेश्वर’ सम्प्रदान कारक में है, जो उनके परमेश्वर के साथ सम्बन्ध को व्यक्त करता है।
    reason: ζῶσιν τῷ θεῷ के दातिव सम्बन्ध को शाब्दिक रूप से दिखाता है, पर ‘परमेश्वर की दृष्टि में’ जैसी अतिरिक्त व्याख्या को वैकल्पिक अनुवाद के रूप में नहीं रखता।
lexical_decisions:
- source_word: ἔτι δὲ καὶ
  choice: और इससे भी बढ़कर
  rationale: यह पदबंध पिछली बात में एक और अधिक बलवान विचार जोड़ता है; यह हिन्दी में स्वाभाविक रूप से उसके योगात्मक और बलात्मक अर्थ को व्यक्त करता है।
- source_word: ταῦτα ἰδόντες
  choice: यह देखकर
  rationale: यूनानी में शब्द रूप बहुवचन है, पर सन्दर्भ में जिन बातों या वास्तविकता को समष्टि रूप में देखा गया है, उसके लिए हिन्दी का एकवचन ‘यह’ अधिक स्वाभाविक है; कृदन्त का भाव भी बना रहता है।
- source_word: διὰ τὸν θεόν
  choice: परमेश्वर के लिए
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा उद्देश्य का भाव देता है—अर्थात परमेश्वर के निमित्त मरना। ‘परमेश्वर के लिए’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἀποθανόντες
  choice: जो ... मर गए
  rationale: अओरिस्ट कृदन्त को सम्बन्धवाचक उपवाक्य में रखकर मृत्यु को वर्तमान ‘जीवित हैं’ से पहले की पूर्ण घटना के रूप में स्पष्ट किया गया है।
- source_word: ζῶσιν τῷ θεῷ
  choice: वे परमेश्वर के लिए जीवित हैं
  rationale: सम्प्रदान कारक τῷ θεῷ को ‘परमेश्वर के लिए’ द्वारा निकटता से रखा गया है। यह परमेश्वर के साथ उनके जीवित सम्बन्ध की पुष्टि करता है, पर उस जीवन की दशा या स्थान को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ὥσπερ
  choice: ठीक वैसे ही जैसे
  rationale: तुलना को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: οἱ πατριάρχαι
  choice: सभी कुलपिता
  rationale: ‘कुलपिता’ इस्राएल के पूर्वज-प्रधानों के लिए प्रचलित और ऐतिहासिक-धार्मिक अर्थ को सुरक्षित रखने वाला शब्द है।
theological_decisions:
- issue: परमेश्वर के लिए मरने वाले धर्मियों का मृत्यु के बाद परमेश्वर के सम्बन्ध में जीवित होना
  choice: वे परमेश्वर के लिए जीवित हैं
  alternative: वे परमेश्वर की दृष्टि में जीवित हैं; वे परमेश्वर के सामने जीवित हैं
  rationale: यूनानी पाठ उनके जीवित होने की स्पष्ट पुष्टि करता है और उनकी तुलना अब्राहम, इसहाक, याकूब तथा कुलपिताओं से करता है। चुना हुआ अनुवाद सम्प्रदान कारक की खुली हुई सम्बन्धवाचकता को बनाए रखता है और मृत्यु के बाद के जीवन की रीति या स्थान को पाठ से अधिक नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद मूल वाक्य का अंश है, इसलिए अन्त में दीर्घ विराम-चिह्न रखा गया है। ‘परमेश्वर के लिए’ की पुनरावृत्ति यूनानी के दो भिन्न व्याकरणिक प्रयोगों को हिन्दी में निकटता से रखती है; पादटिप्पणी दूसरे प्रयोग की वास्तविक अस्पष्टता स्पष्ट करती है।
