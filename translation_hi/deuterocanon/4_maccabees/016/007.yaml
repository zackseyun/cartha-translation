  yaml_path: translation/deuterocanon/4_maccabees/016/007.yaml
  text: O seven futile pregnancies[a], and seven useless ten-month terms, and fruitless nursing[b], and miserable suckling.
translation:
  language: hi
  text: हाय, सात व्यर्थ गर्भावस्थाएँ, और सात निष्फल दस-महीने की गर्भावधियाँ[a], और निष्फल धात्री-पालन, और दुःखभरा दूध पिलाना![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दस-महीने’ प्राचीन काल में सामान्य गर्भावधि की गणना करने की पद्धति को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: यूनानी पाठ पूर्ण वाक्यों के बजाय विस्मयात्मक पदों की एक शृंखला है; अनुवाद में विलाप की वही संक्षिप्त शैली रखी गई है।
    reason: literary_style
lexical_decisions:
- source_word: μάταιοι
  choice: व्यर्थ
  rationale: विलाप के संदर्भ में यह उन गर्भावस्थाओं को व्यक्त करता है जो माँ की दृष्टि में अंततः निष्फल हो गईं; ‘व्यर्थ’ संक्षिप्त और भावपूर्ण है।
- source_word: κυοφορίαι
  choice: गर्भावस्थाएँ
  rationale: यह गर्भ में बच्चों को धारण करने की अवस्थाओं का सीधा और आधुनिक हिन्दी रूप है।
- source_word: ἀνόνητοι
  choice: निष्फल
  rationale: शब्द का अर्थ लाभ या परिणाम न देने वाला है; ‘निष्फल’ मातृ-विलाप और प्रजनन-संबंधी बिंब दोनों के अनुकूल है।
- source_word: δεκάμηνοι
  choice: दस-महीने की अवधियाँ
  rationale: यह प्राचीन काल में गर्भावस्था की अवधि गिनने की पद्धति को अक्षुण्ण रखता है; सांस्कृतिक भिन्नता पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἄκαρποι
  choice: निष्फल
  rationale: यहाँ वास्तविक बाँझपन नहीं, बल्कि पालन-पोषण से आशानुरूप परिणाम न मिलने का विलाप है; इसलिए ‘बाँझ’ के बजाय ‘निष्फल’ उपयुक्त है।
- source_word: τιθηνίαι
  choice: शिशु-सेवा
  rationale: शब्द शिशु की धात्री-सदृश देखभाल और पालन को सूचित करता है। अगली अभिव्यक्ति में दूध पिलाने का स्पष्ट उल्लेख होने के कारण यह रूप अनावश्यक दोहराव घटाता है।
- source_word: ταλαίπωροι
  choice: दुःखभरा
  rationale: यह कष्ट और दयनीयता का भाव देता है तथा मातृ-विलाप में स्वाभाविक हिन्दी है।
- source_word: γαλακτοτροφίαι
  choice: दूध पिलाना
  rationale: यूनानी समास का अर्थ दूध से पोषण करना है; यह हिन्दी रूप स्पष्ट, सहज और प्रसंगानुकूल है।
theological_decisions:
- issue: क्रियारहित विस्मयात्मक पदावली का रूप
  choice: मूल की तरह संक्षिप्त विस्मयात्मक संज्ञा-पदों की शृंखला रखी गई।
  alternative: ‘मेरी सातों गर्भावस्थाएँ व्यर्थ गईं...’ जैसे पूर्ण वाक्यों में विस्तार करना।
  rationale: यूनानी में स्पष्ट सीमित क्रिया नहीं है। संक्षिप्त संरचना माँ के तीव्र विलाप को सुरक्षित रखती है और ऐसा अर्थ नहीं जोड़ती जिसे मूल स्पष्ट रूप से नहीं कहता।
- issue: δεκάμηνοι की प्राचीन गर्भावधि-संबंधी अभिव्यक्ति
  choice: ‘दस-महीने की अवधियाँ’ का शाब्दिक सांस्कृतिक रूप रखा और पादटिप्पणी दी।
  alternative: ‘पूरी गर्भावधियाँ’ अथवा ‘गर्भावस्था के महीने’।
  rationale: शाब्दिक रूप प्राचीन गणना-पद्धति को सुरक्षित रखता है; पादटिप्पणी आधुनिक पाठक के संभावित भ्रम को दूर करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में भावपूर्ण, गरिमापूर्ण मातृ-विलाप। ‘हाय’ से यूनानी ὦ का शोकपूर्ण उद्गार व्यक्त किया गया है। तकनीकी या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए मूल की समांतर, संक्षिप्त संरचना बनाए रखी गई है।
