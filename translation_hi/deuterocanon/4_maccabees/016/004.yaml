  yaml_path: translation/deuterocanon/4_maccabees/016/004.yaml
  text: But by the reasoning of godliness the mother extinguished passions so many and so great[a][b].
translation:
  language: hi
  text: परन्तु माता ने भक्ति-युक्त विवेक के द्वारा इतने अधिक और इतने प्रबल मनोवेगों को बुझा दिया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “इतने अनेक और इतने महान मनोवेगों को।”'
    reason: lexical_alternative
  - marker: b
    text: “भक्ति” का अनुवाद “धर्मनिष्ठा” या “श्रद्धापूर्ण भक्ति” भी किया जा सकता है। यूनानी शब्द में श्रद्धापूर्ण धार्मिक निष्ठा का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले प्रसंग के साथ प्रबल विरोध दर्शाता है; ‘परन्तु’ संक्षिप्त और गरिमापूर्ण हिन्दी संयोजक है।
- source_word: τῷ λογισμῷ
  choice: विवेक के द्वारा
  rationale: λόγισμος यहाँ तर्कपूर्ण विचार या विवेकपूर्ण निर्णय का बोध कराता है। ‘विवेक’ पुस्तक के इस प्रमुख दार्शनिक विचार को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘के द्वारा’ करण कारक को सुरक्षित रखता है।
- source_word: τῆς εὐσεβείας
  choice: भक्ति से प्रेरित
  rationale: εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण भक्ति और धर्मनिष्ठा का सूचक है। संबंधकारक पदबंध को हिन्दी में स्वाभाविक बनाने के लिए ‘भक्ति से प्रेरित’ रखा गया है, बिना उसके धार्मिक अर्थ को केवल सामान्य नैतिकता में सीमित किए।
- source_word: κατέσβεσε
  choice: बुझा दिया
  rationale: क्रिया का मूल चित्र आग बुझाने का है; ‘बुझा दिया’ मनोवेगों पर विजय के इस सजीव रूपक को बनाए रखता है।
- source_word: τοσαῦτα καὶ τηλικαῦτα
  choice: इतने अधिक और इतने प्रबल
  rationale: दोनों समानांतर बलवाचक शब्द क्रमशः संख्या और तीव्रता/परिमाण पर जोर देते हैं। हिन्दी में ‘इतने अधिक और इतने प्रबल’ उस दोहरे बल को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: πάθη
  choice: मनोवेगों
  rationale: 4 मक्काबियों के दार्शनिक संदर्भ में πάθη उन तीव्र भावनात्मक आवेगों को दर्शाता है जिन पर विवेक शासन करता है। ‘मनोवेग’ बाहरी ‘कष्टों’ की अपेक्षा इस अर्थ को अधिक ठीक व्यक्त करता है।
- source_word: ἡ μήτηρ
  choice: माता
  rationale: यूनानी पाठ का सीधा अर्थ ‘माता’ है; ‘उनकी’ जोड़ना आवश्यक नहीं है, क्योंकि संदर्भ से पहचान स्पष्ट है।
theological_decisions:
- issue: λογισμῷ τῆς εὐσεβείας में विवेक और भक्ति का संबंध
  choice: भक्ति से प्रेरित विवेक के द्वारा
  alternative: भक्ति के विवेक के द्वारा
  rationale: चुना हुआ रूप धार्मिक भक्ति और तर्कपूर्ण विवेक—दोनों तत्वों को बनाए रखते हुए हिन्दी में उनके संबंध को स्वाभाविक बनाता है। यह न तो विजय को केवल मानवीय तर्क का परिणाम बताता है, न भक्ति को विवेक से अलग करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘मनोवेग’ दार्शनिक शब्दावली की सटीकता रखता है, जबकि ‘बुझा दिया’ मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
