  yaml_path: translation/deuterocanon/4_maccabees/016/016.yaml
  text: you were saying to the children in the Hebrew language[a], “O children, noble is the contest to which, having been called for the testimony of the nation[b], you must struggle earnestly.”
translation:
  language: hi
  text: तुम अपने पुत्रों से इब्रानी भाषा में कहती थीं[a], “हे पुत्रो, वह संघर्ष महान है जिसके लिए तुम्हें राष्ट्र की गवाही[b] के लिए बुलाया गया है; उसमें डटकर संघर्ष करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कहा करती थीं” अथवा “कह रही थीं”; यूनानी अपूर्ण भूतकाल लगातार या बार-बार कहने का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “साक्ष्य”; यूनानी διαμαρτυρία का अर्थ “गवाही” या “साक्ष्य” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγες
  choice: कहती थीं
  rationale: अपूर्ण भूतकाल चलती हुई या बार-बार की गई वाणी का संकेत दे सकता है। स्त्री वक्ता के संदर्भ के कारण स्त्रीलिंग रूप रखा गया है।
- source_word: τοῖς παισὶν / Ὦ παῖδες
  choice: अपने पुत्रों से / हे पुत्रो
  rationale: παῖς सामान्यतः संतान या बालक कह सकता है, पर प्रसंग में माता अपने पुरुष वंशजों को संबोधित कर रही है; ‘पुत्र’ पारिवारिक संबंध और पुल्लिंग संदर्भ दोनों स्पष्ट करता है।
- source_word: ἐν τῇ Ἑβραΐδι φωνῇ
  choice: इब्रानी भाषा में
  rationale: यह वाक्यांश बोलने में प्रयुक्त भाषा बताता है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: γενναῖος ὁ ἀγών
  choice: महान संघर्ष
  rationale: γενναῖος में उदात्तता और वीरता का भाव है, जबकि ἀγών प्रतियोगिता अथवा कठिन संघर्ष का रूपक रखता है। ‘महान संघर्ष’ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐφʼ ὃν κληθέντες
  choice: जिस ... संघर्ष के लिए तुम ... बुलाए गए हो
  rationale: सापेक्ष वाक्य संघर्ष को बुलाहट का लक्ष्य बनाए रखता है और यूनानी कृदन्त की पृष्ठभूमिगत भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ τῆς διαμαρτυρίας τοῦ ἔθνους
  choice: राष्ट्र की गवाही के पक्ष में
  rationale: ὑπέρ के समर्थन अथवा पक्ष में होने के भाव और διαμαρτυρία की सार्वजनिक गवाही को रखा गया है। यूनानी में न पाए जाने वाले ‘हमारे’ को नहीं जोड़ा गया।
- source_word: ἐναγωνίσασθε
  choice: उसमें डटकर संघर्ष करो
  rationale: आज्ञार्थक क्रिया पूरे मनोबल से संघर्ष में उतरने का आह्वान करती है। ‘संघर्ष’ की पुनरावृत्ति ἀγών और ἐναγωνίσασθε के यूनानी शब्द-संबंध को भी आंशिक रूप से बचाती है।
theological_decisions:
- issue: शहादत के प्रसंग में παισίν/παῖδες का अनुवाद
  choice: पुत्रों / पुत्रो
  alternative: बच्चों / बच्चो
  rationale: प्रसंग माता के पुरुष संतानों का है। ‘पुत्र’ बिना किसी अतिरिक्त धार्मिक व्याख्या के लिंग और पारिवारिक संबंध दोनों को बनाए रखता है।
- issue: διαμαρτυρία का सार्वजनिक धार्मिक अर्थ
  choice: गवाही
  alternative: साक्ष्य
  rationale: ‘गवाही’ कानूनी और सार्वजनिक दोनों अर्थों को वहन कर सकती है तथा बाद की किसी विशिष्ट सांप्रदायिक शहादत-शब्दावली को पाठ पर आरोपित नहीं करती।
- issue: τοῦ ἔθνους में संबंध का स्वरूप
  choice: राष्ट्र की
  alternative: हमारे राष्ट्र की
  rationale: मूल यूनानी में संबंधवाचक सर्वनाम नहीं है। ‘राष्ट्र की’ व्यक्तिनिष्ठ और वस्तुनिष्ठ संबंध की संभावित अस्पष्टता को भी पूरी तरह बंद नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। संबोधन में ‘हे पुत्रो’ मूल की गंभीरता बनाए रखता है; ‘डटकर’ आज की सामान्य हिन्दी में आज्ञा की तीव्रता व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित शब्दांश के साथ रखे गए हैं।
