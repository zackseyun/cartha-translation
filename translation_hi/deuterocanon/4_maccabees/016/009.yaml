  yaml_path: translation/deuterocanon/4_maccabees/016/009.yaml
  text: O my children—some unmarried[a], and others married but childless—I will not see your children, nor will I be counted blessed when I am called grandmother.
translation:
  language: hi
  text: हे मेरे बच्चो! तुममें से कुछ अविवाहित हैं, और कुछ विवाह करके भी संतानहीन[a] हैं। मैं तुम्हारे बच्चों को नहीं देखूँगी, न ही नानी या दादी कहलाकर धन्य मानी जाऊँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी ἄνοιντοι एक दुर्लभ शब्द है; यहाँ इसका सम्भावित अर्थ ‘संतानहीन’ या ‘बिना संतान के’ है। आशय यह है कि विवाह कर चुके बच्चे भी उसे नाती-नातिन या पोते-पोतियाँ नहीं दे पाएँगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ τῶν ἐμῶν παίδων
  choice: हे मेरे बच्चो!
  rationale: ὦ संबोधन में विलाप और भावावेग व्यक्त करता है; παῖδες यहाँ वक्ता की अपनी संतानों के लिए है। आधुनिक हिन्दी में ‘हे मेरे बच्चो!’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἄγαμοι
  choice: अविवाहित
  rationale: ἄγαμοι का सीधा अर्थ विवाह न किए हुए है; ‘अविवाहित’ स्पष्ट और स्रोत के निकट है।
- source_word: γαμήσαντες
  choice: विवाह करके
  rationale: यह एओरिस्ट कृदन्त उन संतानों को अलग करता है जिन्होंने विवाह किया था। ‘विवाह करके’ कृदन्त की क्रियात्मकता बनाए रखता है।
- source_word: ἄνοιντοι
  choice: संतानहीन
  rationale: दुर्लभ शब्द का प्रसंगगत अर्थ सम्भवतः ‘संतान से रहित’ है, क्योंकि अगली पंक्ति में वक्ता कहती है कि वह उनके बच्चों को नहीं देखेगी। जैविक अक्षमता का संकेत देने वाला ‘बाँझ’ यहाँ अनुचित रूप से विशिष्ट होता।
- source_word: οὐκ ὄψομαι ὑμῶν τέκνα
  choice: मैं तुम्हारे बच्चों को नहीं देखूँगी
  rationale: यह अगली पीढ़ी, अर्थात वक्ता के नाती-पोतों, को सीधे पारिवारिक भाषा में व्यक्त करता है और यूनानी वाक्यरचना के निकट रहता है।
- source_word: μάμμη
  choice: दादी
  rationale: μάμμη दादी/नानी के लिए आत्मीय पारिवारिक शब्द है। हिन्दी में लिंग-निरपेक्ष एकल सामान्य शब्द न होने के कारण ‘दादी’ सहज है, पर मूल यह नहीं बताता कि संतान पुत्र की होगी या पुत्री की।
- source_word: κληθεῖσα μακαρισθήσομαι
  choice: दादी कहलाकर धन्य मानी जाऊँगी
  rationale: κληθεῖσα ‘कहलाकर’ और μακαρισθήσομαι दूसरों द्वारा धन्य या भाग्यशाली माने जाने का भाव देता है। ‘धन्य मानी जाऊँगी’ इस सामाजिक मान्यता को सुरक्षित रखता है।
