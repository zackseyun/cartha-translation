  source_fidelity: 'The draft preserves the central contrast: the speaker bore seven children yet laments that she has become mother of none. ‘अब’ appropriately conveys the perfect’s present resultant state without adding a doctrinal interpretation. However, the opening ‘मैं कैसी दुखियारी’ is syntactically and stylistically less natural in modern standard Hindi, and it does not express ἔγωγε’s emphatic ‘indeed’ as clearly as it could.'
  naturalness: ‘दुखियारी’ and the construction ‘मैं कैसी दुखियारी’ sound somewhat colloquial/dated and leave the exclamation grammatically incomplete. A finite verb and ‘सचमुच’ give the lament a clear, dignified modern-Hindi form while retaining its heightened register. The deliberately unusual ‘बार-बार तीन गुना अभागी’ retains the Greek intensification.
  terminology: ‘दयनीय’ accurately represents μελέα, ‘अभागी’ suitably renders the intensified τρισαθλία, ‘बच्चों’ preserves the lexical breadth of παῖδας, and ‘किसी की माँ नहीं रही’ naturally conveys the paradoxical resultant state of γεγένημαι.
  issues:
