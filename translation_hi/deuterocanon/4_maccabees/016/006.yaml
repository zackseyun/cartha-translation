base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/006.yaml
  text: Alas for me indeed[a], thrice-wretched many times over[b]! Though I bore seven children[c], I have become the mother of none.
translation:
  language: hi
  text: हाय, मैं सचमुच दयनीय हूँ[a]—बार-बार तीन गुना अभागी[b]! सात बच्चों को जन्म देने पर भी, अब मैं किसी की माँ नहीं रही[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हाय, मैं कितनी दयनीय स्त्री हूँ!” यूनानी में यह अपने ही लिए किया गया विलाप है; “सचमुच” वक्ता के आत्म-संदर्भ पर बल को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बार-बार तीन गुना अभागी”; यह शोक को अत्यन्त तीव्र करने वाली अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: c
    text: या, “सात पुत्रों को।” यूनानी शब्द का अर्थ “बच्चे” या “पुत्र” हो सकता है; प्रसंग में वे पुरुष संतान हैं। अंतिम वाक्य में यूनानी पूर्णकाल वर्तमान परिणामी दशा पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μελέα ἔγωγε
  choice: हाय, मैं कैसी दुखियारी
  rationale: Ὦ विस्मयादिबोधक आत्म-विलाप है, μελέα स्त्रीलिंग में वक्ता की दयनीय दशा व्यक्त करता है, और ἔγωγε आत्म-संदर्भ पर बल देता है। यह हिंदी रूप स्वाभाविक रहते हुए तीनों तत्वों का भाव रखता है।
- source_word: πολλάκις τρισαθλία
  choice: बार-बार तीन गुना अभागी
  rationale: πολλάκις की पुनरावृत्त तीव्रता और τρισαθλία की असामान्य ‘तीन गुना अत्यन्त अभागी’ छवि दोनों को बनाए रखा गया है; इसे केवल ‘बहुत अभागी’ करने से यूनानी अभिव्यक्ति की तीक्ष्णता घट जाती।
- source_word: ἥτις
  choice: फिर भी
  rationale: यह आत्म-संदर्भित संबंधवाचक खंड विलाप का कारण बताता है और प्रसंग में विरोधात्मक अथवा रियायती बल ग्रहण करता है। हिंदी में ‘फिर भी’ जन्म देने और अब मातृत्व से वंचित होने के विरोध को सहज बनाता है।
- source_word: ἑπτὰ παῖδας
  choice: सात बच्चों
  rationale: παῖδας का अर्थ ‘बच्चे’ या ‘पुत्र’ हो सकता है। ‘बच्चों’ से मूल की व्यापक शब्दार्थ-संभावना सुरक्षित रहती है, जबकि प्रसंग उनके पुत्र होने को स्पष्ट करता है।
- source_word: τεκοῦσα
  choice: जन्म दिया
  rationale: τίκτω के कृदन्त में प्रसव का स्पष्ट मातृ-संबंधी अर्थ है; ‘जन्म दिया’ आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: οὐδενὸς μήτηρ γεγένημαι
  choice: अब मैं किसी की माँ नहीं रही
  rationale: γεγένημαι का पूर्णकाल वर्तमान परिणामी दशा बताता है। ‘नहीं रही’ सात बच्चों को जन्म देने और अब उन सबसे वंचित होने का मार्मिक विरोधाभास सुरक्षित रखता है; ‘अब’ इसी परिणामी अवस्था को स्पष्ट करता है।
theological_decisions:
- issue: सात बच्चों को जन्म देने के बाद स्वयं को किसी की माँ न मानने का विलाप
  choice: 'इसे शोकजनित विरोधाभास के रूप में रखा गया है: उसने सात बच्चों को जन्म दिया था, पर उनकी मृत्यु के बाद अब वह किसी की माँ नहीं रही।'
  alternative: इसे सपाट रूप से ‘मैं किसी की माँ नहीं हूँ’ कहा जा सकता था।
  rationale: यूनानी पूर्णकाल γεγένημαι परिणामी वर्तमान अवस्था पर बल देता है। ‘नहीं रही’ मातृत्व के ऐतिहासिक तथ्य और वर्तमान वियोग के बीच तनाव को बिना किसी अतिरिक्त धर्मसैद्धान्तिक व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का भावपूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। मूल यूनानी की तीव्र, कुछ असामान्य ‘तीन गुना’ अभिव्यक्ति और अंतिम शोकपूर्ण विरोधाभास को जानबूझकर बनाए रखा गया है।
