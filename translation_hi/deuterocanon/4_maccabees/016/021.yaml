  yaml_path: translation/deuterocanon/4_maccabees/016/021.yaml
  text: And Daniel the righteous man was thrown to the lions[a]; and Hananiah and Azariah and Mishael were hurled into a furnace of fire[b], and they endured because of God.
translation:
  language: hi
  text: और धर्मी दानिय्येल को सिंहों के बीच फेंक दिया गया[a]; और हनन्याह, अजर्याह और मीशाएल[b] को आग की भट्ठी में जोर से फेंक दिया गया[c], और उन्होंने परमेश्वर के कारण धीरज से सहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में केवल ‘सिंहों के बीच’ है; ‘सिंहों की माँद’ प्रसंग से समझी जाती है, पर यहाँ ‘माँद’ शब्द नहीं आया है।
    reason: source_clarity
  - marker: b
    text: ये तीनों युवकों के इब्रानी नाम हैं। वे शद्रक, मेशक और अबेदनगो नामों से भी जाने जाते हैं।
    reason: name_equivalence
  - marker: c
    text: यूनानी अभिव्यक्ति का शाब्दिक रूप ‘आग की भट्ठी’ है; परंपरागत रूप से इसे ‘धधकती भट्ठी’ भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: धर्मी
  rationale: संज्ञा के समान प्रयुक्त यह विशेषण दानिय्येल का नैतिक-धार्मिक चरित्र बताता है। ‘धर्मी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: εἰς λέοντας
  choice: सिंहों के बीच
  rationale: यूनानी में ‘माँद’ शब्द नहीं है। ‘सिंहों के बीच’ लक्ष्य और संकट दोनों व्यक्त करता है, बिना स्रोत से बाहर की बात जोड़े।
- source_word: ἐβλήθη
  choice: फेंक दिया गया
  rationale: βάλλω के अओरिस्ट कर्मवाच्य का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: ἀπεσφενδονήθησαν
  choice: जोर से उछालकर फेंक दिया गया
  rationale: यह क्रिया साधारण ‘फेंकने’ से अधिक प्रबल और हिंसक गति का बोध कराती है; इसीलिए पहले प्रयुक्त ἐβλήθη से भेद रखा गया है।
- source_word: εἰς κάμινον πυρὸς
  choice: आग की भट्ठी में
  rationale: κάμινος और πυρός दोनों को स्पष्ट रखते हुए यूनानी संरचना के निकट और सहज हिन्दी अनुवाद।
- source_word: ὑπέμειναν
  choice: धीरज धरकर सब सहा
  rationale: क्रिया कठिन परीक्षा में टिके रहने और कष्ट सहने, दोनों भाव रखती है। यह रूप उस दृढ़ सहनशीलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τὸν θεόν
  choice: परमेश्वर के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा प्रेरक आधार दर्शाता है। यह अनुवाद उस कारणात्मक संबंध को बनाए रखता है और उसे किसी विशिष्ट doctrinal अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: तीन युवकों के नाम
  choice: हनन्याह, अजर्याह और मीशाएल
  alternative: शद्रक, मेशक और अबेदनगो
  rationale: यूनानी पाठ उनके इब्रानी नामों के रूप देता है; इसलिए मूल-पाठ की प्राथमिकता रखते हुए उन्हीं नामों का लिप्यंतरण किया गया है।
- issue: दानिय्येल के लिए δίκαιος
  choice: धर्मी
  alternative: न्यायी
  rationale: इस आख्यान में शब्द दानिय्येल के नैतिक और परमेश्वर-संबंधी चरित्र का विशेषण है। ‘धर्मी’ इस व्यापक भाव को ‘न्यायी’ से अधिक उपयुक्त रूप में रखता है।
- issue: διὰ τὸν θεόν में सहन करने का आधार
  choice: परमेश्वर के कारण
  alternative: परमेश्वर के लिए
  rationale: यूनानी वाक्यांश कारण और प्रेरणा के बीच कुछ अर्थगत विस्तार रख सकता है। मुख्य पाठ में कारणात्मक रूप चुना गया है, पर इसे बलिदान अथवा प्रतिफल संबंधी किसी संप्रदायगत व्याख्या में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘जोर से उछालकर फेंक दिया गया’ मूल की प्रबल क्रिया को दर्शाता है, जबकि ‘धीरज धरकर सब सहा’ स्थिर सहनशीलता का भाव स्पष्ट करता है।
