lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: इसलिए तुम भी
  rationale: καί की संबद्धता, οὖν का निष्कर्षात्मक भाव और ὑμεῖς का बल आधुनिक, स्वाभाविक हिन्दी में इस क्रम से व्यक्त होता है।
- source_word: τὴν αὐτὴν πίστιν
  choice: वही विश्वास
  rationale: πίστις यहाँ पहले वर्णित लोगों के समान परमेश्वर की ओर उन्मुख विश्वास या भरोसे को दर्शाता है। ‘विश्वास’ व्यापक अर्थ और धार्मिक संदर्भ दोनों को बनाए रखता है।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वर के प्रति
  rationale: πρός के संबंध और उन्मुखता के भाव को ‘के प्रति’ निकटता से व्यक्त करता है; यह केवल स्थान या साधारण कर्म-संबंध नहीं बताता।
- source_word: ἔχοντες
  choice: रखते हुए
  rationale: 'वर्तमान कृदन्त का समकालिक परिस्थितिजन्य भाव सुरक्षित रहता है: उसी विश्वास को रखते हुए उन्हें यह आज्ञा दी जाती है।'
- source_word: μὴ χαλεπαίνητε
  choice: दुःखी न हो
  rationale: χαλεπαίνω पीड़ा, खिन्नता, झुँझलाहट या कड़वाहट का भाव दे सकता है। इस सांत्वनापरक संदर्भ में ‘दुःखी न हो’ स्वाभाविक है और अर्थ को केवल क्रोध तक सीमित नहीं करता।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: यहाँ श्रोताओं की परमेश्वर के प्रति वही स्थिर मनोवृत्ति अभिप्रेत है जो पहले वर्णित लोगों में थी। ‘विश्वास’ इस धार्मिक और संबंधपरक विस्तार को बनाए रखता है; ‘भरोसा’ संभावित अर्थछाया है, जबकि ‘विश्वासयोग्यता’ इस संदर्भ में कम संभावित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संबोधनात्मक शैली अपनाई गई है। बहुवचन ὑμεῖς और बहुवचन आज्ञार्थक को प्रसंगानुकूल ‘तुम ... न हो’ से व्यक्त किया गया है।
