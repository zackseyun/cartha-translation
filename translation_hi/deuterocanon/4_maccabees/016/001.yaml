  yaml_path: translation/deuterocanon/4_maccabees/016/001.yaml
  text: If[a], then, even a woman—an old woman and a mother of children—endured the tortures up to death while seeing the sufferings of her children, godly reason is master of the passions.
translation:
  language: hi
  text: तो फिर, यदि एक स्त्री भी—एक वृद्धा और बच्चों की माँ—विलाप करते अपने बच्चों को देखते हुए मृत्यु तक की यातनाएँ सह लीं, तो ईश्वरभक्त विवेक मनोवेगों का स्वामी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δὲ τοίνυν
  choice: तो फिर यदि
  rationale: यह पदबंध पिछले तर्क से निष्कर्षात्मक और बलपूर्ण संबंध जोड़ता है। ‘तो फिर यदि’ उस तार्किक प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γυνὴ καὶ γεραιὰ καὶ ἐπὶ παιδῶν μήτηρ
  choice: एक स्त्री ने भी—जो वृद्ध थी और बच्चों की माँ थी—
  rationale: अनुवाद स्त्री होने, वृद्ध होने और माँ होने—तीनों बातों पर यूनानी पाठ के क्रमिक बल को बनाए रखता है। παῖδες को मुख्य पाठ में अनावश्यक रूप से ‘पुत्र’ तक सीमित नहीं किया गया।
- source_word: ὑπέμεινεν
  choice: सह लीं
  rationale: यह क्रिया कठिन यातनाओं के नीचे दृढ़तापूर्वक टिके रहने को व्यक्त करती है; ‘सह लीं’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τὰς μέχρι θανάτου βασάνους
  choice: मृत्यु तक की यातनाएँ
  rationale: βασάνοι यहाँ सामान्य दुःख नहीं, दी गई यातनाएँ हैं; μέχρι θανάτου उनकी अंतिम सीमा को मृत्यु तक बताता है।
- source_word: ὁρῶσα τῶν τέκνων· ὁλολυγμένων
  choice: अपने बच्चों की पीड़ा देखते हुए
  rationale: प्रेषित यूनानी वाक्य-विन्यास संक्षिप्त और कठिन है। मुख्य पाठ प्रसंगगत दृश्य को सहज हिन्दी में व्यक्त करता है, जबकि बच्चों के ऊँचे स्वर में रोने या विलाप करने का अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: αὐτοκράτωρ
  choice: स्वामी
  rationale: विधेय के रूप में यह शब्द पूर्ण अधिकार या प्रभुता को दर्शाता है। ‘स्वामी’ पुस्तक के दार्शनिक तर्क में संक्षिप्त और गरिमापूर्ण है।
- source_word: τῶν παθῶν
  choice: मनोवेगों का
  rationale: πάθη इस पुस्तक में ऐसे प्रबल आवेगों और वासनात्मक प्रवृत्तियों का दार्शनिक पद है जिन पर विवेक शासन करता है। ‘मनोवेग’ इसे केवल तटस्थ ‘भावनाओं’ तक सीमित नहीं करता।
- source_word: ὁ εὐσεβὴς λογισμός
  choice: ईश्वरभक्त विवेक
  rationale: 'यह पुस्तक का प्रमुख पद है: ऐसा विवेक जो परमेश्वर के प्रति भक्ति और श्रद्धा से संचालित है। ‘ईश्वरभक्त विवेक’ इसके धार्मिक और तार्किक दोनों पहलुओं को सुलभ हिन्दी में रखता है।'
theological_decisions:
- issue: 4 मकाबियों में λογισμός का दार्शनिक-धार्मिक अर्थ
  choice: ईश्वरभक्त विवेक
  alternative: भक्तिपूर्ण तर्कबुद्धि
  rationale: पुस्तक का दावा मात्र मानवीय बुद्धि की स्वायत्त शक्ति के बारे में नहीं, बल्कि परमेश्वर-भक्ति से निर्मित विवेक के बारे में है। चुना हुआ रूप दोनों पहलुओं को रखता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: παθήματα/πάθη-संबंधी विचार में विवेक की प्रभुता
  choice: मनोवेगों का स्वामी है
  alternative: मनोवेगों पर अधिकार रखता है
  rationale: ‘स्वामी है’ αὐτοκράτωρ की प्रबल विधेयात्मक भाषा को बनाए रखता है, बिना यह अतिरिक्त दावा किए कि मनोवेग समाप्त हो जाते हैं; पाठ केवल उन पर प्रभुता की बात करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। वाक्य की तर्कात्मक ‘यदि…तो…’ संरचना और स्त्री, वृद्धा तथा माँ होने पर क्रमिक बल सुरक्षित हैं। तकनीकी पदों के लिए ‘ईश्वरभक्त विवेक’ और ‘मनोवेग’ चुने गए हैं, ताकि पाठ साधारण पाठकों के लिए बोधगम्य रहे और मूल की दार्शनिक धार भी बनी रहे।
