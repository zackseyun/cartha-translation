  yaml_path: translation/deuterocanon/4_maccabees/010/002.yaml
  text: But he cried out and said[a], “Do you not know that the same father sowed me among those who die, and the same mother gave birth to me, and I was brought up in the same principles?”
translation:
  language: hi
  text: पर उसने ऊँची आवाज़ में कहा, “क्या तुम नहीं जानते कि उसी पिता ने मुझे भी मरे हुओं के साथ बोया[a], उसी माता ने मुझे जन्म दिया, और उन्हीं सिद्धांतों में मेरा पालन-पोषण हुआ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में मानव उत्पत्ति के लिए खेती का रूपक है: पिता ने मानो बीज ‘बोया’।'
    reason: मूल के जनन-संबंधी कृषि-रूपक को स्पष्ट करना।
lexical_decisions:
- source_word: ἀναβοήσας
  choice: ऊँची आवाज़ में कहा
  rationale: यह कृदंत ऊँची और तीव्र आवाज़ में बोलने को दर्शाता है। हिन्दी में यह अभिव्यक्ति स्वाभाविक ढंग से उसकी प्रबल पुकार को व्यक्त करती है।
- source_word: ἀγνοεῖτε
  choice: क्या तुम नहीं जानते
  rationale: मूल में उलाहने के भाव वाला आलंकारिक प्रश्न है; यह हिन्दी रूप उसके बल और स्वाभाविकता दोनों को बनाए रखता है।
- source_word: τοῖς ἀποθανοῦσιν
  choice: उन लोगों के साथ ... जो मर चुके हैं
  rationale: ἀποθανοῦσιν अओरिस्ट कृदंत है और इस प्रसंग में पहले मारे जा चुके लोगों की ओर संकेत करता है। इसलिए इसे केवल सामान्य ‘मरणहार लोगों’ के रूप में नहीं किया गया।
- source_word: ἔσπειρεν
  choice: बोया
  rationale: क्रिया का शाब्दिक अर्थ बीज बोना है और यहाँ वह मानव उत्पत्ति के लिए रूपक है। असामान्य किंतु समझ में आने वाला ‘बोया’ मूल बिंब को सुरक्षित रखता है।
- source_word: πατήρ
  choice: पिता
  rationale: यह सामान्य पारिवारिक संबोधन है और समान पितृत्व पर बल देता है।
- source_word: μήτηρ
  choice: माता
  rationale: यह पिता के साथ समानांतर पारिवारिक पद है और समान मातृत्व को व्यक्त करता है।
- source_word: ἐγέννησεν
  choice: जन्म दिया
  rationale: माता के कार्य को व्यक्त करने वाला यह आधुनिक हिन्दी का स्वाभाविक और सटीक रूप है।
- source_word: ἀνετράφην
  choice: मेरा पालन-पोषण हुआ
  rationale: निष्क्रिय क्रिया शारीरिक देखभाल के साथ शिक्षात्मक गठन को भी समेटती है; ‘पालन-पोषण हुआ’ इसका सहज हिन्दी समतुल्य है।
- source_word: δόγμασιν
  choice: सिद्धांतों
  rationale: प्रसंग में यह उन साझा धार्मिक और नैतिक मान्यताओं को सूचित करता है जिनके अनुसार वक्ता और अन्य पुत्र पाले गए थे। ‘सिद्धांत’ कानूनी ‘आदेशों’ की अपेक्षा अधिक उपयुक्त है।
- source_word: ἐπὶ τοῖς αὐτοῖς
  choice: उन्हीं ... के अनुसार
  rationale: यहाँ पूर्वसर्ग पालन-पोषण के आधार या मानक को व्यक्त करता है; हिन्दी में ‘के अनुसार’ उस संबंध को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: पिता के कार्य ἔσπειρεν का जनन-संबंधी रूपक
  choice: ‘बोया’ के द्वारा कृषि-रूपक को बनाए रखा गया।
  alternative: ‘उत्पन्न किया’ या ‘जन्म दिया’
  rationale: मूल यूनानी पिता की जनन-भूमिका को बीज बोने के रूपक से व्यक्त करता है। उसे सपाट कर देने के बजाय पाठ में रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
- issue: τοῖς ἀποθανοῦσιν का कालगत अर्थ
  choice: ‘जो मर चुके हैं’
  alternative: ‘जो मरते हैं’ अथवा ‘मरणहार लोगों’
  rationale: यह अओरिस्ट कृदंत है, इसलिए पहले मर चुके व्यक्तियों का संकेत व्याकरण और प्रसंग दोनों से अधिक संभावित है। इससे सामान्य मानव मरणशीलता का अर्थ अनावश्यक रूप से आरोपित नहीं होता।
- issue: δόγμασιν की धार्मिक-नैतिक व्यापकता
  choice: ‘सिद्धांतों’
  alternative: ‘शिक्षाओं’ या ‘आदेशों’
  rationale: ‘सिद्धांत’ साझा मान्यताओं और जीवन-निर्देशक धारणाओं को समेटता है, बिना उन्हें केवल कानूनी आदेश या किसी विशिष्ट सम्प्रदाय की शिक्षा बना देने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘माता’ और ‘पालन-पोषण’ गरिमापूर्ण शैली देते हैं, जबकि ‘बोया’ की जानबूझकर रखी गई असामान्यता मूल यूनानी रूपक को सुरक्षित रखती है।
