translation:
  language: hi
  text: यदि सचमुच तुममें मानवीय स्नेह होता[a] और तुम्हें परमेश्वर से छुटकारे की आशा होती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवीय लगाव” अथवा “मानवीय अभिलाषाएँ।” यूनानी वाक्यांश संक्षिप्त है और मनुष्यों में सामान्य भावनात्मक लगाव की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उद्धार।” यूनानी शब्द तात्कालिक छुटकारे या व्यापक उद्धार—दोनों को सूचित कर सकता है; यहाँ तत्काल प्रसंग के कारण “छुटकारा” रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπερ
  choice: यदि सचमुच
  rationale: यह सशर्त अर्थ के साथ बल भी व्यक्त करता है; ‘यदि सचमुच’ उस आलंकारिक चुनौती को बनाए रखता है।
- source_word: ἠσθάνου … πόθων
  choice: तुममें … स्नेह होता
  rationale: αἰσθάνομαι यहाँ केवल बौद्धिक बोध नहीं, बल्कि भावनात्मक ग्रहणशीलता सूचित करता है; πόθος लगाव, लालसा या स्नेह का भाव रखता है। स्वाभाविक हिन्दी में संयुक्त वाक्यांश को ‘तुममें … स्नेह होता’ कहा गया है।
- source_word: ἀνθρώπους
  choice: मानवीय
  rationale: दिए गए संक्षिप्त और कुछ असामान्य यूनानी वाक्यांश में इसे मनुष्यों में सामान्य भावनात्मक लगाव के अर्थ में समझा गया है।
- source_word: ἐλπίδα
  choice: आशा
  rationale: यह शब्द अपेक्षा या आशा को दर्शाता है; प्रसंग में ‘आशा’ सहज और सटीक है।
- source_word: παρὰ θεῷ
  choice: परमेश्वर से
  rationale: παρά के संबंधसूचक भाव को यहाँ उस छुटकारे के स्रोत या आधार के रूप में व्यक्त किया गया है जिसकी आशा परमेश्वर से है।
- source_word: σωτηρίου
  choice: छुटकारे
  rationale: शब्द का अर्थ उद्धार या बचाव दोनों हो सकता है; यातना और मृत्यु के तात्कालिक प्रसंग में ‘छुटकारा’ उपयुक्त है, जबकि व्यापक अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: σωτηρίου का तात्कालिक बचाव या व्यापक उद्धार के रूप में अनुवाद
  choice: छुटकारा
  alternative: उद्धार
  rationale: स्थानीय प्रसंग में यातना से बचाए जाने की आशा प्रमुख है। ‘छुटकारा’ उसी पर बल देता है, पर यूनानी शब्द के व्यापक उद्धार-संबंधी अर्थ को नकारता नहीं।
- issue: παρὰ θεῷ में आशा का स्रोत या परमेश्वर के पास स्थित होना
  choice: परमेश्वर से
  alternative: परमेश्वर के यहाँ
  rationale: दोनों संबंध यूनानी में संभव हैं, किंतु हिन्दी में ‘परमेश्वर से छुटकारे की आशा’ अधिक स्वाभाविक है और आशा के दिव्य स्रोत को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य की अधूरी सशर्त संरचना को मूल यूनानी की आलंकारिक शैली के अनुरूप बनाए रखा गया है। ‘मानवीय स्नेह’ सामान्य मानवीय लगाव को व्यक्त करता है, जबकि संभावित अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
