base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/023.yaml
  text: But I myself came forward of my own accord[a], so that by killing me also, you may incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: hi
  text: किन्तु मैं तो स्वयं अपनी इच्छा से आगे आया, ताकि तुम मेरी भी हत्या करके और भी अधिक अपराधों के लिए स्वर्गीय न्याय[a] से दण्ड के उत्तरदायी ठहरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्ग का न्याय’ अथवा ‘स्वर्गीय न्याय-निर्णय।’ यूनानी में यहाँ परमेश्वर का स्पष्ट नाम नहीं है, बल्कि स्वर्ग से सम्बद्ध पारलौकिक न्याय का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθον
  choice: आगे आया
  rationale: सन्दर्भ में वक्ता स्वेच्छा से अत्याचारी और जल्लादों के सामने अपने को प्रस्तुत करता है। ‘आगे आया’ इस उद्देश्यपूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπʼ ἐμαυτοῦ
  choice: अपनी इच्छा से
  rationale: यह पदबंध स्वयं प्रेरित और स्वैच्छिक कार्य को व्यक्त करता है; ‘अपनी इच्छा से’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: κατακτείνας
  choice: मार डालकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया के साथ साधन या सहगामी परिस्थिति दर्शाता है। ‘मार डालकर’ अनावश्यक रूप से समय-क्रम निश्चित किए बिना यह सम्बन्ध बनाए रखता है।
- source_word: ὀφλήσῃς
  choice: दण्ड के भागी बनो
  rationale: क्रिया का अर्थ किसी देनदारी या दण्ड का उत्तरदायी होना है। न्यायिक सन्दर्भ में ‘दण्ड के भागी बनो’ स्वाभाविक हिन्दी में दण्डाधीन होने का भाव देता है।
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: स्वर्गीय न्याय से
  rationale: δίκη यहाँ न्याय, न्यायिक प्रतिफल या दण्डकारी व्यवस्था का बोध करा सकता है। ‘स्वर्गीय न्याय’ पारलौकिक आशय को बनाए रखता है और यूनानी से अधिक स्पष्ट रूप से परमेश्वर का नाम नहीं जोड़ता।
- source_word: τιμωρίαν
  choice: दण्ड
  rationale: यह शब्द अपराध के दण्डात्मक परिणाम को दर्शाता है। ‘दण्ड’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में स्पष्ट है।
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: और अधिक अपराधों के लिए
  rationale: ἀδίκημα अन्यायपूर्ण कृत्य या अपराध है, और πλειόνων अपराधों की बढ़ती संख्या अथवा संचय का संकेत देता है। यह अनुवाद उसी नैतिक-न्यायिक स्वर को बनाए रखता है।
theological_decisions:
- issue: τῇ οὐρανίᾳ δίκῃ में स्वर्ग से सम्बद्ध नैतिक न्याय का निरूपण
  choice: स्वर्गीय न्याय
  alternative: ईश्वरीय न्याय
  rationale: मूल यूनानी पारलौकिक, स्वर्ग-सम्बद्ध न्याय की ओर संकेत करता है, पर यहाँ परमेश्वर का स्पष्ट नाम नहीं लेता। ‘स्वर्गीय न्याय’ इस संयम और सम्भावित व्यक्तिकरण को बनाए रखता है; ‘ईश्वरीय न्याय’ आशय को आवश्यकता से अधिक स्पष्ट कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘किन्तु मैं तो स्वयं’ मूल के αὐτός और विरोधसूचक δέ के बल को व्यक्त करता है; ‘दण्ड के भागी बनो’ न्यायिक देनदारी को सहज हिन्दी में रखता है।
