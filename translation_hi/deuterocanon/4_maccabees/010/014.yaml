  yaml_path: translation/deuterocanon/4_maccabees/010/014.yaml
  text: But he said to them[a], “The fire you have against me is not so scorching as to make me a coward.”
translation:
  language: hi
  text: परन्तु उसने उनसे कहा, “मेरे विरुद्ध तुम्हारी आग इतनी झुलसानेवाली नहीं है कि मुझे कायर बना दे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझसे कायर की तरह व्यवहार करा दे”; अधिक शाब्दिक रूप से, “मुझे पुरुषोचित साहस से रहित कर दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ αὐτοῖς ἔφη
  choice: परन्तु उसने उनसे कहा
  rationale: δέ यहाँ यातना देने वालों के सामने उसके निर्भीक प्रत्युत्तर को हल्के विरोध के साथ आगे बढ़ाता है; इसलिए ‘परन्तु’ स्वाभाविक है।
- source_word: καυστικώτερον
  choice: इतनी दहकती
  rationale: καυστικός आग की जलाने या झुलसाने वाली तीव्रता व्यक्त करता है। οὐχ οὕτω ... ὥστε की मात्रा-परिणाम संरचना के भीतर ‘इतनी दहकती नहीं कि’ हिन्दी में स्वाभाविक है।
- source_word: ἔχετε ... κατʼ ἐμοῦ τὸ πῦρ
  choice: जो आग तुमने मेरे विरुद्ध तैयार की है
  rationale: वाक्यांश यातना की वास्तविक आग और उसकी शत्रुतापूर्ण दिशा, दोनों को बनाए रखता है। हिन्दी में केवल ‘मेरे विरुद्ध तुम्हारे पास जो आग है’ अस्वाभाविक होता; ‘तैयार की है’ प्रसंगानुकूल रूप से ἔχετε का भाव व्यक्त करता है, यद्यपि यूनानी में ‘तैयार’ का पृथक शब्द नहीं है।
- source_word: δειλανδρῆσαι
  choice: मुझे कायर बना दे
  rationale: क्रिया का अर्थ साहसहीन या कायर बना देना है। यह चयन उसके कारणवाचक बल को स्पष्ट रखता है और व्युत्पत्तिगत पुरुषत्व-संबंधी संकेत को मुख्य पाठ में अनावश्यक रूप से नहीं उभारता।
- source_word: οὐχ οὕτω ... ὥστε
  choice: इतनी ... नहीं कि
  rationale: यह यूनानी की मात्रा और अपेक्षित परिणाम वाली संरचना का सहज आधुनिक हिन्दी समकक्ष है।
theological_decisions:
- issue: δειλανδρῆσαι में ‘कायर बनाने’ और व्युत्पत्तिगत रूप से ‘पुरुषोचित साहस से रहित करने’ के बीच अर्थ-संबंध
  choice: मुझे कायर बना दे
  alternative: मुझसे कायरों जैसा व्यवहार करा दे; मुझे पुरुषोचित साहस से रहित कर दे
  rationale: प्रसंग यातना के बीच नैतिक साहस का है, न कि पुरुषत्व पर कोई धर्मवैज्ञानिक कथन। मुख्य पाठ अर्थ को स्पष्ट और वर्तमान हिन्दी में स्वाभाविक रखता है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और मौखिक प्रत्युत्तर जैसा स्वर रखा गया है। ‘दहकती’ आग की ठोस छवि बनाए रखता है, जबकि ‘कायर बना दे’ साधारण पाठक के लिए तुरंत बोधगम्य है।
