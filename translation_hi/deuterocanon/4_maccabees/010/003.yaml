  text: I will not renounce the noble kinship of our brotherhood[a].
translation:
  language: hi
  text: मैं भाइयों के गौरवपूर्ण पारिवारिक बंधन से मुकरूँगा नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं भाई-बहनों के गौरवपूर्ण पारिवारिक बंधन से मुकरूँगा नहीं।”
    reason: ἀδελφότης का अर्थ ‘भाईचारा’ हो सकता है, पर पारिवारिक प्रसंग में इसे व्यापक रूप से सहोदर-बंधुत्व भी समझा जा सकता है।
lexical_decisions:
- source_word: οὐκ
  choice: नहीं
  rationale: यूनानी निषेध को भविष्यकालीन क्रिया के साथ सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἐξόμνυμαι
  choice: त्यागूँगा
  rationale: क्रिया यहाँ किसी संबंध को नकारने, उससे मुकरने या उसका परित्याग करने का भाव रखती है। ‘त्यागूँगा’ संबंध-विच्छेद के आशय को स्वाभाविक हिन्दी में व्यक्त करता है, बिना शपथ लेने के अर्थ को अनावश्यक रूप से प्रमुख बनाए।
- source_word: εὐγενῆ
  choice: गौरवपूर्ण
  rationale: εὐγενής में उत्तम वंश और सम्माननीय गुण, दोनों की छाया हो सकती है। ‘गौरवपूर्ण’ यहाँ नाते की गरिमा को व्यक्त करता है और आधुनिक हिन्दी में ‘कुलीन’ की वर्गगत ध्वनि से बचता है।
- source_word: τῆς ἀδελφότητος
  choice: हमारे भाईचारे के
  rationale: ἀδελφότης भाइयों के बीच के बंधुत्व को दर्शाता है। प्रसंग में वक्ता अपने ही भाइयों से संबंध की बात करता है, इसलिए हिन्दी में स्वाभाविकता के लिए ‘हमारे’ रखा गया है।
- source_word: συγγένειαν
  choice: पारिवारिक नाते
  rationale: συγγένεια रक्त-संबंध या पारिवारिक रिश्तेदारी को सूचित करता है। ‘पारिवारिक नाता’ इसका सहज और स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: ἀδελφότης का लिंग-सूचक पारिवारिक अर्थ
  choice: भाईचारा
  alternative: भाई-बहनों का बंधन
  rationale: इस प्रसंग में वक्ता शहीद परिवार के भाइयों में से एक है; इसलिए मूल के पुल्लिंग पारिवारिक शब्द को ‘भाईचारा’ से बनाए रखा गया है। व्यापक ‘सहोदरता’ की संभावना पादटिप्पणी में दी गई है।
- issue: संबंध को नकारने की क्रिया में शपथ का संभावित भाव
  choice: त्यागूँगा
  alternative: मुकरूँगा / शपथपूर्वक इनकार करूँगा
  rationale: ἐξόμνυμαι में शपथपूर्वक नकारने का व्युत्पत्तिगत या प्रसंगानुसार भाव संभव है, पर यहाँ मुख्य बल पारिवारिक नाते को अस्वीकार न करने पर है। इसलिए शपथ का अर्थ मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘गौरवपूर्ण पारिवारिक नाता’ मूल के वंशगत तथा सम्मानसूचक दोनों आयामों को बनाए रखता है; ‘भाईचारा’ प्रसंग के पुरुष सहोदरों को स्पष्ट करता है।
