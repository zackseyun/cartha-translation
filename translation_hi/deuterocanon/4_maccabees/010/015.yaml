  yaml_path: translation/deuterocanon/4_maccabees/010/015.yaml
  text: By the blessed death of my brothers[a], and by the tyrant’s eternal destruction, and by the everlasting life of the godly[b], I will not renounce my noble brotherhood.
translation:
  language: hi
  text: मेरे भाइयों की धन्य मृत्यु की शपथ, और उस अत्याचारी के अनन्त विनाश की, और भक्त जनों के चिरस्थायी जीवन की—मैं अपने कुलीन भ्रातृ-बंधन[a] से इनकार नहीं करूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने कुलीन भाईचारे।” यहाँ प्रयुक्त यूनानी शब्द व्यापक भाईचारे को भी सूचित कर सकता है, पर प्रसंग में वक्ता का अपने भाइयों के साथ पारिवारिक और सम्मानपूर्ण बंधन प्रमुख है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अत्याचारी के विनाश और भक्त जनों के जीवन की अवधि के लिए दो अलग, पर अर्थ में बहुत निकट विशेषण प्रयुक्त हुए हैं; यहाँ उन्हें क्रमशः “अनन्त” और “चिरस्थायी” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὰ
  choice: की शपथ
  rationale: यह अव्यय कर्मकारक के साथ दृढ़ शपथ का सूत्र बनाता है। हिन्दी में संज्ञाओं की इस शृंखला के साथ ‘की शपथ’ स्वाभाविक और गंभीर है।
- source_word: μακάριον ... θάνατον
  choice: धन्य मृत्यु
  rationale: μακάριος यहाँ साधारण सुख नहीं, धार्मिक दृष्टि से सम्मानित और धन्य दशा व्यक्त करता है।
- source_word: τῶν ἀδελφῶν μου
  choice: मेरे भाइयों की
  rationale: पुल्लिंग बहुवचन और प्रसंग दोनों वक्ता के पुरुष सहोदरों की ओर संकेत करते हैं।
- source_word: αἰώνιον ... ὄλεθρον
  choice: अनन्त विनाश
  rationale: ὄλεθρος विनाश या सर्वनाश है और αἰώνιος उसकी स्थायी अवधि बताता है; अनुवाद पाठ से आगे बढ़कर उसके स्वरूप की व्याख्या नहीं करता।
- source_word: ἀΐδιον ... βίον
  choice: चिरस्थायी जीवन
  rationale: ἀΐδιος निरंतर और सदा बने रहने का भाव देता है। ‘चिरस्थायी’ αἰώνιος के लिए प्रयुक्त ‘अनन्त’ से हल्का शब्दगत भेद बनाए रखता है, यद्यपि अर्थ बहुत निकट हैं।
- source_word: τῶν εὐσεβῶν
  choice: भक्त जनों के
  rationale: εὐσεβής ईश्वर के प्रति श्रद्धा और धार्मिक निष्ठा रखने वालों को दर्शाता है; ‘भक्त जन’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: οὐκ ἀρνήσομαι
  choice: से इनकार नहीं करूँगा
  rationale: ἀρνέομαι यहाँ अपने संबंध को नकारने या त्यागने से इनकार व्यक्त करता है। ‘से इनकार’ भ्रातृ-बंधन को न मानने का आशय स्वाभाविक हिन्दी में देता है।
- source_word: τὴν εὐγένῃ ἀδελφότητα
  choice: अपने कुलीन भ्रातृ-बंधन
  rationale: ἀδελφότης भाईचारे अथवा भाइयों के पारिवारिक बंधन को और εὐγενής कुलीनता या श्रेष्ठ वंश/चरित्र को व्यक्त करता है। प्रसंगगत स्वत्व को ‘अपने’ से स्पष्ट किया गया है।
theological_decisions:
- issue: अत्याचारी के विनाश और भक्त जनों के जीवन का परलोक-संबंधी विरोध
  choice: अत्याचारी के अनन्त विनाश और भक्त जनों के चिरस्थायी जीवन का सीधा विरोध बनाए रखा गया है।
  alternative: इसे केवल सामान्य नैतिक परिणाम मानना, या किसी विस्तृत परलोक-दण्ड सिद्धान्त के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ अवधि और परिणाम का तीखा विरोध प्रस्तुत करता है, पर उनके स्वरूप का विस्तार नहीं करता। इसलिए अनुवाद न इसे हल्का करता है, न किसी बाद की धर्मवैज्ञानिक प्रणाली को इसमें जोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘भ्रातृ-बंधन’ सामान्य बोलचाल से कुछ ऊँचा पद है, पर इस शहादत-वर्णन की गरिमा और वास्तविक भाइयों के संबंध दोनों को सटीक रूप से सँभालता है। शपथ की त्रिखंडी रचना को अल्पविरामों और दीर्घ विराम से सुरक्षित रखा गया है।
