lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पिछली कही हुई बातों की ओर संकेत करता है; ‘ये बातें’ उसके व्यापक संदर्भ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀκούσας
  choice: जब … ने … सुनीं
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है; हिन्दी में कालवाचक उपवाक्य इसका सहज कथात्मक रूप है।
- source_word: αἱμοβόρος
  choice: खून का प्यासा
  rationale: यह यौगिक शब्द रक्तपात की लालसा का तीखा नैतिक चित्र देता है; यह प्रचलित हिन्दी मुहावरा उसी बल को बनाए रखता है।
- source_word: φονώδης
  choice: हत्यारा
  rationale: यह हत्या करने वाले या हत्यारी प्रवृत्ति वाले चरित्र का बोध कराता है; ‘हत्यारा’ संक्षिप्त और तीखा है।
- source_word: πανμμερώτατος
  choice: अत्यंत क्रूर
  rationale: दुर्लभ परमावधि विशेषण अन्तियोकुस की चरम क्रूरता पर बल देता है; ‘अत्यंत क्रूर’ स्वाभाविक हिन्दी में उस तीव्रता को व्यक्त करता है।
- source_word: ἐκέλευσεν
  choice: आदेश दिया
  rationale: यह अधिकारपूर्वक आज्ञा देने की सामान्य क्रिया है; ‘आदेश दिया’ आधुनिक कथात्मक हिन्दी में उपयुक्त है।
- source_word: τὴν γλῶτταν αὐτοῦ
  choice: उसकी जीभ
  rationale: सर्वनाम पीड़ित व्यक्ति की ओर संकेत करता है, अन्तियोकुस की ओर नहीं; हिन्दी में ‘उसकी जीभ’ मूल की संदर्भगत अस्पष्टता को अनावश्यक रूप से नहीं मिटाता।
- source_word: ἐκτεμεῖν
  choice: काट निकालने
  rationale: क्रिया का अर्थ काटकर बाहर निकालना है; आदेश की रचना में हिन्दी का सकर्मक अनंत रूप निहित कर्ताओं द्वारा कार्य किए जाने को स्वाभाविक रूप से व्यक्त करता है।
