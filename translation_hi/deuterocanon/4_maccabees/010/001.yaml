  text: And after he had endured this death[a], worthy to be sung of, the third was led in[b], being urged much by many to save himself by tasting it.
translation:
  language: hi
  text: और जब उसने उसकी गुणगान के योग्य मृत्यु को धीरज से सह लिया, तब तीसरे को आगे लाया गया। बहुत-से लोग उससे बार-बार आग्रह कर रहे थे कि वह चखकर अपनी जान बचा ले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: अर्थात निषिद्ध भोजन चखकर और इस प्रकार अपना जीवन बचाकर।
    reason: cultural_note
lexical_decisions:
- source_word: ἀοίδιμον
  choice: गुणगान के योग्य
  rationale: यह विशेषण मूलतः ऐसी वस्तु का बोध कराता है जिसका गान किया जाए या जिसकी प्रशंसा में स्मरण किया जाए। यह अनुवाद यूनानी की ऊँची, सम्मानसूचक शैली को बनाए रखता है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: संज्ञा सीधे मृत्यु को सूचित करती है और शहीद के अंत पर मूल पाठ के बल को बनाए रखती है।
- source_word: καρτερήσαντος
  choice: दृढ़ता से सह ली
  rationale: क्रिया दुःख के बीच अटल धीरज और सहनशीलता व्यक्त करती है; केवल ‘सह ली’ की अपेक्षा यह नैतिक बल को अधिक स्पष्ट रखती है।
- source_word: ὁ τρίτος ἤγετο
  choice: तीसरे को आगे लाया गया
  rationale: कर्मवाच्य अभिव्यक्ति को सुरक्षित रखते हुए यह प्रसंग में तीसरे भाई को पूछताछ और यातना के लिए सामने लाए जाने का स्वाभाविक हिन्दी रूप है, बिना गंतव्य को अनावश्यक रूप से निश्चित किए।
- source_word: παρακαλούμενος πολλὰ ὑπὸ πολλῶν
  choice: बहुत-से लोग उससे बार-बार आग्रह कर रहे थे
  rationale: यह रूप πολλὰ की बारंबारता या प्रबलता और ὑπὸ πολλῶν में आग्रह करने वालों की बहुलता—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ὅπως ἀπογευσάμενος σώζοιτο
  choice: कि वह थोड़ा-सा चखकर अपनी जान बचा ले
  rationale: ‘चखकर’ यूनानी कृदंत का साधनात्मक भाव रखता है और ‘अपनी जान बचा ले’ यहाँ σώζοιτο के जीवन-संरक्षण वाले प्रसंगगत अर्थ को स्पष्ट करता है। वस्तु को मुख्य पाठ में निर्दिष्ट न करके यूनानी की अंतर्निहितता सुरक्षित रखी गई है।
theological_decisions:
- issue: ἀοίδιμον θάνατον में शहीद की मृत्यु का ऊँचा सम्मान
  choice: ‘गुणगान के योग्य वह मृत्यु’
  alternative: ‘वह प्रसिद्ध मृत्यु’ या ‘वह स्मरणीय मृत्यु’
  rationale: चुना हुआ रूप मृत्यु की प्रशंसात्मक, काव्यात्मक ऊँचाई को बनाए रखता है, पर बाद की किसी विशिष्ट धर्मसैद्धांतिक श्रेणी को पाठ में नहीं जोड़ता।
- issue: ἀπογευσάμενος का अव्यक्त कर्म
  choice: मुख्य पाठ में केवल ‘चखकर’ कहना और टिप्पणी में निषिद्ध भोजन का संदर्भ स्पष्ट करना
  alternative: मुख्य पाठ में ‘निषिद्ध भोजन चखकर’ जोड़ना
  rationale: यूनानी में चखने की वस्तु कही नहीं गई है, यद्यपि प्रसंग से वह स्पष्ट है। इसलिए मुख्य पाठ मूल की अंतर्निहितता रखता है और पादटिप्पणी पाठक को आवश्यक प्रसंग देती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण शैली में रखी गई है। ‘गुणगान के योग्य’ मूल यूनानी की अलंकृत शहीदी-वर्णन शैली को बचाता है; ‘आगे लाया गया’ और ‘अपनी जान बचा ले’ सामान्य पाठक के लिए स्वाभाविक हैं।
