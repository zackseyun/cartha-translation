  yaml_path: translation/deuterocanon/4_maccabees/010/019.yaml
  text: Look[a], my tongue has been broken; cut it off[b]. For not even by this will you cut out our reasoned judgment.
translation:
  language: hi
  text: देख, मेरी जीभ टूट चुकी है; इसे काट डाल। क्योंकि ऐसा करके भी तू हमारे विवेकपूर्ण संकल्प को काटकर निकाल नहीं सकेगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘हमारे’ है, ‘मेरे’ नहीं। बहुवचन वक्ता की अपने भाइयों या उनके साझा संकल्प के साथ एकता व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: b
    text: अंतिम यूनानी क्रिया का शाब्दिक बिंब ‘जीभ काटना’ है। यहाँ वह रूपक रूप में कहता है कि उसकी जीभ काट देने पर भी उनका विवेकपूर्ण संकल्प न मिटेगा, न निष्प्रभावी होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देख
  rationale: यह सामने की स्थिति की ओर सीधे ध्यान खींचने वाला उद्गार है; ‘देख’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: κέχλασται
  choice: कुचली जा चुकी है
  rationale: 'पूर्णकालिक निष्पन्न अवस्था को व्यक्त करता है: जीभ पहले ही बुरी तरह घायल या कुचली हुई है। यह चयन केवल ‘टूटी’ की अपेक्षा शारीरिक यातना के प्रसंग में अधिक स्वाभाविक है, पर चोट की विधि को अनावश्यक रूप से निश्चित नहीं करता।'
- source_word: ἡ γλῶσσα
  choice: मेरी जीभ
  rationale: यूनानी में निश्चित उपपद के साथ ‘जीभ’ है; प्रसंग में वक्ता अपनी ही जीभ की बात करता है, इसलिए हिन्दी में स्वाभाविक अधिकारसूचक ‘मेरी’ स्पष्ट किया गया है।
- source_word: τέμνε
  choice: इसे काट डाल
  rationale: यह यातना देने वाले को संबोधित आज्ञा है। कर्म पूर्ववर्ती ‘जीभ’ है; ‘इसे’ उसे स्पष्ट करता है और ‘काट डाल’ आज्ञा की हिंसक तीव्रता को बनाए रखता है।
- source_word: οὐ γὰρ παρὰ τοῦτο
  choice: क्योंकि ऐसा करके भी
  rationale: यहाँ उक्त हिंसक कार्य को साधन मानकर उसके निष्फल रहने पर बल है। ‘भी’ उस चुनौतीपूर्ण अर्थ को व्यक्त करता है कि यह करने पर भी उद्देश्य पूरा नहीं होगा।
- source_word: τὸν λογισμὸν
  choice: विवेकपूर्ण संकल्प
  rationale: 4 मक्काबियों में λογισμός केवल अमूर्त बुद्धि नहीं, बल्कि विचार से निर्देशित नैतिक दृढ़ता का प्रमुख विचार है। ‘विवेकपूर्ण संकल्प’ उसके बौद्धिक और अडिग नैतिक दोनों पहलुओं को रखता है।
- source_word: ἡμῶν
  choice: हमारे
  rationale: प्रदत्त यूनानी पाठ में प्रथम पुरुष बहुवचन है। वक्ता अकेला बोल रहा है, फिर भी अनुवाद उसे एकवचन में सामान्यीकृत नहीं करता; बहुवचन उसके भाइयों या साझा निष्ठा के साथ एकजुटता व्यक्त कर सकता है।
- source_word: γλωσσοτομήσεις
  choice: काटकर निकाल नहीं सकेगा
  rationale: यह ‘जीभ काटने’ से बना सजीव संयुक्त क्रिया-पद है और यहाँ λογισμός के विषय में रूपक रूप से प्रयुक्त है। हिन्दी वाक्यांश काटने के शारीरिक बिंब को बचाता है और पूर्णतः मिटा या निष्प्रभावी न कर पाने का आशय देता है।
theological_decisions:
- issue: 4 मक्काबियों के दार्शनिक-धार्मिक प्रसंग में λογισμός का अनुवाद
  choice: विवेकपूर्ण संकल्प
  alternative: विवेक; तर्कशील दृढ़ता; बुद्धि
  rationale: ग्रंथ में यह शब्द विचारशील विवेक द्वारा पीड़ा और आवेगों पर शासन करने वाली नैतिक दृढ़ता को सूचित करता है। चयन केवल बौद्धिक क्षमता या किसी बाद की तकनीकी दार्शनिक धारणा तक अर्थ को सीमित नहीं करता।
- issue: एक वक्ता के बावजूद ἡμῶν का बहुवचन
  choice: हमारे विवेकपूर्ण संकल्प
  alternative: मेरे विवेकपूर्ण संकल्प
  rationale: प्रदत्त मूल पाठ बहुवचन पढ़ता है, इसलिए उसे एकवचन में समरस नहीं किया गया। यह बहुवचन वक्ता की अपने भाइयों और उनकी साझा निष्ठा के साथ एकता को व्यक्त कर सकता है, पर अनुवाद इस व्याख्या को निश्चित नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘तू’ यातना देने वाले को दी गई निर्भीक, टकरावपूर्ण चुनौती को व्यक्त करता है। शारीरिक हिंसा और अंतिम रूपक के बीच शब्द-बिंब का संबंध यथासंभव बनाए रखा गया है।
