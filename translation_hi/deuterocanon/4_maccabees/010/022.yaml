translation:
  language: hi
  text: “हे अत्याचारी, मैं सद्गुण के लिए यातना सहने से इनकार नहीं करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: मैं ... नहीं हटूँगा
  rationale: μέλλω के साथ निषेध भावी इरादे और वर्तमान दृढ़ संकल्प, दोनों को व्यक्त करता है। हिंदी में भविष्यकाल इस प्रसंग में स्वाभाविक और दृढ़ है।
- source_word: τύραννε
  choice: हे अत्याचारी
  rationale: संबोधन रूप उस उत्पीड़क शासक को नैतिक रूप से आरोपित शब्द में सीधे संबोधित करता है; ‘अत्याचारी’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: πρὸς τὸν ... βασανισμόν
  choice: यातना सहने से
  rationale: βασανισμός का अर्थ यातना है। παραιτεῖσθαι के साथ हिंदी में ‘यातना सहने से पीछे हटना’ आने वाली यातना से बचने या इनकार करने का भाव सहजता से देता है।
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: सदाचार के लिए
  rationale: ὑπέρ यहाँ कारण या पक्ष में सहने का भाव देता है, और ἀρετή नैतिक उत्कृष्टता अथवा सद्गुण को सूचित करता है। ‘सदाचार’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: παραιτεῖσθαι
  choice: पीछे हटूँगा
  rationale: मध्यवाच्य क्रिया का अर्थ मना करना, टालना या बच निकलना हो सकता है। प्रसंग में ‘पीछे हटना’ यातना से न कतराने के दृढ़ संकल्प को स्वाभाविक हिंदी में व्यक्त करता है।
