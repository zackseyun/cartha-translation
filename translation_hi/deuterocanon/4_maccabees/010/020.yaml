lexical_decisions:
- source_word: ἡδέως
  choice: सहर्ष
  rationale: यह क्रियाविशेषण प्रसन्न तत्परता और स्वेच्छापूर्ण दृढ़ता व्यक्त करता है; ‘सहर्ष’ इसे गरिमापूर्ण और संक्षिप्त रूप में रखता है।
- source_word: ὑπὲρ τοῦ θεοῦ
  choice: परमेश्वर के लिए
  rationale: ὑπέρ के साथ संबंधकारक यहाँ परमेश्वर के प्रति निष्ठा के कारण दुःख सहने का भाव देता है। ‘परमेश्वर के लिए’ स्वाभाविक हिन्दी है और प्रतिनिधिक या प्रायश्चित्त-संबंधी अर्थ नहीं जोड़ता।
- source_word: τὰ τοῦ σώματος μέλη
  choice: अपने शरीर के अंग
  rationale: μέλη शारीरिक अंगों को दर्शाता है। हिन्दी में ‘शरीर के अंग’ स्वाभाविक है, और प्रसंगानुसार निहित संबंध को ‘अपने’ स्पष्ट करता है।
- source_word: ἀκρωτηριαζόμεθα
  choice: कटवा रहे हैं
  rationale: मध्य/कर्मवाच्य रूप अंग-विच्छेदन सहने को व्यक्त करता है। ‘कटवा रहे हैं’ हिन्दी में स्वेच्छा से यह यातना सहने और शरीर के अंग काटे जाने—दोनों भावों को स्वाभाविक ढंग से रखता है।
