base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/025.yaml
  text: Or does it not seem evil to you that we worship the Creator of all and live according to his virtuous law?[a]
translation:
  language: hi
  text: या क्या तुम्हें यह बुरा नहीं लगता कि हम सबके सृष्टिकर्ता की आराधना करते हैं और उनकी सद्गुणमय व्यवस्था के अनुसार जीते हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “या क्या यह बुरा नहीं लगता कि हम...?” यूनानी में “तुम्हें” स्पष्ट रूप से नहीं है; यह आलंकारिक प्रश्न विरोधी के नैतिक निर्णय को चुनौती देता हुआ समझा जा सकता है।'
    reason: निहित श्रोता और आलंकारिक प्रश्न की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: κακὸν
  choice: बुरा
  rationale: यह शब्द नैतिक रूप से बुरी या दोषयोग्य बात को दर्शाता है। प्रश्न की स्वाभाविक हिन्दी में ‘बुरा’ नैतिक आरोप को स्पष्ट रखता है।
- source_word: οὐ δοκεῖ
  choice: क्या ... नहीं लगता
  rationale: δοκέω यहाँ प्रतीति या निर्णय व्यक्त करता है; यह हिन्दी प्रयोग यूनानी आलंकारिक प्रश्न का बल बनाए रखता है।
- source_word: τὸν πάντων κτίστην
  choice: सबके सृष्टिकर्ता
  rationale: κτίστης का अर्थ रचनेवाला या सृष्टिकर्ता है और πάντων समस्त सृष्टि को समेटता है; यह संक्षिप्त और गरिमापूर्ण रूप है।
- source_word: εὐσεβοῦμεν
  choice: आराधना करते हैं
  rationale: क्रिया परमेश्वर के प्रति श्रद्धापूर्ण भक्ति व्यक्त करती है; इस प्रसंग में ‘आराधना’ स्वाभाविक धार्मिक अर्थ देती है।
- source_word: κατὰ
  choice: के अनुसार
  rationale: यहाँ κατά अनुरूपता या मानक बताता है; ‘के अनुसार’ इसका सीधा हिन्दी रूप है।
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: उनकी सद्गुणमय व्यवस्था
  rationale: ἔναρετος नैतिक उत्कृष्टता को और νόμος जीवन को निर्देशित करने वाली व्यवस्था को दर्शाता है। ‘सद्गुणमय’ नैतिक विशेषता को ‘उत्तम’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: ζῶμεν
  choice: जीते हैं
  rationale: वर्तमान काल यहाँ जीवन जीने के ढंग को व्यक्त करता है; व्यवस्था के अनुसार जीना हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: आलंकारिक प्रश्न का अभिप्रेत श्रोता और बल
  choice: वक्ता पूछता है कि सबके सृष्टिकर्ता की आराधना करना और उनकी व्यवस्था के अनुसार जीना क्या श्रोता को बुरा लगता है।
  alternative: 'यूनानी में ‘तुम्हें’ स्पष्ट रूप से नहीं है; इसे सामान्य प्रश्न की तरह भी रखा जा सकता है: ‘या क्या यह बुरा नहीं लगता...?’'
  rationale: प्रसंग किसी विरोधी के नैतिक निर्णय को चुनौती देता जान पड़ता है, पर यूनानी व्याकरण में श्रोता स्पष्ट नहीं है। मुख्य पाठ स्वाभाविक हिन्दी के लिए निहित श्रोता को प्रकट करता है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘व्यवस्था’ νόμος के धार्मिक-नैतिक आशय को व्यक्त करती है, और आदरसूचक एकवचन के अनुरूप ‘उनकी’ रखा गया है।
