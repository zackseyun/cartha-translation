lexical_decisions:
- source_word: μισάρετε
  choice: घृणित
  rationale: यह संबोधन में प्रयुक्त तीखा अपमानसूचक विशेषण है। ‘घृणित’ इसके सीधे निंदात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना अनिश्चित अतिशयोक्तिपरक अर्थ जोड़े।
- source_word: μισάνθρωπε
  choice: मनुष्य-द्वेषी
  rationale: यह यौगिक शब्द मनुष्यों से घृणा करने वाले व्यक्ति को संबोधित करता है। ‘मनुष्य-द्वेषी’ मूल अर्थ और संबोधन की तीव्रता दोनों बनाए रखता है।
- source_word: τί δρῶντες
  choice: क्या कर रहा है
  rationale: पाठ में एकवचन संबोधन के साथ बहुवचन कृदन्त का तनाव है, जो सम्भवतः शासक और उसके सहयोगियों की सम्मिलित कार्रवाई की ओर संकेत करता है। सहज हिन्दी में प्रत्यक्ष संबोधित व्यक्ति के अनुसार एकवचन रखा गया है।
- source_word: ἡμᾶς
  choice: हमें
  rationale: प्रथम पुरुष बहुवचन कर्म का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: προθεῖς
  choice: सबके सामने रखकर
  rationale: προτίθημι का अर्थ आगे रखना, प्रस्तुत करना या सार्वजनिक रूप से सामने करना हो सकता है। यातना के प्रसंग में यह हिन्दी अभिव्यक्ति सार्वजनिक प्रदर्शन अथवा दुर्व्यवहार के लिए सामने किए जाने का भाव देती है और मूल की अर्थगत व्यापकता भी बचाती है।
- source_word: τὸν τρόπον
  choice: इस तरह
  rationale: रीति या ढंग बताने वाली इस यूनानी अभिव्यक्ति का सहज आधुनिक हिन्दी समतुल्य।
