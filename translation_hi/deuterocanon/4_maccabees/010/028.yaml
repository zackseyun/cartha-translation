  yaml_path: translation/deuterocanon/4_maccabees/010/028.yaml
  text: Now look[a], being alien to God[c][b], you are making war against those who are reverent toward God.
translation:
  language: hi
  text: अब देख[a], परमेश्वर से पराया होकर[b], तू उन लोगों से युद्ध कर रहा है[c] जो परमेश्वर के प्रति श्रद्धा रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब देख तो।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर से अलग होकर”; मूल शब्द किसी से पराया या विदेशी होने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “लड़ रहा है” अथवा “के विरुद्ध युद्ध छेड़ रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν ἰδὲ
  choice: अब देख
  rationale: νῦν वर्तमान क्षण पर बल देता है और ἰδέ ध्यान खींचने वाली आज्ञा है; ‘अब देख’ आधुनिक हिन्दी में इसकी सीधी और टकरावपूर्ण शक्ति बनाए रखता है।
- source_word: ἀλλότριος ὢν θεοῦ
  choice: परमेश्वर से पराया होकर
  rationale: ἀλλότριος संबंध-विच्छेद अथवा किसी से पराया होने का भाव देता है; कृदन्त ὢν को ‘होकर’ से व्यक्त किया गया है, बिना इसे किसी अधिक विशिष्ट धर्मवैज्ञानिक दावे में बदलने के।
- source_word: πολεμεῖς
  choice: तू ... युद्ध कर रहा है
  rationale: क्रिया सक्रिय और जारी युद्धपूर्ण विरोध को दर्शाती है। एक व्यक्ति को सीधे संबोधन और प्रसंग की कठोरता के कारण ‘तू’ उपयुक्त है।
- source_word: τοὺς εὐσεβοῦντας εἰς τὸν θεόν
  choice: उन लोगों ... जो परमेश्वर के प्रति श्रद्धा रखते हैं
  rationale: εὐσεβέω के श्रद्धापूर्ण आचरण और εἰς τὸν θεόν की दिशात्मकता को सीधे व्यक्त करता है; ‘उपासना करते हैं’ कहने से मूल की अपेक्षा अर्थ अधिक विशिष्ट हो सकता था।
theological_decisions:
- issue: ἀλλότριος θεοῦ का संबंधपरक बल
  choice: परमेश्वर से पराया
  alternative: परमेश्वर से अलग / परमेश्वर के लिए परदेशी
  rationale: ‘पराया’ मूल के belonging/alienation संबंधी तनाव को बनाए रखता है और यह तय नहीं करता कि दूरी नैतिक, संबंधपरक या किसी अन्य अर्थ में है।
- issue: εὐσεβοῦντας का धार्मिक अर्थ
  choice: परमेश्वर के प्रति श्रद्धा रखते हैं
  alternative: परमेश्वर की भक्ति करते हैं / परमेश्वर की श्रद्धापूर्वक उपासना करते हैं
  rationale: चुना हुआ रूप श्रद्धा और धर्मनिष्ठ आचरण दोनों के लिए खुला रहता है तथा मूल से अधिक संकीर्ण ‘उपासना’ का विचार नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। एकवचन संबोधन की तीखी, प्रत्यक्ष ध्वनि के लिए ‘तू’ अपनाया गया है। वाक्य में मूल यूनानी की कृदन्तीय रचना और युद्ध की सजीव भाषा को यथासंभव सुरक्षित रखा गया है।
