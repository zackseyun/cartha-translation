- source_word: ἀδελφοπρεπῶς
  choice: अपने भाइयों के योग्य रीति से
  rationale: यह दुर्लभ क्रियाविशेषण ऐसे आचरण या मृत्यु को दर्शाता है जो एक भाई के नाते और इन भाइयों के उदाहरण के अनुरूप हो। यह चयन पारिवारिक और सम्मानसूचक दोनों भावों को बिना अतिरिक्त वीरता आरोपित किए रखता है।
- source_word: τὸν τέταρτον
  choice: चौथे को
  rationale: मूल में संज्ञा निहित है; प्रसंग से स्पष्ट है कि आशय चौथे भाई से है, इसलिए हिन्दी में भी संक्षिप्त क्रमवाचक रूप रखा गया है।
- source_word: ἐπεσπῶντο
  choice: घसीटकर आगे लाए
  rationale: क्रिया बलपूर्वक खींचने या सामने लाने का भाव देती है; यातना के प्रसंग में यह हिन्दी अभिव्यक्ति उसकी बाध्यकारी शारीरिकता स्पष्ट करती है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: वर्तमान कृदन्त आगे आने वाले कथन की भूमिका बाँधता है; ‘कहने लगे’ हिन्दी में उसी जारी कथन और अगले पद से प्रवाह को स्वाभाविक रखता है।
