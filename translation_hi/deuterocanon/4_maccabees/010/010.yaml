  text: But we[a], O most defiled tyrant, suffer these things for the sake of the discipline and virtue of God.
translation:
  language: hi
  text: पर हम तो, हे घोर अपवित्र तानाशाह, परमेश्वर के अनुशासन और सद्गुण के कारण ये कष्ट सहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμεῖς μέν
  choice: पर हम तो
  rationale: Ἡμεῖς पर बल है और μέν आगे निहित विरोध की भूमिका बाँधता है; ‘पर हम तो’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὦ μιαρώτατε τύραννε
  choice: हे अत्यंत अपवित्र अत्याचारी
  rationale: μιαρώτατε, μιαρός का अतिशयोक्तिपरक रूप है और नैतिक तथा धार्मिक अशुद्धता का तीखा आरोप लगाता है; ‘अत्यंत अपवित्र’ इस अर्थ को बचाता है। τύραννος के लिए संबोधन में ‘अत्याचारी’ सहज और प्रबल है।
- source_word: διὰ παιδείαν
  choice: अनुशासन ... के कारण
  rationale: यहाँ διά के साथ कर्मकारक सामान्यतः कारण या आधार बताता है। παιδεία का अर्थ केवल शिक्षा नहीं, बल्कि नैतिक-धार्मिक प्रशिक्षण और अनुशासन है।
- source_word: καὶ ἀρετὴν
  choice: और सद्गुण
  rationale: ἀρετή नैतिक उत्कृष्टता या सद्गुण को दर्शाता है; इस नैतिक विमर्श में ‘सद्गुण’ संक्षिप्त और उपयुक्त है।
- source_word: θεοῦ
  choice: परमेश्वर के
  rationale: संबंधकारक θεοῦ को स्पष्ट रूप से रखा गया है और उसकी स्थिति के अनुसार उसे समन्वित पद ‘अनुशासन और सद्गुण’ से जोड़ा गया है, बिना उसके संबंध का प्रकार अनावश्यक रूप से निश्चित किए।
- source_word: ταῦτα πάσχομεν
  choice: ये कष्ट सहते हैं
  rationale: πάσχομεν का अर्थ सहना या दुःख उठाना है और ταῦτα पहले वर्णित यातनाओं की ओर संकेत करता है; हिन्दी में ‘ये कष्ट सहते हैं’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: θεοῦ का παιδείαν καὶ ἀρετήν से संबंध
  choice: ‘परमेश्वर के’ को दोनों समन्वित संज्ञाओं—‘अनुशासन और सद्गुण’—से संबंधित रखा गया है।
  alternative: ‘परमेश्वर से मिलने वाले अनुशासन और सद्गुण’ या ‘परमेश्वर-संबंधी अनुशासन और सद्गुण’।
  rationale: यूनानी संबंधकारक दोनों संज्ञाओं के बाद आता है और संभवतः दोनों को विशेषित करता है, पर वह स्रोत, स्वामित्व या परमेश्वर-संबंधी गुण का भेद स्पष्ट नहीं करता। शाब्दिक संबंध को बनाए रखना इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: διά का कारण अथवा उद्देश्य का भाव
  choice: ‘के कारण’
  alternative: ‘के लिए’ या ‘की खातिर’।
  rationale: διά के साथ कर्मकारक का प्रमुख अर्थ यहाँ यातना सहने का कारण या आधार है; फिर भी ‘की खातिर’ का उद्देश्यपरक भाव संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘हे’ संबोधन मूल की तीव्र वाक्पटुता को बनाए रखता है; ‘अत्यंत अपवित्र अत्याचारी’ कठोर है, पर मूल के अपमानजनक अतिशयोक्तिपरक संबोधन के अनुरूप है।
