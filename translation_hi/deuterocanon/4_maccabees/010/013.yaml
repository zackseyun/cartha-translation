translation:
  language: hi
  text: तुम भी अपने भाइयों की तरह उसी पागलपन में मत पड़ो; बल्कि राजा की बात मानकर[a] अपने आप को बचा लो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा के समझाने पर उसकी बात मानकर”; यूनानी पद का अर्थ राजा से सहमत होना, उसकी बात मानना या उसकी आज्ञा मानना हो सकता है।
    reason: मूल यूनानी πεισθεὶς τῷ βασιλεῖ में सहमत होने और आज्ञा मानने—दोनों की अर्थ-छाया है।
lexical_decisions:
- source_word: μανῇς … τὴν αὐτὴν μανίαν
  choice: उसी पागलपन में मत पड़ो
  rationale: यूनानी में एक ही मूल से बने क्रिया और संज्ञा का बलपूर्ण प्रयोग है। हिन्दी में ‘पागलपन में पड़ना’ इस भाव को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: τοῖς ἀδελφοῖς σου
  choice: अपने भाइयों की तरह
  rationale: सम्बन्धवाचक दत्तिव को यहाँ तुलना के अर्थ में समझना प्रसंग और वाक्य-संरचना के अनुकूल है।
- source_word: πεισθεὶς τῷ βασιλεῖ
  choice: राजा की बात मानकर
  rationale: πεισθεὶς के मध्य/कर्मवाच्य रूप में ‘किसी की बात मानना’, ‘उससे सहमत होना’ या ‘उसके कहने में आना’ सम्भव है; चुना हुआ हिन्दी वाक्यांश इस संदर्भ में स्वाभाविक है और अत्यधिक व्याख्या नहीं जोड़ता।
- source_word: σῶζε σεαυτόν
  choice: अपने आप को बचा लो
  rationale: आज्ञार्थक क्रिया और आत्मवाचक सर्वनाम को सीधे तथा सहज हिन्दी में व्यक्त किया गया है।
