  yaml_path: translation/deuterocanon/4_maccabees/010/005.yaml
  text: But bitterly resenting the man's boldness[a], they dislocated his hands and feet with joint-wrenching instruments, and prying them out of their sockets[b], they dismembered him.
translation:
  language: hi
  text: परन्तु उस पुरुष की निर्भीक वाणी से कटु रोष में आकर[a], उन्होंने जोड़ उखाड़ने वाले यंत्रों से उसके हाथ-पैरों के जोड़ उखाड़ दिए; और उन्हें जोड़ों से बलपूर्वक उचकाकर निकालते हुए[b], उसके हाथ-पैर अलग कर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: ‘उस पुरुष की निर्भीक वाणी को कटुता से सहते हुए’—अर्थात वे उसके निडर होकर बोलने को सहन न कर सके और कटु रोष से प्रतिक्रिया करने लगे।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में जोड़ों पर लगाए जाने वाले यंत्रों और अंगों को बलपूर्वक अलग करने के लिए दुर्लभ शब्द आए हैं; वे इस यातना की क्रूरता पर जोर देते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: πικρῶς ἐνέγκαντες
  choice: कटु रोष में आकर
  rationale: शाब्दिक अर्थ ‘कटुता से सहकर’ है, पर प्रसंग में यह उसकी निर्भीक वाणी को सहन न कर पाने और शत्रुतापूर्ण प्रतिक्रिया करने को व्यक्त करता है। हिंदी में ‘कटु रोष में आकर’ इस भाव को स्वाभाविक ढंग से प्रकट करता है।
- source_word: παρρησίαν
  choice: निर्भीक वाणी
  rationale: शब्द में साहस के साथ खुलकर बोलने का भाव है। केवल ‘निर्भीकता’ की तुलना में ‘निर्भीक वाणी’ इस संदर्भ में वाचिक आयाम को स्पष्ट रखता है।
- source_word: τοῦ ἀνδρός
  choice: उस पुरुष की
  rationale: यहाँ ἀνήρ पुरुष शहीद को सूचित करता है, पति को नहीं। ‘उस पुरुष’ आधुनिक गरिमापूर्ण हिंदी में सटीक है।
- source_word: ἀρθρεμβόλοις ὀργάνοις
  choice: जोड़ उखाड़ने वाले यंत्रों से
  rationale: दुर्लभ यौगिक अभिव्यक्ति जोड़ों पर लगाए जाने वाले यातना-यंत्रों की ओर संकेत करती है। यह अनुवाद कार्य और क्रूरता दोनों को स्पष्ट करता है।
- source_word: ἐξήρθρουν
  choice: जोड़ उखाड़ दिए
  rationale: क्रिया का अर्थ किसी अंग को जोड़ से अलग या विस्थापित करना है। ‘जोड़ उखाड़ दिए’ सामान्य पाठक के लिए ‘विस्थापित किया’ से अधिक स्पष्ट और चित्रात्मक है।
- source_word: ἐξ ἁρμῶν
  choice: उनके जोड़ों से
  rationale: ἁρμός जोड़ या जुड़ने के स्थान को दर्शाता है। शरीर के अंगों के संदर्भ में ‘जोड़ों से’ मूल की शारीरिक विशिष्टता बनाए रखता है।
- source_word: ἀναμοχλεύοντες
  choice: बलपूर्वक उचकाकर बाहर निकालते हुए
  rationale: इस कृदंत में उत्तोलक की तरह जोर लगाकर ढीला करने या बाहर निकालने की यांत्रिक हिंसा निहित है।
- source_word: ἐξέμελιζον
  choice: उसके अंग अलग-अलग कर दिए
  rationale: क्रिया अंग-विच्छेद या शरीर के अंगों को अलग करने का प्रबल अर्थ रखती है। यह हिंदी अभिव्यक्ति क्रिया की भयावह परिणति को स्पष्ट रखती है, बिना उससे अधिक शारीरिक विवरण जोड़ने के।
theological_decisions:
- issue: यातना के चित्रण की स्पष्टता
  choice: जोड़ उखाड़ने और अंग अलग करने की शारीरिक हिंसा को स्पष्ट रूप से व्यक्त करना
  alternative: इसे सामान्य शब्दों में ‘उसे विकृत किया’ या केवल ‘उसे यातना दी’ कहना
  rationale: यूनानी पाठ हाथ-पैर, जोड़ उखाड़ने वाले यंत्र और अंग-विच्छेद का स्पष्ट वर्णन करता है। इसे नरम करना शहादत की यातना की मूल तीव्रता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। हिंसा को मूल यूनानी के अनुरूप स्पष्ट रखा गया है। ‘निर्भीक वाणी’ παρρησία के खुलकर और निडर होकर बोलने के भाव को व्यक्त करता है; दुर्लभ यातना-संबंधी शब्दावली को सामान्य पाठक के लिए कार्य-आधारित भाषा में प्रस्तुत किया गया है।
