  yaml_path: translation/deuterocanon/4_maccabees/010/016.yaml
  text: Go on[a], tyrant, with your tortures, so that even through these you may learn that I am a brother of those who have been tortured before.
translation:
  language: hi
  text: “आगे बढ़, अत्याचारी, यातनाएँ दे, ताकि इन यातनाओं के द्वारा भी तू जान ले कि मैं उन लोगों का भाई हूँ जिन्हें पहले यातना दी जा चुकी है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहले यातना पाए हुए लोगों का भाई।” यूनानी कृदन्त में यह भाव निहित है कि उन्हें वक्ता की वर्तमान यातना से पहले यातना दी जा चुकी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπιθι
  choice: आगे बढ़
  rationale: यह आज्ञार्थक रूप प्रसंग में एक निर्भीक चुनौती है। ‘आगे बढ़’ उसकी ललकार को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक अर्थ जोड़े।
- source_word: τύραννε
  choice: अत्याचारी
  rationale: सम्बोधन रूप राजनीतिक निरंकुशता के साथ नैतिक निन्दा भी व्यक्त करता है। ‘अत्याचारी’ आधुनिक हिन्दी में दोनों भावों को स्पष्ट और स्वाभाविक रूप से पहुँचाता है।
- source_word: βασάνοις
  choice: यातनाएँ दे
  rationale: करण कारक बहुवचन यहाँ यातना देने के कार्य या साधनों की ओर संकेत करता है। हिन्दी में ‘यातनाएँ दे’ आज्ञार्थक वाक्य के साथ स्वाभाविक है और प्रसंग की क्रूरता बनाए रखता है।
- source_word: ἵνα καὶ διὰ τούτων μάθῃς
  choice: ताकि इन यातनाओं के द्वारा भी तू जान ले
  rationale: ἵνα उद्देश्य बताता है, καί का बल ‘भी’ से और διὰ τούτων का साधनार्थ ‘इन यातनाओं के द्वारा’ से व्यक्त हुआ है। ‘तू’ वक्ता की निर्भीक और तिरस्कारपूर्ण सीधी चुनौती के अनुरूप है।
- source_word: ἀδελφός
  choice: भाई
  rationale: यूनानी शब्द पुल्लिंग एकवचन है और पुरुष वक्ता अपने पहले यातना पाए भाइयों के साथ पारिवारिक एकता प्रकट करता है।
- source_word: τῶν προβασανισθέντων
  choice: उन लोगों का … जिन्हें मुझसे पहले यातना दी गई है
  rationale: पूर्वसर्ग προ- पहले घटित होने का भाव देता है और कर्मवाच्य कृदन्त उन लोगों को सूचित करता है जो वक्ता से पहले यातना पा चुके हैं। ‘मुझसे पहले’ तुलनात्मक समय-क्रम को स्पष्ट करता है।
theological_decisions:
- issue: पारिवारिक शहादत के प्रसंग में ἀδελφός का लिंग-सूचक अर्थ
  choice: भाई
  alternative: भाई-बहनों में से एक
  rationale: मूल यूनानी स्पष्ट रूप से पुल्लिंग एकवचन है और प्रसंग में पुरुष वक्ता अपने पहले यातना पाए पुरुष सहोदरों से अपनी पहचान जोड़ रहा है; इसलिए लिंग-निरपेक्ष रूप मूल की विशिष्टता को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक ललकार के अनुरूप रखी गई है। ‘तू’ यहाँ असम्मानजनक सहजता नहीं, बल्कि अत्याचारी के प्रति वक्ता की निर्भीक अवज्ञा व्यक्त करता है। फुटनोट चिह्न उस वाक्यांश पर रखा गया है जिससे उसका वास्तविक lexical alternative सम्बन्धित है।
