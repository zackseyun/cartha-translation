  text: And since they were in no way able to strangle him[a], they dragged off the skin with the very tips of his fingers and flayed him, and immediately they led him to the wheel.
translation:
  language: hi
  text: और जब वे किसी भी तरह उसका गला घोंट नहीं सके, तो उन्होंने उसकी उँगलियों के बिल्कुल सिरों समेत उसकी त्वचा खींचकर उतारी[a] और उसकी खाल उधेड़ दी; फिर वे तुरंत उसे यातना-चक्र तक ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उँगलियों के सिरों से”; यूनानी वाक्यांश असामान्य रूप से चित्रात्मक है और सम्भवतः बताता है कि त्वचा उँगलियों के अंतिम सिरों समेत खींचकर उतारी गई थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μηδένὰ τρόπον
  choice: किसी भी तरह ... नहीं
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पूर्ण असमर्थता का बल बनाए रखता है।
- source_word: ἰσχύοντες
  choice: नहीं सके
  rationale: सहायक क्रिया यहाँ शारीरिक बल से अधिक कार्य कर सकने की क्षमता व्यक्त करती है।
- source_word: ἄγξαι
  choice: गला घोंट
  rationale: यह गले को कसकर मारने की क्रिया का स्पष्ट और प्रसंगानुकूल हिन्दी रूप है।
- source_word: περισύραντες
  choice: खींचकर उतारी
  rationale: यह त्वचा को बलपूर्वक खींचकर अलग करने की हिंसक क्रिया व्यक्त करता है, बिना अनावश्यक विस्तार के।
- source_word: τὸ δέρμα
  choice: त्वचा
  rationale: शरीर की त्वचा के लिए स्पष्ट, वर्तमान और गरिमापूर्ण शब्द।
- source_word: σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
  choice: उसकी उँगलियों के बिल्कुल सिरों समेत
  rationale: σύν के ‘समेत’ अर्थ और वाक्यांश की असाधारण रूप से चित्रात्मक प्रकृति को बनाए रखता है; स्वामित्व प्रसंग से स्पष्ट किया गया है।
- source_word: ἀπεσκύθισον
  choice: उसकी खाल उधेड़ दी
  rationale: क्रिया त्वचा उतारने या खाल उधेड़ने को दर्शाती है; हिन्दी में यह ‘सिर की खाल उतारने’ तक अर्थ को अनावश्यक रूप से सीमित नहीं करती।
- source_word: εὐθέως
  choice: तुरंत
  rationale: घटनाओं के तत्काल क्रम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἦγον ἐπὶ τὸν τροχόν
  choice: उसे यातना-चक्र के पास ले गए
  rationale: τροχός को केवल सामान्य पहिया समझे जाने से बचाते हुए यातना के उपकरण का प्रसंग स्पष्ट करता है; ἐπί की दिशात्मकता के लिए ‘के पास’ रखा गया है।
