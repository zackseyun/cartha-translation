- source_word: ἔφη
  choice: उसने कहा
  rationale: यह कथन आरम्भ कराने वाली सामान्य आख्यानात्मक क्रिया है; ‘उसने कहा’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: δὲ
