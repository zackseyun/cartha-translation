base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/004.yaml
  text: In response to this[a], if you have any instrument of punishment, bring it against my body; for my soul, even if you wish it[b], you will not touch.
translation:
  language: hi
  text: इसके उत्तर में, “यदि तुम्हारे पास दण्ड देने का कोई साधन है[a], तो उसे मेरे शरीर पर ले आओ; क्योंकि तुम मेरी आत्मा[b] को, चाहो भी तो, छू नहीं सकोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दण्ड देने का कोई उपकरण” अथवा “यातना देने का कोई साधन।” यूनानी शब्द दण्ड या यातना देने के किसी ठोस साधन की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “जीवन”; यूनानी शब्द ψυχή का अर्थ “जीवन” भी हो सकता है, पर यहाँ “शरीर” के साथ विरोध के कारण “आत्मा” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: इस पर उसने कहा
  rationale: यह पदबंध पिछले कथन के प्रत्युत्तर का संकेत देता है। हिन्दी में वक्ता-परिवर्तन स्पष्ट करने के लिए ‘उसने कहा’ जोड़ा गया है, बिना कथन की विषयवस्तु बदले।
- source_word: εἴ τι ἔχετε κολαστήριον
  choice: यदि तुम्हारे पास दण्ड देने का कोई साधन है
  rationale: κολαστήριον यहाँ अमूर्त दण्ड नहीं, बल्कि दण्ड या यातना देने के साधन अथवा उपकरण को सूचित करता है।
- source_word: προσαγάγετε τῷ σώματί μου
  choice: उसे मेरे शरीर पर आज़मा लो
  rationale: आज्ञार्थक क्रिया दण्ड-साधन को शरीर पर लागू करने की चुनौती व्यक्त करती है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: τῆς γὰρ ψυχῆς μου
  choice: क्योंकि मेरी आत्मा
  rationale: ψυχή का अर्थ ‘जीवन’ भी हो सकता है, पर σώμα के साथ स्पष्ट विरोध के कारण ‘आत्मा’ मूल पाठ की मानव-स्वरूप संबंधी धार को सुरक्षित रखता है।
- source_word: οὐδʼ ἂν θέλητε, ἅψεσθε
  choice: तुम चाहकर भी छू नहीं सकोगे
  rationale: यह रूप इच्छा के बावजूद असमर्थता पर बल देता है; ‘चाहकर भी’ हिन्दी में इस concessive भाव को संक्षेप और प्रभावपूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: σῶμα और ψυχή के विरोध में ψυχή का अनुवाद
  choice: आत्मा
  alternative: जीवन
  rationale: शरीर को हानि पहुँचाने की सामर्थ्य और ψυχή को न छू पाने के बीच मूल पाठ का स्पष्ट विरोध ‘आत्मा’ से बना रहता है। ‘जीवन’ सम्भव अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, चुनौतीपूर्ण शहीदी-वाणी। बहुवचन संबोधन के लिए ‘तुम’ रखा गया है। ‘आज़मा लो’ शाब्दिक ‘ले आओ/लगाओ’ की अपेक्षा हिन्दी में साधन को शरीर पर लागू करने का आशय अधिक स्वाभाविक रूप से देता है।
