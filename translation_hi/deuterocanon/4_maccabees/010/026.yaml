  - severity: medium
    issue: ‘यातना कहलाने योग्य’ introduces ‘being called torture’ and changes the plural.
    rationale: ἄξια βασάνων means ‘worthy/deserving of tortures,’ not specifically ‘worthy of being called torture.’ The plural should be retained where natural.
