lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह संयोजक पिछले कथन से तीखा विरोध दिखाता है; ‘परन्तु’ संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: ταῦτα
  choice: ये सब काम
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक का व्यापक आशय बनाए रखते हुए ‘काम’ हिन्दी में अनकहे कार्यों या व्यवहार की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: ὑμῶν
  choice: तुम्हारे
  rationale: सम्बन्धकारक रूप संक्षिप्त और कुछ हद तक अस्पष्ट है; ‘तुम्हारे’ उसका औपचारिक ढाँचा बनाए रखता है और ‘तुम्हारी ओर से’ का भाव भी दे सकता है।
- source_word: βασάνων
  choice: यातना
  rationale: शहादत के इस प्रसंग में शब्द शारीरिक यातनाओं या यातना देने के साधनों को सूचित करता है; हिन्दी में जातिवाचक एकवचन ‘यातना’ स्वाभाविक है।
- source_word: ἄξια
  choice: कहलाने योग्य भी नहीं
  rationale: मूल अर्थ ‘योग्य नहीं’ है। प्रसंगगत व्यंग्य को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘कहलाने’ और बलसूचक ‘भी’ का प्रयोग किया गया है, अर्थात ये कार्य वास्तविक यातना का स्तर भी नहीं रखते।
