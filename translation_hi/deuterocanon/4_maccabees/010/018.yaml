  text: But he said[a], “Even if you take away the instrument of speech, God hears those who are silent.”
translation:
  language: hi
  text: पर उसने कहा, “यदि तुम वाणी का साधन[a] छीन भी लो, तो परमेश्वर मौन रहने वालों की सुनता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वाणी का उपकरण।” यह वाक्यांश संभवतः बोलने के लिए प्रयुक्त शारीरिक अंग या अंगों की ओर संकेत करता है।
    reason: शाब्दिक रूपक और संभावित शारीरिक संकेत को स्पष्ट करना, बिना किसी एक अंग को निश्चित किए।
lexical_decisions:
- source_word: Κἂν ἀφέλῃς
  choice: यदि तुम … छीन भी लो
  rationale: Κἂν (καὶ ἐάν) रियायती शर्त व्यक्त करता है। हिंदी में ‘यदि … भी’ उसका स्वाभाविक समतुल्य है; ‘छीन लो’ ἀφαιρέω में निहित बलपूर्वक वंचित कर देने के भाव को बनाए रखता है।
- source_word: τὸ τῆς φωνῆς ὄργανον
  choice: वाणी का साधन
  rationale: ὄργανον का मूल अर्थ साधन या उपकरण है और φωνή यहाँ बोलने की क्षमता अथवा वाणी को सूचित करता है। यह अनुवाद रूपक को बनाए रखता है, पर किसी एक शारीरिक अंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: σιωπώντων
  choice: मौन रहनेवालों की
  rationale: σιωπάω का वर्तमान कृदंत यहाँ संज्ञा की तरह प्रयुक्त है और उन लोगों को सूचित करता है जो मौन हैं। ‘मौन रहनेवाले’ वर्तमान, गरिमापूर्ण और सहज हिंदी है।
- source_word: ἀκούει
  choice: सुनता है
  rationale: ἀκούει के साथ संबंधवाचक षष्ठी का हिंदी में स्वाभाविक रूप ‘किसी की सुनना’ है। इससे यह विरोधाभासी कथन सुरक्षित रहता है कि परमेश्वर मौन व्यक्तियों की भी सुनता है, बिना ‘प्रार्थना’ शब्द जोड़े।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: यह θεός का मानक, गरिमापूर्ण और व्यापक रूप से समझा जानेवाला हिंदी अनुवाद है।
theological_decisions:
- issue: क्या कथन परमेश्वर द्वारा मौन व्यक्तियों को सुनने के विषय में है या अनकही प्रार्थना सुनने के विषय में
  choice: परमेश्वर मौन रहनेवालों की सुनता है
  alternative: परमेश्वर मौन प्रार्थनाएँ भी सुनता है
  rationale: यूनानी पाठ में σιωπώντων अर्थात मौन रहनेवाले व्यक्ति हैं; ‘प्रार्थनाएँ’ स्पष्ट रूप से नहीं है। चुना हुआ रूप निहितार्थ को खुला रखता है और पाठ में व्याख्यात्मक संज्ञा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘वाणी का साधन’ मूल रूपक को सुरक्षित रखता है और ‘मौन रहनेवालों की सुनता है’ यूनानी कथन के आशय तथा उसके धर्मवैचारिक तनाव को बिना विस्तार दिए व्यक्त करता है।
