  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/008.yaml
  text: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
translation:
  language: hi
  text: इसलिए हे प्रभु, धर्मियों के परमेश्वर, तूने धर्मियों के लिए[a]—अब्राहम, इसहाक और याकूब के लिए, जिन्होंने तेरे विरुद्ध पाप नहीं किया—पश्चाताप नहीं ठहराया; बल्कि मुझ पापी के लिए पश्चाताप ठहराया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तूने धर्मियों के सामने पश्चाताप नहीं रखा।’ यूनानी क्रिया का अर्थ ‘रखना’ या ‘ठहराना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  choice: इसलिए ... तूने
  rationale: οὖν के निष्कर्षसूचक अथवा पूर्व कथन को आगे बढ़ाने वाले बल को स्वाभाविक हिन्दी में ‘इसलिए’ से व्यक्त किया गया है; सर्वनाम का बल ‘तूने’ में बना रहता है।
- source_word: κύριε ὁ θεὸς τῶν δικαίων
  choice: हे प्रभु, धर्मियों के परमेश्वर
  rationale: सम्बोधन और संबंधवाचक यूनानी पदबंध को निकटता से रखते हुए प्रार्थना के अनुरूप गरिमापूर्ण हिन्दी दी गई है।
- source_word: οὐκ ἔθου μετάνοιαν δικαίοις
  choice: तूने धर्मियों के लिए ... पश्चाताप नहीं ठहराया
  rationale: τίθημι के ‘रखना/ठहराना/नियुक्त करना’ अर्थ और दैवी व्यवस्था के भाव को ‘ठहराया’ व्यक्त करता है; μετάνοια को मानक और सुबोध धार्मिक शब्द ‘पश्चाताप’ से अनूदित किया गया है।
- source_word: τῷ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: अब्राहम, इसहाक और याकूब के लिए
  rationale: यह पद ‘धर्मियों’ की व्याख्या करता है; ‘के लिए’ हिन्दी वाक्य-विन्यास में दत्तिव संबंध को स्पष्ट रखता है।
- source_word: τοῖς οὐχ ἡμαρτηκόσιν σοι
  choice: जिन्होंने तेरे विरुद्ध पाप नहीं किया
  rationale: पूर्ण कृदन्त के परिणामात्मक भाव को सहज भूतकाल में रखा गया है और σοι को पाप से आहत पक्ष के अर्थ में ‘तेरे विरुद्ध’ अनूदित किया गया है।
- source_word: ἀλλ᾽ ἔθου μετάνοιαν ἐμοὶ τῷ ἁμαρτωλῷ
  choice: बल्कि मुझ पापी के लिए पश्चाताप ठहराया
  rationale: ἀλλά का स्पष्ट विरोध ‘बल्कि’ से और यूनानी की पुनरावृत्ति ‘पश्चाताप ठहराया’ दोहराकर सुरक्षित रखी गई है; ‘मुझ पापी’ वक्ता की आत्म-दीनता और ‘धर्मियों’ से विरोध को बनाए रखता है।
theological_decisions:
- issue: अब्राहम, इसहाक और याकूब के विषय में यह कथन कि उन्होंने परमेश्वर के विरुद्ध पाप नहीं किया
  choice: ‘जिन्होंने तेरे विरुद्ध पाप नहीं किया’ को बिना किसी नरमी या योग्यता के रखा गया है।
  alternative: ‘जिन्होंने तेरे विरुद्ध बड़ा पाप नहीं किया’ अथवा ‘जो तेरे सामने पापी नहीं गिने गए’
  rationale: यूनानी οὐχ ἡμαρτηκόσιν σοι सीधे यही कहता है और कोई सीमा या योग्यता नहीं जोड़ता। अनुवाद प्रार्थना की अलंकारिक और धर्मवैचारिक तीव्रता को अन्य ग्रंथों से सामंजस्य बैठाकर कम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए निकट और पारंपरिक एकवचन ‘तू’ प्रयुक्त है। वाक्य के अंत का अल्पविराम स्रोत में आगे जारी रहने वाले वाक्य को दर्शाता है।
