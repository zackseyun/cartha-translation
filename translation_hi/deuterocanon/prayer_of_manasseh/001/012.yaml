lexical_decisions:
- source_word: ἡμάρτηκα
  choice: मैंने पाप किया है
  rationale: यह ἁμαρτάνω का पूर्णकालिक रूप है, जो किए गए पाप और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त करता है। हिन्दी का ‘मैंने पाप किया है’ इस बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: κύριε
  choice: प्रभु
  rationale: κύριος के संबोधन रूप को आधुनिक, गरिमापूर्ण और प्रार्थना के अनुकूल हिन्दी में ‘प्रभु’ कहा गया है। ‘हे प्रभु’ भी संभव है, पर यूनानी में अलग विस्मयादिबोधक शब्द नहीं है।
- source_word: τὰς ἀνομίας μου
  choice: अपने अधर्म के कामों को
  rationale: ἀνομία व्यवस्था के उल्लंघन अथवा व्यवस्था-विरोधी आचरण को दर्शाता है। ‘अधर्म के काम’ इसकी नैतिक गंभीरता और ठोस कर्मों के भाव को साधारण पाठक के लिए स्पष्ट रखता है।
- source_word: γινώσκω
  choice: जानता हूँ
  rationale: क्रिया का सीधा अर्थ ‘जानना’ है। प्रसंग में स्वीकार करने का भाव निहित है, पर ‘जानता हूँ’ मूल की संज्ञानात्मक भाषा को सुरक्षित रखता है।
- source_word: ἐγώ
  choice: मैं स्वयं
  rationale: यूनानी में कर्ता सर्वनाम व्याकरणतः आवश्यक नहीं है, इसलिए इसकी स्पष्ट उपस्थिति बल देती है। ‘मैं स्वयं’ उस आत्म-संबंधी जोर को हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पश्चात्ताप की प्रार्थना में ἀνομία का अनुवाद
  choice: अधर्म के काम
  alternative: अधर्म; व्यवस्था-विरोधी काम
  rationale: यह चयन सामान्य ‘बुराइयों’ की अपेक्षा परमेश्वर की व्यवस्था के उल्लंघन का भाव बनाए रखता है, जबकि ‘व्यवस्था-विरोधी काम’ की अपेक्षा अधिक स्वाभाविक हिन्दी है।
- issue: सीधे संबोधन में κύριε का अनुवाद
  choice: प्रभु
  alternative: हे प्रभु
  rationale: ‘प्रभु’ κύριος का सीधा और प्रतिष्ठित समतुल्य है। ‘हे’ जोड़ना हिन्दी में संभव है, पर मूल यूनानी इसकी माँग नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। पाप-स्वीकार की पुनरुक्ति तथा ἐγώ का बल सुरक्षित है; पद के अंत का अर्धविराम दिए गए अंश की आगे जारी रहने वाली वाक्य-रचना को दर्शाता है।
