base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/010.yaml
  text: I am bent down with many iron bonds[a], so that I cannot lift up my head, and there is no relief for me; because I provoked your wrath and did what is evil before you[b], setting up abominations and multiplying offenses.
translation:
  language: hi
  text: लोहे की भारी बेड़ी से मैं इतना झुका हुआ हूँ कि अपना सिर नहीं उठा सकता[a], और मुझे कोई राहत नहीं मिलती; क्योंकि मैंने तेरे क्रोध को भड़काया और तेरी दृष्टि में बुराई की—घृणित वस्तुएँ[b] स्थापित कीं और अपराध बढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि मैं स्वयं को सँभाल नहीं सकता” अथवा “कि मैं फिर ऊपर नहीं देख सकता”; यूनानी क्रिया फिर सँभलने या शारीरिक रूप से ऊपर उठने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “घृणित वस्तुएँ” से सम्भवतः ऐसे काम या वस्तुएँ अभिप्रेत हैं जिन्हें परमेश्वर घृणित मानता है, विशेषकर मूर्तिपूजा से जुड़ी वस्तुएँ या कार्य।
    reason: cultural_note
lexical_decisions:
- source_word: κατακαμπτόμενος
  choice: इतना झुका हुआ हूँ
  rationale: यह कृदंत किसी भार या बंधन के नीचे झुक जाने का शारीरिक चित्र प्रस्तुत करता है; ‘झुका हुआ’ उस चित्र को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: πολλῷ δεσμῷ σιδηρῷ
  choice: लोहे की भारी बेड़ी से
  rationale: यूनानी पद व्याकरण की दृष्टि से एकवचन है और बड़े या भारी लौह-बंधन का बोध करा सकता है। ‘भारी बेड़ी’ मूल की बंधनकारी तीव्रता को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: εἰς τὸ ἀνανεῦσαί με
  choice: कि अपना सिर नहीं उठा सकता
  rationale: ἀνανεύω का अर्थ फिर ऊपर उठना, ऊपर देखना या स्वयं को सँभालना हो सकता है। झुके होने के तत्काल प्रसंग में सिर न उठा पाना मुख्य पाठ के लिए सबसे स्पष्ट शारीरिक चित्र है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: ἄνεσις
  choice: राहत
  rationale: यह दबाव, कष्ट या बंधन से ढील और चैन का बोध कराता है। ‘राहत’ शारीरिक तथा मानसिक दोनों आयामों को खुला रखती है।
- source_word: παρώργισα τὸν θυμόν σου
  choice: मैंने तेरे क्रोध को भड़काया
  rationale: क्रिया का अर्थ क्रोध दिलाना या भड़काना है। यह अनुवाद कारणात्मक भाव और ईश्वरीय क्रोध की गंभीरता दोनों को बनाए रखता है।
- source_word: τὸ πονηρὸν ἐνώπιόν σου ἐποίησα
  choice: तेरी दृष्टि में बुरा किया
  rationale: यह बाइबलीय मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी रूप है, जिसमें कर्म का परमेश्वर के सम्मुख होना बना रहता है।
- source_word: στήσας βδελύγματα
  choice: घृणित वस्तुएँ खड़ी कीं
  rationale: στήσας खड़ा करने या स्थापित करने और βδελύγματα घृणित वस्तुओं या कृत्यों का संकेत देता है। सम्भावित मूर्तिपूजक संदर्भ को बिना अनावश्यक रूप से निश्चित किए यह रूप मूर्त वस्तुओं का चित्र बचाता है।
- source_word: πληθύνας προσοχθίσματα
  choice: अपने अपराध बढ़ाए
  rationale: दुर्लभ संज्ञा उन कामों का बोध कराती है जो घोर अप्रसन्नता या विरक्ति उत्पन्न करते हैं। ‘अपराध’ व्यापक नैतिक अर्थ को रखता है और ‘बढ़ाए’ πληθύνας की बहुलता को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय क्रोध की भाषा
  choice: तेरे क्रोध को भड़काया
  alternative: तुझे क्रोधित किया
  rationale: मूल में θυμός को स्पष्ट संज्ञा के रूप में रखा गया है। चुना हुआ रूप उस ईश्वरीय क्रोध और क्रिया के कारणात्मक बल दोनों को सुरक्षित रखता है, बिना किसी अतिरिक्त सिद्धान्त को जोड़ने के।
- issue: ἀνανεῦσαί में शारीरिक अथवा मानसिक भाव
  choice: अपना सिर नहीं उठा सकता
  alternative: स्वयं को सँभाल नहीं सकता / फिर ऊपर नहीं देख सकता
  rationale: लोहे की बेड़ी से झुके होने का निकटवर्ती चित्र शारीरिक अर्थ का समर्थन करता है, पर मूल क्रिया की व्यापक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: βδελύγματα का मूर्तिपूजक संकेत
  choice: घृणित वस्तुएँ
  alternative: मूर्तियाँ / घृणित काम
  rationale: इस शब्द का प्रयोग प्रायः मूर्तिपूजा से जुड़ी वस्तुओं या कृत्यों के लिए होता है, लेकिन अकेला शब्द केवल ‘मूर्तियाँ’ कहने को अनिवार्य नहीं करता। अतः मुख्य पाठ व्यापक रखा गया है और सांस्कृतिक संकेत पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और प्रार्थनात्मक रखी गई है। परमेश्वर के लिए पारंपरिक निकट संबोधन ‘तू/तेरा’ अपनाया गया है। वाक्य की पश्चात्तापपूर्ण तीव्रता बनाए रखते हुए दुर्लभ यूनानी पदों को अत्यधिक सांप्रदायिक या व्याख्यात्मक शब्दावली से नहीं बाँधा गया।
