lexical_decisions:
- source_word: ὁ κλείσας
  choice: जिसने ... बन्द कर दिया
  rationale: भूतकालिक कृदन्त संबोधित परमेश्वर का वर्णन करता है। ‘बन्द कर दिया’ κλείω की ठोस क्रिया और गहराई को रोक रखने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν ἄβυσσον
  choice: अथाह गहराई
  rationale: ἄβυσσος आदिम, अगाध अथवा तलहीन गहराई का बोध कराता है। ‘अथाह गहराई’ सामान्य पाठक के लिए स्पष्ट रहते हुए ब्रह्माण्डीय अर्थ बनाए रखता है।
- source_word: σφραγισάμενος
  choice: मुहर लगा दी
  rationale: मध्यवाच्य कृदन्त सुरक्षित रूप से मुहरबन्द करने की क्रिया बताता है। हिन्दी में ‘उस पर ... मुहर लगा दी’ संक्षिप्त और स्वाभाविक है।
- source_word: αὐτὴν
  choice: उस पर
  rationale: स्त्रीलिंग सर्वनाम ἄβυσσον की ओर लौटता है। ‘मुहर लगाना’ के हिन्दी प्रयोग में कर्म को ‘उस पर’ कहना स्वाभाविक है।
- source_word: τῷ ... ὀνόματί σου
  choice: अपने ... नाम से
  rationale: करण कारक उस साधन को व्यक्त करता है जिसके द्वारा मुहर लगाई गई; हिन्दी में ‘नाम से’ इसका स्वाभाविक समतुल्य है। कर्ता और संबोधित व्यक्ति एक ही होने के कारण ‘अपने’ उपयुक्त है।
- source_word: φοβερῷ
  choice: भय जगानेवाले
  rationale: φοβερός भय और श्रद्धामिश्रित विस्मय उत्पन्न करनेवाले अर्थों के बीच तनाव रखता है। ‘भय जगानेवाले’ मूल के भय-संबंधी बल को बचाता है और ‘भयभीत’ जैसे गलत कर्तृ-अर्थ से बचता है।
- source_word: ἐνδόξῳ
  choice: महिमामय
  rationale: ἐνδόξῳ सम्मान, वैभव और महिमा से युक्त होने का भाव देता है। ‘महिमामय’ प्रार्थनात्मक शैली में स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: परमेश्वर के नाम के लिए φοβερῷ का अनुवाद
  choice: भय जगानेवाले
  alternative: विस्मयकारी
  rationale: मुख्य पाठ मूल शब्द में निहित भय और श्रद्धा के भार को बनाए रखता है। चूँकि इसका आशय केवल आतंककारी होना नहीं, बल्कि श्रद्धामिश्रित विस्मय उत्पन्न करना भी हो सकता है, वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण प्रार्थनात्मक शैली। वाक्य खण्ड की सहभागी संरचना बनाए रखने के लिए ‘जिसने’ से आरम्भ किया गया है। ‘अथाह गहराई’ सुलभ है, जबकि मूल का ब्रह्माण्डीय और अगाध भाव भी सुरक्षित रखता है।
