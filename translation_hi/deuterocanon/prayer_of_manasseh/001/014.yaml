base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/014.yaml
  text: and in me you will show your kindness[a]; for you will save me, though I am unworthy, according to your abundant mercy[b],
translation:
  language: hi
  text: और मुझमें[a] आप अपनी कृपालुता[b] दिखाएँगे; क्योंकि मैं अयोग्य हूँ, फिर भी आप अपनी अपार दया के अनुसार मेरा उद्धार करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझ पर’ अथवा ‘मेरे द्वारा’; यूनानी में ‘मुझमें’।
    reason: lexical_alternative
  - marker: b
    text: या ‘भलाई’।
    reason: previous_rendering
lexical_decisions:
- source_word: δείξεις
  choice: दिखाएँगे
  rationale: भविष्यकालीन सक्रिय क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यह परमेश्वर द्वारा अपने गुण को प्रकट करने का भाव बनाए रखता है।
- source_word: ἐν ἐμοί
  choice: मुझमें
  rationale: ἐν का निकटतम अर्थ ‘में’ है। ‘मुझमें’ से यह खुला रहता है कि परमेश्वर की कृपालुता मनश्शे के अपने जीवन और प्रसंग में दिखाई देगी।
- source_word: χρηστότητά
  choice: कृपालुता
  rationale: χρηστότης यहाँ दयापूर्ण भलाई या kindness को व्यक्त करता है। ‘कृपालुता’ इस गुण को ἔλεος के लिए प्रयुक्त ‘दया’ से अलग रखते हुए उसका करुणामय स्वर बनाए रखती है।
- source_word: ἀνάξιον ὄντα
  choice: मैं अयोग्य हूँ, फिर भी
  rationale: शाब्दिक अर्थ ‘अयोग्य होते हुए’ है। ‘फिर भी’ उद्धार और वक्ता की अयोग्यता के बीच निहित विरोध को सहज हिन्दी में स्पष्ट करता है।
- source_word: σώσεις με
  choice: मेरा उद्धार करेंगे
  rationale: σῴζω के बचाने, छुड़ाने और उद्धार करने के व्यापक अर्थ को ‘उद्धार’ इस पश्चात्तापपूर्ण प्रार्थना में उपयुक्त रूप से बनाए रखता है।
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: अपनी अपार दया के अनुसार
  rationale: κατά मानक या आधार का भाव देता है, और πολὺ ἔλεος दया की महान प्रचुरता पर बल देता है।
theological_decisions:
- issue: ἐν ἐμοί को अधिक व्याख्यात्मक ढंग से ‘मुझ पर’ या ‘मेरे द्वारा’ कहना अथवा सीधे ‘मुझमें’ रखना
  choice: मुझमें
  alternative: मुझ पर; मेरे द्वारा
  rationale: यूनानी पाठ में ἐν है और संदर्भ किसी एक व्याख्यात्मक अर्थ को अनिवार्य नहीं करता। ‘मुझमें’ यह अर्थ सुरक्षित रखता है कि वक्ता स्वयं परमेश्वर की कृपालुता के प्रदर्शन का क्षेत्र या उदाहरण बनेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ का प्रयोग किया गया है। भाषा प्रार्थनापूर्ण और गरिमामय है, पर सामान्य पाठक के लिए सहज रखी गई है। ‘कृपालुता’ और ‘दया’ को अलग रखकर χρηστότης तथा ἔλεος का शाब्दिक भेद सुरक्षित रखा गया है।
