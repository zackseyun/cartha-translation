- source_word: τοῦ προστάγματός σου
  choice: अपनी आज्ञा के
  rationale: πρόσταγμα आदेश या आज्ञा है। ‘अपनी आज्ञा के वचन से’ हिन्दी में स्वाभाविक है और यूनानी संबंध-रचना का अर्थ बनाए रखता है।
