  choice: ‘समुद्र को बाँध दिया’ का ठोस रूपक बनाए रखा गया।
  alternative: ‘समुद्र को रोक दिया’ अथवा ‘समुद्र की सीमा ठहरा दी’
  rationale: मूल यूनानी बाँधने अथवा बेड़ी डालने का सजीव चित्र प्रस्तुत करता है। इसे बनाए रखने से अराजक समुद्र पर परमेश्वर के अधिकार का कथन सुरक्षित रहता है और व्याख्यात्मक विस्तार नहीं जोड़ा जाता।
