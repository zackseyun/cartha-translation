base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/015.yaml
  text: And I will praise you continually all the days of my life[a], for all the host of the heavens sings praise to you, and yours is the glory forever[c][b]. Amen.
translation:
  language: hi
  text: और मैं अपने जीवन के दिनों में निरन्तर तेरी स्तुति करूँगा, क्योंकि स्वर्गों की सारी सेना[a] तेरा स्तुतिगान करती है, और महिमा सदा-सर्वदा तेरी ही है। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्गों की समस्त सामर्थ्य’ अथवा ‘हर स्वर्गीय शक्ति।’ यूनानी पद स्वर्गीय प्राणियों या सेनाओं के साथ-साथ स्वर्ग की सामर्थ्य के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσω
  choice: मैं...स्तुति करूँगा
  rationale: भविष्यत् सक्रिय रूप को स्वाभाविक हिन्दी में रखा गया है; यह भावी संकल्प और स्तुति, दोनों को व्यक्त करता है।
- source_word: διὰ παντός
  choice: निरन्तर
  rationale: यह यूनानी मुहावरा लगातार अथवा हर समय किए जाने वाले कार्य का बोध कराता है।
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς μου
  choice: अपने जीवन के दिनों में
  rationale: मूल पाठ में ‘दिनों में’ की छवि सुरक्षित रखी गई है और ऐसा ‘सभी’ नहीं जोड़ा गया जो यूनानी पाठ में स्पष्ट रूप से नहीं है।
- source_word: ὑμνεῖ
  choice: स्तुतिगान करती है
  rationale: यह क्रिया केवल सामान्य प्रशंसा नहीं, बल्कि गाकर स्तुति करने का भाव भी रखती है; ‘स्तुतिगान’ उस संगीतमय अर्थ को संक्षेप में व्यक्त करता है।
- source_word: πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: स्वर्गों की सारी सेना
  rationale: इस यहूदी-यूनानी और स्तुतिपरक संदर्भ में δύναμις स्वर्गीय प्राणियों की सामूहिक सेना का द्योतक हो सकता है। ‘स्वर्गों’ बहुवचन οὐρανῶν को भी दर्शाता है।
- source_word: σοῦ ἐστιν ἡ δόξα
  choice: महिमा...तेरी ही है
  rationale: ‘ही’ सर्वनाम पर यूनानी के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: मानक स्तुतिपरक अभिव्यक्ति को सहज और गरिमापूर्ण आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: ἀμήν
  choice: आमीन
  rationale: प्रचलित हिन्दी मसीही उपासना-परम्परा के अनुसार ध्वन्यन्तरण रखा गया है।
theological_decisions:
- issue: πᾶσα ἡ δύναμις τῶν οὐρανῶν का आशय
  choice: स्वर्गीय प्राणियों की सामूहिक सेना
  alternative: स्वर्गों की समस्त सामर्थ्य; प्रत्येक स्वर्गीय शक्ति
  rationale: स्तुतिपरक संदर्भ और बाइबलीय यूनानी प्रयोग में यह पद स्वर्गीय प्राणियों अथवा सेनाओं को सूचित कर सकता है। मुख्य पाठ में सम्भावित सामूहिक और सजीव अर्थ रखा गया है, पर पादटिप्पणी में वास्तविक शाब्दिक अस्पष्टता सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर को सीधे सम्बोधित करने के लिए निकटता और पारम्परिक प्रार्थना-शैली वाला एकवचन ‘तेरी/तेरा’ प्रयोग हुआ है। वाक्य की मूल समान्तर स्तुतिपरक संरचना तथा ‘जीवन के दिनों में’ की कालगत छवि सुरक्षित रखी गई है।
