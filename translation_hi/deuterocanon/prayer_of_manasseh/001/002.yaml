  text: the one who made heaven and earth[a], with all their host,
translation:
  language: hi
  text: जिसने आकाश और पृथ्वी को उनकी सारी व्यवस्था[a] सहित बनाया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी सारी सज्जा’ अथवा ‘उनका पूरा विन्यास।’ यहाँ यूनानी शब्द κόσμος सम्भवतः आकाश और पृथ्वी से संबंधित समूची क्रमबद्ध रचना को दर्शाता है, न कि ‘संसार’ का दूसरी बार उल्लेख।
    reason: शब्दार्थ के वास्तविक विकल्प और κόσμος की सृष्टि-संदर्भित अर्थ-छाया स्पष्ट करना।
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: जिसने … बनाया
  rationale: संज्ञा के रूप में प्रयुक्त सवर्णयुक्त भूतकालिक कृदन्त परमेश्वर का वर्णन करता है। ‘जिसने … बनाया’ हिन्दी में स्वाभाविक रहते हुए इस वर्णनात्मक कृदन्त का भाव बनाए रखता है।
- source_word: τὸν οὐρανὸν
  choice: आकाश
  rationale: ‘आकाश और पृथ्वी’ की सृष्टि-संबंधी युग्म-अभिव्यक्ति में οὐρανός के लिए ‘आकाश’ व्यापक और स्वाभाविक हिन्दी शब्द है; इसे केवल दृश्य ‘आसमान’ तक सीमित नहीं किया गया।
- source_word: τὴν γῆν
  choice: पृथ्वी
  rationale: इस सार्वभौमिक युग्म में γῆ किसी विशेष देश या भूमि को नहीं, बल्कि पृथ्वी को सूचित करता है।
- source_word: σὺν
  choice: सहित
  rationale: σὺν संग-साथ और समावेश व्यक्त करता है। ‘सहित’ स्पष्ट करता है कि आगे कही गई सुव्यवस्था भी बनाई गई वस्तुओं में सम्मिलित है।
- source_word: παντὶ τῷ κόσμῳ αὐτῶν
  choice: उनकी समूची सुव्यवस्था
  rationale: κόσμος यहाँ ‘संसार’ की पुनरुक्ति से अधिक आकाश और पृथ्वी की व्यवस्थित रचना, विन्यास या सज्जा का बोध कराता है। ‘समूची सुव्यवस्था’ उसके पूर्ण, क्रमबद्ध विस्तार को व्यक्त करती है और αὐτῶν को ‘उनकी’ से बनाए रखती है।
theological_decisions:
- issue: सृष्टि-वर्णन में κόσμος का अर्थ
  choice: ‘सुव्यवस्था’ के रूप में अनुवाद
  alternative: ‘सज्जा’; ‘पूरा विन्यास’; ‘उनमें जो कुछ है वह सब’
  rationale: आकाश और पृथ्वी का उल्लेख पहले ही हो चुका है, इसलिए κόσμος को फिर ‘संसार’ कहना अनावश्यक पुनरुक्ति और सम्भावित भ्रम पैदा करेगा। यूनानी शब्द में क्रमबद्ध व्यवस्था, विन्यास और सज्जा—इन सभी का अर्थ-क्षेत्र उपस्थित है; मुख्य पाठ में ‘सुव्यवस्था’ रखा गया और वास्तविक वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित किए गए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक और सहज वाक्यांश। ‘बनाया’ मूल ποιέω के निकट है; ‘रचा’ की काव्यात्मक अतिरिक्त छाया नहीं जोड़ी गई। वाक्य के अंत का अल्पविराम अगले पद में जारी प्रार्थना के अनुरूप रखा गया है।
