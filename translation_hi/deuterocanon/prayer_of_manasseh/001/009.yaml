  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/009.yaml
  text: For I have sinned beyond the number of the sand of the sea. My lawless deeds have multiplied[a], Lord; my lawless deeds have multiplied, and I am not worthy to look up and see the height of heaven because of the multitude of my unrighteous acts.
translation:
  language: hi
  text: क्योंकि मैंने समुद्र की रेत की गिनती से भी बढ़कर पाप किए हैं। हे प्रभु, मेरे अधर्म के काम बहुत बढ़ गए हैं; मेरे अधर्म के काम बहुत बढ़ गए हैं। और अपने अन्यायपूर्ण कामों की अधिकता के कारण मैं स्वर्ग की ऊँचाई को टकटकी लगाकर देखने के योग्य नहीं हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἥμαρτον
  choice: मैंने ... पाप किए हैं
  rationale: ग्रीक एओरिस्ट यहाँ अंगीकार के संदर्भ में बीते पाप और उनके वर्तमान नैतिक परिणाम दोनों व्यक्त करता है; हिन्दी का पूर्णकाल स्वाभाविक है।
- source_word: ὑπὲρ ἀριθμὸν ψάμμου θαλάσσης
  choice: समुद्र की रेत की गिनती से भी बढ़कर
  rationale: यह तुलना पापों की अगणनीय अधिकता बताती है और समुद्र की रेत वाले बाइबलीय बिंब को बनाए रखती है।
- source_word: ἐπλήθυναν
  choice: बहुत बढ़ गए हैं
  rationale: क्रिया संख्या में अत्यधिक हो जाने का भाव देती है; यह आधुनिक हिन्दी में सहज है और मूल की पुनरावृत्ति के साथ ठीक बैठती है।
- source_word: ἀνομίαι
  choice: अधर्म के काम
  rationale: ἀνομία परमेश्वर की व्यवस्था और उचित नैतिक क्रम के उल्लंघन का भाव रखता है; ‘अधर्म के काम’ साधारण पाठक के लिए स्पष्ट है और इसे केवल सामान्य ‘पाप’ में नहीं समेटता।
- source_word: κύριε
  choice: हे प्रभु
  rationale: सम्बोधन का भाव आधुनिक गरिमापूर्ण हिन्दी में ‘हे प्रभु’ से स्वाभाविक और स्पष्ट होता है।
- source_word: οὐκ εἰμὶ ἄξιος
  choice: मैं ... योग्य नहीं हूँ
  rationale: यह व्यक्तिगत अयोग्यता का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἀτενίσαι καὶ ἰδεῖν
  choice: की ओर टकटकी लगाकर देखने
  rationale: ἀτενίζω स्थिर अथवा एकाग्र दृष्टि से देखने पर बल देता है; ‘टकटकी लगाकर’ इस अर्थ को सुरक्षित रखता है, जबकि स्वर्ग की ऊँचाई दिशा स्पष्ट करती है।
- source_word: τὸ ὕψος τοῦ οὐρανοῦ
  choice: स्वर्ग की ऊँचाई
  rationale: मूल के एकवचन ‘ऊँचाई’ और स्वर्ग की उदात्तता के बिंब को निकटता से बनाए रखता है।
- source_word: ἀπὸ τοῦ πλήθους τῶν ἀδικιῶν μου
  choice: अपने अन्याय के कामों की अधिकता के कारण
  rationale: ἀπό यहाँ कारणसूचक है; ‘के कारण’ सहज हिन्दी है। ‘अन्याय के काम’ ἀδικία को पहले प्रयुक्त ἀνομία से अलग रखता है।
theological_decisions:
- issue: एक ही अंगीकार में ἀνομίαι और ἀδικιῶν का भेद
  choice: ἀνομίαι के लिए ‘अधर्म के काम’ और ἀδικιῶν के लिए ‘अन्याय के काम’
  alternative: दोनों को ‘पाप’ या दोनों को ‘अधर्म’ कहना
  rationale: मूल यूनानी दो निकट, पर अलग नैतिक शब्दों का प्रयोग करता है। भेद बनाए रखने से अंगीकार की अर्थपूर्ण व्यापकता सुरक्षित रहती है।
- issue: κύριε का सम्बोधन
  choice: हे प्रभु
  alternative: प्रभु
  rationale: ‘हे’ कोई अतिरिक्त उपाधि नहीं जोड़ता, बल्कि यूनानी सम्बोधन को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- issue: ἀτενίσαι में दिशा या स्थिर दृष्टि
  choice: स्थिर दृष्टि का अर्थ ‘टकटकी लगाकर’ व्यक्त करना और दिशा को प्रसंग से प्रकट होने देना
  alternative: केवल ‘ऊपर देखने’ कहना
  rationale: मूल क्रिया मुख्यतः ध्यानपूर्वक या स्थिर दृष्टि से देखने का भाव रख सकती है। अनावश्यक रूप से इसे केवल ऊपर की दिशा तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक लहजा रखा गया है। मूल की ‘मेरे अधर्म के काम बहुत बढ़ गए हैं’ वाली पुनरावृत्ति जानबूझकर सुरक्षित है। ‘टकटकी’ सामान्य आधुनिक शब्द है और ἀτενίσαι की तीव्र दृष्टि को स्पष्ट करता है।
