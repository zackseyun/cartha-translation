  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/007.yaml
  text: For you are the Lord Most High[a], compassionate, patient, and abounding in mercy[b], and relenting concerning the evils of men.
translation:
  language: hi
  text: क्योंकि आप ही परमप्रधान प्रभु हैं—करुणामय, धैर्यवान और दया से भरपूर—और मनुष्यों की बुराइयों के विषय में अपना मन बदलते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अनुवाद ‘मनुष्यों की बुराइयों के विषय में दण्ड देने से पीछे हटते हैं’ भी हो सकता है। इसका अर्थ नैतिक भूल पर पछताना नहीं, बल्कि न्याय करने के निर्णय से फिरना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος ὕψιστος
  choice: परमप्रधान प्रभु
  rationale: दोनों शब्दों को एक संयुक्त ईश्वरीय उपाधि के रूप में रखा गया है; ‘प्रभु’ κύριος और ‘परमप्रधान’ ὕψιστος का स्वाभाविक तथा प्रतिष्ठित हिन्दी रूप है।
- source_word: εὔσπλαγχνος
  choice: करुणामय
  rationale: यह गहरी करुणा और कोमल दया को व्यक्त करता है; आगे आने वाले πολυέλεος से अनावश्यक पुनरुक्ति भी नहीं होती।
- source_word: μακρόθυμος
  choice: धीरजवन्त
  rationale: यह दीर्घ सहनशीलता और क्रोध करने में विलम्ब का संक्षिप्त, गरिमापूर्ण हिन्दी रूप है।
- source_word: πολυέλεος
  choice: दया से भरपूर
  rationale: यह यौगिक शब्द दया की प्रचुरता बताता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: μετανοῶν
  choice: अपना दण्ड टाल देते हैं
  rationale: परमेश्वर के विषय में यह नैतिक पश्चात्ताप नहीं, बल्कि मनुष्यों की बुराइयों के संबंध में आने वाले अनिष्ट या न्याय से पीछे हटने का भाव रखता है। हिन्दी में अकेला ‘पछताते’ भ्रामक होता और ‘मन बदलते’ अनावश्यक रूप से अस्पष्ट होता।
- source_word: ἐπὶ κακίαις ἀνθρώπων
  choice: मनुष्यों की बुराइयों के विषय में
  rationale: संक्षिप्त यूनानी वाक्यांश की अस्पष्टता को यथासंभव बनाए रखते हुए κακίαις को ‘बुराइयों’ और ἀνθρώπων को सामान्य मानववाची ‘मनुष्यों’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: परमेश्वर के लिए μετανοῶν का अर्थ
  choice: अपना दण्ड टाल देते हैं
  alternative: पछताते हैं; अपना मन बदलते हैं; नरम पड़ते हैं
  rationale: संदर्भ परमेश्वर के किसी नैतिक अपराध से पश्चात्ताप का नहीं, बल्कि मानव बुराइयों के संबंध में न्याय अथवा अनिष्ट से पीछे हटने का है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और पादटिप्पणी मूल क्रिया की व्यापकता सुरक्षित रखती है।
- issue: ἀνθρώπων की मानववाची व्यापकता
  choice: मनुष्यों
  alternative: लोगों; मानवजाति
  rationale: ‘मनुष्यों’ आधुनिक मानक हिन्दी में सभी मनुष्यों को समेटने वाला स्वाभाविक बहुवचन है और यूनानी के सामान्य मानववाची अर्थ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में भक्तिपूर्ण और गरिमापूर्ण शैली अपनाई गई है। प्रार्थना में परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। वाक्य की गुण-सूची को डैश से स्पष्ट किया गया है, और यूनानी की संक्षिप्त अंतिम अभिव्यक्ति की अर्थगत तन्यता पादटिप्पणी में सुरक्षित रखी गई है।
