  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/001.yaml
  text: Lord Almighty[a], God of our fathers, of Abraham and Isaac and Jacob and of their righteous offspring,
translation:
  language: hi
  text: हे सर्वशक्तिमान प्रभु, हमारे पितरों के परमेश्वर, अब्राहम, इसहाक और याकूब तथा उनके धर्मी वंश[a] के,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बीज’; यूनानी शब्द का अर्थ ‘वंश’ या ‘संतान’ भी हो सकता है, विशेषकर वाचा और वंशावली के संदर्भ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε παντοκράτωρ
  choice: हे सर्वशक्तिमान प्रभु
  rationale: सम्बोधन को स्वाभाविक हिन्दी में ‘हे’ के साथ रखा गया है। ‘सर्वशक्तिमान’ παντοκράτωρ का प्रचलित और गरिमापूर्ण बाइबलीय प्रतिशब्द है।
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के परमेश्वर
  rationale: πατέρων का मूल अर्थ ‘पिताओं’ है, पर आधुनिक हिन्दी में वंशगत और वाचाई आशय के लिए ‘पूर्वजों’ अधिक स्वाभाविक और स्पष्ट है; ‘परमेश्वर’ θεός के लिए प्रतिष्ठित बाइबलीय पद है।
- source_word: τοῦ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: अब्राहम और इसहाक और याकूब के
  rationale: हर καί को ‘और’ से व्यक्त करके यूनानी की गंभीर, क्रमिक लय बनाए रखी गई है।
- source_word: σπέρματος αὐτῶν τοῦ δικαίου
  choice: उनके धर्मी वंश
  rationale: σπέρμα यहाँ सामूहिक वंश या संतान को सूचित करता है। ‘वंश’ हिन्दी में वंशावली और वाचा-संबंधी भाव को सहज रूप से व्यक्त करता है; τοῦ δικαίου को उसी सामूहिक वंश का विशेषण मानकर ‘धर्मी’ रखा गया है।
theological_decisions:
- issue: πατέρων में लिंग-विशिष्ट वाचाई भाषा
  choice: पूर्वजों
  alternative: पितरों / पिताओं
  rationale: यूनानी शब्द पुल्लिंग है, किंतु यहाँ अब्राहम, इसहाक और याकूब से जुड़ी पैतृक परंपरा का सामूहिक संकेत है। ‘पूर्वजों’ आधुनिक मानक हिन्दी में बिना आशय बदले अधिक सहज है; इसे लिंग-संबंधी किसी धर्मवैज्ञानिक दावे के रूप में नहीं लिया गया।
- issue: σπέρμα का वाचा और वंश से संबंधित अर्थ
  choice: वंश
  alternative: बीज / संतान
  rationale: ‘बीज’ अधिक शाब्दिक है और वाचा-संबंधी प्रतिध्वनि रखता है, पर इस वाक्य में सामान्य हिन्दी पाठक के लिए अस्पष्ट हो सकता है। ‘वंश’ सामूहिक एकवचन और वंशगत आशय को बनाए रखता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: τοῦ δικαίου का संबंध
  choice: धर्मी वंश
  alternative: धर्मी जन / धर्मी संतान
  rationale: रूपात्मक रूप से विशेषण σπέρματος के साथ संबंध रखता है। अनुवाद इसे सामूहिक वंश की विशेषता के रूप में खुला रखता है और किसी एक विशिष्ट वंशज तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और बाइबलीय शैली रखी गई है। यूनानी वाक्यांश में ‘परमेश्वर’ एक बार आता है, पर हिन्दी में अंतिम ‘के परमेश्वर’ जोड़ने से संबंध स्पष्ट और वाक्य स्वाभाविक बनता है।
