translation:
  language: hi
  text: जिसके सामने सब कुछ तेरे सामर्थ्य के प्रताप से थरथराता और काँपता है; क्योंकि तेरी महिमा का प्रताप सहन नहीं किया जा सकता,[a] और पापियों के विरुद्ध तेरी धमकी का क्रोध असहनीय है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी महिमा के प्रताप का सामना नहीं किया जा सकता।”
    reason: lexical_alternative
  - marker: b
    text: या, “पापियों के विरुद्ध तेरी धमकी का क्रोध झेला नहीं जा सकता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν πάντα φρίσσει καὶ τρέμει
  choice: जिसके सामने सब कुछ ... थरथराता और काँपता है
  rationale: ὃν का संबंध पिछले पद में संबोधित परमेश्वर से है; ‘जिसके सामने’ उस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है। नपुंसकलिंग πάντα का व्यापक अर्थ ‘सब कुछ’ है। दोनों क्रियाओं की भयपूर्ण समानांतरता को ‘थरथराता और काँपता’ से रखा गया है।
- source_word: ἀπὸ προσώπου τῆς δυνάμεώς σου
  choice: तेरे सामर्थ्य की उपस्थिति से
  rationale: ἀπὸ προσώπου का शाब्दिक बिंब ‘मुख/उपस्थिति से’ है और यहाँ भय के कारण को व्यक्त करता है। ‘उपस्थिति से’ मूल अभिव्यक्ति और कारणात्मक अर्थ दोनों को बनाए रखता है; δύναμις के लिए गरिमापूर्ण और सहज ‘सामर्थ्य’ चुना गया है।
- source_word: ἄστεκτος ἡ μεγαλοπρεπία τῆς δόξης σου
  choice: तेरी महिमा का प्रताप सहन नहीं किया जा सकता
  rationale: μεγαλοπρεπία को ‘प्रताप’ और δόξα को ‘महिमा’ कहना दो संबद्ध धारणाओं को अलग रखता है। ἄστεκτος में ‘सहन न किए जाने’ और ‘सामना न कर पाने’ दोनों की छाया है; मुख्य पाठ में पहला अर्थ रखा गया है और दूसरे को टिप्पणी में।
- source_word: ἀνυπόστατος ἡ ὀργὴ τῆς ... ἀπειλῆς σου
  choice: तेरी धमकी का क्रोध असहनीय है
  rationale: ἀνυπόστατος ऐसी वस्तु को बताता है जिसे सहा या झेला नहीं जा सकता। ὀργή और ἀπειλή के प्रत्यक्ष संबंध को सरल किए बिना क्रमशः ‘क्रोध’ और ‘धमकी’ से रखा गया है।
- source_word: ἐπὶ ἁμαρτωλοὺς
  choice: पापियों के विरुद्ध
  rationale: यहाँ ἐπί धमकी की लक्ष्य-दिशा बताता है। ‘के विरुद्ध’ न्यायसूचक बल को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय क्रोध और धमकी के लिए व्यक्तिपरक भाषा
  choice: ‘पापियों के विरुद्ध तेरी धमकी का क्रोध’ जैसी प्रबल भाषा को बनाए रखा गया।
  alternative: ‘पापियों को दी गई चेतावनी में प्रकट तेरा क्रोध’ या ‘पापियों के लिए घोषित क्रोध’
  rationale: यूनानी पाठ सीधे परमेश्वर की ὀργή और ἀπειλή कहता है। इसे केवल निष्प्राण परिणाम या हल्की चेतावनी बनाना पाठ की न्यायसूचक तीव्रता घटाता; फिर भी अनुवाद इससे आगे कोई व्यवस्थित धर्मसिद्धांत नहीं जोड़ता।
- issue: ἄστεκτος में सहने और सामना करने की अर्थ-छाया
  choice: मुख्य पाठ में ‘सहन नहीं किया जा सकता’ रखा गया।
  alternative: ‘जिसका सामना नहीं किया जा सकता’
  rationale: दोनों अर्थ संभव हैं। मुख्य पाठ निकटवर्ती ἀνυπόστατος के साथ काव्यात्मक समानांतरता बनाए रखता है, जबकि टिप्पणी वास्तविक वैकल्पिक अर्थ को सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। संबोधन में ‘तेरे/तेरी’ का प्रयोग निकटवर्ती भक्तिपरक स्वर के लिए है। ‘थरथराता और काँपता’ यूनानी की दोहरी भय-अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है; अस्पष्टताओं को जहाँ आवश्यक था, पादटिप्पणियों में सुरक्षित किया गया है।
