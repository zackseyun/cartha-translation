lexical_decisions:
- source_word: ἀμέτρητόν
  choice: अपरिमेय
  rationale: यह उस वस्तु को व्यक्त करता है जिसे मापा नहीं जा सकता। ‘अपरिमेय’ यूनानी शब्द के परिमाण-संबंधी बल को संक्षेप और गरिमा के साथ बनाए रखता है।
- source_word: ἀνεξιχνίαστον
  choice: अथाह
  rationale: यह उस बात को व्यक्त करता है जिसकी पूरी थाह या खोज नहीं पाई जा सकती। ‘अथाह’ आधुनिक हिन्दी में स्वाभाविक है और ‘अपरिमेय’ के साथ सुगठित युग्म बनाता है।
- source_word: ἔλεος
  choice: दया
  rationale: ἔλεος दया अथवा करुणा का सामान्य शब्द है। पश्चात्तापपूर्ण प्रार्थना के प्रसंग में ‘दया’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञा
  rationale: ἐπαγγελία का सीधा अर्थ प्रतिज्ञा या वादा है। ‘प्रतिज्ञा’ इस प्रार्थना की गरिमापूर्ण शैली और परमेश्वर के आश्वासन के भाव, दोनों के अनुकूल है।
- source_word: τε καὶ
  choice: और
  rationale: ये कण दोनों विशेषणों को घनिष्ठ रूप से जोड़ते हैं। हिन्दी में ‘और’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: τὸ ἔλεος τῆς ἐπαγγελίας σου में ‘दया’ और ‘प्रतिज्ञा’ के बीच संबंध
  choice: ‘तेरी प्रतिज्ञा की दया’
  alternative: ‘तेरी प्रतिज्ञात दया’ अथवा ‘तेरी प्रतिज्ञा में प्रकट दया’
  rationale: यूनानी संबंधकारक रचना को निकटता से बनाए रखने पर ‘तेरी प्रतिज्ञा की दया’ बनता है। इससे यह अर्थ खुला रहता है कि दया प्रतिज्ञा से संबंधित है, उसमें प्रकट होती है, या उसके द्वारा सुनिश्चित है; अनुवाद इनमें से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
