base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/013.yaml
  text: 'I beg you[a], pleading with you: forgive me, Lord, forgive me, and do not destroy me along with my lawless deeds, nor, being angry forever, keep my evils against me, nor condemn me in the lowest parts of the earth; for you, Lord[b], are the God of those who repent[c],'
translation:
  language: hi
  text: 'मैं तुझसे याचना करता हूँ, तुझसे विनती करता हूँ: हे प्रभु, मुझे क्षमा कर, मुझे क्षमा कर। मेरे अधर्मों समेत मेरा नाश न कर; न सदा क्रोधित रहकर मेरी बुराइयों को मेरे विरुद्ध सँभालकर रख[a], और न पृथ्वी के सबसे निचले भागों में मुझे दोषी ठहरा[b]; क्योंकि हे प्रभु, तू पश्चाताप करने वालों[c] का परमेश्वर है,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, मेरी बुराइयों को मेरे विरुद्ध याद न रख।
    reason: ग्रीक वाक्यांश का यह अधिक मुहावरेदार हिन्दी अर्थ है।
  - marker: b
    text: या, “पृथ्वी की गहराइयों में।” यह अभिव्यक्ति पृथ्वी के नीचे के सबसे निचले क्षेत्रों की ओर संकेत करती है।
    reason: स्थानवाचक अभिव्यक्ति का स्वाभाविक वैकल्पिक अनुवाद देता है।
  - marker: c
    text: या, “मन फिराने वालों।”
    reason: μετανοούντων में पश्चाताप के साथ मन या दिशा बदलने का भाव भी हो सकता है।
lexical_decisions:
- source_word: αἰτοῦμαι δεόμενός σου
  choice: मैं तुझसे याचना करता हूँ, तुझसे विनती करता हूँ
  rationale: दोनों निकटार्थक अभिव्यक्तियों को बनाए रखते हुए प्रार्थी की तीव्र और नम्र पुकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄνες μοι
  choice: मुझे क्षमा कर
  rationale: पश्चाताप की इस प्रार्थना में ‘छोड़ दे’ या ‘मुक्त कर’ की अपेक्षा ‘क्षमा कर’ अभिप्रेत अर्थ को सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: συναπολέσῃς με ταῖς ἀνομίαις μου
  choice: मेरे अधर्म के कामों समेत मेरा नाश न कर
  rationale: ‘समेत’ संयुक्त विनाश के συν- भाव को बनाए रखता है और ἀνομίαις की नैतिक गंभीरता को सामान्य ‘पापों’ में नहीं समेटता।
- source_word: μηνίσας τηρήσῃς τὰ κακά μοι
  choice: क्रोधित रहकर मेरी बुराइयों को मेरे विरुद्ध रख
  rationale: क्रोध और अपराधों को प्रतिकूल रूप से सँभालकर रखने—दोनों भावों को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἐν τοῖς κατωτάτοις τῆς γῆς
  choice: पृथ्वी के सबसे निचले भागों में
  rationale: ἐν के स्थानवाचक भाव और κατωτάτοις के अत्युत्तम रूप, दोनों को निकटता से व्यक्त करता है।
- source_word: τῶν μετανοούντων
  choice: पश्चाताप करने वालों
  rationale: कृदन्त के चल रहे या चरित्रगत कर्मभाव को स्पष्ट, प्रचलित धार्मिक हिन्दी में बनाए रखता है।
- source_word: κύριε
  choice: हे प्रभु
  rationale: ईश्वर को सीधे संबोधित करने के लिए κύριος का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
theological_decisions:
- issue: ἀνομία की नैतिक तीव्रता
  choice: अधर्म के काम
  alternative: पाप
  rationale: ‘अधर्म’ व्यवस्था-विरोधी आचरण की तीव्रता को बनाए रखता है, जबकि ‘के काम’ हिन्दी में बहुवचन कर्मों को स्वाभाविक बनाता है।
- issue: पश्चाताप का क्रियात्मक भाव
  choice: पश्चाताप करने वाले
  alternative: मन फिराने वाले
  rationale: मुख्य पाठ में परिचित अभिव्यक्ति रखी गई है; वैकल्पिक ‘मन फिराना’ दिशा-परिवर्तन के भाव को उभारता है और पादटिप्पणी में दिया गया है।
- issue: ἐν τοῖς κατωτάτοις के साथ दण्डादेश का संबंध
  choice: सबसे निचले भागों में मुझे दोषी ठहरा
  alternative: सबसे निचले भागों के लिए मुझे दण्डित ठहरा
  rationale: ग्रीक ἐν के ‘में’ भाव को बनाए रखते हुए वाक्य को अनावश्यक रूप से गंतव्यवाचक नहीं बनाया गया; संभावित गहराइयों का अर्थ पादटिप्पणी में स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ईश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तू/तुझसे’ तथा आज्ञार्थक ‘कर’ का सुसंगत प्रयोग हुआ है। पद के अंत का अल्पविराम अगले पद से जारी वाक्य को दर्शाता है।
