lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: यह कालगत संक्रमण और καὶ के संयोजक बल, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: κλίνω
  choice: मैं ... झुकाता हूँ
  rationale: क्रिया के झुकाने के ठोस अर्थ को γόνυ के साथ सुरक्षित रखता है और रूपक को अनावश्यक रूप से सरल नहीं करता।
- source_word: γόνυ καρδίας
  choice: अपने हृदय का घुटना
  rationale: यूनानी में γόνυ एकवचन है और καρδίας संबंधकारक; यह अनुवाद भीतरी दीनता के सजीव रूपक को ज्यों का त्यों रखता है।
- source_word: δεόμενος
  choice: विनती करता हूँ
  rationale: प्रार्थनापूर्ण और दीन आग्रह को स्वाभाविक, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῆς παρὰ σοῦ χρηστότητος
  choice: उस कृपालुता की ... जो आपकी ओर से आती है
  rationale: χρηστότης की दयालु भलाई को ‘कृपालुता’ से और παρὰ σοῦ के स्रोत-बोध को स्पष्ट रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: γόνυ καρδίας का रूपक
  choice: ‘अपने हृदय का घुटना’ के रूप में रूपक बनाए रखना
  alternative: ‘मैं दीन होकर अपना हृदय झुकाता हूँ’
  rationale: मूल पाठ पश्चात्ताप और आंतरिक दीनता को भीतरी घुटना टेकने के असामान्य, सजीव चित्र से व्यक्त करता है; व्याख्यात्मक समतलीकरण उसकी काव्यात्मक और भक्तिपरक शक्ति घटा देता।
- issue: παρὰ σοῦ में कृपालुता का स्रोत
  choice: ‘जो आपकी ओर से आती है’
  alternative: ‘आपकी कृपालुता’
  rationale: विस्तृत रूप मूल वाक्यांश में निहित इस बल को बनाए रखता है कि याचित कृपालुता परमेश्वर की ओर से प्राप्त होती है, बिना किसी अतिरिक्त धर्मसिद्धान्त को जोड़ने के।
translation_notes:
