    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγή
  choice: चीख-पुकार
  rationale: यह शब्द ऊँची और आपातकालीन पुकार को दर्शाता है; ‘चीख-पुकार’ प्रसंग की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παράδεισος
  choice: बगीचा
  rationale: इस प्रसंग में यह घर से लगा हुआ भौतिक उद्यान है; ‘स्वर्ग’ अर्थ यहाँ उपयुक्त नहीं है।
- source_word: οἱ ἐκ τῆς οἰκίας
  choice: घर के लोग
  rationale: यह स्वाभाविक हिन्दी है और परिवार, सेवक या अन्य गृहस्थ जनों में से किसी एक वर्ग को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: εἰσεπήδησαν
  choice: भीतर दौड़े आए
  rationale: क्रिया भीतर की ओर अचानक और तेज़ गति बताती है; यह चयन उस तत्परता को सहज हिन्दी में बनाए रखता है।
- source_word: πλαγία θύρα
  choice: बगल का द्वार
  rationale: वाक्यांश किसी पार्श्व प्रवेश-द्वार को दर्शाता है; ‘द्वार’ दरवाज़े और फाटक के बीच मूल की संभावित स्थापत्यगत अस्पष्टता को पर्याप्त रूप से खुला रखता है।
- source_word: τὸ συμβεβηκὸς αὐτῇ
  choice: उसके साथ क्या हुआ था
  rationale: यह पूर्ण कृदन्त और αὐτῇ के संबंध को मुहावरेदार आधुनिक हिन्दी में ठीक तरह व्यक्त करता है।
