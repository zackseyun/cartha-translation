translation:
  language: hi
  text: पर जब घर के लोगों ने बगीचे में चीख-पुकार सुनी, तो वे बगल के द्वार[a] से दौड़कर भीतर आ गए, ताकि देखें कि उसके साथ क्या हुआ था।
  philosophy: optimal-equivalence
  footnotes:
