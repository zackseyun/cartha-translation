base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/042.yaml
  text: And Susanna cried out with a loud voice and said, “O eternal God, knower of the hidden things, who knows all things before they come to be,”
translation:
  language: hi
  text: और सुसन्ना ने ऊँचे स्वर में पुकार उठकर कहा, “हे अनन्त परमेश्वर, छिपी हुई बातों को जानने वाले[a], जो सब बातों को उनके अस्तित्व में आने से पहले जानते हैं[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रहस्यों को जानने वाले।”
    reason: lexical_alternative
  - marker: b
    text: या, “सब बातों को उनके घटित होने से पहले जानते हैं।” यूनानी पद का अर्थ बातों के अस्तित्व में आने या उनके घटित होने—दोनों से हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: पुकारकर कहा
  rationale: क्रिया एक प्रबल पुकार को व्यक्त करती है; निकटवर्ती εἶπεν के साथ यह हिन्दी में स्वाभाविक और भावपूर्ण है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और श्रव्य तीव्रता बनाए रखता है।
- source_word: Ὁ θεὸς ὁ αἰώνιος
  choice: हे अनन्त परमेश्वर
  rationale: यहाँ कर्ताकार रूप प्रार्थना में सम्बोधन का कार्य करता है; ‘हे’ उस कार्य को स्पष्ट करता है और αἰώνιος को ‘अनन्त’ रूप में सुरक्षित रखता है।
- source_word: ὁ τῶν κρυπτῶν γνώστης
  choice: छिपी हुई बातों को जानने वाले
  rationale: κρυπτά का अर्थ केवल संकीर्ण अर्थ में ‘रहस्य’ नहीं, बल्कि व्यापक रूप से छिपी हुई बातें भी है; यह रूप हिन्दी में सहज सम्बोधन है।
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: जो सब कुछ ... जानते हैं
  rationale: कृदन्त पदबंध को सम्बन्धवाचक उपवाक्य में रखना आधुनिक हिन्दी में स्वाभाविक है और τὰ πάντα की व्यापकता बनाए रखता है।
- source_word: πρὶν γενέσεως αὐτῶν
  choice: उसके अस्तित्व में आने से पहले ही
  rationale: γενέσεως किसी बात के अस्तित्व में आने या घटित होने को सूचित कर सकता है। यह चयन मूल की व्यापकता को यथासंभव रखता है; ‘ही’ पूर्वज्ञान पर बल को सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: πρὶν γενέσεως αὐτῶν में परमेश्वर के पूर्वज्ञान का कथन
  choice: जो सब कुछ उसके अस्तित्व में आने से पहले ही जानते हैं
  alternative: जो सब कुछ उसके घटित होने से पहले ही जानते हैं
  rationale: अनुवाद परमेश्वर के उस ज्ञान की पुष्टि करता है जो सभी बातों के उत्पन्न होने से पहले है, पर इससे आगे कोई विशिष्ट दार्शनिक या सम्प्रदायगत सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया ‘जानते हैं’ प्रयुक्त हुई है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
