  terminology: “हे अनन्त परमेश्वर” is appropriate in a dignified prayer register. “छिपी हुई बातों को जानने वाले” faithfully preserves the broad sense of τῶν κρυπτῶν; the footnote supplies “रहस्यों” as a narrower lexical alternative.
  issues:
