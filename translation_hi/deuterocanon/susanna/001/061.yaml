  text: And they rose up against the two elders, because Daniel had convicted them from their own mouth of being false witnesses, and they did to them as they had maliciously planned to do.
translation:
  language: hi
  text: तब वे उन दोनों बुज़ुर्गों के विरुद्ध उठ खड़े हुए, क्योंकि दानिय्येल ने उन्हीं के मुँह से सिद्ध कर दिया था कि वे झूठे गवाह थे;[a] और उन्होंने उन बुज़ुर्गों के साथ वही किया, जो उन्होंने दुष्टता से करने की योजना बनाई थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दानिय्येल ने उनकी अपनी गवाही से सिद्ध कर दिया था कि वे झूठे गवाह थे।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात उन बुज़ुर्गों को वही दंड मिला, जिसे वे दुष्टतापूर्वक सूज़न्ना पर लाना चाहते थे।
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέστησαν ἐπὶ
  choice: के विरुद्ध उठ खड़े हुए
  rationale: यह मुहावरा केवल खड़े होने का नहीं, बल्कि किसी के विरुद्ध प्रतिकूल कार्रवाई करने का भाव व्यक्त करता है; हिन्दी में यह न्यायिक और सार्वजनिक प्रतिक्रिया को स्वाभाविक ढंग से रखता है।
- source_word: πρεσβύτας
  choice: पुरनियों
  rationale: यहाँ वे केवल वृद्ध पुरुष नहीं, बल्कि समुदाय में अधिकार रखने वाले अगुए और न्यायी हैं; ‘पुरनिये’ उस सामाजिक पद को व्यक्त करता है।
- source_word: συνέστησεν
  choice: सिद्ध कर दिया था
  rationale: संदर्भ में दानिय्येल ने उनकी परस्पर-विरोधी बातों से उनका दोष प्रमाणित किया। ‘सिद्ध कर दिया’ कानूनी भाव रखता है, पर ‘दोषी ठहराया’ की अपेक्षा कर्ता की न्यायिक भूमिका को कम आरोपित करता है।
- source_word: ἐκ τοῦ στόματος αὐτῶν
  choice: उन्हीं के मुँह से
  rationale: यह उनके अपने बोले हुए शब्दों द्वारा उनके झूठ के उजागर होने की सजीव अभिव्यक्ति को बनाए रखता है।
- source_word: ψευδομάρτυρας ὄντας
  choice: झूठे गवाह
  rationale: शब्द विशेष रूप से न्यायिक झूठी गवाही को दर्शाता है, केवल सामान्य झूठ बोलने को नहीं।
- source_word: ἐποίησαν ... τὸν τρόπον
  choice: उनके साथ वही किया
  rationale: ग्रीक की अनुरूपता-सूचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है और किए गए प्रतिदंड को आगामी उपवाक्य से जोड़ता है।
- source_word: ἐπονηρεύσαντο
  choice: दुष्टता से करने की योजना बनाई थी
  rationale: मध्यवाच्य रूप इस प्रसंग में सूज़न्ना के विरुद्ध उनकी दुष्ट मंशा और षड्यंत्र की ओर संकेत करता है; यह अनुवाद उस अभिप्राय को स्पष्ट रखते हुए अंतिम कर्म को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: झूठे गवाहों पर प्रतिफलात्मक न्याय
  choice: अंतिम वाक्य को इस प्रकार रखा गया है कि पुरनियों के साथ वही किए जाने का संबंध उनकी अपनी दुष्ट योजना से स्पष्ट रहे।
  alternative: 'अधिक शब्दशः: ‘उन्होंने जिस प्रकार दुष्टता की थी, उसी प्रकार उनके साथ किया।’'
  rationale: पाठ में दुष्ट योजना और उसके अनुरूप दंड का संबंध है। अनुवाद इस न्यायिक प्रतिफल को स्पष्ट करता है, किंतु सूज़न्ना या व्यवस्थाविवरण के दंड का विवरण मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘पुरनियों’ से पद और सामुदायिक अधिकार का भाव रखा गया है। ‘उन्हीं के मुँह से’ मूल की सजीव न्यायिक अभिव्यक्ति को सुरक्षित रखता है।
