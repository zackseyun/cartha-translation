base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/024.yaml
  text: And Susanna groaned and said[a], “I am hemmed in on every side. For if I do this, it is death for me; but if I do not do it[b], I will not escape your hands.”
translation:
  language: hi
  text: तब सुसन्ना ने कराहकर कहा, “मैं चारों ओर से घिर गई हूँ[a], क्योंकि यदि मैं ऐसा करूँ, तो यह मेरे लिए मृत्यु है; पर यदि मैं ऐसा न करूँ, तो मैं तुम्हारे हाथों से नहीं बचूँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं हर ओर से बहुत संकट में हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεστέναξεν
  choice: कराहकर
  rationale: यह क्रिया गहरे दुःख और संकट से निकली आह या कराह को व्यक्त करती है; ‘कराहकर’ प्रसंग का भावात्मक भार बनाए रखता है।
- source_word: Στενά μοι πάντοθεν
  choice: मैं चारों ओर से घिर गई हूँ
  rationale: यह पदबंध हर ओर से संकट में फँसे होने और कोई सुरक्षित विकल्प न बचने का भाव देता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐὰν γὰρ τοῦτο πράξω
  choice: क्योंकि यदि मैं ऐसा करूँ
  rationale: ‘ऐसा करूँ’ संकेतवाचक τοῦτο को बिना अनावश्यक व्याख्या जोड़े सहज हिन्दी में व्यक्त करता है।
- source_word: θάνατός μοί ἐστιν
  choice: तो यह मेरे लिए मृत्यु है
  rationale: यूनानी की संज्ञात्मक और कठोर अभिव्यक्ति को बनाए रखा गया है; ‘मैं मर जाऊँगी’ की अपेक्षा यह मूल की आकस्मिक तीव्रता के अधिक निकट है।
- source_word: ἐὰν μὴ πράξω
  choice: यदि मैं ऐसा न करूँ
  rationale: प्रथम शर्त में आए πράξω की पुनरावृत्ति को प्रतिबिंबित करके मूल का अलंकारिक संतुलन सुरक्षित रखा गया है।
- source_word: οὐκ ἐκφεύξομαι
  choice: मैं ... नहीं बचूँगी
  rationale: यह भविष्यकालीन कथन को स्वाभाविक हिन्दी में व्यक्त करता है और असमर्थता की ऐसी अतिरिक्त व्याख्या नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
- source_word: τὰς χεῖρας ὑμῶν
  choice: तुम्हारे हाथों से
  rationale: मूल का ठोस रूपक सुरक्षित रहता है और हिन्दी में किसी के वश या पकड़ से बचने का अर्थ भी स्वाभाविक रूप से संप्रेषित होता है।
theological_decisions:
- issue: सुसन्ना पर डाले गए जबरदस्ती के संकट को बिना नरम किए प्रस्तुत करना
  choice: दोनों विकल्पों को मृत्यु और आरोप लगाने वालों की पकड़ के बीच एक कठोर दुविधा के रूप में रखा गया है।
  alternative: इसे सामाजिक अपमान या कानूनी संकट की स्पष्ट व्याख्या जोड़कर कहना।
  rationale: यूनानी पाठ सीधे बाध्यकारी संकट को सामने रखता है। अनुवाद न तो धमकी को हल्का करता है, न ही पद में अनुपस्थित विवरण जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘कराहकर’, ‘चारों ओर से घिर गई हूँ’ और ‘तुम्हारे हाथों से’ मूल की भावात्मक तीव्रता तथा ठोस रूपक को बनाए रखते हैं।
