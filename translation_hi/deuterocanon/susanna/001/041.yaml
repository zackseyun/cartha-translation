lexical_decisions:
- source_word: ἐπίστευσεν αὐτοῖς
  choice: उनकी बात पर विश्वास किया
  rationale: दत्तिव αὐτοῖς के साथ ἐπίστευσεν यहाँ उन पुरुषों की गवाही या आरोप को सच मान लेने का भाव देता है। केवल ‘उन पर विश्वास किया’ की अपेक्षा ‘उनकी बात पर विश्वास किया’ आधुनिक हिन्दी में प्रसंग को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ συναγωγὴ πᾶσα
  choice: पूरी सभा
  rationale: सυναγωγή यहाँ किसी भवन या बाद की संस्थागत ‘आराधनालय’ संज्ञा के बजाय एकत्र समुदाय को सूचित करता है। ‘पूरी सभा’ सामूहिक और समग्र अर्थ बनाए रखता है।
- source_word: ὡς
  choice: क्योंकि
  rationale: ὡς यहाँ सभा द्वारा उनकी बात मानने का कारण प्रस्तुत करता है—वे मान्य अगुए और न्यायाधिकारी थे। हिन्दी में ‘क्योंकि’ यह कारण-संबंध स्पष्ट और स्वाभाविक रूप से बताता है।
- source_word: πρεσβυτέρων
  choice: पुरनिए
  rationale: यह शब्द केवल अधिक आयु वाले पुरुषों के लिए नहीं, बल्कि समुदाय में मान्यता प्राप्त अगुओं के लिए प्रयुक्त है। ‘पुरनिए’ हिन्दी बाइबलीय परंपरा में इस पद और सामाजिक भूमिका को संक्षेप में व्यक्त करता है।
- source_word: κριτῶν
  choice: न्यायी
  rationale: κριτής न्याय करने का अधिकार रखने वाले व्यक्तियों को दर्शाता है। ‘न्यायी’ इस औपचारिक सामुदायिक भूमिका का संक्षिप्त और प्रतिष्ठित हिन्दी रूप है।
- source_word: τοῦ λαοῦ
  choice: प्रजा के
  rationale: λαός यहाँ समुदाय या जनसमूह को सूचित करता है। न्यायिक संदर्भ में ‘प्रजा के’ स्वाभाविक रूप से बताता है कि वे उसी समुदाय के नियुक्त न्यायाधिकारी थे।
theological_decisions:
- issue: पूर्व-ईसाई यहूदी कथा में συναγωγή का अनुवाद
  choice: सभा
  alternative: मण्डली; आराधनालय
  rationale: यूनानी शब्द यहाँ एकत्र समुदाय को दर्शाता है। ‘सभा’ किसी भवन का अनर्थक संकेत नहीं देता और ‘मण्डली’ से जुड़ी संभावित आधुनिक कलीसियाई छाया से भी बचता है।
