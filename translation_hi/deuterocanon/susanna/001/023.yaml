    text: अर्थात सुसन्ना के साथ रहने वाली महिला परिचारिकाएँ; यूनानी शब्द का शाब्दिक अर्थ ‘लड़कियाँ’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: पर यदि नहीं
  rationale: यह पिछले पद की माँग पर निर्भर अधूरी शर्त है। संक्षिप्त रूप मूल की अचानक और धमकी-भरी अभिव्यक्ति को बनाए रखता है।
- source_word: καταμαρτυρήσομέν σου
  choice: हम तुम्हारे विरुद्ध यह गवाही देंगे
  rationale: क्रिया में विरोधी और न्यायिक गवाही का भाव है। ‘दोष लगाएंगे’ की अपेक्षा यह मूल के विधिक स्वर को अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: ὅτι ἦν μετὰ σοῦ νεανίσκος
  choice: कि एक युवक तुम्हारे साथ था
  rationale: νεανίσκος के लिए ‘युवक’ स्वाभाविक आधुनिक हिन्दी है और कथित पुरुष की अपेक्षाकृत कम आयु का संकेत बनाए रखता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह उनकी गढ़ी हुई गवाही में युवक की कथित उपस्थिति और लड़कियों को भेजने के बीच स्पष्ट कारण-संबंध को बनाए रखता है।
- source_word: ἐξαπέστειλας ... ἀπὸ σοῦ
  choice: तुमने ... अपने पास से भेज दिया
  rationale: यह भेजकर अलग कर देने का भाव सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ κοράσια
  choice: उन लड़कियों
  rationale: शब्द का सीधा अर्थ ‘लड़कियाँ’ है; प्रसंग से स्पष्ट है कि वे सुसन्ना के साथ रहने वाली महिला परिचारिकाएँ थीं। ‘सेविकाएँ’ कहने से प्रसंग स्पष्ट होता, पर मूल का आयु-संबंधी भाव दब जाता।
theological_decisions:
- issue: पुरनियों के कथन का स्वरूप
  choice: इसे सुसन्ना के विरुद्ध न्यायिक गवाही देने की धमकी के रूप में प्रस्तुत किया गया है
  alternative: सामान्य रूप से ‘हम तुम पर दोष लगाएंगे’
  rationale: καταμαρτυρέω न्यायिक और विरोधी गवाही का भाव रखता है। इसे बनाए रखने से कथानक में झूठी गवाही और न्याय के दुरुपयोग की गंभीरता स्पष्ट रहती है।
