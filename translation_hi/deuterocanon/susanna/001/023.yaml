  yaml_path: translation/deuterocanon/susanna/001/023.yaml
  text: But if not[a], we will testify against you that a young man was with you[b], and for this reason you sent the servant girls away from you.
translation:
  language: hi
  text: पर यदि नहीं, तो हम तुम्हारे विरुद्ध गवाही देंगे कि एक युवक तुम्हारे साथ था, और इसी कारण तुमने उन लड़कियों[a] को अपने पास से भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
