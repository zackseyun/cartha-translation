- source_word: ἐν τῷ παραδείσῳ
  choice: बारी में
  rationale: παράδεισος यहाँ घर से जुड़ी घिरी हुई, लगाई-सँवारी वाटिका या फल-बारी को सूचित करता है। ‘बारी’ इस घरेलू कृषि-वाटिका के भाव को संक्षेप में व्यक्त करती है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: τοῦ ἀνδρὸς αὐτῆς
