base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/032.yaml
  text: And the lawless men ordered her to be uncovered[a], so that they might satisfy their desire for her beauty.
translation:
  language: hi
  text: और उन व्यवस्था-विरोधी पुरुषों ने उसे बेपरदा करने का आदेश दिया, ताकि वे उसकी सुंदरता की लालसा तृप्त कर सकें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वे उसकी सुंदरता की लालसा से भर जाएँ।” यूनानी में शाब्दिक रूप से उसकी सुंदरता के लिए लालसा से “भरने” की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξαν
  choice: आदेश दिया
  rationale: यह क्रिया अधिकारपूर्वक आज्ञा देने को व्यक्त करती है; ‘आदेश दिया’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से दृढ़ है।
- source_word: οἱ παράνομοι
  choice: वे व्यवस्था-विरोधी पुरुष
  rationale: παράνομος में व्यवस्था या कानून का उल्लंघन करने और नैतिक रूप से दोषी होने—दोनों का भाव है। संदर्भ में दो पुरुष प्राचीन अगुए हैं, इसलिए ‘पुरुष’ स्पष्टता के लिए जोड़ा गया है।
- source_word: ἀποκαλύψαι αὐτήν
  choice: उसे बेपरदा करने
  rationale: ἀποκαλύπτω का मूल अर्थ आवरण हटाना या प्रकट करना है। यहाँ सभा के सामने उसका परदा हटाने का प्रसंग है; ‘बेपरदा करना’ इससे अधिक अनावृत किए जाने का अर्थ नहीं थोपता।
- source_word: ἵνα ἐμπλησθῶσιν
  choice: ताकि वे ... से तृप्त हो सकें
  rationale: ἐμπίμπλημι का अर्थ भरना या तृप्त करना है। ‘से तृप्त हो सकें’ मूल के भर जाने वाले बिंब को हिन्दी में सहजता से बनाए रखता है।
- source_word: τοῦ κάλλους
  choice: उसकी सुंदरता
  rationale: κάλλος शारीरिक सुंदरता या आकर्षण को दर्शाता है; αὐτῆς के कारण ‘उसकी सुंदरता’ सीधा अनुवाद है।
- source_word: ἐπιθυμίας αὐτῆς
  choice: उसकी सुंदरता की अभिलाषा
  rationale: ἐπιθυμία इच्छा, लालसा या कामना हो सकती है। संदर्भ में यह दूषित यौन लालसा है, किंतु ‘अभिलाषा’ यूनानी शब्द की व्यापकता को बनाए रखती है और प्रसंग उसके अनैतिक स्वरूप को स्पष्ट करता है।
theological_decisions:
- issue: οἱ παράνομοι का नैतिक और कानूनी स्वर
  choice: व्यवस्था-विरोधी पुरुष
  alternative: दुष्ट पुरुष; व्यवस्था का उल्लंघन करने वाले
  rationale: चुना हुआ रूप उनके आचरण की नैतिक निंदा के साथ व्यवस्था के विरुद्ध होने का कानूनी भाव भी सुरक्षित रखता है।
- issue: ἐπιθυμία की तीव्रता
  choice: अभिलाषा
  alternative: वासना; लालसा
  rationale: प्रसंग इसकी कामुक और भ्रष्ट प्रकृति दिखाता है, पर यूनानी संज्ञा अपने आप में ‘इच्छा’ से ‘वासना’ तक अर्थ रख सकती है। इसलिए मुख्य पाठ अस्पष्टता को अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: ἀποκαλύψαι में अनावरण की सीमा
  choice: बेपरदा करने
  alternative: उसका आवरण हटाने; उसे उघाड़ने
  rationale: संदर्भ चेहरे या सिर के आवरण को हटाने की ओर संकेत करता है। चुना हुआ अनुवाद मूल की क्रिया को रखता है, पर पूर्ण नग्नता का अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था-विरोधी’ कानूनी-नैतिक स्वर को, ‘बेपरदा’ प्रसंगगत अनावरण को, और ‘अभिलाषा’ मूल शब्द की अर्थ-व्याप्ति को सुरक्षित रखते हैं।
