base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/011.yaml
  text: And when dawn came[a], they would come, stealing away from one another in haste, to see which of them would appear to her first and speak with her.
translation:
  language: hi
  text: और जब भोर होती थी, वे एक-दूसरे से छिपकर[a] जल्दी-जल्दी आते थे, यह देखने के लिए कि उनमें से कौन पहले उसके सामने आएगा और उससे बात करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘वे एक-दूसरे को चुराते थे’ जैसा कठिन मुहावरा है। संभवतः आशय यह है कि वे एक-दूसरे की नज़र बचाकर, अलग-अलग, सुज़न्ना के पास पहले पहुँचने की कोशिश करते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγίνετο ὄρθρος
  choice: भोर होते ही
  rationale: ὄρθρος आरंभिक सुबह या भोर को सूचित करता है। अपूर्णकालीन ἐγίνετο प्रसंग में बार-बार होने वाली स्थिति दर्शाता है; ‘भोर होते ही’ स्वाभाविक हिंदी में समय और नियमितता दोनों को व्यक्त करता है।
- source_word: ἐρχόμενοι
  choice: आते थे
  rationale: मुख्य अपूर्णकालीन क्रिया के साथ यह कृदंत बार-बार होने वाले व्यवहार को दर्शाता है; हिंदी का ‘आते थे’ इस आदतन भूतकाल को स्पष्ट करता है।
- source_word: ἔκλεπτον ἀλλήλους
  choice: एक-दूसरे से छिपकर
  rationale: κλέπτω का मूल संबंध चोरी या गुप्तता से है, पर यहाँ वस्तु चुराने की बात नहीं है। कठिन मुहावरे का संभावित आशय है कि दोनों एक-दूसरे की नज़र बचाकर अलग-अलग आते थे। अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: σπεύδοντες
  choice: जल्दी-जल्दी
  rationale: σπεύδω में शीघ्रता और उत्सुकता दोनों संभव हैं। यहाँ पहले पहुँचने की प्रतिस्पर्धा के कारण शीघ्रता प्रमुख है।
- source_word: τίς φανήσεται αὐτῇ πρότερος
  choice: उनमें से कौन पहले उसके सामने आएगा
  rationale: φανήσεται यहाँ अकर्मक अर्थ में ‘दिखाई देना/सामने आना’ है। ‘उसके सामने आएगा’ आधुनिक हिंदी में स्वाभाविक है और सुज़न्ना तक पहले पहुँचने का भाव बनाए रखता है।
- source_word: λαλήσει πρὸς αὐτήν
  choice: उससे बात करेगा
  rationale: λαλέω πρός किसी व्यक्ति को संबोधित करके बोलने का संकेत देता है। ‘उससे बात करेगा’ सामान्य, स्पष्ट और संबंधपरक दिशा को बनाए रखने वाला हिंदी प्रयोग है।
