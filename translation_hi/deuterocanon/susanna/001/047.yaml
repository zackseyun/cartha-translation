translation:
  language: hi
  text: तब सभी लोग उसकी ओर मुड़े और बोले, “यह क्या बात है जो तुमने कही है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: मुड़े
  rationale: ἐπιστρέφω यहाँ πρὸς αὐτόν के साथ लोगों के अपना ध्यान और मुख उसकी ओर करने को व्यक्त करता है; ‘मुड़े’ स्वाभाविक है और अनावश्यक रूप से लौटने का भाव नहीं जोड़ता।
- source_word: πᾶς ὁ λαός
  choice: सभी लोग
  rationale: यह सामूहिक रूप से उपस्थित पूरी जनता को दर्शाता है; ‘सभी लोग’ πᾶς की समग्रता को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: πρὸς αὐτόν
  choice: उसकी ओर
  rationale: πρός दिशा सूचित करता है; मुड़ने की क्रिया के साथ ‘उसकी ओर’ स्वाभाविक हिन्दी है।
- source_word: Τίς ὁ λόγος οὗτος
  choice: यह क्या बात है
  rationale: λόγος के अर्थक्षेत्र में शब्द, कथन और बात सम्मिलित हैं। इस संवाद में ‘बात’ स्वाभाविक हिन्दी है और अभी कही गई उक्ति की ओर संकेत करती है।
- source_word: λελάληκας
  choice: तुमने कही है
  rationale: यूनानी पूर्णकाल अभी-अभी कही गई बात की वर्तमान प्रासंगिकता रखता है; हिन्दी का ‘तुमने कही है’ उस पक्ष को स्वाभाविक रूप से व्यक्त करता है।
