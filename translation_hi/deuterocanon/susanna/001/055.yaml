base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/055.yaml
  text: Then Daniel said[a], “You have lied rightly against your own head; for already an angel of God, having received a sentence from God[b], will split you in two.”
translation:
  language: hi
  text: तब दानिय्येल ने कहा[a], “तूने ठीक ही झूठ बोला है—अपने ही सिर के विरुद्ध; क्योंकि परमेश्वर का एक स्वर्गदूत परमेश्वर से दण्डादेश पा चुका है[b] और वह तुझे बीच से चीर देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “तूने अपने ही सिर के विरुद्ध ठीक/सही ढंग से झूठ बोला है।” यह कथन सम्भवतः व्यंग्यात्मक है: उसकी झूठी गवाही का दण्ड उसी पर लौट आया है।'
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर से निर्णय/आदेश पा चुका है।” यूनानी शब्द किसी कथन, घोषणा या न्यायिक निर्णय को सूचित कर सकता है; यहाँ न्यायिक अर्थ प्रसंग के अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀρθῶς
  choice: ठीक ही
  rationale: 'यह ὀρθός से बना क्रियाविशेषण है और यहाँ व्यंग्यात्मक है: झूठा कथन अन्ततः बोलनेवाले के ही विरुद्ध ठीक बैठा है। ‘ठीक ही’ इस तीखे व्यंग्य को सहज आधुनिक हिन्दी में बनाए रखता है।'
- source_word: ἔψευσαι
  choice: तूने ... झूठ बोला है
  rationale: ψεύδομαι के एओरिस्ट रूप का सीधा न्यायिक आरोप; ‘झूठ बोला है’ वर्तमान प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: अपने ही सिर के विरुद्ध
  rationale: मूल की ठोस ‘सिर’ वाली छवि और व्यक्ति पर उसके दोष या परिणाम के लौटने का भाव दोनों सुरक्षित रहते हैं।
- source_word: ἤδη
  choice: पा चुका है
  rationale: अलग से ‘पहले ही’ जोड़ने के बजाय पूर्णतासूचक ‘चुका है’ द्वारा यह भाव व्यक्त किया गया है कि दण्डादेश मिल चुका है और न्याय आरम्भ होने को है।
- source_word: ἄγγελος τοῦ θεοῦ
  choice: परमेश्वर का एक स्वर्गदूत
  rationale: ἄγγελος के साथ निश्चित लेख नहीं है; अतः ‘एक स्वर्गदूत’ यूनानी की अनिश्चितता को सुरक्षित रखता है।
- source_word: λαβὼν φάσιν παρὰ τοῦ θεοῦ
  choice: परमेश्वर से दण्डादेश पा चुका है
  rationale: φάσις कथन, निर्णय या न्यायिक घोषणा हो सकता है। दण्ड के इस प्रसंग में ‘दण्डादेश’ संक्षिप्त और सटीक है, जबकि पादटिप्पणी व्यापक अर्थ-क्षेत्र बताती है।
- source_word: σχίσει σε μέσον
  choice: तुझे बीच से चीर देगा
  rationale: σχίζω की तीव्र ‘चीरने/फाड़ने’ की छवि और μέσον का ‘बीच से’ अर्थ दोनों बने रहते हैं।
theological_decisions:
- issue: स्वर्गदूत की न्यायकारी भूमिका
  choice: परमेश्वर का एक स्वर्गदूत परमेश्वर से मिला दण्डादेश कार्यान्वित करेगा।
  alternative: इसे केवल सामान्य या प्रतीकात्मक ईश्वरीय न्याय की घोषणा समझा जा सकता है।
  rationale: यूनानी पाठ स्पष्ट रूप से परमेश्वर के एक स्वर्गदूत को कर्ता बताता है और कहता है कि उसने परमेश्वर से φάσις पाया है; इसलिए इस ठोस कर्तृत्व को अमूर्त नहीं किया गया।
- issue: Ὀρθῶς का व्यंग्य
  choice: ‘ठीक ही’ द्वारा यह तनाव रखा गया है कि कथन झूठा है, फिर भी उसका परिणाम बोलनेवाले पर ठीक बैठता है।
  alternative: ‘अच्छी तरह’ या केवल ‘झूठ बोला’ कहकर व्यंग्य को कम स्पष्ट किया जा सकता है।
  rationale: मूल में ‘ठीक’ और ‘झूठ’ का जानबूझकर रखा गया विरोधाभास है; अनुवाद उसे सुलझाने के बजाय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सीधी न्यायिक भाषा रखी गई है। ‘तू’ मूल के एकवचन द्वितीय पुरुष और कठोर प्रत्यक्ष संबोधन को व्यक्त करता है। ‘दानिय्येल’ और ‘परमेश्वर’ प्रचलित बाइबलीय नामावली के अनुरूप हैं; वाक्य में डैश व्यंग्यात्मक कथन और उसके प्रत्यावर्ती परिणाम को स्पष्ट करता है।
