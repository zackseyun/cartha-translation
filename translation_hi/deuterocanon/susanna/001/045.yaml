lexical_decisions:
- source_word: ἀπαγομένης αὐτῆς ἀπολέσθαι
  choice: उसे मार डालने के लिए ले जाया जा रहा था
  rationale: यूनानी निष्क्रिय कृदंत और उद्देश्यसूचक infinitive को स्वाभाविक हिन्दी में रखते हुए मृत्यु-दंड के लिए ले जाए जाने का अर्थ स्पष्ट किया गया है।
- source_word: ἐξήγειρεν
  choice: उभारा
  rationale: क्रिया का अर्थ जगाने, प्रेरित करने या सक्रिय करने का है; ‘उभारा’ मूल रूपक को बनाए रखता है और आगे बोलने के लिए प्रेरणा का संकेत देता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: विशेषणयुक्त संज्ञा-समूह का सीधा अनुवाद है। वाक्य-विन्यास के अनुसार यह दानिय्येल की पवित्र आत्मा है; इसे बिना आधार परमेश्वर के व्यक्तिवाचक ‘पवित्र आत्मा’ के रूप में नहीं बदला गया।
- source_word: παιδαρίου νεωτέρου
  choice: एक कम उम्र के लड़के
  rationale: παιδάριον लड़के/बालक को और νεώτερος उसकी अपेक्षाकृत कम उम्र को व्यक्त करता है। ‘कम उम्र का लड़का’ आधुनिक हिन्दी में स्वाभाविक है और ‘younger’ का तुलनात्मक भाव यथासंभव बचाता है।
- source_word: ᾧ ὄνομα Δανιήλ
  choice: दानिय्येल नाम के
  rationale: यूनानी नामसूचक वाक्यांश का संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: τὸ πνεῦμα τὸ ἅγιον का संबंध और आशय
  choice: दानिय्येल नाम के एक कम उम्र के लड़के की पवित्र आत्मा
  alternative: पवित्र आत्मा को उभारा, जो दानिय्येल नाम के एक कम उम्र के लड़के में था
  rationale: मूल यूनानी में ‘आत्मा’ कर्म है और ‘लड़के’ संबंधसूचक रूप में है। चुना गया अनुवाद इस व्याकरणिक संबंध को बनाए रखता है तथा त्रित्व-संबंधी व्यक्तिवाचक अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
