translation:
  language: hi
  text: न्यायालय में लौट चलो, क्योंकि इन लोगों ने उसके विरुद्ध झूठी गवाही दी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστρέψατε
  choice: लौट चलो
  rationale: बहुवचन आज्ञार्थक क्रिया सभा को न्यायिक कार्यवाही के स्थान पर वापस जाने के लिए बुलाती है। ‘लौट चलो’ सामूहिक संबोधन में स्वाभाविक और स्पष्ट है।
- source_word: κριτήριον
  choice: न्यायालय
  rationale: इस प्रसंग में शब्द न्याय किए जाने के स्थान अथवा न्यायिक सभा को दर्शाता है। ‘न्यायालय’ आधुनिक मानक हिन्दी में स्पष्ट कानूनी समतुल्य है।
- source_word: ψευδῆ
  choice: झूठी
  rationale: यह गवाही के असत्य होने को व्यक्त करता है; हिन्दी के प्रचलित कानूनी और बाइबलीय पदबंध ‘झूठी गवाही’ में इसका अर्थ स्वाभाविक रूप से आता है।
- source_word: κατεμαρτύρησαν
  choice: गवाही दी है
  rationale: क्रिया किसी के विरुद्ध साक्ष्य देने का अर्थ रखती है। ψευδῆ और αὐτῆς के साथ पूरा पदबंध ‘उसके विरुद्ध झूठी गवाही दी है’ स्रोत का कानूनी और नैतिक बल बनाए रखता है।
- source_word: αὐτῆς
  choice: उसके विरुद्ध
  rationale: यहाँ संबंधकारक उस व्यक्ति को चिह्नित करता है जिसके विरुद्ध गवाही दी गई; ‘उसके विरुद्ध’ इस प्रतिकूल न्यायिक अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: झूठी गवाही के लिए न्यायिक मुहावरा
  choice: उसके विरुद्ध झूठी गवाही दी है
  alternative: उसके विरुद्ध झूठा बयान दिया है
  rationale: चुना हुआ पदबंध न्यायालयीन प्रसंग और झूठी गवाही के नैतिक भार दोनों को सुरक्षित रखता है, साथ ही आधुनिक हिन्दी में सहज है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘न्यायालय’ कानूनी परिवेश को स्पष्ट करता है और ‘झूठी गवाही’ परिचित न्यायिक-बाइबलीय अभिव्यक्ति है।
