  yaml_path: translation/deuterocanon/susanna/001/038.yaml
  text: And they did not know that we were standing there. Then we rushed together[a], saying, 'Let us find out who these men are.'
translation:
  language: hi
  text: और उन्हें पता नहीं था कि हम वहाँ खड़े थे। तब हम एक-दूसरे के साथ मिलकर झपट पड़े[a] और कहने लगे, “आओ, पता लगाएँ कि ये कौन हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में पारस्परिक भाव वाला वाक्यांश है, जिसका शाब्दिक रूप लगभग “हम एक-दूसरे के साथ मिलकर झपट पड़े” है; झपटने की दिशा या लक्ष्य स्पष्ट नहीं किया गया है।
    reason: source_ambiguity
lexical_decisions:
- source_word: οὐκ ᾔδεισαν
  choice: उन्हें पता नहीं था
  rationale: कथात्मक भूतकाल में οἶδα का सीधा और स्वाभाविक अर्थ; यह उनकी अनभिज्ञता को स्पष्ट करता है।
- source_word: εἰστήκειμεν
  choice: हम वहाँ खड़े थे
  rationale: ἵστημι का पूर्णभूत रूप पहले से बनी हुई खड़े रहने की स्थिति बताता है; हिन्दी में अपूर्ण भूतकाल इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συνεπιτάμεθα ἀλλήλοις
  choice: हम एक-दूसरे के साथ मिलकर झपट पड़े
  rationale: संयुक्त क्रिया की आकस्मिक और सम्मिलित गति तथा ἀλλήλοις की पारस्परिकता दोनों को रखा गया है। ‘एक-दूसरे पर’ कहने से उनके आपस में एक-दूसरे को लक्ष्य बनाने का अर्थ निकल सकता था, जबकि यूनानी रचना में दिशा या लक्ष्य स्पष्ट नहीं है।
- source_word: Μάθωμεν
  choice: आओ, पता लगाएँ
  rationale: यह प्रोत्साहनसूचक aorist subjunctive है; आधुनिक हिन्दी में ‘आओ, पता लगाएँ’ उसका स्वाभाविक भाव देता है।
- source_word: τίνες εἰσὶν οὗτοι
  choice: ये कौन हैं
  rationale: यूनानी में किसी संज्ञा को जोड़े बिना शाब्दिक रूप से ‘ये कौन हैं’ है। हिन्दी में भी यही स्वाभाविक है और संदर्भगत व्यक्तियों की पहचान को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
