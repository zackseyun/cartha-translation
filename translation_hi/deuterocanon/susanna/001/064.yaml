lexical_decisions:
- source_word: ἐγένετο μέγας
  choice: महान हो गया
  rationale: यह पदबंध प्रतिष्ठा या मान में आए परिवर्तन को व्यक्त करता है। ‘महान हो गया’ यूनानी मुहावरे के निकट रहते हुए स्वाभाविक हिन्दी देता है और इसे केवल राजनीतिक शक्ति तक सीमित नहीं करता।
- source_word: ἐνώπιον τοῦ λαοῦ
  choice: लोगों की दृष्टि में
  rationale: ἐνώπιον का मूल अर्थ ‘सामने/उपस्थिति में’ है, पर यहाँ आशय सार्वजनिक मान-सम्मान से है। ‘लोगों की दृष्टि में’ दोनों भावों को सहज रूप से व्यक्त करता है।
- source_word: ἀπὸ τῆς ἡμέρας ἐκείνης καὶ ἐπέκεινα
  choice: उस दिन से आगे
  rationale: यह संयुक्त कालवाचक अभिव्यक्ति उस दिन से आरम्भ होकर आगे भी बनी रहने वाली स्थिति बताती है।
- source_word: Δανιὴλ
  choice: दानिय्येल
  rationale: नाम का रूप प्रचलित हिन्दी बाइबलीय परंपरा के अनुसार रखा गया है।
