base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/005.yaml
  text: 'And in that year two elders from the people were appointed as judges[a], concerning whom the Master had spoken: “Lawlessness came out from Babylon, from elders who were judges[b], who seemed to govern the people.”'
translation:
  language: hi
  text: और उस वर्ष लोगों में से दो बुज़ुर्ग न्यायाधीश नियुक्त किए गए, जिनके विषय में स्वामी ने कहा था, “अधर्म बाबेल से निकला है—उन बुज़ुर्ग न्यायाधीशों से जो लोगों पर शासन करते प्रतीत होते थे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम यूनानी वाक्यांश का अर्थ “जो लोगों पर शासन करते प्रतीत होते थे” या “जिन्हें लोगों पर शासन करनेवाला समझा जाता था” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεδείχθησαν
  choice: नियुक्त किए गए
  rationale: न्यायिक पद के संदर्भ में क्रिया किसी भूमिका के लिए नामित या नियुक्त किए जाने का भाव देती है।
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: यहाँ शब्द केवल अधिक आयु के पुरुषों के बजाय समुदाय के मान्य अगुओं या पदाधिकारियों को सूचित करता है।
- source_word: κριταὶ
  choice: न्यायी
  rationale: यह शब्द उनके स्पष्ट न्यायिक पद को व्यक्त करता है और ‘न्यायाधीश’ की तुलना में बाइबलीय कथन-शैली में अधिक सहज है।
- source_word: δεσπότης
  choice: स्वामी
  rationale: यह κύριος से भिन्न यूनानी उपाधि को बनाए रखते हुए परमेश्वर के लिए उपयुक्त और स्वाभाविक हिन्दी संबोधन है।
- source_word: ἀνομία
  choice: अधर्म
  rationale: यह व्यवस्था और न्याय के उल्लंघन सहित नैतिक दुष्टता का भाव संक्षेप और स्वाभाविक रीति से व्यक्त करता है।
- source_word: ἐξῆλθεν
  choice: निकला है
  rationale: यह बाबेल से अधर्म के निकलने की मूल छवि को बनाए रखता है।
- source_word: ἐκ Βαβυλῶνος
  choice: बाबेल से
  rationale: स्थान-नाम और स्रोत-बोध का मानक हिन्दी रूप।
- source_word: οἱ ἐδόκουν κυβερνᾷν τὸν λαόν
  choice: जिन्हें लोगों का अगुआ समझा जाता था
  rationale: ἐδόκουν की संभावित कर्मवाच्य समझ को स्वाभाविक हिन्दी में व्यक्त करता है और उनके सार्वजनिक रूप से अगुआ माने जाने तथा वास्तविक भ्रष्टता के बीच तनाव बनाए रखता है।
theological_decisions:
- issue: दैवीय संदर्भ में δεσπότης का अनुवाद
  choice: स्वामी
  alternative: प्रभु; अधिपति
  rationale: ‘स्वामी’ यूनानी δεσπότης और अधिक सामान्य κύριος के बीच शब्दगत भेद को कुछ सीमा तक बनाए रखता है, बिना किसी विशिष्ट सांप्रदायिक अर्थ को आरोपित किए।
- issue: ἐδόκουν का वाच्य और आशय
  choice: जिन्हें ... अगुआ समझा जाता था
  alternative: जो लोगों की अगुवाई करते जान पड़ते थे
  rationale: यूनानी रूप ‘वे समझे जाते थे’ अथवा ‘वे जान पड़ते थे’ दोनों अर्थ दे सकता है; मुख्य पाठ सार्वजनिक प्रतिष्ठा का अर्थ लेता है, जबकि पादटिप्पणी वास्तविक अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘प्राचीन’ सामुदायिक पद को और ‘न्यायी’ न्यायिक कार्य को स्पष्ट करता है। उद्धरण की संकुचित यूनानी रचना को पठनीय बनाया गया है, पर उसकी अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
