  text: और वे दोनों उसकी तीव्र कामना से व्याकुल थे,[a] और उनमें से किसी ने भी दूसरे को उस बुरी कामना के बारे में नहीं बताया, जो उसके प्रति उन्हें जकड़े हुए थी;[b] उस स्त्री को भी इस बात का पता नहीं था।
  philosophy: optimal-equivalence
  footnotes:
