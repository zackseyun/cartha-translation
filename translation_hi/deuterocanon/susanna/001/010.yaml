  choice: ‘कामना से व्याकुल’
  alternative: ‘उसके कारण बेधे गए थे’ या ‘उस पर मोहित थे’
  rationale: ‘बेधे गए’ मूल बिंब को अधिक शाब्दिक रूप से रखता है, किंतु आधुनिक हिन्दी में अस्पष्ट है; ‘मोहित’ नैतिक और तीव्र भाव को हल्का कर सकता है। चुना हुआ रूप दोनों को संतुलित करता है।
