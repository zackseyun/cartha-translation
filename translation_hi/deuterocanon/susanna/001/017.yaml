  yaml_path: translation/deuterocanon/susanna/001/017.yaml
  text: And it happened[a], while they were watching for an opportune day, that she once entered, as yesterday and the third day before, with only two young maids, and desired to bathe in the garden, because it was hot.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वे किसी अनुकूल दिन की ताक में थे, तब वह एक दिन, जैसे पिछले दिनों में, केवल दो दासियों के साथ बगीचे में गई और स्नान करना चाहा, क्योंकि गरमी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: और ऐसा हुआ
  rationale: यह यूनानी कथा-वर्णन का सामान्य संक्रमण-सूत्र है; हिन्दी में स्वाभाविक रहते हुए इसका कथात्मक कार्य बनाए रखता है।
- source_word: παρατηρεῖν
  choice: ताक में थे
  rationale: क्रिया ध्यानपूर्वक निगरानी करने का भाव रखती है और प्रसंग में अवसर की प्रतीक्षा का प्रतिकूल आशय है; यह अनुवाद उस निहित भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡμέραν εὔθετον
  choice: किसी अनुकूल दिन
  rationale: वाक्यांश उनके उद्देश्य के लिए उपयुक्त अवसर वाले दिन को दर्शाता है; 'अनुकूल दिन' गणना करके चुने जाने वाले समय का भाव रखता है।
- source_word: εἰσῆλθέν ποτε
  choice: एक दिन ... आई
  rationale: ποτε किसी एक विशेष अवसर को सूचित करता है; हिन्दी में 'एक दिन' कथा के भीतर इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: καθὼς ἐχθὲς καὶ τρίτης ἡμέρας
  choice: जैसे पिछले दिनों में
  rationale: यूनानी अभिव्यक्ति शाब्दिक रूप से कल और उससे पहले के दिन से तुलना करती है; इसका आशय उसकी हाल की नियमित यात्राओं जैसा है, जिसे सहज हिन्दी में रखा गया है।
- source_word: μετὰ δύο μόνων κορασίων
  choice: केवल दो दासियों के साथ
  rationale: κοράσια युवतियों या कम उम्र की स्त्री-सेविकाओं के लिए आ सकता है; सम्पन्न गृह के इस प्रसंग में 'दासियाँ' उनकी परिचारिका-भूमिका स्पष्ट करता है।
- source_word: ἐπεθύμησε λούσασθαι
  choice: स्नान करना चाहा
  rationale: यहाँ इच्छा किसी तीव्र लालसा के बजाय तत्काल अभिप्राय बताती है; 'करना चाहा' आधुनिक हिन्दी में संयत और स्वाभाविक है।
- source_word: ἐν τῷ παραδείσῳ
  choice: बगीचे में
  rationale: इस प्रसंग में παράδεισος घर से जुड़ा घिरा हुआ बगीचा है, धार्मिक अर्थ वाला 'स्वर्ग' नहीं।
- source_word: ὅτι καῦμα ἦν
  choice: क्योंकि गरमी थी
  rationale: कारणसूचक उपवाक्य को सरल और सीधे ढंग से व्यक्त करता है।
