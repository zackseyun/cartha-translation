translation:
  language: hi
  text: वह अत्यन्त[a] और प्रभु का भय माननेवाली थी; और उसके माता-पिता धर्मी थे, और उन्होंने अपनी बेटी को मूसा की व्यवस्था के अनुसार शिक्षा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘अत्यन्त’ पिछले उपवाक्य में आरम्भ हुए सुसन्ना के वर्णन को तीव्र करता है।
    reason: पद के आरम्भ में σφόδρα के पूर्ववर्ती संदर्भ पर निर्भर व्याकरणिक कार्य को स्पष्ट करना।
lexical_decisions:
- source_word: σφόδρα
  choice: अत्यन्त
  rationale: यह क्रियाविशेषण पिछले उपवाक्य में सुसन्ना के वर्णन को तीव्र करता है। ‘अत्यन्त’ उसके अपूर्ण, पूर्ववर्ती संदर्भ पर निर्भर स्वरूप को बिना कोई गुण अपनी ओर से जोड़कर बनाए रखता है।
- source_word: φοβουμένη
  choice: प्रभु का भय माननेवाली
  rationale: φοβέομαι का कृदन्त यहाँ परमेश्वर के प्रति श्रद्धायुक्त भय को व्यक्त करता है। यह प्रचलित बाइबलीय हिन्दी है और मूल के ‘भय’ संबंधी अर्थ को बनाए रखती है।
- source_word: κύριον
  choice: प्रभु
  rationale: इस यूनानी संदर्भ में κύριος इस्राएल के परमेश्वर को सूचित करता है; ‘प्रभु’ स्रोत के निकट और स्वाभाविक धार्मिक संबोधन है।
- source_word: γονεῖς
  choice: माता-पिता
  rationale: बहुवचन संज्ञा दोनों अभिभावकों को सामूहिक रूप से सूचित करती है; आधुनिक हिन्दी में ‘माता-पिता’ स्पष्ट और स्वाभाविक है।
- source_word: δίκαιοι
  choice: धर्मी
  rationale: यह शब्द नैतिक और धार्मिक चरित्र का वर्णन करता है। ‘धर्मी’ उसके बाइबलीय अर्थभार को ‘न्यायी’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: ἐδίδαξαν
  choice: शिक्षा दी थी
  rationale: यह माता-पिता द्वारा अपनी बेटी को दी गई शिक्षा को व्यक्त करता है। हिन्दी में ‘शिक्षा दी’ इस प्रसंग में सहज है और पूर्वकालिक कथन से मेल खाता है।
- source_word: θυγατέρα
  choice: बेटी
  rationale: यह पारिवारिक संबंध को सीधे व्यक्त करता है; ‘बेटी’ आधुनिक सामान्य हिन्दी में ‘पुत्री’ से अधिक सहज है।
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: मूसा की व्यवस्था के अनुसार
  rationale: κατά के साथ कर्मकारक यहाँ किसी मानक के अनुरूप होने का भाव देता है। यह अनुवाद उसी अनुरूपता को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριος है, इब्रानी दिव्य नाम नहीं। इसलिए स्रोत-भाषा को प्राथमिकता देते हुए ‘प्रभु’ चुना गया है।
- issue: माता-पिता के चरित्र के लिए δίκαιοι का अनुवाद
  choice: धर्मी
  alternative: न्यायी
  rationale: यहाँ शब्द केवल न्यायपूर्ण व्यवहार नहीं, बल्कि व्यापक नैतिक-धार्मिक खराई बताता है; ‘धर्मी’ उस अर्थ को अधिक पूर्णता से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। पद का आरम्भ यूनानी में पिछले उपवाक्य पर निर्भर है; मुख्य पाठ को हिन्दी में वाक्य के रूप में पठनीय बनाया गया है, जबकि [a] उस वास्तविक पाठगत अपूर्णता को दर्ज करता है।
