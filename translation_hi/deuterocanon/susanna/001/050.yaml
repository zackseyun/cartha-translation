base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/050.yaml
  text: And all the people returned with haste. And the elders said to him[a], “Come, sit in our midst and tell us, for God has given you eldership.”
translation:
  language: hi
  text: तब सब लोग जल्दी से लौट आए। बुज़ुर्गों ने उससे कहा[a], “आओ, हमारे बीच बैठो और हमें बताओ, क्योंकि परमेश्वर ने तुम्हें वरिष्ठता का दर्जा दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने तुम्हें प्राचीनों का पद,” “श्रेष्ठ स्थान,” या “बड़ों का अधिकार दिया है।” यूनानी τὸ πρεσβεῖον वरिष्ठता, सम्मानित पद, या मान्य अधिकार का बोध कराता है; यहाँ इसका अर्थ शाब्दिक आयु नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: लौट आए
  rationale: संदर्भ में लोग अपना मार्ग बदलकर सभा की ओर वापस आते हैं; बहुवचन कर्ता के साथ हिंदी में स्वाभाविक रूप रखा गया है।
- source_word: μετὰ σπουδῆς
  choice: तुरन्त
  rationale: यहाँ पदबंध शीघ्रता से की गई वापसी बताता है; ‘तुरन्त’ सहज आधुनिक हिंदी में उसी कथात्मक तत्परता को व्यक्त करता है।
- source_word: οἱ πρεσβύτεροι
  choice: अगुओं
  rationale: न्यायिक-सामुदायिक प्रसंग में यह केवल अधिक आयु वाले पुरुषों के बजाय मान्य नेतृत्व करने वालों को सूचित करता है।
- source_word: Δεῦρο
  choice: आओ
  rationale: यह निकट आने का सीधा आमंत्रणात्मक आदेश है।
- source_word: ἐν μέσῳ ἡμῶν
  choice: हमारे बीच
  rationale: यह सभा के मध्य स्थान और समुदाय के बीच मान्य स्थान—दोनों भावों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἀνάγγειλον ἡμῖν
  choice: हमें बताओ
  rationale: क्रिया किसी बात को घोषित या निवेदित करने का अर्थ देती है; प्रत्यक्ष कथन में यह सहज और पर्याप्त रूप से स्पष्ट है।
- source_word: τὸ πρεσβεῖον
  choice: अगुवाई का सम्मानित पद
  rationale: शब्द वरिष्ठता, प्रतिष्ठित दर्जे या प्राचीन/अगुए के अधिकार को सूचित कर सकता है। दानिय्येल के युवा होने के कारण यह चयन शाब्दिक वृद्धावस्था से बचते हुए प्रदत्त मान्य अधिकार को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर द्वारा दानिय्येल को τὸ πρεσβεῖον देना
  choice: परमेश्वर ने उसे अगुवाई का सम्मानित पद दिया है
  alternative: परमेश्वर ने तुम्हें प्राचीन का पद / वरिष्ठता / श्रेष्ठ स्थान दिया है
  rationale: पाठ में युवा दानिय्येल को परमेश्वर से प्राप्त ज्ञान और सभा में मान्य न्यायिक अधिकार मिलता है। अनुवाद आयु का दावा किए बिना पद, सम्मान और अधिकार की संयुक्त धारणा को रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘अगुवाई का सम्मानित पद’ मूल शब्द की सामाजिक और न्यायिक प्रतिष्ठा को स्पष्ट करता है, यद्यपि उसकी वास्तविक बहुअर्थकता शब्द-संयोजन में आंशिक रूप से व्याख्यायित होती है।
