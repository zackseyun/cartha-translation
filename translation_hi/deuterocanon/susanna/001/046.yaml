  text: And he cried out with a loud voice[a], “I am innocent of this woman’s blood.”
translation:
  language: hi
  text: और वह ऊँचे स्वर से पुकार उठा, “मैं इस स्त्री के खून का दोषी नहीं हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस स्त्री के रक्त से मैं निर्दोष हूँ।” यह रक्तपात या उसकी मृत्यु के उत्तरदायित्व से मुक्त होने की भाषा है।
    reason: मूल यूनानी के रक्त-दोष संबंधी मुहावरे को स्पष्ट करना।
lexical_decisions:
- source_word: ἐβόησεν
  choice: पुकार उठा
  rationale: यह क्रिया ऊँची और आकस्मिक पुकार व्यक्त करती है; ‘पुकार उठा’ आधुनिक हिन्दी में इसका बल स्वाभाविक रूप से बनाए रखता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यूनानी पदबंध का सीधा और सहज हिन्दी रूप, जो पुकार की तीव्रता स्पष्ट करता है।
- source_word: Ἀθῷος
  choice: दोषी नहीं
  rationale: यहाँ विशेषण अपराध या उत्तरदायित्व से मुक्त होने का कानूनी-नैतिक अर्थ रखता है; नकारात्मक हिन्दी वाक्यांश इस संदर्भ में स्वाभाविक है।
- source_word: ἀπὸ τοῦ αἵματος ταύτης
  choice: इस स्त्री के खून का
  rationale: स्त्रीलिंग संकेतवाचक को स्पष्ट रखते हुए ‘खून’ से रक्तपात के दोष की बाइबलीय भाषा बनी रहती है।
theological_decisions:
- issue: रक्त-दोष की अभिव्यक्ति
  choice: मैं इस स्त्री के खून का दोषी नहीं हूँ
  alternative: इस स्त्री के रक्त के विषय में मैं निर्दोष हूँ
  rationale: चुना हुआ रूप उसकी मृत्यु या रक्तपात के लिए उत्तरदायित्व से इनकार व्यक्त करता है, पर मूल पाठ से आगे बढ़कर हत्या की विशेष परिस्थिति निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गंभीर और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘खून’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी में अधिक शाब्दिक ‘रक्त’ दिया गया है।
