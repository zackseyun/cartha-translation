  language: hi
  text: और प्रभु ने उसकी आवाज़ सुनी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: सुनी
  rationale: εἰσακούω में ध्यानपूर्वक या अनुकूल भाव से सुनने का संकेत हो सकता है, विशेषकर विनती के संदर्भ में; फिर भी यहाँ केवल सुनने की बात स्पष्ट रूप से कही गई है। इसलिए ‘सुनी’ स्वाभाविक है और ‘उत्तर दिया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ती।
- source_word: Κύριος
  choice: प्रभु
  rationale: यूनानी Κύριος यहाँ परमेश्वर के लिए प्रयुक्त उपाधि है। ‘प्रभु’ आधुनिक हिन्दी में प्रतिष्ठित और स्वाभाविक अनुवाद है तथा स्रोत में प्रत्यक्ष रूप से उपस्थित न होने वाली इब्रानी दिव्य-नाम परंपरा को आरोपित नहीं करता।
- source_word: φωνῆς αὐτῆς
  choice: उसकी आवाज़
  rationale: φωνή का मूल अर्थ ‘आवाज़’ या ‘ध्वनि’ है। ‘उसकी आवाज़’ यूनानी अभिव्यक्ति को सीधे बनाए रखता है; ‘पुकार’ या ‘प्रार्थना’ कहना प्रसंग को अधिक स्पष्ट करता, पर मूल शब्द से आगे जाता।
theological_decisions:
- issue: क्या परमेश्वर द्वारा अनुकूल उत्तर दिए जाने को स्पष्ट किया जाए
  choice: ‘प्रभु ने उसकी आवाज़ सुनी’
  alternative: ‘प्रभु ने उसकी पुकार का उत्तर दिया’
  rationale: क्रिया में अनुकूल होकर सुनने का भाव निहित हो सकता है, लेकिन पद स्वयं उत्तर के स्वरूप को नहीं बताता। सरल अनुवाद कथन की धार्मिक और कथात्मक संयमता बनाए रखता है।
- issue: यूनानी Κύριος का दिव्य उपाधि के रूप में अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: उपलब्ध स्रोत यूनानी है और उसमें Κύριος है। ‘यहोवा’ चुनने से ऐसा विशिष्ट इब्रानी आधार मान लिया जाता जो इस साक्ष्य में प्रत्यक्ष नहीं है।
translation_notes:
  register: भाषा सरल, आधुनिक और गरिमापूर्ण रखी गई है। संक्षिप्त यूनानी वाक्य की सीधी कथात्मक संरचना सुरक्षित है; किसी पाद-टिप्पणी की आवश्यकता नहीं है।
