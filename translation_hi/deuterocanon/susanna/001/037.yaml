translation:
  language: hi
  text: और जब हम बगीचे का चक्कर लगा रहे थे, तब हमने इस स्त्री को एक पुरुष के साथ लेटी हुई देखा; और वहीं खड़े होकर हम उन दोनों को एक-दूसरे से बातचीत करते देखते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυκλοῦντες τὸ στάδιον
  choice: बगीचे का चक्कर लगा रहे थे
  rationale: κυκλοῦντες का अर्थ चारों ओर घूमना या चक्कर लगाना है। प्रसंग में στάδιον उस घिरे हुए उद्यान-क्षेत्र को सूचित करता है; स्वाभाविक हिन्दी में इसे ‘बगीचा’ कहा गया है।
- source_word: ἀναπαυομένην μετὰ ἀνδρός
  choice: एक पुरुष के साथ लेटे हुए
  rationale: ἀναπαύομαι विश्राम करने या लेटने का भाव रखता है। ‘लेटे हुए’ दृश्य के आरोपात्मक संकेत को बनाए रखता है, पर अपने आप यौन संबंध को स्पष्ट घोषित नहीं करता।
- source_word: ἐθεωροῦμεν
  choice: देखते रहे
  rationale: अपूर्णकालीन क्रिया लगातार या कुछ समय तक ध्यानपूर्वक देखने का भाव देती है।
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: एक-दूसरे से बातचीत करते
  rationale: ὁμιλέω यहाँ परस्पर बातचीत करने का सीधा अर्थ देता है; इससे अधिक अंतरंग अर्थ आरोपित नहीं किया गया।
theological_decisions:
- issue: बुज़ुर्गों की गवाही में निहित आरोप की तीव्रता
  choice: ‘एक पुरुष के साथ लेटे हुए’
  alternative: ‘एक पुरुष के साथ विश्राम करते हुए’
  rationale: पाठ आरोप लगाने वालों की गवाही प्रस्तुत करता है। अनुवाद ने दृश्य की संदिग्धता और आरोपात्मक तनाव रखा है, लेकिन ऐसी स्पष्ट यौन शब्दावली नहीं जो यूनानी क्रिया स्वयं अनिवार्य न करती हो।
