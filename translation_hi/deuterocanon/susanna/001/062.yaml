translation:
  language: hi
  text: अपने पड़ोसी के विरुद्ध, मूसा की व्यवस्था के अनुसार, करने के लिए[a]; और उन्होंने उन दोनों को मार डाला। इस प्रकार उस दिन निर्दोष का रक्त बहने से बच गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यह खंड पिछले पद से व्याकरण की दृष्टि से जुड़ा हुआ है। वाक्य के प्रवाह के अनुसार इसका अधिक सहज अनुवाद हो सकता है: “अपने पड़ोसी के विरुद्ध मूसा की व्यवस्था के अनुसार करने के लिए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ πλησίον
  choice: अपने पड़ोसी के साथ
  rationale: सम्प्रदान कारक का संबंध पिछले पद में निहित क्रिया से है और आशय उस व्यवहार से है जो उन्होंने अपने साथी मनुष्य के प्रति करना चाहा। ‘अपने पड़ोसी के साथ’ हिन्दी में संबंध को स्वाभाविक रूप से व्यक्त करता है, जबकि पद का आरम्भ पिछले वाक्य पर निर्भर रहने दिया गया है।
- source_word: ποιῆσαι
  choice: व्यवहार करने के लिए
  rationale: मूल अर्थ ‘करना’ है, पर पड़ोसी के साथ किए जाने वाले कार्य के संदर्भ में ‘व्यवहार करना’ आधुनिक हिन्दी में अधिक स्पष्ट और स्वाभाविक है।
- source_word: κατὰ τὸν νόμον Μωϋσῆ
  choice: मूसा की व्यवस्था के अनुसार
  rationale: यह मानक विधिक अभिव्यक्ति यूनानी के अर्थ और बाइबलीय प्रयोग दोनों को स्पष्ट रूप से बनाए रखती है।
- source_word: ἀπέκτειναν αὐτοὺς
  choice: उन्होंने उन दोनों को मार डाला
  rationale: αὐτούς निकटवर्ती प्रसंग के दोनों पुरनियों को दर्शाता है। ‘मार डाला’ न्यायिक मृत्यु को व्यक्त करता है, पर आधुनिक तकनीकी शब्दावली को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐσώθη αἷμα ἀναίτιον
  choice: निर्दोष का रक्त बहने से बच गया
  rationale: रक्त के ‘बचाए जाने’ का आशय अन्यायपूर्ण रक्तपात का टलना है। हिन्दी में ‘रक्त बहने से बच गया’ इस मुहावरे को स्पष्ट करता है और निर्दोष की हत्या टलने का गंभीर भाव बनाए रखता है।
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: यह समयसूचक पद का सहज आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: न्यायिक प्रसंग में ἀπέκτειναν का अर्थ
  choice: उन्होंने उन दोनों को मार डाला
  alternative: उन्होंने उन दोनों को मृत्युदंड दिया
  rationale: प्रसंग विधिक निर्णय का है, पर यूनानी क्रिया स्वयं आधुनिक तकनीकी न्यायिक पद नहीं है। चुना हुआ अनुवाद मृत्यु दिए जाने को स्पष्ट रखते हुए अर्थ को अति-विशिष्ट नहीं बनाता।
- issue: ἐσώθη αἷμα ἀναίτιον का मुहावरेदार अर्थ
  choice: निर्दोष का रक्त बहने से बच गया
  alternative: निर्दोष रक्त बचाया गया
  rationale: यहाँ रक्त को वस्तुतः बचाने की नहीं, एक निर्दोष व्यक्ति का अन्यायपूर्ण रक्तपात रोकने की बात है। चुना हुआ रूप हिन्दी में स्वाभाविक है और मूल बाइबलीय प्रतिमा को भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। पद के आरम्भ की मूल यूनानी परवर्ती वाक्य-निर्भरता को मिटाया नहीं गया; उसे पादटिप्पणी में स्पष्ट किया गया है। ‘व्यवस्था’ मूसा की νόμος के लिए परिचित बाइबलीय शब्द है, और ‘रक्त बहने से बच गया’ मूल मुहावरे का स्वाभाविक हिन्दी रूप है।
