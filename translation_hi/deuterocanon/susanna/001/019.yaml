  verdict: revise
  source_fidelity: ‘दासियों’ can imply enslaved women, whereas κορασίοις denotes girls/young female attendants and does not itself establish slave status. ‘सेविकाओं’ accurately conveys the household-attendant role in context without adding that implication. The purpose clause is retained directly.
  naturalness: The sentence is otherwise clear and idiomatic modern standard Hindi. ‘तेल और लेप’ is a natural, suitably broad rendering of the bathing/anointing substances, avoiding the cultural specificity of ‘उबटन’.
  terminology: ‘सेविकाओं’ fits the narrative register and the English audit trail’s “servant girls.” ‘बगीचे के दरवाज़े’ properly preserves the noncommittal sense of θύρας, and ‘स्नान करूँ’ naturally renders the middle λούσωμαι.
  issues:
  - severity: medium
    issue: ‘दासियों’ overstates the status of κορασίοις.
    rationale: The Greek can refer to girls or young female attendants; it does not explicitly say that they are slaves. ‘सेविकाओं’ preserves the contextual attendant sense without this added social-status claim.
  - severity: low
    issue: ‘उबटन’ is narrower and more culturally specific than σμήγματα.
    rationale: σμήγματα broadly denotes substances used for rubbing/anointing or cleansing the body. ‘लेप’ retains this breadth and suits the bathing context.
