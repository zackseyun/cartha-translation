lexical_decisions:
- source_word: κορασίοις
  choice: दासियों
  rationale: शब्द का मूल अर्थ लड़कियाँ या युवतियाँ हो सकता है, पर इस घरेलू प्रसंग में वे सुसन्ना की परिचारिकाएँ हैं; ‘दासियों’ से उनकी सेविका की भूमिका स्वाभाविक रूप से व्यक्त होती है।
- source_word: Ἐνέγκατε δή μοι
  choice: मेरे लिए ... ले आओ
  rationale: यह आदेशात्मक अभिव्यक्ति का सहज आधुनिक हिन्दी रूप है; δή के आग्रह को हिन्दी वाक्य के सीधे आदेशात्मक लहजे में रखा गया है।
- source_word: ἔλαιον
  choice: तेल
  rationale: यूनानी पाठ केवल सामान्य ‘तेल’ कहता है; ‘जैतून का तेल’ कहना अनावश्यक विशिष्टीकरण होता।
- source_word: σμήγματα
  choice: उबटन
  rationale: बहुवचन शब्द स्नान के समय शरीर पर मलने या साफ़ करने में प्रयुक्त पदार्थों को सूचित करता है। ‘उबटन’ हिन्दी में इस प्रसंग का स्वाभाविक और सुबोध समतुल्य है।
- source_word: θύρας τοῦ παραδείσου
  choice: बगीचे के दरवाज़े
  rationale: παράδεισος यहाँ घिरे हुए निजी बगीचे को दर्शाता है और θύρας का निकट अर्थ ‘दरवाज़े’ है; ‘फाटक’ भी संभव है, पर पाठ स्वयं उसे निर्दिष्ट नहीं करता।
- source_word: κλείσατε
  choice: बंद कर दो
  rationale: क्रिया का अर्थ बंद करना है; ‘ताला लगा दो’ कहना मूल से अधिक अर्थ जोड़ता।
- source_word: ὅπως λούσωμαι
  choice: ताकि मैं स्नान करूँ
  rationale: मध्यवाच्य λούσωμαι स्वयं स्नान करने को व्यक्त करता है; ‘स्नान करूँ’ आधुनिक हिन्दी में स्वाभाविक है।
