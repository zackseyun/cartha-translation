base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/063.yaml
  text: And Hilkiah and his wife praised their daughter[a], along with Joakim her husband and all their relatives, because no shameful deed was found in her.
translation:
  language: hi
  text: और हिलकिय्याह और उसकी पत्नी ने अपनी बेटी के विषय में, उसके पति योआकीम और सब संबंधियों के साथ मिलकर स्तुति की[a], क्योंकि उसमें कोई लज्जाजनक काम नहीं पाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में स्तुति का कर्म नहीं दिया गया है; प्रसंग में इसका अर्थ परमेश्वर की स्तुति करना हो सकता है।
    reason: मूल पाठ की वास्तविक अस्पष्टता और संभावित प्रसंगगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: Χελκίας
  choice: हिलकिय्याह
  rationale: यूनानी नाम Χελκίας के पीछे के प्रचलित इब्रानी बाइबलीय नाम को आधुनिक हिन्दी की परिचित वर्तनी में रखा गया है।
- source_word: ᾔνεσαν
  choice: स्तुति की
  rationale: क्रिया का अर्थ ‘प्रशंसा/स्तुति करना’ है। यूनानी में कर्म स्पष्ट नहीं है, इसलिए मुख्य पाठ में किसी कर्म—विशेषतः ‘परमेश्वर’ या ‘बेटी’—को जोड़कर अस्पष्टता दूर नहीं की गई।
- source_word: περὶ τῆς θυγατρὸς αὐτῶν
  choice: अपनी बेटी के विषय में
  rationale: περί के संबंधसूचक अर्थ ‘के विषय में/के संबंध में’ को सुरक्षित रखा गया है; इसे सीधे बेटी की प्रशंसा अथवा उसके लिए धन्यवाद मानकर नहीं खोला गया।
- source_word: μετὰ Ἰωακεὶμ τοῦ ἀνδρὸς αὐτῆς
  choice: उसके पति योआकीम ... के साथ मिलकर
  rationale: μετά सहभागिता दर्शाता है; हिन्दी में ‘के साथ मिलकर’ स्वाभाविक रूप से संयुक्त स्तुति का भाव देता है।
- source_word: τῶν συγγενῶν πάντων
  choice: सब संबंधियों
  rationale: συγγενεῖς के पारिवारिक अर्थ को सरल, आधुनिक हिन्दी ‘संबंधी’ से व्यक्त किया गया है।
- source_word: οὐχ εὑρέθη ἐν αὐτῇ
  choice: उसमें ... नहीं पाया गया
  rationale: यूनानी की निष्क्रिय और न्यायिक ध्वनि को निकटता से बनाए रखा गया है।
- source_word: αἰσχρὸν πρᾶγμα
  choice: कोई लज्जाजनक काम
  rationale: αἰσχρός की लज्जा/कलंक संबंधी छाया और πρᾶγμα के किए गए कार्य अथवा मामले—दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ᾔνεσαν में स्तुति का अनुक्त कर्म
  choice: 'मुख्य पाठ में कर्म को अनुक्त रखा: ‘स्तुति की’'
  alternative: ‘परमेश्वर की स्तुति की’ अथवा ‘अपनी बेटी की प्रशंसा की’
  rationale: मूल यूनानी यह नहीं बताता कि स्तुति किसकी की गई। प्रसंग में परमेश्वर निहित हो सकते हैं, पर उन्हें मुख्य पाठ में जोड़ना वास्तविक व्याकरणिक अस्पष्टता को समाप्त कर देगा; बेटी को प्रत्यक्ष कर्म बनाना भी περί की संरचना से अधिक निर्णायक होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में मूल यूनानी की सामूहिक स्तुति और न्यायिक निर्दोषता दोनों सुरक्षित हैं; अनुक्त धार्मिक कर्म को मुख्य पाठ में नहीं जोड़ा गया।
