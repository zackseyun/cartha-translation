translation:
  language: hi
  text: तब पूरी सभा ऊँचे स्वर से पुकार उठी, और उन्होंने परमेश्वर को धन्य कहा, जो उन लोगों को बचाता है जो उस पर आशा रखते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो उस पर भरोसा रखते हैं।’ यूनानी क्रिया का अधिक शाब्दिक अर्थ ‘आशा रखना’ है, पर बाइबलीय प्रयोग में इसमें परमेश्वर पर भरोसा रखने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: पुकार उठी
  rationale: यह क्रिया ऊँचे स्वर में अचानक पुकारने का भाव देती है। ‘पुकार उठी’ स्वाभाविक हिन्दी में इसकी तीव्रता और प्रसंग दोनों को बनाए रखती है।
- source_word: πᾶσα ἡ συναγωγή
  choice: सारी सभा
  rationale: यहाँ συναγωγή एकत्र हुए पूरे समुदाय को सूचित करता है, किसी बाद की संस्थागत ‘आराधनालय’ की धारणा को नहीं।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यूनानी मुहावरे का अर्थ जोर से बोलना या पुकारना है; यह हिन्दी अभिव्यक्ति उसके ठोस वाचिक भाव को स्वाभाविक रूप में रखती है।
- source_word: εὐλόγησαν
  choice: धन्य कहा
  rationale: εὐλογέω का मूल भाव ‘आशीष देना/धन्य कहना’ है। परमेश्वर के संबंध में ‘धन्य कहा’ हिन्दी बाइबलीय भाषा में स्पष्ट है और केवल ‘स्तुति की’ कहने की अपेक्षा स्रोत के अधिक निकट है।
- source_word: τῷ θεῷ
  choice: परमेश्वर को
  rationale: εὐλόγησαν के साथ दत्तिव यहाँ उस व्यक्ति को दर्शाता है जिसे सभा धन्य कहती है।
- source_word: τῷ σώζοντι
  choice: जो ... बचाता है
  rationale: वर्तमान कृदन्त परमेश्वर की सतत और विशिष्ट उद्धारकारी क्रिया को व्यक्त करता है; हिन्दी संबंधवाचक उपवाक्य इसे स्पष्ट और सहज बनाता है।
- source_word: τοὺς ἐλπίζοντας ἐπ’ αὐτόν
  choice: जो उस पर आशा रखते हैं
  rationale: ἐλπίζω मूलतः आशा रखने को व्यक्त करता है, जिसमें बाइबलीय प्रयोग में भरोसे का भाव भी समाहित हो सकता है। मुख्य पाठ मूल आशा-शब्दावली को बनाए रखता है।
theological_decisions:
- issue: εὐλόγησαν τῷ θεῷ का अनुवाद
  choice: परमेश्वर को धन्य कहा
  alternative: परमेश्वर की स्तुति की
  rationale: यद्यपि प्रसंग में स्तुति का अर्थ निहित है, यूनानी क्रिया εὐλογέω सीधे ‘धन्य कहने’ की भाषा रखती है। चुना हुआ अनुवाद इस बाइबलीय मुहावरे और स्रोत की शब्दावली को सुरक्षित रखता है।
- issue: ἐλπίζοντας में आशा और भरोसे का संबंध
  choice: उस पर आशा रखते हैं
  alternative: उस पर भरोसा रखते हैं
  rationale: मूल पाठ आशा वाले शब्द-समूह का प्रयोग करता है। इसलिए मुख्य पाठ में ‘आशा’ रखा गया है, जबकि परमेश्वर पर भरोसेमंद निर्भरता का संभावित भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण बाइबलीय शैली में रखी गई है। ‘सभा’, ‘धन्य कहा’ और ‘आशा रखते हैं’ स्रोत की सामुदायिक, उपासना-संबंधी और धर्मवैचारिक शब्दावली को बिना सांप्रदायिक विस्तार के व्यक्त करते हैं। उपलब्ध यूनानी अंश पृष्ठ-विच्छेद पर τῷ σώ- तक है; शेष वाक्य निर्दिष्ट पूर्ण थियोदोशनी पाठ-धारा और दिए गए परीक्षित परामर्श-पाठ के आधार पर ग्रहण किया गया है।
