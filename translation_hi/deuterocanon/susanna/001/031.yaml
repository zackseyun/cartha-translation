lexical_decisions:
- source_word: ἦν δὲ
  choice: थी
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है, प्रबल विरोध नहीं; हिन्दी में अलग संयोजक जोड़ना अनावश्यक और अप्राकृतिक होता, इसलिए उसका प्रवाह वाक्य-क्रम में निहित रखा गया है।
- source_word: ἡ γυνή
  choice: वह स्त्री
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ सुसन्ना का स्वयं वर्णन हो रहा है, पति से उसका संबंध प्रमुख नहीं, इसलिए ‘वह स्त्री’ उपयुक्त है।
- source_word: τρυφερά
  choice: कोमल
  rationale: यह विशेषण शारीरिक कोमलता, नज़ाकत या सुसंस्कृत परिष्कार का संकेत दे सकता है। ‘कोमल’ नैतिक दुर्बलता या विलासिता का आरोप लगाए बिना मूल की अर्थ-व्याप्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: σφόδρα
  choice: अत्यन्त
  rationale: σφόδρα विशेषण को प्रबल रूप से तीव्र करता है; ‘अत्यन्त’ इस बल और गरिमामय कथात्मक शैली दोनों को व्यक्त करता है।
