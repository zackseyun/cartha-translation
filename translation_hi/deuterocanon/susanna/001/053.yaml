translation:
  language: hi
  text: पहले तुम अन्यायपूर्ण फ़ैसले सुनाते[a], निर्दोषों को दोषी ठहराते और दोषियों को रिहा कर देते थे, यद्यपि प्रभु कहता है[b], “निर्दोष और धर्मी जन को मार न डालना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “अन्यायपूर्ण न्याय करते।” यूनानी में एक ही मूल से बने शब्दों की पुनरुक्ति बल देने के लिए हुई है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम उद्धरण यूनानी परम्परा में निर्गमन 23:7 की कानूनी भाषा को प्रतिध्वनित करता है: निर्दोष और धर्मी जन को मार न डालना।'
    reason: cross_reference
lexical_decisions:
- source_word: πρότερον
  choice: पहले
  rationale: यह कालवाचक क्रियाविशेषण उस वृद्ध न्यायी के पिछले आचरण की ओर संकेत करता है; ‘पहले’ सहज और स्पष्ट है।
- source_word: κρίνων κρίσεις ἀδίκους
  choice: अन्यायपूर्ण फ़ैसले सुनाते
  rationale: न्यायिक प्रसंग में यह स्वाभाविक हिन्दी है। यूनानी की सजातीय पुनरुक्ति को मुख्य पाठ में असहज बनाए बिना उसका उल्लेख पादटिप्पणी में किया गया है।
- source_word: τοὺς μὲν ἀθῴους κατακρίνων
  choice: निर्दोषों को दोषी ठहराते
  rationale: ἀθῷος न्यायिक दोष से मुक्त व्यक्ति को और κατακρίνω दंडात्मक दोषारोपण को व्यक्त करता है; यह पदबंध दोनों भाव स्पष्ट रखता है।
- source_word: ἀπολύων δὲ τοὺς αἰτίους
  choice: और दोषियों को छोड़ देते
  rationale: ἀπολύω यहाँ छोड़ने या रिहा करने का अर्थ दे सकता है; ‘छोड़ देते’ औपचारिक दोषमुक्ति का अनावश्यक दावा किए बिना दोषियों और निर्दोषों के साथ विपरीत व्यवहार दिखाता है।
- source_word: λέγοντος τοῦ κυρίου
  choice: यद्यपि प्रभु कहता है
  rationale: 'सम्बन्धकारक स्वतंत्र पदबंध को प्रसंगानुसार विरोधसूचक रूप दिया गया है: न्यायी का आचरण प्रभु की आज्ञा के विरुद्ध था।'
- source_word: Ἀθῷον καὶ δίκαιον
  choice: निर्दोष और धर्मी जन
  rationale: दोनों विशेषणों को अलग रखा गया है ताकि निर्दोषता और धार्मिकता/न्यायपरायणता के संयुक्त कानूनी-मौलिक बल को एक ही धारणा में न मिला दिया जाए।
- source_word: οὐκ ἀποκτενεῖς
  choice: मार न डालना
  rationale: यह निषेध किसी को मृत्यु देने के विरुद्ध है; ‘मार न डालना’ स्पष्ट, सीधा और आज्ञात्मक कानूनी भाषा के अनुकूल है।
theological_decisions:
- issue: शास्त्रीय उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्रत्यक्ष यूनानी स्रोत में κύριος है। ‘प्रभु’ स्रोत के प्रति पारदर्शी है और किसी पुनर्निर्मित इब्रानी ईश-नाम को पाठ में नहीं जोड़ता।
- issue: λέγοντος τοῦ κυρίου का प्रसंगगत बल
  choice: यद्यपि प्रभु कहता है
  alternative: जैसा प्रभु कहता है
  rationale: ‘यद्यपि’ उस तनाव को स्पष्ट करता है कि न्यायी ने प्रभु की स्पष्ट आज्ञा के रहते उसके विपरीत काम किया; यह प्रसंग से उत्पन्न विरोध है, कोई अतिरिक्त सिद्धान्त नहीं।
- issue: ἀθῷον καὶ δίκαιον में दोनों पदों का सम्बन्ध
  choice: निर्दोष और धर्मी जन
  alternative: निर्दोष धर्मी जन
  rationale: ‘और’ को बनाए रखने से यूनानी के दोनों विशिष्ट वर्णनों—दोषमुक्त और धर्मी—को एक में समेटे बिना सुरक्षित रखा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में न्यायिक और गरिमापूर्ण शैली रखी गई है। ‘फ़ैसले सुनाते’, ‘दोषी ठहराते’ और ‘छोड़ देते’ सामान्य पाठक के लिए सहज हैं। उद्धरण में ‘मार न डालना’ आज्ञा की सीधाई बनाए रखता है; अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशिष्ट शब्दावली से बचा गया है।
