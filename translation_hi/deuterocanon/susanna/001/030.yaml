translation:
  language: hi
  text: तब उन्होंने उसे बुलवाया। वह अपने माता-पिता, बच्चों और सभी रिश्तेदारों के साथ आई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: तब उन्होंने
  rationale: δέ यहाँ प्रबल विरोध नहीं, बल्कि कथा की अगली घटना की ओर बढ़ने का संकेत देता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπέστειλαν
  choice: उसे बुलवा भेजा
  rationale: संदर्भ में क्रिया का आशय किसी वस्तु को भेजना नहीं, बल्कि सुसन्ना को उपस्थित होने के लिए बुलाना है। ‘बुलवा भेजा’ इस निहित अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἦλθεν
  choice: आई
  rationale: यह सरल कथात्मक भूतकाल है; स्त्रीलिंग कर्ता के अनुसार ‘आई’ सीधा और स्वाभाविक अनुवाद है।
- source_word: γονεῖς
  choice: माता-पिता
  rationale: बहुवचन संज्ञा का सामान्य अर्थ ‘माता-पिता’ है; यह यूनानी पाठ से अधिक विशिष्टता नहीं जोड़ता।
- source_word: τέκνα
  choice: बच्चों
  rationale: पारिवारिक सूची में τέκνα का सहज आधुनिक हिन्दी समानार्थी ‘बच्चे’ है।
- source_word: πάντες οἱ συγγενεῖς
  choice: सभी रिश्तेदारों
  rationale: πάντες पूरे समूह को समेटता है और συγγενεῖς व्यापक पारिवारिक संबंधियों को दर्शाता है; ‘सभी रिश्तेदार’ आधुनिक, स्पष्ट और समावेशी है।
