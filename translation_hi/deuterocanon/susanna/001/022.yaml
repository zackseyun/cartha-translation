base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/022.yaml
  text: And they said[a], “Look, the doors of the garden are shut, and no one sees us, and we are filled with desire for you. Therefore consent to us, and be with us.”
translation:
  language: hi
  text: और उन्होंने कहा, “देखो, बाग़[क] के दरवाज़े बंद हैं और कोई हमें नहीं देख रहा। हम तुम्हारी कामना करते हैं। इसलिए हमारी बात मान लो और हमारे साथ हो जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: यूनानी παράδεισος यहाँ घिरे हुए बाग़ या उद्यान के अर्थ में है, न कि बाद के धर्मवैचारिक अर्थ में ‘स्वर्गलोक’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचने वाला उद्गार है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: αἱ θύραι τοῦ παραδείσου
  choice: बाग़ के दरवाज़े
  rationale: यहाँ παράδεισος घिरे हुए बाग़ या उद्यान को सूचित करता है, न कि परलोक-संबंधी ‘स्वर्गलोक’ को। बहुवचन θύραι को ‘दरवाज़े’ रखा गया है।
- source_word: κέκλεινται
  choice: बंद हैं
  rationale: पूर्ण निष्क्रिय रूप से उत्पन्न वर्तमान अवस्था व्यक्त होती है; ‘बंद हैं’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐδεὶς θεωρεῖ ἡμᾶς
  choice: कोई हमें नहीं देख रहा
  rationale: θεωρεῖ यहाँ देखने या निगरानी करने को सूचित करता है; प्रसंग में ‘नहीं देख रहा’ स्वाभाविक है।
- source_word: ἐν ἐπιθυμίᾳ σού ἐσμεν
  choice: हम तुम्हारी अभिलाषा से भरे हैं
  rationale: यह वाक्य तीव्र, प्रसंगतः यौन इच्छा व्यक्त करता है। ‘अभिलाषा से भरे हैं’ मूल संरचना के निकट रहते हुए अनावश्यक रूप से ‘जल रहे हैं’ जैसी अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: διὸ
  choice: इसलिए
  rationale: यह पहले कथनों से आगे की माँग का निष्कर्ष जोड़ता है।
- source_word: συγκατάθου ἡμῖν
  choice: हमारी बात मान लो
  rationale: मध्यवाच्य आज्ञार्थक सहमत होने या मान जाने की माँग करता है। हिन्दी में ‘हमारी बात मान लो’ स्वाभाविक है और दबावपूर्ण आग्रह को बनाए रखता है।
- source_word: γενοῦ μεθ᾿ ἡμῶν
  choice: हमारे साथ हो जाओ
  rationale: शाब्दिक अर्थ ‘हमारे साथ हो’ है और प्रसंग यौन आशय स्पष्ट करता है; यह अनुवाद संकेत को बनाए रखता है, पर उसे मूल से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: गैर-परलोक-संबंधी कथा में παράδεισος का अर्थ
  choice: बाग़
  alternative: स्वर्गलोक / फ़िरदौस
  rationale: सुसन्ना की कथा में यह शब्द उस घिरे हुए बाग़ को सूचित करता है जहाँ घटना घटती है। ‘स्वर्गलोक’ या ‘फ़िरदौस’ यहाँ मूल पाठ में अनुपस्थित परलोक-संबंधी अर्थ का भ्रम पैदा करेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वक्ताओं की दबावपूर्ण यौन माँग को न तो नरम किया गया है, न मूल यूनानी से अधिक स्पष्ट या तीव्र। ‘बाग़’ प्रचलित आधुनिक हिन्दी रूप है; पाठ में किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
