base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/007.yaml
  text: These men saw a woman beautiful in appearance[a], a wife of one of their brothers from the sons of Israel, whose name was Susanna, daughter of Hilkiah, wife of Joakim, walking in her husband's garden in the evening.
translation:
  language: hi
  text: इन पुरुषों ने एक स्त्री को देखा जो रूप में सुन्दर थी—वह इस्राएल की सन्तानों में से उनके एक भाई की पत्नी थी[a]। उसका नाम सुसन्ना था; वह हिल्कियाह की बेटी और योआकीम की पत्नी थी। वह संध्या के समय अपने पति के बगीचे में टहल रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ का शाब्दिक भाव है, “इस्राएल की सन्तानों में से उनके भाई की पत्नी।” वाक्य-विन्यास कठिन है; सम्भवतः आशय यह है कि वह उन्हीं के लोगों में से एक सह-इस्राएली की पत्नी थी।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: इन पुरुषों ने
  rationale: संकेतवाचक शब्द का सम्बन्ध प्रसंग के दो पुरनियों/न्यायियों से है; ‘पुरुषों’ जोड़ने से हिन्दी में सन्दर्भ स्पष्ट होता है।
- source_word: γυναῖκα ἀστεῖαν τῷ εἴδει
  choice: एक स्त्री ... जो रूप में सुन्दर थी
  rationale: ἀστεῖος और τῷ εἴδει मिलकर बाहरी रूप-सौन्दर्य बताते हैं; यह अनुवाद निकट और स्वाभाविक है।
- source_word: γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: वह इस्राएल की सन्तानों में से उनके एक भाई की पत्नी थी[a]
  rationale: कठिन यूनानी वाक्यांश की बन्धुता और इस्राएली समुदाय—दोनों को बनाए रखता है, पर जैविक भाई होने का निष्कर्ष निश्चित नहीं करता।
- source_word: ὄνομα Σουσάνναν
  choice: उसका नाम सुसन्ना था
  rationale: नाम बताने वाले यूनानी सूत्र का सहज हिन्दी रूप।
- source_word: θυγατέρα Χελκίου
  choice: हिल्कियाह की बेटी
  rationale: वंश-सूचक सम्बन्ध का सीधा अनुवाद।
- source_word: γυναῖκα Ἰωακείμ
  choice: योआकीम की पत्नी
  rationale: सम्बन्धवाचक पद का सीधा अनुवाद; नाम यूनानी रूप के अनुसार लिप्यन्तरित है।
- source_word: περιπατοῦσαν
  choice: टहल रही थी
  rationale: बगीचे में चलने की निरन्तर क्रिया के लिए स्वाभाविक हिन्दी; ‘चल रही थी’ की अपेक्षा प्रसंग में अधिक सटीक।
- source_word: ἐν τῷ παραδείσῳ τοῦ ἀνδρὸς αὐτῆς
  choice: अपने पति के बगीचे में
  rationale: यहाँ παράδεισος का अर्थ उद्यान/बगीचा है, धर्मशास्त्रीय ‘स्वर्गलोक’ नहीं।
- source_word: τὸ δειλινόν
  choice: संध्या के समय
  rationale: समय-सूचक अभिव्यक्ति का dignified और स्पष्ट आधुनिक हिन्दी रूप।
theological_decisions:
- issue: γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ का कठिन बन्धुता-सूचक वाक्यांश
  choice: इस्राएल की सन्तानों में से उनके एक भाई की पत्नी
  alternative: उनके भाई की पत्नी, जो इस्राएल की सन्तानों में से था; अथवा केवल ‘एक इस्राएली की पत्नी’
  rationale: प्राप्त यूनानी पाठ की असहज रचना और ‘भाई’ की सामुदायिक भाषा को सुरक्षित रखा गया है। ‘एक’ हिन्दी में इस सम्भावना को खुला रखता है कि आशय सह-इस्राएली से है, न कि अनिवार्यतः दोनों पुरुषों के एक ही सगे भाई से।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथा-सुलभ शैली रखी गई है। ‘सन्तानों’, ‘संध्या’ और पारिवारिक परिचयों से स्रोत की औपचारिक लय बनी रहती है; कठिन यूनानी सम्बन्ध-वाक्य को पादटिप्पणी सहित पारदर्शी रखा गया है।
