base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/016.yaml
  text: And after turning back[a], they came to the same place, and when they questioned one another about the reason, they confessed their desire[b]; then together they arranged a time when they would be able to find her alone.
translation:
  language: hi
  text: फिर वे लौटकर एक ही जगह आ पहुँचे[a]। जब उन्होंने एक-दूसरे से इसका कारण पूछा, तो उन्होंने अपनी अभिलाषा स्वीकार कर ली[b]। तब उन्होंने मिलकर एक ऐसा समय तय किया जब वे उसे अकेली पा सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक साथ आ पहुँचे’; यूनानी वाक्यांश का अर्थ उसी स्थान पर पहुँचना हो सकता है, पर कभी-कभी वह एक साथ इकट्ठा होने पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में ‘अभिलाषा’ का अर्थ अनुचित यौन इच्छा है; अधिक स्पष्ट अनुवाद ‘अपनी वासना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακάμψαντες
  choice: लौटकर
  rationale: यह कृदन्त मुड़कर वापस आने या लौटने को दर्शाता है; ‘लौटकर’ हिन्दी में घटनाक्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἐπὶ τὸ αὐτό
  choice: एक ही जगह
  rationale: इस प्रसंग में वाक्यांश का सबसे स्वाभाविक अर्थ दोनों का उसी स्थान पर फिर आ पहुँचना है, यद्यपि इसमें साथ इकट्ठा होने का भाव भी संभव है।
- source_word: ἀνετάζοντες ἀλλήλους
  choice: उन्होंने एक-दूसरे से ... पूछा
  rationale: क्रिया जाँचने या पूछताछ करने का भाव रखती है; यहाँ परस्पर अपने लौटने का कारण जानने के लिए पूछना अभिप्रेत है, इसलिए औपचारिक ‘पूछताछ’ की अपेक्षा यह रूप अधिक स्वाभाविक है।
- source_word: τὴν αἰτίαν
  choice: इसका कारण
  rationale: αἰτία यहाँ उनके व्यवहार के कारण या हेतु को सूचित करता है। ‘इसका कारण’ संदर्भ से संबंध बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ὡμολόγησαν
  choice: स्वीकार कर ली
  rationale: क्रिया खुले रूप से मान लेने या कबूल करने को व्यक्त करती है। ‘स्वीकार कर ली’ नैतिक संदर्भ को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: τὴν ἐπιθυμίαν αὐτῶν
  choice: अपनी अभिलाषा
  rationale: ἐπιθυμία सामान्यतः इच्छा या अभिलाषा हो सकती है, जबकि इस प्रसंग में वह अनुचित यौन इच्छा है। मुख्य पाठ अपेक्षाकृत व्यापक शब्द रखता है और पादटिप्पणी संदर्भगत अर्थ स्पष्ट करती है।
- source_word: κοινῇ
  choice: मिलकर
  rationale: यह क्रियाविशेषण उनकी संयुक्त कार्रवाई पर बल देता है; ‘मिलकर’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: συνετάξαντο
  choice: तय किया
  rationale: मध्यवाच्य क्रिया अपने उद्देश्य के लिए समय निर्धारित या व्यवस्थित करने का भाव देती है; ‘तय किया’ उनकी सोची-समझी संयुक्त योजना को सहज ढंग से व्यक्त करता है।
- source_word: καιρόν
  choice: एक ऐसा समय
  rationale: καιρός समय या अनुकूल अवसर दोनों का अर्थ दे सकता है। आगे का आश्रित वाक्य अवसर की प्रकृति स्पष्ट करता है, इसलिए ‘एक ऐसा समय’ दोनों भावों को स्वाभाविक रूप से समेटता है।
- source_word: δυνήσονται εὑρεῖν ... μόνην
  choice: वे उसे अकेली पा सकें
  rationale: यह सामर्थ्य और नियोजित अवसर का भाव व्यक्त करता है। संभावनार्थक ‘पा सकें’ हिन्दी के अप्रत्यक्ष भूतकालीन कथन में स्वाभाविक है, और ‘अकेली’ उसके निरसंग होने को स्पष्ट करता है।
