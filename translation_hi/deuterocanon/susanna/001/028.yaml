base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/028.yaml
  text: But the lawless men turned back[a], threatening among themselves and lying in wait so that they might put her to death. And when they came to the assembly of the city, they did not stay away[b], and all the sons of Israel who were there gathered together.
translation:
  language: hi
  text: परंतु वे व्यवस्था-विरोधी पुरुष आपस में धमकियाँ देते हुए और उसे मार डालने के लिए उसकी घात लगाते हुए लौट गए। फिर वे नगर की सभा में आए और उससे अनुपस्थित नहीं रहे[a]; और वहाँ उपस्थित इस्राएल के सभी पुत्र एकत्र हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश यूनानी में कठिन है; सम्भवतः आशय यह है कि वे नगर की सभा से अनुपस्थित नहीं रहे, बल्कि उसमें उपस्थित थे।
    reason: textual_difficulty
lexical_decisions:
- source_word: παράνομοι
  choice: व्यवस्था-विरोधी
  rationale: यह विशेषण केवल सामान्य दुष्टता नहीं, बल्कि व्यवस्था के विरुद्ध आचरण का कानूनी-नैतिक भाव रखता है।
- source_word: ἀπέστρεψαν
  choice: लौट गए
  rationale: कथानक में पीछे लौटने की सीधी गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπειλοῦντες ἐν ἑαυτοῖς
  choice: आपस में धमकियाँ देते
  rationale: कुछ असहज यूनानी पदबंध को ऐसा ही रहने देता है कि धमकी या शत्रुतापूर्ण चर्चा उनके अपने बीच चल रही थी।
- source_word: ἐνεδρεύοντες
  choice: उसकी घात में लगे रहे
  rationale: गुप्त शत्रुतापूर्ण षड्यंत्र के साथ घात लगाने का ठोस भाव सुरक्षित रखता है।
- source_word: ἵνα θανατώσωσιν αὐτήν
  choice: ताकि उसे मार डालें
  rationale: ἵνα के प्रयोजनार्थक बल और घातक उद्देश्य को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: συναγωγή
  choice: सभा
  rationale: यहाँ नागरिक या न्यायिक जमाव का संकेत है, किसी बाद के तकनीकी आराधनालय-भवन का नहीं।
- source_word: οὐ παρῴκουν
  choice: उससे दूर नहीं रहे
  rationale: कठिन पदबंध को शाब्दिक निकटता के साथ प्रस्तुत करता है और उनकी सभा में उपस्थिति का संभावित अर्थ बनाए रखता है।
- source_word: συνήδρευσαν
  choice: एकत्र हुए
  rationale: सभा के लिए एक साथ आने का सामूहिक भाव स्वाभाविक हिन्दी में देता है।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएल के सभी पुत्र
  rationale: मूल यूनानी के स्पष्ट पुरुषवाचक पारिवारिक मुहावरे को सुरक्षित रखता है।
theological_decisions:
- issue: लिंगसूचक जातीय पदनाम
  choice: इस्राएल के सभी पुत्र
  alternative: सभी इस्राएली
  rationale: यूनानी में οἱ υἱοὶ Ἰσραήλ, अर्थात् ‘इस्राएल के पुत्र’, स्पष्ट रूप से है; इसलिए अधिक सामान्य जातीय पद से इसे निष्प्रभावी नहीं किया गया।
- issue: संदिग्ध सभा-संबंधी वाक्यांश
  choice: उससे दूर नहीं रहे
  alternative: वे अनुपस्थित नहीं थे
  rationale: οὐ παρῴκουν का अर्थ इस स्थान पर कठिन है। मुख्य पाठ उनकी सभा से दूर न रहने की सम्भावना रखता है, बिना किसी निश्चित व्याख्या को अनावश्यक रूप से थोपे।
