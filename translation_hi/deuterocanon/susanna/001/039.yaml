  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथन आरोप लगाने वाले वृद्धों की वाणी है, इसलिए अनुवाद उनके दावे को बयान करता है, उसे स्वतंत्र तथ्य के रूप में प्रमाणित नहीं करता।
