translation:
  language: hi
  text: और पास आकर हमने उसे पहचान लिया, पर वह युवक ढका हुआ भाग गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: हमने उसे पहचान लिया
  rationale: क्रिया का सामान्य अर्थ केवल देखने के बजाय पहचान लेने या ठीक से जान लेने का है; प्रसंग में वृद्धों का दावा है कि उन्होंने स्त्री को पहचान लिया।
- source_word: νεανίσκος
  choice: वह जवान
  rationale: यह शब्द एक युवा पुरुष को दर्शाता है; आधुनिक हिन्दी में ‘जवान’ सहज और प्रसंगानुकूल है।
- source_word: συγκεκαλυμμένος
  choice: अपना मुँह ढके हुए
  rationale: मूल में सामान्यतः ‘ढका हुआ’ है और ढकी हुई वस्तु स्पष्ट नहीं की गई; पहचान से बचने के प्रसंग में हिन्दी में मुँह ढकना स्वाभाविक अभिव्यक्ति है, यद्यपि इसमें प्रसंगगत स्पष्टता जोड़ी गई है।
theological_decisions:
- issue: ἐπέγνωμεν का अर्थ
  choice: पहचान लिया
  alternative: देख लिया
  rationale: मूल क्रिया में पहचान या पूर्ण रूप से जान लेने का भाव अधिक स्पष्ट है; इससे वृद्धों की गवाही का दावा व्यक्त होता है, उसकी सत्यता की पुष्टि नहीं।
- issue: συγκεκαλυμμένος का संबंध
  choice: जवान के भागते समय ढके होने के रूप में रखा
  alternative: सिर्फ ‘ढका हुआ’
  rationale: पुल्लिंग एकवचन कृदन्त νεανίσκος से मेल खाता है; इसलिए इसे जवान से जोड़ा गया है।
