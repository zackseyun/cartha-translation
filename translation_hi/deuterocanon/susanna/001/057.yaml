  yaml_path: translation/deuterocanon/susanna/001/057.yaml
  text: This is how you acted toward the daughters of Israel[a], and they, out of fear, associated with you; but a daughter of Judah did not endure your lawlessness.
translation:
  language: hi
  text: तुम इस्राएल की बेटियों के साथ ऐसा ही करते थे, और वे डर के मारे तुम्हारे साथ मेल-जोल रखती थीं[a]; पर यहूदा की एक बेटी ने तुम्हारे अधर्म को सहन नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी संगति करती थीं” अथवा “तुम्हारे साथ संबंध रखती थीं।” यूनानी में कहा गया है कि वे भय के कारण उनसे मेल-जोल रखती थीं। दबाव और यौन दुर्व्यवहार का प्रसंग साधारण मेल-जोल से अधिक का संकेत देता है, पर प्रयुक्त क्रिया स्वयं सीधे तौर पर यौन संबंध नहीं कहती।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἐποιεῖτε
  choice: तुम ... ऐसा ही करते थे
  rationale: अपूर्ण भूतकाल बार-बार या प्रथागत रूप से किए गए काम का संकेत देता है; ‘करते थे’ इस पहलू को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: θυγατράσιν Ἰσραήλ
  choice: इस्राएल की बेटियों
  rationale: मूल का पारिवारिक और वाचा-संबंधी मुहावरा सुरक्षित रहता है तथा आगे ‘यहूदा की एक बेटी’ के साथ उसका अलंकारिक विरोध भी बना रहता है।
- source_word: φοβούμεναι
  choice: डर के मारे
  rationale: कृदन्त अगले कार्य का कारण बताता है; यह अभिव्यक्ति भय और विवशता के कारणात्मक भाव को स्पष्ट, सहज हिन्दी में व्यक्त करती है।
- source_word: ὡμίλουν ὑμῖν
  choice: तुम्हारे साथ संबंध रखती थीं
  rationale: ὁμιλέω का अर्थ साथ रहना, मेल-जोल या संबंध रखना हो सकता है। प्रसंग में यौन दुर्व्यवहार और दबाव निहित हैं, पर यूनानी क्रिया स्वयं प्रत्यक्ष यौन क्रिया नहीं है; इसलिए अपेक्षाकृत व्यापक अभिव्यक्ति रखी गई है।
- source_word: ἀλλ᾽ οὐ θυγάτηρ Ἰούδα
  choice: पर यहूदा की एक बेटी ने ... नहीं
  rationale: अनिश्चित एकवचन को बनाए रखकर सुसन्ना को यहूदा की प्रतिनिधि बेटी के रूप में प्रस्तुत किया गया है, बिना इसे ‘यहूदा की कोई बेटी नहीं’ जैसे अधिक व्यापक दावे में बदलने के।
- source_word: ὑπέμεινεν
  choice: सहन नहीं किया
  rationale: ὑπομένω में सहना, टिके रहना या अपने ऊपर लेना जैसे भाव हैं। यहाँ यह बुज़ुर्गों की बुराई को न मानने और न सहने का संकेत देता है।
- source_word: τὴν ἀνομίαν ὑμῶν
  choice: तुम्हारी अधर्मता
  rationale: ἀνομία के नैतिक और व्यवस्था-विरोधी दोनों आयाम हैं। ‘अधर्मता’ आधुनिक बाइबलीय हिन्दी में स्वाभाविक रहते हुए इस गंभीर नैतिक-धार्मिक बल को बनाए रखती है।
theological_decisions:
- issue: ‘यहूदा की बेटी’ में प्रतिनिधिक एकवचन
  choice: यहूदा की एक बेटी
  alternative: यहूदा की कोई बेटी नहीं; यहूदा की बेटियाँ
  rationale: यूनानी एकवचन को बनाए रखने से ‘इस्राएल की बेटियों’ के साथ अलंकारिक विरोध सुरक्षित रहता है और मूल से अधिक व्यापक दावा नहीं बनता।
- issue: ἀνομία का नैतिक और विधिक बल
  choice: अधर्मता
  alternative: दुष्टता; अन्याय; व्यवस्था-विहीनता
  rationale: ‘अधर्मता’ पाप और विधि-विरोध दोनों की गुंजाइश रखती है तथा शब्द को केवल निजी दुष्टता या न्यायिक अन्याय तक सीमित नहीं करती।
- issue: ὡμίλουν में निहित जबरदस्ती और यौन प्रसंग
  choice: संबंध रखती थीं, साथ में भय का कारण और स्पष्टीकरणात्मक पादटिप्पणी
  alternative: तुम्हारे आगे झुक जाती थीं; तुम्हारे साथ सोती थीं
  rationale: प्रसंग दबावपूर्ण यौन शोषण की ओर संकेत करता है, पर क्रिया स्वयं इतनी स्पष्ट नहीं है। अनुवाद अस्पष्टता को बनाए रखता है और भय के द्वारा विवशता व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘बेटियों’ का बाइबलीय मुहावरा और दोनों समूहों के बीच अलंकारिक विरोध सुरक्षित है। ‘संबंध रखती थीं’ जानबूझकर इतना व्यापक है कि मूल यूनानी की वास्तविक अस्पष्टता बनी रहे, जबकि ‘डर के मारे’ विवशता स्पष्ट करता है।
