    text: यूनानी शब्द का अर्थ यहाँ घिरा हुआ बगीचा या उपवन है, बाद के धर्मवैज्ञानिक अर्थ में ‘स्वर्गलोक’ नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: उन्होंने वैसा ही किया जैसा उसने कहा था
  rationale: यह वाक्यांश सुसन्ना के निर्देश के अनुरूप दासियों के कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπέκλεισαν τὰς θύρας τοῦ παραδείσου
  choice: उन्होंने बगीचे के द्वार बंद कर दिए
  rationale: ἀποκλείω का अर्थ बंद करना है; 'ताला लगा दिया' कहना मूल से अधिक अर्थ जोड़ता। παράδεισος यहाँ घिरे हुए बगीचे को दर्शाता है, बाद का धर्मवैज्ञानिक 'स्वर्गलोक' नहीं।
- source_word: κατὰ τὰς πλαγίας θύρας
  choice: बगल के द्वारों से
  rationale: κατά यहाँ बाहर जाने का मार्ग बताता है और πλαγίας θύρας मुख्य द्वारों से अलग पार्श्व-द्वारों को सूचित करता है।
- source_word: ἐνέγκαι τὰ προστεταγμένα αὐταῖς
  choice: अपने लिए दी गई आज्ञा के अनुसार सामान लाने के लिए
  rationale: ἐνέγκαι उद्देश्य बताता है और perfect passive participle पहले दिए गए निर्देश को सूचित करता है। हिन्दी में केवल 'जो आज्ञा दी गई थी उसे लाने' कहना अस्वाभाविक होता, इसलिए वस्तु को सामान्य रूप से 'सामान' कहा गया है।
- source_word: τοὺς πρεσβυτέρους
  choice: उन पुरनियों को
  rationale: πρεσβύτεροι कथा में केवल वृद्ध पुरुष नहीं, समुदाय के मान्य अगुवे और न्यायी हैं; 'पुरनिये' इस सामाजिक भूमिका को बनाए रखता है।
- source_word: ὅτι ἦσαν κεκρυμμένοι
  choice: क्योंकि वे छिपे हुए थे
  rationale: perfect passive participle पहले से बनी हुई छिपी अवस्था को व्यक्त करता है।
