  yaml_path: translation/deuterocanon/susanna/001/020.yaml
  text: And they did as she said[a], and they shut the doors of the garden and went out by the side doors to bring what had been ordered for them, and they did not see the elders, because they were hidden.
translation:
  language: hi
  text: और उन्होंने वैसा ही किया जैसा उसने कहा। उन्होंने बगीचे[a] के द्वार बंद किए और उन्हें जो सामान लाने को कहा गया था, उसे लाने के लिए पार्श्व-द्वारों से बाहर चली गईं। उन्होंने उन बुज़ुर्गों को नहीं देखा, क्योंकि वे छिपे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
