translation:
  language: hi
  text: पर जब बुज़ुर्गों ने अपनी बातें कहीं, तो सेवक बहुत लज्जित हुए, क्योंकि सुसन्ना के विषय में ऐसी बात पहले कभी नहीं कही गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡνίκα δὲ
  choice: पर जब
  rationale: ἡνίκα का समयसूचक अर्थ ‘जब’ है और δέ कथा में हल्का विरोध या नया मोड़ दिखाता है; ‘पर जब’ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ πρεσβῦται
  choice: पुरनियों
  rationale: πρεσβῦται यहाँ केवल वृद्ध पुरुष नहीं, बल्कि समुदाय के मान्य अगुवे और न्यायी हैं; ‘पुरनिये’ इस पदगत अर्थ को बनाए रखता है।
- source_word: τοὺς λόγους αὐτῶν
  choice: अपनी बातें
  rationale: λόγους व्यापक शब्द है और यहाँ उनके कहे हुए कथनों को दर्शाता है; ‘बातें’ आरोप या औपचारिक गवाही का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: κατῃσχύνθησαν ... σφόδρα
  choice: बहुत लज्जित हुए
  rationale: क्रिया लज्जित या शर्मिंदा होने का भाव देती है और σφόδρα उसकी तीव्रता बढ़ाता है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: οἱ δοῦλοι
  choice: सेवक
  rationale: δοῦλοι दासों या सेवकों को सूचित कर सकता है; इस घरेलू प्रसंग में ‘सेवक’ स्वाभाविक है और मूल सामाजिक संबंध को पर्याप्त रूप से व्यक्त करता है।
- source_word: ὅτι πώποτε οὐκ ἐρρέθη
  choice: क्योंकि ... पहले कभी नहीं कही गई थी
  rationale: ὅτι कारण बताता है और πώποτε के साथ निषेध का अर्थ ‘कभी भी नहीं’ है; हिन्दी का यह रूप पूर्वकालीन और अभूतपूर्व घटना को स्पष्ट करता है।
- source_word: λόγος τοιοῦτος
  choice: ऐसी बात
  rationale: λόγος का मूल अर्थ शब्द, कथन या बात हो सकता है; इस संदर्भ में ‘ऐसी बात’ स्वाभाविक है और इसे स्पष्टतः ‘आरोप’ कहकर अर्थ को संकीर्ण नहीं करता।
- source_word: περὶ Σουσάννης
  choice: सुसन्ना के विषय में
  rationale: περί + संबंधकारक का सामान्य अर्थ ‘के विषय में’ है; यह संदर्भ की शत्रुता को ‘विरुद्ध’ जोड़कर मूल से अधिक स्पष्ट नहीं करता।
