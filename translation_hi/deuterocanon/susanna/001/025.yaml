base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/025.yaml
  text: It is preferable for me to fall into your hands without doing it rather than to sin before the Lord[a].
translation:
  language: hi
  text: मेरे लिए यह बेहतर है कि उसे किए बिना[a] तुम्हारे हाथों में पड़ जाऊँ, बजाय इसके कि प्रभु के सामने पाप करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “न करके।” यूनानी पाठ उस काम को अनकहा छोड़ता है और बुज़ुर्गों की पिछली माँग की ओर संकेत करता है।
    reason: मूल यूनानी में क्रिया का कर्म निहित है; हिन्दी में जोड़ा गया ‘उसे’ इसी संदर्भ-संकेत को स्पष्ट करता है।
lexical_decisions:
- source_word: αἱρετόν μοί ἐστιν
  choice: मेरे लिए यह बेहतर है
  rationale: यह यूनानी पद व्यक्तिगत मूल्यांकन और दो विकल्पों की तुलना व्यक्त करता है। ‘मेरे लिए यह बेहतर है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए ‘वरणीय’ या ‘अधिक उचित’ होने का भाव देता है।
- source_word: μὴ πράξασαν
  choice: उसे किए बिना
  rationale: अकर्तृक एओरिस्ट कृदन्त पूर्व प्रसंग में बुज़ुर्गों की माँग की ओर संकेत करता है, पर उस काम को नाम नहीं देता। हिन्दी में ‘उसे’ न्यूनतम आवश्यक संकेत देता है और मूल की संयमित अस्पष्टता बनाए रखता है।
- source_word: ἐμπεσεῖν εἰς τὰς χεῖρας ὑμῶν
  choice: तुम्हारे हाथों में पड़ जाऊँ
  rationale: यह किसी के वश या दंड के अधीन पड़ने का रूपक है। हिन्दी का समान मुहावरा मूल बिंब और संकट, दोनों को सुरक्षित रखता है।
- source_word: ἢ
  choice: बजाय इसके कि
  rationale: यहाँ ἢ दो अप्रिय विकल्पों के बीच तुलना करता है; यह हिन्दी पदबंध ‘rather than’ का स्वाभाविक अर्थ देता है।
- source_word: ἁμαρτεῖν
  choice: पाप करूँ
  rationale: क्रिया का सीधा धार्मिक और नैतिक अर्थ ‘पाप करना’ है, विशेषतः प्रभु के सामने उत्तरदायित्व के प्रसंग में।
- source_word: ἐνώπιον Κυρίου
  choice: प्रभु के सामने
  rationale: यह परमेश्वर की उपस्थिति और दृष्टि में उत्तरदायी होने का भाव व्यक्त करता है। ‘प्रभु के सामने’ संक्षिप्त, स्पष्ट और श्रद्धापूर्ण है।
theological_decisions:
- issue: बुज़ुर्गों द्वारा माँगे गए अनाम काम को स्पष्ट करना या न करना
  choice: मुख्य पाठ में केवल सर्वनाम ‘उसे’ द्वारा संकेत करना
  alternative: ‘तुम्हारी बात मानने’ या ‘यह यौन पाप करने’ के रूप में स्पष्ट विस्तार करना
  rationale: यूनानी पाठ πράσσω का कर्म नहीं बताता, बल्कि पूर्व प्रसंग पर निर्भर रहता है। अधिक स्पष्ट विस्तार मूल से आगे जाकर व्याख्या जोड़ देता; ‘उसे’ हिन्दी की व्याकरणिक स्पष्टता देते हुए मूल की अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हाथों में पड़ना’ मूल रूपक के समान हिन्दी मुहावरा है; ‘प्रभु’ यहूदी-यूनानी धर्मग्रन्थीय संदर्भ में Κυρίου का श्रद्धापूर्ण अनुवाद है।
