translation:
  language: hi
  text: योआकीम[a] बहुत ही धनी था। उसके घर से लगा हुआ एक बगीचा[b] था। यहूदी[c] उसके पास आया करते थे, क्योंकि वह उन सबसे अधिक प्रतिष्ठित था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का पारंपरिक रूप ‘योआखिम’ भी मिलता है; यहाँ यूनानी Ἰωακείμ के निकट ‘योआकीम’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उद्यान’ अथवा ‘उपवन’; यूनानी शब्द किसी विकसित या घेरेदार बगीचे अथवा संपदा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, यदि शब्द को भौगोलिक अर्थ में लिया जाए, ‘यहूदिया के लोग’।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωακείμ
  choice: योआकीम
  rationale: यूनानी नाम का निकट और हिन्दी में सहज लिप्यंतरण; पारंपरिक रूप ‘योआखिम’ भी मिलता है।
- source_word: πλούσιος σφόδρα
  choice: बहुत ही धनी
  rationale: πλούσιος का अर्थ ‘धनी’ है और σφόδρα उसकी तीव्रता को स्पष्ट रूप से बढ़ाता है।
- source_word: παράδεισος
  choice: बगीचा
  rationale: यहाँ शब्द किसी धनी व्यक्ति के घर से लगे हुए घेरेदार, विकसित उद्यान या उपवन को दर्शाता है, न कि धर्मवैज्ञानिक अर्थ में ‘स्वर्गलोक’ को। ‘बगीचा’ सामान्य आधुनिक हिन्दी में सबसे स्पष्ट है।
- source_word: γειτνιῶν τῷ οἴκῳ αὐτοῦ
  choice: उसके घर से लगा हुआ
  rationale: कृदंत निकटता, और संभवतः सटी हुई स्थिति, व्यक्त करता है; यह हिन्दी प्रयोग स्वाभाविक रूप से दोनों बातों को समेटता है।
- source_word: πρὸς αὐτὸν προσήγοντο
  choice: उसके पास आया करते थे
  rationale: अपूर्णकालीन रूप बार-बार या प्रथागत रूप से आने का भाव देता है। रूप को यांत्रिक रीति से ‘लाए जाते थे’ कहना संभव है, पर प्रसंग में स्वेच्छा से उसके पास आना अधिक स्वाभाविक है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: इस कथा में यह पद मुख्यतः यहूदी समुदाय के लोगों को सूचित करता है; भौगोलिक बल होने पर ‘यहूदिया के लोग’ भी संभव है।
- source_word: ἐνδοξότερον πάντων
  choice: उन सबमें सबसे अधिक प्रतिष्ठित
  rationale: तुलनात्मक पद सार्वजनिक सम्मान, प्रतिष्ठा और सामाजिक हैसियत दर्शाता है। हिन्दी में श्रेष्ठतासूचक यह रचना स्वाभाविक है और नैतिक या आत्मिक श्रेष्ठता नहीं जोड़ती।
theological_decisions:
- issue: ἐνδοξότερον πάντων में योआकीम की श्रेष्ठता का स्वरूप
  choice: सामाजिक प्रतिष्ठा के रूप में अनुवाद
  alternative: सबसे अधिक महिमावान / सबसे श्रेष्ठ
  rationale: यह उपवाक्य बताता है कि लोग उसके पास क्यों आते थे। प्रसंग सार्वजनिक प्रतिष्ठा का है, धार्मिकता, पवित्रता या आत्मिक श्रेष्ठता का नहीं।
- issue: οἱ Ἰουδαῖοι की सामुदायिक या भौगोलिक पहचान
  choice: यहूदी
  alternative: यहूदिया के लोग
  rationale: कथा में सामुदायिक अर्थ अधिक स्वाभाविक है, पर पादटिप्पणी भौगोलिक अर्थ की वास्तविक संभावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से यूनानी के तीन समन्वित खंड हिन्दी में स्पष्ट किए गए हैं। ‘प्रतिष्ठित’ सामाजिक सम्मान को व्यक्त करता है और पाठ में नैतिक अथवा आत्मिक श्रेष्ठता नहीं जोड़ता।
