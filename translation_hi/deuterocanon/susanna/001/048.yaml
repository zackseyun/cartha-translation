  choice: हे इस्राएल के पुत्रो / इस्राएल की एक बेटी
  alternative: हे इस्राएलियो / एक इस्राएली स्त्री
  rationale: मूल पद पुरुष न्यायाधीशों और दोषी ठहराई गई स्त्री के लिए समान वाचागत पारिवारिक भाषा का विरोधात्मक प्रयोग करता है। इसे लिंग-निरपेक्ष करने से फटकार की अलंकारिक धार कम हो जाती।
