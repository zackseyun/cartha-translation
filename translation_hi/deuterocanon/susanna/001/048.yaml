translation:
  language: hi
  text: पर वह उनके बीच खड़ा हुआ और बोला, “हे इस्राएल के पुत्रों, क्या तुम इतने मूर्ख हो? बिना जाँच-पड़ताल किए और तथ्यों को स्पष्ट रूप से जाने बिना तुमने इस्राएल की एक बेटी को दोषी ठहरा दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: खड़ा होकर
  rationale: ἵστημι के अओरिस्ट कृदंत की ठोस शारीरिक क्रिया को स्वाभाविक हिन्दी में रखते हुए इसे मुख्य कथन से जोड़ा गया है।
- source_word: ἐν μέσῳ αὐτῶν
  choice: उनके बीच
  rationale: यह सार्वजनिक और आमने-सामने के प्रसंग को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Οὕτως μωροί
  choice: क्या तुम ऐसे मूर्ख हो?
  rationale: मूल यूनानी की तीखी, विस्मयात्मक फटकार को प्रश्न के रूप में सुरक्षित रखा गया है; ‘मूर्ख’ μωροί की संज्ञात्मक शक्ति को बनाए रखता है।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: हे इस्राएल के पुत्रो
  rationale: प्रत्यक्ष संबोधन और स्पष्ट पुल्लिंग बहुवचन को सुरक्षित रखते हुए ‘इस्राएल की एक बेटी’ के साथ मूल का अलंकारिक विरोध बनाए रखा गया है।
- source_word: ἀνακρίναντες
  choice: जाँच-पड़ताल किए
  rationale: क्रिया के न्यायिक जाँच या पूछताछ के भाव को साधारण पाठक के लिए स्वाभाविक विधिक हिन्दी में व्यक्त करता है।
- source_word: τὸ σαφὲς ἐπιγνόντες
  choice: सच्चाई को स्पष्ट रूप से जाने
  rationale: σαφές के स्पष्टता-बोध और ἐπιγινώσκω के ठोस रूप से जान लेने के भाव को बनाए रखा गया है, बिना ‘तथ्य’ जैसे ऐसे शब्द से अर्थ को अत्यधिक सीमित किए जो मूल में प्रत्यक्षतः नहीं है।
- source_word: κατεκρίνατε
  choice: दोषी ठहरा दिया
  rationale: यह न्यायिक दोषनिर्णय को आधुनिक हिन्दी में स्पष्ट करता है और पूर्ण हो चुकी अनुचित कार्रवाई की शक्ति बनाए रखता है।
- source_word: θυγατέρα Ἰσραήλ
  choice: इस्राएल की एक बेटी
  rationale: अनिश्चित एकवचन और वाचा-समुदाय की सदस्यता दोनों को व्यक्त करता है तथा ‘इस्राएल के पुत्रो’ के साथ जानबूझकर रखा गया लैंगिक विरोध सुरक्षित रहता है।
theological_decisions:
