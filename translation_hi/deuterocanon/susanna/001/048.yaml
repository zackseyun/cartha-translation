  terminology: “इस्राएल के पुत्रों” and “इस्राएल की एक बेटी” appropriately preserve the source's deliberate gendered familial contrast. “जाँच-पड़ताल” and “दोषी ठहरा दिया” suitably convey the judicial force without importing a specific legal system.
