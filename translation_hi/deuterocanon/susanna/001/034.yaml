translation:
  language: hi
  text: तब बुज़ुर्ग और न्यायाधीश उठ खड़े हुए और उन्होंने उसके सिर पर अपने हाथ रखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: उठ खड़े हुए
  rationale: यह क्रिया-विशेषणात्मक रूप कथा में अगली क्रिया आरम्भ करता है; ‘उठ खड़े हुए’ शारीरिक क्रिया और घटनाक्रम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ πρεσβύτεροι
  choice: प्राचीन
  rationale: यहाँ शब्द केवल अधिक आयु वाले पुरुषों के लिए नहीं, बल्कि समुदाय के मान्य अगुओं के लिए है; ‘प्राचीन’ बाइबलीय न्यायिक-सामुदायिक पद को संक्षेप में बनाए रखता है।
- source_word: κριταὶ
  choice: न्यायी
  rationale: यह न्याय करने वाले पदाधिकारियों को सूचित करता है; ‘न्यायी’ मूल संज्ञा के निकट और इस प्राचीन न्यायिक प्रसंग के अनुकूल है।
- source_word: ἐπέθηκαν
  choice: रखे
  rationale: हाथों के साथ प्रयुक्त इस क्रिया का सीधा अर्थ ‘रखना’ है; इससे क्रिया का ठोस स्वरूप बना रहता है और अनावश्यक धार्मिक अर्थ नहीं जुड़ता।
- source_word: τὰς χεῖρας αὐτῶν
  choice: अपने हाथ
  rationale: कर्ता की ओर लौटता हुआ स्वामित्व आधुनिक हिन्दी में ‘अपने हाथ’ से स्वाभाविक और स्पष्ट व्यक्त होता है।
- source_word: ἐπὶ τῆς κεφαλῆς αὐτῆς
  choice: उसके सिर पर
  rationale: यह मूल यूनानी का सीधा स्थानवाचक अर्थ है और आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: सिर पर हाथ रखने की क्रिया को अनुष्ठानिक या संस्कारात्मक अर्थ देना
  choice: 'न्यायिक कार्यवाही में एक प्रत्यक्ष शारीरिक संकेत: ‘उसके सिर पर अपने हाथ रखे’'
  alternative: ‘उसके सिर पर हाथ धर दिए’, जिसे कुछ पाठक धार्मिक ‘हाथ रखने’ की पारिभाषिक अभिव्यक्ति समझ सकते हैं
  rationale: यूनानी पाठ कानूनी कार्यवाही के भीतर एक ठोस क्रिया बताता है। अनुवाद उस संकेत को सुरक्षित रखता है, पर बाद की कलीसियाई प्रथाओं से जुड़े अर्थ उसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल मानक हिन्दी। ‘प्राचीन’ और ‘न्यायी’ प्रसंग की औपचारिक न्यायिक भूमिका बनाए रखते हैं; वाक्य-रचना सहज कथात्मक है।
