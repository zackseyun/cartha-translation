  yaml_path: translation/deuterocanon/susanna/001/056.yaml
  text: And after removing him[a], he ordered the other one to be brought forward. And he said to him, “Offspring of Canaan and not Judah, beauty has deceived you[b], and desire has corrupted your heart.”
translation:
  language: hi
  text: फिर उसे अलग हटाकर[a], उसने दूसरे को सामने लाने की आज्ञा दी। उसने उससे कहा, “तू कनान की संतान है, यहूदा की नहीं! सुंदरता ने तुझे धोखा दिया है, और लालसा ने तेरे हृदय को बिगाड़ दिया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे अलग करके।”
    reason: क्रिया पहले व्यक्ति को दूसरे से अलग करने या वहाँ से हटाने—दोनों प्रकार से व्यक्त की जा सकती है।
  - marker: b
    text: या, “वासना ने तेरे हृदय को भ्रष्ट कर दिया है।”
    reason: यह विकल्प ἐπιθυμία के प्रसंगगत यौन भाव और διαστρέφω के नैतिक भ्रष्टता वाले अर्थ को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: μεταστήσας αὐτὸν
  choice: उसे अलग हटाकर
  rationale: यह पदबंध पहले प्राचीन को दूसरे से अलग करने की न्यायिक प्रक्रिया बताता है। यह अनुवाद स्थान के विषय में अनावश्यक विवरण जोड़े बिना अलग किए जाने का भाव रखता है।
- source_word: ἐκέλευσεν προσαγαγεῖν τὸν ἕτερον
  choice: उसने दूसरे को सामने लाने की आज्ञा दी
  rationale: प्रयोग दूसरे व्यक्ति को पूछताछ के लिए उपस्थित कराने की आज्ञा को व्यक्त करता है; ‘सामने लाने’ से न्यायिक प्रसंग स्वाभाविक रूप से स्पष्ट होता है।
- source_word: Σπέρμα Χανάαν καὶ οὐκ Ἰούδα
  choice: कनान की संतान, यहूदा की नहीं
  rationale: ‘संतान’ σπέρμα के वंशगत रूपक और तीखी प्रत्यक्ष निंदा को स्वाभाविक हिन्दी में बनाए रखता है; इसे केवल व्यवहारगत तुलना बनाकर नरम नहीं किया गया।
- source_word: τὸ κάλλος ἐξηπάτησέν σε
  choice: सुंदरता ने तुझे धोखा दिया है
  rationale: κάλλος का सीधा अर्थ सुंदरता है और ἐξαπατάω छल या धोखा देने को व्यक्त करता है। प्रसंग आकर्षण का संकेत देता है, इसलिए अतिरिक्त व्याख्या आवश्यक नहीं।
- source_word: ἐπιθυμία
  choice: अभिलाषा
  rationale: यह शब्द इच्छा या लालसा की व्यापकता बनाए रखता है, जबकि प्रसंग उसके अनुचित यौन स्वरूप को स्पष्ट करता है; ‘वासना’ अधिक व्याख्यात्मक विकल्प है।
- source_word: διέστρεψεν τὴν καρδίαν σου
  choice: तेरे हृदय को विकृत कर दिया है
  rationale: ‘विकृत’ मूल क्रिया में निहित टेढ़ा करने और नैतिक बिगाड़—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘कनान की संतान, यहूदा की नहीं’ में वंशगत निंदा का स्वर
  choice: वंश-संबंधी रूपक को प्रत्यक्ष और अक्षुण्ण रखा गया है।
  alternative: ‘तू कनानी के समान है, यहूदी के समान नहीं’ जैसे व्यवहारगत अर्थ में परिभाषित करना।
  rationale: यूनानी पाठ व्यक्ति के आचरण की केवल तुलना नहीं करता, बल्कि वंश की भाषा में तीखी निंदा करता है। शाब्दिक रूपक पाठ के वाचिक और वाचा-संबंधी तनाव को सुरक्षित रखता है।
- issue: ἐπιθυμία का नैतिक अर्थ
  choice: मुख्य पाठ में ‘अभिलाषा’।
  alternative: ‘वासना’।
  rationale: प्रसंग अनुचित यौन इच्छा को स्पष्ट करता है, पर मूल शब्द अपने आप में अधिक व्यापक है। मुख्य पाठ उसकी शब्दार्थगत व्यापकता रखता है और पादटिप्पणी अधिक स्पष्ट विकल्प देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। प्रत्यक्ष तीखी फटकार में ‘तुझे/तेरे’ का प्रयोग संबोधन की कठोरता को स्वाभाविक रूप से रखता है। वाक्य-रचना न्यायिक पूछताछ के प्रसंग के अनुकूल है।
