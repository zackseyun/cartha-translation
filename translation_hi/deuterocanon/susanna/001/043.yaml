base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/043.yaml
  text: You know that they testified falsely against me; and behold[a], I am dying, having done none of the things that these men wickedly contrived against me.
translation:
  language: hi
  text: तू जानता है कि उन्होंने मेरे विरुद्ध झूठी गवाही दी है; और देखो[a], मैं मर रही हूँ, बिना उन बातों में से कुछ भी किए जिनकी इन लोगों ने दुर्भावना से मेरे विरुद्ध योजना बनाई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘...कुछ भी किए बिना जो इन लोगों ने मेरे विरुद्ध रचा है।’ यूनानी क्रिया दुर्भावनापूर्ण षड्यंत्र करने या सुसन्ना के विरुद्ध दुष्टतापूर्वक कार्य करने का भाव रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασαι
  choice: तू जानता है
  rationale: यह परमेश्वर से सीधा संबोधन है; क्रिया स्पष्ट ज्ञान या अवगत होने का बोध देती है। हिंदी में परमेश्वर के लिए एकवचन निकट संबोधन मूल यूनानी के एकवचन को सुरक्षित रखता है।
- source_word: ψευδῆ ... κατεμαρτύρησαν
  choice: उन्होंने मेरे विरुद्ध झूठी गवाही दी है
  rationale: καταμαρτυρέω न्यायिक संदर्भ में किसी के विरुद्ध गवाही देने का अर्थ रखता है, और ψευδῆ उस गवाही को झूठा बताता है।
- source_word: ἰδοὺ
  choice: देख
  rationale: यह ध्यान खींचने वाला उद्गार है और सुसन्ना की आसन्न मृत्यु की तात्कालिकता व्यक्त करता है; आधुनिक हिंदी में ‘देख’ स्वाभाविक और सीधा है।
- source_word: ἀποθνῄσκω
  choice: मैं मर रही हूँ
  rationale: वर्तमान काल संदर्भ में आसन्न या घटित होती मृत्यु को व्यक्त करता है; स्त्री वक्ता के अनुसार स्त्रीलिंग रूप रखा गया है।
- source_word: μὴ ποιήσασα μηδὲν ὧν
  choice: जबकि मैंने उन बातों में से कुछ भी नहीं किया
  rationale: नकारात्मक कृदंत आरोपित कार्यों को करने से पूर्ण इनकार करता है। ‘जबकि’ संदर्भगत विरोध को स्वाभाविक हिंदी में व्यक्त करता है, यद्यपि यूनानी कृदंत स्वयं संबंध को संक्षेप में छोड़ता है।
- source_word: ἐπονηρεύσαντο κατ᾽ ἐμοῦ
  choice: जिन्हें इन लोगों ने दुष्टता से मेरे विरुद्ध गढ़ा है
  rationale: क्रिया में दुष्ट आचरण या दुर्भावनापूर्ण षड्यंत्र का नैतिक रंग है; आरोपों के न्यायिक संदर्भ में ‘गढ़ा’ मनगढ़ंत योजना या आरोप का भाव देता है, जबकि ‘दुष्टता से’ नैतिक बल बनाए रखता है।
theological_decisions:
- issue: μὴ ποιήσασα वाले कृदंतीय वाक्यांश का संबंध
  choice: जबकि मैंने ... कुछ भी नहीं किया
  alternative: '... कुछ भी किए बिना मैं मर रही हूँ'
  rationale: यूनानी कृदंत सुसन्ना की निर्दोषता को उसके मरने के साथ रखता है, पर उसका तार्किक संबंध पूरी तरह निर्दिष्ट नहीं करता। ‘जबकि’ विरोध को स्पष्ट करता है, बिना किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष के।
- issue: ἐπονηρεύσαντο का आशय
  choice: दुष्टता से ... गढ़ा
  alternative: मेरे विरुद्ध षड्यंत्र रचा
  rationale: चयन दुष्टता के नैतिक भाव और झूठे आरोप गढ़ने के प्रसंग—दोनों को सुरक्षित रखता है। केवल ‘षड्यंत्र रचा’ कहने से आरोपित ‘बातों’ को वास्तविक कार्य समझे जाने की अस्पष्टता बढ़ सकती थी।
- issue: οὗτοι का अनुवाद
  choice: इन लोगों
  alternative: इन्होंने
  rationale: संकेतवाचक शब्द प्रसंग के आरोपियों की ओर इशारा करता है। ‘इन लोगों’ मूल के संकेतात्मक बल को स्वाभाविक हिंदी में बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। न्यायिक शब्दावली के लिए ‘झूठी गवाही’ रखा गया है। परमेश्वर को संबोधित मूल यूनानी एकवचन के अनुरूप ‘तू’ प्रयुक्त है; वाक्य में कोई पादटिप्पणी आवश्यक नहीं समझी गई।
