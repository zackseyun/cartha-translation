    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: अब
  rationale: यह पदबंध पूछताछ में तत्काल और निष्कर्षसूचक अगले प्रश्न की ओर ले जाता है। हिन्दी में “अब” प्रसंग के भीतर दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λέγε μοι
  choice: मुझे बताओ
  rationale: यह सीधे उत्तर की माँग करने वाली आज्ञा है; “मुझे बताओ” आधुनिक हिन्दी में स्वाभाविक और अर्थानुरूप है।
- source_word: Ὑπὸ τί δένδρον
  choice: किस पेड़ के नीचे
  rationale: यह उस विशेष पेड़ की पहचान पूछता है जिसके नीचे कथित घटना हुई थी।
- source_word: κατέλαβες
  choice: पकड़ा था
  rationale: न्यायिक प्रसंग में क्रिया का आशय किसी को कोई काम करते हुए पकड़ने से है, न कि केवल शारीरिक रूप से धर लेने से।
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: आपस में बात करते
  rationale: कृदंत और पारस्परिक सर्वनाम दोनों व्यक्तियों के एक-दूसरे से बातचीत करने का भाव देते हैं; यह अनुवाद उसी अर्थ को सहज हिन्दी में रखता है।
- source_word: πρῖνον
  choice: सदाबहार बलूत
  rationale: यूनानी शब्द बलूत की एक विशिष्ट सदाबहार जाति, अर्थात होल्म ओक, को सूचित करता है। पूछताछ में पेड़ की ठीक पहचान महत्त्वपूर्ण होने के कारण मुख्य पाठ में विशिष्ट अर्थ रखा गया है।
