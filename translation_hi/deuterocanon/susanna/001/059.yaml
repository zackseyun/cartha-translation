  yaml_path: translation/deuterocanon/susanna/001/059.yaml
  text: Then Daniel said to him[a], “You also have lied rightly against your own head; for the angel of God stands by, holding the sword to split you in two, so that he may destroy you.”
translation:
  language: hi
  text: तब दानिय्येल ने उससे कहा, “तुमने भी ठीक ही झूठ बोला है—अपने ही सिर पर! क्योंकि परमेश्वर का दूत तुम्हें बीच से चीर डालने के लिए तलवार लिए खड़ा है, ताकि वह तुम दोनों[a] का सर्वनाश कर दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी में ‘तुम दोनों’ बहुवचन है; विनाश की चेतावनी केवल उस वृद्ध के लिए नहीं है जिससे दानिय्येल इस समय बोल रहा है, बल्कि दोनों वृद्धों के लिए है।
    reason: मूल पाठ में एकवचन से बहुवचन की ओर महत्त्वपूर्ण परिवर्तन को स्पष्ट करना।
lexical_decisions:
- source_word: Ὀρθῶς ἔψευσαι
  choice: तुमने भी ठीक ही झूठ बोला है
  rationale: '‘ठीक ही’ मूल के तीखे व्यंग्य को बनाए रखता है: झूठ ऐसा है जो बोलने वाले पर ही उचित दण्ड ले आता है।'
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: अपने ही सिर पर
  rationale: यह स्वाभाविक हिन्दी मुहावरा मूल की ठोस छवि और अपने ऊपर परिणाम लाने का भाव, दोनों सुरक्षित रखता है।
- source_word: μένει
  choice: खड़ा है
  rationale: यहाँ क्रिया दूत के उपस्थित रहकर आसन्न कार्रवाई के लिए खड़े होने को व्यक्त करती है; अनावश्यक रूप से ‘प्रतीक्षा’ का भाव जोड़ने से बचा गया है।
- source_word: τὴν ῥομφαίαν ἔχων
  choice: तलवार लिए
  rationale: यह हथियार धारण करने की सजीव छवि को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: πρίσαι σε μέσον
  choice: तुम्हें बीच से चीर डाले
  rationale: πρίζω का मूल भाव आरी से काटना है; ‘बीच से चीर डाले’ विभाजन की हिंसक छवि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξολεθρεύσῃ
  choice: सर्वनाश कर दे
  rationale: यह पूर्ण विनाश बताने वाली यूनानी क्रिया की प्रबलता को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὑμᾶς
  choice: तुम दोनों
  rationale: बहुवचन सर्वनाम को स्पष्ट रूप से व्यक्त किया गया है, जिससे एक वृद्ध को किए जा रहे एकवचन सम्बोधन से दोनों दोषी वृद्धों पर आने वाले विनाश की ओर हुआ परिवर्तन सुरक्षित रहता है।
theological_decisions:
- issue: अन्तिम सर्वनाम ὑμᾶς के बहुवचन का दायरा
  choice: मुख्य पाठ में ‘तुम दोनों’
  alternative: केवल ‘तुम’, और बहुवचन को पादटिप्पणी में बताना
  rationale: यूनानी पाठ पहले उपस्थित वृद्ध को एकवचन में सम्बोधित करता है, फिर अन्त में बहुवचन द्वारा दण्ड को दोनों वृद्धों तक विस्तृत करता है। हिन्दी में ‘तुम’ संख्या की दृष्टि से अस्पष्ट हो सकता है, इसलिए ‘तुम दोनों’ मूल के अर्थगत परिवर्तन को स्पष्टतः सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष न्यायिक स्वर रखा गया है। ‘ठीक ही झूठ बोला’ जानबूझकर व्यंग्यात्मक है, और एकवचन ‘तुम्हें’ से बहुवचन ‘तुम दोनों’ की ओर मूल पाठ का परिवर्तन सुरक्षित रखा गया है।
