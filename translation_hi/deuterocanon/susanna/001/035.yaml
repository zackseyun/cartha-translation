translation:
  language: hi
  text: पर रोते हुए उसने स्वर्ग की ओर दृष्टि उठाई, क्योंकि उसका हृदय प्रभु पर भरोसा रखता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίουσα
  choice: रोती हुई
  rationale: वर्तमान कृदंत सुसन्ना के लगातार रोने की अवस्था व्यक्त करता है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἀνέβλεψεν
  choice: ऊपर की ओर देखने लगी
  rationale: क्रिया का अर्थ ऊपर देखना है; स्वर्ग के साथ यह प्रयोग सहज रूप से उसकी दृष्टि ऊपर उठाने को व्यक्त करता है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर
  rationale: प्रार्थना और प्रभु पर भरोसे के संदर्भ में ‘स्वर्ग’ केवल भौतिक आकाश की अपेक्षा धार्मिक आशय को बेहतर बनाए रखता है।
- source_word: καρδία
  choice: हृदय
  rationale: यह भीतरी मनुष्य, विश्वास और संकल्प का मानक तथा गरिमापूर्ण हिन्दी रूप है।
- source_word: πεποιθυῖα
  choice: भरोसा रखता था
  rationale: परिपूर्ण कृदंत पहले स्थापित और अब भी बनी हुई भरोसे की अवस्था बताता है; हिन्दी में यह रूप उस स्थिर अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπὶ Κυρίῳ
  choice: प्रभु पर
  rationale: भरोसा रखने के साथ हिन्दी में ‘पर’ स्वाभाविक है और भरोसे के आधार अथवा आश्रय को सुरक्षित रखता है।
theological_decisions:
- issue: धार्मिक भरोसे के संदर्भ में Κυρίῳ का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: तात्कालिक यूनानी पाठ में विशिष्ट इब्रानी ईश-नाम नहीं है; इसलिए बिना ईश-नाम आयात किए κύριος का सामान्य और गरिमापूर्ण रूप ‘प्रभु’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण कथात्मक शैली। ‘उसका हृदय’ के कारण व्याकरणिक क्रिया पुल्लिंग ‘रखता था’ है, जबकि आशय सुसन्ना की आंतरिक भरोसे की अवस्था है।
