  text: They twisted their minds and turned away their eyes so as not to look to heaven or remember righteous judgments[a][b].
translation:
  language: hi
  text: उन्होंने अपनी बुद्धि को विकृत कर लिया और अपनी आँखें फेर लीं, ताकि वे स्वर्ग की ओर न देखें और धर्मी न्यायों को स्मरण न करें।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी बुद्धि को भ्रष्ट कर लिया।” यूनानी क्रिया में विकृति के साथ नैतिक भ्रष्टता का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “धर्मी न्यायों” का अनुवाद “न्यायपूर्ण निर्णयों” भी हो सकता है। यह पद सम्भवतः परमेश्वर के न्यायपूर्ण कार्यों या मानदंडों की ओर संकेत करता है, पर यूनानी में अधिकारसूचक शब्द स्पष्ट रूप से नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διέστρεψαν
  choice: विकृत कर लिया
  rationale: क्रिया किसी वस्तु को उसकी उचित दशा से मोड़ने और नैतिक रूप से भ्रष्ट करने, दोनों का भाव रखती है। ‘विकृत कर लिया’ इस आत्मप्रेरित नैतिक बिगाड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν νοῦν αὐτῶν
  choice: अपनी बुद्धि
  rationale: νοῦς यहाँ विचार, समझ और नैतिक विवेक की भीतरी क्षमता को सूचित करता है। ‘बुद्धि’ इस अर्थ-परास को संक्षेप में रखती है।
- source_word: ἐξέκλιναν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: अपनी आँखें फेर लीं
  rationale: यह जान-बूझकर आँखें दूसरी ओर कर लेने का ठोस चित्र प्रस्तुत करता है; ‘आँखें फेर लीं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοῦ μὴ βλέπειν εἰς τὸν οὐρανόν
  choice: ताकि वे स्वर्ग की ओर न देखें
  rationale: μή के साथ संबंधसूचक infinitive उद्देश्य अथवा परिणाम बता सकता है। ‘ताकि’ जान-बूझकर किए गए परिहार को स्पष्ट करता है, जबकि सम्भावित अर्थगत तनाव बना रहता है।
- source_word: μνημονεύειν
  choice: स्मरण करें
  rationale: क्रिया का अर्थ याद करना या मन में बनाए रखना है। ‘स्मरण करना’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी दोनों के अनुकूल है।
- source_word: κριμάτων δικαίων
  choice: धर्मी न्यायों
  rationale: κρίματα न्यायिक निर्णयों, न्याय के कार्यों या विधानों को सूचित कर सकता है, और δικαίων उनके न्यायोचित अथवा धर्मसंगत होने पर बल देता है। ‘धर्मी न्याय’ इस व्यापकता को बिना परमेश्वर-संबंधी अधिकारसूचक शब्द जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: ‘स्वर्ग’ और ‘धर्मी न्यायों’ का अभिप्रेत संबंध
  choice: मूल के अनुसार ‘स्वर्ग की ओर’ और ‘धर्मी न्यायों’ कहा गया है, परमेश्वर का नाम या ‘उसके’ नहीं जोड़ा गया।
  alternative: ‘परमेश्वर की ओर देखें’ अथवा ‘परमेश्वर के धर्मी न्यायों को स्मरण करें।’
  rationale: संदर्भ परमेश्वर की ओर संकेत करता है, पर यूनानी पाठ में यहाँ न तो परमेश्वर का नाम है, न स्पष्ट अधिकारसूचक सर्वनाम। अनुवाद निहित धर्मवैज्ञानिक संबंध को स्पष्ट करके मूल की अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘बुद्धि,’ ‘स्वर्ग,’ ‘स्मरण’ और ‘धर्मी न्याय’ जैसे शब्द बाइबलीय लहजा बनाए रखते हैं, पर वाक्यरचना वर्तमान हिन्दी के अनुरूप है।
