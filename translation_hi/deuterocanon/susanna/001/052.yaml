base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/052.yaml
  text: But when they had been separated[a], one from the other, he called one of them and said to him, “You who have grown old in evil days[b], now the sins that you were doing before have come upon you.”
translation:
  language: hi
  text: जब उन दोनों को एक-दूसरे से अलग कर दिया गया, तब उसने उनमें से एक को बुलाकर उससे कहा, “हे मनुष्य, जो बुरे दिनों में बूढ़ा हो चुका है,[a] अब तुम्हारे वे पाप तुम पर आ पहुँचे हैं, जिन्हें तुम पहले किया करते थे।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस संक्षिप्त यूनानी सम्बोधन का अनुवाद ‘हे बूढ़े, जो बुराई में बूढ़ा हो गया है’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ उपलब्ध यूनानी पाठ पद के अंत में अधूरे τὸ पर रुकता है; वाक्य सम्भवतः अगले पद के πρότερον के साथ मिलकर ‘पहले’ या ‘पूर्वकाल में’ का अर्थ देता है।
    reason: textual_variant
lexical_decisions:
- source_word: διεχωρίσθησαν
  choice: अलग कर दिया गया
  rationale: यह διαχωρίζω का अओरिस्ट कर्मवाच्य रूप है। प्रसंग में दोनों प्राचीनों को अलग-अलग पूछताछ के लिए एक-दूसरे से अलग किया गया है।
- source_word: εἷς ἀπὸ τοῦ ἑνός
  choice: एक-दूसरे से
  rationale: यूनानी की एकवचनात्मक अभिव्यक्ति दोनों व्यक्तियों को परस्पर अलग किए जाने पर बल देती है; आधुनिक हिन्दी में ‘एक-दूसरे से’ इसका स्वाभाविक रूप है।
- source_word: ἐκάλεσεν τὸν ἕνα αὐτῶν
  choice: उसने उनमें से एक को बुलाकर
  rationale: ἐκάλεσεν का सामान्य अर्थ ‘बुलाया’ है। कृदन्तीय हिन्दी रचना अगले कथन से इसे सहजता से जोड़ती है।
- source_word: Πεπαιλαιωμένε ἡμερῶν κακῶν
  choice: हे बुरे दिनों में बूढ़े हुए मनुष्य
  rationale: सम्बोधन में आए पूर्ण कृदन्त की ‘बूढ़े हो चुके’ वाली शक्ति और ἡμερῶν κακῶν के ‘बुरे दिनों’ दोनों को बनाए रखा गया है। वाक्यांश की संक्षिप्तता और निन्दात्मक स्वर को पूरी तरह एक ही अर्थ में सीमित नहीं किया गया।
- source_word: νῦν ἥκασιν αἱ ἁμαρτίαι σου
  choice: अब तुम्हारे वे पाप तुम पर आ पहुँचे हैं
  rationale: ἥκασιν के ‘आ पहुँचना’ रूपक को बनाए रखते हुए न्याय में पुराने पापों के सामने आ जाने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἃς ἐποίεις
  choice: जिन्हें तुम ... किया करते थे
  rationale: अपूर्ण भूतकाल बार-बार या लगातार किए गए पुराने कर्मों का संकेत देता है; ‘किया करते थे’ उस पक्ष को स्पष्ट रखता है।
- source_word: τὸ [πρότερον]
  choice: पहले
  rationale: उपलब्ध पाठ इस पद के अंत में केवल τὸ पर रुकता है, पर वाक्य अगले पद में सम्भवतः τὸ πρότερον के रूप में पूरा होता है। ‘पहले’ उस प्रबल सम्भावित अर्थ को संक्षेप में देता है और पाठगत स्थिति पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: प्राचीन को दानिय्येल के सम्बोधन का नैतिक स्वर
  choice: सम्बोधन को दीर्घकालीन बुराई पर कठोर फटकार के रूप में रखा गया है, पर ‘बुरे दिनों’ को मूल पाठ के अनुसार बनाए रखा गया है।
  alternative: ‘हे बुराई में बूढ़े हो चुके मनुष्य’ या अपेक्षाकृत तटस्थ ‘हे बुरे दिनों के बूढ़े मनुष्य।’
  rationale: न्यायिक प्रसंग और κακῶν निन्दा का स्वर देते हैं, किन्तु ἡμερῶν को हटाकर बुराई को केवल व्यक्ति के चरित्र का सीधा वर्णन बना देना मूल की वास्तविक संक्षिप्तता और सम्भावित द्व्यर्थता को सीमित कर देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी रखी गई है। न्यायिक फटकार को स्पष्ट किया गया है, पर यूनानी सम्बोधन की संक्षिप्तता और अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
