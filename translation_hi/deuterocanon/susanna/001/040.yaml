  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आरोप लगाने वालों की प्रत्यक्ष वाणी और न्यायिक स्वर सुरक्षित हैं।
