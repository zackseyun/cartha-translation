base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/040.yaml
  text: After seizing her[a], we questioned her, ‘Who was the man?’ But she did not tell us who he was. These things we testify.
translation:
  language: hi
  text: उसे पकड़कर हमने उससे पूछा, “वह आदमी कौन था?” लेकिन उसने हमें नहीं बताया कि वह कौन था। हम इन बातों की गवाही देते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: पकड़कर
  rationale: यह क्रिया यहाँ शारीरिक रूप से किसी को पकड़ लेने का भाव देती है। ‘पकड़कर’ सहज हिन्दी है और मूल की शक्ति बनाए रखती है।
- source_word: ἐπηρώτωμεν
  choice: हमने उससे पूछा
  rationale: न्यायिक प्रसंग में यह पूछताछ को व्यक्त करता है, पर ‘पूछताछ की’ या ‘जिरह की’ से अधिक अर्थ आरोपित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: Τίς ὁ ἄνθρωπος;
  choice: वह आदमी कौन था?
  rationale: प्रश्न कथित पुरुष की पहचान के विषय में है। ‘वह आदमी’ यूनानी निश्चित उपपद का स्वाभाविक हिन्दी रूप है और भूतकाल कथात्मक प्रसंग के अनुकूल है।
- source_word: οὐκ ἀπήγγειλεν ἡμῖν
  choice: उसने हमें नहीं बताया
  rationale: यहाँ क्रिया का अर्थ पहचान बताना है; ‘नहीं बताया’ स्पष्ट और सहज है।
- source_word: τίς ἦν
  choice: कि वह कौन था
  rationale: वाक्यांश व्यक्ति की पहचान बताता है, उसके चरित्र या प्रकार को नहीं।
- source_word: ταῦτα μαρτυροῦμεν
  choice: हम इन बातों की गवाही देते हैं
  rationale: ‘गवाही देते हैं’ मूल के न्यायिक और साक्ष्यात्मक भाव को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: बुज़ुर्गों के आरोप की न्यायिक भाषा
  choice: अंतिम वाक्य में स्पष्ट गवाही-संबंधी भाषा रखना
  alternative: ‘यही हमारी गवाही है’ जैसे अधिक प्रवाहपूर्ण रूप का प्रयोग करना
  rationale: यह कथन न्यायिक आरोप का हिस्सा है। ‘गवाही देते हैं’ कानूनी-साक्ष्यात्मक बल को बनाए रखता है और प्रसंग को साधारण वर्णन में नहीं बदलता।
