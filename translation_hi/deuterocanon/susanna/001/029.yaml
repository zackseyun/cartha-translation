base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/029.yaml
  text: And it happened on the next day[a], when the people had gathered to her husband Joakim, that the two elders came, full of their lawless intent against Susanna to put her to death, and they said before the people, “Send for Susanna daughter of Hilkiah, who is the wife of Joakim.”
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि जब लोग उसके पति योआकीम के पास इकट्ठे हुए, तब वे दोनों बुज़ुर्ग सुसन्ना के विरुद्ध उसे मार डालने की अधर्मपूर्ण मंशा[a] से भरे हुए आए। उन्होंने लोगों के सामने कहा, “हिल्कियाह की बेटी सुसन्ना को, जो योआकीम की पत्नी है, बुलाने के लिए किसी को भेजो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विधि-विरुद्ध योजना” या “अवैध अभिप्राय।” यूनानी शब्द भीतर की ऐसी योजना या मंशा पर बल देता है जो व्यवस्था के विरुद्ध है।
    reason: यूनानी ἀνόμου ἐννοίας के लिए एक निकट वैकल्पिक अनुवाद देता है और चिह्न को इसी पद के साथ रखता है।
lexical_decisions:
- source_word: τῇ ἐπαύριον
  choice: अगले दिन
  rationale: यह सहज आधुनिक हिन्दी में कथा के अगले दिन का स्पष्ट संकेत देता है।
- source_word: συνῆλθεν ὁ λαὸς πρὸς τὸν ἄνδρα αὐτῆς Ἰωακείμ
  choice: लोग उसके पति योआकीम के यहाँ इकट्ठे हुए
  rationale: πρός का व्यक्ति की ओर या उसके स्थान पर एकत्र होने का भाव ‘के यहाँ’ से स्वाभाविक हिन्दी में व्यक्त होता है; ἄνδρα αὐτῆς वैवाहिक अर्थ में ‘उसके पति’ है।
- source_word: οἱ δύο πρεσβῦται
  choice: वे दोनों पुरनिये
  rationale: सन्दर्भ में ये केवल वृद्ध पुरुष नहीं, बल्कि सामुदायिक और न्यायिक अधिकार रखनेवाले व्यक्ति हैं; ‘पुरनिये’ इस पदगत भूमिका को सुरक्षित रखता है।
- source_word: πλήρεις τῆς ἀνόμου ἐννοίας
  choice: अपनी अधर्मपूर्ण मंशा से भरे हुए
  rationale: ἐννοία भीतरी विचार, योजना या मंशा को और ἄνομος व्यवस्था-विरोधी अथवा अधर्मपूर्ण चरित्र को व्यक्त करता है।
- source_word: κατὰ Σουσάννης
  choice: सूसन्ना के विरुद्ध
  rationale: κατά के साथ सम्बन्धकारक यहाँ प्रतिकूल दिशा दिखाता है; उनकी मंशा सूसन्ना के विरुद्ध थी।
- source_word: τοῦ θανατῶσαι αὐτήν
  choice: ताकि उसे मृत्यु-दण्ड दिलाएँ
  rationale: सप्रत्यय क्रियारूप उद्देश्य व्यक्त करता है। न्यायिक प्रसंग में यह केवल निजी हत्या नहीं, उसे दोषी ठहराकर मृत्यु तक पहुँचाने की मंशा है; हिन्दी का प्रेरणार्थक रूप उनकी न्यायिक चाल को व्यक्त करता है।
- source_word: Ἀποστείλατε ἐπὶ Σουσάνναν
  choice: सूसन्ना को ... बुलवा भेजो
  rationale: यूनानी मुहावरा किसी को भेजकर उसे बुलाने या लाने का आदेश देता है; ‘बुलवा भेजो’ आधुनिक हिन्दी में यही अर्थ रखता है।
- source_word: θυγατέρα Χελκίου
  choice: हिल्कियाह की बेटी
  rationale: यह पिता के नाम से औपचारिक पहचान है; Χελκίου का प्रचलित बाइबलीय हिन्दी रूप ‘हिल्कियाह’ रखा गया है।
- source_word: ἥ ἐστιν γυνὴ Ἰωακείμ
  choice: जो योआकीम की पत्नी है
  rationale: इस प्रसंग में γυνή का स्पष्ट अर्थ ‘पत्नी’ है और सम्बन्धवाचक उपवाक्य सार्वजनिक पहचान को सुरक्षित रखता है।
theological_decisions:
- issue: न्यायिक कथा में πρεσβῦται का अनुवाद
  choice: पुरनिये
  alternative: बूढ़े पुरुष / वृद्धजन
  rationale: कथा में ये समुदाय के मान्य अधिकारी और न्यायिक भूमिका निभानेवाले व्यक्ति हैं। ‘पुरनिये’ पद और आयु दोनों की सम्भावना बनाए रखता है, जबकि केवल ‘बूढ़े पुरुष’ अधिकारगत पक्ष खो देता है।
- issue: τοῦ θανατῶσαι αὐτήν में मृत्यु का आशय
  choice: उसे मृत्यु-दण्ड दिलाएँ
  alternative: उसे मार डालें / उसे मृत्यु के घाट उतारें
  rationale: मूल क्रिया का आधारभूत अर्थ मृत्यु देना है, पर सार्वजनिक अभियोग और न्यायिक अधिकार के प्रसंग में ‘मृत्यु-दण्ड दिलाएँ’ अभिप्रेत कानूनी साधन को स्वाभाविक हिन्दी में व्यक्त करता है। वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। ‘पुरनिये’ न्यायिक-सामुदायिक पद को व्यक्त करता है; ‘अधर्मपूर्ण मंशा’ मूल के कानूनी और नैतिक दोनों आयाम रखती है। सभी नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
