base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/017.yaml
  text: As with whole burnt offerings of rams and bulls[a], and as with tens of thousands of fat lambs, so let our sacrifice be before you today and make atonement before you, for there is no shame for those who have put their trust in you[b], and let it be brought to completion before you.
translation:
  language: hi
  text: जैसे मेढ़ों और साँड़ों की पूरी होमबलियों और दसियों हज़ार हृष्ट-पुष्ट मेमनों के साथ होता है, वैसे ही आज हमारा बलिदान तेरे सामने हो और तेरे सामने प्रायश्चित करे; क्योंकि तुझ पर भरोसा रख चुके लोगों को लज्जा नहीं होती, और वह तेरे सामने पूरा हो जाए[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरे सामने’ के लिए यूनानी में यहाँ और पहले भी शाब्दिक रूप से ‘तेरे पीछे’ है। प्रसंग में इसका अर्थ ‘तेरे सामने’ या ‘तेरी उपस्थिति में’ समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी का अंतिम क्रियारूप संक्षिप्त और कुछ असामान्य है। इसका सामान्य अर्थ ‘पूरा हो जाए’ है; बलिदानी प्रसंग में इसे ‘तेरे सामने स्वीकार किया जाए’ भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁλοκαυτώμασι
  choice: सर्वांग होमबलियों
  rationale: यह शब्द ऐसी बलियों को दर्शाता है जो आग में पूरी तरह जलाई जाती थीं। ‘सर्वांग होमबलि’ उस विशिष्ट बलिदानी अर्थ को बनाए रखता है।
- source_word: κριῶν καὶ ταύρων
  choice: मेढ़ों और साँड़ों
  rationale: दोनों पशुओं के लिए स्वाभाविक और यज्ञ-संदर्भ में सटीक हिन्दी शब्द चुने गए हैं।
- source_word: μυριάσιν ἀρνῶν πιόνων
  choice: दसियों हज़ार मोटे मेमनों
  rationale: μυριάσιν की विशाल संख्या और πιόνων के हृष्ट-पुष्ट अथवा मूल्यवान बलिपशु के भाव को सीधे रूप में रखा गया है।
- source_word: θυσία
  choice: बलिदान
  rationale: यहाँ सामान्य भेंट नहीं, बल्कि पशुबलियों के अनुरूप धार्मिक अर्पण का प्रसंग है।
- source_word: ἐξιλάσαι
  choice: प्रायश्चित करे
  rationale: क्रिया में पाप-निवारण अथवा ईश्वर को प्रसन्न करने का बलिदानी भाव है; ‘प्रायश्चित करे’ इस धर्मवैचारिक भार को अपेक्षाकृत स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: ὄπισθέν σου
  choice: तेरी उपस्थिति में
  rationale: शाब्दिक अर्थ ‘तेरे पीछे’ है, पर इस प्रार्थना और बलिदानी संदर्भ में वह अस्वाभाविक है। ‘तेरी उपस्थिति में’ प्रसंगगत दिशा को व्यक्त करता है, जबकि शाब्दिक कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: τοῖς πεποιθόσιν ἐπὶ σοί
  choice: तुझ पर भरोसा रख चुके लोगों
  rationale: पूर्णकालिक कृदन्त किसी बीते निर्णय से बनी हुई वर्तमान भरोसे की दशा को दर्शाता है।
- source_word: τελειῶσαι
  choice: पूर्ण किया जाए
  rationale: क्रिया किसी वस्तु को उसके अभिप्रेत परिणाम या पूर्णता तक पहुँचाने का भाव देती है; संक्षिप्त यूनानी वाक्यरचना के कारण हिन्दी में कर्मवाच्य रखा गया है।
theological_decisions:
- issue: ἐξιλάσαι में प्रायश्चित अथवा स्वीकार्यता का भाव
  choice: प्रायश्चित करे
  alternative: स्वीकार किया जाए / प्रसन्न करे
  rationale: मूल क्रिया बलिदानी प्रायश्चित या शमन का अर्थ वहन कर सकती है। मुख्य पाठ में उसका धर्मवैचारिक वजन रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में बताया गया है।
- issue: दो बार आए ὄπισθέν σου का असामान्य प्रयोग
  choice: तेरी उपस्थिति में
  alternative: तेरे पीछे
  rationale: ‘तेरे पीछे’ शाब्दिक है, किंतु इस प्रार्थना में अर्थ अस्पष्ट और हिन्दी में भ्रामक होगा। प्रसंगगत अर्थ मुख्य पाठ में दिया गया है, पर मूल की असामान्यता छिपाई नहीं गई।
- issue: अंतिम τελειῶσαι का कर्ता और आशय
  choice: वह ... पूर्ण किया जाए
  alternative: हम ... सिद्ध किए जाएँ / वह स्वीकार हो
  rationale: यूनानी वाक्यरचना संक्षिप्त है और कर्ता स्पष्ट नहीं। निकटतम संज्ञा ‘हमारा बलिदान’ को संभावित कर्ता मानकर अनुवाद किया गया, जबकि दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनामय हिन्दी रखी गई है। ईश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरा’ प्रयुक्त है। बलिदानी पारिभाषिकता को सहज बनाने के लिए ‘सर्वांग होमबलि’ और ‘प्रायश्चित’ जैसे परिचित धार्मिक शब्द चुने गए हैं; मूल यूनानी की वास्तविक अस्पष्टताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
