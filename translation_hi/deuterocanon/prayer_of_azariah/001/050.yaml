  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामूहिक स्तुतिगान के अनुकूल संबोधन। ‘हे’ जोड़कर यूनानी संबोधन को हिन्दी में स्पष्ट किया गया है।
