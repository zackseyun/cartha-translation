translation:
  language: hi
  text: हे बिजलियो और बादलो, प्रभु को धन्य कहो; उसकी स्तुति करो और उसे युगानुयुग अत्यन्त ऊँचा उठाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक धार्मिक अर्थ व्यक्त करता है; सृष्टि को संबोधित बहुवचन भी प्रसंग से स्पष्ट है।
- source_word: ἀστραπαὶ
  choice: बिजलियो
  rationale: ग्रीक बहुवचन का संबोधन रूप बनाए रखता है।
- source_word: νεφέλαι
  choice: बादलो
  rationale: νεφέλη के सामान्य अर्थ ‘बादल’ को बहुवचन संबोधन में प्रस्तुत करता है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: सिर्फ सामान्य प्रशंसा नहीं, बल्कि भजन या गीत द्वारा स्तुति करने का भाव व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: सर्वोच्च मानो
  rationale: क्रिया के अत्यंत ऊँचा उठाने या सर्वोपरि ठहराने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: कालों तक निरंतरता का पारंपरिक किंतु आज भी बोधगम्य हिन्दी रूप है।
theological_decisions:
- issue: निर्जीव सृष्टि को प्रभु की स्तुति का आदेश
  choice: प्रत्यक्ष संबोधन को अक्षुण्ण रखा गया
  alternative: इसे रूपक स्पष्ट करते हुए ‘तुम प्रभु की महिमा प्रकट करो’ कहना
  rationale: मूल यूनानी में बिजली और बादलों को सीधे आज्ञार्थक संबोधन है; अनकही व्याख्या जोड़ना उचित नहीं।
- issue: ὑπερυψοῦτε का अर्थ
  choice: ‘उसे सर्वोच्च मानो’
  alternative: ‘उसे अत्यन्त ऊँचा उठाओ’
  rationale: वैकल्पिक शाब्दिक रूप हिन्दी में परमेश्वर को स्थानगत रूप से उठाने का अनपेक्षित संकेत दे सकता है; चुना हुआ रूप सर्वोच्च महिमा देने का धार्मिक भाव सुरक्षित रखता है।
