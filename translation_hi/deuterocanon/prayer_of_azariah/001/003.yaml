translation:
  language: hi
  text: हे प्रभु, हमारे पूर्वजों के परमेश्वर, आप धन्य हैं; और आपका नाम युगानुयुग स्तुति के योग्य और महिमान्वित है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: धन्य
  rationale: प्रत्यक्ष संबोधन में प्रयुक्त इस विधेय विशेषण के लिए ‘धन्य’ स्वाभाविक बाइबलीय और स्तुतिपरक भाषा है; यह इसे केवल ‘प्रशंसित’ तक सीमित नहीं करता।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: संबोधन कारक को हिन्दी में ‘हे’ के साथ व्यक्त किया गया है और κύριος के दिव्य पदनाम को ‘प्रभु’ रखा गया है।
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के परमेश्वर
  rationale: πατέρων का शाब्दिक अर्थ ‘पिताओं’ है, पर इस वाचा-संबंधी पदबंध में यह पिछली पीढ़ियों के पुरखों को सूचित करता है। आधुनिक हिन्दी में ‘हमारे पूर्वजों के परमेश्वर’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: αἰνετὸν
  choice: स्तुति के योग्य
  rationale: विशेषण का अर्थ केवल यह नहीं कि नाम की स्तुति हुई है, बल्कि वह स्तुति के योग्य है; इसलिए योग्यतासूचक रूप रखा गया है।
- source_word: δεδοξασμένον
  choice: महिमा के योग्य
  rationale: यह δοξάζω का पूर्ण निष्क्रिय कृदन्त है और ‘महिमान्वित’ सम्भव है। αἰνετόν के साथ समानांतर स्तुतिपरक हिन्दी के लिए ‘महिमा के योग्य’ चुना गया, बिना इसे केवल मानवीय सम्मान तक सीमित किए।
- source_word: τὸ ὄνομά σου
  choice: आपका नाम
  rationale: परमेश्वर की प्रकट पहचान और प्रतिष्ठा के लिए प्रयुक्त बाइबलीय नाम-भाषा को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: यूनानी मुहावरा स्थायी कालावधि व्यक्त करता है; ‘सदा’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और स्तुतिपरक समतुल्य है।
theological_decisions:
- issue: τῶν πατέρων ἡμῶν में वाचा-संबंधी पूर्वज-भाषा
  choice: हमारे पूर्वजों के परमेश्वर
  alternative: हमारे पितरों के परमेश्वर
  rationale: यूनानी में ‘पिताओं’ का पुरुषवाची रूप है, पर हिन्दी में ‘पितर’ अनावश्यक रूप से संस्कारगत या मृत पूर्वजों की धारणा जगा सकता है। ‘पूर्वज’ यहाँ वंशगत और वाचा-संबंधी आशय को अधिक स्पष्टता से संप्रेषित करता है।
- issue: καὶ αἰνετὸν καὶ δεδοξασμένον τὸ ὄνομά σου की विधेयात्मक स्तुति
  choice: आपका नाम सदा स्तुति और महिमा के योग्य है
  alternative: आपका नाम सदा स्तुत और महिमान्वित है
  rationale: यूनानी की क्रियारहित स्तुतिपरक रचना में αἰνετόν योग्यता व्यक्त करता है, जबकि δεδοξασμένον पूर्ण निष्क्रिय रूप है। सहज हिन्दी के लिए दोनों को समन्वित किया गया है; वैकल्पिक अधिक रूप-सन्निकट पाठ पादटिप्पणी में दिया गया है ताकि व्याकरणिक तनाव न छिपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के प्रत्यक्ष संबोधन में आदरसूचक ‘आप’ का प्रयोग हुआ है। वाक्य को सहज हिन्दी क्रम में रखा गया है, जबकि मूल की स्तुतिपरक समानांतरता और ‘नाम’ की धर्मवैचारिक गहराई सुरक्षित है।
