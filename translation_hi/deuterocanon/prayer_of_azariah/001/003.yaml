review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the address, divine title, and enduring temporal expression. However, it conflates the distinct predicates αἰνετόν (“worthy of praise” / “praiseworthy”) and δεδοξασμένον (perfect passive, “glorified” / “made glorious”) by rendering both as “...के योग्य.” The latter should retain its passive-resultative sense.
  naturalness: The draft is fluent and suitably reverent. “महिमान्वित” is a natural enough elevated biblical term in modern standard Hindi and better represents the Greek than “महिमा के योग्य.” “युगानुयुग” is a natural liturgical rendering of the idiom.
  terminology: “हे प्रभु” and “परमेश्वर” are appropriate. “पूर्वजों” is understandable modern Hindi for the covenantal familial expression, though it is somewhat less lexically specific than “पितरों”; it does not introduce a meaning contrary to the Greek. The revision preserves it for clarity while correcting the central predicate distinction.
  issues:
  - severity: medium
    issue: δεδοξασμένον is rendered as “महिमा के योग्य.”
    rationale: δεδοξασμένον is a perfect passive participle, denoting that the name is glorified/made glorious, not merely worthy of glory. Combining it with αἰνετόν as two expressions of worthiness obscures the Greek contrast.
  - severity: low
    issue: The existing footnote presents “स्तुत” for αἰνετόν without clarifying that the main text’s wording has merged two different Greek predicate senses.
    rationale: Once the main text is revised to preserve αἰνετόν as “स्तुति के योग्य” and δεδοξασμένον as “महिमान्वित,” the footnote is unnecessary and should be removed rather than retaining a less precise alternative.
  revised_text: हे प्रभु, हमारे पूर्वजों के परमेश्वर, आप धन्य हैं; और आपका नाम युगानुयुग स्तुति के योग्य और महिमान्वित है।
  revised_footnotes: []
