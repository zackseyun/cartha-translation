lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया परमेश्वर के विषय में आदर और प्रशंसा के वचन बोलने का आह्वान करती है। ‘धन्य कहो’ इसके पारंपरिक धार्मिक अर्थ को ‘स्तुति करो’ में मिला देने के बजाय अलग बनाए रखता है।
- source_word: δοῦλοι
  choice: दासो
  rationale: δοῦλοι सेवा करने वालों के साथ-साथ स्वामी के अधीन और उसके अधिकार में रहने वालों को भी सूचित कर सकता है। संबोधन में ‘दासो’ हिन्दी में स्वाभाविक है और ‘सेवको’ की अपेक्षा पूर्ण अधीनता का भाव अधिक सुरक्षित रखता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: इस स्तुतिगान में κύριος परमेश्वर की उपाधि है; ‘प्रभु’ इसका स्थापित और गरिमापूर्ण हिन्दी रूप है।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: ὑμνέω गीत या भजन के रूप में स्तुति करने को सूचित करता है। ‘गुणगान करो’ संगीतमय प्रशंसा का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त ऊँचा ठहराओ
  rationale: उपसर्ग सहित यह क्रिया ऊँचा उठाने या महान ठहराने के अर्थ को तीव्र करती है। ‘अत्यन्त ऊँचा ठहराओ’ उस तीव्रता को बनाए रखता है और इसे भौतिक रूप से उठाने तक सीमित नहीं करता।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: शाब्दिक रूप से ‘युगों तक’ वाला यह यूनानी मुहावरा अनन्त और निरंतर अवधि व्यक्त करता है। ‘सदा-सर्वदा’ स्तुतिगान की शैली में स्वाभाविक है।
theological_decisions:
- issue: उपासकों के संबोधन में δοῦλοι का अर्थ
  choice: दासो
  alternative: सेवको
  rationale: यहाँ शब्द प्रभु से जुड़े लोगों की सेवा और अधीनता दोनों को व्यक्त कर सकता है। मुख्य पाठ में ‘दासो’ पूर्ण संबंध और अधिकार का प्रबल भाव बनाए रखता है; ‘सेवको’ एक वास्तविक, किंतु कुछ हल्का, विकल्प है।
