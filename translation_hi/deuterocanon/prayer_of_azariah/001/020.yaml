translation:
  language: hi
  text: और अपने अद्भुत कामों[a] के अनुसार हमें छुड़ा, और अपने नाम को महिमा दे[b], हे प्रभु।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने आश्चर्यकर्मों’; यूनानी पद परमेश्वर के विस्मयकारी कार्यों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने नाम को महिमा दे’ मूल का बाइबलीय मुहावरा सुरक्षित रखता है; अधिक व्याख्यात्मक अनुवाद हो सकता है, ‘अपने नाम की महिमा करा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελοῦ
  choice: हमें छुड़ा
  rationale: ἐξαιρέω का यह आज्ञार्थक रूप प्रार्थना में बचाने या संकट से निकालने की विनती व्यक्त करता है। ‘छुड़ा’ संक्षिप्त, स्वाभाविक और उद्धारकारी हस्तक्षेप के अर्थ के निकट है।
- source_word: κατὰ τὰ θαυμάσιά σου
  choice: अपने अद्भुत कामों के अनुसार
  rationale: κατά के अनुरूपता-सूचक अर्थ को ‘के अनुसार’ से सुरक्षित रखा गया है। θαυμάσια केवल विस्मयकारी वस्तुओं की नहीं, परमेश्वर के असाधारण कार्यों की ओर संकेत कर सकता है; इसलिए ‘अद्भुत काम’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: δὸς δόξαν
  choice: महिमा दे
  rationale: मूल यूनानी की सीधी क्रिया ‘दे’ को बनाए रखा गया है। ‘महिमा कर’ अधिक सहज हो सकता है, पर वह अभिव्यक्ति को व्याख्यात्मक रूप से बदल देता।
- source_word: τῷ ὀνόματί σου
  choice: अपने नाम को
  rationale: ‘नाम’ को ‘प्रतिष्ठा’ जैसे संकुचित अर्थ में नहीं बदला गया, ताकि परमेश्वर के प्रकट नाम से जुड़ा बाइबलीय मुहावरा और उसका धर्मवैचारिक विस्तार बना रहे।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को ‘हे’ द्वारा स्पष्ट किया गया है; ‘प्रभु’ प्रार्थनापूर्ण और गरिमापूर्ण आधुनिक हिन्दी है।
theological_decisions:
- issue: परमेश्वर के ‘नाम’ को महिमा देना
  choice: अपने नाम को महिमा दे
  alternative: अपने नाम की महिमा करा
  rationale: चुना गया पाठ मूल के ‘महिमा दे’ मुहावरे को सुरक्षित रखता है और यह निर्धारित नहीं करता कि महिमा सीधे दी जा रही है या परमेश्वर के उद्धारकारी कार्य से उसके नाम की महिमा प्रकट होगी।
- issue: Κύριε का सम्बोधन
  choice: हे प्रभु
  alternative: प्रभु
  rationale: ‘हे प्रभु’ प्रार्थना में प्रत्यक्ष सम्बोधन को स्पष्ट रखता है, बिना किसी विशिष्ट सम्प्रदायगत अर्थ को जोड़े।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। एकवचन प्रत्यक्ष सम्बोधन में ‘छुड़ा’ और ‘दे’ हिन्दी बाइबल-परम्परा के अनुरूप हैं; अत्यधिक संस्कृतनिष्ठ ‘उद्धार कर’ और कम प्रचलित ‘आश्चर्यकर्म’ को मुख्य पाठ में नहीं लिया गया।
