base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/027.yaml
  text: And he made the inside of the furnace like a whistling dew-laden wind[a], and the fire did not touch them at all, nor did it distress or trouble them.
translation:
  language: hi
  text: और उसने भट्ठी के भीतर को ओस-भरी सनसनाती हवा[a] के समान कर दिया। आग ने उन्हें तनिक भी नहीं छुआ और न उन्हें पीड़ा दी, न परेशान किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ओस से भरी हवा” अथवा “ओस की आत्मा।” यूनानी शब्द πνεῦμα का अर्थ “हवा,” “श्वास” या “आत्मा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησε
  choice: कर दिया
  rationale: यहाँ क्रिया का अर्थ किसी वस्तु की दशा को वैसा बना देना है; ‘कर दिया’ यूनानी की सीधी कारणवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: τὸ μέσον τῆς καμίνου
  choice: भट्ठी के भीतर का भाग
  rationale: μέσον यहाँ भट्ठी के मध्य अथवा आंतरिक स्थान को दर्शाता है; यह चयन आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὡς πνεῦμα δρόσου
  choice: ओस-भरी ... हवा के समान
  rationale: अग्निमय भट्ठी के भौतिक दृश्य में πνεῦμα का ‘हवा’ अर्थ सर्वाधिक संगत है, जबकि δρόσου उस हवा की शीतल, ओसयुक्त प्रकृति बताता है। पादटिप्पणी अन्य वास्तविक अर्थ-संभावनाएँ सुरक्षित रखती है।
- source_word: διασυρίζον
  choice: सनसनाती
  rationale: यह शब्द हवा के आर-पार बहने और उससे उत्पन्न तीखी ध्वनि का सजीव बिंब देता है; ‘सनसनाती’ हिन्दी में गति और ध्वनि दोनों व्यक्त करता है।
- source_word: οὐχ ἥψατο αὐτῶν τὸ καθόλου
  choice: उन्हें तनिक भी नहीं छुआ
  rationale: ‘छुआ’ ἥψατο का सीधा अर्थ रखता है और ‘तनिक भी नहीं’ τὸ καθόλου से प्रबल किए गए निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλύπησεν
  choice: पीड़ा दी
  rationale: इस प्रसंग में क्रिया शारीरिक या मानसिक कष्ट पहुँचाने को दर्शाती है; ‘पीड़ा दी’ अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: παρηνώχλησεν
  choice: परेशान किया
  rationale: यह शब्द बाधा, उत्पीड़न या कष्ट पहुँचाने का भाव रखता है; ‘परेशान किया’ पहले प्रयुक्त ‘पीड़ा दी’ से अलग रहते हुए यूनानी के दोहरे निषेध को स्पष्ट करता है।
theological_decisions:
- issue: ἐποίησε के अंतर्निहित कर्ता की पहचान
  choice: कर्ता को केवल ‘उसने’ रखा गया है।
  alternative: ‘परमेश्वर ने’ या ‘स्वर्गदूत ने’ स्पष्ट रूप से जोड़ना।
  rationale: यूनानी पद में कर्ता का नाम नहीं दिया गया है। संदर्भ उसका संकेत देता है, पर अनुवाद में नाम जोड़ना पाठ की वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: चमत्कारी प्रसंग में πνεῦμα का अर्थ
  choice: ‘हवा’
  alternative: ‘श्वास’ या ‘आत्मा’
  rationale: भट्ठी के भीतर शीतलता और बहने की ध्वनि वाले इस भौतिक चित्र में ‘हवा’ सर्वाधिक संभावित है; फिर भी πνεῦμα की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘सनसनाती’ मूल के श्रव्य और गतिशील बिंब को साधारण पाठक के लिए सजीव बनाता है; वाक्य-विन्यास यूनानी के दो क्रमिक कथनों और हानि के दोहरे निषेध को बनाए रखता है।
