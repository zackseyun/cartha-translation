lexical_decisions:
- source_word: ἀνοῖξαι τὸ στόμα
  choice: अपना मुँह खोल सकते
  rationale: मूल यूनानी मुहावरे की दृश्यात्मकता बनाए रखते हुए हिन्दी में बोल पाने या बोलने का साहस होने का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: αἰσχύνη
  choice: लज्जा
  rationale: यह व्यक्ति या समुदाय पर आई शर्म और अपमानजनक दशा को सीधे व्यक्त करता है।
- source_word: ὄνειδος
  choice: निन्दा
  rationale: यह दूसरों की ओर से किए जानेवाले तिरस्कार और सार्वजनिक भर्त्सना के भाव को व्यक्त करता है तथा ‘लज्जा’ से अलग अर्थ बनाए रखता है।
- source_word: ἐγενήθη
  choice: आ पड़ी है
  rationale: शाब्दिक ‘हो गई’ के बजाय अमूर्त विपत्तियों के किसी पर आने का स्वाभाविक हिन्दी प्रयोग है और परिणामी वर्तमान दशा भी दिखाता है।
- source_word: δούλων σου
  choice: तेरे दासों
  rationale: ‘दास’ परमेश्वर के प्रति अधीनता और उससे संबंध रखने—दोनों को बनाए रखता है; आधुनिक हिन्दी के भक्तिपरक संदर्भ में यह ‘गुलाम’ से अधिक गरिमापूर्ण है, पर ‘सेवक’ की अपेक्षा मूल के बंधे हुए अधीन संबंध के निकट है।
- source_word: τῶν σεβομένων σε
  choice: तेरा आदर करनेवालों
  rationale: σεβομένων में श्रद्धापूर्ण आदर और भक्ति का भाव है; यह अनुवाद इसे केवल भय या केवल उपासना की क्रिया तक सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर के संबंध में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक; गुलाम
  rationale: ‘दास’ मूल शब्द में निहित स्वामित्व और अधीनता को सुरक्षित रखता है, फिर भी परमेश्वर को संबोधित प्रार्थना के लिए हिन्दी में स्वाभाविक और गरिमापूर्ण है। ‘सेवक’ उस बल को हल्का कर सकता है और ‘गुलाम’ आधुनिक हिन्दी में अनावश्यक रूप से कठोर या अपमानसूचक लग सकता है।
