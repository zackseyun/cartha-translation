translation:
  language: hi
  text: हे वर्षाओ और झरनो, प्रभु को धन्य कहो; उसका गुणगान करो और उसे सदा-सर्वदा अत्यन्त ऊँचा उठाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक का सृष्टि के तत्त्वों से किया गया स्तुतिपरक आह्वान है। ‘धन्य कहो’ आवर्ती उपासनात्मक पदावली को बनाए रखता है और इसे केवल सामान्य ‘प्रशंसा करो’ में नहीं मिला देता।
- source_word: ὄμβροι
  choice: वर्षा
  rationale: यह आकाश से होने वाली वर्षा या वर्षाओं को दर्शाता है। हिन्दी में जातिवाचक ‘वर्षा’ इस काव्यात्मक संबोधन में स्वाभाविक है, भले ही यूनानी रूप बहुवचन हो।
- source_word: πηγαί
  choice: सोतो
  rationale: πηγαί प्राकृतिक जलस्रोतों को सूचित करता है। संबोधन-बहुवचन ‘सोतो’ आधुनिक हिन्दी में ‘झरनो’ की अपेक्षा व्यापक अर्थ रखता है और भूमिगत अथवा फूटते जलस्रोतों को समेटता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: यह आज्ञार्थक क्रिया का कर्म है। ‘प्रभु’ इस इस्राएली स्तुति में κύριος का प्रतिष्ठित, गरिमापूर्ण और संप्रदाय-निरपेक्ष हिन्दी रूप है।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: क्रिया गीत अथवा स्तुतिगान करने का भाव रखती है। ‘गुणगान करो’ हिन्दी में संगीतमय और स्तुतिपरक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महिमा करो
  rationale: यह तीव्रतायुक्त क्रिया अत्यधिक ऊँचा उठाने या महिमान्वित करने को कहती है। ‘अत्यन्त महिमा करो’ उपासनात्मक संदर्भ में तीव्रता बचाता है और शाब्दिक पर अस्वाभाविक स्थानिक भाषा से बचता है।
- source_word: αὐτόν
  choice: उसकी
  rationale: पुल्लिंग एकवचन सर्वनाम प्रभु की ओर लौटता है। संयुक्त हिन्दी पद ‘उसकी अत्यन्त महिमा करो’ में संबंधकारक रूप स्वाभाविक वाक्य-विन्यास देता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: यह युगों तक बने रहने की कालगत अभिव्यक्ति है। ‘सदा-सर्वदा’ हिन्दी की गरिमापूर्ण उपासनात्मक पदावली है और निरंतरता का पूर्ण बल व्यक्त करती है।
theological_decisions:
- issue: इस्राएल के परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी स्रोत में κύριος है, कोई प्रत्यक्ष हिब्रू चतुरक्षरी नाम नहीं। ‘प्रभु’ स्रोत रूप और स्तुतिपरक आवर्तन को बनाए रखता है तथा अनावश्यक रूप से किसी संभावित अधःस्तर का पुनर्निर्माण नहीं करता।
- issue: निर्जीव सृष्टि को आज्ञा देने का काव्यात्मक व्यक्तिकरण
  choice: 'प्रत्यक्ष संबोधन बनाए रखा गया: ‘हे वर्षा और सोतो’'
  alternative: भावार्थ रूप में ‘वर्षा और सोते प्रभु की स्तुति करें’
  rationale: मूल में बहुवचन आज्ञार्थक और प्रत्यक्ष संबोधन है। उसे बनाए रखने से सृष्टि की सामूहिक स्तुति का धर्मवैचारिक और काव्यात्मक तनाव सुरक्षित रहता है।
