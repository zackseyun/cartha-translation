  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, गेय और उपासनात्मक शैली रखी गई है। ‘हे’ संबोधन को स्पष्ट करता है; अर्धविराम मूल की दो समानांतर आज्ञाओं को अलग करते हुए एक ही पद का प्रवाह बनाए रखता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
