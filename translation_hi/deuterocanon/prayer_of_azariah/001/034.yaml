  register: आधुनिक, गरिमापूर्ण और गीतात्मक हिन्दी अपनाई गई है। संबोधन के लिए ‘हे’ और बहुवचन ‘कार्यो’ रखा गया है; पुनरुक्त आज्ञार्थक संरचना मूल स्तुतिगान की लय को सुरक्षित रखती है।
