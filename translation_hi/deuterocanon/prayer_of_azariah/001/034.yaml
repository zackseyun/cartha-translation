  yaml_path: translation/deuterocanon/prayer_of_azariah/001/034.yaml
  text: Bless the Lord[a], all the works of the Lord; sing praise to him and highly exalt him forever.
translation:
  language: hi
  text: हे प्रभु के सब कार्यों, प्रभु को धन्य कहो; उसका स्तुतिगान करो और उसे युगानुयुग अति ऊँचा उठाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “युगों तक।” यह यूनानी मुहावरा निरंतर बनी रहने वाली स्तुति को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का यह अनुवाद यूनानी के आशीर्वादात्मक और स्तुतिपरक भाव को बनाए रखता है; सृष्टि द्वारा प्रभु को संबोधित किए जाने के संदर्भ में यह ‘आशीष दो’ से अधिक स्वाभाविक है।
- source_word: πάντα τὰ ἔργα Κυρίου
  choice: हे प्रभु के सब कार्यो
  rationale: यह पदबंध संबोधन है। ‘कार्य’ यूनानी ἔργα की व्यापकता बनाए रखता है, जिसमें प्रभु की समस्त रचनाएँ भी सम्मिलित समझी जा सकती हैं।
- source_word: Κυρίου / τὸν κύριον
  choice: प्रभु
  rationale: पहला रूप संबंधसूचक (‘प्रभु के’) और दूसरा कर्म (‘प्रभु को’) है। ‘प्रभु’ κύριος का स्वाभाविक, प्रतिष्ठित और संप्रदाय-निरपेक्ष हिन्दी रूप है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: ὑμνέω में गीत या भजन के द्वारा स्तुति करने का भाव है; ‘स्तुतिगान करो’ इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महान ठहराओ
  rationale: उपसर्ग ὑπερ- क्रिया के उत्कर्ष को तीव्र करता है। ‘अत्यन्त महान ठहराओ’ हिन्दी में आराधनात्मक भाव रखते हुए इस तीव्रता को स्पष्ट करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यूनानी मुहावरे का स्थायी और काव्यात्मक हिन्दी समतुल्य है, जो निरंतर काल की धारणा को बनाए रखता है।
theological_decisions:
- issue: यूनानी κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: पाठ में κύριος है, कोई स्पष्ट दिव्य नाम नहीं। ‘प्रभु’ यूनानी का सीधा और परंपरागत हिन्दी समतुल्य है तथा अनावश्यक रूप से किसी अंतर्निहित इब्रानी रूप का निर्णय नहीं करता।
- issue: सृष्ट प्राणियों द्वारा प्रभु को ‘धन्य’ कहने का भाव
  choice: प्रभु को धन्य कहो
  alternative: प्रभु को आशीष दो / प्रभु की स्तुति करो
  rationale: ‘धन्य कहो’ उस संभावित भ्रम से बचता है कि सृष्टि प्रभु को कोई वरदान प्रदान करती है, साथ ही εὐλογεῖτε को केवल ὑμνεῖτε के समान ‘स्तुति करो’ बनाकर दोनों क्रियाओं का भेद भी नहीं मिटाता।
