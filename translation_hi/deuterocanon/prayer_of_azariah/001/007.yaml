lexical_decisions:
- source_word: ἐντολῶν τοῦ νόμου σου
  choice: तेरी व्यवस्था की आज्ञाओं
  rationale: ἐντολαί को ‘आज्ञाएँ’ और νόμος को बाइबलीय संदर्भ में स्वाभाविक ‘व्यवस्था’ से व्यक्त किया गया है; संबंधवाचक रचना को बनाए रखा गया है।
- source_word: ὑπηκούσαμεν
