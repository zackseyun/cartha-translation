  rationale: यहाँ आज्ञाओं को सावधानी से थामे रखने और उनका अनुपालन करने का भाव है। ‘माना’ पूर्ववर्ती ‘पालन’ से अर्थगत निकटता रखते हुए अलग क्रिया की पुनरावृत्ति सुरक्षित रखता है।
- source_word: ἵνα εὖ ἡμῖν γένηται
  choice: ताकि हमारा भला हो
  rationale: उद्देश्यसूचक ἵνα और εὖ γένηται का संक्षिप्त, स्वाभाविक तथा संदर्भानुकूल अनुवाद।
