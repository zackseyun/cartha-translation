translation:
  language: hi
  text: हे चौपाए पशुओ और धरती के जंगली पशुओ, प्रभु को धन्य कहो; उसका गुणगान करो और उसे सदा-सर्वदा अत्यन्त ऊँचा उठाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का उपासना-संबंधी भाव सुरक्षित रहता है और इसे अगले ὑμνεῖτε से अलग रखा जाता है।
- source_word: τετράποδα
  choice: चौपाए पशुओ
  rationale: शाब्दिक अर्थ ‘चार पैरों वाले’ है; यह चयन आधुनिक हिन्दी में स्वाभाविक और ठोस है।
- source_word: θηρία τῆς γῆς
  choice: धरती के वन-पशुओ
  rationale: θηρία प्रायः वन्य या असंयमित पशुओं को सूचित करता है; ‘वन-पशु’ चौपाए पशुओं के साथ काव्यात्मक समानांतरता बनाए रखता है, जबकि τῆς γῆς को ‘धरती के’ के रूप में सुरक्षित रखता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: यह परमेश्वर के लिए प्रयुक्त κύριος का स्वाभाविक, प्रतिष्ठित हिन्दी रूप है।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: यह केवल सामान्य प्रशंसा नहीं, बल्कि स्तुतिगान का भाव व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: ὑπερυψοῦτε
  choice: अत्यंत महान ठहराओ
  rationale: संयुक्त क्रिया में निहित तीव्रता को ‘अत्यंत’ व्यक्त करता है; ‘महान ठहराओ’ हिन्दी में परमेश्वर को अत्यधिक ऊँचा मानने और घोषित करने का स्वाभाविक रूप है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: इस आवर्ती स्तुतिपरक सूत्र में अनंत काल की अवधि को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर को संबोधित κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
