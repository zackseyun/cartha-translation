lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया सृष्टि को प्रभु के विषय में भला कहने और उसकी प्रशंसा करने के लिए बुलाती है। ‘धन्य कहो’ गीत की उपासना-संबंधी पुनरावृत्ति और मूल अर्थ दोनों को बनाए रखता है।
- source_word: πάχναι
  choice: पाले
  rationale: यह शब्द पाले, विशेषकर सफेद जमे हुए पाले, को दर्शाता है। आधुनिक हिन्दी में ‘पाला’ सबसे सहज और स्पष्ट है।
- source_word: χιόνες
  choice: हिम
  rationale: यूनानी में बहुवचन है, पर हिन्दी में ‘हिम’ सामूहिक अर्थ स्वाभाविक रूप से व्यक्त करता है और काव्यात्मक गरिमा बनाए रखता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος का सामान्य और स्वाभाविक हिन्दी धार्मिक समतुल्य ‘प्रभु’ है; इस पद में विशेष नाम के रूपांकन की आवश्यकता नहीं है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया विशेष रूप से गीत के द्वारा स्तुति करने का भाव रखती है; ‘स्तुतिगान करो’ उस संगीतमय अर्थ को स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महान कहो
  rationale: यह तीव्र क्रिया अत्यधिक ऊँचा उठाने या महिमा करने का अर्थ देती है। ‘अत्यन्त महान कहो’ हिन्दी में भौतिक रूप से ऊपर उठाने की अनचाही छवि से बचते हुए तीव्रता और स्तुतिपरक भाव को रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: शाब्दिक रूप से ‘युगों तक’ का भाव है। इस आवर्ती स्तुतिपरक कथन में ‘सदा-सर्वदा’ उसका स्वाभाविक हिन्दी अर्थ देता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल यूनानी पाठ में κύριος है, कोई स्पष्ट हिब्रू दिव्य नाम नहीं। इसलिए ‘प्रभु’ स्रोत के रूप और इस यूनानी द्वितीयक-ग्रन्थीय संदर्भ दोनों के प्रति निष्पक्ष रहता है।
- issue: ὑπερυψοῦτε में तीव्र महिमामंडन
  choice: अत्यन्त महान कहो
  alternative: अत्यन्त ऊँचा उठाओ
  rationale: चुना गया रूप ईश्वर की सर्वोच्चता की घोषणा व्यक्त करता है और मूल क्रिया की तीव्रता बनाए रखता है, बिना किसी भौतिक ऊँचाई का संकेत दिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और उपासना-योग्य शैली रखी गई है। ‘हे’ से पाले और हिम को सीधे संबोधन स्पष्ट होता है; वाक्य साधारण पाठक के लिए समझने योग्य रहते हुए मूल गीत की गरिमा और समानांतर आज्ञाओं को बनाए रखता है।
