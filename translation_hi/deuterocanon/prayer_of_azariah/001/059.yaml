- source_word: ὑπερυψοῦτε
  choice: उसे अत्यन्त ऊँचा उठाओ
  rationale: उपसर्ग से व्यक्त तीव्रता को ‘अत्यन्त’ द्वारा और ऊँचा करने के रूपक को ‘ऊँचा उठाओ’ द्वारा सुरक्षित रखा गया है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: यह युगों तक बने रहने की प्रचलित स्तुतिपरक अभिव्यक्ति का सहज आधुनिक हिन्दी रूप है।
