  register: आधुनिक मानक हिन्दी का काव्यात्मक, सामूहिक और उपासनात्मक स्वर रखा गया है। बहुवचन 'रातो और दिनो' मूल के सीधे संबोधन तथा मानवीकरण को स्पष्ट करता है; दोनों अंतिम आज्ञार्थक क्रियाओं का कर्म 'उसे' साझा है।
