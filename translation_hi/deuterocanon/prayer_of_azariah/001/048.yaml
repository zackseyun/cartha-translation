translation:
  language: hi
  text: हे रातों और दिनों, प्रभु को धन्य कहो; उसका गुणगान करो और सदा उसे अति महान ठहराओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा संबोधन बनाए रखता है और ὑμνεῖτε से अर्थगत भेद भी बचाता है।
- source_word: νύκτες καὶ ἡμέραι
  choice: हे रातो और दिनो
  rationale: यूनानी के बहुवचन संबोधन और काव्यात्मक मानवीकरण को स्वाभाविक हिन्दी संबोधन में सुरक्षित रखता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος का सामान्य, प्रतिष्ठित हिन्दी बाइबलीय समतुल्य है; यूनानी पाठ स्वयं इब्रानी परमेश्वर-नाम की मुद्रण-परंपरा निर्दिष्ट नहीं करता।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: गीत के द्वारा स्तुति करने का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अति महान ठहराओ
  rationale: उपसर्ग ὑπερ- की तीव्रता को व्यक्त करते हुए परमेश्वर को अत्यन्त ऊँचा मानने और घोषित करने का भाव देता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: इस आवर्ती स्तुतिपरक वाक्यांश में निरंतर और अनंत काल का स्वाभाविक हिन्दी बोध देता है।
theological_decisions:
- issue: स्तुतिपरक प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल उपलब्ध पाठ यूनानी κύριος है। इसलिए किसी संभावित इब्रानी आधार-पाठ का विशिष्ट परमेश्वर-नाम चुपचाप आरोपित करने के बजाय 'प्रभु' रखा गया है।
