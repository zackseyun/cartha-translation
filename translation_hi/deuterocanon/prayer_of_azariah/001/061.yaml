    text: या ‘प्रभु की स्तुति करो।’ यूनानी क्रिया का अधिक सामान्य अनुवाद ‘स्तुति करो’ हो सकता है, पर ‘धन्य कहो’ मूल की बार-बार दोहराई गई उपासना-संबंधी भाषा को सुरक्षित रखता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी स्तुति गाओ।’ यूनानी क्रिया में भजन या स्तुतिगीत गाने का स्पष्ट भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया के आशीर्वादात्मक और स्तुतिपरक अर्थ को सुरक्षित रखता है तथा गीत में बार-बार आने वाली उपासना-संबंधी शब्दावली के अनुकूल है।
- source_word: ἱερεῖς
  choice: हे याजको
  rationale: यह संबोधन-कारक बहुवचन है; ‘हे याजको’ सीधे संबोधन को स्वाभाविक और स्पष्ट बनाता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: यूनानी κύριος का सीधा और प्रचलित हिन्दी रूप ‘प्रभु’ है; यूनानी पाठ में स्वयं परमेश्वर का इब्रानी विशिष्ट नाम नहीं दिया गया है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: ὑμνέω में गाकर स्तुति करने का स्पष्ट भाव है; ‘स्तुतिगान करो’ केवल ‘स्तुति करो’ की तुलना में इस सांगीतिक अर्थ को बेहतर सुरक्षित रखता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त ऊँचा ठहराओ
  rationale: उपसर्गयुक्त क्रिया ऊँचा उठाने या अत्यधिक महिमा देने की तीव्रता व्यक्त करती है; यह रूप उस बल को बनाए रखते हुए हिन्दी में उपासना-संबंधी अर्थ देता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: इस स्तुतिपरक सूत्र में यह अनन्त काल की निरन्तरता व्यक्त करता है; ‘युगानुयुग’ गरिमापूर्ण, परिचित और संक्षिप्त हिन्दी रूप है।
theological_decisions:
- issue: स्तुतिपरक संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल स्रोत यूनानी है और यहाँ κύριος लिखा है, न कि इब्रानी विशिष्ट ईश्वरीय नाम; इसलिए ‘प्रभु’ स्रोत के रूप को सुरक्षित रखता है और किसी दूसरी पाठ-परम्परा को आरोपित नहीं करता।
- issue: εὐλογεῖτε में मनुष्य द्वारा प्रभु को ‘धन्य कहने’ का भाव
  choice: धन्य कहो
  alternative: स्तुति करो
  rationale: ‘धन्य कहो’ यूनानी क्रिया की आशीर्वादात्मक भाषा और आवर्ती उपासना-सूत्र को बनाए रखता है; पादटिप्पणी अधिक सामान्य अर्थ ‘स्तुति करो’ भी बताती है।
