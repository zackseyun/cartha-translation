  yaml_path: translation/deuterocanon/prayer_of_azariah/001/018.yaml
  text: And now we follow after you with our whole heart[a], and we fear you, and we seek your face.
translation:
  language: hi
  text: और अब हम अपने पूरे मन से आपके पीछे चलते हैं, आपका भय मानते हैं और आपके मुख की खोज करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘आपकी उपस्थिति खोजते हैं।’ यूनानी में शाब्दिक रूप से ‘आपके मुख की खोज करते हैं’ है; यह परमेश्वर की उपस्थिति या कृपा खोजने का बाइबलीय मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: यह सरल काल-संक्रमण है; ‘और’ संयोजक καὶ को और ‘अब’ प्रार्थना की वर्तमान तात्कालिकता को बनाए रखता है।
- source_word: ἐξακολουθοῦμεν
  choice: हम ... आपके पीछे चलते हैं
  rationale: क्रिया किसी के पीछे चलने और उसके मार्ग पर बने रहने का भाव देती है। हिन्दी में ‘आपके पीछे चलते हैं’ स्वाभाविक है; निहित कर्म संदर्भ के अनुसार ‘आपके’ से स्पष्ट किया गया है।
- source_word: ἐν ὅλῃ καρδίᾳ ἡμῶν
  choice: अपने पूरे मन से
  rationale: यह अखंड और निष्कपट समर्पण का बाइबलीय मुहावरा है। हिन्दी में ‘पूरे मन से’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φοβούμεθά σε
  choice: आपका भय मानते हैं
  rationale: परमेश्वर के संबंध में φοβέομαι भय के साथ श्रद्धा का भाव भी रख सकता है। ‘भय मानते हैं’ मूल शब्द की तनावपूर्ण व्यापकता को केवल ‘आदर करते हैं’ बनाकर सीमित नहीं करता।
- source_word: ζητοῦμεν τὸ πρόσωπόν σου
  choice: आपके मुख की खोज करते हैं
  rationale: मूल में शाब्दिक रूप से ‘आपके मुख’ है। इसे बनाए रखने से बाइबलीय बिंब और परमेश्वर की उपस्थिति या कृपा खोजने का मुहावरा सुरक्षित रहता है।
theological_decisions:
- issue: परमेश्वर के लिए φοβούμεθά σε का अनुवाद
  choice: आपका भय मानते हैं
  alternative: आपका आदर करते हैं / आपके प्रति श्रद्धा रखते हैं
  rationale: यूनानी पाठ स्पष्ट रूप से भय की भाषा का प्रयोग करता है। मुख्य पाठ में ‘भय’ रखने से भय और श्रद्धा के बीच की वास्तविक धर्मवैचारिक व्यापकता बनी रहती है।
- issue: ζητοῦμεν τὸ πρόσωπόν σου का मुहावरा
  choice: आपके मुख की खोज करते हैं
  alternative: आपकी उपस्थिति खोजते हैं / आपकी कृपा चाहते हैं
  rationale: शाब्दिक बिंब को मुख्य पाठ में रखने से स्रोत के प्रति पारदर्शिता और बाइबलीय अनुगूँज बनी रहती है; मुहावरे का व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनामय, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘मुख’ और ‘भय मानते हैं’ जैसे बाइबलीय पद मूल की छवि और धर्मवैचारिक तनाव को सुरक्षित रखते हैं।
