translation:
  language: hi
  text: इस प्रकार हनन्याह, अजर्याह और मीशाएल ने प्रार्थना की और प्रभु की स्तुति में गीत गाया, जब राजा ने आज्ञा दी कि उन्हें भट्ठी में फेंक दिया जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ में इनके इब्रानी नाम हनन्याह, अजर्याह और मीशाएल हैं, न कि इनके बाबिली नाम शद्रक, मेशक और अबेदनगो।
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: इस प्रकार
  rationale: यह प्रयोग पूर्ववर्ती प्रसंग से संबंध और प्रार्थना की रीति—दोनों का संकेत देता है; आधुनिक हिन्दी में ‘इस प्रकार’ स्वाभाविक और गरिमापूर्ण है।
- source_word: προσηύξατο
  choice: प्रार्थना की
  rationale: क्रिया का सीधा अर्थ ‘प्रार्थना करना’ है; इसमें ‘ऊँचे स्वर से’ जैसी कोई अतिरिक्त धारणा नहीं जोड़ी गई।
- source_word: Ἀνανίας καὶ Ἀζαρίας καὶ Μισαήλ
  choice: हनन्याह, अजर्याह और मीशाएल
  rationale: यूनानी पाठ में इनके इब्रानी नामों के यूनानी रूप हैं। हिन्दी बाइबलीय परंपरा के अनुरूप इब्रानी-आधारित रूप रखे गए हैं, न कि बाबिली नाम।
- source_word: ὕμνησαν
  choice: स्तुति में गीत गाया
  rationale: यह क्रिया गाकर स्तुति करने का भाव व्यक्त करती है; केवल ‘स्तुति की’ कहने से संगीतात्मक अर्थ दब जाता।
- source_word: τῷ κυρίῳ
  choice: प्रभु की
  rationale: यहाँ κύριος परमेश्वर के लिए प्रयुक्त है। हिन्दी में ‘प्रभु की स्तुति में गीत गाया’ लक्ष्य-भाषा की स्वाभाविक रचना है।
- source_word: ὅτε
  choice: जब
  rationale: मूल संयोजक समय-संबंध बताता है; ‘जब’ उसका सीधा और अनिर्णायक अनुवाद है।
- source_word: προσέταξεν
  choice: आज्ञा दी
  rationale: राजकीय संदर्भ में ‘आज्ञा दी’ προστάσσω के आदेश देने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐμβληθῆναι εἰς τὴν κάμινον
  choice: भट्ठी में फेंकने
  rationale: निष्क्रिय क्रिया का आशय है कि उन्हें भट्ठी के भीतर फेंका जाए। ‘भट्ठी’ κάμινος के लिए परिचित और प्रसंगानुकूल शब्द है; ‘धधकती’ जैसा विवरण इस पद में नहीं जोड़ा गया।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रार्थना और स्तुति के इस यहूदी धर्मग्रंथीय प्रसंग में पद परमेश्वर को सूचित करता है; ‘प्रभु’ धार्मिक प्रयोग को सुरक्षित रखता है।
- issue: तीनों युवकों के नामों का रूप
  choice: हनन्याह, अजर्याह और मीशाएल
  alternative: शद्रक, मेशक और अबेदनगो
  rationale: मूल यूनानी पाठ इस स्थान पर इब्रानी नामों के रूप देता है, बाबिली दरबारी नाम नहीं; इसलिए स्रोत का वही भेद सुरक्षित रखा गया है।
