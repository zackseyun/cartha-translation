  text: आप स्वर्ग के विस्तार में धन्य हैं, और युगानुयुग प्रशंसित और महिमामंडित हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερέωμα
  choice: विस्तार
  rationale: यह शब्द किसी दृढ़ या फैले हुए आकाशीय मंडल का बोध कराता है। ‘आकाश का विस्तार’ आधुनिक हिन्दी में स्वाभाविक है और मूल की प्राचीन विश्व-कल्पना को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: ὑμνητός
  choice: स्तुति के योग्य
  rationale: यह मौखिक विशेषण स्तुति किए जाने की योग्यता या उचितता व्यक्त करता है; हिन्दी में ‘स्तुति के योग्य’ स्पष्ट और गरिमापूर्ण है।
- source_word: δεδοξασμένος
  choice: महिमा के योग्य
  rationale: यहाँ पूर्ण कृदंत स्तुतिपरक समानांतरता में परमेश्वर के महिमामंडित होने का भाव रखता है। ‘महिमा के योग्य’ ὑμνητός के साथ सहज हिन्दी समानांतर बनाता है, यद्यपि क्रियारूप का सूक्ष्म अंतर कुछ सामान्यीकृत होता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह स्थापित, संक्षिप्त और काव्यात्मक हिन्दी अभिव्यक्ति अनंत काल तक जारी स्तुति का भाव देती है।
theological_decisions:
- issue: δεδοξασμένος को वर्तमान स्थिति या स्तुति की पुकार के रूप में प्रस्तुत करना
  choice: महिमा के योग्य
  alternative: युगानुयुग महिमामंडित हैं
  rationale: स्तुति-गीत की समानांतर रचना में ὑμνητός और δεδοξασμένος को एक साथ स्वाभाविक हिन्दी में व्यक्त किया गया है। इससे किसी संप्रदायगत अर्थ को जोड़े बिना उपासना का आशय सुरक्षित रहता है।
