base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/005.yaml
  text: And you have executed true judgments in all that you have brought upon us and upon your holy city[a], Jerusalem, the city of our fathers; for in truth and judgment you have done all these things because of our sins.
translation:
  language: hi
  text: और जो कुछ तू हम पर और अपने पवित्र नगर यरूशलेम, जो हमारे पूर्वजों का नगर है, पर लाया है, उस सब में तूने सच्चे न्याय-निर्णय किए हैं; क्योंकि तूने हमारे पापों के कारण ये सब बातें सच्चाई और न्याय[a] से की हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सच्चाई और न्यायोचित रीति से।” यूनानी शब्द κρίσις का अर्थ ‘न्याय’ या ‘न्यायिक निर्णय’ हो सकता है; मुख्य पाठ में पद की दोहराई गई न्यायिक भाषा को सुरक्षित रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματα ἀληθείας
  choice: सच्चे न्याय-निर्णय
  rationale: यह पदबंध सत्य के अनुरूप किए गए न्यायिक निर्णयों को दर्शाता है। ‘न्याय-निर्णय’ बहुवचन की ठोस, न्यायिक भावना को बनाए रखता है, जबकि ‘सच्चे’ स्वाभाविक हिन्दी में ἀληθείας का विशेषणात्मक भाव व्यक्त करता है।
- source_word: ἐποίησας
  choice: किए हैं
  rationale: क्रिया दोनों बार कार्य करने या पूरा करने का भाव रखती है। हिन्दी में ‘न्याय-निर्णय किए हैं’ और ‘काम ... किए हैं’ दोनों स्वाभाविक हैं और अनावश्यक शब्दगत भिन्नता से बचते हैं।
- source_word: κατὰ πάντα ἃ ἐπήγαγες ἡμῖν
  choice: जो कुछ तू हम पर ... लाया, उस सब में
  rationale: ἐπάγω विपत्ति या दंड को किसी पर लाने का अर्थ देता है। ‘हम पर लाया’ कारणात्मक भाव को सुरक्षित रखता है, पर ‘थोपा’ जैसे अधिक व्याख्यात्मक शब्द से बचता है।
- source_word: πόλιν σου τὴν ἁγίαν
  choice: अपने पवित्र नगर
  rationale: यह πόλις और ἅγιος का सीधा और हिन्दी बाइबिलीय प्रयोग में स्वाभाविक अनुवाद है।
- source_word: τὴν τῶν πατέρων ἡμῶν Ἰερουσαλήμ
  choice: हमारे पुरखों के नगर यरूशलेम
  rationale: मूल की समानाधिकरणात्मक रचना यरूशलेम को पूर्वजों से जुड़ा नगर बताती है। ‘पुरखों’ में पैतृक और ऐतिहासिक संबंध स्पष्ट रहता है।
- source_word: ἐν ἀληθείᾳ καὶ κρίσει
  choice: सच्चाई और न्याय से
  rationale: यह अनुवाद दो अलग संज्ञाओं तथा न्यायिक शब्दावली की पुनरावृत्ति को बनाए रखता है। ‘सच्चाई और न्यायपूर्वक’ अधिक व्याख्यात्मक होता और समानांतर संरचना को कम कर देता।
- source_word: πάντα ταῦτα
  choice: ये सब काम
  rationale: मूल के बहुवचन और समग्र बल को स्पष्ट हिन्दी में रखा गया है; ‘काम’ जोड़ना ποιέω के साथ स्वाभाविक मुहावरा बनाता है।
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: हमारे पापों के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है। यह वाक्यांश स्वीकारोक्ति के भाव को सीधे और स्पष्ट रूप में रखता है।
theological_decisions:
- issue: परमेश्वर के दंडात्मक कार्यों से जुड़ी बार-बार आने वाली न्यायिक भाषा
  choice: पहले स्थान पर ‘सच्चे न्याय-निर्णय’ और दूसरे पर ‘सच्चाई और न्याय’ रखा गया है।
  alternative: ‘जो ठीक था’ या केवल ‘न्यायपूर्वक’ जैसे व्यापक और कम न्यायिक पद प्रयोग किए जा सकते थे।
  rationale: पद स्वीकार करता है कि यरूशलेम और लोगों पर आई विपत्ति उनके पापों के कारण सत्य के अनुरूप न्यायिक कार्य थी। मूल की न्यायिक तीव्रता को नरम किए बिना, κρίματα और κρίσις के रूपगत अंतर को हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल के एकवचन संबोधन और प्रचलित हिन्दी बाइबिलीय प्रार्थना-शैली के अनुरूप है। वाक्य-विन्यास मूल की कारणात्मक और न्यायिक संरचना को रखते हुए सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
