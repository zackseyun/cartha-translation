translation:
  language: hi
  text: हे पहाड़ो और पहाड़ियों, प्रभु को धन्य कहो; उसकी स्तुति गाओ और उसे युगानुयुग सर्वोच्च महिमा दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया प्रभु के विषय में मंगलमय वचन कहने या उसे धन्य कहने का आह्वान करती है। यह अनुवाद आवर्ती उपासना-मूलक भाषा को बनाए रखता है और इसे केवल ‘स्तुति करो’ में नहीं समेटता।
- source_word: ὄρη καὶ βουνοί
  choice: पहाड़ो और पहाड़ियों
  rationale: दो प्रकार की ऊँची भू-आकृतियों का सीधा और स्वाभाविक हिन्दी युग्म; सम्बोधन के कारण दोनों रूपों को सम्बोधन-बहुवचन में रखा गया है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: यूनानी κύριος का प्रचलित, गरिमापूर्ण और इस स्तुतिपरक प्रसंग के अनुकूल हिन्दी रूप ‘प्रभु’ है।
- source_word: ὑμνεῖτε
  choice: स्तुति गाओ
  rationale: क्रिया में गाकर या भजन के रूप में प्रशंसा करने का भाव है; ‘स्तुति गाओ’ उसके संगीतमय अर्थ को स्पष्ट रखता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महान् ठहराओ
  rationale: उपसर्ग सहित क्रिया साधारण ऊँचा करने से अधिक प्रबल महिमामंडन व्यक्त करती है। हिन्दी में यह रूप उस तीव्रता को स्वाभाविक उपासना-मूलक भाषा में व्यक्त करता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: सर्वनाम का संकेत पहले आए ‘प्रभु’ की ओर है; हिन्दी में कर्म रूप ‘उसे’ स्वाभाविक है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: आवर्ती स्तुति-वाक्य में यह अनन्त काल की धारणा व्यक्त करता है। ‘युगानुयुग’ संक्षिप्त, गरिमापूर्ण और उपासना की लय के अनुकूल है।
theological_decisions:
- issue: स्तुतिपरक सम्बोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल पाठ यूनानी κύριον पढ़ता है। यहाँ किसी अनुमानित इब्रानी दिव्य नाम को पाठ में लाने के बजाय यूनानी पद का सीधा अनुवाद ‘प्रभु’ रखा गया है।
- issue: सृष्टि द्वारा प्रभु को ‘धन्य कहने’ की भाषा
  choice: धन्य कहो
  alternative: स्तुति करो
  rationale: εὐλογεῖτε और अगले ὑμνεῖτε के बीच शब्दगत भेद बनाए रखने के लिए पहले को ‘धन्य कहो’ और दूसरे को ‘स्तुति गाओ’ किया गया है; इससे काव्यात्मक विस्तार और धार्मिक तनाव दोनों सुरक्षित रहते हैं।
