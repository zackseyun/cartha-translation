translation:
  language: hi
  text: हे प्रकाश और अंधकार, प्रभु को धन्य कहो; उनकी स्तुति गाओ और उन्हें युगानुयुग अत्यन्त ऊँचा उठाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया सृष्टि के संबोधित तत्वों को प्रभु की महिमा घोषित करने के लिए बुलाती है। ‘धन्य कहो’ आशीर्वचनात्मक और उपासना-संबंधी स्वर को सुरक्षित रखता है।
- source_word: φῶς καὶ σκότος
  choice: प्रकाश और अंधकार
  rationale: सृष्टि के परस्पर-विरोधी व्यापक तत्वों की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: कर्मकारक रूप को हिन्दी में ‘को’ के साथ व्यक्त किया गया है; κύριος के लिए प्रतिष्ठित और स्वाभाविक धार्मिक पद ‘प्रभु’ रखा गया है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया में केवल प्रशंसा नहीं, बल्कि गाकर स्तुति करने का भाव है; ‘स्तुतिगान’ उस संगीतमय-उपासना संबंधी अर्थ को संक्षेप में रखता है।
- source_word: ὑπερυψοῦτε
  choice: सबसे महान कहो
  rationale: यह तीव्रतासूचक क्रिया अत्यंत ऊँचा उठाने या सर्वोच्च घोषित करने का भाव देती है। हिन्दी में प्रभु के विषय में ‘सबसे महान कहो’ स्वाभाविक रहते हुए उस प्रबल महिमामंडन को व्यक्त करता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: सर्वनाम का संदर्भ प्रभु की ओर है और उसे सीधे हिन्दी कर्मरूप में रखा गया है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: बहुवचन ‘युगों तक’ की मूल छवि और अनंत निरंतरता, दोनों को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ उपासना और स्तुति के संदर्भ में ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी पद की धार्मिक गरिमा को बनाए रखता है।
- issue: εἰς τοὺς αἰῶνας का कालगत अर्थ
  choice: युगानुयुग
  alternative: सदा-सर्वदा
  rationale: ‘युगानुयुग’ मूल के बहुवचन ‘युगों’ को सुनाई देता रखता है, जबकि प्रसंग में अनंत स्तुति का भाव भी स्पष्ट करता है; किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामूहिक उपासना के योग्य शैली। संबोधन स्पष्ट करने के लिए ‘हे’ जोड़ा गया है, जो यूनानी आज्ञार्थक संरचना में निहित प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
