translation:
  language: hi
  text: हे समुद्रों और नदियों, प्रभु को धन्य कहो; उसका स्तुतिगान करो और उसे सदा-सर्वदा अति महान ठहराओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया सृष्टि को प्रभु की महिमा और प्रशंसा घोषित करने के लिए बुलाती है। ‘धन्य कहो’ सीधे कर्म के साथ मूल की उपासना-संबंधी भाषा को बनाए रखता है।
- source_word: θάλασσαι
  choice: समुद्रों
  rationale: यूनानी बहुवचन को बनाए रखते हुए विभिन्न समुद्रों का काव्यात्मक मानवीकरण व्यक्त होता है।
- source_word: ποταμοί
  choice: नदियों
  rationale: यह ποταμοί का स्वाभाविक आधुनिक हिन्दी समतुल्य है और ‘समुद्रों’ के साथ सृष्टि-गीत की समानांतर रचना बनाए रखता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: यहाँ κύριος परमेश्वर की उपाधि है; ‘प्रभु’ हिन्दी में स्वाभाविक और स्रोत-संगत रूप है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया में गीत अथवा भजन द्वारा स्तुति करने का भाव है; ‘स्तुतिगान करो’ उस संगीतमय अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महान मानो
  rationale: ὑπερ- उपसर्ग तीव्रता व्यक्त करता है। ‘अत्यन्त महान मानो’ हिन्दी में स्वाभाविक ढंग से अत्यधिक ऊँचा ठहराने या महिमा देने का भाव संप्रेषित करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: इस आवर्ती स्तुतिपरक पदबंध का यह सुबोध और गरिमापूर्ण हिन्दी रूप है, जो निरंतर और युग-युग तक चलने वाले भाव को व्यक्त करता है।
theological_decisions:
- issue: κύριος को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: स्वामी
  rationale: यूनानी पाठ में κύριον है और प्रसंग में यह परमेश्वर की उपाधि है। ‘प्रभु’ स्रोत के अधिक निकट और हिन्दी बाइबलीय प्रयोग में स्वाभाविक है; ‘स्वामी’ यहाँ सामान्य मानवीय अधिकार का भ्रम दे सकता है।
