  register: आधुनिक मानक हिन्दी में काव्यात्मक और उपासना-संगत गरिमा रखी गई है। सम्बोधन के लिए ‘हे’ तथा बहुवचन रूपों से समुद्रों और नदियों के मानवीकरण को स्पष्ट किया गया है। कोई पादटिप्पणी आवश्यक नहीं है।
