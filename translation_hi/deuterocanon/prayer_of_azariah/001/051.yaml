  text: Let the earth bless the Lord; let it sing hymns and highly exalt him forever.
translation:
  language: hi
  text: पृथ्वी प्रभु को धन्य कहे; वह उनका स्तुतिगान करे और उन्हें सदा अत्यन्त ऊँचा ठहराए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογείτω
  choice: धन्य कहे
  rationale: तृतीय-पुरुष आज्ञार्थक रूप को सृष्टि के प्रति उपासना-संबंधी आह्वान के रूप में रखा गया है। ‘धन्य कहे’ परमेश्वर की ओर निर्देशित εὐλογέω के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: इस सृष्टि-विषयक स्तुतिगान में γῆ किसी विशेष भूभाग के बजाय समूची पृथ्वी को सूचित करता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος के लिए स्थापित, गरिमापूर्ण और उपासना-संदर्भ में स्वाभाविक हिन्दी पद।
- source_word: ὑμνείτω
  choice: स्तुतिगान करे
  rationale: ὑμνέω में गीत द्वारा स्तुति करने का भाव है; ‘स्तुतिगान करे’ इस संगीतमय और उपासना-संबंधी अर्थ को संक्षेप में सुरक्षित रखता है।
- source_word: ὑπερυψούτω
  choice: अत्यन्त ऊँचा ठहराए
  rationale: उपसर्ग ὑπερ- की तीव्रता को ‘अत्यन्त’ से व्यक्त किया गया है; ‘ऊँचा ठहराए’ यहाँ महिमा और सर्वोच्च सम्मान देने का भाव प्रकट करता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह सर्वनाम पहले आए ‘प्रभु’ की ओर संकेत करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: इस आवर्ती स्तुति-सूत्र में युगों तक बने रहने के अर्थ का सहज आधुनिक हिन्दी रूप ‘सदा’ है।
theological_decisions:
- issue: यूनानी स्तुतिगान में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: उपासना के इस संदर्भ में ‘प्रभु’ प्रचलित दिव्य उपाधि है और मूल की गरिमा बनाए रखती है; ‘स्वामी’ सम्भव होते हुए भी यहाँ अपेक्षाकृत लौकिक सुनाई दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक-उपासना शैली रखी गई है। दोनों आज्ञार्थक क्रियाओं और ὑπερυψόω की तीव्रता को स्पष्ट रखा गया है; कोई पाद-टिप्पणी आवश्यक नहीं।
