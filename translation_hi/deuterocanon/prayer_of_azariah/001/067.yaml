base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/067.yaml
  text: Bless the Lord[a], all you who fear the Lord, the God of gods; sing praise and give thanks, for his mercy is forever[b], even forever and ever.
translation:
  language: hi
  text: प्रभु का आदर करनेवाले[a] तुम सब लोगो, प्रभु को—देवताओं के परमेश्वर को—धन्य कहो; उसकी स्तुति गाओ और धन्यवाद दो, क्योंकि उसकी करुणा सदा, युगानुयुग तक बनी रहती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रभु का भय माननेवाले’ अथवा ‘प्रभु की उपासना करनेवाले।’
    reason: lexical_alternative
  - marker: b
    text: या ‘क्योंकि उसका अटल प्रेम सदा बना रहता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का उपासना-संबंधी बल बनाए रखता है। हिंदी में परमेश्वर के लिए ‘धन्य कहो’ स्वाभाविक है और इसे सामान्य ‘स्तुति करो’ में नहीं मिलाता, क्योंकि आगे ὑμνεῖτε अलग से आया है।
- source_word: πάντες οἱ σεβόμενοι τὸν κύριον
  choice: प्रभु का भय माननेवाले सभी लोगो
  rationale: σέβομαι आदरपूर्ण भक्ति और श्रद्धा को व्यक्त करता है। ‘प्रभु का भय मानना’ हिंदी बाइबलीय प्रयोग में श्रद्धामय समर्पण का परिचित रूप है; वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: κύριον
  choice: प्रभु
  rationale: κύριος के लिए प्रचलित, गरिमापूर्ण और संदर्भानुकूल हिंदी रूप। आरंभिक आज्ञा में यूनानी का कर्म संदर्भ से निहित है; हिंदी में स्पष्टता के लिए ‘प्रभु को’ रखा गया है।
- source_word: τὸν θεὸν τῶν θεῶν
  choice: देवताओं के परमेश्वर
  rationale: यूनानी संबंधवाचक पदबंध और उसके बाइबलीय उपाधि-रूप को सीधे सुरक्षित रखता है, बिना उसके आशय को व्याख्यात्मक ढंग से बदलने के।
- source_word: ὑμνεῖτε
  choice: उसकी स्तुति गाओ
  rationale: क्रिया में गायन द्वारा स्तुति करने का भाव है; ‘स्तुति गाओ’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐξομολογεῖσθε
  choice: धन्यवाद दो
  rationale: स्तुतिगान और करुणा के refrain वाले इस संदर्भ में क्रिया का अर्थ सार्वजनिक धन्यवाद या प्रशंसा है; ‘धन्यवाद दो’ सर्वाधिक स्वाभाविक है।
- source_word: ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ
  choice: क्योंकि उसकी करुणा सदा बनी रहती है
  rationale: ἔλεος के दया/करुणा संबंधी मूल अर्थ को बनाए रखता है और εἰς τὸν αἰῶνα के स्थायी कालगत भाव को सहज हिंदी में व्यक्त करता है।
- source_word: καὶ εἰς τὸν αἰῶνα τῶν αἰώνων
  choice: युगानुयुग तक
  rationale: पहले ‘सदा’ को और प्रबल करने वाले यूनानी अनंतकालिक मुहावरे का गरिमापूर्ण तथा परिचित हिंदी रूप।
theological_decisions:
- issue: उपासना के संदर्भ में σεβόμενοι का अनुवाद
  choice: प्रभु का भय माननेवाले
  alternative: प्रभु का आदर करनेवाले / प्रभु की उपासना करनेवाले
  rationale: यूनानी क्रिया φοβέω नहीं, बल्कि σέβομαι है, जो श्रद्धा, आदर और उपासना का भाव रखती है। मुख्य पाठ में परिचित बाइबलीय वाक्यांश चुना गया है, पर वास्तविक शब्दार्थ-व्याप्ति को पादटिप्पणी में स्पष्ट रखा गया है।
- issue: ἔλεος का अनुवाद
  choice: करुणा
  alternative: अटल प्रेम / दया
  rationale: यूनानी ἔλεος का सीधा दया-करुणा संबंधी अर्थ मुख्य पाठ में रखा गया है। वाचा-संबंधी ‘अटल प्रेम’ एक संभव संदर्भगत अभिव्यक्ति है, पर उसे मूल यूनानी पर आरोपित किए बिना पादटिप्पणी में दिया गया है।
- issue: εὐλογεῖτε का निहित कर्म
  choice: प्रभु को
  alternative: उसे
  rationale: यूनानी में आज्ञा के बाद कर्म स्पष्ट रूप से व्यक्त नहीं है, पर स्तोत्र की संरचना में परमेश्वर ही निहित कर्म है। स्पष्ट और स्वाभाविक हिंदी के लिए उसे ‘प्रभु को’ के रूप में व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में बोलने योग्य रखी गई है। ‘सभी लोगो’ संबोधन को स्पष्ट करता है; ‘धन्य कहो’, ‘स्तुति गाओ’ और ‘धन्यवाद दो’ यूनानी की तीन अलग क्रियाओं को अलग-अलग बनाए रखते हैं। ‘सदा … युगानुयुग तक’ मूल की क्रमिक अनंतकालिक तीव्रता सुरक्षित रखता है।
