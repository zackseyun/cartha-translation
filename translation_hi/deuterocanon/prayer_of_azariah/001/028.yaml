  text: 'तब वे तीनों भट्ठी में मानो एक ही मुख से परमेश्वर का स्तुतिगान कर रहे थे, उसकी महिमा कर रहे थे और उसे धन्य कह रहे थे, और इस प्रकार कह रहे थे:'
