lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को आरम्भ करने वाला सहज और सटीक काल-सूचक संक्रमण है।
- source_word: οἱ τρεῖς
  choice: वे तीनों
  rationale: यूनानी पाठ केवल ‘तीनों’ कहता है; ‘पुरुष’ या ‘युवक’ जोड़ना इस पद में निहित न होने वाली जानकारी जोड़ देता। हिंदी में ‘वे तीनों’ संदर्भ और स्वाभाविकता दोनों बनाए रखता है।
- source_word: ὡς ἐξ ἑνὸς στόματος
  choice: मानो एक ही मुख से
  rationale: यह चयन यूनानी की सजीव उपमा और तीनों की पूर्ण एकता को बनाए रखता है; अधिक मुहावरेदार विकल्प ‘एक ही स्वर में’ पादटिप्पणी में दिया गया है।
- source_word: ὕμνουν
  choice: भजन गाते
  rationale: यह क्रिया गीत के द्वारा स्तुति करने का अर्थ देती है। अपूर्ण काल की जारी क्रिया को हिंदी की सहभागी रचना में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐδόξαζον
  choice: उसकी महिमा करते
  rationale: यह ‘महिमा देना/करना’ का विशिष्ट अर्थ सुरक्षित रखता है और इसे आसपास की स्तुति-संबंधी क्रियाओं में विलीन नहीं करता।
- source_word: εὐλόγουν
  choice: उसे धन्य कहते
  rationale: यह εὐλογέω के ‘धन्य कहना’ वाले अर्थ को बनाए रखता है और सामान्य ‘स्तुति करना’ से उसका भेद सुरक्षित रखता है।
- source_word: τὸν θεὸν
  choice: परमेश्वर
  rationale: आधुनिक मानक हिंदी बाइबलीय गद्य में यह θεός के लिए स्पष्ट, गरिमापूर्ण और स्वाभाविक पद है।
- source_word: ἐν τῇ καμίνῳ
  choice: भट्ठी में
  rationale: κάμινος के लिए ‘भट्ठी’ इस अग्निमय प्रसंग में सटीक और सामान्य हिंदी शब्द है।
- source_word: λέγοντες
  choice: कहते हुए बोले
  rationale: यह सहभागी क्रिया आगामी वचन का परिचय देती है। हिंदी में ‘बोले:’ के साथ यह रचना अगले पद से जुड़ने वाला स्वाभाविक संकेत देती है।
