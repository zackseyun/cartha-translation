  text: Bless the Lord[a], angels of the Lord[b]; sing hymns and highly exalt him forever.
translation:
  language: hi
  text: हे प्रभु के स्वर्गदूतों, प्रभु को धन्य कहो[a]; उसका स्तुतिगान करो[b] और उसे सदा-सर्वदा अत्यन्त ऊँचा उठाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की स्तुति करो”; उपासना की भाषा में यूनानी क्रिया के दोनों अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया विशेष रूप से भजन या स्तुति गाने का भाव देती है।
    reason: lexical_clarification
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक εὐλογεῖτε का उपासना-संदर्भ में अर्थ प्रभु को धन्य कहना अथवा उसकी स्तुति करना हो सकता है। ‘धन्य कहो’ यूनानी क्रिया की विशिष्ट अभिव्यक्ति और काव्यात्मक आदेश को बनाए रखता है।
- source_word: ἄγγελοι
  choice: स्वर्गदूतो
  rationale: इस ब्रह्मांडीय स्तुतिगान में ἄγγελοι से अभिप्राय मानवीय संदेशवाहकों के बजाय स्वर्गीय प्राणियों से है; संबोधन के कारण ‘स्वर्गदूतो’ रूप स्वाभाविक है।
- source_word: Κυρίου / τὸν κύριον
  choice: प्रभु
  rationale: κύριος का मानक और इस उपासना-संदर्भ में स्वाभाविक हिन्दी रूप ‘प्रभु’ है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: ὑμνέω केवल सामान्य प्रशंसा नहीं, बल्कि भजन या स्तुति गाने का भाव रखता है; ‘स्तुतिगान करो’ उसके संगीतमय और आराधनात्मक बल को व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अति महान ठहराओ
  rationale: ὑπερυψόω में अत्यधिक ऊँचा उठाने या महिमा देने का तीव्र भाव है। परमेश्वर के लिए ‘अति महान ठहराओ’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस बल को सुरक्षित रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: इस आवर्ती स्तुतिपरक वाक्य में यह मुहावरा अनंत अवधि को दर्शाता है; ‘सदा-सर्वदा’ गरिमापूर्ण और सहज हिन्दी है।
theological_decisions:
- issue: व्यवस्थाविवरणेतर यूनानी स्तुतिगान में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस पद में κύριος परमेश्वर के लिए आराधनात्मक उपाधि है। ‘प्रभु’ प्रचलित बाइबलीय हिन्दी है और ‘स्वामी’ की अपेक्षा इस संदर्भ को अधिक स्पष्टता से व्यक्त करता है।
- issue: εὐλογεῖτε में ‘धन्य कहना’ और ‘स्तुति करना’ का संबंध
  choice: धन्य कहो
  alternative: स्तुति करो
  rationale: यूनानी क्रिया दोनों अर्थ-छायाएँ रख सकती है। मुख्य पाठ में अधिक निकट रूप ‘धन्य कहो’ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है, जिससे मूल की अर्थगत व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, सामूहिक उपासना के योग्य और गरिमापूर्ण शैली रखी गई है। संबोधन के लिए ‘हे ... स्वर्गदूतो’ और कालातीत आवर्तन के लिए ‘सदा-सर्वदा’ चुना गया है।
