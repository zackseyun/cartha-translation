base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/015.yaml
  text: And at this time there is no ruler or prophet or leader, no whole burnt offering or sacrifice or offering or incense, and no place to bring firstfruits before you and to find mercy.
translation:
  language: hi
  text: और इस समय न कोई शासक है, न नबी, न अगुआ; न होमबलि, न बलिदान, न भेंट, न धूप; और न कोई ऐसा स्थान है जहाँ हम तेरे सामने पहली उपज[a] चढ़ाकर दया पा सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपज चढ़ाकर” अथवा “तेरे सामने भेंट चढ़ाकर।” यहाँ प्रयुक्त यूनानी अभिव्यक्ति असामान्य है; “पहली उपज” आसपास के बलि और भेंट से जुड़े प्रसंग को दर्शाती है।
    reason: τοῦ καρπῶσαι के असामान्य प्रयोग और उसके संभावित आराधनात्मक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἄρχων
  choice: शासक
  rationale: यह शासन-अधिकार रखने वाले व्यक्ति का व्यापक पद है और ἡγούμενος से भिन्नता बनाए रखता है।
- source_word: προφήτης
  choice: नबी
  rationale: आधुनिक मानक हिन्दी में यह बाइबलीय ‘prophet’ का प्रचलित और सहज रूप है।
- source_word: ἡγούμενος
  choice: अगुआ
  rationale: यह नेतृत्व का बोध कराता है, पर ἄρχων के राजनीतिक अर्थ को दोहराता नहीं।
- source_word: ὁλοκαύτωσις
  choice: होमबलि
  rationale: पूरी तरह आग में जलाई जाने वाली बलि के लिए संक्षिप्त, प्रतिष्ठित और विशिष्ट हिन्दी पद।
- source_word: θυσία
  choice: बलिदान
  rationale: सामान्य बलि-संबंधी पद के रूप में सूची के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: προσφορά
  choice: भेंट
  rationale: चढ़ाई या प्रस्तुत की जाने वाली वस्तु के लिए सहज हिन्दी शब्द, जो बलिदान से अलग बना रहता है।
- source_word: θυμίαμα
  choice: धूप
  rationale: उपासना में जलाई जाने वाली सुगंधित धूप का स्वाभाविक हिन्दी रूप।
- source_word: τοῦ καρπῶσαι
  choice: पहली उपज चढ़ाकर
  rationale: आसपास की बलि-संबंधी शब्दावली में कृषि-उपज को परमेश्वर के सामने अर्पित करने का भाव संभावित है; ‘पहली उपज’ उस आराधनात्मक संदर्भ को व्यक्त करती है, जबकि असामान्य यूनानी प्रयोग की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ἐνώπιόν σου
  choice: तेरे सामने
  rationale: प्रार्थना के सीधे संबोधन और उपासना-संबंधी उपस्थिति, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εὑρεῖν ἔλεος
  choice: दया पा सकें
  rationale: यूनानी ‘दया पाना’ की बाइबलीय अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: इस समय
  rationale: वर्तमान अभाव पर विलाप के तात्कालिक बल को स्पष्ट और सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: निर्वासन अथवा मन्दिर-विहीनता के प्रसंग में अधिकार और उपासना-संबंधी पदों की शृंखला
  choice: शासक, नबी और अगुआ तथा होमबलि, बलिदान, भेंट और धूप—सभी को अलग-अलग रखा गया है।
  alternative: पूरी सूची को ‘कोई अगुआ नहीं और कोई बलि-भेंट नहीं’ जैसे संक्षिप्त सार में बदलना।
  rationale: मूल पद दोनों प्रकार की वंचना—नेतृत्व और मन्दिर-उपासना—को संचयी ढंग से उभारता है; प्रत्येक पद को बचाने से विलाप का आलंकारिक भार बना रहता है।
- issue: τοῦ καρπῶσαι का अर्थ
  choice: पहली उपज चढ़ाना
  alternative: उपज चढ़ाना; भेंट चढ़ाना
  rationale: बलि और भेंट की निकटवर्ती शब्दावली कृषि-उपज अथवा प्रथम फल के आराधनात्मक अर्पण की ओर संकेत करती है, पर क्रिया असामान्य है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं और अनिश्चितता को सिद्धान्तगत निष्कर्ष नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थना के अनुरूप रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ मूल के σου को दर्शाता है। समानांतर नकारात्मक सूची को अर्धविरामों से बाँटा गया है ताकि पद की संचयी लय और स्पष्टता बनी रहे।
