translation:
  language: hi
  text: हे आग और तपन, प्रभु को धन्य कहो; उसका स्तुतिगान करो और उसे युगानुयुग अति ऊँचा उठाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का अर्थ प्रभु के विषय में भला कहना या उसे धन्य कहना है। यह गीत के बार-बार आने वाले उपासना-सूत्र को केवल सामान्य ‘स्तुति करो’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: πῦρ
  choice: आग
  rationale: यह सृष्टि के एक तत्त्व के रूप में आग का सीधा उल्लेख है; ‘आग’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: καῦμα
  choice: तपन
  rationale: शब्द तीव्र गरमी या जलाने वाली गरमी को सूचित करता है। ‘तपन’ ‘आग’ से अर्थगत भेद बनाए रखते हुए काव्यात्मक और सुबोध है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος को दिव्य उपाधि के रूप में ‘प्रभु’ कहना आधुनिक हिन्दी के बाइबलीय और उपासना-संबंधी प्रयोग में स्वाभाविक है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया विशेष रूप से गाकर स्तुति करने का भाव रखती है; ‘स्तुतिगान करो’ उस संगीतमय अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अति महान ठहराओ
  rationale: क्रिया में अत्यधिक ऊँचा उठाने या महिमा देने का प्रबल भाव है। परमेश्वर को संबोधित हिन्दी में ‘अति महान ठहराओ’ उस तीव्रता को बनाए रखता है और भौतिक रूप से उठाने का भ्रम नहीं देता।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह अनंत काल तक बने रहने का मुहावरा है। ‘युगानुयुग’ हिन्दी के गरिमापूर्ण उपासना-रजिस्टर में स्वाभाविक रूप से ‘सदा’ या ‘सर्वदा’ का विस्तृत कालबोध देता है।
theological_decisions:
- issue: इस यूनानी उपासना-सूत्र में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: यूनानी पाठ में κύριος दिव्य उपाधि है, पर स्वयं इब्रानी दिव्य नाम नहीं दिया गया। इसलिए ‘प्रभु’ स्रोत का सम्मान करता है और ऐसा दिव्य नाम आरोपित नहीं करता जो यूनानी में प्रत्यक्ष नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामूहिक उपासना के योग्य शैली अपनाई गई है। संबोधित सृष्टि-तत्त्वों के कारण ‘हे’ रखा गया है। ‘धन्य कहो’, ‘स्तुतिगान करो’ और ‘अति महान ठहराओ’ तीन अलग यूनानी क्रियाओं के भेद को सुरक्षित रखते हैं।
