translation:
  language: hi
  text: हे समस्त आत्माओ, प्रभु को धन्य कहो; उसका गुणगान करो और उसे युगानुयुग अत्यन्त महिमामंडित करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का यह अनुवाद स्तुतिपरक और उपासना-संबंधी भाव बनाए रखता है तथा गीत में बार-बार आने वाले आह्वान के अनुकूल है।
- source_word: πάντα τὰ πνεύματα
  choice: हे समस्त आत्माओ
  rationale: यह पद सम्बोधन में है। πνεύματα का सीधा अर्थ यहाँ आत्मिक प्राणियों या शक्तियों के रूप में ‘आत्माएँ’ हो सकता है; ‘पवनें’ भी शब्दार्थ की दृष्टि से सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: यह यहूदी-यूनानी स्तुतिगीत में परमेश्वर के लिए प्रयुक्त श्रद्धासूचक उपाधि है; आधुनिक हिन्दी में ‘प्रभु’ इसका स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: ὑμνεῖτε
  choice: उसका गुणगान करो
  rationale: क्रिया में गीत या स्तुतिगान करने का भाव है। ‘गुणगान करो’ आधुनिक हिन्दी में इस संगीतमय स्तुति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: उसे अत्यन्त महान ठहराओ
  rationale: उपसर्ग सहित यह क्रिया अत्यधिक ऊँचा उठाने या महिमामंडित करने का भाव देती है। यह रूप तीव्रता को बनाए रखते हुए हिन्दी में परमेश्वर की स्तुति के संदर्भ में स्वाभाविक है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह स्थायी कालगत अभिव्यक्ति अनन्त अवधि का बोध कराती है; ‘युगानुयुग’ स्तुतिगीत की गरिमा और निरन्तरता दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस स्तुतिपरक यहूदी-यूनानी संदर्भ में κύριος परमेश्वर की श्रद्धासूचक उपाधि है। ‘प्रभु’ प्रचलित और संदर्भानुकूल है, जबकि ‘स्वामी’ यहाँ अनावश्यक रूप से लौकिक अर्थ की ओर झुक सकता है।
- issue: πνεύματα से अभिप्रेत सत्ता या प्राकृतिक शक्ति
  choice: आत्माएँ
  alternative: पवनें
  rationale: मूल शब्द दोनों अर्थ दे सकता है। मुख्य पाठ में सर्वाधिक सीधा व्यक्तिपरक सम्बोधन ‘आत्माएँ’ रखा गया है, पर वास्तविक शब्दार्थगत अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक स्तुतिगान के योग्य रखी गई है। सम्बोधन को स्पष्ट करने के लिए ‘हे’ का प्रयोग किया गया है, और मूल के दोनों आज्ञार्थक पदों तथा तीव्रतासूचक भाव को बनाए रखा गया है।
