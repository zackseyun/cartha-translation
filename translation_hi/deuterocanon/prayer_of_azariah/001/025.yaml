    reason: यूनानी क्रिया ἐνεπύρισεν का अधिक औपचारिक अनुवाद ‘आग लगा दी’ हो सकता है; मुख्य पाठ में ‘जला डाला’ प्रसंग के विनाशकारी परिणाम को व्यक्त करता है।
lexical_decisions:
- source_word: διώδευσεν
  choice: आगे बढ़ी
  rationale: क्रिया किसी स्थान से होकर आगे जाने का भाव देती है। प्रसंग में इसका कर्ता पिछले वाक्य की आग है; ‘आगे बढ़ी’ उसके फैलाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यूनानी से अधिक विनाशकारी अर्थ जोड़ने के।
- source_word: ἐνεπύρισεν
  choice: जला डाला
  rationale: यह क्रिया आग लगा देने या जला देने का अर्थ रखती है। यहाँ ‘जला डाला’ प्रसंग के विनाशकारी परिणाम को सहज और सशक्त हिन्दी में व्यक्त करता है।
- source_word: οὓς εὗρεν
  choice: जितने ... उसने पाया
  rationale: सम्बन्धवाचक वाक्यांश का दायरा अनिश्चित है और वहाँ मिले सभी लोगों को समेटता है। ‘जितने ... पाया’ इस भाव को सुरक्षित रखता है।
- source_word: περὶ τὴν κάμινον
  choice: भट्ठी के चारों ओर
  rationale: περί के साथ कर्मकारक यहाँ स्थान-सूचक है; ‘चारों ओर’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: τῶν Χαλδαίων
  choice: कसदियों
  rationale: यूनानी जातिनाम Χαλδαῖοι का पारंपरिक और स्रोत-सम्मत हिन्दी रूप ‘कसदी’ रखा गया है; इसे सामान्यीकृत करके ‘बाबुलवासी’ नहीं किया गया।
