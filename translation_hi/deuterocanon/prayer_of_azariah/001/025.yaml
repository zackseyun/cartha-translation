translation:
  language: hi
  text: और वह वहाँ से होकर गुज़री और भट्ठी के चारों ओर जिन कसदियों को उसने पाया, उन्हें जला डाला[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
