translation:
  language: hi
  text: हे आकाश के तारो, प्रभु को धन्य कहो; उसका स्तुतिगान करो और सदा-सर्वदा उसे अत्यन्त ऊँचा उठाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का अर्थ परमेश्वर के विषय में भला कहना या उसे धन्य कहना है। यह आवर्ती स्तुतिपरक आह्वान को ‘स्तुति करो’ में समेटे बिना सुरक्षित रखता है।
- source_word: ἄστρα τοῦ οὐρανοῦ
  choice: आकाश के तारो
  rationale: ἄστρα का सीधा अर्थ ‘तारे’ है और τοῦ οὐρανοῦ उनके क्षेत्र को बताता है। संबोधन के कारण हिन्दी में ‘तारो’ स्वाभाविक है; ‘आकाश’ दृश्य नभ और ऊर्ध्व लोक, दोनों की मूल अभिव्यक्ति की व्यापकता बनाए रखता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος यहाँ परमेश्वर की उपाधि है। ‘प्रभु’ आधुनिक धार्मिक हिन्दी में स्वाभाविक और प्रतिष्ठित समतुल्य है; यह यूनानी पाठ से परे जाकर विशिष्ट हिब्रू दिव्य-नाम संकेत नहीं जोड़ता।
- source_word: ὑμνεῖτε
  choice: उसका स्तुतिगान करो
  rationale: क्रिया में भजन या गीत के रूप में स्तुति करने का भाव है। ‘स्तुतिगान करो’ उसके संगीतमय और आराधनात्मक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: उसे अति महान मानो
  rationale: संयुक्त क्रिया अत्यधिक ऊँचा करने या महान ठहराने का तीव्र भाव रखती है। हिन्दी में ‘अति महान मानो’ उपासना में परमेश्वर को सर्वोच्च ठहराने का भाव स्वाभाविक ढंग से देता है, बिना भौतिक रूप से उठाने का भ्रम पैदा किए।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: बहुवचन युगों वाला यह उपासना-सूत्र निरंतरता और चिरस्थायित्व व्यक्त करता है। ‘सदा-सर्वदा’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: यूनानी साक्ष्य केवल κύριος देता है। ‘प्रभु’ दिव्य उपाधि को ठीक रूप में व्यक्त करता है; ‘यहोवा’ यूनानी पाठ में स्पष्ट न किए गए हिब्रू नाम को आयात करेगा, जबकि ‘स्वामी’ इस स्तुतिपरक संदर्भ में अपेक्षाकृत सांसारिक लग सकता है।
- issue: सृष्टि द्वारा परमेश्वर को ‘धन्य कहने’ का भाव
  choice: धन्य कहो
  alternative: आशीष दो / स्तुति करो
  rationale: यहाँ सृष्ट प्राणी परमेश्वर को कोई वरदान नहीं देते, बल्कि उसके धन्य और प्रशंसनीय होने की घोषणा करते हैं। ‘धन्य कहो’ इस तनाव को बनाए रखता है और अगली अलग क्रिया ὑμνεῖτε के साथ अनावश्यक समानता से बचता है।
