translation:
  language: hi
  text: हे पाले और ठंड, प्रभु को धन्य कहो; उसका गुणगान करो और उसे युगानुयुग अति महान ठहराओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया सृष्टि के तत्वों को प्रभु का आशीर्वादात्मक स्तुतिगान करने के लिए बुलाती है। ‘धन्य कहो’ इसकी उपासना-संबंधी भाषा को बनाए रखता है।
- source_word: πάγος
  choice: पाला
  rationale: πάγος का अर्थ पाला या बर्फ हो सकता है। ψῦχος के साथ इस काव्यात्मक युग्म में वायुमंडलीय ‘पाला’ अधिक उपयुक्त है।
- source_word: ψῦχος
  choice: ठंड
  rationale: यह संज्ञा ठंड या शीत को दर्शाती है; आधुनिक हिन्दी में ‘ठंड’ सीधा और सहज है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος के लिए ‘प्रभु’ मानक, प्रतिष्ठित और इस स्तुतिगीत के अनुरूप हिन्दी रूप है।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: क्रिया में गीत या भजन के द्वारा प्रशंसा करने का भाव है; ‘गुणगान करो’ उस संगीतमय स्तुति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अति महान ठहराओ
  rationale: उपसर्ग सहित यह क्रिया बहुत ऊँचा उठाने या अत्यधिक महिमा करने का गहन भाव रखती है। ‘अति महान ठहराओ’ उस तीव्रता को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह पारंपरिक परंतु सुबोध हिन्दी पद इस स्तुतिगीत में निरंतर और अनंत काल तक की स्तुति व्यक्त करता है।
theological_decisions:
- issue: यूनानी धर्मग्रंथेतर स्तुतिगीत में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल पाठ में κύριον है, कोई प्रत्यक्ष इब्रानी ईश-नाम नहीं। इसलिए ‘प्रभु’ स्रोत के रूप और धार्मिक तनाव को बिना अतिरिक्त विशिष्टीकरण के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और सामूहिक उपासना के योग्य रखी गई है। पाले और ठंड को संबोधित करने के लिए ‘हे’ जोड़ा गया है, जिससे यूनानी संबोधन का आशय हिन्दी में स्पष्ट होता है।
