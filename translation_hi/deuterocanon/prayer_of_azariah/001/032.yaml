lexical_decisions:
- source_word: εὐλογημένος
  choice: धन्य
  rationale: विधेय विशेषण के रूप में प्रयुक्त इस आराधनात्मक संबोधन के लिए ‘धन्य’ मूल यूनानी की स्तुतिपरक शक्ति को बनाए रखता है; ‘आपकी स्तुति हो’ कहने से मूल में निहित न होने वाला आज्ञार्थक भाव जुड़ जाता।
- source_word: ἐπὶ θρόνου
  choice: सिंहासन पर
  rationale: ἐπί के साथ संबंधकारक का यहाँ सीधा स्थानवाचक अर्थ है। ‘सिंहासन पर’ ठोस राजकीय बिंब को बिना अतिरिक्त क्रियात्मक अर्थ जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς βασιλείας σου
  choice: अपने राज्य के
  rationale: βασιλεία का अर्थ ‘राज्य’, ‘राजत्व’ या ‘शासन’ हो सकता है। ‘अपने राज्य के सिंहासन’ हिन्दी में स्वाभाविक है और राजकीय प्रभुता का भाव भी बनाए रखता है।
- source_word: ὑπερυμνητός
  choice: अत्यन्त स्तुत्य
  rationale: यह संयुक्त शब्द स्तुति के भाव को तीव्र करता है। ‘अत्यन्त स्तुत्य’ संक्षिप्त, गरिमापूर्ण और आराधनात्मक भाषा के अनुकूल है।
- source_word: ὑπερυψωμένος
  choice: अत्यन्त महान
  rationale: मूल शब्द अत्यधिक ऊँचा किए जाने या सर्वोच्च रूप से महिमान्वित होने का भाव देता है। परमेश्वर के लिए हिन्दी में ‘अत्यन्त महान’ स्वाभाविक है और असहज शाब्दिक वाक्यांश ‘अत्यन्त ऊँचे किए गए’ से बचते हुए उत्कर्ष का भाव रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: यह यूनानी मुहावरा अनन्त निरंतरता व्यक्त करता है। ‘सदा-सर्वदा’ आधुनिक हिन्दी में स्पष्ट होने के साथ आराधनात्मक लय भी बनाए रखता है।
theological_decisions:
- issue: प्रत्यक्ष आराधनात्मक संबोधन और सिंहासन का बिंब
  choice: ‘आप अपने राज्य के सिंहासन पर धन्य हैं’—परमेश्वर को सीधे संबोधित करते हुए सिंहासन का ठोस बिंब बनाए रखा गया है।
  alternative: ‘आप अपने राजत्व के सिंहासन पर धन्य हैं’ अथवा ‘अपने राजसिंहासन पर विराजमान आप धन्य हैं।’
  rationale: चुना हुआ पाठ यूनानी की संक्षिप्त रचना और प्रत्यक्ष द्वितीय-पुरुष संबोधन को सुरक्षित रखता है। ‘विराजमान’ जोड़ने से ऐसा क्रियात्मक भाव आता जो मूल में स्पष्ट नहीं है; ‘राज्य’ βασιλεία के अन्य संभावित अर्थों को पादटिप्पणी में खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु स्तुतिगान के अनुरूप गरिमापूर्ण और लयात्मक रखी गई है। ‘आप’ का प्रयोग प्रत्यक्ष संबोधन को स्पष्ट करता है; ‘अत्यन्त स्तुत्य’ और ‘सदा-सर्वदा’ आराधनात्मक शैली को बनाए रखते हैं।
