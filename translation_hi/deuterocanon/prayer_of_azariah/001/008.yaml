base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/008.yaml
  text: And now[a], all that you have brought upon us, and all that you have done to us, you have done in true judgment[b],
translation:
  language: hi
  text: और अब, जो कुछ तू हम पर लाया है और जो कुछ तूने हमारे साथ किया है, वह सब तूने सच्चे न्याय के अनुसार किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सच्चे न्याय में किया है,” “धर्ममय न्याय के अनुसार किया है,” अथवा “न्यायपूर्वक किया है।”
    reason: ἐν ἀληθινῇ κρίσει में ‘सच्चा’, ‘धर्ममय’ या ‘न्यायपूर्ण’ तथा ‘में’, ‘के अनुसार’ या क्रियाविशेषणीय अर्थ की सम्भावना है।
lexical_decisions:
- source_word: νῦν
  choice: अब
  rationale: यह कालवाचक क्रियाविशेषण वर्तमान में परमेश्वर के कार्यों को स्वीकार करने पर बल देता है; ‘अब’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: πάντα ὅσα
  choice: जो कुछ … वह सब
  rationale: यह विन्यास यूनानी पदबंध की व्यापकता और समग्रता को स्वाभाविक हिन्दी में बनाए रखता है। दोनों समानांतर उपवाक्यों में ‘जो कुछ’ की पुनरावृत्ति मूल की पुनरावृत्ति को सुरक्षित रखती है।
- source_word: ἐπήγαγες
  choice: तू हम पर लाया है
  rationale: यह विपत्ति या परिणाम को किसी पर ले आने का भाव रखता है, पर ‘दण्ड दिया’ जैसे अधिक व्याख्यात्मक शब्द से बचता है।
- source_word: ἐποίησας ἡμῖν
  choice: तूने हमारे साथ किया है
  rationale: संदर्भ में यह लोगों के साथ हुए व्यवहार को बताता है। ‘हमारे लिए किया’ प्रतिकूल संदर्भ को उलट देता, जबकि ‘हमारे साथ किया’ हिन्दी में स्वाभाविक रहते हुए आशय सुरक्षित रखता है।
- source_word: ἐν ἀληθινῇ κρίσει
  choice: सच्चे न्याय के अनुसार
  rationale: ‘सच्चे’ से ἀληθινῇ और ‘न्याय’ से κρίσει का मूल अर्थ बना रहता है। ‘के अनुसार’ हिन्दी में ἐν द्वारा व्यक्त मानक या ढंग को स्वाभाविक रूप देता है।
- source_word: ἐποίησας
  choice: किया है
  rationale: वर्तमान पूर्ण रूप अतीत में किए गए कार्यों को वक्ता की वर्तमान स्वीकारोक्ति से जोड़ता है।
theological_decisions:
- issue: वक्ताओं पर आए संकटों में परमेश्वर की भूमिका और उनके न्याय का स्वरूप
  choice: पद स्पष्ट रूप से स्वीकार करता है कि जो कुछ परमेश्वर उन पर लाया और उसने उनके साथ जो किया, वह सच्चे न्याय के अनुसार था।
  alternative: ‘न्यायपूर्वक किया है’ या ‘धर्ममय न्याय से किया है’ कहा जा सकता है।
  rationale: अनुवाद परमेश्वर की सक्रिय भूमिका को नरम नहीं करता और ἀληθινῇ κρίσει को ‘सच्चे न्याय’ के रूप में बनाए रखता है; साथ ही पद से आगे बढ़कर प्रतिफल या दण्ड का कोई विस्तृत सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर को संबोधित करते हुए निकटता और पारम्परिक प्रार्थना-शैली के अनुरूप एकवचन ‘तू’ रखा गया है। मूल के दोनों समानांतर खण्ड और परमेश्वर की सक्रिय भूमिका सुरक्षित हैं।
