base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/065.yaml
  text: Bless the Lord[a], Hananiah, Azariah, and Mishael; sing praise to him and highly exalt him forever. For he has delivered us from Hades, and saved us from the hand of death, and rescued us from the midst of the burning flame, and redeemed us from the fire.
translation:
  language: hi
  text: हे हनन्याह, अजर्याह और मीशाएल, प्रभु को धन्य कहो; उसका गुणगान करो और सदा-सर्वदा उसकी अत्यन्त बड़ाई करो। क्योंकि उसने हमें अधोलोक[a] से छुड़ाया, मृत्यु के हाथ से बचाया, धधकती ज्वाला के बीच से हमारा उद्धार किया, और आग से हमें मुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कब्र से।’ यूनानी में ‘अधोलोक’ अर्थात् मृतकों का लोक है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक का ऐसा स्वाभाविक हिन्दी रूप जो परमेश्वर की स्तुति में बोले जाने वाले आशीर्वचन का भाव बनाए रखता है; केवल ‘स्तुति करो’ करने से ὑμνεῖτε के साथ भेद मिट जाता।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यहूदी-यूनानी आराधनात्मक प्रसंग में κύριος का प्रचलित और गरिमापूर्ण हिन्दी दैवी शीर्षक।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: गीत अथवा भजन के द्वारा स्तुति करने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त बड़ाई करो
  rationale: उपसर्ग द्वारा तीव्र किए गए ‘ऊँचा उठाने/महिमा करने’ के भाव को स्वाभाविक आराधनात्मक हिन्दी में सुरक्षित रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: युगों तक बने रहने वाले आराधनात्मक भाव का प्रचलित और सहज हिन्दी रूप।
- source_word: ἐξείλετο
  choice: छुड़ाया
  rationale: संकट से बाहर निकालने के पूर्ण हुए कार्य को व्यक्त करता है और आगे आने वाले उद्धार-संबंधी क्रियापदों से कुछ भेद रखता है।
- source_word: ἐξ ᾅδου
  choice: अधोलोक से
  rationale: ᾅδης को केवल कब्र या मृत्यु में सीमित किए बिना मृतकों के लोक की धारणा को हिन्दी में व्यक्त करता है।
- source_word: ἔσωσεν
  choice: बचाया
  rationale: यहाँ σώζω ठोस प्राण-संकट से रक्षा को सूचित करता है; ‘बचाया’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से केवल आध्यात्मिक उद्धार का संकेत नहीं देता।
- source_word: ἐκ χειρὸς θανάτου
  choice: मृत्यु के हाथ से
  rationale: यूनानी में सुरक्षित सामी मुहावरे और मृत्यु के मानवीकरण को यथासम्भव प्रत्यक्ष रूप में बनाए रखता है।
- source_word: ἐρρύσατο
  choice: उद्धार किया
  rationale: भयंकर खतरे के भीतर से छुड़ाने की सशक्त क्रिया को व्यक्त करता है और पिछले ‘बचाया’ से शैलीगत भेद बनाए रखता है।
- source_word: ἐκ μέσου καιομένης φλογός
  choice: धधकती ज्वाला के बीच से
  rationale: व्यक्तियों के ज्वाला के भीतर होने और वहीं से निकाले जाने की मूल छवि को संक्षिप्त, जीवंत हिन्दी में रखता है।
- source_word: ἐλυτρώσατο
  choice: मुक्त किया
  rationale: λυτρόω के बन्धन अथवा संकट से छुड़ाने के मूल भाव को इस ठोस अग्नि-उद्धार प्रसंग में स्वाभाविक रूप से देता है, जबकि उसके विमोचन-संबंधी अर्थ को भी बनाए रखता है।
theological_decisions:
- issue: मृत्यु के संकट से छुड़ाए जाने के धन्यवाद में ᾅδης का अनुवाद
  choice: अधोलोक से
  alternative: कब्र से
  rationale: यूनानी पाठ स्पष्टतः ᾅδης कहता है। ‘अधोलोक’ मृतकों के लोक की व्यापक और कुछ हद तक खुली छवि को सुरक्षित रखता है; ‘कब्र’ अधिक व्याख्यात्मक और संकीर्ण है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: ἐλυτρώσατο के विमोचनात्मक अर्थ का प्रस्तुतीकरण
  choice: मुक्त किया
  alternative: छुड़ाया / मोल लेकर छुड़ाया
  rationale: इस प्रसंग में क्रिया आग से वास्तविक बचाव बताती है। ‘मुक्त किया’ विमोचन की प्रतिध्वनि रखता है, पर यूनानी में यहाँ किसी स्पष्ट मूल्य अथवा मोल का उल्लेख न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण आराधनात्मक स्तर रखा गया है। ‘धन्य कहो’, ‘गुणगान करो’ और ‘अत्यन्त बड़ाई करो’ समानार्थी क्रियाओं को एक में मिलाए बिना यूनानी पदक्रम की काव्यात्मक पुनरुक्ति बनाए रखते हैं। तीनों नामों के प्रचलित हिन्दी बाइबलीय रूप प्रयुक्त हैं।
