translation:
  language: hi
  text: पृथ्वी पर उगनेवाली सभी वस्तुएँ प्रभु को धन्य कहें; उसका स्तुतिगान करें और उसे सदा-सर्वदा अत्यन्त ऊँचा उठाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का अर्थ प्रभु के विषय में भला कहना या उसे धन्य कहना है। यह आवर्ती उपासना-वाक्य की विशिष्टता को सामान्य ‘स्तुति करो’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: πάντα τὰ φυόμενα
  choice: उगनेवाली सभी चीज़ो
  rationale: φύω का वर्तमान कृदन्त उन सभी वस्तुओं को समेटता है जो उगती या अंकुरित होती हैं। यह अभिव्यक्ति केवल ‘वनस्पति’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करती। संबोधन के कारण ‘चीज़ो’ रूप प्रयुक्त है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: ἐπί के साथ संबंधकारक यहाँ स्थान का सामान्य अर्थ ‘पृथ्वी पर’ देता है, न कि ‘पृथ्वी से’।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος के लिए स्वाभाविक, प्रतिष्ठित हिन्दी समतुल्य ‘प्रभु’ है; कर्मकारक चिह्न ‘को’ यूनानी वाक्य में क्रिया के कर्म को स्पष्ट करता है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया में गीत अथवा भजन के द्वारा स्तुति करने का भाव है। ‘स्तुतिगान करो’ संगीतात्मक अर्थ को केवल ‘स्तुति करो’ से अधिक स्पष्ट रखता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महिमा करो
  rationale: उपसर्ग ὑπερ- ऊँचा उठाने या महिमा करने की क्रिया को तीव्र करता है। ‘अत्यन्त महिमा करो’ हिन्दी में इस प्रबल भाव को स्वाभाविक और उपासनात्मक ढंग से व्यक्त करता है।
- source_word: αὐτὸν
  choice: उसकी
  rationale: सर्वनाम का संदर्भ प्रभु से है। हिन्दी में ‘महिमा करो’ के साथ संबंधकारक ‘उसकी’ स्वाभाविक संरचना है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: यह उपासनात्मक मुहावरा निरन्तर और अनन्त काल का बोध कराता है। ‘सदा-सर्वदा’ अर्थ और काव्यात्मक आवृत्ति दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: व्यवस्थाविवरणेतर उपासनात्मक वाक्य में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριος है, स्पष्ट रूप से परमेश्वर का कोई निजी नाम नहीं। इसलिए ‘प्रभु’ मूल की शब्दावली को बनाए रखता और वहाँ परमेश्वर का विशिष्ट नाम नहीं जोड़ता जहाँ वह लिखा नहीं है।
