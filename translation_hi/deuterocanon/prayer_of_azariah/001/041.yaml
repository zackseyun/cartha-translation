lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया सृष्टि के तत्वों को प्रभु के विषय में भला कहने अथवा उसे धन्य कहने के लिए बुलाती है। यह आवर्ती उपासना-वाक्य की औपचारिक बनावट भी बनाए रखती है।
- source_word: πᾶς ὄμβρος καὶ δρόσος
  choice: हे समस्त वर्षा और ओस
  rationale: πᾶς को यहाँ सामूहिक अर्थ में लिया गया है। ‘समस्त वर्षा और ओस’ आधुनिक हिन्दी में स्वाभाविक है और दोनों प्राकृतिक तत्वों को संबोधित किए जाने का भाव स्पष्ट करता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος का सीधा और स्वाभाविक हिन्दी रूप ‘प्रभु’ है; यहाँ यह आज्ञार्थक क्रिया का कर्म है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया में गाकर स्तुति करने का भाव है; ‘स्तुतिगान करो’ इस सांगीतिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त ऊँचा मानो
  rationale: उपसर्ग ὑπερ- उत्कटता को प्रकट करता है। परमेश्वर के संबंध में ‘अत्यन्त ऊँचा मानो’ हिन्दी में स्वाभाविक रहते हुए ऊँचा उठाने या महान ठहराने का भाव रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: यह यूनानी मुहावरा निरन्तर और अनन्त काल का बोध कराता है; ‘सदा-सर्वदा’ उपासना-संबंधी हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल यूनानी में सामान्य उपाधि κύριος है। ‘प्रभु’ उसी को सीधे प्रस्तुत करता है और पाठ में स्पष्ट रूप से न दिए गए दिव्य नाम को नहीं जोड़ता।
- issue: ὑπερυψοῦτε में परमेश्वर को ऊँचा करने का भाव
  choice: उसे अत्यन्त ऊँचा मानो
  alternative: उसे अत्यन्त ऊँचा उठाओ
  rationale: ‘ऊँचा मानो’ उपासकों द्वारा उसकी सर्वोच्च महिमा स्वीकार करने का भाव स्वाभाविक हिन्दी में देता है, बिना यह संकेत किए कि परमेश्वर की वास्तविक स्थिति मनुष्यों द्वारा बढ़ाई जाती है।
