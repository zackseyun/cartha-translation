lexical_decisions:
- source_word: καταισχύνῃς
  choice: लज्जित न कर
  rationale: यह क्रिया लज्जित या अपमानित करने का भाव रखती है। प्रार्थना के सीधे संबोधन में ‘लज्जित न कर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ποίησον μεθʼ ἡμῶν ἔλεος
  choice: हम पर दया कर
  rationale: यूनानी का शाब्दिक रूप ‘हमारे साथ दया कर’ है; हिन्दी में ‘हम पर दया कर’ उसी निवेदन को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπιείκειάν
  choice: उदारता
  rationale: यहाँ शब्द कोमलता, नरमी, सहनशीलता और दयापूर्ण उदारता का भाव देता है। ‘उदारता’ सामान्य हिन्दी में सुबोध है और अगले पद के ‘दया’ से इसे अलग भी रखता है।
- source_word: πλῆθος τοῦ ἐλέους
  choice: भरपूर दया
  rationale: πλῆθος प्रचुर मात्रा या बहुतायत दर्शाता है। ‘भरपूर दया’ हिन्दी में सहज रहते हुए इस प्रचुरता को व्यक्त करती है।
- source_word: ἐλέους
  choice: दया
  rationale: पश्चात्तापपूर्ण प्रार्थना के प्रसंग में ἔλεος के लिए ‘दया’ सीधा, पारंपरिक और आधुनिक पाठकों के लिए स्पष्ट है।
theological_decisions:
- issue: ἐπιείκεια और ἔλεος—दो समानार्थी ईश्वरीय गुणों का समानांतर प्रयोग
  choice: ‘उदारता’ और ‘दया’ के रूप में भेद बनाए रखा
  alternative: दोनों को ‘दया’ या ‘करुणा’ से व्यक्त करना
  rationale: यूनानी पाठ दो अलग, यद्यपि संबंधित, शब्दों का प्रयोग करता है। उन्हें अलग रखने से परमेश्वर की दयापूर्ण नरमी और उसकी प्रचुर दया—दोनों के आधार पर की गई विनती सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन आदरसूचक प्रार्थनात्मक संबोधन में सरल, गरिमापूर्ण और सहज भाषा। पद की समानांतर संरचना ‘के अनुसार... और... के अनुसार’ द्वारा सुरक्षित रखी गई है।
