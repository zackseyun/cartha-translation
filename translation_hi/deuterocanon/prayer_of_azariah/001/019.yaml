review_pass:
  verdict: revise
  source_fidelity: ‘लज्जित न कर’ appropriately renders μὴ καταισχύνῃς, and ‘हम पर दया कर’ is a natural Hindi rendering of ποίησον μεθʼ ἡμῶν ἔλεος. The parallel appeal ‘के अनुसार ... और ... के अनुसार’ is retained. However, ‘उदारता’ primarily denotes generosity in modern Hindi and does not adequately convey ἐπιείκεια, which here denotes lenience, gentle fairness, or clemency.
  naturalness: The sentence is fluent, prayerful modern Hindi. ‘अपनी दया की बहुतायत’ is slightly more idiomatic and explicitly represents πλῆθος than ‘भरपूर दया’.
  terminology: Replace ‘उदारता’ with ‘कृपालुता’ to preserve the distinction between ἐπιείκεια (gracious lenience/gentleness) and ἔλεος (दया), without importing a doctrinal interpretation. The direct singular prayer form is consistent throughout the verse, despite the draft note incorrectly describing it as honorific.
  issues:
  - severity: medium
    issue: ‘उदारता’ is imprecise for ἐπιείκεια.
    rationale: In current Hindi, ‘उदारता’ normally means generosity or liberality. The Greek denotes lenience or gracious gentleness, especially in a plea for mercy. ‘कृपालुता’ better communicates this quality while remaining distinct from ‘दया’.
  - severity: low
    issue: ‘भरपूर दया’ somewhat compresses πλῆθος τοῦ ἐλέους.
    rationale: It is understandable, but ‘अपनी दया की बहुतायत’ more directly conveys the noun phrase ‘the abundance of your mercy’ and preserves the source’s formal parallelism.
  revised_text: हमें लज्जित न कर, बल्कि अपनी कृपालुता के अनुसार और अपनी दया की बहुतायत के अनुसार हम पर दया कर।
