translation:
  language: hi
  text: हे आकाशो, प्रभु को धन्य कहो; उसका स्तुतिगान करो और उसे युगानुयुग अत्यन्त ऊँचा उठाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का मूल भाव किसी के विषय में भला कहना या उसे धन्य कहना है। यह चयन गीत की आवर्ती उपासना-भाषा को सुरक्षित रखता है और अगले ὑμνεῖτε से अलग रहता है।
- source_word: οὐρανοί
  choice: हे आकाशो
  rationale: यह संबोधन में प्रयुक्त बहुवचन है। ‘हे आकाशो’ काव्यात्मक प्रत्यक्ष संबोधन और यूनानी बहुवचन दोनों को व्यक्त करता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος के लिए स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य ‘प्रभु’ है; यूनानी पाठ में इब्रानी परमेश्वर-नाम प्रत्यक्ष रूप से नहीं है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया गाकर स्तुति करने का भाव रखती है। ‘स्तुतिगान करो’ आधुनिक हिन्दी में उसके संगीतमय अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महान ठहराओ
  rationale: यह तीव्रतासूचक संयुक्त क्रिया अत्यधिक ऊँचा उठाने या महिमामंडित करने का भाव देती है। ‘अत्यन्त महान ठहराओ’ सृष्टि द्वारा परमेश्वर को भौतिक रूप से उठाने की अनचाही छवि से बचते हुए तीव्रता बनाए रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: युगों तक बने रहने की इस मुहावरेदार अभिव्यक्ति का स्वाभाविक हिन्दी रूप ‘सदा’ है।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: स्रोत यूनानी में κύριον है, प्रत्यक्ष इब्रानी चतुरक्षरीय परमेश्वर-नाम नहीं। इसलिए ‘प्रभु’ स्रोत-साक्ष्य को बिना अतिरिक्त विशिष्टता जोड़े दर्शाता है।
- issue: ὑπερυψοῦτε में सृष्टि द्वारा परमेश्वर को ऊँचा करने का भाव
  choice: अत्यन्त महान ठहराओ
  alternative: उसे सबसे अधिक ऊँचा उठाओ
  rationale: यूनानी क्रिया प्रबल महिमामंडन व्यक्त करती है। चुना हुआ रूप यह theological tension बनाए रखता है कि उपासक परमेश्वर की अंतर्निहित महानता को स्वीकार और घोषित करते हैं, न कि उसे वास्तविक रूप से अधिक महान बनाते हैं।
