translation:
  language: hi
  text: क्योंकि हमने हर बात में पाप किया है, और तुझसे मुँह मोड़कर व्यवस्था के विरुद्ध आचरण किया है; हमने हर बात में घोर पाप किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम खंड की यूनानी क्रिया पहले आए ‘पाप किया है’ से अधिक प्रबल है; इसका अर्थ ‘बहुत भारी पाप किया है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: हमने … पाप किया है
  rationale: अओरिस्ट क्रिया को स्वीकारोक्ति के वर्तमान प्रसंग में स्वाभाविक हिन्दी पूर्ण पक्ष से व्यक्त किया गया है।
- source_word: ἐν πᾶσι
  choice: हर बात में
  rationale: यह व्यापक अभिव्यक्ति यूनानी वाक्यांश की समग्रता बनाए रखती है और 'हर प्रकार से' जैसी अधिक व्याख्यात्मक दिशा तय नहीं करती।
- source_word: ἠνομήσαμεν
  choice: व्यवस्था के विरुद्ध आचरण किया है
  rationale: यह ἀνομέω में निहित व्यवस्था-विरोधी भाव को केवल सामान्य 'गलत काम किया' कहकर हल्का नहीं करता।
- source_word: ἀποστῆναι ἀπὸ σοῦ
  choice: तुझसे मुँह मोड़कर
  rationale: यह अलग हो जाने या विमुख होने के संबंधपरक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और इसे पिछले व्यवस्था-विरोधी आचरण की रीति के रूप में जोड़ता है।
- source_word: ἐξημάρτομεν
  choice: घोर पाप किया है
  rationale: मूल क्रिया पहले प्रयुक्त ἡμάρτομεν से अधिक प्रबल है; 'घोर' उस तीव्रता को संक्षेप और स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: पहली और अंतिम पाप-स्वीकारोक्ति में प्रयुक्त दो संबंधित, किंतु भिन्न बल वाली यूनानी क्रियाओं का अंतर
  choice: पहली को 'पाप किया है' और अंतिम को 'घोर पाप किया है' कहा गया है।
  alternative: दोनों स्थानों पर केवल 'पाप किया है' कहना।
  rationale: अंतिम यूनानी क्रिया की तीव्रता बनाए रखने से स्वीकारोक्ति का बढ़ता हुआ बल सुरक्षित रहता है और दोनों क्रियाएँ अनावश्यक रूप से समान नहीं कर दी जातीं।
- issue: ἀποστῆναι को ἠνομήσαμεν से जोड़ने का संबंध
  choice: '''तुझसे मुँह मोड़कर व्यवस्था के विरुद्ध आचरण किया है''—अर्थात विमुख होना उस व्यवस्था-विरोधी आचरण की रीति बताता है।'
  alternative: '''व्यवस्था के विरुद्ध आचरण किया, ताकि तुझसे दूर हो जाएँ''—इसे उद्देश्य बताना।'
  rationale: इस प्रसंग में infinitive को रीति या विषय-वस्तु के रूप में समझना स्वीकारोक्ति के संबंधपरक अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है, जबकि उद्देश्य वाला अर्थ अनावश्यक रूप से इरादा निश्चित कर देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थनात्मक हिन्दी अपनाई गई है। परमेश्वर के सीधे संबोधन में पारंपरिक किंतु अब भी सहज एकवचन ‘तुझसे’ रखा गया है। अर्धविराम अंतिम, अधिक प्रबल स्वीकारोक्ति को उभारता है।
