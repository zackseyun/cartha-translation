base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/021.yaml
  text: And let all who show evil to your servants be put to shame[a], and let them be disgraced from all their dominion[c][b], and let their strength be broken.
translation:
  language: hi
  text: और वे सभी लज्जित किए जाएँ जो तेरे दासों[a] के विरुद्ध बुराई करते हैं[b]; वे अपने सारे प्रभुत्व में अपमानित हों[c], और उनका बल चूर-चूर हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दासों’ का अर्थ ऐसे लोग हैं जो पूरी तरह परमेश्वर के हैं; इसका अनुवाद ‘सेवकों’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘जो तेरे दासों को बुरी बातें/बुराई दिखाते हैं’; आशय उनके विरुद्ध बुरा करने या उन्हें हानि पहुँचाने से है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पदबंध का निकट शाब्दिक रूप ‘उनके समस्त प्रभुत्व से’ है और इसका संबंध कुछ हद तक अस्पष्ट है। इसे ‘अपने सारे सामर्थ्य के रहते भी’, ‘अपने समस्त प्रभुत्व के संबंध में’, या ‘अपने प्रभुत्व से रहित होकर’ भी समझा जा सकता है।
    reason: textual_ambiguity
