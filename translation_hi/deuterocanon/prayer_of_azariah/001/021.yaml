- source_word: τοῖς δούλοις σου
  choice: तेरे दासों
  rationale: ‘दास’ आधुनिक हिन्दी में इस धार्मिक संदर्भ के लिए स्वाभाविक और गरिमापूर्ण है तथा परमेश्वर से पूर्णतः संबद्ध होने का δοῦλος का प्रबल भाव ‘सेवकों’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: καταισχυνθείησαν
  choice: अपमानित हों
