  register: भाषा आधुनिक, गरिमापूर्ण प्रार्थना-शैली की है। ‘तेरे’ का प्रयोग निकट और पारंपरिक एकवचन ईश-संबोधन के लिए किया गया है। समानांतर तीन विनतियों को ‘लज्जित किए जाएँ’, ‘अपमानित हों’ और ‘चूर-चूर हो जाए’ द्वारा स्पष्ट रखा गया है।
