- source_word: ἀπὸ πάσης τῆς δυναστείας
  choice: अपने सारे प्रभुत्व से वंचित होकर
  rationale: ἀπό को वियोग अथवा वंचन के अर्थ में ग्रहण करने से वाक्य स्वाभाविक हिन्दी बनता है। चूँकि पदबंध की संरचना अन्य अर्थ भी स्वीकार कर सकती है, विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἡ ἰσχὺς αὐτῶν συντριβείη
  choice: उनका बल चूर-चूर हो जाए
  rationale: ‘बल’ ἰσχύς के सामर्थ्य-सूचक अर्थ को व्यक्त करता है और ‘चूर-चूर’ συντρίβω की निर्णायक टूटन को सजीव, स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: परमेश्वर के लोगों के लिए δοῦλοι का अनुवाद
  choice: तेरे दासों
  alternative: तेरे सेवकों
  rationale: यहाँ वक्ता परमेश्वर से अपने पूर्ण संबंध और अधीनता के आधार पर प्रार्थना करते हैं। ‘दास’ इस संबंध की प्रबलता बनाए रखता है; फिर भी इसे मनुष्यों की अन्यायी दासता का समर्थन न समझा जाए, इसलिए अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया है।
- issue: शत्रुओं के प्रभुत्व के संबंध में ἀπό का अर्थ
  choice: प्रभुत्व से वंचित होकर
  alternative: अपने सारे सामर्थ्य के रहते भी / अपने समस्त प्रभुत्व के संबंध में
  rationale: यूनानी पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ में वियोग का स्वाभाविक अर्थ चुना गया है, पर अन्य संभावनाओं को निरस्त नहीं किया गया।
