lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: धन्यवाद करो
  rationale: इस स्तुतिपरक आराधना-सूत्र में क्रिया का अर्थ पाप स्वीकार करना नहीं, बल्कि धन्यवाद और स्तुति करना है।
- source_word: τῷ κυρίῳ
  choice: प्रभु का
  rationale: यूनानी κύριος का स्वाभाविक हिन्दी रूप ‘प्रभु’ है; ‘का धन्यवाद करो’ आधुनिक हिन्दी में लक्ष्य-सम्बन्ध को सहज रूप से व्यक्त करता है।
- source_word: χρηστός
  choice: भला
  rationale: χρηστός में भलाई और कृपालुता का भाव है; इस परिचित स्तुति-सूत्र में ‘भला’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा बनी रहती है
  rationale: शाब्दिक अर्थ ‘युग तक’ है, जो यहाँ स्थायी निरन्तरता दर्शाता है; यूनानी के क्रियारहित वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘बनी रहती है’ जोड़ा गया है।
- source_word: τὸ ἔλεος αὐτοῦ
  choice: उसकी करुणा
  rationale: ἔλεος दया अथवा करुणा को दर्शाता है। ‘करुणा’ यहाँ आराधनात्मक भाषा में सहज है और यूनानी शब्द से परे किसी विशेष इब्रानी अर्थ को अनिवार्य नहीं बनाता।
