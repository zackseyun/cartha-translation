  alternative: उसका अटल प्रेम सदा बना रहता है
  rationale: मुख्य पाठ यूनानी ἔλεος के प्रत्यक्ष अर्थ ‘करुणा’ को रखता है। प्रसंग में अटल प्रेम या वाचा-निष्ठा की व्यापक अनुगूँज सम्भव है, पर उसे यूनानी पाठ का एकमात्र अर्थ मानकर मुख्य पाठ में नहीं थोपा गया।
