  text: क्योंकि जो कुछ तूने हमारे प्रति किया है, उस सब में तू धर्मी है। तेरे सभी काम सच्चे हैं, तेरे मार्ग सीधे हैं, और तेरे सभी न्याय सच्चे हैं।
