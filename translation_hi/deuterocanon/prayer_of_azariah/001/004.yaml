- source_word: ἀληθινὰ / ἀληθιναί
  choice: सच्चे
  rationale: यह चुनाव सत्यता और विश्वसनीयता की व्यापक धारणा को बनाए रखता है; ‘विश्वासयोग्य’ कहना अर्थ को केवल भरोसेमंदी तक सीमित कर देता।
- source_word: ὁδοί
  choice: मार्ग
  rationale: ‘मार्ग’ परमेश्वर के आचरण और कार्य करने के ढंग के रूपक को सुरक्षित रखता है और हिन्दी बाइबलीय शैली में स्वाभाविक है।
- source_word: εὐθεῖαι
  choice: सीधे
  rationale: यह यूनानी शब्द के मूल स्थानिक रूपक को बिना व्याख्यात्मक रूप से ‘सही’ या ‘खरे’ में बदलने के बनाए रखता है।
- source_word: κρίσεις
  choice: न्याय
  rationale: संदर्भ में यह परमेश्वर के न्यायिक निर्णयों को दर्शाता है। हिन्दी में ‘तेरे सभी न्याय’ गरिमापूर्ण और संक्षिप्त है।
theological_decisions:
- issue: वक्ताओं के दुःख के संबंध में परमेश्वर के प्रत्यक्ष कर्तृत्व का वर्णन
  choice: ‘जो कुछ तूने हमारे साथ किया है’ कहकर प्रत्यक्ष कर्तृत्व बनाए रखा गया है।
  alternative: ‘जो कुछ तूने हमारे साथ होने दिया’ जैसे परोक्ष शब्दों से अनुमति पर बल देना।
  rationale: यूनानी पाठ स्पष्ट रूप से ‘तूने हमारे साथ किया’ कहता है। अनुवाद परमेश्वर की धार्मिकता और वक्ताओं पर आई विपत्ति के बीच के तनाव को कम या हल नहीं करता।
