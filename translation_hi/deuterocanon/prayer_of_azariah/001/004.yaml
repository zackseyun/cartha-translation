lexical_decisions:
- source_word: δίκαιος
  choice: धर्मी
  rationale: यह शब्द परमेश्वर के आचरण की नैतिक सत्यता और न्यायपूर्णता व्यक्त करता है। ‘धर्मी’ इसके व्यापक बाइबलीय अर्थ को बनाए रखता है; केवल ‘न्यायी’ कहना अर्थ को कुछ संकरा कर सकता है।
- source_word: πᾶσιν οἷς ἐποίησας ἡμῖν
  choice: जो कुछ तूने हमारे साथ किया है, उस सब में
  rationale: यह स्वाभाविक हिन्दी में यूनानी पदबंध की व्यापकता तथा वक्ताओं के प्रति परमेश्वर के प्रत्यक्ष कार्य—दोनों को सुरक्षित रखता है।
- source_word: ἔργα
