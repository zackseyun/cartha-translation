  yaml_path: translation/deuterocanon/prayer_of_azariah/001/026.yaml
  text: But the angel of the Lord went down into the furnace together with those around Azariah[a], and drove the flame of the fire out of the furnace,
translation:
  language: hi
  text: परन्तु प्रभु का दूत अजर्याह के आस-पास के लोगों[a] के साथ भट्ठी में उतरा और उसने आग की लपट को भट्ठी से बाहर निकाल दिया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अजर्याह के साथी।” यूनानी में अधिक शाब्दिक रूप से, “अजर्याह के आस-पास के लोग।”
    reason: यूनानी τοῖς περὶ τὸν Ἀζαρίαν के संभावित प्रसंगानुकूल अर्थ को दर्शाते हुए मुख्य पाठ की व्यापक अभिव्यक्ति सुरक्षित रखता है।
lexical_decisions:
- source_word: ὁ δὲ
  choice: परन्तु
  rationale: δέ यहाँ कथा को आगे बढ़ाते हुए पिछले संकट के विपरीत होने वाली घटना की ओर संकेत करता है; ‘परन्तु’ इस हल्के विरोध को स्वाभाविक हिन्दी में रखता है।
- source_word: ἄγγελος Κυρίου
  choice: प्रभु का दूत
  rationale: संज्ञा के साथ निश्चित उपपद और Κυρίου के संबंधकारक को यह स्वाभाविक, प्रतिष्ठित हिन्दी पदबंध ठीक प्रकार व्यक्त करता है।
- source_word: συνκατέβη ἅμα
  choice: के साथ ... उतरा
  rationale: संयुक्त क्रिया और ἅμα दोनों साथ उतरने का भाव देते हैं; हिन्दी में ‘के साथ ... उतरा’ संगति और नीचे की ओर गति दोनों को स्पष्ट रखता है।
- source_word: τοῖς περὶ τὸν Ἀζαρίαν
  choice: अजर्याह के साथियों
  rationale: यूनानी का शाब्दिक अर्थ ‘अजर्याह के आस-पास के लोगों’ है, पर इस प्रसंग में उसके साथियों का संकेत है; मुख्य पाठ में सहज हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: κάμινον
  choice: भट्ठी
  rationale: इस प्रसंग की प्रचंड अग्नि वाली संरचना के लिए ‘भट्ठी’ सामान्य और सटीक आधुनिक हिन्दी शब्द है।
- source_word: ἐξετίναξεν
  choice: बाहर निकाल दिया
  rationale: क्रिया बलपूर्वक झटककर या फेंककर बाहर करने का भाव रखती है; यह चयन परिणाम और बाहर की दिशा को स्पष्ट करता है, बिना क्रिया की किसी अत्यधिक विशिष्ट भंगिमा को थोपे।
- source_word: τὴν φλόγα τοῦ πυρός
  choice: आग की लपट
  rationale: यह यूनानी संबंधकारक पदबंध का स्वाभाविक हिन्दी रूप है और उसकी सजीव छवि बनाए रखता है।
- source_word: ἐκ τῆς καμίνου
  choice: भट्ठी से बाहर
  rationale: ἐκ भीतर से बाहर की गति बताता है; ‘से बाहर’ उस दिशा को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: यूनानी κύριος का प्रत्यक्ष और इस यूनानी कथा में स्वाभाविक हिन्दी रूप ‘प्रभु’ है; यहाँ इब्रानी दिव्य नाम को पाठ में आयात नहीं किया गया।
- issue: ‘प्रभु का दूत’ की पहचान
  choice: पदबंध को बिना अधिक विशिष्ट पहचान दिए बनाए रखना
  alternative: इसे ईश्वर का प्रत्यक्ष प्राकट्य मानना; इसे केवल एक सृजित स्वर्गदूत मानना
  rationale: पद स्वयं इस आकृति को केवल ‘प्रभु का दूत’ कहता है; अनुवाद यह तय नहीं करता कि उसका अस्तित्वगत स्वरूप क्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘अजर्याह’ प्रचलित बाइबलीय नाम-रूप है। पद के अंत का अल्पविराम अगले वाक्यांश से मूल वाक्य की निरंतरता दिखाता है।
