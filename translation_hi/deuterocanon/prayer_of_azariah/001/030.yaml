lexical_decisions:
- source_word: εὐλογημένος
  choice: धन्य
  rationale: ईश्वर को संबोधित स्तुतिपरक प्रयोग में यह सामान्य, गरिमापूर्ण और स्रोत के अर्थ के निकट है।
- source_word: ναῷ
  choice: मंदिर
  rationale: यहाँ ναός पवित्र मंदिर/धाम को सूचित करता है; संदर्भ में ‘मंदिर’ सबसे स्वाभाविक आधुनिक हिन्दी है।
- source_word: τῆς ἁγίας δόξης σου
  choice: आपके पवित्र महिमा के
  rationale: यूनानी संबंधकारक संरचना को निकटता से रखा गया है और ‘पवित्र महिमा’ की जानबूझकर असामान्य धार्मिक छवि सुरक्षित है।
- source_word: ὑπερυμνητὸς
  choice: अत्यन्त स्तुत्य
  rationale: यह विशेषण ‘अत्यधिक प्रशंसा/स्तुति के योग्य’ का भाव रखता है; इसे कर्मवाच्य ‘स्तुति किए गए’ न बनाकर गुणसूचक रखा गया है।
- source_word: ὑπερένδοξος
  choice: परम महिमामय
  rationale: शब्द का अर्थ अत्यन्त गौरवशाली/महिमामय है, न कि ‘अत्यधिक महिमा दिए गए’; इसलिए स्रोत का गुणसूचक स्वरूप सुरक्षित है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह पारंपरिक किंतु आज भी बोधगम्य हिन्दी अभिव्यक्ति अनन्त काल की स्तुतिपरक धारणा व्यक्त करती है।
theological_decisions:
- issue: ὑπερένδοξος को गुणसूचक या कर्मवाच्य रूप में प्रस्तुत करना
  choice: परम महिमामय
  alternative: अत्यन्त महिमा किए गए
  rationale: यूनानी विशेषण स्वयं परम गौरवशाली होने का गुण बताता है; कर्मवाच्य अनुवाद अनावश्यक रूप से किसी द्वारा महिमा दिए जाने का विचार जोड़ता।
- issue: ναός का स्थानगत अर्थ
  choice: मंदिर
  alternative: पवित्रस्थान
  rationale: ‘मंदिर’ व्यापक और स्पष्ट अर्थ देता है, जबकि ‘पवित्रस्थान’ भवन के भीतर किसी अधिक सीमित भाग का संकेत दे सकता है, जो यहाँ आवश्यक नहीं।
