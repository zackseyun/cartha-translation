base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/056.yaml
  text: Bless the Lord[a], sea creatures and all that move in the waters; sing praise to him and highly exalt him forever.
translation:
  language: hi
  text: हे विशाल जलचरो[a] और जल में चलने वाले सभी प्राणियो, प्रभु को धन्य कहो; उसका स्तुतिगान करो और सदा-सर्वदा उसे अत्यन्त ऊँचा उठाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़े समुद्री जीव,” “व्हेल” अथवा “समुद्री दैत्य।” यूनानी शब्द κήτη बड़े जलीय जीवों के लिए एक व्यापक शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक का अर्थ और उपासना-संबंधी ‘bless’ का भाव बनाए रखता है; केवल ‘स्तुति करो’ कहने से अगले ὑμνεῖτε के साथ भेद मिट जाता।
- source_word: κήτη
  choice: विशाल जलचर
  rationale: κήτη सामान्यतः बड़े जलीय जीवों के लिए व्यापक शब्द है। यह चयन ‘व्हेल’ जैसी अनावश्यक संकीर्णता और ‘समुद्री दैत्य’ जैसी पौराणिक छाया से बचता है।
- source_word: πάντα τὰ κινούμενα ἐν τοῖς ὕδασι
  choice: जल में चलनेवाले सभी प्राणियो
  rationale: यूनानी समावेशी कृदन्तीय पदबंध को स्वाभाविक हिन्दी संबोधन में व्यक्त करता है; संदर्भ में गतिमान जीव अभिप्रेत हैं।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος के लिए प्रचलित दैवी उपाधि; यूनानी पाठ में प्रत्यक्ष रूप से चतुरक्षरी हिब्रू नाम नहीं है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया में गाकर स्तुति करने का भाव है, जिसे ‘स्तुतिगान’ संक्षेप और स्वाभाविक रूप से प्रकट करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महान ठहराओ
  rationale: क्रिया के तीव्र उत्कर्षसूचक बल को आधुनिक हिन्दी में व्यक्त करता है और परमेश्वर को भौतिक रूप से ‘ऊँचा उठाने’ की अस्वाभाविक छवि से बचता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: बहुवचन कालसूचक मुहावरे का स्वाभाविक, गरिमापूर्ण हिन्दी समतुल्य है।
theological_decisions:
- issue: व्यवस्थाविवरणेतर स्तुतिगान में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मौजूदा यूनानी स्रोत में κύριος है, प्रत्यक्ष हिब्रू चतुरक्षरी नाम नहीं; इसलिए ‘प्रभु’ स्रोत-पाठ के स्तर को सुरक्षित रखता है।
- issue: ὑπερυψοῦτε में प्राणियों द्वारा परमेश्वर को ऊँचा करने का भाव
  choice: अत्यन्त महान ठहराओ
  alternative: अत्यन्त ऊँचा उठाओ
  rationale: चुना हुआ रूप उपासना में उसकी सर्वोच्च महानता घोषित करने का भाव देता है, बिना यह संकेत किए कि सृष्टि परमेश्वर की वास्तविक महिमा बढ़ाती है; फिर भी आज्ञार्थक की धार्मिक काव्यात्मकता बनी रहती है।
