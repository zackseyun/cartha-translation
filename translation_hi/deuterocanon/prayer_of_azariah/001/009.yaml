  text: और तूने हमें हमारे अधर्मी शत्रुओं और अत्यन्त घृणित विद्रोहियों के हाथों में, और सारी पृथ्वी में सबसे दुष्ट अन्यायी राजा के हाथ में सौंप दिया।
