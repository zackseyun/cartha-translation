lexical_decisions:
- source_word: ἀνόμων
  choice: अधर्मी
  rationale: यह शब्द उन शत्रुओं को नैतिक और धार्मिक व्यवस्था का उल्लंघन करनेवाला बताता है; ‘अधर्मी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐχθίστων
  choice: अत्यन्त घृणित
  rationale: ἐχθίστων उत्कृष्टतम भाव व्यक्त करता है; ‘अत्यन्त घृणित’ उसकी तीव्रता बनाए रखता है।
- source_word: ἀποστατῶν
  choice: धर्मत्यागियों
  rationale: यह विद्रोह या निष्ठा-त्याग करनेवालों को सूचित करता है; इस प्रार्थना के धार्मिक संदर्भ में ‘धर्मत्यागियों’ उपयुक्त है, यद्यपि ‘विद्रोहियों’ भी संभव है।
- source_word: πονηροτάτῳ
  choice: सबसे दुष्ट
  rationale: उत्कृष्टतम रूप की स्पष्ट तीव्रता को सीधे व्यक्त करता है।
- source_word: παρὰ πᾶσαν τὴν γῆν
  choice: सारी पृथ्वी के
  rationale: राजा की दुष्टता की अन्य सभी से तुलना का भाव हिन्दी में स्वाभाविक ढंग से ‘सारी पृथ्वी के सबसे दुष्ट’ में व्यक्त होता है।
theological_decisions:
- issue: ἀποστατῶν का धार्मिक या राजनीतिक अर्थ
  choice: धर्मत्यागियों
  alternative: विद्रोहियों
  rationale: ग्रीक शब्द दोनों अर्थ ग्रहण कर सकता है। निकटवर्ती ‘अधर्मी’ और प्रार्थना के वाचा-संबंधी संदर्भ के कारण धार्मिक निष्ठा-त्याग प्रमुख जान पड़ता है, पर अर्थ को किसी विशिष्ट सम्प्रदाय से नहीं जोड़ा गया।
- issue: सर्वोच्चता-सूचक वाक्यांश का संबंध
  choice: ‘सबसे दुष्ट’ को राजा से जोड़कर अनुवाद
  alternative: ‘सारी पृथ्वी से बढ़कर दुष्ट राजा’
  rationale: ग्रीक में πονηροτάτῳ राजा का विशेषण है और παρὰ πᾶσαν τὴν γῆν तुलना का क्षेत्र देता है; चुना हुआ रूप हिन्दी में यही संबंध स्पष्ट और स्वाभाविक रखता है।
