  yaml_path: translation/deuterocanon/prayer_of_azariah/001/064.yaml
  text: Bless the Lord[a], you holy and humble in heart; sing praise to him and highly exalt him forever.
translation:
  language: hi
  text: हे पवित्र[a] और हृदय से नम्र लोगो, प्रभु को धन्य कहो; उसका गुणगान करो और उसे युगानुयुग अति महान ठहराओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भक्त’ अथवा ‘धर्मनिष्ठ।’ यूनानी ὅσιοι का अर्थ ‘पवित्र,’ ‘भक्त,’ या ‘धर्मनिष्ठ’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का अर्थ परमेश्वर के विषय में भला कहना और उसकी स्तुति करना है। ‘धन्य कहो’ आशीष देने के संभावित भ्रम से बचते हुए मूल की उपासना-संबंधी भाषा बनाए रखता है।
- source_word: ὅσιοι
  choice: पवित्र
  rationale: यह शब्द उन लोगों को दर्शाता है जो भक्त, धर्मनिष्ठ या पवित्र हैं। ‘पवित्र’ संक्षिप्त है और पद की गरिमामय स्तुतिपरक शैली के अनुकूल है।
- source_word: ταπεινοὶ τῇ καρδίᾳ
  choice: मन के दीन
  rationale: दत्तिव τῇ καρδίᾳ भीतरी स्वभाव को बताता है। ‘मन के दीन’ नम्रता और आंतरिक दीनता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: उपासना के इस संदर्भ में κύριος का मानक और स्वाभाविक हिन्दी रूप ‘प्रभु’ है।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: क्रिया में गीत या स्तोत्र द्वारा प्रशंसा करने का भाव है। ‘गुणगान करो’ संगीतमय स्तुति का संकेत स्वाभाविक हिन्दी में देता है।
- source_word: ὑπερυψοῦτε
  choice: अति महान ठहराओ
  rationale: उपसर्ग ὑπερ- उत्कट या अत्यधिक ऊँचा करने का भाव जोड़ता है। ‘अति महान ठहराओ’ उस प्रबल स्तुतिपरक अर्थ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह मुहावरा निरंतर और अनंत काल का बोध देता है। ‘युगानुयुग’ गरिमामय, प्रचलित और स्तुतिपरक प्रसंग के अनुकूल है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ उपासना के संदर्भ में κύριος का स्वाभाविक मानक रूप है और किसी अतिरिक्त साम्प्रदायिक अर्थ को नहीं जोड़ता।
- issue: ὅσιοι का नैतिक-धार्मिक आशय
  choice: पवित्र
  alternative: भक्त / धर्मनिष्ठ
  rationale: मूल शब्द में पवित्रता, भक्ति और धर्मनिष्ठा का अर्थक्षेत्र है। मुख्य पाठ में ‘पवित्र’ रखा गया है, पर इसे संस्कारगत या पूर्ण नैतिक निष्पापता के किसी विशेष सिद्धांत तक सीमित नहीं किया गया।
