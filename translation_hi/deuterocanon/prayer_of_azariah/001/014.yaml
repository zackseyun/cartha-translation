  yaml_path: translation/deuterocanon/prayer_of_azariah/001/014.yaml
  text: For[a], Master, we have become smaller than all the nations[b], and today we are humbled in all the earth because of our sins.
translation:
  language: hi
  text: क्योंकि, हे स्वामी, हम सब राष्ट्रों से छोटे कर दिए गए हैं[a], और आज अपने पापों के कारण सारी पृथ्वी पर[b] दीन हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हम सब राष्ट्रों से भी अधिक घटा दिए गए हैं।’ यूनानी क्रिया छोटे किए जाने अथवा दर्जे और सामर्थ्य में घटाए जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सारे देश में।’ यूनानी γῇ का अर्थ ‘भूमि/देश’ या ‘पृथ्वी’ दोनों हो सकता है; राष्ट्रों से व्यापक तुलना के कारण मुख्य पाठ में ‘पृथ्वी’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: सम्बोधन में प्रयुक्त δεσπότης स्वामित्व और सर्वोच्च अधिकार का भाव रखता है। ‘हे स्वामी’ इसे स्वाभाविक हिन्दी में व्यक्त करता है और κύριος के सामान्य अनुवाद ‘प्रभु’ से भेद भी बनाए रखता है।
- source_word: ἐσμικρύνθημεν
  choice: छोटे कर दिए गए हैं
  rationale: क्रिया का मूल भाव छोटा या घटा दिया जाना है। यह अनुवाद जनसंख्या की निश्चित व्याख्या थोपे बिना घटे हुए दर्जे और सामर्थ्य की छवि बनाए रखता है।
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: सब राष्ट्रों से
  rationale: तुलनात्मक भाव के साथ παρά का अर्थ ‘से’ है। ἔθνη के लिए ‘राष्ट्रों’ जाति-सम्बन्धी आधुनिक अस्पष्टता से बचते हुए सामूहिक राजनीतिक-सामाजिक अर्थ देता है।
- source_word: ταπεινοὶ
  choice: दीन
  rationale: विशेषण नीची, दबाई हुई या अपमानित दशा बताता है। ‘दीन’ उस परिणामी अवस्था को संक्षेप और गरिमा के साथ व्यक्त करता है, बिना यह जोड़े कि कर्ता ने स्वयं को नम्र किया।
- source_word: ἐν πάσῃ τῇ γῇ
  choice: सारी पृथ्वी पर
  rationale: γῆ का अर्थ भूमि या पृथ्वी दोनों हो सकता है। सभी राष्ट्रों से तुलना के व्यापक संदर्भ में ‘सारी पृथ्वी’ मुख्य पाठ के लिए उपयुक्त है; ‘सारे देश में’ की सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: σήμερον
  choice: आज
  rationale: यह σήμερον का सीधा, वर्तमान और स्वाभाविक हिन्दी रूप है।
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: अपने पापों के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है। ‘अपने पापों के कारण’ सामूहिक दोष-स्वीकार को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वर के लिए सम्बोधन δέσποτα
  choice: हे स्वामी
  alternative: हे प्रभु; हे सर्वाधिपति
  rationale: मूल में सामान्य κύριος नहीं बल्कि δεσπότης है। ‘स्वामी’ अधिकार और स्वामित्व की विशिष्ट छाया को सुरक्षित रखता है, जबकि ‘सर्वाधिपति’ मूल से अधिक व्याख्यात्मक और ‘प्रभु’ भेद को सपाट कर सकता है।
- issue: इस्राएल की दीनता का स्वरूप
  choice: छोटे कर दिए गए हैं … दीन हैं
  alternative: तुच्छ हो गए हैं … अपमानित हैं
  rationale: मूल घटाई गई स्थिति और दीन अवस्था को साथ रखता है, पर यह निश्चित नहीं करता कि बात संख्या, राजनीतिक सामर्थ्य या प्रतिष्ठा की है। चुना हुआ रूप इस तनाव को खुला रखता है।
