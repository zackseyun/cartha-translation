  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। वाक्य-रचना मूल के कारणसूचक आरम्भ और सामूहिक पाप-स्वीकार को बनाए रखती है। ‘राष्ट्र’ आधुनिक हिन्दी में ‘जाति’ के संभावित जाति-व्यवस्था वाले अर्थ से बचाता है।
