    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का अर्थ प्रभु के विषय में भला कहना या उसकी स्तुति करना है। ‘धन्य कहो’ गीत की आवर्ती उपासना-भाषा और मूल की विशिष्टता को बनाए रखता है।
- source_word: ῥῖγος
  choice: पाला
  rationale: यह कड़ाके की ठंड या पाले को सूचित करता है। ψῦχος से भेद बनाए रखने के लिए ‘पाला’ स्वाभाविक और सटीक है।
- source_word: ψῦχος
  choice: ठंड
  rationale: यह ठंड या शीत को दर्शाता है; ‘ठंड’ आधुनिक हिन्दी में सहज है और ‘पाला’ के साथ दोनों यूनानी पदों का भेद रखता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος के लिए ‘प्रभु’ प्रतिष्ठित, गरिमापूर्ण और सामान्य हिन्दी रूप है; विभक्ति के कारण परसर्ग ‘को’ लगाया गया है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: क्रिया में गीत अथवा भजन गाकर स्तुति करने का भाव है; ‘स्तुतिगान करो’ इस संगीतमय अर्थ को केवल ‘स्तुति करो’ से अधिक स्पष्ट रखता है।
- source_word: καὶ ὑπερυψοῦτε
  choice: और अति महान कहो
  rationale: ὑπερυψόω अत्यधिक ऊँचा करने या परम रूप से महिमान्वित करने का भाव देता है। हिन्दी में ‘अति महान कहो’ सृष्टि को संबोधित इस स्तुतिपरक आज्ञा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह सर्वनाम पहले उल्लिखित प्रभु की ओर संकेत करता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह स्थायी, अनंत काल तक चलने वाली स्तुति का रूढ़ बाइबलीय भाव संक्षेप और गरिमा से व्यक्त करता है।
theological_decisions:
- issue: यूनानी κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस उपासना-गीत में ‘प्रभु’ सामान्य बाइबलीय संबोधन है और किसी अतिरिक्त सांप्रदायिक व्याख्या को आरोपित नहीं करता।
- issue: εὐλογεῖτε में आशीष देने और स्तुति करने का संबंध
  choice: धन्य कहो
  alternative: स्तुति करो
  rationale: ‘धन्य कहो’ मूल क्रिया की वाचिक और आशीर्वचनात्मक छटा तथा गीत की आवर्ती संरचना बनाए रखता है; अधिक सामान्य अर्थ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और उपासनापरक गरिमा रखी गई है। ‘हे पाले और ठंड’ निर्जीव प्राकृतिक शक्तियों के प्रत्यक्ष संबोधन को स्पष्ट करता है; समानांतर आज्ञाओं की लय भी सुरक्षित है।
