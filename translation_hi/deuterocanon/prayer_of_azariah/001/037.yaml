base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/037.yaml
  text: Bless the Lord[a], waters and all that are above the heavens; sing praise to him and highly exalt him forever.
translation:
  language: hi
  text: हे जलराशियो, और जो कुछ आकाश के ऊपर है, प्रभु को धन्य कहो; उसका गुणगान करो और उसे अत्यन्त महिमान्वित करो, सदा-सर्वदा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक का अर्थ प्रभु को धन्य कहना या उसकी स्तुति करना है। ‘धन्य कहो’ इस स्तुतिगान की आवर्ती उपासना-भाषा और εὐλογέω का विशिष्ट भाव सुरक्षित रखता है।
- source_word: ὕδατα
  choice: जलराशियो
  rationale: यूनानी बहुवचन और सृष्टि के तत्त्वों को सीधे संबोधित करने वाली काव्यात्मक शैली को व्यक्त करता है; ‘हे’ के साथ संबोधन स्पष्ट है।
- source_word: πάντα τὰ ἐπάνω τοῦ οὐρανοῦ
  choice: जो कुछ आकाश के ऊपर है
  rationale: नपुंसकलिंग बहुवचन पदबंध को सामूहिक और स्वाभाविक हिन्दी में प्रस्तुत करता है। οὐρανοῦ यहाँ एकवचन है, इसलिए ‘आकाश’ रखा गया है और वास्तविक स्थानगत अस्पष्टता को नहीं बढ़ाया गया।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος के दैवीय शीर्षक के लिए सामान्य, गरिमापूर्ण हिन्दी; यूनानी साक्ष्य में इब्रानी दैवीय नाम प्रत्यक्ष रूप से नहीं है।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: यह क्रिया गाकर स्तुति करने का भाव रखती है। ‘गुणगान करो’ आधुनिक हिन्दी में संगीतमय स्तुति को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महिमा करो
  rationale: उपसर्ग सहित क्रिया अत्यधिक ऊँचा उठाने या महिमान्वित करने का भाव देती है। ईश्वर के संदर्भ में ‘अत्यन्त महिमा करो’ शाब्दिक ‘बहुत ऊँचा उठाओ’ से अधिक स्वाभाविक है और तीव्रता बनाए रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: इस स्तुतिपरक आवर्तन में अनन्त काल तक बने रहने का अर्थ स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: व्यवस्थाविवरणेतर यूनानी स्तुतिगान में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: पाठ में κύριος है, इब्रानी दैवीय नाम प्रत्यक्ष रूप से नहीं। ‘प्रभु’ स्रोत-पाठ के दैवीय शीर्षक को सुरक्षित रखता है और कोई अतिरिक्त पाठगत या सम्प्रदायगत दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, सामूहिक स्तुतिगान का गरिमापूर्ण स्वर रखा गया है। प्रत्यक्ष संबोधन के लिए ‘हे’ और बहुवचन ‘जलराशियो’ प्रयुक्त हैं; वाक्य सहज है, पर मूल की समानांतर आज्ञार्थक संरचना भी सुरक्षित है।
