- from: हे जलराशियो, और जो कुछ आकाश के ऊपर है, प्रभु को धन्य कहो; उसका गुणगान करो और सदा-सर्वदा उसकी अत्यन्त महिमा करो।
  to: हे जलराशियो, और जो कुछ आकाश के ऊपर है, प्रभु को धन्य कहो; उसका गुणगान करो और उसे अत्यन्त महिमान्वित करो, सदा-सर्वदा।
  rationale: The revision changes only the final imperative so that αὐτόν is explicitly represented by ‘उसे’ and the intensive force of ὑπερυψοῦτε is retained. The placement of ‘सदा-सर्वदा’ at the end naturally qualifies both praise and exaltation, as in the Greek refrain.
