theological_decisions:
- issue: प्रार्थना में ἐξωμολογεῖτο का अर्थ
  choice: अंगीकार किया
  alternative: धन्यवाद दिया; स्तुति की
  rationale: आगामी प्रार्थना में परमेश्वर की धार्मिकता की स्वीकृति और इस्राएल के पाप का अंगीकार दोनों हैं। ‘अंगीकार किया’ इस तनाव को सबसे स्पष्ट रूप से रखता है, जबकि धन्यवाद/स्तुति की वास्तविक अर्थ-सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: अंतिम क्रिया καὶ εἶπαν का बहुवचन
  choice: और उन्होंने कहा
  alternative: और उसने कहा
  rationale: यद्यपि तत्काल पूर्ववर्ती प्रमुख पात्र अजर्याह एकवचन है, यूनानी पाठ बहुवचन पढ़ता है और पहले उल्लिखित साथियों के साथ सामूहिक वाणी की ओर संकेत कर सकता है; इसलिए इसे एकवचन में नहीं बदला गया।
