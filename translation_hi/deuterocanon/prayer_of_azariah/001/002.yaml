  choice: इस प्रकार प्रार्थना करने लगा
  rationale: οὕτως आगे आने वाली प्रार्थना का परिचय देता है। ‘प्रार्थना करने लगा’ कथा के प्रवाह में स्वाभाविक है और यूनानी मध्यम रूप का अनावश्यक शाब्दिकपन नहीं लाता।
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: उसने अपना मुँह खोलकर
  rationale: यह गंभीर वाणी के आरम्भ को चिह्नित करने वाली बाइबिलीय अभिव्यक्ति है; इसे केवल ‘उसने कहा’ बनाकर संक्षिप्त नहीं किया गया।
- source_word: ἐξωμολογεῖτο
  choice: अंगीकार किया
  rationale: क्रिया में अंगीकार, धन्यवाद और स्तुति के अर्थ-संकेत संभव हैं। आगे की प्रार्थना परमेश्वर की धार्मिकता और लोगों के पाप—दोनों को स्वीकार करती है, इसलिए ‘अंगीकार किया’ संदर्भानुकूल है; अन्य अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: τῷ κυρίῳ
  choice: प्रभु के सामने
  rationale: यहाँ κύριος परमेश्वर के लिए आदरसूचक पद है। दत्तिव के साथ ‘प्रभु के सामने’ हिन्दी में अंगीकार की दिशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἅμα τοῖς συνεταίροις αὐτοῦ
  choice: अपने साथियों के साथ
  rationale: ἅμα सहभागिता बताता है और συνεταῖροι उसके साथ उपस्थित अन्य युवकों को सूचित करता है।
- source_word: ἐν μέσῳ τῷ πυρί
  choice: आग के बीच
  rationale: स्थान का जीवंत वर्णन संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: ὑποκαιομένης τῆς καμίνου … σφόδρα
  choice: भट्ठी को बहुत अधिक धधका रहे थे
  rationale: यूनानी संबंधवाचक स्वतंत्र वाक्यांश चल रही परिस्थिति बताता है; सक्रिय हिन्दी वाक्य रचना भट्ठी को लगातार और प्रचंड रूप से गरम किए जाने का भाव स्पष्ट करती है।
