  text: Then Azariah stood and prayed thus[a], and opening his mouth he gave thanks to the Lord together with his companions in the midst of the fire, while the furnace was being intensely heated by the Chaldeans. And they said,
translation:
  language: hi
  text: तब अजर्याह खड़ा हुआ और इस प्रकार प्रार्थना की; उसने अपना मुँह खोलकर आग के बीच अपने साथियों के साथ प्रभु की स्तुति की[a], जबकि कसदियों के द्वारा भट्ठी अत्यन्त तपाई जा रही थी। और उन्होंने कहा[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रभु को धन्यवाद दिया’ अथवा ‘प्रभु के सामने अंगीकार किया’; यूनानी क्रिया प्रसंग के अनुसार स्तुति, धन्यवाद या अंगीकार का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में यहाँ क्रिया बहुवचन है—‘उन्होंने कहा’—यद्यपि ठीक पहले अजर्याह का उल्लेख एकवचन में हुआ है।
    reason: grammatical_ambiguity
