- source_word: στὰς
  choice: खड़ा हुआ
  rationale: यह ἵστημι का क्रियाविशेषणात्मक कृदंत है और मुख्य क्रिया से पहले की कथा-क्रिया बताता है; आधुनिक हिन्दी में ‘खड़ा हुआ’ सहज और सटीक है।
