base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/031.yaml
  text: Blessed are you[a], who look upon the depths, seated upon the cherubim[b], and praised and highly exalted forever.
translation:
  language: hi
  text: धन्य हैं आप, जो अथाह गहराइयों[a] पर दृष्टि रखते हैं, करूबों पर विराजमान हैं[b], और युगानुयुग प्रशंसित तथा अत्यन्त महिमान्वित किए जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अगाध गह्वरों’। बहुवचन शब्द ब्रह्माण्डीय अथाह गहराइयों की छवि जगाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘करूबों के ऊपर सिंहासन पर विराजमान हैं’। यूनानी में अधिक शाब्दिक रूप से ‘करूबों पर बैठे हुए’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος εἶ
  choice: धन्य हैं आप
  rationale: यह परमेश्वर को सीधे सम्बोधित करने वाला आशीर्वादात्मक स्तुतिवाक्य है; हिन्दी में आदरसूचक द्वितीय पुरुष मूल यूनानी सम्बोधन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ ἐπιβλέπων
  choice: जो ... पर दृष्टि रखते हैं
  rationale: वर्तमान कृदन्त का दृश्य-बोध सुरक्षित रहता है और इसमें देखभाल या संरक्षण का ऐसा अर्थ नहीं जोड़ा जाता जो यूनानी में अनिवार्य नहीं है।
- source_word: ἀβύσσους
  choice: अथाह गहराइयों
  rationale: बहुवचन और ब्रह्माण्डीय अथाह गहराइयों की छवि दोनों सुरक्षित हैं; केवल ‘गहराइयों’ की अपेक्षा ‘अथाह’ ἄβυσσος का बल स्पष्ट करता है।
- source_word: καθήμενος ἐπὶ χερουβεὶν
  choice: करूबों पर विराजमान हैं
  rationale: ‘विराजमान’ बैठने की मुद्रा को गरिमापूर्ण स्तुतिपरक हिन्दी में व्यक्त करता है। ‘पर’ ἐπί के निकट है; ‘ऊपर सिंहासन पर’ जैसी अधिक व्याख्यात्मक भाषा मुख्य पाठ में नहीं जोड़ी गई।
- source_word: αἰνετὸς
  choice: स्तुति पाते
  rationale: स्तुतिगान के क्रम में यह αἰνετός को स्वाभाविक हिन्दी में व्यक्त करता है और इसके साथ आने वाले कृदन्तीय कथन की समानान्तरता बनाए रखता है। ‘स्तुति के योग्य’ भी सम्भव है, पर वह मूल्यांकन के भाव को अधिक स्पष्ट करके रूपात्मक समानान्तरता घटाता है।
- source_word: ὑπερυψούμενος
  choice: अत्यन्त ऊँचे किए जाते हैं
  rationale: यह रूप के निष्क्रिय/प्राप्त होने वाले भाव और ὑπερ- की तीव्रता को बनाए रखता है; केवल ‘महान हैं’ कहने से यह तनाव मिट जाता।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह प्रचलित, संक्षिप्त और गरिमापूर्ण हिन्दी स्तुतिपरक अभिव्यक्ति है, जो अनन्त काल की ओर संकेत करती है।
theological_decisions:
- issue: करूबों के सम्बन्ध में परमेश्वर के आसन की छवि
  choice: करूबों पर विराजमान हैं
  alternative: करूबों के ऊपर सिंहासन पर विराजमान हैं
  rationale: यूनानी पाठ बैठने और करूबों पर होने की बात कहता है, पर ‘सिंहासन’ शब्द स्पष्ट रूप से नहीं कहता। मुख्य पाठ मूल छवि रखता है और व्यापक बाइबलीय सिंहासन-भाव को अनिवार्य अर्थ नहीं बनाता।
- issue: ὑπερυψούμενος का व्याकरणिक और स्तुतिपरक बल
  choice: अत्यन्त ऊँचे किए जाते हैं
  alternative: सर्वोपरि महान हैं
  rationale: चुना हुआ अनुवाद कृदन्त के निष्क्रिय रूप को खुला रखता है और यह तय नहीं करता कि वाक्य केवल परमेश्वर की अन्तर्निहित महिमा का वर्णन करता है या स्तुति में उनके महान किए जाने का।
- issue: αἰνετός का बल
  choice: स्तुति पाते
  alternative: स्तुति के योग्य हैं
  rationale: सन्दर्भ में दोनों सम्भव हैं। मुख्य पाठ स्तुतिपरक कथन और अगले निष्क्रिय कृदन्त के साथ समानान्तरता रखता है; विकल्प विशेष रूप से योग्यता का भाव सामने लाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण स्तुतिपरक शैली रखी गई है। ‘आप’ आदरसूचक प्रत्यक्ष सम्बोधन है। ‘करूब’ प्रचलित बाइबलीय पद है। दोनों पादटिप्पणी-चिह्न सम्बन्धित शब्दों के तुरन्त बाद रखे गए हैं।
