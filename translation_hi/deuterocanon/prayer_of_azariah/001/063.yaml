base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/063.yaml
  text: Bless the Lord[a], spirits and souls of the righteous[b]; sing hymns and highly exalt him forever.
translation:
  language: hi
  text: हे धर्मियों की आत्माओं और प्राणों, प्रभु को धन्य कहो[a]; उसका स्तुतिगान करो और युगानुयुग[b] उसे अति महान ठहराओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हे धर्मियों की आत्माओं और प्राणों, प्रभु की स्तुति करो।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘युगों तक’; यह निरन्तरता या सदा बने रहने को व्यक्त करने वाला प्रचलित स्तुतिपरक वाक्यांश है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का यह अनुवाद यूनानी के आशीर्वचनात्मक और स्तुतिपरक भाव को बनाए रखता है; केवल ‘स्तुति करो’ कहने से ὑμνεῖτε के साथ इसका भेद मिट जाता।
- source_word: πνεύματα
  choice: आत्माओ
  rationale: ‘आत्माएँ’ यूनानी के सामान्य अर्थ को सीधे व्यक्त करता है और ψυχαί से अलग पद के रूप में सुरक्षित रखता है। सम्बोधन के कारण रूप ‘आत्माओ’ है।
- source_word: ψυχαὶ
  choice: प्राणो
  rationale: ‘प्राण’ यहाँ ψυχή के लिए स्वाभाविक, गरिमापूर्ण हिन्दी है और πνεύματα के साथ मूल पाठ की दोहरी अभिव्यक्ति को बनाए रखता है। सम्बोधन के कारण रूप ‘प्राणो’ है।
- source_word: δικαίων
  choice: धर्मियों की
  rationale: यह संबंधकारक πνεύματα और ψυχαί दोनों को विशेषित करता है। ‘धर्मी’ नैतिक और धार्मिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: यह यहूदी-यूनानी उपासना-संदर्भ में κύριος का मानक और स्वाभाविक हिन्दी रूप है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: यह क्रिया केवल सामान्य प्रशंसा नहीं, बल्कि गाकर की जाने वाली स्तुति का संकेत देती है; ‘स्तुतिगान’ उस संगीतमय उपासना-भाव को स्पष्ट रखता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त ऊँचा ठहराओ
  rationale: मूल संयुक्त क्रिया में ऊँचा करने या मानने का तीव्र भाव है। यह रूप उस बल को बनाए रखते हुए हिन्दी में बोधगम्य रहता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: शाब्दिक रूप से ‘युगों तक’ का यह उपासनात्मक पद स्थायी, निरन्तर स्तुति का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘आत्माओं और प्राणों’ की मानव-स्वरूप संबंधी जोड़ी
  choice: दोनों शब्दों को अलग-अलग रखते हुए ‘धर्मियों की आत्माओ और प्राणो’ अनूदित किया गया है।
  alternative: इसे एक ही भाव मानकर केवल ‘धर्मियों की आत्माओ’ कहना, अथवा ‘धर्मी लोगो, तन-मन से’ जैसा भावानुवाद करना।
  rationale: यूनानी पाठ πνεύματα और ψυχαί दोनों को स्पष्ट रूप से रखता है। अनुवाद इस दोहरी शब्दावली को बनाए रखता है, पर इससे मनुष्य की संरचना के विषय में कोई विकसित सिद्धान्त निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के योग्य रखी गई है। सम्बोधन के बहुवचन रूप ‘आत्माओ’ और ‘प्राणो’ मूल के प्रत्यक्ष आह्वान को स्पष्ट करते हैं; विरामचिह्न पद की दो समानान्तर आज्ञाओं को अलग करता है।
