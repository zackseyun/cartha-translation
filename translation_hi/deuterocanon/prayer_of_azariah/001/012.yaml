base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/012.yaml
  text: And do not withdraw your mercy from us[a], for the sake of Abraham your beloved, and Isaac your servant[b], and Israel your holy one.
translation:
  language: hi
  text: और अपनी दया हमसे न हटा[a], अपने प्रिय अब्राहम, अपने सेवक इसहाक और अपने पवित्र जन इस्राएल[b] के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी दया हमसे दूर न कर।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “इस्राएल” से अभिप्राय पूर्वज याकूब से है, जिसे यह नाम दिया गया था।
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: न हटा
  rationale: यहाँ ἀφίστημι का सकर्मक अर्थ है—दया को किसी से दूर करना या हटा लेना। ‘न हटा’ आधुनिक हिन्दी में स्वाभाविक है और प्रार्थना की विनती को स्पष्ट रखता है।
- source_word: τὸ ἔλεός σου
  choice: अपनी दया
  rationale: ἔλεος के लिए ‘दया’ संक्षिप्त, प्रचलित और प्रार्थना के प्रसंग के अनुकूल है; यह यूनानी से अधिक विशिष्ट वाचा-संबंधी अर्थ नहीं जोड़ता।
- source_word: διὰ
  choice: के कारण
  rationale: यहाँ διά के साथ कर्मकारक उन पूर्वजों को अपील के आधार के रूप में प्रस्तुत करता है। ‘के कारण’ इस आधारगत अर्थ को सहज हिन्दी में व्यक्त करता है, जबकि ‘के लिए’ उद्देश्य का भ्रम पैदा कर सकता है।
- source_word: τὸν ἠγαπημένον ὑπὸ σοῦ
  choice: अपने प्रिय
  rationale: वाक्यांश का शाब्दिक भाव ‘जो तुझसे प्रेम किया गया’ है। ‘अपने प्रिय’ हिन्दी में स्वाभाविक सम्मानसूचक अभिव्यक्ति है और परमेश्वर द्वारा प्रेम किए जाने का संबंध बनाए रखती है।
- source_word: δοῦλόν σου
  choice: अपने सेवक
  rationale: इसहाक के सम्मानसूचक परिचय में δοῦλος मुख्यतः परमेश्वर की सेवा और अधीनता दर्शाता है; ‘दास’ भी संभव है, पर आधुनिक हिन्दी में वह यहाँ अनावश्यक रूप से बंधुआ स्थिति पर बल दे सकता है।
- source_word: τὸν ἅγιόν σου
  choice: अपने पवित्र जन
  rationale: ἅγιος यहाँ संज्ञा के रूप में इस्राएल के लिए प्रयुक्त है। ‘पवित्र जन’ स्वाभाविक हिन्दी है और ‘तेरा पवित्र’ जैसी अधूरी अभिव्यक्ति से बचते हुए परमेश्वर के लिए अलग किए हुए व्यक्ति का भाव रखता है।
- source_word: Ἰσραὴλ
  choice: इस्राएल
  rationale: यूनानी पाठ में वाचा-नाम ‘इस्राएल’ है; इसे ‘याकूब’ में बदलना मूल पाठ की अभिव्यक्ति को समतल कर देगा।
theological_decisions:
- issue: पूर्वज के सम्मानसूचक पद के रूप में δοῦλος
  choice: सेवक
  alternative: दास
  rationale: इस प्रसंग में इसहाक को परमेश्वर के प्रति निष्ठावान और अधीन व्यक्ति के रूप में सम्मानपूर्वक संबोधित किया गया है। ‘सेवक’ इस कार्य को स्पष्ट करता है, जबकि ‘दास’ सामाजिक बंधन के पहलू को आवश्यकता से अधिक प्रमुख कर सकता है।
- issue: διά द्वारा प्रस्तुत पूर्वजों की दुहाई
  choice: अब्राहम... इसहाक... इस्राएल के कारण
  alternative: अब्राहम... इसहाक... इस्राएल के निमित्त
  rationale: यह प्रार्थना परमेश्वर के साथ पूर्वजों के संबंध को दया बनाए रखने की अपील का आधार बनाती है। ‘के कारण’ इस भाव को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े व्यक्त करता है; ‘के निमित्त’ अधिक औपचारिक विकल्प है।
- issue: Ἰσραήλ की पहचान
  choice: पाठ में ‘इस्राएल’ बनाए रखा और पाद-टिप्पणी में याकूब की पहचान स्पष्ट की
  alternative: मुख्य पाठ में ‘याकूब’
  rationale: मूल यूनानी जानबूझकर पूर्वज के वाचा-नाम का प्रयोग करता है। इसलिए मुख्य पाठ में वही नाम सुरक्षित रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनापूर्ण रखी गई है। ‘दया’, ‘सेवक’ और ‘पवित्र जन’ सामान्य पाठकों के लिए स्पष्ट हैं, जबकि वाक्य में पूर्वजों की क्रमिक दुहाई और मूल यूनानी की धार्मिक गंभीरता सुरक्षित है।
