  yaml_path: translation/deuterocanon/prayer_of_azariah/001/039.yaml
  text: Bless the Lord[a], sun and moon; sing praise to him and highly exalt him forever.
translation:
  language: hi
  text: हे सूर्य और चन्द्रमा, प्रभु को धन्य कहो; उसका गुणगान करो और उसे सदा-सर्वदा[a] अत्यन्त महान ठहराओ।
  philosophy: optimal-equivalence
  footnotes:
