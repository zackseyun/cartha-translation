    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: यह बहुवचन आज्ञार्थक क्रिया प्रभु को आशीष देने अथवा उसकी प्रशंसा करने के आह्वान के रूप में प्रयुक्त है। ‘धन्य कहो’ मूल क्रिया और आवर्ती स्तुतिगान की औपचारिक बनावट को बनाए रखता है।
- source_word: ἥλιος καὶ σελήνη
  choice: हे सूर्य और चन्द्रमा
  rationale: दोनों खगोलीय पिंडों को सीधे संबोधित किया गया है; ‘हे’ हिन्दी में इस काव्यात्मक संबोधन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: इस यहूदी स्तुतिगान में κύριος इस्राएल के परमेश्वर के लिए है। ‘प्रभु’ सामान्य, प्रतिष्ठित और संप्रदाय-निरपेक्ष हिन्दी रूप है।
- source_word: ὑμνεῖτε
  choice: गुणगान करो
  rationale: ὑμνέω में गाकर या स्तुतिगान के रूप में प्रशंसा करने का भाव है। ‘गुणगान करो’ इस संगीतमय स्तुति को सहज हिन्दी में व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त ऊँचा ठहराओ
  rationale: उपसर्गयुक्त क्रिया में अत्यधिक ऊँचा करने या सर्वोच्च मानने का प्रबल भाव है। यह रूप उस तीव्रता को बनाए रखता है और इसे केवल सामान्य प्रशंसा में नहीं मिला देता।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: यह युगों तक बने रहने का मुहावरेदार कथन है। ‘सदा-सर्वदा’ आधुनिक हिन्दी में अनन्त निरंतरता को स्पष्ट करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: व्यवस्थाविवरणोत्तर स्तुतिगान में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी; यहोवा
  rationale: यूनानी पाठ में सामान्य κύριος है। ‘प्रभु’ परमेश्वर के प्रति संबोधन को सुरक्षित रखता है, पर यूनानी में अनुपस्थित विशिष्ट नाम या मुद्रण-परंपरा को पाठ में नहीं जोड़ता।
