  register: भाषा काव्यात्मक और उपासना-सुलभ है, फिर भी आधुनिक पाठक के लिए सीधी रखी गई है। बहुवचन आज्ञार्थक क्रियाएँ सूर्य और चन्द्रमा के संयुक्त संबोधन के अनुरूप हैं।
