  rationale: यह रूप ज्वाला के बाहर और ऊपर की ओर विस्तृत होने का वर्णन करता है। ‘फैल गई’ आधुनिक हिन्दी में स्वाभाविक है और विस्तार के भाव को बनाए रखता है।
