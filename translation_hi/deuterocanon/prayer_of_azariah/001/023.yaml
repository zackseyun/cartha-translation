- source_word: στιππύῳ
  choice: सन का रेशा
  rationale: शब्द आग पकड़ाने के काम आनेवाले सन के बचे हुए रेशों को दर्शाता है; केवल तकनीकी शब्द देने के बजाय पदार्थ को स्पष्ट किया गया है।
- source_word: κληματίδα
