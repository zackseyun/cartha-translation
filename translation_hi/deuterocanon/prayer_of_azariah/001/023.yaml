  text: और राजा के सेवक, जिन्होंने उन्हें भट्ठी में फेंका था, भट्ठी में नेफ़्था[a], राल, सन का रेशा और अंगूर की बेल की काटी हुई टहनियाँ[b] डालकर उसे लगातार जलाते रहे।
  philosophy: optimal-equivalence
