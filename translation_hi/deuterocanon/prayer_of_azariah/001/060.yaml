translation:
  language: hi
  text: हे इस्राएल, प्रभु को धन्य कहो[a]; उसका स्तुतिगान करो और सदा उसकी अत्यन्त महिमा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की स्तुति करो।” आराधना के इस संदर्भ में यूनानी εὐλογεῖτε का अनुवाद “स्तुति करो” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का यह अनुवाद परमेश्वर की ओर निर्देशित आशीष-वचन के बाइबलीय मुहावरे को बनाए रखता है; आराधना के इस संदर्भ में इसका अर्थ ‘स्तुति करो’ भी हो सकता है।
- source_word: Ἰσραήλ
  choice: हे इस्राएल
  rationale: यूनानी में यह सीधे संबोधन के रूप में है। ‘हे इस्राएल’ हिन्दी में सामूहिक आह्वान को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος के लिए ‘प्रभु’ स्वाभाविक और स्रोत-संगत हिन्दी है; यूनानी पाठ में स्वयं परमेश्वर का विशिष्ट इब्रानी नाम नहीं, बल्कि κύριος है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: ὑμνέω में गाकर स्तुति करने का भाव है। ‘स्तुतिगान करो’ इस संगीतमय-आराधनात्मक अर्थ को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: ὑπερυψοῦτε
  choice: अत्यन्त महान ठहराओ
  rationale: उपसर्ग सहित क्रिया तीव्र उत्कर्ष व्यक्त करती है। परमेश्वर के विषय में ‘अत्यन्त महान ठहराओ’ उसे सचमुच और ऊँचा बनाने के बजाय उसकी सर्वोच्च महानता घोषित करने का भाव देता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: इस स्तुतिपरक टेक में बहुवचन ‘युगों तक’ का स्वाभाविक आशय अनन्त निरंतरता है; ‘सदा’ आधुनिक हिन्दी में इसे स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल यूनानी में κύριος है, इसलिए उसे सीधे ‘प्रभु’ कहना स्रोत के रूप को सुरक्षित रखता है और किसी अंतर्निहित इब्रानी पाठ को निश्चित मानकर नहीं चलता।
- issue: परमेश्वर को ‘धन्य कहने’ का अर्थ
  choice: धन्य कहो
  alternative: स्तुति करो
  rationale: ‘धन्य कहो’ εὐλογεῖτε के विशिष्ट बाइबलीय मुहावरे और स्तुति के अर्थ के बीच का तनाव बनाए रखता है। चूँकि अगले खंड में ὑμνεῖτε के लिए स्तुति का स्पष्ट पद है, दोनों क्रियाओं को एक ही हिन्दी क्रिया में मिला देना उचित नहीं।
