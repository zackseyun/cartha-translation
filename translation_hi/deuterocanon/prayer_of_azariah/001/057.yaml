base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/057.yaml
  text: Bless the Lord[a], all birds of the sky; sing hymns and highly exalt him forever.
translation:
  language: hi
  text: हे आकाश के सब पक्षियो[a], प्रभु को धन्य कहो; उसका स्तुतिगान करो और उसे सदा-सर्वदा अत्यन्त महिमा दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्यापक अर्थ में, “आकाश के सब उड़ने वाले जीव।”
    reason: πετεινά का अर्थ पक्षी हो सकता है, पर यह अधिक व्यापक रूप से पंखों वाले या उड़ने वाले प्राणियों को भी सूचित कर सकता है।
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक εὐλογεῖτε का आराधनात्मक अर्थ सुरक्षित रखते हुए यह सामान्य हिन्दी में स्वाभाविक है और केवल सामान्य ‘स्तुति करो’ से अगले क्रियापद का भेद बनाए रखता है।
- source_word: πάντα τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: हे आकाश के सब पक्षियो
  rationale: πετεινά पक्षियों अथवा अधिक व्यापक रूप से उड़ने वाले जीवों को सूचित कर सकता है; सृष्टि-सूची के संदर्भ में ‘पक्षी’ सबसे स्वाभाविक है, और τοῦ οὐρανοῦ के लिए ‘आकाश के’ उपयुक्त है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: यूनानी κύριος का सीधा, प्रतिष्ठित और संप्रदाय-निरपेक्ष हिन्दी रूप ‘प्रभु’ है। विभक्ति ‘को’ इसे आज्ञार्थक क्रिया का कर्म स्पष्ट करती है।
- source_word: ὑμνεῖτε
  choice: स्तुतिगान करो
  rationale: ὑμνέω में गीत द्वारा स्तुति करने का विशिष्ट भाव है; ‘स्तुतिगान करो’ उस संगीतमय अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπερυψοῦτε
  choice: अति महान मानो
  rationale: ὑπερυψόω की तीव्रता को हिन्दी में स्वाभाविक आराधनात्मक भाषा से व्यक्त किया गया है। शाब्दिक ‘बहुत ऊँचा उठाओ’ यहाँ भौतिक अर्थ का भ्रम दे सकता था।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह सर्वनाम प्रभु की ओर लौटता है; हिन्दी में ‘उसे’ सहज और स्पष्ट है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा-सर्वदा
  rationale: यह युगों तक बने रहने की कालगत अभिव्यक्ति है; ‘सदा-सर्वदा’ आधुनिक हिन्दी में उसके स्थायी और स्तोत्रात्मक बल को बनाए रखता है।
theological_decisions:
- issue: आराधनात्मक संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल यूनानी में κύριος है, स्वयं इब्रानी चतुरक्षरीय नाम नहीं। इसलिए ‘प्रभु’ स्रोत के रूप और इस यूनानी ग्रंथ के संदर्भ को सुरक्षित रखता है; ‘यहोवा’ मूल पाठ से अधिक विशिष्टता जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामूहिक स्तोत्र-पाठ के अनुकूल रखी गई है। ‘हे ... पक्षियो’ हिन्दी संबोधन को स्पष्ट करता है। पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि πετεινά की व्यापक सम्भावना अनुवाद को अस्थिर करने जितनी प्रबल नहीं है।
