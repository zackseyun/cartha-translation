revisions:
- from: हे आकाश के सब पक्षियो, प्रभु को धन्य कहो; उसका स्तुतिगान करो और सदा-सर्वदा उसे अति महान मानो।
  to: हे आकाश के सब पक्षियो[a], प्रभु को धन्य कहो; उसका स्तुतिगान करो और उसे सदा-सर्वदा अत्यन्त महिमा दो।
  rationale: The revision retains the draft’s modern, dignified Hindi and its faithful rendering of “प्रभु,” while replacing a weaker evaluative expression with an active doxological one that better reflects the intensified Greek imperative. The lexical alternative for πετεινά is supplied in a footnote without unsettling the natural main-text rendering “पक्षी.”
  reviewer_model: gpt-5.6-terra
