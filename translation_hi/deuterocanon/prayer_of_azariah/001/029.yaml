base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/029.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and highly exalted forever; and blessed is your holy, glorious name, and supremely praised and highly exalted through all the ages.
translation:
  language: hi
  text: हे प्रभु, हमारे पूर्वजों के परमेश्वर, आप धन्य हैं; आप युगानुयुग स्तुत्य और अत्यन्त ऊँचे उठाए जाते हैं। आपकी महिमा का पवित्र नाम[a] धन्य है; वह समस्त युगों तक अत्यधिक स्तुत्य और अत्यन्त ऊँचा उठाया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आपकी महिमा का वह पवित्र नाम।” यूनानी पदबंध सघन है और ‘पवित्र’ को ‘नाम’ से जोड़ता है।
    reason: मूल यूनानी के सघन संबंधकारक विन्यास को स्पष्ट करना।
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: धन्य
  rationale: आशीर्वचनात्मक प्रत्यक्ष संबोधन में प्रयुक्त विधेय विशेषण को स्वाभाविक और प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: प्रत्यक्ष संबोधन को स्पष्ट करता है और κύριος का प्रचलित बाइबिलीय हिन्दी रूप है।
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के परमेश्वर
  rationale: वाचा-संबंधी पारिवारिक भाव बनाए रखते हुए आधुनिक पाठकों के लिए ‘पिताओं’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: αἰνετὸς
  choice: स्तुत्य
  rationale: विधेय विशेषण की संरचना बनाए रखता है और इसका अर्थ ‘स्तुति के योग्य’ सहज रूप से पहुँचाता है।
- source_word: ὑπερυψούμενος
  choice: अत्यन्त ऊँचे ठहराए जाते हैं
  rationale: यूनानी कर्मवाच्य कृदन्त और ὑπερ- की तीव्रता दोनों को बनाए रखता है; परमेश्वर के लिए बहुवचन आदरसूचक क्रिया प्रयुक्त हुई है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: दीर्घकालिक, अनन्त स्तुति का स्वाभाविक बाइबिलीय हिन्दी रूप है।
- source_word: τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον
  choice: आपकी महिमा का पवित्र नाम
  rationale: मूल के संबंधकारक विन्यास और ‘पवित्र’ विशेषण दोनों को निकटता से सुरक्षित रखता है।
- source_word: ὑπεραινετὸν
  choice: अत्यधिक स्तुत्य
  rationale: αἰνετός से भेद करते हुए ὑπερ- की तीव्रता स्पष्ट करता है।
- source_word: εἰς ἅπαντας τοὺς αἰῶνας
  choice: समस्त युगों तक
  rationale: ἅπαντας के ‘समस्त’ भाव को दूसरी काल-अभिव्यक्ति में स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: आशीर्वचन को कामनासूचक या प्रत्यक्ष विधेय कथन के रूप में प्रस्तुत करना
  choice: आप धन्य हैं
  alternative: आप धन्य हों
  rationale: यूनानी में प्रत्यक्ष द्वितीय-पुरुष विधेय कथन है, कामनासूचक क्रिया नहीं; इसलिए कथनात्मक रूप रखा गया है।
- issue: πατέρων का आधुनिक हिन्दी रूप
  choice: पूर्वजों
  alternative: पिताओं / पितरों
  rationale: ‘पूर्वजों’ आधुनिक मानक हिन्दी में स्वाभाविक है और सामूहिक पैतृक परंपरा का आशय रखता है; ‘पितरों’ से संभावित श्राद्ध-संबंधी सांस्कृतिक अर्थ से बचा गया है।
- issue: ईश्वरीय उत्कर्ष के कर्मवाच्य भाव को बनाए रखना
  choice: अत्यन्त ऊँचे ठहराए जाते हैं
  alternative: अत्यन्त महान हैं
  rationale: वैकल्पिक रूप अधिक सहज है, पर वह ὑπερυψούμενος के ‘ऊँचा किए/ठहराए जाने’ के भाव को समतल कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय स्तुतिपरक शैली रखी गई है। ‘हे प्रभु’ और ‘युगानुयुग’ जैसे परिचित बाइबिलीय पदों के साथ वाक्यरचना सरल रखी गई है; परमेश्वर के लिए आदरसूचक ‘आप’ और बहुवचन क्रिया का प्रयोग किया गया है।
