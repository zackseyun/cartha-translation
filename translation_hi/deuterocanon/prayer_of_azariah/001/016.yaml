- issue: συντετριμμένῃ का पश्चात्तापपूर्ण बिंब
  choice: ‘टूटे हुए’
  alternative: ‘खेदित’ या ‘पश्चात्तापी’
  rationale: मूल शब्द टूटने या चूर होने का बिंब देता है। ‘टूटे हुए’ उस बिंब को बचाता है, जबकि अन्य विकल्प उसका अर्थ अधिक व्याख्यात्मक ढंग से निश्चित कर देते हैं।
- issue: τεταπεινωμένῳ की निष्क्रियता
  choice: ‘दीन किए गए’
  alternative: ‘दीन’ या ‘नम्र’
  rationale: पूर्ण निष्क्रिय कृदन्त उस दशा की ओर संकेत करता है जिसमें व्यक्ति नीचे लाया गया है। यह अनुवाद केवल स्वेच्छिक नम्रता मान लेने से बचता है।
