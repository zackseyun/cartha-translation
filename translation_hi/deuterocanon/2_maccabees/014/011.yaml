  yaml_path: translation/deuterocanon/2_maccabees/014/011.yaml
  text: When this man had said such things[a], the rest of the Friends, being quickly ill-disposed toward Judas[b], further incited Demetrius.
translation:
  language: hi
  text: उस व्यक्ति के ऐसी बातें कहने के बाद, शेष ‘मित्रों’[a] ने—जो यहूदा के प्रति कुछ दुर्भावना रखते थे—जल्दी ही देमेत्रियुस को और भड़का दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ, “शेष मित्र।” इस संदर्भ में “मित्र” संभवतः राजा के दरबार की एक पदवी है; इसलिए इसका आशय अन्य राजदरबारियों से हो सकता है।
    reason: cultural_note
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ है। इसका अर्थ देमेत्रियुस को और भड़काना, उसके मन में यहूदा के विरुद्ध पूर्वाग्रह भरना, या उसकी शत्रुता और बढ़ाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτων ... ῥηθέντων ὑπὸ τούτου
  choice: उस व्यक्ति के ऐसी बातें कहने पर
  rationale: सम्बन्धकारक निरपेक्ष रचना को स्वाभाविक हिन्दी कालवाचक उपवाक्य में रखा गया है; ‘उस व्यक्ति’ निकटवर्ती वक्ता की ओर संकेत करता है।
- source_word: θᾶττον
  choice: तुरंत
  rationale: यह प्रतिक्रिया की शीघ्रता व्यक्त करता है। यूनानी रूप में तुलनात्मक छाया संभव है, पर प्रसंग में ‘तुरंत’ सहज और संयत है।
- source_word: οἱ λοιποὶ φίλοι
  choice: राजा के बाकी ‘मित्र’
  rationale: सेल्यूसिड राजदरबार में φίλοι संभवतः सामान्य मित्रों के बजाय एक दरबारी पदवी थी। मुख्य पाठ में पदवी को रखा और अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया है।
- source_word: δυσμενῶς ἔχοντες τι πρὸς τὸν Ἰούδαν
  choice: जो यहूदा के प्रति कुछ दुर्भावना रखते थे
  rationale: दुश्मनी की मनोवृत्ति और τι से सूचित अनिश्चित/कुछ मात्रा—दोनों सुरक्षित रहते हैं।
- source_word: προετετύρωμαν τὸν Δημήτριον
  choice: देमेत्रियुस को और भड़का दिया
  rationale: दुर्लभ क्रिया का प्रसंगगत अर्थ देमेत्रियुस की यहूदा-विरोधी भावना को और उकसाना जान पड़ता है; ‘और’ उसके अग्रवर्ती/वर्धक बल को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
