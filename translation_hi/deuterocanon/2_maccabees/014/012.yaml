    text: या ‘यहूदिया का राज्यपाल’ अथवा ‘यहूदिया का सैनिक राज्यपाल’; यूनानी शब्द στρατηγός किसी सेनापति या किसी क्षेत्र के शासकीय अधिकारी—दोनों को सूचित कर सकता है, और यहाँ सम्भवतः दोनों भूमिकाएँ शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προχειρισάμενος
  choice: चुना
  rationale: यह कृदन्त किसी काम के लिए चुनने या नियुक्त करने को व्यक्त करता है। ‘चुना’ आगे आने वाले स्पष्ट नियुक्ति-सूचक ἀναδείξας से अनावश्यक पुनरुक्ति से बचाता है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह शीघ्र और बिना विलम्ब की गई कार्रवाई बताता है; आधुनिक हिन्दी में ‘तुरन्त’ स्वाभाविक और स्पष्ट है।
- source_word: τὸν γενόμενον ἐλεφαντάρχην
  choice: जो हाथियों का सेनापति रह चुका था
  rationale: ἐλεφαντάρχης युद्ध-हाथियों के अधिकारी को दर्शाता है। γενόμενον को ‘रह चुका था’ कहना निकानोर के पूर्व पद का स्वाभाविक हिन्दी वर्णन है, यद्यपि यूनानी मूलतः ‘बना था’ भी हो सकता है।
- source_word: στρατηγὸν
  choice: सेनापति
  rationale: στρατηγός का मूल सैन्य अर्थ ‘सेनापति’ है। यहूदिया के साथ प्रयुक्त होने पर इसमें प्रादेशिक शासनाधिकार भी निहित हो सकता है; उस सम्भावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀναδείξας
  choice: नियुक्त करके
  rationale: क्रिया किसी पद पर औपचारिक रूप से ठहराने या घोषित करने का भाव देती है; ‘नियुक्त’ पद-संदर्भ में सटीक और सहज है।
- source_word: ἐξαπέστειλεν
  choice: भेज दिया
  rationale: यह प्रेषित करने की पूर्ण कार्रवाई व्यक्त करता है। हिन्दी का ‘भेज दिया’ उपसर्गयुक्त यूनानी क्रिया की प्रबलता को स्वाभाविक ढंग से व्यक्त करता है।
