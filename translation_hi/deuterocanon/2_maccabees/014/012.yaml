  text: उसने तुरंत निकानोर को चुना, जो युद्ध-हाथियों का सेनापति बन चुका था, और उसे यहूदिया का सेनापति[a] नियुक्त करके भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
