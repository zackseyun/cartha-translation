lexical_decisions:
- source_word: παρεκάλεσεν
  choice: आग्रह किया
  rationale: यह क्रिया साधारण अनुरोध से बढ़कर गंभीर प्रेरणा या मनाने का भाव व्यक्त करती है; ‘आग्रह किया’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: γῆμαι
  choice: विवाह करे
  rationale: γαμέω का सीधा अर्थ विवाह करना है। यह रूप स्वाभाविक हिन्दी है और यूनानी पाठ से अधिक विवरण नहीं जोड़ता।
- source_word: παιδοποιήσασθαι
  choice: संतान उत्पन्न करे
  rationale: यह क्रिया संतान पैदा करने या संतान होने का भाव देती है। ‘संतान उत्पन्न करे’ गरिमापूर्ण आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: ἐγάμησεν
  choice: उसने विवाह किया
  rationale: यह γαμέω का सरल कथात्मक भूतकालीन रूप है; अतः सीधा अनुवाद उपयुक्त है।
- source_word: εὐστάθησεν
  choice: स्थिर हो गया
  rationale: क्रिया का मूल भाव स्थिर या स्थापित होने का है। ‘स्थिर हो गया’ इस भाव को बनाए रखता है, जबकि ‘घर बसा लिया’ विवाह के घरेलू पक्ष को अधिक स्पष्ट करके अर्थ को संकरा कर सकता है।
- source_word: ἐκοινώνησεν βίου
  choice: सामान्य जीवन में सहभागी हुआ
  rationale: κοινωνέω और βίος का यह संयोग जीवन में भाग लेने या साझा जीवन में प्रवेश करने का भाव देता है। ‘सामान्य जीवन में सहभागी हुआ’ मुहावरे के संभावित सामाजिक और घरेलू संकेत को व्यक्त करता है, पर उसे केवल गृहस्थ जीवन तक सीमित नहीं करता।
