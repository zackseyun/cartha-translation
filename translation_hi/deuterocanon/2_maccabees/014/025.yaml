  text: उसने उससे आग्रह किया कि वह विवाह करे और संतान उत्पन्न करे; उसने विवाह किया, स्थिर हो गया और सामान्य जीवन में सहभागी हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
