base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/027.yaml
  text: But the king became enraged[a], and, provoked by the slanders of that utterly wicked man, wrote to Nikanor[b], saying that he took the treaty very badly and ordering him to send Maccabeus to Antioch as a prisoner at once.
translation:
  language: hi
  text: परन्तु राजा क्रोध से भर उठा और उस सर्वथा दुष्ट मनुष्य की झूठी निन्दाओं से भड़ककर उसने निकानोर को लिखा, “मैं उस संधि[a] को बहुत बुरा मानता हूँ”; और आदेश दिया कि वह मक्काबी को बन्दी के रूप में[b] तुरन्त अन्ताकिया भेज दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समझौते’ अथवा ‘शान्ति की शर्तों’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘बाँधकर’; या ‘बन्दी बनाकर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυμος γενόμενος
  choice: क्रोध से भर उठा
  rationale: यह अभिव्यक्ति राजा के मन में तीव्र क्रोध उत्पन्न होने को दर्शाती है; यह स्वाभाविक हिन्दी में भाव की तीव्रता बनाए रखती है।
- source_word: πανπονήρου
  choice: सर्वथा दुष्ट
  rationale: यूनानी संयुक्त विशेषण में निहित प्रबल नैतिक निन्दा को बिना बढ़ाए स्पष्ट रूप से सुरक्षित रखता है।
- source_word: διαβολαῖς
  choice: झूठी निन्दाओं
  rationale: प्रसंग में यह दुर्भावनापूर्ण, बदनाम करनेवाले आरोपों को सूचित करता है; केवल ‘आरोपों’ की अपेक्षा यह शब्द की निन्दात्मक शक्ति बेहतर व्यक्त करता है।
- source_word: ἐρεθισθεὶς
  choice: भड़ककर
  rationale: राजा के क्रोध को उन निन्दाओं द्वारा उकसाए जाने का कारणात्मक सम्बन्ध सहज हिन्दी में व्यक्त होता है।
- source_word: συνθηκῶν
  choice: सन्धि
  rationale: राजनीतिक-सैनिक प्रसंग में यह पक्षों के बीच औपचारिक समझौते या शान्ति की शर्तों को सूचित करता है।
- source_word: φάσκων βαρέως φέρειν
  choice: कि वह उस सन्धि से बहुत अप्रसन्न है
  rationale: यूनानी मुहावरे का अर्थ किसी बात को बुरा मानना या उससे अत्यन्त अप्रसन्न होना है; हिन्दी में शाब्दिक असहजता से बचते हुए भाव सुरक्षित है।
- source_word: δέσμιον
  choice: बन्दी बनाकर
  rationale: शब्द बँधे हुए व्यक्ति या कैदी को सूचित करता है; यह अनिवार्य रूप से वास्तविक जंजीरों का उल्लेख किए बिना हिरासत की स्थिति व्यक्त करता है।
- source_word: ἐξαποστέλλειν
  choice: भेज दे
  rationale: राजकीय आदेश के प्रसंग में सरल और स्वाभाविक हिन्दी; प्रेषण का भाव पर्याप्त रूप से व्यक्त होता है।
- source_word: ταχέως
  choice: तुरन्त
  rationale: राजकीय आदेश की तात्कालिकता और शीघ्र अनुपालन की माँग को स्पष्ट करता है।
theological_decisions:
- issue: πανπονήρου में नैतिक चरित्रांकन
  choice: उस सर्वथा दुष्ट मनुष्य
  alternative: उस पूरी तरह दुष्ट मनुष्य
  rationale: प्रबल नैतिक निर्णय स्वयं यूनानी पाठ में है; अनुवाद उसे न नरम करता है, न किसी अतिरिक्त धार्मिक अर्थ से बढ़ाता है।
- issue: δέσμιον में बन्दी की अवस्था
  choice: बन्दी बनाकर
  alternative: बाँधकर / जंजीरों में
  rationale: यूनानी शब्द बन्दी या बँधे हुए व्यक्ति दोनों अर्थ दे सकता है। मुख्य पाठ सामान्य बन्दी-अवस्था रखता है और अधिक मूर्त विकल्प को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सुबोध रूप। ‘सन्धि’, ‘बन्दी’ और ‘अन्ताकिया’ जैसे प्रचलित बाइबलीय-ऐतिहासिक पद रखे गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
