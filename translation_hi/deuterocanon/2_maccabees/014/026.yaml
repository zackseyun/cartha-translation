  yaml_path: translation/deuterocanon/2_maccabees/014/026.yaml
  text: But Alcimus[a], perceiving the goodwill toward one another and learning of the agreements that had been made, came to Demetrius and said that Nicanor was favoring interests contrary to the state; for he had appointed Judas, the plotter against his kingdom[b], as successor.
translation:
  language: hi
  text: परन्तु अलकिमुस ने उनके आपसी सद्भाव को देखकर और उनके बीच हुए समझौतों की सूचना पाकर[a] देमेत्रियुस के पास जाकर कहा कि निकानोर राज्य के हितों के विरुद्ध विचार रखता है;[b] क्योंकि निकानोर ने यहूदा को—जो उसके राज्य के विरुद्ध षड्यंत्र रचने वाला था—उत्तराधिकारी नियुक्त किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सूचना पाकर’ का अधिक शाब्दिक अर्थ ‘प्राप्त करके’ है; आशय समझौतों की सूचना या विवरण प्राप्त करने का भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप: ‘राजकीय मामलों से परायी बातें सोचता है।’ यह यूनानी मुहावरा राज्य के हितों से विमुख राजनीतिक रुख का आरोप व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδὼν
  choice: देखा
  rationale: यहाँ क्रिया केवल आँखों से देखने के बजाय स्थिति को पहचानने का भाव रखती है; हिन्दी में प्रसंग सहित ‘देखा’ स्वाभाविक रूप से दोनों अर्थ व्यक्त करता है।
- source_word: εὔνοιαν
  choice: आपसी सद्भाव
  rationale: यह दोनों पक्षों के बीच मैत्रीपूर्ण और अनुकूल भाव को व्यक्त करता है, बिना घनिष्ठ मित्रता का अतिरिक्त अर्थ जोड़े।
- source_word: συνθήκας
  choice: समझौतों
  rationale: यह व्यवस्था, संधि या तय हुई शर्तों के लिए व्यापक और सहज शब्द है; ‘संधियाँ’ इस प्रसंग में अनावश्यक रूप से अत्यधिक औपचारिक हो सकता है।
- source_word: λαβὼν
  choice: पता चला
  rationale: शाब्दिक अर्थ ‘प्राप्त करके’ है, पर समझौतों के साथ इसका भाव उनके विषय में सूचना प्राप्त करना जान पड़ता है।
- source_word: ἀλλότρια φρονεῖν τῶν πραγμάτων
  choice: राज्य के हितों के विरुद्ध सोच रहा है
  rationale: यूनानी राजनीतिक मुहावरा शाब्दिक रूप से ‘मामलों से परायी बातें सोचना’ जैसा है। चुना हुआ रूप आरोप की राजनीतिक निष्ठाहीनता को स्पष्ट करता है, फिर भी ‘सोचने’ की मूल अभिव्यक्ति बनाए रखता है।
- source_word: ἐπίβουλον
  choice: षड्यंत्र रचने वाला
  rationale: यह किसी के विरुद्ध घात या योजना बनाने वाले व्यक्ति का बोध कराता है।
- source_word: διάδοχον ἀπέδειξεν
  choice: उत्तराधिकारी नियुक्त कर दिया है
  rationale: यह पदबंध किसी को अगले पदाधिकारी या उत्तराधिकारी के रूप में नामित करने का अर्थ देता है; ‘उत्तराधिकारी’ वंशानुगत अधिकार को आवश्यक नहीं ठहराता।
theological_decisions:
- issue: निकानोर के विरुद्ध राजनीतिक आरोप का स्वरूप
  choice: ‘राज्य के हितों के विरुद्ध सोच रहा है’
  alternative: ‘राजकीय मामलों से परायी बातें सोच रहा है’
  rationale: मूल मुहावरा संक्षिप्त और कुछ अस्पष्ट है। चुना हुआ पाठ उसके राजनीतिक आशय को समझने योग्य बनाता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- issue: διάδοχον का आशय
  choice: ‘उत्तराधिकारी नियुक्त’
  alternative: ‘वारिस ठहराया’ अथवा ‘स्थानापन्न बनाया’
  rationale: ‘उत्तराधिकारी’ पद या भूमिका में अनुवर्तन को व्यक्त करता है और ‘वारिस’ की तरह वंशानुगत अर्थ नहीं जोड़ता। मूल पाठ यह स्पष्ट नहीं करता कि वह ठीक किसका उत्तराधिकारी था, इसलिए हिन्दी में भी इसे अनिर्दिष्ट रखा गया है।
- issue: αὐτοῦ (‘उसके’) का संदर्भ
  choice: ‘उसके राज्य’
  alternative: ‘देमेत्रियुस के राज्य’
  rationale: व्याकरण और प्रसंग देमेत्रियुस की ओर संकेत करते हैं, पर मूल पाठ सर्वनाम का प्रयोग करता है। हिन्दी में सर्वनाम रखकर मूल की अभिव्यक्ति और संभावित संदर्भगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। नामों के रूप ‘अलकिमुस’, ‘देमेत्रियुस’ और ‘निकानोर’ यूनानी उच्चारण के निकट हैं। वाक्य में राजनीतिक आरोप की तीक्ष्णता बनी रहती है, पर मूल से अधिक स्पष्ट राजद्रोह या धार्मिक आशय नहीं जोड़ा गया।
