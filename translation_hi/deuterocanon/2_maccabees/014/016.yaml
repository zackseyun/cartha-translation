  text: But when the commander gave the order[a], he broke camp from there at once and joined battle with them near the village of Lessaou.
translation:
  language: hi
  text: परन्तु सेनापति के आदेश देते ही, वह वहाँ से तुरंत छावनी उठाकर चला और लेस्साऊ गाँव के पास उनसे भिड़ गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “लेस्साऊ गाँव में उनसे युद्ध करने लगा।” यूनानी पदबंध गाँव की ओर बढ़ने अथवा वहाँ कार्रवाई करने का अर्थ दे सकता है; ‘भिड़ गया’ की मूल क्रिया का शाब्दिक अर्थ ‘साथ मिलना’ है, पर यहाँ उसका प्रयोग सैन्य प्रसंग में हुआ है।'
    reason: क्रिया और स्थानसूचक पदबंध की वास्तविक शाब्दिक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: προστάξαντος
  choice: आदेश देते ही
  rationale: अओरिस्ट कृदन्त उस आदेश को मुख्य कार्रवाई का तात्कालिक कारण बताता है; यह प्रयोग हिन्दी में समय और कारण दोनों का स्वाभाविक संकेत देता है।
- source_word: τοῦ ἡγουμένου
  choice: सेनापति
  rationale: सैन्य प्रसंग में ἡγούμενος का अर्थ अगुआ या कमांडर है; ‘सेनापति’ नागरिक पद का अनावश्यक संकेत दिए बिना भूमिका स्पष्ट करता है।
- source_word: ἀναζεύξας
  choice: छावनी उठाकर चला
  rationale: यह सैन्य क्रिया पड़ाव समेटकर कूच करने को व्यक्त करती है; चयन उसके ठोस सैन्य अर्थ को बनाए रखता है।
- source_word: εὐθέως
  choice: तुरंत
  rationale: यह मूल के तत्काल प्रस्थान के बल को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συνμίσγει αὐτοῖς
  choice: उनसे भिड़ गया
  rationale: क्रिया का शाब्दिक भाव ‘उनके साथ मिलना’ है, पर सैन्य प्रसंग में इसका अर्थ मुठभेड़ या युद्ध में भिड़ना है।
- source_word: ἐπὶ κώμην
  choice: गाँव के पास
  rationale: ἐπί के साथ कर्मकारक दिशा, पहुँच अथवा किसी स्थान के निकट कार्रवाई का संकेत दे सकता है; ‘के पास’ स्थानगत अनिश्चितता को सावधानी से बनाए रखता है।
- source_word: Λεσσαού
  choice: लेस्साऊ
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण किया गया है।
