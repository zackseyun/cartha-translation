lexical_decisions:
- source_word: ἀναποδισάντων
  choice: पीछे हटे
  rationale: यह कृदन्त आसपास के लोगों के पीछे की ओर हटने को व्यक्त करता है; आधुनिक हिन्दी में ‘पीछे हटे’ स्वाभाविक है और अनावश्यक सैनिक अर्थ से बचता है।
- source_word: ταχέως
  choice: जल्दी से
  rationale: यह क्रिया की तीव्रता और अचानकपन को सरल, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: γενομένου διαστήματος
  choice: बीच में जगह बन गई
  rationale: सम्बन्धकारक निरपेक्ष रचना बताती है कि लोगों के हटने से एक खाली स्थान बन गया; यह अनुवाद कारण को जोड़े बिना उस दृश्य को स्पष्ट रखता है।
- source_word: κατὰ μέσον
  choice: के बीचोंबीच
  rationale: यह खुले स्थान के मध्य भाग की ओर पहुँचने का बोध कराता है।
- source_word: κενεῶνα
  choice: खुले आँगन
  rationale: दुर्लभ यूनानी संज्ञा किसी खुले या खाली प्रांगण को सूचित करती है; ‘खुला आँगन’ सामान्य पाठक के लिए स्थान का स्वरूप स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἦλθεν
  choice: जा पहुँचा
  rationale: मूल क्रिया का सामान्य अर्थ ‘आया/पहुँचा’ है। प्रसंग में गति के परिणाम को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘जा पहुँचा’ चुना गया है; ‘आ गिरा’ प्रसंगानुकूल होता, पर क्रिया में स्पष्टतः निहित न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
