base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/033.yaml
  text: 'Stretching out his right hand toward the temple[a], he swore this: “If you do not hand Judas over to me as a prisoner, I will make this sanctuary of God a plain, tear down the altar, and raise up here a splendid temple to Dionysus.”'
translation:
  language: hi
  text: 'उसने मंदिर की ओर अपना दाहिना हाथ बढ़ाकर यह शपथ खाई: “यदि तुम यहूदा को बंदी के रूप में मेरे हवाले नहीं करोगे, तो मैं परमेश्वर के इस पवित्र भवन को समतल मैदान में बदल दूँगा, वेदी को ढहा दूँगा और यहीं दियोनिसुस के लिए एक भव्य मंदिर खड़ा करूँगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείνας τὴν δεξιὰν
  choice: अपना दाहिना हाथ बढ़ाकर
  rationale: शपथ के साथ किए गए ठोस शारीरिक संकेत को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यूनानी में निहित संबंध के अनुसार ‘अपना’ जोड़ा गया है।
- source_word: ἐπὶ τὸν νεών
  choice: मंदिर की ओर
  rationale: हाथ बढ़ाने की क्रिया के साथ ἐπί को दिशासूचक समझना उचित है। νεών यहाँ मंदिर के पवित्र भवन को सूचित करता है।
- source_word: ὤμοσεν ταῦτα
  choice: यह शपथ खाई
  rationale: हिन्दी में शपथ लेने के लिए स्वाभाविक मुहावरा है और ταῦτα का संकेत ‘यह’ से बना रहता है।
- source_word: δέσμιον ... παραδῶτε
  choice: बंदी बनाकर मेरे हवाले नहीं करोगे
  rationale: δέσμιον की विधेयात्मक शक्ति और παραδίδωμι के शत्रुतापूर्ण सुपुर्दगी-संदर्भ, दोनों को स्पष्ट करता है; वास्तविक बेड़ियों का अनावश्यक संकेत नहीं देता।
- source_word: τὸν τοῦ θεοῦ σηκόν
  choice: परमेश्वर के इस पवित्र भवन को
  rationale: σηκός देवस्थान के भीतरी पवित्र भवन को सूचित कर सकता है। ‘पवित्र भवन’ इसे पहले आए νεών और बाद के ἱερόν से कुछ अलग रखते हुए सहज हिन्दी देता है।
- source_word: εἰς πεδίον ποιήσω
  choice: समतल मैदान बना दूँगा
  rationale: यूनानी की सजीव धमकी—भवन को खुले समतल भूभाग में बदल देना—को केवल सामान्य ‘नष्ट कर दूँगा’ कहकर समतल नहीं करता।
- source_word: τὸ θυσιαστήριον κατασκάψω
  choice: वेदी को ढहा दूँगा
  rationale: θυσιαστήριον के लिए ‘वेदी’ मानक है; κατασκάπτω यहाँ नींव तक गिराने या ध्वस्त करने की धमकी व्यक्त करता है।
- source_word: ἱερὸν ... τῷ Διονύσῳ ἐπιφανές
  choice: दियुनुसुस के लिए एक भव्य मंदिर
  rationale: ἱερόν के लिए ‘मंदिर’ स्पष्ट है और ἐπιφανές की दृष्टिगोचर, प्रभावशाली तथा शानदार गुणवत्ता को ‘भव्य’ स्वाभाविक रूप से व्यक्त करता है। यूनानी देवता का नाम स्रोत के निकट लिप्यंतरित है।
- source_word: ἀναστήσω
  choice: खड़ा करूँगा
  rationale: किसी भवन को स्थापित या निर्मित करने का ठोस बिंब बनाए रखता है।
theological_decisions:
- issue: यरूशलेम के पवित्र स्थल और प्रस्तावित यूनानी देव-मंदिर के लिए प्रयुक्त विभिन्न शब्द
  choice: νεών को ‘मंदिर’, σηκόν को ‘पवित्र भवन’, θυσιαστήριον को ‘वेदी’ और ἱερόν को फिर ‘मंदिर’ कहा गया है।
  alternative: सभी पवित्र-स्थल संबंधी शब्दों को एक समान ‘मंदिर’ कहना।
  rationale: मूल यूनानी में शब्द-विविधता है। जहाँ आधुनिक हिन्दी अनुमति देती है, उसे बनाए रखने से यहूदी पवित्र भवन, उसकी वेदी और दियुनुसुस के प्रस्तावित मंदिर के बीच का अलंकारिक विरोध स्पष्ट रहता है।
- issue: εἰς πεδίον ποιήσω में विनाश की धमकी
  choice: ‘समतल मैदान बना दूँगा’
  alternative: ‘पूरी तरह नष्ट कर दूँगा’ या ‘ज़मीन में मिला दूँगा’।
  rationale: अधिक मुहावरेदार विकल्प अर्थ समझाते हैं, पर मूल पाठ के ‘मैदान’ वाले स्पष्ट बिंब को मिटा देते हैं। चुना हुआ रूप उस तनाव और अतिशयोक्तिपूर्ण धमकी को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य में प्रत्यक्ष धमकी की कठोरता बनी रहती है। ‘यहूदा’ नाम इस ग्रंथ के यहूदी पात्र के प्रचलित हिन्दी रूप में है; ‘दियुनुसुस’ यूनानी Διόνυσος का स्रोत-समीपी देवनागरी लिप्यंतरण है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
