- source_word: στέφανον χρυσοῦν
  choice: सोने का एक मुकुट
  rationale: दरबारी भेंट के संदर्भ में στέφανος के लिए ‘मुकुट’ स्पष्ट और स्वाभाविक है।
- source_word: φοίνικα
  choice: खजूर की एक डाल
  rationale: यहाँ φοῖνιξ पेड़ नहीं, समारोह में प्रयुक्त उसकी डाल को सूचित करता है।
- source_word: τοῖς νομιζομένοις θαλλῶν τοῦ ἱεροῦ
  choice: पवित्रस्थान की हरी डालियों में से प्रथा के अनुसार भेंट की जाने वाली वस्तुएँ
  rationale: यूनानी पदबंध संक्षिप्त और कुछ हद तक अध्याहृत है। अनुवाद प्रथागत प्रस्तुति के भाव को स्पष्ट करता है, पर पवित्रस्थान और हरी डालियों के संबंध को कठोरता से निर्धारित नहीं करता।
- source_word: ἡσυχίαν ἔσχεν
  choice: वह चुप रहा
  rationale: यह मुहावरा शांत रहने या उस समय आगे कोई कार्रवाई न करने का अर्थ दे सकता है; संक्षिप्त हिन्दी मूल की अस्पष्टता को बनाए रखती है।
