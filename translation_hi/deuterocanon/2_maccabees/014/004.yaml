  text: वह एक सौ इक्यावनवें वर्ष में राजा देमेत्रियुस के पास आया। वह उसके लिए सोने का एक मुकुट और खजूर की एक डाल लाया, और इनके अतिरिक्त पवित्रस्थान की हरी डालियों की प्रथागत भेंटें भी लाया[a]। उस दिन वह चुप रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इनके अतिरिक्त वे प्रथागत वस्तुएँ भी, अर्थात् पवित्रस्थान की हरी डालियाँ।” यूनानी पदबंध संक्षिप्त है और उसका व्याकरणिक संबंध कुछ अस्पष्ट है।
    reason: lexical_alternative
