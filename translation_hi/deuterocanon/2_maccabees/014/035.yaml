base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/035.yaml
  text: You[a], O Lord, though needing nothing from anyone[b], were pleased for a temple of your dwelling to come into being among us.
translation:
  language: hi
  text: हे प्रभु, जिन्हें किसी भी चीज़ की आवश्यकता नहीं है[a], आपने प्रसन्न होकर चाहा कि हमारे बीच[b] आपके निवास के लिए एक मंदिर बने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: ‘सब वस्तुओं से आवश्यकता-रहित’; अर्थात प्रभु को किसी वस्तु या व्यक्ति से कुछ पाने की आवश्यकता नहीं है।'
    reason: lexical_alternative
  - marker: b
    text: या ‘हममें’। यूनानी पद ἐν ἡμῖν के दोनों अर्थ संभव हैं, पर मंदिर के इस प्रसंग में सामुदायिक अर्थ ‘हमारे बीच’ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπροσδεὴς
  choice: आवश्यकता नहीं है
  rationale: यह विशेषण किसी आवश्यकता से रहित होने या किसी पर निर्भर न होने का भाव देता है। सरल आधुनिक हिन्दी में यह प्रयोग परमेश्वर की आत्मनिर्भरता को स्पष्ट रखता है।
- source_word: τῶν ὅλων
  choice: किसी भी वस्तु की
  rationale: इसका शाब्दिक भाव ‘सब वस्तुओं का/से’ है। ἀπροσδεὴς के साथ मिलकर यह बताता है कि प्रभु को किसी भी वस्तु की आवश्यकता नहीं है; इसे केवल व्यक्तियों तक सीमित नहीं किया गया।
- source_word: ηὐδόκησας
  choice: आपने प्रसन्न होकर चाहा
  rationale: क्रिया में प्रसन्न होने और अनुकूल इच्छा या निर्णय करने, दोनों का भाव है। यह हिन्दी अभिव्यक्ति दोनों पहलुओं को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ναὸν
  choice: मंदिर
  rationale: इस प्रसंग में शब्द परमेश्वर के निवास-स्थान के रूप में मंदिर अथवा पवित्रस्थान को दर्शाता है; ‘मंदिर’ सबसे स्पष्ट और प्रचलित विकल्प है।
- source_word: τῆς σῆς σκηνώσεως
  choice: आपके निवास का
  rationale: σκηνώσις का अर्थ निवास करना, डेरा डालना अथवा निवास-स्थान है। ‘आपके निवास का’ मूल संबंध को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: ἐν ἡμῖν
  choice: हमारे बीच
  rationale: बहुवचन सर्वनाम के साथ ἐν का अर्थ ‘हमारे बीच’ या ‘हममें’ हो सकता है। मंदिर और सामुदायिक उपस्थिति के प्रसंग में ‘हमारे बीच’ अधिक संभावित है, जबकि दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: γενέσθαι
  choice: बने
  rationale: γίνομαι का मूल अर्थ होना, बनना या अस्तित्व में आना है। ‘बने’ स्वाभाविक और संक्षिप्त है तथा ‘निर्माण किया जाए’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: ἀπροσδεὴς τῶν ὅλων द्वारा व्यक्त परमेश्वर की आत्मनिर्भरता
  choice: आपको किसी भी वस्तु की आवश्यकता नहीं है, फिर भी
  alternative: आप सब वस्तुओं से निरपेक्ष हैं
  rationale: मूल पाठ यह तनाव बनाए रखता है कि प्रभु को मंदिर की आवश्यकता नहीं, फिर भी उन्होंने अपने लोगों के बीच अपने निवास का मंदिर चाहा। ‘फिर भी’ कृदंत के प्रसंगगत स्वीकारार्थक संबंध को स्पष्ट करता है, बिना उसे दार्शनिक अमूर्तन में बदलने के।
- issue: ἐν ἡμῖν का सामुदायिक अथवा आंतरिक अर्थ
  choice: हमारे बीच
  alternative: हममें
  rationale: मंदिर और परमेश्वर के निवास के प्रसंग में सामुदायिक/स्थानगत अर्थ अधिक संभावित है। फिर भी यूनानी पद की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, प्रार्थनात्मक और गरिमापूर्ण रूप अपनाया गया है। संबोधन में आदरसूचक ‘आप’ रखा गया है। वाक्य में परमेश्वर की आत्मनिर्भरता और लोगों के बीच निवास करने की उनकी प्रसन्न इच्छा—दोनों के बीच मूल धार्मिक तनाव सुरक्षित है।
