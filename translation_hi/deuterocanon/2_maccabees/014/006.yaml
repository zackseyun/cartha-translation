  yaml_path: translation/deuterocanon/2_maccabees/014/006.yaml
  text: In reply he said[a], “Those among the Jews who are called Hasideans, whose leader is Judas Maccabaeus, keep feeding war and stirring up rebellion[b], not allowing
translation:
  language: hi
  text: इसके उत्तर में उसने कहा, “यहूदियों में जो हसीदी कहलाते हैं,[a] जिनका अगुआ यहूदा मकाबी है, वे युद्ध को हवा देते और विद्रोह भड़काते रहते हैं; वे अनुमति नहीं देते कि—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदियों में जो तथाकथित हसीदी हैं।” यूनानी शब्द में कुछ दूरी या तिरस्कार का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्य अगले पद में जारी रहता है; यह पद “अनुमति नहीं देते” पर अधूरा समाप्त होता है।
    reason: verse_boundary
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: इसके उत्तर में
  rationale: यह पदबंध पिछली बात के प्रत्युत्तर का संकेत देता है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἔφη
  choice: उसने कहा
  rationale: सामान्य आख्यानात्मक कथन-क्रिया; इससे मूल के स्वर में अनावश्यक बल नहीं जुड़ता।
- source_word: Οἱ λεγόμενοι
  choice: जो ... कहलाते हैं
  rationale: मूल में यह पदबंध तटस्थ ‘कहलाने वाले’ अथवा कुछ दूरी दर्शाने वाला ‘तथाकथित’ हो सकता है; मुख्य पाठ में तटस्थ अर्थ रखा गया है।
- source_word: Ἀσιδαῖοι
  choice: हसीदी
  rationale: यह एक विशिष्ट यहूदी समूह का ऐतिहासिक नाम है, इसलिए अर्थानुवाद के बजाय हिन्दी लिप्यंतरण किया गया है।
- source_word: ὧν ἀφηγεῖται
  choice: जिनका अगुआ ... है
  rationale: क्रिया समूह का नेतृत्व करने या उसके आगे होने को दर्शाती है; ‘अगुआ’ सरल, वर्तमान और स्वाभाविक हिन्दी है।
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: यहूदा मकाबी
  rationale: व्यक्ति और उपाधि के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: πολεμοτροφοῦσιν
  choice: युद्ध को हवा देते ... रहते हैं
  rationale: मूल क्रिया युद्ध को पोसने या बढ़ाते रहने का सजीव भाव देती है; हिन्दी मुहावरा सक्रिय प्रोत्साहन और निरंतरता दोनों व्यक्त करता है।
- source_word: στασιάζουσιν
  choice: विद्रोह भड़काते रहते हैं
  rationale: यह क्रिया गुटबंदी, राजद्रोह या नागरिक विद्रोह पैदा करने की सक्रियता बताती है; यह रूप सामान्य पाठक के लिए स्पष्ट है।
- source_word: οὐκ ἐῶντες
  choice: वे अनुमति नहीं देते कि—
  rationale: पद की सीमा पर यूनानी वाक्य अधूरा है और उसका पूरक अगले पद में आता है; डैश इस अपूर्णता को बिना कोई कर्म जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: Ἀσιδαῖοι समूह के नाम का स्वरूप
  choice: हसीदी
  alternative: धर्मनिष्ठ लोग; असीदी
  rationale: ऐतिहासिक दल के नाम का लिप्यंतरण उसके प्रति सकारात्मक मूल्यांकन थोपने से बचाता है।
- issue: Οἱ λεγόμενοι का संभावित दूरीसूचक भाव
  choice: जो ... कहलाते हैं
  alternative: तथाकथित
  rationale: संदर्भ में तिरस्कार या दूरी का भाव संभव है, पर इतना निश्चित नहीं कि उसे मुख्य पाठ में अनिवार्य बनाया जाए; विकल्प पादटिप्पणी में रखा गया है।
- issue: पदांत पर अधूरा वाक्य
  choice: वे अनुमति नहीं देते कि—
  alternative: अगले पद का आशय जोड़कर वाक्य पूरा करना
  rationale: मूल यूनानी वाक्य अगले पद में जारी रहता है; इस पद में अनकहा कर्म जोड़ना मूल की संरचना और तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज आख्यानात्मक रूप अपनाया गया है। ‘हसीदी’ ऐतिहासिक समूह-नाम के रूप में और ‘यहूदा मकाबी’ प्रचलित हिन्दी नाम-रूप में रखा गया है। पदांत की व्याकरणिक अपूर्णता को डैश और पादटिप्पणी से स्पष्ट किया गया है।
