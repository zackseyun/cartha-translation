base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/038.yaml
  text: For in earlier times[a], when separation was being judged, he had come under accusation for Judaism[b], and had risked both body and soul for Judaism with all earnestness.
translation:
  language: hi
  text: क्योंकि पहले के समय में[a], जब अलगाव के विषय में मुकदमा चल रहा था, उस पर यहूदी जीवन-पद्धति के कारण आरोप लगाया गया था[b]; और उसने पूरे उत्साह के साथ यहूदी जीवन-पद्धति के लिए अपने शरीर और प्राण दोनों को जोखिम में डाल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहले के समय में, जब मेल-जोल न रखने के विषय में एक मुकदमे की सुनवाई हो रही थी।” यूनानी पदबंध संक्षिप्त है और सम्भवतः न्यायिक प्रसंग को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: “यहूदी जीवन-पद्धति” से यहाँ केवल धार्मिक विचार नहीं, बल्कि दबाव के बीच यहूदी पैतृक पहचान, रीति-व्यवहार और निष्ठा भी अभिप्रेत हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: पहले के समय में
  rationale: यह पदबंध अतीत के एक पूर्व अवसर की ओर संकेत करता है; यह अनुवाद स्वाभाविक आधुनिक हिन्दी में उसके पूर्वकालिक भाव को बनाए रखता है।
- source_word: τῆς ἀμιξίας κρίσις
  choice: जब अलगाव के विषय में मुकदमा चल रहा था
  rationale: ἀμιξία का मूल भाव मेल-जोल न रखने या अलग रहने का है, जबकि κρίσις यहाँ न्यायिक प्रसंग सूचित करता है। यूनानी पदबंध संक्षिप्त और कुछ अस्पष्ट है, इसलिए मुख्य पाठ में न्यायिक अर्थ रखते हुए पादटिप्पणी में वैकल्पिक समझ दी गई है।
- source_word: εἰσενηνεγμένος Ἰουδαισμοῦ
  choice: उस पर यहूदी जीवन-पद्धति अपनाने के कारण आरोप लगाया गया था
  rationale: Perfect participle को न्यायिक संदर्भ में किसी व्यक्ति को आरोप या विचारण के अधीन लाए जाने के रूप में समझा गया है। कारणसूचक सम्बन्ध को सहज हिन्दी में व्यक्त किया गया है।
- source_word: Ἰουδαισμοῦ
  choice: यहूदी जीवन-पद्धति
  rationale: Ἰουδαϊσμός यहाँ केवल अमूर्त धार्मिक सिद्धान्त नहीं, बल्कि दबाव के बीच यहूदी पैतृक पहचान, आचरण और निष्ठा को समेटता है। यह विकल्प ‘यहूदी धर्म’ की अपेक्षा उस व्यापक ऐतिहासिक अर्थ को बेहतर बनाए रखता है।
- source_word: σῶμα καὶ ψυχὴν
  choice: अपने शरीर और प्राण दोनों
  rationale: यूनानी की दोहरी अभिव्यक्ति को बनाए रखते हुए सम्पूर्ण आत्म-जोखिम का बल सुरक्षित रखा गया है। ψυχή के लिए ‘प्राण’ इस प्रसंग में जीवन को दाँव पर लगाने का स्वाभाविक हिन्दी भाव देता है।
- source_word: παραβεβλημένος
  choice: जोखिम में डाल दिया था
  rationale: यह क्रिया स्वयं को खतरे के सामने रखने का भाव देती है; चुना हुआ हिन्दी प्रयोग स्पष्ट और मुहावरेदार है।
- source_word: μετὰ πάσης ἐκτενίας
  choice: पूरे उत्साह के साथ
  rationale: यह पदबंध पूर्ण तत्परता और तीव्र समर्पण व्यक्त करता है, बिना उस भाव को किसी विशिष्ट धार्मिक तकनीकी शब्द तक सीमित किए।
theological_decisions:
- issue: द्वितीय मन्दिर-कालीन प्रसंग में Ἰουδαϊσμός का अर्थ
  choice: यहूदी जीवन-पद्धति
  alternative: यहूदी धर्म
  rationale: ‘यहूदी धर्म’ आधुनिक पाठक को केवल धार्मिक विश्वासों का संकीर्ण अर्थ दे सकता है। ‘यहूदी जीवन-पद्धति’ पैतृक पहचान, रीति और धार्मिक निष्ठा—इन सभी को खुला रखती है।
- issue: σῶμα καὶ ψυχή की मानव-संबंधी अभिव्यक्ति
  choice: शरीर और प्राण दोनों
  alternative: अपना पूरा अस्तित्व
  rationale: मूल पाठ की द्विपदी अभिव्यक्ति और उसके अलंकारिक बल को सुरक्षित रखा गया है; इसे किसी कठोर शरीर–आत्मा सिद्धान्त के रूप में नहीं समझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। न्यायिक प्रसंग के लिए ‘मुकदमा’ और ‘आरोप’ जैसे सामान्यतः समझे जाने वाले शब्द चुने गए हैं। ‘यहूदी जीवन-पद्धति’ के द्वारा ऐतिहासिक-सांस्कृतिक व्यापकता बचाई गई है और पादटिप्पणियों के सभी चिह्न मुख्य पाठ में उपस्थित हैं।
