base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/014.yaml
  text: But those in Judea who had driven Judas out kept flocking in droves to Nicanor from among the nations[a], thinking that the misfortunes and disasters of the Jews would become their own prosperity.
translation:
  language: hi
  text: परन्तु जिन्होंने यहूदा को यहूदिया से भगा दिया था, वे जातियों के साथ[a] झुंड-के-झुंड निकानोर के पास जा मिलते रहे, क्योंकि वे सोचते थे कि यहूदियों का दुर्भाग्य और विपत्तियाँ उनकी अपनी समृद्धि बन जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे जातियों में से झुंड-के-झुंड निकानोर के पास जा मिलते रहे।” यूनानी वाक्य की संरचना संक्षिप्त है और इसे एक से अधिक प्रकार से समझा जा सकता है; ‘जातियों’ का अर्थ संदर्भ में ‘गैर-यहूदी लोग’ भी हो सकता है।
    reason: मूल यूनानी में ἔθνη का συνέμιγνυν और τῷ Νικάνορι के साथ संबंध संक्षिप्त तथा व्याख्यात्मक रूप से अनिश्चित है।
lexical_decisions:
- source_word: οἱ ... πεφυγαδευκότες τὸν Ἰούδαν
  choice: जिन लोगों ने यहूदा को भगा दिया था
  rationale: φυγαδεύω का causative भाव किसी को भागने या निर्वासन में जाने पर विवश करना है। ‘भगा दिया था’ पूर्ण कृदन्त का पूर्वकालिक परिणाम और कारक भाव दोनों सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τῆς Ἰουδαίας
  choice: यहूदिया में
  rationale: यह पद उन लोगों की स्थिति ‘यहूदिया में’ बताता है; इसे अनिवार्यतः यहूदा को ‘यहूदिया से’ भगाने के रूप में जोड़ना यूनानी संरचना की संभावित अस्पष्टता को समय से पहले सुलझा देगा।
- source_word: ἔθνη
  choice: गैर-यहूदी जातियों
  rationale: यहूदी ऐतिहासिक प्रसंग में ἔθνη प्रायः अन्यजातियों/गैर-यहूदियों को सूचित करता है। ‘गैर-यहूदी जातियाँ’ आधुनिक पाठक के लिए स्पष्ट है और मूल के बहुवचन ‘जातियों’ को बनाए रखता है।
- source_word: συνέμιγνυν ... τῷ Νικάνορι
  choice: निकानोर से जा मिले
  rationale: συμμείγνυμι का मूल भाव मिलना या सम्मिलित होना है। ‘जा मिले’ राजनीतिक पक्ष ग्रहण करने और समूहगत गति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγεληδόν
  choice: झुंड-के-झुंड
  rationale: यह क्रियाविशेषण शाब्दिक रूप से पशुओं के झुंडों जैसी सामूहिक भीड़ का सजीव, कुछ अवमाननापूर्ण चित्र देता है; ‘झुंड-के-झुंड’ उसे बनाए रखता है।
- source_word: ἀτυχίας καὶ συμφοράς
  choice: दुर्भाग्य और विपत्तियाँ
  rationale: 'दोनों निकटार्थक शब्दों को अलग रखा गया है: ἀτυχία बुरे भाग्य/असफलता और συμφορά गंभीर विपत्ति या अनिष्ट को दर्शाता है।'
- source_word: ἰδίας εὐημερίας
  choice: उनकी अपनी समृद्धि
  rationale: εὐημερία का अर्थ समृद्धि या कुशलता है। ‘अपनी समृद्धि’ यहूदियों की विपत्तियों से स्वार्थपूर्ण विरोध को स्पष्ट रखता है।
- source_word: δοκοῦντες ἔσεσθαι
  choice: वे सोचते थे कि ... बन जाएँगी
  rationale: वर्तमान कृदन्त के साथ भविष्य infinitive उनकी उस समय की भावी अपेक्षा दर्शाता है; ‘सोचते थे कि ... बन जाएँगी’ इसे सहजता से व्यक्त करता है।
theological_decisions:
- issue: यहूदी ऐतिहासिक संदर्भ में ἔθνη का अनुवाद
  choice: गैर-यहूदी जातियाँ
  alternative: जातियाँ; अन्यजाति लोग
  rationale: यहाँ शब्द जातीय-राजनीतिक समूहों को दर्शाता है और यहूदी साहित्य में प्रायः गैर-यहूदियों के लिए प्रयुक्त होता है। चुना हुआ रूप इस संदर्भ को स्पष्ट करता है, पर किसी अतिरिक्त धर्मवैज्ञानिक निर्णय को आरोपित नहीं करता।
- issue: संक्षिप्त यूनानी वाक्यांश ἔθνη συνέμιγνυν ... τῷ Νικάνορι का संबंध
  choice: गैर-यहूदी जातियों के साथ निकानोर से जा मिले
  alternative: गैर-यहूदी जातियों में से झुंड-के-झुंड निकानोर के पास आए
  rationale: ἔθνη accusative और τῷ Νικάνορι dative के साथ संरचना संक्षिप्त तथा असामान्य है। मुख्य पाठ ‘जातियों के साथ’ वाला संबंध अपनाता है, जबकि पादटिप्पणी वैकल्पिक विभाजन सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण ऐतिहासिक-वर्णनात्मक स्तर। ‘परन्तु’, ‘विपत्तियाँ’ और ‘समृद्धि’ साहित्यिक गरिमा रखते हैं, जबकि ‘भगा दिया’, ‘जा मिले’ और ‘सोचते थे’ सामान्य पाठक के लिए स्वाभाविक हैं। मुख्य पाठ में [a] पादटिप्पणी-चिह्न सम्मिलित है।
