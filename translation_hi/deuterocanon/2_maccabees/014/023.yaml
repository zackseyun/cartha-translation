- source_word: συναχθέντας
  choice: इकट्ठी हुई
  rationale: यह कृदन्त भीड़ के एकत्र हो जाने को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγελαίους
  choice: झुंड की तरह
  rationale: यह विशेषण मूलतः झुंड का बिंब देता है और मनुष्यों के लिए प्रयुक्त होने पर तिरस्कारपूर्ण भाव रखता है। मुख्य पाठ में बिंब सुरक्षित रखा गया है और पादटिप्पणी में उसका भाव स्पष्ट किया गया है।
- source_word: ὄχλους
  choice: भीड़
  rationale: ὄχλος के सामान्य अर्थ ‘भीड़’ को रखा गया है; उसके नकारात्मक रंग को साथ आए विशेषण ἀγελαίους से व्यक्त किया गया है।
- source_word: ἀπέλυσεν
  choice: विदा कर दिया
  rationale: यहाँ आशय बंदियों को मुक्त करने का नहीं, एकत्र लोगों को वहाँ से जाने देने या तितर-बितर करने का है। ‘विदा कर दिया’ इस प्रसंग में सहज है।
