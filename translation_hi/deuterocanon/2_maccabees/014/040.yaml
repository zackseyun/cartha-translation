  text: क्योंकि उसने सोचा कि उसे पकड़कर वह इन लोगों पर विपत्ति ला देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξεν
  choice: उसने सोचा
  rationale: यह क्रिया प्रसंग में कर्ता के विचार या निष्कर्ष को व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: συλλαβών
  choice: पकड़कर
  rationale: सहभागी रूप किसी व्यक्ति को बंदी बनाने के लिए पकड़ने का अर्थ देता है; ‘पकड़कर’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ἐκεῖνον
  choice: उसे
  rationale: यह पहले उल्लिखित विशिष्ट व्यक्ति की ओर संकेत करता है; हिन्दी में संदर्भ स्पष्ट होने पर सर्वनाम अधिक स्वाभाविक है।
- source_word: τούτοις
  choice: इन लोगों पर
  rationale: सम्प्रदान कारक उस समूह को विपत्ति से प्रभावित होने वाले लोगों के रूप में दर्शाता है; ‘इन लोगों’ लिंग की अनावश्यक सीमा लगाए बिना संकेतवाचक बल रखता है।
- source_word: ἐνεργάσασθαι
  choice: ला देगा
  rationale: मध्यवाच्य अनन्त रूप यहाँ किसी परिणाम को घटित करने या उत्पन्न करने का भाव देता है; ‘विपत्ति ला देना’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: συμφοράν
  choice: विपत्ति
  rationale: यह गंभीर अनिष्ट या संकट को दर्शाता है; ‘विपत्ति’ गरिमापूर्ण और सामान्यतः बोधगम्य शब्द है।
