  yaml_path: translation/deuterocanon/2_maccabees/014/039.yaml
  text: But Nikanor[a], wanting to make plain the hostility he had toward the Jews, sent more than five hundred soldiers to arrest him.
translation:
  language: hi
  text: परन्तु निकानोर यहूदियों के प्रति अपनी शत्रुता स्पष्ट करना चाहता था, इसलिए उसने उसे पकड़ने के लिए पाँच सौ से अधिक सैनिक भेजे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλόμενος
  choice: चाहता था
  rationale: यह कृदन्त निकानोर की इच्छा अथवा उद्देश्य व्यक्त करता है; ‘चाहता था’ सहज आधुनिक हिन्दी में उसके प्रयोजन को बिना अधिक बल दिए व्यक्त करता है।
- source_word: πρόδηλον ποιῆσαι
  choice: स्पष्ट करना
  rationale: यह पद किसी बात को प्रत्यक्ष या साफ़ जाहिर करने का अर्थ देता है; ‘स्पष्ट करना’ ποιῆσαι की कारणवाचक शक्ति भी बनाए रखता है।
- source_word: δυσμένειαν
  choice: शत्रुता
  rationale: यह शब्द विरोधपूर्ण मनोभाव या वैर को सूचित करता है; राजनीतिक और सैनिक प्रसंग में ‘शत्रुता’ स्वाभाविक तथा पर्याप्त रूप से प्रबल है।
- source_word: ἀπέστειλεν
  choice: भेजे
  rationale: कथा में किसी उद्देश्य से लोगों को रवाना करने के सामान्य अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: στρατιώτας
  choice: सैनिक
  rationale: यह बहुवचन में अलग-अलग सैन्यकर्मियों को सूचित करता है; ‘सैनिक’ इसका सीधा हिन्दी समतुल्य है।
- source_word: ὑπὲρ τοὺς πεντακοσίους
  choice: पाँच सौ से अधिक
  rationale: संख्या के साथ ὑπέρ यहाँ उस संख्या से अधिक होने का बोध कराता है; हिन्दी में यह स्पष्ट और स्वाभाविक रूप है।
- source_word: συλλαβεῖν
  choice: पकड़ने
  rationale: सैनिकों को किसी व्यक्ति को अधिकार में लेने के लिए भेजे जाने के इस प्रसंग में ‘पकड़ने’ हिरासत में लेने और बलपूर्वक काबू करने—दोनों संभावित रंगों को सहज रूप से समेटता है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह सर्वनाम पूर्वप्रसंग में उल्लिखित राजिस की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। यूनानी वाक्य की उद्देश्य-संरचना को स्वाभाविक हिन्दी क्रम में रखा गया है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि ‘पाँच सौ से अधिक’ ὑπὲρ τοὺς πεντακοσίους का स्पष्ट प्रत्यक्ष अनुवाद है; अंग्रेज़ी परामर्श पाठ में दिए गए [a] का मुख्य पाठ में वैध संबद्ध बिंदु नहीं बनता और उसकी टिप्पणी भी उसी संख्या-वाक्यांश की व्याख्या करती है।
