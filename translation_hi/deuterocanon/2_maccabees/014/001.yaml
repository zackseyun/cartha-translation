lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: परन्तु तीन वर्ष बीतने के बाद
  rationale: μετά के साथ कर्मकारक बीते हुए समय के बाद का संकेत देता है; δέ को प्रसंग के हल्के संक्रमण के रूप में ‘परन्तु’ से व्यक्त किया गया है।
- source_word: προσέπεσεν τοῖς περὶ τὸν Ἰούδαν
  choice: यहूदा और उसके साथियों तक यह समाचार पहुँचा
  rationale: προσπίπτω का मूल अर्थ ‘पर गिरना’ है, पर यहाँ यह सूचना पहुँचने का मुहावरा है। τοῖς περὶ τὸν Ἰούδαν में यहूदा और उसके आस-पास अथवा साथ रहने वाले लोग सम्मिलित हैं।
- source_word: Δημήτριον τὸν τοῦ Σελεύκου
  choice: सेल्यूकुस का पुत्र देमेत्रियुस
  rationale: निश्चयवाचक पद के साथ सम्बन्धकारक यहाँ पुत्र-संबंध व्यक्त करता है; नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: διὰ τοῦ κατὰ Τρίπολιν λιμένος εἰσπλεύσαντα
  choice: त्रिपोलिस के बन्दरगाह से होकर भीतर आ गया था
  rationale: εἰσπλεύω जहाज़ से भीतर आने को सूचित करता है और διά के साथ सम्बन्धकारक बन्दरगाह से होकर प्रवेश का भाव रखता है। साथ आए बेड़े के उल्लेख से समुद्री यात्रा स्पष्ट है, इसलिए हिन्दी में अनावश्यक दोहराव से बचा गया है।
- source_word: μετὰ πλήθους ἰσχυροῦ καὶ στόλου
  choice: एक शक्तिशाली सैन्य-दल और एक बेड़े के साथ
  rationale: सैन्य प्रसंग में πλῆθος लोगों के बड़े दल या सैन्य-बल को दर्शाता है; ἰσχυροῦ उसकी सामर्थ्य और στόλος जहाज़ों के बेड़े को व्यक्त करता है।
