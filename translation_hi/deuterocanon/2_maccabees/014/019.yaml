  text: Therefore he sent Posidonius and Theodotus and Mattathias to give and receive pledges[a].
translation:
  language: hi
  text: इसी कारण उसने पोसिदोनियुस, थियोदोतुस और मत्तथियास को प्रतिज्ञाएँ देने और लेने[a] के लिए भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात सद्भावना या समझौते की गारंटी के रूप में एक-दूसरे को दाहिना हाथ देना।
    reason: cultural_note
lexical_decisions:
- source_word: διόπερ
  choice: इसी कारण
  rationale: यह पूर्ववर्ती परिस्थिति से निकले निष्कर्ष या कारण को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔπεμψεν
  choice: उसने ... भेजा
  rationale: πέμπω के साधारण भूतकालिक अर्थ ‘भेजना’ को सीधे और स्पष्ट रूप में व्यक्त करता है।
- source_word: Ποσίδωνιον καὶ Θεόδοτον καὶ Ματταθίαν
  choice: पोसिदोनियुस, थियोदोतुस और मत्तथियास
  rationale: व्यक्तिगत नामों को यूनानी रूपों के आधार पर देवनागरी में लिप्यंतरित किया गया है; हिन्दी सूची-शैली के अनुसार अंतिम नाम से पहले ‘और’ रखा गया है।
- source_word: δοῦναι καὶ λαβεῖν
  choice: देने और लेने
  rationale: दोनों समानांतर क्रियाओं की ठोस अभिव्यक्ति को बनाए रखता है, जबकि प्रसंग में यह पारस्परिक आश्वासन के आदान-प्रदान को सूचित करता है।
- source_word: δεξιάς
  choice: प्रतिज्ञाएँ
  rationale: शाब्दिक अर्थ ‘दाहिने हाथ’ है, पर यह हाथ मिलाकर सद्भावना, निष्ठा या समझौते की गारंटी देने का मुहावरा है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ रखा गया है और सांस्कृतिक चित्र फुटनोट में बताया गया है।
