  source_fidelity: ‘इसी कारण’ διόπερ के निष्कर्षात्मक बल को ठीक व्यक्त करता है। ‘उसने ... को ... के लिए भेजा’ ἔπεμψεν और उद्देश्यसूचक infinitives δοῦναι καὶ λαβεῖν के अनुरूप है। ‘प्रतिज्ञाएँ’ δεξιάς के प्रसंगगत मुहावरेदार अर्थ—पारस्परिक निष्ठा/समझौते का आश्वासन—को सटीक रूप से संप्रेषित करता है।
