  terminology: नामों के देवनागरी लिप्यंतरण सुसंगत हैं। ‘प्रतिज्ञाएँ’ धार्मिक या सम्प्रदायगत अतिरिक्त अर्थ आरोपित नहीं करता। फुटनोट सांस्कृतिक रूपक ‘दाहिना हाथ’ और उसके समझौता/सद्भावना-संबंधी कार्य को पर्याप्त रूप से स्पष्ट करता है।
