lexical_decisions:
- source_word: τῶν ... φασκόντων
  choice: पर जब उन्होंने ... कहा
  rationale: सम्बन्धकारक निरपेक्ष रचना परिस्थिति बताती है। हिंदी में कालसूचक उपवाक्य स्वाभाविक है; δέ को प्रसंगगत विरोध के लिए ‘पर’ से व्यक्त किया गया है।
- source_word: μεθʼ ὅρκων
  choice: शपथ खाकर
  rationale: शाब्दिक अर्थ ‘शपथों के साथ’ है। ‘शपथ खाकर’ आधुनिक हिंदी में स्वाभाविक है और किसी औपचारिक न्यायिक प्रक्रिया का अनावश्यक संकेत नहीं देता।
- source_word: μὴ γινώσκειν
  choice: कि वे नहीं जानते
  rationale: यह infinitive φασκόντων पर निर्भर होकर कथन की विषयवस्तु व्यक्त करता है। हिंदी परोक्ष कथन में ‘कि’ वाला सीमित उपवाक्य स्पष्ट और स्वाभाविक है।
- source_word: ποῦ ποτʼ ἐστίν
  choice: वह कहाँ है
  rationale: ἐστίν वर्तमान काल में है, इसलिए हिंदी में ‘है’ रखकर मूल परोक्ष कथन की कालगत बनावट सुरक्षित की गई है। ποτʼ की अनिश्चित अथवा बलात्मक छाया को अलग शब्द से बढ़ाना आवश्यक नहीं समझा गया।
- source_word: ὁ ζητούμενος
  choice: जिस व्यक्ति की खोज की जा रही है
  rationale: यह substantival present passive participle है, अर्थात ‘जिसकी खोज की जा रही है’। ‘व्यक्ति’ संदर्भ में मानवीय संकेत स्पष्ट करता है, जबकि ‘वांछित व्यक्ति’ आधुनिक कानूनी अर्थ जोड़ सकता था।
