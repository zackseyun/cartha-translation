  text: यहूदा ने हथियारबंद लोगों को तत्पर रखकर सामरिक स्थानों पर तैनात किया, ताकि शत्रुओं की ओर से अचानक कोई कपटपूर्ण कार्रवाई न हो; और उन्होंने उचित पारस्परिक विचार-विमर्श किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने आपस में उचित बातचीत की।” यूनानी वाक्यांश τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν एक उपयुक्त साझा बातचीत या विचार-विमर्श का संकेत देता है।
    reason: lexical_alternative
