  rationale: इस सैन्य संदर्भ में ἐπικαίροις लाभदायक या महत्त्वपूर्ण ठिकानों की ओर संकेत करता है।
- source_word: μή ποτε
  choice: ताकि ... न हो
  rationale: हिन्दी में यह सावधानी के उद्देश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τῶν πολεμίων
  choice: शत्रुओं की ओर से
  rationale: यह आशंकित कार्रवाई के स्रोत को व्यक्त करता है, बिना किसी अतिरिक्त विवरण को जोड़े।
- source_word: ἐφνιδίως
  choice: अचानक
  rationale: यह घटना के अनपेक्षित और आकस्मिक रूप से होने का भाव देता है।
- source_word: κακουργία
  choice: विश्वासघाती कार्रवाई
  rationale: शब्द का व्यापक अर्थ दुष्ट या हानिकारक काम है, पर इस कूटनीतिक-सैन्य प्रसंग में छलपूर्वक की जाने वाली शत्रुतापूर्ण कार्रवाई अभिप्रेत है।
- source_word: τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν
  choice: उन्होंने परिस्थिति के अनुकूल विचार-विमर्श किया
  rationale: यह मुहावरेदार अभिव्यक्ति दोनों पक्षों के बीच उस अवसर के अनुरूप हुई बातचीत या मंत्रणा को दर्शाती है।
