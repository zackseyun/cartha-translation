  yaml_path: translation/deuterocanon/2_maccabees/014/009.yaml
  text: Since you know each of these things[a], O king, take thought for the country and for our nation that is being hard pressed[b], according to the gracious goodwill you have toward all.
translation:
  language: hi
  text: हे राजा, आप इनमें से हर एक बात जानते हैं; इसलिए देश और दबाव में पड़े हमारे लोगों[a] की सुधि लीजिए, उस सहज उदारता[b] के अनुरूप जो आप सबके प्रति रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दबाव में पड़े’ का अनुवाद ‘घिरे हुए’, ‘सताए जा रहे’ या ‘कठिनाइयों से घिरे’ भी हो सकता है। यूनानी कृदंत इन अर्थों की गुंजाइश रखता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सहज उदारता’ के पीछे यूनानी में एक दुर्लभ अभिव्यक्ति है, जो ऐसी कृपालुता बताती है जिसे तत्परता से दिखाया जाता है या जो दूसरों के लिए सहज उपलब्ध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστα ... τούτων
  choice: इनमें से हर एक बात
  rationale: ἕκαστα का वितरणात्मक भाव बनाए रखता है और केवल सामूहिक ‘ये सब बातें’ कहने से अधिक सटीक है।
- source_word: ἐπεγνωκώς
  choice: आप ... जानते हैं
  rationale: पूर्ण कृदंत राजा की पहले से प्राप्त जानकारी को दर्शाता है; कारणसूचक संबंध को ‘इसलिए’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: προσνοήθητι
  choice: सुधि लीजिए
  rationale: यह आज्ञार्थक क्रिया केवल विचार करने की नहीं, बल्कि ध्यान और हितकारी चिंता करने की विनती करती है।
- source_word: χώρας
  choice: देश
  rationale: राजनीतिक निवेदन के प्रसंग में χώρα संबंधित भूभाग या देश को सूचित करता है।
- source_word: τοῦ περιισταμένου γένους ἡμῶν
  choice: संकटों से घिरे हमारे लोग
  rationale: γένος को आधुनिक हिन्दी में स्वाभाविक रूप से ‘हमारे लोग’ कहा गया है; वर्तमान कृदंत के घिरे, सताए या दबाव में होने के भाव को ‘संकटों से घिरे’ व्यक्त करता है।
- source_word: εὐαπάντητον φιλανθρωπίαν
  choice: सहज उदारता
  rationale: दुर्लभ विशेषण εὐαπάντητον ऐसी कृपालुता का संकेत देता है जो तत्परता से दिखाई जाती या आसानी से उपलब्ध होती है; संक्षिप्त हिन्दी में ‘सहज उदारता’ इस संयुक्त भाव को व्यक्त करती है।
- source_word: πρὸς ἅπαντας
  choice: सबके प्रति
  rationale: πρός यहाँ राजा के व्यापक अनुकूल भाव की दिशा बताता है।
