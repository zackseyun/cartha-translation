  yaml_path: translation/deuterocanon/2_maccabees/014/037.yaml
  text: A certain Razis[a], one of the elders from Jerusalem, was reported to Nicanor—a man devoted to his city and very highly regarded[b], and because of his goodwill called the father of the Jews.
translation:
  language: hi
  text: यरूशलेम के बुज़ुर्गों में से रज़ीस नाम के एक व्यक्ति के बारे में निकानोर को सूचना दी गई[a]। वह अपने नगर के प्रति समर्पित[b] और बहुत प्रतिष्ठित था, और अपनी सद्भावना के कारण “यहूदियों का पिता” कहलाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “निकानोर को उसके विरुद्ध शिकायत की गई” भी हो सकता है। यहाँ प्रयुक्त यूनानी क्रिया शत्रुतापूर्ण परिस्थिति में किसी के विरुद्ध सूचना देने का अर्थ भी रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “अपने नगर से प्रेम करनेवाला” है; अर्थात अपने लोगों और नागरिक समुदाय के कल्याण के प्रति समर्पित व्यक्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαζεὶς
  choice: रज़ीस
  rationale: व्यक्तिनाम का अनुवाद न करके यूनानी रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: πρεσβυτέρων
  choice: बुज़ुर्ग अगुओं
  rationale: यह पद केवल अधिक आयु के पुरुषों की नहीं, बल्कि समुदाय में मान्य वरिष्ठ नेतृत्व की ओर संकेत करता है; संयुक्त पदबंध दोनों भावों को स्पष्ट रखता है।
- source_word: ἐμηνύθη
  choice: सूचना दी गई
  rationale: निष्क्रिय क्रिया का मूल भाव निकानोर तक रज़ीस के विषय में सूचना पहुँचाया जाना है। प्रतिकूल संदर्भ में ‘शिकायत की गई’ या ‘मुखबिरी की गई’ भी संभव है, इसलिए अधिक आरोपित अर्थ को पादटिप्पणी में रखा गया है।
- source_word: φιλοπολίτης
  choice: अपने नगर के हित के प्रति समर्पित
  rationale: यह यौगिक शब्द अपने नगर या नागरिक समुदाय से प्रेम और उसके कल्याण के प्रति निष्ठा व्यक्त करता है; यह अनुवाद आधुनिक राजनीतिक अर्थ वाले ‘देशभक्त’ से बचता है।
- source_word: σφόδρα καλῶς ἀκούων
  choice: अत्यंत प्रतिष्ठित
  rationale: यूनानी मुहावरा उत्तम सार्वजनिक प्रतिष्ठा और लोगों की ऊँची राय को व्यक्त करता है।
- source_word: εὔνοιαν
  choice: सद्भावना
  rationale: यह शब्द दूसरों के प्रति अनुकूल, हितकारी मनोभाव को दर्शाता है और सम्मानसूचक उपाधि का कारण बताता है।
- source_word: πατὴρ τῶν Ἰουδαίων
  choice: यहूदियों का पिता
  rationale: इसे जैविक संबंध नहीं, बल्कि समुदाय द्वारा दी गई सम्मानसूचक उपाधि के रूप में सीधा रखा गया है।
- source_word: προσαγορευόμενος
  choice: कहा जाता था
  rationale: कृदंत से प्रचलित या नियमित संबोधन का भाव निकलता है, जिसे यह स्वाभाविक हिन्दी रूप सुरक्षित रखता है।
theological_decisions:
- issue: रज़ीस का सम्मानपूर्ण नागरिक और सामुदायिक चित्रण
  choice: नगर के हित के प्रति उसकी निष्ठा, प्रतिष्ठा और ‘यहूदियों का पिता’ उपाधि को सीधे और सकारात्मक रूप में प्रस्तुत किया गया है।
  alternative: ‘देशभक्त’ या ‘राष्ट्र का उपकारी’ जैसे अधिक व्याख्यात्मक और वैचारिक पदों का प्रयोग करना।
  rationale: यूनानी पाठ रज़ीस का स्पष्टतः प्रशंसात्मक वर्णन करता है, पर आधुनिक राष्ट्रवादी या सांप्रदायिक अर्थ उसमें जोड़ना उचित नहीं होगा।
- issue: रज़ीस के बारे में निकानोर को सूचना देने का स्वर
  choice: मुख्य पाठ में तटस्थ ‘सूचना दी गई’ रखा गया है और प्रतिकूल अर्थ की संभावना पादटिप्पणी में बताई गई है।
  alternative: मुख्य पाठ में ‘उसकी शिकायत की गई’ या ‘उसके विरुद्ध मुखबिरी की गई’ लिखना।
  rationale: आगे का संदर्भ शत्रुतापूर्ण सूचना का संकेत देता है, किंतु क्रिया स्वयं अपेक्षाकृत व्यापक है; अतः वास्तविक भाषिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे यूनानी वाक्य को हिन्दी में स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। ‘बुज़ुर्ग अगुओं’ से πρεσβυτέρων का आयु और मान्य सामुदायिक नेतृत्व—दोनों का भाव व्यक्त होता है; ‘देशभक्त’ जैसे संभावित काल-विपर्ययी शब्द से बचा गया है।
