base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/031.yaml
  text: But when the other man realized that he had been outmaneuvered by the man’s boldness[a], he came to the greatest and holy temple, while the priests were offering the customary sacrifices, and ordered them to hand over the man.
translation:
  language: hi
  text: पर जब उस दूसरे व्यक्ति को पता चला कि उस पुरुष ने साहसपूर्वक उसे रणनीतिक मात दे दी थी, तो वह सबसे महान और पवित्र मंदिर[a] में आया। उस समय याजक निर्धारित बलियाँ चढ़ा रहे थे। उसने उन्हें उस पुरुष को अपने हवाले कर देने का आदेश दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘महान और पवित्र मंदिर।’ यूनानी में ‘महान’ का अतिशयोक्तिपरक रूप है, जो यहाँ मंदिर की महिमा बताने वाला वर्णन भी हो सकता है।
    reason: μέγιστον के शाब्दिक अतिशयोक्तिपरक अर्थ और सम्भव मुहावरेदार अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: Συγνοὺς
  choice: जब ... को पता चला
  rationale: अओरिस्ट कृदन्त को कथा के स्वाभाविक क्रम में कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: ὁ ἕτερος
  choice: उस दूसरे व्यक्ति
  rationale: यह प्रसंग में पहले उल्लिखित विरोधी व्यक्ति की ओर संकेत करता है; ‘व्यक्ति’ जोड़ने से हिन्दी में संदर्भ स्पष्ट रहता है।
- source_word: γενναίως
  choice: साहसपूर्वक
  rationale: क्रियाविशेषण का मूल भाव वीरता या साहस से कार्य करना है; इसे केवल रणनीतिक कौशल के अर्थ में सीमित नहीं किया गया।
- source_word: ἐστρατήγηται
  choice: रणनीतिक मात दे दी थी
  rationale: पूर्णकालिक कर्मवाच्य रूप रणनीति द्वारा परास्त या चकमा दिए जाने का भाव रखता है। हिन्दी में वाच्य बदलकर स्वाभाविक अभिव्यक्ति की गई, पर रणनीतिक अर्थ सुरक्षित रखा गया।
- source_word: παραγενόμενος
  choice: वह ... में आया
  rationale: यह मन्दिर पहुँचने को बताने वाला कथात्मक कृदन्त है।
- source_word: ἐπὶ τὸ μέγιστον καὶ ἅγιον ἱερόν
  choice: सबसे महान और पवित्र मन्दिर
  rationale: μέγιστον के अतिशयोक्तिपरक रूप को मुख्य पाठ में बनाए रखा गया है और ἱερόν को प्रसंगानुसार ‘मन्दिर’ कहा गया है।
- source_word: τῶν ἱερέων ... προσαγόντων
  choice: उस समय याजक ... चढ़ा रहे थे
  rationale: सम्बन्धकारक निरपेक्ष रचना को समकालिक क्रिया बताने वाले स्वतंत्र हिन्दी वाक्य में बदला गया है।
- source_word: τὰς καθηκούσας θυσίας
  choice: निर्धारित बलियाँ
  rationale: καθηκούσας यहाँ उचित, नियत या विधिपूर्वक अपेक्षित बलियों को सूचित करता है; ‘निर्धारित’ इस भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐκέλευσεν παραδοῦναι
  choice: उसके हवाले कर देने का आदेश दिया
  rationale: यह अधिकारपूर्वक किसी व्यक्ति को सौंप देने की माँग है; ‘हवाले कर देना’ आधुनिक हिन्दी में स्वाभाविक और बलयुक्त है।
- source_word: τὸν ἄνδρα
  choice: उस पुरुष
  rationale: यूनानी पाठ की संज्ञात्मक पुनरावृत्ति को बनाए रखते हुए विशिष्ट व्यक्ति पर ध्यान रखा गया है।
theological_decisions:
- issue: यरूशलेम के पवित्र परिसर के लिए ἱερόν का अनुवाद
  choice: मन्दिर
  alternative: पवित्रस्थान; मन्दिर-परिसर
  rationale: ἱερόν पूरे मन्दिर-परिसर को भी सूचित कर सकता है, पर इस कथात्मक प्रसंग में ‘मन्दिर’ सबसे सहज और पर्याप्त रूप से व्यापक हिन्दी पद है।
- issue: μέγιστον के अतिशयोक्तिपरक बल का निर्वाह
  choice: सबसे महान
  alternative: महान
  rationale: यूनानी में वास्तविक अतिशयोक्ति रूप है। मुख्य पाठ में उसे बनाए रखा गया है, जबकि पादटिप्पणी यह स्वीकार करती है कि यह मन्दिर की महिमा बताने वाला मुहावरेदार वर्णन भी हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘रणनीतिक मात’ मूल क्रिया के सैन्य-रणनीतिक रंग को बचाती है, जबकि ‘साहसपूर्वक’ γενναίως को अलग क्रियाविशेषण के रूप में व्यक्त करता है। लम्बे यूनानी वाक्य को पठनीय हिन्दी के लिए तीन वाक्यों में बाँटा गया है।
