translation:
  language: hi
  text: यहूदिया को पत्र भेजे, जिनमें यह आदेश था कि वह स्वयं यहूदा को पकड़ ले, उसके साथियों को तितर-बितर कर दे और अलकिमुस को सबसे महान मंदिर का महायाजक नियुक्त करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰούδᾳ
  choice: यहूदिया के लिए
  rationale: यहाँ प्रसंग गंतव्य-प्रदेश का है; दत्तिव रूप को पत्रों के साथ स्वाभाविक हिन्दी में ‘यहूदिया के लिए’ कहा गया है।
- source_word: ἐπιστολάς
  choice: पत्र देकर यह आदेश दिया
  rationale: बहुवचन ‘पत्र’ को बनाए रखते हुए आगे के infinitive आदेशों से उसका संबंध स्पष्ट किया गया है।
- source_word: ἐπανελέσθαι
  choice: पकड़ ले
  rationale: क्रिया के ‘अपने अधिकार में लेने/पकड़ने’ के अर्थ को चुना गया है; यहाँ अनावश्यक रूप से ‘मार डाले’ जैसा अधिक निश्चित अर्थ नहीं थोपा गया।
- source_word: τοὺς δὲ σὺν αὐτῷ
  choice: उसके साथियों को
  rationale: शाब्दिक ‘जो उसके साथ थे’ का स्वाभाविक और संक्षिप्त हिन्दी रूप।
- source_word: σκορπίσαι
  choice: तितर-बितर कर दे
  rationale: समूह को बिखेर देने का मूल अर्थ सुरक्षित है।
- source_word: καταστῆσαι
  choice: नियुक्त करे
  rationale: किसी को पद पर स्थापित करने के प्रशासनिक अर्थ के अनुरूप।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: यहूदी मंदिर-व्यवस्था के प्रधान याजकीय पद का प्रचलित हिन्दी रूप।
- source_word: τοῦ μεγίστου ἱεροῦ
  choice: सबसे महान मंदिर का
  rationale: मूल के superlative ‘μεγίστου’ को घटाए बिना ‘ἱεροῦ’ का मंदिर के रूप में अनुवाद किया गया है।
theological_decisions:
- issue: ἐπανελέσθαι का आशय
  choice: पकड़ ले
  alternative: मार डाले / नष्ट कर दे
  rationale: इस क्रिया में प्रसंगानुसार कठोर या प्राणघातक आशय संभव हो सकता है, पर दिए गए रूप से उसे अनिवार्य मानना उचित नहीं; इसलिए अपेक्षाकृत खुला ‘पकड़ ले’ रखा गया है।
- issue: मंदिर के लिए μεγίστου विशेषण
  choice: सबसे महान मंदिर
  alternative: महान मंदिर / परम पवित्र मंदिर
  rationale: मूल की अतिशयोक्तिपूर्ण उपाधि को सुरक्षित रखा गया है और ‘पवित्र’ जैसा ऐसा धार्मिक विशेषण नहीं जोड़ा गया जो इस पद में उपस्थित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। वाक्य स्रोत-पाठ के खंडात्मक आरंभ को हिन्दी में समझने योग्य बनाने के लिए ‘यह आदेश दिया’ जोड़कर infinitive श्रेणी का संबंध पत्रों से स्पष्ट करता है।
