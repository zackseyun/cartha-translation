- source_word: διὰ παντός
  choice: सदा
  rationale: यह निरंतरता का स्वाभाविक और गरिमापूर्ण हिन्दी बोध देता है।
- source_word: ψυχικῶς
  choice: मन से
  rationale: यह असामान्य क्रियाविशेषण की आंतरिक, आत्मगत दिशा को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल तीव्रता-सूचक शब्द में बदलने के।
- source_word: προσεκέκλιτο
  choice: की ओर झुका हुआ था
  rationale: पूर्णकालिक रूप से सूचित स्थिर अनुकूल रुझान को व्यक्त करता है, पर औपचारिक निष्ठा या अत्यधिक स्नेह को अनिवार्य नहीं बनाता।
- source_word: τῷ ἀνδρί
  choice: उस व्यक्ति की
  rationale: यूनानी में यहूदा के लिए प्रयुक्त स्पष्ट व्यक्तिगत उल्लेख को बनाए रखता है; ‘व्यक्ति’ आधुनिक हिन्दी में ‘मनुष्य’ की अपेक्षा अधिक स्वाभाविक है।
