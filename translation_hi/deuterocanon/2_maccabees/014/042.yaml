    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενῶς
  choice: गरिमापूर्वक
  rationale: यह शब्द सम्मान और कुलीन आचरण के अनुरूप मरने का भाव व्यक्त करता है। ‘गरिमापूर्वक’ आधुनिक हिन्दी में स्वाभाविक है और बाद के εὐγενείας के साथ वैचारिक संबंध बनाए रखता है।
- source_word: θέλων ἀποθανεῖν
  choice: मरना चाहता था
  rationale: कृदंत θέλων यहाँ इच्छा अथवा दृढ़ अभिप्राय बताता है; हिन्दी में सन्दर्भानुकूल पूर्ण वाक्य के लिए इसे ‘चाहता था’ से व्यक्त किया गया है।
- source_word: ἤπερ
  choice: के बजाय
  rationale: यह पसंद किए गए सम्मानजनक मरण और अस्वीकार की गई गिरफ्तारी तथा दुर्व्यवहार के बीच स्पष्ट तुलना दर्शाता है।
- source_word: ἀλιτηρίοις
  choice: उन अपराधियों
  rationale: यह दुष्ट व्यक्तियों के लिए प्रयुक्त प्रबल निंदात्मक शब्द है। ‘अपराधियों’ में नैतिक और कानूनी दोनों प्रकार की निंदा व्यक्त होती है।
- source_word: ὑποχείριος γενέσθαι
  choice: के हाथ पड़ने
  rationale: यूनानी पद का अर्थ किसी के अधिकार या वश में आ जाना है। ‘हाथ पड़ना’ शत्रुतापूर्ण पकड़ और अधीनता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς ἰδίας εὐγενείας ἀναξίως
  choice: अपनी कुलीनता के अयोग्य ढंग से
  rationale: ‘कुलीनता’ सामाजिक प्रतिष्ठा और श्रेष्ठ चरित्र—दोनों संभावित अर्थों को खुला रखती है; ‘अयोग्य ढंग से’ ἀναξίως का मूल्यांकनात्मक बल बनाए रखता है।
- source_word: ὑβρισθῆναι
  choice: घोर दुर्व्यवहार सहने
  rationale: क्रिया में उद्दंड अपमान, नीचा दिखाना और हिंसक दुर्व्यवहार तक का व्यापक भाव हो सकता है। ‘घोर दुर्व्यवहार’ इसकी तीव्रता को बनाए रखते हुए इसे केवल मौखिक अपमान तक सीमित नहीं करता।
