translation:
  language: hi
  text: वह उन अपराधियों के हाथ पड़ने और अपनी ही गरिमा के विरुद्ध होने वाला घोर दुर्व्यवहार[a] सहने के बजाय गरिमापूर्वक मरना चाहता था।
  philosophy: optimal-equivalence
