base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/003.yaml
  text: But a certain Alcimus[a], who had formerly become high priest and had willingly defiled himself in the times of separation, realized that in no way was there safety for him, nor any longer access to the holy altar,
translation:
  language: hi
  text: परन्तु अलकिमुस नाम का एक व्यक्ति, जो पहले महायाजक बन चुका था और अलगाव के समय[a] जान-बूझकर अपने को अशुद्ध कर चुका था, यह समझ गया कि उसके बचाव का किसी भी प्रकार कोई उपाय नहीं था और अब पवित्र वेदी तक उसकी पहुँच भी नहीं रही,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मत्याग के समय।” यूनानी में शाब्दिक भाव “मेल-जोल न रखने अथवा अलगाव के समयों” का है; यह धार्मिक अशुद्धि और समुदाय से दूर हो जाने के काल की ओर संकेत कर सकता है।
    reason: ἀμιξία के शाब्दिक और प्रसंगगत अर्थों के बीच वास्तविक अस्पष्टता को बनाए रखने के लिए।
lexical_decisions:
- source_word: Ἄλκιμος
  choice: अलकिमुस
  rationale: व्यक्तिनाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: προγεγονὼς ἀρχιερεύς
  choice: पहले महायाजक बन चुका था
  rationale: पूर्वकालिक कृदंत में पहले उस पद को प्राप्त करने की क्रियात्मक छाया है; इसलिए केवल ‘पूर्व महायाजक’ कहने के बजाय उसे बनाए रखा गया है।
- source_word: ἑκουσίως
  choice: जान-बूझकर
  rationale: यह उसके कार्य की स्वेच्छा और सचेत इरादे को स्पष्ट रूप से व्यक्त करता है।
- source_word: μεμολυσμένος
  choice: अपने को अशुद्ध कर चुका था
  rationale: पूर्ण कृदंत अतीत में किए गए कार्य और उससे बनी हुई अवस्था दोनों को दर्शाता है; ‘अशुद्ध’ में धार्मिक और नैतिक, दोनों अर्थ संभव रहते हैं।
- source_word: ἐν τοῖς τῆς ἀμιξίας χρόνοις
  choice: अलगाव के समय
  rationale: ἀμιξία का मूल भाव मेल-जोल या मिश्रण का न होना है। ‘अलगाव’ निकट अर्थ देता है और प्रसंग को सीधे ‘धर्मत्याग’ ठहराए बिना उसकी अस्पष्टता बनाए रखता है।
- source_word: συννοήσας
  choice: यह समझ गया
  rationale: यह अलकिमुस द्वारा अपनी परिस्थिति को पहचान लेने का स्वाभाविक हिन्दी रूप है।
- source_word: καθʼ ὁντιναοῦν τρόπον οὐκ ἔστιν αὐτῷ σωτηρία
  choice: किसी भी उपाय से उसका बचाव नहीं हो सकता
  rationale: निषेध के साथ यह वाक्यांश हर संभव उपाय से बच निकलने की असंभवता बताता है; यहाँ σωτηρία का तात्कालिक अर्थ सुरक्षा या बचाव है।
- source_word: πρὸς τὸ ἅγιον θυσιαστήριον ἔτι πρόσοδος
  choice: अब उसे पवित्र वेदी के पास जाने का अधिकार भी नहीं मिल सकता
  rationale: πρόσοδος का अर्थ पहुँच या निकट जाने की अनुमति हो सकता है। प्रसंग में केवल भौतिक निकटता नहीं, वेदी तक मान्य धार्मिक पहुँच का भाव है।
theological_decisions:
- issue: ऐतिहासिक-धार्मिक प्रसंग में ἀμιξία का अर्थ
  choice: अलगाव के समय
  alternative: धर्मत्याग के समय
  rationale: यूनानी शब्द शाब्दिक रूप से अलग रहने या मेल न रखने को सूचित करता है। प्रसंग धार्मिक विच्छेद और अशुद्धि से जुड़ा हो सकता है, पर मुख्य पाठ में ‘धर्मत्याग’ रखने से अर्थ आवश्यकता से अधिक निश्चित हो जाता; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: σωτηρία का प्रसंगगत आशय
  choice: बचाव
  alternative: उद्धार
  rationale: यहाँ अलकिमुस अपनी तत्काल राजनीतिक और व्यक्तिगत परिस्थिति से सुरक्षित निकलने की संभावना पर विचार कर रहा है; अतः ‘बचाव’ धार्मिक उद्धार का अर्थ अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। पद मूल वाक्य की अगली कड़ी है, इसलिए अंत में अल्पविराम रखा गया है। ‘महायाजक’, ‘अशुद्ध’, ‘पवित्र वेदी’ जैसे स्थापित धार्मिक शब्द सामान्य पाठक के लिए स्पष्ट हैं।
