  text: फिर भी वह अभी साँस ले रहा था और क्रोध से धधक रहा था। वह उठ खड़ा हुआ; यद्यपि उसका रक्त धाराओं में बह रहा था[a] और उसके घाव गंभीर थे। वह दौड़कर भीड़ों के बीच से निकलते हुए एक खड़ी चट्टान[b] पर जा खड़ा हुआ,
