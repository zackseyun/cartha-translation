base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/030.yaml
  text: But Maccabaeus[a], perceiving from Nicanor’s actions toward him that he had assumed a harsher than usual manner, and understanding that this severity did not come from the better course, gathered not a few of his men and kept himself hidden from Nicanor.
translation:
  language: hi
  text: परन्तु मकाबी ने निकानोर के अपने प्रति व्यवहार से भाँप लिया कि उसका मिलने-जुलने का सामान्य ढंग अधिक कठोर हो गया था। यह समझकर कि यह कठोरता किसी भले उद्देश्य से नहीं थी,[a] उसने अपने बहुत-से लोगों को इकट्ठा किया और निकानोर से छिपा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह कठोरता किसी अच्छी नीति या उचित मार्ग से नहीं उपजी थी”; अथवा अधिक भावानुवाद में, “यह कठोरता भलाई के लिए नहीं थी।” यूनानी पदबंध मंशा, नीति, या परिणाम की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσθητήριον διεξαγαγόντος ... τὰ πρὸς αὐτόν
  choice: निकानोर के अपने प्रति व्यवहार से
  rationale: यह कठिन यूनानी संयोजन निकानोर द्वारा मकाबी के प्रति प्रकट किए गए और देखे जा सकने वाले व्यवहार की ओर संकेत करता है; सहज हिन्दी में इसे एक संयुक्त पदबंध के रूप में रखा गया है।
- source_word: συνιδὼν
  choice: भाँप लिया
  rationale: यह केवल देखने नहीं, बल्कि व्यवहार देखकर स्थिति पहचान लेने का बोध देता है।
- source_word: τὴν ἠθισμένην ἀπάντησιν ἀγριωτέρως ἐσχηκότα
  choice: उसका मिलने का ढंग पहले से अधिक कठोर हो गया है
  rationale: ἠθισμένην सामान्य या अभ्यस्त व्यवहार और ἀγριωτέρως तुलनात्मक कठोरता व्यक्त करते हैं; हिन्दी वाक्य पहले के परिचित ढंग से आए परिवर्तन को स्पष्ट रखता है।
- source_word: νοήσας
  choice: यह समझकर
  rationale: यह निकानोर के बदले व्यवहार से मकाबी द्वारा निकाले गए विचारपूर्ण निष्कर्ष को व्यक्त करता है।
- source_word: οὐκ ἀπὸ τοῦ βελτίστου τὴν αὐστηρίαν εἶναι
  choice: इस कठोरता के पीछे कोई भली मंशा नहीं थी
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी के लिए इसे मंशा के अर्थ में लिया गया है, जबकि यूनानी मुहावरे में नीति अथवा परिणाम का अर्थ भी संभव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: συστρέψας οὐκ ὀλίγους τῶν περὶ αὐτὸν
  choice: अपने बहुत-से लोगों को इकट्ठा किया
  rationale: οὐκ ὀλίγους शाब्दिक रूप से ‘थोड़े नहीं’ है, जिसका स्वाभाविक आशय ‘बहुत-से’ है; सैन्य प्रसंग में ‘अपने लोगों’ उपयुक्त है।
- source_word: συνεκρύπτετο τὸν Νικάνορα
  choice: निकानोर से छिपा रहा
  rationale: अपूर्ण भूतकाल निरंतर स्थिति को सूचित करता है, जिसे ‘छिपा रहा’ सुरक्षित रखता है।
theological_decisions:
- issue: οὐκ ἀπὸ τοῦ βελτίστου में मंशा और नीति/परिणाम के बीच अस्पष्टता
  choice: मुख्य पाठ में ‘कोई भली मंशा नहीं थी’
  alternative: ‘यह कठोरता किसी अच्छे उद्देश्य या उचित नीति से नहीं उपजी थी’ अथवा ‘यह कठोरता भलाई के लिए नहीं थी’
  rationale: संदर्भ में मकाबी निकानोर के बदले व्यवहार से उसके प्रतिकूल इरादे को पहचानता है, पर यूनानी पदबंध इतना व्यापक है कि नीति या परिणाम का संकेत भी दे सकता है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘मकाबी’ नाम-रूप हिन्दी बाइबलीय प्रयोग के अनुकूल है। ‘भाँप लिया’ साधारण पाठक के लिए स्वाभाविक है और यूनानी συνιδών के अनुमानात्मक बोध को व्यक्त करता है।
