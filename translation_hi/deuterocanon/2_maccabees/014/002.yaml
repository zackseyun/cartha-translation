lexical_decisions:
- source_word: κεκρατηκέναι
  choice: अधिकार कर लेने
  rationale: κρατέω का पूर्ण infinitive देश पर प्राप्त हो चुके नियंत्रण या प्रभुत्व को व्यक्त करता है; यह पदबंध राजनीतिक-सैनिक सफलता को स्वाभाविक हिन्दी में बताता है।
- source_word: τῆς χώρας
  choice: देश पर
  rationale: χώρα यहाँ विवादित राज्य-क्षेत्र के राजनीतिक अर्थ में है; इसलिए ‘देश’ उपयुक्त है।
- source_word: ἐπανελόμενον
  choice: हटा देने के बाद
  rationale: ἐπαναιρέω का यह participle राजनीतिक प्रतिद्वंद्वियों को मार्ग से हटाने या समाप्त करने का भाव रखता है, पर हटाने की ठीक विधि स्पष्ट नहीं करता; ‘हटा देने’ से वह अस्पष्टता बनी रहती है।
- source_word: Ἀντίοχον
  choice: अन्तियोकुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: ἐπίτροπον
  choice: संरक्षक
  rationale: ἐπίτροπος का मूल अर्थ देखरेख करने वाला या संरक्षक हो सकता है; इस ऐतिहासिक प्रसंग में ‘राजप्रतिनिधि’ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: Λυσίαν
  choice: लूसियास
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
