  text: But Simon[a], the brother of Judas, had come to terms with Nicanor[c][b], though reluctantly, having stumbled because of the sudden speechlessness of his opponents.
translation:
  language: hi
  text: और यहूदा का भाई शमौन निकानोर से युद्ध में भिड़ा था[a]; किन्तु अपने विरोधियों के अचानक अवाक् हो जाने[c] के कारण वह कुछ हद तक लड़खड़ा गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “निकानोर से भिड़ा हुआ था।” सक्रिय यूनानी क्रिया और इस सैन्य संदर्भ में इसका अर्थ निकानोर के साथ मुठभेड़ या युद्ध में उलझना अधिक संभाव्य है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रियाविशेषण का मूल अर्थ “धीरे” या “देर से” है, पर यहाँ उसका संबंध और सटीक बल स्पष्ट नहीं है। इसे “कुछ हद तक” या “कुछ कठिनाई से” ठोकर खाने के भाव में समझा गया है; यह अनुवाद इस कठिनाई को पूरी तरह हल करने का दावा नहीं करता।
    reason: lexical_alternative
  - marker: c
    text: “विरोधियों के अचानक अवाक् हो जाने के कारण” वाला यूनानी वाक्यांश कठिन और संदर्भ में असामान्य है। ἀφασία का अर्थ बोल न पाना, वाणी रुक जाना, अथवा मौन हो जाना हो सकता है; इसलिए मुख्य पाठ में इसकी असामान्यता को बनाए रखा गया है।
    reason: textual_or_syntactic_difficulty
