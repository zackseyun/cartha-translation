  text: 'I have now come a second time concerning the high priesthood: first[a], because I sincerely have in mind the interests of the king, and second, because I am also considering those of my own fellow citizens; for by the folly of the men mentioned before'
translation:
  language: hi
  text: '“मैं अब महायाजक-पद के विषय में दूसरी बार आया हूँ: पहली बात, मैं सच्चे मन से राजा के हितों का विचार करता हूँ; और दूसरी बात, मैं अपने ही साथी नागरिकों के हित का भी विचार करता हूँ; क्योंकि पहले बताए गए लोगों की मूर्खता से[a]…”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्य अगले पद में जारी रहता है। यहाँ दिया गया स्रोत-अंश अंतिम कारणात्मक उपवाक्य के बीच में समाप्त होता है; इसलिए अनुवाद में भी उसे अधूरा रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: τὴν ἀρχιερωσύνην
  choice: महायाजक-पद के विषय में
  rationale: ἀρχιερωσύνη महायाजक के पद अथवा महायाजकत्व को सूचित करता है। ‘महायाजक-पद’ आधुनिक हिन्दी में स्पष्ट है और प्रसंग में पदाधिकारी की भूमिका को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: δεύτερον νῦν ἐλήλυθα
  choice: मैं अब … दूसरी बार आया हूँ
  rationale: νῦν का अर्थ ‘अब’ और δεύτερον का कालक्रमिक अर्थ ‘दूसरी बार’ रखा गया है; इससे यूनानी वाक्य की स्वाभाविक समझ और दिए गए प्रसंग दोनों सुरक्षित रहते हैं।
- source_word: ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ
  choice: राजा के हितों की
  rationale: τὰ ἀνήκοντα यहाँ राजा से संबंधित मामलों या हितों को दर्शाता है। राजनीतिक निष्ठा के प्रसंग में ‘राजा के हितों’ स्वाभाविक और अर्थ-सटीक है।
- source_word: γνησίως φρονῶν
  choice: सच्चे मन से … चिंता करता हूँ
  rationale: γνησίως की सच्चाई और φρονῶν की मनोवृत्ति/चिंता दोनों को सहज हिन्दी में व्यक्त किया गया है।
- source_word: τῶν ἰδίων πολιτῶν
  choice: अपने ही साथी नागरिकों
  rationale: πολῖται का नागरिक-संबंधी अर्थ ‘साथी नागरिक’ से और ἰδίων का बल ‘अपने ही’ से सुरक्षित रहता है; इसमें अनावश्यक जातीय अर्थ नहीं जोड़ा गया।
- source_word: στοχαζόμενος
  choice: ध्यान रखता हूँ
  rationale: यहाँ क्रिया किसी के हित को लक्ष्य में रखने या उसके लिए विचार करने का भाव देती है। ‘ध्यान रखता हूँ’ राजा के हितों की चिंता के समानांतर स्वाभाविक है।
- source_word: τῇ … τῶν προειρημένων
  choice: पहले बताए गए लोगों की मूर्खता के कारण
  rationale: उपलब्ध यूनानी अंश यहाँ अधूरा है और वाक्य अगले पद में जारी रहता है। यह रूप कारणात्मक संबंध को सावधानी से व्यक्त करता है, पर अनुपलब्ध परिणामी कथन नहीं जोड़ता।
