translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजनीतिक और नागरिक शब्दावली को मूल यूनानी के निकट रखते हुए स्वाभाविक हिन्दी में व्यक्त किया गया है। आरंभ में दिए गए δόξαν, λέγων δὲ τὴν ἀρχιερωσύνην को पूर्व पद से चला आया खंड माना गया है; वर्तमान पद का पाठ ‘महायाजक-पद के विषय में’ से आरंभ किया गया है, जैसा उपलब्ध पद-विभाजन और परामर्श-पाठ संकेत करते हैं।
