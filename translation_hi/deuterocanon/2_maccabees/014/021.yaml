translation:
  language: hi
  text: फिर उन्होंने एक दिन ठहराया, जब वे निजी रूप से एक जगह मिलेंगे। हर एक पक्ष की ओर से एक पालकी आगे लाई गई, और आसन रखे गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτάξαντο
  choice: उन्होंने ... ठहराया
  rationale: मध्यवाच्य क्रिया यहाँ किसी समय को आपसी व्यवस्था से निश्चित करने का भाव देती है; ‘दिन ठहराया’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἡμέραν
  choice: एक दिन
  rationale: मूल में संज्ञा अनिश्चित है और बैठक के लिए किसी खास दिन को निश्चित करने का अर्थ देती है।
- source_word: κατʼ ἰδίαν
  choice: एकांत में
  rationale: वाक्यांश का अर्थ सार्वजनिक रूप से नहीं, अलग या निजी रूप से मिलना है; ‘एकांत में’ सहज हिन्दी में यही भाव रखता है।
- source_word: ἥξουσιν εἰς τὸ αὐτό
  choice: एक जगह मिलेंगे
  rationale: शाब्दिक भाव ‘उसी स्थान पर आएँगे’ है; ‘एक जगह मिलेंगे’ स्थान और परस्पर मिलने, दोनों अर्थों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρʼ ἑκάστου
  choice: दोनों पक्षों की ओर से एक-एक
  rationale: संदर्भ में ἑκάστου बैठक में सम्मिलित प्रत्येक पक्ष को सूचित करता है; ‘दोनों पक्षों’ से कथा-संदर्भ स्पष्ट होता है और ‘एक-एक’ वितरण का भाव सुरक्षित रहता है।
- source_word: δίφραξ
  choice: पालकी
  rationale: यह दुर्लभ शब्द किसी उठाकर ले जाए जाने वाले आसन या पालकी-सदृश सवारी का संकेत दे सकता है। आधुनिक हिन्दी में ‘पालकी’ सबसे सुलभ निकटतम शब्द है, पर अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ἔθεσαν δίφρους
  choice: आसन लगा दिए गए
  rationale: δίφρος कुर्सी, चौकी या आसन हो सकता है। ‘आसन’ वस्तु के सटीक प्रकार को अनावश्यक रूप से निश्चित किए बिना सम्मानजनक बैठने की व्यवस्था बताता है।
