base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/041.yaml
  text: But when the crowds were about to seize the tower[a], and were forcing the courtyard gate, and were ordering that fire be brought and the doors set on fire, he, completely surrounded, put the sword to himself;
translation:
  language: hi
  text: पर जब भीड़ मीनार पर अधिकार करने ही वाली थी, आँगन के फाटक को बलपूर्वक खोलने का प्रयास कर रही थी, और आग लाकर फाटकों को सुलगाने और जला देने का आदेश दे रही थी, तब उसने, चारों ओर से घिर जाने पर, तलवार अपने ऊपर चला दी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी तलवार पर गिर पड़ा” अथवा “तलवार अपने शरीर में भोंक ली।” यूनानी में अधिक शाब्दिक रूप से, “तलवार को अपने ऊपर रखा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... πληθῶν
  choice: भीड़
  rationale: πλῆθος यहाँ बड़ी एकत्रित जन-राशि को दर्शाता है। ‘भीड़’ स्वाभाविक है और ‘उपद्रवी भीड़’ जैसी अतिरिक्त नकारात्मकता नहीं जोड़ता।
- source_word: μελλόντων
  choice: करने ही वाली थी
  rationale: यह आसन्न कार्य को व्यक्त करता है—मीनार अभी अधिकार में नहीं आई थी, पर ऐसा होने ही वाला था।
- source_word: τὸν πύργον καταλαβέσθαι
  choice: मीनार पर अधिकार करने
  rationale: καταλαμβάνω इस घेराबंदी के प्रसंग में किसी स्थान को अपने कब्ज़े में लेने का भाव देता है।
- source_word: τὴν αὐλαίαν θύραν
  choice: आँगन का फाटक
  rationale: αὐλαία का संबंध आँगन या प्रांगण से है और इस स्थापत्य प्रसंग में θύρα के लिए ‘फाटक’ उपयुक्त है।
- source_word: βιαζομένων
  choice: बलपूर्वक खोलने का प्रयास कर रही थी
  rationale: βιάζω हिंसक बल-प्रयोग का संकेत देता है; हिंदी में यह वाक्यांश फाटक के विरुद्ध जारी प्रयास को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: κελευόντων πῦρ προσάγειν
  choice: आग लाकर ... आदेश दे रही थी
  rationale: κελεύω स्पष्ट आदेश को और πῦρ προσάγειν आग पास लाने को व्यक्त करता है।
- source_word: τὰς θύρας ὑφάπτειν καὶ τὰς θύρας φλέγειν
  choice: फाटकों को सुलगाने और जला देने
  rationale: यूनानी पाठ के दोनों निकटार्थी अग्नि-संबंधी क्रियापदों को हिंदी में अलग-अलग रखा गया है, जिससे उसकी संचयी तीव्रता बनी रहती है।
- source_word: περικάλυπτος γενόμενος
  choice: चारों ओर से घिर जाने पर
  rationale: प्रसंग में पदबंध पूरी तरह घिर जाने या बच निकलने का मार्ग बंद हो जाने का भाव देता है।
- source_word: ὑπέθηκεν ἑαυτῷ τὸ ξίφος
  choice: तलवार अपने ऊपर चला दी
  rationale: यह हिंदी में आत्मघाती क्रिया को स्पष्ट करता है, पर वार की सटीक शारीरिक दिशा या ढंग को यूनानी से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: राजीस की आत्मघाती क्रिया का वर्णन
  choice: तलवार अपने ऊपर चला दी
  alternative: अपनी तलवार पर गिर पड़ा; तलवार अपने शरीर में भोंक ली; तलवार अपने ऊपर रख ली
  rationale: यह नैतिक रूप से संवेदनशील घटना है। अनुवाद न तो क्रिया को सौम्य बनाता है और न यूनानी पदबंध से अधिक उसके यांत्रिक ढंग को तय करता है; पादटिप्पणी शाब्दिकता और वैकल्पिक अर्थों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कथात्मक शैली रखी गई है। लंबे यूनानी वाक्य की क्रमिक गति और आग लगाने से संबंधित दोहरे पदबंध को बनाए रखा गया है। ‘भीड़’ सामूहिक कर्ता है, इसलिए हिंदी में एकवचन स्त्रीलिंग क्रियाएँ प्रयुक्त हुई हैं।
