  yaml_path: translation/deuterocanon/2_maccabees/014/005.yaml
  text: That day was quiet. But when he found an opportunity suitable for his own folly[a], and had been summoned by Demetrius to the council and asked in what disposition and purpose the Jews stood,
translation:
  language: hi
  text: उस दिन शांति रही। परन्तु अपनी ही मूर्खता के अनुकूल अवसर पाकर[a], उसे दिमेत्रियुस ने परिषद में बुलाया और उससे पूछा कि यहूदी किस मनोभाव और मंशा में हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “अपनी ही मूर्खता का सहयोगी अवसर पाकर।” यूनानी वाक्यांश संक्षिप्त है; इसका भाव है कि उसने ऐसा अवसर पकड़ लिया जो उसकी मूर्खतापूर्ण योजना में सहायक था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡσυχίαν ἔσχεν
  choice: शांति बनी रही
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘शांति थी/रही’ है। यह रूप उस दिन किसी उपद्रव के न होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καιρὸν ... λαβών
  choice: अवसर पाकर
  rationale: καιρός यहाँ उपयुक्त समय या अवसर को सूचित करता है; ‘अवसर पाकर’ कृदन्तीय संबंध और कथानक का प्रवाह बनाए रखता है।
- source_word: τῆς ἰδίας ἀνοίας συνεργόν
  choice: अपनी ही मूर्खता के लिए अनुकूल
  rationale: संक्षिप्त यूनानी वाक्यांश में अवसर को उसकी मूर्खता का ‘सहयोगी’ कहा गया है। मुख्य पाठ में अर्थपूर्ण और स्वाभाविक हिन्दी दी गई है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: προσκληθεὶς εἰς συνέδριον
  choice: परिषद में बुलाया
  rationale: συνέδριον विचार-विमर्श करने वाली राजकीय परिषद को दर्शाता है; ‘परिषद’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: ὑπὸ τοῦ Δημητρίου
  choice: दिमेत्रियुस ने
  rationale: कर्तृवाच्य हिन्दी संरचना में यूनानी कर्मवाच्य का स्वाभाविक रूपांतरण किया गया है; नाम का निकट ध्वन्यात्मक लिप्यंतरण रखा गया है।
- source_word: ἐπερωτηθείς
  choice: उससे पूछा गया
  rationale: संदर्भ औपचारिक पूछताछ का है, पर यूनानी क्रिया अनिवार्यतः शत्रुतापूर्ण पूछताछ नहीं दर्शाती; इसलिए व्यापक और तटस्थ शब्द चुना गया है।
- source_word: ἐν τίνι διαθέσει καὶ βουλῇ καθεστήκασιν
  choice: किस मनोभाव और मंशा में हैं
  rationale: διάθεσις वर्तमान रुख या मनोभाव और βουλή उद्देश्य या मंशा को अलग-अलग रखता है। हिन्दी में दोनों संज्ञाएँ सुरक्षित रखी गई हैं, और καθεστήκασιν की स्थितिवाचक शक्ति ‘में हैं’ से व्यक्त हुई है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: मक्काबियों के इस प्रसंग में यह शब्द व्यापक जातीय-धार्मिक समुदाय को सूचित करता है, केवल यहूदिया के निवासियों को नहीं।
theological_decisions:
- issue: οἱ Ἰουδαῖοι का सामुदायिक दायरा
  choice: यहूदी
  alternative: यहूदियावासी
  rationale: प्रसंग जातीय-धार्मिक और राजनीतिक समुदाय का है। ‘यहूदी’ भौगोलिक अर्थ तक सीमित किए बिना मूल संदर्भ को स्पष्ट रखता है।
