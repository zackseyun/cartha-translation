  yaml_path: translation/deuterocanon/2_maccabees/014/036.yaml
  text: And now, O Lord, holy in every holiness, keep this house, recently purified, undefiled forever.
translation:
  language: hi
  text: और अब, हे प्रभु, जो समस्त पवित्रता में पवित्र हैं,[b] इस भवन को[a], जो हाल ही में शुद्ध किया गया है, सदा अपवित्र होने से बचाए रखिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस मन्दिर को।” यूनानी में “इस भवन/घर” पवित्रस्थान के लिए प्रयुक्त एक सामान्य बाइबिलीय अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: “समस्त पवित्रता में पवित्र” यूनानी की एक असामान्य गहन अभिव्यक्ति का निकट अनुवाद है; इसका अर्थ “हर पवित्रीकरण से बढ़कर पवित्र” या इसी प्रकार का उत्कट सम्बोधन भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγιε παντὸς ἁγιασμοῦ
  choice: जो समस्त पवित्रता में पवित्र हैं
  rationale: यह असामान्य और गहन सम्बोधन यूनानी की पुनरुक्तिमूलक पवित्रता-भाषा को बनाए रखता है, पर हिन्दी में समझने योग्य रहता है।
- source_word: κύριε
  choice: हे प्रभु
  rationale: परमेश्वर को सम्बोधित करने वाले κύριος का स्वाभाविक और प्रतिष्ठित हिन्दी रूप।
- source_word: διατήρησον
  choice: बनाए रखिए
  rationale: यह आज्ञार्थक प्रार्थना भवन की शुद्ध अवस्था को निरन्तर सुरक्षित रखने का भाव व्यक्त करती है।
- source_word: εἰς αἰῶνα
  choice: सदा
  rationale: अनन्त अवधि के लिए स्वाभाविक, संक्षिप्त हिन्दी अभिव्यक्ति।
- source_word: ἀμίαντον
  choice: निष्कलंक
  rationale: यहाँ धार्मिक अशुद्धि से रहित होने का भाव है; ‘निष्कलंक’ अनुष्ठानिक और नैतिक दोनों अनुगूँजों को सम्भव रखता है।
- source_word: τόνδε τὸν ... οἶκον
  choice: इस भवन को
  rationale: οἶκος का मूल अर्थ ‘घर/भवन’ है और प्रसंग में यह मन्दिर को दर्शाता है। ‘भवन’ हिन्दी में सम्मानजनक है और मूल रूपक को सीधे ‘मन्दिर’ में बदलने से बचाता है।
- source_word: προσφάτως κεκαθερισμένον
  choice: जो हाल ही में शुद्ध किया गया है
  rationale: προσφάτως की हाल की समय-सूचना और पूर्ण निष्पन्न शुद्धिकरण—दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: οἶκος द्वारा पवित्रस्थान का उल्लेख
  choice: भवन
  alternative: मन्दिर
  rationale: यूनानी में शब्दशः ‘घर/भवन’ है, जो बाइबिल में पवित्रस्थान के लिए प्रचलित पद है। मुख्य पाठ में स्रोत की छवि रखी गई है और पादटिप्पणी में प्रसंग स्पष्ट किया गया है।
- issue: ἄγιε παντὸς ἁγιασμοῦ की असामान्य संरचना
  choice: समस्त पवित्रता में पवित्र
  alternative: सबसे पवित्र; समस्त पवित्रीकरण के पवित्र; सारी पवित्रता के स्रोत
  rationale: चुना हुआ रूप यूनानी की गहन किन्तु संक्षिप्त अभिव्यक्ति को सुरक्षित रखता है और ‘स्रोत’ जैसी ऐसी व्याख्या नहीं जोड़ता जो पाठ में स्पष्टतः नहीं कही गई।
- issue: ἀμίαντον का अनुष्ठानिक आशय
  choice: निष्कलंक बनाए रखिए
  alternative: अशुद्ध न होने दीजिए; निर्मल बनाए रखिए
  rationale: मन्दिर की हाल की शुद्धि के प्रसंग में धार्मिक अपवित्रता प्रमुख है; ‘निष्कलंक’ इस भाव को नैतिक अर्थ तक सीमित किए बिना गरिमापूर्वक व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण शैली रखी गई है। आदरसूचक बहुवचन और ‘रखिए’ का प्रयोग परमेश्वर से सीधे निवेदन के अनुरूप है। असामान्य यूनानी पवित्रता-वाक्यांश को सहज बनाने के लिए पूरी तरह अर्थानुवाद नहीं किया गया, ताकि उसकी वास्तविक अस्पष्टता और तीव्रता बनी रहे।
