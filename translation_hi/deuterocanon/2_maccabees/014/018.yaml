  yaml_path: translation/deuterocanon/2_maccabees/014/018.yaml
  text: Yet when Nicanor heard of the valor that those around Judas had[a], and of their courage in the struggles for their fatherland, he was reluctant to settle the matter by bloodshed.
translation:
  language: hi
  text: फिर भी, जब निकानोर ने यहूदा के साथियों की वीरता और उनकी मातृभूमि के लिए संघर्षों में उनके साहस के बारे में सुना, तो वह रक्तपात के द्वारा मामले का निर्णय करने से हिचकिचाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμως δὲ
  choice: फिर भी
  rationale: यह पिछले प्रसंग के विपरीत एक रियायती मोड़ दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀκούων
  choice: जब ... सुना
  rationale: वर्तमान कृदन्त को कालसूचक उपवाक्य के रूप में प्रस्तुत करने से निकानोर की प्रतिक्रिया की परिस्थिति स्पष्ट होती है।
- source_word: ἀνδραγαθίαν
  choice: वीरता
  rationale: यह युद्ध-संबंधी साहस और उत्कृष्ट पराक्रम का भाव व्यक्त करता है; ‘वीरता’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: यहूदा के साथी
  rationale: यूनानी मुहावरा यहूदा से जुड़े समूह को दर्शाता है; यह अनुवाद शाब्दिक असहजता से बचते हुए अर्थ सुरक्षित रखता है।
- source_word: ἐν τοῖς περὶ τῆς πατρίδος ἀγῶσιν
  choice: अपनी मातृभूमि के लिए संघर्षों में
  rationale: ἀγῶσιν के व्यापक ‘संघर्ष’ भाव तथा πατρίς के देशप्रेमपूर्ण ‘मातृभूमि’ भाव को बनाए रखता है।
- source_word: εὐψυχίαν
  choice: साहस
  rationale: यह दृढ़ मनोबल और निर्भीकता को व्यक्त करता है; प्रसंग में ‘साहस’ सबसे स्पष्ट आधुनिक विकल्प है।
- source_word: ὑπευλαβεῖτο
  choice: हिचकिचाया
  rationale: क्रिया सावधानी से पीछे हटने या अनिच्छुक होने का भाव देती है; ‘हिचकिचाया’ भय को अनावश्यक रूप से बढ़ाए बिना इसे व्यक्त करता है।
- source_word: τὴν κρίσιν διʼ αἵματος ποιήσασθαι
  choice: रक्तपात के द्वारा मामले का निर्णय करना
  rationale: मुहावरे में κρίσις का निर्णय/निपटारा और διʼ αἵματος का रक्त बहाकर हिंसक समाधान स्पष्ट रहता है।
