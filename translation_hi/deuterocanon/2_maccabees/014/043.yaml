base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/043.yaml
  text: But since he had not succeeded in the blow because of the urgency of the struggle[a], and the crowds were rushing in within the gates[b], he ran up bravely onto the wall and hurled himself manfully down into the crowds.
translation:
  language: hi
  text: पर संघर्ष की आपाधापी के कारण वह उस वार से अपना उद्देश्य पूरा न कर सका था[a], और भीड़ फाटकों के भीतर घुस रही थी। तब वह साहसपूर्वक दौड़कर दीवार पर चढ़ गया और पुरुषोचित वीरता से अपने आपको नीचे भीड़ में झोंक दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उस वार में सफल न हो सका।” यूनानी कथन संकेत करता है कि अपने ऊपर किया गया उसका पहला वार इच्छित परिणाम तक नहीं पहुँचा।
    reason: lexical_alternative
  - marker: b
    text: या, “साहसपूर्वक अपने आपको नीचे फेंक दिया।” यहाँ यूनानी शब्द वीरता को खास तौर पर पुरुषोचित गुण के रूप में व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ πληγῇ μὴ κατευκτήσας
  choice: वह उस वार से अपना उद्देश्य पूरा न कर सका था
  rationale: πληγή का अर्थ ‘वार’ या ‘घाव’ हो सकता है, पर प्रसंग और κατευκτήσας से यहाँ अपने ऊपर किए गए वार द्वारा इच्छित परिणाम प्राप्त न कर पाना अभिप्रेत है। यह अनुवाद उस आशय को स्वाभाविक हिन्दी में व्यक्त करता है और पादटिप्पणी में अधिक शाब्दिक विकल्प सुरक्षित रखता है।
- source_word: διὰ τὴν τοῦ ἀγῶνος σπουδήν
  choice: संघर्ष की आपाधापी के कारण
  rationale: ἀγών यहाँ हिंसक संघर्ष है और σπουδή समय के दबाव, जल्दबाज़ी तथा तीव्रता का भाव देती है। ‘आपाधापी’ परिस्थिति की हड़बड़ी को सहज आधुनिक हिन्दी में व्यक्त करती है।
- source_word: τῶν ὄχλων ἔσω τῶν θυρωμάτων εἰσβαλλόντων
  choice: भीड़ फाटकों के भीतर घुसी चली आ रही थी
  rationale: वाक्यांश भीड़ के द्वारों की सीमा के भीतर प्रवेश करने की जारी क्रिया बताता है। ‘घुसी चली आ रही थी’ गति और लगातार प्रवेश—दोनों को व्यक्त करता है।
- source_word: ἀναδραμὼν γενναίως ἐπὶ τὸ τεῖχος
  choice: वह साहसपूर्वक दौड़कर दीवार पर चढ़ गया
  rationale: ἀναδραμών तेज़ी से ऊपर जाने को, γενναίως साहस को और τεῖχος किलेबंदी की दीवार को दर्शाता है। चुना हुआ वाक्यांश स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: ἀπεκρήμνισεν ἑαυτὸν
  choice: अपने आपको नीचे भीड़ में झोंक दिया
  rationale: क्रिया ऊँचाई से स्वयं को बलपूर्वक नीचे फेंकने का अर्थ देती है। ‘झोंक दिया’ उसकी जानबूझकर और प्रबल गति को व्यक्त करता है।
- source_word: ἀνδρωδῶς
  choice: पुरुषोचित वीरता से
  rationale: यह यूनानी क्रियाविशेषण साहस को स्पष्ट रूप से पुरुषत्व से जोड़ता है। ‘पुरुषोचित वीरता से’ उस लिंग-सूचक भाव को मिटाए बिना आधुनिक पाठक के लिए अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: ἀνδρωδῶς में पुरुषत्व से जुड़ी वीरता
  choice: पुरुषोचित वीरता से
  alternative: साहसपूर्वक
  rationale: मूल यूनानी केवल सामान्य साहस नहीं, बल्कि उस समय पुरुषत्व से जोड़ी गई वीरता की भाषा प्रयोग करता है। अनुवाद उस ऐतिहासिक लिंग-सूचक भाव को बनाए रखता है; पादटिप्पणी सहज, लिंग-निरपेक्ष अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, कथात्मक और गरिमापूर्ण है। ‘आपाधापी’ तत्काल संघर्ष के दबाव को सहज रूप से व्यक्त करता है; ‘फाटक’, ‘दीवार’ और ‘झोंक दिया’ सामान्य पाठक के लिए स्पष्ट हैं। मूल के दो अलग साहस-सूचक शब्दों में γενναίως को ‘साहसपूर्वक’ और अधिक स्पष्टतः पुरुष-सूचक ἀνδρωδῶς को ‘पुरुषोचित वीरता से’ देकर भेद बनाए रखा गया है।
