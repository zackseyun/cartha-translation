  text: But after fuller consideration of these matters[a], and when the leader had communicated it to the crowds, and unanimous agreement had become evident[b], they assented to the terms.
translation:
  language: hi
  text: इन बातों पर और अधिक विचार किए जाने के बाद[a], और नेता के जनसमूहों को इन बातों की जानकारी देने तथा सर्वसम्मति स्पष्ट हो जाने पर[b], उन्होंने उन शर्तों को स्वीकार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इन बातों की और अधिक सावधानी से जाँच किए जाने के बाद।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जब एकमत सहमति प्रकट हुई’; यूनानी पाठ इस बात पर बल देता है कि सबका एक ही मत होना स्पष्ट हो गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονος ... γενομένης ... ἐπισκέψεως
  choice: और अधिक विचार-विमर्श होने के बाद
  rationale: यह संबंधकारक निरपेक्ष रचना पहले घटित परिस्थिति बताती है। ἐπίσκεψις यहाँ जाँच या विचार के अर्थ में है, और πλείονος की तुलनात्मक शक्ति को ‘और अधिक’ व्यक्त करता है।
- source_word: περὶ τούτων
  choice: इन बातों पर
  rationale: यह पहले से विचाराधीन विषयों की ओर संकेत करता है; ‘इन बातों पर’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: τοῦ ἡγουμένου
  choice: अगुवे
  rationale: यूनानी शब्द मूलतः नेतृत्व करने वाले व्यक्ति को दर्शाता है। ‘अगुवा’ किसी ऐसे विशिष्ट शासकीय पद को आरोपित नहीं करता जो मूल पाठ में स्पष्ट नहीं है।
- source_word: τοῖς πλήθεσιν
  choice: जनसमूहों को
  rationale: बहुवचन πλήθη एकत्र लोगों या समूहों को दर्शाता है; ‘जनसमूहों’ से उसका सामूहिक और बहुवचन भाव सुरक्षित रहता है।
- source_word: ἀνακοινωσαμένου
  choice: इसकी जानकारी दी
  rationale: क्रिया का भाव किसी बात को साझा करने या अवगत कराने का है; यह अनावश्यक रूप से औपचारिक घोषणा का अर्थ नहीं जोड़ता।
- source_word: φανείσης ὁμοψήφου συγγνώμης
  choice: सबकी एकमत सहमति स्पष्ट हो गई
  rationale: ὁμόψηφος का शाब्दिक भाव ‘एक ही मत वाला’ है और συγγνώμη यहाँ क्षमा नहीं, बल्कि सहमति है। यह अनुवाद सर्वसम्मति के प्रकट हो जाने का भाव बनाए रखता है।
- source_word: ἔνευσαν
  choice: स्वीकार कर लीं
  rationale: क्रिया सिर हिलाकर स्वीकृति जताने से विकसित होकर सहमत या स्वीकार करने का अर्थ देती है; प्रसंग में शर्तें स्वीकार करना स्वाभाविक है।
- source_word: ταῖς συνθήκαις
  choice: शर्तें
  rationale: συνθῆκαι समझौते की शर्तों या निबंधनों को सूचित करता है। ‘शर्तें’ संक्षिप्त है और अनावश्यक रूप से औपचारिक संधि का अर्थ नहीं जोड़ता।
