base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/028.yaml
  text: But when these men fell before Nikanor[a], he was thrown into confusion and took it badly that he should set aside the agreed terms[b], though the man had done no wrong.
translation:
  language: hi
  text: पर जब वे लोग निकानोर के सामने गिर पड़े[a], तो वह असमंजस में पड़ गया और उसे यह बहुत बुरा लगा कि वह पहले से तय बातों[b] को रद्द करे, जबकि उस व्यक्ति ने कोई अन्याय नहीं किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निकानोर के पैरों पर गिर पड़े,’ अर्थात विनती करते हुए।
    reason: lexical_alternative
  - marker: b
    text: या ‘पहले से की गई व्यवस्थाएँ,’ ‘तय शर्तें,’ अथवा ‘समझौता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπεσόντων
  choice: सामने गिर पड़े
  rationale: यह क्रिया किसी के सामने शारीरिक रूप से गिरकर विनती करने का भाव व्यक्त कर सकती है। ‘सामने गिर पड़े’ मूल बिंब को बनाए रखता है और विनती का आशय संदर्भ से उभरने देता है।
- source_word: συνεκέχυτο
  choice: उलझन में पड़ गया
  rationale: यह निकानोर की आंतरिक व्याकुलता और असमंजस को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δυσφόρως ἔφερεν
  choice: उसे यह बहुत अखरा
  rationale: यह मुहावरा किसी बात को कठिनाई, खिन्नता या अप्रसन्नता के साथ सहने का भाव रखता है; ‘बहुत अखरा’ उस भाव को संक्षिप्त और सहज हिन्दी में देता है।
- source_word: τὰ διεσταλμένα
  choice: पहले से तय शर्तों
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत पहले निर्धारित या व्यवस्थित बातों की ओर संकेत करता है। राजनयिक संदर्भ में ‘पहले से तय शर्तों’ उपयुक्त है।
- source_word: ἀθετήσει
  choice: रद्द करना पड़ेगा
  rationale: ἀθετέω का अर्थ अस्वीकार, अमान्य या निरस्त करना हो सकता है। यहाँ विचाराधीन भावी कार्रवाई को हिन्दी में स्वाभाविक बनाने के लिए ‘रद्द करना पड़ेगा’ चुना गया है।
- source_word: μηδὲν τἀνδρὸς ἠδικηκότος
  choice: उस मनुष्य ने कोई अन्याय नहीं किया था
  rationale: यह genitive absolute निकटवर्ती परिस्थिति में उस व्यक्ति द्वारा कोई अन्याय न किए जाने की सीमित नैतिक-कानूनी बात कहता है।
- source_word: Νικάνορι
  choice: निकानोर
  rationale: नाम को यूनानी रूप Νικάνωρ के निकट रखते हुए देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: μηδὲν τἀνδρὸς ἠδικηκότος में नैतिक निरूपण
  choice: उस मनुष्य ने कोई अन्याय नहीं किया था
  alternative: उस मनुष्य ने किसी के साथ अन्याय नहीं किया था
  rationale: मूल कथन को तत्काल प्रसंग तक सीमित रखा गया है; इसे व्यक्ति की व्यापक या पूर्ण निर्दोषता के दावे में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। शारीरिक विनती के बिंब और पहले से निर्धारित व्यवस्था की अर्थ-व्याप्ति को मुख्य पाठ तथा पादटिप्पणियों में सुरक्षित रखा गया है।
