base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/015.yaml
  text: But when they heard of Nikanor’s advance and the attack of the Gentiles[a], they sprinkled dust upon themselves and implored the one who had established his people forever[c][b], and who always comes to the aid of his own portion with manifestation.
translation:
  language: hi
  text: पर जब उन्होंने निकानोर के चढ़ आने और गैर-यहूदी जातियों[a] के आक्रमण का समाचार सुना, तो उन्होंने अपने ऊपर मिट्टी डाली और उस परमेश्वर से विनती की, जिसने अपनी प्रजा को सदा के लिए स्थापित किया है और जो सदा प्रकट रूप से[c] अपने हिस्से[b] की सहायता करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राष्ट्रों’। यहाँ प्रयुक्त यूनानी शब्द सामान्यतः ‘राष्ट्र’ कह सकता है, पर इस संदर्भ में वह यहूदियों के विरोधी गैर-यहूदी लोगों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी विरासत’। ‘अपने हिस्से’ परमेश्वर की प्रजा को उसके अपने ठहराए हुए हिस्से या अधिकार की वस्तु के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘प्रकट होकर’ अथवा ‘प्रकट हस्तक्षेप के साथ’। यूनानी वाक्यांश ऐसी सहायता का संकेत देता है जो स्पष्ट दैवी कार्य या प्रकट उपस्थिति के साथ होती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφοδον
  choice: चढ़ आने
  rationale: यह शब्द शत्रुतापूर्ण सैन्य बढ़त या धावे को व्यक्त करता है; ‘चढ़ आने’ से अगले शब्द ‘आक्रमण’ के साथ अनावश्यक पुनरुक्ति किए बिना सैन्य संदर्भ स्पष्ट रहता है।
- source_word: ἐπίθεσιν
  choice: आक्रमण
  rationale: यह सीधे हमले के लिए स्वाभाविक आधुनिक हिन्दी सैन्य शब्द है और ἔφοδον से भिन्नता बनाए रखता है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदी जातियों
  rationale: इस यहूदी ऐतिहासिक संदर्भ में ἔθνη केवल सामान्य राष्ट्र नहीं, बल्कि यहूदी प्रजा के विरोध में खड़े गैर-यहूदी समुदायों को सूचित करता है।
- source_word: καταπασάμενοι γῆν
  choice: अपने ऊपर मिट्टी डाली
  rationale: यह शोक, संकट और दीन प्रार्थना की देहगत क्रिया है। ‘मिट्टी डाली’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी के γῆν को सीधे व्यक्त करता है।
- source_word: ἐλιτάνευσαν
  choice: विनती की
  rationale: क्रिया गंभीर और आग्रहपूर्ण प्रार्थना बताती है; ‘विनती की’ सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
- source_word: τὸν ἄχρι αἰῶνος συστήσαντα τὸν αὐτοῦ λαόν
  choice: जिसने अपनी प्रजा को सदा के लिए स्थापित किया
  rationale: ‘स्थापित किया’ συνίστημι के गठन और स्थिर किए जाने के भाव को रखता है, जबकि ‘सदा के लिए’ ἄχρι αἰῶνος की स्थायी वाचकता व्यक्त करता है।
- source_word: ἀντιλαμβανόμενον
  choice: सहायता करता है
  rationale: वर्तमान कृदंत परमेश्वर की निरंतर और विशेषता-सूचक सहायता को बताता है; हिन्दी वर्तमान काल इस सतत भाव को सहजता से रखता है।
- source_word: μετʼ ἐπιφανείας
  choice: प्रत्यक्ष रूप से
  rationale: यह प्रकट, दिखाई देने योग्य या स्पष्ट दैवी सहायता का भाव देता है, पर इसे किसी तकनीकी धर्मवैज्ञानिक पद में सीमित नहीं करता।
- source_word: τῆς ἑαυτοῦ μερίδος
  choice: अपने निज भाग
  rationale: ‘निज भाग’ μερίς के आवंटित हिस्से का मूल रूपक बनाए रखता है और परमेश्वर की अपनी प्रजा के वाचा-संबंधी भाव को बिना विस्तार से समझाए सुरक्षित रखता है।
theological_decisions:
- issue: τῶν ἐθνῶν का यहूदी वाचा-संदर्भ में अनुवाद
  choice: गैर-यहूदी जातियों
  alternative: राष्ट्रों
  rationale: संदर्भ में विरोधी लोग केवल राजनीतिक राष्ट्र नहीं, बल्कि इस्राएल से बाहर के समुदाय हैं। फिर भी पादटिप्पणी मूल शब्द के व्यापक अर्थ को सुरक्षित रखती है।
- issue: μετʼ ἐπιφανείας में दैवी सहायता के ढंग का अनुवाद
  choice: प्रत्यक्ष रूप से
  alternative: प्रकट होकर; प्रकट हस्तक्षेप के साथ
  rationale: यह चयन सहायता के स्पष्ट या प्रकट होने का भाव रखता है, लेकिन यह निश्चित नहीं करता कि वाक्यांश का अर्थ स्वयं दैवी दर्शन है या स्पष्ट दैवी हस्तक्षेप।
- issue: μερίς में परमेश्वर की प्रजा का रूपक
  choice: अपने निज भाग
  alternative: अपनी निज विरासत
  rationale: ‘भाग’ यूनानी रूपक को अधिक सीधे सुरक्षित रखता है; ‘विरासत’ उसके वाचा-संबंधी निहितार्थ को स्पष्ट करती, पर मूल की संभावित अर्थ-सीमा को कुछ संकरा कर देती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। सैन्य पदों में ‘चढ़ आने’ और ‘आक्रमण’ का भेद मूल के युग्म को बचाता है। ‘निज भाग’ कुछ काव्यात्मक है, पर वाचा-संबंधी मूल रूपक को बनाए रखने के लिए जानबूझकर रखा गया है; पादटिप्पणी उसका अर्थ खोलती है।
