base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/014.yaml
  text: But they were selling all that remained[a], and at the same time were imploring the Lord to rescue those who had been sold by the ungodly Nikanor before he encountered them.
translation:
  language: hi
  text: पर वे बची हुई सारी चीज़ें बेच रहे थे और साथ ही प्रभु से विनती कर रहे थे कि वह उन लोगों को छुड़ाए, जिन्हें अधर्मी निकानोर ने उनसे सामना होने से पहले ही बेच दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् प्रसंग के अनुसार, “दास बनाकर बेच दिया था।” यूनानी में केवल “बेच दिया था” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ περιλελειμμένα πάντα
  choice: बची हुई सारी चीज़ें
  rationale: पूर्ण कृदन्त के साथ πάντα शेष बची समस्त वस्तुओं या संपत्ति को दर्शाता है। यह अनुवाद व्यापक अर्थ बनाए रखता है और वस्तुओं का स्वरूप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπώλουν
  choice: बेच रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार की जा रही क्रिया को व्यक्त करता है; ‘बेच रहे थे’ इस कालगत पक्ष को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὁμοῦ δὲ
  choice: और साथ ही
  rationale: यह बिक्री और प्रार्थना के एक ही समय होने को व्यक्त करता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यहाँ प्रार्थना परमेश्वर से की जा रही है; इसलिए κύριος के लिए प्रतिष्ठित और स्वाभाविक हिन्दी रूप ‘प्रभु’ उपयुक्त है।
- source_word: ἠξίουν
  choice: विनती कर रहे थे
  rationale: संकट में परमेश्वर से किए गए आग्रह की गंभीरता को व्यक्त करता है, जबकि आधुनिक हिन्दी में सहज रहता है।
- source_word: ῥύσασθαι
  choice: छुड़ाए
  rationale: यह तत्काल बंधन और संकट से मुक्त कराने की याचना है; ‘छुड़ाए’ प्रसंग में स्वाभाविक है और व्यापक धर्मशास्त्रीय अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: τοὺς ... πεπραμένους
  choice: उन लोगों को ... बेच दिया था
  rationale: पूर्ण कृदन्त पहले पूरी हो चुकी बिक्री और उसके बने हुए परिणाम को दर्शाता है। यूनानी में दासता स्पष्ट रूप से नहीं कही गई, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ὑπὸ τοῦ δυσσεβοῦς Νικάνορος
  choice: अधर्मी निकानोर ने
  rationale: दुष्टता और परमेश्वर-विरोध का मूल्यांकनात्मक भाव ‘अधर्मी’ में सुरक्षित रहता है। Νικάνορος का लिप्यंतरण ‘निकानोर’ किया गया है।
- source_word: πρὶν συντυχεῖν
  choice: उनसे सामना होने से पहले ही
  rationale: πρίν पूर्वता को दर्शाता है और συντυγχάνω यहाँ सैन्य मुठभेड़ के प्रसंग में ‘सामना होना’ के रूप में स्वाभाविक है। निकटतम कर्ता निकानोर है और कर्म वे लोग हैं जिनसे उसका सामना होना था।
theological_decisions:
- issue: परमेश्वर को संबोधित प्रार्थना में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रसंग स्पष्टतः परमेश्वर से की गई प्रार्थना का है; ‘प्रभु’ धार्मिक और सामान्य हिन्दी दोनों में उचित है।
- issue: क्या बिक्री को स्पष्टतः दासता में बेचा जाना कहा जाए
  choice: बेच दिया था
  alternative: दास बनाकर बेच दिया था
  rationale: प्रसंग दासता में बिक्री का प्रबल संकेत देता है, पर यूनानी πεπραμένους केवल ‘बेचे गए’ कहता है। अतः मुख्य पाठ स्रोत की अनिर्दिष्टता बनाए रखता है और प्रसंगगत अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। चल रही दोनों क्रियाओं के लिए ‘बेच रहे थे’ और ‘विनती कर रहे थे’ का समानांतर प्रयोग किया गया है। स्रोत की अस्पष्टता को बनाए रखते हुए दासता का निहितार्थ केवल पादटिप्पणी में स्पष्ट किया गया है।
