  rationale: शाब्दिक चित्र को बनाए रखता है, जिसमें रातें उसके सैन्य उपक्रमों में मानो सहयोगी बनती हैं। अपूर्णकालीन क्रिया के लिए ‘बना लेता था’ बार-बार अपनाई गई कार्यनीति का संकेत देता है।
- source_word: πρὸς τὰς τοιαύτας ἐπιβολάς
  choice: ऐसे आक्रमणों के लिए
  rationale: ἐπιβολή के प्रसंगानुकूल शत्रुतापूर्ण सैन्य उपक्रम के अर्थ को सरल और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ
  choice: उसकी वीरता की ख्याति
  rationale: प्रेषित यूनानी अभिव्यक्ति असामान्य है; प्रसंग में यह उसके रणसाहस की फैलती हुई चर्चा या प्रसिद्धि को सूचित करती प्रतीत होती है। ‘ख्याति’ मुहावरेदार है, पर टिप्पणी में अनिश्चितता सुरक्षित रखी गई है।
- source_word: διηχεῖτο πανταχῇ
  choice: हर ओर फैल गई
  rationale: ध्वनि के दूर तक गूँजने और बात के व्यापक रूप से प्रसिद्ध होने—दोनों से जुड़ी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
