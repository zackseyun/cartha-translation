base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/028.yaml
  text: But after the Sabbath[a], having distributed some of the spoils to those who had been oppressed, and to the widows and the orphans[b], they divided the rest among themselves and their children.
translation:
  language: hi
  text: सब्त के बाद उन्होंने लूट के माल[b] में से कुछ उन लोगों को बाँट दिया जिनके साथ बुरा व्यवहार किया गया था,[a] साथ ही विधवाओं और अनाथों को भी। फिर बचा हुआ माल उन्होंने अपने और अपने बच्चों के बीच बाँट लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो सताए गए थे” अथवा “जिन्होंने कठोर व्यवहार सहा था।” यूनानी शब्द व्यापक रूप से उन लोगों को दर्शाता है जिन्हें हानि पहुँचाई गई या जिनके साथ बुरा व्यवहार हुआ।
    reason: lexical_alternative
  - marker: b
    text: “लूट का माल” का अनुवाद “युद्ध में प्राप्त माल” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τὸ σάββατον
  choice: पर सब्त के बाद
  rationale: μετά के साथ कर्मकारक समय में किसी घटना के बाद का बोध कराता है। δέ यहाँ हल्का प्रसंग-परिवर्तन सूचित करता है; ‘पर’ इसे बिना तीव्र विरोध जताए व्यक्त करता है।
- source_word: τοῖς ἠκισμένοις
  choice: उन लोगों को जिनके साथ दुर्व्यवहार हुआ था
  rationale: पूर्ण निष्क्रिय कृदंत उन लोगों को दर्शाता है जिन्होंने कठोर व्यवहार, अपमान या हानि सही थी। यह हिन्दी अभिव्यक्ति अर्थ की व्यापकता बनाए रखती है और किसी विशेष सामाजिक वर्ग को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ταῖς χήραις καὶ τοῖς ὀρφανοῖς
  choice: विधवाओं तथा अनाथों को
  rationale: ये दोनों स्पष्ट सामाजिक श्रेणियाँ हैं; प्रचलित और स्वाभाविक हिन्दी शब्द मूल अर्थ को सीधे रखते हैं।
- source_word: μερίσαντες ἀπὸ τῶν σκύλων
  choice: लूट के माल में से कुछ ... बाँट दिया
  rationale: μερίζω बाँटने और σκῦλα युद्ध में प्राप्त लूट के माल का बोध कराता है। ἀπό बताता है कि उसमें से एक अंश इन लोगों को दिया गया; ‘कुछ’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τὰ λοιπὰ
  choice: बचा हुआ माल
  rationale: यह पहले वितरण के बाद शेष रहे लूट के माल को सूचित करता है। ‘माल’ की पुनरुक्ति हिन्दी में संदर्भ स्पष्ट रखती है।
- source_word: αὐτοὶ καὶ τὰ παιδία
  choice: अपने और अपने बच्चों के बीच
  rationale: αὐτοί योद्धाओं को और τὰ παιδία बच्चों को प्राप्तकर्ता के रूप में रखता है। प्रसंग में संबंधवाचक ‘अपने बच्चों’ स्वाभाविक है, यद्यपि यूनानी में संबंधवाचक सर्वनाम अलग से नहीं है।
- source_word: διεμερίσαντο
  choice: बाँट लिया
  rationale: मध्यवाच्य रूप प्राप्तकर्ताओं के बीच शेष वस्तु बाँटने को व्यक्त करता है; ‘बाँट लिया’ हिन्दी में इस भाव को सहजता से व्यक्त करता है।
theological_decisions:
- issue: लूट के माल के वितरण में सामाजिक-नैतिक क्रम
  choice: पहले पीड़ित लोगों, विधवाओं और अनाथों को लूट के माल में से एक अंश दिया गया, फिर शेष माल योद्धाओं और उनके बच्चों में बाँटा गया।
  alternative: अधिक शब्दशः रूप में ‘लूट के माल में से बाँटकर’ कहा जा सकता है, बिना यह स्पष्ट किए कि पहले केवल एक अंश दिया गया था।
  rationale: वाक्यक्रम, ἀπό और τὰ λοιπά मिलकर पहले असुरक्षित लोगों के लिए माल में से हिस्सा निकालने और फिर शेष बाँटने का संकेत देते हैं। यह भाषिक-संदर्भगत निष्कर्ष है, कोई अतिरिक्त नैतिक या सांप्रदायिक व्याख्या नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है ताकि वितरण का क्रम साफ रहे। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
