- source_word: προσέπεσεν
  choice: समाचार मिला
  rationale: यहाँ προσπίπτω का प्रयोग सूचना के यहूदा तक पहुँचने के अर्थ में है; इसलिए शाब्दिक ‘आ पड़ा’ के बजाय स्वाभाविक हिन्दी ‘समाचार मिला’ उपयुक्त है।
- source_word: περὶ τῆς τοῦ Νικάνορος ἐφόδου
  choice: निकानोर के चढ़ आने का
  rationale: ἐφόδος आक्रमण, धावा या आगे बढ़ने को सूचित कर सकता है। ‘चढ़ आने’ में शत्रुतापूर्ण बढ़त का भाव है, पर यह अनिवार्य रूप से नहीं कहता कि युद्ध आरम्भ हो चुका था।
- source_word: μεταδόντος
  choice: सूचना दी
  rationale: मूल क्रिया का अर्थ किसी बात को बाँटना या पहुँचा देना है; इस प्रसंग में सूचना साथियों तक पहुँचाना अभिप्रेत है।
- source_word: τοῖς σὺν αὐτῷ
  choice: अपने साथियों को
  rationale: यह स्वाभाविक हिन्दी में ‘जो उसके साथ थे’ का संक्षिप्त और अनिर्दिष्ट रूप है।
- source_word: τὴν παρουσίαν τοῦ στρατοπέδου
  choice: सेना के आ पहुँचने की
  rationale: παρουσία ‘उपस्थिति’ अथवा ‘आगमन’ और στρατόπεδον ‘छावनी’ अथवा ‘सेना’ हो सकता है। प्रसंग में ‘सेना के आ पहुँचने’ से संकुचित यूनानी वाक्यांश का स्वाभाविक अर्थ व्यक्त होता है।
