- source_word: τρισαλιτήριος
  choice: नितान्त पापी
  rationale: यह दुर्लभ और अत्यन्त निन्दात्मक विशेषण नैतिक-धार्मिक दोष का बोध कराता है; τρις- यहाँ तीव्रता बढ़ाता है। ‘नितान्त पापी’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इसकी प्रबल निन्दा व्यक्त करता है।
