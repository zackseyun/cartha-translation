  rationale: The revised main text uses ‘परम दुष्ट’ for an idiomatic, emphatic Hindi equivalent of the source’s severe invective, without presenting one uncertain lexical nuance as certain. The footnote retains both the possible literal threefold sense and the pollution/defilement nuance. The purpose clause is made more direct while retaining the source’s reference to the sale of Jews and the prior action indicated by the participle.
