- source_word: τρισχιλίους ἐμπόρους
  choice: तीन हज़ार व्यापारियों
  rationale: संख्या और वाणिज्यिक संज्ञा का सीधा, स्वाभाविक अनुवाद।
- source_word: ἐπὶ τὴν πρᾶσιν τῶν Ἰουδαίων
  choice: यहूदियों को बेचने के लिए
