base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/015.yaml
  text: and not because of them[a], but because of the covenants made with their fathers[b], and because of the invocation of his majestic and magnificent name over them.
translation:
  language: hi
  text: और यदि उनके कारण नहीं[a], बल्कि उनके पूर्वजों के साथ की गई वाचाओं के कारण, और उन पर उसके गरिमामय और प्रतापशाली नाम[b] के पुकारे जाने के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके लिए नहीं।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “उन पर उसके गरिमामय और प्रतापशाली नाम का पुकारा जाना।” यह परमेश्वर का नाम उसके लोगों पर पुकारे जाने की धर्मग्रंथीय अभिव्यक्ति है।'
    reason: cultural_note
lexical_decisions:
- source_word: εἰ μὴ διʼ αὐτούς
  choice: यदि उनके अपने कारण नहीं
  rationale: यह वाक्यांश लोगों को स्वयं परमेश्वर की कृपा का आधार मानने से इनकार करता है। ‘अपने’ जोड़ने से आधुनिक हिन्दी में आशय स्पष्ट होता है, पर लोगों के गुण-दोष के बारे में पाठ से आगे कोई निष्कर्ष नहीं निकाला जाता।
- source_word: διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας
  choice: उनके पूर्वजों के साथ बाँधी गई वाचाओं के कारण
  rationale: यहूदी धर्मग्रंथीय संदर्भ में διαθήκας के लिए ‘वाचाओं’ उपयुक्त है। πρὸς τοὺς πατέρας की संबंधपरक भावना को स्वाभाविक हिन्दी में ‘पूर्वजों के साथ बाँधी गई’ से व्यक्त किया गया है।
- source_word: ἕνεκα
  choice: इसलिए कि
  rationale: यह दूसरा कारण प्रस्तुत करता है। हिन्दी में इसके बाद आने वाले ‘नाम पुकारे जाने’ वाले उपवाक्य को सहज रूप से जोड़ने के लिए ‘इसलिए कि’ चुना गया है।
- source_word: τῆς ἐπʼ αὐτοὺς ἐπικλήσεως
  choice: उन पर पुकारा गया है
  rationale: ἐπίκλησις और ἐπί की संयुक्त भावना को ‘उन पर ... नाम पुकारा गया’ बनाए रखता है; इसे केवल प्रतिष्ठा या स्वामित्व कहकर अर्थ को संकुचित नहीं किया गया।
- source_word: τοῦ σεμνοῦ καὶ μεγαλοπρεποῦς ὀνόματος αὐτοῦ
  choice: उसका गरिमामय और प्रतापशाली नाम
  rationale: ‘गरिमामय’ और ‘प्रतापशाली’ दोनों सम्मानसूचक विशेषणों तथा यूनानी की उन्नत शैली को आधुनिक, बोधगम्य हिन्दी में अलग-अलग बनाए रखते हैं।
theological_decisions:
- issue: ईश्वरीय अनुग्रह का वाचागत आधार
  choice: अनुकूल कार्य का आधार लोगों में स्वयं नहीं, बल्कि पूर्वजों के साथ बाँधी गई वाचाएँ और उन पर पुकारा गया परमेश्वर का नाम बताया गया है।
  alternative: वाक्य को केवल परमेश्वर की प्रतिष्ठा या केवल पूर्वजों से की गई प्रतिज्ञाओं पर केंद्रित करके सरल बनाया जा सकता था।
  rationale: यूनानी पाठ लोगों को आधार मानने से इनकार करते हुए स्पष्टतः दो कारण देता है। अनुवाद इस तनाव और दोनों कारणों को बनाए रखता है तथा योग्यता, चुनाव या अनुग्रह का कोई विस्तृत सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘वाचा’ धर्मग्रंथीय संदर्भ का परिचित शब्द है; ‘पूर्वज’ आज के सामान्य पाठक के लिए ‘पितरों’ से अधिक स्पष्ट है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] अपने संबद्ध वाक्यांशों के साथ दिए गए हैं।
