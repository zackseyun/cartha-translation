  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और कथात्मक। ‘साहस भरा’ प्रेरक प्रभाव को, ‘नियमों’ यूनानी बहुवचन को, और ‘चार दलों’ सैन्य संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
