  text: With these words he encouraged them and made them ready to die for the laws and the fatherland[a], and he formed the army into four parts.
translation:
  language: hi
  text: इन बातों से उसने उनमें साहस भरा और उन्हें नियमों तथा मातृभूमि के लिए मरने को तैयार किया; फिर उसने सेना को चार दलों में बाँट दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उसने सेना को चार भागों वाला बनाया।”'
    reason: यूनानी पदबंध के अधिक शाब्दिक रूप को दर्ज करते हुए मुख्य पाठ के स्वाभाविक सैन्य अर्थ की पुष्टि करना।
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: इन बातों से
  rationale: यह पदबंध पिछली बातों की ओर संकेत करता है और उनके प्रभाव को बताता है। ‘इन बातों से’ उसके साधनात्मक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: εὐθαρσεῖς αὐτοὺς παραστήσας
  choice: उसने उनमें साहस भरा
  rationale: शाब्दिक अर्थ उन्हें साहसी या हिम्मतवाला बनाकर खड़ा करने का है। हिन्दी में यह प्रयोग उस प्रेरक और कारणवाचक भाव को सहज रूप से व्यक्त करता है।
- source_word: ἑτοίμους ... ἀποθνήσκειν
  choice: उन्हें ... मरने को तैयार किया
  rationale: यह मृत्यु की वास्तविक तत्परता को बिना नरम किए स्पष्ट रूप से व्यक्त करता है।
- source_word: ὑπὲρ τῶν νόμων
  choice: नियमों के लिए
  rationale: नियमों का बहुवचन यूनानी पाठ के νόμων को सुरक्षित रखता है और प्रसंग में पैतृक धार्मिक नियमों की ओर संकेत करता है।
- source_word: τῆς πατρίδος
  choice: मातृभूमि
  rationale: यह पैतृक देश या अपनी भूमि के प्रति निष्ठा और भावनात्मक भार को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τετραμερές τι ἐποίησεν τὸ στράτευμα
  choice: उसने सेना को चार दलों में बाँट दिया
  rationale: यूनानी वाक्य सेना को चार भागों वाला बनाने की बात कहता है। सैन्य प्रसंग में ‘चार दलों में बाँट दिया’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: नियमों और πατρίς के लिए मरने की तत्परता
  choice: नियमों तथा मातृभूमि के लिए मरने को तैयार
  alternative: व्यवस्था और पैतृक देश की रक्षा में मरने को तैयार
  rationale: मुख्य पाठ बहुवचन ‘नियमों’ और सीधे ‘मरने’ के भाव को बनाए रखता है। ‘मातृभूमि’ राष्ट्रीय निष्ठा का भार व्यक्त करती है, पर पाठ से आगे बढ़कर किसी बाद की राजनीतिक या सांप्रदायिक अवधारणा को नहीं जोड़ती।
