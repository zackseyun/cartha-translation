base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/018.yaml
  text: For they[a], he said, have put their confidence in weapons and boldness, but we have put our confidence in Almighty God, who is able with a single nod to bring down both those coming against us and the whole world.
translation:
  language: hi
  text: क्योंकि उन्होंने, उसने कहा, हथियारों और अपने साहस पर भरोसा रखा है; पर हमने सर्वशक्तिमान परमेश्वर पर भरोसा रखा है, जो एक संकेत[a] से हम पर चढ़ आने वालों और सारे संसार, दोनों को गिरा देने में समर्थ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक संकेत से’ का अनुवाद ‘सिर के एक इशारे से’ भी हो सकता है। यूनानी शब्द किसी इशारे या संकेत को दर्शाता है और इस बात पर बल देता है कि परमेश्वर बड़ी सहजता से शत्रुओं को गिरा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλοις
  choice: हथियारों
  rationale: युद्ध के साधनों के लिए यह स्पष्ट और स्वाभाविक आधुनिक हिन्दी शब्द है।
- source_word: τόλμαις
  choice: अपने साहस
  rationale: यह युद्ध में निर्भीकता या दुस्साहस का भाव देता है; ‘साहस’ मूल की सकारात्मक अथवा तटस्थ अस्पष्टता को बनाए रखता है। ‘अपने’ हिन्दी में भरोसे के आधार को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἐπὶ τῷ παντοκράτορι θεῷ
  choice: सर्वशक्तिमान परमेश्वर पर
  rationale: ἐπί के साथ πεποίθαμεν भरोसे के आधार को व्यक्त करता है; ‘पर भरोसा’ स्वाभाविक हिन्दी है और παντοκράτωρ की उपाधि का धार्मिक भार सुरक्षित रखता है।
- source_word: δυναμένῳ
  choice: जो ... समर्थ है
  rationale: कृदन्त परमेश्वर का वर्णन करते हुए उस पर भरोसे का कारण बताता है।
- source_word: τοὺς ἐρχομένους ἐφʼ ἡμᾶς
  choice: हम पर चढ़ आनेवालों
  rationale: यह शत्रुतापूर्वक आगे आने की गति को व्यक्त करता है, बिना हमले की अवस्था को आवश्यकता से अधिक निश्चित किए।
- source_word: τὸν ὅλον κόσμον
  choice: सारे संसार
  rationale: κόσμος के व्यापक अर्थ को सहज हिन्दी में सुरक्षित रखता है; इसे अधिक निश्चित ‘ब्रह्माण्ड’ नहीं बनाया गया।
- source_word: ἑνὶ νεύματι
  choice: केवल एक संकेत से
  rationale: νεῦμα सिर के इशारे अथवा संकेत को दर्शाता है। ‘केवल एक संकेत से’ हिन्दी में स्वाभाविक है और परमेश्वर की सहज सामर्थ्य पर बल देता है।
- source_word: καταβαλεῖν
  choice: गिरा देने
  rationale: क्रिया का मूल भाव नीचे गिराने या परास्त कर देने का है; यह शत्रुओं और सारे संसार—दोनों के साथ संगत है।
- source_word: πεποίθασιν / πεποίθαμεν
  choice: भरोसा रखा है / भरोसा रखा है
  rationale: पूर्णकालिक रूप स्थापित और वर्तमान तक बने हुए भरोसे को सूचित करते हैं; दोनों खंडों में समान अभिव्यक्ति से यूनानी समानांतरता बनी रहती है।
theological_decisions:
- issue: παντοκράτωρ की ईश्वरीय उपाधि
  choice: सर्वशक्तिमान परमेश्वर
  alternative: सर्वाधिपति परमेश्वर
  rationale: ‘सर्वशक्तिमान’ आधुनिक हिन्दी में स्थापित और बोधगम्य उपाधि है, जो यहाँ परमेश्वर की सर्वोच्च सामर्थ्य को व्यक्त करती है।
- issue: κόσμος का विस्तार
  choice: सारा संसार
  alternative: समूचा ब्रह्माण्ड
  rationale: ‘संसार’ κόσμος का सामान्य व्यापक अर्थ रखता है और कथन की विश्वव्यापी व्यापकता को किसी एक संकुचित व्याख्या में नहीं बाँधता।
- issue: शत्रुओं और संसार के साथ καταβαλεῖν का प्रयोग
  choice: दोनों को गिरा देने
  alternative: दोनों को परास्त कर देने
  rationale: ‘गिरा देना’ मूल क्रिया का ठोस रूपक बचाता है; ‘परास्त करना’ संसार के संबंध में अर्थ को अनावश्यक रूप से केवल सैन्य बना देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उसने कहा’ को मूल यूनानी वाक्य-विन्यास के अनुरूप बीच में रखा गया है। मुख्य पाठ में पादटिप्पणी-चिह्न संबंधित ‘संकेत’ के बाद दिया गया है।
