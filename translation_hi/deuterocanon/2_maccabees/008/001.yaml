base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/001.yaml
  text: But Judas[a], who was also called Maccabeus, and those with him, slipping in secretly into the villages, were calling together their relatives; and taking in those who had remained in Judaism, they gathered about six thousand.
translation:
  language: hi
  text: परन्तु यहूदा, जो मकाबी भी कहलाता था, और उसके साथी चुपके से गाँवों में प्रवेश करते हुए अपने संबंधियों को अपने पास बुलाते थे; और जो लोग यहूदी धर्म में बने रहे थे[a], उन्हें अपने साथ मिलाकर उन्होंने कुल छह हजार लोगों को इकट्ठा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो यहूदी जीवन-पद्धति के प्रति निष्ठावान बने रहे थे।” यहाँ यूनानी शब्द “यहूदी धर्म” यूनानीकरण के दबाव के विपरीत यहूदी धार्मिक पहचान और आचरण को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισπορευόμενοι λεληθότως
  choice: चुपके से गाँवों में जाते थे
  rationale: दोनों अभिव्यक्तियाँ गुप्त और अनदेखी आवाजाही पर बल देती हैं। संयुक्त हिन्दी रूप पुनरुक्ति से बचते हुए गति और गोपनीयता दोनों को व्यक्त करता है।
- source_word: προσεκαλοῦντο
  choice: अपने पास बुलाते
  rationale: मध्यवाच्य का भाव लोगों को अपनी ओर और अपने दल में बुलाने का है; यह औपचारिक सैन्य भर्ती का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: τοὺς συγγενεῖς
  choice: अपने संबंधियों
  rationale: यह आधुनिक, स्वाभाविक और लिंग-समावेशी रूप है, जो पारिवारिक अथवा कुलगत निकटता को व्यक्त करता है।
- source_word: τοὺς μεμενηκότας ἐν τῷ Ἰουδαϊσμῷ
  choice: जो लोग यहूदी धर्म में बने रहे थे
  rationale: यह यूनानी संरचना और धार्मिक-सामुदायिक पहचान को निकटता से सुरक्षित रखता है; निष्ठा का भाव प्रसंग में संभव है, पर उसे मुख्य पाठ में स्पष्ट रूप से जोड़ना व्याख्यात्मक होता।
- source_word: προσλαμβανόμενοι
  choice: उन्हें अपने साथ मिलाते गए
  rationale: यह लोगों को स्वीकार करके दल में सम्मिलित करने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: συνῆγον εἰς ἑξακισχιλίους
  choice: लगभग छः हज़ार लोगों को इकट्ठा कर लिया
  rationale: परिणामी कुल संख्या को स्वाभाविक हिन्दी में व्यक्त करता है। εἰς के साथ संख्या यहाँ लगभग उस संख्या तक पहुँचने का भाव देती है।
- source_word: ὁ καὶ Μακκαβαῖος
  choice: जो मकाबी भी कहलाता था
  rationale: यह यहूदा के अतिरिक्त नाम अथवा उपाधि को स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: Ἰουδαϊσμός का अनुवाद
  choice: यहूदी धर्म
  alternative: यहूदी जीवन-पद्धति के प्रति निष्ठावान
  rationale: यह पद यूनानी मूल के धार्मिक और सामुदायिक पहचान-सूचक अर्थ को सीधे व्यक्त करता है। वैकल्पिक रूप यूनानीकरण के दबाव के बीच निष्ठा के प्रसंगगत भाव को स्पष्ट करता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। गुप्त आवाजाही को एक स्वाभाविक संयुक्त वाक्यांश में रखा गया है और लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है।
