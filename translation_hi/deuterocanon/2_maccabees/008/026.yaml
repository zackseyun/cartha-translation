- source_word: ἦν γὰρ
  choice: क्योंकि वह ... समय था
  rationale: γάρ पिछले कथन का कारण बताता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ πρὸ τοῦ σαββάτου δίκη
  choice: सब्त से एक दिन पहले का समय
  rationale: पाठ में δίκη शब्द इस प्रसंग में शाब्दिक अर्थ लेने पर कठिन है। πρὸ τοῦ σαββάτου और अगले उपवाक्य के आधार पर भाव सब्त से पहले के समय या दिन का है; ‘समय’ मूल पाठ की असामान्यता को अत्यधिक निश्चित किए बिना प्रसंगानुकूल अर्थ देता है।
- source_word: διʼ ἣν αἰτίαν
  choice: इसी कारण
  rationale: यह पदबंध स्पष्ट कारणसूचक संबंध व्यक्त करता है; ‘इसी कारण’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: οὐκ ἐμακροτόνησαν
  choice: बहुत देर तक ... नहीं किया
  rationale: क्रिया किसी कार्य को लंबा खींचने या अधिक समय तक जारी रखने से इनकार को बताती है; हिन्दी में यह संरचना उस अवधि को स्पष्ट करती है।
- source_word: κατατρέχοντες αὐτούς
  choice: उनका पीछा
  rationale: सैन्य प्रसंग में participle विरोधियों का पीछा करते रहने या उन्हें धर दबोचने के लिए दौड़ने को दर्शाता है; ‘पीछा करना’ स्पष्ट और स्वाभाविक है।
