base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/029.yaml
  text: After doing these things[a], and making a common prayer of supplication[b], they begged the merciful Lord to be fully reconciled to his servants.
translation:
  language: hi
  text: ये काम कर चुकने के बाद उन्होंने मिलकर विनती की और दयालु प्रभु से आग्रह किया कि वह अपने दासों[a] से पूरी तरह मेल कर लें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने सेवकों’। यूनानी शब्द अधीनता और स्वामित्व का अधिक प्रबल भाव भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अंततः मेल कर लें’। यूनानी पदबंध पूर्णता पर बल दे सकता है या मेल होने को उसके अंतिम परिणाम तक पहुँचा हुआ बता सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: διαπραξάμενοι
  choice: ये काम कर चुकने के बाद
  rationale: कृदन्त पहले बताए गए कार्यों के संपन्न हो जाने का सार प्रस्तुत करता है; यह अनुवाद परिणाम को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: κοινὴν ἱκετίαν ποιησάμενοι
  choice: उन्होंने मिलकर विनती की
  rationale: κοινήν सामूहिक सहभागिता और ἱκετίαν गिड़गिड़ाकर की गई प्रार्थनापूर्ण विनती को व्यक्त करता है; आधुनिक हिन्दी में यह वाक्यांश स्वाभाविक और स्पष्ट है।
- source_word: ἐλεήμονα κύριον
  choice: दयालु प्रभु
  rationale: ἐλεήμονα परमेश्वर की दया को और κύριον इस प्रार्थना-संदर्भ में दिव्य उपाधि ‘प्रभु’ को व्यक्त करता है।
- source_word: ἠξίουν
  choice: आग्रह किया
  rationale: यह उनकी गंभीर और लगातार याचना को साधारण ‘कहा’ या ‘माँगा’ से अधिक स्पष्ट करता है, पर हिन्दी में अत्यधिक भावुक भी नहीं लगता।
- source_word: εἰς τέλος
  choice: पूरी तरह
  rationale: यहाँ पदबंध मेल-मिलाप की पूर्णता पर बल दे सकता है; कालगत अर्थ ‘अंततः’ भी संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: καταλλαγῆναι
  choice: मेल कर लें
  rationale: यह संबंध और अनुग्रह की पुनर्स्थापना का भाव बनाए रखता है तथा इसे केवल क्रोध शांत होने तक सीमित नहीं करता।
- source_word: δούλοις
  choice: दासों
  rationale: ‘दास’ स्वामित्व और प्रभु पर निर्भरता का प्रबल मूल भाव सुरक्षित रखता है; ‘सेवक’ अधिक सहज किंतु कुछ नरम विकल्प है।
theological_decisions:
- issue: परमेश्वर के संबंध में δούλοις का अनुवाद
  choice: अपने दासों
  alternative: अपने सेवकों
  rationale: यूनानी शब्द अधीनता और स्वामित्व का प्रबल भाव रखता है। ‘दासों’ उस तनाव को सुरक्षित रखता है, जबकि अधिक सहज विकल्प पादटिप्पणी में दिया गया है।
- issue: εἰς τέλος καταλλαγῆναι का बल
  choice: पूरी तरह मेल कर लें
  alternative: अंततः मेल कर लें; पूरी तरह प्रसन्न हो जाएँ
  rationale: मुख्य पाठ संबंध की पूर्ण बहाली पर बल देता है और ‘मेल’ की पारस्परिक भाषा से उत्पन्न मूल धार्मिक तनाव को मिटाता नहीं। εἰς τέλος का कालगत अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिलकर विनती की’ सामूहिक प्रार्थना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘दासों’ और ‘मेल कर लें’ मूल यूनानी के अधीनता तथा संबंध-पुनर्स्थापना के भावों को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखते हैं।
