  yaml_path: translation/deuterocanon/2_maccabees/008/005.yaml
  text: But when Maccabaeus had formed a band[a], he had by then become irresistible to the nations, because the wrath of the Lord had turned to mercy.
translation:
  language: hi
  text: पर जब मक्काबी ने एक दल संगठित कर लिया, तब तक जातियाँ[a] उसका सामना नहीं कर सकती थीं, क्योंकि प्रभु का क्रोध दया में बदल गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गैर-यहूदियों’; यूनानी शब्द से यहूदिया के आसपास की गैर-यहूदी जातियाँ अभिप्रेत हो सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ... ἐν συστήματι
  choice: जब मक्काबी ने एक दल संगठित कर लिया
  rationale: यह पदबंध मक्काबी के एक संगठित समूह में आकर कार्य करने का भाव देता है। हिंदी में यह अभिव्यक्ति स्वाभाविक है और दल का सैन्य आकार अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ἀνυπόστατος
  choice: अजेय
  rationale: यह शब्द ऐसे व्यक्ति का बोध कराता है जिसके सामने टिकना या जिसका प्रतिरोध करना संभव न हो। युद्ध-संदर्भ में ‘अजेय’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῖς ἔθνεσιν
  choice: जातियों[a] के लिए
  rationale: ‘जातियाँ’ यूनानी शब्द का सीधा अर्थ सुरक्षित रखता है; संदर्भ में इससे यहूदिया के आसपास की गैर-यहूदी जातियाँ अभिप्रेत हो सकती हैं, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τῆς ὀργῆς
  choice: क्रोध
  rationale: ‘क्रोध’ ईश्वरीय अप्रसन्नता की गंभीरता को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: यहाँ κύριος इस्राएल के परमेश्वर की उपाधि है; ‘प्रभु’ इसका प्रतिष्ठित और स्पष्ट हिंदी रूप है।
- source_word: εἰς ἔλεον τραπείσης
  choice: दया में बदल गया था
  rationale: यह रूप क्रोध से दया की ओर हुए परिवर्तन के रूपक को बनाए रखता है और पूर्वकालिकता को भी व्यक्त करता है।
theological_decisions:
- issue: अंतिम संबंधकारक स्वतंत्र वाक्यांश का कारणसूचक संबंध और ईश्वरीय भाव-परिवर्तन
  choice: क्योंकि प्रभु का क्रोध दया में बदल गया था
  alternative: जब प्रभु का क्रोध दया में बदल गया था
  rationale: संदर्भ में यह वाक्यांश मक्काबी के अजेय होने का कारण समझाता है। अनुवाद इस सफलता को प्रभु के क्रोध के दया में बदलने से जोड़ता है, पर परिवर्तन की प्रकृति को पाठ से आगे जाकर नहीं समझाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘दल’ संगठित युद्धकारी समूह को बिना उसका आकार निश्चित किए व्यक्त करता है; ‘अजेय’ प्रतिरोध न कर पाने के भाव को संक्षेप में रखता है।
