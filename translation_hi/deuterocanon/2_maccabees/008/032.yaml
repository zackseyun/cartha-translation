  text: But they killed the commander among those with Timothy, a thoroughly worthless man who had caused the Jews much distress.
translation:
  language: hi
  text: उन्होंने तीमुथियुस के साथियों में एक दलनायक को भी मार डाला, जो एक असहनीय[a] व्यक्ति था और जिसने यहूदियों को बहुत दुःख पहुँचाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका सामना न किया जा सके,” अर्थात् दुर्जेय।
    reason: यूनानी ἀνυπόστατον का अर्थ ‘असहनीय’ हो सकता है, पर इसका एक सम्भव अर्थ ऐसा व्यक्ति भी है जिसका सामना करना कठिन या असम्भव हो।
lexical_decisions:
- source_word: φυλάρχην
  choice: दलनायक
  rationale: इस शब्द का मूल अर्थ किसी कुल या समुदाय का प्रधान है, पर यहाँ तीमुथियुस के सशस्त्र दल के संदर्भ में नेतृत्व का सैनिक भाव प्रमुख है; इसलिए सहज आधुनिक हिन्दी में ‘दलनायक’ चुना गया।
- source_word: τῶν περὶ Τιμόθεον
  choice: तीमुथियुस के साथियों में से
  rationale: यूनानी मुहावरा तीमुथियुस के आसपास या उसके दल में रहनेवालों को दर्शाता है। ‘में से’ उस दल के भीतर इस दलनायक की स्थिति को बनाए रखता है।
- source_word: ἀνυπόστατον
  choice: असहनीय
  rationale: शब्द किसी ऐसे व्यक्ति का भाव दे सकता है जिसे सहना या जिसका सामना करना कठिन हो। संदर्भ में यह व्यक्ति यहूदियों को बहुत दुःख देनेवाला था; ‘असहनीय’ नकारात्मक अर्थ को स्वाभाविक रखता है, जबकि शब्द की दूसरी सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: πολλὰ … ἐπιλελυπηκότα
  choice: बहुत दुःख पहुँचाया था
  rationale: पूर्ण कृदंत पूर्व में किए गए और वर्तमान प्रसंग तक प्रासंगिक रहे उत्पीड़न को बताता है; हिन्दी का पूर्ण भूतकाल इसे सहजता से व्यक्त करता है।
theological_decisions:
- issue: ἀνυπόστατον का मूल्यांकनात्मक अर्थ
  choice: असहनीय
  alternative: दुर्जेय / जिसका सामना न किया जा सके
  rationale: शब्द में सामना न कर सकने या सहन न कर सकने की वास्तविक द्विअर्थी सम्भावना है। मुख्य पाठ संदर्भानुकूल नकारात्मक अर्थ देता है, पर वैकल्पिक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है; इससे व्यक्ति के नैतिक मूल्यांकन को आवश्यकता से अधिक सिद्धान्तगत नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तीमुथियुस’ यूनानी नाम का प्रचलित हिन्दी लिप्यंतरण है। वाक्य को दो भागों में बाँटकर मूल के विशेषणात्मक कृदंत को स्पष्ट और स्वाभाविक बनाया गया है।
