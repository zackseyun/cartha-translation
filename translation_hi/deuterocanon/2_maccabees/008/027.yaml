base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/027.yaml
  text: After they had collected their weapons and stripped the spoils from the enemies[a], they devoted themselves to the Sabbath, abundantly blessing and giving thanks to the Lord who had preserved them to this day[b], having appointed for them the beginning of mercy.
translation:
  language: hi
  text: फिर हथियार इकट्ठे कर लेने और शत्रुओं से लूट का माल ले लेने के बाद, वे सब्त के पालन में लग गए[a]। वे उस प्रभु की बहुत स्तुति करते और उसे धन्यवाद देते रहे, जिसने उन्हें इस दिन तक सुरक्षित रखा था और उनके लिए दया का आरम्भ ठहराया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सब्त से सम्बन्धित बातों में लग गए।” यूनानी अभिव्यक्ति मुहावरेदार है और इसका संकेत यह हो सकता है कि सब्त आने पर उन्होंने अपना ध्यान उसके पालन की ओर लगाया।
    reason: lexical_alternative
  - marker: b
    text: “दया का आरम्भ ठहराया” का अनुवाद “दया का आरम्भ प्रदान किया” या “दया का पहला चिह्न दिया” भी हो सकता है। यूनानी से यह भाव निकल सकता है कि इस छुटकारे ने परमेश्वर की दया के आरम्भ को चिह्नित किया।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁπλολογήσαντες δὲ αὐτοὺς
  choice: फिर हथियार इकट्ठे कर लेने
  rationale: क्रिया युद्ध के बाद हथियार बटोरने का भाव देती है। यूनानी सर्वनाम का संदर्भ स्पष्ट नहीं है, इसलिए हिन्दी में हथियारों के स्वामी को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: τὰ σκῦλα ἐκδύσαντες τῶν πολεμίων
  choice: शत्रुओं से लूट का माल उतार लेने के बाद
  rationale: ἐκδύσαντες में उतारने या वंचित करने का सजीव भाव है और σκῦλα युद्ध में प्राप्त लूट को दर्शाता है।
- source_word: περὶ τὸ σάββατον ἐγίνοντο
  choice: वे सब्त के पालन में लग गए
  rationale: मुहावरेदार यूनानी पदबंध का आशय सब्त के आने पर उसकी ओर ध्यान देकर उसका पालन करना है; किसी अनुल्लिखित विधि को नहीं जोड़ा गया।
- source_word: περισσῶς
  choice: बहुत
  rationale: यह आशीष देने और धन्यवाद करने की तीव्रता प्रकट करता है और साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εὐλογοῦντες καὶ ἐξομολογούμενοι
  choice: आशीष देते और धन्यवाद करते रहे
  rationale: पहली क्रिया का सीधा धार्मिक अर्थ रखा गया है; दूसरी क्रिया इस आराधनापूर्ण प्रसंग में कृतज्ञता व्यक्त करने को सूचित करती है।
- source_word: τῷ κυρίῳ
  choice: प्रभु को
  rationale: यहाँ κύριος इस्राएल के परमेश्वर के लिए प्रयुक्त है, इसलिए मानक बाइबलीय सम्बोधन 'प्रभु' उपयुक्त है।
- source_word: τῷ διασώζοντι εἰς τὴν ἡμέραν ταύτην
  choice: जिसने उन्हें उस दिन तक सुरक्षित रखा था
  rationale: यह प्रभु द्वारा उस निर्णायक दिन तक उन्हें बचाए और सुरक्षित रखे जाने का भाव व्यक्त करता है।
- source_word: ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: उनके लिए दया का आरम्भ ठहराया था
  rationale: 'शाब्दिक संरचना और उसका खुला धार्मिक अर्थ सुरक्षित रखा गया है: यह छुटकारा दया की शुरुआत है, आवश्यक रूप से उसकी पूर्णता नहीं।'
theological_decisions:
- issue: ἀρχὴν ἐλέους τάξαντος αὐτοῖς का धार्मिक आशय
  choice: विजय को उनके लिए प्रभु की दया का आरम्भ कहा गया है।
  alternative: इसे दया का पहला चिह्न या दया प्रदान करने की शुरुआत समझना।
  rationale: अनुवाद यह निश्चित नहीं करता कि पूर्ण पुनर्स्थापना हो चुकी थी; वह केवल इस छुटकारे को आरम्भिक दया के रूप में प्रस्तुत करने वाली यूनानी अभिव्यक्ति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सामान्य पाठक के लिए सुबोध शैली रखी गई है। लम्बे यूनानी वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है। 'सब्त', 'प्रभु' और 'दया' जैसे स्थापित बाइबलीय शब्द बनाए रखे गए हैं।
