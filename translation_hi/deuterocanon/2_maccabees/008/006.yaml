  text: And coming upon cities and countryside unexpectedly[a], he would set them on fire; and by seizing strategic places, he put not a few of the enemies to flight,
translation:
  language: hi
  text: वह नगरों और ग्रामीण क्षेत्रों पर अचानक आ पहुँचता और उन्हें आग लगा देता था; और सामरिक महत्त्व के स्थानों[a] पर अधिकार करके, वह बहुत-से शत्रुओं को खदेड़ देता था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लाभप्रद स्थानों”।
    reason: यूनानी ἐπικαίρους τόπους का अर्थ प्रसंग में सामरिक रूप से महत्त्वपूर्ण स्थान या अनुकूल/लाभप्रद स्थान हो सकता है।
lexical_decisions:
- source_word: πόλεις
  choice: नगरों
  rationale: यह शहरी बस्तियों के लिए सामान्य और गरिमापूर्ण हिन्दी शब्द है तथा χώρας के साथ शहरी-ग्रामीण विरोध को बनाए रखता है।
- source_word: χώρας
  choice: देहाती इलाकों
  rationale: यहाँ πόλεις के विपरीत ग्रामीण भूभाग अभिप्रेत है, राजनीतिक अर्थ में ‘देश’ नहीं।
- source_word: ἀπροσδοκήτως
  choice: अचानक
  rationale: यह बिना अपेक्षा या चेतावनी के पहुँचने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐρχόμενος
  choice: पहुँचकर
  rationale: कृदन्त रूप को अगले क्रियाकलाप से जोड़ता है; अपूर्ण भूतकाल के पुनरावृत्त भाव को ‘लगा देता था’ से व्यक्त किया गया है।
- source_word: ἐνεπίμπρα
  choice: आग लगा देता था
  rationale: क्रिया के सकर्मक अर्थ और यूनानी अपूर्ण भूतकाल में निहित बार-बार होने वाली कार्रवाई को स्पष्ट रखता है।
- source_word: ἐπικαίρους τόπους
  choice: सामरिक महत्त्व के स्थानों
  rationale: सैन्य प्रसंग में समयानुकूल, लाभप्रद या निर्णायक स्थानों का स्वाभाविक अर्थ देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἀπολαμβάνων
  choice: अधिकार करके
  rationale: स्थानों को अपने नियंत्रण में लेने का सैन्य भाव व्यक्त करता है।
- source_word: οὐκ ὀλίγους
  choice: बहुतों
  rationale: यूनानी अल्पोक्ति का आशय स्वाभाविक आधुनिक हिन्दी में देता है; शब्दशः ‘थोड़े नहीं’ यहाँ असहज होता।
- source_word: τῶν πολεμίων
  choice: शत्रुओं में से
  rationale: यूनानी बहुवचन और अंशवाचक संबंध दोनों को बनाए रखता है।
- source_word: τροπούμενος
  choice: खदेड़ देता था
  rationale: सैन्य प्रसंग में शत्रुओं को मुड़कर भागने पर विवश करने का भाव देता है और केवल सामान्य ‘हराने’ से अधिक विशिष्ट है।
