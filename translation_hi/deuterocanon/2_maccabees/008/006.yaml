  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘लगा देता था’ और ‘खदेड़ देता था’ यूनानी अपूर्ण भूतकाल के पुनरावृत्त क्रियाभाव को व्यक्त करते हैं। अंतिम अल्पविराम स्रोत में वाक्य के अगले पद तक जारी रहने का संकेत मानकर रखा गया है।
