  yaml_path: translation/deuterocanon/2_maccabees/008/024.yaml
  text: But with the Almighty as their ally, they slaughtered more than nine thousand of the enemy, and they wounded and maimed most of Nicanor’s army, and forced them all to flee.
translation:
  language: hi
  text: परन्तु सर्वशक्तिमान उनके सहयोद्धा थे, इसलिए उन्होंने शत्रुओं में से नौ हज़ार से अधिक को मार डाला और निकानोर की सेना के अधिकांश लोगों को घायल तथा अंगों से अशक्त कर दिया; और उन सबको भागने पर मजबूर कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह स्थापित और श्रद्धापूर्ण हिन्दी ईश्वरीय उपाधि है, जो समस्त सामर्थ्य रखने वाले का भाव स्वाभाविक रूप से व्यक्त करती है।
- source_word: συμμάχου
  choice: सहयोद्धा
  rationale: यह केवल सामान्य सहायता नहीं, बल्कि युद्ध में साथ देने वाले का सैनिक भाव सुरक्षित रखता है।
- source_word: κατέσφαξαν
  choice: मार डाला
  rationale: संदर्भ में यह बड़ी संख्या में हिंसक वध को सूचित करता है; ‘मार डाला’ आधुनिक हिन्दी में स्पष्ट और प्रबल है, जबकि अत्यधिक अनुष्ठानिक अर्थ से बचता है।
- source_word: ὑπὲρ τοὺς ἐννακισχιλίους
  choice: नौ हज़ार से अधिक
  rationale: संख्या से अधिक होने का अर्थ सीधे और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: τραυματίας
  choice: घायल
  rationale: यह युद्ध में चोट खाए लोगों के लिए मानक और सहज हिन्दी शब्द है।
- source_word: τοῖς μέλεσιν ἀπηρεῖς
  choice: अंगहीन
  rationale: यह अंगों को गंभीर क्षति पहुँचाकर उन्हें अक्षम कर देने का कठोर भाव संक्षेप में व्यक्त करता है।
- source_word: τὸ πλεῖον μέρος τῆς τοῦ Νικάνορος στρατειᾶς
  choice: निकानोर की सेना के अधिकांश लोग
  rationale: यूनानी वाक्यांश सेना के बहुसंख्यक सदस्यों की ओर संकेत करता है; व्यक्तियों को स्पष्ट करके हिन्दी वाक्य स्वाभाविक बनता है।
- source_word: πάντας δὲ φεύγειν ἠνάγκασαν
  choice: उन सबको भागने पर मजबूर कर दिया
  rationale: यह बाध्य किए जाने और उसके परिणामस्वरूप पलायन—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: युद्ध में सहायता के संदर्भ में παντοκράτωρ ईश्वरीय उपाधि का अनुवाद
  choice: सर्वशक्तिमान
  alternative: सर्वाधिपति
  rationale: ‘सर्वशक्तिमान’ परमेश्वर की सर्वोच्च सामर्थ्य को व्यक्त करने वाली प्रचलित, सम्मानपूर्ण हिन्दी उपाधि है और पाठ से परे कोई विशिष्ट साम्प्रदायिक व्याख्या नहीं जोड़ती।
- issue: परमेश्वर के लिए συμμάχος के सैनिक रूपक को बनाए रखना
  choice: सहयोद्धा
  alternative: सहायक
  rationale: मूल पाठ परमेश्वर को युद्ध में उनके साथ लड़ने वाले के रूप में प्रस्तुत करता है। सामान्य ‘सहायक’ इस तनावपूर्ण सैनिक बिंब को कमजोर कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, स्पष्ट और कथात्मक है। युद्ध की हिंसा को मूल के अनुरूप बिना नरम किए व्यक्त किया गया है। ‘परन्तु’ वाक्य को पिछले प्रसंग से जोड़ता है, और ‘सहयोद्धा’ मूल के सैनिक रूपक को बनाए रखता है।
