revisions:
- from: परन्तु जब सर्वशक्तिमान उनके सहयोद्धा हो गए, तब उन्होंने शत्रुओं में से नौ हज़ार से अधिक को मार डाला। उन्होंने निकानोर की सेना के अधिकांश लोगों को घायल और अंगहीन कर दिया और उन सबको भागने पर मजबूर कर दिया।
  to: परन्तु सर्वशक्तिमान उनके सहयोद्धा थे, इसलिए उन्होंने शत्रुओं में से नौ हज़ार से अधिक को मार डाला और निकानोर की सेना के अधिकांश लोगों को घायल तथा अंगों से अशक्त कर दिया; और उन सबको भागने पर मजबूर कर दिया।
  rationale: The revision removes the unwarranted implication that God only then became their ally and replaces an over-specific description of maiming with wording that reflects impairment of the limbs. It retains the grave battle register, the number, Nicanor’s army as the majority wounded and disabled, and the universal flight of the opposing force.
