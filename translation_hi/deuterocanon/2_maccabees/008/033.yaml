base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/033.yaml
  text: And while they were celebrating the victory in their homeland[a], they burned those who had set fire to the sacred gates, including Kallisthenes, who had fled into a certain house for shelter; and he received the reward worthy of his ungodliness.
translation:
  language: hi
  text: जब वे अपनी मातृभूमि में विजय-उत्सव मना रहे थे, तब उन्होंने पवित्र प्रवेश-द्वारों में आग लगानेवालों को और कल्लिस्थेनेस को भी जला दिया, जो शरण लेने के लिए एक निवास-स्थान में भाग गया था[a]; और उसने अपनी अधार्मिकता के योग्य प्रतिफल पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शरण लेने के लिए एक घर में।” यूनानी पद εἰς ἐνοίκιον असामान्य है, इसलिए उस स्थान का ठीक स्वरूप अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινίκια ... ἄγοντες
  choice: विजय का उत्सव मना रहे थे
  rationale: यह यूनानी मुहावरा युद्ध के बाद विजय-समारोह मनाने का भाव देता है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐν τῇ πατρίδι
  choice: अपनी मातृभूमि में
  rationale: πατρίς अपनी जन्मभूमि या देश को सूचित करता है; ‘अपनी मातृभूमि’ सामूहिक कर्ता के अनुरूप है।
- source_word: τοὺς ἐμπρήσαντας τοὺς ἱεροὺς πυλῶνας
  choice: पवित्र प्रवेश-द्वारों को आग लगानेवालों
  rationale: ἐμπρήσαντας आग लगाने की पूर्व घटना बताता है, और πυλῶνας केवल साधारण कपाटों की अपेक्षा प्रवेश-द्वार या द्वार-संरचनाओं का बोध कराता है। ‘पवित्र’ ἱερούς के धार्मिक अर्थ को बनाए रखता है।
- source_word: Καλλισθένην
  choice: कल्लिस्थेनेस
  rationale: नाम को यूनानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: ὑφήψαν
  choice: जला दिया
  rationale: क्रिया नीचे से आग सुलगाने या आग लगा देने का अर्थ रखती है। व्यक्तियों के कर्मवाच्य संदर्भ में ‘जला दिया’ हिन्दी में स्वाभाविक है और घातक दंड का प्रसंग स्पष्ट रखता है।
- source_word: εἰς ἐνοίκιον πεφευγότα
  choice: शरण लेने के लिए एक निवास में भाग गया था
  rationale: πεφευγότα का शरण के लिए भागना स्पष्ट है, पर ἐνοίκιον असामान्य है और उस स्थान का ठीक प्रकार अनिश्चित है। ‘एक निवास’ अनावश्यक वास्तु-विशेष जोड़े बिना अस्पष्टता बनाए रखता है।
- source_word: τὸν ἄξιον ... μισθόν
  choice: के योग्य प्रतिफल
  rationale: μισθός मूलतः मजदूरी, फल या प्रतिफल हो सकता है; न्याय के प्रसंग में ‘प्रतिफल’ विडंबनापूर्ण और दंडात्मक अर्थ व्यक्त करता है।
- source_word: δυσσεβείας
  choice: अधार्मिकता
  rationale: यह शब्द पवित्र बातों के प्रति अनादर और धार्मिक दुष्टता का बोध कराता है। ‘अधार्मिकता’ आधुनिक पाठक के लिए बोधगम्य है और नैतिक-धार्मिक निंदा को बनाए रखता है।
theological_decisions:
- issue: ἱεροὺς πυλῶνας का पवित्र-स्थान संबंधी अर्थ
  choice: पवित्र प्रवेश-द्वार
  alternative: मन्दिर के द्वार
  rationale: यूनानी विशेषण द्वारों को पवित्र क्षेत्र से संबद्ध करता है, पर इसी पद में ‘मन्दिर’ शब्द प्रत्यक्ष नहीं है। इसलिए अनावश्यक वास्तु-विशेष जोड़े बिना धार्मिक अर्थ सुरक्षित रखा गया है।
- issue: δυσσεβείας का नैतिक-धार्मिक अर्थ
  choice: अधार्मिकता
  alternative: भक्तिहीनता
  rationale: ‘अधार्मिकता’ पवित्रता के विरुद्ध अपराध और व्यापक नैतिक दुष्टता दोनों को समेटती है, जबकि ‘भक्तिहीनता’ अर्थ को केवल व्यक्तिगत भक्ति तक सीमित कर सकती है।
- issue: दंड को परिणाम की तरह व्यक्त करना
  choice: इस प्रकार उसने ... प्रतिफल पाया
  alternative: और उसने ... प्रतिफल पाया
  rationale: वाक्य दंड को उसकी अधार्मिकता का उचित फल घोषित करता है। ‘इस प्रकार’ उस संबंध को व्यक्त करता है, पर दैवी कर्तृत्व जैसा कोई अतिरिक्त दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। लंबे यूनानी वाक्य को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘प्रवेश-द्वार’ πυλών की संरचनात्मक छाया को व्यक्त करता है, और कठिन पद ἐνοίκιον की अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
