base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/011.yaml
  text: So he immediately sent to the cities along the coast[a], inviting them to buy Jewish bodies, promising to hand over ninety bodies for a talent[b]; but he did not expect the punishment from the Almighty that was about to come upon him.
translation:
  language: hi
  text: तब उसने तुरंत समुद्र-तट के नगरों में संदेश भेजकर वहाँ के लोगों को यहूदियों की देहें[a] खरीदने के लिए बुलाया और एक तोड़े के बदले नब्बे देहें सौंप देने का वादा किया; पर उसने उस दण्ड[b] की अपेक्षा नहीं की जो सर्वशक्तिमान की ओर से उस पर आने वाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “यहूदियों की देहें” है। यहाँ आशय उन यहूदी बंदियों से है जिन्हें बिकाऊ वस्तु, अर्थात् दासों के समान, माना गया था; कुछ अनुवाद “व्यक्तियों” या “दासों” कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “उस न्याय की, जो सर्वशक्तिमान की ओर से उसे आ घेरने वाला था।” यूनानी शब्द न्याय के कार्य और उससे मिलने वाले दण्ड—दोनों का अर्थ दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: παραθαλασσίους πόλεις
  choice: समुद्र-तट के नगरों
  rationale: यूनानी विशेषण का अर्थ समुद्र के पास स्थित या तटीय है। यह रूप आधुनिक हिन्दी में स्पष्ट और स्रोत के निकट है।
- source_word: προκαλούμενος ἐπʼ ἀγορασμόν
  choice: खरीदने के लिए बुलाया
  rationale: सन्दर्भ में संभावित खरीदारों को व्यापारिक प्रस्ताव दिया जा रहा है; यह अनुवाद आमन्त्रण और खरीद—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: Ἰουδαίων σωμάτων
  choice: यहूदी देहों
  rationale: मूल में शाब्दिक रूप से ‘यहूदियों की देहें’ है। ‘देहों’ से मनुष्यों को बिकाऊ वस्तु मानने वाली कठोर और अमानवीय भाषा बनी रहती है; ‘दासों’ कहना आशय को स्पष्ट तो करता, पर वह मूल में प्रत्यक्ष नहीं है।
- source_word: ἐνενήκοντα σώματα ταλάντου παραχωρήσειν
  choice: एक तोड़े में नब्बे देहें सौंप देने
  rationale: यह वाक्यांश एक व्यापारिक दर बताता है—एक टैलेंट के बदले नब्बे बंदी। बाइबलीय हिन्दी में मुद्रा/भार के लिए परिचित ‘तोड़ा’ रखा गया है और παραχωρεῖν के लिए ‘सौंप देना’ उपयुक्त है।
- source_word: οὐ προσδεχόμενος
  choice: उसने ... आशा नहीं की
  rationale: यहाँ भाव है कि उसने आनेवाले परिणाम की प्रतीक्षा या अपेक्षा नहीं की और उसे अपने हिसाब में नहीं लिया। ‘आशा नहीं की’ स्रोत की अपेक्षा-संबंधी अभिव्यक्ति को सहज हिन्दी में देता है।
- source_word: δίκην
  choice: दण्ड
  rationale: δίκη न्याय, न्यायिक प्रतिफल या दण्ड सूचित कर सकता है। प्रसंग में आसन्न ईश्वरीय प्रतिकार के परिणाम के रूप में ‘दण्ड’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῦ παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह παντοκράτωρ का प्रचलित, गरिमापूर्ण हिन्दी दैवी शीर्षक है और परमेश्वर की सर्वाधिकारयुक्त सामर्थ्य को व्यक्त करता है।
- source_word: μέλλουσαν παρακολουθήσειν αὐτῷ
  choice: जो ... उस पर आनेवाला था
  rationale: मूल में उसके पीछे लगकर आ पहुँचने या उसे आ घेरने का भाव है। ‘उस पर आनेवाला था’ आसन्न परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: παντοκράτωρ दैवी शीर्षक
  choice: सर्वशक्तिमान
  alternative: सब पर शासन करनेवाला
  rationale: ‘सर्वशक्तिमान’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और किसी अतिरिक्त साम्प्रदायिक व्याख्या के बिना परमेश्वर की सार्वभौम सामर्थ्य व्यक्त करता है।
- issue: σώματα की अमानवीय व्यापारिक भाषा
  choice: देहों
  alternative: व्यक्तियों / दासों
  rationale: ‘व्यक्तियों’ से मूल की वस्तुकरण करने वाली कठोरता कम हो जाती, जबकि ‘दासों’ से निहित आशय पाठ में प्रत्यक्ष रूप से जोड़ दिया जाता। ‘देहों’ मूल का तनाव सुरक्षित रखता है।
- issue: δίκη का न्याय अथवा दण्ड अर्थ
  choice: मुख्य पाठ में ‘दण्ड’
  alternative: ‘न्याय’
  rationale: कथा-सन्दर्भ में आनेवाला ईश्वरीय प्रतिफल दण्ड के रूप में सामने आता है, पर यूनानी शब्द की न्याय-संबंधी व्यापकता वास्तविक है; इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर कथा की गरिमा और मूल की कठोर व्यापारिक छवि बनाए रखी गई है। ‘देहों’ जानबूझकर असहज रखा गया है ताकि बंदियों के अमानवीय वस्तुकरण को नरम न किया जाए। ‘तोड़ा’ हिन्दी बाइबलीय पाठकों के लिए टैलेंट का परिचित नाम है; वाक्य को सहज बनाने के लिए दर का अर्थ ‘एक तोड़े में’ से स्पष्ट किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
