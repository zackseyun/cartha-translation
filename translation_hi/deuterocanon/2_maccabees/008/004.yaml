base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/004.yaml
  text: and also to remember the lawless destruction of the innocent infants[a], and the blasphemies committed against his name[b], and to hate evil.
translation:
  language: hi
  text: और यह भी कि वह निर्दोष शिशुओं[a] के अन्यायपूर्ण विनाश और अपने नाम के विरुद्ध की गई निन्दाओं को स्मरण करे, और बुराई से घृणा करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पापरहित शिशुओं’। यूनानी विशेषण का शाब्दिक अर्थ ‘पापरहित’ है, पर यहाँ सम्भवतः पीड़ितों के निर्दोष होने पर बल है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दुष्टता से घोर घृणा करे’। यूनानी क्रिया दुर्लभ है और बुराई के प्रति प्रबल विरोध व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: स्मरण करे
  rationale: यह प्रार्थनात्मक क्रम में प्रयुक्त अनन्त क्रिया है। ‘स्मरण करे’ मूल अर्थ और गरिमापूर्ण शैली, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀναμαρτήτων
  choice: निर्दोष
  rationale: शाब्दिक अर्थ ‘पापरहित’ है, पर मारे गए शिशुओं के संदर्भ में यह उनके निरपराध होने पर बल देता है; ‘निर्दोष’ अनावश्यक धर्मसैद्धान्तिक निष्कर्ष से बचता है।
- source_word: νηπίων
  choice: शिशुओं
  rationale: यह शब्द बहुत छोटे बच्चों को सूचित करता है; ‘शिशुओं’ में आयु और प्रसंग की करुणा दोनों सुरक्षित हैं।
- source_word: παρανόμου
  choice: अन्यायपूर्ण
  rationale: मूल शब्द व्यवस्था और न्याय के उल्लंघन को व्यक्त करता है। ‘अन्यायपूर्ण’ आधुनिक हिन्दी में स्वाभाविक है और ‘अवैध’ की संकीर्ण कानूनी ध्वनि से बचता है।
- source_word: ἀπωλίας
  choice: विनाश
  rationale: संज्ञा का मूल अर्थ विनाश या नाश है। संदर्भ में मृत्यु निहित है, फिर भी ‘विनाश’ यूनानी की अपेक्षा अधिक विशिष्ट ‘संहार’ आरोपित नहीं करता।
- source_word: βλασφημιῶν
  choice: निन्दाओं
  rationale: क्योंकि ये उसके नाम के विरुद्ध हैं, ‘निन्दाओं’ में परमेश्वर-विरोधी अपमान का धार्मिक भार बना रहता है।
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: अपने नाम के विरुद्ध
  rationale: विरोधी प्रसंग में εἰς का लक्ष्य-वाचक भाव ‘के विरुद्ध’ से स्पष्ट होता है। infinitive के निहित कर्ता की ओर लौटने के कारण हिन्दी में ‘अपने’ स्वाभाविक है।
- source_word: μισοπνηρῆσαι
  choice: बुराई से घृणा करे
  rationale: यह दुर्लभ क्रिया बुराई या दुष्टता के प्रति प्रबल विरोध व्यक्त करती है। सीधा अनुवाद अर्थ को स्पष्ट रखता है और संभावित आरम्भसूचक भाव को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: हत्या किए गए बच्चों के लिए ἀναμαρτήτων का अनुवाद
  choice: निर्दोष शिशु
  alternative: पापरहित शिशु
  rationale: यूनानी विशेषण का शाब्दिक अर्थ ‘पापरहित’ है, लेकिन यहाँ उसका कथात्मक बल पीड़ितों की निरपराधता पर है। ‘निर्दोष’ बाद की धर्मसैद्धान्तिक बहस को पाठ में आरोपित किए बिना मूल नैतिक बल बचाता है।
- issue: μισοπνηρῆσαι में घृणा का लक्ष्य
  choice: बुराई से घृणा करे
  alternative: दुष्टता से घोर घृणा करे
  rationale: दुर्लभ यूनानी क्रिया बुराई के प्रति तीव्र विरोध प्रकट करती है। मुख्य पाठ में सरल व्यापक शब्द रखा गया है और तीव्रता की सम्भावना पादटिप्पणी में दर्शाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक वाक्य-विन्यास रखा गया है। पद पिछले प्रसंग की infinitive-श्रृंखला का अंश है; इसलिए ‘और यह भी कि वह…’ से हिन्दी में उसकी आश्रित संरचना स्वाभाविक बनाई गई है। ‘निन्दा’, ‘स्मरण’ और ‘घृणा’ सामान्य पाठक के लिए बोधगम्य रहते हुए धार्मिक प्रसंग की गंभीरता बनाए रखते हैं।
