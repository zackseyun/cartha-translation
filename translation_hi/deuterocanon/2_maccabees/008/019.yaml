  yaml_path: translation/deuterocanon/2_maccabees/008/019.yaml
  text: And he also recounted to them the help that had come to their forefathers[a], and the one against Sennacherib[b], how a hundred eighty-five thousand were destroyed.
translation:
  language: hi
  text: और उसने उन्हें उनके पूर्वजों को मिली सहायता[a] और सनहेरीब के विरुद्ध मिली सहायता[b] का भी स्मरण कराया—कि कैसे एक लाख पचासी हज़ार नष्ट हो गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुटकारों”; यूनानी शब्द संकट में दी गई सहायता, सहारा या बचाव के कार्यों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह सनहेरीब की सेना के विनाश की ओर संकेत है; देखें 2 राजा 19:35 और यशायाह 37:36।
    reason: cross_reference
lexical_decisions:
- source_word: προσαναλεξάμενος
  choice: स्मरण कराया
  rationale: यह कृदंत यह बताता है कि उसने बीती घटनाओं का उल्लेख करके अपने लोगों को उनकी याद दिलाई। ‘स्मरण कराया’ आधुनिक हिन्दी में स्वाभाविक है और मौखिक रूप से पुरानी घटनाएँ दोहराने का भाव रखता है।
- source_word: ἀντιλήμψεις
  choice: सहायता
  rationale: यह शब्द संकट में मिली सहायता या सहारे के कार्यों को दर्शाता है। ‘सहायता’ व्यापक और सहज है; ‘छुटकारे’ भी संभव है, पर वह परिणाम को अधिक स्पष्ट करके मूल की व्यापकता घटा सकता है।
- source_word: ἐπὶ τῶν προγόνων γενομένας
  choice: उनके पूर्वजों को मिली
  rationale: यह वाक्यांश पूर्वजों के संबंध में घटित सहायता को व्यक्त करता है। हिन्दी में ‘पूर्वजों को मिली’ स्वाभाविक ढंग से उनके द्वारा अनुभव की गई सहायता बताता है, बिना उसके कर्ता को मूल से अधिक स्पष्ट किए।
- source_word: τὴν ἐπὶ Σεναχηρεὶμ
  choice: सनहेरीब के विरुद्ध मिली सहायता
  rationale: यूनानी में लेख पूर्वोक्त ‘सहायता’ को अध्याहृत रूप से दोहराता है। हिन्दी में संज्ञा को दोहराने से आशय स्पष्ट और वाक्य सहज रहता है।
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδες
  choice: एक लाख पचासी हज़ार
  rationale: यह 185,000 का भारतीय संख्या-पद्धति के अनुसार स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ὡς ἀπώλοντο
  choice: कि कैसे ... नष्ट हो गए थे
  rationale: ὡς यहाँ स्मरण कराई गई घटना की विषयवस्तु प्रस्तुत करता है। ‘नष्ट हो गए थे’ सैन्य विनाश के संदर्भ के अनुकूल है और मूल में कर्ता के अनुल्लेख को बनाए रखता है।
theological_decisions:
- issue: पूर्वजों की सहायता और सनहेरीब की सेना के विनाश में निहित ईश्वरीय कर्तृत्व
  choice: मुख्य पाठ में परमेश्वर को स्पष्ट कर्ता के रूप में नहीं जोड़ा गया।
  alternative: ‘परमेश्वर ने उनके पूर्वजों की सहायता की’ और ‘परमेश्वर ने एक लाख पचासी हज़ार को नष्ट किया’ कहना।
  rationale: संदर्भ प्रसिद्ध ईश्वरीय छुटकारे की घटना की ओर संकेत करता है, पर इस उपवाक्य के यूनानी पाठ में परमेश्वर का नाम स्पष्ट रूप से नहीं है। इसलिए अनुवाद ऐतिहासिक और धर्मवैज्ञानिक संकेत को बनाए रखते हुए मूल से अतिरिक्त कर्ता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘सनहेरीब’ प्रचलित हिन्दी बाइबलीय नामरूप है। संख्या भारतीय पद्धति में लिखी गई है। मूल के निष्क्रिय/अकर्मक कथन को बनाए रखते हुए विनाश का कर्ता मुख्य पाठ में नहीं जोड़ा गया।
