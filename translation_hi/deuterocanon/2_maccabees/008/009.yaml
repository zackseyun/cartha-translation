base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/009.yaml
  text: But he quickly selected Nicanor son of Patroclus[a], one of his chief Friends, and sent him, having assigned to him no fewer than twenty thousand from the nations of every tribe to wipe out the whole Jewish people. They also appointed with him Gorgias, a military man experienced in matters of war[c][b],
translation:
  language: hi
  text: पर उसने तुरंत पात्रोक्लुस के पुत्र नीकानोर को चुना, जो प्रमुख “मित्रों” में से एक था[a], और विभिन्न जातियों के कम से कम बीस हजार लोगों को उसकी कमान में सौंपकर[b] उसे पूरे यहूदी जनसमुदाय को जड़ से मिटा देने के लिए भेजा[c]। उन्होंने उसके साथ गोर्गियास को भी नियुक्त किया, जो सेनापति था और युद्ध-संबंधी मामलों में बहुत अनुभवी था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रमुख मित्र” सम्भवतः राजदरबार की एक उपाधि थी, जिसका अर्थ केवल निजी मित्र नहीं, बल्कि राजा का कोई उच्च पदस्थ सहयोगी था।
    reason: lexical_alternative
  - marker: b
    text: यहाँ का यूनानी पदबंध असामान्य है; इसका अर्थ विभिन्न जातियों से बना मिश्रित सैन्यबल या हर प्रकार के लोगों में से लिए गए सैनिक हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “यहूदिया के पूरे जनसमुदाय को जड़ से मिटा देने” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: προχειρισάμενος
  choice: चुना
  rationale: यह कृदंत किसी काम के लिए चुनने या नियुक्त करने का भाव रखता है; “चुना” आधुनिक हिन्दी में सहज है और प्रसंग में दायित्व सौंपे जाने का अर्थ स्पष्ट रहता है।
- source_word: τῶν πρώτων φίλων
  choice: प्रमुख “मित्रों” में से एक
  rationale: हेलेनिस्टिक राजदरबार में φίλοι उच्च पदस्थ राजकीय सहयोगियों की उपाधि हो सकती थी। उद्धरण-चिह्न और पाद-टिप्पणी साधारण निजी मित्रता से अलग इस सम्भावित पदनाम को संकेत करते हैं।
- source_word: ὑποτάξας
  choice: उसके अधीन करके
  rationale: यहाँ आशय सैन्यबल को नीकानोर के अधिकार या कमान के नीचे रखने का है।
- source_word: παμφύλων ἔθνη
  choice: हर प्रकार की जातियों में से ... लोगों
  rationale: असामान्य यूनानी पदबंध विविध जातीय समूहों अथवा मिश्रित जनों का संकेत दे सकता है। यह चयन उसकी व्यापकता को रखता है, जबकि अनिश्चितता पाद-टिप्पणी में बताई गई है।
- source_word: οὐκ ἐλάττους τῶν δισμυρίων
  choice: कम-से-कम बीस हजार
  rationale: यह “बीस हजार से कम नहीं” का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: τὸ πᾶν τῆς Ἰουδαίας ἐξᾶραι γένος
  choice: यहूदिया के पूरे जनसमुदाय को जड़ से मिटा देने
  rationale: ἐξᾶραι पूर्ण उन्मूलन का कठोर भाव रखता है; γένος यहाँ सामूहिक जातीय-राष्ट्रीय समुदाय को दर्शाता है। “जनसमुदाय” आधुनिक जैविक ‘नस्ल’ का भ्रामक भाव नहीं लाता और “यहूदिया” के संबंध को भी बनाए रखता है।
- source_word: συνέστησαν δὲ αὐτῷ καὶ Γοργίαν
  choice: उन्होंने उसके साथ गोर्गियास को भी नियुक्त किया
  rationale: क्रिया गोर्गियास को नीकानोर के साथ जोड़कर नियुक्त करने का भाव व्यक्त करती है; बहुवचन कर्ता को यूनानी की तरह अनिर्दिष्ट रखा गया है।
- source_word: ἄνδρα στρατηγὸν καὶ εὖ πολεμικαῖς χρείαις ἔχοντα πεῖραν
  choice: जो एक सेनापति और युद्ध के कामों में भली-भाँति अनुभवी व्यक्ति था
  rationale: यह रूप गोर्गियास की सैन्य पद-भूमिका और उसके व्यावहारिक युद्ध-अनुभव, दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: जातीय-राष्ट्रीय संदर्भ में γένος का अनुवाद
  choice: जनसमुदाय
  alternative: जाति; वंश; यहूदी लोग
  rationale: यहाँ पूरे लोगों के सुनियोजित उन्मूलन की बात है। “जनसमुदाय” सामूहिक पहचान को सुरक्षित रखता है, पर आधुनिक हिन्दी में “नस्ल” से जुड़ी जैविक धारणाएँ नहीं जोड़ता।
- issue: τῆς Ἰουδαίας के संबंध की व्याख्या
  choice: यहूदिया के पूरे जनसमुदाय
  alternative: पूरे यहूदी समुदाय
  rationale: यूनानी पाठ में संज्ञा “यहूदिया” है; मुख्य पाठ में उसे बनाए रखने से भौगोलिक और जन-संबंधी सम्भावना को समय से पहले केवल एक अर्थ में सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। सैन्य और राजदरबारी भाषा को सामान्य पाठक के लिए स्पष्ट बनाया गया है, और जहाँ यूनानी पाठ असामान्य या अर्थगत रूप से खुला है वहाँ पाद-टिप्पणियों द्वारा विकल्प सुरक्षित रखे गए हैं।
