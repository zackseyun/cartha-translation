base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/023.yaml
  text: He also brought Eleazar[a], and after bringing forward the holy book and giving the watchword[b], “God’s Help,” he himself led the first company and engaged Nicanor.
translation:
  language: hi
  text: उसने एलीआज़र को भी आगे बुलाया[a]। फिर पवित्र पुस्तक सामने लाकर और “परमेश्वर की सहायता” का युद्ध-संकेत देकर[b], वह स्वयं पहली सैन्य टुकड़ी के आगे चलकर निकानोर से युद्ध में भिड़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक यूनानी खंड में क्रिया व्यक्त नहीं है। संदर्भ के अनुसार कर्ता यहूदा है; एलीआज़र के संबंध में 'आगे बुलाया' क्रिया निहित समझी गई है।
    reason: referent_clarification
  - marker: b
    text: या “कूटशब्द, ‘परमेश्वर की सहायता’” या “संकेत, ‘परमेश्वर सहायता है।’” यूनानी अभिव्यक्ति संक्षिप्त है और एक से अधिक प्रकार से समझी जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγαγὼν
  choice: आगे बुलाया / सामने लाकर
  rationale: यूनानी पाठ में यही क्रिया पहले एलीआज़र और फिर पवित्र पुस्तक के संबंध में समझी जाती है। प्रसंग में ‘आगे बुलाया’ व्यक्ति के लिए और ‘सामने लाकर’ पुस्तक के लिए स्वाभाविक हिन्दी है, तथा युद्ध-पूर्व सार्वजनिक प्रस्तुति का भाव रखती है।
- source_word: τὴν ἱερὰν βίβλον
  choice: पवित्र पुस्तक
  rationale: βίβλος पुस्तक या ग्रंथ को सूचित करता है; उसे ‘पुस्तक’ कहना स्पष्ट है और भौतिक रूप को अनावश्यक रूप से ‘पुस्तक-पत्र’ या ‘लपेटा हुआ ग्रंथ’ निश्चित नहीं करता।
- source_word: σύνθημα
  choice: युद्ध-संकेत
  rationale: सैनिक प्रसंग में शब्द किसी पहले से ठहराए हुए संकेत, पहचान-वचन या नारे को सूचित कर सकता है। ‘युद्ध-संकेत’ आधुनिक पाठक को उसका सैनिक कार्य स्पष्ट करता है, जबकि पादटिप्पणी अन्य संभावनाएँ सुरक्षित रखती है।
- source_word: θεοῦ Βοηθείας
  choice: परमेश्वर की सहायता
  rationale: संक्षिप्त यूनानी पदबंध को संकेत-वाक्य की विषयवस्तु के रूप में रखा गया है। हिन्दी में यह स्वाभाविक है और संबंधकारक संरचना को सुरक्षित रखता है।
- source_word: τῆς πρώτης σπείρης
  choice: पहली सैन्य टुकड़ी
  rationale: σπεῖρα एक सैन्य दल या इकाई है। ‘सैन्य टुकड़ी’ अर्थ स्पष्ट करती है और ‘कोहोर्ट’ कहकर रोमी सैन्य संगठन को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: προηγούμενος
  choice: आगे चलकर
  rationale: यह केवल नेतृत्व नहीं, स्वयं सामने रहकर नेतृत्व करने का भाव देता है।
- source_word: συνέβαλε τῷ Νικάνορι
  choice: निकानोर से युद्ध में भिड़ गया
  rationale: सैनिक मुहावरे का अर्थ युद्ध में आमना-सामना करना या भिड़ना है। यह ‘आक्रमण किया’ की अपेक्षा कम एकपक्षीय और साधारण हिन्दी में अधिक स्पष्ट है।
theological_decisions:
- issue: क्रियाओं और कृदंतों का निहित कर्ता
  choice: पूर्व प्रसंग से यहूदा को निहित कर्ता माना गया है; एलीआज़र कर्म है।
  alternative: एलीआज़र को बाद की कुछ क्रियाओं का कर्ता समझना।
  rationale: Ἐλεάζαρον कर्मकारक में है, जबकि कृदंत-श्रृंखला और मुख्य क्रिया स्वाभाविक रूप से पूर्ववर्ती कथानक के कर्ता यहूदा को आगे बढ़ाती हैं। फिर भी पद में उसका नाम दोहराकर नहीं जोड़ा गया, जिससे अनुवाद मूल की निहितता बनाए रखे।
- issue: θεοῦ Βοηθείας की संक्षिप्त संरचना
  choice: संकेत-वाक्य के रूप में “परमेश्वर की सहायता।”
  alternative: “परमेश्वर सहायता है” या “परमेश्वर से सहायता।”
  rationale: यूनानी अभिव्यक्ति संक्षिप्त है और एक से अधिक प्रकार से समझी जा सकती है; मुख्य पाठ में स्वाभाविक संबंधकारक रूप चुना गया और विकल्प पादटिप्पणी में रखे गए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘युद्ध-संकेत’ तथा ‘सैन्य टुकड़ी’ सामान्य पाठक के लिए स्पष्ट हैं; अनावश्यक रूप से तकनीकी या रोमी शब्दावली से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
