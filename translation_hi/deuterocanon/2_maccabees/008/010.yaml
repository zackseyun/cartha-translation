  text: But Nikanor undertook to pay to the king the tribute owed to the Romans[a], amounting to two thousand talents[b], from the captivity of the Jews.
translation:
  language: hi
  text: परन्तु निकानोर ने अपने ऊपर यह ज़िम्मेदारी ली कि वह यहूदियों को बंदी बनाकर राजा की रोमियों को देय दो हज़ार किक्कार की कर-राशि[a] चुका देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “राजा को, रोमियों के लिए, कर-राशि।” यूनानी वाक्य संक्षिप्त है; सम्भवतः आशय यह है कि निकानोर यहूदियों को बंदी बनाकर राजा का रोमियों के प्रति दायित्व पूरा करना चाहता था।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιωτεύσατο
  choice: अपने ऊपर यह ज़िम्मेदारी ली
  rationale: यह पद निकानोर द्वारा व्यक्तिगत रूप से दायित्व उठाने का भाव देता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: φόρον
  choice: कर-राशि
  rationale: यहाँ φόρος किसी अधीन राजनीतिक सत्ता द्वारा श्रेष्ठ सत्ता को दिए जानेवाले कर या राजस्व को सूचित करता है; ‘कर-राशि’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: τῷ βασιλεῖ … τοῖς Ῥωμαίοις
  choice: राजा की रोमियों को देय
  rationale: यूनानी वाक्यांश संक्षिप्त है। प्रसंगानुसार यह राजा की ओर से रोमियों को दिए जानेवाले कर को सूचित करता है; पादटिप्पणी अधिक शाब्दिक विन्यास बताती है।
- source_word: τάλαντων δισχιλίων
  choice: दो हज़ार किक्कार
  rationale: प्राचीन भार एवं मुद्रा-मान को आधुनिक रकम में अनुमानित रूप से बदलने के बजाय पारंपरिक हिन्दी बाइबलीय पद ‘किक्कार’ रखा गया है।
- source_word: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας
  choice: यहूदियों को बंदी बनाकर मिलनेवाले धन से
  rationale: वाक्यांश धन के नियोजित स्रोत को बताता है—यहूदियों को पकड़कर उनकी बिक्री या छुड़ौती से लाभ उठाना। यह अनुवाद केवल अमूर्त ‘बंदी अवस्था’ कहने की अपेक्षा आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐκπληρώσειν
  choice: चुका देगा
  rationale: वित्तीय प्रसंग में क्रिया किसी दायित्व को पूरा करने अथवा रकम अदा करने का अर्थ देती है; ‘चुका देगा’ उपयुक्त और सहज है।
theological_decisions:
- issue: τοῖς ις Ῥωμαίοις का सम्बन्ध
  choice: कर-राशि को राजा की ओर से रोमियों को देय समझा गया है।
  alternative: 'अधिक शाब्दिक रूप: ‘राजा को, रोमियों के लिए, कर-राशि।’'
  rationale: यूनानी पाठ का विन्यास संक्षिप्त और कुछ अस्पष्ट है, पर प्रसंग निकानोर द्वारा यहूदी बंदियों से धन जुटाकर राजा के रोमी दायित्व को पूरा करने की योजना की ओर संकेत करता है। मुख्य पाठ में सम्भावित आशय स्पष्ट किया गया है और वास्तविक भाषिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। यूनानी पाठ के क्रूर आर्थिक आशय को नरम नहीं किया गया है। ‘किक्कार’ प्राचीन मान को बनाए रखता है; अनिश्चित आधुनिक मुद्रा-समतुल्य नहीं जोड़ा गया।
