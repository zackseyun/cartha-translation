  text: having appointed his brothers to lead each division[a], Simon and Joseph and Jonathan, assigning to each one a thousand men in addition to five hundred,
translation:
  language: hi
  text: उसने अपने भाइयों—शमौन, यूसुफ़ और योनातान—को एक-एक दल का अगुआ ठहराया और हर एक के अधीन पाँच सौ के अतिरिक्त एक हज़ार सैनिक रखे,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, हर अगुए के अधीन कुल 1,500 सैनिक।
    reason: मूल यूनानी की ‘पाँच सौ के अतिरिक्त एक हज़ार’ वाली योगात्मक अभिव्यक्ति का संख्यात्मक आशय स्पष्ट करना।
lexical_decisions:
- source_word: τάξας
  choice: ठहराया
  rationale: यह क्रिया सैन्य व्यवस्था में व्यक्तियों को निश्चित नेतृत्व-भूमिका सौंपने का भाव देती है; ‘ठहराया’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀδελφοὺς αὐτοῦ
  choice: अपने भाइयों
  rationale: मूल यूनानी का सीधा पारिवारिक अर्थ ‘भाइयों’ है; इसे व्यापक ‘सम्बन्धियों’ में बदलने का कोई संदर्भगत कारण नहीं है।
- source_word: προηγουμένους
  choice: अगुआ
  rationale: शाब्दिक अर्थ ‘आगे चलनेवाले’ है, पर सैन्य संदर्भ में यह दल का नेतृत्व करने को दर्शाता है।
- source_word: ἑκάτερας τάξεως
  choice: एक-एक दल का
  rationale: τάξις यहाँ व्यवस्थित सैन्य टुकड़ी या दल है। वितरण का भाव हिन्दी के ‘एक-एक दल’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ὑποτάξας ἑκάστῳ
  choice: हर एक के अधीन ... रखे
  rationale: यह वाक्यांश सैनिकों को प्रत्येक अगुए की कमान के अधीन रखने का सैन्य भाव स्पष्ट करता है और यूनानी संरचना के निकट भी रहता है।
- source_word: χιλίους πρὸς τοῖς πεντακοσίοις
  choice: पाँच सौ के अतिरिक्त एक हज़ार सैनिक
  rationale: मूल की योगात्मक अभिव्यक्ति को बनाए रखा गया है; आशय प्रत्येक अगुए के अधीन कुल 1,500 सैनिकों से है। ‘सैनिक’ संदर्भ से स्पष्ट पूर्ति है।
