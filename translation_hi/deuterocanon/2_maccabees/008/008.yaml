  yaml_path: translation/deuterocanon/2_maccabees/008/008.yaml
  text: But when Philip saw that the man was gradually making progress and advancing all the more often in successes, he wrote to Ptolemy, the governor of Coele-Syria and Phoenicia, to come to the aid of the king’s cause.
translation:
  language: hi
  text: पर जब फ़िलिप्पुस ने देखा कि वह व्यक्ति[a] धीरे-धीरे प्रगति कर रहा था और उसे पहले से अधिक बार सफलता मिल रही थी, तो उसने कोइले-सीरिया और फ़िनीके के राज्यपाल टॉलेमी को लिखा कि वह राजा के पक्ष[b] का साथ देने के लिए आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् यहूदा मकाबी, जिसकी चर्चा आस-पास के प्रसंग में हो रही है।
    reason: cross_reference
  - marker: b
    text: या “राजा के हितों” अथवा “राजा के मामले”। यूनानी अभिव्यक्ति केवल किसी एक सैनिक कार्रवाई से अधिक व्यापक राजकीय उद्देश्य को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδὼν
  choice: जब ... ने देखा
  rationale: कृदंत फ़िलिप्पुस की अगली कार्रवाई का कारण बताता है; ‘देखा’ यहाँ ध्यान देने या समझ लेने का स्वाभाविक हिन्दी रूप है।
- source_word: κατὰ μικρὸν
  choice: धीरे-धीरे
  rationale: यह मुहावरा क्रमिक प्रगति व्यक्त करता है।
- source_word: εἰς προκοπὴν ἐρχόμενον
  choice: उन्नति कर रहा है
  rationale: वाक्यांश आगे बढ़ने और प्रभाव बढ़ने की अवस्था बताता है; यह केवल आर्थिक समृद्धि तक सीमित नहीं है।
- source_word: τὸν ἄνδρα
  choice: वह पुरुष
  rationale: यूनानी में स्पष्ट रूप से ‘उस/वह पुरुष’ है और संदर्भ यहूदा मकाबी की ओर संकेत करता है; नाम को मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: πυκνότερον ... ἐν ταῖς εὐημερίαις προβαίνοντα
  choice: उसकी सफलताएँ लगातार बढ़ती जा रही हैं
  rationale: इस कठिन अभिव्यक्ति में बढ़ती नियमितता या घनत्व के साथ अनुकूल परिणामों में आगे बढ़ने का भाव है। स्वाभाविक हिन्दी में यह बढ़ती और बार-बार मिलने वाली सफलता का संकेत देता है, बिना उसे केवल तीव्रता मानकर सीमित किए।
- source_word: στρατηγὸν
  choice: राज्यपाल
  rationale: यहाँ पद कोइले-सीरिया और फ़िनीके पर टॉलेमी के प्रशासनिक-सैन्य अधिकार को दर्शाता है; ‘राज्यपाल’ सामान्य हिन्दी पाठक के लिए सबसे स्पष्ट है।
- source_word: ἐπιβοηθεῖν
  choice: सहायता के लिए आए
  rationale: संयुक्त क्रिया सहायता देने के लिए आगे आने का दिशात्मक भाव रखती है।
- source_word: τοῖς τοῦ βασιλέως πράγματι
  choice: राजा के पक्ष
  rationale: यह वाक्यांश इस संघर्ष में राजा के व्यापक हित, मामले या उद्देश्य को सूचित करता है; ‘पक्ष’ राजनीतिक-सैन्य संदर्भ के अनुकूल है और विकल्प पादटिप्पणी में दिए गए हैं।
