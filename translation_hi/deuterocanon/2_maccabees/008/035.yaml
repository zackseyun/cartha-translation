base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/035.yaml
  text: Having been humbled by those who were thought to be the least among his own[a], and by the Lord’s help having laid aside his splendid robe, he made himself like a fugitive, traveling through the inland country in isolation and came to Antioch[c][b], having prospered beyond all expectation in the destruction of his army.
translation:
  language: hi
  text: 35 प्रभु की सहायता से वह उन लोगों के द्वारा नीचा किया गया, जो उसके अपने लोगों में सबसे तुच्छ माने जाते थे। फिर वह अपना वैभवशाली वस्त्र उतारकर, भगोड़े की तरह अकेला भीतरी भूभाग से होता हुआ अन्ताकिया पहुँचा, अपनी सेना के विनाश में हद से बढ़कर सफल हुआ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ जानबूझकर विडंबना है: उसकी ‘सफलता’ वास्तव में उसकी अपनी सेना के विनाश से संबंधित थी।'
    reason: literary_irony
lexical_decisions:
- source_word: ταπεινωθεὶς ὑπὸ τῶν καθʼ αὑτὸν νομιζομένων ἐλαχίστων εἶναι
  choice: वह उन लोगों के हाथों नीचा दिखाया गया जिन्हें वह अपने सामने सबसे तुच्छ समझता था
  rationale: निष्क्रिय कृदन्त और विडंबनापूर्ण उलटाव को बनाए रखता है। καθʼ αὑτόν को उसके अपने आकलन/तुलना के रूप में लिया गया है; इससे यह स्पष्ट होता है कि वही उन्हें तुच्छ समझता था, यद्यपि यूनानी वाक्यांश संक्षिप्त है।
- source_word: τῇ τοῦ κυρίου βοηθείᾳ
  choice: प्रभु की सहायता से
  rationale: साधनवाचक चतुर्थी है और वाक्यक्रम तथा अर्थ के अनुसार उसके नीचा दिखाए जाने से जुड़ती है, न कि केवल वस्त्र उतारने से।
- source_word: τὴν δοξικὴν ἀποθέμενος ἐσθῆτα
  choice: अपना वैभवशाली वस्त्र उतारकर
  rationale: ἀποτίθημι का आशय उतारना/अलग रखना है और δοξική conspicuous वैभव या पद-प्रतिष्ठा दर्शाता है।
- source_word: διὰ τῆς μεσογείου
  choice: भीतरी भूभाग से होता हुआ
  rationale: μεσόγειος यहाँ समुद्र नहीं, अंतर्देशीय या भीतरी क्षेत्र को सूचित करता है।
- source_word: δραπέτου τρόπον ἔρημον ἑαυτὸν ποιήσας
  choice: भगोड़े की तरह अकेला
  rationale: δραπέτου τρόπον की अपमानजनक पलायन-छवि और ἔρημον की एकाकी अवस्था दोनों को संक्षेप में व्यक्त करता है; दासता का अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ἧκεν εἰς Ἀντιόχειαν
  choice: अन्ताकिया पहुँचा
  rationale: गंतव्य तक पहुँचने की सामान्य और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: ὑπὲρ ἅπαν εὐημερηκὼς ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  choice: मानो अपनी सेना के विनाश में उसे हद से बढ़कर सफलता मिली हो
  rationale: εὐημερέω के सफलता/समृद्धि वाले सकारात्मक शब्द को जानबूझकर बनाए रखते हुए स्पष्ट विडंबना प्रकट करता है। ὑπὲρ ἅπαν की तीव्रता को 'हद से बढ़कर' व्यक्त करता है।
theological_decisions:
- issue: κύριος का संदर्भ
  choice: प्रभु
  alternative: स्वामी
  rationale: इस यहूदी धार्मिक आख्यान में κύριος इस्राएल के परमेश्वर का संकेत है; 'प्रभु' अर्थ को बिना विस्तार दिए स्वाभाविक रूप से व्यक्त करता है।
- issue: प्रभु की सहायता किस क्रिया से जुड़ती है
  choice: उसके नीचा दिखाए जाने से
  alternative: उसके वैभवशाली वस्त्र उतारने से
  rationale: यूनानी वाक्यक्रम में τῇ τοῦ κυρίου βοηθείᾳ मुख्य निष्क्रिय कृदन्त ταπεινωθείς के साधन को बताता है। इसे वस्त्र उतारने से जोड़ना व्याकरण और प्रसंग दोनों में कम संभावित है।
- issue: सेना के विनाश पर εὐημερηκὼς की विडंबना
  choice: सफलता के सकारात्मक शब्द को व्यंग्यार्थ सहित बनाए रखा
  alternative: वह पूरी तरह असफल होकर लौटा
  rationale: मूल पाठ पराजय को सीधे सपाट नहीं करता, बल्कि उसकी सेना के विनाश को उसकी असाधारण 'सफलता' कहकर तीखी विडंबना उत्पन्न करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज आख्यान-शैली रखी गई है। ‘अन्ताकिया’ प्रचलित बाइबिलीय हिन्दी स्थान-नाम है। मुख्य पाठ में लंबी कृदन्त-शृंखला को दो वाक्यों में बाँटा गया है, पर कारण, अपमान, पलायन और अंतिम विडंबना का क्रम सुरक्षित है।
