    reason: lexical_alternative
  - marker: b
    text: अन्तिम कृदन्त का अर्थ यह हो सकता है कि वे इसलिए लौट गए क्योंकि वे दबाए जा रहे थे या उनकी गति सीमित हो रही थी; इसका कारण समय, भूभाग या अन्य परिस्थितियाँ रही होंगी, पर मूल पाठ इसे स्पष्ट नहीं करता।
