  text: परन्तु उन्होंने उन लोगों का पैसा ले लिया जो उन्हें खरीदने आए थे। फिर उनका काफ़ी दूर तक[a] पीछा करने के बाद, वे दबाव में होने के कारण[b] उस क्षेत्र से लौट गए,
