lexical_decisions:
- source_word: χρήματα
  choice: पैसा
  rationale: यहाँ उन व्यापारियों द्वारा बंदियों को खरीदने के लिए लाई गई भुगतान-राशि अभिप्रेत है; इसलिए सामान्य और स्पष्ट हिन्दी में ‘पैसा’ उपयुक्त है।
- source_word: τῶν παραγενομένων ἐπὶ τὸν ἀγορασμὸν αὐτῶν
  choice: उन लोगों का ... जो उन्हें खरीदने आए थे
  rationale: παραγενομένων उनके आने को और ἀγορασμός खरीद को व्यक्त करता है। प्रसंग में αὐτῶν उन यहूदियों की ओर संकेत करता है जिन्हें शत्रु बंदी बनाकर बेचने की आशा रखते थे।
- source_word: συνδιώξαντες
  choice: पीछा करने के बाद
  rationale: कालवाचक कृदन्त को स्वाभाविक हिन्दी में पूर्ववर्ती कार्रवाई के रूप में व्यक्त किया गया है। συν- का भाव यहाँ पीछा करने की संयुक्त अथवा आगे जारी कार्रवाई में निहित है, जिसे अलग शब्द जोड़कर अतिव्याख्यायित नहीं किया गया।
- source_word: ἐφʼ ἱκανόν
  choice: काफ़ी दूर तक
  rationale: पीछा करने और स्थानगत गति के प्रसंग में यह पर्याप्त विस्तार अथवा दूरी दर्शाता है; फिर भी अवधि का अर्थ संभव होने के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἀνέλυον
  choice: लौट गए
  rationale: सैनिक और यात्रा-संदर्भ में क्रिया लौटने, प्रस्थान करने या कार्रवाई रोककर वापस जाने का अर्थ दे सकती है। पीछा करने के बाद ‘लौट गए’ प्रसंगानुकूल और सहज है।
- source_word: ἀπὸ τῆς χώρας
  choice: उस क्षेत्र से
  rationale: χώρα व्यापक भूभाग को दर्शाता है; ‘क्षेत्र’ किसी निश्चित राजनीतिक इकाई को आरोपित किए बिना अर्थ देता है।
- source_word: συγκλειόμενοι
  choice: घिरते जा रहे होने के कारण
  rationale: कृदन्त दबाए, रोके या सीमित किए जाने की अवस्था और संभवतः लौटने का कारण बताता है। प्रगतिशील रूप यूनानी वर्तमान कृदन्त की जारी अवस्था को व्यक्त करता है, जबकि दबाव के सटीक स्रोत को अनिर्धारित रखता है।
