  terminology: ‘रक्षक’ plus ‘उनकी ओर से लड़ता है’ adequately renders ὑπέρμαχος without naming God in the text. ‘कर’ is acceptable for φόρος in this Roman political setting. ‘उनके लिए निर्धारित किए गए नियम’ retains the passive, authoritative force of προστεταγμένοις.
