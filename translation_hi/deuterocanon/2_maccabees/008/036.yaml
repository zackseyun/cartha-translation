  yaml_path: translation/deuterocanon/2_maccabees/008/036.yaml
  text: And the one who had undertaken to pay tribute to the Romans from the capture of those in Jerusalem kept proclaiming that the Jews had as their defender one who fought for them[a], and that for this reason the Jews were invulnerable[b], because they followed the laws that had been commanded to them.
translation:
  language: hi
  text: और जिसने यरूशलेम में रहने वालों को बंदी बनाने से प्राप्त होनेवाली रकम से रोमियों को कर चुकाने का दायित्व लिया था, वह लगातार यह घोषणा करता रहा कि यहूदियों के पास एक रक्षक है, जो उनकी ओर से लड़ता है[a], और इस कारण यहूदियों को घायल नहीं किया जा सकता[b], क्योंकि वे उन नियमों का पालन करते हैं जो उनके लिए निर्धारित किए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ रक्षक का नाम स्पष्ट रूप से नहीं बताया गया है; प्रसंग से संकेत मिलता है कि परमेश्वर ही यहूदियों की ओर से लड़नेवाले हैं।
    reason: alternative_reading
  - marker: b
    text: या, “वे चोट के लिए अभेद्य हैं”; यूनानी शब्द का शाब्दिक भाव है, “जिन्हें घायल न किया जा सके।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀναδεξάμενος
  choice: जिस व्यक्ति ने ... दायित्व लिया था
  rationale: संज्ञा के रूप में प्रयुक्त मध्यमवाच्य कृदंत किसी दायित्व को अपने ऊपर लेने का भाव देता है और संदर्भ में निकानोर की ओर संकेत करता है।
- source_word: φόρον
  choice: कर
  rationale: यह रोमी सत्ता को देय राजकीय भुगतान है; आधुनिक हिन्दी में ‘कर’ सहज और स्पष्ट है।
- source_word: ἀπὸ τῆς τῶν ἐν Ἱεροσολύμοις αἰχμαλωσίας
  choice: यरूशलेम में रहनेवालों को बंदी बनाकर मिलनेवाले धन से
  rationale: वाक्यांश अपेक्षित आय के स्रोत को बताता है—यरूशलेम के निवासियों को बंदी बनाने से होने वाली प्राप्ति। ‘धन’ निहित है, इसलिए इसे स्पष्ट करने हेतु पादटिप्पणी दी गई है।
- source_word: κατορθώσασθαι
  choice: चुकाने
  rationale: शाब्दिक अर्थ ‘पूरा करना/सफल करना’ है, पर वित्तीय संदर्भ में देय कर पूरा चुकाने का भाव है।
- source_word: κατήγγελλεν
  choice: घोषणा करने लगा
  rationale: अपूर्ण भूतकाल जारी या बार-बार किए गए कथन को दर्शाता है।
- source_word: ὑπέρμαχον ἔχειν
  choice: उनकी ओर से लड़नेवाला एक रक्षक है
  rationale: ὑπέρμαχος में केवल रक्षा नहीं, बल्कि किसी की ओर से सक्रिय रूप से लड़ने का भाव भी है।
- source_word: ἀτρώτους
  choice: अजेय
  rationale: मूल अर्थ ‘जिसे घायल न किया जा सके’ है; युद्ध-संदर्भ में ‘अजेय’ स्वाभाविक हिन्दी है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: διὰ τὸ ἀκολουθεῖν
  choice: क्योंकि वे ... पालन करते हैं
  rationale: पूर्वसर्ग और infinitive का संयोजन कारण व्यक्त करता है।
- source_word: τοῖς ἑαυτῶν προστεταγμένοις νόμοις
  choice: अपने लिए निर्धारित नियमों
  rationale: पूर्णकालिक कर्मवाच्य कृदंत उन नियमों को दर्शाता है जो अधिकारपूर्वक उनके लिए निर्धारित किए गए थे।
theological_decisions:
- issue: ὑπέρμαχον में यहूदियों के रक्षक की पहचान
  choice: रक्षक को अनिर्दिष्ट रखा गया है
  alternative: स्पष्ट रूप से ‘परमेश्वर’ कहना
  rationale: संदर्भ परमेश्वर की ओर संकेत करता है, पर इस उपवाक्य में यूनानी पाठ उनका नाम स्पष्ट रूप से नहीं लेता; इसलिए निहितार्थ को पादटिप्पणी में रखा गया है।
- issue: व्यवस्था-पालन और अजेयता के बीच संबंध
  choice: मूल पाठ का कारणसूचक संबंध यथावत रखा गया है
  alternative: इसे केवल सामान्य ईश्वरीय संरक्षण के कथन के रूप में ढीला करना
  rationale: διὰ τὸ ἀκολουθεῖν स्पष्टतः उनके नियम-पालन को कारण के रूप में प्रस्तुत करता है; अनुवाद इस धार्मिक तनाव को समझाकर कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे यूनानी वाक्य को हिन्दी में अर्धविराम द्वारा संतुलित किया गया है। ‘अजेय’ युद्ध-संदर्भ में स्वाभाविक है, और अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
