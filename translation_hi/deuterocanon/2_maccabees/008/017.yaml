translation:
  language: hi
  text: उन्होंने अपनी आँखों के सामने उस घोर अपमान को रखा, जो उन लोगों ने पवित्र स्थान के विरुद्ध अन्यायपूर्वक किया था; उस नगर के साथ किए गए दुर्व्यवहार को भी, जिसका उपहास किया गया था; और पूर्वजों से चली आई जीवन-व्यवस्था के विनाश को भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕβριν
  choice: घोर अपमान
  rationale: यह शब्द उद्दंड, अपमानजनक अत्याचार का भाव रखता है; संदर्भ में पवित्र स्थान के विरुद्ध किए गए गंभीर अपमान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αἰκισμόν
  choice: दुर्दशा
  rationale: नगर के साथ हुए अपमानजनक दुर्व्यवहार और उत्पीड़न के परिणाम को समेटता है, बिना किसी ऐसे विशिष्ट कृत्य को जोड़ने के जिसका यूनानी पाठ में स्पष्ट उल्लेख नहीं है।
- source_word: πολιτείας
  choice: जीवन-व्यवस्था
  rationale: यहाँ केवल शासन-पद्धति नहीं, बल्कि पूर्वजों से प्राप्त सामुदायिक, धार्मिक और सामाजिक जीवन-पद्धति अभिप्रेत है।
- source_word: κατάλυσιν
  choice: विनाश
  rationale: व्यवस्था को ढहा देने या समाप्त कर देने की प्रबलता को संक्षिप्त और स्पष्ट रूप में व्यक्त करता है।
theological_decisions:
- issue: προγονικῆς πολιτείας का दायरा
  choice: पूर्वजों से चली आई जीवन-व्यवस्था
  alternative: पैतृक शासन-व्यवस्था
  rationale: संदर्भ यहूदी सामुदायिक और धार्मिक जीवन के व्यापक विघटन का है; अनुवाद इसे केवल राजनीतिक शासन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। यूनानी कृदंत-वाक्यांश को हिन्दी में पूर्ण वाक्य बनाया गया है, जबकि तीनों स्मरण-विषयों की समानांतर संरचना सुरक्षित रखी गई है।
