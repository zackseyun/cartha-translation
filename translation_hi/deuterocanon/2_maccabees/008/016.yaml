  yaml_path: translation/deuterocanon/2_maccabees/008/016.yaml
  text: Then Maccabeus[a], after gathering those with him, about six thousand in number, urged them not to be terrified by the enemy, nor to fear the great multitude of the nations that had come against them unjustly, but to fight bravely,
translation:
  language: hi
  text: तब मक्काबी ने अपने साथ के लोगों को इकट्ठा किया, जिनकी संख्या छह हज़ार थी, और उनसे आग्रह किया कि वे शत्रुओं[a] से आतंकित न हों और उन जातियों की भारी संख्या से न डरें, जो अन्यायपूर्वक उनके विरुद्ध आ पहुँची थीं, बल्कि वीरता से लड़ें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ ‘बंदियों’ या ‘कैदियों’ है। यहाँ शब्दावली कठिन है; प्रसंग विरोधी सेनाओं की ओर संकेत करता है, इसलिए मुख्य पाठ में ‘शत्रुओं’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Συναγαγών
  choice: इकट्ठा किया
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की कार्रवाई बताता है; हिन्दी में संयुक्त वाक्य क्रम को स्वाभाविक और स्पष्ट बनाता है।
- source_word: τοὺς περὶ αὐτὸν ὄντας
  choice: अपने साथ के लोगों
  rationale: शाब्दिक अर्थ ‘उसके आस-पास के लोग’ है; चुना हुआ रूप साथ उपस्थित दल को सहज हिन्दी में व्यक्त करता है और ‘उसके सैनिक’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἀριθμὸν ἑξακισχιλίους
  choice: जिनकी संख्या छः हज़ार थी
  rationale: यूनानी पाठ निश्चित संख्या ‘छः हज़ार’ देता है; इसलिए ‘लगभग’ नहीं जोड़ा गया।
- source_word: παρεκάλει
  choice: उसने उनसे आग्रह किया
  rationale: सैन्य प्रोत्साहन के प्रसंग में यह बलपूर्वक उत्साहित करने या आग्रह करने का भाव देता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μὴ καταπλαγῆναι
  choice: आतंकित न हों
  rationale: क्रिया भय से अभिभूत या स्तब्ध हो जाने का तीव्र भाव व्यक्त करती है।
- source_word: τοῖς δεσμίοις
  choice: शत्रुओं
  rationale: इस शब्द का सामान्य अर्थ ‘बंदी’ या ‘कैदी’ है, पर इस प्रसंग में वह अर्थ कठिन है। अगले वाक्यांश में सामने आई विरोधी जातियों का उल्लेख होने के कारण मुख्य पाठ में संदर्भगत आशय रखा गया और शाब्दिक विकल्प पादटिप्पणी में दिया गया।
- source_word: μηδὲ εὐλαβεῖσθαι
  choice: और ... से न डरें
  rationale: यहाँ क्रिया भय या आशंका रखने का अर्थ देती है और पहली निषेधात्मक क्रिया के समानांतर है।
- source_word: τὴν ... πολυπληθείαν
  choice: भारी संख्या
  rationale: संज्ञा बहुत बड़ी संख्या पर बल देती है; हिन्दी में यह सैनिकों की संख्यात्मक प्रबलता को स्पष्ट करती है।
- source_word: τῶν ... ἐθνῶν
  choice: उन जातियों की
  rationale: यह रूप विदेशी जनसमूहों के जातीय-सामूहिक अर्थ को बनाए रखता है और ‘अन्यजाति’ जैसे बाद के पारिभाषिक धार्मिक अर्थ को अनावश्यक रूप से नहीं लाता।
- source_word: ἀδίκως παραγενομένων ἐπʼ αὐτούς
  choice: जो अन्यायपूर्वक उनके विरुद्ध आ पहुँची थीं
  rationale: कृदंतीय वाक्यांश उन जातियों के आने को अन्यायपूर्ण और विरोधी कार्रवाई के रूप में चित्रित करता है।
- source_word: ἀγωνίσασθαι γενναίως
  choice: वीरता से लड़ें
  rationale: सैन्य प्रसंग में क्रिया युद्ध करने और क्रियाविशेषण साहसपूर्वक करने का अर्थ देता है।
theological_decisions:
- issue: द्वितीय मक्काबियों के यहूदी सैन्य प्रसंग में ἐθνῶν का अनुवाद
  choice: जातियों
  alternative: अन्यजातियों; राष्ट्रों; लोगों
  rationale: ‘जातियों’ विदेशी जातीय समूहों का अर्थ बनाए रखता है, जबकि ‘अन्यजातियों’ से बाद की धार्मिक पारिभाषिकता जुड़ सकती है और ‘राष्ट्रों’ से आधुनिक राष्ट्र-राज्य का भाव आ सकता है।
- issue: प्रसंग में कठिन शब्द δεσμίοις का निर्वाह
  choice: मुख्य पाठ में ‘शत्रुओं’, पादटिप्पणी में ‘बंदियों/कैदियों’
  alternative: मुख्य पाठ में ‘बंदियों’ या ‘कैदियों’
  rationale: शब्द का सामान्य कोशगत अर्थ ‘बंदी/कैदी’ है, किंतु यहाँ सैनिकों को सामने खड़ी विरोधी सेना से न डरने के लिए कहा जा रहा है। संदर्भगत आशय मुख्य पाठ में और वास्तविक पाठगत कठिनाई पादटिप्पणी में रखी गई है, ताकि अस्पष्टता छिपे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक-सैन्य रूप रखा गया है। ‘छः हज़ार’ यूनानी की निश्चित संख्या को व्यक्त करता है; ‘लगभग’ नहीं जोड़ा गया। वाक्य को हिन्दी में पठनीय बनाने के लिए कृदंतीय आरंभ को दो मुख्य वाक्यों में व्यवस्थित किया गया है।
