base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/002.yaml
  text: And they were calling on the Lord to look upon the people trampled down by all[a], and also to have mercy on the temple that had been defiled by ungodly men;
translation:
  language: hi
  text: और वे प्रभु को पुकारते रहे कि वह सबके द्वारा रौंदी जा रही प्रजा पर दृष्टि करे और उस मंदिर पर भी दया करे, जिसे भक्तिहीन मनुष्यों ने अपवित्र कर दिया था[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी पवित्रता भंग कर दी गई थी।” यूनानी क्रिया का भाव है कि पवित्र मंदिर के साथ साधारण वस्तु जैसा व्यवहार करके उसकी पवित्रता का उल्लंघन किया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: पुकारते रहे
  rationale: अपूर्ण भूतकाल प्रार्थना में जारी या बार-बार की गई पुकार को व्यक्त करता है; यह पदबंध आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: परमेश्वर के लिए प्रयुक्त इस उपाधि का मानक, श्रद्धापूर्ण हिन्दी रूप।
- source_word: ἐφιδεῖν
  choice: दृष्टि करे
  rationale: यह केवल देखने नहीं, बल्कि ध्यान देकर उनकी दशा पर कृपापूर्वक विचार करने की विनती है।
- source_word: τὸν ... λαόν
  choice: प्रजा
  rationale: यह एक सामूहिक जनसमुदाय, अर्थात इस्राएल की पीड़ित प्रजा, को सूचित करता है; ‘प्रजा’ एकवचन सामूहिक अर्थ बनाए रखता है।
- source_word: καταπατούμενον
  choice: रौंदी जा रही
  rationale: मूल की सजीव पद-दलन और अपमान की छवि को अमूर्त ‘सताई जा रही’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: ὑπὸ πάντων
  choice: सबके द्वारा
  rationale: यूनानी कथन की व्यापकता को बिना कोई अतिरिक्त समूह निर्दिष्ट किए यथावत रखता है।
- source_word: οἰκτεῖραι
  choice: दया करे
  rationale: परमेश्वर से की गई प्रार्थना में करुणा दिखाने की विनती का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: τὸν ναὸν
  choice: मंदिर
  rationale: यह यरूशलेम के मंदिर को सूचित करता है; ‘मंदिर’ सामान्य पाठक के लिए स्पष्ट मानक शब्द है।
- source_word: βεβηλωθέντα
  choice: अपवित्र कर दिया था
  rationale: क्रिया किसी पवित्र वस्तु को लौकिक या अशुद्ध ठहराकर उसकी पवित्रता भंग करने का भाव रखती है; मुख्य पाठ में सुबोध विकल्प चुना गया और निकट वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: भक्तिहीन मनुष्यों
  rationale: यह सामान्य दुष्टता से बढ़कर परमेश्वर के प्रति श्रद्धा के अभाव को व्यक्त करता है; ‘मनुष्यों’ मूल के मानवीय कर्ताओं को स्पष्ट रखता है।
theological_decisions:
- issue: इस्राएल के परमेश्वर से प्रार्थना में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ श्रद्धापूर्ण ईश्वरीय संबोधन को व्यक्त करता है और मूल में स्पष्ट रूप से न लिखे गए परमेश्वर के निज नाम को नहीं जोड़ता।
- issue: मंदिर के βεβηλόω किए जाने का धार्मिक आशय
  choice: अपवित्र कर दिया था
  alternative: उसकी पवित्रता भंग कर दी थी
  rationale: मुख्य पाठ का रूप सहज हिन्दी में मंदिर के पवित्र दर्जे के उल्लंघन को व्यक्त करता है, जबकि पादटिप्पणी यूनानी क्रिया के ‘पवित्र को साधारण मानने’ वाले विशेष भाव को सुरक्षित रखती है।
- issue: ἀνθρώπων में मानवीय कर्ताओं का उल्लेख
  choice: मनुष्यों
  alternative: लोगों
  rationale: ‘मनुष्यों’ मूल के संज्ञात्मक रूप को स्पष्टता से रखता है, पर ऐसा कोई अतिरिक्त लिंग-विशेष दावा नहीं जोड़ता जिसकी प्रसंग में आवश्यकता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। ‘दृष्टि करे’ श्रद्धापूर्ण है पर अत्यधिक पुरातन नहीं; ‘रौंदी जा रही’ मूल रूपक को बनाए रखता है। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिसकी व्याख्या पादटिप्पणी करती है।
