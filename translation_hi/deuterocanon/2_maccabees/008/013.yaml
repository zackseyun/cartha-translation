    reason: δίκη परमेश्वर के न्याय, उसकी न्यायकारी कार्रवाई, या दण्डात्मक प्रतिकार का संकेत कर सकता है; मुख्य पाठ इन अर्थों के बीच की व्यापकता बनाए रखता है।
lexical_decisions:
- source_word: δειλανδροῦντες
  choice: जो कायर हो गए थे
  rationale: यह कृदन्त साहस खो देने या कायर हो जाने का दोषसूचक भाव रखता है; यह अनुवाद उसके परिणामात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπιστοῦντες
  choice: भरोसा नहीं करते थे
  rationale: यहाँ इसका कर्म परमेश्वर का न्याय है, इसलिए सामान्य अविश्वास के बजाय परमेश्वर की न्यायकारी कार्रवाई पर भरोसा न रखने का भाव उपयुक्त है।
- source_word: τὴν τοῦ θεοῦ δίκην
  choice: परमेश्वर के न्याय
  rationale: δίκη यहाँ न्याय के सिद्धान्त और शत्रुओं के विरुद्ध परमेश्वर की न्यायकारी कार्रवाई—दोनों का संकेत दे सकता है; ‘न्याय’ इस व्यापकता को बनाए रखता है।
- source_word: διεδίδρασκον ἑαυτούς
  choice: चुपके-चुपके भागते
  rationale: अपूर्ण काल बार-बार या लगातार होते कार्य को दर्शाता है, जबकि आत्मवाचक प्रयोग स्वयं को बचाकर निकल जाने के भाव को प्रबल करता है।
- source_word: ἐξετόπιζον
  choice: अपना देश छोड़कर जाते रहे
  rationale: क्रिया अपने स्थान या क्षेत्र से विस्थापित होकर चले जाने को बताती है; यहाँ औपचारिक निर्वासन का अनावश्यक अर्थ जोड़े बिना पलायन और विस्थापन व्यक्त किया गया है।
theological_decisions:
- issue: τὴν τοῦ θεοῦ δίκην का अर्थ
  choice: परमेश्वर का न्याय
  alternative: परमेश्वर का दण्ड अथवा प्रतिशोध
  rationale: मूल पद परमेश्वर की न्यायशीलता या इतिहास में उसकी न्यायकारी कार्रवाई का बोध करा सकता है। ‘न्याय’ इस तनाव को सुरक्षित रखता है और इसे केवल प्रतिशोध तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘अपना देश छोड़कर’ प्रसंगगत विस्थापन बताता है, पर किसी विधिवत निर्वासन का दावा नहीं करता।
