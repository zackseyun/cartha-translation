base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/030.yaml
  text: And after crushing the forces around Timothy and Bacchides[a], they killed more than twenty thousand of them, gained firm control of very high strongholds, and divided the plentiful plunder, making themselves equal sharers with the oppressed and orphans and widows, and even with the elderly.
translation:
  language: hi
  text: फिर उन्होंने तीमुथियुस और बक्खीदेस की सेनाओं को कुचलकर उनमें से बीस हज़ार से अधिक को मार डाला। उन्होंने बहुत ऊँचे दुर्गों पर मज़बूत अधिकार कर लिया और लूट का बहुत-सा माल बाँट दिया, अपने आपको उत्पीड़ितों, अनाथों, विधवाओं और यहाँ तक कि बुज़ुर्गों के साथ बराबर का हिस्सेदार बनाकर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उत्पीड़ितों, अनाथों, विधवाओं और यहाँ तक कि बुज़ुर्गों को अपने साथ बराबर का हिस्सेदार बनाया।” यूनानी सर्वनाम का संबंध दोनों प्रकार से समझा जा सकता है। मुख्य पाठ के अनुसार सैनिकों ने अपने लिए भी इन असहाय लोगों के बराबर ही हिस्सा रखा।
    reason: alternative_reading
lexical_decisions:
- source_word: συνερείσαντες
  choice: कुचलकर
  rationale: कृदंत बलपूर्वक परास्त करने का भाव देता है; सैन्य प्रसंग में ‘कुचलकर’ स्वाभाविक और सशक्त है।
- source_word: τοὺς περὶ Τιμόθεον καὶ Βακχίδην
  choice: तीमुथियुस और बक्खीदेस के साथ की सेनाओं
  rationale: οἱ περὶ + नाम संबंधित या नेतृत्वाधीन दल को सूचित करता है; ‘के साथ की सेनाओं’ व्यक्तियों के बजाय उनके सैन्य दल का बोध कराता है।
- source_word: ὑπὲρ τοὺς δισμυρίους
  choice: बीस हज़ार से अधिक
  rationale: δισμύριοι बीस हज़ार और ὑπέρ + कर्मकारक ‘से अधिक’ का अर्थ देता है।
- source_word: ἀνεῖλον
  choice: मार डाला
  rationale: युद्ध-वर्णन में ἀναιρέω का सीधा अर्थ हत्या करना है।
- source_word: ὀχυρωμάτων ὑψηλῶν εὖ μάλα ἐγκρατεῖς ἐγένοντο
  choice: बहुत ऊँचे गढ़ों पर पूरी तरह अधिकार कर लिया
  rationale: ὀχυρώματα दुर्गीकृत स्थान हैं, जबकि ἐγκρατεῖς ἐγένοντο दृढ़ नियंत्रण या अधिकार पाने को व्यक्त करता है; εὖ μάλα की तीव्रता ‘पूरी तरह’ और ‘बहुत’ से सामने आती है।
- source_word: λάφυρα πλείονος
  choice: लूट का बहुत-सा माल
  rationale: वाक्यांश प्रचुर युद्ध-लूट को दर्शाता है; यह अभिव्यक्ति सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐμερίσαντο
  choice: आपस में बाँटा
  rationale: क्रिया का अर्थ भागों में बाँटना या वितरण करना है; मध्यवाच्य रूप के कारण ‘आपस में बाँटा’ उपयुक्त है।
- source_word: ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: उन्होंने अपने लिए भी उतना ही भाग रखा जितना ... के लिए
  rationale: यह αὐτούς को कर्ता-दल की ओर लौटता हुआ समझते हुए समान हिस्सेदारी का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह संकेत दिए कि सैनिकों ने बड़ा हिस्सा रखा।
- source_word: τοῖς ἠκισμένοις
  choice: सताए हुओं
  rationale: शब्द दुर्व्यवहार या उत्पीड़न सहने वालों को सूचित करता है; ‘सताए हुए’ इस सामाजिक संदर्भ में सहज है।
- source_word: πρεσβυτέροις
  choice: बुज़ुर्गों
  rationale: यहाँ प्रसंग किसी पदाधिकारी का नहीं बल्कि आयु-वृद्ध और संभावित रूप से असहाय लोगों का है।
theological_decisions:
- issue: ἰσομοίρους αὐτοὺς ... ποιήσαντες में αὐτούς का संदर्भ
  choice: योद्धाओं ने अपने हिस्से को सताए हुओं, अनाथों, विधवाओं और बुज़ुर्गों के हिस्से के बराबर रखा
  alternative: उन्होंने उन असहाय समूहों को अपने साथ बराबर का हिस्सेदार बनाया
  rationale: αὐτούς को कार्य करने वाले समूह की ओर लौटता हुआ समझना संभव और संदर्भानुकूल है, पर यूनानी सर्वनाम दूसरी व्याख्या की भी गुंजाइश रखता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। सैन्य शब्दावली स्पष्ट है और सर्वनामगत वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित की गई है।
