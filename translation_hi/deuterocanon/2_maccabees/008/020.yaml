base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/020.yaml
  text: 'And the engagement in Babylonia against the Galatians had gone this way: when all who came to the need were eight thousand[a], together with four thousand Macedonians, and the Macedonians were at a loss, the six thousand destroyed the one hundred twenty thousand because of the help coming to them from heaven, and they received great advantage.'
translation:
  language: hi
  text: 'और बाबुल में गलातियों[a] के विरुद्ध जो युद्ध हुआ था, वह इस प्रकार था: जब उस आवश्यकता के समय जो लोग आए थे, वे सब आठ हज़ार थे और उनके साथ चार हज़ार मकिदुनी भी थे, तब मकिदुनियों के असमंजस में पड़ जाने पर उन छह हज़ार ने उन एक लाख बीस हज़ार को नष्ट कर दिया, क्योंकि उन्हें स्वर्ग से सहायता मिल रही थी; और उन्होंने बहुत लाभ पाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गॉल लोग।” यूनानी जातिनाम का अनुवाद प्रसंग के अनुसार “गलाती” या उनकी अधिक व्यापक केल्टिक पहचान के अर्थ में “गॉल” किया जा सकता है।
    reason: जातिनाम के ऐतिहासिक सन्दर्भ में वास्तविक द्विअर्थता को सुरक्षित रखना।
lexical_decisions:
- source_word: παράταξιν
  choice: युद्ध
  rationale: यह संज्ञा युद्ध के लिए सजी हुई सेना अथवा वास्तविक युद्ध-मुठभेड़ को सूचित कर सकती है। प्रसंग में सहज और पर्याप्त व्यापक हिन्दी के लिए ‘युद्ध’ चुना गया है।
- source_word: Γαλάτας
  choice: गलातियों
  rationale: यूनानी जातिनाम का सीधा और हिन्दी बाइबल-पाठकों के लिए परिचित रूप है; ‘गॉल लोगों’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἐπὶ τὴν χρείαν ἦλθον
  choice: आवश्यकता के समय आए
  rationale: वाक्यांश संकट अथवा तत्काल आवश्यकता उपस्थित होने पर आने का भाव देता है। यह अनुवाद ‘सहायता करने’ का उद्देश्य स्पष्ट रूप से जोड़ने के बजाय मूल की व्यापकता बनाए रखता है।
- source_word: ἀπορουμένων
  choice: कठिनाई में पड़ जाने पर
  rationale: क्रिया-संबंधी रूप साधनों की कमी, असमंजस या गतिरोध में पड़ने का भाव रखता है। हिन्दी में यह व्यावहारिक संकट को स्वाभाविक ढंग से व्यक्त करता है, बिना केवल मानसिक उलझन तक सीमित किए।
- source_word: ἀπώλεσαν
  choice: नष्ट कर दिया
  rationale: मूल क्रिया का अर्थ नाश करना या मरवा डालना है। सैन्य प्रसंग में ‘नष्ट कर दिया’ उसकी तीव्रता और कुछ हद तक व्यापकता दोनों बनाए रखता है।
- source_word: δώδεκα μυριάδας
  choice: एक लाख बीस हज़ार
  rationale: बारह ‘मिरियड’ की संख्या को आधुनिक हिन्दी की स्वाभाविक संख्या-पद्धति में व्यक्त किया गया है।
- source_word: διὰ τὴν γινομένην αὐτοῖς ἀπʼ οὐρανοῦ βοήθειαν
  choice: क्योंकि उन्हें स्वर्ग से सहायता मिल रही थी
  rationale: ‘स्वर्ग से’ मूल की श्रद्धापूर्ण परोक्ष अभिव्यक्ति को बनाए रखता है और सहायता देने वाले का नाम पाठ से अधिक स्पष्ट नहीं करता।
- source_word: ὠφέλειαν πολλὴν ἔλαβον
  choice: उन्होंने बहुत लाभ पाया
  rationale: ὠφέλεια लाभ, फायदा या उपयोगिता को सूचित कर सकता है। ‘बहुत लाभ पाया’ युद्ध की लूट या केवल रणनीतिक बढ़त जैसी किसी एक व्याख्या तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ‘स्वर्ग से सहायता’ का अभिप्राय
  choice: मूल की परोक्ष अभिव्यक्ति ‘स्वर्ग से सहायता’ को यथावत रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘परमेश्वर की सहायता’ कहना, अथवा सामान्य सौभाग्य मानना।
  rationale: यहूदी यूनानी प्रयोग में ‘स्वर्ग से’ प्रायः ईश्वरीय सहायता का श्रद्धापूर्ण संकेत है, फिर भी मूल यहाँ परमेश्वर का नाम प्रत्यक्ष रूप से नहीं लेता। अनुवाद उसी धार्मिक संकेत और संयम को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली अपनाई गई है। मूल के असामान्य संख्यात्मक क्रम—आठ हज़ार, साथ में चार हज़ार मकिदुनी, फिर छह हज़ार—को स्पष्ट करने या मिलाने का प्रयास किए बिना सुरक्षित रखा गया है। ‘बाबुल’ और ‘मकिदुनी’ जैसे प्रचलित हिन्दी बाइबलीय रूप प्रयुक्त हुए हैं।
