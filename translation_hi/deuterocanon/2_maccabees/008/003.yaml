  yaml_path: translation/deuterocanon/2_maccabees/008/003.yaml
  text: and to have mercy also on the city that was being destroyed and was about to be leveled to the ground[a], and to hear the blood crying out to him[b];
translation:
  language: hi
  text: और उस नगर पर भी दया करे, जो उजाड़ा जा रहा था और भूमि के बराबर होने वाला था, और उस लहू की पुकार सुने, जो उसकी ओर उठ रही थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘लहू’ बहुवचन है; यह अनेक लोगों के बहाए गए लहू, व्यापक रक्तपात या उससे जुड़े दोष की तीव्रता का संकेत दे सकता है। लहू के परमेश्वर की ओर पुकारने का चित्र निर्दोष लहू की पुकार वाले बाइबलीय विषय की प्रतिध्वनि करता है।
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: दया करे
  rationale: पूर्ववर्ती प्रार्थना की विषयवस्तु बताने वाले अनंत क्रियारूप को हिन्दी में स्वाभाविक विध्यर्थक रूप से व्यक्त करता है और करुणा का भाव बनाए रखता है।
- source_word: καταφθειρομένην
  choice: जो उजाड़ा जा रहा था
  rationale: वर्तमान कृदंत नगर के लगातार जारी विनाश को दर्शाता है; ‘उजाड़ा जा रहा था’ प्रक्रिया और निष्क्रिय भाव दोनों सुरक्षित रखता है।
- source_word: πόλιν
  choice: उस नगर
  rationale: यूनानी में सामान्य संज्ञा है; सन्दर्भ यरूशलेम का है, पर मूल पाठ यहाँ उसका नाम नहीं लेता।
- source_word: μέλλουσαν ἰσόπεδον γίνεσθαι
  choice: धरती के बराबर कर दिया जाने वाला था
  rationale: μέλλουσαν आसन्नता और ἰσόπεδον समतल किए जाने का भाव देता है; यह हिन्दी रूप दोनों को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῶν ... αἱμάτων
  choice: उस लहू
  rationale: यूनानी में ‘लहू’ बहुवचन है, जो अनेक हत्याओं या रक्तपात की तीव्रता सूचित कर सकता है; हिन्दी बाइबलीय मुहावरे में एकवचन ‘लहू’ ठोस रूपक को स्वाभाविक रखता है।
- source_word: καταβοώντων πρὸς αὐτόν
  choice: जो उसकी ओर पुकार रहा था
  rationale: कृदंत को लहू से सम्बद्ध रखते हुए सजीव बाइबलीय चित्र सुरक्षित करता है; ‘उसकी ओर’ πρὸς αὐτόν का सीधा अर्थ बनाए रखता है।
- source_word: εἰσακοῦσαι
  choice: पुकार सुने
  rationale: प्रार्थना-सन्दर्भ में क्रिया केवल ध्वनि सुनने से अधिक, विनती पर ध्यान देने का संकेत दे सकती है; फिर भी ‘सुने’ उस निहितार्थ को खुला रखता है।
theological_decisions:
- issue: परमेश्वर की ओर पुकारते लहू का सम्भावित शास्त्रीय संकेत
  choice: लहू को सजीव रूप में पुकारते हुए रखना, पर न्याय या प्रतिशोध को स्पष्टतः न जोड़ना
  alternative: मारे गए लोगों के लहू की प्रतिशोध के लिए पुकार सुनना
  rationale: यूनानी पाठ लहू की पुकार का चित्र देता है, पर इस उपवाक्य में पीड़ितों की पहचान या ‘प्रतिशोध के लिए’ नहीं जोड़ता; ठोस रूपक धार्मिक प्रतिध्वनि और अर्थगत तनाव दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली। ‘नगर’ और ‘लहू’ से मूल का ठोस चित्र बना रहता है; ‘उजाड़ा जा रहा था’ जारी विनाश और ‘धरती के बराबर कर दिया जाने वाला था’ आसन्न पूर्ण विध्वंस व्यक्त करता है।
