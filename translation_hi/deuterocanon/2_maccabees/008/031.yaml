- source_word: πάντα συνέθηκαν
  choice: उन सबको ... रख दिया
  rationale: συντίθημι का मूल भाव चीज़ों को रख देने या एकत्र करके व्यवस्थित करने का है। संदर्भ में इसका सम्बन्ध लिए गए हथियारों से है; ‘रख दिया’ यूनानी के निकट रहते हुए हिन्दी में स्वाभाविक है।
- source_word: εἰς τοὺς ἐπικαίρους τόπους
  choice: उचित स्थानों पर
  rationale: ἐπίκαιρος यहाँ उपयुक्त, अनुकूल या प्रयोजन के योग्य स्थानों को सूचित करता है; ‘उचित’ बिना अनावश्यक सामरिक अर्थ जोड़े इसकी व्यापकता बनाए रखता है।
- source_word: τὰ δὲ λοιπὰ τῶν σκύλων
  choice: युद्ध की लूट का बाकी सामान
  rationale: σκῦλα युद्ध में शत्रु से प्राप्त लूट है और λοιπά शेष भाग को सूचित करता है। यह पदबंध साधारण पाठक के लिए स्पष्ट है।
- source_word: ἤνεγκαν εἰς Ἰεροσόλυμα
  choice: वे यरूशलेम ले गए
  rationale: ἤνεγκαν भौतिक रूप से ले जाने का बोध कराता है; हिन्दी में ‘ले गए’ दिशा और परिवहन दोनों को सहज रूप से व्यक्त करता है।
