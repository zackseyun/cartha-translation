lexical_decisions:
- source_word: ὁπλολογήσαντες
  choice: उनके हथियार उतार लिए
  rationale: यह कृदन्त पराजित लोगों से हथियार लेने या उनके हथियार इकट्ठे करने का बोध कराता है। αὐτούς के साथ ‘उनके हथियार उतार लिए’ ठोस और स्वाभाविक हिन्दी है; दूसरी सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: ἐπιμελῶς
