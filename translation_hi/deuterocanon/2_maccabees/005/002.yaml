  text: तब ऐसा हुआ कि लगभग पूरे नगर में चालीस दिनों तक घुड़सवार हवा में दौड़ते दिखाई दिए[a]। उन्होंने सोने के वस्त्र पहन रखे थे और वे भालों से लैस होकर सैन्य टुकड़ियों में क्रमबद्ध थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हवा में दौड़ते प्रकट हुए।” यूनानी शब्द φαίνεσθαι दिखाई देने के साथ-साथ प्रकट होने पर भी बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सैन्य टुकड़ियों में क्रमबद्ध” के लिए प्रयुक्त यूनानी क्रिया-विशेषण σπειρηδόν संगठित सैन्य गठन का संकेत देता है; “पाँतों में” या “दलों में” भी सम्भव है।
