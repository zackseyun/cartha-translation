- source_word: συνέβη
  choice: तब ऐसा हुआ
  rationale: यह कथात्मक घटना का स्वाभाविक परिचय है और यूनानी के निर्वैयक्तिक निर्माण को आधुनिक हिन्दी में सहज रूप देता है।
- source_word: καθʼ ὅλην τὴν πόλιν σχεδὸν
  choice: लगभग पूरे नगर में
  rationale: κατά का वितरणात्मक भाव और σχεδόν द्वारा व्यक्त सीमा—दोनों संक्षेप और स्वाभाविक रूप से सुरक्षित रहते हैं।
- source_word: ἐφʼ ἡμέρας τεσσεράκοντα
  choice: चालीस दिनों तक
  rationale: यह अवधि बताने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: φαίνεσθαι
  choice: दिखाई दिए
  rationale: यह दृश्यता के भाव को स्पष्ट करता है, पर घटना को केवल भ्रम या केवल वस्तुगत उपस्थिति मानकर अनिश्चितता को समाप्त नहीं करता।
- source_word: διὰ τῶν ἀέρων
  choice: हवा में
  rationale: यूनानी बहुवचन यहाँ आकाशीय वायु-प्रदेश के लिए प्रयुक्त है; ‘हवा में’ साधारण आधुनिक हिन्दी में स्पष्ट और स्रोत के निकट है।
- source_word: τρέχοντας ἱππεῖς
  choice: घुड़सवार हवा में दौड़ते
  rationale: ἱππεῖς को ‘घुड़सवार’ और τρέχοντας को ‘दौड़ते’ कहना तीव्र अश्वारोही गति को बिना अतिरिक्त युद्धार्थ जोड़े व्यक्त करता है।
- source_word: διαχρύσους στολὰς ἔχοντας
  choice: उन्होंने सोने के वस्त्र पहन रखे थे
  rationale: यह सोने से युक्त या स्वर्णमय वस्त्रों की चकित करने वाली दृश्य छवि को सुरक्षित रखता है, बिना उनकी बनावट को अनावश्यक रूप से निश्चित किए।
- source_word: λόγχας
  choice: भालों
  rationale: λόγχη भाले या बरछे को सूचित करता है; अश्वारोही सैन्य दृश्य में ‘भाला’ स्पष्ट और सामान्य हिन्दी शब्द है।
- source_word: σπειρηδὸν
  choice: सैन्य टुकड़ियों में क्रमबद्ध
  rationale: यह क्रिया-विशेषण संगठित सैन्य दल या गठन में व्यवस्थित होने का भाव देता है; हिन्दी पाठ सैन्य व्यवस्था को स्पष्ट करता है, पर किसी अत्यधिक विशिष्ट इकाई को निश्चित नहीं करता।
- source_word: ἐξωπλισμένους
  choice: लैस
  rationale: यह हथियारों से सुसज्जित होने का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
