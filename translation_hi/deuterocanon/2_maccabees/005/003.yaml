base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/003.yaml
  text: and the brandishing of swords[a], and squadrons of cavalry drawn up, and attacks and counterattacks by both sides, and the movement of shields, and masses of spears, and the shooting of missiles, and the gleaming of golden ornaments[b], and all kinds of armor.
translation:
  language: hi
  text: और तलवारों का लहराया जाना[a], युद्ध के लिए पंक्तिबद्ध घुड़सवार दल, आक्रमण और दोनों पक्षों के धावे[b], ढालों की हलचल, भालों के समूह[c], फेंके जाने वाले अस्त्रों की बौछारें, सोने के आभूषणों की चमक और हर प्रकार के कवच दिखाई दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तलवारों का म्यान से खींचा जाना’। यूनानी शब्द खींचने अथवा झटके से चलाने की क्रिया बता सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘धावे’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘छापे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘भालों’ के रूप में अनूदित यूनानी शब्द इस प्रसंग में कठिन है; इसका संकेत सामान्य रूप से लंबे डंडेदार हथियारों या ऐसी ही युद्ध-सामग्री की ओर हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: μαχαιρῶν σπασμούς
  choice: तलवारों का लहराया जाना
  rationale: σπασμός खींचने या झटके से चलाने की क्रिया बताता है। युद्ध-दृश्य में ‘लहराया जाना’ सहज है, जबकि म्यान से खींचे जाने की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἴλας ἵππων διατεταγμένας
  choice: युद्ध के लिए पंक्तिबद्ध घुड़सवार दल
  rationale: ἴλη घुड़सवार सेना की टुकड़ी है और διατεταγμένας व्यवस्थित युद्ध-विन्यास को दर्शाता है।
- source_word: προσβολὰς γινομένας καὶ καταδρομὰς ἑκατέρων
  choice: आक्रमण और दोनों पक्षों के धावे
  rationale: προσβολή सामान्य सैन्य आक्रमण है; καταδρομή तेज धावा या छापा हो सकता है। ‘दोनों पक्षों के धावे’ पारस्परिक कार्रवाई को बिना ‘जवाबी हमला’ का अर्थ अनिवार्य किए व्यक्त करता है।
- source_word: ἀσπίδων κινήσεις
  choice: ढालों की हलचल
  rationale: κίνησις का व्यापक अर्थ गति या हलचल है; अनुवाद ढालों को हिलाने की विशिष्ट रीति तय नहीं करता।
- source_word: καμάτων πλήθη
  choice: भालों के ढेर
  rationale: इस प्रसंग में καμάτων कठिन और अनिश्चित पाठ है। युद्ध-सामग्री की सूची में इसे प्रायः लंबे डंडेदार हथियारों से जोड़ा जाता है; ‘भालों के ढेर’ सुसंगत अर्थ देता है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: βελῶν βολάς
  choice: फेंके जाने वाले अस्त्रों की बौछारें
  rationale: βέλος तीर, बरछी अथवा अन्य प्रक्षेप्य हो सकता है और βολή उसका फेंका या चलाया जाना; यह अनुवाद केवल तीरों तक अर्थ को सीमित नहीं करता।
- source_word: χρυσέων κόσμων ἐκλάμψεις
  choice: सोने के आभूषणों की चमक
  rationale: κόσμος सजावट, अलंकरण या सुसज्जित सामग्री का बोध करा सकता है; ‘आभूषण’ मूल का सीधा अर्थ रखते हुए सैन्य सजावट की सम्भावना खुली रखता है।
- source_word: παντοίους θωρακισμούς
  choice: हर प्रकार के कवच
  rationale: θωρακισμός शरीर की रक्षात्मक साज-सज्जा या कवच है और παντοίους उसकी विविधता पर बल देता है।
