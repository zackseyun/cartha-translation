- source_word: γενέσθαι
  choice: होगा
  rationale: संदर्भ में यह दृश्य के अनुकूल परिणाम या अर्थ की प्रत्याशा व्यक्त कर सकता है। हिन्दी का ‘होगा’ इस संभावित परिणामसूचक भाव को संक्षेप में रखता है; अधिक स्थिर अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
