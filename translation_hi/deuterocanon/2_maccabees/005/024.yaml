base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/024.yaml
  text: But he sent Apollonius[a], the chief polluter, with an army of twenty-two thousand, commanding him to slaughter all those in their prime and to sell the women and the younger ones.
translation:
  language: hi
  text: पर उसने अपोल्लोनियुस, अपवित्रता के सरगना, को बाईस हज़ार की सेना के साथ भेजा और उसे आज्ञा दी कि जो अपनी आयु के पूरे जोश में थे, उन सबको निर्दयता से मार डाले, और स्त्रियों तथा कम उम्र के लोगों को बेच दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, संभवतः दास बनाकर बेच दे। यूनानी पाठ में केवल “बेच दे” है, यद्यपि इस संदर्भ में दासत्व के लिए बेचना निहित जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: भेजा
  rationale: πέμπω के सामान्य अर्थ ‘भेजना’ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: μυσάρχην
  choice: अपवित्रता के सरदार
  rationale: यह दुर्लभ और निंदात्मक पद दूषण या अपवित्रता से नेतृत्व का भाव जोड़ता है; इसे किसी तटस्थ सरकारी पद के रूप में प्रस्तुत नहीं किया गया।
- source_word: μετὰ στρατεύματος
  choice: सेना के साथ
  rationale: στράτευμα सैन्य दल या सेना को सूचित करता है; अगले बड़े संख्याबल के संदर्भ में ‘सेना’ सहज है।
- source_word: δισμυρίους δὲ τοῖς δισχιλίοις
  choice: बाईस हज़ार सैनिकों की
  rationale: यूनानी पदबंध बीस हज़ार और दो हज़ार, अर्थात कुल बाईस हज़ार, व्यक्त करता है। हिन्दी में संख्या को स्वाभाविक ढंग से दिया गया है; ‘सैनिकों’ को सेना की संख्या स्पष्ट करने के लिए संदर्भानुसार जोड़ा गया है।
- source_word: προστάξας
  choice: उसे आज्ञा दी
  rationale: कृदंत अपोल्लोनियुस को दिए गए आदेश का परिचय देता है; हिन्दी में समन्वित क्रिया-वाक्य अधिक स्वाभाविक है।
- source_word: τοὺς ἐν ἡλικίᾳ πάντας
  choice: जो भी अपनी पूरी जवानी में हों, उन सबको
  rationale: पदबंध पूर्ण आयु या जीवन की शारीरिक परिपक्व अवस्था का संकेत देता है। ‘पूरी जवानी’ कानूनी वयस्कता या केवल युद्धयोग्य पुरुषों को अनावश्यक रूप से निश्चित किए बिना मूल भाव रखता है।
- source_word: κατασφάξαι
  choice: निर्ममता से मार डाले
  rationale: यह संयुक्त क्रिया साधारण हत्या से अधिक क्रूर वध का भाव रखती है। हिन्दी में ‘निर्ममता से मार डाले’ उस तीव्रता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰς δὲ γυναῖκας
  choice: स्त्रियों
  rationale: यहाँ γυναῖκες का व्यापक अर्थ ‘स्त्रियाँ’ है, न कि केवल ‘पत्नियाँ’।
- source_word: τοὺς νεωτέρους
  choice: कम उम्र वालों
  rationale: νεωτέρους तुलनात्मक रूप है और अपेक्षाकृत कम आयु के लोगों को व्यापक रूप से दर्शाता है; ‘बच्चे’ या ‘युवक’ कहने से आयु-सीमा अनावश्यक रूप से संकुचित होती।
- source_word: πωλεῖν
  choice: बेच दे
  rationale: मूल क्रिया का सीधा अर्थ ‘बेचना’ है। युद्ध-संदर्भ में दासत्व के लिए बेचना संभवतः निहित है, पर वह क्रिया में स्पष्ट रूप से नहीं कहा गया।
theological_decisions:
- issue: क्या πωλεῖν में निहित दासत्व को मुख्य पाठ में स्पष्ट किया जाए
  choice: बेच दे
  alternative: दास बनाकर बेच दे
  rationale: ऐतिहासिक संदर्भ दासत्व की ओर प्रबल संकेत करता है, किंतु यूनानी पाठ केवल ‘बेचना’ कहता है। मुख्य पाठ मूल की सीमा बनाए रखता है और निहित अर्थ को पाद-टिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण कथात्मक शैली अपनाई गई है। दुर्लभ निंदात्मक उपाधि का अपमानसूचक स्वर सुरक्षित रखा गया है; आयु-वर्गों और दासत्व के विषय में मूल पाठ से अधिक निश्चितता नहीं जोड़ी गई।
