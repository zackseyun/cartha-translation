  text: When the king was informed about what had happened[a], he concluded that Judea was in revolt; so, after setting out from Egypt, savage in spirit, he took the city by force of arms.
translation:
  language: hi
  text: जब राजा को हुई घटनाओं के बारे में बताया गया, तो उसने समझ लिया कि यहूदिया विद्रोह कर रहा था। इसलिए वह मिस्र से चल पड़ा और, भीतर से पशु-सा क्रूर होकर, उसने हथियारों के बल पर नगर पर अधिकार कर लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “भाले से जीता हुआ”; यह यूनानी सैन्य मुहावरा सशस्त्र आक्रमण करके किसी नगर पर अधिकार करने के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεστώτων ... τῷ Βασιλεῖ περὶ τῶν γεγονότων
  choice: जब राजा को हुई घटनाओं के बारे में बताया गया
  rationale: यह संबंधवाचक निरपेक्ष रचना उन घटनाओं की सूचना राजा के सामने रखे जाने को व्यक्त करती है। हिंदी में कर्मवाच्य रूप स्वाभाविक है और सूचना देने वालों की पहचान अनावश्यक रूप से निश्चित नहीं करता।
- source_word: διέλαβεν
  choice: उसने समझ लिया
  rationale: यह शब्द मिली हुई सूचना के आधार पर निर्णय या निष्कर्ष बनाने का भाव देता है। ‘समझ लिया’ राजा के निष्कर्ष को व्यक्त करता है, पर उसे वस्तुगत रूप से सही घोषित नहीं करता।
- source_word: ἀποστατεῖν
  choice: विद्रोह कर रहा था
  rationale: यहाँ प्रसंग राजकीय सत्ता के विरुद्ध राजनीतिक विद्रोह का है, धार्मिक धर्मत्याग का नहीं। अपूर्ण क्रियात्मक भाव जारी विद्रोह को दर्शाता है।
- source_word: ἀναζεύξας
  choice: मिस्र से चल पड़ा
  rationale: क्रिया का मूल भाव पड़ाव उठाकर प्रस्थान करना है। ‘चल पड़ा’ क्रम और गति को स्वाभाविक आधुनिक हिंदी में रखता है, बिना अतिरिक्त सैन्य विवरण जोड़े।
- source_word: θηριωμένος τῇ ψυχῇ
  choice: मन में हिंस्र पशु जैसा होकर
  rationale: यह अनुवाद पशु-सदृश भीतरी क्रूरता के यूनानी रूपक को बनाए रखता है और केवल ‘क्रोधित’ कहकर उसकी तीव्रता कम नहीं करता।
- source_word: δοριαλώτον
  choice: हथियारों के बल पर
  rationale: इस विशेषण का शाब्दिक चित्र ‘भाले से जीता हुआ’ है और इसका प्रयोग सशस्त्र आक्रमण द्वारा नगर जीतने के सैन्य अर्थ में हुआ है। मुख्य पाठ में स्वाभाविक मुहावरा रखा गया है और शाब्दिक चित्र पादटिप्पणी में दिया गया है।
- source_word: ἔλαβεν τὴν μὲν πόλιν
  choice: उसने ... नगर पर अधिकार कर लिया
  rationale: λαμβάνω का यहाँ नगर को सैन्य रूप से जीतने या अपने अधिकार में लेने का अर्थ है। यह हिंदी अभिव्यक्ति अगले सैन्य विशेषण के साथ सहज बैठती है।
