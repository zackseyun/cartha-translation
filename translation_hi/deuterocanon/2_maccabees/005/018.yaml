base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/018.yaml
  text: But if we had not become involved in many sins[a], then, just as Heliodorus, who was sent by King Seleucus to inspect the treasury, was immediately scourged and turned back from his boldness when he came forward, so also would we have been struck down.
translation:
  language: hi
  text: पर यदि हम बहुत-से पापों में उलझ न गए होते,[a] तो, जिस प्रकार राजा सेल्यूकस ने कोषागार का निरीक्षण करने के लिए हेलियोदोरस को भेजा था और आगे बढ़ने पर उसे तुरंत कोड़े लगाए गए तथा उसके दुस्साहस से उसे विरत कर दिया गया, उसी प्रकार हमें भी मार गिराया जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी का शाब्दिक भाव है, “यदि ऐसा न हुआ होता कि हम बहुत-से पापों में उलझ गए थे ... राजा सेल्यूकस द्वारा कोषागार के निरीक्षण के लिए भेजा गया यह व्यक्ति, आगे बढ़ने पर, तुरंत कोड़े लगाए जाने से अपने दुस्साहस से विरत कर दिया गया।” मुख्य पाठ तुलना में निहित परिणाम को स्पष्ट करता है: हेलियोदोरस के साथ जो हुआ, वैसा ही हमारे साथ भी होता।'
    reason: स्रोत में शर्तात्मक तुलना का परिणाम स्पष्ट रूप से व्यक्त नहीं है; हिन्दी मुख्य पाठ संदर्भ से निहित परिणाम को स्पष्ट करता है।
lexical_decisions:
- source_word: συνέβην προενέχεσθαι πολλοῖς ἁμαρτήμασιν
  choice: यदि ऐसा न हुआ होता कि हम बहुत-से पापों में उलझ गए थे
  rationale: यह संयोजन अतीत की तथ्य-विरुद्ध शर्त व्यक्त करता है। ‘पापों में उलझ गए थे’ नैतिक संलिप्तता तथा क्रिया के मध्य/कर्मवाच्य भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπὶ τὴν ἐπίσκεψιν τοῦ γαζοφυλακίου
  choice: कोषागार का निरीक्षण करने के लिए
  rationale: ἐπίσκεψις यहाँ आधिकारिक जाँच या निरीक्षण के उद्देश्य को दर्शाता है; γαζοφυλάκιον के लिए ‘कोषागार’ संक्षिप्त और संदर्भानुकूल है।
- source_word: προαχθεὶς
  choice: जब ... आगे बढ़ा
  rationale: संदर्भ में यह कार्रवाई के लिए आगे आने या बढ़ने का वर्णन करता है; हिन्दी में कालवाचक उपवाक्य घटनाक्रम को स्पष्ट रखता है।
- source_word: παραχρῆμα μαστιγωθεὶς
  choice: तुरंत कोड़े पड़ते
  rationale: παραχρῆμα तत्काल परिणाम बताता है और μαστιγόω कठोर कोड़े लगाए जाने को; ‘कोड़े पड़ते’ सामान्य आधुनिक हिन्दी में गंभीरता बनाए रखता है।
- source_word: ἀνετράπη τοῦ θράσους
  choice: उसका दुस्साहस रोक दिया जाता
  rationale: वाक्यांश उसके धृष्ट साहस के पलट दिए जाने या विफल कर दिए जाने को व्यक्त करता है। ‘दुस्साहस रोक दिया जाता’ नैतिक अर्थ और निष्क्रिय भाव दोनों सुरक्षित रखता है।
theological_decisions:
- issue: शर्त के परिणाम-वाक्य का यूनानी में निहित रहना
  choice: हिन्दी में ‘और हमें भी मार गिराया जाता’ जोड़कर निहित तुलना स्पष्ट की गई
  alternative: 'वाक्य को यूनानी की तरह व्याकरणतः अधूरा छोड़ना: केवल हेलियोदोरस के दंड पर समाप्त करना'
  rationale: यूनानी पाठ का शर्त-वाक्य और καθάπερ से आरंभ तुलना यह निहित करते हैं कि पापों के कारण परिस्थिति भिन्न न होती, तो हेलियोदोरस जैसा दंड ‘हमें’ भी मिलता। स्पष्ट किया गया अंश इसी संदर्भगत अर्थ को सामने लाता है, कोई पृथक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: ἁμαρτήμασιν का नैतिक आशय
  choice: ‘पापों’
  alternative: ‘अपराधों’ या ‘गलत कामों’
  rationale: संदर्भ सामूहिक नैतिक दोष और उसके परिणाम का है; ‘पाप’ स्रोत के धार्मिक-नैतिक तनाव को बिना हल्का किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘हेलियोदोरस’ और ‘सेल्यूकस’ प्रचलित यूनानी नाम-लिप्यंतरण हैं। वाक्य की जटिल शर्तात्मक संरचना बनाए रखते हुए हिन्दी क्रम को स्वाभाविक किया गया है।
