translation:
  language: hi
  text: परन्तु प्रभु ने उस स्थान के कारण राष्ट्र को नहीं चुना, बल्कि राष्ट्र के कारण उस स्थान को चुना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλʼ
  choice: परन्तु
  rationale: यह पिछले कथन के साथ स्पष्ट विरोध दर्शाता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διὰ यहाँ आधार अथवा कारण प्रकट करता है। दोनों खंडों में एक ही अभिव्यक्ति रखकर यूनानी वाक्य का संतुलित विरोध सुरक्षित रखा गया है।
- source_word: τόπον
  choice: उस स्थान
  rationale: मूल में सामान्य शब्द ‘स्थान’ है; संदर्भ यरूशलेम और मन्दिर-स्थल की ओर संकेत करता है, पर अनुवाद इसे ‘पवित्रस्थान’ या ‘मन्दिर’ बनाकर आवश्यकता से अधिक विशिष्ट नहीं करता। हिन्दी में निश्चित संदर्भ को स्वाभाविक बनाने के लिए ‘उस’ जोड़ा गया है।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: यहाँ शब्द यहूदी लोगों को एक सामूहिक जातीय-राष्ट्रीय समुदाय के रूप में दर्शाता है। ‘राष्ट्र’ इस अर्थ और स्थान के साथ मूल विरोध को बनाए रखता है; ‘जाति’ आधुनिक हिन्दी में जाति-व्यवस्था का अनचाहा अर्थ जगा सकता है।
- source_word: κύριος
  choice: प्रभु
  rationale: ईश्वर के लिए κύριος का प्रचलित, गरिमापूर्ण और स्वाभाविक हिन्दी रूप।
- source_word: ἐξελέξατο
  choice: चुना
  rationale: अओरिस्ट मध्यम रूप का सीधा और स्वाभाविक अनुवाद है। हिन्दी में क्रिया दोनों विरोधी खंडों में दोहराई गई है, जिससे आशय स्पष्ट और अलंकारिक संतुलन सुरक्षित रहता है।
theological_decisions:
- issue: पवित्र स्थान और चुने हुए राष्ट्र के बीच सम्बन्ध
  choice: वाक्य स्पष्ट करता है कि प्रभु ने राष्ट्र के कारण स्थान को चुना, न कि स्थान के कारण राष्ट्र को।
  alternative: स्थान पहले और स्वतंत्र रूप से चुना गया, और उसी के कारण राष्ट्र चुना गया।
  rationale: यूनानी पाठ का ‘नहीं… बल्कि…’ वाला प्रतिलोम विरोध स्पष्ट है। अनुवाद स्थान की अपेक्षा राष्ट्र की प्राथमिकता को उसी सीमा तक व्यक्त करता है, बिना इसके व्यापक धर्मवैज्ञानिक परिणामों को स्वयं तय किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। मूल की संक्षिप्त, संतुलित प्रतिलोम रचना को स्वाभाविक हिन्दी वाक्यक्रम में सुरक्षित रखा गया है।
