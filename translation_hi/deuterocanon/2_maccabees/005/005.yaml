base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/005.yaml
  text: But when a false rumor arose that Antiochus had passed from life[a], Jason, taking no fewer than a thousand men, launched a sudden attack against the city. When those on the wall had been driven back, and at last the city was already being taken, Menelaus fled into the citadel.
translation:
  language: hi
  text: जब यह झूठी अफ़वाह फैल गई कि अन्तियुखुस इस जीवन से जा चुका था[a], तब यासोन कम-से-कम एक हज़ार पुरुषों को साथ लेकर अचानक नगर पर चढ़ आया। नगर की दीवार पर जो लोग थे, उन्हें पीछे धकेल दिए जाने के बाद, और जब अन्ततः नगर पर अधिकार किया जा रहा था, तब मेनेलाउस भागकर गढ़ में चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक अर्थ है, ‘उसने जीवन बदल लिया था’; यह अन्तियुखुस की मृत्यु कहने का एक मुहावरेदार ढंग है।
    reason: lexical_alternative
