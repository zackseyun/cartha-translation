lexical_decisions:
- source_word: θεωρίαν
  choice: सार्वजनिक तमाशे
  rationale: θεωρία यहाँ देखने के सार्वजनिक अवसर, उत्सवी प्रदर्शन या तमाशे को सूचित कर सकता है। ‘सार्वजनिक तमाशा’ ठोस अर्थ रखता है और संदर्भ में लोगों के एकत्र होने का संकेत देता है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: συνεκέκλεισεν
  choice: एक जगह घेरकर रखा
  rationale: क्रिया समूह को एक साथ बंद या सीमित कर देने का बोध कराती है। यह हिन्दी में स्वाभाविक रहते हुए उसके बाध्यकारी भाव को बनाए रखता है।
- source_word: εἰσδραμὼν
  choice: झपट पड़ा
  rationale: कृदन्त तेज और बलपूर्वक नगर में प्रवेश को व्यक्त करता है; ‘झपट पड़ा’ हिंसक गति को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: σὺν τοῖς ὅπλοις
  choice: हथियारों के साथ
  rationale: यूनानी पाठ सीधे हथियारों का उल्लेख करता है; इसलिए केवल ‘हथियारबंद होकर’ कहने के बजाय ठोस शब्दावली रखी गई है।
- source_word: ἱκανὰ ... πλήθη
  choice: बड़ी संख्या में लोगों को
  rationale: ἱκανὰ मात्रा की पर्याप्त विशालता बताता है और πλήθη बहुसंख्या को। हिन्दी में यह वाक्यांश अनिश्चित किंतु बड़े पैमाने को स्पष्ट रखता है।
- source_word: κατέστησεν πλήθη
  choice: मार गिराया
  rationale: यह संक्षिप्त यूनानी अभिव्यक्ति सशस्त्र आक्रमण के संदर्भ में बड़ी संख्या में लोगों को गिराने अर्थात मार डालने का परिणाम बताती है। ‘मार गिराया’ हिंसक परिणाम को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
