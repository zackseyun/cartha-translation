base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/017.yaml
  text: And Antiochus became arrogant in mind[a], not perceiving that the Master had been angered for a little while because of the sins of those dwelling in the city[c][b]; therefore there came to be disregard for the place.
translation:
  language: hi
  text: और अन्तियोकुस मन में घमंडी हो गया[a]। वह यह नहीं समझ सका कि नगर के निवासियों के पापों के कारण स्वामी[b] थोड़े समय के लिए क्रोधित हुआ था; इसी कारण उस स्थान की उपेक्षा हुई[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक बिंब: “मन में ऊँचा उठ गया”; यूनानी मुहावरा उसके घमंडी आत्म-उत्थान को दर्शाता है।'
    reason: lexical_alternative
  - marker: b
    text: “स्वामी” यूनानी δεσπότης का अनुवाद है; यह κύριος (“प्रभु”) से भिन्न पदवी है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में केवल “स्थान” है; प्रसंग में संकेत पवित्र स्थान, अर्थात मंदिर, की ओर है। “उपेक्षा” का अनुवाद “अनदेखी” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμετεωρίζετο τὴν διάνοιαν
  choice: मन में घमंडी हो गया
  rationale: यूनानी मुहावरा शाब्दिक रूप से मन के ऊँचा उठने का बिंब देता है, पर प्रसंग में अन्तियोकुस के अहंकारी आत्म-उत्थान को व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए आंतरिक मनोभाव को बनाए रखता है।
- source_word: οὐ συνορῶν
  choice: वह यह न समझ सका
  rationale: कृदन्त का आशय वास्तविक परिस्थिति को न पहचानने या न समझने से है; हिन्दी में यह प्रयोग संज्ञानात्मक अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἀπώργισται
  choice: क्रोधित हुआ था
  rationale: पूर्णकालीन रूप पहले उत्पन्न हुए और अब प्रासंगिक क्रोध की अवस्था बताता है। हिन्दी भूतपूर्ण प्रयोग इस परिणामात्मक पक्ष को पर्याप्त रूप से व्यक्त करता है।
- source_word: βραχέως
  choice: थोड़े समय के लिए
  rationale: यह स्वामी के क्रोध की सीमित अवधि बताता है और पद के महत्वपूर्ण कालगत बल को स्पष्ट रखता है।
- source_word: ὁ δεσπότης
  choice: स्वामी
  rationale: δεσπότης अधिकार-संपन्न मालिक या स्वामी का बोध कराता है और κύριος से भिन्न पदवी है। ‘स्वामी’ इस भेद को ‘प्रभु’ में समतल किए बिना स्वाभाविक हिन्दी देता है।
- source_word: πάρορασις
  choice: उपेक्षा
  rationale: शब्द अनदेखी, ध्यान न देने या उपेक्षा का अर्थ रखता है। यहाँ यह पवित्र स्थान के अस्थायी रूप से अपवित्रीकरण के लिए खुला रह जाने को संकेतित करता है, पर उसके तंत्र को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: περὶ τὸν τόπον
  choice: उस पवित्र स्थान की
  rationale: τόπος का निकट प्रसंग मंदिर-स्थल की ओर संकेत करता है। ‘पवित्र’ संदर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल के अधिक सामान्य ‘स्थान’ को दर्ज करती है।
- source_word: τῶν τὴν πόλιν οἰκούντων
  choice: नगर के निवासियों
  rationale: यह सहभागी वाक्यांश का संक्षिप्त, स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
theological_decisions:
- issue: δεσπότης को ईश्वरीय पदवी के रूप में प्रस्तुत करना
  choice: स्वामी
  alternative: प्रभु; सर्वाधिपति
  rationale: मूल में κύριος नहीं बल्कि δεσπότης है। ‘स्वामी’ दोनों यूनानी पदवियों का भेद बचाता है और किसी विशिष्ट सम्प्रदायगत अर्थ को नहीं जोड़ता।
- issue: पवित्र स्थान के अस्थायी रूप से अरक्षित होने का अर्थ
  choice: उस पवित्र स्थान की उपेक्षा हुई
  alternative: उस स्थान को अनदेखा किया गया; उस स्थान पर ध्यान नहीं दिया गया
  rationale: यह अनुवाद अन्तियोकुस की सफलता को परमेश्वर की अक्षमता नहीं बताता, बल्कि नगरवासियों के पापों से जुड़े सीमित अवधि के क्रोध और स्थान की उपेक्षा के बीच मूल पाठ का संबंध बनाए रखता है। उपेक्षा किसने या किस प्रकार की, इसे पाठ से अधिक स्पष्ट नहीं किया गया।
- issue: ἀπώργισται की वाच्यता
  choice: क्रोधित हुआ था
  alternative: क्रोध दिलाया गया था; क्रोध भड़काया गया था
  rationale: यूनानी रूप की रूपात्मक वाच्यता को यांत्रिक रूप से हिन्दी में उतारना अस्वाभाविक और भ्रमकारी होता। चुना हुआ रूप परिणामी क्रोधावस्था को रखता है, जबकि कारण ‘पापों के कारण’ से स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-विन्यास को हिन्दी के अनुरूप विभाजित किया गया है। ‘अन्तियोकुस’ नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
