lexical_decisions:
- source_word: κατέλειπεν
  choice: छोड़ रखे थे
  rationale: क्रिया का मूल अर्थ किसी को पीछे या किसी स्थान पर छोड़ना है। संदर्भ में अधिकारियों को पद पर छोड़ जाने का भाव है; ‘छोड़ रखे थे’ मूल अभिव्यक्ति और प्रशासनिक आशय दोनों को बनाए रखता है।
- source_word: ἐπιστάτας
  choice: अधिकारी
  rationale: यह शब्द दूसरों के ऊपर ठहराए गए व्यक्तियों को सूचित करता है। ‘अधिकारी’ आधुनिक हिन्दी में स्वाभाविक है और किसी अत्यधिक विशिष्ट प्रशासनिक पद का अनुमान नहीं लगाता।
- source_word: τοῦ κακοῦν
  choice: दुर्व्यवहार करने के लिए
  rationale: सव्ययी क्रियार्थक रूप उद्देश्य या कार्य बताता है। ‘दुर्व्यवहार’ लगातार हानि पहुँचाने और बुरा व्यवहार करने का व्यापक भाव देता है, जबकि केवल राजनीतिक दमन तक अर्थ को सीमित नहीं करता।
- source_word: τὸ γένος
  choice: राष्ट्र
  rationale: यहाँ संकेत यहूदी लोगों की सामूहिक जातीय-राष्ट्रीय पहचान की ओर है। ‘राष्ट्र’ उस सामूहिकता को व्यक्त करता है और आधुनिक हिन्दी में ‘जाति’ से उत्पन्न होनेवाली जाति-व्यवस्था संबंधी अस्पष्टता से बचाता है।
- source_word: τὸ μὲν γένος Φρύγα
  choice: जन्म से फ़्रूगिया का
  rationale: वाक्यांश फ़िलिप्पुस की जातीय या भौगोलिक उत्पत्ति बताता है। ‘जन्म से’ τρόπος के साथ आनेवाले स्वभावगत विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τὸν δὲ τρόπον
  choice: स्वभाव में
  rationale: τρόπος यहाँ आचरण, प्रवृत्ति या चरित्र का बोध कराता है। ‘स्वभाव में’ जन्मगत मूल और नैतिक चरित्र के बीच का विरोध सहज रूप में रखता है।
- source_word: βαρβαρώτερον ἔχοντα
  choice: और भी अधिक बर्बर था
  rationale: यूनानी पाठ में तुलनात्मक रूप स्पष्ट है। ‘बर्बर’ लेखक की तीखी ऐतिहासिक और नैतिक भाषा को नरम किए बिना सुरक्षित रखता है।
- source_word: τοῦ καταστήσαντος
  choice: उसे नियुक्त करनेवाले से
  rationale: कृदन्त उस शासक को दर्शाता है जिसने फ़िलिप्पुस को पद पर स्थापित किया। यह रूप तुलना को स्पष्ट और संक्षिप्त रखता है।
