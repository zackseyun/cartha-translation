  text: उसने लोगों को सताने के लिए अधिकारियों को भी छोड़ रखा था—यरूशलेम में फ़िलिप्पुस को, जो जन्म से फ़्रिजियाई था, पर स्वभाव में उसे नियुक्त करनेवाले से भी अधिक बर्बर था[b];
