translation:
  language: hi
  text: युवाओं और वृद्धों[a] की हत्या हो रही थी; पुरुषों, स्त्रियों और बच्चों का संहार किया जा रहा था; और कुँवारी युवतियों[b] और शिशुओं का निर्दय वध हो रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युवकों और बुज़ुर्गों”; यूनानी शब्दों को अधिक विशिष्ट अर्थ में लिया जा सकता है, पर यहाँ प्रसंग युवाओं और वृद्धों के सामान्य आयु-विरोध का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द विशेष रूप से ऐसी अविवाहित युवतियों को सूचित करता है जिन्हें कुँवारी माना गया है; केवल “युवतियों” कहना भी संभव है, पर वह कम सटीक होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνετο
  choice: हो रही थी / किया जा रहा था
  rationale: अपूर्ण भूतकाल उस समय जारी घटनाक्रम को दिखाता है; हिन्दी में सूची के प्रत्येक खंड के साथ स्वाभाविक निष्क्रिय क्रिया देकर यह पक्ष सुरक्षित रहता है।
- source_word: νέων καὶ πρεσβυτέρων
  choice: जवानों और बूढ़ों
  rationale: यहाँ पद या सामाजिक कार्यालय की अपेक्षा आयु का व्यापक विरोध अधिक संभावित है। 'जवानों और बूढ़ों' सामान्य और स्पष्ट हिन्दी है।
- source_word: ἀναίρεσις
  choice: हत्या
  rationale: संदर्भ में इसका अर्थ हिंसक रूप से प्राण लेना है। 'हत्या' गंभीर है, पर अंतिम σφαγαί की अधिक तीव्र कसाई-जैसी छवि को अलग रहने देता है।
- source_word: ἀφανισμός
  choice: संहार
  rationale: व्यक्तियों के नाश या मिटा दिए जाने का प्रबल भाव व्यक्त करता है; 'विनाश' की अपेक्षा मानव-हत्या के संदर्भ में अधिक स्वाभाविक है, जबकि पूर्ण जातिनाश का अतिरिक्त दावा नहीं जोड़ता।
- source_word: παρθένων
  choice: कुँवारी युवतियों
  rationale: यह चयन स्त्रीलिंग, युवावस्था और कुँवारेपन की चिह्नित स्थिति—तीनों को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: νηπίων
  choice: शिशुओं
  rationale: बहुत छोटे, विशेषकर अभी बोल न सकने वाले बच्चों के लिए सटीक और गरिमापूर्ण हिन्दी शब्द।
- source_word: σφαγαί
  choice: मार डाला जा रहा था
  rationale: σφαγαί क्रूर वध को सूचित करता है। हिन्दी में 'वध किए जा रहे थे' यहाँ कुछ अनुष्ठानिक लग सकता है और 'कत्लेआम' सामूहिक घटना का अतिरिक्त बोध दे सकता है; 'मार डाला' हिंसक परिणाम को स्वाभाविक ढंग से रखता है।
