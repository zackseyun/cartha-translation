  source_fidelity: The three-part catalogue and its escalating violence are retained, and संहार suitably conveys ἀφανισμός. However, जवानों can conventionally imply males, whereas νέων is best left as a general age category here. The final मार डाला जा रहा था weakens the distinct nominal and especially violent force of σφαγαί.
  naturalness: The proposed revision uses natural modern Hindi, preserves the report-like imperfect with repeated ongoing constructions, and makes the final clause grammatically and rhetorically stronger.
  terminology: युवाओं और वृद्धों preserves the broad age contrast without introducing an exclusively male sense. कुँवारी युवतियों accurately retains the marked status of παρθένων. निर्दय वध conveys the intensified slaughter sense of σφαγαί without importing the event-wide implication that कत्लेआम can carry.
  issues:
  - severity: medium
    issue: जवानों may be read as specifically male.
    rationale: Although it can be broad in some contexts, modern Hindi commonly uses जवान for young men; νέων is not explicitly male in this age-pairing context.
  - severity: medium
    issue: The rendering of σφαγαί is insufficiently distinct from the preceding हत्या.
    rationale: मार डाला जा रहा था expresses killing but does not adequately represent the plural noun and stronger slaughter/butchery sense of σφαγαί.
