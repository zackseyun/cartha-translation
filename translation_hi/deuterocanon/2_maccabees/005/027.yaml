base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/027.yaml
  text: But Judas[a], who was also called Maccabeus, having become about the tenth and having withdrawn, lived in the mountains like a wild animal with those who were with him, and they continued feeding on vegetation so as not to share in the defilement.
translation:
  language: hi
  text: पर यहूदा, जो मक्काबी भी कहलाता था, लगभग दस जनों के दल में रह गया था[a]। पीछे हटकर वह अपने साथियों के साथ पहाड़ों में जंगली पशुओं की तरह जीवन बिताने लगा। वे अशुद्धता में भागी न होने के लिए हरी वनस्पति का भोजन करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश संक्षिप्त और अनुमानसूचक है। इसका अधिक शाब्दिक रूप ‘लगभग दसवाँ हो गया’ है। आशय संभवतः यह है कि यहूदा लगभग दस जनों के दल में रह गया था, पर वाक्यांश का सटीक अभिप्राय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας ... ὁ καὶ Μακκαβαῖος
  choice: यहूदा, जो मक्काबी भी कहलाता था
  rationale: ὁ καὶ वैकल्पिक नाम या उपाधि का परिचय देता है। हिन्दी में प्रचलित ‘मक्काबी’ स्वाभाविक और पहचानने योग्य रूप है।
- source_word: δέκατός που γενηθεὶς
  choice: लगभग दस जनों में से एक रह गया था[a]
  rationale: που अनुमान या अनिश्चितता व्यक्त करता है। संक्षिप्त यूनानी वाक्यांश का संभावित आशय यह है कि यहूदा का दल घटकर लगभग दस लोगों का रह गया था; पादटिप्पणी इसकी व्याकरणिक संक्षिप्तता और वैकल्पिक शाब्दिक रूप को सुरक्षित रखती है।
- source_word: ἀναχωρήσας
  choice: पीछे हटकर
  rationale: यह खतरे या सार्वजनिक स्थान से हटने को व्यक्त करता है और अनावश्यक रूप से पूर्ण सैन्य पलायन का अर्थ नहीं जोड़ता।
- source_word: ἐν τοῖς ὄρεσι
  choice: पहाड़ों में
  rationale: स्थानसूचक यूनानी पद का सीधा और स्वाभाविक अनुवाद।
- source_word: θηρίων τρόπον διέζη
  choice: जंगली पशुओं की तरह जीवन बिताने लगा
  rationale: यह जंगली पशुओं के समान जीवन-यापन करने की उपमा को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σὺν τοῖς μετʼ αὐτοῦ
  choice: अपने साथियों के साथ
  rationale: यूनानी पद यहूदा के साथ रहने वालों को सामान्य रूप से दर्शाता है; ‘साथियों’ में उनकी कोई अतिरिक्त भूमिका निर्धारित नहीं की गई है।
- source_word: τὴν χορτώδη τροφὴν
  choice: हरी वनस्पति
  rationale: यह हरी, घास-पात जैसी वनस्पति से मिलने वाले भोजन को दर्शाता है और आधुनिक हिन्दी में सहज है।
- source_word: σιτούμενοι διετέλουν
  choice: खाते रहे
  rationale: दुरेटिव भाव लगातार उसी प्रकार का भोजन करते रहने को व्यक्त करता है।
- source_word: πρὸς τῷ μὴ μετασχεῖν τοῦ μολυσμοῦ
  choice: अशुद्धता में सहभागी न होने के लिए
  rationale: μετασχεῖν का सहभागी होना और μολυσμός का धार्मिक तथा नैतिक अशुद्धता का व्यापक भाव सुरक्षित रहता है।
theological_decisions:
- issue: μολυσμός की प्रकृति
  choice: अशुद्धता
  alternative: केवल विधिवत अशुद्धता; सामान्य दूषण
  rationale: संदर्भ में निषिद्ध भोजन, धार्मिक समझौते और धर्मत्याग से जुड़ा दूषण संभावित है। ‘अशुद्धता’ धार्मिक गंभीरता बनाए रखती है, पर अर्थ को केवल अनुष्ठानिक श्रेणी तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘मक्काबी’, ‘अशुद्धता’ और ‘सहभागी’ धार्मिक संदर्भ को स्पष्ट रखते हैं, जबकि अस्पष्ट यूनानी संख्या-वाक्यांश को पादटिप्पणी में खुला रखा गया है।
