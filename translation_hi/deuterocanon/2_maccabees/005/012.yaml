  text: And he ordered the soldiers to cut down without mercy those they encountered[b][a], and to slaughter those who went up into the houses.
translation:
  language: hi
  text: और उसने सैनिकों को आदेश दिया कि जिन लोगों से उनका सामना हो, उन्हें बिना दया के काट डालें,[a] और जो लोग घरों में ऊपर चढ़ते हों, उन्हें बेरहमी से मार डालें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उनके रास्ते में पड़ें।” यूनानी कृदंत का अर्थ सैनिकों के मार्ग में आने वाले या उनसे सामना होने वाले लोग हो सकता है; इससे यह संकेत नहीं मिलता कि पीड़ितों ने आक्रमण आरम्भ किया था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “घरों में ऊपर चढ़ने वालों को।” सम्भवतः आशय सीढ़ियों से घरों के ऊपरी भागों या ऊपरी कमरों में चढ़ने से है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: आदेश दिया
  rationale: यह क्रिया स्पष्ट सैन्य आदेश को व्यक्त करती है; ‘आदेश दिया’ आधुनिक मानक हिन्दी में स्वाभाविक और पर्याप्त रूप से सशक्त है।
- source_word: κόπτειν
  choice: काट डालें
  rationale: κόπτω के प्रहार करने या काटने के मूल बिंब और इस हिंसक प्रसंग में उसके प्राणघातक अर्थ—दोनों को बनाए रखता है।
- source_word: ἀφειδῶς
  choice: बिना दया के
  rationale: यह बिना बख्शे या बिना तरस खाए किए गए क्रूर आक्रमण का अर्थ सामान्य पाठक के लिए साफ़ करता है।
- source_word: τοὺς ἐμπίπτοντας
  choice: जो भी उनके सामने पड़े
  rationale: ἐμπίπτω यहाँ सैनिकों के रास्ते में आने या उनसे सामना होने का अर्थ दे सकता है। यह अनुवाद वास्तविक अस्पष्टता को कुछ हद तक बनाए रखता है और पीड़ितों को आक्रमणकारी नहीं ठहराता।
- source_word: ἀναβαίνοντας
  choice: जो लोग घरों में ऊपर चढ़ रहे हों
  rationale: ἀναβαίνω के ‘ऊपर जाने/चढ़ने’ के स्थानिक भाव को सुरक्षित रखता है; संदर्भ घरों की सीढ़ियों, छतों या ऊपरी भागों की ओर चढ़ने का हो सकता है।
- source_word: κατασφάζειν
  choice: संहार कर दें
  rationale: यह तीव्र क्रिया निर्मम ढंग से मार डालने का भाव रखती है; ‘संहार’ हिंसा की गंभीरता और व्यापकता को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: οἰκίαις
  choice: घरों
  rationale: यहाँ भौतिक निवास-स्थानों का उल्लेख है, इसलिए ‘घरों’ उपयुक्त है।
