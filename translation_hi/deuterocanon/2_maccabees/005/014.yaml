    text: यूनानी में शाब्दिक रूप से ‘हाथों के नियमों में’ है। यह एक अस्पष्ट अभिव्यक्ति है, जिसे यहाँ हिंसा या मनुष्यों के हाथों दी गई मृत्यु के अर्थ में समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, ‘दास बनाकर बेचे गए’; यूनानी में केवल ‘बेचे गए’ है, पर प्रसंग में दासता निहित है।
    reason: lexical_alternative
