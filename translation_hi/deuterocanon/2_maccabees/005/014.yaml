  text: और पूरे तीन दिनों में अस्सी हज़ार लोग नष्ट कर दिए गए—चालीस हज़ार हिंसक हाथों से मारे गए[a]; और वध किए गए लोगों की संख्या से कम लोग नहीं बेचे गए[b]।
  philosophy: optimal-equivalence
