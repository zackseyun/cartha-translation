- source_word: ὀκτὼ ... μυριάδες
  choice: अस्सी हज़ार
  rationale: μυριάς दस हज़ार की संख्या को सूचित करता है; इसलिए आठ μυριάδες का स्वाभाविक हिन्दी रूप ‘अस्सी हज़ार’ है।
- source_word: ἐν ταῖς πάσαις ἡμέραις τρισίν
  choice: पूरे तीन दिनों में
  rationale: यह रूप तीनों दिनों की पूरी अवधि पर πάσαις के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατεφθάρησαν
  choice: नष्ट कर दिए गए
  rationale: निष्क्रिय क्रिया हिंसक प्रसंग में जनहानि बताती है, पर यूनानी से अधिक विशिष्ट ढंग से मृत्यु का प्रकार निर्धारित नहीं करती।
- source_word: τέσσαρες μὲν
  choice: चालीस हज़ार
  rationale: पहले खंड से μυριάδες अर्थात ‘दस हज़ार’ का लोपित अर्थ यहाँ ग्रहण किया गया है।
- source_word: ἐν χειρῶν νόμοις
  choice: हिंसक हाथों से
  rationale: यूनानी पदबंध अस्पष्ट और असामान्य है। यह चयन हिंसा और मानवीय कर्तृत्व को बनाए रखता है, जबकि पादटिप्पणी उसका अधिक शाब्दिक रूप देती है।
- source_word: τῶν ἐσφαγμένων
  choice: जितने लोग मार डाले गए थे
  rationale: σφάζω की हिंसक हत्या की तीव्रता को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त किया गया है।
- source_word: ἐπράθησαν
  choice: बेचे गए
  rationale: यूनानी क्रिया केवल ‘बेचे गए’ कहती है। प्रसंग में दासता निहित हो सकती है, किंतु उसे मुख्य पाठ में स्पष्ट रूप से जोड़ना मूल से अधिक कहना होता।
