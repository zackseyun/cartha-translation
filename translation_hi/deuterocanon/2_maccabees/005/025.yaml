base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/025.yaml
  text: But when this man arrived in Jerusalem and pretended to be peaceable[a], he held back until the holy day of the Sabbath; and taking the Jews off guard, he ordered those under his command to arm themselves.
translation:
  language: hi
  text: परन्तु यरूशलेम पहुँचकर और शांतिप्रिय होने का ढोंग करके, वह सब्त के पवित्र दिन तक रुका रहा; और यहूदियों को सब्त मना रहे पाकर उसने अपने अधीन लोगों को हथियारबंद होने का आदेश दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενος
  choice: पहुँचा
  rationale: यह कृदन्त उसके यरूशलेम आने को दर्शाता है; ‘पहुँचा’ स्वाभाविक आधुनिक हिन्दी में आगमन की पूर्णता व्यक्त करता है।
- source_word: τὸν εἰρηνικὸν ὑποκριθεὶς
  choice: शांतिप्रिय होने का ढोंग किया
  rationale: ὑποκριθεὶς किसी भूमिका का अभिनय करने या झूठा रूप धारण करने का भाव देता है, जबकि εἰρηνικός शांतिपूर्ण या शांतिप्रिय होने को सूचित करता है। अनुवाद वास्तविक शांति नहीं, बल्कि छलपूर्ण दिखावा व्यक्त करता है।
- source_word: ἐπέσχεν
  choice: रुका रहा
  rationale: संदर्भ में क्रिया उचित अवसर तक कार्रवाई टालने का अर्थ देती है; ‘रुका रहा’ इस रणनीतिक विलम्ब को सहज हिन्दी में व्यक्त करता है।
- source_word: ἕως τῆς ἁγίας ἡμέρας τοῦ σαββάτου
  choice: सब्त के पवित्र दिन तक
  rationale: यह अनुवाद ἁγίας की पवित्रता और σαββάτου के सांस्कृतिक-धार्मिक नाम, दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: λαβὼν ἄγοντας τοὺς Ἰουδαίους
  choice: यहूदियों को असावधान पाकर
  rationale: यूनानी पदबंध संक्षिप्त और कठिन है। प्रसंग में यह सब्त के समय यहूदियों की असुरक्षित या अप्रस्तुत अवस्था का लाभ उठाने को सूचित करता है; मुख्य पाठ में स्वाभाविक अर्थ दिया गया है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: τοῖς ὑφʼ ἑαυτὸν
  choice: अपने अधीन लोगों को
  rationale: पदबंध उसके अधिकार के अधीन व्यक्तियों को दर्शाता है। ‘लोगों’ मूल की सामान्यता बनाए रखता है, जबकि हथियार धारण करने का आदेश सैन्य प्रसंग स्पष्ट कर देता है।
- source_word: ἐξοπλίαν παρήγγειλεν
  choice: हथियार धारण करने का आदेश दिया
  rationale: ἐξοπλίαν युद्ध के लिए सुसज्जित या हथियारबंद होने और παρήγγειλεν आदेश देने को व्यक्त करता है; चुना हुआ वाक्यांश स्पष्ट, गरिमापूर्ण और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: सब्त का पवित्र चरित्र
  choice: सब्त के पवित्र दिन
  alternative: पवित्र सब्त के दिन
  rationale: यूनानी पाठ सब्त के दिन को स्पष्ट रूप से ‘पवित्र’ कहता है। इसे बनाए रखना मूल पाठ की धार्मिक-सांस्कृतिक विशेषता का सीधा अनुवाद है, कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं।
- issue: सब्त के अवसर पर यहूदियों की असुरक्षित अवस्था
  choice: यहूदियों को असावधान पाकर
  alternative: यहूदियों को अचानक आ घेरकर
  rationale: कठिन यूनानी पदबंध संभवतः सब्त के पालन के कारण उनकी असावधानी या असुरक्षा का लाभ उठाने की ओर संकेत करता है। मुख्य पाठ इस प्रसंगगत अर्थ को संक्षेप में देता है, पर पादटिप्पणी द्वारा मूल की अस्पष्टता खुली रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘सब्त’ प्रचलित बाइबलीय पद के रूप में रखा गया है। वाक्य-विन्यास को हिन्दी की स्वाभाविक गति के लिए दो वाक्यों में बाँटा गया है, और कठिन यूनानी पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
