  yaml_path: translation/deuterocanon/2_maccabees/005/015.yaml
  text: But not satisfied with these things[a], he even dared to enter the most holy temple in all the earth, with Menelaus as his guide, the one who had become a traitor both to the laws and to his homeland,
translation:
  language: hi
  text: परन्तु इन बातों से संतुष्ट न होकर, उसने सारी पृथ्वी[a] के सबसे पवित्र मन्दिर में प्रवेश करने का भी दुस्साहस किया। उसका मार्गदर्शक मेनेलाउस था, जो विधानों और अपनी मातृभूमि—दोनों का विश्वासघाती बन चुका था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारे देश के सबसे पवित्र पवित्रस्थान’। यूनानी शब्द γῆ का अर्थ ‘पृथ्वी’ या ‘देश’, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀρκεσθεὶς δὲ τούτοις
  choice: परन्तु इन बातों से संतुष्ट न होकर
  rationale: यह पूर्ववर्ती अत्याचारों की ओर संकेत करते हुए असंतोष और आगे बढ़ती हुई दुष्टता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατετόλμησεν
  choice: दुस्साहस किया
  rationale: क्रिया में केवल साहस नहीं, बल्कि धृष्ट और निन्दनीय कदम उठाने का भाव है; ‘दुस्साहस’ इस कथात्मक मूल्यांकन को सुरक्षित रखता है।
- source_word: πάσης τῆς γῆς
  choice: सारी पृथ्वी
  rationale: γῆ के व्यापक अर्थ ‘पृथ्वी’ को मुख्य पाठ में रखा गया है, जिससे मन्दिर की पवित्रता के विषय में मूल का सार्वभौमिक, अतिशयोक्तिपूर्ण बल बना रहता है। ‘सारा देश’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: ἁγιώτατον ἱερὸν
  choice: सबसे पवित्र मन्दिर
  rationale: ἁγιώτατον के सर्वोच्चतासूचक रूप और ἱερόν के मन्दिर/पवित्र परिसर के अर्थ को स्पष्ट, सामान्य और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: εἰσελθεῖν
  choice: प्रवेश करने
  rationale: यह गति-सूचक अनन्त क्रिया का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ὁδηγὸν ἔχων τὸν Μενέλαον
  choice: उसका मार्गदर्शक मेनेलाउस था
  rationale: मूल कृदन्तीय वाक्यांश को सहज हिन्दी वाक्य में बदला गया है, जबकि मेनेलाउस की सहायक और अगुवाई करने वाली भूमिका बनी रहती है।
- source_word: τῶν νόμων
  choice: विधानों
  rationale: मूल में बहुवचन है। ‘विधान’ पैतृक धार्मिक-कानूनी नियमों का गरिमापूर्ण और पर्याप्त व्यापक संकेत देता है तथा बहुवचन को बनाए रखता है।
- source_word: τῆς πατρίδος
  choice: अपनी मातृभूमि
  rationale: πατρίς के जन्मभूमि और राष्ट्रीय निष्ठा से जुड़े व्यक्तिगत भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προδότην γεγονότα
  choice: विश्वासघाती बन चुका था
  rationale: ‘विश्वासघाती’ विधानों और मातृभूमि दोनों के साथ व्याकरणतः सहज बैठता है; ‘बन चुका था’ पूर्ण कृदन्त के पूर्व में उत्पन्न और अब तक बने हुए परिणाम को दर्शाता है।
theological_decisions:
- issue: मन्दिर की सर्वोच्च पवित्रता और γῆ का विस्तार
  choice: सारी पृथ्वी के सबसे पवित्र मन्दिर
  alternative: सारे देश का सबसे पवित्र पवित्रस्थान
  rationale: मूल पाठ मन्दिर की पवित्रता के लिए सर्वोच्चतासूचक रूप का प्रयोग करता है और γῆ ‘पृथ्वी’ अथवा ‘देश’ दोनों हो सकता है। मुख्य पाठ व्यापक अर्थ को रखता है, जबकि संकुचित भौगोलिक अर्थ पादटिप्पणी में सुरक्षित है; इस प्रकार दावे को न तो कम किया गया है, न अस्पष्टता को मिटाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘दुस्साहस’ लेखक के नैतिक आक्रोश को, और ‘बन चुका था’ मेनेलाउस की स्थापित विश्वासघाती स्थिति को व्यक्त करता है। वचन का अन्त अल्पविराम से रखा गया है क्योंकि मूल यूनानी वाक्य अगले पद में आगे चलता है।
