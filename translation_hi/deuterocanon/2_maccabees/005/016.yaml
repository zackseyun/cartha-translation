base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/016.yaml
  text: and with his polluted hands taking the sacred vessels[b][a], and with profane hands dragging away the things that had been dedicated by many kings for the increase and glory and honor of the place.
translation:
  language: hi
  text: और उसने अपने दूषित हाथों से पवित्र पात्र उठा लिए, और अपने अपवित्र हाथों से उन वस्तुओं को घसीटकर ले गया जिन्हें बहुत-से राजाओं ने उस स्थान[b] की समृद्धि, महिमा और सम्मान के लिए अर्पित किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें बहुत-से राजाओं ने स्थापित किया था।” यूनानी शब्द का अधिक शाब्दिक अर्थ “स्थापित करना” है; यहाँ संभवतः मंदिर में अर्पित की गई राजकीय भेंटें अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: “उस स्थान” मंदिर के लिए प्रयुक्त एक श्रद्धापूर्ण परोक्ष संबोधन है।
    reason: cultural_note
lexical_decisions:
- source_word: μιαραῖς
  choice: दूषित
  rationale: यह शब्द धार्मिक और नैतिक अशुद्धता का भाव रखता है; ‘दूषित’ उस अपवित्रीकरण को व्यक्त करता है और आगे आए βεβήλοις से शब्दगत भेद भी बनाए रखता है।
- source_word: ἱερὰ σκεύη
  choice: पवित्र पात्र
  rationale: संदर्भ मंदिर की पवित्र वस्तुओं का है। ‘पवित्र पात्र’ स्वाभाविक और उपासना-संबंधी अर्थ में स्पष्ट है।
- source_word: ἀνασταθέντα
  choice: अर्पित किया था
  rationale: मूलतः इसका अर्थ ‘स्थापित/खड़ा किया गया’ हो सकता है, पर यहाँ राजाओं द्वारा मंदिर में रखी गई मन्नत या भेंट की वस्तुएँ अभिप्रेत हैं; मुख्य पाठ में ‘अर्पित’ यह आशय सहजता से बताता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: πρὸς αὔξησιν καὶ δόξαν τοῦ τόπου καὶ τιμήν
  choice: उस स्थान की समृद्धि, महिमा और सम्मान के लिए
  rationale: ‘समृद्धि’ αὔξησις के बढ़ोतरी या संवर्धन के भाव को स्वाभाविक हिन्दी में व्यक्त करती है; ‘उस स्थान’ मंदिर के लिए प्रयुक्त मूल श्रद्धापूर्ण परोक्ष उल्लेख को बनाए रखता है।
- source_word: βεβήλοις
  choice: अपवित्र
  rationale: यह पवित्र के विपरीत, धार्मिक रूप से अशुद्ध या साधारणीकृत किए जाने का भाव देता है; ‘अपवित्र’ आधुनिक हिन्दी में सटीक और स्पष्ट है।
- source_word: συνσύρων
  choice: घसीटकर ले गया
  rationale: क्रिया बलपूर्वक और अनादरपूर्वक वस्तुओं को समेटते हुए ले जाने का चित्र देती है; ‘घसीटकर ले गया’ उस हिंसक अपमान को बनाए रखता है।
theological_decisions:
- issue: मंदिर और उसकी वस्तुओं के अपवित्रीकरण की धार्मिक शब्दावली
  choice: ‘दूषित हाथों’, ‘पवित्र पात्रों’, ‘अपवित्र हाथों’ और ‘उस स्थान’ के विरोध को स्पष्ट रूप से बनाए रखा गया है।
  alternative: सामान्य शब्दों में ‘गंदे हाथ’, ‘मंदिर की वस्तुएँ’ और ‘बुरे हाथ’ कहना।
  rationale: यूनानी पाठ पवित्र वस्तुओं और उन्हें छूने वाले अपवित्र हाथों के तीखे धार्मिक विरोध पर बल देता है; सामान्यीकृत भाषा इस तनाव को कमजोर कर देती।
- issue: ἀνασταθέντα का अर्थ
  choice: मुख्य पाठ में ‘अर्पित किया था’, साथ में ‘स्थापित किया था’ का पादटिप्पणी विकल्प।
  alternative: केवल ‘स्थापित किया था’ अनुवाद करना।
  rationale: मंदिर में राजकीय भेंटों का प्रसंग समर्पण का आशय देता है, लेकिन कृदंत का अधिक शाब्दिक अर्थ वास्तव में ‘स्थापित’ भी हो सकता है; पादटिप्पणी मूल की इस अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘उस स्थान’ को मूल यूनानी की श्रद्धापूर्ण परोक्षता बनाए रखने के लिए रखा गया है। दोनों प्रकार के अपवित्र हाथों और पवित्र पात्रों के बीच का धार्मिक विरोध जानबूझकर स्पष्ट रखा गया है।
