lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν τοῦτον
  choice: लगभग उसी समय
  rationale: περί के साथ कालवाचक कर्मकारक यहाँ अनुमानित समय बताता है। यह हिन्दी में स्वाभाविक ढंग से कथा की समय-पृष्ठभूमि प्रस्तुत करता है।
- source_word: τὴν δευτέραν ἔφοδον
  choice: अपना दूसरा सैन्य अभियान
  rationale: ἔφοδος आक्रमण, चढ़ाई या अभियान का अर्थ दे सकता है। प्रसंग में ‘सैन्य अभियान’ व्यापक गतिविधि को व्यक्त करता है और इसे केवल एक क्षण के आक्रमण तक सीमित नहीं करता। ‘अपना’ हिन्दी में कर्ता अन्तियोकुस से इसका सम्बन्ध स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ὁ Ἀντίοχος
  choice: अन्तियोकुस
  rationale: व्यक्तिगत नाम को यूनानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र पर
  rationale: εἰς गति की दिशा बताता है; सैन्य अभियान के साथ हिन्दी में ‘मिस्र पर’ लक्ष्य की ओर बढ़ने और अभियान की आक्रामक प्रकृति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐστέλατο
  choice: आरम्भ किया
  rationale: στέλλω का यह मध्यवाच्य रूप अभियान भेजने, निकलने या उसे हाथ में लेने का भाव दे सकता है। ‘अभियान आरम्भ किया’ हिन्दी में सहज है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
