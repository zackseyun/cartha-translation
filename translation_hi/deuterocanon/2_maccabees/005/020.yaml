base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/020.yaml
  text: Therefore even the place itself[a], after sharing in the nation's misfortunes, later also shared in its benefits; and though it had been overtaken in the wrath of the Almighty, it was restored again in the reconciliation of the great Master[b], with all glory.
translation:
  language: hi
  text: इसलिए वह स्थान स्वयं भी[a], राष्ट्र की विपत्तियों में सहभागी होने के बाद, आगे चलकर उसके उपकारों में भी सहभागी हुआ; और जो सर्वशक्तिमान के क्रोध की चपेट में आ गया था, वह महान स्वामी[b] से मेल-मिलाप होने पर फिर से पूरे वैभव के साथ पुनःस्थापित किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् प्रसंग में मन्दिर का स्थान; यूनानी पाठ में केवल “स्थान” कहा गया है।
    reason: referent_clarification
  - marker: b
    text: “महान स्वामी” का अनुवाद “महान अधिपति” भी हो सकता है; यूनानी δεσπότης पूर्ण अधिकार पर बल देता है और κύριος से भिन्न शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διόπερ
  choice: इसलिए
  rationale: यह पिछले कथन से प्रबल निष्कर्षात्मक संबंध व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: αὐτὸς ὁ τόπος
  choice: वह स्थान स्वयं भी
  rationale: मन्दिर-स्थल संदर्भित है, पर यूनानी की सामान्य संज्ञा और बल को बनाए रखने के लिए इसे ‘मन्दिर’ कहकर अधिक स्पष्ट नहीं किया गया।
- source_word: συμμετασχὼν ... ἐκοινώνησεν
  choice: सहभागी होने के बाद ... सहभागी हुआ
  rationale: दोनों क्रियाओं में निहित साझा भागीदारी की समानांतरता को हिन्दी में एक ही पदावली से सुरक्षित रखा गया है।
- source_word: τοῦ ἔθνους
  choice: राष्ट्र की
  rationale: यहाँ ἔθνος यहूदी जनसमुदाय को सामूहिक रूप में दर्शाता है; ‘राष्ट्र’ मूल की सामूहिक-ऐतिहासिक छटा बनाए रखता है।
- source_word: δυσπετημάτων
  choice: विपत्तियों
  rationale: यह शब्द गंभीर कष्टदायक परिस्थितियों को दर्शाता है; ‘विपत्तियाँ’ गरिमापूर्ण और सहज है तथा εὐεργετημάτων के साथ विरोध स्पष्ट करता है।
- source_word: εὐεργετημάτων
  choice: उपकारों
  rationale: ‘उपकार’ प्राप्त भलाई अथवा कृपापूर्ण लाभ को व्यक्त करता है और ‘विपत्तियों’ के विपरीत भाव को बनाए रखता है।
- source_word: καταληφθεὶς
  choice: चपेट में आ गया था
  rationale: अमूर्त ‘क्रोध’ द्वारा घेर लिए जाने या आ पकड़े जाने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह παντοκράτωρ का प्रचलित, सुलभ और गरिमापूर्ण हिन्दी बाइबलीय रूप है।
- source_word: ὀργῇ
  choice: क्रोध
  rationale: दिव्य न्याय की गंभीरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καταλλαγῇ
  choice: मेल-मिलाप होने पर
  rationale: यह वैमनस्य से अनुकूल संबंध की ओर परिवर्तन को दर्शाता है, बिना ऐसे प्रायश्चित्त-संबंधी अर्थ को जोड़ने के जो यहाँ स्पष्ट नहीं है।
- source_word: μεγάλου δεσπότου
  choice: महान स्वामी
  rationale: ‘स्वामी’ δεσπότης के पूर्ण अधिकार के भाव को रखता है और इसे κύριος के सामान्य अनुवाद ‘प्रभु’ से अलग बनाए रखता है।
- source_word: μετὰ πάσης δόξης ἐπανωρθώθη
  choice: पूरे वैभव के साथ पुनःस्थापित किया गया
  rationale: यह पुनर्स्थापन और उसके साथ लौटे पूर्ण गौरव/वैभव दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: παντοκράτωρ और δεσπότης नामक दो ईश्वरीय उपाधियों को अलग-अलग रखना
  choice: सर्वशक्तिमान ... महान स्वामी
  alternative: सर्वशक्तिमान ... महान प्रभु / सर्वाधिपति
  rationale: यूनानी पाठ जानबूझकर दो भिन्न उपाधियाँ प्रयोग करता है। अलग हिन्दी रूप मूल की बनावट और क्रोध से मेल-मिलाप की ओर परिवर्तन को सुरक्षित रखते हैं।
- issue: καταλλαγή में संबंधगत परिवर्तन की दिशा
  choice: महान स्वामी से मेल-मिलाप होने पर
  alternative: महान स्वामी की प्रसन्नता लौटने पर / महान स्वामी के शांत होने पर
  rationale: ‘मेल-मिलाप’ संबंध के पुनर्स्थापन को खुला रखता है और यह तय नहीं करता कि शब्द का आशय केवल परमेश्वर को शांत करना है या व्यापक रूप से अनुग्रहपूर्ण संबंध लौटना।
- issue: स्थान को राष्ट्र के अनुभवों में सहभागी बताने वाला मानवीकरण
  choice: स्थान ... सहभागी हुआ
  alternative: स्थान ने राष्ट्र के साथ विपत्तियाँ सहीं और फिर लाभ पाया
  rationale: मूल पाठ का मानवीकरण और दोनों खंडों में भागीदारी की समानांतर भाषा जानबूझकर सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘सहभागी’ की पुनरावृत्ति मूल यूनानी के भागीदारी-संबंधी समानांतर भाव को सुरक्षित रखने के लिए रखी गई है; ‘सर्वशक्तिमान’ और ‘महान स्वामी’ अलग उपाधियों के रूप में अनूदित हैं।
