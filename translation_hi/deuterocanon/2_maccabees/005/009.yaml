  yaml_path: translation/deuterocanon/2_maccabees/005/009.yaml
  text: He who had made many exiles from their homeland perished in a foreign land[b][a], having gone up to the Lacedaemonians as though he would obtain protection because of the kinship.
translation:
  language: hi
  text: जिसने बहुतों को उनकी मातृभूमि से निर्वासित कर दिया था, वह स्वयं परदेश में नष्ट हो गया। वह लाकेदैमोनियों[a] के पास ले जाया गया था, मानो नातेदारी[b] के कारण उसे संरक्षण मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “स्पार्टावासियों।” “लाकेदैमोनियों” यूनानी जातिनाम का अधिक शाब्दिक रूप है।
    reason: lexical_alternative
  - marker: b
    text: यह “नातेदारी” संभवतः यहूदियों और स्पार्टावासियों के बीच माने जाने वाले पारंपरिक संबंध की ओर संकेत करती है (तुलना करें 1 मक्काबियों 12:6–23)।
    reason: cross_reference
lexical_decisions:
- source_word: συχνοὺς
  choice: बहुतों को
  rationale: विशेषण यहाँ संज्ञा के रूप में व्यक्तियों के लिए प्रयुक्त है। ‘बहुतों को’ स्वाभाविक हिन्दी है और यूनानी में निहित व्यक्तियों को बिना ‘पुरुष’ जोड़े व्यक्त करता है।
- source_word: τῆς πατρίδος
  choice: उनकी मातृभूमि से
  rationale: πατρίς अपनी जन्मभूमि या मातृभूमि को दर्शाता है; यह चयन मूल के भावनात्मक बल और आगे आने वाले ‘परदेश’ के विरोध को बनाए रखता है।
- source_word: ἀποξενώσας
  choice: निर्वासित कर दिया था
  rationale: क्रिया का मूल भाव किसी को अपने देश से पराया या दूर कर देना है। इस संदर्भ में ‘निर्वासित कर दिया’ उसका कारक और राजनीतिक अर्थ स्पष्ट करता है।
- source_word: ἐπὶ ξένης
  choice: परदेश में
  rationale: यह मातृभूमि के विपरीत किसी विदेशी भूमि में मरने को सूचित करता है। संक्षिप्त ‘परदेश में’ हिन्दी में इस विडंबनापूर्ण विरोध को बनाए रखता है।
- source_word: ἀπώλετο
  choice: नष्ट हो गया
  rationale: ἀπόλλυμι का यह रूप ‘नाश होना’ या ‘मर जाना’ व्यक्त कर सकता है। ‘नष्ट हो गया’ साधारण ‘मर गया’ से अधिक भारयुक्त है, पर कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
- source_word: πρὸς Λακεδαιμονίους
  choice: लाकेदैमोनियों के पास
  rationale: यह यूनानी जातिनाम का निकट लिप्यंतरण है। अधिक परिचित ‘स्पार्टावासियों’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: ἀναχθεὶς
  choice: गया था
  rationale: संदर्भ में कृदंत उनके पास जाने या वहाँ प्रस्थान करने का संकेत देता है। ‘गया था’ तटस्थ है और यूनानी से अनिवार्य न होने वाली जबरदस्ती का भाव नहीं जोड़ता।
- source_word: διὰ τὴν συγγένειαν
  choice: नातेदारी के कारण
  rationale: συγγένεια साझा वंश पर आधारित संबंध या नातेदारी है। निश्चित पदबंध किसी ज्ञात संबंध की ओर संकेत करता है, पर मूल पाठ इसे केवल दावा नहीं कहता।
- source_word: τευξόμενος σκέπης
  choice: इस आशा से ... उसे शरण मिलेगी
  rationale: τυγχάνω के साथ संबंधकारक किसी वस्तु को प्राप्त करने का अर्थ देता है और σκέπη आश्रय या संरक्षण है। यह हिन्दी अभिव्यक्ति अपेक्षित शरण का भाव स्वाभाविक ढंग से देती है।
theological_decisions:
- issue: συγγένεια में ऐतिहासिक संकेत
  choice: मुख्य पाठ में तटस्थ रूप से ‘नातेदारी’
  alternative: ‘कथित नातेदारी’ या ‘उनकी नातेदारी’
  rationale: यूनानी पाठ ज्ञात यहूदी-स्पार्टी संबंध की परंपरा की ओर संकेत करता है, पर उसे ‘कथित’ नहीं कहता। इसलिए संभावित ऐतिहासिक पृष्ठभूमि पादटिप्पणी में रखी गई है।
- issue: ὡς के साथ अपेक्षा का स्वर
  choice: ‘इस आशा से’
  alternative: ‘मानो उसे ... मिलेगी’
  rationale: यह पद उसकी अपेक्षा या धारणा को व्यक्त करता है, जिसकी पूर्ति आवश्यक रूप से प्रमाणित नहीं होती। ‘इस आशा से’ उस तनाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। मातृभूमि और परदेश का विरोध स्पष्ट रखा गया है। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, और सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
