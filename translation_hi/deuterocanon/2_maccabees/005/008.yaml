base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/008.yaml
  text: 'So he met the end of a miserable ruin: confined with Aretas[a], the ruler of the Arabs, fleeing from city to city, pursued by all, hated as an apostate from the laws and abhorred as the destroyer of his homeland and fellow citizens[b], he was driven into Egypt.'
translation:
  language: hi
  text: 'इस प्रकार उसका अंत बड़ी ही दयनीय बरबादी में हुआ: अरबों के शासक अरेतास[a] के यहाँ बंद कर दिया गया था; वह नगर-नगर भागता फिरता था, सब उसका पीछा कर रहे थे, और लोग उससे व्यवस्थाओं का त्यागी समझकर घृणा करते थे तथा अपनी मातृभूमि और अपने देशवासियों का संहारक मानकर उससे घिन करते थे। अंत में उसे मिस्र में खदेड़ दिया गया।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अरबों का निरंकुश शासक अरेतास।” यूनानी शब्द τύραννος का अर्थ “निरंकुश शासक” हो सकता है, पर यहाँ वह अपेक्षाकृत तटस्थ अर्थ में “शासक” के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसे मिस्र की ओर निकाल फेंक दिया गया।” यूनानी क्रिया बहुत प्रबल है और बलपूर्वक बाहर निकालने या फेंकने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πέρας οὖν κακῆς καταστροφῆς ἔτυχεν
  choice: इस प्रकार उसका अंत घोर दुर्दशा में हुआ
  rationale: यूनानी मुहावरे के अंतिम परिणाम और विनाशकारी, दयनीय दशा—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγκλεισθεὶς πρὸς Ἀρέταν
  choice: अरेतास के यहाँ घिरा हुआ
  rationale: ἐγκλεισθεὶς के बंद या सीमित कर दिए जाने के भाव को रखता है, पर औपचारिक कारावास का अनावश्यक दावा नहीं करता; πρός के संबंधात्मक अर्थ को ‘के यहाँ’ से खुला रखा गया है।
- source_word: τύραννον
  choice: शासक
  rationale: हेलेनिस्ती यूनानी में यह शब्द निरंकुश शासक के साथ-साथ सामान्य राजनीतिक शासक के लिए भी आ सकता है; मुख्य पाठ में अनावश्यक नैतिक निर्णय नहीं जोड़ा गया।
- source_word: πόλιν ἐκ πόλεως φεύγων
  choice: नगर-नगर भागता फिरा
  rationale: लगातार एक नगर से दूसरे नगर भागने का वितरक और पुनरावृत्त भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: διωκόμενος ὑπὸ πάντων
  choice: सभी उसका पीछा कर रहे थे
  rationale: यहाँ वास्तविक पीछा किए जाने का भाव है; ‘सताया जाना’ धार्मिक उत्पीड़न का अतिरिक्त संकेत दे सकता था।
- source_word: στυγούμενος ὡς τῶν νόμων ἀποστάτης
  choice: लोग उससे इस कारण घृणा करते थे कि वह विधि-विधानों का त्यागी था
  rationale: ἀποστάτης की निष्ठा छोड़ देने वाली प्रबल धारणा को रखा गया है, जबकि νόμων के बहुवचन को ‘विधि-विधानों’ से व्यक्त किया गया है।
- source_word: βδελυσσόμενος ὡς πατρίδος καὶ πολιτῶν δήμιος
  choice: उसे अपनी मातृभूमि और अपने देशवासियों का संहारक मानकर उससे घिन करते थे
  rationale: βδελυσσόμενος की तीव्र वितृष्णा को ‘घिन’ और δήμιος के घातक-विनाशकारी अर्थ को ‘संहारक’ से व्यक्त किया गया है; ‘जल्लाद’ सम्भव है, पर यहाँ अधिक संकीर्ण हो सकता है।
- source_word: εἰς Αἴγυπτον ἐξεβράσθη
  choice: उसे मिस्र में खदेड़ दिया गया
  rationale: ἐκβράζω की बलपूर्वक बाहर फेंके या धकेले जाने की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: τύραννον में अरेतास का नैतिक चरित्रांकन
  choice: मुख्य पाठ में ‘शासक’
  alternative: ‘निरंकुश शासक’ या ‘अत्याचारी शासक’
  rationale: शब्द राजनीतिक पदवी के रूप में अपेक्षाकृत तटस्थ भी हो सकता है। पद का मुख्य नैतिक बल उस व्यक्ति के पतन पर है जिसका वर्णन हो रहा है, इसलिए अरेतास पर अतिरिक्त दोषारोपण नहीं किया गया।
- issue: τῶν νόμων ἀποστάτης का धार्मिक-विधिक बल
  choice: ‘विधि-विधानों का त्यागी’
  alternative: ‘व्यवस्था से फिरा हुआ’ या ‘धर्मत्यागी’
  rationale: यह अनुवाद पैतृक या वाचा-संबंधी विधि के प्रति निष्ठा छोड़ने के गंभीर आरोप को बनाए रखता है, पर केवल ‘धर्मत्यागी’ कहकर अर्थ को एक बाद की तकनीकी धार्मिक संज्ञा में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। लंबे यूनानी कृदंत-क्रम को पठनीयता के लिए कई वाक्यखंडों में बाँटा गया है, पर पीछा, घृणा, वितृष्णा और अंततः निष्कासन की क्रमिक तीव्रता सुरक्षित है।
