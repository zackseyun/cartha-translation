  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अन्तियोखुस’, ‘अन्ताकिया’ और ‘तालन्त’ जैसे ऐतिहासिक नाम पारंपरिक देवनागरी रूपों में हैं। मुख्य पाठ में यूनानी की अतिशयोक्ति और हृदय के ‘ऊँचा उठने’ की छवि को स्वाभाविक हिन्दी मुहावरे तथा पादटिप्पणी के मेल से सुरक्षित रखा गया है।
