base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/021.yaml
  text: So Antiochus[a], after carrying off from the temple eighteen hundred talents, quickly departed for Antioch, thinking in his arrogance to make the land navigable and the sea passable on foot[b], because of the exaltation of his heart.
translation:
  language: hi
  text: इसलिए अन्तियोकस मन्दिर से एक हज़ार आठ सौ तालन्त लूटकर शीघ्र ही अन्ताकिया के लिए रवाना हो गया। अपने घमण्ड में वह सोचता था कि वह धरती को जहाज़ चलाने योग्य और समुद्र को पैदल चलने योग्य बना सकता है[a], क्योंकि उसका हृदय घमण्ड से फूला हुआ था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह जानबूझकर की गई अतिशयोक्ति है: अन्तियोकस अपने को ऐसा समर्थ समझता था कि मानो वह प्राकृतिक व्यवस्था को उलटकर धरती पर जहाज़ और समुद्र पर मनुष्य चला सकता हो।'
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “उसके हृदय के ऊँचे उठने के कारण”; इसका भाव घमण्ड और अति-आत्मविश्वास है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτακόσια πρὸς τοῖς χιλίοις
  choice: एक हज़ार आठ सौ
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘एक हज़ार के अतिरिक्त आठ सौ’ है; आधुनिक हिन्दी में ठीक कुल संख्या दी गई है।
- source_word: ἀπενεγκάμενος ἐκ τοῦ ἱεροῦ
  choice: मन्दिर से ... लूटकर
  rationale: क्रिया वस्तुओं को उठा ले जाने का अर्थ देती है; प्रसंग में यह मन्दिर की लूट है। ἱερόν पूरे मन्दिर को सूचित कर सकता है, केवल भीतरी पवित्रस्थान को नहीं।
- source_word: τάλαντα
  choice: तालन्त
  rationale: प्राचीन भार और धन-मूल्य की इकाई के पारंपरिक नाम को रखा गया है; इसे आधुनिक मुद्रा में बदलना भ्रामक होता।
- source_word: θᾶττον εἰς τὴν Ἀντιόχειαν ἐχωρίσθη
  choice: शीघ्र ही अन्ताकिया के लिए रवाना हो गया
  rationale: यह प्रस्थान की शीघ्रता और गन्तव्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς ὑπερηφανίας
  choice: अपने घमण्ड में
  rationale: वाक्यांश उसकी असम्भव कल्पना के आधार या कारण के रूप में अहंकार को दर्शाता है।
- source_word: τὴν μὲν γῆν πλωτὴν καὶ τὸ πέλαγος πορευτὸν θέσθαι
  choice: धरती को जहाज़ चलाने योग्य और समुद्र को पैदल चलने योग्य बना सकता है
  rationale: धरती और समुद्र की स्वाभाविक भूमिकाओं को उलट देने वाली जानबूझकर अतिशयोक्तिपूर्ण छवि को स्पष्ट रखा गया है। ‘पैदल’ यूनानी में प्रत्यक्षतः नहीं है, पर धरती पर यात्रा के विपरीत समुद्र को πορευτόν कहने में निहित अर्थ को व्यक्त करता है।
- source_word: διὰ τὸν μετεωρισμὸν τῆς καρδίας
  choice: इतना उसका मन घमण्ड से फूल उठा था
  rationale: μετεωρισμός में ऊपर उठने, दम्भ और अत्यधिक आत्मविश्वास की छवि है। हिन्दी का यह मुहावरा नकारात्मक भाव और भीतरी अहंकार दोनों को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: τῆς καρδίας का बाइबलीय मानव-विज्ञान सम्बन्धी मुहावरा
  choice: उसका मन
  alternative: उसका हृदय
  rationale: यहाँ καρδία विचार और अभिमानी आत्मधारणा का केन्द्र है। आधुनिक हिन्दी में ‘मन’ अर्थ को सहजता से पहुँचाता है, जबकि पादटिप्पणी मूल की ‘हृदय’ वाली छवि सुरक्षित रखती है; इसे केवल बौद्धिक ‘मस्तिष्क’ तक सीमित नहीं किया गया।
