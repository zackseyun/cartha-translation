lexical_decisions:
- source_word: ἀρχῆς
  choice: शासन पर अधिकार
  rationale: यहाँ ἀρχή आरम्भ नहीं, बल्कि उस राजनीतिक शासन-सत्ता को दर्शाता है जिसे यासोन हथियाना चाहता था।
- source_word: οὐκ ἐκρίτησεν
  choice: अधिकार नहीं कर सका
  rationale: इस संदर्भ में असामान्य क्रिया का आशय इच्छित शासन-सत्ता प्राप्त करने या उस पर नियंत्रण करने में असफल होना है; हिन्दी में यह प्रयोग अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ δὲ τέλος τῆς ἐπιβουλῆς
  choice: अपनी साज़िश का परिणाम
  rationale: τέλος यहाँ अन्त से अधिक परिणाम के अर्थ में है, और ἐπιβουλή विरोधपूर्ण चाल या साज़िश है। प्रसंग के अनुसार सम्बन्ध उसी की साज़िश से है।
- source_word: αἰσχύνην λαβών
  choice: अपमान के रूप में पाकर
  rationale: यह यूनानी के शाब्दिक बिम्ब, ‘लज्जा पाकर’, को बनाए रखते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: φυγὰς ... ἀπῆλθεν
  choice: भगोड़ा होकर ... चला गया
  rationale: φυγάς केवल भागने की क्रिया नहीं, बल्कि भगोड़े या निर्वासित की दशा भी व्यक्त करता है; इसलिए यह अनुवाद उस सूक्ष्मता को सुरक्षित रखता है।
- source_word: Ἀμμανῖτιν
  choice: अम्मानीतिस
  rationale: यह अम्मोनियों के क्षेत्र का यूनानी स्थान-नाम है; लिप्यंतरण मूल रूप को सुरक्षित रखता है।
