  yaml_path: translation/deuterocanon/2_maccabees/005/023.yaml
  text: and in Gerizim[a], Andronicus; and besides these, Menelaus surpassed the others in wickedness toward the citizens[b], having a hateful disposition toward the Jewish citizens.
translation:
  language: hi
  text: और गरिज्जीम में[a] अन्द्रोनिकुस को; और इनके अतिरिक्त, मेनेलाउस नागरिकों के प्रति दुष्टता में अन्य सब से बढ़कर था[b] और यहूदी नागरिकों के प्रति शत्रुतापूर्ण मनोवृत्ति रखता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और गरिज्जीम पर।” स्थानवाचक पूर्वसर्ग का अनुवाद “में” या “पर” किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अन्यों से सबसे बुरा था” या “सबसे बुरी बातों में अन्यों से आगे निकल गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ Γαριζεὶν
  choice: और गरिज्जीम में
  rationale: ἐν का सामान्य स्थानीय अर्थ ‘में’ रखा गया है; स्थान के साथ ‘पर’ भी सम्भव है। नाम का रूप हिन्दी बाइबलीय उच्चारण के अनुकूल लिप्यंतरित है।
- source_word: Ἀνδρόνικον
  choice: अन्द्रोनिकुस को
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है। पूर्वपद के प्रसंग से यह नियुक्त अधिकारी का कर्म है, इसलिए हिन्दी में ‘को’ जोड़ा गया है।
- source_word: πρὸς δὲ τούτοις
  choice: और इनके अतिरिक्त
  rationale: यह पद पहले बताए गए अधिकारियों के साथ मेनेलाउस को जोड़ता है और यूनानी के योगात्मक बल को बनाए रखता है।
- source_word: Μενέλαον
  choice: मेनेलाउस
  rationale: व्यक्तिनाम का प्रचलित ध्वन्यात्मक लिप्यंतरण।
- source_word: χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: दुष्टता में बाकी सब से बढ़कर था
  rationale: यह अनुवाद χείριστα की नैतिक निन्दा और ὑπερήρτετο के दूसरों को पीछे छोड़ने वाले तुलनात्मक भाव, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: τοῖς πολίταις
  choice: नागरिकों के प्रति
  rationale: πολίτης के नागरिक-सामाजिक अर्थ को सामान्य ‘लोगों’ में नहीं बदला गया; संबंध को हिन्दी में ‘के प्रति’ से व्यक्त किया गया है।
- source_word: ἀπεχθῆ ... διάθεσιν
  choice: बैर-भाव
  rationale: ἀπεχθής और διάθεσις मिलकर शत्रुतापूर्ण मनोवृत्ति बताते हैं; ‘बैर-भाव’ स्पष्ट, स्वाभाविक और नैतिक भारयुक्त है।
- source_word: πρὸς τοὺς πολίτας Ἰουδαίους
  choice: यहूदी नागरिकों के प्रति
  rationale: यूनानी में जातीय पहचान और नागरिक स्थिति दोनों स्पष्ट हैं, इसलिए दोनों को बनाए रखा गया है।
- source_word: ἔχων
  choice: रखता था
  rationale: कृदन्त मुख्य कथन के साथ चल रही मनोवृत्ति बताता है; ‘क्योंकि ... रखता था’ हिन्दी में संबंध को सहज बनाता है, यद्यपि यूनानी स्वयं कारण को पूर्णतः स्पष्ट नहीं करता।
theological_decisions:
- issue: πολίταις / πολίτας को ‘लोग’ कहना या ‘नागरिक’ बनाए रखना
  choice: दोनों स्थानों पर ‘नागरिक’
  alternative: लोग; देशवासी
  rationale: मूल पाठ नागरिक समुदाय पर हुए अत्याचार को रेखांकित करता है। ‘नागरिक’ रखने से राजनीतिक और सामाजिक सूक्ष्मता सुरक्षित रहती है।
- issue: χείριστα τῶν ἄλλων ὑπερήρτετο की तीव्रता
  choice: दुष्टता में बाकी सब से बढ़कर था
  alternative: बाकी लोगों से अधिक बुरा था; दुष्टता में उसने सबको पीछे छोड़ दिया
  rationale: चुना हुआ रूप तुलना और कठोर नैतिक निन्दा दोनों रखता है, बिना अनावश्यक अतिशयोक्ति के।
- issue: ἔχων कृदन्त का मुख्य कथन से संबंध
  choice: ‘क्योंकि’ द्वारा कारणात्मक संबंध
  alternative: ‘और ... रखता था’; ‘... रखते हुए’
  rationale: संदर्भ में बैर-भाव उसके दुष्ट आचरण का आधार समझ में आता है और हिन्दी वाक्य स्वाभाविक बनता है; फिर भी मूल कृदन्त कारण या सहवर्ती परिस्थिति—दोनों की कुछ गुंजाइश रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। पद पिछले वाक्य से व्याकरणिक रूप से जुड़ा अंश है, इसलिए आरम्भिक अधूरापन मूल संरचना के अनुरूप रखा गया है। ‘नागरिक’ की पुनरावृत्ति जानबूझकर सुरक्षित है।
