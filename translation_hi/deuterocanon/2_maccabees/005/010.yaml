  yaml_path: translation/deuterocanon/2_maccabees/005/010.yaml
  text: And after casting out a multitude unburied, he himself became unwept, and shared in no burial at all, nor in his ancestral tomb.
translation:
  language: hi
  text: और जिसने लोगों की एक भीड़ को बिना दफ़नाए फेंक दिया था, वह स्वयं ऐसा रह गया जिसके लिए किसी ने शोक नहीं मनाया। उसे किसी भी प्रकार की अंत्येष्टि नहीं मिली, और न ही वह अपने पितरों की व्यवस्था[a] का सहभागी हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी स्रोत-पाठ में ‘पितरों की व्यवस्था/रीति’ (πατρῴου νόμου) है। कुछ अन्य पाठ-परंपराओं और अंग्रेज़ी परामर्श-पाठ में यहाँ ‘पैतृक कब्र’ मिलता है।
    reason: उपलब्ध यूनानी पाठ के νόμου को अनुवाद में बनाए रखते हुए अंग्रेज़ी audit trail से भिन्न पाठ को स्पष्ट करता है, और अर्थ को अनावश्यक रूप से केवल अंत्येष्टि-रीति तक सीमित नहीं करता।
lexical_decisions:
- source_word: πλῆθος ἀτάφων
  choice: बहुत-से लोगों को बिना दफ़नाए
  rationale: शाब्दिक अर्थ ‘बिना दफ़नाए लोगों की भीड़/बहुतायत’ है; हिन्दी में व्यक्तियों को स्पष्ट करके मूल की भयावहता और बहुवचन भाव सुरक्षित रखा गया है।
- source_word: ἐκρίψας
  choice: फेंक देनेवाला
  rationale: क्रिया का अर्थ बाहर फेंकना या त्याग देना है। कर्तृवाचक कृदंत की संरचना रखी गई है और अनावश्यक रूप से ‘फिंकवा दिया’ नहीं किया गया।
- source_word: ἀπένθητος
  choice: बिना शोक मनाए रह गया
  rationale: इसका अर्थ है ऐसा व्यक्ति जिसके लिए शोक न मनाया गया हो। यह ‘बिना शोक किए’ नहीं, बल्कि उसके लिए दूसरों द्वारा शोक न किए जाने का भाव देता है।
- source_word: κηδείας οὐδ᾽ ἥτινος
  choice: किसी भी प्रकार की अंत्येष्टि नहीं मिली
  rationale: κηδεία यहाँ अंतिम संस्कार/अंत्येष्टि को सूचित करता है और οὐδ᾽ ἥτινος पूर्ण निषेध को बल देता है।
- source_word: πατρῴου νόμου
  choice: अपने पूर्वजों की रीति
  rationale: νόμος का सामान्य अर्थ नियम, प्रथा या रीति है; πατρῷος इसे पूर्वजों से चली आई परंपरा बताता है। प्रसंग में यह अंत्येष्टि की पैतृक रीति है, न कि सीधे ‘पैतृक कब्र’।
theological_decisions:
- issue: πατρῴου νόμου को ‘पैतृक कब्र’ या ‘पूर्वजों की रीति’ समझना
  choice: पूर्वजों की रीति
  alternative: पैतृक कब्र
  rationale: प्रस्तुत यूनानी पाठ में νόμου (‘नियम/रीति’) है, μνήματος या τάφου (‘कब्र’) नहीं। इसलिए अंग्रेज़ी परामर्श-पाठ के ‘ancestral tomb’ के बजाय मूल-पाठ की शब्दावली सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘अंत्येष्टि’ प्रसंगानुकूल मानक हिन्दी शब्द है; ‘बिना शोक मनाए’ निष्क्रिय अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
