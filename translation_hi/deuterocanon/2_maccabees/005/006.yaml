base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/006.yaml
  text: But Jason kept carrying out merciless slaughter of his own fellow citizens[a], not understanding that prosperity against kinsmen is the greatest calamity[b], and thinking that he was winning trophies over enemies and not over his own countrymen.
translation:
  language: hi
  text: परन्तु यासोन नगर के अपने ही नागरिकों का निर्दयता से संहार करता रहा[a]। वह यह नहीं समझता था कि अपने ही बंधु-बांधवों के विरुद्ध मिली सफलता सबसे बड़ी विपत्ति होती है[b]। वह सोचता था कि वह अपने ही देशवासियों पर नहीं, बल्कि शत्रुओं पर विजय-चिह्न खड़े कर रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बिना किसी को बख्शे संहार करता रहा।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, ‘यह न समझते हुए कि बंधु-बांधवों के विरुद्ध समृद्धि सबसे बड़ी विपत्ति है।’ आशय यह है कि अपने ही लोगों के विरुद्ध दिखाई देने वाली सफलता वास्तव में विनाशकारी होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σφαγὰς
  choice: संहार
  rationale: यह शब्द साधारण हत्या से अधिक क्रूर और व्यापक वध का भाव रखता है; ‘संहार’ उस तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῆς πόλεως τῶν ἰδίων
  choice: नगर में अपने ही लोगों का
  rationale: यूनानी वाक्यांश नगर के उन निवासियों को इंगित करता है जो यासोन के अपने लोग थे; यह रूप नागरिक और आत्मीय, दोनों संबंधों को सहज ढंग से व्यक्त करता है।
- source_word: ἀφειδῶς
  choice: निर्दयता से
  rationale: मूल अर्थ बिना किसी को बख्शे या दया किए कार्य करना है; मुख्य पाठ में मुहावरेदार हिन्दी रखी गई है और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: οὐ συννοῶν
  choice: यह नहीं समझता था
  rationale: कृदंत यासोन की नैतिक वास्तविकता को न समझ पाने की दशा बताता है; यह सरल और अर्थनिष्ठ हिन्दी है।
- source_word: εὐημερίαν
  choice: मिली सफलता
  rationale: सैनिक-राजनीतिक संदर्भ में यह अनुकूल परिणाम या सफलता को दर्शाता है; ‘मिली’ जोड़ने से हिन्दी में वाक्य स्वाभाविक होता है, बिना अर्थ बढ़ाए।
- source_word: δυσημερίαν
  choice: विपत्ति
  rationale: यह εὐημερία के विपरीत दुर्भाग्य या अनिष्ट को व्यक्त करता है; ‘विपत्ति’ नैतिक उलटाव को गरिमापूर्ण और सुबोध ढंग से रखता है।
- source_word: συγγενεῖς
  choice: बंधु-बांधव
  rationale: यह साझा नातेदारी या रक्त-संबंध का भाव रखता है; ‘बंधु-बांधव’ आधुनिक पाठक के लिए समझने योग्य है और केवल निकट रिश्तेदारों तक सीमित नहीं है।
- source_word: τὴν μεγίστην
  choice: सबसे बड़ी
  rationale: मूल का स्पष्ट सर्वोत्तमावस्था-सूचक बल सुरक्षित रखा गया है।
- source_word: τρόπαια καταβάλλεσθαι
  choice: विजय-चिह्न खड़े कर रहा है
  rationale: यह सैन्य विजय की स्मृति में स्थापित चिह्नों की प्राचीन छवि को बनाए रखता है; केवल ‘जीत रहा है’ कहने से वह ठोस रूपक खो जाता।
- source_word: πολεμίων
  choice: शत्रुओं
  rationale: यह सामान्य सैन्य अर्थ का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ὁμοεθνῶν
  choice: अपने ही देशवासियों
  rationale: यह समान जातीय या राष्ट्रीय समुदाय के लोगों को दर्शाता है और पहले आए συγγενεῖς के नातेदारी-संबंधी भाव से उपयुक्त भेद बनाए रखता है।
theological_decisions:
- issue: अपने ही लोगों पर प्राप्त बाहरी सफलता और वास्तविक विपत्ति के बीच नैतिक उलटाव
  choice: वर्णनकर्ता के निर्णय को स्पष्ट रखा गया कि बंधु-बांधवों के विरुद्ध मिली सफलता वास्तव में सबसे बड़ी विपत्ति है।
  alternative: ‘समृद्धि’ और ‘दुर्भाग्य’ जैसे अधिक शाब्दिक, किंतु इस युद्ध-संदर्भ में कम स्वाभाविक शब्द।
  rationale: यूनानी पाठ स्वयं इस नैतिक विरोध को प्रस्तुत करता है। अनुवाद इसे न तो नरम करता है, न किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या से विस्तार देता है।
- issue: τρόπαια की विजय-संबंधी छवि
  choice: ‘विजय-चिह्न खड़े कर रहा है’ द्वारा सैन्य स्मारक की छवि बनाए रखी गई।
  alternative: ‘विजय प्राप्त कर रहा है’ या ‘विजय के पुरस्कार जीत रहा है’।
  rationale: ठोस रूपक मूल पाठ का अंग है; इसे सुरक्षित रखने से यासोन के आत्मभ्रम का व्यंग्यात्मक तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘यासोन’ यूनानी नाम Ἰάσων का निकट देवनागरी रूप है। वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है, जबकि कारणात्मक और नैतिक संबंध सुरक्षित हैं।
