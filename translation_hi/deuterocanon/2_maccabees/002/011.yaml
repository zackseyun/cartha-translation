  text: बहुत वर्ष बीत जाने के बाद, जब परमेश्वर को उचित लगा, तब फारस के राजा द्वारा भेजे गए नहेमायाह ने आग छिपाने वाले याजकों के वंशजों को उस आग को लाने के लिए भेजा।
