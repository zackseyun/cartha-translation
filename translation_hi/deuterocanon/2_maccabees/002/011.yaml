lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: बहुत वर्ष बीत जाने के बाद
  rationale: सम्बन्धकारक निरपेक्ष रचना बीते हुए समय को दर्शाती है; ἱκανῶν यहाँ पर्याप्त नहीं, बल्कि बहुत या काफ़ी वर्षों का बोध कराता है।
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: जब परमेश्वर को उचित लगा
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और परमेश्वर के समय व निर्णय को व्यक्त करते हुए 'प्रसन्न हुआ' से उत्पन्न संभावित भावात्मक अर्थ से बचता है।
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: फारस के राजा द्वारा भेजे गए नहेमायाह
  rationale: अओरिस्ट कर्मवाच्य कृदन्त नहेमायाह के पहले भेजे जाने को बताता है; ἀπό यहाँ राजा को भेजने या नियुक्त करने वाले कर्ता के रूप में दर्शाता है।
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: उन याजकों के वंशजों को
  rationale: ἐκγόνους व्यापक रूप से वंशजों को दर्शाता है; इसे केवल पुत्र कहना अनावश्यक रूप से अर्थ को संकीर्ण कर देता।
- source_word: τῶν ἀποκρυψάντων
  choice: जिन्होंने आग छिपाई थी
  rationale: कृदन्त उन पहले उल्लिखित याजकों का वर्णन करता है जिन्होंने पवित्र आग छिपाई थी; हिन्दी में स्पष्टता के लिए सन्दर्भगत कर्म 'आग' व्यक्त किया गया है।
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: उस आग को लाने के लिए भेजा
  rationale: πέμπω के साथ ἐπί और कर्मकारक यहाँ किसी वस्तु को लेने या खोजने के उद्देश्य से भेजने का भाव देते हैं; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: ὅτε ἔδοξεν τῷ θεῷ में परमेश्वर की इच्छा या निर्णय
  choice: जब परमेश्वर को उचित लगा
  alternative: जब परमेश्वर प्रसन्न हुआ
  rationale: चुना हुआ रूप दैवी समय और निर्णय को व्यक्त करता है, पर यूनानी पाठ से अधिक प्रबल भावात्मक या सिद्धान्तगत दावा नहीं जोड़ता।
