base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/009.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chislev[a], we thought it necessary to make this clear to you, so that you also may celebrate the festival of booths and of the fire, when Nehemiah, who built the temple and the altar[c][b], offered sacrifices.
translation:
  language: hi
  text: हम किसलेव की पच्चीसवीं तारीख को मंदिर के शुद्धीकरण का उत्सव मनाने वाले हैं। इसलिए हमने यह आवश्यक समझा कि तुम्हें यह बात स्पष्ट कर दें, ताकि तुम भी झोंपड़ियों का पर्व[a] और आग का पर्व[b] मनाओ, जब नहेमायाह ने, जिसने मंदिर और वेदी बनाए थे[c], बलिदान चढ़ाए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “मंडपों का पर्व” या परंपरागत रूप से “तंबुओं का पर्व” भी कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “और आग का” वाक्यांश बहुत संक्षिप्त है। संभवतः यह नहेमायाह के बलिदानों और आगे वर्णित आग की घटना से जुड़े स्मरणोत्सव की ओर संकेत करता है।
    reason: cultural_note
  - marker: c
    text: यूनानी में क्रिया का अर्थ “बनाए थे” है। ऐतिहासिक संदर्भ के कारण इसे “फिर से बनाए थे” भी समझा जा सकता है, लेकिन मूल पाठ में “फिर से” स्पष्ट रूप से नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: हम ... उत्सव मनाने वाले हैं
  rationale: पर्व के संदर्भ में ἄγω का अर्थ ‘मनाना’ है और μέλλοντες निकट भविष्य का भाव देता है।
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: किसलेव महीने की पच्चीसवीं तारीख को
  rationale: यह किसलेव महीने की पच्चीसवीं तारीख बताता है; हिन्दी में महीने को स्पष्ट करना स्वाभाविक है।
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: मंदिर की शुद्धि
  rationale: καθαρισμός का अर्थ शुद्धि या शुद्धीकरण है और ἱερόν यहाँ मंदिर को दर्शाता है।
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: हमने यह आवश्यक समझा कि तुम्हें यह बात स्पष्ट कर दें
  rationale: यह अनिवार्यता के विचार और बात को साफ-साफ समझाने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: ताकि तुम भी ... मनाओ
  rationale: ἵνα उद्देश्य बताता है, καὶ αὐτοί ‘तुम भी’ पर बल देता है और उत्सव के साथ ἄγω का अर्थ ‘मनाना’ है।
- source_word: σκηνοπηγίας
  choice: झोंपड़ियों का पर्व
  rationale: यह यहूदी पर्व के नाम का अर्थ स्पष्ट करता है और केवल पारंपरिक नाम पर निर्भर नहीं रहता।
- source_word: καὶ τοῦ πυρός
  choice: और आग का पर्व
  rationale: यूनानी वाक्यांश संक्षिप्त है; हिन्दी में समन्वय स्पष्ट करने के लिए ‘पर्व’ दोहराया गया है, जबकि ‘आग’ से संबंधित आशय को अनिर्णीत रखा गया है।
- source_word: ὅτε Νεεμίας
  choice: उस अवसर का, जब नहेमायाह ने
  rationale: ὅτε उस ऐतिहासिक अवसर को आगे के कथन से जोड़ता है; ‘उस अवसर का’ हिन्दी में पूर्ववर्ती पर्व-संदर्भ से संबंध स्पष्ट करता है।
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: जिसने मंदिर और वेदी बनाई थी
  rationale: οἰκοδομέω का प्रत्यक्ष अर्थ ‘बनाना’ है। ऐतिहासिक संदर्भ से ‘फिर से बनाना’ समझा जा सकता है, पर वह उपसर्ग मूल पाठ में नहीं है।
- source_word: ἀνήνεγκεν θυσίας
  choice: बलिदान चढ़ाए थे
  rationale: बलिदान-संदर्भ में ἀναφέρω का स्वाभाविक अर्थ ‘चढ़ाना’ है।
theological_decisions:
- issue: σκηνοπηγίας नाम का अनुवाद
  choice: झोंपड़ियों का पर्व
  alternative: मंडपों का पर्व; तंबुओं का पर्व
  rationale: अर्थानुवाद आधुनिक पाठक को पर्व के नाम का बोध कराता है और किसी एक पारंपरिक कलीसियाई शब्दावली को मुख्य पाठ में अनिवार्य नहीं बनाता।
- issue: καὶ τοῦ πυρός की संक्षिप्त अभिव्यक्ति
  choice: और आग का पर्व
  alternative: और आग का; आग से संबंधित पर्व
  rationale: मूल यूनानी में पदबंध संक्षिप्त और कुछ अस्पष्ट है। ‘पर्व’ की पुनरावृत्ति हिन्दी व्याकरण के लिए सहायक है, पर आग की कथा से उसके संबंध को मुख्य पाठ में विस्तार देकर निश्चित नहीं किया गया।
- issue: οἰκοδομήσας का ऐतिहासिक अर्थ
  choice: बनाई थी
  alternative: फिर से बनाई थी
  rationale: ऐतिहासिक परिस्थिति पुनर्निर्माण का संकेत दे सकती है, फिर भी मूल क्रिया स्वयं केवल ‘बनाना’ कहती है; इसलिए मुख्य पाठ स्रोत की शब्दावली रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘किसलेव’, ‘नहेमायाह’, ‘वेदी’ और ‘बलिदान’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं। मूल यूनानी की संक्षिप्तता और ऐतिहासिक अस्पष्टता को टिप्पणियों द्वारा सुरक्षित रखा गया है।
