  text: And when the priests of Nanea had set them out[a], and he had come with a few men into the enclosure of the sanctuary, they shut the temple as soon as Antiochus entered[c][b],
translation:
  language: hi
  text: और जब ननेआ के याजकों ने उन्हें सामने रख दिया था,[b] और वह थोड़े लोगों के साथ पवित्रस्थान के घेरे में आया, तब अन्तियोखुस के भीतर प्रवेश करते ही उन्होंने मन्दिर बन्द कर दिया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘उन्हें’ का संकेत यूनानी पाठ में स्पष्ट नहीं किया गया है; सम्भवतः यह कथा में पहले उल्लिखित वस्तुओं की ओर संकेत करता है।
    reason: cross_reference
  - marker: c
    text: यह पद अन्तियोखुस और ननेआ के मन्दिर की उस कथा का अंश प्रतीत होता है जो अन्य पाठ-परम्पराओं में 2 मक्काबियों 1:13–15 से जुड़ी है; अध्याय 2 के आसपास के प्रसंग से स्पष्ट असंगति के बावजूद उपलब्ध स्रोत-पाठ का अनुवाद यथावत् किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: προθεμένων αὐτά
  choice: उन वस्तुओं को सामने रख दिया था
  rationale: प्रसंग में सर्वनाम का संकेत वस्तुओं की ओर है, पर वे कौन-सी वस्तुएँ थीं यह इस पद में नहीं बताया गया। ‘सामने रख दिया’ προτίθημι की ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: ननैया के याजकों
  rationale: देवता के यूनानी नाम Ναναίου को हिन्दी में ‘ननैया’ लिप्यंतरित किया गया है; सम्बन्धकारक रचना को सीधे ‘के याजकों’ कहा गया है।
- source_word: κἀκεῖνον προσελθόντος
  choice: और वह ... आ गया
  rationale: ἐκεῖνον का पुरुषवाचक संकेत स्पष्ट संज्ञा के बिना सुरक्षित रखा गया है; आगे अन्तियोखुस का नाम आने से पाठक सम्भावित संदर्भ समझ सकता है, पर अनुवाद उसे समय से पहले निश्चित नहीं करता।
- source_word: μετʼ ὀλίγων
  choice: कुछ लोगों के साथ
  rationale: यूनानी में साथियों के लिए संज्ञा व्यक्त नहीं है। हिन्दी में ‘लोगों’ जोड़ना आवश्यक अर्थ को सहज बनाता है, बिना उनका पद या लिंग अनावश्यक रूप से निश्चित किए।
- source_word: περίβολον τοῦ τεμένους
  choice: पवित्रस्थान के घेरे में
  rationale: περίβολος घिरी हुई परिधि या अहाते को और τέμενος पवित्र क्षेत्र को दर्शाता है। ‘पवित्रस्थान का घेरा’ दोनों के सम्बन्ध और स्थानगत भेद को संक्षेप में बनाए रखता है।
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: उन्होंने मन्दिर बन्द कर दिया
  rationale: συγκλείω बन्द कर देने को बताता है, पर ताला लगाने की विधि नहीं बताता। ἱερόν के लिए ‘मन्दिर’ पहले आए τέμενος से भेद स्पष्ट करता है।
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  choice: अन्तियोखुस के भीतर प्रवेश करते ही
  rationale: ὡς और भूतकालिक क्रिया यहाँ समय और तात्कालिकता बताते हैं। ‘करते ही’ जाल बन्द किए जाने की तुरन्त घटित क्रिया को व्यक्त करता है।
