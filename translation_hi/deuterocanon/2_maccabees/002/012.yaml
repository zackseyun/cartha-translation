  yaml_path: translation/deuterocanon/2_maccabees/002/012.yaml
  text: As they explained to us that they had found not fire but thick water[a], he ordered them, after drawing some out, to bring it. Then when the things for the sacrifices had been brought forward[c][b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid upon it.
translation:
  language: hi
  text: जब उन्होंने हमें बताया कि उन्हें आग नहीं, बल्कि गाढ़ा पानी[a] मिला था, तो उसने उन्हें आदेश दिया कि वे उसमें से कुछ निकालकर[b] ले आएँ। फिर जब बलियों की सामग्री सामने लाई गई, तो नहेमायाह ने याजकों को आदेश दिया कि वे उस पानी को लकड़ियों और उन पर रखी हुई वस्तुओं पर छिड़कें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घना पानी” अथवा “गाढ़ा द्रव।” यूनानी अभिव्यक्ति असामान्य है और शायद उस पदार्थ की विचित्रता पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी कृदंत दुर्लभ और कठिन है; आशय संभवतः उस द्रव में से कुछ निकालकर लाने का है।
    reason: textual_difficulty
  - marker: c
    text: या “उस पानी को लकड़ियों और उन पर रखी हुई वस्तुओं पर उड़ेलें।”
    reason: alternative_reading
lexical_decisions:
- source_word: διεσάφησαν
  choice: स्पष्ट किया
  rationale: क्रिया का अर्थ किसी बात को साफ़-साफ़ बताना या स्पष्ट करना है। यह कथावाचक को दी गई सूचना की स्पष्टता बनाए रखता है।
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: उन्हें आग नहीं, बल्कि गाढ़ा पानी मिला था
  rationale: यह असामान्य यूनानी अभिव्यक्ति ज्यों की त्यों रखी गई है, ताकि पदार्थ की विचित्रता को व्याख्यात्मक रूप से साधारण 'द्रव' बनाकर न मिटाया जाए।
- source_word: ἀποβλίψαντας
  choice: उसमें से कुछ निकालकर
  rationale: यह दुर्लभ और कठिन कृदंत संदर्भ में उस पदार्थ का कुछ अंश निकालने का संकेत देता है। व्यापक अभिव्यक्ति अनावश्यक रूप से किसी खास विधि का दावा नहीं करती।
- source_word: φέρειν
  choice: ले आएँ
  rationale: ἐκέλευσεν के बाद यह आज्ञार्थक आशय वाला infinitive है; हिंदी में 'ले आएँ' संदर्भानुकूल और स्वाभाविक है।
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: बलियों की सामग्री सामने लाई गई
  rationale: यूनानी पदबंध संक्षिप्त और व्यापक है। 'सामग्री' बलि से जुड़ी वस्तुओं को समेटता है, पर उसे केवल बलि-पशुओं तक सीमित नहीं करता।
- source_word: ἐπιρᾶναι
  choice: छिड़कें
  rationale: क्रिया किसी वस्तु पर द्रव लगाने या डालने का बोध कराती है; बलि के प्रसंग में 'छिड़कें' उपयुक्त है, जबकि अधिक सामान्य विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: लकड़ियों और उन पर रखी हुई वस्तुओं पर
  rationale: यह लकड़ियों तथा उनके ऊपर रखी चीज़ों—संभवतः बलि-सामग्री—दोनों को दर्शाता है। अनुवाद मूल की व्यापकता को बनाए रखता है।
- source_word: Νεεμίας
  choice: नहेमायाह
  rationale: नाम का रूप प्रचलित आधुनिक हिंदी बाइबलीय वर्तनी के अनुसार रखा गया है।
theological_decisions:
- issue: वेदी की सामग्री पर द्रव लगाने की रीति
  choice: पानी को ... पर छिड़कें
  alternative: पानी को ... पर उड़ेलें
  rationale: यूनानी क्रिया द्रव को ऊपर लगाने का भाव देती है। बलि-संबंधी प्रसंग में 'छिड़कें' स्वाभाविक है, पर अधिक व्यापक अर्थ को पादटिप्पणी में रखा गया है; किसी विशिष्ट सांप्रदायिक अनुष्ठान को आरोपित नहीं किया गया।
- issue: ὕδωρ παχύ की असामान्य अभिव्यक्ति
  choice: गाढ़ा पानी
  alternative: गाढ़ा द्रव
  rationale: मूल कथन जानबूझकर विचित्र सुनाई देता है। 'गाढ़ा पानी' उस कथात्मक आश्चर्य और तनाव को सुरक्षित रखता है, जबकि 'द्रव' अर्थ को सहज बनाकर मूल की असामान्यता घटा सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'गाढ़ा पानी' जैसी मूल की असामान्य अभिव्यक्ति को संरक्षित किया गया है। 'बलियों की सामग्री' संक्षिप्त यूनानी पदबंध की व्यापकता बनाए रखता है, और सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
