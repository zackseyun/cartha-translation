  text: just as he promised through the law[a]. For we hope in God that he will soon have mercy on us and gather us from under heaven into the holy place[c][b]; for he rescued us from great evils and cleansed the place.
translation:
  language: hi
  text: जैसा कि उसने व्यवस्था के द्वारा प्रतिज्ञा की थी। क्योंकि हम परमेश्वर में आशा रखते हैं कि वह शीघ्र ही हम पर दया करेगा और हमें आकाश के नीचे से[a] पवित्र स्थान में[b] इकट्ठा करेगा; क्योंकि उसने हमें बड़ी विपत्तियों[c] से छुड़ाया और उस स्थान को शुद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश के नीचे हर जगह से,” अर्थात बिखराव के स्थानों से।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यरूशलेम का पवित्र स्थल; इस संदर्भ में मंदिर-परिसर।
    reason: cultural_note
  - marker: c
    text: या, “बड़ी बुराइयों से” अथवा “बड़े संकटों से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἐπηγγείλατο
  choice: जैसा उसने प्रतिज्ञा की थी
  rationale: καθώς की अनुरूपता और ἐπαγγέλλομαι के सामान्य अर्थ ‘प्रतिज्ञा करना’—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διὰ τοῦ νόμου
  choice: व्यवस्था के द्वारा
  rationale: सम्बन्धकारक के साथ διά यहाँ माध्यम को सूचित करता है; प्रतिज्ञा व्यवस्था के माध्यम से दी गई थी।
- source_word: ἐλπίζομεν ... ἐπὶ τῷ θεῷ
  choice: हमें परमेश्वर पर आशा है
  rationale: यह मुहावरा किसी पर आशा रखने का भाव देता है; हिन्दी में यह स्वाभाविक और स्रोत के निकट है।
- source_word: ταχέως
  choice: शीघ्र ही
  rationale: भावी क्रिया के साथ यह निकट समय अथवा तत्परता व्यक्त करता है; ‘शीघ्र ही’ वर्तमान, गरिमापूर्ण हिन्दी है।
- source_word: ἐλεήσει
  choice: हम पर दया करेगा
  rationale: ἐλεέω का सामान्य अर्थ दया करना है और वाक्य का धार्मिक स्वर सुरक्षित रहता है।
- source_word: ἐπισυνάξει
  choice: इकट्ठा करेगा
  rationale: क्रिया साथ लाने या एकत्र करने को दर्शाती है और निर्वासन से पुनः एकत्र किए जाने के संभावित भाव को खुला रखती है।
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανόν
  choice: आकाश के नीचे से
  rationale: यूनानी पदबंध संक्षिप्त और कुछ हद तक दीर्घवृत्तीय है। यह अनुवाद उसके बिंब को बचाता है; बिखराव के सभी स्थानों का आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: εἰς τὸν ἅγιον τόπον
  choice: पवित्र स्थान में
  rationale: τόπος का सीधा अर्थ ‘स्थान’ है और εἰς गमन की दिशा बताता है। ‘मन्दिर’ जोड़ने के बजाय मूल की सामान्य अभिव्यक्ति रखी गई है।
- source_word: ἐξείλατο
  choice: छुड़ाया है
  rationale: मध्यवाच्य ἐξαιρέω संकट से बचाने या छुड़ाने का अर्थ देता है; हिन्दी में ‘छुड़ाया’ सजीव और स्वाभाविक है।
- source_word: ἐκ μεγάλων κακῶν
  choice: बड़ी विपत्तियों से
  rationale: κακά यहाँ बुराइयों, संकटों या विपत्तियों के लिए व्यापक रूप से प्रयुक्त हो सकता है। ऐतिहासिक कष्टों के सन्दर्भ में ‘विपत्तियाँ’ स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: τὸν τόπον ἐκαθάρισεν
  choice: उस स्थान को शुद्ध किया है
  rationale: καθαρίζω शुद्ध या स्वच्छ करने का अर्थ देता है। ‘स्थान’ से τόπος की शब्दावली बनी रहती है और ‘शुद्ध किया’ धार्मिक स्थल की विधिगत शुद्धि के अनुकूल है।
theological_decisions:
- issue: ‘पवित्र स्थान’ और ‘उस स्थान’ का संकेत
  choice: मुख्य पाठ में दोनों जगह ‘स्थान’ रखा गया है।
  alternative: ‘पवित्रस्थान’, ‘मन्दिर’ या ‘मन्दिर-परिसर’
  rationale: सन्दर्भ यरूशलेम के पवित्र मन्दिर-स्थल की ओर संकेत करता है, पर यूनानी पाठ में अधिक सामान्य संज्ञा τόπος है। इसलिए मुख्य पाठ उसे अधिक विशिष्ट नहीं बनाता; सन्दर्भगत अर्थ पादटिप्पणी में दिया गया है।
- issue: ἐκ μεγάλων κακῶν का अर्थ-क्षेत्र
  choice: ‘बड़ी विपत्तियों से’
  alternative: ‘बड़ी बुराइयों से’ या ‘बड़े संकटों से’
  rationale: κακά नैतिक बुराई और भोगी गई मुसीबत—दोनों का बोध करा सकता है। इस ऐतिहासिक सन्दर्भ में ‘विपत्तियाँ’ अधिक स्वाभाविक है, पर व्यापक अर्थ को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। ‘व्यवस्था’, ‘प्रतिज्ञा’, ‘दया’ और ‘शुद्ध’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं, पर पुरातन या अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान विषय से मेल नहीं खाता था; हिन्दी मुख्य पाठ में [a] को ‘आकाश के नीचे’, [b] को ‘पवित्र स्थान’ और [c] को ‘बड़ी विपत्तियों’ के साथ स्रोतार्थ के अनुसार रखा गया है।
