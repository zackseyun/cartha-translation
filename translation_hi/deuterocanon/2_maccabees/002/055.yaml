  text: हर विषय का ठीक-ठीक और विस्तार से वर्णन लेखक पर छोड़ते हुए,[a] हम इस संक्षेप की रूपरेखा के अनुसार आगे बढ़ने का प्रयत्न कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
