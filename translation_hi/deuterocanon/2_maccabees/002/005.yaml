  text: क्योंकि जब अन्तियोखुस और उसके मित्र उसके साथ उस स्थान तक जा रहे थे[a], तब वे निरीक्षण के बहाने धन पर अधिकार करने के लिए उसे वहाँ ले जा रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
