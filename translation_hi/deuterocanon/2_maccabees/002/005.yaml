    text: इस पद का प्रेषित यूनानी पाठ वाक्य-विन्यास की दृष्टि से कठिन है; कर्ता, कर्म और सर्वनाम किसे सूचित करते हैं, इसके कुछ विवरण अनिश्चित हैं।
