lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: उसके साथ … जा रहे थे
  rationale: συνοικέω का सामान्य अर्थ ‘साथ रहना’ है, पर यहाँ स्थान की ओर गति के संदर्भ और पाठ की कठिन वाक्य-रचना में साथ जाने का भाव अधिक स्वाभाविक है। αὐτῇ के स्त्रीलिंग संकेत को ‘उसके’ में सुरक्षित रखा गया है; हिन्दी में इसका लिंग स्पष्ट नहीं होता, इसलिए अनिश्चितता नहीं मिटाई गई।
- source_word: παρῆγεν εἰς τὸν τόπον
  choice: उसे वहाँ ले जा रहे थे
  rationale: παράγω में ‘साथ ले जाना’ या ‘पहुँचाना’ का भाव हो सकता है। यूनानी में कर्म व्यक्त नहीं है; हिन्दी वाक्य की सुबोधता के लिए ‘उसे’ न्यूनतम रूप से जोड़ा गया है और इसकी अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: οἱ σὺν αὐτῷ φίλοι
  choice: उसके मित्र
  rationale: यह अन्तियोखुस के साथ उपस्थित उसके निकट सहयोगियों या मित्रों का स्वाभाविक हिन्दी रूप है।
- source_word: κύριον τὸ λαβεῖν
  choice: अधिकार करने के लिए
  rationale: यह अभिव्यक्ति केवल धन उठा लेने के बजाय उस पर प्रभुत्व या नियंत्रण प्राप्त करने का संकेत देती है।
- source_word: τὰ χρήματα πλείονα
  choice: धन
  rationale: χρήματα का मूल अर्थ धन-संपत्ति है। πλείονα संभवतः अधिक या बड़ी धनराशि का संकेत देता है, किंतु प्रेषित पाठ की वाक्य-रचना कठिन है; विस्तृत विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: εἰς ἐφορῆς λόγον
  choice: निरीक्षण के बहाने
  rationale: λόγον यहाँ बताए गए आधार या कारण का, और ἐφορῆς निरीक्षण/देखरेख का बोध कराता है। प्रसंग में यह वास्तविक उद्देश्य को ढकने वाले दावे के रूप में समझ में आता है।
