  text: Likewise also Judas gathered together for us all the things that had been scattered because of the war that had occurred[b][a], and they are with us.
translation:
  language: hi
  text: इसी प्रकार, यहूदा ने भी हमारे लिए उन सब चीज़ों को इकट्ठा किया जो उस युद्ध के कारण तितर-बितर हो गई थीं जो हुआ था[a], और वे हमारे पास हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बिखर गई थीं।” यूनानी पाठ इस पद में इन चीज़ों का अधिक स्पष्ट परिचय नहीं देता, यद्यपि प्रसंग से अभिलेखों या लेखों का संकेत मिल सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और वह हमारे पास है”; यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ यहाँ एकवचन क्रिया प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως δὲ καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पद को पिछले कथन से तुलना और आगे की निरंतरता—दोनों के साथ जोड़ता है; आधुनिक हिन्दी में यह सहज और संक्षिप्त है।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: इस व्यक्ति के नाम का प्रचलित हिन्दी बाइबलीय रूप ‘यहूदा’ है; यहाँ संकेत यहूदा मकाबी की ओर है।
- source_word: τὰ διεσπεπτωκότα ... πάντα
  choice: उन सब चीज़ों ... जो ... तितर-बितर हो गई थीं
  rationale: नपुंसकलिंग बहुवचन को जानबूझकर व्यापक रखा गया है, क्योंकि यूनानी इस पद में वस्तुओं को अभिलेख या लेख कहकर अधिक स्पष्ट नहीं करता; पूर्ण कृदंत बिखर जाने के परिणामी भाव को व्यक्त करता है।
- source_word: διὰ τὸν γεγονότα πόλεμον
  choice: उस युद्ध के कारण
  rationale: यह कारण-संबंध को स्पष्ट रखता है। ‘उस’ से यूनानी निश्चित पदबंध में पहले घट चुके, पहचाने हुए युद्ध का संकेत स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: 'सम्प्रदान कारक को लाभार्थक अर्थ में लिया गया है: यहूदा ने समुदाय के हित में सामग्री एकत्र की।'
- source_word: ἐπισυνήγαγεν
  choice: इकट्ठा किया
  rationale: संयुक्त क्रिया का एक स्थान पर संग्रह करने का भाव सरल, वर्तमान हिन्दी में स्वाभाविक रूप से आता है।
- source_word: καὶ ἔστιν παρʼ ἡμῖν
  choice: और वे हमारे पास हैं
  rationale: नपुंसकलिंग बहुवचन कर्ता के साथ यूनानी का एकवचन क्रिया-रूप सामान्य व्याकरणिक प्रयोग है; हिन्दी में बहुवचन ‘वे ... हैं’ संदर्भित वस्तुओं और उनके वर्तमान अधिकार/उपलब्धता को ठीक से व्यक्त करता है।
