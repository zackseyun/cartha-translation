lexical_decisions:
- source_word: Οἱ δὲ
  choice: और
  rationale: δέ यहाँ प्रबल विरोध नहीं, बल्कि कथा को आगे बढ़ाने वाला हल्का संयोजक है; इसलिए ‘और’ स्वाभाविक है।
- source_word: ἱερεῖς
  choice: याजक
  rationale: यह पहचाने हुए याजकों के समूह को सूचित करता है; हिन्दी में प्रसंग के अनुसार निश्चितता बिना अलग संकेत के स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἐπέαλλον
  choice: गा रहे थे
  rationale: अपूर्ण भूतकालीन क्रिया जारी गतिविधि दर्शाती है। ‘गा रहे थे’ आधुनिक हिन्दी में स्वाभाविक है और स्तुतिगानों के स्वरबद्ध गायन को व्यक्त करता है।
- source_word: τοὺς ὕμνους
  choice: स्तुतिगान
  rationale: ὕμνους धार्मिक प्रशंसा के गीतों को सूचित करता है; ‘स्तुतिगान’ संक्षिप्त, गरिमापूर्ण और उपासना-संदर्भ के अनुकूल है।
