  yaml_path: translation/deuterocanon/2_maccabees/002/014.yaml
  text: And the priests made prayer when the sacrifice had been consumed[a], both the priests and all the others, with Jonathan beginning and the rest responding[b], as in Nehemiah.
translation:
  language: hi
  text: जब बलिदान भस्म हो रहा था, तब याजकों ने प्रार्थना की—याजकों ने और सबने मिलकर[a]। योनातान ने आरंभ किया, और शेष लोग ऊँचे स्वर में प्रत्युत्तर देते रहे, नहेमायाह की तरह[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्य में ‘याजकों’ का उल्लेख दो बार आता है—शाब्दिक रूप से, ‘याजकों ने प्रार्थना की … याजकों ने और सबने।’ संभवतः इससे इस बात पर बल दिया गया है कि पूरी सभा प्रार्थना में सम्मिलित थी।
    reason: मूल पाठ की असहज पुनरुक्ति और उसके संभावित बल को स्पष्ट करना।
  - marker: b
    text: यूनानी में केवल ‘जैसा नहेमायाह का’ कहा गया है। इसका अर्थ ‘जैसा नहेमायाह ने किया था,’ ‘जैसा नहेमायाह की प्रार्थना में था,’ या नहेमायाह से संबद्ध किसी रीति के अनुसार हो सकता है।
    reason: दीर्घवृत्तात्मक यूनानी वाक्यांश की वास्तविक व्याख्यात्मक अनिश्चितता सुरक्षित रखना।
lexical_decisions:
- source_word: προσευχὴν ... ἐποιήσαντο
  choice: प्रार्थना की
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘प्रार्थना बनाई/की’ है; आधुनिक हिन्दी में ‘प्रार्थना की’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: δαπανωμένης τῆς θυσίας
  choice: जब बलिदान भस्म हो रहा था
  rationale: वर्तमान कृदन्त चल रही क्रिया बताता है। बलिदान के प्रसंग में δαπανάω का भाव उसके आग में भस्म होते जाने का है, न कि आवश्यक रूप से उसके पहले ही पूर्णतः भस्म हो चुकने का।
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: याजकों ने और सभी लोगों ने
  rationale: मूल पाठ में ‘याजक’ का दोहराव है और फिर सबकी सहभागिता कही गई है। हिन्दी में डैश के बाद इस पुनरुक्ति को रखते हुए समूची सभा की भागीदारी स्पष्ट की गई है।
- source_word: καταρχομένου Ἰωνάθον
  choice: योनातान ने आरंभ किया
  rationale: κατάρχομαι यहाँ प्रार्थना या सामूहिक उच्चारण का आरंभ करने अथवा उसकी अगुवाई करने का भाव देता है; ‘आरंभ किया’ यह खुलापन बनाए रखता है।
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: बाकी लोग ऊँचे स्वर में प्रत्युत्तर देते रहे
  rationale: ἐπιφωνέω में सुनाई देने योग्य पुकार या प्रत्युत्तर का भाव है। यह अनुवाद संभावित सामूहिक प्रत्युत्तर को व्यक्त करता है, पर किसी विशिष्ट उपासना-पद्धति को निश्चित नहीं करता।
- source_word: ὡς Νεεμίου
  choice: जैसा नहेमायाह के समय हुआ था
  rationale: यूनानी पद अत्यंत संक्षिप्त और दीर्घवृत्तात्मक है। मुख्य पाठ में तुलना को सुबोध बनाया गया है, जबकि संभावित अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ὡς Νεεμίου का दीर्घवृत्तात्मक अर्थ
  choice: जैसा नहेमायाह के समय हुआ था
  alternative: जैसा नहेमायाह ने किया था; अथवा नहेमायाह की प्रार्थना के अनुसार
  rationale: मूल यूनानी यह स्पष्ट नहीं करता कि तुलना नहेमायाह के कार्य से है, उसके समय की घटना से, या उससे संबद्ध प्रार्थना से। हिन्दी मुख्य पाठ को पठनीय बनाया गया है और वास्तविक अनिश्चितता पादटिप्पणी में दी गई है।
- issue: सामूहिक प्रार्थना का स्वरूप
  choice: योनातान ने आरंभ किया और बाकी लोग ऊँचे स्वर में प्रत्युत्तर देते रहे
  alternative: योनातान अगुवाई कर रहा था और शेष लोग पुकार रहे थे
  rationale: पाठ में नेतृत्व और सामूहिक मौखिक सहभागिता है, पर इससे किसी निश्चित सांप्रदायिक अनुष्ठान या उत्तरगान-पद्धति को सिद्ध नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याजक,’ ‘बलिदान’ और ‘प्रार्थना’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं। वर्तमान कृदन्त का कालगत भाव ‘भस्म हो रहा था’ से व्यक्त किया गया है।
