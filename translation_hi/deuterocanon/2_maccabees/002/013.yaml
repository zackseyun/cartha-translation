  alternative: ‘हालाँकि पहले बादल छाए हुए थे’
  rationale: यूनानी कृदंत-पदबंध स्वयं पूर्वकाल या स्पष्ट विरोधसूचक संबंध निर्धारित नहीं करता। सीधा वर्णन मूल की वास्तविक अस्पष्टता को अधिक अच्छी तरह सुरक्षित रखता है।
