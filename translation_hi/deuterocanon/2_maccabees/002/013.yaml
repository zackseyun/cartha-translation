  rationale: ὥστε परिणाम प्रकट करता है और πάντας का सार्वभौमिक अर्थ ‘सभी’ से सुरक्षित रहता है। ‘अचंभित रह गए’ θαυμάζω के विस्मय को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रसंग में πυρά की प्रकृति
  choice: मुख्य पाठ में सामान्य रूप से ‘आग’
  alternative: ‘बलिदान की बड़ी आग’
