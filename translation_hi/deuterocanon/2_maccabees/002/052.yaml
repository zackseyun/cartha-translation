translation:
  language: hi
  text: हमने ध्यान रखा है कि जो लोग पढ़ना चाहते हैं, उन्हें आनंद मिले; जो इसे याद करने के इच्छुक हैं, उन्हें सुविधा हो; और जिनके हाथ यह आए, उन सबको लाभ हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαγωγίαν
  choice: आनंद
  rationale: यह दुर्लभ शब्द यहाँ पढ़ने में सुख या रुचिकर अनुभव का भाव देता है; ‘आनंद’ सरल और प्रसंगानुकूल है।
- source_word: φιλοφρονοῦσιν
  choice: इच्छुक हैं
  rationale: संदर्भ में यह मन लगाकर या अनुकूल प्रवृत्ति से स्मरण करने की इच्छा को व्यक्त करता है; हिन्दी में सहज रूप से ‘इच्छुक’ कहा गया है।
- source_word: διαμνήμης ἀναλαβεῖν
  choice: स्मृति में सँजोने
  rationale: वाक्यांश का आशय सामग्री को ग्रहण करके स्मरण में बनाए रखना है; ‘सँजोने’ इस स्थायी स्मरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐντυγχάνουσιν
  choice: इसे पढ़ें
  rationale: पुस्तकीय संदर्भ में क्रिया का अर्थ किसी लेख से रूबरू होना, उसे हाथ में लेना या पढ़ना हो सकता है; यहाँ लक्षित पाठकों के लिए ‘पढ़ें’ सबसे स्पष्ट हिन्दी है।
- source_word: ὠφέλειαν
  choice: लाभ
  rationale: यह व्यावहारिक या नैतिक उपयोगिता के व्यापक अर्थ को बिना अनावश्यक व्याख्या के बनाए रखता है।
