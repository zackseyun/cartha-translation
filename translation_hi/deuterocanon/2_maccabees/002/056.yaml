  yaml_path: translation/deuterocanon/2_maccabees/002/056.yaml
  text: For just as[a], in the case of a new house, the architect must take thought for the whole foundation, but the one undertaking to decorate and paint it must examine the things suitable for adornment, so also, I think, it is with us.
translation:
  language: hi
  text: क्योंकि जैसे एक नए घर के मामले में वास्तुकार को पूरी नींव का ध्यान रखना होता है, पर जो उसे सजाने[a] और चित्रित करने का काम हाथ में लेता है, उसे सजावट के लिए उपयुक्त चीज़ों की जाँच करनी होती है, वैसे ही, मेरा विचार है, हमारे मामले में भी ऐसा ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे साज-सामान से तैयार करने’; यहाँ प्रयुक्त यूनानी क्रिया का अर्थ घर को तैयार करना या सुसज्जित करना भी हो सकता है, केवल अलंकृत करना नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: जैसे
  rationale: यह तुलना आरंभ करता है; ‘जैसे...वैसे ही’ यूनानी वाक्य-संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τῆς καινῆς οἰκίας
  choice: एक नए घर के मामले में
  rationale: οἰκία का ठोस अर्थ ‘घर’ है और ἐπί के तुलनात्मक प्रयोग को ‘के मामले में’ स्पष्ट करता है।
- source_word: ἀρχιτέκτονι
  choice: वास्तुकार
  rationale: यह प्रधान योजनाकार या निर्माण-विशेषज्ञ की भूमिका को सामान्य ‘निर्माता’ से अधिक ठीक रूप में व्यक्त करता है।
- source_word: τῆς ὅλης καταβολῆς
  choice: पूरी नींव
  rationale: καταβολή यहाँ नींव डालने या आधार-निर्माण का बोध कराता है; ‘पूरी नींव’ ὅλης की समग्रता भी बनाए रखता है।
- source_word: φροντιστέον
  choice: चिंता करनी होती है
  rationale: यूनानी कृत्यवाचक विशेषण आवश्यकता के साथ सावधानीपूर्वक ध्यान देने का भाव रखता है।
- source_word: ἐγκαινίζειν
  choice: सजाने
  rationale: ζωγραφεῖν और διακόσμησιν के साथ इस प्रसंग में यह घर को तैयार करने या अलंकृत करने का भाव देता है; व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ζωγραφεῖν
  choice: रंगने
  rationale: घर के अलंकरण के संदर्भ में चित्रकारी या रंग लगाने के अर्थ को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν
  choice: सजावट के लिए उपयुक्त चीज़ों
  rationale: वाक्यांश को केवल निर्माण-सामग्री तक सीमित किए बिना उसकी खुली व्यापकता सुरक्षित रखता है।
- source_word: ἐξεταστέον
  choice: जाँच करनी होती है
  rationale: यह भी आवश्यकता व्यक्त करने वाला रूप है और सावधानी से परखने या विचार करने का भाव बनाए रखता है।
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: वैसे ही, मेरा विचार है, हमारे मामले में भी है
  rationale: लेखक की संकोचपूर्ण निजी टिप्पणी और उपमा के अपने कार्य पर अनुप्रयोग—दोनों सुरक्षित रहते हैं।
