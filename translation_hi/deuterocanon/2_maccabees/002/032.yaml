  rationale: साहित्यिक पद्धति में विवेकहीनता के लिए प्रयुक्त विशेषण को स्पष्ट संज्ञात्मक हिन्दी में व्यक्त करता है।
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: इतिहास से पहले बहुत विस्तार करना
  rationale: प्रमुख ऐतिहासिक वृत्तांत से पहले अनुचित रूप से अधिक बोलने या लिखने का भाव देता है और कृत्रिम शाब्दिकता से बचता है।
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: पर स्वयं इतिहास को संक्षिप्त कर देना
  rationale: μέν...δέ का विरोध ‘पर’ द्वारा और ἐπιτέμνειν का काटकर छोटा करने का साहित्यिक भाव ‘संक्षिप्त कर देना’ द्वारा व्यक्त है।
