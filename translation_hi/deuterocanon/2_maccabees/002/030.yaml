- source_word: πολυπραγμονεῖν
  choice: बारीकी से छानबीन करना
  rationale: संदर्भ में यह दूसरों के मामलों में हस्तक्षेप नहीं, बल्कि विवरणों में अत्यधिक लगकर खोजबीन करने को दर्शाता है। निकटवर्ती पदबंध के साथ मिलकर यह गहन सूक्ष्म जाँच का भाव देता है।
- source_word: ἐν τοῖς κατὰ μέρος
  choice: हर छोटी-बड़ी बात की
