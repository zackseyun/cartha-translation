- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: मूल इतिहासकार का
  rationale: दुर्लभ शब्द ἀρχηγενέτης इतिहास को पहले रचने या प्रस्तुत करने वाले व्यक्ति को सूचित करता है। ‘मूल इतिहासकार’ उसे केवल सामान्य ‘लेखक’ कहने की अपेक्षा यह भेद अधिक संक्षेप में बचाता है।
- source_word: καθήκει
  choice: काम है
  rationale: क्रिया बताती है कि यह दायित्व या भूमिका किसके लिए उचित है। हिन्दी में ‘का काम है’ स्वाभाविक ढंग से उसी औचित्य और उत्तरदायित्व को व्यक्त करता है।
