translation:
  language: hi
  text: परन्तु संक्षिप्त अभिव्यक्ति का लक्ष्य रखना और विषय के विस्तृत विवेचन से बचना, संक्षिप्त रूप[a] तैयार करने वाले व्यक्ति को स्वीकार्य छूट के रूप में दिया जाना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुवाद,” यदि μετάφρασις को उसके अधिक सामान्य अर्थ में लिया जाए; यहाँ प्रसंग “संक्षिप्त रूप” या “सार-संस्करण” के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον τῆς λέξεως
  choice: अभिव्यक्ति में संक्षिप्तता
  rationale: लेखक की चिंता किसी एक शब्द की नहीं, बल्कि कथन-शैली की संक्षिप्तता से है; यह हिन्दी प्रयोग उस साहित्यिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μεταδιώκειν
  choice: लक्ष्य रखना
  rationale: यह क्रिया किसी गुण को पाने या साधने का प्रयत्न बताती है; ‘लक्ष्य रखना’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: τὸ ἐξεργαστικὸν τῆς πραγματίας
  choice: विषय का विस्तृत विवेचन
  rationale: यह पद विषय-वस्तु को पूरी तरह और विस्तार से विकसित करने का भाव देता है; ‘विस्तृत विवेचन’ संक्षिप्तता के साथ निहित विरोध को बनाए रखता है।
- source_word: παραιτεῖσθαι
  choice: से बचना
  rationale: मध्यवाच्य क्रिया यहाँ किसी काम को छोड़ देने या उससे विरत रहने का अर्थ देती है; ‘से बचना’ सरल है और जानबूझकर विस्तार न करने का भाव रखता है।
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: उस व्यक्ति के लिए ... जो संक्षिप्त रूप तैयार कर रहा है
  rationale: यद्यपि μετάφρασις का सामान्य अर्थ ‘अनुवाद’ हो सकता है, इस भूमिका के संदर्भ में लेखक यासोन के बड़े ग्रंथ को संक्षिप्त रूप देने की बात कर रहा है।
- source_word: συγχωρητέον
  choice: स्वीकार्य होना चाहिए
  rationale: यूनानी क्रियाविशेषणीय विशेषण उस बात को व्यक्त करता है जिसे मान लेना या जिसकी अनुमति देना उचित है; यह हिन्दी रूप उसके निर्वैयक्तिक विध्यर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: μετάφρασις का संदर्भगत अर्थ
  choice: संक्षिप्त रूप तैयार करना
  alternative: अनुवाद करना
  rationale: आसपास का प्रसंग यासोन कुरेनी के विस्तृत इतिहास को छोटा करके प्रस्तुत करने का है, इसलिए यहाँ भाषान्तर के बजाय संक्षेपण का अर्थ अधिक उपयुक्त है। फिर भी शब्द का अधिक सामान्य वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
