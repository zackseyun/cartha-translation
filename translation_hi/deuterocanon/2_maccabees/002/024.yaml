  yaml_path: translation/deuterocanon/2_maccabees/002/024.yaml
  text: But when the matter became known[a], and it was reported to the king of the Persians that in the place where the priests who had been taken away had hidden the fire, water appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: hi
  text: पर जब यह बात प्रकट हो गई और फ़ारसियों के राजा को बताया गया कि जिस स्थान पर ले जाए गए याजकों[a] ने आग छिपाई थी, वहाँ पानी दिखाई दिया, जिससे[c] नहेमायाह और उसके साथियों[b] ने बलिदानों को शुद्ध किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘निर्वासित याजक’ भी हो सकता है। यूनानी शब्द उन याजकों को दर्शाता है जिन्हें उनके स्थान से हटाकर ले जाया गया था, सम्भवतः निर्वासन में।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘नहेमायाह के आस-पास के लोग’; अर्थात नहेमायाह और उससे जुड़े लोग।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में पानी के लिए आया वाक्यांश स्रोत (‘जिससे’ या ‘उस पानी से’) या साधन (‘जिससे’) का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: यह बात प्रकट हो गई
  rationale: यह वाक्यांश किसी घटना के सामने आ जाने या ज्ञात हो जाने को दर्शाता है। ‘प्रकट हो गई’ परिणामसूचक भाव को बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: διηγήθη
  choice: बताया गया
  rationale: निष्क्रिय क्रिया यहाँ समाचार राजा तक पहुँचाए जाने का भाव देती है। ‘बताया गया’ सहज हिन्दी में इसी कथात्मक अर्थ को व्यक्त करता है।
- source_word: τῷ βασιλεῖ τῶν Περσῶν
  choice: फ़ारसियों के राजा को
  rationale: यह यूनानी संबंधकारक संरचना का निकट और स्पष्ट अनुवाद है तथा किसी विशेष राजा की पहचान पाठ में नहीं जोड़ता।
- source_word: εἰς τὸν τόπον οὗ
  choice: जिस स्थान पर ... वहाँ
  rationale: εἰς का मूल दिशासूचक अर्थ होते हुए भी यहाँ ἐφάνη के साथ स्थानगत अर्थ है। हिन्दी की ‘जिस स्थान पर ... वहाँ’ संरचना इसे स्पष्ट और स्वाभाविक बनाती है।
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: वहाँ से ले जाए गए याजक
  rationale: कृदंत याजकों को उनके स्थान से हटाकर ले जाए जाने का अर्थ देता है। यह अनुवाद निर्वासन की सम्भावित पृष्ठभूमि को खुला रखता है और उसे पाठ में आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: τὸ πῦρ ἔκρυψαν
  choice: आग छिपाई थी
  rationale: आग छिपाने की घटना पानी दिखाई देने और राजा को सूचना दिए जाने से पहले हुई थी; ‘छिपाई थी’ हिन्दी में इस पूर्वकालिक संबंध को स्पष्ट करता है।
- source_word: τὸ ὕδωρ ἐφάνη
  choice: पानी दिखाई दिया
  rationale: यह ἐφάνη का सीधा अर्थ बनाए रखता है और ‘पानी मिला’ जैसी व्याख्यात्मक विशेषता नहीं जोड़ता।
- source_word: ἀφʼ οὗ
  choice: जिससे
  rationale: यह सर्वनाम पानी की ओर लौटता है। हिन्दी ‘जिससे’ स्रोत और साधन—दोनों सम्भव अर्थों को खुला रख सकता है।
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: नहेमायाह और उसके साथी
  rationale: यूनानी मुहावरे का अर्थ नहेमायाह से जुड़ा समूह है। ‘नहेमायाह और उसके साथी’ साधारण आधुनिक हिन्दी में स्वाभाविक है और समूह को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἥγνισαν τὰς θυσίας
  choice: बलिदानों को शुद्ध किया
  rationale: क्रिया का अनुष्ठानिक शुद्धता से संबंध है। ‘शुद्ध किया’ मूल अर्थ को बनाए रखता है और इसे ‘पवित्र किया’ या ‘अर्पित किया’ मानकर तनाव का समाधान नहीं करता।
theological_decisions:
- issue: बलिदानों के संबंध में अनुष्ठानिक शुद्धि का अर्थ
  choice: ‘बलिदानों को शुद्ध किया’
  alternative: ‘बलिदानों को पवित्र किया’ अथवा ‘बलि-भेंटों को शुद्ध किया’
  rationale: मूल पाठ बलिदानों पर की गई अनुष्ठानिक क्रिया बताता है, पर उसका अधिक विशिष्ट धार्मिक अर्थ निश्चित नहीं करता। ‘शुद्ध किया’ इस अस्पष्टता को सुरक्षित रखता है।
- issue: पानी के साथ शुद्धि का संबंध
  choice: ‘जिससे’
  alternative: ‘जिसमें से लेकर’ अथवा ‘जिस पानी से’
  rationale: ἀφʼ οὗ व्याकरणतः स्रोत का भाव दे सकता है, जबकि प्रसंग में पानी साधन भी हो सकता है। ‘जिससे’ हिन्दी में दोनों संभावनाओं को बिना अनावश्यक निर्णय के रहने देता है।
