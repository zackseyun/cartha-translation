  register: भाषा आधुनिक मानक हिन्दी की है और कथात्मक गरिमा बनाए रखती है। ‘याजक’, ‘बलिदान’ और ‘शुद्ध किया’ उपासना-संबंधी प्रसंग के लिए परिचित शब्द हैं। मूल यूनानी वाक्य आगे जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान उसके विषय से मेल नहीं खाता था; हिन्दी मुख्य पाठ में उसे ‘याजकों’ के बाद रखा गया है।
