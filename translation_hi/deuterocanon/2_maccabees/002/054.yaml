  yaml_path: translation/deuterocanon/2_maccabees/002/054.yaml
  text: For just as it is not easy for one who prepares a banquet[a], or even seeks the benefit of others, yet for the gratitude of the many we will gladly endure the hardship[b];
translation:
  language: hi
  text: क्योंकि जिस प्रकार भोज[a] तैयार करनेवाले या दूसरों का लाभ चाहनेवाले के लिए यह आसान नहीं है, फिर भी बहुतों की कृतज्ञता[b] के कारण हम इस कठिनाई को सहर्ष सहेंगे;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दावत”; यूनानी शब्द भोज, अथवा मद्य-गोष्ठी सहित भोज, को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “बहुतों की कृतज्ञता” से आशय अनेक पाठकों के आभार या सराहना से है; यहाँ यह कोई तकनीकी संस्कार-संबंधी शब्द नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: καθάπερ
  choice: क्योंकि जिस प्रकार
  rationale: यह पद पिछले कथन से संबंध जोड़ते हुए तुलना आरम्भ करता है; हिन्दी में यह संयोजन कारणात्मक और तुलनात्मक दोनों बल बनाए रखता है।
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: भोज तैयार करनेवाले के लिए
  rationale: दत्तिवाचक कृदन्त को ‘के लिए’ से व्यक्त किया गया है। συμπόσιον का संदर्भ यहाँ दूसरों के लिए तैयार किए गए भोज से है।
- source_word: ζητοῦντι τὴν ἑτέρων ὠφέλειαν
  choice: दूसरों के लाभ के लिए प्रयत्न करनेवाले के लिए
  rationale: ζητέω यहाँ किसी उद्देश्य को साधने का प्रयत्न दर्शाता है और ὠφέλεια लाभ या भलाई को; यह रूप स्वाभाविक हिन्दी में परोपकारी आशय सुरक्षित रखता है।
- source_word: οὐκ εὐχερές
  choice: यह आसान नहीं है
  rationale: यूनानी मुहावरे का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ὅμως
  choice: फिर भी
  rationale: कठिनाई और लेखक की तत्परता के बीच रियायती विरोध स्पष्ट करता है।
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: बहुतों की कृतज्ञता के कारण
  rationale: यहाँ εὐχαριστία पाठकों के आभार या सराहना को सूचित करता है; ‘बहुतों’ यूनानी τῶν πολλῶν की अभिव्यक्ति को बनाए रखता है।
- source_word: ἡδέως
  choice: सहर्ष
  rationale: कष्ट उठाने की प्रसन्न और स्वेच्छापूर्ण तत्परता को संक्षेप में व्यक्त करता है।
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: हम यह कठिन परिश्रम सहर्ष सहेंगे
  rationale: κακοπάθεια इस साहित्यिक भूमिका में रचना-संक्षेपण का श्रम और कठिनाई है, जबकि ὑποίσομεν उसे उठाने के भविष्यकालीन निश्चय को व्यक्त करता है।
theological_decisions:
- issue: εὐχαριστία का अर्थ
  choice: साधारण कृतज्ञता या आभार
  alternative: सामान्य धन्यवाद; अथवा बाद का तकनीकी संस्कार-संबंधी अर्थ
  rationale: यह साहित्यिक भूमिका अनेक पाठकों द्वारा लेखक के श्रम की सराहना की बात करती है; प्रसंग किसी तकनीकी धार्मिक या संस्कार-संबंधी अर्थ का संकेत नहीं देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। भोज का रूपक और मूल वाक्य का तुलना-विरोध क्रम सुरक्षित है; समापन का अर्धविराम अगले विचार से इसके संबंध को दर्शाता है।
