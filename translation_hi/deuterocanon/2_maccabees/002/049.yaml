  text: and to recover the sanctuary renowned throughout the whole inhabited world[a], and to free the city, and to restore the laws that were about to be abolished, since the Lord was showing them mercy with all forbearance[b],
translation:
  language: hi
  text: और समूचे बसे हुए संसार में प्रसिद्ध पवित्रस्थान को पुनः प्राप्त करने[a], नगर को स्वतंत्र कराने, और उन व्यवस्थाओं को फिर से बहाल करने जो निरस्त की जानेवाली थीं—क्योंकि प्रभु पूरी सहनशीलता के साथ उन पर दया कर रहा था[b]—
  philosophy: optimal-equivalence
