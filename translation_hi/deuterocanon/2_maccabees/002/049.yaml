lexical_decisions:
- source_word: περιβόητον
  choice: प्रसिद्ध
  rationale: यह शब्द ऐसी वस्तु को सूचित करता है जिसकी व्यापक चर्चा हो और जो विख्यात हो। ‘प्रसिद्ध’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और पवित्रस्थान की प्रतिष्ठा व्यक्त करता है।
- source_word: καθʼ ὅλην τὴν οἰκουμένην
  choice: समूचे बसे हुए संसार में
  rationale: οἰκουμένη का मूल भाव ‘बसा हुआ संसार’ है और καθʼ ὅλην व्यापक प्रसिद्धि को दर्शाता है। यह अनुवाद यूनानी अभिव्यक्ति को बनाए रखता है; अधिक सहज विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἱερὸν
  choice: पवित्रस्थान
  rationale: यहाँ यरूशलेम के मंदिर-परिसर का उसके पवित्र स्वरूप में उल्लेख है। ‘पवित्रस्थान’ यूनानी संज्ञा की व्यापकता को बनाए रखता है और उसे केवल भवन तक सीमित नहीं करता।
- source_word: ἀνακομίσασθαι
  choice: पुनः प्राप्त करने
  rationale: मध्यवाच्य क्रिया किसी खोई हुई वस्तु को वापस पाने या पुनः अधिकार में लेने का भाव देती है। ‘पुनः प्राप्त करने’ इस संदर्भ में स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: ἐλευθερῶσαι
  choice: स्वतंत्र कराने
  rationale: क्रिया का अर्थ मुक्त या स्वतंत्र करना है। नगर के राजनीतिक बंधन से मुक्त होने का भाव स्पष्ट रखने के लिए यह रूप चुना गया है।
- source_word: τοὺς μέλλοντας καταλύεσθαι νόμους
  choice: उन व्यवस्थाओं को ... जो मिटा दी जानेवाली थीं
  rationale: μέλλοντας आगामी या आसन्न कार्रवाई का संकेत देता है और καταλύεσθαι यहाँ नियमों को समाप्त अथवा निरस्त किए जाने का अर्थ रखता है। ‘मिटा दी जानेवाली थीं’ उस आसन्न खतरे को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπανορθῶσαι
  choice: फिर से बहाल करने
  rationale: क्रिया का अर्थ किसी गिराई या बिगाड़ी गई व्यवस्था को पुनः ठीक और स्थापित करना है। ‘फिर से बहाल करने’ कानूनी-सामुदायिक संदर्भ में स्पष्ट है।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: इस प्रसंग में κύριος परमेश्वर के लिए प्रयुक्त है; ‘प्रभु’ हिन्दी बाइबलीय प्रयोग में प्रतिष्ठित और स्वाभाविक संबोधन है।
- source_word: μετὰ πάσης ἐπιεικείας
  choice: पूरी उदारता के साथ
  rationale: ἐπιείκεια में कोमलता, दयालु उदारता, सहनशीलता और क्षमाशील नरमी के अर्थ संभव हैं। ‘उदारता’ दया के साथ प्रयुक्त होने पर सहज हिन्दी देती है, जबकि अन्य संभव छटाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἐλεημονοῦντος αὐτοῖς
  choice: उन पर दया कर रहा था
  rationale: वर्तमान कृदंत प्रभु की जारी दयालु कार्रवाई व्यक्त करता है। अपूर्ण भूतकालीन रूप ‘कर रहा था’ इस पक्ष को बनाए रखता है।
theological_decisions:
- issue: κύριος का दैवी संदर्भ
  choice: प्रभु
  alternative: स्वामी
  rationale: वाक्य में इस्राएलियों पर दया करने वाला κύριος परमेश्वर है। ‘प्रभु’ इस दैवी संदर्भ को बिना अतिरिक्त सिद्धान्त जोड़े स्पष्ट करता है।
- issue: ἐπιείκεια में दैवी व्यवहार की अर्थ-छटा
  choice: पूरी उदारता के साथ
  alternative: पूरी सहनशीलता के साथ / पूरी कृपालुता के साथ
  rationale: यूनानी शब्द दयालु नरमी, सहनशीलता या क्षमाशील उदारता व्यक्त कर सकता है। मुख्य पाठ में एक स्वाभाविक हिन्दी विकल्प रखा गया है और वास्तविक शब्दार्थगत विस्तार पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद मूलतः पिछले वाक्य से जुड़ा हुआ अंश है, इसलिए आरम्भ में ‘और’ तथा अंत में निरंतरता सूचित करने वाला विराम रखा गया है। ‘व्यवस्थाएँ’ νόμοι के धार्मिक-सामुदायिक अर्थ को साधारण ‘कानूनों’ की अपेक्षा बेहतर व्यक्त करता है।
