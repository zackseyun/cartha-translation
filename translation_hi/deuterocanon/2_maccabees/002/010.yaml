base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/010.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests secretly took some of the fire from the altar and hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: hi
  text: क्योंकि जब हमारे पूर्वजों को फ़ारस ले जाया जा रहा था, तब भक्त याजकों ने वेदी की आग में से कुछ चुपके से ली और उसे पानी-रहित कुएँ की एक खोखली जगह में छिपा दिया[a]। वहाँ उन्होंने उसे इस तरह सुरक्षित कर दिया कि वह स्थान सबके लिए अज्ञात रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वर्णन संक्षिप्त और कुछ असहज है। इसका अनुवाद ‘पानी-रहित कुएँ या गड्ढे की खोखली जगह में’ भी किया जा सकता है।
    reason: मूल में ‘खोखली जगह,’ ‘कुआँ/गड्ढा,’ और ‘पानी-रहित’ के शब्दों का व्याकरणिक संबंध संक्षिप्त और कुछ अस्पष्ट है।
lexical_decisions:
- source_word: ἤγοντο
  choice: ले जाया जा रहा था
  rationale: अपूर्णकालीन कर्मवाच्य रूप जबरन निर्वासन या ले जाए जाने की जारी प्रक्रिया दर्शाता है; इसे स्वैच्छिक यात्रा नहीं बनाया गया।
- source_word: εἰς τὴν Περσικὴν
  choice: फ़ारस
  rationale: यह फ़ारस देश का भौगोलिक उल्लेख है; गति का भाव हिंदी क्रिया ‘ले जाया जा रहा था’ में स्वाभाविक रूप से व्यक्त है।
- source_word: εὐσεβεῖς ἱερεῖς
  choice: भक्त याजकों
  rationale: ‘भक्त’ धार्मिक निष्ठा को आधुनिक और सहज हिंदी में व्यक्त करता है; ‘याजक’ मंदिर-सेवा के प्रसंग के अनुकूल है।
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: वेदी की आग में से कुछ आग ... ली
  rationale: ‘में से कुछ’ यह स्पष्ट करता है कि आग का एक अंश लिया गया, पूरी आग नहीं; θυσιαστήριον के लिए प्रचलित बाइबलीय शब्द ‘वेदी’ रखा गया।
- source_word: λαθραίως
  choice: चुपके से
  rationale: यह क्रिया की गोपनीयता को साधारण आधुनिक हिंदी में स्पष्ट करता है।
- source_word: κατέκρυφαν
  choice: छिपा दिया
  rationale: मूल क्रिया छिपाने या गुप्त रखने को बताती है; ‘दफना दिया’ अनावश्यक विशेषता जोड़ता।
- source_word: ἐν κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: पानी-रहित कुएँ जैसे एक गड्ढे की खोखली जगह में
  rationale: यूनानी वाक्यांश संक्षिप्त और असहज है। अनुवाद κοιλώμα (‘खोखली जगह’), φρέαρ (‘कुआँ/गड्ढा’) और ἄνυδρος (‘पानी-रहित’)—तीनों भावों को बनाए रखता है, जबकि ‘जैसे’ τάξιν ἔχοντος के प्रकार या स्वरूप संबंधी भाव को व्यक्त करता है।
- source_word: κατησφαλίσαντο
  choice: सुरक्षित कर दिया
  rationale: मध्यवाची क्रिया किसी वस्तु को सुरक्षित करने का भाव देती है, पर यह नहीं बताती कि उसे मुहरबंद, ढका या किसी और रीति से सुरक्षित किया गया।
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: कि वह स्थान सबके लिए अज्ञात रहे
  rationale: यह उद्देश्य या परिणामी भाव को निकटता से बनाए रखता है और ‘सबके लिए अज्ञात’ मूल संरचना के अनुरूप है।
theological_decisions:
- issue: वेदी की आग सुरक्षित रखने के याजकों के कार्य का धार्मिक अर्थ
  choice: पद केवल यह बताता है कि भक्त याजकों ने निर्वासन के समय वेदी की कुछ आग गुप्त रूप से सुरक्षित रखी।
  alternative: इसे निर्वासन के बाद उपासना की निरंतरता बनाए रखने या किसी विशिष्ट अनुष्ठानिक सिद्धांत का संकेत माना जा सकता है।
  rationale: पद स्वयं इस कार्य का विस्तृत धर्मवैज्ञानिक अर्थ नहीं समझाता; इसलिए अनुवाद श्रद्धापूर्ण संरक्षण को बताता है, पर कोई बाद की धार्मिक व्याख्या नहीं जोड़ता।
