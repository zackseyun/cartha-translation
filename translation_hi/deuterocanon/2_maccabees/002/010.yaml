  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पूर्वज’, ‘भक्त याजक’ और ‘वेदी’ सामान्य बाइबलीय शब्दावली हैं। मूल के स्थान-वर्णन की वास्तविक अस्पष्टता मुख्य पाठ और पाद-टिप्पणी दोनों में सुरक्षित रखी गई है।
