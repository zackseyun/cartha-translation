  verdict: revise
  source_fidelity: The draft accurately conveys the forced, ongoing removal to Persia; the pious priests’ secret taking of altar fire; its concealment; and the purpose that the location remain unknown. However, “वेदी की आग में से कुछ आग” is needlessly repetitive, and “कुएँ जैसे एक गड्ढे” makes the Greek’s compressed description sound like a comparison rather than preserving its uncertain well/pit terminology.
  naturalness: The overall register is clear modern Hindi. Recasting the fire phrase as “वेदी की आग में से कुछ” is idiomatic. “पानी-रहित कुएँ की एक खोखली जगह” remains slightly marked, as the Greek is, but is more readable than “कुएँ जैसे एक गड्ढे की खोखली जगह.”
  terminology: “फ़ारस,” “याजक,” and “वेदी” are suitable biblical terminology. “भक्त याजक” adequately renders εὐσεβεῖς ἱερεῖς without adding theological interpretation.
  issues:
  - severity: medium
    issue: Redundant rendering of the altar fire
    rationale: “वेदी की आग में से कुछ आग” repeats “आग.” The partitive sense of ἀπὸ τοῦ πυρὸς is fully conveyed by “वेदी की आग में से कुछ.”
  - severity: medium
    issue: The location is over-interpreted as a simile
    rationale: “कुएँ जैसे एक गड्ढे” introduces an explicit ‘like a well’ comparison. The Greek combines a hollow/cavity with φρέαρ (well or pit) and an unusual waterless descriptor; it does not clearly frame one as merely resembling the other. The ambiguity should remain in the note.
