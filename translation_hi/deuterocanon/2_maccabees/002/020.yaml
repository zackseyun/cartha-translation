  text: Plant your people in your holy place[b][a], just as Moses said.
translation:
  language: hi
  text: अपने लोगों को अपने पवित्र स्थान में रोप दे[b][a], जैसा मूसा ने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए दिया गया यूनानी स्रोत 2 मकाबियों 2:20 के अपेक्षित संदर्भ से मेल खाता हुआ प्रतीत नहीं होता। इसलिए यहाँ किसी अनुमानित पाठ का पुनर्निर्माण करने के बजाय उपलब्ध यूनानी शब्दों का सीधे अनुवाद किया गया है।
    reason: textual_variant
  - marker: b
    text: या, “अपने लोगों को अपने पवित्र स्थान में दृढ़ता से बसा दे।” यूनानी क्रिया में रोपने का रूपक है, जो दृढ़ता से स्थापित करने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  choice: रोप दे
  rationale: यह καταφυτεύω का भूतकालिक आज्ञार्थक रूप है, जिसका मूल बिंब किसी को रोपने या दृढ़ता से स्थापित करने का है। ‘रोप दे’ आज्ञार्थक बल और रोपण के रूपक—दोनों को बनाए रखता है।
- source_word: τὸν λαόν σου
  choice: अपने लोगों को
  rationale: λαός सामूहिक रूप से प्रजा या लोगों को दर्शाता है। परमेश्वर को संबोधित इस कथन में ‘अपने लोगों को’ स्वाभाविक और स्पष्ट है।
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: अपने पवित्र स्थान में
  rationale: τόπος का अर्थ ‘स्थान’ और ἅγιος का अर्थ ‘पवित्र’ है। εἰς के साथ रोपने की क्रिया हिंदी में ‘स्थान में’ से स्वाभाविक रूप से व्यक्त होती है; ‘पवित्र भूमि’ कहना मूल से अधिक विशिष्ट होता।
- source_word: καθὼς εἶπεν
  choice: ठीक जैसे ... ने कहा था
  rationale: καθώς तुलना को और εἶπεν कहने की पूर्ण हुई क्रिया को व्यक्त करता है। ‘ठीक जैसे ... ने कहा था’ आधुनिक हिंदी में स्वाभाविक है और पूर्व कथन का भाव स्पष्ट करता है।
- source_word: Μωσῆς
  choice: मूसा
  rationale: यह इस बाइबलीय नाम का मानक हिंदी रूप है।
theological_decisions:
- issue: स्रोत-पाठ की अखंडता और संदर्भ से बड़ा असामंजस्य
  choice: उपलब्ध यूनानी वाक्य को स्वतंत्र प्रार्थनात्मक निवेदन के रूप में अनूदित किया गया है और दूसरे पाठ-साक्ष्यों के आधार पर अपेक्षित पद का पुनर्निर्माण नहीं किया गया।
  alternative: संदर्भ या अन्य संस्करणों के आधार पर 2 मकाबियों 2:20 के लिए कोई भिन्न पाठ पुनर्निर्मित करना।
  rationale: दिया गया यूनानी पाठ अपेक्षित संदर्भ से मेल नहीं खाता और इनपुट में इसे ‘major_mismatch’ चिह्नित किया गया है। मूल-भाषा स्रोत की प्रधानता और पाठगत पारदर्शिता बनाए रखने के लिए उसी उपलब्ध वाक्य का सीधा अनुवाद किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘रोप दे’ मूल रूपक को बचाता है; फुटनोट में अधिक व्याख्यात्मक विकल्प दिया गया है। मुख्य पाठ में फुटनोट-चिह्न अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में रखे गए हैं।
