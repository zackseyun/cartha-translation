lexical_decisions:
- source_word: προσελθόντες
  choice: पास आए
  rationale: यह προσέρχομαι का अओरिस्ट कृदन्त है और किसी स्थान की ओर बढ़ने या निकट आने का भाव देता है। “पास आए” दिशा का यह भाव बनाए रखता है, पर जिस वस्तु या स्थान के पास वे आए उसे अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: τινὲς τῶν συνακολουθούντων
  choice: साथ चलनेवालों में से कुछ
  rationale: τινὲς τῶν की अंशवाचक रचना को स्पष्ट रखा गया है। συνακολουθούντων उन लोगों को दर्शाता है जो साथ चले या पीछे-पीछे आए थे; “साथ चलनेवाले” किसी अधिक व्याख्यात्मक संबंध को जोड़े बिना इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὥστε ἐπισημήνασθαι τὴν ὁδόν
  choice: उस रास्ते को चिन्हित करने के लिए
  rationale: यहाँ ὥστε के साथ infinitive उद्देश्य या अभिप्रेत परिणाम बताता है। ἐπισημήνασθαι में किसी चीज़ पर पहचान के लिए निशान लगाने या उसे चिन्हित करने का भाव है। “रास्ता” ὁδός के पथ, मार्ग या जाने की राह वाले अर्थों को समेटता है।
- source_word: οὐκ ἠδυνήθησαν
  choice: नहीं सके
  rationale: यह असमर्थता को सहज आधुनिक हिन्दी में व्यक्त करता है और यूनानी क्रिया के नकारात्मक सामर्थ्य-बोध को बनाए रखता है।
- source_word: εὑρεῖν
  choice: उसे ढूँढ़
  rationale: यह infinitive ἠδυνήθησαν पर निर्भर है। हिन्दी में “उसे” प्रसंग से समझी जानेवाली खोजी जा रही वस्तु या जगह की ओर संकेत करता है, बिना उसे अधिक स्पष्ट करके मूल की प्रसंगगत अस्पष्टता मिटाए।
