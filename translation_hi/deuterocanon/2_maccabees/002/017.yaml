lexical_decisions:
- source_word: πρόσδεξαι
  choice: स्वीकार कर
  rationale: प्रार्थना के प्रसंग में यह क्रिया परमेश्वर से बलिदान को अनुग्रहपूर्वक ग्रहण करने की विनती व्यक्त करती है; ‘स्वीकार कर’ इस भाव को स्वाभाविक और संक्षिप्त रूप से रखता है।
- source_word: θυσίαν
  choice: यह बलिदान
  rationale: θυσία धार्मिक बलिदान या बलिदान-भेंट को दर्शाता है। ‘बलिदान’ मूल के उपासना-संबंधी विशिष्ट अर्थ को बनाए रखता है; हिन्दी वाक्य में निश्चित संदर्भ को स्वाभाविक बनाने के लिए ‘यह’ प्रयुक्त है।
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: अपने समस्त लोगों, इस्राएल, की ओर से
  rationale: ὑπέρ के साथ संबंधकारक यहाँ प्रतिनिधित्व अथवा हित का भाव देता है। ‘की ओर से’ प्रतिनिधिक अर्थ को स्पष्ट करता है, जबकि ‘समस्त’ παντός के सामूहिक विस्तार को व्यक्त करता है।
- source_word: διαφύλαξον
  choice: रक्षा कर
  rationale: यह क्रिया सुरक्षित रखने और संभालकर बचाए रखने का अर्थ देती है। ‘रक्षा कर’ आधुनिक हिन्दी में स्वाभाविक है और प्रार्थना की गरिमा बनाए रखता है।
- source_word: τὴν μερίδα σου
  choice: अपने भाग
  rationale: μερίδα का मूल अर्थ ‘भाग’ या ‘हिस्सा’ है। ‘अपने भाग’ रूपक को ज्यों का त्यों रखता है और उसे व्याख्यात्मक रूप से ‘विरासत’ या ‘लोग’ नहीं बना देता।
- source_word: καθαγίασον
  choice: उसे पवित्र कर
  rationale: क्रिया का अर्थ पवित्र करना या समर्पित करके पवित्र ठहराना है। हिन्दी में ‘उसे’ पिछले एकवचन पद ‘अपने भाग’ की ओर संकेत करता है और मूल में निहित कर्म को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘अपने भाग’ का अभिप्राय
  choice: इस्राएल के लिए ‘अपने भाग’ का रूपक बनाए रखा गया है।
  alternative: ‘अपनी विरासत’ अथवा ‘अपने ठहराए हुए लोगों’ के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ रूपक की व्याख्या नहीं करता। चूँकि पिछले पदबंध में इस्राएल को परमेश्वर के लोग कहा गया है, ‘भाग’ बनाए रखने से वाचा-संबंधी संकेत सुनाई देता है, पर पाठ की वास्तविक अर्थगत गुंजाइश समय से पहले समाप्त नहीं होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनामय रखी गई है। परमेश्वर को संबोधित एकवचन आज्ञार्थक रूप मूल यूनानी के अनुरूप हैं। ‘भाग’ और ‘पवित्र कर’ जैसे प्रमुख धार्मिक पदों को सरल व्याख्या से प्रतिस्थापित नहीं किया गया, ताकि मूल का रूपक और धर्मवैचारिक तनाव सुरक्षित रहे।
