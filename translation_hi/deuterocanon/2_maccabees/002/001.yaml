  yaml_path: translation/deuterocanon/2_maccabees/002/001.yaml
  text: 'And those in Judea[a], and the council of elders, and Judas, to Aristobulus, teacher of King Ptolemy, who is also of the family of the anointed priests, and to the Jews in Egypt: greetings and good health.'
translation:
  language: hi
  text: यहूदिया में रहनेवाले लोग, बुज़ुर्गों की परिषद् और यहूदा की ओर से, राजा टॉलेमी के शिक्षक अरिस्तोबुलुस को—जो अभिषिक्त याजकों के वंश से हैं[a]—और मिस्र में रहनेवाले यहूदियों को नमस्कार और अच्छे स्वास्थ्य की शुभकामनाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समर्पित याजकों के कुल से हैं।’ यूनानी में शाब्दिक रूप से ‘अभिषिक्त याजकों के वंश से’ है; यहाँ प्रयुक्त शब्द का अर्थ ‘अभिषिक्त’ है, यह ‘मसीह’ की उपाधि नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया में रहनेवाले लोग
  rationale: यूनानी अभिव्यक्ति का शाब्दिक आशय ‘यहूदिया में रहनेवाले’ है। आगे मिस्र के प्राप्तकर्ताओं के लिए स्पष्ट रूप से ‘यहूदी’ आया है, इसलिए यहाँ मूल की व्यापकता बनाए रखी गई है।
- source_word: γερουσία
  choice: पुरनियों की परिषद्
  rationale: यह शब्द बुज़ुर्ग अगुओं की संस्थागत सभा को सूचित करता है; यह रूप अर्थ और गरिमा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διδασκάλῳ
  choice: शिक्षक
  rationale: यह अरिस्तोबुलुस का राजा टॉलेमी से संबंध शिक्षक के रूप में बताता है; ‘शिक्षक’ सीधा और सहज अनुवाद है।
- source_word: ὄντι δὲ ἀπὸ τοῦ τῶν χριστῶν ἱερέων γένους
  choice: जो अभिषिक्त याजकों के वंश से हैं
  rationale: χριστῶν यहाँ बहुवचन में ‘अभिषिक्त’ का सामान्य अर्थ रखता है और याजकों का विशेषण है; γένος के वंशगत भाव को ‘वंश’ से व्यक्त किया गया है।
- source_word: χαίρειν καὶ ὑγιαίνειν
  choice: नमस्कार और अच्छे स्वास्थ्य की शुभकामनाएँ
  rationale: पत्र के आरंभ में यह अभिवादन और कुशल-क्षेम की पारंपरिक कामना है; हिन्दी में संयुक्त वाक्यांश इसका स्वाभाविक भाव देता है।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: यह सामी नाम का प्रचलित हिन्दी बाइबलीय रूप है और यहाँ नामित प्रेषक को सूचित करता है।
theological_decisions:
- issue: τῶν χριστῶν ἱερέων में χριστῶν का अर्थ
  choice: अभिषिक्त याजक
  alternative: समर्पित याजक
  rationale: संदर्भ में यह मसीही उपाधि नहीं, बल्कि तेल से अभिषेक पाए याजकों का वर्णन है। ‘अभिषिक्त’ मूल शब्द का सीधा अर्थ और संभावित धार्मिक अनुगूँज दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पत्रात्मक रूप अपनाया गया है। प्रेषकों और प्राप्तकर्ताओं की लंबी संरचना को डैशों से स्पष्ट किया गया है। ‘पुरनियों’ और ‘याजकों’ जैसे परिचित बाइबलीय शब्द रखते हुए वाक्य को सामान्य पाठक के लिए सहज बनाया गया है।
