  yaml_path: translation/deuterocanon/2_maccabees/002/034.yaml
  text: But when Jeremiah learned of it[a], he reproved them and said, “The place will remain unknown until God gathers his people together and shows mercy.”
translation:
  language: hi
  text: पर जब यिर्मयाह को इस बात का पता चला, तो उसने उन्हें डाँटा और कहा, “यह स्थान तब तक अज्ञात रहेगा, जब तक परमेश्वर लोगों को एकत्र न कर ले और दया प्रकट न हो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी का अधिक शाब्दिक रूप है: “जब तक परमेश्वर लोगों का एकत्रीकरण एकत्र न करे और दया अस्तित्व में न आए।”'
    reason: मूल की पुनरुक्तिपूर्ण अभिव्यक्ति और अंतिम उपवाक्य की व्याकरणिक रचना को दिखाने के लिए।
lexical_decisions:
- source_word: ὡς δὲ
  choice: पर जब
  rationale: यह पद कथा में समय-संबंधी परिवर्तन लाता है और साथ ही हल्का विरोध अथवा नया मोड़ दिखाता है; ‘पर जब’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔγνων
  choice: को इस बात का पता चला
  rationale: अओरिस्ट रूप यहाँ पहले बताई गई घटना की जानकारी प्राप्त होने को दर्शाता है, केवल स्थायी रूप से ‘जानने’ को नहीं।
- source_word: μεμψάμενος αὐτοῖς
  choice: उसने उन्हें डाँटा
  rationale: कृदन्त में दोष बताने और फटकारने का भाव है। ‘डाँटा’ साधारण आधुनिक हिन्दी में स्पष्ट और पर्याप्त रूप से गंभीर है।
- source_word: ἄγνωστος ὁ τόπος ἔσται
  choice: यह स्थान ... अज्ञात रहेगा
  rationale: ἄγνωστος का सीधा अर्थ ‘अज्ञात’ है। ‘रहेगा’ प्रसंग में जारी रहने वाली अवस्था को स्वाभाविक ढंग से व्यक्त करता है; ‘यह’ पूर्वोक्त स्थान की ओर संकेत करता है।
- source_word: ἕως ἂν συνάγῃ ὁ θεὸς ἐπισυναγωγὴν τοῦ λαοῦ
  choice: जब तक परमेश्वर लोगों को एकत्र न कर ले
  rationale: मूल में क्रिया और उसी अर्थ की संज्ञा का पुनरुक्तिपूर्ण प्रयोग है, लगभग ‘लोगों का एकत्रीकरण एकत्र करे’। हिन्दी में क्रियात्मक रूप अर्थ को स्पष्ट रखता है। ‘लोगों’ में मूल का निश्चित समुदाय-संदर्भ बना रहता है, पर ‘अपने’ जोड़कर संबंध को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: καὶ ἔλεος γένηται
  choice: और दया प्रकट न हो
  rationale: मूल व्याकरण में ‘दया’ कर्ता है और वाक्यांश का शाब्दिक भाव ‘दया अस्तित्व में आए/घटित हो’ है। ‘दया प्रकट हो’ स्वाभाविक हिन्दी है और परमेश्वर को व्याकरणिक कर्ता बनाकर मूल की अस्पष्टता नहीं मिटाता।
theological_decisions:
- issue: अंतिम उपवाक्य में ईश्वरीय कर्तृत्व
  choice: ‘और दया प्रकट न हो’—दया को व्याकरणिक कर्ता बनाए रखना
  alternative: ‘और परमेश्वर दया न दिखाए’
  rationale: यद्यपि प्रसंग में दया परमेश्वर की ओर से समझी जा सकती है, यूनानी में ἔλεος स्वयं γένηται का कर्ता है। चुना हुआ रूप उस वास्तविक व्याकरणिक और धर्मवैचारिक खुलापन को सुरक्षित रखता है।
- issue: τοῦ λαοῦ में समुदाय का संबंध
  choice: ‘लोगों’
  alternative: ‘अपने लोगों’
  rationale: यूनानी में संबंधवाचक सर्वनाम ‘अपने’ नहीं है। प्रसंग समुदाय की पहचान समझने में सहायता देता है, इसलिए अनुवाद में अतिरिक्त स्वामित्व-सूचक शब्द जोड़े बिना मूल को निकटता से रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘अज्ञात’ प्रसंग की औपचारिक गंभीरता के अनुकूल है, जबकि ‘पता चला’ और ‘डाँटा’ सामान्य पाठक के लिए स्वाभाविक हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्मिलित है।
