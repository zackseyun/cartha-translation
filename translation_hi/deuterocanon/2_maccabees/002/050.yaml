translation:
  language: hi
  text: कुरेने के यासोन ने पाँच पुस्तकों में जो कुछ प्रस्तुत किया है, उसे हम एक ही ग्रंथ में संक्षिप्त करने का प्रयास करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δηλωθέντα
  choice: जो कुछ प्रस्तुत किया है
  rationale: साहित्यिक संदर्भ में यह कृदंत यासोन द्वारा लिखित सामग्री को सामने रखने या वर्णित करने का भाव देता है; ‘प्रस्तुत किया’ स्वाभाविक है और ‘स्पष्ट किया’ से अधिक उपयुक्त है।
- source_word: διὰ πέντε βιβλίων
  choice: पाँच पुस्तकों में
  rationale: यहाँ διά के साथ संबंधकारक यासोन की रचना के साहित्यिक माध्यम अथवा विस्तार को दर्शाता है; हिन्दी में ‘पाँच पुस्तकों में’ सहज है।
- source_word: πειρασόμεθα
  choice: हम ... प्रयास करेंगे
  rationale: भविष्यत् मध्यम रूप लेखक की विनम्रता और कार्य हाथ में लेने का भाव रखता है; ‘प्रयास करेंगे’ इसे बनाए रखता है।
- source_word: διʼ ἑνὸς συντάγματος
  choice: एक ही ग्रंथ में
  rationale: σύνταγμα यहाँ व्यवस्थित लिखित रचना या संकलन है। ‘एक ही ग्रंथ’ पाँच पुस्तकों के साथ विरोध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπιτεμεῖν
  choice: संक्षिप्त करने
  rationale: क्रिया का अर्थ किसी बड़े लिखित कार्य को काट-छाँटकर छोटा रूप देना है; ‘संक्षिप्त करने’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ὑπὸ Ἰάσονος τοῦ Κυρηναίου
  choice: कुरेने के यासोन ने
  rationale: कर्तृवाचक प्रयोग हिन्दी में कर्मवाच्य की अपेक्षा अधिक स्वाभाविक है; भौगोलिक पहचान को ‘कुरेने के’ से व्यक्त किया गया है।
