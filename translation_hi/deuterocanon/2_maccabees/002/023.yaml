  yaml_path: translation/deuterocanon/2_maccabees/002/023.yaml
  text: And when this happened[a], a flame was kindled; but when the light from the altar shone forth, it was consumed.
translation:
  language: hi
  text: जब ऐसा हुआ, तो एक ज्वाला प्रज्वलित हुई; पर जब वेदी से प्रकाश चमक उठा, तो वह पूरी तरह समाप्त हो गई।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चमक उठा’ का अनुवाद ‘पलटकर चमका’ या ‘उत्तर में चमका’ भी हो सकता है। यूनानी क्रिया में सामने से अथवा प्रत्युत्तर में चमकने का भाव हो सकता है। अंतिम क्रिया का कर्ता मूल पाठ में स्पष्ट नहीं है; ‘वह’ ज्वाला, जलाई जा रही सामग्री, या पिछले प्रसंग में उल्लिखित द्रव की ओर संकेत कर सकता है।
    reason: मूल यूनानी की वास्तविक शाब्दिक और वाक्यगत अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: दिया गया यूनानी वाक्य प्रचलित अध्याय-पद क्रमांकन में 2 मकाबियों 1:32 से मेल खाता है, 2:23 से नहीं।
    reason: प्रस्तुत संदर्भ और मूल-पाठ के बीच बड़े असंगत मेल को पाठक तथा संपादक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: जब ऐसा हुआ
  rationale: यह वाक्य को स्वाभाविक कालवाचक संक्रमण देता है और ἐγενήθη के ‘घटित होने’ के अर्थ को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: φλὸξ ἀνήφθη
  choice: एक ज्वाला प्रज्वलित हुई
  rationale: φλόξ की एकवचन छवि को ‘एक ज्वाला’ सुरक्षित रखता है। कर्मवाच्य ἀνήφθη का अर्थ यहाँ स्वाभाविक हिन्दी में ‘प्रज्वलित हुई’ से व्यक्त होता है; ‘आग’ कहना मूल से अधिक व्यापक होता।
- source_word: τοῦ ... ἀπὸ τοῦ θυσιαστηρίου ... φωτός
  choice: वेदी से प्रकाश
  rationale: θυσιαστήριον के लिए ‘वेदी’ प्रचलित और सटीक शब्द है, और ἀπό स्रोत को सूचित करता है।
- source_word: ἀντιλάμψαντος
  choice: चमक उठा
  rationale: क्रिया में सामने से, प्रत्युत्तर में, अथवा पलटकर चमकने की छाया हो सकती है। मुख्य पाठ में सहज ‘चमक उठा’ रखा गया है और अधिक विशिष्ट संभावनाएँ टिप्पणी में सुरक्षित हैं।
- source_word: ἐδαπανήθη
  choice: वह पूरी तरह समाप्त हो गई
  rationale: मूल क्रिया का अर्थ ‘खप जाना/समाप्त हो जाना’ है। हिन्दी में यह अभिव्यक्ति ‘भस्म हो गई’ की अपेक्षा कम व्याख्यात्मक है और अस्पष्ट कर्ता को अनावश्यक रूप से किसी जलनेवाली सामग्री तक सीमित नहीं करती।
theological_decisions:
- issue: अंतिम कर्मवाच्य क्रिया ἐδαπανήθη का अप्रकट कर्ता
  choice: मुख्य पाठ में स्त्रीलिंग सर्वनाम ‘वह’ रखा गया, जिसका निकटतम संभावित पूर्वपद ‘ज्वाला’ है।
  alternative: यह बलि-सामग्री, जलाई जा रही वस्तु, या पिछले प्रसंग का द्रव भी हो सकता है।
  rationale: यूनानी पाठ कर्ता को स्पष्ट नहीं करता। निकटतम एकवचन संज्ञा φλόξ के कारण ज्वाला संभावित अर्थ है, पर पाठगत अस्पष्टता को टिप्पणी में खुला रखा गया है।
- issue: ἀντιλάμπω की दिशात्मक अथवा प्रत्युत्तरात्मक छाया
  choice: मुख्य पाठ में सामान्य और स्वाभाविक ‘चमक उठा’।
  alternative: ‘पलटकर चमका’, ‘उत्तर में चमका’, अथवा ‘प्रकाशित हुआ’।
  rationale: संदर्भ से यह निश्चित नहीं कि प्रकाश परावर्तित हुआ, प्रत्युत्तर में चमका, या केवल प्रबल रूप से प्रकट हुआ; इसलिए मुख्य पाठ किसी एक विशेष भौतिक व्याख्या को बाध्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रज्वलित’ धार्मिक तथा वर्णनात्मक प्रसंग में स्वाभाविक औपचारिकता देता है। ‘पूरी तरह समाप्त हो गई’ मूल के व्यापक अर्थ को रखता है और अस्पष्ट कर्ता का निर्णय नहीं करता। संदर्भ-संख्या की प्रत्यक्ष असंगति संपादकीय टिप्पणी में दर्ज की गई है।
