  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण गद्य रखा गया है। ‘संक्षिप्त रूप’ सामान्य पाठक के लिए ‘सार-संक्षेप’ या तकनीकी ‘एपिटोम’ से अधिक स्पष्ट है; पादटिप्पणी मूल यूनानी की वास्तविक शाब्दिक संभावना को सुरक्षित रखती है।
