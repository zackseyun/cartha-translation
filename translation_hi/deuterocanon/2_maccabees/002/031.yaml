  rationale: क्रिया किसी बात से विरत होने, उसे अस्वीकार करने या उससे छूट लेने का अर्थ देती है; यहाँ संक्षेपकर्ता द्वारा पूर्ण विस्तार न करने के लिए ‘छोड़ने’ स्वाभाविक है।
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: जो संक्षिप्त रूप तैयार कर रहा है
