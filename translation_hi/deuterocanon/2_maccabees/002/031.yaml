theological_decisions:
- issue: संदर्भ में μετάφρασις का अर्थ
  choice: संक्षिप्त रूप/संक्षेप
  alternative: अनुवाद
  rationale: 2 मक्काबियों की प्रस्तावना कुरेनी यासोन के पाँच खंडों वाले ग्रंथ के संक्षेप का वर्णन करती है। इसलिए यहाँ ‘अनुवाद’ कहने से साहित्यिक परिस्थिति गलत समझी जा सकती है; फिर भी यूनानी शब्द के अन्य संभव अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
