  yaml_path: translation/deuterocanon/2_maccabees/002/029.yaml
  text: For just as the architect of a new house must take thought for the whole structure[a], but the one undertaking to decorate it with painted ornament must consider the things suitable for adornment, so also, I think, it is with us.
translation:
  language: hi
  text: क्योंकि, जिस प्रकार नए घर के वास्तुकार को उसकी पूरी नींव पर ध्यान देना होता है, पर जो उस घर की साज-सज्जा करने और उस पर चित्रकारी करने का काम हाथ में लेता है[a], उसे सजावट के लिए उपयुक्त चीज़ों पर विचार करना होता है, उसी प्रकार, मेरा विचार है, हमारे मामले में भी ऐसा ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जो उसे पूरा करने और उस पर चित्रकारी करने का काम हाथ में लेता है।” यहाँ यूनानी शब्द ἐγκαινίζειν का अर्थ घर को सजाने के साथ-साथ उसे पूरा करने या उपयोग के लिए तैयार करने का भी हो सकता है।
    reason: lexical_alternative
