- source_word: καθάπερ γὰρ
  choice: क्योंकि जिस प्रकार
  rationale: γὰρ के कारणसूचक संबंध और καθάπερ द्वारा आरंभ की गई उपमा—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀρχιτέκτονι
  choice: वास्तुकार
  rationale: यह प्रधान योजनाकार अथवा निर्माण-निर्देशक को दर्शाता है, केवल सामान्य कारीगर को नहीं।
- source_word: τῆς ὅλης καταβολῆς
  choice: उसके पूरे ढाँचे की नींव डालने
  rationale: καταβολή में नींव डालने अथवा मूल निर्माण का भाव है; ὅλης के साथ यह पूरे भवन की आधारभूत संरचना की जिम्मेदारी को व्यक्त करता है।
- source_word: φροντιστέον
  choice: ध्यान देना होता है
  rationale: यूनानी क्रियाविशेषणात्मक विशेषण की आवश्यकतासूचक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγκαινίζειν καὶ ζωγραφεῖν
  choice: उसकी साज-सज्जा और चित्रकारी करने
  rationale: दोनों क्रियाओं को अलग रखते हुए भवन को तैयार/सजाने और चित्रों से अलंकृत करने का प्रसंग व्यक्त होता है; किसी विशिष्ट चित्रकला-तकनीक को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν ἐξεταστέον
  choice: सजावट के लिए उपयुक्त बातों पर विचार करना होता है
  rationale: ἐπιτήδεια की व्यापकता को बनाए रखता है—यह केवल सामग्री नहीं, सजावट के लिए उपयोगी या उचित सभी बातों का संकेत दे सकता है।
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: उसी प्रकार, मेरा विचार है, हमारे मामले में भी है
  rationale: उपमा के निष्कर्ष के साथ δοκῶ की विनम्र, प्रथम-पुरुष योग्यता को सुरक्षित रखता है।
