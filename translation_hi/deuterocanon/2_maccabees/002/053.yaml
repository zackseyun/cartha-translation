lexical_decisions:
- source_word: ἡμῖν ... τοῖς
  choice: हमारे लिए—जिन्होंने
  rationale: सम्प्रदान कारक और निश्चित लेखयुक्त कृदन्त-रचना लेखक-मंडली को आगे कही गई विशेषता से जोड़ती है। यह हिन्दी प्रयोग आत्म-संदर्भ और व्याख्यात्मक बल दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν κακοπάθειαν
  choice: कठिन परिश्रम
  rationale: κακοπάθεια कष्ट सहने या कठिन श्रम को सूचित करता है। यहाँ संपादकीय कार्य का संदर्भ होने से ‘कठिन परिश्रम’ उपयुक्त है और इसे उत्पीड़न-संबंधी दुःख नहीं बनाता।
- source_word: ἐπιδεδειγμένοις
  choice: अपने ऊपर लिया है
  rationale: इस पूर्ण मध्य/कर्मवाच्य कृदन्त का शाब्दिक अर्थ ‘दिखाया/प्रदर्शित किया है’ हो सकता है, पर κακοπάθεια के साथ मुहावरेदार भाव कठिनाई को स्वीकार करके सहने का है। ‘अपने ऊपर लिया है’ उस भाव को सहज हिन्दी में देता है।
- source_word: τῆς ἐπιτομῆς
  choice: इस संक्षिप्त रूप को तैयार करने का
  rationale: ἐπιτομή किसी बड़े ग्रंथ के संक्षिप्त रूप या सार-संस्करण को दर्शाता है। क्रियात्मक विस्तार हिन्दी में संबंधकारक को स्पष्ट करता है कि कठिन परिश्रम संक्षिप्त रूप तैयार करने में लगा।
- source_word: οὐ ῥᾴδιον
  choice: आसान नहीं
  rationale: यह विधेय विशेषण का सीधा और स्वाभाविक आधुनिक हिन्दी अनुवाद है।
- source_word: ἱδρῶτος ... καὶ ἀγρυπνίας
  choice: पसीने और जागी हुई रातों का
  rationale: यह मूल की सजीव शारीरिक छवियों—श्रम का पसीना और नींद खोना—को बनाए रखता है। ‘जागी हुई रातें’ केवल अनिद्रा-रोग का अर्थ देने के बजाय परिश्रम के कारण रात भर जागने का भाव देती हैं।
- source_word: τὸ πρᾶγμα
  choice: काम
  rationale: यहाँ πρᾶγμα सामने रखे गए साहित्यिक कार्य को दर्शाता है। ‘काम’ सामान्य पाठक के लिए सहज और संदर्भानुकूल है।
