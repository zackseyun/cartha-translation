  yaml_path: translation/deuterocanon/2_maccabees/002/018.yaml
  text: Gather our dispersion, free those who are enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: hi
  text: हमारे बिखरे हुए लोगों को इकट्ठा कर[a]; जो अन्यजातियों के बीच दासता में हैं, उन्हें स्वतंत्र कर; जिन्हें तुच्छ और घृणित समझा जाता है, उन पर दृष्टि कर[b]; और अन्यजातियाँ जान लें कि तू हमारा परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हमारे बिखराव को”; यूनानी में भाववाचक संज्ञा बिखरे हुए समुदाय के लिए प्रयुक्त हुई है।'
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी सुधि ले” अथवा “उन पर ध्यान दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: इकट्ठा कर
  rationale: यह परमेश्वर से की गई सीधी प्रार्थना का आज्ञार्थक रूप है और बिखरे समुदाय को फिर एकत्र करने का भाव स्पष्ट रखता है।
- source_word: τὴν διασπορὰν ἡμῶν
  choice: हमारे बिखरे हुए लोगों को
  rationale: यूनानी में शाब्दिक रूप से भाववाचक संज्ञा ‘हमारा बिखराव’ है, पर प्रसंग में उससे बिखरा हुआ समुदाय अभिप्रेत है। यह हिन्दी में स्वाभाविक रहते हुए सामूहिक अर्थ सुरक्षित रखता है।
- source_word: ἐλευθέρωσον
  choice: स्वतंत्र कर
  rationale: यह दासता से मुक्त करने के स्पष्ट अर्थ को व्यक्त करता है; केवल ‘छुड़ा’ की अपेक्षा स्वतंत्रता का भाव अधिक प्रत्यक्ष है।
- source_word: τοὺς δουλεύοντας
  choice: जो ... दासता में हैं
  rationale: यहाँ विदेशी जातियों के बीच अधीन और बंधुआ दशा प्रमुख है, स्वैच्छिक सेवा नहीं।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: अन्यजातियों के बीच
  rationale: यह इस्राएल से बाहर की जातियों और लोगों को सूचित करता है। ‘अन्यजातियाँ’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और संक्षिप्त है।
- source_word: τοὺς ἐξουθενημένους καὶ βδελυκτοὺς
  choice: जिन्हें तुच्छ और घृणित समझा जाता है
  rationale: दोनों शब्द लोगों के प्रति दूसरों की अवमानना और घृणा को व्यक्त करते हैं। ‘समझा जाता है’ जोड़ने से यह भ्रम नहीं होता कि वे वास्तव में घृणित हैं।
- source_word: ἔφιδε
  choice: उन पर दृष्टि कर
  rationale: यह परमेश्वर से उनकी ओर ध्यान देने की विनती है। वाक्यांश प्रार्थनात्मक गरिमा बनाए रखता है, पर दया का अर्थ अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: γνώτωσαν
  choice: जान लें
  rationale: तीसरे पुरुष के आज्ञार्थक/कामनार्थक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: कि तू हमारा परमेश्वर है
  rationale: यह सम्बन्धसूचक और वाचागत अंगीकार का सीधा हिन्दी रूप है। प्रार्थना में एकवचन ‘तू’ मूल के एकवचन संबोधन को बनाए रखता है।
theological_decisions:
- issue: διασπορά को भाववाचक रूप में रखा जाए या समुदाय के रूप में व्यक्त किया जाए
  choice: हमारे बिखरे हुए लोगों को
  alternative: हमारे बिखराव को
  rationale: यूनानी भाववाचक संज्ञा द्वारा बिखरे समुदाय को सूचित करता है। मुख्य पाठ में समुदाय का स्वाभाविक हिन्दी रूप लिया गया है, जबकि शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
- issue: δουλεύοντας में सेवा या दासता का अर्थ
  choice: जो ... दासता में हैं
  alternative: जो ... सेवा कर रहे हैं
  rationale: जातियों के बीच उत्पीड़ित बिखरे लोगों और उन्हें स्वतंत्र करने की विनती का प्रसंग बंधन और पराधीनता की ओर संकेत करता है, न कि स्वैच्छिक सेवा की ओर।
- issue: βδελυκτούς को लोगों का वास्तविक गुण माना जाए या दूसरों की दृष्टि का वर्णन
  choice: जिन्हें ... घृणित समझा जाता है
  alternative: जो घृणित हैं
  rationale: समानांतर निष्क्रिय कृदंत ἐξουθενημένους और उत्पीड़न के प्रसंग में यह उन लोगों के साथ किए गए घृणापूर्ण व्यवहार या उनके प्रति दृष्टिकोण को व्यक्त करता है; अनुवाद उन्हें वस्तुतः घृणित घोषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली अपनाई गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल यूनानी के सीधे संबोधन और पारंपरिक प्रार्थना-भाषा को बनाए रखता है। अर्धविरामों से चार समानांतर विनतियाँ स्पष्ट की गई हैं।
