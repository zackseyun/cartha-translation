lexical_decisions:
- source_word: καὶ εἶπεν Μωυσῆς
  choice: और मूसा ने कहा
  rationale: सरल संयोजक καί को ‘और’ से व्यक्त किया गया है; इससे यूनानी से अधिक स्पष्ट कालक्रम नहीं जोड़ा जाता।
- source_word: Διὰ τὸ μὴ βεβρῶσθαι
  choice: क्योंकि उसे खाया नहीं गया था
  rationale: διά के साथ प्रयुक्त संज्ञार्थक infinitive कारण बताता है। perfect passive βεβρῶσθαι को स्वाभाविक हिन्दी में पूर्ववर्ती निष्क्रिय क्रिया के रूप में व्यक्त किया गया है।
- source_word: τὸ περὶ τῆς ἁμαρτίας
  choice: पापबलि
  rationale: यह यूनानी बाइबिल में बलिदान-संबंधी प्रचलित मुहावरा है। ‘पाप से संबंधित वस्तु’ जैसा शब्दशः अनुवाद हिन्दी में अनावश्यक रूप से अस्पष्ट होगा।
- source_word: ἀνηλώθη
  choice: नष्ट कर दी गई
  rationale: निष्क्रिय क्रिया का अर्थ ‘खपा दी गई,’ ‘समाप्त कर दी गई,’ या ‘नष्ट कर दी गई’ हो सकता है। ‘नष्ट कर दी गई’ यूनानी की संक्षिप्तता बनाए रखता है और यह अनावश्यक रूप से नहीं बताता कि विनाश किस साधन से हुआ।
theological_decisions:
- issue: τὸ περὶ τῆς ἁμαρτίας का बलिदान-संबंधी अर्थ
  choice: पापबलि
  alternative: पाप से संबंधित वस्तु
  rationale: यह पदबंध सेप्टुआजिन्ट में पापबलि का स्थापित मुहावरा है। अर्थपूर्ण बलिदान-संबंधी शब्द चुनना संदर्भ को स्पष्ट करता है, पर किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं जोड़ता।
- issue: ἀνηλώθη में विनाश के साधन की अस्पष्टता
  choice: नष्ट कर दी गई
  alternative: जला दी गई
  rationale: निकटवर्ती बलिदान-संदर्भ जलाए जाने का संकेत दे सकता है, पर इस यूनानी क्रिया में स्वयं आग का उल्लेख नहीं है। इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कारण और परिणाम को हिन्दी में स्वाभाविक बनाने के लिए ‘क्योंकि … इसलिए’ संरचना अपनाई गई है। प्रदत्त संदर्भ 2 मक्काबियों 2:38 का स्रोत-सत्यापन नहीं हुआ है; मसौदा दिए गए यूनानी पाठ के आधार पर तैयार किया गया है।
