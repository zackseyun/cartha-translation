  rationale: διώκειν का मूल अर्थ पीछा करना है; यहाँ शत्रु-समूहों को दूर खदेड़ने का सैनिक परिणाम प्रसंगानुकूल है।
theological_decisions:
- issue: Ἰουδαϊσμός का धार्मिक-सांस्कृतिक आशय
  choice: यहूदी धर्म
  alternative: यहूदी जीवन-पद्धति
  rationale: मूल शब्द धार्मिक पहचान के साथ उससे जुड़ी सामुदायिक जीवन-पद्धति को भी समेट सकता है। मुख्य पाठ में प्रचलित संक्षिप्त पद रखा गया है और उसकी व्यापकता पादटिप्पणी में बताई गई है।
- issue: स्वर्गीय ἐπιφάνειαι की प्रकृति
  choice: स्वर्ग से हुए प्रकट दर्शन
  alternative: स्वर्गीय अभिव्यक्तियाँ
  rationale: मूल दृश्य प्रकट होने की बात करता है, पर यह निश्चित नहीं करता कि वे केवल निजी दर्शन थे या बाहरी अलौकिक घटनाएँ। इसलिए पादटिप्पणी में दोनों संभावनाएँ खुली रखी गई हैं।
