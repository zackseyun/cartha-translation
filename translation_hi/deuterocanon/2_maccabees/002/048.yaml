    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείας
  choice: प्रकट दर्शन
  rationale: यह पद दिखाई देने वाले अलौकिक प्रकट होने या अभिव्यक्तियों को सूचित करता है। ‘प्रकट दर्शन’ स्वर्गीय हस्तक्षेप के दृश्य और घटनात्मक पक्ष को रखता है, बिना किसी बाद की तकनीकी धार्मिक शब्दावली को थोपे।
- source_word: τὰς ἐξ οὐρανοῦ γενομένας
  choice: स्वर्ग से हुए
  rationale: यह वाक्यांश प्रकट दर्शनों के स्वर्गीय स्रोत और उनके घटित होने—दोनों को बनाए रखता है।
- source_word: τοῖς ... φιλοτίμως ἀνδραγαθήσασιν
  choice: जो लोग ... बड़े उत्साह और वीरता से लड़े
  rationale: φιλοτίμως उत्साही और सम्मानपूर्ण तत्परता को तथा ἀνδραγαθέω साहसपूर्ण पराक्रम को व्यक्त करता है। सैन्य प्रसंग में ‘लड़े’ निहित अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: यहूदी धर्म के लिए
  rationale: Ἰουδαϊσμός यहाँ विदेशी दबाव के विरुद्ध बचाई जा रही यहूदी धार्मिक-सांस्कृतिक पहचान को दर्शाता है। ‘यहूदी धर्म’ इसका संक्षिप्त और प्रचलित हिन्दी समतुल्य है; व्यापक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὡς
  choice: के कारण ... सके
  rationale: यहाँ ὡς स्वर्गीय प्रकट दर्शनों के परिणाम को आगे की सैनिक सफलता से जोड़ता है। हिन्दी में कारण-परिणाम की स्वाभाविक रचना अपनाई गई है, जबकि परिणाम का भाव सुरक्षित है।
- source_word: τὴν ὅλην χώραν
  choice: पूरे देश
  rationale: χώρα के भू-क्षेत्र संबंधी व्यापक अर्थ को सैन्य-राजनीतिक प्रसंग में ‘देश’ सहजता से व्यक्त करता है।
- source_word: ὀλίγους ὄντας
  choice: संख्या में थोड़े होते हुए भी
  rationale: यह अनपेक्षित सफलता के सामने उनकी कम संख्या को रियायती भाव में स्पष्ट करता है।
- source_word: λεηλατεῖν
  choice: लूट सके
  rationale: क्रिया युद्ध में लूट लेने या लूटमार करने को सूचित करती है; अनुवाद मूल के कठोर सैनिक अर्थ को नरम नहीं करता।
- source_word: τὰ βάρβαρα πλήθη
  choice: बर्बर जनसमूहों
  rationale: ‘बर्बर’ मूल यूनानी का जाति-सांस्कृतिक और विवादात्मक विशेषण बनाए रखता है, जबकि ‘जनसमूह’ πλήθη की बहुलता व्यक्त करता है।
- source_word: διώκειν
