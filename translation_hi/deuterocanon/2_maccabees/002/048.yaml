  text: और जो लोग यहूदी धर्म[b] के लिए बड़े उत्साह और वीरता से लड़े, उन्हें स्वर्ग से प्रकट होने की घटनाएँ[a] हुईं, जिसके फलस्वरूप वे संख्या में थोड़े होते हुए भी पूरे देश को लूट सके और बर्बर जनसमूहों[c] को खदेड़ सके।
