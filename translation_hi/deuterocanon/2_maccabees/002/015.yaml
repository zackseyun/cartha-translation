base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/015.yaml
  text: 'And the prayer had this form: “Lord God[a], creator of all things, the fearful and mighty and righteous and merciful one[c][b], the only king and good one,”'
translation:
  language: hi
  text: 'प्रार्थना इस प्रकार थी: “हे प्रभु परमेश्वर, सबके सृष्टिकर्ता, भय जगानेवाले[a], सामर्थी, धर्मी[b] और दयालु, एकमात्र राजा और भले प्रभु[c],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “श्रद्धामिश्रित भय उत्पन्न करनेवाले” अथवा “विस्मयकारी।” यूनानी शब्द का अर्थ ऐसा व्यक्ति है जो भय या विस्मय जगाता है।
    reason: lexical_alternative
  - marker: b
    text: या “न्यायी।”
    reason: lexical_alternative
  - marker: c
    text: या “कृपालु प्रभु” अथवा “उपकारी प्रभु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: प्रार्थना इस प्रकार थी
  rationale: यह यूनानी मुहावरा प्रार्थना के शब्दों का परिचय देता है। यह अनुवाद आधुनिक हिन्दी में स्वाभाविक है और मूल अर्थ के निकट रहता है।
- source_word: Κύριε ὁ θεός
  choice: हे प्रभु परमेश्वर
  rationale: यह परमेश्वर को किया गया सीधा संबोधन है। ‘हे’ हिन्दी में संबोधन को स्पष्ट करता है और ‘प्रभु’ κύριος के दैवीय पदनाम को बनाए रखता है।
- source_word: ὁ πάντων κτίστης
  choice: सबके सृष्टिकर्ता
  rationale: κτίστης सृजन करनेवाले को और πάντων समस्त सृष्टि को दर्शाता है। ‘सबके सृष्टिकर्ता’ संक्षिप्त, स्वाभाविक और व्यापक है।
- source_word: ὁ φοβερὸς
  choice: भय जगानेवाले
  rationale: φοβερός का आशय स्वयं भयभीत होने से नहीं, बल्कि भय या श्रद्धामिश्रित विस्मय उत्पन्न करने से है। यह वाक्यांश उस सक्रिय अर्थ को स्पष्ट रखता है।
- source_word: ὁ ἰσχυρὸς
  choice: सामर्थी
  rationale: यह दैवी शक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी वर्णन है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: ‘धर्मी’ परमेश्वर के नैतिक रूप से सही और न्यायपूर्ण चरित्र को व्यक्त करता है; ‘न्यायी’ भी सम्भव है।
- source_word: ἐλεήμων
  choice: दयालु
  rationale: यह दूसरों पर दया और करुणा दिखानेवाले के लिए सीधा और सामान्य हिन्दी शब्द है।
- source_word: ὁ μόνος βασιλεὺς
  choice: एकमात्र राजा
  rationale: यह μόνος की अनन्यता और βασιλεύς के राजकीय पदनाम, दोनों को सुरक्षित रखता है।
- source_word: χρηστός
  choice: भले प्रभु
  rationale: χρηστός का अर्थ भला, कृपालु या उपकारी हो सकता है। हिन्दी में विशेषण को संबोधित व्यक्ति से जोड़ने और मूल के विशेषणात्मक पदनाम को स्वाभाविक बनाने के लिए ‘प्रभु’ की पुनरुक्ति की गई है।
theological_decisions:
- issue: दैवीय संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रार्थना में यह परमेश्वर का पदनाम है। ‘प्रभु’ इसके धार्मिक और राजकीय वजन को ‘स्वामी’ की तुलना में अधिक स्वाभाविक ढंग से बनाए रखता है।
- issue: परमेश्वर के गुण के रूप में δίκαιος
  choice: धर्मी
  alternative: न्यायी
  rationale: दोनों अर्थ सम्भव हैं। ‘धर्मी’ परमेश्वर के समग्र नैतिक चरित्र को व्यक्त करता है, जबकि ‘न्यायी’ उसके न्याय करने पर अधिक बल देता है; विकल्प को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: φοβερός में भय और विस्मय का तनाव
  choice: भय जगानेवाले
  alternative: विस्मयकारी
  rationale: मूल शब्द भय, श्रद्धा और विस्मय उत्पन्न करनेवाले के लिए प्रयुक्त हो सकता है। मुख्य पाठ में भय का स्पष्ट तत्व रखा गया है और नरम विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। गुणों की सूची को स्पष्ट और सहज रखने के लिए अल्पविराम प्रयुक्त हैं। प्रदत्त यूनानी पाठ और दिए गए संदर्भ ‘2 मक्काबियों 2:15’ में गंभीर असंगति है; यह यूनानी पाठ प्रचलित अध्याय-विभाजन में 2 मक्काबियों 1:24 से मेल खाता है। प्रकाशन से पहले संदर्भ की पुष्टि आवश्यक है।
