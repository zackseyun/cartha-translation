  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली। 'बलिदान चढ़ाया' सहज धार्मिक प्रयोग है। 'पवित्रस्थान' ἱερόν की व्यापकता रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
