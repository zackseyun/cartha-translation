  text: And it was also made clear that[a], as one having wisdom[b], he offered a sacrifice for the dedication and completion of the sanctuary.
translation:
  language: hi
  text: और यह भी स्पष्ट किया गया कि, बुद्धि से संपन्न होकर, उसने पवित्रस्थान के समर्पण और उसकी पूर्णता[b] के लिए बलिदान चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “समर्पण” के लिए या, “पुनःसमर्पण”; ऐतिहासिक संदर्भ पुनःसमर्पण का संकेत दे सकता है, पर यूनानी में केवल “समर्पण” है। “पूर्णता” का अर्थ यहाँ पवित्रस्थान का “पवित्रीकरण” भी हो सकता है।
    reason: ἐγκαινισμοῦ के ऐतिहासिक विकल्प और τελειώσεως के संस्कारगत विकल्प को संयुक्त पदबंध के एक ही चिह्न पर स्पष्ट करता है।
lexical_decisions:
- source_word: διεσαφείτο
  choice: यह भी स्पष्ट किया गया
  rationale: अपूर्णकालीन कर्मवाच्य रूप किसी बात को स्पष्ट रूप से बताए या समझाए जाने का भाव देता है; हिन्दी में यह अभिव्यक्ति स्वाभाविक रहते हुए कर्मवाच्य अर्थ बचाती है।
- source_word: ὡς σοφίαν ἔχων
  choice: बुद्धि रखते हुए
  rationale: यह अनुवाद रीति और कारण के बीच यूनानी पदबंध की संभावित अस्पष्टता बनाए रखता है और इसे केवल कारणवाचक नहीं बनाता।
- source_word: ἀνήνεγκεν θυσίαν
  choice: बलिदान चढ़ाया
  rationale: बलिदान-संबंधी प्रसंग में ἀναφέρω का अर्थ अर्पित करना या चढ़ाना है; 'बलिदान चढ़ाया' आधुनिक हिन्दी की सहज धार्मिक अभिव्यक्ति है।
- source_word: ἐγκαινισμοῦ
  choice: समर्पण
  rationale: यह मूल शब्द के dedication भाव को व्यक्त करता है; ऐतिहासिक रूप से पुनःसमर्पण संभव है, पर यूनानी शब्द में 'पुनः' स्पष्ट नहीं है।
- source_word: τελειώσεως
  choice: पूर्ण किए जाने
  rationale: यह पूर्णता तक पहुँचाने के मूल भाव को सुरक्षित रखता है और संस्कारगत 'पवित्रीकरण' को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: τοῦ ἱεροῦ
  choice: पवित्रस्थान
  rationale: ἱερόν मंदिर के पवित्र परिसर या धर्मस्थान का सूचक है; 'पवित्रस्थान' इस व्यापक पवित्र अर्थ को बनाए रखता है।
theological_decisions:
- issue: τελειώσεως का संस्कारगत अर्थ
  choice: पूर्ण किए जाने
  alternative: पवित्रीकरण
  rationale: शब्द किसी वस्तु को उसकी अभिप्रेत पवित्र पूर्णता तक पहुँचाने का भाव रख सकता है। मुख्य पाठ में व्यापक शाब्दिक अर्थ रखा गया है और संस्कारगत विकल्प टिप्पणी में दिया गया है।
- issue: ἐγκαινισμοῦ में ऐतिहासिक पुनःसमर्पण का संकेत
  choice: समर्पण
  alternative: पुनःसमर्पण
  rationale: मक्काबी ऐतिहासिक संदर्भ पुनःसमर्पण का सुझाव देता है, पर मूल यूनानी संज्ञा स्वयं केवल समर्पण कहती है; इसलिए मुख्य पाठ में अतिरिक्त ऐतिहासिक अर्थ नहीं जोड़ा गया।
- issue: ὡς σοφίαν ἔχων का संबंध
  choice: बुद्धि रखते हुए
  alternative: क्योंकि उसमें बुद्धि थी
  rationale: ὡς सहित कृदन्त पदबंध रीति, गुण या आधार का संकेत दे सकता है। हिन्दी में कृदन्तीय रूप इस तनाव को कारणवाचक वाक्य की अपेक्षा बेहतर बनाए रखता है।
