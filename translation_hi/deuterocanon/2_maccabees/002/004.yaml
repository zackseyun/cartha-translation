base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/004.yaml
  text: For when the leader and the force around him[a], which seemed invincible, had arrived, they were cut down in the temple of Nanaia, because the priests attending Nanaia had used deceit.
translation:
  language: hi
  text: क्योंकि जब वह अगुआ और उसके साथ की वह सेना, जो अजेय जान पड़ती थी,[a] वहाँ पहुँचे, तो ननैया के पुजारियों के छल के कारण वे ननैया के मंदिर में काट डाले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका सामना करना असंभव जान पड़ता था।” यहाँ प्रयुक्त यूनानी शब्द कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: वहाँ पहुँचे
  rationale: संदर्भ में कृदंत का अर्थ ‘आना/पहुँचना’ है, न कि ‘बनना’; ‘वहाँ’ मंदिर से जुड़ी कथात्मक गति को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: ἡγεμών
  choice: अगुआ
  rationale: यह सामान्य नेतृत्व-सूचक पद है; ‘अगुआ’ किसी विशिष्ट नागरिक पद या सैन्य पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: उसके साथ की ... सेना
  rationale: सैन्य प्रसंग में δύναμις सैनिक दल या सेना को सूचित करता है, और περὶ αὐτόν उसके साथ उपस्थित लोगों को।
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: जो अजेय जान पड़ती थी
  rationale: यह कठिन पदबंध सैन्य प्रसंग में ऐसी शक्ति को दर्शाता है जिसका सामना करना असंभव प्रतीत हो; ‘जान पड़ती थी’ δοκοῦσα की प्रत्यक्ष अनिश्चितता बनाए रखता है।
- source_word: κατεκόπησαν
  choice: काट डाले गए
  rationale: निष्क्रिय क्रिया हिंसक वध का सजीव बोध देती है; यह केवल सामान्य ‘मार डाले गए’ से अधिक निकट है।
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: ननैया के मंदिर में
  rationale: ἱερόν के लिए ‘मंदिर’ स्वाभाविक और स्पष्ट है; देवी का नाम लिप्यंतरित किया गया है।
- source_word: παραλογισμῷ χρησαμένων
  choice: छल के कारण
  rationale: संबंधकारक निरपेक्ष रचना वध के साधन अथवा कारण को बताती है; ‘छल’ παραλογισμός की कपटपूर्ण युक्ति को संक्षेप में व्यक्त करता है।
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: ननैया के पुजारियों
  rationale: περὶ + कर्मकारक यहाँ ननैया से संबद्ध या उसकी सेवा में लगे पुजारियों को सूचित करता है; हिंदी में संबंधकारक सबसे स्वाभाविक है।
theological_decisions:
- issue: देवी के नाम Ναναία का रूप
  choice: ननैया
  alternative: ननाया / ननाइया
  rationale: नाम का अनुवाद करने के बजाय यूनानी रूप के निकट देवनागरी लिप्यंतरण किया गया है; ‘ननैया’ आधुनिक हिंदी पाठक के लिए उच्चारणयोग्य है।
- issue: ἀνυπόστατος का सैन्य अर्थ
  choice: अजेय
  alternative: जिसका सामना करना असंभव था / अप्रतिरोध्य
  rationale: सैन्य संदर्भ में सेना को ‘अजेय जान पड़ती थी’ कहना सर्वाधिक संगत है, पर ‘जान पड़ती थी’ के द्वारा लेखक के कथन को वास्तविक अजेयता का पूर्ण दावा नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। वाक्य में यूनानी की लंबी संरचना को पठनीय हिंदी क्रम में रखा गया है, जबकि सेना की प्रतीत होने वाली अजेयता और पुजारियों के छल—दोनों मूल तनाव सुरक्षित हैं।
