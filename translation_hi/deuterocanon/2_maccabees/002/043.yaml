translation:
  language: hi
  text: चूँकि हम शुद्धीकरण मनाने वाले हैं, इसलिए हमने तुम्हें लिखा है। अतः तुम इन दिनों को मनाओगे तो अच्छा करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μέλλοντες
  choice: चूँकि हम ... मनाने वाले हैं
  rationale: यह वर्तमान कृदंत निकट भविष्य की तैयारी बताता है। οὖν के साथ यहाँ पत्र लिखने का अवसर या कारण सामने आता है; इसलिए ‘चूँकि ... मनाने वाले हैं’ स्वाभाविक हिन्दी में दोनों भाव रखता है।
- source_word: ἄγειν
  choice: मनाने
  rationale: यह क्रिया पद में दो बार आई है—पहले ‘शुद्धीकरण’ और फिर ‘दिनों’ के साथ। पर्व-संदर्भ में इसका अर्थ किसी उत्सव या नियत दिनों को मनाना अथवा उनका पालन करना है। दोनों स्थानों पर ‘मनाना’ रखने से यूनानी की पुनरावृत्ति भी बनी रहती है।
- source_word: τὸν καθαρισμόν
  choice: शुद्धीकरण
  rationale: संज्ञा का मूल अर्थ ‘शुद्धीकरण’ या ‘शुद्ध करना’ है। प्रसंग में यह मन्दिर के शुद्धीकरण के स्मरणोत्सव की ओर संकेत करता है, पर मुख्य पाठ में ‘पर्व’ जोड़ने के बजाय स्रोत की संक्षिप्त अभिव्यक्ति रखी गई है।
- source_word: ἐγράψαμεν
  choice: हमने तुम्हें लिखा है
  rationale: पत्र-लेखन के प्रसंग में यूनानी अओरिस्ट को हिन्दी के पूर्ण वर्तमान से देना स्वाभाविक है और वर्तमान पत्र से उसका संबंध स्पष्ट रखता है।
- source_word: καλῶς ... ποιήσετε
  choice: तो अच्छा करोगे
  rationale: यह सराहना के साथ दिया गया विनम्र प्रोत्साहन है। ‘तो अच्छा करोगे’ सामान्य आधुनिक हिन्दी में इस मुहावरे का सहज समतुल्य है।
- source_word: τὰς ἡμέρας
  choice: इन दिनों
  rationale: यूनानी में निश्चित पदबंध ‘वे/उन दिनों’ है और प्रसंग उन्हीं उल्लिखित स्मरण-दिवसों को स्पष्ट करता है। हिन्दी में ‘इन दिनों’ उस निकट संदर्भ को स्वाभाविक रूप से व्यक्त करता है; ‘पर्व के दिन’ जोड़ना अधिक व्याख्यात्मक होता।
