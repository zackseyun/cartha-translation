- source_word: οὐκ εὐχερές
  choice: यह काम आसान नहीं होता
  rationale: यूनानी का निरपेक्ष कठिनाई-बोध हिन्दी में स्पष्ट करने के लिए ‘यह काम’ जोड़ा गया है, बिना कोई नया आशय लाए।
- source_word: ὅμως
  choice: फिर भी
  rationale: यह पहले स्वीकार की गई कठिनाई के विपरीत लेखक की तत्परता को दर्शाता है।
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: बहुतों की कृतज्ञता की खातिर
  rationale: διά के कारण अथवा प्रयोजन-सदृश भाव और εὐχαριστία के सामान्य अर्थ ‘कृतज्ञता’ को बनाए रखता है; ‘बहुतों’ को सामान्यीकृत नहीं किया गया।
- source_word: ἡδέως
  choice: सहर्ष
  rationale: कठिनाई के बावजूद प्रसन्न और स्वेच्छापूर्ण तत्परता को गरिमापूर्ण, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: हम यह कठिन परिश्रम सहर्ष सहेंगे
  rationale: κακοπάθεια इस संदर्भ में साहित्यिक श्रम की कठिनाई है और ὑποίσομεν उसे उठा लेने या सहने का भाव देता है; ‘कठिन परिश्रम’ केवल शारीरिक पीड़ा का अतिशयोक्त अर्थ नहीं देता।
