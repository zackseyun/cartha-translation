  text: जिस प्रकार जो भोज तैयार करता है और दूसरों का हित चाहता है, उसके लिए यह आसान नहीं है, फिर भी बहुतों की कृतज्ञता[a] के कारण हम इस कष्ट को सहर्ष सहेंगे;
