  text: जब बलि की सामग्री[a] खप गई[b], तब नहेमायाह ने आदेश दिया कि बचा हुआ पानी बड़े पत्थरों पर उँडेल दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘बलि की वस्तुएँ’। यह पद संक्षिप्त और दीर्घवृत्तीय है; संदर्भ में इसका आशय संभवतः बलि के लिए प्रयुक्त सामग्री से है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी कथन का क्रम कुछ संक्षिप्त और असहज है। अनुवाद उसके प्रत्यक्ष आशय को स्पष्ट करता है, पर यह तय नहीं करता कि सामग्री किस रीति से पूरी तरह खपी।
    reason: textual_variant
