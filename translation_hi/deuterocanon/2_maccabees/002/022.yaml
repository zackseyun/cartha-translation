- source_word: ὁ Νεεμίας
  choice: नहेमायाह
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: ἐκέλευσεν
  choice: आदेश दिया
  rationale: क्रिया अधिकारपूर्वक आज्ञा देने का भाव व्यक्त करती है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: λίθους μείζονας
  choice: बड़े पत्थरों
  rationale: μείζονας तुलनात्मक रूप है, पर तुलना का मानक व्यक्त नहीं है। ‘बड़े पत्थरों’ से हिन्दी में अपेक्षित अर्थ स्वाभाविक रूप से आता है, बिना किसी अनिर्दिष्ट तुलना को कठोर बनाए।
- source_word: καταχεῖν
  choice: पर उँडेल दिया जाए
  rationale: संयुक्त क्रिया किसी वस्तु के ऊपर तरल उँडेलने को दर्शाती है; निष्क्रिय आज्ञार्थक रचना हिन्दी वाक्य में सहज बैठती है।
