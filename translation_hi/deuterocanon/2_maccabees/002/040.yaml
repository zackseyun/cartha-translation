base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/040.yaml
  text: The same things were also related in the records and in the memoirs concerning Nehemiah[a], and how, in founding a library, he gathered together the books about the kings and prophets, and the writings of David[b], and letters of kings concerning votive offerings.
translation:
  language: hi
  text: इन्हीं बातों का वर्णन अभिलेखों और नहेमायाह से संबंधित संस्मरणों में भी किया गया था; और यह भी कि उसने एक पुस्तकालय स्थापित करते हुए[a] राजाओं और नबियों के विषय में पुस्तकें, दाऊद की रचनाएँ, और समर्पित भेंटों[b] के विषय में राजाओं के पत्र इकट्ठे किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक पुस्तकालय की नींव रखते हुए।” यूनानी कृदंत पुस्तकालय को स्थापित करने या उसकी नींव रखने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात परमेश्वर को अर्पित की गई भेंटें या वस्तुएँ; इसका अनुवाद “मन्नत की भेंटें” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξηγοῦντο
  choice: वर्णन किया गया था
  rationale: यहाँ क्रिया उन बातों को लिखित स्रोतों में सुनाए या दर्ज किए जाने की ओर संकेत करती है; यह रूप संदर्भ के अनुकूल है और ‘व्याख्या’ का अतिरिक्त भाव नहीं जोड़ता।
- source_word: ἀναγραφαῖς
  choice: अभिलेखों
  rationale: यह लिखित या आधिकारिक दस्तावेज़ों के सामान्य अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπομνηματισμοῖς
  choice: संस्मरणों
  rationale: नहेमायाह से संबंधित स्मरणात्मक लेखों या विवरणों का संभावित अर्थ बनाए रखता है, बिना इन्हें औपचारिक टीका मानने के।
- source_word: τοῖς κατὰ τὸν Νεεμίαν
  choice: नहेमायाह से संबंधित
  rationale: यह वाक्यांश विषय-संबंध प्रकट करता है और नहेमायाह को निश्चित रूप से लेखक ठहराने से बचता है।
- source_word: καταβαλλόμενος
  choice: स्थापित करते हुए
  rationale: βιβλιοθήκην के साथ इसका अर्थ किसी पुस्तकालय की नींव रखने या उसे स्थापित करने का है, न कि किसी वस्तु को नीचे फेंकने का।
- source_word: βιβλιοθήκην
  choice: एक पुस्तकालय
  rationale: मूल शब्द का सीधा अर्थ पुस्तकालय अथवा पुस्तकों का संग्रह है; ‘पुस्तकालय’ स्पष्ट और स्वाभाविक है।
- source_word: ἐπισυνήγαγεν
  choice: इकट्ठे किए
  rationale: यह अलग-अलग सामग्री को एक स्थान पर एकत्र करने का भाव सुरक्षित रखता है।
- source_word: τὰ περὶ τῶν βασιλέων καὶ προφητῶν βιβλία
  choice: राजाओं और नबियों के विषय की पुस्तकें
  rationale: περὶ का ‘के विषय में’ अर्थ बनाए रखा गया है; इससे यह दावा नहीं होता कि वे पुस्तकें अनिवार्यतः राजाओं और नबियों द्वारा लिखी गई थीं।
- source_word: τὰ τοῦ Δαυείδ
  choice: दाऊद की रचनाएँ
  rationale: यूनानी में संज्ञा लुप्त है; ‘रचनाएँ’ अर्थ को स्पष्ट करती है, पर इसे केवल भजनों तक सीमित नहीं करती।
- source_word: ἐπιστολὰς βασιλέων
  choice: राजाओं के पत्र
  rationale: यह संबंधकारक पदबंध का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: περὶ ἀναθεμάτων
  choice: समर्पित भेंटों के विषय में
  rationale: मंदिर-संबंधी संदर्भ में यह परमेश्वर को अर्पित या समर्पित वस्तुओं को दर्शाता है; यह बाद के ‘अभिशाप’ वाले अर्थ से बचाता है।
theological_decisions:
- issue: ἀναθεμάτων का अर्थ
  choice: समर्पित भेंटें
  alternative: मन्नत की भेंटें; समर्पित वस्तुएँ
  rationale: इस ऐतिहासिक और मंदिर-संबंधी प्रसंग में शब्द का आशय देवता को समर्पित उपहारों या वस्तुओं से है। ‘समर्पित भेंटें’ व्यापक अर्थ को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। दस्तावेज़ी संदर्भ के लिए ‘अभिलेख’ और ‘संस्मरण’ प्रयुक्त हुए हैं। यूनानी की अस्पष्टताओं को अनावश्यक रूप से निश्चित नहीं किया गया; विशेषतः नहेमायाह के लेखकीय संबंध, दाऊद की रचनाओं की विधा, और समर्पित भेंटों के स्वरूप को खुला रखा गया है।
