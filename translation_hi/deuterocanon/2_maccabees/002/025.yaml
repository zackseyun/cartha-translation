  rationale: ποιέω का सामान्य अर्थ ‘बनाना’ है। प्रसंग में यह भौतिक निर्माण, स्थापना या पवित्र स्थान के रूप में निर्धारित करने—इन संभावनाओं को खुला रखता है।
- source_word: δοκιμάσας
  choice: परख लिया था
  rationale: δοκιμάζω में जाँचने, परखने और कभी-कभी परखकर सही ठहराने का भाव है। ‘परख लिया था’ मूल परीक्षण के भाव और मुख्य क्रिया से उसकी पूर्वता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ πρᾶγμα
  choice: उस बात को
  rationale: πρᾶγμα व्यापक रूप से बात, मामला या परिस्थिति को सूचित कर सकता है। ‘उस बात को’ आधुनिक हिन्दी में सहज है और मूल की अनिश्चितता को बनाए रखता है।
