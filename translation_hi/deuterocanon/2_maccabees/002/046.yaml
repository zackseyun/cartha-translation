    text: अथवा “वेदी का पुनःसमर्पण।” यूनानी में “समर्पण” है, पर ऐतिहासिक प्रसंग वेदी के अपवित्रीकरण के बाद उसकी पुनर्स्थापना का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ δὲ κατὰ τὸν Ἰούδαν
  choice: और यहूदा … से सम्बन्धित घटनाएँ
  rationale: नपुंसकलिंग बहुवचन τὰ के साथ κατά और कर्मकारक उन विषयों या घटनाओं की ओर संकेत करते हैं जो यहूदा से सम्बन्धित हैं। δέ का हल्का संयोजक बल ‘और’ से व्यक्त किया गया है; ‘अब’ जैसा कालसूचक शब्द नहीं जोड़ा गया।
- source_word: Ἰούδαν τὸν Μακκαβαῖον
  choice: यहूदा मकाबी
  rationale: नाम और उपाधि का हिन्दी बाइबलीय परम्परा में सहज और पहचाना जाने वाला रूप।
- source_word: τοὺς τούτου ἀδελφούς
  choice: उसके भाइयों
  rationale: यहाँ ἀδελφοί यहूदा के वास्तविक भाइयों को सूचित करता है, किसी सामान्य समुदाय को नहीं।
- source_word: τοῦ ἱεροῦ τοῦ μεγίστου
  choice: परम महान पवित्रस्थान
  rationale: ἱερόν यरूशलेम के मंदिर अथवा उसके पवित्र परिसर को सूचित करता है और μεγίστου उत्कृष्टतम भाव देता है। ‘पवित्रस्थान’ मूल के धार्मिक-पवित्र स्थान वाले अर्थ को बनाए रखता है, जबकि ‘परम महान’ असामान्य परन्तु जानबूझकर प्रयुक्त विशेषण को धर्मशास्त्रीय रूप से ‘परम पवित्र’ में नहीं बदलता।
- source_word: καθαρισμόν
  choice: शुद्धीकरण
  rationale: यह सामान्य सफाई के बजाय अशुद्ध किए गए पवित्रस्थान की अनुष्ठानिक शुद्धि का भाव रखता है।
- source_word: βωμοῦ
  choice: वेदी
  rationale: बलिदान-सन्दर्भ में βωμός का मानक हिन्दी रूप।
- source_word: ἐγκαινισμόν
  choice: समर्पण
  rationale: शब्द उद्घाटन अथवा समर्पण को व्यक्त करता है; मूल यूनानी में ‘फिर से’ स्पष्ट रूप से नहीं है, इसलिए मुख्य पाठ में ‘पुनःसमर्पण’ नहीं रखा गया।
theological_decisions:
- issue: यरूशलेम के ἱερόν का अनुवाद
  choice: पवित्रस्थान
  alternative: मंदिर
  rationale: दोनों अर्थ सम्भव हैं। ‘पवित्रस्थान’ धार्मिक परिसर के भाव को सुरक्षित रखता है और मूल के पद से निकट है; इसे अधिक संकीर्ण ‘गर्भगृह’ के अर्थ में नहीं लिया जाना चाहिए।
- issue: वेदी के ἐγκαινισμός में पुनर्समर्पण का भाव
  choice: समर्पण
  alternative: पुनःसमर्पण
  rationale: ऐतिहासिक प्रसंग अपवित्रीकरण के बाद पुनर्स्थापना का है, पर यूनानी संज्ञा अपने आप में पुनरावृत्ति को स्पष्ट नहीं करती। इसलिए मुख्य पाठ मूल की व्यापकता बनाए रखता है और प्रसंगगत विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। वाक्यांश मूल की तरह अधूरा और आगे जुड़ने वाला है, इसलिए अन्त में अल्पविराम बनाए रखा गया है।
