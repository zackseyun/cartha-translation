lexical_decisions:
- source_word: ἡμῖν ... τοῖς
  choice: हमारे लिए, जिन्होंने
  rationale: सम्प्रदान कारक और निश्चित उपपद-सहित कृदन्त लेखकों को उन लोगों के रूप में प्रस्तुत करते हैं जिन्होंने यह दायित्व लिया है। यह हिन्दी प्रयोग आत्म-संदर्भ और वाक्य के संबंध, दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: τὴν κακοπάθειαν
  choice: यह कठिन परिश्रम
  rationale: κακοπάθεια कष्ट सहने, कठिनाई या श्रम का बोध कराता है। साहित्यिक संक्षेप तैयार करने के प्रसंग में ‘कठिन परिश्रम’ कठिनाई और श्रम दोनों को व्यक्त करता है, बिना इसे उत्पीड़न का अर्थ दिए।
- source_word: ἐπιδεδιγμένοις
  choice: अपने ऊपर लिया है
  rationale: पूर्णकालिक मध्यवाच्य कृदन्त किसी कठिन दायित्व को स्वीकार कर लेने और उसमें लगे रहने का भाव देता है। ‘अपने ऊपर लिया है’ इस आत्म-प्रतिबद्धता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς ἐπιτομῆς
  choice: संक्षेप तैयार करने का
  rationale: ἐπιτομή किसी बड़े लिखित ग्रंथ के संक्षिप्त रूप को सूचित करता है। ‘संक्षेप तैयार करने का’ स्पष्ट करता है कि कठिन परिश्रम उस संक्षिप्त कृति के निर्माण से जुड़ा है।
- source_word: οὐ ῥᾴδιον
  choice: यह काम आसान नहीं
  rationale: यह यूनानी कथन की सीधी और सहज हिन्दी अभिव्यक्ति है; प्रसंग से निहित कर्ता ‘काम’ को स्पष्ट किया गया है।
- source_word: ἱδρῶτος ... καὶ ἀγρυπνίας
  choice: पसीना बहाने और रातों को जागने
  rationale: यह अनुवाद श्रम के शारीरिक चित्र और नींद त्यागने के भाव को बनाए रखता है। ‘रातों को जागने’ आधुनिक हिन्दी में ἀγρυπνία का स्वाभाविक प्रसंगगत रूप है।
- source_word: τὸ πρᾶγμα
  choice: काम
  rationale: πρᾶγμα यहाँ संक्षेप तैयार करने के उपक्रम को सूचित करता है। ‘काम’ साधारण पाठक के लिए स्पष्ट है और प्रसंग में उपयुक्त गरिमा रखता है।
