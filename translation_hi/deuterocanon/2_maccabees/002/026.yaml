  text: और हमारे लिए, जिन्होंने इस संक्षिप्त रूप को तैयार करने का कठिन परिश्रम अपने ऊपर लिया है, यह काम आसान नहीं है; बल्कि इसके लिए पसीना बहाना और रातों को जागना पड़ता है;
