  text: और अन्तियोकुस एपिफनेस तथा उसके पुत्र यूपातोर के विरुद्ध युद्ध भी,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι τε
  choice: और ... भी
  rationale: यह पदावली चल रही सूची में एक और विषय जोड़ती है; हिन्दी में विभक्त रूप ‘और ... भी’ इसका योगात्मक बल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοὺς ... πολέμους
  choice: युद्ध
  rationale: πολέμους व्यापक रूप से युद्धों या सैन्य संघर्षों को दर्शाता है; सूची के संक्षिप्त शैलीगत संदर्भ में ‘युद्ध’ सीधा और स्वाभाविक है।
- source_word: πρὸς
  choice: के विरुद्ध
  rationale: πολέμους के साथ πρὸς विरोधी पक्ष को सूचित करता है; ‘के विरुद्ध’ उस संघर्षात्मक संबंध को स्पष्ट रखता है।
- source_word: Ἀντίοχον τὸν Ἐπιφανῆ
  choice: अन्तियोकुस एपिफनेस
  rationale: राजकीय उपाधि को अर्थानुवाद करने के बजाय प्रचलित ऐतिहासिक नाम के रूप में लिप्यंतरित किया गया है।
- source_word: τὸν τούτου υἱὸν Εὐπάτορα
  choice: उसके पुत्र यूपातोर
  rationale: τούτου का संकेत अन्तियोकुस की ओर है; यह चयन पुत्र-संबंध को संक्षिप्त और स्पष्ट रूप में बनाए रखता है।
