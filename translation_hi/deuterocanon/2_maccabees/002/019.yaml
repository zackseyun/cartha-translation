  text: जो घमंड से अत्याचार और दुर्व्यवहार करते हैं, उन्हें दण्ड दे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो घमंड से अत्याचार करते और उद्दंड आचरण करते हैं”; यूनानी क्रिया केवल बोलकर अपमान करने से अधिक व्यापक, अपमानजनक या हिंसक दुर्व्यवहार भी जता सकती है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के लिए दिया गया यूनानी स्रोत केवल एक छोटा वाक्यांश है और स्रोत से बड़े असामंजस्य के रूप में चिह्नित है; यह अनुवाद केवल उसी उपलब्ध वाक्यांश को प्रस्तुत करता है।
    reason: textual_variant
lexical_decisions:
- source_word: βάσανισον
  choice: दण्ड दे
  rationale: प्रार्थना में प्रयुक्त अओरिस्ट आज्ञार्थक यहाँ दण्डात्मक कष्ट या न्याय की विनती व्यक्त करता है। ‘दण्ड दे’ न्यायिक आशय को स्वाभाविक हिन्दी में रखता है, पर दण्ड के ढंग को अनावश्यक रूप से ‘यातना’ नहीं बनाता।
- source_word: τοὺς καταδυναστεύοντας
  choice: जो ... अत्याचार ... करते हैं
  rationale: कृदन्त उन लोगों को दर्शाता है जो अपनी शक्ति का दमनकारी उपयोग करते हैं। ‘अत्याचार करते हैं’ आधुनिक हिन्दी में सतत दमनकारी आचरण को स्पष्ट करता है।
- source_word: καὶ ἐξυβρίζοντας
  choice: और दुर्व्यवहार करते हैं
  rationale: क्रिया में उद्दंड, अपमानजनक और संभवतः हिंसक दुर्व्यवहार का भाव है। ‘दुर्व्यवहार’ इसे केवल मौखिक अपमान तक सीमित नहीं करता; व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐν ὑπερηφανίᾳ
  choice: घमंड से
  rationale: यह पदबंध उस अहंकारी मनोभाव या रीति को बताता है जिसमें अत्याचार और दुर्व्यवहार किए जाते हैं। ‘घमंड से’ सहज, वर्तमान और नैतिक भारयुक्त हिन्दी है।
theological_decisions:
- issue: स्रोत की अखंडता और पद की पहचान
  choice: उपलब्ध यूनानी खंड को उसके अपने रूप में प्रार्थना की विनती के रूप में अनुवादित किया गया है; आसपास की कोई सामग्री नहीं जोड़ी गई।
  alternative: किसी अन्य पद-संदर्भ या पाठ-परंपरा में इससे लंबा वाक्य हो सकता है।
  rationale: दिया गया मूल पाठ एक छोटा, स्वतंत्र आज्ञार्थक खंड है और उसे ‘major_mismatch’ के रूप में चिह्नित किया गया है। इसलिए अनुवाद केवल उपलब्ध यूनानी पाठ पर आधारित है और अनुमान से छूटी हुई सामग्री की पुनर्रचना नहीं करता।
