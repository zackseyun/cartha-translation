  choice: हर विषय का ठीक-ठीक विवरण देना
  rationale: यह पद प्रत्येक विषय को सटीकता और विस्तार से प्रस्तुत करने का भाव रखता है। ‘ठीक-ठीक विवरण देना’ आधुनिक हिन्दी में इसकी साहित्यिक और सूक्ष्म अर्थ-छाया को सहज रूप से व्यक्त करता है।
- source_word: τῷ συγγραφεῖ παραχωρήσαντες
  choice: लेखक पर छोड़ते हुए
  rationale: παραχωρέω यहाँ किसी कार्य को दूसरे के अधिकार-क्षेत्र में छोड़ देने के अर्थ में है; συγγραφεύς के लिए इस साहित्यिक संदर्भ में ‘लेखक’ स्वाभाविक है।
- source_word: ἐπιπορεύεσθαι
  choice: पर चलने के लिए
  rationale: ὑπογραμμοῖς के साथ यह किसी मार्गदर्शक रेखा या रूपरेखा के अनुसार आगे बढ़ने का रूपक है। ‘पर चलना’ उस गति-संबंधी रूपक को बनाए रखता है।
- source_word: τοῖς ὑπογραμμοῖς
  choice: रूपरेखा
  rationale: ὑπογραμμός रेखांकन, नमूने या अनुसरण की जाने वाली रूपरेखा को सूचित कर सकता है। यहाँ संक्षेप तैयार करने की मुख्य रेखाओं का भाव है।
- source_word: τῆς ἐπιτομῆς
  choice: संक्षिप्त रूप की
  rationale: ἐπιτομή किसी बड़े ग्रंथ के संक्षिप्त साहित्यिक रूप को दर्शाता है। ‘संक्षिप्त रूप’ सामान्य पाठक के लिए स्पष्ट है और तकनीकी आशय भी बनाए रखता है।
- source_word: ἀτονοῦντες
  choice: पूरा परिश्रम कर रहे हैं
  rationale: यहाँ शब्द कार्य को पूरा करने में लगने वाले श्रम या तनाव पर बल देता है। मुख्य पाठ में ‘पूरा परिश्रम’ प्रसंगानुकूल है, जबकि शब्द की असामान्य और संकुचित अभिव्यक्ति को पाद-टिप्पणी में सुरक्षित रखा गया है।
