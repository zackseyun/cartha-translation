  text: हर विषय का ठीक-ठीक विवरण देना लेखक पर छोड़ते हुए, हम संक्षेप की रूपरेखाओं का अनुसरण करने का प्रयत्न कर रहे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
