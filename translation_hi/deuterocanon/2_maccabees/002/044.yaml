  text: परन्तु परमेश्वर, जिसने अपनी सारी प्रजा को बचाया और सबको अपनी विरासत, राजसत्ता[b], याजकपद और पवित्रता[c] दी[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबको अपनी विरासत लौटा दी” या “बहाल कर दी।” यूनानी क्रिया का अर्थ देना, वापस देना या बहाल करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “राज्य।” यूनानी शब्द राजकीय शासन, राजकीय पद-गरिमा या राज्य का बोध करा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “पवित्रीकरण” अथवा “पवित्र समर्पण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ θεός
  choice: परन्तु परमेश्वर
  rationale: δέ पूर्ववर्ती कथन से संबंध रखते हुए हल्का विरोध अथवा संक्रमण दिखाता है; ‘परन्तु’ इस संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ σώσας
  choice: जिसने ... बचाया
  rationale: भूतकालिक कृदन्त परमेश्वर के पूर्ण किए हुए उद्धारकारी कार्य को व्यक्त करता है; सम्बन्धवाचक उपवाक्य हिन्दी में स्वाभाविक है।
- source_word: τὸν πάντα λαὸν αὐτοῦ
  choice: अपनी सारी प्रजा को
  rationale: लेख सहित πᾶς पूरे समुदाय की समग्रता व्यक्त करता है; ‘सारी प्रजा’ सामूहिक अर्थ को स्पष्ट रखता है।
- source_word: ἀποδοὺς
  choice: लौटा दी
  rationale: ἀποδίδωμι में देने के साथ वापस देने या बहाल करने का भाव भी है। इस प्रसंग में covenant privileges की पुनःप्राप्ति का भाव ‘लौटा दी’ से स्वाभाविक रूप में व्यक्त होता है; केवल ‘दी’ भी सम्भव है।
- source_word: τὴν κληρονομίαν αὐτοῦ
  choice: अपनी विरासत
  rationale: एकवचन αὐτοῦ का निकटतम व्याकरणिक पूर्वपद परमेश्वर है; ‘अपनी’ इसी संबंध को बनाए रखता है, बिना इसे ‘उनकी विरासत’ बनाकर व्याख्यायित किए।
- source_word: πᾶσιν
  choice: सबको
  rationale: संक्षिप्त बहुवचन सम्प्रदान का स्वाभाविक हिन्दी रूप; इसका संकेत पूरी प्रजा की ओर है।
- source_word: τὸ βασίλειον
  choice: राजसत्ता
  rationale: βασίλειον राजकीय शासन, पद या राज्य का बोध करा सकता है। याजकपद और पवित्रता की सूची में ‘राजसत्ता’ संस्थागत-अमूर्त अर्थ को सुरक्षित रखती है।
- source_word: τὸ ἱεράτευμα
  choice: याजकपद
  rationale: यह याजकीय पद अथवा संस्था का संक्षिप्त और प्रतिष्ठित आधुनिक हिन्दी रूप है।
- source_word: τὸν ἁγιασμόν
  choice: पवित्रता
  rationale: ἁγιασμός पवित्रता, पवित्रीकरण या समर्पण का अर्थ दे सकता है। सूची में ‘पवित्रता’ सबसे स्वाभाविक है और प्रक्रिया की अपेक्षा प्राप्त पवित्र स्थिति को खुला रखती है।
theological_decisions:
- issue: ‘अपनी विरासत’ में सर्वनाम का संदर्भ
  choice: ‘अपनी’ को परमेश्वर से संबंधित रखा गया है।
  alternative: प्रसंगानुसार इसे प्रजा से जोड़कर ‘उनकी विरासत’ कहा जा सकता है।
  rationale: यूनानी αὐτοῦ व्याकरणतः θεός की ओर सबसे सीधे संकेत करता है। इसे बनाए रखने से यह धारणा सुरक्षित रहती है कि विरासत परमेश्वर की है और वही उसे अपनी प्रजा को देता या लौटाता है।
- issue: βασίλειον का अर्थ
  choice: राजसत्ता
  alternative: राज्य
  rationale: शब्द राजकीय अधिकार, गरिमा या राज्य-क्षेत्र का सूचक हो सकता है। समानान्तर अमूर्त संस्थाओं की सूची के कारण ‘राजसत्ता’ चुना गया, जबकि ‘राज्य’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἁγιασμός का अर्थ
  choice: पवित्रता
  alternative: पवित्रीकरण अथवा पवित्र समर्पण
  rationale: मूल शब्द अवस्था, प्रक्रिया या धार्मिक अभिषेक/समर्पण की ओर संकेत कर सकता है। मुख्य पाठ में स्वाभाविक ‘पवित्रता’ रखी गई है और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। यह पद अगले वाक्यांश में जारी रहने वाला अपूर्ण वाक्य है, इसलिए अन्त में दीर्घ विराम के बजाय डैश रखा गया है। ‘प्रजा’, ‘विरासत’, ‘राजसत्ता’ और ‘याजकपद’ साधारण पाठकों के लिए समझने योग्य रहते हुए मूल की औपचारिक सूची को बनाए रखते हैं।
