  yaml_path: translation/deuterocanon/2_maccabees/002/035.yaml
  text: And then the Lord will reveal these things[a], and the glory of the Lord and the cloud will appear, as it was shown in the case of Moses, and as Solomon also asked[d][c][b], that the place might be greatly sanctified.
translation:
  language: hi
  text: और तब प्रभु इन बातों को प्रकट करेगा[a], और प्रभु की महिमा तथा वह बादल दिखाई देंगे[b], जिस प्रकार मूसा के संबंध में प्रकट किया गया था[c], और जिस प्रकार सुलैमान ने भी विनती की थी कि वह स्थान अत्यन्त पवित्र किया जाए[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रकट करेगा’ का अनुवाद ‘सामने लाएगा’ या ‘ज्ञात कराएगा’ भी हो सकता है। यूनानी क्रिया छिपी बात को प्रकाश में लाने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: ‘वह बादल’ संभवतः मूसा और पवित्रस्थान की परम्पराओं से जुड़ी ईश्वरीय उपस्थिति के परिचित बादल की ओर संकेत करता है।
    reason: cross_reference
  - marker: c
    text: इसका अनुवाद ‘जिस प्रकार मूसा के साथ प्रकट किया गया था’ भी हो सकता है। यूनानी वाक्य भविष्य के इस प्रकटन की तुलना मूसा से जुड़े पहले प्रकटन से करता है।
    reason: lexical_alternative
  - marker: d
    text: ‘विनती की थी’ का अनुवाद ‘प्रार्थना की थी’ भी हो सकता है। यूनानी पद यहाँ किसी निवेदन या याचना का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναδείξει
  choice: प्रकट करेगा
  rationale: क्रिया का अर्थ छिपी हुई बातों को सामने लाना या प्रकट करना है। यह सहज हिन्दी है और प्रकट करने की विधि को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ταῦτα
  choice: इन बातों को
  rationale: संकेतवाचक पद का स्पष्ट अनुवाद है और पूर्ववर्ती प्रसंग में उल्लिखित वस्तुओं या बातों की पहचान को खुला रखता है।
- source_word: ὀφθήσεται
  choice: दिखाई देंगे
  rationale: यूनानी कर्मवाच्य रूप यहाँ प्रकट होने या दृश्य होने का भाव देता है। संयुक्त कर्ता ‘महिमा तथा वह बादल’ के कारण हिन्दी में बहुवचन रखा गया है।
- source_word: δόξα
  choice: महिमा
  rationale: ईश्वरीय प्रकटन के प्रसंग में यह प्रचलित और अर्थपूर्ण बाइबलीय शब्द है।
- source_word: νεφέλη
  choice: वह बादल
  rationale: यूनानी निश्चित उपपद किसी परिचित ईश्वरीय उपस्थिति वाले बादल की ओर संकेत करता है; ‘वह’ इस विशिष्टता को बनाए रखता है।
- source_word: ἐπὶ Μωσῇ
  choice: मूसा के समय
  rationale: यह वाक्यांश मूसा से जुड़े पूर्व उदाहरण की ओर संकेत करता है; ‘मूसा के समय’ प्राकृतिक हिन्दी में उस ऐतिहासिक तुलना को व्यक्त करता है।
- source_word: ἐδηλοῦτο
  choice: प्रकट हुआ था
  rationale: अपूर्ण भूतकालीन कर्मवाच्य पहले हुए प्रकटन को दर्शाता है। हिन्दी में यह रूप संदर्भानुकूल और स्वाभाविक है।
- source_word: ἠξίωσεν
  choice: विनती की थी
  rationale: प्रसंग में सुलैमान पवित्र स्थान के विषय में निवेदन करता है। ‘विनती’ याचना का भाव रखता है, पर इसे अनिवार्य रूप से औपचारिक ‘प्रार्थना’ नहीं बनाता।
- source_word: ὁ τόπος
  choice: वह स्थान
  rationale: मूल पाठ की सामान्य अभिव्यक्ति को बनाए रखता है और प्रसंग को यह निर्धारित करने देता है कि आशय मंदिर-स्थान से है।
- source_word: καταγιασθῇ
  choice: पवित्र किया जाए
  rationale: क्रिया किसी वस्तु या स्थान को पवित्र ठहराने अथवा समर्पित करने का अर्थ देती है। यह सामान्य पाठक के लिए ‘पवित्रीकृत’ से अधिक स्पष्ट है।
- source_word: μεγάλως
  choice: अत्यन्त
  rationale: यह पवित्र किए जाने की तीव्रता को व्यक्त करता है और शाब्दिक किंतु असहज ‘महान रूप से’ से बचता है।
theological_decisions:
- issue: ईश्वरीय उपाधि κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: यूनानी पाठ में κύριος है; ‘प्रभु’ उसके लिए स्वाभाविक बाइबलीय हिन्दी है और पीछे संभावित इब्रानी नाम का अनुमान लगाकर पाठ को नहीं बदलता।
- issue: मूसा और सुलैमान से जुड़ी ईश्वरीय उपस्थिति
  choice: ऐतिहासिक-ईशप्रकटन संबंध को बिना विस्तार के बनाए रखना
  alternative: बादल या महिमा की बाद की धर्मवैज्ञानिक पहचान स्पष्ट करना
  rationale: मूल पाठ भविष्य के प्रकटन की तुलना मूसा और सुलैमान से जुड़े प्रसंगों से करता है। अनुवाद इसी संबंध को रखता है, पर उससे आगे कोई संप्रदायगत व्याख्या नहीं जोड़ता।
- issue: ἠξίωσεν में याचना का स्वरूप
  choice: विनती की थी
  alternative: प्रार्थना की थी / माँगा था
  rationale: प्रसंग धार्मिक याचना का है, किंतु यूनानी क्रिया स्वयं केवल ‘प्रार्थना करना’ तक सीमित नहीं है। ‘विनती’ दोनों पक्षों को संतुलित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘महिमा’, ‘प्रभु’ और ‘पवित्र’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; अत्यधिक संस्कृतनिष्ठ ‘पवित्रीकृत’ तथा अनावश्यक व्याख्यात्मक विस्तार से बचा गया है।
