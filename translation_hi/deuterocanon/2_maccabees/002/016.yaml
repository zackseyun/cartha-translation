translation:
  language: hi
  text: एकमात्र प्रदाता,[a] एकमात्र धर्मी, सर्वशक्तिमान और सनातन, जो इस्राएल को हर बुराई से बचाता है,[b] जिसने पूर्वजों को चुना और उन्हें पवित्र किया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाता” अथवा “उपकारकर्ता।”
    reason: lexical_alternative
  - marker: b
    text: “हर बुराई से” का अनुवाद “हर हानि से” अथवा “हर विपत्ति से” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “उन्हें अपने लिए अलग किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  choice: एकमात्र
  rationale: दोहराव सहित परमेश्वर की अद्वितीयता पर दिए गए यूनानी बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: χορηγός
  choice: दाता
  rationale: आवश्यक वस्तुएँ उपलब्ध कराने वाले के अर्थ को संक्षिप्त, गरिमापूर्ण दैवी उपाधि के रूप में व्यक्त करता है; 'प्रदाता' भी संभव है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: नैतिक और न्यायसंगत दोनों अर्थ-छायाओं वाली प्रचलित बाइबलीय हिन्दी है और यहाँ संज्ञात्मक दैवी विशेषण के रूप में स्वाभाविक है।
- source_word: παντοκράτωρ
  choice: सर्वशक्तिमान
  rationale: इस स्थापित दैवी उपाधि का अर्थ और गरिमा स्पष्ट रूप से व्यक्त करता है।
- source_word: αἰώνιος
  choice: सनातन
  rationale: दैवी गुणों की इस गंभीर शृंखला में अनादि-अनंत स्थायित्व को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διασώζων
  choice: बचाता है
  rationale: संकट या विनाश से सुरक्षित निकालने के सक्रिय अर्थ को सरल आधुनिक हिन्दी में रखता है।
- source_word: ἐκ παντὸς κακοῦ
  choice: हर बुराई से
  rationale: κακόν के व्यापक अर्थ को नैतिक बुराई तक सीमित किए बिना हिन्दी में बनाए रखता है; हानि या विपत्ति भी संदर्भानुसार संभव हैं।
- source_word: τοὺς πατέρας
  choice: पूर्वजों
  rationale: यहाँ इस्राएल के पुरखों/पितरों के सामूहिक संदर्भ को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: ποιήσας ... ἐκλεκτούς
  choice: चुना
  rationale: शाब्दिक 'चुना हुआ बनाया' हिन्दी में असहज है; 'चुना' यूनानी परिणामी भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡγίασας
  choice: पवित्र किया
  rationale: पवित्र बनाने अथवा अपने लिए अलग करने का अर्थ सीधे और समझने योग्य ढंग से देता है।
theological_decisions:
- issue: दैवी उपाधियों की शृंखला
  choice: खंड को 'एकमात्र दाता, एकमात्र धर्मी, सर्वशक्तिमान और सनातन' जैसी समानाधिकरण उपाधियों के रूप में रखा गया है।
  alternative: 'इसे पूर्ण वाक्यों में खोला जा सकता है: ''वही एकमात्र दाता है; वही धर्मी, सर्वशक्तिमान और सनातन है।'''
  rationale: मूल यूनानी में निश्चित उपपद के साथ उपाधियों और कृदंतों की शृंखला है। खंडात्मक संरचना उसके प्रार्थनात्मक/स्तुतिपरक स्वर और संभावित पूर्ववर्ती वाक्य से संबंध को सुरक्षित रखती है।
- issue: ποιήσας τοὺς πατέρας ἐκλεκτούς का अर्थ
  choice: ‘जिसने पूर्वजों को चुना’
  alternative: ‘जिसने पूर्वजों को चुने हुए बनाया’ अथवा ‘चुने हुए ठहराया’
  rationale: मूल की रचना में 'बनाया' है, पर हिन्दी में उसका शाब्दिक रूप कृत्रिम है। 'चुना' चयन के अर्थ को रखता है और किसी विशेष मतगत व्याख्या को नहीं जोड़ता।
- issue: ἡγίασας का धार्मिक आशय
  choice: ‘उन्हें पवित्र किया’
  alternative: ‘उन्हें अपने लिए अलग किया’ अथवा ‘उनका अभिषेक किया’
  rationale: ‘पवित्र किया’ क्रिया के व्यापक धार्मिक अर्थ को बनाए रखती है; ‘अभिषेक’ अनावश्यक रूप से किसी विशिष्ट अनुष्ठान का संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्तुतिपरक शैली रखी गई है। यूनानी पाठ के खंडात्मक स्वर को पूर्ण स्वतंत्र वाक्य बनाकर नहीं बदला गया। ‘दाता’, ‘धर्मी’, ‘सर्वशक्तिमान’ और ‘सनातन’ सामान्य पाठक के लिए बोधगम्य रहते हुए धार्मिक गंभीरता बनाए रखते हैं।
