  text: Therefore[a], if you have need, send those who will bring them to you.
translation:
  language: hi
  text: इसलिए[a], यदि आपको उनकी आवश्यकता हो, तो उन लोगों को भेजें जो उन्हें आपके पास ले आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘यदि’ (ἐὰν ... ἐὰν) दो बार आया है; सम्भवतः यह पाठगत अनियमितता या नकल करते समय हुई पुनरावृत्ति है। अनुवाद में अभिप्रेत अर्थ दिया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν ... χρείαν ἔχητε
  choice: यदि आपको उनकी आवश्यकता हो
  rationale: χρείαν ἔχειν का अर्थ ‘आवश्यकता होना’ है। प्रसंग में निहित वस्तु के लिए ‘उनकी’ जोड़ा गया है, जिससे आधुनिक हिन्दी में वाक्य स्वाभाविक और स्पष्ट रहता है।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν पिछले कथन से निकलने वाले निष्कर्ष अथवा संक्रमण को सूचित करता है; ‘इसलिए’ उस संबंध को संक्षेप में बनाए रखता है।
- source_word: τοὺς ἀποκομιούντας
  choice: उन लोगों को ... जो उन्हें आपके पास ले आएँगे
  rationale: ἀποκομίζω यहाँ वस्तुओं को एक स्थान से प्राप्तकर्ताओं तक पहुँचाने का भाव देता है। यूनानी में कर्म निहित है; प्रसंगगत लेखों के लिए हिन्दी में ‘उन्हें’ आवश्यक है।
- source_word: ὑμῖν
  choice: आपके पास
  rationale: पहुँचाने या ले आने की क्रिया के साथ यह दत्तिव हिन्दी में स्वाभाविक रूप से ‘आपके पास’ व्यक्त होता है।
- source_word: ἀποστείλατε
  choice: भेजें
  rationale: अओरिस्ट आज्ञार्थक सीधी कार्रवाई का अनुरोध करता है; आदरसूचक बहुवचन ‘भेजें’ पत्रात्मक संदर्भ के अनुकूल है।
- source_word: ἐὰν οὖν ἐὰν
  choice: इसलिए, यदि
  rationale: प्राप्त यूनानी पाठ में ἐὰν दो बार है। अर्थ स्पष्ट होने के कारण हिन्दी में शर्तसूचक शब्द एक बार रखा गया है और पाठगत अनियमितता पादटिप्पणी में बताई गई है।
