- source_word: ἐκ μεγάλων κινδύνων
  choice: बड़े-बड़े संकटों से
  rationale: ἐκ के साथ बहुवचन κινδύνων अनेक गंभीर संकटों से निकल बचने का भाव देता है; ‘बड़े-बड़े संकटों से’ आधुनिक हिन्दी में स्वाभाविक रूप से बहुवचन और तीव्रता दोनों व्यक्त करता है।
