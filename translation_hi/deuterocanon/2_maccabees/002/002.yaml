  choice: परमेश्वर द्वारा
  rationale: सम्बन्धकारक के साथ ὑπό बचाने वाले कर्ता को प्रकट करता है; ‘परमेश्वर द्वारा’ इस कर्तृवाचक बल को स्पष्ट रखता है।
- source_word: σεσωσμένοι
  choice: बचाए गए होने के कारण
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त एक सम्पन्न उद्धार और उसके वर्तमान परिणाम को दर्शाता है; यह हिन्दी रूप मुख्य क्रिया से उसका परिस्थितिजन्य सम्बन्ध भी बनाए रखता है।
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: हम उसका अत्यन्त धन्यवाद करते हैं
  rationale: ‘अत्यन्त’ μεγάλως की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘उसका धन्यवाद करते हैं’ αὐτῷ के दत्तिवाचक सम्बन्ध को सहज ढंग से प्रस्तुत करता है।
- source_word: ὡς ἂν
  choice: मानो
  rationale: यह संक्षिप्त तुलना और सम्भावनात्मक रंग को हिन्दी में स्वाभाविक रूप से बनाए रखता है, बिना उसे निश्चित ऐतिहासिक कथन बनाए।
- source_word: πρὸς βασιλέα
  choice: किसी राजा के विरुद्ध
  rationale: παρατάσσομαι के सैनिक प्रसंग में πρός का सबसे सम्भावित अर्थ विरोधात्मक है; अनिश्चित βασιλέα के लिए ‘किसी राजा’ उपयुक्त है।
- source_word: παρατασσόμενοι
  choice: युद्ध के लिए पंक्तिबद्ध हों
  rationale: यह कृदन्त युद्ध-विन्यास में खड़े किए जाने या खड़े होने की सैनिक छवि को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: अन्तिम उपवाक्य की सैनिक तुलना
  choice: मानो किसी राजा के विरुद्ध युद्ध के लिए पंक्तिबद्ध हों
  alternative: मानो किसी राजा के विरुद्ध मोर्चा बाँधे खड़े हों; अथवा किसी राजा के सामने पंक्तिबद्ध हों
  rationale: παρατασσόμενοι स्पष्टतः युद्ध-विन्यास की छवि रखता है और πρός यहाँ सम्भवतः विरोध दर्शाता है। फिर भी यूनानी वाक्य संक्षिप्त है, इसलिए वैकल्पिक सैनिक सूक्ष्मता को पादटिप्पणी में रखा गया है, मुख्य पाठ में निश्चित व्याख्या के रूप में नहीं जोड़ा गया।
