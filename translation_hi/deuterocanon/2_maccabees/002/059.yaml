  yaml_path: translation/deuterocanon/2_maccabees/002/059.yaml
  text: Therefore let us begin the narrative from this point[a], adding only this much to what has been said before; for it is foolish to be excessive before the history[b], but to abridge the history itself.
translation:
  language: hi
  text: इसलिए हम यहीं से वर्णन आरम्भ करें[a] और पहले कही गई बातों में केवल इतना ही जोड़ें; क्योंकि इतिहास से पहले बहुत विस्तार करना, पर इतिहास को ही संक्षिप्त कर देना मूर्खता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वर्णन’ के स्थान पर ‘वृत्तांत’ भी सम्भव है; यूनानी διήγησις किसी सुनाए या लिखे गए विवरण को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘भूमिका में बहुत अधिक कहना, पर इतिहास को ही छोटा कर देना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: इसलिए अब हम यहीं से
  rationale: οὖν का निष्कर्षात्मक-संक्रमणकारी बल ‘इसलिए’ से और Ἐντεῦθεν का प्रवचन में मुख्य वृत्तांत की ओर संकेत ‘यहीं से’ द्वारा स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ἀρξώμεθα
  choice: आरम्भ करें
  rationale: प्रथम पुरुष बहुवचन का प्रेरणार्थक subjunctive है; ‘हम ... आरम्भ करें’ लेखक के आमंत्रणात्मक संक्रमण को बनाए रखता है।
- source_word: τῆς διηγήσεως
  choice: वर्णन
  rationale: यह आगे प्रस्तुत किए जाने वाले क्रमबद्ध लिखित वृत्तांत को सूचित करता है। ‘वर्णन’ आधुनिक हिन्दी में स्वाभाविक है और ‘कहानी’ की काल्पनिक ध्वनि से बचता है।
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: पहले कही गई बातों में केवल इतना ही जोड़ें
  rationale: यह पूर्ववर्ती कथनों के साथ एक सीमित अतिरिक्त टिप्पणी जोड़ने का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: εὔηθες
  choice: मूर्खता
  rationale: सन्दर्भ में यह साहित्यिक रीति को अविवेकी या अनुपयुक्त ठहराता है; ‘मूर्खता’ उसके स्पष्ट आलोचनात्मक बल को बनाए रखता है।
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: इतिहास से पहले बहुत विस्तार करना
  rationale: πλεονάζειν यहाँ भूमिका में आवश्यकता से अधिक कहने को दर्शाता है। ‘बहुत विस्तार करना’ हिन्दी में स्वाभाविक है और मुख्य इतिहास के संक्षेपण के साथ विरोध को बनाए रखता है।
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: इतिहास को ही संक्षिप्त कर देना
  rationale: ἐπιτέμνειν का अर्थ काटकर छोटा या संक्षिप्त करना है। ‘ही’ μὲν...δὲ के व्यंग्यात्मक विरोध को हिन्दी में उभारता है।
