  choice: छत की छिपी हुई खिड़की
  rationale: κρυπτήν का अर्थ छिपी या गुप्त है, जबकि दुर्लभ φατίνωμα सम्भवतः पटी हुई अथवा खानेदार छत को सूचित करता है। θύρα सामान्यतः द्वार है, पर छत में पत्थर फेंकने के प्रसंग में ‘खिड़की’ हिन्दी में ऊपर के छिपे खुलने योग्य मार्ग को स्वाभाविक रूप से व्यक्त करती है; अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: βάλλοντες πέτρους
  choice: उन्होंने पत्थर फेंके
  rationale: यह कृदंतीय पद आक्रमण का साधन बताता है; हिन्दी में सीमित क्रिया अधिक स्पष्ट और स्वाभाविक है।
- source_word: συνεκεραύνωσαν
  choice: बुरी तरह मार गिराया
  rationale: दुर्लभ और अत्यन्त प्रबल क्रिया में वज्राघात-जैसे कुचल देने वाले प्रहार की छवि है। ‘बुरी तरह मार गिराया’ परिणाम और तीव्रता दोनों को सामान्य आधुनिक हिन्दी में व्यक्त करता है, जबकि विशेष बिंब पाद-टिप्पणी में सुरक्षित है।
- source_word: τὸν ἡγεμόνα
  choice: अगुआ
  rationale: ἡγεμών शासक, अधिकारी, सेनापति या नेता हो सकता है। निकटवर्ती यूनानी पाठ कोई निश्चित पद नहीं बताता, इसलिए व्यापक और प्रसंगानुकूल ‘अगुआ’ चुना गया है।
- source_word: μέλη ποιήσαντες
  choice: उसके टुकड़े-टुकड़े करके
  rationale: शाब्दिक रूप से ‘अंग बना देने’ वाला यह मुहावरा शरीर के अंग-भंग किए जाने को बताता है। एकवचन अगुआ निकटतम व्यक्त लक्ष्य है, इसलिए हिन्दी में ‘उसके’ स्वाभाविक है; फिर भी आगे ‘सिर’ का बहुवचन पाठगत असंगति के रूप में पाद-टिप्पणी में सुरक्षित है।
- source_word: τὰς κεφαλάς
  choice: सिर
  rationale: यूनानी रूप स्पष्टतः बहुवचन है। हिन्दी में ‘सिर’ का रूप एकवचन और बहुवचन दोनों में समान रहता है, इसलिए उसकी संख्या मुख्य वाक्य में जानबूझकर अस्पष्ट रह सकती थी; पाद-टिप्पणी स्पष्ट करती है कि मूल पाठ बहुवचन है।
- source_word: τοῖς ἔξω
  choice: बाहर खड़े लोगों के पास
  rationale: संज्ञीकृत विशेषण व्यक्तियों को सूचित करता है, केवल स्थान को नहीं। ‘बाहर खड़े लोगों’ से यह अर्थ हिन्दी में स्पष्ट होता है।
