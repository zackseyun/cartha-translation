  text: After opening the secret door in the ceiling[a], they threw stones and struck down the leader, and after cutting them into pieces[c][b], they threw the heads to those outside.
translation:
  language: hi
  text: छत के गुप्त द्वार[a] को खोलकर उन्होंने पत्थर फेंके और नेता को बुरी तरह मार गिराया[b]। फिर उसके टुकड़े-टुकड़े करके उन्होंने सिरों को बाहर वालों के पास फेंक दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी शब्द φατίνωμα दुर्लभ है और उसका अर्थ अनिश्चित है; सम्भवतः यह छत, छत की पटरियों, या किसी ऊपरी/छत वाले भाग को सूचित करता है। इसलिए ‘छत के गुप्त द्वार’ का स्थापत्य-संबंधी अर्थ निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘बुरी तरह मार गिराया’ के लिए प्रयुक्त यूनानी क्रिया अत्यन्त प्रबल और असामान्य है; उसमें मानो वज्राघात से कुचल देने या धराशायी करने की छवि है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पाठ में ‘सिर’ बहुवचन है, यद्यपि इससे पहले केवल एक नेता का उल्लेख हुआ है। यह पाठ या वर्णन की असंगति हो सकती है; अनुवाद ने मूल के बहुवचन को बनाए रखा है।
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: खोलकर
  rationale: अओरिस्ट कृदंत मुख्य क्रियाओं से पहले हुई कार्रवाई बताता है; ‘खोलकर’ हिन्दी में क्रम को सहज रूप से व्यक्त करता है।
