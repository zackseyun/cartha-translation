base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/037.yaml
  text: Just as Moses prayed to the Lord[a], and fire came down from heaven and consumed the things of the sacrifice, so also Solomon prayed to the Lord[b], and the fire came down and consumed the whole burnt offerings.
translation:
  language: hi
  text: जैसे मूसा ने प्रभु से प्रार्थना की और आकाश से आग उतरी और बलि से संबंधित वस्तुओं[a] को भस्म कर दिया, वैसे ही सुलैमान ने प्रभु से प्रार्थना की और आग उतरी और उसने संपूर्ण होमबलियों[b] को भस्म कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से व्यापक अभिव्यक्ति ‘बलि की वस्तुएँ’ है; इसका आशय बलि से जुड़ी सामग्री या चढ़ावे हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘संपूर्ण होमबलियाँ’ के लिए प्रयुक्त यूनानी शब्द विशेष रूप से ऐसी भेंटों को सूचित करता है जो पूरी तरह जला दी जाती थीं; इसका अनुवाद ‘होमबलियाँ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσηύξατο πρὸς Κύριον
  choice: प्रभु से प्रार्थना की
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ढंग से प्रार्थना की दिशा और सम्बोधन व्यक्त करता है। Κύριον का अनुवाद ‘प्रभु’ किया गया है, क्योंकि यूनानी पाठ में यही पद है, स्वयं इब्रानी परमेश्वर-नाम नहीं।
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: आकाश से आग उतरी
  rationale: यूनानी की सजीव कथात्मक गति और आग के ऊपर से नीचे आने का भाव सहज हिन्दी में सुरक्षित रहता है।
- source_word: τὰ τῆς θυσίας
  choice: बलि की सामग्री
  rationale: यह व्यापक यूनानी अभिव्यक्ति बलि से सम्बद्ध वस्तुओं या चढ़ावे की सामग्री को सूचित कर सकती है; केवल ‘बलि’ कहने से उसका बहुवस्तुगत भाव दब जाता।
- source_word: ἐδαπάνησεν / ἀνήλωσεν
  choice: भस्म कर दिया
  rationale: बलि पर पड़ने वाली आग के प्रसंग में दोनों क्रियाओं का स्वाभाविक हिन्दी समतुल्य ‘भस्म कर दिया’ है; एक ही अभिव्यक्ति पद के समानांतर ढाँचे को भी बनाए रखती है।
- source_word: καταβῆναι τὸ πῦρ
  choice: आग ने उतरकर
  rationale: प्रेषित यूनानी वाक्यांश व्याकरण की दृष्टि से संक्षिप्त और कुछ कठिन है। ‘आग ने उतरकर’ उतरने तथा भस्म करने—दोनों क्रियाओं का सीधा क्रम बनाए रखता है, बिना अनावश्यक रूप से ‘आकाश से’ दोहराए।
- source_word: ὁλοκαυτώματα
  choice: पूर्ण होमबलियों
  rationale: यह पद उन बलियों के लिए है जो पूरी तरह आग में जलाई जाती थीं। ‘पूर्ण होमबलि’ उस विशिष्ट धार्मिक अर्थ को केवल ‘होमबलि’ से अधिक स्पष्ट रूप में सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएल के परमेश्वर के लिए Κύριον का अनुवाद
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: मूल यूनानी साक्ष्य Κύριον कहता है। ‘यहोवा’ करने से यूनानी पाठ में प्रत्यक्ष रूप से उपस्थित न होने वाला इब्रानी परमेश्वर-नाम आयात हो जाता; ‘प्रभु’ स्रोत के सबसे निकट है।
- issue: ὁλοκαυτώματα की बलिदानी विशिष्टता
  choice: पूर्ण होमबलियाँ
  alternative: होमबलियाँ / बलियाँ
  rationale: यूनानी पद ऐसी भेंटों को निर्दिष्ट करता है जो पूर्णतः जला दी जाती थीं। ‘पूर्ण’ रखने से इस धार्मिक अर्थ को सपाट किए बिना स्पष्ट किया जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूसा और सुलैमान के प्रसंगों का समानांतर ढाँचा सुरक्षित है। ‘बलि की सामग्री’ स्रोत की व्यापकता को पठनीय हिन्दी में व्यक्त करता है, जबकि ‘पूर्ण होमबलियाँ’ तकनीकी धार्मिक अर्थ को स्पष्ट रखता है।
