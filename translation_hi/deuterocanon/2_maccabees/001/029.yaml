    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  choice: रोप दे
  rationale: यह καταφυτεύω का आदेशवाचक रूप है, जिसका मूल चित्र किसी को पौधे की तरह रोपकर स्थिर बसाने का है। ‘रोप दे’ उस सजीव रूपक को बनाए रखता है; ‘स्थिर बसा दे’ संदर्भगत अर्थ है।
- source_word: τὸν λαόν σου
  choice: अपने लोगों को
  rationale: λαός यहाँ परमेश्वर से संबद्ध सामुदायिक जनसमूह को दर्शाता है। आधुनिक हिन्दी में ‘अपने लोगों’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: अपने पवित्र स्थान में
  rationale: τόπος का सामान्य अर्थ ‘स्थान’ है और ἅγιος उसे ‘पवित्र’ बताता है। ‘पवित्र स्थान’ मूल की व्यापकता बनाए रखता है तथा उसे मंदिर, पवित्रस्थान या देश के रूप में अनावश्यक रूप से सीमित नहीं करता। εἰς को यहाँ गंतव्य और स्थापन के परिणाम के अनुसार ‘में’ कहना स्वाभाविक है।
- source_word: καθὼς εἶπεν Μωσῆς
  choice: ठीक जैसा मूसा ने कहा था
  rationale: καθώς अनुरूपता व्यक्त करता है और εἶπεν साधारण भूतकाल है। ‘ठीक जैसा मूसा ने कहा था’ प्रार्थना में मूसा के कथन की ओर संकेत को स्पष्ट और सहज रूप में रखता है।
theological_decisions:
- issue: ‘अपने पवित्र स्थान’ का अभिप्रेत संदर्भ
  choice: व्यापक ‘अपने पवित्र स्थान’ रखा गया
  alternative: अपनी पवित्र भूमि; अपने पवित्रस्थान; अपने मंदिर में
  rationale: यूनानी पाठ केवल τόπος (‘स्थान’) कहता है और इस पद में मंदिर, पवित्रस्थान या भूमि को स्पष्ट नहीं करता। व्यापक अभिव्यक्ति मूल की अस्पष्टता बनाए रखती है और कोई अतिरिक्त भौगोलिक या धर्मवैज्ञानिक पहचान आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। ‘रोप दे’ जानबूझकर चुना गया सजीव रूपक है; अर्थ स्पष्ट करने के लिए अधिक सामान्य विकल्प पादटिप्पणी में दिया गया है।
