lexical_decisions:
- source_word: Καὶ νῦν
  choice: और अब
  rationale: यह सहज काल-सूचक संक्रमण है; ‘और’ καί को तथा ‘अब’ νῦν के वर्तमान-कालिक भाव को बनाए रखता है।
- source_word: ὧδε
  choice: यहाँ
  rationale: इस संदर्भ में ὧδε स्थान-सूचक क्रियाविशेषण है; ‘यहाँ’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: ἐσμεν
  choice: हम ... हैं
  rationale: साधारण अस्तित्ववाचक क्रिया को बिना अतिरिक्त अर्थ जोड़े हिन्दी की वर्तमान-कालिक रचना में रखा गया है।
- source_word: προσευχόμενοι
  choice: प्रार्थना कर रहे
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ चल रही निरंतर क्रिया व्यक्त करता है; हिन्दी में ‘प्रार्थना कर रहे हैं’ इसे स्वाभाविक रूप से दर्शाता है।
- source_word: περὶ ὑμῶν
  choice: आपके लिए
  rationale: प्रार्थना के संदर्भ में περί + संबंधकारक का स्वाभाविक हिन्दी अर्थ ‘आपके लिए’ है; यह ‘आपकी ओर से’ जैसे अधिक व्याख्यात्मक रूप से बचता है।
