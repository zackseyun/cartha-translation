  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। असामान्य ‘गाढ़ा पानी’ तथा बलि-सामग्री के व्यापक उल्लेख को स्पष्ट करने के बजाय मूल की अस्पष्टता और कथात्मक तनाव सुरक्षित रखा गया है।
