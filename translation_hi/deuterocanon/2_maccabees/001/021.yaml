  yaml_path: translation/deuterocanon/2_maccabees/001/021.yaml
  text: When they reported to us that they had found no fire[a], but thick water, he ordered them to draw some out and bring it. Then, when the things for the sacrifices had been brought forward[b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid on it.
translation:
  language: hi
  text: जब उन्होंने हमें साफ़-साफ़ बताया कि उन्हें आग नहीं, बल्कि गाढ़ा पानी[a] मिला था, तब उसने उन्हें उसमें से कुछ निकालकर लाने की आज्ञा दी। फिर जब बलियों की सामग्री[b] सामने लाई गई, तो नहेम्याह ने याजकों को आज्ञा दी कि वे उस पानी को लकड़ियों और उन पर रखी हुई वस्तुओं—दोनों पर छिड़कें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घना पानी” अथवा “गाढ़ा तरल।” यूनानी अभिव्यक्ति असामान्य है; कथा में इस पदार्थ के अप्रत्याशित स्वरूप के महत्त्व के कारण इसका अनुवाद काफ़ी शाब्दिक रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “बलियों की वस्तुएँ” है—अर्थात बलि से संबंधित सामग्री या वस्तुएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσάφησαν
  choice: साफ-साफ बताया
  rationale: क्रिया में बात को स्पष्ट करने या साफ तौर पर सूचना देने का भाव है; यह हिन्दी में स्वाभाविक रहते हुए उस बल को व्यक्त करता है।
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: उन्हें आग नहीं, बल्कि गाढ़ा पानी मिला है
  rationale: यूनानी वाक्यांश का असामान्य वर्णन बनाए रखा गया है, क्योंकि कथा में इस पदार्थ का अप्रत्याशित स्वरूप महत्त्वपूर्ण है।
- source_word: ἀποβλίψαντας
  choice: उसमें से कुछ निकालकर
  rationale: संदर्भ किसी गड्ढे या भंडार से उस तरल का कुछ भाग निकालने का संकेत देता है; यह चयन स्वाभाविक है और क्रिया को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: बलियों की सामग्री सामने लाई गई
  rationale: यूनानी पदबंध संक्षिप्त और व्यापक है। ‘सामग्री’ बलियों से संबंधित वस्तुओं को दर्शाता है, बिना यह मान लिए कि बलिदान पहले ही चढ़ाया जा चुका था।
- source_word: ἐπιρᾶναι
  choice: छिड़कें
  rationale: इस अनुष्ठानिक संदर्भ में क्रिया का अर्थ तरल को वस्तुओं पर डालने या छिड़कने से है; ‘छिड़कें’ सहज और उपयुक्त है।
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: लकड़ियों और उन पर रखी हुई वस्तुओं—दोनों पर
  rationale: यह लकड़ियों तथा उनके ऊपर रखी चीज़ों, संभवतः बलि के अंशों, दोनों को स्पष्ट करता है और मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: Νεεμίας नाम की पहचान
  choice: नहेमायाह
  alternative: नहेमिया
  rationale: ‘नहेमायाह’ हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला मानक नाम है; यह अनुवाद किसी अतिरिक्त ऐतिहासिक या सिद्धान्तगत पहचान का दावा नहीं करता।
