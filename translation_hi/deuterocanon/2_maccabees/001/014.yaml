  yaml_path: translation/deuterocanon/2_maccabees/001/014.yaml
  text: For when Antiochus and his friends with him arrived at the place as though to marry her[a], in order to get the money in large amount as a dowry payment,
translation:
  language: hi
  text: क्योंकि अन्तियोकुस अपने साथ के मित्रों के साथ उस स्थान पर ऐसे पहुँचा मानो वह उससे विवाह करने जा रहा हो,[a] ताकि दहेज के मद में बड़ी रकम पा सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो वह उसके साथ रहने जा रहा हो।” यूनानी शब्द का अर्थ साथ रहना या विवाह करना, दोनों हो सकता है; यहाँ संभवतः देवी से विवाह के बहाने मंदिर का धन लेने की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: मानो वह उससे विवाह करने वाला हो
  rationale: συνοικέω का अर्थ किसी के साथ रहना या वैवाहिक संबंध में प्रवेश करना हो सकता है। ὡς के साथ यहाँ दिखावे या कथित उद्देश्य का भाव है; प्रसंग में विवाह का आशय सबसे स्वाभाविक है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: παρεγένετο εἰς τὸν τόπον
  choice: उस स्थान पर ... पहुँचे
  rationale: आगमन की सीधी कथात्मक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है। यूनानी क्रिया एकवचन है, पर संयुक्त कर्ता अन्तियोकुस और उसके मित्र हैं; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: ὅ τε Ἀντίοχος καὶ οἱ σὺν αὐτῷ φίλοι
  choice: अन्तियोकुस और उसके साथ आए मित्र
  rationale: φίλοι का मूल अर्थ ‘मित्र’ रखा गया है; यह राजकीय साथियों या अधिकारियों का संकेत भी दे सकता है, पर पाठ इसे स्पष्ट नहीं करता।
- source_word: χάριν τοῦ λαβεῖν
  choice: ताकि ... ले सकें
  rationale: यह रचना उद्देश्य व्यक्त करती है; हिन्दी में ‘ताकि’ उसका स्पष्ट और सहज रूप है।
- source_word: τὰ χρήματα πλείονα
  choice: बहुत-सा धन
  rationale: πλείονα में अधिकता या बड़ी मात्रा का भाव है। ‘बहुत-सा धन’ प्रसंगानुकूल मात्रात्मक अर्थ देता है, बिना किसी अनुल्लिखित तुलना को निश्चित किए।
- source_word: εἰς φερνῆς λόγον
  choice: दहेज के रूप में
  rationale: φερνή ‘दहेज’ है और εἰς ... λόγον यहाँ किसी मद, हिसाब या हैसियत के रूप में लेने का भाव देता है।
theological_decisions:
- issue: स्त्रीलिंग सर्वनाम αὐτῇ का संदर्भ और कथित विवाह
  choice: ‘उससे विवाह’ कहा गया और दिखावे का भाव ‘मानो’ से सुरक्षित रखा गया
  alternative: ‘उसके साथ रहने’ या देवी का नाम स्पष्ट रूप से जोड़ना
  rationale: इस पद में स्त्री का नाम नहीं दोहराया गया है; इसलिए सर्वनाम को सर्वनाम ही रखा गया। συνοικέω की वैवाहिक और साथ रहने की दोनों संभावनाओं में से प्रसंगानुकूल वैवाहिक अर्थ मुख्य पाठ में है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, सहज और गरिमापूर्ण शैली। ‘दहेज के रूप में’ सामान्य पाठक के लिए मुहावरेदार है, और ‘बहुत-सा धन’ यूनानी की मात्रात्मक व्यापकता को बनाए रखता है।
