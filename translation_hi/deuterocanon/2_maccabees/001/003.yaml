  yaml_path: translation/deuterocanon/2_maccabees/001/003.yaml
  text: and may he give you a faithful heart to worship him and to do his will with a great heart and a willing soul;[a]
translation:
  language: hi
  text: और वह तुम्हें एक निष्ठावान हृदय दे, ताकि तुम उसकी उपासना करो और विशाल हृदय तथा इच्छुक आत्मा से उसकी इच्छा पूरी करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वास से भरा हृदय” अथवा “विश्वास करने वाला हृदय।” यूनानी पदबंध विश्वास या निष्ठा—दोनों पर बल दे सकता है। मुख्य पाठ में “निष्ठावान हृदय” रखा गया है, क्योंकि संदर्भ में उपासना और परमेश्वर की इच्छा पूरी करने पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοίη
  choice: वह … दे
  rationale: यह इच्छा अथवा प्रार्थना व्यक्त करने वाला optative रूप है। हिन्दी में प्रसंगानुकूल कामनार्थक वाक्य-विन्यास से इसका भाव स्वाभाविक रूप में व्यक्त होता है; कर्ता को मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: καρδίαν πίστιν
  choice: एक निष्ठावान हृदय
  rationale: यह असामान्य यूनानी पदबंध विश्वास और निष्ठा—दोनों पर बल दे सकता है। उपासना और आज्ञापालन के निकट संदर्भ में ‘निष्ठावान हृदय’ स्वाभाविक है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: σέβεσθαι
  choice: उपासना करो
  rationale: यह क्रिया श्रद्धापूर्ण धार्मिक भक्ति को व्यक्त करती है; ‘उपासना करना’ आधुनिक हिन्दी में इस संदर्भ का स्पष्ट और गरिमापूर्ण रूप है।
- source_word: τὰ θελήματα
  choice: उसकी इच्छा
  rationale: यूनानी में बहुवचन है, पर परमेश्वर की अभिलाषित बातों के सामूहिक अर्थ के लिए हिन्दी में एकवचन ‘उसकी इच्छा’ अधिक स्वाभाविक है।
- source_word: καρδίᾳ μεγάλῃ
  choice: विशाल हृदय से
  rationale: यह रूप यूनानी के ‘बड़े/महान हृदय’ के चित्र को बनाए रखता है और समर्पण की व्यापकता तथा उदारता का संकेत देता है, बिना इसे चुपचाप ‘पूरे हृदय’ में बदलने के।
- source_word: ψυχῇ βουλομένῃ
  choice: इच्छुक आत्मा से
  rationale: ‘आत्मा’ ψυχή की मानवीय आंतरिकता को बनाए रखता है और ‘इच्छुक’ स्वेच्छा तथा तत्पर अभिप्राय को व्यक्त करता है।
theological_decisions:
- issue: गैर-पौलिनी भक्तिपरक संदर्भ में πίστις-सम्बन्धी भाषा
  choice: निष्ठावान हृदय
  alternative: विश्वास से भरा हृदय; विश्वास करने वाला हृदय
  rationale: उपासना करने और परमेश्वर की इच्छा पूरी करने के निकट संदर्भ से स्थिर निष्ठा का भाव प्रमुख दिखता है। फिर भी यूनानी पदबंध विश्वास अथवा विश्वास करने पर भी बल दे सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विशाल हृदय’ मूल की रूपकात्मक भाषा को बचाता है; ‘इच्छुक आत्मा’ स्वैच्छिक तत्परता को व्यक्त करता है।
