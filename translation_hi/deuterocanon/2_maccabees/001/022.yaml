  yaml_path: translation/deuterocanon/2_maccabees/001/022.yaml
  text: And when this happened and some time had passed[a], and the sun shone out though it was clouded over, a great fire was kindled, so that everyone marveled.
translation:
  language: hi
  text: जब ऐसा हुआ और कुछ समय बीत गया, तब बादल छाए होने पर भी[a] सूरज चमक उठा और एक बड़ी आग भड़क उठी, जिससे सभी चकित रह गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब बादल छाए हुए थे।” यूनानी पदबंध ἐπινεφὴς ὤν बादलों से ढकी परिस्थिति का वर्णन करता है; मुख्य पाठ में इसे रियायती अर्थ में लिया गया है—बादल छाए होने के बावजूद सूरज चमक उठा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: जब ऐसा हुआ
  rationale: यह घटना के घटित होने के बाद का समयसूचक संक्रमण है; सहज आधुनिक हिन्दी में घटना का संकेत बनाए रखता है।
- source_word: χρόνος διῆλθεν
  choice: कुछ समय बीत गया
  rationale: अनिश्चित अवधि को बिना अनावश्यक रूप से निश्चित किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: तब ... सूरज चमक उठा
  rationale: ἀναλάμπω में अचानक या उभरकर चमकने का भाव है; ‘चमक उठा’ इसे सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐπινεφὴς ὤν
  choice: बादल छाए होने पर भी
  rationale: 'वाक्य-संदर्भ में कृदन्त पदबंध को रियायती अर्थ में लिया गया है: बादल छाए होने के बावजूद सूरज चमका। मूल में परिस्थितिजन्य अर्थ की संभावना भी बनी रहती है, इसलिए पादटिप्पणी दी गई है।'
- source_word: ἀνήφθη
  choice: भड़क उठी
  rationale: ἀνάπτω के कर्मवाच्य रूप का आशय आग के प्रज्वलित होने से है। हिन्दी में ‘आग भड़क उठी’ प्राकृतिक है और अचानक प्रज्वलन का भाव देता है।
- source_word: πυρὰ μεγάλη
  choice: एक बड़ी आग
  rationale: πυρά यहाँ अग्नि या बड़ी ज्वाला को सूचित करता है; सीधा अनुवाद घटना के असाधारण परिमाण को बनाए रखता है।
- source_word: ὥστε θαυμάσαι πάντας
  choice: जिससे सभी चकित रह गए
  rationale: परिणामसूचक रचना और πάντας की सार्वभौमिकता दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
