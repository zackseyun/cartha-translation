base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/027.yaml
  text: Gather our dispersed people[a], free those enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: hi
  text: हमारे बिखरे हुए लोगों[a] को इकट्ठा कर, राष्ट्रों के बीच दासता में पड़े लोगों को मुक्त कर, उन पर दृष्टि कर जिन्हें तुच्छ समझा गया है और जिनसे घृणा की जाती है; और राष्ट्र जान लें कि तू हमारा परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘हमारे बिखराव’ है। यहाँ आशय बिखरे हुए समुदाय से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: इकट्ठा कर
  rationale: यह आज्ञार्थक क्रिया बिखरे हुओं को एक स्थान या समुदाय में फिर से एकत्र करने की प्रार्थना व्यक्त करती है। ‘इकट्ठा कर’ स्वाभाविक हिन्दी में इसका बल स्पष्ट रखता है।
- source_word: τὴν διασπορὰν ἡμῶν
  choice: हमारे बिखरे हुए लोगों[a] को
  rationale: यूनानी में शाब्दिक अर्थ ‘हमारे बिखराव’ है, पर यहाँ भाववाचक संज्ञा बिखरे हुए समुदाय के लिए प्रयुक्त है। हिन्दी में ‘लोगों’ को स्पष्ट करना अर्थ को स्वाभाविक बनाता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ἐλευθέρωσον
  choice: स्वतंत्र कर
  rationale: क्रिया का विशिष्ट अर्थ बंधन या दासता से मुक्त करना है; इसलिए व्यापक ‘छुड़ा’ की अपेक्षा ‘स्वतंत्र कर’ चुना गया है।
- source_word: τοὺς δουλεύοντας
  choice: दासता में पड़े लोगों
  rationale: δουλεύω यहाँ केवल सेवा नहीं, पराधीनता या दासता की दशा को सूचित करता है। यह रूप उस कठोर अर्थ को बिना नरम किए सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: राष्ट्रों के बीच
  rationale: ἔθνη आसपास के अन्य जनसमूहों या राष्ट्रों को दर्शाता है। ‘राष्ट्रों’ से अर्थ बना रहता है और ‘अन्यजातियों’ जैसी परंपरा-विशिष्ट व्याख्या नहीं जुड़ती।
- source_word: τοὺς ἐξουθενημένους
  choice: जिन्हें तुच्छ समझा जाता
  rationale: पूर्ण निष्क्रिय कृदंत उन लोगों की स्थिति बताता है जिन्हें नगण्य या तिरस्कृत माना गया है। ‘तुच्छ समझा जाता’ निष्क्रिय और सामाजिक अपमान दोनों भाव रखता है।
- source_word: βδελυκτοὺς
  choice: जिनसे घृणा की जाती है
  rationale: विशेषण तीव्र घृणा या अरुचि का भाव रखता है। सन्दर्भ में यह लोगों के प्रति दूसरों के व्यवहार को दर्शाता है; हिन्दी रूप इस अर्थ को स्पष्ट करता है, पर किसी तकनीकी अनुष्ठानिक अशुद्धता को नहीं जोड़ता।
- source_word: ἔφιδε
  choice: उन पर दृष्टि कर
  rationale: प्रार्थना में यह क्रिया परमेश्वर से उनकी ओर देखने और उनका ध्यान रखने का निवेदन है। ‘दृष्टि कर’ गरिमापूर्ण है और ‘कृपा कर’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: γνώτωσαν
  choice: जान लें
  rationale: आज्ञार्थक/कामनार्थक बल राष्ट्रों के पहचान लेने की प्रार्थना व्यक्त करता है। ‘जान लें’ हिन्दी में इस बल को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: कि तू हमारा परमेश्वर है
  rationale: यह सीधा विधेयात्मक कथन है, जिसमें σύ पर बल है। हिन्दी का ‘तू’ एकवचन निकट संबोधन और निहित बल दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘हमारे बिखराव’ का अभिप्रेत संदर्भ
  choice: इसे बिखरे हुए लोगों के समुदाय के रूप में व्यक्त किया गया है।
  alternative: शाब्दिक रूप ‘हमारे बिखराव को’ या पारिभाषिक ‘हमारे डायस्पोरा को’।
  rationale: इकट्ठा किए जाने वाले व्यक्ति हैं; यूनानी भाववाचक संज्ञा समुदाय के लिए लक्षणा से प्रयुक्त हो सकती है। मुख्य पाठ में आशय स्पष्ट किया गया है और वास्तविक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: δουλεύοντας में दासता का बल
  choice: ‘दासता में पड़े लोगों’ के रूप में अनूदित किया गया है।
  alternative: ‘सेवा करने वाले लोगों’ या ‘अधीन लोगों’।
  rationale: राष्ट्रों के बीच पराधीनता के इस संदर्भ में दासत्व का अर्थ प्रमुख है। इसे सामान्य सेवा बनाना यूनानी शब्द की कठोरता को अनुचित रूप से कम कर देता।
- issue: βδελυκτούς का सामाजिक अथवा अनुष्ठानिक अर्थ
  choice: ‘जिनसे घृणा की जाती है’ के सामाजिक अर्थ में प्रस्तुत किया गया है।
  alternative: ‘घृणित’ या ‘अशुद्ध ठहराए गए’।
  rationale: मूल शब्द प्रबल घृणा व्यक्त करता है, लेकिन इस पद में कोई स्पष्ट संकेत नहीं कि तकनीकी अनुष्ठानिक अशुद्धता अभिप्रेत है। चुना गया रूप उस अतिरिक्त निष्कर्ष से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए निकट एकवचन संबोधन ‘तू’ मूल यूनानी के एकवचन σύ के अनुरूप है। वाक्य की समानांतर आज्ञार्थक संरचना और अन्तिम कामनार्थक खंड सुरक्षित रखे गए हैं।
