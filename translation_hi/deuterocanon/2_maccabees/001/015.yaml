  text: और जब ननैया के पुरोहितों ने वे वस्तुएँ सामने रखीं[a], और अंतियोकस कुछ लोगों के साथ मंदिर-परिसर के घेरे में आया, तब उसके भीतर प्रवेश करते ही उन्होंने मंदिर बंद कर दिया।
