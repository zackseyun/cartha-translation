lexical_decisions:
- source_word: προθεμένων
  choice: सामने रख दीं
  rationale: यह προτίθημι के ठोस अर्थ—वस्तुओं को आगे या सामने रखना—को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह मान लेने के कि उन्हें केवल प्रदर्शन के लिए सजाया गया था।
- source_word: αὐτά
  choice: वे वस्तुएँ
  rationale: यूनानी सर्वनाम का संज्ञा-संदर्भ इस पद में स्पष्ट नहीं है। ‘वे वस्तुएँ’ इस खुले संदर्भ को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: ननैया के पुरोहितों
  rationale: सम्बन्धकारक संरचना का सीधा अनुवाद है। ‘ननैया’ Ναναίου से सम्बद्ध देवी के नाम का प्रचलित और यूनानी-निकट हिन्दी लिप्यन्तरण है।
- source_word: προσελθόντος
  choice: आ गया
  rationale: सन्दर्भ में व्यक्ति का पवित्र परिसर के घेरे में पहुँचना अभिप्रेत है; ‘आ गया’ केवल निकट आने की अपेक्षा वास्तविक आगमन को अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: μετʼ ὀλίγων
  choice: कुछ लोगों के साथ
  rationale: यूनानी में संज्ञा अध्याहृत है। हिन्दी में ‘लोगों’ जोड़ना छोटे साथ आए दल को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘केवल’ जैसी अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: περίβολον
  choice: घेरे
  rationale: περίβολος दीवार या सीमा से घिरे स्थान को सूचित करता है। ‘घेरा’ इसे किसी विशिष्ट वास्तु-रूप, जैसे आँगन, तक सीमित नहीं करता।
- source_word: τέμενος
  choice: मन्दिर-परिसर
  rationale: τέμενος पवित्र नियत क्षेत्र या परिसर है। ‘मन्दिर-परिसर’ इसे अगले ἱερόν से अलग रखते हुए स्थानिक स्तरों को स्पष्ट करता है।
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: उन्होंने मन्दिर बन्द कर दिया
  rationale: ἱερόν के लिए ‘मन्दिर’ और συγκλείω के लिए ‘बन्द कर दिया’ कथा की फँसाने वाली कार्रवाई को स्पष्ट और स्वाभाविक हिन्दी में रखते हैं।
- source_word: ὡς εἰσῆλθεν
  choice: भीतर प्रवेश करते ही
  rationale: ὡς और भूतकालिक क्रिया यहाँ तत्काल समय-संबंध बताते हैं; ‘करते ही’ पुरोहितों की तुरन्त की गई कार्रवाई को दर्शाता है।
- source_word: Ἀντίοχος
  choice: अन्तियुखुस
  rationale: यूनानी Ἀντίοχος का स्रोत-निकट देवनागरी लिप्यन्तरण।
