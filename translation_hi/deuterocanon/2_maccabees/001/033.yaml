lexical_decisions:
- source_word: φανερὸν ἐγενήθη
  choice: यह बात प्रकट हो गई
  rationale: यह अभिव्यक्ति घटना के स्पष्ट और सार्वजनिक रूप से ज्ञात हो जाने का भाव रखती है और हिन्दी में स्वाभाविक है।
- source_word: τὸ πρᾶγμα
  choice: यह बात
  rationale: संदर्भ में यह पहले वर्णित घटना या मामले की ओर संकेत करता है; ‘यह बात’ सहज और पर्याप्त व्यापक है।
- source_word: διηγήθη
  choice: बताया गया
  rationale: निष्क्रिय क्रिया और राजा को औपचारिक रूप से सूचना दिए जाने, दोनों को व्यक्त करता है।
- source_word: τῷ βασιλεῖ τῶν Περσῶν
  choice: फ़ारसियों के राजा को
  rationale: यूनानी संबंधकारक संरचना को निकटता से रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: निर्वासन में ले जाए गए याजकों
  rationale: कृदंत का निष्क्रिय रूप और अपनी भूमि से हटाकर ले जाए जाने का ऐतिहासिक भाव सुरक्षित रहता है।
- source_word: ἔκρυψαν
  choice: छिपाई थी
  rationale: आग छिपाने की क्रिया पानी दिखाई देने से पहले हुई थी; पूर्ण भूतकाल घटनाक्रम स्पष्ट करता है।
- source_word: τὸ ὕδωρ ἐφάνη
  choice: पानी दिखाई दिया था
  rationale: आग के छिपाए जाने के विपरीत पानी के प्रकट होने का स्पष्ट वर्णन करता है।
- source_word: ἀφ' οὗ
  choice: उसी से
  rationale: निकटतम पूर्वपद पानी है; ‘उसी से’ साधन अथवा स्रोत का स्वाभाविक हिन्दी संकेत देता है।
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: नहेमायाह के साथियों
  rationale: यूनानी मुहावरा नहेमायाह से संबद्ध समूह को दर्शाता है; हिन्दी में यह अधिक स्वाभाविक है।
- source_word: ἥγνισαν
  choice: शुद्ध किया था
  rationale: अनुष्ठानिक शुद्धि का भाव सुरक्षित रखता है और ‘पवित्र ठहराया’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ता।
- source_word: τὰς θυσίας
  choice: बलिदानों
  rationale: याजकीय संदर्भ में θυσίαι का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: ἥγνισαν τὰς θυσίας का अनुष्ठानिक अर्थ
  choice: बलिदानों को शुद्ध किया था
  alternative: बलिदानों को पवित्र किया था
  rationale: ‘शुद्ध किया’ अनुष्ठानिक शुद्धि का मूल भाव रखता है, जबकि ‘पवित्र किया’ अभिषेक अथवा प्रतिष्ठा का अधिक विशिष्ट अर्थ दे सकता है।
- issue: ἀφ' οὗ का संदर्भ
  choice: इसे पानी की ओर संकेत मानकर ‘उसी से’ अनूदित किया गया
  alternative: इसे पूरी घटना के कालगत संदर्भ में ‘इसके बाद’ समझना
  rationale: निकटतम व्याकरणिक पूर्वपद τὸ ὕδωρ है और कथा का क्रम पानी को शुद्धि के साधन या स्रोत के रूप में समझने का समर्थन करता है।
