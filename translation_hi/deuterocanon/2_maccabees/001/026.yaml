  text: Accept the sacrifice for all your people Israel[a], and preserve your portion and sanctify it.
translation:
  language: hi
  text: तेरी सारी प्रजा इस्राएल के लिए यह बलिदान स्वीकार कर, और तेरे भाग[a] की रक्षा कर और उसे पवित्र कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरे भाग’ से सम्भवतः परमेश्वर की अपनी प्रजा इस्राएल का संकेत है; पर देश या पवित्रस्थान भी अभिप्रेत हो सकता है।
    reason: ‘भाग’ के सम्भावित संदर्भों से जुड़ी मूल पाठ की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: πρόσδεξαι
  choice: स्वीकार कर
  rationale: प्रार्थना में यह क्रिया परमेश्वर से अर्पित वस्तु को अनुग्रहपूर्वक ग्रहण करने की विनती करती है। ‘स्वीकार कर’ आधुनिक, सहज और मूल आज्ञार्थक विनती के अनुरूप है।
- source_word: τὴν θυσίαν
  choice: यह बलिदान
  rationale: θυσία का ठोस अर्थ ‘बलिदान’ है। यूनानी निश्चित पद को प्रसंगानुकूल हिन्दी में ‘यह’ से व्यक्त किया गया है।
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: अपनी सारी प्रजा इस्राएल की ओर से
  rationale: ὑπέρ यहाँ प्रतिनिधित्व अथवा हित का भाव रखता है। ‘की ओर से’ स्पष्ट करता है कि बलिदान समूची प्रजा के निमित्त है, और ‘सारी प्रजा’ παντός की व्यापकता बनाए रखता है।
- source_word: διαφύλαξον
  choice: रक्षा कर
  rationale: क्रिया का अर्थ सुरक्षित रखना या बचाए रखना है। ‘रक्षा कर’ प्रार्थना की भाषा में स्वाभाविक और सीधा है।
- source_word: τὴν μερίδα σου
  choice: अपने भाग
  rationale: μερίδα का मूल अर्थ भाग या हिस्सा है। ‘अपने भाग’ मूल रूपक को बनाए रखता है और ‘विरासत’ जैसे अधिक व्याख्यात्मक अनुवाद से बचता है।
- source_word: καθαγίασον
  choice: उसे पवित्र कर
  rationale: क्रिया पवित्र करने अथवा पवित्र ठहराने का भाव देती है। ‘उसे पवित्र कर’ आधुनिक हिन्दी में स्पष्ट है; ‘उसे’ का संदर्भ पूर्ववर्ती एकवचन ‘अपने भाग’ से है।
theological_decisions:
- issue: ‘अपने भाग’ का अभिप्राय
  choice: अनुवाद में ‘अपने भाग’ का रूपक यथावत रखा गया है; निकटतम संभावित संकेत परमेश्वर की प्रजा इस्राएल की ओर है।
  alternative: इससे देश अथवा पवित्रस्थान भी अभिप्रेत हो सकता है।
  rationale: तत्काल पूर्ववर्ती पदबंध ‘अपनी सारी प्रजा इस्राएल’ है और बाइबिल की वाचा-संबंधी भाषा में प्रजा को परमेश्वर का भाग कहा जा सकता है। फिर भी यूनानी पाठ संदर्भ को स्पष्ट रूप से सीमित नहीं करता, इसलिए मुख्य पाठ और पादटिप्पणी वास्तविक अस्पष्टता बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनामय और गरिमापूर्ण रखी गई है। परमेश्वर को संबोधित यूनानी एकवचन आज्ञार्थकों के लिए ‘स्वीकार कर’, ‘रक्षा कर’ और ‘पवित्र कर’ प्रयुक्त हैं; ये निकट संबोधन की बाइबिलीय शैली को बनाए रखते हैं और असम्मानसूचक नहीं हैं।
