  yaml_path: translation/deuterocanon/2_maccabees/001/001.yaml
  text: 'To the Jewish brothers in Egypt: the Jewish brothers in Jerusalem and those in the land of Judea[a], greetings and good peace.'
translation:
  language: hi
  text: मिस्र में रहने वाले यहूदी भाइयों को—यरूशलेम में रहने वाले यहूदी भाइयों और यहूदिया देश में रहने वालों की ओर से नमस्कार और उत्तम शांति।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῖς ἀδελφοῖς τοῖς κατʼ Αἴγυπτον Ἰουδαίοις
  choice: मिस्र में रहने वाले यहूदी भाइयों को
  rationale: सम्प्रदान कारक का वाक्यांश पत्र पाने वालों को सूचित करता है। ‘भाइयों’ से ἀδελφοῖς का स्पष्ट पारिवारिक संबोधन बना रहता है, और ‘में रहने वाले’ क्षेत्र-सूचक κατʼ Αἴγυπτον को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἀδελφοὶ οἱ ἐν Ἱεροσολύμοις Ἰουδαῖοι
  choice: यरूशलेम में रहने वाले यहूदी भाइयों
  rationale: यह वाक्यांश पत्र भेजने वालों के पहले समूह को बताता है। ‘यहूदी भाइयों’ से Ἰουδαῖοι और ἀδελφοί दोनों सुरक्षित रहते हैं तथा प्राप्तकर्ताओं के साथ व्यक्त पारिवारिक एकता भी बनी रहती है।
- source_word: καὶ οἱ ἐν τῇ χώρᾳ τῆς Ἰουδαίας
  choice: और यहूदिया देश में रहने वालों
  rationale: χώρα यहाँ देश या भूभाग का अर्थ देता है। ‘यहूदिया देश’ मूल के भौगोलिक विस्तार को केवल ‘यहूदिया’ कहने की अपेक्षा अधिक स्पष्ट रूप से दर्शाता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्राचार में χαίρειν प्रचलित अभिवादन-सूत्र है; इसलिए शाब्दिक ‘आनन्दित रहो’ के बजाय हिन्दी का स्वाभाविक पत्रात्मक ‘नमस्कार’ उपयुक्त है।
- source_word: εἰρήνην ἀγαθήν
  choice: उत्तम शांति
  rationale: यह रूप εἰρήνην और उसके विशेषण ἀγαθήν दोनों को सीधे व्यक्त करता है। यद्यपि हिन्दी में यह संयोजन कुछ विशिष्ट सुनाई देता है, वह मूल की संभवतः सामी-प्रभावित अभिव्यक्ति को अनावश्यक रूप से ‘समृद्धि’ आदि में नहीं बदलता।
theological_decisions:
- issue: ἀδελφοῖς/ἀδελφοὶ के सामुदायिक संबोधन का लिंग-सटीक अनुवाद
  choice: भाइयों/भाइयों
  alternative: भाई-बहनों अथवा विश्वासियों
  rationale: यूनानी पाठ दोनों स्थानों पर पुल्लिंग पारिवारिक संज्ञा का स्पष्ट प्रयोग करता है। प्रसंग में स्त्रियों को स्पष्ट रूप से सम्मिलित करने वाला कोई अलग संकेत नहीं है, इसलिए ‘भाइयों’ मूल रूप और उसकी पुनरावृत्ति को सुरक्षित रखता है।
- issue: εἰρήνην ἀγαθήν को अर्थ-विस्तार देकर सहज बनाना
  choice: उत्तम शांति
  alternative: शांति और समृद्धि
  rationale: ‘समृद्धि’ मूल में प्रत्यक्ष रूप से नहीं है। ‘उत्तम शांति’ असामान्य लेकिन अर्थतः खुली अभिव्यक्ति को बनाए रखता है और शांति को केवल भौतिक कुशलता तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पत्र के प्रारम्भिक संबोधन के अनुरूप रखी गई है। ‘की ओर से’ यूनानी के कर्ता-समूह और हिन्दी पत्र-शैली के बीच स्वाभाविक संबंध बनाता है; यह कोई नया वैचारिक आशय नहीं जोड़ता। ‘नमस्कार और उत्तम शांति’ में मूल की संक्षिप्त, कुछ असामान्य अभिवादन-रचना जानबूझकर सुरक्षित है।
