base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/032.yaml
  text: And when this happened[a], a flame was kindled; and when the light from the altar shone forth[b], it was consumed.
translation:
  language: hi
  text: और जब ऐसा हुआ, तो एक ज्वाला जल उठी; और जब वेदी से प्रकाश चमक उठा[a], तो वह समाप्त हो गई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘पलटकर चमका’ या ‘प्रत्युत्तर में चमका’ भी हो सकता है; यूनानी क्रिया सामने से अथवा प्रत्युत्तर में चमकने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में केवल ‘समाप्त हो गया/गई’ कहा गया है; कर्ता का नाम नहीं दिया गया। यहाँ इसे ज्वाला माना गया है। अन्य लोग इसे ईंधन या भेंट, अथवा व्यापक प्रसंग के आधार पर उँडेला गया द्रव समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: और जब ऐसा हुआ
  rationale: ὡς के साथ भूतकालिक क्रिया यहाँ समयसूचक उपवाक्य बनाती है। यह अनुवाद घटनाओं का क्रम स्वाभाविक हिन्दी में रखता है, पर तत्कालता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: φλὸξ ἀνήφθη
  choice: एक ज्वाला जल उठी
  rationale: φλόξ एकवचन में ‘ज्वाला’ है और ἀνήφθη का अर्थ प्रज्वलित होना है। ‘जल उठी’ आधुनिक हिन्दी में सहज है और आग के आरम्भ होने का भाव स्पष्ट करता है।
- source_word: ἀπὸ τοῦ θυσιαστηρίου ... φωτός
  choice: वेदी से प्रकाश
  rationale: ἀπό उद्गम को और θυσιαστήριον वेदी को सूचित करता है। ‘वेदी से प्रकाश’ संक्षिप्त तथा स्पष्ट है और प्रकाश के स्रोत को बनाए रखता है।
- source_word: ἀντιλάμψαντος
  choice: चमक उठा
  rationale: ἀντιλάμπω में चमकने, सामने से चमकने या प्रत्युत्तर में चमकने का भाव हो सकता है। मुख्य पाठ में सहज ‘चमक उठा’ रखा गया है और अधिक विशिष्ट संभावना पादटिप्पणी में दी गई है।
- source_word: ἐδαπανήθη
  choice: वह समाप्त हो गई
  rationale: δαπανάω का कर्मवाच्य रूप ‘खप जाना’ या ‘समाप्त हो जाना’ दर्शाता है। आग के विषय में ‘भस्म हो गई’ अनुपयुक्त होता, इसलिए ‘समाप्त हो गई’ निकटतम पूर्वपद ‘ज्वाला’ को स्वाभाविक रूप से ग्रहण करता है, जबकि अनिश्चित कर्ता की समस्या पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम क्रिया ἐδαπανήθη का अनकहा कर्ता
  choice: मुख्य पाठ में इसे पहले उल्लिखित ज्वाला से जोड़ा गया है।
  alternative: यह ईंधन, भेंट अथवा व्यापक प्रसंग में उँडेला गया द्रव भी हो सकता है।
  rationale: यूनानी वाक्य अंतिम उपवाक्य में कर्ता को दोहराता नहीं है। निकटतम स्पष्ट कर्ता φλόξ (‘ज्वाला’) है, इसलिए मुख्य पाठ उसी को ग्रहण करता है; फिर भी अन्य प्रसंगगत संभावनाओं को पादटिप्पणी में रखा गया है ताकि अस्पष्टता को सिद्धान्तगत रूप से न सुलझाया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ज्वाला’, ‘वेदी’ और ‘प्रकाश’ जैसे परिचित धार्मिक शब्द बनाए गए हैं। यूनानी की कर्ता-संबंधी अस्पष्टता और ἀντιλάμπω की अर्थ-छाया पादटिप्पणियों में स्पष्ट की गई है।
