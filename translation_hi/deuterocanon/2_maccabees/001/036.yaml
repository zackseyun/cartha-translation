- source_word: προσηγόρευσαν
  choice: नाम दिया
  rationale: सन्दर्भ में क्रिया किसी वस्तु के लिए एक नाम या पद निर्धारित करने को व्यक्त करती है; ‘नाम दिया’ स्वाभाविक और सटीक हिन्दी है।
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: नहेमायाह के साथी
  rationale: यह यूनानी मुहावरा नहेमायाह के साथ रहनेवाले या उसके सहयोगियों को दर्शाता है; शाब्दिक रूप से ‘उसके चारों ओर के लोग’ कहना हिन्दी में अस्वाभाविक होता।
- source_word: τοῦτο
  choice: इसे
  rationale: संकेतवाचक शब्द पिछले सन्दर्भ में वर्णित पदार्थ की ओर संकेत करता है; हिन्दी में ‘इसे’ संक्षिप्त और स्पष्ट है।
- source_word: Νεφθάρ
  choice: नेफ्थार
  rationale: नाम को यूनानी ध्वनिरूप के निकट देवनागरी में लिप्यन्तरित किया गया है।
- source_word: διερμηνεύεται
  choice: जिसका अनुवाद … है
  rationale: क्रिया विदेशी पद की व्याख्या या अनुवाद प्रस्तुत करती है; यह वाक्य-विन्यास यूनानी अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: Καθαρισμός
  choice: शुद्धीकरण
  rationale: यह संज्ञा शुद्ध करने या शुद्ध किए जाने की प्रक्रिया को बताती है और सम्भावित अनुष्ठानिक अर्थ को भी बनाए रखती है।
- source_word: παρὰ τοῖς πολλοῖς
  choice: अधिकांश लोग
  rationale: वाक्यांश व्यापक जन-प्रयोग को दर्शाता है; ‘अधिकांश लोग’ आधुनिक हिन्दी में सीधा और सहज है।
- source_word: Νεφθί
  choice: नेफ्थी
  rationale: यूनानी Νεφθί में उपस्थित θ ध्वनि को बनाए रखने के लिए ‘फ्थ’ और दीर्घ अन्त्य स्वर के लिए ‘ई’ रखा गया है।
