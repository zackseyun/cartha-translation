  yaml_path: translation/deuterocanon/2_maccabees/001/016.yaml
  text: After opening the hidden door of the smoke chamber[a], they threw stones and struck down the leader, and after cutting him into pieces[b], they threw the heads to those outside.
translation:
  language: hi
  text: उन्होंने धुएँ के कक्ष का छिपा हुआ द्वार[a] खोलकर पत्थर फेंके और नेता को मार गिराया[b]। फिर उसके अंग काटकर अलग कर दिए और सिरों को बाहर वालों की ओर फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भट्ठी के कक्ष का द्वार” अथवा “धुएँ या धूप के स्थान का द्वार।” यहाँ प्रयुक्त यूनानी शब्द दुर्लभ है और उसका ठीक आशय निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ की यूनानी क्रिया वज्र या बिजली गिरने जैसी प्रचण्ड चोट का बिंब जगाती है। इसका अर्थ हिंसक ढंग से मार गिराना हो सकता है; यह आवश्यक नहीं कि सचमुच आकाश से बिजली गिरी हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: खोलकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रियाओं से पहले हुई कार्रवाई बताता है; ‘खोलकर’ हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν τοῦ φατινώματος κρυπτὴν θύραν
  choice: धुएँवाले कक्ष का छिपा हुआ द्वार
  rationale: κρυπτήν का अर्थ छिपा या गुप्त है। दुर्लभ φατίνωμα का सटीक आशय अनिश्चित है, इसलिए सामान्य वर्णनात्मक पद चुना गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: βάλλοντες πέτρους
  choice: पत्थर फेंके
  rationale: यह सीधा और स्वाभाविक हिन्दी रूप है तथा आक्रमण का साधन स्पष्ट रखता है।
- source_word: συνεκεραύνωσαν
  choice: मार गिराया
  rationale: क्रिया में वज्रपात जैसी प्रचण्ड चोट का बिंब है, पर प्रसंग में आक्रमणकारी पत्थर फेंक रहे हैं। मुख्य पाठ में अनावश्यक चमत्कारिक अर्थ जोड़े बिना परिणाम व्यक्त किया गया है; बिंब पादटिप्पणी में सुरक्षित है।
- source_word: τὸν ἡγεμόνα
  choice: अगुए को
  rationale: ἡγεμών नेता, शासक या सेनापति हो सकता है। ‘अगुआ’ किसी अधिक विशिष्ट पद को आरोपित किए बिना व्यापक अर्थ बनाए रखता है।
- source_word: μέλη ποιήσαντες
  choice: उसके अंग काटकर अलग कर दिए
  rationale: शाब्दिक रूप से ‘अंग बना दिए’ एक मुहावरेदार अभिव्यक्ति है जिसका आशय शरीर को अंगों में काटना है; चुना गया रूप स्पष्ट, गरिमापूर्ण और स्रोत के निकट है।
- source_word: τὰς κεφαλὰς
  choice: सिरों को
  rationale: यूनानी पाठ में बहुवचन है। असामान्य लगने पर भी उसे एकवचन बनाकर पाठ की कठिनाई को मिटाया नहीं गया।
- source_word: τοῖς ἔξω παρρίψαντες
  choice: बाहर खड़े लोगों की ओर फेंक दिया
  rationale: τοῖς ἔξω को स्थान मात्र के बजाय ‘बाहर वालों’ के रूप में लेना व्याकरणतः स्वाभाविक है; ‘की ओर’ हिन्दी में फेंकने की दिशा और उन लोगों की उपस्थिति दोनों व्यक्त करता है।
theological_decisions:
- issue: क्या συνεκεραύνωσαν को वास्तविक ईश्वरीय वज्रपात माना जाए या प्रचण्ड हिंसक प्रहार का बिंब
  choice: मुख्य पाठ में ‘मार गिराया’, और पादटिप्पणी में वज्रपात के बिंब का उल्लेख
  alternative: ‘बिजली गिराकर मारा’ अथवा ‘वज्रपात-सा प्रहार करके मार गिराया’
  rationale: क्रिया κεραυνός (‘वज्र/बिजली’) से जुड़ी है, पर तत्काल कर्ता पत्थर फेंकने वाले मनुष्य हैं। यह रूप शब्द की तीव्रता को पादटिप्पणी में बचाता है, पर ऐसे चमत्कार को निश्चित नहीं करता जिसे पद स्पष्ट रूप से नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। हिंसा को स्रोत के अनुसार साफ रखा गया है, पर सनसनीखेज शब्दावली से बचा गया है। यूनानी बहुवचन ‘सिरों’ और दुर्लभ स्थान-संज्ञा की कठिनाई को समतल नहीं किया गया।
