  yaml_path: translation/deuterocanon/2_maccabees/001/024.yaml
  text: 'And the prayer was in this form: “Lord God[a], creator of all things, the awesome and mighty and righteous and merciful one[b], the only king and good one,”'
translation:
  language: hi
  text: 'और प्रार्थना इस प्रकार थी: “हे प्रभु परमेश्वर, सभी वस्तुओं के सृष्टिकर्ता, भय जगाने वाले[a], सामर्थी, धर्मी और दयालु, एकमात्र राजा और भले[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विस्मयकारी”; यूनानी विशेषण का अर्थ ऐसा हो सकता है जो भय अथवा श्रद्धामिश्रित विस्मय उत्पन्न करे।
    reason: lexical_alternative
  - marker: b
    text: या “कृपालु” अथवा “हितकारी”; यूनानी शब्द भलाई, कृपा या हितकारी स्वभाव का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: और प्रार्थना इस प्रकार थी
  rationale: यह यूनानी मुहावरे के अर्थ और प्रार्थना के औपचारिक परिचय, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Κύριε ὁ θεός
  choice: हे प्रभु परमेश्वर
  rationale: प्रार्थना में प्रत्यक्ष संबोधन दिखाने के लिए ‘हे’ स्वाभाविक है; ‘प्रभु परमेश्वर’ दोनों यूनानी पदों को स्पष्ट रखता है।
- source_word: ὁ πάντων κτίστης
  choice: सबके सृष्टिकर्ता
  rationale: यह πάντων की सार्वभौमिकता और κτίστης के सृजनकर्ता-वाले अर्थ को संक्षिप्त, प्रतिष्ठित हिन्दी में सुरक्षित रखता है।
- source_word: ὁ φοβερὸς
  choice: भय जगाने वाले
  rationale: φοβερός का मूल भाव भय अथवा श्रद्धामिश्रित विस्मय उत्पन्न करना है। यह अनुवाद उसे केवल ‘भयभीत’ होने के गलत आधुनिक अर्थ से बचाता है और विकल्प को पादटिप्पणी में रखता है।
- source_word: ὁ ἰσχυρὸς
  choice: सामर्थी
  rationale: ईश्वरीय शक्ति के लिए संक्षिप्त और स्वाभाविक स्तुतिपरक पद।
- source_word: δίκαιος
  choice: धर्मी
  rationale: यह परमेश्वर के न्यायपूर्ण और नैतिक रूप से सही चरित्र का विशेषणात्मक वर्णन बनाए रखता है; ‘न्यायी’ भी संभव है।
- source_word: ἐλεήμων
  choice: दयालु
  rationale: यह दया करने वाले स्वभाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ὁ μόνος βασιλεὺς
  choice: एकमात्र राजा
  rationale: μόνος में निहित विशिष्ट और अनन्य राजत्व को बिना विस्तार के सुरक्षित रखता है।
- source_word: χρηστός
  choice: भले
  rationale: संबोधन-शृंखला में χρηστός के व्यापक ‘भला/अच्छा’ अर्थ को रखता है; ‘कृपालु’ या ‘हितकारी’ अर्थ भी संभव है।
theological_decisions:
- issue: यहूदी प्रार्थना में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु परमेश्वर’ प्रार्थना-संबोधन में स्वाभाविक है और κύριος की धार्मिक उपाधि को अनावश्यक व्याख्या के बिना बनाए रखता है।
- issue: μόνος βασιλεὺς में परमेश्वर के राजत्व की अनन्यता
  choice: एकमात्र राजा
  alternative: अकेले राजा
  rationale: यह यूनानी कथन की अनन्यता को स्पष्ट रखता है और उसमें कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: φοβερός में भय और श्रद्धामिश्रित विस्मय का तनाव
  choice: भय जगाने वाले
  alternative: विस्मयकारी
  rationale: मुख्य पाठ प्रत्यक्ष भय-प्रेरक अर्थ रखता है, जबकि पादटिप्पणी शब्द में संभव श्रद्धामिश्रित विस्मय को भी सामने लाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रतिष्ठित किंतु सहज प्रार्थना-शैली अपनाई गई है। लगातार आने वाले यूनानी विशेषणों को हिन्दी संबोधन के अनुरूप ‘-वाले/सामर्थी/धर्मी/दयालु/भले’ रूप में रखा गया है। पद आगे जारी रहने के कारण अंत में अल्पविराम बनाए रखा गया है।
