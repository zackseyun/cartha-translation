  text: And from those men the king received many different gifts[a], and distributed them.
translation:
  language: hi
  text: और उन लोगों से राजा ने बहुत-सी तरह-तरह की वस्तुएँ[a] लीं और उन्हें बाँट दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत-सी तरह-तरह की भेंटें।” यूनानी में कर्म स्पष्ट रूप से नहीं बताया गया है; प्रसंग के आधार पर “भेंटें” समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: उन लोगों से
  rationale: संबंधवाचक सर्वनाम प्रसंग में पहले बताए गए व्यक्तियों की ओर संकेत करता है; ἐλάμβανεν के साथ हिन्दी में स्रोत-संबंध स्पष्ट करने के लिए ‘से’ स्वाभाविक है।
- source_word: πολλὰ διάφορα
  choice: बहुत-सी तरह-तरह की वस्तुएँ
  rationale: यूनानी में विशेषण नपुंसकलिंग बहुवचन रूप में संज्ञा के बिना प्रयुक्त हैं और अनेक प्रकार की वस्तुओं का संकेत देते हैं। मुख्य पाठ में ‘वस्तुएँ’ जोड़ना हिन्दी में आवश्यक है, जबकि पादटिप्पणी प्रसंगानुसार ‘भेंटें’ की संभावना बताती है।
- source_word: ἐλάμβανεν
  choice: लीं
  rationale: λαμβάνω का अर्थ ‘लेना’ या ‘प्राप्त करना’ हो सकता है। यहाँ ‘लीं’ मूल की अपेक्षाकृत खुली अर्थ-सीमा बनाए रखता है; अपूर्ण भूतकाल को स्वाभाविक हिन्दी कथन में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: μετεδίδου
  choice: उन्हें बाँट दिया
  rationale: μεταδίδωμι किसी को हिस्सा देने या बाँटने का भाव रखता है। ‘उन्हें बाँट दिया’ हिन्दी में स्वाभाविक है और पहले प्राप्त वस्तुओं की ओर स्पष्ट संकेत करता है।
