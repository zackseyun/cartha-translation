  text: Torment those who oppress and insolently abuse us in their pride;[a]
translation:
  language: hi
  text: जो हम पर अत्याचार करते हैं और घमंड में हमारे साथ उद्दण्ड दुर्व्यवहार करते हैं, उन्हें यातना दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कष्ट दे’ अथवा ‘दण्ड दे’; ‘हमारे साथ उद्दण्ड दुर्व्यवहार करते हैं’ का अर्थ ‘हमारा घोर अपमान करते हैं’ भी हो सकता है।
    reason: βάσανισον के वैकल्पिक अर्थों तथा ἐξυβρίζω में निहित उद्दण्ड, अपमानजनक दुर्व्यवहार के अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: βάσανισον
  choice: कठोर दण्ड दे
  rationale: यह βασανίζω का एकवचन एओरिस्ट आज्ञार्थक रूप है और परमेश्वर से कठोर पीड़ा अथवा दण्ड देने की प्रार्थना व्यक्त करता है। ‘कठोर दण्ड दे’ क्रिया की तीव्रता बनाए रखता है, पर आधुनिक हिन्दी में ‘यातना दे’ से जुड़ी अत्यधिक विशिष्ट शारीरिक धारणा को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: τοὺς καταδυναστεύοντας
  choice: जो हम पर अत्याचार करते
  rationale: यह कृदन्त दमनकारी शक्ति चलाने का भाव देता है। ‘हम पर अत्याचार करते’ स्वाभाविक हिन्दी है और प्रार्थना करने वाले समुदाय को निहित कर्म के रूप में स्पष्ट करता है।
- source_word: ἐξυβρίζοντας
  choice: हमारा अपमान करते हैं
  rationale: ἐξυβρίζω उद्दण्ड और अपमानजनक दुर्व्यवहार का बोध कराता है। ‘अपमान करते हैं’ सामान्य पाठक के लिए स्पष्ट है; साथ का ‘घमंड में’ उसके उद्दण्ड भाव को सुरक्षित रखता है।
- source_word: ἐν ὑπερηφανίᾳ
  choice: घमंड में
  rationale: यह वाक्यांश अहंकारी मनोभाव अथवा ढंग को व्यक्त करता है। ‘घमंड में’ यूनानी की संक्षिप्तता और नैतिक भार दोनों बनाए रखता है, बिना अनावश्यक अधिकारवाचक सर्वनाम जोड़े।
theological_decisions:
- issue: दोनों कृदन्तों का निहित कर्म
  choice: ‘हम’ को दोनों क्रियाओं के साथ अर्थतः स्पष्ट किया गया है
  alternative: कर्म को निहित छोड़ना, या केवल दूसरी क्रिया के साथ ‘हमारा’ लगाना
  rationale: सामुदायिक प्रार्थना का प्रसंग बताता है कि अत्याचार और अपमान दोनों प्रार्थना करने वाले समुदाय के विरुद्ध हैं। हिन्दी में ‘हम पर’ और ‘हमारा’ इस अर्थ को स्वाभाविक रूप से स्पष्ट करते हैं, कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ते।
- issue: βάσανισον की दण्डात्मक तीव्रता
  choice: ‘कठोर दण्ड दे’
  alternative: ‘यातना दे’ या ‘कष्ट दे’
  rationale: मूल क्रिया गंभीर पीड़ा या दण्ड का अर्थ दे सकती है। चुना हुआ पाठ उसकी तीव्रता बनाए रखता है, जबकि ‘यातना दे’ संभावित रूप से शारीरिक यातना को अधिक निश्चित कर देता और ‘कष्ट दे’ दण्डात्मक पक्ष को कमजोर कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थना की गंभीर और विनयपूर्ण शैली के अनुरूप एकवचन आदरसूचक आज्ञार्थक ‘दे’ रखा गया है। भाषा सामान्य पाठकों के लिए स्पष्ट है, जबकि मूल यूनानी की तीव्रता और संक्षिप्तता को यथासम्भव बनाए रखा गया है।
