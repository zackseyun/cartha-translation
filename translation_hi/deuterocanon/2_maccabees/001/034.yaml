  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘घेराबंदी’ ठोस क्रिया को व्यक्त करती है, जबकि ‘पवित्र ठहराया’ धार्मिक आशय को बिना मंदिर-निर्माण का अनुमान लगाए सुरक्षित रखता है।
