  text: और याजक स्तुतिगीत गा रहे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याजकों ने स्तुतिगीत गाए।’ यूनानी में प्रयुक्त अपूर्ण भूतकाल का क्रियारूप चल रही क्रिया पर बल दे सकता है, पर कथा-वर्णन में इसे सामान्य भूतकाल से भी अनूदित किया जा सकता है।
    reason: क्रिया के पक्ष से संबंधित वैकल्पिक अनुवाद
lexical_decisions:
- source_word: Οἱ δὲ
  choice: और
  rationale: δέ यहाँ प्रबल विरोध नहीं, बल्कि कथा को आगे बढ़ाने वाला हल्का संयोजक है; इसलिए ‘और’ स्वाभाविक है।
- source_word: ἱερεῖς
  choice: याजक
  rationale: यह धार्मिक अनुष्ठान में सेवा करने वाले निर्दिष्ट पुरोहितों के लिए प्रचलित और सटीक बाइबिलीय हिन्दी शब्द है।
- source_word: ἐπέψαλλον
  choice: गा रहे थे
  rationale: अपूर्ण भूतकाल का क्रियारूप चल रही क्रिया का संकेत देता है। ‘गा रहे थे’ इस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है और ‘सस्वर पाठ कर रहे थे’ जैसी अधिक संकीर्ण व्याख्या से बचता है।
- source_word: τοὺς ὕμνους
  choice: स्तुतिगीत
  rationale: ὕμνοι देव-स्तुति के गीत हैं। ‘स्तुतिगीत’ अर्थ को स्पष्ट रखता है और प्रसंग की उपासना-संबंधी प्रकृति को सहज हिन्दी में व्यक्त करता है।
