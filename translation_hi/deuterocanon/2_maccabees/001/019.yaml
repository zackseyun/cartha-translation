base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/019.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests took some of the fire from the altar and secretly hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: hi
  text: क्योंकि जब हमारे पूर्वजों को फ़ारस ले जाया जा रहा था[a], तब धर्मनिष्ठ याजकों ने वेदी की आग में से थोड़ा-सा लेकर उसे चुपके से एक सूखे कुएँ की खोखली जगह में छिपा दिया। वहाँ उन्होंने उसे इस तरह सुरक्षित कर दिया कि उस स्थान का किसी को पता न चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्वासित करके फ़ारस ले जाया जा रहा था।” यूनानी क्रिया का अर्थ किसी को ले जाना या निर्वासन में ले जाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: ले जाया जा रहा था
  rationale: अपूर्णकालीन कर्मवाच्य रूप पूर्वजों को किसी अन्य शक्ति द्वारा ले जाए जाने की जारी प्रक्रिया व्यक्त करता है। यह निर्वासन का संदर्भ बनाए रखता है, पर क्रिया में निहित अर्थ से अधिक तकनीकी शब्दावली मुख्य पाठ में नहीं जोड़ता।
- source_word: Περσικὴν
  choice: फ़ारस
  rationale: स्त्रीलिंग विशेषण यहाँ संज्ञा के रूप में फ़ारस की भूमि को सूचित करता है। आधुनिक हिन्दी में भौगोलिक नाम ‘फ़ारस’ स्वाभाविक और स्पष्ट है।
- source_word: εὐσεβεῖς
  choice: धर्मनिष्ठ
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धा और धार्मिक निष्ठा का भाव रखता है। ‘धर्मनिष्ठ’ गरिमापूर्ण आधुनिक हिन्दी है और दिखावटी धार्मिकता का अनचाहा भाव नहीं देता।
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: वेदी की आग में से कुछ आग लेकर
  rationale: ἀπό स्रोत का बोध कराता है। ‘कुछ आग’ से स्पष्ट होता है कि याजकों ने वेदी की पूरी आग नहीं, उसमें से आग ली।
- source_word: λαθραίως
  choice: चुपके से
  rationale: क्रिया-विशेषण कार्य को दूसरों से छिपाकर किए जाने का भाव देता है। ‘चुपके से’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: एक सूखे कुएँ के खोखले भाग में
  rationale: κοιλώματι किसी खोखली जगह या गह्वर को और ἀνύδρου जलरहित अवस्था को बताता है। यह रूपक को बनाए रखते हुए हिन्दी में सहज है।
- source_word: κατησφαλίσαντο
  choice: उन्होंने उसे ... सुरक्षित कर दिया
  rationale: मध्यवाच्य क्रिया किसी वस्तु को पूरी तरह सुरक्षित करने का भाव देती है। संदर्भानुसार अप्रकट कर्म आग है; ‘सुरक्षित कर दिया’ उस आशय को स्पष्ट करता है।
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: कि उस स्थान का किसी को पता न चले
  rationale: यह ὥστε उपवाक्य स्थान को सबकी जानकारी से छिपाए रखने के अभिप्रेत परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: निर्वासन-संबंधी ऐतिहासिक शब्दावली
  choice: फ़ारस ले जाया जा रहा था
  alternative: निर्वासित करके फ़ारस ले जाया जा रहा था
  rationale: मुख्य पाठ यूनानी कर्मवाच्य क्रिया की व्यापकता और ऐतिहासिक गंभीरता बनाए रखता है। पादटिप्पणी निर्वासन का अधिक स्पष्ट विकल्प देती है, ताकि मूल की संभावित अर्थ-छाया न खोए और मुख्य पाठ अनावश्यक रूप से अधिक विशिष्ट न बने।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। ‘याजक’ और ‘वेदी’ जैसे प्रचलित बाइबिलीय शब्द बनाए गए हैं; वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है।
