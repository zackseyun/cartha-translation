  yaml_path: translation/deuterocanon/2_maccabees/001/013.yaml
  text: For when the leader and the force around him that seemed to be invincible had entered[a], they were cut down in the temple of Nanaia[b], because the priests of Nanaia had used deceit.
translation:
  language: hi
  text: क्योंकि जब शासक और उसके साथ की वह सेना, जिसका सामना करना असंभव लगता था, आ पहुँचे,[a] तो ननाया के मंदिर में उन्हें काट डाला गया, क्योंकि ननाया के पुजारियों ने छल का सहारा लिया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक भाव ‘आकर’ या ‘उपस्थित होकर’ भी हो सकता है; मंदिर में प्रवेश करना प्रसंग से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ननाया के पुजारियों की छल-युक्ति के कारण।” यूनानी रचना छल को इस घटना का कारण अथवा साधन बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: जब … वहाँ पहुँचे
  rationale: मूल कृदन्त का सामान्य अर्थ ‘होकर/आकर’ है और यहाँ वह उस परिस्थिति को प्रस्तुत करता है जिसमें शासक और उसकी सेना मन्दिर में मारे गए। ‘वहाँ पहुँचे’ प्रसंगानुकूल और स्वाभाविक है, जबकि पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: ὁ ἡγεμών
  choice: शासक
  rationale: ἡγεμών किसी अगुवे, शासक या सेनानायक को सूचित कर सकता है। ‘शासक’ पद या भूमिका को अत्यधिक विशिष्ट बनाए बिना अर्थ देता है।
- source_word: ἡ περὶ αὐτὸν … δύναμις
  choice: उसके साथ की … सेना
  rationale: सैन्य प्रसंग में δύναμις सशस्त्र बल या सेना है, और περὶ αὐτόν उसके साथ उपस्थित लोगों को दर्शाता है।
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: जिसका सामना करना असम्भव लगता था
  rationale: ἀνυπόστατος का बल ऐसी शक्ति पर है जिसका प्रतिरोध या सामना न किया जा सके; δοκοῦσα εἶναι के कारण इसे वास्तविक तथ्य नहीं, केवल प्रतीति के रूप में रखा गया है।
- source_word: κατεκόπησαν
  choice: उन्हें काट डाला गया
  rationale: κατακόπτω प्रहार करके या काटकर हिंसापूर्वक मार डालने का सजीव भाव रखता है; यह अनुवाद उस तीव्रता को बनाए रखता है।
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: ननाया के मन्दिर में
  rationale: ἱερόν यहाँ उपासना-स्थल अथवा मन्दिर है; ननाया नाम का ध्वन्यात्मक लिप्यन्तरण किया गया है।
- source_word: παραλογισμῷ χρησαμένων
  choice: छल का सहारा लिया था
  rationale: यह पदबंध छल या युक्ति के प्रयोग को बताता है। यूनानी genitive absolute घटना का कारण अथवा साधन बता सकता है; हिन्दी वाक्य इसे कारण के रूप में सहजता से व्यक्त करता है।
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: ननाया के पुजारियों
  rationale: περὶ τὴν Ναναίαν यहाँ ननाया से सम्बद्ध अथवा उसकी सेवा करने वाले पुजारियों का संकेत देता है; ‘ननाया के पुजारी’ आधुनिक हिन्दी में स्वाभाविक है।
