  text: और वह तुम्हारे हृदय को अपनी व्यवस्था और आज्ञाओं के प्रति खोल दे[a], और शान्ति लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और वह तुम्हारे हृदय को अपनी व्यवस्था में और आज्ञाओं में खोल दे, और शान्ति लाए।” यूनानी में ये क्रियानन्त रूप पिछले पद की प्रार्थना को आगे बढ़ाते हैं।
    reason: यूनानी ἐν के अधिक अक्षरशः ‘में’ को तथा पिछले पद की प्रार्थना पर infinitives की निर्भरता को दर्शाता है।
lexical_decisions:
- source_word: διανοίξαι
  choice: खोल दे
  rationale: यह अनिश्चित क्रियारूप पिछले पद की प्रार्थना को आगे बढ़ाता है। ‘खोल दे’ मूल रूपक और ग्रहणशीलता के भाव को बनाए रखता है।
- source_word: καρδίαν
  choice: हृदय
  rationale: बाइबलीय प्रयोग में यह मनुष्य के भीतरी व्यक्तित्व—समझ, इच्छा और संकल्प—को समेटता है; इसलिए ‘मन’ की अपेक्षा ‘हृदय’ अधिक व्यापक और स्रोत-संगत है।
- source_word: ἐν τῷ νόμῳ αὐτοῦ καὶ ἐν τοῖς προστάγμασιν
  choice: अपनी व्यवस्था और आज्ञाओं के लिए
  rationale: यूनानी ἐν का अक्षरशः अर्थ ‘में’ है, पर हिन्दी में ‘हृदय को व्यवस्था में खोलना’ अस्वाभाविक और अस्पष्ट होगा। ‘के लिए’ हृदय को परमेश्वर की व्यवस्था और आज्ञाओं के प्रति ग्रहणशील बनाने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: धार्मिक-बाइबलीय प्रसंग में νόμος के लिए ‘व्यवस्था’ प्रतिष्ठित, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: προστάγμασιν
  choice: आज्ञाओं
  rationale: यह आदेशित या निर्धारित बातों को दर्शाता है; ‘आज्ञाएँ’ इस धार्मिक प्रसंग में सहज और स्पष्ट है।
- source_word: εἰρήνην ποιῆσαι
  choice: शान्ति स्थापित करे
  rationale: ποιέω का मूल भाव ‘करना/बनाना’ है। ‘शान्ति स्थापित करे’ हिन्दी में उसके कारक भाव को स्वाभाविक रूप से व्यक्त करता है और इसे केवल मानसिक चैन तक सीमित नहीं करता।
theological_decisions:
- issue: पिछले पद से चला आ रहा निहित कर्ता और प्रार्थनात्मक भाव
  choice: निहित कर्ता को हिन्दी में ‘वह’ के रूप में स्पष्ट करके दोनों क्रियाओं को प्रार्थनात्मक रूप ‘खोल दे… स्थापित करे’ में रखा गया है।
  alternative: 'क्रियाओं को केवल संयोजक infinitive-जैसे खंड के रूप में रखना: ‘और तुम्हारे हृदय को… खोलना, और शान्ति स्थापित करना’।'
  rationale: यूनानी के infinitive पिछले पद की प्रार्थना पर निर्भर हैं। अलग पद के रूप में सुबोध हिन्दी के लिए निहित दिव्य कर्ता को स्पष्ट करना आवश्यक है, पर उसका नाम जोड़कर मूल से अधिक विशिष्ट नहीं बनाया गया।
- issue: ἐν के क्षेत्रसूचक भाव और हिन्दी की स्वाभाविकता
  choice: ‘व्यवस्था और आज्ञाओं के लिए’
  alternative: ‘अपनी व्यवस्था में और आज्ञाओं में’
  rationale: वैकल्पिक रूप यूनानी संरचना के अधिक निकट है, किन्तु हिन्दी में हृदय खोलने के साथ असहज है। चुना हुआ रूप ग्रहणशीलता का आशय देता है, बिना किसी संप्रदायगत व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय रजिस्टर। ‘शान्ति’ और ‘व्यवस्था’ पारंपरिक किन्तु आज भी बोधगम्य शब्द हैं; वाक्य को स्वतंत्र पद के रूप में स्पष्ट बनाने हेतु ‘वह’ जोड़ा गया है।
