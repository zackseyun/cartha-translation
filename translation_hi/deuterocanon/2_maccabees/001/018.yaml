base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/018.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chasleu[a], we thought it necessary to make this clear to you also, so that you too may celebrate the festival of booths and of the fire, when Nehemiah, after building both the temple and the altar, offered sacrifices.
translation:
  language: hi
  text: क्योंकि हम खासेलेऊ महीने की पच्चीसवीं तारीख को मंदिर की शुद्धि का उत्सव मनाने वाले हैं, इसलिए हमने यह आवश्यक समझा कि आपको भी इसके बारे में स्पष्ट रूप से बता दें, ताकि आप भी झोंपड़ियों का पर्व और आग का उत्सव[a] मनाएँ, जब नहेमायाह ने मंदिर और वेदी का निर्माण करने के बाद बलिदान चढ़ाए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से यूनानी में केवल “और आग का” है। इसे “और आग का पर्व” भी समझा जा सकता है; संभवतः यह आगे दिए गए स्मारक-वृत्तांत की ओर संकेत करता है।
    reason: मूल यूनानी की संक्षिप्तता और ‘आग’ से जुड़े उत्सव के सटीक स्वरूप की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: हम ... उत्सव मनाने वाले हैं
  rationale: μέλλω के साथ infinitive निकट भविष्य की मंशा व्यक्त करता है, और पर्व-संदर्भ में ἄγειν का अर्थ किसी उत्सव को मनाना है।
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: खासेलेऊ महीने की पच्चीसवीं तारीख को
  rationale: यूनानी महीने के नाम Χασελεὺ का निकट देवनागरी लिप्यंतरण रखा गया है और दिनांक को स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: मंदिर की शुद्धि
  rationale: καθαρισμός शुद्ध करने अथवा शुद्धि का बोध कराता है; 'समर्पण' जोड़ना मूल शब्द से अधिक व्याख्यात्मक होता। ἱερόν के लिए प्रसंगानुकूल और सामान्य 'मंदिर' चुना गया है।
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: हमने यह आवश्यक समझा कि आपको भी इसके बारे में स्पष्ट रूप से बता दें
  rationale: यह वाक्यांश आवश्यकता संबंधी विचार और बात को साफ-साफ समझाने, दोनों अर्थों को व्यक्त करता है।
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: ताकि आप भी ... उत्सव मनाएँ
  rationale: καὶ αὐτοί का सहभागी बल 'आप भी' से और पर्व-संदर्भ में ἄγητε का अर्थ 'मनाएँ' से स्वाभाविक रूप में आता है।
- source_word: σκηνοπηγίας
  choice: झोंपड़ियों का पर्व
  rationale: यह उस पर्व का नाम है जिसमें अस्थायी झोंपड़ियों का सांस्कृतिक चित्र निहित है; यह हिन्दी पाठक के लिए पारदर्शी है।
- source_word: καὶ τοῦ πυρός
  choice: और आग का उत्सव
  rationale: यूनानी पद संक्षिप्त रूप से केवल 'और आग का' कहता है। हिन्दी में वाक्य पूरा करने के लिए 'उत्सव' की पुनरावृत्ति की गई है, पर इसकी अनिश्चितता पादटिप्पणी में स्पष्ट रखी गई है।
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: मंदिर और वेदी का निर्माण करने के बाद
  rationale: Aorist participle को मुख्य क्रिया से पहले पूर्ण हुई क्रिया के रूप में व्यक्त किया गया है; τε ... καὶ दोनों वस्तुओं को जोड़ता है।
- source_word: ἀνήνεγκεν θυσίας
  choice: बलिदान चढ़ाए थे
  rationale: बलिदान-संदर्भ में ἀναφέρω का अर्थ बलिदान अर्पित करना या चढ़ाना है; हिन्दी में 'बलिदान चढ़ाना' स्वाभाविक धार्मिक अभिव्यक्ति है।
theological_decisions:
- issue: σκηνοπηγίας का पर्वनाम
  choice: झोंपड़ियों का पर्व
  alternative: तंबुओं का पर्व
  rationale: चुना गया रूप पर्व के अस्थायी निवासों के बिंब को सामान्य हिन्दी में स्पष्ट रखता है और किसी बाद की सांप्रदायिक शब्दावली पर निर्भर नहीं है।
- issue: καὶ τοῦ πυρός की संक्षिप्त और अस्पष्ट अभिव्यक्ति
  choice: आग का उत्सव, पादटिप्पणी सहित
  alternative: आग का स्मरणोत्सव / केवल 'और आग का'
  rationale: हिन्दी वाक्य को व्याकरणिक बनाने के लिए 'उत्सव' पूरा किया गया है, लेकिन यूनानी में यह शब्द प्रत्यक्षतः नहीं है। पादटिप्पणी इस तथ्य और आगे आने वाले वृत्तांत से संभावित संबंध को खुला रखती है।
- issue: नहेमायाह के निर्माण और बलिदान के बीच संबंध
  choice: निर्माण करने के बाद ... बलिदान चढ़ाए
  alternative: जिसने मंदिर और वेदी का निर्माण किया, उसने बलिदान चढ़ाए
  rationale: Aorist participle का पूर्वकालिक संबंध स्वाभाविक है, यद्यपि यूनानी participle को विशेषणवत भी समझा जा सकता है। चुना गया पाठ घटनाक्रम को सहज हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'खासेलेऊ' मूल यूनानी नाम का निकट लिप्यंतरण है। वाक्य की लंबी यूनानी संरचना को हिन्दी में कारणसूचक और उद्देश्यसूचक खंडों के साथ प्रवाहपूर्ण बनाया गया है; अंतिम स्मृति-संबंधी वाक्यांश अर्थ स्पष्ट करता है, जबकि 'आग' संबंधी मूल अस्पष्टता पादटिप्पणी में संरक्षित है।
