  yaml_path: translation/deuterocanon/2_maccabees/001/020.yaml
  text: But after many years had passed, when it seemed good to God, Nehemiah, having been sent by the king of Persia, sent for the descendants of the priests who had hidden it, to get the fire.
translation:
  language: hi
  text: परन्तु बहुत वर्ष बीत जाने के बाद, जब परमेश्वर को यह उचित लगा, तब फारस के राजा द्वारा भेजे गए नहेमायाह ने उन याजकों के वंशजों को—जिन याजकों ने उसे छिपाया था—आग लेने भेजा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आग की ओर/आग के लिए भेजा।” यूनानी वाक्य संक्षिप्त है; यहाँ आशय आसपास के प्रसंग में उल्लिखित छिपी हुई आग को वापस लाने के लिए उन याजकों के वंशजों को भेजना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: परन्तु बहुत वर्ष बीत जाने के बाद
  rationale: सम्बन्धकारक निरपेक्ष रचना समय की पृष्ठभूमि बताती है। यहाँ ἱκανῶν का अर्थ ‘बहुत’ अथवा ‘काफी’ है; यह हिन्दी प्रयोग स्वाभाविक ढंग से वही अर्थ देता है।
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: जब परमेश्वर को यह उचित लगा
  rationale: ἔδοξεν के साथ सम्प्रदान कारक का अर्थ ‘उचित लगना’ या ‘भला जानना’ है। यह अनुवाद यूनानी मुहावरे और परमेश्वर के निर्णय—दोनों को बिना भावात्मक अर्थ बढ़ाए बनाए रखता है।
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: फारस के राजा द्वारा भेजे गए नहेमायाह
  rationale: अओरिस्ट कर्मवाच्य कृदन्त नहेमायाह से जुड़ा है और उसके भेजे जाने को मुख्य क्रिया से पहले की घटना बताता है। ἀπό यहाँ भेजने वाले कर्ता को सूचित करता है।
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: उन याजकों के वंशजों को
  rationale: ἐκγόνους का व्यापक अर्थ ‘वंशज’ है; इससे केवल तत्काल पुत्रों या केवल पुरुष सन्तान तक अर्थ सीमित नहीं होता।
- source_word: τῶν ἀποκρυψάντων
  choice: जिन्होंने उसे छिपाया था
  rationale: कृदन्त पूर्वोक्त याजकों का वर्णन करता है। यूनानी में कर्म निहित है; हिन्दी में ‘उसे’ निकटवर्ती प्रसंग में वर्णित आग की ओर संकेत करता है।
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: आग लेने भेजा
  rationale: ἐπί के साथ कर्मकारक यहाँ आग की ओर जाने अथवा उसे प्राप्त करने के उद्देश्य को दर्शाता है। यूनानी अभिव्यक्ति संक्षिप्त है; हिन्दी में ‘आग लेने’ प्रसंगानुकूल अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ὅτε ἔδοξεν τῷ θεῷ में परमेश्वर की इच्छा या स्वीकृति
  choice: जब परमेश्वर को यह उचित लगा
  alternative: जब परमेश्वर ने उचित समझा; जब परमेश्वर प्रसन्न हुआ
  rationale: चुना हुआ पाठ परमेश्वर के निर्णय या स्वीकृति को व्यक्त करता है, पर ‘प्रसन्न हुआ’ कहकर भावात्मक प्रसन्नता को अनावश्यक रूप से प्रमुख नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘याजक’, ‘वंशज’ और ‘फारस’ जैसे प्रचलित बाइबलीय शब्दों का उपयोग किया गया है; यूनानी की संक्षिप्तता से उत्पन्न अस्पष्टता को मुख्य पाठ में न्यूनतम रूप से स्पष्ट करके पादटिप्पणी में दर्ज किया गया है।
