translation:
  language: hi
  text: एकमात्र प्रदानकर्ता[a], एकमात्र धर्मी, सर्वशक्तिमान और अनन्त, जो इस्राएल को हर बुराई से बचाते हैं और जिन्होंने पूर्वजों को चुना हुआ बनाया[b] और उन्हें पवित्र किया[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उपकारी’ अथवा ‘आपूर्तिकर्ता’। यूनानी शब्द का बल आवश्यक वस्तुएँ उपलब्ध कराने पर है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘पूर्वजों को चुना हुआ बनाया।’
    reason: source_form
  - marker: c
    text: या ‘उन्हें पवित्र बनाया’ अथवा ‘उन्हें अलग ठहराया’।
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος χορηγός
  choice: एकमात्र आवश्यकताएँ पूरी करनेवाले
  rationale: χορηγός उस व्यक्ति को दर्शाता है जो आवश्यक वस्तुएँ उपलब्ध कराता है। यह अनुवाद अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और μόνος की विशिष्टता बनाए रखता है।
- source_word: μόνος δίκαιος
  choice: एकमात्र धर्मी
  rationale: δίκαιος यहाँ परमेश्वर की उपाधि के रूप में प्रयुक्त है; ‘धर्मी’ नैतिक न्यायशीलता और धार्मिकता दोनों को संक्षेप में बनाए रखता है।
- source_word: παντοκράτωρ
  choice: सर्वशक्तिमान
  rationale: यह सर्वव्यापी सामर्थ्य बतानेवाली स्थापित और स्पष्ट बाइबलीय उपाधि है।
- source_word: αἰώνιος
  choice: सनातन
  rationale: स्तुतिपरक प्रसंग में ‘सनातन’ परमेश्वर के अनन्त अस्तित्व को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διασώζων
  choice: बचानेवाले
  rationale: वर्तमान कृदन्त संकट और हानि से सक्रिय उद्धार का भाव देता है; ‘बचानेवाले’ सहज हिन्दी है।
- source_word: ἐκ παντὸς κακοῦ
  choice: हर बुराई से
  rationale: κακόν में नैतिक बुराई, विपत्ति और हानि की व्यापकता हो सकती है; ‘हर बुराई’ इस विस्तार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τοὺς πατέρας
  choice: पूर्वजों
  rationale: सन्दर्भ इस्राएल के वाचा-सम्बन्धी पुरखों का है। यूनानी में ‘हमारे’ नहीं है, इसलिए कोई स्वामित्वसूचक शब्द नहीं जोड़ा गया।
- source_word: ποιήσας ... ἐκλεκτούς
  choice: चुने हुए बनानेवाले
  rationale: ποιέω के कर्म-पूरक विन्यास की कारणवाचक शक्ति को सुरक्षित रखते हुए यह ἐκλεκτούς को ‘चुने हुए’ के रूप में प्रस्तुत करता है।
- source_word: ἡγίασας
  choice: पवित्र करनेवाले
  rationale: यह ‘पवित्र बनाना’ अथवा ‘अलग ठहराना’ व्यक्त करता है; ‘पवित्र करनेवाले’ धार्मिक अर्थ और प्रार्थना की गरिमा दोनों बनाए रखता है।
theological_decisions:
- issue: τοὺς πατέρας में वाचा-सम्बन्धी पुरखों का उल्लेख
  choice: पूर्वजों
  alternative: पितरों / हमारे पूर्वजों
  rationale: ‘पूर्वजों’ आधुनिक पाठक के लिए स्पष्ट है और यूनानी में अनुपस्थित ‘हमारे’ को नहीं जोड़ता; ‘पितरों’ अधिक पारम्परिक पर कम सामान्य है।
- issue: ποιήσας ... ἐκλεκτούς की कारणवाचक रचना
  choice: चुने हुए बनानेवाले
  alternative: चुननेवाले
  rationale: सिर्फ ‘चुननेवाले’ अधिक स्वाभाविक होता, पर वह स्रोत के ‘बनाया ... चुना हुआ’ विन्यास को समतल कर देता। चुना जाना कैसे समझा जाए, इस पर बाद की धर्मवैज्ञानिक विशिष्टताएँ नहीं जोड़ी गईं।
- issue: ἡγίασας का धार्मिक अर्थ
  choice: पवित्र करनेवाले
  alternative: अलग ठहरानेवाले / पवित्र बनाए
  rationale: ‘पवित्र करनेवाले’ व्यक्ति और समुदाय को परमेश्वर के लिए पवित्र किए जाने का व्यापक अर्थ बनाए रखता है, बिना इसे केवल अनुष्ठानिक अभिषेक तक सीमित किए।
translation_notes:
  register: औपचारिक प्रार्थना की गरिमा बनाए रखते हुए आधुनिक, सामान्य हिन्दी का प्रयोग किया गया है। यूनानी के लगातार उपाधि-सदृश कृदन्तों को ‘-वाले’ रचना से जोड़ा गया है। पद अगले अथवा पिछले वाक्यांश का अंश है, इसलिए अन्त में अर्धविराम रखा गया है।
