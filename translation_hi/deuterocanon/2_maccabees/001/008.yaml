  yaml_path: translation/deuterocanon/2_maccabees/001/008.yaml
  text: And they set the gateway on fire and poured out innocent blood; but we prayed to the Lord and were heard. We offered sacrifice and fine flour[a], lit the lamps, and set out the loaves.
translation:
  language: hi
  text: और उन्होंने प्रवेश-द्वार को आग लगा दी और निर्दोष रक्त बहाया; तब हमने प्रभु से विनती की, और हमारी प्रार्थना सुनी गई। हमने बलि और उत्तम मैदा चढ़ाया, दीपकों को बाहर निकाला[a], और रोटियाँ सामने रख दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, प्रसंग के अनुसार, “दीपक जलाए।” यूनानी क्रिया का शाब्दिक अर्थ “बाहर निकाला” है; यहाँ उसका आशय मन्दिर की सेवा के लिए दीपकों को निकालकर तैयार करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπυραν
  choice: आग लगा दी
  rationale: यह क्रिया किसी वस्तु को जला देने के लिए उसमें आग लगाने का कारक भाव व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: τὸν πυλῶνα
  choice: प्रवेश-द्वार
  rationale: πυλών फाटक या द्वार की पूरी संरचना को सूचित कर सकता है। ‘प्रवेश-द्वार’ अर्थ को स्पष्ट रखता है, पर किसी मीनार या बरामदे का अनावश्यक निर्धारण नहीं करता।
- source_word: ἐξέχεαν αἷμα ἀθῷον
  choice: निर्दोष रक्त बहाया
  rationale: यह मूल यूनानी के ‘निर्दोष रक्त उंडेलने’ के बिंब को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
- source_word: ἐδεήθημεν τοῦ κυρίου
  choice: हमने प्रभु से विनती की
  rationale: ἐδεήθημεν साधारण प्रार्थना से अधिक आग्रहपूर्ण निवेदन का भाव रखता है; ‘विनती की’ उस गंभीरता को सहज हिन्दी में बनाए रखता है।
- source_word: εἰσηκούσθημεν
  choice: हमारी सुन ली गई
  rationale: कर्मवाच्य रूप को सुरक्षित रखते हुए यह दर्शाता है कि उनकी विनती प्रभु ने सुनी; उत्तर मिलने की बात को मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: προσηνέγκαμεν θυσίαν καὶ σεμίδαλιν
  choice: हमने बलि और उत्तम मैदा चढ़ाया
  rationale: दोनों वस्तुएँ προσήνεγκαμεν के कर्म हैं। ‘उत्तम मैदा’ से बलि में प्रयुक्त बारीक गेहूँ के आटे का अर्थ स्पष्ट होता है।
- source_word: ἐξηγάγομεν τοὺς λύχνους
  choice: दीपकों को बाहर ले आए
  rationale: ἐξάγω का प्रत्यक्ष अर्थ ‘बाहर ले आना’ है। मन्दिर-सेवा के प्रसंग में दीपक जलाना या सेवा के लिए तैयार करना अभिप्रेत हो सकता है, पर मूल क्रिया स्वयं ‘जलाना’ नहीं कहती; इसलिए मुख्य पाठ में अधिक औपचारिक समतुल्य रखा गया है और प्रसंगगत संभावना पाद-टिप्पणी में दी गई है।
- source_word: προεθήκαμεν τοὺς ἄρτους
  choice: रोटियाँ सामने रख दीं
  rationale: προτίθημι का अर्थ सामने रखना या सजाकर रखना है। यह पवित्रस्थान की विधिक क्रिया का संकेत देता है, बिना ‘परमेश्वर के सामने’ जैसे अनुपस्थित शब्द जोड़े।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος इस्राएल के परमेश्वर के लिए प्रयुक्त है। ‘प्रभु’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और यूनानी पद से आगे बढ़कर किसी विशिष्ट हिब्रू रूप का दावा नहीं करता।
- issue: मन्दिर-सेवा में दीपकों से जुड़ी क्रिया
  choice: दीपकों को बाहर ले आए
  alternative: दीपक जलाए
  rationale: सन्दर्भ मन्दिर की उपासना फिर आरम्भ करने का है, इसलिए दीपक जलाना सम्भव आशय है। फिर भी यूनानी क्रिया का मूल अर्थ ‘बाहर ले आना’ है; वास्तविक शाब्दिक अस्पष्टता बनाए रखने के लिए इसे मुख्य पाठ में रखा गया और दूसरा अर्थ पाद-टिप्पणी में बताया गया।
- issue: प्रार्थना सुने जाने का अर्थ
  choice: हमारी सुन ली गई
  alternative: हमें उत्तर मिला
  rationale: मूल कर्मवाच्य केवल सुने जाने को स्पष्ट करता है। ‘उत्तर मिला’ सम्भव निहितार्थ है, पर वह कथन को मूल से अधिक निश्चित बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण धार्मिक गद्य रखा गया है। ‘रक्त’, ‘विनती’, ‘बलि’ और ‘प्रभु’ जैसे परिचित पद प्रसंग की गंभीरता बनाए रखते हैं। वाक्य की क्रमिक विधिक संरचना मूल यूनानी के निकट रखी गई है।
