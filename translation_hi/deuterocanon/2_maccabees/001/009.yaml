    text: इसे अधिक पारंपरिक रूप से “मंडपों का पर्व” भी कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यहूदी पंचांग का चिसलेव महीना लगभग नवंबर–दिसंबर में पड़ता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἄγητε
  choice: मनाइए
  rationale: ἄγω जब ἡμέρας के साथ पर्व-संबंधी मुहावरे में आता है, तो अर्थ दिनों को ‘मनाना’ या उनका पालन करना है; शाब्दिक ‘ले जाना’ उपयुक्त नहीं।
- source_word: τὰς ἡμέρας
  choice: दिनों को
  rationale: यूनानी बहुवचन और उसके कालगत बल को सीधे बनाए रखता है तथा ‘मनाइए’ के साथ स्वाभाविक हिन्दी देता है।
- source_word: τῆς σκηνοπηγίας
  choice: झोंपड़ियों के पर्व
  rationale: σκηνοπηγία उस यहूदी पर्व को सूचित करता है जिसमें अस्थायी झोंपड़ियों का स्मरण प्रमुख है। यह रूप पारंपरिक नाम की अपेक्षा आधुनिक पाठक के लिए अर्थ अधिक स्पष्ट करता है।
- source_word: τοῦ Χασελεὺ μηνός
  choice: चिसलेव महीने में
  rationale: यूनानी Χασελεύ का निकट लिप्यंतरण ‘चिसलेव’ है; संबंधकारक पद को स्वाभाविक हिन्दी में समयसूचक ‘महीने में’ से व्यक्त किया गया है।
theological_decisions:
- issue: σκηνοπηγία पर्व-नाम का अनुवाद
  choice: झोंपड़ियों का पर्व
  alternative: तम्बुओं का पर्व / मंडपों का पर्व
  rationale: अर्थ-स्पष्ट ‘झोंपड़ियों का पर्व’ इस विशिष्ट यहूदी पवित्र पर्व की पहचान बनाए रखता है, जबकि पादटिप्पणी में अधिक पारंपरिक हिन्दी नाम दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आज्ञार्थक बहुवचन/आदरार्थक ‘मनाइए’ पत्र के संबोधित समुदाय के लिए स्वाभाविक और गरिमापूर्ण है। पादटिप्पणी-चिह्न उसी पदांश के बाद रखे गए हैं जिससे वे संबंधित हैं।
