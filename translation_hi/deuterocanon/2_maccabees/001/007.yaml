base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/007.yaml
  text: In the reign of Demetrius[a], in the one hundred sixty-ninth year, we Jews wrote to you in the distress and in the crisis that came upon us in those years[c][b], after Jason and those with him departed from the holy land and the kingdom.
translation:
  language: hi
  text: देमेत्रियुस के शासनकाल में, एक सौ उनहत्तरवें वर्ष में, हम यहूदियों ने तुम्हें उस दुःख में और उस संकट[b] में लिखा[a], जो इन वर्षों में हम पर आया था—जब से यासोन और उसके साथी पवित्र भूमि और राज्य से अलग हो गए थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें लिखा है”; यूनानी पूर्णकाल का प्रयोग पत्र लिखते समय वर्तमान दृष्टि से भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “संकट” के लिए यूनानी शब्द दुःख की तीव्र या चरम अवस्था का भी बोध करा सकता है; अतः अनुवाद हो सकता है, “दुःख की चरम अवस्था में।”
    reason: lexical_alternative
  - marker: c
    text: या, “विमुख हो गए थे,” “विद्रोह कर दिया था,” अथवा “धर्मत्याग कर दिया था”; यूनानी क्रिया में राजनीतिक और धार्मिक दोनों अर्थछायाएँ सम्भव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεύοντος Δημητρίου
  choice: देमेत्रियुस के शासनकाल में
  rationale: सम्बन्धकारक निरपेक्ष पदबंध यहाँ राजकीय काल-सूचक सूत्र है; यह हिंदी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἔτους ἑκατοστοῦ ἑξηκοστοῦ ἐνάτου
  choice: एक सौ उनहत्तरवें वर्ष में
  rationale: मूल की औपचारिक काल-गणना को शब्दों में सुरक्षित रखता है।
- source_word: ἡμεῖς οἱ Ἰουδαῖοι
  choice: हम यहूदियों ने
  rationale: सर्वनाम और जातीय-धार्मिक आत्मपहचान को सहज हिंदी में व्यक्त करता है।
- source_word: γεγράφαμεν
  choice: लिखा
  rationale: यूनानी पूर्णकाल पत्रात्मक प्रयोग हो सकता है; प्रसंग में हिंदी का सामान्य भूतकाल अधिक स्वाभाविक है, जबकि 'लिखा है' सम्भव विकल्प है।
- source_word: ἐν τῇ θλίψει καὶ ἐν τῇ ἀκμῇ
  choice: उस दुःख और उस संकट के समय
  rationale: θλίψις गंभीर कष्ट को और ἀκμή उसकी तीव्र अथवा चरम अवस्था को सूचित करता है; 'संकट' पठनीय रहते हुए इस तीव्रता को व्यक्त करता है।
- source_word: τῇ ἐπελθούσῃ ἡμῖν ἐν τοῖς ἔτεσιν τούτοις
  choice: जो उन वर्षों में हम पर आया था
  rationale: विपत्ति के समुदाय पर आ पड़ने और बीते हुए कालखंड—दोनों को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: ἀφʼ οὗ
  choice: जब से
  rationale: यह संकट के आरम्भ-बिंदु को चिह्नित करता है; केवल 'बाद' की अपेक्षा निरंतर कालगत संबंध को अधिक स्पष्ट रखता है।
- source_word: ἀπέστη
  choice: अलग हो गए थे
  rationale: ἀφίστημι में अलग होने, विमुख होने, विद्रोह करने या धर्मत्याग करने के अर्थ सम्भव हैं। तटस्थ मुख्य पाठ मूल की राजनीतिक-धार्मिक अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: Ἰάσων καὶ οἱ μετʼ αὐτοῦ
  choice: यासोन और उसके साथी
  rationale: नेता और उसके साथियों का संक्षिप्त, स्पष्ट और स्वाभाविक निरूपण है।
- source_word: ἀπὸ τῆς ἁγίας γῆς καὶ τῆς βασιλείας
  choice: पवित्र भूमि और राज्य से
  rationale: दोनों पदों को समान रूप से ἀπό के अधीन रखता है और भूमि की पवित्रता तथा राज्य-संबंध को ज्यों का त्यों व्यक्त करता है।
theological_decisions:
- issue: यासोन के विषय में ἀπέστη का आशय
  choice: अलग हो गए थे
  alternative: विद्रोह कर दिया था; विमुख हो गए थे; धर्मत्याग कर दिया था
  rationale: क्रिया में राजनीतिक विद्रोह और धार्मिक विमुखता दोनों की छाया हो सकती है। मुख्य पाठ में तटस्थ अभिव्यक्ति और पादटिप्पणी में विकल्प रखने से मूल का तनाव सुरक्षित रहता है।
- issue: ἀπὸ ... τῆς βασιλείας में βασιλεία का अर्थ
  choice: राज्य
  alternative: राजसत्ता; शासन
  rationale: मूल संज्ञा राजनीतिक क्षेत्र, सत्ता या शासन का बोध करा सकती है। 'राज्य' सबसे सीधा और पर्याप्त रूप से खुला अनुवाद है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। नामों का रूप देवनागरी में यूनानी उच्चारण के निकट रखा गया है। वाक्य की पत्रात्मक और ऐतिहासिक शैली बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
