base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/002.yaml
  text: and may God do good to you[a], and remember his covenant with Abraham, Isaac, and Jacob, his faithful servants.
translation:
  language: hi
  text: और परमेश्वर तुम्हारा भला करे और उस वाचा को स्मरण करे जो उसने अपने विश्वासयोग्य दासों[a] अब्राहम, इसहाक और याकूब के साथ बाँधी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्य सेवकों’। यूनानी शब्द दासों को सूचित करता है और परमेश्वर से उनके स्वामित्व तथा अधीनता के संबंध पर बल देता है।
    reason: ‘दास’ मूल यूनानी की संबंधपरक शक्ति सुरक्षित रखता है, जबकि ‘सेवक’ हिन्दी में अधिक पारंपरिक विकल्प है।
lexical_decisions:
- source_word: ἀγαθοποιῆσαι
  choice: भला करे
  rationale: पत्रात्मक प्रार्थना या मंगलकामना में यह परमेश्वर से पाठकों के हित में कार्य करने की विनती है। ‘भला करे’ सीधा, स्वाभाविक और अर्थ की व्यापकता बनाए रखने वाला अनुवाद है।
- source_word: μνησθῆναι
  choice: स्मरण करे
  rationale: वाचा के प्रसंग में यह केवल मन में याद करने तक सीमित नहीं, बल्कि वाचा पर विश्वासयोग्य रीति से ध्यान देकर उसके अनुसार कार्य करने का संकेत भी दे सकता है। ‘स्मरण करे’ इस बाइबलीय अर्थ-गूँज को बिना विस्तार जोड़े सुरक्षित रखता है।
- source_word: διαθήκης
  choice: वाचा
  rationale: अब्राहम, इसहाक और याकूब के स्पष्ट उल्लेख के कारण यहाँ सामान्य समझौता नहीं, परमेश्वर की बाइबलीय वाचा अभिप्रेत है।
- source_word: δούλων
  choice: दासों
  rationale: यूनानी शब्द उन व्यक्तियों को सूचित करता है जो अपने स्वामी के अधिकार में और उससे संबद्ध हैं। हिन्दी में ‘दास’ इस संबंध को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है, जबकि इस प्रसंग में गरिमापूर्ण भी है।
- source_word: πιστῶν
  choice: विश्वासयोग्य
  rationale: यह विशेषण कुलपिताओं को परमेश्वर के प्रति निष्ठावान और भरोसेमंद दासों के रूप में चित्रित करता है। ‘विश्वासयोग्य’ दोनों अर्थ-छायाओं को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: कुलपिताओं के लिए δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: मूल शब्द परमेश्वर से उनके संबंध में स्वामित्व और पूर्ण अधीनता की धारणा रखता है। ‘दास’ इसे सुरक्षित रखता है; अधिक पारंपरिक और कोमल ‘सेवक’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- issue: परमेश्वर के ‘स्मरण’ का आशय
  choice: स्मरण करे
  alternative: अपनी वाचा का ध्यान रखे और उसके अनुसार कार्य करे
  rationale: मूल क्रिया में वाचा के अनुरूप कार्य करने का संकेत हो सकता है, पर मुख्य पाठ में उसे स्पष्ट रूप से जोड़ना अर्थ को आवश्यकता से अधिक निश्चित कर देगा। संक्षिप्त अनुवाद मूल की अर्थगत गहराई और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और प्रार्थनामय रूप अपनाया गया है। ‘जो उसने…के साथ बाँधी थी’ यूनानी संबंधवाचक संरचना को स्वाभाविक हिन्दी में खोलता है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘अब्राहम, इसहाक और याकूब’ रखे गए हैं।
