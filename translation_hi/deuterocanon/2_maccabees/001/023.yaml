  yaml_path: translation/deuterocanon/2_maccabees/001/023.yaml
  text: And when the sacrifice had been consumed[a], the priests and all the others offered prayer, with Jonathan leading and the rest responding, as in Nehemiah's time.
translation:
  language: hi
  text: और जब बलिदान भस्म हो रहा था, तब याजकों और बाकी सब लोगों ने प्रार्थना की। योनातान ने आरम्भ किया और बाकी लोगों ने प्रत्युत्तर दिया—वैसे ही जैसे नहेमायाह के समय में हुआ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योनातान ने आरम्भ किया और बाकी लोगों ने पुकारकर प्रत्युत्तर दिया, जैसे नहेमायाह ने किया था।” पद के अन्त में यूनानी वाक्य बहुत संक्षिप्त है; इसलिए नहेमायाह से की गई तुलना का ठीक आशय एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν ... ἐποιήσαντο
  choice: प्रार्थना की
  rationale: यूनानी मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; यह सामूहिक उपासना की क्रिया को स्पष्ट रखता है।
- source_word: δαπανωμένης τῆς θυσίας
  choice: जब बलिदान भस्म हो रहा था
  rationale: वर्तमान कृदन्त का समकालिक भाव रखते हुए δαπανάω के ‘खपने/समाप्त होने’ के अर्थ को बलिदान के प्रसंग में स्वाभाविक ढंग से व्यक्त करता है; ‘भस्म’ प्रसंगानुकूल है, यद्यपि यूनानी में आग का उल्लेख प्रत्यक्ष नहीं है।
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: याजकों और बाकी सब लोगों ने
  rationale: याजकों के साथ उपस्थित अन्य सभी लोगों को प्रार्थना के कर्ता के रूप में स्पष्ट करता है और यूनानी पुनरुक्ति को सहज हिन्दी में समेटता है।
- source_word: καταρχομένου Ἰωνάθον
  choice: योनातान ने आरम्भ किया
  rationale: κατάρχομαι के आरम्भ करने अथवा अगुवाई करने के भाव को बिना अनावश्यक रूप से ‘गान’ जोड़ने के व्यक्त करता है।
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: बाकी लोगों ने प्रत्युत्तर दिया
  rationale: ἐπιφωνέω में निहित पुकारकर उत्तर देने के सामूहिक, सम्भवतः प्रतिउत्तरात्मक उपासना-भाव को संक्षेप में रखता है।
- source_word: ὡς Νεεμίου
  choice: वैसे ही जैसे नहेमायाह के समय में हुआ था
  rationale: संक्षिप्त और व्याकरणतः अस्पष्ट यूनानी तुलना को ऐतिहासिक ढंग से समझने योग्य बनाता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ὡς Νεεμίου में नहेमायाह से तुलना का सटीक आशय
  choice: नहेमायाह के समय की रीति अथवा घटना से तुलना
  alternative: ‘जैसे नहेमायाह ने किया था,’ जिससे नहेमायाह स्वयं प्रार्थना आरम्भ करने वाला समझा जा सकता है
  rationale: यूनानी वाक्यांश अत्यन्त संक्षिप्त है और तुलना का लुप्त पद निश्चित नहीं है। मुख्य पाठ ऐतिहासिक-सामूहिक अर्थ देता है, पर वैकल्पिक व्यक्तिगत अर्थ को पादटिप्पणी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। ‘याजक,’ ‘बलिदान’ और ‘प्रत्युत्तर’ धार्मिक प्रसंग की औपचारिकता रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
