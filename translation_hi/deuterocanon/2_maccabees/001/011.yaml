  yaml_path: translation/deuterocanon/2_maccabees/001/011.yaml
  text: Having been saved by God from great dangers[a], we give him great thanks, as those about to array ourselves against a king.
translation:
  language: hi
  text: परमेश्वर ने हमें बड़े-बड़े खतरों से बचाया है; इसलिए हम उसका बहुत धन्यवाद करते हैं, मानो हम किसी राजा के विरुद्ध युद्ध-पंक्ति में खड़े होने वाले हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो हम किसी राजा के विरुद्ध युद्ध-पंक्ति में खड़े किए गए हों।” यूनानी में तुलना संक्षिप्त है और सैन्य व्यूह का बिंब रखती है; क्रिया का मध्य/कर्मवाच्य भाव दोनों प्रकार से समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: बड़े-बड़े खतरों से
  rationale: κίνδυνος का अर्थ ‘खतरा’ या ‘संकट’ है। दोहराव वाला ‘बड़े-बड़े’ बहुवचन और μεγάλων की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ τοῦ θεοῦ σεσωσμένοι
  choice: परमेश्वर ने हमें ... बचाया है
  rationale: ὑπό के साथ संबंधकारक परमेश्वर को उद्धार का स्पष्ट कर्ता बताता है। σῴζω का पूर्णकालिक कर्मवाच्य कृदन्त पूरी हो चुकी क्रिया और उसके वर्तमान परिणाम को सूचित करता है; हिन्दी का ‘बचाया है’ इसे सहज रूप से व्यक्त करता है।
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: हम उसका बहुत धन्यवाद करते हैं
  rationale: ‘बहुत’ μεγάλως की तीव्रता को और ‘उसका’ αὐτῷ के स्पष्ट संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὡς ἂν
  choice: मानो
  rationale: यह पदबंध तुलना या संभाव्य उपमा प्रस्तुत करता है। ‘मानो’ इस अनिश्चित तुलनात्मक भाव को बिना पूर्णतः निश्चित किए सुरक्षित रखता है।
- source_word: πρὸς βασιλέα παρατασσόμενοι
  choice: किसी राजा के विरुद्ध युद्ध के लिए मोर्चा बाँध रहे हों
  rationale: παρατάσσω सैन्य पंक्ति या व्यूह में खड़े होने का बिंब रखता है और πρός यहाँ विरोधी दिशा में ‘विरुद्ध’ का अर्थ देता है। ‘मोर्चा बाँधना’ आधुनिक हिन्दी में इस सैन्य बिंब को स्पष्ट और स्वाभाविक रखता है। अनिश्चित βασιλέα के लिए ‘किसी राजा’ उपयुक्त है।
theological_decisions:
- issue: छुटकारे में परमेश्वर की भूमिका
  choice: परमेश्वर को सीधे तौर पर बचाने वाला कर्ता बताया गया है।
  alternative: इसे सामान्य या अस्पष्ट दैवी सहायता के रूप में व्यक्त करना।
  rationale: यूनानी ὑπὸ τοῦ θεοῦ सेσωσμένοι स्पष्ट रूप से परमेश्वर की कर्तृता बताता है; अनुवाद इसे कमज़ोर नहीं करता।
- issue: राजा के विरुद्ध सैन्य तुलना का संबंध
  choice: तुलना को ‘मानो’ के द्वारा खुला और संक्षिप्त रखा गया है।
  alternative: इसे निश्चित ऐतिहासिक युद्ध-वर्णन या स्पष्ट भविष्यकालीन युद्ध के रूप में समझाना।
  rationale: ὡς ἂν और कृदन्त का संयोजन संक्षिप्त तथा कुछ हद तक अस्पष्ट है। पाठ यह स्पष्ट नहीं करता कि यह वास्तविक, काल्पनिक या आसन्न युद्ध-पंक्ति का उल्लेख है; इसलिए किसी एक व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मुख्य वाक्य में कृदन्तीय आरंभ को स्वाभाविक हिन्दी के दो जुड़े उपवाक्यों में बदला गया है। ‘मोर्चा बाँध रहे हों’ सैन्य बिंब को संप्रेषित करता है, जबकि पादटिप्पणी मध्य/कर्मवाच्य अर्थ और यूनानी की वास्तविक अस्पष्टता को सुरक्षित रखती है।
