  yaml_path: translation/deuterocanon/2_maccabees/001/017.yaml
  text: Blessed in every way is our God[a], who gave up those who acted wickedly.
translation:
  language: hi
  text: हर प्रकार से धन्य है हमारा परमेश्वर, जिसने अधर्म करनेवालों को सौंप दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘दे दिया’ भी हो सकता है। यूनानी पाठ में यह नहीं बताया गया कि परमेश्वर ने उन्हें किसे सौंपा या दिया।
    reason: मूल क्रिया और उसके अप्रकट प्राप्तकर्ता से जुड़ी वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: κατὰ πάντα
  choice: हर प्रकार से
  rationale: यह क्रियाविशेषणीय पद εὐλογητός के अर्थ को प्रबल करता है और उसकी समग्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὐλογητὸς
  choice: धन्य
  rationale: परमेश्वर के लिए प्रयुक्त इस विधेय विशेषण का यह प्रतिष्ठित, गरिमापूर्ण और स्तुतिपरक हिन्दी रूप है।
- source_word: ἡμῶν ὁ θεός
  choice: हमारा परमेश्वर
  rationale: यह यूनानी संबंधसूचक रचना का स्वाभाविक हिन्दी रूप है और मूल में निहित सामुदायिक संबंध को बनाए रखता है।
- source_word: ἔδωκεν
  choice: सौंप दिया
  rationale: मूल क्रिया का सामान्य अर्थ ‘दिया’ है, पर इस शत्रुतापूर्ण अथवा न्याय-संबंधी प्रसंग में किसी को दूसरे के अधिकार में कर देने का भाव संभव है। ‘सौंप दिया’ संभावित आशय व्यक्त करता है, पर प्राप्तकर्ता को नहीं जोड़ता।
- source_word: τοὺς ἀσεβήσαντας
  choice: अधर्म करनेवालों को
  rationale: ἀσεβέω नैतिक और धार्मिक अपराधपूर्ण आचरण को सूचित करता है। ‘अधर्म करनेवाले’ इस संयुक्त भाव को संप्रदायगत अर्थ जोड़े बिना सुबोध हिन्दी में रखता है।
theological_decisions:
- issue: ἔδωκεν के साथ प्राप्तकर्ता का अस्पष्ट रहना
  choice: परमेश्वर ने अधर्म करनेवालों को सौंप दिया, पर किसके हाथ में सौंपा यह मुख्य पाठ में नहीं जोड़ा गया।
  alternative: परमेश्वर ने अधर्म करनेवालों को हमारे हाथ में कर दिया; अथवा केवल ‘दे दिया’।
  rationale: प्रसंग न्याय या पराजय के लिए शत्रुओं को सौंपे जाने का संकेत देता है, किंतु यूनानी पाठ प्राप्तकर्ता को स्पष्ट नहीं करता। इसलिए संभावित अर्थ रखा गया है और अनकही बात को मुख्य पाठ में नहीं भरा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धन्य’ स्तुतिपरक धार्मिक शैली को बनाए रखता है, जबकि वाक्य-विन्यास साधारण पाठक के लिए स्वाभाविक है।
