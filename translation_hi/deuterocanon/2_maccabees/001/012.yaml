- from: क्योंकि उसने स्वयं पवित्र नगर में युद्ध के लिए पाँति बाँधे हुए लोगों को बलपूर्वक निकालकर फ़ारस पहुँचा दिया।[a][b]
  to: क्योंकि उसने स्वयं पवित्र नगर में युद्ध के लिए पंक्तिबद्ध लोगों[b] को फ़ारस में खदेड़ दिया।[a]
  rationale: The revision replaces the arrival-focused ‘पहुँचा दिया’ with ‘फ़ारस में खदेड़ दिया,’ which naturally conveys forceful removal into Persia. It also uses the more idiomatic modern expression ‘युद्ध के लिए पंक्तिबद्ध’ and moves each footnote marker to its corresponding term. No interpretive identification of the actor or the displaced group has been added.
