review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the explanatory γάρ, the intensive force of αὐτός, the military sense of παρατασσομένους, the locative ‘in the holy city,’ and movement toward Persia. However, ‘निकालकर फ़ारस पहुँचा दिया’ can suggest simply causing them to arrive, rather than the forceful expulsion expressed by ἐξέβρασεν.
  naturalness: ‘पाँति बाँधे हुए’ is understandable but comparatively marked and less natural in modern standard Hindi than ‘युद्ध के लिए पंक्तिबद्ध.’ ‘फ़ारस में खदेड़ दिया’ idiomatically conveys driving persons into Persia while retaining the force of the verb.
  terminology: ‘पवित्र नगर’ and ‘फ़ारस’ are suitable. ‘युद्ध के लिए पंक्तिबद्ध लोग’ accurately preserves the military formation without adding that they were specifically enemies or soldiers.
  issues:
  - severity: medium
    issue: The verb phrase ‘बलपूर्वक निकालकर फ़ारस पहुँचा दिया’ weakens the direct expulsion imagery.
    rationale: ἐξέβρασεν denotes forceful driving or expulsion. ‘पहुँचा दिया’ foregrounds arrival rather than being driven out; ‘खदेड़ दिया’ better preserves the lexical force.
  - severity: low
    issue: ‘पाँति बाँधे हुए’ is less idiomatic than a modern military-formational expression.
    rationale: ‘युद्ध के लिए पंक्तिबद्ध’ is natural, dignified modern Hindi and directly reflects the participle’s sense of being drawn up for battle.
  - severity: low
    issue: Footnote anchors should be placed immediately after the word or phrase they explain.
    rationale: This makes the lexical alternatives for the forceful verb and military participle unambiguous.
  revised_text: क्योंकि उसने स्वयं पवित्र नगर में युद्ध के लिए पंक्तिबद्ध लोगों[b] को फ़ारस में खदेड़ दिया।[a]
