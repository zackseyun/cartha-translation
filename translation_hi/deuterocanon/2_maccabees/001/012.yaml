  yaml_path: translation/deuterocanon/2_maccabees/001/012.yaml
  text: For he himself drove those arrayed for battle in the holy city out into Persia[a][b].
translation:
  language: hi
  text: क्योंकि उसने स्वयं पवित्र नगर में युद्ध के लिए पंक्तिबद्ध लोगों[b] को फ़ारस में खदेड़ दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाहर निकाल दिया’ अथवा ‘बलपूर्वक निकाल दिया’; यूनानी क्रिया बलपूर्ण और निर्णायक निष्कासन का बोध कराती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘युद्ध-विन्यास में खड़े लोगों को’; यूनानी कृदन्त युद्ध के लिए क्रमबद्ध होकर खड़े व्यक्तियों के लिए प्रयुक्त सैनिक शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: उसने स्वयं
  rationale: बलसूचक सर्वनाम कर्ता की प्रत्यक्ष और व्यक्तिगत भूमिका पर जोर देता है; ‘स्वयं’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए व्याख्यात्मक या कारणसूचक संबंध व्यक्त करता है।
- source_word: ἐξέβρασεν
  choice: बलपूर्वक निकालकर ... पहुँचा दिया
  rationale: क्रिया निर्णायक और बलपूर्ण निष्कासन दर्शाती है। गंतव्य के साथ यह हिन्दी प्रयोग निष्कासन तथा फ़ारस की ओर गति—दोनों को व्यक्त करता है।
- source_word: τοὺς παρατασσομένους
  choice: युद्ध के लिए पाँति बाँधे हुए लोगों
  rationale: यह कृदन्त सैनिकों या लड़ाकों के युद्ध-विन्यास में खड़े होने को दर्शाता है; इसे केवल ‘शत्रु’ कहना मूल से अधिक विशिष्ट होता।
- source_word: ἐν τῇ ἁγίᾳ πόλει
  choice: पवित्र नगर में
  rationale: यह यूनानी के स्थानसूचक अर्थ और नगर के पवित्र पदनाम को सीधे बनाए रखता है।
- source_word: εἰς τὴν Περσίδα
  choice: फ़ारस पहुँचा दिया
  rationale: εἰς फ़ारस की ओर अथवा उसके भीतर गति दर्शाता है। हिन्दी वाक्य में ‘पहुँचा दिया’ गंतव्य को स्पष्ट करता है, बिना ‘फ़ारस तक’ जैसा अनावश्यक सीमा-बोध जोड़े।
theological_decisions:
- issue: उद्धार या पराजय के कथन में कर्ता पर बल
  choice: ‘उसने स्वयं’ द्वारा प्रत्यक्ष कर्तृत्व पर मूल का जोर सुरक्षित रखा गया है, लेकिन इस पद के तात्कालिक संदर्भ से परे कर्ता की पहचान नहीं जोड़ी गई।
  alternative: केवल ‘उसने’
  rationale: αὐτός यहाँ बलसूचक है। अनुवाद उस बल को बनाए रखता है, पर कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। ‘पाँति बाँधे हुए’ सैन्य विन्यास को सामान्य पाठक के लिए बोधगम्य रखता है; ‘फ़ारस’ प्रचलित आधुनिक स्थान-नाम है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
