lexical_decisions:
- source_word: ἀνηλώθη
  choice: भस्म हो गई
  rationale: बलि और आग के प्रसंग में क्रिया सामग्री के पूरी तरह जलकर समाप्त हो जाने को व्यक्त करती है। ‘भस्म हो गई’ परिणाम और प्रसंग दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: τὰ τῆς θυσίας
  choice: बलि की सारी सामग्री
  rationale: नपुंसकलिंग बहुवचन पदबंध केवल बलि की क्रिया नहीं, बल्कि उससे संबंधित वस्तुओं या सामग्री को सूचित करता है। ‘सारी सामग्री’ बहुवचन की व्यापकता और पूर्ण उपभोग का भाव स्पष्ट करता है।
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: बचा हुआ पानी
  rationale: यह उस पानी को दर्शाता है जो पहले की कार्रवाई के बाद शेष रह गया था; यह आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: ἐκέλευσεν
  choice: आज्ञा दी
  rationale: क्रिया अधिकारपूर्वक निर्देश देने को व्यक्त करती है। ‘आज्ञा दी’ गरिमापूर्ण कथात्मक शैली के अनुकूल है।
- source_word: λίθους μείζονας
  choice: बड़े पत्थरों
  rationale: मूल में तुलनात्मक विशेषण है, जिसका शाब्दिक अर्थ ‘अधिक बड़े’ है। हिन्दी में स्पष्ट तुलना का आधार न होने के कारण ‘बड़े पत्थर’ अधिक स्वाभाविक है, जबकि आकार का भाव सुरक्षित रहता है।
- source_word: καταχεῖν
  choice: पर उँडेल दिया जाए
  rationale: क्रिया ऊपर से किसी वस्तु पर तरल डालने का अर्थ देती है। आज्ञा की अप्रत्यक्ष रचना में कर्मवाच्य हिन्दी स्वाभाविक है।
