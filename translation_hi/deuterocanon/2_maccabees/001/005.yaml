  text: और वह तुम्हारी प्रार्थनाएँ सुने[a], तुमसे मेल करे[b], और बुरे समय में[c] तुम्हें न छोड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी विनतियों पर ध्यान दे।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम पर फिर अनुग्रह करे” अथवा “तुम्हारे प्रति अनुकूल हो जाए।”
    reason: alternative_reading
  - marker: c
    text: या, “विपत्ति के समय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακούσαι
  choice: सुने
  rationale: प्रार्थना के संदर्भ में यह क्रिया केवल ध्वनि सुनने के बजाय ध्यान देकर सुनने का भाव रखती है। ‘सुने’ हिन्दी में स्वाभाविक प्रार्थनात्मक अभिव्यक्ति है और ‘उत्तर दे’ जैसा अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: τῶν δεήσεων
  choice: प्रार्थनाएँ
  rationale: δέησις विशेष रूप से विनती या याचना का बोध करा सकता है। ‘प्रार्थनाएँ’ सामान्य पाठक के लिए सहज है; अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: καταλλαγείη
  choice: तुमसे मेल कर ले
  rationale: यह रूप बिगड़े हुए संबंध या अप्रसन्नता के बाद मेल अथवा अनुग्रह की पुनर्स्थापना व्यक्त करता है। यह अनुवाद भावनात्मक तुष्टीकरण या किसी विशेष प्रायश्चित-विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐγκαταλίποι
  choice: छोड़े
  rationale: यहाँ क्रिया का अर्थ त्याग देना या बेसहारा छोड़ देना है। ‘न छोड़े’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐν καιρῷ πονηρῷ
  choice: बुरे समय में
  rationale: यह अनुवाद καιρός के ‘समय/अवसर’ और πονηρός के ‘बुरा, अनिष्टकारी, कष्टमय’ अर्थ को निकटता से रखता है तथा नैतिक बुराई और विपत्ति—दोनों संभावित रंगों को पूरी तरह समाप्त नहीं करता।
theological_decisions:
- issue: καταλλαγείη को परमेश्वर के तुष्ट होने के रूप में समझा जाए या संबंध के फिर मेल में आने के रूप में
  choice: तुमसे मेल कर ले
  alternative: तुम पर फिर अनुग्रह करे; तुम्हारे प्रति शांत हो जाए
  rationale: यूनानी शब्द संबंध और अनुग्रह की पुनर्स्थापना का संकेत देता है, पर उसके साधन या परमेश्वर की भावनात्मक दशा को स्पष्ट नहीं करता। ‘मेल कर ले’ इसी धार्मिक तनाव और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बहुवचन संबोधन के लिए ‘तुम्हारी/तुम्हें’ का प्रयोग किया गया है। यूनानी के इच्छासूचक क्रियारूपों को हिन्दी में ‘सुने’, ‘कर ले’ और ‘न छोड़े’ से व्यक्त किया गया है।
