base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/034.yaml
  text: Therefore Menelaus took Andronicus aside privately and urged him to strike down Onias by treachery[a]. Andronicus went to Onias, and after winning his confidence by deceit and greeting him with oaths, giving him his right hand, though he was under suspicion, he persuaded him to come out from the place of asylum. Then he immediately shut him away[c][b], showing no regard for justice.
translation:
  language: hi
  text: इसलिए मेनेलाउस ने अन्द्रोनिकुस को एकान्त में ले जाकर उससे आग्रह किया कि वह छल से ओनियास का वध करे[a]। अन्द्रोनिकुस ओनियास के पास गया और छल से उसका विश्वास जीत लिया। फिर उसने शपथ खाकर उससे मित्रता जताई और अपना दाहिना हाथ उसे दिया। यद्यपि अन्द्रोनिकुस संदेह के घेरे में था, फिर भी उसने ओनियास को शरण-स्थान से बाहर आने के लिए मना लिया[b]। तब उसने उसे तुरन्त बन्दी बना दिया[c] और न्याय का तनिक भी लिहाज़ नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी शब्द पाठगत और शब्दार्थगत दृष्टि से कठिन है। प्रसंग का आशय यह है कि मेनेलाउस ने एकान्त में अन्द्रोनिकुस से ओनियास की छलपूर्वक हत्या कराने का आग्रह किया।
    reason: textual_variant
  - marker: b
    text: या ‘पवित्रस्थान से बाहर आने’ अथवा ‘शरणस्थल छोड़ने’। यूनानी शब्द एक ऐसे सुरक्षित स्थान को दर्शाता है जहाँ शरण लेने वाले को हाथ नहीं लगाया जा सकता था।
    reason: lexical_alternative
  - marker: c
    text: प्रसंग में इसका अधिक प्रबल अर्थ ‘उसकी हत्या कर दी’ या ‘उसे मरवा डाला’ हो सकता है, यद्यपि यहाँ की यूनानी क्रिया स्वयं इतनी स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह शब्द पिछली परिस्थिति से परिणाम या निष्कर्ष की ओर संकेत करता है; ‘इसलिए’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λαβὼν ἰδίᾳ
  choice: एकान्त में ले जाकर
  rationale: यह पद निजी और गोपनीय बातचीत का भाव देता है तथा षड्यंत्रपूर्ण प्रसंग के अनुकूल है।
- source_word: παρεκάλει
  choice: आग्रह किया
  rationale: यहाँ मेनेलाउस अन्द्रोनिकुस को अपराध करने के लिए उकसा रहा है; ‘आग्रह किया’ क्रिया की निरन्तर और दबावपूर्ण शक्ति को व्यक्त करता है।
- source_word: χειρόγραφον
  choice: वध करे
  rationale: प्रेषित यूनानी शब्द पाठगत और शब्दार्थगत दृष्टि से कठिन है। प्रसंग स्पष्ट रूप से ओनियास की छलपूर्वक हत्या की योजना की ओर संकेत करता है, इसलिए मुख्य पाठ में अर्थ दिया गया है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: παραγόμενος ἐπὶ τὸν Ὀνίαν
  choice: ओनियास के पास गया
  rationale: यह ओनियास की ओर जाने या उसके निकट पहुँचने की सीधी अभिव्यक्ति है।
- source_word: πεισθεὶς ἐπὶ δόλῳ
  choice: छल से उसका विश्वास जीत लिया
  rationale: पद छलपूर्ण मनाने का भाव देता है। व्यापक वाक्य में ओनियास को बाहर आने के लिए मनाया जाता है, इसलिए हिन्दी में विश्वास जीतने का परिणाम स्पष्ट किया गया है।
- source_word: δεξιωθεὶς μεθʼ ὅρκων
  choice: शपथ खाकर उससे मित्रता जताई
  rationale: क्रिया स्वागत, मैत्रीपूर्ण व्यवहार या आश्वासन की ओर संकेत करती है और शपथों से पुष्ट है; चुना गया रूप बाहरी मित्रता और भीतरी छल दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: δοὺς δεξιάν
  choice: अपना दाहिना हाथ उसे दिया
  rationale: शाब्दिक रूप प्राचीन विश्वास और प्रतिज्ञा के संकेत को सुरक्षित रखता है, बिना उसे आधुनिक हाथ मिलाने तक सीमित किए।
- source_word: καίπερ ἐν ὑποψίᾳ κείμενος
  choice: यद्यपि अन्द्रोनिकुस संदेह के घेरे में था
  rationale: यह रियायती वाक्यांश पहले से विद्यमान संदेह बताता है। कर्ता को हिन्दी में स्पष्ट किया गया है, पर संदेह किसका था यह अनिर्धारित रखा गया है।
- source_word: ἔπεισεν ἐκ τοῦ ἀσύλου προελθεῖν
  choice: शरण-स्थान से बाहर आने के लिए मना लिया
  rationale: ἄσυλον सुरक्षित और अलंघनीय शरण को दर्शाता है। ‘शरण-स्थान’ उसके कानूनी-सुरक्षात्मक भाव को रखता है, जबकि ‘पवित्रस्थान’ सम्भव किन्तु अधिक संकीर्ण विकल्प है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह तत्काल घटित कार्रवाई को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: παρέκλεισεν
  choice: बंद कर दिया
  rationale: क्रिया का प्रत्यक्ष अर्थ किसी को बंद या अलग कर देना है। प्रसंग में यह ओनियास की हत्या की ओर संकेत कर सकती है, पर मुख्य पाठ यूनानी की अपेक्षाकृत कम स्पष्ट अभिव्यक्ति को बनाए रखता है; प्रबल प्रसंगगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: οὐκ αἰδεσθεὶς τὸ δίκαιον
  choice: न्याय का तनिक भी लिहाज़ नहीं किया
  rationale: यह न्याय के प्रति लज्जा, सम्मान या संकोच न रखने को व्यक्त करता है; चुनी हुई हिन्दी वर्तमान, स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: ἄσυλον का स्वरूप
  choice: शरण-स्थान
  alternative: पवित्रस्थान; शरणस्थल
  rationale: यह शब्द संरक्षित और अलंघनीय आश्रय को सूचित करता है, जिसमें इस प्रसंग में धार्मिक पवित्रता भी निहित हो सकती है। ‘शरण-स्थान’ सुरक्षा के मूल भाव को रखता है, बिना इसे केवल मन्दिर-संबंधी अर्थ तक सीमित किए।
- issue: प्रसंग में παρέκλεισεν का बल
  choice: बंद कर दिया
  alternative: उसकी हत्या कर दी; उसे पकड़कर मरवा डाला
  rationale: निकटवर्ती और व्यापक प्रसंग ओनियास की मृत्यु की ओर संकेत करता है, पर प्रयुक्त यूनानी क्रिया स्वयं ‘मार डालना’ स्पष्ट रूप से नहीं कहती। इसलिए मुख्य पाठ में कम स्पष्टता सुरक्षित रखी गई है और हत्या वाला सम्भावित अर्थ पादटिप्पणी में बताया गया है।
- issue: संदेह का संबंध
  choice: अन्द्रोनिकुस संदेह के घेरे में था
  alternative: स्थिति संदेहास्पद थी; ओनियास को उस पर संदेह था
  rationale: यूनानी रचना व्याकरणतः अन्द्रोनिकुस से जुड़ती है, लेकिन यह नहीं बताती कि किसे संदेह था। अनुवाद कर्ता को स्पष्ट करता है, पर संदेह करने वाले की पहचान नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज कथात्मक शैली रखी गई है। नामों का रूप ‘मेनेलाउस’, ‘अन्द्रोनिकुस’ और ‘ओनियास’ रखा गया है। छोटे वाक्यों से जटिल यूनानी कृदन्त-रचना को स्पष्ट किया गया है, पर छल, संदेह, शरण की अलंघनीयता और अन्तिम क्रिया की वास्तविक शब्दार्थगत अनिश्चितता सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पदों के साथ दिए गए हैं।
