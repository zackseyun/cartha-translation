  text: उसने अन्यायपूर्ण हाथों से प्रहार करना शुरू किया[a]; औरानुस नाम का एक व्यक्ति अगुवाई कर रहा था, जो उम्र में तो बहुत आगे बढ़ चुका था, पर अज्ञान में भी उतना ही आगे बढ़ा हुआ था।
  philosophy: optimal-equivalence
