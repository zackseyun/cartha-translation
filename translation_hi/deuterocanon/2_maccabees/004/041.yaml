  rationale: यह वाक्यांश वृद्धावस्था को दर्शाता है और अगले व्यंग्यपूर्ण समानांतर के लिए ‘आगे बढ़ना’ की छवि बनाए रखता है।
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: पर अज्ञान में भी उससे कुछ कम नहीं
  rationale: यह उम्र और अज्ञान के बीच जानबूझकर किया गया तीखा तुलनात्मक शब्द-खेल सुरक्षित रखता है, बिना उसे केवल सामान्य ‘बहुत अज्ञानी’ में बदलने के।
