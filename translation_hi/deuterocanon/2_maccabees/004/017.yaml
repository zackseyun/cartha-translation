  text: For it is not easy to act wickedly against the divine laws[b][a]; but the time that follows will make these things clear.
translation:
  language: hi
  text: क्योंकि परमेश्वर की व्यवस्थाओं के विरुद्ध अधर्म करना कोई मामूली बात नहीं है; पर आगे आने वाला समय इन बातों को स्पष्ट कर देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβεῖν
  choice: अधर्म करना
  rationale: यह क्रिया परमेश्वर के प्रति श्रद्धाहीन और भक्तिहीन आचरण को व्यक्त करती है, केवल मन की अवस्था को नहीं। ‘अधर्म करना’ धार्मिक और नैतिक दोनों आयामों को स्वाभाविक हिन्दी में समेटता है।
- source_word: θείους νόμους
  choice: परमेश्वर की व्यवस्थाओं
  rationale: यहूदी संदर्भ में θείους का आशय परमेश्वर से संबंधित है। ‘परमेश्वर की व्यवस्थाएँ’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और νόμους के बहुवचन को बनाए रखता है।
- source_word: οὐ ῥᾴδιον
  choice: कोई मामूली बात नहीं है
  rationale: शाब्दिक अर्थ ‘आसान नहीं’ है, पर यहाँ प्रसंगानुसार यह कार्य की कठिनता से अधिक उसकी गंभीरता और परिणामों की चेतावनी देता है। यह अभिव्यक्ति उसी नपे-तुले नैतिक बल को हिन्दी में स्पष्ट करती है।
- source_word: ὁ ἀκόλουθος καιρός
  choice: आगे आने वाला समय
  rationale: यह क्रमशः आने वाले समय को सूचित करता है, बिना उसे विशेष रूप से अन्तकाल संबंधी अर्थ दिए।
- source_word: δηλώσει
  choice: स्पष्ट कर देगा
  rationale: क्रिया का अर्थ किसी बात को प्रकट, प्रत्यक्ष या स्पष्ट करना है। यह चयन आगामी घटनाओं द्वारा वास्तविकता खुलने का भाव रखता है।
theological_decisions:
- issue: परमेश्वर की व्यवस्थाओं के विरुद्ध अधर्म के कथन का बल
  choice: यह कोई मामूली या परिणामहीन बात नहीं है; आगे की घटनाएँ इसकी गंभीरता स्पष्ट करेंगी।
  alternative: ऐसा अधर्म करना व्यावहारिक रूप से कठिन है।
  rationale: οὐ ῥᾴδιον का शाब्दिक अर्थ ‘आसान नहीं’ हो सकता है, किंतु अगले समय द्वारा बात स्पष्ट किए जाने का विरोध-संबंध नैतिक गंभीरता की चेतावनी की ओर संकेत करता है। फिर भी अनुवाद स्पष्ट रूप से ‘दिव्य न्याय’ जोड़कर मूल से आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यवस्था’ का बहुवचन मूल यूनानी के νόμους को सुरक्षित रखता है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
