  yaml_path: translation/deuterocanon/2_maccabees/004/011.yaml
  text: And he set aside the royal provisions laid down for the Jews through John[a], the father of Eupolemus—the one who had carried out the embassy to the Romans concerning friendship and alliance—and, while abolishing the lawful institutions[b], he introduced unlawful customs.
translation:
  language: hi
  text: और उसने यूहन्ना के माध्यम से यहूदियों के लिए स्थापित किए गए हितकारी राजकीय प्रावधानों[a] को दरकिनार कर दिया—यह यूहन्ना यूपोलेमुस का पिता था, जिसने रोमियों के साथ मित्रता और गठबंधन के विषय में राजनयिक दूतकार्य किया था—और वह विधिसम्मत नागरिक व्यवस्थाओं[b] को समाप्त करते हुए विधि-विरुद्ध रीति-रिवाज शुरू करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदियों के लिए निर्धारित किए गए उदार राजकीय प्रावधान,” “हितकारी राजकीय उपाय,” अथवा “मानवीय राजकीय आदेश।”
    reason: lexical_alternative
  - marker: b
    text: या “विधिसम्मत संस्थाएँ” अथवा “विधिसम्मत नागरिक शासन-व्यवस्था।” यूनानी शब्द किसी समुदाय की स्थापित नागरिक, संवैधानिक या सार्वजनिक व्यवस्था को व्यापक रूप से सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κείμενα ... φιλάνθρωπα βασιλικὰ
  choice: निर्धारित किए गए उदार राजकीय प्रावधानों
  rationale: κείμενα स्थापित अथवा प्रभावी प्रावधानों की ओर संकेत करता है; φιλάνθρωπα उनका हितकारी या उदार स्वरूप और βασιλικά उनका राजकीय स्रोत व्यक्त करता है।
- source_word: διὰ Ἰωάννου
  choice: यूहन्ना के माध्यम से
  rationale: διά के साथ संबंधकारक यहाँ माध्यम या अभिकरण बताता है; वाक्य की वास्तविक अस्पष्टता को किसी अधिक विशिष्ट ऐतिहासिक दावे में नहीं बदला गया।
- source_word: παρώσας
  choice: दरकिनार कर दिया
  rationale: क्रिया का अर्थ पहले से स्थापित उपायों को परे करना या उनकी उपेक्षा करना है; यह अनिवार्य रूप से औपचारिक निरस्तीकरण का दावा नहीं करती।
- source_word: πρεσβείαν
  choice: राजनयिक मिशन
  rationale: यह किसी सामान्य यात्रा के बजाय आधिकारिक दूतकार्य को सूचित करता है; आधुनिक हिन्दी में यह अर्थ सहज और स्पष्ट है।
- source_word: φιλίας καὶ συμμαχίας
  choice: मित्रता और गठबंधन
  rationale: दोनों औपचारिक राजनयिक शब्दों का भेद बनाए रखा गया है; συμμαχία को केवल सामान्य संधि कहकर उसका गठबंधन-संबंधी बल कम नहीं किया गया।
- source_word: νομίμους ... πολιτίας
  choice: विधिसम्मत नागरिक व्यवस्थाओं
  rationale: πολιτεία यहाँ समुदाय की स्थापित सार्वजनिक, नागरिक या संवैधानिक व्यवस्था को सूचित कर सकता है। ‘नागरिक व्यवस्थाएँ’ इस व्यापकता को बनाए रखता है और आधुनिक ‘सरकार के रूपों’ जितना संकीर्ण नहीं है।
- source_word: καταλύων
  choice: समाप्त करके
  rationale: शब्द स्थापित व्यवस्था को भंग करने या मिटा देने की सक्रिय कार्रवाई व्यक्त करता है।
- source_word: παρανόμους ἔθισμους
  choice: विधि-विरुद्ध रीति-रिवाज
  rationale: ἔθισμος प्रचलित रीति या व्यवहार है और παράνομος उसका कानून के विरुद्ध होना बताता है; अनुवाद दोनों पहलुओं को रखता है।
- source_word: ἐκαίνιζεν
  choice: लागू करने लगा
  rationale: अपूर्ण भूतकाल जारी या आरंभ की गई कार्रवाई का भाव दे सकता है; संदर्भ में नई प्रथाओं को प्रचलित करने का अर्थ स्वाभाविक है।
theological_decisions:
- issue: πολιτεία का यहूदी सार्वजनिक व्यवस्था के संदर्भ में अर्थ
  choice: विधिसम्मत नागरिक व्यवस्थाएँ
  alternative: विधिसम्मत संस्थाएँ; विधिसम्मत संविधान; विधिसम्मत नागरिक शासन-व्यवस्था
  rationale: संदर्भ स्थापित यहूदी सामुदायिक और विधिक व्यवस्था को हटाकर दूसरी प्रथाएँ लागू करने का है। चुना गया रूप संस्थागत और सार्वजनिक अर्थ रखता है, पर आधुनिक संवैधानिक शासन की अनावश्यक सटीकता आरोपित नहीं करता।
- issue: φιλάνθρωπα βασιλικά का बल
  choice: उदार राजकीय प्रावधान
  alternative: हितकारी राजकीय उपाय; मानवीय राजकीय आदेश; राजकीय रियायतें
  rationale: मूल पदबंध यहूदियों के पक्ष में किए गए राजकीय उपायों को दर्शाता है। ‘प्रावधान’ तटस्थ विधिक-प्रशासनिक अर्थ देता है और ‘उदार’ φιλάνθρωπα के सकारात्मक भाव को स्पष्ट रखता है।
- issue: παράνομος में ‘विधि’ का संदर्भ
  choice: विधि-विरुद्ध
  alternative: अवैध; व्यवस्था-विरुद्ध
  rationale: पाठ स्वयं यह स्पष्ट नहीं करता कि आशय केवल राजकीय कानून है या यहूदी व्यवस्था-विधान भी; ‘विधि-विरुद्ध’ इस तनाव को बिना सांप्रदायिक व्याख्या के बनाए रखता है।
