  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। लंबे यूनानी वाक्य को स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। ‘यूहन्ना,’ ‘यूपोलेमुस’ और ‘रोमियों’ जैसे रूप हिन्दी बाइबलीय नाम-परंपरा और स्रोत के नामों के बीच संतुलन रखते हैं।
