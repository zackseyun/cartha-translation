base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/001.yaml
  text: But the previously mentioned Simon[a], who had become an informer against the money and the homeland, kept slandering Onias, as though he were the one who had incited Heliodorus and had become the author of the troubles.
translation:
  language: hi
  text: परन्तु पहले बताया गया शमौन, जो धन और स्वदेश के विरुद्ध मुखबिर बन गया था, ओनियास को लगातार बदनाम करता रहा, मानो उसी ने हेलियोदोरुस को उकसाया था और वही इन विपत्तियों[a] का कारण बन गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बुराइयों का कारण।” यूनानी पद का अर्थ व्यापक रूप से हानिकारक घटनाएँ या विपत्तियाँ भी हो सकता है; इसका आशय केवल नैतिक बुराई होना आवश्यक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προειρημένος
  choice: पहले बताया गया
  rationale: यह पहले किए गए उल्लेख की ओर स्पष्ट संकेत करता है और आधुनिक हिन्दी में सहज है।
- source_word: ἐνδείκτης
  choice: के विरुद्ध मुखबिरी करने वाला
  rationale: यह शब्द शत्रुतापूर्ण ढंग से सूचना देने या भेद खोलने वाले व्यक्ति को दर्शाता है; ‘मुखबिरी करने वाला’ उस आरोपात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν χρημάτων
  choice: धन
  rationale: बहुवचन यूनानी पद धनराशि या पैसों को सूचित करता है। ‘धन’ सन्दर्भ को अनावश्यक रूप से केवल मन्दिर के कोष तक सीमित नहीं करता।
- source_word: τῆς πατρίδος
  choice: स्वदेश
  rationale: ‘स्वदेश’ आधुनिक, गरिमापूर्ण हिन्दी में जन्मभूमि या अपने देश के प्रति निहित भाव को व्यक्त करता है।
- source_word: ἐκακολόγει
  choice: निन्दा करता रहा
  rationale: अपूर्ण भूतकाल लगातार या बार-बार की गई कार्रवाई को दर्शाता है; यह अनिष्टकारी और बदनाम करने वाली वाणी का भाव भी रखता है।
- source_word: ἐπισεσυκώς
  choice: उकसाया था
  rationale: यह कृदन्त हेलियोदोरुस को कार्रवाई के लिए भड़काने के कथित कार्य को व्यक्त करता है।
- source_word: τῶν κακῶν δημιουργός
  choice: इन विपत्तियों का कर्ता
  rationale: ‘विपत्तियाँ’ हानिकारक घटनाओं और संकटों का अर्थ देता है, जबकि ‘कर्ता’ जिम्मेदार उत्पन्नकर्ता होने का सक्रिय भाव बनाए रखता है।
- source_word: καθεστηκώς
  choice: बन गया था
  rationale: यह किसी भूमिका या स्थिति में आ जाने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τῶν κακῶν में नैतिक बुराई और हानिकारक घटनाओं के बीच अर्थ-व्याप्ति
  choice: विपत्तियों
  alternative: बुराइयों
  rationale: इस प्रसंग में पद संकटों या हानिकारक घटनाओं को भी सूचित कर सकता है; ‘विपत्तियों’ नैतिक बुराई का अर्थ अनिवार्य किए बिना प्रसंग के दोषारोपण को बनाए रखता है। विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। लम्बे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है। ‘मानो’ की अपेक्षा ‘वह कहता था कि’ से शमौन के आरोप का आशय स्पष्ट किया गया है, पर उसे कथावाचक का तथ्य नहीं बनाया गया।
