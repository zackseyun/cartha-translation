base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/048.yaml
  text: And he released Menelaus[a], the cause of all the evil, from among the accused; but for those wretched men—who, even if they had pleaded their case before Scythians[c][b], would have been acquitted—for them he decreed death.
translation:
  language: hi
  text: और उसने सारी बुराई के लिए ज़िम्मेदार मेनेलाउस को अभियुक्तों में से रिहा कर दिया; पर उन अभागे लोगों को—जो स्किथियाइयों के सामने भी अपना पक्ष रखते, तो दोषी ठहराए बिना रिहा कर दिए जाते[a]—मृत्युदंड सुनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “यदि वे स्किथियाइयों के सामने भी बोलते, तो बिना दोषी ठहराए रिहा कर दिए जाते।” स्किथियाइयों का उल्लेख इस अन्याय की विडंबना को तीखा करता है: जिन्हें अत्यंत कठोर समझा जाता था, वे भी इन लोगों को दोषी न ठहराते।'
    reason: cultural_note
lexical_decisions:
- source_word: τὸν ... αἴτιον
  choice: के लिए ज़िम्मेदार
  rationale: यह प्रयोग कारण होने के साथ नैतिक और न्यायिक उत्तरदायित्व भी व्यक्त करता है; ‘ज़िम्मेदार’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से रखता है।
- source_word: τῆς ὅλης κακίας
  choice: सारी बुराई
  rationale: ὅλης की व्यापकता और κακία का नैतिक नकारात्मक भाव सुरक्षित रहता है; इसे केवल ‘उपद्रव’ कहने से नैतिक आरोप हल्का पड़ सकता है।
- source_word: ἀπέλυσεν τῶν κατηγορημένων
  choice: अभियुक्तों में से छोड़ दिया
  rationale: ἀπολύω का मूल ‘छोड़ देना/रिहा करना’ और κατηγορουμένων का व्यक्तियों के रूप में ‘अभियुक्त’ होना बना रहता है; औपचारिक दोषमुक्ति का अनावश्यक दावा नहीं जोड़ा गया।
- source_word: ταλαιπώροις
  choice: अभागे पुरुषों
  rationale: शब्द उनकी दयनीय और विपत्तिग्रस्त दशा पर करुणा व्यक्त करता है; ‘अभागे’ हिन्दी में इस प्रसंग का करुण भाव सहजता से देता है।
- source_word: οἵτινες εἰ καὶ ἐπὶ Σκυθῶν ἔλεγον
  choice: जो यदि स्कूती लोगों के सामने भी अपना पक्ष रखते
  rationale: ἐπί + संबंधकारक को न्यायिक ‘सामने’ और ἔλεγον की प्रसंगगत अपूर्ण अभिव्यक्ति को ‘अपना पक्ष रखते’ से स्पष्ट किया गया है, बिना कथन में नया तर्क जोड़े।
- source_word: ἀπελύθησαν ἀκατάγνωστοι
  choice: बिना दोषी ठहराए छोड़ दिए जाते
  rationale: यह ἀπολύω के ‘छोड़ने’ और ἀκατάγνωστος के ‘दोषी न ठहराए गए’ दोनों घटकों को सुरक्षित रखता है तथा केवल एक शब्द ‘बरी’ में उन्हें समेटने से बचता है।
- source_word: θάνατον ἀπέκρινεν
  choice: मृत्युदंड सुनाया
  rationale: इस न्यायिक संदर्भ में पदबंध मृत्यु का निर्णय या दंडादेश देने को सूचित करता है; यह हिन्दी में संक्षिप्त और स्वाभाविक न्यायिक अभिव्यक्ति है।
