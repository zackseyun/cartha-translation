base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/039.yaml
  text: But when many acts of temple robbery had been committed in the city by Lysimachus[a], with the consent of Menelaus, and the report had spread outside, the crowd gathered against Lysimachus[b], since much gold had already been plundered.
translation:
  language: hi
  text: पर जब नगर में लिसिमाखुस ने मेनेलाउस की सहमति से मन्दिर की सम्पत्ति को बहुत बार लूटा, और उसकी खबर बाहर फैल गई, तो भीड़ लिसिमाखुस के विरुद्ध इकट्ठी हो गई, क्योंकि सोने की बहुत-सी वस्तुएँ पहले ही लूटी जा चुकी थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱεροσυλημάτων
  choice: मन्दिर की पवित्र वस्तुओं की बहुत-सी चोरियाँ
  rationale: यह शब्द सामान्य अपवित्रता से अधिक, पवित्र अथवा मन्दिर की सम्पत्ति की चोरी को सूचित करता है। बहुवचन को ‘बहुत-सी चोरियाँ’ से बनाए रखा गया है।
- source_word: μετὰ τῆς τοῦ Μενελάου γνώμης
  choice: मेनेलाउस की सहमति से
  rationale: γνώμη यहाँ मेनेलाउस की सम्मति अथवा अनुमोदन बताता है; यह उसकी मिलीभगत स्पष्ट करता है, पर उसे प्रत्यक्ष कर्ता नहीं बनाता।
- source_word: διαδοθείσης ... τῆς φήμης
  choice: इसकी खबर बाहर फैल गई
  rationale: φήμη का अर्थ खबर, चर्चा या अफ़वाह हो सकता है। ‘खबर’ तटस्थ है और सार्वजनिक रूप से बात फैलने का भाव देता है।
- source_word: ἐπισυνήχθη τὸ πλῆθος
  choice: भीड़ ... इकट्ठी हो गई
  rationale: यह लोगों के सामूहिक रूप से जुटने का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ἐπὶ τὸν Λυσίμαχον
  choice: लिसिमाखुस के विरुद्ध
  rationale: ἐπί यहाँ लिसिमाखुस की ओर विरोधपूर्ण ढंग से जुटने का संकेत देता है; प्रसंग में ‘के विरुद्ध’ उपयुक्त है।
- source_word: χρυσωμάτων
  choice: सोने की बहुत-सी वस्तुएँ
  rationale: χρυσώματα सोने अथवा सोने की बहुमूल्य वस्तुओं को सूचित करता है। ‘वस्तुएँ’ बहुवचन और मूर्त सम्पत्ति का भाव सुरक्षित रखता है, बिना उन्हें विशेष रूप से पात्र कहे।
- source_word: διηρπαγμένων
  choice: पहले ही लूटी जा चुकी थीं
  rationale: पूर्ण निष्क्रिय कृदन्त और ἤδη मिलकर पहले पूर्ण हो चुकी लूट को व्यक्त करते हैं; हिन्दी प्रयोग वही कालगत बल रखता है।
theological_decisions:
- issue: ἱεροσυλημάτων द्वारा बताए गए अपराध का स्वरूप
  choice: मन्दिर की पवित्र सम्पत्ति की चोरी
  alternative: नगर में किए गए सामान्य पवित्रता-भंग अथवा धर्मद्रोह के कार्य
  rationale: यूनानी शब्द विशेष रूप से पवित्र सम्पत्ति की चोरी को दर्शाता है। स्पष्ट मन्दिर-संबंधी भाषा ऐतिहासिक और धार्मिक गंभीरता सुरक्षित रखती है, पर कोई बाद की साम्प्रदायिक धारणा नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मन्दिर की पवित्र वस्तुओं’ से अपराध की विशिष्ट प्रकृति स्पष्ट की गई है; नामों का देवनागरी रूप लिसिमाखुस और मेनेलाउस रखा गया है।
