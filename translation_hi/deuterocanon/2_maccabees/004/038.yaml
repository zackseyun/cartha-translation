base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/038.yaml
  text: And[a], inflamed with anger, he immediately stripped off Andronikos's purple robe and tore off his garments, and after leading him around through the whole city to the very place where he had committed his impiety against Onias, there he dispatched the murderer[b], the Lord rendering to him the punishment he deserved.
translation:
  language: hi
  text: तब वह क्रोध से भड़क उठा। उसने तुरन्त अन्द्रोनिकुस का बैंगनी वस्त्र उतार दिया और उसके कपड़े फाड़ डाले। फिर वह उसे पूरे नगर में घुमाते हुए ठीक उसी स्थान पर ले गया जहाँ उसने ओनियास के विरुद्ध अधर्म किया था। वहीं उसने उस रक्त-दोषी हत्यारे[a] को मार डाला[b]। इस प्रकार प्रभु ने उसे वह दण्ड दिया जिसका वह पात्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ केवल ‘हत्यारा’ नहीं, बल्कि रक्तपात से कलुषित और रक्त-दोषी हत्यारा भी है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया प्रबल और सजीव है तथा सम्भवतः भाले या ऐसे ही किसी हथियार से मारने का संकेत देती है; प्रसंग में व्यापक अर्थ है कि उसे वहीं मार डाला गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρωθεὶς τοῖς θυμοῖς
  choice: क्रोध से भड़क उठा
  rationale: यह यूनानी पद क्रोध को आग की तरह भड़कने के रूपक में व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए उस तीव्रता और अग्नि-बिम्ब को बनाए रखता है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह क्रिया की तात्कालिकता और कथा की तीव्र गति स्पष्ट करता है।
- source_word: τὴν τοῦ Ἀνδρονίκου πορφύραν
  choice: अन्द्रोनिकुस का बैंजनी राज-वस्त्र
  rationale: πορφύρα यहाँ केवल रंग नहीं, सम्भवतः पद और प्रतिष्ठा सूचित करने वाला बैंजनी बाहरी वस्त्र है; ‘राज-वस्त्र’ उस सामाजिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: τοὺς χιτῶνας περιρρήξας
  choice: उसके कपड़े फाड़ डाले
  rationale: χιτῶνας का शाब्दिक अर्थ अंगरखे या अंतर्वस्त्र हो सकता है, पर बहुवचन ‘कपड़े’ सार्वजनिक अपमान के दृश्य को स्वाभाविक हिन्दी में रखता है; περι- उपसर्ग सहित क्रिया की प्रबलता ‘फाड़ डाले’ में आती है।
- source_word: περιαγαγὼν καθʼ ὅλην τὴν πόλιν
  choice: उसे पूरे नगर में घुमाते हुए
  rationale: यह पूरे नगर में सार्वजनिक रूप से इधर-उधर ले जाए जाने का भाव देता है, बिना इसे औपचारिक जुलूस घोषित किए।
- source_word: ἐπʼ αὐτὸν τὸν τόπον
  choice: ठीक उसी स्थान पर
  rationale: αὐτόν के बलाघात को ‘ठीक उसी’ से सुरक्षित रखा गया है।
- source_word: οὗπερ τὸν Ὀνίαν ἠσέβησεν
  choice: जहाँ उसने ओनियास के विरुद्ध अधर्म किया था
  rationale: ἠσέβησεν सामान्य अन्याय से अधिक धार्मिक-नैतिक दुष्कर्म का संकेत देता है; ‘अधर्म किया’ इस बल को बनाए रखता है।
- source_word: τὸν μιαφόνον
  choice: उस रक्त-दोषी हत्यारे
  rationale: μιαφόνος हत्या करने के साथ रक्तपात से कलुषित और दोषी होने का प्रबल अर्थ रखता है; मुख्य पाठ में ‘रक्त-दोषी हत्यारा’ इस विशेष अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ἀπεκόντισεν
  choice: मार डाला
  rationale: क्रिया का मूल सम्बन्ध भाले या फेंके जाने वाले हथियार से हो सकता है, पर प्रसंग में निश्चित अर्थ वध करना है। मुख्य पाठ अनिश्चित हथियार नहीं जोड़ता; सम्भावित विशिष्टता पाद-टिप्पणी में दी गई है।
- source_word: τοῦ κυρίου τὴν ἄξιαν αὐτῷ κόλασιν ἀποδόντος
  choice: इस प्रकार प्रभु ने उसे वही दण्ड दिया जिसका वह पात्र था
  rationale: यूनानी genitive absolute घटना को प्रभु द्वारा दिए गए न्यायोचित प्रतिफल के रूप में समझाता है। हिन्दी में स्वतंत्र वाक्य कारणार्थक-निष्कर्षात्मक सम्बन्ध और स्पष्ट ईश्वरीय कर्तृत्व दोनों बनाए रखता है।
theological_decisions:
- issue: κύριος को ईश्वरीय न्याय के प्रसंग में कैसे व्यक्त किया जाए
  choice: प्रभु
  alternative: परमेश्वर
  rationale: मूल पाठ में κύριος है; ‘प्रभु’ उसी उपाधि को सुरक्षित रखता है और पाठ में न आया हुआ अलग ईश्वरीय नाम नहीं जोड़ता।
- issue: दण्ड को मानवीय निष्पादन मात्र मानना या ईश्वरीय प्रतिफल के रूप में स्पष्ट रखना
  choice: इस प्रकार प्रभु ने उसे वही दण्ड दिया जिसका वह पात्र था
  alternative: और उसे उसका उचित दण्ड मिला
  rationale: मूल का genitive absolute स्पष्ट रूप से प्रभु को दण्ड देने वाला बताता है। इसलिए ईश्वरीय कर्तृत्व को अप्रत्यक्ष या निष्क्रिय नहीं किया गया।
- issue: ἄξιαν αὐτῷ κόλασιν में दण्ड की पात्रता
  choice: वही दण्ड ... जिसका वह पात्र था
  alternative: उचित दण्ड
  rationale: यह रूप व्यक्ति के अपने कर्म के अनुरूप दण्ड पाने की धारणा को स्पष्ट रखता है, पर दण्ड के स्वरूप पर मूल से अधिक दावा नहीं करता।
