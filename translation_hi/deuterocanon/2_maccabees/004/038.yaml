  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण कथात्मक स्तर अपनाया गया है। छोटे वाक्य सार्वजनिक अपमान, नगर-परिभ्रमण और वध की क्रमिक गति स्पष्ट करते हैं। नामों के रूप ‘अन्द्रोनिकुस’ और ‘ओनियास’ यूनानी नामों के निकट तथा हिन्दी पाठकों के लिए पठनीय रखे गए हैं।
