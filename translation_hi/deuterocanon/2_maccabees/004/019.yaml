  yaml_path: translation/deuterocanon/2_maccabees/004/019.yaml
  text: Jason the vile man sent Antiochians from Jerusalem as envoys, carrying three hundred silver drachmas for the sacrifice to Heracles; but those who carried them requested that they not be used for sacrifice,
translation:
  language: hi
  text: उस घृणित यासोन ने अन्ताकिया के लोगों को यरूशलेम की ओर से[a] प्रतिनिधि बनाकर भेजा। वे हेराक्लेस को बलि चढ़ाने के लिए चाँदी के तीन सौ द्राख्मे ले जा रहे थे; परन्तु उन्हें ले जानेवालों ने अनुरोध किया कि उनका उपयोग बलि के लिए न किया जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो यरूशलेम की ओर से”; अथवा केवल “यरूशलेम से।” यूनानी पद उनके यरूशलेम के प्रतिनिधि के रूप में भेजे जाने पर बल दे सकता है।
    reason: ὡς ἀπʼ Ἱεροσολύμων में वास्तविक प्रस्थान-स्थान और प्रतिनिधिक अथवा कथित संबद्धता के बीच अस्पष्टता है।
lexical_decisions:
- source_word: μιερὸς
  choice: घृणित
  rationale: यह विशेषण यासोन के प्रति कथाकार की प्रबल नैतिक और धार्मिक निन्दा व्यक्त करता है। ‘घृणित’ आधुनिक हिन्दी में इस कठोर नकारात्मक मूल्यांकन को स्वाभाविक ढंग से बनाए रखता है।
- source_word: θεωρούς
  choice: प्रतिनिधि
  rationale: यह शब्द किसी उत्सव या धार्मिक आयोजन के लिए भेजे गए आधिकारिक दूतों को सूचित कर सकता है। ‘प्रतिनिधि’ उनके आधिकारिक स्वरूप को स्पष्ट करता है, बिना अनावश्यक तकनीकी धार्मिक शब्दावली जोड़े।
- source_word: ὡς ἀπʼ Ἱεροσολύμων
  choice: यरूशलेम की ओर से[a]
  rationale: ὡς के कारण यह वाक्यांश केवल भौगोलिक प्रस्थान नहीं, बल्कि प्रतिनिधिक या कथित संबद्धता भी जता सकता है। ‘की ओर से’ मुख्य पाठ में इस भाव को स्वाभाविक रूप से व्यक्त करता है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: Ἀντιοχέας
  choice: अन्ताकिया के लोगों
  rationale: यह बहुवचन जातिवाचक संज्ञा अन्ताकिया से संबद्ध व्यक्तियों को दर्शाती है। ‘अन्ताकिया के लोगों’ सामान्य हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: παρακομίζοντας
  choice: ले जा रहे थे
  rationale: कृदन्त धन को साथ पहुँचाने या ले जाने की क्रिया बताता है। यह चयन प्रसंग और हिन्दी वाक्य-विन्यास दोनों में सहज है।
- source_word: ἀργυρίου δραχμὰς τριακοσίους
  choice: चाँदी के तीन सौ द्राख्मे
  rationale: यह राशि, धातु और प्राचीन मुद्रा—तीनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: εἰς τὴν τοῦ Ἡρακλέους θυσίαν
  choice: हेराक्लेस को बलि चढ़ाने के लिए
  rationale: यह धन के अभिप्रेत धार्मिक उपयोग को स्पष्ट करता है और हेराक्लेस को बलि अर्पित किए जाने का अर्थ बनाए रखता है।
- source_word: ἠξίωσαν
  choice: अनुरोध किया
  rationale: क्रिया यहाँ धन ले जानेवालों द्वारा की गई माँग या विनती को व्यक्त करती है। ‘अनुरोध किया’ न तो उसके बल को बढ़ाता है, न घटाता है।
- source_word: μὴ χρησθαι εἰς θυσίαν
  choice: उनका उपयोग बलि के लिए न किया जाए
  rationale: बहुवचन सर्वनाम द्राख्मों की ओर संकेत करता है और धन को बलि में लगाने से इनकार को स्रोत के निकट रहते हुए स्पष्ट करता है।
theological_decisions:
- issue: μιερὸς में कथाकार का नैतिक निर्णय
  choice: यासोन के लिए स्पष्ट निन्दासूचक ‘घृणित’ रखा गया
  alternative: ‘अपवित्र’ या ‘अधर्मी’
  rationale: निन्दा मूल यूनानी पाठ में उपस्थित है; इसलिए उसे नरम करना उचित नहीं। ‘घृणित’ नैतिक और धार्मिक वितृष्णा को व्यक्त करता है, पर किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं जोड़ता।
- issue: ὡς ἀπʼ Ἱεροσολύμων की प्रतिनिधिक अस्पष्टता
  choice: मुख्य पाठ में ‘यरूशलेम की ओर से’
  alternative: ‘यरूशलेम से’ या ‘मानो यरूशलेम की ओर से’
  rationale: यह चयन प्रतिनिधिक अर्थ को प्राथमिकता देता है, जबकि ὡς से उत्पन्न कथित या प्रस्तुत किए गए मूल की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज गद्य। प्राचीन नाम ‘यासोन’, ‘अन्ताकिया’ और ‘हेराक्लेस’ लिप्यन्तरित हैं; मुद्रा ‘द्राख्मे’ के रूप में रखी गई है। पद स्रोत की तरह अगले वाक्यांश की ओर बढ़ते अल्पविराम पर समाप्त होता है।
