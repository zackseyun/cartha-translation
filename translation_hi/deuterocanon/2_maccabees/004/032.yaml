base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/032.yaml
  text: But Menelaus[a], thinking that he had found a favorable opportunity, embezzled some of the gold vessels of the temple and gave them as a gift to Andronicus[b], and he had managed to sell others in Tyre and the surrounding cities.
translation:
  language: hi
  text: परन्तु मेनेलाउस ने यह सोचकर कि उसे एक अनुकूल अवसर मिल गया है, मंदिर की सोने की कुछ वस्तुएँ[a] हड़प लीं और उन्हें अन्द्रोनिकुस को भेंट में दे दीं; और कुछ दूसरी वस्तुएँ वह सोर और उसके आसपास के नगरों में पहले ही बेच चुका था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सोने के कुछ पात्र” अथवा “सोने की कुछ चीज़ें।” यूनानी शब्द सामान्य रूप से मंदिर की सोने की वस्तुओं को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “और ऐसा हुआ था कि वह दूसरी वस्तुएँ सोर तथा आसपास के नगरों में बेच चुका था।” यूनानी अभिव्यक्ति यह बताती है कि मेनेलाउस उन्हें वहाँ पहले ही बेच चुका था; इसमें प्रसंगवशता की हल्की छटा भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσας
  choice: यह सोचकर
  rationale: अओरिस्ट कृदन्त मेनेलाउस के व्यक्तिपरक आकलन को व्यक्त करता है; यह सहज आधुनिक हिन्दी है।
- source_word: καιρὸν εὐφυῆ
  choice: एक अनुकूल अवसर
  rationale: वाक्यांश किसी उपयुक्त और लाभदायक मौके का बोध कराता है।
- source_word: χρυσώματά τινα
  choice: कुछ सोने की वस्तुएँ
  rationale: χρύσωμα सामान्यतः सोने की बनी वस्तु को दर्शाता है; यूनानी शब्द स्वयं इन्हें केवल पात्रों तक सीमित नहीं करता।
- source_word: τῶν τοῦ ἱεροῦ
  choice: मन्दिर की
  rationale: सम्बन्धकारक इन वस्तुओं को मन्दिर की सम्पत्ति के रूप में चिह्नित करता है।
- source_word: νοσφισάμενος
  choice: हड़प लीं
  rationale: यह entrusted अथवा किसी और की सम्पत्ति को अनुचित ढंग से अपने अधिकार में करने का भाव रखता है; ‘हड़प लीं’ सामान्य पाठक के लिए स्पष्ट और नैतिक बल से युक्त है।
- source_word: ἐχαρίσατο
  choice: भेंट कर दिया
  rationale: मध्यवाच्य क्रिया किसी को उपहार या कृपापूर्वक देने का भाव व्यक्त करती है।
- source_word: ἕτερα
  choice: कुछ दूसरी वस्तुएँ
  rationale: यह पहले उल्लिखित मन्दिर की सोने की वस्तुओं में से अन्य वस्तुओं की ओर संकेत करता है।
- source_word: ἐτύγχανεν πεπρακὼς
  choice: पहले ही बेच चुका था
  rationale: यह पूर्ण हो चुके विक्रय की अवस्था बताता है; τυγχάνω की प्रसंगवशता हिन्दी में भारीपन से बचाते हुए पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: εἴς τε Τύρον καὶ τὰς κύκλῳ πόλεις
  choice: सोर और उसके आस-पास के नगरों में
  rationale: प्रसंग में यह उन स्थानों को बताता है जहाँ दूसरी वस्तुएँ बेची गई थीं; εἰς का अधिक शाब्दिक दिशात्मक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मन्दिर की सम्पत्ति के विरुद्ध मेनेलाउस के अपराध का स्वरूप
  choice: ‘हड़प लीं’ के द्वारा पवित्र सम्पत्ति के अनुचित आत्मसात का भाव रखा गया।
  alternative: ‘गबन कर लिया’ या ‘चुरा लिया’
  rationale: ‘गबन’ विधिक और कुछ पाठकों के लिए अपेक्षाकृत तकनीकी है, जबकि ‘चुरा लिया’ सौंपे गए माल के अनुचित आत्मसात की विशिष्टता खो सकता है। अनुवाद अपराध की गंभीरता रखता है, पर कोई बाद की धर्मसैद्धान्तिक श्रेणी नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। ‘मन्दिर’, ‘भेंट’ और ‘हड़प लीं’ सामान्य पाठक के लिए स्पष्ट हैं। व्यक्तिनामों के लिए प्रचलित हिन्दी बाइबलीय लिप्यन्तरण ‘मेनेलाउस’ और ‘अन्द्रोनिकुस’, तथा Τύρος के लिए ‘सोर’ प्रयुक्त हुआ है।
