- source_word: Ἀπολλώνιον Μενεσθέως
  choice: मेनेस्थियस का पुत्र अपोल्लोनियस
  rationale: सम्बन्धकारक रूप यहाँ प्रचलित संरक्षक-नाम है; ‘का पुत्र’ हिन्दी में पहचान स्पष्ट करता है।
- source_word: τῶν Κοίλης Φοινίκης καὶ Συρίας
  choice: कोइले-फिनीके और सीरिया का
  rationale: दिए गए यूनानी पाठ के स्थान-नामों और उनके क्रम को सीधे सुरक्षित रखा गया है, बजाय अंग्रेज़ी परामर्श-पाठ के ‘कोइले-सीरिया और फिनीके’ को आधार बनाने के।
- source_word: στρατηγόν
  choice: शासक
