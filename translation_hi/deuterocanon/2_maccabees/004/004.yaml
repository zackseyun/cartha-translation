  text: When Onias saw the severity of the rivalry[a], and that Apollonius son of Menestheus, the governor of Coele-Syria and Phoenicia, was increasing Simon’s wickedness[b],
translation:
  language: hi
  text: जब ओनियास ने कलह[a] की गंभीरता देखी और यह भी देखा कि मेनेस्थियस का पुत्र अपोल्लोनियस, जो कोइले-फिनीके और सीरिया का शासक[b] था, शिमोन की दुष्टता को और बढ़ा रहा था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झगड़े’ अथवा ‘प्रतिद्वंद्विता’।
    reason: यूनानी φιλονεικία में कलह, विवादप्रियता और प्रतिद्वंद्विता—इनसे जुड़ा अर्थ-क्षेत्र है।
  - marker: b
    text: या ‘सेनापति’।
    reason: यूनानी στρατηγός सैनिक सेनापति या किसी क्षेत्र के शासकीय अधिकारी, दोनों के लिए प्रयुक्त हो सकता है।
