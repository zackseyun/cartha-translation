    text: या, “त्रिरेम युद्धपोतों की तैयारी के लिए उस समय की आवश्यकताओं के कारण।”
    reason: τῶν παρόντων का अर्थ व्यापक रूप से ‘वर्तमान परिस्थितियाँ’ या, प्रसंगानुसार, ‘उस समय की आवश्यकताएँ’ हो सकता है; ἕνεκα कारणसूचक है।
lexical_decisions:
- source_word: ἕνεκα
  choice: के कारण
  rationale: यह संबंधसूचक पद कारण अथवा अवसर बताता है; ‘के कारण’ आधुनिक हिन्दी में इसके कारणात्मक बल को स्पष्ट रखता है।
- source_word: τῶν παρόντων
  choice: वर्तमान परिस्थितियों
  rationale: संज्ञा की तरह प्रयुक्त नपुंसकलिंग बहुवचन कृदन्त उस समय विद्यमान स्थिति या आवश्यकताओं को व्यापक रूप से सूचित करता है; यह चयन अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: κατασκευάς
  choice: तैयार करने
  rationale: नौसैनिक प्रसंग में यह शब्द केवल निर्माण नहीं, बल्कि जहाज़ों को सुसज्जित और उपयोग के योग्य बनाने का भाव भी रखता है; ‘तैयार करने’ सहज हिन्दी में इस व्यापकता को व्यक्त करता है।
- source_word: τριηρέων
  choice: त्रिरेम युद्धपोतों
  rationale: मूल में प्राचीन युद्धपोत का विशिष्ट प्रकार है। ‘त्रिरेम’ ऐतिहासिक विशिष्टता बचाता है और ‘युद्धपोत’ सामान्य पाठक को उसका अर्थ समझाता है।
