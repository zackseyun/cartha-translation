base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/009.yaml
  text: In addition to these things[a], he promised to register another fifty talents beyond the one hundred, if he were granted authority to establish for himself a gymnasium and an enrollment of young men[b], and to enroll those in Jerusalem as Antiochenes.
translation:
  language: hi
  text: इन बातों के अतिरिक्त, उसने यह वचन भी दिया कि वह एक सौ के अतिरिक्त पचास और तोड़े दर्ज कराएगा, यदि उसे यह अधिकार दिया जाए कि वह अपने अधीन एक व्यायामशाला और युवकों की संस्था स्थापित करे[b], और यरूशलेम में रहने वालों को अन्ताकियाई के रूप में पंजीकृत करे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अन्ताकियाई’ से सम्भवतः आशय यरूशलेम में रहने वालों को अन्ताकिया से जुड़ा नागरिक या कानूनी दर्जा देना है; यूनानी पाठ उस दर्जे की ठीक प्रकृति स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: b
    text: ‘व्यायामशाला’ केवल कसरत की जगह नहीं, बल्कि यूनानी नागरिक और शारीरिक प्रशिक्षण की संस्था थी; युवकों की संस्था भी उसी यूनानी सामाजिक व्यवस्था का अंग थी।
    reason: cultural_note
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: इन बातों के अतिरिक्त
  rationale: यह पदबंध पिछले प्रस्ताव में एक और राशि और शर्त जोड़ता है; हिन्दी में इसका योगात्मक बल स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ὑποσχεῖτο
  choice: उसने यह प्रतिज्ञा भी की
  rationale: यहाँ क्रिया आर्थिक दायित्व लेने या वचन देने को व्यक्त करती है; ‘प्रतिज्ञा की’ औपचारिक और स्पष्ट है।
- source_word: ἕτερα διαγράψειν πεντήκοντα πρὸς τοῖς ἑκατόν
  choice: पहले के एक सौ के साथ पचास तोड़े और दर्ज कराएगा
  rationale: διαγράψειν में प्रशासनिक लेखे में राशि दर्ज कराने का भाव है। ‘तोड़े’ निकटवर्ती आर्थिक संदर्भ से स्पष्ट की गई इकाई है, जबकि ‘दर्ज कराएगा’ मूल की दफ्तरी बारीकी बनाए रखता है।
- source_word: ἐὰν ἐπιχορηγηθῇ διὰ τῆς ἐξουσίας αὐτοῦ
  choice: बशर्ते उसे अपने अधिकार से ... अनुमति दी जाए
  rationale: निष्क्रिय क्रिया किसी उच्चाधिकारी द्वारा प्रदान की गई स्वीकृति बताती है। αὐτοῦ का स्वाभाविक संदर्भ राजा का अधिकार है, पर मुख्य पाठ में सर्वनाम की मूल अस्पष्टता रखी गई है।
- source_word: γυμνάσιον
  choice: व्यायामशाला
  rationale: यह यूनानी नागरिक, शारीरिक और सांस्कृतिक प्रशिक्षण की विशिष्ट संस्था थी। प्रचलित हिन्दी शब्द पाठ को समझने योग्य रखता है; फुटनोट ऐतिहासिक अर्थ स्पष्ट करता है।
- source_word: ἐφηβίαν
  choice: युवकों के प्रशिक्षण की संस्था
  rationale: शब्द नागरिक और शारीरिक प्रशिक्षण के लिए नामांकित युवकों की संस्था या व्यवस्था को सूचित करता है; यह अनुवाद केवल ‘युवक-दल’ की अपेक्षा संस्थागत भाव बेहतर व्यक्त करता है।
- source_word: αὐτῷ συστήσασθαι
  choice: स्थापित करने
  rationale: मध्यवाच्य में यासोन द्वारा अपने प्रयोजन या प्रशासन के लिए संस्था संगठित कराने का भाव है; हिन्दी में संदर्भ से यह पर्याप्त स्पष्ट है।
- source_word: τοὺς ἐν Ἱεροσολύμοις Ἀντιοχεῖς ἀναγράψαι
  choice: यरूशलेम के लोगों को अन्ताकियाई के रूप में पंजीकृत करने
  rationale: ἀναγράψαι प्रशासनिक पंजीकरण को और Ἀντιοχεῖς ‘अन्ताकियाई’ पदनाम को व्यक्त करता है। नागरिकता की ठीक कानूनी प्रकृति अनिश्चित होने के कारण मुख्य पाठ उसे अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: Ἀντιοχεῖς का सांस्कृतिक-राजनीतिक अर्थ
  choice: मुख्य पाठ में ‘अन्ताकियाई के रूप में’
  alternative: ‘अन्ताकिया के नागरिकों के रूप में’
  rationale: संदर्भ नागरिक पुनर्वर्गीकरण की ओर संकेत करता है, किंतु यूनानी शब्द सटीक कानूनी दर्जा स्पष्ट नहीं करता। इसलिए मुख्य पाठ पदनाम को बनाए रखता है और फुटनोट संभावित नागरिक अर्थ बताता है।
- issue: διὰ τῆς ἐξουσίας αὐτοῦ में अधिकार का धारक
  choice: ‘अपने अधिकार से’ द्वारा सर्वनाम को बनाए रखना
  alternative: ‘राजा के अधिकार से’ या ‘राजकीय अनुमति से’
  rationale: संदर्भ में राजा का अधिकार सर्वाधिक संभावित है, फिर भी मूल पाठ संज्ञा को दोहराता नहीं; अतः अनुवाद अनावश्यक स्पष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध गद्य। ‘तोड़ा’, ‘व्यायामशाला’, ‘पंजीकृत’ और ‘अन्ताकियाई’ ऐतिहासिक तथा प्रशासनिक संदर्भ बनाए रखते हैं। दोनों फुटनोट चिह्न मुख्य पाठ में उपस्थित हैं।
