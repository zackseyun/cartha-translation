lexical_decisions:
- source_word: Περὶ δὲ τούτων
  choice: इन बातों के विषय में
  rationale: περί के साथ संबंधकारक चर्चा के विषय को सूचित करता है, और δέ प्रसंग में संक्रमण लाता है। हिन्दी में अलग संयोजक जोड़े बिना यह वाक्यांश स्वाभाविक रूप से उस संक्रमण को वहन करता है।
- source_word: ἐνέστη
  choice: शुरू हुआ
  rationale: κρίσις के साथ यह क्रिया किसी कानूनी कार्यवाही के आरम्भ होने को व्यक्त करती है। ‘शुरू हुआ’ सरल और वर्तमान हिन्दी है तथा निष्क्रिय कर्ता का अनुमान नहीं लगाती।
- source_word: κρίσις
  choice: एक मुकदमा
  rationale: यहाँ κρίσις न्यायिक प्रक्रिया या कानूनी मामले को सूचित करता है। ‘मुकदमा’ सामान्य पाठक के लिए स्वाभाविक है और किसी विशेष सुनवाई-चरण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπὶ τὸν Μενέλαον
  choice: मेनेलाउस के विरुद्ध
  rationale: कानूनी प्रसंग में ἐπί और कर्मकारक कार्यवाही की दिशा किसी व्यक्ति के विरुद्ध होने का अर्थ देते हैं।
