  yaml_path: translation/deuterocanon/2_maccabees/004/013.yaml
  text: And there was such a height of Hellenism and an increase of foreign ways because of the surpassing shamelessness of Jason[a], who was ungodly and not the high priest,
translation:
  language: hi
  text: इस प्रकार यूनानीकरण अपने चरम पर था और विदेशी रीति-रिवाजों की घुसपैठ थी[a]। यह उस अधर्मी यासोन की हद से बढ़ी निर्लज्जता के कारण हुआ, जो महायाजक था ही नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विदेशी रीति-रिवाजों की घुसपैठ’ का अनुवाद ‘विदेशी जीवन-शैली का फैलाव’ भी हो सकता है। दुर्लभ यूनानी शब्द स्थानीय, यहूदी परंपरा से बाहर की प्रथाओं के प्रसार की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκμή
  choice: अपने चरम पर
  rationale: यह शब्द किसी विकास या प्रवृत्ति की पराकाष्ठा सूचित करता है; ‘अपने चरम पर’ उसके रूपक और तीव्रता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἑλληνισμός
  choice: यूनानीकरण
  rationale: यहाँ आशय केवल यूनानी जातीयता से नहीं, बल्कि यूनानी संस्कृति और जीवन-शैली को अपनाने की प्रक्रिया से है। ‘यूनानीकरण’ ऐतिहासिक विशिष्टता को संक्षेप में सुरक्षित रखता है।
- source_word: πρόσβασις
  choice: घुसपैठ बढ़ती जा रही थी
  rationale: संदर्भ में यह आगे बढ़ने या भीतर फैलने का भाव देता है। यह अनुवाद विदेशी प्रथाओं के बढ़ते प्रवेश की नकारात्मक संदर्भगत छाया व्यक्त करता है।
- source_word: ἀλλοφυλισμός
  choice: विदेशी रीति-रिवाजों
  rationale: यह दुर्लभ शब्द अपने समुदाय से बाहर की, विशेषतः गैर-यहूदी, प्रथाओं को अपनाने की ओर संकेत करता है। ‘विदेशी रीति-रिवाज’ स्पष्ट है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διὰ यहाँ कारण व्यक्त करता है।
- source_word: ἀσεβοῦς
  choice: अधर्मी
  rationale: यह यासोन के परमेश्वर और धार्मिक दायित्वों के प्रति अनादर का नैतिक मूल्यांकन व्यक्त करता है।
- source_word: οὐκ ἀρχιερέως
  choice: जो महायाजक था ही नहीं
  rationale: ‘था ही नहीं’ यूनानी वाक्यांश के स्पष्ट और विवादात्मक निषेध को बनाए रखता है तथा यासोन के पद की वैधता पर लेखक के निर्णय को प्रकट करता है।
- source_word: ὑπερβάλλουσαν
  choice: हद से बढ़ी हुई
  rationale: यह अगले संज्ञा-पद की तीव्रता बढ़ाता है और सीमा पार करने का भाव रखता है।
- source_word: ἀναιδείαν
  choice: निर्लज्जता
  rationale: यह शब्द मर्यादा की खुली अवहेलना और नैतिक धृष्टता व्यक्त करता है; ‘निर्लज्जता’ आधुनिक हिन्दी में सुलभ और प्रबल है।
theological_decisions:
- issue: यासोन के लिए οὐκ ἀρχιερέως का बल
  choice: ‘जो महायाजक था ही नहीं’—लेखक यासोन के महायाजकीय पद की वैधता को नकारता है।
  alternative: ‘जो सच्चा महायाजक नहीं था’ या तटस्थ रूप से ‘जो महायाजक नहीं था’
  rationale: मूल यूनानी में निषेध सीधा और विवादात्मक है। ‘सच्चा’ जैसा व्याख्यात्मक विशेषण जोड़े बिना ‘था ही नहीं’ उसी नकारात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ऐतिहासिक-सांस्कृतिक पद Ἑλληνισμός के लिए ‘यूनानीकरण’ चुना गया है; आसपास के वाक्य और पादटिप्पणी उसका आशय स्पष्ट करते हैं। स्रोत के लंबे वाक्य को हिन्दी की सहजता के लिए दो वाक्यों में बाँटा गया है, जबकि कारण-संबंध और यासोन के विरुद्ध तीखा मूल्यांकन सुरक्षित हैं।
