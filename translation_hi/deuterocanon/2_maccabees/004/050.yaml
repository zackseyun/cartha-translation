  yaml_path: translation/deuterocanon/2_maccabees/004/050.yaml
  text: But Menelaus[a], because of the greed of those in power, remained in office, growing in wickedness and having become a great plotter against his fellow citizens.
translation:
  language: hi
  text: परन्तु मेनेलाउस[a] सत्ता में बैठे लोगों के लोभ के कारण अपने पद पर बना रहा; वह दुष्टता में बढ़ता गया और अपने ही सहनागरिकों के विरुद्ध एक प्रमुख षड्यंत्रकारी बन चुका था।
  philosophy: optimal-equivalence
  footnotes:
