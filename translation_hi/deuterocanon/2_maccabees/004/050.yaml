    text: या, “शासकों के लालच के कारण।” यूनानी पदबंध का अधिक औपचारिक अनुवाद, “सत्ता रखने वालों के लोभ के कारण,” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς τῶν κρατούντων πλεονεξίας
  choice: सत्ताधारियों के लोभ के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है। πλεονεξία लोभ या लालच है, और κρατούντων से सत्ता रखने वाले लोग अभिप्रेत हैं।
- source_word: ἔμενεν ἐπὶ τῇ ἀρχῇ
  choice: अपने पद पर बना रहा
  rationale: ἀρχή इस प्रसंग में अधिकार का पद है; यह अनुवाद प्रशासनिक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπιφυόμενος τῇ κακίᾳ
  choice: दुष्टता में बढ़ता गया
  rationale: कृदन्त निरन्तर वृद्धि का भाव देता है और κακία नैतिक दुष्टता को सूचित करता है।
- source_word: μέγας τῶν πολιτῶν ἐπίβουλος καθεστώς
  choice: अपने ही नगरवासियों के विरुद्ध एक बड़ा षड्यंत्रकारी बन गया
  rationale: ἐπίβουλος किसी के विरुद्ध षड्यंत्र रचने वाले व्यक्ति को दर्शाता है; πολιτῶν नागरिकों या समान नगर-समुदाय के लोगों को सूचित करता है, और καθεστώς परिणामी अवस्था बताता है।
