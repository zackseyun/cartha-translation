  yaml_path: translation/deuterocanon/2_maccabees/004/012.yaml
  text: For he gladly established a gymnasium under the very citadel[a], and by bringing the noblest of our young men under the Greek cap, he was leading them on.
translation:
  language: hi
  text: क्योंकि उसने बड़े उत्साह से दुर्ग के ठीक नीचे एक यूनानी व्यायामशाला स्थापित की और हमारे बीच के सबसे प्रतिष्ठित युवकों को यूनानी टोपी[a] पहनने के लिए बाध्य करके उन्हें आगे ले जा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘पेटासोस’—चौड़ी किनारी वाली एक यूनानी टोपी, जो यहाँ यूनानी सांस्कृतिक पहचान का दिखाई देने वाला चिह्न थी।
    reason: ऐतिहासिक-सांस्कृतिक शब्द का स्पष्टीकरण
lexical_decisions:
- source_word: ἡδέως
  choice: बड़े उत्साह से
  rationale: यह क्रिया-विशेषण स्वेच्छा और तत्परता का भाव व्यक्त करता है; यह केवल प्रसन्नता नहीं, बल्कि इस स्थापना में उसकी उत्सुक भागीदारी दिखाता है।
- source_word: ὑπʼ αὐτὴν ἀκρόπολιν
  choice: दुर्ग के ठीक नीचे
  rationale: ὑπό का स्थानवाचक अर्थ और αὐτήν का बल दोनों सुरक्षित रहते हैं। ‘ठीक नीचे’ दुर्ग के अत्यंत निकट स्थित होने का चित्र स्पष्ट करता है।
- source_word: γυμνάσιον
  choice: एक यूनानी व्यायामशाला
  rationale: यह केवल कसरत करने की जगह नहीं, बल्कि यूनानी शिक्षा, शारीरिक प्रशिक्षण और सामाजिक जीवन की संस्था थी। ‘यूनानी’ जोड़ने से आधुनिक हिन्दी पाठक के लिए इसका ऐतिहासिक-सांस्कृतिक अर्थ स्पष्ट होता है।
- source_word: καθίδρυσεν
  choice: स्थापित की
  rationale: यह किसी संस्था को कायम करने का स्वाभाविक और गरिमापूर्ण हिन्दी प्रयोग है।
- source_word: τοὺς κρατίστους τῶν ἐφʼ ἡμῶν
  choice: हमारे बीच के सबसे प्रतिष्ठित युवकों को
  rationale: κρατίστους सामाजिक श्रेष्ठता या प्रतिष्ठा व्यक्त करता है। उपलब्ध यूनानी पाठ का ‘हमारे बीच के’ भाव रखा गया है, जबकि व्यायामशाला के प्रसंग के आधार पर सहभागी वर्ग को ‘युवकों’ के रूप में स्पष्ट किया गया है।
- source_word: ὑποτάσσων
  choice: अधीन करके
  rationale: इसमें केवल पहनाने के बजाय किसी नए सांस्कृतिक अनुशासन या पहचान के नीचे लाने का भाव है; हिन्दी में भी मूल रूपक बना रहता है।
- source_word: ὑπὸ πέτασον
  choice: यूनानी टोपी के अधीन
  rationale: πέτασος को अमूर्त रूप से ‘यूनानी रीति’ न बनाकर उसके ठोस सांस्कृतिक चिह्न के रूप में रखा गया है। टोपी का विशिष्ट प्रकार पादटिप्पणी में समझाया गया है।
- source_word: ἦγεν
  choice: उन्हें आगे ले जाता रहा
  rationale: अपूर्ण भूतकाल निरंतर चलती प्रक्रिया दर्शाता है। यह अभिव्यक्ति सांस्कृतिक परिवर्तन की दिशा का संकेत देती है, पर उसे मूल से अधिक स्पष्ट करके निर्णीत नहीं करती।
theological_decisions:
- issue: ὑπὸ πέτασον में निहित सांस्कृतिक समावेशन
  choice: ठोस बिंब ‘यूनानी टोपी के अधीन’ को बनाए रखा गया।
  alternative: ‘यूनानी रीति-रिवाजों में ले आया’ या ‘यूनानी जीवन-पद्धति अपनाने लगा’
  rationale: मूल पाठ एक दिखाई देने वाले यूनानी सांस्कृतिक चिह्न का प्रयोग करता है। उसे अमूर्त व्याख्या में बदलने से मूल की सजीवता और अर्थगत तनाव कम हो जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यूनानी व्यायामशाला’ संस्था के ऐतिहासिक अर्थ को स्पष्ट करती है, जबकि ‘टोपी के अधीन’ मूल यूनानी के ठोस और कुछ असामान्य रूपक को जानबूझकर सुरक्षित रखता है।
