  text: For he saw that without royal intervention it was impossible for affairs to attain peace[c][b][a], and that Simon would not stop his folly.
translation:
  language: hi
  text: क्योंकि, इस पर विचार करते हुए, उसने देखा कि राजकीय सहायता के बिना मामलों में शांति आना असंभव था और शमौन अपनी मूर्खता से बाज़ नहीं आएगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘राजकीय πρόνοια के बिना’ है। πρόνοια का अर्थ ‘पूर्वविचार’, ‘देखभाल’ या ‘प्रबन्ध’ भी हो सकता है; यहाँ सम्भवतः राजा की सक्रिय सहायता या दखल का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: यह पद यूनानी में ‘विचार करते हुए’ अर्थ वाले कृदन्त से आरम्भ होता है, जो पिछले वाक्य से निकटता से जुड़ा है।
    reason: discourse_connection
lexical_decisions:
- source_word: σκοπῶν. ἐώρα γὰρ
  choice: क्योंकि विचार करते हुए उसने देखा
  rationale: σκοπῶν को पिछले वाक्य से जुड़ा परिस्थितिसूचक कृदन्त मानते हुए हिन्दी में उसका अर्थ स्पष्ट रखा गया है; γάρ के कारण व्याख्यात्मक संबंध के लिए ‘क्योंकि’ दिया गया है।
- source_word: βασιλικῆς προνοίας
  choice: राजा के हस्तक्षेप
  rationale: πρόνοια का मूल अर्थ पूर्वविचार, देखभाल या प्रबन्ध हो सकता है; इस राजनीतिक प्रसंग में राजा की सक्रिय सहायता अथवा दखल का भाव अधिक उपयुक्त है।
- source_word: τυχεῖν εἰρήνης ἐπὶ τὰ πράγματα
  choice: स्थिति में शांति स्थापित होना
  rationale: τυγχάνω + संबंधकारक का भाव ‘प्राप्त होना’ है, जबकि τὰ πράγματα वर्तमान सार्वजनिक स्थिति या मामलों को सूचित करता है। सहज हिन्दी में पूरे पद का परिणाममुखी अर्थ व्यक्त किया गया है।
- source_word: παῦλαν οὐ λημψόμενον
  choice: बाज़ नहीं आएगा
  rationale: शाब्दिक अर्थ ‘विराम नहीं पाएगा’ है; यहाँ आशय यह है कि शमौन अपने आचरण से रुकेगा नहीं। ‘बाज़ नहीं आएगा’ स्वाभाविक आधुनिक हिन्दी में इसी भाव को व्यक्त करता है।
- source_word: ἀνοίας
  choice: मूर्खता
  rationale: ἄνοια विवेकहीनता या मूर्खता को दर्शाता है; ‘मूर्खता’ नैतिक मूल्यांकन बनाए रखता है और चिकित्सकीय ‘पागलपन’ का अनावश्यक अर्थ नहीं जोड़ता।
