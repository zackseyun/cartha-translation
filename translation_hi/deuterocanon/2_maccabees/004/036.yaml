  text: They were indignant and deeply grieved over the man's unjust murder. But when the king returned from the regions of Cilicia[a], the Jews in the city appealed to him, and the Greeks as well, sharing in their hatred of the wicked deed,
translation:
  language: hi
  text: वे उस व्यक्ति की अन्यायपूर्ण हत्या पर बहुत क्रोधित और अत्यंत दुखी थे। पर जब राजा किलिकिया के प्रदेशों से लौट आया, तो नगर में रहने वाले यहूदियों ने उससे फरियाद की, और यूनानी भी उस दुष्ट कर्म से घृणा करने में उनके साथ थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूनानी भी उस दुष्ट कर्म से घृणा करने में उनके साथ सम्मिलित हुए।” दुर्लभ यूनानी कृदंत συμμισοπονηρούντων का अर्थ किसी दुष्ट कृत्य के प्रति दूसरों के साथ मिलकर घृणा करना है; इसकी अभिव्यक्ति के निकटवर्ती रूप संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδείναζον
  choice: बहुत क्रोधित थे
  rationale: यह क्रिया तीव्र व्यथा या रोष व्यक्त करती है; साथ वाली क्रिया से भेद बनाए रखते हुए यहाँ नैतिक आक्रोश प्रमुख है।
- source_word: ἐδυσφόρουν
  choice: अत्यंत दुखी थे
  rationale: यह किसी बात को अत्यंत कष्टदायक मानने और उससे व्यथित होने का भाव रखती है; हिंदी में यह पहली क्रिया के रोष के साथ शोक का दूसरा पक्ष व्यक्त करती है।
- source_word: ἐπὶ τῷ τοῦ ἀνδρὸς ἀδίκῳ φόνῳ
  choice: उस व्यक्ति की अन्यायपूर्ण हत्या पर
  rationale: φόνος को तटस्थ 'मृत्यु' के बजाय 'हत्या' और ἀδίκῳ को 'अन्यायपूर्ण' कहा गया है, जिससे यूनानी पाठ का स्पष्ट नैतिक निर्णय बना रहता है।
- source_word: ἐπανελθόντος
  choice: लौट आया
  rationale: संबंधवाचक कृदंत की काल-सूचक भूमिका को स्वाभाविक हिंदी उपवाक्य में व्यक्त किया गया है।
- source_word: τῶν κατὰ Κιλικίαν τόπων
  choice: किलिकिया के क्षेत्रों से
  rationale: τόποι बहुवचन व्यापक भूभागों या स्थानों को सूचित करता है; 'क्षेत्रों' सहज और पर्याप्त रूप से व्यापक है।
- source_word: ἐνετύγχανον
  choice: उससे न्याय की गुहार लगाई
  rationale: राजा के सामने निवेदन या शिकायत रखने का अर्थ प्रसंग में निहित है; 'न्याय की गुहार' शासक से प्रतिकार माँगने का स्वाभाविक हिंदी रूप है।
- source_word: οἱ κατὰ πόλιν Ἰουδαῖοι
  choice: नगर में रहने वाले यहूदियों
  rationale: यह वाक्यांश नगर के यहूदी निवासियों को दर्शाता है; आधुनिक हिंदी में यह रूप स्पष्ट है।
- source_word: συμμισοπονηρούντων
  choice: उस दुष्ट कर्म से घृणा करने में उनके साथ थे
  rationale: यह दुर्लभ संयुक्त कृदंत बुराई या दुष्टता से मिलकर घृणा करने का भाव देता है। निहित कर्म को तत्काल प्रसंग की हत्या से संबंधित 'दुष्ट कर्म' के रूप में व्यक्त किया गया है।
- source_word: καὶ τῶν Ἑλλήνων
  choice: और यूनानी भी
  rationale: καί यूनानियों को यहूदियों के नैतिक विरोध में सम्मिलित करता है; 'भी' इस सहभागिता को साफ रखता है।
