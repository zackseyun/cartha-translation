  text: While these things were underway[a], it happened that the people of Tarsus and Mallus revolted, because they were being given as a gift to Antiochis, the king’s concubine.
translation:
  language: hi
  text: जब ये घटनाएँ चल रही थीं, तब ऐसा हुआ कि तरसुस और मल्लुस के निवासियों ने विद्रोह कर दिया, क्योंकि उन्हें राजा की उपपत्नी अन्तियोखिस को उपहार के रूप में दिया जा रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστηκότων
  choice: जब ये घटनाएँ चल ही रही थीं
  rationale: संबंधकारक निरपेक्ष कृदन्त यहाँ पिछली कथा से जुड़ी समकालीन परिस्थिति बताता है; यह अनुवाद शाब्दिक ‘खड़े/इकट्ठे होने’ के बजाय उसके स्वाभाविक कालगत अर्थ को व्यक्त करता है।
- source_word: συνέβη
  choice: तब … कर दिया
  rationale: यूनानी में यह सामान्य कथात्मक सूत्र है। हिन्दी में ‘तब’ और मुख्य क्रिया के स्वाभाविक विन्यास से घटना का घटित होना स्पष्ट है; अलग से ‘ऐसा हुआ कि’ कहना अनावश्यक रूप से भारी होता।
- source_word: Ταρσεῖς καὶ Μαλλῶτας
  choice: तरसुस और मल्लुस के निवासी
  rationale: ये नगरों के निवासियों के जातिवाचक बहुवचन नाम हैं। आधुनिक पाठक के लिए अपरिचित जातिनाम गढ़ने की अपेक्षा ‘के निवासी’ अधिक स्पष्ट है।
- source_word: στασιάζειν
  choice: विद्रोह कर दिया
  rationale: इस प्रसंग में क्रिया राजनीतिक अशांति अथवा सत्ता के विरुद्ध उठ खड़े होने को व्यक्त करती है; ‘विद्रोह’ उसका संक्षिप्त और सटीक हिन्दी रूप है।
- source_word: διὰ τὸ
  choice: क्योंकि
  rationale: यह रचना विद्रोह का कारण प्रस्तुत करती है; हिन्दी में ‘क्योंकि’ सहज कारणसूचक संयोजक है।
- source_word: Ἀντιοχίδι
  choice: अन्तियोखिस
  rationale: स्त्री के यूनानी व्यक्तिनाम का निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: παλλακῇ
  choice: उपपत्नी
  rationale: शब्द राजा की गौण पत्नी/रखैल-सदृश मान्य स्थिति वाली स्त्री को सूचित करता है। ‘उपपत्नी’ ऐतिहासिक अर्थ को गरिमापूर्ण ढंग से रखता है और आधुनिक ‘प्रेमिका’ जैसे भ्रामक अर्थ से बचाता है।
- source_word: ἐν δωρεᾷ δίδοσθαι
  choice: उपहार के रूप में दिए जा रहे थे
  rationale: निष्क्रिय क्रियारूप और दानस्वरूप सौंपे जाने—दोनों को सुरक्षित रखा गया है। सन्दर्भ में निवासी नहीं, उनके नगर अथवा उनसे जुड़ा राजस्वाधिकार दिए जाने का आशय है; इसलिए हिन्दी में ‘उनके नगर’ स्पष्ट किया गया है।
