base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/025.yaml
  text: But after receiving the royal commands[a], he arrived, bringing nothing worthy of the high priesthood[c][b], but having the passions of a cruel tyrant and the rage of a barbarous beast.
translation:
  language: hi
  text: परन्तु राजा की आज्ञाएँ[a] पाकर वह आ पहुँचा, और उसमें महायाजक-पद के योग्य कुछ भी नहीं था[b], बल्कि उसमें एक क्रूर अत्याचारी के उग्र आवेग और एक बर्बर पशु का क्रोध था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजकीय आदेश।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “महायाजक-पद के योग्य कुछ भी लिए हुए नहीं।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी में उग्रता और क्रोध के लिए दो निकटार्थक बहुवचन शब्द हैं, जो उसके हिंसक चरित्र को तीव्रता से व्यक्त करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ τὰς βασιλικὰς ἐντολὰς
  choice: परन्तु राजा की आज्ञाएँ पाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की कार्रवाई बताता है। ‘पाकर’ इस संबंध को सहज हिन्दी में रखता है; βασιλικάς को संदर्भानुसार ‘राजा की’ कहा गया है।
- source_word: παρεγίνετο
  choice: वह आ पहुँचा
  rationale: क्रिया का अर्थ घटनास्थल पर आना या उपस्थित होना है; ‘आ पहुँचा’ कथात्मक हिन्दी में स्वाभाविक है।
- source_word: τῆς μὲν ἀρχιερωσύνης οὐδὲν ἄξιον φέρων
  choice: उसमें महायाजक के पद के योग्य कुछ भी नहीं था
  rationale: शाब्दिक ‘कुछ भी योग्य लिए हुए नहीं’ हिन्दी में अस्वाभाविक होता। यह रूप व्यक्ति में उस पद के अनुरूप गुणों के पूर्ण अभाव को स्पष्ट करता है और भावगत विरोध बनाए रखता है।
- source_word: ἀρχιερωσύνης
  choice: महायाजक के पद
  rationale: यहाँ शब्द व्यक्ति नहीं, महायाजक के पद या दायित्व को सूचित करता है।
- source_word: θυμοὺς
  choice: उग्र स्वभाव
  rationale: बहुवचन शब्द तीव्र आवेगों, उग्रता या हिंसक मनोवृत्ति का संकेत देता है। ‘उग्र स्वभाव’ इसे अगले ὀργάς से अलग रखते हुए सहज हिन्दी देता है।
- source_word: ὠμοῦ τυράννου
  choice: एक क्रूर अत्याचारी का
  rationale: ὠμός यहाँ निर्दय और बर्बर क्रूरता व्यक्त करता है; τύραννος के लिए ‘अत्याचारी’ उसके दमनकारी चरित्र को स्पष्ट करता है।
- source_word: θηρὸς βαρβάρου
  choice: एक असभ्य जंगली पशु का
  rationale: θηρίον-संबंधी अर्थ को ‘जंगली पशु’ और βάρβαρος की क्रूर, असंस्कृत छवि को ‘असभ्य’ व्यक्त करता है, बिना किसी जातीय अर्थ को प्रमुख बनाए।
- source_word: ὀργὰς ἔχων
  choice: क्रोध था
  rationale: ἔχων दोनों आरोपित मनोवृत्तियों को नियंत्रित करता है। हिन्दी में ‘उसमें ... था’ स्वाभाविक रूप से अधिकार या अंतर्निहित चरित्र का भाव देता है।
theological_decisions:
- issue: महायाजक पद के संदर्भ में मेनेलाउस का नैतिक चित्रण
  choice: पद के योग्य गुणों के पूर्ण अभाव और अत्याचारी, पशुवत हिंसक मनोवृत्ति के बीच तीखा विरोध रखा गया है।
  alternative: इसे केवल राजनीतिक आलोचना मानकर भाषा को नरम करना।
  rationale: यूनानी पाठ स्पष्ट रूप से ‘महायाजक पद के योग्य कुछ भी नहीं’ को उग्रता और क्रोध के साथ विरोध में रखता है। अनुवाद इस नैतिक निंदा को न घटाता है, न पद से परे कोई अतिरिक्त धर्मवैधानिक निष्कर्ष जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘महायाजक’, ‘अत्याचारी’ और ‘राजा की आज्ञाएँ’ सामान्य पाठक के लिए स्पष्ट हैं। यूनानी की अलंकारिक तीव्रता और दोनों निकटार्थक मनोभावों का भेद यथासंभव सुरक्षित रखा गया है।
