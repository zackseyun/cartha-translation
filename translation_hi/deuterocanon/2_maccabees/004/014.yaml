  text: so that the priests were no longer eager for the services of the altar[a], but, despising the temple and neglecting the sacrifices, they hurried to take part in the unlawful exercise in the wrestling school after the summons to the discus throw[b];
translation:
  language: hi
  text: इसका परिणाम यह हुआ कि याजक अब वेदी की सेवा करने के लिए उत्सुक नहीं रहे। इसके बजाय, मंदिर का तिरस्कार करते और बलिदानों की उपेक्षा करते हुए, वे चक्का फेंकने की पुकार के बाद[b] कुश्तीशाला में उस व्यवस्था-विरुद्ध प्रबंध[a] में भाग लेने के लिए दौड़ पड़ते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पद का अर्थ कठिन है। इसका अनुवाद ‘व्यवस्था-विरुद्ध सहायता’, ‘वर्जित व्यय-पूर्ति’ या ‘नियम-विरुद्ध आयोजन’ भी हो सकता है। संभवतः यह कुश्तीशाला की खेलकूद गतिविधियों से जुड़ी सहायता, व्यय-पूर्ति या प्रबंध की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘चक्के की पुकार के बाद।’ आशय चक्का फेंकने के खेल में भाग लेने के लिए की गई पुकार या घोषणा से है।
    reason: cultural_note
lexical_decisions:
- source_word: λειτουργίας
  choice: सेवाओं
  rationale: यहाँ शब्द वेदी पर किए जाने वाले याजकीय अनुष्ठान और कर्तव्यों को सूचित करता है। ‘सेवाओं’ से धार्मिक संदर्भ बना रहता है और भाषा सहज रहती है।
- source_word: προθύμους
  choice: उत्सुक
  rationale: यह तत्परता और लगन दोनों व्यक्त करता है तथा बाद में वर्णित उपेक्षा के साथ स्पष्ट विरोध बनाता है।
- source_word: νεὼ
  choice: मंदिर
  rationale: संदर्भ यरूशलेम के मंदिर का है; आधुनिक हिन्दी में यही सबसे स्पष्ट और प्रचलित शब्द है।
- source_word: καταφρονοῦντες
  choice: तिरस्कार करते हुए
  rationale: यह केवल उदासीनता नहीं, बल्कि अवमानना का सक्रिय भाव व्यक्त करता है।
- source_word: ἀμελοῦντες
  choice: उपेक्षा करते हुए
  rationale: यह बलिदानों पर उचित ध्यान न देने का अर्थ संक्षेप और स्वाभाविक ढंग से देता है।
- source_word: παλαίστρῃ
  choice: कुश्तीशाला
  rationale: παλαίστρα मुख्यतः कुश्ती और अन्य व्यायामों के प्रशिक्षण-स्थल को दर्शाता है। ‘कुश्तीशाला’ आधुनिक पाठक के लिए बोधगम्य है और व्यापक ‘व्यायामशाला’ से अधिक विशिष्ट है।
- source_word: παρανόμου χορηγίας
  choice: व्यवस्था-विरुद्ध प्रबंध
  rationale: παράνομος उस गतिविधि को मान्य व्यवस्था या नियम के विरुद्ध बताता है, जबकि χορηγία सहायता, व्यय-पूर्ति, प्रबंध अथवा आयोजन से जुड़ी व्यवस्था का अर्थ दे सकता है। ‘प्रबंध’ मुख्य पाठ में इस कठिन पद की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἔσπευδον μετέχειν
  choice: भाग लेने के लिए दौड़ पड़ते थे
  rationale: इससे συμμετοχή की भागीदारी और ἔσπευδον की उतावली तथा सक्रिय शीघ्रता दोनों स्वाभाविक हिन्दी में व्यक्त होती हैं।
- source_word: μετὰ τὴν τοῦ δίσκου πρόσκλησιν
  choice: चक्का फेंकने की पुकार होते ही
  rationale: शाब्दिक अर्थ ‘चक्के की पुकार के बाद’ है; खेल के प्रसंग में यह चक्का-फेंक प्रतियोगिता में बुलाए जाने की घोषणा को दर्शाता है। ‘होते ही’ प्रसंगगत तात्कालिकता और उनके उतावलेपन को व्यक्त करता है।
theological_decisions:
- issue: παρανόμου का आशय यहूदी व्यवस्था और यूनानी खेल-संस्कृति के संबंध में
  choice: व्यवस्था-विरुद्ध
  alternative: अधर्मपूर्ण; अवैध; व्यवस्था द्वारा निषिद्ध
  rationale: कथा इस भागीदारी को पैतृक यहूदी व्यवस्था और याजकीय दायित्वों के विपरीत ठहराती है, पर यूनानी विशेषण अपने आप में यह निश्चित नहीं करता कि अभिप्राय नागरिक कानून, नैतिक नियम या तोराह में से केवल किससे है। चुना हुआ पद नकारात्मक निर्णय को बनाए रखते हुए इस तनाव को खुला रखता है।
- issue: मंदिर और बलिदानों के प्रति याजकों के व्यवहार की नैतिक तीव्रता
  choice: तिरस्कार और उपेक्षा
  alternative: मंदिर की परवाह न करना और बलिदानों पर ध्यान न देना
  rationale: यूनानी καταφρονοῦντες में अवमानना का स्पष्ट भाव है; इसे हल्का करके केवल असावधानी बताना लेखक के आरोप की नैतिक शक्ति घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याजक’, ‘वेदी’, ‘बलिदान’ और ‘मंदिर’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं। लम्बे यूनानी वाक्य को हिन्दी में दो वाक्यों में बाँटा गया है, पर कारण-परिणाम, विरोध और याजकों की उतावली सुरक्षित हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उचित स्थान पर दिए गए हैं।
