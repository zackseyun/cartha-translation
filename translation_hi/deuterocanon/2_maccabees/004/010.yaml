lexical_decisions:
- source_word: ἐπινεύσαντος
  choice: स्वीकृति मिल जाने
  rationale: यह संबंधवाचक निरपेक्ष रचना राजा की पूर्व सहमति को व्यक्त करती है। हिन्दी में यह प्रयोग औपचारिक अनुमोदन और मुख्य क्रिया से पहले हुई कार्रवाई—दोनों को स्वाभाविक ढंग से प्रकट करता है।
- source_word: ἀρχῆς
  choice: पद
  rationale: संदर्भ में यह अमूर्त सत्ता के बजाय यासोन द्वारा प्राप्त शासकीय पद को सूचित करता है।
- source_word: κρατήσας
  choice: अधिकार कर लेने
  rationale: यह पद पर प्रभावी नियंत्रण प्राप्त करने का भाव रखता है; ‘अधिकार कर लेने’ में प्राप्ति और नियंत्रण दोनों निहित हैं।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह पद प्राप्त होते ही बिना विलम्ब किए की गई कार्रवाई को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁμοφύλους
  choice: अपने ही लोगों
  rationale: शब्द समान जातीय समुदाय के लोगों को दर्शाता है। यह अनुवाद उस सामुदायिक निकटता को बनाए रखता है, पर यूनानी पाठ से अधिक स्पष्ट पहचान नहीं जोड़ता।
- source_word: μετέστησε
  choice: की ओर मोड़ दिया
  rationale: क्रिया किसी को एक स्थिति या अभिमुखता से दूसरी ओर ले जाने का सकर्मक भाव रखती है। यह हिन्दी प्रयोग यासोन की सक्रिय भूमिका को सुरक्षित रखता है।
- source_word: Ἑλληνικὸν χαρακτῆρα
  choice: यूनानी जीवन-शैली
  rationale: शाब्दिक अर्थ ‘यूनानी स्वरूप/छाप’ है, किन्तु संदर्भ में यूनानी सांस्कृतिक ढंग और रीति-रिवाज अभिप्रेत हैं। ‘जीवन-शैली’ आधुनिक पाठक के लिए स्पष्ट रहते हुए इस सांस्कृतिक अर्थ को व्यक्त करती है।
theological_decisions:
- issue: Ἑλληνικὸν χαρακτῆρα का सांस्कृतिक रूप से अर्थगर्भित अनुवाद
  choice: यूनानी जीवन-शैली
  alternative: यूनानी स्वरूप / यूनानी छाप / यूनानी रीति-रिवाज
  rationale: ‘चरित्र’ या ‘स्वरूप’ आधुनिक हिन्दी में आन्तरिक नैतिक गुण का भ्रम पैदा कर सकता है, जबकि यहाँ यूनानीकरण की सांस्कृतिक दिशा अभिप्रेत है। ‘जीवन-शैली’ इस ऐतिहासिक-सांस्कृतिक आशय को व्यक्त करती है, और पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
