  yaml_path: translation/deuterocanon/2_maccabees/004/043.yaml
  text: For this reason they wounded many of them[a], struck down some, and drove them all into flight; and they seized the temple-robber himself beside the treasury.
translation:
  language: hi
  text: इसी कारण उन्होंने उनमें से बहुतों को घायल कर दिया, कुछ को धराशायी कर दिया और सबको खदेड़कर भागने पर मजबूर कर दिया; और स्वयं उस मंदिर-लुटेरे[a] को कोषागार के पास पकड़ लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र वस्तुओं का अपमान करने वाले व्यक्ति।’ यूनानी शब्द उस व्यक्ति को सूचित कर सकता है जो पवित्र वस्तुओं के विरुद्ध अपराध करता है, विशेषकर मंदिर को लूटकर।
