- source_word: εἰς φυγὴν συνήλασαν
  choice: खदेड़कर भागने पर मजबूर कर दिया
  rationale: यह उन सबको बलपूर्वक भगा देने का भाव स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἱερόσυλον
  choice: मंदिर-लुटेरे
  rationale: यह शब्द पवित्र वस्तुओं के अपहरण या मंदिर लूटने वाले व्यक्ति को सूचित करता है। कोषागार के तात्कालिक संदर्भ में ठोस अपराध को व्यक्त करने वाला यह अनुवाद उपयुक्त है, जबकि धार्मिक अपवित्रता का संकेत पादटिप्पणी में सुरक्षित है।
- source_word: ἐχειρώσαντο
  choice: पकड़ लिया
  rationale: मध्यवाची क्रिया किसी को अपने कब्जे में लेने या पकड़ने का अर्थ देती है। ‘गिरफ्तार किया’ की अपेक्षा ‘पकड़ लिया’ मूल की गैर-तकनीकी भाषा के निकट है।
- source_word: παρὰ τὸ γαζοφυλάκιον
  choice: कोषागार के पास
  rationale: γαζοφυλάκιον मंदिर के धन-भंडार या कोषागार को दर्शाता है और παρά यहाँ निकटता बताता है; इस अनुवाद में अनावश्यक स्थापत्य विवरण नहीं जोड़ा गया।
