- source_word: τὸν διαδεχόμενον
  choice: अपने स्थान पर
  rationale: कृदंत किसी के बाद उसका दायित्व सँभालने वाले व्यक्ति को दर्शाता है। यहाँ यह आवश्यक नहीं कि अन्द्रोनिकुस राजसिंहासन का स्थायी उत्तराधिकारी था।
- source_word: τῶν ἐν ἀξιώματι κειμένων
  choice: उच्च पद पर आसीन लोगों में से एक
  rationale: ἀξίωμα यहाँ प्रतिष्ठित आधिकारिक पद का संकेत देता है।
theological_decisions:
- issue: अन्द्रोनिकुस की भूमिका
  choice: अपने स्थान पर छोड़ गया
  alternative: अपने उत्तराधिकारी के रूप में छोड़ गया
  rationale: यूनानी अभिव्यक्ति उत्तरवर्ती अथवा स्थानापन्न दायित्व का अर्थ दे सकती है। प्रसंग में अस्थायी प्रतिनिधित्व अधिक स्वाभाविक है, जबकि ‘उत्तराधिकारी’ राजसिंहासन के वारिस का अनचाहा अर्थ दे सकता है; अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘स्थिति को शांत करना’ अशांति दबाकर व्यवस्था बहाल करने का भाव देता है; ‘अपने स्थान पर’ अन्द्रोनिकुस की भूमिका को अनावश्यक रूप से राजवंशीय उत्तराधिकार नहीं बनाता।
