    reason: यूनानी τὸν διαδεχόμενον का अर्थ किसी के बाद स्थान लेने वाला, कार्यभार सँभालने वाला, या उत्तरवर्ती हो सकता है। यह पद आवश्यक रूप से राजसिंहासन के वंशानुगत उत्तराधिकारी का अर्थ नहीं देता।
lexical_decisions:
