  yaml_path: translation/deuterocanon/2_maccabees/004/016.yaml
  text: 'For this reason a harsh crisis surrounded them: those whose ways they envied and whom they wanted to imitate became their enemies and punishers[a][b].'
translation:
  language: hi
  text: 'इसी कारण[a] एक घोर संकट ने उन्हें घेर लिया: जिन लोगों की जीवन-रीति[b] से वे ईर्ष्या करते थे और जिनके समान वे बनना चाहते थे, वही उनके शत्रु और दंड देने वाले बन गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक शब्दों का अनुवाद “उन्हीं लोगों के कारण” भी हो सकता है; यूनानी वाक्यांश विशेष रूप से अभी बताए गए लोगों को आनेवाले संकट का कारण बता सकता है।
    reason: lexical_alternative
  - marker: b
    text: “जीवन-रीति” का अनुवाद “रीति-रिवाज” या “रहन-सहन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν καὶ χάριν
  choice: इसी कारण
  rationale: χάριν के साथ संबंधकारक कारण या प्रयोजन व्यक्त कर सकता है। प्रसंग में यह पहले बताए गए लोगों और उनकी रीति अपनाने से उत्पन्न परिणाम की ओर संकेत करता है; इसलिए मुख्य पाठ में स्वाभाविक कारणसूचक अनुवाद रखा गया है और व्यक्ति-सूचक विकल्प पादटिप्पणी में दिया गया है।
- source_word: περιεῖχεν
  choice: ने उन्हें घेर लिया
  rationale: क्रिया का मूल बिंब चारों ओर से घेरने या जकड़ने का है। यह περίστασις के साथ संकट के उन्हें चारों ओर से आ लेने का भाव बनाए रखती है।
- source_word: χαλεπὴ περίστασις
  choice: एक घोर संकट
  rationale: περίστασις यहाँ कठिन परिस्थिति या विपत्ति को और χαλεπή उसकी तीव्रता को व्यक्त करता है। ‘घोर संकट’ आधुनिक, स्पष्ट और गंभीर हिन्दी है।
- source_word: ἐζήλουν
  choice: ईर्ष्या करते थे
  rationale: ζηλόω उत्साह, अनुकरण की लालसा या ईर्ष्या का अर्थ दे सकता है। विदेशी जीवन-रीति अपनाने की नकारात्मक प्रसंगभूमि में ‘ईर्ष्या करते थे’ उसके मूल्यांकनात्मक रंग को सुरक्षित रखता है।
- source_word: τὰς ἀγωγὰς
  choice: जीवन-रीति
  rationale: ἀγωγή आचरण, प्रशिक्षण, रहन-सहन या जीवन-पद्धति को सूचित करता है। यहाँ यूनानीकरण की जीवन-शैली और प्रथाएँ अभिप्रेत हैं; ‘जीवन-रीति’ इस व्यापकता को स्वाभाविक हिन्दी में रखती है।
- source_word: καθʼ ἃ ἤθελον ἐξομοιοῦσθαι
  choice: जिनके समान वे बनना चाहते थे
  rationale: ἐξομοιόω का अर्थ अपने को किसी के समान बनाना या उसके अनुरूप ढालना है। व्यक्ति-सूचक संबंध को हिन्दी में स्पष्ट और सहज रूप दिया गया है।
- source_word: πολεμίους
  choice: शत्रु
  rationale: यह विरोधी या दुश्मन के लिए सीधा और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: τιμωρητὰς
  choice: दण्ड देनेवाले
  rationale: τιμωρητής दण्ड देने या प्रतिशोध लेनेवाले को दर्शा सकता है। ‘दण्ड देनेवाले’ प्रतिशोध का भाव अनावश्यक रूप से निश्चित किए बिना दण्डात्मक आशय रखता है।
- source_word: ἔσχον
  choice: बन गए
  rationale: शाब्दिक अर्थ ‘उन्होंने ... पाया/उनके ... हुए’ है, पर परिणामस्वरूप संबंध को स्वाभाविक हिन्दी में ‘बन गए’ स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: विदेशी जीवन-रीति अपनाने का नैतिक और परिणामात्मक बल
  choice: 'पद को विडंबनापूर्ण प्रतिफल के कथन के रूप में रखा गया है: जिनकी जीवन-रीति की उन्होंने लालसा की, वही उनके शत्रु और दण्ड देनेवाले बने।'
  alternative: इसे अधिक तटस्थ ढंग से इस कथन के रूप में प्रस्तुत करना कि जिनकी वे प्रशंसा करते थे, उन्होंने बाद में उनका विरोध किया।
  rationale: ἐζήλουν और τιμωρητάς तथा अध्याय का प्रसंग नकारात्मक नैतिक मूल्यांकन और उसी से जुड़ा परिणाम दर्शाते हैं। अनुवाद इस बल को रखता है, पर पाठ से परे कोई विशिष्ट धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप। ‘घोर संकट’, ‘जीवन-रीति’ और ‘दण्ड देनेवाले’ मूल के गंभीर तथा नैतिक स्वर को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
