  yaml_path: translation/deuterocanon/2_maccabees/004/033.yaml
  text: And Onias[a], when he clearly recognized this, withdrew to a place of asylum at Daphne, which lies near Antioch.
translation:
  language: hi
  text: जब ओनियास ने यह बात स्पष्ट रूप से समझ ली, तो वह अन्ताकिया के पास स्थित दफ़्ने में एक शरणस्थान[a] में चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अभयस्थान।” यूनानी शब्द ऐसे शरणस्थान का बोध कराता है जिसे विधिक या पवित्र मान्यता के कारण अतिक्रमित नहीं किया जा सकता था, न कि केवल किसी सामान्य सुरक्षित जगह का।
    reason: lexical_alternative
lexical_decisions:
- source_word: σαφῶς ἐπεγνωκὼς
  choice: स्पष्ट रूप से समझ ली
  rationale: यह पदबंध केवल संदेह नहीं, बल्कि निश्चित और स्पष्ट बोध को व्यक्त करता है; आधुनिक हिन्दी में यह सहज और सटीक है।
- source_word: ἀπήνεγκεν ἀποκεχωρηκὼς
  choice: चला गया
  rationale: दोनों यूनानी क्रियारूप प्रसंग में संकट से हटकर सुरक्षित स्थान जाने का भाव देते हैं। हिन्दी में उनकी संयुक्त गति को सहज रूप से व्यक्त किया गया है, बिना अस्वाभाविक पुनरुक्ति के।
- source_word: εἰς ἄσυλον τόπον
  choice: एक शरणस्थान
  rationale: ἄσυλος ऐसा अभय या आश्रय-स्थान सूचित करता है जिसका उल्लंघन न किया जा सके; ‘शरणस्थान’ सामान्य पाठक के लिए स्वाभाविक है, जबकि विधिक-पवित्र अर्थछाया पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐπὶ Δάφνης
  choice: दफ़्ने में
  rationale: यहाँ ἐπί स्थानवाचक है और दफ़्ने को उस शरणस्थान के स्थान के रूप में बताता है।
- source_word: τῆς πρὸς Ἀντιοχίας κειμένης
  choice: अन्ताकिया के पास स्थित
  rationale: यह दफ़्ने की भौगोलिक पहचान स्पष्ट करता है और यूनानी संबंधवाचक कृदन्त का स्वाभाविक हिन्दी रूप है।
