  text: But when Sostratus[a], the commander of the citadel, pressed the claim—for the handling of the revenues belonged to him—for this reason the two men were summoned by the king.
translation:
  language: hi
  text: पर जब दुर्ग का अधीक्षक सोस्त्रातुस उस माँग की वसूली की कार्यवाही कर रहा था—क्योंकि राजस्व का प्रबंध उसी के अधिकार में था[a]—इसी कारण राजा ने उन दोनों को तलब किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि राजस्व का प्रबंध उसी की जिम्मेदारी था।” यूनानी पदबंध का अर्थ अधिक व्यापक रूप से वित्तीय मामलों पर अधिकार भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιουμένου ... τὴν ἀπαίτησιν
  choice: ने वह माँग उठाई
  rationale: यह पदबंध किसी माँग को सक्रिय रूप से सामने रखने या उस पर जोर देने को व्यक्त करता है। ‘माँग उठाई’ स्वाभाविक हिन्दी है और यूनानी की चालू प्रशासनिक कार्रवाई का भाव रखता है।
- source_word: Σωστράτου
  choice: सोस्त्रातुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में निकट लिप्यंतरण।
- source_word: τοῦ τῆς ἀκροπόλεως ἐπάρχου
  choice: दुर्ग के अधीक्षक
  rationale: ἐπάρχος सैन्य-प्रशासनिक अधिकारी का पद है; ‘अधीक्षक’ उसके अधिकार-क्षेत्र को व्यक्त करता है, जबकि ἀκρόπολις यहाँ किलेबंद दुर्ग है।
- source_word: ἡ τῶν διαφόρων πρᾶξις
  choice: राजस्व-संबंधी कामकाज
  rationale: प्रशासनिक संदर्भ में διάφορα राजस्व, देय राशियों या धनराशियों को और πρᾶξις उनके लेन-देन, वसूली या प्रबंधन को सूचित कर सकता है। यह चयन मूल की व्यापकता बनाए रखता है।
- source_word: πρὸς τοῦτον γὰρ ἦν
  choice: उसी के अधिकार में था
  rationale: यह वाक्यांश बताता है कि वित्तीय विषय सोस्त्रातुस के अधिकार-क्षेत्र या जिम्मेदारी में था।
- source_word: διʼ ἣν αἰτίαν
  choice: इसी कारण
  rationale: मूल के स्पष्ट कारणसूचक संबंध को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: οἱ δύο
  choice: उन दोनों
  rationale: यह पहले बताए गए दो व्यक्तियों की ओर संकेत करता है; हिन्दी में ‘उन दोनों’ बिना अनावश्यक रूप से ‘पुरुषों’ जोड़ने के स्पष्ट है।
- source_word: ὑπὸ τοῦ βασιλέως προσεκλήθησαν
  choice: राजा ने बुलवा भेजा
  rationale: प्रसंग में इसका अर्थ राजा द्वारा दोनों को अपने सामने बुलाने के लिए तलब कराना है; यह हिन्दी में स्वाभाविक रूप से राजकीय आदेश का भाव देता है।
