base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/022.yaml
  text: And he was received with great splendor by Jason and the city[a], and was welcomed with a torchlight procession and shouts; then in this way he encamped in Phoenicia.
translation:
  language: hi
  text: यासोन और नगरवासियों ने बड़े धूमधाम से उसका स्वागत किया, और मशालों के जुलूस तथा जयघोषों के साथ उसका अभिनंदन किया गया[a]। फिर इस प्रकार उसने फ़ीनीके में पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मशालें लिए हुए और ऊँची पुकारों के साथ।” यूनानी में मशालें लेकर किए गए समारोहपूर्ण सार्वजनिक स्वागत और उसके साथ उठने वाली ऊँची आवाज़ों का वर्णन है।
    reason: δᾳδουχίας और βοῶν के लिए अधिक शाब्दिक अर्थ की संभावना बनाए रखता है; विशेषतः ‘जयघोष’ प्रसंगानुकूल है, पर ‘ऊँची पुकारें’ मूल की व्यापकता को अधिक सीधे व्यक्त करता है।
lexical_decisions:
- source_word: μεγαλομερῶς
  choice: बड़े धूमधाम से
  rationale: यह क्रियाविशेषण भव्य और सार्वजनिक रीति से किए गए स्वागत को सूचित करता है। ‘बड़े धूमधाम से’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से विलासिता का अर्थ नहीं जोड़ता।
- source_word: ἀποδεχθεὶς
  choice: उसका स्वागत किया
  rationale: यहाँ कर्मवाच्य कृदन्त किसी आगंतुक शासक के औपचारिक स्वागत को व्यक्त करता है। हिन्दी में कर्तृवाच्य रचना अधिक स्वाभाविक है और यासोन तथा नगरवासियों को स्पष्ट कर्ता बनाए रखती है।
- source_word: τῆς πόλεως
  choice: नगरवासियों
  rationale: यूनानी में ‘नगर’ का प्रयोग वहाँ के समुदाय के लिए लक्षणा से हुआ है। हिन्दी में ‘नगरवासियों’ कहने से आशय सहज और स्पष्ट रहता है।
- source_word: δᾳδουχίας
  choice: मशालों के जुलूस
  rationale: संज्ञा समारोहपूर्वक मशालें लेकर चलने को दर्शाती है। यह चयन केवल मशालों की उपस्थिति नहीं, बल्कि सार्वजनिक स्वागत-समारोह का भाव भी व्यक्त करता है।
- source_word: βοῶν
  choice: जयघोषों
  rationale: यह शब्द ऊँची पुकारों या चिल्लाहटों को दर्शाता है। स्वागत के प्रसंग में ‘जयघोषों’ स्वाभाविक है, यद्यपि मूल शब्द स्वयं उन पुकारों की विषयवस्तु निश्चित नहीं करता; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: εἰσεδέχθη
  choice: उसे नगर में लाया गया
  rationale: क्रिया भीतर ग्रहण किए जाने या स्वागतपूर्वक भीतर ले जाए जाने का भाव देती है। यह अनुवाद पहले आए ‘स्वागत’ से अनावश्यक पुनरावृत्ति टालते हुए भीतर प्रवेश का संकेत बचाता है।
- source_word: εἶθʼ οὕτως
  choice: फिर इस प्रकार
  rationale: यह पदबंध क्रम और पिछले वर्णन से जुड़ी रीति—दोनों को व्यक्त करता है; इसलिए केवल ‘फिर’ कहकर इसके संबंधसूचक बल को नहीं हटाया गया।
- source_word: κατεστρατοπέδευσεν
  choice: उसने … पड़ाव डाला
  rationale: क्रिया शिविर या पड़ाव स्थापित करने को दर्शाती है। ‘पड़ाव डाला’ सुबोध हिन्दी है और मूल में स्पष्ट न किए गए सैनिक विवरण नहीं जोड़ता।
- source_word: Φοινίκην
  choice: फ़ीनीके
  rationale: यूनानी भौगोलिक नाम Φοινίκη का हिन्दी लिप्यंतरण।
