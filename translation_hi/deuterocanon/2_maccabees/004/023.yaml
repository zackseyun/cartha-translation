base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/023.yaml
  text: But after a period of three years[a], Jason sent Menelaus, the brother of the aforementioned Simon, to carry the money to the king and to deliver memoranda concerning necessary matters.
translation:
  language: hi
  text: परन्तु तीन वर्ष बाद, यासोन ने मेनेलाउस को—जो उस शमौन का भाई था जिसका पहले उल्लेख किया गया था—राजा के पास धनराशि पहुँचाने और आवश्यक मामलों से संबंधित ज्ञापनों का निपटारा करने[a] के लिए भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आवश्यक मामलों से संबंधित लिखित ज्ञापन प्रस्तुत करने।” यूनानी शब्द ὑπομνηματισμούς का अर्थ ज्ञापन या लिखित प्रतिवेदन हो सकता है, और τελέσοντα का अर्थ उन्हें पूरा करना या उनका निपटारा करना है; इस प्रशासनिक अभिव्यक्ति का सटीक आशय निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: परन्तु तीन वर्ष बीतने के बाद
  rationale: μετά के साथ कर्मकारक बीते हुए समय के बाद का बोध कराता है; δέ को हल्के कथात्मक संक्रमण के रूप में ‘परन्तु’ से व्यक्त किया गया है।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: कथात्मक प्रसंग में ἀποστέλλω का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Ἰάσων Μενέλαον
  choice: यासोन ने … मेनेलाउस को
  rationale: यूनानी व्यक्तिनामों का देवनागरी में निकट लिप्यंतरण किया गया है और हिन्दी वाक्य-विन्यास के अनुसार कारक लगाए गए हैं।
- source_word: τὸν τοῦ προσηνομένου Σίμωνος ἀδελφόν
  choice: पहले बताए गए शमौन के भाई
  rationale: προσηνομένου पहले उल्लेख किए गए व्यक्ति की ओर संकेत करता है; ‘पहले बताए गए’ आधुनिक हिन्दी में स्पष्ट है। Σίμων के लिए प्रचलित बाइबलीय हिन्दी नाम ‘शमौन’ रखा गया है।
- source_word: παρακομίζοντα τὰ χρήματα τῷ βασιλεῖ
  choice: राजा के पास धनराशि पहुँचाने
  rationale: कृदन्त भेजे जाने का उद्देश्य बताता है; χρήματα यहाँ सामान्य वस्तुओं के बजाय धन या रकम को सूचित करता है।
- source_word: περὶ πραγμάτων ἀναγκαίων
  choice: आवश्यक मामलों के विषय में
  rationale: यह अनुवाद πράγματα की व्यापकता और ἀναγκαίων की आवश्यकता-संबंधी भावना को अनावश्यक रूप से ‘अत्यावश्यक’ या ‘तात्कालिक’ बनाए बिना सुरक्षित रखता है।
- source_word: ὑπομνηματισμοὺς τελέσοντα
  choice: लिखित ज्ञापन प्रस्तुत करने
  rationale: ὑπομνηματισμός प्रशासनिक ज्ञापन, लिखित टिप्पणी या प्रतिवेदन को सूचित कर सकता है। प्रसंग में ‘प्रस्तुत करने’ स्वाभाविक है, जबकि τελέω में निहित पूरा करने या कार्यान्वित करने की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
