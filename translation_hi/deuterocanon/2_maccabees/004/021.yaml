base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/021.yaml
  text: When Apollonius son of Menestheus had been sent to Egypt for the accession festivities of King Philometor[a], Antiochus, learning that he had become estranged from his own affairs, took thought for his own security. Therefore, after arriving at Joppa, he went on to Jerusalem.
translation:
  language: hi
  text: जब मेनेस्थेयुस के पुत्र अपोल्लोनियुस को राजा फिलोमेतोर के राज्यारोहण-समारोहों के लिए मिस्र भेजा गया था, तब अन्तियोकुस ने यह जानकर कि वह अपने ही मामलों के संबंध में परायी स्थिति में था[a], अपनी सुरक्षा की चिंता करने लगा। इसलिए वह याफा पहुँचकर यरूशलेम चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि वह अपने ही मामलों से अलग-थलग था।” यूनानी वाक्यांश संक्षिप्त और अस्पष्ट है; इसका अर्थ अधिक व्यापक रूप से यह भी हो सकता है कि अन्तियोकुस अपने राजनीतिक मामलों में प्रतिकूल स्थिति में था।
    reason: मूल यूनानी में अन्तियोकुस, उसके मामले, और उनसे संबंधित उत्पन्न राजनीतिक परिस्थिति के बीच संबंध पूरी तरह स्पष्ट नहीं है।
lexical_decisions:
- source_word: Ἀποσταλέντος
  choice: भेजा गया था
  rationale: यह एओरिस्ट कर्मवाच्य कृदन्त है, जो मुख्य घटनाक्रम से पहले की परिस्थिति बताता है; हिन्दी में पूर्वकालिक क्रम स्वाभाविक रूप से व्यक्त होता है।
- source_word: διὰ τὰ προτοκλήρια
  choice: राज्यारोहण-समारोहों के लिए
  rationale: दुर्लभ बहुवचन संज्ञा शासक के राज्यारोहण अथवा औपचारिक पदग्रहण से जुड़े उत्सवों को सूचित करती है।
- source_word: τοῦ φιλομήτορος βασιλέως
  choice: राजा फिलोमेतोर के
  rationale: Φιλομήτωρ यहाँ मिस्र के राजा की प्रचलित राजकीय उपाधि/नाम है; इसका शाब्दिक अर्थ देने से ऐतिहासिक पहचान धुँधली हो जाती।
- source_word: μεταλαβὼν
  choice: यह जानकर
  rationale: सन्दर्भ में इसका अर्थ सूचना प्राप्त करने या स्थिति समझ लेने का है; ‘यह जानकर’ सहज और पर्याप्त रूप से तटस्थ है।
- source_word: ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: कि वह अपने ही मामलों से अलग-थलग हो गया था
  rationale: यूनानी वाक्यांश संक्षिप्त और व्याकरणतः कठिन है। यह अनुवाद ἀλλότριον की परायेपन/अलगाव की धारणा और γεγονότων की परिणामी अवस्था को बनाए रखता है; सम्भावित व्यापक राजनीतिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τῆς καθʼ αὑτὸν ἀσφαλίας ἐφρόντιζεν
  choice: अपनी सुरक्षा की चिंता की
  rationale: ἐφρόντιζεν सक्रिय ध्यान और सावधानी को व्यक्त करता है, जबकि ἀσφάλεια यहाँ व्यक्तिगत या राजनीतिक सुरक्षा हो सकती है।
- source_word: παραγενόμενος
  choice: पहुँचकर
  rationale: एओरिस्ट कृदन्त याफा पहुँचने को अगले गमन से पहले की क्रिया बताता है।
- source_word: κατήντησεν
  choice: चला गया
  rationale: मुख्य क्रिया यरूशलेम तक आगे बढ़ने को बताती है; ‘चला गया’ पहले आए ‘पहुँचकर’ की अनावश्यक पुनरावृत्ति से बचाता है।
theological_decisions:
- issue: ऐतिहासिक उपाधि Φιλομήτωρ
  choice: इसे राजकीय नाम/उपाधि मानकर ‘फिलोमेतोर’ लिप्यन्तरित किया गया
  alternative: इसका शाब्दिक अनुवाद ‘मातृप्रेमी’ किया जाए
  rationale: यह पद मिस्र के राजा की स्थापित ऐतिहासिक पहचान है; शाब्दिक अनुवाद पाठक के लिए उस पहचान को अस्पष्ट कर देगा।
- issue: अन्तियोकुस के अलगाव का अस्पष्ट वर्णन
  choice: मुख्य पाठ में ‘अपने ही मामलों से अलग-थलग हो गया था’
  alternative: ‘अपने हितों से जुड़ी परिस्थिति उसके प्रतिकूल थी’ या ‘अपने विषय की बातों से वह दूर हो गया था’
  rationale: मूल यूनानी वाक्यांश दबा हुआ और अस्पष्ट है। मुख्य पाठ व्यक्ति के अलगाव की व्याकरणिक सम्भावना बनाए रखता है और राजनीतिक प्रतिकूलता के व्यापक अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रजिस्टर रखा गया है। ऐतिहासिक नामों का देवनागरी लिप्यन्तरण किया गया है; ‘याफा’ आधुनिक हिन्दी बाइबिल-पाठकों के लिए पहचाना जाने वाला स्थान-नाम है।
