  text: लेकिन मेनेलाउस, जिसे पहले ही अपने पक्ष में कर लिया गया था,[a] ने दोरिमेनेस के पुत्र टॉलेमी को काफी बड़ी धनराशि देने का वादा किया, ताकि वह राजा को मना सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द λελιμμένος दुर्लभ और अर्थ की दृष्टि से कठिन है। इसका अर्थ ‘पहले ही अनुकूल किया जा चुका था’ या ‘जिसका मन पहले ही जीत लिया गया था’ भी हो सकता है। निष्क्रिय रूप यह नहीं बताता कि उसे किसने अपने पक्ष में किया था।
    reason: lexical_alternative
