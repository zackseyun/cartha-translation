  rationale: सम्प्रदान कारक टॉलेमी को धन के वादे का प्राप्तकर्ता बताता है, और Δορυμένους को पितृनाम-सूचक संबंधकारक मानना सबसे स्वाभाविक है।
- source_word: πρὸς τὸ πεῖσαι τὸν βασιλέα
  choice: राजा को मनाने के लिए
  rationale: पूर्वसर्ग के साथ सविभक्ति क्रियार्थक संज्ञा प्रयोजन व्यक्त करती है। ‘मनाने के लिए’ उद्देश्य को संक्षिप्त और स्वाभाविक रूप से रखता है।
