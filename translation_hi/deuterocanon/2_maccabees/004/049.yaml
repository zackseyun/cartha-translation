    reason: lexical_alternative
  - marker: b
    text: ‘समुदायों’ के लिए प्रयुक्त यूनानी शब्द बहुवचन में है और उसका अर्थ जनसमूह, नागरिक निकाय या जिले भी हो सकता है।
    reason: lexical_alternative
