    text: ‘दण्ड’ का अनुवाद ‘हानि’ या ‘सज़ा’ भी किया जा सकता है; यूनानी शब्द में दण्डात्मक और हानिकारक—दोनों भाव आ सकते हैं।
    reason: lexical_alternative
