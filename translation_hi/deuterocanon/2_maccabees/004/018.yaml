    text: यूनानी शब्द का शाब्दिक अर्थ ‘पाँच-वर्षीय’ है, पर प्राचीन समावेशी गणना के अनुसार ऐसे खेल वास्तव में हर चार वर्ष पर आयोजित होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγομένου
  choice: आयोजित की जा रही थीं
  rationale: ἄγω के इस प्रयोग में किसी उत्सव या प्रतियोगिता को आयोजित करने का भाव है। अपूर्णकालिक परिस्थिति को हिन्दी में चल रही क्रिया से व्यक्त किया गया है।
- source_word: πενταετηρικοῦ
  choice: हर चार वर्ष पर होनेवाली
  rationale: शब्द का शाब्दिक संबंध ‘पाँच-वर्षीय’ से है, पर यूनानी समावेशी गणना में यह सामान्यतः चार वर्ष के वास्तविक अंतराल पर मनाए जानेवाले आयोजन को सूचित करता है।
- source_word: ἀγῶνος
  choice: खेल-प्रतियोगिताएँ
  rationale: नागरिक उत्सव के संदर्भ में ἀγών सार्वजनिक खेलों या प्रतियोगिताओं को दर्शाता है। ‘खेल-प्रतियोगिताएँ’ आधुनिक हिन्दी में स्पष्ट है और केवल एक प्रतियोगिता का अनावश्यक संकेत नहीं देता।
- source_word: ἐν Τύρῳ
  choice: सूर नगर में
  rationale: नगर Τύρος के लिए प्रचलित हिन्दी बाइबलीय नाम ‘सूर’ रखा गया है; ‘नगर’ जोड़ने से सामान्य पाठक के लिए स्थान स्पष्ट होता है।
- source_word: τοῦ βασιλέως παρόντος
  choice: और राजा भी वहाँ उपस्थित था
  rationale: दूसरे genitive absolute को स्वाभाविक हिन्दी समन्वित उपवाक्य में व्यक्त किया गया है। ‘भी’ दोनों साथ-साथ चल रही परिस्थितियों को सहज रूप से जोड़ता है।
