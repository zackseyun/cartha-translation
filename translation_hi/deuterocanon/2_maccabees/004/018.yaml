  text: When the quadrennial games were being held in Tyre[a], and the king was present,
translation:
  language: hi
  text: जब सूर नगर में हर चार वर्ष पर होनेवाली खेल-प्रतियोगिताएँ[a] आयोजित की जा रही थीं और राजा वहाँ उपस्थित था,
  philosophy: optimal-equivalence
  footnotes:
