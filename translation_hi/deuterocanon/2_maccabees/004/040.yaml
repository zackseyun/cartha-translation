  text: But when the crowds were rising up and being filled with anger[a], Lysimachus armed about three thousand men and began unjust violence, with a certain Auranus taking the lead[c][b], a man advanced in age and no less in ignorance.
translation:
  language: hi
  text: परन्तु जब जनसमूह उठ खड़े हुए और क्रोध से भरते जा रहे थे, तब लिसिमाखुस ने लगभग तीन हज़ार[a] लोगों को हथियारबंद किया और अन्यायपूर्ण हिंसा शुरू कर दी[b]। औरानुस नाम का एक व्यक्ति उनकी अगुवाई कर रहा था। वह उम्र में तो काफ़ी आगे बढ़ा हुआ था, पर अज्ञान में भी उतना ही आगे था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लगभग तीन हज़ार” का अनुवाद “कोई तीन हज़ार” भी हो सकता है; यूनानी में संख्या अनुमानित हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “अन्यायपूर्ण हाथों का आरंभ किया” है—अर्थात उसने अनुचित हिंसक कार्रवाई शुरू की।
    reason: idiom_clarification
  - marker: c
    text: 'यूनानी कथन व्यंग्यपूर्ण है: वह उम्र में आगे बढ़ा हुआ था और अज्ञान में भी उतना ही आगे था।'
    reason: literary_clarification
lexical_decisions:
- source_word: ἐπεγειρομένων
  choice: उठ खड़े हुए
  rationale: यह प्रयोग जनसमूह के उत्तेजित होकर सक्रिय विरोध में उठने का आरंभिक भाव व्यक्त करता है, बिना यह निश्चित किए कि उन्हें किसी बाहरी व्यक्ति ने उकसाया था।
- source_word: ὄχλων
  choice: जनसमूह
  rationale: यह ὄχλων का तटस्थ और स्वाभाविक हिन्दी रूप है; ‘उपद्रवी भीड़’ कहना मूल शब्द से अधिक नकारात्मक अर्थ जोड़ देता।
- source_word: ταῖς ὀργαῖς διεμπιπλαμένων
  choice: क्रोध से भरते जा रहे थे
  rationale: यह जारी और तीव्र होती भावावस्था को व्यक्त करता है तथा ὀργαῖς के सीधे अर्थ ‘क्रोध’ को बनाए रखता है।
- source_word: καθοπλίσας
  choice: हथियारों से लैस किया
  rationale: क्रिया का अर्थ लोगों को युद्ध या हिंसक कार्रवाई के लिए हथियारों से सुसज्जित करना है।
- source_word: πρὸς τρισχιλίους
  choice: लगभग तीन हज़ार
  rationale: संख्या के साथ πρός अनुमान का बोध करा सकता है; ‘लगभग’ इस अनिश्चितता को स्पष्ट रखता है।
- source_word: κατήρξατο χειρῶν ἀδίκων
  choice: अन्यायपूर्ण हिंसा शुरू कर दी
  rationale: यूनानी में शाब्दिक रूप से ‘अन्यायपूर्ण हाथों का आरंभ किया’ है, जो अनुचित हिंसक कार्रवाई आरंभ करने का मुहावरा है। हिन्दी में चुना गया रूप अर्थ और नैतिक मूल्यांकन दोनों बनाए रखता है।
- source_word: προηγησαμένου
  choice: अगुवाई कर रहा था
  rationale: यह औरानुस को आगे चलने या नेतृत्व करनेवाले के रूप में दिखाता है, पर नेतृत्व के सटीक सैन्य पद को निर्धारित नहीं करता।
- source_word: τινὸς Αὑρανοῦ
  choice: औरानुस नाम का एक व्यक्ति
  rationale: τινός एक अन्यथा अपरिचित व्यक्ति का परिचय देता है; नाम को यूनानी के आधार पर लिप्यंतरित किया गया है।
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: आयु में तो बहुत आगे बढ़ चुका था
  rationale: यह उसकी वृद्धावस्था बताता है और अगले व्यंग्यपूर्ण तुलनात्मक वाक्य के लिए ‘आगे बढ़ चुका’ की समानांतर भाषा बचाए रखता है।
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: पर अज्ञान में भी उससे कुछ कम नहीं था
  rationale: यह आयु और अज्ञान के बीच मूल का तीखा व्यंग्यपूर्ण समानांतर संबंध सुरक्षित रखता है, बिना ‘मूर्खता’ जैसा अधिक व्याख्यात्मक शब्द जोड़ने के।
