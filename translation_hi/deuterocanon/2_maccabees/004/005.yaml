  text: he presented himself to the king[a], not becoming an accuser of his fellow citizens, but seeking what was advantageous both publicly and privately for the whole multitude.
translation:
  language: hi
  text: वह राजा के पास गया, अपने सहनागरिकों पर आरोप लगानेवाला बनकर नहीं, बल्कि समस्त जनसमुदाय के सामूहिक तथा व्यक्तिगत हित की चिंता करते हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बल्कि समुदाय के हित और जनसमुदाय में प्रत्येक व्यक्ति के हित की चिंता करते हुए।”
    reason: κοινῇ καὶ κατʼ ἰδίαν παντὶ τῷ πλήθει के संक्षिप्त वाक्य-विन्यास का वैकल्पिक अनुवाद; यह सामुदायिक हित और जनसमुदाय के प्रत्येक व्यक्ति के हित के संबंध को स्पष्ट करता है।
lexical_decisions:
- source_word: διεκοσμήθη
  choice: राजा के सामने उपस्थित हुआ
  rationale: यह प्रसंग राजदरबार में ओनियास के अपने को प्रस्तुत करने या वहाँ पहुँचने का है। ‘उपस्थित हुआ’ हिन्दी में स्वाभाविक है और क्रिया का अनावश्यक रूप से शाब्दिक अर्थ ‘सजाया गया’ नहीं करता।
- source_word: οὐ γινόμενος
  choice: बनकर नहीं
  rationale: यह कृदन्त उसके राजा के सामने जाने के ढंग को बताता है। ‘बनकर नहीं’ मूल की अभिव्यक्ति को निकटता से रखते हुए हिन्दी में सहज है।
- source_word: τῶν πολιτῶν
  choice: अपने सहनागरिकों
  rationale: πολῖται एक ही नागरिक समुदाय के सदस्यों को सूचित करता है; ‘अपने सहनागरिकों’ से उसका संबंध स्पष्ट होता है।
- source_word: κατήγορος
  choice: दोष लगानेवाला
  rationale: यह सामान्य न्यायिक अर्थ ‘अभियोग लगानेवाला’ रखता है। ‘दोष लगानेवाला’ साधारण पाठक के लिए अधिक स्पष्ट है और औपचारिक आधुनिक अभियोजन-व्यवस्था का संकेत नहीं देता।
- source_word: τὸ δὲ σύμφορον
  choice: जो हितकर था
  rationale: यह संज्ञार्थक विशेषण लाभदायक या हितकर बात को दर्शाता है। यह चयन अमूर्त अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: सामूहिक और व्यक्तिगत—दोनों रूपों में
  rationale: यह युग्म सार्वजनिक/सामुदायिक और निजी/व्यक्तिगत हित के बीच संबंध को व्यक्त करता है। हिन्दी में यह अनुवाद दोनों पहलुओं को स्पष्ट रखता है।
- source_word: παντὶ τῷ πλήθει
  choice: समस्त जनसमुदाय के लिए
  rationale: πλῆθος लोगों की पूरी संख्या या व्यापक समुदाय को दर्शाता है। ‘समस्त जनसमुदाय’ उसकी व्यापकता को बनाए रखता है।
theological_decisions:
- issue: राजा के सामने ओनियास की अपील का नैतिक स्वरूप
  choice: वह अपने सहनागरिकों पर दोष लगाने नहीं, बल्कि पूरे समुदाय के सामूहिक और व्यक्तिगत हित की खोज में गया।
  alternative: अंतिम वाक्यांश का अर्थ ‘समुदाय के लिए और लोगों में से हर एक व्यक्ति के लिए जो हितकर था’ भी लिया जा सकता है।
  rationale: यूनानी वाक्य का अंतिम भाग संक्षिप्त है और सामुदायिक तथा व्यक्तिगत हित के संबंध को एक से अधिक ढंग से जोड़ा जा सकता है। मुख्य पाठ दोनों आयाम सुरक्षित रखता है और पादटिप्पणी वैकल्पिक संयोजन बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘सहनागरिक’, ‘जनसमुदाय’, ‘सामूहिक’ और ‘व्यक्तिगत’ नागरिक तथा नैतिक संदर्भ को बिना सांप्रदायिक व्याख्या जोड़े व्यक्त करते हैं।
