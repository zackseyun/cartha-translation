  yaml_path: translation/deuterocanon/2_maccabees/004/029.yaml
  text: And Menelaus left Lysimachus[a], his own brother, as successor to the high priesthood, while Sostratus left Crates, the one over the Cyprians.
translation:
  language: hi
  text: और मेनेलाउस अपने भाई लिसिमाखुस को महायाजक-पद का उत्तराधिकारी छोड़ गया, जबकि सोस्त्रातुस ने कुप्रुस के लोगों के प्रभारी क्रातेस[a] को छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो कुप्रुस के लोगों के ऊपर था।” इसका अर्थ “कुप्रुस के लोगों का अधिकारी” या “उनका राज्यपाल” भी हो सकता है; यूनानी में प्रशासनिक पद की ठीक-ठीक उपाधि स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: छोड़ गया / छोड़ दिया
  rationale: क्रिया का मूल अर्थ ‘छोड़ना’ या ‘पीछे छोड़ जाना’ है। प्रसंग में किसी को अपने स्थान पर दायित्व सौंपकर छोड़ने का भाव है, पर ‘नियुक्त किया’ कहने से अधिक अर्थ जोड़ जाता।
- source_word: τῆς ἀρχιερωσύνης διάδοχον
  choice: महायाजक-पद का उत्तराधिकारी
  rationale: διάδοχον स्पष्ट रूप से ‘उत्तराधिकारी’ को और ἀρχιερωσύνης महायाजक के पद या पदाधिकार को सूचित करता है। यह रूप अर्थ और पद दोनों को स्पष्ट रखता है।
- source_word: τὸν ἑαυτοῦ ἀδελφόν
  choice: अपने सगे भाई
  rationale: ἑαυτοῦ के बलाघात को ‘अपने’ से रखा गया है और आधुनिक हिन्दी में स्वाभाविक स्पष्टता के लिए ‘सगे’ का प्रयोग किया गया है।
- source_word: τὸν ἐπὶ τῶν Κυπρίων
  choice: कुप्रुसवासियों के प्रभारी
  rationale: यूनानी पदबंध का सामान्य अर्थ उन लोगों ‘के ऊपर’ या उनका ‘प्रभारी’ होना है। मूल पाठ कोई निश्चित प्रशासनिक उपाधि नहीं बताता, इसलिए ‘राज्यपाल’ जैसे अधिक विशिष्ट पद से बचा गया है।
