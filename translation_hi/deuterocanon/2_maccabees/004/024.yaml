base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/024.yaml
  text: But after being presented to the king and magnifying him by the display of his authority[a], he secured the high priesthood for himself[b], outbidding Jason by three hundred talents of silver.
translation:
  language: hi
  text: परन्तु राजा से उसका परिचय कराए जाने के बाद[a], उसने अधिकार के प्रभावशाली प्रदर्शन द्वारा राजा का गुणगान किया[b] और यासोन से तीन सौ किक्कार चाँदी अधिक देने की पेशकश करके महायाजक का पद अपने लिए प्राप्त कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा के सामने प्रस्तुत किए जाने के बाद” अथवा “राजा से उसकी सिफ़ारिश किए जाने के बाद।” यूनानी पद राजदरबार में औपचारिक परिचय या सिफ़ारिश का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “अधिकार के मुख/उपस्थिति से।” यह पदबंध प्रभावशाली अथवा अधिकारयुक्त बाहरी प्रदर्शन या व्यक्तित्व का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συσταθεὶς τῷ βασιλεῖ
  choice: राजा से उसका परिचय कराए जाने के बाद
  rationale: निष्क्रिय कृदन्त राजदरबार में औपचारिक परिचय या सिफ़ारिश—दोनों का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए परिचय का भाव लिया गया है और व्यापक संभावना पाद-टिप्पणी में दी गई है।
- source_word: δοξάσας αὐτὸν
  choice: राजा का गुणगान किया
  rationale: δοξάζω यहाँ राजा की प्रशंसा या बड़ाई करने का अर्थ देता है। ‘चापलूसी’ नैतिक आशय को आवश्यकता से अधिक स्पष्ट कर देता, इसलिए अपेक्षाकृत तटस्थ अभिव्यक्ति चुनी गई है।
- source_word: τῷ προσώπῳ τῆς ἐξουσίας
  choice: अपने अधिकारपूर्ण व्यक्तित्व से
  rationale: शाब्दिक रूप से कठिन पदबंध ‘अधिकार के मुख/उपस्थिति’ को व्यक्त करता है और प्रभावशाली, अधिकारयुक्त बाहरी व्यक्तित्व या ठाट का बोध कराता है। यह चयन उस मुहावरे को पठनीय हिन्दी में व्यक्त करता है।
- source_word: εἰς ἑαυτὸν κατήντησεν ἀρχιερωσύνην
  choice: महायाजक का पद अपने लिए प्राप्त कर लिया
  rationale: यूनानी रचना पद को स्वयं के लिए हासिल करने पर बल देती है। ‘प्राप्त कर लिया’ सफल, स्वार्थ-संबंधी अधिग्रहण को स्वाभाविक हिन्दी में रखता है।
- source_word: ὑπερβάλλων τὸν Ἰάσονα
  choice: यासोन से ... अधिक देने की पेशकश करके
  rationale: इसके तुरंत बाद दी गई चाँदी की राशि बताती है कि उसने यासोन से अधिक धन देने का प्रस्ताव रखा। हिन्दी में ‘बोली लगाकर पछाड़ दिया’ की अपेक्षा यह वाक्यांश अधिक स्पष्ट और गरिमापूर्ण है।
- source_word: τάλαντα ἀργυρίου τριακόσια
  choice: तीन सौ किक्कार चाँदी
  rationale: प्राचीन भार/मुद्रा-इकाई को आधुनिक मूल्य में अनुमानतः बदलने के बजाय हिन्दी बाइबलीय पद ‘किक्कार’ रखा गया है।
theological_decisions:
- issue: राजा की प्रशंसा में नैतिक रंग
  choice: ‘गुणगान किया’—जो प्रशंसा व्यक्त करता है पर स्वयं यह निश्चित नहीं करता कि वह कपटपूर्ण चापलूसी थी।
  alternative: ‘चापलूसी की’
  rationale: राजनीतिक प्रसंग व्यवहार को स्वार्थपूर्ण दिखाता है, फिर भी δοξάζω अपने आप में ‘चापलूसी’ का अनिवार्य अर्थ नहीं रखता। अनुवाद ने नैतिक निर्णय को कथानक पर छोड़ा है।
- issue: τῷ προσώπῳ τῆς ἐξουσίας का अर्थ
  choice: अधिकारयुक्त बाहरी व्यक्तित्व या प्रभाव के रूप में समझना।
  alternative: शाब्दिक ‘अधिकार के मुख से’
  rationale: यह सघन यूनानी मुहावरा है, कोई धर्मसिद्धान्त-संबंधी कथन नहीं। शाब्दिक हिन्दी अस्पष्ट होती; चुना गया रूप मूल बिंब का आशय पठनीय ढंग से देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘यासोन’ यूनानी Ἰάσων का निकट देवनागरी रूप है; ‘महायाजक’ और ‘किक्कार’ हिन्दी बाइबलीय पाठकों के लिए परिचित पद हैं। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में अपने संबंधित पदबंधों के तुरंत बाद लगाए गए हैं।
