base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/042.yaml
  text: But when they also became aware of the attack by Lysimachus[a], some snatched up stones, others thick pieces of wood, and some, grabbing handfuls of the ashes lying nearby[c][b], hurled them all together at those around Lysimachus.
translation:
  language: hi
  text: पर जब उन्हें लिसिमाखुस के आक्रमण का भी पता चला[a], तो कुछ पत्थर, कुछ लकड़ी के मोटे टुकड़े[b], और कुछ पास पड़ी राख की मुट्ठियाँ लेकर, लिसिमाखुस के आसपास के लोगों[c] पर बेतरतीब ढंग से फेंकने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लिसिमाखुस के आक्रमण को जानते हुए।” यूनानी कृदंत का अर्थ स्थिर रूप से “जानते हुए” या प्रसंग में गतिशील रूप से “पता चला” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “लकड़ियों की मोटाइयाँ,” अर्थात लकड़ी के मोटे या भारी टुकड़े।
    reason: lexical_alternative
  - marker: c
    text: “लिसिमाखुस के आसपास के लोग” से सम्भवतः उसके साथ आए लोग या उसके समर्थक अभिप्रेत हैं।
    reason: lexical_alternative
