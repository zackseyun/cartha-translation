- source_word: σποδοῦ
  choice: राख
  rationale: यह शब्द सामान्यतः राख को दर्शाता है; ‘धूल’ ठोस दृश्य को कमजोर करती और ‘अंगारे’ ताप का ऐसा अर्थ जोड़ता जो मूल में आवश्यक नहीं है।
- source_word: δραξόμενοι
  choice: मुट्ठियों में भर ली
  rationale: क्रिया हाथ से, विशेषकर मुट्ठी भर, लेने का भाव देती है। यह हिन्दी में क्रिया का भौतिक चित्र स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φύρδην
  choice: बेतरतीब ढंग से
  rationale: क्रियाविशेषण मिश्रित, अव्यवस्थित या बिना क्रम के की गई कार्रवाई का संकेत देता है। ‘बेतरतीब ढंग से’ इस अस्पष्टता को ‘सबने एक साथ’ जैसे अधिक निश्चित अर्थ में नहीं बदलता।
- source_word: ἐνετίνασσον
  choice: फेंकने लगे
  rationale: अपूर्ण भूतकाल बार-बार या जारी फेंकने की क्रिया दिखाता है। ‘फेंकने लगे’ हिन्दी में इस गतिशील पक्ष को व्यक्त करता है।
- source_word: τοὺς περὶ τὸν Λυσίμαχον
  choice: लिसिमाखुस के आसपास के लोगों
  rationale: यह मूल पदबंध के निकट है और यह तय नहीं करता कि वे केवल सैनिक, सेवक या समर्थक थे।
