  choice: छल से उसके पद से हटा दिया था / स्वयं ... उसी तरह पद से हटा दिया गया
  rationale: यूनानी क्रिया के सक्रिय और कर्मवाच्य रूपों की व्यंग्यपूर्ण उलटबाँसी को समान हिन्दी अभिव्यक्ति से सुरक्षित रखा गया है। संदर्भ में महायाजक का पद निहित है, इसलिए ‘पद से हटाना’ अर्थ स्पष्ट करता है; ‘छल से’ क्रिया की कपटपूर्ण छाया व्यक्त करता है।
- source_word: τὸν ἴδιον ἀδελφὸν
  choice: अपने ही भाई को
  rationale: ‘ही’ ἴδιον के बलाघात को व्यक्त करके पारिवारिक विश्वासघात की गंभीरता उभारता है।
- source_word: φυγὰς ... ὑπῆλθεν
  choice: भागकर ... चला गया
  rationale: यह स्वाभाविक आधुनिक हिन्दी में उसके भगोड़े अथवा निर्वासित होकर चले जाने का भाव व्यक्त करता है।
- source_word: τὴν Ἀμμανῖτιν χώραν
  choice: अम्मोनियों के देश में
  rationale: जातिवाचक विशेषण और χώρα का स्पष्ट तथा प्रचलित हिन्दी रूप।
