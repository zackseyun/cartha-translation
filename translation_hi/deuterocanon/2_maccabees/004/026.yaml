    text: या, “जिसने अपने ही भाई को कपट से विस्थापित किया था, वह स्वयं दूसरे के द्वारा विस्थापित किया गया।” यूनानी में सक्रिय और कर्मवाच्य रूप में एक ही क्रिया का प्रयोग हुआ है, जो विडंबनापूर्ण उलटफेर पर बल देता है।
