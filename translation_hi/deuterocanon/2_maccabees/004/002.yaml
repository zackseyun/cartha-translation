- source_word: ζηλωτὴν τῶν νόμων
  choice: व्यवस्थाओं के प्रति उत्साही व्यक्ति
  rationale: ζηλωτής प्रबल निष्ठा या उत्साह रखने वाले को बताता है और νόμων स्पष्टतः बहुवचन है; यह अनुवाद किसी बाद के दलगत अर्थ को आरोपित किए बिना दोनों बातें सुरक्षित रखता है।
- source_word: ἐπίβουλον τῶν πραγμάτων
  choice: राज्य के विरुद्ध षड्यंत्रकारी
  rationale: वाक्यांश सार्वजनिक या राजनीतिक मामलों के विरुद्ध कुटिल योजना बनाने का आरोप व्यक्त करता है; यह संक्षिप्त हिन्दी उस राजनीतिक बल को सामने लाती है।
- source_word: ἐτόλμα λέγειν
