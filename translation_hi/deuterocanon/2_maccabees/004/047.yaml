- source_word: ὡς ἀναψύχοντα
  choice: मानो उसे ताज़गी दिलाने के लिए
  rationale: ὡς यहाँ प्रकट उद्देश्य अथवा बहाने का भाव देता है, जबकि ἀναψύχω ताज़गी, राहत या पुनः चेतना देने जैसे अर्थ रख सकता है। मुख्य पाठ में व्यापक और स्वाभाविक ‘ताज़गी दिलाने’ चुना गया है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: τὸν βασιλέα
  choice: राजा को
  rationale: यूनानी के स्पष्ट कर्म का सीधा अनुवाद।
- source_word: μετέθηκεν
  choice: ले गया
  rationale: यह स्थान बदलने या दूसरे स्थान पर पहुँचाने की कार्रवाई को स्वाभाविक कथात्मक हिन्दी में व्यक्त करता है।
