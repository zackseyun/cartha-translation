  yaml_path: translation/deuterocanon/2_maccabees/004/008.yaml
  text: Jason[a], the brother of Onias, undermined the high priesthood, promising the king through a petition three hundred sixty talents of silver[b], and eighty talents from some other revenue.
translation:
  language: hi
  text: ओनियास के भाई यासोन ने महायाजक-पद को भ्रष्ट किया; उसने राजा से निवेदन करके[a] चाँदी के तीन सौ साठ तोड़े[b] और किसी अन्य आय से अस्सी तोड़े देने का वचन दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा से भेंट करके”; यूनानी शब्द औपचारिक निवेदन या राजा तक व्यक्तिगत पहुँच—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तीन सौ के अतिरिक्त साठ तोड़े,” अर्थात कुल तीन सौ साठ तोड़े।
    reason: source_structure
lexical_decisions:
- source_word: ὑπενόθευσεν
  choice: छल-कपट से हथिया लिया
  rationale: क्रिया में जालसाजी, भ्रष्ट तरीके या अनुचित साधनों से पद प्राप्त करने का नकारात्मक भाव है। प्रसंग में यासोन महायाजक-पद को केवल कमज़ोर नहीं करता, बल्कि धन का वचन देकर उसे अनुचित रीति से अपने हाथ में लेता है।
- source_word: ἀρχιερωσύνην
  choice: महायाजक-पद
  rationale: यह शब्द महायाजक के कार्य मात्र नहीं, बल्कि उसके पद और गरिमा को सूचित करता है।
- source_word: ἐπαγγειλάμενος
  choice: देने का वचन दिया
  rationale: कृदन्त बताता है कि यासोन ने राजा से निश्चित धनराशि देने की प्रतिज्ञा की; हिन्दी में पूर्ण वाक्य अधिक स्वाभाविक है।
- source_word: διʼ ἐντεύξεως
  choice: निवेदन के द्वारा
  rationale: ἐντεύξις शासक के सामने औपचारिक निवेदन, पहुँच या प्रत्यक्ष भेंट को सूचित कर सकता है। मुख्य पाठ में 'निवेदन' लिया गया है और दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἀργυρίου
  choice: चाँदी के
  rationale: सम्बन्धकारक रूप भुगतान की धातु या मूल्य बताता है; 'चाँदी के तोड़े' हिन्दी बाइबलीय प्रयोग में स्पष्ट है।
- source_word: τάλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις
  choice: तीन सौ साठ तोड़े
  rationale: यूनानी पदबंध का शाब्दिक क्रम 'तीन सौ के अतिरिक्त साठ' है, जिसका कुल योग 360 है। सहज मुख्य पाठ में कुल राशि दी गई है और मूल संरचना पादटिप्पणी में सुरक्षित है।
- source_word: προσόδου τινὸς ἄλλης
  choice: किसी अन्य आमदनी से
  rationale: πρόσοδος आय या राजस्व का स्रोत है। यह पहले बताई गई चाँदी की राशि से अलग आय-स्रोत को दर्शाता है।
- source_word: τάλαντα ὀγδοήκοντα
  choice: अस्सी तोड़े
  rationale: राशि और प्राचीन भार-मुद्रा इकाई को सीधे रूप में रखा गया है।
theological_decisions:
- issue: महायाजक-पद के प्रति यासोन के कार्य का नैतिक स्वर
  choice: '''छल-कपट से हथिया लिया'' द्वारा पद की भ्रष्ट और अनुचित प्राप्ति व्यक्त की गई है।'
  alternative: '''महायाजक-पद को भ्रष्ट किया'' या ''महायाजक-पद को कमज़ोर किया'''
  rationale: मूल क्रिया में स्पष्ट नकारात्मक नैतिक मूल्यांकन है। निकट प्रसंग में धन का वचन देकर पद प्राप्त करना सामने आता है; इसलिए हिन्दी अनुवाद भ्रष्ट अधिग्रहण का भाव रखता है, पर उससे आगे कोई सांप्रदायिक या धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध शैली रखी गई है। नामों के लिए प्रचलित हिन्दी रूप ‘ओनियास’ और ‘यासोन’, पद के लिए ‘महायाजक-पद’, तथा प्राचीन इकाई के लिए ‘तोड़ा’ प्रयुक्त हुआ है।
