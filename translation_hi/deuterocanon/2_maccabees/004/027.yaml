  yaml_path: translation/deuterocanon/2_maccabees/004/027.yaml
  text: But Menelaus held on to the office[a], yet he made no provision at all for the money he had promised to the king.
translation:
  language: hi
  text: परन्तु मेनेलाउस अपने पद पर बना रहा, पर जिस धन को देने का उसने राजा से वादा किया था, उसके लिए उसने कोई प्रबंध नहीं किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “उसने उस धन में से कुछ भी नहीं चुकाया, जिसे देने का उसने राजा से वादा किया था।” यूनानी पाठ का शाब्दिक भाव है कि उसने वचन दिए हुए धन के विषय में “कुछ भी व्यवस्थित नहीं किया।”
    reason: οὐδὲν εὐτάκτει का शाब्दिक अर्थ व्यवस्था या प्रबंध न करने का है, जबकि संदर्भ में भुगतान न करने का अधिक स्पष्ट अर्थ संभव है।
lexical_decisions:
- source_word: ἀρχῆς
  choice: पद
  rationale: संदर्भ में यह मेनेलाउस के महायाजकीय आधिकारिक पद को सूचित करता है; ‘पद’ अमूर्त सत्ता या शासन की अपेक्षा अधिक स्वाभाविक और सटीक है।
- source_word: ἐκράτει
  choice: बना रहा
  rationale: अपूर्णकाल निरंतर स्थिति को व्यक्त करता है—मेनेलाउस उस पद पर अपना अधिकार बनाए हुए था। ‘अपने पद पर बना रहा’ आधुनिक हिन्दी में इस निरंतर धारण को सहज रूप से व्यक्त करता है।
- source_word: ἐπηγγελμένων
  choice: वचन दिया था
  rationale: कृदन्त पहले किए गए वादे को दर्शाता है। राजा को धन देने के पूर्ववर्ती वचन के लिए यह स्वाभाविक हिन्दी है।
- source_word: χρημάτων
  choice: धन
  rationale: यहाँ शब्द राजा को दी जाने वाली निश्चित आर्थिक राशि या रकम को सूचित करता है; ‘धन’ स्पष्ट और गरिमापूर्ण है।
- source_word: οὐδὲν εὐτάκτει
  choice: कोई प्रबंध नहीं किया
  rationale: εὐτακτέω का मूल भाव किसी बात को व्यवस्थित करने या उसका प्रबंध करने का है। संदर्भ में भुगतान न करने का आशय निहित है, पर मुख्य पाठ उस आशय को सीधे ‘कुछ नहीं चुकाया’ कहकर अधिक निश्चित नहीं बनाता।
