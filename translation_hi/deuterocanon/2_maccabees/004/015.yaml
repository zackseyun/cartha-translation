translation:
  language: hi
  text: और वे अपने पूर्वजों से मिले सम्मानों[a] को कुछ भी नहीं समझते थे, बल्कि यूनानी प्रतिष्ठा के चिह्नों[b] को सर्वोत्तम मानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पैतृक सम्मानों’ अथवा ‘अपने पूर्वजों के सम्मानों’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द δόξας का अनुवाद ‘गौरवों’ या ‘सम्मानों’ के रूप में भी किया जा सकता है; यहाँ उसका आशय यूनानी संस्कृति में प्रतिष्ठित मानी जाने वाली बातों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρῴας τιμὰς
  choice: अपने पूर्वजों से मिले सम्मान
  rationale: πατρῷος का अर्थ पैतृक या पूर्वजों से संबंधित है, और τιμαί सम्मान अथवा प्रतिष्ठित विशेषाधिकारों को सूचित कर सकता है। यह अभिव्यक्ति आधुनिक हिन्दी में सहज रहते हुए दोनों शब्दों का आशय बनाए रखती है।
- source_word: ἐν οὐδενὶ τεθειμένοι
  choice: कुछ भी नहीं समझते थे
  rationale: यह यूनानी मुहावरा किसी वस्तु को नगण्य या महत्त्वहीन मानने का भाव देता है। चुना हुआ हिन्दी वाक्यांश तिरस्कारपूर्ण मूल्यांकन व्यक्त करता है, पर मूल से अधिक तीखा शब्द नहीं जोड़ता।
- source_word: Ἑλληνικὰς δόξας
  choice: यूनानी प्रतिष्ठा के चिह्न
  rationale: Ἑλληνικός यहाँ यूनानी संस्कृति से संबंधित है। बहुवचन δόξαι इस संदर्भ में गौरव, सम्मान या सामाजिक प्रतिष्ठा दिलाने वाली बातों की ओर संकेत करता है; ‘प्रतिष्ठा के चिह्न’ इस संदर्भगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καλλίστας
  choice: सर्वोत्तम
  rationale: καλός के इस श्रेष्ठतम रूप में केवल दृश्य सुंदरता नहीं, बल्कि मूल्यांकन की दृष्टि से सबसे उत्तम समझने का भाव है।
- source_word: ἡγούμενοι
  choice: मानते थे
  rationale: यह कृदंत यहाँ विचार या मूल्यांकन को व्यक्त करता है; ‘मानते थे’ हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: यहूदी पैतृक विरासत और यूनानी सांस्कृतिक प्रतिष्ठा के बीच मूल्यपरक विरोध
  choice: मूल पाठ के तीखे विरोध को ‘कुछ भी नहीं समझते थे’ और ‘सर्वोत्तम मानते थे’ द्वारा वर्णनात्मक रूप से सुरक्षित रखा गया है।
  alternative: ‘पूर्वजों के सम्मानों का तिरस्कार करते थे और यूनानी गौरवों को सबसे श्रेष्ठ समझते थे।’
  rationale: यूनानी पाठ पूर्वजों के सम्मानों को नगण्य मानने की बात कहता है, पर ‘तिरस्कार करना’ क्रिया का प्रत्यक्ष प्रयोग नहीं करता। इसलिए अनुवाद नकारात्मक मूल्यांकन को बनाए रखता है, किन्तु उसे मूल से अधिक तीखा नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। समानांतर कृदंतों का विरोध ‘नहीं समझते थे, बल्कि … मानते थे’ द्वारा स्पष्ट किया गया है।
