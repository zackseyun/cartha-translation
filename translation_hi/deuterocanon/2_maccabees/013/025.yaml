  yaml_path: translation/deuterocanon/2_maccabees/013/025.yaml
  text: He came to Ptolemais[a]. The people of Ptolemais were displeased about the terms, for they were exceedingly fearful[b], and they wanted to set aside the arrangements.
translation:
  language: hi
  text: वह प्तोलमैस पहुँचा। प्तोलमैस के लोग संधि की शर्तों से अप्रसन्न थे, क्योंकि वे अत्यन्त भयभीत थे; वे प्रावधानों[a] को रद्द करना चाहते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शर्तों” या “व्यवस्थाओं”; यूनानी संज्ञा दुर्लभ है और संभवतः समझौते के विशिष्ट प्रावधानों को सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के स्रोत-पाठ पर स्रोत-सत्यापन में बड़ी असंगति का संकेत है। यह अनुवाद उपलब्ध यूनानी पाठ का अनुसरण करता है, पर कुछ शाब्दिक विवरण सामान्य से कम निश्चित हैं।
    reason: textual_variant
lexical_decisions:
- source_word: Πτολεμαΐδα / Πτολεμαεῖς
  choice: पतुलिमैस / पतुलिमैस के निवासी
  rationale: नगर के यूनानी नाम का हिन्दी लिप्यंतरण किया गया है; निवासी-सूचक रूप को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: ἐδυσφόρουν
  choice: अप्रसन्न थे
  rationale: क्रिया किसी बात को बुरा मानने या उससे व्यथित होने का भाव देती है; राजनीतिक प्रसंग में यह चयन रोष को अनावश्यक रूप से तीव्र किए बिना प्रतिक्रिया व्यक्त करता है।
- source_word: συνθηκῶν
  choice: संधि की शर्तों
  rationale: प्रसंग में यह समझौते अथवा संधि की बातचीत से तय हुई शर्तों को सूचित करता है।
- source_word: ἐδειλίαζον ... ὑπεράγαν
  choice: अत्यन्त भयभीत थे
  rationale: ἐδειλίαζον के भय या भीरुता के भाव और ὑπεράγαν की प्रबल तीव्रता को सुरक्षित रखता है, पर अनावश्यक नैतिक निंदा नहीं जोड़ता।
- source_word: ἀθετεῖν
  choice: रद्द करना
  rationale: यहाँ आशय तय प्रावधानों को अमान्य करने या निरस्त करने की इच्छा से है।
- source_word: διαστάλσεις
  choice: निर्धारित प्रावधानों
  rationale: दुर्लभ संज्ञा संभवतः समझौते में अलग-अलग निर्धारित बातों अथवा विशिष्ट प्रावधानों को सूचित करती है; हिन्दी में अर्थ स्पष्ट रखते हुए इसकी विशिष्टता बचाई गई है।
