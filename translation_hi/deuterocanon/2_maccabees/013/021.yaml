- source_word: ἐκ τῆς Ἰουδαϊκῆς τάξεως
  choice: यहूदी सेना की पंक्तियों में से
  rationale: τάξις का मूल भाव क्रमबद्ध दल या सैन्य पंक्ति है; प्रसंग में यहूदियों के सैन्य दल से संबंध स्वाभाविक है।
- source_word: ἀνεζητήθη
  choice: ढूँढ़ निकाला गया
  rationale: क्रिया केवल खोजने का प्रयास नहीं, तलाश करके व्यक्ति की पहचान/स्थिति जान लेने की ओर संकेत करती है।
- source_word: κατελήμφθη
  choice: पकड़ लिया गया
  rationale: गिरफ्तार या काबू में किए जाने का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: κατεκλείσθη
  choice: बंदी बना दिया गया
  rationale: शाब्दिक अर्थ बंद कर देना/कैद करना है; यहाँ व्यक्ति के लिए ‘बंदी बना दिया गया’ प्रसंगानुकूल और स्पष्ट है।
