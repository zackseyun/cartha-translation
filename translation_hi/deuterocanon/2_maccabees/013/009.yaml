  text: But the king[a], weighed down in spirit, advanced, intending to inflict on the Jews the worst things that had happened under his father.
translation:
  language: hi
  text: परन्तु राजा मन में बोझ लिए आगे बढ़ रहा था; उसका इरादा[a] था कि वह यहूदियों पर उन सबसे बुरी बातों को लाए जो उसके पिता के समय घटी थीं।
  philosophy: optimal-equivalence
  footnotes:
