    text: या, “वह इस अपेक्षा के साथ आगे बढ़ रहा था कि यहूदियों पर उन सबसे बुरी बातों को लाए जो उसके पिता के समय घटी थीं।” यूनानी कृदन्त में इरादे के साथ अपेक्षा का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονήμασιν
  choice: मन में
  rationale: यह बहुवचन दत्तिव βεβαρημένος के साथ राजा की भीतरी सोच और मनोवृत्ति का क्षेत्र बताता है। ‘मन में’ सहज हिन्दी है और किसी विशिष्ट भावना को अनावश्यक रूप से नहीं जोड़ता।
- source_word: βεβαρημένος
  choice: भारी बोझ लिए
  rationale: पूर्ण कृदन्त एक बनी हुई, बोझिल अवस्था व्यक्त करता है। यह अनुवाद मूल रूपक को बनाए रखता है, यद्यपि सन्दर्भ से आगे के वाक्य में उसका कठोर उद्देश्य स्पष्ट होता है।
- source_word: ἦρχετο
  choice: आगे बढ़ा
  rationale: सैन्य अभियान के प्रसंग में अपूर्णकालिक क्रिया आगे आने या बढ़ते जाने को दर्शाती है; ‘आरम्भ किया’ यहाँ कम उपयुक्त है।
- source_word: τὰ χείριστα
  choice: सबसे बुरी विपत्तियाँ
  rationale: नपुंसकलिंग बहुवचन उत्कृष्टतम पद संज्ञा के रूप में प्रयुक्त है। ‘विपत्तियाँ’ यहूदियों पर आने वाली बुरी घटनाओं को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उनके सटीक स्वरूप को निर्धारित किए।
- source_word: τῶν ἐπὶ τοῦ πατρὸς αὐτοῦ γεγονότων
  choice: अपने पिता के समय ... जो ... आई थीं
  rationale: ἐπί और सम्बन्धकारक यहाँ समय अथवा शासनकाल सूचित करते हैं। ‘पिता के समय’ राजनीतिक काल का अर्थ रखता है और यह दावा नहीं करता कि पिता ने हर घटना स्वयं की थी।
- source_word: ἐνδεξόμενος
  choice: उसका इरादा था ... उन्हें ... लाए
  rationale: इस विरोधी प्रसंग में कृदन्त यहूदियों पर पूर्वकाल की सबसे बुरी बातों को लाने का उद्देश्य व्यक्त करता है। साथ ही इसकी अपेक्षा-सूचक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
