translation:
  language: hi
  text: जब यहूदा को इन बातों का पता चला, तो उसने लोगों को आदेश दिया कि वे दिन-रात प्रभु को पुकारें, कि जैसे अन्य अवसरों पर, वैसे ही अब भी वह उनकी सहायता करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταλαβὼν
  choice: को इन बातों का पता चला
  rationale: यह कृदन्त यहाँ सूचना मिलने या बात जानने का भाव देता है। आधुनिक हिन्दी में यह स्वाभाविक है और प्रसंग की प्रतिक्रिया को स्पष्ट रखता है।
- source_word: παρήγγειλεν
  choice: आदेश दिया
  rationale: यह क्रिया यहूदा के निर्देश की अधिकारपूर्ण शक्ति को बनाए रखती है।
- source_word: τῷ πλήθει
  choice: लोगों को
  rationale: πλῆθος यहाँ यहूदा के अधीन एकत्र जनसमूह को सूचित करता है। ‘लोगों’ से हिन्दी में सामूहिक अर्थ सहजता से व्यक्त होता है; ‘भीड़’ अनायास या अव्यवस्थित जमाव का अनुचित संकेत दे सकता है।
- source_word: διʼ ἡμέρας καὶ νυκτὸς
  choice: दिन-रात
  rationale: यह लगातार प्रार्थना करने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: ἐπικαλεῖσθαι τὸν κύριον
  choice: प्रभु को पुकारें
  rationale: यह प्रार्थनापूर्वक सहायता माँगने का बाइबलीय और स्वाभाविक हिन्दी प्रयोग है।
- source_word: κύριον
  choice: प्रभु
  rationale: यहाँ प्रार्थना के संदर्भ में κύριος परमेश्वर के लिए है; ‘प्रभु’ उसके धार्मिक और शास्त्रीय स्वर को सुरक्षित रखता है।
- source_word: εἴ ποτε καὶ ἄλλοτε, καὶ νῦν
  choice: जैसे उसने पहले भी ... वैसे ही अब भी
  rationale: यूनानी अभिव्यक्ति पूर्व अवसरों पर मिली सहायता को याद करते हुए वर्तमान सहायता की याचना करती है। तुलनात्मक हिन्दी इस आशय को स्पष्ट और स्वाभाविक बनाती है।
- source_word: ἐπιβοηθεῖν
  choice: उनकी सहायता करे
  rationale: यह माँगी गई दैवी सहायता को सीधे व्यक्त करता है। ‘आकर सहायता करे’ भी संभव है, पर क्रिया में भौतिक आगमन को अनिवार्य बनाना उचित नहीं।
theological_decisions:
- issue: प्रार्थना के संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यह पद सामूहिक रूप से परमेश्वर को पुकारने का वर्णन करता है। ‘प्रभु’ बाइबलीय-धार्मिक अर्थ को सुरक्षित रखता है, जबकि ‘स्वामी’ यहाँ अनावश्यक रूप से लौकिक स्वामी-दास संबंध का संकेत दे सकता है।
- issue: εἴ ποτε καὶ ἄλλοτε में पूर्व दैवी सहायता का भाव
  choice: जैसे उसने पहले भी उनकी सहायता की थी
  alternative: यदि कभी पहले भी, तो अब भी
  rationale: शाब्दिक सशर्त रूप हिन्दी में संदेह का ऐसा भाव दे सकता है जो प्रसंग का आशय नहीं है। तुलना के रूप में अनुवाद पूर्व सहायता के स्मरण और वर्तमान याचना के संबंध को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। वाक्य यूनानी की प्रार्थनात्मक तात्कालिकता और पूर्व दैवी सहायता से वर्तमान आशा के संबंध को बनाए रखता है।
