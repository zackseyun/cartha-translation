  text: And when day was already beginning to appear[a], this had happened because the Lord’s protection had quickly come to his aid.
translation:
  language: hi
  text: और जब दिन निकलने लगा था, तब तक यह हो चुका था, क्योंकि प्रभु की रक्षा शीघ्र ही उसकी सहायता को आ पहुँची थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि प्रभु की समयोचित सहायता या रक्षा शीघ्र ही उसके पास आ पहुँची थी।” दुर्लभ यूनानी संज्ञा ἐπαρήγορασις त्वरित सहायता या राहत पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποφαινούσης ... τῆς ἡμέρας
  choice: जब दिन का उजाला होने ही लगा था
  rationale: यह वाक्यांश दिन के प्रकाश के आरम्भिक दिखाई देने को व्यक्त करता है; यह हिन्दी प्रयोग उसके आरम्भिक भाव को स्वाभाविक ढंग से बनाए रखता है।
- source_word: τοῦτο ἐγέγονει
  choice: तब तक यह हो चुका था
  rationale: क्रिया का रूप भोर होने के समय से पहले पूरी हो चुकी घटना दर्शाता है; ‘तब तक’ हिन्दी में यह काल-संबंध स्पष्ट करता है।
- source_word: διὰ
  choice: क्योंकि
  rationale: यहाँ पूर्वसर्ग कारण व्यक्त करता है, इसलिए ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: ἐπαρήγορασιν
  choice: सहायता ... तुरंत आ पहुँची थी
  rationale: यह दुर्लभ संज्ञा शीघ्र मिलने वाली सहायता या राहत का संकेत देती है; हिन्दी में क्रियात्मक अभिव्यक्ति गति और सहायता दोनों भावों को संप्रेषित करती है।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: सम्प्रदान कारक सहायता पाने वाले व्यक्ति को दर्शाता है; ‘उसके लिए’ इस संबंध को बिना अनावश्यक पहचान जोड़े बनाए रखता है।
- source_word: τοῦ κυρίου
  choice: प्रभु की
  rationale: κύριος के लिए ‘प्रभु’ श्रद्धापूर्ण, प्रचलित और सेप्टुआजिन्त की ईश्वर-संबंधी भाषा के अनुरूप है।
- source_word: σκέπην
  choice: रक्षा
  rationale: यह शब्द ओट, आश्रय या संरक्षण का अर्थ दे सकता है; युद्ध और छुटकारे के प्रसंग में ‘रक्षा’ उपयुक्त है, जबकि निकटवर्ती दुर्लभ संज्ञा के सहायक भाव को भी अलग बनाए रखा गया है।
theological_decisions:
- issue: व्यवस्थाविवरणोत्तर यूनानी आख्यान में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में यह परमेश्वर को छुटकारा देने वाले के रूप में संबोधित करता है। ‘प्रभु’ श्रद्धा और सेप्टुआजिन्त के प्रचलित प्रयोग से निरंतरता बनाए रखता है।
- issue: ईश्वरीय हस्तक्षेप में सहायता और संरक्षण के संबंध को व्यक्त करना
  choice: प्रभु की सहायता और रक्षा ... तुरंत आ पहुँची थी
  alternative: प्रभु की समयोचित रक्षा उसके लिए शीघ्र हुई थी
  rationale: यूनानी में दुर्लभ ἐπαρήγορασις और σκέπη का संबंध कुछ अस्पष्ट है। मुख्य पाठ दोनों सहायता और रक्षा के भावों को रखता है, जबकि पादटिप्पणी समयोचित या शीघ्र सहायता वाले वैकल्पिक बल को सुरक्षित रखती है।
