  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ‘दिन का उजाला होने ही लगा था’ भोर के आरम्भिक भाव को रखता है; ‘तब तक’ पूर्वपूर्ण घटना को स्पष्ट करता है।
