  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'प्राचीन' समुदाय के वरिष्ठ अगुओं के लिए पारंपरिक और व्यापक रूप से समझा जाने वाला बाइबलीय पद है। वाक्य की दीर्घ यूनानी संरचना को बनाए रखते हुए हिन्दी क्रम को स्वाभाविक बनाया गया है।
