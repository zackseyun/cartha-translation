  yaml_path: translation/deuterocanon/2_maccabees/013/013.yaml
  text: But he himself[a], after meeting with the elders, decided, before the king’s army could invade Judea and gain control of the city, to go out and decide the matter with the help of God.
translation:
  language: hi
  text: परन्तु उसने प्राचीनों के साथ अलग से विचार-विमर्श करने के बाद यह निश्चय किया कि राजा की सेना के यहूदिया पर चढ़ाई करने और नगर पर अधिकार कर लेने से पहले वे बाहर निकलें और परमेश्वर की सहायता से इस मामले का निर्णय करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस परिस्थिति का न्याय करें” अथवा “मामलों का निपटारा करें।” यूनानी अभिव्यक्ति व्यापक है और सामने आए संकट को निर्णायक रूप से सुलझाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἑαυτὸν ... σὺν τοῖς πρεσβυτέροις γενόμενος
  choice: प्राचीनों के साथ अलग से विचार-विमर्श करने के बाद
  rationale: καθʼ ἑαυτόν यहाँ अकेलेपन के बजाय एक अलग या निजी परामर्श को सूचित करता है, क्योंकि वाक्य स्पष्टतः प्राचीनों की सहभागिता बताता है।
- source_word: ἐβουλεύσατο
  choice: यह निश्चय किया
  rationale: क्रिया विचार-विमर्श के फलस्वरूप बनी योजना या निर्णय को व्यक्त करती है; पूर्ववर्ती पद परामर्श का भाव पहले ही स्पष्ट करता है।
- source_word: πρὶν εἰσβαλεῖν τὸ στράτευμα τοῦ βασιλέως ἐπὶ τὴν Ἰουδαίαν
  choice: राजा की सेना के यहूदिया पर चढ़ाई करने ... से पहले
  rationale: सैन्य प्रसंग में εἰσβαλεῖν शत्रुतापूर्ण प्रवेश है; 'चढ़ाई करना' स्वाभाविक और स्पष्ट हिन्दी सैन्य अभिव्यक्ति है।
- source_word: γενέσθαι τῆς πόλεως ἐγκρατεῖς
  choice: नगर पर अधिकार कर लेने
  rationale: ἐγκρατεῖς नगर पर प्रभुत्व या नियंत्रण प्राप्त करने का भाव देता है।
- source_word: ἐξελόντας
  choice: वे बाहर निकलें
  rationale: बहुवचन कर्मकारक कृदन्त परामर्श करने वाले समूह की सामूहिक कार्रवाई की ओर संकेत करता है; हिन्दी में बहुवचन कर्ता को स्पष्ट करना आवश्यक है।
- source_word: κρῖναι τὰ πράγματα
  choice: इस मामले का निर्णय करें
  rationale: यूनानी वाक्यांश संकटगत मामलों का न्याय, निपटारा या निर्णायक समाधान करने के व्यापक अर्थ को रखता है; मुख्य पाठ में सहज हिन्दी दी गई है और विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: τῇ τοῦ θεοῦ βοηθείᾳ
  choice: परमेश्वर की सहायता से
  rationale: यह साधनवाचक चतुर्थी है और कार्य में परमेश्वर की सहायता पर निर्भरता को स्पष्ट रखती है।
theological_decisions:
- issue: ἐξελόντας κρῖναι में निहित कर्ता
  choice: बहुवचन—वह और उसके साथ के लोग बाहर निकलें
  alternative: वह अकेला बाहर निकले और मामले का निर्णय करे
  rationale: ἐξελόντας का व्याकरणिक बहुवचन उस समूह की ओर संकेत करता है जो विचार-विमर्श में सम्मिलित था; अनुवाद समूह की ठीक-ठीक सदस्यता को अनावश्यक रूप से निश्चित नहीं करता।
- issue: κρῖναι τὰ πράγματα में संकट के समाधान का स्वरूप
  choice: मामले का निर्णय करना
  alternative: परिस्थिति का न्याय करना या मामलों का निपटारा करना
  rationale: मूल अभिव्यक्ति व्यापक है; इसे केवल युद्ध जीतने या कोई विशिष्ट न्यायिक प्रक्रिया मानकर संकीर्ण नहीं किया गया।
