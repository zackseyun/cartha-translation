  text: In the one hundred forty-ninth year[a], it happened to those around Judas that Antiochus Eupator had arrived with forces against Judea,
translation:
  language: hi
  text: एक सौ उनचासवें वर्ष में यहूदा के साथियों को पता चला[a] कि अन्तियोकस यूपातोर सैन्य दलों के साथ यहूदिया पर चढ़ आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के साथियों के सामने यह घटना घटी कि अन्तियोकस यूपातोर आ पहुँचा था।” यूनानी क्रिया किसी घटना के घटने या उसकी सूचना यहूदा के दल तक पहुँचने—दोनों का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτῳ δὲ ἐνάτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: एक सौ उनचासवें वर्ष में
  rationale: कालसूचक सम्प्रदान कारक की यूनानी रचना को स्वाभाविक हिन्दी में प्रस्तुत करते हुए औपचारिक वर्ष-गणना सुरक्षित रखी गई है।
- source_word: προσέπεσεν
  choice: पता चला
  rationale: यह क्रिया यहाँ यहूदा के दल तक किसी घटना या सूचना के पहुँचने का संकेत दे सकती है। ‘पता चला’ प्रसंग में स्वाभाविक है, जबकि उसके व्यापक घटनात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: यहूदा और उसके साथियों को
  rationale: शाब्दिक अर्थ ‘यहूदा के आस-पास के लोगों को’ है; हिन्दी में ‘यहूदा और उसके साथियों को’ उसी समूह को स्पष्ट और सहज रूप में व्यक्त करता है तथा यूनानी से अधिक कोई लैंगिक विवरण नहीं जोड़ता।
- source_word: Ἀντίοχον τὸν Εὐπάτορα
  choice: अन्तियोकुस यूपातोर
  rationale: व्यक्तिनाम और उपाधि को प्रचलित राजकीय नाम-रूप में रखा गया है।
- source_word: παραγεγόνα
  choice: चढ़ आया था
  rationale: पूर्ण रूप पहले ही हो चुके आगमन और उसके वर्तमान प्रभाव को दर्शाता है। सैन्य प्रसंग में ‘चढ़ आया था’ आगमन तथा आक्रमणकारी गति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σὺν πλήθεσιν
  choice: बड़ी सैन्य टुकड़ियों के साथ
  rationale: बहुवचन πλήθεσιν का मूल भाव बड़ी संख्या या जनसमूह है; सैन्य प्रसंग में यह अनेक सैन्य दलों को सूचित करता है। यह अनुवाद एकवचन ‘सेना’ थोपे बिना आशय स्पष्ट करता है।
- source_word: ἐπὶ τὴν Ἰουδαίαν
  choice: यहूदिया पर
  rationale: सैन्य गमन के प्रसंग में ἐπί के साथ कर्मकारक लक्ष्य के विरुद्ध बढ़ने का भाव रखता है; ‘यहूदिया पर चढ़ आया’ इस शत्रुतापूर्ण दिशा को व्यक्त करता है।
