base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/002.yaml
  text: 'and with him Lysias[a], the guardian and overseer of affairs, each having a Greek force: eleven myriads of infantry, five thousand three hundred cavalry, twenty-two elephants[b], and three hundred scythed chariots.'
translation:
  language: hi
  text: 'और उसके साथ लूसियास भी था, जो संरक्षक और राजकीय मामलों का प्रभारी था। उन दोनों में से प्रत्येक के पास एक यूनानी सैन्य बल था: पैदल सैनिकों के ग्यारह दस-हज़ार[a], पाँच हज़ार तीन सौ घुड़सवार, बाईस हाथी और हँसियों से लैस तीन सौ रथ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् 1,10,000 पैदल सैनिक। यूनानी पाठ में संख्या शाब्दिक रूप से ‘ग्यारह दस-हज़ार’ है।
    reason: मूल यूनानी संख्या-पद्धति को मुख्य पाठ में रखते हुए उसका कुल मान स्पष्ट करना।
lexical_decisions:
- source_word: σὺν αὐτῷ Λυσίαν
  choice: और उसके साथ लूसियास भी था
  rationale: साथ होने का सीधा अर्थ रखा गया है और हिन्दी वाक्य की स्वाभाविकता के लिए निहित क्रिया ‘था’ जोड़ी गई है। Λυσίαν का प्रचलित हिन्दी लिप्यंतरण ‘लूसियास’ लिया गया है।
- source_word: τὸν ἐπίτροπον
  choice: संरक्षक
  rationale: ἐπίτροπος सौंपे गए संरक्षण अथवा प्रतिनिधिक अधिकार को व्यक्त करता है। ‘संरक्षक’ मूल अर्थ के निकट है और ‘राजप्रतिनिधि’ जैसा अधिक विशिष्ट अर्थ आरोपित नहीं करता।
- source_word: καὶ ἐπὶ τῶν πραγμάτων
  choice: और राजकीय मामलों का प्रभारी
  rationale: यह मुहावरा प्रशासनिक अथवा राज्य-संबंधी मामलों पर अधिकार सूचित करता है। ‘राजकीय मामलों का प्रभारी’ आधुनिक हिन्दी में स्पष्ट और पद-सूचक है।
- source_word: ἕκαστον ἔχοντα δύναμιν Ἑλληνικὴν
  choice: उन दोनों में से प्रत्येक के पास एक यूनानी सेना थी
  rationale: ἕκαστον का संबंध अन्तियोकुस और लूसियास दोनों से है; ‘उन दोनों में से’ इसे हिन्दी में स्पष्ट करता है। Ἑλληνικήν को जातीय अर्थ तक सीमित करने के बजाय तत्कालीन यूनानी/हेलेनिस्ती सैन्य बल के रूप में ‘यूनानी सेना’ कहा गया है।
- source_word: πεζῶν μυριάδας ἕνδεκα
  choice: ग्यारह दस-हज़ार[a] पैदल सैनिक
  rationale: μυριάς दस हज़ार की गणना-इकाई है। मूल की संख्यात्मक अभिव्यक्ति बचाते हुए इसे साधारण हिन्दी पाठक के लिए ‘दस-हज़ार’ कहा गया है।
- source_word: ἱππέων πεντακισχιλίους τριακοσίους
  choice: पाँच हज़ार तीन सौ घुड़सवार
  rationale: ἱππεῖς का स्वाभाविक सैन्य हिन्दी रूप ‘घुड़सवार’ है।
- source_word: ἐλέφαντας εἴκοσι δύο
  choice: बाईस हाथी
  rationale: संख्या और संज्ञा का सीधा अनुवाद; प्रसंग में ये युद्ध में प्रयुक्त हाथी हैं, पर मूल में यहाँ अलग से ‘युद्ध’ शब्द नहीं है।
- source_word: ἅρματα δὲ δρεπανηφόρα τριακόσια
  choice: हँसियों से लैस तीन सौ रथ
  rationale: δρεπανηφόρα का अर्थ हँसिया-जैसे धारदार फल लगे हुए रथ है। ‘हँसियों से लैस’ तकनीकी आशय को ‘हँसियेदार’ की अपेक्षा अधिक सहजता से बताता है।
