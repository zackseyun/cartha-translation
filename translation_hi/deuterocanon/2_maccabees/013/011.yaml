  yaml_path: translation/deuterocanon/2_maccabees/013/011.yaml
  text: '[they were] about to be deprived of the law and fatherland and holy temple[a], and [he urged them] not to allow the people, who had just now recovered a little[b], to become subject to the reviling nations.'
translation:
  language: hi
  text: '[वे] व्यवस्था, पैतृक देश[a] और पवित्र मन्दिर से वंचित होने वाले थे; और [उसने उनसे आग्रह किया] कि वे उन लोगों को, जिन्हें अभी-अभी थोड़ी-सी राहत मिली थी, निन्दा करनेवाली[b] जातियों के अधीन न होने दें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वदेश’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपशब्द कहनेवाली’ अथवा ‘ईशनिन्दा करनेवाली’। यूनानी शब्द अपमानजनक या अपवित्र वाणी का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στερεῖσθαι
  choice: से वंचित होने
  rationale: यह शब्द किसी वस्तु से बलपूर्वक या गंभीर रूप से वंचित किए जाने का भाव रखता है; ‘से वंचित होने’ स्वाभाविक हिन्दी में उसी हानि को व्यक्त करता है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: यहूदी सन्दर्भ में यह पैतृक धार्मिक व्यवस्था अर्थात तोराह की ओर संकेत करता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित और पर्याप्त व्यापक है।
- source_word: πατρίδος
  choice: पैतृक देश
  rationale: यह शब्द पूर्वजों और अपनी जन्मभूमि से जुड़े देश को दर्शाता है; ‘पैतृक देश’ उसके पारिवारिक-राष्ट्रीय भाव को बनाए रखता है।
- source_word: ἱεροῦ ἁγίου
  choice: पवित्र मन्दिर
  rationale: ἱερόν मन्दिर अथवा उसके पवित्र परिसर को और ἅγιος उसकी पवित्रता को व्यक्त करता है; सन्दर्भ में ‘पवित्र मन्दिर’ स्पष्ट और स्वाभाविक है।
- source_word: ἄρτι βραχέως ἀνεψυγμένα
  choice: अभी-अभी थोड़ी राहत पाई थी
  rationale: वाक्यांश हाल में मिली सीमित राहत या पुनर्जीवन का संकेत देता है; यह अनुवाद हालियापन और अल्पता दोनों को सुरक्षित रखता है।
- source_word: λαὸν
  choice: लोगों
  rationale: यह सामूहिक रूप से यहूदी प्रजा को सूचित करता है; हिन्दी वाक्य में ‘उन लोगों को’ स्वाभाविक है।
- source_word: δυσφήμοις ἔθνεσιν
  choice: निन्दा करनेवाली जातियों
  rationale: δυσφήμος में बुरा बोलने, निन्दा करने या अपवित्र वचन बोलने का भाव हो सकता है; ‘निन्दा करनेवाली’ इस अर्थ-सीमा को किसी एक विशिष्ट धार्मिक अर्थ तक सीमित नहीं करती।
- source_word: ὑποχειρίους γενέσθαι
  choice: के अधीन न होने दें
  rationale: यह अभिव्यक्ति किसी दूसरे के अधिकार या नियन्त्रण में आ जाने को दर्शाती है; हिन्दी में यह संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: पद में निहित कर्ता और मुख्य क्रिया की पूर्ति
  choice: 'सन्दर्भ से आवश्यक शब्दों को कोष्ठकों में दिया गया: ‘[वे]’ और ‘[उसने उनसे आग्रह किया]’।'
  alternative: पूर्ववर्ती पद के साथ जोड़कर बिना कोष्ठकों के एक संयुक्त वाक्य बनाया जा सकता है।
  rationale: यूनानी पद अपने आप में वाक्य-विन्यास की दृष्टि से पूर्ववर्ती सन्दर्भ पर निर्भर है। कोष्ठक हिन्दी में अर्थ स्पष्ट करते हुए बताते हैं कि ये शब्द इस पद में प्रत्यक्ष रूप से उपस्थित नहीं हैं।
- issue: δυσφήμοις का धार्मिक या सामान्य अर्थ
  choice: ‘निन्दा करनेवाली’
  alternative: ‘ईशनिन्दा करनेवाली’ अथवा ‘अपशब्द कहनेवाली’
  rationale: मूल शब्द अपमानजनक, अशुभ या अपवित्र वाणी के कई भाव रख सकता है। सामान्य ‘निन्दा करनेवाली’ मूल की वास्तविक अस्पष्टता को सुरक्षित रखता है और अनावश्यक रूप से ईशनिन्दा का विशिष्ट अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर पद की गंभीर ऐतिहासिक-धार्मिक शैली बनाए रखी गई है। ‘पैतृक देश’, ‘पवित्र मन्दिर’ और ‘के अधीन’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं। सभी सन्दर्भ-पूर्तियाँ वर्ग कोष्ठकों में चिह्नित हैं।
