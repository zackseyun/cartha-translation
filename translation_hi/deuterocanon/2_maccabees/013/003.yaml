base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/003.yaml
  text: Menelaus also joined them and[a], with great insincerity, kept urging Antiochus on—not for the safety of the fatherland[b], but because he thought he would be established in power.
translation:
  language: hi
  text: मेनि‍ലाउस भी उनके साथ जा मिला और बहुत कपट से[a] अन्तियोखुस से लगातार आग्रह करता रहा—अपनी मातृभूमि की सुरक्षा के लिए नहीं[b], बल्कि यह सोचकर कि उसे अधिकार के पद पर स्थापित किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत दिखावटी ढंग से”; यूनानी शब्द में बनावटी बात करने या अपने वास्तविक उद्देश्य को छिपाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी मातृभूमि की भलाई के लिए नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέμιξεν
  choice: उनसे जा मिला
  rationale: क्रिया का अर्थ किसी समूह में सम्मिलित होना या उससे जुड़ना है; यह हिन्दी में स्वाभाविक रूप से कथानक का भाव व्यक्त करता है।
- source_word: παρεκάλει
  choice: लगातार उकसाता रहा
  rationale: अपूर्ण भूतकाल निरन्तर या बार-बार किए गए आग्रह को दिखाता है; प्रसंग में अन्तियोखुस को कार्रवाई के लिए प्रेरित करने का नकारात्मक भाव है।
- source_word: μετὰ πολλῆς εἰρωνίας
  choice: बड़ी कपटपूर्णता से
  rationale: यहाँ εἰρωνία आधुनिक अर्थ की व्यंग्योक्ति नहीं, बल्कि वास्तविक उद्देश्य छिपाकर दिखावटी बात करने या छलपूर्ण व्यवहार करने को सूचित करती है।
- source_word: σωτηρίᾳ
  choice: सुरक्षा
  rationale: प्रसंग राष्ट्रीय या राजनीतिक कुशल-क्षेम का है, धार्मिक उद्धार का नहीं।
- source_word: πατρίδος
  choice: मातृभूमि
  rationale: πατρίς पैतृक या देशज भूमि को दर्शाता है; ‘मातृभूमि’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण समतुल्य है।
- source_word: ἐπὶ τῆς ἀρχῆς κατασταθήσεται
  choice: उसे फिर से सत्ता में स्थापित कर दिया जाएगा
  rationale: κατασταθήσεται अधिकार में नियुक्त या स्थापित किए जाने को और ἀρχή शासन-सत्ता को दर्शाता है। प्रसंग मेनिलाउस की पूर्व स्थिति की पुनर्स्थापना का संकेत देता है, इसलिए ‘फिर से’ अर्थ को स्पष्ट करता है, पर इसे पादटिप्पणी में चिह्नित किया गया है क्योंकि यह शब्द ग्रीक में प्रत्यक्ष रूप से नहीं है।
theological_decisions:
- issue: εἰρωνία द्वारा मेनिलाउस के नैतिक चरित्रांकन का अनुवाद
  choice: बड़ी कपटपूर्णता से
  alternative: बहुत बनावटी ढंग से; बहुत छल करते हुए; बहुत व्यंग्य के साथ
  rationale: प्रसंग उसके प्रकट आग्रह और स्वार्थपूर्ण वास्तविक उद्देश्य में विरोध दिखाता है। ‘व्यंग्य’ आधुनिक हिन्दी पाठक को भटका सकता है; ‘कपटपूर्णता’ नैतिक तनाव को बिना अतिरिक्त धार्मिक अर्थ जोड़े सुरक्षित रखती है।
- issue: ἀρχή का दायरा
  choice: सत्ता
  alternative: पद; शासन; अधिकार
  rationale: ग्रीक शब्द अधिकार या शासन की स्थिति के लिए खुला है। ‘सत्ता’ राजत्व जैसा अत्यधिक विशिष्ट दावा किए बिना राजनीतिक अधिकार का भाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल कथात्मक शैली। नामों के रूप ‘मेनिलाउस’ और ‘अन्तियोखुस’ रखे गए हैं। वाक्य में मेनिलाउस के दिखावटी आग्रह और निजी सत्ता-लालसा के बीच मूल यूनानी का विरोध सुरक्षित है।
