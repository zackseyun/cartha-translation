  to: मेनि‍ലाउस भी उनके साथ जा मिला और बहुत कपट से[a] अन्तियोखुस से लगातार आग्रह करता रहा—अपनी मातृभूमि की सुरक्षा के लिए नहीं[b], बल्कि यह सोचकर कि उसे अधिकार के पद पर स्थापित किया जाएगा।
