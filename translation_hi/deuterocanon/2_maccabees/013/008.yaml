  text: Very justly[a]; for because he had committed many sins against the altar, whose fire and ashes were holy[b], he met his death in ashes.
translation:
  language: hi
  text: यह बिलकुल न्यायोचित था[a]; क्योंकि उसने उस वेदी के विरुद्ध बहुत-से पाप किए थे, जिसकी आग और राख पवित्र थीं; उसने राख में ही मृत्यु पाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह बिलकुल उचित था।” यूनानी आरम्भ इस बात पर बल देता है कि उसका यह परिणाम उसके कर्मों के अनुरूप था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “राख में उसने मृत्यु पाई।” यह कथन सम्भवतः वेदी के विरुद्ध उसके पापों और उसकी पवित्र राख के बीच की विडम्बनापूर्ण प्रतिध्वनि को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: यह बिलकुल न्यायोचित था
  rationale: πάνυ की तीव्रता और δικαίως के न्याय-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है तथा उसके दण्ड को उचित ठहराने वाला आरम्भ बनाए रखता है।
- source_word: συνετέλεσεν πολλὰ ... ἁμαρτήματα
  choice: उसने ... बहुत-से पाप किए थे
  rationale: मुहावरे का अर्थ अनेक पापपूर्ण कर्म करना है; ‘पाप किए थे’ धार्मिक और नैतिक बल को स्पष्ट तथा स्वाभाविक ढंग से रखता है।
- source_word: περὶ τὸν βωμόν
  choice: वेदी के विरुद्ध
  rationale: अपवित्रीकरण के प्रसंग में περί का आशय केवल वेदी के विषय में नहीं, बल्कि उसके प्रति किए गए अपराधों से है।
- source_word: ἁγνὸν
  choice: पवित्र
  rationale: मन्दिर और वेदी के अनुष्ठानिक प्रसंग में ἁγνός भौतिक स्वच्छता से बढ़कर समर्पित पवित्रता को सूचित करता है।
- source_word: σποδός / ἐν σποδῷ
  choice: राख / राख में
  rationale: यूनानी के सामूहिक एकवचन और दोनों प्रयोगों की जानबूझकर की गई प्रतिध्वनि को हिन्दी में सुरक्षित रखता है।
- source_word: τὸν θάνατον ἐκομίσατο
  choice: उसे मृत्यु मिली
  rationale: मूल के ‘मृत्यु प्राप्त की’ भाव को सहज हिन्दी में व्यक्त करता है, बिना मृत्यु के साधन के विषय में अतिरिक्त अर्थ जोड़े।
theological_decisions:
- issue: वेदी की आग और राख का अनुष्ठानिक वर्णन
  choice: उस वेदी की आग और राख पवित्र थीं
  alternative: उस वेदी की आग शुद्ध थी और उसकी राख पवित्र थी
  rationale: यूनानी में एक ही विशेषण ἁγνόν समन्वित ‘आग और राख’ से जुड़ा है। मन्दिर के प्रसंग में ‘पवित्र’ दोनों की समर्पित स्थिति को स्पष्ट करता है और पाठ में निहित प्रतिशोधात्मक समानता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘वेदी’, ‘पाप’ और ‘पवित्र’ जैसे स्थापित धार्मिक शब्द बनाए गए हैं। डैश मूल वाक्य के व्याख्यात्मक संबंध को स्पष्ट करता है, जबकि ‘राख’ की पुनरावृत्ति मूल की विडम्बनापूर्ण प्रतिध्वनि सुरक्षित रखती है।
