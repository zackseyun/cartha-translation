  text: Here everyone pushes on to destruction the man guilty of temple robbery[a], or one who has committed some outstanding excess of other evils.
translation:
  language: hi
  text: यहाँ सब लोग मंदिर लूटने के दोषी[a] व्यक्ति को, या अन्य कुछ बुराइयों में हद से बढ़ जानेवाले को, धकेलकर विनाश में पहुँचा देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धार्मिक अपवित्रता के दोषी।” यूनानी शब्द विशेष रूप से मंदिर को लूटने या उसकी पवित्रता भंग करने के लिए प्रयुक्त होता है।
    reason: ‘मंदिर लूटने’ के ठोस मुख्य अर्थ को रखते हुए शब्द के व्यापक वैकल्पिक अर्थ को दर्शाता है।
lexical_decisions:
- source_word: ἐνταῦθα
  choice: यहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण ठीक पहले वर्णित स्थान और वहाँ की प्रथा की ओर संकेत करता है; ‘यहाँ’ उसके निकट संकेत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἱεροσυλίας
  choice: मंदिर लूटने
  rationale: यह संज्ञा विशेष रूप से मंदिर की संपत्ति लूटने अथवा मंदिर का अपमानजनक उल्लंघन करने को दर्शाती है। मुख्य पाठ में ठोस अर्थ रखा गया है और व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἔνοχον
  choice: दोषी
  rationale: अपराध के संबंध में उत्तरदायी अथवा अपराधी ठहराए गए व्यक्ति का न्यायिक भाव व्यक्त करता है।
- source_word: ἢ καί τινων ἄλλων κακῶν ὑπεροχὴν πεποιημένον
  choice: या किसी और अत्यंत घोर बुराई करनेवाले को
  rationale: वाक्यांश किसी अन्य प्रकार की बुराइयों में असाधारण सीमा या प्रधानता तक पहुँचने का भाव देता है। सहज हिन्दी में ‘अत्यंत घोर’ उस तीव्रता को व्यक्त करता है, जबकि ‘किसी और’ τινων ἄλλων की अनिश्चितता और वैकल्पिक अपराध को बनाए रखता है।
- source_word: ἅπαντες
  choice: सब लोग
  rationale: सामूहिक और सर्वसमावेशी भागीदारी का स्पष्ट, स्वाभाविक हिन्दी रूप।
- source_word: προωθοῦσιν εἰς ὄλεθρον
  choice: धकेलकर विनाश में पहुँचा देते हैं
  rationale: προωθέω के आगे की ओर बलपूर्वक धकेलने के भौतिक बिंब और εἰς ὄλεθρον के विनाशकारी गंतव्य, दोनों को प्रवाहपूर्ण हिन्दी में रखा गया है।
theological_decisions:
- issue: ἱεροσυλία का अर्थ
  choice: मंदिर लूटना
  alternative: पवित्र वस्तु या स्थान का अपमान
  rationale: यूनानी शब्द का ठोस अर्थ मंदिर की लूट या उसके पवित्र अधिकार का उल्लंघन है। मुख्य पाठ ठोस अर्थ को प्राथमिकता देता है; व्यापक धार्मिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ὑπεροχή के तुलनात्मक/अतिशय भाव का निर्वाह
  choice: अत्यंत घोर बुराई
  alternative: बुराइयों की पराकाष्ठा
  rationale: यहाँ शब्द किसी अन्य बुराई की असाधारण गंभीरता या सीमा बताता है। ‘अत्यंत घोर’ सामान्य पाठक के लिए सहज है और अपराध की विशिष्ट गंभीरता बनाए रखता है, बिना किसी खास प्रकार के अपराध को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट है। ‘करनेवाले’ को संयुक्त रूप में रखा गया है। वाक्य में यूनानी मूल का भौतिक धकेलने वाला बिंब और अंतिम विनाश, दोनों सुरक्षित हैं।
