  text: Lysias came forward to the tribunal, made as good a defense as he could, persuaded them, calmed them, made them well-disposed, and marched back to Antioch. Thus the king’s attack and withdrawal proceeded.
translation:
  language: hi
  text: लुसियास न्याय-मंच[a] के पास आया और परिस्थितियों के अनुसार जितना बन पड़ा, अपना बचाव किया[b]। उसने उन्हें मना लिया, उन्हें शांत किया और उन्हें अनुकूल बनाया; फिर वह अन्ताकिया को कूच कर गया। इस प्रकार राजा के आक्रमण और वापसी का घटनाक्रम चला[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय-आसन” अथवा “मंच”; यूनानी βῆμα सार्वजनिक मंच या न्याय करने के स्थान को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “परिस्थितियों के अनुसार जितना बन पड़ा” के पीछे का यूनानी शब्द कठिन है; इसका अर्थ “उचित रूप से,” “पर्याप्त रूप से” या “जितनी परिस्थिति ने अनुमति दी” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “आक्रमण और वापसी” का अनुवाद “चढ़ाई और पीछे हटना” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν ἐπὶ τὸ βῆμα
  choice: न्याय-मंच के सामने आया
  rationale: προσέρχομαι का अर्थ पास आना या सामने आना है; βῆμα सार्वजनिक अथवा न्यायिक मंच को सूचित करता है। संयुक्त पद प्रसंग की सार्वजनिक-न्यायिक स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπελογήσατο
  choice: अपना पक्ष रखा
  rationale: मध्यवाच्य क्रिया अपने बचाव में बोलने का अर्थ देती है। ‘अपना पक्ष रखा’ आधुनिक हिन्दी में सहज है और औपचारिक न्यायिक अर्थ को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: ἐνδεχομένως
  choice: परिस्थितियों के अनुसार जितना बन पड़ा
  rationale: यह कठिन क्रिया-विशेषण उपयुक्त ढंग से, यथासंभव, अथवा परिस्थितियों की अनुमति के अनुसार अर्थ दे सकता है। चुना हुआ रूप इसकी सीमित और संदर्भाधीन पर्याप्तता को बनाए रखता है।
- source_word: συνέπεισεν
  choice: उन्हें मना लिया
  rationale: क्रिया सफलतापूर्वक सहमत या आश्वस्त करने का भाव रखती है; हिन्दी में यह परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: κατεπράϋνεν
  choice: उनका क्रोध शांत किया
  rationale: क्रिया शांत करने या नरम करने को सूचित करती है। प्रसंग में अंतर्निहित कर्म उन्हीं लोगों की उत्तेजना या रोष है; ‘क्रोध’ जोड़ने से हिन्दी स्पष्ट बनती है, यद्यपि यूनानी में संज्ञा व्यक्त नहीं है।
- source_word: εὐμενεῖς ἐποίησεν
  choice: उन्हें अपने अनुकूल कर लिया
  rationale: शाब्दिक अर्थ ‘उन्हें कृपालु/अनुकूल बनाया’ है। चुना हुआ रूप कारक भाव और मनोवृत्ति में आए परिवर्तन दोनों को रखता है।
- source_word: ἀνέζευξεν εἰς Ἀντιοχίαν
  choice: अन्ताकिया को कूच कर गया
  rationale: ἀναζεύγνυμι सैन्य प्रसंग में पड़ाव उठाकर प्रस्थान करने या कूच करने का बोध देता है। ‘कूच कर गया’ केवल ‘लौट गया’ की अपेक्षा सैन्य रंग को अधिक सुरक्षित रखता है, जबकि दिशा अन्ताकिया की ओर स्पष्ट है।
- source_word: ἐφόδου
  choice: आक्रमण
  rationale: ἐπίοδος यहाँ शत्रुतापूर्ण चढ़ाई या हमला है; ‘आक्रमण’ आधुनिक और गरिमापूर्ण सैन्य पद है।
- source_word: ἀναζυγῆς
  choice: वापसी
  rationale: संज्ञा पड़ाव उठाकर लौटने या पीछे हटने को सूचित कर सकती है। ‘वापसी’ पराजयपूर्ण पलायन का अतिरिक्त संकेत दिए बिना गति की दिशा व्यक्त करती है।
- source_word: ἐχώρησεν
  choice: हुई
  rationale: इस समापन वाक्य में क्रिया का मुहावरेदार अर्थ है कि घटनाएँ इस प्रकार घटीं या उनका परिणाम ऐसा हुआ। हिन्दी में ‘इस प्रकार ... हुई’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: इस पद में कोई प्रमुख सिद्धान्तगत विवादित पद नहीं है; मुख्य तनाव न्यायिक और सैन्य शब्दावली के अर्थ-क्षेत्र में है।
  choice: इसे लुसियास के सफल पक्ष-प्रस्तुतीकरण, लोगों को शांत और अनुकूल करने, तथा राजा की सेना के लौटने का ऐतिहासिक सारांश माना गया है।
  alternative: βῆμα को केवल ‘मंच’, ἀναζυγή को ‘पीछे हटना’ या ‘पलायन’, और ἀνέζευξεν को ‘लौट गया’ कहा जा सकता है।
  rationale: चयन प्रसंगगत अर्थ स्पष्ट करता है, पर राजा की वापसी को अनिवार्यतः पराजयपूर्ण पलायन नहीं ठहराता और यूनानी की वास्तविक शब्दार्थगत गुंजाइश को पादटिप्पणियों में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘लुसियास’ और ‘अन्ताकिया’ पारंपरिक हिन्दी बाइबिलीय नामरूपों के निकट हैं। वाक्य-विन्यास यूनानी की क्रमिक क्रियाओं को बनाए रखते हुए हिन्दी में दो वाक्यों में विभाजित किया गया है।
