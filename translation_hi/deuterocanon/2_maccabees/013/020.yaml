    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ ἔνδον
  choice: परन्तु भीतर के लोगों को
  rationale: ἔνδον यहाँ भीतर स्थित लोगों को सूचित करता है। ‘भीतर के लोगों’ से स्थानगत अर्थ बना रहता है और यूनानी में न होने पर भी ‘पुरुष’ नहीं जोड़ा जाता। δέ को प्रसंगगत विरोध या आगे बढ़ने के भाव में ‘परन्तु’ से व्यक्त किया गया है।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: Ἰούδας व्यक्ति का नाम है; हिन्दी बाइबलीय नाम-परंपरा के अनुरूप ‘यहूदा’ रखा गया है।
- source_word: τὰ δέοντα
  choice: आवश्यक वस्तुएँ
  rationale: यह नपुंसकलिंग बहुवचन अभिव्यक्ति उन चीज़ों को दर्शाती है जिनकी आवश्यकता थी। ‘आवश्यक वस्तुएँ’ अर्थ को व्यापक रखता है और इसे केवल रसद या खाद्य-सामग्री तक सीमित नहीं करता।
- source_word: εἰσεπέμπεν
  choice: भेजता रहा
  rationale: अपूर्ण भूतकालीन रूप निरंतर या बार-बार की गई क्रिया व्यक्त कर सकता है। ‘भेजता रहा’ उस अपूर्णतामूलक पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है; ‘भीतर’ का दिशात्मक अर्थ पहले ही प्राप्तकर्ता-वाक्यांश में स्पष्ट है।
