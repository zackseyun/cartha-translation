  text: And at Bethsura he attacked a small garrison of the Jews[a], but was turned back, was repulsed[c][b], and was weakened.
translation:
  language: hi
  text: और उसने बेतसूर[a] में यहूदियों की एक छोटी किलेबंद चौकी[b] पर चढ़ाई की; पर उसे पीछे हटा दिया गया, उसे प्रतिरोध का सामना करना पड़ा[c], और वह कमज़ोर पड़ता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान का नाम ‘बेत-सूर’ या यूनानी रूप के अधिक निकट ‘बेतसूरा’ भी लिखा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘किलेबंद चौकी’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘दुर्ग’, ‘गढ़’ अथवा वहाँ स्थित सैनिक चौकी भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी क्रियाओं की शृंखला बहुत संक्षिप्त है: उसे पीछे हटा दिया गया, उसे बाधा या प्रतिरोध का सामना करना पड़ा, और वह कमज़ोर पड़ता गया। यहाँ ‘उसे प्रतिरोध का सामना करना पड़ा’ का अनुवाद ‘वह बाधा से टकराया’ भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαθσούροις
  choice: बेतसूर
  rationale: यूनानी रूप Βαθσούρα/Βαθσούροις से संकेतित स्थान का प्रचलित सेमेटिक-आधारित हिन्दी रूप; ‘बेतसूरा’ भी संभव है।
- source_word: φρούριον ὀλίγον τῶν Ἰουδαίων
  choice: यहूदियों की एक छोटी किलेबंद चौकी
  rationale: φρούριον किसी दुर्ग, गढ़ या सुरक्षित सैनिक चौकी को सूचित कर सकता है। ὀλίγον के साथ ‘छोटी किलेबंद चौकी’ स्थान और वहाँ तैनात सैन्य बल—दोनों की संभावित छाया बनाए रखती है।
- source_word: προσῆγεν
  choice: पर चढ़ाई की
  rationale: क्रिया का मूल भाव ‘विरुद्ध आगे बढ़ना/ले जाना’ है; इस सैनिक प्रसंग में ‘चढ़ाई की’ आक्रमणकारी बढ़त को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐτροποῦτο
  choice: पीछे खदेड़ दिया गया
  rationale: मध्य/कर्मवाच्य रूप युद्ध में पलट दिए जाने या भगाए जाने का संकेत देता है; यह पूर्ण पराजय का अनावश्यक दावा नहीं करता।
- source_word: προσενέκρουσεν
  choice: टकराकर रुक गया
  rationale: क्रिया का चित्र किसी बाधा या प्रतिरोध से टकराने का है। यह सक्रिय यूनानी रूप और आक्रमण रुकने—दोनों को संक्षेप में रखता है।
- source_word: ἡλαττονοῦτο
  choice: उसकी शक्ति घटती गई
  rationale: अपूर्णकालिक रूप घटते या कम होते जाने की प्रक्रिया व्यक्त करता है; सैनिक संदर्भ में ‘शक्ति’ जोड़ने से आशय स्पष्ट होता है।
