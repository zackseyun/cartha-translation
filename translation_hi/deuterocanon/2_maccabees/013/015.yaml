  yaml_path: translation/deuterocanon/2_maccabees/013/015.yaml
  text: And after giving those around him the battle cry[a], “God’s Victory,” he attacked the royal court by night with the finest armed young men, struck down about two thousand men in the camp[b], and cut down the leading elephant together with its rider.
translation:
  language: hi
  text: और उसने अपने साथियों को “परमेश्वर की विजय” का युद्ध-घोष[a] देकर, श्रेष्ठ सुसज्जित युवकों के साथ रात में राजकीय परिसर पर धावा बोला। उसने शिविर में लगभग दो हज़ार पुरुषों को मार गिराया और अग्रणी हाथी को उस पर बने हौदे में बैठे व्यक्ति सहित मार गिराया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संकेत-वचन,” “कूट-वचन,” या “सैनिक संकेत।” यूनानी शब्द सैनिक पहचान-संकेत या पहले से तय संकेत के लिए भी प्रयुक्त होता है; यहाँ “परमेश्वर की विजय” उस संकेत के शब्द हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक अर्थ है, “उस घर-जैसे ढाँचे में मौजूद व्यक्ति सहित”; आशय हाथी की पीठ पर बने हौदे या मीनारनुमा आसन में बैठे व्यक्ति से है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀναδοὺς δὲ τοῖς περὶ αὐτὸν
  choice: फिर उसने अपने साथियों को ... देकर
  rationale: कृदन्त पूर्ववर्ती क्रिया को दिखाता है; हिन्दी में ‘फिर ... देकर’ स्वाभाविक क्रम रखता है। τοῖς περὶ αὐτόν का अर्थ उसके आसपास या साथ रहने वाले लोग, अर्थात साथी, है।
- source_word: σύνθημα Θεοῦ Νίκην
  choice: “परमेश्वर की विजय” युद्ध-घोष
  rationale: σύνθημα सैनिक संकेत, कूट-वचन या युद्ध-घोष हो सकता है। यहाँ उसके कथित शब्द दिए गए हैं, इसलिए ‘युद्ध-घोष’ प्रसंगानुकूल है; Θεοῦ Νίκην की संक्षिप्त संबंधवाचक बनावट ‘परमेश्वर की विजय’ में सुरक्षित है।
- source_word: μετὰ νεανίσκων ἀρίστων κεκοσμημένων
  choice: चुने हुए सुसज्जित जवानों के साथ
  rationale: ἀρίστων उनकी श्रेष्ठता और चयनित गुणवत्ता बताता है, जबकि κεκοσμημένων युद्ध के लिए सज्जित या सुसज्जित होने का भाव देता है। ‘जवान’ आधुनिक हिन्दी में युवा पुरुषों और सैनिक प्रसंग दोनों के अनुकूल है।
- source_word: ἐπιβαλὼν νύκτωρ
  choice: रात में ... धावा बोला
  rationale: ἐπιβάλλω यहाँ आक्रमण करने का अर्थ रखता है और νύκτωρ समय बताता है। ‘धावा बोला’ अचानक सैनिक हमले की कथात्मक शक्ति व्यक्त करता है।
- source_word: τὴν βασιλικὴν αὐλήν
  choice: राजकीय छावनी
  rationale: αὐλή मूलतः आँगन, घेरा या प्रांगण है; इस सैन्य संदर्भ में राजा का घिरा हुआ पड़ाव अभिप्रेत है। ‘राजकीय छावनी’ स्थानिक और सैन्य अर्थ को ‘राजदरबार’ की संभावित भ्रामकता से बेहतर व्यक्त करता है।
- source_word: τὴν παρεμβολὴν ἀνεῖλεν εἰς ἄνδρας δυσχιλίους
  choice: उसने शिविर में लगभग दो हज़ार पुरुषों को मार गिराया
  rationale: παρεμβολή सैन्य शिविर है और ἀναιρέω यहाँ मार डालने का अर्थ देता है। εἰς के साथ संख्या अनुमानित परिमाण दर्शाती है, इसलिए ‘लगभग’ उचित है।
- source_word: τὸν πρωτεύοντα τῶν ἐλεφάντων
  choice: सबसे प्रमुख हाथी
  rationale: πρωτεύοντα प्रमुख, अग्रणी या प्रथम स्थान वाले हाथी को सूचित करता है। यूनानी पाठ यह निश्चित नहीं करता कि वह केवल पंक्ति में आगे था या प्रतिष्ठा में प्रधान, इसलिए ‘सबसे प्रमुख’ उस व्यापकता को रखता है।
- source_word: σὺν τῷ κατʼ οἰκίαν ὄντι
  choice: उस पर बने हौदे में बैठे व्यक्ति सहित
  rationale: शाब्दिक रूप से यह हाथी पर बने घर-जैसे ढाँचे में मौजूद व्यक्ति की ओर संकेत करता है। केवल ‘महावत’ या ‘सवार’ कहना भूमिका को अनावश्यक रूप से निश्चित करता; ‘हौदे में बैठे व्यक्ति’ दृश्य को स्पष्ट रखते हुए अस्पष्टता बचाता है।
- source_word: συνέθηκεν
  choice: काट गिराया
  rationale: इस दुर्लभ संदर्भगत प्रयोग में प्रहार करके ढेर या नष्ट करने का भाव है। ‘काट गिराया’ युद्ध-वर्णन में हाथी और उसके ऊपर बैठे व्यक्ति दोनों के विनाश को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: Θεοῦ Νίκην में संबंध और नारे का आशय
  choice: “परमेश्वर की विजय”
  alternative: “परमेश्वर विजयी है” या “परमेश्वर से विजय”
  rationale: यूनानी में संक्षिप्त संबंधकारक पदबंध है, पूर्ण वाक्य नहीं। ‘परमेश्वर की विजय’ उसके नारे-जैसे रूप और वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखता है, बिना यह तय किए कि यह घोषणा, प्रार्थना या विजय के स्रोत का कथन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘राजकीय छावनी’ तथा ‘हौदा’ सैन्य-सांस्कृतिक दृश्य को सामान्य हिन्दी पाठक के लिए स्पष्ट करते हैं। मुख्य पाठ में भूमिकाओं को ‘महावत’ या ‘योद्धा’ कहकर अधिक निश्चित नहीं किया गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
