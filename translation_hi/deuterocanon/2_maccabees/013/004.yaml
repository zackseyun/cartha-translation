  yaml_path: translation/deuterocanon/2_maccabees/013/004.yaml
  text: But the King of kings stirred up Antiochus’s anger against the wretch, and when Lysias pointed him out as being responsible for the evils and for everything, he ordered them to put him to death, taking him to Beroea, as is the custom in that place.
translation:
  language: hi
  text: परन्तु राजाओं के राजा ने उस दुष्ट[a] के विरुद्ध अन्तियोखुस का क्रोध भड़का दिया। जब लूसियास ने उसे इन विपत्तियों और सभी बातों के लिए जिम्मेदार ठहराया, तब अन्तियोखुस ने आदेश दिया कि उसे बेरेआ[b] ले जाकर वहाँ की प्रथा के अनुसार मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस अपराधी” अथवा “उस अधम व्यक्ति”; यूनानी शब्द प्रबल नैतिक निन्दा व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ बेरेआ वह स्थान है जहाँ स्थानीय प्रथा के अनुसार उसे मृत्युदण्ड दिया जाना था।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς τῶν βασιλέων
  choice: परन्तु राजाओं के राजा
  rationale: यह परम प्रभुता सूचित करने वाली उपाधि है और प्रसंग में परमेश्वर के लिए प्रयुक्त है। हिन्दी में आदरसूचक अर्थ स्वाभाविक रूप से बना रहता है।
- source_word: ἐξήγειρεν τὸν θυμὸν
  choice: क्रोध भड़का दिया
  rationale: यह क्रोध को उठाने की कारक क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὸν ἀλιτήριον
  choice: उस दुष्ट के विरुद्ध
  rationale: ἀλιτήριος नैतिक निन्दा का प्रबल शब्द है। ‘दुष्ट’ उसका निन्दात्मक स्वर बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: ὑποδείξαντος
  choice: बताया
  rationale: यहाँ लूसियास उस व्यक्ति को दोषों का जिम्मेदार ठहराकर चिन्हित करता है; ‘बताया’ हिन्दी वाक्य में स्वाभाविक है।
- source_word: αἴτιον τῶν κακῶν εἶναι καὶ πάντων
  choice: वही इन विपत्तियों और उन सबका जिम्मेदार है
  rationale: ‘जिम्मेदार’ αἴτιος का न्यायिक भाव रखता है। संक्षिप्त καὶ πάντων की व्यापकता को ‘और उन सबका’ से सुरक्षित रखा गया है, बिना उसे निरपेक्ष ‘हर चीज़’ बनाने के।
- source_word: προσέταξεν ... προσαπολέσαι
  choice: आदेश दिया कि उसे ... मार डाला जाए
  rationale: प्रसंग में यह मृत्युदण्ड का स्पष्ट आदेश है; हिन्दी रूप सरल है और क्रिया की घातक परिणति को साफ बताता है।
- source_word: ἀγαγόντας εἰς Βέροιαν
  choice: उसे बेरेआ ले जाकर
  rationale: यह निष्पादन से जुड़ी सहवर्ती क्रिया और घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡς ἔθος ἐστὶν ἐν τῷ τόπῳ
  choice: वहाँ की प्रथा के अनुसार
  rationale: यह स्थानीय रीति का निकट और मुहावरेदार अनुवाद है।
theological_decisions:
- issue: ‘राजाओं के राजा’ का संकेत
  choice: इसे परमेश्वर के लिए प्रयुक्त दिव्य उपाधि माना गया है।
  alternative: इसे किसी सांसारिक राजा की अतिशयोक्तिपूर्ण उपाधि माना जा सकता था।
  rationale: 2 मक्काबियों के प्रसंग में यह भाषा उस परम प्रभु को दर्शाती है जो सांसारिक शासकों पर भी प्रभुता रखता और घटनाओं को मोड़ता है; अनुवाद इससे आगे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: परमेश्वर द्वारा अन्तियोखुस का क्रोध भड़काया जाना
  choice: मूल का सीधा कारक कथन बनाए रखा गया है।
  alternative: इसे केवल ‘क्रोध करने दिया’ या सामान्य दैवी अनुमति के रूप में नरम किया जा सकता था।
  rationale: ἐξήγειρεν स्पष्ट रूप से सक्रिय कारक क्रिया है; मूल में उपस्थित दैवी सक्रियता और उससे जुड़ा धर्मवैचारिक तनाव अनुवाद में सुरक्षित रहना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘अन्तियोखुस’, ‘लूसियास’ और ‘बेरेआ’ यूनानी नामों के निकट देवनागरी रूप हैं। वाक्य को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है; सर्वनामगत अस्पष्टता घटाने के लिए दूसरे वाक्य में ‘अन्तियोखुस’ दोहराया गया है।
