  yaml_path: translation/deuterocanon/2_maccabees/013/018.yaml
  text: But the king[a], having learned by experience the Jews’ boldness, tried to take the strongholds by stratagems[c][b],
translation:
  language: hi
  text: परन्तु राजा ने यहूदियों के साहस का अनुभव कर लेने के बाद[a], युद्ध-युक्तियों से उन गढ़ों[b] पर अधिकार करने का प्रयत्न किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “यहूदियों के साहस का अनुभव प्राप्त कर चुकने पर।”
    reason: lexical_alternative
  - marker: b
    text: या “उन मोर्चों” अथवा “उन स्थानों”; यूनानी शब्द का शाब्दिक अर्थ “स्थान” है, पर सैन्य प्रसंग में रक्षित ठिकाने अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: यहाँ अनूदित यूनानी क्रिया का अर्थ इस प्रसंग में अनिश्चित है; इसका अर्थ अधिक सामान्य रूप से “उन पर आक्रमण किया” या “उनके विरुद्ध बढ़ा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰληφὼς πεῖραν
  choice: अनुभव कर लेने के बाद
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘अनुभव प्राप्त कर चुकना’ है। यह हिन्दी प्रयोग प्रत्यक्ष अनुभव से जान लेने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εὐτολμίας
  choice: साहस
  rationale: यह शब्द जोखिम उठाने की तत्परता और निर्भीकता को व्यक्त करता है। ‘साहस’ सैन्य प्रसंग में स्वाभाविक है और न तो अनावश्यक प्रशंसा जोड़ता है, न ‘दुस्साहस’ जैसा नकारात्मक निर्णय।
- source_word: κατεῖρασεν
  choice: अधिकार करने का प्रयत्न किया
  rationale: इस रूप और प्रसंग में क्रिया का सटीक अर्थ कठिन है, पर यह उन स्थानों के विरुद्ध ऐसी कार्रवाई सूचित करती है जिसका उद्देश्य उन्हें वश में करना था। यह अनुवाद सफलता का दावा किए बिना प्रयत्न का भाव रखता है।
- source_word: διὰ μεθόδων
  choice: युद्ध-युक्तियों से
  rationale: यहाँ μέθοδοι सामान्य ‘तरीकों’ के बजाय योजनाबद्ध सैन्य उपायों या चालों की ओर संकेत करता है।
- source_word: τοὺς τόπους
  choice: उन गढ़ों
  rationale: शाब्दिक अर्थ ‘उन स्थानों’ है, किन्तु सैन्य प्रसंग रक्षित या किलेबंद ठिकानों की ओर संकेत करता है। ‘गढ़ों’ से यह प्रासंगिक अर्थ संक्षेप और सहजता से व्यक्त होता है।
