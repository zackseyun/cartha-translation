base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/023.yaml
  text: He attacked those around Judas[a], but was defeated. Having become desperate, he took action against Philip in Antioch, the one left in charge of affairs; he was thrown into confusion, appealed to the Jews, submitted, and swore to all the just terms. He was reconciled and offered sacrifice, honored the sanctuary and the place[b], and showed kindness.
translation:
  language: hi
  text: उसने यहूदा के लोगों पर आक्रमण किया, परन्तु वह पराजित हो गया। निराश होकर उसने अन्ताकिया में फिलिप्पुस के विरुद्ध कदम उठाया[a]—उसी फिलिप्पुस को राजकाज का भार सौंपा गया था। वह उलझन में पड़ गया, उसने यहूदियों से विनती की, अधीनता स्वीकार की और सभी न्यायोचित शर्तों को मानने की शपथ खाई[b]। फिर उसका मेल हो गया और उसने बलिदान अर्पित किया; उसने मन्दिर और उस स्थान का सम्मान किया और दयालुता दिखाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: फिलिप्पुस से सम्बन्धित यूनानी वाक्य बहुत संक्षिप्त और कठिन है; उसके विरुद्ध की गई कार्रवाई का ठीक स्वरूप निश्चित नहीं है।
    reason: textual_variant
  - marker: b
    text: या, “हर उस बात की जो न्यायोचित थी।” यह वाक्यांश सामान्य रूप से उचित बातों या विशेष रूप से समझौते की शर्तों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέβαλεν τοῖς περὶ τὸν Ἰούδαν
  choice: उसने यहूदा और उसके साथियों पर आक्रमण किया
  rationale: यूनानी मुहावरा शाब्दिक रूप से ‘यहूदा के आस-पास के लोगों’ को दर्शाता है; हिन्दी में ‘यहूदा और उसके साथी’ सैन्य दल का स्वाभाविक और स्पष्ट संकेत देता है।
- source_word: ἥττων ἐγένετο
  choice: वह पराजित हो गया
  rationale: इस प्रसंग में यह मुहावरा युद्ध में हार जाने का अर्थ देता है।
- source_word: ἀπονοηθεὶς
  choice: निराश होकर
  rationale: कृदन्त विवशता, हताशा या निराशा की अवस्था व्यक्त करता है; यह चयन उसकी पराजय के बाद की दशा को संक्षेप में रखता है।
- source_word: μετέλαβεν ... τὸν Φίλιππον
  choice: उसने ... फिलिप्पुस के विरुद्ध कदम उठाया
  rationale: यह संक्षिप्त यूनानी वाक्यांश कठिन और अनिश्चित है। यह अनुवाद किसी विशेष कार्रवाई—जैसे पकड़ना, साथ मिलना या समाचार पाना—को निर्णायक रूप से आरोपित किए बिना सक्रिय प्रतिक्रिया दर्शाता है।
- source_word: τὸν ἀπολελειμμένον ἐπὶ τῶν πραγμάτων
  choice: उसी फिलिप्पुस को राजकाज का भार सौंपा गया था
  rationale: वाक्यांश प्रशासनिक या शासकीय मामलों की जिम्मेदारी सौंपे जाने को दर्शाता है; ‘राजकाज का भार’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: συνεχύθη
  choice: वह घबरा गया
  rationale: क्रिया भ्रम, व्याकुलता और उथल-पुथल में पड़ने का भाव देती है; ‘घबरा गया’ कथा में स्वाभाविक और सुबोध है।
- source_word: τοὺς Ἰουδαίους παρεκάλεσεν
  choice: उसने यहूदियों से विनती की
  rationale: παρακαλέω यहाँ कूटनीतिक परिस्थिति में आग्रह या अनुनय का अर्थ देता है।
- source_word: ὑπετάγη
  choice: वह झुक गया
  rationale: रूप समर्पण करने या शर्तों के आगे मान जाने का संकेत करता है; ‘झुक गया’ अनिर्दिष्ट कर्म को जोड़े बिना अर्थ रखता है।
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: सभी न्यायोचित शर्तों को मानने की
  rationale: δικαίοις का अर्थ न्यायसंगत बातों से हो सकता है; संधि के प्रसंग में ‘न्यायोचित शर्तें’ संभावित कूटनीतिक अर्थ को सहज हिन्दी में व्यक्त करती हैं।
- source_word: συνελύθη
  choice: उसने मेल कर लिया
  rationale: शत्रुता समाप्त होने और समझौता या मेल होने का भाव है; यह यांत्रिक शाब्दिकता से बचते हुए सम्बन्ध-सुधार को दर्शाता है।
- source_word: θυσίαν προσήγαγεν
  choice: बलि चढ़ाई
  rationale: यह स्थापित उपासना-संबंधी अभिव्यक्ति है और हिन्दी में बलि अर्पित करने का स्वाभाविक रूप है।
- source_word: ἐτίμησεν τὸν νεὼ καὶ τὸν τόπον
  choice: उसने मन्दिर और उस स्थान का सम्मान किया
  rationale: ναός को यरूशलेम के ठोस उपासना-स्थल के रूप में ‘मन्दिर’ और τόπος को अलग से ‘उस स्थान’ कहा गया है, ताकि यूनानी के दोनों पद बने रहें।
- source_word: ἐφιλανθρώπησεν
  choice: उदारता दिखाई
  rationale: क्रिया दयालु, कृपालु या मानवीय व्यवहार करने का भाव देती है; ‘उदारता दिखाई’ प्रसंगानुकूल व्यापक अर्थ रखता है।
theological_decisions:
- issue: ναός और बलि के उपासना-संबंधी शब्द
  choice: ναός का अनुवाद ‘मन्दिर’ और θυσίαν προσήγαγεν का ‘बलि चढ़ाई’ किया गया।
  alternative: ναός के लिए ‘पवित्रस्थान’ और बलि-वाक्यांश के लिए ‘बलिदान अर्पित किया’।
  rationale: पाठ यरूशलेम के ऐतिहासिक उपासना-स्थल और वहाँ की ठोस क्रिया का वर्णन करता है। सामान्य हिन्दी शब्द ऐतिहासिक अर्थ रखते हैं और किसी बाद की साम्प्रदायिक व्याख्या को नहीं जोड़ते।
- issue: μετέλαβεν ... Φίλιππον की कठिन और संक्षिप्त रचना
  choice: फिलिप्पुस के विरुद्ध ‘कदम उठाया’ कहा गया और अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया।
  alternative: ‘फिलिप्पुस को पकड़ लिया,’ ‘फिलिप्पुस का समाचार पाया,’ या ‘फिलिप्पुस की ओर मुड़ा।’
  rationale: उपलब्ध यूनानी क्रम कार्रवाई की ठीक प्रकृति निश्चित नहीं करता। मुख्य पाठ कथा की गति बनाए रखता है, जबकि पादटिप्पणी वास्तविक अनिश्चितता को सुरक्षित रखती है।
- issue: ἐπὶ πᾶσι τοῖς δικαίοις का आशय
  choice: सन्धि-प्रसंग के अनुसार ‘सभी न्यायोचित शर्तों’ के रूप में अनूदित किया।
  alternative: अधिक सामान्य ‘हर न्यायोचित बात’ या ‘जो कुछ उचित था’।
  rationale: कूटनीतिक प्रसंग शर्तों का समर्थन करता है, लेकिन यूनानी सामान्य अर्थ की भी अनुमति देता है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। नाम ‘यहूदा,’ ‘अन्ताकिया’ और ‘फिलिप्पुस’ हिन्दी बाइबिलीय प्रयोग के अनुरूप रखे गए हैं। कठिन यूनानी क्रम को अत्यधिक स्पष्ट बनाकर उसकी अनिश्चितता मिटाने के बजाय मुख्य पाठ में सावधान भाषा और पादटिप्पणी का उपयोग किया गया है।
