    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτῳ μόρῳ
  choice: ऐसे ही दुर्भाग्यपूर्ण अंत से
  rationale: μόρος भाग्य, विनाश या नियत दुखद अंत को सूचित करता है और τοιούτῳ पिछले वर्णित दंड की ओर संकेत करता है। यह रूप हिंदी में उस गंभीर और प्रतिफल-सूचक भाव को स्वाभाविक ढंग से रखता है।
- source_word: τὸν παράνομον
  choice: वह व्यवस्था-विरोधी
  rationale: παράνομος का मूल भाव व्यवस्था या कानून के विरुद्ध चलना है। ‘व्यवस्था-विरोधी’ नैतिक-कानूनी निंदा को बनाए रखता है और केवल सामान्य ‘दुष्ट’ कहकर अर्थ को व्यापक नहीं करता।
- source_word: συνέβη θανεῖν
  choice: मरा
  rationale: संरचना का शाब्दिक अर्थ ‘उसके साथ ऐसा हुआ कि वह मरा’ है, पर हिंदी में यहाँ साधारण क्रिया अधिक स्वाभाविक है; मृत्यु के घटित होने का भाव पूरे वाक्य में सुरक्षित है।
- source_word: μηδὲ τῆς γῆς τυγχάνοντα
  choice: उसे मिट्टी भी नसीब न हुई
  rationale: यूनानी में शाब्दिक रूप से ‘भूमि भी प्राप्त न करते हुए’ है। संदर्भ में यह दफनाए जाने से वंचित रहने का मुहावरेदार संकेत है। हिंदी अभिव्यक्ति मूल की संक्षिप्तता और संकेतात्मकता दोनों बनाए रखती है।
- source_word: Μενέλαον
  choice: मेनेलाउस
  rationale: Μενέλαος का देवनागरी में निकट और पहचानने योग्य लिप्यंतरण।
theological_decisions:
- issue: παράνομος द्वारा मेनेलाउस का नैतिक-कानूनी चरित्रांकन
  choice: व्यवस्था-विरोधी मेनेलाउस
  alternative: दुष्ट मेनेलाउस
  rationale: मूल शब्द केवल सामान्य दुष्टता नहीं, बल्कि व्यवस्था के उल्लंघन को प्रमुखता देता है; चुना हुआ रूप इसी विशिष्ट बल को सुरक्षित रखता है।
- issue: भूमि न मिलने का अर्थ
  choice: मिट्टी भी नसीब न हुई
  alternative: उसे धरती में दफनाया भी नहीं गया
  rationale: संदर्भ दफन से वंचित होने का संकेत देता है, किंतु मूल पाठ ‘दफन’ शब्द को स्पष्ट रूप से नहीं कहता। मुख्य पाठ में मूल की संकेतात्मकता रखी गई है और पादटिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज रूप। ‘नसीब न हुई’ यहाँ गंभीर मुहावरे के रूप में प्रयुक्त है; अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
