base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/014.yaml
  text: And after entrusting the outcome to the Lord of the world[a], and urging those with him to fight bravely to the death for the laws, the temple, the city, the homeland, and the commonwealth[b], he encamped near Modein.
translation:
  language: hi
  text: उसने कार्यभार संसार के प्रभु[a] को सौंपकर अपने साथियों को प्रोत्साहित किया कि वे नियमों, मंदिर, नगर, मातृभूमि और नागरिक व्यवस्था[b] की रक्षा के लिए मृत्यु तक वीरता से लड़ें। फिर उसने मोदीन के पास अपनी सेना तैनात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ब्रह्माण्ड के प्रभु।” यूनानी κόσμος का अर्थ संसार अथवा सुव्यवस्थित ब्रह्माण्ड हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “नागरिक व्यवस्था” के लिए प्रयुक्त यूनानी πολιτεία का अर्थ “शासन-व्यवस्था,” “संविधान” या “जीवन-पद्धति” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς δὲ τὴν ἐπιτροπὴν
  choice: उसने ... सारी ज़िम्मेदारी सौंप दी
  rationale: ἐπιτροπή किसी को सौंपे गए दायित्व, देखरेख या मामले को सूचित कर सकता है। हिन्दी में यह वाक्यांश उस मामले को परमेश्वर के हाथ में सौंपने का भाव स्वाभाविक रूप से व्यक्त करता है, बिना केवल परिणाम का अर्थ आरोपित किए।
- source_word: τῷ κυρίῳ τοῦ κόσμου
  choice: संसार के प्रभु को
  rationale: κύριος के लिए बाइबलीय और स्वाभाविक शब्द 'प्रभु' रखा गया है। κόσμος का सीधा अर्थ यहाँ 'संसार' है; 'ब्रह्माण्ड' भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: παρακαλέσας τοὺς σὺν αὐτῷ
  choice: अपने साथियों को प्रोत्साहित किया
  rationale: παρακαλέω यहाँ युद्ध के लिए दृढ़ प्रेरणा देने के अर्थ में है। 'साथियों' से τοὺς σὺν αὐτῷ का स्वाभाविक हिन्दी रूप मिलता है, यद्यपि प्रसंग में वे उसके सैनिक हैं।
- source_word: γενναίως ἀγωνίσασθαι μέχρι θανάτου
  choice: मृत्यु तक वीरता से लड़ें
  rationale: सैन्य प्रसंग में ἀγωνίζομαι का अर्थ 'लड़ना' है; γενναίως को 'वीरता से' और μέχρι θανάτου को उसके शाब्दिक तनाव सहित 'मृत्यु तक' रखा गया है।
- source_word: περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας
  choice: व्यवस्था, मन्दिर, नगर, मातृभूमि और नागरिक व्यवस्था की रक्षा के लिए
  rationale: περί यहाँ जिन वस्तुओं के पक्ष में या उनकी रक्षा हेतु संघर्ष है, उसे दर्शाता है। νόμων यूनानी में बहुवचन है, पर हिन्दी बाइबलीय प्रयोग में सामूहिक 'व्यवस्था' अधिक स्वाभाविक है। πολιτεία के व्यापक नागरिक-राजनीतिक अर्थ को 'नागरिक व्यवस्था' रखकर संरक्षित किया गया है।
- source_word: περὶ δὲ Μωδεεὶμ ἐποιήσατο τὴν στρατιάν
  choice: फिर उसने मोदीन के पास अपनी सेना तैनात की
  rationale: περί स्थान के साथ निकटता दर्शाता है। ποιέω और στρατιά का सैन्य प्रयोग सेना को व्यवस्थित या तैनात करने का भाव देता है; केवल 'डेरा डाला' यूनानी की सम्भावित सैन्य-सज्जा को संकरा कर सकता है।
theological_decisions:
- issue: κύριος का ईश्वर के लिए अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: '''प्रभु'' आधुनिक हिन्दी बाइबल में ईश्वरीय सार्वभौमिकता व्यक्त करता है और κόσμος के साथ इस उपाधि का धार्मिक भार बनाए रखता है।'
- issue: ἐπιτροπή में दैवी देखरेख या परिणाम का भाव
  choice: सारी ज़िम्मेदारी सौंप दी
  alternative: परिणाम सौंप दिया
  rationale: मूल पद परिणाम को स्पष्ट रूप से नहीं कहता। 'ज़िम्मेदारी' सौंपने के कार्य को बनाए रखती है और मामले, देखरेख तथा परिणति को प्रभु पर छोड़ने के अर्थ के लिए स्थान देती है।
- issue: πολιτεία का वाचा-समुदाय और नागरिक जीवन के प्रसंग में अर्थ
  choice: नागरिक व्यवस्था
  alternative: शासन-व्यवस्था; संविधान; जीवन-पद्धति
  rationale: शब्द में नागरिक संगठन, संविधान और सामुदायिक जीवन के अर्थ सम्मिलित हो सकते हैं। 'नागरिक व्यवस्था' आधुनिक राष्ट्र-राज्य का अनावश्यक अर्थ जोड़े बिना राजनीतिक-सामुदायिक पहलू बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'मन्दिर' और 'मातृभूमि' ऐतिहासिक-धार्मिक प्रसंग के अनुकूल हैं। वाक्य को हिन्दी में सहज प्रवाह के लिए दो वाक्यों में बाँटा गया है, जबकि यूनानी participial क्रम का कालानुक्रमिक सम्बन्ध बनाए रखा गया है।
