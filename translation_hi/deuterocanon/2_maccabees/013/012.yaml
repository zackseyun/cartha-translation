  yaml_path: translation/deuterocanon/2_maccabees/013/012.yaml
  text: And when all had done the same together and had implored the merciful Lord with weeping and fasting and prostration for three days without ceasing[a], Judas encouraged them and ordered them to assemble.
translation:
  language: hi
  text: जब सब लोगों ने मिलकर वही किया और तीन दिन तक लगातार रोते, उपवास करते और भूमि पर दंडवत होकर दयालु प्रभु से विनती की, तब यहूदा ने उनका उत्साह बढ़ाया और उन्हें इकट्ठा होने[a] की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें आकर उपस्थित होने की आज्ञा दी।’ यूनानी क्रिया का अर्थ आना या उपस्थित होना हो सकता है; इस सैन्य प्रसंग में इससे कार्रवाई के लिए एकत्र होने या तैयार उपस्थित होने का भाव भी निकल सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντων ... τὸ αὐτὸ ποιησάντων ὁμοῦ
  choice: जब सब लोगों ने मिलकर वही किया
  rationale: यह संबंधवाचक कर्तृकारक-स्वतंत्र रचना यहूदा की अगली कार्रवाई से पहले की परिस्थिति बताती है। ‘सब लोगों’ और ‘मिलकर’ से πάντων तथा ὁμοῦ का सामूहिक बल बना रहता है, जबकि ‘वही किया’ पूर्ववर्ती कार्य की ओर संकेत को अस्पष्ट ही रहने देता है।
- source_word: καταξιωσάντων τὸν ἐλεήμονα κύριον
  choice: दयालु प्रभु से विनती की
  rationale: καταξιόω का सामान्य अर्थ ‘योग्य समझना’ हो सकता है, पर यहाँ रोने, उपवास और दण्डवत होने के प्रार्थनात्मक संदर्भ में यह आग्रहपूर्वक याचना का भाव देता है। ‘विनती की’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: τὸν ἐλεήμονα κύριον
  choice: दयालु प्रभु
  rationale: ἐλεήμων दया और करुणा का गुण व्यक्त करता है; ‘दयालु’ सीधा तथा साधारण पाठक के लिए सहज है। κύριος को श्रद्धापूर्ण ईश-संबोधन के रूप में ‘प्रभु’ रखा गया है।
- source_word: μετὰ κλαυθμοῦ καὶ νηστειῶν καὶ προπτώσεως
  choice: रोते, उपवास करते और भूमि पर दण्डवत होकर
  rationale: इन पदों को विनती के साथ चलने वाली क्रियाओं के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है। νηστειῶν बहुवचन है, किंतु अवधि के भीतर जारी धार्मिक उपवास के लिए हिन्दी में ‘उपवास करते’ अधिक स्वाभाविक है। προπτώσεως का शारीरिक रूप से गिरकर प्रार्थना करने का भाव ‘भूमि पर दण्डवत होकर’ से स्पष्ट होता है।
- source_word: ἐπὶ ἡμέρας τρεῖς ἀδιαλείπτως
  choice: तीन दिन तक लगातार
  rationale: ἐπὶ के साथ कर्मकारक अवधि बताता है और ἀδιαλείπτως निरंतरता; यह हिन्दी पदबंध दोनों भावों को संक्षेप और स्वाभाविक रूप में रखता है।
- source_word: παρακαλέσας αὐτοὺς
  choice: उनका उत्साह बढ़ाया
  rationale: παρακαλέω में प्रोत्साहन, आग्रह और ढाढ़स देने के अर्थ संभव हैं। सामूहिक प्रार्थना के बाद कार्रवाई से पहले ‘उत्साह बढ़ाया’ इस प्रसंग में उपयुक्त व्यापक अर्थ देता है।
- source_word: ἐκέλευσεν παραγίνεσθαι
  choice: उन्हें इकट्ठा होने की आज्ञा दी
  rationale: παραγίνομαι का मूल भाव आना या उपस्थित होना है। सैन्य प्रसंग में ‘इकट्ठा होने’ से आदेश का व्यावहारिक आशय व्यक्त होता है, बिना इसे केवल ‘तैयार रहने’ तक सीमित किए।
theological_decisions:
- issue: κύριον का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ परमेश्वर से प्रार्थना का श्रद्धापूर्ण संदर्भ है। ‘प्रभु’ κύριος का प्रचलित और तटस्थ बाइबलीय हिन्दी रूप है तथा कोई अतिरिक्त साम्प्रदायिक दावा नहीं जोड़ता।
- issue: καταξιωσάντων का प्रार्थनात्मक अर्थ
  choice: विनती की
  alternative: योग्य समझा
  rationale: क्रिया का शाब्दिक वैकल्पिक अर्थ ‘योग्य समझना’ है, पर रोने, उपवास और दण्डवत होने के साथ इसका प्रयोग यहाँ प्रबल याचना का संकेत देता है। इस संदर्भगत अर्थ को अपनाया गया है, जबकि उससे कोई विशेष धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। लंबी यूनानी वाक्य-रचना को हिन्दी में कालक्रमसूचक ‘जब… तब…’ से स्पष्ट किया गया है। ‘दण्डवत’ धार्मिक-सांस्कृतिक रूप से समझ में आने वाला शब्द है और शारीरिक रूप से भूमि पर गिरने का भाव बनाए रखता है।
