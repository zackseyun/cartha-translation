lexical_decisions:
- source_word: τὸ τέλος
  choice: अन्त में
  rationale: यह पदबंध घटनाक्रम के अन्तिम परिणाम की ओर संकेत करता है; ‘अन्त में’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: παρεμβολήν
  choice: छावनी
  rationale: इस सैनिक प्रसंग में यह शब्द सेना के पड़ाव या शिविर को दर्शाता है; ‘छावनी’ संक्षिप्त और सहज है।
- source_word: δέους
  choice: भय
  rationale: यह गहरा भय या आशंका व्यक्त करता है; ‘भय’ अर्थ को अनावश्यक रूप से तीव्र किए बिना सुरक्षित रखता है।
- source_word: ταραχῆς
  choice: अफरा-तफरी
  rationale: यह उत्तेजना, अव्यवस्था या हलचल का बोध कराता है; युद्ध-छावनी के प्रसंग में ‘अफरा-तफरी’ स्वाभाविक है और इसे केवल मानसिक ‘भ्रम’ तक सीमित नहीं करता।
- source_word: ἐπλήρωσαν
  choice: भर दिया
  rationale: क्रिया का सीधा अर्थ ‘भर देना’ है; छावनी कर्म है और भय तथा अफरा-तफरी वह सामग्री है जिससे उसे भरा गया।
- source_word: ἐξέλυσαν
  choice: वहाँ से निकल गए
  rationale: यहाँ क्रिया कार्रवाई के बाद प्रस्थान या पीछे हटने को सूचित करती है। ‘वहाँ से निकल गए’ दिशा को अनावश्यक रूप से भगदड़ या पराजय के रूप में नहीं दर्शाता।
- source_word: εὐημεροῦντες
  choice: सफल होकर
  rationale: कृदन्त का अर्थ भला होना, फलना-फूलना या सफल रहना हो सकता है। इस सैनिक प्रसंग में ‘सफल होकर’ कार्रवाई के अनुकूल परिणाम को व्यक्त करता है और मूल की कृदन्तीय संरचना भी बनाए रखता है।
