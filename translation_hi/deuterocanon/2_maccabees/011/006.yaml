base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/006.yaml
  text: But when those around Maccabeus learned that he was besieging the strongholds[a], they, together with the crowds, pleaded with the Lord with lamentations and tears to send a good angel for the salvation of Israel.
translation:
  language: hi
  text: पर जब मक्कबी के साथियों को पता चला कि वह गढ़ों को घेर रहा था, तो उन्होंने जनसमूहों के साथ विलाप और आँसुओं के साथ प्रभु से विनती की कि वह इस्राएल के उद्धार[a] के लिए एक भला स्वर्गदूत भेजे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल के छुटकारे के लिए।’ यूनानी σωτηρία किसी ठोस संकट से बचाव या छुटकारे के साथ-साथ व्यापक अर्थ में उद्धार भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέλαβον
  choice: पता चला
  rationale: यहाँ क्रिया का अर्थ किसी समाचार से अवगत होना है; ‘पता चला’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: मक्कबी के दल
  rationale: यूनानी मुहावरा मक्कबी से संबद्ध समूह को दर्शाता है। ‘दल’ सामूहिक अर्थ देता है और यह अनावश्यक रूप से तय नहीं करता कि मक्कबी स्वयं अलग था या सम्मिलित।
- source_word: πολιορκοῦντα
  choice: घेर रहा है
  rationale: πολιορκέω किसी किलेबंद स्थान की घेराबंदी करने के लिए प्रयुक्त होता है; यह रूप जारी कार्रवाई का भाव रखता है।
- source_word: τὰ ὀχυρώματα
  choice: गढ़ों
  rationale: यह शब्द किलेबंद और सुरक्षित स्थानों को दर्शाता है; ‘गढ़’ संक्षिप्त और स्वाभाविक सैन्य शब्द है।
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: विलाप और आँसुओं के बीच
  rationale: यह प्रार्थना में गहरे शोक और भावनात्मक तीव्रता को बनाए रखता है।
- source_word: ἱκέτευον
  choice: विनती की
  rationale: यह गंभीर और आग्रहपूर्ण प्रार्थना को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: σὺν τοῖς ὄχλοις
  choice: जनसमूहों के साथ
  rationale: बहुवचन ὄχλοι एकत्र लोगों के बड़े समूहों को दर्शाता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यह यहूदी प्रार्थना के संदर्भ में परमेश्वर के लिए प्रयुक्त κύριος का श्रद्धापूर्ण और प्रचलित हिन्दी रूप है।
- source_word: ἀγαθὸν ἄγγελον
  choice: एक भला स्वर्गदूत
  rationale: ‘भला’ ἀγαθός के नैतिक और हितकारी भाव को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ἀποστεῖλαι
  choice: भेजे
  rationale: यह क्रिया के साधारण और सीधे अर्थ को व्यक्त करता है।
- source_word: πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: इस्राएल के उद्धार के लिए
  rationale: सैन्य संकट में σωτηρία ठोस छुटकारे को सूचित कर सकता है, जबकि ‘उद्धार’ उसके व्यापक धार्मिक अर्थ को भी बनाए रखता है।
theological_decisions:
- issue: यहूदी प्रार्थना में κύριος का अनुवाद
  choice: प्रभु
  alternative: परमेश्वर
  rationale: मूल पाठ में κύριος है; ‘प्रभु’ उसके पद और श्रद्धापूर्ण शास्त्रीय प्रयोग दोनों को सुरक्षित रखता है।
- issue: सैन्य संकट में σωτηρία का अर्थ
  choice: उद्धार
  alternative: छुटकारा
  rationale: तात्कालिक संदर्भ राष्ट्रीय और सैन्य संकट का है, इसलिए ‘छुटकारा’ संभव है; ‘उद्धार’ उसी बचाव को व्यक्त करते हुए शब्द के व्यापक धार्मिक आयाम को भी खुला रखता है।
- issue: ἀγαθὸν ἄγγελον में स्वर्गदूत का स्वरूप
  choice: एक भला स्वर्गदूत
  alternative: एक सहायक स्वर्गदूत
  rationale: मूल केवल स्वर्गदूत को ‘भला’ कहता है; ‘सहायक’ उसके कार्य की व्याख्या कर देता, इसलिए अधिक औपचारिक रूप रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘वह’ का संदर्भ मूल की तरह स्पष्ट नहीं किया गया, ताकि यूनानी पाठ की वास्तविक अस्पष्टता बनी रहे।
