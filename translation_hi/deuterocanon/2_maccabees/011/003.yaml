- source_word: τεμένη
  choice: मंदिरों
  rationale: यह अन्यजातियों के पवित्र परिसरों को दर्शाता है; आधुनिक हिन्दी में ‘मंदिरों’ सबसे सहज समतुल्य है।
- source_word: πρατὴν
  choice: बिक्री के लिए रखने
  rationale: विशेषण पद को बिकाऊ बनाए जाने का भाव देता है। हिन्दी की यह क्रियात्मक अभिव्यक्ति उस व्यावसायीकरण को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀρχιερωσύνην
  choice: महायाजक का पद
  rationale: शब्द व्यक्ति के बजाय महायाजक के पद या प्रतिष्ठा को सूचित करता है।
- source_word: κατʼ ἔτος
  choice: हर वर्ष
  rationale: यह बार-बार होने वाली वार्षिक बिक्री का सीधा कालवाचक संकेत है।
- source_word: ποιήσειν
  choice: करने … रखने का इरादा था
  rationale: ग्रीक में यह infinitive पूर्ववर्ती संदर्भ पर निर्भर है और दोनों प्रस्तावों को नियंत्रित करता है। हिन्दी में वाक्यांश को सुगठित रखने के लिए साझा आशय ‘इरादा था’ से व्यक्त किया गया है।
