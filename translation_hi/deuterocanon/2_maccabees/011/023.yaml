  yaml_path: translation/deuterocanon/2_maccabees/011/023.yaml
  text: Since our father has departed to the gods[a], and since we want those in the kingdom, being free from disturbance, to turn to the care of the Jews[b],
translation:
  language: hi
  text: हमारे पिता के देवताओं के पास चले जाने के बाद[a], हम चाहते हैं कि राज्य के लोग निर्विघ्न रहकर यहूदियों के मामलों पर ध्यान दें[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ है, “देवताओं के पास चले गए।” यह मृत्यु के लिए हेलेनिस्टिक राजकीय भाषा में प्रयुक्त एक सौम्य अभिव्यक्ति थी; कुछ अनुवाद इसे केवल “मर गए” कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अंतिम वाक्यांश की रचना संक्षिप्त है। इसका अर्थ “यहूदियों की देखभाल करें” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ πατρὸς ἡμῶν
  choice: हमारे पिता
  rationale: राजकीय पत्राचार में यह मृत पूर्ववर्ती शासक की ओर संकेत करता है। ‘हमारे पिता’ मूल के वंशगत और दरबारी संबोधन को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: εἰς θεοὺς μεταστάντος
  choice: देवताओं के पास चले गए
  rationale: यह मृत्यु के लिए प्रयुक्त यूनानी राजकीय सौम्योक्ति है। बहुवचन ‘देवताओं’ को बनाए रखने से पत्र की यूनानी बहुदेववादी अभिव्यक्ति सुरक्षित रहती है।
- source_word: βουλόμενοι
  choice: हमारी इच्छा हुई
  rationale: यह कृदंत शासक की घोषित इच्छा बताता है; हिन्दी में आश्रित वाक्य के साथ यह रूप स्वाभाविक है।
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: राज्य के लोग
  rationale: वाक्यांश राज्य से संबंधित लोगों को व्यापक रूप से दर्शाता है; ‘प्रजा’ जैसी अधिक विशिष्ट व्याख्या जोड़े बिना यह अर्थ स्पष्ट करता है।
- source_word: ἀπερισπάστως ὄντας
  choice: बिना किसी अशांति के रहें
  rationale: राजनीतिक संदर्भ में इसका अर्थ विघ्न, खिंचाव या उपद्रव से मुक्त स्थिति है। यह हिन्दी रूप सार्वजनिक शांति का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: यहूदियों के मामलों पर ध्यान दें
  rationale: मूल यूनानी संरचना संक्षिप्त और कुछ अस्पष्ट है। ἐπιμέλεια में देखभाल, ध्यान या प्रबंध का भाव हो सकता है; ‘मामलों पर ध्यान दें’ सहज रहते हुए व्यापक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: बहुदेववादी राजकीय मृत्यु-सूत्र को बनाए रखना
  choice: देवताओं के पास चले गए
  alternative: मर गए
  rationale: यह कथन यूनानी राजकीय पत्र का बहुदेववादी मुहावरा है। इसे सामान्य एकेश्वरवादी या केवल जैविक मृत्यु-वर्णन में बदलने के बजाय स्रोत की धार्मिक-सांस्कृतिक भाषा बनाए रखी गई है।
- issue: यहूदियों से संबंधित अंतिम वाक्यांश की संक्षिप्तता
  choice: यहूदियों के मामलों पर ध्यान दें
  alternative: यहूदियों की देखभाल में लगें
  rationale: मूल में ἐπιμέλεια का संबंध यहूदियों की प्रत्यक्ष देखभाल अथवा उनके मामलों की देखरेख—दोनों से समझा जा सकता है। मुख्य पाठ में स्वाभाविक व्यापक अर्थ दिया गया और विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजकीय पत्र-शैली रखी गई है। बहुदेववादी दरबारी सूत्र को निष्प्रभावी नहीं किया गया। पद अगले वाक्य से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है।
