  yaml_path: translation/deuterocanon/2_maccabees/011/009.yaml
  text: And all together they blessed the merciful God and were strengthened in spirit[a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: hi
  text: और उन सबने एक साथ दयालु परमेश्वर को धन्य कहा, और उनके मनों में बल आ गया[a]। वे न केवल मनुष्यों को, बल्कि सबसे उग्र जंगली पशुओं और लोहे की दीवारों को भी घायल करने के लिए तैयार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपनी आत्माओं में बलवन्त हुए।” यूनानी वाक्यांश भीतरी बल या साहस पाने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: तब उन सबने एक साथ
  rationale: ὁμοῦ और πάντες मिलकर सामूहिक तथा एकमत क्रिया पर बल देते हैं; δέ को प्रसंगगत क्रम के लिए ‘तब’ से व्यक्त किया गया है।
- source_word: εὐλόγησαν
  choice: धन्य कहा
  rationale: यह εὐλογέω के धार्मिक अर्थ को ‘स्तुति की’ की अपेक्षा अधिक निकटता से रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸν ἐλεήμονα θεόν
  choice: दयालु परमेश्वर
  rationale: ἐλεήμων परमेश्वर की दया और करुणा को सूचित करता है; ‘दयालु’ सरल, गरिमापूर्ण और सीधा विशेषण है।
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: उनके मनों में बल आ गया
  rationale: यह वाक्यांश युद्ध से पहले मिली भीतरी दृढ़ता और साहस व्यक्त करता है। ‘मनों में’ ψυχαῖς की आंतरिकता को रखता है, बिना किसी तकनीकी आत्मा-शरीर सिद्धान्त को आरोपित किए।
- source_word: ἀνθρώπους
  choice: मनुष्यों
  rationale: स्रोत का सामान्य बहुवचन अर्थ ठीक से व्यक्त होता है और पशुओं के साथ मूल विरोध बना रहता है।
- source_word: θῆρας δὲ τοὺς ἀγριωτάτους
  choice: बड़े-से-बड़े हिंसक जंगली पशुओं
  rationale: ἀγριωτάτους की अत्युत्तम मात्रा और θῆρας के जंगली पशु अर्थ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: σιδηρᾶ τείχη
  choice: लोहे की दीवारों
  rationale: मूल के अतिशयोक्तिपूर्ण सैन्य बिंब को सीधे सुरक्षित रखता है।
- source_word: τιτρώσκειν ὄντες ἕτοιμοι
  choice: घायल करने के लिए तैयार थे
  rationale: τιτρώσκειν का मूल भाव चोट या घाव पहुँचाना है; यह सजीव प्राणियों और रूपकात्मक रूप से लोहे की दीवारों, दोनों पर लागू मूल असामान्यता को बनाए रखता है।
theological_decisions:
- issue: ψυχαῖς का युद्ध-पूर्व आंतरिक दृढ़ता के संदर्भ में अनुवाद
  choice: उनके मनों में बल आ गया
  alternative: वे अपनी आत्माओं में बलवन्त हुए
  rationale: यहाँ मुख्य आशय साहस और भीतरी संकल्प है, न कि मानव-स्वरूप के विषय में कोई तकनीकी धर्मवैज्ञानिक कथन। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। मूल की वीरतापूर्ण अतिशयोक्ति और ‘लोहे की दीवारों को घायल करने’ का असामान्य बिंब जानबूझकर सुरक्षित रखा गया है।
