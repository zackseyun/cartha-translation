  text: Farewell. In the one hundred forty-eighth year[a], on the twenty-fourth day of Dios Corinthios.
translation:
  language: hi
  text: कुशल रहें। एक सौ अड़तालीसवें वर्ष में, दियोस कोरिन्थियोस[a] महीने के चौबीसवें दिन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में मकिदूनियाई पंचांग के महीने का नाम ‘दियोस कोरिन्थियोस’ ही रखा गया है; उसे किसी दूसरे पंचांग के महीने के समान नहीं बताया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: कुशल रहें
  rationale: यह बहुवचन आज्ञार्थक रूप पत्र के समापन में प्रचलित मंगलकामना है। ‘कुशल रहें’ उसके शाब्दिक स्वास्थ्य-संबंधी भाव और पत्रात्मक प्रयोग, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: एक सौ अड़तालीसवें वर्ष में
  rationale: यूनानी तिथि-सूत्र को स्पष्ट और गरिमापूर्ण हिन्दी में रखा गया है; संख्या को शब्दों में लिखने से दस्तावेज़ की औपचारिक शैली बनी रहती है।
- source_word: Διὸς Κορινθίου
  choice: दियोस कोरिन्थियोस
  rationale: ऐतिहासिक पंचांग के नाम को किसी आधुनिक महीने के साथ अनिश्चित रूप से मिलाने के बजाय यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: τετράδι καὶ εἰκάδι
  choice: चौबीसवें दिन
  rationale: यूनानी मुहावरा शाब्दिक रूप से ‘चौथे और बीसवें’ कहता है, जिसका आशय महीने का चौबीसवाँ दिन है; हिन्दी में प्रचलित तिथि-रूप स्पष्ट और अर्थनिष्ठ है।
