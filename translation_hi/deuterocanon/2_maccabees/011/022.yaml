translation:
  language: hi
  text: राजा का पत्र इस प्रकार था:[a] “राजा अन्तियोकुस अपने भाई[b] लूसियास को नमस्कार।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “इस प्रकार समाहित था”; यह पत्र के आगे आने वाले शब्दों का परिचय है।
    reason: lexical_alternative
  - marker: b
    text: “भाई” यहाँ वास्तविक पारिवारिक संबंध के बजाय राजदरबार में राजनीतिक निकटता दर्शाने वाली उपाधि भी हो सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... τοῦ βασιλέως ἐπιστολή
  choice: राजा की चिट्ठी
  rationale: ἐπιστολή लिखित संदेश अथवा पत्र का सामान्य शब्द है। ‘चिट्ठी’ सहज आधुनिक हिन्दी है और प्रसंग के औपचारिक पत्र के अर्थ को स्पष्ट रखती है।
- source_word: περιεῖχεν οὕτως
  choice: में यह लिखा था
  rationale: शाब्दिक अर्थ ‘इस प्रकार समाए हुए थी’ है, पर यहाँ यह पत्र की विषय-वस्तु उद्धृत करने का सूत्र है। यह हिन्दी में स्वाभाविक रूप से वही कार्य करता है।
- source_word: Βασιλεὺς Ἀντίοχος
  choice: राजा अन्तियोकुस
  rationale: उपाधि और नाम के यूनानी क्रम को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: τῷ ἀδελφῷ
  choice: अपने भाई को
  rationale: ἀδελφός का सीधा अर्थ ‘भाई’ है। ‘अपने’ से प्रेषक के साथ उसका संबंध स्वाभाविक हिन्दी में व्यक्त होता है; दरबारी पदवी होने की संभावना टिप्पणी में सुरक्षित रखी गई है।
- source_word: Λυσίᾳ
  choice: लूसियास
  rationale: यूनानी Λυσίας का हिन्दी लिप्यंतरण।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: यह यूनानी पत्रों का रूढ़ अभिवादन है। ‘नमस्कार’ संक्षिप्त और स्वाभाविक हिन्दी पत्रारंभ है।
theological_decisions:
- issue: ἀδελφός में वास्तविक पारिवारिक संबंध या दरबारी उपाधि
  choice: मुख्य पाठ में ‘भाई’
  alternative: राजकीय सहचर / निकट अधिकारी
  rationale: मूल शब्द का सामान्य संबंधपरक अर्थ बनाए रखा गया है, जबकि राजनीतिक-दरबारी प्रयोग की वास्तविक संभावना पाद-टिप्पणी में बताई गई है; इस प्रकार अस्पष्टता का अनुचित समाधान नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। पत्र के औपचारिक आरंभ को स्पष्ट रखा गया है। पाद-टिप्पणी चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं और यूनानी की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखी गई है।
