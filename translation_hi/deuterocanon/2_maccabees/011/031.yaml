  yaml_path: translation/deuterocanon/2_maccabees/011/031.yaml
  text: that the Jews may make use of their own provisions and laws[a], just as before[b]; and none of them shall in any way be harassed concerning the things done in ignorance.
translation:
  language: hi
  text: कि यहूदी पहले की तरह अपने ही प्रावधानों[a] और नियमों को बरत सकें; और उनमें से किसी को भी अनजाने में हुई बातों के संबंध में किसी भी तरह परेशान न किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने ही खर्चों,” “अपने ही साधनों,” अथवा “अपनी जीवन-व्यवस्था से जुड़े प्रबंधों”; यूनानी शब्द खर्च या प्रावधान का अर्थ दे सकता है और यहाँ संभवतः यह यहूदी जीवन-पद्धति से जुड़े व्यावहारिक प्रबंधों की ओर संकेत करता है, जिनमें भोजन की व्यवस्था भी शामिल हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῆσθαι
  choice: पालन कर सकें
  rationale: χρῆσθαι का मूल अर्थ ‘उपयोग करना/काम में लाना’ है। हिंदी में ‘प्रबंधों और नियमों का उपयोग’ अस्वाभाविक लगता है; ‘पालन कर सकें’ दोनों को व्यवहार में जारी रखने की अनुमति स्वाभाविक ढंग से व्यक्त करता है, यद्यपि नियमों के साथ इसका संबंध अधिक सीधा है।
- source_word: δαπανήμασιν
  choice: प्रबंधों
  rationale: यह शब्द खर्चों, साधनों या जीवन-व्यवस्था से जुड़े प्रावधानों का संकेत दे सकता है। ‘प्रबंधों’ से इसकी व्यापकता बनी रहती है और इसे केवल भोजन तक सीमित नहीं किया जाता।
- source_word: νόμοις
  choice: नियमों
  rationale: ‘नियमों’ से νόμοις का विधिक और धार्मिक बल स्पष्ट रहता है। ‘रीति-रिवाज’ कहना इसके औपचारिक अर्थ को कमजोर कर सकता था।
- source_word: καθὰ καὶ τὸ πρότερον
  choice: पहले की तरह
  rationale: यह पूर्व प्रचलित व्यवस्था की बहाली को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: παρενοχληθήσεται
  choice: परेशान न किया जाए
  rationale: भविष्यत् कर्मवाच्य का आशय किसी प्रकार के हस्तक्षेप या उत्पीड़न से संरक्षण देना है। यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: περὶ τῶν ἠγνοημένων
  choice: अनजाने में हुई बातों के कारण
  rationale: यह अभिव्यक्ति अज्ञान या अनजानेपन से संबंधित पूर्व बातों/कृत्यों की ओर संकेत करती है। ‘बातों’ से मूल की व्यापकता बनी रहती है और इसे विशिष्ट अपराधों तक सीमित नहीं किया जाता।
theological_decisions:
- issue: περὶ τῶν ἠγνοημένων के क्षमादान-सदृश वाक्यांश का दायरा
  choice: अनजाने में हुई बातों के कारण सामान्य रूप से परेशान न किए जाने का आश्वासन
  alternative: पहले उपेक्षित मामलों अथवा अनजाने में किए गए विशिष्ट उल्लंघनों के लिए संरक्षण
  rationale: यूनानी पाठ यह नहीं बताता कि अज्ञान किसका था या किन कामों की बात है। इसलिए अनुवाद किसी विशेष कानूनी या धार्मिक अपराध को मानकर अस्पष्टता दूर नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; राजकीय पत्र की गरिमा बनाए रखते हुए वाक्य को सामान्य पाठकों के लिए स्पष्ट रखा गया है। ‘प्रबंधों’ जानबूझकर व्यापक है, ताकि δαπανήμασιν को केवल भोजन या केवल आर्थिक खर्च न माना जाए।
