  yaml_path: translation/deuterocanon/2_maccabees/011/037.yaml
  text: Therefore hurry[a], and send some men[b], so that we too may learn what your intention is.
translation:
  language: hi
  text: इसलिए शीघ्रता कीजिए और कुछ लोगों को भेजिए[a], ताकि हम भी जान सकें कि आपकी राय क्या है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कुछ व्यक्तियों को भेजिए’ अथवा ‘कुछ प्रतिनिधियों को भेजिए’; यूनानी अनिश्चित सर्वनाम τινας उन लोगों का परिचय अधिक स्पष्ट नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘ताकि हम भी जान सकें कि आप किस प्रकार की राय के हैं’; यहाँ यूनानी मुहावरे को सहज हिन्दी में ‘आपकी राय क्या है’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक पिछले कथन से इस अनुरोध का तार्किक संबंध दिखाता है।
- source_word: σπεύσατε
  choice: शीघ्रता कीजिए
  rationale: अओरिस्ट आज्ञार्थक तत्काल और तत्पर कार्रवाई का आग्रह करता है; यह रूप गरिमापूर्ण और सहज है।
- source_word: πέμψατέ τινας
  choice: कुछ लोगों को भेजिए
  rationale: πέμψατε का अर्थ ‘भेजिए’ है और अनिश्चित बहुवचन τινας व्यक्तियों की संख्या या पद को अधिक स्पष्ट नहीं करता।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्यसूचक उपवाक्य आरंभ करता है।
- source_word: καὶ ἡμεῖς
  choice: हम भी
  rationale: καί का समावेशी अथवा बलसूचक भाव स्वाभाविक हिन्दी में ‘भी’ से व्यक्त होता है।
- source_word: ἐπιγνῶμεν
  choice: जान सकें
  rationale: उद्देश्यसूचक उपवाक्य में यह अओरिस्ट संभावनार्थक रूप किसी बात को जान लेने या निश्चित रूप से समझ लेने का भाव रखता है।
- source_word: ὁποῖοί ἐστε γνώμης
  choice: आपकी राय क्या है
  rationale: शाब्दिक यूनानी मुहावरे का आशय सामने वाले पक्ष की राय, मनोवृत्ति या मंशा पूछना है; ‘राय’ γνώμη के निकट रहते हुए हिन्दी में स्वाभाविक है।
