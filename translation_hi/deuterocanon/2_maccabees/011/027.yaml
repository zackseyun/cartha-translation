  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
translation:
  language: hi
  text: 'और यहूदी लोगों के लिए राजा का पत्र इस प्रकार था: “राजा अन्तियोखुस, यहूदी बुज़ुर्गों की परिषद्[b] और अन्य यहूदियों[a] को नमस्कार।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शेष यहूदियों।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द γερουσία बुज़ुर्गों के एक आधिकारिक निकाय को दर्शाता है; इसका अनुवाद “यहूदियों की सभा” भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: और यहूदी जाति के नाम
  rationale: πρός यहाँ पत्र के प्राप्तकर्ता को सूचित करता है। संदर्भ में ἔθνος यहूदी समुदाय को सामूहिक-राष्ट्रीय रूप में दर्शाता है; स्पष्टता के लिए ‘यहूदी जाति’ कहा गया है।
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: राजा का पत्र इस प्रकार था
  rationale: यह आगे उद्धृत पत्र की विषयवस्तु प्रस्तुत करने वाला स्वाभाविक हिन्दी सूत्र है और यूनानी संबंधवाचक रचना को ठीक रखता है।
- source_word: Βασιλεὺς Ἀντίοχος
  choice: राजा अन्तियोखुस
  rationale: राजकीय उपाधि को नाम से पहले रखकर यूनानी पत्र-शीर्षक का क्रम और हिन्दी की स्वाभाविकता दोनों बनाए गए हैं।
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: यहूदियों की पुरनियों की परिषद्
  rationale: γερουσία किसी आधिकारिक वृद्ध-निकाय को दर्शाता है। ‘पुरनियों की परिषद्’ संस्थागत अर्थ को स्पष्ट करता है और आधुनिक ‘सीनेट’ के संभावित अनैतिहासिक संकेत से बचता है।
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: अन्य यहूदियों
  rationale: ἄλλοις पहले उल्लिखित परिषद् से अलग व्यापक यहूदी समूह को सूचित करता है; ‘अन्य’ इस भेद को सीधे बनाए रखता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: यह पत्रारम्भ में प्रयुक्त प्रचलित यूनानी अभिवादन है; हिन्दी पत्र-शैली में ‘नमस्कार’ इसका स्वाभाविक समतुल्य है।
