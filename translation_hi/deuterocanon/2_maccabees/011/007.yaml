  to: परन्तु मक्काबी ने स्वयं सबसे पहले हथियार उठाए और दूसरों को उसके साथ खतरा मोल लेकर[a] अपने भाइयों[b] की सहायता के लिए आने को प्रोत्साहित किया। वे सब मिलकर उत्साह से निकल पड़े।
