base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/007.yaml
  text: But Maccabeus himself[a], taking up arms first, urged the others, risking danger along with him, to come to the aid of their brothers[b]; and together they also rushed out eagerly.
translation:
  language: hi
  text: परन्तु मक्काबी ने स्वयं सबसे पहले हथियार उठाए और दूसरों को उसके साथ खतरा मोल लेकर[a] अपने भाइयों[b] की सहायता के लिए आने को प्रोत्साहित किया। वे सब मिलकर उत्साह से निकल पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके साथ खतरा मोल ले रहे थे।” यूनानी कृदन्त का संबंध “दूसरों” के वर्णन से भी समझा जा सकता है।
    reason: syntactic_alternative
  - marker: b
    text: यहाँ “भाइयों” से सम्भवतः उनके साथी यहूदी या स्वजातीय लोग अभिप्रेत हैं।
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς δὲ πρῶτος ὁ Μακκαβαῖος
  choice: परन्तु मक्काबी ने स्वयं सबसे पहले
  rationale: αὐτός के बलाघात को ‘स्वयं’, πρῶτος को ‘सबसे पहले’, और δέ के हल्के कथात्मक संक्रमण को ‘परन्तु’ से व्यक्त किया गया है। यूनानी पाठ में उपाधि/नाम ὁ Μακκαβαῖος है, इसलिए ‘मक्काबी’ रखा गया है।
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: हथियार उठाए
  rationale: यह सैन्य प्रसंग में हथियार धारण करने का स्वाभाविक हिन्दी मुहावरा है और यूनानी कृदन्त की पूर्ववर्ती क्रिया को स्पष्ट करता है।
- source_word: προετρέψατο τοὺς ἄλλους
  choice: दूसरे लोगों को ... उत्साहित किया
  rationale: προτρέπω का अर्थ उकसाना, प्रोत्साहित करना या उत्साहित करना हो सकता है। यहाँ ‘उत्साहित किया’ सैन्य तत्परता को व्यक्त करता है, पर अनावश्यक कठोरता नहीं जोड़ता।
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: जो उसके साथ खतरा मोल ले रहे थे
  rationale: कृदन्त διακινδυνεύοντας व्याकरणतः ‘दूसरे लोगों’ का वर्णन करता है। ‘खतरा मोल लेना’ उसके जोखिम उठाने के सक्रिय भाव को स्वाभाविक हिन्दी में बनाए रखता है; वैकल्पिक वाक्य-संबंध को पाद-टिप्पणी में दर्शाया गया है।
- source_word: ἐπιβοηθεῖν τοῖς ἀδελφοῖς αὐτῶν
  choice: अपने भाइयों की सहायता के लिए आने
  rationale: ἐπιβοηθέω तत्काल सहायता के लिए पहुँचने का भाव रखता है। ἀδελφοῖς का शाब्दिक संबंधपरक शब्द ‘भाइयों’ के रूप में सुरक्षित रखा गया है।
- source_word: ὁμοῦ δὲ καὶ προθύμως ἐξώρμησαν
  choice: फिर वे सब मिलकर उत्साह से निकल पड़े
  rationale: ὁμοῦ को ‘सब मिलकर’, προθύμως को ‘उत्साह से’, और ἐξώρμησαν की ऊर्जावान गति को ‘निकल पड़े’ से व्यक्त किया गया है, बिना इसे निश्चित रूप से ‘धावा बोलना’ मान लेने के।
theological_decisions:
- issue: ἀδελφοῖς αὐτῶν का आशय
  choice: अपने भाइयों
  alternative: अपने साथी यहूदियों / अपने जाति-भाइयों
  rationale: यूनानी पाठ शाब्दिक रूप से ‘उनके भाइयों’ कहता है। प्रसंग में इससे संभवतः उनके साथी यहूदी या स्वजातीय लोग अभिप्रेत हैं, पर मुख्य पाठ में पारिवारिक रूपक को सुरक्षित रखा गया है और प्रसंगगत अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘खतरा मोल लेना’ तथा ‘निकल पड़े’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि मूल यूनानी की सैन्य तात्कालिकता और संबंधपरक भाषा बनी रहती है।
