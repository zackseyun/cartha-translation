lexical_decisions:
- source_word: ἔρρωσθε
  choice: कुशल से रहिए
  rationale: यह पत्र के अंत में प्रयुक्त पारंपरिक विदाई-सूत्र है; यह शाब्दिक ‘बलवान रहिए’ की अपेक्षा स्वास्थ्य और कुशल की कामना व्यक्त करता है।
- source_word: ἔτους
  choice: वर्ष में
  rationale: काल-निर्धारण के संबंधकारक सूत्र को स्वाभाविक हिन्दी में अधिकरण के रूप में व्यक्त किया गया है।
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: एक सौ अड़तालीसवें
  rationale: यूनानी क्रमवाचक संख्या को ऐतिहासिक संवत्-शैली बनाए रखते हुए मानक आधुनिक हिन्दी में प्रस्तुत किया गया है।
- source_word: Ξανθικοῦ
  choice: ज़ैन्थिकुस महीने के
  rationale: ऐतिहासिक मकिदूनियाई महीने के नाम का अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है और स्पष्टता के लिए ‘महीने’ जोड़ा गया है।
- source_word: πεντεκαιδεκάτῃ
  choice: पंद्रहवें दिन
  rationale: तिथि-सूत्र में निहित ‘दिन’ को हिन्दी में स्पष्ट किया गया है।
