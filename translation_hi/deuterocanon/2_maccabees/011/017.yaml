  rationale: नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप, जो यूनानी रूप की पहचान बनाए रखता है।
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: आपके भेजे हुए
