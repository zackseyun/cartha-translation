  rationale: आधिकारिक दस्तावेज सौंपने या पेश करने के अर्थ को औपचारिक किंतु सहज हिन्दी में व्यक्त करता है।
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: नीचे लिखा हुआ आधिकारिक पत्र
  rationale: ὑπογεγραμμένον का शाब्दिक स्थानगत भाव ‘नीचे लिखा हुआ’ रखा गया है और χρηματισμός के दस्तावेजी, आधिकारिक स्वर को ‘आधिकारिक पत्र’ से व्यक्त किया गया है, बिना इसे निश्चित रूप से ‘राजाज्ञा’ मानने के।
- source_word: ἠξίουν
  choice: निवेदन किया
  rationale: राजनयिक अथवा औपचारिक संदर्भ में अनुरोध करने का आदरसूचक और स्वाभाविक हिन्दी रूप।
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: उसमें बताई गई बातों के विषय में
  rationale: αὐτοῦ को निकटवर्ती दस्तावेज का संदर्भ मानते हुए, σημαινομένων के ‘सूचित/बताई गई’ अर्थ को स्पष्ट और सहज रूप दिया गया है।
