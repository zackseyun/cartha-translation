  yaml_path: translation/deuterocanon/2_maccabees/011/036.yaml
  text: But whatever he has decided should be presented to the king, send someone at once to examine these matters, so that we may settle them as is fitting for us; for we are going on to Antioch.
translation:
  language: hi
  text: पर जिन बातों के विषय में उसने निर्णय किया है कि उन्हें राजा के सामने प्रस्तुत किया जाए, उनकी जाँच करने के लिए तुरन्त किसी को भेजिए, ताकि हम उन्हें उस रीति से निपटा सकें जो हमारे लिए उचित है।[a] क्योंकि हम अन्ताकिया की ओर बढ़ रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि हम उनके विषय में वही कर सकें जो हमारे लिए उचित है।” यूनानी का शाब्दिक अर्थ है, “ताकि हम उन्हें उस प्रकार रखें जैसा हमारे लिए उचित है”; सम्भवतः इसका आशय इन बातों को उचित रीति से व्यवस्थित करने या निपटाने से है।
    reason: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν में ‘रखना/होना’ का मुहावरेदार प्रशासनिक अर्थ निश्चित नहीं है; पादटिप्पणी शाब्दिक रूप और व्यापक विकल्प दोनों सुरक्षित रखती है।
lexical_decisions:
- source_word: ἃ δὲ
  choice: पर जिन बातों के विषय में
  rationale: δέ यहाँ हल्का संक्रमण या विरोध दर्शाता है; सापेक्ष ἃ को हिन्दी में स्वाभाविक वाक्य-विन्यास के अनुसार ‘जिन बातों के विषय में’ कहा गया है।
- source_word: ἔκρινεν
  choice: उसने निर्णय किया है
  rationale: κρίνω यहाँ न्यायिक फैसला सुनाने के बजाय प्रशासनिक निर्णय को व्यक्त करता है। यूनानी में कर्ता एकवचन और अनिर्दिष्ट है, इसलिए उसे ‘उसने’ ही रखा गया है।
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: उन्हें राजा के सामने प्रस्तुत किया जाए
  rationale: निष्क्रिय infinitive औपचारिक रूप से राजा के समक्ष विषय रखने का भाव देता है; ‘प्रस्तुत किया जाए’ प्रशासनिक अर्थ और निष्क्रियता दोनों बनाए रखता है।
- source_word: πέμψατέ τινα παραχρῆμα
  choice: तुरन्त किसी को भेजिए
  rationale: बहुवचन आज्ञार्थक रूप को आदरसूचक बहुवचन ‘भेजिए’ और παραχρῆμα की तात्कालिकता को ‘तुरन्त’ से व्यक्त किया गया है। τις को लिंग-निर्देश के बिना ‘किसी को’ कहा गया है।
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: उनकी जाँच करने के लिए
  rationale: यह participle भेजे जाने वाले व्यक्ति का उद्देश्य बताता है। प्रसंग में ἐπισκέπτομαι का अर्थ इन प्रशासनिक मामलों की जाँच या समीक्षा करना है।
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: ताकि हम उन्हें उस रीति से निपटा सकें जो हमारे लिए उचित है
  rationale: ἔχωμεν का शाब्दिक अर्थ ‘हमारे पास हों’ है, पर इस पत्रात्मक-प्रशासनिक प्रयोग में विषयों को उचित रूप से व्यवस्थित या सँभालने का भाव सम्भावित है। ‘निपटा सकें’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: क्योंकि हम अन्ताकिया की ओर बढ़ रहे हैं
  rationale: γάρ कारण बताता है और प्रसंग में προσάγομεν गन्तव्य की ओर आगे बढ़ने को सूचित करता है। ‘की ओर बढ़ रहे हैं’ दिशा को बनाए रखता है और पहुँच जाने का अर्थ नहीं जोड़ता।
