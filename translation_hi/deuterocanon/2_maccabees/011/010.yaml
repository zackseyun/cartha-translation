  text: They advanced in battle formation[a], having the ally from heaven before them, because the Lord had shown them mercy.
translation:
  language: hi
  text: वे युद्ध-व्यूह में आगे बढ़े[a]; स्वर्ग से आया सहयोगी उनके आगे था, क्योंकि प्रभु ने उन पर दया की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे युद्ध के लिए सुसज्जित होकर आगे बढ़े; स्वर्ग से आया सहयोगी उनके आगे-आगे चल रहा था।” यूनानी वाक्य का आरंभ संक्षिप्त है और उसकी रचना थोड़े भिन्न ढंग से भी समझी जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: आगे बढ़े … उनके आगे था
  rationale: यूनानी पदबंध संक्षिप्त और व्याकरण की दृष्टि से कुछ असामान्य है। यह सेना के आगे बढ़ने का वर्णन करता है और साथ ही अगले पदबंध में स्वर्ग से आए सहयोगी के उनके आगे होने से जुड़ता है। हिन्दी में इस दोहरे संबंध को स्वाभाविक ढंग से रखा गया है।
- source_word: ἐν διασκευῇ
  choice: युद्ध-व्यूह में
  rationale: यह पद युद्ध के लिए सुसज्जित और व्यवस्थित होने का भाव देता है। ‘युद्ध-व्यूह में’ सैन्य तैयारी और क्रमबद्ध गठन, दोनों को संक्षेप में व्यक्त करता है।
- source_word: σύμμαχον
  choice: सहयोगी
  rationale: यह संज्ञा साथ मिलकर युद्ध करने वाले पक्ष या साथी के लिए प्रयुक्त होती है। ‘सहयोगी’ सामान्य ‘सहायक’ की अपेक्षा साथ देने वाले पक्ष का भाव अधिक सुरक्षित रखता है।
- source_word: ἀπʼ οὐρανοῦ
  choice: स्वर्ग से आया
  rationale: इस धार्मिक और सैन्य प्रसंग में οὐρανός का आशय केवल आकाश नहीं, बल्कि स्वर्ग है। ‘आया’ हिन्दी में संबंध को स्पष्ट करता है, बिना उस सहयोगी की पहचान निर्धारित किए।
- source_word: ἐλεήσαντος
  choice: दया की थी
  rationale: अओरिस्ट कृदन्त उनके आगे बढ़ने और भरोसे का आधार बताता है। ‘दया की थी’ दया के मूल भाव और पूर्ववर्ती कारण, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: यहूदी पवित्रशास्त्रीय प्रसंग में κύριος परमेश्वर के लिए आदरसूचक पद है; इसलिए इसे ‘प्रभु’ कहा गया है।
theological_decisions:
- issue: ‘स्वर्ग से आए सहयोगी’ की पहचान
  choice: पहचान को ‘स्वर्ग से आया सहयोगी’ कहकर अनिर्दिष्ट रखा गया है।
  alternative: इसे किसी स्वर्गदूत की सहायता या सीधे परमेश्वर की सहायता के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ उस सहयोगी की पहचान स्पष्ट नहीं करता। अनुवाद किसी स्वर्गदूत अथवा प्रत्यक्ष ईश्वरीय प्रकटता को जोड़ने के बजाय मूल पाठ की धार्मिक खुली संभावना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘युद्ध-व्यूह’ सैन्य संदर्भ को स्पष्ट करता है, जबकि पादटिप्पणी मूल यूनानी की संक्षिप्तता और वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखती है।
