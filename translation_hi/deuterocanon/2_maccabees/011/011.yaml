lexical_decisions:
- source_word: λεόντινων δὲ ἐντινάξαντες εἰς τοὺς πολεμίους
  choice: पर वे सिंहों की तरह शत्रुओं पर टूट पड़े
  rationale: पाठ का रूप असामान्य है, पर संदर्भ और प्रचलित पाठ-समझ सिंहों के समान उग्रता से शत्रु पर झपटने का भाव देती है। ‘टूट पड़े’ आधुनिक हिन्दी में उस आकस्मिक और प्रबल आक्रमण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατέστρωσαν
  choice: मार गिराया
  rationale: युद्ध-संदर्भ में क्रिया का अर्थ शत्रुओं को भूमि पर बिछा देना, अर्थात मार डालना है; ‘मार गिराया’ चित्रात्मकता और स्वाभाविक हिन्दी दोनों बनाए रखता है।
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: ग्यारह हज़ार
  rationale: शाब्दिक संख्या ‘दस हज़ार के साथ एक हज़ार’ का योग ग्यारह हज़ार है।
- source_word: ἱππεῖς δὲ ἑξακοσίους πρὸς χιλίοις
  choice: सोलह सौ घुड़सवारों
  rationale: ‘एक हज़ार के साथ छह सौ’ का स्वाभाविक संख्यात्मक रूप ‘सोलह सौ’ है; ἱππεῖς से घुड़सवार सैनिक अभिप्रेत हैं।
- source_word: τοὺς δὲ πάντας ἠνάγκασαν φεύγειν
  choice: और उन सबको भागने पर मजबूर कर दिया
  rationale: यह मूल यूनानी की बाध्यता और पलायन दोनों को सीधे तथा स्पष्ट रूप से व्यक्त करता है।
