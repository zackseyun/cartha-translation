translation:
  language: hi
  text: और वे सिंहों की तरह शत्रुओं पर टूट पड़े, और उनमें से ग्यारह हज़ार को तथा सोलह सौ घुड़सवारों को मार गिराया; और उन सबको भागने पर मजबूर कर दिया।
