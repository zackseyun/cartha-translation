    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  choice: इकट्ठा करके
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई कार्रवाई बताता है; यह प्रयोग क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: लगभग अस्सी हज़ार सैनिकों
  rationale: μυριάς दस हज़ार का समूह है, इसलिए आठ μυριάδες अस्सी हज़ार हैं; περὶ संख्या को अनुमानित बनाता है। सैन्य प्रसंग के कारण ‘सैनिकों’ की पूर्ति अर्थ स्पष्ट करती है।
- source_word: τὴν ἵππον ἅπασαν
  choice: सारी घुड़सवार सेना
  rationale: सैन्य प्रसंग में ἵππος सामूहिक रूप से अश्वारोही सेना का बोध करा सकता है; यह अनुवाद केवल घोड़ों की अपेक्षा आशय को अधिक ठीक व्यक्त करता है।
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: यहूदियों के विरुद्ध चढ़ आया
  rationale: ἐπί के साथ कर्मकारक यहाँ विरोधी दिशा में सैन्य अग्रगमन दर्शाता है; ‘चढ़ आया’ हिन्दी में इस शत्रुतापूर्ण गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λογιζόμενος
  choice: उसका इरादा ... बनाने का था
  rationale: प्रसंग में कृदंत केवल विचार नहीं, सोची हुई योजना या उद्देश्य प्रकट करता है।
- source_word: τὴν μὲν πόλιν
  choice: नगर
  rationale: संदर्भित नगर को संक्षेप और गरिमापूर्ण हिन्दी में व्यक्त किया गया है; μέν आगे आने वाले विचार से संबंध बनाता है, इसलिए वाक्यांश अंत में खुला रखा गया है।
- source_word: Ἕλλησιν
  choice: यूनानियों का
  rationale: यहाँ सम्प्रदान का संबंध निवास-स्थान के भाव से है—नगर ऐसा स्थान बने जो यूनानियों के लिए या उनके अधिकार में निवास हो। हिन्दी का संबंधकारक इस भाव को सहज रूप देता है।
- source_word: οἰκητήριον ποιήσειν
  choice: निवास-स्थान बनाने
  rationale: यह पद किसी स्थान को रहने की जगह में बदलने का अर्थ देता है; ‘निवास-स्थान’ स्पष्ट है और उपनिवेश बसाने जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: जातीय अथवा भौगोलिक पद Ἰουδαίους
  choice: यहूदियों
  alternative: यहूदिया के लोगों
  rationale: इस प्रसंग में विरोध एक सामूहिक जनसमुदाय से है, इसलिए ‘यहूदियों’ अधिक स्वाभाविक है; फिर भी यूनानी पद में यहूदिया के लोगों का भौगोलिक संकेत भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण सैन्य-वर्णन अपनाया गया है। ‘चढ़ आया’ शत्रुतापूर्ण अग्रगमन को स्पष्ट करता है। पद के अंत की अल्पविराम-संरचना अगले पद में जारी μέν-विन्यास के कारण बनाए रखी गई है।
