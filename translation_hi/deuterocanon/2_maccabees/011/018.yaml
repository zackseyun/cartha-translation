  text: So then[a], whatever had to be presented also to the king I made clear, and whatever was possible he granted.
translation:
  language: hi
  text: इसलिए जिन बातों को राजा के सामने भी रखना आवश्यक था, उन्हें मैंने स्पष्ट कर दिया; और जो कुछ संभव था, उसे उसने मंजूर कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जो कुछ परिस्थितियों में किया जा सकता था, उसकी उसने अनुमति दे दी।” यूनानी शब्दों का अर्थ “संभव/व्यावहारिक” और “मंजूर किया/प्रदान किया/अनुमति दी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα μὲν οὖν
  choice: इसलिए जिन बातों को
  rationale: οὖν के निष्कर्षात्मक-संक्रमणकारी भाव को स्वाभाविक हिन्दी में ‘इसलिए’ से व्यक्त किया गया है; μὲν आगे आने वाले δὲ के साथ दोनों उपवाक्यों में अंतर स्थापित करता है।
- source_word: ἔδει
  choice: आवश्यक था
  rationale: यह अपूर्णकालिक निरपेक्ष क्रिया बीती परिस्थिति में आवश्यकता व्यक्त करती है।
- source_word: καὶ τῷ βασιλεῖ
  choice: राजा के सामने भी
  rationale: καί को ‘भी’ से सुरक्षित रखा गया है, जिससे पता चलता है कि इन बातों को पिछली चर्चा के अतिरिक्त राजा के समक्ष भी प्रस्तुत करना था।
- source_word: προσενεχθῆναι
  choice: रखना
  rationale: प्राधिकारी के समक्ष विषय प्रस्तुत करने के प्रशासनिक अर्थ को ‘सामने रखना’ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διεσάφησα
  choice: मैंने स्पष्ट कर दिया
  rationale: क्रिया का अर्थ किसी विषय को साफ या सुस्पष्ट करना है; यह रूप उसके सक्रिय और पूर्ण किए गए कार्य को बनाए रखता है।
- source_word: ἃ δὲ ἦν ἐνδεχόμενα
  choice: और जो कुछ संभव था
  rationale: ἐνδεχόμενα परिस्थितियों में संभव या साध्य बातों को सूचित करता है; ‘संभव’ इसकी व्यापकता को बनाए रखता है और कानूनी अनुमति का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: συνεχώρησεν
  choice: उसे उसने स्वीकार कर लिया
  rationale: राजकीय निवेदन के प्रसंग में क्रिया का अर्थ मान लेना, प्रदान करना या अनुमति देना हो सकता है। ‘स्वीकार कर लिया’ हिन्दी में स्वाभाविक है और मूल की कुछ अर्थगत व्यापकता बनाए रखता है।
