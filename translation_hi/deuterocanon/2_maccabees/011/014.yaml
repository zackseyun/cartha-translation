  yaml_path: translation/deuterocanon/2_maccabees/011/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king, compelling him to become their friend.
translation:
  language: hi
  text: उसने उसे सभी न्यायोचित माँगों पर समझौता करने के लिए, और इस बात के लिए भी मना लिया कि वह राजा को भी मनाएगा और उसे उनका मित्र बनने के लिए बाध्य करेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभी उचित बातों में मेल करने के लिए’ अथवा ‘सभी न्यायसंगत दावों पर सहमति करने के लिए।’ यूनानी क्रिया συλλύεσθαι संक्षिप्त है और किसी मेल-मिलाप या समझौते तक पहुँचने का अर्थ दे सकती है।
    reason: यूनानी शब्द के राजनयिक अर्थ और उसकी वास्तविक अर्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἔπεισεν
  choice: मना लिया
  rationale: πείθω के भूतकालिक रूप का सीधा और स्वाभाविक अर्थ है किसी को सहमत कर लेना; वार्ता के संदर्भ में ‘मना लिया’ उपयुक्त है।
- source_word: συλλύεσθαι
  choice: समझौता कर लेने
  rationale: राजनयिक संदर्भ में यह संक्षिप्त यूनानी क्रिया मेल-मिलाप या परस्पर समझौते तक पहुँचने का भाव देती है; शाब्दिक ‘साथ-साथ खुल जाना’ यहाँ स्वाभाविक नहीं होगा।
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: सभी न्यायोचित माँगों पर
  rationale: τὰ δίκαια यहाँ धार्मिक ‘धार्मिकता’ के बजाय वार्ता में उचित अधिकारों, शर्तों या दावों को सूचित करता है।
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: और यह भी कहा कि वह राजा को भी मनाकर
  rationale: διότι को यहाँ मनाने के कथ्य या दिए गए आश्वासन के रूप में समझना प्रसंगानुकूल है; भविष्यकाल πείσει आगे राजा को मनाने का संकेत देता है।
- source_word: φίλον αὐτοῖς
  choice: उनका मित्र
  rationale: यह राजनीतिक अनुकूलता या मैत्रीपूर्ण संबंध का संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: ἀναγκάζων γενέσθαι
  choice: बनने के लिए बाध्य करेगा
  rationale: ἀναγκάζω में दबाव या विवशता का प्रबल भाव है, जिसे ‘बाध्य करेगा’ बिना अनावश्यक अतिशयोक्ति के बनाए रखता है।
theological_decisions:
- issue: राजनीतिक-कानूनी संदर्भ में τοῖς δικαίοις का अर्थ
  choice: न्यायोचित माँगों
  alternative: उचित बातों / न्यायसंगत दावों
  rationale: यहाँ शब्द का संबंध समझौते में उचित या देय बातों से है, न कि धार्मिक अर्थ में ‘धार्मिकता’ से; इसलिए राजनीतिक वार्ता का भाव स्पष्ट रखा गया है।
- issue: διότι का कथ्यात्मक या कारणात्मक संबंध
  choice: और यह भी कहा कि
  alternative: क्योंकि वह राजा को भी मनाएगा
  rationale: वाक्य में यह उस आश्वासन का परिचय दे सकता है जिसके आधार पर उसने सामने वाले को मनाया। कारणात्मक पाठ भी व्याकरणतः संभव है, इसलिए इसे कठोर रूप से सिद्धांतगत अर्थ नहीं दिया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और राजनयिक शैली वाला रूप। यूनानी वाक्य की संक्षिप्तता को पठनीय बनाने के लिए ‘यह भी कहा कि’ जोड़ा गया है। अंतिम उपवाक्य में राजा ही ‘उसे’ है—अर्थात उसे उनका मित्र बनने के लिए बाध्य किया जाएगा—पर मूल की संक्षिप्त रचना को अनावश्यक विस्तार नहीं दिया गया।
