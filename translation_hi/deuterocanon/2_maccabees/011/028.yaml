translation:
  language: hi
  text: कुशल से रहो। जैसा हम चाहते हैं, वैसा ही हो; और हम स्वयं भी स्वस्थ हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρρωσθε
  choice: कुशल से रहो
  rationale: बहुवचन आज्ञार्थक रूप पत्र के समापन में शुभकामनापरक विदाई के रूप में प्रयुक्त है। ‘कुशल से रहो’ उसके स्वास्थ्य-संबंधी मूल भाव और पत्रात्मक प्रयोग, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: εἴη ἂν
  choice: हो
  rationale: ἄν सहित संभावनार्थक रूप यहाँ इच्छा या विनम्र कामना व्यक्त करता है; ‘हो’ हिन्दी में संक्षिप्त और स्वाभाविक कामनार्थक रूप है।
- source_word: ὡς βούλομεθα
  choice: जैसा हम चाहते हैं
  rationale: βούλομαι इच्छा या अभिलाषा को व्यक्त करता है। ‘जैसा हम चाहते हैं’ अर्थ को स्पष्ट रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: ὑγιαίνομεν
  choice: स्वस्थ हैं
  rationale: क्रिया का सीधा अर्थ स्वस्थ या कुशल होना है; ‘स्वस्थ हैं’ पत्र के स्वास्थ्य-वक्तव्य को स्पष्ट रूप से व्यक्त करता है।
- source_word: καὶ αὐτοὶ δὲ
  choice: और हम स्वयं भी
  rationale: αὐτοί के हल्के बल को ‘स्वयं’ और καί के समावेशी भाव को ‘भी’ से सुरक्षित रखा गया है; δέ को प्रसंगानुकूल ‘और’ से जोड़ा गया है।
