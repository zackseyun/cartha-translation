base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: hi
  text: 'क्योंकि लूसियास की ओर से यहूदियों को पत्र लिखे गए थे, जिनका प्रारूप[a] यह था: “लूसियास की ओर से यहूदियों के जनसमूह[b] को नमस्कार।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शब्दावली।” यूनानी वाक्यांश आगे दिए गए पत्र के प्रारूप या उसके ठीक शब्दों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहूदियों की सभा/सामूहिक निकाय।” यूनानी शब्द बड़े सामूहिक समूह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: क्योंकि ... पत्र लिखे गए थे
  rationale: परिप्रयुक्त पूर्णभूत कर्मवाच्य को स्वाभाविक हिन्दी में ‘लिखे गए थे’ से व्यक्त किया गया है; γάρ को पूर्ववर्ती कथन से कारणात्मक संबंध बनाए रखने के लिए ‘क्योंकि’ कहा गया है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों के नाम
  rationale: यहाँ संबोधित जातीय-धार्मिक समुदाय अभिप्रेत है; पत्राचार के प्रसंग में ‘के नाम’ स्वाभाविक हिन्दी है।
- source_word: ἐπιστολαὶ
  choice: पत्र
  rationale: यह प्रशासनिक पत्राचार के लिए सरल, आधुनिक और सटीक शब्द है।
- source_word: παρὰ μὲν Λυσίου
  choice: लूसियास की ओर से
  rationale: παρά के संबंधकारक रूप से पत्र के स्रोत का बोध होता है; ‘की ओर से’ हिन्दी में इसे स्पष्ट रखता है।
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: जिनकी भाषा इस प्रकार थी
  rationale: वाक्यांश आगे उद्धृत पत्र के रूप अथवा शब्द-विन्यास का परिचय देता है। ‘भाषा इस प्रकार थी’ हिन्दी में सहज है और अनावश्यक रूप से यह तय नहीं करता कि ठीक शब्दशः पाठ अभिप्रेत है या सामान्य प्रारूप।
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: यहूदियों के समुदाय को
  rationale: πλῆθος एक बड़े सामूहिक निकाय को दर्शाता है। ‘समुदाय’ आधुनिक हिन्दी में स्वाभाविक है और इसे औपचारिक ‘सभा’ मान लेने से बचता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्रारंभ में यह प्रचलित अभिवादन-सूत्र है; हिन्दी पत्र-शैली में ‘नमस्कार’ उसका सहज समतुल्य है।
