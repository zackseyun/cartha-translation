    issue: ‘जिनकी भाषा इस प्रकार थी’ is less precise than a reference to the letter’s form or wording.
    rationale: τὸν τρόπον τοῦτον introduces the form or wording of the heading; ‘प्रारूप’ preserves that scope.
  - severity: low
    issue: The draft omits notes for the two explicit lexical ambiguities preserved in the English audit trail.
    rationale: Notes anchored to ‘प्रारूप’ and ‘जनसमूह’ document the alternative senses without forcing an interpretation.
