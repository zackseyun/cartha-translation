  yaml_path: translation/deuterocanon/2_maccabees/011/013.yaml
  text: But since he was not foolish[a], but was considering the defeat that had happened to him and had realized that the Hebrews were unconquerable, because the mighty God was fighting alongside them, he sent ahead
translation:
  language: hi
  text: पर वह मूर्ख नहीं था; अपने साथ हुई क्षति पर मन-ही-मन विचार करते हुए और यह समझकर कि इब्रानियों को हराया नहीं जा सकता, क्योंकि सामर्थी परमेश्वर उनके साथ मिलकर युद्ध कर रहा था, उसने आगे भेजा—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: पर वह मूर्ख नहीं था
  rationale: ἀνόους का अर्थ विवेक या समझ से रहित होना है। आधुनिक हिन्दी में ‘मूर्ख नहीं था’ स्वाभाविक है और आगे के विवेकपूर्ण आकलन के साथ स्पष्ट विरोध व्यक्त करता है।
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: मन-ही-मन विचार किया
  rationale: ἀντιβάλλω में सामने रखकर तुलना या तौलने का भाव है और πρὸς ἑαυτόν आन्तरिक विचार को सूचित करता है। ‘मन-ही-मन विचार किया’ इस भाव को सहज हिन्दी में रखता है।
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: अपने ऊपर आई पराजय
  rationale: ἐλάττωμα हानि, कमी या सैन्य उलटफेर सूचित कर सकता है। प्रसंग में ‘पराजय’ स्पष्ट है, जबकि ‘अपने ऊपर आई’ γεγονός और περὶ αὐτόν का स्वाभाविक हिन्दी रूप है।
- source_word: συννοήσας
  choice: समझ लिया
  rationale: यह पूर्ण हो चुकी पहचान या निष्कर्ष को दर्शाता है; ‘समझ लिया’ मुख्य क्रिया से पहले प्राप्त बोध को सहज रूप में व्यक्त करता है।
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: इब्रानियों को हराया नहीं जा सकता
  rationale: ἀνίκητος का अर्थ अजेय या जिसे जीता न जा सके है। यह वाक्यात्मक रूप सामान्य पाठक के लिए स्पष्ट है और मूल की प्रबलता बनाए रखता है।
- source_word: τοῦ δυναμένου θεοῦ
  choice: सामर्थी परमेश्वर
  rationale: δυναμένου प्रभावी शक्ति और सामर्थ्य पर बल देता है। ‘सामर्थी परमेश्वर’ संक्षिप्त, गरिमापूर्ण और मूल के अर्थ के निकट है।
- source_word: συμμαχοῦντος αὐτοῖς
  choice: उनके साथ मिलकर युद्ध कर रहा था
  rationale: συμμαχέω का सैन्य अर्थ सहयोगी के रूप में साथ लड़ना है। यह अनुवाद केवल सामान्य सहायता के बजाय सक्रिय युद्ध-सहयोग को सुरक्षित रखता है।
- source_word: προαποστείλας
  choice: उसने पहले ही दूत भेजे
  rationale: क्रिया का अर्थ पहले से या आगे भेजना है। यूनानी वाक्य अगले पद में जारी रहता है; ‘दूत’ हिन्दी में क्रिया का स्वाभाविक निहित कर्म स्पष्ट करता है और अंतिम दीर्घ विराम निरन्तरता दर्शाता है।
theological_decisions:
- issue: युद्ध में परमेश्वर की सक्रिय सहायता
  choice: क्योंकि सामर्थी परमेश्वर उनके साथ मिलकर युद्ध कर रहा था
  alternative: क्योंकि सामर्थी परमेश्वर उनका सहयोगी था
  rationale: मूल συμμαχοῦντος परमेश्वर को सैन्य सहयोगी के रूप में सक्रिय दिखाता है। चुना हुआ रूप इस कथन को न तो सामान्य संरक्षण तक सीमित करता है, न उससे आगे कोई साम्प्रदायिक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। यूनानी पद कृदन्तों की लंबी शृंखला को स्पष्ट हिन्दी वाक्यों में बाँटा गया है। पद अगले वाक्य में जारी होने के कारण अंत में दीर्घ विराम रखा गया है।
