  - marker: b
    text: ज़ैंथिकुस मकिदुनियाई महीने का नाम है, जिसका प्रयोग सेल्यूसिड संवत् की तिथियों में होता था।
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  choice: स्वस्थ रहें
  rationale: यह पत्र के समापन में प्रयुक्त परंपरागत शुभकामना है। हिंदी में ‘स्वस्थ रहें’ मूल अर्थ ‘भले-चंगे रहें’ को स्वाभाविक ढंग से सुरक्षित रखता है; केवल ‘विदा’ कहने की अपेक्षा यह यूनानी अभिव्यक्ति की शब्दार्थगत छवि भी बनाए रखता है।
- source_word: ἔτους
  choice: वर्ष में
  rationale: यह तिथि बताने वाले संबंधकारक पदबंध का अंग है; हिंदी में ‘वर्ष में’ स्वाभाविक रूप है।
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: एक सौ अड़तालीसवें
  rationale: यह सेल्यूसिड संवत् के वर्ष की क्रमवाचक संख्या है; हिंदी में क्रमवाचक रूप स्पष्ट रखा गया है।
- source_word: Ξανθικοῦ
  choice: ज़ैंथिकुस महीने के
  rationale: यह मकिदुनियाई महीने का नाम है, इसलिए इसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया और स्पष्टता के लिए ‘महीने’ जोड़ा गया है।
- source_word: πεντεκαιδεκάτῃ
  choice: पंद्रहवें दिन
  rationale: यूनानी में ‘दिन’ अध्याहृत है; स्वाभाविक और स्पष्ट हिंदी तिथि के लिए इसे व्यक्त किया गया है।
