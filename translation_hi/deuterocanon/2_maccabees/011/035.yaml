translation:
  language: hi
  text: लुसियास ने, जो राजा का संबंधी है, तुम्हें जिन बातों की अनुमति दी है, उन्हें हम भी मंज़ूर करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: जिन बातों... उन्हें
  rationale: यह पदबंध विचाराधीन विषय को सूचित करता है। हिन्दी में संबंधवाचक–नित्यसंबंधी रचना से यूनानी वाक्य का संबंध स्वाभाविक और स्पष्ट रहता है।
- source_word: Λυσίας
  choice: लुसियास
  rationale: यूनानी नाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: जो राजा का संबंधी है
  rationale: συγγενής पारिवारिक संबंध बताता है, पर संबंध की सटीक कोटि नहीं; इसलिए व्यापक और स्वाभाविक ‘संबंधी’ मूल की अस्पष्टता बनाए रखता है।
- source_word: συνεχώρησεν
  choice: अनुमति दी है
  rationale: राजनयिक संदर्भ में क्रिया किसी आधिकारिक रियायत या अनुमति को व्यक्त करती है। ‘अनुमति दी’ आधुनिक हिन्दी में सहज है और अर्थ को आवश्यकता से अधिक विशिष्ट नहीं करती।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: द्वितीय पुरुष बहुवचन के संप्रदान कारक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: उन्हें हम भी मंज़ूर करते हैं
  rationale: सहभागी स्वीकृति या अनुमोदन का भाव व्यक्त करता है; ‘भी’ καί को और ‘मंज़ूर करते हैं’ औपचारिक सहमति को स्वाभाविक हिन्दी में दर्शाता है।
