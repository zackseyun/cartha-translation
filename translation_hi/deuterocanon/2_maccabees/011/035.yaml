  source_fidelity: यूनानी ὑπὲρ ὧν का विषय-सूचक संबंध ‘जिन बातों... उन्हें’ से ठीक व्यक्त है। Λυσίας, ‘राजा का संबंधी’ (ὁ συγγενὴς τοῦ βασιλέως), प्राप्तकर्ता बहुवचन ‘तुम्हें’, लुसियास की दी हुई अनुमति/रियायत, और वक्ताओं का सहभागी अनुमोदन—सभी मूल के अनुरूप हैं। ‘दी है’ हिन्दी में वर्तमान-प्रासंगिक पूर्णता के रूप में स्वाभाविक है और यूनानी अओरिस्ट के आशय के विरुद्ध नहीं जाता।
