  yaml_path: translation/deuterocanon/2_maccabees/011/024.yaml
  text: Having heard that the Jews did not approve of my father's change to Greek ways[a], but were choosing their own way of life and asking that their lawful customs be permitted to them,
translation:
  language: hi
  text: हमने सुना है कि यहूदी मेरे पिता के यूनानी तौर-तरीकों की ओर परिवर्तन[a] से सहमत नहीं थे, बल्कि अपनी ही जीवन-पद्धति को प्राथमिकता देते थे और अनुरोध कर रहे थे कि उन्हें अपने विधि-सम्मत रीति-रिवाजों को मानने की अनुमति दी जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पिता के यूनानी रीति-रिवाजों की ओर परिवर्तन।” यूनानी पद का संकेत यूनानीकरण से जुड़ी प्रथाओं की ओर है, केवल यूनानी भाषा की ओर आवश्यक रूप से नहीं।
    reason: शाब्दिक विकल्प और सांस्कृतिक आशय स्पष्ट करना।
lexical_decisions:
- source_word: ἀκηκοότες
  choice: हमने सुना है
  rationale: पूर्णकालिक कृदन्त वर्तमान परिणाम सहित प्राप्त सूचना को दर्शाता है और राजकीय पत्र की औपचारिक भूमिका को स्वाभाविक हिन्दी में रखता है।
- source_word: μὴ συνεὐδοκοῦντας
  choice: से सहमत नहीं हैं
  rationale: साथ में अनुमोदन या सहमति न देने का भाव स्पष्ट करता है; यहाँ केवल व्यक्तिगत नापसंदगी नहीं, नीति से असहमति अभिप्रेत है।
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: मेरे पिता द्वारा यूनानी रीति-रिवाजों की ओर किए गए बदलाव
  rationale: μετάθεσις बदलाव को और εἰς τὰ Ἑλληνικά यूनानीकरण की सांस्कृतिक दिशा को व्यक्त करता है; यह केवल यूनानी भाषा अपनाने की बात नहीं है।
- source_word: τὴν ἑαυτῶν ἀγωγήν
  choice: अपनी ही जीवन-पद्धति
  rationale: ἀγωγή सामुदायिक आचरण, रहन-सहन और जीवन के ढंग को समेटता है।
- source_word: αἱρετίζοντας
  choice: चुनते हैं
  rationale: यह जान-बूझकर किए गए चयन या प्राथमिकता के सक्रिय भाव को बनाए रखता है।
- source_word: ἀξιοῦν
  choice: माँग करते हैं
  rationale: इस प्रसंग में शब्द औपचारिक अनुरोध का बोध देता है; 'माँग करते हैं' राजकीय निवेदन की दृढ़ता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: उन्हें अपने विधि-सम्मत रीति-रिवाजों का पालन करने की अनुमति दी जाए
  rationale: τὰ νόμιμα स्थापित वैधानिक या परंपरागत आचारों को दर्शाता है। हिन्दी में 'पालन करने की अनुमति' निष्क्रिय अनुमति के आशय को अधिक स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: εἰς τὰ Ἑλληνικά का आशय
  choice: यूनानी रीति-रिवाजों की ओर सांस्कृतिक बदलाव
  alternative: यूनानी भाषा की ओर बदलाव
  rationale: निकट प्रसंग में यहूदी जीवन-पद्धति और विधि-सम्मत रीति-रिवाजों का उल्लेख है, इसलिए वाक्य सांस्कृतिक यूनानीकरण की नीति की ओर संकेत करता है, मात्र भाषा-परिवर्तन की ओर नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजकीय-पत्र शैली रखी गई है। वाक्य को अगले पद से जुड़ने योग्य रखा गया है, पर हिन्दी में पूर्ण अर्थ-स्पष्टता के लिए अंत में पूर्णविराम दिया गया है।
