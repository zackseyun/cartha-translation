  yaml_path: translation/deuterocanon/2_maccabees/011/015.yaml
  text: And Maccabeus agreed to everything that Lysias urged, being concerned for what was advantageous; for whatever Maccabeus set before Lysias in writing concerning the Jews, the king granted.
translation:
  language: hi
  text: मक्काबी ने लूसियास के आग्रह की हुई सभी बातों को मान लिया, जो हितकर था उसकी चिंता करते हुए। क्योंकि मक्काबी ने यहूदियों के विषय में जो कुछ लिखित रूप में लूसियास को दिया था, उसे सचिव[a] ने मान लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठ-परंपराओं में “राजा” पढ़ा जाता है।
    reason: दिए गए यूनानी पाठ में ὁ γραμματεύς (‘सचिव’) है, जबकि अन्य पाठ-परंपराओं में ‘राजा’ मिलता है; पादटिप्पणी इस पाठगत अंतर को दर्शाती है।
lexical_decisions:
- source_word: ἐπένευσε
  choice: मान लिया
  rationale: यह क्रिया सहमति देने या स्वीकृति जताने का भाव रखती है; आधुनिक हिन्दी में यह सहज और प्रसंगानुकूल है।
- source_word: παρεκάλει
  choice: आग्रह कर रहा था
  rationale: यहाँ लूसियास द्वारा अनुरोधपूर्वक दबाव डालने या मनाने का भाव है; ‘आग्रह’ मूल की शक्ति को बनाए रखता है।
- source_word: τοῦ συμφέροντος
  choice: सबके हित
  rationale: मूल में लाभकारी या हितकर बात का संकेत है। सन्धि-प्रसंग में ‘सबके हित’ स्वाभाविक है, यद्यपि यूनानी पद स्वयं लाभ के दायरे को स्पष्ट नहीं करता।
- source_word: διὰ γραπτῶν
  choice: लिखित रूप में
  rationale: मूल का अर्थ लेखबद्ध माध्यम से प्रस्तुत करना है; यह हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: ὁ γραμματεύς
  choice: सचिव
  rationale: प्रस्तुत यूनानी पाठ स्पष्ट रूप से ‘लेखक/सचिव’ कहता है; प्रशासनिक प्रसंग में ‘सचिव’ उपयुक्त है।
- source_word: συνεχώρησεν
  choice: स्वीकार कर लिया
  rationale: यहाँ माँगों को मान लेने या अनुमति देने का भाव है; ‘स्वीकार कर लिया’ दोनों पक्षों के बीच समझौते के प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: अंतिम कर्ता की पहचान
  choice: मुख्य पाठ में ‘सचिव’
  alternative: ‘राजा’
  rationale: दिए गए LXX-Swete यूनानी स्रोत में ὁ γραμματεύς (‘सचिव/लेखक’) है। अंग्रेज़ी परामर्श-पाठ का ‘राजा’ संभवतः पाठांतर या सुधारित पठन दर्शाता है; स्रोत-साक्ष्य को प्राथमिकता देते हुए मुख्य पाठ में ‘सचिव’ रखा गया और पाठांतर को पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘मक्काबी’ और ‘लूसियास’ प्रचलित नामरूप हैं। दो लंबे यूनानी खंडों को स्पष्टता के लिए दो वाक्यों में रखा गया है।
