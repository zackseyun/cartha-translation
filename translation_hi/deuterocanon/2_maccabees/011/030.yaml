- source_word: τοῖς ... καταπορευομένοις
  choice: जो लोग ... चले जाएँगे
  rationale: καταπορεύομαι में नीचे अथवा वहाँ से जाने की दिशात्मक छाया है। प्रसंग में गंतव्य स्पष्ट न होने के कारण ‘लौट जाएँगे’ या ‘घर चले जाएँगे’ कहकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: ज़ैंथिकस महीने की तीसवीं तारीख तक
  rationale: यह समय-सीमा का स्वाभाविक हिन्दी रूप है; मकिदूनियाई महीने के नाम का आधुनिक पंचांग में अनुमानित रूपांतरण नहीं किया गया।
- source_word: ὑπάρξει
  choice: मिलेगा
  rationale: यूनानी भविष्यकाल यहाँ किसी चीज़ के उपलब्ध या प्रदान होने का भाव देता है। हिन्दी में ‘मिलेगा’ स्वाभाविक है और कोई अनुल्लिखित कर्ता नहीं जोड़ता।
- source_word: δεξιὰ
  choice: भरोसे का वचन
  rationale: शाब्दिक अर्थ ‘दाहिना हाथ’ है, पर राजनयिक और विधिक प्रयोग में यह सद्भाव, निष्ठा अथवा सुरक्षा की प्रतिज्ञा का मुहावरा है। ‘भरोसे का वचन’ इस मुहावरे का अर्थ सहज हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: μετὰ τῆς ἀδείας
  choice: अनुमति के साथ
  rationale: ἄδεια अनुमति, छूट या निर्भय होकर कार्य करने की स्वतंत्रता का बोध करा सकता है। यहाँ व्यापक और सुलभ ‘अनुमति’ चुना गया है, बिना इसे पूर्ण क्षमादान या दंडमुक्ति के रूप में सीमित किए।
