base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews, greetings.”'
translation:
  language: hi
  text: 'रोमियों ने भी उनके पास एक पत्र भेजा, जिसमें यह लिखा था: “क्विन्तुस मेम्मियुस और तीतुस मानियुस, रोमियों के वरिष्ठजन[a], यहूदी लोगों को नमस्कार।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रोमी वरिष्ठजन”; प्रसंग के अनुसार “रोमियों के दूत” भी हो सकता है। यूनानी शब्द का शाब्दिक अर्थ “बुज़ुर्ग” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: रोमियों ने भी ... भेजा
  rationale: कर्ता को सामूहिक रूप में ‘रोमियों’ कहना यूनानी पाठ के निकट है; ‘भी’ καί को व्यक्त करता है और δέ को हिन्दी में अलग प्रतिकूल संयोजक देकर बोझिल नहीं बनाया गया।
- source_word: πρὸς αὐτοὺς ἐπιστολήν
  choice: उनके पास एक पत्र
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पत्र के प्राप्तकर्ताओं को स्पष्ट करता है और πρὸς αὐτούς का अर्थ सुरक्षित रखता है।
- source_word: ἔχουσαν οὕτως
  choice: जिसमें यह लिखा था
  rationale: पत्र की विषय-वस्तु आरम्भ कराने वाले यूनानी सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: क्विन्तुस मेम्मियुस और तीतुस मानियुस
  rationale: नामों का यूनानी रूप से देवनागरी लिप्यंतरण किया गया है; हिन्दी सूची में स्पष्टता के लिए ‘और’ जोड़ा गया।
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: रोमियों के पुरनिए
  rationale: πρεσβυταί का मूल अर्थ ‘पुरनिए/बुज़ुर्ग’ है। ‘पुरनिए’ औपचारिक सामुदायिक पद की सम्भावना को ‘बुज़ुर्गों’ से बेहतर व्यक्त करता है, जबकि दूत होने की प्रासंगिक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: यहूदी प्रजा को
  rationale: δήμος के नागरिक-सामुदायिक भाव के लिए ‘प्रजा’ चुना गया है; यह ‘लोगों’ से अधिक औपचारिक है और हिन्दी में सहज भी।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्रारम्भ में χαίρειν अभिवादन का रूढ़ सूत्र है; शाब्दिक ‘आनन्दित रहो’ की अपेक्षा ‘नमस्कार’ हिन्दी पत्र-शैली में सही कार्यात्मक समतुल्य है।
