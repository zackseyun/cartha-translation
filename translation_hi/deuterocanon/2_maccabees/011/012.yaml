  rationale: यह उन लोगों की दशा बताता है जिन्हें युद्ध में घाव लगे थे; हिंदी में ‘घायल’ बिना अनावश्यक संज्ञा जोड़े अर्थ स्पष्ट करता है।
- source_word: γυμνοὶ
  choice: नंगे
  rationale: यूनानी शब्द का सीधा अर्थ ‘नंगे’ है। युद्ध से पलायन के प्रसंग में इसका आशय वस्त्र या युद्ध-सामग्री उतर जाने से भी हो सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: διεσώθησαν / διεσώθη
  choice: बच निकले / बच निकला
  rationale: युद्ध के इस प्रसंग में क्रिया का अर्थ जीवित बचकर निकल जाना है; ‘बच निकलना’ संरक्षण और पलायन दोनों भावों को सहज हिंदी में व्यक्त करता है।
- source_word: αἰσχρῶς
  choice: लज्जाजनक ढंग से
  rationale: क्रियाविशेषण पलायन को अपमानजनक या अनादरपूर्ण ठहराता है; यह चुनाव मूल पाठ के मूल्यांकन को बनाए रखता है।
- source_word: φεύγων
  choice: भागकर
  rationale: वर्तमान कृदन्त बताता है कि लुसियास भागते हुए अथवा भागने के द्वारा बच निकला; ‘भागकर’ हिंदी में इस संबंध को संक्षेप और स्वाभाविकता से व्यक्त करता है।
