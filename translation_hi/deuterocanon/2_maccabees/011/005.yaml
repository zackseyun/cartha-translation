base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/005.yaml
  text: But after entering Judea and approaching Beth-zur[a], a fortified place about five schoeni from Jerusalem[b], he was besieging it.
translation:
  language: hi
  text: परन्तु यहूदिया में प्रवेश करके वह बेत-सूर के पास पहुँचा। यह एक किलेबंद स्थान था, जो यरूशलेम से लगभग पाँच स्कोइन[a] दूर था; वह उसकी घेराबंदी कर रहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्कोइन दूरी की एक प्राचीन इकाई थी; अलग-अलग संदर्भों और क्षेत्रों में इसकी ठीक लंबाई भिन्न होती थी।
    reason: cultural_note
  - marker: b
    text: या, “वह उस पर भारी दबाव डाल रहा था।” यूनानी क्रिया का शाब्दिक अर्थ “दबाना” या “कष्ट देना” है; यहाँ सम्भवतः बेत-सूर के विरुद्ध सैन्य दबाव अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: प्रवेश करके
  rationale: पूर्वकालिक कृदन्त मुख्य कार्रवाई से पहले यहूदिया में प्रवेश को दर्शाता है; यह हिन्दी में स्वाभाविक रूप से क्रम बनाए रखता है।
- source_word: συνεγγίσας
  choice: के पास पहुँचा
  rationale: यह बेत-सूर की ओर बढ़कर उसके निकट पहुँचने को व्यक्त करता है।
- source_word: Βεθσουρῶν
  choice: बेत-सूर
  rationale: स्थान-नाम के सामी रूप Beth-zur को देवनागरी में पहचानने योग्य ढंग से प्रस्तुत किया गया है।
- source_word: ἐρυμνῷ χωρίῳ
  choice: एक किलेबंद स्थान
  rationale: ἐρυμνός की सुदृढ़ अथवा रक्षित होने की धारणा और χωρίον के सामान्य 'स्थान'—दोनों को बनाए रखता है, बिना इसे अनिवार्यतः नगर या दुर्ग कहे।
- source_word: ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: लगभग पाँच स्कोइन दूर था
  rationale: ὡσεὶ की अनुमानसूचकता को 'लगभग' से व्यक्त किया गया है और बदलती लंबाई वाली प्राचीन इकाई को आधुनिक माप में बदलकर झूठी सटीकता नहीं दी गई।
- source_word: τοῦτο
  choice: उसकी
  rationale: सर्वनाम का संकेत बेत-सूर/उस किलेबंद स्थान की ओर है; हिन्दी में संबंधसूचक रूप वाक्य को स्वाभाविक बनाता है।
- source_word: ἔθλιβε
  choice: उसकी घेराबंदी कर रहा था
  rationale: θλίβω का मूल अर्थ दबाना या कष्ट देना है, पर यहाँ सैन्य संदर्भ में किसी किलेबंद स्थान पर लगातार दबाव डालना घेराबंदी को सूचित करता है; अपूर्णकाल जारी कार्रवाई को दर्शाता है।
