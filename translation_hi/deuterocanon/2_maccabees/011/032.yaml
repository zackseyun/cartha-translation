lexical_decisions:
- source_word: πέπομφα
  choice: मैंने ... भेजा है
  rationale: πέμπω का पूर्णकालिक सक्रिय रूप है; कार्य पूरा हो चुका है और उसका वर्तमान प्रसंग से संबंध बना हुआ है, जिसे हिन्दी का ‘भेजा है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ तीव्र विरोध नहीं, बल्कि पत्र के विचार को आगे बढ़ाने वाला हल्का संयोजक है।
- source_word: καὶ
  choice: भी
  rationale: यह मेनेलाउस को एक अतिरिक्त दूत अथवा समझाने के अतिरिक्त साधन के रूप में प्रस्तुत करता है।
- source_word: τὸν Μενέλαον
  choice: मेनेलाउस
  rationale: व्यक्तिवाचक नाम का देवनागरी में लिप्यंतरण किया गया है।
- source_word: παρακαλέσοντα
  choice: प्रोत्साहित करने के लिए
  rationale: भविष्यत् सक्रिय कृदन्त यहाँ भेजने का उद्देश्य व्यक्त करता है। παρακαλέω में प्रोत्साहन, आग्रह और अपील के अर्थ समाहित हो सकते हैं; मुख्य पाठ में स्वाभाविक और व्यापक ‘प्रोत्साहित’ रखा गया है तथा विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह बहुवचन संबोधन है और पत्र के प्राप्तकर्ताओं को संदर्भित करता है; वर्तमान हिन्दी में ‘तुम्हें’ स्पष्ट और स्वाभाविक है।
