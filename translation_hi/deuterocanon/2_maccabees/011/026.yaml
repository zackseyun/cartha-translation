  yaml_path: translation/deuterocanon/2_maccabees/011/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention, they may be encouraged and may gladly attend to the securing of their own affairs.
translation:
  language: hi
  text: इसलिए तुम अच्छा करोगे यदि उनके पास संदेश भेजकर उन्हें सद्भाव के आश्वासन दोगे[a], ताकि हमारी मंशा जानकर वे उत्साहित हों और प्रसन्नतापूर्वक अपने मामलों को सँभालते रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, ‘दाहिने हाथ देकर’; यह विश्वास दिलाने या सद्भाव की प्रतिज्ञा देने का राजनयिक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ ... ποιήσεις
  choice: तुम अच्छा करोगे
  rationale: यह यूनानी प्रयोग केवल भविष्यवाणी नहीं, बल्कि विनम्र सलाह या आग्रह व्यक्त करता है; हिन्दी में यह स्वाभाविक रूप से वही भाव रखता है।
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: उनके पास संदेश भेजकर
  rationale: क्रिया भेजने की कार्रवाई बताती है, पर दूतों का स्पष्ट उल्लेख नहीं करती। ‘संदेश भेजकर’ हिन्दी में स्वाभाविक है और अनावश्यक विशिष्टीकरण से बचता है।
- source_word: δοὺς δεξιάς
  choice: उन्हें विश्वास का आश्वासन दोगे
  rationale: शाब्दिक अर्थ ‘दाहिने हाथ देना’ है, पर राजनयिक प्रसंग में यह भरोसे, सुरक्षा या सद्भाव की प्रतिज्ञा देने का मुहावरा है। ‘विश्वास का आश्वासन’ उसका व्यावहारिक अर्थ स्पष्ट करता है।
- source_word: προαίρεσιν
  choice: मंशा
  rationale: यह सोच-समझकर ठहराए गए इरादे या उद्देश्य को दर्शाता है। ‘मंशा’ उस व्यापक अर्थ को रखती है और अपने आप ‘सद्भावना’ का सकारात्मक भाव नहीं जोड़ती।
- source_word: εὔθυμοί
  choice: उनका हौसला बढ़े
  rationale: विशेषण अच्छे मनोबल, साहस या उत्साह की दशा बताता है। परिणामवाचक उपवाक्य में ‘हौसला बढ़े’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἡδέως διαγίνωνται
  choice: प्रसन्नतापूर्वक ... लगे रहें
  rationale: यहाँ आशय सुख से समय बिताने मात्र का नहीं, बल्कि अनुकूल मन से निरंतर किसी काम में लगे रहने का है।
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: अपने हितों की देखभाल में
  rationale: ἀντίληψις सहायता, संभालने या देखभाल करने का भाव रखता है। ‘अपने हितों की देखभाल’ निजी मामलों, संपत्ति और व्यावहारिक हितों को समेटती है, बिना अर्थ को केवल संपत्ति तक सीमित किए।
