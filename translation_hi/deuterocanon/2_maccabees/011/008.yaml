base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/008.yaml
  text: And there[a], when they were near Jerusalem, a horseman appeared going before them[b], clothed in white and brandishing golden armor.
translation:
  language: hi
  text: और वहीं, जब वे यरूशलेम के निकट थे, एक घुड़सवार[b] उनके आगे बढ़ता हुआ[a] दिखाई दिया। वह श्वेत वस्त्र पहने था और स्वर्णिम पूरी युद्ध-सज्जा भाँज रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे आगे था।” यूनानी कृदन्त केवल उनके आगे होने का अर्थ भी दे सकता है; वह अनिवार्य रूप से नेतृत्व या सेनापतित्व व्यक्त नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: पाठ घुड़सवार की पहचान स्पष्ट रूप से नहीं बताता। वर्णन से किसी स्वर्गीय रक्षक का संकेत मिल सकता है, पर अनुवाद यूनानी पाठ से अधिक निश्चित बात नहीं कहता।
    reason: cultural_note
lexical_decisions:
- source_word: αὐτόθι
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण है और पहले उल्लिखित स्थान की ओर संकेत करता है; इसे केवल कालवाचक ‘तब’ नहीं बनाया गया।
- source_word: πρὸς τοῖς Ἱεροσολύμοις
  choice: यरूशलेम के निकट
  rationale: यहाँ πρός के साथ दत्तिव निकटता व्यक्त करता है; हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: ὄντων
  choice: जब वे ... थे
  rationale: सम्बन्धवाचक निरपेक्ष रचना को हिन्दी की स्वाभाविक कालवाचक उपवाक्य-रचना में व्यक्त किया गया है।
- source_word: ἐφάνη
  choice: दिखाई दिया
  rationale: यह दृश्य रूप से प्रकट होने का भाव रखता है; ‘दिखाई दिया’ आकस्मिक दृश्यता को सहज हिन्दी में व्यक्त करता है।
- source_word: προηγούμενος αὐτῶν
  choice: उनके आगे चलता हुआ
  rationale: यह उनके सामने होने और आगे बढ़ने का चित्र सुरक्षित रखता है, पर उसे स्पष्ट रूप से सेनापति या अगुआ घोषित नहीं करता।
- source_word: ἔφιππος
  choice: एक घुड़सवार
  rationale: यहाँ शब्द संज्ञा के रूप में प्रयुक्त है; ‘घुड़सवार’ उसका स्पष्ट और संक्षिप्त हिन्दी समतुल्य है।
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: श्वेत वस्त्र पहने था
  rationale: यह स्पष्ट सफेद परिधान का वर्णन करता है; ‘श्वेत वस्त्र’ गरिमापूर्ण किन्तु सुबोध है।
- source_word: πανοπλίαν χρυσῆν
  choice: सोने का पूरा युद्ध-कवच
  rationale: πανοπλία केवल एक कवच-खंड नहीं बल्कि पूर्ण युद्ध-सज्जा को सूचित करता है; ‘पूरा युद्ध-कवच’ उस व्यापकता को बनाए रखता है।
- source_word: κραδαίνων
  choice: लहरा रहा था
  rationale: क्रिया जोरदार ढंग से हिलाने या भाँजने का बोध देती है। युद्ध-कवच के साथ मूल यूनानी की असामान्य परन्तु सजीव छवि को ‘लहरा रहा था’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: प्रकट हुए घुड़सवार की पहचान
  choice: उसे केवल ‘एक घुड़सवार’ के रूप में वर्णित किया गया है।
  alternative: उसे स्वर्गदूत, स्वर्गीय योद्धा या परमेश्वर का प्रत्यक्ष रूप कहना।
  rationale: यूनानी पाठ आकृति का स्वरूप बताता है, पर उसकी पहचान स्पष्ट नहीं करता। इसलिए अनुवाद पाठक को स्वर्गीय रक्षक होने का संकेत ग्रहण करने देता है, किन्तु उसे पाठ में जोड़ता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘श्वेत वस्त्र’ और ‘युद्ध-कवच’ कथा के दर्शनात्मक तथा सैनिक स्वर को बनाए रखते हैं; घुड़सवार की पहचान जानबूझकर अनिर्धारित छोड़ी गई है।
