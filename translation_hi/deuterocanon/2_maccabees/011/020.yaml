translation:
  language: hi
  text: पर इन बातों के विषय में विस्तार से मैंने इन लोगों और मेरी ओर के लोगों—दोनों को आदेश दिया है कि वे तुमसे बातचीत करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: पर इन बातों के विषय में
  rationale: ὑπέρ + संबंधकारक यहाँ ‘के विषय में’ का अर्थ देता है; δέ को प्रसंग के हल्के संक्रमण के रूप में ‘पर’ से व्यक्त किया गया है।
- source_word: κατὰ μέρος
  choice: विस्तार से
  rationale: यह मुहावरा विषयों को अलग-अलग या बिंदुवार ढंग से समझाने का भाव रखता है; ‘विस्तार से’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐντέταλμαι
  choice: मैंने ... आदेश दिया है
  rationale: पूर्णकालिक रूप पहले दिए गए ऐसे आधिकारिक निर्देश को दर्शाता है जिसका प्रभाव अभी बना हुआ है।
- source_word: τούτους τε καὶ τοὺς παρʼ ἐμοῦ
  choice: इन लोगों और अपनी ओर के लोगों—दोनों को
  rationale: τε ... καί से जुड़े दोनों समूहों को ‘दोनों’ द्वारा स्पष्ट किया गया है। ‘अपनी ओर के लोग’ यूनानी की अस्पष्टता बनाए रखता है और उन्हें निश्चित रूप से ‘भेजे हुए दूत’ नहीं कहता।
- source_word: διαλεχθῆναι ὑμῖν
  choice: तुमसे बातचीत करने
  rationale: διαλέγομαι का अर्थ संवाद, विचार-विमर्श या बातचीत करना हो सकता है; ‘बातचीत’ इस अर्थ-सीमा को सहज हिन्दी में पर्याप्त रूप से बनाए रखता है।
