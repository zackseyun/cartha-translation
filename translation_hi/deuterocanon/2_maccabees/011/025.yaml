  yaml_path: translation/deuterocanon/2_maccabees/011/025.yaml
  text: Therefore[a], since we also choose that this nation should be free from disturbance, we decide that the temple should be restored to them, and that they should live according to the customs of their ancestors.
translation:
  language: hi
  text: अतः, हम यह भी चाहते हैं कि यह राष्ट्र उपद्रव से मुक्त रहे; इसलिए हम निर्णय करते हैं कि मन्दिर को उनके लिए पुनः बहाल किया जाए और वे अपने पूर्वजों के समय में प्रचलित प्रथाओं के अनुसार अपने सामुदायिक जीवन को व्यवस्थित करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱρούμενοι
  choice: हम यह भी चाहते हैं
  rationale: मध्यवाच्य कृदन्त यहाँ किसी नीति को चुनने या पसन्द करने की इच्छा व्यक्त करता है। ‘चाहते हैं’ हिन्दी में स्वाभाविक रहते हुए इसकी संकल्पात्मक शक्ति को बनाए रखता है।
- source_word: ἐκτὸς ταραχῆς
  choice: उपद्रव से मुक्त
  rationale: यह पद नागरिक अशान्ति या हलचल से अलग रहने की दशा बताता है; ‘उपद्रव से मुक्त’ प्रशासनिक-राजनीतिक भाव को स्पष्ट रखता है।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: राजकीय-प्रशासनिक सन्दर्भ में यहूदी लोगों को एक विशिष्ट सामूहिक-राष्ट्रीय समुदाय के रूप में सूचित करता है।
- source_word: κρίνομεν
  choice: हमने निर्णय किया है
  rationale: क्रिया का अर्थ न्याय करना, निर्धारित करना या निर्णय लेना हो सकता है। पत्र के राजकीय सन्दर्भ में ‘निर्णय किया है’ उपयुक्त है और इसे अनावश्यक रूप से तकनीकी ‘राजाज्ञा’ नहीं बनाता।
- source_word: τὸ ἱερὸν
  choice: मन्दिर
  rationale: शाब्दिक अर्थ पवित्र स्थान है, पर यहाँ स्वाभाविक संकेत यरूशलेम के मन्दिर की ओर है।
- source_word: ἀποκατασταθῆναι
  choice: उन्हें फिर से सौंप दिया जाए
  rationale: निष्क्रिय अनन्तरूप पहले की स्थिति अथवा अधिकार में बहाल किए जाने को व्यक्त करता है। सन्दर्भ में मन्दिर को यहूदियों के लिए पुनः स्थापित/लौटाए जाने का भाव है; यह हिन्दी उस सम्बन्धसूचक αὐτοῖς को भी स्पष्ट करती है।
- source_word: πολιτεύεσθαι
  choice: अपना सामुदायिक जीवन चलाएँ
  rationale: क्रिया नागरिक अथवा सामुदायिक निकाय के रूप में जीवन व्यवस्थित करने को सूचित करती है। यह अनुवाद केवल निजी ‘जीवन बिताने’ से व्यापक है, पर राजनीतिक स्वाधीन शासन का दावा नहीं करता।
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: अपने पूर्वजों के समय की प्रथाओं के अनुसार
  rationale: ἐπὶ τῶν προγόνων में पूर्वजों के काल का वास्तविक समयगत भाव है। यह रूप केवल ‘पैतृक प्रथाएँ’ कहने की तुलना में उस सूक्ष्मता को अधिक प्रत्यक्ष रखता है।
theological_decisions:
- issue: πολιτεύεσθαι का यहूदी व्यवस्था और प्रथाओं से सम्बन्धित दायरा
  choice: इसे पूर्वजों की प्रथाओं के अनुसार व्यवस्थित सामुदायिक जीवन के व्यापक अर्थ में प्रस्तुत किया गया है।
  alternative: वे अपने पूर्वजों की प्रथाओं के अनुसार अपना शासन चलाएँ
  rationale: क्रिया में नागरिक भाव हो सकता है, पर निकटवर्ती ‘प्रथाओं के अनुसार’ और मन्दिर की बहाली का सन्दर्भ धार्मिक-सामुदायिक जीवन की अनुमति दिखाता है, राजनीतिक स्वतंत्रता का स्पष्ट अनुदान नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का औपचारिक किन्तु सहज राजकीय-पत्रीय स्वर। ‘मन्दिर’ और ‘राष्ट्र’ सामान्य पाठक के लिए स्पष्ट हैं। ‘सामुदायिक जीवन चलाएँ’ πολιτεύεσθαι की नागरिक-सामूहिक व्यापकता को बनाए रखता है। पाठ में कोई पादटिप्पणी नहीं रखी गई, क्योंकि समयगत सूक्ष्मता मुख्य अनुवाद में ही व्यक्त है।
