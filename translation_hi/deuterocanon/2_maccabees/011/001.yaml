base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/001.yaml
  text: But after a very short time[a], Lysias, the king’s guardian and kinsman and administrator of affairs, taking the events very hard[c][b],
translation:
  language: hi
  text: परन्तु बहुत ही थोड़े समय के बाद,[a] लूसियास—जो राजा का संरक्षक,[b] उसका संबंधी और राजकाज का प्रशासक था—घटी हुई घटनाओं से बहुत व्यथित होकर,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “थोड़े समय के बाद—वास्तव में, बहुत ही थोड़े अंतराल के बाद।” यूनानी अभिव्यक्ति बहुत संक्षिप्त समय पर विशेष बल देती है।
    reason: lexical_alternative
  - marker: b
    text: “संरक्षक” का अनुवाद “राजप्रतिनिधि” या “प्रबंधक” भी किया जा सकता है; अर्थ इस बात पर निर्भर करता है कि लूसियास के पद को कितना औपचारिक समझा जाए।
    reason: alternative_reading
  - marker: c
    text: यह वाक्य अगले पद में आगे बढ़ता है; यूनानी की तरह यह पद भी कृदन्तीय उपवाक्य पर अधूरा समाप्त होता है।
    reason: cross_reference
lexical_decisions:
- source_word: Μετʼ ὀλίγον ... παντελῶς χρονίσκον
  choice: बहुत ही थोड़े समय के बाद
  rationale: यह सहज आधुनिक हिन्दी में समयांतराल की अत्यन्त संक्षिप्तता व्यक्त करता है; παντελῶς और लघुतासूचक χρονίσκον का बल भी बना रहता है।
- source_word: ἐπίτροπος
  choice: संरक्षक
  rationale: राजकीय संदर्भ में यह किसी सौंपे गए अभिभावकीय या प्रतिनिधिक दायित्व को दर्शाता है। ‘संरक्षक’ मूल अर्थ बनाए रखता है और ‘राजप्रतिनिधि’ जैसी अधिक निश्चित संवैधानिक उपाधि आरोपित नहीं करता।
- source_word: συγγενής
  choice: संबंधी
  rationale: यह पारिवारिक संबंध का स्वाभाविक और वर्तमान हिन्दी रूप है।
- source_word: ἐπὶ τῶν πραγμάτων
  choice: राजकाज का प्रशासक
  rationale: यह राज्य के मामलों पर आधिकारिक उत्तरदायित्व व्यक्त करता है और किसी अत्यधिक तकनीकी पदनाम को आरोपित नहीं करता।
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: घटी हुई घटनाओं से बहुत व्यथित होकर
  rationale: यह यूनानी मुहावरे के गहरे भावनात्मक कष्ट को स्वाभाविक हिन्दी में व्यक्त करता है और γεγονόσι का संकेत हाल में घट चुकी बातों की ओर बनाए रखता है।
