- source_word: οὐδάμως
  choice: तनिक भी नहीं
  rationale: यह प्रबल निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπιλογιζόμενος
  choice: विचार नहीं करता था
  rationale: यह कृदंत सोच-विचार करके किसी बात को ध्यान में रखने या उसका आकलन करने का भाव देता है; हिन्दी वाक्य में काल और प्रवाह के लिए इसे क्रियात्मक रूप दिया गया है।
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: परमेश्वर का सामर्थ्य
  rationale: κράτος यहाँ सैन्य संसाधनों के विपरीत प्रभावकारी बल या सामर्थ्य को दर्शाता है, न कि अनिवार्य रूप से शासन या प्रभुत्व को।
- source_word: πεφρονηματισμένος
  choice: घमंड से फूला हुआ
  rationale: यह रूप गर्वपूर्ण आत्म-महत्त्व की बनी हुई अवस्था व्यक्त करता है; यह हिन्दी पद उस अहंकारी फुलाव को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: μυριάσιν τῶν πεζῶν
  choice: पैदल सैनिकों की दसियों हज़ार संख्या
  rationale: μυριάς का अर्थ दस हज़ार की इकाई या सामान्यतः अत्यन्त बड़ी संख्या हो सकता है। यह अनुवाद संख्यात्मक स्वर बनाए रखते हुए अनावश्यक सटीकता से बचता है।
- source_word: χιλιάσι τῶν ἱππέων
  choice: हज़ारों घुड़सवार
  rationale: यह मूल के बहुवचन संख्यात्मक भाव और सवार सैन्य-दल, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: अस्सी हाथी
  rationale: यह मूल पाठ की स्पष्ट संख्या को सीधे और स्वाभाविक रूप में प्रस्तुत करता है।
theological_decisions:
