  choice: परमेश्वर का सामर्थ्य
  alternative: परमेश्वर की शक्ति; परमेश्वर का प्रभुत्व
  rationale: यहाँ वाक्य परमेश्वर के प्रभावकारी बल की तुलना मानवीय सैन्य साधनों से करता है। ‘सामर्थ्य’ इस विरोध को बनाए रखता है और शासन-संबंधी कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल यूनानी के कृदंतीय ढाँचे को स्वाभाविक हिन्दी वाक्य में बदला गया है, पर परमेश्वर के सामर्थ्य और मानवीय सैन्य घमंड के बीच का विरोध यथावत रखा गया है।
