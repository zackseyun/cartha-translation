  text: not at all taking into account the might of God[b][a], but puffed up by the tens of thousands of foot soldiers and the thousands of horsemen and the eighty elephants.
translation:
  language: hi
  text: वह परमेश्वर के सामर्थ्य को तनिक भी ध्यान में नहीं रखता था[a], बल्कि दसियों हज़ार पैदल सैनिकों[b], हज़ारों घुड़सवारों और अस्सी हाथियों पर इतराता हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की शक्ति को तनिक भी ध्यान में नहीं रखता था।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “पैदल सैनिकों की दस-दस हज़ार [टुकड़ियाँ]” है; इसका अर्थ दसियों हज़ार, या अधिक सामान्य रूप से बहुत बड़ी संख्या, हो सकता है।
    reason: lexical_alternative
