translation:
  language: hi
  text: परन्तु सब कुछ देखने वाले प्रभु, इस्राएल के परमेश्वर ने उस पर एक असाध्य और अदृश्य प्रहार किया[a]। जैसे ही उसने अपनी बात समाप्त की, उसकी अंतड़ियों की असाध्य पीड़ा और उसके भीतरी अंगों की कटु यातनाओं ने उसे आ घेरा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे एक असाध्य और अदृश्य व्याधि से पीड़ित किया।” यूनानी πληγή का अर्थ प्रहार, चोट, अथवा महामारी या व्याधि-जैसी विपत्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अंतड़ियों की असाध्य पीड़ा और भीतरी अंगों की कटु यातनाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παντεπόπτης
  choice: सब कुछ देखने वाले
  rationale: यूनानी विशेषण का अर्थ सब कुछ देखने वाला है; यह सहज हिन्दी में दैवी सर्वदृष्टि का भाव बनाए रखता है।
- source_word: κύριος
  choice: प्रभु
  rationale: यहाँ यह परमेश्वर की उपाधि है और अगले पदबंध ‘इस्राएल के परमेश्वर’ के समानाधिकरण में है।
- source_word: ἐπάταξεν
  choice: चोट मारी
  rationale: क्रिया का मूल अर्थ मारना या प्रहार करना है; ‘चोट मारी’ πληγή के साथ आने वाली प्रहार की छवि को बनाए रखता है।
- source_word: ἀνιάτῳ καὶ ἀοράτῳ πληγῇ
  choice: ऐसी चोट ... जो असाध्य और अदृश्य थी
  rationale: दोनों विशेषणों को सुरक्षित रखते हुए πληγή की ‘चोट/प्रहार’ वाली सम्भावना मुख्य पाठ में रखी गई है; इसकी महामारी या व्याधि-सदृश अर्थ-सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἄρτι ... καταλήξαντος τὸν λόγον
  choice: वह अपनी बात पूरी ही कर रहा था कि
  rationale: यह रचना भाषण समाप्त होने और दण्ड के तुरन्त आरम्भ होने का निकट काल-संबंध स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἔλαβεν αὐτὸν
  choice: उसे जकड़ लिया
  rationale: पीड़ा के अचानक उस पर अधिकार कर लेने का सजीव अर्थ व्यक्त होता है।
- source_word: ἀνήκεστος
  choice: असाध्य
  rationale: शब्द का मूल अर्थ जिसका उपचार या निवारण न हो है; विशेषण को ‘पीड़ा’ के साथ सीधे और सटीक रूप में रखा गया है।
- source_word: τῶν σπλάγχνων ἀλγηδών
  choice: उसकी आँतों में ... पीड़ा
  rationale: σπλάγχνα के शारीरिक और आन्तरिक अर्थ को साधारण आधुनिक हिन्दी में ठोस रूप से व्यक्त करता है।
- source_word: πικραὶ τῶν ἔνδον βάσανοι
  choice: उसके भीतर के अंगों में घोर यातनाएँ
  rationale: ‘घोर’ यहाँ πικραί की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि आन्तरिक शारीरिक कष्ट स्पष्ट बना रहता है।
theological_decisions:
- issue: अन्तियोकुस की व्याधि में परमेश्वर की प्रत्यक्ष भूमिका
  choice: 'परमेश्वर को सीधे कर्ता के रूप में रखा गया है: ‘ने उसे ... चोट मारी।’'
  alternative: परमेश्वर ने उसे पीड़ित होने दिया।
  rationale: यूनानी पाठ में ‘सब कुछ देखने वाले प्रभु, इस्राएल के परमेश्वर’ ही ἐπάταξεν के स्पष्ट कर्ता हैं; इसलिए दैवी न्याय के प्रत्यक्ष कथन को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य। ‘परन्तु’, ‘प्रभु’ और ‘परमेश्वर’ बाइबलीय प्रसंग के अनुकूल हैं; रोग और पीड़ा की शारीरिक तीव्रता को बिना अनावश्यक चिकित्सकीय शब्दावली के स्पष्ट रखा गया है।
