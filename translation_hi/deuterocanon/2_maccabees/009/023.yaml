- source_word: καὶ ὁ πατήρ
  choice: मेरे पिता भी
  rationale: सन्दर्भ में पिता वक्ता के अपने पिता हैं। καί का समावेशी बल ‘भी’ से सुरक्षित रहता है।
- source_word: καθʼ οὓς καιρούς
  choice: जब-जब
  rationale: यह पद अलग-अलग अवसरों पर बार-बार होने वाली बात बताता है; ‘जब-जब’ आधुनिक हिन्दी में उसका वितरणात्मक अर्थ स्पष्ट करता है।
- source_word: εἰς τοὺς ἄνω τόπους
  choice: ऊपरी प्रदेशों में
  rationale: ‘ऊपरी’ मूल स्थान-सूचक अर्थ को बनाए रखता है, जबकि ‘प्रदेश’ अस्पष्ट भूभागों के लिए स्वाभाविक है और उन्हें अनावश्यक रूप से पहाड़ी या अंतर्देशीय नहीं ठहराता।
- source_word: ἐστρατοπέδευσεν
  choice: सैन्य अभियान चलाते थे
  rationale: क्रिया का शाब्दिक अर्थ ‘पड़ाव डालना’ हो सकता है, पर राजकीय सैन्य गतिविधि के इस सन्दर्भ में व्यापक अभियानगत अर्थ अधिक उपयुक्त है।
- source_word: ἀνέδειξεν
  choice: नियुक्त कर देते थे
  rationale: यहाँ क्रिया किसी व्यक्ति को औपचारिक रूप से उत्तराधिकारी ठहराने को सूचित करती है; ‘नियुक्त’ उस आधिकारिक भाव को स्पष्ट रखता है।
- source_word: τὸν διαδεξάμενον
  choice: अपने उत्तराधिकारी को
  rationale: कृदन्त उस व्यक्ति को दर्शाता है जो पिता के बाद पद ग्रहण करता। हिन्दी में ‘अपने उत्तराधिकारी’ संक्षिप्त, स्वाभाविक और अर्थतः स्पष्ट है।
