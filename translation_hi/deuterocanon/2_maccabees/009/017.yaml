base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/017.yaml
  text: And besides these things[a], he would also become a Jew and would visit every inhabited place[b], proclaiming the power of God.
translation:
  language: hi
  text: इन बातों के अतिरिक्त, वह यहूदी भी बन जाएगा[a] और हर बसे हुए स्थान में जाकर परमेश्वर के सामर्थ्य[b] की घोषणा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: ‘वह यहूदी भी होगा।’ यहाँ सम्भवतः आशय जातीय मूल बताना नहीं, बल्कि यहूदी पहचान या निष्ठा अपनाना है।'
    reason: lexical_alternative
  - marker: b
    text: ‘परमेश्वर के सामर्थ्य’ का अनुवाद ‘परमेश्वर के पराक्रम’ या ‘परमेश्वर के प्रभुत्व’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: इन बातों के अतिरिक्त
  rationale: यह पद पिछले वचनों में एक और प्रतिज्ञा जोड़ता है; यह प्रयोग यूनानी पदबंध के योगात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰουδαῖος ἔσεσθαι
  choice: वह यहूदी भी बन जाएगा
  rationale: सन्दर्भ में यह जातीय मूल का दावा नहीं, बल्कि यहूदी पहचान या निष्ठा अपनाने की प्रतिज्ञा है। ‘बन जाएगा’ इस परिवर्तन के भाव को स्पष्ट रखता है, पर बाद की किसी तकनीकी धर्मान्तरण-संज्ञा को आरोपित नहीं करता।
- source_word: πάντα τόπον οἰκητὴν
  choice: हर बसे हुए स्थान में
  rationale: οἰκητήν का आशय आबाद या बसा हुआ है। ‘हर बसे हुए स्थान’ वितरक πάντα और स्थानवाचक τόπον—दोनों का स्वाभाविक हिन्दी रूप है।
- source_word: ἐπελεύσεσθαι
  choice: जाकर
  rationale: यहाँ विभिन्न स्थानों में पहुँचकर सार्वजनिक घोषणा करने का भाव है। ‘जाकर’ गति को सहज रूप में व्यक्त करता है और अनावश्यक रूप से ‘भ्रमण’ या ‘दौरा’ जैसा विशिष्ट अर्थ नहीं जोड़ता।
- source_word: καταγγέλλοντα
  choice: घोषणा करेगा
  rationale: यह क्रिया सार्वजनिक रूप से बताने या घोषित करने का भाव रखती है; ‘घोषणा’ पद के औपचारिक और सार्वजनिक स्वर के अनुकूल है।
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: परमेश्वर का सामर्थ्य
  rationale: κράτος शक्ति, पराक्रम या प्रभुत्व का बोध करा सकता है। इस सन्दर्भ में ‘सामर्थ्य’ स्पष्ट और गरिमापूर्ण है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अन्तियोकुस की ‘यहूदी बनने’ की प्रतिज्ञा का अर्थ
  choice: यहूदी पहचान या निष्ठा अपनाने की प्रतिज्ञा
  alternative: केवल यहूदियों का पक्ष लेना, अथवा औपचारिक पहचान अपनाए बिना यहूदियों की तरह रहना
  rationale: Ἰουδαῖος ἔσεσθαι की भाषा केवल मैत्री या पक्षधरता से अधिक प्रबल है। अनुवाद उसी प्रबलता को रखता है, किन्तु बाद की धार्मिक परम्पराओं की कोई तकनीकी धर्मान्तरण-धारणा इसमें नहीं जोड़ता।
- issue: κράτος में शक्ति और प्रभुत्व की अर्थ-छाया
  choice: सामर्थ्य
  alternative: पराक्रम या प्रभुत्व
  rationale: दिव्य श्रेष्ठता स्वीकार करने के प्रसंग में ‘सामर्थ्य’ व्यापक और स्वाभाविक है; फिर भी यूनानी शब्द में निहित ‘प्रभुत्व’ की सम्भावना को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक-वर्णनात्मक स्वर रखा गया है। वाक्य यूनानी की योगात्मक संरचना और भविष्यकालीन प्रतिज्ञा को बनाए रखता है। पादटिप्पणी [a] को उसी पदबंध पर लगाया गया है जिससे उसका वैकल्पिक अनुवाद सम्बन्धित है।
