base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/028.yaml
  text: So then the murderer and blasphemer[a], after suffering the worst things, just as he had treated others, came to a most pitiable end in a foreign land among the mountains.
translation:
  language: hi
  text: इसलिए वह हत्यारा और परमेश्वर की निंदा करने वाला[a], जैसा उसने दूसरों के साथ किया था वैसा ही सबसे भयंकर दुःख भोगने के बाद, पराए देश में पहाड़ों के बीच अत्यन्त दयनीय मृत्यु को प्राप्त हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उपलब्ध यूनानी साक्षी में वाक्य का अन्तिम शब्द पंक्ति के अन्त पर κατέ- के रूप में टूट गया है; पर आगे का स्पष्ट आशय उसके अन्त तक पहुँचने या मरने का है, जिसे अनुवाद में व्यक्त किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀνδροφόνος
  choice: हत्यारा
  rationale: यह यौगिक शब्द मनुष्यों की हत्या करनेवाले को दर्शाता है। ‘हत्यारा’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग की नैतिक निन्दा को स्पष्ट रखता है।
- source_word: βλάσφημος
  choice: परमेश्वर की निन्दा करनेवाला
  rationale: प्रसंग में यह शब्द परमेश्वर के विरुद्ध अपमानजनक और अधर्मी वचन बोलनेवाले के अर्थ में है। स्पष्ट हिन्दी वाक्यांश धार्मिक आशय को सुरक्षित रखता है।
- source_word: τὰ χείριστα παθών
  choice: सबसे भयंकर दुःख भोगकर
  rationale: यह अनुवाद χείριστα के अतिशयोक्तिपरक बल को बनाए रखता है, पर उन दुःखों का स्वरूप पाठ से अधिक निश्चित नहीं करता।
- source_word: ὡς ἑτέρους διέθηκεν
  choice: जैसा व्यवहार उसने दूसरों के साथ किया था
  rationale: यह वाक्यांश उसके अपने कष्ट और दूसरों के प्रति उसके व्यवहार के बीच प्रतिफलात्मक तुलना को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐπὶ ξένης
  choice: पराए देश में
  rationale: यह घर से दूर, विदेशी भूमि पर मृत्यु होने का भाव संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τοῖς ὄρεσιν
  choice: पहाड़ों के बीच
  rationale: यह पर्वतीय स्थान का बोध देता है और यूनानी बहुवचन को सहज हिन्दी में व्यक्त करता है।
- source_word: οἰκτίστῳ μόρῳ
  choice: अत्यन्त दयनीय मृत्यु
  rationale: μόρος यहाँ विनाशकारी नियति अथवा मृत्यु को और οἰκτίστῳ उसकी चरम दयनीयता को व्यक्त करता है; यह चयन दोनों भावों को स्पष्ट रखता है।
- source_word: κατέ-
  choice: मृत्यु मरा
  rationale: दिए गए साक्षी में शब्द पंक्ति के अन्त पर अधूरा है, किंतु वाक्य का स्पष्ट जारी अर्थ उसके अन्त या मृत्यु तक पहुँचने का है; हिन्दी में ‘मृत्यु मरा’ परिणाम को सीधा व्यक्त करता है।
theological_decisions:
- issue: अन्तियोकुस की मृत्यु का प्रतिफलात्मक नैतिक चित्रण
  choice: उसने दूसरों के साथ जैसा व्यवहार किया था, वैसा ही भयंकर दुःख स्वयं भोगा—इस तुलना को स्पष्ट रखा गया है।
  alternative: केवल उसकी मृत्यु का वर्णन करना और प्रतिफलात्मक तुलना को हल्का कर देना।
  rationale: ὡς ἑτέρους διέθηκεν पदबंध उचित प्रतिफल या न्याय की धारणा के लिए केंद्रीय है; इसे अनुवाद में दबाना नहीं चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और कथात्मक रूप अपनाया गया है। ‘परमेश्वर की निन्दा करनेवाला’ धार्मिक आशय को सामान्य पाठक के लिए स्पष्ट करता है; प्रतिफलात्मक तुलना और मूल की कठोर नैतिक ध्वनि सुरक्षित रखी गई है।
