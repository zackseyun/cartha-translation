  yaml_path: translation/deuterocanon/2_maccabees/009/013.yaml
  text: 'But the polluted man kept praying to the Master who would no longer have mercy on him[b][a], saying this:'
translation:
  language: hi
  text: 'पर वह अपवित्र[a] मनुष्य उस स्वामी[b] से लगातार प्रार्थना करता रहा, जो अब उस पर दया नहीं करनेवाला था। वह इस प्रकार कह रहा था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कलुषित।’ यूनानी विशेषण में नैतिक अथवा धार्मिक अशुद्धता और घृणितता का प्रबल भाव है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘स्वामी’ (δεσπότης) है, न कि अधिक सामान्य ‘प्रभु’ (κύριος)।
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὔχετο
  choice: लगातार प्रार्थना करता रहा
  rationale: अपूर्ण भूतकाल क्रिया जारी या बार-बार की गई प्रार्थना का भाव देती है; यह रूप उस कालगत पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μιερὸς
  choice: अपवित्र मनुष्य
  rationale: संज्ञा के रूप में प्रयुक्त यह विशेषण नैतिक अथवा धार्मिक अशुद्धता और घृणितता का प्रबल भाव रखता है। ‘अपवित्र’ इस अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है, और ‘मनुष्य’ हिन्दी में आवश्यक रूप से जोड़ा गया है।
- source_word: δεσπότην
  choice: स्वामी
  rationale: δεσπότης पूर्ण अधिकार और अधिपत्य पर बल देता है तथा यहाँ अधिक सामान्य κύριος प्रयुक्त नहीं हुआ है। ‘स्वामी’ इस lexical भेद को बनाए रखता है।
- source_word: οὐκέτι
  choice: अब ... नहीं
  rationale: यह समय-संबंधी निषेध बताता है कि दया आगे मिलनेवाली नहीं थी।
- source_word: ἐλεήσοντα
  choice: दया नहीं करनेवाला था
  rationale: भविष्यकालिक कृदन्त आगामी दया की अनुपस्थिति व्यक्त करता है; यह हिन्दी रूप उस भाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: οὕτως λέγων
  choice: वह इस प्रकार कह रहा था
  rationale: यह अगले पद में आनेवाले प्रत्यक्ष कथन की स्वाभाविक भूमिका है और λέγων के जारी क्रियाभाव को भी व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए δεσπότης का अनुवाद
  choice: स्वामी
  alternative: प्रभु; सर्वाधिपति
  rationale: मूल पाठ में κύριος के बजाय δεσπότης है। ‘स्वामी’ पूर्ण अधिकार के विशिष्ट भाव और यूनानी शब्द-भेद को सुरक्षित रखता है, बिना किसी सांप्रदायिक अर्थ को जोड़े।
- issue: दया न किए जाने की भावी निश्चितता
  choice: जो अब उस पर दया नहीं करनेवाला था
  alternative: जो अब उस पर दया नहीं करता था
  rationale: ἐλεήσοντα भविष्यकालिक कृदन्त है; चुना हुआ रूप इसे केवल वर्तमान या अभ्यस्त व्यवहार न बनाकर आगामी दया की अनुपस्थिति के रूप में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य। ‘लगातार प्रार्थना करता रहा’ अपूर्ण भूतकाल का जारी भाव रखता है; ‘अपवित्र मनुष्य’ कठोर नैतिक-धार्मिक मूल्यांकन को नरम नहीं करता; और ‘स्वामी’ मूल यूनानी उपाधि का विशिष्ट अर्थ सुरक्षित रखता है।
