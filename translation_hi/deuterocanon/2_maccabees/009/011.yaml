  rationale: ἐπίγνωσις यहाँ पहचान या समझ में आने को दर्शाता है। यह अनुवाद प्रायश्चित्त का अधिक प्रबल अर्थ आरोपित किए बिना प्रसंगगत आशय स्पष्ट करता है।
- source_word: θείᾳ μάστιγι
  choice: परमेश्वर की मार के कारण
