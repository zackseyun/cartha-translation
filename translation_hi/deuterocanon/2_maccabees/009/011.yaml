- source_word: τὸ πολὺ τῆς ὑπερηφανίας
  choice: उसका घमंड
  rationale: यह यूनानी पदबंध घमंड की प्रचुरता या बड़ी मात्रा को सूचित करता है। हिन्दी में ‘उसका घमंड’ प्रसंगानुकूल है; उसकी तीव्रता का अधिक स्पष्ट रूप पादटिप्पणी में दिया गया है।
- source_word: τεθραυσμένος
