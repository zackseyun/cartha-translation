- source_word: ἀναλελυκὼς
  choice: लौट रहा था
  rationale: संदर्भ में कृदंत फ़ारस के क्षेत्र से वापस आने को सूचित करता है; हिन्दी का अपूर्ण भूतकाल चल रही कथात्मक परिस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀκόσμως
  choice: लज्जाजनक दशा में
  rationale: यह पद अव्यवस्था, अशोभनीयता या अपमानजनक स्थिति का संकेत दे सकता है। मुख्य पाठ का चयन पराजयजन्य अपमान का भाव रखता है, पर किसी एक कारण को निश्चित नहीं करता।
- source_word: ἐκ τῶν περὶ τὴν Περσίδα τόπων
