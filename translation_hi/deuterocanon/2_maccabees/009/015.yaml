base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/015.yaml
  text: But the Jews[a], whom he had determined not even to count worthy of burial, but to cast out with their infants for the birds to devour and for the wild beasts—he would make them all equal to the Athenians.
translation:
  language: hi
  text: परन्तु जिन यहूदियों के बारे में उसने यह निश्चय किया था कि वह उन्हें दफ़न के योग्य भी नहीं समझेगा, बल्कि उनके शिशुओं समेत उन्हें शिकारी पक्षियों और जंगली पशुओं का आहार बनने के लिए बाहर फेंक देगा—उन्हीं सबको वह एथेंसवासियों के बराबर कर देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् सम्भवतः वह उन्हें एथेंसवासियों के समान नागरिक विशेषाधिकार या कानूनी दर्जा देगा; यूनानी पाठ केवल उन्हें “एथेंसवासियों के बराबर” करने की बात कहता है।
    reason: मुख्य पाठ की वास्तविक अस्पष्टता बनाए रखते हुए सम्भावित ऐतिहासिक-राजनीतिक आशय स्पष्ट करना।
lexical_decisions:
- source_word: διέγνωκε
  choice: निश्चय किया था
  rationale: यह रूप सन्दर्भ में पहले किए गए दृढ़ निर्णय को व्यक्त करता है; हिन्दी में पूर्ण भूतकाल इसका स्वाभाविक रूप है।
- source_word: μηδὲ ταφῆς ἀξιῶσαι
  choice: दफ़नाए जाने के योग्य भी न समझने
  rationale: ἀξιόω के मूल्यांकनात्मक भाव को बनाए रखता है; बात केवल दफ़न की अनुमति न देने की नहीं, उन्हें उसके योग्य न मानने की है।
- source_word: οἰωνοβρώτους
  choice: ताकि वे शिकारी पक्षियों ... का आहार बनें
  rationale: यह विशेषण शवों को पक्षियों के खाने के लिए खुला छोड़ देने का भाव देता है। 'शिकारी पक्षी' आधुनिक हिन्दी में अर्थ को स्पष्ट करता है।
- source_word: σὺν τοῖς νηπίοις
  choice: उनके शिशुओं समेत
  rationale: νήπιοι बहुत छोटे बच्चों को सूचित करता है; 'शिशु' उनकी कम आयु और कथन की क्रूरता दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἐκρίψαι
  choice: बाहर फेंक देने
  rationale: क्रिया का मूल भाव फेंककर बाहर डालना है; यह दफ़न से वंचित करके शवों को खुला छोड़ देने के चित्र को बनाए रखता है।
- source_word: θηρίοις
  choice: जंगली पशुओं
  rationale: θηρίον के साहित्यिक और कठोर भाव का सहज हिन्दी रूप है।
- source_word: πάντας αὐτοὺς ἴσους Ἀθηναίοις ποιήσειν
  choice: अब वह उन सबको एथेनावासियों के बराबर कर देगा
  rationale: यूनानी वाक्य के प्रत्यक्ष तुलनात्मक कथन को बनाए रखता है और नागरिकता या किसी विशिष्ट कानूनी अधिकार को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता। 'अब' विरोधाभासी मोड़ को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: “एथेनावासियों के बराबर” का राजनीतिक-सांस्कृतिक आशय
  choice: मुख्य पाठ में शाब्दिक तुलना रखी गई है।
  alternative: उन्हें एथेनावासियों के समान नागरिक अधिकार देगा / उनका नागरिक दर्जा एथेनावासियों के बराबर करेगा
  rationale: यूनानी पाठ समान बनाने की बात कहता है, पर नागरिकता अथवा कानूनी व्यवस्था का ठीक स्वरूप स्पष्ट नहीं करता। सम्भावित नागरिक या वैधानिक आशय टिप्पणी में दिया गया है, मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। 'दफ़नाए', 'शिशुओं', 'शिकारी पक्षियों' और 'जंगली पशुओं' से कठोर चित्र स्पष्ट रहता है। दीर्घ वाक्य और डैश मूल के तीखे विरोध को बनाए रखते हैं।
