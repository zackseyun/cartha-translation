translation:
  language: hi
  text: यह पूरी तरह न्यायोचित था, क्योंकि उसने दूसरों के भीतरी अंगों[b] को अनेक विचित्र यातनाएँ[a] पहुँचाई थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनेक असामान्य कष्टों से” या “अनेक पराई विपत्तियों से।” यूनानी विशेषण का अर्थ “विचित्र,” “पराया” या “असामान्य” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अंतड़ियों” या “आंतरिक अंगों।” यूनानी शब्द ठोस शारीरिक अंगों की ओर संकेत करता है, केवल भावनाओं की ओर नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: पूरी तरह न्यायोचित था
  rationale: πάνυ, δικαίως की न्याय-संबंधी नैतिक पुष्टि को तीव्र करता है। हिन्दी में यह प्रयोग प्रसंग से जुड़े दण्ड को पूर्णतः उचित ठहराता है, बिना कोई अतिरिक्त व्याख्या जोड़े।
- source_word: πολλαῖς καὶ ξενίζουσαις συμφοραῖς
  choice: अनेक असामान्य कष्टों से
  rationale: πολλαῖς का बहुवचन बल ‘अनेक’ से बना रहता है; ξενίζουσαις यहाँ विचित्र या सामान्य से हटकर होने का भाव देता है; और यातना के प्रसंग में συμφοραῖς के लिए ‘कष्ट’ स्वाभाविक है।
- source_word: σπλάγχνα
  choice: भीतरी अंगों
  rationale: यह शब्द ठोस शारीरिक अर्थ में अंतड़ियों या आंतरिक अंगों को सूचित करता है। ‘भीतरी अंग’ आधुनिक हिन्दी में स्पष्ट है और इसे केवल भावनात्मक ‘हृदय’ नहीं बनाता।
- source_word: βασανίσαντα
  choice: यातना दी थी
  rationale: कृदन्त पूर्व में किए गए कठोर उत्पीड़न को बताता है। ‘यातना दी थी’ उसकी तीव्रता और पूर्वकालिक संबंध दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: τὸν ... βασανίσαντα
  choice: क्योंकि उसने ... यातना दी थी
  rationale: यूनानी का संज्ञार्थक कृदन्त पूर्ववर्ती प्रसंग में उसी पीड़ित व्यक्ति का वर्णन करता है। हिन्दी में कारणसूचक उपवाक्य उस संबंध को स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: अन्तियोकुस के कष्ट का नैतिक मूल्यांकन
  choice: यह पूरी तरह न्यायोचित था
  alternative: यह उसके साथ बिल्कुल ठीक हुआ
  rationale: यूनानी पाठ कष्ट को स्पष्ट रूप से न्यायसंगत प्रतिफल बताता है। चुना हुआ पाठ इस निर्णय को बनाए रखता है, पर प्रतिशोधात्मक बोलचाल का अतिरिक्त रंग नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। कारणसूचक रचना खंडित यूनानी वाक्यांश को उसके प्रसंगानुसार स्वाभाविक बनाती है; ‘भीतरी अंगों’ से मूल की शारीरिक कठोरता सुरक्षित रहती है।
