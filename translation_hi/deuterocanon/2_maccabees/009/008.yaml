base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/008.yaml
  text: But the one who had thought[a], in his arrogance over men, to command even the waves of the sea, and imagined that he could weigh out the heights of the mountains on a scale, was brought down to the ground and carried in a litter[b], plainly showing to all the power of God.
translation:
  language: hi
  text: परन्तु जो मनुष्यों से अपने को ऊँचा समझने के घमण्ड में समुद्र की लहरों तक को आदेश देने की सोचता था, और कल्पना करता था कि वह तराज़ू पर पहाड़ों की ऊँचाइयाँ तौल सकता है, वही धरती पर आ पड़ा और पालकी में ले जाया गया। इस प्रकार वह सबके सामने परमेश्वर की सामर्थ्य[a] स्पष्ट रूप से प्रकट कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राप्त यूनानी पाठ में यहाँ अनियमित रूप से “विश्वास, विश्वास, सामर्थ्य” लिखा है। सम्भवतः यह नकल करते समय हुई पुनरावृत्ति या कोई अन्य पाठगत विकृति है; मुख्य पाठ वाक्य के स्पष्ट आशय के अनुसार “परमेश्वर की सामर्थ्य” देता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀντιδοκῶν τοῖς τῆς θαλάσσης κύμασιν
  choice: समुद्र की लहरों तक को आदेश देने की सोचता था
  rationale: क्रिया अहंकार से भरे उस दावे या मनसूबे को व्यक्त करती है कि वह समुद्र की लहरों पर भी अपना अधिकार चला सकता था। ‘तक’ अतिशयोक्ति को स्वाभाविक हिन्दी में उभारता है।
- source_word: διὰ τὴν ὑπὲρ ἀνθρώπων ὑπερηφανίαν
  choice: मनुष्यों से अपने को ऊँचा समझने के घमण्ड में
  rationale: ὑπὲρ ἀνθρώπων को केवल सामान्य ‘अहंकार’ में समेटने के बजाय मनुष्यों से ऊपर उठने की उसकी आत्म-धारणा स्पष्ट रखी गई है।
- source_word: πλάστιγγι τῶν ὀρέων οἰόμενος ὕψη στήσειν
  choice: कल्पना करता था कि वह तराज़ू पर पहाड़ों की ऊँचाइयाँ तौल सकता है
  rationale: πλάστιγγι तराज़ू का बिम्ब देता है और στήσειν प्रसंग में तौलकर परिमाण निर्धारित करने का भाव रखता है।
- source_word: κατὰ γῆν γενόμενος
  choice: धरती पर आ पड़ा
  rationale: यह शारीरिक दशा और उसके ऊँचे दम्भ से नीचे गिरने की विडम्बना, दोनों को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν φορίᾳ παρεκομίζετο
  choice: पालकी में ले जाया गया
  rationale: φορία किसी व्यक्ति को उठाकर ले जाने वाले साधन को दर्शाता है। ऐतिहासिक और गरिमामय शैली में ‘पालकी’ सहज है, यद्यपि यहाँ रोगी को ढोने वाली शय्या-जैसी सवारी अभिप्रेत हो सकती है।
- source_word: φανερὰν τοῦ θεοῦ ... δύναμιν ἐνδεικνύμενος
  choice: सबके सामने परमेश्वर की सामर्थ्य स्पष्ट रूप से प्रकट कर रहा था
  rationale: उसकी अपमानजनक दशा स्वयं परमेश्वर की सामर्थ्य का सार्वजनिक प्रमाण बन रही थी; हिन्दी वाक्य इस व्यंग्यात्मक आशय को बनाए रखता है।
theological_decisions:
- issue: ὑπὲρ ἀνθρώπων में मनुष्यों के ऊपर होने का भाव
  choice: मनुष्यों से अपने को ऊँचा समझने के घमण्ड में
  alternative: मनुष्यों के प्रति अपने घमण्ड के कारण
  rationale: चुना हुआ पाठ इस सम्भावना को प्रमुखता देता है कि अन्तियोकुस स्वयं को सामान्य मानवता से ऊपर मानता था, जबकि ‘प्रति’ केवल उसके व्यवहार का भाव दे सकता है।
- issue: τὴν πίστιν τὴν πίστιν τὴν δύναμιν की अनियमित पुनरावृत्ति
  choice: मुख्य पाठ में ‘परमेश्वर की सामर्थ्य’ और पाठगत समस्या को पादटिप्पणी में दर्ज करना
  alternative: ‘परमेश्वर के विश्वास, विश्वास और सामर्थ्य’ को शब्दशः रखना
  rationale: प्राप्त यूनानी पाठ में πίστιν दो बार असंगत रूप से आया है और फिर δύναμιν आता है। इसे धर्मवैज्ञानिक रूप से ‘विश्वासयोग्यता’ मान लेना अनिश्चित पाठ को चुपचाप सुलझाना होगा; वाक्य का स्पष्ट आशय मुख्य पाठ में रखा गया है और अस्थिरता पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमामय कथात्मक शैली अपनाई गई है। वाक्य की ऊँचे दम्भ से धरती पर आ पड़ने तक की विडम्बनापूर्ण गति सुरक्षित रखी गई है। ‘मनुष्यों’ का प्रयोग समूची मानवता के प्रतिनिधि बहुवचन के रूप में हुआ है।
