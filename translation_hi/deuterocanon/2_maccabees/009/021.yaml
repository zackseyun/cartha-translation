base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/021.yaml
  text: I remembered your honor and goodwill with affection[a]; after returning from the regions of Persia and falling into an illness that has become severe, I considered it necessary to take thought for the common safety of all of you[c][b];
translation:
  language: hi
  text: मैं आपके आदर और सद्भाव[a] को स्नेहपूर्वक स्मरण करता था। फारस के प्रदेशों से लौटकर और गंभीर स्थिति वाली बीमारी की चपेट में पड़कर[b], मैंने आप सबकी साझा सुरक्षा[c] का ध्यान रखना आवश्यक समझा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आदर और कृपा’। यूनानी εὔνοια का अर्थ ‘सद्भाव’ या ‘कृपा’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: ‘ऐसी बीमारी में पड़कर जो कठिन दशा लिए हुए है।’ यह अभिव्यक्ति गंभीर या सहने में कठिन बीमारी का संकेत देती है।'
    reason: lexical_alternative
  - marker: c
    text: या ‘आप सबकी सार्वजनिक सुरक्षा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: आदर
  rationale: यहाँ τιμή सम्मान या प्रतिष्ठा का बोध कराता है। राजकीय पत्र के संबंधपरक संदर्भ में ‘आदर’ सहज है और इसे केवल राजनीतिक निष्ठा तक सीमित नहीं करता।
- source_word: εὔνοια
  choice: सद्भाव
  rationale: εὔνοια का अर्थ सदिच्छा, सद्भाव या कृपा हो सकता है। ‘सद्भाव’ आदर के साथ स्वाभाविक रूप से जुड़ता है और संबंधपरक तथा राजनीतिक दोनों भाव बनाए रखता है।
- source_word: ἐμνημόνευον
  choice: स्मरण करता रहा हूँ
  rationale: अपूर्ण भूतकाल की निरंतरता को ‘करता रहा हूँ’ व्यक्त करता है, जबकि पत्र की वर्तमान वाणी से इसका संबंध भी स्वाभाविक बना रहता है।
- source_word: φιλοστόργως
  choice: स्नेहपूर्वक
  rationale: यह क्रियाविशेषण आत्मीय, कभी-कभी परिवार-जैसे स्नेह का संकेत देता है। ‘स्नेहपूर्वक’ भाव को बनाए रखता है, पर पारिवारिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπαναγαγών
  choice: लौटने के बाद
  rationale: संदर्भ में कृदंत को अकर्मक रूप से, अर्थात वक्ता के फारस से वापस आने के अर्थ में, समझना सबसे स्वाभाविक है।
- source_word: κατὰ τὴν Περσίδα τόπων
  choice: फारस के प्रदेशों से
  rationale: यह पद फारस के भीतर के विभिन्न स्थानों या इलाकों की ओर संकेत करता है। ‘प्रदेशों’ व्यापक भौगोलिक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: περιπεσών
  choice: ग्रस्त हो गया हूँ
  rationale: ἀσθενείᾳ के साथ यह बीमारी की चपेट में आने का भाव देता है। ‘ग्रस्त हो गया हूँ’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: ἀσθενείᾳ
  choice: बीमारी
  rationale: शब्द सामान्यतः दुर्बलता भी दर्शा सकता है, पर यहाँ राजा की शारीरिक दशा के संदर्भ में बीमारी अभिप्रेत है।
- source_word: δυσχερίαν ἔχουσῃ
  choice: जिसकी दशा गंभीर है
  rationale: यह बीमारी की कठिन, कष्टकारी या गंभीर अवस्था बताता है। संबंधवाचक उपवाक्य यूनानी अभिव्यक्ति की खुली बनावट को बनाए रखता है और रोग की गंभीर दशा स्पष्ट करता है।
- source_word: ἀναγκαῖον ἡγησάμην
  choice: आवश्यक समझा
  rationale: यह किसी बात को जरूरी मानने या उसके विषय में निश्चय करने की मानक अभिव्यक्ति है।
- source_word: φροντίσαι
  choice: चिंता करना
  rationale: φροντίζω ध्यान देने, परवाह करने और प्रबंध के बारे में सोचने का भाव रखता है। यहाँ ‘चिंता करना’ राजकीय उत्तरदायित्व के संदर्भ में स्वाभाविक है, यद्यपि इसका आशय केवल भावनात्मक चिंता नहीं है।
- source_word: κοινῆς ... ἀσφαλείας
  choice: सामूहिक सुरक्षा
  rationale: ἀσφάλεια सुरक्षा या स्थिरता और κοινῆς उसके सबके लिए साझा होने को व्यक्त करता है। ‘सामूहिक सुरक्षा’ औपचारिक तथा सार्वजनिक अर्थ बनाए रखता है।
