  yaml_path: translation/deuterocanon/2_maccabees/009/010.yaml
  text: And no one was able to carry the man who a little earlier had seemed to touch the stars of heaven[a], because of the unbearable burden of the stench.
translation:
  language: hi
  text: और जिसे थोड़ी ही देर पहले आकाश के तारों को छूता हुआ समझा जाता था[a], उसे दुर्गंध के असहनीय बोझ के कारण कोई ले जा नहीं सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो सोचता था कि वह आकाश के तारों को छू सकता है।” यूनानी वाक्यांश या तो उसके ऊँचे पद या महिमा के आभास का, या उसकी धृष्ट आत्म-धारणा का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ... δοκοῦντα
  choice: जिस मनुष्य के विषय में ... ऐसा लगता था
  rationale: विशेषणवत् प्रयुक्त कृदंत अन्तियोखुस की ओर संकेत करता है। यह रूप स्वाभाविक हिन्दी में व्यक्ति-संदर्भ को स्पष्ट करता है और δοκέω की ‘प्रतीत होना/समझना’ वाली अस्पष्टता को पादटिप्पणी सहित बनाए रखता है।
- source_word: μικρῷ πρότερον
  choice: थोड़ी ही देर पहले
  rationale: यह निकट भूतकाल सूचित करता है; चुना हुआ वाक्यांश आधुनिक हिन्दी में सहज है और ‘कुछ पहले’ की तुलना-सूक्ष्मता रखता है।
- source_word: τῶν οὐρανίων ἄστρων
  choice: आकाश के तारों
  rationale: यह यूनानी संबंधवाचक पदबंध का सीधा और गरिमापूर्ण अनुवाद है तथा ब्रह्मांडीय बिंब को बनाए रखता है।
- source_word: ἅπτεσθαι
  choice: छू रहा है
  rationale: क्रिया का मूल अर्थ ‘छूना/पकड़ना’ है। यहाँ ‘छूना’ अहंकारी ऊँचाई के अतिशयोक्तिपूर्ण बिंब को सुरक्षित रखता है।
- source_word: παρακομίζειν
  choice: उठा ले जाने
  rationale: क्रिया किसी को एक स्थान से दूसरे स्थान तक ढोने या ले जाने को व्यक्त करती है। प्रसंग में ‘उठा ले जाना’ स्पष्ट करता है कि उसकी शारीरिक दशा के कारण उसे दूसरों को ढोना पड़ रहा था।
- source_word: διὰ τὸ τῆς ὀσμῆς ἀφόρητον βάρος
  choice: क्योंकि दुर्गंध का असहनीय बोझ था
  rationale: βάρος का शाब्दिक अर्थ ‘भार/बोझ’ है और यहाँ गंध की दमनकारी तीव्रता के लिए रूपक है। ‘असहनीय बोझ’ यूनानी की सजीवता बनाए रखता है।
theological_decisions:
- issue: अन्तियोखुस के पूर्व अहंकार का अतिशयोक्तिपूर्ण वर्णन
  choice: ऐसा लगता था कि वह आकाश के तारों को छू रहा है
  alternative: वह समझता था कि वह आकाश के तारों को छू सकता है
  rationale: δοκοῦντα + infinitive बाहरी प्रतीति अथवा उसकी अपनी धृष्ट आत्म-धारणा—दोनों का संकेत दे सकता है। मुख्य पाठ प्रतीत होने का भाव रखता है और पादटिप्पणी वैकल्पिक अर्थ बताती है, जिससे व्यंग्य और धर्मवैचारिक तनाव अनिर्णीत रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘उठा ले जाने’ और ‘दुर्गंध का असहनीय बोझ’ स्पष्टता तथा मूल यूनानी के तीखे व्यंग्य और सजीव रूपक के बीच संतुलन रखते हैं।
