base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/018.yaml
  text: 'But when his pains had somewhat let up[a], for the just judgment of God had come upon him, and when he recognized his own condition, he wrote to the Jews the letter written below, having the character of a petition[c][b], and reading as follows:'
translation:
  language: hi
  text: 'परन्तु जब उसकी पीड़ाएँ कुछ कम हुईं[a]—क्योंकि परमेश्वर का धर्मसंगत न्याय उस पर आ पड़ा था—तब अपनी दशा को समझकर[b] उसने यहूदियों को नीचे दी हुई चिट्ठी लिखी। वह विनती के रूप में थी[c] और इस प्रकार थी:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसकी पीड़ाएँ कुछ घटने लगीं।” दुर्लभ क्रियाविशेषण ἰουδαϊσμῶς का अर्थ निश्चित नहीं है; आशय यह है कि पीड़ाएँ कुछ हल्की हुई थीं, पूरी तरह समाप्त नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने विषय की बातों को पहचानकर।”
    reason: lexical_alternative
  - marker: c
    text: या, “वह याचना के स्वरूप में थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰουδαϊσμῶς
  choice: कुछ
  rationale: यह दुर्लभ और कठिन क्रियाविशेषण है। प्रसंग में यह पीड़ाओं के कुछ हद तक घटने का संकेत देता है, उनके पूरी तरह समाप्त होने का नहीं।
- source_word: ληγόντων τῶν πόνων
  choice: उसकी पीड़ाएँ कुछ कम होने लगीं
  rationale: λήγω के साथ πόνων यहाँ शारीरिक पीड़ाओं के घटने या हल्का पड़ने को व्यक्त करता है; हिन्दी वाक्यांश स्वाभाविक है और अपूर्ण प्रक्रिया को बनाए रखता है।
- source_word: δικαία ἡ τοῦ θεοῦ κρίσις
  choice: परमेश्वर का न्यायोचित दण्ड
  rationale: κρίσις यहाँ केवल निर्णय नहीं, उस पर आए ईश्वरीय न्याय के दण्डात्मक परिणाम को सूचित करता है; ‘न्यायोचित’ δικαία के नैतिक बल को बनाए रखता है।
- source_word: τὰ κατʼ αὐτὸν ἐπιγνούς
  choice: अपनी दशा को समझकर
  rationale: संक्षिप्त यूनानी पद का शाब्दिक अर्थ ‘अपने विषय की बातों को पहचानकर’ है; प्रसंग में अपनी अवस्था का बोध अभिप्रेत है।
- source_word: ὑπογεγραμμένην ἐπιστολήν
  choice: नीचे लिखी चिट्ठी
  rationale: ὑπογεγραμμένην आगे आने वाली पत्र-सामग्री की ओर संकेत करता है; ‘नीचे लिखी’ इस संकेत को साफ रखता है।
- source_word: ἱκετηρίας τάξιν
  choice: विनती के रूप में
  rationale: ἱκετηρία विनती/याचना और τάξις यहाँ रूप या स्वरूप को व्यक्त करता है। यह अनुवाद पत्र के निवेदनात्मक चरित्र को सहज हिन्दी में रखता है।
- source_word: περιέχουσαν δὲ οὕτως
  choice: और इस प्रकार थी
  rationale: यह आगे उद्धृत पत्र का परिचय देने वाला सूत्र है; हिन्दी में संक्षिप्त और स्वाभाविक संक्रमण देता है।
theological_decisions:
- issue: अन्तियोकुस की पीड़ा को परमेश्वर के न्याय के रूप में प्रस्तुत करना
  choice: ‘परमेश्वर का न्यायोचित दण्ड उस पर आ पड़ा था’ के द्वारा ईश्वरीय न्याय को स्पष्ट रखा गया।
  alternative: इसे अधिक तटस्थ रूप में केवल उसकी परिस्थिति या दुर्भाग्य कहना।
  rationale: यूनानी पाठ स्पष्ट रूप से उसकी दशा को परमेश्वर की न्यायपूर्ण κρίσις से जोड़ता है; इसे नरम करके केवल परिस्थिति बना देना मूल का धर्मवैचारिक दावा खो देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘चिट्ठी’ सामान्य पाठक के लिए स्वाभाविक है; ‘न्यायोचित दण्ड’ प्रसंग के न्यायिक और दण्डात्मक दोनों बलों को व्यक्त करता है। दुर्लभ ἰουδαϊσμῶς की अनिश्चितता मुख्य पाठ और पादटिप्पणी में सुरक्षित रखी गई है।
