translation:
  language: hi
  text: अपनी दशा को लेकर मैं निराश नहीं हूँ, बल्कि मुझे बड़ी आशा है कि मैं इस बीमारी से बच निकलूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀπογινώσκων
  choice: मैं निराश नहीं हूँ
  rationale: यह कृदन्त यहाँ आशा न छोड़ने या निराश न होने का भाव व्यक्त करता है। आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: τὰ κατʼ ἐμαυτόν
  choice: अपनी दशा को लेकर
  rationale: यूनानी मुहावरा अपने विषय की परिस्थितियों को सूचित करता है; बीमारी के प्रसंग में ‘अपनी दशा’ पर्याप्त व्यापक रहते हुए संदर्भानुकूल है।
- source_word: ἔχων πολλὴν ἐλπίδα
  choice: मुझे बड़ी आशा है
  rationale: यह हिन्दी में स्वाभाविक ढंग से πολλήν के बल और आशा रखने के भाव, दोनों को बनाए रखता है।
- source_word: ἐκφεύξεσθαι
  choice: बच निकलूँगा
  rationale: भविष्यकालिक मध्य infinitive बीमारी से निकल जाने की प्रत्याशा व्यक्त करता है। ‘बच निकलूँगा’ केवल स्वस्थ होने की व्याख्या थोपे बिना ‘escape’ का सजीव भाव रखता है।
- source_word: τὴν ἀσθένειαν
  choice: इस बीमारी से
  rationale: प्रसंग में ἀσθένεια शारीरिक दुर्बलता के बजाय ठोस रोगावस्था को सूचित करता है। सम्बन्धित बीमारी की ओर संकेत स्पष्ट करने के लिए हिन्दी में ‘इस’ स्वाभाविक है।
