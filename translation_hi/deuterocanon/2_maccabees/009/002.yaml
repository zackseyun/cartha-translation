base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/002.yaml
  text: For he had entered the so-called Persepolis and attempted to rob the temple and seize control of the city[a]; therefore, when the crowds rushed to arms, they turned him back, and it happened that Antiochus, put to flight by the local inhabitants[b], made a shameful retreat.
translation:
  language: hi
  text: क्योंकि वह पर्सेपोलिस कहलाने वाले नगर में प्रवेश कर चुका था और उसने मंदिर को लूटने[a] तथा नगर को अपने अधिकार में लेने का प्रयास किया था। इसलिए जब लोग उमड़ पड़े, तो वे हथियारबंद प्रतिरोध का सहारा लेने लगे[b]; और ऐसा हुआ कि स्थानीय निवासियों से परास्त होकर अन्तियोकुस को लज्जाजनक ढंग से पीछे हटना पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “पवित्र स्थान को लूटने और अपवित्र करने।” यूनानी क्रिया विशेष रूप से किसी पवित्र स्थान या मंदिर को लूटने के लिए प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हथियारों की सहायता की ओर मुड़े”; अर्थात उन्होंने हथियारबंद प्रतिरोध का सहारा लिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσεληλύθει
  choice: घुस गया था
  rationale: पूर्णभूत काल पहले हो चुके प्रवेश को व्यक्त करता है; प्रसंग में यह केवल आगमन नहीं, बल्कि विरोधी उद्देश्य से नगर में प्रवेश है।
- source_word: τὴν λεγομένην Περσέπολιν
  choice: पर्सेपोलिस कहलाने वाले नगर
  rationale: λεγομένην को स्पष्ट रखते हुए ऐसा स्वाभाविक हिन्दी रूप चुना गया है जो यूनानी से अधिक संदेह का भाव उत्पन्न नहीं करता।
- source_word: ἐπεχείρησεν
  choice: प्रयास किया था
  rationale: क्रिया प्रयास को बताती है, कार्य की सफलता या पूर्णता को नहीं।
- source_word: ἱεροσυλεῖν
  choice: मंदिर को लूटने
  rationale: यह क्रिया विशेष रूप से किसी पवित्र स्थान या मंदिर को लूटने का बोध कराती है; मुख्य पाठ में स्पष्ट और सहज रूप रखा गया है।
- source_word: συνέχειν
  choice: नगर को अपने अधिकार में लेने
  rationale: सैन्य-राजनीतिक प्रसंग में नगर पर नियंत्रण स्थापित करने का भाव है; केवल पकड़ने या रोकने का नहीं।
- source_word: τῶν πληθῶν ὁρμησάντων
  choice: जब जनसमूह उमड़ पड़े
  rationale: सम्बन्धकारक निरपेक्ष रचना लोगों की अचानक और जोरदार प्रतिक्रिया व्यक्त करती है।
- source_word: ἐπὶ τὴν τῶν ὅπλων βοήθειαν ἐτράπησαν
  choice: उन्होंने हथियारों से प्रतिरोध करने का सहारा लिया
  rationale: यूनानी वाक्यांश का आशय हथियारबंद रक्षा की ओर मुड़ना है। यह रूप मूल कर्ता और प्रतिरक्षात्मक अर्थ को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: τροπωθέντα
  choice: परास्त होकर
  rationale: सैन्य प्रसंग में यह हारकर पीछे हटने या भगा दिए जाने का भाव देता है; अगले पद में पीछे हटना स्पष्ट होने के कारण अनावश्यक पुनरुक्ति से बचा गया है।
- source_word: τῶν ἐγχωρίων
  choice: स्थानीय निवासियों से
  rationale: यह उस स्थान के रहने वालों को सूचित करता है; आधुनिक हिन्दी में यह तटस्थ और स्पष्ट है।
- source_word: αἰσχύμονα τὴν ἀναζυγὴν ποιήσασθαι
  choice: लज्जाजनक ढंग से पीछे हटना पड़ा
  rationale: वाक्यांश अपमानपूर्ण सैन्य वापसी को व्यक्त करता है। 'पड़ा' घटनाक्रम में अन्तियोकुस पर आई विवशता को सहज हिन्दी में दर्शाता है।
