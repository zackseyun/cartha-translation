base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/029.yaml
  text: But Philip[a], his companion, was carrying the body; and, because he feared Antiochus’s son[b], he went over to Ptolemy Philometor in Egypt.
translation:
  language: hi
  text: परन्तु उसका साथी[a] फिलिप्पुस अन्तियोकुस की देह ले जा रहा था; और अन्तियोकुस के पुत्र से डरकर वह मिस्र में पतोलेमायोस फिलोमेतोर के पास चला गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “साथी” का अर्थ उसके साथ पला-बढ़ा व्यक्ति भी हो सकता है, अर्थात कोई घनिष्ठ राजदरबारी सहचर।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “उसे मिस्र में पतोलेमायोस फिलोमेतोर के पास पहुँचा दिया गया।” यूनानी क्रिया का रूप कर्मवाच्य है और किसी को एक स्थान से दूसरे स्थान पहुँचाए जाने का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκομίζετο
  choice: ले जा रहा था
  rationale: अपूर्ण भूतकाल की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और देह को एक स्थान से दूसरे स्थान ले जाने का भाव बनाए रखता है।
- source_word: τὸ σῶμα
  choice: उसकी देह
  rationale: मूल में शाब्दिक रूप से ‘देह’ है; प्रसंग से स्पष्ट है कि यह मृत अन्तियोकुस की देह है। हिन्दी में संदर्भ की स्पष्टता के लिए ‘उसकी’ जोड़ा गया है, जबकि ‘लाश’ की अपेक्षा ‘देह’ अधिक गरिमापूर्ण है।
- source_word: σύντροφος
  choice: साथी
  rationale: यह शब्द सामान्य साथी के साथ-साथ साथ पले-बढ़े घनिष्ठ राजदरबारी सहचर का अर्थ भी दे सकता है; ‘साथी’ मूल की व्यापकता बनाए रखता है।
- source_word: εὐλαβηθεὶς
  choice: से डरकर
  rationale: कृदन्त फिलिप्पुस के जाने का कारण बताता है और यहाँ भय अथवा आशंका का भाव रखता है।
- source_word: τὸν υἱὸν Ἀντιόχου
  choice: अन्तियोकुस के पुत्र
  rationale: मूल अभिव्यक्ति का सीधा संबंधसूचक अनुवाद है; ‘उत्तराधिकारी’ कहना पाठ से अधिक व्याख्या जोड़ता।
- source_word: πρὸς Πτολεμαῖον τὸν Φιλομήτορα
  choice: पतोलेमायोस फिलोमेतोर के पास
  rationale: πρός यहाँ किसी व्यक्ति की ओर अथवा उसके संरक्षण-क्षेत्र में जाने का संकेत देता है; ‘के पास’ स्वाभाविक हिन्दी में दोनों संभावनाओं को समेटता है।
- source_word: διεκομίσθη
  choice: चला गया
  rationale: यूनानी रूप व्याकरणतः कर्मवाच्य है, पर प्रसंग में फिलिप्पुस के मिस्र चले जाने को व्यक्त करता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
