lexical_decisions:
- source_word: τὴν μὲν ἁγίαν πόλιν
  choice: पवित्र नगर को
  rationale: ἁγίαν πόλιν का स्वाभाविक और बाइबलीय हिन्दी रूप ‘पवित्र नगर’ है; μὲν अगले कथनों के साथ संरचनात्मक संबंध रखता है और यहाँ अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: σπεύδων παρεγίνετο
  choice: उतावला होकर आ रहा था
  rationale: σπεύδων की तत्परता/जल्दबाज़ी और παρεγίνετο की आगमन-संबंधी गति, दोनों को स्पष्ट रखा गया है।
- source_word: ἰσόπεδον ποιῆσαι
  choice: धरती के बराबर कर देने
  rationale: यह वाक्यांश नगर को पूरी तरह समतल कर देने, अर्थात नष्ट कर देने, का बोध देता है; हिन्दी मुहावरा विनाश की तीव्रता बनाए रखता है।
- source_word: πολυάνδριον οἰκοδομῆσαι
  choice: बहुतों की कब्र बना देने
  rationale: πολυάνδριον बहुत से मृतकों के लिए सामूहिक कब्र या दफ़न-स्थान को दर्शाता है। οἰκοδομῆσαι का शाब्दिक ‘निर्माण करना’ हिन्दी में इस संदर्भ में अस्वाभाविक होता, इसलिए परिणामसूचक ‘बना देने’ चुना गया।
- source_word: ἐλευθέραν ἀναδείξει
  choice: स्वतंत्र घोषित करेगा
  rationale: ἀναδείξει सार्वजनिक रूप से किसी स्थिति में घोषित या प्रतिष्ठित करने का भाव दे सकता है; यह रूप नगर की स्वतंत्र स्थिति की घोषणा को व्यक्त करता है, बिना किसी विशिष्ट संवैधानिक अर्थ को आरोपित किए।
