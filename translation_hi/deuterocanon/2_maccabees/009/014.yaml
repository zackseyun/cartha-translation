  verdict: revise
  source_fidelity: 'The central sense is retained: Antiochus had been hastening/coming with the intent to level the holy city and turn it into a burial place for many, but will declare it free. The proposed revision preserves the motion-and-haste nuance of σπεύδων παρεγίνετο while avoiding an unnecessarily awkward construction.'
  naturalness: The draft is generally clear, but the opening “और” is not required by the Greek μὲν and is less natural here than topical fronting. “बहुतों की कब्र” can sound possessive and is less clear than “बहुतों का दफ़न-स्थान.” The footnote marker should be attached to the term it explains rather than placed at the end of the sentence.
  terminology: “पवित्र नगर” and “स्वतंत्र घोषित करेगा” are appropriate and preserve the public-status nuance of ἐλευθέραν ἀναδείξει without imposing a specific political or doctrinal interpretation. “दफ़न-स्थान” is a suitably broad rendering of πολυάνδριον; the footnote preserves “सामूहिक कब्र” as a viable alternative.
  issues:
  - severity: medium
    issue: Footnote anchor is misplaced.
    rationale: The footnote explains πολυάνδριον, rendered in the draft as “बहुतों की कब्र,” but its marker appears after the entire sentence. It should immediately follow the relevant burial-place expression.
  - severity: low
    issue: “बहुतों की कब्र” is potentially ambiguous in Hindi.
    rationale: It can be read as a grave belonging to many people rather than a burial place containing many dead. “बहुतों का दफ़न-स्थान” communicates the lexical sense more directly.
  - severity: low
    issue: The initial “और” is not needed.
    rationale: The Greek μέν marks topical contrast/emphasis and does not by itself require a Hindi conjunction. Omitting it produces a smoother independent verse rendering.
  revised_text: पवित्र नगर को—जिसे वह धरती के बराबर कर देने और बहुतों का दफ़न-स्थान[a] बना देने के लिए तेज़ी से आ रहा था—वह स्वतंत्र घोषित करेगा।
