  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट कथात्मक शैली अपनाई गई है। विध्वंसक आशय को तीखा किंतु सहज रखा गया है और यूनानी में निहित आगमन, उतावलेपन तथा सार्वजनिक घोषणा—तीनों भावों को व्यक्त किया गया है।
