  choice: स्वतंत्र घोषित करेगा
  alternative: स्वतंत्र कर देगा
  rationale: यूनानी क्रिया घोषणा अथवा सार्वजनिक प्रतिष्ठापन पर बल दे सकती है। ‘स्वतंत्र घोषित करेगा’ इस तनाव को सुरक्षित रखता है और यह निश्चित नहीं करता कि कथन केवल प्रभावी मुक्ति की कार्रवाई को दर्शाता है।
