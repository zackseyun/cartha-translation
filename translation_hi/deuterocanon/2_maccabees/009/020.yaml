  yaml_path: translation/deuterocanon/2_maccabees/009/020.yaml
  text: Farewell[a], and your children. And your own affairs—your own affairs—your own affairs will be according to your judgment. Having my hope in heaven,
translation:
  language: hi
  text: आप और आपके बच्चे कुशल रहें। और आपके अपने मामले—आपके अपने मामले—आपके अपने मामले[a]—आपके निर्णय के अनुसार होंगे। स्वर्ग में अपनी आशा रखे हुए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी पाठ में ‘आपके अपने मामले’ तीन बार आया है। इसे बल देने वाली पुनरावृत्ति समझा जा सकता है; कुछ पाठक इसे पाठ-परंपरा में अनजाने में हुए दोहराव की संभावना भी मान सकते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ἐρρῶσθε, καὶ τὰ τέκνα
  choice: आप और आपके बच्चे कुशल रहें
  rationale: ἐρρῶσθε पत्र में कुशल-मंगल की कामना व्यक्त करता है। καὶ τὰ τέκνα को उसी क्रिया के साथ जोड़ने पर अर्थ है कि पत्र पाने वाले और उनके बच्चे दोनों कुशल रहें; हिन्दी में निहित संबंध को स्पष्ट करने के लिए ‘आपके बच्चे’ स्वाभाविक है।
- source_word: τὰ ἴδια
  choice: आपके अपने मामले
  rationale: नपुंसकलिंग बहुवचन पद यहाँ प्राप्तकर्ताओं से संबंधित निजी विषयों या कामकाज को सूचित करता है। ‘मामले’ अर्थ को व्यापक और स्वाभाविक रखता है। स्रोत में इसकी तीन आवृत्तियाँ हैं, इसलिए तीनों सुरक्षित रखी गई हैं।
- source_word: κατὰ γνώμην ὑμῶν
  choice: आपकी इच्छा के अनुसार
  rationale: γνώμη विचार, निर्णय, अभिप्राय या इच्छा का बोध करा सकता है। इस प्रसंग में ‘आपकी इच्छा के अनुसार’ सहज हिन्दी है और प्राप्तकर्ताओं की मंशा के अनुरूप परिणाम होने की बात व्यक्त करता है।
- source_word: ἔσται
  choice: होंगे
  rationale: εἰμί के साधारण भविष्यकाल को बिना अनावश्यक विस्तार के व्यक्त करता है और बहुवचन ‘मामले’ से मेल खाता है।
- source_word: εἰς οὐρανὸν τὴν ἐλπίδα ἔχων
  choice: स्वर्ग पर अपनी आशा लगाए हुए
  rationale: दिशासूचक εἰς और आशा रखने के भाव को वर्तमान हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है। कृदन्तीय वाक्यांश की अपूर्ण, अगले कथन की ओर बढ़ती संरचना भी बनाए रखी गई है।
theological_decisions:
- issue: स्रोत में τὰ ἴδια की तीन बार पुनरावृत्ति
  choice: मुख्य पाठ में तीनों आवृत्तियाँ बनाए रखना
  alternative: इसे संभावित प्रतिलिपिकरण-दोष मानकर केवल एक बार रखना
  rationale: प्रदत्त यूनानी साक्ष्य में पद तीन बार है और स्रोत का विश्वास-स्तर उच्च बताया गया है। अतः पाठ को चुपचाप संशोधित करने के बजाय पुनरावृत्ति सुरक्षित रखी गई है और उसकी संभावित पाठालोचनात्मक प्रकृति पादटिप्पणी में बताई गई है।
- issue: εἰς οὐρανόν में आशा का लक्ष्य या दिशा
  choice: ‘स्वर्ग पर अपनी आशा’
  alternative: ‘स्वर्ग की ओर आशा’ अथवा किसी विशिष्ट स्वर्गीय व्यक्ति पर आशा के रूप में विस्तार
  rationale: यूनानी वाक्यांश संक्षिप्त है और आशा के किसी विशिष्ट पात्र का नाम नहीं देता। अनुवाद उस अस्पष्टता को किसी अतिरिक्त धर्मवैज्ञानिक पहचान से नहीं भरता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पत्रात्मक रखी गई है। ‘कुशल रहें’ पारंपरिक अभिवादन/शुभकामना को सामान्य पाठक के लिए स्पष्ट करता है। अंतिम अल्पविराम यूनानी कृदन्तीय वाक्यांश की आगे जारी रहने वाली संरचना को दर्शाता है।
