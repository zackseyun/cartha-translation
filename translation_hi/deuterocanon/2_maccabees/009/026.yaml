  text: Therefore I urge you and ask you, remembering the benefits shown both publicly and privately, each of you to maintain the goodwill that now exists toward me and my son.
translation:
  language: hi
  text: इसलिए मैं आप लोगों से आग्रह और अनुरोध करता हूँ कि सार्वजनिक रूप से और व्यक्तिगत रूप से किए गए उपकारों को याद रखते हुए, आपमें से प्रत्येक मेरे और मेरे पुत्र के प्रति वर्तमान सद्भाव बनाए रखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλῶ ... καὶ ἀξιῶ
  choice: आग्रह और अनुरोध करता हूँ
  rationale: दोनों समन्वित क्रियाओं का विनम्र किंतु औपचारिक निवेदनात्मक बल बनाए रखा गया है।
- source_word: τῶν εὐεργεσιῶν
  choice: किए गए उपकारों
  rationale: εὐεργεσία यहाँ लाभकारी कार्यों या उपकारों को दर्शाता है; यह चयन कर्ता को अनावश्यक रूप से स्पष्ट किए बिना अर्थ देता है।
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: सार्वजनिक रूप से और व्यक्तिगत रूप से
  rationale: सामूहिक/सार्वजनिक तथा निजी/व्यक्तिगत दोनों स्तरों के विरोध को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἕκαστον συντηρεῖν
  choice: आपमें से प्रत्येक ... बनाए रखे
  rationale: ἕκαστον के व्यक्तिगत दायित्व और συντηρεῖν के निरंतर संरक्षण, दोनों को स्पष्ट करता है।
- source_word: τὴν οὖσαν εὔνοιαν
  choice: वर्तमान सद्भाव
  rationale: οὖσαν से अभी विद्यमान भाव और εὔνοια से अनुकूलता/सद्भाव व्यक्त होता है; ‘वर्तमान’ उस मौजूदा स्थिति को संक्षेप में सुरक्षित रखता है।
