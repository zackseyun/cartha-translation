base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/004.yaml
  text: But in his rage he thought to vent on the Jews the malice of those who had put him to flight. Therefore he ordered the charioteer[a], driving without stopping, to press on with the journey, while the judgment from heaven was accompanying him. For in his arrogance he had said, “When I arrive there, I will make Jerusalem a burial place of Jews.”
translation:
  language: hi
  text: परन्तु क्रोध से भड़ककर उसने सोचा कि जिन लोगों ने उसे भगा दिया था, उनकी दुष्टता वह यहूदियों पर उतारेगा। इसलिए उसने सारथी को आदेश दिया कि वह बिना रुके रथ हाँकता हुआ यात्रा पूरी करे, जबकि स्वर्ग से आया न्याय उसके साथ-साथ चल रहा था। क्योंकि उसने घमंड से कहा था, “मैं वहाँ पहुँचकर यरूशलेम को यहूदियों की कब्रगाह[a] बना दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदियों की सामूहिक कब्र।” यूनानी शब्द Πολυάνδριον बहुत-से मृतकों को दफनाने के स्थान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαρθεὶς ... τῷ θυμῷ
  choice: क्रोध से भड़ककर
  rationale: यह प्रयोग क्रोध से उकसाए या आवेश में भर जाने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν πεφυγαδευκότων αὐτὸν κακίαν ... ἐναπερείσασθαι
  choice: जिन लोगों ने उसे भगा दिया था, उनकी दुष्टता ... यहूदियों पर उतारेगा
  rationale: πεφυγαδευκότων किसी को भागने पर विवश करने का भाव देता है, और ἐναπερείσασθαι उस बुराई या वैर को दूसरे लोगों पर डालने की मंशा बताता है। ‘उतारेगा’ इस स्थानांतरण को सहज हिन्दी में बनाए रखता है।
- source_word: συνέταξεν τὸν ἁρματηλάτην
  choice: उसने सारथी को आदेश दिया
  rationale: ἁρματηλάτης विशेष रूप से रथ चलाने वाले को दर्शाता है; ‘सारथी’ सटीक और सामान्यतः बोधगम्य है।
- source_word: ἀδιαλείπτως ἐλαύνοντα καταλύειν τὴν πορείαν
  choice: बिना रुके रथ हाँकता हुआ यात्रा पूरी करे
  rationale: ἀδιαλείπτως निरन्तर चलने पर बल देता है। καταλύειν τὴν πορείαν का शाब्दिक भाव यात्रा को उसके अंत या पड़ाव तक पहुँचाना है; प्रसंग में ‘यात्रा पूरी करे’ उद्देश्य को स्पष्ट रखता है।
- source_word: τῆς ἐξ οὐρανοῦ τῆς κρίσεως συνοδούσης αὐτῷ
  choice: स्वर्ग से आया न्याय उसके साथ-साथ चल रहा था
  rationale: कृदन्तीय रचना समकालिक घटना बताती है। ‘न्याय’ κρίσις के न्यायिक अर्थ और ‘स्वर्ग से’ उसके दिव्य स्रोत को सुरक्षित रखता है; ‘साथ-साथ चल रहा था’ συνοδούσης की चित्रात्मकता बनाए रखता है।
- source_word: ὑπερηφάνως
  choice: घमंड से
  rationale: यह शब्द उसके अहंकारी और उद्दंड भाव को सरल, नैतिक रूप से स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: Πολυάνδριον
  choice: कब्रगाह
  rationale: यह संज्ञा बहुत-से मृतकों को दफनाने के स्थान को दर्शाती है। ‘कब्रगाह’ धमकी का भाव रखती है, जबकि अधिक विशिष्ट ‘सामूहिक कब्र’ को पाठ-टिप्पणी में विकल्प के रूप में दिया गया है।
theological_decisions:
- issue: अन्तियोकुस के दंड में दिव्य न्याय की भूमिका
  choice: स्वर्ग से आया न्याय उसके साथ-साथ चल रहा था
  alternative: स्वर्ग से आया दंड उसका पीछा कर रहा था
  rationale: κρίσις को ‘न्याय’ कहना उसके न्यायिक और धर्मवैचारिक अर्थ को बनाए रखता है और उसे केवल पीड़ा या दंड तक सीमित नहीं करता। συνοδούσης का अर्थ साथ चलना है, इसलिए ‘पीछा करना’ जैसी अधिक व्याख्यात्मक भाषा नहीं अपनाई गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’, ‘सारथी’, ‘कब्रगाह’ और ‘स्वर्ग से आया न्याय’ मूल के कथात्मक तथा धर्मवैचारिक स्वर को बनाए रखते हैं।
