  register: आधुनिक मानक हिन्दी में औपचारिक, गरिमापूर्ण पत्र-संबोधन अपनाया गया है। ‘की ओर से’ और ‘शुभकामनाएँ’ यूनानी पत्र-सूत्र को सहज हिन्दी बनाते हैं, जबकि दोनों मूल पदवियाँ और εὖ πράττειν की अर्थगत व्यापकता सुरक्षित रखी गई है।
