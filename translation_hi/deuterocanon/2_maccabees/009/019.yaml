  yaml_path: translation/deuterocanon/2_maccabees/009/019.yaml
  text: 'King Antiochus and general[a], to the good Jewish citizens: many greetings, and health[b], and prosperity.'
translation:
  language: hi
  text: राजा अन्तियोकस और सेनापति[a] की ओर से भले यहूदी नागरिकों को बहुत-बहुत नमस्कार तथा स्वास्थ्य और कुशल-मंगल[b] की कामना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ में भेजने वाले का नाम और उसकी पदवियाँ अभिवादन के बाद आती हैं: “भले यहूदी नागरिकों को ... राजा अन्तियोकस और सेनापति।” हिन्दी में पत्र की शैली स्पष्ट करने के लिए इन्हें आरंभ में रखा गया है।'
    reason: cultural_note
  - marker: b
    text: या “समृद्धि”; यूनानी पद का शाब्दिक भाव है “कुशल रहना” या “भला होना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς χρηστοῖς
  choice: भले
  rationale: χρηστός में भलाई, सद्भाव और योग्य होने का भाव है। संबोधन में ‘भले’ प्रशंसात्मक स्वर को सहज और संक्षिप्त रूप में बनाए रखता है।
- source_word: Ἰουδαίοις
  choice: यहूदी
  rationale: यहाँ शब्द केवल यहूदिया के निवासियों के बजाय यहूदी समुदाय के जातीय-धार्मिक अर्थ में प्रयुक्त है।
- source_word: τοῖς πολίταις
  choice: नागरिकों
  rationale: πολίτης का सीधा अर्थ ‘नागरिक’ है और औपचारिक पत्र-संबोधन में यही स्वाभाविक है।
- source_word: πολλὰ χαίρειν
  choice: बहुत-बहुत नमस्कार
  rationale: यह प्राचीन पत्रों का अभिवादन-सूत्र है। ‘बहुत-बहुत’ πολλά की प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑγιαίνειν
  choice: अच्छे स्वास्थ्य ... की शुभकामनाएँ
  rationale: इस अभिवादन-क्रम में क्रिया का आशय पत्र पाने वालों के अच्छे स्वास्थ्य की कामना करना है।
- source_word: εὖ πράττειν
  choice: कुशलता
  rationale: वाक्यांश का अर्थ ‘भला होना’ या ‘कुशल रहना’ है। ‘कुशलता’ स्वास्थ्य से संबंधित परंतु उससे व्यापक समग्र भलाई का भाव देती है और अतिशय आर्थिक अर्थ से बचती है।
- source_word: βασιλεὺς Ἀντίοχος καὶ στρατηγὸς
  choice: राजा अन्तियोकुस और सेनापति
  rationale: दोनों पदवियाँ स्रोत के असामान्य संयोजन के अनुसार सुरक्षित रखी गई हैं; हिन्दी पत्र-शैली की स्पष्टता के लिए प्रेषक को आरंभ में रखा गया है।
