- source_word: ὄντι δὲ αὐτῷ
  choice: पर जब वह ... था
  rationale: सम्बन्धकारक स्वतंत्र पदबंध को समयसूचक रूप में प्रस्तुत किया गया है। δέ के प्रसंगगत संक्रमण को स्वाभाविक हिन्दी में ‘पर’ से व्यक्त किया गया है।
- source_word: κατʼ Ἐκβάτανα
  choice: एकबतना के इलाके में
  rationale: κατά के साथ स्थाननाम यहाँ उस नगर में अथवा उसके आसपास के क्षेत्र में होने का संकेत दे सकता है। ‘के इलाके में’ इस स्थानगत व्यापकता को बनाए रखता है।
- source_word: προσεπέσε
  choice: उसे ... समाचार मिला
  rationale: क्रिया का मूल भाव ‘उस पर आ पड़ा/उस तक आ पहुँचा’ है; घटनाओं के साथ प्रयुक्त होने पर यहाँ सूचना पहुँचने का मुहावरेदार अर्थ है।
- source_word: τὰ ... γεγονότα
  choice: हुई घटनाओं
  rationale: संज्ञीकृत पूर्ण कृदन्त उन बातों या घटनाओं को दर्शाता है जो पहले घट चुकी थीं।
- source_word: τὰ κατὰ Νικάνορα
  choice: निकानोर ... के विषय में
  rationale: τὰ κατά + व्यक्ति का नाम ‘उससे सम्बन्धित मामले/घटनाएँ’ दर्शाता है; हिन्दी में कारण या परिणाम को अनावश्यक रूप से निश्चित किए बिना सम्बन्धसूचक अभिव्यक्ति रखी गई है।
- source_word: τοὺς περὶ Τιμόθεον
  choice: तीमुथियुस के साथियों
  rationale: οἱ περὶ + नाम उस व्यक्ति के आसपास के लोगों, उसके साथियों या दल को दर्शाता है। मुख्य पाठ स्रोत की सामूहिक अभिव्यक्ति को बिना सैन्य संरचना जोड़े सुरक्षित रखता है।
