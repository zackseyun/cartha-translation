base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/012.yaml
  text: 'As his pains intensified from moment to moment[a], and he was not even able to endure his own stench, he said this: “It is right to submit to God[c][b], and for one who is mortal not to think proudly.”'
translation:
  language: hi
  text: उसकी पीड़ाएँ पल-पल बढ़ती गईं[a], और वह अपनी ही दुर्गंध भी सह नहीं पा रहा था; उसने कहा, “परमेश्वर के अधीन होना उचित है[b], और नश्वर होकर घमंड भरी सोच नहीं रखनी चाहिए।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर पल” अथवा “लगातार”।
    reason: lexical_alternative
  - marker: b
    text: या “न्यायसंगत है” अथवा “ठीक है”।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “और नश्वर होकर घमंड से नहीं सोचना”; इसका भाव मनुष्यों की नश्वरता के विषय में एक सामान्य सिद्धांत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ στιγμὴν
  choice: पल-पल
  rationale: यह पदबंध क्रमिक और निरंतर बढ़ोतरी दर्शाता है। ‘पल-पल’ आधुनिक हिन्दी में स्वाभाविक है और समयगत बल को बनाए रखता है।
- source_word: ἐπιτεινόμενος ταῖς ἀλγηδόσιν
  choice: उसकी पीड़ाएँ ... बढ़ती गईं
  rationale: प्रसंग में कृदंत शारीरिक पीड़ाओं के लगातार अधिक तीव्र होने को बताता है; हिन्दी में कर्तृवाच्य रचना अधिक सहज है।
- source_word: μηδὲ τῆς ὀσμῆς αὐτοῦ ἀνέχεσθαι δυνάμενος
  choice: जब वह अपनी ही दुर्गंध भी सह नहीं सका
  rationale: रोग के प्रसंग में ὀσμή का नकारात्मक अर्थ ‘दुर्गंध’ है; ‘भी सह नहीं सका’ μηδέ और असमर्थता दोनों को व्यक्त करता है।
- source_word: ταῦτʼ ἔφη
  choice: तो उसने कहा
  rationale: उद्धरण आरम्भ करने के लिए यह स्वाभाविक हिन्दी है; ‘यह कहा’ जोड़ना अनावश्यक और कुछ कृत्रिम होता।
- source_word: Δίκαιον
  choice: उचित है
  rationale: नपुंसकलिंग विशेषण यहाँ भाववाचक रूप में प्रयुक्त है। ‘उचित’ नैतिक सहीपन और संगतता, दोनों अर्थों के लिए सहज है।
- source_word: ὑποτάσσεσθαι τῷ θεῷ
  choice: परमेश्वर के अधीन होना
  rationale: यह स्वयं को परमेश्वर के अधिकार के नीचे रखने या उसके सामने झुकने का भाव सुरक्षित रखता है।
- source_word: μὴ θνητὸν ὄντα
  choice: नश्वर होकर ... नहीं ... चाहिए
  rationale: यह मनुष्य की मरणशील दशा पर आधारित सामान्य सिद्धांत को व्यक्त करता है, न कि केवल वक्ता के विषय में पुरुष-विशिष्ट कथन।
- source_word: ὑπερήφανα φρονεῖν
  choice: घमंड से ... सोचना
  rationale: यह φρονεῖν के विचार या मनोवृत्ति संबंधी अर्थ को बनाए रखता है और केवल ‘घमंडी होना’ कहने से कम व्याख्यात्मक है।
theological_decisions:
- issue: μὴ θνητὸν ὄντα में नश्वरता का सामान्य मानवीय संदर्भ
  choice: नश्वर होकर घमंड से नहीं सोचना चाहिए
  alternative: और नश्वर मनुष्य को घमंडी नहीं होना चाहिए
  rationale: यूनानी पाठ किसी एक पुरुष तक सीमित कथन के बजाय नश्वर होने की दशा से निकला सामान्य नैतिक सिद्धांत देता है। चुना हुआ रूप इस व्यापकता तथा φρονεῖν के विचार-संबंधी भाव को सुरक्षित रखता है।
- issue: Δίκαιον का नैतिक अथवा उपयुक्तता-संबंधी बल
  choice: उचित है
  alternative: न्यायसंगत है / ठीक है
  rationale: पाठ में यह भाववाचक कथन है और ‘उचित’ नैतिक सहीपन तथा शोभनीयता के बीच की वास्तविक अर्थ-व्याप्ति को किसी एक दिशा में अत्यधिक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। शारीरिक कष्ट के वर्णन में ‘पीड़ाएँ’ और ‘दुर्गंध’ स्पष्ट हैं; प्रत्यक्ष कथन में संक्षिप्त किंतु औपचारिक भाषा रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
