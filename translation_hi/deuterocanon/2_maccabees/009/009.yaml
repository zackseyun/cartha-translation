base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/009.yaml
  text: so that worms even swarmed from the body of the ungodly man[a], and while he was still alive, in pains and agonies, his flesh fell away[b], and because of his stench the whole camp was burdened by the rottenness.
translation:
  language: hi
  text: फल यह हुआ कि उस भक्तिहीन मनुष्य के शरीर से कीड़े भी उमड़ने लगे[a]; और जब वह अभी जीवित ही था, पीड़ाओं और यातनाओं में, तो उसका मांस झड़ता जा रहा था[b]; और उसकी दुर्गन्ध के कारण सारी छावनी सड़न से बोझिल हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस भक्तिहीन मनुष्य के शरीर से कीड़े खौलकर ऊपर निकलने लगे।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “खौलकर ऊपर आना” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, उसके जीवित रहते हुए “उसका मांस झड़ता जा रहा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσσεβοῦς
  choice: भक्तिहीन मनुष्य
  rationale: यह शब्द केवल सामान्य दुष्टता नहीं, बल्कि परमेश्वर के प्रति श्रद्धा के अभाव को व्यक्त करता है। ‘भक्तिहीन’ उस धार्मिक-नैतिक अर्थ को आधुनिक हिन्दी में बनाए रखता है।
- source_word: σκώληκας ἀναζεῖν
  choice: कीड़े ... उमड़ने लगे
  rationale: ἀναζέω का शाब्दिक बिंब ‘खौलकर ऊपर आना’ है; शरीर से निकलते कीड़ों के प्रसंग में ‘उमड़ने लगे’ उस प्रबल, वीभत्स गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ζῶντος
  choice: वह अब भी जीवित था ... तभी
  rationale: यह रचना इस बात पर बल देती है कि शरीर का गलना और मांस का झड़ना उसकी मृत्यु से पहले ही हो रहा था।
- source_word: ἐν ὀδύναις καὶ ἀλγηδόσιν
  choice: पीड़ाओं तथा यातनाओं में
  rationale: दोनों संज्ञाएँ तीव्र शारीरिक कष्ट बताती हैं; हिन्दी में युग्म को बनाए रखते हुए ‘पीड़ाओं तथा यातनाओं’ से बढ़ती हुई तीव्रता प्रकट होती है।
- source_word: τὰς σάρκας αὐτοῦ διαπίπτειν
  choice: उसका मांस झड़ता जा रहा था
  rationale: σάρξ यहाँ वास्तविक देह-मांस है और διαπίπτω उसके अलग होकर गिरते जाने को दर्शाता है; अपूर्ण क्रिया-भाव को ‘झड़ता जा रहा था’ सुरक्षित रखता है।
- source_word: ὑπὸ δὲ τῆς ὀσμῆς αὐτοῦ ... τὴν σαπρίαν
  choice: उसकी दुर्गन्ध और सड़न से
  rationale: ὀσμή अपने आप में ‘गन्ध’ हो सकता है, पर सड़न के प्रसंग में ‘दुर्गन्ध’ उचित है। कठिन यूनानी रचना में σαπρία सड़ी हुई अवस्था को सूचित करती है; दोनों तत्व हिन्दी में स्पष्ट रखे गए हैं।
- source_word: πᾶν τὸ στρατόπεδον βαρύνεσθαι
  choice: सारी छावनी त्रस्त हो गई
  rationale: βαρύνεσθαι का मूल भाव बोझ से दबने या अत्यधिक प्रभावित होने का है। दुर्गन्ध के प्रसंग में ‘त्रस्त हो गई’ स्वाभाविक हिन्दी है और प्रभाव की तीव्रता बनाए रखता है।
theological_decisions:
- issue: δυσσεβοῦς द्वारा अन्तियोखुस का धार्मिक-नैतिक चित्रण
  choice: भक्तिहीन मनुष्य
  alternative: अधर्मी मनुष्य; दुष्ट मनुष्य
  rationale: ‘भक्तिहीन’ परमेश्वर के प्रति अनादर का आयाम बनाए रखता है, जबकि ‘दुष्ट’ अर्थ को केवल सामान्य नैतिक बुराई तक सीमित कर सकता है। ‘अधर्मी’ भी सम्भव है, पर वह हिन्दी पाठकों के लिए व्यापक सामाजिक या विधिक अर्थ ले सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वीभत्स शारीरिक वर्णन को नरम नहीं किया गया, किन्तु अस्वाभाविक शब्दशः अनुवाद से बचा गया है। यूनानी वाक्य की क्रमिक तीव्रता और उसके जीवित रहते हुए शरीर के विघटन पर दिया गया बल सुरक्षित है।
