  text: क्योंकि मुझे विश्वास है कि वह, मेरी इच्छा के अनुरूप न्यायोचित नरमी और मानवीयता के भाव से प्रवृत्त होकर[a], तुम्हारे साथ भी वैसा ही व्यवहार करेगा।
  philosophy: optimal-equivalence
