    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: मुझे विश्वास है
  rationale: पूर्णकालिक रूप वक्ता के दृढ़ और स्थिर भरोसे को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐπιεικῶς
  choice: उदारता
  rationale: यह शब्द न्यायोचित नरमी, सहनशीलता और विवेकपूर्ण उदारता का भाव रखता है; ‘उदारता’ सामान्य पाठक के लिए सहज रहते हुए इस व्यापक नैतिक गुण को व्यक्त करती है।
- source_word: φιλανθρώπως
  choice: मानवता
  rationale: यह लोगों के प्रति मानवीय, कृपालु और हितकारी भाव को दर्शाता है; ‘मानवता’ मूल के अर्थ और ἐπιεικῶς के साथ उसके युग्म को बनाए रखती है।
- source_word: συνσταθέντα
  choice: भाव अपनाएगा
  rationale: यह कठिन और संक्षिप्त कृदन्त किसी उद्देश्य के अनुरूप प्रवृत्त, स्थापित या ढाले जाने का संकेत देता है। ‘भाव अपनाएगा’ पठनीय हिन्दी में उस मानसिक अनुरूपता को व्यक्त करता है, जबकि पादटिप्पणी अन्य सम्भव समझ को सुरक्षित रखती है।
- source_word: τῇ ἐμῇ προαιρέσει
  choice: मेरे उद्देश्य के अनुसार
  rationale: προαίρεσις सोच-समझकर किए गए चुनाव, संकल्प या उद्देश्य को दर्शाता है; यह अनुवाद राजा की निश्चित मंशा और अनुरूपता दोनों को व्यक्त करता है।
- source_word: συνπεριενεχθήσεσθαι
  choice: तुम्हारे साथ भी उसी के अनुरूप व्यवहार करेगा
  rationale: यह भविष्यकालिक क्रिया किसी के प्रति उसी के अनुरूप आचरण करने का भाव देती है; ‘भी’ में συν- उपसर्ग का अनुरूप या सहभागी बल स्वाभाविक रूप से प्रकट होता है।
