  text: so that[a], if anything unexpected should happen and some difficulty should arise, those in the country, knowing to whom the affairs have been entrusted, may not be thrown into confusion;
translation:
  language: hi
  text: ताकि यदि कोई अप्रत्याशित बात हो जाए और कोई कठिन परिस्थिति आ पड़े, तो देश के लोग यह जानते हुए कि राज-काज किसे सौंपा गया है[a], व्याकुल न हों;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राज-काज किसके पास छोड़ा गया है।” यूनानी के पूर्ण निष्क्रिय रूप में केवल किसी के पास छोड़ देने या औपचारिक रूप से उत्तरदायित्व सौंपने—दोनों में से किसी पर बल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्य सूचक संयोजक है; ‘ताकि’ आधुनिक हिन्दी में इसके प्रयोजनार्थक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐάν τι παράδοξον ἀποβῇ
  choice: यदि कोई अनहोनी हो जाए
  rationale: παράδοξον यहाँ अप्रत्याशित या असामान्य घटना को दर्शाता है। राजा की संभावित मृत्यु या संकट के संदर्भ में ‘अनहोनी’ संक्षिप्त और स्वाभाविक है, यद्यपि इसमें अशुभ घटना का भाव भी आता है।
- source_word: προσπέλθῃ τι δυσχερές
  choice: कोई कठिन परिस्थिति आ पड़े
  rationale: दूसरा संकटसूचक वाक्यांश पहले के समानांतर है। ‘आ पड़े’ προσπέλθῃ की आकस्मिक निकटता और ‘कठिन परिस्थिति’ δυσχερές के कष्टकर स्वरूप को सहज हिन्दी में व्यक्त करते हैं।
- source_word: εἰδότες
  choice: यह जानकर
  rationale: परिस्थितिजन्य कृदन्त का सम्बन्ध देश के लोगों से है; ‘यह जानकर’ उसके साधन अथवा कारणात्मक संबंध को संक्षेप में बनाए रखता है।
- source_word: οἱ κατὰ τὴν χώραν
  choice: देश के लोग
  rationale: χώρα यहाँ व्यापक राज्यक्षेत्र के निवासियों की ओर संकेत करता है; ‘देश के लोग’ सामान्य पाठक के लिए सहज और पर्याप्त रूप से व्यापक है।
- source_word: ᾧ καταλέλειπται τὰ πράγματα
  choice: राज-काज किसे सौंपा गया है
  rationale: τὰ πράγματα राजनीतिक संदर्भ में राज्य के मामले या शासन-कार्य हैं। ‘राज-काज’ इसे स्वाभाविक हिन्दी में व्यक्त करता है; ‘सौंपा गया’ पूर्ण निष्क्रिय रूप में छोड़े जाने और उत्तरदायित्व सौंपे जाने, दोनों संभावनाओं में से प्रसंगानुकूल उत्तरदायित्व को सामने रखता है।
- source_word: μὴ ἐπιταράσσωνται
  choice: घबरा न जाएँ
  rationale: क्रिया तीव्र व्याकुलता या अशांति व्यक्त करती है। ‘घबरा न जाएँ’ जनसामान्य की मानसिक और सामाजिक अस्थिरता को प्राकृतिक हिन्दी में व्यक्त करता है, बिना अनिवार्य रूप से सार्वजनिक उपद्रव जोड़ने के।
