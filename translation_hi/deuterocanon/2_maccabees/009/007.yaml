base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/007.yaml
  text: But he in no way ceased from his arrogance[a]; rather, he was filled even more with pride, breathing fire in his rage against the Jews and ordering the journey to be hastened. Then it happened that he fell from the chariot as it was rushing along, and in the hard fall[b] all the limbs of his body were wrenched out of joint.
translation:
  language: hi
  text: पर वह अपने दंभ से तनिक भी बाज़ नहीं आया; उलटे, वह और भी घमंड से भर गया। वह यहूदियों के विरुद्ध क्रोध में आग उगलता हुआ यात्रा को और तेज़ करने का आदेश दे रहा था[a]। तभी ऐसा हुआ कि वह तेज़ी से दौड़ते रथ से गिर पड़ा, और इतनी बुरी तरह गिरा कि उसके शरीर के सारे अंग जोड़ों से उखड़ गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कूच और तेज़ करने का आदेश दे रहा था।” यूनानी शब्द πορία का अर्थ प्रसंग के अनुसार यात्रा, प्रयाण या कूच हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके शरीर के सारे अंग अपने जोड़ों से उतर गए।” यहाँ प्रयुक्त दुर्लभ यूनानी क्रिया सम्भवतः गिरने से अंगों के हिंसक रूप से जोड़ से अलग हो जाने का वर्णन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδαμῶς ... ἔληγεν
  choice: तनिक भी बाज़ नहीं आया
  rationale: यह स्वाभाविक आधुनिक हिन्दी में प्रबल निषेध और किसी व्यवहार को न छोड़ने—दोनों भाव व्यक्त करता है।
- source_word: ἀγερωχίας
  choice: दंभ
  rationale: यह घमंडपूर्ण और दबंग आत्म-महत्त्व का नैतिक भाव देता है तथा अगले समानार्थी यूनानी शब्द से भेद बनाए रखता है।
- source_word: ὑπερηφανίας ἐπεπλήρωτο
  choice: और भी घमंड से भर गया
  rationale: ‘और भी’ ἔτι δὲ καί की तीव्रता और ‘भर गया’ पूर्णतः अभिभूत होने का भाव प्रकट करता है।
- source_word: πῦρ πνέων τοῖς θυμοῖς
  choice: क्रोध में आग उगलता हुआ
  rationale: मूल के सजीव रूपक को सहज हिन्दी मुहावरे में सुरक्षित रखता है।
- source_word: κελεύων ἐποξύνειν τὴν πορίαν
  choice: यात्रा की गति और तेज़ करने का आदेश दे रहा था
  rationale: πορία को प्रसंगानुसार ‘यात्रा’ और ἐποξύνειν को गति बढ़ाने की आज्ञा के रूप में व्यक्त करता है; ‘कूच’ सम्भव विकल्प है।
- source_word: ἅρματος φερομένου ῥοίζῳ
  choice: तेज़ी से दौड़ते रथ
  rationale: रथ की तीव्र गति को स्वाभाविक हिन्दी में व्यक्त करता है; ῥοίζῳ की सनसनाती ध्वनि को अलग से जोड़ने पर वाक्य असहज होता।
- source_word: δυσχερεῖ πτώματι περιπεσόντα
  choice: उस भीषण गिरावट के कारण
  rationale: दुर्घटना की गंभीरता और उसके परिणाम का सम्बन्ध स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: πάντα τὰ μέλη τοῦ σώματος ἀποσφύζειν
  choice: उसके शरीर के सारे अंग जोड़ों से उखड़ गए
  rationale: दुर्लभ क्रिया से सूचित हिंसक विस्थापन को स्पष्ट करता है, जबकि पादटिप्पणी अपेक्षाकृत चिकित्सकीय विकल्प देती है।
theological_decisions:
- issue: अन्तियोकुस के नैतिक चरित्र-चित्रण में ἀγερωχία और ὑπερηφανία का भेद
  choice: ‘दंभ’ और ‘घमंड’—दो सम्बद्ध पर अलग शब्द बनाए रखना
  alternative: दोनों के लिए केवल ‘घमंड’ या केवल ‘अहंकार’ कहना
  rationale: मूल यूनानी दो अलग किन्तु सम्बद्ध संज्ञाओं द्वारा उसके अभिमान की वृद्धि दिखाता है; उन्हें एक शब्द में मिला देने से यह अलंकारिक और नैतिक प्रगति दब जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘आग उगलता हुआ’ मूल रूपक को जीवंत रखता है; ‘दंभ’ और ‘घमंड’ मूल के दो अभिमान-सूचक शब्दों का भेद बनाए रखते हैं।
