  - severity: low
    issue: Rendering of the severe fall
    rationale: ‘उस भीषण गिरावट के कारण’ is somewhat abstract and makes the relation chiefly causal. ‘इतनी बुरी तरह गिरा कि’ expresses the severe fall and its bodily consequence in more idiomatic Hindi, while preserving the narrative force of δυσχερεῖ πτώματι περιπεσόντα.
