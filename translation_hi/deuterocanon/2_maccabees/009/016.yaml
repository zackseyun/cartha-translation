base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/016.yaml
  text: And the holy temple[a], which he had formerly plundered, he would adorn with the finest votive offerings, and he would restore all the sacred vessels many times over, and from his own revenues he would provide the expenses required for the sacrifices[b];
translation:
  language: hi
  text: और जिस पवित्र मंदिर को उसने पहले लूटा था, उसे वह सबसे सुंदर समर्पित भेंटों[a] से सजाएगा, सभी पवित्र पात्रों की कई गुना भरपाई करेगा[b], और बलिदानों के लिए आवश्यक खर्च अपने ही राजस्व से उठाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यानी मंदिर में समर्पित करके रखी जाने वाली भेंटें। यूनानी शब्द विशेष रूप से ऐसी अर्पित वस्तुओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “सभी पवित्र पात्र कई गुना लौटा देगा।” इसका भाव केवल उनके बदले नए पात्र देना नहीं, बल्कि कई गुना प्रतिपूर्ति करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκύλευεν
  choice: उसने पहले लूटा था
  rationale: अपूर्ण भूतकाल उसके पहले के लूटने के काम को वर्तमान प्रतिज्ञा के विपरीत रखता है; हिंदी में यह पूर्वकालिक भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἅγιον ναὸν
  choice: पवित्र मंदिर
  rationale: यह यरूशलेम के पवित्र मंदिर को सूचित करता है और धार्मिक-सांस्कृतिक विशिष्टता बनाए रखता है।
- source_word: καλλίστοις ἀναθήμασιν
  choice: सबसे सुंदर मन्नत की भेंटों
  rationale: καλλίστοις के श्रेष्ठताबोध और मंदिर में समर्पित ἀναθήματα के विशिष्ट अर्थ—दोनों को व्यक्त करता है।
- source_word: κοσμήσειν
  choice: सजाएगा
  rationale: समर्पित भेंटों से मंदिर को सुशोभित करने की प्रतिज्ञा का सहज हिंदी रूप।
- source_word: τὰ ἱερὰ σκεύη
  choice: पवित्र पात्रों
  rationale: मंदिर की उपासना में प्रयुक्त पवित्र उपकरणों के लिए प्रचलित और गरिमापूर्ण अभिव्यक्ति।
- source_word: πολυπλάσια πάντα ἀποδώσειν
  choice: सभी पवित्र पात्रों का कई गुना लौटाएगा
  rationale: सिर्फ वस्तुओं की जगह भरने के बजाय बहुगुणित प्रतिपूर्ति का जोर सुरक्षित रखता है।
- source_word: τὰς ... συντάξεις ἐπιβαλλούσας πρὸς τὰς θυσίας
  choice: बलिदानों के लिए आवश्यक खर्च
  rationale: बलिदानों के संबंध में देय या जरूरी आर्थिक प्रबंध को साधारण आधुनिक हिंदी में स्पष्ट करता है।
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: अपनी आय से
  rationale: उसके अपने राजस्व या आमदनी से भुगतान किए जाने के वित्तीय भाव को संक्षेप में व्यक्त करता है।
- source_word: χορηγήσειν
  choice: देगा
  rationale: अपने खर्च पर आवश्यक धन उपलब्ध कराने का अर्थ संदर्भ से स्पष्ट है; 'देगा' सरल और स्वाभाविक है।
theological_decisions:
- issue: मंदिर की उपासना से जुड़ी शब्दावली
  choice: '''पवित्र मंदिर,'' ''मन्नत की भेंटें,'' ''पवित्र पात्र,'' और ''बलिदान'' जैसी स्पष्ट धार्मिक शब्दावली'
  alternative: '''धार्मिक भवन,'' ''उपहार,'' या ''सामान'' जैसी सामान्यीकृत भाषा'
  rationale: पद यरूशलेम के मंदिर और उसकी बलिदान-व्यवस्था से संबंधित है; विशिष्ट शब्दावली ऐतिहासिक और धार्मिक संदर्भ को बिना किसी बाद की सांप्रदायिक व्याख्या के सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखा गया है। यूनानी अप्रत्यक्ष कथन के भविष्यगत आशय को हिंदी में भविष्यकाल से व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
