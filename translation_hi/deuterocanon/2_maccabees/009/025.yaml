base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/025.yaml
  text: Moreover[a], considering the rulers nearby and those bordering the kingdom, who are watching for opportunities and awaiting what will happen, I have appointed my son Antiochus as king, whom, when I repeatedly went up to the upper satrapies, I often entrusted and commended to most of you[b]. And I have written to him the things written below.
translation:
  language: hi
  text: इसके अतिरिक्त, अपने आस-पास के शासकों और राज्य के पड़ोसी शासकों[a] पर विचार करते हुए—जो उचित अवसर की ताक में हैं और यह देखने की प्रतीक्षा कर रहे हैं कि क्या होगा—मैंने अपने पुत्र अन्तियोकुस को राजा नियुक्त किया है। ऊपरी क्षत्रपियों[b] की ओर बार-बार जाते समय मैं उसे आप में से अधिकांश को सौंपता और उसकी सिफारिश करता था। मैंने उसे नीचे लिखी बातें भी लिखी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में आस-पास के शासकों के लिए दो मिलती-जुलती भौगोलिक अभिव्यक्तियाँ एक साथ आई हैं; इससे राज्य को घेरे हुए बाहरी शासकों पर बल पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: ‘क्षत्रपी’ फ़ारसी मूल का एक प्रशासनिक पद है। यहाँ ‘ऊपरी क्षत्रपियाँ’ संभवतः भीतरी या पूर्वी प्रांतों के लिए प्रयुक्त नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: κατανοῶν
  choice: पर विचार करते हुए
  rationale: यह क्रिया केवल देखने नहीं, बल्कि परिस्थिति का सोच-समझकर आकलन करने का भाव देती है।
- source_word: τοὺς παρακειμένους δυνάστας καὶ γειτνιῶντας τῆς βασιλείας
  choice: अपने आस-पास के शासकों और राज्य की सीमा से लगे शासकों
  rationale: δυνάστας को अमूर्त ‘शक्तियाँ’ के बजाय राजनीतिक शासकों के रूप में रखा गया है और यूनानी की दोहराती भौगोलिक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: τοῖς καιροῖς ἐπέχοντας
  choice: जो उचित अवसर की ताक में हैं
  rationale: καιρός यहाँ अनुकूल या निर्णायक अवसर का संकेत करता है और ἐπέχω सतर्कता से उस पर दृष्टि लगाए रहने का।
- source_word: προσδοκῶντας τὸ ἀποβησόμενον
  choice: यह देखने की प्रतीक्षा कर रहे हैं कि क्या होगा
  rationale: यह भावी परिणाम को खुला रखता है और राजनीतिक घटनाक्रम की प्रतीक्षा का स्वाभाविक हिन्दी रूप है।
- source_word: ἀναδέδειχα
  choice: नियुक्त कर दिया है
  rationale: राजकीय उत्तराधिकार के संदर्भ में यह औपचारिक पद-निर्धारण व्यक्त करता है।
- source_word: ἀνατρέχων εἰς τὰς ἄνω σατραπίας
  choice: ऊपरी क्षत्रपियों की ओर बार-बार जाते समय
  rationale: ἀνατρέχων की पुनरावृत्तिमूलक शक्ति और ἄνω का ‘ऊपरी’ अर्थ रखा गया है; σατραπία के ऐतिहासिक प्रशासनिक अर्थ को भी सुरक्षित रखा गया है।
- source_word: παρεκατετίθεμην καὶ συνίστων
  choice: सौंपता और उसकी सिफारिश करता था
  rationale: पहली क्रिया किसी की देखरेख या संरक्षण में सौंपने और दूसरी उसके पक्ष में परिचय अथवा अनुशंसा करने का भाव देती है; दोनों को अलग रखा गया है।
- source_word: τὰ ὑπογεγραμμένα
  choice: नीचे लिखी बातें
  rationale: यह पत्र में आगे आने वाली सामग्री का दस्तावेजी संकेत है।
