  text: And a decree went out to the neighboring Greek cities[a], at the suggestion of Ptolemy, to follow the same policy against the Jews, and to kill them,
translation:
  language: hi
  text: फिर टॉलेमी के प्रस्ताव पर आस-पास के यूनानी नगरों के लिए यह आदेश जारी हुआ कि वे यहूदियों के विरुद्ध वही नीति अपनाएँ और उन्हें मार डालें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया में अंतड़ियाँ निकालने या विदीर्ण करने की अत्यन्त क्रूर छवि है; यहाँ इसका अर्थ क्रूरतापूर्वक मार डालना है।
    reason: मूल क्रिया की असाधारण, ग्राफिक हिंसक छवि को सुरक्षित रखना।
lexical_decisions:
- source_word: ψήφισμα
  choice: आदेश
  rationale: यह शब्द किसी औपचारिक सार्वजनिक निर्णय या अधिनियम को दर्शाता है; आधुनिक हिन्दी में ‘आदेश’ स्पष्ट और स्वाभाविक है।
- source_word: ἐξῆλθεν
  choice: जारी हुआ
  rationale: आदेश के प्रचारित या लागू किए जाने के यूनानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀστυγείτονας Ἑλληνίδας πόλεις
  choice: आस-पास के यूनानी नगरों
  rationale: विशेषण निकटवर्ती नगरों को और Ἑλληνίδας उनकी यूनानी सांस्कृतिक-राजनीतिक पहचान को दर्शाता है।
- source_word: Πτολεμαίου ὑποθεμένου
  choice: टॉलेमी के प्रस्ताव पर
  rationale: सम्बन्धकारक निरपेक्ष रचना टॉलेमी को इस उपाय का प्रस्ताव रखने वाला बताती है।
- source_word: τὴν αὐτὴν ἀγωγὴν … ἄγειν
  choice: वही नीति अपनाएँ
  rationale: यहाँ ἀγωγή व्यवहार या कार्यवाही की निर्धारित रीति है; ‘नीति अपनाएँ’ प्रशासनिक संदर्भ में संक्षिप्त और स्वाभाविक है।
- source_word: σπλαγχνίζειν
  choice: उन्हें बलि का मांस खाने पर बाध्य करें
  rationale: क्रिया मूलतः अंतड़ियाँ, विशेषतः बलि-पशु के भीतर के अंग, खाने से जुड़ी है। निकटवर्ती संदर्भ यहूदियों को बलिदानों में भाग लेने और निषिद्ध भोजन खाने को विवश किए जाने का है; इसलिए इसे हत्या के अर्थ में नहीं लिया गया।
theological_decisions:
- issue: σπλαγχνίζειν का आशय
  choice: यहूदियों को बलि का मांस खाने पर बाध्य करना
  alternative: उन्हें मार डालना / उनकी अंतड़ियाँ निकालना
  rationale: यूनानी क्रिया का सीधा संबंध अंतड़ियाँ खाने, विशेषतः बलि-भोज में भाग लेने, से है। पद का संदर्भ यहूदियों पर थोपी गई धार्मिक प्रथा है; हत्या वाला अर्थ इस वाक्य में कम समर्थित है। ‘बाध्य करें’ κατὰ τῶν Ἰουδαίων और उसी नीति को लागू करने के प्रसंग में निहित लक्ष्य को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘टॉलेमी’ प्रचलित ऐतिहासिक नाम का देवनागरी रूप है। मुख्य पाठ में संदर्भगत आशय दिया गया है और यूनानी क्रिया की अधिक शाब्दिक छवि पादटिप्पणी में सुरक्षित है।
