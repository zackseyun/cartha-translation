base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/004.yaml
  text: For the sanctuary was filled by the Gentiles with debauchery and revelry, boldly carousing with prostitutes, approaching women in the sacred precincts, and even bringing inside things that were not proper.
translation:
  language: hi
  text: क्योंकि अन्यजातियों ने पवित्रस्थान को लंपटता और रंगरेलियों से भर दिया था। वे वेश्याओं[a] के साथ निर्लज्ज होकर मौज-मस्ती करते, पवित्र परिसरों में स्त्रियों के पास जाते[b], और ऐसी वस्तुएँ भी भीतर ले आते थे जो उचित नहीं थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गणिकाओं’; यूनानी शब्द ऐसी स्त्रियों के लिए प्रयुक्त हो सकता है जिन्हें यौन संगति के लिए रखा जाता था।
    reason: lexical_alternative
  - marker: b
    text: ‘स्त्रियों के पास जाते’ से यहाँ संभवतः पवित्र परिसरों में यौन रूप से अनुचित आचरण का संकेत है, यद्यपि यूनानी शब्दावली ‘स्त्रियों से संबंध बनाते’ जितनी स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: पवित्रस्थान
  rationale: यहाँ यरूशलेम के मंदिर को पवित्र उपासना-स्थल के रूप में दिखाया गया है। ‘पवित्रस्थान’ उसके धार्मिक और स्थानिक दोनों अर्थों को बनाए रखता है।
- source_word: ἀσωτίας
  choice: लंपटता
  rationale: यह शब्द बेलगाम नैतिक और भोग-विलासी आचरण को व्यक्त करता है; ‘लंपटता’ प्रसंग में निहित नैतिक और यौन भ्रष्टता को संक्षेप में बताता है।
- source_word: κώμων
  choice: रंगरेलियों
  rationale: बहुवचन शब्द उच्छृंखल उत्सव और मदमस्त मौज-मस्ती का बोध कराता है। ‘रंगरेलियाँ’ आधुनिक हिन्दी में उस अनैतिक उत्सवी व्यवहार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐθνῶν
  choice: अन्यजातियों
  rationale: यह यहूदी प्रसंग में गैर-यहूदियों को सूचित करता है। ‘अन्यजातियों’ से जातीय-धार्मिक भेद बना रहता है, जबकि ‘मूर्तिपूजकों’ जैसा अनावश्यक अतिरिक्त अर्थ नहीं जुड़ता।
- source_word: θρασυνόντων
  choice: निर्लज्ज होकर
  rationale: कृदंत उद्दंड, ढीठ और बेधड़क व्यवहार का ढंग बताता है। ‘निर्लज्ज होकर’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἑταίρων
  choice: वेश्याओं
  rationale: हेलेनिस्टिक प्रयोग में ἑταίρα प्रायः यौन संगति देने वाली गणिका या वेश्या के लिए आता है; मंदिर के अपवित्रीकरण का प्रसंग इसी अर्थ का समर्थन करता है।
- source_word: ἐν τοῖς ἱεροῖς
  choice: पवित्र परिसरों में
  rationale: बहुवचन मंदिर के पवित्र क्षेत्रों को व्यापक रूप से सूचित करता है। यह अनुवाद किसी विशेष स्थापत्य भाग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: γυναιξὶ πλησιαζόντων
  choice: स्त्रियों के निकट जाते
  rationale: क्रिया का मूल अर्थ ‘निकट जाना’ है। प्रसंग यौन अनुचितता का संकेत देता है, पर मुख्य पाठ में मूल यूनानी से अधिक स्पष्टता नहीं जोड़ी गई।
- source_word: τὰ μὴ καθήκοντα
  choice: ऐसी वस्तुएँ जिन्हें वहाँ लाना उचित नहीं था
  rationale: यूनानी वाक्यांश जानबूझकर व्यापक है और अनुचित वस्तुओं या बातों का संकेत देता है; इसे केवल विधि-विरुद्ध वस्तुओं तक सीमित नहीं किया गया।
- source_word: ἔνδον εἰσφερόντων
  choice: भीतर ... ले आते थे
  rationale: यह पवित्र क्षेत्र के अंदर अनुचित वस्तुएँ पहुँचाने पर बल देता है और हिन्दी में सहज है।
theological_decisions:
- issue: यहूदी पवित्रस्थान के अपवित्रीकरण के प्रसंग में ἐθνῶν का अनुवाद
  choice: अन्यजातियों
  alternative: राष्ट्रों; मूर्तिपूजकों
  rationale: ‘अन्यजातियों’ गैर-यहूदी समूहों के साथ प्रसंगगत विरोध को बनाए रखता है, पर यूनानी से अधिक निंदात्मक धार्मिक अर्थ नहीं जोड़ता।
- issue: πλησιαζόντων में यौन दुराचार को कितना स्पष्ट किया जाए
  choice: स्त्रियों के निकट जाते
  alternative: स्त्रियों से यौन-संबंध बनाते; स्त्रियों के साथ संसर्ग करते
  rationale: प्रसंग यौन दुराचार का प्रबल संकेत देता है, किंतु यूनानी क्रिया स्वयं सीधे यौन-संबंध नहीं कहती। इसलिए मुख्य पाठ स्रोत की अप्रत्यक्षता को बनाए रखता है और संकेत को पादटिप्पणी में स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्रस्थान’ और ‘पवित्र परिसर’ धार्मिक संदर्भ को सुरक्षित रखते हैं; यौन अपवित्रीकरण को प्रसंगानुसार व्यक्त किया गया है, पर जहाँ यूनानी अप्रत्यक्ष है वहाँ अनावश्यक स्पष्टता नहीं जोड़ी गई।
