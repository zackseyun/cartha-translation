review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the sanctuary’s defilement by non-Jews, debauchery and revelry, brazen association with courtesans, the deliberately non-explicit approach to women in sacred areas, and the bringing in of improper things. However, the final relative clause shifts the Greek description of the things themselves ('things not fitting/proper') into a statement that the act of bringing them there was improper.
  naturalness: The Hindi is generally fluent, modern, and suitably grave. ‘स्त्रियों के पास जाते’ is slightly more idiomatic than ‘स्त्रियों के निकट जाते’ while retaining the Greek expression’s restraint.
  terminology: ‘अन्यजातियों,’ ‘पवित्रस्थान,’ ‘लंपटता,’ ‘रंगरेलियाँ,’ and ‘वेश्याओं’ are contextually appropriate. The alternative ‘गणिकाओं’ in the footnote usefully signals the semantic range of ἑταίρων. ‘पवित्र परिसरों’ appropriately preserves the plural sacred locales without asserting a particular temple area.
  issues:
  - severity: medium
    issue: The wording ‘जिन्हें वहाँ लाना उचित नहीं था’ makes the impropriety primarily that of bringing the items into that place.
    rationale: τὰ μὴ καθήκοντα directly characterizes the things as ‘not fitting/proper’; ἔνδον separately supplies the inward movement. Rendering these as ‘ऐसी वस्तुएँ ... जो उचित नहीं थीं’ better retains the source syntax and breadth.
  - severity: low
    issue: ‘स्त्रियों के निकट जाते’ is somewhat stiff in modern Hindi.
    rationale: ‘स्त्रियों के पास जाते’ is natural modern usage and retains the non-explicit force of γυναιξὶ πλησιαζόντων. The footnote continues to give the contextual sexual implication without overstating the Greek.
