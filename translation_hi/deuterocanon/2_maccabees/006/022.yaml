lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह प्रयोजन सूचक है; ‘ताकि’ आधुनिक हिन्दी में इसके आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦτο πράξας
  choice: ऐसा करके
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया से पहले किए गए काम को बताता है। यहाँ ‘ऐसा करके’ संक्षिप्त और स्वाभाविक है तथा साधन/परिस्थिति का संबंध भी बनाए रखता है।
- source_word: ἀπολυθῇ τοῦ θανάτου
  choice: मृत्यु से बच जाए
  rationale: ἀπολύω का मूल भाव छोड़ देना या मुक्त करना है। संदर्भ में आशय मृत्युदंड से बख्शे जाने का है; ‘मृत्यु से बच जाए’ हिन्दी में स्पष्ट है और परलोक-संबंधी अर्थ नहीं जोड़ता।
- source_word: διὰ τὴν ἀρχαίαν πρὸς αὐτοὺς φιλίαν
  choice: उनके साथ अपनी पुरानी मित्रता के कारण
  rationale: यूनानी संरचना में मित्रता का रुख ‘उनकी ओर/उनके साथ’ है और स्वाभाविक कर्ता एलीआज़र है। यह अनुवाद संबंध को स्पष्ट रखते हुए ἀρχαίαν का अर्थ ‘पुरानी’ से व्यक्त करता है।
- source_word: τύχοι φιλανθρωπίας
  choice: दयालु व्यवहार पाए
  rationale: τυγχάνω के साथ संबंधकारक का अर्थ ‘प्राप्त करना’ है और φιλανθρωπία यहाँ दया, सद्भाव या मानवीय व्यवहार को सूचित करता है। ‘दयालु व्यवहार पाए’ व्यक्ति के प्रति किए जाने वाले व्यवहार को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मृत्यु से मुक्ति का आशय
  choice: मृत्यु से बच जाए
  alternative: मृत्युदंड से छोड़ दिया जाए
  rationale: यह कथा के तत्काल संदर्भ में फाँसी या मृत्युदंड से बचाए जाने की बात है, न कि उद्धार या मृत्यु के बाद के जीवन की। मुख्य पाठ स्वाभाविक रखा गया है और अधिक स्पष्ट कानूनी अर्थ पादटिप्पणी में दिया गया है।
- issue: पुरानी मित्रता किसकी थी
  choice: उनके साथ अपनी पुरानी मित्रता
  alternative: उसके साथ उनकी पुरानी मित्रता
  rationale: πρὸς αὐτούς शाब्दिक रूप से ‘उनकी ओर’ है और प्रसंग में एलीआज़र की उनके साथ चली आ रही मित्रता समझी जा सकती है। संबंध पारस्परिक है, इसलिए वैकल्पिक दृष्टि संभव है; अनुवाद यूनानी वाक्य-विन्यास के निकट रहते हुए स्वाभाविक हिन्दी देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘मृत्यु से बच जाए’ और ‘दयालु व्यवहार पाए’ मूल अर्थ को स्वाभाविक हिन्दी में रखते हैं, जबकि पादटिप्पणियाँ कानूनी और शाब्दिक विकल्प स्पष्ट करती हैं।
