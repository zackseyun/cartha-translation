lexical_decisions:
- source_word: διόπερ
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀνδρείως
  choice: साहस के साथ
  rationale: क्रियाविशेषण के रूप में साहसी ढंग से जीवन त्यागने का भाव सुरक्षित रहता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: νῦν
  choice: अब
  rationale: यूनानी पाठ में वर्तमान निर्णायक घड़ी पर दिए गए बल को बनाए रखता है।
- source_word: ἀλλάξας τὸν βίον
  choice: अपना जीवन त्यागकर
  rationale: शाब्दिक अर्थ ‘जीवन बदलकर’ है, पर इस प्रसंग में यह मृत्यु स्वीकार करने का विनम्र संकेत है; ‘जीवन त्यागकर’ वही आशय स्पष्ट और गरिमापूर्ण ढंग से देता है।
- source_word: τοῦ μὲν γήρως ἄξιος φανήσομαι
  choice: मैं दिखा दूँगा कि मैं अपने बुढ़ापे के योग्य हूँ
  rationale: φανήσομαι के ‘प्रकट/सिद्ध होना’ भाव और वृद्धावस्था के अनुरूप आचरण की नैतिक धारणा, दोनों को सुरक्षित रखता है। μέν आगे आने वाले समांतर कथन से जुड़ा है, इसलिए इस अपूर्ण पद में अलग से ‘एक ओर’ जोड़ना हिन्दी में अस्वाभाविक होता।
theological_decisions:
- issue: स्वेच्छा से मृत्यु स्वीकार करने का वर्णन
  choice: अपना जीवन त्यागकर
  alternative: अपने जीवन का अंत करके
  rationale: पाठ यातना के सामने साहसी आत्मसमर्पण का वर्णन करता है, प्रत्यक्ष आत्महत्या का नहीं; चुना हुआ रूप मूल की शिष्टोक्ति को बनाए रखता है और अनावश्यक धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
