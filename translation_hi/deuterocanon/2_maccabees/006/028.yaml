  yaml_path: translation/deuterocanon/2_maccabees/006/028.yaml
  text: thus leaving to the young a noble example of dying willingly and bravely for the revered and holy laws. And after saying these things[a], he immediately went to the rack,
translation:
  language: hi
  text: इस प्रकार वे युवाओं के लिए आदरणीय और पवित्र व्यवस्थाओं के लिए स्वेच्छा और साहस से प्राण देने का एक उदात्त उदाहरण छोड़ गए। इतना कहकर वे तुरंत यातना-चक्र[a] पर चले गए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द τύμπανον का शाब्दिक अर्थ ‘ढोल’ है। यहाँ यह यातना के एक उपकरण को सूचित करता है; उसके ठीक रूप की पहचान निश्चित नहीं है, इसलिए ‘यातना-चक्र’ एक संदर्भानुकूल अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ νέοις
  choice: युवाओं के लिए
  rationale: दत्तिव यहाँ लाभ अथवा संदर्भ का भाव देता है। νέοις को केवल पुरुषों तक सीमित किए बिना सामान्य रूप से युवा लोगों के अर्थ में रखा गया है।
- source_word: ὑπόδειγμα γενναῖον
  choice: एक उत्तम उदाहरण
  rationale: ὑπόδειγμα उदाहरण या आदर्श है और γενναῖον में श्रेष्ठता, उदात्तता तथा साहस का भाव है। सहज हिन्दी में ‘उत्तम उदाहरण’ नैतिक गरिमा को व्यक्त करता है; साहस का भाव आगे ‘साहसपूर्वक’ में स्पष्ट है।
- source_word: καταλελοιπὼς
  choice: छोड़ दिया
  rationale: पूर्णकालिक कृदन्त ऐसे उदाहरण का भाव देता है जो उनके बाद भी बना रहता है; हिन्दी में ‘छोड़ दिया’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς τὸ ... ἀπευθανατίζειν
  choice: कैसे प्राण देना चाहिए
  rationale: εἰς τό के साथ क्रियार्थक संज्ञा प्रयोजन अथवा परिणामी आदर्श का संकेत देती है। विरल और तीव्र ἀπευθανατίζειν मृत्यु को अंत तक स्वीकार करने का भाव रखता है; ‘प्राण देना’ प्रसंगानुकूल है और ‘कैसे ... चाहिए’ उदाहरण के अनुकरणीय स्वर को प्रकट करता है।
- source_word: προθύμως
  choice: स्वेच्छा से
  rationale: यह तत्परता और इच्छा से किए जाने का भाव देता है, अनुचित उत्साह का नहीं।
- source_word: γενναίως
  choice: साहसपूर्वक
  rationale: यह मृत्यु स्वीकार करने की रीति को वीरता और धैर्य के साथ व्यक्त करता है।
- source_word: ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων
  choice: आदरणीय और पवित्र व्यवस्थाओं के लिए
  rationale: ὑπέρ पक्ष या हेतु को बताता है; σεμνῶν गरिमा और श्रद्धा के योग्य होने का, तथा ἁγίων पवित्रता का बोध कराता है। νόμων बहुवचन को ‘व्यवस्थाओं’ से सुरक्षित रखा गया है।
- source_word: τοσαῦτα δὲ εἰπών
  choice: इतना कहकर
  rationale: यह हिन्दी में स्वाभाविक participial transition है और τοσαῦτα के ‘इतनी बातें’ वाले भाव को संक्षेप में रखता है।
- source_word: ἐπὶ τὸ τύμπανον
  choice: यातना-चक्र के पास
  rationale: τύμπανον का मूल अर्थ ढोल है, पर इस प्रसंग में यह संभवतः ढोल या चक्र के आकार का यातना-उपकरण है। ‘यातना-चक्र’ मूल बिंब और कार्य दोनों को रखता है, जबकि टिप्पणी अनिश्चितता स्पष्ट करती है।
- source_word: εὐθέως ἦλθεν
  choice: तुरंत ... चले गए
  rationale: εὐθέως तत्कालता बताता है और ἦλθεν यहाँ यातना-उपकरण की ओर गति को सूचित करता है। आदरसूचक बहुवचन आधुनिक हिन्दी में वृद्ध एलियाज़ार के लिए स्वाभाविक है।
theological_decisions:
- issue: शहादत और व्यवस्था का मूल्यांकन
  choice: ‘आदरणीय और पवित्र व्यवस्थाओं’ तथा ‘स्वेच्छा से और साहसपूर्वक ... प्राण देना’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: मूल्यांकन को नरम कर ‘सम्मानित नियमों’ या ‘दृढ़ता से मरना’ कहना।
  rationale: यूनानी पाठ स्वयं व्यवस्थाओं को σεμνῶν καὶ ἁγίων कहता और एलियाज़ार की मृत्यु को अनुकरणीय ठहराता है। अनुवाद को इस नैतिक-धार्मिक मूल्यांकन को निष्प्रभावी नहीं करना चाहिए।
- issue: उदाहरण की निर्देशात्मक शक्ति
  choice: ‘कैसे प्राण देना चाहिए’
  alternative: ‘प्राण देने का उदाहरण’
  rationale: मूल εἰς τὸ ... ἀπευθανατίζειν में प्रयोजन/परिणाम की कुछ लचक है। ‘कैसे ... चाहिए’ युवाओं के लिए छोड़े गए अनुकरणीय आदर्श को स्वाभाविक हिन्दी में सामने लाता है, बिना किसी अतिरिक्त सांप्रदायिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘व्यवस्थाओं’ से νόμων का बहुवचन सुरक्षित है। वृद्ध एलियाज़ार के लिए आदरसूचक ‘उन्होंने/गए’ प्रयुक्त हुआ है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
