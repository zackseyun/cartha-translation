translation:
  language: hi
  text: परन्तु जो लोग यूनानी रीति-रिवाज अपनाने का चुनाव नहीं करते थे, उन्हें मार डाला जाना था। इस प्रकार उस समय की दुर्दशा देखी जा सकती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ προαιρουμένους
  choice: जो लोग ... अपनाना नहीं चाहते थे
  rationale: प्रोआइरेओमाइ जान-बूझकर चुनाव या इच्छा को व्यक्त करता है। हिन्दी में ‘नहीं चाहते थे’ उस स्वैच्छिक निर्णय को सहज रूप से व्यक्त करता है, बिना उनके उद्देश्य के बारे में अतिरिक्त निष्कर्ष जोड़े।
- source_word: μεταβαίνειν ἐπὶ τὰ Ἑλληνικά
  choice: यूनानी रीति-रिवाज अपनाना
  rationale: शाब्दिक अर्थ ‘यूनानी बातों की ओर चले जाना’ है; प्रसंग में इसका आशय व्यापक यूनानी/हेलेनवादी आचार और जीवन-पद्धति को अपनाने से है, न कि केवल भाषा या जातीय पहचान से।
- source_word: κατασφάζειν
  choice: वध कर दिया जाना था
  rationale: यह साधारण ‘मारना’ से अधिक प्रबल और हिंसक क्रिया है। ‘वध’ उसकी कठोरता बनाए रखता है और आदेश के प्रसंग में धातुरूप की अपेक्षित कार्रवाई को व्यक्त करता है।
- source_word: παρῆν οὖν ὁρᾶν
  choice: इस प्रकार ... साफ़ दिखाई दे रही थी
  rationale: यह मुहावरा किसी प्रत्यक्ष और स्पष्ट रूप से देखी जा सकने वाली दशा को बताता है। चुना हुआ हिन्दी रूप स्वाभाविक रहते हुए उस अवलोकनात्मक भाव को रखता है।
- source_word: τὴν ἐνεστῶσαν ταλαιπωρίαν
  choice: उस समय की दुर्दशा
  rationale: ἐνεστῶσαν वर्तमान, उपस्थित या उस समय विद्यमान स्थिति को दर्शाता है। ‘उस समय की’ कथात्मक भूतकाल में इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐπὶ τὰ Ἑλληνικά का दायरा
  choice: यूनानी रीति-रिवाज और जीवन-पद्धति अपनाना
  alternative: जातीय रूप से यूनानी बनना, अथवा केवल यूनानी भाषा अपनाना
  rationale: अन्तियोकुस के आदेशों के प्रसंग में यह पद सांस्कृतिक और धार्मिक हेलेनवादी प्रथाओं के अनुरूप होने की बात करता है। अनुवाद न तो इसे जातीय परिवर्तन तक सीमित करता है, न स्पष्ट शब्द से अधिक बढ़ाकर औपचारिक धर्मत्याग कहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज। ‘परन्तु’ विरोध को, ‘वध’ मूल क्रिया की हिंसक तीव्रता को, और ‘दुर्दशा’ ταλαιπωρία की व्यापक पीड़ा को व्यक्त करता है। अलग पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि ‘यूनानी रीति-रिवाज’ मूल अभिव्यक्ति का व्यापक आशय मुख्य पाठ में ही स्पष्ट कर देता है।
