base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/031.yaml
  text: So then[a], in this way he passed away, leaving behind his own death as an example of courage and a memorial of virtue[c][b], not only for the young but also for most of the nation.
translation:
  language: hi
  text: इस प्रकार वह भी जीवन से विदा हुआ[a] और अपनी मृत्यु को साहस[b] का आदर्श तथा सद्गुण का स्मारक[c] के रूप में छोड़ गया—न केवल युवाओं के लिए, बल्कि राष्ट्र के अधिकांश लोगों के लिए भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मर गया।’ यूनानी में मृत्यु के लिए सामान्य क्रिया के बजाय अधिक गरिमापूर्ण अभिव्यक्ति प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: ‘साहस’ का अनुवाद ‘वीरता’ या ‘चरित्र की उदात्तता’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘नैतिक उत्कृष्टता की चिरस्मृति।’
    reason: lexical_alternative
lexical_decisions:
- source_word: μετήλλαξεν
  choice: जीवन से विदा हुआ
  rationale: यह मृत्यु के लिए प्रयुक्त एक गरिमापूर्ण, परोक्ष अभिव्यक्ति है। ‘जीवन से विदा हुआ’ यूनानी के ऊँचे कथात्मक स्वर को बनाए रखते हुए आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: τὸν τρόπον
  choice: इस प्रकार
  rationale: यह रीति या ढंग बताने वाला सीधा वाक्यांश है; ‘इस प्रकार’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: ὑπόδειγμα
  choice: आदर्श
  rationale: यह अनुकरण के लिए प्रस्तुत नमूने को दर्शाता है। इस नैतिक संदर्भ में ‘आदर्श’ हिन्दी के ‘उदाहरण’ से अधिक सहजता से अनुकरणीयता व्यक्त करता है।
- source_word: γενναιότητος
  choice: साहस
  rationale: संदर्भ में यह मृत्यु का निर्भीकता से सामना करने वाले उदात्त साहस को सूचित करता है। ‘वीरता’ और ‘चरित्र की उदात्तता’ भी अर्थ-सीमा में हैं, इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: μνημόσυνον
  choice: स्मारक
  rationale: शब्द ऐसी वस्तु या विरासत को दर्शाता है जो स्मृति को बनाए रखती है। ‘स्मारक’ वाक्य के गंभीर और स्मरणात्मक स्वर को सुरक्षित रखता है।
- source_word: ἀρετῆς
  choice: सद्गुण
  rationale: यहाँ शब्द नैतिक उत्कृष्टता को व्यक्त करता है। ‘सद्गुण’ आधुनिक हिन्दी में संक्षिप्त, नैतिक रूप से स्पष्ट और अनावश्यक दार्शनिक विस्तार से मुक्त है।
- source_word: τοῖς νέοις
  choice: युवाओं के लिए
  rationale: दत्तिव रूप उन लोगों को बताता है जिनके लिए यह मृत्यु आदर्श बनी। ‘युवाओं’ में अनावश्यक रूप से लिंग निर्दिष्ट नहीं होता।
- source_word: τοῖς πλείστοις τοῦ ἔθνους
  choice: राष्ट्र के अधिकांश लोगों के लिए
  rationale: ἔθνος यहाँ यहूदी जातीय-राष्ट्रीय समुदाय को सूचित करता है। यह रूप सामूहिक राष्ट्रीय अर्थ को रखते हुए हिन्दी में स्पष्ट है।
- source_word: καταλιπών
  choice: बनाकर छोड़ गया
  rationale: कृदन्त बताता है कि उसने अपनी मृत्यु को भावी लोगों के लिए कैसी विरासत के रूप में छोड़ा। हिन्दी में ‘बनाकर छोड़ गया’ इस परिणाम और विरासत दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शहीदी के प्रसंग में नैतिक शब्दावली
  choice: γενναιότης के लिए ‘साहस’ और ἀρετή के लिए ‘सद्गुण’
  alternative: ‘उदात्तता’ और ‘नैतिक उत्कृष्टता’
  rationale: यह युग्म एलिआज़र की मृत्यु के नैतिक और अनुकरणीय स्वरूप को व्यक्त करता है, पर बाद की किसी विशिष्ट दार्शनिक या साम्प्रदायिक श्रेणी को पाठ में नहीं जोड़ता।
- issue: मृत्यु के लिए परोक्ष, गरिमापूर्ण अभिव्यक्ति
  choice: ‘जीवन से विदा हुआ’
  alternative: ‘मर गया’
  rationale: यूनानी सामान्य ‘मरना’ क्रिया के बजाय ऊँची और परोक्ष अभिव्यक्ति प्रयोग करता है। चुना हुआ हिन्दी रूप उसी गरिमा को स्पष्टता के साथ बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य का स्मरणात्मक शहीदी-स्वर सुरक्षित है; ‘स्मारक’ जानबूझकर ठोस निर्माण तक सीमित नहीं, बल्कि स्थायी स्मृति या विरासत के अर्थ में प्रयुक्त है।
