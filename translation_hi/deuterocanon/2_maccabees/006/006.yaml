  text: And it was permitted neither to keep the Sabbath[a], nor to observe the ancestral festivals, nor even simply to acknowledge being a Jew.
translation:
  language: hi
  text: और न तो सब्त मानने की अनुमति थी, न पैतृक पर्वों का पालन करने की, और न ही बस यह स्वीकार करने की कि कोई यहूदी[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘यहूदिया का निवासी’, यदि इसे अधिक भौगोलिक-जातीय अर्थ में लिया जाए; पर यहाँ सब्त और पैतृक पर्वों पर रोक का प्रसंग ‘यहूदी’ अर्थ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: अनुमति थी
  rationale: अनन्त क्रियाओं के साथ प्रयुक्त ἦν यहाँ निषेध की परिस्थिति व्यक्त करता है; प्रसंग के अनुसार ‘अनुमति थी’ स्वाभाविक और स्पष्ट है।
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: न ... न ... और न ही
  rationale: यह तीन निषिद्ध कार्यों की समानांतर नकारात्मक शृंखला को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σαββατίζειν
  choice: सब्त मनाने
  rationale: क्रिया का अर्थ सब्त का धार्मिक रीति से पालन करना है; ‘सब्त मनाना’ आधुनिक हिन्दी में सहज है।
- source_word: πατρίους ἑορτὰς
  choice: पूर्वजों से चले आए पर्वों
  rationale: यह पद पूर्वजों से प्राप्त धार्मिक पर्वों की ऐतिहासिक और परंपरागत प्रकृति व्यक्त करता है।
- source_word: διαφυλάττειν
  choice: पालन करने
  rationale: पर्वों के संदर्भ में इसका अर्थ उन्हें दृढ़ता से बनाए रखना अथवा विधिपूर्वक मनाना है; ‘पालन करना’ हिन्दी में उपयुक्त है।
- source_word: ἁπλῶς
  choice: केवल इतना
  rationale: 'यह अंतिम निषेध को तीव्र करता है: अपनी पहचान की साधारण-सी स्वीकृति तक वर्जित थी।'
- source_word: Ἰουδαῖον
  choice: यहूदी
  rationale: यहाँ सब्त और पैतृक पर्वों के दमन का प्रसंग धार्मिक-जातीय पहचान की ओर संकेत करता है; केवल भौगोलिक मूल की अपेक्षा ‘यहूदी’ अधिक उपयुक्त है।
- source_word: ὁμολογεῖν
  choice: स्वीकार करने
  rationale: क्रिया अपनी पहचान को मानने या प्रकट रूप से स्वीकार करने का भाव देती है; यह अनावश्यक रूप से बाद की धार्मिक ‘अंगीकार’ शब्दावली नहीं जोड़ती।
- source_word: εἶναι
  choice: है
  rationale: अप्रत्यक्ष कथन को हिन्दी में ‘कि कोई ... है’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: उत्पीड़न के प्रसंग में Ἰουδαῖον का अर्थ
  choice: यहूदी
  alternative: यहूदिया का निवासी
  rationale: पद में यहूदी धार्मिक आचरण और पहचान—सब्त तथा पैतृक पर्व—पर रोक का वर्णन है। इसलिए धार्मिक-जातीय अर्थ प्रमुख है, यद्यपि यूनानी शब्द भौगोलिक-जातीय अर्थ भी धारण कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखा गया है। तीनों निषेधों की समानांतर संरचना सुरक्षित है और मूल की पहचान-संबंधी अर्थ-छाया को किसी सांप्रदायिक व्याख्या से नहीं बाँधा गया।
