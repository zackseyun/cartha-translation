base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/002.yaml
  text: and also to defile the temple in Jerusalem and to name it for Olympian Zeus[a], and the one on Gerizim, as those who inhabited the place happened to do[b], for Zeus the protector of strangers.
translation:
  language: hi
  text: और यरूशलेम के मंदिर को भी अपवित्र करने और उसका नाम ‘ओलिंपियाई ज़ीउस’ रखने[a], तथा गरिज़ीम के मंदिर का नाम ‘अतिथियों के संरक्षक ज़ीउस’ रखने[b], जैसे उस स्थान के निवासी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका नया नाम ‘ओलिंपियाई ज़ीउस’ रखने।” यूनानी क्रिया किसी को अतिरिक्त अथवा नया नाम देने का अर्थ रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “ज़ीउस ज़ेनियोस”; यह अतिथियों, अजनबियों या परदेशियों के आतिथ्य और संरक्षण से जुड़ी ज़ीउस की उपाधि थी। इससे पहले का यूनानी वाक्यांश संक्षिप्त है और उसका अर्थ स्थानीय निवासियों की स्थिति, पहचान या रीति से संबंधित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μολῦναι
  choice: अपवित्र करने
  rationale: यह क्रिया धार्मिक और नैतिक अशुद्धि का भाव रखती है। ‘अपवित्र करना’ मंदिर-संबंधी संदर्भ में स्वाभाविक है और केवल भौतिक प्रदूषण का अर्थ नहीं देता।
- source_word: νεὼ
  choice: मंदिर
  rationale: यहाँ शब्द यरूशलेम के पवित्र मंदिर-भवन के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘मंदिर’ सबसे स्पष्ट और सहज है।
- source_word: προσονομάσαι
  choice: उसका नाम … रखने
  rationale: क्रिया किसी को अतिरिक्त या नया नाम/पदनाम देने का संकेत करती है। यह अनुवाद समर्पण अथवा नाम-परिवर्तन की बात स्पष्ट करता है, पर उसकी ठीक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Διὸς Ὀλυμπίου
  choice: ओलिंपियाई ज़ीउस
  rationale: देवता के नाम को लिप्यंतरित और उसकी उपाधि को अर्थानुसार व्यक्त किया गया है, जिससे थोपा गया यूनानी धार्मिक संबंध स्पष्ट रहता है।
- source_word: Γαριζείν
  choice: गरिज़ीम
  rationale: स्थान-नाम का प्रचलित बाइबलीय हिन्दी रूप रखा गया है; समानांतर वाक्य-रचना से वहाँ का मंदिर अभिप्रेत होना स्पष्ट है।
- source_word: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: जैसी वहाँ के निवासियों की स्थिति थी
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। यह रूप स्थानीय निवासियों की परिस्थिति से संबंध बनाए रखता है, बिना उसे निश्चित रूप से उनकी इच्छा, प्रथा या जातीय पहचान घोषित किए।
- source_word: Διὸς ξενίου
  choice: परदेशियों के संरक्षक ज़ीउस
  rationale: ξένιος अतिथियों, अजनबियों अथवा परदेशियों के आतिथ्य और संरक्षण से जुड़ी ज़ीउस की उपाधि है। संदर्भ में स्थानीय निवासियों की स्थिति से संबंध बनाए रखने के लिए ‘परदेशियों’ चुना गया है।
theological_decisions:
- issue: यहूदी मंदिरों के अपवित्रीकरण के प्रसंग में यूनानी देवता की उपाधियाँ
  choice: ‘ओलिंपियाई ज़ीउस’ और ‘परदेशियों के संरक्षक ज़ीउस’
  alternative: ‘ज़ीउस ओलिंपियोस’ और ‘ज़ीउस ज़ेनियोस’ जैसे पूर्ण लिप्यंतरण
  rationale: नाम ‘ज़ीउस’ को ऐतिहासिक पहचान के लिए रखा गया है और उपाधियों का अर्थ हिन्दी में दिया गया है, ताकि थोपी गई मूर्तिपूजक पुनर्पहचान पाठक को स्पष्ट हो।
- issue: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες का आशय
  choice: स्थानीय निवासियों की ‘स्थिति’ से जुड़ा, जानबूझकर संयत अनुवाद
  alternative: ‘जैसा वहाँ के निवासी चाहते थे’ अथवा ‘वहाँ के निवासियों की प्रथा के अनुसार’
  rationale: मूल यूनानी न तो इच्छा और न ही प्रथा को स्पष्ट रूप से कहता है। इसलिए अस्पष्टता को बनाए रखा गया है और किसी समुदाय पर अतिरिक्त धार्मिक या नैतिक निर्णय नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद पिछले वाक्य के आदेश पर निर्भर अनंत क्रियाओं की शृंखला है, इसलिए हिन्दी में भी ‘करने/रखने’ की संरचना सुरक्षित रखी गई है। ‘ज़ीउस’ के साथ नुक्तायुक्त ‘ज़’ आधुनिक हिन्दी उच्चारण के अनुरूप है।
