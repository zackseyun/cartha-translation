  yaml_path: translation/deuterocanon/2_maccabees/006/007.yaml
  text: And they were being led[a], under bitter compulsion, to the king’s monthly birthday observance for the sacrificial meal; and when a festival of Dionysus came, they were being forced, wearing ivy wreaths[b], to join the procession in honor of Dionysus.
translation:
  language: hi
  text: और उन्हें घोर विवशता में हर महीने मनाए जाने वाले राजा के जन्मदिन के अवसर पर बलि के चढ़ाए हुए अंश खाने[a] के लिए ले जाया जाता था। और जब दियोनिसुस का उत्सव आता, तो उन्हें आइवी धारण किए हुए[b] दियोनिसुस के सम्मान में निकलने वाली शोभायात्रा में भाग लेने के लिए मजबूर किया जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “बलि के भीतरी अंग अथवा नियत अंश खाने।” यूनानी शब्द बलि में चढ़ाए गए अंशों को खाकर उस अनुष्ठान में सहभागी होने की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: आइवी दियोनिसुस की उपासना से जुड़ा हुआ था। यूनानी पदबंध का शाब्दिक अर्थ “आइवी लिए हुए” है; इस संदर्भ में संभवतः आइवी की मालाएँ या मुकुट पहनना अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ἤγον
  choice: उन्हें ... ले जाया जाता था
  rationale: यूनानी अपूर्ण भूतकाल यहाँ बार-बार होने वाली कार्रवाई बताता है। कर्ता अनिर्दिष्ट है और पीड़ितों पर की गई जबरदस्ती केंद्र में है, इसलिए स्वाभाविक हिन्दी में कर्मवाच्य उपयुक्त है।
- source_word: μετὰ πικρᾶς ἀνάγκης
  choice: घोर विवशता में
  rationale: यह पदबंध कठोर और दुःखदायी दबाव व्यक्त करता है। ‘घोर विवशता’ उसी तीव्रता को स्वाभाविक आधुनिक हिन्दी में प्रकट करता है।
- source_word: εἰς τὴν κατὰ μῆνα τοῦ βασιλέως γενέθλιον ἡμέραν
  choice: हर महीने मनाए जाने वाले राजा के जन्मदिन के अवसर पर
  rationale: κατὰ μῆνα मासिक पुनरावृत्ति बताता है; अनुवाद असामान्य मासिक राजकीय जन्मदिन-अनुष्ठान को बिना सामान्य वार्षिक जन्मदिन बना दिए स्पष्ट करता है।
- source_word: ἐπὶ σπλαγχνισμόν
  choice: बलि के चढ़ाए हुए अंश खाने
  rationale: बलिदानी संदर्भ में यह शब्द बलि के भीतरी अंगों अथवा नियत अंशों को खाने में सहभागिता की ओर संकेत करता है। मुख्य पाठ में अनुष्ठानिक भोजन और उसका आपत्तिजनक धार्मिक स्वरूप दोनों स्पष्ट रखे गए हैं।
- source_word: Διονυσίων ἑορτῆς
  choice: दियोनिसुस का उत्सव
  rationale: यह दियोनिसुस से संबंधित धार्मिक उत्सव को दर्शाता है; हिन्दी रूप पारदर्शी है और किसी अधिक विशिष्ट उत्सव-नाम को आरोपित नहीं करता।
- source_word: κισσοὺς ἔχοντες
  choice: आइवी की मालाएँ पहने हुए
  rationale: शाब्दिक अर्थ ‘आइवी लिए/रखे हुए’ है, पर दियोनिसीय शोभायात्रा के सांस्कृतिक संदर्भ में आइवी की माला या मुकुट पहनना अभिप्रेत होने की प्रबल संभावना है। इस निहितार्थ को पादटिप्पणी सहित व्यक्त किया गया है।
- source_word: πομπεύειν
  choice: शोभायात्रा में भाग लेने
  rationale: क्रिया धार्मिक अथवा उत्सवी जुलूस में चलने या भाग लेने का अर्थ देती है। ‘शोभायात्रा में भाग लेना’ आधुनिक हिन्दी में अनुष्ठानिक अर्थ बनाए रखता है।
- source_word: τῷ Διονύσῳ
  choice: दियोनिसुस के सम्मान में
  rationale: सम्प्रदान कारक यहाँ जुलूस के धार्मिक समर्पण या अभिमुखता को व्यक्त करता है; ‘के सम्मान में’ इसे सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ἐπὶ σπλαγχνισμόν में मूर्तिपूजक बलि-अनुष्ठान में बाध्य सहभागिता को कितनी स्पष्टता से व्यक्त किया जाए
  choice: मुख्य पाठ में ‘बलि के चढ़ाए हुए अंश खाने’
  alternative: ‘बलि के भीतरी अंग खाने’ या व्यापक रूप में ‘बलि-भोज में भाग लेने’
  rationale: पहला विकल्प आधुनिक पाठक के लिए अनावश्यक रूप से विचलित करने वाला और दूसरा मूल शब्द की विशिष्टता को धुँधला कर सकता है। चुना गया रूप बलि से जुड़े भोजन की धार्मिक गंभीरता और शब्द की अर्थ-सीमा दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। ‘घोर विवशता’, ‘बलि के चढ़ाए हुए अंश’ और ‘शोभायात्रा’ जैसे पद स्रोत के अनुष्ठानिक तथा दमनकारी संदर्भ को बनाए रखते हैं। ‘दियोनिसुस’ यूनानी नाम का देवनागरी लिप्यंतरण है।
