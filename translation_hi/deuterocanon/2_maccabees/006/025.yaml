  text: and they too[a], because of my hypocrisy and because of this brief and momentary life, might be led astray because of me[c][b], and I would acquire hatred and a stain upon my old age.
translation:
  language: hi
  text: और वे भी मेरे ढोंग[a] तथा इस थोड़े-से और क्षणभंगुर जीवन[b] के कारण मेरे कारण भटका दिए जाएँ, और मैं अपने बुढ़ापे पर घृणा[c] और कलंक मोल ले लूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दिखावा’ अथवा ‘कपट’। यूनानी शब्द ऐसे बनावटी आचरण को बताता है जो देखने वालों को भ्रमित कर दे।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘थोड़े-से और क्षणभर के जीने के कारण’; आशय जीवन की बची हुई छोटी अवधि से है।
    reason: lexical_alternative
  - marker: c
    text: ‘घृणा’ का अर्थ यहाँ ‘घिन’ या ‘वितृष्णा का पात्र होना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόκρισιν
  choice: ढोंग
  rationale: यहाँ शब्द ऐसे बनावटी आचरण को दर्शाता है जिससे देखने वाले धोखा खाएँ। ‘ढोंग’ आधुनिक हिन्दी में इस नैतिक और धार्मिक कपट को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μικρὸν καὶ ἀκαριαῖον ζῆν
  choice: इस थोड़े-से, क्षणभंगुर जीवन
  rationale: पदबंध जीवन की बची हुई छोटी और शीघ्र बीत जाने वाली अवधि पर बल देता है। यह रूप यूनानी अर्थ को रखते हुए हिन्दी में सहज है।
- source_word: πλανηθῶσιν
  choice: भटका दिए जाएँ
  rationale: निष्क्रिय संभावनार्थक रूप को सुरक्षित रखता है और भ्रमित किए जाने तथा नैतिक रूप से गलत राह पर डाले जाने—दोनों भाव व्यक्त करता है।
- source_word: μύσος
  choice: घृणा
  rationale: यह शब्द अशुद्धि, घिन अथवा घृणा का पात्र बनने का भाव दे सकता है। प्रसंग में ‘घृणा’ सार्वजनिक वितृष्णा के अर्थ को संक्षेप में व्यक्त करती है।
- source_word: κηλῖδα
  choice: कलंक
  rationale: प्रतिष्ठा पर लगे दाग का रूपक हिन्दी में ‘कलंक’ से स्वाभाविक और प्रभावशाली रूप में व्यक्त होता है।
- source_word: κατακτήσωμαι
  choice: मोल ले लूँ
  rationale: मध्यवाच्य का अपने ऊपर परिणाम ले आने वाला भाव हिन्दी के मुहावरे ‘मोल ले लूँ’ से स्पष्ट होता है।
theological_decisions:
- issue: शहादत के प्रसंग में ὑπόκρισις का नैतिक बल
  choice: ‘ढोंग’ रखा गया है।
  alternative: ‘दिखावा’ या ‘कपटपूर्ण बहाना’
  rationale: वक्ता केवल एक युक्ति नहीं, बल्कि दूसरों को भ्रमित करने वाली झूठी बाहरी अनुरूपता अस्वीकार करता है; ‘ढोंग’ इस नैतिक गंभीरता को बनाए रखता है।
- issue: अंतिम उपवाक्य में स्वयं अपने ऊपर अपमान लाने का भाव
  choice: ‘मैं अपने बुढ़ापे के लिए घृणा और कलंक मोल ले लूँ’
  alternative: ‘मैं अपने बुढ़ापे पर घृणा और कलंक ले आऊँ’
  rationale: यूनानी मध्यवाच्य यह संकेत करता है कि समझौते का अपमान वक्ता स्वयं अपने लिए प्राप्त करेगा; अनुवाद इस आत्म-उत्तरदायित्व को बिना अतिरिक्त धर्मवैचारिक निष्कर्ष के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य की यूनानी संरचना और संभावनार्थक भाव को यथासंभव सुरक्षित रखते हुए ‘मोल ले लूँ’ जैसे स्वाभाविक हिन्दी मुहावरे का प्रयोग किया गया है।
