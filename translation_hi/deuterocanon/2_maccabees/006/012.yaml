base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/012.yaml
  text: Therefore I urge those who read this book not to be disheartened because of these calamities[a], but to consider that these punishments are not for destruction[c][b], but for the discipline of our people.
translation:
  language: hi
  text: इसलिए मैं इस पुस्तक को पढ़नेवालों[a] से आग्रह करता हूँ कि वे इन विपत्तियों के कारण हिम्मत न हारें[b], बल्कि यह समझें कि ये दंड विनाश के लिए नहीं, बल्कि हमारे लोगों के अनुशासन[c] के लिए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक भाव है, “इस पुस्तक से मिलनेवाले”; यहाँ आशय इस पुस्तक को पढ़नेवालों से है।
    reason: lexical_alternative
  - marker: b
    text: या “पूरी तरह टूट न जाएँ” अथवा “निराश न हों।”
    reason: lexical_alternative
  - marker: c
    text: “अनुशासन” का अनुवाद “शिक्षा,” “प्रशिक्षण” या “सुधारात्मक ताड़ना” भी किया जा सकता है; यूनानी शब्द में सुधारने और गढ़ने, दोनों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: मैं ... आग्रह करता हूँ
  rationale: यह कथावाचक की गंभीर अपील को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοὺς ἐντυγχάνοντας τῇδε τῇ βίβλῳ
  choice: इस पुस्तक को पढ़नेवालों
  rationale: ἐντυγχάνω का मूल भाव किसी वस्तु से मिलने या उसका सामना करने का हो सकता है, पर पुस्तक के संदर्भ में इसका स्वाभाविक आशय उसे पढ़नेवालों से है।
- source_word: μὴ συντελεσθαι
  choice: हिम्मत न हारें
  rationale: यहाँ क्रिया विपत्तियों से भीतर से टूट जाने या निरुत्साहित हो जाने का भाव देती है; हिन्दी मुहावरा अर्थ को स्पष्ट और सहज रखता है।
- source_word: διὰ τὰς συμφορὰς
  choice: इन विपत्तियों के कारण
  rationale: συμφοραί गंभीर दुर्भाग्यों या आपदाओं को सूचित करता है; संदर्भ की तीव्रता के लिए ‘विपत्तियाँ’ उपयुक्त है।
- source_word: λογίζεσθαι
  choice: यह समझें
  rationale: क्रिया सोच-विचार करके किसी बात को एक निश्चित रूप में मानने का भाव रखती है; ‘समझें’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: τὰς τιμωρίας
  choice: ये दंड
  rationale: τιμωρία का सीधा अर्थ दंड या दंडात्मक परिणाम है; ‘ये’ पूर्वोक्त विपत्तियों से संबंध स्पष्ट करता है।
- source_word: μὴ πρὸς ὄλεθρον
  choice: विनाश के लिए नहीं
  rationale: πρός यहाँ लक्ष्य या परिणाम का भाव देता है और ὄλεθρος विनाश या बरबादी को सूचित करता है।
- source_word: ἀλλὰ πρὸς παιδείαν
  choice: बल्कि ... अनुशासन के लिए
  rationale: παιδεία में शिक्षा, सुधार, प्रशिक्षण और सुधारात्मक ताड़ना के मिले-जुले भाव हैं; ‘अनुशासन’ इस प्रसंग में उस रचनात्मक-सुधारात्मक उद्देश्य को संक्षेप में सुरक्षित रखता है।
- source_word: τοῦ γένους ἡμῶν
  choice: हमारे लोगों के
  rationale: γένος यहाँ यहूदी समुदाय को सामूहिक वंश-समुदाय के रूप में दर्शाता है। ‘हमारे लोग’ आधुनिक हिन्दी में स्वाभाविक है और ‘जाति’ के संभावित भ्रामक आधुनिक अर्थों से बचता है।
theological_decisions:
- issue: 'विपत्तियों का उद्देश्य: विनाश या सुधारात्मक अनुशासन'
  choice: पाठ के स्पष्ट विरोध को बनाए रखते हुए दंडों को विनाश के लिए नहीं, बल्कि समुदाय के अनुशासन के लिए बताया गया है।
  alternative: इसे केवल सामान्य नैतिक शिक्षा कहना, या स्पष्ट रूप से केवल मानवीय राजनीतिक परिणाम मानना।
  rationale: यूनानी वाक्यांश μὴ πρὸς ὄλεθρον, ἀλλὰ πρὸς παιδείαν उद्देश्यगत विरोध प्रस्तुत करता है। अनुवाद इस तनाव को सुरक्षित रखता है, पर दैवी विधान या दंड के बारे में पाठ से आगे कोई विस्तृत सिद्धांत नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और स्वर कथावाचक की गंभीर, सांत्वनापूर्ण अपील के अनुरूप रखा गया है। ‘पढ़नेवाले,’ ‘हिम्मत न हारें’ और ‘हमारे लोग’ सामान्य पाठक के लिए सहज हैं, जबकि ‘विनाश’ और ‘अनुशासन’ मूल के उद्देश्यगत विरोध को गरिमा के साथ बनाए रखते हैं।
