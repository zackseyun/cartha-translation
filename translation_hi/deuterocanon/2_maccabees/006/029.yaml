  yaml_path: translation/deuterocanon/2_maccabees/006/029.yaml
  text: Those who were leading him changed the goodwill they had shown him a little earlier into hostility because of the words just spoken[a], since they regarded them, as they supposed, as madness.
translation:
  language: hi
  text: जो लोग उसे ले जा रहे थे, उन्होंने थोड़ी ही देर पहले उसके प्रति दिखाई अपनी सद्भावना को उन बातों के कारण शत्रुता में बदल दिया जो उसने अभी कही थीं[a], क्योंकि उनके विचार में वे बातें पागलपन थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पागलपन” के स्थान पर “मूर्खता,” “विवेकहीनता” या “हताश दुस्साहस” भी सम्भव है। यूनानी शब्द बताता है कि उसे ले जाने वाले उसकी बातों को किस दृष्टि से देखते थे; यह आवश्यक नहीं कि यह स्वयं कथावाचक का निर्णय हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶνδε ἀγόντων πρὸς αὐτόν
  choice: जो लोग उसे ले जा रहे थे
  rationale: यह पदबंध उन व्यक्तियों को दर्शाता है जो एलिआज़र को अपने साथ आगे ले जा रहे थे; यह सहज हिन्दी में अनुरक्षण और ले जाने—दोनों का भाव रखता है।
- source_word: τὴν μικρῷ πρότερον εὐμένειαν
  choice: थोड़ी ही देर पहले उसके प्रति दिखाई अपनी सद्भावना
  rationale: εὐμένεια का अर्थ सद्भावना, कृपा या अनुकूलता है, और μικρῷ πρότερον निकट अतीत को सूचित करता है। ‘दिखाई’ सम्बन्ध को हिन्दी में स्पष्ट करता है।
- source_word: δυσμένειαν
  choice: शत्रुता
  rationale: यह εὐμένεια के विपरीत भाव को व्यक्त करता है और अनुकूलता से विरोध की ओर हुए तीखे परिवर्तन को सुरक्षित रखता है।
- source_word: διὰ τὴν τῶν προειρημένων λόγων
  choice: उन बातों के कारण जो उसने अभी कही थीं
  rationale: प्रसंग में προειρημένων उन कथनों की ओर संकेत करता है जो तत्काल पहले कहे गए थे। कर्ता को ‘उसने’ से स्पष्ट करना हिन्दी में स्वाभाविक है।
- source_word: ὡς αὐτοὶ ὑπελάμβανον
  choice: उनके विचार में
  rationale: यह निर्णय उन्हीं लोगों का था, कथावाचक का नहीं। यह संक्षिप्त हिन्दी अभिव्यक्ति उस दृष्टिकोणगत दूरी को बनाए रखती है।
- source_word: ἀπόνοιαν
  choice: पागलपन
  rationale: यह शब्द यहाँ उनके अनुसार विवेकहीन या उन्मत्त कथन का बोध देता है। ‘पागलपन’ इसकी तीव्रता रखता है, जबकि पादटिप्पणी अन्य सम्भव अर्थों को दर्ज करती है।
theological_decisions:
- issue: साथ ले जाने वालों के निर्णय से कथावाचक की दूरी
  choice: ‘उनके विचार में वे बातें पागलपन थीं’ कहकर मूल्यांकन उन्हीं व्यक्तियों का बताया गया है।
  alternative: ‘पहले कही गई बातों के पागलपन के कारण’
  rationale: ὡς αὐτοὶ ὑπελάμβανον स्पष्ट रूप से यह निर्णय ‘उनके’ मत के रूप में प्रस्तुत करता है; अनुवाद एलिआज़र की बातों को वस्तुगत रूप से पागलपन नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘सद्भावना’ और ‘शत्रुता’ के विरोध द्वारा यूनानी वाक्य का अलंकारिक पलटाव सुरक्षित रखा गया है।
