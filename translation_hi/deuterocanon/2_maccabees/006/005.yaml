  text: But the altar was filled with unlawful things by those who had departed from the laws[a].
translation:
  language: hi
  text: परन्तु वेदी उन लोगों द्वारा निषिद्ध वस्तुओं से भर दी गई थी, जो व्यवस्थाओं से अलग हो गए थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घृणित वस्तुओं’ अथवा ‘वर्जित वस्तुओं।’ यूनानी शब्द ऐसी चीज़ों को दर्शाता है जो विधिसम्मत या अनुमत नहीं हैं; इस प्रसंग में इसका संबंध उपासना-संबंधी अपवित्रीकरण से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: यह यूनानी शब्द का मानक और स्वाभाविक हिन्दी रूप है; ‘बलि की वेदी’ कहना अनावश्यक विस्तार होता।
- source_word: ἀποδιεσταλμένοις
  choice: जो ... दूर हो गए थे
  rationale: कृदन्त व्यवस्थाओं से अलगाव या विमुखता व्यक्त करता है। यह रूप अर्थ को स्वाभाविक हिन्दी में रखता है और मुख्य पाठ में ‘धर्मत्यागी’ जैसा अधिक व्याख्यात्मक पद नहीं जोड़ता।
- source_word: νόμων
  choice: व्यवस्थाओं
  rationale: यूनानी में शब्द बहुवचन है। प्रसंग में यह यहूदी व्यवस्थाओं की ओर संकेत करता है, पर ‘पैतृक’ जैसा विशेषण मूल में नहीं है।
- source_word: ἀθεμίτοις
  choice: निषिद्ध वस्तुओं
  rationale: यह पद उन चीज़ों को दर्शाता है जिनकी अनुमति नहीं है अथवा जो धार्मिक रूप से वर्जित हैं। यूनानी में संज्ञा निहित है, इसलिए हिन्दी में ‘वस्तुओं’ की पूर्ति की गई है।
- source_word: ἐπεπλήρωτο
  choice: भर दी गई थी
  rationale: प्लूपरफेक्ट कर्मवाच्य किसी पूर्ण किए जा चुके कार्य और उससे उत्पन्न अवस्था को व्यक्त करता है; यह हिन्दी रूप उस पूर्वपूर्णता को स्पष्ट और स्वाभाविक ढंग से दर्शाता है।
theological_decisions:
- issue: ἀθεμίτοις के लिए अधिक प्रबल धार्मिक-अनुष्ठानिक शब्द चुना जाए या नहीं
  choice: निषिद्ध वस्तुओं
  alternative: घृणित वस्तुओं; वर्जित वस्तुओं; अशुद्ध वस्तुओं
  rationale: प्रसंग मंदिर को अपवित्र किए जाने का है, इसलिए अधिक प्रबल धार्मिक शब्द संभव है। फिर भी यूनानी पद मूलतः उस चीज़ को बताता है जो अनुमत या विधिसम्मत नहीं है। ‘निषिद्ध वस्तुओं’ से कानूनी-धार्मिक भाव बना रहता है, पर मूल से अधिक अर्थ आरोपित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘परन्तु’ से δέ का विरोधात्मक संबंध, ‘व्यवस्थाओं’ से यूनानी बहुवचन, और ‘भर दी गई थी’ से पूर्ण हो चुके कर्म की परिणामी अवस्था सुरक्षित रखी गई है।
