  yaml_path: translation/deuterocanon/2_maccabees/006/013.yaml
  text: For indeed[a], not allowing those who act impiously to go on for a long time, but immediately bringing punishments upon them, is a sign of great kindness.
translation:
  language: hi
  text: क्योंकि जो लोग ईश्वर का अनादर करते हैं, उन्हें बहुत समय तक यूँ ही न छोड़ना, बल्कि उन्हें तुरंत दंडों के अधीन पड़ने देना, बड़ी भलाई का संकेत है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो लोग ईश्वर का अनादर करते हैं उन्हें बहुत समय तक चलते रहने न देना, बल्कि उन्हें तुरंत दंडों के अधीन हो जाने देना।”
    reason: ἐάω के ‘चलते रहने देना’ और περιπίπτω के ‘दंडों के अधीन पड़ना’ भाव की अधिक शाब्दिक वैकल्पिक अभिव्यक्ति।
lexical_decisions:
- source_word: τὸ μὴ πολὺν χρόνον ἐᾶσθαι
  choice: बहुत समय तक यूँ ही न छोड़ना
  rationale: यूनानी क्रियार्थक संज्ञा-वाक्यांश को वाक्य के कर्ता के रूप में रखा गया है। ‘यूँ ही न छोड़ना’ ἐάω के ‘छोड़ देना/चलते रहने देना’ भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοὺς δυσσεβοῦντας
  choice: भक्तिहीन आचरण करने वालों
  rationale: वर्तमान कृदंत व्यक्तियों पर स्थायी ठप्पा लगाने के बजाय उनके आचरण को सामने रखता है। ‘भक्तिहीन’ यहाँ परमेश्वर के प्रति अनादर और धर्मविरुद्ध व्यवहार का भाव रखता है।
- source_word: ἀλλʼ εὐθέως
  choice: बल्कि ... तुरंत
  rationale: यह लंबे विलंब के साथ स्पष्ट विरोध दिखाता और दंड की शीघ्रता पर बल देता है।
- source_word: περιπίπτειν τοῖς ἐπιτιμίοις
  choice: दंड भुगतने देना
  rationale: शाब्दिक अर्थ ‘दंडों में/के अधीन पड़ना’ है; ‘दंड भुगतना’ आधुनिक हिन्दी में स्वाभाविक है और दंडात्मक बल को बनाए रखता है। ‘देना’ यूनानी रचना में निहित अनुमति/होने देने के संबंध को व्यक्त करता है।
- source_word: μεγάλης εὐεργεσίας
  choice: महान उपकार
  rationale: εὐεργεσία किसी हितकारी कार्य या भलाई को दर्शाता है। ‘उपकार’ दंड को नरम किए बिना इस विरोधाभासी दावे को बनाए रखता है कि शीघ्र दंड भी हितकारी है।
- source_word: σημεῖόν ἐστιν
  choice: का चिन्ह है
  rationale: ‘चिन्ह’ मूल के संकेत अथवा प्रमाण-सूचक अर्थ को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: शीघ्र दंड को उपकार बताने वाले धर्मवैचारिक तनाव को कैसे व्यक्त किया जाए
  choice: शीघ्र दंड को सीधे ‘महान उपकार का चिन्ह’ कहा गया है।
  alternative: εὐεργεσία को ‘महान दया’ कहना या ἐπιτίμια को ‘अनुशासन’ कहकर दंडात्मक बल को हल्का करना।
  rationale: मूल पाठ स्वयं शीघ्र दंड और उपकार को साथ रखता है। ‘उपकार’ इस तनाव को सुरक्षित रखता है और ‘दया’ जैसी अधिक विशिष्ट धर्मवैचारिक व्याख्या अथवा ‘अनुशासन’ द्वारा दंड के नरमीकरण से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘भक्तिहीन आचरण करने वाले’ कृदंत के सक्रिय भाव को बचाता है, जबकि ‘महान उपकार’ मूल कथन के कठिन धर्मवैचारिक तनाव को बिना समझाए या नरम किए प्रस्तुत करता है।
