base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/023.yaml
  text: But he[a], adopting a noble resolve worthy of his age and of the dignity of old age, and of the distinction of his acquired and honored way of life, and of the finest conduct from childhood—rather, in keeping with the holy and God-given law—declared himself plainly, saying that they should send him quickly to Hades.
translation:
  language: hi
  text: परन्तु उसने एक श्रेष्ठ निश्चय अपनाया, जो उसकी आयु, वृद्धावस्था की गरिमा, उसकी अर्जित और प्रतिष्ठित जीवन-पद्धति तथा बचपन से चले आ रहे उसके उत्कृष्ट आचरण के योग्य था—बल्कि, जो पवित्र और परमेश्वर द्वारा स्थापित व्यवस्था के अनुरूप था—और उसने स्पष्ट रूप से कह दिया कि वे उसे शीघ्र अधोलोक[a] में भेज दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थात् “मृतकों के लोक में भेज दें।” यूनानी: “हेडीस में।”'
    reason: ᾅδης को अंतिम दण्ड के नरक के अर्थ में समझने से बचाते हुए उसका वैकल्पिक, व्याख्यात्मक अर्थ देना।
lexical_decisions:
- source_word: λογισμὸν ἀστεῖον
  choice: एक उत्तम निश्चय
  rationale: λόγισμος यहाँ सोच-विचार से किए गए निर्णय या दृढ़ निश्चय को दर्शाता है और ἀστεῖος उसकी प्रशंसनीय, श्रेष्ठ प्रकृति को।
- source_word: ἀναλαβὼν
  choice: किया
  rationale: इस प्रसंग में कृदन्त का आशय उस निश्चय को अपनाने या दृढ़ता से ग्रहण करने से है; हिन्दी में ‘निश्चय किया’ स्वाभाविक है।
- source_word: ἄξιον τῆς ἡλικίας
  choice: अपनी आयु ... के योग्य
  rationale: ἄξιος की मूल्यांकनात्मक शक्ति और ἡλικία का आयु-संबंधी अर्थ सुरक्षित रहता है।
- source_word: τοῦ γήρους ὑπεροχῆς
  choice: वृद्धावस्था की गरिमा
  rationale: ὑπεροχή यहाँ वृद्धावस्था से जुड़ी प्रतिष्ठा, श्रेष्ठता और सम्मान को व्यक्त करता है।
- source_word: ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας
  choice: अपने अर्जित और प्रतिष्ठित जीवन-चरित्र
  rationale: πολιτεία यहाँ नागरिकता से अधिक जीवन-पद्धति या आचरण को सूचित करता है; ‘अर्जित’ ἐπίκτητος और ‘प्रतिष्ठित’ ἐπιφανής दोनों को बनाए रखता है।
- source_word: ἐκ παιδὸς καλλίστης ἀναστροφῆς
  choice: बचपन से चले आए अपने उत्तम आचरण
  rationale: ἀναστροφή जीवन-व्यवहार या आचरण है; वाक्यांश उसके बचपन से निरंतर उत्तम चरित्र पर बल देता है।
- source_word: μᾶλλον δὲ
  choice: बल्कि
  rationale: यह पहले बताए कारणों से बढ़कर व्यवस्था को निर्णायक आधार बताने वाला आलंकारिक मोड़ है।
- source_word: τῆς ἁγίας καὶ θεοκτίστου νομοθεσίας
  choice: पवित्र और परमेश्वर द्वारा स्थापित व्यवस्था
  rationale: θεόκτιστος का शाब्दिक बल ‘परमेश्वर द्वारा स्थापित’ में सुरक्षित है, जबकि νομοθεσία को प्रसंगानुसार ‘व्यवस्था’ कहा गया है।
- source_word: ἀκολούθως
  choice: के अनुरूप
  rationale: यह उसके निर्णय का पवित्र व्यवस्था के साथ सामंजस्य व्यक्त करता है।
- source_word: ἀπεφήνατο
  choice: उसने स्पष्ट कह दिया
  rationale: क्रिया उसके निजी मत या निर्णय की खुली और निर्णायक घोषणा दर्शाती है; हिन्दी में अनावश्यक प्रतिवाचकता के बिना यह भाव स्पष्ट है।
- source_word: ταχέως ... προπέμπειν εἰς τὸν ᾅδην
  choice: उसे शीघ्र अधोलोक में भेज दें
  rationale: ταχέως की शीघ्रता तथा προπέμπειν का भेज देने का भाव सुरक्षित है। ᾅδης के लिए ‘अधोलोक’ मृतकों के लोक को दर्शाता है और ‘नरक’ से होने वाले अनुचित समानीकरण से बचाता है।
theological_decisions:
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: मृतकों का लोक
  rationale: ग्रीक शब्द मृतकों के लोक को सूचित करता है, अनिवार्यतः अंतिम दण्ड के नरक को नहीं। मुख्य पाठ में संक्षिप्त पारंपरिक शब्द रखा गया और पादटिप्पणी में अर्थ स्पष्ट किया गया।
- issue: θεοκτίστου νομοθεσίας का अनुवाद
  choice: परमेश्वर द्वारा स्थापित व्यवस्था
  alternative: परमेश्वर-प्रदत्त व्यवस्था
  rationale: यह रूप व्यवस्था के ईश्वरीय उद्गम और स्थापना के भाव को स्पष्ट रखता है, बिना किसी विशिष्ट साम्प्रदायिक व्याख्या को जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। मूल यूनानी की दीर्घ वाक्य-संरचना और ‘बल्कि’ द्वारा आने वाला अर्थगत उत्कर्ष यथासंभव सुरक्षित है।
