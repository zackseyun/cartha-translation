base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/014.yaml
  text: 'For he did not decide to deal with us as he does with the other nations: he waits patiently with them until they have reached the full measure of their sins[a], and then punishes them.'
translation:
  language: hi
  text: क्योंकि स्वामी[a] अन्य राष्ट्रों के विषय में धीरज धरते हुए तब तक प्रतीक्षा करता है, जब तक वे अपने पापों की पूरी सीमा तक न पहुँच जाएँ, और तब उन्हें दंड देता है; पर उसने हमारे विषय में वैसा होना उचित नहीं समझा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘स्वामी’ या ‘सर्वाधिकारी’ (ὁ δεσπότης) है; यहाँ यह परमेश्वर को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμένει
  choice: प्रतीक्षा करता है
  rationale: क्रिया किसी निश्चित बिंदु तक ठहरे रहने या प्रतीक्षा करने को दर्शाती है; यहाँ आशय न्याय को तब तक रोके रखने से है जब तक पाप अपनी पूरी सीमा तक न पहुँच जाएँ।
- source_word: μακροθυμῶν
  choice: धीरज रखकर
  rationale: यह कृदंत स्वामी की सहनशीलता और न्याय को तत्काल न लाने का भाव व्यक्त करता है। ‘धीरज रखकर’ आधुनिक हिन्दी में स्वाभाविक है और इसे ἀναμένει से जोड़ता है।
- source_word: ὁ δεσπότης
  choice: स्वामी[a]
  rationale: δεσπότης अधिकार रखने वाले स्वामी या प्रभुसत्ताधारी को दर्शाता है और यहाँ परमेश्वर के लिए प्रयुक्त है। ‘स्वामी’ मूल शब्द को κύριος से अलग रखते हुए स्पष्ट और गरिमापूर्ण है।
- source_word: μέχρι τοῦ ... κολάσῃ
  choice: तब तक ... और तब वह उन्हें दंड देता है
  rationale: 'यह रचना धीरज की समय-सीमा बताती है: निर्दिष्ट दशा पर पहुँचने के बाद दंड आता है। हिन्दी में क्रम को स्पष्ट करने के लिए ‘और तब’ रखा गया है।'
- source_word: καταντήσαντας αὐτοὺς πρὸς ἐκπλήρωσιν ἁμαρτιῶν
  choice: जब तक वे अपने पापों की पूरी सीमा तक न पहुँच जाएँ
  rationale: वाक्यांश पापों के पूर्ण होने या अपनी चरम सीमा तक पहुँचने की धारणा व्यक्त करता है। ‘पूरी सीमा’ सामान्य पाठक के लिए स्वाभाविक रहते हुए इस रूपक को बनाए रखता है।
- source_word: κολάσῃ
  choice: दंड देता है
  rationale: क्रिया दंडात्मक कार्रवाई को सीधे व्यक्त करती है; ‘दंड देता है’ आधुनिक मानक हिन्दी में स्पष्ट है।
- source_word: οὐ ... οὕτως καὶ ἐφʼ ἡμῶν ἔκρινεν εἶναι
  choice: ने यह निश्चय नहीं किया कि हमारे साथ भी वैसा ही हो
  rationale: यूनानी में निषेध और तुलना संक्षिप्त हैं। यह हिन्दी रूप इस बात को स्पष्ट करता है कि अन्य राष्ट्रों पर लागू विलंबित दंड की रीति को ‘हमारे’ मामले में समान रूप से लागू करने का निश्चय नहीं किया गया।
theological_decisions:
- issue: अन्य राष्ट्रों के प्रति परमेश्वर का धीरज और ‘हमारे’ प्रति उसका भिन्न व्यवहार
  choice: पद को इस विरोध के रूप में रखा गया है कि परमेश्वर अन्य राष्ट्रों को उनके पापों की पूरी सीमा तक पहुँचने देता है, पर उसने ‘हमारे’ साथ वैसा ही करने का निश्चय नहीं किया।
  alternative: 'तुलना को अत्यंत शब्दशः और संकुचित रूप में रखा जा सकता था: ‘उसने हमारे विषय में भी ऐसा होना नहीं ठहराया।’'
  rationale: οὐ ... καθάπερ ... οὕτως καὶ ἐφʼ ἡμῶν स्पष्ट तुलना और निषेध रचते हैं। अनुवाद विरोध को समझने योग्य बनाता है, पर इस पद से आगे बढ़कर परमेश्वर के भिन्न व्यवहार का कारण या पूर्ण धर्मवैज्ञानिक ढाँचा निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य-पाठक-अनुकूल रूप अपनाया गया है। ‘राष्ट्रों’ से ἔθνη का सामूहिक राजनीतिक-जातीय भाव और ‘स्वामी’ से δεσπότης की विशिष्टता सुरक्षित रखी गई है।
