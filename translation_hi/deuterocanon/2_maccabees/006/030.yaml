base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/030.yaml
  text: But as he was about to die under the blows[a], he groaned and said, “To the Lord, who has the holy knowledge, it is clear that, though I could have been released from death, I am enduring cruel pains in my body while being scourged[b]; but in my soul I gladly suffer these things because of fear of him.”
translation:
  language: hi
  text: पर जब वह प्रहारों के बीच मरने ही वाला था, तो उसने कराहकर कहा, “पवित्र ज्ञान रखनेवाले प्रभु को यह स्पष्ट है कि, यद्यपि मुझे मृत्यु से छुड़ाया जा सकता था[b], फिर भी कोड़े खाते हुए मैं अपने शरीर में भीषण पीड़ाएँ सह रहा हूँ; पर अपनी आत्मा में मैं प्रभु का भय मानने के कारण[a] यह सब प्रसन्नतापूर्वक सहता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके प्रति श्रद्धा के कारण।” यूनानी शब्द का अर्थ “भय” है, जिसमें परमेश्वर के प्रति श्रद्धायुक्त भय भी शामिल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मृत्यु से छुड़ाया जा सकता था” का अर्थ है कि वह आज्ञा मानकर मृत्युदंड से बच सकता था या उसे छोड़ दिया जा सकता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλων ... τελευτᾷν
  choice: मरने ही वाला था
  rationale: यह निकट भविष्य और आसन्न मृत्यु का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ταῖς πληγαῖς
  choice: प्रहारों से
  rationale: यह बहुवचन संज्ञा मार या प्रहार को दर्शाती है और मृत्यु की परिस्थिति अथवा साधन—दोनों की गुंजाइश बनाए रखती है।
- source_word: ἀναστενάξας
  choice: कराहकर
  rationale: यह गहरी, सुनाई देनेवाली पीड़ा-भरी आह या कराह को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ κυρίῳ τῷ τὴν ἁγίαν γνῶσιν ἔχοντι
  choice: पवित्र ज्ञान रखनेवाले प्रभु के लिए
  rationale: यह प्रभु को संबोधित दत्तिवाचक पद और उनके पास पवित्र ज्ञान होने की बात को बिना ‘सत्य’ जैसी व्याख्यात्मक संज्ञा जोड़े सुरक्षित रखता है।
- source_word: φανερὸν ἐστὶν
  choice: यह स्पष्ट है
  rationale: यह यूनानी के निर्वैयक्तिक कथन का सीधा और आधुनिक हिन्दी रूप है।
- source_word: δυνάμενος ἀπολυθῆναι τοῦ θανάτου
  choice: यद्यपि मैं मृत्यु से छुड़ाया जा सकता था
  rationale: यह बच निकलने की संभावना और मूल के निष्क्रिय ‘छुड़ाए जाने’—दोनों को बनाए रखता है; संदर्भगत आशय पादटिप्पणी में दिया गया है।
- source_word: σκληρὰς ... ἀλγηδόνας
  choice: भीषण पीड़ाएँ
  rationale: यह शारीरिक वेदना की कठोरता और तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: μαστιγούμενος
  choice: कोड़े खाते हुए
  rationale: यह दंड के रूप में कोड़े लगाए जाने की क्रिया को स्पष्ट, सामान्य और गरिमापूर्ण भाषा में व्यक्त करता है।
- source_word: κατὰ σῶμα ... κατὰ ψυχὴν
  choice: अपने शरीर में ... अपनी आत्मा में
  rationale: यह मूल पाठ के शरीर और आत्मा के स्पष्ट विरोध को बनाए रखता है।
- source_word: ἡδέως
  choice: प्रसन्नतापूर्वक
  rationale: यह पीड़ा को स्वेच्छा और आंतरिक प्रसन्नता से स्वीकार करने का भाव रखता है, बिना उसे हल्का बनाए।
- source_word: διὰ τὸν αὐτοῦ φόβον
  choice: उनका भय मानने के कारण
  rationale: यह φόβος के प्रबल ‘भय’ अर्थ को बनाए रखते हुए परमेश्वर के प्रति श्रद्धायुक्त भय की हिन्दी मुहावरेदार अभिव्यक्ति देता है।
theological_decisions:
- issue: प्रभु के संबंध में φόβος का अर्थ
  choice: उनका भय मानने के कारण
  alternative: उनके प्रति श्रद्धा के कारण
  rationale: φόβος का मूल अर्थ ‘भय’ है, पर परमेश्वर के संदर्भ में इसमें श्रद्धायुक्त भय भी समाहित हो सकता है। मुख्य पाठ में ‘भय’ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: σῶμα और ψυχή का विरोध
  choice: शरीर ... आत्मा
  alternative: शरीर ... अंतरात्मा/भीतर का मनुष्य
  rationale: मूल पाठ शारीरिक पीड़ा और आंतरिक प्रसन्न स्वीकृति के बीच स्पष्ट भेद करता है। ‘आत्मा’ ψυχή को किसी केवल मनोवैज्ञानिक अर्थ तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य का स्वर गरिमापूर्ण रखा गया है, पर ‘कराहकर,’ ‘कोड़े खाते हुए’ और ‘भीषण पीड़ाएँ’ जैसे सामान्य शब्दों से कथन को सहज बोधगम्य बनाया गया है। प्रभु के लिए आदरसूचक बहुवचन सर्वनाम ‘उनका’ प्रयुक्त हुआ है।
