  yaml_path: translation/deuterocanon/2_maccabees/006/015.yaml
  text: so that[a], when our sins have reached their full measure[b], he may not afterward take vengeance on us.
translation:
  language: hi
  text: ताकि जब हमारे पाप अपनी पूरी सीमा तक पहुँच जाएँ[a], तब वह बाद में हमसे बदला न ले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: ‘हमारे पाप अन्त तक पहुँच जाएँ।’ इसका सम्भावित अर्थ है कि पाप अपनी पूरी सीमा या पूर्ण परिमाण तक पहुँच जाएँ।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘वह’ के लिए अलग शब्द नहीं है; निकटवर्ती प्रसंग से इसका संकेत प्रभु की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: यह संयोजन प्रयोजनसूचक निषेध व्यक्त करता है। आधुनिक हिन्दी में ‘ताकि ... न’ स्वाभाविक है और पूर्ववर्ती प्रसंग में तत्काल दण्ड न देने के उद्देश्य को बनाए रखता है।
- source_word: πρὸς τέλος
  choice: अपनी पूरी सीमा तक
  rationale: शाब्दिक अर्थ ‘अन्त तक’ है, पर पापों के सन्दर्भ में यह उनके निर्धारित चरम या पूर्ण परिमाण तक पहुँचने का भाव देता है। ‘पूरी सीमा’ समयगत अन्त की अपेक्षा इस परिमाणात्मक भाव को स्पष्ट करती है।
- source_word: ἀφικομένων
  choice: पहुँच जाएँ
  rationale: यह क्रिया किसी अन्त-बिन्दु या सीमा तक पहुँचने को व्यक्त करती है। हिन्दी आश्रित वाक्य में ‘पहुँच जाएँ’ स्वाभाविक रूप से प्रयुक्त है।
- source_word: ἡμῶν τῶν ἁμαρτιῶν
  choice: हमारे पाप
  rationale: यूनानी सम्बन्धकारक रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ὕστερον
  choice: बाद में
  rationale: यह तत्काल दण्ड के विपरीत बाद की कार्रवाई को सूचित करता है।
- source_word: ἐκδικά
  choice: हमसे बदला ले
  rationale: क्रिया न्यायिक प्रतिशोध या दण्ड चुकाने का प्रबल भाव रखती है। ‘बदला ले’ उस प्रतिशोधात्मक बल को सामान्य ‘दण्ड दे’ की अपेक्षा अधिक निकटता से व्यक्त करता है।
theological_decisions:
- issue: इस उपवाक्य में दैवी कर्ता निहित है, स्पष्ट रूप से लिखा नहीं गया
  choice: वह बाद में हमसे बदला न ले
  alternative: प्रभु बाद में हमसे बदला न ले
  rationale: यूनानी में कर्ता व्यक्त नहीं है, यद्यपि तत्काल प्रसंग से प्रभु अभिप्रेत है। हिन्दी में कर्ता आवश्यक होने के कारण ‘वह’ रखा गया है; इससे प्रसंगगत अर्थ स्पष्ट रहता है और मूल से अधिक स्पष्ट धार्मिक पदवी नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘पूरी सीमा’ मूल मुहावरे का अर्थ स्पष्ट करती है, जबकि पादटिप्पणी उसका अधिक शाब्दिक रूप सुरक्षित रखती है।
