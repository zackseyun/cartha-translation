lexical_decisions:
- source_word: μετʼ εὐκλείας θάνατον
  choice: सम्मानपूर्ण मृत्यु
  rationale: εὐκλεία अच्छे नाम, प्रतिष्ठा और सम्मान का भाव व्यक्त करता है। ‘सम्मानपूर्ण मृत्यु’ आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाले अपवित्र जीवन के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: μετὰ μύσους βίον
  choice: अपवित्र जीवन
  rationale: μύσος नैतिक अथवा धार्मिक अशुद्धता और कलुष का बोध कराता है। ‘अपवित्र जीवन’ प्रसंग के इस अर्थ को बनाए रखता है, बिना इसे केवल सामाजिक अपमान तक सीमित किए।
- source_word: ἀναδεξάμενος
  choice: अपनाया
  rationale: यह कृदन्त जानबूझकर स्वीकार करने या अपने ऊपर लेने का भाव रखता है। ‘अपनाया’ उसकी दृढ़ और स्वैच्छिक स्वीकृति को संक्षेप में व्यक्त करता है।
- source_word: αὐθαιρέτως
  choice: अपनी इच्छा से
  rationale: यह शब्द स्वयं प्रेरित होकर, स्वेच्छा से किए गए कार्य पर बल देता है।
- source_word: ἐπὶ τὸ τύμπανον
  choice: यातना-यंत्र की ओर
  rationale: इस प्रसंग में τύμπανον कोई वाद्य नहीं, बल्कि यातना देने का उपकरण है। यंत्र का ठीक स्वरूप अनिश्चित होने के कारण मुख्य पाठ में व्यापक कार्यपरक शब्द रखा गया है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: προσῆγεν
  choice: की ओर बढ़ा
  rationale: αὐθαιρέτως के साथ यह रूप निष्क्रिय रूप से ले जाए जाने के बजाय स्वयं आगे जाने का भाव देता है।
theological_decisions:
- issue: μύσος का नैतिक-धार्मिक अर्थ
  choice: अपवित्र जीवन
  alternative: कलंकित जीवन; घृणित जीवन
  rationale: प्रसंग में व्यवस्था-विरुद्ध आचरण द्वारा स्वयं को कलुषित करने का भाव है। ‘अपवित्र’ इस नैतिक-धार्मिक तनाव को बचाता है, जबकि ‘कलंकित’ इसे मुख्यतः सामाजिक प्रतिष्ठा का विषय बना सकता है।
- issue: τύμπανον की पहचान
  choice: यातना-यंत्र
  alternative: ढोल; यातना-चक्र; यातना की टिकटी
  rationale: यूनानी शब्द का शाब्दिक संबंध ढोल से है, पर यहाँ वह यातना के उपकरण को दर्शाता है। उसका सटीक आकार अनिश्चित है, इसलिए किसी विशिष्ट ऐतिहासिक यंत्र की पहचान थोपे बिना कार्यपरक अनुवाद किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सम्मानपूर्ण मृत्यु’ और ‘अपवित्र जीवन’ मूल के तीखे विरोध को बनाए रखते हैं; वाक्य में एलीआज़र की स्वैच्छिक दृढ़ता स्पष्ट है।
