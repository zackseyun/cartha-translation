  yaml_path: translation/deuterocanon/2_maccabees/006/001.yaml
  text: But after not much time[a], the king sent an aged Athenian to compel the Jews to depart from the laws of their fathers and not to live by the laws of God[b],
translation:
  language: hi
  text: फिर कुछ ही समय बाद[a] राजा ने एक वृद्ध एथेनियाई व्यक्ति को भेजा कि वह यहूदियों को अपने पुरखों की व्यवस्थाओं को छोड़ने और परमेश्वर की व्यवस्थाओं के अनुसार जीवन न बिताने[b] के लिए विवश करे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बहुत समय न बीतने पर।”
    reason: lexical_alternative
  - marker: b
    text: “जीवन बिताने” वाली यूनानी क्रिया में नागरिक या सामुदायिक जीवन चलाने का भाव भी हो सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: Μετʼ οὐ πολὺν ... χρόνον
  choice: फिर कुछ ही समय बाद
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘बहुत समय न बीतने पर’ है। चुना हुआ रूप समय की अल्पता को रखते हुए स्वाभाविक आधुनिक हिन्दी देता है।
- source_word: ἐξαπέστειλεν
  choice: भेजा
  rationale: क्रिया का अर्थ ‘भेजना’ या ‘रवाना करना’ है; यहाँ सरल ‘भेजा’ पर्याप्त और स्वाभाविक है।
- source_word: γέροντι Ἀθηναῖον
  choice: एक वृद्ध एथेनावासी
  rationale: γέρων यहाँ सम्भवतः आयु का वर्णन करता है, किसी यहूदी पद ‘प्राचीन’ का नहीं। Ἀθηναῖος को नगर-निवासी के रूप में स्पष्ट किया गया है।
- source_word: ἀναγκάζειν
  choice: विवश करे
  rationale: यह भेजे जाने का उद्देश्य बताता है और बलपूर्वक बाध्य करने का भाव स्पष्ट रखता है।
- source_word: μεταβαίνειν ἀπὸ τῶν πατρίων νόμων
  choice: अपने पुरखों की व्यवस्थाओं को छोड़ने
  rationale: μεταβαίνειν ἀπό दूर हटने या त्यागने का भाव देता है। ‘पुरखों की व्यवस्थाएँ’ पैतृक/वंशागत स्वर को सहज हिन्दी में बनाए रखता है।
- source_word: τοῖς τοῦ θεοῦ νόμοις
  choice: परमेश्वर की व्यवस्थाओं
  rationale: सम्बन्धकारक रचना का सीधा अनुवाद है और पहले आए νόμοις के साथ शब्दगत समानता रखता है।
- source_word: μὴ πολιτεύεσθαι
  choice: के अनुसार जीवन न बिताने
  rationale: πολιτεύομαι में नागरिक या सामुदायिक आचरण की छाया हो सकती है, पर यहाँ व्यापक आशय जीवन-व्यवहार है। यह रूप उस अर्थ को बिना केवल राजनीति तक सीमित किए व्यक्त करता है।
theological_decisions:
- issue: πατρίων में पैतृक/पूर्वज-संबंधी भाषा
  choice: अपने पुरखों की व्यवस्थाएँ
  alternative: अपनी पैतृक व्यवस्थाएँ; अपने पूर्वजों की व्यवस्थाएँ
  rationale: यूनानी शब्द विरासत में मिली पितृपरम्परा का बोध देता है। ‘पुरखों’ स्रोत के पारिवारिक स्वर को प्राकृतिक हिन्दी में सुरक्षित रखता है।
- issue: परमेश्वर की व्यवस्था के सम्बन्ध में πολιτεύεσθαι
  choice: परमेश्वर की व्यवस्थाओं के अनुसार जीवन बिताना
  alternative: परमेश्वर की व्यवस्थाओं के अनुसार आचरण करना; उनके अनुसार अपना सामुदायिक जीवन चलाना
  rationale: क्रिया में जीवन-आचरण और नागरिक व्यवहार दोनों की सम्भावना है। चुना हुआ रूप व्यापक अर्थ रखता है और राजनीतिक अर्थ को अनावश्यक रूप से प्रधान नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण ऐतिहासिक-वर्णनात्मक रूप अपनाया गया है। ‘व्यवस्था’ को νόμος के लिए दोनों स्थानों पर समान रखा गया है। पद के अन्त का अल्पविराम अगले पद में वाक्य जारी रहने के कारण सुरक्षित है।
