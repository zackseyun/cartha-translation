  text: A certain Eleazar[a], one of the leading scribes, a man already advanced in age and most handsome in appearance, was being forced, with his mouth pried open, to eat pork.
translation:
  language: hi
  text: प्रमुख शास्त्रियों में से एलीआज़र नाम का एक व्यक्ति, जो काफी वृद्ध हो चुका था और जिसका चेहरा अत्यंत सुंदर था, उसका मुँह जबरन खोलकर उसे सूअर का मांस खाने के लिए विवश किया जा रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεάζαρός τις
  choice: एलीआज़र नाम का एक व्यक्ति
  rationale: τις का कथात्मक अनिश्चित भाव स्वाभाविक हिन्दी में ‘नाम का एक व्यक्ति’ से व्यक्त होता है; नाम का मानक देवनागरी लिप्यंतरण किया गया है।
- source_word: τῶν πρωτευόντων γραμματέων
  choice: प्रमुख शास्त्रियों में से
  rationale: πρωτευόντων पद और प्रतिष्ठा में अग्रणी होने का भाव देता है; γραμματέων के लिए यहूदी संदर्भ में ‘शास्त्री’ सटीक और प्रचलित है।
- source_word: ἤδη προβεβηκὼς τὴν ἡλικίαν
  choice: उम्र में बहुत आगे बढ़ चुका था
  rationale: यह वाक्यांश वृद्धावस्था में काफी आगे बढ़ जाने को दर्शाता है; हिन्दी अभिव्यक्ति गरिमापूर्ण और सहज है।
- source_word: τὴν πρόσοψιν τοῦ προσώπου κάλλιστος
  choice: जिसका चेहरा देखने में अत्यंत सुंदर था
  rationale: मूल पाठ बाहरी मुखाकृति पर केंद्रित है और κάλλιστος की तीव्रता बनाए रखता है; ‘गरिमामय’ जैसे नैतिक गुण को आयात नहीं किया गया।
- source_word: ἀναχαινόμενον
  choice: उसका मुँह जबरन खोलकर
  rationale: कृदंत मुँह को बलपूर्वक खोले जाने की शारीरिक हिंसा बताता है; हिन्दी में क्रियाविशेषणात्मक रचना स्वाभाविक है।
- source_word: ἠναγκάζετο
  choice: विवश किया जा रहा था
  rationale: अपूर्णकालिक कर्मवाच्य जारी दबाव और बाध्यता दोनों को व्यक्त करता है।
- source_word: ὕειον κρέας
  choice: सूअर का मांस
  rationale: यूनानी पद का सीधा, स्पष्ट और आधुनिक हिन्दी समतुल्य; संदर्भ से बाहर अतिरिक्त धार्मिक व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: शहादत और आहार-विधि के संदर्भ में निषिद्ध मांस का उल्लेख
  choice: सूअर का मांस
  alternative: सुअर का गोश्त
  rationale: मूल यूनानी केवल सूअर के मांस का नाम लेता है। चुना गया रूप सामान्य हिन्दी में स्पष्ट है और मुख्य पाठ में आहार-विधि संबंधी व्याख्या जोड़कर धार्मिक तनाव को समय से पहले नहीं सुलझाता।
- issue: κάλλιστος में बाहरी सुंदरता अथवा गरिमामय व्यक्तित्व
  choice: चेहरा देखने में अत्यंत सुंदर
  alternative: चेहरा अत्यंत गरिमामय
  rationale: πρόσοψιν τοῦ προσώπου के साथ κάλλιστος प्रत्यक्ष रूप-रंग की ओर संकेत करता है। ‘गरिमामय’ संभावित भावार्थ है, पर वह मूल में स्पष्ट निहित नैतिक या सामाजिक गुण जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। शारीरिक बल-प्रयोग को स्पष्ट रखा गया है और मुखाकृति के वर्णन को नैतिक गुण में नहीं बदला गया।
