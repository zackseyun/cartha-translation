  yaml_path: translation/deuterocanon/2_maccabees/006/021.yaml
  text: But those who had been appointed over the unlawful meal[a], because of their long-standing acquaintance with the man, took him aside privately and urged him to bring meat that it was proper for him to use, prepared by himself, and to pretend that he was eating the meats from the sacrifice that had been ordered by the king[b],
translation:
  language: hi
  text: पर जो लोग उस धर्म-विरुद्ध भोज[a] की देखरेख के लिए नियुक्त थे, वे उस व्यक्ति पर दया और उससे पुराने समय से परिचय के कारण उसे अलग ले जाकर समझाने लगे कि वह ऐसा मांस ले आए जिसे खाना उसके लिए उचित हो और जो उसने स्वयं तैयार किया हो, और यह दिखावा करे कि वह राजा के आदेश के अनुसार बलि का मांस[b] खा रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी पद का अधिक शाब्दिक अर्थ ‘धर्म-विरुद्ध बातों/कामों’ हो सकता है; यहाँ प्रसंग निषिद्ध बलि-मांस खिलाने के लिए आयोजित भोज का है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात मूर्तिपूजक बलि में चढ़ाया गया मांस, जिसे राजा ने उसे खाने का आदेश दिया था।
    reason: cultural_note
lexical_decisions:
- source_word: οἱ ... τεταγμένοι
  choice: जो लोग ... की देखरेख के लिए नियुक्त थे
  rationale: पूर्ण कर्मवाच्य कृदंत उन व्यक्तियों को दर्शाता है जिन्हें पहले से यह दायित्व सौंपा गया था।
- source_word: πρὸς τὰ παράνομα
  choice: उस धर्म-विरुद्ध भोज
  rationale: यूनानी पद शब्दशः ‘धर्म-विरुद्ध बातों/कामों’ जैसा संक्षिप्त और संदर्भाधीन है; निकट प्रसंग जबरन निषिद्ध बलि-मांस खिलाने का है, इसलिए ‘भोज’ संदर्भ को स्पष्ट करता है, जबकि ‘धर्म-विरुद्ध’ उसके धार्मिक-कानूनी आशय को बनाए रखता है।
- source_word: σπλαγχνισμοῦ ... διὰ τὴν ... γνῶσιν
  choice: अपने बहुत पुराने परिचय के कारण उस पर दया करके
  rationale: अनुवाद में यूनानी के दया/करुणा के स्पष्ट भाव और पुराने व्यक्तिगत परिचय—दोनों को प्रत्यक्ष रखा गया है।
- source_word: ἀπολαμβάνοντες αὐτὸν κατʼ ἰδίαν
  choice: उसे एक ओर ले गए
  rationale: यह उसे दूसरों से अलग करके निजी रूप से बात करने का स्वाभाविक हिन्दी रूप है।
- source_word: ἐνέγκοντα κρέα, οἷς καθῆκον αὐτῷ χρᾶσθαι
  choice: अपने लिए ऐसा मांस ले आए जिसे खाना उसके लिए उचित हो
  rationale: भोजन के संदर्भ में χρᾶσθαι का अभिप्राय उस मांस को आहार के रूप में ग्रहण करना है; ‘उचित’ καθῆκον के नैतिक और धार्मिक औचित्य को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: διʼ αὐτοῦ παρασκευασθέντα
  choice: जिसे उसने स्वयं तैयार किया हो
  rationale: यह दर्शाता है कि वह मांस उसके अपने नियंत्रण में तैयार हुआ था, न कि राजकीय मूर्तिपूजक बलि से आया था।
- source_word: ὑποκρῖναι
  choice: यह दिखावा करे
  rationale: यहाँ क्रिया का अर्थ अभिनय करना या झूठा आभास देना है।
- source_word: τὰ ὑπὸ τοῦ βασιλέως τεταγμένα
  choice: राजा की आज्ञा के अनुसार
  rationale: राजा द्वारा निर्धारित या आदेशित व्यवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν ἀπὸ τῆς θυσίας κρεῶν
  choice: बलि का मांस
  rationale: हिन्दी में ‘मांस’ सामान्यतः द्रव्यवाचक है; यह यूनानी बहुवचन के सामूहिक अर्थ और बलि से उसके स्रोत—दोनों को व्यक्त करता है।
theological_decisions:
- issue: τὰ παράνομα का ठोस संदर्भ
  choice: धर्म-विरुद्ध भोज
  alternative: धर्म-विरुद्ध काम / धर्म-विरुद्ध अनुष्ठान
  rationale: मूल पद अस्पष्ट और संक्षिप्त है, पर तत्काल प्रसंग निषिद्ध बलि-मांस खाने का है। मुख्य पाठ में ‘भोज’ कथानक स्पष्ट करता है और पादटिप्पणी मूल की व्यापकता बताती है।
- issue: σπλαγχνισμοῦ में करुणा का भाव
  choice: मुख्य पाठ में ‘उस पर दया करके’ स्पष्ट रूप से रखा गया
  alternative: केवल पुराने परिचय को कारण बताना
  rationale: यूनानी पाठ में दया/करुणा का भाव प्रत्यक्ष है; इसे केवल परिचय में समाहित करने से स्रोत का एक अर्थपूर्ण तत्व दब सकता था।
- issue: कपटपूर्ण अनुपालन का चित्रण
  choice: ‘यह दिखावा करे कि... खा रहा है’
  alternative: ‘ऐसा अभिनय करे मानो... खा रहा हो’
  rationale: दोनों सम्भव हैं; ‘दिखावा’ सामान्य पाठक के लिए सीधा है और ὑποκρῖναι का नैतिक तनाव बनाए रखता है, बिना उसके आचरण का अतिरिक्त धर्मशास्त्रीय निर्णय किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरुष’ से पूर्वपद के औपचारिक स्वर को रखा गया, जबकि कथन-विन्यास को स्वाभाविक हिन्दी के लिए दो वाक्यों में बाँटा गया है। मूल यूनानी में करुणा का स्पष्ट भाव मुख्य पाठ में सुरक्षित रखा गया है।
