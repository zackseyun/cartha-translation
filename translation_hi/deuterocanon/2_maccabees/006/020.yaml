base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/020.yaml
  text: But after spitting it out[a], he came forward in the manner required for those who choose to resist things that it is not lawful to taste, even for the sake of one’s attachment to life.
translation:
  language: hi
  text: परन्तु उसे थूक देने के बाद, वह उस रीति से आगे बढ़ा जिस रीति से उन लोगों को आगे बढ़ना चाहिए जो जीवन से लगाव के कारण भी उन वस्तुओं को चखने से इनकार करने में दृढ़ रहते हैं[a] जिन्हें चखना धर्मसम्मत नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उन वस्तुओं का प्रतिरोध करते हुए धीरज धरते हैं जिन्हें चखना धर्मसम्मत नहीं है।” यूनानी में धीरज धरने और प्रतिरोध करने के भाव एक कठिन, संक्षिप्त पदबंध में जुड़े हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προπτύσας
  choice: उसे थूक देने के बाद
  rationale: अपूर्णकालिक कृदन्त पहले घटित क्रिया को बताता है; प्रसंग से स्पष्ट है कि उसने मुँह में दी गई निषिद्ध वस्तु को बाहर थूक दिया।
- source_word: καθʼ ὃν ἔδει τρόπον
  choice: उसी रीति से ... जैसी ... उचित थी
  rationale: यह वाक्यांश परिस्थिति के अनुरूप नैतिक औचित्य और आवश्यक आचरण—दोनों का भाव रखता है; ‘उचित थी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: προσέρχεσθαι
  choice: वह ... आगे बढ़ा
  rationale: यूनानी में यह क्रिया infinitive रूप में है, पर संक्षिप्त वाक्य-विन्यास में एलीआज़र के दण्ड अथवा यातना की ओर स्वयं आगे आने का वर्णन करती है। हिन्दी में पूर्ण वाक्य के लिए इसे कथात्मक क्रिया बनाया गया है।
- source_word: τοὺς ὑπομένοντας ἀμύνασθαι
  choice: जो ... इनकार करने पर दृढ़ रहते हैं
  rationale: ὑπομένω का धैर्यपूर्वक दृढ़ बने रहने का भाव और ἀμύνομαι का किसी बात को रोकने अथवा उसका प्रतिरोध करने का भाव एक साथ व्यक्त किया गया है। ‘इनकार’ प्रसंग में निषिद्ध भोजन स्वीकार न करने को स्वाभाविक रूप से बताता है।
- source_word: ὧν οὐ θέμις γεύσασθαι
  choice: जिन्हें चखना धर्मसम्मत नहीं है
  rationale: θέμις केवल नागरिक कानून नहीं, बल्कि ईश्वरीय और धार्मिक व्यवस्था के अनुसार उचित या अनुमत होने को सूचित करता है। ‘धर्मसम्मत नहीं’ इस पवित्र-नैतिक बल को बनाए रखता है, जबकि ‘चखना’ γεύομαι की विशिष्टता बचाता है।
- source_word: διὰ τὴν πρὸς ζῆν φιλοστοργίαν
  choice: जीवन से लगाव के कारण भी
  rationale: φιλοστοργία जीवन बनाए रखने के स्वाभाविक और प्रबल अनुराग को व्यक्त करता है। ‘लगाव’ भावात्मक सूक्ष्मता को रखता है और ‘भी’ यह स्पष्ट करता है कि जीवन बचाने की इच्छा भी निषिद्ध वस्तु चखने को उचित नहीं बनाती।
theological_decisions:
- issue: οὐ θέμις का धार्मिक और नैतिक बल
  choice: धर्मसम्मत नहीं है
  alternative: वैध नहीं है / वर्जित है
  rationale: यहूदी शहादत के प्रसंग में बात केवल राजकीय वैधता की नहीं, बल्कि परमेश्वर-प्रदत्त धार्मिक व्यवस्था के अनुसार अनुमत होने की है। ‘धर्मसम्मत’ इस बल को बिना किसी बाद की साम्प्रदायिक शब्दावली के व्यक्त करता है।
- issue: ὑπομένοντας ἀμύνασθαι में धैर्य और प्रतिरोध का संबंध
  choice: इनकार करने पर दृढ़ रहते हैं
  alternative: प्रतिरोध सहते रहते हैं / अपने को बचाते हैं
  rationale: यूनानी पदबंध संक्षिप्त और कठिन है। मुख्य पाठ में दृढ़ता और सक्रिय अस्वीकार—दोनों रखे गए हैं, जबकि पाद-टिप्पणी उसकी व्याकरणिक अस्पष्टता बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धर्मसम्मत’ धार्मिक-नैतिक वैधता व्यक्त करता है; कठिन यूनानी पदबंध की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
