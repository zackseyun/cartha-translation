base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/026.yaml
  text: For even if for the present I escape the punishment from men[b][a], yet I will escape neither alive nor dead from the hands of the Almighty.
translation:
  language: hi
  text: क्योंकि यदि मैं इस समय मनुष्यों से मिलने वाले दण्ड से बच भी जाऊँ,[a] तो भी मैं न तो जीते जी और न ही मरने के बाद सर्वशक्तिमान के हाथों से बच सकूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा अधिक स्पष्ट रूप से, “मनुष्यों द्वारा दिए जाने वाले दण्ड से।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात मृत्यु भी सर्वशक्तिमान के हाथों से बचने का उपाय नहीं है।
    reason: lexical_clarification
lexical_decisions:
- source_word: εἰ γὰρ καὶ
  choice: क्योंकि यदि ... भी
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को और ‘यदि ... भी’ εἰ ... καί के रियायती भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐπὶ τοῦ παρόντος
  choice: इस समय
  rationale: यह वाक्यांश वर्तमान परिस्थिति तक सीमित बचाव को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξελοῦμαι
  choice: बच ... जाऊँ
  rationale: इस प्रसंग में मध्यम रूप दण्ड से निकल भागने या बच जाने का भाव देता है; ‘बच जाऊँ’ सबसे स्वाभाविक हिन्दी है।
- source_word: τὴν ἐξ ἀνθρώπων τιμωρίαν
  choice: मनुष्यों से मिलने वाले दण्ड
  rationale: ἐξ ἀνθρώπων को दण्ड के मानवीय स्रोत के रूप में व्यक्त करता है और आगे आने वाले दैवी प्रतिफल से उसका विरोध बनाए रखता है।
- source_word: τὰς τοῦ παντοκράτορος χεῖρας
  choice: सर्वशक्तिमान के हाथों
  rationale: παντοκράτωρ के लिए परिचित पदवी ‘सर्वशक्तिमान’ और χεῖρας का सजीव बाइबलीय रूपक ‘हाथों’ सुरक्षित रखा गया है।
- source_word: οὔτε ζῶν οὔτε ἀποθανών
  choice: न तो जीवित रहते हुए, न ही मरकर
  rationale: यह यूनानी की तीखी द्विपदी संरचना को बनाए रखता है और स्पष्ट करता है कि मृत्यु भी सर्वशक्तिमान की पहुँच से बचने का उपाय नहीं है।
- source_word: ἐκφεύξομαι
  choice: बच सकूँगा
  rationale: भविष्यकाल और बच निकलने के अर्थ को हिन्दी में सहज रूप से व्यक्त करता है; निषेध ‘न तो ... न ही’ संरचना में निहित है।
theological_decisions:
- issue: παντοκράτωρ का अनुवाद
  choice: सर्वशक्तिमान
  alternative: सर्वसामर्थी
  rationale: ‘सर्वशक्तिमान’ आधुनिक हिन्दी में प्रतिष्ठित और स्पष्ट ईश्वरीय पदवी है। मूल में ‘परमेश्वर’ शब्द स्पष्ट रूप से नहीं है, इसलिए उसे जोड़ा नहीं गया।
- issue: οὔτε ζῶν οὔτε ἀποθανών में मृत्यु के बाद भी उत्तरदायित्व का संकेत
  choice: न तो जीवित रहते हुए, न ही मरकर
  alternative: चाहे जीवित रहूँ या मर जाऊँ
  rationale: चुना हुआ रूप मूल की निषेधात्मक समानांतरता और इस तनाव को सुरक्षित रखता है कि मृत्यु मनुष्य को सर्वशक्तिमान की पहुँच से बाहर नहीं करती, पर इससे आगे कोई विस्तृत परलोक-सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दण्ड’ और ‘सर्वशक्तिमान’ जैसे परिचित धार्मिक शब्दों के साथ वाक्यरचना सामान्य पाठक के लिए स्पष्ट है; मूल का मानवीय दण्ड और दैवी न्याय के बीच विरोध तथा ‘हाथों’ का रूपक बनाए रखा गया है।
