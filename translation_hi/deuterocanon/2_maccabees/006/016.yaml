  text: Therefore he never withdraws his mercy from us; but while disciplining with calamity, he does not abandon his own people.
translation:
  language: hi
  text: इसलिए वह अपनी दया हमसे कभी नहीं हटाता; पर विपत्ति से अनुशासन करते हुए भी वह अपने लोगों को नहीं छोड़ता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्ष निकालने वाला संबंधसूचक शब्द है; ‘इसलिए’ आधुनिक हिन्दी में उसके तार्किक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐδέποτε
  choice: कभी नहीं
  rationale: यह समय का पूर्ण निषेध है, जिसे हिन्दी में ‘कभी नहीं’ स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: τὸν ἔλεον
  choice: अपनी दया
  rationale: ἔλεος का अर्थ दया या करुणा है। कर्ता परमेश्वर है और यूनानी में निहित संबंध को हिन्दी में ‘अपनी’ स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἀφʼ ἡμῶν ἀφίστησιν
  choice: हमसे ... नहीं हटाता
  rationale: ἀφίστημι के साथ ἀπό किसी वस्तु को किसी से दूर करने या हटा लेने का भाव देता है; यह पदबंध उस अर्थ को सीधे रखता है।
- source_word: παιδεύων
  choice: अनुशासित करते हुए
  rationale: παιδεύω में शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन का अर्थक्षेत्र है। यहाँ दुःख के बीच सुधारात्मक दिव्य कार्य अभिप्रेत है, इसलिए यह अनुवाद दंडात्मक अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: μετὰ συμφορᾶς
  choice: विपत्ति के द्वारा
  rationale: συμφορά गंभीर दुर्भाग्य, संकट या विपत्ति को दर्शाता है। प्रसंग में μετά अनुशासन के साधन या साथ की परिस्थिति को व्यक्त करता है; ‘के द्वारा’ यहाँ साधनात्मक अर्थ को सहजता से देता है।
- source_word: οὐκ ἐγκαταλείπει
  choice: नहीं छोड़ता
  rationale: ἐγκαταλείπω का अर्थ त्याग देना या असहाय छोड़ देना है। ‘नहीं छोड़ता’ आधुनिक हिन्दी में स्पष्ट है और परित्याग न करने का भाव रखता है।
- source_word: τὸν ἑαυτοῦ λαόν
  choice: अपनी प्रजा
  rationale: ἑαυτοῦ संबंध और स्वामित्व पर बल देता है। ‘अपनी प्रजा’ उस आत्मवाची बल को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: पαιδεύων में परमेश्वर के कार्य का स्वरूप
  choice: अनुशासित करते हुए
  alternative: ताड़ना देते हुए / शिक्षा देते हुए
  rationale: पद विपत्ति को सुधारात्मक अनुशासन के संदर्भ में रखता है, पर उसे परमेश्वर द्वारा अपनी प्रजा के परित्याग के समान नहीं मानता। ‘अनुशासित’ शिक्षा और सुधार दोनों को समेटता है तथा केवल दंड का अर्थ आरोपित नहीं करता।
- issue: τὸν ἔλεον में दया के स्वामी को स्पष्ट करना
  choice: अपनी दया
  alternative: दया
  rationale: यूनानी में निश्चित पदबंध है, जबकि प्रसंग और क्रिया का कर्ता स्पष्ट करते हैं कि दया परमेश्वर की है। हिन्दी में ‘अपनी’ जोड़ना नए धर्मवैज्ञानिक दावे के बिना संबंध को स्वाभाविक बनाता है।
- issue: μετὰ συμφορᾶς में विपत्ति और दिव्य अनुशासन का संबंध
  choice: विपत्ति के द्वारा
  alternative: विपत्ति के साथ / विपत्ति में
  rationale: रचना साधन अथवा साथ आने वाली परिस्थिति—दोनों की छाया रख सकती है। प्रसंग में ‘के द्वारा’ अनुशासन के माध्यम को अधिक स्वाभाविक रूप से व्यक्त करता है, पर यह विपत्ति को परित्याग नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘प्रजा’ λαός के सामुदायिक और परमेश्वर-संबंधी भाव को व्यक्त करती है; वाक्य की दो विरोधी धाराओं को अर्धविराम और ‘भी’ से स्पष्ट किया गया है।
