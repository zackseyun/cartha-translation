review_pass:
  verdict: revise
  source_fidelity: The first clause accurately conveys διόπερ, οὐδέποτε, and the withdrawal of mercy. In the second clause, the draft's “विपत्ति के द्वारा” narrows μετὰ (“with/in connection with”) to a strictly instrumental meaning, and “अनुशासित करते हुए” is grammatically possible but unnatural and leaves the disciplined object awkwardly implicit.
  naturalness: “अनुशासित करते हुए” is not idiomatic modern Hindi in this construction. “विपत्ति से अनुशासन करते हुए भी” is clearer, natural religious prose and keeps the participial relation to the main verb. “अपने लोगों” is more current and neutral than “अपनी प्रजा,” while retaining the possessive emphasis.
  terminology: “दया,” “विपत्ति,” “अनुशासन,” and “नहीं छोड़ता” suitably render ἔλεος, συμφορά, παιδεύων, and ἐγκαταλείπει. The revision does not identify the subject beyond what the Greek and context supply, and it preserves the corrective, non-abandoning contrast without doctrinal expansion.
  issues:
  - severity: medium
    issue: “विपत्ति के द्वारा” makes the relation of μετὰ συμφορᾶς exclusively instrumental.
    rationale: μετά with the genitive primarily expresses accompaniment/association (“with calamity”) and may suggest means in context, but “के द्वारा” removes that broader nuance. “विपत्ति से” is natural and preserves the close connection without over-specifying it.
  - severity: medium
    issue: “अनुशासित करते हुए” is awkward in this transitive participial clause.
    rationale: The Greek participle means that the subject is disciplining his people. Hindi “अनुशासन करते हुए” expresses this action idiomatically; the people remain the understood object, made explicit in the following main clause.
  - severity: low
    issue: “प्रजा” is more elevated and ruler-subject oriented than required by λαός.
    rationale: “अपने लोगों” is standard modern Hindi for a community or people and naturally carries the reflexive possessive emphasis of ἑαυτοῦ.
  revised_text: इसलिए वह अपनी दया हमसे कभी नहीं हटाता; पर विपत्ति से अनुशासन करते हुए भी वह अपने लोगों को नहीं छोड़ता।
  revised_footnotes: []
  revision_rationale: The revision corrects the awkward Hindi participial expression and avoids making the Greek prepositional phrase more exclusively instrumental than the source warrants. It retains the verse’s inference, enduring mercy, corrective discipline amid calamity, and assurance that God does not abandon his own people.
