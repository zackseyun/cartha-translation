revisions:
- from: इसलिए वह हमसे अपनी दया कभी नहीं हटाता; विपत्ति के द्वारा अनुशासित करते हुए भी वह अपनी प्रजा को नहीं छोड़ता।
  to: इसलिए वह अपनी दया हमसे कभी नहीं हटाता; पर विपत्ति से अनुशासन करते हुए भी वह अपने लोगों को नहीं छोड़ता।
  rationale: The revision corrects the awkward Hindi participial expression and avoids making the Greek prepositional phrase more exclusively instrumental than the source warrants. It retains the verse’s inference, enduring mercy, corrective discipline amid calamity, and assurance that God does not abandon his own people.
