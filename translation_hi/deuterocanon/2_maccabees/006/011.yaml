  yaml_path: translation/deuterocanon/2_maccabees/006/011.yaml
  text: But others[a], having gathered nearby in the caves to observe the week in secret, were informed against to Philip and were burned together, because they scrupled to defend themselves out of regard for the honor of that most holy day.
translation:
  language: hi
  text: परन्तु कुछ और लोग[a] पास की गुफाओं में इकट्ठे होकर छिपकर सप्ताह का पालन करने के लिए गए थे। उनकी मुखबिरी फिलिप्पुस से की गई, और वे एक साथ आग में जला दिए गए, क्योंकि उस परम-पवित्र दिन के सम्मान के कारण वे अपनी रक्षा करने में संकोच करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छिपकर सब्त का पालन करने के लिए।” यूनानी में शाब्दिक रूप से “छिपकर सप्ताह का पालन करने के लिए” है, पर इस प्रसंग में सम्भवतः सब्त के पालन की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: कुछ और लोग
  rationale: यह पिछले समूह से अनिश्चित भेद प्रकट करता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: πλησίον συνδρομόντες εἰς τὰ σπήλαια
  choice: पास की गुफाओं में इकट्ठे हो गए
  rationale: συνδρομόντες सामूहिक रूप से एकत्र होने और εἰς गुफाओं की ओर जाकर उनमें पहुँचने का भाव देता है; हिन्दी वाक्य में 'में इकट्ठे हो गए' दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λεληθότως ἄγειν τὴν ἑβδομάδα
  choice: छिपकर सप्ताह मनाएँ
  rationale: λεληθότως का अर्थ गुप्त या अनदेखे ढंग से है और ἄγειν समयावधि मनाने या बिताने के अर्थ में है। τὴν ἑβδομάδα का शाब्दिक रूप 'सप्ताह' रखा गया है; प्रसंगगत 'सब्त' अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: μηνυθέντες τῷ Φιλίππῳ
  choice: उनकी सूचना फिलिप्पुस को दे दी गई
  rationale: निष्क्रिय रूप उनके विरुद्ध भेद खोलने या शिकायत पहुँचाने का भाव रखता है; यह हिन्दी में स्वाभाविक रहते हुए शत्रुतापूर्ण प्रसंग को पर्याप्त रूप से व्यक्त करता है।
- source_word: συνεφλογίσθησαν
  choice: वे सब एक साथ आग में जला दिए गए
  rationale: क्रिया सामूहिक रूप से आग में जलाए जाने को व्यक्त करती है; 'जीवित' मूल क्रिया में स्पष्ट नहीं है, इसलिए नहीं जोड़ा गया।
- source_word: διὰ τὸ εὐλαβῶς ἔχειν βοηθῆσαι αὐτοῖς
  choice: उन्होंने अपनी रक्षा करना उचित नहीं समझा
  rationale: εὐλαβῶς ἔχειν श्रद्धापूर्ण संकोच या धार्मिक सावधानी दर्शाता है और βοηθῆσαι αὐτοῖς यहाँ अपनी सहायता, अर्थात अपनी रक्षा, करने के अर्थ में स्वाभाविक है।
- source_word: κατὰ δόξαν τῆς σεμνοτάτης ἡμέρας
  choice: उस परम पवित्र दिन के सम्मान के कारण
  rationale: δόξα यहाँ सम्मान और σεμνοτάτης उस दिन की सर्वोच्च धार्मिक गरिमा व्यक्त करता है; यह अनुवाद सहज और गरिमापूर्ण है।
theological_decisions:
- issue: τὴν ἑβδομάδα का अर्थ
  choice: मुख्य पाठ में 'सप्ताह'
  alternative: '''सब्त'' या ''सब्त का पालन'''
  rationale: यूनानी में स्पष्ट शब्द σάββατον नहीं बल्कि 'सप्ताह' है। मूल की असामान्य अभिव्यक्ति मुख्य पाठ में सुरक्षित रखी गई है और प्रसंग से सम्भावित सब्त-सन्दर्भ पाद-टिप्पणी में बताया गया है।
- issue: पीड़ितों द्वारा सहायता न करने का आशय
  choice: अपनी रक्षा करना उचित न समझना
  alternative: एक-दूसरे की सहायता न करना, या हर प्रकार की कार्रवाई से दूर रहना
  rationale: αὐτοῖς का आत्मवाचक आशय और निकट प्रसंग आत्मरक्षा की ओर संकेत करते हैं। 'उचित नहीं समझा' धार्मिक संकोच को व्यक्त करता है, बिना किसी अतिरिक्त सिद्धान्त को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। 'फिलिप्पुस' बाइबिलीय यूनानी नाम Φίλιππος का प्रचलित हिन्दी रूप है। मूल की 'सप्ताह' और प्रसंगगत 'सब्त' वाली वास्तविक अस्पष्टता को मुख्य पाठ और पाद-टिप्पणी के माध्यम से सुरक्षित रखा गया है।
