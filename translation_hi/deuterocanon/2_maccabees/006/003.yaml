translation:
  language: hi
  text: इस बुराई का दबाव सबके लिए कठोर और कष्टदायक था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बुराई का थोपा जाना सबके लिए कठोर और सहना कठिन था।”
    reason: ἐπίστασις के लिए ‘दबाव’ के स्थान पर ‘थोपा जाना’ और δυσχερής के लिए अधिक शाब्दिक ‘सहना कठिन’ संभव है।
lexical_decisions:
- source_word: χαλεπὴ
  choice: कठोर
  rationale: यह विशेषण स्थिति की तीव्रता और कठोरता व्यक्त करता है; ‘कठोर’ आधुनिक हिन्दी में स्वाभाविक है और दूसरे विशेषण से अलग अर्थ बनाए रखता है।
- source_word: δυσχερὴς
  choice: असहनीय
  rationale: यह शब्द किसी ऐसी बात का बोध कराता है जिसे सहना अत्यंत कठिन हो; ‘असहनीय’ पीड़ा और बोझ की गंभीरता स्पष्ट करता है।
- source_word: τοῖς ὅλοις
  choice: सबके लिए
  rationale: यहाँ वाक्यांश सभी संबंधित लोगों को समग्र रूप से सूचित करता है; ‘सबके लिए’ सहज और व्यापक है।
- source_word: ἡ ἐπίστασις
  choice: दबाव
  rationale: संदर्भ में यह केवल ‘ज्ञान’ नहीं, बल्कि बुराई के आ पड़ने या थोपे जाने से उत्पन्न दबाव को दर्शाता है। मुख्य पाठ में ‘दबाव’ इसी दमनकारी प्रभाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῆς κακίας
  choice: इस बुराई का
  rationale: κακία यहाँ पहले वर्णित दुष्ट और दमनकारी नीति की ओर संकेत करती है। ‘इस बुराई’ संदर्भ को ठोस रखता है, पर आवश्यकता से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: संदर्भ में κακία का आशय
  choice: पहले वर्णित दुष्ट दमन या नीति का ठोस संदर्भ
  alternative: सामान्य अर्थ में बुराई, अथवा किसी व्यक्ति का द्वेषपूर्ण स्वभाव
  rationale: आस-पास का वर्णन थोपी गई अपवित्रता और उत्पीड़न का है। इसलिए ठोस संदर्भ उचित है, किंतु अनुवाद यूनानी पाठ से आगे बढ़कर किसी विशेष नीति का नाम नहीं देता।
- issue: ἐπίστασις की अर्थगत अनिश्चितता
  choice: दमनकारी ‘दबाव’
  alternative: बुराई का ‘आ पड़ना’ या ‘थोपा जाना’
  rationale: संदर्भ दबाव के अर्थ का समर्थन करता है, पर संज्ञा में आरंभ, आगमन या आरोपण की छाया भी संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘कठोर और असहनीय’ यूनानी के दो निकटवर्ती विशेषणों का भेद बनाए रखता है।
