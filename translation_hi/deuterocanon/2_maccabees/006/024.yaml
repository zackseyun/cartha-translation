  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद मूल यूनानी की तरह अगले पद में जारी रहने वाला अपूर्ण वाक्यांश है, इसलिए अंत में अल्पविराम रखा गया है। ‘हमारी उम्र’ में एलआज़ार का गरिमापूर्ण आत्म-संदर्भ सुरक्षित है।
