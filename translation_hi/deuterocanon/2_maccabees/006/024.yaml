    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले प्रसंग में एलआज़ार के तर्क का कारण बताता है; ‘क्योंकि’ उसका व्याख्यात्मक संबंध स्पष्ट रखता है।
- source_word: τῆς ἡμετέρας ἡλικίας ἄξιόν ἐστιν
  choice: हमारी उम्र के व्यक्ति के लिए ... शोभनीय नहीं है
  rationale: ἡλικία यहाँ जीवन की उन्नत अवस्था को सूचित करता है और ἄξιος नैतिक अनुरूपता या गरिमा का भाव रखता है। यह हिंदी प्रयोग दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑποκριθῆναι
  choice: ढोंग करना
  rationale: संदर्भ में क्रिया का अर्थ झूठा अभिनय करना या ऐसी बाहरी छवि देना है जो वास्तविकता के विपरीत हो। ‘ढोंग करना’ आधुनिक हिंदी में स्पष्ट और सटीक है।
- source_word: ἵνα
  choice: ऐसा न हो कि
  rationale: यहाँ ἵνα उस आशंकित परिणाम को प्रस्तुत करता है जिसे एलआज़ार टालना चाहते हैं। नकारात्मक मुख्य कथन के बाद ‘ऐसा न हो कि’ हिंदी में अभिप्रेत चिंता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πολλοὶ τῶν νέων
  choice: बहुत-से युवा
  rationale: νέοι युवाओं के समूह को सूचित करता है; ‘युवा’ लिंग को अनावश्यक रूप से सीमित किए बिना सामान्य अर्थ बनाए रखता है।
- source_word: ὑπολαβόντες
  choice: यह समझ लें
  rationale: यह उस गलत निष्कर्ष या धारणा को दर्शाता है जो युवा एलआज़ार के बाहरी आचरण से निकाल सकते थे।
- source_word: Ἐλεάζαρον τὸν ἐνενηκονταετῆ
  choice: नब्बे वर्ष के एलआज़ार
  rationale: मूल के संबंधसूचक आयु-वर्णन को संक्षिप्त, स्वाभाविक हिंदी में रखता है और उनकी वृद्धावस्था पर दिए गए बल को बचाता है।
- source_word: μεταβεβληκέναι
  choice: अपना लिए हैं
  rationale: पूर्णकालिक infinitive एक पूरी हो चुकी मानी गई दिशा-परिवर्तन को दर्शाता है; हिंदी का पूर्ण पक्ष इस कथित परिवर्तन को स्पष्ट करता है।
- source_word: εἰς ἀλλοφυλισμόν
  choice: विजातीय रीति-रिवाज
  rationale: ἀλλοφυλισμός यहाँ गैर-यहूदी, विदेशी जीवन-रीति या पहचान अपनाने की ओर संकेत करता है। ‘विजातीय रीति-रिवाज’ सांस्कृतिक और सामुदायिक दूरी को बिना बाद की संप्रदायगत शब्दावली जोड़े व्यक्त करता है।
theological_decisions:
- issue: यहूदी शहादत के प्रसंग में ἀλλοφυλισμός का अनुवाद
  choice: विजातीय रीति-रिवाज
  alternative: विदेशी जीवन-रीति; गैर-यहूदी तौर-तरीके
  rationale: शब्द पैतृक यहूदी आचार और पहचान छोड़कर अन्य जातियों की प्रथाएँ अपनाने का भाव रखता है। चुना हुआ रूप covenantal-सामुदायिक तनाव को बनाए रखता है, पर ‘धर्मत्याग’ जैसा अधिक व्याख्यात्मक निष्कर्ष मूल में नहीं जोड़ता।
