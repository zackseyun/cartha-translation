  text: क्योंकि हमारी उम्र में ढोंग करना उचित नहीं है; ऐसा न हो कि बहुत-से युवा यह समझ लें कि नब्बे वर्ष के एलआज़ार ने विदेशी रीति-रिवाज अपना लिए हैं[a],
