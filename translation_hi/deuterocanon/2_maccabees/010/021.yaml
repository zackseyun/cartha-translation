  rationale: यह वर्ष बताने वाला यूनानी तिथि-सूत्र है। क्रमवाचक रूप मूल की व्याकरणिक और काल-सूचक भूमिका बनाए रखता है।
- source_word: Διὸς Κορινθίου
  choice: दिओस कोरिन्थियुस महीने
  rationale: यह मकिदूनियाई पंचांग के महीने का विशिष्ट नाम है। अर्थ गढ़ने के बजाय नाम का देवनागरी लिप्यंतरण किया गया है और हिन्दी पाठक की स्पष्टता के लिए ‘महीने’ जोड़ा गया है।
- source_word: τετράδι καὶ εἰκάδι
  choice: चौबीसवें दिन
  rationale: यूनानी में शब्दशः ‘चौथे और बीसवें’ है, जो महीने की चौबीसवीं तारीख बताने की प्रचलित रीति है; हिन्दी में इसका स्वाभाविक समतुल्य ‘चौबीसवें दिन’ है।
