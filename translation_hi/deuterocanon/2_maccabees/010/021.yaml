  rationale: यह पत्र के अंत में प्रयुक्त स्वास्थ्य-कामना और विदाई का रूढ़ वाक्य है; शाब्दिक ‘बलवान रहें’ की अपेक्षा ‘कुशल से रहें’ प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
