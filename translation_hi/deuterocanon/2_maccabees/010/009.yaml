  yaml_path: translation/deuterocanon/2_maccabees/010/009.yaml
  text: And all together they blessed the merciful God and were strengthened in their souls[b][a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: hi
  text: और उन सबने एक साथ दयालु परमेश्वर को धन्य कहा और उनके मनों में बल आया।[a] वे न केवल मनुष्यों को, बल्कि भयंकर से भयंकर जंगली पशुओं और लोहे की दीवारों तक को घायल करने के लिए तैयार थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे अपनी आत्माओं में दृढ़ किए गए”; अर्थात उन्होंने साहस पाया।
    reason: lexical_alternative
  - marker: b
    text: “लोहे की दीवारों को घायल करना” युद्ध में उनके अत्यधिक साहस को व्यक्त करने वाली अतिशयोक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: तब उन सबने एक साथ
  rationale: ὁμοῦ और πάντες के सामूहिक तथा सर्वसमावेशी बल को स्वाभाविक हिन्दी में बनाए रखता है; δέ को प्रसंगगत संक्रमण के रूप में ‘तब’ से व्यक्त किया गया है।
- source_word: εὐλόγησαν τὸν ἐλεήμονα θεόν
  choice: दयालु परमेश्वर को धन्य कहा
  rationale: εὐλόγησαν का परमेश्वर की ओर निर्देशित पारंपरिक अर्थ ‘धन्य कहा’ सुरक्षित रहता है और ἐλεήμονα के लिए सरल बाइबिलीय विशेषण ‘दयालु’ प्रयुक्त है।
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: उनके मनों में बल आया
  rationale: ग्रीक के भीतरी सुदृढ़ीकरण को सहज आधुनिक हिन्दी में व्यक्त करता है, पर इसे आत्मा-विषयक तकनीकी सिद्धांत नहीं बनाता।
- source_word: οὐ μόνον ἀνθρώπους θῆρας δὲ τοὺς ἀγριωτάτους καὶ σιδηρᾶ τείχη
  choice: न केवल मनुष्यों को, बल्कि भयंकर से भयंकर जंगली पशुओं और लोहे की दीवारों तक को
  rationale: वस्तुओं की बढ़ती हुई शृंखला और अतिशयोक्तिपूर्ण तीव्रता को ‘बल्कि’ तथा ‘तक’ से स्पष्ट करता है; τοὺς ἀγριωτάτους की सर्वोच्चता ‘भयंकर से भयंकर’ में आती है।
- source_word: τιτρώσκειν ὄντες ἕτοιμοι
  choice: घायल करने के लिए तैयार थे
  rationale: τιτρώσκειν का मूल अर्थ ‘घायल करना’ बनाए रखता है और ὄντες ἕτοιμοι को स्वाभाविक हिन्दी विधेय में व्यक्त करता है।
theological_decisions:
- issue: ψυχαῖς का मानव-स्वरूप संबंधी अर्थ
  choice: उनके मनों में बल आया
  alternative: उनकी आत्माएँ दृढ़ हो गईं / उन्होंने साहस बाँधा
  rationale: यह पद मुख्यतः भीतरी साहस और संकल्प का वर्णन करता है। ‘मन’ ग्रीक ψυχή की भीतरी जीवन-शक्ति को यहाँ सहज रूप से व्यक्त करता है, बिना ‘आत्मा’ को किसी तकनीकी धर्मसैद्धांतिक अर्थ में सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘धन्य कहा’ बाइबिलीय भाव बनाए रखता है; ‘मनों में बल आया’ अत्यधिक शाब्दिक और असहज अभिव्यक्ति से बचते हुए मूल की आंतरिक दृढ़ता सुरक्षित रखता है।
