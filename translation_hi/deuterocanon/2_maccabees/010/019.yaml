lexical_decisions:
- source_word: συντηρήσητε
  choice: बनाए रखें
  rationale: क्रिया में किसी भाव या स्थिति को निरंतर कायम रखने का अर्थ है; बहुवचन संबोधन को आदरसूचक ‘आप’ के साथ व्यक्त किया गया है।
- source_word: εἰς τὰ πράγματα
  choice: इस कार्य के प्रति
  rationale: वाक्य के प्रसंग में πράγματα विषय, मामले या समूचे उपक्रम को व्यापक रूप से सूचित कर सकता है। ‘इस कार्य’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: εὔνοιαν
  choice: सद्भाव
  rationale: εὔνοια अनुकूल मनोभाव, सदिच्छा या भलाई की भावना दर्शाता है। ‘सद्भाव’ आधुनिक, गरिमापूर्ण और संक्षिप्त है।
- source_word: εἰς τὸ λοιπόν
  choice: आगे
  rationale: यह पदबंध आने वाले समय की ओर संकेत करता है। ‘आगे’ सहज हिन्दी में ‘भविष्य में/अब से आगे’ का भाव देता है।
- source_word: πειράσομαι
  choice: प्रयत्न करूँगा
  rationale: भविष्यकालीन मध्यम रूप प्रयास करने के संकल्प को व्यक्त करता है; यह सफलता का दावा नहीं करता।
- source_word: αἰτιαῖος ἀγαθῶν γίνεσθαι
  choice: अच्छे परिणाम लाने का
  rationale: शाब्दिक अर्थ ‘अच्छी बातों का कारण बनना’ है। ‘अच्छे परिणाम लाना’ कारकता और ἀγαθῶν की व्यापक सकारात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
