- source_word: αἰσχρῶς
  choice: लज्जाजनक ढंग से
  rationale: यह क्रिया-विशेषण अपमान या लज्जा का मूल्यांकन व्यक्त करता है; चुना गया रूप उसके नैतिक-वर्णनात्मक बल को बनाए रखता है।
- source_word: φεύγων
