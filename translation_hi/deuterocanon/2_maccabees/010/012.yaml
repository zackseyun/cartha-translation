  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ घटित पलायन को दर्शाता है; हिन्दी में ‘भागकर’ साधन और परिस्थिति दोनों को सहजता से व्यक्त करता है।
- source_word: διεσώθη
  choice: बच निकला
  rationale: यहाँ एकवचन क्रिया लूसियास के पराजय से जीवित निकल जाने को बताती है; ‘बच निकला’ प्रसंगानुकूल है।
