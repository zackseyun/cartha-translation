lexical_decisions:
- source_word: ἔπεισεν … πείσει
  choice: मना लिया … मना लेगा
  rationale: एक ही यूनानी क्रिया के भूतकाल और भविष्यकाल के रूपों के बीच संबंध को हिन्दी में भी बनाए रखा गया है। पहले क्रियारूप का कर्म मूल अंश में व्यक्त नहीं है, इसलिए प्रसंगानुसार ‘उसे’ जोड़ा गया है।
- source_word: συλλύεσθαι
  choice: समझौता करने
  rationale: यह दुर्लभ और पाठगत रूप से कठिन क्रिया यहाँ मेल-मिलाप अथवा विवाद के निपटारे का भाव देती जान पड़ती है। ‘समझौता करने’ से कूटनीतिक संदर्भ स्वाभाविक रहता है और अर्थ को अत्यधिक संकीर्ण नहीं किया जाता।
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: सभी न्यायोचित शर्तों पर
  rationale: δικαίοις को यहाँ संज्ञात्मक रूप में वार्ता की उचित या न्यायसंगत बातों के लिए लिया गया है। हिन्दी में ‘न्यायोचित शर्तों’ से समझौते का प्रसंग स्पष्ट और सहज बनता है।
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: यह भी आश्वासन दिया कि वह राजा को भी मना लेगा
  rationale: διότι कारण अथवा कथन की विषयवस्तु दोनों प्रस्तुत कर सकता है। यहाँ इसे मनाने के लिए दिए गए आश्वासन की विषयवस्तु माना गया है; ‘आश्वासन दिया’ हिन्दी में संबंध स्पष्ट करता है, जबकि वैकल्पिक कारणवाचक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: φίλον αὐτοῖς
  choice: उनका मित्र
  rationale: यह राजनीतिक अनुकूलता या मैत्री का संकेत देता है; ‘उनका मित्र’ मूल की संक्षिप्त अभिव्यक्ति को बनाए रखता है।
- source_word: ἀναγκάζων γενέσθαι
  choice: बाध्य करेगा
  rationale: ἀναγκάζω का बल साधारण आग्रह से अधिक, दबाव या विवशता का है। हिन्दी भविष्यकाल में इसे मुख्य भविष्य क्रिया के साथ स्वाभाविक रूप से जोड़ा गया है।
