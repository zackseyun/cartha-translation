  text: उसने उसे सभी न्यायोचित शर्तों पर समझौता करने के लिए मना लिया[a] और यह भी आश्वासन दिया कि वह राजा को भी मना लेगा और उसे उनका मित्र बनने के लिए बाध्य करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ और पाठगत रूप से कठिन है; आशय संभवतः न्यायोचित शर्तों पर समझौता या मेल-मिलाप करना है।
    reason: textual_variant
  - marker: b
    text: ‘और यह भी आश्वासन दिया कि’ के स्थान पर यूनानी का अर्थ ‘क्योंकि वह राजा को भी मना लेगा’ भी हो सकता है। इस अंश में कर्ता और कुछ सर्वनामों के संदर्भ स्पष्ट रूप से नहीं बताए गए हैं।
