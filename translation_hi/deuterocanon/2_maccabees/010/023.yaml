  text: since our father has departed to the gods[a], and since we desire that those in the kingdom, being free from disturbance, should give attention to the affairs of the Jews,
translation:
  language: hi
  text: हमारे पिता के देवताओं के पास चले जाने के बाद[a], हम चाहते हैं कि राज्य के लोग बिना किसी बाधा के यहूदियों के मामलों पर ध्यान दे सकें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘देवताओं के पास चले गए’ है। यह मृत्यु के लिए प्रयुक्त हेलेनवादी राजदरबारी शिष्टोक्ति है और वक्ता के दरबारी दृष्टिकोण को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τοῦ πατρὸς ἡμῶν … μεταστάντος
  choice: हमारे पिता के … चले जाने के बाद
  rationale: ἐπί के साथ संबंधकारक कृदंत यहाँ समय और परिस्थिति बताता है। ‘के बाद’ हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है; वाक्य के अगले खंड में राजकीय इच्छा इसका प्रसंगगत परिणाम है।
- source_word: εἰς θεοὺς μεταστάντος
  choice: देवताओं के पास चले जाने
  rationale: यूनानी बहुवचन θεούς और मृत्यु के लिए प्रयुक्त हेलेनवादी राजदरबारी शिष्टोक्ति दोनों सुरक्षित रखे गए हैं। इसे केवल ‘मर गए’ कहना मूल की सांस्कृतिक भाषा को समतल कर देता।
- source_word: βουλόμενοι
  choice: हम चाहते हैं
  rationale: राजकीय पत्र की औपचारिक किंतु सुबोध शैली में इच्छा या अभिप्राय को सीधे व्यक्त करता है।
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: राज्य के लोग
  rationale: यह अभिव्यक्ति राज्य के भीतर या उससे संबद्ध प्रजाजनों की ओर संकेत करती है। ‘राज्य के लोग’ आधुनिक हिन्दी में व्यापक और सहज है।
- source_word: ἀπερισπάστως
  choice: बिना किसी बाधा के
  rationale: शब्द का भाव है दूसरी ओर खिंचे बिना, निर्विघ्न या अविचलित होकर। प्रशासनिक प्रसंग में ‘बिना किसी बाधा के’ केवल मानसिक एकाग्रता की अपेक्षा व्यापक अर्थ देता है।
- source_word: ὄντας γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: यहूदियों के मामलों पर ध्यान दे सकें
  rationale: यूनानी रचना संक्षिप्त और कुछ असामान्य है। हिन्दी में उद्देश्य/परिणाम को ‘ध्यान दे सकें’ से स्वाभाविक बनाया गया है, जबकि ἐπιμέλεια के प्रशासनिक ‘ध्यान/देखरेख’ भाव को ‘मामलों पर ध्यान’ में रखा गया है।
theological_decisions:
- issue: εἰς θεοὺς μεταστάντος में मृत्यु के लिए बहुदेववादी राजदरबारी भाषा
  choice: देवताओं के पास चले जाने
  alternative: मर जाने; संसार से चले जाने
  rationale: यह कथन सेल्यूसिड राजदरबार के दृष्टिकोण को उद्धृत करता है, अनुवादक की धर्मवैचारिक स्वीकृति को नहीं। मूल के स्पष्ट बहुवचन और सांस्कृतिक तनाव को तटस्थ मृत्यु-सूचक वाक्यांश से नहीं बदला गया।
