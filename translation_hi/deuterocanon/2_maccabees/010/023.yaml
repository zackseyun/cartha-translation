  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजकीय-पत्र शैली रखी गई है। वाक्य स्रोत की तरह आगे जारी रहने वाला आश्रित खंड है, इसलिए अंत में अल्पविराम रखा गया है।
