- source_word: χρῆσθαι
  choice: उपयोग करें
  rationale: दत्तिव के साथ χρῆσθαι का सीधा अर्थ ‘उपयोग करना’ है। यहाँ यह किसी आदेश या अनुमति की विषय-वस्तु बताने वाला अनंत रूप है।
- source_word: τοῖς ἑαυτῶν δαπανήμασιν
  choice: अपने ही साधनों
  rationale: δαπάνη/δαπάνημα खर्च, व्यय अथवा निर्वाह के लिए उपलब्ध भौतिक साधनों की ओर संकेत कर सकता है। ‘साधनों’ से इस असामान्य पदबंध का व्यापक अर्थ बना रहता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: νόμοις
  choice: नियमों
  rationale: νόμος का मूल अर्थ ‘कानून’ है, पर यहाँ यह यहूदियों की अपनी सामुदायिक-धार्मिक व्यवस्था के लिए बहुवचन में आया है। आधुनिक हिन्दी में ‘अपने नियमों का उपयोग’ ‘अपने कानूनों का उपयोग’ से अधिक स्वाभाविक है, फिर भी इसे केवल ‘रीति-रिवाज’ बनाकर अर्थ सीमित नहीं किया गया।
- source_word: καθὰ καὶ τὸ πρότερον
  choice: पहले की तरह
  rationale: यह पूर्वकालीन प्रथा या व्यवस्था की पुनर्बहाली व्यक्त करने वाला स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: παρενοχληθήσεται
  choice: परेशान नहीं किया जाएगा
  rationale: भविष्यत् कर्मवाच्य सरकारी या सामाजिक दखल अथवा उत्पीड़न न किए जाने की बात कहता है। ‘परेशान’ आधुनिक हिन्दी में व्यापक और स्पष्ट है।
- source_word: περὶ τῶν ἠγνοημένων
  choice: अनजाने में हुई बातों के कारण
  rationale: ἠγνοημένων अज्ञान या अनभिज्ञता से जुड़ी पूर्ववर्ती बातों को अनिश्चित रूप में व्यक्त करता है। हिन्दी में ‘अनजाने में हुई बातों’ से यह अस्पष्ट व्यापकता बनी रहती है; περὶ को प्रसंगानुसार कारण-संबंधी ‘के कारण’ से व्यक्त किया गया है।
