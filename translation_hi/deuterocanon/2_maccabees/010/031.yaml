  text: that the Jews should make use of their own resources and laws as before[a], and that none of them should in any way be harassed concerning the things done in ignorance.
translation:
  language: hi
  text: कि यहूदी पहले की तरह अपने ही साधनों[a] का उपयोग करें और अपने कानूनों का पालन करें; और अनजाने में हुई बातों के विषय में उनमें से किसी को भी किसी प्रकार परेशान नहीं किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने ही खर्चों’ अथवा ‘अपने निर्वाह के साधनों’। यूनानी शब्द खर्च, व्यय या जीवन-निर्वाह के भौतिक साधनों को सूचित कर सकता है।
    reason: lexical_alternative
