  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘अन्ताकिया’ पारम्परिक हिन्दी बाइबलीय स्थान-नाम है। मूल यूनानी में उपस्थित कर्ता-संबंधी अस्पष्टता और ἵνʼ ἔχωμεν की संक्षिप्तता को पाद-टिप्पणियों में दर्ज किया गया है।
