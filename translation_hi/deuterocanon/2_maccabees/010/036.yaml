  yaml_path: translation/deuterocanon/2_maccabees/010/036.yaml
  text: But if there are matters that should be brought before the king[a], send someone at once to look into these things, so that we may act as is fitting for us; for we are going on to Antioch.
translation:
  language: hi
  text: परन्तु जिन बातों को राजा के सामने प्रस्तुत करने का निर्णय किया गया है[a], उनके विषय में जाँच करने के लिए तुरन्त किसी को भेजो, ताकि हम वैसा कार्य कर सकें जैसा हमारे लिए उचित हो[b]; क्योंकि हम अन्ताकिया की ओर बढ़ रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘निर्णय किया’ वाली क्रिया एकवचन है, पर उसका कर्ता स्पष्ट नहीं है। अधिक शाब्दिक रूप है, ‘जिन बातों को उसने राजा के सामने प्रस्तुत किए जाने का निर्णय किया।’
    reason: मूल पाठ की कर्ता-संबंधी अस्पष्टता तथा ‘प्रस्तुत किए जाने’ वाले निष्क्रिय infinitive को सुरक्षित रखना।
  - marker: b
    text: यूनानी अभिव्यक्ति संक्षिप्त है; अधिक शाब्दिक रूप है, ‘ताकि हमारे पास वैसा हो जैसा हमारे लिए उचित है।’ यहाँ आशय उचित कार्यवाही कर पाने से है।
    reason: संक्षिप्त यूनानी मुहावरे और हिन्दी में व्यक्त निहित अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: ἃ δὲ ἔκρινεν
  choice: परन्तु जिन बातों को … प्रस्तुत करने का निर्णय हुआ है
  rationale: ἃ नपुंसकलिंग बहुवचन में चर्चा के विषयों को सूचित करता है। ἔκρινεν का कर्ता यूनानी वाक्य में स्पष्ट नहीं है; हिन्दी में कर्मवाच्य अभिव्यक्ति मूल की इस अस्पष्टता को किसी व्यक्ति का नाम जोड़े बिना सुरक्षित रखती है।
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: राजा के सामने प्रस्तुत करने
  rationale: यह पद किसी विषय को उच्च अधिकारी के विचारार्थ आगे रखने का भाव देता है। ‘प्रस्तुत करने’ में मौखिक सूचना या लिखित निवेदन में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया गया है।
- source_word: πέμψατέ τινα παραχρῆμα
  choice: तुरन्त किसी को भेजो
  rationale: बहुवचन आज्ञार्थक क्रिया और अनिश्चित सर्वनाम के साथ παραχρῆμα की तात्कालिकता को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: उनके विषय में जाँच करने के लिए
  rationale: ἐπισκέπτομαι यहाँ निरीक्षण या जाँच-पड़ताल का भाव रखता है; प्रयोजनवाचक हिन्दी रचना यूनानी कृदन्त का स्वाभाविक रूपान्तरण है।
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: ताकि हम अपने लिए उचित रीति से कार्य कर सकें
  rationale: शाब्दिक ‘ताकि हम रखें/पाएँ, जैसा हमारे लिए उचित है’ हिन्दी में अधूरा होगा। प्रसंगानुसार निहित व्यावहारिक कार्यवाही को व्यक्त किया गया है, और पाद-टिप्पणी में संक्षिप्त मूल रचना बताई गई है।
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: क्योंकि हम अन्ताकिया की ओर बढ़ रहे हैं
  rationale: वर्तमानकालीन προσάγομεν यहाँ गन्तव्य की ओर आगे बढ़ने या यात्रा करने को दर्शाता है। ‘बढ़ रहे हैं’ चल रही अथवा निकटवर्ती यात्रा—दोनों के अनुकूल है।
