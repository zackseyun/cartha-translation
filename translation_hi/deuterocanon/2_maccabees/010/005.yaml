  yaml_path: translation/deuterocanon/2_maccabees/010/005.yaml
  text: But when he entered Judea and came near Bethsura[a], a fortified place about five schoeni from Jerusalem[b], he was pressing it hard.
translation:
  language: hi
  text: पर जब वह यहूदिया में प्रवेश करके बेत-सूर के निकट पहुँचा—जो एक सुदृढ़ स्थान था और यरूशलेम से लगभग पाँच स्कोइनुस दूर था[a]—तो वह उस पर भारी दबाव डालने लगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्कोइनुस प्राचीन काल की दूरी की एक इकाई थी। उसका ठीक आधुनिक मान अलग-अलग संदर्भों में बदलता था, इसलिए यहाँ भ्रामक रूप से सटीक दूरी देने के बजाय यूनानी माप को ही रखा गया है।
    reason: cultural_note
  - marker: b
    text: या, “वह उसे घेरने लगा।” यूनानी में शाब्दिक अर्थ “वह उस पर दबाव डाल रहा था” है, जो किसी सुदृढ़ स्थान पर सैन्य दबाव का वर्णन कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν ... εἰς τὴν Ἰουδαίαν
  choice: जब वह यहूदिया में प्रवेश करके
  rationale: कालवाचक अर्थ में आए एओरिस्ट कृदंत को स्वाभाविक हिन्दी कथन में रखा गया है; ‘यहूदिया’ भौगोलिक नाम को सुरक्षित रखता है।
- source_word: συνεγγίσας Βεθσουρῶν
  choice: बेत-सूर के निकट पहुँचा
  rationale: συνεγγίζω का अर्थ निकट आना या पास पहुँचना है। स्थान-नाम को आधुनिक हिन्दी में स्पष्ट रूप से ‘बेत-सूर’ लिखा गया है।
- source_word: ὄντι μὲν ἐρυμνῷ χωρίῳ
  choice: जो एक सुदृढ़ स्थान था
  rationale: ἐρυμνός यहाँ किसी मजबूत, सुरक्षित या किलेबंद स्थल का बोध कराता है। ‘सुदृढ़ स्थान’ मूल की वर्णनात्मक व्यापकता बनाए रखता है और अनिवार्य रूप से निर्मित किले का अर्थ नहीं थोपता।
- source_word: Ἱεροσολύμων δὲ ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: यरूशलेम से लगभग पाँच स्कोइनुस दूर था
  rationale: ὡσεὶ के लगभग वाले भाव को रखा गया है। σχοῖνος की आधुनिक दूरी संदर्भ के अनुसार बदलती थी, इसलिए भ्रामक सटीक रूपांतरण के बजाय प्राचीन इकाई का लिप्यंतरण किया गया है।
- source_word: τοῦτο ἔθλιβε
  choice: वह उस पर भारी दबाव डालने लगा
  rationale: θλίβω का मूल भाव दबाना या तंग करना है। सैन्य प्रसंग में यह घेराबंदी का संकेत दे सकता है, पर मूल यूनानी किसी विशिष्ट तकनीकी घेराबंदी-शब्द का प्रयोग नहीं करता; इसलिए मुख्य पाठ में उसकी सजीव अस्पष्टता रखी गई है।
