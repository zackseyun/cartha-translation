  rationale: पूरा यूनानी पद समयांतराल की अत्यधिक संक्षिप्तता पर बल देता है। यह अनुवाद उस बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπίτροπος τοῦ βασιλέως
