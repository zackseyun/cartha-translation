  rationale: यह शब्द पारिवारिक संबंध बताता है। हिन्दी में सर्वनाम जोड़ने से स्पष्ट होता है कि वह राजा का संबंधी था।
- source_word: ἐπὶ τῶν πραγμάτων
  choice: राजकाज का प्रभारी
  rationale: यूनानी का शाब्दिक अर्थ ‘कार्यों/मामलों के ऊपर’ है और सम्भवतः प्रशासनिक दायित्व सूचित करता है। ‘राजकाज का प्रभारी’ अर्थ स्पष्ट करता है, पर किसी अनिश्चित औपचारिक पदवी को आरोपित नहीं करता।
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: जो कुछ हुआ था उसे बहुत बुरा मानकर
  rationale: φέρειν βαρέως का मुहावरा घटित बात को बहुत बुरा मानने, उससे व्यथित होने या रोष अनुभव करने का भाव रखता है। चुना हुआ रूप इस भावात्मक व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
