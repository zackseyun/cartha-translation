    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: कुशल से रहो
  rationale: यह ῥώννυμι का बहुवचन आज्ञार्थक रूप है, जो पत्र के समापन में कुशलता और स्वास्थ्य की कामना के रूप में प्रयुक्त होता है। ‘कुशल से रहो’ हिन्दी में स्वाभाविक रहते हुए मूल स्वास्थ्य-संबंधी रूपक को भी बनाए रखता है।
- source_word: εἴη ἂν
  choice: हो
  rationale: संभावनार्थक ἄν के साथ optative इच्छा या अभिलाषा व्यक्त करता है। हिन्दी में ‘हो’ इस कामनात्मक भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὡς βούλομεθα
  choice: जैसा हम चाहते हैं
  rationale: βούλομαι इच्छा या अभिलाषा को सूचित करता है। यह अनुवाद कथन की अस्पष्टता बनाए रखता है कि वक्ता वास्तव में किस परिणाम की इच्छा रखते हैं।
- source_word: ὑγιαίνομεν
  choice: कुशल हैं
  rationale: क्रिया का शाब्दिक अर्थ स्वस्थ या ठीक होना है। ‘कुशल हैं’ पत्राचार की हिन्दी शैली में शारीरिक कुशलता और सामान्य भलाई दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ αὐτοὶ δὲ
  choice: और हम स्वयं भी
  rationale: αὐτοὶ के हल्के बलाघात और καὶ/δὲ के संयोजक तथा पारस्परिक भाव को ‘और हम स्वयं भी’ सुरक्षित रखता है।
