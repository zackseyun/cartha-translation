translation:
  language: hi
  text: पर इन बातों के बारे में विस्तार से[a], मैंने इन लोगों और मेरी ओर से आए लोगों[b]—दोनों को—तुमसे बातचीत करने का निर्देश दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘एक-एक बात के विषय में’ अथवा ‘अलग-अलग करके’; यूनानी: κατὰ μέρος।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘मेरी ओर से’ या ‘मेरे पास से आए लोग’; प्रसंग में आशय लेखक की ओर से आने वाले दूतों या प्रतिनिधियों से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: पर इन बातों के बारे में
  rationale: यहाँ ὑπέρ विषय का परिचय देता है; ‘के बारे में’ आधुनिक हिन्दी में स्वाभाविक है, और δέ का हल्का विरोध/संक्रमण ‘पर’ से व्यक्त होता है।
- source_word: κατὰ μέρος
  choice: विस्तार से
  rationale: इस मुहावरे का आशय बातों को अलग-अलग या एक-एक करके अधिक स्पष्ट रूप से बताना है; ‘विस्तार से’ सहज हिन्दी है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἐντέταλμαι
  choice: मैंने … निर्देश दिया है
  rationale: पूर्णकालिक रूप पहले दिए गए निर्देश की वर्तमान प्रासंगिकता दिखाता है। ‘निर्देश दिया है’ राजनयिक लहजे को बनाए रखता है और ‘आज्ञा दी है’ की अपेक्षा कम कठोर है।
- source_word: τούτους τε καὶ τοὺς παρʼ ἐμοῦ
  choice: इन लोगों और मेरी ओर से आए लोगों—दोनों को
  rationale: τε καί की संयुक्त संरचना को ‘दोनों’ से स्पष्ट किया गया है। παρʼ ἐμοῦ का शाब्दिक अर्थ ‘मेरी ओर से/मेरे पास से’ है; प्रसंग में ये लेखक की ओर से आए व्यक्ति प्रतीत होते हैं, पर प्रतिनिधि होने का निष्कर्ष मुख्य पाठ में अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: διαλεχθῆναι ὑμῖν
  choice: तुमसे बातचीत करने
  rationale: διαλέγομαι यहाँ संवाद या विचार-विमर्श का बोध देता है। ‘बातचीत करने’ में पारस्परिकता बनी रहती है और केवल एकतरफा संबोधन का अर्थ नहीं आता।
