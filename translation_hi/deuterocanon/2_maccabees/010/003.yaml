  text: and to make the sanctuary taxable[a], like the other shrines of the nations, and to make the high priesthood sold each year[c][b];
translation:
  language: hi
  text: और पवित्रस्थान को अन्यजातियों के अन्य पूजा-स्थलों के समान करयोग्य बनाने[a], और महायाजक-पद को हर वर्ष बिक्री के लिए रखने[b];[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कर वसूले जाने के अधीन बनाने।’ यूनानी शब्द का भाव धन या कर लगाए जाने के अधीन होना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘महायाजक-पद को हर वर्ष विक्रेय बनाने।’
    reason: lexical_alternative
  - marker: c
    text: यहाँ उपलब्ध यूनानी वाक्यांश व्याकरण की दृष्टि से अत्यंत संक्षिप्त है और किसी बड़े वाक्य का आश्रित अंश है; अनुवाद में यह संक्षिप्तता बनाए रखी गई है।
    reason: textual_variant
lexical_decisions:
- source_word: ἱερὸν
  choice: पवित्रस्थान
  rationale: यहाँ यह यरूशलेम के पवित्र मंदिर-परिसर को सूचित करता है। ‘पवित्रस्थान’ उसके पवित्र स्वरूप को बनाए रखता है और केवल मुख्य भवन तक अर्थ को सीमित नहीं करता।
- source_word: ἀργυρολόγητον
  choice: कर के अधीन
  rationale: विशेषण का भाव धन या कर वसूले जाने योग्य अथवा कर लगाए जाने के अधीन होना है। यह हिंदी में स्वाभाविक है और यूनानी की आर्थिक नीति को स्पष्ट रखता है।
- source_word: τεμένη
  choice: पूजा-स्थलों
  rationale: यह शब्द देवताओं को समर्पित पवित्र परिसरों या मंदिर-स्थलों के लिए है। ‘पूजा-स्थल’ ἱερόν के लिए चुने गए ‘पवित्रस्थान’ से यूनानी का शब्दगत भेद बनाए रखता है।
- source_word: ἐθνῶν
  choice: अन्यजातियों के
  rationale: संदर्भ में यह यहूदी लोगों से बाहर की जातियों को सूचित करता है। ‘अन्यजातियों’ आधुनिक बाइबलीय हिंदी में इस संबंध को संक्षेप में व्यक्त करता है, बिना ‘मूर्तिपूजक’ जैसा अतिरिक्त मूल्यांकन जोड़े।
- source_word: πρατὴν
  choice: बिक्री के लिए रखने
  rationale: यह विशेषण बेचे जाने या बिक्री के लिए उपलब्ध किए जाने का भाव देता है। पद के वार्षिक व्यावसायीकरण को हिंदी में स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἀρχιερωσύνην
  choice: महायाजक का पद
  rationale: यह महायाजक के पद या गरिमा को दर्शाता है। ‘महायाजक का पद’ साधारण पाठक के लिए ‘महायाजकत्व’ से अधिक सहज है।
- source_word: ποιήσειν
  choice: प्रबंध करे
  rationale: यूनानी infinitive इस अंश में नीति या प्रस्ताव की सामग्री बताता है। उपलब्ध वाक्यांश की संकुचित रचना को हिंदी में समझने योग्य बनाने के लिए साझा क्रियात्मक भाव ‘प्रबंध करे’ से व्यक्त किया गया है।
theological_decisions:
- issue: यरूशलेम के पवित्र स्थल और अन्यजातियों के धार्मिक स्थलों की शब्दावली
  choice: ἱερόν को ‘पवित्रस्थान’ और τεμένη को ‘पूजा-स्थल’ कहना
  alternative: दोनों को ‘मंदिर’ अथवा दोनों को ‘पवित्रस्थान’ कहना
  rationale: यूनानी दोनों के लिए अलग शब्दों का प्रयोग करता है। हिंदी में यह भेद बनाए रखने से पाठ में वर्णित अपमानजनक समानता स्पष्ट होती है, पर ऐसा कोई धार्मिक निर्णय नहीं थोपा जाता जो मूल में नहीं है।
- issue: महायाजक के पद का वार्षिक विक्रय
  choice: ‘हर वर्ष बिक्री के लिए रखने’
  alternative: ‘हर वर्ष बेचने’
  rationale: πρατήν पद को बिक्री हेतु उपलब्ध या विक्रेय बनाए जाने पर बल देता है। चुना हुआ रूप यह अर्थ सुरक्षित रखता है और यह अनावश्यक रूप से तय नहीं करता कि हर वर्ष वास्तविक बिक्री अवश्य पूरी हुई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य मूलतः किसी बड़े वाक्य का आश्रित अंश प्रतीत होता है; इसलिए अंत में अर्धविराम रखा गया है। ‘कर के अधीन’ प्रशासनिक अर्थ को स्पष्ट करता है, जबकि ‘बिक्री के लिए’ महायाजक के पद के व्यावसायीकरण की तीक्ष्णता बनाए रखता है।
