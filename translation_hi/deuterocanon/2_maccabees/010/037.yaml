- source_word: ὁποῖοί ἐστε γνώμης
  choice: आपका रुख क्या है
  rationale: यह यूनानी मुहावरा उनके मनोभाव, मत, निश्चय या उद्देश्य के विषय में पूछता है। ‘रुख’ व्यावहारिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है और केवल ‘इरादा’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
