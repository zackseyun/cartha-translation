lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: और उस राष्ट्र के नाम
  rationale: πρός संबोधन की दिशा बताता है, जिसे हिन्दी पत्र-शैली में ‘के नाम’ स्वाभाविक रूप से व्यक्त करता है। ἔθνος के सामूहिक और राजनीतिक भाव को बनाए रखने के लिए ‘राष्ट्र’ चुना गया है।
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: राजा का पत्र इस प्रकार था
  rationale: यह मूल यूनानी की औपचारिक उद्धरण-भूमिका को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Βασιλεὺς Ἀντίοχος
  choice: राजा अन्तियोकुस
  rationale: राजकीय उपाधि की प्रमुखता और यूनानी नाम के प्रचलित हिन्दी रूप—दोनों को सुरक्षित रखता है।
- source_word: γερουσίᾳ τῶν Ἰουδαίων
  choice: यहूदियों के बुज़ुर्गों की परिषद
  rationale: γερουσία किसी एक बुज़ुर्ग नहीं, बल्कि बुज़ुर्गों की आधिकारिक संस्था को दर्शाता है; ‘परिषद’ उस संस्थागत भाव को स्पष्ट करता है।
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: अन्य यहूदियों
  rationale: ἄλλοις परिषद से अलग व्यापक यहूदी समुदाय को सूचित करता है। ‘अन्य’ मूल की भिन्नता को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्रारंभ में χαίρειν पारंपरिक अभिवादन है; शाब्दिक ‘आनन्दित रहो’ के बजाय ‘नमस्कार’ हिन्दी पत्र-शैली में उसके कार्य को स्वाभाविक रूप से व्यक्त करता है।
