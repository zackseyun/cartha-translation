  text: 'और उस राष्ट्र के नाम राजा का पत्र इस प्रकार था: “राजा अन्तियोकुस की ओर से यहूदियों के बुज़ुर्गों की परिषद[a] और अन्य यहूदियों[b] को नमस्कार।”[c]'
