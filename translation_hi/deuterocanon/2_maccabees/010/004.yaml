    text: या, “परमेश्वर के सामर्थ्य को तनिक भी हिसाब में नहीं ले रहा था।”
    reason: ἐπιλογιζόμενος में सोचने के साथ किसी शक्ति को अपनी गणना में शामिल करने का भाव भी हो सकता है।
