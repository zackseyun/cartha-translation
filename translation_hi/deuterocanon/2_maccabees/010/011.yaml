  text: But springing at the enemies like lions[a], they laid low eleven thousand of them, and one thousand six hundred cavalry; and they forced them all to flee.
translation:
  language: hi
  text: परन्तु वे सिंहों के समान शत्रुओं पर झपट पड़े और उनमें से ग्यारह हज़ार को और एक हज़ार छह सौ घुड़सवारों[a] को धराशायी कर दिया; और उन सबको भागने पर मजबूर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “दस हज़ार के अतिरिक्त एक हज़ार ... एक हज़ार के अतिरिक्त छह सौ।”
    reason: संख्याओं की मूल योगात्मक अभिव्यक्ति को दर्शाने के लिए।
lexical_decisions:
- source_word: λεόντινων
  choice: सिंहों के समान
  rationale: यह दुर्लभ रूप सिंह-जैसी उग्रता और आक्रमण की उपमा व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐντινάξαντες
  choice: झपट पड़े
  rationale: कृदन्त शत्रुओं की ओर अचानक और प्रचण्ड गति सूचित करता है; ‘झपट पड़े’ सिंह की उपमा के साथ जीवंत रूप से मेल खाता है।
- source_word: κατέστρωσαν
  choice: धराशायी कर दिया
  rationale: युद्ध-संदर्भ में यह शत्रुओं को गिरा देने या मार डालने का बोध देता है। ‘धराशायी’ मूल की शक्ति बनाए रखते हुए मृत्यु को उससे अधिक स्पष्ट नहीं करता जितना यूनानी पाठ करता है।
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: ग्यारह हज़ार
  rationale: यूनानी वाक्यांश का शाब्दिक अर्थ ‘दस हज़ार के अतिरिक्त एक हज़ार’ है; कुल संख्या देना हिन्दी में स्पष्ट और निष्ठापूर्ण है।
- source_word: ἱππεῖς
  choice: घुड़सवारों
  rationale: यह शब्द युद्धरत अश्वारोही सैनिकों को दर्शाता है; ‘घुड़सवार’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: ἑξακοσίους πρὸς χιλίοις
  choice: एक हज़ार छह सौ
  rationale: यूनानी में संख्या ‘एक हज़ार के अतिरिक्त छह सौ’ के रूप में है; हिन्दी में उसका कुल योग स्वाभाविक ढंग से दिया गया है।
- source_word: ἠνάγκασαν φεύγειν
  choice: भागने पर मजबूर कर दिया
  rationale: यह रचना शत्रुओं को भागने के लिए विवश करने का कारणवाचक भाव रखती है; चुना हुआ अनुवाद सीधा और वर्तमान हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: धराशायी किए गए लोगों और ‘उन सब’ के भागने के बीच कथात्मक तनाव
  choice: ‘उन सबको’ को यथावत रखा गया
  alternative: ‘बाकी सबको’
  rationale: यूनानी पाठ τοὺς δὲ πάντας में ‘बाकी’ नहीं कहता। उसे जोड़ने से संभावित असंगति सुलझ जाती, पर वह मूल पाठ की वास्तविक अभिव्यक्ति से आगे जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण युद्ध-वर्णन; भाषा सामान्य पाठकों के लिए सुबोध रखी गई है। ‘परन्तु’ से δέ का विरोधसूचक प्रवाह, और ‘झपट पड़े’ से आक्रमण की सजीवता व्यक्त की गई है।
