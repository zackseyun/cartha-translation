  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
translation:
  language: hi
  text: कुशल रहें।[a] एक सौ अड़तालीसवें वर्ष में, ज़ैन्थिकुस[b] महीने के पंद्रहवें दिन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘स्वस्थ रहें’ या ‘कुशल रहें’ है; यहाँ यह पत्र के अंत में कही जाने वाली परंपरागत शुभकामना है।
    reason: lexical_alternative
  - marker: b
    text: ज़ैन्थिकुस मकदूनियाई पंचांग के एक महीने का नाम था, जिसका प्रयोग यूनानी प्रभाव वाले काल की तिथियों में होता था।
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  choice: कुशल रहें
  rationale: यह बहुवचन आज्ञार्थक रूप शाब्दिक रूप से स्वस्थ या कुशल रहने को कहता है, पर यहाँ पत्र के समापन की परंपरागत शुभकामना है। ‘कुशल रहें’ हिन्दी में स्वाभाविक है और मूल अभिव्यक्ति से भी निकट रहता है।
- source_word: ἔτους
  choice: वर्ष में
  rationale: यह तिथि बताने वाले संबंधकारक पदबंध का अंग है; हिन्दी में इसे ‘वर्ष में’ से स्वाभाविक रूप दिया गया है।
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: एक सौ अड़तालीसवें
  rationale: यह ‘वर्ष’ को विशेषित करने वाली क्रमवाचक संख्या है।
- source_word: Ξανθικοῦ
  choice: ज़ैन्थिकुस
  rationale: यह मकदूनियाई पंचांग के एक महीने का नाम है, इसलिए अनुवाद करने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: πεντεκαιδεκάτῃ
  choice: पंद्रहवें दिन
  rationale: तिथि-सूत्र में प्रयुक्त इस रूप को हिन्दी में स्पष्ट और स्वाभाविक ढंग से ‘पंद्रहवें दिन’ कहा गया है।
