  yaml_path: translation/deuterocanon/2_maccabees/010/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews[b], greetings.”'
translation:
  language: hi
  text: 'रोमियों ने भी उनके पास एक पत्र भेजा, जिसमें यह लिखा था: “रोमियों के पुरनिए[a] क्विंतुस मेम्मियुस और तीतुस मानियुस की ओर से यहूदी लोगों[b] को नमस्कार।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी शब्द का सामान्य अर्थ “पुरनिए” है; प्रसंग में इससे अधिक विशेष रूप से रोमी दूत या सभासद भी अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यहूदियों के जनसमुदाय।”
    reason: lexical_alternative
