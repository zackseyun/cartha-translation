  rationale: व्यक्तिनामों का यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण; हिन्दी पठनीयता के लिए दोनों नामों के बीच ‘और’ जोड़ा गया है।
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: रोमियों के पुरनिए
  rationale: πρεσβυταί का मूल व्यापक अर्थ ‘पुरनिए/वरिष्ठ जन’ है। इससे ‘दूत’ या ‘सभासद’ जैसी अधिक विशिष्ट संस्थागत व्याख्या पाठ में नहीं थोपी जाती।
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: यहूदी लोगों को
  rationale: δῆμος यहाँ सार्वजनिक या सामुदायिक जनसमूह को सूचित करता है। यह हिन्दी यूनानी वाक्यांश का अर्थ स्वाभाविक ढंग से व्यक्त करती है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्र के आरम्भ में χαίρειν अभिवादन का प्रचलित सूत्र है; यहाँ शाब्दिक ‘आनन्दित रहो’ की अपेक्षा ‘नमस्कार’ प्रसंगानुकूल है।
