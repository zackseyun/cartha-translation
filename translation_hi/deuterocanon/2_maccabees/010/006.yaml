base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/006.yaml
  text: But when those around Makkabaios[a], while besieging it, gained possession of the strongholds, with lamentations and tears they, together with the crowds[b], pleaded with the Lord to send a good angel for the salvation of Israel.
translation:
  language: hi
  text: जब मक्‍कबाई उस स्थान[a] को घेर रहा था और उसके साथियों ने गढ़ों पर अधिकार कर लिया, तब उन्होंने जनसमूह के साथ मिलकर विलाप और आँसुओं के बीच प्रभु से विनती की कि वह इस्राएल के उद्धार के लिए एक भला दूत[b] भेजे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी सर्वनाम का पूर्वपद इस वाक्य में स्पष्ट नहीं है; प्रसंग के अनुसार यहाँ घेरा जा रहा किलेबंद स्थान अभिप्रेत है। शाब्दिक रूप से इसे ‘उसे’ भी पढ़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “एक कल्याणकारी दूत।” यूनानी में शाब्दिक रूप से “एक भला दूत” है; यह दूत के चरित्र या उसकी कल्याणकारी भूमिका को बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: मक्‍कबाई के साथी
  rationale: यह यूनानी मुहावरा मक्‍कबाई के आसपास रहने वाले उसके दल या साथियों को दर्शाता है। ‘साथी’ आधुनिक हिन्दी में स्वाभाविक है और उनके पद या संख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μετέλαβον
  choice: अधिकार कर लिया
  rationale: सैन्य प्रसंग में क्रिया का अर्थ किसी स्थान को अपने अधिकार में लेना है। यह अनुवाद ‘कब्ज़ा’ की अपेक्षा अधिक गरिमापूर्ण और τὰ ὀχυρώματα के साथ स्वाभाविक है।
- source_word: τὰ ὀχυρώματα
  choice: गढ़ों
  rationale: यह शब्द किलेबंद स्थानों या मजबूत रक्षात्मक ठिकानों को सूचित करता है। ‘गढ़’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: πολιορκοῦντα αὐτόν
  choice: उस स्थान को घेर रहा था
  rationale: एकवचन कृदंत मक्‍कबाई से संबद्ध समझा गया है। αὐτόν का पूर्वपद इस उद्धृत वाक्य में स्पष्ट नहीं है; प्रसंग के अनुसार उसे घेरा जा रहा किलेबंद स्थान माना गया है, पर इसकी संक्षिप्त वाक्यरचना को पादटिप्पणी में खुला रखा गया है।
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: विलाप और आँसुओं के बीच
  rationale: यह अभिव्यक्ति शोकपूर्ण पुकार और रोने की भावनात्मक तीव्रता को सहज, गरिमापूर्ण हिन्दी में बनाए रखती है।
- source_word: ἱκέτευον
  choice: विनती की
  rationale: क्रिया साधारण माँगने से अधिक गहन प्रार्थना या अनुनय व्यक्त करती है। ‘विनती की’ धार्मिक प्रसंग में स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यहूदी धर्मग्रंथ के इस प्रसंग में κύριος परमेश्वर के लिए प्रयुक्त आदरसूचक संबोधन है; ‘प्रभु’ प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἀγαθὸν ἄγγελον
  choice: एक भला दूत
  rationale: ‘भला’ ἀγαθός के मूल अर्थ को रखता है और ‘दूत’ ἄγγελος का सीधा रूप है। इससे दूत की पहचान या उसके स्वरूप को पाठ से अधिक निश्चित नहीं किया जाता।
- source_word: ἀποστεῖλαι πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: इस्राएल के उद्धार के लिए ... भेजे
  rationale: σωτηρία यहाँ बचाव या छुटकारे का भाव रखता है। ‘उद्धार’ मूल की धार्मिक और संकट-मुक्ति दोनों अर्थछायाओं को सुरक्षित रखता है।
theological_decisions:
- issue: ‘भला दूत’ की पहचान और भूमिका
  choice: वाक्यांश को ‘एक भला दूत’ रखा गया है और दूत की कोई विशिष्ट पहचान नहीं दी गई।
  alternative: एक कल्याणकारी दूत; एक सहायक स्वर्गदूत
  rationale: यूनानी पाठ केवल दूत को ἀγαθός कहता है और यह बताता है कि उसे इस्राएल के उद्धार के लिए भेजा जाए। किसी नाम, स्वर्गदूतीय श्रेणी या विशेष धर्मसैद्धांतिक भूमिका को जोड़ना पाठ से आगे जाना होगा।
- issue: σωτηρία का अर्थ
  choice: उद्धार
  alternative: छुटकारा; रक्षा
  rationale: सैन्य संकट में इसका तात्कालिक अर्थ बचाव या छुटकारा हो सकता है, जबकि ‘उद्धार’ यूनानी शब्द की व्यापक धर्मशास्त्रीय अर्थछाया को भी बनाए रखता है; अनुवाद किसी एक आयाम को अलग से निर्णायक नहीं बनाता।
translation_notes:
  register: अनुवाद आधुनिक मानक हिन्दी में है, जिसमें ‘प्रभु’, ‘विलाप’, ‘विनती’ और ‘उद्धार’ जैसे परिचित धर्मग्रंथीय शब्द गरिमा बनाए रखते हैं। वाक्य को हिन्दी में स्पष्ट बनाने के लिए मुख्य क्रियाओं का क्रम स्वाभाविक किया गया है, जबकि यूनानी की अस्पष्ट सर्वनाम-संबंधी वाक्यरचना को पादटिप्पणी में सुरक्षित रखा गया है।
