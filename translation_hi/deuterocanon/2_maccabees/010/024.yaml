  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। पद स्वयं एक आश्रित वाक्यांश है, इसलिए स्रोत की निरंतर वाक्य-संरचना बनाए रखने हेतु अंत में अल्पविराम रखा गया है।
