  text: having heard that the Jews did not approve of their father's change to Greek ways[a], but were choosing their own way of life and requesting that their own laws be permitted to them[b],
translation:
  language: hi
  text: यह सुनकर कि यहूदी उनके पिता के यूनानी रीति-रिवाजों की ओर मुड़ने से सहमत नहीं थे,[a] बल्कि अपनी ही जीवन-पद्धति को चुनते थे और निवेदन करते थे कि उन्हें अपने विधि-विधानों का पालन करने की अनुमति दी जाए,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके पिता के यूनानी बातों की ओर परिवर्तन से।” यह संक्षिप्त यूनानी पदबंध यूनानी सांस्कृतिक रीति-रिवाजों की ओर मुड़ने का संकेत करता है; “पिता” का सटीक संकेत स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें अपनी पैतृक प्रथाओं का पालन करने की अनुमति दी जाए।” यूनानी पद में विधि से स्थापित नियम और प्रथाएँ, दोनों सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: यह सुनकर
  rationale: पूर्णकालिक कृदंत पूर्ववर्ती सूचना-प्राप्ति को परिस्थितिजन्य रूप से जोड़ता है; हिन्दी में ‘यह सुनकर’ स्वाभाविक है और कालगत संबंध को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: μὴ συνεὐδοκοῦντας
  choice: सहमत नहीं थे
  rationale: συνευδοκέω सहमति या अनुमोदन व्यक्त करता है। यहाँ सांस्कृतिक परिवर्तन के प्रति असहमति संदर्भानुकूल और सहज है।
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: उनके पिता द्वारा यूनानी रीति-रिवाज अपनाए जाने
  rationale: μετάθεσις परिवर्तन या स्थानांतरण और εἰς τὰ Ἑλληνικά यूनानी सांस्कृतिक व्यवहार की ओर मुड़ने को सूचित करता है। ‘अपनाए जाने’ हिन्दी में इस संक्षिप्त यूनानी पदबंध का स्वाभाविक रूप है; ‘पिता’ को एकवचन ही रखा गया है।
- source_word: τὴν ἑαυτῶν ἀγωγὴν αἱρετίζοντας
  choice: अपनी ही जीवन-पद्धति को चुनते थे
  rationale: ἀγωγή आचरण या जीवन-पद्धति और αἱρετίζω चुनने या प्राथमिकता देने को दर्शाता है। ‘ही’ विरोधात्मक बल को स्पष्ट करता है।
- source_word: ἀξιοῦν
  choice: माँग करते थे
  rationale: ἀξιόω यहाँ अनुरोध या माँग करने के अर्थ में है। ‘माँग करते थे’ याचिका के औपचारिक किंतु दृढ़ स्वर को बनाए रखता है।
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: उन्हें अपने विधि-विधान मानने की अनुमति दी जाए
  rationale: συγχωρηθῆναι अनुमति दिए जाने और τὰ νόμιμα विधि से स्थापित नियमों तथा प्रथाओं दोनों को समेटता है। ‘विधि-विधान’ कानूनी और प्रथागत दोनों आयामों को खुला रखता है।
theological_decisions:
- issue: सांस्कृतिक रूप से भारित εἰς τὰ Ἑλληνικά का अनुवाद
  choice: यूनानी रीति-रिवाज अपनाए जाने
  alternative: यूनानी जीवन-पद्धति की ओर परिवर्तन / यूनानीकरण
  rationale: संदर्भ केवल यूनानी भाषा नहीं, बल्कि यूनानी सांस्कृतिक-धार्मिक व्यवहार अपनाने का है। मुख्य पाठ में तकनीकी ‘यूनानीकरण’ के बजाय सामान्य पाठक के लिए स्पष्ट पदबंध चुना गया है।
- issue: यहूदी संदर्भ में τὰ νόμιμα का अनुवाद
  choice: अपने विधि-विधान
  alternative: अपने नियम / अपनी पैतृक प्रथाएँ
  rationale: यह पद लिखित नियमों और मान्य पारंपरिक आचरण दोनों को सूचित कर सकता है। ‘विधि-विधान’ इस विस्तार को बनाए रखता है और केवल संहिताबद्ध कानून तक सीमित नहीं करता।
- issue: τοῦ πατρός की संक्षिप्त और संदिग्ध अभिव्यक्ति
  choice: उनके पिता द्वारा
  alternative: पिता द्वारा / उनके पूर्वज द्वारा
  rationale: यूनानी में ‘पिता’ एकवचन है। उसका सटीक ऐतिहासिक संकेत इस अंश में पूरी तरह स्पष्ट नहीं, इसलिए मुख्य पाठ मूल संरचना को बनाए रखता है और पादटिप्पणी में अस्पष्टता बताता है।
