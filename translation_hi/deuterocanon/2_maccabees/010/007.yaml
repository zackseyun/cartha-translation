  text: परन्तु स्वयं मक्काबी ने सबसे पहले हथियार उठाए और दूसरों को प्रोत्साहित किया कि वे उसके साथ जोखिम उठाते हुए अपने भाइयों[a] की सहायता के लिए आएँ; और वे एक साथ उत्साह से निकल पड़े।
