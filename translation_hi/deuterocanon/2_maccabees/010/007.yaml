  rationale: संयुक्त क्रिया जरूरत के समय किसी की सहायता को पहुँचने का भाव व्यक्त करती है, जिसे केवल 'सहायता करें' की अपेक्षा यह रूप बेहतर दर्शाता है।
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: अपने भाइयों
