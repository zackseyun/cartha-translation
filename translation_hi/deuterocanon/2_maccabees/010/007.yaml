  rationale: मूल यूनानी में पुल्लिंग बहुवचन 'भाइयों' है, पर इस सैनिक-राष्ट्रीय प्रसंग में यह वास्तविक सहोदरों से अधिक व्यापक समुदाय को सूचित कर सकता है। मुख्य पाठ स्रोत का पारिवारिक रूपक बनाए रखता है और पादटिप्पणी अर्थ-सीमा स्पष्ट करती है।
