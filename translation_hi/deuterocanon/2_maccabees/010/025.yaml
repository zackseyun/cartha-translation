  yaml_path: translation/deuterocanon/2_maccabees/010/025.yaml
  text: Therefore[a], since we choose that this nation also should be free from disturbance, we judge that the sanctuary should be restored to them[c][b], and that they should live according to the customs of their ancestors.
translation:
  language: hi
  text: अतः, चूँकि हम यह चाहते हैं कि ये लोग भी उपद्रव से मुक्त रहें, हम निर्णय करते हैं[a] कि पवित्रस्थान[c] उन्हें बहाल किया जाए और वे अपने पूर्वजों के समय के रीति-रिवाजों के अनुसार अपना सामुदायिक जीवन बिताएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हम निर्णय करते हैं’ का अनुवाद ‘हम आदेश देते हैं’ भी हो सकता है; यूनानी κρίνομεν यहाँ औपचारिक प्रशासनिक निर्धारण की भाषा है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपना सामुदायिक जीवन बिताएँ’ के लिए प्रयुक्त यूनानी क्रिया πολιτεύεσθαι का अर्थ सामान्य रूप से ‘जीवन बिताएँ’ भी हो सकता है, पर उसमें नागरिक अथवा सामुदायिक व्यवस्था का भाव भी निहित है।
    reason: lexical_alternative
  - marker: c
    text: ‘पवित्रस्थान’ का अनुवाद ‘मंदिर’ भी किया जा सकता है, क्योंकि यूनानी τὸ ἱερὸν पवित्र मंदिर-परिसर को सूचित कर सकता है।
    reason: lexical_alternative
