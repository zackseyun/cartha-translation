- source_word: αἱρούμενοι
  choice: चूँकि हमने यह निश्चय किया है
  rationale: यह कृदन्त आगे दिए गए राजकीय निर्णय का आधार बताता है। ‘निश्चय किया है’ विचारपूर्वक चुनने या तय करने के भाव को स्वाभाविक प्रशासनिक हिन्दी में व्यक्त करता है।
- source_word: ἔθνος
  choice: जाति
  rationale: यहाँ शब्द यहूदी लोगों को एक विशिष्ट सामूहिक और राजनीतिक समुदाय के रूप में दर्शाता है। ‘जाति’ इस ऐतिहासिक अर्थ को रखता है, यद्यपि आधुनिक हिन्दी में इसे सामाजिक वर्ण-जाति के अर्थ में भी समझा जा सकता है।
- source_word: ἐκτὸς ταραχῆς εἶναι
  choice: उपद्रव से मुक्त रहे
  rationale: वाक्यांश सार्वजनिक अशांति, हलचल या अव्यवस्था से बचे रहने की स्थिति बताता है। ‘उपद्रव से मुक्त’ राजकीय प्रसंग के अनुकूल और सुबोध है।
- source_word: κρίνομεν
  choice: हम निर्णय करते हैं
  rationale: यह औपचारिक प्रशासनिक निर्धारण को व्यक्त करता है। ‘निर्णय करते हैं’ यूनानी के निकट रहते हुए हिन्दी में राजकीय आदेश की शैली बनाए रखता है।
- source_word: τὸ ἱερὸν
  choice: पवित्रस्थान
  rationale: ἱερόν पवित्र मंदिर या पूरे मंदिर-परिसर का संकेत दे सकता है। ‘पवित्रस्थान’ इस धार्मिक अर्थ को बनाए रखता है और किसी एक वास्तु-सीमा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀποκατασταθῆναι αὐτοῖς
  choice: उन्हें पुनः सौंप दिया जाए
  rationale: यह पद किसी पूर्व स्थिति या अधिकार की बहाली बताता है। प्रसंग में ‘पुनः सौंप दिया जाए’ केवल भवन की मरम्मत के बजाय पवित्रस्थान को उस समुदाय के अधिकार और उपयोग में लौटाने का भाव स्पष्ट करता है।
- source_word: πολιτεύεσθαι
  choice: अपना सामुदायिक जीवन चलाएँ
  rationale: क्रिया केवल निजी आचरण नहीं, बल्कि नागरिक या सामुदायिक जीवन की व्यवस्था का भी संकेत देती है। यह अनुवाद उस व्यापक अर्थ को स्वाभाविक हिन्दी में सामने रखता है।
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: अपने पूर्वजों के समय से चले आ रहे रीति-रिवाजों के अनुसार
  rationale: यह पद पूर्वजों के समय में प्रचलित परंपरागत रीति-रिवाजों की ओर संकेत करता है। चयनित रूप परंपरा की निरंतरता को स्पष्ट करता है।
