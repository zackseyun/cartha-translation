translation:
  language: hi
  text: तो फिर[a] जो कुछ राजा के सामने प्रस्तुत किया जाना आवश्यक था, उसे मैंने स्पष्ट कर दिया है; और जो कुछ संभव था, उसकी उसने अनुमति दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का यूनानी पाठ प्रथम पुरुष में किसी संपादकीय अथवा पत्रात्मक निष्कर्ष जैसा है—‘मैंने स्पष्ट कर दिया है’—जो इस प्रसंग में कुछ अचानक प्रतीत होता है। अनुवाद स्वेटे में प्राप्त पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: ὅσα μὲν οὖν
  choice: इसलिए जो कुछ
  rationale: οὖν निष्कर्ष अथवा पिछले कथन से आगे बढ़ने का संकेत देता है, जबकि μὲν आगामी δὲ के साथ दो पक्षों का संतुलन बनाता है। हिंदी में ‘इसलिए ... और ...’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔδει
  choice: आवश्यक था
  rationale: δεῖ का अपूर्ण भूतकाल अतीत की आवश्यकता को व्यक्त करता है; ‘आवश्यक था’ औपचारिक संदर्भ के अनुकूल और स्पष्ट है।
- source_word: τῷ βασιλεῖ προσενεχθῆναι
  choice: राजा के सामने प्रस्तुत करना
  rationale: प्रशासनिक संदर्भ में προσφέρω किसी विषय को शासक के विचारार्थ रखने का भाव देता है। दत्तिव τῷ βασιλεῖ को हिंदी में स्वाभाविक रूप से ‘राजा के सामने’ व्यक्त किया गया है।
- source_word: διεσάφησα
  choice: मैंने स्पष्ट कर दिया है
  rationale: क्रिया का अर्थ किसी बात को साफ़-साफ़ समझाना या स्पष्ट करना है। प्रथम पुरुष को यथावत रखा गया है, भले ही प्रसंग में उसका आना अचानक प्रतीत होता हो।
- source_word: ἃ δὲ ἦν ἐνδεχόμενα
  choice: और जो कुछ संभव था
  rationale: ἐνδεχόμενα का मूल भाव ‘संभव/व्यवहार्य’ है। सामूहिक नपुंसकलिंग बहुवचन को हिंदी में ‘जो कुछ संभव था’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συνεχώρησεν
  choice: उसने स्वीकार कर लिया
  rationale: συγχωρέω यहाँ अनुमति देने, मान लेने या अनुरोध स्वीकार करने का अर्थ दे सकता है। ‘स्वीकार कर लिया’ इस व्यापकता को बनाए रखता है और राजा की प्रतिक्रिया के प्रशासनिक संदर्भ में स्वाभाविक है।
