  yaml_path: translation/deuterocanon/2_maccabees/010/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention[c][b], they may be encouraged and may live gladly with support for their own interests.
translation:
  language: hi
  text: इसलिए यदि तुम उनके पास संदेश भेजकर उन्हें सद्भावना का आश्वासन दो[a], तो तुम अच्छा करोगे, ताकि वे हमारा उद्देश्य जानकर उत्साहित रहें[b] और अपने मामलों में सहायता पाकर प्रसन्नतापूर्वक जीवन बिताएँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “दाहिने हाथ देकर।” यह यूनानी मुहावरा सद्भावना, शांति या विश्वासयोग्यता का आश्वासन अथवा प्रतिज्ञा देने को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “प्रसन्नचित्त रहें” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश का अधिक संकीर्ण अर्थ “अपनी संपत्ति के लिए सहायता या संरक्षण के साथ” भी हो सकता है; यूनानी में अपने मामले, हित या संपत्ति—सभी की संभावना बनी रहती है।
    reason: lexical_alternative
