  text: As before[a], being in battle array and having the ally from heaven[b], because the Lord had shown them mercy.
translation:
  language: hi
  text: पहले की तरह[a], युद्ध के लिए तैयार होकर और स्वर्ग से आए सहयोद्धा को अपने पक्ष में पाकर, क्योंकि प्रभु ने उन पर दया की थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहले, पूरी तैयारी के साथ’; यहाँ प्रयुक्त यूनानी शब्द सामान्य तैयारी या साज-सामान का अर्थ भी दे सकता है, केवल युद्ध-विन्यास का नहीं।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी वाक्य बहुत संक्षिप्त है; अधिक शाब्दिक रूप: ‘स्वर्ग से आए सहयोद्धा को पाकर, क्योंकि प्रभु ने उन पर दया की थी।’'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: पहले की तरह
  rationale: यह पदबंध पिछली घटना या अभियान से तुलना सूचित करता है; इसलिए केवल ‘पहले’ की अपेक्षा ‘पहले की तरह’ अधिक स्वाभाविक और सटीक है।
- source_word: ἐν διασκευῇ
  choice: युद्ध के लिए तैयार होकर
  rationale: διασκευή तैयारी, साज-सामान या युद्ध-विन्यास का बोध करा सकता है। सैन्य प्रसंग को स्पष्ट रखते हुए यह अनुवाद ‘युद्ध-पंक्ति में’ से अधिक सहज है और व्यापक अर्थ की गुंजाइश भी बनाए रखता है।
- source_word: σύμμαχον
  choice: सहयोद्धा
  rationale: σύμμαχος मूलतः साथ मिलकर युद्ध करनेवाले को दर्शाता है। ‘सहयोद्धा’ सैन्य रूपक को सामान्य ‘सहायक’ की तुलना में अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: τὸν ἀπʼ οὐρανοῦ σύμμαχον
  choice: स्वर्ग से मिलनेवाले सहयोद्धा
  rationale: ‘स्वर्ग से’ यूनानी अभिव्यक्ति के निकट है और सहायता के स्रोत को बताता है, पर सहयोद्धा की पहचान को यूनानी से अधिक स्पष्ट नहीं करता।
- source_word: ἔχοντες
  choice: अपने साथ लिए हुए
  rationale: शाब्दिक ‘रखते हुए’ की अपेक्षा किसी सहयोद्धा की उपस्थिति के लिए यह आधुनिक हिन्दी में स्वाभाविक है और सहभागी कृदंत का संबंध बनाए रखता है।
- source_word: ἐλεήσαντος
  choice: दया की थी
  rationale: सम्बन्धकारक निरपेक्ष रचना उनकी स्वर्गीय सहायता की पृष्ठभूमि या कारण बताती है। ‘दया की थी’ पूर्ण हुई पूर्ववर्ती क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: इस यहूदी-यूनानी प्रसंग में κύριος परमेश्वर के लिए श्रद्धापूर्ण संबोधन है; ‘प्रभु’ मानक और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: स्वर्गीय सहायता का संदर्भ और स्वरूप
  choice: सैन्य रूपक को ‘स्वर्ग से मिलनेवाले सहयोद्धा’ के रूप में बनाए रखना और उसकी पहचान को अधिक स्पष्ट न करना
  alternative: ‘स्वर्गीय सहायक’ या ‘परमेश्वर को स्वर्गीय सहयोद्धा मानकर’
  rationale: मूल पाठ सहायता को प्रभु की दया से जोड़ता है, किंतु σύμμαχος के संदर्भ को अलग से स्पष्ट नहीं करता। चुना हुआ रूप सैन्य बिंब और मूल की संक्षिप्तता दोनों सुरक्षित रखता है।
- issue: ἐλεήσαντος τοῦ κυρίου का पूर्ववर्ती कथन से संबंध
  choice: दीर्घ विराम और ‘क्योंकि’ द्वारा इसे स्वर्गीय सहायता का कारण बताना
  alternative: केवल साथ-साथ घटित परिस्थिति के रूप में ‘प्रभु के उन पर दया करने पर’
  rationale: सम्बन्धकारक निरपेक्ष रचना कारणात्मक समझी जा सकती है, पर इसका वाक्यगत संबंध संक्षिप्त है। मुख्य पाठ स्वाभाविक कारणात्मक अर्थ देता है और पादटिप्पणी मूल की संकुचित रचना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल रूप अपनाया गया है। पद मूलतः एक आश्रित वाक्यांश जैसा है; दीर्घ विराम उसकी संक्षिप्त संरचना को बनाए रखते हुए हिन्दी में कारण-संबंध स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
