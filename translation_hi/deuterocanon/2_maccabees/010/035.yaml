lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: जिन बातों की
  rationale: यह पदबंध यहाँ उन विषयों या बातों को सूचित करता है जिनके विषय में अनुमति दी गई थी; हिन्दी में संबंधवाचक रचना पूरे वाक्य को स्वाभाविक रखती है।
- source_word: Λυσίας
  choice: लूसियास
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित ध्वन्यात्मक लिप्यंतरण।
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: राजा के संबंधी
  rationale: συγγενής रक्त या पारिवारिक संबंध बताता है; ‘संबंधी’ आधुनिक हिन्दी में स्वाभाविक है और राजकीय पद जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: συνεχώρησεν ὑμῖν
  choice: ने तुम्हें अनुमति दी है
  rationale: राजनयिक संदर्भ में συγχωρέω का अर्थ किसी बात की अनुमति देना या उसे मान लेना है। पूर्ण प्रभाव के वर्तमान में बने रहने को ‘दी है’ व्यक्त करता है।
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: उन्हें हम भी अपनी स्वीकृति देते हैं
  rationale: सह-अनुमोदन या सहमति का भाव सुरक्षित रहता है; स्पष्ट कर्म जोड़ने से हिन्दी वाक्य सहज बनता है।
