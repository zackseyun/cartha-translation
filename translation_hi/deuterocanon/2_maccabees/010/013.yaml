translation:
  language: hi
  text: परन्तु वह मूर्ख नहीं था; अपने साथ हुई हानि पर मन ही मन विचार करके और यह समझकर कि इब्रानियों को हराया नहीं जा सकता, क्योंकि समर्थ परमेश्वर उनके साथ मिलकर युद्ध कर रहा था, उसने पहले ही भेजा—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: परन्तु वह मूर्ख नहीं था
  rationale: यह सहज हिन्दी में यूनानी के नकारात्मक कथन और उसके मूल्यांकनात्मक बल—समझ से रहित न होना—दोनों को बनाए रखता है।
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: मन ही मन विचार किया
  rationale: यह आत्मगत तुलना और विचार-विमर्श के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: अपने ऊपर आई पराजय
  rationale: ἐλάττωμα हानि, पिछड़ाव या पराजय का अर्थ दे सकता है; इस सैनिक प्रसंग में ‘पराजय’ स्पष्ट और उपयुक्त है।
- source_word: συννοήσας
  choice: समझ लिया
  rationale: यह निष्कर्ष तक पहुँचने की पूर्ण क्रिया को सहज कथात्मक हिन्दी में दर्शाता है।
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: इब्रानियों को हराया नहीं जा सकता
  rationale: यह ἀνίκητος की प्रबलता को स्वाभाविक हिन्दी में बनाए रखता और Ἑβραίους का सीधा जातिनाम ‘इब्रानी’ सुरक्षित रखता है।
- source_word: τοῦ δυναμένου θεοῦ
  choice: सामर्थी परमेश्वर
  rationale: यूनानी पद परमेश्वर की सामर्थ्य अथवा समर्थ होने पर बल देता है; ‘सामर्थी परमेश्वर’ संक्षिप्त और गरिमापूर्ण है।
- source_word: συμμαχοῦντος αὐτοῖς
  choice: उनके साथ मिलकर युद्ध कर रहा था
  rationale: συμμαχέω के सैन्य अर्थ—सहयोद्धा या मित्र-सेना के रूप में लड़ना—को स्पष्टतः व्यक्त करता है।
- source_word: προαποστείλας
  choice: पहले से ही दूत भेजे
  rationale: यह अगले पद में पूरी होने वाली क्रिया से पहले किसी को अग्रिम रूप से भेजने का अर्थ व्यक्त करता है; ‘दूत’ प्रसंगगत पूरक है, क्योंकि यूनानी में कर्म अगले पद से समझा जाता है।
theological_decisions:
- issue: Ἑβραίους का अनुवाद
  choice: इब्रानियों
  alternative: यहूदियों
  rationale: मूल यूनानी में स्पष्टतः Ἑβραίους है; इसलिए अधिक परिचित ‘यहूदियों’ से सामंजस्य करने के बजाय स्रोत का जातिनाम रखा गया है।
- issue: युद्ध में परमेश्वर की सहायता
  choice: सामर्थी परमेश्वर उनके साथ मिलकर युद्ध कर रहा था
  alternative: परमेश्वर उनकी सहायता कर रहा था
  rationale: मूल पाठ केवल सामान्य सहायता नहीं, बल्कि सक्रिय सैन्य सहभागिता व्यक्त करता है; अनुवाद इस तनावपूर्ण चित्र को नरम नहीं करता।
- issue: τοῦ δυναμένου θεοῦ की अभिव्यक्ति
  choice: सामर्थी परमेश्वर
  alternative: वह परमेश्वर जो समर्थ है
  rationale: चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए परमेश्वर की सामर्थ्य पर मूल बल को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पद यूनानी की तरह अगले पद की ओर खुला रहता है; हिन्दी वाक्य में अग्रिम प्रेषण स्पष्ट करने के लिए ‘दूत’ जोड़ा गया है। अंग्रेज़ी परामर्श-पाठ के पादटिप्पणी-चिह्न अर्थ-सामग्री से मेल नहीं खाते थे, इसलिए अनावश्यक चिह्न नहीं रखे गए।
