  yaml_path: translation/deuterocanon/2_maccabees/010/008.yaml
  text: And while they were there near Jerusalem[a], a horseman appeared, going before them[b], clothed in white and brandishing golden armor.
translation:
  language: hi
  text: जब वे वहीं यरूशलेम के पास थे, तो सफेद वस्त्र पहने एक घुड़सवार[a] उनके आगे-आगे चलता हुआ दिखाई दिया[b]; वह सोने का पूरा कवच लहरा रहा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ इस घुड़सवार की पहचान नहीं बताता। वर्णन किसी स्वर्गीय या स्वर्गदूतीय आकृति का संकेत दे सकता है, पर यह स्पष्ट रूप से नहीं कहा गया है।
    reason: alternative_reading
  - marker: b
    text: या, “उनसे आगे दिखाई दिया।” यूनानी कृदन्त केवल आगे होने का अर्थ भी दे सकता है, यद्यपि प्रसंग में आगे चलने या मार्ग दिखाने का भाव संभव है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी शब्द का अर्थ “पूरा युद्ध-कवच” या “पूरा युद्ध-साज” हो सकता है; यहाँ उसके साथ लहराने या जोर से हिलाने की क्रिया प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτόθι δὲ πρὸς τοῖς Ἱεροσολύμοις ὄντων
  choice: जब वे वहीं यरूशलेम के पास थे
  rationale: यह वाक्यांश स्थान और पृष्ठभूमिकाल दोनों बताता है। ‘वहीं’ αὐτόθι को और ‘के पास’ πρός के स्थानीय, निकटता-सूचक अर्थ को सुरक्षित रखता है।
- source_word: ἐφάνη
  choice: दिखाई दिया
  rationale: यह रूप किसी आकृति के अचानक दृश्य होने को व्यक्त करता है। ‘दिखाई दिया’ स्वाभाविक हिन्दी है और दर्शनात्मक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: προηγούμενος αὐτῶν
  choice: उनके आगे-आगे चलता हुआ
  rationale: मूल कृदन्त उनके सामने चलने या उनसे आगे होने का बोध देता है। यह अनुवाद नेतृत्व को स्पष्ट तथ्य बनाए बिना गतिशील दृश्य को बनाए रखता है।
- source_word: ἔφιππος
  choice: एक घुड़सवार
  rationale: यूनानी शब्द का शाब्दिक अर्थ ‘घोड़े पर सवार’ है; हिन्दी में संज्ञात्मक ‘घुड़सवार’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: सफेद वस्त्र पहने
  rationale: यह पोशाक का वर्णन है। ‘सफेद वस्त्र’ वस्त्र के प्रकार को अनावश्यक रूप से निश्चित किए बिना दृश्यात्मक बल बनाए रखता है।
- source_word: πανοπλίαν χρυσῆν κραδαίνων
  choice: सोने का पूरा कवच लहरा रहा था
  rationale: πανοπλία पूरे युद्ध-कवच या युद्ध-साज को सूचित करता है और κραδαίνων उसे हिलाने या लहराने की सजीव क्रिया बताता है। मूल की कुछ असामान्य युद्ध-छवि को सहज बनाकर मिटाया नहीं गया है।
theological_decisions:
- issue: प्रकट हुए घुड़सवार की प्रकृति
  choice: आकृति को केवल ‘एक घुड़सवार’ कहा गया है।
  alternative: ‘एक स्वर्गदूत घुड़सवार’ या ‘एक स्वर्गीय सवार’
  rationale: यूनानी पाठ इस आकृति की पहचान स्पष्ट रूप से नहीं करता। सफेद वस्त्र और सोने का कवच अलौकिक संकेत दे सकते हैं, पर अनुवाद उस निहितार्थ को निश्चित धर्मवैज्ञानिक पहचान में नहीं बदलता।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आगे-आगे चलता हुआ’ दृश्य की गति व्यक्त करता है, जबकि पादटिप्पणी मूल की अस्पष्टता सुरक्षित रखती है। संदर्भ-जाँच आवश्यक है: दिया गया यूनानी पाठ मानक सेप्टुआजिन्त क्रमांकन में 2 मकाबियों 11:8 से मेल खाता है, 10:8 से नहीं; इसलिए प्रकाशन से पहले पद-संदर्भ सुधारा जाए।'
