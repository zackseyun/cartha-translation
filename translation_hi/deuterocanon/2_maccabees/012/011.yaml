base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/011.yaml
  text: And when a fierce battle had taken place[a], and those with Judas had prevailed because of the help from God, the nomads, having been weakened, asked Judas to give them his right hand[b], promising both to provide pasture and to be useful to them in the future.
translation:
  language: hi
  text: जब घमासान युद्ध हुआ और परमेश्वर से मिली सहायता के कारण यहूदा के साथी सफल हुए, तब कमजोर पड़ चुके खानाबदोशों ने यहूदा से आग्रह किया कि वह उन्हें अपना दाहिना हाथ दे[a]। उन्होंने उन्हें चरागाह देने और आगे भी उनके काम आने का वादा किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उन्हें दाहिना हाथ दे।” यह शांति करने या मैत्री की प्रतिज्ञा करने का मुहावरा है।
    reason: cultural_note
  - marker: b
    text: अंत में यूनानी शब्द-विन्यास कुछ संक्षिप्त और असामान्य है; आशय संभवतः यह है कि उन्होंने चरागाह उपलब्ध कराने और भविष्य में सहायता करने का वादा किया।
    reason: textual_variant
lexical_decisions:
- source_word: καρτερᾶς μάχης
  choice: घमासान युद्ध
  rationale: युद्ध के संदर्भ में καρτερός उसकी कठोरता और प्रचंडता व्यक्त करता है; ‘घमासान’ आधुनिक हिन्दी में स्वाभाविक और सशक्त है।
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: यहूदा के साथी
  rationale: यह यूनानी मुहावरा यहूदा के साथ रहने वाले दल को दर्शाता है; ‘साथी’ अनावश्यक सैन्य विशिष्टता जोड़े बिना अर्थ स्पष्ट करता है।
- source_word: διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν
  choice: परमेश्वर से मिली सहायता के कारण
  rationale: यह अनुवाद सफलता का कारण और सहायता का दैवी स्रोत—दोनों स्पष्ट रूप से सुरक्षित रखता है।
- source_word: εὐημερησάντων
  choice: सफल हुए
  rationale: युद्ध के प्रसंग में शब्द सामान्य समृद्धि के बजाय अनुकूल सफलता बताता है; ‘सफल हुए’ उसकी सीमा को बढ़ाकर पूर्ण विजय नहीं बनाता।
- source_word: ἐλαττωθέντες
  choice: कमजोर पड़ चुके
  rationale: मूल शब्द घटने या कमजोर होने का भाव देता है; ‘पराजित’ कहना उसके आशय से अधिक निश्चित होता।
- source_word: οἱ νομάδες
  choice: खानाबदोश
  rationale: यह घुमंतू जीवन जीने वाले समुदायों का वर्णन है, कोई निश्चित व्यक्तिवाचक नाम नहीं।
- source_word: δοῦναι ... δεξιὰν
  choice: अपना दाहिना हाथ दे
  rationale: शांति या मैत्री की प्रतिज्ञा से जुड़े मूल सांस्कृतिक मुहावरे को मुख्य पाठ में बनाए रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
- source_word: βοσκήματα δώσειν
  choice: चरागाह देने
  rationale: βοσκήματα पशुओं के चरने की व्यवस्था, चरागाह या चारे का संकेत दे सकता है; ‘चरागाह’ प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: ἐν τοῖς λοιποῖς ... ὠφέλησεν αὐτούς
  choice: आगे भी उनके काम आने
  rationale: संचरित यूनानी वाक्यांश व्याकरण की दृष्टि से संक्षिप्त और असामान्य है; यह रूप भविष्य की उपयोगी सहायता का सामान्य अर्थ रखता है और अनावश्यक विवरण नहीं जोड़ता।
theological_decisions:
- issue: सैन्य सफलता में परमेश्वर की सहायता
  choice: सफलता को ‘परमेश्वर से मिली सहायता के कारण’ कहा गया
  alternative: केवल सैन्य सफलता बताना और दैवी कारण को पृष्ठभूमि में रखना
  rationale: मूल यूनानी διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν स्पष्ट रूप से सफलता का कारण परमेश्वर से आई सहायता को बताता है; अनुवाद इस दावे को न तो नरम करता है, न उससे आगे जाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और कथात्मक गरिमा बनाए रखती है। ‘घमासान युद्ध’, ‘कमजोर पड़ चुके’ और ‘काम आने’ सामान्य पाठक के लिए सहज हैं। मूल का ‘दाहिना हाथ देना’ वाला सांस्कृतिक मुहावरा अर्थ-स्पष्टीकरण सहित सुरक्षित रखा गया है।
