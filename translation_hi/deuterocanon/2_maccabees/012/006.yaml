  yaml_path: translation/deuterocanon/2_maccabees/012/006.yaml
  text: 'And calling on God[a], the righteous judge, he came against the murderers of his brothers: by night he set the harbor on fire and burned the ships, and he stabbed those who had fled there.'
translation:
  language: hi
  text: और परमेश्वर, उस धर्मी न्यायी को पुकारकर, वह अपने भाइयों के हत्यारों के विरुद्ध आया। उसने रात में बंदरगाह में आग लगा दी और जहाज़ों को जला डाला; और जो लोग वहाँ भाग गए थे[a], उन्हें बेध डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो लोग वहाँ शरण लेने गए थे।” यूनानी कृदंत वहाँ भागकर शरण लेने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσάμενος
  choice: पुकारकर
  rationale: यह परमेश्वर से सहायता या न्याय की अपील करने का धार्मिक भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν δίκαιον κριτὴν θεόν
  choice: धर्मी न्यायी परमेश्वर
  rationale: δίκαιος के नैतिक और न्यायिक बल को ‘धर्मी’ तथा κριτής को ‘न्यायी’ से व्यक्त किया गया है; इससे परमेश्वर की उपाधि संक्षिप्त और गरिमापूर्ण रहती है।
- source_word: παραγενόμενος ἐπὶ
  choice: पर चढ़ आया
  rationale: सैन्य प्रसंग में यह शत्रुओं के विरुद्ध आगे बढ़ने का भाव स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: τοὺς μιαιφόνους τῶν ἀδελφῶν
  choice: अपने भाइयों के हत्यारों
  rationale: μιαιφόνος रक्तपात के दोषी हत्यारों के लिए प्रबल शब्द है। प्रसंगानुसार ‘अपने’ से यह स्पष्ट होता है कि ‘भाई’ उसके समुदाय के लोग हैं, जबकि पद का संबंध बना रहता है।
- source_word: τὸν μὲν λιμένα
  choice: बंदरगाह
  rationale: λιμήν के ठोस भौगोलिक अर्थ के लिए यह सामान्य और सहज हिन्दी शब्द है।
- source_word: νύκτωρ
  choice: रात में
  rationale: हमले का समय सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἐνέπρησεν
  choice: आग लगा दी
  rationale: क्रिया के किसी वस्तु को जला उठाने के कारक भाव को ठीक से व्यक्त करता है।
- source_word: τὰ σκάφη κατέφλεξεν
  choice: जहाज़ों को जला डाला
  rationale: बंदरगाह और सैन्य आक्रमण के प्रसंग में σκάφη के लिए ‘जहाज़’ उपयुक्त है; ‘जला डाला’ κατέφλεξεν की तीव्रता को सहज हिन्दी में रखता है।
- source_word: τοὺς δὲ ἐκεῖ συμφυγόντας
  choice: जो लोग वहाँ भाग गए थे
  rationale: यह मुख्य रूप से उस स्थान की ओर भागने का अर्थ रखता है और शरण लेने की संभावित छाया को पादटिप्पणी में सुरक्षित रखता है।
- source_word: ἐξεκέντησεν
  choice: उन्हें बेध डाला
  rationale: यह नुकीले हथियार से आर-पार करने का अर्थ रखता है, पर मूल में न बताए गए किसी विशेष हथियार को नहीं जोड़ता।
theological_decisions:
- issue: प्रतिशोधात्मक सैन्य प्रसंग में परमेश्वर का न्यायी के रूप में वर्णन
  choice: धर्मी न्यायी परमेश्वर
  alternative: न्याय करनेवाला परमेश्वर
  rationale: अनुवाद परमेश्वर के लिए मूल पाठ की न्यायिक उपाधि को बनाए रखता है, पर यह नहीं जोड़ता कि इसके बाद की सारी हिंसक कार्रवाई पर परमेश्वर की स्पष्ट स्वीकृति थी। इस प्रकार पद का धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। ‘पर चढ़ आया’ सैन्य गति को स्पष्ट करता है; ‘बेध डाला’ हिंसा को छिपाता नहीं, पर मूल से अधिक विशिष्ट हथियार या परिणाम नहीं जोड़ता। पादटिप्पणी-चिह्न [a] उसी वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
