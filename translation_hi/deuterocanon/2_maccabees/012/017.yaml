    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσπάσαντες
  choice: कूच करके
  rationale: यह कृदंत किसी स्थान से हटकर आगे बढ़ने का भाव देता है; सैनिक यात्रा के प्रसंग में ‘कूच करके’ स्वाभाविक और संदर्भानुकूल है।
- source_word: σταδίους ἑπτακοσίους πεντήκοντα
  choice: सात सौ पचास स्टेडियम की दूरी
  rationale: मूल पाठ की प्राचीन माप-इकाई को बनाए रखा गया है; ‘की दूरी’ जोड़ने से आधुनिक हिन्दी में अर्थ स्पष्ट होता है।
- source_word: διήνυσαν
  choice: दूरी तय की ... पहुँचे
  rationale: क्रिया निर्धारित दूरी पूरी करने या पार करने का संकेत देती है। हिन्दी वाक्य में दूरी तय करने और गंतव्य पर पहुँचने की संयुक्त अभिव्यक्ति मूल का भाव सहज रूप से देती है।
- source_word: εἰς τὸν Χάρακα
  choice: खाराक ... पहुँचे
  rationale: Χάρακα को स्थान-नाम मानकर यूनानी रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: τοὺς λεγομένους Τουβιηνοὺς Ἰουδαίους
  choice: तूबियेनोई कहलाने वाले यहूदियों
  rationale: λεγομένους का सीधा अर्थ ‘कहलाने वाले’ है। समूह-नाम Τουβιηνοί को व्याख्यात्मक रूप देने के बजाय लिप्यंतरित किया गया है, ताकि मूल की अनिश्चितता बनी रहे।
