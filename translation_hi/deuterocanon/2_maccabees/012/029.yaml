    reason: alternative_reading
lexical_decisions:
- source_word: ἀναζεύξαντές
  choice: पड़ाव उठाया
  rationale: यह यूनानी कृदन्त सैन्य या यात्रा-संदर्भ में डेरा समेटकर प्रस्थान करने का भाव देता है; ‘पड़ाव उठाया’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὥρμησαν
  choice: चल पड़े
  rationale: यहाँ क्रिया आक्रमण या झपटने की अपेक्षा किसी गंतव्य की ओर उद्देश्यपूर्ण प्रस्थान को बताती है।
- source_word: ἐπὶ Σκυθῶν πόλιν
  choice: स्कूथियों के नगर की ओर
  rationale: मूल यूनानी में व्यक्तिवाचक नाम ‘स्कूथोपोलिस’ नहीं, बल्कि शाब्दिक रूप से ‘स्कूथियों का नगर’ है; ‘की ओर’ ἐπί के गंतव्य-संबंधी अर्थ को व्यक्त करता है।
- source_word: ἀπέχουσαν
  choice: जो ... दूर था
  rationale: यह कृदन्त यरूशलेम से दूरी बताता है; हिन्दी में सम्बन्धवाचक उपवाक्य स्पष्ट और स्वाभाविक है।
- source_word: σταδίους ἑξακοσίους
  choice: छः सौ स्टेडिया
  rationale: पारदर्शिता और मूल की औपचारिक शुद्धता के लिए प्राचीन माप-इकाई को बनाए रखा गया है; आधुनिक दूरी में रूपांतरण अनुमानात्मक होगा।
