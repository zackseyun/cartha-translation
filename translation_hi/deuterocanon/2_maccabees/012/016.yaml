base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/016.yaml
  text: And when they had taken the city by the will of God[a], they made an immeasurable slaughter, so that the nearby lake, having a width of two stadia, appeared to be overflowing[b], filled with blood.
translation:
  language: hi
  text: और परमेश्वर की इच्छा से नगर पर अधिकार कर लेने के बाद उन्होंने ऐसा बेहिसाब संहार किया कि पास की झील, जो दो स्टेडिया[a] चौड़ी थी, रक्त से भरकर बहती हुई दिखाई देने लगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्टेडियन लंबाई की एक प्राचीन इकाई थी; दो स्टेडिया लगभग 370 मीटर होते हैं।
    reason: cultural_note
  - marker: b
    text: या, “रक्त से भरी हुई दिखाई देने लगी।” यूनानी भाषा में यहाँ सजीव चित्रण है, जिसका अर्थ यह भी हो सकता है कि रक्त झील में या उसके बीच बहता हुआ उसे भरा हुआ दिखा रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβόμενοι
  choice: नगर पर अधिकार कर लेने के बाद
  rationale: सैन्य प्रसंग में क्रिया का अर्थ नगर को पकड़ना या जीत लेना है। यह पदबंध यूनानी कृदंत की पूर्वकालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῇ τοῦ θεοῦ θελήσει
  choice: परमेश्वर की इच्छा से
  rationale: करण अथवा अनुरूपता बताने वाले सम्प्रदान कारक को संक्षिप्त रूप में रखा गया है और नगर-विजय को परमेश्वर की इच्छा से जोड़ने वाला मूल कथन सुरक्षित है।
- source_word: ἀμυθήτους … σφαγάς
  choice: ऐसा बेहिसाब संहार
  rationale: ἀμύθητος में गिनती या वर्णन से परे होने का अतिशयोक्तिपूर्ण भाव है। 'बेहिसाब संहार' आधुनिक और सहज हिन्दी में वही प्रबलता व्यक्त करता है, बिना संज्ञा में निहित हिंसा को बढ़ाए या घटाए।
- source_word: παρακειμένην λίμνην
  choice: पास की झील
  rationale: यह झील के निकट स्थित होने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: τὸ πλάτος ἔχουσαν σταδίους δύο
  choice: जो दो स्टेडिया चौड़ी थी
  rationale: प्राचीन माप को मूल रूप में रखते हुए चौड़ाई का अर्थ स्पष्ट किया गया है; आधुनिक अनुमान पादटिप्पणी में दिया गया है।
- source_word: καταρρεῖν … τὸ αἷμα πεπληρωμένην φαίνεσθαι
  choice: रक्त से भरकर बहती हुई दिखाई देने लगी
  rationale: अनुवाद में φαίνεσθαι का दृश्य या प्रतीतिगत भाव, πεπληρωμένην की परिपूर्णता और καταρρεῖν के बहने की सजीव छवि—तीनों बनाए रखे गए हैं।
theological_decisions:
- issue: नगर पर अधिकार में परमेश्वर की इच्छा का संबंध
  choice: परमेश्वर की इच्छा से
  alternative: परमेश्वर की इच्छा के अनुसार
  rationale: मूल पाठ नगर पर अधिकार को स्पष्ट रूप से परमेश्वर की इच्छा से जोड़ता है। अनुवाद इस कठिन धार्मिक तनाव को बनाए रखता है, पर इससे आगे बढ़कर बाद के संहार के बारे में कोई अतिरिक्त धार्मिक समर्थन घोषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। 'स्टेडिया' ऐतिहासिक माप के रूप में सुरक्षित है और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
