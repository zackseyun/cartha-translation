  yaml_path: translation/deuterocanon/2_maccabees/012/037.yaml
  text: Beginning the battle cry in the language of his fathers[a], with hymns[b], he shook those around Gorgias by surprise and put them to flight.
translation:
  language: hi
  text: अपने पूर्वजों की भाषा में[a] भजनों के साथ युद्धघोष आरम्भ करके, उसने गोरगियास के दल को अप्रत्याशित रूप से विचलित कर दिया और उन्हें भागने पर मजबूर कर दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पैतृक भाषा में।’ यूनानी पद में ‘पैतृक वाणी’ का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनकी भगदड़ करा दी।’ यूनानी में सैन्य अर्थ है, ‘उन्हें पलटकर भागने पर विवश किया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: καταρξάμενος
  choice: आरम्भ किया
  rationale: यह क्रिया यहूदा द्वारा युद्धघोष शुरू किए जाने को बताती है। हिन्दी में मुख्य क्रिया के रूप में रखना यूनानी कृदन्त का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῇ πατρίῳ φωνῇ
  choice: अपने पूर्वजों की वाणी में
  rationale: πατρίῳ का अर्थ पैतृक या पूर्वजों से प्राप्त है, और φωνή वाणी, बोली अथवा भाषा को सूचित कर सकता है। यह रूप भाषा और पैतृक संबंध—दोनों को खुला रखता है।
- source_word: τὴν μεθʼ ὕμνων κραυγήν
  choice: भजनों के साथ युद्धघोष
  rationale: κραυγή ऊँची पुकार है और सैन्य प्रसंग में युद्धघोष स्वाभाविक है; μεθʼ ὕμνων उसके भजनों के साथ होने को स्पष्ट करता है।
- source_word: ἐνσείσας
  choice: झकझोरकर
  rationale: शाब्दिक अर्थ ‘हिलाकर’ है; यहाँ यह शत्रु-दल को अचानक विचलित या अस्त-व्यस्त करने का सजीव रूपक है।
- source_word: ἀπροσδοκήτως
  choice: अचानक
  rationale: यह आक्रमण या प्रभाव के अप्रत्याशित होने को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς περὶ τὸν Γοργίαν
  choice: गोरगियास के साथियों को
  rationale: यूनानी मुहावरा गोरगियास के आसपास के लोगों, अर्थात् उसके दल या सैनिकों, को सूचित करता है।
- source_word: τροπὴν ἐποιήσατο αὐτῶν
  choice: उन्हें खदेड़ दिया
  rationale: सैन्य प्रयोग में τροπή पलटकर भागने या पराजित होकर पीछे हटने को दर्शाता है। ‘खदेड़ दिया’ इस परिणाम को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: युद्धघोष का धार्मिक स्वरूप
  choice: युद्धघोष को भजनों के साथ बताया गया है
  alternative: केवल स्तुति की पुकार या केवल युद्धघोष
  rationale: यूनानी पाठ κραυγή और μεθʼ ὕμνων दोनों को जोड़ता है। इसलिए अनुवाद सैन्य और उपासना-संबंधी दोनों तत्वों को बनाए रखता है, बिना कोई अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पूर्वजों की वाणी’ मूल की भाषा/वाणी संबंधी हल्की अस्पष्टता को बचाता है; ‘युद्धघोष’ और ‘भजनों के साथ’ युद्ध तथा धार्मिक अभिव्यक्ति दोनों को स्पष्ट रखते हैं। अंग्रेज़ी परामर्श-पाठ में [b] का स्थान आशय से मेल नहीं खाता था; हिन्दी मसौदे में उसे ‘खदेड़ दिया’ के बाद रखा गया है।
