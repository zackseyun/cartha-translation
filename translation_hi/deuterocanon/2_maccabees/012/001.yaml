lexical_decisions:
- source_word: Γενομένων
  choice: हो गए
  rationale: सम्बन्धवाचक कृदन्त यहाँ मुख्य क्रियाओं से पहले समझौतों के पूरा हो जाने को व्यक्त करता है; ‘हो गए’ स्वाभाविक हिन्दी में इस पूर्ववर्ती पूर्ण क्रिया को बनाए रखता है।
- source_word: συνθηκῶν
  choice: समझौते
  rationale: यह शब्द सहमति या करार का व्यापक अर्थ रखता है। ‘समझौते’ सहज है और ‘वाचाएँ’ जैसे अनावश्यक धर्मवैज्ञानिक अर्थ से बचता है।
- source_word: ἀπῆε
  choice: चला गया
  rationale: यह कथा में वहाँ से प्रस्थान को दर्शाता है; ‘चला गया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: πρὸς τὸν βασιλέα
  choice: राजा के पास
  rationale: πρός के साथ कर्मकारक किसी व्यक्ति की ओर जाने का लक्ष्य बताता है। यूनानी में ‘वापस’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: περὶ τὴν γεωργίαν ἐγίνοντο
  choice: खेती-बाड़ी में लग गए
  rationale: पूरा पदबंध कृषि-कार्य में लगने या व्यस्त होने का मुहावरेदार अर्थ देता है। यह हिन्दी रूप शाब्दिक अस्वाभाविकता से बचते हुए आरम्भिक/गतिशील भाव को भी व्यक्त करता है।
