base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/020.yaml
  text: But Maccabeus[a], after arranging the troops around him in companies, stationed them over against the companies; and they charged against Timothy, who had around him twelve myriads of foot soldiers, two thousand horsemen[b], and besides these seven thousand more.
translation:
  language: hi
  text: परन्तु मक्काबी ने अपने साथ की सेना को टुकड़ियों में व्यवस्थित करके शत्रु की टुकड़ियों के सामने तैनात किया। और वे तीमुथियुस पर धावा बोल पड़े, जिसके साथ एक लाख बीस हज़ार पैदल सैनिक[a], दो हज़ार घुड़सवार और इनके अतिरिक्त सात हज़ार सैनिक[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘बारह दस-हज़ार पैदल सैनिक’ है, अर्थात् 1,20,000 पैदल सैनिक।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी का अंतिम वाक्यांश संक्षिप्त है: ‘और सात हज़ार के अतिरिक्त।’ यहाँ इसे पहले गिनाए गए पैदल सैनिकों और घुड़सवारों से अलग सात हज़ार अतिरिक्त सैनिकों के रूप में समझा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: διατάξας
  choice: व्यवस्थित करके
  rationale: अओरिस्ट कृदन्त मुख्य कार्रवाई से पहले की गई सैन्य व्यवस्था को दर्शाता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τὴν περὶ αὐτὸν στρατιὰν
  choice: अपने साथ की सेना
  rationale: शाब्दिक स्थानिक भाव ‘उसके चारों ओर की सेना’ है, पर प्रसंग में आशय उसके साथ उपस्थित सैन्य बल से है।
- source_word: σπειρηδόν
  choice: टुकड़ियों में
  rationale: यह सैन्य इकाइयों के अनुसार विभाजन बताता है और किसी विशिष्ट रोमी तकनीकी पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: κατέστησεν αὐτοὺς ἐπὶ τῶν σπειρῶν
  choice: शत्रु की टुकड़ियों के सामने तैनात किया
  rationale: संक्षिप्त यूनानी वाक्यांश को युद्ध-संदर्भ में प्रतिपक्षी सैन्य दलों के सामने मोर्चाबंदी के रूप में प्रस्तुत किया गया है।
- source_word: ὥρμησαν
  choice: धावा बोला
  rationale: क्रिया युद्ध में तीव्र आक्रामक गति व्यक्त करती है; ‘धावा बोला’ वर्तमान हिन्दी में सजीव और उपयुक्त है।
- source_word: μυριάδας δώδεκα πεζῶν
  choice: बारह दस-हज़ार पैदल सैनिक
  rationale: मूल की संख्या-रचना को दृश्यमान रखते हुए ‘म्यरियड’ जैसे अपरिचित उधार शब्द से बचा गया है; कुल संख्या पादटिप्पणी में स्पष्ट है।
- source_word: ἱππεῖς δὲ δισχιλίους
  choice: दो हज़ार घुड़सवार
  rationale: सुलभ और सटीक सैन्य पद।
- source_word: καὶ πρὸς τοῖς ἑπτακισχιλίοις
  choice: और इनके अतिरिक्त सात हज़ार सैनिक
  rationale: πρός तथा सम्प्रदान यहाँ अतिरिक्त संख्या का बोध कराते हैं; किन सैनिकों का उल्लेख है, यह यूनानी में स्पष्ट नहीं है, इसलिए सामान्य ‘सैनिक’ रखा गया है।
