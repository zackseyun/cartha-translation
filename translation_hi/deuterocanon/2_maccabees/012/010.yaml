base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/010.yaml
  text: From there[a], after they had gone nine stadia, while making their march against Timotheus, Arabs fell upon him, no fewer than five thousand, and five hundred horsemen.
translation:
  language: hi
  text: वहाँ से नौ स्तादिया आगे बढ़ने के बाद, जब वे तीमुथियुस के विरुद्ध चढ़ाई कर रहे थे, तब कम-से-कम पाँच हज़ार अरबों ने उस पर[a] धावा बोल दिया; उनमें पाँच सौ घुड़सवार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘उस पर’ (αὐτῷ) एकवचन है। कुछ अनुवादक इसे यहूदा के पूरे दल के लिए सामूहिक संकेत मानकर ‘उन पर’ लिख सकते हैं, पर यहाँ उपलब्ध मूल पाठ एकवचन है; इसलिए मुख्य पाठ में वही रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποστάντες
  choice: आगे बढ़ने के बाद
  rationale: यह भूतकालिक कृदन्त पिछले स्थान से आगे चले जाने को दर्शाता है। यह अनुवाद यात्रा-वृत्तांत में स्वाभाविक है और अलगाव का अनावश्यक भाव नहीं जोड़ता।
- source_word: σταδίους ἐννέα
  choice: नौ स्तादिया
  rationale: मूल पाठ की प्राचीन दूरी-इकाई को बनाए रखा गया है; आधुनिक माप में बदलने से अनुमान जुड़ जाता।
- source_word: ποιουμένων τὴν πορίαν
  choice: जब वे ... चढ़ाई कर रहे थे
  rationale: यह पदबंध उस समय जारी सैन्य प्रयाण को व्यक्त करता है। प्रसंग के कारण ‘चढ़ाई’ साधारण यात्रा की अपेक्षा अधिक उपयुक्त है।
- source_word: ἐπὶ τὸν Τιμόθεον
  choice: तीमुथियुस के विरुद्ध
  rationale: सैन्य प्रसंग में ἐπί और कर्मकारक विरोधी की ओर शत्रुतापूर्ण बढ़ने का भाव देते हैं।
- source_word: ἐπέβαλον
  choice: धावा बोल दिया
  rationale: क्रिया अचानक और शत्रुतापूर्ण आक्रमण का बोध कराती है; ‘धावा बोल दिया’ उसका बल स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἄραβες
  choice: अरबों
  rationale: यह आधुनिक हिन्दी में जातीय नाम का सीधा और प्रचलित रूप है।
- source_word: αὐτῷ
  choice: उस पर
  rationale: प्रदत्त यूनानी पाठ में सर्वनाम एकवचन है। संदर्भ में इसे यहूदा या उसके दल के सामूहिक उल्लेख के रूप में समझना सम्भव है, फिर भी मुख्य पाठ स्रोत का एकवचन सुरक्षित रखता है।
- source_word: οὐκ ἐλάττους τῶν πεντακισχιλίων
  choice: कम-से-कम पाँच हज़ार
  rationale: यह वाक्यांश न्यूनतम संख्या बताता है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἱππεῖς δὲ πεντακόσιοι
  choice: और पाँच सौ घुड़सवारों
  rationale: ἱππεῖς घोड़े पर सवार सैनिकों को दर्शाता है; ‘घुड़सवार’ इसका स्पष्ट और ठोस हिन्दी रूप है।
