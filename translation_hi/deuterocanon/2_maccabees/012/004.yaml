  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली अपनाई गई है। यूनानी वाक्य की लम्बी कृदन्तीय रचना को दो वाक्यों में बाँटा गया है। अन्तिम क्रियाओं में निष्क्रिय रूप रखा गया है, क्योंकि इस पृथक पद में कर्ता स्पष्ट रूप से व्यक्त नहीं है।
