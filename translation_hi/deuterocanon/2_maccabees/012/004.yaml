  text: But after the common resolution of the city[a], and when these men had accepted it as though they wanted peace and had nothing suspicious in mind, they took them away and drowned them, no fewer than two hundred of them.
translation:
  language: hi
  text: परन्तु नगर के सामूहिक निर्णय के बाद, जब इन लोगों ने उसे इस प्रकार स्वीकार किया मानो वे शांति चाहते हों और उनके मन में कोई संदेहजनक इरादा न हो,[a] तब उन्हें ले जाकर डुबो दिया। उनकी संख्या दो सौ से कम नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विषय में कुछ भी संदिग्ध न था”; यूनानी वाक्यांश उनके मन में किसी संदेहजनक इरादे के न होने या उनके विषय में कुछ भी संदिग्ध न होने—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ κοινὸν τῆς πόλεως ψήφισμα
  choice: नगर का सामूहिक निर्णय
  rationale: ψήφισμα किसी औपचारिक निर्णय, प्रस्ताव या आदेश को दर्शाता है; ‘सामूहिक निर्णय’ τὸ κοινόν के सार्वजनिक और सामुदायिक भाव को बनाए रखता है, बिना इसे राजकीय आदेश बना देने के।
- source_word: τούτων ἐπιδεξαμένων
  choice: जब इन लोगों ने उसे ... स्वीकार कर लिया
  rationale: ἐπιδέχομαι यहाँ नगर के निर्णय या प्रस्ताव को स्वीकार करने अथवा उस पर सहमत होने का भाव देता है।
- source_word: ὡς ἂν εἰρηνεύειν θέλοντων
  choice: मानो वे शान्ति चाहते हों
  rationale: ‘मानो’ ὡς ἄν के प्रतीयमान या तुलनात्मक भाव को सुरक्षित रखता है और पात्रों के वास्तविक उद्देश्य का अनावश्यक निर्णय नहीं करता।
- source_word: μηδὲν ὑπόπτον ἐχόντων
  choice: उनके मन में कोई संदेहजनक इरादा न हो
  rationale: यह हिन्दी में प्रसंगानुकूल और स्वाभाविक है, जबकि ὑπόπτον की वैकल्पिक अधिक वस्तुगत समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀχθέντας
  choice: उन्हें ले जाकर
  rationale: ἄγω का निष्क्रिय कृदन्त उन्हें किसी अनिर्दिष्ट स्थान पर ले जाए जाने को बताता है; यह अनुवाद कोई विशिष्ट दिशा या स्थान नहीं जोड़ता।
- source_word: ἐβύθισαν
  choice: डुबो दिया गया
  rationale: βυθίζω का मूल भाव गहराई में डुबोना है; मनुष्यों के संदर्भ में यह मृत्युकारक डुबोने को स्पष्टतः व्यक्त करता है।
- source_word: ὄντας οὐκ ἔλαττον τῶν διακοσίων
  choice: उनकी संख्या दो सौ से कम नहीं थी
  rationale: यह οὐκ ἔλαττον की न्यूनतम संख्या वाली शक्ति को सहज हिन्दी में यथावत रखता है।
