  footnotes:
  - marker: a
    text: 'यूनानी अभिव्यक्ति संक्षिप्त है: शाब्दिक रूप से, “न्यायकारी प्रभु की बातें/विषय।” निहित बहुवचन संज्ञा का अर्थ “कार्य,” “बातें,” या “मामले” हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσαντες
  choice: स्तुति की
  rationale: परमेश्वर की ओर निर्देशित εὐλογέω के धार्मिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘धन्य कहा’ यहाँ कम सहज होता।
- source_word: τὰ τοῦ δικαιοκρίτου κυρίου
  choice: उस प्रभु के कार्यों के लिए ... जो न्यायपूर्वक न्याय करता है
  rationale: τὰ + संबंधकारक की दीर्घवृत्तीय रचना को ‘कार्य’ से स्पष्ट किया गया है, पर इसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है। δικαιοκρίτου को केवल पदवी न बनाकर न्याय करने के ढंग के रूप में व्यक्त करना यूनानी संयुक्त शब्द का बल बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर की श्रद्धापूर्ण उपाधि है।
- source_word: τὰ κεκρυμμένα
  choice: छिपी हुई बातें
  rationale: संज्ञा के रूप में प्रयुक्त पूर्ण कर्मवाच्य कृदन्त के बहुवचन अर्थ को सहज हिन्दी में रखता है।
- source_word: φανερὰ ποιοῦντος
  choice: प्रकट कर देता है
  rationale: ‘दृश्य/प्रत्यक्ष बनाता है’ की कारणवाचक शक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τὰ τοῦ δικαιοκρίτου κυρίου की दीर्घवृत्तीय और व्याकरणतः अस्पष्ट अभिव्यक्ति
  choice: प्रभु के कार्यों के लिए उसकी स्तुति की, जो न्यायपूर्वक न्याय करता है
  alternative: धर्मी न्यायी प्रभु की स्तुति की; अथवा प्रभु, उस धर्मी न्यायी के कार्यों की स्तुति की
  rationale: यूनानी τὰ किसी निहित बहुवचन संज्ञा—जैसे कार्य या बातें—की ओर संकेत करता है। मुख्य पाठ में पठनीय अर्थ दिया गया है, जबकि पादटिप्पणी पदवी-आधारित वैकल्पिक समझ को सुरक्षित रखती है।
- issue: δικαιοκρίτου का स्वरूप
  choice: जो न्यायपूर्वक न्याय करता है
  alternative: धर्मी न्यायी
  rationale: संयुक्त शब्द उस व्यक्ति को बताता है जो ठीक या न्यायपूर्ण ढंग से न्याय करता है। क्रियात्मक हिन्दी इस अर्थ को स्पष्ट करती है और किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ती।
- issue: परमेश्वर के लिए κύριος
  choice: प्रभु
  alternative: स्वामी
  rationale: दैवी उपाधि के रूप में ‘प्रभु’ मानक बाइबलीय और स्वाभाविक हिन्दी है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठकों के लिए स्पष्ट, पर गरिमापूर्ण। यूनानी की दीर्घवृत्तीय रचना को मुख्य पाठ में स्वाभाविक बनाया गया है और उसकी वास्तविक अस्पष्टता [a] में सुरक्षित रखी गई है।
