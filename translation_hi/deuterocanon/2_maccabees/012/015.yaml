base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/015.yaml
  text: But those around Judas[a], having called on the great Sovereign of the world—the one who, in the time of Joshua, brought down Jericho without rams or siege engines—assaulted the wall fiercely.
translation:
  language: hi
  text: परन्तु यहूदा के साथियों ने संसार के महान अधिपति को पुकारा—जिसने यहोशू[a] के समय में दीवार तोड़ने वाले मेढ़ों और घेराबंदी के यंत्रों के बिना ही यरीहो को ढहा दिया था—और बड़ी उग्रता से दीवार पर धावा बोल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम का रूप ‘ईएसूस’ है; यरीहो के पतन के इस प्रसंग में यह नून के पुत्र यहोशू को सूचित करता है।
    reason: यूनानी नाम-रूप की सम्भावित अस्पष्टता स्पष्ट करना।
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: परन्तु यहूदा के साथियों ने
  rationale: περὶ + कर्मकारक का यह प्रयोग किसी अगुआ से जुड़े दल को दर्शाता है। ‘यहूदा के साथी’ स्वाभाविक हिन्दी है और केवल उपस्थित जनों को अनावश्यक रूप से किसी औपचारिक सैन्य पद में सीमित नहीं करता।
- source_word: ἐπικαλεσάμενοι
  choice: पुकारा
  rationale: मध्यम रूप यहाँ सहायता के लिए परमेश्वर को पुकारने या उसका आह्वान करने का भाव देता है। ‘पुकारा’ सरल, प्रार्थनापरक और प्रसंगानुकूल है।
- source_word: τὸν μέγαν τοῦ κόσμου δυνάστην
  choice: संसार के महान अधिपति
  rationale: δυνάστης सामर्थ्य और शासनाधिकार रखने वाले शासक को सूचित करता है। ‘अधिपति’ गरिमापूर्ण होते हुए भी आधुनिक हिन्दी में बोधगम्य है।
- source_word: ἄτερ κριῶν καὶ μηχανῶν ὀργανικῶν
  choice: दीवार तोड़ने वाले मेढ़ों और घेराबंदी के यंत्रों के बिना
  rationale: युद्ध के प्रसंग में κριοί दीवार या फाटक तोड़ने के लिए प्रयुक्त भारी मेढ़ों को और μηχαναί ὀργανικαί अभियान्त्रिक घेराबंदी-यंत्रों को दर्शाता है। व्याख्यात्मक विशेषण सामान्य पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: κατακρημνίσαντα τὴν Ἰερειχὼ
  choice: यरीहो को ढहा दिया था
  rationale: κατακρημνίζω गिरा देने या धराशायी कर देने का प्रबल भाव रखता है। नगर का नाम यहाँ उसकी प्राचीर सहित समग्र रूप में आया है; ‘ढहा दिया’ संकेत को स्वाभाविक हिन्दी में रखता है।
- source_word: κατὰ τοὺς Ἰησοῦ χρόνους
  choice: यहोशू के समय में
  rationale: यरीहो के पतन का स्पष्ट ऐतिहासिक संकेत नून के पुत्र यहोशू की ओर है। हिन्दी की मानक बाइबलीय नाम-परम्परा के अनुसार ‘यहोशू’ पाठक को सही व्यक्ति पहचानने देता है।
- source_word: ἐνέσεισαν θηριωδῶς τῷ τείχει
  choice: बड़ी उग्रता से दीवार पर धावा बोल दिया
  rationale: ἐνέσεισαν का मूल चित्र दीवार को झकझोरने का है, पर इस युद्ध-संदर्भ में यह प्रबल आक्रमण को व्यक्त करता है। θηριωδῶς पशु-समान प्रचंडता बताता है; ‘बड़ी उग्रता से’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यरीहो के प्रसंग में Ἰησοῦ की पहचान
  choice: यहोशू
  alternative: यीशु अथवा यूनानी नाम-रूप का लिप्यंतरण
  rationale: यरीहो के गिरने का उल्लेख निर्विवाद रूप से नून के पुत्र यहोशू के युग की ओर संकेत करता है। ‘यीशु’ आधुनिक हिन्दी पाठक को गलत ऐतिहासिक व्यक्ति समझा सकता है, इसलिए सन्दर्भगत पहचान को स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। वाक्य की सहभागी संरचना को हिन्दी में मुख्य क्रियाओं के क्रम से स्वाभाविक बनाया गया है और मूल यूनानी की युद्ध-संबंधी तीव्रता को बनाए रखा गया है।
