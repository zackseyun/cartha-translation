base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/038.yaml
  text: Then Judas[a], taking the army, came to the city of Odollam. And as the week was ending, they purified themselves there according to the custom and spent the Sabbath there.
translation:
  language: hi
  text: फिर यहूदा सेना को साथ लेकर ओदोल्लाम नगर पहुँचा। जब सप्ताह का अंत निकट था[a], तब वे प्रथा के अनुसार वहीं शुद्ध होकर सब्त वहीं बिताने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जब सप्ताह आ रहा था” या “जब सप्ताह आगे बढ़ रहा था”; इसके बाद सब्त का उल्लेख दिखाता है कि सातवाँ दिन निकट था।
    reason: मूल यूनानी काल-सूचक वाक्यांश की शाब्दिक अस्पष्टता और संदर्भानुकूल अर्थ दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀναλαβὼν τὸ στράτευμα
  choice: सेना को साथ लेकर
  rationale: ἀναλαμβάνω यहाँ सैन्य दल को अपने साथ लेकर आगे बढ़ने का भाव देता है। यह हिन्दी में स्वाभाविक है और ‘सेना को इकट्ठा किया’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἧκεν
  choice: पहुँचा
  rationale: क्रिया किसी स्थान पर आने या पहुँचने को सूचित करती है; हिन्दी कथन में ‘पहुँचा’ गंतव्य के साथ अधिक स्वाभाविक है।
- source_word: Ὀδολλὰμ πόλιν
  choice: ओदोल्लाम नगर
  rationale: यूनानी स्थान-नाम का लिप्यंतरण किया गया है और πόλις को स्पष्ट रूप से ‘नगर’ रखा गया है।
- source_word: τῆς ἑβδομάδος ἐπιβαλλούσης
  choice: जब सप्ताह का अंत निकट आया
  rationale: मुहावरे का शाब्दिक अर्थ सप्ताह के ‘आने/आगे बढ़ने’ से जुड़ा है; अगले वाक्यांश में सब्त के उल्लेख के कारण आशय सप्ताह के सातवें दिन के निकट आने का है। मुख्य पाठ में संदर्भानुकूल अर्थ और पादटिप्पणी में शाब्दिक अनिश्चितता सुरक्षित रखी गई है।
- source_word: κατὰ τὸν ἐθισμόν
  choice: प्रथा के अनुसार
  rationale: ἐθισμός प्रचलित रीति या प्रथा को दर्शाता है; यह संक्षिप्त और आधुनिक हिन्दी है।
- source_word: ἁγνισθέντες
  choice: अपने को शुद्ध किया
  rationale: यहाँ अनुष्ठानिक शुद्धि का भाव है। हिन्दी में कर्मवाच्य कृदंत को स्वाभाविक कर्तृवाच्य-प्रतिबिंबित रूप में दिया गया है।
- source_word: τὸ σάββατον διῆγεν
  choice: सब्त का दिन वहीं बिताया
  rationale: διάγω समय बिताने का अर्थ देता है। यह अनुवाद सब्त के पालन का संदर्भ बनाए रखता है, पर क्रिया से अधिक धार्मिक विवरण नहीं जोड़ता।
theological_decisions:
- issue: सब्त से पहले अनुष्ठानिक शुद्धि
  choice: प्रथा के अनुसार वहीं अपने को शुद्ध किया
  alternative: प्रथा के अनुसार वहीं अपने को धोया
  rationale: ἁγνίζω का धार्मिक-अनुष्ठानिक अर्थ है; ‘शुद्ध किया’ उसे बनाए रखता है और इसे केवल शारीरिक धुलाई तक सीमित नहीं करता।
- issue: सब्त बिताने का वर्णन
  choice: सब्त का दिन वहीं बिताया
  alternative: वहीं सब्त मनाया
  rationale: यूनानी διῆγεν सीधे समय बिताने को कहता है। ‘मनाया’ अधिक स्पष्ट धार्मिक पालन का भाव जोड़ सकता है, इसलिए अपेक्षाकृत तटस्थ रूप चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘यहूदा’, ‘ओदोल्लाम’ और ‘सब्त’ जैसे रूप बाइबलीय नामावली तथा यूनानी स्रोत के निकट हैं।
