  text: He also advanced against a certain city of bridges[a], strongly fortified and enclosed with walls, inhabited by mixed peoples; its name was Caspin.
translation:
  language: hi
  text: फिर उसने पुलों वाले एक नगर[a] पर भी चढ़ाई की। वह नगर बहुत मज़बूती से किलेबंद था, चारों ओर दीवारों से घिरा हुआ था, और उसमें मिले-जुले जातीय समुदायों के लोग रहते थे। उसका नाम कसपीन था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुलों का नगर।” यूनानी वाक्यांश संक्षिप्त है; सम्भव है कि यह किसी औपचारिक उपाधि के बजाय नगर के उल्लेखनीय पुलों या पुल-जैसे मार्गों का वर्णन करता हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέβαλεν
  choice: चढ़ाई की
  rationale: यह क्रिया किसी स्थान के विरुद्ध सैन्य रूप से बढ़ने या धावा बोलने का भाव देती है; ‘चढ़ाई की’ आक्रमण की दिशा को व्यक्त करती है, पर युद्ध के अगले चरणों को पहले से निश्चित नहीं करती।
- source_word: ἐπί τινα πόλιν
  choice: एक नगर पर
  rationale: τινα नगर का अनिश्चित परिचय कराता है। हिन्दी में ‘एक नगर’ स्वाभाविक है; ‘किसी एक नगर’ यहाँ अनावश्यक रूप से भारी होता।
- source_word: γεφυρῶν
  choice: पुलों वाले
  rationale: सम्बन्धकारक बहुवचन का प्रयोग संक्षिप्त और कुछ अस्पष्ट है। ‘पुलों वाले’ नगर की पुल-संबंधी विशेषता को सुरक्षित रखता है, बिना इसे औपचारिक उपाधि ठहराए।
- source_word: ὀχυρὰν
  choice: बहुत दृढ़
  rationale: नगर के प्रसंग में यह उसकी रक्षात्मक मजबूती का सूचक है। अगले वाक्य में दीवारों का स्पष्ट उल्लेख होने के कारण ‘बहुत दृढ़’ पुनरुक्ति से बचते हुए सैन्य अर्थ बनाए रखता है।
- source_word: τείχεσιν περιτεφραγμένην
  choice: चारों ओर दीवारों से घिरा
  rationale: कृदन्त और करण कारक नगर को रक्षात्मक दीवारों से चारों ओर घिरा हुआ बताते हैं; यह हिन्दी में स्पष्ट और स्वाभाविक रूप है।
- source_word: παμμιγέσιν ἔθνεσιν
  choice: मिली-जुली जातियों के लोग
  rationale: παμμιγής व्यापक मिश्रण और ἔθνη अनेक जनसमूहों को व्यक्त करता है। यह रूप किसी एक मिश्रित आबादी की बजाय विभिन्न जातीय समुदायों के परस्पर मिश्रण को सहज हिन्दी में बताता है।
- source_word: κατοικουμένην
  choice: उसमें ... लोग रहते थे
  rationale: ग्रीक का कर्मवाच्य कृदन्त हिन्दी में सक्रिय वाक्य के रूप में अधिक स्वाभाविक है और निवास किए जाने का अर्थ पूरा रखता है।
- source_word: ὄνομα δὲ Κασπείν
  choice: उसका नाम कसपीन था
  rationale: स्पष्ट यूनानी नामकरण-वाक्य को सीधे और गरिमापूर्ण हिन्दी में प्रस्तुत किया गया है; स्थान-नाम को ध्वन्यात्मक रूप से ‘कसपीन’ लिखा गया है।
