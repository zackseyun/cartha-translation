  yaml_path: translation/deuterocanon/2_maccabees/012/014.yaml
  text: But those inside[a], trusting in the strength of the walls and in the supply of provisions, treated Judas and his men more arrogantly, reviling them[b], and even blaspheming and speaking what is not lawful.
translation:
  language: hi
  text: परन्तु भीतर के लोग नगर की दीवारों की मज़बूती और खाद्य-सामग्री के भंडार पर भरोसा रखते हुए यहूदा और उसके साथियों के साथ और भी उद्दंडता से पेश आते थे, उन्हें गालियाँ देते थे, और यहाँ तक कि ईशनिंदा करते और ऐसी बातें कहते थे जिन्हें कहना उचित नहीं था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जिन्हें कहना उचित नहीं था” का अनुवाद “जिन्हें कहना निषिद्ध था” या “जो कहना धर्मसम्मत नहीं था” भी हो सकता है; यूनानी अभिव्यक्ति में नैतिक या धार्मिक बल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔνδον
  choice: परन्तु भीतर के लोग
  rationale: यह स्वाभाविक स्थानवाचक अभिव्यक्ति दुर्ग या नगर के भीतर उपस्थित रक्षकों को बिना अनावश्यक विस्तार के दर्शाती है।
- source_word: πεποιθότες
  choice: भरोसा करके
  rationale: पूर्ण कृदन्त उनके जमे हुए और लगातार बने विश्वास को व्यक्त करता है; हिन्दी में यह प्रयोग सहज है।
- source_word: τῇ τῶν τειχέων ἐρυμνότητι
  choice: शहरपनाह की मज़बूती
  rationale: ἐρυμνότης दीवारों की सुदृढ़ता और रक्षात्मक सामर्थ्य बताता है; घेराबंदी के प्रसंग में ‘शहरपनाह’ उपयुक्त और बोधगम्य है।
- source_word: τῇ τε τῶν βρωμάτων παραθέσει
  choice: खाद्य-सामग्री के भंडार
  rationale: βρώματα और παράθεσις यहाँ घेराबंदी सहने के लिए उपलब्ध भोजन-सामग्री या रसद की संचित आपूर्ति की ओर संकेत करते हैं।
- source_word: ἀναυθαγέστερον ἐχρῶντο
  choice: और भी उद्दंडता से पेश आए
  rationale: तुलनात्मक क्रियाविशेषण बढ़ी हुई धृष्टता या अक्खड़पन व्यक्त करता है; यह हिन्दी रूप अर्थ और तुलना दोनों को बनाए रखता है।
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: यहूदा और उसके साथियों
  rationale: यूनानी मुहावरा यहूदा के आसपास या उससे संबद्ध दल को दर्शाता है; प्रसंग में ‘यहूदा और उसके साथी’ स्पष्ट और स्वाभाविक है।
- source_word: λοιδοροῦντες
  choice: गालियाँ देते
  rationale: यह कृदन्त तीखे मौखिक अपमान को व्यक्त करता है; ‘गालियाँ देना’ आधुनिक हिन्दी में इसकी तीव्रता स्पष्ट करता है।
- source_word: βλασφημοῦντες
  choice: ईशनिन्दा करते
  rationale: यह चयन सामान्य अपमान से आगे बढ़ती सम्भावित धार्मिक अधार्मिकता को बनाए रखता है और पद में शब्दों की तीव्र होती शृंखला को सपाट नहीं करता।
- source_word: λαλοῦντες ἃ μὴ θέμις
  choice: ऐसी बातें कहते थे जिन्हें कहना उचित नहीं था
  rationale: θέμις सामाजिक, नैतिक या धार्मिक रूप से अनुमत और उचित बात को सूचित कर सकता है; मुख्य पाठ का रूप स्वाभाविक रहते हुए इस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: βλασφημοῦντες का धार्मिक अथवा सामान्य अपमानजनक बल
  choice: ईशनिन्दा करते
  alternative: निन्दा करते या अपशब्द कहते
  rationale: λοιδοροῦντες पहले ही मौखिक अपमान बताता है। अलग से ‘ईशनिन्दा’ रखना सम्भावित धार्मिक उत्कर्ष और मूल की तनावपूर्ण तीव्रता को सुरक्षित रखता है, यद्यपि यूनानी शब्द कभी व्यापक निन्दात्मक वाणी के लिए भी प्रयुक्त हो सकता है।
- issue: ἃ μὴ θέμις में निषेध का स्वरूप
  choice: जिन्हें कहना उचित नहीं था
  alternative: जिन्हें कहना धर्मसम्मत नहीं था या जो कहना निषिद्ध था
  rationale: मूल पद नैतिक, सामाजिक और धार्मिक अनुचितता के बीच सीमा को स्पष्ट नहीं करता। मुख्य पाठ में ‘उचित नहीं’ इस अनिश्चितता को बनाए रखता है; पादटिप्पणी अधिक कठोर सम्भावनाएँ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘शहरपनाह’ सैन्य प्रसंग को स्पष्ट करता है, जबकि ‘खाद्य-सामग्री का भंडार’ प्राचीन घेराबंदी की रसद को सहज ढंग से व्यक्त करता है।
