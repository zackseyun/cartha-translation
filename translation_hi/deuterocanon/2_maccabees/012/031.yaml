  yaml_path: translation/deuterocanon/2_maccabees/012/031.yaml
  text: After giving thanks and urging them beforehand also in the future to be well-disposed toward the nation[a], they came to Jerusalem, as the feast of weeks was approaching.
translation:
  language: hi
  text: धन्यवाद देने और उनसे पहले ही यह आग्रह करने के बाद कि वे आगे भी यहूदी लोगों के प्रति सद्भाव रखें, वे यरूशलेम पहुँचे। उस समय सप्ताहों का पर्व[a] निकट था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सप्ताहों का त्योहार’; परंपरागत रूप से, ‘पिन्तेकुस्त’।
    reason: मूल पर्व-नाम का वैकल्पिक अनुवाद और उसका परंपरागत नाम दिया गया है।
lexical_decisions:
- source_word: εὐχαριστήσαντες
  choice: धन्यवाद देने के बाद
  rationale: अनिर्दिष्ट कर्म को अनिर्दिष्ट रखते हुए एओरिस्ट कृदन्त की पूर्वकालिक क्रिया व्यक्त होती है।
- source_word: προπαρακαλέσαντες
  choice: उनसे पहले ही यह आग्रह करने के बाद
  rationale: क्रिया के आग्रह/प्रोत्साहन के अर्थ और उपसर्ग προ- के पूर्वता-सूचक भाव, दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: εἰς τὰ λοιπά
  choice: आगे भी
  rationale: यह पद भविष्य में या इसके बाद भी जारी रहने का भाव देता है; ‘आगे भी’ संक्षिप्त और स्वाभाविक है।
- source_word: πρὸς τὸ γένος
  choice: यहूदी लोगों के प्रति
  rationale: γένος यहाँ प्रसंग में यहूदी जातीय-राष्ट्रीय समुदाय को सूचित करता है। ‘जाति’ आधुनिक हिन्दी में जाति-व्यवस्था का अनचाहा अर्थ जगा सकती है, इसलिए आशय को स्पष्ट और सहज रूप में व्यक्त किया गया है।
- source_word: εὐμενεῖς εἶναι
  choice: सद्भाव रखें
  rationale: यह अनुकूल या कृपालु मनोभाव रखने को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: παρεγενήθησαν
  choice: वे यरूशलेम पहुँचे
  rationale: वर्णनात्मक प्रसंग में क्रिया का सामान्य अर्थ किसी स्थान पर आ पहुँचना है।
- source_word: τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: सप्ताहों का पर्व
  rationale: यूनानी में दिए यहूदी पर्व के वर्णनात्मक नाम का सीधा अनुवाद किया गया है; परंपरागत नाम पिन्तेकुस्त को मुख्य पाठ में नहीं रखा गया।
- source_word: οὔσης ὑπογύου
  choice: निकट था
  rationale: सम्बन्धकारक निरपेक्ष रचना समकालीन परिस्थिति बताती है, और ὑπόγυος का अर्थ निकट या शीघ्र आने वाला है।
theological_decisions:
- issue: τῆς τῶν ἑβδομάδων ἑορτῆς का पर्व-नाम
  choice: सप्ताहों का पर्व
  alternative: पिन्तेकुस्त
  rationale: मूल यूनानी पर्व का वर्णनात्मक नाम देता है। मूल-पाठ की प्रधानता रखते हुए उसी का अनुवाद मुख्य पाठ में किया गया है और परंपरागत नाम को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लम्बी यूनानी कृदन्तीय रचना को दो हिन्दी वाक्यों में बाँटा गया है, जिससे कालक्रम और निकट आते पर्व की परिस्थिति स्पष्ट रहती है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘nation’ के बाद था, पर पादटिप्पणी पर्व-नाम से संबंधित है; इसलिए हिन्दी में [a] को ‘सप्ताहों का पर्व’ के बाद सही स्थान पर रखा गया है।
