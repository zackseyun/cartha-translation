base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/002.yaml
  text: But of the local commanders[a], Timotheus and Apollonius son of Gennaeus, and further Hieronymus and Demophon, and besides these Nicanor the Cypriarch, would not let them live in peace.
translation:
  language: hi
  text: पर स्थानीय सेनापतियों में से तिमोथियुस और गेन्नैयुस का पुत्र अपोल्लोनियुस, फिर हिरोनिमुस और देमोफोन, और इनके अलावा कुप्रिआर्खेस[a] निकानोर, उन्हें चैन से नहीं रहने देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदवी ‘कुप्रिआर्खेस’ कुप्रुस से संबद्ध किसी शासक या अधिकारी को सूचित करती है; इसका सटीक पद अनिश्चित है।
    reason: दुर्लभ यूनानी पदवी का अर्थ पूरी तरह निश्चित नहीं है; लिप्यंतरण मूल की अस्पष्टता सुरक्षित रखता है और टिप्पणी संभावित अर्थ बताती है।
lexical_decisions:
- source_word: τῶν ... κατὰ τόπον στρατηγῶν
  choice: स्थानीय सेनापतियों में से
  rationale: यह पदबंध अलग-अलग स्थानों या क्षेत्रों में नियुक्त सेनापतियों को दर्शाता है। ‘स्थानीय सेनापति’ प्रशासनिक भाव को बिना किसी निश्चित औपचारिक पद का अनुमान लगाए स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὁ τοῦ Γενναίου
  choice: गेन्नैयुस का पुत्र
  rationale: लेख सहित संबंधकारक यूनानी संरचना यहाँ अपोल्लोनियुस की पहचान उसके पिता के नाम से कराती है; हिंदी में ‘का पुत्र’ स्पष्ट और स्वाभाविक है।
- source_word: ἔτι δὲ
  choice: फिर
  rationale: यह सूची में और नाम जोड़ता है; ‘फिर’ संक्षिप्त रूप में उसके योगात्मक भाव को बनाए रखता है।
- source_word: πρὸς δὲ τούτοις
  choice: और इनके अलावा
  rationale: यह निकानोर को पहले बताए गए व्यक्तियों के अतिरिक्त प्रस्तुत करता है।
- source_word: ὁ Κυπριάρχης
  choice: कुप्रिआर्खेस
  rationale: यह कुप्रुस से संबद्ध एक दुर्लभ पदवी है, जिसका ठीक प्रशासनिक आशय अनिश्चित है। लिप्यंतरण मूल की अस्पष्टता बचाता है; संभावित अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: οὐκ εἴων
  choice: नहीं रहने देते थे
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार किए जाने वाले अवरोध को व्यक्त करता है; हिंदी का यह प्रयोग उस कालगत भाव को सहजता से रखता है।
- source_word: ἡσυχίαν ἄγειν
  choice: चैन से रहने
  rationale: यह मुहावरा शांतिपूर्वक या बिना बाधा के जीवन बिताने का भाव देता है। ‘चैन से रहने’ वर्तमान हिंदी में स्वाभाविक और संदर्भानुकूल है।
