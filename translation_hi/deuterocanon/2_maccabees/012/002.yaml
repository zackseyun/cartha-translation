  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी अपनाई गई है। नामों का यूनानी रूप के निकट देवनागरी लिप्यंतरण किया गया है और दुर्लभ पदवी को अनावश्यक रूप से ‘राज्यपाल’ जैसे निश्चित पद में नहीं बदला गया।
