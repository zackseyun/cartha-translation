base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/043.yaml
  text: And after taking up a collection man by man[a], he sent two thousand silver drachmas to Jerusalem to provide a sin offering, acting very well and nobly, because he was reasoning about the resurrection.
translation:
  language: hi
  text: फिर उसने हर पुरुष से चंदा इकट्ठा करके[a] चाँदी की दो हज़ार द्राख्माएँ यरूशलेम भेजीं, ताकि पाप के लिए बलिदान चढ़ाया जाए। उसने यह बहुत अच्छा और उत्तम काम किया, क्योंकि वह पुनरुत्थान पर विचार कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रत्येक पुरुष पर निर्धारित चंदा लेकर,” अथवा “पुरुषों की सूची के अनुसार संग्रह करके।” यूनानी पद κατʼ ἀνδρολόγιον कुछ तकनीकी है और संभवतः प्रत्येक व्यक्ति पर लगाए गए अंशदान या पुरुषों की सूची के अनुसार किए गए संग्रह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιησάμενός τε κατʼ ἀνδρολόγιον
  choice: फिर उसने हर पुरुष से चंदा इकट्ठा करके
  rationale: कृदंत पहले की गई धन-संग्रह की क्रिया बताता है। κατʼ ἀνδρολόγιον का वितरणात्मक भाव ‘हर पुरुष से’ द्वारा सुरक्षित रहता है, जबकि ‘चंदा’ प्रसंग में धन एकत्र करने को स्वाभाविक हिन्दी में व्यक्त करता है; प्रशासनिक विधि की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ἀργυρίου δραχμὰς δισχιλίας
  choice: चाँदी की दो हज़ार द्राख्माएँ
  rationale: राशि, धातु और प्राचीन मुद्रा—तीनों को स्पष्ट रूप से बनाए रखता है।
- source_word: προσαγαγεῖν περὶ ἁμαρτίας θυσίαν
  choice: ताकि पाप के लिए बलिदान चढ़ाया जाए
  rationale: धन यरूशलेम भेजने का उद्देश्य बलिदान प्रस्तुत करवाना था। कर्मवाच्य हिन्दी यह भी स्पष्ट रखती है कि भेजने वाला स्वयं वहाँ बलिदान चढ़ाने वाला नहीं बताया गया है। ‘पाप के लिए बलिदान’ मूल पदबंध की अपेक्षाकृत खुली संरचना को सुरक्षित रखता है।
- source_word: πάνυ καλῶς καὶ ἀστείως πράττων
  choice: उसने यह बहुत अच्छा और उत्तम काम किया
  rationale: मूल के प्रबल अनुमोदन को बिना नरम किए सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है। ἀστείως का यहाँ अर्थ परिष्कृत/उचित/श्रेष्ठ ढंग से है, न कि आधुनिक अर्थ में ‘शहरी’।
- source_word: ὑπὲρ ἀναστάσεως διαλογιζόμενος
  choice: क्योंकि वह पुनरुत्थान पर विचार कर रहा था
  rationale: διαλογίζομαι के चिंतन-विमर्श के भाव और ὑπέρ से प्रसंग में व्यक्त कारणात्मक संबंध को सुरक्षित रखता है। ἀνάστασις में जो ‘मरे हुओं का’ स्पष्टतः नहीं है, उसे मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: मरे हुओं के संबंध में पाप-बलिदान के लिए धन भेजने पर लेखक का अनुमोदन
  choice: ‘उसने यह बहुत अच्छा और उत्तम काम किया’ के रूप में स्पष्ट अनुमोदन रखा गया है।
  alternative: ऐसा तटस्थ अनुवाद जो लेखक की नैतिक प्रशंसा को कम कर दे।
  rationale: πάνυ καλῶς καὶ ἀστείως πράττων स्पष्ट और प्रबल प्रशंसात्मक भाषा है। विभिन्न परंपराओं में इस आचरण पर मतभेद होने के कारण भी अनुवाद को मूल का अनुमोदन कम नहीं करना चाहिए।
- issue: ἀνάστασις का आशय
  choice: ‘पुनरुत्थान’
  alternative: ‘मरे हुओं का पुनरुत्थान’
  rationale: यूनानी संज्ञा के साथ कोई स्पष्ट संबंधकारक पद नहीं है। व्यापक प्रसंग मृतकों की ओर संकेत करता है, पर मुख्य पाठ में मूल से अधिक शब्द जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘द्राख्माएँ’ से ऐतिहासिक मुद्रा का नाम सुरक्षित रखा गया है। ‘पाप के लिए बलिदान’ सांप्रदायिक व्याख्या थोपे बिना मूल बलिदानी पदबंध को स्पष्ट करता है।
