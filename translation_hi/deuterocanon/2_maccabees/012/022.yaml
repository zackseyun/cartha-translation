base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/022.yaml
  text: But when Judas’s company first appeared[a], and dread came upon the enemies—fear also coming upon them from the appearing of the One who watches over all things—they rushed into flight, each man being driven a different way, so that they were often injured by their own men and run through by the points of their swords.
translation:
  language: hi
  text: पर जब यहूदा की टुकड़ी पहले-पहल प्रकट हुई[a], तो शत्रुओं पर दहशत छा गई; और सब कुछ देखनेवाले के प्रकट होने से भी उन पर भय छा गया। वे भाग खड़े हुए और तितर-बितर होकर अलग-अलग दिशाओं में जा पड़े। इस कारण वे बार-बार अपने ही लोगों के हाथों घायल हुए और अपनी ही तलवारों की नोकों से आर-पार बेधे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब कुछ देखनेवाले के प्रकट होने से।” यूनानी में पद के आरम्भ में यहूदा की टुकड़ी के लिए प्रयुक्त ‘प्रकट होने’ की ही शब्दावली यहाँ फिर दोहराई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείσης / ἐπιφανίας
  choice: प्रकट हुई / प्रकट होने
  rationale: दोनों शब्द एक ही प्रकट होनेवाली शब्दावली से बने हैं। हिन्दी में ‘प्रकट’ को दोनों स्थानों पर रखकर यूनानी की जानबूझकर की गई पुनरावृत्ति और अचानक दृश्य उपस्थिति का भाव सुरक्षित रखा गया है।
- source_word: σπείρης
  choice: टुकड़ी
  rationale: यह सैन्य दल को स्वाभाविक हिन्दी में व्यक्त करता है, पर उसकी निश्चित रोमी इकाई या संख्या निर्धारित नहीं करता।
- source_word: δέους / φόβου
  choice: दहशत / भय
  rationale: दो निकटार्थी यूनानी संज्ञाओं का भेद बनाए रखने के लिए अलग हिन्दी शब्द रखे गए हैं; ‘दहशत’ तीव्र आतंक और ‘भय’ सामान्य डर को व्यक्त करता है।
- source_word: τοῦ τὰ πάντα ἐφορῶντος
  choice: सब कुछ देखनेवाले
  rationale: यह व्यापक दिव्य दृष्टि को स्पष्ट करता है और परमेश्वर की देखरेख का संकेत रहने देता है, बिना मूल से अधिक तकनीकी धर्मवैज्ञानिक अर्थ जोड़ने के।
- source_word: εἰς φυγὴν ὥρμησαν
  choice: वे भाग खड़े हुए
  rationale: मुहावरेदार आधुनिक हिन्दी में अचानक और घबराहट भरे पलायन का भाव देता है।
- source_word: ἄλλος ἀλλαχῇ φερόμενος
  choice: तितर-बितर होकर अलग-अलग दिशाओं में जा पड़े
  rationale: अव्यवस्थित बिखराव और प्रत्येक के अलग दिशा में बह निकलने का दृश्य स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: βλάπτεσθαι
  choice: घायल हुए
  rationale: सैन्य प्रसंग में व्यापक ‘हानि उठाने’ के अर्थ को स्पष्ट और स्वाभाविक रूप देता है; अगले अधिक विशिष्ट भेदन से इसका अंतर बना रहता है।
- source_word: ἀναπείρεσθαι ... ταῖς τῶν ξιφῶν ἀκμαῖς
  choice: तलवारों की नोकों से आर-पार बेधे गए
  rationale: मूल के तीखे, दृश्यात्मक भेदन और तलवार की नोक के उल्लेख को सुरक्षित रखता है।
theological_decisions:
- issue: τοῦ τὰ πάντα ἐφορῶντος में परमेश्वर का वर्णन
  choice: सब कुछ देखनेवाले
  alternative: सब वस्तुओं पर दृष्टि रखनेवाले
  rationale: चुना हुआ पाठ परमेश्वर की सर्वव्यापी दृष्टि को सीधे व्यक्त करता है और ἐφοράω के ‘देखने’ तथा ‘निगरानी रखने’ दोनों संभावित रंगों को अनावश्यक रूप से किसी एक व्यवस्थित धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
- issue: यहूदा की टुकड़ी और परमेश्वर के लिए समान प्रकटता-शब्दावली
  choice: दोनों के लिए ‘प्रकट’
  alternative: पहले स्थान पर ‘दिखाई दी’ और दूसरे पर ‘दर्शन’
  rationale: यूनानी पाठ ἐπιφανείσης और ἐπιφανίας द्वारा दोनों घटनाओं को शब्दगत रूप से जोड़ता है। एक ही हिन्दी मूल रखने से यह साहित्यिक और धर्मवैज्ञानिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सुगम, किंतु युद्ध-वर्णन के अनुरूप गरिमापूर्ण और सजीव। ‘टुकड़ी’ अनावश्यक तकनीकी विशिष्टता से बचाती है; ‘भाग खड़े हुए’, ‘तितर-बितर’ और ‘आर-पार बेधे गए’ मूल की गति और हिंसक अव्यवस्था को स्वाभाविक हिन्दी में रखते हैं।
