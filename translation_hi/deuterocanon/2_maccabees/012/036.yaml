  yaml_path: translation/deuterocanon/2_maccabees/012/036.yaml
  text: But those with Esdrin were fighting for a longer time and were exhausted[a], so Judas called on the Lord to appear as an ally and as the leader of the battle.
translation:
  language: hi
  text: और जब एस्द्रिन के साथ के लोग लंबे समय तक लड़ते-लड़ते बहुत थक गए थे, तब यहूदा ने प्रभु को पुकारा कि वह सहयोगी के रूप में प्रकट हो और युद्ध का अगुआ[a] के रूप में प्रकट हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध में आगे चलकर मार्ग दिखानेवाला।” यूनानी शब्द προοδηγός उस व्यक्ति पर बल दे सकता है जो आगे चलकर मार्ग दिखाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ περὶ τὸν Ἔσδριν
  choice: पर जब एस्द्रिन के साथ के लोग
  rationale: περὶ के साथ व्यक्तिनाम उस व्यक्ति से जुड़े समूह को दर्शाता है। यह रूप सैन्य पद या संगठन को अनावश्यक रूप से निश्चित किए बिना यूनानी मुहावरे का अर्थ देता है।
- source_word: ἐπὶ πλεῖον μαχομένων
  choice: बहुत देर तक लड़ते-लड़ते
  rationale: संदर्भ में ἐπὶ πλεῖον युद्ध की बढ़ी हुई अवधि को सूचित करता है; हिन्दी का यह प्रयोग निरंतर और लंबी लड़ाई को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατακόπων ὄντων
  choice: थक चुके थे
  rationale: κατάκοπος परिश्रम से अत्यधिक थक जाने की दशा बताता है। ‘थक चुके थे’ पूर्ववर्ती दीर्घ युद्ध के परिणाम को स्पष्ट रखता है।
- source_word: ἐπικαλεσάμενος
  choice: पुकारा
  rationale: परमेश्वर से सहायता की प्रार्थना के संदर्भ में यह सरल, वर्तमान हिन्दी का स्वाभाविक रूप है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: यहाँ κύριος श्रद्धापूर्वक परमेश्वर के लिए प्रयुक्त है; ‘प्रभु’ मानक और स्वाभाविक हिन्दी समतुल्य है।
- source_word: σύμμαχον
  choice: सहयोगी
  rationale: σύμμαχος युद्ध में साथ देनेवाले सहयोगी को दर्शाता है। ‘सहयोगी’ सामान्य पाठक के लिए स्पष्ट है और ‘सहायक’ की अपेक्षा साथ खड़े होने का भाव अधिक सुरक्षित रखता है।
- source_word: προοδηγὸν
  choice: अगुआ
  rationale: προοδηγός आगे चलकर नेतृत्व या मार्गदर्शन करनेवाले को दर्शाता है। ‘अगुआ’ युद्ध के संदर्भ में नेतृत्व का भाव रखता है, जबकि पादटिप्पणी आगे चलकर मार्ग दिखाने की वैकल्पिक छवि बताती है।
- source_word: φανῆναι ... φανῆναι
  choice: प्रकट हो ... प्रकट हो
  rationale: यूनानी में क्रिया की पुनरावृत्ति को बनाए रखा गया है। ‘प्रकट हो’ दैवी हस्तक्षेप को व्यक्त करता है, पर यह तय नहीं करता कि प्रकट होना दृश्य था या केवल प्रभावकारी सहायता के रूप में।
- source_word: τοῦ πολέμου
  choice: युद्ध के
  rationale: सम्बन्धकारक को προοδηγόν से जोड़कर ‘युद्ध के अगुआ’ किया गया है; निकटवर्ती सैन्य मुठभेड़ में ‘युद्ध’ उपयुक्त है।
theological_decisions:
- issue: प्रार्थना के संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहूदा परमेश्वर को युद्ध में सहायता के लिए पुकारता है। ‘प्रभु’ इस श्रद्धापूर्ण दैवी संबोधन को बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के सुरक्षित रखता है।
- issue: φανῆναι में दैवी प्रकटीकरण की भाषा
  choice: प्रकट हो
  alternative: अपने को प्रकट करे / सिद्ध हो
  rationale: ‘प्रकट हो’ यूनानी की वास्तविक अभिव्यक्ति को बनाए रखते हुए इस तनाव को खुला छोड़ता है कि हस्तक्षेप दृश्य प्रकटीकरण था या सहायता के कार्य में प्रकट उपस्थिति।
- issue: युद्ध में परमेश्वर की भूमिका के लिए προοδηγός
  choice: युद्ध का अगुआ
  alternative: युद्ध में आगे चलकर मार्ग दिखानेवाला
  rationale: मुख्य पाठ नेतृत्व का संक्षिप्त और स्वाभाविक रूप देता है; पादटिप्पणी मूल शब्द में निहित आगे चलने और मार्ग दिखाने की छवि सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। ‘जब…तब’ की रचना यूनानी के संबंधवाचक कृदंत-समूह को स्वाभाविक हिन्दी में व्यक्त करती है। φανῆναι की पुनरावृत्ति जानबूझकर रखी गई है, और पादटिप्पणी-चिह्न उसी शब्द ‘अगुआ’ पर लगाया गया है जिसकी वैकल्पिक व्याख्या दी गई है।
