  yaml_path: translation/deuterocanon/2_maccabees/012/012.yaml
  text: But Judas[a], recognizing that they were truly useful to them in many ways, agreed to keep peace with them; and after giving right hands, they parted to their tents.
translation:
  language: hi
  text: परन्तु यहूदा ने यह समझकर कि वे सचमुच अनेक बातों में उपयोगी थे, उनके साथ शान्ति बनाए रखने को स्वीकार कर लिया। फिर दाहिने हाथ देकर[a] वे अपने-अपने तम्बुओं की ओर अलग हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दाहिने हाथ देना सहमति या वचनबद्धता प्रकट करने का प्रचलित संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: ὑπολαβών
  choice: यह समझकर
  rationale: यह कृदन्त यहाँ यहूदा के परिस्थिति-विषयक आकलन को व्यक्त करता है; ‘यह समझकर’ आधुनिक हिन्दी में स्वाभाविक है और अनुमान से अधिक विचारपूर्ण निष्कर्ष का भाव देता है।
- source_word: ὡς ἀληθῶς
  choice: सचमुच
  rationale: यह पद यहूदा के आकलन की वास्तविकता पर बल देता है; ‘सचमुच’ उसका संक्षिप्त और सहज हिन्दी रूप है।
- source_word: ἐν πολλοῖς
  choice: अनेक बातों में
  rationale: यूनानी पद व्यापक रूप से अनेक क्षेत्रों या प्रसंगों में उपयोगिता बताता है; यह अनावश्यक रूप से किसी खास प्रयोजन को निर्धारित नहीं करता।
- source_word: χρησίμους
  choice: उपयोगी
  rationale: यह व्यावहारिक लाभ या काम आने का सामान्य अर्थ सुरक्षित रखता है और राजनीतिक या सैनिक उद्देश्य को मूल पाठ से अधिक विशिष्ट नहीं बनाता।
- source_word: ὑπεχώρησεν εἰρήνην ἄξειν πρὸς αὐτούς
  choice: उनके साथ शान्ति बनाए रखने को स्वीकार कर लिया
  rationale: ὑπεχώρησεν में मान लेने या सहमति देने का भाव है, जबकि εἰρήνην ἄξειν निरन्तर शान्तिपूर्ण सम्बन्ध रखने को सूचित करता है।
- source_word: λαβόντες δεξιάς
  choice: एक-दूसरे का दाहिना हाथ पकड़कर
  rationale: यह अनुवाद पारस्परिक संकेत को स्पष्ट करते हुए मूल की ठोस शारीरिक छवि बनाए रखता है; प्रतिज्ञा या कानूनी सन्धि का अधिक विशिष्ट अर्थ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: εἰς τὰς σκηνὰς ἐχωρίσθησαν
  choice: वे अपने-अपने तम्बुओं की ओर अलग हो गए
  rationale: ἐχωρίσθησαν के अलग होने और σκηνάς के तम्बुओं—दोनों को सुरक्षित रखा गया है; ‘अपने-अपने’ दोनों पक्षों के अपनी जगह लौटने का स्वाभाविक हिन्दी संकेत है।
theological_decisions:
- issue: λαβόντες δεξιάς में कूटनीतिक संकेत
  choice: मुख्य पाठ में दाहिना हाथ पकड़ने की ठोस छवि रखना
  alternative: ‘सन्धि करके’ या ‘मैत्री की प्रतिज्ञा करके’
  rationale: यूनानी में संकेत स्पष्ट है, पर उसकी विधिक या वाचा-संबंधी प्रकृति को और विशिष्ट करना आवश्यक नहीं। ठोस छवि पाठ के ऐतिहासिक स्वरूप और अर्थगत खुलापन दोनों को सुरक्षित रखती है।
- issue: χρησίμους के लाभार्थी की अस्पष्टता
  choice: ‘उपयोगी थे’ कहकर लाभार्थी को अनिर्दिष्ट रखना
  alternative: ‘उनके लिए उपयोगी थे’ या ‘अपने लिए उपयोगी थे’
  rationale: यूनानी वाक्य में χρησίμους के साथ कोई स्पष्ट सम्प्रदान कारक लाभार्थी नहीं है। हिन्दी में लाभार्थी जोड़ना मूल की अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। ‘शान्ति’, ‘तम्बुओं’ और ‘दाहिना हाथ’ जैसे स्पष्ट शब्द ऐतिहासिक परिवेश बनाए रखते हैं; सर्वनाम-संबंधी और लाभार्थी-संबंधी बातों को मूल यूनानी से अधिक निश्चित नहीं किया गया।
