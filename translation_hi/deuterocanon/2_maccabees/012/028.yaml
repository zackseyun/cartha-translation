base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/028.yaml
  text: But after calling on the Sovereign[a], who with judgments shatters the forces of the enemies, they took the city under their control[c][b], and struck down twenty-five thousand of those inside.
translation:
  language: hi
  text: परन्तु, उस सामर्थी परमेश्वर[a] को पुकारने के बाद, जो न्याय के कार्यों से[b] शत्रुओं की सेनाओं को चूर-चूर कर देता है, उन्होंने नगर को अपने अधिकार में ले लिया[c] और उसके भीतर के पच्चीस हज़ार लोगों को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सामर्थी अधिपति”; यूनानी में यह परमेश्वर की एक उपाधि है, जो उसके सामर्थ्य और शासनाधिकार पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “न्याय के कार्यों” के लिए यूनानी प्रेषित पाठ में एक असामान्य रूप है; आशय यह है कि परमेश्वर न्यायकारी कार्यों के द्वारा शत्रुओं की सेनाओं को चूर-चूर करता है।
    reason: textual_variant
  - marker: c
    text: या “नगर पर अधिकार कर लिया”; शाब्दिक रूप से, “नगर को अपने हाथ के अधीन कर लिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσάμενοι
  choice: उन्होंने ... को पुकारा
  rationale: अओरिस्ट कृदन्त मुख्य कार्रवाई से पहले परमेश्वर से सहायता की पुकार को सूचित करता है; हिन्दी में यह क्रम स्वाभाविक रूप से दो उपवाक्यों में व्यक्त हुआ है।
- source_word: τὸν δυνάστην
  choice: प्रभुता-सम्पन्न परमेश्वर
  rationale: δυνάστης सामर्थ्य और शासनाधिकार रखने वाले को दर्शाता है तथा यहाँ परमेश्वर की उपाधि है। यह अनुवाद दोनों भावों को स्पष्ट करता है।
- source_word: μετὰ κρίτους
  choice: न्याय के कार्यों द्वारा
  rationale: प्रेषित यूनानी पाठ का κρίτους असामान्य रूप है; प्रसंग में आशय परमेश्वर द्वारा किए गए न्यायपूर्ण दण्ड के कार्यों से है।
- source_word: συντρίβοντα
  choice: चूर-चूर कर देता है
  rationale: वर्तमान कृदन्त परमेश्वर के विशिष्ट कार्य का वर्णन करता है और पूर्ण पराजय का प्रबल बिंब बनाए रखता है।
- source_word: ὀλκάς
  choice: सेनाओं
  rationale: शब्द का रूप और अर्थ यहाँ कठिन है; युद्ध-संदर्भ में इसे शत्रुओं की सैन्य शक्ति या दलों के अर्थ में लेना सबसे संगत है।
- source_word: ἔλαβον τὴν πόλιν ὑποχείριον
  choice: नगर को अपने अधिकार में ले लिया
  rationale: ὑποχείριος का शाब्दिक भाव किसी के हाथ या सत्ता के अधीन होना है; यह वाक्यांश नगर पर अधिकार और अधीनता दोनों व्यक्त करता है।
- source_word: κατέστρωσαν
  choice: मार गिराया
  rationale: सैन्य वर्णन में क्रिया लोगों को धराशायी करके मार डालने का अर्थ देती है; हिन्दी में यह गंभीर और स्वाभाविक है।
- source_word: τῶν ἔνδον
  choice: भीतर के ... लोगों को
  rationale: यह नगर के भीतर उपस्थित लोगों को सूचित करता है; यूनानी में पुरुष-वाचक शब्द स्पष्ट न होने के कारण 'लोगों' उपयुक्त है।
- source_word: εἰς μυριάδας δύο πεντακισχιλίους
  choice: पच्चीस हज़ार
  rationale: संख्यात्मक अभिव्यक्ति का कुल योग 25,000 है, जिसे हिन्दी में सीधे प्रस्तुत किया गया है।
theological_decisions:
- issue: परमेश्वर के लिए उपाधि τὸν δυνάστην
  choice: प्रभुता-सम्पन्न परमेश्वर
  alternative: सामर्थी जन; अधिपति
  rationale: उपाधि में सामर्थ्य और शासनाधिकार दोनों निहित हैं। 'परमेश्वर' जोड़ने से हिन्दी पाठक के लिए संदर्भ स्पष्ट होता है, जबकि कोई विशिष्ट वाचा-संबंधी नाम आरोपित नहीं किया जाता।
- issue: μετὰ κρίτους में दैवी न्याय
  choice: न्याय के कार्यों द्वारा
  alternative: न्याय द्वारा
  rationale: असामान्य प्रेषित रूप को किसी संकीर्ण धर्मशास्त्रीय सिद्धान्त में बाँधे बिना, परमेश्वर के न्यायकारी हस्तक्षेप के रूप में व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। लंबे यूनानी वाक्य को स्पष्ट हिन्दी प्रवाह के लिए दो वाक्यों में बाँटा गया है। असामान्य μετὰ κρίτους का आशय मुख्य पाठ में स्पष्ट किया गया है; ὀλκάς को युद्ध-संदर्भ के अनुसार 'सेनाओं' कहा गया है।
