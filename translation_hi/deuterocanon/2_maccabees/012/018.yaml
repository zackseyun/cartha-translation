  yaml_path: translation/deuterocanon/2_maccabees/012/018.yaml
  text: But they did not catch Timotheus in those places[a], for he had then withdrawn from the places without accomplishing anything, though he had left a garrison in a certain place[b], and a very strong one at that.
translation:
  language: hi
  text: परन्तु वे तीमुथियुस को उन स्थानों में नहीं पकड़ सके[a], क्योंकि वह उस समय कुछ भी हासिल किए बिना उन स्थानों से हट गया था, पर किसी स्थान पर एक बहुत ही सुदृढ़ सैनिक टुकड़ी छोड़ गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तीमुथियुस को उन स्थानों पर अपने अधिकार में नहीं कर सके।” यूनानी क्रिया का अर्थ पकड़ना, जा पहुँचना, या अधिकार में करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “बहुत ही सुदृढ़” का सीधा व्याकरणिक संबंध सैनिक टुकड़ी से है, यद्यपि इसका भाव उस स्थान की मजबूती या किलेबंदी तक भी जा सकता है जहाँ वह टुकड़ी छोड़ी गई थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλαβον
  choice: पकड़ा
  rationale: सैनिक पीछा करने के प्रसंग में यह क्रिया पकड़ लेने, जा पहुँचने या अधिकार में कर लेने का भाव दे सकती है; ‘पकड़ा’ स्वाभाविक है और अर्थ की व्यापकता पर्याप्त रूप से बनाए रखता है।
- source_word: ἐπὶ τῶν τόπων
  choice: उन स्थानों में
  rationale: बहुवचन स्थानीय संकेत को बनाए रखता है और पूर्ववर्ती प्रसंग के स्थानों की ओर संकेत करता है।
- source_word: ἄπρακτον
  choice: कुछ भी किए बिना
  rationale: यह तीमुथियुस के निष्फल या बिना कुछ साधे लौटने का भाव व्यक्त करता है, बिना किसी अतिरिक्त उद्देश्य को मान लेने के।
- source_word: ἐκλελυκότα
  choice: निकल गया था
  rationale: यहाँ रूप का आशय उस क्षेत्र से चले जाने या हट जाने का है; ‘निकल गया था’ सहज आधुनिक हिन्दी है और सैन्य वापसी को अति-विशिष्ट नहीं बनाता।
- source_word: καταλελοιπότα
  choice: छोड़ गया था
  rationale: कृदन्त बताता है कि स्वयं जाते समय वह एक सैन्य दल पीछे छोड़ गया था।
- source_word: φρουράν
  choice: सैनिक चौकी
  rationale: φρουρά पहरेदार सैन्य दल अथवा गैरीसन को सूचित करता है; ‘सैनिक चौकी’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और दल तथा उसके ठिकाने, दोनों की निकटता को बनाए रखता है।
- source_word: ἐν τινι τόπῳ
  choice: किसी स्थान पर
  rationale: मूल का अनिश्चित संकेत सुरक्षित रहता है।
- source_word: μάλιστα ὀχυράν
  choice: बहुत ही मजबूत
  rationale: विशेषण व्याकरणतः स्त्रीलिंग φρουράν को विशेषित करता है; फिर भी प्रसंग में चौकी के सुदृढ़ या किलेबंद होने का भाव भी हो सकता है।
