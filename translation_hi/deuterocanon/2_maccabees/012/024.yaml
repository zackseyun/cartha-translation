translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘के हाथ पड़ गया’, ‘सकुशल छोड़ दें’ और ‘कब्ज़े में’ सामान्य पाठक के लिए स्पष्ट हैं। यूनानी के संक्षिप्त अंतिम उपवाक्य को शर्त-परिणाम रूप में व्यक्त किया गया है, और उसकी अंतर्निहित अस्पष्टता की सूचना पादटिप्पणी में दी गई है।
