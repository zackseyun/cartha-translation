base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/024.yaml
  text: But Timothy himself[a], having fallen into the hands of those with Dositheus and Sosipater, begged with much cunning to be let go unharmed, because he had the parents of many of them, and of others their brothers[b], and it would happen that these would be disregarded.
translation:
  language: hi
  text: परन्तु तीमुथियुस स्वयं दोसिथियुस और सोसिपात्रोस के लोगों के हाथ पड़ गया। उसने बहुत चालाकी से[a] विनती की कि वे उसे सकुशल छोड़ दें, क्योंकि उनमें से बहुतों के माता-पिता और कुछ के भाई उसके कब्ज़े में थे; और ऐसा होगा कि उन लोगों को नज़रअंदाज़ किया जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बहुत छल-कपट से।’ यूनानी शब्द γοητία यहाँ संभवतः वास्तविक जादू-टोने के बजाय कपटपूर्ण या चालाक मनुहार को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्य संक्षिप्त है। आशय यह है कि तीमुथियुस ने उनके अनेक माता-पिताओं और कुछ भाइयों को अपने वश में रखा था; इसलिए उसके मारे जाने या उसके साथ बुरा होने पर उन परिजनों को उपेक्षित किया जाएगा।
    reason: cultural_note
lexical_decisions:
- source_word: ἐμπεσὼν
  choice: के हाथ पड़ गया
  rationale: यह पदबंध शाब्दिक ‘उनके बीच पड़ने’ से आगे संदर्भ में उनके वश में आ जाने या पकड़े जाने का भाव देता है; हिंदी मुहावरा इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς περὶ τὸν Δωσίθεον καὶ Σωσίπατρον
  choice: दोसिथियुस और सोसिपात्रोस के लोगों
  rationale: οἱ περὶ + कर्मकारक नेताओं और उनके साथियों के समूह को सूचित करता है; यह रूप समूहगत अर्थ को स्पष्ट रखता है।
- source_word: ἠξίου
  choice: विनती की
  rationale: बंदी अवस्था में सकुशल छोड़े जाने का आग्रह साधारण अनुरोध से अधिक दीन और तात्कालिक है; ‘विनती की’ उपयुक्त किंतु अतिनाटकीय नहीं है।
- source_word: μετὰ πολλῆς γοητίας
  choice: बड़ी धूर्तता से
  rationale: γοητία छलपूर्ण कौशल या कपटपूर्ण मनुहार का बोध करा सकता है। यहाँ वास्तविक जादू-टोना संदर्भानुकूल नहीं; ‘धूर्तता’ उसकी चालाक और स्वार्थपूर्ण याचना व्यक्त करती है।
- source_word: ἐξαφεῖναι ὡς σῷον αὐτόν
  choice: उसे सकुशल छोड़ दें
  rationale: ἐξαφεῖναι रिहा करने और σῷον सुरक्षित अथवा अक्षत रहने का भाव देता है; संयुक्त हिंदी पदबंध दोनों को सहजता से व्यक्त करता है।
- source_word: διὰ τὸ πλειόνων μὲν γονεῖς, ὧν δὲ ἀδελφοὺς ἔχειν
  choice: क्योंकि उनमें से बहुतों के माता-पिता और कुछ के भाई उसके कब्ज़े में थे
  rationale: ἔχειν का अर्थ यहाँ केवल ‘पास होना’ नहीं, बल्कि संबंधित परिजनों को अपने नियंत्रण में रखना है। ‘कब्ज़े में’ उस निहित बंधक-सदृश स्थिति को स्पष्ट करता है, जबकि यूनानी की दो समांतर श्रेणियाँ बनी रहती हैं।
- source_word: ἀλογηθῆναι
  choice: परवाह नहीं की जाती
  rationale: क्रिया का अर्थ किसी को महत्त्व न देना, उसका लिहाज़ न करना या उसे नगण्य मानना है। संदर्भ में यह धमकी है कि तिमुथियुस को हानि पहुँचने पर उसके नियंत्रण में पड़े परिजनों की सुरक्षा का भी लिहाज़ नहीं रखा जाएगा।
- source_word: συμβήσεται
  choice: तो ... की जाती
  rationale: यूनानी भविष्य में होने वाले परिणाम को रखता है। हिंदी में शर्त-परिणाम संरचना उस आशय को स्वाभाविक बनाती है, यद्यपि कालगत संबंध को प्रसंगानुसार भूतकालीन कथन के भीतर रखा गया है।
