  yaml_path: translation/deuterocanon/2_maccabees/012/039.yaml
  text: On the following day[a], the men with Judas came, when the need had arisen, to gather up the bodies of those who had fallen and to restore them with their relatives to the tombs of their fathers.
translation:
  language: hi
  text: अगले दिन, जब ऐसा करना आवश्यक हो गया था, यहूदा के साथ के लोग गिर पड़े लोगों के शवों को उठाने और उन्हें उनके संबंधियों के साथ उनकी पैतृक कब्रों[a] में वापस पहुँचाने के लिए आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पैतृक कब्रों’ का अनुवाद ‘पुरखों की कब्रों’ भी किया जा सकता है। यूनानी पाठ में ‘संबंधियों’ और ‘पैतृक कब्रों’ दोनों का स्पष्ट उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐχομένῃ
  choice: अगले दिन
  rationale: यह यूनानी कालवाचक अभिव्यक्ति का सहज और सटीक आधुनिक हिन्दी रूप है।
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: यहूदा के साथ के लोग
  rationale: यह वाक्यांश यहूदा के दल या साथियों को दर्शाता है; मूल में स्पष्ट न होने के कारण ‘सैनिक’ जैसा अधिक विशिष्ट शब्द नहीं जोड़ा गया।
- source_word: καθʼ ὃν χρόνον τὸ τῆς χρείας ἐγέγονει
  choice: जब इसकी आवश्यकता आ पड़ी
  rationale: यह परिस्थितियों के कारण उस समय कार्य आवश्यक हो जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ σώματα τῶν προπεπτωκότων
  choice: उन लोगों के शव ... जो गिर पड़े थे
  rationale: ‘गिर पड़े थे’ मूल क्रिया की छवि और युद्ध में मारे जाने के संदर्भ—दोनों को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ἀνακομίσασθαι
  choice: शव उठा लाए
  rationale: संदर्भ में शवों को घटनास्थल से एकत्र करके वापस ले जाने का भाव है; ‘उठा लाए’ दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: ἀποκαταστῆσαι
  choice: फिर रख दें
  rationale: क्रिया किसी वस्तु को उसके उचित या पूर्व स्थान पर वापस पहुँचाने का भाव देती है; दफ़न के संदर्भ में यह हिन्दी में स्वाभाविक है।
- source_word: μετὰ τῶν συγγενῶν
  choice: उनके संबंधियों के साथ
  rationale: यह मूल के संबंधसूचक पद को स्पष्ट रूप से बनाए रखता है और यह अनावश्यक रूप से तय नहीं करता कि वे ठीक किस स्थानिक विन्यास में रखे गए।
- source_word: εἰς τοὺς πατρῴους τάφους
  choice: उनकी पैतृक कब्रों में
  rationale: ‘पैतृक’ वंशपरंपरा और पुरखों से संबंधित होने का भाव रखता है; ‘कब्रों में’ गंतव्य को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: संबंधियों और पैतृक कब्रों का संयुक्त उल्लेख
  choice: उन्हें उनके संबंधियों के साथ उनकी पैतृक कब्रों में फिर रख दें
  alternative: उन्हें उनकी पुश्तैनी कब्रों में लौटा दें
  rationale: यूनानी पाठ संबंधियों और पैतृक कब्रों—दोनों का अलग-अलग स्पष्ट उल्लेख करता है। चुना हुआ रूप किसी एक तत्व को दूसरे में समाहित किए बिना दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। वाक्य को पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है, जबकि मूल के उद्देश्यसूचक संबंध को ‘ताकि’ से सुरक्षित रखा गया है।
