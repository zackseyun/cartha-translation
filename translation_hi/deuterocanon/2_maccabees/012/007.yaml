  verdict: revise
  source_fidelity: The draft accurately conveys the passive closing-off of the place, Judas's withdrawal, his purpose to return, and the severe corporate scope of ἐκριζῶσαι τὸ σύμπαν ... πολίτευμα. However, “वहाँ से लौट गया” can mean that he returned to that place, conflicting with πάλιν ἥξων (“intending to come again”). “चला गया” preserves the sense of departure/withdrawal without introducing that conflict.
  naturalness: The Hindi is generally clear and appropriately formal. “जब उस स्थान को बंद कर दिया गया” is more idiomatic than “जब वह स्थान घेरकर बन्द कर दिया गया,” while retaining the source's unspecified passive sense. The purpose clause is smoother as “फिर आने के इरादे से.”
  terminology: “नागरिक समुदाय” suitably preserves the corporate civic-political force of πολίτευμα, and “जड़ से मिटा दे” effectively retains the uprooting metaphor and severity of ἐκριζόω. “समूचे” clearly represents τὸ σύμπαν. The footnote is retained and anchored directly to the phrase it explains.
  issues:
  - severity: medium
    issue: “वहाँ से लौट गया” for ἀνέλυσεν
    rationale: In modern Hindi, “लौट गया” normally implies returning, whereas the Greek means departed or withdrew. Since the following phrase explicitly says he intended to come again, “चला गया” avoids a misleading anticipatory return.
  - severity: low
    issue: “घेरकर” adds a specific manner to συγκλεισθέντος
    rationale: The Greek indicates that the place had been enclosed/shut up but does not specify how. “बंद कर दिया गया” preserves the passive and leaves the mechanism unstated.
