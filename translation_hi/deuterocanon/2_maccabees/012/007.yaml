  yaml_path: translation/deuterocanon/2_maccabees/012/007.yaml
  text: But when the place had been closed up[a], he withdrew, intending to come again and root out the entire citizen body of the people of Joppa.
translation:
  language: hi
  text: परन्तु जब उस स्थान को बंद कर दिया गया, तब वह चला गया। वह फिर आने के इरादे से याफा के लोगों के समूचे नागरिक समुदाय[a] को जड़ से मिटा देना चाहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘याफा के लोगों के समूचे नागरिक निकाय’ या ‘याफा के पूरे राजनीतिक समुदाय’ भी हो सकता है। यूनानी शब्द संगठित नागरिक समुदाय, नागरिक निकाय या राज्य-समुदाय का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... χωρίου
  choice: वह स्थान
  rationale: χωρίον स्थान, क्षेत्र या स्थानीय भूभाग का बोध करा सकता है। प्रसंग में ‘स्थान’ तटस्थ है और उसे अनावश्यक रूप से दुर्ग या जिले के रूप में निश्चित नहीं करता।
- source_word: συγκλεισθέντος
  choice: घेरकर बन्द कर दिया गया
  rationale: संबंधित निष्क्रिय कृदन्त किसी स्थान को चारों ओर से बन्द या घेर दिए जाने का भाव रखता है। यह हिन्दी सैन्य प्रसंग का संकेत देती है, पर किसी विशेष घेराबन्दी-प्रक्रिया को तय नहीं करती।
- source_word: ἀνέλυσεν
  choice: वह वहाँ से लौट गया
  rationale: ἀναλύω यहाँ प्रस्थान करने या पड़ाव उठाकर चले जाने के अर्थ में है। ‘वहाँ से लौट गया’ वर्तमान अभियान से हटने और बाद में वापस आने के आशय के साथ स्वाभाविक बैठता है।
- source_word: πάλιν ἥξων
  choice: उसका इरादा था कि वह फिर आए
  rationale: भविष्यकालिक कृदन्त उद्देश्य या इरादा व्यक्त करता है; हिन्दी में इसे स्पष्ट व स्वाभाविक वाक्य के रूप में रखा गया है।
- source_word: τὸ σύμπαν ... πολίτευμα
  choice: पूरा नागरिक समुदाय
  rationale: πολίτευμα संगठित नागरिक निकाय, राजनीतिक समुदाय या राष्ट्रमंडल को सूचित करता है, और σύμπαν उसकी समग्रता पर बल देता है। ‘पूरा नागरिक समुदाय’ न तो इसे केवल शासन-तंत्र तक सीमित करता है, न सीधे प्रत्येक निवासी के अर्थ में समतल करता है।
- source_word: τῶν Ἰοππιτῶν
  choice: याफा के लोगों का
  rationale: Ἰοππῖται याफा के निवासियों या नागरिकों को दर्शाता है। ‘याफा के लोग’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ἐκριζῶσαι
  choice: जड़ से मिटा दे
  rationale: ἐκριζόω का मूल बिम्ब उखाड़ फेंकने का है और लाक्षणिक अर्थ पूर्णतः हटा देने का। ‘जड़ से मिटा दे’ उस बिम्ब और कठोरता दोनों को बनाए रखता है।
theological_decisions:
- issue: याफा के विरुद्ध यहूदा की इच्छित कार्रवाई की कठोरता और सीमा
  choice: ‘याफा के लोगों के पूरे नागरिक समुदाय को जड़ से मिटा दे’—कार्रवाई को एक समग्र नागरिक-राजनीतिक समुदाय के विरुद्ध बताया गया है।
  alternative: ‘याफा के सभी निवासियों को नष्ट कर दे’ अथवा ‘याफा की पूरी सरकार को उखाड़ फेंके’।
  rationale: यूनानी का केंद्र πολίτευμα है, जो नागरिक-राजनीतिक सामूहिकता को दर्शाता है। इसलिए अनुवाद न तो इसे केवल सरकारी संस्थाओं तक सीमित करता है, न निश्चित रूप से हर व्यक्ति की हत्या के कथन में बदलता है; साथ ही कथित इरादे की कठोरता को नरम भी नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली रखी गई है। ‘नागरिक समुदाय’ अपेक्षाकृत औपचारिक है, पर πολίτευμα की सामूहिक और राजनीतिक अर्थ-छाया बचाने के लिए आवश्यक है। पद को दो वाक्यों में बाँटकर भविष्यकालिक कृदन्त का उद्देश्य सहज हिन्दी में व्यक्त किया गया है।
