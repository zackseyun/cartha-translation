  text: But when he had assured them at length that he would restore these men unharmed[b][a], they released him for the safety of their brothers.
translation:
  language: hi
  text: पर जब उसने विस्तार से उन्हें यह दृढ़ आश्वासन दिया[a] कि वह इन लोगों को सकुशल लौटा देगा, तो उन्होंने अपने भाइयों की सुरक्षा[b] के लिए उसे छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बहुत-से शब्दों के द्वारा”; अर्थात उसने विस्तार से आश्वासन दिया।
    reason: lexical_alternative
  - marker: b
    text: या “अपने भाइयों के बचाव के लिए।” यहाँ प्रयुक्त यूनानी शब्द का अर्थ “उद्धार” भी हो सकता है, पर इस प्रसंग में मुख्य भाव शारीरिक सुरक्षा का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστώσαντος
  choice: पक्का विश्वास दिलाया
  rationale: यहाँ अओरिस्ट कृदंत किसी बात को विश्वसनीय ठहराने या दृढ़ आश्वासन देने का भाव रखता है। आधुनिक हिन्दी में यह प्रयोग प्रसंग के अनुरूप और स्वाभाविक है।
- source_word: διὰ πλειόνων
  choice: बहुत कुछ कहकर
  rationale: यूनानी मुहावरे का शाब्दिक भाव ‘बहुत-से शब्दों के द्वारा’ है; चुना हुआ रूप विस्तृत आश्वासन का अर्थ सहज हिन्दी में देता है।
- source_word: τὸν ὁρισμὸν ἀποκαταστῆσαι
  choice: कि वह ... लौटा देगा
  rationale: ὁρισμός किसी निश्चित व्यवस्था, निश्चय या ठहराई हुई बात को सूचित कर सकता है। हिन्दी में आश्वासन की विषय-वस्तु के रूप में इसे व्यक्त करने से मूल वाक्य का अभिप्राय स्पष्ट रहता है और अनावश्यक कृत्रिमता से बचता है।
- source_word: τούτους ἀπημάντους
  choice: इन लोगों को सकुशल
  rationale: ἀπήμαντος का अर्थ हानि या चोट से सुरक्षित है। ‘सकुशल’ व्यक्ति-संदर्भ में संक्षिप्त, स्वाभाविक और अर्थ-सटीक है।
- source_word: ἀπέλυσαν αὐτόν
  choice: उन्होंने ... उसे छोड़ दिया
  rationale: ἀπολύω यहाँ हिरासत या नियंत्रण से जाने देने को दर्शाता है। ‘छोड़ दिया’ सामान्य आधुनिक हिन्दी में सीधा और स्पष्ट है।
- source_word: ἕνεκα τῆς τῶν ἀδελφῶν σωτηρίας
  choice: अपने भाइयों की सुरक्षा के लिए
  rationale: सैन्य और बंधक-सदृश प्रसंग में σωτηρία मुख्यतः शारीरिक बचाव और कुशलता को सूचित करता है; ‘अपने भाइयों’ से सम्बन्धसूचक भाव स्पष्ट होता है।
theological_decisions:
- issue: सैन्य-वृत्तांत में σωτηρία का अनुवाद
  choice: सुरक्षा
  alternative: उद्धार / बचाव
  rationale: तात्कालिक प्रसंग संकट में पड़े भाइयों की शारीरिक कुशलता का है, न कि अनिवार्य रूप से पारलौकिक उद्धार का। पादटिप्पणी व्यापक अर्थ-सीमा को खुला रखती है।
- issue: ἀδελφῶν का सम्बन्धसूचक अर्थ
  choice: अपने भाइयों
  alternative: भाइयों / अपने जाति-भाइयों
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है और प्रसंग में निकट सम्बन्धियों अथवा साथी यहूदियों की ओर संकेत करता है। ‘भाइयों’ मूल की लिंग-सटीकता बनाए रखता है, जबकि ‘अपने’ हिन्दी में सम्बन्ध स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सकुशल लौटा देगा’ बंधकों या संकट में पड़े व्यक्तियों को बिना हानि वापस करने का भाव संक्षेप में देता है। मूल की अर्थगत व्यापकता को [b] में सुरक्षित रखा गया है।
