  text: But Judas pressed the pursuit more vigorously[a], and, striking down the wretches, he destroyed as many as three thousand men.
translation:
  language: hi
  text: परन्तु यहूदा ने पीछा और अधिक तीव्रता से जारी रखा और उन दुष्टों पर प्रहार करते हुए तीस हज़ार[a] तक पुरुषों को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में शाब्दिक अर्थ ‘तीन मिरियड पुरुष’, अर्थात तीस हज़ार पुरुष, है। प्रसंग में यह संख्या कठिन जान पड़ती है; इसलिए बहुत-से अनुवाद यहाँ इसे तीन हज़ार समझते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίει ... τὸν διωγμόν
  choice: पीछा ... किया
  rationale: यूनानी मुहावरे को स्वाभाविक हिन्दी क्रिया-रचना में व्यक्त किया गया है; इससे युद्ध में लगातार पीछा करने का भाव बना रहता है।
- source_word: εὐτονώτερον
  choice: और भी अधिक जोश से
  rationale: तुलनात्मक क्रिया-विशेषण बढ़ी हुई शक्ति, तीव्रता और तत्परता व्यक्त करता है।
- source_word: συνετίνων
  choice: प्रहार करते हुए
  rationale: युद्ध-संदर्भ में यह लगातार हिंसक आक्रमण का बोध देता है। यह अनुवाद किसी विशेष हथियार या प्रहार के ढंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τοὺς ἀλιτηρίους
  choice: उन दुष्टों
  rationale: यह मूल शब्द की तीखी नैतिक निन्दा को सहज आधुनिक हिन्दी में बनाए रखता है; ‘अपराधियों’ जैसा कानूनी अर्थ नहीं जोड़ता।
- source_word: διέφθειρεν
  choice: संहार कर डाला
  rationale: सैन्य प्रसंग में क्रिया मार डालने अथवा नष्ट करने को व्यक्त करती है; ‘संहार’ बड़ी संख्या में युद्ध-वध के लिए स्वाभाविक है।
- source_word: εἰς μυριάδας τρεῖς ἀνδρῶν
  choice: तीस हज़ार तक पुरुषों
  rationale: प्राप्त यूनानी पाठ में शाब्दिक रूप से ‘तीन मिरियड’, अर्थात तीस हज़ार, है। संदर्भगत कठिनाई के बावजूद मुख्य पाठ स्रोत की प्रमाणित संख्या रखता है और प्रचलित वैकल्पिक समझ को पाद-टिप्पणी में देता है।
