lexical_decisions:
- source_word: ἀπομαρτυρησάντων
  choice: गवाही दी
  rationale: यह क्रिया स्थानीय यहूदियों द्वारा किसी बात की पुष्टि या साक्ष्य देने को व्यक्त करती है; ‘गवाही दी’ इसके साक्ष्यात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῶν ἐκεῖ καθεστώτων Ἰουδαίων
  choice: वहाँ बसे यहूदियों
  rationale: καθεστώτων यहाँ उस स्थान पर स्थापित होकर रहने वाले लोगों को सूचित करता है; ‘वहाँ बसे’ संक्षिप्त और सहज है।
- source_word: οἱ Σκυθοπολεῖται
  choice: स्कूतोपोलिस के लोग
  rationale: जातिवाचक शब्द नगर के निवासियों को सूचित करता है; अपरिचित हिन्दी जातिनाम गढ़ने की अपेक्षा नगर का नाम स्पष्ट रखना अधिक बोधगम्य है।
- source_word: εὔνοιαν
  choice: सद्भाव
  rationale: यह शब्द अनुकूल और हितैषी मनोभाव को व्यक्त करता है; ‘सद्भाव’ केवल किसी एक कृपालु काम के बजाय उस स्थायी अनुकूलता को बनाए रखता है।
- source_word: ἐν τοῖς τῆς ἀτυχίας καιροῖς
  choice: विपत्ति के समय
  rationale: ἀτυχία दुर्भाग्य या प्रतिकूल परिस्थिति का बोध देता है; ‘विपत्ति’ प्रसंगानुकूल है और अनावश्यक रूप से किसी विशेष आपदा को निर्धारित नहीं करता।
- source_word: ἥμερον ἀπάντησιν
  choice: उनके साथ नरमी से पेश आए थे
  rationale: ἥμερος का भाव नम्रता या कोमलता है और ἀπάντησις शाब्दिक रूप से भेंट या सामना है; प्रसंग में यह उनके साथ हुए व्यवहार को सूचित करता है। इस अनुवाद से अर्थ स्वाभाविक रहता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
