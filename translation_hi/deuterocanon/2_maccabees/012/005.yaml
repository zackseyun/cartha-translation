lexical_decisions:
- source_word: μεταλαβών
  choice: पता चला
  rationale: यहाँ कृदंत का अर्थ किसी घटना की जानकारी प्राप्त करना है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: ὁμοεθνεῖς
  choice: अपने ही लोगों
  rationale: शाब्दिक अर्थ समान जाति/राष्ट्र के लोग है; प्रसंग में यहूदा के स्वजातीय लोगों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὠμότητα
  choice: क्रूरता
  rationale: यूनानी शब्द कठोर और अमानवीय व्यवहार को दर्शाता है; ‘क्रूरता’ इसका सीधा और गरिमापूर्ण समतुल्य है।
- source_word: παραγγείλας
  choice: आदेश दिया
  rationale: यह सैन्य प्रसंग में निर्देश या आदेश देने को व्यक्त करता है।
- source_word: τοῖς περὶ αὐτὸν ἀνδράσιν
  choice: अपने साथ के पुरुषों को
  rationale: वाक्यांश यहूदा के आसपास/साथ उपस्थित पुरुषों को सूचित करता है; अनुवाद मूल की पुरुष-संज्ञा को बनाए रखता है।
