- source_word: τοὺς ἐν Ἰαμνίᾳ
  choice: यामनिया के उन लोगों को
  rationale: संज्ञीकृत पूर्वसर्गीय वाक्यांश यामनिया में स्थित संबंधित लोगों को व्यापक रूप से दर्शाता है; यूनानी की तरह उनकी पहचान को और संकीर्ण नहीं किया गया।
- source_word: τὸν αὐτὸν ... τρόπον
  choice: वैसा ही
  rationale: शाब्दिक अर्थ ‘उसी रीति/ढंग से’ है। हिन्दी में ‘वैसा ही करना’ स्वाभाविक है और पूर्ववर्ती संदर्भ में निहित समान कार्रवाई को दर्शाता है।
- source_word: ἐπιτελεῖν
  choice: करने
  rationale: क्रिया का अर्थ किसी काम को पूरा करना या कार्यान्वित करना है। ‘करना’ यहाँ βουλομένους के साथ स्वाभाविक हिन्दी देता है और संदर्भ से कार्रवाई का भाव स्पष्ट रहता है।
- source_word: βουλομένους
  choice: इरादा रखते थे
  rationale: यह कृदंत इच्छा या अभिप्राय व्यक्त करता है। ‘इरादा रखते थे’ समकालिक अभिप्राय को सहज आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  choice: वहाँ रहने वाले यहूदियों के साथ
  rationale: यूनानी में दत्तिव संबंध संक्षिप्त और संदर्भाधीन है। ‘के साथ’ उस व्याकरणिक खुलेपन को ‘के विरुद्ध’ की अपेक्षा अधिक सुरक्षित रखता है, जबकि पूर्ववर्ती संदर्भ कार्रवाई की शत्रुतापूर्ण प्रकृति बताता है।
