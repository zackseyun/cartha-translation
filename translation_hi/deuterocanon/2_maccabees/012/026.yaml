- source_word: μυριάδας σωμάτων δύο πεντακισχιλίους
  choice: पच्चीस हज़ार लोगों
  rationale: संख्या-समूह का योग 25,000 है। σωμάτων का शाब्दिक अर्थ ‘शरीरों’ है, पर यहाँ वह मारे गए व्यक्तियों की गिनती के रूप में प्रयुक्त है; असामान्य शाब्दिक बनावट पादटिप्पणी में सुरक्षित रखी गई है।
