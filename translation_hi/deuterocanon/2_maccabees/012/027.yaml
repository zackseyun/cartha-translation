- source_word: πόλιν ὀχυράν
  choice: किलेबंद नगर
  rationale: विशेषण नगर की मजबूत रक्षात्मक व्यवस्था बताता है; ‘किलेबंद’ इस अर्थ को सीधे व्यक्त करता है।
- source_word: πάμφυλα πλήθη
  choice: हर जाति के लोगों की मिली-जुली भीड़
  rationale: πάμφυλα अनेक जातियों या समुदायों से बने मिश्रित जनसमूह का संकेत देता है; यह अनुवाद उसकी सामूहिक और बहुजातीय प्रकृति दोनों बनाए रखता है।
- source_word: νεανίαι ... ῥωμαλέοι
  choice: बलवान जवान
  rationale: νεανίαι युवा पुरुषों और ῥωμαλέοι उनकी शारीरिक सामर्थ्य को बताता है; यह सहज आधुनिक हिन्दी है।
- source_word: πρὸ τῶν τειχῶν καθεστῶτες
  choice: नगर की दीवारों के सामने मोर्चा सँभाले हुए
