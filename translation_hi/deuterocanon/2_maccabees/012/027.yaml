  yaml_path: translation/deuterocanon/2_maccabees/012/027.yaml
  text: But after the rout and destruction of these men[a], he marched also against Ephron, a fortified city, in which there were mixed multitudes; and strong young men, stationed before the walls, were fighting vigorously[b], while there were many stores of engines and missiles there.
translation:
  language: hi
  text: इन लोगों को खदेड़कर नष्ट कर देने के बाद, उसने किलेबंद नगर एप्रोन पर भी चढ़ाई की। उसमें विभिन्न जातियों के मिले-जुले लोग थे[a]। बलवान युवा पुरुष नगर की दीवारों के सामने मोर्चा सँभाले हुए डटकर लड़ रहे थे, और वहाँ युद्ध-यंत्रों तथा प्रक्षेपास्त्रों के बहुत-से भंडार थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसमें विभिन्न जातियों के लोगों की भीड़ थी।’ यूनानी पद विभिन्न जातियों या समुदायों से बने मिश्रित जनसमूह का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वहाँ युद्ध-यंत्रों और प्रक्षेपास्त्रों के बहुत-से जमाव या व्यवस्थाएँ थीं।’ यहाँ अनूदित शब्द संचित सैन्य-सामग्री या उसके लगाए/रखे जाने की व्यवस्था, दोनों का संकेत दे सकता है।
    reason: lexical_alternative
