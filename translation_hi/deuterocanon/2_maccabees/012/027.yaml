- source_word: εὐρώστως ἀπεμάχοντο
  choice: डटकर लड़ रहे थे
  rationale: अपूर्णकाल निरंतर प्रतिरोध और εὐρώστως उसकी दृढ़ता दर्शाता है; ‘डटकर लड़ रहे थे’ दोनों पहलुओं को संक्षेप में समेटता है।
- source_word: ὀργάνων
  choice: युद्ध-यंत्रों
  rationale: βελῶν के साथ सैन्य प्रसंग में यह युद्ध में प्रयुक्त यंत्रों को सूचित करता है; ‘युद्ध-यंत्र’ केवल सामान्य मशीनों की अपेक्षा अधिक स्पष्ट है, पर इसे केवल घेराबंदी के यंत्रों तक सीमित नहीं करता।
- source_word: βελῶν
  choice: प्रक्षेपास्त्रों
  rationale: यह चलाए, फेंके या दागे जाने वाले हथियारों का व्यापक शब्द है; ‘प्रक्षेपास्त्र’ उस व्यापकता को बनाए रखता है।
- source_word: παραθέσεις
  choice: भंडार
  rationale: यहाँ युद्ध-यंत्रों और प्रक्षेपास्त्रों के संचित रखे होने का भाव प्रसंगानुकूल है; मूल शब्द में व्यवस्था या जमाव का संभावित अर्थ होने के कारण विकल्प पादटिप्पणी में दिया गया है।
