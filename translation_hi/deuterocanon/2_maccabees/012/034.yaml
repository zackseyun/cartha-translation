lexical_decisions:
- source_word: παραταξαμένους
  choice: जब वे युद्ध में भिड़ गए
  rationale: यह παρατάσσω का एओरिस्ट मिडिल कृदन्त है, जो सैनिक प्रसंग में युद्ध के लिए पाँत बाँधने अथवा युद्ध में आमने-सामने उतरने का अर्थ दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘युद्ध में भिड़ गए’ रखा गया है, जबकि सैन्य-विन्यास की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: συνέβη
  choice: तो ऐसा हुआ
  rationale: यूनानी की निर्वैयक्तिक घटना-सूचक रचना को आधुनिक और सहज हिन्दी में रखते हुए उसके कथात्मक स्वर को बनाए रखा गया है।
- source_word: πεσεῖν
  choice: गिर पड़े
  rationale: πίπτω का मूल अर्थ ‘गिरना’ है। युद्ध के प्रसंग में इससे मृत्यु का संकेत मिल सकता है, पर मूल पाठ स्पष्ट रूप से ‘मारे गए’ नहीं कहता; इसलिए उसी अर्थगत तनाव को सुरक्षित रखा गया है।
- source_word: ὀλίγους
  choice: कुछ
  rationale: यहाँ विशेषण संज्ञा के रूप में प्रयुक्त है और थोड़ी संख्या दर्शाता है। ‘कुछ’ सहज हिन्दी है तथा संख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों में से
  rationale: ὀλίγους के साथ आए संबंधकारक का स्वाभाविक हिन्दी रूप ‘यहूदियों में से’ है। इस पुस्तक के ऐतिहासिक-धार्मिक संदर्भ में ‘यहूदी’ मानक और स्पष्ट पद है।
