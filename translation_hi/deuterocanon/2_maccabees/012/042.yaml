  text: they turned to supplication[a], asking that the sin that had been committed might be completely blotted out. But the noble Judas urged the multitude to keep themselves free from sin, since they had seen before their eyes the things that had happened because of the sin of those who had fallen.
translation:
  language: hi
  text: तब वे विनती करने लगे कि जो पाप किया गया था, वह पूरी तरह मिटा दिया जाए। परन्तु वीर यहूदा ने लोगों से आग्रह किया कि वे स्वयं को पाप से दूर रखें[a], क्योंकि उन्होंने अपनी आँखों के सामने देखा था कि गिरे हुए लोगों के पाप के कारण क्या हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “वे अपने आपको निष्पाप बनाए रखें” या “पापरहित बने रहें।”'
    reason: ἀναμαρτήτους का अधिक शाब्दिक अर्थ दिखाने और मुख्य पाठ के मुहावरेदार अनुवाद को पारदर्शी बनाने के लिए।
lexical_decisions:
- source_word: εἰς ἱκεσίαν ἐτράπησαν
  choice: वे विनती करने लगे
  rationale: यह यूनानी मुहावरा गंभीर और याचक भाव से प्रार्थना की ओर मुड़ने को व्यक्त करता है। ‘विनती करने लगे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका प्रार्थनापूर्ण भाव बनाए रखता है।
- source_word: ἀξιώσαντες
  choice: प्रार्थना की
  rationale: यह कृदन्त उनकी विनती की विषय-वस्तु प्रस्तुत करता है। यहाँ ‘प्रार्थना की कि’ धार्मिक संदर्भ और निवेदन, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ γεγονὸς ἁμάρτημα
  choice: जो पाप किया गया था
  rationale: γεγονός पाप को घटित हो चुके कार्य के रूप में दिखाता है। हिन्दी में कर्मवाच्य विस्तार उसके पूर्ण हो चुके होने को स्पष्ट करता है।
- source_word: τελείως ἐξαλειφθῆναι
  choice: पूरी तरह मिटा दिया जाए
  rationale: τελείως की पूर्णता और ἐξαλείφω के मिटा देने के अर्थ, दोनों सीधे और स्वाभाविक रूप में सुरक्षित हैं।
- source_word: ὁ δὲ γενναῖος Ἰούδας
  choice: परन्तु वीर यहूदा
  rationale: γενναῖος में कुलीनता और वीरता दोनों की छाया हो सकती है; युद्ध-कथा के इस प्रसंग में ‘वीर’ सम्मानसूचक और स्वाभाविक है।
- source_word: παρεκάλεσε τὸ πλῆθος
  choice: लोगों से आग्रह किया
  rationale: παρακαλέω यहाँ सांत्वना नहीं बल्कि नैतिक प्रोत्साहन अथवा आग्रह व्यक्त करता है। τὸ πλῆθος के लिए ‘लोग’ सामान्य हिन्दी में ‘भीड़’ की अपेक्षा अधिक गरिमापूर्ण है।
- source_word: συντηρεῖν αὐτοὺς ἀναμαρτήτους εἶναι
  choice: वे अपने आपको पाप से बचाए रखें
  rationale: यूनानी रचना संक्षिप्त है और स्वयं को पापरहित दशा में बनाए रखने का आग्रह करती है। यह हिन्दी प्रयोग नैतिक सावधानी को स्पष्ट करता है, जबकि शब्दशः विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ὑπʼ ὄψιν ἑωρακότας
  choice: उन्होंने अपनी आँखों के सामने देख लिया था
  rationale: यह प्रत्यक्ष और दृश्य अनुभव पर बल देने वाले यूनानी मुहावरे की सजीवता बनाए रखता है।
- source_word: τὰ γεγονότα
  choice: क्या हुआ था
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त का यह संक्षिप्त, सहज हिन्दी रूप है और देखे गए परिणामों की ओर संकेत करता है।
- source_word: διὰ τὴν τῶν προπεπτωκότων ἁμαρτίαν
  choice: गिरे हुए लोगों के पाप के कारण
  rationale: प्रसंग में προπεπτωκότων युद्ध में मारे गए लोगों को दर्शाता है। ‘गिरे हुए’ मूल बिंब को सुरक्षित रखता है और उनके पाप से कारण-संबंध को स्पष्ट रहने देता है।
theological_decisions:
- issue: ἀναμαρτήτους में नैतिक स्थिति की भाषा
  choice: पाप से बचाए रखें
  alternative: निष्पाप बनाए रखें / पापरहित बने रहें
  rationale: मुख्य पाठ का रूप जीवित लोगों को उस अपराध से दूर रहने की चेतावनी के रूप में स्वाभाविक हिन्दी देता है और पूर्ण नैतिक निष्पापता का अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता। अधिक शब्दशः अर्थ पादटिप्पणी में दिया गया है।
- issue: मृतकों के पाप और घटित परिणाम के बीच कारण-संबंध
  choice: गिरे हुए लोगों के पाप के कारण क्या हुआ था
  alternative: गिरे हुए लोगों के पाप के संबंध में जो हुआ था
  rationale: διά के साथ कर्मकारक यहाँ कारण को स्पष्ट रूप से व्यक्त करता है; अनुवाद इस तनाव को कम किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कथात्मक रजिस्टर रखा गया है। ‘विनती’, ‘वीर’ और ‘आग्रह’ मूल की गंभीरता बनाए रखते हैं; अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशेष की शब्दावली से बचा गया है।
