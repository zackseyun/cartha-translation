- source_word: ἐμβλέπων
  choice: की ओर दृष्टि लगाए हुए था
  rationale: भविष्य में रखे प्रतिफल पर ध्यान केंद्रित करने का रूपक सुरक्षित रहता है।
- source_word: τοῖς μετʼ εὐσεβίας κοιμωμένοις
  choice: भक्ति में सो गए लोगों
  rationale: मृत्यु के लिए प्रयुक्त ‘सो जाना’ का स्रोत-मुहावरा बनाए रखा गया है; ‘भक्ति में’ उनके भक्तिमय जीवन और मृत्यु की रीति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κάλλιστον ἀποκείμενον εὐχαριστήριον
  choice: रखे हुए उत्तम प्रतिफल
  rationale: ἀποκείμενον के ‘संचित/रखे हुए’ भाव और κάλλιστον की उत्कृष्टता को व्यक्त करता है। संदर्भ में असामान्य εὐχαριστήριον को प्रतिफल समझना वाक्य का संगत अर्थ देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια
  choice: यह विचार पवित्र और भक्तिपूर्ण था
