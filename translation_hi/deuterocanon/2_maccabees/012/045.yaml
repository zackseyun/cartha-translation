theological_decisions:
- issue: मृतकों के लिए किए गए प्रायश्चित से संकेतित मरणोत्तर लाभ
  choice: वचन को सीधे इस रूप में अनूदित किया गया है कि मृतकों के लिए प्रायश्चित किया गया, ताकि वे पाप से मुक्त किए जाएँ।
  alternative: इसे केवल स्मारक-कर्म मानना, अथवा बाद में विकसित किसी विशिष्ट मरणोत्तर शुद्धि-सिद्धांत की स्पष्ट पुष्टि के रूप में विस्तार देना।
  rationale: यूनानी पाठ मृतकों के लिए प्रायश्चित और पाप से मुक्ति के उद्देश्य को स्पष्ट कहता है, पर उसकी प्रक्रिया या बाद की धर्मसैद्धांतिक व्यवस्था का विवरण नहीं देता। अनुवाद इसी तनाव को बिना घटाए या बढ़ाए सुरक्षित रखता है।
