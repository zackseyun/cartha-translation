  text: for if he was looking to the splendid reward laid up for those who have fallen asleep in godliness[a], the thought was holy and devout. Therefore he made atonement for the dead[b], so that they might be released from sin.
translation:
  language: hi
  text: क्योंकि यदि वह भक्ति के साथ सो गए लोगों के लिए रखे हुए उत्तम प्रतिफल[a] की ओर दृष्टि लगाए हुए था, तो यह विचार पवित्र और भक्तिपूर्ण था। इसलिए उसने मृतकों के लिए प्रायश्चित किया[b], ताकि वे पाप से मुक्त किए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “रखा हुआ सर्वोत्तम उपहार”; यहाँ यूनानी शब्द εὐχαριστήριον असामान्य है और इसका आशय सुरक्षित रखे गए किसी लाभ, उपहार या प्रतिदान से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसने मृतकों के लिए पाप-निवारण किया” अथवा “तुष्टीकरण किया।”
    reason: lexical_alternative
