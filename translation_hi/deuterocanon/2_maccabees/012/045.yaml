- source_word: περὶ τῶν τεθνηκότων
  choice: मृतकों के लिए
  rationale: प्रायश्चित के संबंध और लाभार्थी भाव को व्यक्त करता है, पर प्रतिस्थापन की कोई अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: τὸν ἐξιλασμόν
  choice: प्रायश्चित
  rationale: यह सुलभ बाइबलीय हिन्दी शब्द पाप से निपटने के धार्मिक कार्य को व्यक्त करता है, किसी एक संकीर्ण प्रायश्चित-सिद्धांत को निर्धारित किए बिना।
- source_word: ἐποιήσατο
