  text: But after the so-called Pentecost, they moved out against Gorgias, the governor of Idumea.
translation:
  language: hi
  text: परन्तु पिन्तेकुस्त कहलाने वाले पर्व के बाद[a] वे इदूमिया के सेनापति[b] गोरगियास के विरुद्ध निकल पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: ‘पिन्तेकुस्त कहलाने वाले के बाद’; यहाँ ‘पर्व’ अर्थ में निहित है।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ ‘शासक’ या ‘राज्यपाल’ भी हो सकता है; वह नागरिक और सैन्य, दोनों प्रकार के नेतृत्व को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ
  choice: के बाद
  rationale: यह कालसूचक संबंधबोधक पद अगले सैन्य अभियान का समय पर्व के बाद निर्धारित करता है।
- source_word: τὴν λεγομένην πεντηκοστήν
  choice: पिन्तेकुस्त कहलाने वाले पर्व
  rationale: λεγομένην का अर्थ ‘कहलाने वाला’ है और πεντηκοστήν पर्व का प्रचलित नाम ‘पिन्तेकुस्त’ है। ‘पर्व’ संदर्भ से स्पष्ट निहितार्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि शब्दशः रूप पादटिप्पणी में सुरक्षित है।
- source_word: ὥρμησαν
  choice: निकल पड़े
  rationale: सैन्य प्रसंग में यह क्रिया अभियान के लिए बलपूर्वक प्रस्थान करने को दर्शाती है; ‘निकल पड़े’ गति या आक्रमण की तीव्रता को अनावश्यक रूप से बढ़ाए बिना उस भाव को व्यक्त करता है।
- source_word: ἐπὶ Γοργίαν
  choice: गोरगियास के विरुद्ध
  rationale: सैन्य गति की क्रिया के साथ ἐπί और कर्मकारक यहाँ शत्रुतापूर्ण दिशा दर्शाते हैं, इसलिए ‘के विरुद्ध’ उपयुक्त है।
- source_word: στρατηγόν
  choice: सेनापति
  rationale: στρατηγός मूलतः सैन्य नेतृत्व का पद है और इस अभियान-वर्णन में ‘सेनापति’ सबसे प्रत्यक्ष अर्थ देता है; क्षेत्रीय शासकीय पद का संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: Ἰδουμαίας
  choice: इदूमिया
  rationale: यूनानी भौगोलिक नाम Ἰδουμαία का प्रचलित लिप्यंतरण रखा गया है, इसे ‘एदोम’ में रूपांतरित नहीं किया गया।
