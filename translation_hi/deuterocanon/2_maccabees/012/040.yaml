  yaml_path: translation/deuterocanon/2_maccabees/012/040.yaml
  text: But under the tunic of each of the dead they found sacred tokens of the idols of Jamnia[a], which the law forbids the Jews to have[b]; and it became clear to all that for this reason these men had fallen.
translation:
  language: hi
  text: पर हर मृतक के भीतरी वस्त्र के नीचे उन्हें यामनिया की मूर्तियों से जुड़ी पवित्र वस्तुएँ मिलीं[a], जिन्हें रखने से व्यवस्था यहूदियों को रोकती थी; और सबको स्पष्ट हो गया कि ये लोग इसी कारण गिर पड़े थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र चढ़ावे,’ ‘मन्नत की भेंटें,’ अथवा संभवतः यामनिया की मूर्तियों से जुड़े ‘ताबीज़।’
    reason: lexical_alternative
  - marker: b
    text: युद्ध के प्रसंग में ‘गिर पड़े’ का अर्थ है कि वे मारे गए थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερώματα
  choice: पवित्र वस्तुएँ
  rationale: यह शब्द उपासना या धार्मिक समर्पण से जुड़ी वस्तुओं को दर्शाता है। उनका ठीक स्वरूप निश्चित नहीं है, इसलिए मुख्य पाठ में व्यापक अभिव्यक्ति रखी गई है और संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: χιτῶνας
  choice: कुरते
  rationale: χίτων शरीर पर पहने जाने वाले भीतरी वस्त्र को दर्शाता है। आधुनिक हिन्दी में ‘कुरता’ सहज और पर्याप्त रूप से सटीक है।
- source_word: τῶν ἀπὸ Ἰαμνίας εἰδώλων
  choice: यामनिया की मूर्तियों से जुड़ी
  rationale: यह प्रयोग वस्तुओं का संबंध यामनिया की मूर्तियों से बताता है, पर संबंध की सटीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀπήργει
  choice: निषिद्ध किया था
  rationale: क्रिया रोकने या दूर रखने का कानूनी भाव व्यक्त करती है। यह चयन व्यवस्था के निषेध को स्पष्ट और स्वाभाविक हिन्दी में बताता है।
- source_word: πεπτωκέναι
  choice: गिर पड़े थे
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘गिरना’ है और युद्ध के प्रसंग में यह मारे जाने का मुहावरा है। अनुवाद मूल बिंब बनाए रखता है; पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: διὰ τήνδε τὴν αἰτίαν
  choice: इसी कारण
  rationale: यह कारण-सूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: मूर्तिपूजा से जुड़ी वस्तुओं और सैनिकों की मृत्यु के बीच कारण-संबंध
  choice: पद के कथन के अनुसार सब पर स्पष्ट हुआ कि वे इसी कारण गिरे थे।
  alternative: इसे केवल समुदाय द्वारा निकाला गया निष्कर्ष माना जा सकता है, न कि कथाकार द्वारा अलग से प्रतिपादित धर्मवैज्ञानिक निर्णय।
  rationale: यूनानी पाठ ‘सब पर स्पष्ट हो गया’ के साथ कारण को स्पष्ट रूप से जोड़ता है। अनुवाद इस कथन को बनाए रखता है, पर उससे आगे कोई धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हर व्यक्ति के कुरते’ से यूनानी के एकवचन-वितरणात्मक रूप को सुरक्षित रखा गया है। ‘पवित्र वस्तुएँ’ वस्तुओं के स्वरूप की अनिश्चितता बनाए रखता है, जबकि पादटिप्पणी संभावित अर्थ बताती है।
