  yaml_path: translation/deuterocanon/2_maccabees/012/044.yaml
  text: For if he were not expecting those who had fallen to rise again[a], it would be excessive and foolish to pray for the dead.
translation:
  language: hi
  text: क्योंकि यदि वह यह अपेक्षा न करता कि जो गिर पड़े थे वे फिर जी उठेंगे[a], तो मरे हुओं के लिए प्रार्थना करना अनावश्यक और मूर्खतापूर्ण होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मर गए थे”; शाब्दिक अर्थ, “जो गिर पड़े थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεπτωκότας
  choice: जो गिर पड़े थे
  rationale: पूर्ण कृदंत के शाब्दिक ‘गिर पड़े’ बिंब को बनाए रखता है; सैनिक प्रसंग में इसका संकेत युद्ध में मारे गए लोगों की ओर है।
- source_word: ἀναστῆναι
  choice: फिर जी उठेंगे
  rationale: यहाँ क्रिया पुनरुत्थान को सूचित करती है। ‘फिर जी उठेंगे’ स्वाभाविक हिन्दी में इसे स्पष्ट करता है, पर यूनानी के अकर्मक रूप को निष्क्रिय ‘जिलाए जाएंगे’ में नहीं बदलता।
- source_word: προσεδόκα
  choice: आशा न रखता
  rationale: क्रिया का अर्थ अपेक्षा करना या बाट जोहना है। इस धार्मिक संदर्भ में ‘आशा रखना’ स्वाभाविक है, यद्यपि इसमें भावात्मक छाया ‘अपेक्षा करना’ से कुछ अधिक है।
- source_word: περισσὸν
  choice: व्यर्थ
  rationale: यहाँ अर्थ आवश्यकता से अधिक, अनावश्यक या निष्फल होने का है। ‘व्यर्थ’ हिन्दी में तर्क का आशय सहज रूप से व्यक्त करता है, हालांकि अधिक रूपात्मक विकल्प ‘अनावश्यक’ है।
- source_word: ληρῶδες
  choice: मूर्खतापूर्ण
  rationale: यह शब्द बेसिर-पैर या मूर्खतापूर्ण बात के लिए प्रयुक्त होता है; चुना हुआ रूप स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी है।
- source_word: ὑπὲρ νεκρῶν
  choice: मरे हुओं के लिए
  rationale: संबंधकारक के साथ ὑπέρ यहाँ किसी के पक्ष में या उसके लिए किए गए कार्य को बताता है; यह हिन्दी में मध्यस्थ प्रार्थना का स्वाभाविक रूप है।
- source_word: εὔχεσθαι
  choice: प्रार्थना करना
  rationale: इस प्रसंग में क्रिया प्रार्थना करने को व्यक्त करती है; ‘प्रार्थना करना’ सबसे स्पष्ट और सामान्य हिन्दी है।
theological_decisions:
- issue: मरे हुओं के लिए प्रार्थना का आधार पुनरुत्थान की आशा होना
  choice: 'शर्तात्मक तर्क को सीधे रखा गया है: यदि गिरे हुए फिर न जी उठें, तो उनके लिए प्रार्थना व्यर्थ और मूर्खतापूर्ण होती।'
  alternative: ‘शारीरिक पुनरुत्थान’ को स्पष्ट रूप से जोड़ना या बाद की शुद्धिकरण-संबंधी धर्मशिक्षा के अनुसार वाक्य की व्याख्या करना।
  rationale: यूनानी पाठ पुनरुत्थान और मृतकों के लिए प्रार्थना के बीच संबंध स्थापित करता है, पर मध्यवर्ती अवस्था या शुद्धिकरण की कोई विस्तृत शिक्षा नहीं देता। अनुवाद उसी तनाव और सीमा को बनाए रखता है।
- issue: ἀναστῆναι की वाच्यगत अभिव्यक्ति
  choice: ‘फिर जी उठेंगे’
  alternative: ‘फिर जिलाए जाएंगे’
  rationale: यूनानी रूप सक्रिय अकर्मक infinitive है। दोनों हिन्दी रूप पुनरुत्थान का अर्थ दे सकते हैं, पर चुना हुआ रूप स्रोत की व्याकरणिक अभिव्यक्ति के अधिक निकट है और पुनरुत्थान के कर्ता के विषय में अतिरिक्त स्पष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘गिर पड़े’ से यूनानी का सैनिक बिंब बचाया गया है और पादटिप्पणी में उसका प्रसंगगत अर्थ दिया गया है।
