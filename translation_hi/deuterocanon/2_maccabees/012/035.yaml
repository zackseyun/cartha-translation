    issue: “क्योंकि” for βουλόμενον
    rationale: The Greek participle conveys Dositheus’s intention in the unfolding action, not a causal explanation. Coordinating it as “और ... चाहता था” preserves the relation.
  - severity: low
    issue: “पकड़ लिया” for εἶχεν
    rationale: εἶχεν is imperfect and describes Dositheus as already holding Gorgias; “पकड़े हुए था” better reflects this.
  - severity: low
    issue: “कंधे को काट गिराया”
    rationale: This is awkward Hindi. A natural severe rendering is “उसका कंधा काट डाला,” with the footnote continuing to preserve uncertainty about the exact anatomical effect.
