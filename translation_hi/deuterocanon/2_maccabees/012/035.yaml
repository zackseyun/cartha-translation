base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/035.yaml
  text: But a certain Dositheus[a], one of Bacenor’s men, a horseman and a strong man, had hold of Gorgias; and seizing his cloak, he was dragging him along forcefully, intending to take the accursed man alive, when one of the Thracian horsemen rushed upon him and cut off his shoulder, and Gorgias escaped to Marisa.
translation:
  language: hi
  text: परन्तु बकिनोर के लोगों में से दोसीथियुस नाम का एक बलवान घुड़सवार गोरगियास को पकड़े हुए था। गोरगियास का लबादा थामकर वह उसे बलपूर्वक खींचे ले जा रहा था और उस शापित व्यक्ति को जीवित पकड़ना चाहता था। तभी थ्राकी घुड़सवारों में से एक ने उस पर धावा बोलकर उसका कंधा काट डाला[a], और गोरगियास भागकर मरीसा पहुँच गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके कंधे पर ऐसा वार किया कि वह बेकार हो गया।” यूनानी वाक्यांश कंधे के भाग पर हुए एक गंभीर वार का वर्णन करता है; चोट का ठीक शारीरिक परिणाम स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος
  choice: दोसीथियुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: τῶν τοῦ Βακινόρος
  choice: बकिनोर के लोगों में से
  rationale: सम्बन्धसूचक वाक्यांश को स्वाभाविक हिन्दी में रखा गया है और सैनिक पद का अनावश्यक निर्धारण नहीं किया गया।
- source_word: ἔφιππος ἀνὴρ καὶ καρτερός
  choice: एक बलवान घुड़सवार
  rationale: यह व्यक्ति के घोड़े पर सवार होने और युद्ध में उसकी शक्ति—दोनों को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἶχεν τοῦ Γοργίου
  choice: उसने गोरगियास को पकड़ लिया
  rationale: सन्दर्भ में यह गोरगियास पर शारीरिक पकड़ बना लेने का बोध देता है।
- source_word: λαβόμενος τῆς χλαμύδος
  choice: उसका लबादा थामकर
  rationale: χλαμύς एक छोटा लबादा है, जो प्रायः सैनिक पहनते थे; सामान्य पाठक के लिए 'लबादा' स्पष्ट है।
- source_word: ἦγεν αὐτὸν εὐρώστως
  choice: उसे बलपूर्वक खींचे ले जा रहा था
  rationale: पकड़े हुए लबादे और युद्ध-सन्दर्भ के कारण ἦγεν में बल लगाकर ले जाने का भाव है; εὐρώστως उस बलपूर्वक क्रिया को स्पष्ट करता है।
- source_word: βουλόμενον τὸν κατάρατον λαβεῖν ζωγρείαν
  choice: वह उस शापित व्यक्ति को जीवित पकड़ना चाहता था
  rationale: ζωγρείαν जीवित बन्दी बनाने को व्यक्त करता है; κατάρατον का विरोधपूर्ण विशेषण 'शापित' के रूप में सुरक्षित है।
- source_word: τῶν ἱππέων τινὸς Θρακῶν
  choice: थ्राकिया के घुड़सवारों में से एक
  rationale: यह थ्राकियाई घुड़सवार दल के किसी एक सदस्य को बिना अतिरिक्त पद-निर्धारण के व्यक्त करता है।
- source_word: ἐπενεχθέντος αὐτῷ
  choice: उस पर धावा बोलकर
  rationale: अचानक की गई शत्रुतापूर्ण गति को युद्ध-सन्दर्भ के अनुरूप दर्शाता है।
- source_word: τὸν ὦμον καθελόντος
  choice: उसके कंधे को काट गिराया
  rationale: καθαιρέω यहाँ कंधे पर हुए गंभीर, अंग-विच्छेदकारी प्रहार का संकेत दे सकता है; मूल की कठोरता रखते हुए उसकी शारीरिक सटीकता सम्बन्धी अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: Μαρισά
  choice: मरीसा
  rationale: स्थान-नाम का यूनानी रूप से देवनागरी लिप्यंतरण।
