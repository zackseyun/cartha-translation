translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। सैन्य शब्दावली को स्पष्ट रखा गया है, पर मूल से अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
