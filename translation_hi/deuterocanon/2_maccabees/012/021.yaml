base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/021.yaml
  text: But when Timothy learned of Judas’s advance[a], he sent the women and the rest of the baggage ahead to the place called Carnion, for the place was hard to besiege and difficult to approach because of the narrowness of all the surrounding terrain.
translation:
  language: hi
  text: पर जब तीमुथियुस को यहूदा के आगे बढ़ने की खबर मिली, तो उसने स्त्रियों और बाकी सामान को कार्नियोन नामक स्थान पर पहले ही भेज दिया; क्योंकि उस स्थान को घेरना कठिन था और वहाँ पहुँचना भी मुश्किल था, क्योंकि आस-पास के सभी स्थान सँकरे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “सभी स्थानों की सँकरी बनावट के कारण”; आशय सम्भवतः उस स्थल के आस-पास के तंग भूभाग या सँकरे पहुँच-मार्गों से है।
    reason: मूल यूनानी की असामान्य और कुछ हद तक अस्पष्ट भौगोलिक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: ἔφοδον
  choice: आगे बढ़ने
  rationale: सैन्य संदर्भ में यहूदा की निकट आती चढ़ाई या सैन्य गतिविधि का बोध देता है; यह चयन वास्तविक आक्रमण आरम्भ हो चुका था, ऐसा अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μεταλαβὼν
  choice: खबर मिली
  rationale: कृदन्त का भाव सूचना प्राप्त करने या किसी बात का पता चलने का है; आधुनिक हिन्दी में यह स्वाभाविक और संदर्भानुकूल है।
- source_word: προεξαπέστειλεν
  choice: पहले ही ... भेज दिया
  rationale: संयुक्त क्रिया किसी को पहले से या आगे भेज देने का स्पष्ट भाव रखती है।
- source_word: ἀποσκευήν
  choice: सामान
  rationale: यह साथ ले जाए जाने वाले सामान, चल संपत्ति या साज-सामान को सूचित करता है; ‘सामान’ सामान्य पाठक के लिए व्यापक और स्वाभाविक है।
- source_word: τὸ λεγόμενον Κάρνιον
  choice: कार्नियोन नामक स्थान
  rationale: λεγόμενον यहाँ स्थान के नाम का परिचय देता है; यह रूप हिन्दी में सहज है।
- source_word: δυσπολιόρκητον
  choice: घेरना कठिन
  rationale: यह सैन्य घेराबंदी की कठिनाई व्यक्त करता है और मूल अर्थ को संक्षेप में बनाए रखता है।
- source_word: δυσπρόσιτον
  choice: वहाँ पहुँचना भी मुश्किल
  rationale: शब्द किसी स्थान तक पहुँच या निकट जाने में कठिनाई बताता है; यह उसे पूर्णतः अगम्य नहीं ठहराता।
- source_word: χωρίον
  choice: स्थान
  rationale: मूल शब्द सामान्यतः किसी जगह या स्थल को दर्शाता है; ‘गढ़’ जैसे अधिक विशिष्ट अर्थ को पाठ में आरोपित नहीं किया गया।
- source_word: διὰ τὴν πάντων τῶν τόπων στενότητα
  choice: क्योंकि आस-पास का सारा भूभाग सँकरा था
  rationale: यह कठिन पहुँच का भौगोलिक कारण स्वाभाविक हिन्दी में बताता है; मूल की अधिक शाब्दिक रचना को पादटिप्पणी में सुरक्षित रखा गया है।
