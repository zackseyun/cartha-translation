  language: hi
  text: तब वह तीन हज़ार पैदल सैनिकों और चार सौ घुड़सवारों के साथ निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकला
  rationale: ἐξέρχομαι के भूतकालिक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; प्रसंग में सैन्य प्रस्थान स्पष्ट है, इसलिए अतिरिक्त अर्थ जोड़ने वाला ‘कूच किया’ नहीं चुना गया।
- source_word: μετὰ
  choice: के साथ
  rationale: यहाँ पूर्वसर्ग साथ होने या संगति का बोध कराता है; ‘के साथ’ स्वाभाविक और सटीक है।
- source_word: πεζῶν
  choice: पैदल सैनिकों
  rationale: πεζός यहाँ घुड़सवारों के विपरीत पैदल लड़ने वाले सैनिकों को दर्शाता है; ‘पैदल सैनिक’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: τρισχιλίων
  choice: तीन हज़ार
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: ἱππέων
  choice: घुड़सवारों
  rationale: ἱππεύς घोड़े पर लड़ने वाले सैनिक को दर्शाता है; ‘घुड़सवार’ व्यक्ति-सूचक अर्थ और सैन्य संदर्भ दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: τετρακοσίων
  choice: चार सौ
  rationale: मूल संख्या का सीधा अनुवाद।
