  yaml_path: translation/deuterocanon/2_maccabees/012/003.yaml
  text: 'But the people of Joppa committed such a great act of impiety: they invited the Jews living among them to embark, with their wives and children, in the boats provided by them, as though there were no hostility toward them at all;'
translation:
  language: hi
  text: 'परन्तु याफ़ा के निवासियों ने इतना बड़ा अधर्म किया: उन्होंने अपने बीच रहने वाले यहूदियों को उन नावों पर अपनी पत्नियों और बच्चों समेत चढ़ने का निमंत्रण दिया, जो याफ़ा के निवासियों ने उपलब्ध कराई थीं, मानो उनके प्रति कोई शत्रुता थी ही नहीं;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰοππῖται
  choice: याफ़ा के निवासी
  rationale: यह नगर के निवासियों के सामूहिक नागरिक-सूचक नाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τηλικοῦτο
  choice: इतना बड़ा
  rationale: यह उस कृत्य की असाधारण गंभीरता पर दिए गए यूनानी बल को बनाए रखता है।
- source_word: συνετελέσαντο
  choice: किया
  rationale: दुष्कर्मवाचक संज्ञा ‘अधर्म’ के साथ यह सहज हिन्दी है और कृत्य को अंजाम देने का भाव व्यक्त करती है।
- source_word: δυσσέβημα
  choice: अधर्म
  rationale: यह केवल सामान्य बुराई नहीं, बल्कि धार्मिक-नैतिक दृष्टि से अपवित्र और भक्तिहीन कृत्य का भार रखता है।
- source_word: παρακαλέσαντες
  choice: निमंत्रण दिया
  rationale: प्रसंग में छलपूर्ण सद्भाव के आवरण में नाव पर आने को कहना है; ‘निमंत्रण दिया’ उस सामाजिक और भ्रामक विनम्रता को व्यक्त करता है।
- source_word: τοὺς ἐν ἑαυτοῖς οἰκοῦντας Ἰουδαίους
  choice: अपने बीच रहने वाले यहूदियों
  rationale: यह याफ़ा के समुदाय के भीतर निवास कर रहे यहूदियों का संबंधपरक भाव स्पष्ट रखता है।
- source_word: ἐμβῆναι
  choice: नावों पर ... चढ़ने
  rationale: जलयानों पर सवार होने की क्रिया के लिए यह सटीक और सामान्य आधुनिक हिन्दी है।
- source_word: τὰ παρακατασταθέντα ὑπʼ αὐτῶν σκάφη
  choice: उनकी ओर से उपलब्ध कराई गई नावों
  rationale: παρακατασταθέντα का भाव नावों को तैयार या उपलब्ध कराने का है; यह अनावश्यक तकनीकी विशिष्टता जोड़े बिना उसे व्यक्त करता है।
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: अपनी पत्नियों और बच्चों समेत
  rationale: ‘अपनी’ स्वाभाविक हिन्दी में स्पष्ट करता है कि यहूदियों के परिवार भी साथ थे; ‘समेत’ समावेशी बल रखता है।
- source_word: ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας
  choice: मानो उनके प्रति कोई शत्रुता थी ही नहीं
  rationale: यह छलपूर्ण दिखावे को व्यक्त करता है; ‘ही नहीं’ μηδεμίας के पूर्ण निषेध पर बल देता है।
theological_decisions:
- issue: δυσσέβημα का धार्मिक-नैतिक बल
  choice: अधर्म
  alternative: दुष्कर्म; भक्तिहीन कृत्य
  rationale: ‘अधर्म’ आधुनिक हिन्दी में सहज रहते हुए कृत्य की धार्मिक और नैतिक निन्दा दोनों को बनाए रखता है, बिना किसी बाद की साम्प्रदायिक धारणा को जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य के अंत का अर्धविराम स्रोत में आगे जारी रहने वाली कथा-संरचना को संकेत करता है। ‘याफ़ा’ आधुनिक हिन्दी में प्रचलित बाइबलीय नगर-नाम के अनुरूप है।
