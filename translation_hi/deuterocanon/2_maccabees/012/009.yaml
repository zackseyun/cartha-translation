base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/009.yaml
  text: And making a night attack on the people of Jamnia[a], he set the harbor and the fleet on fire, so that the rays of the light were visible as far as Jerusalem[b], it being two hundred forty stadia away.
translation:
  language: hi
  text: उसने रात में यम्निया के निवासियों पर धावा बोलकर बंदरगाह और जहाज़ों के बेड़े को आग लगा दी, जिससे प्रकाश की किरणें[b] यरूशलेम तक दिखाई देती थीं। यरूशलेम वहाँ से दो सौ चालीस स्टेडिया[a] दूर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्टेडियन लंबाई की एक प्राचीन इकाई थी; दो सौ चालीस स्टेडिया लगभग 43–45 किलोमीटर होते हैं।
    reason: cultural_note
  - marker: b
    text: शाब्दिक अर्थ, ‘प्रकाश की चमकें/किरणें।’ प्रसंग में यह जलते हुए बंदरगाह और जहाज़ों से उठने वाली रोशनी को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς Ἰαμνίταις
  choice: यम्निया के निवासियों पर
  rationale: दत्तिव कारक ἐπιβαλών के साथ आक्रमण के लक्ष्य को बताता है। आधुनिक हिन्दी में यह स्थान-संबंध स्पष्ट और स्वाभाविक है।
- source_word: νυκτὸς ἐπιβαλὼν
  choice: रात में ... पर धावा बोलकर
  rationale: यह रात में किए गए अचानक सैन्य आक्रमण का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐνέπρησεν
  choice: आग लगा दी
  rationale: क्रिया का अर्थ किसी वस्तु को जला देना या आग लगा देना है; यहाँ प्रत्यक्ष कर्मों के साथ यही सहज प्रयोग है।
- source_word: τὸν λιμένα
  choice: बंदरगाह
  rationale: λιμήν समुद्री बंदरगाह या पत्तन को दर्शाता है; सामान्य पाठकों के लिए ‘बंदरगाह’ अधिक प्रचलित है।
- source_word: σὺν τῷ στόλῳ
  choice: और जहाज़ों के बेड़े को
  rationale: στόλος यहाँ एकत्र जहाज़ों के बेड़े को सूचित करता है। ‘जहाज़ों के’ जोड़ने से आधुनिक पाठक के लिए आशय स्पष्ट होता है।
- source_word: ὥστε ἐπιφαίνεσθαι
  choice: दिखाई दे रही थीं
  rationale: यह रचना आग लगाने के परिणाम को व्यक्त करती है; हिन्दी वाक्य में दृश्यता को सीधे कहना स्वाभाविक है।
- source_word: τὰς αὐγὰς τοῦ φέγγους
  choice: आग के प्रकाश की किरणें
  rationale: मूल पदबंध शाब्दिक रूप से प्रकाश की चमक या किरणों को कहता है। प्रसंग से प्रकाश का स्रोत आग है, जिसे स्पष्ट करते हुए मूल बिंब बनाए रखा गया है।
- source_word: εἰς τὰ Ἱεροσόλυμα
  choice: यरूशलेम तक
  rationale: यहाँ εἰς दृश्य प्रकाश की पहुँच या विस्तार की सीमा बताता है।
- source_word: σταδίων ὄντων διακοσίων τεσσεράκοντα
  choice: जो वहाँ से दो सौ चालीस स्टेडिया दूर था
  rationale: संबंधवाचक निरपेक्ष रचना यम्निया और यरूशलेम के बीच की दूरी बताती है। मूल में अनिवार्य रूप से विरोधसूचक ‘यद्यपि’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
