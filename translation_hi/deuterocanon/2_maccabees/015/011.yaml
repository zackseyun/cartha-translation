base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/011.yaml
  text: And after arming each of them[a], not with the security of shields and spears so much as with encouragement from noble words, and after relating to them a trustworthy dream[b], he made them all rejoice.
translation:
  language: hi
  text: फिर उसने उनमें से हर एक को[a] ढालों और भालों से मिलनेवाली सुरक्षा से उतना नहीं, जितना उत्तम वचनों से मिलनेवाले प्रोत्साहन से सुसज्जित किया; और उन्हें एक विश्वासयोग्य स्वप्न[b] सुनाकर उसने उन सबको बहुत आनन्दित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें से हर एक को पूरी तरह हथियारबंद करके।”
    reason: καθοπλίσας का शाब्दिक सैन्य अर्थ ‘पूरी तरह हथियारबंद करना’ है, जबकि प्रसंग में आगे यह सुसज्जित करने का रूपकात्मक साधन भी बताता है।
  - marker: b
    text: या, “एक विश्वसनीय स्वप्न।” यूनानी में स्वप्न को विश्वास के योग्य बताया गया है।
    reason: ἀξιόπιστος के निकट हिन्दी विकल्प और यूनानी पद का निहित मूल्यांकन स्पष्ट करने के लिए।
lexical_decisions:
- source_word: καθοπλίσας
  choice: सुसज्जित किया
  rationale: क्रिया का मूल अर्थ पूरी तरह हथियारबंद या सुसज्जित करना है। यहाँ ढाल-भालों और वचनों से मिले प्रोत्साहन के बीच रूपकात्मक तुलना है, इसलिए ‘सुसज्जित किया’ दोनों पक्षों पर स्वाभाविक रूप से लागू होता है।
- source_word: οὐ τὴν ... ἀσφάλειαν, ὡς τὴν ... παράκλησιν
  choice: सुरक्षा से उतना नहीं, जितना ... प्रोत्साहन से
  rationale: यह रचना दोनों साधनों के बीच तुलनात्मक बल को सुरक्षित रखती है और पहले साधन को पूर्णतः नकारती नहीं।
- source_word: ἀσπίδων καὶ λογχῶν
  choice: ढालों और भालों
  rationale: दोनों यूनानी सैन्य शब्दों के सीधे, प्रचलित और आधुनिक हिन्दी समकक्ष।
- source_word: ἐν τοῖς ἀγαθοῖς λόγοις
  choice: उत्तम वचनों से मिलनेवाले
  rationale: ἀγαθός के सकारात्मक और गरिमापूर्ण भाव को ‘उत्तम’ व्यक्त करता है; ‘वचन’ कथन अथवा उत्साहवर्धक भाषण के अर्थ को बनाए रखता है।
- source_word: προσηγησάμενος
  choice: उन्हें ... सुनाकर
  rationale: मध्यवाच्य कृदन्त श्रोताओं के सामने किसी बात का वर्णन करने का भाव देता है। ‘उन्हें ... सुनाकर’ हिन्दी में उस अप्रत्यक्ष कर्म और घटनाक्रम को सहज रखता है।
- source_word: ὄνειρον ἀξιόπιστον
  choice: एक विश्वासयोग्य स्वप्न
  rationale: ἀξιόπιστος का अर्थ विश्वास के योग्य या विश्वसनीय है। यह अनुवाद स्वप्न की सकारात्मक प्रामाणिकता को रखता है, पर उसके स्रोत को स्पष्टतः ईश्वरीय नहीं ठहराता।
- source_word: ὑπὲρ τὰ πάντα
  choice: बहुत
  rationale: यहाँ पदबंध को क्रियाविशेषणात्मक तीव्रता के रूप में लिया गया है। ‘बहुत’ आनन्द की प्रबलता को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ηὔφραινεν
  choice: आनन्दित किया
  rationale: εὐφραίνω का कारक अर्थ ‘प्रसन्न/आनन्दित करना’ है; यह चयन उस कारकता को सुरक्षित रखता है।
theological_decisions:
- issue: स्वप्न का स्वरूप और स्रोत
  choice: ‘विश्वासयोग्य स्वप्न’
  alternative: ‘विश्वसनीय स्वप्न’ अथवा ‘ईश्वर-प्रेरित स्वप्न’
  rationale: पद स्वप्न को विश्वास के योग्य बताता है, पर इस पद में उसके ईश्वरीय स्रोत को स्पष्ट नहीं करता। इसलिए अनुवाद सकारात्मक मूल्यांकन को रखता है और अतिरिक्त धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। तुलनात्मक रचना ‘उतना नहीं, जितना’ मूल यूनानी के बल को बनाए रखती है। ‘वचन’ बाइबलीय गरिमा देता है, पर वाक्य-विन्यास आधुनिक रखा गया है।
