  text: फिर उसने उस घृणित[a] नीकानोर का सिर और उस निन्दक[b] का वह हाथ सबको दिखाया, जिसे उस निन्दक ने सर्वशक्तिमान के पवित्र भवन के विरुद्ध उठाया था और जिसके विषय में उसने बड़े घमण्ड से डींग मारी थी,
