lexical_decisions:
- source_word: ἐπιδειξάμενος
  choice: सबको दिखाया
  rationale: यह क्रिया सार्वजनिक रूप से प्रदर्शित करने का भाव रखती है। यूनानी कृदन्त की क्रमिकता को हिन्दी में ‘फिर’ से स्वाभाविक रूप दिया गया है; वाक्य अगले पद में पूरा होता है।
- source_word: μιεροῦ
  choice: घृणित
  rationale: यह तीव्र धार्मिक और नैतिक तिरस्कार व्यक्त करने वाला विशेषण है। ‘घृणित’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘दूषित’ या ‘अपवित्र’ इसके प्रदूषण-संबंधी मूल भाव को अधिक प्रत्यक्ष रखते हैं।
- source_word: δυσφήμου
  choice: निन्दक
  rationale: शब्द का मूल अर्थ बुरा बोलने, बदनाम करने या निन्दा करने वाले व्यक्ति से है। ‘निन्दक’ इसकी व्यापकता बचाता है; पवित्र भवन के प्रसंग में ईशनिन्दा का भाव भी सम्भव है।
- source_word: ἐκτείνας
  choice: उठाकर
  rationale: मन्दिर के विरुद्ध हाथ फैलाने या बढ़ाने की शत्रुतापूर्ण मुद्रा को स्वाभाविक हिन्दी में ‘हाथ उठाना’ व्यक्त करता है।
- source_word: ἐπὶ τὸν ἅγιον ... οἶκον
  choice: पवित्र भवन के विरुद्ध
  rationale: पूर्वसर्ग ἐπί यहाँ प्रसंगानुसार केवल दिशा नहीं, विरोधी और धमकीपूर्ण अभिमुखता बताता है। ‘भवन’ मन्दिर के लिए प्रयुक्त ‘घर’ की छवि को सम्मानपूर्ण हिन्दी में रखता है।
- source_word: παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह परमेश्वर की उपाधि का प्रचलित, श्रद्धापूर्ण और स्पष्ट हिन्दी अनुवाद है।
- source_word: ἐμεγαλαύχησεν
  choice: बड़े घमण्ड से डींग मारी थी
  rationale: क्रिया में बढ़-चढ़कर और अहंकारपूर्वक बोलने का भाव है। यह हिन्दी प्रयोग उस तीव्रता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: παντοκράτωρ को परमेश्वर की उपाधि के रूप में प्रस्तुत करना
  choice: सर्वशक्तिमान
  alternative: सब पर शासन करने वाला
  rationale: ‘सर्वशक्तिमान’ स्थापित और सहज हिन्दी उपाधि है। वैकल्पिक अनुवाद सार्वभौम शासन के पहलू को अधिक प्रत्यक्ष करता है, पर मुख्य पाठ का रूप शक्ति और प्रभुता दोनों का पारम्परिक संकेत देता है।
- issue: δυσφήμου में धार्मिक निन्दा की सीमा
  choice: निन्दक
  alternative: ईशनिन्दक
  rationale: यूनानी शब्द सामान्यतः बुरा बोलने या निन्दा करने वाले को भी कह सकता है। मन्दिर का प्रसंग धार्मिक अपराध की ओर संकेत करता है, फिर भी ‘ईशनिन्दक’ चुनने से मूल की सम्भावित व्यापकता अनावश्यक रूप से संकुचित हो जाती।
