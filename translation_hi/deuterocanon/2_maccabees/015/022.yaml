base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/022.yaml
  text: 'And he spoke[a], calling upon him in this way: “You, Master, sent your angel in the time of Hezekiah king of Judea, and he struck down a hundred eighty-five thousand in the camp of Sennacherib.”'
translation:
  language: hi
  text: 'और वह इस प्रकार परमेश्वर को पुकारकर कह रहा था: “हे स्वामी, आप ही ने यहूदिया[a] के राजा हिजकिय्याह के समय अपने स्वर्गदूत को भेजा था, और उसने सन्हेरीब की छावनी में एक लाख पचासी हज़ार लोगों को मार गिराया था।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के राजा।” यूनानी पाठ में “यहूदिया” (Ἰουδαίας) है, पर ऐतिहासिक संदर्भ यहूदा के राजा हिजकिय्याह का है।
    reason: lexical_alternative
