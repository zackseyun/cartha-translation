- source_word: τόνδε τὸν τρόπον
  choice: इस प्रकार
  rationale: प्रार्थना के शब्दों का परिचय देने वाला संक्षिप्त और स्वाभाविक हिन्दी प्रयोग।
- source_word: Σύ
  choice: आप ही ने
  rationale: यूनानी के स्पष्ट और बलाघाती सर्वनाम को ‘ही’ द्वारा सुरक्षित रखा गया है।
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: यह κύριος नहीं, बल्कि अधिकार और स्वामित्व सूचित करने वाला संबोधन है; ‘स्वामी’ इस शब्दभेद को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπέστειλας
  choice: भेजा था
  rationale: बीती हुई ऐतिहासिक घटना के स्मरण के लिए सहज हिन्दी रूप।
- source_word: τὸν ἄγγελόν σου
  choice: अपने स्वर्गदूत को
  rationale: इस दैवी हस्तक्षेप के संदर्भ में ἄγγελος का आशय सामान्य मानवीय संदेशवाहक नहीं, परमेश्वर का स्वर्गदूत है।
- source_word: ἐπὶ Ἐζεκίου
  choice: हिजकिय्याह के समय
  rationale: ἐπί के रूपगत संभावित अर्थों में से प्रसंगानुकूल कालवाचक अर्थ लिया गया है; ‘हिजकिय्याह के विरुद्ध’ ऐतिहासिक संकेत को उलटकर भ्रामक होगा।
- source_word: τοῦ βασιλέως τῆς Ἰουδαίας
  choice: यहूदिया के राजा
  rationale: Ἰουδαίας का प्रत्यक्ष यूनानी रूप ‘यहूदिया’ सुरक्षित रखा गया है; ऐतिहासिक ‘यहूदा’ को पादटिप्पणी में दिया गया है।
- source_word: ἀνεῖλεν
  choice: मार गिराया था
  rationale: क्रिया के घातक अर्थ को स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τῆς παρεμβολῆς Σενναχηρείμ
  choice: सन्हेरीब की छावनी में
  rationale: यद्यपि यूनानी में ἐκ है, आशय छावनी के भीतर उपस्थित मारे गए लोगों से है; हिन्दी में स्थानवाचक ‘में’ अधिक स्वाभाविक और संदर्भतः स्पष्ट है।
- source_word: εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: एक लाख पचासी हज़ार लोगों को
  rationale: यूनानी संख्या को भारतीय संख्या-पद्धति में ठीक-ठीक और सामान्य पाठक के लिए सहज रूप से प्रस्तुत करता है; ‘लोगों को’ क्रिया का निहित कर्म स्पष्ट करता है।
