  text: But those around Judas joined battle with the enemies with invocation and prayers[a][b].
translation:
  language: hi
  text: परन्तु यहूदा के साथी आह्वान और प्रार्थनाओं के साथ शत्रुओं से भिड़ गए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को पुकारने और प्रार्थनाओं के साथ।” यूनानी पाठ में “आह्वान और प्रार्थनाओं के साथ” है; इस उपवाक्य में यह नहीं बताया गया कि आह्वान किसका किया गया।
    reason: lexical_alternative
  - marker: b
    text: “प्रार्थनाओं” का अनुवाद “मन्नतों” भी हो सकता है, क्योंकि यूनानी शब्द प्रसंग के अनुसार दोनों अर्थ रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: परन्तु यहूदा के साथियों ने
  rationale: περὶ + कर्मकारक यहाँ किसी अगुए से जुड़े लोगों को सूचित करता है। ‘यहूदा के साथी’ स्वाभाविक हिन्दी है और प्रसंग से अधिक विशिष्ट सैनिक पहचान नहीं जोड़ता।
- source_word: μετὰ ἐπικλήσεως
  choice: पुकार के साथ
  rationale: ἐπίκλησις धार्मिक सहायता के लिए पुकारने या आह्वान करने को सूचित करता है। यूनानी वाक्य में पुकार का लक्ष्य स्पष्ट नहीं किया गया, इसलिए मुख्य पाठ में ‘परमेश्वर को’ नहीं जोड़ा गया।
- source_word: καὶ εὐχῶν
  choice: और प्रार्थनाओं के साथ
  rationale: εὐχή का अर्थ ‘प्रार्थना’ या ‘मन्नत’ हो सकता है। ἐπίκλησις के साथ युद्ध के इस प्रसंग में ‘प्रार्थनाएँ’ अधिक संभावित है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: συνῆψαν
  choice: युद्ध छेड़ दिया
  rationale: सैन्य प्रसंग में συνάπτω का अर्थ युद्ध में भिड़ना या युद्ध आरम्भ करना है। ‘युद्ध छेड़ दिया’ आधुनिक हिन्दी में क्रिया की युद्ध-संबंधी शक्ति स्पष्ट करता है।
- source_word: τοῖς πολεμίοις
  choice: शत्रुओं से
  rationale: συνῆψαν के बाद सम्प्रदान कारक उस विरोधी पक्ष को बताता है जिससे युद्ध हुआ; हिन्दी में ‘शत्रुओं से युद्ध’ स्वाभाविक प्रयोग है।
theological_decisions:
- issue: युद्ध के प्रसंग में ἐπίκλησις का धार्मिक आशय
  choice: धार्मिक आशय बनाए रखते हुए ‘पुकार’ कहना और उसके लक्ष्य को मुख्य पाठ में अनकहा रखना
  alternative: ‘परमेश्वर को पुकारते हुए’ कहना
  rationale: प्रसंग परमेश्वर की सहायता पर निर्भरता की ओर संकेत करता है, पर इस उपवाक्य में यूनानी पाठ पुकारे जाने वाले का नाम नहीं लेता। अनुवाद उस निहित धार्मिक भाव को रखता है, बिना ‘परमेश्वर’ को मूल पाठ में जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘यहूदा के साथी’ और ‘शत्रुओं से युद्ध छेड़ दिया’ सामान्य पाठक के लिए स्पष्ट हैं। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में शामिल हैं।
