base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/021.yaml
  text: When Maccabeus saw the presence of the crowds[a], the varied array of weapons, and the savagery of the beasts positioned advantageously, he stretched out his hands to heaven and called on the wonder-working Lord, knowing that victory is not secured by weapons, but that, whenever it is judged right by him[b], he grants it to those who are worthy.
translation:
  language: hi
  text: जब मक्काबी ने लोगों की भारी भीड़, तरह-तरह के हथियारों की सज्जा और रणनीतिक स्थान पर तैनात पशुओं[a] की उग्रता देखी, तो उसने अपने हाथ आकाश की ओर उठाए और अद्भुत काम करने वाले प्रभु[b] को पुकारा। वह जानता था कि विजय हथियारों से प्राप्त नहीं होती, बल्कि प्रभु अपने निर्णय के अनुसार उसे योग्य लोगों को प्रदान करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संदर्भ में “पशुओं” से संभवतः युद्ध में प्रयुक्त हाथी अभिप्रेत हैं, यद्यपि यहाँ यूनानी पाठ केवल “पशु” कहता है।
    reason: cultural_note
  - marker: b
    text: या “चमत्कार करने वाले प्रभु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδών
  choice: देखी
  rationale: यह कृदंत युद्धभूमि की पूरी स्थिति को ध्यान से देखकर समझने का भाव देता है। हिंदी में ‘देखी’ सरल और स्वाभाविक है तथा संदर्भ में इस व्यापक अवलोकन को समेटता है।
- source_word: τὴν τῶν πλήθων παρουσίαν
  choice: लोगों की भारी भीड़
  rationale: शाब्दिक रूप से यह ‘भीड़ों की उपस्थिति’ है, पर युद्ध के संदर्भ में विरोधी जनसमूह की विशालता अभिप्रेत है। ‘भारी भीड़’ मूल अर्थ को स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: τῶν ὅπλων τὴν ποικίλην παρασκευήν
  choice: तरह-तरह के हथियारों की तैयारी
  rationale: παρασκευή तैयारी अथवा साज-सामान का बोध करा सकता है। हथियारों के साथ प्रयुक्त होने पर यह विविध सैन्य तैयारी और सज्जा, दोनों की ओर संकेत करता है।
- source_word: θηρίων
  choice: पशुओं
  rationale: मूल यूनानी केवल ‘पशु/हिंस्र पशु’ कहता है। संदर्भ में संभवतः युद्ध के हाथी अभिप्रेत हैं, किंतु मुख्य पाठ में ‘हाथी’ जोड़ने से अधिक स्पष्टता आ जाती; इसलिए पहचान को पादटिप्पणी में रखा गया है।
- source_word: ἐπὶ μέρος εὔκαιρον
  choice: रणनीतिक स्थान पर तैनात
  rationale: यह वाक्यांश पशुओं को किसी अनुकूल या सामरिक दृष्टि से उपयोगी स्थान पर लगाए जाने का संकेत देता है।
- source_word: ἀγριότητα
  choice: उग्रता
  rationale: यह पशुओं की जंगली हिंस्रता और भयावह प्रचंडता व्यक्त करता है। ‘उग्रता’ आधुनिक हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀνατείνας χεῖρας εἰς τὸν οὐρανόν
  choice: अपने हाथ आकाश की ओर उठाए
  rationale: यह प्रार्थना की पारंपरिक शारीरिक मुद्रा को स्पष्ट और सहज हिंदी में सुरक्षित रखता है।
- source_word: τερατοποιὸν
  choice: अद्भुत काम करनेवाले
  rationale: यह विशेषण प्रभु को असाधारण और विस्मयकारी कार्य करनेवाला बताता है। यह अनुवाद ‘चमत्कार करनेवाले’ की अपेक्षा थोड़ा व्यापक है और मूल की अर्थ-सीमा बनाए रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: प्रार्थना के संदर्भ में यह परमेश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ मानक और गरिमापूर्ण हिंदी रूप है।
- source_word: οὐκ ἐν ὅπλοις
  choice: विजय हथियारों के बल पर नहीं मिलती
  rationale: यूनानी में ‘हथियारों में नहीं’ संक्षिप्त रूप से कहा गया है। हिंदी में निहित ‘विजय’ को स्पष्ट करके वाक्य को स्वाभाविक बनाया गया है, बिना सभी मानवीय साधनों का पूर्ण निषेध जोड़े।
- source_word: καθὼς δὲ ἐὰν αὐτῷ κριθῇ
  choice: बल्कि प्रभु जैसा उचित समझता है
  rationale: यह प्रभु के निर्णय और विवेक के अनुसार विजय दिए जाने का भाव रखता है। ‘उचित समझता है’ मूल के निष्क्रिय ‘उसके द्वारा जैसा निर्णय किया जाए’ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τοῖς ἀξίοις περιποιεῖται τὴν νίκην
  choice: वह योग्य लोगों को विजय प्रदान करता है
  rationale: περιποιεῖται यहाँ किसी के लिए विजय प्राप्त कराने या देने का भाव रखता है। ‘योग्य’ मूल के मूल्यांकनात्मक शब्द को सुरक्षित रखता है, पर योग्यता के आधार के विषय में कोई अतिरिक्त सिद्धांत नहीं जोड़ता।
theological_decisions:
- issue: विजय में ईश्वरीय और सैन्य साधनों की भूमिका
  choice: विजय को हथियारों के बल के बजाय प्रभु के निर्णयानुसार दिया गया बताया गया है।
  alternative: इसे इस पूर्ण दावे के रूप में पढ़ना कि युद्ध में मानवीय साधनों की कोई भूमिका नहीं होती।
  rationale: मूल पाठ हथियारों पर निर्भरता और प्रभु द्वारा विजय दिए जाने में विरोध स्थापित करता है, पर हर मानवीय साधन की भूमिका पर व्यवस्थित सिद्धांत प्रस्तुत नहीं करता।
- issue: ‘योग्य’ लोगों को विजय
  choice: τοῖς ἀξίοις का सीधा अर्थ ‘योग्य लोगों’ के रूप में रखा गया है।
  alternative: इसे ऐसी यांत्रिक योग्यता के रूप में समझाना जिसके कारण लोग विजय अर्जित कर लेते हैं।
  rationale: पद योग्यता का मूल्यांकनात्मक भाव रखता है, पर यह नहीं बताता कि वह योग्यता किस आधार पर है। इसलिए इस धार्मिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- issue: प्रभु के निर्णय का स्वरूप
  choice: ‘प्रभु जैसा उचित समझता है’ द्वारा उसके स्वतंत्र निर्णय को व्यक्त किया गया है।
  alternative: इसे केवल पहले से निश्चित नियम या मनुष्य की योग्यता से बाध्य निर्णय मानना।
  rationale: αὐτῷ κριθῇ विजय को प्रभु के निर्णय पर निर्भर बताता है; पाठ उस निर्णय को किसी विस्तृत तंत्र में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। सैन्य दृश्य को स्पष्ट करने के लिए ‘भारी भीड़’ और ‘रणनीतिक स्थान पर तैनात’ जैसे स्वाभाविक पद चुने गए हैं। मूल की धार्मिक अस्पष्टता—विशेषकर प्रभु का निर्णय और ‘योग्य’ लोगों का उल्लेख—बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखी गई है।
