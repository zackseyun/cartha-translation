  text: Then in this way there appeared a man distinguished by his gray hair and glory[b][a], and the majesty surrounding him was in some way marvelous and most splendid.
translation:
  language: hi
  text: फिर इसी प्रकार एक पुरुष दिखाई दिया, जो अपने श्वेत केशों और महिमा के कारण विशिष्ट था[a]; और उसके चारों ओर की गरिमा[b] अद्भुत और अत्यन्त भव्य थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “श्वेत केशों और महिमा में उत्कृष्ट था।” यूनानी में यह वर्णन एक संक्षिप्त कृदन्तीय वाक्यांश में है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “उसके चारों ओर की श्रेष्ठता”; यहाँ इससे उसके चारों ओर दिखाई देने वाली असाधारण गरिमा अभिप्रेत है।
    reason: lexical_alternative
