  to: और यदि यह अच्छी तरह लिखा गया है और इसकी रचना उचित ढंग से की गई है, तो यही मेरी भी इच्छा थी; लेकिन यदि यह निम्न स्तर का और केवल औसत है,[a] तो इतना ही मेरी सामर्थ्य में था।
