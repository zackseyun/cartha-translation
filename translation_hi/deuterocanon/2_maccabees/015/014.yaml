  text: Then Onias answered and said[a], “This is Jeremiah, the prophet of God, who loves his brothers and prays much for the people and the holy city.”
translation:
  language: hi
  text: तब ओनियास ने उत्तर में कहा, “यह यिर्मयाह है, परमेश्वर का भविष्यद्वक्ता, जो अपने भाइयों से प्रेम करता है[a] और लोगों तथा पवित्र नगर के लिए बहुत प्रार्थना करता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “जो भाइयों से प्रेम करता है।” यूनानी शब्द φιλάδελφος का अर्थ ‘भाई-प्रेमी’ है और यहाँ अपने सजातीय लोगों के प्रति पारिवारिक स्नेह को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντα … εἰπεῖν
  choice: उत्तर में कहा
  rationale: यह अभिव्यक्ति यूनानी के ‘उत्तर देकर कहना’ को स्वाभाविक हिन्दी में व्यक्त करती है और दोनों क्रियात्मक तत्वों को अनावश्यक दोहराव के बिना बनाए रखती है।
- source_word: φιλάδελφος
  choice: जो अपने भाइयों से प्रेम करता है
  rationale: शब्द का शाब्दिक भाव ‘भाइयों से प्रेम रखने वाला’ है। यहाँ ‘अपने भाइयों’ से यिर्मयाह के सजातीय लोगों का पारिवारिक संबंध व्यक्त होता है; इसे केवल ‘लोगों से प्रेम करता है’ कहना मूल रूपक को मिटा देता।
- source_word: πολλὰ προσευχόμενος
  choice: बहुत प्रार्थना करता है
  rationale: πολλά प्रार्थना की प्रचुरता अथवा बारंबारता दर्शाता है। यह हिन्दी वाक्यांश चल रहे मध्यस्थतापूर्ण कार्य को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λαοῦ
  choice: लोगों
  rationale: मूल में किसी स्वत्ववाचक सर्वनाम के बिना निश्चित समुदाय का संकेत है। ‘लोगों’ अनावश्यक रूप से ‘अपने’ जोड़े बिना संदर्भगत परमेश्वर की प्रजा को दर्शाता है।
- source_word: ἁγίας πόλεως
  choice: पवित्र नगर
  rationale: यह पदबंध नगर से जुड़ी पवित्रता को सीधे बनाए रखता है और संदर्भ में यरूशलेम की ओर संकेत करता है।
- source_word: ὁ τοῦ θεοῦ προφήτης
  choice: परमेश्वर का भविष्यद्वक्ता
  rationale: यह यूनानी संबंधवाचक रचना का स्पष्ट, प्रचलित और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: दर्शन के प्रसंग में यिर्मयाह के φιλάδελφος होने और प्रजा के लिए उसकी प्रार्थना का वर्णन
  choice: जो अपने भाइयों से प्रेम करता है
  alternative: भाइयों से प्रेम रखने वाला
  rationale: चुना हुआ रूप जातीय और पारिवारिक आत्मीयता को सुरक्षित रखता है, पर यह तय नहीं करता कि ‘भाई’ केवल सगे भाई हैं या व्यापक रूप से उसके सजातीय लोग। इस प्रकार मूल की सामुदायिक निकटता और यिर्मयाह की मध्यस्थतापूर्ण प्रार्थना दोनों बनी रहती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘उत्तर में कहा’ कथात्मक प्रवाह को स्वाभाविक बनाता है; ‘अपने भाइयों’ मूल के पुरुषवाचक पारिवारिक शब्द को बनाए रखता है।
