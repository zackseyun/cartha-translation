  text: And when he arrived there[a], he called together his fellow countrymen and the priests, stood them before the altar, and sent for those from the citadel.
translation:
  language: hi
  text: जब वह वहाँ पहुँचा, तो उसने अपने देशबन्धुओं और याजकों को इकट्ठा किया, उन्हें वेदी के सामने खड़ा किया, और गढ़ के लोगों को बुलवाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενος
  choice: जब वह वहाँ पहुँचा
  rationale: अओरिस्ट कृदंत मुख्य क्रियाओं से पहले की घटना बताता है; यह रूप हिन्दी में स्वाभाविक कालक्रम व्यक्त करता है।
- source_word: συγκαλεσάμενος
  choice: उसने ... इकट्ठा बुलाया
  rationale: मध्यवाच्य कृदंत लोगों को सभा के लिए एक साथ बुलाने का भाव रखता है; ‘इकट्ठा बुलाया’ उस आह्वान को स्पष्ट रखता है।
- source_word: τοὺς ὁμοεθνεῖς
  choice: अपने स्वजातियों
  rationale: ὁμοεθνής समान जातीय या राष्ट्रीय समुदाय के लोगों को दर्शाता है। ‘स्वजातियों’ यहूदी पहचान को संदर्भ से अधिक स्पष्ट किए बिना सुरक्षित रखता है।
- source_word: τοὺς ἱερεῖς
  choice: याजकों
  rationale: बहुवचन संज्ञा का सीधा और प्रतिष्ठित हिन्दी रूप।
- source_word: πρὸ τοῦ θυσιαστηρίου στῆσας
  choice: उन्हें वेदी के सामने खड़ा किया
  rationale: στῆσας को यहाँ सकर्मक समझना वाक्यक्रम में पहले उल्लिखित स्वजातियों और याजकों को निहित कर्म मानता है। यूनानी में व्यक्त कर्म नहीं है, इसलिए दूसरा पाठ सम्भव है और उसे टिप्पणी में सुरक्षित रखा गया है।
- source_word: μετεπέμψατο
  choice: बुलवा भेजा
  rationale: क्रिया किसी को अपने पास आने के लिए संदेश भेजकर बुलाने का अर्थ देती है; यह हिन्दी प्रयोग पहल और बुलावे दोनों को व्यक्त करता है।
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: गढ़ में रहनेवालों
  rationale: ἐκ यहाँ उस स्थान से सम्बद्ध या वहाँ उपस्थित लोगों को सूचित करता है। ‘गढ़’ सामान्य पाठक के लिए सुलभ है, जबकि यरूशलेम के विशिष्ट ‘अक्रा’ की पहचान पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: πρὸ τοῦ θυσιαστηρίου στῆσας में στῆσας का सकर्मक या अकर्मक अर्थ
  choice: उन्हें वेदी के सामने खड़ा किया
  alternative: वह वेदी के सामने खड़ा हुआ
  rationale: στῆσας का रूप सकर्मक हो सकता है और निकटवर्ती समूह निहित कर्म बन सकता है; फिर भी व्यक्त कर्म के अभाव के कारण अकर्मक पाठ वास्तविक सम्भावना है, अतः उसे पाद-टिप्पणी में रखा गया है।
- issue: मक्काबी यरूशलेम में ἄκρα का निर्देश
  choice: गढ़
  alternative: अक्रा
  rationale: मुख्य पाठ में सामान्य अर्थ पठनीय है; ऐतिहासिक रूप से यरूशलेम के विशिष्ट किले ‘अक्रा’ की सम्भावित पहचान पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण शैली। ‘याजक’, ‘वेदी’ और ‘गढ़’ सामान्य बाइबलीय पाठकों के लिए परिचित हैं। मुख्य पाठ में [b] चिह्न जोड़ा जाना आवश्यक है ताकि सूचीबद्ध पाद-टिप्पणी का चिह्न पाठ में उपस्थित रहे।
