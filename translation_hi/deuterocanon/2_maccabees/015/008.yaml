  yaml_path: translation/deuterocanon/2_maccabees/015/008.yaml
  text: And he urged those with him not to fear the attack of the nations, but to keep in mind the help that had previously come to them from heaven, and now to expect the victory that would come to them from the Almighty.
translation:
  language: hi
  text: और वह जो उसके साथ थे, उनसे आग्रह करता रहा कि वे राष्ट्रों के आक्रमण से न डरें, बल्कि उन्हें पहले स्वर्ग से जो सहायता मिली थी उसे मन में रखें, और अब उस विजय की आशा करें जो सर्वशक्तिमान की ओर से उन्हें मिलने वाली थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλει
  choice: समझाता रहा
  rationale: अपूर्ण भूतकाल निरंतर प्रोत्साहन या आग्रह का भाव देता है। ‘समझाता रहा’ आधुनिक हिन्दी में इस सतत प्रेरणा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς σὺν αὐτῷ
  choice: अपने साथ के लोगों को
  rationale: यह यहूदा के साथ उपस्थित उसके लोगों को सूचित करता है और यूनानी वाक्यांश का सहज, अनावश्यक विस्तार से रहित अनुवाद है।
- source_word: μὴ δειλιᾷν
  choice: न डरें
  rationale: क्रिया भय के कारण पीछे हटने या साहस खोने का संकेत दे सकती है। युद्ध के प्रसंग में ‘न डरें’ स्पष्ट और स्वाभाविक है।
- source_word: τὴν τῶν ἐθνῶν ἔφοδον
  choice: जातियों के आक्रमण से
  rationale: ἔφοδος शत्रुतापूर्ण चढ़ाई या आक्रमण है। ἐθνῶν को ‘जातियों’ कहना मूल की व्यापकता बनाए रखता है और ‘अन्यजातियों’ से उत्पन्न हो सकने वाले अनावश्यक धार्मिक विशेषार्थ से बचता है।
- source_word: ἔχοντας δὲ κατὰ νοῦν
  choice: बल्कि … मन में रखें
  rationale: यह सहभागी रचना मुख्य आग्रह के साथ चलने वाली मानसिक मुद्रा बताती है। ‘मन में रखें’ आधुनिक हिन्दी में स्वाभाविक है और स्मरण के साथ सचेत ध्यान का भाव बनाए रखता है।
- source_word: τὰ προγεγονότα αὐτοῖς ἀπʼ οὐρανοῦ βοηθήματα
  choice: स्वर्ग से पहले मिली सहायता
  rationale: προγεγονότα पिछली घटनाओं की ओर और βοηθήματα सहायता के कार्यों या साधनों की ओर संकेत करता है। हिन्दी में सामूहिक अर्थ वाला एकवचन ‘सहायता’ सहज है और पूर्व में मिली दैवी मदद का भाव स्पष्ट करता है।
- source_word: τὰ νῦν προσδοκᾷν
  choice: अब … आशा रखें
  rationale: προσδοκᾷν यहाँ भरोसे के साथ आगे की बाट देखने का भाव देता है। ‘आशा रखें’ प्रत्याशा और विश्वास दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν παρὰ τοῦ παντοκράτορος ἐσομένην αὐτοῖς νίκην
  choice: उस विजय … जो सर्वशक्तिमान की ओर से उन्हें मिलने वाली थी
  rationale: ἐσομένην भविष्य में मिलने वाली विजय बताता है और παρά उसके स्रोत को। यह रूप विजय को मनुष्य की उपलब्धि मात्र न बताकर सर्वशक्तिमान की ओर से मिलने वाली बनाए रखता है।
theological_decisions:
- issue: παντοκράτωρ दैवी उपाधि का अनुवाद
  choice: सर्वशक्तिमान
  alternative: सर्वसामर्थी
  rationale: ‘सर्वशक्तिमान’ आधुनिक हिन्दी बाइबलीय भाषा में स्थापित, स्पष्ट और गरिमापूर्ण दैवी उपाधि है; यह मूल के सामर्थ्य और प्रभुत्व के भाव को बिना अतिरिक्त दार्शनिक व्याख्या के व्यक्त करती है।
- issue: ἐθνῶν की पहचान
  choice: जातियों
  alternative: अन्यजातियों
  rationale: प्रसंग में विरोधी गैर-यहूदी समुदाय अभिप्रेत हैं, पर मूल पद स्वयं सामान्यतः ‘जातियाँ/राष्ट्र’ कहता है। ‘जातियों’ पाठ की व्यापकता और प्रसंगगत तनाव को बनाए रखता है, जबकि ‘अन्यजातियों’ धार्मिक वर्गीकरण को अधिक स्पष्ट कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में सैन्य प्रसंग की गंभीरता, बीती स्वर्गीय सहायता का स्मरण और आने वाली विजय की भरोसेपूर्ण प्रतीक्षा—तीनों को संतुलित रखा गया है।
