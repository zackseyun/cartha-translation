  yaml_path: translation/deuterocanon/2_maccabees/015/040.yaml
  text: For just as drinking wine by itself[a], and then again water, is unpleasant, but wine mixed with water becomes pleasing and produces delight, so also the style of the composition delights the ears of those who read the work. Here, then, will be the end.
translation:
  language: hi
  text: क्योंकि जैसे अकेले दाखमधु को पीना, और उसी तरह केवल पानी को पीना, अरुचिकर है[a], पर पानी में मिलाया हुआ दाखमधु मनभावन बनता है और आनंद उत्पन्न करता है, वैसे ही रचना की शैली इस कृति को पढ़नेवालों के कानों को आनंद देती है। तो यहीं अंत होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: ‘और उसी प्रकार पानी भी शत्रुतापूर्ण है।’ संदर्भ में आशय यह है कि अकेला दाखमधु और अकेला पानी—दोनों उचित मिश्रण की अपेक्षा कम सुखद हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: क्योंकि जैसे
  rationale: यह संयोजक लेखक के अंतिम कथन को समझाने वाली उपमा आरंभ करता है; ‘क्योंकि जैसे’ उसके व्याख्यात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἶνον κατὰ μόνας πίνειν
  choice: केवल दाखमधु पीना
  rationale: κατὰ μόνας का अर्थ ‘अकेला/अपने आप में’ है। ‘केवल दाखमधु’ मूल के निकट रहते हुए अगले ‘केवल पानी’ के साथ संतुलित तुलना बनाता है।
- source_word: ὕδωρ πάλιν πολέμιον
  choice: और फिर केवल पानी पीना, अरुचिकर होता है
  rationale: πολέμιον का शाब्दिक अर्थ ‘शत्रुतापूर्ण’ है, पर पेय के संदर्भ में आशय अप्रिय या अरुचिकर होना है। क्रिया और ‘केवल’ सन्दर्भ से ग्रहण किए गए हैं ताकि हिन्दी में तुलना स्पष्ट और स्वाभाविक रहे।
- source_word: συγκερασθεὶς
  choice: पानी में मिला हुआ
  rationale: यह पानी के साथ दाखमधु के मिश्रण को बताता है; ‘मिला हुआ’ सीधा और सहज हिन्दी रूप है।
- source_word: ἐπιτερπῇ τὴν χάριν ἀποτελεῖ
  choice: मनभावन हो जाता और आनंद देता है
  rationale: वाक्यांश मिश्रण से उत्पन्न सुखद प्रभाव और आनंद—दोनों को उभारता है; यह युग्म अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὸ τῆς κατασκευῆς τοῦ λόγου
  choice: वृत्तांत की सुगढ़ रचना
  rationale: κατασκευή साहित्यिक विन्यास या निर्माण और λόγος यहाँ लिखित वृत्तांत को सूचित करता है। ‘सुगढ़ रचना’ लेखक की कलात्मक प्रस्तुति पर बल बनाए रखती है।
- source_word: τέρπει τὰς ἀκοὰς
  choice: कानों को आनंद देती है
  rationale: मूल का श्रवण-संबंधी रूपक जानबूझकर सुरक्षित रखा गया है, यद्यपि आगे पाठकों का उल्लेख है।
- source_word: τῶν ἐντυγχανόντων τῇ συντάξει
  choice: इस कृति को पढ़नेवालों के
  rationale: ἐντυγχάνω लिखित रचना के संदर्भ में ‘पढ़ना’ हो सकता है और σύνταξις व्यवस्थित कृति या रचना को सूचित करता है।
- source_word: Ἐνταῦθα δὲ ἔσται ἡ τελευτή
  choice: तो यहीं इसका अंत होगा
  rationale: यह पुस्तक का संक्षिप्त और निश्चयात्मक समापन है; ‘तो’ δέ के निष्कर्षात्मक प्रवाह को और ‘यहीं’ Ἐνταῦθα को व्यक्त करता है।
