    text: या, ‘नगर के बाहर खुले स्थान में हुए हमले को लेकर।’ यूनानी वाक्यांश नगर में बंद लोगों और बाहर खुले स्थान में हो रही लड़ाई के बीच विरोध दिखाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατειλημμένοις
  choice: घिरे हुए
  rationale: पूर्ण कर्मवाच्य कृदन्त यहाँ नगर के भीतर परिस्थितियों से घिरे या बंद लोगों का बोध कराता है। ‘घिरे हुए’ दबाव और संभावित घेराबंदी का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐ πάρεργος
  choice: कोई मामूली बात नहीं थी
  rationale: यह मुहावरा चिंता को गौण या तुच्छ न बताकर उसकी गंभीरता पर बल देता है; यह हिन्दी प्रयोग उसी बल को सहज ढंग से व्यक्त करता है।
- source_word: ἀγωνία
  choice: चिंता
  rationale: शब्द तीव्र मानसिक तनाव और आशंका दर्शाता है। ‘चिंता’ प्रसंग के अनुरूप सरल है, जबकि आगे का ‘व्याकुल’ इसकी तीव्रता स्पष्ट करता है।
- source_word: ταρασσομένοις
  choice: वे व्याकुल थे
  rationale: कृदन्त उनकी चिंता की दशा या कारण को खोलता है। ‘व्याकुल थे’ भावनात्मक उद्विग्नता को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τῆς ἐν ὑπαίθρῳ προσβολῆς
  choice: खुले मैदान में होने वाले आक्रमण को लेकर
  rationale: προσβολή सैनिक आक्रमण है और ἐν ὑπαίθρῳ नगर के विपरीत बाहर खुले स्थान में घट रही लड़ाई को सूचित करता है। यह अनुवाद स्थानगत विरोध बनाए रखता है।
