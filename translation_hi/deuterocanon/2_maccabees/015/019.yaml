translation:
  language: hi
  text: और नगर में बंद लोगों के लिए भी चिंता कोई छोटी बात नहीं थी, क्योंकि वे खुले मैदान में हुए आक्रमण[a] को लेकर व्याकुल थे।
  philosophy: optimal-equivalence
  footnotes:
