base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/027.yaml
  text: And while fighting with their hands[a], they were praying in their hearts to God, and they struck down no fewer than thirty-five thousand and four hundred[b], having been greatly gladdened by the care of God.
translation:
  language: hi
  text: वे अपने हाथों से लड़ते हुए अपने हृदयों में परमेश्वर से प्रार्थना कर रहे थे; उन्होंने कम-से-कम पैंतीस हज़ार चार सौ लोगों को मार गिराया[a], और परमेश्वर की देखभाल से बहुत आनंदित हुए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में संख्या का शब्द-विन्यास संक्षिप्त अथवा अनियमित है; अभिप्रेत कुल पैंतीस हज़ार चार सौ है।
    reason: textual_variant
  - marker: b
    text: या, “परमेश्वर की देखरेख से बहुत हर्षित हुए।” यूनानी का अधिक शाब्दिक अर्थ “परमेश्वर की देखभाल” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῖς μὲν χερσὶν ἀγωνιζόμενοι
  choice: हाथों से लड़ते हुए
  rationale: ἀγωνίζομαι यहाँ युद्ध में संघर्ष करने का बोध देता है। यह अनुवाद शारीरिक युद्ध और अगले वाक्यांश में हृदय से की गई प्रार्थना के बीच का विरोध बनाए रखता है।
- source_word: ταῖς δὲ καρδίαις πρὸς τὸν θεὸν εὐχόμενοι
  choice: हृदय से परमेश्वर से प्रार्थना कर रहे थे
  rationale: καρδίαις बाहरी युद्ध के विपरीत आंतरिक प्रार्थना का क्षेत्र या साधन सूचित करता है। हिंदी में एकवचन भाववाचक ‘हृदय से’ सामूहिक कर्ता के साथ स्वाभाविक है और मूल चित्र को बनाए रखता है।
- source_word: κατέστρωσαν
  choice: मार गिराया
  rationale: सैन्य प्रसंग में यह क्रिया शत्रुओं को धराशायी करने या मार गिराने का अर्थ देती है। ‘मार गिराया’ वर्तमान हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: οὐδὲν ἧττον
  choice: से कम लोगों को नहीं
  rationale: यह मुहावरा बताई गई संख्या को न्यूनतम सीमा के रूप में बल देता है; हिंदी में यह रूप उसी बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μυριάδων πένθων καὶ τετρακισχιλίων
  choice: पैंतीस हज़ार चार सौ
  rationale: प्रेषित यूनानी संख्या-वाक्यांश संक्षिप्त अथवा अनियमित है, पर अभिप्रेत कुल 35,400 समझा जाता है। मुख्य पाठ में स्पष्ट कुल दिया गया है और पाठगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῇ τοῦ θεοῦ μεγάλως ἐφρανθέντες ἐπιμελείᾳ
  choice: परमेश्वर की देखभाल के कारण वे बहुत आनंदित हुए
  rationale: ἐπιμέλεια का मूल अर्थ देखभाल, ध्यान या चिंता है; ‘देखभाल’ किसी अधिक तकनीकी धर्मवैज्ञानिक अर्थ को जोड़े बिना इसे व्यक्त करता है। ἐφρανθέντες का आनंदित होने का भाव स्पष्ट रखा गया है।
theological_decisions:
- issue: τοῦ θεοῦ ἐπιμελείᾳ को सामान्य ‘देखभाल’ के रूप में अनुवादित किया जाए या धर्मवैज्ञानिक ‘ईश्वरीय विधान/प्रबंध’ के रूप में
  choice: परमेश्वर की देखभाल
  alternative: परमेश्वर का प्रबंध / परमेश्वर की विधानपूर्ण देखभाल
  rationale: ἐπιμέλεια सीधे देखभाल और ध्यान का बोध देता है। प्रसंग में ईश्वरीय प्रबंध निहित हो सकता है, पर अधिक तकनीकी शब्द मूल कथन से आगे जाता; इसलिए व्यापक अर्थ-संभावना को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण युद्ध-वर्णन। ‘हाथों’ और ‘हृदय’ का विरोध मूल यूनानी के बाहरी संघर्ष और आंतरिक प्रार्थना के तनाव को बनाए रखता है। संख्या की पाठगत अनियमितता मुख्य पाठ को बोझिल किए बिना पादटिप्पणी में दी गई है।
