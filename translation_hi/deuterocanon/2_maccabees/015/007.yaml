lexical_decisions:
- source_word: ὁ δὲ Μακκαβαῖος
  choice: परन्तु मक्काबी
  rationale: δὲ के विरोधसूचक प्रवाह को ‘परन्तु’ से व्यक्त किया गया; Μακκαβαῖος को प्रचलित हिन्दी नाम-रूप ‘मक्काबी’ में रखा गया।
- source_word: ἦν ἀδιαλείπτως πεποιθὼς
  choice: को निरन्तर पूरा भरोसा था
  rationale: πεποιθώς की स्थायी, दृढ़ आश्वस्त अवस्था और ἀδιαλείπτως की निरन्तरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετὰ πάσης ἐλπίδος
  choice: पूरा भरोसा
  rationale: शाब्दिक ‘हर आशा के साथ’ हिन्दी में अस्वाभाविक है; यह पद मक्काबी के भरोसे की पूर्णता को बल देता है, जिसे ‘पूरा भरोसा’ में समाहित किया गया है।
- source_word: ἀντιλήμψεως τεύξεσθαι
  choice: सहायता पाएगा
  rationale: τεύξομαι का अर्थ प्राप्त करना और ἀντίλημψις का अर्थ सहायता/सहारा है; ‘सहायता पाएगा’ सहज और अर्थनिष्ठ है।
- source_word: παρὰ τοῦ κυρίου
  choice: प्रभु से
  rationale: παρά के स्रोतगत अर्थ को ‘से’ और κυρίου को सम्मानित सामान्य रूप ‘प्रभु’ से व्यक्त किया गया।
theological_decisions:
- issue: मक्काबी के विश्वास और अपेक्षित सहायता का संबंध
  choice: उसे दृढ़ भरोसा था कि वह प्रभु से सहायता पाएगा
  alternative: प्रभु की सहायता की निश्चित गारंटी को कथावाचक का स्वतंत्र दावा मानना
  rationale: यूनानी वाक्य मक्काबी की निरन्तर आश्वस्त अवस्था बताता है; अनुवाद उसी दृष्टिकोण को बनाए रखता है और परिणाम के बारे में अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
