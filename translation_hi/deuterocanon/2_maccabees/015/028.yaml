  yaml_path: translation/deuterocanon/2_maccabees/015/028.yaml
  text: But once they were relieved of the pressure, and as they withdrew with joy[c][b][a], they recognized Nikanor fallen forward with his armor.
translation:
  language: hi
  text: पर जब वे उस दबाव से मुक्त होकर आनन्द के साथ प्रस्थान कर रहे थे,[a] तब उन्होंने निकानोर को उसके पूरे युद्ध-कवच समेत आगे को गिरा पड़ा हुआ पहचाना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उस दबाव से मुक्त होकर’ का अनुवाद ‘उस आवश्यकता से मुक्त होकर’ या ‘उस संकट से छुटकारा पाकर’ भी हो सकता है; यूनानी अभिव्यक्ति मुहावरेदार है। ‘प्रस्थान कर रहे थे’ का अनुवाद ‘वहाँ से जा रहे थे’ या ‘वहाँ से हट रहे थे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘आगे को गिरा पड़ा हुआ’ का अनुवाद ‘गिरा पड़ा हुआ’ या ‘आगे की ओर गिरा हुआ’ भी हो सकता है। यूनानी शब्द आगे की दिशा का संकेत दे सकता है, पर यह स्पष्ट नहीं करता कि वह मुँह के बल पड़ा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: γεγυμνωμένοι ἀπὸ τῆς χρείας
  choice: उस संकट से मुक्त होकर
  rationale: γεγυμνωμένοι का शाब्दिक अर्थ ‘उतार दिया गया/विहीन किया गया’ है, पर ἀπὸ τῆς χρείας के साथ यह किसी दबावपूर्ण आवश्यकता या संकट से छुटकारा पाने का मुहावरेदार भाव देता है। युद्ध-प्रसंग में ‘संकट से मुक्त’ स्वाभाविक और स्रोत-संगत है।
- source_word: μετὰ χαρᾶς ἀναλύοντες
  choice: आनन्द के साथ वहाँ से हट रहे थे
  rationale: ἀναλύω यहाँ प्रस्थान करने या स्थान छोड़ने का भाव रखता है। ‘वहाँ से हट रहे थे’ सैन्य प्रसंग में उपयुक्त है और अनिश्चित ‘लौट रहे थे’ को पाठ में नहीं जोड़ता।
- source_word: ἐπέγνωσαν
  choice: पहचाना
  rationale: ἐπιγινώσκω यहाँ स्पष्ट रूप से पहचान लेने का अर्थ देता है—उन्होंने गिरे हुए व्यक्ति को निकानोर के रूप में पहचाना।
- source_word: προπεπτωκότα
  choice: मुँह के बल पड़ा
  rationale: προπίπτω आगे की ओर गिरने का संकेत दे सकता है। ‘मुँह के बल पड़ा’ हिन्दी में उस दिशात्मक भाव को स्वाभाविक रूप से व्यक्त करता है, यद्यपि सामान्य ‘गिरा पड़ा’ भी संभव है।
- source_word: σὺν τῇ πανοπλίᾳ
  choice: अपने पूरे युद्ध-कवच समेत
  rationale: πανοπλία संपूर्ण शस्त्र-सज्जा या पूरा कवच दर्शाता है। ‘पूरा युद्ध-कवच’ केवल ‘कवच’ की तुलना में इस पूर्णता को स्पष्ट रखता है।
