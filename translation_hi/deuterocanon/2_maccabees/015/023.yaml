base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/023.yaml
  text: And now[a], O Sovereign of the heavens, send a good angel before us for fear and trembling.
translation:
  language: hi
  text: और अब, हे स्वर्गों के अधिपति, हमारे आगे एक भला स्वर्गदूत भेज, ताकि भय और थरथराहट छा जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “भय और थरथराहट के लिए।” यूनानी पाठ यह स्पष्ट नहीं करता कि भय किसे होगा, यद्यपि प्रसंग शत्रुओं की ओर संकेत करता है।'
    reason: मूल यूनानी में प्रयोजन या परिणाम का भाव है, पर भय अनुभव करने वाला पक्ष अनकहा है।
lexical_decisions:
- source_word: δυνάστα
  choice: अधिपति
  rationale: यह संबोधन सामर्थ्य के साथ प्रभुतापूर्ण शासन का भाव व्यक्त करता है; ‘अधिपति’ प्रार्थना के गरिमापूर्ण स्वर में स्वाभाविक है।
- source_word: τῶν οὐρανῶν
  choice: स्वर्गों के
  rationale: यूनानी में बहुवचन है; उसे बनाए रखने से मूल रूप और ऊँचा काव्यात्मक-पवित्रशास्त्रीय स्वर सुरक्षित रहता है।
- source_word: ἀπόστειλον
  choice: भेज
  rationale: अओरिस्ट आज्ञार्थक यहाँ सीधी प्रार्थनात्मक विनती है; हिंदी में ‘भेज’ उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: ἄγγελον ἀγαθὸν
  choice: एक भला स्वर्गदूत
  rationale: सैन्य प्रार्थना के संदर्भ में ἄγγελος एक स्वर्गीय दूत को दर्शाता है। ‘भला’ ἀγαθός के सामान्य अर्थ को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: ἔμπροσθεν ἡμῶν
  choice: हमारे आगे
  rationale: यह सेना से पहले जाने का स्थानिक और अगुवाई-संबंधी दोनों भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: εἰς δέος καὶ τρόμον
  choice: ताकि भय और थरथराहट छा जाए
  rationale: εἰς यहाँ प्रयोजन या परिणाम का भाव दे सकता है। यह रूप हिंदी में स्वाभाविक है और भय किस पर छाएगा, यह स्पष्ट रूप से जोड़े बिना वाक्य का आशय संप्रेषित करता है।
theological_decisions:
- issue: ‘भय और थरथराहट’ किसकी है
  choice: वाक्य को इस प्रकार रखा गया है कि स्वर्गदूत के भेजे जाने से भय और थरथराहट उत्पन्न हो, पर यह नहीं बताया गया कि वह किस पर छाएगी।
  alternative: संदर्भ के आधार पर सीधे ‘शत्रुओं में भय और थरथराहट भर दे’ कहना।
  rationale: तात्कालिक सैन्य संदर्भ शत्रु सेना की ओर संकेत करता है, किंतु यूनानी पाठ किसी व्यक्ति या समूह को स्पष्ट नहीं करता। इसलिए अनुवाद वास्तविक अस्पष्टता को बनाए रखता है और टिप्पणी में संभावित संदर्भ बताता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिंदी। ‘स्वर्गों’ से मूल का बहुवचन और ‘अधिपति’ से अधिकारपूर्ण संबोधन सुरक्षित रखा गया है। क्रिया ‘भेज’ एकवचन निकट/प्रत्यक्ष संबोधन के रूप में प्रार्थना की तीव्रता बनाए रखती है।
