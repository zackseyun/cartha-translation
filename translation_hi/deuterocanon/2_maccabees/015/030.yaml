base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/030.yaml
  text: And he ordered that the head of Nikanor[a], and the hand with the shoulder, be cut off and carried to Jerusalem—he who with his whole body and soul had fought in the forefront for the citizens, and who had preserved from youth his goodwill toward his fellow countrymen.
translation:
  language: hi
  text: तब उसने—जिसने अपने पूरे शरीर और प्राण से नागरिकों के लिए सबसे आगे रहकर संघर्ष किया था और युवावस्था से ही अपने देशबंधुओं के प्रति सद्भाव बनाए रखा था—आज्ञा दी कि निकानोर का सिर और कंधे समेत उसका हाथ[a] काटकर यरूशलेम ले जाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कंधे समेत उसकी बाँह’; यूनानी में शाब्दिक रूप से ‘कंधे समेत हाथ’ है, पर आशय संभवतः कंधे सहित काटे गए पूरे ऊपरी अंग से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक आदेश देने को व्यक्त करती है; ‘आज्ञा दी’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: καθʼ ὅλον σώματι καὶ ψυχῇ
  choice: अपने पूरे शरीर और प्राण से
  rationale: यह चयन मूल के ‘शरीर और प्राण’ वाले चित्र और संपूर्ण समर्पण के बल को बनाए रखता है, बिना इसे केवल ‘पूरे मन से’ में सीमित किए।
- source_word: πρωταγωνιστὴς ὑπὲρ τῶν πολιτῶν
  choice: नागरिकों की ओर से सबसे आगे रहकर संघर्ष किया था
  rationale: πρωταγωνιστής अग्रिम भूमिका निभाने या सबसे आगे लड़ने वाले व्यक्ति को दर्शाता है; ὑπέρ यहाँ नागरिकों की ओर से अथवा उनके हित में संघर्ष का भाव देता है।
- source_word: τὴν τῆς ἡλικίας εὔνοιαν ... διαφυλάξας
  choice: युवावस्था से ही ... सद्भाव बनाए रखा था
  rationale: εὔνοια अनुकूल और हितैषी भाव है, जबकि διαφυλάσσω उसके लगातार बनाए रखने पर बल देता है। ἡλικία इस संदर्भ में युवावस्था/जीवन की अवस्था को सूचित करती है; हिन्दी वाक्यांश दीर्घकालिक निष्ठा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁμοεθνεῖς
  choice: अपने सजातीय लोगों
  rationale: यह शब्द उसी जातीय अथवा राष्ट्रीय समुदाय के लोगों को दर्शाता है। ‘सजातीय लोगों’ उस सामुदायिक एकता को बनाए रखता है, यद्यपि इसे जैविक रिश्तेदारी तक सीमित नहीं करता।
- source_word: ἀποτεμόντας
  choice: काटकर
  rationale: आज्ञा पर आश्रित यह कृदंत सिर और अंग काटे जाने की कार्रवाई बताता है; हिन्दी में ‘आज्ञा दी कि ... काटकर ... ले जाया जाए’ स्वाभाविक है।
- source_word: τὴν χεῖρα σὺν τῷ ὤμῳ
  choice: कंधे समेत उसका हाथ
  rationale: मूल यूनानी में शाब्दिक रूप से ‘कंधे समेत हाथ’ है। मुख्य पाठ उसी असामान्य अभिव्यक्ति को रखता है और व्यापक शारीरिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: περιφέρειν εἰς Ἰερουσαλήμ
  choice: यरूशलेम ले जाया जाए
  rationale: εἰς गंतव्य की ओर गति बताता है। संदर्भ में अंगों को यरूशलेम पहुँचाने का अर्थ स्पष्ट है; ‘घुमाया जाए’ या ‘जुलूस निकाला जाए’ कहना अनावश्यक व्याख्या जोड़ता।
theological_decisions:
- issue: आज्ञा देने वाले व्यक्ति के साथ प्रशंसात्मक उपवाक्यों का संबंध
  choice: दोनों वर्णन आज्ञा देने वाले निहित कर्ता, अर्थात यहूदा मकाबी, के साथ जोड़े गए हैं।
  alternative: इन्हें कथाकार की अपेक्षाकृत स्वतंत्र प्रशंसात्मक टिप्पणी समझा जा सकता है।
  rationale: यूनानी में दोहरे ὁ ... ὁ वाले समानाधिकरण पदबंध स्वाभाविक रूप से προσέταξεν के कर्ता का वर्णन करते हैं। हिन्दी में डैश के भीतर उपवाक्य रखकर यही संबंध स्पष्ट किया गया है, पर नाम मूल पद में न होने के कारण मुख्य पाठ में ‘यहूदा’ नहीं जोड़ा गया।
- issue: σώματι καὶ ψυχῇ का मानव-स्वभाव संबंधी आशय
  choice: ‘शरीर और प्राण’ की मूल अभिव्यक्ति बनाए रखी गई है।
  alternative: ‘तन-मन से’ या ‘अपने पूरे अस्तित्व से’।
  rationale: यहाँ वाक्यांश संपूर्ण समर्पण व्यक्त करता है। मूल शब्दावली रखने से बाद की किसी विशिष्ट शरीर-आत्मा संबंधी धर्मशास्त्रीय व्याख्या को न तो थोपा जाता है, न हटाया जाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। लंबे यूनानी वाक्य की प्रशंसात्मक समानाधिकरण रचना को डैशों के भीतर रखा गया है ताकि कर्ता-संबंध और वाक्य का प्रवाह दोनों स्पष्ट रहें।
