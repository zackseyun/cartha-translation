  yaml_path: translation/deuterocanon/2_maccabees/015/037.yaml
  text: and to keep the thirteenth day of the twelfth month—called Adar in the Syrian language—as a notable day[b][a], one day before Mordecai's day.
translation:
  language: hi
  text: और बारहवें महीने की तेरहवीं तारीख—जिसे स्थानीय भाषा में अदार कहा जाता है[a]—को एक विशेष दिन मानना था; यह मोर्दकै के दिन से एक दिन पहले था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीरियाई भाषा में,” “प्रचलित भाषा में,” अथवा “जनभाषा में।” यहाँ यूनानी वाक्यांश असामान्य है और उसका ठीक आशय अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात मोर्दकै से संबंधित स्मरण-दिवस के पहले का दिन; संभवतः यह पूरिम के उत्सव की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἔχειν
  choice: मानना था
  rationale: पर्व-संबंधी संदर्भ में यह किसी दिन को विशेष रूप से निर्धारित और मान्य रखने का भाव देता है; केवल ‘रखना’ हिंदी में अस्पष्ट होता।
- source_word: ἐπίσημον
  choice: विशेष
  rationale: शब्द का मूल भाव चिह्नित या विशिष्ट होने का है। ‘विशेष’ उत्सव या राजकीय अवकाश का अतिरिक्त अर्थ जोड़े बिना इसे स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: προκαδεκάτην
  choice: तेरहवीं तारीख
  rationale: यह दुर्लभ संयुक्त क्रमवाचक रूप महीने के तेरहवें दिन को सूचित करता है; हिंदी में ‘तेरहवीं तारीख’ स्पष्ट और स्वाभाविक है।
- source_word: δωδεκάτου μηνός
  choice: बारहवें महीने की
  rationale: महीने और तारीख के संबंध को आधुनिक हिंदी की स्वाभाविक संरचना में व्यक्त किया गया है।
- source_word: Ἀδὰρ
  choice: अदार
  rationale: महीने के नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: τῇ κυριακῇ φωνῇ
  choice: स्थानीय भाषा में
  rationale: यूनानी वाक्यांश असामान्य और पाठगत रूप से कठिन है। संदर्भ में यह अदार नाम की स्थानीय अथवा प्रचलित भाषाई संज्ञा बताता प्रतीत होता है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: πρὸ μιᾶς ἡμέρας
  choice: एक दिन पहले
  rationale: यह अगले उल्लिखित दिन से कालगत संबंध को सीधे व्यक्त करता है।
- source_word: τῆς Μαρδοχαϊκῆς ἡμέρας
  choice: मोर्दकै के दिन
  rationale: विशेषण का अर्थ मोर्दकै से संबंधित दिन है। यह अनुवाद पूरिम की संभावित ओर संकेत को स्पष्ट व्याख्या बनाकर मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: ἐπίσημον द्वारा बताए गए पालन का स्वरूप
  choice: एक विशेष दिन मानना
  alternative: उत्सव के रूप में मनाना; राजकीय अवकाश मानना
  rationale: मूल विशेषण दिन को चिह्नित या विशिष्ट बताता है, पर स्वयं औपचारिक धार्मिक पर्व या कानूनी अवकाश होने का पूरा अर्थ नहीं देता।
- issue: τῇ κυριακῇ φωνῇ का अर्थ
  choice: स्थानीय भाषा में
  alternative: सीरियाई भाषा में; प्रचलित भाषा में; जनभाषा में
  rationale: वाक्यांश असामान्य है और उपलब्ध साक्ष्य में कठिनता है। अदार नाम के स्पष्टीकरण के संदर्भ में स्थानीय भाषाई प्रयोग सबसे उपयुक्त लगता है, पर विकल्प पादटिप्पणी में दिए गए हैं।
- issue: ‘मोर्दकै के दिन’ की पहचान
  choice: संकेत को मुख्य पाठ में अनिर्दिष्ट रखना
  alternative: इसे सीधे पूरिम का दिन कहना
  rationale: संदर्भ संभवतः पूरिम से जुड़ा है, किंतु यूनानी पाठ केवल मोर्दकै से संबंधित दिन कहता है; इसलिए व्याख्यात्मक पहचान पादटिप्पणी तक सीमित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। ‘तेरहवीं तारीख’ बोलचाल और औपचारिक दोनों संदर्भों में स्वाभाविक है। कठिन यूनानी वाक्यांश की अनिश्चितता को मुख्य पाठ में बोझिल बनाए बिना पादटिप्पणी में सुरक्षित रखा गया है।
