  yaml_path: translation/deuterocanon/2_maccabees/015/002.yaml
  text: But when the Jews who were being compelled to accompany him said[a], “Do not destroy them in so savage and barbarous a way; rather[b], assign honor to the day that has been specially honored in holiness by the One who watches over all,”
translation:
  language: hi
  text: परन्तु जो यहूदी विवश होकर उसके साथ जा रहे थे, उन्होंने कहा[a], “उन्हें इस तरह क्रूरता और बर्बरता से नष्ट न करो; बल्कि उस दिन को उचित सम्मान दो[b], जिसे सब पर दृष्टि रखनेवाले ने पवित्रता के साथ विशेष आदर दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्य में ‘कहा’ का कर्ता वे यहूदी हैं जो विवश होकर उसके साथ जा रहे थे।
    reason: syntax_clarification
  - marker: b
    text: 'शाब्दिक अर्थ: “उस दिन को सम्मान का भाग दो।” आशय उस पवित्र दिन को उसका उचित आदर देना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... Ἰουδαίων
  choice: यहूदी
  rationale: यहाँ शब्द केवल यहूदिया के निवासियों के बजाय यहूदी धार्मिक-जातीय समुदाय के लोगों को सूचित करता है।
- source_word: κατὰ ἀνάγκην συνεπομένων αὐτῷ
  choice: विवश होकर उसके साथ जा रहे थे
  rationale: वाक्यांश बाध्यता और साथ जाने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है तथा यह स्पष्ट करता है कि वे स्वेच्छा से उसके समर्थक नहीं थे।
- source_word: ἀγρίως καὶ βαρβάρως
  choice: क्रूरता और बर्बरता से
  rationale: दोनों क्रियाविशेषणों की तीव्र, युग्मित अभिव्यक्ति बनाए रखी गई है।
- source_word: ἀπολέσῃς
  choice: नष्ट न करो
  rationale: यूनानी क्रिया का अर्थ नष्ट करना अथवा जान से मारना हो सकता है; ‘नष्ट’ उसकी व्यापक अर्थ-सीमा और प्रसंग की प्राणघातक गंभीरता दोनों को रखता है।
- source_word: δόξαν δὲ ἀπομέρισον
  choice: बल्कि ... उचित सम्मान दो
  rationale: यहाँ δόξα का आशय धार्मिक अर्थ में ‘महिमा’ से अधिक उस पवित्र दिन को दिया जानेवाला आदर है; ‘उचित’ ἀπομέρισον के नियत अंश देने के भाव को सहज रूप से व्यक्त करता है।
- source_word: τῇ προτετιμημένῃ ... μεθʼ ἁγιότητος ἡμέρᾳ
  choice: उस दिन को ... जिसे ... पवित्र मानकर विशेष आदर दिया है
  rationale: यह अभिव्यक्ति दिन की पहले से स्थापित विशिष्ट और पवित्र प्रतिष्ठा को व्यक्त करती है, बिना ‘पवित्र किया’ जैसी स्पष्टतः अनुपस्थित क्रिया जोड़ने के।
- source_word: ὑπὸ τοῦ πάντα ἐφορῶντος
  choice: सब पर दृष्टि रखनेवाले ने
  rationale: यह परमेश्वर के लिए प्रयुक्त श्रद्धापूर्ण परोक्ष संबोधन है; हिन्दी रूप सर्वदृष्टि और देखरेख, दोनों की छाया बनाए रखता है।
theological_decisions:
- issue: τοῦ πάντα ἐφορῶντος में परमेश्वर का अप्रत्यक्ष उल्लेख
  choice: सब पर दृष्टि रखनेवाला
  alternative: सभी वस्तुओं को देखनेवाला
  rationale: मूल पाठ परमेश्वर का नाम नहीं लेता, बल्कि श्रद्धापूर्ण परिभाषा देता है। चुना हुआ रूप उसी परोक्षता को बनाए रखते हुए उसकी सार्वभौमिक दृष्टि व्यक्त करता है।
- issue: पवित्र दिन की स्थिति
  choice: जिसे ... पवित्र मानकर विशेष आदर दिया है
  alternative: जिसे परमेश्वर ने अन्य दिनों से बढ़कर पवित्र किया है
  rationale: यूनानी पाठ दिन के पवित्रता सहित पहले से विशेष सम्मानित होने पर बल देता है, पर ‘पवित्र किया’ या अन्य सभी दिनों से उसकी स्पष्ट तुलना नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। ‘परन्तु’, ‘विवश’, और ‘उचित सम्मान’ साहित्यिक मर्यादा रखते हुए सामान्य पाठकों के लिए बोधगम्य हैं। प्रत्यक्ष कथन की तीव्रता तथा परमेश्वर के अप्रत्यक्ष श्रद्धापूर्ण उल्लेख को सुरक्षित रखा गया है।
