lexical_decisions:
- source_word: Οἱ δὲ περὶ τὸν Νικάνορα
  choice: परन्तु निकानोर के साथ के लोग
  rationale: περὶ + कर्मकारक यहाँ किसी अगुआ के साथ या उसके चारों ओर उपस्थित दल को सूचित करता है। यह अनुवाद निकानोर के सैनिकों का संकेत देता है, पर उनकी पद-संरचना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: σαλπίγγων
  choice: तुरहियों
  rationale: μετά के साथ प्रयुक्त बहुवचन युद्ध में साथ बजने वाले फूँक-वाद्यों को दर्शाता है। ‘तुरही’ प्राचीन संदर्भ के अनुकूल और सामान्य हिन्दी पाठक के लिए स्पष्ट है।
- source_word: παιάνων
  choice: युद्ध-गीतों
  rationale: παιάν विजय, स्तुति अथवा युद्ध के अवसर पर गाया जाने वाला गीत हो सकता है। ‘युद्ध-गीत’ इस सैनिक प्रसंग को सहज रूप से व्यक्त करता है; पाद-टिप्पणी इसकी व्यापक अर्थ-छाया सुरक्षित रखती है।
- source_word: προσῆγον
  choice: आगे बढ़े
  rationale: युद्ध के संदर्भ में यह क्रिया विरोधी की ओर बढ़ने को दर्शाती है। ‘आगे बढ़े’ स्वाभाविक हिन्दी है और ‘निकट आए’ से अधिक स्पष्ट रूप से सैनिक अग्रगमन व्यक्त करती है।
