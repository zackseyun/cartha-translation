translation:
  language: hi
  text: निकानोर से संबंधित घटनाएँ इस प्रकार घटित हो चुकी थीं और उस समय से नगर यहूदियों के अधिकार में रहा था[a], इसलिए मैं भी यहीं अपना वृत्तांत समाप्त करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “उस समय से नगर यहूदियों द्वारा अपने अधिकार में रखा गया था।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात लेखक अपने लिखित वृत्तांत को इसी बिंदु पर समाप्त करता है।
    reason: clarification
lexical_decisions:
- source_word: Τῶν ... κατὰ Νικάνορα
  choice: निकानोर से जुड़ी घटनाएँ
  rationale: κατά के साथ निकानोर का नाम यहाँ उससे संबंधित समूचे घटनाक्रम को सूचित करता है; यह केवल उसके ‘विरुद्ध’ हुई बातों तक सीमित नहीं है।
- source_word: χωρησάντων οὕτως
  choice: इस प्रकार घटित हुईं
  rationale: χωρέω यहाँ घटनाओं के इस तरह घटित होने या इस परिणाम तक पहुँचने का भाव देता है; οὕτως पिछले वर्णन की ओर संकेत करता है।
- source_word: ἀπ᾿ ἐκείνων τῶν καιρῶν
  choice: उन दिनों से
  rationale: यह यूनानी बहुवचन का स्वाभाविक हिन्दी रूप है और उस समय से आगे जारी अवस्था को व्यक्त करता है।
- source_word: κρατηθείσης τῆς πόλεως ὑπὸ τῶν Ἐβραίων
  choice: नगर इब्रियों के अधिकार में रहा
  rationale: निष्क्रिय κρατέω नगर के इब्रियों द्वारा अपने अधिकार में रखे जाने और उस स्थिति के बने रहने को व्यक्त करता है। ‘नगर’ मूल पाठ की अनिर्दिष्ट अभिव्यक्ति को बनाए रखता है; संदर्भ से यह यरूशलेम है।
- source_word: καὶ αὐτὸς
  choice: मैं भी
  rationale: यह लेखक के अपने कार्य पर दिए गए बल और καί के ‘भी’ वाले भाव, दोनों को सुरक्षित रखता है।
- source_word: αὐτόθι
  choice: यहीं
  rationale: यह उस बिंदु को सूचित करता है जहाँ लेखक अपना लिखित विवरण रोकता है।
- source_word: τὸν λόγον καταπαύσω
  choice: अपना वृत्तांत ... समाप्त करूँगा
  rationale: λόγος यहाँ लिखित विवरण या कथा है और καταπαύω उसे अंत तक लाने का अर्थ देता है।
