  text: Take the holy sword[a], a gift from God[b], by which you will shatter the adversaries.
translation:
  language: hi
  text: “पवित्र तलवार लो—परमेश्वर का उपहार—जिससे तुम विरोधियों को चकनाचूर कर दोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λάβε
  choice: लो
  rationale: λαμβάνω के एओरिस्ट आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; दृश्य में तत्काल ग्रहण करने की आज्ञा व्यक्त करता है।
- source_word: τὴν ἁγίαν ῥομφαίαν
  choice: यह पवित्र तलवार
  rationale: ῥομφαία एक बड़ी तलवार या धारदार हथियार को सूचित करता है; सामान्य पाठक के लिए ‘तलवार’ स्वाभाविक है। ἁγίαν का धार्मिक भाव ‘पवित्र’ से स्पष्ट रहता है। प्रसंग में प्रस्तुत वस्तु होने के कारण निश्चित लेख को ‘यह’ से व्यक्त किया गया है।
- source_word: δῶρον παρὰ τοῦ θεοῦ
  choice: परमेश्वर की ओर से एक उपहार
  rationale: δῶρον तलवार के समानाधिकरण में है, और παρά + संबंधकारक उसके स्रोत को बताता है। डैश इस समानाधिकरण को स्पष्ट रखते हैं, बिना ‘उपहार के रूप में’ जैसी अतिरिक्त व्याख्या किए।
- source_word: δι' ἧς
  choice: जिससे
  rationale: संबंधवाचक सर्वनाम तलवार की ओर संकेत करता है और साधन का भाव देता है; ‘जिससे’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: θραύσεις
  choice: चकनाचूर कर दोगे
  rationale: θραύω के भविष्यत् रूप में प्रबलता से तोड़ने या कुचल देने का भाव है; ‘चकनाचूर कर दोगे’ उसकी सजीव युद्धात्मक शक्ति को बनाए रखता है।
- source_word: τοὺς ὑπεναντίους
  choice: विरोधियों
  rationale: ὑπεναντίος विरोध या शत्रुतापूर्ण स्थिति को दर्शाता है। ‘विरोधी’ इस व्यापक अर्थ को रखता है और ‘शत्रु’ की अपेक्षा मूल की औपचारिक सूक्ष्मता के निकट है।
theological_decisions:
- issue: ἁγίαν को सामान्य धार्मिक पवित्रता या संकीर्ण अनुष्ठानिक अर्थ में व्यक्त करना
  choice: पवित्र
  alternative: पावन / समर्पित
  rationale: ‘पवित्र’ दिव्य रूप से दिए और अलग ठहराए गए हथियार का भाव सीधे व्यक्त करता है, पर ऐसा कोई विशिष्ट अनुष्ठानिक अर्थ नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
- issue: δῶρον को तलवार का समानाधिकरण मानना या लेने की रीति बताना
  choice: तलवार की व्याख्या के रूप में ‘परमेश्वर की ओर से एक उपहार’
  alternative: ‘परमेश्वर से उपहार के रूप में’ लो
  rationale: यूनानी पदबंध दोनों प्रकार से समझा जा सकता है, पर δῶρον का समानाधिकरण सहज है। डैश इस संबंध को दिखाते हैं; पादटिप्पणी वैकल्पिक क्रियाविशेषणीय समझ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज हिन्दी। ‘लो’ आज्ञा की तात्कालिकता रखता है; ‘ग्रहण करो’ को पादटिप्पणी में अधिक औपचारिक विकल्प के रूप में दिया गया है। डैश समानाधिकरण को स्पष्ट करते हैं और मूल की संभावित अस्पष्टता पादटिप्पणी में संरक्षित है।
