  yaml_path: translation/deuterocanon/2_maccabees/015/005.yaml
  text: But the other said[a], “I also am a ruler upon the earth[b], the one who commands men to take up arms and to carry out the king’s business.” Yet he did not prevail to accomplish his savage purpose.
translation:
  language: hi
  text: पर दूसरे ने कहा, “मैं भी पृथ्वी पर एक शासक हूँ। मैं लोगों को हथियार उठाने[a] और राजकीय काम-काज पूरा करने की आज्ञा देता हूँ।” फिर भी वह अपने क्रूर इरादे[b] को पूरा न कर सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शस्त्र धारण करने।” यूनानी में शाब्दिक रूप से “हथियार उठाने” की अभिव्यक्ति है, जो सैन्य कार्रवाई के लिए सशस्त्र होने का मुहावरा हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने घोर संकल्प” अथवा “अपनी नृशंस योजना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάστης
  choice: शासक
  rationale: यह शब्द सामर्थ्य और अधिकार रखने वाले व्यक्ति को दर्शाता है। ‘शासक’ आधुनिक हिन्दी में स्वाभाविक है और उसे अनावश्यक रूप से ‘राजा’ नहीं बनाता।
- source_word: προστατάσσων
  choice: आज्ञा देता हूँ
  rationale: वर्तमान कृदन्त वक्ता के अधिकारपूर्वक आदेश देने को उसकी विशिष्ट भूमिका के रूप में प्रस्तुत करता है; प्रथम पुरुष में यह रूप हिन्दी उद्धरण में सहज है।
- source_word: αἴρειν τὰ ὅπλα
  choice: हथियार उठाने
  rationale: यूनानी अभिव्यक्ति का शाब्दिक अर्थ हथियार उठाना है और प्रसंग में इसका आशय सैन्य कार्रवाई के लिए सशस्त्र होना है। हिन्दी में यही मुहावरा दोनों पक्षों को बनाए रखता है।
- source_word: τὰς βασιλικὰς χρείας ἐπιτελεῖν
  choice: राजकीय काम-काज पूरा करने
  rationale: χρείας का अर्थ आवश्यक कार्य, मामले या काम-काज हो सकता है। ‘राजकीय काम-काज’ βασιλικάς की व्यापकता बनाए रखता है और किसी विशेष राजा को पाठ में जोड़े बिना सरकारी/राजकीय सेवा का अर्थ देता है।
- source_word: ὅμως
  choice: फिर भी
  rationale: यह पहले किए गए अधिकार के दावे और उसके बाद की विफलता के बीच प्रबल विरोध दिखाता है।
- source_word: οὐ κατέσχεν ἐπιτελέσαι
  choice: पूरा न कर सका
  rationale: इस प्रसंग में वाक्यांश अपने उद्देश्य को कार्यान्वित करने में विफल रहने का भाव देता है। यह सहज हिन्दी में परिणाम स्पष्ट करता है, पर विफलता का कारण नहीं जोड़ता।
- source_word: σχέτλιον βούλημα
  choice: क्रूर इरादा
  rationale: σχέτλιον तीव्र निंदात्मक विशेषण है, जबकि βούλημα सोचे-समझे अभिप्राय या संकल्प को बताता है। ‘क्रूर इरादा’ इस कठोर नैतिक मूल्यांकन को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: दर्शनात्मक प्रसंग में वक्ता की पहचान और पृथ्वी पर उसके अधिकार का दावा
  choice: “मैं भी पृथ्वी पर एक शासक हूँ” के रूप में वक्ता का दावा सीधे प्रस्तुत किया गया है।
  alternative: “मैं भी पृथ्वी पर राजा हूँ” अथवा “पृथ्वी पर प्रभुत्व रखने वाला हूँ।”
  rationale: यूनानी पाठ वक्ता को δυνάστης कहता है, पर उसकी पहचान या अधिकार की प्रकृति की आगे व्याख्या नहीं करता। ‘शासक’ कहना कथात्मक और धर्मवैचारिक तनाव को बनाए रखता है तथा औपचारिक राजत्व आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पृथ्वी’, ‘शासक’ और ‘आज्ञा’ औपचारिक कथात्मक स्वर बनाए रखते हैं, जबकि ‘काम-काज’ और ‘इरादा’ वाक्य को अत्यधिक संस्कृतनिष्ठ होने से बचाते हैं। यूनानी के ऐतिहासिक वर्तमान φησίν को हिन्दी कथा-प्रवाह के अनुकूल भूतकाल ‘कहा’ में प्रस्तुत किया गया है।
