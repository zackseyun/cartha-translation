base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/018.yaml
  text: For the concern about wives and children[a], and further about brothers and relatives, weighed less with them[b], but the greatest and first fear was for the consecrated temple.
translation:
  language: hi
  text: क्योंकि पत्नियों और बच्चों, और फिर भाइयों और रिश्तेदारों की चिंता उनके लिए अपेक्षाकृत कम महत्त्व रखती थी; पर पवित्र किए गए मंदिर के लिए उनकी चिंता[a] सबसे बड़ी और सर्वोपरि थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चिंता’ के स्थान पर ‘भय’ या ‘व्याकुलता’ भी हो सकता है; यूनानी शब्द φόβος इस प्रसंग में इन अर्थों को भी समेट सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ περὶ γυναικῶν καὶ τέκνων
  choice: पत्नियों और बच्चों की चिंता
  rationale: लेख सहित περὶ और संबंधकारक पदबंध यहाँ परिवार के विषय में चिंता को संज्ञात्मक रूप देता है। यह हिन्दी में स्वाभाविक है और प्रसंग की भावात्मकता बनाए रखता है।
- source_word: ἔτι δὲ ἀδελφῶν καὶ συγγενῶν
  choice: और फिर भाइयों और रिश्तेदारों की
  rationale: ἔτι δέ चिंता की एक और श्रेणी जोड़ता है; συγγενῶν के लिए ‘रिश्तेदारों’ आधुनिक और व्यापक हिन्दी है।
- source_word: ἐν ἥττονι μέρει κείμενος αὐτοῖς
  choice: उनके लिए कम महत्त्व रखती थी
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘कम हिस्से में स्थित होना’ है और आशय प्राथमिकता में नीचे होना है। हिन्दी में यह चयन उस तुलनात्मक भाव को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: μέγιστος δὲ καὶ πρῶτος
  choice: सबसे बड़ी और पहली
  rationale: दोनों विशेषणों को बनाए रखकर यूनानी के सर्वोच्च महत्त्व और अग्र प्राथमिकता के संयुक्त बल को सुरक्षित रखा गया है।
- source_word: ὁ περὶ τοῦ καθηγιασμένου ναοῦ φόβος
  choice: पवित्र किए हुए मन्दिर के लिए चिंता
  rationale: καθηγιασμένου के पूर्ण कृदन्तीय भाव को ‘पवित्र किए हुए’ व्यक्त करता है। φόβος यहाँ भय से लेकर व्याकुल चिंता तक अर्थ दे सकता है; पारिवारिक चिंता से तुलना के कारण मुख्य पाठ में ‘चिंता’ स्वाभाविक है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: सैन्य-धार्मिक प्रसंग में φόβος का अनुवाद
  choice: चिंता
  alternative: भय / व्याकुलता
  rationale: वाक्य परिवार और मन्दिर को लेकर प्राथमिकताओं की तुलना करता है, इसलिए ‘चिंता’ हिन्दी में संबंध स्पष्ट रखती है। फिर भी φόβος का अधिक तीव्र ‘भय’ वाला अर्थ वास्तविक है और उसे पाद-टिप्पणी में रखा गया है।
- issue: καθηγιασμένου ναοῦ का अनुवाद
  choice: पवित्र किए हुए मन्दिर
  alternative: पवित्र मन्दिर / समर्पित मन्दिर
  rationale: यह रूप मन्दिर के पवित्रीकरण की पूर्ण हुई क्रिया और उसकी बनी हुई पवित्र स्थिति दोनों को ‘पवित्र मन्दिर’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘मन्दिर’ की वर्तनी अपनाई गई है। यूनानी वाक्य की प्राथमिकता-संबंधी तुलना और ‘सबसे बड़ी और पहली’ का दोहरा बल बनाए रखा गया है।
