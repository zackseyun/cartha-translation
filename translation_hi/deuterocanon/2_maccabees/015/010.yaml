  text: And after stirring up their spirits[a], he urged them on[b], at the same time pointing out the godlessness of the nations and the violation of oaths.
translation:
  language: hi
  text: और उनका जोश जगाकर उसने उन्हें आगे बढ़ने का आग्रह किया, और साथ ही राष्ट्रों[a] की ईश्वरहीनता और शपथों के उल्लंघन को दिखाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्यजातियों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς θυμοῖς διεγείρας αὐτούς
  choice: उनका जोश जगाकर
  rationale: θυμός मनोवेग, साहस, क्रोध या उत्साह का भाव दे सकता है। युद्ध से पहले दिए गए इस प्रोत्साहन के संदर्भ में ‘जोश’ सैनिकों के भीतरी उत्साह और दृढ़ता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल क्रोध तक सीमित किए।
- source_word: παρήγγειλεν
  choice: उन्हें आगे बढ़ने के लिए उत्साहित किया
  rationale: παραγγέλλω में आदेश देने और दृढ़ता से प्रेरित करने, दोनों का बल हो सकता है। यहाँ सैनिकों को संबोधित करने के संदर्भ में यह हिन्दी प्रेरक और निर्देशात्मक दोनों भावों को व्यक्त करती है।
- source_word: ἅμα παρειδείκνυς
  choice: साथ ही ... की ओर उनका ध्यान दिलाया
  rationale: 'यह समकालिक सहायक क्रिया को दर्शाता है: उन्हें उत्साहित करते समय वह इन बातों को उनके सामने भी रख रहा था।'
- source_word: τὴν τῶν ἐθνῶν ἀθεσίαν
  choice: अन्य राष्ट्रों की ईश्वरहीनता
  rationale: ἀθεσία यहाँ धर्मविरुद्धता या ईश्वरहीनता का कठोर नैतिक-धार्मिक आरोप है। ἔθνη को ऐतिहासिक संदर्भ में ‘अन्य राष्ट्र’ कहना स्वाभाविक है और बाद की संप्रदायगत ध्वनियों से बचता है।
- source_word: τὴν τῶν ὅρκων παράβασιν
  choice: शपथों के उल्लंघन
  rationale: παράβασις सीमा या दायित्व का अतिक्रमण, अर्थात उल्लंघन, दर्शाता है। यूनानी पाठ शपथों के स्वामित्व को स्पष्ट नहीं करता, इसलिए हिन्दी में ‘उनकी’ नहीं जोड़ा गया।
theological_decisions:
- issue: ἔθνη का अनुवाद
  choice: अन्य राष्ट्र
  alternative: अन्यजातियाँ
  rationale: इस ऐतिहासिक सैन्य प्रसंग में राजनीतिक-जातीय समूह प्रमुख हैं। ‘अन्य राष्ट्र’ मूल अर्थ को बनाए रखता है, जबकि पादटिप्पणी पारंपरिक ‘अन्यजातियाँ’ की सम्भावना बताती है।
- issue: ἀθεσία का धार्मिक बल
  choice: ईश्वरहीनता
  alternative: अधार्मिकता
  rationale: ‘ईश्वरहीनता’ मूल शब्द के तीखे धार्मिक आरोप को स्पष्ट रखती है; ‘अधार्मिकता’ अधिक व्यापक नैतिक अर्थ ले सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य को हिन्दी की स्वाभाविक गति के लिए दो भागों में बाँटा गया है; सैन्य प्रोत्साहन का भाव बनाए रखते हुए ‘आदेश’ और ‘उत्साह’ के बीच मूल क्रिया की अर्थ-सीमा को अत्यधिक कठोर नहीं किया गया।
