  text: And they all blessed the manifest Lord toward heaven[a], saying, “Blessed is the one who has kept his own place undefiled.”
translation:
  language: hi
  text: उन सब ने स्वर्ग की ओर प्रकट हुए प्रभु को धन्य कहा और कहा, “धन्य है वह जिसने अपने ही स्थान[a] को अपवित्रता से रहित रखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “स्थान” है; संदर्भ में इससे परमेश्वर का पवित्र स्थान या मंदिर अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर मुख करके
  rationale: εἰς के साथ कर्मकारक दिशा प्रकट करता है। हिन्दी में केवल ‘स्वर्ग की ओर’ क्रिया के साथ असहज लगता, इसलिए ‘मुख करके’ दिशा को स्वाभाविक रूप से व्यक्त करता है, बिना यह जोड़े कि उन्होंने स्वर्ग को सम्बोधित किया।
- source_word: εὐλόγησαν … Εὐλογητός
  choice: धन्य कहा … धन्य है
  rationale: एक ही यूनानी शब्द-मूल की पुनरावृत्ति बनाए रखी गई है। परमेश्वर को ‘धन्य कहना’ धार्मिक सन्दर्भ में स्वाभाविक है और अगले कथन ‘धन्य है’ से स्पष्ट शब्द-संबंध रखता है।
- source_word: τὸν ἐπιφανῆ κύριον
  choice: अपने को प्रकट करनेवाले प्रभु
  rationale: ἐπιφανής यहाँ प्रभु के निर्णायक कार्य में प्रत्यक्ष प्रकट होने का भाव देता है। ‘प्रकट प्रभु’ हिन्दी में अस्वाभाविक है, जबकि यह पदबंध अर्थ को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: διατηρήσας
  choice: बचाए रखा
  rationale: क्रिया किसी वस्तु को लगातार उसकी उचित दशा में सुरक्षित रखने का भाव देती है। ‘अपवित्र होने से बचाए रखा’ हिन्दी में परिणामसूचक विशेषण के साथ सहज है।
- source_word: τὸν ἑαυτοῦ τόπον
  choice: अपने स्थान
  rationale: τόπος का मूल अर्थ ‘स्थान’ है। सन्दर्भ मन्दिर या पवित्रस्थान की ओर संकेत करता है, फिर भी मुख्य पाठ में यूनानी की व्यापक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ἀμίαντον
  choice: अपवित्र होने से
  rationale: ἀμίαντος धार्मिक शुद्धता और कलंक-रहित दशा का भाव रखता है। मन्दिर-सन्दर्भ में ‘अपवित्र होने से बचाए रखा’ सहज आधुनिक हिन्दी है।
theological_decisions:
- issue: क्या τὸν ἑαυτοῦ τόπον को मुख्य पाठ में स्पष्ट रूप से परमेश्वर का ‘पवित्रस्थान’ या ‘मन्दिर’ कहा जाए
  choice: मुख्य पाठ में व्यापक शब्द ‘अपने स्थान’ रखा गया
  alternative: अपने पवित्रस्थान / अपने मन्दिर
  rationale: निकटवर्ती सन्दर्भ मन्दिर की ओर दृढ़ संकेत करता है, पर यूनानी पाठ में अधिक विशिष्ट ναός या ἱερόν के बजाय τόπος है। इसलिए मूल की व्यापकता मुख्य पाठ में और सम्भावित विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
- issue: τὸν ἐπιφανῆ κύριον में ἐπιφανής को गुणसूचक ‘प्रतापी’ माना जाए या प्रकट होने की क्रिया के रूप में व्यक्त किया जाए
  choice: अपने को प्रकट करनेवाले प्रभु
  alternative: प्रतापी प्रभु / प्रकट प्रभु
  rationale: इस विजय-सन्दर्भ में शब्द प्रभु के प्रत्यक्ष हस्तक्षेप या स्वयं को प्रकट करने का भाव रख सकता है। चुना हुआ रूप हिन्दी में स्वाभाविक है और इसे केवल बाहरी महिमा तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धन्य कहा … धन्य है’ द्वारा यूनानी की शब्द-पुनरावृत्ति सुरक्षित है। ‘मुख करके’ दिशा को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘अपने स्थान’ मूल पाठ की जानबूझकर व्यापक शब्दावली को बनाए रखता है।
