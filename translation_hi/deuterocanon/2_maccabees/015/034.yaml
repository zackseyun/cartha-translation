revisions:
- from: तब उन सब ने स्वर्ग की ओर मुख करके अपने को प्रकट करनेवाले प्रभु को धन्य कहा। उन्होंने कहा, “धन्य है वह, जिसने अपने स्थान[a] को अपवित्र होने से बचाए रखा।”
  to: उन सब ने स्वर्ग की ओर प्रकट हुए प्रभु को धन्य कहा और कहा, “धन्य है वह जिसने अपने ही स्थान[a] को अपवित्रता से रहित रखा है।”
  rationale: The revision removes additions not present in the Greek (“तब,” “मुख करके”), preserves the directional force of εἰς τὸν οὐρανόν as “स्वर्ग की ओर,” and uses an idiomatic rendering of ἐπιφανῆ. “अपने ही स्थान” reflects the possessive emphasis of ἑαυτοῦ, while the footnote preserves the possible temple referent without narrowing τόπος in the main text.
