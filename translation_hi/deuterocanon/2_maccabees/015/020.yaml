  yaml_path: translation/deuterocanon/2_maccabees/015/020.yaml
  text: And when all were already expecting the coming judgment[a], and the enemies had already joined battle, and the army had been drawn up, and the beasts had been suitably stationed in one part, and the cavalry posted on the flanks[b],
translation:
  language: hi
  text: जब सभी पहले ही उस आने वाले न्याय[a] की प्रतीक्षा कर रहे थे, और शत्रु पहले ही युद्ध में भिड़ चुके थे, सेना युद्ध-क्रम में तैनात की जा चुकी थी, पशुओं[b] को एक भाग में उचित रूप से तैनात कर दिया गया था, और घुड़सवार सेना पार्श्वों पर तैनात थी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आने वाला निर्णय’ अथवा ‘आने वाला संकट’।
    reason: alternative_reading
  - marker: b
    text: प्रसंग के अनुसार ये संभवतः युद्ध में प्रयुक्त हाथी थे।
    reason: cultural_note
lexical_decisions:
- source_word: προσδοκώντων
  choice: प्रतीक्षा कर रहे थे
  rationale: यह कृदन्त आशाभरी अथवा तनावपूर्ण प्रतीक्षा व्यक्त करता है; युद्ध के प्रसंग में यह सहज और सटीक है।
- source_word: τὴν ἐσομένην κρίσιν
  choice: आनेवाले न्याय
  rationale: κρίσις का अर्थ न्याय, निर्णय या निर्णायक संकट हो सकता है। मुख्य पाठ में ‘न्याय’ इसकी गंभीरता और संभावित धर्मवैचारिक प्रतिध्वनि बनाए रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: προσμιξάντων τῶν πολεμίων
  choice: शत्रु युद्ध में भिड़ चुके थे
  rationale: सैन्य प्रसंग में क्रिया का अर्थ विरोधी सेनाओं का आमने-सामने होकर युद्ध में लग जाना है; ‘भिड़ चुके थे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τῆς στρατιᾶς ἐκταγείσης
  choice: सेना युद्ध-क्रम में तैनात की जा चुकी थी
  rationale: निष्क्रिय कृदन्त सेना को व्यवस्थित युद्ध-विन्यास में लगाने का संकेत देता है।
- source_word: τῶν θηρίων
  choice: पशुओं
  rationale: यूनानी शब्द सामान्यतः ‘पशु’ कहता है। प्रसंग में ये युद्ध-हाथी होने की संभावना है, पर मुख्य पाठ स्रोत की व्यापक अभिव्यक्ति बनाए रखता है।
- source_word: ἐπὶ μέρος
  choice: एक भाग में
  rationale: यह युद्ध-पंक्ति के किसी विशेष भाग या क्षेत्र में स्थान दिए जाने को बताता है, बिना उस स्थान को अनावश्यक रूप से अधिक निश्चित किए।
- source_word: εὐκαίρως ἀποκατασταθέντων
  choice: उपयुक्त स्थान पर खड़ा कर दिया गया था
  rationale: εὐκαίρως उपयुक्तता और ἀποκαθίστημι यहाँ सामरिक स्थान-निर्धारण व्यक्त करता है।
- source_word: τῆς δὲ ἵππου
  choice: घुड़सवार सेना
  rationale: शाब्दिक ‘घोड़ा’ यहाँ सामूहिक सैन्य अर्थ में अश्वारोही दल को दर्शाता है।
- source_word: κατὰ κέρας τεταγμένης
  choice: पार्श्वों पर तैनात थी
  rationale: सैन्य भाषा में κέρας सेना के पंख या पार्श्व को दर्शाता है; ‘पार्श्वों’ से आधुनिक पाठक को विन्यास स्पष्ट होता है।
theological_decisions:
- issue: युद्ध के प्रसंग में κρίσις का अनुवाद, जिसमें धर्मवैचारिक प्रतिध्वनि भी संभव है
  choice: न्याय
  alternative: निर्णय; आनेवाला निर्णायक संकट
  rationale: तात्कालिक अर्थ युद्ध के निर्णायक परिणाम से जुड़ा है, फिर भी ‘न्याय’ यूनानी शब्द की गंभीरता और संभावित ईश्वरीय न्याय की प्रतिध्वनि को बिना निर्णायक व्याख्या थोपे सुरक्षित रखता है। पादटिप्पणी अन्य संभव अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक किंतु गरिमापूर्ण सैन्य भाषा रखी गई है। पद यूनानी वाक्य की आश्रित संरचना का भाग है, इसलिए अंत में अल्पविराम रखा गया है।
