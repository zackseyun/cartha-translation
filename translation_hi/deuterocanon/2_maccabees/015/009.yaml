  text: And by encouraging them from the Law and the Prophets, and also by reminding them of the struggles they had already completed, he made them more eager.
translation:
  language: hi
  text: और व्यवस्था और भविष्यद्वक्ताओं के ग्रंथों से उनका उत्साह बढ़ाकर, तथा उन्हें उन संघर्षों की भी याद दिलाकर जिन्हें वे पहले ही पूरा कर चुके थे, उसने उन्हें और अधिक उत्सुक कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραμυθούμενος
  choice: उनका उत्साह बढ़ाकर
  rationale: यह कृदंत प्रसंग में सांत्वना देने के साथ हौसला और प्रोत्साहन देने का भाव रखता है; युद्ध की तैयारी के संदर्भ में ‘उत्साह बढ़ाकर’ स्वाभाविक है।
- source_word: ἐκ τοῦ νόμου καὶ τῶν προφητῶν
  choice: व्यवस्था और भविष्यद्वक्ताओं के लेखों से
  rationale: यह यहूदी पवित्र ग्रंथों के दो मान्य विभागों को सूचित करता है। ‘के लेखों’ जोड़ने से आधुनिक हिन्दी में स्पष्ट होता है कि प्रोत्साहन उनके लिखित वचनों से मिला, बिना आशय बदले।
- source_word: τοὺς ἀγῶνας
  choice: उन संघर्षों
  rationale: ἀγών प्रतियोगिता, संघर्ष या कठिन अभियान का बोध करा सकता है; यहाँ उनके पिछले सैन्य और धार्मिक संघर्षों के लिए व्यापक ‘संघर्ष’ उपयुक्त है।
- source_word: ἐκτετελεκότες
  choice: पहले ही पूरा कर चुके थे
  rationale: पूर्णकालिक रूप संघर्षों को केवल सहने नहीं, बल्कि पूरा कर चुकने पर बल देता है; इससे यूनानी पाठ की पूर्णता-सूचक बारीकी सुरक्षित रहती है।
- source_word: προθυμοτέρους
  choice: और अधिक तत्पर
  rationale: यह बढ़ी हुई उत्सुकता, जोश और कार्य के लिए तैयार मनोभाव बताता है; ‘तत्पर’ तुलना के भाव को संक्षेप और गरिमा से व्यक्त करता है।
theological_decisions:
- issue: ‘व्यवस्था और भविष्यद्वक्ता’ का संदर्भ
  choice: इसे पवित्र लेखों के पारंपरिक विभागों के रूप में रखा गया है
  alternative: इसे सामान्यतः ‘कानून और नबियों की शिक्षाएँ’ कहना
  rationale: मूल पाठ का निश्चित यहूदी शास्त्रीय संकेत बनाए रखना अधिक सटीक है और किसी अतिरिक्त व्याख्यात्मक या संप्रदायगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। यूनानी वाक्य के दोनों कृदंतों—प्रोत्साहित करने और स्मरण दिलाने—का क्रम सुरक्षित है, तथा ἐκτετελεκότες को ‘सह चुके थे’ के बजाय उसके पूर्णता-सूचक अर्थ के अनुसार ‘पूरा कर चुके थे’ अनूदित किया गया है।
