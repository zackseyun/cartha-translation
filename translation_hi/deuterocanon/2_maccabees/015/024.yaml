base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/024.yaml
  text: Let those who come against your holy people with blasphemy be struck with terror by the greatness of your arm[c][b][a]. And thus he ended in these words.
translation:
  language: hi
  text: जो लोग निन्दा करते हुए तेरी पवित्र प्रजा के विरुद्ध आते हैं, वे तेरी भुजा की महानता से आतंकित हो जाएँ।[a][b] और इस प्रकार उसने इन शब्दों के साथ अपनी बात समाप्त की।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भय से स्तब्ध हो जाएँ’ अथवा ‘घबरा जाएँ’; यूनानी क्रिया भय या घोर व्याकुलता से आक्रान्त होने का भाव व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तेरी भुजा की महानता से’; बाइबिल में परमेश्वर की ‘भुजा’ उसकी कार्यशील सामर्थ्य का चित्र है।
    reason: cultural_note
  - marker: c
    text: या ‘और इस प्रकार उसने इन बातों के साथ समाप्त किया’; यूनानी अभिव्यक्ति अभी कहे गए शब्दों या बातों की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγέθει
  choice: महानता से
  rationale: करण कारक के भाव को व्यक्त करते हुए यूनानी शब्द के ‘महानता/विशालता’ अर्थ को बनाए रखता है।
- source_word: βραχίονός σου
  choice: तेरी भुजा की
  rationale: परमेश्वर की सक्रिय सामर्थ्य के बाइबिलीय रूपक ‘भुजा’ को व्याख्यात्मक रूप से केवल ‘शक्ति’ में नहीं बदलता।
- source_word: καταπλαγήτωσαν
  choice: आतंकित हो जाएँ
  rationale: निष्क्रिय आज्ञार्थक भाव और भय अथवा घबराहट से अभिभूत होने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ μετὰ βλασφημίας παραγινόμενοι
  choice: जो लोग निन्दा करते हुए ... आते हैं
  rationale: παραγίνομαι के आने के अर्थ और μετὰ βλασφημίας द्वारा बताए गए निन्दापूर्ण ढंग, दोनों को सुरक्षित रखता है।
- source_word: ἐπὶ τὸν ἅγιον σου λαόν
  choice: तेरी पवित्र प्रजा के विरुद्ध
  rationale: शत्रुतापूर्ण गति के संदर्भ में ἐπί और कर्मकारक को ‘के विरुद्ध’ कहना स्वाभाविक है; ἅγιον λαόν के लिए ‘पवित्र प्रजा’ मूल अर्थ बनाए रखता है।
- source_word: καὶ οὕτως μὲν ἐν τούτοις ἔληξεν
  choice: और इस प्रकार उसने इन्हीं शब्दों के साथ अपनी बात समाप्त की
  rationale: ἔληξεν के समाप्त करने और ἐν τούτοις के अभी कहे गए शब्दों की ओर संकेत को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की ‘भुजा’ का रूपक
  choice: मुख्य पाठ में ‘तेरी भुजा’ बनाए रखना
  alternative: तेरी शक्ति / तेरी सामर्थ्य
  rationale: मूल यूनानी का ठोस बाइबिलीय बिम्ब परमेश्वर की कार्यशील सामर्थ्य को दर्शाता है; इसे बनाए रखने से शास्त्रीय प्रतिध्वनि और धर्मवैचारिक गहराई सुरक्षित रहती है।
- issue: βλασφημία का अर्थ-क्षेत्र
  choice: निन्दा
  alternative: ईशनिन्दा
  rationale: यूनानी शब्द निन्दा, अपमानजनक वचन या ईशनिन्दा को सूचित कर सकता है। यहाँ बिना स्पष्ट किए केवल ‘ईशनिन्दा’ चुनना अर्थ को अनावश्यक रूप से संकुचित करता, इसलिए व्यापक ‘निन्दा’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनामय, गरिमापूर्ण रूप अपनाया गया है। परमेश्वर को प्रत्यक्ष सम्बोधन में ‘तेरी’ मूल के एकवचन सम्बोधन और पारंपरिक शास्त्रीय लय को सुरक्षित रखता है। वाक्यरचना साधारण पाठक के लिए स्पष्ट रखी गई है, जबकि ‘भुजा’ जैसे मूल बाइबिलीय बिम्ब को नहीं हटाया गया।
