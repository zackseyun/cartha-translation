base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/017.yaml
  text: And having been encouraged by the very noble words of Judas[a], which were able to stir them on to virtue and to make the souls of young men manly, they resolved not merely to make a campaign, but to press on bravely and, engaging with all courage, settle the matter[d][c][b], because the city and the holy things and the temple were also in danger.
translation:
  language: hi
  text: यहूदा के अत्यन्त उदात्त वचनों से प्रोत्साहित होकर—जो उन्हें सद्गुण[a] की ओर उभार सकते थे और युवकों के मनों में पुरुषोचित साहस भर सकते थे[b]—उन्होंने निश्चय किया कि वे केवल युद्ध-अभियान चलाने तक सीमित नहीं रहेंगे,[c] बल्कि वीरता से आगे बढ़ेंगे और पूरे साहस के साथ युद्ध में भिड़कर मामले का निर्णय करेंगे, क्योंकि नगर, पवित्र वस्तुएँ और मन्दिर[d] भी संकट में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सद्गुण’ के स्थान पर ‘उत्कृष्टता’ या इस युद्ध-सन्दर्भ में ‘वीरता’ भी सम्भव है; यूनानी ἀρετή में नैतिक और युद्ध-संबंधी दोनों भाव हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘युवकों की आत्माओं को पुरुषोचित बनाना।’ यूनानी में साहस के लिए स्पष्ट पुरुषवाची छवि है।'
    reason: lexical_alternative
  - marker: c
    text: भाव यह नहीं कि उन्होंने युद्ध न करने का निश्चय किया। उन्होंने ठाना कि वे केवल सामान्य युद्ध-अभियान तक सीमित न रहकर संघर्ष को निर्णायक परिणाम तक पहुँचाएँगे।
    reason: alternative_reading
  - marker: d
    text: यूनानी पाठ ‘पवित्र वस्तुओं’ और ‘मन्दिर’ को अलग-अलग बताता है; इसलिए यहाँ दोनों को पृथक रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακληθέντες
  choice: प्रोत्साहित होकर
  rationale: παρακαλέω यहाँ प्रोत्साहन और आह्वान दोनों का भाव रखता है; युद्ध के प्रसंग में यह प्रयोग वचनों से साहस और तत्परता मिलने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάνυ καλοῖς
  choice: अत्यन्त उदात्त
  rationale: καλός यहाँ केवल सुन्दर नहीं, बल्कि नैतिक रूप से श्रेष्ठ और प्रेरक वचनों का बोध कराता है; इसलिए ‘उदात्त’ प्रसंगानुकूल है।
- source_word: δυναμένοις ἐπ' ἀρετὴν παρορμῆσαι
  choice: जो उन्हें सद्गुण की ओर उभार सकते थे
  rationale: ἀρετή में नैतिक श्रेष्ठता, उत्कृष्टता और युद्ध-सन्दर्भ में वीरता—तीनों की सम्भावना है। मुख्य पाठ में व्यापक ‘सद्गुण’ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: ψυχὰς νέων ἐπανδρῶσαι
  choice: युवकों के मनों में पुरुषोचित साहस भर सकते थे
  rationale: यह अनुवाद νέων और ἐπανδρόω की स्पष्ट पुरुषवाची छवि को बनाए रखते हुए हिन्दी में समझने योग्य है। ψυχαί को इस प्रसंग में ‘मन’ कहना स्वाभाविक है।
- source_word: διέγνωσαν μὴ στρατεύεσθαι
  choice: उन्होंने निश्चय किया कि वे केवल युद्ध-अभियान चलाने तक सीमित नहीं रहेंगे
  rationale: सन्दर्भ में वे युद्ध से विरत होने का नहीं, सामान्य अभियान से आगे बढ़कर निर्णायक संघर्ष करने का निश्चय करते हैं। ‘केवल…तक सीमित नहीं’ अगले विरोधी खण्ड को स्पष्ट करता है।
- source_word: γενναίως δὲ ἐφέρεσθαι
  choice: बल्कि वीरता से आगे बढ़ेंगे
  rationale: ἐφέρεσθαι में सक्रिय रूप से आगे बढ़ने या अपने को युद्ध में झोंकने का भाव है; γενναίως उसे वीरतापूर्ण बनाता है।
- source_word: μετὰ πάσης εὐανδρείας ἐμπλακέντες
  choice: पूरे साहस के साथ युद्ध में भिड़कर
  rationale: सैन्य प्रसंग में ἐμπλακέντες संघर्ष में उलझने या भिड़ने को दर्शाता है, और πάσης εὐανδρείας पूर्ण साहस का भाव देता है।
- source_word: κρῖναι τὰ πράγματα
  choice: मामले का निर्णय करेंगे
  rationale: यह मुहावरा परिस्थिति को निर्णायक परिणाम तक पहुँचाने का संकेत देता है; ‘मामले का निर्णय करना’ औपचारिकता और निर्णायकता दोनों रखता है।
- source_word: τὴν πόλιν καὶ τὰ ἅγια καὶ τὸ ἱερὸν
  choice: नगर, पवित्र वस्तुएँ और मन्दिर
  rationale: यूनानी पाठ τὰ ἅγια और τὸ ἱερόν को अलग-अलग गिनाता है। इसलिए दोनों को एक ही ‘पवित्रस्थान’ में नहीं मिलाया गया।
- source_word: κινδυνεύειν
  choice: संकट में थे
  rationale: 'यह उनके निश्चय का कारण बताता है: नगर और पवित्र वास्तविकताएँ खतरे में थीं।'
theological_decisions:
- issue: ψυχὰς νέων ἐπανδρῶσαι और εὐανδρείας की पुरुषवाची युद्ध-भाषा
  choice: ‘युवकों के मनों में पुरुषोचित साहस भरना’ कहकर मूल की पुरुषवाची छवि बनाए रखी गई।
  alternative: ‘युवाओं को साहसी बनाना’ या ‘उनके मनों में साहस भरना’।
  rationale: मूल पाठ युवकों और पुरुषोचित साहस की स्पष्ट अलंकारिक भाषा प्रयोग करता है। इसे पूरी तरह लिंग-निरपेक्ष करने से उसकी वक्तृता का एक महत्त्वपूर्ण पक्ष मिट जाता।
- issue: μὴ στρατεύεσθαι का निषेध
  choice: इसे ‘केवल युद्ध-अभियान चलाने तक सीमित नहीं रहेंगे’ के अर्थ में लिया गया।
  alternative: ‘युद्ध-अभियान नहीं चलाएँगे’ या ‘युद्ध नहीं करेंगे’।
  rationale: अगले वाक्यांशों में वे साहसपूर्वक आगे बढ़कर युद्ध में भिड़ने का निश्चय करते हैं; इसलिए सीधा निषेध प्रसंग से टकराता है। यहाँ भाव है कि वे केवल अभियान आरम्भ करके नहीं रुकेंगे, बल्कि निर्णायक परिणाम तक जाएँगे।
- issue: τὰ ἅγια और τὸ ἱερόν का सम्बन्ध
  choice: ‘पवित्र वस्तुएँ’ और ‘मन्दिर’ को अलग रखा गया।
  alternative: दोनों को मिलाकर ‘पवित्रस्थान’ या ‘मन्दिर’ कहना।
  rationale: मूल यूनानी दोनों पदों को पृथक गिनाता है; अनुवाद में इस भेद को सुरक्षित रखना आवश्यक है, चाहे τὰ ἅγια का सटीक दायरा प्रसंग में खुला रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध स्तर रखा गया है। सैन्य शब्दावली स्पष्ट है, पर अत्यधिक संस्कृतनिष्ठ या तकनीकी नहीं। मूल की पुरुषवाची वक्तृता और ‘पवित्र वस्तुएँ/मन्दिर’ का भेद सुरक्षित रखा गया है।
