  text: But that thrice-accursed man asked whether there is in heaven a sovereign who commanded the keeping of the sabbath day[a].
translation:
  language: hi
  text: पर उस तीन बार शापित व्यक्ति ने पूछा, “क्या स्वर्ग में कोई शासक है, जिसने सब्त के दिन का पालन करने की आज्ञा दी है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह शासक स्वर्ग में है, जिसने सब्त के दिन का पालन करने की आज्ञा दी है?” यूनानी को या तो अनिश्चित वर्णन (“क्या स्वर्ग में कोई शासक है...?”) के रूप में, या इस्राएल के परमेश्वर की ओर अधिक निश्चित संकेत के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: तिहरे शाप के भागी
  rationale: दुर्लभ और अत्यन्त निन्दात्मक विशेषण में τρις- की ‘तिहरी’ तीव्रता तथा शाप-सदृश धिक्कार दोनों को बनाए रखता है; केवल ‘बहुत दुष्ट’ कहना इसके आलंकारिक बल को घटा देता।
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: यह सामान्य और स्वाभाविक हिन्दी है; प्रश्न की शत्रुतापूर्ण ध्वनि प्रसंग और पूर्ववर्ती निन्दात्मक पद से स्पष्ट होती है।
- source_word: δυνάστης
  choice: प्रभुसत्ताधारी
  rationale: यह सामर्थ्य और प्रभुत्व रखने वाले व्यक्ति को सूचित करता है तथा ‘प्रभु’ जैसे स्थापित ईश्वरीय संबोधन को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: προστατάξας
  choice: आज्ञा दी
  rationale: मूल कृदन्त के अधिकारपूर्वक आदेश देने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἄγειν
  choice: मानने
  rationale: दिन के साथ प्रयुक्त यूनानी मुहावरे का आशय किसी दिन का पालन करना है; ‘सब्त का दिन मानना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὴν τῶν σαββάτων ἡμέραν
  choice: सब्त का दिन
  rationale: जटिल यूनानी पदबंध साप्ताहिक सब्त को दर्शाता है; हिन्दी में शाब्दिक बहुवचन अस्वाभाविक और भ्रामक होगा।
theological_decisions:
- issue: स्वर्गीय अधिकारी का संदर्भ
  choice: क्या स्वर्ग में कोई प्रभुसत्ताधारी है
  alternative: क्या वह प्रभुसत्ताधारी स्वर्ग में है
  rationale: यूनानी ὁ δυνάστης में निश्चित उपपद है, पर वाक्यरचना को अनिश्चित वर्णन अथवा इस्राएल के परमेश्वर के अधिक निश्चित संकेत—दोनों रूपों में समझा जा सकता है। मुख्य पाठ पहले अर्थ को रखता है और पादटिप्पणी दूसरे को सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘तिहरे शाप के भागी’ मूल की तीखी निन्दा को बनाए रखता है; ‘प्रभुसत्ताधारी’ ऊँचे अधिकार का भाव देता है, पर इसे स्वतः कोई रूढ़ ईश्वरीय उपाधि नहीं बनाता।
