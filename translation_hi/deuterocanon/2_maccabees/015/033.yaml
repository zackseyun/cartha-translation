base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/033.yaml
  text: And after cutting out the tongue of the ungodly Nikanor, he said he would throw it piece by piece to the birds, and hang up the wages of his folly opposite the temple.
translation:
  language: hi
  text: फिर उसने अधर्मी निकानोर की जीभ काट निकाली और कहा कि वह उसे टुकड़े-टुकड़े करके पक्षियों को डाल देगा और उसकी मूर्खता का फल[a] मंदिर के सामने लटका देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी मूर्खता का उचित दंड।” यूनानी अभिव्यक्ति τὰ ἐπίχειρα का अर्थ किसी के कर्मों के बदले मिलने वाला प्रतिफल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: जीभ
  rationale: काट निकालने की शारीरिक क्रिया के कारण यहाँ इसका अर्थ शरीर का अंग ‘जीभ’ है, न कि ‘भाषा’ या ‘वाणी’.
- source_word: δυσσεβοῦς
  choice: अधर्मी
  rationale: यह शब्द परमेश्वर के प्रति अनादर और भक्तिहीनता का धार्मिक भाव रखता है; ‘अधर्मी’ आधुनिक हिन्दी में स्वाभाविक और बोधगम्य है.
- source_word: ἐκτεμών
  choice: काट निकाली
  rationale: कृदन्त मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है और जीभ को काटकर निकाल देने का अर्थ व्यक्त करता है.
- source_word: ἔφη
  choice: कहा कि वह … देगा
  rationale: इसके बाद आने वाले infinitives निकानोर के विषय में वक्ता की घोषित मंशा बताते हैं; यह रचना हिन्दी में स्वाभाविक है.
- source_word: μετὰ μέρος
  choice: टुकड़े-टुकड़े करके
  rationale: पद का आशय भागों में बाँटकर देने से है; पक्षियों को डालने के संदर्भ में यह स्पष्ट और सजीव है.
- source_word: τοῖς ὄρνεσιν
  choice: पक्षियों को
  rationale: सम्प्रदान कारक प्राप्तकर्ता को दर्शाता है; सीधा हिन्दी रूप अर्थ को ठीक रखता है.
- source_word: τὰ δʼ ἐπίχειρα
  choice: फल
  rationale: यह पद किसी के कर्मों के बदले मिलने वाले प्रतिफल या दंड को दर्शाता है। ‘फल’ हिन्दी में कर्म के परिणाम की ठोस रूपकात्मकता बनाए रखता है; दंडात्मक अर्थ पादटिप्पणी में दिया गया है.
- source_word: τῆς ἀνοίας
  choice: उसकी मूर्खता का
  rationale: ἀνοία विवेकहीनता या मूर्खता को नैतिक रंग के साथ व्यक्त करता है; ‘मूर्खता’ सामान्य आधुनिक हिन्दी में उपयुक्त है.
- source_word: κατέναντι τοῦ ναοῦ
  choice: मंदिर के सामने
  rationale: κατέναντι का अर्थ ‘सामने’ या ‘आमने-सामने’ हो सकता है; यह अनुवाद स्थान को अनावश्यक रूप से अधिक निश्चित नहीं करता.
- source_word: κρεμιάσαι
  choice: लटका देगा
  rationale: यह सार्वजनिक रूप से टाँगकर प्रदर्शित करने की घोषित मंशा बताता है; ‘लटका देगा’ सहज और अर्थसंगत है.
theological_decisions:
- issue: δυσσεβοῦς में निकानोर का नैतिक-धार्मिक वर्णन
  choice: अधर्मी
  alternative: भक्तिहीन
  rationale: मूल शब्द केवल सामान्य दुष्टता नहीं, बल्कि परमेश्वर के प्रति अनादर का भाव रखता है। ‘अधर्मी’ उस धार्मिक आयाम को सुबोध हिन्दी में व्यक्त करता है, जबकि ‘भक्तिहीन’ अपेक्षाकृत अस्वाभाविक लग सकता है.
- issue: τὰ ἐπίχειρα का दंडात्मक प्रतिफल
  choice: मूर्खता का फल
  alternative: मूर्खता का उचित दंड
  rationale: यूनानी अभिव्यक्ति प्रतिफल और देय दंड, दोनों का अर्थ दे सकती है। मुख्य पाठ में ‘फल’ इस वास्तविक अर्थ-व्याप्ति को बनाए रखता है और पादटिप्पणी दंडात्मक विकल्प स्पष्ट करती है.
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रत्यक्ष गद्य। हिंसक क्रियाओं को मूल के अनुसार स्पष्ट रखा गया है, पर भाषा को अनावश्यक रूप से सनसनीखेज नहीं बनाया गया।
