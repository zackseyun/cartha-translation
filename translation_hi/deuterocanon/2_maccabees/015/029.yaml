translation:
  language: hi
  text: जब पुकार और खलबली मच गई, तब वे अपनी पैतृक भाषा में उस सामर्थी[a] की स्तुति करने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शासक” अथवा “सत्ताधारी”; यूनानी उपाधि का अर्थ है “वह जिसके पास सामर्थ्य या अधिकार है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης
  choice: जब ... मच गई
  rationale: γενoμένης सहित संबंधकारक निरपेक्ष रचना को कालवाचक रूप में प्रस्तुत किया गया है; हिंदी में यह स्वाभाविक है और घटना के घटित होने का भाव रखता है।
- source_word: κραυγῆς
  choice: पुकार
  rationale: κραυγή ऊँची पुकार या चिल्लाहट को दर्शाता है। ‘पुकार’ एकवचन और दृश्य की जीवंतता बनाए रखती है, बिना यह तय किए कि वह युद्धघोष था या कोई और चीत्कार।
- source_word: ταραχῆς
  choice: खलबली
  rationale: ταραχή आंदोलन, अव्यवस्था या अशांति का बोध कराता है। ‘खलबली’ युद्ध-संदर्भ में स्वाभाविक और प्रभावशाली आधुनिक हिंदी है।
- source_word: εὐλόγουν
  choice: धन्य कहने लगे
  rationale: εὐλογέω के आशीष/स्तुतिवाचक अर्थ को ‘धन्य कहना’ सुरक्षित रखता है। अपूर्ण भूतकाल का जारी भाव ‘कहने लगे’ से सहज रूप में व्यक्त होता है।
- source_word: τὸν δυνάστην
  choice: सर्वशक्तिमान
  rationale: δυνάστης अधिकार या सामर्थ्य रखने वाले शासक के लिए प्रयुक्त होता है और यहाँ परमेश्वर की श्रद्धापूर्ण उपाधि है। ‘सर्वशक्तिमान’ हिंदी बाइबलीय भाषा में स्वाभाविक है, यद्यपि यूनानी पद का शाब्दिक अर्थ ‘सत्ता रखने वाला’ या ‘शासक’ भी हो सकता है; इसलिए विकल्प फुटनोट में दिया गया है।
- source_word: τῇ πατρίῳ φωνῇ
  choice: अपनी पैतृक भाषा में
  rationale: करण/रीतिवाचक चतुर्थी यहाँ बोलने की भाषा बताती है। πατρίος का पैतृक/पूर्वजों से मिला हुआ और φωνή का भाषा/वाणी वाला अर्थ स्पष्ट आधुनिक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर की उपाधि τὸν δυνάστην का अनुवाद
  choice: सर्वशक्तिमान
  alternative: सत्ताधारी; शासक; सामर्थी
  rationale: यह पद परमेश्वर के सामर्थ्य और अधिकार को व्यक्त करता है। ‘सर्वशक्तिमान’ श्रद्धापूर्ण और सामान्य हिंदी में सुबोध है, पर यूनानी शब्द अनिवार्यतः दार्शनिक अर्थ में असीम सर्वशक्तिता का तकनीकी दावा नहीं करता; इसलिए अधिक शाब्दिक विकल्प फुटनोट में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपनी पैतृक भाषा में’ मूल के τῇ πατρίῳ φωνῇ (‘पैतृक वाणी से’) का अर्थ स्पष्ट करता है।
