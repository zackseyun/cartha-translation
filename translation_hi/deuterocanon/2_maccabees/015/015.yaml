  text: 'Then Jeremiah stretched out his right hand and handed Judas a golden sword, and as he gave it he addressed him with these words:'
translation:
  language: hi
  text: 'तब यिर्मयाह ने अपना दाहिना हाथ बढ़ाया और यहूदा को सोने की एक तलवार सौंपते हुए उससे ये शब्द कहे:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείναντα
  choice: आगे बढ़ाकर
  rationale: यह हाथ को सामने की ओर बढ़ाने की शारीरिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὴν δεξιὰν
  choice: अपना दाहिना हाथ
  rationale: यूनानी में शाब्दिक रूप से ‘दाहिना’ है; हिन्दी में आशय स्पष्ट करने के लिए ‘हाथ’ और कर्ता से संबंध दिखाने के लिए ‘अपना’ आवश्यक और स्वाभाविक हैं।
- source_word: παραδοῦναι
  choice: सौंप दी
  rationale: यह तलवार को यहूदा के अधिकार में देने का भाव रखता है और साधारण ‘दे दी’ की अपेक्षा παραδίδωμι के हस्तांतरण-संबंधी अर्थ को अधिक निकटता से व्यक्त करता है।
- source_word: ῥομφαίαν χρυσῆν
  choice: सोने की एक तलवार
  rationale: ῥομφαία एक बड़ी तलवार या धारदार हथियार हो सकता है; सामान्य पाठक के लिए ‘तलवार’ स्पष्ट है। χρυσῆν को स्वाभाविक हिन्दी में ‘सोने की’ कहा गया है।
- source_word: διδόντα
  choice: उसे देते हुए
  rationale: यह देने और बोलने की क्रियाओं के साथ-साथ होने को बनाए रखता है। सर्वनाम तलवार की ओर संकेत करता है।
- source_word: προσφωνῆσαι τάδε
  choice: उससे ये शब्द कहे
  rationale: προσφωνέω किसी को संबोधित करने का भाव देता है और τάδε आगे आने वाले कथन का परिचय कराता है; यह संयोजन हिन्दी में औपचारिक किंतु सहज है।
- source_word: Ἰούδα
  choice: यहूदा
  rationale: यह Judas Maccabeus के नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: Ἰερεμίαν
  choice: यिर्मयाह
  rationale: यह भविष्यद्वक्ता Jeremiah के नाम का प्रचलित आधुनिक हिन्दी बाइबलीय रूप है।
theological_decisions:
- issue: यिर्मयाह द्वारा हथियार दिए जाने का दर्शनीय प्रसंग
  choice: क्रिया को पद में सीधे कथानक के रूप में प्रस्तुत किया गया है।
  alternative: इसी पद में ‘दर्शन में’ जोड़कर घटना की प्रकृति स्पष्ट करना।
  rationale: इस यूनानी वाक्य में दर्शन का अलग संकेत नहीं जोड़ा गया; वह संदर्भ से स्थापित है। पद के भीतर व्याख्यात्मक शब्द जोड़ना मूल से अधिक कहना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज रखी गई है। यूनानी कृदंतों की क्रमिक संरचना को स्वाभाविक हिन्दी में ‘आगे बढ़ाकर’ और ‘देते हुए’ से व्यक्त किया गया है।
