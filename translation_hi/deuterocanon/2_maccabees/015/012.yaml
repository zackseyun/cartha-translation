- source_word: λαλιάν προειμένον πρεπόντως
  choice: उचित ढंग से बोलनेवाला
  rationale: कठिन यूनानी वाक्यांश का मुख्य भाव उसकी उपयुक्त और सुसंस्कृत वाणी है; अनुवाद πρεπόντως को स्पष्ट रखता है।
- source_word: ἐκ παιδὸς ἐκμεμελετηκότα
  choice: बचपन से ही ... साधता आया था
  rationale: पूर्ण कृदंत लंबे समय से जारी सावधान अभ्यास और चरित्र-निर्माण का भाव देता है; ‘साधता आया था’ इसे केवल अध्ययन तक सीमित नहीं करता।
- source_word: πάντα τὰ τῆς ἀρετῆς ἴδια
  choice: सद्गुण की सभी विशेषताओं को
  rationale: यह उन सभी गुणों या बातों को सूचित करता है जो सद्गुण की पहचान हैं।
- source_word: κατεύχεσθαι
  choice: प्रार्थना कर रहा था
