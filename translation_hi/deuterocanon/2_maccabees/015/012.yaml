base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/012.yaml
  text: 'His vision was like this: Onias[a], who had become high priest, a noble and good man, modest in bearing, gentle in manner, and one who spoke fittingly, and who from childhood had cultivated all the proper qualities of virtue—this man was stretching out his hands and praying for the whole body of the Jews.'
translation:
  language: hi
  text: 'उसका दर्शन इस प्रकार था: ओनियास, जो महायाजक बना था—एक सम्माननीय और भला मनुष्य, व्यवहार में मर्यादाशील, स्वभाव में कोमल, उचित ढंग से बोलनेवाला, और जिसने बचपन से ही सद्गुण से संबंधित हर बात का अभ्यास किया था—हाथ फैलाए हुए समूचे यहूदी समुदाय[a] के लिए प्रार्थना कर रहा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदियों के पूरे संगठित निकाय के लिए।” यूनानी अभिव्यक्ति यहूदियों को एक एकीकृत सामूहिक समुदाय के रूप में प्रस्तुत करती है।
    reason: lexical_alternative
