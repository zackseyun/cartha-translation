- source_word: τῷ παντὶ τῶν Ἰουδαίων συστήματι
  choice: समूचे यहूदी समाज के लिए
  rationale: σύστημα एक संगठित सामूहिक निकाय को सूचित करता है; ‘समूचा यहूदी समाज’ हिंदी में स्वाभाविक रहते हुए उस सामूहिक अर्थ को बचाता है।
theological_decisions:
- issue: दर्शन में ओनियास की प्रार्थनापूर्ण मध्यस्थ भूमिका
  choice: ओनियास को हाथ फैलाकर समूचे यहूदी समाज के लिए प्रार्थना करते हुए सीधे रूप में प्रस्तुत किया गया है।
  alternative: क्रिया को केवल यहूदियों का भला चाहने या उनके लिए शुभकामना करने के रूप में कमजोर करना।
  rationale: κατεύχεσθαι स्पष्ट रूप से प्रार्थना को सूचित करता है। पद के चित्रण को बनाए रखा गया है, पर उसके धर्मवैचारिक परिणामों का विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। लंबे यूनानी वर्णन को डैशों से बाँधा गया है ताकि ओनियास के चरित्र-चित्रण और उसके प्रार्थना करने की मुख्य क्रिया का संबंध स्पष्ट रहे।
