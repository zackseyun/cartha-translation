  text: और नीकानोर ने पूर्ण आत्मविश्वास और घमंड के साथ यह ठान लिया था कि वह यहूदा के दल के लिए एक-सा व्यवहार ठहराएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
