- source_word: διεγνώκει
  choice: उसने ठान लिया था
  rationale: अपूर्ण भूतकाल से पहले ही किए जा चुके दृढ़ निश्चय का बोध होता है; ‘ठान लिया था’ उस दृढ़ता और पूर्वता दोनों को रखता है।
- source_word: κοινὸν ... τρόπον
  choice: सबके सामने एक उदाहरण
  rationale: दिया गया यूनानी पदबंध शाब्दिक रूप से कठिन है। प्रसंग में यह यहूदा के दल के साथ ऐसा प्रत्यक्ष और साझा व्यवहार करने का संकेत देता है जो सार्वजनिक मिसाल बने; इसलिए मुख्य पाठ में अर्थ-संगत, स्वाभाविक हिन्दी अपनाई गई है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: यहूदा और उसके साथी
  rationale: यूनानी मुहावरा यहूदा से जुड़े पूरे दल को दर्शाता है; हिन्दी में यह रूप न तो केवल यहूदा तक अर्थ सीमित करता है, न दल का अनावश्यक विस्तार करता है।
- source_word: συστήσασθαι
  choice: बना देगा
  rationale: τρόπον के साथ यह किसी व्यवहार या परिणाम को स्थापित अथवा घटित करने का भाव देता है; हिन्दी मुहावरे ‘उदाहरण बना देना’ में यह स्वाभाविक है।
