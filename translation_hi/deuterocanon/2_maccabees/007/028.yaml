base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/028.yaml
  text: I beg you[a], child, look at heaven and earth and see everything in them, and know that God made them not out of existing things, and that the human race comes to be in the same way.
translation:
  language: hi
  text: 'बच्चे, मैं तुझसे विनती करती हूँ: आकाश और पृथ्वी को देख, और उनमें जो कुछ है वह सब देखकर जान ले कि परमेश्वर ने उन्हें विद्यमान वस्तुओं से नहीं बनाया[a], और मानव-जाति भी इसी प्रकार अस्तित्व में आती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक व्याख्यात्मक अनुवाद: “शून्य से।” यूनानी में शाब्दिक रूप से “विद्यमान वस्तुओं से नहीं” कहा गया है।'
    reason: οὐκ ἐξ ὄντων की शाब्दिक अभिव्यक्ति और उसके प्रचलित व्याख्यात्मक अनुवाद, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: ἀξιῶ σε
  choice: मैं तुझसे विनती करती हूँ
  rationale: यहाँ माँ अपने पुत्र को मृत्यु का सामना करने से पहले अत्यंत गंभीरता से समझा रही है। इसलिए औपचारिक ‘आग्रह’ की अपेक्षा भावपूर्ण ‘विनती’ प्रसंग के अनुकूल है; स्त्रीलिंग रूप वक्ता के स्पष्ट कथात्मक संदर्भ को दर्शाता है।
- source_word: τέκνον
  choice: मेरे बच्चे
  rationale: τέκνον का मूल अर्थ संतान या बच्चा है। ‘मेरे बच्चे’ हिन्दी में स्नेहपूर्ण संबोधन है और स्रोत के सामान्य शब्द को ‘बेटे’ बनाकर अनावश्यक रूप से विशिष्ट नहीं करता।
- source_word: ἀναβλέψαντα εἰς τὸν οὐρανὸν καὶ τὴν γῆν
  choice: आकाश और पृथ्वी को देख
  rationale: ἀναβλέπω में ऊपर देखने का भाव हो सकता है, पर आकाश और पृथ्वी दोनों इसके कर्म हैं। सहज हिन्दी में ‘आकाश और पृथ्वी को देख’ पूरे संयुक्त बिंब को स्पष्ट रखता है।
- source_word: τὰ ἐν αὐτοῖς πάντα ἰδόντα
  choice: उनमें जो कुछ है, वह सब देखकर
  rationale: यह रूप πάντα की समग्रता को सुरक्षित रखते हुए हिन्दी में सहभागी क्रिया का स्वाभाविक संबंध अगले आदेश ‘जान ले’ से बनाता है।
- source_word: γνῶναι
  choice: यह जान ले
  rationale: यह प्रत्यक्ष और कम व्याख्यात्मक अनुवाद है तथा देखने के फलस्वरूप दृढ़ बोध प्राप्त करने का भाव देता है।
- source_word: οὐκ ἐξ ὄντων
  choice: विद्यमान वस्तुओं से नहीं
  rationale: यह यूनानी वाक्यांश ‘जो अस्तित्व में हैं/विद्यमान वस्तुएँ’ के निकट रहता है और मुख्य पाठ में बाद की पारिभाषिक अभिव्यक्ति ‘शून्य से’ आरोपित नहीं करता।
- source_word: ἐποίησεν
  choice: बनाया
  rationale: ποιέω सामान्यतः ‘बनाना’ है। सृष्टि के संदर्भ में भी ‘बनाया’ मूल क्रिया के अधिक निकट है, जबकि ‘सृजा’ अधिक विशिष्ट व्याख्या होगी।
- source_word: τὸ τῶν ἀνθρώπων γένος
  choice: मानव-जाति
  rationale: यह समस्त मनुष्यों को एक सामूहिक वर्ग के रूप में व्यक्त करता है और आधुनिक मानक हिन्दी में स्पष्ट है।
- source_word: οὕτω γίγνεται
  choice: भी इसी प्रकार अस्तित्व में आती है
  rationale: γίγνομαι यहाँ जन्म मात्र से व्यापक, अस्तित्व में आने का अर्थ रखता है। ‘इसी प्रकार’ पूर्ववर्ती कथन से οὕτω का संबंध बनाए रखता है और उस संबंध की theological tension को आगे नहीं समझाता।
theological_decisions:
- issue: क्या οὐκ ἐξ ὄντων का अनुवाद पारिभाषिक रूप में ‘शून्य से’ किया जाए
  choice: विद्यमान वस्तुओं से नहीं
  alternative: शून्य से / जब कुछ भी नहीं था तब
  rationale: यूनानी पाठ नकारात्मक रूप से कहता है कि परमेश्वर ने विद्यमान वस्तुओं से नहीं बनाया। यह पूर्वस्थित पदार्थ के निषेध की ओर प्रबल संकेत करता है, पर मुख्य पाठ में बाद की धर्मवैज्ञानिक संक्षिप्त अभिव्यक्ति रख देना स्रोत की विशिष्ट शब्दावली को बदल देगा। व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- issue: οὕτω द्वारा मानव-जाति के अस्तित्व में आने और पूर्ववर्ती सृष्टि-विधान के बीच संबंध
  choice: मानव-जाति भी इसी प्रकार अस्तित्व में आती है
  alternative: परमेश्वर ने मानव-जाति को भी इसी प्रकार बनाया
  rationale: मूल में γίγνεται मध्यम/अकर्मक रूप ‘अस्तित्व में आती है’ है और परमेश्वर को दूसरी उपवाक्य में स्पष्ट कर्ता नहीं बनाया गया। चुना हुआ पाठ संबंध को बनाए रखता है, पर उसकी प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रसंग की गंभीरता के अनुरूप गरिमापूर्ण रखी गई है। माँ और बच्चे के निकट संबंध को व्यक्त करने के लिए ‘तू’ के सम्मानहीन प्रयोग के बजाय प्रसंगगत आत्मीय एकवचन रूप ‘तुझसे/देख/जान ले’ रखा गया है; हिन्दी में यह मातृ-संबोधन के भीतर स्वाभाविक है। ‘परमेश्वर’, ‘आकाश और पृथ्वी’ तथा ‘मानव-जाति’ सामान्य पाठक के लिए परिचित और संप्रदाय-निरपेक्ष हैं।
