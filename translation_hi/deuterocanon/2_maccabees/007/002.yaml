base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/002.yaml
  text: But one of them[a], becoming their spokesman, said, “What do you intend to ask and learn from us? For we are ready to die rather than transgress the ancestral laws.”
translation:
  language: hi
  text: पर उनमें से एक ने उनका प्रवक्ता बनकर कहा, “तुम हमसे क्या पूछना और जानना चाहते हो? क्योंकि हम अपने पूर्वजों के नियमों[a] का उल्लंघन करने के बजाय मरने को तैयार हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पैतृक नियमों।”
    reason: πατρῷα का अधिक संक्षिप्त शाब्दिक विकल्प।
lexical_decisions:
- source_word: εἷς δὲ αὐτῶν
  choice: पर उनमें से एक
  rationale: εἷς के साथ αὐτῶν का अर्थ ‘उनमें से एक’ है; δέ कथा में प्रत्युत्तर की ओर मोड़ को ‘पर’ से व्यक्त करता है।
- source_word: γενόμενος προήγορος
  choice: उनका प्रवक्ता बनकर
  rationale: προήγορος यहाँ उस व्यक्ति को सूचित करता है जो समूह की ओर से बोलता है; इसलिए ‘प्रवक्ता’ केवल अगुआ होने की अपेक्षा प्रसंग को अधिक ठीक व्यक्त करता है।
- source_word: Μέλλεις ἐρωτᾷν, καὶ μανθάνειν ἡμῶν;
  choice: तुम हमसे क्या पूछना और जानना चाहते हो?
  rationale: μέλλεις अभिप्राय को व्यक्त करता है। यूनानी में ‘क्या’ स्पष्ट रूप से नहीं है, पर हिन्दी में प्रश्न का चुनौतीपूर्ण आशय स्वाभाविक ढंग से व्यक्त करने के लिए इसे जोड़ा गया है। एकवचन क्रिया के अनुरूप संबोधन ‘तुम’ रखा गया है।
- source_word: ἕτοιμοι γάρ ἀποθνήσκειν ἐσμέν
  choice: क्योंकि हम ... मरने को तैयार हैं
  rationale: यह रचना सीधे तौर पर ‘हम मरने को तैयार हैं’ कहती है; ‘मारे जाने’ जैसा कर्मवाच्य अर्थ नहीं जोड़ा गया।
- source_word: τὰ πατρῷα νόμους
  choice: अपने पूर्वजों के नियमों
  rationale: πατρῷα विरासत में मिले, पूर्वजों से संबद्ध नियमों को सूचित करता है। ‘पूर्वजों के नियम’ इसका पारिवारिक और सामुदायिक भार बनाए रखते हुए सहज आधुनिक हिन्दी है।
- source_word: ἢ ... παραβαίνειν
  choice: का उल्लंघन करने के बजाय
  rationale: ἢ यहाँ मृत्यु और नियम-भंग के बीच स्पष्ट वरीयता दर्शाता है; παραβαίνειν का कानूनी और नैतिक बल ‘उल्लंघन करना’ से सुरक्षित रहता है।
theological_decisions:
- issue: πατρῷα νόμους में यहूदी वाचा-समुदाय की विरासत
  choice: अपने पूर्वजों के नियमों
  alternative: पैतृक नियमों
  rationale: चुना हुआ रूप इन नियमों को केवल अमूर्त प्राचीन प्रथा न बनाकर समुदाय को पूर्वजों से मिली बाध्यकारी विरासत के रूप में प्रस्तुत करता है, फिर भी मूल से आगे बढ़कर कोई विशिष्ट सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। समूह के प्रतिनिधि के लिए ‘प्रवक्ता’ और विधि-भंग के लिए ‘उल्लंघन’ प्रयुक्त हैं। राजा को संबोधित यूनानी एकवचन को सहज हिन्दी ‘तुम’ से व्यक्त किया गया है।
