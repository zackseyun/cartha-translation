  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς
  choice: हम
  rationale: स्पष्ट प्रथम-पुरुष बहुवचन सर्वनाम को कर्ता के रूप में रखा गया है, ताकि मूल का आत्म-संबंधी बल बना रहे।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह अव्यय पिछले कथन से इस वाक्य का व्याख्यात्मक संबंध दिखाता है; हिन्दी में ‘क्योंकि’ उस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διά कारण को व्यक्त करता है; ‘के कारण’ उसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: τὰς ἑαυτῶν ἁμαρτίας
  choice: अपने ही पापों
  rationale: ἑαυτῶν का आत्मवाचक और बलात्मक भाव ‘अपने ही’ से सुरक्षित रहता है; केवल ‘अपने पापों’ कहने पर यह बल कुछ कम हो सकता था।
- source_word: πάσχομεν
  choice: दुःख भोग रहे हैं
  rationale: वर्तमान काल के जारी अनुभव को ‘भोग रहे हैं’ व्यक्त करता है; ‘दुःख भोगना’ πάσχω के प्रसंगानुकूल अर्थ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: वक्ताओं के दुःख का कारण
  choice: उनका वर्तमान दुःख उनके अपने ही पापों के कारण है।
  alternative: ‘हम अपने पापों के लिए दुःख भोगते हैं’—यह रूप कारण को दंड अथवा प्रतिफल के अर्थ की ओर अधिक झुका सकता है और आत्मवाचक बल को कुछ घटाता है।
  rationale: यूनानी पाठ वर्तमान दुःख को स्पष्ट रूप से वक्ताओं के अपने पापों से जोड़ता है। अनुवाद इस प्रायश्चित्तपूर्ण स्वीकारोक्ति को न तो नरम करता है, न उससे आगे कोई सिद्धान्त जोड़ता है।
