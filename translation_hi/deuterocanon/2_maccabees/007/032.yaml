  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। मूल के संक्षिप्त व्याख्यात्मक वाक्य तथा अंत के अर्धविराम को सुरक्षित रखा गया है।
