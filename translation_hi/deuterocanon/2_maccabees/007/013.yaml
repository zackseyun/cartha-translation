    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλλάξαντος
  choice: मर गया
  rationale: इस प्रसंग में यह क्रिया जीवन से विदा होने, अर्थात् मरने, के लिए प्रयुक्त शिष्ट मुहावरा है। ‘मर गया’ आधुनिक हिन्दी में सबसे स्पष्ट है; पादटिप्पणी मुहावरे की वैकल्पिक छाया सुरक्षित रखती है।
- source_word: τοῦτον δὲ
  choice: वह भी
  rationale: τοῦτον पिछले भाई की ओर संकेत करता है और प्रसंग में δέ के साथ योगात्मक अर्थ निकलता है। ‘वह भी’ हिन्दी में स्वाभाविक रूप से क्रम को बनाए रखता है।
- source_word: τὸν τέταρτον
  choice: चौथे को
  rationale: यूनानी पाठ में केवल ‘चौथे’ कहा गया है; प्रसंग से ‘भाई’ स्पष्ट होने के कारण उसे मुख्य पाठ में जोड़ना आवश्यक नहीं।
- source_word: ὡσαύτως
  choice: उसी तरह
  rationale: यह पहले भाइयों पर किए गए व्यवहार की पुनरावृत्ति दर्शाता है।
- source_word: ἐβασάνιζον
  choice: यातना देते हुए
  rationale: क्रिया यहाँ शारीरिक यातना को व्यक्त करती है। अपूर्ण काल की जारी क्रिया को संयुक्त हिन्दी रचना में सुरक्षित रखा गया है।
- source_word: αἰκιζόμενοι
  choice: उसके साथ क्रूरता कर रहे थे
  rationale: कृदन्त हिंसक दुर्व्यवहार को यातना के साथ चल रही क्रिया के रूप में जोड़ता है। यह चयन ‘यातना’ की अनावश्यक पुनरुक्ति से बचते हुए उसकी कठोरता बनाए रखता है।
