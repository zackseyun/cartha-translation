translation:
  language: hi
  text: अतः करुणा के भावों और असाधारण यातनाओं के विषय में इतना ही कहा जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तो करुणा के भावों और सीमा से बढ़ी हुई क्रूरताओं के विषय में यहाँ तक स्पष्ट किया जाए।”'
    reason: शाब्दिक विकल्प और यूनानी समापन-सूत्र की औपचारिकता स्पष्ट करने के लिए।
lexical_decisions:
- source_word: τὰ ... περὶ τοὺς σπλαγχνισμούς
  choice: करुणा के भावों के विषय में
  rationale: σπλαγχνισμοί गहरे अंतःभाव, स्नेह या करुणा को दर्शाता है। बहुवचन को पूरी तरह समतल किए बिना स्वाभाविक हिन्दी में “करुणा के भावों” कहा गया है। यूनानी पाठ में “माँ के” स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया; प्रसंग से मातृ-स्नेह समझ में आता है।
- source_word: τὰς ὑπερβαλλούσας αἰκίας
  choice: असाधारण यातनाओं
  rationale: αἰκίαι दुर्व्यवहार, क्रूर अत्याचार या यातनाओं को दर्शाता है; इस शहादत-वृत्तांत में “यातनाएँ” ठोस हिंसा को ठीक व्यक्त करता है। ὑπερβαλλούσας उनकी साधारण सीमा से परे तीव्रता बताता है, इसलिए “असाधारण” चुना गया।
- source_word: ἐπὶ τοσούτου δεδηλώσθω
  choice: इतना ही कहा जाए
  rationale: यह औपचारिक समापन-सूत्र है, जिसका भाव है कि वर्णन यहीं तक प्रस्तुत किया जाए। “इतना ही कहा जाए” आज की गरिमापूर्ण हिन्दी में सीमा और घोषणात्मक भाव दोनों को बनाए रखता है।
