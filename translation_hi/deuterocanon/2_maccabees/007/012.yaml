  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सहज है। ‘स्वयं राजा’ यूनानी के बलाघात को और ‘राजा और उसके साथी’ सहभागी समूह को स्वाभाविक हिन्दी में व्यक्त करता है।
