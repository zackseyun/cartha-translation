lexical_decisions:
- source_word: ψυχήν
  choice: आत्मा
  rationale: यूनानी शब्द यहाँ युवक के भीतरी स्वभाव, मनोबल या साहस की ओर संकेत कर सकता है। ‘आत्मा’ मूल की व्यापकता और अंग्रेज़ी परामर्श-पाठ के ‘spirit’ को बनाए रखता है; पादटिप्पणी संदर्भगत अर्थ स्पष्ट करती है।
- source_word: ἀλγηδόνας
  choice: यातनाओं
  rationale: शब्द का मूल अर्थ पीड़ाएँ या कष्ट है; प्रसंग में युवक को दी जा रही यातनाएँ अभिप्रेत हैं, इसलिए यह स्वाभाविक और संदर्भानुकूल है।
- source_word: ἐνʼ οὐδενὶ ... ἐτίθετο
  choice: कुछ भी नहीं समझता था
  rationale: यह मुहावरा किसी बात को नगण्य मानने या उसका कोई मोल न समझने का भाव व्यक्त करता है।
theological_decisions:
- issue: ψυχήν को केवल ‘साहस’ के रूप में सीमित करना
  choice: मुख्य पाठ में ‘आत्मा’ रखा गया और संदर्भगत विकल्प पादटिप्पणी में दिया गया।
  alternative: हौसला / मनोबल / साहस
  rationale: मूल शब्द इनसे अधिक व्यापक है। मुख्य पाठ में व्यापक अर्थ रखने से मनोवैज्ञानिक और धार्मिक दोनों संभावनाएँ खुली रहती हैं तथा किसी विशिष्ट व्याख्या को अनावश्यक रूप से निर्णायक नहीं बनाया जाता।
