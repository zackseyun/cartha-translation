  text: परन्तु राजा बहुत क्रोधित हो गया और उसने इसके साथ दूसरों की अपेक्षा अधिक क्रूरता से व्यवहार किया, क्योंकि वह अपना उपहास किए जाने को बहुत बुरा मान रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
