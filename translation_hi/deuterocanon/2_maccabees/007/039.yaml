    text: अर्थात्, राजा अपना उपहास किए जाने पर कटुता से प्रतिक्रिया कर रहा था।
    reason: यूनानी वाक्यांश πικρῶς φέρων ἐπὶ τῷ μυκτηρισμῷ का वैकल्पिक स्पष्टार्थ; यह बताता है कि उपहास राजा के विरुद्ध था।
