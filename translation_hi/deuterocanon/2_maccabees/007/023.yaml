base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/023.yaml
  text: Therefore the Creator of the world, who formed the origin of man and devised the origin of all things, will in mercy give back to you both breath and life, since you now disregard yourselves for the sake of his laws.
translation:
  language: hi
  text: इसलिए संसार का सृष्टिकर्ता, जिसने मनुष्य की उत्पत्ति को गढ़ा और सब वस्तुओं की उत्पत्ति का विधान किया, तुम पर दया करके तुम्हें फिर से साँस[a] और जीवन देगा; क्योंकि तुम अब उसके नियमों के लिए अपने जीवन की परवाह नहीं करते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आत्मा’।
    reason: यूनानी πνεῦμα का अर्थ प्रसंगानुसार ‘साँस’ या ‘आत्मा’ हो सकता है।
lexical_decisions:
- source_word: κτίστης
  choice: सृष्टिकर्ता
  rationale: यह κόσμος के रचयिता के अर्थ को आधुनिक, प्रतिष्ठित और सहज हिन्दी में व्यक्त करता है।
- source_word: πλάσας ἀνθρώπου γένεσιν
  choice: मनुष्य की उत्पत्ति को आकार दिया
  rationale: πλάσας के ‘गढ़ने/आकार देने’ और γένεσις के ‘उत्पत्ति’ दोनों भाव सुरक्षित रहते हैं; ‘मनुष्य’ यहाँ सामूहिक मानवजाति का बोध करा सकता है।
- source_word: πάντων ἐξευρὼν γένεσιν
  choice: सब वस्तुओं की उत्पत्ति की योजना बनाई
  rationale: ἐξευρίσκω यहाँ रचनात्मक रूप से ठहराने या अभिकल्पित करने का भाव रखता है; ‘योजना बनाई’ हिन्दी में ईश्वर की सृजनात्मक व्यवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν
  choice: साँस और जीवन
  rationale: इस पुनर्जीवन-संदर्भ में πνεῦμα का ‘साँस’ अर्थ उपयुक्त है, जबकि इसकी ‘आत्मा’ वाली वास्तविक अर्थ-संभावना को पादटिप्पणी में रखा गया है।
- source_word: ὑπερορᾶτε ἑαυτοὺς
  choice: अपनी परवाह नहीं करते
  rationale: यह आत्म-सुरक्षा या अपने जीवन की चिंता को त्यागने का भाव देता है, बिना पाठ से अधिक स्पष्ट शहादत-संबंधी भाषा जोड़ने के।
- source_word: διὰ τοὺς αὐτοῦ νόμους
  choice: उसके नियमों के कारण
  rationale: बहुवचन νόμους को सीधे और सामान्य हिन्दी में रखा गया है; वाक्य बताता है कि परमेश्वर के नियमों के प्रति निष्ठा के कारण वे अपनी परवाह नहीं कर रहे हैं।
theological_decisions:
- issue: πνεῦμα का अर्थ
  choice: मुख्य पाठ में ‘साँस’, पादटिप्पणी में ‘आत्मा’
  alternative: मुख्य पाठ में ‘आत्मा’
  rationale: मृत्यु के बाद परमेश्वर द्वारा फिर से जीवन दिए जाने के प्रसंग में ‘साँस’ शारीरिक जीवन की बहाली के साथ स्वाभाविक है, पर यूनानी शब्द की आत्मा-संबंधी सम्भावना को दबाया नहीं गया।
- issue: पुनरुत्थान की अभिव्यक्ति
  choice: ‘फिर से साँस और जीवन देगा’
  alternative: ‘तुम्हें पुनर्जीवित करेगा’
  rationale: मूल पाठ के विशिष्ट शब्दों और ‘फिर से देगा’ की प्रतिज्ञा को बनाए रखा गया है; अधिक व्याख्यात्मक धर्मशास्त्रीय संक्षेप नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। डैश से सृष्टिकर्ता का वर्णन स्पष्ट किया गया है और मूल यूनानी की कारणात्मक तथा पुनर्दान-संबंधी संरचना सुरक्षित रखी गई है।
