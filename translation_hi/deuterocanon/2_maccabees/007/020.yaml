base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/020.yaml
  text: But the mother was especially admirable and worthy of honorable memory[a]; seeing her seven sons perish in a single day[b], she bore it courageously because of her hopes in the Lord.
translation:
  language: hi
  text: परन्तु वह माता विशेष रूप से प्रशंसनीय और आदर के साथ स्मरण किए जाने योग्य थी[a]। उसने एक ही दिन में अपने सातों पुत्रों को नाश होते देखा[b], फिर भी प्रभु पर रखी अपनी आशाओं के कारण उसने यह सब साहसपूर्वक सहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अच्छे स्मरण के योग्य।”
    reason: lexical_alternative
  - marker: b
    text: या “मरते हुए”; यूनानी शब्द का अर्थ व्यापक रूप से “नाश होना” या “मिट जाना” है, और यहाँ प्रसंग उनके मारे जाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπεραγόντως
  choice: विशेष रूप से
  rationale: यह क्रियाविशेषण माता की प्रशंसा को तीव्र करता है; यह चयन आधुनिक हिन्दी में स्वाभाविक रहते हुए उस बल को व्यक्त करता है।
- source_word: ἀγαθὴ
  choice: प्रशंसनीय
  rationale: मूल अर्थ ‘अच्छी’ है, पर इस नैतिक प्रशंसा के प्रसंग में ‘प्रशंसनीय’ माता के श्रेष्ठ चरित्र और साहस का भाव अधिक स्वाभाविक ढंग से देता है।
- source_word: μνήμης ἀγαθῆς ἀξία
  choice: आदर के साथ स्मरण किए जाने योग्य
  rationale: यह वाक्यांश अनुकूल और सम्मानपूर्ण स्मरण के योग्य होने को बताता है; इस रूप में स्मरण और सम्मान दोनों भाव सुरक्षित रहते हैं।
- source_word: ἥτις
  choice: उसने … देखा, फिर भी
  rationale: सम्बन्धवाचक उपवाक्य माता की प्रशंसा का आधार बताता है। हिन्दी में ‘फिर भी’ उस परिस्थिति और उसके साहसी धैर्य के बीच निहित विरोध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἀπολλυμένους
  choice: नाश होते
  rationale: वर्तमान कृदन्त पुत्रों की हिंसक मृत्यु को घटित होते हुए दिखाता है। ‘नाश होते’ यूनानी क्रिया की व्यापकता बनाए रखता है और केवल ‘मारे जाते’ जितना संकीर्ण नहीं है।
- source_word: συνορῶσα
  choice: देखा
  rationale: यह पूरे दृश्य को प्रत्यक्ष देखने का भाव देता है; प्रसंग के साथ ‘देखा’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: μιᾷ τοῦ καιροῦ ἡμέρᾳ
  choice: एक ही दिन में
  rationale: यह सातों पुत्रों की मृत्यु के एक ही अवसर या दिन में घटने पर बल देता है।
- source_word: εὐψύχως
  choice: साहसपूर्वक
  rationale: यह संकट के बीच दृढ़ मन और साहस को व्यक्त करता है।
- source_word: ἔφερεν
  choice: उसने यह सब … सहा
  rationale: यहाँ क्रिया का अर्थ विपत्ति को सहना है; ‘यह सब’ हिन्दी में निहित कर्म को स्वाभाविक रूप से व्यक्त करता है।
- source_word: διὰ τὰς ἐπὶ Κύριον ἐλπίδας
  choice: प्रभु पर रखी अपनी आशाओं के कारण
  rationale: ‘आशाओं’ से यूनानी बहुवचन सुरक्षित रहता है, और ‘प्रभु पर रखी’ आशाओं की दिशा तथा आधार दोनों को सहज हिन्दी में प्रकट करता है।
- source_word: Κύριον
  choice: प्रभु
  rationale: यहाँ सन्दर्भ परमेश्वर का है; ‘प्रभु’ κύριος का प्रचलित, गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस पद में माता की आशाएँ परमेश्वर पर टिकी हैं। ‘प्रभु’ धार्मिक सन्दर्भ में स्वाभाविक है और मूल पाठ से अधिक विशिष्ट पहचान नहीं जोड़ता।
- issue: ἐλπίδας का बहुवचन
  choice: आशाओं
  alternative: आशा
  rationale: यूनानी पाठ बहुवचन रखता है। उसे बनाए रखने से उन आशाओं का दायरा खुला रहता है और अनुवाद उन्हें किसी एक सिद्धान्तगत आशा में सीमित नहीं करता।
- issue: माता के धैर्य का कारण
  choice: प्रभु पर रखी अपनी आशाओं के कारण
  alternative: प्रभु पर अपनी आशा के कारण
  rationale: यह कारणात्मक सम्बन्ध और बहुवचन दोनों सुरक्षित रखता है, बिना उन आशाओं की विषयवस्तु को पाठ से आगे परिभाषित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘सातों पुत्रों’, ‘फिर भी’ और ‘यह सब सहा’ हिन्दी प्रवाह को स्वाभाविक बनाते हैं; ‘आशाओं’ का कुछ असामान्य बहुवचन मूल यूनानी की अर्थगत खुलावट बचाने के लिए जानबूझकर रखा गया है।
