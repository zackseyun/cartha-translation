- source_word: Ἐκθύμως
  choice: क्रोध से आग-बबूला
  rationale: यह पद प्रचंड और उग्र क्रोध व्यक्त करता है। यह स्वाभाविक आधुनिक हिन्दी में उसकी तीव्रता बनाए रखता है।
- source_word: γενόμενος
  choice: हो गया
  rationale: कृदन्त यहाँ अवस्था में प्रवेश का भाव देता है—राजा उग्र क्रोध की दशा में आ गया।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: यूनानी संज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: προσέταξεν
  choice: आदेश दिया
  rationale: यह अधिकारपूर्वक आज्ञा देने का भाव स्पष्ट रूप से व्यक्त करता है।
- source_word: τήγανα
  choice: तलने के तवे
  rationale: संज्ञा तलने या सेंकने के लिए प्रयुक्त धातु के पात्रों को सूचित करती है; यह अनुवाद आधुनिक पाठक के लिए स्पष्ट है।
- source_word: λέβητας
  choice: बड़े कड़ाहों
  rationale: यह बड़े धातु-पात्रों का बोध कराता है। 'बड़े कड़ाह' प्रसंग के अनुरूप आकार और भारीपन स्पष्ट करते हैं।
- source_word: ἐκπυροῦν
  choice: आग में तपाने
  rationale: क्रिया आग से अच्छी तरह या तीव्रता से गरम करने का भाव रखती है। 'आग में तपाने' मूल के अग्नि-संबंधी बल को साधारण 'गरम करने' से अधिक स्पष्ट रखता है, बिना अनिवार्य रूप से लाल होने का दावा किए।
