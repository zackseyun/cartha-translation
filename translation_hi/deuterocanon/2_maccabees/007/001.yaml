base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/001.yaml
  text: It also happened that seven brothers, along with their mother, having been arrested, were being forced by the king to taste the unlawful flesh of swine, while being tortured with whips and cords.
translation:
  language: hi
  text: यह भी हुआ कि सात भाई अपनी माता के साथ पकड़ लिए गए, और राजा उन्हें निषिद्ध सूअर का मांस खाने[a] के लिए विवश कर रहा था, जबकि उन्हें कोड़ों और रस्सियों[b] से यातना दी जा रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका सेवन करें।” यूनानी क्रिया का शाब्दिक अर्थ “छूना” भी हो सकता है, पर यहाँ प्रसंग में इसका अर्थ सूअर के मांस को भोजन के रूप में ग्रहण करना है।
    reason: lexical_alternative
  - marker: b
    text: “रस्सियों” के लिए प्रयुक्त यूनानी शब्द का अधिक शाब्दिक अर्थ “स्नायु” है; इससे स्नायु से बनी डोरियाँ, रस्सियाँ या पट्टे अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνέβη δὲ καὶ
  choice: यह भी हुआ कि
  rationale: यह कथात्मक संक्रमण तथा καὶ की योगात्मक शक्ति, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἑπτὰ ἀδελφοὺς μετὰ τῆς μητρὸς
  choice: सात भाई अपनी माता के साथ
  rationale: ἀδελφούς यहाँ पुरुष सहोदरों को सूचित करता है; ‘अपनी माता के साथ’ सम्बन्ध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: συλλημφθέντας
  choice: पकड़ लिए गए
  rationale: क्रिया के निष्क्रिय अर्थ को सुरक्षित रखते हुए यह ‘गिरफ़्तार किए गए’ की अपेक्षा मूल की व्यापकता बनाए रखता है।
- source_word: ἀναγκάζεσθαι ὑπὸ τοῦ βασιλέως
  choice: राजा उन्हें ... विवश कर रहा था
  rationale: हिन्दी की स्वाभाविक सक्रिय संरचना में राजा को बाध्य करने वाले कर्ता के रूप में रखते हुए जारी बलप्रयोग का भाव व्यक्त किया गया है।
- source_word: ἀπὸ τῶν ἀθεμίτων υἱείων κρεῶν
  choice: व्यवस्था के विरुद्ध सूअर का मांस
  rationale: ἀθέμιτος के निषिद्ध अथवा विधि-विरुद्ध धार्मिक-कानूनी भाव को व्यक्त करता है, पर मूल में न आए ‘अशुद्ध’ शब्द को नहीं जोड़ता।
- source_word: ἐφάπτεσθαι
  choice: खाएँ
  rationale: भोजन के इस प्रसंग में क्रिया का आशय मांस को भोजन के रूप में ग्रहण करना है; शाब्दिक ‘छुएँ’ हिन्दी में भ्रामक होगा।
- source_word: μάστιξιν καὶ νευραῖς
  choice: कोड़ों और चमड़े के पट्टों से
  rationale: μάστιξιν के लिए ‘कोड़ों’ स्पष्ट है। νευραῖς यातना के लिए प्रयुक्त स्नायु-निर्मित रस्सियों या पट्टों को सूचित कर सकता है; मुख्य पाठ में सहज ‘चमड़े के पट्टों’ के साथ पादटिप्पणी में वास्तविक शब्दगत विस्तार रखा गया है।
- source_word: αἰκιζομένους
  choice: यातना दिलवाकर
  rationale: उल्लिखित उपकरणों से होने वाले हिंसक दुर्व्यवहार की तीव्रता को स्पष्ट रूप से व्यक्त करता है और राजा की कारक भूमिका से सहज जुड़ता है।
theological_decisions:
- issue: यहूदी आहार-विधि के उल्लंघन की भाषा
  choice: व्यवस्था के विरुद्ध सूअर का मांस
  alternative: अशुद्ध सूअर का मांस
  rationale: यूनानी ἀθέμιτος का अर्थ ‘अनुचित, निषिद्ध, व्यवस्था-विरुद्ध’ है; यहाँ ‘अशुद्ध’ जोड़ने से मूल के विशिष्ट शब्द-चयन पर बाद की पारिभाषिक भाषा आरोपित हो सकती है।
- issue: ἐφάπτεσθαι में ग्रहण की मात्रा
  choice: खाएँ
  alternative: चखें / ग्रहण करें / छुएँ
  rationale: प्रसंग भोजन करने के लिए बाध्य किए जाने का है। ‘चखें’ मात्रा को अनावश्यक रूप से सीमित कर सकता है, जबकि ‘छुएँ’ शाब्दिक होने पर भी प्रसंग में भ्रामक है; पादटिप्पणी वास्तविक शब्दगत विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज कथात्मक रूप अपनाया गया है। ‘माता’ बाइबलीय गरिमा रखता है, जबकि वाक्य-संरचना सामान्य पाठक के लिए सरल है। मुख्य पाठ में तकनीकी शब्दावली सीमित रखकर वास्तविक शब्दगत अस्पष्टताएँ पादटिप्पणियों में सुरक्षित की गई हैं।
