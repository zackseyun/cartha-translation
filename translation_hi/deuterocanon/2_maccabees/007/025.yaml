base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/025.yaml
  text: But since the young man was paying no attention at all, the king called the mother to him and urged her to become an adviser to the youth for his preservation.
translation:
  language: hi
  text: लेकिन जब उस युवक ने बिलकुल ध्यान नहीं दिया[a], तब राजा ने माँ को अपने पास बुलाया और उससे आग्रह किया कि वह उस लड़के की सलाहकार बने, जिससे उसके प्राण बच सकें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिलकुल नहीं सुना।” यूनानी अभिव्यक्ति इस बात पर बल देती है कि उसने सुनने या ध्यान देने से पूरी तरह इनकार कर दिया।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी सुरक्षा के लिए,” “उसके बचाव के लिए,” अथवा “उसके उद्धार के लिए।” यूनानी शब्द σωτηρία का अर्थ सुरक्षा, बचाव या उद्धार हो सकता है; यहाँ तत्काल प्रसंग में उसके प्राण बचना प्रमुख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... νεανίου
  choice: उस युवक
  rationale: νεανίου का अर्थ युवक या जवान है। ‘युवक’ आधुनिक मानक हिन्दी में स्वाभाविक है और प्रसंग के पात्र को स्पष्ट रूप से दर्शाता है।
- source_word: μηδαμῶς προσέχοντος
  choice: बिलकुल ध्यान नहीं दिया
  rationale: μηδαμῶς पूर्ण निषेध पर बल देता है और προσέχω यहाँ किसी बात पर ध्यान देने या उसे मानने के अर्थ में है। यह अनुवाद उस प्रबल अस्वीकृति को सहज हिन्दी में व्यक्त करता है।
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाया
  rationale: मध्यवाच्य कृदन्त राजा द्वारा माँ को अपनी उपस्थिति में बुलवाने या बुलाने को व्यक्त करता है।
- source_word: παρῄνει
  choice: आग्रह किया
  rationale: παραινέω में सलाह देने, समझाने और प्रेरित करने का भाव हो सकता है। यहाँ राजा माँ पर अपने बेटे को मनाने का दबाव डाल रहा है, इसलिए ‘आग्रह किया’ उपयुक्त है।
- source_word: γενέσθαι ... σύμβουλον
  choice: सलाह दे
  rationale: यूनानी संरचना का शाब्दिक अर्थ ‘सलाहकार बने’ है; हिन्दी में ‘उसे ... सलाह दे’ अधिक स्वाभाविक रहते हुए वही कार्यात्मक अर्थ व्यक्त करता है।
- source_word: τοῦ μειρακίου
  choice: उस लड़के को
  rationale: μειράκιον किशोर या युवा लड़के को सूचित कर सकता है। ‘लड़के’ से νεανίου के लिए प्रयुक्त ‘युवक’ से मूल की शब्दगत भिन्नता भी बनी रहती है।
- source_word: ἐπὶ σωτηρία
  choice: अपनी जान बचाने
  rationale: σωτηρία का अर्थ बचाव, सुरक्षा, उद्धार या प्राणरक्षा हो सकता है। तत्काल प्रसंग में राजा युवक को मृत्यु से बचाने की बात कर रहा है; इसलिए यह प्रयोग सहज हिन्दी में लौकिक प्राणरक्षा का प्रमुख भाव देता है।
theological_decisions:
- issue: शहादत के प्रसंग में σωτηρία का अनुवाद
  choice: अपनी जान बचाने
  alternative: अपनी सुरक्षा के लिए; अपने बचाव के लिए; अपने उद्धार के लिए
  rationale: इस पद में राजा माँ के द्वारा युवक को ऐसा करने के लिए मनवाना चाहता है जिससे उसका जीवन बच जाए। अतः मुख्य पाठ में तत्काल शारीरिक प्राणरक्षा व्यक्त की गई है, जबकि मूल शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘युवक’ और ‘लड़का’ मूल के νεανίου और μειρακίου की शब्दगत भिन्नता को यथासंभव बनाए रखते हैं। वाक्य-संरचना को हिन्दी में सहज बनाने के लिए ‘सलाहकार बने’ के स्थान पर ‘सलाह दे’ कहा गया है।
