  to: लेकिन जब उस युवक ने बिलकुल ध्यान नहीं दिया[a], तब राजा ने माँ को अपने पास बुलाया और उससे आग्रह किया कि वह उस लड़के की सलाहकार बने, जिससे उसके प्राण बच सकें[b]।
  rationale: 'Revision is needed to remove the unclear possessive reference and to represent γενέσθαι ... σύμβουλον ἐπὶ σωτηρία more closely: the mother is to become the boy’s adviser, with the aim of preserving his life. The alternative senses of σωτηρία are retained without importing doctrine.'
