  yaml_path: translation/deuterocanon/2_maccabees/007/038.yaml
  text: and in me and my brothers bring to an end the wrath of the Almighty that has justly been kindled against our whole nation[a].
translation:
  language: hi
  text: और मुझ पर और मेरे भाइयों पर आकर सर्वशक्तिमान का वह क्रोध रुक जाए, जो हमारे समूचे राष्ट्र के विरुद्ध न्यायपूर्वक भड़का है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुझमें और मेरे भाइयों में”; अर्थात क्रोध उनमें अपने रुकने के बिंदु तक पहुँच जाए।
    reason: यूनानी ἐν की असामान्य अभिव्यक्ति और उसके संभावित स्थानिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: στῆσαι
  choice: रुक जाए
  rationale: यहाँ ἵστημι का अर्थ क्रोध को उसके अंतिम बिंदु पर रोकना या समाप्त करना है। हिंदी में ‘रुक जाए’ सहज है और संदर्भ में अपेक्षित परिणाम को स्पष्ट करता है।
- source_word: παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह παντοκράτωρ के लिए प्रचलित, गरिमापूर्ण और सहज ईश्वरीय उपाधि है।
- source_word: ὀργήν
  choice: क्रोध
  rationale: ‘क्रोध’ दैवी न्याय की गंभीरता को बनाए रखता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: σύμπαν ἡμῶν γένος
  choice: हमारे समूचे राष्ट्र
  rationale: γένος यहाँ पूरे यहूदी जनसमुदाय को सामूहिक रूप से सूचित करता है। ‘राष्ट्र’ इस संदर्भ में ‘जाति’ की आधुनिक अस्पष्टताओं से बचते हुए सामूहिक पहचान व्यक्त करता है।
- source_word: δικαίως
  choice: न्यायपूर्वक
  rationale: यह क्रोध के भड़कने को न्यायसंगत बताता है और यूनानी क्रियाविशेषण का न्यायिक-मौलिक भाव सुरक्षित रखता है।
- source_word: ἐπημμένην
  choice: भड़का है
  rationale: पूर्ण कृदंत उस क्रोध को दर्शाता है जो पहले प्रज्वलित हुआ और अब भी विद्यमान है; ‘भड़का है’ हिंदी में अग्नि-रूपक को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐν ἐμοὶ δὲ καὶ τοῖς ἀδελφοῖς μου
  choice: मुझ पर और मेरे भाइयों पर आकर
  rationale: यूनानी ἐν का आशय यहाँ वक्ता और उसके भाइयों को क्रोध के रुकने का अंतिम बिंदु बताना है। मुख्य पाठ में यह वाक्यांश उस अर्थ को सहज हिंदी में व्यक्त करता है, जबकि पाद-टिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
theological_decisions:
- issue: शहीद भाइयों पर आकर दैवी क्रोध का रुकना
  choice: वचन को इस आशा के रूप में रखा गया है कि राष्ट्र के विरुद्ध सर्वशक्तिमान का न्यायसंगत क्रोध वक्ता और उसके भाइयों पर आकर रुक जाए।
  alternative: क्रोध उनमें ‘ठहर’ जाए या उनकी पीड़ा से ‘संतुष्ट’ हो जाए।
  rationale: संदर्भ में στῆσαι का सबसे स्वाभाविक अर्थ क्रोध को रोकना है। अनुवाद उनकी मृत्यु और राष्ट्र के न्याय के बीच पाठ में उपस्थित संबंध को बनाए रखता है, पर इसे किसी बाद की तकनीकी प्रायश्चित्त-व्यवस्था के रूप में परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘मुझ पर … आकर … रुक जाए’ शाब्दिक ‘मुझमें’ की हिंदीगत असहजता से बचता है; पाद-टिप्पणी मूल रूपक और वास्तविक अर्थगत तनाव को दर्ज करती है।
