base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/005.yaml
  text: 'And when he had become useless to the others[a], he ordered him to be brought to the fire while still breathing and to be fried in the pan. And when the vapor from the pan had spread considerably, they encouraged one another, together with their mother, to die nobly[b], saying this:'
translation:
  language: hi
  text: 'जब वह बाकी लोगों के किसी काम का न रहा, तो उसने आदेश दिया कि उसे, जीवित ही, आग के पास ले जाकर कड़ाही में तला जाए। जब कड़ाही से बहुत-सी भाप[a] निकल रही थी, तब वे अपनी माँ के साथ मिलकर एक-दूसरे को वीरता से मरने[b] के लिए प्रोत्साहित कर रहे थे और इस प्रकार कह रहे थे:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाष्प” अथवा “धुएँ-जैसे धूम”; यूनानी शब्द भाप, वाष्प या धुएँ-जैसे गरम धूम के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “साहसपूर्वक मृत्यु का सामना करने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρηστον ... τοῖς λοιποῖς γενόμενον
  choice: बाकी लोगों के किसी काम का न रहा
  rationale: यह यूनानी की कठोर और अमानवीय अभिव्यक्ति को नरम किए बिना स्वाभाविक हिन्दी में रखता है; τοῖς λοιποῖς का संकेत शेष उपस्थित लोगों की ओर है।
- source_word: ἐκέλευσεν
  choice: उसने आदेश दिया
  rationale: यूनानी में कर्ता पिछले प्रसंग से समझा जाता है; हिन्दी में भी अनावश्यक रूप से उसकी पहचान जोड़े बिना सर्वनाम रखा गया है।
- source_word: τῇ πυρᾷ προσάγειν
  choice: आग के पास ले जाकर
  rationale: यह यातना के लिए आग के निकट लाने का सीधा अर्थ देता है; यहाँ चिता का अर्थ थोपना उचित नहीं।
- source_word: ἔτινουν
  choice: जीवित ही
  rationale: प्रसंग में यह इस बात पर बल देता है कि यातना मृत्यु से पहले, उसके जीवित रहते हुए जारी थी। 'साँस चलते ही' अधिक चित्रात्मक विकल्प है, पर मुख्य पाठ में 'जीवित ही' सहज और स्पष्ट है।
- source_word: τηγανίζειν
  choice: कड़ाहे में तला जाए
  rationale: क्रिया τηγανίζω यातना की भयावह विशिष्टता बनाए रखते हुए तवे/कड़ाही में तलने का अर्थ देती है। बड़े यातना-पात्र के प्रसंग में 'कड़ाहा' स्वाभाविक हिन्दी है।
- source_word: τῆς ... ἀτμίδος
  choice: भाप
  rationale: ἀτμίς भाप, वाष्प या धुएँ-जैसी गरम गैस को सूचित कर सकता है। 'भाप' साधारण पाठक के लिए स्वाभाविक है और विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: ἐφʼ ἱκανὸν διδούσης
  choice: बहुत अधिक ... उठने लगी
  rationale: वाक्यांश पर्याप्त या उल्लेखनीय मात्रा में निकलने का भाव देता है। यह हिन्दी में स्वाभाविक रूप से उस प्रचुर उत्सर्जन को व्यक्त करता है।
- source_word: παρεκάλουν ἀλλήλους
  choice: एक-दूसरे को ... प्रोत्साहित करते हुए
  rationale: इसमें पारस्परिक ढाढ़स और आग्रह दोनों का भाव सुरक्षित रहता है।
- source_word: σὺν τῇ μητρὶ
  choice: अपनी माँ के साथ मिलकर
  rationale: माँ को पारस्परिक प्रोत्साहन में सम्मिलित दिखाता है, बिना उससे अधिक संबंधगत विवरण जोड़े।
- source_word: γενναίως τελευτᾷν
  choice: वीरता से मरने
  rationale: γενναίως में साहस, कुलीनता और सम्मान का भाव है; 'वीरता से' आधुनिक हिन्दी में नैतिक साहस और सम्मान दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: भाइयों की मृत्यु का नैतिक वर्णन
  choice: वीरता से मरने
  alternative: साहसपूर्वक मृत्यु का सामना करने
  rationale: यूनानी उनकी मृत्यु को सम्मानपूर्ण साहस के रूप में प्रस्तुत करता है। चुना हुआ पाठ यह मूल्यांकन बनाए रखता है, पर बाद की शहादत-संबंधी कोई विशिष्ट धार्मिक श्रेणी नहीं जोड़ता।
- issue: यातना के समय जीवन की स्थिति
  choice: जीवित ही
  alternative: जब उसकी साँस अभी चल रही थी
  rationale: पाठ की क्रूरता और मृत्यु से पहले जारी यातना स्पष्ट रहती है, पर शारीरिक दशा के बारे में यूनानी से अधिक विवरण नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधी किंतु गरिमापूर्ण कथा-शैली। यातना की कठोरता को शिष्टोक्ति से नहीं ढका गया है। 'कड़ाहा' सामान्य पाठक के लिए 'फ्राइंग पैन' की अपेक्षा इस प्रसंग में अधिक स्वाभाविक है; फिर भी मूल के तलने वाले पात्र और क्रिया की विशिष्टता बनी रहती है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
