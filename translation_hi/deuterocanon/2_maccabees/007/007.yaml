  yaml_path: translation/deuterocanon/2_maccabees/007/007.yaml
  text: When the first had died in this way[a], they brought the second to the mockery; and after tearing off the skin of his head with the hair, they asked[b], “Will you eat before your body is punished limb by limb?”
translation:
  language: hi
  text: जब पहले भाई की इस प्रकार मृत्यु हो गई, तो वे दूसरे को उपहास के लिए ले आए। उसके सिर की खाल बालों समेत खींचकर उतारने के बाद वे उससे पूछते रहे, “क्या तू खाएगा, इससे पहले कि तेरे शरीर को अंग-अंग करके यातना दी जाए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεταλλάξαντος
  choice: मृत्यु हो गई
  rationale: प्रसंग में यह क्रिया यातना के बाद पहले भाई की मृत्यु को सूचित करती है; सामान्य ‘बदलने’ का अर्थ यहाँ उपयुक्त नहीं है।
- source_word: τοῦ πρώτου
  choice: पहले भाई
  rationale: यूनानी में केवल ‘पहले’ है, पर पिछले प्रसंग में सात भाइयों का उल्लेख होने के कारण हिन्दी में ‘भाई’ जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: τὸν τρόπον τοῦτον
  choice: इस प्रकार
  rationale: यह पहले भाई की मृत्यु के वर्णित ढंग की ओर संकेत करता है।
- source_word: ἦγον ἐπὶ τὸν ἐμπαιγμόν
  choice: उपहास और दुर्व्यवहार के लिए ले आए
  rationale: ἐμπαιγμός में ठट्ठा, अपमान और क्रूर दुर्व्यवहार का भाव है; संयुक्त हिन्दी अभिव्यक्ति इस प्रसंगगत विस्तार को स्वाभाविक रूप से व्यक्त करती है।
- source_word: τὸ τῆς κεφαλῆς δέρμα σὺν ταῖς θριξὶν
  choice: उसके सिर की खाल बालों समेत
  rationale: यह यूनानी की ठोस शारीरिक अभिव्यक्ति को स्पष्ट और सीधे ढंग से रखता है।
- source_word: περισύραντες
  choice: खींचकर उतारने के बाद
  rationale: क्रिया हिंसक ढंग से खाल खींचकर अलग करने का संकेत देती है।
- source_word: ἐπηρώτων
  choice: पूछने लगे
  rationale: अपूर्ण काल की जारी या आरंभ हुई पूछताछ की छाया को स्वाभाविक हिन्दी कथन में बनाए रखता है।
- source_word: Εἰ φάγεσαι
  choice: क्या तू खाएगा
  rationale: सीधा प्रश्न है कि वह निषिद्ध मांस खाकर आज्ञा मानेगा या नहीं; हिन्दी का एकवचन अनौपचारिक ‘तू’ यातना देने वालों के अपमानजनक संबोधन के अनुकूल है।
- source_word: πρὸ τοῦ τιμωρηθῆναι κατὰ μέλος τὸ σῶμα
  choice: इससे पहले कि तेरे शरीर को अंग-अंग करके यातना दी जाए
  rationale: τιμωρέω मूलतः दंड देने को व्यक्त करता है, पर यहाँ शारीरिक यातना स्पष्ट है; ‘अंग-अंग करके’ κατὰ μέλος की वितरणात्मक शक्ति बनाए रखता है।
theological_decisions:
- issue: खाने की वस्तु का स्पष्ट उल्लेख
  choice: मुख्य पाठ में केवल ‘खाएगा’ रखा गया
  alternative: ‘निषिद्ध मांस खाएगा’
  rationale: यूनानी पद में वस्तु व्यक्त नहीं की गई है; आसपास का प्रसंग उसे स्पष्ट करता है। इसलिए अनुवाद में निहित वस्तु जोड़कर मूल की संक्षिप्तता और तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गंभीर और कथात्मक शैली। हिंसा को मूल के अनुसार स्पष्ट रखा गया है, पर अनावश्यक रूप से अधिक चित्रात्मक नहीं बनाया गया। इस पद के लिए कोई पाठ-टिप्पणी आवश्यक नहीं है; उपलब्ध अंग्रेज़ी परत की फुटनोट-सूची में चिह्न और विषय का असंगत मेल होने के कारण उसे हिन्दी पाठ में नहीं अपनाया गया।
