  rationale: παραινέσαντος के साथ यह क्रियाविशेषण की तरह आग्रह की मात्रा या तीव्रता बताता है; ‘बहुत’ मूल की संक्षिप्तता और संभावित व्यापकता बनाए रखता है।
- source_word: παραινέσαντος
  choice: समझाया-बुझाया
  rationale: संदर्भ में वह व्यक्ति माँ से उसके बेटे को प्रभावित करने का आग्रह कर रहा है। आधुनिक हिन्दी में यह प्रयोग सलाह और लगातार मनुहार, दोनों का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπεδέξατο
  choice: राज़ी हो गई
  rationale: मध्य रूप प्रस्ताव या अनुरोध स्वीकार करने को व्यक्त करता है; हिन्दी में ‘राज़ी हो गई’ स्वाभाविक है और इसके बाद आने वाले उद्देश्य से ठीक जुड़ता है।
- source_word: πεῖσειν
  choice: मनाने के लिए
  rationale: πείθω का भाव किसी को किसी बात के लिए सहमत करने का है; इस संदर्भ में ‘मनाना’ सहज और सीधा है।
- source_word: τὸν υἱόν
  choice: अपने बेटे को
  rationale: यूनानी में निश्चित पदबंध है, पर कथा-संदर्भ बताता है कि वह स्त्री का बेटा है; हिन्दी का निजवाचक ‘अपने’ कर्ता के साथ संबंध स्पष्ट और स्वाभाविक करता है।
