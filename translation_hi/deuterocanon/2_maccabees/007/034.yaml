  naturalness: Modern standard Hindi is clear, forceful, and suitably elevated. “व्यर्थ ही घमंड में मत फूल” is idiomatic and preserves the image of vain self-exaltation; “हाथ उठाकर” naturally conveys hostile action.
  terminology: “हे अधर्मी” appropriately conveys ἀνόσιε, while “सबसे अधिक अशुद्ध” retains the defilement/pollution imagery of μιαρώτατε. “स्वर्गीय बालकों” is a legitimate primary rendering of οὐρανίους παῖδας, and the footnote responsibly preserves the alternative relational sense, “स्वर्ग के बालकों.”
