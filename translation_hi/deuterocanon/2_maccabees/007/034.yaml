base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/034.yaml
  text: But you[a], O unholy one, most defiled of all men, do not be vainly puffed up, inflamed with uncertain hopes, having raised your hands against the children of heaven.
translation:
  language: hi
  text: पर तू, हे अधर्मी, सारे मनुष्यों में सबसे अधिक अशुद्ध, अनिश्चित आशाओं से भड़ककर और स्वर्गीय बालकों[a] के विरुद्ध अपने हाथ उठाकर व्यर्थ ही घमंड में मत फूल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग के बालकों।” यूनानी वाक्यांश का अर्थ या तो स्वयं बालकों को “स्वर्गीय” बताना हो सकता है, या उन्हें “स्वर्ग के बालक” कहना।
    reason: οὐρανίους विशेषण की वर्णनात्मक और सम्बन्धसूचक—दोनों सम्भव व्याख्याओं को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀνόσιε
  choice: हे अधर्मी
  rationale: सम्बोधन के रूप में यह धार्मिक और नैतिक अपवित्रता की तीखी भर्त्सना व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: μιαρώτατε
  choice: सारे मनुष्यों में सबसे अधिक अशुद्ध
  rationale: यह μιαρός के अतिशयोक्तिपूर्ण रूप में निहित नैतिक तथा धार्मिक अशुद्धता को बनाए रखता है; केवल ‘नीच’ कहना इस बिंब को सामान्य नैतिक निंदा में बदल देता।
- source_word: μὴ μάτην μετεωρίζου
  choice: व्यर्थ ही घमंड में मत फूल
  rationale: यह ऊँचा उठने या फूलने के रूपक के साथ अहंकारी आत्मोन्नति और उसकी निष्फलता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φρυττόμενος
  choice: भड़ककर
  rationale: यह गरम या प्रज्वलित होने के रूपक को बनाए रखते हुए भावनात्मक उत्तेजना को संक्षेप और सहज ढंग से व्यक्त करता है।
- source_word: ἀδήλοις ἐλπίσιν
  choice: अनिश्चित आशाओं से
  rationale: ἀδήλοις की अस्पष्टता और अनिश्चितता को सुरक्षित रखा गया है; ‘झूठी आशाएँ’ कहना मूल से अधिक निर्णायक होता।
- source_word: οὐρανίους παῖδας
  choice: स्वर्गीय बालकों
  rationale: यह विशेषण के सीधे अर्थ ‘स्वर्गीय’ और παῖδας के ‘बालक/सन्तान’ अर्थ को बनाए रखता है। सम्बन्धसूचक सम्भावना ‘स्वर्ग के बालक’ पादटिप्पणी में दी गई है।
- source_word: ἐπαράμενος χεῖρας
  choice: के विरुद्ध अपने हाथ उठाकर
  rationale: यह कृदन्तीय रचना और किसी के विरुद्ध हिंसक या शत्रुतापूर्ण हाथ उठाने की शारीरिक छवि, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: οὐρανίους παῖδας में οὐρανίους का अर्थ
  choice: स्वर्गीय बालकों
  alternative: स्वर्ग के बालकों
  rationale: यूनानी विशेषण बालकों को ‘स्वर्गीय’ बता सकता है या स्वर्ग से उनके सम्बन्ध/अधिकार को सूचित कर सकता है। मुख्य पाठ और पादटिप्पणी मिलकर दोनों सम्भावनाएँ रखते हैं, और मूल में अनुपस्थित स्पष्ट ईश्वरीय उपाधि नहीं जोड़ते।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, तीखा और गरिमापूर्ण सम्बोधन रखा गया है। वाक्य में यूनानी कृदन्तों को ‘भड़ककर’ और ‘हाथ उठाकर’ से जोड़ा गया है, ताकि मूल की व्याकरणिक गति बनी रहे और अनावश्यक कारणसूचक व्याख्या न जोड़ी जाए।
