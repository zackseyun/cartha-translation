base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/014.yaml
  text: 'And when he was about to die[a], he said this: “It is preferable, when dying at the hands of men, to await the hopes given by God—that one will be raised again by him[b]. But for you there will be no resurrection to life.”'
translation:
  language: hi
  text: जब वह मरने ही वाला था[a], तब उसने इस प्रकार कहा, “मनुष्यों के हाथों मरते समय परमेश्वर से फिर जीवित किए जाने की आशा रखना बेहतर है। पर तेरे लिए जीवन का पुनरुत्थान नहीं होगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह अपने अंत के निकट पहुँच गया था।”
    reason: निकट आती मृत्यु को व्यक्त करने वाले यूनानी मुहावरे का वैकल्पिक अनुवाद।
  - marker: b
    text: “जीवन का पुनरुत्थान” का अर्थ धन्य जीवन की ओर ले जाने वाले पुनरुत्थान से वंचित होना हो सकता है; यह वाक्य हर प्रकार के पुनरुत्थान का स्पष्ट निषेध आवश्यक रूप से नहीं करता।
    reason: मूल पद में बनी हुई धर्मवैचारिक अस्पष्टता को सुरक्षित और स्पष्ट करना।
lexical_decisions:
- source_word: γενόμενος πρὸς τῷ τελευτᾷν
  choice: जब वह मरने ही वाला था
  rationale: πρὸς τῷ के साथ क्रियार्थक संज्ञा निकट भविष्य या आसन्न अवस्था बताती है। यह हिंदी प्रयोग मृत्यु की निकटता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὕτως ἔφη
  choice: तब उसने इस प्रकार कहा
  rationale: ‘इस प्रकार’ οὕτως के संकेतात्मक बल को बनाए रखता है और कथन की भूमिका के रूप में गरिमापूर्ण तथा सहज है।
- source_word: Αἱρετὸν
  choice: यह चुनना बेहतर है
  rationale: αἱρετόν में ‘चुनने योग्य’ या ‘वरीय’ होने का भाव है। यह रूप उस चयनात्मक अर्थ को केवल ‘अच्छा है’ कहने की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: μεταλλάσσοντας ἀπὸ ἀνθρώπων
  choice: मनुष्यों के हाथों मरते समय
  rationale: यहाँ μεταλλάσσω जीवन से विदा होने के लिए प्रयुक्त है और ἀπὸ ἀνθρώπων मानवीय कर्तृत्व को दर्शाता है। शहादत के संदर्भ में यह हिंदी अभिव्यक्ति अर्थ को स्वाभाविक रूप से संप्रेषित करती है।
- source_word: τὰς ὑπὸ τοῦ θεοῦ προσδοκᾷν ἐλπίδας
  choice: परमेश्वर से मिलनेवाली आशाओं की बाट जोहे
  rationale: बहुवचन ‘आशाओं’ को सुरक्षित रखा गया है। ‘से मिलनेवाली’ परमेश्वर को इनके स्रोत के रूप में व्यक्त करता है, बिना यूनानी में स्पष्ट न होने वाले ‘प्रतिज्ञा की गई’ भाव को जोड़ने के।
- source_word: πάλιν ἀναστήσεσθαι ὑπʼ αὐτοῦ
  choice: कि परमेश्वर उसे फिर से जिलाएगा
  rationale: यूनानी कर्मवाच्य में परमेश्वर पुनरुत्थान का कर्ता है। हिंदी में कर्तृवाच्य अधिक सहज है और वही ईश्वरीय कर्तृत्व स्पष्ट रखता है; ‘उसे’ अनिर्दिष्ट मानवीय कर्ता को सामान्य रूप में ग्रहण करता है।
- source_word: ἀνάστασις εἰς ζωὴν
  choice: जीवन का पुनरुत्थान
  rationale: यह संक्षिप्त पद पुनरुत्थान और जीवन के संबंध को बनाए रखता है तथा इसे सीधे ‘कोई पुनरुत्थान नहीं’ में नहीं बदलता। पाद-टिप्पणी εἰς के लक्ष्यसूचक भाव को स्पष्ट करती है।
theological_decisions:
- issue: शहीद के पुनरुत्थान की आशा और अत्याचारी के लिए जीवन के पुनरुत्थान का निषेध
  choice: परमेश्वर शहीद को फिर से जिलाएगा, जबकि संबोधित अत्याचारी के लिए ‘जीवन का पुनरुत्थान’ नहीं होगा।
  alternative: अत्याचारी का किसी भी प्रकार का पुनरुत्थान नहीं होगा।
  rationale: εἰς ζωὴν, ἀνάστασις को विशेषित करता है। इसलिए अनुवाद जीवनदायी या धन्य पुनरुत्थान से वंचित होने और हर प्रकार के पुनरुत्थान के पूर्ण निषेध के बीच की धर्मवैचारिक अस्पष्टता को हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में है। ‘बाट जोहना’ साधारण पाठक के लिए बोधगम्य रहते हुए आशापूर्ण प्रतीक्षा का गरिमापूर्ण भाव देता है। संबोधन ‘तेरे’ में अत्याचारी से कही गई सीधी और तीखी वाणी सुरक्षित है।
