  text: And she encouraged each one of them in the language of their fathers[a], filled with a noble spirit, and, stirring her womanly reasoning with manly courage, she said to them[b],
translation:
  language: hi
  text: वह उनमें से हर एक को पुरखों की भाषा में[a] प्रोत्साहित करती रही। उदात्त संकल्प से भरी हुई, और अपने स्त्री-सुलभ विवेक को पुरुषोचित साहस से उद्दीप्त करके, उसने उनसे कहा:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूर्वजों की बोली में” अथवा “अपनी मातृभाषा में।” यूनानी का शाब्दिक भाव पैतृक या पूर्वजों से मिली हुई भाषा का है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में जानबूझकर लैंगिक विरोध है; अधिक शाब्दिक रूप से: “अपने स्त्री-विवेक को पुरुष-साहस से उद्दीप्त करके।”'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστον
  choice: हर एक को
  rationale: एकवचन कर्मकारक का प्रयोग वितरणात्मक है; यह स्पष्ट करता है कि उसने प्रत्येक पुत्र को व्यक्तिगत रूप से प्रोत्साहित किया।
- source_word: παρεκάλει
  choice: प्रोत्साहित करती रही
  rationale: इस शहादत-प्रसंग में क्रिया सांत्वना से अधिक दृढ़ रहने के लिए उत्साह और बल देने का भाव रखती है; अपूर्ण काल की निरंतरता भी सुरक्षित रहती है।
- source_word: τῇ πατρίῳ φωνῇ
  choice: पुरखों की भाषा में
  rationale: πατρίῳ पैतृक अथवा पूर्वजों से मिली हुई वस्तु को और φωνῇ यहाँ बोली/भाषा को सूचित करता है। यह सहज हिन्दी में पैतृक-अनुवांशिक भाव बनाए रखता है।
- source_word: γενναίῳ ... φρονήματι
  choice: उदात्त संकल्प से भरी हुई
  rationale: φρόνημα मनोभाव, मनोदशा या दृढ़ संकल्प हो सकता है; प्रसंग में 'संकल्प' उसकी नैतिक दृढ़ता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि γενναίῳ के लिए 'उदात्त' उसके श्रेष्ठ और साहसी भाव को रखता है।
- source_word: τὸν θῆλυν λογισμόν
  choice: अपने स्त्री-सुलभ विचार को
  rationale: λογισμός विचार या विचार-शक्ति है और θῆλυς उसे स्पष्ट रूप से स्त्री-संबंधी बताता है। यह स्रोत की जानबूझकर प्रयुक्त लैंगिक भाषा को निष्प्रभावी नहीं करता।
- source_word: ἄρσενι θυμῷ
  choice: पुरुषोचित साहस से
  rationale: θυμός यहाँ क्रोध नहीं, बल्कि उत्साह, जीवट और साहस है; 'पुरुषोचित साहस' प्राचीन लेखक द्वारा निर्मित स्त्री/पुरुष विरोध को स्पष्ट और पठनीय रखता है।
- source_word: διεγείρασα
  choice: जगा दिया था
  rationale: यह भूतकालिक कृदंत है और मुख्य कथन से पहले की क्रिया दर्शाता है; 'जगा दिया था' रूपक और घटनाक्रम दोनों को सहज हिन्दी में रखता है।
- source_word: λέγουσα πρὸς αὐτούς
  choice: फिर उसने उनसे कहा
  rationale: यह प्रत्यक्ष कथन की भूमिका बाँधने वाला कृदंत है; हिन्दी कथा-शैली में स्वतंत्र क्रिया-वाक्य अधिक स्वाभाविक है।
theological_decisions:
- issue: माता के चरित्र-चित्रण में लैंगिक आलंकारिक विरोध
  choice: मुख्य पाठ में ‘स्त्री-सुलभ विचार’ और ‘पुरुषोचित साहस’ का स्पष्ट विरोध बनाए रखा गया है।
  alternative: इसे लैंगिक रूप से तटस्थ करके ‘अपनी स्वाभाविक दुर्बलता को दृढ़ साहस से जगा दिया’ अथवा ‘मातृ-भावनाओं को प्रबल संकल्प से उभारा’ कहा जा सकता था।
  rationale: यूनानी θῆλυν और ἄρσενι का जानबूझकर विरोध करता है। इसे नरम या तटस्थ करना प्राचीन लेखक की सांस्कृतिक अलंकार-योजना और उसके तनाव को मिटा देता। पादटिप्पणी आधुनिक पाठक को इस असामान्य अभिव्यक्ति का शाब्दिक आधार बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘पुरखों’ से पैतृक भाषा का जीवंत भाव, ‘उदात्त संकल्प’ से नैतिक दृढ़ता, और ‘स्त्री-सुलभ/पुरुषोचित’ से मूल यूनानी का सांस्कृतिक तथा लैंगिक तनाव सुरक्षित रखा गया है।
