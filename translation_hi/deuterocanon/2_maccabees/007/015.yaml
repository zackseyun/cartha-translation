- source_word: τὸν πέμπτον
  choice: पाँचवें को
  rationale: यूनानी में संज्ञा निहित है और शब्दशः अर्थ ‘पाँचवें को’ है। प्रसंग से स्पष्ट है कि यह पाँचवाँ भाई है, इसलिए मूल की संक्षिप्तता बनाए रखी गई है।
- source_word: προσάγοντες
  choice: आगे लाए
  rationale: कृदंत उस व्यक्ति को सामने या नियत स्थान पर लाने का भाव देता है; ‘आगे लाए’ इस प्रसंग में स्वाभाविक और सटीक है।
- source_word: ᾐκίζοντο
  choice: उसे यातना देने लगे
  rationale: क्रिया हिंसक दुर्व्यवहार अथवा यातना देने को व्यक्त करती है। अपूर्ण भूतकाल चल रही या आरम्भ होकर जारी कार्रवाई का संकेत दे सकता है; ‘यातना देने लगे’ हिन्दी कथा में इस पक्ष को सहज रूप से व्यक्त करता है।
