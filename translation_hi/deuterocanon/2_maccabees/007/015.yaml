- source_word: Ἐχομένως
  choice: इसके बाद
  rationale: यह क्रम में अगली घटना को सूचित करता है; ‘इसके बाद’ आधुनिक हिन्दी में स्वाभाविक रूप से कथा को आगे बढ़ाता है।
- source_word: δὲ
  choice: अलग से अनूदित नहीं
