  yaml_path: translation/deuterocanon/2_maccabees/007/030.yaml
  text: And while she was still finishing[a], the young man said, “What are you waiting for? I do not obey the king’s command, but I obey the command of the law that was given to our fathers through Moses.”
translation:
  language: hi
  text: जब वह अभी अपनी बात पूरी कर ही रही थी, तब उस युवक ने कहा, “तुम किस बात की प्रतीक्षा कर रहे हो? मैं राजा की आज्ञा नहीं मानता, बल्कि उस व्यवस्था की आज्ञा मानता हूँ, जो मूसा के द्वारा हमारे पूर्वजों को दी गई थी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι δὲ ταύτης καταληγούσης
  choice: जब वह अभी अपनी बात पूरी ही कर रही थी
  rationale: संबंधकारक निरपेक्ष रचना युवक की माता के बोलने और युवक के उत्तर देने की समकालिकता दिखाती है। καταληγούσης का मूल भाव ‘समाप्त करना’ है; ‘अपनी बात पूरी करना’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὁ νεανίας
  choice: उस जवान ने
  rationale: νεανίας युवा पुरुष को सूचित करता है। ‘जवान’ वर्तमान हिन्दी में स्वाभाविक है और प्रसंग के युवक को स्पष्ट करता है।
- source_word: Τίνα μένετε;
  choice: तुम किस बात की प्रतीक्षा कर रहे हो?
  rationale: यूनानी प्रश्न संक्षिप्त/अध्याहृत है और उसका भाव ‘किसलिए/किस बात की प्रतीक्षा कर रहे हो?’ है। यह अनुवाद चुनौतीपूर्ण स्वर और मूल अस्पष्टता को सहज हिन्दी में रखता है।
- source_word: οὐχ ὑπακούω τοῦ προστάγματος τοῦ βασιλέως
  choice: मैं राजा की आज्ञा नहीं मानता
  rationale: वर्तमान काल सिद्धान्तगत और दृढ़ अस्वीकार व्यक्त करता है। πρόσταγμα के लिए ‘आज्ञा’ उपयुक्त है और अगले वाक्यांश के समानान्तर रहता है।
- source_word: τοῦ δὲ προστάγματος ἀκούω τοῦ νόμου
  choice: बल्कि उस व्यवस्था की आज्ञा मानता हूँ
  rationale: ἀκούω यहाँ संबंधकारक के साथ केवल सुनने के बजाय मानने/पालन करने का अर्थ देता है। ‘आज्ञा मानता हूँ’ राजा की आज्ञा के साथ मूल का अलंकारिक विरोध बनाए रखता है।
- source_word: τοῦ δοθέντος τοῖς πατράσιν ἡμῶν
  choice: जो ... हमारे पूर्वजों को दी गई थी
  rationale: πατράσιν का शाब्दिक अर्थ ‘पितरों’ है, पर इस वंशगत-वाचा प्रसंग में आधुनिक हिन्दी का ‘पूर्वजों’ स्वाभाविक रूप से उन्हीं पैतृक पुरखों को व्यक्त करता है।
- source_word: διὰ Μωσῆ
  choice: मूसा के द्वारा
  rationale: διά के साथ संबंधकारक माध्यम या मध्यस्थता व्यक्त करता है; ‘मूसा के द्वारा’ इसे सटीक रूप से रखता है।
theological_decisions:
- issue: πατράσιν का वंशगत संबोधन
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों
  rationale: मूल में पुरुषवाची बहुवचन पैतृक वंश की ओर संकेत करता है। ‘पूर्वजों’ आधुनिक सामान्य हिन्दी में इस वंशगत अर्थ को बिना अनावश्यक रूप से लिंग-समावेशी दावा किए स्पष्ट करता है; ‘पितरों’ अधिक शाब्दिक किंतु आज के पाठक के लिए संस्कारगत या पुरातन अर्थ जगा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। युवक के निर्भीक प्रश्न और राजा की आज्ञा बनाम व्यवस्था की आज्ञा का समानान्तर विरोध सुरक्षित रखा गया है।
