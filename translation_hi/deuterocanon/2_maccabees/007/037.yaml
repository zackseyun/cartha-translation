base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/037.yaml
  text: But I[a], like my brothers, give up both body and life for the laws of our fathers, calling on God quickly to become merciful to the nation, and for you, through torments and whippings[b], to confess that he alone is God.
translation:
  language: hi
  text: पर मैं भी अपने भाइयों के समान अपने पूर्वजों की व्यवस्थाओं के लिए अपना शरीर और जीवन[a] सौंप देता हूँ, परमेश्वर से यह प्रार्थना करते हुए कि वह शीघ्र ही इस राष्ट्र पर दया करे, और तू यातनाएँ और कोड़े सहकर यह स्वीकार करे[b] कि केवल वही परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाग्य’। यूनानी शब्द τύχη किसी व्यक्ति के भाग, नियति या दशा को सूचित कर सकता है; यहाँ संदर्भ उस जीवन से है जिसे शहादत में सौंपा जा रहा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘खुले रूप से मान ले’। यहाँ प्रयुक्त यूनानी क्रिया सार्वजनिक रूप से स्वीकार करने या अंगीकार करने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οἱ ἀδελφοί
  choice: अपने भाइयों के समान
  rationale: यह तुलना वक्ता के भाइयों के बलिदानी उदाहरण से करती है; आधुनिक हिन्दी में यह स्वाभाविक और स्रोत के निकट है।
- source_word: σῶμα καὶ τύχην
  choice: अपना शरीर और जीवन
  rationale: σῶμα का सीधा अर्थ ‘शरीर’ है। τύχη सामान्यतः भाग्य, दशा या जीवन में मिले हिस्से को सूचित कर सकता है, पर यहाँ शहादत में सौंपे जा रहे जीवन का ठोस भाव है।
- source_word: προδίδωμι
  choice: अर्पित करता हूँ
  rationale: यहाँ क्रिया स्वेच्छा से शरीर और जीवन सौंपने का भाव देती है; ‘धोखा देता हूँ’ संदर्भ में अनुचित होगा।
- source_word: περὶ τῶν πατρίων νόμων
  choice: अपने पूर्वजों की व्यवस्थाओं के लिए
  rationale: περί यहाँ ‘के लिए/की खातिर’ का अर्थ देता है, और πατρίων पैतृक या पूर्वजों से मिली व्यवस्था को सूचित करता है।
- source_word: ἐπικαλούμενοι τὸν θεόν
  choice: परमेश्वर से प्रार्थना करता हूँ
  rationale: वाक्य के संदर्भ में यह परमेश्वर को पुकारकर उससे विनती करने का भाव है। यूनानी कृदन्त बहुवचन में है, पर मुख्य वक्ता प्रथम पुरुष एकवचन है; हिन्दी में आशय स्पष्ट रखने के लिए एकवचन लिया गया है।
- source_word: ἵλεων ταχὺ τῷ ἔθνει γενέσθαι
  choice: वह शीघ्र ही हमारी जाति पर दया करे
  rationale: ἵλεως अनुकूल या दयालु होने का भाव देता है; ‘दया करे’ सहज हिन्दी है। τῷ ἔθνει का संदर्भ यहूदी जनसमुदाय से है, जिसे ‘हमारी जाति’ स्पष्ट करता है।
- source_word: μετὰ ἐτασμῶν καὶ μαστίγων
  choice: यातनाएँ और कोड़े सहकर
  rationale: यह अभिव्यक्ति उन यातनाओं और प्रहारों को बताती है जिनके माध्यम से राजा स्वीकारोक्ति तक पहुँचेगा; हिन्दी में यह अर्थ स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἐξομολογήσασθαι
  choice: स्वीकार करे
  rationale: क्रिया स्वीकार करने, मान लेने या खुले रूप से अंगीकार करने का अर्थ दे सकती है। यहाँ ‘स्वीकार करे’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: διότι μόνος αὐτὸς θεὸς ἐστίν
  choice: कि केवल वही परमेश्वर है
  rationale: μόνος αὐτός की विशिष्टता और पहले उल्लिखित परमेश्वर की ओर सर्वनाम-संबंध दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: अंतिम वाक्यांश में एकमात्र परमेश्वर की स्वीकारोक्ति
  choice: कि केवल वही परमेश्वर है
  alternative: कि वही एकमात्र परमेश्वर है
  rationale: चुना हुआ रूप μόνος αὐτός के बल को बनाए रखता है और पहले उल्लिखित परमेश्वर की ओर संकेत करता है, बिना कथन में अतिरिक्त व्याख्या जोड़े।
- issue: πατρίων का पारिवारिक और परंपरागत भाव
  choice: अपने पूर्वजों की व्यवस्थाओं
  alternative: अपनी पैतृक व्यवस्थाओं
  rationale: ‘पूर्वजों की’ स्रोत के वंशगत और परंपरागत भाव को स्पष्ट, सहज आधुनिक हिन्दी में बनाए रखता है।
- issue: राजा की स्वीकारोक्ति और यातना का संबंध
  choice: यातनाएँ और कोड़े सहकर यह स्वीकार करे
  alternative: यातनाओं और कोड़ों के द्वारा यह स्वीकार करे
  rationale: यूनानी μετὰ साधन या साथ की परिस्थिति को व्यक्त कर सकता है। चुना हुआ रूप कारण-प्रक्रिया को स्पष्ट करता है, पर यह नहीं जोड़ता कि स्वीकारोक्ति स्वेच्छिक होगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यवस्थाओं’ से पैतृक धार्मिक कानूनों का भाव आता है; ‘हमारी जाति’ प्रसंगगत यहूदी जनसमुदाय को दर्शाती है, आधुनिक राष्ट्र-राज्य को नहीं। पद को दो वाक्यों में बाँटकर प्रार्थना और आत्म-अर्पण का संबंध स्पष्ट किया गया है।
