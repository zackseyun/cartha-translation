lexical_decisions:
- source_word: σὺ δὲ
  choice: पर तुम
  rationale: δέ का विरोधात्मक भाव और σὺ का बलयुक्त सीधा संबोधन संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: μὴ νομίσῃς
  choice: यह मत समझो
  rationale: यह वाक्यांश एक गलत धारणा रखने से रोकता है; आधुनिक हिन्दी में 'यह मत समझो' स्वाभाविक और स्पष्ट है।
- source_word: ἀθῷος
  choice: निर्दोष
  rationale: शब्द का मूल अर्थ दोष या उत्तरदायित्व से मुक्त होना है; 'निर्दोष' इसे सुरक्षित रखता है, जबकि 'दण्ड से बच जाओगे' परिणाम को व्याख्यात्मक रूप से जोड़ देता।
- source_word: ἔσεσθαι
  choice: ठहरोगे
  rationale: νομίσῃς पर निर्भर भविष्य infinitive को हिन्दी में भविष्यकाल से व्यक्त किया गया है; 'निर्दोष ठहरोगे' न्यायिक अथवा उत्तरदायित्व-संबंधी भाव को स्वाभाविक रूप देता है।
- source_word: θεομαχεῖν
  choice: परमेश्वर से लड़ने
  rationale: यौगिक क्रिया का सशक्त और लगभग शाब्दिक अर्थ 'परमेश्वर से लड़ना' है; केवल 'विरोध करना' उसकी तीव्रता घटा देता।
- source_word: ἐπιχειρήσας
  choice: प्रयत्न करके
  rationale: अओरिस्ट कृदन्त किसी कार्य को हाथ में लेने या उसका प्रयत्न करने का भाव देता है; यह रूप मुख्य चेतावनी के आधार को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: θεομαχεῖν का अनुवाद
  choice: परमेश्वर से लड़ने
  alternative: परमेश्वर का विरोध करने
  rationale: मूल शब्द राजा के अत्याचार को स्वयं परमेश्वर के विरुद्ध सक्रिय संघर्ष बताता है। अधिक सामान्य विकल्प के बजाय सशक्त मूल रूपक को बनाए रखा गया है।
- issue: ἀθῷος का आशय
  choice: निर्दोष ठहरोगे
  alternative: दण्ड से नहीं बचोगे
  rationale: मूल पाठ दोषमुक्त होने की बात कहता है, दण्ड के परिणाम को सीधे नहीं कहता। इसलिए सम्भावित परिणाम को पाठ में जोड़ने के बजाय मूल न्यायिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गंभीर और गरिमापूर्ण संबोधन। वाक्य को सामान्य पाठक के लिए सहज रखते हुए यूनानी मूल की चेतावनी, दोष-संबंधी भाषा और 'परमेश्वर से लड़ने' की तीव्र छवि सुरक्षित रखी गई है।
