base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/029.yaml
  text: Do not fear this executioner[a], but, becoming worthy of your brothers, accept death[c][b], so that in mercy I may receive you back together with your brothers.
translation:
  language: hi
  text: इस जल्लाद[a] से मत डर, बल्कि अपने भाइयों के योग्य बनकर मृत्यु को स्वीकार कर, ताकि दया से[b] मैं तुझे तेरे भाइयों के साथ फिर पा सकूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस यातना देने वाले से।’ यूनानी शब्द δήμιος मुख्यतः जल्लाद को दर्शाता है, यद्यपि व्यापक प्रसंग में यातना देना भी शामिल है।
    reason: lexical_alternative
  - marker: b
    text: ‘दया से’ संभवतः परमेश्वर की दया अभिप्रेत है, पर इस उपवाक्य के यूनानी पाठ में परमेश्वर का नाम स्पष्ट रूप से नहीं आया है।
    reason: alternative_reading
  - marker: c
    text: या ‘तुझे वापस प्राप्त कर सकूँ’ अथवा ‘तुझे ग्रहण कर सकूँ।’ यह शब्द अपने पुत्र और उसके भाइयों के साथ फिर मिलने की माँ की आशा व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῇς
  choice: मत डर
  rationale: निषेधात्मक आज्ञा को आधुनिक और स्वाभाविक हिन्दी में सीधे व्यक्त करता है; माँ का अपने पुत्र से आत्मीय एकवचन संबोधन भी बना रहता है।
- source_word: τὸν δήμιον τοῦτον
  choice: इस जल्लाद
  rationale: δήμιος का अधिक सटीक अर्थ मृत्युदंड देने वाला व्यक्ति है। प्रसंग में यातना भी है, पर ‘जल्लाद’ तत्काल कथन के आशय को स्पष्ट और संक्षिप्त रखता है।
- source_word: τῶν ἀδελφῶν σου ἄξιος γενόμενος
  choice: अपने भाइयों के योग्य बनकर
  rationale: γενόμενος के ‘बनने’ वाले भाव को बनाए रखता है और ἀδελφῶν को वास्तविक पुरुष सहोदरों के रूप में अनूदित करता है।
- source_word: ἐπίδεξαι τὸν θάνατον
  choice: मृत्यु को स्वीकार कर
  rationale: ἐπιδέχομαι के ग्रहण या स्वीकार करने के भाव को यहाँ स्वेच्छा से शहादत स्वीकार करने की आज्ञा के रूप में स्वाभाविक हिन्दी देता है।
- source_word: ἵνα
  choice: ताकि
  rationale: मूल के उद्देश्य अथवा परिणाम-संबंध को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ ἐλέει
  choice: दया में
  rationale: यूनानी में दया का कर्ता स्पष्ट नहीं है। यह संक्षिप्त रूप संभावित ईश्वरीय दया का संकेत बनाए रखता है, पर पाठ में ‘परमेश्वर’ नहीं जोड़ता।
- source_word: σὺν τοῖς ἀδελφοῖς σου
  choice: तेरे भाइयों के साथ
  rationale: σύν के साथ होने और पुनर्मिलन के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κομίσωμαί σε
  choice: मैं तुझे फिर पा सकूँ
  rationale: κομίζω के वापस पाने या पुनः प्राप्त करने के अर्थ को दर्शाता है और मृत्यु के बाद पुनर्मिलन की आशा को बिना उसकी प्रक्रिया स्पष्ट किए सुरक्षित रखता है।
theological_decisions:
- issue: ἐν τῷ ἐλέει में दया को परमेश्वर की दया के रूप में स्पष्ट करना
  choice: ‘दया में’ रखा गया और ‘परमेश्वर की’ नहीं जोड़ा गया।
  alternative: ‘परमेश्वर की दया में’ अथवा ‘परमेश्वर की दया के द्वारा’।
  rationale: व्यापक प्रसंग ईश्वरीय दया की ओर संकेत करता है, पर इस उपवाक्य में यूनानी पाठ परमेश्वर का नाम स्पष्ट रूप से नहीं लेता। अनुवाद इस निहितार्थ और अस्पष्टता दोनों को बनाए रखता है।
- issue: κομίσωμαί σε में पुनरुत्थान और पुनर्मिलन का आशय
  choice: ‘मैं तुझे फिर पा सकूँ’।
  alternative: ‘मैं तुझे प्राप्त कर सकूँ’ अथवा अधिक स्पष्ट रूप से ‘पुनरुत्थान में मैं तुझे फिर पा सकूँ’।
  rationale: यह वाक्य माँ की मृत्यु के पार अपने पुत्रों से मिलने की आशा व्यक्त करता है। ‘फिर पा सकूँ’ पुनःप्राप्ति का भाव रखता है, पर मूल से अधिक स्पष्ट रूप से पुनरुत्थान की प्रक्रिया नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। माँ और पुत्र के आत्मीय संबंध को दिखाने के लिए ‘तू/तेरा’ रूप प्रयुक्त हुआ है। वाक्य की गंभीरता बनाए रखने हेतु ‘जल्लाद’, ‘योग्य’ और ‘मृत्यु को स्वीकार कर’ जैसे औपचारिक किंतु प्रचलित पद चुने गए हैं।
