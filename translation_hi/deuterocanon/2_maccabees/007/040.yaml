  text: And so this one also passed away in purity[b][a], having placed his full confidence in the Lord.
translation:
  language: hi
  text: और इस प्रकार वह भी शुद्धता के साथ संसार से विदा हुआ[a], और उसने प्रभु पर पूरी तरह भरोसा रखा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्ध रीति से मर गया।” यूनानी क्रियाविशेषण में संभवतः नैतिक या धार्मिक शुद्धता का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसने प्रभु पर पूर्ण भरोसा किया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὗτος οὖν
  choice: और इस प्रकार वह भी
  rationale: καί और οὖν के संयोजक तथा निष्कर्षसूचक भाव और οὗτος के संकेतात्मक बल को कथा के स्वाभाविक हिन्दी क्रम में रखता है।
- source_word: καθαρῶς
  choice: शुद्धता के साथ
  rationale: यह मृत्यु के ढंग या नैतिक-धार्मिक दशा को सूचित करता है; ‘शुद्धता के साथ’ उस अर्थ को सुरक्षित रखता है और केवल बाहरी स्वच्छता का संकेत नहीं देता।
- source_word: μετήλλαξεν
  choice: संसार से विदा हुआ
  rationale: यहाँ क्रिया मृत्यु के लिए आदरपूर्ण परोक्ष अभिव्यक्ति है; यह हिन्दी में स्वाभाविक है और सीधे ‘मर गया’ की अपेक्षा यूनानी की शिष्ट शैली को दर्शाती है।
- source_word: παντελῶς
  choice: पूरी तरह
  rationale: यह भरोसे की पूर्णता को क्रियाविशेषण के रूप में स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τῷ κυρίῳ
  choice: प्रभु पर
  rationale: πεποιθώς के साथ ἐπί तथा सम्प्रदान भरोसे के आधार या अवलंब को व्यक्त करता है; हिन्दी में ‘प्रभु पर भरोसा’ इसका सीधा मुहावरा है।
- source_word: πεποιθώς
  choice: भरोसा रखा था
  rationale: पूर्णकालिक कृदन्त पहले स्थापित और मृत्यु के समय तक बनी हुई भरोसे की अवस्था व्यक्त करता है; ‘रखा था’ उस स्थिर भाव को सहज हिन्दी में दर्शाता है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह यहूदी-यूनानी संदर्भ में सार्वभौम परमेश्वर के लिए प्रतिष्ठित और स्वाभाविक हिन्दी पद है।
theological_decisions:
- issue: καθαρῶς द्वारा शहीद की मृत्यु का नैतिक या धार्मिक वर्णन
  choice: वह शुद्धता की दशा या रीति में संसार से विदा हुआ।
  alternative: वह केवल निष्कलंक या उत्तम रीति से मरा, बिना स्पष्ट नैतिक-धार्मिक आशय के।
  rationale: व्यवस्था के प्रति निष्ठा में शहादत का प्रसंग नैतिक-धार्मिक अर्थ का समर्थन करता है, पर अनुवाद इसे किसी विशिष्ट कर्मकाण्डीय शुद्धता तक सीमित नहीं करता।
- issue: παντελῶς और πεποιθώς के बीच संबंध
  choice: ‘पूरी तरह’ को भरोसा रखने की क्रिया से जोड़ा गया है।
  alternative: इसे संज्ञात्मक रूप में ‘पूरा भरोसा’ कहा जा सकता है।
  rationale: यूनानी में παντελῶς क्रियाविशेषण है; हिन्दी में ‘पूरी तरह भरोसा रखा’ उसकी व्याकरणिक शक्ति और पूर्ण समर्पण दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। ‘संसार से विदा हुआ’ मृत्यु के लिए मूल यूनानी की आदरपूर्ण परोक्ष अभिव्यक्ति को दर्शाता है। ‘शुद्धता’ नैतिक-धार्मिक संकेत बनाए रखती है, पर उसे अनावश्यक रूप से कर्मकाण्डीय अर्थ नहीं देती।
