base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/018.yaml
  text: After him they brought the sixth[a], and as he was about to die he said, “Do not be deceived; for we are suffering these things because of ourselves, having sinned against our own God[b]. Astonishing things have happened.”
translation:
  language: hi
  text: उसके बाद वे छठे को ले आए। जब वह मरने ही वाला था, तो उसने कहा, “और अधिक भ्रम में मत पड़ो[a]। हम ये कष्ट अपने ही कारण सह रहे हैं, क्योंकि हमने अपने परमेश्वर के विरुद्ध पाप किया है। विस्मय के योग्य घटनाएँ घटी हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धोखा मत खाओ,” अथवा “और अधिक मत भटको।” यूनानी अभिव्यक्ति संक्षिप्त है; πλανῶ का अर्थ भ्रमित होना, धोखा खाना, या भटकना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “विस्मय के योग्य बातें घटित हुई हैं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον ἤγον τὸν ἕκτον
  choice: उसके बाद वे छठे को ले आए
  rationale: Μετὰ τοῦτον क्रम को सूचित करता है। ἤγον का अपूर्णकाल कथात्मक हिन्दी में स्वाभाविक भूतकाल से व्यक्त किया गया है। मूल में ‘भाई’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: μέλλον ἀποθνήσκειν
  choice: जब वह मरने ही वाला था
  rationale: μέλλω और infinitive आसन्न घटना बताते हैं; ‘मरने ही वाला था’ इस निकटता को सहज हिन्दी में रखता है।
- source_word: Μὴ πλανῶ μάλλον
  choice: अपने आप को धोखे में मत रखो
  rationale: πλανῶ को यहाँ मध्य/निष्क्रिय अर्थ में ‘भ्रमित या धोखे में होना’ समझा गया है। वाक्यांश संक्षिप्त और पाठगत रूप से कठिन है; μάλλον का बल हिन्दी की अभिव्यक्ति में समाहित है, और विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: ἡμεῖς γὰρ διʼ ἑαυτοὺς ταῦτα πάσχομεν
  choice: हम ये कष्ट अपने ही कारण सह रहे हैं
  rationale: διʼ ἑαυτούς लाभ नहीं, बल्कि उन्हीं में निहित कारण या दोष को व्यक्त करता है। ‘अपने ही कारण’ इस आत्म-दायित्व को स्पष्ट रखता है।
- source_word: ἁμαρτόντες εἰς τὸν ἑαυτῶν θεόν
  choice: क्योंकि हमने अपने परमेश्वर के विरुद्ध पाप किया है
  rationale: परिस्थितिवाचक participle को कारणवाचक उपवाक्य बनाया गया है। εἰς अपराध की दिशा परमेश्वर की ओर दिखाता है, जिसे हिन्दी में ‘के विरुद्ध’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄξια θαυμασμοῦ γέγονε
  choice: विस्मय के योग्य घटनाएँ घटी हैं
  rationale: यह लगभग शाब्दिक अर्थ को पठनीय हिन्दी में सुरक्षित रखता है। मूल में कोई स्पष्ट निष्कर्षसूचक संयोजक नहीं है, इसलिए ‘इसलिए’ नहीं जोड़ा गया।
theological_decisions:
- issue: भाइयों के कष्ट का कारण
  choice: वक्ता कष्ट को उनके अपने पाप से जोड़ता है
  alternative: ‘अपने कारण’ को केवल सामान्य संबंध के रूप में पढ़ना, दोष पर कम बल देते हुए
  rationale: πάσχομεν के साथ ἁμαρτόντες स्पष्टतः पाप को कष्ट से जोड़ता है; इसलिए दैवी न्याय से जुड़ी मूल theological tension को नरम नहीं किया गया।
- issue: अंतिम कथन का संबंध
  choice: अंतिम वाक्य को बिना जोड़े स्वतंत्र कथन के रूप में रखा गया
  alternative: ‘इसलिए विस्मयकारी घटनाएँ घटी हैं’
  rationale: ग्रीक में अंतिम खंड से पहले कोई स्पष्ट कारणवाचक या निष्कर्षसूचक संयोजक नहीं है। संबंध संदर्भ से समझा जा सकता है, पर अनुवाद में उसे निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रूप अपनाया गया है। ‘छठे’ को संदर्भ के भरोसे रखा गया है और मूल में अनुपस्थित ‘भाई’ नहीं जोड़ा गया। संबोधन एकवचन है।
