base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/033.yaml
  text: But if our living Lord has become angry for a little while for the sake of rebuke and discipline[b][a], he will again be reconciled with his own servants.
translation:
  language: hi
  text: परन्तु यदि हमारे जीवित प्रभु डाँटने और अनुशासन के लिए थोड़े समय तक क्रोधित हुए हैं, तो वे फिर अपने दासों के साथ मेल करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “तो वे फिर अपने दासों के प्रति प्रसन्न हो जाएंगे।” यूनानी क्रिया क्रोध के बाद अनुग्रह अथवा संबंध की पुनर्बहाली पर बल दे सकती है।'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: परन्तु यदि
  rationale: यह शर्तसूचक संक्रमण है; δὲ का हल्का विरोधात्मक भाव ‘परन्तु’ से व्यक्त होता है।
- source_word: χάριν ἐπιπλήξεως καὶ παιδίας
  choice: डाँट और अनुशासन के लिए
  rationale: χάριν प्रयोजन अथवा कारण बताता है; ἐπίπληξις सुधारने वाली डाँट और παιδία यहाँ दंडात्मक प्रशिक्षण अथवा अनुशासन को सूचित करता है।
- source_word: ὁ ζῶν κύριος ἡμῶν
  choice: हमारे जीवित प्रभु
  rationale: ζῶν को विशेषणवत ‘जीवित’ और κύριος को स्वाभाविक धार्मिक पद ‘प्रभु’ से व्यक्त किया गया है।
- source_word: βραχέως ἐπωργίσται
  choice: थोड़े समय तक क्रोध किया है
  rationale: βραχέως की अल्पकालिकता और पूर्णकाल ἐπωργίσται से प्राप्त वर्तमान-प्रासंगिक स्थिति दोनों सुरक्षित हैं।
- source_word: καὶ πάλιν καταλλαγήσεται
  choice: तो वह फिर ... से मेल कर लेगा
  rationale: πάλιν पुनःस्थापन दर्शाता है और καταλλαγήσεται क्रोध के बाद संबंध तथा अनुग्रह बहाल होने का भाव रखता है।
- source_word: τοῖς ἑαυτοῦ δούλοις
  choice: अपने दासों
  rationale: ἑαυτοῦ आत्मवाचक स्वामित्व को और δοῦλοι प्रभु के अधीन होकर उसी से संबंध रखने वालों को दर्शाता है; हिन्दी में ‘दास’ गरिमापूर्ण और स्रोत के निकट है।
theological_decisions:
- issue: δοῦλοι का प्रभु के साथ संबंध में अनुवाद
  choice: दासों
  alternative: सेवकों
  rationale: ‘दास’ अधीनता और अपने प्रभु से संबंधित होने का स्रोतगत भाव बनाए रखता है; ‘सेवक’ अधिक सहज विकल्प है, पर बंधे हुए स्वामित्व के भाव को नरम कर सकता है।
- issue: καταλλαγήσεται में ईश्वर और मनुष्यों के संबंध की पुनर्बहाली
  choice: मेल कर लेगा
  alternative: फिर उनसे प्रसन्न हो जाएगा
  rationale: ‘मेल कर लेगा’ अस्थायी क्रोध के बाद संबंध बहाल होने का भाव रखता है और यह तय नहीं करता कि क्रिया को केवल शांत या प्रसन्न होने के अर्थ में समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। ‘डाँट’ सामान्य पाठक के लिए स्पष्ट है, ‘अनुशासन’ सुधारात्मक आशय रखता है, और ‘दास’ स्रोतगत संबंध को सुरक्षित करता है।
