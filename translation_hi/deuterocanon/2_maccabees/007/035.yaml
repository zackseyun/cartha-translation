  yaml_path: translation/deuterocanon/2_maccabees/007/035.yaml
  text: For in this way you have not escaped the judgment of God[a], the all-powerful overseer.
translation:
  language: hi
  text: क्योंकि इस प्रकार तुम सर्वशक्तिमान और निगरानी रखने वाले परमेश्वर के न्याय से नहीं बच पाए हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वीटे में प्राप्त यूनानी पाठ का शाब्दिक अर्थ है, “क्योंकि इस प्रकार तुम सर्वशक्तिमान और निगरानी रखने वाले परमेश्वर के न्याय से बच निकले हो।” पर संदर्भ नकारात्मक अर्थ, “नहीं बच पाए हो,” का प्रबल समर्थन करता है।
    reason: textual_variant
lexical_decisions:
- source_word: οὕτω
  choice: इस प्रकार
  rationale: यह क्रियाविशेषण पिछली बात में बताए गए ढंग की ओर संकेत करता है; ‘इस प्रकार’ उसके संदर्भसूचक और निष्कर्षात्मक बल को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के साथ व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κρίσιν
  choice: न्याय
  rationale: यहाँ शब्द परमेश्वर के न्यायिक निर्णय और दंड—दोनों की संभावना खुली रखता है; ‘न्याय’ अनावश्यक रूप से केवल ‘दंडादेश’ तक अर्थ को सीमित नहीं करता।
- source_word: ἐκπέφευγας
  choice: तुम ... नहीं बच पाए हो
  rationale: पूर्णकालिक क्रिया बच निकलने के परिणामस्वरूप बनी वर्तमान स्थिति का बोध कराती है। उपलब्ध यूनानी पाठ में निषेध नहीं है, पर निकटवर्ती संदर्भ नकारात्मक अर्थ की प्रबल माँग करता है; इस पाठगत कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: παντοκράτορος
  choice: सर्वशक्तिमान
  rationale: यह परमेश्वर की सर्वव्यापी सत्ता और सामर्थ्य व्यक्त करने वाला प्रतिष्ठित, सुबोध और गरिमापूर्ण हिन्दी विशेषण है।
- source_word: ἐπόπτου
  choice: सब पर दृष्टि रखने वाले
  rationale: यह उस व्यक्ति का भाव व्यक्त करता है जो देखता और निगरानी रखता है। यह ‘निरीक्षक’ की प्रशासनिक ध्वनि से बचते हुए संदर्भ में परमेश्वर की सर्वदर्शी निगरानी को स्पष्ट करता है।
- source_word: θεοῦ
  choice: परमेश्वर
  rationale: यह ‘न्याय’ पर आश्रित संबंधकारक संज्ञा है, जिसे παντοκράτορος और ἐπόπτου विशेषित करते हैं; ‘परमेश्वर’ आधुनिक बाइबलीय हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: παντοκράτορος ἐπόπτου θεοῦ में परमेश्वर की उपाधियों का अनुवाद
  choice: सर्वशक्तिमान और सब पर दृष्टि रखने वाले परमेश्वर
  alternative: सर्वशक्तिमान निरीक्षक परमेश्वर; सर्वशक्तिमान परमेश्वर, जो सबको देखता है
  rationale: यूनानी पाठ में दोनों विशेषण परमेश्वर को विशेषित करते हैं। चुना गया रूप उसकी सामर्थ्य और निगरानी—दोनों को स्पष्ट रखता है, पर किसी बाद की संप्रदायगत शब्दावली को आरोपित नहीं करता।
- issue: स्पष्ट निषेध के बिना प्राप्त ἐκπέφευγας का अर्थ
  choice: तुम ... नहीं बच पाए हो
  alternative: तुम ... बच निकले हो
  rationale: स्वीटे के प्राप्त पाठ में क्रिया व्याकरणतः सकारात्मक है, पर तत्काल प्रसंग अत्याचारी को चेतावनी देता है कि वह परमेश्वर के न्याय से नहीं बच सकता। इसलिए मुख्य पाठ में संदर्भ-सम्मत नकारात्मक अर्थ रखा गया है और वास्तविक पाठगत तनाव को पादटिप्पणी में छिपाए बिना दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध, गरिमापूर्ण और प्रत्यक्ष संबोधन वाला रूप अपनाया गया है। वाक्य में मूल यूनानी का व्याख्यात्मक संबंध और परमेश्वर की दोनों उपाधियाँ सुरक्षित हैं; पाठगत असंगति को मुख्य पाठ में चुपचाप सुलझाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
