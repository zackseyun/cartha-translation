  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की लम्बी यूनानी संरचना को बनाए रखते हुए हिन्दी में स्पष्ट क्रम दिया गया है। ‘अन्तियोकुस’ यूनानी नाम का निकट देवनागरी लिप्यन्तरण है।
