base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/024.yaml
  text: But Antiochus[a], thinking that he was being despised and taking note of the reproachful tone, while the youngest was still alive, not only urged him with words, but also assured him with oaths that he would both make him rich and make him blessed, if he turned away from the traditions of his fathers[c][b], and that he would have him as a friend and entrust him with offices.
translation:
  language: hi
  text: पर अन्तियोकस ने, यह समझकर कि उसका तिरस्कार किया जा रहा है और उस अपमानजनक स्वर को पहचानकर,[a] जबकि सबसे छोटा पुत्र अभी जीवित था, न केवल शब्दों से उसे मनाने का प्रयास किया, बल्कि शपथ देकर उसे यह आश्वासन भी दिया कि यदि वह अपने पूर्वजों की परम्पराओं से विमुख हो जाए, तो वह उसे धनी और सौभाग्यशाली बनाएगा, उसे अपना मित्र[b] मानेगा और उसे राजकीय दायित्व सौंपेगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “निन्दा करने वाली आवाज़”; इसका अर्थ “अपमानजनक आवाज़” या “निन्दा-भरी वाणी” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मित्र” राजदरबार की एक पदवी का भाव भी रख सकता है—राजा का निकट सहयोगी या कृपापात्र अधिकारी।
    reason: cultural_note
  - marker: c
    text: या, “उसे जिम्मेदारियाँ सौंपेगा” अथवा “उसे पदों पर नियुक्त करेगा”; यूनानी शब्द राजा द्वारा सौंपे गए कार्यों या पदों से जुड़े दायित्वों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰόμενος
  choice: यह समझकर
  rationale: यह अन्तियोकुस की अपनी धारणा को व्यक्त करता है; इससे कथन वस्तुगत तथ्य के रूप में प्रस्तुत नहीं होता।
- source_word: καταφρονεῖσθαι
  choice: उसका तिरस्कार किया जा रहा है
  rationale: कर्मवाच्य अर्थ और राजकीय अपमान की अनुभूति दोनों सुरक्षित रहते हैं।
- source_word: τὴν ὀνειδίζουσαν ... φωνήν
  choice: उस धिक्कार-भरे स्वर
  rationale: शाब्दिक अर्थ ‘धिक्कारने वाली आवाज़’ है; ‘स्वर’ आधुनिक हिन्दी में बोलने के अपमानजनक ढंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑφορώμενος
  choice: भाँपकर
  rationale: सन्दर्भ में यह उस स्वर को पहचानने या उसमें छिपे अपमान को महसूस करने का भाव देता है, बिना अनावश्यक रूप से प्रबल संशय जोड़ने के।
- source_word: ἔτι τοῦ νεωτέρου περιόντος
  choice: जब सबसे छोटा पुत्र अभी जीवित था
  rationale: शहादत के प्रसंग में περιόντος का अर्थ केवल उपस्थित होना नहीं, बल्कि अब तक जीवित बचा होना है। ‘पुत्र’ निकटवर्ती प्रसंग से स्पष्ट है और हिन्दी में सहजता देता है।
- source_word: τὴν παράκλησιν ... ἐποιεῖτο
  choice: मनाने का प्रयास किया
  rationale: यहाँ παράκλησις आग्रह या समझाने-बुझाने का प्रयास है; प्रसंग में ‘मनाना’ स्पष्ट और स्वाभाविक है।
- source_word: διʼ ὅρκων ἐπίστου
  choice: शपथ खाकर उसे विश्वास भी दिलाया
  rationale: यह साधारण आग्रह से आगे बढ़कर शपथ द्वारा दी गई पक्की प्रतिज्ञा और आश्वासन को व्यक्त करता है।
- source_word: πλουτιεῖν
  choice: धनी बनाएगा
  rationale: राजा द्वारा दिए जाने वाले भौतिक पुरस्कार का सीधा अर्थ सुरक्षित है।
- source_word: μακαριστὸν ποιήσειν
  choice: सौभाग्यशाली बनाएगा
  rationale: राजकीय संरक्षण, प्रतिष्ठा और अनुकूल दशा के लौकिक आशय को व्यक्त करता है; ‘धन्य’ के सम्भावित धार्मिक अर्थ को यहाँ अनावश्यक रूप से नहीं लाता।
- source_word: μεταθέμενον ἀπὸ τῶν πατρίων
  choice: यदि वह अपने पूर्वजों की परम्पराओं से विमुख हो जाए
  rationale: कृदन्त का शर्तसूचक भाव और पैतृक धार्मिक-सांस्कृतिक विरासत से हटने का अर्थ दोनों बने रहते हैं।
- source_word: φίλον ἕξειν
  choice: उसे अपना मित्र मानेगा
  rationale: मूल का सामान्य अर्थ सुरक्षित है; हेलेनिस्तानी राजदरबार में इसके पदवी-सदृश विशेष अर्थ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: χρείας ἐμπιστεύσειν
  choice: उसे राजकीय दायित्व सौंपेगा
  rationale: χρείας सौंपे गए काम, जिम्मेदारियाँ या पदगत सेवाएँ हो सकती हैं; ‘राजकीय दायित्व’ प्रसंग को स्पष्ट करता है, पर किसी निश्चित पद को आरोपित नहीं करता।
theological_decisions:
- issue: πατρίων का धार्मिक-सांस्कृतिक आशय
  choice: पूर्वजों की परम्पराएँ
  alternative: पैतृक रीति-रिवाज / पूर्वजों के मार्ग
  rationale: यह वाक्य विरासत में मिली यहूदी प्रथाओं को त्यागने के दबाव की ओर संकेत करता है। चुना हुआ रूप पारिवारिक और धार्मिक विरासत को बनाए रखता है, पर मूल से अधिक विशिष्ट नहीं होता।
- issue: लौकिक राजकीय प्रतिज्ञा में μακαριστόν
  choice: सौभाग्यशाली
  alternative: धन्य / सुखी / प्रतिष्ठित
  rationale: यहाँ अन्तियोकुस धन, संरक्षण और ऊँचे सामाजिक स्थान का प्रलोभन दे रहा है। ‘सौभाग्यशाली’ शब्द के सकारात्मक अर्थ को रखता है, पर इसे अनिवार्यतः परमेश्वर की आशीष नहीं बनाता।
