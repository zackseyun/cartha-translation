base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/006.yaml
  text: The Lord God is watching[a], and in truth he is being moved to compassion for us, just as Moses made clear in the song that testifies openly, saying[c][b], “And he will be moved to compassion for his servants.”
translation:
  language: hi
  text: “प्रभु परमेश्वर देख रहा है, और सचमुच वह हमारे विषय में करुणा से द्रवित हो रहा है,[a] जैसा कि मूसा ने उस गीत के द्वारा स्पष्ट किया जो खुलकर साक्षी देता है। उसने कहा, ‘और वह अपने दासों के विषय में करुणा से द्रवित होगा।’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह हमारे विषय में सांत्वना पा रहा है … वह अपने दासों के विषय में सांत्वना पाएगा।” यूनानी क्रिया में सांत्वना पाने, प्रोत्साहित किए जाने, अथवा दया से द्रवित होने जैसे अर्थ हो सकते हैं; यहाँ प्रसंग और मूसा के गीत का उद्धरण करुणा या तरस के अर्थ का समर्थन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: यह उद्धरण व्यवस्थाविवरण 32:36 की प्रतिध्वनि है, जहाँ प्रभु के अपने दासों के विषय में द्रवित होने की बात कही गई है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐφορᾷ
  choice: देख रहा है
  rationale: वर्तमान काल की सक्रिय और निरंतर दृष्टि को स्वाभाविक हिन्दी में व्यक्त करता है; ‘रक्षा कर रहा है’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ταῖς ἀληθείαις
  choice: सचमुच
  rationale: यूनानी बहुवचन दत्तिव का यहाँ क्रियाविशेषणीय बल है; ‘सचमुच’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: παρακαλεῖται
  choice: हम पर करुणा करने को द्रवित हो रहा है
  rationale: आगे आए व्यवस्थाविवरण 32:36 के संकेत के अनुसार यह दया से द्रवित होने अथवा तरस खाने का भाव देता है और यूनानी कर्मवाच्य रूप की छाया भी बनाए रखता है।
- source_word: κατὰ πρόσωπον ἀντιμαρτυρούσης
  choice: सामने से साक्षी देता है
  rationale: κατὰ πρόσωπον की प्रत्यक्षता तथा ἀντιμαρτυρούσης के साक्षी देने के भाव को बनाए रखता है; विरोध में गवाही देने की संभावित छाया को पूरी तरह मिटाता नहीं।
- source_word: διεσάφησεν
  choice: स्पष्ट किया
  rationale: किसी बात को साफ या प्रत्यक्ष कर देने के अर्थ का संक्षिप्त और स्वाभाविक अनुवाद।
- source_word: δούλοις
  choice: दासों
  rationale: ‘दास’ यूनानी सामाजिक-संबंध सूचक शब्द को ‘सेवकों’ की अपेक्षा अधिक पारदर्शी ढंग से व्यक्त करता है और हिन्दी बाइबलीय शैली में भी बोधगम्य है।
- source_word: παρακληθήσεται
  choice: करुणा करने को द्रवित होगा
  rationale: पहले आए समान क्रियापद से शब्दार्थिक संबंध और भावी कर्मवाच्य की छाया बनाए रखता है।
theological_decisions:
- issue: παρακαλεῖται / παρακληθήσεται का अर्थ
  choice: परमेश्वर का अपने लोगों पर करुणा करने को द्रवित होना
  alternative: सांत्वना पाना / मनाया जाना / शांत होना
  rationale: मूसा के गीत, विशेषतः व्यवस्थाविवरण 32:36, की प्रतिध्वनि दया या तरस की ओर संकेत करती है; फिर भी वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: δούλοις का अनुवाद
  choice: दासों
  alternative: सेवकों
  rationale: मूल यूनानी के अधीनता-सूचक संबंध को स्पष्ट रखता है; ‘सेवक’ को पाठ में रखकर सामाजिक अर्थ को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए बोधगम्य शैली। ‘द्रवित होना’ करुणा तथा यूनानी कर्मवाच्य—दोनों को व्यक्त करता है। ‘सामने से साक्षी देता है’ कुछ असामान्य किंतु जानबूझकर रखा गया है, ताकि मूल पदबंध की प्रत्यक्ष और संभवतः प्रतिकूल साक्षी की छाया न मिटे।
