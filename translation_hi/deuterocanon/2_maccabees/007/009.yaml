base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/009.yaml
  text: And as he was at his last breath[a], he said, “You, accursed wretch, release us from this present life, but the King of the world will raise us up, who have died for his laws[b], into an everlasting renewal of life.”
translation:
  language: hi
  text: और जब वह अपनी अंतिम साँस ले रहा था, तो उसने कहा, “तू, अभिशप्त दुष्ट[a], हमें इस वर्तमान जीवन से मुक्त कर रहा है; पर संसार का राजा हमें—जो उसके नियमों के लिए मर चुके हैं—जीवन के अनन्त पुनर्जीवन[b] के लिए उठाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अभागा’ या ‘शापित जन’; यूनानी ἀλάστωρ एक तीखा अपमानसूचक संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में ‘अनन्त’ के साथ एक दुर्लभ संज्ञा है, जिसका अर्थ ‘फिर जीवित होना’ या ‘पुनर्जीवन’ है; अन्य सम्भव अनुवाद: ‘जीवन के अनन्त पुनरुत्थान के लिए।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐσχάτῃ ... πνοῇ γενόμενος
  choice: जब वह अपनी अंतिम साँस पर था
  rationale: यह यूनानी वाक्यांश मृत्यु की अंतिम साँस का सजीव चित्र देता है। हिन्दी में यह रूप कालगत अर्थ और मरते समय बोले गए वचन की तात्कालिकता बनाए रखता है।
- source_word: ἀλάστωρ
  choice: शापित अभागे
  rationale: यह संबोधन एक तीखा अपमान है। ‘शापित अभागे’ उसकी निन्दात्मक तीव्रता को व्यक्त करता है, पर ‘प्रतिशोध लेने वाला’ जैसे विशिष्ट पौराणिक अर्थ को नहीं थोपता।
- source_word: ἐκ τοῦ παρόντος ... ζῆν ἀπολύεις
  choice: हमें इस वर्तमान जीवन से मुक्त कर रहा है
  rationale: शाब्दिक भाव ‘वर्तमान में जीने से विदा करना’ है। यह अनुवाद अत्याचारी की सीमित सामर्थ्य और कथन में निहित विडम्बना को बनाए रखता है।
- source_word: ὁ ... τοῦ κόσμου βασιλεὺς
  choice: संसार का राजा
  rationale: κόσμος को उसके सीधे अर्थ ‘संसार’ में रखा गया है और स्वर्गीय राजा का पृथ्वी के शासक से विरोध स्पष्ट बना रहता है।
- source_word: ἀποθανόντας ἡμᾶς ὑπὲρ τῶν αὐτοῦ νόμων
  choice: हमको—जो उसके नियमों के लिए मर गए हैं—
  rationale: यह शहीदों की मृत्यु को परमेश्वर के नियमों के प्रति निष्ठा के कारण हुई मृत्यु के रूप में व्यक्त करता है और कृदन्त का सम्बन्ध ‘हमको’ से स्पष्ट रखता है।
- source_word: εἰς αἰώνιον ἀναβίωσιν ζωῆς
  choice: जीवन के अनन्त पुनर्जीवन के लिए
  rationale: दुर्लभ संज्ञा ἀναβίωσις का अर्थ फिर जीवित होना या जीवन में लौटना है। ‘पुनर्जीवन’ इस विशिष्ट शब्द को सामान्य ‘पुनरुत्थान’ में पूरी तरह विलीन नहीं करता।
- source_word: ἀναστήσει
  choice: उठा खड़ा करेगा
  rationale: यह क्रिया मृतकों के उठाए जाने की प्रचलित भाषा है। हिन्दी रूप पुनर्जीवन वाले अगले वाक्यांश से अलग रहते हुए भी उससे स्वाभाविक सम्बन्ध रखता है।
theological_decisions:
- issue: शहीदों की मृत्यु के बाद उठाए जाने और अनन्त जीवन की भाषा
  choice: परमेश्वर शहीदों को उठाकर जीवन के अनन्त पुनर्जीवन में प्रवेश कराएगा
  alternative: इसे अधिक व्याख्यात्मक रूप में ‘अनन्त जीवन के पुनरुत्थान के लिए’ कहा जा सकता है
  rationale: यूनानी पाठ ἀναστήσει और दुर्लभ ἀναβίωσις दोनों का प्रयोग करता है। मुख्य पाठ दोनों धारणाओं को अलग-अलग बनाए रखता है और उन्हें किसी बाद की निश्चित पारिभाषिक धर्मशास्त्रीय अभिव्यक्ति में नहीं समेटता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य रूप। प्रत्यक्ष संबोधन में ‘तू’ मूल के तीखे और असम्मानसूचक स्वर को बनाए रखता है। विराम-चिह्न जटिल यूनानी वाक्य की संरचना स्पष्ट करते हैं।
