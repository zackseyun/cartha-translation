  text: After him[a], the third was mocked, and when his tongue was demanded, he quickly held it out and courageously stretched out his hands.
translation:
  language: hi
  text: उसके बाद तीसरे भाई का उपहास किया गया। जब उससे उसकी जीभ माँगी गई[a], तो उसने तुरंत अपनी जीभ आगे कर दी और साहसपूर्वक अपने हाथ आगे बढ़ा दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जब उन्होंने उससे उसकी जीभ माँगी।’ यूनानी में कर्मवाच्य कृदंत है, जिसका शाब्दिक भाव ‘माँगे जाने पर’ है; कर्ता प्रसंग से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον
  choice: उसके बाद
  rationale: यह पदबंध भाइयों के क्रम में अगले व्यक्ति की ओर संकेत करता है; ‘उसके बाद’ स्वाभाविक हिन्दी में कालक्रम और व्यक्तिगत संदर्भ दोनों बनाए रखता है।
- source_word: ὁ τρίτος
  choice: तीसरे भाई
  rationale: यूनानी में केवल संज्ञा की तरह प्रयुक्त ‘तीसरा’ है, पर कथा-संदर्भ में भाई स्पष्ट रूप से निहित है। हिन्दी में ‘तीसरे भाई’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἐνεπαίζετο
  choice: उपहास किया गया
  rationale: क्रिया तिरस्कारपूर्ण हँसी और अपमान को व्यक्त करती है। यातना का विचार व्यापक संदर्भ में है, इसलिए उसे इस क्रिया में अतिरिक्त रूप से नहीं जोड़ा गया।
- source_word: τὴν γλῶσσαν αἰτηθεὶς
  choice: जब उससे उसकी जीभ माँगी गई
  rationale: अओरिस्ट कर्मवाच्य कृदंत को हिन्दी में कालसूचक कर्मवाच्य उपवाक्य बनाया गया है। ‘माँगी गई’ मूल के ask/demand अर्थ-क्षेत्र को खुला रखता है, जबकि प्रसंग इसकी बलपूर्वक प्रकृति स्पष्ट करता है।
- source_word: ταχέως προέβαλλεν
  choice: उसने तुरंत उसे बाहर निकाल दिया
  rationale: ταχέως शीघ्रता दर्शाता है और προβάλλω यहाँ जीभ को आगे या बाहर करने का संकेत देता है। यह हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: εὐθαρσῶς
  choice: साहस के साथ
  rationale: यह क्रियाविशेषण निर्भीकता और दृढ़ साहस व्यक्त करता है; चुना हुआ वाक्यांश आधुनिक, गरिमापूर्ण हिन्दी है।
- source_word: τὰς χεῖρας προέτεινεν
  choice: अपने हाथ आगे बढ़ा दिए
  rationale: शरीर के अंग के लिए हिन्दी में संबंधसूचक ‘अपने’ स्वाभाविक है; क्रिया हाथों को आगे फैलाने या प्रस्तुत करने की क्रिया बताती है।
