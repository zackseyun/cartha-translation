translation:
  language: hi
  text: परन्तु उसकी ओर देखकर उसने कहा, “तेरे पास मनुष्यों के बीच अधिकार है; नश्वर[a] होते हुए भी तू जो चाहता है वही करता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नश्वर” का अनुवाद “नाशवान” या “क्षयशील” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πρὸς αὐτὸν ἰδὼν εἶπεν
  choice: परन्तु उसने राजा की ओर देखकर कहा
  rationale: यूनानी कृदन्तीय रचना को स्वाभाविक हिन्दी में रखा गया है। αὐτόν का संदर्भ प्रसंग से राजा है; ‘की ओर देखकर’ आमने-सामने की चुनौती का भाव बनाए रखता है।
- source_word: Ἐξουσίαν
  choice: अधिकार
  rationale: यहाँ शब्द राजनीतिक अधिकार या सत्ता के वैध प्रयोग-क्षेत्र को सूचित करता है; ‘अधिकार’ सामान्य ‘शक्ति’ की अपेक्षा अधिक सटीक है।
- source_word: ἐν ἀνθρώποις
  choice: मनुष्यों के बीच
  rationale: ἐν के क्षेत्रसूचक अर्थ और ἀνθρώποις के सामान्य मानवीय संदर्भ—केवल पुरुषों का नहीं—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἔχων
  choice: रखते हुए भी
  rationale: प्रसंग में निहित विरोधात्मक/रियायती बल को ‘भी’ से स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि कृदन्तीय रूप भी बना रहता है।
- source_word: ὃ θέλεις ποιεῖς
  choice: जो चाहता है वही करता है
  rationale: यह यूनानी संबंधवाचक वाक्य का सीधा और आधुनिक हिन्दी रूप है तथा राजा की मनमानी का भाव व्यक्त करता है।
- source_word: φθαρτὸς ὤν
  choice: तू नश्वर है
  rationale: φθαρτός का मूल भाव क्षय और विनाश के अधीन होना है; इस मानवीय शासक को दी गई फटकार में ‘नश्वर’ उस अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पार्थिव शासक के विषय में φθαρτὸς ὤν का मानवशास्त्रीय भाव
  choice: तू नश्वर है
  alternative: तू नाशवान है / तू क्षयशील है
  rationale: वचन मानवीय राजनीतिक अधिकार को मनुष्य की मृत्यु और विनाश के अधीनता के साथ तनाव में रखता है। ‘नश्वर’ इस विरोध को स्पष्ट करता है, पर बाद की किसी विशिष्ट धर्मसैद्धान्तिक धारणा को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सीधी शैली अपनाई गई है। राजा को संबोधन में ‘तू’ मूल के एकवचन प्रत्यक्ष संबोधन और निर्भीक फटकार को व्यक्त करता है; इसे असम्मानजनक बोलचाल बनाने से बचाने के लिए शेष वाक्य औपचारिक रखा गया है।
