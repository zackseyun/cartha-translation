translation:
  language: hi
  text: और उसने वीरता से कहा, “ये मुझे स्वर्ग से मिले हैं, और उसके नियमों की खातिर मैं इन्हें तुच्छ समझता हूँ; और उसी से इन्हें फिर पाने की आशा रखता हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναίως
  choice: वीरता से
  rationale: यह क्रियाविशेषण साहसपूर्ण और महान धैर्य से बोलने का भाव देता है; ‘वीरता से’ प्रसंग की दृढ़ता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἐξ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यूनानी वाक्यांश का सीधा और स्वाभाविक अनुवाद; यहाँ स्वर्ग परमेश्वर के दाता होने की ओर संकेत करता है, पर अनुवाद में निहित कर्ता को स्पष्ट नहीं किया गया।
- source_word: κέκτημαι
  choice: मुझे ... मिले हैं
  rationale: पूर्णकालिक क्रिया वर्तमान अधिकार की परिणामी अवस्था व्यक्त करती है; हिन्दी में ‘मिले हैं’ इस भाव को सहज रूप से रखता है।
- source_word: ὑπερορῶ
  choice: परवाह नहीं करता
  rationale: शाब्दिक भाव ‘तुच्छ समझना/उपेक्षा करना’ है; अंगों के यातना में खोने की तत्परता के प्रसंग में ‘परवाह नहीं करता’ स्पष्ट और स्वाभाविक है।
- source_word: πάλιν ... κομίσεσθαι
  choice: फिर प्राप्त करूँगा
  rationale: यह खोई हुई वस्तुओं को पुनः पाने की आशा व्यक्त करता है; ‘फिर प्राप्त करूँगा’ पुनर्स्थापन का भाव सुरक्षित रखता है।
theological_decisions:
- issue: ‘स्वर्ग से’ में दाता की पहचान
  choice: मूल की तरह ‘स्वर्ग से’ रखा गया
  alternative: ‘परमेश्वर से’
  rationale: मूल पाठ परमेश्वर का नाम स्पष्ट रूप से नहीं कहता; संकेत को संकेत ही रहने देना वास्तविक अभिव्यक्ति और उसकी सूक्ष्मता को सुरक्षित रखता है।
- issue: अंगों को फिर पाने की आशा
  choice: ‘उसी से मैं इन्हें फिर प्राप्त करूँगा’
  alternative: ‘वह पुनरुत्थान में इन्हें मुझे लौटा देगा’
  rationale: पुनरुत्थान प्रसंग में निहित है, पर इस पद में उसका स्पष्ट उल्लेख नहीं; अनुवाद ने आशा को अधिक व्याख्यायित नहीं किया।
- issue: αὐτοῦ के पूर्वपद की अस्पष्टता
  choice: ‘उसके’ और ‘उसी से’
  alternative: हर स्थान पर ‘परमेश्वर’
  rationale: यूनानी सर्वनामों की संदर्भगत पहचान स्पष्ट है, फिर भी मूल की सर्वनामात्मक शैली और धार्मिक तनाव को बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष कथन में छोटे वाक्य रखे गए हैं ताकि वक्ता की निर्भीक दृढ़ता उभरे। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
