translation:
  language: hi
  text: और पुत्रों के बाद, अंत में माता की मृत्यु हो गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक संक्षेप में: “अंततः माता की मृत्यु हुई।” यूनानी पदबंध को पुत्रों के बाद माता की मृत्यु होने की क्रम-सूचना के रूप में समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχάτῃ
  choice: अन्त में
  rationale: यहाँ स्त्रीलिंग एकवचन दत्तिव रूप क्रम को सूचित करने वाले क्रियाविशेषण की तरह प्रयुक्त है। ‘अन्त में’ यूनानी की संक्षिप्त कथात्मक शैली को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν υἱῶν
  choice: पुत्रों के बाद
  rationale: υἱῶν का अर्थ विशेष रूप से ‘पुत्रों’ है। ἐσχάτῃ के साथ यह पूर्ववर्ती पुत्रों के पश्चात माता की मृत्यु का क्रम बताता है; हिन्दी में केवल ‘पुत्रों में अन्त में’ कहना भ्रामक होगा, मानो माता पुत्रों में से एक हो।
- source_word: ἡ μήτηρ
  choice: माता
  rationale: यूनानी में निश्चित उपपद सहित ‘माता’ है, पर कोई स्पष्ट स्वत्ववाचक सर्वनाम नहीं है। इसलिए ‘उनकी माता’ जोड़ने के बजाय स्रोत के निकट ‘माता’ रखा गया है।
- source_word: ἐτελεύτησεν
  choice: मृत्यु हो गई
  rationale: τελευτάω का यहाँ सीधा अर्थ ‘मरना’ है। ‘मृत्यु हो गई’ आधुनिक हिन्दी में स्वाभाविक, स्पष्ट और प्रसंग की गंभीर संक्षिप्तता के अनुरूप है।
