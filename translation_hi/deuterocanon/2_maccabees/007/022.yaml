base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/022.yaml
  text: I do not know how you appeared in my womb[a], nor was it I who granted you spirit and life, and it was not I who arranged the formation of each of you.
translation:
  language: hi
  text: मैं नहीं जानती कि तुम मेरे गर्भ में कैसे प्रकट हुए, न तो मैंने तुम्हें आत्मा[a] और जीवन प्रदान किया, और न ही मैंने तुममें से हर एक की देह-रचना को व्यवस्थित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मा’ के स्थान पर ‘प्राण’ भी सम्भव है। यूनानी शब्द का अर्थ ‘आत्मा,’ ‘श्वास’ या ‘वायु’ हो सकता है; यहाँ वह जीवन प्रदान करने वाले तत्त्व की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἶδʼ ὅπως
  choice: मैं नहीं जानती कि…कैसे
  rationale: यह यूनानी मुहावरा प्रक्रिया के विषय में माता की अनभिज्ञता व्यक्त करता है। स्त्री वक्ता के कारण हिन्दी में ‘जानती’ रखा गया है।
- source_word: εἰς τὴν ἐμὴν ἐφάνητε κοιλίαν
  choice: तुम मेरे गर्भ में कैसे प्रकट हुए
  rationale: ἐφάνητε का मूल भाव ‘प्रकट हुए’ है। इसे बनाए रखने से पुत्रों की उत्पत्ति के माता के लिए रहस्यमय होने का भाव सुरक्षित रहता है; εἰς का शाब्दिक ‘में/के भीतर’ हिन्दी में स्वाभाविक रूप से ‘गर्भ में’ व्यक्त होता है।
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν ὑμῖν ἐχαρισάμην
  choice: मैंने तुम्हें आत्मा और जीवन प्रदान किया
  rationale: πνεῦμα के व्यापक अर्थ को ‘आत्मा’ सुरक्षित रखता है, जबकि साथ आया ζωή ‘जीवन’ है। ἐχαρισάμην के अनुग्रहपूर्वक देने के भाव के लिए ‘प्रदान किया’ उपयुक्त है।
- source_word: τὴν ἑκάστου στοιχείωσιν
  choice: तुममें से हर एक की देह-रचना
  rationale: στοιχείωσις यहाँ प्रत्येक व्यक्ति के तत्त्वों की बनावट या शारीरिक गठन को सूचित करता है। केवल ‘रचना’ की अपेक्षा ‘देह-रचना’ प्रसंग को स्पष्ट करती है, पर गठन की प्रक्रिया को अनावश्यक रूप से वैज्ञानिक नहीं बनाती।
- source_word: οὐκ ἐγὼ διερρύθμισα
  choice: न मैंने…को व्यवस्थित किया
  rationale: διερρύθμισα में क्रमबद्ध ढंग से रचने या व्यवस्थित करने का भाव है। ‘व्यवस्थित किया’ जानबूझकर किए गए गठन का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: मानवीय उत्पत्ति के संदर्भ में πνεῦμα का अर्थ
  choice: आत्मा
  alternative: प्राण / श्वास
  rationale: πνεῦμα और ζωή अलग-अलग पद हैं; ‘आत्मा और जीवन’ इस भेद तथा यूनानी शब्द की धर्मवैचारिक व्यापकता को बनाए रखता है। फिर भी ‘प्राण’ संदर्भगत सम्भावना है, इसलिए पादटिप्पणी दी गई है।
- issue: माता द्वारा कारणता का निषेध
  choice: वह अपने पुत्रों की आत्मा, जीवन और देह-रचना की अंतिम कर्ता होने से इनकार करती है
  alternative: वह मातृत्व में अपनी किसी भी प्रकार की कारणात्मक भूमिका से इनकार करती है
  rationale: पाठ का बल ‘मैंने नहीं’ पर है, पर अनुवाद इसमें सामान्य मानवीय मातृत्व के निषेध को नहीं जोड़ता। इस प्रकार मूल का धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रकट हुए’ मूल की रहस्यमयता को और ‘देह-रचना को व्यवस्थित किया’ शारीरिक गठन के दोनों यूनानी पदों को यथासम्भव अलग-अलग सुरक्षित रखते हैं।
