base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/027.yaml
  text: 'But bending down to him[a], and mocking the cruel tyrant, she spoke in her native tongue as follows: “My son, have mercy on me, who carried you in the womb for nine months, nursed you for three years, raised you, brought you to this age[b], and cared for you.”'
translation:
  language: hi
  text: पर वह उसकी ओर झुकी और उस क्रूर अत्याचारी का उपहास करते हुए अपनी मातृभाषा[a] में इस प्रकार बोली, “बेटे, मुझ पर दया कर। मैंने तुझे नौ महीने अपनी कोख में रखा, तीन वर्ष तुझे अपना दूध पिलाया[b], तेरा पालन-पोषण किया, तुझे इस उम्र तक बड़ा किया और तेरी देखभाल की।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी पैतृक भाषा में” अथवा “अपने पुरखों की भाषा में।” यूनानी वाक्यांश परिवार या समुदाय से विरासत में मिली अपनी भाषा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “तीन वर्ष तुझे स्तनपान कराया।”
    reason: lexical_clarification
lexical_decisions:
- source_word: προσκύψασα
  choice: उसकी ओर झुकी
  rationale: यह शारीरिक रूप से पुत्र की ओर झुकने का स्वाभाविक और ठोस हिन्दी रूप है; इसमें उद्देश्य के बारे में अनावश्यक अनुमान नहीं जोड़ा गया।
- source_word: χλενάσασα
  choice: उपहास करते हुए
  rationale: यह क्रूर शासक के प्रति तिरस्कारपूर्ण हँसी या खिल्ली के भाव को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν ὠμὸν τύραννον
  choice: उस क्रूर अत्याचारी
  rationale: ὠμός की निर्दयता और τύραννος के दमनकारी शासक-संबंधी अर्थ को स्पष्ट, सहज हिन्दी में रखा गया है।
- source_word: τῇ πατρίᾳ φωνῇ
  choice: अपनी मातृभाषा
  rationale: यह पैतृक, जातीय या विरासत में मिली अपनी भाषा का स्वाभाविक आधुनिक हिन्दी रूप है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐλέησόν με
  choice: मुझ पर दया कर
  rationale: माँ की सीधी और भावपूर्ण विनती को बिना नरम किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν ἐν γαστρὶ περιενέγκασάν σε
  choice: मैंने तुझे नौ महीने अपनी कोख में रखा
  rationale: गर्भ में धारण करने के अर्थ को आत्मीय, स्पष्ट और गरिमापूर्ण हिन्दी में प्रस्तुत करता है।
- source_word: θηλάσασάν σε ἔτη τρία
  choice: तीन वर्ष तुझे अपना दूध पिलाया
  rationale: θηλάζω के विशिष्ट स्तनपान-संबंधी अर्थ को साधारण पाठक के लिए स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: ἐκθρέψασάν σε
  choice: तेरा पालन-पोषण किया
  rationale: पोषण देकर बच्चे को बड़ा करने के व्यापक मातृ-कर्म को ठीक से व्यक्त करता है।
- source_word: ἀγαγοῦσαν εἰς τὴν ἡλικίαν ταύτην
  choice: तुझे इस उम्र तक बड़ा किया
  rationale: वर्तमान आयु तक पहुँचाने के मूल अर्थ को हिन्दी की स्वाभाविक अभिव्यक्ति में रखता है।
- source_word: τροφοφορήσασαν
  choice: तेरी देखभाल की
  rationale: सतत पोषण, संभाल और सहारे के भाव को बिना किसी अनावश्यक भौतिक विशिष्टता के व्यक्त करता है।
theological_decisions:
- issue: माँ की विनती ἐλέησόν με का अनुवाद
  choice: मुझ पर दया कर
  alternative: मुझ पर तरस खा; मुझ पर करुणा कर
  rationale: यहाँ पदबंध कोई तकनीकी धार्मिक सूत्र नहीं, बल्कि माँ की अत्यंत भावपूर्ण विनती है। चुना हुआ रूप उसकी सीधाई और तीव्रता बनाए रखता है।
- issue: τῇ πατρίᾳ φωνῇ में भाषायी पहचान
  choice: अपनी मातृभाषा
  alternative: अपनी पैतृक भाषा; अपने पुरखों की भाषा
  rationale: मूल वाक्यांश परिवार या जातीय समुदाय से विरासत में मिली भाषा की ओर संकेत करता है। मुख्य पाठ में सहज आधुनिक रूप रखा गया है और पैतृक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में माँ-पुत्र की आत्मीयता के अनुरूप एकवचन ‘तू/तुझे’ रूप, किंतु समग्र शैली गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है।
