base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/017.yaml
  text: But do not think that our nation has been abandoned by God. But as for you[a], endure and see his great power, how it will torture you and your offspring.
translation:
  language: hi
  text: पर यह मत समझ कि परमेश्वर ने हमारे लोगों को छोड़ दिया है। पर तू डटा रह और उसकी महान सामर्थ्य को देख कि वह[a] तुझे और तेरी संतान को कैसी यातना देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देख कि वह तुझे और तेरी संतान को कैसी यातना देगा,” जहाँ क्रिया का निहित कर्ता ‘उसकी महान सामर्थ्य’ के बजाय परमेश्वर है।
    reason: यूनानी में भविष्यकालीन क्रिया का कर्ता निकटवर्ती ‘उसकी महान सामर्थ्य’ भी हो सकता है और निहित रूप से परमेश्वर भी।
lexical_decisions:
- source_word: μὴ δόκει
  choice: यह मत समझ
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। ‘यह मत समझ’ आधुनिक हिन्दी में सीधा और स्वाभाविक निषेध है।
- source_word: τὸ γένος ἡμῶν
  choice: हमारे लोगों
  rationale: γένος यहाँ केवल परिवार नहीं, सामूहिक रूप से यहूदी लोगों को सूचित करता है। ‘हमारे लोगों’ से यह सामुदायिक अर्थ सहज हिन्दी में आता है।
- source_word: ὑπὸ τοῦ θεοῦ καταλελεῖφθαι
  choice: परमेश्वर ने ... छोड़ दिया है
  rationale: καταλείπω का पूर्णकालिक रूप छोड़े जाने से बनी वर्तमान दशा व्यक्त करता है। हिन्दी की कर्तृवाच्य रचना स्वाभाविक रहते हुए परमेश्वर को कर्ता बनाए रखती है।
- source_word: σὺ δὲ καρτέρει
  choice: पर जहाँ तक तेरा सवाल है, तू डटा रह
  rationale: σὺ पर बल और δέ का विरोध ‘जहाँ तक तेरा सवाल है’ से व्यक्त होता है। καρτέρει में टिके रहने या सहने का भाव है; ‘डटा रह’ उसे संक्षेप और चुनौतीपूर्ण ढंग से रखता है।
- source_word: θεώρει
  choice: देख
  rationale: θεωρέω का अर्थ ध्यान से देखना या निहारना है। आज्ञार्थक ‘देख’ यहाँ सीधा और स्वाभाविक है।
- source_word: τὸ μεγαλεῖον αὐτοῦ κράτος
  choice: उसकी महान सामर्थ्य
  rationale: κράτος शक्ति या सामर्थ्य है और μεγαλεῖον उसकी महानता को तीव्र करता है। ‘महान सामर्थ्य’ दोनों तत्वों को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὡς σὲ καὶ τὸ σπέρμα σου βασανιεῖ
  choice: वह तुझे और तेरी संतान को कैसी यातना देगी
  rationale: ὡς यहाँ परिणाम को विस्मयकारी ढंग से ‘कैसी’ के रूप में प्रस्तुत करता है। βασανίζω के लिए ‘यातना देना’ न्यायिक-दंडात्मक प्रसंग के अनुकूल है; σπέρμα के लिए सामूहिक ‘संतान’ स्वाभाविक है। स्त्रीलिंग ‘वह ... देगी’ निकटवर्ती ‘सामर्थ्य’ को कर्ता मानता है।
theological_decisions:
- issue: भविष्यकालीन क्रिया βασανιεῖ का कर्ता
  choice: निकटवर्ती ‘उसकी महान सामर्थ्य’ को कर्ता मानकर ‘वह ... देगी’
  alternative: परमेश्वर को निहित कर्ता मानकर ‘वह ... देगा’
  rationale: यूनानी में निकटवर्ती नपुंसकलिंग एकवचन पदबंध τὸ μεγαλεῖον αὐτοῦ κράτος भविष्यकालीन एकवचन क्रिया का कर्ता हो सकता है। मुख्य पाठ इस सतही वाक्य-संबंध को रखता है, जबकि पादटिप्पणी परमेश्वर को निहित कर्ता मानने की वास्तविक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। अत्याचारी को संबोधित एकवचन σὺ के लिए चुनौतीपूर्ण ‘तू’ प्रयुक्त है। वाक्य की विरोधात्मक पुनरावृत्ति को दोनों खंडों में ‘पर’ से बनाए रखा गया है।
