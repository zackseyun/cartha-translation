  text: But you[a], having become the inventor of every evil against the Hebrews, will certainly not escape the hands of God.
translation:
  language: hi
  text: परन्तु तू, इब्रानियों के विरुद्ध हर प्रकार की बुराई का रचयिता[a] बनकर, परमेश्वर के हाथों से कदापि नहीं बच पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई की योजनाएँ गढ़ने वाला” अथवा “जनक”।
    reason: εὑρετής के अर्थ-क्षेत्र में खोजने वाला, गढ़ने वाला और आरम्भकर्ता सम्मिलित हैं; प्रसंग में बुराई की सक्रिय योजना और उत्पत्ति का आरोप है।
lexical_decisions:
- source_word: σὺ δὲ
  choice: परन्तु तू
  rationale: δέ पिछले कथन के साथ विरोध दिखाता है और σὺ सीधे, टकरावपूर्ण एकवचन सम्बोधन पर बल देता है।
- source_word: πάσης κακίας
  choice: हर प्रकार की बुराई का
  rationale: κακία का व्यापक नैतिक अर्थ बुराई या दुष्टता है; यह अभिव्यक्ति आरोप की व्यापकता बनाए रखती है और उसे केवल अपराधों तक सीमित नहीं करती।
- source_word: εὑρετὴς γενόμενος
  choice: रचयिता बनकर
  rationale: εὑρετής यहाँ बुरी योजनाएँ गढ़ने या आरम्भ करने वाले को दर्शाता है। 'रचयिता' सक्रिय उत्पत्ति का भाव देता है, जबकि 'बनकर' γενόμενος को व्यक्त करता है।
- source_word: εἰς τοὺς Ἑβραίους
  choice: इब्रानियों के विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में εἰς का स्वाभाविक अर्थ 'के विरुद्ध' है; 'इब्रानियों' से विशिष्ट जातीय पद Ἑβραίους सुरक्षित रहता है।
- source_word: οὐ μὴ διαφύγῃς
  choice: कदापि नहीं बच पाएगा
  rationale: οὐ μή और एओरिस्ट सब्जंक्टिव का संयोजन प्रबल निषेध व्यक्त करता है; 'कदापि नहीं' उसकी निश्चितता और तीव्रता बनाए रखता है।
- source_word: τὰς χεῖρας τοῦ θεοῦ
  choice: परमेश्वर के हाथों से
  rationale: मूल का मूर्त बहुवचन रूप सुरक्षित है और हिन्दी में न्याय अथवा दण्ड से न बच पाने की स्वाभाविक बाइबलीय छवि देता है।
theological_decisions:
- issue: ईश्वरीय न्याय के लिए मानवरूपी अभिव्यक्ति
  choice: परमेश्वर के हाथों से
  alternative: परमेश्वर की शक्ति से / परमेश्वर के न्याय से
  rationale: यूनानी पाठ की ठोस 'हाथों' वाली छवि को अमूर्त अर्थ में बदलने के बजाय सुरक्षित रखा गया है।
- issue: जातीय पद Ἑβραίους
  choice: इब्रानियों
  alternative: यहूदियों
  rationale: मूल में विशेष रूप से 'इब्रानी' पद है; अधिक परिचित किन्तु भिन्न पद 'यहूदी' से उसका प्रतिस्थापन नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधे आरोप वाला हिन्दी रूप। एकवचन 'तू' मूल के तीखे, आमने-सामने सम्बोधन को बनाए रखता है। 'परन्तु' औपचारिक बाइबलीय लय देता है, जबकि शेष वाक्य सामान्य पाठकों के लिए सहज रखा गया है।
