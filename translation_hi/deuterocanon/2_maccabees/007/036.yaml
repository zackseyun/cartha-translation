base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/036.yaml
  text: For our brothers[a], having now endured a brief pain, have fallen under God's covenant into everlasting life; but you, by the judgment of God, will justly bear the penalties of your arrogance.
translation:
  language: hi
  text: क्योंकि हमारे भाई अब थोड़ी पीड़ा सहकर परमेश्वर की वाचा के अधीन, अनन्त जीवन में प्रवेश कर चुके हैं[a]; पर तू परमेश्वर के न्याय से अपने घमंड के उचित दंड भोगेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य-विन्यास संक्षिप्त है। शाब्दिक रूप से, ‘गिर पड़े हैं’; यहाँ यह मृत्यु का संकेत देता है। इसका अनुवाद यह भी हो सकता है: ‘परमेश्वर की अनन्त जीवन की वाचा के अधीन मर गए हैं।’'
    reason: alternative_reading
lexical_decisions:
- source_word: βραχὺν ἐπενέγκαντες πόνον
  choice: थोड़े समय की पीड़ा सहकर
  rationale: यह कृदन्तीय पद पीड़ा को सहने या उठाने का भाव देता है। ‘थोड़े समय की’ आगामी ‘अनन्त जीवन’ के साथ अवधि का विरोध स्पष्ट रखता है।
- source_word: ἀενάου ζωῆς
  choice: अनन्त जीवन
  rationale: ἀέναος का अर्थ निरंतर, चिरस्थायी या कभी न समाप्त होने वाला है; ‘अनन्त जीवन’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः पर्याप्त है।
- source_word: ὑπὸ διαθήκην θεοῦ
  choice: परमेश्वर की वाचा के अधीन
  rationale: यह अनोखी यूनानी रचना ὑπό का अधीनता या परिधि-संबंधी भाव तथा διαθήκη की वाचागत भाषा दोनों बनाए रखती है।
- source_word: πεπτώκασιν
  choice: गिर पड़े हैं
  rationale: πίπτω का शाब्दिक बिंब ‘गिरना’ है और यहाँ शहीद होकर मरने की ओर संकेत करता है। शाब्दिक बिंब रखने से संक्षिप्त यूनानी रचना की वास्तविक अस्पष्टता बनी रहती है।
- source_word: τῇ τοῦ θεοῦ κρίσει
  choice: परमेश्वर के न्याय से
  rationale: 'दत्तिव पद को साधन या कारण के भाव में लिया गया है: दंड परमेश्वर के न्याय द्वारा आएगा।'
- source_word: δίκαια τὰ πρόστιμα
  choice: उचित दंड
  rationale: πρόστιμα आरोपित दंडों को सूचित करता है; ‘उचित’ δίκαια के न्यायसंगत होने का भाव देता है, जबकि हिन्दी में सामूहिक ‘दंड’ स्वाभाविक है।
- source_word: ὑπερηφανίας
  choice: घमंड
  rationale: यह राजा के उद्धत अभिमान को व्यक्त करता है; ‘घमंड’ सहज, वर्तमान और नैतिक रूप से स्पष्ट हिन्दी है।
theological_decisions:
- issue: शहादत, परमेश्वर की वाचा और अनन्त जीवन के बीच संबंध को कैसे व्यक्त किया जाए
  choice: ‘अनन्त जीवन के लिए परमेश्वर की वाचा के अधीन गिर पड़े हैं’ कहकर तीनों तत्व स्पष्ट रखे गए हैं और ‘गिर पड़े’ का मूल बिंब बचाया गया है।
  alternative: ‘परमेश्वर की अनन्त जीवन की वाचा के अधीन मर गए हैं’ या ‘परमेश्वर की वाचा के अधीन मरकर अनन्त जीवन में प्रवेश कर गए हैं।’
  rationale: यूनानी वाक्य-विन्यास अत्यंत संक्षिप्त है; ἀενάου ζωῆς को वाचा से, परिणाम से, अथवा लक्ष्य से जोड़कर समझा जा सकता है। मुख्य पाठ संबंध को पूरी तरह सिद्धान्तगत रूप से नहीं सुलझाता, और पादटिप्पणी प्रमुख वैकल्पिक समझ बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। राजा को सीधे संबोधन में एकवचन ‘तू’ रखा गया है, जो मूल पाठ की तीखी प्रत्यक्षता को बनाए रखता है। वाचा, न्याय और अनन्त जीवन की धार्मिक शब्दावली को बिना अतिरिक्त सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
