lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: उत्तर दिया
  rationale: ἀποκρίνομαι का यह कृदन्त रूप यहाँ सामान्यतः उत्तर देने के अर्थ में प्रयुक्त है; ‘उत्तर दिया’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: τῇ πατρίῳ φωνῇ
  choice: अपने पुरखों की भाषा में
  rationale: πατρίος में पैतृक या पूर्वजों से प्राप्त होने का भाव है और φωνή यहाँ बोली या भाषा को सूचित करता है। यह अनुवाद जातीय-पारिवारिक संबंध बनाए रखता है, पर किसी विशेष भाषा का अनुमान नहीं लगाता।
- source_word: προσεῖπεν
  choice: दिया
  rationale: प्रत्यक्ष उत्तर के परिचय में ἀποκριθεὶς और προσεῖπεν की संयुक्त क्रिया को हिन्दी में स्वाभाविक रूप से ‘उत्तर दिया’ कहा गया है; अलग से ‘कहा’ जोड़ना अनावश्यक पुनरुक्ति होता।
- source_word: Οὐχί
  choice: नहीं
  rationale: यह दृढ़ निषेधात्मक उत्तर है; प्रसंग में ‘नहीं’ उसका बल बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: διόπερ
  choice: इसलिए
  rationale: यह उसके इनकार के परिणाम को सूचित करता है; ‘इसलिए’ आधुनिक हिन्दी में स्पष्ट कारण-परिणाम संबंध रखता है।
- source_word: οὗτος
  choice: उसे भी
  rationale: यूनानी संकेतवाचक सर्वनाम उस दूसरे भाई की ओर संकेत करता है। हिन्दी में ‘उसे भी’ संदर्भ और तुलनात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν ἑξῆς βάσανον
  choice: अगली यातना दी गई
  rationale: ἑξῆς क्रम में अगली वस्तु को और βάσανος यहाँ शारीरिक यातना को दर्शाता है। यूनानी ‘प्राप्त की’ का शाब्दिक रूप हिन्दी में अस्वाभाविक होता, इसलिए भाव को कर्मवाच्य में व्यक्त किया गया है।
- source_word: ὡς ὁ πρῶτος
  choice: पहले भाई की तरह
  rationale: मूल में केवल ‘पहले’ है, पर संदर्भ में पहला भाई अभिप्रेत है। ‘भाई’ स्पष्टता के लिए संदर्भ-सम्मत पूर्ति है और तुलना को सहज बनाता है।
theological_decisions:
- issue: τῇ πατρίῳ φωνῇ में पैतृक, पूर्वज-संबंधी और मातृभाषा के भाव
  choice: अपने पुरखों की भाषा में
  alternative: अपनी पैतृक भाषा में; अपनी मातृभाषा में
  rationale: चुना हुआ रूप पूर्वजों और सामुदायिक पहचान का भाव सुरक्षित रखता है तथा यह तय नहीं करता कि अभिप्रेत भाषा कौन-सी थी। ‘मातृभाषा’ अधिक सहज है, पर यूनानी के पैतृक/पूर्वज-संबंधी पहलू को कम कर देती है।
