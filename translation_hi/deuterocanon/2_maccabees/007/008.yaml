  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पुरखों’ से पूर्वज-संबंधी भाव साधारण पाठक के लिए सहज रहता है। यातना के वर्णन को न तो नरम किया गया है, न अनावश्यक रूप से विस्तार दिया गया है।
