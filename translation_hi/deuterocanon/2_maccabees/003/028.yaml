  yaml_path: translation/deuterocanon/2_maccabees/003/028.yaml
  text: The man who had just entered the treasury with much rushing about and all his guard[a], they carried out helpless, being completely incapacitated[c][b], having plainly recognized the sovereign power.
translation:
  language: hi
  text: जो व्यक्ति अभी-अभी बड़ी भाग-दौड़[a] और अपने पूरे अंगरक्षक दल के साथ पहले बताए गए कोषागार[b] में प्रवेश किया था, उसे वे असहाय अवस्था में उठाकर ले जा रहे थे। वह पूरी तरह अशक्त हो चुका था[c] और उस प्रभुत्वशाली शक्ति को स्पष्ट रूप से पहचान चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बड़ी धूमधाम के साथ’; यूनानी पद दौड़-धूप के साथ होने वाली दिखावटी हलचल का संकेत भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘पहले बताया गया कोषागार।’'
    reason: lexical_alternative
  - marker: c
    text: यहाँ का यूनानी पद मुहावरेदार और कठिन है; इसका भाव है कि वह हर प्रकार से पूरी तरह अक्षम हो गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτι ... εἰσελθόντα
  choice: जो व्यक्ति अभी-अभी ... घुसा था
  rationale: लेखयुक्त कृदंत व्यक्ति को संज्ञा की तरह प्रस्तुत करता है; ἄρτι का स्वाभाविक हिन्दी रूप ‘अभी-अभी’ है। εἰσελθόντα के लिए ‘घुसा’ प्रसंग में उस बलपूर्वक प्रवेश की छाया रखता है।
- source_word: μετὰ πολλῆς παραδρομῆς
  choice: बहुत भाग-दौड़
  rationale: παραδρομή में दौड़-धूप, व्यस्त हलचल और दिखावटी चहल-पहल की अर्थ-छाया है। ‘भाग-दौड़’ इसके गतिशील पक्ष को बचाती है; अधिक व्याख्यात्मक ‘धूमधाम’ को पादटिप्पणी में रखा गया है।
- source_word: πάσης δορυφορίας
  choice: अपने पूरे अंगरक्षक दल के साथ
  rationale: δορυφορία सशस्त्र अंगरक्षक दल या अनुरक्षक दल को दर्शाता है। ‘अपने’ प्रसंग से स्पष्ट संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ προειρημένον ... γαζοφυλάκιον
  choice: पहले बताए गए कोषागार
  rationale: προειρημένον को ‘पहले बताए गए’ और γαζοφυλάκιον को ‘कोषागार’ से स्पष्ट रूप से रखा गया है।
- source_word: ἔφερον
  choice: उठाकर ले जा रहे थे
  rationale: अपूर्ण भूतकाल चल रही क्रिया को सूचित करता है। प्रसंग में उसे अक्षम अवस्था में वहाँ से ले जाया जा रहा है; हिन्दी में ‘उठाकर ले जा रहे थे’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀβοήθητον
  choice: असहाय अवस्था में
  rationale: शब्द का मूल भाव सहायता से रहित या असहाय होना है। यह उसके पहले के सशस्त्र वैभव के विपरीत उसकी दशा दिखाता है।
- source_word: τοῖς ὅλοις καθεστῶτα
  choice: पूरी तरह अशक्त हो चुका था
  rationale: यह कठिन मुहावरेदार पद उसकी संपूर्ण रूप से दयनीय और निष्क्रिय कर दी गई दशा बताता है। ‘अशक्त’ शारीरिक असमर्थता को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी कठिनाई दर्ज करती है।
- source_word: φανερῶς
  choice: स्पष्ट रूप से
  rationale: क्रिया-विशेषण पहचान की स्पष्टता या प्रत्यक्षता बताता है।
- source_word: τὴν δυναστείαν
  choice: उस प्रभुत्वशाली शक्ति
  rationale: δυναστεία में शक्ति के साथ प्रभुत्व या शासन-सत्ता की छाया है। यह रूप केवल ‘शक्ति’ से अधिक अर्थ बचाता है, किंतु पद में सीधे ‘परमेश्वर’ जोड़कर निहित कर्ता को अति-निर्धारित नहीं करता।
- source_word: ἐπεγνωκότα
  choice: पहचान चुका था
  rationale: ἐπιγινώσκω का परिपूर्ण पहचान या अनुभव से समझ लेने का भाव और कृदंत की परिणामी अवस्था ‘पहचान चुका था’ में आती है।
theological_decisions:
- issue: ‘प्रभुत्वशाली शक्ति’ का संदर्भ
  choice: पद के अमूर्त कथन को बनाए रखते हुए ‘उस प्रभुत्वशाली शक्ति’
  alternative: ‘परमेश्वर की शक्ति’ या ‘मंदिर के प्रभु की शक्ति’
  rationale: निकटवर्ती प्रसंग शक्ति को दिव्य बताता है, पर इस पद में δυναστεία अमूर्त संज्ञा के रूप में है और परमेश्वर का नाम सीधे नहीं लिया गया। इसलिए अनुवाद प्रसंग को अर्थ पहचानने देता है, पर पद से अधिक स्पष्टता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ऐतिहासिक-धार्मिक आख्यान के अनुरूप गरिमापूर्ण रखी गई है। लंबे यूनानी वाक्य को हिन्दी में दो वाक्यों में बाँटा गया है ताकि कर्ता और परिणामी दशा स्पष्ट रहें। ‘प्रभुत्वशाली शक्ति’ जानबूझकर कुछ औपचारिक है, क्योंकि मूल में शक्ति और प्रभुत्व दोनों की अर्थ-छाया उपस्थित है।
