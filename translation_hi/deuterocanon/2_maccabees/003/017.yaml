lexical_decisions:
- source_word: περικεχύτο
  choice: छा गई थी
  rationale: परिपूर्ण काल के इस रूप में किसी भावना के मनुष्य को घेर लेने का भाव है। ‘छा गई थी’ स्वाभाविक हिन्दी में उसी प्रभाव को व्यक्त करता है।
- source_word: δέος τι
  choice: एक प्रकार का भय
  rationale: δέος गहरे भय या आशंका को व्यक्त करता है, जबकि τι उसे कुछ अनिश्चित बनाता है; ‘एक प्रकार का भय’ दोनों भावों को बनाए रखता है।
- source_word: φρικασμὸς σώματος
  choice: शरीर में कंपकंपी
  rationale: यह पद शरीर के काँपने या सिहरने को दर्शाता है। ‘शरीर में कंपकंपी’ उसका स्पष्ट और सहज हिन्दी रूप है।
- source_word: διʼ ὧν
  choice: इनके द्वारा
  rationale: यह भय और शारीरिक कंपकंपी, दोनों की ओर संकेत करता है और बताता है कि उन्हीं से भीतरी पीड़ा प्रकट हो रही थी।
- source_word: πρόδηλον ἐγίνετο
  choice: स्पष्ट होती जा रही थी
  rationale: अपूर्णकालिक क्रिया चलती हुई अभिव्यक्ति का संकेत देती है; यह अनुवाद उस क्रमिक रूप से प्रत्यक्ष होने के भाव को बनाए रखता है।
- source_word: τοῖς θεωροῦσιν
  choice: देखनेवालों पर
  rationale: यह उपस्थित पर्यवेक्षकों को सूचित करता है। ‘देखनेवालों पर स्पष्ट’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος
  choice: उसके हृदय में विद्यमान पीड़ा
  rationale: κατὰ καρδίαν भीतर या हृदय में होने का भाव देता है, ἐνεστὸς वर्तमान/विद्यमान दशा को, और ἄλγος पीड़ा अथवा व्यथा को; यह रूप मूल की व्यापकता बनाए रखता है।
