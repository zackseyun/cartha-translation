  text: So then they were calling on the all-powerful Lord to keep what had been entrusted to those who had made the deposit safe with all security[a].
translation:
  language: hi
  text: इसलिए वे सर्वशक्तिमान प्रभु को पुकार रहे थे कि जो कुछ अमानत के रूप में सौंपा गया था, उसे जिन लोगों ने उसे सौंपा था, उनके लिए वह पूरी सुरक्षा के साथ सकुशल रखे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जमा करानेवालों के लिए।” यूनानी में उन लोगों का संकेत है जिन्होंने अपनी संपत्ति सुरक्षित रखने के लिए अमानत के रूप में सौंपी थी।
    reason: τοῖς πεπιστευκόσιν के पूर्ण सक्रिय कृदंत और दत्तिव संबंध का संक्षिप्त वैकल्पिक अनुवाद देना।
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: पुकार रहे थे
  rationale: अपूर्ण काल प्रार्थना में जारी पुकार या विनती को व्यक्त करता है; यह हिंदी में स्वाभाविक है और धार्मिक आशय बनाए रखता है।
- source_word: παγκρατῆ
  choice: सर्वशक्तिमान
  rationale: यह विशेषण उस प्रभु को दर्शाता है जिसका सामर्थ्य सब पर है; ‘सर्वशक्तिमान’ आधुनिक हिंदी में स्पष्ट और प्रतिष्ठित धार्मिक पद है।
- source_word: κύριον
  choice: प्रभु
  rationale: यहाँ परमेश्वर के लिए आदरपूर्ण उपाधि है; ‘प्रभु’ κύριος का स्वाभाविक मानक हिंदी रूप है।
- source_word: τὰ πεπιστευμένα
  choice: जो कुछ अमानत के रूप में सौंपा गया था
  rationale: संज्ञा की तरह प्रयुक्त पूर्ण निष्क्रिय कृदंत सुरक्षित रखने के लिए सौंपी गई संपत्ति को दर्शाता है; इस रूप में निष्क्रिय अर्थ और प्रसंग दोनों स्पष्ट रहते हैं।
- source_word: τοῖς πεπιστευκόσιν
  choice: जमा करानेवालों के लिए
  rationale: पूर्ण सक्रिय कृदंत उन लोगों को दर्शाता है जिन्होंने अपनी वस्तुएँ सुरक्षित रखने के लिए सौंपी थीं; दत्तिव का हितार्थ भाव ‘के लिए’ से व्यक्त किया गया है।
- source_word: σῶα
  choice: सकुशल
  rationale: यह विधेय विशेषण सौंपी गई वस्तुओं को अक्षत और सुरक्षित दशा में बनाए रखने का अर्थ देता है।
- source_word: διαφυλάσσειν
  choice: रखे
  rationale: क्रिया ध्यानपूर्वक रक्षा करने और सुरक्षित बनाए रखने का भाव देती है; ‘पूरी सुरक्षा के साथ सकुशल रखे’ में उसका पूरा बल प्रकट होता है।
- source_word: μετὰ πάσης ἀσφαλείας
  choice: पूरी सुरक्षा के साथ
  rationale: यह पद संरक्षण के ढंग पर जोर देता है और यूनानी की तीव्रता को सहज हिंदी में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए κύριον का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रसंग में यह परमेश्वर की आदरपूर्ण उपाधि है। ‘प्रभु’ धार्मिक हिंदी में मानक और स्वाभाविक है, जबकि ‘स्वामी’ यहाँ अनावश्यक रूप से सामान्य मानवीय स्वामित्व का संकेत दे सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘अमानत’, ‘जमा करानेवालों’ और ‘पूरी सुरक्षा के साथ सकुशल’ से मंदिर में सुरक्षित रखी संपत्ति का प्रसंग तथा यूनानी के दोहरे सुरक्षा-बल को बनाए रखा गया है। आरंभ का खंडित ‘κίαν.’ पाठ-सत्यापन में पिछले पद का अवशेष प्रतीत होता है, इसलिए इसे इस पद में अनूदित नहीं किया गया।
