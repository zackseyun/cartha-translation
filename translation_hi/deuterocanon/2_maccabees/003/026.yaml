  yaml_path: translation/deuterocanon/2_maccabees/003/026.yaml
  text: But two other young men appeared to him[a], outstanding in strength, most handsome in appearance, and splendid in clothing; and standing on either side of him, they kept scourging him without stopping, landing many blows on him.
translation:
  language: hi
  text: किन्तु उसे दो और युवक दिखाई दिए। वे बल में असाधारण, दिखने में अत्यन्त सुन्दर[a] और वस्त्रों में भव्य थे। वे उसके दोनों ओर खड़े होकर उसे लगातार कोड़े मारते रहे और उस पर बहुत-से प्रहार बरसाते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रूप-वैभव में अत्यन्त सुन्दर।” यूनानी पद सौन्दर्य को दिखाई देनेवाले रूप, तेज या वैभव से जोड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι δὲ δύο
  choice: परन्तु दो और
  rationale: ἕτεροι δύο पहले वर्णित सवार से भिन्न दो अतिरिक्त व्यक्तियों को दर्शाता है; δέ कथा में हल्का मोड़ लाता है, जिसे ‘परन्तु’ से व्यक्त किया गया है।
- source_word: ἐφάνησαν αὐτῷ
  choice: उसके सामने प्रकट हुए
  rationale: ἐφάνησαν का स्वाभाविक अर्थ ‘प्रकट हुए’ है। αὐτῷ को हिन्दी में प्रसंगानुकूल ‘उसके सामने’ कहा गया है।
- source_word: νεανίαι
  choice: युवक
  rationale: शब्द युवा पुरुषों को सूचित करता है; इसमें स्वभावतः सैनिक या स्वर्गदूत होने का अर्थ नहीं जोड़ा गया है।
- source_word: τῇ ῥώμῃ μὲν ἐκπρεπεῖς
  choice: बल में असाधारण
  rationale: ῥώμη शारीरिक बल या सामर्थ्य और ἐκπρεπής विशिष्ट अथवा असाधारण होने को व्यक्त करता है।
- source_word: κάλλιστοι δὲ τὴν δόξαν
  choice: रूप-वैभव में अत्यन्त सुन्दर
  rationale: κάλλιστοι उत्कृष्ट सौन्दर्य बताता है, जबकि δόξα यहाँ दृश्य रूप, तेज या वैभव का संकेत दे सकता है। संयुक्त पद ‘रूप-वैभव’ मूल की अर्थ-विस्तारिता बनाए रखता है।
- source_word: διαπρεπεῖς δὲ τὴν περιβολήν
  choice: वस्त्रों में भव्य
  rationale: περιβολή वस्त्र या पहनावे को और διαπρεπής उसकी विशिष्ट भव्यता को सूचित करता है।
- source_word: οἵ καὶ παραστάντες ἐξ ἑκατέρου μέρους
  choice: वे उसके दोनों ओर खड़े होकर
  rationale: परिस्थितिजन्य कृदन्त को हिन्दी में ‘खड़े होकर’ और ἐξ ἑκατέρου μέρους को स्वाभाविक रूप से ‘उसके दोनों ओर’ व्यक्त किया गया है।
- source_word: ἐμαστίγουν αὐτὸν ἀδιαλείπτως
  choice: उसे लगातार कोड़े मारते रहे
  rationale: अपूर्णकालिक क्रिया जारी क्रिया को दिखाती है; μαστιγόω को विशिष्ट रूप से ‘कोड़े मारना’ और ἀδιαλείπτως को ‘लगातार’ कहा गया है।
- source_word: πολλὰς ἐπιρριπτοῦντες αὐτῷ πληγάς
  choice: उस पर बहुत-से प्रहार किए
  rationale: यह पद कोड़े मारने की तीव्रता स्पष्ट करता है; πληγάς का व्यापक अर्थ ‘प्रहार’ है और ἐπιρριπτοῦντες उस पर प्रहार किए जाने को दर्शाता है।
theological_decisions:
- issue: प्रकट हुए युवकों की पहचान
  choice: ‘दो और युवक’
  alternative: ‘दो स्वर्गदूत’ या ‘दो स्वर्गीय प्राणी’
  rationale: यूनानी पाठ उन्हें νεανίαι अर्थात युवक कहता है और उनकी शक्ति, सुन्दरता तथा वस्त्रों का वर्णन करता है, पर इस पद में उन्हें स्पष्टतः स्वर्गदूत नहीं कहता। इसलिए अनुवाद वर्णन को सुरक्षित रखता है और उनकी पहचान को अधिक विशिष्ट नहीं बनाता।
- issue: δόξα का वर्णनात्मक अर्थ
  choice: ‘रूप-वैभव’
  alternative: ‘रूप’, ‘तेज’ या ‘प्रताप’
  rationale: इस प्रसंग में δόξα दृश्य रूप, शोभा, तेज या प्रभावशाली व्यक्तित्व की ओर संकेत कर सकता है। ‘रूप-वैभव’ इस अर्थगत तनाव को बिना संकुचित किए व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘कोड़े मारते रहे’ अपूर्णकालिक निरन्तर क्रिया को स्वाभाविक रूप से व्यक्त करता है। पद में जिन व्यक्तियों को केवल युवक कहा गया है, उन्हें अनुवाद में स्वर्गदूत नहीं कहा गया।
