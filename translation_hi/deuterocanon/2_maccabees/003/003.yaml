base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/003.yaml
  text: so that even Seleucus[a], the king of Asia[b], used to provide from his own revenues all the expenses that fell due for the services of the sacrifices.
translation:
  language: hi
  text: फलस्वरूप, एशिया[b] के राजा सेल्यूकुस[a] भी बलिदानों से संबंधित सेवाओं के लिए देय सारा खर्च अपने राजस्व से दिया करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सेल्यूकुस से आशय सेल्यूकुस चतुर्थ फिलोपातोर से है।
    reason: historical_note
  - marker: b
    text: ‘एशिया’ यहाँ हेलेनिस्ती काल के प्रयोग में सेल्यूकुस के एशियाई राज्य-क्षेत्र को दर्शाता है, आधुनिक अर्थ में पूरे एशिया महाद्वीप को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ὥστε καὶ
  choice: इस कारण ... तक
  rationale: यह पिछले प्रसंग के परिणाम को व्यक्त करता है और καί के बल को ‘तक’ द्वारा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Σέλευκον
  choice: सेल्यूकुस
  rationale: यूनानी नाम का प्रचलित और स्रोत-समीप देवनागरी लिप्यंतरण।
- source_word: τὸν τῆς Ἀσίας βασιλέα
  choice: एशिया के राजा
  rationale: ऐतिहासिक उपाधि को सीधे रूप में रखा गया है; उस समय ‘एशिया’ के सीमित राजनीतिक अर्थ को पादटिप्पणी स्पष्ट करती है।
- source_word: χορηγεῖν
  choice: दिया करते थे
  rationale: अपने व्यय पर नियमित रूप से उपलब्ध कराने का भाव तथा प्रसंग का पृष्ठभूमिगत/अभ्यस्त पक्ष सहज हिन्दी में व्यक्त होता है।
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: अपने राजस्व से
  rationale: πρόσοδοι के आय अथवा राजकीय आमदनी के वित्तीय अर्थ को ‘राजस्व’ ठीक रूप से व्यक्त करता है।
- source_word: λειτουργίας τῶν θυσιῶν
  choice: बलिदानों की सेवाओं
  rationale: मन्दिर में बलिदान से जुड़ी धार्मिक सेवाओं का अर्थ रखा गया है, पर बाद की कलीसियाई पारिभाषिकता नहीं जोड़ी गई।
- source_word: πάντα τὰ ... ἐπιβάλλοντα δαπανήματα
  choice: आवश्यक सारा खर्च
  rationale: ἐπιβάλλοντα में निहित देय अथवा अनिवार्य खर्च का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में है।
theological_decisions:
- issue: द्वितीयकानूनी ऐतिहासिक आख्यान में मन्दिर-सेवा की शब्दावली
  choice: बलिदानों की सेवाओं
  alternative: बलिदानों की धर्मसेवाओं / बलिदान-अनुष्ठानों
  rationale: यह पद राजकीय धन से मन्दिर के बलिदान-संबंधी कार्यों के खर्च का ऐतिहासिक विवरण देता है। इसलिए स्पष्ट धार्मिक भाषा रखी गई है, लेकिन बाद की किसी विशिष्ट साम्प्रदायिक धारणा को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को पिछले पद से परिणामसूचक संबंध बनाए रखने के लिए ‘इस कारण’ से आरम्भ किया गया है।
