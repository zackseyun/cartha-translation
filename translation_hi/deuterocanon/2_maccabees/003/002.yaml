  text: Because of the piety and hatred of wickedness there, it came about that even the kings themselves honored the place and glorified the sanctuary with the finest gifts sent.
translation:
  language: hi
  text: वहाँ की भक्ति और दुष्टता से घृणा के कारण ऐसा होता था कि स्वयं राजा भी उस स्थान का सम्मान करते और उत्तम से उत्तम भेंटें भेजकर पवित्रस्थान का गौरव बढ़ाते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्तम से उत्तम भेजी हुई भेंटों से।” यूनानी शब्द का अर्थ यहाँ पवित्रस्थान के लिए भेजे गए उपहार या चढ़ावे हो सकता है; सटीक भाव संदर्भ पर निर्भर है।
    reason: ἀποστολαῖς के ‘भेजी गई वस्तुएँ’, ‘भेंटें’ या ‘चढ़ावे’ जैसे संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: मंदिर-संदर्भ में यह परमेश्वर के प्रति श्रद्धा से प्रकट होने वाले भक्तिपूर्ण आचरण को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: μισοπονηρίαν
  choice: दुष्टता से घृणा
  rationale: यूनानी संयुक्त संज्ञा का नैतिक बल और उसका लगभग शाब्दिक अर्थ सुरक्षित रहता है।
- source_word: συνέβαινεν
  choice: ऐसा होता था
  rationale: अपूर्ण भूतकाल यहाँ घटित होते रहने वाले परिणाम या प्रचलित स्थिति को सूचित कर सकता है; यह हिंदी में सहज है।
- source_word: τιμᾶν
  choice: सम्मान करते
  rationale: राजाओं द्वारा उस स्थान को दिए गए सार्वजनिक आदर को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν τόπον
  choice: उस स्थान
  rationale: मूल के सामान्य किंतु श्रद्धापूर्ण ‘स्थान’ को बनाए रखता है और संदर्भित मंदिर-स्थल की ओर संकेत करता है।
- source_word: τὸ ἱερὸν
  choice: पवित्रस्थान
  rationale: यह मंदिर के पवित्र परिसर का बोध कराता है और पहले आए ‘स्थान’ से शब्दगत भेद बनाए रखता है।
- source_word: ἀποστολαῖς
  choice: भेंटें भेजकर
  rationale: संदर्भ में यह पवित्रस्थान के लिए भेजी गई लाभकारी वस्तुओं या भेंटों को सूचित करता है; क्रियात्मक हिंदी अभिव्यक्ति ‘भेजे जाने’ का भाव भी सुरक्षित रखती है।
- source_word: ταῖς κρατίσταις
  choice: उत्तम से उत्तम
  rationale: अतिशयोक्तिपरक रूप का स्वाभाविक हिंदी समतुल्य है और भेंटों की उत्कृष्टता व्यक्त करता है।
- source_word: δοξάζειν
  choice: गौरव बढ़ाते थे
  rationale: यह पवित्रस्थान को वैभव और प्रतिष्ठा देने का भाव व्यक्त करता है तथा पहले प्रयुक्त ‘सम्मान’ से दोनों यूनानी क्रियाओं का भेद बनाए रखता है।
theological_decisions:
- issue: भक्ति और दुष्टता से घृणा किससे संबद्ध हैं
  choice: व्यक्तिगत कर्ता निर्दिष्ट किए बिना ‘उस भक्ति और दुष्टता से घृणा’ रखा गया है।
  alternative: इन्हें महायाजक, नगर-प्रशासन या मंदिर से स्पष्ट रूप से जोड़ना।
  rationale: इस अंश में इन गुणों का व्यक्तिगत कर्ता स्पष्ट नहीं है। अनुवाद कारण-संबंध बनाए रखता है, पर संदर्भ से अधिक निश्चित पहचान आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘ऐसा होता था’ से यूनानी अपूर्ण भूतकाल का प्रचलित या बार-बार होने वाला परिणाम व्यक्त किया गया है; ‘पवित्रस्थान’ मंदिर-परिसर की पवित्रता और τὸν τόπον से उसका शब्दगत भेद बनाए रखता है।
