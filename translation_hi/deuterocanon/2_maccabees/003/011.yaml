  yaml_path: translation/deuterocanon/2_maccabees/003/011.yaml
  text: and some also belonging to Hyrcanus son of Tobias[a], a man of very high position. The ungodly Simon was not slandering to that extent. Altogether there were four hundred talents of silver and two hundred of gold.
translation:
  language: hi
  text: और कुछ धन बहुत ऊँचे पद पर आसीन तोबियाह के पुत्र हिरकानुस का भी था। अधर्मी शमौन उस हद तक झूठा आरोप नहीं लगा रहा था। कुल मिलाकर चाँदी के चार सौ किक्कार और सोने के दो सौ किक्कार[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘सोने के दो सौ’ है; ‘किक्कार’ पूर्ववर्ती पदबंध से समझा जाता है।
    reason: मूल यूनानी में संज्ञा के लोप को स्पष्ट करना।
lexical_decisions:
- source_word: τινὰ
  choice: कुछ धन
  rationale: अनिश्चित सर्वनाम संदर्भ में जमा धन के एक अज्ञात हिस्से की ओर संकेत करता है; हिन्दी में केवल ‘कुछ’ की अपेक्षा ‘कुछ धन’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: Ὑρκανοῦ τοῦ Τωβίου
  choice: तोबियाह के पुत्र हिरकानुस
  rationale: दूसरी संबंधकारक संज्ञा पितृनाम बताती है; ‘पुत्र’ जोड़कर सम्बन्ध को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: ἀνδρὸς ἐν ὑπεροχῇ κειμένου
  choice: बहुत ऊँचे पद पर आसीन
  rationale: यह पदबंध शारीरिक स्थिति नहीं, बल्कि सामाजिक प्रतिष्ठा और उच्च पद को व्यक्त करता है।
- source_word: οὐχ οὕτως διαβάλλων ὁ δυσσεβὴς Σίμων
  choice: स्थिति वैसी नहीं थी, जैसा अधर्मी शमौन ने झूठा आरोप लगाया था
  rationale: οὐχ οὕτως को वास्तविक स्थिति और शमौन के दुर्भावनापूर्ण आरोप के बीच विरोध के रूप में लिया गया है; διαβάλλω का झूठे या निंदात्मक आरोप का भाव सुरक्षित रखा गया है।
- source_word: τὰ δὲ πάντα
  choice: कुल मिलाकर
  rationale: यह आगे दिए गए पूरे हिसाब का परिचय देने वाला स्वाभाविक हिन्दी पदबंध है।
- source_word: ἀργυρίου τετρακόσια τάλαντα
  choice: चाँदी के चार सौ किक्कार
  rationale: τάλαντον प्राचीन भार और मौद्रिक इकाई है; ‘किक्कार’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला समतुल्य है।
- source_word: χρυσίου δὲ διακόσια
  choice: सोने के दो सौ किक्कार
  rationale: यूनानी में ‘किक्कार’ दूसरी बार लुप्त है, पर पिछले समानांतर वाक्यांश से स्पष्टतः समझा जाता है; हिन्दी में अर्थ की स्पष्टता के लिए इसे दोहराया गया है।
theological_decisions:
- issue: शमौन के लिए δυσσεβής का नैतिक-धार्मिक वर्णन
  choice: अधर्मी शमौन
  alternative: भक्तिहीन शमौन / दुष्ट शमौन
  rationale: ‘अधर्मी’ धार्मिक अनादर और नैतिक निंदा दोनों का भाव रखता है, पर कोई अतिरिक्त साम्प्रदायिक दावा नहीं जोड़ता।
- issue: οὐχ οὕτως διαβάλλων का सम्बन्ध
  choice: स्थिति शमौन के झूठे आरोप के अनुसार नहीं थी
  alternative: शमौन उस सीमा तक झूठा आरोप नहीं लगा रहा था
  rationale: यूनानी वाक्य-विन्यास में οὐχ οὕτως को परिस्थितियों और शमौन के आरोप के विरोध के रूप में पढ़ना प्रसंग और διαβάλλω के निंदात्मक अर्थ के अनुकूल है; शमौन को आंशिक रूप से सही घोषित करने वाली व्याख्या पाठ में अनावश्यक रूप से नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘किक्कार’ प्राचीन भार-मुद्रा इकाई के पारंपरिक बाइबलीय नाम के रूप में रखा गया है।
