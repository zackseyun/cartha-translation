  yaml_path: translation/deuterocanon/2_maccabees/003/012.yaml
  text: and that to wrong those who had trusted in the holiness of the place[a], and in the majesty and inviolability of the temple honored throughout the whole world, was utterly impossible.
translation:
  language: hi
  text: और उन लोगों के साथ अन्याय करना, जिन्होंने उस स्थान की पवित्रता और सारे संसार में सम्मानित मंदिर की गरिमा तथा उसकी अलंघनीयता[a] पर भरोसा रखा था, सर्वथा असंभव था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शरणस्थल के रूप में कानूनी संरक्षण’ अथवा ‘शरणाधिकार’। यूनानी ἀσυλία मंदिर की व्यापक अलंघनीयता के साथ-साथ शरण देने से जुड़ी उसकी विशेष कानूनी सुरक्षा का भी संकेत कर सकता है।
    reason: यूनानी ἀσυλία का व्यापक ‘अलंघनीयता’ अर्थ मुख्य पाठ में रखा गया है, जबकि उसके अधिक विशिष्ट शरणस्थल-संबंधी कानूनी अर्थ को पाद-टिप्पणी में सुरक्षित किया गया है।
lexical_decisions:
- source_word: ἀδίκησαί
  choice: उनके साथ अन्याय करना
  rationale: यह यूनानी क्रिया किसी के विरुद्ध अन्याय करने या उसका हक मारने का नैतिक-कानूनी भाव रखती है; हिंदी में यह प्रयोग स्वाभाविक और पर्याप्त व्यापक है।
- source_word: τοὺς πεπιστευκότας
  choice: जो लोग ... भरोसा कर चुके थे
  rationale: पूर्णकालिक कृदंत पहले से स्थापित और बनी हुई निर्भरता व्यक्त करता है; ‘भरोसा कर चुके थे’ इस भाव को रखता है और यहाँ अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: ἁγιωσύνῃ
  choice: पवित्रता
  rationale: यह स्थान के पवित्र स्वरूप या धार्मिक पावनता का सीधा और सामान्य हिंदी रूप है।
- source_word: σεμνότητι
  choice: गरिमा
  rationale: यह मंदिर की श्रद्धा योग्य, गौरवपूर्ण प्रतिष्ठा व्यक्त करता है और आधुनिक हिंदी में ‘महिमा’ की अपेक्षा यहाँ अधिक सटीक संस्थागत भाव देता है।
- source_word: ἀσυλίᾳ
  choice: अनुल्लंघनीयता
  rationale: यह मंदिर को लूट, जब्ती या अपवित्रीकरण से प्राप्त पवित्र-कानूनी सुरक्षा का व्यापक भाव बनाए रखता है; शरणाधिकार का अधिक विशिष्ट अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: τετιμημένου
  choice: सम्मानित
  rationale: पूर्ण निष्क्रिय कृदंत मंदिर को व्यापक रूप से प्राप्त और स्थापित सम्मान बताता है।
- source_word: κατὰ τὸν σύμπαντα κόσμον
  choice: सारे संसार में
  rationale: यह मूल के व्यापक और अलंकारपूर्ण सार्वभौमिक दावे को सहज हिंदी में व्यक्त करता है।
- source_word: παντελῶς ἀμήχανον εἶναι
  choice: सर्वथा असंभव था
  rationale: ‘सर्वथा’ παντελῶς की तीव्रता और ‘असंभव’ ἀμήχανον का स्पष्ट अर्थ संक्षेप में व्यक्त करते हैं।
theological_decisions:
- issue: क्या ἀσυλίᾳ का अनुवाद स्पष्ट रूप से शरणाधिकार की भाषा में किया जाए
  choice: अनुल्लंघनीयता
  alternative: शरणस्थल होने का अधिकार; शरणस्थल के रूप में संरक्षित स्थिति
  rationale: शब्द मंदिर के शरणस्थल-संबंधी कानूनी विशेषाधिकार का संकेत दे सकता है, पर प्रसंग में वह मंदिर की गरिमा के साथ उसकी एक व्यापक पवित्र-कानूनी विशेषता के रूप में जुड़ा है। मुख्य पाठ में व्यापक अर्थ रखा गया है और विशिष्ट शरणस्थल-संबंधी अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज गद्य रखा गया है। वाक्य मूल के पूर्ववर्ती कथन से जुड़ने के कारण ‘और’ से आरंभ होता है। ‘अनुल्लंघनीयता’ अपेक्षाकृत औपचारिक पद है, पर मंदिर की पवित्र-कानूनी सुरक्षा को संक्षेप और सटीक रूप से व्यक्त करता है; पाद-टिप्पणी इसे सामान्य पाठक के लिए स्पष्ट करती है।
