  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: परन्तु
  rationale: δέ यहाँ पिछले प्रसंग के विपरीत हेलियोदोरुस की कार्रवाई को सामने लाता है; ‘परन्तु’ इस हल्के विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἡλιόδωρος
  choice: हेलियोदोरुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: τὸ διεγνωσμένον
  choice: जो तय किया जा चुका था
  rationale: पूर्ण निष्क्रिय कृदन्त पहले ही किए जा चुके निश्चय को सूचित करता है; यह रूप उस पूर्वनिर्धारण को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπετέλει
  choice: उसे पूरा करने में लगा रहा
  rationale: अपूर्ण भूतकाल जारी कार्रवाई दिखाता है; यह चयन निर्णय को कार्यरूप देने की प्रक्रिया और उसके चलते रहने, दोनों को व्यक्त करता है।
