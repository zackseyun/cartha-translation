translation:
  language: hi
  text: परन्तु याजक अपने याजकीय वस्त्रों में वेदी के सामने अपने आपको भूमि पर डालकर स्वर्ग की ओर पुकार रहे थे कि वह, जिसने सुरक्षा के लिए सौंपी गई वस्तुओं के विषय में व्यवस्था दी थी, इन वस्तुओं को उन लोगों के लिए सुरक्षित रखे जिन्होंने उन्हें सौंपा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥίψαντες ἑαυτούς
  choice: भूमि पर गिर पड़े
  rationale: यह प्रयोग याजकों के अपने आपको तत्काल नीचे डाल देने की सजीव शारीरिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ‘दण्डवत किया’ कहने से यूनानी क्रिया की तीव्रता घट जाती।
- source_word: ἐπεκαλοῦντο εἰς οὐρανόν
  choice: स्वर्ग की ओर पुकारते हुए … विनती करने लगे
  rationale: अपूर्ण भूतकाल निरन्तर और व्याकुल पुकार को सूचित करता है। ‘स्वर्ग की ओर’ मूल पाठ की श्रद्धापूर्ण परोक्ष अभिव्यक्ति को बनाए रखता है, जबकि आगे ‘उस जन से’ प्रार्थना के वास्तविक संबोधन को स्पष्ट करता है।
- source_word: τὸν περὶ παρακαταθήκης νομοθετήσαντα
  choice: उस जन से … जिसने धरोहरों के विषय में व्यवस्था दी थी
  rationale: ‘व्यवस्था दी थी’ νομοθετέω के विधिक बल को बनाए रखता है। ‘उस जन’ मूल के निश्चित एकवचन संकेत को सुरक्षित रखता है और बिना मूल से अधिक स्पष्ट किए परमेश्वर की ओर संकेत करता है।
- source_word: παρακαταθήκης
  choice: धरोहरों
  rationale: ‘धरोहर’ ऐसी संपत्ति को दर्शाता है जो सुरक्षा के लिए किसी के पास सौंपी गई हो; यह हिन्दी में ‘जमा राशि’ से अधिक व्यापक है और प्रसंग के धन तथा बहुमूल्य वस्तुओं दोनों को समेटता है।
- source_word: τοῖς παρακαταθεμένοις
  choice: उन्हें सौंपनेवालों के लिए
  rationale: यह उन व्यक्तियों को दर्शाता है जिन्होंने वस्तुएँ सुरक्षित रखने के लिए सौंपी थीं। ‘सौंपनेवालों’ का संबंध ‘धरोहरों’ से अर्थगत रूप से स्पष्ट रहता है।
- source_word: ταῦτα σῶα διαφυλάξαι
  choice: इन वस्तुओं को … सुरक्षित रखे
  rationale: यह σῶα और διαφυλάσσω के संयुक्त भाव—हानि या नाश से पूरी तरह बचाकर रखने—को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν ταῖς ἱερατικαῖς στολαῖς
  choice: अपने याजकीय वस्त्र पहने हुए
  rationale: यह समारोह-संबंधी परिधान को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रार्थना में श्रद्धापूर्ण परोक्ष अभिव्यक्ति
  choice: स्वर्ग की ओर पुकारते हुए उस जन से विनती
  alternative: परमेश्वर से विनती
  rationale: यूनानी पाठ सीधे ‘परमेश्वर’ न कहकर ‘स्वर्ग की ओर’ कहता है और फिर व्यवस्था देनेवाले की ओर संकेत करता है। चुना हुआ रूप इस परोक्षता को बनाए रखते हुए हिन्दी वाक्य का आशय स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजकीय वस्त्र’, ‘वेदी’, ‘व्यवस्था’ और ‘धरोहर’ धार्मिक तथा विधिक प्रसंग को बनाए रखते हैं; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
