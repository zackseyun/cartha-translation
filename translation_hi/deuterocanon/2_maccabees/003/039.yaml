  yaml_path: translation/deuterocanon/2_maccabees/003/039.yaml
  text: For he himself[a], who has his dwelling in heaven, is the overseer and helper of that place[b], and he strikes and destroys those who come to do harm.
translation:
  language: hi
  text: क्योंकि वह स्वयं, जिसका निवास स्वर्ग में है[a], उस स्थान[b] की देखरेख करने वाला और सहायक है; और जो लोग हानि पहुँचाने आते हैं, उन्हें वह प्रहार करता और नष्ट कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो स्वर्ग में निवास करता है।’ यूनानी का अधिक शाब्दिक अर्थ है, ‘जो स्वर्गीय निवास रखता है।’
    reason: lexical_alternative
  - marker: b
    text: अर्थात् मंदिर; यूनानी में अधिक शाब्दिक रूप से, ‘उस स्थान’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίαν ἐπουράνιον ἔχων
  choice: जिसका निवास स्वर्ग में है
  rationale: यह कृदन्तीय वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और परमेश्वर के स्वर्गीय निवास पर दिए गए बल को बनाए रखता है।
- source_word: ἐπόπτης
  choice: देखरेख करनेवाला
  rationale: यह निगरानी और संरक्षण की धारणा व्यक्त करता है, पर βοηθός के ‘सहायक’ अर्थ के साथ अनावश्यक रूप से नहीं मिलता।
- source_word: βοηθός
  choice: सहायक
  rationale: मूल अर्थ सहायता के लिए आनेवाले का है; ‘सहायक’ सहज है और आवश्यकता से अधिक सैनिक अर्थ नहीं जोड़ता।
- source_word: ἐκείνου τοῦ τόπου
  choice: उस स्थान
  rationale: संदर्भ में मंदिर अभिप्रेत है, फिर भी यूनानी पाठ व्यापक शब्द ‘स्थान’ का प्रयोग करता है; अनुवाद उसी को सुरक्षित रखता है।
- source_word: τοὺς παραγινομένους ἐπὶ κακώσει
  choice: जो लोग हानि पहुँचाने आते हैं
  rationale: यह ἐπὶ के प्रयोजनार्थक बल और κακώσει के हानि पहुँचाने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: τύπτων ἀπόλλυσι
  choice: प्रहार करके नष्ट कर देता है
  rationale: यह कृदन्त और मुख्य क्रिया के संबंध तथा दण्डात्मक कार्रवाई की तीव्रता को बिना पुरातन शब्दावली के सुरक्षित रखता है।
theological_decisions:
- issue: αὐτός का संदर्भ
  choice: कर्ता को ‘वह स्वयं’ कहा गया है और संदर्भ से परमेश्वर पहचाना जाता है।
  alternative: स्पष्ट रूप से ‘परमेश्वर स्वयं’ जोड़ना, या इसे किसी सामान्य स्वर्गीय शक्ति के रूप में लेना।
  rationale: कथा-संदर्भ मंदिर की रक्षा स्वर्ग में निवास करनेवाले परमेश्वर से जोड़ता है, पर यूनानी पद में यहाँ नाम ‘परमेश्वर’ नहीं जोड़ा गया; इसलिए अनुवाद बलसूचक ‘स्वयं’ रखते हुए संदर्भ को पहचान निर्धारित करने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रूप अपनाया गया है। ‘देखरेख करनेवाला’ प्रशासनिक ‘निरीक्षक’ की तुलना में अधिक स्वाभाविक है, और ‘प्रहार करके नष्ट कर देता है’ मूल की कठोर दण्डात्मक छवि बनाए रखता है।
