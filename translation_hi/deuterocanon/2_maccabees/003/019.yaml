  text: And the women[a], with sackcloth bound under their breasts, were crowding the streets; and the virgins who were shut in, some were running together to the gates, others to the walls[c][b], and some were peering out through the windows.
translation:
  language: hi
  text: स्त्रियाँ अपनी छातियों के नीचे टाट के शोक-वस्त्र बाँधे हुए सड़कों पर बड़ी संख्या में उमड़ रही थीं[a]; और जो कुँवारियाँ भीतर बंद थीं[b], उनमें से कुछ फाटकों की ओर दौड़ रही थीं, कुछ नगर की दीवारों की ओर, और कुछ खिड़कियों से बाहर झाँक रही थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति का शाब्दिक अर्थ है, ‘वे सड़कों पर बढ़ती जा रही थीं,’ अर्थात वे वहाँ बड़ी संख्या में जमा हो रही थीं।
    reason: lexical_alternative
  - marker: b
    text: ‘भीतर बंद थीं’ यूनानी शब्द का सीधा अर्थ है कि वे उस समय भीतर रुद्ध या बंद थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεζωσμέναι ... σάκκους ὑπὸ τοὺς μαστούς
  choice: अपनी छातियों के नीचे टाट बाँधे हुए
  rationale: वाक्यांश शोक के खुरदरे वस्त्र को छाती के नीचे कसकर बाँधने का दृश्य प्रस्तुत करता है। यह अनुवाद यूनानी की शारीरिक स्थिति और शोक-संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κατὰ τὰς ὁδοὺς ἐπλήθυνον
  choice: सड़कों पर बड़ी संख्या में उमड़ रही थीं
  rationale: ἐπλήθυνον का शाब्दिक भाव ‘बहुत होती जा रही थीं’ है; प्रसंग में इसका अर्थ सड़कों पर बड़ी संख्या में दिखाई देना है। ‘उमड़ रही थीं’ भीड़ और गतिशील दृश्य दोनों व्यक्त करता है।
- source_word: κατάκλειστοι τῶν παρθένων
  choice: जो कुँवारियाँ भीतर बंद रहती थीं
  rationale: παρθένοι की विशिष्टता ‘कुँवारियाँ’ से सुरक्षित रहती है, जबकि κατάκλειστοι उनके भीतर बंद अथवा एकांत में रखे जाने की सामाजिक स्थिति बताता है। ‘रहती थीं’ इसे केवल उस क्षण की आकस्मिक कैद बताने से बचाता है।
- source_word: συνέτρεχον
  choice: दौड़ रही थीं
  rationale: क्रिया जल्दबाजी में दौड़ने या एकत्र होकर पहुँचने का भाव रखती है। विभिन्न दिशाओं की ओर जाने के इस वाक्य में सहज हिन्दी के लिए ‘दौड़ रही थीं’ चुना गया है; सामूहिकता प्रसंग से स्पष्ट है।
- source_word: πυλῶνας
  choice: फाटकों
  rationale: यह बड़े द्वारों अथवा प्रवेश-द्वारों को सूचित करता है। नगर के संदर्भ में ‘फाटक’ स्पष्ट और स्वाभाविक है।
- source_word: τείχη
  choice: नगर की दीवारों
  rationale: τείχη नगर की रक्षात्मक दीवारों को सूचित करता है। ‘नगर की दीवारें’ सामान्य पाठक के लिए ‘शहरपनाह’ से अधिक स्पष्ट है।
- source_word: διὰ τῶν θυρίδων διεκύπτον
  choice: खिड़कियों से बाहर झाँक रही थीं
  rationale: διεκύπτον भीतर से बाहर ध्यानपूर्वक देखने या झुककर झाँकने का भाव देता है; अपूर्ण काल जारी गतिविधि को दर्शाता है।
