lexical_decisions:
- source_word: θείαν ἐνέργειαν
  choice: ईश्वरीय सामर्थ्य
  rationale: ἐνέργεια यहाँ परमेश्वर की प्रभावकारी क्रिया या सक्रिय सामर्थ्य को दर्शाता है। प्रसंग में ‘ईश्वरीय सामर्थ्य’ उस शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है जिसके कारण वह धराशायी हुआ।
- source_word: ἄφωνος
  choice: बोल न सकने की दशा में
  rationale: ἄφωνος का अर्थ आवाज़ से रहित या बोलने में असमर्थ है। यह वाक्यांश उसके तत्काल शारीरिक हाल को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: πάσης ἐστερημένος ἐλπίδος καὶ σωτηρίας
  choice: सारी आशा तथा बचाव से वंचित
  rationale: ἐστερημένος पूर्णतः वंचित होने का भाव देता है। इस शारीरिक संकट के कथात्मक प्रसंग में σωτηρία के लिए ‘बचाव’ उपयुक्त है, जबकि उसके व्यापक अर्थ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἔρριπτο
  choice: पड़ा रहा
  rationale: यह रूप उसकी जारी पड़ी हुई, धराशायी अवस्था का चित्र प्रस्तुत करता है। ‘पड़ा रहा’ आधुनिक हिन्दी में स्वाभाविक है और आवश्यक से अधिक यह नहीं बताता कि उसे किस प्रकार नीचे गिराया गया।
theological_decisions:
- issue: σωτηρία का कथात्मक संकट के प्रसंग में अनुवाद
  choice: बचाव
  alternative: उद्धार या मुक्ति
  rationale: यहाँ तात्कालिक संदर्भ हेलियोदोरुस की प्राण-संकट वाली शारीरिक दशा है, इसलिए ‘बचाव’ ठोस प्रसंग के अनुकूल है। फिर भी यूनानी शब्द के व्यापक धार्मिक अर्थ को नकारा नहीं गया और पादटिप्पणी में विकल्प दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। यूनानी μὲν से अगले कथन के साथ बनने वाला विरोध यहाँ हिन्दी में कृत्रिम ‘एक ओर’ जोड़कर नहीं उभारा गया; वाक्यांत का अर्धविराम आगे जारी संरचना का संकेत देता है।
