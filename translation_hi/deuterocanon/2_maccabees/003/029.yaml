  verdict: revise
  source_fidelity: The draft accurately conveys the causal force of διὰ τὴν θείαν ἐνέργειαν, Heliodorus’s inability to speak (ἄφωνος), his deprivation of every hope and rescue (πάσης ... ἐλπίδος καὶ σωτηρίας), and his collapsed state (ἔρριπτο). A small revision better represents the latter as a resultant, prostrate condition and makes the speechlessness more idiomatic.
  naturalness: ‘बोल न सकने की दशा में’ is understandable but somewhat periphrastic. ‘बोलने में असमर्थ’ is more natural modern standard Hindi. ‘धराशायी पड़ा था’ clearly and idiomatically conveys the narrative image of his having been struck down and lying there.
  terminology: ‘दैवी सामर्थ्य’ appropriately renders the active divine force without unnecessarily specifying a doctrinal mechanism. ‘बचाव’ is suitable for σωτηρία in this immediate life-threatening narrative context. The footnote properly preserves ‘उद्धार’ and ‘मुक्ति’ as alternatives.
  issues:
  - severity: low
    issue: Periphrastic expression for ἄφωνος
    rationale: ‘बोल न सकने की दशा में’ is grammatically sound, but ‘बोलने में असमर्थ’ is more concise and idiomatic while retaining the meaning ‘unable to speak.’
  - severity: low
    issue: Collapsed-state wording for ἔρριπτο
    rationale: ‘पड़ा रहा’ conveys continued lying but does not as clearly evoke the resultant condition of being struck down. ‘धराशायी पड़ा था’ naturally preserves that narrative force without over-specifying the action.
