base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/007.yaml
  text: After conferring with the king[a], Apollonius informed him about the money that had been reported to him. Then the king appointed Heliodorus, who was over the affairs of state[c][b], and sent him with orders to carry out the removal of the aforementioned money.
translation:
  language: hi
  text: अपुल्लोनियुस ने राजा से विचार-विमर्श करने के बाद[a] उसे उस धन के विषय में बताया, जिसकी सूचना उसे दी गई थी। तब राजा ने राजकीय मामलों के प्रभारी[b] हेलियोदोरुस को नियुक्त किया और उसे आदेश देकर भेजा कि वह पहले बताए गए धन को बाहर ले जाने की व्यवस्था करे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा से मिलने के बाद” अथवा “राजा से परामर्श करने के बाद।” यूनानी कृदन्त औपचारिक भेंट या विचार-विमर्श का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मामलों के ऊपर नियुक्त व्यक्ति”; यह राजकीय मामलों की देखरेख करने वाले एक उच्च अधिकारी की प्रशासनिक पदवी थी।
    reason: cultural_note
  - marker: c
    text: या “पहले बताए गए धन को हटाने का कार्य पूरा करे।” यूनानी अभिव्यक्ति धन को उसके रखे हुए स्थान से बाहर ले जाने का कार्य पूरा कराने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμίξας
  choice: विचार-विमर्श करने के बाद
  rationale: यह कृदन्त राजा से मिलने और बातचीत या परामर्श करने का भाव देता है; यह चुनाव उसके कालगत और औपचारिक स्वर को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐνεφάνισεν
  choice: बताया
  rationale: यहाँ अपुल्लोनियुस राजा के सामने धन के विषय में सूचना प्रस्तुत करता है। ‘बताया’ सहज आधुनिक हिन्दी है और प्रसंग के आधिकारिक भाव के अनुकूल है।
- source_word: μηνυθέντων
  choice: जिसकी सूचना उसे दी गई थी
  rationale: निष्क्रिय कृदन्त उस धन की ओर संकेत करता है जिसके विषय में अपुल्लोनियुस को पहले सूचना मिली थी; यह अनुवाद अनावश्यक रूप से आरोप या चुगली का भाव नहीं जोड़ता।
- source_word: χρημάτων
  choice: धन
  rationale: प्रसंग में यह किसी निश्चित धनराशि या निधि को सूचित करता है। ‘धन’ स्पष्ट, संक्षिप्त और गरिमापूर्ण है।
- source_word: προχειρισάμενος
  choice: चुना
  rationale: राजा हेलियोदोरुस को इस विशेष कार्य के लिए चुनता है। यूनानी शब्द चयन या नियुक्ति दोनों का भाव दे सकता है; ‘चुना’ पाठ में अलग से अनुपस्थित पद पर नियुक्ति का अर्थ नहीं जोड़ता।
- source_word: τὸν ἐπὶ τῶν πραγμάτων
  choice: राजकीय कामकाज के प्रधान अधिकारी
  rationale: यह सरकारी मामलों की देखरेख करने वाले उच्च अधिकारी का प्रशासनिक पदसूचक वाक्यांश है। यह रूप सामान्य पाठक को भूमिका समझाता है और आधिकारिक स्वर बनाए रखता है।
- source_word: ἐκκομιδὴν
  choice: वहाँ से निकलवा ले
  rationale: शब्द धन को उसके रखे हुए स्थान से बाहर ले जाने पर बल देता है। यह अनुवाद निष्कासन या ढुलाई दोनों की गुंजाइश रखता है, पर यूनानी से अधिक स्पष्ट रूप से ‘जब्ती’ नहीं जोड़ता।
- source_word: ποιήσασθαι
  choice: निकलवा ले
  rationale: ἐκκομιδήν के साथ यह निष्कासन को सम्पन्न कराने का अर्थ देता है; हिन्दी का सकर्मक-प्रेरणार्थक रूप आदेश के क्रियान्वयन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: προειρημένων
  choice: पहले बताए गए
  rationale: यह उसी धन की ओर लौटता है जिसका अभी उल्लेख हुआ है। ‘पहले बताए गए’ आधुनिक और स्पष्ट हिन्दी है।
