base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/035.yaml
  text: But Heliodorus[a], after offering a sacrifice to God and making very great vows to the one who had preserved his life, and after taking leave of Onias[c][b], returned to the king.
translation:
  language: hi
  text: परन्तु हेलियोदोरुस ने परमेश्वर को बलि चढ़ाई और उस परमेश्वर से, जिसने उसका जीवन बचाया था, बहुत बड़ी मन्नतें मानीं[a]। फिर वह ओनियास से विदा लेकर[b] राजा के पास लौट गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत बड़ी प्रार्थनाएँ कीं।’ यूनानी शब्द का अर्थ ‘प्रार्थनाएँ’ या ‘मन्नतें’ हो सकता है; बलि का प्रसंग ‘मन्नतें’ अर्थ के अधिक अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ओनियास का स्वागत करके।’ यूनानी क्रिया का अर्थ ‘ग्रहण करना’ या ‘स्वागत करना’ भी हो सकता है, पर यहाँ प्रस्थान का प्रसंग ‘विदा लेकर’ अर्थ के अनुकूल है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी क्रिया में सैन्य भाव है; इसका आशय शिविर समेटकर या वापस कूच करके जाने से हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: θυσίαν ἀνενέγκων τῷ θεῷ
  choice: परमेश्वर को बलि चढ़ाई
  rationale: ἀναφέρω के साथ θυσία का अर्थ बलि अर्पित करना है। हिन्दी में ‘बलि चढ़ाना’ स्वाभाविक और धार्मिक संदर्भ में स्पष्ट है; सम्प्रदान कारक परमेश्वर को अर्पण का प्राप्तकर्ता बताता है।
- source_word: εὐχὰς μεγίστας εὐξάμενος
  choice: बहुत बड़ी मन्नतें मानीं
  rationale: εὐχή का अर्थ प्रार्थना या मन्नत दोनों हो सकता है। बलि के प्रसंग में ‘मन्नतें’ अधिक उपयुक्त लगती हैं, जबकि μεγίστας की तीव्रता ‘बहुत बड़ी’ से बनी रहती है। विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῷ τὸ ζῆν περιποιήσαντι
  choice: उस परमेश्वर से, जिसने उसका जीवन बचाया था
  rationale: सम्बोधन का संकेत परमेश्वर की ओर है और τὸ ζῆν περιποιήσαντι हेलियोदोरुस के जीवित बचाए जाने को व्यक्त करता है। ‘जीवन बचाया’ निकट-मृत्यु के प्रसंग में सहज हिन्दी है।
- source_word: τὸν Ὀνίαν ἀποδεξάμενος
  choice: ओनियास से विदा लेकर
  rationale: ἀποδέχομαι के अर्थ-क्षेत्र में ग्रहण करना, स्वागत करना और प्रसंगानुसार विदा लेना सम्मिलित हैं। राजा के पास प्रस्थान की कथा-गति में ‘विदा लेकर’ उपयुक्त है, पर अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: ἀνεστρατοπέδευσεν πρὸς τὸν βασιλέα
  choice: राजा के पास लौट गया
  rationale: क्रिया में शिविर समेटकर लौटने या वापस कूच करने का सैन्य भाव है। मुख्य पाठ में सहज आधुनिक हिन्दी दी गई है और सैन्य रंग पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ‘जिसने उसका जीवन बचाया था’ का सन्दर्भ
  choice: यह वाक्यांश परमेश्वर को हेलियोदोरुस का जीवन बचानेवाला बताता है।
  alternative: इसे अधिक सामान्य रूप में ‘जिसने उसे जीवन दिया था’ कहा जा सकता है।
  rationale: निकटवर्ती प्रसंग हेलियोदोरुस के मृत्यु-संकट से बचने का है; इसलिए ‘जीवन बचाया’ सामान्य सृष्टिगत जीवनदान की अपेक्षा अधिक प्रसंगानुकूल है और किसी अतिरिक्त मतवैशिष्ट्य को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। participial क्रम को दो वाक्यों में बाँटकर घटनाओं का अनुक्रम स्पष्ट किया गया है। ‘परन्तु’, ‘बलि चढ़ाई’, ‘मन्नतें मानीं’ और ‘विदा लेकर’ औपचारिकता तथा स्वाभाविक हिन्दी के बीच संतुलन रखते हैं।
