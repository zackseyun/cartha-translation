base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/038.yaml
  text: If you have any enemy or one plotting against your affairs[a], send him there[b], and you will receive him back flogged—if indeed he even survives—because there truly is some power of God about the place.
translation:
  language: hi
  text: यदि तुम्हारा कोई शत्रु हो या कोई तुम्हारे कामों के विरुद्ध षड्यंत्र रच रहा हो[a], तो उसे वहाँ भेज दो; और तुम उसे कोड़े खाया हुआ वापस पाओगे—यदि वह जीवित बच भी जाए[b]—क्योंकि उस स्थान के चारों ओर सचमुच परमेश्वर की कोई शक्ति विद्यमान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई तुम्हारे हितों के विरुद्ध चाल चल रहा हो।”
    reason: lexical_alternative
  - marker: b
    text: यह वाक्य उस स्थान से जुड़ी परमेश्वर की शक्ति का सामना करने के घातक संकट पर बल देता है।
    reason: clarification
lexical_decisions:
- source_word: πολέμιον
  choice: शत्रु
  rationale: यह किसी व्यक्तिगत विरोधी या बैरी को दर्शाता है; ‘शत्रु’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: πραγμάτων ἐπίβουλον
  choice: तुम्हारे कामों के विरुद्ध षड्यंत्र रच रहा हो
  rationale: ἐπίβουλος में छलपूर्वक हानि पहुँचाने की योजना का भाव है, जबकि πραγμάτων व्यक्ति के काम-काज या हितों के व्यापक क्षेत्र को खुला रखता है।
- source_word: πέμψον αὐτὸν ἐκεῖ
  choice: उसे वहाँ भेज दो
  rationale: आज्ञार्थक वाक्य का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: μεμαστιγωμένον
  choice: कोड़े खाया हुआ
  rationale: पूर्ण निष्क्रिय कृदन्त पहले ही हो चुकी कठोर पिटाई दर्शाता है; यह रूप परिणाम की अवस्था को सुरक्षित रखता है।
- source_word: προσδέξῃ
  choice: वापस पाओगे
  rationale: संदर्भ में भेजे गए व्यक्ति की वापसी और उसे फिर पाने का भाव है; हिन्दी में यह संक्षिप्त तथा स्वाभाविक है।
- source_word: ἐάνπερ καὶ διασωθῇ
  choice: यदि वह जीवित बच भी जाए
  rationale: ἐάνπερ और καί शर्त को तीखा बनाते हैं, और διασωθῇ यहाँ संकट से जीवित निकलने का अर्थ देता है।
- source_word: διὰ τὸ ... εἶναί τινα θεοῦ δύναμιν
  choice: क्योंकि ... परमेश्वर की कोई शक्ति विद्यमान है
  rationale: τινα की अनिश्चितता को ‘कोई’ से बनाए रखा गया है; इसे केवल सामान्य ‘परमेश्वर की शक्ति’ बनाकर पाठ की संयत अभिव्यक्ति को अधिक निश्चित नहीं किया गया।
- source_word: περὶ τὸν τόπον
  choice: उस स्थान के चारों ओर
  rationale: περί के स्थानसूचक अर्थ को दर्शाता है और शक्ति का उस स्थल से जुड़ा होना व्यक्त करता है।
- source_word: ἀληθῶς
  choice: सचमुच
  rationale: यह उस शक्ति की वास्तविकता पर दिए गए बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मन्दिर-संदर्भ में θεοῦ δύναμιν का अनुवाद
  choice: परमेश्वर की कोई शक्ति
  alternative: परमेश्वर की शक्ति; कोई दिव्य शक्ति
  rationale: यूनानी τινα एक वास्तविक किंतु अनिर्दिष्ट अभिव्यक्ति देता है। चुना हुआ रूप न तो इसे पूर्णतः परिभाषित ईश्वरीय उपस्थिति बनाता है, न ‘दिव्य’ कहकर परमेश्वर से इसका संबंध धुँधला करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन में गंभीरता और हल्की भयावह विडंबना बनाए रखी गई है। ‘षड्यंत्र रच रहा हो’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘परमेश्वर की कोई शक्ति’ मूल की वास्तविक किंतु अनिर्दिष्ट धार्मिक अभिव्यक्ति सुरक्षित रखता है।
