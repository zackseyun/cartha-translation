lexical_decisions:
- source_word: αἴφνω
  choice: अचानक
  rationale: यह क्रिया-विशेषण घटना की अनपेक्षित तात्कालिकता व्यक्त करता है; ‘अचानक’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: πεσόντα
  choice: गिर पड़ा
  rationale: πίπτω के भूतकालिक कृदन्त को हिन्दी में घटनाक्रम के अनुरूप पूर्ण क्रिया बनाया गया है। ‘गिर पड़ा’ आकस्मिक शारीरिक पतन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πρὸς τὴν γῆν
  choice: भूमि पर
  rationale: यह वाक्यांश नीचे की ओर गति और भूमि तक पहुँचने का भाव देता है; ‘भूमि पर’ dignified तथा सहज हिन्दी है।
- source_word: πολλῷ σκότει
  choice: घोर अंधकार
  rationale: πολλῷ यहाँ अंधकार की प्रबलता और व्यापकता बताता है। ‘घोर अंधकार’ अर्थ की गंभीरता बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: περιχυθέντα
  choice: ने उसे ढक लिया
  rationale: निष्क्रिय कृदन्त का मूल चित्र किसी वस्तु के चारों ओर उँड़ेल दिए जाने या छा जाने का है। हिन्दी में अंधकार को कर्ता बनाकर ‘ने उसे ढक लिया’ इस अनुभूति को स्पष्ट और सहज रखता है।
- source_word: συναρπάσαντες
  choice: उसे उठाकर
  rationale: सन्दर्भ में लोग गिरे हुए व्यक्ति को पकड़कर उठाते हैं ताकि उसे ढोने के साधन पर रखें। ‘उठाकर’ शारीरिक क्रिया को स्पष्ट करता है, जबकि ‘पकड़ लिया’ अनावश्यक रूप से कठोर लग सकता है।
- source_word: φορεῖον
  choice: स्ट्रेचर
  rationale: यह अशक्त व्यक्ति को उठाकर ले जाने के साधन को दर्शाता है। ‘स्ट्रेचर’ आज के सामान्य हिन्दी पाठक के लिए सबसे तुरंत समझ आने वाला समतुल्य है।
- source_word: ἐνθέντες
  choice: पर रख दिया
  rationale: ἐντίθημι का यहाँ अर्थ व्यक्ति को ढोने के साधन पर रखना है। ‘पर रख दिया’ हिन्दी के घटनाक्रम में संक्षिप्त और स्वाभाविक है।
