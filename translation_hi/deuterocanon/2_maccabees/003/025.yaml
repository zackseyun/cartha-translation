  yaml_path: translation/deuterocanon/2_maccabees/003/025.yaml
  text: For a horse appeared to them with a fearsome rider[a], adorned with a most beautiful saddlecloth; and rushing headlong, it struck Heliodorus with its front hoofs[b], while the one seated on it appeared to be wearing golden armor.
translation:
  language: hi
  text: क्योंकि उन्हें एक घोड़ा दिखाई दिया, जिसका सवार भयावह था। वह घोड़ा अत्यन्त सुन्दर साज से सुसज्जित था[a], और प्रचण्ड वेग से झपटकर उसने अपने अगले खुरों से हेलियोदोरस पर प्रहार किया[b]। उस पर बैठा हुआ व्यक्ति सोने का पूरा कवच पहने हुए दिखाई देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अत्यन्त सुन्दर सजावटी साज से सुसज्जित।” यूनानी शब्द घोड़े की अलंकृत साज या उपकरण को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने अगले खुरों से हेलियोदोरस को हिला दिया”; प्रसंग में क्रिया हिंसक चोट या धक्के का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: अकर्मक भाव में प्रयुक्त इस कर्मवाच्य रूप से किसी के सहसा दृष्टिगोचर होने का अर्थ निकलता है; ‘दिखाई दिया’ घटना को ठोस रूप में रखता है।
- source_word: τις ἵππος
  choice: एक घोड़ा
  rationale: τις यहाँ अनिश्चितता सूचित करता है; स्वाभाविक हिन्दी में ‘एक घोड़ा’ पर्याप्त है।
- source_word: φοβερὸν ἔχων τὸν ἐπιβάτην
  choice: जिसका सवार भयावह था
  rationale: वाक्यांश सवार को भय उत्पन्न करने वाला बताता है; ‘भयावह’ φοβερός की शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: καλλίστῃ σαγῇ διακεκοσμημένος
  choice: अत्यन्त सुन्दर साज-सज्जा से अलंकृत
  rationale: σαγή घोड़े के अलंकरण अथवा सजावटी उपकरण को सूचित करता है। ‘साज-सज्जा’ किसी एक अनिश्चित वस्तु तक अर्थ सीमित किए बिना इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: φερόμενος δὲ ῥύδην
  choice: प्रचण्ड वेग से झपटा
  rationale: यह पदावली तीव्र और हिंसक अग्रगति दर्शाती है; ‘झपटा’ उस आकस्मिक आक्रमण को व्यक्त करता है।
- source_word: ἔσεισεν
  choice: प्रहार किया
  rationale: σείω का मूल अर्थ ‘हिलाना’ है, पर अगले खुरों के साधन के साथ यहाँ हिंसक चोट या धक्का अभिप्रेत है।
- source_word: τὰς ἐμπροσθίους ὁπλάς
  choice: अपने अगले खुरों से
  rationale: ὁπλή विशेषतः खुर है और ἐμπροσθίους आगे वाले खुरों को स्पष्ट करता है।
- source_word: ὁ δὲ ἐπικαθήμενος
  choice: उस पर बैठे हुए व्यक्ति
  rationale: यूनानी की वर्णनात्मक कृदन्त-संरचना को ‘सवार’ दोहराकर सरल बनाने के बजाय यथासंभव बनाए रखा गया है।
- source_word: χρυσῆν πανοπλίαν
  choice: सोने का पूरा कवच
  rationale: πανοπλία केवल सामान्य कवच नहीं, पूर्ण युद्ध-कवच का बोध कराता है; इसलिए ‘पूरा कवच’ चुना गया।
- source_word: ἐφαίνετο ... ἔχων
  choice: ने मानो ... पहन रखा था
  rationale: ἐφαίνετο दृश्य आभास अथवा प्रतीति को बनाए रखता है; ‘मानो’ इसे सपाट निश्चित कथन में बदलने से बचाता है।
theological_decisions:
- issue: मन्दिर-दण्ड के प्रसंग में इस प्रकट घटना का स्वरूप
  choice: घोड़े और सवार को ठोस दृश्य घटना के रूप में वर्णित करना, पर ἐφαίνετο की प्रतीतिगत बारीकी बनाए रखना
  alternative: इसे स्पष्टतः दर्शन, प्रतीक या पूर्णतः भौतिक घटना घोषित करना
  rationale: यूनानी पाठ घटना को प्रत्यक्ष और ठोस भाषा में सुनाता है, लेकिन उसके तत्त्वमीमांसक स्वरूप की व्याख्या नहीं करता। अनुवाद को इस तनाव का निर्णय नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप। ‘प्रचण्ड वेग से झपटा’ आक्रमण की तीव्रता रखता है; ‘सोने का पूरा कवच’ πανοπλία की व्यापकता स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
