- source_word: ὑπʼ ὄψιν τεθεαμένος
  choice: अपनी आँखों से देखा था
  rationale: यह यूनानी अभिव्यक्ति प्रत्यक्ष, व्यक्तिगत रूप से देखने पर बल देती है; हिन्दी मुहावरा ‘अपनी आँखों से’ प्रत्यक्षदर्शी होने का यही भाव स्पष्ट करता है।
- source_word: ἔργα
