  text: इसलिए हेलियोदोरुस तुरंत यात्रा पर निकल पड़ा—ऊपरी तौर पर कोइले-सीरिया और फोनीकिया के नगरों का निरीक्षण करने के लिए, पर वास्तव में राजा की योजना को कार्यान्वित करने के लिए।
