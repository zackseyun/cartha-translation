lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह तत्काल और शीघ्र कार्रवाई का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐποιεῖτο τὴν πορίαν
  choice: यात्रा पर निकल पड़ा
  rationale: यूनानी मुहावरे के यात्रा आरम्भ करने वाले प्रसंगगत भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τῇ μὲν ἐμφάσει
  choice: दिखावे के लिए तो
  rationale: यह बाहरी रूप और वास्तविक उद्देश्य के बीच के स्पष्ट विरोध को बनाए रखता है, बिना छल का भाव आवश्यकता से अधिक तीखा किए।
- source_word: ὡς ... ἐφοδεῦσαι
  choice: मानो ... नगरों का निरीक्षण करने जा रहा था
  rationale: ὡς के प्रकट उद्देश्य और ἐφοδεῦσαι के नगरों में जाकर उन्हें देखने या जाँचने के भाव, दोनों को व्यक्त करता है।
- source_word: τὰς κατὰ Κοίλην Συρίαν καὶ Φοινίκην πόλεις
  choice: कोइले-सूरिया और फीनीके के नगरों
  rationale: ऐतिहासिक भौगोलिक नामों को यूनानी रूप के निकट देवनागरी लिप्यंतरण में रखा गया है।
- source_word: τῷ πράγματι δέ
  choice: पर वास्तव में
  rationale: पहले खंड के दिखावे और वास्तविकता के बीच विरोध को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: τὴν ... πρόθεσιν ἐπιτελεῖν
  choice: योजना पूरी करने
  rationale: πρόθεσις यहाँ अभिप्राय या योजना है और ἐπιτελεῖν उसे क्रियान्वित अथवा पूरा करने को दर्शाता है।
- source_word: τοῦ A βασιλέως
  choice: राजा की
  rationale: प्रदत्त पाठ में βασιλέως से पहले आया असंगत ‘A’ अर्थ का भाग नहीं जान पड़ता; स्पष्ट प्रसंगगत अर्थ ‘राजा की’ है और पाठगत समस्या पादटिप्पणी में दर्ज की गई है।
