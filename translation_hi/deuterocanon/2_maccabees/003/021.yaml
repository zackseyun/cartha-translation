- source_word: ἐλεεινή
  choice: सचमुच बड़ा दयनीय था
  rationale: यह विशेषण करुणाजनक और दयनीय दृश्य का भाव व्यक्त करता है। यूनानी के क्रियारहित कथन को स्वाभाविक हिन्दी वाक्य में ढाला गया है।
- source_word: τοῦ πλήθους
  choice: भीड़ का
  rationale: πλῆθος यहाँ एकत्र जनसमूह को दर्शाता है; ‘भीड़’ आधुनिक और सहज हिन्दी है।
- source_word: παμμιγῆ
  choice: एक साथ
  rationale: यह शब्द पूरे मिले-जुले जनसमूह की सामूहिक दशा पर बल देता है। प्रसंग में ‘एक साथ’ उस व्यापक, साझा प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρόπτωσιν
  choice: मुँह के बल गिर पड़ना
  rationale: शब्द का मूल चित्र आगे की ओर गिरने या भूमि पर पड़ जाने का है। यह अनुवाद शारीरिक मुद्रा को बनाए रखता है और उसे केवल भावनात्मक ‘टूट पड़ने’ तक सीमित नहीं करता।
- source_word: τοῦ μεγάλως ἀγωνιῶντος ἀρχιερέως
  choice: घोर व्याकुलता में पड़े महायाजक की
  rationale: ἀγωνιάω तीव्र चिंता और मानसिक संताप बताता है, जबकि μεγάλως उसकी तीव्रता बढ़ाता है; ‘घोर व्याकुलता’ दोनों का संयुक्त भाव देता है।
- source_word: προσδο-
  choice: प्रतीक्षा
  rationale: दिया गया यूनानी पाठ προσδο- पर कट गया है। यह संभवतः προσδοκία जैसे ‘प्रतीक्षा/आशंका भरी प्रतीक्षा’ अर्थ वाले शब्द का आरम्भ है; इसलिए ‘प्रतीक्षा’ सबसे संयत चयन है और अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
