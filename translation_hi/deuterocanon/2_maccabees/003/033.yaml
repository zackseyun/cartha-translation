  yaml_path: translation/deuterocanon/2_maccabees/003/033.yaml
  text: And while the high priest was making atonement[a], the same young men appeared again to Heliodorus, clothed in the same garments, and standing there they said, “Give many thanks to Onias the high priest, for because of him the Lord has graciously granted you your life.”
translation:
  language: hi
  text: जब महायाजक प्रायश्चित्त कर रहा था[a], तब वही युवक फिर हेलियोदोरुस को उन्हीं वस्त्रों में सजे हुए दिखाई दिए। वे खड़े हुए और बोले, “महायाजक ओनियास का बहुत आभार मानो, क्योंकि उसी के कारण प्रभु ने अनुग्रहपूर्वक तुम्हें जीवन प्रदान किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रायश्चित्त-विधि कर रहा था”; अधिक तकनीकी रूप में, “दोष-निवारण कर रहा था” अथवा “तुष्टीकरण कर रहा था।”
    reason: ἱλασμός के प्रायश्चित्त, दोष-निवारण और तुष्टीकरण संबंधी अर्थ-क्षेत्र को दिखाना।
lexical_decisions:
- source_word: ποιουμένου ... τὸν ἱλασμόν
  choice: प्रायश्चित्त-विधि कर रहा था
  rationale: यह पदबंध प्रायश्चित्त से जुड़ा धार्मिक अनुष्ठान संपन्न करने को दर्शाता है। ‘प्रायश्चित्त-विधि’ सामान्य पाठक के लिए बोधगम्य रहते हुए इसके अनुष्ठानिक अर्थ को सुरक्षित रखता है।
- source_word: οἱ αὐτοὶ νεανίαι
  choice: वे ही युवक
  rationale: νεανίαι का स्वाभाविक आधुनिक हिन्दी रूप ‘युवक’ है और ‘वे ही’ पहले प्रकट हुए उन्हीं व्यक्तियों से स्पष्ट संबंध बनाए रखता है।
- source_word: ἐν ταῖς αὐταῖς ἐσθήσεσιν ἐστολισμένοι
  choice: उसी वेशभूषा में सजे हुए
  rationale: यह अनुवाद समान वस्त्रों और सज्जित होने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: στάντες
  choice: उन्होंने खड़े होकर
  rationale: यूनानी कृदंत केवल उनके खड़े होने की मुद्रा बताता है; स्थान या निकटता की अतिरिक्त सूचना नहीं जोड़ी गई।
- source_word: Πολλὰ ... χάριτας ἔχε
  choice: बहुत आभार मानो
  rationale: यूनानी मुहावरा गहरी कृतज्ञता रखने या व्यक्त करने का आदेश देता है। ‘बहुत आभार मानो’ बल को बनाए रखते हुए सहज हिन्दी है।
- source_word: διὰ γὰρ αὐτὸν
  choice: क्योंकि उसी के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है; ‘उसी के कारण’ αὐτόν के बल को भी बनाए रखता है।
- source_word: σοὶ κεχάρισται τὸ ζῆν
  choice: अनुग्रह करके तुम्हें जीवित रहने दिया है
  rationale: κεχάρισται में कृपापूर्वक प्रदान करने का भाव है और τὸ ζῆν का सीधा अर्थ जीवित रहना है। यह हिन्दी अनुवाद दोनों अर्थों को स्पष्ट रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: धार्मिक संदर्भ में κύριος का प्रतिष्ठित और स्वाभाविक हिन्दी रूप ‘प्रभु’ है।
theological_decisions:
- issue: मंदिर-संदर्भ में ἱλασμός का अनुष्ठानिक और धर्मवैज्ञानिक अर्थ
  choice: प्रायश्चित्त-विधि
  alternative: प्रायश्चित्त; दोष-निवारण की विधि; तुष्टीकरण
  rationale: मुख्य पाठ का चयन पाप या दोष के निवारण और याजकीय अनुष्ठान, दोनों को व्यक्त करता है, पर किसी एक विशिष्ट प्रायश्चित्त-सिद्धांत को आरोपित नहीं करता।
- issue: κεχάρισται में अनुग्रह का भाव
  choice: अनुग्रह करके ... जीवित रहने दिया
  alternative: जीवन प्रदान किया; कृपा करके जीवित रखा
  rationale: यह केवल अनुमति नहीं, बल्कि कृपापूर्वक जीवन प्रदान किए जाने का भाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। नामों को यूनानी रूप के निकट ‘हेलियोदोरुस’ और ‘ओनियास’ लिखा गया है। मूल में στάντες के साथ केवल ‘खड़े होकर’ है, इसलिए ‘उसके पास’ या ‘वहाँ’ जैसी अतिरिक्त स्थान-सूचना नहीं जोड़ी गई।
