base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/016.yaml
  text: To see the appearance of the high priest was enough to wound the mind[b][a]; for his face and altered color made visible the agony in his soul.
translation:
  language: hi
  text: महायाजक का रूप देखकर किसी का भी मन घायल हो जाता था[a], क्योंकि उसका चेहरा और बदला हुआ रंग उसकी आत्मा की घोर व्यथा[b] प्रकट कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन बिंध जाता था” अथवा “मन व्यथित हो जाता था।” यूनानी में घायल करने की क्रिया देखने वाले पर पड़े प्रभाव के लिए रूपक के रूप में प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आत्मा के अनुसार की व्यथा,” अर्थात उसकी आत्मा की भीतरी व्यथा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ὁρῶντα
  choice: देखकर किसी का भी
  rationale: यूनानी की अनेकार्थी और संक्षिप्त रचना देखने वाले किसी भी व्यक्ति पर पड़ने वाले प्रभाव को बताती है। यह चयन उसके सामान्य, अनिर्दिष्ट भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἰδέαν
  choice: रूप
  rationale: यहाँ शब्द महायाजक के दिखाई देने वाले स्वरूप या दशा की ओर संकेत करता है। ‘रूप’ संक्षिप्त और स्वाभाविक है तथा केवल चेहरे तक सीमित नहीं है।
- source_word: τιτρώσκεσθαι τὴν διάνοιαν
  choice: मन घायल हो जाता था
  rationale: मूल क्रिया सचमुच घायल करने के लिए प्रयुक्त होती है और यहाँ देखने वाले पर पड़े मानसिक प्रभाव का रूपक है। ‘मन’ διάνοια के विचार और अंतर्बोध से जुड़े अर्थ को बनाए रखता है।
- source_word: ὄψις
  choice: चेहरा
  rationale: बदले हुए रंग के साथ प्रयुक्त होने के कारण यहाँ दृश्य मुखाकृति अभिप्रेत है; ‘चेहरा’ आधुनिक हिन्दी में इसे ठोस और स्पष्ट बनाता है।
- source_word: χρόας παρηλλαγμένον
  choice: बदला हुआ रंग
  rationale: χρόα देह या मुख के रंग को और παρηλλαγμένον उसके बदल जाने को बताता है। अनुवाद यह निर्धारित नहीं करता कि रंग किस प्रकार बदला था।
- source_word: ἐνέφαινεν
  choice: प्रकट कर रहे थे
  rationale: क्रिया का अर्थ भीतर की बात को बाहरी चिह्नों द्वारा दिखाना या स्पष्ट करना है। संयुक्त कर्ता के अनुरूप हिन्दी में बहुवचन रखा गया है।
- source_word: τὴν κατὰ ψυχὴν ἀγωνίαν
  choice: उसकी आत्मा की घोर व्यथा
  rationale: ἀγωνία तीव्र संताप, संघर्ष या व्याकुलता बताता है और ψυχή व्यक्ति के भीतरी जीवन को। यह अनुवाद मूल की तीव्रता और आत्मिक भाषा दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ψυχή की मानव-स्वरूप संबंधी भाषा
  choice: आत्मा
  alternative: अंतरतम / भीतरी अस्तित्व
  rationale: इस प्रसंग में ψυχή महायाजक के भीतर अनुभव की जा रही व्यथा को दर्शाता है। ‘आत्मा’ स्रोत की धार्मिक और मानव-स्वरूप संबंधी प्रतिध्वनि को बनाए रखता है, पर पद स्वयं मनुष्य की संरचना पर कोई तकनीकी सिद्धांत स्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मन घायल’ मूल के सजीव रूपक को सुरक्षित रखता है; ‘आत्मा की घोर व्यथा’ भीतरी संताप को बिना किसी विशिष्ट सांप्रदायिक मानव-विज्ञान के व्यक्त करता है।
