base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/032.yaml
  text: But the high priest[a], becoming suspicious that the king might perhaps suppose that some wrongdoing against Heliodorus had been carried out by the Jews, offered a sacrifice for the man's recovery.
translation:
  language: hi
  text: पर प्रधान याजक को यह आशंका हुई कि कहीं राजा यह न समझ बैठे कि यहूदियों ने हेलियोदोरुस के विरुद्ध कोई दुष्कर्म किया है; इसलिए उसने उस व्यक्ति के स्वस्थ होने[a] के लिए बलिदान चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस व्यक्ति के छुटकारे के लिए’ अथवा ‘उस व्यक्ति के उद्धार के लिए।’ यूनानी शब्द σωτηρία का अर्थ बचाव, रक्षा या उद्धार भी हो सकता है; यहाँ संभवतः हेलियोदोरुस के शारीरिक रूप से स्वस्थ होने की बात है।
    reason: मूल यूनानी शब्द की व्यापक अर्थ-सीमा और इस संदर्भ में उसके सबसे संभावित शारीरिक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ὕποπτος ... γενόμενος
  choice: को यह आशंका हुई
  rationale: संदर्भ में प्रधान याजक स्वयं संदेह के घेरे में नहीं आता, बल्कि उसे इस बात की आशंका होती है कि राजा क्या निष्कर्ष निकालेगा। यह प्रयोग उस भययुक्त चिंता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μή ποτε
  choice: कहीं ... न
  rationale: यह यूनानी पदबंध किसी आशंकित संभावना को प्रस्तुत करता है; हिन्दी में ‘कहीं ... न’ उसका स्वाभाविक और सटीक रूप है।
- source_word: διάλημψιν
  choice: समझ बैठे
  rationale: यहाँ भाव उस धारणा या निष्कर्ष का है जो राजा बना सकता था। ‘समझ बैठे’ में अनुमान के साथ उसके भूलपूर्ण या अवांछित होने की आशंका भी स्वाभाविक रूप से आती है।
- source_word: κακουργίαν τινά
  choice: कोई दुष्कर्म
  rationale: ‘दुष्कर्म’ नैतिक और संभावित आपराधिक गलत काम, दोनों का भाव रखता है, और τινά की अनिश्चितता ‘कोई’ से बनी रहती है।
- source_word: περὶ τὸν Ἡλιόδωρον
  choice: हेलियोदोरुस के विरुद्ध
  rationale: κακουργία और पूर्ण किए जाने की क्रिया के साथ यह वाक्यांश हेलियोदोरुस को लक्ष्य बनाकर किए गए गलत काम को दर्शाता है।
- source_word: συντετελέσθαι
  choice: किया है
  rationale: यूनानी पूर्ण infinitive पहले ही संपन्न हो चुके कार्य को व्यक्त करता है। आशंकित अप्रत्यक्ष कथन में हिन्दी का ‘किया है’ इसे सहज रूप से संप्रेषित करता है।
- source_word: προσήγαγε θυσίαν
  choice: बलिदान चढ़ाया
  rationale: यह बलिदान अर्पित करने के लिए प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: ὑπὲρ τῆς ... σωτηρίας
  choice: के स्वस्थ होने के लिए
  rationale: तात्कालिक कथा-संदर्भ हेलियोदोरुस की शारीरिक दशा और पुनःस्थापना से संबंधित है। ‘स्वस्थ होने’ से प्रमुख संदर्भ स्पष्ट होता है, जबकि व्यापक अर्थ-पटल पादटिप्पणी में सुरक्षित है।
- source_word: τοῦ ἀνδρός
  choice: उस व्यक्ति के
  rationale: यह पद हेलियोदोरुस की ओर संकेत करता है और यूनानी में उपस्थित संज्ञा को केवल सर्वनाम में बदलने के बजाय व्यक्त करता है।
theological_decisions:
- issue: दैवी दंड के बाद पुनःस्थापना के संदर्भ में σωτηρία का अर्थ
  choice: शारीरिक रूप से स्वस्थ होना
  alternative: छुटकारा, रक्षा अथवा उद्धार
  rationale: निकटवर्ती कथा हेलियोदोरुस की शारीरिक विपत्ति और बहाली से जुड़ी है, इसलिए मुख्य पाठ में ‘स्वस्थ होना’ सबसे संभावित अर्थ है। फिर भी σωτηρία के व्यापक उद्धारात्मक अर्थों को पादटिप्पणी में रखा गया है ताकि शब्द की वास्तविक अर्थ-सीमा समाप्त न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘प्रधान याजक’, ‘दुष्कर्म’ और ‘बलिदान चढ़ाया’ जैसे पद सामान्य पाठक के लिए बोधगम्य रहते हुए धार्मिक-ऐतिहासिक संदर्भ के अनुकूल हैं। पादटिप्पणी चिह्न [a] मुख्य पाठ में उसी पद के बाद रखा गया है जिससे वह संबंधित है।
