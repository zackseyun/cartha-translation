translation:
  language: hi
  text: और घरों से लोग टोली-टोली में सभी लोगों की सार्वजनिक विनती करने के लिए तेजी से बाहर निकल रहे थे, क्योंकि उस स्थान[a] के तिरस्कार का पात्र बनने में अब देर नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मंदिर-परिसर; यूनानी पाठ में केवल ‘स्थान’ है।
    reason: मूल शब्द τόπος सामान्य है, यद्यपि प्रसंग में उसका संकेत मंदिर-परिसर की ओर है।
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῶν οἰκιῶν
  choice: और घरों से लोग
  rationale: यह पद घरों में रहने वालों के सामूहिक रूप से बाहर निकलने को बताता है। यूनानी में ‘अपने’ स्पष्ट नहीं है, इसलिए अनावश्यक संबंधसूचक शब्द नहीं जोड़ा गया।
- source_word: ἀγεληδὸν
  choice: झुंडों में
  rationale: क्रियाविशेषण सामूहिक रूप से दल-दल बाहर आने का सजीव भाव देता है। हिन्दी में ‘झुंडों में’ इस चित्रात्मकता को बनाए रखता है और प्रसंग में स्वाभाविक है।
- source_word: ἐξεπήδων
  choice: दौड़े चले आ रहे थे
  rationale: अपूर्ण भूतकाल लगातार हो रही गतिविधि दिखाता है, और क्रिया में तेजी से बाहर निकलने का भाव है। यह अनुवाद उसकी तात्कालिकता और गतिशीलता व्यक्त करता है।
- source_word: ἐπὶ πανδήμῳ ἱκετείᾳ
  choice: समस्त जनता की विनती में सम्मिलित होने के लिए
  rationale: πανδήμῳ पूरे जनसमुदाय की सहभागिता बताता है और ἱκετείᾳ दीन तथा गंभीर प्रार्थनापूर्ण विनती। यह रूप हिन्दी में उद्देश्य और सामुदायिक आयाम दोनों स्पष्ट करता है।
- source_word: διὰ τὸ μὴ μέλλειν
  choice: क्योंकि ... अब शीघ्र ही ... होने वाला था
  rationale: यहाँ μή के साथ μέλλειν को विलंब न रहने, अर्थात संकट के आसन्न होने, के अर्थ में समझा गया है। ‘अब शीघ्र ही’ नकारात्मक यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
- source_word: εἰς καταφρόνησιν ἔρχεσθαι
  choice: अपमानित होने वाला था
  rationale: शाब्दिक भाव ‘तिरस्कार में आना’ है; प्रसंग में इसका आशय उस पवित्र स्थान के अनादर या अपमान का पात्र बनने से है। ‘अपमानित होना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὸν τόπον
  choice: वह स्थान
  rationale: यूनानी पाठ केवल ‘स्थान’ कहता है। संकेतवाचक ‘वह’ पहले से चर्चित स्थान की ओर इंगित करता है, जबकि अधिक स्पष्ट ‘मन्दिर’ को मुख्य पाठ में जोड़ने से बचता है।
theological_decisions:
- issue: τὸν τόπον का अभिप्रेत स्थान
  choice: मुख्य पाठ में ‘वह स्थान’, जिसे प्रसंग से मन्दिर-परिसर समझा जाता है
  alternative: मन्दिर; पवित्रस्थान
  rationale: निकटवर्ती प्रसंग यरूशलेम के मन्दिर को सूचित करता है, पर यूनानी यहाँ मन्दिर के लिए विशिष्ट शब्द के बजाय सामान्य τόπος का प्रयोग करता है। इसलिए मूल की शब्दगत व्यापकता मुख्य पाठ में रखी गई और अभिप्राय पादटिप्पणी में स्पष्ट किया गया।
- issue: μὴ μέλλειν में नकार और आसन्नता
  choice: ‘अब शीघ्र ही ... होने वाला था’
  alternative: ‘... होने में अब देर नहीं थी’; शाब्दिक रूप से ‘... होने में विलंब नहीं होने वाला था’
  rationale: μή को अनदेखा नहीं किया गया, बल्कि μέλλω के ‘विलंब करना’ संबंधी भाव के साथ पढ़कर आसन्न संकट व्यक्त किया गया है। इससे मूल की तनावपूर्ण अभिव्यक्ति स्वाभाविक हिन्दी में बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक धार्मिक संकट के अनुरूप रखी गई है। ‘विनती’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘समस्त जनता’ πανδήμῳ के नगरव्यापी सामुदायिक स्वर को व्यक्त करता है।
