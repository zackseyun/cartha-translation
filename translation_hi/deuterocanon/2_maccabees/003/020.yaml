  text: And all of them[a], stretching out their hands toward heaven[b], were making supplication.
translation:
  language: hi
  text: और वे सभी[a] अपने हाथ स्वर्ग की ओर फैलाकर विनती[b] कर रही थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात सभी स्त्रियाँ; यूनानी में ‘सभी’ स्त्रीलिंग बहुवचन है और सम्भवतः पिछले प्रसंग में उल्लिखित स्त्रियों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी शब्द का अर्थ आग्रहपूर्ण प्रार्थना या विनती है; इससे बाद के कलीसियाई अर्थ में किसी निश्चित ‘लितानी’ का संकेत आवश्यक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαι
  choice: वे सभी
  rationale: स्त्रीलिंग बहुवचन रूप निकटवर्ती प्रसंग की स्त्रियों की ओर संकेत करता है। ‘वे सभी’ सहज हिन्दी है और स्त्रीलिंग क्रिया ‘कर रही थीं’ इस संकेत को बनाए रखती है।
- source_word: προτείνουσαι
  choice: फैलाकर
  rationale: यह कृदन्त हाथ आगे या ऊपर की ओर बढ़ाने का भाव देता है; प्रार्थना के प्रसंग में ‘हाथ ... फैलाकर’ स्वाभाविक हिन्दी है।
- source_word: τὰς χεῖρας
  choice: अपने हाथ
  rationale: यूनानी में निश्चित उपपद है, पर शरीर के अंग के साथ हिन्दी में आत्मवाचक संबंधसूचक ‘अपने’ अधिक स्वाभाविक है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर
  rationale: εἰς दिशा व्यक्त करता है। प्रार्थना के प्रसंग में οὐρανός केवल भौतिक आकाश नहीं, परमेश्वर की ओर उन्मुख स्वर्ग का बोध कराता है।
- source_word: ἐποιοῦντο
  choice: कर रही थीं
  rationale: अपूर्ण भूतकाल चल रही क्रिया को दर्शाता है; हिन्दी का अपूर्ण पक्ष इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: τὴν λιτανείαν
  choice: विनती
  rationale: यह शब्द गंभीर और आग्रहपूर्ण प्रार्थना या याचना का अर्थ देता है। ‘विनती’ सामान्य आधुनिक हिन्दी में स्पष्ट है और बाद की कलीसियाई ‘लितानी’ जैसी निश्चित विधि का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: प्रार्थना के संकेत में οὐρανός का अनुवाद
  choice: स्वर्ग
  alternative: आकाश
  rationale: हाथ उठाकर विनती करने का प्रसंग परमेश्वर की ओर प्रार्थनापूर्वक उन्मुख होने का है; इसलिए ‘स्वर्ग’ प्रसंगानुकूल है, जबकि ‘आकाश’ केवल दृश्य नभ का बोध करा सकता है।
- issue: πᾶσαι के स्त्रीलिंग संकेत को व्यक्त करना
  choice: ‘वे सभी’ के साथ स्त्रीलिंग क्रिया ‘कर रही थीं’
  alternative: सभी स्त्रियाँ
  rationale: मूल में संज्ञा दोहराई नहीं गई, पर विशेषण स्त्रीलिंग बहुवचन है और पिछले प्रसंग की स्त्रियों को इंगित करता है। चुना हुआ रूप मूल की संक्षिप्तता और उसके स्त्रीलिंग संकेत दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कर रही थीं’ मूल के स्त्रीलिंग बहुवचन और जारी क्रिया—दोनों को व्यक्त करता है।
