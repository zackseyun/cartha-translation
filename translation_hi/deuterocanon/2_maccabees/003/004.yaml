  text: But a certain Simon[a], of the tribe of Benjamin, having been appointed overseer of the temple, was at odds with the high priest about the administration of the market in the city.
translation:
  language: hi
  text: परन्तु बिन्यामीन गोत्र का शमौन नामक एक व्यक्ति, जो मंदिर का निरीक्षक नियुक्त किया गया था, नगर में बाज़ार के प्रशासन को लेकर महायाजक के साथ मतभेद रखता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προστάτης
  choice: निरीक्षक
  rationale: यह शब्द किसी वस्तु या संस्था पर नियुक्त पर्यवेक्षी और संरक्षक भूमिका को दर्शाता है। मंदिर के प्रशासनिक सन्दर्भ में ‘निरीक्षक’ स्वाभाविक है और इसे याजकीय पद नहीं बनाता।
- source_word: τοῦ ἱεροῦ
  choice: मंदिर का
  rationale: ἱερόν सामान्यतः केवल भीतरी पवित्रस्थान नहीं, बल्कि मंदिर-परिसर को सूचित करता है; इसलिए ‘मंदिर’ स्पष्ट और सटीक है।
- source_word: καθεσταμένος
  choice: नियुक्त किया गया था
  rationale: कृदन्त किसी पद पर विधिवत स्थापित किए जाने की स्थिति व्यक्त करता है; ‘नियुक्त’ उस आधिकारिक भाव को सहज हिन्दी में रखता है।
- source_word: διηχθῆναι
  choice: मतभेद रखता था
  rationale: सन्दर्भ में यह महायाजक के साथ विवाद या अनबन को व्यक्त करता है। ‘मतभेद रखता था’ संघर्ष को कम करके मिटाता नहीं, पर खुली शत्रुता भी नहीं जोड़ता।
- source_word: ἀρχιερεῖ
  choice: महायाजक
  rationale: यह यहूदी धार्मिक पद के लिए मानक और सन्दर्भानुकूल हिन्दी शब्द है।
- source_word: ἀγορανομίας
  choice: बाज़ार के प्रबन्ध
  rationale: यह संज्ञा बाज़ार से जुड़ी नागरिक देखरेख, व्यवस्था और नियमन को सूचित करती है। ‘बाज़ार का प्रबन्ध’ सामान्य पाठक के लिए बोधगम्य है और प्रशासनिक अर्थ बनाए रखता है।
- source_word: κατὰ τὴν πόλιν
  choice: नगर में
  rationale: यह पद बाज़ार-प्रबन्ध के कार्यक्षेत्र को नगर में स्थित करता है; ‘नगर में’ यूनानी की स्थानवाचक व्यापकता को बनाए रखता है।
theological_decisions:
- issue: मंदिर के सम्बन्ध में शमौन के पद का स्वरूप
  choice: शमौन को विधिवत नियुक्त मंदिर-निरीक्षक के रूप में प्रस्तुत किया गया है, किसी याजकीय पदाधिकारी के रूप में नहीं।
  alternative: उसे व्यापक आश्रयदाता या मंदिर के ‘रक्षक’ के रूप में समझना।
  rationale: προστάτης ... καθεσταμένος एक नियुक्त पर्यवेक्षी भूमिका पर बल देता है। पद स्वयं शमौन को याजक नहीं ठहराता, इसलिए अनुवाद ऐसा कोई धार्मिक पद नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’, ‘गोत्र’, ‘मंदिर’ और ‘महायाजक’ बाइबलीय सन्दर्भ के अनुरूप परिचित शब्द हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए मुख्य कथन ‘मतभेद रखता था’ के रूप में रखा गया है।
