  yaml_path: translation/deuterocanon/2_maccabees/003/009.yaml
  text: And when he arrived in Jerusalem and was courteously received by the high priest of the city[a], he reported the manifestation that had taken place, explained for what reason he was present, and inquired whether these things were truly so.
translation:
  language: hi
  text: जब वह यरूशलेम पहुँचा और नगर के महायाजक ने उसका आदरपूर्वक स्वागत किया, तब उसने उस सूचना के सामने आने के बारे में बताया,[a] और स्पष्ट किया कि वह वहाँ किस उद्देश्य से आया था। फिर उसने पूछा कि क्या ये बातें सचमुच ऐसी ही हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस प्रकटीकरण के बारे में जो हुआ था।” यूनानी शब्द किसी बात के प्रकट होने, प्रकट किए जाने, या जानकारी दिए जाने का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενηθεὶς
  choice: जब वह ... पहुँचा
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी उपवाक्य के रूप में रखा गया है और आगमन का भाव सुरक्षित है।
- source_word: φιλοφρόνως ... ἀποδεχθεὶς
  choice: आदरपूर्वक स्वागत किया
  rationale: यह पदबंध मैत्रीपूर्ण और शिष्ट ग्रहण किए जाने को व्यक्त करता है; हिन्दी में यह औपचारिक कथात्मक शैली के अनुकूल है।
- source_word: ἀνέθετο
  choice: बताया
  rationale: संदर्भ में हेलियोदोरस महायाजक के सामने पहले प्राप्त सूचना का विवरण रखता है; ‘बताया’ सहज है और औपचारिक प्रस्तुति का अर्थ समेटता है।
- source_word: περὶ τοῦ γεγονότος ἐμφανισμοῦ
  choice: उस सूचना के विषय में ... जो प्रकट की गई थी
  rationale: संदर्भ राजकोष के बारे में पहले किए गए प्रकटीकरण या सूचना का है। यह अनुवाद ἐμφανισμός के ‘प्रकट करना/जानकारी देना’ अर्थ को रखता है और अनावश्यक रूप से अलौकिक प्रकट होने का संकेत नहीं देता।
- source_word: καί τινος ἕνεκεν πάρεστι
  choice: कि वह किस उद्देश्य से वहाँ आया है
  rationale: शाब्दिक ‘किस कारण उपस्थित है’ की अपेक्षा यह हिन्दी में स्वाभाविक है और उसके आने के प्रयोजन को स्पष्ट करता है।
- source_word: διεσάφησεν
  choice: स्पष्ट किया
  rationale: क्रिया का अर्थ किसी बात को साफ या सुस्पष्ट करना है।
- source_word: ἐπυνθάνετο
  choice: पूछा
  rationale: यह पूछताछ या जानकारी लेने का भाव देता है; ‘पूछा’ आधुनिक सामान्य हिन्दी में सहज है।
- source_word: ταῖς ἀληθείαις ... οὕτως ἔχοντα
  choice: क्या ये बातें सचमुच ऐसी ही हैं
  rationale: यूनानी मुहावरे का तथ्यात्मक सत्यापन वाला भाव सरल और सटीक हिन्दी में व्यक्त होता है।
