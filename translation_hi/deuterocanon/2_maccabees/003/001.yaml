lexical_decisions:
- source_word: Τῆς ἁγίας πόλεως κατοικουμένης μετὰ πάσης εἰρήνης
  choice: जब पवित्र नगर में पूरी शांति थी
  rationale: शाब्दिक रूप से नगर के ‘बसे हुए’ होने की अवस्था व्यक्त की गई है; आधुनिक हिन्दी में इस प्रसंग का स्वाभाविक आशय ‘नगर में पूरी शांति थी’ से स्पष्ट होता है और πάσης की व्यापकता भी बनी रहती है।
- source_word: τῶν νόμων
  choice: नियमों
  rationale: यूनानी में बहुवचन है; ‘नियमों’ से अनेक विधिक आदेशों का संकेत स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ὅτι κάλλιστα
  choice: सर्वोत्तम रीति से
  rationale: यह κάλλιστα के अतिशयोक्तिपरक बल को बनाए रखता है; ‘बहुत अच्छी तरह’ भी संभव है और उसे पादटिप्पणी में दिया गया है।
- source_word: συντηρουμένων
  choice: पालन किया जा रहा था
  rationale: नियमों के संदर्भ में ‘पालन करना’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है और यूनानी के जारी निष्क्रिय भाव को सुरक्षित रखता है।
- source_word: διὰ τὴν Ὀνίου τοῦ ἀρχιερέως
  choice: महायाजक ओनियास के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण प्रकट करता है। उपलब्ध अंश और परामर्श-पाठ के अनुरूप ओनियास को इस स्थिति का कारण बताया गया है।
theological_decisions:
- issue: ओनियास से जुड़े διά का कारणवाचक अर्थ और उसका दायरा
  choice: नियमों के उत्तम पालन को महायाजक ओनियास के कारण हुई स्थिति के रूप में प्रस्तुत किया गया है।
  alternative: ‘महायाजक ओनियास के द्वारा’
  rationale: कर्मकारक के साथ διά का सामान्य अर्थ ‘के कारण’ है। निकटतम वाक्यांश से जोड़ना यूनानी क्रम के अनुकूल है और ओनियास की भूमिका के विषय में पाठ से आगे कोई धार्मिक दावा नहीं करता।
