  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। वाक्य स्रोत-अंश की तरह अल्पविराम पर समाप्त होता है, क्योंकि दिया गया यूनानी पाठ भी आगे जारी रहने वाला आश्रित वाक्यांश है।
