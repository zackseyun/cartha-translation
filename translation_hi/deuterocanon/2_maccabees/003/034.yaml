  yaml_path: translation/deuterocanon/2_maccabees/003/034.yaml
  text: But you[a], having been scourged from heaven, proclaim to all the majestic power of God. And when they had said these things[b], they became invisible.
translation:
  language: hi
  text: पर तुम[a], स्वर्ग से कोड़े खाकर, सब लोगों के सामने परमेश्वर की महान सामर्थ्य का प्रचार करो। ये बातें कहकर वे अदृश्य हो गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तुम’ एकवचन है और हेलियोदोरुस को संबोधित करता है।
    reason: referent_clarification
  - marker: b
    text: या, “वे गायब हो गए” अथवा “वे दृष्टि से ओझल हो गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμαστιγωμένος
  choice: कोड़े खाकर
  rationale: पूर्ण निष्क्रिय कृदंत पहले हो चुकी कठोर शारीरिक मार को दर्शाता है। ‘कोड़े खाकर’ आधुनिक हिन्दी में स्पष्ट और प्रभावशाली है।
- source_word: ἐξ οὐρανοῦ
  choice: स्वर्ग से
  rationale: मूल पदबंध दंड के स्वर्गीय स्रोत को व्यक्त करता है; अनुवाद ‘परमेश्वर द्वारा’ जोड़कर निहित कर्ता को स्पष्ट नहीं करता।
- source_word: διάγγελλε
  choice: प्रचार करो
  rationale: आज्ञार्थक क्रिया सार्वजनिक रूप से व्यापक घोषणा करने का भाव रखती है; ‘प्रचार करो’ हिन्दी में स्वाभाविक है।
- source_word: πᾶσι
  choice: सब लोगों में
  rationale: यह घोषणा के व्यापक श्रोता-वर्ग को दर्शाता है और διάγγελλε के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: τὸ μεγαλεῖον ... κράτος
  choice: महिमामयी सामर्थ्य
  rationale: यह रूप μεγαλεῖον के वैभव/महानता और κράτος की प्रबल सामर्थ्य—दोनों को संक्षिप्त, गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἀφανεῖς ἐγένοντο
  choice: अदृश्य हो गए
  rationale: यह यूनानी के शाब्दिक भाव ‘दिखाई न देने वाले हो गए’ को सुरक्षित रखता और अलौकिक प्रसंग को बनाए रखता है।
theological_decisions:
- issue: हेलियोदोरुस को मिले दंड में निहित कर्तृत्व
  choice: ‘स्वर्ग से’ को ज्यों का त्यों बनाए रखना
  alternative: ‘स्वर्ग से परमेश्वर द्वारा’ अथवा ‘स्वर्ग द्वारा’
  rationale: यूनानी पाठ स्रोत को स्पष्ट करता है, पर सीधे ‘परमेश्वर द्वारा’ नहीं कहता; इसलिए निहित दिव्य कर्तृत्व का विस्तार नहीं किया गया।
- issue: स्वर्गीय व्यक्तियों का अलौकिक प्रस्थान
  choice: ‘अदृश्य हो गए’
  alternative: ‘गायब हो गए’ अथवा ‘दृष्टि से ओझल हो गए’
  rationale: मूल अभिव्यक्ति केवल चले जाने के बजाय दिखाई न देने की अवस्था पर बल देती है; शाब्दिक स्वरूप कथानक की अलौकिकता को बिना अलंकरण बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘कोड़े खाकर’ शारीरिक दंड की तीव्रता स्पष्ट करता है; ‘महिमामयी सामर्थ्य’ मूल के महानता और शक्ति संबंधी संयुक्त भाव को बनाए रखता है।
