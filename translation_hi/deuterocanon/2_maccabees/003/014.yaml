  text: After setting a day[a], he went in to arrange the examination concerning these matters; and there was no small anxiety throughout the whole city.
translation:
  language: hi
  text: एक दिन निश्चित करके वह इन बातों के संबंध में जाँच की व्यवस्था करने के लिए भीतर गया; और पूरे नगर में व्याकुलता कुछ कम न थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “व्याकुलता थोड़ी नहीं थी”; यह अल्पोक्ति पूरे नगर में फैली भारी व्याकुलता को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενος ἡμέραν
  choice: एक दिन निश्चित करके
  rationale: अओरिस्ट मध्यवाची कृदंत दिन या समय ठहराने को व्यक्त करता है। अनिश्चित ἡμέραν के कारण ‘एक दिन’ रखा गया है; ‘निश्चित करके’ आधुनिक हिन्दी में औपचारिक नियुक्ति का भाव स्वाभाविक रूप से देता है।
- source_word: εἰσῄει
  choice: वह भीतर गया
  rationale: अपूर्ण भूतकालीन क्रिया प्रवेश की गति बताती है। कथा-प्रवाह में ‘भीतर गया’ सहज है और केवल ‘प्रवेश किया’ से अधिक स्पष्ट रूप से दिशा का भाव रखता है।
- source_word: τὴν περὶ τούτων ἐπίσκεψιν
  choice: इन बातों के संबंध में जाँच
  rationale: ἐπίσκεψις यहाँ मंदिर के धन से जुड़ी आधिकारिक जाँच या निरीक्षण है। ‘जाँच’ प्रशासनिक पड़ताल का भाव देता है और περὶ τούτων को स्पष्ट रूप से बनाए रखता है।
- source_word: οἰκονομήσων
  choice: व्यवस्था करने के लिए
  rationale: 'भविष्यकालीन कृदंत उद्देश्य प्रकट करता है: वह जाँच को व्यवस्थित या संचालित करने के इरादे से भीतर गया। ‘व्यवस्था करने के लिए’ इस प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है।'
- source_word: οὐ μικρὰ
  choice: कुछ कम न थी
  rationale: यूनानी का अल्पोक्ति-प्रयोग अक्षुण्ण रखा गया है। हिन्दी में यह वाक्यांश स्वाभाविक रहते हुए व्याकुलता की तीव्रता पर बल देता है।
- source_word: καθʼ ὅλην τὴν πόλιν
  choice: पूरे नगर में
  rationale: κατά के वितरणात्मक भाव और ὅλην के समग्र बल, दोनों को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀγωνία
  choice: व्याकुलता
  rationale: यह आसन्न जाँच के कारण फैली तीव्र सामूहिक चिंता और बेचैनी को व्यक्त करता है; ‘व्याकुलता’ शारीरिक पीड़ा का अनावश्यक अर्थ जोड़े बिना उस तीव्रता को बनाए रखता है।
