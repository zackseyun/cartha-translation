base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/030.yaml
  text: And they were blessing the Lord[a], who was glorifying his own place; and the temple, which a little earlier had been full of fear and turmoil, was filled with joy and gladness when the Almighty Lord appeared.
translation:
  language: hi
  text: तब वे प्रभु को धन्य कह रहे थे, जो अपने ही स्थान को महिमामंडित कर रहा था; और वह मंदिर, जो थोड़ी ही देर पहले भय और हलचल से भरा था, सर्वशक्तिमान प्रभु के प्रकट होने[a] पर आनंद और हर्ष से भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को प्रकट करने पर।” यूनानी शब्द विशेष रूप से ईश्वरीय प्रकटन से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγουν
  choice: धन्य कह रहे थे
  rationale: अपूर्ण भूतकाल क्रिया जारी या बार-बार की जा रही प्रतिक्रिया को दिखाती है। ‘धन्य कह रहे थे’ प्रभु को प्रत्यक्ष कर्म के रूप में रखते हुए इस अवधि-बोध को सुरक्षित रखता है।
- source_word: παραδοξάζοντα
  choice: महिमामंडित कर रहा था
  rationale: यह असामान्य क्रिया प्रभु द्वारा अपने स्थान की महिमा प्रदर्शित और प्रतिष्ठित करने को व्यक्त करती है। चुना हुआ रूप महिमा से जुड़े मूल भाव को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: τὸν ἑαυτοῦ τόπον
  choice: अपने ही स्थान को
  rationale: τόπος का मूल अर्थ ‘स्थान’ है। अगले खंड में ‘मंदिर’ इसकी पहचान स्पष्ट कर देता है, इसलिए अधिक विशिष्ट ‘पवित्रस्थान’ जोड़ना आवश्यक नहीं है।
- source_word: δέους καὶ ταραχῆς γέμον
  choice: भय और हलचल से भरा था
  rationale: δέος के भय और ταραχή के अशांति या उथल-पुथल के भाव को सामान्य आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἱερόν
  choice: मंदिर
  rationale: यह शब्द सामान्यतः केवल भीतरी पवित्रस्थान नहीं, बल्कि मंदिर-परिसर को सूचित करता है; ‘मंदिर’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: τοῦ παντοκράτορος ... κυρίου
  choice: सर्वशक्तिमान प्रभु
  rationale: παντοκράτωρ के सर्वसामर्थ्य के भाव और κύριος की ईश्वरीय उपाधि, दोनों को संक्षिप्त और प्रचलित रूप में सुरक्षित रखता है।
- source_word: ἐπιφανέντος
  choice: प्रकट होने
  rationale: सम्बन्धकारक निरपेक्ष रचना उस अवसर को बताती है जिस पर मंदिर की दशा बदली। ‘प्रकट होने’ वास्तविक ईश्वरीय प्रकटन को सीधे व्यक्त करता है और उसके स्वरूप के बारे में अतिरिक्त अनुमान नहीं जोड़ता।
- source_word: χαρᾶς καὶ εὐφροσύνης ἐπληροῦτο
  choice: आनंद और हर्ष से भर गया
  rationale: दोनों समानार्थक किन्तु अलग संज्ञाओं की जोड़ी को बनाए रखता है और पूर्ववर्ती भय तथा हलचल के साथ स्पष्ट विरोध प्रस्तुत करता है।
theological_decisions:
- issue: παραδοξάζοντα τὸν ἑαυτοῦ τόπον में मंदिर के प्रति ईश्वरीय कार्य
  choice: प्रभु अपने ही स्थान को महिमामंडित कर रहा था
  alternative: प्रभु अपने स्थान को अद्भुत बना रहा था / उसकी महिमा प्रकट कर रहा था
  rationale: यह रूप मंदिर के ईश्वरीय सम्मान और समर्थन की बात को सुरक्षित रखता है, पर हस्तक्षेप की रीति को अधिक स्पष्ट करके मूल की अर्थ-सीमा नहीं घटाता।
- issue: ἐπιφανέντος κυρίου का बल
  choice: सर्वशक्तिमान प्रभु के प्रकट होने पर
  alternative: सर्वशक्तिमान प्रभु के अपने को प्रकट करने पर
  rationale: मूल पाठ घटना को वास्तविक ईश्वरीय प्रकटन के रूप में प्रस्तुत करता है। यह अनुवाद उस दावे को न तो केवल अदृश्य प्रबंध तक सीमित करता है, न उसमें अनावश्यक तकनीकी धर्मवैज्ञानिक भाषा जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘धन्य कह रहे थे’ ने εὐλόγουν का जारी क्रिया-भाव और बाइबिलीय अर्थ सुरक्षित रखा है। मंदिर का ‘भय’ और फिर ‘आनंद’ से भरना मूल पाठ के भावात्मक मानवीकरण के अनुसार ज्यों का त्यों रखा गया है।
