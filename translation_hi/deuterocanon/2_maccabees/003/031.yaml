  yaml_path: translation/deuterocanon/2_maccabees/003/031.yaml
  text: But quickly some of Heliodorus's companions were urging Onias to call upon the Most High and grant life to the one who was lying at his last breath[a][b].
translation:
  language: hi
  text: परन्तु तुरन्त ही हेलियोदोरुस के कुछ साथी ओनियास से आग्रह कर रहे थे कि वह परमप्रधान को पुकारे[a] और उस व्यक्ति को जीवन प्रदान करे जो मृत्यु की अंतिम साँस पर पड़ा हुआ था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमप्रधान का आह्वान करे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस व्यक्ति को जो पूरी तरह अंतिम साँस पर पड़ा हुआ था,” अर्थात जो मृत्यु के कगार पर था।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταχὺ
  choice: तुरन्त ही
  rationale: यह क्रियाविशेषण तत्काल और शीघ्र प्रतिक्रिया को व्यक्त करता है; आधुनिक हिन्दी में ‘तुरन्त ही’ प्रसंग की तात्कालिकता को स्वाभाविक ढंग से रखता है।
- source_word: τινες τῶν τῷ Ἡλιοδώρῳ συνηθῶν
  choice: हेलियोदोरुस के कुछ साथियों
  rationale: συνήθων निकट संगति या परिचय रखने वालों को दर्शाता है; ‘साथियों’ सहज है और केवल औपचारिक सहयोगियों तक अर्थ को सीमित नहीं करता।
- source_word: ἠξίουν
  choice: आग्रह किया
  rationale: अपूर्णकालीन यूनानी रूप लगातार या जोर देकर किए गए निवेदन का संकेत देता है; हिन्दी में ‘आग्रह किया’ कथात्मक प्रवाह के साथ उस बल को व्यक्त करता है।
- source_word: ἐπικαλέσασθαι τὸν ὕψιστον
  choice: परमप्रधान को पुकारे
  rationale: धार्मिक संदर्भ में ἐπικαλέομαι प्रार्थनापूर्वक पुकारने का अर्थ देता है; ‘परमप्रधान’ यूनानी दैवी उपाधि का मानक और संक्षिप्त रूप है।
- source_word: τὸ ζῆν χαρίσασθαι
  choice: जीवन प्रदान करे
  rationale: χαρίζομαι कृपापूर्वक देने या प्रदान करने का भाव रखता है; ‘जीवन प्रदान करे’ जीवन को दिए गए वरदान के रूप में बनाए रखता है।
- source_word: τῷ παντελῶς ἐν ἐσχάτῃ πνοῇ κειμένῳ
  choice: उस व्यक्ति को ... जो अपनी आखिरी साँसें गिन रहा था
  rationale: यह स्वाभाविक हिन्दी मुहावरा मृत्यु के बिल्कुल निकट पड़े होने की स्थिति व्यक्त करता है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दैवी उपाधि τὸν ὕψιστον का अनुवाद
  choice: परमप्रधान
  alternative: सर्वोच्च परमेश्वर
  rationale: ‘परमप्रधान’ उपाधि-रूप को बनाए रखता है और मूल में अनुपस्थित ‘परमेश्वर’ शब्द नहीं जोड़ता।
- issue: ओनियास द्वारा जीवन प्रदान करने की व्याकरणिक रचना
  choice: कि वह परमप्रधान को पुकारे और ... जीवन प्रदान करे
  alternative: कि वह परमप्रधान से पुकारकर उस व्यक्ति को जीवन देने की विनती करे
  rationale: यूनानी में दोनों infinitives ओनियास पर निर्भर प्रतीत होते हैं, जिससे शाब्दिक रूप से जीवन प्रदान करने का कर्ता ओनियास रहता है। वैकल्पिक रूप धार्मिक आशय स्पष्ट करता, पर मूल की व्याकरणिक और धर्मवैचारिक तनाव को हल कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों को प्रचलित हिन्दी बाइबिलीय शैली में लिप्यंतरित किया गया है। मुख्य वाक्य में मूल की यह संभावित अस्पष्टता सुरक्षित है कि ‘जीवन प्रदान करे’ का व्याकरणिक कर्ता ओनियास है।
