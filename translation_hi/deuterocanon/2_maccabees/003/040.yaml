    reason: मूल यूनानी में हेलियोदोरुस से संबंधित घटनाओं/मामले तथा कोषागार की रखवाली के लिए सामूहिक या अधिक संक्षिप्त हिन्दी अभिव्यक्ति संभव है; ἐχώρησεν का अर्थ “हुआ,” “आगे बढ़ा,” या “परिणत हुआ” हो सकता है।
lexical_decisions:
- source_word: τὰ ... καθʼ Ἡλιόδωρον
  choice: हेलियोदोरुस से जुड़ी घटना
  rationale: नपुंसकलिंग बहुवचन का यह मुहावरा हेलियोदोरुस से संबंधित घटनाक्रम या मामले को समेटता है। हिन्दी में एकवचन सामूहिक अभिव्यक्ति अध्याय के समापन-सार के लिए स्वाभाविक है।
- source_word: γαζοφυλακίου
  choice: भण्डार
  rationale: यह शब्द यहाँ मन्दिर के धन अथवा उस धन को रखने के कक्ष को सूचित करता है। ‘भण्डार’ संक्षिप्त है और संदर्भ में दोनों पहलुओं को खुला रखता है।
- source_word: τήρησιν
  choice: सुरक्षा
  rationale: यह संज्ञा रखवाली, संरक्षण या सुरक्षित रखे जाने का भाव देती है। ‘सुरक्षा’ आधुनिक हिन्दी में स्वाभाविक रूप से सक्रिय संरक्षण व्यक्त करती है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह पिछले वर्णन की ओर संकेत करते हुए प्रसंग का समापन करता है; ‘इस प्रकार’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: ἐχώρησεν
  choice: घटित हुआ
  rationale: कथात्मक सार में क्रिया का अर्थ किसी मामले का आगे बढ़ना, इस तरह होना या परिणत होना है। ‘घटित हुआ’ पूर्ववर्णित घटनाक्रम का निष्पक्ष सार देता है।
