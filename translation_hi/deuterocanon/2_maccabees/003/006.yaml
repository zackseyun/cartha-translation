base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/006.yaml
  text: And he reported that the treasury in Jerusalem was full of immense sums of money[a], so that the quantity of the separate funds was beyond counting, and that they were not connected with the account of the sacrifices[c][b], but that it was possible for these things to fall under the king’s authority.
translation:
  language: hi
  text: और उसने सूचना दी कि यरूशलेम का भंडार अथाह धनराशियों से भरा हुआ था, यहाँ तक कि विभिन्न जमा राशियों की संख्या अनगिनत थी[a]; और वे बलिदानों के लेखे से संबद्ध नहीं थीं[b], बल्कि उनका राजा के अधिकार में आना संभव था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विभिन्न जमा राशियों की मात्रा अपरिमेय थी।” यूनानी पद भंडार में सौंपी गई अलग-अलग राशियों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ये राशियाँ बलिदानों के नियमित लेखे या उनके खर्च की मद में नहीं थीं।
    reason: lexical_alternative
  - marker: c
    text: या, “ये राजा के नियंत्रण में आ सकती थीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήγγειλεν
  choice: उसने यह सूचना दी
  rationale: क्रिया किसी व्यक्ति तक समाचार या सूचना पहुँचाने को व्यक्त करती है; कथा-संदर्भ में यह स्वाभाविक और तटस्थ है।
- source_word: χρημάτων ἀμυθήτων
  choice: अथाह धन
  rationale: χρήματα यहाँ धन-संपत्ति को और ἀμύθητος ऐसी विशाल मात्रा को दर्शाता है जिसका सहज अनुमान या वर्णन न हो सके।
- source_word: γαζοφυλάκιον
  choice: भंडार
  rationale: यह शब्द धन और बहुमूल्य वस्तुएँ रखने के स्थान को सूचित करता है। मंदिर-संदर्भ में ‘भंडार’ सहज और व्यापक रूप से बोधगम्य है।
- source_word: τὸ πλῆθος τῶν διαφόρων
  choice: अलग-अलग जमा राशियों की मात्रा
  rationale: διαφόρων संभवतः भंडार में रखी विभिन्न या पृथक राशियों की ओर संकेत करता है; ‘जमा राशियाँ’ entrusted funds की सम्भावना को स्पष्ट रखता है, बिना उनके स्वामित्व का निर्णय किए।
- source_word: ἀναρίθμητον
  choice: गिनती से परे
  rationale: यह विशेषण अगणनीयता व्यक्त करता है; यह हिन्दी प्रयोग मूल के अतिशयोक्तिपूर्ण बल को स्वाभाविक रूप में बनाए रखता है।
- source_word: μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον
  choice: यह धन बलिदानों के हिसाब से संबंधित नहीं है
  rationale: προσήκειν संबंध या प्रयोज्यता और λόγος यहाँ हिसाब, लेखे या प्रशासनिक मद का अर्थ दे सकता है। अनुवाद केवल इतना कहता है कि धन बलिदानों के हिसाब का भाग नहीं था।
- source_word: ὑπὸ τὴν τοῦ βασιλέως ἐξουσίαν πεσεῖν
  choice: इसे राजा के अधिकार में लाया जा सकता है
  rationale: यह मुहावरा किसी के अधिकार, नियंत्रण या अधीनता में आने को व्यक्त करता है। कर्मवाच्य हिन्दी यहाँ सम्भावना और राजनीतिक आशय दोनों को स्पष्ट रखती है।
- source_word: ταῦτα
  choice: इसे
  rationale: नपुंसकलिंग बहुवचन सर्वनाम पहले उल्लिखित धनराशियों की ओर लौटता है; हिन्दी में सामूहिक ‘धन’ के अनुसार एकवचन सर्वनाम स्वाभाविक है।
theological_decisions:
- issue: मंदिर के धन का स्वरूप
  choice: धन को बलिदानों के हिसाब से अलग बताया गया है, पर उसकी समस्त पवित्र संबद्धता का निषेध नहीं किया गया।
  alternative: इसे पूरी तरह लौकिक निजी जमा धन या वैध रूप से जब्त की जा सकने वाली संपत्ति मानना।
  rationale: यूनानी पाठ केवल यह कहता है कि ये राशियाँ ‘बलिदानों के हिसाब’ से संबंधित नहीं थीं। इससे आगे बढ़कर उनके धार्मिक दर्जे या राजा द्वारा उन्हें लेने की वैधता का निर्णय करना पाठ में निहित तनाव को अनावश्यक रूप से समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट। वाक्य ने मूल यूनानी की रिपोर्ट-रचना और धन के धार्मिक दर्जे तथा राजकीय दावे के बीच मौजूद अस्पष्टता को बनाए रखा है।
