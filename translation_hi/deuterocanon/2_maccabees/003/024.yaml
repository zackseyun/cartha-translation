base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/024.yaml
  text: But when he had already arrived there with the guards at the treasury[a], the Sovereign of spirits and of all authority made a great manifestation, so that all who had dared to come in, struck with awe at the power of God[c][b], were turned to weakness and fear.
translation:
  language: hi
  text: पर जब वह अपने पहरेदारों[a] के साथ वहाँ भंडारगृह में पहुँच चुका था, तब आत्माओं और समस्त अधिकार के अधिपति ने एक महान प्राकट्य किया[b]। इससे जितने लोगों ने भीतर आने का दुस्साहस किया था[c], वे परमेश्वर की सामर्थ्य से स्तब्ध होकर निर्बलता और भय की दशा में पड़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहरेदारों’ का यूनानी शब्द शाब्दिक रूप से ‘भाला ढोने वालों’ को दर्शाता है; इसका अनुवाद ‘अंगरक्षकों’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक अनुवाद: ‘एक महान प्राकट्य किया’; यूनानी पद किसी प्रभावशाली ईश्वरीय प्रकट होने पर बल देता है।'
    reason: lexical_alternative
  - marker: c
    text: ‘भीतर आने’ का अर्थ अधिक सामान्य रूप से ‘एकत्र होने’ भी हो सकता है, पर निकटवर्ती प्रसंग भंडारगृह के क्षेत्र में प्रवेश का संकेत देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτόθι
  choice: वहाँ
  rationale: यह पहले बताए गए स्थान की ओर संकेत करने वाला स्वाभाविक स्थानवाचक क्रियाविशेषण है।
- source_word: δορυφόροις
  choice: पहरेदारों
  rationale: शाब्दिक अर्थ ‘भाला ढोने वाले’ है, पर प्रसंग में सशस्त्र अंगरक्षकों या पहरेदारों का बोध है; ‘पहरेदार’ आधुनिक हिन्दी में कार्य को स्पष्ट करता है।
- source_word: γαζοφυλάκιον
  choice: भंडारगृह
  rationale: मंदिर की बहुमूल्य निधि रखे जाने के स्थान के लिए ‘भंडारगृह’ सहज और व्यापक रूप से समझ में आने वाला शब्द है।
- source_word: ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: आत्माओं और समस्त अधिकार के अधिपति
  rationale: ‘अधिपति’ δυνάστης की शासकीय प्रभुता व्यक्त करता है, जबकि ‘समस्त अधिकार’ πάσης ἐξουσίας की व्यापकता और मूल की अमूर्त संज्ञा को बनाए रखता है।
- source_word: ἐπιφάνειαν μεγάλην ἐποίησεν
  choice: अपना महान प्रताप प्रकट किया
  rationale: यह असाधारण ईश्वरीय प्रकटन को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है; वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: κατατολμήσαντας συνελθεῖν
  choice: भीतर आने का दुस्साहस कर चुके थे
  rationale: κατατολμάω साहस की निंदात्मक छाया देता है; तत्काल प्रसंग में συνελθεῖν का आशय भंडारगृह के क्षेत्र में प्रवेश करना जान पड़ता है, यद्यपि व्यापक अर्थ संभव है।
- source_word: καταπλαγέντας τὴν τοῦ θεοῦ δύναμιν
  choice: परमेश्वर की सामर्थ्य से आतंकित होकर
  rationale: καταπλήσσω यहाँ ईश्वरीय सामर्थ्य से उत्पन्न तीव्र स्तब्धता और भय दर्शाता है; ‘आतंकित’ परिणाम को स्पष्ट रखता है।
- source_word: εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι
  choice: निर्बल और भयभीत हो गए
  rationale: 'परिणामी दशा को सहज हिन्दी में व्यक्त करता है: ἔκλυσις शिथिलता/निर्बलता और δειλία भय या कायरता का भाव रखता है।'
theological_decisions:
- issue: ईश्वरीय उपाधि ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: आत्माओं और समस्त अधिकार के अधिपति
  alternative: आत्माओं और सारी सामर्थ्य के प्रभु
  rationale: मूल में κύριος नहीं बल्कि δυνάστης है, इसलिए ‘अधिपति’ चुना गया। ἐξουσία को ‘अधिकार’ कहना शासनाधिकार के अर्थ को बचाता है और उसे केवल बल या सामर्थ्य तक सीमित नहीं करता।
- issue: ἐπιφάνεια में ईश्वरीय प्रकटन का स्वर
  choice: अपना महान प्रताप प्रकट किया
  alternative: एक महान प्रकटन किया
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए दृश्य और प्रभावशाली दिव्य हस्तक्षेप व्यक्त किया गया है; ‘अपना’ प्रसंगगत है, किसी विशिष्ट अवतार-सिद्धांत को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है। पाठ के सभी पादटिप्पणी-चिह्न [a], [b], [c] मुख्य पाठ में उपस्थित हैं; [a] को उसके संबद्ध शब्द ‘पहरेदारों’ के तुरंत बाद रखना अधिक उपयुक्त होगा—अंतिम प्रकाशन-पाठ में इसका स्थान वहाँ माना जाए।
