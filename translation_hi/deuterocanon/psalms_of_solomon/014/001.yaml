  text: The Lord is faithful to those who love him in truth[a], to those who endure his discipline, to those who walk in the righteousness of his commandments[b], in the law that he commanded us for our life.
translation:
  language: hi
  text: प्रभु उन लोगों के प्रति विश्वासयोग्य है जो उससे सच्चाई से प्रेम करते हैं, जो उसके अनुशासन[a] को धीरज से सहते हैं, और जो उसकी आज्ञाओं के अनुरूप धार्मिकता[b] में चलते हैं—उस व्यवस्था में जिसकी आज्ञा उसने हमें हमारे जीवन के लिए दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिक्षा’ अथवा ‘प्रशिक्षण।’ यूनानी शब्द παιδεία में शिक्षा, प्रशिक्षण, सुधार और अनुशासन के अर्थ शामिल हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς
  choice: विश्वासयोग्य
  rationale: यहाँ विधेय विशेषण प्रभु की भरोसेमंदी और अपने लोगों के प्रति अटल निष्ठा व्यक्त करता है; ‘विश्वासयोग्य’ स्वाभाविक और धर्मवैचारिक भार वाला हिन्दी रूप है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यह यहूदी-यूनानी भक्तिपरक संदर्भ में परमेश्वर की उपाधि है; ‘प्रभु’ मानक और गरिमापूर्ण रूप है।
- source_word: ἀγαπῶσιν
  choice: प्रेम करते हैं
  rationale: क्रिया का सीधा अर्थ प्रेम करना है और यह वाचा-संबंधी भाव को भी बनाए रखता है।
- source_word: ἐν ἀληθείᾳ
  choice: सच्चाई से
  rationale: यह हिन्दी में स्वाभाविक ढंग से सत्यता और निष्कपटता दोनों का नैतिक-धार्मिक भाव रखता है, बिना इसे केवल भावनात्मक ईमानदारी तक सीमित किए।
- source_word: ὑπομένουσιν
  choice: धीरज से सहते हैं
  rationale: यह कठिनाई के अधीन टिके रहने और दृढ़तापूर्वक सहने का भाव स्पष्ट करता है।
- source_word: παιδείαν
  choice: अनुशासन
  rationale: यह सुधारात्मक शिक्षा, प्रशिक्षण और ताड़ना की व्यापक धारणा को समेटता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: πορευομένοις
  choice: चलते हैं
  rationale: यह आचरण के लिए प्रयुक्त बाइबिलीय रूपक को सुरक्षित रखता है और हिन्दी में समझने योग्य है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: संदर्भ परमेश्वर की आज्ञाओं के अनुसार सीधे आचरण का है; ‘धार्मिकता’ इस नैतिक-धार्मिक अर्थ को बनाए रखती है।
- source_word: προσταγμάτων
  choice: आज्ञाओं
  rationale: ‘आज्ञाएँ’ भक्तिपरक शैली के अनुकूल है और परमेश्वर द्वारा दिए गए निर्देशों का अधिकारपूर्ण स्वर व्यक्त करता है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: दैवी आदेश के संदर्भ में ‘व्यवस्था’ νόμος का स्थापित बाइबिलीय हिन्दी रूप है और केवल सामान्य कानूनी विधान से अधिक व्यापक अर्थ देता है।
- source_word: εἰς ζωὴν ἡμῶν
  choice: हमारे जीवन के लिए
  rationale: एकवचन ζωή के सामुदायिक अर्थ को सुरक्षित रखते हुए यह व्यवस्था के जीवनोन्मुख प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसकी आज्ञाओं की धार्मिकता’ और ‘उसकी धार्मिक आज्ञाओं’ के बीच संबंध
  choice: उसकी आज्ञाओं की धार्मिकता में
  alternative: उसकी धार्मिक आज्ञाओं के अनुसार
  rationale: यूनानी δικαιοσύνῃ προσταγμάτων αὐτοῦ में संबंध कुछ असामान्य और अर्थगत रूप से खुला है। चुना हुआ रूप मूल की संज्ञात्मक बनावट और संभावित तनाव को बचाता है; विकल्प अर्थ को अधिक सहज बनाता, पर व्याख्यात्मक रूप से ‘धार्मिक’ को आज्ञाओं का विशेषण बना देता।
- issue: व्यवस्था और पूर्ववर्ती पदबंध का वाक्यगत संबंध
  choice: दीर्घ विराम के बाद समानांतर/व्याख्यात्मक पदबंध
  alternative: आज्ञाओं की धार्मिकता को सीधे ‘व्यवस्था’ के साथ जोड़ना
  rationale: ἐν νόμῳ पिछले ‘में चलते हैं’ को आगे स्पष्ट कर सकता है, पर उसका सटीक संबंध पूर्णतः निश्चित नहीं है। दीर्घ विराम मूल की पुनरुक्त, व्याख्यात्मक गति को बनाए रखता है और संबंध को अत्यधिक निश्चित नहीं करता।
