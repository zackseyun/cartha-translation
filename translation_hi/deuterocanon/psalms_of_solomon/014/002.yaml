base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/002.yaml
  text: The holy ones of the Lord will live in him forever[a]; the paradise of the Lord, the trees of life[c][b], are his holy ones.
translation:
  language: hi
  text: प्रभु के पवित्र जन[a] उसमें सदा जीवित रहेंगे[b]; प्रभु का स्वर्गोद्यान—जीवन के वृक्ष[c]—उसके पवित्र जन हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र जन’ का अनुवाद ‘भक्त जन’ या ‘धर्मनिष्ठ जन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसमें’ का संकेत पिछले पद की ‘व्यवस्था’ की ओर हो सकता है—अर्थात वे उसके अनुसार जीवित रहेंगे—या इसे ‘प्रभु में’ भी समझा जा सकता है।
    reason: referential_ambiguity
  - marker: c
    text: यूनानी में ‘जीवन के वृक्ष’ बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: पवित्र जन
  rationale: यह ὅσιος के धार्मिक पवित्रता और भक्तिपूर्ण निष्ठा—दोनों भावों को समेटता है तथा किसी बाद की विशिष्ट कलीसियाई पदावली को अनावश्यक रूप से नहीं जोड़ता।
- source_word: Κυρίου / τοῦ κυρίου
  choice: प्रभु / प्रभु का
  rationale: κύριος का स्वाभाविक और प्रतिष्ठित हिन्दी रूप; दोनों प्रयोगों में एकरूपता रखी गई है।
- source_word: ζήσονται
  choice: जीवित रहेंगे
  rationale: ζάω के भविष्यकाल को सहज हिन्दी में व्यक्त करता है और निरंतर जीवन के भाव को εἰς τὸν αἰῶνα के साथ स्पष्ट बनाता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: 'यूनानी सर्वनाम का लिंग हिन्दी में प्रकट न करके वास्तविक संदर्भगत अस्पष्टता सुरक्षित रखी गई है: यह निकटवर्ती व्यापक प्रसंग में ‘व्यवस्था’ की ओर अथवा इसी पद में ‘प्रभु’ की ओर संकेत समझा जा सकता है।'
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: मुहावरेदार हिन्दी में अनंत अवधि का संक्षिप्त और स्वाभाविक रूप।
- source_word: παράδεισος
  choice: स्वर्गोद्यान
  rationale: ‘उद्यान’ से अधिक उन्नत और युगांत-संबंधी अनुगूँज बनाए रखता है, साथ ही आधुनिक हिन्दी पाठक के लिए बोधगम्य है।
- source_word: τὰ ξύλα τῆς ζωῆς
  choice: जीवन के वृक्ष
  rationale: τὰ ξύλα स्पष्टतः बहुवचन है; इसलिए उत्पत्ति की परिचित एकवचन छवि के दबाव में इसे ‘जीवन का वृक्ष’ नहीं किया गया।
- source_word: ὅσιοι αὐτοῦ
  choice: उसके पवित्र जन
  rationale: पहले पदबंध की शब्दावली दोहराकर निर्बंध द्वितीय उपवाक्य का रूपकात्मक परिचय सुरक्षित रखा गया है।
theological_decisions:
- issue: ἐν αὐτῷ का पूर्वगामी
  choice: मुख्य पाठ में लिंग-निरपेक्ष ‘उसमें’ रखकर अस्पष्टता सुरक्षित की गई।
  alternative: ‘उसके द्वारा/उसके अनुसार’ (व्यवस्था के संदर्भ में) अथवा ‘उसमें’ को स्पष्टतः प्रभु-संबंधी समझना।
  rationale: यूनानी रूप अपने आप पूर्वगामी का निर्णायक निर्धारण नहीं करता। पिछले पद की ‘व्यवस्था’ और इसी पद के ‘प्रभु’—दोनों की संभावना को हिन्दी सर्वनाम स्वाभाविक रूप से खुला रखता है; इस प्रकार न व्यवस्था के अनुसार जीने का भाव मिटता है, न प्रभु में जीवन की संभावित व्याख्या थोपी जाती है।
- issue: दूसरे उपवाक्य की रूपकात्मक शक्ति
  choice: ‘प्रभु का स्वर्गोद्यान—जीवन के वृक्ष—उसके पवित्र जन हैं’ के रूप में परिचयात्मक कथन।
  alternative: स्वर्गोद्यान पवित्र जनों का है; अथवा पवित्र जन स्वर्गोद्यान में हैं।
  rationale: यूनानी में तीन कर्ताकारक पदबंध बिना व्यक्त क्रिया के साथ रखे गए हैं। ‘हैं’ जोड़ना हिन्दी व्याकरण की आवश्यकता है और पवित्र जनों को स्वर्गोद्यान तथा जीवन के वृक्षों से रूपकतः अभिन्न बताने वाला काव्यात्मक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वर्गोद्यान’ काव्यात्मक तथा युगांत-संबंधी स्वर बनाए रखता है। डैश दूसरे अर्धपद की समानाधिकरणात्मक रूपक-रचना स्पष्ट करता है।
