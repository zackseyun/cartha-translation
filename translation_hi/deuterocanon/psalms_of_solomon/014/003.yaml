base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/003.yaml
  text: Their planting is rooted forever[a]; they will not fail all the days of heaven[d][c][b], because Israel is the portion and inheritance of God.
translation:
  language: hi
  text: उनकी पौध सदा के लिए जड़ पकड़ चुकी है; वे आकाश के सभी दिनों तक[a] समाप्त नहीं होंगे[b], क्योंकि इस्राएल परमेश्वर का भाग और विरासत है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आकाश के सभी दिन” वर्तमान आकाशीय व्यवस्था की पूरी अवधि के लिए प्रयुक्त एक शाब्दिक अभिव्यक्ति है।
    reason: cultural_note
  - marker: b
    text: या “वे मिट नहीं जाएँगे” अथवा “उनका अंत नहीं होगा।” यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ है और स्थायी बने रहने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεία
  choice: पौध
  rationale: यह शब्द लगाई हुई वनस्पति अथवा रोपण को दर्शाता है। “पौध” कृषि-संबंधी रूपक को बनाए रखता है और यह अनावश्यक रूप से तय नहीं करता कि संकेत स्वयं लोगों की ओर है या उनके स्थायी रूप से बसाए जाने की ओर।
- source_word: ἐρριζωμένη
  choice: जड़ पकड़ चुकी है
  rationale: पूर्ण निष्क्रिय कृदंत एक स्थापित और बनी रहने वाली अवस्था पर बल देता है। यह चुनाव पौध के रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: इस प्रसंग में यह मुहावरा स्थायी बने रहने का भाव देता है; “सदा के लिए” आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: ἐκλήξουσιν
  choice: समाप्त न होंगे
  rationale: दुर्लभ क्रिया का मूल भाव रुक जाने, मिट जाने या अंत हो जाने का है। “समाप्त न होंगे” आधुनिक हिन्दी में अस्तित्व के अंत न होने का आशय स्पष्ट करता है; संबंधित विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: πάσας τὰς ἡμέρας τοῦ οὐρανοῦ
  choice: आकाश के सभी दिनों तक
  rationale: उन्नत और असामान्य मूल अभिव्यक्ति को निकटता से रखा गया है, बजाय इसे तुरंत अधिक व्याख्यात्मक “जब तक आकाश बना रहे” में बदलने के।
- source_word: μερὶς
  choice: भाग
  rationale: यह आवंटित हिस्से या विशेष अधिकार के भाव को रखता है और विरासत के साथ स्वाभाविक युग्म बनाता है।
- source_word: κληρονομία
  choice: विरासत
  rationale: यह उत्तराधिकार, धरोहर और अधिकारगत संपत्ति की बाइबलीय अर्थछाया को बनाए रखता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का
  rationale: सम्बन्धकारक को सीधे स्वामित्व-सूचक रूप में अनूदित किया गया है।
theological_decisions:
- issue: इस्राएल की सामूहिक पहचान परमेश्वर के भाग और विरासत के रूप में
  choice: इस्राएल परमेश्वर का भाग और विरासत है
  alternative: परमेश्वर का भाग और विरासत इस्राएल है
  rationale: यूनानी विधेय-विन्यास दोनों शब्द-क्रमों की अनुमति देता है। चुना हुआ रूप आधुनिक हिन्दी में अधिक स्वाभाविक है और वाचा-संबंधी कथन को बिना किसी अतिरिक्त सिद्धान्तगत व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर पद की काव्यात्मक और गरिमापूर्ण शैली बनाए रखी गई है। “पौध,” “जड़ पकड़ चुकी है” और “आकाश के सभी दिनों” से मूल कृषि तथा कालगत बिंब सुरक्षित रहते हैं।
