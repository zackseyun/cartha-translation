  yaml_path: translation/deuterocanon/psalms_of_solomon/014/005.yaml
  text: And they did not remember God[a], that the ways of men are known before him continually[c][b], and he knows the secrets of the heart before they come to be.
translation:
  language: hi
  text: और उन्होंने यह स्मरण नहीं रखा कि परमेश्वर के सामने मनुष्यों के मार्ग सदा ज्ञात हैं, और वह हृदय की गुप्त बातें[a] उनके होने से पहले ही जानता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हृदय के भीतरी कक्ष’; भावार्थ में, ‘हृदय की गुप्त बातें’।
    reason: lexical_alternative
  - marker: b
    text: 'या ‘उनके उत्पन्न होने से पहले’, ‘उनके घटित होने से पहले’। यूनानी अभिव्यक्ति व्यापक है: ‘होने से पहले’।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν τοῦ θεοῦ
  choice: परमेश्वर को स्मरण नहीं किया
  rationale: यह यूनानी वाक्यांश परमेश्वर को याद रखने या ध्यान में रखने में उनकी नैतिक विफलता व्यक्त करता है। ‘स्मरण नहीं किया’ अर्थ के निकट और हिन्दी बाइबलीय शैली में स्वाभाविक है।
- source_word: ὁδοὶ ἀνθρώπων
  choice: मनुष्यों के मार्ग
  rationale: ‘मार्ग’ शाब्दिक चित्र और जीवन-आचरण के नैतिक अर्थ, दोनों को खुला रखता है; ‘आचरण’ कहना अधिक व्याख्यात्मक होता।
- source_word: γνωσταὶ ἐνώπιον αὐτοῦ διὰ παντός
  choice: उसके सामने सदा ज्ञात हैं
  rationale: यह रूप मनुष्यों के मार्गों के परमेश्वर के सम्मुख निरंतर ज्ञात होने को व्यक्त करता है और ‘उसके सामने’ की उपस्थिति-संबंधी भाषा को बनाए रखता है।
- source_word: ταμεῖα καρδίας
  choice: हृदय की गुप्त बातें
  rationale: ταμεῖα का मूल चित्र भीतरी कक्षों का है, पर यहाँ पात्र के द्वारा उसमें निहित बातों का बोध कराया गया है। ‘गुप्त बातें’ हिन्दी में स्पष्ट है और अगले वाक्यांश ‘उनके होने से पहले’ के साथ तार्किक रूप से जुड़ता है।
- source_word: ἐπίσταται
  choice: वह जानता है
  rationale: क्रिया गहरे या सुनिश्चित ज्ञान को दर्शाती है; ‘जानता है’ इसका सरल और स्वाभाविक हिन्दी समतुल्य है।
- source_word: πρὸ τοῦ γενέσθαι
  choice: उनके होने से पहले
  rationale: यूनानी वाक्यांश व्यापक है और किसी बात के अस्तित्व में आने, घटित होने या मन में उठने तक सीमित नहीं करता। यह अनुवाद उसी व्यापकता को बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में परमेश्वर के पूर्वज्ञान का दायरा
  choice: परमेश्वर हृदय की गुप्त बातों को उनके होने से पहले जानता है।
  alternative: परमेश्वर हृदय के गुप्त विचारों को उनके मन में उठने से पहले, अथवा उनके कार्य में प्रकट होने से पहले जानता है।
  rationale: मूल यूनानी यह निर्धारित नहीं करता कि अभिप्राय केवल विचारों के उठने, योजनाओं के बनने या कर्मों के घटित होने से है। इसलिए अनुवाद व्यापक कथन को बनाए रखता है और किसी बाद की धर्मवैज्ञानिक व्यवस्था को इसमें नहीं जोड़ता।
- issue: ὅτι का संबंध
  choice: ‘यह कि’ द्वारा स्मरण न करने की विषय-वस्तु बताना
  alternative: ‘क्योंकि’ द्वारा कारण बताना
  rationale: संदर्भ में अगला कथन उस सत्य को स्पष्ट करता है जिसे उन्होंने ध्यान में नहीं रखा। हिन्दी में डैश और ‘यह कि’ इस संबंध को स्पष्ट करते हैं, जबकि ‘क्योंकि’ वाक्य के तर्क को अस्वाभाविक बना सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। ‘मार्ग’, ‘स्मरण’ और ‘हृदय’ बाइबलीय प्रतिध्वनि बनाए रखते हैं, जबकि ‘गुप्त बातें’ सामान्य पाठक के लिए रूपक का आशय स्पष्ट करती हैं।
