  source_fidelity: 'The Hindi accurately represents the Greek: the inferential opening, the threefold inheritance (Hades/underworld, darkness, destruction), the future passive ''will not be found,'' and the contrasting inheritance of life are all retained. ‘अधोलोक’ appropriately conveys ᾅδης without importing the later, fuller sense of ‘नरक.’ The ambiguous relation of δικαίων is preserved through the alternative-reading footnote.'
  naturalness: The rendering is fluent, modern standard Hindi with an appropriately dignified scriptural register. ‘विरासत’ / ‘वारिस’ effectively preserves the deliberate inheritance-wordplay in the Greek. ‘आनन्द के साथ’ is natural and communicates ἐν εὐφροσύνῃ well.
  terminology: ‘धर्मी,’ ‘प्रभु,’ and ‘भक्त जन’ are suitable renderings in context. In particular, ‘भक्त जन’ is a defensible, natural rendering of ὅσιοι and avoids conflating it with the more usual equivalent of ἅγιοι (‘पवित्र जन’); that alternative is helpfully retained in a footnote. Footnotes are correctly anchored and relevant.
