base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/006.yaml
  text: Therefore Hades and darkness and destruction are their inheritance[a], and they will not be found in the day of mercy for the righteous[d][c][b]. But the holy ones of the Lord will inherit life in gladness.
translation:
  language: hi
  text: इसलिए अधोलोक[a], अंधकार और विनाश उनकी विरासत हैं, और धर्मियों के लिए दया के दिन[b] वे पाए नहीं जाएँगे। परन्तु प्रभु के भक्त जन[c][d] आनन्द के साथ जीवन के वारिस होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अधोलोक’ से आशय मृतकों का लोक है; यह अनिवार्य रूप से उस अधिक विकसित अर्थ के समान नहीं है जिसे प्रायः ‘नरक’ से व्यक्त किया जाता है।
    reason: cultural_note
  - marker: b
    text: या, “धर्मियों की दया के दिन।” यूनानी वाक्यरचना एक से अधिक अर्थ की अनुमति देती है।
    reason: alternative_reading
  - marker: c
    text: या, “प्रभु के धर्मनिष्ठ जन।”
    reason: lexical_alternative
  - marker: d
    text: या, “प्रभु के पवित्र जन।”
    reason: previous_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κληρονομία
  choice: विरासत
  rationale: यह उत्तराधिकार की मूल छवि को बनाए रखता है और आगे आने वाले κληρονομήσουσιν के साथ शब्दगत संबंध सुरक्षित रखता है।
- source_word: ᾅδης
  choice: अधोलोक
  rationale: यह मृतकों के लोक का संकेत देता है और ‘नरक’ शब्द से जुड़ी बाद की विस्तृत धर्मवैज्ञानिक धारणाएँ पाठ में नहीं जोड़ता।
- source_word: σκότος
  choice: अंधकार
  rationale: यह शब्द का सीधा और सामान्य अर्थ है तथा अधोलोक और विनाश के साथ त्रिक को स्वाभाविक रखता है।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: यह आधुनिक हिन्दी में स्पष्ट है और नाश अथवा बरबादी की प्रबलता को व्यक्त करता है।
- source_word: οὐχ εὑρεθήσονται
  choice: वे पाए नहीं जाएँगे
  rationale: यह यूनानी के भविष्यत् कर्मवाच्य रूप को बनाए रखता है और उस दिन उनके अनुपस्थित अथवा बहिष्कृत पाए जाने की ध्वनि को खुला छोड़ता है।
- source_word: ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: धर्मियों के लिए दया के दिन
  rationale: यह δικαίων को दया पाने वालों के रूप में समझता है, जो संदर्भ के विरोध से मेल खाता है; यूनानी संबंधकारक की दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: ὅσιοι
  choice: भक्त जन
  rationale: ὅσιοι धार्मिक निष्ठा और भक्ति से पहचाने जाने वाले लोगों को दर्शाता है; ‘भक्त जन’ इसे ἅγιοι के सामान्य अनुवाद ‘पवित्र जन’ से अलग रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: Κυρίου
  choice: प्रभु के
  rationale: संबंधकारक को सीधे और स्पष्ट रूप में प्रस्तुत करता है।
- source_word: κληρονομήσουσιν ζωὴν
  choice: जीवन के वारिस होंगे
  rationale: यह विरासत की छवि को दोहराकर दुष्टों की विरासत और प्रभु के भक्तों की विरासत के बीच जानबूझकर रखे गए विरोध को बनाए रखता है।
- source_word: ἐν εὐφροσύνῃ
  choice: आनन्द के साथ
  rationale: यह भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और मूल के उल्लासपूर्ण स्वर को बनाए रखता है।
theological_decisions:
- issue: ᾅδης का आशय
  choice: ‘अधोलोक’ रखा गया है।
  alternative: ‘नरक’, ‘कब्र’ या ‘मृतकों का लोक’।
  rationale: यूनानी शब्द मृतकों के लोक को दर्शा सकता है और अपने आप में ‘नरक’ की बाद की पूर्ण धर्मवैज्ञानिक धारणा को अनिवार्य नहीं करता।
- issue: ἐν ἡμέρᾳ ἐλέους δικαίων में δικαίων का संबंध
  choice: इसे ‘धर्मियों के लिए दया’ समझा गया है।
  alternative: ‘धर्मियों की दया के दिन’।
  rationale: निकट संदर्भ में दण्ड पाने वालों और जीवन के वारिस होने वाले प्रभु के भक्तों का विरोध है, इसलिए धर्मियों को दया के लाभार्थी समझना उपयुक्त है; फिर भी यूनानी व्याकरण दूसरी व्याख्या की अनुमति देता है, जिसे पादटिप्पणी में रखा गया है।
- issue: ὅσιοι की पहचान
  choice: ‘भक्त जन’ रखा गया है।
  alternative: ‘धर्मनिष्ठ जन’, ‘निष्ठावान जन’ या ‘पवित्र जन’।
  rationale: यह शब्द धार्मिक भक्ति और वाचा-निष्ठा का भाव रखता है। ‘भक्त जन’ सामान्य पाठक के लिए स्पष्ट है और ἅγιοι के साथ अनावश्यक समानता से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘विरासत’ और ‘वारिस’ की पुनरावृत्ति मूल के उत्तराधिकार-विषयक विरोध को जानबूझकर बनाए रखती है। ‘भक्त जन’ ὅσιοι की भक्ति और निष्ठा को व्यक्त करता है, जबकि वैकल्पिक पारंपरिक रूप पादटिप्पणियों में दिए गए हैं।
