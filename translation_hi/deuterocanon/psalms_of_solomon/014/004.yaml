  yaml_path: translation/deuterocanon/psalms_of_solomon/014/004.yaml
  text: But not so the sinners and the lawless[a], who loved a day of sharing in their sin; their desire lay in the brevity of corruption,
translation:
  language: hi
  text: पर पापी और व्यवस्था का उल्लंघन करनेवाले ऐसे नहीं हैं—जिन्होंने अपने पाप में सहभागिता के एक दिन को प्रिय जाना; उनकी लालसा सड़न की क्षणभंगुरता में थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सड़न की अल्पता में”; इसका अर्थ “तुच्छ सड़न में” भी हो सकता है।
    reason: μικρότης ‘अल्पता/छोटापन’ को सूचित करता है और इस संदर्भ में अवधि की संक्षिप्तता या गुण की तुच्छता—दोनों की संभावना रखता है।
lexical_decisions:
- source_word: καὶ οὐχ οὕτως
  choice: पर ... ऐसे नहीं हैं
  rationale: यह पिछले पदों में धर्मियों के स्थायित्व के साथ तीखा विरोध प्रकट करता है; ‘पर ... ऐसे नहीं हैं’ स्वाभाविक हिन्दी में उसी विरोध को बनाए रखता है।
- source_word: οἱ ἁμαρτωλοὶ καὶ παράνομοι
  choice: पापी और व्यवस्था का उल्लंघन करनेवाले
  rationale: दोनों यूनानी संज्ञाओं को अलग रखा गया है। ‘व्यवस्था का उल्लंघन करनेवाले’ παράνομοι के विधि-संबंधी नैतिक भाव को स्पष्ट करता है।
- source_word: οἱ ἠγάπησαν ἡμέραν
  choice: उन्होंने ... एक दिन से प्रेम किया
  rationale: असामान्य और संक्षिप्त यूनानी अभिव्यक्ति तथा अनिश्चित एकवचन ‘एक दिन’ को सुरक्षित रखा गया है, ताकि उसके क्षणिक अवधि की ओर संकेत को अनावश्यक रूप से निश्चित न किया जाए।
- source_word: ἐν μετοχῇ ἁμαρτίας αὐτῶν
  choice: अपने पाप में सहभागी होने के
  rationale: μετοχή सहभागिता या हिस्सेदारी बताता है। यह चयन हिन्दी में सहज रहते हुए उनके अपने पाप में भाग लेने का अर्थ बनाए रखता है।
- source_word: ἐν μικρότητι σαπρίας
  choice: सड़न की क्षणभंगुरता में
  rationale: σαπρία की मूल ‘सड़न/क्षय’ की छवि सुरक्षित है। संदर्भ में μικρότης को समय की अल्पता या क्षणभंगुरता समझना पिछले पद के स्थायित्व के विपरीत बैठता है; फिर भी ‘छोटापन/तुच्छता’ की संभावित धारणा पादटिप्पणी में रखी गई है।
- source_word: ἡ ἐπιθυμία αὐτῶν
  choice: उनकी लालसा ... में थी
  rationale: ἐπιθυμία को सामान्य तीव्र इच्छा के अर्थ में ‘लालसा’ कहा गया है; यहाँ यौन अर्थ आरोपित नहीं किया गया।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। कठिन यूनानी वाक्य-विन्यास को पूरी तरह समतल किए बिना पठनीय बनाया गया है और वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
