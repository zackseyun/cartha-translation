lexical_decisions:
- source_word: ἐπικράτησόν μου ... ἀπό
  choice: मुझे ... से रोककर रख
  rationale: ἐπικρατέω का मूल भाव अधिकार या नियंत्रण रखना है; ἀπό के साथ यहाँ प्रार्थना का आशय वक्ता को पाप और प्रलोभन से रोककर सुरक्षित रखने का है। यह हिन्दी में स्वाभाविक है और यूनानी संरचना का बल बनाए रखता है।
- source_word: ἀπὸ ἁμαρτίας πονηρᾶς
  choice: बुरे पाप से
  rationale: ἀπό अलग रखने का भाव देता है और πονηρός पाप की नैतिक बुराई पर बल देता है। ‘बुरे पाप’ मूल विशेषण-संज्ञा संरचना को बनाए रखता है।
- source_word: καὶ ἀπὸ πάσης γυναικὸς πονηρᾶς
  choice: और हर उस बुरी स्त्री से
  rationale: πάσης का व्यापक अर्थ ‘हर’ से व्यक्त होता है; πονηρᾶς के लिए ‘बुरी’ सरल, सीधा और पिछले विशेषण के अनुरूप है। ‘उस’ आगे आने वाले कृदन्तीय वर्णन को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: σκανδαλιζούσης
  choice: जो ... को ठोकर खिलाती है
  rationale: σκανδαλίζω ठोकर या पतन का कारण बनने की छवि रखता है। ‘ठोकर खिलाती है’ उस रूपक और नैतिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: ἄφρονα
  choice: मूर्ख मनुष्य
  rationale: ἄφρων विवेक या बुद्धि से रहित व्यक्ति को दर्शाता है और यहाँ पुल्लिंग एकवचन है; इसलिए ‘मूर्ख मनुष्य’ लिंग और अर्थ दोनों को स्पष्ट रखता है।
