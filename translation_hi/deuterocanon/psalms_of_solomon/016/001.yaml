  text: When my soul was departing from the Lord[c][b][a], I almost slipped in the descent of sleep.
translation:
  language: hi
  text: जब मेरी आत्मा प्रभु से दूर[a] होकर ऊँघने लगी[b], तब मैं नींद की ढलान पर लगभग फिसल पड़ा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु से अलग।”
    reason: alternative_reading
  - marker: b
    text: स्वेट के मुद्रित यूनानी पाठ में यहाँ νυστάξαι, अर्थात “ऊँघने लगी,” है। प्रस्तुत डिजिटल प्रतिलिपि का συστάξαι हो तो अर्थ “अपने को समेटने लगी” हो सकता है।
    reason: textual_variant
  - marker: c
    text: “नींद की ढलान” का अर्थ “नींद का भारीपन” या “नींद की स्तब्धता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ νυστάξαι (प्रस्तुत प्रतिलिपि में συστάξαι)
  choice: जब ... ऊँघने लगी
  rationale: ἐν τῷ के साथ aorist infinitive समय बताता है। स्वेट के मुद्रित पाठ में νυστάξαι (‘ऊँघना, झपकी लेना’) प्रसंग में ὕπνου के साथ स्वाभाविक है; प्रस्तुत डिजिटल प्रतिलिपि का συστάξαι संभवतः पाठ-प्रतिलिपि की त्रुटि है।
- source_word: ψυχήν μου
  choice: मेरी आत्मा
  rationale: ψυχή यहाँ व्यक्ति के भीतरी जीवन को व्यक्त करता है; ‘आत्मा’ काव्यात्मक और भक्तिपरक स्वर बनाए रखता है।
- source_word: ἀπὸ Κυρίου
  choice: प्रभु से दूर
  rationale: ἀπό अलगाव या दूरी सूचित करता है। ‘प्रभु से दूर’ संबंधगत दूरी को स्पष्ट करता है, पर इसे जानबूझकर प्रभु द्वारा भेजी गई नींद नहीं बनाता।
- source_word: παρὰ μικρόν
  choice: लगभग
  rationale: यह यूनानी मुहावरा ‘थोड़े से रह जाना’ अर्थात ‘लगभग’ के अर्थ में है।
- source_word: ὠλίσθησα
  choice: मैं ... फिसल पड़ा
  rationale: क्रिया पाँव फिसलने या संतुलन खोने का सजीव चित्र देती है।
- source_word: ἐν καταφορᾷ ὕπνου
  choice: नींद की ढलान पर
  rationale: καταφορά नीचे की ओर गति, नींद में डूबने, भारीपन या स्तब्धता का बोध करा सकता है। ‘ढलान’ ὠλίσθησα के फिसलने वाले रूपक को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: धार्मिक-काव्यात्मक संदर्भ में κύριος का मानक और संप्रदाय-निरपेक्ष रूप ‘प्रभु’ है।
theological_decisions:
- issue: ἀπὸ Κυρίου को उद्गम के रूप में समझें या प्रभु से अलगाव के रूप में
  choice: 'संबंधगत अलगाव: ‘प्रभु से दूर’'
  alternative: ‘प्रभु से अलग’ अथवा केवल ‘प्रभु से’
  rationale: ἀπό का मूल भाव अलग होना है और निकटवर्ती संकट-वर्णन संबंधगत दूरी के अर्थ से मेल खाता है। फिर भी पादटिप्पणी वैकल्पिक, अधिक शाब्दिक अभिव्यक्ति को खुला रखती है।
- issue: संदिग्ध συστάξαι के बजाय मुद्रित νυστάξαι को आधार बनाना
  choice: ‘ऊँघने लगी’
  alternative: यदि συστάξαι को मूल मानें तो ‘अपने को समेटने/एकत्र करने लगी’
  rationale: स्वेट के मुद्रित पाठ का νυστάξαι नींद के समानांतर पद से पुष्ट होता है। वैकल्पिक प्रतिलिपि को पादटिप्पणी में दर्ज किया गया है ताकि पाठ-संबंधी तनाव छिपे नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नींद की ढलान पर फिसलना’ मूल के संयुक्त काव्यात्मक चित्र को बचाता है; कठिन पाठ और अर्थ-विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
