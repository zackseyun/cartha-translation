  yaml_path: translation/deuterocanon/psalms_of_solomon/016/003.yaml
  text: When my soul was being torn away from the Lord[d][c][b][a], the God of Israel—had not the Lord helped me by his mercy forever.
translation:
  language: hi
  text: जब मेरा प्राण प्रभु, इस्राएल के परमेश्वर, से दूर खींचा जा रहा था[a]—यदि प्रभु ने अपनी करुणा से सदा तक[c] मेरी सहायता न की होती[b]![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मेरा प्राण प्रभु, इस्राएल के परमेश्वर, से दूर ले जाया जा रहा था।”
    reason: lexical_alternative
  - marker: b
    text: या, “यदि प्रभु अपनी करुणा से मेरी सहायता करने न आया होता।”
    reason: lexical_alternative
  - marker: c
    text: “सदा तक” का संबंध या तो विशेष रूप से उसकी करुणा से हो सकता है या सहायता के पूरे कार्य से।
    reason: alternative_reading
  - marker: d
    text: इस पद की शर्तीय बात पिछले पद के विचार को पूरा करती जान पड़ती है; यूनानी पाठ यहाँ पूर्ण विराम लगाता है।
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν τῷ διενεχθῆναι
  choice: जब ... दूर खींचा जा रहा था
  rationale: ἐν के साथ भाववाचक क्रिया यहाँ समय बताती है। निष्क्रिय भाव और संकटपूर्ण ढंग से अलग किए जाने का अर्थ बनाए रखने के लिए यह स्वाभाविक हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: ψυχήν
  choice: मेरा प्राण
  rationale: प्रार्थना के संदर्भ में ψυχή व्यक्ति के जीवन और भीतरी अस्तित्व दोनों का बोध करा सकता है। ‘प्राण’ इस अर्थ-व्याप्ति को संक्षिप्त और गरिमापूर्ण ढंग से रखता है।
- source_word: ἀπὸ Κυρίου θεοῦ Ἰσραήλ
  choice: प्रभु, इस्राएल के परमेश्वर, से
  rationale: ‘इस्राएल के परमेश्वर’ को ‘प्रभु’ का समानाधिकरण मानकर अल्पविरामों से स्पष्ट किया गया है; ἀπό का अलगाव-सूचक अर्थ ‘से’ द्वारा व्यक्त है।
- source_word: εἰ μὴ
  choice: यदि ... न ... होती
  rationale: यह पिछले संकट के विपरीत एक अवास्तविक शर्त प्रस्तुत करता है। हिन्दी का पूर्ण भूतकालिक शर्त-विन्यास इसके बल को बनाए रखता है।
- source_word: ἀντελάβετό μου
  choice: मेरी सहायता ... की होती
  rationale: क्रिया का मूल भाव किसी को थामकर सहारा देना या उसकी सहायता करना है। ‘सहायता करना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τῷ ἐλέει αὐτοῦ
  choice: अपनी करुणा से
  rationale: सम्प्रदान कारक यहाँ साधन बताता है; ‘से’ करुणा को सहायता का माध्यम बनाए रखता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा तक
  rationale: यह कालगत निरंतरता व्यक्त करता है। इसे वाक्य के उत्तरार्ध में रखकर करुणा और सहायता के कार्य—दोनों से इसके सम्भावित संबंध को यथासम्भव खुला रखा गया है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी; यहोवा
  rationale: यूनानी पाठ में κύριος है। ‘प्रभु’ सामान्य, संदर्भानुकूल और किसी विशिष्ट साम्प्रदायिक परंपरा को आरोपित न करने वाला रूप है।
- issue: εἰς τὸν αἰῶνα का संबंध
  choice: ‘सदा तक’ को करुणा और सहायता के बीच ऐसी स्थिति में रखना जिससे संबंध पूरी तरह निश्चित न हो
  alternative: ‘अपनी सदा की करुणा से’; ‘सदा के लिए मेरी सहायता’
  rationale: यूनानी पदक्रम यह निश्चित नहीं करता कि यह वाक्यांश विशेष रूप से करुणा की स्थायित्व को बताता है या सम्पूर्ण उद्धारकारी सहायता की अवधि को। अनुवाद इस तनाव को खुला रखता है।
- issue: वचन की अपूर्ण शर्तीय संरचना
  choice: ‘यदि ... न ... होती’ को बनाए रखना
  alternative: पिछले पद से सामग्री जोड़कर एक स्वतंत्र पूर्ण वाक्य बनाना
  rationale: यह पद पिछले विचार की शर्तीय पूर्ति जान पड़ता है। स्रोत में न आए परिणाम-वाक्य को जोड़ना अनुचित होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। ‘प्राण’, ‘करुणा’ और ‘प्रभु’ व्यापक रूप से समझे जाने वाले धार्मिक शब्द हैं। वचन की स्रोतगत शर्तीय अपूर्णता और अंतिम कालवाचक पद की अस्पष्ट व्याप्ति को बिना अतिरिक्त व्याख्यात्मक सामग्री जोड़े बनाए रखा गया है।
