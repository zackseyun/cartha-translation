lexical_decisions:
- source_word: περίστειλον
  choice: ढाँप दे
  rationale: क्रिया में चारों ओर लपेटने, ढकने या घेरने का ठोस बिंब है। ‘ढाँप दे’ हिन्दी में प्रार्थनात्मक और काव्यात्मक रहते हुए इस बिंब को स्वाभाविक रूप से व्यक्त करता है; ‘रक्षा कर’ या ‘संयमित कर’ उसके आशय को बताते हैं, पर मूल बिंब को कम कर देते हैं।
- source_word: τὴν γλῶσσάν μου καὶ τὰ χείλη μου
  choice: मेरी जीभ और मेरे होंठों को
  rationale: ‘जीभ’ और ‘होंठ’ दोनों प्रत्यक्ष शारीरिक बिंबों तथा यूनानी समानांतरता को बनाए रखते हैं; इन्हें केवल ‘वाणी’ कहने से यह काव्यात्मक युग्म मिट जाता।
- source_word: ἐν λόγοις ἀληθείας
  choice: सत्य के वचनों से
  rationale: यह बहुवचन λόγοις और ἀληθείας के संबंध को सुरक्षित रखता है। ‘वचन’ गरिमापूर्ण किन्तु सामान्यतः समझ में आने वाला काव्यात्मक शब्द है।
- source_word: ὀργὴν
  choice: क्रोध
  rationale: यह ὀργή का सीधा और स्वाभाविक हिन्दी पर्याय है तथा अगले निकटार्थी शब्द से भेद बनाए रखने देता है।
- source_word: θυμὸν ἄλογον
  choice: विवेकहीन रोष
  rationale: ‘रोष’ θυμός की तीव्रता को ‘क्रोध’ से अलग रखता है, और ‘विवेकहीन’ ἄλογον में निहित तर्क या समझ से रहित होने का भाव स्पष्ट करता है। विशेषण को निकटतम संज्ञा θυμόν से जोड़ा गया है।
- source_word: μακρὰν ποίησον ἀπʼ ἐμοῦ
  choice: मुझसे दूर कर दे
  rationale: यह यूनानी अभिव्यक्ति का अर्थ स्वाभाविक आधुनिक हिन्दी में देता है और परमेश्वर से इन भावों को दूर करने की प्रार्थना को स्पष्ट रखता है।
