    reason: literal_rendering
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: दूर न कर
  rationale: यह क्रिया किसी वस्तु को अलग या दूर कर देने का भाव व्यक्त करती है। हिंदी में “दूर न कर” दोनों कर्मों—दया और स्मरण—के साथ स्वाभाविक है और यूनानी पद की समानांतर रचना को बनाए रखती है।
- source_word: ἔλεός
  choice: दया
  rationale: ἔλεος के लिए “दया” सीधा, प्रचलित और प्रार्थना की भाषा में स्वाभाविक विकल्प है; इसमें करुणा का भाव भी समाहित है।
- source_word: μνήμην περὶ σοῦ
  choice: अपना स्मरण
  rationale: इसका आशय परमेश्वर का स्मरण करना, अर्थात परमेश्वर की याद हृदय में बने रहना है। “अपना स्मरण” संक्षिप्त और काव्यात्मक हिंदी है; अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
- source_word: καρδίας
  choice: हृदय
  rationale: बाइबलीय प्रयोग में “हृदय” मनुष्य के भीतरी जीवन, विचार और भक्ति का स्वाभाविक द्योतक है।
- source_word: ἕως θανάτου
  choice: मृत्यु तक
  rationale: यह यूनानी कालवाचक पद का सीधा और स्पष्ट अनुवाद है; इसे व्याख्यात्मक रूप से “जीवन भर” नहीं बनाया गया।
