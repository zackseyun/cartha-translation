  yaml_path: translation/deuterocanon/psalms_of_solomon/016/004.yaml
  text: He prodded me like a horse’s goad He prodded me like a horse’s goad to watchfulness for Him; my Savior and my helper saved me at all times.
translation:
  language: hi
  text: उसने मुझे घोड़े की अंकुसी के समान चुभोया, उसके जागरण के लिए[a]; मेरे उद्धारकर्ता और मेरे सहायक ने हर समय मुझे बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “उसके जागरण के लिए” है। “उसके” किसकी ओर संकेत करता है और इस पदबंध का सटीक संबंध क्या है, यह अस्पष्ट है; इसे “उसकी जागरूकता के लिए” भी समझा जा सकता है।
    reason: ἐπὶ τὴν ἐγρήγορσίν αὐτοῦ की असामान्य रचना तथा αὐτοῦ के अस्पष्ट संबंध को बिना व्याख्यात्मक समाधान थोपे सुरक्षित रखना।
lexical_decisions:
- source_word: ἔνυξέν
  choice: चुभोकर
  rationale: क्रिया νύσσω यहाँ किसी नुकीली वस्तु से चुभाने या कोंचने का भाव देती है; यह घोड़े की अंकुसी के रूपक के साथ स्वाभाविक है।
- source_word: κέντρον ἵππου
  choice: घोड़े की अंकुसी
  rationale: κέντρον पशु को हाँकने के लिए प्रयुक्त नुकीली अंकुसी को दर्शाता है; हिन्दी में यह संक्षिप्त और बोधगम्य समतुल्य है।
- source_word: ἐγρήγορσιν
  choice: जागरूक
  rationale: संज्ञा का मूल भाव जागते, सतर्क या चौकस रहने का है; हिन्दी वाक्य में क्रियात्मक अभिव्यक्ति अधिक स्वाभाविक है।
- source_word: σωτὴρ καὶ ἀντιλήμπτωρ
  choice: उद्धारकर्ता और सहायक
  rationale: 'दोनों पदों का भेद बनाए रखा गया है: पहला बचाने वाले और दूसरा सहायता या सहारा देने वाले को बताता है।'
- source_word: ἐν παντὶ καιρῷ
  choice: हर समय
  rationale: यह यूनानी वाक्यांश का सीधा और सहज हिन्दी रूप है, जिसमें निरंतर संरक्षण का भाव बना रहता है।
theological_decisions:
- issue: ἐπὶ τὴν ἐγρήγορσίν αὐτοῦ में αὐτοῦ का संबंध
  choice: अपने प्रति जागरूक किया
  alternative: उसके जागने के लिए / उसकी जागरूकता के लिए
  rationale: संदर्भ में वक्ता को आत्मिक असावधानी से जगाए जाने का भाव है। फिर भी यूनानी पदबंध व्याकरणतः असामान्य है, इसलिए वैकल्पिक अधिक शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: पहले खंड में कर्ता की पहचान
  choice: सर्वनाम ‘उसने’ को अनिर्दिष्ट रखा
  alternative: परमेश्वर ने
  rationale: यूनानी पाठ केवल क्रिया में निहित तीसरे पुरुष का कर्ता देता है; अगला खंड उसे उद्धारकर्ता और सहायक से जोड़ने की ओर संकेत करता है, पर नाम स्पष्ट रूप से जोड़ना मूल से अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘अंकुसी’ रूपक की ठोस छवि बचाती है; पादटिप्पणी मूल यूनानी की वास्तविक अस्पष्टता स्पष्ट करती है।
