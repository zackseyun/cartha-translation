  text: But establish my soul with favor and gladness[a]; when you strengthen my soul[b], what has been given will be enough for me.
translation:
  language: hi
  text: परन्तु कृपा[a] और आनन्द के साथ मेरे प्राण को दृढ़ कर; जब तू मेरे प्राण को सामर्थ्य देगा, तब जो दिया गया है, वह मेरे लिए पर्याप्त होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कृपा’ के स्थान पर ‘सद्भावना’ या ‘सदिच्छा’ भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: कृपा
  rationale: प्रार्थना के इस प्रसंग में यह शब्द अनुकूल इच्छा या कृपापूर्ण प्रसन्नता दर्शाता है; ‘कृपा’ स्वाभाविक है और अनावश्यक तकनीकी अर्थ नहीं जोड़ता।
- source_word: ἱλαρότητος
  choice: आनन्द
  rationale: यह प्रसन्न और उज्ज्वल मनोदशा व्यक्त करता है; ‘आनन्द’ आधुनिक, गरिमापूर्ण हिन्दी में उपयुक्त है।
- source_word: στήρισον
  choice: स्थिर कर
  rationale: यह क्रिया दृढ़ या स्थिर करने का भाव रखती है। इससे अगले खंड के ἐνισχύω के सामर्थ्य देने वाले भाव से शब्दगत भेद भी बना रहता है।
- source_word: ψυχήν
  choice: प्राण
  rationale: भक्ति और प्रार्थना के प्रसंग में ‘प्राण’ भीतर के व्यक्ति और जीवनशील अस्तित्व—दोनों की सम्भावना बनाए रखता है।
- source_word: ἐν τῷ ἐνισχῦσαί σε
  choice: जब तू ... सामर्थ्य देगा
  rationale: ἐν के साथ प्रयुक्त आर्टिकुलर इनफिनिटिव को कालवाचक परिस्थिति के रूप में समझना स्वाभाविक है; हिन्दी में यह रचना स्पष्ट और प्रवाहपूर्ण है।
- source_word: ἀρκέσει μοι
  choice: मेरे लिए पर्याप्त होगा
  rationale: भविष्यकालीन क्रिया पर्याप्तता व्यक्त करती है; यह हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: τὸ δοθέν
  choice: जो दिया गया है
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त जानबूझकर व्यापक है; यह अनुवाद दाता या दी हुई वस्तु की पहचान तय नहीं करता।
theological_decisions:
- issue: εὐδοκία का कर्ता या स्रोत
  choice: ‘कृपा’ को बिना स्वामित्व-सूचक पद के रखा गया
  alternative: ‘अपनी कृपा’ या ‘तेरी सद्भावना’
  rationale: यूनानी पाठ εὐδοκία के साथ स्पष्ट स्वामित्व-सूचक सर्वनाम नहीं देता; इसलिए उसे जोड़कर अर्थ को सीमित नहीं किया गया।
- issue: τὸ δοθέν की पहचान
  choice: ‘जो दिया गया है’
  alternative: ‘दिया हुआ वरदान’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि दी हुई वस्तु कोई वरदान, भाग, भोजन या अन्य वस्तु है; व्यापक अभिव्यक्ति उस अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन निकटतापूर्ण संबोधन ‘तू’ प्रयुक्त है। ‘स्थिर कर’ और ‘सामर्थ्य देगा’ के द्वारा यूनानी की दो अलग क्रियाओं का भेद सुरक्षित रखा गया है।
