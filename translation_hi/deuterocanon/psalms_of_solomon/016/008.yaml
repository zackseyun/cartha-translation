  yaml_path: translation/deuterocanon/psalms_of_solomon/016/008.yaml
  text: And do not let the beauty of a lawless woman deceive me[a], nor that of anything laid before me by worthless sin.
translation:
  language: hi
  text: और व्यवस्था का उल्लंघन करनेवाली स्त्री की सुंदरता मुझे न बहकाए, और न व्यर्थ पाप से मेरे सामने रखी हुई हर वस्तु की सुंदरता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀπατησάτω με
  choice: मुझे न बहकाए
  rationale: यूनानी निषेधात्मक आज्ञार्थक/कामनार्थक भाव को स्वाभाविक हिंदी में सुरक्षित रखता है। प्रलोभन के प्रसंग में ‘बहकाए’ ἀπατάω के छल और पथभ्रष्ट करने, दोनों भावों को व्यक्त करता है।
- source_word: κάλλος γυναικὸς παρανόμου
  choice: व्यवस्था का उल्लंघन करनेवाली स्त्री की सुंदरता
  rationale: κάλλος के लिए ‘सुंदरता’ सहज है। παράνομος में व्यवस्था के विरुद्ध आचरण का नैतिक-धार्मिक भार है; ‘व्यवस्था का उल्लंघन करनेवाली’ इसे ‘अनैतिक’ जैसे अधिक सामान्य शब्द में विलीन नहीं करता।
- source_word: παντὸς ὑποκειμένου
  choice: हर उस वस्तु की सुंदरता, जो ... मेरे सामने रखी गई हो
  rationale: παντός का संबंध पहले आए κάλλος से जननकारक रूप में समझा गया है, इसलिए हिंदी में लुप्त ‘सुंदरता’ दोहराई गई है। ὑποκειμένου के व्यापक अर्थ में यहाँ प्रलोभन के रूप में सामने रखी वस्तु का भाव प्रसंगानुकूल है; ‘मेरे’ को हिंदी में स्पष्टता के लिए निहित अर्थ के रूप में जोड़ा गया है।
- source_word: ἀπὸ ἁμαρτίας ἀνωφελοῦς
  choice: व्यर्थ पाप के द्वारा
  rationale: ἀνώφελος का अर्थ लाभहीन, निष्फल या व्यर्थ है; ‘व्यर्थ’ आधुनिक हिंदी में सहज है। ἀπό को यहाँ उस पाप से आने या उसके द्वारा प्रस्तुत किए जाने के स्रोत/माध्यम के अर्थ में लिया गया है।
theological_decisions:
- issue: दूसरे खंड में लुप्त पद और उसका वाक्यगत संबंध
  choice: παντὸς ὑποκειμένου को κάλλος पर आश्रित मानकर ‘हर उस वस्तु की सुंदरता’
  alternative: इसे सीधे ἀπατησάτω का दूसरा कर्ता मानकर ‘और न कोई ऐसी वस्तु मुझे बहकाए’
  rationale: जननकारक παντός का जननकारक γυναικός के साथ समन्वय और κάλλος पर निर्भर होना व्याकरण की दृष्टि से मजबूत है। फिर भी यूनानी अभिव्यक्ति संक्षिप्त और कुछ हद तक अस्पष्ट है, इसलिए वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज प्रार्थनात्मक रूप रखा गया है। ‘व्यवस्था का उल्लंघन करनेवाली’ थोड़ा विस्तृत है, पर παράνομος की विधि/व्यवस्था-संबंधी धार को साफ रखता है।
