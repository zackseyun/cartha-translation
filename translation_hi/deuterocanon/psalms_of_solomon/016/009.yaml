translation:
  language: hi
  text: अपने स्थान में[a] मेरे हाथों के कामों को सही दिशा दे, और तुझे स्मरण करते हुए[b] मेरे कदमों की रक्षा कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी उपस्थिति में।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरे स्मरण में”; इसे “अपने स्मरण में,” अर्थात् परमेश्वर द्वारा स्मरण रखे जाने के अर्थ में भी समझा जा सकता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: κατεύθυνον
  choice: सही दिशा दे
  rationale: क्रिया का अर्थ किसी काम को सीधा, ठीक या उचित मार्ग पर चलाना है। ‘सही दिशा दे’ प्रार्थना के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἔργα τῶν χειρῶν μου
  choice: मेरे हाथों के कामों को
  rationale: यह स्रोत के ठोस, सामी प्रभाव वाले मुहावरे को बनाए रखता है और वक्ता के कार्यों अथवा परिश्रम को सूचित करता है।
- source_word: ἐν τόπῳ σου
  choice: अपने स्थान में
  rationale: τόπος का मूल अर्थ ‘स्थान’ है। यद्यपि प्रसंग में ‘उपस्थिति’ सम्भव व्याख्या है, मुख्य पाठ स्रोत की स्थानवाचक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: τὰ διαβήματά μου
  choice: मेरे कदमों
  rationale: यह वक्ता के वास्तविक चलने और जीवन-मार्ग—दोनों की छवि को बनाए रखने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: ἐν τῇ μνήμῃ σου
  choice: तुझे स्मरण करते हुए
  rationale: 'निकटवर्ती प्रसंग के आधार पर σου को कर्मवाचक सम्बन्ध के रूप में लिया गया है: वक्ता परमेश्वर को स्मरण रखता है। यह हिन्दी में अस्पष्ट ‘तेरे स्मरण में’ की अपेक्षा आशय स्पष्ट करता है, जबकि पाठ-रूप की सम्भावित दूसरी समझ पादटिप्पणी में दी गई है।'
- source_word: διαφύλαξον
  choice: रक्षा कर
  rationale: यह क्रिया सावधानी से बचाए रखने अथवा सुरक्षित रखने का प्रबल भाव देती है; ‘रक्षा कर’ संक्षिप्त, स्वाभाविक और प्रार्थना के अनुकूल है।
theological_decisions:
- issue: μνήμῃ σου में सम्बन्धकारक सर्वनाम का आशय
  choice: 'वक्ता द्वारा परमेश्वर का स्मरण: ‘तुझे स्मरण करते हुए’'
  alternative: 'परमेश्वर द्वारा वक्ता को स्मरण रखना: ‘अपने स्मरण में’'
  rationale: इसी स्तोत्र के निकटवर्ती प्रसंग में परमेश्वर के स्मरण को हृदय में रखने का भाव इस कर्मवाचक समझ का समर्थन करता है। फिर भी यूनानी सम्बन्धकारक अपने आप में दूसरी समझ को पूर्णतः असम्भव नहीं बनाता, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनापूर्ण रखी गई है। ‘मेरे हाथों के काम’ और ‘मेरे कदम’ जैसी ठोस काव्यात्मक छवियाँ सुरक्षित हैं। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तू/तेरा’ के अनुरूप क्रियारूप प्रयुक्त हुए हैं।
