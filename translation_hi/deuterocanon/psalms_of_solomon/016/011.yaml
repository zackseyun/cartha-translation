  yaml_path: translation/deuterocanon/psalms_of_solomon/016/011.yaml
  text: Keep grumbling and faintheartedness in affliction far from me[a], when I sin, as you discipline me for repentance.
translation:
  language: hi
  text: क्लेश के समय कुड़कुड़ाहट और हिम्मत हारने को मुझसे दूर रख[a]; जब मैं पाप करूँ, तब तू मुझे मन फिराने के लिए अनुशासित कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्राप्त यूनानी पाठ का शाब्दिक अर्थ है: “यदि तू मुझे अनुशासित करते समय चूके (या पाप करे)।” संभव है कि यहाँ पाठ-दोष हो और मूल अर्थ “यदि मैं पाप करूँ” रहा हो।'
    reason: यूनानी ἁμαρτήσῃς द्वितीय पुरुष एकवचन है, जबकि प्रसंग प्रथम पुरुष पाठ की ओर संकेत करता है; दोनों को बिना छिपाए प्रस्तुत करना आवश्यक है।
lexical_decisions:
- source_word: γογγυσμόν
  choice: कुड़कुड़ाहट
  rationale: यह शब्द दबे स्वर में की जाने वाली असंतुष्ट शिकायत को व्यक्त करता है; ‘कुड़कुड़ाहट’ आधुनिक और सहज हिन्दी में वही भाव रखता है।
- source_word: ὀλιγοψυχίαν
  choice: हिम्मत हारना
  rationale: शाब्दिक भाव ‘मन का छोटा पड़ना’ है, अर्थात साहस टूटना या निराश हो जाना। ‘हिम्मत हारना’ साधारण पाठक के लिए स्वाभाविक है और मनोवैज्ञानिक बल बनाए रखता है।
- source_word: ἐν θλίψει
  choice: क्लेश के समय
  rationale: θλῖψις दबाव, संकट या पीड़ा को दर्शाता है। ‘क्लेश’ प्रार्थनात्मक गरिमा रखता है और ‘के समय’ प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μάκρυνον ἀπʼ ἐμοῦ
  choice: मुझसे दूर रख
  rationale: आज्ञार्थक क्रिया इन प्रवृत्तियों को प्रार्थी से दूर करने या बनाए रखने की विनती करती है।
- source_word: ἐὰν ἁμαρτήσῃς
  choice: जब मैं पाप करूँ
  rationale: प्राप्त यूनानी पाठ में क्रिया द्वितीय पुरुष एकवचन (‘यदि तू पाप करे/चूके’) है, पर संदर्भ में परमेश्वर को पाप या भूल का कर्ता बनाना अत्यंत कठिन है। मुख्य पाठ संभावित पाठ-दोष को मानकर संदर्भ-संगत प्रथम पुरुष अर्थ देता है, जबकि प्राप्त पाठ को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ἐν τῷ σε παιδεύειν
  choice: तू मुझे … अनुशासित कर
  rationale: σε स्पष्ट रूप से अनुशासित करने वाले का कर्मकारकीय कर्ता, ‘तू’, है। यूनानी रचना सामान्यतः ‘तेरे अनुशासित करते समय’ होगी; हिन्दी वाक्य को स्पष्ट रखने के लिए इसे मुख्य निवेदन से जोड़ा गया है और ‘मुझे’ संदर्भ से पूरा किया गया है।
- source_word: εἰς ἐπιστροφήν
  choice: मन फिराने के लिए
  rationale: ἐπιστροφή का मूल भाव लौटना या फिरना है और यहाँ नैतिक-पश्चात्तापपूर्ण वापसी अभिप्रेत है। ‘मन फिराना’ εἰς की लक्ष्यसूचक दिशा को सहज हिन्दी में रखता है।
theological_decisions:
- issue: क्या कठिन पाठ ἐὰν ἁμαρτήσῃς परमेश्वर के चूकने की संभावना बताता है?
  choice: मुख्य पाठ में संदर्भ-संगत ‘जब मैं पाप करूँ’ रखा गया और प्राप्त यूनानी पाठ पादटिप्पणी में दिया गया।
  alternative: ‘यदि तू मुझे अनुशासित करते समय चूके’—प्राप्त यूनानी रूप का सीधा अनुवाद।
  rationale: पाठ-साक्ष्य को छिपाना उचित नहीं, पर मुख्य अनुवाद में परमेश्वर को पाप का कर्ता ठहराना भजन की प्रार्थनात्मक दिशा से गंभीर टकराव पैदा करता है। पादटिप्पणी वास्तविक पाठगत और धर्मवैचारिक तनाव को पाठक के सामने बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तू’ अपनाया गया है। कठिन यूनानी पाठ को चुपचाप सुधारने के बजाय मुख्य पाठ और पादटिप्पणी के माध्यम से उसकी वास्तविक अनिश्चितता सुरक्षित रखी गई है।
