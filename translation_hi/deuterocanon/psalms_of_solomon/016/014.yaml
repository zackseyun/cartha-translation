base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/014.yaml
  text: If a person is rebuked by means of his ruin[b][a], your testing is in his flesh and in poverty.
translation:
  language: hi
  text: यदि किसी व्यक्ति को उसके विनाश के द्वारा झिड़की दी जाती है,[a][b] तो तेरी परख उसके शरीर और उसकी दरिद्रता में होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि किसी प्राण को उसके विनाश के हाथ में ताड़ना दी जाती है।” इस उपवाक्य का यूनानी पाठ कठिन है।
    reason: alternative_reading
  - marker: b
    text: “उसके विनाश के द्वारा” का अर्थ “उसकी बरबादी के वश में” भी हो सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐλέγχηται
  choice: झिड़की दी जाती है
  rationale: यह ἐλέγχω के सुधारात्मक और दोष प्रकट करने वाले भाव को सहज आधुनिक हिन्दी में रखता है; न्यायिक दोषसिद्धि का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ψυχήν
  choice: किसी व्यक्ति को
  rationale: यहाँ ψυχή सामी प्रयोग के अनुरूप पूरे व्यक्ति या प्राणी को सूचित कर सकता है। ‘व्यक्ति’ आगे के पुल्लिंग αὐτοῦ और शारीरिक तथा आर्थिक क्लेश के उल्लेख से स्वाभाविक रूप से जुड़ता है; ‘प्राण’ का विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἐν χειρὶ
  choice: के द्वारा
  rationale: शाब्दिक ‘हाथ में’ की अपेक्षा यह सम्भावित सामी साधनवाचक मुहावरे को स्पष्ट करता है, पर कठिन यूनानी वाक्यांश की दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἀπωλίας
  choice: विनाश
  rationale: ἀπώλεια का सीधा और व्यापक अर्थ ‘विनाश’ है; ‘बरबादी’ भी सन्दर्भतः सम्भव है।
- source_word: δοκιμασία
  choice: परख
  rationale: δοκιμασία ऐसी परीक्षा को दर्शाता है जो गुण या दशा को जाँचती अथवा प्रमाणित करती है; ‘परख’ संक्षिप्त और स्वाभाविक है।
- source_word: σαρκὶ
  choice: शरीर
  rationale: यहाँ σάρξ का अभिप्राय शारीरिक अस्तित्व या देह है। हिन्दी में ‘शरीर’ इस ठोस अर्थ को ‘मांस’ से अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πενίᾳς
  choice: दरिद्रता
  rationale: रूप में कठिनाई के बावजूद अर्थ भौतिक अभाव या गरीबी है। ‘दरिद्रता’ काव्यात्मक गरिमा और स्पष्टता दोनों बनाए रखता है।
theological_decisions:
- issue: ἐν χειρὶ ἀπωλίας αὐτοῦ का कठिन सम्बन्ध
  choice: ‘उसके विनाश के द्वारा’
  alternative: ‘उसके विनाश के हाथ में’ अथवा ‘उसकी बरबादी के वश में’
  rationale: मुख्य पाठ में ἐν χειρί को सम्भावित सामी साधनवाचक मुहावरा मानकर अर्थपूर्ण हिन्दी दी गई है, किन्तु αὐτοῦ का सटीक सम्बन्ध और पूरे वाक्यांश का आशय अनिश्चित है; इसलिए अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- issue: ψυχήν का अर्थ
  choice: ‘व्यक्ति’
  alternative: ‘प्राण’ अथवा ‘जीवन’
  rationale: इस प्रसंग में ψυχή पूरे व्यक्ति के अर्थ में समझी जा सकती है और αὐτοῦ के साथ सर्वनाम-संगति भी सहज बनाती है। आत्मा-देह के किसी निश्चित द्वैतवादी निष्कर्ष को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक किन्तु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। कठिन यूनानी वाक्य-विन्यास को मुख्य पाठ में सीमित रूप से स्वाभाविक बनाया गया है, जबकि वास्तविक अनिश्चितता दोनों पादटिप्पणियों में स्पष्ट रखी गई है।
