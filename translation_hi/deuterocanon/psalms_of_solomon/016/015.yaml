lexical_decisions:
- source_word: ἐν τῷ ὑπομεῖναι
  choice: जब ... धीरज धरेगा
  rationale: ἐν के साथ प्रयुक्त निश्चित infinitive का अर्थ कालसूचक (‘जब’) या साधनसूचक (‘के द्वारा’) हो सकता है। पिछले प्रसंग में परीक्षाओं और अभावों का उल्लेख होने के कारण कालसूचक अनुवाद मुख्य पाठ में स्वाभाविक है, जबकि दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: δίκαιον
  choice: धर्मी जन
  rationale: यहाँ एकवचन पुल्लिंग रूप infinitive के कर्ता के रूप में समझा जाता है। ‘धर्मी जन’ उसके संज्ञात्मक और सम्भवतः प्रतिनिधिक प्रयोग को सहज हिन्दी में बनाए रखता है।
- source_word: ἐν τούτοις
  choice: इन बातों में
  rationale: यह पद पिछले प्रसंग में कही गई कठिनाइयों की ओर संकेत करता है। ‘इन बातों में’ यूनानी की अस्पष्टता और पीछे की ओर संकेत—दोनों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἐλεηθήσεται
  choice: उस पर दया करेगा
  rationale: यूनानी में भविष्यकालीन कर्मवाच्य है, जिसका कर्ता ὑπὸ Κυρίου से स्पष्ट होता है। हिन्दी में ‘प्रभु के द्वारा उस पर दया की जाएगी’ अस्वाभाविक है; अतः अर्थ और दया-विषयक शब्दावली को बनाए रखते हुए स्वाभाविक कर्तृवाच्य प्रयोग किया गया है।
- source_word: ὑπὸ Κυρίου
  choice: प्रभु उस पर
  rationale: ὑπό के साथ संबंधकारक कर्मवाच्य क्रिया के कर्ता को चिह्नित करता है। हिन्दी के स्वाभाविक कर्तृवाच्य रूप में ‘प्रभु’ को दया करने वाले के रूप में रखा गया है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος भक्तिपरक अर्थ में परमेश्वर के लिए प्रयुक्त है। ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक है और पद में कोई अनावश्यक सम्प्रदायगत अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धीरज धरेगा’ कठिन परिस्थितियों में स्थिर बने रहने का भाव देता है। कर्मवाच्य यूनानी को हिन्दी में स्वाभाविक कर्तृवाच्य में व्यक्त किया गया है, जबकि दया का स्रोत ‘प्रभु’ स्पष्ट रखा गया है।
