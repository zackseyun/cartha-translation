  yaml_path: translation/deuterocanon/psalms_of_solomon/016/002.yaml
  text: When I was far from God[a], my soul was almost poured out to death[c][b], near the gates of Hades with a sinner.
translation:
  language: hi
  text: परमेश्वर से दूर रहते हुए, मेरा प्राण[a] लगभग मृत्यु तक उंडेल दिया गया था, और वह एक पापी[c] के साथ अधोलोक[b] के फाटकों के अत्यन्त निकट था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा जीवन।”
    reason: ψυχή का अर्थ यहाँ ‘प्राण’ अथवा ‘जीवन’ हो सकता है।
  - marker: b
    text: या “कब्र के फाटक” अथवा “मृतकों के लोक के फाटक।” यूनानी में “हेडीस” है।
    reason: ᾅδης के सम्भव हिन्दी निरूपण और मूल यूनानी संज्ञा को स्पष्ट करना।
  - marker: c
    text: या “पापी जन के साथ”; एकवचन का प्रयोग पापियों के वर्ग के प्रतिनिधि के रूप में भी समझा जा सकता है।
    reason: ἁμαρτωλοῦ किसी अनिश्चित व्यक्ति या जातिवाचक एकवचन को सूचित कर सकता है।
lexical_decisions:
- source_word: τῷ μακρὰν ἀπὸ θεοῦ
  choice: परमेश्वर से दूर होने पर
  rationale: आरंभिक यूनानी पदबंध संक्षिप्त और व्याकरण की दृष्टि से कुछ असामान्य है। हिन्दी में यह परिस्थितिसूचक/कालसूचक अर्थ स्वाभाविक रूप से व्यक्त करता है, बिना कारण या नैतिक निष्कर्ष जोड़े।
- source_word: παρʼ ὀλίγον
  choice: लगभग
  rationale: यह मुहावरा निकट घटित होने वाली बात, अर्थात ‘लगभग’ या ‘करीब-करीब’, व्यक्त करता है।
- source_word: ἐξεχύθη ἡ ψυχή μου εἰς θάνατον
  choice: मेरा प्राण लगभग मृत्यु में उंडेल दिया गया
  rationale: ‘उंडेल दिया गया’ ἐξεχύθη के सजीव रूपक और कर्मवाच्य को बनाए रखता है। ψυχή के लिए ‘प्राण’ आधुनिक हिन्दी में व्यक्ति के जीवन और भीतरी अस्तित्व—दोनों की प्रतिध्वनि रखता है।
- source_word: σύνεγγυς πυλῶν ᾅδου
  choice: अधोलोक के फाटकों के बिलकुल निकट
  rationale: σύνεγγυς अत्यंत निकटता व्यक्त करता है। ‘अधोलोक’ मृतकों के लोक की स्थानिक छवि बनाए रखता है और इसे केवल ‘कब्र’ या ‘मृत्यु’ में सीमित नहीं करता।
- source_word: μετὰ ἁμαρτωλοῦ
  choice: एक पापी के साथ
  rationale: यूनानी में संज्ञा एकवचन और अनिश्चित है। यह अनुवाद उस रूप को सीधे बनाए रखता है और किसी निश्चित व्यक्ति अथवा पूरे वर्ग का अर्थ अनिवार्य नहीं करता।
theological_decisions:
- issue: ᾅδου का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; हेडीस
  rationale: मूल पाठ ᾅδης का नाम लेता है। ‘अधोलोक’ हिन्दी में मृतकों के लोक की छवि को बनाए रखता है और किसी अधिक संकीर्ण परलोक-सिद्धांत को आरोपित नहीं करता।
- issue: ψυχή का अनुवाद
  choice: प्राण
  alternative: जीवन; आत्मा
  rationale: इस संदर्भ में ψυχή वक्ता के जीवित अस्तित्व या स्वयं को सूचित कर सकता है। ‘प्राण’ मृत्यु-संकट के संदर्भ में स्वाभाविक है, जबकि पादटिप्पणी ‘जीवन’ की सम्भावना सुरक्षित रखती है।
- issue: ἁμαρτωλοῦ की अनिश्चित या जातिवाचक व्याख्या
  choice: एक पापी
  alternative: पापी; दुष्ट जन
  rationale: अनुच्छेदरहित एकवचन किसी एक अनिश्चित व्यक्ति या जातिवाचक प्रतिनिधि—दोनों रूपों में समझा जा सकता है। मुख्य पाठ रूपात्मक अनिश्चितता रखता है और पादटिप्पणी जातिवाचक सम्भावना बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘उंडेल दिया गया’ जानबूझकर कुछ काव्यात्मक है, क्योंकि मूल यूनानी जीवन के चुकने की सजीव छवि प्रस्तुत करता है। ‘फाटक’ और ‘अधोलोक’ भजन की प्राचीन मृत्यु-लोक संबंधी बिंबावली को बनाए रखते हैं।
