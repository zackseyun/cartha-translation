  yaml_path: translation/deuterocanon/psalms_of_solomon/016/005.yaml
  text: I will give thanks to you[a], O God, because you took hold of me for salvation[d][c][b], and you did not count me with sinners for destruction.
translation:
  language: hi
  text: हे परमेश्वर, मैं तेरा धन्यवाद करूँगा, क्योंकि तूने उद्धार के लिए मेरी सहायता की,[a] और विनाश के लिए उन पापियों के साथ मेरी गिनती नहीं की।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तूने उद्धार के लिए मुझे थाम लिया।’
    reason: ἀντελάβου में सहायता करने के साथ थामने या सहारा देने का सजीव भाव भी हो सकता है।
  - marker: b
    text: या ‘और विनाश के लिए मुझे उन पापियों के साथ नहीं माना।’
    reason: ἐλογίσω का अर्थ ‘गिनना’ या ‘मानना’ दोनों हो सकता है।
lexical_decisions:
- source_word: ἐξομολογήσομαί
  choice: मैं तेरा धन्यवाद करूँगा
  rationale: परमेश्वर को संबोधित इस प्रार्थना में क्रिया पाप स्वीकार करने के बजाय कृतज्ञतापूर्ण स्तुति व्यक्त करती है। भविष्यकाल को भी बनाए रखा गया है।
- source_word: ἀντελάβου μου
  choice: तूने मेरी सहायता की
  rationale: यह क्रिया सहायता के लिए किसी को थामने या उसका सहारा बनने का भाव रखती है। संदर्भ में स्वाभाविक हिन्दी और निकटवर्ती सहायता-संबंधी शब्दावली बनाए रखने के लिए ‘सहायता की’ चुना गया है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार के लिए
  rationale: यह परमेश्वर की सहायता के उद्देश्य या परिणाम को व्यक्त करता है। ‘उद्धार’ σωτηρία के धार्मिक और व्यापक अर्थ को बनाए रखता है।
- source_word: ἐλογίσω με
  choice: मेरी गिनती नहीं की
  rationale: λογίζομαι यहाँ किसी को एक समूह में गिनने या मानने के मूल्यांकनात्मक भाव में है; यह हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: उन पापियों के साथ
  rationale: ‘उन’ यूनानी निश्चित पदबंध की विशिष्टता को हिन्दी में संकेतित करता है और इसे केवल सामान्य नैतिक श्रेणी बनाकर प्रस्तुत नहीं करता।
- source_word: εἰς ἀπώλειαν
  choice: विनाश के लिए
  rationale: यह उस अंतिम दशा या परिणाम को सीधे और गंभीर ढंग से व्यक्त करता है जिससे वक्ता बचाया गया।
theological_decisions:
- issue: ‘पापियों’ को सामान्य श्रेणी या पहचाने हुए समूह के रूप में प्रस्तुत करना
  choice: उन पापियों
  alternative: पापियों
  rationale: τῶν ἁμαρτωλῶν में निश्चितता है और इस रचना के संदर्भ में यह किसी पहचाने हुए विरोधी समूह की ओर संकेत कर सकता है। ‘उन’ इस संभावना को सुरक्षित रखता है, पर समूह की ऐतिहासिक पहचान को पाठ में अनावश्यक रूप से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और प्रार्थनापूर्ण गरिमा वाली रखी गई है। परमेश्वर के लिए निकट, पारंपरिक एकवचन संबोधन ‘तू/तेरा’ प्रयोग हुआ है। वाक्य यूनानी की दो समांतर क्रियाओं और उद्धार-विनाश के विरोध को बनाए रखता है।
