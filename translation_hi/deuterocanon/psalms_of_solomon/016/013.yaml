lexical_decisions:
- source_word: ἐνισχύσῃς
  choice: सामर्थ्य न दे
  rationale: क्रिया का अर्थ सामर्थ्य या सहारा देना है। यूनानी में इसका कर्म व्यक्त नहीं है; इसलिए हिन्दी में भी यह नहीं जोड़ा गया कि सामर्थ्य किसे दिया जाता है।
- source_word: ὑφέξεται
  choice: सह सकेगा
  rationale: यह भाव किसी कठिन बोझ या परिस्थिति के अधीन टिके रहने और उसे सहने का है; आलंकारिक प्रश्न में ‘सह सकेगा’ स्वाभाविक है।
- source_word: παιδείαν
  choice: अनुशासन
  rationale: παιδεία शिक्षा, प्रशिक्षण या सुधारात्मक अनुशासन का अर्थ दे सकता है। अभाव और सहनशीलता के संदर्भ में ‘अनुशासन’ उसके कठिन किंतु निर्माणकारी पक्ष को बनाए रखता है।
- source_word: ἐν πενίᾳ
  choice: निर्धनता में
  rationale: πενία का सीधा अर्थ निर्धनता या अभाव है। ‘निर्धनता में’ मूल के स्पष्ट सामाजिक-आर्थिक भाव को सुरक्षित रखता है।
