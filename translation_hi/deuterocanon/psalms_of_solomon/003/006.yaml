- source_word: ἀποσκοπεύει
  choice: ध्यान से देखता रहता है
  rationale: यह क्रिया लगातार, सजग और अपेक्षापूर्ण ढंग से देखने का भाव देती है; यह हिन्दी में स्वाभाविक रहते हुए यूनानी के वर्तमानकालीन, दीर्घ भाव को व्यक्त करती है।
- source_word: ὅθεν
  choice: कहाँ से
  rationale: यह स्रोत या उद्गम बताने वाले यूनानी क्रियाविशेषण का सहज आधुनिक हिन्दी रूप है।
- source_word: ἥξει
  choice: आएगा
  rationale: भविष्यकालीन आगमन को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σωτηρία
  choice: उद्धार
  rationale: यह धार्मिक संदर्भ में व्यापक अर्थ वाला मानक हिन्दी पर्याय है और केवल किसी तात्कालिक संकट से बचाव तक अर्थ को सीमित नहीं करता।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: यूनानी सम्प्रदान कारक यहाँ लाभ अथवा संबंध का भाव दे सकता है; ‘उसके लिए’ स्वाभाविक हिन्दी में इसे सुरक्षित रखता है।
