  text: The righteous man is attentive and will declare the Lord just; The righteous man is attentive and will vindicate the Lord; he falls, and he looks to see what God will do for him., and he looks to see what God will do for him.
translation:
  language: hi
  text: धर्मी व्यक्ति सजग रहता है और प्रभु को न्यायी ठहराएगा[a]; वह गिरता है और देखता है कि परमेश्वर उसके लिए क्या करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु को सही सिद्ध करेगा”; अधिक शाब्दिक रूप से, “प्रभु को धर्मी ठहराएगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर उसके साथ क्या करेगा” या “उसके प्रति क्या करेगा।” यूनानी दत्तिव का अर्थ उसके हित में किए जाने वाले कार्य या उसके प्रति किए जाने वाले कार्य—दोनों हो सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: προσέχων
  choice: सावधान रहता है
  rationale: वर्तमान कृदन्त धर्मी जन की निरंतर सजग और ध्यानमग्न मुद्रा व्यक्त करता है; यह हिन्दी में स्वाभाविक है और केवल शारीरिक देखने तक अर्थ को सीमित नहीं करता।
- source_word: ὁ δίκαιος
  choice: धर्मी जन
  rationale: यह एकवचन विशेषण संज्ञा के रूप में प्रतिनिधि धर्मी व्यक्ति को सूचित करता है। ‘जन’ आधुनिक हिन्दी में गरिमापूर्ण और सामान्य अर्थ वाला है।
- source_word: δικαιώσει
  choice: न्यायी ठहराएगा
  rationale: प्रभु को कर्म बनाकर प्रयुक्त क्रिया का आशय उसे न्यायी बनाना नहीं, बल्कि उसके न्यायपूर्ण होने को स्वीकार और घोषित करना है। ‘न्यायी ठहराएगा’ इस भाव को स्पष्ट रखते हुए यूनानी क्रिया से निकटता बनाए रखता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος के लिए प्रचलित श्रद्धापूर्ण हिन्दी रूप, जो यहाँ परमेश्वर को सूचित करता है।
- source_word: ἔπεσεν
  choice: वह गिरता है
  rationale: यद्यपि रूप एओरिस्ट है, इस नीतिपरक संदर्भ में यह धर्मी के सामान्य अनुभव को बताने वाला gnomic aorist है; इसलिए वर्तमानकालीन हिन्दी स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἀποβλέπει
  choice: प्रभु की ओर ताकता है
  rationale: क्रिया किसी ओर एकाग्र दृष्टि से देखने और अपेक्षा रखने का भाव देती है। हिन्दी में कर्म को प्रसंग से स्पष्ट करके यह अभिव्यक्ति दृश्य और आशापूर्ण दोनों आयाम बचाती है।
- source_word: τί ποιήσει αὐτῷ ὁ θεός
  choice: परमेश्वर उसके लिए क्या करेगा
  rationale: ποιήσει के साथ αὐτῷ हितसूचक अथवा तटस्थ/प्रतिकूल दत्तिव हो सकता है। अगले पद में उद्धार की आशा के कारण ‘उसके लिए’ मुख्य पाठ में उचित है, जबकि ‘उसके साथ’/‘उसके प्रति’ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: गिरने पर धर्मी की प्रतिक्रिया परमेश्वर के न्याय की स्वीकृति है या केवल उसके कार्य की प्रतीक्षा
  choice: ‘प्रभु को न्यायी ठहराएगा’ द्वारा उसकी सजगता और प्रभु के सही न्याय की सकारात्मक स्वीकृति दोनों व्यक्त की गई हैं।
  alternative: ‘प्रभु को सही सिद्ध करेगा’ अथवा अधिक शाब्दिक ‘प्रभु को धर्मी ठहराएगा’।
  rationale: यूनानी पाठ धर्मी की सावधानी को प्रभु के पक्ष में सकारात्मक निर्णय से सीधे जोड़ता है। चुना हुआ रूप यह संकेत नहीं देता कि मनुष्य परमेश्वर को न्यायी बनाता है, फिर भी मूल की वैचारिक तीक्ष्णता बनाए रखता है।
- issue: परमेश्वर धर्मी के हित में करेगा या उसके साथ/प्रति कुछ करेगा
  choice: मुख्य पाठ में हितसूचक ‘उसके लिए’।
  alternative: ‘उसके साथ क्या करेगा’ या ‘उसके प्रति क्या करेगा’।
  rationale: αὐτῷ व्याकरणतः दोनों दिशाओं के लिए खुला है। निकटवर्ती उद्धार-प्रसंग हितसूचक अर्थ का समर्थन करता है, पर अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। प्रतिनिधि एकवचन के लिए ‘धर्मी जन’ रखा गया है। समांतर क्रियाओं को संक्षिप्त रखा गया है और स्रोत में न होने वाली व्याख्या न्यूनतम है।
