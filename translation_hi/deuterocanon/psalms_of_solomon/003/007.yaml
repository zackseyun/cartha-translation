  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पहले खंड में व्यापक नैतिक अर्थ के लिए ‘सत्यनिष्ठा’ और दूसरे में ठहरने की मूल उपमा सुरक्षित रखी गई है।
