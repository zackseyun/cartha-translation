base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/007.yaml
  text: The truth of the righteous is from God their savior[b][a]; sin upon sin does not lodge in the house of a righteous man.
translation:
  language: hi
  text: धर्मियों की सत्यनिष्ठा उनके उद्धारकर्ता परमेश्वर से आती है[a]; धर्मी के घर में पाप पर पाप आकर नहीं ठहरता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मियों का सत्य परमेश्वर से आता है।” यहाँ “सत्य” को अधिक अमूर्त अर्थ में लिया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια
  choice: सत्यनिष्ठा
  rationale: इस नैतिक संदर्भ में यह शब्द केवल सच बोलने की आदत नहीं, बल्कि सत्य पर टिके व्यापक चरित्र और खराई को व्यक्त करता है। ‘सत्यनिष्ठा’ इस अर्थ को स्वाभाविक हिन्दी में रखती है, जबकि ‘सत्य’ को पाठ-टिप्पणी में वास्तविक विकल्प के रूप में सुरक्षित रखा गया है।
- source_word: παρὰ θεοῦ
  choice: परमेश्वर से आती है
  rationale: सम्बन्धकारक के साथ παρά यहाँ स्रोत बताता है। हिन्दी में ‘से आती है’ इस उत्पत्ति-संबंध को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: σωτῆρος αὐτῶν
  choice: उनके उद्धारकर्ता
  rationale: σωτήρ का धार्मिक और प्रसंगानुकूल अर्थ ‘उद्धारकर्ता’ है; αὐτῶν को बहुवचन ‘धर्मियों’ से जोड़ते हुए ‘उनके’ रखा गया है।
- source_word: αὐλίζεται
  choice: आकर नहीं ठहरता
  rationale: क्रिया में रात बिताने, ठहरने या बसेरा करने का ठोस भाव है। ‘आकर नहीं ठहरता’ पाप को घर में टिकने वाले अतिथि के रूप में प्रस्तुत करने वाली उपमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν οἴκῳ δικαίου
  choice: धर्मी के घर में
  rationale: यूनानी एकवचन को एकवचन रखा गया है। हिन्दी में ‘धर्मी’ सामान्यतः व्यक्ति को स्पष्ट रूप से दर्शाता है, इसलिए अनावश्यक रूप से ‘पुरुष’ जोड़ने की जरूरत नहीं है।
- source_word: ἁμαρτία ἐφʼ ἁμαρτίαν
  choice: पाप पर पाप
  rationale: यह शब्दावली पापों के लगातार जमा होते जाने का जोरदार प्रभाव उत्पन्न करती है; शाब्दिक पुनरावृत्ति हिन्दी में भी संक्षिप्त और प्रभावी है।
