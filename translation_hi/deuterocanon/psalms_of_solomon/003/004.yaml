  yaml_path: translation/deuterocanon/psalms_of_solomon/003/004.yaml
  text: The righteous man will not disdain being disciplined by the Lord[c][b][a]; his delight is continually before the Lord.
translation:
  language: hi
  text: धर्मी व्यक्ति प्रभु द्वारा अनुशासित होने को तुच्छ नहीं समझेगा[a]; उसका आनंद निरन्तर प्रभु के सामने रहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिए गए यूनानी पाठ में δίκαιας παιδευόμενους रूप व्याकरण की दृष्टि से असामान्य हैं। पाठ का सम्भावित/स्वीकार किया गया रूप δίκαιος παιδευόμενος है, अर्थात् ‘धर्मी व्यक्ति ... अनुशासित होता हुआ।’ इसलिए मुख्य पाठ का अनुवाद इसी अर्थ के अनुसार किया गया है।
    reason: textual_variant
  - marker: b
    text: 'यदि दिए गए असामान्य पाठ को ज्यों का त्यों माना जाए, तो एक वैकल्पिक अनुवाद सम्भव है: ‘उसकी [अर्थात् प्रभु की] कृपा प्रभु द्वारा अनुशासित किए जा रहे धर्मियों की उपेक्षा नहीं करेगी; वह निरन्तर प्रभु के सामने रहती है।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλιγωρήσει
  choice: तुच्छ न समझेगा
  rationale: ὀλιγωρέω का मूल भाव किसी बात को कम महत्त्व देना या उसकी उपेक्षा करना है। यहाँ नीतिवचन 3:11 की पृष्ठभूमि में ‘तुच्छ न समझेगा’ स्वाभाविक है और भावी काल को भी बनाए रखता है।
- source_word: δίκαιας / सम्भावित δίκαιος
  choice: धर्मी जन
  rationale: दिए गए पाठ में δίκαιας व्याकरण की दृष्टि से असामान्य है, जबकि प्रसंग और प्रमाणित संशोधन δίκαιος (‘धर्मी’) की ओर संकेत करते हैं। ‘धर्मी जन’ लिंग पर अनावश्यक बल दिए बिना अभिप्रेत कर्ता व्यक्त करता है।
- source_word: παιδευόμενους / सम्भावित παιδευόμενος
  choice: अनुशासन पाना
  rationale: παιδεύω में शिक्षा, सुधार और ताड़ना के द्वारा प्रशिक्षण का संयुक्त भाव है। ‘अनुशासन पाना’ आधुनिक हिन्दी में सुधारात्मक प्रशिक्षण को स्पष्ट रखता है।
- source_word: εὐδοκία
  choice: प्रसन्नता
  rationale: εὐδοκία प्रसन्न इच्छा, संतोष या अनुग्रह का अर्थ दे सकता है। संशोधित वाक्य-संरचना में यह धर्मी जन की ‘प्रसन्नता’ है; फिर भी पाठगत रूप के कारण ‘अनुग्रह’ वाला विकल्प टिप्पणी में सुरक्षित रखा गया है।
- source_word: διὰ παντός
  choice: निरन्तर
  rationale: यह पदबंध लगातार बने रहने का भाव व्यक्त करता है; ‘निरन्तर’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: ἔναντι Κυρίου
  choice: प्रभु के सामने
  rationale: यह अनुवाद यूनानी के स्थानिक-संबंधपरक बिंब को सीधे बनाए रखता है।
- source_word: κυρίου / Κυρίου
  choice: प्रभु
  rationale: दोनों स्थानों पर ईश्वर-संदर्भित κύριος के लिए बाइबलीय हिन्दी का प्रचलित और तटस्थ शब्द ‘प्रभु’ रखा गया है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος ईश्वर के लिए प्रयुक्त है। ‘प्रभु’ बाइबलीय निरन्तरता बनाए रखता है और किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: पहले उपवाक्य का कर्ता
  choice: धर्मी जन
  alternative: उसका अनुग्रह धर्मियों की उपेक्षा न करेगा
  rationale: प्रसंग, नीतिवचन 3:11 की प्रतिध्वनि और सम्भावित सही पाठ δίκαιος παιδευόμενος ‘धर्मी जन ... अनुशासन पाता हुआ’ का समर्थन करते हैं। फिर भी उपलब्ध दिए गए रूप δίκαιας παιδευόμενους के आधार पर εὐδοκία को कर्ता मानने की सम्भावना पाठ-टिप्पणी में सुरक्षित है।
- issue: εὐδοκία का सम्बन्ध
  choice: धर्मी जन की प्रसन्नता
  alternative: प्रभु का अनुग्रह/सुप्रसन्नता
  rationale: यदि पहले पद में δίκαιος कर्ता है, तो αὐτοῦ स्वाभाविक रूप से धर्मी जन की ओर लौटता है। असामान्य प्रेषित रूप दूसरी व्याख्या की अनुमति देता है, इसलिए उसे दबाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। ‘अनुशासन पाना’ सुधारात्मक शिक्षा और ताड़ना दोनों का भाव देता है। पाठगत कठिनाई को मुख्य वाक्य में बोझिल किए बिना पादटिप्पणियों में स्पष्ट रूप से सुरक्षित रखा गया है।
