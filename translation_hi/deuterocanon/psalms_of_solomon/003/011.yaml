- source_word: καταρᾶται
  choice: कोसता है
  rationale: यह क्रिया शाप देने या कोसने को व्यक्त करती है। अपने जीवन और जन्म के दिन को धिक्कारने के इस प्रसंग में ‘कोसता है’ सहज और अर्थपूर्ण है।
- source_word: ζωὴν αὐτοῦ
  choice: अपने जीवन को
  rationale: कर्ता की स्वयं की जीवनावस्था अभिप्रेत है; हिन्दी में आत्मवाचक ‘अपने’ संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: τὴν ἡμέραν γενέσεως αὐτοῦ
  choice: अपने जन्म के दिन को
  rationale: यह वाक्यांश उसके जन्म लेने के दिन को सूचित करता है; यह चयन यूनानी संरचना और गंभीर शैली दोनों के निकट है।
- source_word: ὠδῖνας μητρός
  choice: अपनी माँ की प्रसव-पीड़ा को
  rationale: ὠδῖνας प्रसव के समय की पीड़ाओं को दर्शाता है। हिन्दी में ‘प्रसव-पीड़ा’ संक्षिप्त, आधुनिक और गरिमापूर्ण है; बहुवचन का सामूहिक अर्थ एकवचन में स्वाभाविक रूप से व्यक्त होता है।
