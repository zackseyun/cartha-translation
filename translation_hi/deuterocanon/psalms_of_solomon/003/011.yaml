- source_word: προσέκοψεν
  choice: ठोकर खाकर गिर पड़ा
  rationale: προσκόπτω में ठोकर खाने या किसी बाधा से टकराने का मूल बिंब है और प्रसंग में उसका परिणाम पतन अथवा विपत्ति हो सकता है। यह हिन्दी अभिव्यक्ति बिंब और गंभीर परिणाम दोनों को स्वाभाविक रूप से रखती है।
