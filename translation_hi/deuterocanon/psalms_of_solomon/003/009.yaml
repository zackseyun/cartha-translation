  yaml_path: translation/deuterocanon/psalms_of_solomon/003/009.yaml
  text: He makes atonement for unintentional sin by fasting and humbling his soul[c][b][a];
translation:
  language: hi
  text: वह अनजाने में किए गए पाप के लिए उपवास रखकर और अपने प्राण को दीन करके प्रायश्चित करता है[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अज्ञान के लिए”; आशय अनजाने में की गई भूल या पाप हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी क्रिया एओरिस्ट रूप में है; इस प्रसंग में इसे सामान्य या बार-बार होने वाले आचरण के रूप में भी समझा जा सकता है: “उसने प्रायश्चित किया।”'
    reason: grammatical_note
  - marker: c
    text: “अपने प्राण को दीन करना” आत्म-संयम या स्वयं को कष्ट देने का बाइबिलीय मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐξιλάσατο
  choice: प्रायश्चित करता है
  rationale: क्रिया में पाप के निवारण का धार्मिक-सांस्कारिक भाव है। यद्यपि रूप भूतकालिक एओरिस्ट है, प्रसंग में यह धर्मी व्यक्ति के सामान्य आचरण का वर्णन करता है; इसलिए हिन्दी का सामान्य वर्तमान स्वाभाविक है।
- source_word: περὶ ἀγνοίας
  choice: अनजाने में हुए पाप के लिए
  rationale: ἀγνοία का मूल अर्थ ‘अज्ञान/अनजानी भूल’ है, पर ἐξιλάσατο के साथ धार्मिक संदर्भ में यह अनजाने में किए गए अपराध या पाप को सूचित करता है।
- source_word: ἐν νηστείᾳ
  choice: उपवास रखकर
  rationale: ἐν यहाँ रीति अथवा साधन बताता है। ‘उपवास रखकर’ आधुनिक हिन्दी में स्वाभाविक है और मूल का अर्थ स्पष्ट रखता है।
- source_word: ταπεινώσει ψυχὴν αὐτοῦ
  choice: अपने प्राण को दीन करेगा
  rationale: ταπεινώσει को भविष्यकालीन क्रिया के रूप में पढ़ना ψυχὴν को उसके कर्म के रूप में सहज रूप से समझाता है। ‘प्राण को दीन करना’ मूल के बाइबिलीय मुहावरे को सुरक्षित रखता है।
theological_decisions:
- issue: प्रायश्चित और उपवास का संबंध
  choice: ‘उपवास रखकर प्रायश्चित करता है’—साधन/रीति का संबंध खुला रखा गया है
  alternative: ‘उपवास के साथ प्रायश्चित करता है’
  rationale: ἐν साधन या रीति दोनों व्यक्त कर सकता है। अनुवाद मूल के निकट रहते हुए यह नहीं जोड़ता कि उपवास अपने आप किस प्रकार प्रायश्चित को प्रभावी बनाता है।
- issue: ταπεινώσει का व्याकरणिक विश्लेषण
  choice: 'भविष्यकालीन क्रिया: ‘दीन करेगा’'
  alternative: 'भाववाचक संज्ञा मानकर: ‘अपने प्राण को दीन करके’'
  rationale: ψυχὴν का कर्मकारक रूप भविष्यकालीन क्रिया-पाठ का प्रबल समर्थन करता है। इससे मूल में उपस्थित काल-परिवर्तन भी बना रहता है, उसे चुपचाप समानांतर क्रियाविशेषण में नहीं बदला जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रायश्चित’ धार्मिक-सांस्कारिक अर्थ को बनाए रखता है। ‘अपने प्राण को दीन करना’ कुछ असामान्य लग सकता है, पर जानबूझकर मूल के बाइबिलीय मुहावरे और उसकी सांस्कृतिक बनावट को सुरक्षित रखता है।
