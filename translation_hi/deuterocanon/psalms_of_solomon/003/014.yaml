  text: and he will certainly not be remembered when he visits the righteous[a][b][c].
translation:
  language: hi
  text: और जब वह धर्मियों की सुधि लेगा, तब पापी को निश्चय ही याद नहीं किया जाएगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘याद नहीं किया जाएगा’ का विषय व्यक्त नहीं है। संदर्भ के अनुसार यहाँ ‘पापी’ समझा गया है; इसे ‘उसका विनाश निश्चय ही याद नहीं किया जाएगा’ भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘सुधि लेगा’ का अर्थ ‘धर्मियों से भेंट करेगा,’ ‘उनकी देखभाल करेगा’ या ‘उन पर ध्यान देगा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: निश्चय ही नहीं
  rationale: दोहरा निषेध अत्यंत दृढ़ है; यह अभिव्यक्ति उसके बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: μνησθήσεται
  choice: याद नहीं किया जाएगा
  rationale: यूनानी क्रिया कर्मवाच्य है। सीधा कर्मवाच्य अनुवाद मूल के अर्थ और इस प्रश्न की कुछ अस्पष्टता बनाए रखता है कि किसे याद नहीं किया जाएगा।
- source_word: ἐπισκέπτηται
  choice: सुधि लेगा
  rationale: इस क्रिया में केवल मिलने जाने के साथ ध्यान देने, देखभाल करने या निरीक्षण करने का भाव भी हो सकता है। ‘सुधि लेना’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δικαίους
  choice: धर्मियों
  rationale: नैतिक-धार्मिक संदर्भ में यह δικαίους का सीधा, प्रतिष्ठित और सहज हिन्दी रूप है।
- source_word: implicit subject of μνησθήσεται
  choice: पापी को
  rationale: पूर्ववर्ती संदर्भ में पापी के भाग्य का वर्णन चल रहा है, इसलिए उसे निहित विषय मानना सबसे संगत है; फिर भी यूनानी पंक्ति में विषय स्पष्ट रूप से व्यक्त नहीं है, इसलिए वैकल्पिक संभावना पाद-टिप्पणी में रखी गई है।
theological_decisions:
- issue: ἐπισκέπτηται का निहित कर्ता
  choice: ‘वह’ को अनिर्दिष्ट रखा गया है
  alternative: स्पष्ट रूप से ‘परमेश्वर’ कहना
  rationale: धर्मियों की सुधि लेने वाला संदर्भतः परमेश्वर हो सकता है, पर इस पंक्ति में उसका नाम नहीं है। मूल की निहितता और धार्मिक तनाव बनाए रखने के लिए नाम जोड़ा नहीं गया।
- issue: μνησθήσεται का निहित विषय
  choice: पापी
  alternative: उसका विनाश
  rationale: पूर्व पद से पापी के विषय की निरंतरता और दुष्ट की स्मृति मिटने की बाइबलीय धारणा ‘पापी’ का समर्थन करती है; फिर भी निकटवर्ती स्त्रीलिंग संज्ञा ‘विनाश’ के कारण दूसरा व्याकरणिक संबंध संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। ‘सुधि लेना’ ने यूनानी क्रिया के भेंट और देखभाल—दोनों भावों को समेटा है। सर्वनाम ‘वह’ जानबूझकर अनिर्दिष्ट है, क्योंकि मूल पंक्ति कर्ता का नाम नहीं बताती।
