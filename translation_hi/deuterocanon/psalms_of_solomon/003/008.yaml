- source_word: ἐπισκέπτεται
  choice: जाँच करता रहता है
  rationale: अपने ही घर के संदर्भ में यह क्रिया साधारण भेंट नहीं, बल्कि सक्रिय निरीक्षण और देखरेख व्यक्त करती है।
- source_word: διὰ παντός
  choice: लगातार
  rationale: यह पदबंध निरंतर या नियमित रूप से होने वाली क्रिया बताता है।
- source_word: ὁ δίκαιος
  choice: धर्मी
  rationale: एकवचन नैतिक आदर्श को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; आगे के पुल्लिंग संकेत से व्यक्ति का एकवचन रूप स्पष्ट रहता है।
- source_word: τὸν οἶκον αὐτοῦ
  choice: अपने घर की
  rationale: αὐτοῦ का संबंध उसी धर्मी व्यक्ति से है; हिन्दी में ‘अपने’ यह आत्मवाचक संबंध स्पष्ट करता है।
- source_word: τοῦ ἐξᾶραι
  choice: ताकि ... दूर करे
  rationale: सकार्थक संबंधवाचक infinitive यहाँ उद्देश्य व्यक्त करता है।
- source_word: ἀδικίαν
  choice: अधर्म
  rationale: यहाँ शब्द केवल सामाजिक अन्याय नहीं, व्यापक नैतिक बुराई को सूचित करता है; ‘अधर्म’ धार्मिक-काव्यात्मक संदर्भ में स्वाभाविक है।
- source_word: ἐν παραπτώματι αὐτοῦ
  choice: अपने अपराध के समय
  rationale: ἐν की अस्पष्टता को पूर्णतः समाप्त किए बिना संभावित परिस्थितिजन्य/कालिक अर्थ व्यक्त किया गया है; ‘अपने’ से अपराध का स्वाभाविक संदर्भ धर्मी व्यक्ति की ओर रहता है।
theological_decisions:
- issue: क्या पद यह मानता है कि धर्मी व्यक्ति भी अपराध कर सकता है
  choice: अनुवाद इस संभावना को खुला रखता है कि धर्मी व्यक्ति अपराध करता है और तब अधर्म को दूर करने के लिए अपने घर की जाँच करता है।
  alternative: वाक्य को ऐसा बनाया जा सकता था कि अपराध किसका है यह अस्पष्ट रहे, या धर्मी व्यक्ति के निष्पाप होने का संकेत मिले।
  rationale: παραπτώματι αὐτοῦ में सर्वनाम का सबसे स्वाभाविक संबंध धर्मी व्यक्ति से है। अतः धार्मिक तनाव को मिटाने के बजाय अनुवाद पश्चात्ताप और सुधार की संभावना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और संक्षिप्त शैली रखी गई है। ‘जाँच करता रहता है’ सक्रिय निरीक्षण को और ‘लगातार’ आदतन निरंतरता को व्यक्त करता है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
