  yaml_path: translation/deuterocanon/psalms_of_solomon/003/002.yaml
  text: Sing a hymn and praise to God[a], the One worthy of praise. Sing, and keep watch for his watching[c][b], for a psalm to God from a good heart is good.
translation:
  language: hi
  text: परमेश्वर के लिए, जो प्रशंसा के योग्य है[a], भजन और स्तुति गाओ। गाओ और उसकी जागरूकता के लिए जागते रहो[b], क्योंकि भले हृदय से परमेश्वर के लिए भजन भला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रशंसित परमेश्वर” अथवा “वह परमेश्वर जिसकी प्रशंसा की जाती है।”
    reason: lexical_alternative
  - marker: b
    text: यह यूनानी पदबंध असामान्य है। इसका अनुवाद “उसकी जागरूकता के प्रति जागरूक रहो” या “उसकी चौकसी के लिए चौकस रहो” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕμνον καὶ αἶνον
  choice: भजन और स्तुति
  rationale: 'दोनों यूनानी संज्ञाओं को अलग-अलग रखा गया है: ὕμνος स्तुतिपरक गीत है और αἶνος स्तुति। हिन्दी में यह युग्म स्वाभाविक भी है और मूल की पुनरुक्ति को मिटाता नहीं।'
- source_word: ψάλλετε / ψάλλε
  choice: गाओ
  rationale: आराधना के प्रसंग में ψάλλω का आशय गीत गाने से है। हिन्दी का “गाओ” आदेशात्मक बल बनाए रखता है; संयोग से यह बहुवचन और एकवचन, दोनों संबोधनों में समान रूप होने के कारण यूनानी में हुए वचन-परिवर्तन को कृत्रिम ढंग से नहीं सुलझाता।
- source_word: τῷ θεῷ τῷ αἰνετῷ
  choice: प्रशंसा के योग्य परमेश्वर
  rationale: αἰνετός का अर्थ ‘प्रशंसित’ अथवा ‘प्रशंसा के योग्य’ हो सकता है। मुख्य पाठ में सहज और प्रसंगानुकूल ‘प्रशंसा के योग्य’ रखा गया है तथा दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: γρηγόρησον ἐπὶ τὴν γρηγόρησιν αὐτοῦ
  choice: उसके जागते रहने के लिए जागते रहो
  rationale: क्रिया और उसी मूल से बनी संज्ञा के असामान्य संयोजन को जानबूझकर कुछ हद तक अक्षुण्ण रखा गया है। इससे जागने/सावधान रहने की पुनरुक्ति बनी रहती है और अस्पष्ट संबंध का अतिनिर्णय नहीं होता।
- source_word: ψαλμός
  choice: भजन
  rationale: धार्मिक गीत के साहित्यिक और उपासना-संबंधी स्वरूप को व्यक्त करने के लिए ‘भजन’ उपयुक्त आधुनिक हिन्दी है।
- source_word: ἐξ ἀγαθῆς καρδίας
  choice: भले हृदय से
  rationale: ἀγαθός का मूल अर्थ ‘भला/अच्छा’ है। ‘शुद्ध’ जैसे अधिक विशिष्ट नैतिक अर्थ को जोड़े बिना स्रोत का सीधा भाव रखा गया है।
- source_word: ἀγαθὸς ... ἀγαθῆς
  choice: भला ... भले
  rationale: यूनानी में ἀγαθός की जानबूझकर की गई पुनरावृत्ति को हिन्दी में भी रखा गया है, ताकि पद का सरल अलंकारिक संतुलन बना रहे।
theological_decisions:
- issue: αἰνετός में कर्तृवाच्य/भाववाच्य अर्थ की अस्पष्टता
  choice: प्रशंसा के योग्य
  alternative: जिसकी प्रशंसा की जाती है / प्रशंसित
  rationale: मुख्य पाठ के लिए ‘प्रशंसा के योग्य’ अधिक स्वाभाविक है, पर यूनानी में ‘प्रशंसित’ अर्थ भी संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: परमेश्वर के ‘जागते रहने’ से मानवीय जागरूकता का संबंध
  choice: संबंध को ‘के लिए’ के साथ खुला और असामान्य रहने दिया गया
  alternative: उसकी चौकसी के प्रत्युत्तर में चौकस रहो
  rationale: मूल यूनानी पदबंध असामान्य है और यह स्पष्ट नहीं करता कि आशय उद्देश्य, दिशा, प्रत्युत्तर या अनुरूपता है। अधिक व्याख्यात्मक अनुवाद theological संबंध को अनावश्यक रूप से निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘भजन और स्तुति’ तथा ‘भला ... भले’ मूल की युग्मात्मकता और पुनरावृत्ति बचाते हैं। दूसरे वाक्य की हल्की असामान्यता मूल यूनानी की वास्तविक कठिनाई को छिपाने के बजाय जानबूझकर सुरक्षित रखती है।
