source:
  edition: lxx-swete-1909
  text: ἔπεσεν, ὅτι πονηρὸν τὸ πτῶμα αὐτοῦ, καὶ οὐκ ἀνιστήσεται. ἡ ἀπώλεια τοῦ ἁμαρτωλοῦ εἰς τὸν αἰῶνα,
  language: Greek
  pages:
  - 792
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/013.yaml
  text: He has fallen[a], because his fall is evil, and he will not rise. The destruction of the sinner is forever[b],
translation:
  language: hi
  text: वह गिर पड़ा है, क्योंकि उसका गिरना भयंकर[a] है, और वह नहीं उठेगा। पापी का विनाश सदा के लिए[b] है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका पतन बुरा है”; अथवा, “उसका शव घृणित है।”
    reason: πτῶμα का अर्थ ‘गिरना/पतन’ या ‘शव’ हो सकता है, और πονηρόν यहाँ ‘भयंकर’ अथवा नैतिक अर्थ में ‘बुरा’ समझा जा सकता है।
  - marker: b
    text: शाब्दिक रूप से, “युग तक।”
    reason: εἰς τὸν αἰῶνα स्थायी अवधि को सूचित करता है, पर इसका अधिक शाब्दिक रूप ‘युग तक’ है।
lexical_decisions:
- source_word: ἔπεσεν
  choice: वह गिर पड़ा है
  rationale: पूर्ण पक्ष वाला यह स्वाभाविक हिन्दी रूप घटित पतन और उसके वर्तमान परिणाम, दोनों को व्यक्त करता है।
- source_word: πονηρὸν τὸ πτῶμα αὐτοῦ
  choice: उसका गिरना भयंकर है
  rationale: ἔπεσεν के साथ शब्द-संबंध बनाए रखते हुए πτῶμα को यहाँ ‘गिरना’ समझा गया है। इस संदर्भ में πονηρόν विपत्ति की गंभीरता या भयावहता बता सकता है; इसलिए ‘भयंकर’ स्वाभाविक है, जबकि नैतिक अर्थ ‘बुरा’ को पाद-टिप्पणी में रखा गया है।
- source_word: ἀνιστήσεται
  choice: वह नहीं उठेगा
  rationale: यह सीधा और गंभीर अनुवाद है; यूनानी में स्पष्ट रूप से उपस्थित न होने के कारण ‘फिर’ नहीं जोड़ा गया।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: ‘विनाश’ स्पष्ट, गंभीर और सामान्य आधुनिक हिन्दी में स्वाभाविक है; यह ‘नाश’ या ‘बरबादी’ की अपेक्षा मूल शब्द का भार बेहतर बनाए रखता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: न्याय और अपरिवर्तनीय पतन के इस संदर्भ में यह पदबंध स्थायी अवधि को व्यक्त करता है; शाब्दिक कालगत विकल्प पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: οὐκ ἀνιστήσεται में पुनरुत्थान-संबंधी अर्थ की संभावित प्रतिध्वनि
  choice: वह नहीं उठेगा
  alternative: वह फिर नहीं उठेगा
  rationale: ‘उठेगा’ पतन से न उठ पाने और व्यापक पुनरुत्थान-संबंधी प्रतिध्वनि, दोनों की संभावना खुली रखता है। ‘फिर’ जोड़ने से वह बात स्पष्ट हो जाती जो यूनानी में अलग शब्द के रूप में नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गिर पड़ा है/गिरना’ से यूनानी ἔπεσεν/πτῶμα का शब्द-संबंध यथासंभव सुरक्षित है। स्रोत में पद के अंत की निरंतरता-सूचक अल्पविराम भी रखा गया है।
