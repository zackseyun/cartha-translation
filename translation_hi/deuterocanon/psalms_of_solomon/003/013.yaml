  source_fidelity: 'The Hindi faithfully renders the Greek sequence: completed fall (ἔπεσεν), the severe/evil character of the fall (πονηρὸν τὸ πτῶμα αὐτοῦ), inability to rise (οὐκ ἀνιστήσεται), and the enduring destruction of the sinner (ἡ ἀπώλεια τοῦ ἁμαρτωλοῦ εἰς τὸν αἰῶνα). “भयंकर” is a defensible contextual rendering of πονηρόν with πτῶμα and avoids implying that an event itself is morally culpable. The alternative semantic possibilities are retained in the note.'
