  text: But those who fear the Lord will rise to eternal life, and their life in the light of the Lord will never cease.
translation:
  language: hi
  text: परन्तु जो प्रभु का भय मानते हैं, वे अनन्त जीवन के लिए जी उठेंगे, और प्रभु के प्रकाश में उनका जीवन फिर कभी समाप्त नहीं होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβούμενοι
  choice: जो ... भय मानते हैं
  rationale: वर्तमान कृदन्त यहाँ संज्ञात्मक रूप में उस समूह को दर्शाता है जिसकी स्थायी मनोवृत्ति प्रभु के प्रति भय की है। ‘भय मानना’ बाइबलीय श्रद्धा और भय—दोनों के भार को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: κύριον / Κυρίου
  choice: प्रभु / प्रभु के
  rationale: κύριος यहाँ परमेश्वर के लिए प्रयुक्त है; हिन्दी में ‘प्रभु’ इसका स्वाभाविक और गरिमापूर्ण समतुल्य है।
- source_word: ἀναστήσονται
  choice: जी उठेंगे
  rationale: भविष्यत् मध्यम रूप उठने का अर्थ देता है। ‘जी उठेंगे’ प्रसंग में निहित पुनरुत्थान के अर्थ को स्पष्ट करता है, पर यूनानी में न पाए जाने वाले कर्मवाच्य ‘जिलाए जाएंगे’ को नहीं जोड़ता।
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए
  rationale: εἰς यहाँ गंतव्य अथवा परिणाम व्यक्त करता है। ‘अनन्त जीवन के लिए’ आधुनिक हिन्दी में स्वाभाविक है और युगान्तकारी आशय सुरक्षित रखता है।
- source_word: ἐν φωτὶ Κυρίου
  choice: प्रभु के प्रकाश में
  rationale: यह सीधा पूर्वसर्गीय अनुवाद मूल बिंब और प्रभु से प्रकाश के संबंध, दोनों को बनाए रखता है।
- source_word: οὐκ ἐκλείψει ἔτι
  choice: फिर कभी समाप्त नहीं होगा
  rationale: ἐκλείπω का अर्थ चूकना, समाप्त होना या लुप्त होना हो सकता है। जीवन के विषय में ‘समाप्त नहीं होगा’ स्वाभाविक है, और ‘फिर कभी’ οὐκ ... ἔτι की भावी निरंतरता को व्यक्त करता है।
theological_decisions:
- issue: ἀναστήσονται εἰς ζωὴν αἰώνιον में पुनरुत्थान का आशय
  choice: ‘अनन्त जीवन के लिए जी उठेंगे’ द्वारा भावी पुनरुत्थान को मुख्य पाठ में व्यक्त किया गया है।
  alternative: ‘अनन्त जीवन के लिए उठ खड़े होंगे’, जिसे सामान्य उत्थान के अर्थ में भी समझा जा सकता है।
  rationale: ἀναστήσονται और ‘अनन्त जीवन’ का संयुक्त प्रयोग सबसे स्वाभाविक रूप से युगान्तकारी पुनरुत्थान की ओर संकेत करता है; ‘जी उठेंगे’ इसे हिन्दी में स्पष्ट रखते हुए कर्तृवाच्य रूप बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और पाठयोग्य शैली। ‘परन्तु’ विरोधसूचक δέ को व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
