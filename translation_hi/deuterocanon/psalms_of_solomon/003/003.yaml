  text: The righteous will remember the Lord continually[c][b][a], with thanksgiving and vindicating the judgments of the Lord.
translation:
  language: hi
  text: धर्मी जन निरन्तर प्रभु को स्मरण करेंगे—धन्यवाद[a] के साथ और प्रभु के निर्णयों को न्यायपूर्ण ठहराते हुए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्तुति’ अथवा ‘स्वीकारोक्ति’ के साथ; यूनानी शब्द संदर्भ के अनुसार धन्यवाद, स्तुति या स्वीकारोक्ति का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘प्रभु के निर्णयों को न्यायोचित ठहराने में।’ इसका भाव उनके निर्णयों को न्यायपूर्ण मानने या सही ठहराने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: धर्मी जन
  rationale: विशेषण का संज्ञा के रूप में प्रयोग उन लोगों को दर्शाता है जिनकी पहचान धार्मिकता से है; ‘धर्मी जन’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: μνημονεύσουσιν
  choice: स्मरण करेंगे
  rationale: भविष्यकालीन क्रिया यहाँ प्रभु को लगातार याद रखने का भाव देती है; ‘स्मरण करेंगे’ उसके धार्मिक और मननशील स्वर को बनाए रखता है।
- source_word: διὰ παντός
  choice: निरन्तर
  rationale: यह यूनानी मुहावरा निरंतरता या हर समय बने रहने का अर्थ व्यक्त करता है।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: κύριος के सेप्टुआजिन्टीय और धार्मिक प्रयोग के लिए ‘प्रभु’ प्रचलित तथा उपयुक्त हिन्दी पद है।
- source_word: ἐν ἐξομολογήσει
  choice: धन्यवाद के साथ
  rationale: भजन-साहित्य के संदर्भ में ἐξομολόγησις प्रायः कृतज्ञतापूर्ण स्वीकार या धन्यवाद को व्यक्त करता है; समीपवर्ती पद में प्रयुक्त सामान्य ‘स्तुति’ से इसकी शब्दावली अलग है।
- source_word: δικαιώσει
  choice: न्यायपूर्ण ठहराते हुए
  rationale: यह संज्ञा ‘न्यायोचित ठहराने’ या ‘सही सिद्ध करने’ का भाव रखती है। निर्णयों के संदर्भ में हिन्दी का यह क्रियात्मक रूप स्पष्ट करता है कि धर्मी जन उन्हें न्यायपूर्ण मानते और घोषित करते हैं।
- source_word: τὰ κρίματα τοῦ κυρίου
  choice: प्रभु के निर्णयों
  rationale: κρίματα न्यायिक निर्णयों या न्याय के कार्यों को दर्शाता है; ‘निर्णयों’ से उसका न्यायिक अर्थ संक्षेप में बना रहता है।
theological_decisions:
- issue: प्रभु के निर्णयों के प्रति धर्मियों की प्रतिक्रिया
  choice: ‘न्यायपूर्ण ठहराते हुए’
  alternative: ‘प्रभु के निर्णयों के औचित्य-सिद्धि में’
  rationale: चुना गया रूप यह अर्थ स्पष्ट करता है कि धर्मी जन प्रभु के निर्णयों को उचित स्वीकार करते हैं; यह ऐसा अतिरिक्त दावा नहीं जोड़ता कि मनुष्य उन निर्णयों को वस्तुतः न्यायपूर्ण बनाते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘धर्मी जन’, ‘स्मरण’ और ‘प्रभु’ से भजनात्मक गरिमा बनी रहती है, जबकि संज्ञात्मक यूनानी वाक्यांश को ‘न्यायपूर्ण ठहराते हुए’ के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
