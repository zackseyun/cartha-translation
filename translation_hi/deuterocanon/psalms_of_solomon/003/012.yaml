  source_fidelity: The draft correctly preserves the plural force of ἁμαρτίας ἐφʼ ἁμαρτίαις as “पापों पर पापों” and renders αὐτοῦ appropriately with “अपने.” The dative phrase is naturally expressed in Hindi as the sphere, “अपने जीवन में,” while remaining compatible with the source’s sense of adding this accumulation to his life.
  naturalness: “पापों पर पाप बढ़ाए” is understandable, but “बढ़ाए” is less idiomatic here and less directly reflects προσέθηκεν (“added”). “जोड़ दिए” is natural modern Hindi and retains the completed aorist action.
  terminology: “पाप” is the standard, suitably elevated term for ἁμαρτία. The plural should remain explicit in both occurrences; it should not be flattened to singular.
  issues:
  - severity: low
    issue: The verb “बढ़ाए” is not the most natural Hindi equivalent in this cumulative construction.
    rationale: The Greek verb προστίθημι primarily means “add.” “पापों पर पापों जोड़ दिए” expresses both the lexical sense and the completed action more clearly.
  - severity: low
    issue: The footnote’s proposed wording “पापों से पाप जोड़ दिए” is awkward in Hindi and does not clearly represent the repeated ἐπί construction.
    rationale: A more literal alternative can use “पापों को पापों पर जोड़ दिया,” retaining the two plural nouns and the additive relation.
