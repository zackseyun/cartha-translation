lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: यूनानी में निश्चित पद के साथ यह ईश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: καθαρίζει
  choice: शुद्ध करता है
  rationale: यह वर्तमान काल की क्रिया तथा नैतिक-विधिक शुद्धि, दोनों की सम्भावना बनाए रखता है।
- source_word: πᾶν ἄνδρα
  choice: हर ... पुरुष
  rationale: एकवचन के साथ πᾶν का वितरणात्मक अर्थ ‘हर’ है, और ἄνδρα स्पष्ट रूप से पुल्लिंग ‘पुरुष’ है।
- source_word: ὅσιον
  choice: धर्मनिष्ठ
  rationale: यह शब्द ईश्वर के प्रति निष्ठावान और भक्तिपूर्ण आचरण का भाव व्यक्त करता है; ‘धर्मनिष्ठ’ आधुनिक हिन्दी में इस भाव को स्पष्ट रखता है।
- source_word: οἶκον
  choice: घर
  rationale: ‘घर’ भौतिक निवास और घराने, दोनों का संकेत दे सकता है तथा निकटवर्ती पदों में οἶκος की शब्दगत पुनरावृत्ति को बनाए रखता है।
theological_decisions:
- issue: ὅσιος में पवित्रता और भक्तिपूर्ण निष्ठा का संबंध
  choice: धर्मनिष्ठ
  alternative: पवित्र; भक्त
  rationale: मुख्य पाठ में नैतिक और भक्तिपूर्ण निष्ठा को व्यक्त किया गया है, जबकि पादटिप्पणी मूल शब्द की ‘पवित्र’ या ‘भक्त’ अर्थ-छाया को खुला रखती है।
- issue: οἶκος का दायरा
  choice: घर
  alternative: घराना; परिवार
  rationale: ‘घर’ मूल की निकटवर्ती पुनरावृत्ति बचाता है और जानबूझकर यह तय नहीं करता कि आशय भवन है या उसमें रहनेवाला परिवार।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। स्पष्ट पुल्लिंग संज्ञा को बनाए रखा गया है और ‘घर’ की मूल अर्थगत व्यापकता को पादटिप्पणी में दर्शाया गया है।
