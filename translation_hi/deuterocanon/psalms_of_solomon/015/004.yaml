  yaml_path: translation/deuterocanon/psalms_of_solomon/015/004.yaml
  text: And what is man able to do[a], except give thanks to your name?
translation:
  language: hi
  text: और मनुष्य क्या कर सकता है, सिवाय इसके कि तेरे नाम का धन्यवाद करे[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे नाम को माने’ अथवा ‘तेरे नाम की स्तुति करे।’ यूनानी क्रिया संदर्भ के अनुसार इनमें से किसी अर्थ में प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: क्या
  rationale: यह प्रश्न किसी व्यक्ति की पहचान नहीं, बल्कि मनुष्य की सामर्थ्य में रहने वाले कार्य के विषय में है।
- source_word: δυνατὸς
  choice: कर सकता है
  rationale: यहाँ शब्द शारीरिक बल के बजाय क्षमता व्यक्त करता है; हिन्दी में निहित क्रिया को जोड़कर अर्थ स्वाभाविक बनता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यह सामान्य प्रतिनिधिक एकवचन है; ‘मनुष्य’ आधुनिक हिन्दी में गरिमापूर्ण और समावेशी रूप से मानव व्यक्ति को व्यक्त करता है।
- source_word: εἰ μὴ
  choice: सिवाय इसके कि
  rationale: 'आलंकारिक प्रश्न में यह अपवादसूचक पदबंध है: मनुष्य इसके अतिरिक्त और क्या कर सकता है।'
- source_word: ἐξομολογήσασθαι
  choice: धन्यवाद करे
  rationale: बाइबिलीय यूनानी में परमेश्वर के नाम के संबंध में यह क्रिया धन्यवादपूर्ण स्तुति का भाव रख सकती है; संदर्भ के लिए ‘धन्यवाद करे’ उपयुक्त है, जबकि अन्य वास्तविक अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: τῷ ὀνόματί σου
  choice: तेरे नाम का
  rationale: यूनानी दत्तिव का लक्ष्य परमेश्वर का नाम है। स्वाभाविक हिन्दी में ‘नाम का धन्यवाद करना’ उसी बाइबिलीय भाव को व्यक्त करता है।
