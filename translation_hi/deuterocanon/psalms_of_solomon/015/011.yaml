translation:
  language: hi
  text: और पापियों का उत्तराधिकार विनाश और अंधकार है, और उनका अधर्म नीचे अधोलोक तक उनका पीछा करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका अधर्म उन्हें नीचे अधोलोक तक खदेड़ेगा।”
    reason: διώξεται के ‘पीछा करने’ के बिंब को अधिक बलयुक्त ‘खदेड़ने’ से व्यक्त करने का वैकल्पिक हिन्दी रूप; “नीचे अधोलोक तक” ἕως ᾅδου κάτω को बनाए रखता है।
lexical_decisions:
- source_word: κληρονομία
  choice: उत्तराधिकार
  rationale: यह यूनानी शब्द के विरासत अथवा प्राप्त हिस्से के ठोस भाव को बनाए रखता है और बताता है कि पापियों के हिस्से में अंततः क्या आता है।
- source_word: ἁμαρτωλῶν
  choice: पापियों
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन का स्वाभाविक और सीधा हिन्दी समतुल्य।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: यह घोर नाश और बरबादी का भाव स्पष्ट करता है, बिना अनावश्यक रूप से कोई विशिष्ट धर्मशास्त्रीय अर्थ जोड़ने के।
- source_word: σκότος
  choice: अंधकार
  rationale: यह मूल बिंब तथा उसके नैतिक और अंतकालिक संकेत, दोनों को सुरक्षित रखता है।
- source_word: ἀνομία
  choice: अधर्मता
  rationale: आधुनिक हिन्दी में यह व्यवस्था-विरोधी और दुष्ट आचरण के भाव को संक्षेप में व्यक्त करता है; केवल सामान्य बुराई कहकर अर्थ को अत्यधिक व्यापक नहीं बनाता।
- source_word: διώξεται
  choice: पीछा करते हुए ... ले जाएगी
  rationale: भविष्यकाल और निरंतर पीछा करने के सजीव बिंब को बनाए रखते हुए हिन्दी में गंतव्य तक पहुँचाने का निहितार्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἕως ᾅδου κάτω
  choice: नीचे अधोलोक तक
  rationale: ‘तक’ ἕως की सीमा, ‘अधोलोक’ ᾅδης अर्थात मृतकों के लोक, और ‘नीचे’ κάτω की अधोदिशा को सुरक्षित रखते हैं।
theological_decisions:
- issue: ᾅδης का अनुवाद ‘अधोलोक’ किया जाए या ‘नरक’
  choice: अधोलोक
  alternative: नरक
  rationale: मूल यूनानी ᾅδης मृतकों के लोक को सूचित करता है; ‘नरक’ कहना इसे गेहन्ना अथवा अंतिम दंड की अधिक विशिष्ट अवधारणा में मिला सकता है।
- issue: ἀνομία को ‘अधर्मता’ कहा जाए या ‘व्यवस्था-विहीनता’
  choice: अधर्मता
  alternative: व्यवस्था-विहीनता
  rationale: ‘अधर्मता’ पठनीय और प्रतिष्ठित हिन्दी है तथा ईश्वरीय व्यवस्था के उल्लंघन का भाव रखती है; ‘व्यवस्था-विहीनता’ अधिक शाब्दिक होते हुए यहाँ अस्वाभाविक और सामाजिक अव्यवस्था-केंद्रित लग सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सुबोध शैली। ‘अधोलोक’ को ‘नरक’ पर वरीयता देकर मूल यूनानी का भेद सुरक्षित रखा गया है।
