base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/006.yaml
  text: The one who does these things will never be shaken by evil[d][c][b][a]; a flame of fire and the wrath of the unrighteous will not touch him.
translation:
  language: hi
  text: जो ये बातें करता है, वह बुराई और आग की ज्वाला से कभी नहीं डिगेगा[a][b]; अधर्मियों के विरुद्ध क्रोध उसे नहीं छुएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, दूसरे वाक्य-विभाजन के अनुसार: “वह बुराई से कभी नहीं डिगेगा; आग की ज्वाला और अधर्मियों के विरुद्ध क्रोध उसे नहीं छुएँगे।”'
    reason: syntactic_alternative
  - marker: b
    text: “आग की ज्वाला” यूनानी की सजीव अभिव्यक्ति है; इसे “धधकती ज्वाला” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पदबंध का अर्थ “अधर्मियों का क्रोध” भी हो सकता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὁ ποιῶν ταῦτα
  choice: जो ये काम करता है
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को सामान्य, एकवचन कर्ता के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; ταῦτα का संकेत पिछले प्रसंग में बताए कामों की ओर है।
- source_word: οὐ σαλευθήσεται εἰς τὸν αἰῶνα
  choice: सदा अडिग रहेगा
  rationale: σαλεύω के निष्क्रिय भाव—हिलाए या अस्थिर किए जाने—और εἰς τὸν αἰῶνα की स्थायी निषेधात्मक शक्ति, दोनों को सहज हिन्दी में समेटता है।
- source_word: ἀπὸ κακοῦ, φλογὸς πυρὸς
  choice: बुराई और आग की ज्वाला से
  rationale: φλογός संबंधकारक है और उसे पूर्ववर्ती ἀπό के अधीन κακοῦ के साथ समानांतर पढ़ना व्याकरणतः सशक्त है। इसलिए दोनों उन शक्तियों के रूप में व्यक्त हैं जो धर्मी को डिगा नहीं सकेंगी।
- source_word: φλογὸς πυρὸς
  choice: आग की ज्वाला
  rationale: यूनानी संबंधकारक पदबंध की सजीव, कुछ हद तक सामी अभिव्यक्ति को हिन्दी में स्वाभाविक रहते हुए बनाए रखता है।
- source_word: ὀργὴ ἀδίκων
  choice: अधर्मियों पर आनेवाला क्रोध
  rationale: आसपास के न्याय-संबंधी प्रसंग के अनुसार ἀδίκων को वस्तुगत संबंधकारक मानता है—अर्थात वह क्रोध जिसका लक्ष्य अधर्मी हैं—पर रूपगत दूसरी संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οὐχ ἅψεται αὐτοῦ
  choice: उसे नहीं छुएगा
  rationale: ἅπτομαι का सीधा अर्थ ‘छूना’ है और यहाँ सुरक्षा के आशय को स्पष्ट तथा संक्षिप्त ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἀπὸ κακοῦ में κακόν नैतिक ‘बुराई’ है या सामान्य ‘हानि’।
  choice: बुराई से
  alternative: हानि से
  rationale: ‘बुराई’ नैतिक और विनाशकारी दोनों आयामों को खुला रखती है; ‘हानि’ भी संभव है और पादटिप्पणी में दी गई है।
- issue: ὀργὴ ἀδίκων में ἀδίκων कर्तृवाचक है या कर्मवाचक संबंधकारक।
  choice: अधर्मियों पर आनेवाला क्रोध
  alternative: अधर्मियों का क्रोध
  rationale: न्याय के निकट प्रसंग में अधर्मियों को लक्ष्य करने वाला क्रोध अधिक संगत है, किंतु यूनानी पदबंध अपने आप में दोनों अर्थों की अनुमति देता है; इसलिए वैकल्पिक अर्थ स्पष्ट रूप से दर्ज है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘अडिग रहेगा’ शब्दशः निष्क्रिय रचना की अपेक्षा हिन्दी में अधिक स्वाभाविक है और स्थिरता की छवि बनाए रखता है। विरामचिह्नों द्वारा पहले खंड में बुराई तथा आग की ज्वाला को ἀπό से जोड़ा गया है, जबकि दूसरे खंड में क्रोध को ἅψεται का कर्ता रखा गया है।
