lexical_decisions:
- source_word: σημεῖον
  choice: चिह्न
  rationale: ‘चिह्न’ किसी पहचानसूचक संकेत या निशान को स्वाभाविक रूप से व्यक्त करता है और निकटवर्ती काव्यात्मक समानांतर में उसी यूनानी शब्द की पुनरावृत्ति बनाए रखने के लिए उपयुक्त है।
- source_word: ἀπωλείας
  choice: विनाश का
  rationale: यह संबंधकारक पद चिह्न को विनाश से जोड़ता है; ‘विनाश’ गंभीर, स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐπὶ τοῦ μετώπου αὐτῶν
  choice: उनके माथों पर
  rationale: यूनानी में एकवचन ‘माथे’ का प्रयोग समूह के प्रत्येक व्यक्ति के लिए वितरणात्मक है; हिन्दी में बहुवचन ‘उनके माथों पर’ अधिक स्वाभाविक है और स्थान का अर्थ ठीक रखता है।
theological_decisions:
- issue: ‘विनाश का चिह्न’ में संबंधकारक की अर्थ-सीमा
  choice: ‘विनाश का चिह्न’ कहकर संबंध को खुला रखा गया है।
  alternative: ‘उनके विनाश का चिह्न’ या ‘विनाश के लिए ठहराया गया चिह्न’
  rationale: मूल यूनानी यह स्पष्ट नहीं करता कि चिह्न विनाश को सूचित करता है, विनाश से संबंधित है, या विनाश की नियति दर्शाता है; अनुवाद में इस तनाव को स्पष्ट करके सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाक्य। आरंभिक γάρ को ‘क्योंकि’ से व्यक्त किया गया है, और वितरणात्मक एकवचन ‘माथे’ को स्वाभाविक हिन्दी बहुवचन ‘माथों’ में अनूदित किया गया है।
