  text: a new psalm with song[a], in the joy of the heart; the fruit of lips with the well-tuned instrument of the tongue[c][b]; the firstfruits of lips from a holy and righteous heart.
translation:
  language: hi
  text: हृदय के आनन्द में गीत के साथ एक नया भजन; जीभ के अनुरूप बने वाद्य के साथ होंठों का फल[a][b]; पवित्र और धर्मी हृदय से होंठों का प्रथम फल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, अधिक शाब्दिक रूप में, “जीभ के अनुरूप किए गए वाद्य के साथ।” यूनानी वाक्यांश संक्षिप्त और कुछ कठिन है; ‘अनुरूप’ में जोड़े जाने, मिलाए जाने, या सुर में किए जाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “होंठों का फल” और “होंठों का प्रथम फल” अर्पण की काव्यात्मक छवि को बनाए रखते हैं; इनका आशय केवल सामान्य वाणी नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ψαλμὸν καινόν
  choice: एक नया भजन
  rationale: ψαλμός के धार्मिक-काव्यात्मक अर्थ को ‘भजन’ स्वाभाविक रूप से रखता है, और καινός का सीधा अर्थ ‘नया’ है।
- source_word: μετὰ ᾠδῆς
  choice: गीत के साथ
  rationale: ᾠδή का सामान्य अर्थ ‘गीत’ है; μετά यहाँ संगति का भाव देता है।
- source_word: ἐν εὐφροσύνῃ καρδίας
  choice: हृदय के आनन्द में
  rationale: यह εὐφροσύνη के आनन्द और καρδίας की सम्बन्धवाचक रचना, दोनों को निकटता से सुरक्षित रखता है।
- source_word: καρπὸν χειλέων
  choice: होंठों का फल
  rationale: शाब्दिक बाइबिलीय रूपक को बनाए रखा गया है; इसे केवल ‘वचन’ या ‘स्तुति’ कहने से अर्पण-संबंधी चित्र धुँधला पड़ता।
- source_word: ἐν ὀργάνῳ ἡρμοσμένῳ γλώσσης
  choice: जीभ के सुरीले वाद्य के साथ
  rationale: ὄργανον को ‘वाद्य’, ἡρμοσμένῳ को प्रसंगानुसार ‘सुरीले’, और γλώσσης के संबंधवाचक रूप को ‘जीभ के’ से व्यक्त किया गया है। यूनानी की संक्षिप्त और कुछ कठिन काव्यात्मक संरचना को जानबूझकर पूरी तरह नहीं खोला गया।
- source_word: ἀπαρχὴν χειλέων
  choice: होंठों का पहला फल
  rationale: ἀπαρχή के प्रथम उपज/अर्पण के रूपक को सरल आधुनिक हिन्दी में बनाए रखने के लिए ‘पहला फल’ चुना गया है।
- source_word: ἀπὸ καρδίας ὁσίας καὶ δικαίας
  choice: पवित्र और धर्मी हृदय से
  rationale: ὁσία और δικαίας के नैतिक-धार्मिक युग्म को परिचित बाइबिलीय हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘होंठों का फल’ और ‘होंठों का पहला फल’ में अर्पण की छवि
  choice: दोनों रूपकों को प्रत्यक्ष रूप से रखा गया
  alternative: इन्हें ‘होंठों की स्तुति’ या ‘वाणी का अर्पण’ कहना
  rationale: मूल पाठ भाषण और उपज/प्रथम फल की अर्पण-संबंधी छवियों को एक साथ रखता है; स्पष्टार्थक परिभाषा उस काव्यात्मक तनाव को घटा देती।
