  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। अर्धविरामों से मूल की समानांतर पद-संरचना दिखाई गई है। ‘आनन्द’, ‘भजन’, ‘धर्मी’ और ‘पवित्र’ सामान्य बाइबिलीय शब्दावली हैं; कठिन यूनानी रूपक को मुख्य पाठ में संक्षिप्त रखा गया और वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया।
