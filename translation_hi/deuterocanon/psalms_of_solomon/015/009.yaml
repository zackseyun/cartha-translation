  text: For they will flee from the holy ones as those pursued by war[a], but they will pursue sinners and overtake them; and those who practice lawlessness will not escape the Lord’s judgment[c][b]; they will be captured like those seized by experienced enemies.
translation:
  language: hi
  text: क्योंकि वे धर्मनिष्ठ जनों से ऐसे भागेंगे, मानो युद्ध द्वारा खदेड़े जा रहे हों[a][b]; पर वे पापियों का पीछा करेंगे और उन्हें पकड़ लेंगे। अधर्म करनेवाले प्रभु के न्याय से बच नहीं पाएँगे; वे ऐसे पकड़े जाएँगे, मानो अनुभवी शत्रुओं द्वारा पकड़ लिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश संक्षिप्त है; इसका अनुवाद ‘युद्ध द्वारा खदेड़े जा रहे लोगों की तरह’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘धर्मनिष्ठ जनों’ के स्थान पर ‘पवित्र जनों’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φεύξονται
  choice: भागेंगे
  rationale: भविष्यकालीन क्रिया को सीधे और स्वाभाविक ढंग से व्यक्त करता है; यहाँ इसका अर्थ बच निकलने के बजाय भय या दबाव में भागना है।
- source_word: ὡς διωκόμενοι πολέμου
  choice: ऐसे ... मानो युद्ध ने उन्हें खदेड़ दिया हो
  rationale: यूनानी वाक्यांश संक्षिप्त है। यह रूप युद्ध द्वारा खदेड़े जाने की सजीव छवि बनाए रखता है और हिन्दी में सहज है।
- source_word: ἀπὸ ὁσίων
  choice: धर्मनिष्ठ जनों से
  rationale: ὅσιος यहाँ भक्तिपूर्ण, निष्ठावान या पवित्र आचरण वाले लोगों को सूचित करता है। ‘धर्मनिष्ठ जन’ इस सामाजिक-नैतिक अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है और ἅγιοι के सामान्य अनुवाद ‘पवित्र जन’ से अनावश्यक समानता नहीं बनाता।
- source_word: καταδιώξονται
  choice: पीछा करके
  rationale: तीव्र पीछा करने का भाव देता है और अगली क्रिया ‘जा पकड़ेंगे’ के साथ स्वाभाविक क्रम बनाता है।
- source_word: καταλήψονται
  choice: जा पकड़ेंगे
  rationale: पीछा करने के परिणामस्वरूप पकड़ लेने या जा पहुँचने का अर्थ व्यक्त करता है।
- source_word: οἱ ποιοῦντες ἀνομίαν
  choice: अधर्म करनेवाले
  rationale: कर्तृवाचक कृदंत को केवल एक पहचानसूचक संज्ञा न बनाकर उनके नियमित आचरण के रूप में प्रस्तुत करता है।
- source_word: τὸ κρίμα Κυρίου
  choice: प्रभु के न्याय
  rationale: κρίμα के न्याय या न्यायिक निर्णय के अर्थ को सुरक्षित रखता है और κύριος का स्वाभाविक हिन्दी रूप ‘प्रभु’ देता है।
- source_word: ὡς ὑπὸ πολεμίων ἐμπείρων καταλημφθήσονται
  choice: ऐसे पकड़े जाएँगे, मानो अनुभवी शत्रुओं ने उन्हें धर लिया हो
  rationale: निष्क्रिय क्रिया और सैन्य उपमा दोनों को बनाए रखता है; ‘अनुभवी शत्रु’ ἐμπείρων का सीधा अर्थ व्यक्त करता है।
theological_decisions:
- issue: τὸ κρίμα Κυρίου में κύριος का अनुवाद
  choice: प्रभु के न्याय
  alternative: प्रभु का दण्डादेश
  rationale: ‘न्याय’ κρίμα की व्यापक न्यायिक अर्थ-सीमा को बनाए रखता है; ‘दण्डादेश’ प्रसंगानुकूल संभव है, पर अधिक संकीर्ण होगा।
- issue: ὁσίων की पहचान
  choice: धर्मनिष्ठ जनों
  alternative: पवित्र जनों
  rationale: पाठ इन्हें परमेश्वर-संबंधी निष्ठा और आचरण से पहचाने जाने वाले समुदाय के रूप में प्रस्तुत करता है। ‘धर्मनिष्ठ’ उस अर्थ को व्यक्त करता है, पर वैकल्पिक ‘पवित्र’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पीछा करने, पकड़ने और युद्ध की मूल सैन्य छवियों को बनाए रखा गया है। पहले दो खंडों में ‘वे’ का संदर्भ मूल यूनानी की तरह स्पष्ट नहीं किया गया, ताकि पाठ की वास्तविक अस्पष्टता बनी रहे।
