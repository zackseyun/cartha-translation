translation:
  language: hi
  text: जब वह प्रभु की उपस्थिति से पापियों के विरुद्ध निकलेगा, ताकि पापियों की सारी संपत्ति[a] नष्ट कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापियों का सारा आधार”; यूनानी शब्द का अर्थ उनकी संपत्ति, अस्तित्व, या वह सब भी हो सकता है जो उन्हें टिकाए रखता है।
    reason: ὑπόστασις की अर्थ-सीमा व्यापक है। मुख्य पाठ में प्रसंगानुकूल ‘संपत्ति’ रखा गया है, जबकि टिप्पणी अन्य संभावित अर्थों को सुरक्षित रखती है।
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह कालवाचक उपवाक्य आरम्भ करता है; ‘जब’ भावी प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है, बिना बार-बार होने का अर्थ जोड़े।
- source_word: ἐξέλθῃ
  choice: वह ... निकलेगा
  rationale: यूनानी में कर्ता एकवचन और अनुक्त है, जिसकी पहचान पूर्ववर्ती प्रसंग से होती है। हिन्दी में क्रिया के लिए सर्वनाम आवश्यक होने के कारण ‘वह’ रखा गया, पर उसकी पहचान स्पष्ट नहीं की गई।
- source_word: ἐφʼ ἁμαρτωλοὺς
  choice: पापियों के विरुद्ध
  rationale: गतिसूचक प्रयोग में ἐπί यहाँ विरोधपूर्ण दिशा और न्यायिक कार्रवाई का भाव देता है।
- source_word: ἀπὸ προσώπου Κυρίου
  choice: प्रभु के सामने से
  rationale: यह यूनानी मुहावरे के ‘प्रभु के मुख/सामने से’ अर्थ को निकटता से और स्वाभाविक हिन्दी में रखता है।
- source_word: ὀλεθρεύσαι
  choice: नष्ट कर दे
  rationale: अनन्त क्रिया उद्देश्य अथवा परिणामी उद्देश्य बताती है; ‘ताकि ... नष्ट कर दे’ इस सम्बन्ध को स्पष्ट और सशक्त रूप से व्यक्त करता है।
- source_word: πᾶσαν ὑπόστασιν ἁμαρτωλῶν
  choice: पापियों की हर सम्पत्ति
  rationale: हेलेनिस्टिक यहूदी यूनानी में ὑπόστασις यहाँ सम्पदा, माल-असबाब या अधिकार में मौजूद वस्तु का बोध करा सकता है। ‘हर सम्पत्ति’ आधुनिक हिन्दी में स्वाभाविक है, जबकि टिप्पणी व्यापक सम्भावना सुरक्षित रखती है।
theological_decisions:
- issue: ἐξέλθῃ के अनुक्त कर्ता की पहचान
  choice: ‘वह’ कहकर कर्ता को अनिर्दिष्ट रखा गया
  alternative: कर्ता को ‘विनाश’, ‘क्रोध’ या किसी व्यक्ति के रूप में स्पष्ट करना
  rationale: इस पद में कर्ता का नाम नहीं है और वह पूर्व प्रसंग से ग्रहण होता है; कोई विशिष्ट पहचान जोड़ना पाठ की वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किन्तु सरल रखी गई है। ‘प्रभु’, ‘पापी’, ‘विरुद्ध’ और ‘नष्ट’ धार्मिक-काव्यात्मक प्रसंग के अनुकूल परिचित शब्द हैं।
