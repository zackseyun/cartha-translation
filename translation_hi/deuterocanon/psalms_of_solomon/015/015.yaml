  yaml_path: translation/deuterocanon/psalms_of_solomon/015/015.yaml
  text: But those who fear the Lord will be shown mercy in it[a], and they will live by the mercy of their God, but sinners will perish forever.
translation:
  language: hi
  text: परन्तु जो प्रभु का भय मानते हैं, उनमें उन पर दया की जाएगी[a]; वे अपने परमेश्वर की दया से जीवित रहेंगे, पर पापी सदा के लिए नष्ट हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘उसमें’ है। सम्भवतः संकेत अभी-अभी बताए गए प्रभु के न्याय के दिन की ओर है, पर यह पिछले पद की भूमि/धरती की ओर भी संकेत कर सकता है।
    reason: पूर्वपद की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: φοβούμενοι
  choice: जो ... भय मानते हैं
  rationale: यह कृदन्त संज्ञा के समान उस समूह को दर्शाता है जिसकी पहचान प्रभु का भय मानने से होती है। हिन्दी में यह स्वाभाविक है और धार्मिक श्रद्धा तथा भय, दोनों की अर्थ-छाया बनाए रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: यह κύριος का प्रचलित, गरिमापूर्ण और प्रसंगानुकूल हिन्दी रूप है।
- source_word: ἐλεηθήσονται
  choice: उन पर ... दया की जाएगी
  rationale: यह भविष्यत् कर्मवाच्य को स्पष्ट रखता है और बताता है कि दया उन्हें प्रदान की जाती है, अर्जित नहीं की जाती।
- source_word: ἐν αὐτῇ
  choice: उसमें
  rationale: स्त्रीलिंग सर्वनाम का पूर्वपद इस पद में व्यक्त नहीं है। शाब्दिक रूप अस्पष्टता को बनाए रखता है; सम्भावित संकेत न्याय के दिन या पिछले पद की धरती/भूमि की ओर है।
- source_word: ἐν τῇ ἐλεημοσύνῃ
  choice: दया से
  rationale: यहाँ ἐλεημοσύνη दान देने के बजाय परमेश्वर की दया को दर्शाता है; 'से' उस दया को उनके जीवन का आधार अथवा साधन बताता है।
- source_word: ἀπολοῦνται
  choice: नष्ट हो जाएँगे
  rationale: न्याय के प्रसंग में यह क्रिया की गंभीरता और विनाश के भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: सदा के लिए
  rationale: यह दीर्घकालिकता पर बल देने वाले यूनानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: αὐτῇ का पूर्वपद
  choice: मुख्य पाठ में 'उसमें' रखकर पूर्वपद को अनिर्धारित छोड़ा गया है।
  alternative: इसे निकटवर्ती प्रसंग के आधार पर 'उस दिन' या पिछले पद के आधार पर 'उस भूमि/धरती में' समझा जा सकता है।
  rationale: यूनानी पाठ स्वयं केवल 'उसमें' कहता है। किसी एक पूर्वपद को मुख्य पाठ में निश्चित करना वास्तविक व्याकरणिक और प्रसंगगत अस्पष्टता को मिटा देता; इसलिए सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण धार्मिक शैली अपनाई गई है। ‘परन्तु/पर’ से यूनानी δὲ के विरोधात्मक संबंध व्यक्त किए गए हैं और अनावश्यक सांप्रदायिक शब्दावली से बचा गया है।
