translation:
  language: hi
  text: जब मैं संकट में था, तब मैंने प्रभु का नाम पुकारा; मैंने याकूब के परमेश्वर की सहायता की आशा रखी, और मैं बचाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τῷ θλίβεσθαί με
  choice: जब मैं संकट में था
  rationale: ἐν के साथ articular infinitive यहाँ समयसूचक है; यह सहज आधुनिक हिन्दी में पीड़ा या दबाव की अवस्था व्यक्त करता है।
- source_word: ἐπεκαλεσάμην
  choice: मैंने ... पुकारा
  rationale: मध्य रूप प्रार्थनापूर्वक पुकारने या आह्वान करने का भाव देता है।
- source_word: τὸ ὄνομα Κυρίου
  choice: प्रभु का नाम
  rationale: मानक बाइबलीय अभिव्यक्ति को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: εἰς βοήθειαν ἤλπισα τοῦ θεοῦ Ἰακώβ
  choice: मैंने याकूब के परमेश्वर से मिलनेवाली सहायता पर आशा रखी
  rationale: εἰς βοήθειαν को आशा के लक्ष्य के रूप में और τοῦ θεοῦ Ἰακώβ को उस सहायता के स्रोत/सम्बन्ध के रूप में रखते हुए यूनानी वाक्य-विन्यास सुरक्षित किया गया है।
- source_word: ἐσώθην
  choice: मेरा उद्धार हुआ
  rationale: निष्क्रिय aorist को निकटता से प्रस्तुत करता है; प्रसंग में इसका अर्थ संकट से बचाया जाना है, जबकि हिन्दी में बाइबलीय गरिमा भी बनी रहती है।
theological_decisions:
- issue: ἐσώθην में तात्कालिक बचाव और व्यापक उद्धार की अर्थ-सीमा
  choice: मेरा उद्धार हुआ
  alternative: मैं बचाया गया
  rationale: मुख्य पाठ यूनानी क्रिया की व्यापक बाइबलीय अर्थ-सीमा बनाए रखता है; प्रसंग इसे संकट से मुक्ति के रूप में सीमित करने में सहायता करता है, बिना किसी संप्रदायगत अर्थ को आरोपित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण है। ‘से मिलनेवाली सहायता पर आशा रखी’ कुछ विस्तार के साथ यूनानी संबंध को स्पष्ट और स्वाभाविक बनाता है।
