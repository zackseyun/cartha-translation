base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/008.yaml
  text: For the sign of God is upon the righteous for salvation[e][d][c][b][a]; famine and sword and death are far from the righteous.
translation:
  language: hi
  text: क्योंकि परमेश्वर का चिह्न[a] धर्मियों पर उनके उद्धार के लिए है; अकाल, तलवार और मृत्यु[b] धर्मियों से दूर हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निशान।”
    reason: lexical_alternative
  - marker: b
    text: विपत्तियों की ऐसी सूचियों में “मृत्यु” से कभी-कभी “महामारी” का भाव भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: σημεῖον
  choice: चिह्न
  rationale: ‘चिह्न’ किसी पहचाने जानेवाले संकेत या निशान—दोनों अर्थों के लिए पर्याप्त खुला है और निकटवर्ती प्रसंग में इसी शब्द की पुनरावृत्ति से बननेवाले विरोध को सुरक्षित रखता है।
- source_word: δικαίους / δικαίων
  choice: धर्मियों
  rationale: यह उन लोगों के वर्ग को सूचित करता है जो धर्मी हैं; ‘धर्मियों’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: εἰς σωτηρίαν
  choice: उनके उद्धार के लिए
  rationale: ‘उद्धार के लिए’ εἰς की लक्ष्यसूचक शक्ति को बनाए रखता है। ‘उनके’ जोड़ने से हिन्दी में स्पष्ट होता है कि उद्धार धर्मियों का है, बिना मूल अर्थ को संकीर्ण किए।
- source_word: λιμός
  choice: अकाल
  rationale: तलवार और मृत्यु के साथ विपत्तियों की सूची में ‘अकाल’ साधारण भूख की अपेक्षा अधिक सटीक है।
- source_word: ῥομφαία
  choice: तलवार
  rationale: यह मानक और प्रसंगानुकूल हिन्दी पर्याय है तथा युद्धजनित विपत्ति का बोध कराता है।
- source_word: θάνατος
  choice: मृत्यु
  rationale: यूनानी शब्द का प्रत्यक्ष और व्यापक अर्थ ‘मृत्यु’ है। न्याय-विपत्तियों की पारंपरिक सूची में ‘महामारी’ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: μακράν
  choice: दूर
  rationale: ‘धर्मियों से दूर’ अलगाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के चिह्न का स्वरूप
  choice: ‘चिह्न’ कहकर उसका स्वरूप अनिर्धारित रखा गया है।
  alternative: इसे विशेष रूप से ‘मुहर’ या केवल शारीरिक ‘निशान’ कहना।
  rationale: मूल यूनानी σημεῖον यह नहीं बताता कि चिह्न भौतिक है, प्रतीकात्मक है या किसी अन्य प्रकार का; अनुवाद इस अस्पष्टता को बनाए रखता है।
- issue: θάνατος का विपत्ति-सूची में अर्थ
  choice: मुख्य पाठ में ‘मृत्यु’।
  alternative: ‘महामारी’।
  rationale: शब्द का सामान्य अर्थ मृत्यु है, पर यहूदी-यूनानी न्याय-सूचियों में महामारी का संकेत भी संभव है; इसलिए मुख्य पाठ और पादटिप्पणी दोनों मिलकर अर्थगत तनाव सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम मूल की दो परस्पर संबंधित उक्तियों को स्पष्ट रूप से अलग करता है। ‘चिह्न’ को ‘निशान’ से अधिक औपचारिक किंतु फिर भी प्रचलित विकल्प के रूप में चुना गया है।
