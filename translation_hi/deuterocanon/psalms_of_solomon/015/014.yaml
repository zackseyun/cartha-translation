translation:
  language: hi
  text: जब परमेश्वर अपने न्याय के साथ पृथ्वी पर आएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जब परमेश्वर अपने न्याय के साथ देश में आएगा।’
    reason: γῆ का अर्थ ‘पृथ्वी’ के साथ-साथ ‘देश’ या ‘भूमि’ भी हो सकता है।
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह शब्द संभाव्य भविष्य की कालवाचक उपवाक्य-रचना आरम्भ करता है। यहाँ ‘जब’ स्वाभाविक है; ‘जब कभी’ अनावश्यक रूप से बार-बार होने का भाव दे सकता है।
- source_word: ἐπισκέπτηται
  choice: आएगा
  rationale: क्रिया का अर्थ उद्देश्यपूर्ण रूप से भेंट करना, निरीक्षण करना या हस्तक्षेप के लिए आना हो सकता है। हिंदी में परमेश्वर के न्यायिक आगमन के संदर्भ में ‘आएगा’ स्वाभाविक है और अगले पदबंध को कार्रवाई का स्वरूप स्पष्ट करने देता है।
- source_word: τὴν γῆν
  choice: पृथ्वी पर
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। व्यापक संदर्भ के कारण मुख्य पाठ में ‘पृथ्वी’ चुना गया है; भौगोलिक रूप से सीमित अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ἐν κρίματι αὐτοῦ
  choice: अपने न्याय के साथ
  rationale: κρίμα न्याय अथवा न्यायिक निर्णय को सूचित करता है। ‘अपने न्याय के साथ’ हिंदी में स्वाभाविक रहते हुए यूनानी ἐν की सहचारी/परिस्थितिजन्य शक्ति और न्यायिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय ‘भेंट’ का स्वरूप
  choice: ‘आएगा’ के साथ ‘अपने न्याय के साथ’
  alternative: ‘जाँच करने आएगा’ या ‘दण्ड देने आएगा’
  rationale: मूल क्रिया अपने आप में अनुग्रहकारी या दण्डात्मक अर्थ को पूरी तरह निश्चित नहीं करती; न्याय का पदबंध प्रसंग को न्यायिक बनाता है। इसलिए अनुवाद दण्ड को अनावश्यक रूप से स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण हिंदी। ‘पधारेगा’ से बचा गया है क्योंकि वह यहाँ अत्यधिक सम्मानसूचक और संभवतः सौम्य भाव दे सकता है; ‘निरीक्षण करेगा’ मूल की न्यायिक भेंट को अधिक तकनीकी बना देता।
