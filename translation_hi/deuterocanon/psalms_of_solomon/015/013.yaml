  yaml_path: translation/deuterocanon/psalms_of_solomon/015/013.yaml
  text: For sins will lay waste the houses of sinners[b][a], and sinners will perish on the day of the Lord’s judgment forever.
translation:
  language: hi
  text: क्योंकि पाप पापियों के घरों को उजाड़ देंगे[a], और पापी प्रभु के न्याय के दिन सदा के लिए नाश हो जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बरबाद कर देंगे’ अथवा ‘निर्जन कर देंगे’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘युग के लिए’। यहाँ इसका अनुवाद ‘सदा के लिए’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: पाप
  rationale: बहुवचन रूप ठोस या संचित पापों को व्यक्त करता है। हिन्दी में ‘पाप’ रूप संदर्भानुसार बहुवचन अर्थ भी स्वाभाविक रूप से देता है और इसे कर्ता के रूप में बनाए रखता है।
- source_word: ἐξερημώσουσιν
  choice: उजाड़ देंगे
  rationale: क्रिया का अर्थ किसी स्थान को निर्जन या बरबाद कर देना है। ‘उजाड़ देंगे’ इसकी तीव्रता को स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: οἴκους
  choice: घरों
  rationale: मूल अर्थ ‘घर’ है। यहाँ इसे ‘घरानों’ या ‘परिवारों’ में विस्तृत करने के लिए संदर्भ में पर्याप्त आधार नहीं है।
- source_word: ἁμαρτωλῶν
  choice: पापियों के
  rationale: यह सीधा संबंधकारक अनुवाद है और अगले उपवाक्य में उसी संज्ञा की पुनरावृत्ति को सुरक्षित रखता है।
- source_word: ἀπολοῦνται
  choice: नाश हो जाएँगे
  rationale: यह क्रिया विनाश या सर्वनाश की ओर जाना व्यक्त करती है। ‘नाश हो जाएँगे’ न्याय-संबंधी गंभीरता बनाए रखता है, पर विनाश की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν ἡμέρᾳ κρίσεως Κυρίου
  choice: प्रभु के न्याय के दिन
  rationale: यह Κυρίου के संबंधकारक अर्थ को स्पष्ट रखता है और कालवाचक ἐν का स्वाभाविक हिन्दी रूप देता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: न्याय के इस संदर्भ में वाक्यांश स्थायी अंतिमता व्यक्त करता है। ‘सदा के लिए’ सहज आधुनिक हिन्दी है; शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: εἰς τὸν αἰῶνα का संबंध और कालगत विस्तार
  choice: इसे ‘नाश हो जाएँगे’ से जोड़कर ‘सदा के लिए नाश हो जाएँगे’ अनूदित किया गया है।
  alternative: अधिक शाब्दिक रूप ‘युग तक’ हो सकता है, या इसे पूरे न्याय-वाक्य को बल देने वाला माना जा सकता है।
  rationale: यह वाक्यांश पापियों के नाश वाले उपवाक्य के बाद आता है, इसलिए सबसे स्वाभाविक रूप से उसी नाश की स्थायी अंतिमता बताता है। फिर भी मूल की शाब्दिक अभिव्यक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पाप’ को मूल यूनानी की तरह कर्ता बनाए रखा गया है, और ‘पापियों’ की पुनरावृत्ति भी संरक्षित है। ‘घर’ का ठोस अर्थ रखा गया है; उसे व्याख्यात्मक रूप से ‘घराना’ नहीं बनाया गया।
