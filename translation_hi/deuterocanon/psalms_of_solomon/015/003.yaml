lexical_decisions:
- source_word: τίς
  choice: कौन
  rationale: यह प्रत्यक्ष प्रश्नवाचक सर्वनाम है और आलंकारिक प्रश्न आरम्भ करता है; आधुनिक हिन्दी में ‘कौन’ इसका स्वाभाविक रूप है।
- source_word: ἰσχύει
  choice: समर्थ है
  rationale: क्रिया सामर्थ्य या शक्ति रखने का भाव देती है। ‘समर्थ है’ हिन्दी में शक्ति और किसी कार्य को कर सकने—दोनों पहलुओं को बनाए रखती है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: सन्दर्भ में इसे सम्बोधन मानना सबसे स्वाभाविक है; ‘हे परमेश्वर’ प्रार्थनामय और गरिमापूर्ण हिन्दी है।
- source_word: ἐξομολογήσασθαί
  choice: धन्यवाद करने
  rationale: सेप्टुआजिन्ट और भक्ति-सन्दर्भ में दत्तिव σοι के साथ यह क्रिया प्रायः परमेश्वर को धन्यवाद देने या उसकी स्तुति करने का अर्थ रखती है। ‘धन्यवाद करने’ को मुख्य पाठ में रखा गया है, जबकि ‘गुणगान/स्वीकार करना’ पादटिप्पणी में सुरक्षित है।
- source_word: σοι
  choice: तेरा
  rationale: यूनानी दत्तिव ‘तुझको’ का भाव हिन्दी की स्वाभाविक क्रिया-रचना ‘तेरा धन्यवाद करना’ से व्यक्त होता है।
- source_word: ἐν ἀληθείᾳ
  choice: सच्चाई से
  rationale: यह ‘सत्य में’, ‘सचमुच’ अथवा ‘सच्चे मन से’ का भाव दे सकता है। ‘सच्चाई से’ मूल की व्यापकता बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: अपवादसूचक अभिव्यक्ति को स्पष्ट रूप से बनाए रखा गया है, यद्यपि ἰσχύει के साथ इसकी वाक्यगत बनावट असामान्य है।
theological_decisions:
- issue: भक्ति-सन्दर्भ में ἐξομολογήσασθαί का अर्थ
  choice: तेरा धन्यवाद करने
  alternative: तेरा गुणगान करने; सच्चाई से तुझे स्वीकार करने
  rationale: बाइबिलीय यूनानी में परमेश्वर के प्रति प्रयुक्त यह क्रिया प्रायः धन्यवाद या स्तुति दर्शाती है; इसे पापों के अंगीकार तक सीमित करना अनुचित होगा। फिर भी खुले स्वीकार या गुणगान की अर्थछाया पादटिप्पणी में रखी गई है।
- issue: ἰσχύει ... εἰ μὴ + infinitive की वाक्यगत गाँठ
  choice: धन्यवाद करने के सिवा कौन समर्थ है?
  alternative: कौन इतना समर्थ है कि सच्चाई से तेरा धन्यवाद कर सके?
  rationale: मुख्य पाठ εἰ μὴ के अपवादसूचक बल और मूल की असामान्य धार्मिक तनावपूर्ण अभिव्यक्ति को सुरक्षित रखता है। वैकल्पिक पाठ ἰσχύει के क्रियार्थक सामर्थ्य को अधिक सहज हिन्दी में व्यक्त करता है, पर ‘के सिवा’ को कम स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनामय, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। परमेश्वर के लिए एकवचन निकट सम्बोधन ‘तेरा’ रखा गया है। मूल यूनानी की असामान्य वाक्य-रचना को पूरी तरह समतल न करके मुख्य पाठ और पादटिप्पणी के माध्यम से उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
