translation:
  language: hi
  text: क्योंकि, हे परमेश्वर, तू गरीबों की आशा और शरण है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह अव्यय आसपास के कथन का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके कारणात्मक अर्थ को सीधे बनाए रखता है।
- source_word: ἐλπὶς
  choice: आशा
  rationale: यह संज्ञा सीधे ‘आशा’ का अर्थ देती है और यहाँ किसी विस्तृत भावानुवाद की आवश्यकता नहीं है।
- source_word: καταφυγὴ
  choice: शरण
  rationale: यह सुरक्षा पाने के आश्रय या शरण को सूचित करता है; ‘शरण’ परमेश्वर को रक्षक आश्रय के रूप में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τῶν πτωχῶν
  choice: गरीबों की
  rationale: सम्बन्धकारक बहुवचन सामाजिक-आर्थिक रूप से गरीब लोगों की ओर संकेत करता है; ‘गरीबों की’ इस अर्थ को ‘ज़रूरतमंदों’ जैसे व्यापक विकल्प से अधिक सीधे सुरक्षित रखता है।
- source_word: σύ
  choice: तू ही है
  rationale: स्पष्ट सर्वनाम पर बल है और यूनानी में क्रिया निहित है; हिन्दी में ‘तू ही है’ विधेय को व्याकरणिक बनाते हुए उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: निश्चित रूप वाला यह पद प्रसंग में सीधे सम्बोधन के रूप में प्रयुक्त है; ‘हे परमेश्वर’ हिन्दी में उसका स्पष्ट और गरिमापूर्ण रूप है।
theological_decisions: []
