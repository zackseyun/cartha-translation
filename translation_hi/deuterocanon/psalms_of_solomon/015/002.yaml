  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के सीधे सम्बोधन में ‘तू’ चुना गया है, जो हिन्दी की भक्ति और काव्य-परम्परा में निकटता तथा एकवचन सम्बोधन व्यक्त करता है; ‘ही’ स्पष्ट σύ के बल को दर्शाता है।
