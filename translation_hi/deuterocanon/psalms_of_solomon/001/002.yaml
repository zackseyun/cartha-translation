  yaml_path: translation/deuterocanon/psalms_of_solomon/001/002.yaml
  text: Suddenly[a], a cry of war was silenced before me; he will hear me[c][b], because I am filled with righteousness.
translation:
  language: hi
  text: अचानक मेरे सामने युद्ध की पुकार सुनाई दी[a]; वह मेरी सुनेगा, क्योंकि मैं धार्मिकता[b] से भरपूर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्वीटे के मुद्रित पाठ में यहाँ ‘सुनाई दी’ (ἠκούσθη) मिलता है। उपलब्ध प्रतिलेखन में संदिग्ध रूप κωφωθὴ है, जिसके आधार पर ‘मौन कर दी गई’ अनुवाद किया जा सकता है।
    reason: textual_variant
  - marker: b
    text: ‘धार्मिकता’ का अनुवाद ‘न्याय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξάπινα
  choice: अचानक
  rationale: यह क्रिया-विशेषण घटना के आकस्मिक रूप से घटने को व्यक्त करता है; ‘अचानक’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἠκούσθη / प्रस्तुत प्रतिलेखन κωφωθὴ
  choice: सुनाई दी
  rationale: स्वीटे के मुद्रित पाठ के प्रमाण और पद के प्रचलित यूनानी पाठ में ἠκούσθη (‘सुनाई दी’) है। दिए गए प्रतिलेखन का κωφωθὴ रूप संदिग्ध/भ्रष्ट प्रतीत होता है और उससे ‘मौन कर दी गई’ अर्थ निकाला गया है; इस पाठगत समस्या को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κραυγὴ πολέμου
  choice: युद्ध की पुकार
  rationale: यह पदबंध संबंधकारक संरचना को बनाए रखता है और हिन्दी में स्पष्ट है; ‘युद्धघोष’ अधिक संक्षिप्त विकल्प है।
- source_word: ἐνώπιόν μου
  choice: मेरे सामने
  rationale: स्थान अथवा वक्ता की उपस्थिति दर्शाने वाला स्वाभाविक हिन्दी प्रयोग।
- source_word: ἐπακούσεταί μου
  choice: वह मेरी सुनेगा
  rationale: क्रिया केवल ध्वनि सुनने से बढ़कर अनुकूलतापूर्वक सुनने का भाव रख सकती है। ‘मेरी सुनेगा’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, पर उत्तर मिलने को स्पष्ट रूप से नहीं जोड़ता।
- source_word: ἐπλήσθην
  choice: मैं … से भरपूर हूँ
  rationale: यूनानी अओरिस्ट को यहाँ वर्तमान परिणाम वाली अवस्था के रूप में व्यक्त किया गया है; इससे कारणसूचक वाक्य हिन्दी में स्वाभाविक रहता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यहाँ नैतिक और धार्मिक खराई का अर्थ प्रमुख है। ‘न्याय’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘वह मेरी सुनेगा’ का अप्रकट कर्ता
  choice: यूनानी की तरह कर्ता का नाम न जोड़ते हुए ‘वह’ रखा गया है; प्रार्थना के प्रसंग में संकेत परमेश्वर की ओर है।
  alternative: ‘परमेश्वर मेरी सुनेगा’ अथवा ‘मेरी सुनी जाएगी’।
  rationale: मूल यूनानी में कर्ता निहित है। ‘परमेश्वर’ जोड़ना प्रसंगानुकूल तो है, पर मूल से अधिक स्पष्टता लाता; निष्क्रिय रूप कथन की व्यक्तिगतता घटाता।
- issue: वक्ता का धार्मिकता से भरपूर होने का दावा
  choice: दावे को बिना व्याख्यात्मक नरमी या अनुमोदन के सीधे रखा गया है।
  alternative: इसे ‘क्योंकि मैं न्याय से परिपूर्ण हूँ’ कहना या कथन में विडंबना स्पष्ट करना।
  rationale: मूल पाठ दावे के धर्मवैचारिक मूल्यांकन को इस पद में स्पष्ट नहीं करता; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘युद्ध की पुकार’ मूल संरचना के निकट है, जबकि ‘युद्धघोष’ अधिक मुहावरेदार विकल्प होता। अर्धविराम दोनों कथनों के तीखे संक्रमण को बनाए रखता है।
