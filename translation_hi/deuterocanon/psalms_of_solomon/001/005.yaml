  text: They were exalted to the stars[a]; they said[d][c][b], “We will certainly not fall.”
translation:
  language: hi
  text: वे तारों तक ऊँचे उठाए गए[a]; उन्होंने कहा, “वे निश्चय ही नहीं गिरेंगे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् वे तारों जितनी ऊँचाई तक उठा दिए गए; यह अत्यधिक ऊँचाई की अतिशयोक्तिपूर्ण छवि है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ क्रिया तीसरे पुरुष बहुवचन में है—शाब्दिक अर्थ, ‘वे निश्चय ही नहीं गिरेंगे।’ संदर्भ के आधार पर इसे वक्ताओं का अपने विषय में कथन मानकर ‘हम निश्चय ही नहीं गिरेंगे’ भी समझा गया है।
    reason: textual_grammar
lexical_decisions:
- source_word: ὑψώθησαν
  choice: ऊँचे उठाए गए
  rationale: यह ὑψόω का एओरिस्ट कर्मवाच्य रूप है। ‘ऊँचे उठाए गए’ कर्मवाच्य को बनाए रखता है और अगले पदबंध की ऊँचाई वाली छवि के अनुकूल है; ‘महिमान्वित किए गए’ यहाँ स्थानगत बिंब को अनावश्यक रूप से अमूर्त कर देता।
- source_word: ἕως τῶν ἄστρων
  choice: तारों तक
  rationale: ἕως के साथ संबंधकारक यहाँ सीमा या विस्तार बताता है। ‘तारों तक’ अतिशयोक्तिपूर्ण ऊँचाई की काव्यात्मक छवि को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: εἶπαν
  choice: उन्होंने कहा
  rationale: यह साधारण कथन-क्रिया है; ‘कहा’ सबसे सीधा और व्याख्या से मुक्त विकल्प है।
- source_word: Οὐ μὴ πέσωσιν
  choice: वे निश्चय ही नहीं गिरेंगे
  rationale: οὐ μή प्रबल निषेध व्यक्त करता है, इसलिए ‘निश्चय ही नहीं’ उसके जोर को दर्शाता है। πέσωσιν तीसरे पुरुष बहुवचन में है, अतः मूल यूनानी के अनुसार ‘वे ... गिरेंगे’ रखा गया है, न कि ‘हम ... गिरेंगे।’
theological_decisions:
- issue: कथन को घमंडी आत्मविश्वास के रूप में सुनाया जाए या स्थिरता के तटस्थ दावे के रूप में
  choice: 'प्रबल दावे के रूप में: ‘वे निश्चय ही नहीं गिरेंगे।’'
  alternative: 'अधिक तटस्थ: ‘वे नहीं गिरेंगे।’'
  rationale: οὐ μή का प्रबल निषेध दृढ़, और संदर्भ में संभवतः दंभपूर्ण, भरोसा व्यक्त करता है; फिर भी अनुवाद में ‘घमंड’ जैसा मूल्यांकन जोड़कर अर्थ को स्पष्टतः तय नहीं किया गया।
- issue: प्रत्यक्ष कथन में तीसरे पुरुष πέσωσιν को कैसे दर्शाया जाए
  choice: मूल व्याकरण के अनुसार ‘वे ... नहीं गिरेंगे’
  alternative: 'संदर्भानुकूल प्रथम पुरुष: ‘हम निश्चय ही नहीं गिरेंगे’'
  rationale: प्राप्त यूनानी पाठ में क्रिया तीसरे पुरुष बहुवचन है। प्रथम पुरुष करना वक्ताओं को ही कथन का विषय मानकर पाठ की वास्तविक व्याकरणिक कठिनाई को मिटा देता; इसलिए उसे पादटिप्पणी सहित सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। अर्धविराम दोनों समानांतर कथनों को जोड़ता है। ‘तारों तक’ भजन-साहित्य की अतिशयोक्तिपूर्ण ऊँचाई को बनाए रखता है, जबकि पादटिप्पणी असामान्य तीसरे पुरुष के कारण उत्पन्न वास्तविक अस्पष्टता को छिपने नहीं देती।
