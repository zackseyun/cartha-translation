- source_word: ἐλογισάμην
  choice: मैंने ... सोचा
  rationale: यह λογίζομαι के आत्मगत विचार या मन में किए गए आकलन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν καρδίᾳ μου
  choice: अपने हृदय में
  rationale: मूल बाइबलीय मुहावरे और आंतरिक आत्मचिंतन, दोनों को बनाए रखता है।
- source_word: ἐπλήσθην
  choice: मैं ... से भर गया था
  rationale: निष्क्रिय अर्थ को सुरक्षित रखता है; हिन्दी में पूर्ण भूतकाल उस पूर्व आत्म-मूल्यांकन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यहाँ वक्ता अपने नैतिक रूप से सही होने का आकलन कर रहा है; ‘न्याय’ संभव है, पर इस संदर्भ में कम स्वाभाविक।
- source_word: ἐν τῷ εὐθηνῆσαί με
  choice: जब मैं समृद्ध हुआ
  rationale: ἐν के साथ articular infinitive का समयसूचक बल है, और εὐθηνέω उन्नति या समृद्धि को दर्शाता है।
- source_word: πολλὴν γενέσθαι ἐν τέκνοις
  choice: मेरी बहुत-सी संतान हुई
  rationale: यूनानी अभिव्यक्ति संक्षिप्त और शाब्दिक रूप से असहज है; हिन्दी रूप संतान की बहुलता का आशय स्पष्ट करता है, बिना उसे प्रतिष्ठा या सामर्थ्य में ‘महान’ होने का अर्थ दिए।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: समृद्धि और संतान के आधार पर वक्ता अपने नैतिक/धार्मिक स्थान को पूर्ण मानता है। ‘धार्मिकता’ इस आत्म-मूल्यांकन और पद के तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हृदय में’ बाइबलीय मुहावरे को बनाए रखता है, जबकि संतान-वाला खंड शाब्दिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखते हुए मुख्य पाठ में स्वाभाविक हिन्दी देता है।
