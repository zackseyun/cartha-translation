  footnotes:
  - marker: a
    text: या ‘न्याय’। यूनानी शब्द के दोनों अर्थ हो सकते हैं, पर यहाँ संभवतः वक्ता की अपनी समझ में उसकी धार्मिकता अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और संतानों में बहुत हो गया’; अर्थात ‘मेरी बहुत-सी संतान हुई’ या ‘मेरी संतान बढ़ी।’
    reason: lexical_alternative
  - marker: c
    text: 'एक अन्य संभव रूप: ‘मैंने अपने हृदय में सोचा कि मैं धार्मिकता से भर गया, जब मैं समृद्ध हुआ और संतानों के कारण बहुत बढ़ गया।’'
    reason: previous_rendering
