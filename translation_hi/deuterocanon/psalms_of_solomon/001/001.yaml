base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/001.yaml
  text: I cried out to the Lord when I was afflicted to the end[c][b][a], to God when sinners attacked.
translation:
  language: hi
  text: जब मुझे अन्त तक[a][c] पीड़ित किया गया, तब मैंने प्रभु की दोहाई दी; जब पापियों ने मुझ पर आक्रमण किया[b], तब मैंने परमेश्वर की दोहाई दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “जब मुझे पूरी तरह पीड़ित किया गया” अथवा “जब मुझे लगातार पीड़ित किया गया।” यूनानी वाक्यांश εἰς τέλος का शाब्दिक अर्थ “अन्त तक” है, पर यहाँ वह तीव्रता या निरन्तरता भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “पापियों ने मुझ पर आक्रमण किया” के पीछे का यूनानी पद कठिन है। इसका अर्थ “पापी मुझ पर आ पड़े” या कोई अन्य शत्रुतापूर्ण कार्रवाई भी हो सकता है; यहाँ विलाप के प्रसंग के अनुसार सम्भावित अर्थ दिया गया है।
    reason: alternative_reading
  - marker: c
    text: अधिक शाब्दिक रूप से, “मेरे पीड़ित किए जाने में”; यहाँ यूनानी रचना का अर्थ कालवाचक, अर्थात् “जब मुझे पीड़ित किया गया,” समझा गया है।
    reason: previous_rendering
lexical_decisions:
- source_word: ἘΒΟΗΣΑ
  choice: मैंने ... दोहाई दी
  rationale: βοάω यहाँ संकट में परमेश्वर को पुकारने की तीव्रता व्यक्त करता है। ‘दोहाई दी’ प्रार्थनापूर्ण और अत्यावश्यक पुकार—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: πρὸς Κύριον
  choice: प्रभु की
  rationale: πρός सम्बोधन की दिशा बताता है। हिन्दी मुहावरे ‘प्रभु की दोहाई दी’ में यही सम्बन्ध स्वाभाविक रूप से व्यक्त होता है; κύριος के लिए ‘प्रभु’ मानक और गरिमापूर्ण चयन है।
- source_word: ἐν τῷ θλίβεσθαί με
  choice: जब मुझे ... सताया गया
  rationale: ἐν के साथ articular infinitive यहाँ कालवाचक/परिस्थितिवाचक है। कर्मवाच्य θλίβεσθαι को बनाए रखने के लिए ‘मुझे सताया गया’ चुना गया, न कि केवल ‘मैं संकट में था’।
- source_word: εἰς τέλος
  choice: अन्त तक
  rationale: यह वाक्यांश का निकटस्थ शाब्दिक रूप है और अवधि, चरम सीमा अथवा तीव्रता के बीच मूल की वास्तविक अनिश्चितता को खुला रखता है।
- source_word: πρὸς τὸν θεὸν
  choice: परमेश्वर की
  rationale: पहले समानांतर सम्बोधन की तरह इसे अलग रखा गया है। हिन्दी में ‘परमेश्वर की दोहाई दी’ स्वाभाविक रूप से ‘परमेश्वर को पुकारा’ का भाव देता है।
- source_word: ἐν τῷ ἐπιδέσθαι
  choice: जब ... ने मुझ पर आक्रमण किया
  rationale: रूप और प्रसंग कठिन हैं। विलाप के शत्रुतापूर्ण प्रसंग में ‘आक्रमण किया’ सम्भावित अर्थ को स्पष्ट हिन्दी में देता है, जबकि पादटिप्पणी अन्य सम्भावना सुरक्षित रखती है।
- source_word: ἁμαρτωλούς
  choice: पापियों ने
  rationale: ἁμαρτωλούς पाप करने वाले व्यक्तियों को सीधे सूचित करता है। ‘पापी’ ‘दुष्ट’ की अपेक्षा मूल शब्द का अधिक निकटस्थ अनुवाद है।
theological_decisions:
- issue: प्रार्थना में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ इस्राएल के परमेश्वर को किए गए सम्बोधन के अनुकूल है और अनावश्यक रूप से सेवक-मालिक सम्बन्ध पर बल नहीं देता।
- issue: ‘प्रभु ... परमेश्वर’ के दोहरे सम्बोधन को रखना
  choice: दोनों समानांतर सम्बोधन अलग-अलग रखे गए
  alternative: दोनों को मिलाकर एक ही सम्बोधन बनाना
  rationale: यूनानी पाठ πρὸς Κύριον और πρὸς τὸν θεόν को समानांतर रूप से दोहराता है। दोनों को रखने से काव्यात्मक संरचना और पुकार की तीव्रता सुरक्षित रहती है।
- issue: ἐπιδέσθαι का शत्रुतापूर्ण अर्थ
  choice: आक्रमण किया
  alternative: आ पड़े
  rationale: विलाप के प्रसंग में शत्रुतापूर्ण क्रिया सम्भावित है, पर शब्दगत कठिनाई के कारण विकल्प पादटिप्पणी में स्पष्ट किया गया है और अनिश्चितता को सिद्धान्तगत निष्कर्ष में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक और सामान्य पाठकों के लिए सहज रूप अपनाया गया है। मूल की समानांतर रचना को दो उपवाक्यों में रखा गया है। ‘दोहाई दी’ तत्काल और व्याकुल पुकार का भाव देता है; ‘अन्त तक’ तथा कठिन ἐπιδέσθαι की अनिश्चितता पादटिप्पणियों में सुरक्षित है।
