translation:
  language: hi
  text: उनके पाप छिपे हुए थे[a], और मुझे पता नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके पाप गुप्त रूप से किए गए थे,’ ‘उनके पाप गुप्त स्थानों में थे,’ अथवा ‘उनके पाप छिपी हुई बातों में थे।’ यूनानी पद संक्षिप्त है और केवल भौतिक स्थानों से अधिक व्यापक अर्थ रख सकता है।
