lexical_decisions:
- source_word: αἱ ἁμαρτίαι αὐτῶν
  choice: उनके पाप
  rationale: बहुवचन संज्ञा ठोस पापों या अपराधपूर्ण कामों को दर्शाती है; ‘उनके पाप’ सीधा, स्वाभाविक और अर्थ की दृष्टि से खुला अनुवाद है।
- source_word: ἐν ἀποκρύφοις
  choice: छिपे हुए थे
  rationale: नपुंसकलिंग बहुवचन विशेषण का संज्ञात्मक अथवा क्रियाविशेषणीय प्रयोग यहाँ गोपनीयता या छिपेपन को व्यक्त करता है। यह अनुवाद भौतिक ‘गुप्त स्थानों’ तक अर्थ को सीमित नहीं करता।
- source_word: καὶ ἐγώ
  choice: और मुझे
  rationale: καί का सामान्य संयोजक अर्थ ‘और’ रखा गया है; ‘लेकिन’ कहकर विरोध को अनावश्यक रूप से अधिक प्रबल नहीं बनाया गया। हिन्दी वाक्य-विन्यास में ‘ἐγώ’ का भाव ‘मुझे’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: οὐκ ᾔδειν
  choice: पता नहीं था
  rationale: οἶδα के अपूर्ण भूतकाल का अर्थ ज्ञान या जानकारी का अभाव है; ‘पता नहीं था’ आधुनिक हिन्दी में सहज और स्पष्ट है।
theological_decisions:
- issue: ἐν ἀποκρύφοις में छिपेपन का स्वरूप
  choice: पापों को छिपा हुआ बताया गया है, पर यह तय नहीं किया गया कि वे किससे या किस प्रकार छिपे थे।
  alternative: उन्होंने गुप्त रूप से पाप किए; उनके पाप गुप्त स्थानों में थे; उनके पाप छिपी हुई बातों में थे।
  rationale: यूनानी पद संक्षिप्त और अर्थ की दृष्टि से खुला है। अगला खंड वक्ता की अनभिज्ञता बताता है, पर यह आवश्यक नहीं करता कि छिपापन केवल उसी से संबंधित माना जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण प्रयोग। ‘छिपे हुए थे’ मूल की संक्षिप्तता और अस्पष्टता को बनाए रखता है; पादटिप्पणी अन्य संभावित अर्थों को दर्ज करती है।
