  choice: उद्दंड हो गए
  rationale: यह क्रिया घमंडी, धृष्ट और मर्यादा लाँघने वाले व्यवहार को व्यक्त करती है। ‘उद्दंड हो गए’ आधुनिक हिन्दी में इसके नैतिक बल को स्वाभाविक ढंग से रखता है।
- source_word: ἐν τοῖς ἀγαθοῖς αὐτῶν
  choice: अपनी समृद्धि में
  rationale: बहुवचन ἀγαθά यहाँ अच्छी वस्तुओं, संपत्ति, लाभ या खुशहाली का संकेत दे सकता है। निकटवर्ती संदर्भ में ‘समृद्धि’ सहज है, पर अधिक शाब्दिक संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: οὐκ ἤνεγκαν
  choice: उन्होंने सहन नहीं किया
  rationale: φέρω का यह रूप ‘सहना’, ‘झेलना’ या ‘टिके रहना’ व्यक्त कर सकता है। यूनानी में कर्म नहीं बताया गया है, इसलिए हिन्दी में भी यह अनिर्दिष्ट रखा गया है।
