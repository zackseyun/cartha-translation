base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/004.yaml
  text: Their wealth was spread throughout all the land[c][b][a], and their glory reached to the end of the earth.
translation:
  language: hi
  text: उनकी धन-संपत्ति सारे देश में फैल गई[a], और उनकी महिमा[b] पृथ्वी के छोर तक पहुँच गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी पृथ्वी पर फैल गई।” यूनानी γῆ का अर्थ “देश/भूमि” या “पृथ्वी” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका यश।” यूनानी δόξα महिमा या गौरव के साथ-साथ सम्मान और ख्याति का भी बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πλοῦτος
  choice: धन-संपत्ति
  rationale: πλοῦτος का अर्थ धन या वैभव है। ‘धन-संपत्ति’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक एकवचन भाव को स्पष्ट करता है।
- source_word: αὐτῶν
  choice: उनकी
  rationale: यह पूर्व प्रसंग में उल्लिखित लोगों की ओर संकेत करने वाला सीधा संबंधवाचक सर्वनाम है।
- source_word: διεδόθη
  choice: फैल गई
  rationale: διαδίδωμι के कर्मवाच्य रूप में व्यापक रूप से फैल जाने या वितरित हो जाने का भाव है। यहाँ ‘फैल गई’ स्थानगत विस्तार को सहज रूप से व्यक्त करता है।
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: सारे देश में
  rationale: γῆ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ दोनों हो सकता है। पहले खंड में ‘देश’ और दूसरे में ‘पृथ्वी’ रखने से संभावित काव्यात्मक विस्तार बना रहता है।
- source_word: ἡ δόξα
  choice: महिमा
  rationale: δόξα महिमा, गौरव या यश का बोध करा सकता है। ‘महिमा’ ऊँची काव्यात्मक शैली और अर्थ की व्यापकता को बनाए रखता है।
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: पृथ्वी के छोर तक
  rationale: यह संसार की अत्यंत दूर सीमा के लिए प्रचलित काव्यात्मक अभिव्यक्ति है। ‘पृथ्वी के छोर तक’ स्पष्ट, संक्षिप्त और गरिमापूर्ण है।
theological_decisions:
- issue: दोनों खंडों में γῆ का भौगोलिक विस्तार
  choice: पहले प्रयोग को ‘देश’ और दूसरे को ‘पृथ्वी’ कहा गया है।
  alternative: दोनों स्थानों पर ‘पृथ्वी’ अथवा दोनों पर ‘देश’ कहा जा सकता है।
  rationale: यूनानी शब्द दोनों जगह एक ही है, पर पहले खंड का सामान्य क्षेत्र और दूसरे खंड की चरम विश्वव्यापी सीमा काव्यात्मक वृद्धि का संकेत दे सकती है। अनुवाद इस संभावित वृद्धि को रखता है, जबकि पादटिप्पणी वास्तविक शब्दगत अस्पष्टता बताती है।
- issue: दूसरे खंड में क्रिया का लोप
  choice: स्वाभाविक हिन्दी के लिए ‘पहुँच गई’ जोड़ा गया है।
  alternative: क्रिया को केवल पहले खंड में रखकर यूनानी काव्यात्मक लोप की हूबहू नकल की जा सकती है।
  rationale: यूनानी में दूसरे खंड की क्रिया पहले खंड से समझी जाती है। हिन्दी में बिना क्रिया का दूसरा खंड अधूरा और कृत्रिम लगेगा; ‘पहुँच गई’ कोई नया दावा नहीं जोड़ता, बल्कि निहित गति और सीमा को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धन-संपत्ति’, ‘महिमा’ और ‘पृथ्वी के छोर तक’ मूल के काव्यात्मक समानांतर विन्यास को बनाए रखते हैं; दूसरे खंड में निहित क्रिया को स्वाभाविक हिन्दी के लिए स्पष्ट किया गया है।
