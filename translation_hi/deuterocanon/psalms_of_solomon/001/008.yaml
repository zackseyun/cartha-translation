  text: Their lawless deeds surpassed those of the nations before them[b][a]; they profaned the holy things of the Lord with profanation.
translation:
  language: hi
  text: उनके अधर्मपूर्ण काम उनसे पहले की जातियों के कामों से बढ़कर थे; उन्होंने प्रभु की पवित्र वस्तुओं[a] को अपवित्रता से अपवित्र किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु का पवित्रस्थान” अथवा “प्रभु के पवित्र स्थान”; यूनानी पद बहुवचन है और पवित्र वस्तुओं या व्यापक रूप से पवित्र क्षेत्र के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “उन्होंने प्रभु की पवित्र वस्तुओं को अपवित्रता से अपवित्र किया।” यूनानी में एक ही मूल की क्रिया और संज्ञा का प्रयोग बल देने के लिए हुआ है।
    reason: source_form
lexical_decisions:
- source_word: αἱ ἀνομίαι αὐτῶν
  choice: उनके अधर्म के काम
  rationale: बहुवचन अभिव्यक्ति को स्वाभाविक हिन्दी में ऐसे कामों के रूप में व्यक्त किया गया है जो परमेश्वर की व्यवस्था का उल्लंघन करते हैं; केवल अमूर्त ‘अधर्म’ कहने से बहुवचन कृत्यों का भाव दब जाता।
- source_word: ὑπὲρ τὰ πρὸ αὐτῶν ἔθνη
  choice: उनसे पहले की जातियों के कामों से भी बढ़कर थे
  rationale: ὑπέρ के तुलनात्मक अर्थ और πρὸ के कालगत अर्थ को स्पष्ट रखा गया है। हिन्दी में उचित तुलना के लिए ‘कामों’ की पुनरावृत्ति की गई है, जो यूनानी में अर्थतः निहित है।
- source_word: ἐβεβήλωσαν
  choice: अपवित्र कर दिया
  rationale: क्रिया का आशय किसी पवित्र वस्तु को सामान्य या अपवित्र ठहराने/बरतने से है। ‘अपवित्र कर दिया’ आधुनिक हिन्दी में स्पष्ट और धर्मग्रंथीय प्रसंग के अनुकूल है।
- source_word: τὰ ἅγια Κυρίου
  choice: प्रभु की पवित्र वस्तुओं
  rationale: यूनानी पद नपुंसकलिंग बहुवचन है और पवित्र वस्तुओं, पवित्र स्थानों अथवा सामूहिक रूप से पवित्रस्थान का संकेत दे सकता है। मुख्य पाठ में बहुवचन और व्यापकता सुरक्षित रखी गई है।
- source_word: ἐν βεβηλώσει
  choice: घोर रूप से
  rationale: सजातीय संज्ञा क्रिया को बल देती है। शब्दशः अत्यंत अस्वाभाविक हिन्दी दोहराव के स्थान पर मुख्य पाठ में तीव्रता व्यक्त की गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या τὰ ἅγια Κυρίου को विशेष रूप से ‘प्रभु का पवित्रस्थान’ कहा जाए या व्यापक रूप से ‘प्रभु की पवित्र वस्तुएँ’
  choice: प्रभु की पवित्र वस्तुएँ
  alternative: प्रभु का पवित्रस्थान / प्रभु के पवित्र स्थान
  rationale: यूनानी बहुवचन व्यापक है, यद्यपि सेप्टुआजिन्ट और दूसरे मन्दिर-कालीन प्रयोग में यह पवित्रस्थान को भी सूचित कर सकता है। मुख्य पाठ किसी एक स्थानगत अर्थ को अनिवार्य नहीं बनाता; विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जातियाँ’ प्राचीन धर्मग्रंथीय संदर्भ में ἔθνη का स्वाभाविक रूप है। सजातीय यूनानी दोहराव को मुख्य पाठ में ‘घोर रूप से’ द्वारा अर्थपूर्ण बनाया गया है, जबकि उसका औपचारिक स्वरूप पादटिप्पणी में सुरक्षित है।
