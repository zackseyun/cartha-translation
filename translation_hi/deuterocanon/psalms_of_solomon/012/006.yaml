  text: May the Lord protect a quiet soul that hates the unjust[c][b][a], and may the Lord guide a man who makes peace in the house.
translation:
  language: hi
  text: प्रभु उस शांत आत्मा[a] की रक्षा करे जो अन्यायियों से घृणा करती है, और प्रभु उस पुरुष का मार्गदर्शन करे[b] जो घर[c] में शांति स्थापित करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मा’ का अर्थ यहाँ ‘जीवन’ या ‘स्वयं व्यक्ति’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सीधी दिशा दे’ अथवा ‘सीधा करे’।
    reason: lexical_alternative
  - marker: c
    text: या ‘घराने में’ अथवा ‘परिवार में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαι
  choice: रक्षा करे
  rationale: अओरिस्ट ऑप्टेटिव प्रार्थना अथवा मंगलकामना व्यक्त करता है; ‘रक्षा करे’ इसे स्वाभाविक और स्पष्ट हिंदी में रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर की उपाधि है; ‘प्रभु’ आधुनिक बाइबलीय हिंदी में स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: ψυχὴν
  choice: प्राण
  rationale: ψυχή के अर्थ-क्षेत्र में प्राण, जीवन और स्वयं व्यक्ति आते हैं। ‘प्राण’ भीतरी व्यक्ति का भाव बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἡσύχιον
  choice: शांत
  rationale: ἡσύχιος स्थिर, शांत और निरुपद्रवी स्वभाव का बोध कराता है; ‘शांत’ सहज और संक्षिप्त है।
- source_word: μισοῦσαν ἀδίκους
  choice: जो अन्यायियों से घृणा करता है
  rationale: कृदंत ψυχή का विशेषण है और उसके नैतिक रुख को व्यक्त करता है। ἀδίκους को संज्ञात्मक बहुवचन मानते हुए ‘अन्यायियों’ रखा गया है।
- source_word: κατευθύναι
  choice: सीधा मार्ग दिखाए
  rationale: κατευθύνω दिशा देने अथवा सीधा करने का भाव रखता है। यह चयन दोनों ध्वनियों को स्वाभाविक हिंदी में समेटता है।
- source_word: ἄνδρα
  choice: पुरुष
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग एकवचन है; ‘पुरुष’ स्रोत के रूप को बनाए रखता है।
- source_word: ποιοῦντα εἰρήνην
  choice: जो ... शांति स्थापित करता है
  rationale: शाब्दिक ‘शांति करता है’ अस्वाभाविक होता; ‘शांति स्थापित करता है’ सक्रिय मेल-मिलाप कराने का भाव देता है।
- source_word: ἐν οἴκῳ
  choice: घर में
  rationale: οἶκος भवन, घर या घराने को सूचित कर सकता है। ‘घर में’ सीधा और स्वाभाविक है; व्यापक सामाजिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘अन्यायियों से घृणा’ की नैतिक तीक्ष्णता
  choice: स्रोत की स्पष्ट भाषा ‘घृणा करता है’ को बनाए रखा
  alternative: ‘अन्याय से घृणा करता है’ या ‘अन्यायियों को नापसंद करता है’
  rationale: यूनानी में कर्म ἀδίκους व्यक्तियों के लिए प्रयुक्त बहुवचन विशेषण है, न कि अमूर्त ‘अन्याय’। इसे नरम करना या कर्म बदलना पाठ के नैतिक तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। दोनों यूनानी ऑप्टेटिव क्रियाओं को ‘करे/दिखाए’ से मंगलकामना के रूप में व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न संबद्ध पदांशों के तुरंत बाद रखे गए हैं।
