  yaml_path: translation/deuterocanon/psalms_of_solomon/012/001.yaml
  text: Lord[a], deliver my soul from a lawless and wicked man, from a lawless and whispering tongue, speaking falsehood and deceit[c][b];
translation:
  language: hi
  text: हे प्रभु, मेरी आत्मा[a] को व्यवस्था-विरोधी और दुष्ट मनुष्य से छुड़ा; उस व्यवस्था-विरोधी और फुसफुसानेवाली[b] जीभ से, जो झूठ और छल बोलती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरी आत्मा’ का अनुवाद ‘मेरा जीवन’ या केवल ‘मुझे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘चुगली करनेवाली जीभ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: यह परमेश्वर को किया गया सीधा सम्बोधन है। ‘हे प्रभु’ आधुनिक हिन्दी में प्रार्थना की गरिमा और सम्बोधन का बल बनाए रखता है।
- source_word: ῥῦσαι
  choice: छुड़ा
  rationale: आज्ञार्थक क्रिया संकट और हानिकारक व्यक्ति तथा वाणी से सक्रिय रूप से बचाने की विनती व्यक्त करती है।
- source_word: τὴν ψυχήν μου
  choice: मेरी आत्मा
  rationale: ψυχή का अर्थ ‘आत्मा’, ‘जीवन’ या स्वयं व्यक्ति हो सकता है। ‘मेरी आत्मा’ मूल की गंभीरता और उसके आंतरिक, व्यक्तिगत आयाम को बनाए रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἀνδρὸς παρανόμου καὶ πονηροῦ
  choice: व्यवस्था-विरोधी और दुष्ट मनुष्य
  rationale: ἀνήρ यहाँ स्पष्ट रूप से पुरुष को सूचित करता है। παράνομος व्यवस्था के विरुद्ध या उसके बाहर चलने का भाव देता है, जबकि πονηρός नैतिक दुष्टता को अलग से व्यक्त करता है।
- source_word: γλώσσης
  choice: जीभ
  rationale: मूल पाठ हानिकारक वाणी के लिए ‘जीभ’ का सजीव काव्यात्मक बिंब प्रयोग करता है; उसे बनाए रखा गया है।
- source_word: ψιθυροῦ
  choice: कानाफूसी करनेवाली
  rationale: यह शब्द दबे स्वर में कही जानेवाली, प्रायः परनिंदा या चुगली से जुड़ी वाणी का भाव देता है। विशेषण को यूनानी व्याकरण के अनुसार ‘जीभ’ का वर्णन करनेवाला रखा गया है, किसी ‘कानाफूसी करनेवाले’ व्यक्ति की संज्ञा नहीं बनाया गया।
- source_word: λαλούσης ψευδῆ καὶ δόλια
  choice: जो झूठ और छल की बातें बोलती है
  rationale: स्त्रीलिंग कृदन्त ‘जीभ’ को ही संशोधित करता है। हिन्दी वाक्यांश दोनों तत्वों—असत्य और कपट—को स्पष्ट तथा स्वाभाविक ढंग से बनाए रखता है।
