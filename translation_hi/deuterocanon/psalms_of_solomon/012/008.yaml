base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/008.yaml
  text: May the sinners perish from the presence of the Lord once for all[c][b][a], and may the devout of the Lord inherit the promises.
translation:
  language: hi
  text: वे पापी प्रभु की उपस्थिति से सदा के लिए नाश हो जाएँ[c][b], और प्रभु के भक्त[a] प्रतिज्ञाएँ विरासत में पाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु के पवित्र जन” अथवा “प्रभु के निष्ठावान जन।”
    reason: lexical_alternative
  - marker: b
    text: या केवल, “एक बार”; यूनानी शब्द एकमात्र घटना या अंतिमता—दोनों में से किसी पर बल दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “पापी नाश हो जाएँ।”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀπόλοιντο
  choice: नाश हो जाएँ
  rationale: यूनानी विधिलिंग-सदृश optative यहाँ प्रार्थना या कामना व्यक्त करता है; ‘नाश हो जाएँ’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है और ‘नष्ट किए जाएँ’ जैसी अनावश्यक कर्मवाच्यता नहीं जोड़ता।
- source_word: οἱ ἁμαρτωλοὶ
  choice: वे पापी
  rationale: निश्चित उपपद οἱ को ‘वे’ से संकेतित किया गया है, ताकि यह केवल सामान्य नैतिक श्रेणी न लगे, बल्कि प्रसंग में पहचाने गए समूह की ओर भी संकेत कर सके।
- source_word: ἀπὸ προσώπου Κυρίου
  choice: प्रभु की उपस्थिति से
  rationale: शाब्दिक अर्थ ‘प्रभु के मुख के सामने से’ है; ‘प्रभु की उपस्थिति से’ आधुनिक हिन्दी में स्वाभाविक रहते हुए सम्बन्धात्मक और न्यायिक आशय बचाता है।
- source_word: ἅπαξ
  choice: सदा के लिए
  rationale: इस विनाश-कामना के प्रसंग में शब्द अंतिमता पर बल दे सकता है। चूँकि इसका अर्थ केवल ‘एक बार’ भी हो सकता है, उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: ὅσιοι
  choice: भक्त
  rationale: यह शब्द पवित्रता, भक्ति और वाचा-निष्ठा से पहचाने जाने वाले लोगों को सूचित कर सकता है। ‘भक्त’ सहज और गरिमापूर्ण है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: κληρονομήσαισαν
  choice: विरासत में पाएँ
  rationale: दूसरा optative भी कामना व्यक्त करता है। ‘विरासत में पाएँ’ प्राप्ति के साथ वाचागत उत्तराधिकार का भाव बनाए रखता है।
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञाएँ
  rationale: यूनानी में उपपद नहीं है, इसलिए हिन्दी में भी अनावश्यक रूप से ‘वे प्रतिज्ञाएँ’ नहीं जोड़ा गया; प्रसंग इन्हें जानी-पहचानी दिव्य प्रतिज्ञाओं के रूप में समझने की अनुमति देता है।
theological_decisions:
- issue: οἱ ἁμαρτωλοὶ की निश्चितता और समूहगत संकेत
  choice: ‘वे पापी’ द्वारा निश्चित, प्रसंगगत समूह का संकेत बनाए रखा गया।
  alternative: सामान्य अर्थ में केवल ‘पापी’ या ‘पापी लोग’।
  rationale: यूनानी निश्चित उपपद को मिटा देने से पद का सम्भावित सामाजिक-पolemical लक्ष्य सामान्य नैतिक कथन बन सकता था; फिर भी अनुवाद किसी खास ऐतिहासिक दल की पहचान पाठ में आरोपित नहीं करता।
- issue: ὅσιοι का धार्मिक अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘भक्त’।
  alternative: ‘पवित्र जन’ या ‘निष्ठावान जन’।
  rationale: यूनानी शब्द में पवित्रता, भक्ति और निष्ठा के अर्थ एक-दूसरे से जुड़े हैं। मुख्य पाठ एक स्वाभाविक हिन्दी विकल्प देता है और अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनात्मक है। ‘नाश हो जाएँ’ तथा ‘विरासत में पाएँ’ समानान्तर कामना-वाक्यों को बनाए रखते हैं। ‘उपस्थिति’ गरिमापूर्ण धार्मिक रजिस्टर देता है, जबकि पादटिप्पणियाँ मूल यूनानी की वास्तविक lexical अस्पष्टताओं को सुरक्षित रखती हैं।
