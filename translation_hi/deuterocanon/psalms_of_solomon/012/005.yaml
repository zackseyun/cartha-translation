lexical_decisions:
- source_word: γλῶττα
  choice: जीभ
  rationale: एकवचन के ठोस और सजीव बिंब को बनाए रखा गया है; यहाँ जीभ सामूहिक रूप से कानाफूसी करनेवालों की वाणी को दर्शाती है।
- source_word: ψιθύρων
  choice: कानाफूसी करनेवालों
  rationale: यह शब्द छिपकर धीमे स्वर में दूसरों के विरुद्ध बोलनेवालों को सूचित करता है। ‘कानाफूसी करनेवाले’ मूल बिंब को बचाता है, जबकि ‘निंदा करनेवाले’ अर्थगत विकल्प है।
- source_word: ἀπόλοιτο
  choice: नष्ट हो जाए
  rationale: यह रूप न्याय की कामना या अभिशाप व्यक्त करता है। ‘नष्ट हो जाए’ हिंदी में स्वाभाविक और गंभीर है तथा विनाश के ढंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν πυρὶ φλογός
  choice: धधकती आग में
  rationale: ग्रीक के ‘ज्वाला की आग’ जैसे प्रबल अग्नि-बिंब को स्वाभाविक काव्यात्मक हिंदी में व्यक्त किया गया है।
- source_word: ὁσίων
  choice: भक्त जनों
  rationale: ὅσιοι यहाँ धार्मिक निष्ठा और भक्ति से पहचाने जानेवाले लोगों को सूचित करता है; ‘भक्त जन’ आधुनिक हिंदी में उस अर्थ को ‘पवित्र जन’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
