  text: The Lord’s salvation be upon Israel[a], his servant[b], forever.
translation:
  language: hi
  text: प्रभु का उद्धार उसके सेवक[a] इस्राएल पर सदा बना रहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बालक” अथवा “सन्तान।” यूनानी शब्द παῖς में ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रभु का उद्धार उसके सेवक इस्राएल पर सदा है।” यूनानी में यहाँ स्पष्ट क्रिया नहीं है; आसपास का संदर्भ कामना अथवा प्रार्थना का भाव सुझाता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: κυρίου
  choice: प्रभु का
  rationale: κύριος के संबंधकारक रूप को अधिकार और स्रोत—दोनों की छाया बनाए रखते हुए स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: σωτηρία
  choice: उद्धार
  rationale: यह शब्द बचाव और मुक्ति के व्यापक अर्थ को समेटता है और इस प्रार्थनात्मक पंक्ति के धार्मिक भार को बनाए रखता है।
- source_word: ἐπὶ
  choice: पर
  rationale: ἐπί का स्थान-संबंधी बिंब सीधे और स्वाभाविक रूप से सुरक्षित रहता है।
- source_word: παῖδα
  choice: सेवक
  rationale: παῖς का अर्थ ‘बालक/सन्तान’ भी हो सकता है, पर परमेश्वर और इस्राएल के वाचा-संबंध में ‘सेवक’ सबसे उपयुक्त मुख्य पाठ है; वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह यूनानी मुहावरा अनन्त अथवा स्थायी अवधि बताता है; ‘सदा’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
theological_decisions:
- issue: क्रियारहित यूनानी वाक्य को कथन मानें या आशीर्वचन/कामना
  choice: ‘बना रहे’—आशीर्वचन अथवा प्रार्थनात्मक कामना
  alternative: ‘है’—साधारण कथन
  rationale: मूल पंक्ति में कोई स्पष्ट समापिका क्रिया नहीं है। निकटवर्ती पदों की कामनासूचक क्रियाएँ इस पंक्ति को भी प्रार्थनात्मक आशीर्वचन के रूप में पढ़ने का मजबूत संदर्भ देती हैं, पर कथनात्मक पाठ की सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: इस्राएल के लिए παῖς का संबंधपरक अर्थ
  choice: सेवक
  alternative: बालक/सन्तान
  rationale: ‘सेवक’ वाचा के अंतर्गत इस्राएल की सेवा और निर्भरता को व्यक्त करता है, जबकि ‘बालक/सन्तान’ की अर्थ-सम्भावना को अस्वीकार नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थनात्मक रूप अपनाया गया है। ‘उसके सेवक इस्राएल’ से यूनानी पदबंध का संबंध स्पष्ट रहता है और भाषा अनावश्यक रूप से संस्कृतनिष्ठ नहीं होती।
