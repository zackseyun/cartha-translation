lexical_decisions:
- source_word: ἐν ποικιλίᾳ στροφῆς
  choice: तरह-तरह के टेढ़े घुमावों से भरे
  rationale: ποικιλίᾳ विविधता और στροφῆς मुड़ने या घुमाव का बिंब देता है। यह हिंदी अभिव्यक्ति कपटपूर्ण, बदलती हुई वाणी का नकारात्मक भाव स्पष्ट रखते हुए मूल घुमाव-बिंब को बचाती है।
- source_word: οἱ λόγοι τῆς γλώσσης
  choice: जीभ के शब्द
  rationale: यह मूल यूनानी की ठोस ‘जीभ’ वाली भाषा को बनाए रखता है और उसे केवल अमूर्त ‘वाणी’ में नहीं बदलता।
- source_word: ἀνδρὸς πονηροῦ
  choice: दुष्ट पुरुष
  rationale: πονηροῦ का नैतिक अर्थ ‘दुष्ट’ से स्वाभाविक और स्पष्ट रूप में व्यक्त होता है; ἀνδρός के एकवचन पुल्लिंग को ‘पुरुष’ से सुरक्षित रखा गया है।
- source_word: καλλονὴ
  choice: आकर्षण
  rationale: καλλονή का मूल अर्थ सुंदरता है, पर यहाँ उस मनभावन प्रभाव की ओर संकेत है जिससे दुष्ट व्यक्ति लोगों को प्रभावित करता है। ‘आकर्षण’ संदर्भ में स्वाभाविक है, जबकि ‘सुंदरता’ को पादटिप्पणी में रखा गया है।
- source_word: πῦρ ἀνάπτον
  choice: भड़कती आग
  rationale: वर्तमान सक्रिय कृदंत ἀνάπτον आग के सक्रिय रूप से सुलगने या फैलने का चित्र देता है; ‘भड़कती आग’ इस गतिशीलता को स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: ἐν λαῷ
  choice: लोगों के बीच
  rationale: यह λαός के सामूहिक अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है और किसी विशिष्ट जातीय या धार्मिक समुदाय को अनावश्यक रूप से निर्धारित नहीं करता।
