  yaml_path: translation/deuterocanon/psalms_of_solomon/012/003.yaml
  text: His dwelling is to fill houses with a lying tongue[a], to cut down trees of gladness[d][c][b], flaming against the lawless.
translation:
  language: hi
  text: उसका प्रवास यही है—झूठी जीभ से घरों को भरना और अधर्मियों को जला देने वाले आनन्द के वृक्षों को काट डालना।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका निवास” या “उसका अस्थायी ठहराव”; यूनानी संज्ञा किसी स्थान पर रहने या प्रवास करने को दर्शाती है, प्रायः परदेशी के रूप में रहने के भाव के साथ।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “आनन्द के वृक्ष”; सम्भवतः यह उस बात का रूपक है जिससे कोई घर-परिवार फलता-फूलता और आनन्दित होता है।
    reason: cultural_note
  - marker: c
    text: अन्तिम यूनानी वाक्यांश अत्यन्त संक्षिप्त और कठिन है। स्त्रीलिंग संबंधकारक कृदन्त व्याकरणतः “आनन्द” से संबद्ध है; इसका अर्थ “अधर्मियों को भड़काने वाला” या “अधर्मियों को जला देने वाला” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ παροικία αὐτοῦ
  choice: उसका परदेशी निवास
  rationale: παροικία निवास या अस्थायी प्रवास को दर्शाता है और प्रायः परदेशी के रूप में रहने का भाव रखता है। ‘परदेशी निवास’ इस संज्ञात्मक रचना और उसके निहित बाहरीपन, दोनों को बनाए रखता है।
- source_word: ἐμπλῆσαι οἴκους ἐν γλώσσῃ ψεύδει
  choice: झूठी जीभ से घरों को भरना
  rationale: दोनों क्रियार्थक रूपों की मूल संज्ञात्मक संरचना बनाए रखी गई है। ‘झूठी जीभ’ छलपूर्ण वाणी के शारीरिक और सजीव बिंब को सुरक्षित रखता है।
- source_word: ἐκκόψαι δένδρα εὐφροσύνης
  choice: आनन्द के वृक्षों को काट डालना
  rationale: ἐκκόψαι की प्रबल काट गिराने की क्रिया और δένδρα का ठोस वृक्ष-बिंब सुरक्षित रखा गया है; रूपक को व्याख्यात्मक अमूर्तन में नहीं बदला गया।
- source_word: φλογίζούσης παρανόμους
  choice: उस आनन्द के, जो अधर्मियों को आग लगा देता है
  rationale: φλογίζούσης स्त्रीलिंग संबंधकारक एकवचन है और व्याकरणतः निकटवर्ती εὐφροσύνης से जुड़ता है; इसलिए इसे उस पुरुष की स्वतंत्र क्रिया नहीं बनाया गया। ‘आग लगा देता है’ अग्नि-बिंब और सकर्मक भाव को बनाए रखता है, जबकि वाक्यांश की कठिनता पादटिप्पणी में स्पष्ट की गई है।
