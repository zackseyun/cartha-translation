  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। मूल यूनानी की संज्ञात्मक रचना और समानान्तर क्रियार्थक रूपों को ‘यही है—… भरना और … काट डालना’ से सुरक्षित रखा गया है। अन्तिम कठिन संबंधकारक कृदन्त को चुपचाप पुरुष की अलग क्रिया नहीं बनाया गया, बल्कि मुख्य पाठ में उसके निकटतम व्याकरणिक सम्बन्ध और पादटिप्पणी में अर्थगत अनिश्चितता को रखा गया है।
