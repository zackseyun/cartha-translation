- from: उसका परदेशी निवास[a] यही है—झूठी जीभ से घरों को भरना और आनन्द के वृक्षों[b] को काट डालना—उस आनन्द के, जो अधर्मियों को आग लगा देता है।[c]
  to: उसका प्रवास यही है—झूठी जीभ से घरों को भरना और अधर्मियों को जला देने वाले आनन्द के वृक्षों को काट डालना।[a][b][c]
  rationale: The revision improves idiomatic Hindi and removes the detached relative-clause construction, while preserving the Greek nominal syntax, the concrete “trees of gladness” image, and the grammatical dependence of the final fire participle on “gladness.” The alternate interpretive possibilities remain explicitly preserved in the footnote.
