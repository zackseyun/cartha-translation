review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the nominal construction of ἡ παροικία αὐτοῦ and the two infinitival actions. It also correctly recognizes that φλογιζούσης is feminine genitive singular and is dependent on εὐφροσύνης, not an additional action by the implied person. However, the Hindi relative construction “उस आनन्द के, जो…” is unnecessarily disjointed after “वृक्षों” and makes the intended grammatical dependency harder to read.
  naturalness: “उसका परदेशी निवास यही है” is understandable but stiff in modern Hindi. “उसका प्रवास यही है” is more idiomatic while retaining the sojourning/residence sense. Recasting the final phrase as “अधर्मियों को जला देने वाले आनन्द के वृक्ष” allows the participial qualifier to remain associated with “आनन्द” in readable Hindi.
  terminology: “झूठी जीभ,” “घर,” “आनन्द,” “वृक्ष,” and “अधर्मी” are appropriate, dignified Hindi equivalents that preserve the concrete imagery and register. “प्रवास” suitably represents παροικία; the footnote retains the residence-as-a-stranger nuance.
  issues:
  - severity: medium
    issue: The final Hindi relative clause is awkwardly detached from its antecedent.
    rationale: In “आनन्द के वृक्षों को काट डालना—उस आनन्द के, जो…,” the explanatory genitive phrase interrupts the construction and reads as an afterthought. A compact pre-nominal modifier more naturally conveys that the Greek participle qualifies εὐφροσύνης.
  - severity: low
    issue: “परदेशी निवास” is less natural than “प्रवास.”
    rationale: While semantically defensible, the draft phrase is not idiomatic modern Hindi in this compressed predicative construction. “प्रवास” conveys sojourning without adding a stronger claim of permanent foreign residence.
  revised_text: उसका प्रवास यही है—झूठी जीभ से घरों को भरना और अधर्मियों को जला देने वाले आनन्द के वृक्षों को काट डालना।[a][b][c]
