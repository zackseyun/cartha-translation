  yaml_path: translation/deuterocanon/psalms_of_solomon/012/004.yaml
  text: May God throw lawless houses into turmoil in war by whispering lips[a]; may God remove from the innocent the lips of the lawless in distress[c][b], and may the bones of whisperers be scattered away from those who fear the Lord.
translation:
  language: hi
  text: परमेश्वर अधर्मियों के घरों[b] को युद्ध में कानाफूसी करनेवाले होंठों[a] से उथल-पुथल कर दे। परमेश्वर संकट की स्थिति में[c] निर्दोषों से अधर्मियों के होंठ दूर कर दे; और कानाफूसी करनेवालों की हड्डियाँ प्रभु का भय माननेवालों से दूर तितर-बितर हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कानाफूसी करनेवाले होंठ’ और ‘कानाफूसी करनेवाले’ के स्थान पर ‘बदनामी करनेवाले होंठ’ और ‘निंदक’ भी हो सकता है। यूनानी ψιθυρ-शब्द-समूह केवल धीमे बोलने को नहीं, बल्कि गुप्त और दुर्भावनापूर्ण वाणी को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘घरों’ का अर्थ ‘घरानों’ या ‘परिवारों’ से भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में ‘संकट में’ का संबंध अस्पष्ट है; यह निर्दोषों, अधर्मियों, या दूर किए जाने की परिस्थिति को भी सूचित कर सकता है।
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: συνταράξαι
  choice: उथल-पुथल कर दें
  rationale: यह क्रिया तीव्र हलचल और अव्यवस्था का बोध कराती है; यूनानी कामनार्थक रूप को हिन्दी में प्रार्थनात्मक इच्छा के रूप में रखा गया है।
- source_word: οἴκους
  choice: घरों
  rationale: मूल ठोस अर्थ ‘घर’ है, पर प्रसंग में घराने या परिवार भी अभिप्रेत हो सकते हैं; विकल्प पादटिप्पणी में दिया गया है।
- source_word: παρανόμους / παρανόμων
  choice: अधर्मियों / अधर्मियों के
  rationale: यह परमेश्वर की व्यवस्था के विरुद्ध चलनेवालों का संकेत देता है; ‘अधर्मी’ स्वाभाविक बाइबलीय हिन्दी है और केवल नागरिक गैरकानूनीपन तक अर्थ सीमित नहीं करता।
- source_word: χείλεσι ψιθυροῖς
  choice: कानाफूसी करनेवाले होंठ
  rationale: यह गुप्त और दुर्भावनापूर्ण वाणी की सजीव छवि तथा आगे ψιθύρων से शब्दगत संबंध बनाए रखता है।
- source_word: μακρύναι
  choice: दूर कर दे
  rationale: मूल में दूर हटाने की प्रार्थनात्मक कामना है; हिन्दी में स्पष्ट और स्वाभाविक रूप चुना गया है।
- source_word: ἀκάκων
  choice: निर्दोषों
  rationale: यह निष्कपट, अहानिकर या निर्दोष लोगों का बोध देता है; ‘निर्दोष’ आधुनिक पाठक के लिए सहज है।
- source_word: ἐν ἀπορίᾳ
  choice: संकट में पड़े
  rationale: ἀπορία कठिनाई, असहाय दशा या विकट स्थिति का संकेत दे सकता है। वाक्य-विन्यास की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ψιθύρων
  choice: कानाफूसी करनेवालों
  rationale: पहले खंड के ψιθυροῖς से शब्दगत संबंध रखा गया है; दुर्भावनापूर्ण निंदा का संभावित अर्थ पादटिप्पणी में बताया गया है।
- source_word: φοβουμένων Κύριον
  choice: प्रभु का भय माननेवालों
  rationale: यह श्रद्धापूर्ण भक्ति के लिए प्रचलित बाइबलीय अभिव्यक्ति है और Κύριον को ‘प्रभु’ से प्रस्तुत करता है।
theological_decisions:
- issue: ἐν ἀπορίᾳ का संबंध
  choice: मुख्य पाठ में इसे निर्दोषों की संकटग्रस्त दशा से जोड़ा गया है।
  alternative: यह अधर्मियों की दशा अथवा दूर करने की परिस्थिति/रीति को भी विशेषित कर सकता है।
  rationale: यूनानी पदक्रम व्याकरणिक संबंध को पूरी तरह निश्चित नहीं करता; मुख्य पाठ स्वाभाविक सम्भावित अर्थ देता है और पादटिप्पणी अस्पष्टता बचाती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। समान यूनानी शब्द-समूह के लिए ‘कानाफूसी’ की पुनरावृत्ति रखी गई है। मुख्य पाठ में विरामचिह्नों द्वारा तीन कामनात्मक खंड स्पष्ट किए गए हैं।
