  yaml_path: translation/deuterocanon/psalms_of_solomon/009/007.yaml
  text: Our deeds are within the choice and power of our soul[d][c][b][a], to do righteousness and unrighteousness with the works of our hands.
translation:
  language: hi
  text: हमारे कर्म हमारी आत्मा के चयन और सामर्थ्य[a] के अधीन हैं—अपने हाथों के कामों से[c] धार्मिकता[b] और अधार्मिकता करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधिकार” अथवा “नियंत्रण”।
    reason: lexical_alternative
  - marker: b
    text: या, “न्याय”।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “हमारे हाथों के कामों के द्वारा।”
    reason: literal_rendering
lexical_decisions:
- source_word: τὰ ἔργα ἡμῶν
  choice: हमारे कर्म
  rationale: ‘कर्म’ नैतिक अर्थ रखने वाले कार्यों के लिए स्वाभाविक और स्रोत के ἔργα के निकट है।
- source_word: ἐκλογῇ
  choice: चुनाव
  rationale: यहाँ शब्द मनुष्य के नैतिक चुनाव को व्यक्त करता है, न कि धर्मवैज्ञानिक अर्थ में ‘चुनाव’ या ‘चुने जाने’ की किसी विशेष धारणा को।
- source_word: ἐξουσίᾳ
  choice: सामर्थ्य
  rationale: संदर्भ में यह नैतिक कार्य करने की वास्तविक क्षमता या नियंत्रण बताता है। ‘अधिकार’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: τῆς ψυχῆς ἡμῶν
  choice: हमारी आत्मा
  rationale: एकवचन ψυχή और प्रथम पुरुष बहुवचन संबंधवाचक रूप को पारदर्शी ढंग से सुरक्षित रखा गया है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह व्यापक नैतिक सहीपन को व्यक्त करता है और ἀδικία के साथ बने विरोध को बनाए रखता है; ‘न्याय’ भी संभव है।
- source_word: ἀδικίαν
  choice: अधार्मिकता
  rationale: δικαιοσύνη/ἀδικία के प्रत्यक्ष नैतिक और शब्दगत विरोध को हिन्दी में सुरक्षित रखने के लिए समानांतर पद चुना गया है।
- source_word: ἔργοις χειρῶν ἡμῶν
  choice: अपने हाथों के कामों से
  rationale: यह यूनानी के ठोस शारीरिक बिंब को स्वाभाविक हिन्दी में बनाए रखता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पद में मानवीय नैतिक कर्तृत्व और उत्तरदायित्व पर स्पष्ट बल है।
  choice: ‘चुनाव और सामर्थ्य’ द्वारा यह रखा गया है कि मनुष्य के कर्म उसकी आंतरिक नैतिक चयन-क्षमता के क्षेत्र में हैं।
  alternative: ‘निर्णय और अधिकार’ अथवा ‘चुनाव और नियंत्रण’
  rationale: अनुवाद पाठ के मानवीय उत्तरदायित्व के दावे को न तो कम करता है और न इसे स्वतंत्र इच्छा की किसी विशिष्ट सांप्रदायिक व्याख्या में बदलता है। धार्मिकता और अधार्मिकता दोनों का तनाव यथावत रखा गया है।
- issue: δικαιοσύνη और ἀδικία का विरोध
  choice: ‘धार्मिकता और अधार्मिकता’
  alternative: ‘न्याय और अन्याय’
  rationale: चुना हुआ युग्म लेखक के शब्दगत समानांतर और व्यापक नैतिक अर्थ को बनाए रखता है, जबकि ‘न्याय और अन्याय’ संभव किंतु अपेक्षाकृत सामाजिक-कानूनी अर्थ की ओर झुक सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्रोत-पारदर्शी रखी गई है। वाक्य की डैश-रचना यूनानी के infinitival स्पष्टीकरण को बिना उद्देश्य या परिणाम का अर्थ अनावश्यक रूप से निश्चित किए प्रस्तुत करती है। ‘आत्मा’ स्रोत के ψυχή को स्पष्ट रखता है, और ‘कर्म’/‘काम’ की भिन्नता मूल में ἔργα की पुनरावृत्ति के बावजूद हिन्दी में भारी पुनरुक्ति से बचाती है।
