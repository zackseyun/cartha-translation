review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the principal terms and the moral contrast of δικαιοσύνη and ἀδικία. However, ‘...के चुनाव और सामर्थ्य में हैं’ is not idiomatic Hindi for the Greek assertion that deeds lie within the soul’s sphere of choice and capacity. ‘के अधीन हैं’ gives the intended relation naturally without adding a doctrinal claim.
  naturalness: ‘चुनाव’ is understandable but is strongly associated in current Hindi with an election; ‘चयन’ is more natural in this context of moral agency. The infinitival continuation is also improved by using ‘...करने के लिए,’ which retains the source’s open purpose/capacity nuance in a readable Hindi construction.
  terminology: ‘आत्मा,’ ‘सामर्थ्य,’ and the paired ‘धार्मिकता और अधार्मिकता’ are appropriate and preserve the Greek wording and moral register. The alternative footnote for ἐξουσία requires corrected Hindi quotation punctuation.
  issues:
  - severity: medium
    issue: The phrase ‘हमारी आत्मा के चुनाव और सामर्थ्य में हैं’ is syntactically and idiomatically strained.
    rationale: Hindi normally expresses this relation as being under, or within the scope of, someone’s choice and capacity. ‘के अधीन हैं’ makes the agency relation clear while preserving the Greek sense.
  - severity: low
    issue: ‘चुनाव’ is less suitable than ‘चयन’ for an individual moral choice in this elevated context.
    rationale: In modern standard Hindi, ‘चुनाव’ commonly evokes an election, whereas ‘चयन’ naturally denotes choosing without that association.
  - severity: low
    issue: Footnote a has malformed quotation punctuation.
    rationale: The closing quotation mark after ‘अधिकार’ prematurely closes the quotation, while the quotation around ‘नियंत्रण’ is unbalanced.
