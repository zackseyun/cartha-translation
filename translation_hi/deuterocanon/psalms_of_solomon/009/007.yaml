- from: हमारे कर्म हमारी आत्मा के चुनाव और सामर्थ्य[a] में हैं—अपने हाथों के कामों से[c] धार्मिकता[b] और अधार्मिकता करना।
  to: हमारे कर्म हमारी आत्मा के चयन और सामर्थ्य[a] के अधीन हैं—अपने हाथों के कामों से[c] धार्मिकता[b] और अधार्मिकता करने के लिए।
  rationale: The revision makes the central agency clause idiomatic in modern Hindi, replaces an election-associated term with a contextually natural one, and repairs footnote punctuation. It retains the source’s ‘soul,’ the choice/capacity pairing, the righteousness/unrighteousness contrast, and the concrete reference to the works of the hands. ‘करने के लिए’ preserves the infinitival linkage without deciding more precisely whether it is purposive or expresses capacity.
