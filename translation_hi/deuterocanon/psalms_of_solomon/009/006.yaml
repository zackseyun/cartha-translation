  verdict: revise
  source_fidelity: The draft correctly represents the plural δικαιοσύναι as concrete righteous conduct, ὁσίων as God's pious/devout people, and γνώσεώς as “knowledge” without adding “omniscience.” However, it mistranslates ποῦ (“where”) as “कौन” (“who”), changing the question's meaning.
  naturalness: The devotional register and direct singular address are natural. “धर्ममय काम” is understandable but somewhat stiff; “धार्मिक कार्य” is more idiomatic in modern standard Hindi while retaining the plural/concrete sense.
  terminology: “भक्तों,” “प्रभु,” and “परमेश्वर” are suitable, and retaining both vocatives reflects the Greek. “धार्मिक कार्य” conveys δικαιοσύναι here as righteous deeds without making a doctrinal claim.
  issues:
  - severity: high
    issue: ποῦ is rendered as “कौन.”
    rationale: Greek asks “where will a human being hide himself,” not “who will hide himself.” The Hindi must preserve the adverbial question with “कहाँ.”
  - severity: low
    issue: “धर्ममय काम” is less natural modern Hindi.
    rationale: “धार्मिक कार्य” more smoothly conveys the righteous/deed-like force of the plural δικαιοσύναι in this context.
  revised_text: और तेरे भक्तों के धार्मिक कार्य तेरे सामने हैं, हे प्रभु; और मनुष्य तेरे ज्ञान से अपने आपको कहाँ छिपा सकेगा, हे परमेश्वर?
