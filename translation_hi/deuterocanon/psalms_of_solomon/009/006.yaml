translation:
  language: hi
  text: और तेरे भक्तों के धार्मिक कार्य तेरे सामने हैं, हे प्रभु; और मनुष्य तेरे ज्ञान से अपने आपको कहाँ छिपा सकेगा, हे परमेश्वर?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύναι
  choice: धर्ममय काम
  rationale: बहुवचन यहाँ भक्तों के ठोस धार्मिक/न्यायपूर्ण कर्मों की ओर संकेत करता है; हिन्दी में अमूर्त और अस्वाभाविक ‘धार्मिकताएँ’ की अपेक्षा यह अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: ὁσίων
  choice: भक्तों
  rationale: ὅσιος का आशय परमेश्वर के प्रति निष्ठावान और धर्मपरायण जनों से है; ‘भक्त’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: γνώσεώς
  choice: ज्ञान
  rationale: मूल का सामान्य अर्थ ‘ज्ञान’ है; इसे ‘दृष्टि’ या ‘सर्वज्ञता’ बनाकर निहितार्थ को अधिक स्पष्ट नहीं किया गया।
- source_word: κρυβήσεται
  choice: अपने आपको छिपा सकेगा
  rationale: 'ग्रीक भविष्यत् मध्यम रूप को हिन्दी के स्वाभाविक प्रश्न में सामर्थ्यसूचक अभिव्यक्ति से प्रस्तुत किया गया है: परमेश्वर के ज्ञान से छिपना असंभव है।'
theological_decisions:
- issue: δικαιοσύναι का कर्मात्मक या अमूर्त अर्थ
  choice: धर्ममय काम
  alternative: धार्मिकताएँ / धार्मिकता के कार्य
  rationale: बहुवचन के वास्तविक बल को कर्मात्मक अभिव्यक्ति में सुरक्षित रखा गया है, बिना यह सिद्धान्त जोड़ने के कि ये काम उद्धार का आधार हैं।
- issue: परमेश्वर के ज्ञान का स्वरूप
  choice: तेरे ज्ञान से
  alternative: तेरी सर्वज्ञ दृष्टि से
  rationale: मूल केवल γνώσεως कहता है; ‘सर्वज्ञ’ अर्थतः संगत होते हुए भी पाठ में जोड़ा हुआ स्पष्टीकरण होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण काव्यात्मक संबोधन और एकवचन ‘तू’ के रूपों के साथ। वाक्य की समानांतर संरचना तथा ‘हे प्रभु’ और ‘हे परमेश्वर’ दोनों संबोधन सुरक्षित रखे गए हैं।
