  - marker: b
    text: 'पूर्व अनुवाद: “क्या परमेश्वर दयालु होगा?”'
    reason: previous_rendering
lexical_decisions:
- source_word: τίνι
  choice: किस पर
  rationale: सम्प्रदानवाचक प्रश्नवाचक सर्वनाम यहाँ परमेश्वर की कृपा पाने वाले व्यक्ति या समूह के विषय में आलंकारिक प्रश्न प्रस्तुत करता है; हिन्दी में ‘किस पर’ स्वाभाविक है।
- source_word: χρηστεύσῃ
  choice: आप कृपा करेंगे
  rationale: यह द्वितीय पुरुष एकवचन भविष्यत् रूप है और हितकारी अथवा दयालु व्यवहार व्यक्त करता है। ‘कृपा करेंगे’ वर्तमान हिन्दी में सहज है और किसी विशिष्ट सम्प्रदायगत अर्थ को नहीं जोड़ता।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: संज्ञा कर्तृकारक रूप में होते हुए भी यहाँ सम्बोधन के रूप में प्रयुक्त है, जैसा कि द्वितीय पुरुष क्रिया से स्पष्ट है।
- source_word: ἐπικαλουμένοις
  choice: जो ... पुकारते हैं
  rationale: कृदन्त उन लोगों को बताता है जो प्रार्थनापूर्वक प्रभु को पुकारते या उनका नाम लेते हैं; ‘पुकारते हैं’ सरल और भक्तिपरक अर्थ को सुरक्षित रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: धार्मिक सन्दर्भ में κύριος का प्रचलित और उपयुक्त हिन्दी अनुवाद ‘प्रभु’ है।
theological_decisions:
- issue: परमेश्वर को प्रत्यक्ष सम्बोधन या वाक्य का कर्ता मानना
  choice: ‘हे परमेश्वर’ द्वारा प्रत्यक्ष सम्बोधन
  alternative: ‘परमेश्वर किस पर कृपा करेगा’
  rationale: χρηστεύσῃ द्वितीय पुरुष एकवचन है और ὁ θεός हेलेनिस्टिक यूनानी में सम्बोधन का कार्य करता है; इसलिए तीसरे पुरुष का अनुवाद व्याकरण के विपरीत होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सरल शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त हुआ है। यूनानी की आलंकारिक प्रश्न-संरचना और ‘परमेश्वर’ तथा ‘प्रभु’ के बीच मूल शब्दगत भेद सुरक्षित रखा गया है।
