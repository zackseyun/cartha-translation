  text: To whom will you show kindness[a], O God[b], if not to those who call on the Lord?
translation:
  language: hi
  text: हे परमेश्वर[b], यदि उन लोगों के प्रति नहीं जो प्रभु को पुकारते हैं, तो आप किसके प्रति भलाई दिखाएँगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भलाई करेंगे” अथवा “दयालुता दिखाएँगे।”
