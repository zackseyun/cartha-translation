translation:
  language: hi
  text: और हे प्रभु, तूने हम पर अपना नाम रखा है; तू उसे कभी नहीं हटाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी का अधिक शाब्दिक अनुवाद हो सकता है: “और तू युग भर समाप्त नहीं करेगा।” क्रिया का कर्म स्पष्ट नहीं कहा गया है; सम्भवतः आशय यह है कि प्रभु अपना नाम हम पर से कभी नहीं हटाएगा।'
    reason: यूनानी के असामान्य अंतिम उपवाक्य में अव्यक्त कर्म और उसके कारण बनी अस्पष्टता को सुरक्षित रखते हुए सक्रिय क्रिया को अकर्मक रूप में प्रस्तुत करने से बचना।
lexical_decisions:
- source_word: ἔθου
  choice: तूने … रखा है
  rationale: यूनानी क्रिया अतीत में किए गए कार्य को बताती है; हिन्दी में पूर्ण वर्तमान उस कार्य के बने हुए परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ ὄνομά σου ἐφʼ ἡμᾶς
  choice: अपना नाम हम पर
  rationale: ‘नाम को किसी पर रखना’ चुने जाने, स्वामित्व और पहचान से जुड़ी बाइबलीय अभिव्यक्ति है; इसलिए उसके रूपक को बनाए रखा गया है।
- source_word: οὐ καταπαύσεις τὸν αἰῶνα
  choice: तू उसे कभी नहीं हटाएगा
  rationale: संदर्भ में ‘उसे’ प्रभु के नाम की ओर संकेत करता है। ‘कभी नहीं’ निषेध और दीर्घकालिकता को सहज आधुनिक हिन्दी में व्यक्त करता है, जबकि यूनानी की असामान्य रचना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: दूसरे उपवाक्य में निहित कर्म
  choice: ‘उसे’ जोड़कर इसे प्रभु के नाम के न हटाए जाने के रूप में प्रस्तुत किया गया है।
  alternative: ‘और तू सदा तक नहीं रुकेगा’ या ‘और यह सदा तक समाप्त नहीं होगा।’
  rationale: यूनानी में स्पष्ट कर्म नहीं है और वाक्यरचना असामान्य है। निकटतम संदर्भ ‘तेरा नाम’ है, इसलिए मुख्य पाठ में उसी संबंध को ग्रहण किया गया, पर अस्पष्टता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। परमेश्वर को संबोधित करते समय एकवचन ‘तू’ रखा गया है, जो भजन-साहित्य की निकट और श्रद्धापूर्ण शैली के अनुरूप है।
