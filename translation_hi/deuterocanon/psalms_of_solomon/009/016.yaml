base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/016.yaml
  text: And now you are God, and we are your people whom you loved. Look and have compassion, O God of Israel, because we are yours; and do not withdraw your mercy from us, lest they attack us.
translation:
  language: hi
  text: और अब आप ही परमेश्वर हैं, और हम आपकी प्रजा हैं, जिससे आपने प्रेम किया है। हे इस्राएल के परमेश्वर, हमारी ओर दृष्टि करें और हम पर दया करें, क्योंकि हम आपके हैं। अपनी करुणा हमसे दूर न करें, कहीं ऐसा न हो कि वे हम पर आक्रमण करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαός
  choice: प्रजा
  rationale: यह सामूहिक रूप से परमेश्वर से संबंधित लोगों को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: οἰκτείρησον
  choice: हम पर दया करें
  rationale: क्रिया में करुणापूर्वक दया करने का भाव है; हिन्दी में कर्म को स्पष्ट करने के लिए ‘हम पर’ जोड़ा गया है।
- source_word: ἔλεός
  choice: करुणा
  rationale: यह दयालु अनुकम्पा के अर्थ को व्यक्त करता है और ‘दया करें’ की निकट पुनरावृत्ति से बचाता है।
- source_word: ἐπιθῶνται
  choice: हम पर आक्रमण करें
  rationale: मध्यवाची क्रिया का अर्थ यहाँ शत्रुतापूर्वक टूट पड़ना या हमला करना है; ‘आक्रमण करें’ प्रसंग के अनुरूप स्पष्ट है।
theological_decisions:
- issue: σύ ὁ θεός में सर्वनाम का बल
  choice: आप ही परमेश्वर हैं
  alternative: आप परमेश्वर हैं
  rationale: ‘ही’ यूनानी में व्यक्त सर्वनाम σύ के संभावित बल को स्वाभाविक हिन्दी में बनाए रखता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक दावा जोड़े।
- issue: अंतिम क्रिया के अनिर्दिष्ट बहुवचन कर्ता
  choice: वे हम पर आक्रमण करें
  alternative: शत्रु हम पर आक्रमण करें
  rationale: यूनानी पाठ कर्ताओं की पहचान नहीं करता; ‘वे’ इस अस्पष्टता को सुरक्षित रखता है।
- issue: करुणा के दूर होने की याचना
  choice: अपनी करुणा हमसे दूर न करें
  alternative: अपनी करुणा हमसे न हटाएँ
  rationale: यह ἀποστῇ...ἀφʼ ἡμῶν की स्थानगत अभिव्यक्ति को निकटता से रखता है और मूल पाठ के धर्मवैज्ञानिक तनाव को नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। शैली प्रार्थनापूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है; अनिर्दिष्ट ‘वे’ को जानबूझकर स्पष्ट नहीं किया गया।
