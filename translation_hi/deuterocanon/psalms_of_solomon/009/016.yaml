  source_fidelity: 'Hindi accurately represents all clauses of the Greek: the emphatic second-person address, God/people relationship, past love, appeal for compassionate attention, belonging to God, request that mercy not be withdrawn, and the deliberately unspecified plural threat. “वे” appropriately preserves the source’s unexpressed subject.'
