  text: καὶ νῦν σύ ὁ θεός, καὶ ἡμεῖς λαὸς σοῦ ὃν ἠγάπησας· ἴδε καὶ οἰκτείρησον, ὁ θεὸς Ἰσραήλ, ὅτι σοί ἐσμεν· καὶ μὴ ἀποστῇς ἔλεός σου ἀφʼ ἡμῶν, ἵνα μὴ ἐπιθῶνται ἡμῖν.
