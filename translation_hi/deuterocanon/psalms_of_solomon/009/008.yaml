    reason: lexical_ambiguity
lexical_decisions:
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यहाँ शब्द परमेश्वर के उस धर्मी चरित्र अथवा रीति को बताता है जिसके अनुसार वह कार्य करता है। ‘धार्मिकता’ मूल की धार्मिक और नैतिक व्यापकता को सुरक्षित रखती है; केवल ‘न्याय’ कहना संदर्भ को अनावश्यक रूप से न्यायिक अर्थ तक सीमित कर सकता है।
- source_word: ἐπεσκέπτῃ
  choice: सुधि ली
  rationale: यह क्रिया भेंट करने, देखने-परखने, ध्यान देने या देखभाल करने के अर्थ रख सकती है। ‘सुधि ली’ स्वाभाविक हिन्दी में परमेश्वर के सक्रिय ध्यान को व्यक्त करती है और क्रिया के भूतकालिक रूप को भी बनाए रखती है; संभावित निरीक्षणात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: υἱοὺς ἀνθρώπων
  choice: मनुष्यों के पुत्रों
  rationale: मूल के सामी-प्रभावित, पुरुषवाची रूढ़ पदबंध को औपचारिक रूप से सुरक्षित रखा गया है। इसका व्यापक आशय समस्त मानवजाति है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: ἐπισκέπτομαι में कृपालु देखभाल और न्यायिक निरीक्षण के बीच अर्थगत तनाव
  choice: मुख्य पाठ में ‘सुधि ली’
  alternative: ‘निरीक्षण किया’ या ‘जाँच की’
  rationale: निकटवर्ती प्रसंग न्याय और उत्तरदायित्व पर बल देता है, फिर भी अकेली क्रिया केवल न्यायिक जाँच तक सीमित नहीं है। मुख्य पाठ व्यापक दिव्य ध्यान को रखता है और पादटिप्पणी न्यायिक संभावना को सुरक्षित करती है।
- issue: υἱοὺς ἀνθρώπων का पुरुषवाची मानव-संबंधी मुहावरा
  choice: ‘मनुष्यों के पुत्रों’ के रूप में मूल बिंब सुरक्षित रखना
  alternative: ‘मनुष्यों’ या ‘मानवजाति’
  rationale: मूल अभिव्यक्ति के पारंपरिक बिंब को बनाए रखा गया है, जबकि पादटिप्पणी बताती है कि इसका संकेत सामान्यतः सभी मनुष्यों की ओर है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर को संबोधित करने के लिए ‘तू’ भजन-साहित्य की निकट और पारंपरिक शैली के अनुरूप है। वाक्य में मूल यूनानी के भूतकाल को ‘तूने ... ली’ से व्यक्त किया गया है।
