  yaml_path: translation/deuterocanon/psalms_of_solomon/009/017.yaml
  text: For you chose the offspring of Abraham above all the nations[b][a],
translation:
  language: hi
  text: क्योंकि तूने अब्राहम के वंश[a] को सभी राष्ट्रों से बढ़कर[b] चुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अब्राहम के बीज’ अथवा ‘अब्राहम की संतति’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सभी राष्ट्रों से अधिक’ अथवा ‘सभी राष्ट्रों के ऊपर’।
    reason: alternative_reading
lexical_decisions:
- source_word: ἡρέτισω
  choice: चुना
  rationale: यह क्रिया चुनने या चयन करने का सीधा भाव व्यक्त करती है; ‘चुना’ आधुनिक हिन्दी में स्वाभाविक है और कोई अतिरिक्त व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: σπέρμα
  choice: वंश
  rationale: मूल शब्द शाब्दिक रूप से ‘बीज’ है, पर यहाँ अब्राहम से उत्पन्न सामूहिक वंश का बोध कराता है। ‘वंश’ हिन्दी में स्वाभाविक रहते हुए उस सामूहिक एकवचन भाव को पर्याप्त रूप से सुरक्षित रखता है।
- source_word: παρὰ
  choice: से बढ़कर
  rationale: कर्मकारक के साथ यह प्रयोग तुलना और वरीयता का भाव देता है। ‘से बढ़कर’ उस तुलनात्मक बल को स्पष्ट रखता है, जबकि ‘में से’ चुनाव के स्रोत का अलग अर्थ सुझा सकता है।
- source_word: ἔθνη
  choice: राष्ट्रों
  rationale: ‘राष्ट्रों’ यूनानी बहुवचन का सीधा और अपेक्षाकृत निष्पक्ष अनुवाद है। ‘अन्यजातियों’ कहने से वह धार्मिक विरोध अधिक स्पष्ट हो जाता जिसे इस शब्द से अकेले अनिवार्यतः सिद्ध नहीं किया जा सकता।
- source_word: σὺ
  choice: तूने
  rationale: सर्वनाम कर्ता पर बल देता है। ईश्वर को सीधे संबोधित करने के लिए ‘तू’ हिन्दी की पारंपरिक, निकट और गंभीर प्रार्थना-भाषा है; कर्ता का स्पष्ट उल्लेख यूनानी बल को बनाए रखता है।
theological_decisions:
- issue: अब्राहम के वंश और राष्ट्रों के संबंध में चुनाव की भाषा
  choice: ईश्वर द्वारा अब्राहम के वंश को सभी राष्ट्रों से बढ़कर चुने जाने का कथन सीधे रखा गया है।
  alternative: ईश्वर ने अब्राहम के वंश को सभी राष्ट्रों में से अलग किया।
  rationale: मूल पाठ में चुनाव के साथ तुलनात्मक वरीयता का बल है। अनुवाद इसे केवल अलग किए जाने तक सीमित नहीं करता, न ही इसे बाद की किसी व्यवस्थित धर्मशास्त्रीय धारणा में विस्तृत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। ईश्वर के लिए ‘तू’ निकटता और पारंपरिक भक्ति-भाषा बनाए रखता है; ‘राष्ट्र’ को ‘अन्यजाति’ पर वरीयता दी गई है ताकि अनावश्यक धार्मिक विशिष्टता न जोड़ी जाए।
