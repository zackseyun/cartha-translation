lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आसपास के कथन का कारण या आधार प्रस्तुत करता है; हिन्दी में “क्योंकि” इसके कारणार्थक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κριτὴς
  choice: न्याय करनेवाला
  rationale: यूनानी संज्ञा न्याय करनेवाले व्यक्ति को दर्शाती है। हिन्दी वाक्य में “न्याय करनेवाला” स्वाभाविक है और परमेश्वर की न्यायिक भूमिका स्पष्ट करता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: यह शब्द नैतिक सत्यनिष्ठा और न्यायशीलता दोनों को समेटता है; “धर्मी” परमेश्वर के चरित्र से जुड़े इसके व्यापक धार्मिक और नैतिक भार को बनाए रखता है।
- source_word: ἐπὶ
  choice: के ऊपर
  rationale: यहाँ यह अधिकार और न्यायिक क्षेत्र को सूचित करता है; “के ऊपर” उस अधिकार को स्पष्ट रूप से व्यक्त करता है।
- source_word: πάντας τοὺς λαοὺς
  choice: सब लोगों
  rationale: λαοί बहुवचन में विभिन्न जनसमूहों को दर्शाता है। “सब लोगों” आधुनिक हिन्दी में सहज है और राजनीतिक राष्ट्रों तक अर्थ को सीमित नहीं करता।
- source_word: τῆς γῆς
  choice: पृथ्वी के
  rationale: सभी जनसमूहों के सार्वभौमिक संदर्भ में γῆ का अर्थ स्थानीय “भूमि” के बजाय पूरी “पृथ्वी” है।
theological_decisions:
- issue: δίκαιος में धार्मिकता और न्यायशीलता का संबंध
  choice: धर्मी
  alternative: न्यायी
  rationale: “धर्मी” मूल के नैतिक और धार्मिक आयाम को बनाए रखता है, जबकि न्याय का विशेष आयाम “न्याय करनेवाला” से पहले ही स्पष्ट हो जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रार्थनात्मक शैली रखी गई है। “तू” मूल के एकवचन सीधे संबोधन को बनाए रखता है; पदक्रम को हिन्दी में स्वाभाविक बनाने के लिए विधेय “धर्मी” अंत में रखा गया है।
