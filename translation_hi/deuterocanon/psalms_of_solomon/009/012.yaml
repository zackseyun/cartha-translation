  language: hi
  text: वह पापों में पड़ी आत्मा को स्वीकारोक्ति के द्वारा, खुले अंगीकारों के द्वारा शुद्ध करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρίσει
  choice: शुद्ध करेगा
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐν ἁμαρτίαις
  choice: पापों में पड़ी
  rationale: यूनानी ἐν के ‘में’ अर्थ को बनाए रखते हुए हिन्दी में आत्मा की पापग्रस्त दशा स्पष्ट की गई है; इसे ‘पापों से’ नहीं बनाया गया, ताकि स्रोत की वास्तविक अभिव्यक्ति न बदले।
- source_word: ψυχὴν
  choice: आत्मा को
  rationale: ψυχή का प्रसंगानुकूल धार्मिक और मानवीय अर्थ; कर्मकारक को ‘को’ से व्यक्त किया गया।
- source_word: ἐν ἐξομολογήσει
  choice: अंगीकार के द्वारा
  rationale: ἐξομολόγησις यहाँ पाप को मानने या स्वीकार करने का भाव देता है; साधनसूचक ἐν को स्वाभाविक हिन्दी में ‘के द्वारा’ किया गया।
- source_word: ἐν ἐξαγορίαις
  choice: खुले स्वीकार के द्वारा
  rationale: दुर्लभ ἐξαγορίαις में खुलकर कहने अथवा सार्वजनिक रूप से स्वीकार करने का भाव है; पहले पद के समानांतर रूप रखा गया।
theological_decisions:
- issue: ἐν ἁμαρτίαις का संबंध
  choice: पापों में पड़ी आत्मा
  alternative: पापों से आत्मा
  rationale: मूल पाठ स्पष्ट रूप से ἐν (‘में’) पढ़ता है। ‘से’ करने पर शुद्धि के स्रोत/वियोग का अर्थ जुड़ जाता, जो पाठ में सीधे व्यक्त नहीं है।
- issue: शुद्धि और अंगीकार का संबंध
  choice: अंगीकार और खुले स्वीकार के द्वारा
  alternative: अंगीकार और खुले स्वीकार में
  rationale: यहाँ ἐν को साधनसूचक समझना वाक्य के अर्थ और अंग्रेज़ी परामर्श-पाठ दोनों से मेल खाता है; फिर भी शुद्ध करने वाले कर्ता को अंगीकार स्वयं नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य। दो निकटार्थी यूनानी पदों का भेद ‘अंगीकार’ और ‘खुला स्वीकार’ से बनाए रखा गया है।
