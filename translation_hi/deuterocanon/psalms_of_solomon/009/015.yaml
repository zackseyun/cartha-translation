    text: ‘पश्चाताप’ के लिए प्रयुक्त यूनानी शब्द में पछतावे या खेद का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίους
  choice: धर्मियों
  rationale: विशेषण यहाँ संज्ञा के रूप में उन लोगों के लिए प्रयुक्त है जिनकी पहचान धार्मिकता से होती है। ‘धर्मियों’ स्वाभाविक और स्थापित हिन्दी है।
- source_word: εὐλογήσεις
  choice: आशीष देगा
  rationale: यूनानी रूप भविष्यकाल का है; इसलिए भविष्यकाल को स्पष्ट रूप से बनाए रखा गया है।
- source_word: οὐκ εὐθύνεις
  choice: तू उनसे लेखा नहीं लेता
  rationale: εὐθύνεις वर्तमानकाल है, भविष्यकाल नहीं। ‘लेखा लेना’ उत्तरदायी ठहराने या हिसाब माँगने का न्यायिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: περὶ ὧν ἥμαρτοσαν
  choice: जिन बातों में उन्होंने पाप किया, उनके लिए
  rationale: यह मूल वाक्य की संबंधवाचक संरचना तथा उन विषयों/बातों का संकेत सुरक्षित रखता है जिनमें उन्होंने पाप किया।
- source_word: χρηστότης
  choice: भलाई
  rationale: यह शब्द सद्भावपूर्ण अच्छाई और कृपालु व्यवहार दोनों को समेटता है; ‘भलाई’ यहाँ व्यापक अर्थ को बनाए रखता है।
- source_word: ἁμαρτάνοντας
  choice: पाप करनेवालों
  rationale: कृदंत को क्रियात्मक रूप में रखा गया है, ताकि इसे स्थायी पहचान बतानेवाले केवल ‘पापी’ शब्द तक सीमित न किया जाए।
- source_word: ἐν μεταμελείᾳ
  choice: जो पश्चाताप करते हैं
  rationale: मुहावरेदार हिन्दी में यह स्पष्ट करता है कि परमेश्वर की भलाई पश्चाताप की दशा में पाप करनेवालों की ओर है, न कि वे पश्चाताप करते हुए पाप करते हैं।
theological_decisions:
- issue: पाप करनेवालों और पश्चाताप के बीच संबंध
  choice: उन पाप करनेवालों पर होती है जो पश्चाताप करते हैं
  alternative: पश्चाताप में पाप करनेवालों पर
  rationale: शाब्दिक विकल्प हिन्दी में यह भ्रामक अर्थ दे सकता है कि पाप का कार्य पश्चाताप करते समय किया जाता है। चुना हुआ रूप पश्चाताप को उन व्यक्तियों की अवस्था/प्रतिक्रिया से जोड़ता है, पर क्षमा या उद्धार के बारे में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
