  text: You will bless the righteous[a], and you do not call them to account for the things in which they sinned[c][b]; and your goodness is toward those who sin in repentance.
translation:
  language: hi
  text: तू धर्मियों को आशीष देगा, और जिन बातों में उन्होंने पाप किया, उनके लिए तू उनसे लेखा नहीं लेता; और तेरी भलाई उन पाप करनेवालों की ओर है जो पश्चाताप करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
