lexical_decisions:
- source_word: κυρίου
  choice: प्रभु की
  rationale: सम्बन्धकारक रूप को स्वाभाविक हिन्दी अधिकार-सूचक रचना में व्यक्त किया गया है; κύριος के लिए ‘प्रभु’ मानक और गरिमापूर्ण पद है।
- source_word: ἐλεημοσύνη
  choice: दया
  rationale: यहाँ शब्द प्रभु की करुणामय प्रवृत्ति और इस्राएल के प्रति उसके कार्य, दोनों को समेटता है। ‘दया’ संक्षिप्त, सहज और धार्मिक भार को बनाए रखता है।
- source_word: ἡ ἐπʼ οἶκον Ἰσραήλ
  choice: इस्राएल के घराने पर
  rationale: ἐπί की ‘पर’ वाली छवि और οἶκος का सामूहिक, वाचा-संबंधी भाव सुरक्षित रखा गया है। आधुनिक हिन्दी में ‘घराने’ से लोगों का समुदाय स्पष्ट होता है।
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: सदा-सर्वदा
  rationale: यह सहज हिन्दी अभिव्यक्ति अनंत अवधि और यूनानी καὶ ἔτι द्वारा दिए गए बल को संक्षेप में व्यक्त करती है; अधिक शब्दशः अर्थ पादटिप्पणी में सुरक्षित है।
