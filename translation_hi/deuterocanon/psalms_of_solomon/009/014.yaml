translation:
  language: hi
  text: और वह पापों की क्षमा किसे देगा, यदि उन्हें नहीं जिन्होंने पाप किया है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφήσει
  choice: क्षमा करेगा
  rationale: भविष्यत् काल का यह क्रिया-रूप पापों के संदर्भ में स्वाभाविक रूप से ‘क्षमा करेगा’ अर्थ देता है; यह आधुनिक हिन्दी में स्पष्ट और संबंधपरक है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: बहुवचन यूनानी संज्ञा यहाँ पापों को सीधे सूचित करती है। हिन्दी में ‘पाप क्षमा करना’ स्वाभाविक मुहावरा है, जिसमें ‘पाप’ का रूप संख्या की दृष्टि से अपरिवर्तित रहता है।
- source_word: τοῖς ἡμαρτηκόσι
  choice: उनके ... जिन्होंने पाप किया है
  rationale: पूर्णकालिक सक्रिय कृदन्त के क्रियात्मक बल को बनाए रखते हुए यह अनुवाद लोगों पर स्थायी ‘पापी’ का ठप्पा लगाने के बजाय उनके पाप करने के तथ्य को व्यक्त करता है।
- source_word: τίνι
  choice: किसके
  rationale: क्षमा करने की हिन्दी संरचना ‘किसके पाप क्षमा करेगा’ में यूनानी संप्रदान कारक का अर्थ स्वाभाविक ढंग से व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय क्षमा का दायरा
  choice: अलंकारिक प्रश्न यह स्पष्ट करता है कि क्षमा उन्हीं के लिए सार्थक है जिन्होंने वास्तव में पाप किया है।
  alternative: इसे केवल उन लोगों तक सीमित समझना जो अपने पाप के प्रति पहले से सचेत हैं।
  rationale: पंक्ति को उसके अलंकारिक प्रश्न के रूप में ही रखा गया है; इसमें क्षमा के तर्क को स्पष्ट किया गया है, पर इससे आगे कोई विस्तृत धर्मसैद्धान्तिक व्यवस्था आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में स्वाभाविक। प्रश्न की अलंकारिक तीक्ष्णता बनाए रखी गई है।
