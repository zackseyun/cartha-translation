- from: और वह किसके पाप क्षमा करेगा, यदि उनके नहीं जिन्होंने पाप किया है?
  to: और वह पापों की क्षमा किसे देगा, यदि उन्हें नहीं जिन्होंने पाप किया है?
  rationale: The revision directly renders the Greek dative recipients with “किसे/उन्हें,” explicitly reflects the plural “पापों,” and preserves the future-tense rhetorical question and the verbal force of “जिन्होंने पाप किया है.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:50:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the future rhetorical question and identifies forgiveness as directed to people who have sinned. However, its paired construction “किसके पाप … यदि उनके नहीं” is less direct than the Greek dative and is syntactically awkward in modern Hindi.
  naturalness: “यदि उनके नहीं जिन्होंने पाप किया है” is not fully natural or clear as a Hindi continuation. Expressing the dative recipients as “किसे/उन्हें” and making the plural “पापों” explicit gives a clear, idiomatic rhetorical question.
  terminology: “पापों की क्षमा” is a standard, dignified Hindi rendering of ἁμαρτίας ἀφήσει. “जिन्होंने पाप किया है” appropriately retains the participle’s completed-action force without substituting the label “पापी.”
  issues:
  - severity: medium
    issue: The dative recipients are rendered through the possessive phrasing “किसके पाप ... उनके नहीं,” and the second clause is awkward.
    rationale: Greek asks to whom sins will be forgiven (τίνι ... τοῖς ἡμαρτηκόσι). Hindi “किसे ... उन्हें” represents these recipients directly and avoids ambiguity over whose sins are meant.
  revised_text: और वह पापों की क्षमा किसे देगा, यदि उन्हें नहीं जिन्होंने पाप किया है?
