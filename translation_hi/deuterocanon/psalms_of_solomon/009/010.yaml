lexical_decisions:
- source_word: κρίματα
  choice: न्याय
  rationale: यह शब्द न्यायिक निर्णयों अथवा न्याय करने के कार्यों को दर्शाता है; ‘न्याय’ उसके वैधानिक और नैतिक दोनों बल को बनाए रखता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: κύριος का स्वाभाविक और मानक हिन्दी रूप ‘प्रभु’ है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता में
  rationale: संज्ञात्मक वाक्यांश को बनाए रखने से निकटवर्ती पदों में δικαιοσύνη की विषयगत पुनरावृत्ति सुरक्षित रहती है; यहाँ इसका आशय न्यायोचितता से भी है।
- source_word: κατʼ ἄνδρα
  choice: हर व्यक्ति के लिए
  rationale: κατά और एकवचन ἄνδρα का यहाँ सम्भावित वितरणात्मक अर्थ है—एक-एक व्यक्ति पर लागू होना। लिंग-समावेशी ‘व्यक्ति’ आधुनिक हिन्दी में इस सामान्य मानवीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἶκον
  choice: घराने
  rationale: οἶκος केवल भवन नहीं, परिवार अथवा गृहस्थ समुदाय को भी दर्शाता है; ‘घराना’ इस सामाजिक अर्थ को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ἐν δικαιοσύνῃ का सम्बन्ध
  choice: ‘धार्मिकता में होते हैं’—प्रभु के न्यायों के चरित्र अथवा रीति को व्यक्त करने वाला वाक्यांश
  alternative: ‘धर्मी हैं’ अथवा ‘न्यायपूर्ण हैं’
  rationale: मूल यूनानी में विशेषण नहीं, ἐν के साथ δικαιοσύνη संज्ञा है। मुख्य पाठ में इस रूप को बनाए रखना वास्तविक व्याकरण और साहित्यिक शब्द-श्रृंखला दोनों को सुरक्षित रखता है।
- issue: κατʼ ἄνδρα καὶ οἶκον का अर्थ
  choice: वितरणात्मक—हर व्यक्ति और घराने के लिए
  alternative: शाब्दिक ‘मनुष्य और घर के अनुसार’
  rationale: यूनानी पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ सम्भावित वितरणात्मक अर्थ देता है, जबकि पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘धार्मिकता में’ कुछ औपचारिक है, पर मूल के संज्ञात्मक पदबंध और प्रसंग की शब्दगत कड़ी को जानबूझकर सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
