lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पद पूर्ववर्ती कथन का कारण या आधार बताता है; इसलिए कारणसूचक संयोजक स्वाभाविक है।
- source_word: αἰσχύνη
  choice: लज्जा
  rationale: यह यूनानी शब्द के नैतिक और सामाजिक अपमान-बोध को बिना अनावश्यक तीव्रता के व्यक्त करता है।
- source_word: ἡμῖν καὶ τοῖς προσώποις ἡμῶν
  choice: हम पर और हमारे मुखों पर
  rationale: दोनों समानांतर संप्रदान कारकों को एक ही संज्ञा ‘लज्जा’ से जोड़कर मूल वाक्य की एकता और मुख की ठोस छवि बनाए रखी गई है।
- source_word: περὶ ἁπάντων
  choice: इन सबके कारण
  rationale: संदर्भ में यह लज्जा के कारण या अवसर को दर्शाता है। ‘इन’ हिंदी में पूर्वोक्त बातों की ओर स्वाभाविक संकेत करता है, यद्यपि यूनानी में अलग संकेतवाचक शब्द नहीं है।
