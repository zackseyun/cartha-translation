translation:
  language: hi
  text: तूने हमारे विषय में हमारे पूर्वजों के साथ वाचा बाँधी, और जब हमारा मन फिरेगा[a], तब हम तुझ पर आशा रखेंगे।
  philosophy: optimal-equivalence
