    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν διαθήκῃ διέθου
  choice: तूने ... वाचा बाँधी
  rationale: यह यूनानी में वाचागत मुहावरा है। स्वाभाविक हिन्दी ‘वाचा बाँधना’ मुख्य क्रिया और उसके वाचागत अर्थ दोनों को व्यक्त करती है; शब्दशः ‘वाचा में तूने ठहराया’ अस्वाभाविक और अस्पष्ट होता।
- source_word: τοῖς πατράσιν ἡμῶν
  choice: हमारे पूर्वजों के साथ
  rationale: यहाँ ‘पिता’ वाचा पाने वाले पुरखों को सूचित करता है। आधुनिक हिन्दी में ‘पूर्वज’ उसी ऐतिहासिक सामूहिक अर्थ को अधिक स्पष्टता से देता है।
- source_word: περὶ ἡμῶν
  choice: हमारे विषय में
  rationale: περί + संबंधकारक का सीधा अर्थ ‘के विषय में/के बारे में’ है; ‘हमारे लिए’ कहने से लाभार्थक अर्थ आवश्यकता से अधिक स्पष्ट हो जाता।
- source_word: ἐλπιοῦμεν ἐπὶ σὲ
  choice: हम तुझ पर आशा रखेंगे
  rationale: भविष्यकाल को बनाए रखते हुए यह हिन्दी में आशा का आधार परमेश्वर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ἐπιστροφῇ ψυχῆς ἡμῶν
  choice: जब हमारा मन तेरी ओर फिरेगा
  rationale: ἐπιστροφή के लौटने/फिरने के बिंब और सामूहिक एकवचन को रखा गया है। हिन्दी में ψυχή के लिए यहाँ ‘मन’ नैतिक और भीतरी अभिमुखता को ‘आत्मा’ की अपेक्षा अधिक स्वाभाविक रूप से व्यक्त करता है। ‘तेरी ओर’ प्रसंगगत दिशा को स्पष्ट करता है, जबकि पश्चात्ताप का अर्थ मुख्य पाठ में पूर्णतः निर्धारित नहीं करता।
theological_decisions:
- issue: क्या ἐπιστροφῇ ψυχῆς ἡμῶν को स्पष्ट रूप से ‘पश्चात्ताप’ कहा जाए
  choice: जब हमारा मन तेरी ओर फिरेगा
  alternative: जब हम पश्चात्ताप करेंगे
  rationale: मूल पद में नैतिक-धार्मिक लौटने का भाव है, पर संज्ञा स्वयं ‘फिरना/लौटना’ कहती है। मुख्य पाठ उस बिंब और अर्थगत तनाव को बचाता है; पादटिप्पणी स्पष्ट पश्चात्ताप-वाले विकल्प को दर्ज करती है।
- issue: वाचा पूर्वजों ‘के साथ’ थी या उन्हें ‘दी/ठहराई’ गई थी
  choice: हमारे पूर्वजों के साथ वाचा बाँधी
  alternative: हमारे पूर्वजों के लिए वाचा ठहराई
  rationale: वाचागत मुहावरे और संबंधपरक अर्थ को स्वाभाविक हिन्दी में रखा गया है, बिना यह तय किए कि वाचा केवल एकतरफा विधान थी।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरा/तुझ’ रखा गया है। ‘वाचा बाँधना’ बाइबलीय मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
