  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और ज्ञान-साहित्य के अनुकूल स्वर रखा गया है। ‘धार्मिकता/अधर्म’ का समानांतर नैतिक विरोध और ‘जीवन संचित करना’ रूपक सुरक्षित हैं। अंतिम खंड की यूनानी अस्पष्टता को मुख्य पाठ में जानबूझकर पूर्णतः नहीं सुलझाया गया; अधिक स्वाभाविक व्याख्यात्मक विकल्प पाद-टिप्पणी में दिए गए हैं।
