  text: The one who does righteousness stores up life for himself with the Lord[e][d][c][b][a], and the one who does unrighteousness is himself responsible for his soul in destruction.
translation:
  language: hi
  text: जो धार्मिकता[a] का आचरण करता है, वह अपने लिए प्रभु के पास[b] जीवन संचित करता है, और जो अधर्म का आचरण करता है, वह अपने प्राण[c] के विनाश के लिए स्वयं उत्तरदायी है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय”।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “प्रभु के सामने” या “प्रभु से” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “प्राण” का अर्थ यहाँ “जीवन” या “स्वयं” भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या “वह विनाश में अपने प्राण के लिए स्वयं उत्तरदायी है,” अथवा “वह अपने प्राण के विनाश का स्वयं दोषी है।”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ποιῶν
  choice: जो … का आचरण करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त एक सामान्य व्यक्ति को दर्शाता है। ‘आचरण करता है’ यूनानी क्रिया के सक्रिय नैतिक भाव को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना उसकी पक्षगत बारीकी को अनावश्यक रूप से आदतन व्यवहार तक सीमित किए।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यहाँ व्यक्तिगत नैतिक आचरण के संदर्भ में ‘धार्मिकता’ उपयुक्त है और विपरीत पद ἀδικία के साथ स्पष्ट विरोध बनाए रखती है; ‘न्याय’ भी सम्भव अर्थ है।
- source_word: θησαυρίζει
  choice: संचित करता है
  rationale: यह चुनाव खजाने की तरह जमा करने की रूपक-छवि को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ζωὴν
  choice: जीवन
  rationale: अनिश्चित लेखरहित संज्ञा यहाँ सामान्य रूप से ‘जीवन’ को व्यक्त करती है।
- source_word: αὐτῷ
  choice: अपने लिए
  rationale: सम्प्रदान कारक का भाव यहाँ कर्ता की ओर लौटता है और उसके कर्म से होने वाले उसके अपने लाभ को दिखाता है।
- source_word: παρὰ Κυρίῳ
  choice: प्रभु के पास
  rationale: παρά के साथ सम्प्रदान कारक निकटता, उपस्थिति या किसी के यहाँ सुरक्षित होने का भाव दे सकता है। ‘प्रभु के पास’ इस व्यापकता को हिन्दी में बनाए रखता है।
- source_word: ἀδικίαν
  choice: अधर्म
  rationale: ‘अधर्म’ δικαιοσύνη के साथ नैतिक विरोध को स्पष्ट रूप से सुरक्षित रखता है; ‘अन्याय’ इसका सम्भव वैकल्पिक अर्थ है।
- source_word: αἴτιος
  choice: उत्तरदायी
  rationale: यह शब्द कारण, जवाबदेही या दोषी होने का भाव रखता है। ‘उत्तरदायी’ इन अर्थों को बिना अत्यधिक व्याख्या के व्यक्त करता है।
- source_word: τῆς ψυχῆς
  choice: अपने प्राण के लिए
  rationale: ψυχή का अर्थ ‘प्राण’, ‘जीवन’ या ‘स्वयं’ हो सकता है। ‘प्राण’ चेतावनी का धार्मिक और अस्तित्वगत भार बनाए रखता है।
- source_word: ἐν ἀπωλείᾳ
  choice: विनाश में
  rationale: यह निकट-औपचारिक अनुवाद यूनानी वाक्यांश की संक्षिप्तता और उसके स्थानीय, अवस्थात्मक अथवा परिणामसूचक अर्थ की वास्तविक अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: दूसरे खंड में नैतिक परिणाम और व्यक्तिगत जवाबदेही
  choice: कुकर्मी को विनाश के संबंध में अपने प्राण के लिए स्वयं उत्तरदायी बताया गया है।
  alternative: वह अपने प्राण के विनाश का स्वयं दोषी है।
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ हद तक मुहावरेदार है। मुख्य पाठ व्यक्तिगत जवाबदेही बनाए रखता है, पर यह निश्चित नहीं करता कि व्यक्ति सीधे अपने विनाश का कारण है या विनाश की अवस्था में अपने प्राण के लिए जवाबदेह है।
- issue: ψυχή का अर्थ
  choice: प्राण
  alternative: जीवन; स्वयं
  rationale: नैतिक और धार्मिक संदर्भ में ‘प्राण’ चेतावनी की गंभीरता को बनाए रखता है, जबकि पाद-टिप्पणी इसके व्यापक सम्भव अर्थों को दर्ज करती है।
