  choice: अन्याय के काम
  alternative: बुरे काम / गलत काम
  rationale: ‘अन्याय’ δίκαιος/ἄδικος शब्द-समूह से जुड़े विरोध को बनाए रखता है, जबकि ‘गलत’ या ‘बुरा’ इस संबंध को अधिक सामान्य नैतिक भाषा में बदल देता।
