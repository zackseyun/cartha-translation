- source_word: γνώσεώς σου
  choice: आपके ज्ञान से
  rationale: γνῶσις का सीधा अर्थ ‘ज्ञान’ है। ‘आपकी दृष्टि से’ अधिक मुहावरेदार होता, पर वह स्रोत की ज्ञान-संबंधी अभिव्यक्ति को दृष्टि की छवि में बदल देता।
- source_word: πᾶς ποιῶν ἄδικα
  choice: अन्याय के काम करनेवाला हर व्यक्ति
  rationale: ‘हर व्यक्ति’ πᾶς की सार्वभौमिकता और यूनानी वाक्य की सकारात्मक संरचना को बनाए रखता है; ‘अन्याय के काम’ ἄδικα के बहुवचन कर्मभाव तथा इस भजन में न्याय/अन्याय के विषयगत संबंध को स्पष्ट करता है।
