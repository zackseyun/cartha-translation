  text: They were cast out from the inheritance that the Lord gave them; the dispersion of Israel is among every nation[a], according to the word of God.
translation:
  language: hi
  text: वे उस विरासत से बाहर निकाल दिए गए, जो प्रभु ने उन्हें दी थी; परमेश्वर के वचन के अनुसार, इस्राएल का बिखराव हर राष्ट्र में[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल हर राष्ट्र में बिखरा हुआ है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερρίφησαν
  choice: निकाल दिए गए
  rationale: यह निष्क्रिय क्रिया विरासत से बलपूर्वक अलग किए जाने का भाव देती है; केवल भावनात्मक ‘ठुकराए गए’ कहना निर्वासन-संदर्भ में कम स्पष्ट होता।
- source_word: κληρονομίας
  choice: विरासत
  rationale: यह परमेश्वर द्वारा दिए गए उत्तराधिकार, विशेषतः भूमि अथवा वाचागत अधिकार, का स्वाभाविक और धर्मवैचारिक भारयुक्त हिन्दी रूप है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ पद इस्राएल के परमेश्वर को वाचा-संबंधी संदर्भ में सूचित करता है; ‘प्रभु’ मानक और गरिमापूर्ण अनुवाद है।
- source_word: διασπορὰ
  choice: बिखराव
  rationale: यूनानी में भाववाचक संज्ञा है। ‘बिखराव’ उस संज्ञात्मक रूप को बनाए रखते हुए आधुनिक हिन्दी में ‘विक्षेप’ या ‘प्रकीर्णन’ से अधिक सहज है।
- source_word: ῥῆμα
  choice: वचन
  rationale: ‘वचन’ दैवी कथन, घोषणा या आदेश के बीच मूल की अर्थगत खुलावट बनाए रखता है; ‘आदेश’ अर्थ को अनावश्यक रूप से संकरा कर देता।
- source_word: ἐν παντὶ ἔθνει
  choice: हर राष्ट्र में
  rationale: यह यूनानी वाक्यांश का सीधा और स्वाभाविक रूप है तथा इस्राएल के व्यापक बिखराव को व्यक्त करता है।
theological_decisions:
- issue: क्या διασπορά की संज्ञात्मक अभिव्यक्ति को क्रियात्मक रूप ‘इस्राएल हर राष्ट्र में बिखरा हुआ है’ बनाया जाए
  choice: 'संज्ञात्मक अभिव्यक्ति रखी गई: ‘इस्राएल का बिखराव हर राष्ट्र में है’'
  alternative: इस्राएल हर राष्ट्र में बिखरा हुआ है
  rationale: मूल यूनानी में διασπορά संज्ञा है। मुख्य पाठ में इसे बनाए रखने से स्रोत की संरचना और धर्मवैचारिक तनाव सुरक्षित रहते हैं; अधिक सहज क्रियात्मक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। मुख्य पाठ में यूनानी की संज्ञात्मक रचना जानबूझकर सुरक्षित रखी गई है; विराम-चिह्न वाक्य के दोनों कथनों और ‘परमेश्वर के वचन के अनुसार’ के संबंध को स्पष्ट करते हैं।
