lexical_decisions:
- source_word: ἀπαχθῆναι
  choice: ले जाया गया
  rationale: निष्क्रिय क्रिया इस्राएल के स्वेच्छा से जाने के बजाय उसे ले जाए जाने को व्यक्त करती है; प्रसंग में यह निर्वासन हेतु बलपूर्वक निष्कासन है।
- source_word: ἀποικεσίᾳ
  choice: निर्वासन में
  rationale: यह पराए देश में विस्थापित दशा को सूचित करता है; ‘निर्वासन’ आधुनिक हिन्दी में स्पष्ट और ऐतिहासिक प्रसंग के अनुकूल है।
- source_word: γῆν ἀλλοτρίαν
  choice: पराए देश
  rationale: वाक्यांश ऐसी भूमि को दर्शाता है जो इस्राएल की अपनी नहीं थी; ‘पराया देश’ इस अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀποστῆναι
  choice: विमुख हो गए
  rationale: क्रिया का अर्थ केवल स्थान छोड़ना नहीं, बल्कि संबंध या निष्ठा से हट जाना भी हो सकता है। ‘विमुख हो गए’ इस वाचा-संबंधी तनाव को बिना अत्यधिक तकनीकी भाषा के सुरक्षित रखता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: κύριος के लिए ‘प्रभु’ प्रतिष्ठित, स्वाभाविक और इस वाचा-संबंधी संदर्भ में उपयुक्त हिन्दी रूप है।
- source_word: τοῦ λυτρωσαμένου
  choice: जिसने उन्हें छुड़ाया था
  rationale: यह कृदंत प्रभु के पहले किए हुए उद्धारकारी कार्य को बताता है। ‘छुड़ाया था’ सामान्य पाठक के लिए स्वाभाविक है और मुक्ति का मूल भाव बनाए रखता है।
theological_decisions:
- issue: ἀποστῆναι में शारीरिक प्रस्थान और धार्मिक/वाचा-संबंधी विमुखता के बीच अर्थ-तनाव
  choice: विमुख हो गए
  alternative: दूर हो गए; अलग हो गए; विश्वासत्याग कर दिया
  rationale: संदर्भ प्रभु से निष्ठा हटने का संकेत देता है, पर मूल शब्द स्वयं किसी पूर्ण विकसित धर्मशास्त्रीय परिभाषा को अनिवार्य नहीं करता। मुख्य पाठ में सुबोध ‘विमुख’ रखा गया और विकल्प पादटिप्पणी में दिए गए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। यूनानी वाक्य की दोहरी ‘जब’ संरचना और अंत का अपूर्ण प्रवाह अल्पविराम सहित बनाए रखा गया है, क्योंकि यह पद अगले कथन से जुड़ता है।
