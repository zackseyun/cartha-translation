  terminology: ‘परमेश्वर’ and ‘धार्मिकता’ are suitable. ‘धर्मी सिद्ध हों’ preserves the forensic-demonstrative force without implying that God becomes righteous. The alternative ‘धर्मी ठहरें’ is retained as a conventional lexical alternative.
