  yaml_path: translation/deuterocanon/psalms_of_solomon/009/003.yaml
  text: So that you may be vindicated[a], O God, in your righteousness amid our lawless deeds[c][b];
translation:
  language: hi
  text: ताकि, हे परमेश्वर, आप अपनी धार्मिकता[b] में हमारे अधर्मों के बीच[c] धर्मी सिद्ध हों[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी ठहरें।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने न्याय में।”
    reason: lexical_alternative
  - marker: c
    text: या, “हमारे अधर्मों के संबंध में।”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का भाव व्यक्त करता है और यूनानी वाक्य की आगे की ओर संकेत करने वाली शक्ति बनाए रखता है।
- source_word: δικαιωθῇς
  choice: सही सिद्ध हों
  rationale: परमेश्वर के विषय में यह कर्मवाच्य रूप उनके धर्मी बनने का नहीं, बल्कि उनके सही या धर्मी सिद्ध होने अथवा माने जाने का भाव देता है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: रूप व्याकरणतः कर्ताकारक है, पर यहाँ प्रत्यक्ष संबोधन के रूप में प्रयुक्त हुआ है; ‘हे परमेश्वर’ प्रार्थनापूर्ण स्वर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: अपनी धार्मिकता में
  rationale: यह पद परमेश्वर की धार्मिकता को उस क्षेत्र या आधार के रूप में रखता है जिसमें वे सही सिद्ध होते हैं; ‘न्याय’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: हमारे अधर्म के कामों के बीच
  rationale: ἀνομία सामान्य पाप से बढ़कर व्यवस्था-विरोध और अधर्म का भाव रखता है। ‘के बीच’ ἐν को निकटता से दर्शाता है, जबकि संदर्भसूचक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर को कर्ता मानकर δικαιωθῇς का अनुवाद
  choice: सही सिद्ध हों
  alternative: धर्मी ठहरें
  rationale: मुख्य पाठ यह स्पष्ट करता है कि परमेश्वर की धार्मिकता प्रकट या प्रमाणित होती है, फिर भी अधिक शाब्दिक न्यायिक भाषा को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ ‘धार्मिकता’ व्यापक नैतिक और वाचा-संबंधी अर्थ को बनाए रखती है; न्यायिक प्रसंग में सम्भव ‘न्याय’ को पादटिप्पणी में दिया गया है।
- issue: दूसरे ἐν का संबंध
  choice: हमारे अधर्म के कामों के बीच
  alternative: हमारे अधर्म के कामों के संबंध में
  rationale: ‘के बीच’ मूल पूर्वसर्ग की स्थानिक/परिस्थितिगत छवि को बनाए रखता है, पर यूनानी में संदर्भसूचक अर्थ भी सम्भव है और उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण, गरिमामय और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘सही सिद्ध हों’ स्वाभाविक हिन्दी है, जबकि अधिक पारंपरिक न्यायिक विकल्प पादटिप्पणी में सुरक्षित है।
