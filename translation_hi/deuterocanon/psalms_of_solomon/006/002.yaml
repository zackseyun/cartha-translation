lexical_decisions:
- source_word: ἐν τῷ μνημονεύειν
  choice: जब ... स्मरण करेगा
  rationale: ἐν τῷ के साथ क्रियार्थक संज्ञा यहाँ स्वाभाविक रूप से कालवाचक है; यह हिंदी में ‘जब’ के द्वारा स्पष्ट और सहज रूप में व्यक्त होता है।
- source_word: αὐτὸν
  choice: वह
  rationale: αὐτόν को यहाँ क्रियार्थक संज्ञा μνημονεύειν का कर्म न मानकर उसका कर्ता समझना अधिक उपयुक्त है; इसलिए अर्थ है ‘जब वह स्मरण करेगा’, न कि ‘जब उसे स्मरण किया जाएगा’ अथवा ‘उसे स्मरण करते हुए’।
- source_word: τὸ ὄνομα Κυρίου
  choice: प्रभु के नाम को
  rationale: यह यूनानी पदबंध की संरचना और ‘प्रभु के नाम’ के बाइबलीय महत्व को बनाए रखता है। ‘को’ स्मरण करना क्रिया के निश्चित कर्म को स्पष्ट करता है।
- source_word: σωθήσεται
  choice: उसका उद्धार होगा
  rationale: σῴζω का भविष्यत् कर्मवाच्य रूप बचाए जाने या छुड़ाए जाने का अर्थ दे सकता है। ‘उसका उद्धार होगा’ कर्मवाच्य भाव और व्यापक धार्मिक अनुगूंज दोनों को स्वाभाविक हिंदी में सुरक्षित रखता है।
