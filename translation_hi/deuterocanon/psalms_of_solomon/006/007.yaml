lexical_decisions:
- source_word: ἐν εὐφρίᾳ καρδίας αὐτοῦ
  choice: अपने हृदय के आनंद में
  rationale: यह पदबंध हृदयगत आनंद को व्यक्त करता है। ‘हृदय’ बाइबलीय मानव-विज्ञान के परिचित रूपक को बनाए रखता है और ‘आनंद’ आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: ἐξύμνησεν
  choice: स्तुतिगान किया
  rationale: क्रिया साधारण प्रशंसा से बढ़कर भजन या गीत के रूप में स्तुति करने का भाव रखती है; ‘स्तुतिगान किया’ इस विशेष अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: परमेश्वर के नाम का
  rationale: यूनानी पाठ में ‘नाम’ स्पष्ट रूप से उपस्थित है। हिन्दी में ‘परमेश्वर के नाम का स्तुतिगान’ लक्ष्य और सम्मान दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐδεήθη τοῦ προσώπου Κυρίου
  choice: प्रभु की कृपा माँगी
  rationale: δέομαι के साथ संबंधकारक पद विनती किए जाने वाले को सूचित करता है, जबकि ‘प्रभु का मुख’ सेमिटिक मुहावरा प्रभु की अनुकूलता या कृपा पाने का भाव रखता है। मुख्य पाठ में मुहावरे का आशय दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: περὶ παντὸς τοῦ οἴκου αὐτοῦ
  choice: अपने पूरे घराने के लिए
  rationale: οἶκος यहाँ भवन नहीं, परिवार और आश्रितों सहित घराने को सूचित करता है। ‘पूरा घराना’ सामूहिक विस्तार को बनाए रखता है।
theological_decisions:
- issue: τοῦ προσώπου Κυρίου में ‘प्रभु के मुख’ का मुहावरा
  choice: प्रभु की कृपा माँगी
  alternative: प्रभु के मुख से विनती की
  rationale: यूनानी रचना में ‘प्रभु का मुख’ विनती का व्याकरणिक लक्ष्य है, केवल स्थानसूचक ‘प्रभु के सामने’ नहीं। फिर भी शाब्दिक हिन्दी अस्पष्ट और अस्वाभाविक होगी। ‘प्रभु की कृपा माँगी’ सेमिटिक मुहावरे का आशय व्यक्त करती है और पादटिप्पणी मूल बिंब को प्रकट करती है।
