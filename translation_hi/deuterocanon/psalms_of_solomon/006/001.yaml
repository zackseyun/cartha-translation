lexical_decisions:
- source_word: Μακάριος
  choice: धन्य
  rationale: यह आशीर्वचन-शैली का विशेषण है; ‘धन्य’ इसकी गंभीर, बाइबलीय और ज्ञान-साहित्यिक ध्वनि बनाए रखता है।
- source_word: ἀνὴρ
  choice: पुरुष
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है। ‘पुरुष’ मूल रूप को बनाए रखता है, जबकि यहाँ उसका प्रयोग प्रतिनिधिक अर्थ में समझा जा सकता है।
- source_word: καρδία
  choice: हृदय
  rationale: ‘हृदय’ भीतरी प्रवृत्ति और संकल्प के लिए प्रचलित बाइबलीय रूपक है; इसे अधिक व्याख्यात्मक शब्द से बदलना उचित नहीं।
- source_word: ἑτοίμη
  choice: तैयार
  rationale: यह तत्परता अथवा तैयारी को व्यक्त करता है; ‘तैयार’ स्वाभाविक हिंदी में दोनों पहलुओं को खुला रखता है।
- source_word: ἐπικαλέσασθαι
  choice: पुकारने
  rationale: मध्यवाच्य अनंत क्रिया यहाँ प्रभु का नाम लेकर उन्हें पुकारने अथवा उनका आह्वान करने का भाव देती है; ‘पुकारना’ सहज और धार्मिक संदर्भ में उपयुक्त है।
- source_word: τὸ ὄνομα
  choice: नाम
  rationale: यह बाइबलीय प्रयोग अर्थ-समृद्ध है; इसलिए ‘नाम’ को किसी व्याख्यात्मक पर्याय से नहीं बदला गया।
- source_word: Κυρίου
  choice: प्रभु
  rationale: κύριος के लिए ‘प्रभु’ आधुनिक मानक हिंदी में गरिमापूर्ण और स्थापित बाइबलीय पद है।
