  text: And the Lord hears the prayer of everyone in the fear of God[b][a], and the Lord fulfills every request of a soul that hopes in him.
translation:
  language: hi
  text: और प्रभु हर उस व्यक्ति की प्रार्थना सुनता है जो परमेश्वर का भय मानता है,[a] और प्रभु हर उस प्राण की विनती पूरी करता है जो उस पर आशा रखता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु ने परमेश्वर का भय मानने वाले हर व्यक्ति की प्रार्थना सुनी है।”
    reason: यूनानी एओरिस्ट को भूतकालीन या पूर्णतासूचक रूप में भी समझा जा सकता है; साथ ही मुहावरे का अधिक सहज हिन्दी रूप दिया गया है।
  - marker: b
    text: या, “हर उस व्यक्ति की विनती जो उस पर आशा रखता है।” यूनानी में शाब्दिक रूप से “प्राण” है।
    reason: ψυχή संदर्भ में पूरे व्यक्ति को भी सूचित कर सकता है।
lexical_decisions:
- source_word: Κύριος / ὁ κύριος
  choice: प्रभु
  rationale: κύριος के लिए प्रचलित, गरिमापूर्ण उपाधि; दोनों उपवाक्यों में इसकी पुनरावृत्ति यूनानी पाठ के बलाघात को बनाए रखती है।
- source_word: εἰσήκουσεν
  choice: सुनता है
  rationale: यद्यपि रूप एओरिस्ट है, समानांतर वर्तमानकालीन ἐπιτελεῖ के साथ यह सामान्य, सर्वकालिक सत्य व्यक्त करता जान पड़ता है; इसलिए हिन्दी का सामान्य वर्तमान स्वाभाविक है।
- source_word: παντὸς ἐν φόβῳ θεοῦ
  choice: परमेश्वर के भय में रहने वाले हर व्यक्ति
  rationale: ἐν φόβῳ θεοῦ की संरचना को बनाए रखते हुए हिन्दी में उसका बोधगम्य रूप दिया गया है; यहाँ ‘भय’ श्रद्धापूर्ण ईश्वर-भय को व्यक्त करता है।
- source_word: αἴτημα
  choice: विनती
  rationale: प्रार्थना के संदर्भ में स्पष्ट और गरिमापूर्ण हिन्दी शब्द, जो निवेदन या याचना का भाव देता है।
- source_word: ψυχῆς
  choice: प्राण
  rationale: यूनानी ψυχή की स्पष्ट शब्द-छवि को सुरक्षित रखता है; संदर्भ में ‘व्यक्ति’ अर्थ भी संभव है और उसे पादटिप्पणी में दिया गया है।
- source_word: ἐλπιζούσης πρὸς αὐτόν
  choice: जो उस पर आशा रखता है
  rationale: πρὸς द्वारा व्यक्त उसकी ओर उन्मुख आशा और निर्भरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπιτελεῖ
  choice: पूरी करता है
  rationale: विनती के साथ स्वाभाविक बैठता है और उसे फलित या संपन्न करने का अर्थ देता है।
theological_decisions:
- issue: εἰσήκουσεν के एओरिस्ट का कालगत अर्थ
  choice: सुनता है
  alternative: सुन चुका है / उसने सुनी
  rationale: दूसरे उपवाक्य के वर्तमानकालीन ἐπιτελεῖ के साथ समानांतरता एक सामान्य दैवी आचरण का कथन सुझाती है। फिर भी एओरिस्ट का भूतकालीन पाठ संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘परमेश्वर के भय में’ का अर्थ
  choice: परमेश्वर के भय में रहने वाला
  alternative: परमेश्वर से डरने वाला / परमेश्वर का भय मानने वाला
  rationale: मूल की पूर्वसर्गीय अभिव्यक्ति और उसके श्रद्धापूर्ण, जीवन-निर्देशक भाव को बिना किसी विशिष्ट संप्रदायगत व्याख्या के बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और भक्तिपूर्ण गरिमा वाली रखी गई है। ‘परमेश्वर के भय में रहने वाले’ मूल की असामान्य किंतु अर्थपूर्ण अभिव्यक्ति को कुछ हद तक सुरक्षित रखता है; ‘प्रभु’ की पुनरावृत्ति जानबूझकर मूल के अनुरूप है।
