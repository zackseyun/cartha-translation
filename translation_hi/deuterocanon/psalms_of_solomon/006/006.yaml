- source_word: ἐξανέστη ἐξ ὕπνου αὐτοῦ
  choice: वह अपनी नींद से जागा
  rationale: ἐξανέστη का मूल अर्थ ‘उठ खड़ा हुआ’ हो सकता है, पर ἐξ ὕπνου के साथ यह नींद से जागने/उठने का स्वाभाविक मुहावरा है; हिन्दी में ‘नींद से जागा’ आशय को स्पष्ट और सहज रखता है।
- source_word: ἐυλόγησεν τῷ ὀνόματι Κυρίου
  choice: उसने प्रभु के नाम को धन्य कहा
  rationale: यूनानी में εὐλογέω और ‘नाम’ के साथ सम्प्रदान कारक है। ‘नाम को धन्य कहा’ स्तुति के अर्थ को बनाए रखते हुए स्रोत की संरचना के निकट और हिन्दी में बोधगम्य है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: Κύριος का मानक, गरिमापूर्ण हिन्दी प्रतिरूप; स्रोत में यहाँ कोई विशिष्ट दैवी नाम नहीं लिखा है।
