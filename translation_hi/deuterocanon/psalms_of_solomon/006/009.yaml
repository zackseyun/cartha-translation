- source_word: ὁ ποιῶν ἔλεος
  choice: जो ... दया करता है
  rationale: ποιέω और ἔλεος का संयोग दया दिखाने/करने का मुहावरा है; हिन्दी में ‘दया करना’ स्वाभाविक है।
- source_word: τοῖς ἀγαπῶσιν αὐτὸν
  choice: उन लोगों पर ... जो उससे प्रेम करते हैं
  rationale: यूनानी कृदन्तीय वाक्यांश को अर्थ सुरक्षित रखते हुए स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य बनाया गया है।
- source_word: ἐν ἀληθείᾳ
  choice: सच्चाई से
  rationale: यह स्वाभाविक हिन्दी में सत्यता, निष्कपटता अथवा निष्ठा के संभावित भावों को पर्याप्त रूप से खुला रखता है।
