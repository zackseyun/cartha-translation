- source_word: εὐλογητὸς
  choice: धन्य है
  rationale: स्तुतिपरक विधेय-विशेषण के रूप में यह प्रचलित और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: Κύριος
