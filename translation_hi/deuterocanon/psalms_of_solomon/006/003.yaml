translation:
  language: hi
  text: उसके मार्ग प्रभु के द्वारा सीधे किए जाते हैं, और उसके हाथों के काम उसके प्रभु परमेश्वर के द्वारा सुरक्षित रखे गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδοὶ
  choice: मार्ग
  rationale: यह शब्द जीवन-चाल, आचरण या प्रयत्नों की दिशा को व्यक्त कर सकता है; ‘मार्ग’ मूल रूपक और उसकी व्यापकता दोनों बनाए रखता है।
- source_word: κατευθύνονται
  choice: सीधे किए जाते हैं
  rationale: निष्क्रिय क्रिया का मूल भाव मार्गों को सीधा किए जाने का है। यह अनुवाद दैवी कर्तृत्व को स्पष्ट रखते हुए यूनानी बिंब को बचाता है।
- source_word: πεφυλαγμένα
  choice: सुरक्षित रखे जाते हैं
  rationale: पूर्ण कृदंत किसी ऐसी वर्तमान अवस्था का संकेत देता है जो रक्षा किए जाने के परिणामस्वरूप बनी हुई है; ‘सुरक्षित रखे जाते हैं’ रक्षा और निरंतर संरक्षण दोनों भाव व्यक्त करता है।
- source_word: ἔργα χειρῶν αὐτοῦ
  choice: उसके हाथों के काम
  rationale: यह चयन यूनानी की ठोस और पारदर्शी अभिव्यक्ति को बनाए रखता है तथा उसे केवल ‘उसके काम’ कहकर सपाट नहीं करता।
- source_word: Κυρίου
  choice: प्रभु
  rationale: यह κύριος का स्वाभाविक, प्रतिष्ठित और धार्मिक संदर्भ में प्रचलित हिन्दी समतुल्य है।
- source_word: Κυρίου θεοῦ αὐτοῦ
  choice: उसके प्रभु परमेश्वर
  rationale: यह पदबंध संबंधवाचक αὐτοῦ को स्पष्ट रूप से बनाए रखता है और ‘प्रभु’ तथा ‘परमेश्वर’ दोनों उपाधियों को सुरक्षित रखता है।
theological_decisions:
- issue: निष्क्रिय क्रियाओं में दैवी कर्तृत्व
  choice: दोनों खंडों में प्रभु को स्पष्ट कर्ता रखते हुए कहा गया है कि उसी के द्वारा मार्ग सीधे किए और काम सुरक्षित रखे जाते हैं।
  alternative: इसे सामान्य आशीष या सफलता के कमजोर भाव में प्रस्तुत करना, जैसे ‘प्रभु के सामने उसके मार्ग सफल होते हैं।’
  rationale: दोनों निष्क्रिय कथनों के साथ ὑπό स्पष्ट रूप से प्रभु को कर्ता बताता है। इसलिए अनुवाद दैवी संचालन और संरक्षण के प्रबल कथन को कम नहीं करता।
- issue: κατευθύνονται का अर्थ
  choice: ‘सीधे किए जाते हैं’ द्वारा मूल मार्ग-बिंब और निष्क्रिय रूप को बनाए रखा गया है।
  alternative: ‘मार्गदर्शन पाते हैं’ या ‘निर्देशित किए जाते हैं।’
  rationale: ‘मार्गदर्शन’ संभव अर्थ है, पर ‘सीधे किए जाते हैं’ κατευθύνω के अधिक ठोस मूल भाव को दर्शाता है और यह तय नहीं करता कि कथन केवल निर्णयों में दिशा देने के विषय में है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। दोनों समानांतर खंडों और ‘उसके हाथों के काम’ के मूल बिंब को सुरक्षित रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं है।
