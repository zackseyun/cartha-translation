- source_word: ψυχή
  choice: आत्मा
  rationale: यहाँ ψυχή व्यक्ति के भीतरी जीवन अथवा स्वयं व्यक्ति को दर्शाता है। ‘आत्मा’ काव्यात्मक गरिमा और मूल की व्यापक अर्थ-छाया बनाए रखता है।
- source_word: διάβασις
  choice: पार करते समय
  rationale: διάβασις नदी को पार करने या उससे होकर निकलने की क्रिया है। प्रसंग में यह स्वाभाविक आधुनिक हिन्दी है और जोखिम भरे नदी-पारगमन का चित्र स्पष्ट रखती है।
- source_word: σάλος
  choice: उथल-पुथल
  rationale: σάλος समुद्र की विक्षुब्ध, हिलती-डुलती अवस्था या प्रचंड हलचल को व्यक्त करता है। ‘उथल-पुथल’ इस गति और अस्थिरता को सहज हिन्दी में संप्रेषित करता है।
- source_word: πτοηθήσεται
  choice: आतंकित न होगी
  rationale: यह भविष्यत् कर्मवाच्य रूप केवल सामान्य भय नहीं, बल्कि भय से बुरी तरह विचलित या आतंकित किए जाने का प्रबल भाव रखता है।
