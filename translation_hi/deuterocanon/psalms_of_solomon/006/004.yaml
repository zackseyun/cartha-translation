lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: दर्शन से
  rationale: ὅρασις यहाँ स्वप्न में दिखाई देने वाले दृश्य या दर्शन को व्यक्त करता है; ‘दर्शन’ मूल की संज्ञात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: πονηρῶν ἐνυπνίων αὐτοῦ
  choice: अपने बुरे स्वप्नों के
  rationale: αὐτοῦ को स्वप्नों से संबद्ध रखते हुए ‘अपने’ किया गया है; πονηρῶν का सीधा और स्वाभाविक अर्थ ‘बुरे’ है।
- source_word: οὐ ταραχθήσεται
  choice: घबराएगा नहीं
  rationale: ταράσσω के भावी कर्मवाच्य रूप का अर्थ विचलित, व्याकुल या भयभीत होना हो सकता है; स्वप्नों के प्रसंग में ‘घबराएगा नहीं’ सहज हिंदी है और भावी अर्थ बनाए रखता है।
theological_decisions:
- issue: αὐτοῦ का संबंध
  choice: ‘अपने’ द्वारा इसे स्वप्नों से संबद्ध किया गया है
  alternative: सर्वनाम को निहित छोड़कर ‘बुरे स्वप्नों के दर्शन’
  rationale: यूनानी पदबंध में αὐτοῦ सीधे ἐνυπνίων के बाद है, इसलिए स्वामित्व को अनुवाद में स्पष्ट रखना स्रोत-संगत है।
