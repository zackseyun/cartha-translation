  text: And who will take from all that you have made, unless you give it?
translation:
  language: hi
  text: और जो कुछ तूने बनाया है, उसमें से कौन लेगा, यदि तू न दे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λήψεται
  choice: लेगा
  rationale: भविष्यकाल के अर्थ और ‘लेना/प्राप्त करना’ की मूल अर्थ-सीमा को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ πάντων ὧν ἐποίησας
  choice: जो कुछ तूने बनाया है, उसमें से
  rationale: सृष्ट की हुई समस्त वस्तुओं में से लेने का भाव सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
- source_word: ἐὰν μὴ σὺ δῷς
  choice: यदि तू न दे
  rationale: ग्रीक में ‘तू’ पर दिए गए बल को व्यक्त करता है और ‘दे’ का अप्रकट कर्म जोड़कर अस्पष्टता को नहीं मिटाता।
theological_decisions:
- issue: देने की क्रिया का अप्रकट कर्म
  choice: ‘यदि तू न दे’ में कर्म को अप्रकट रखा गया
  alternative: ‘यदि तू उसे न दे’
  rationale: ग्रीक δῷς के साथ कोई व्यक्त कर्म नहीं है; इसलिए मूल की संक्षिप्तता और संभावित व्यापक अर्थ को सुरक्षित रखा गया।
- issue: परमेश्वर के लिए एकवचन संबोधन
  choice: ‘तू’
  alternative: ‘आप’
  rationale: ग्रीक का एकवचन और बलयुक्त σύ प्रत्यक्ष, काव्यात्मक प्रार्थना-संबोधन है; आधुनिक बाइबलीय हिन्दी में ‘तू’ इसे स्पष्ट और गरिमापूर्ण ढंग से बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी; वाक्य की अलंकारिक प्रश्न-रचना तथा मूल में ‘देना’ क्रिया के कर्म की अनुपस्थिति सुरक्षित रखी गई है।
