  yaml_path: translation/deuterocanon/psalms_of_solomon/005/016.yaml
  text: But your gift is abundant in kindness and rich[b][a], and the hope in you will not be disappointed in the gift.
translation:
  language: hi
  text: पर तेरा दान कृपा से भरपूर और समृद्ध है; ऐसा कोई नहीं, जिसकी आशा तुझ पर हो और जिसे दान देते समय तू कम दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी का अंतिम भाग बहुत संक्षिप्त और कुछ अस्पष्ट है। इसका अनुवाद यह भी हो सकता है: “तुझ पर आशा रखनेवाला दान देने में कसर नहीं करेगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόμα
  choice: दान
  rationale: δόμα का अर्थ दी हुई वस्तु या उपहार है। यहाँ परमेश्वर की उदारता के प्रसंग में ‘दान’ स्वाभाविक है और इसी पद में शब्द की पुनरावृत्ति को बनाए रखता है।
- source_word: πολύ
  choice: भरपूर
  rationale: πολύ दान की प्रचुरता बताता है; ‘भरपूर’ आधुनिक हिन्दी में इस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: μετὰ χρηστότητος
  choice: कृपा से
  rationale: χρηστότης यहाँ दान के साथ जुड़ी भलाई, दयालुता और उदार कृपा को दर्शाता है। ‘कृपा से भरपूर’ इस गुण को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: πλούσιον
  choice: समृद्ध
  rationale: πλούσιον का मूल चित्र ‘धनी/समृद्ध’ होने का है; यहाँ यह दान की विपुलता को काव्यात्मक ढंग से व्यक्त करता है।
- source_word: ἡ ἐλπὶς ἐπὶ σέ
  choice: जिसकी आशा तुझ पर हो
  rationale: यूनानी में ‘तुझ पर आशा’ व्यक्ति के स्थान पर संक्षिप्त रूप से प्रयुक्त है। हिन्दी में संबंधवाचक वाक्यांश व्यक्ति को स्पष्ट करता है, पर आशा के मूल बिंब को बनाए रखता है।
- source_word: οὐ φείσεται ἐν δόματι
  choice: जिसे दान देते समय तू कम दे
  rationale: φείδομαι का अर्थ बचाना, रोक रखना या कसर करना है। प्रसंग में आशा रखनेवाला पानेवाला है, इसलिए परमेश्वर को निहित कर्ता मानकर यह अनुवाद दान में कसर न रखने का भाव व्यक्त करता है; यूनानी की संक्षिप्तता और वैकल्पिक व्याकरणिक समझ फुटनोट में दी गई है।
theological_decisions:
- issue: दूसरे खंड में कर्ता और दान पानेवाले की पहचान
  choice: परमेश्वर को निहित दाता और उस पर आशा रखनेवाले को प्राप्तकर्ता माना गया है।
  alternative: ‘तुझ पर आशा रखनेवाला दान देने में कसर नहीं करेगा।’
  rationale: निकटवर्ती प्रसंग परमेश्वर के भरपूर दान की तुलना मनुष्य के सीमित देने से करता है। इसलिए आशा रखनेवाले को दाता बनाने के बजाय प्राप्तकर्ता मानना प्रसंगानुकूल है, यद्यपि यूनानी वाक्य व्याकरण की दृष्टि से संक्षिप्त और कुछ अस्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और प्रार्थनामय शैली रखी गई है। परमेश्वर के लिए निकट और गरिमापूर्ण एकवचन ‘तू/तेरा/तुझ’ प्रयुक्त हुआ है।
