  text: τὸ δὲ δόμα σου πολὺ μετὰ χρηστότητος καὶ πλούσιον, καὶ οὐκ ἔστιν ἡ ἐλπὶς ἐπὶ σέ, οὐ φείσεται ἐν δόματι·
