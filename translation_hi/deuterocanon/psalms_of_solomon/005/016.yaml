  source_fidelity: The rendering accurately conveys δόμα as “दान,” πολύ as “भरपूर,” and πλούσιον as “समृद्ध.” It responsibly resolves the compressed final Greek clause by making God the implied giver and the one hoping in him the recipient; this fits the immediate generosity context while the footnote preserves the viable alternative construal.
  naturalness: The Hindi is clear, modern, and appropriately prayerful. “ऐसा कोई नहीं, जिसकी आशा तुझ पर हो...” is a natural way to express the Greek’s elliptical use of “hope” for the person who hopes. “दान देते समय तू कम दे” is understandable and idiomatic enough in context.
  terminology: “दान,” “कृपा,” “आशा,” and the reverential singular “तेरा/तुझ/तू” are consistent and suitable. “समृद्ध” retains the source image of richness without importing doctrinal interpretation.
