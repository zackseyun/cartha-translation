  language: hi
  text: क्योंकि कोई भी किसी बलवान पुरुष से लूट का माल[a][b] नहीं लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘लूटी हुई वस्तुएँ।’
