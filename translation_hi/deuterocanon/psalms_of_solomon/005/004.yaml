    reason: source_ambiguity
lexical_decisions:
- source_word: λήψεται
  choice: लेगा
  rationale: यह λαμβάνω का भविष्यकालीन रूप है। लूट का माल प्राप्त करने के संदर्भ में ‘लेगा’ सीधा और स्वाभाविक है; यूनानी में निहित कर्ता को मुख्य पाठ में अनिश्चित ‘कोई भी’ के रूप में व्यक्त किया गया है।
- source_word: σκῦλα
  choice: लूट का माल
  rationale: यह शब्द युद्ध या बलपूर्वक छीने गए माल को सूचित करता है। ‘लूट का माल’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा वस्तुओं के सामूहिक अर्थ को बनाए रखता है।
- source_word: παρὰ
  choice: से
  rationale: सम्बन्धकारक के साथ παρά यहाँ स्रोत को दर्शाता है; हिन्दी का ‘से’ इसी अर्थ को संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: ἀνδρὸς δυνατοῦ
  choice: किसी बलवान पुरुष
  rationale: ἀνήρ पुरुष को और δυνατός शक्ति या सामर्थ्य को सूचित करता है। ‘बलवान पुरुष’ दोनों अर्थों को बनाए रखता है; ‘किसी’ हिन्दी में अनिश्चित यूनानी पदबंध के अनुरूप जोड़ा गया है।
