base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/006.yaml
  text: For man and his portion from you are in the balance[a]; he will not add so as to exceed your judgment[b], O God.
translation:
  language: hi
  text: क्योंकि मनुष्य और उसका भाग, जो आपसे मिलता है, तराज़ू पर हैं[a]; वह आपके निर्णय से बढ़ जाने के लिए कुछ नहीं जोड़ेगा[b], हे परमेश्वर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तौल में हैं।”
    reason: ‘तराज़ू’ के ठोस बिंब और तौल या माप की अधिक सामान्य अभिव्यक्ति—दोनों ἐν σταθμῷ के संभव हिन्दी रूप हैं।
  - marker: b
    text: 'अधिक शाब्दिक रूप से: “वह आपके निर्णय से अधिक होने के लिए नहीं जोड़ेगा।”'
    reason: यूनानी उद्देश्यवाचक रचना हिन्दी में अस्वाभाविक लग सकती है; मुख्य पाठ उसका आशय सहज रूप में देता है, जबकि यह टिप्पणी मूल वाक्य-विन्यास दिखाती है।
lexical_decisions:
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: एकवचन संज्ञा और उसके साथ आए एकवचन सर्वनाम को बनाए रखते हुए यह प्रतिनिधिक मानव के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μερὶς
  choice: भाग
  rationale: यह किसी व्यक्ति को मिले या ठहराए गए हिस्से को व्यक्त करता है और मापे जाने के प्रसंग के अनुकूल है।
- source_word: παρὰ σοῦ
  choice: जो आपसे मिलता है
  rationale: παρά के साथ संबंधकारक यहाँ स्रोत या उद्गम बताता है—भाग परमेश्वर से मिलता है—न कि ‘आपके सामने’।
- source_word: ἐν σταθμῷ
  choice: तराज़ू पर
  rationale: यह तौलने के ठोस बिंब को आधुनिक और सहज हिन्दी में बनाए रखता है।
- source_word: οὐ προσθήσει
  choice: वह उसमें ... नहीं जोड़ेगा
  rationale: मूल क्रिया ‘जोड़ना’ है। हिन्दी में अस्पष्ट कर्म को समझने योग्य बनाने के लिए ‘उसमें’ जोड़ा गया है, जिसका संकेत मनुष्य के भाग की ओर है।
- source_word: τοῦ πλεονάσαι
  choice: कि वह ... से अधिक हो जाए
  rationale: यह उद्देश्य या परिणाम बताने वाली रचना है और निर्धारित सीमा से आगे बढ़ने का भाव रखती है।
- source_word: κρίμα
  choice: निर्णय
  rationale: यह परमेश्वर के न्यायिक निर्धारण, निर्णय या ठहराई हुई सीमा को व्यक्त कर सकता है; ‘निर्णय’ इस प्रसंग में स्वाभाविक रहते हुए अर्थ की व्यापकता बनाए रखता है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: रूपतः कर्ताकारक संज्ञा यहाँ सीधे संबोधन का कार्य करती है; हिन्दी में ‘हे परमेश्वर’ उसका स्वाभाविक प्रार्थनात्मक रूप है।
theological_decisions:
- issue: ἄνθρωπος का प्रतिनिधिक एकवचन अर्थ
  choice: ‘मनुष्य’ को एकवचन में रखा गया
  alternative: ‘मानवजाति’ या बहुवचन ‘मनुष्य’
  rationale: मूल पाठ एक मनुष्य और उसके भाग की एकवचन छवि प्रस्तुत करता है; इसे सामूहिक बहुवचन में बदलने से वह व्याकरणिक और काव्यात्मक रूप मिट जाता।
- issue: मनुष्य के भाग और परमेश्वर के निर्णय का संबंध
  choice: भाग परमेश्वर से मिलता है और उसके निर्णय से अधिक नहीं होता
  alternative: मनुष्य और उसका भाग परमेश्वर के सामने तौले जाते हैं
  rationale: παρὰ σοῦ में संबंधकारक ‘आपसे’ अर्थात स्रोत को दर्शाता है। फिर भी पद यह निश्चित नहीं करता कि न बढ़ाने का कारण असमर्थता है या परमेश्वर द्वारा निर्धारित सीमा; इसलिए हिन्दी में असमर्थता का स्पष्ट दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ का प्रयोग किया गया है। भाषा प्रार्थनात्मक और गरिमापूर्ण है, पर अनावश्यक रूप से पुरातन नहीं। ‘तराज़ू पर’ तौल की काव्यात्मक छवि बनाए रखता है और ‘निर्णय’ न्यायिक अर्थ को बिना किसी विशिष्ट सांप्रदायिक व्याख्या के व्यक्त करता है।
