lexical_decisions:
- source_word: πεινάσωσιν
  choice: भूखे हों
  rationale: ἐὰν के साथ अओरिस्ट सबजंक्टिव सामान्य भविष्यगत शर्त व्यक्त करता है; ‘यदि वे भूखे हों’ तीव्रता बढ़ाए बिना इसे स्वाभाविक हिन्दी में रखता है।
- source_word: ἀροῦσιν
  choice: उठाएँगे
  rationale: αἴρω के भविष्यत् रूप का मूल अर्थ ‘उठाना’ है; यह प्रार्थना और आश्रय की ठोस छवि को बनाए रखता है।
- source_word: πρόσωπον αὐτῶν
  choice: अपना मुख
  rationale: यूनानी में बहुवचन कर्ता के साथ ‘मुख’ एकवचन है। हिन्दी में वितरणात्मक ‘अपना मुख’ स्वाभाविक है और स्रोत की संख्या-संरचना भी बनाए रखता है।
- source_word: πρὸς σέ
  choice: तेरी ओर
  rationale: πρός दिशा को व्यक्त करता है; ‘तेरी ओर’ मुख उठाने की गति और परमेश्वर की ओर सहायता के लिए मुड़ने—दोनों को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
