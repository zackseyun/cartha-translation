  text: For you are kind and merciful[a], the refuge of the poor.
translation:
  language: hi
  text: क्योंकि आप कृपालु और दयालु हैं—निर्धन जन के शरणस्थान।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: χρηστός
  choice: कृपालु
  rationale: यहाँ शब्द लाभ पहुँचाने वाली भलाई और सदय स्वभाव को व्यक्त करता है। ‘कृपालु’ केवल सामान्य नैतिक ‘भला’ कहने की अपेक्षा इस संबंधपरक भाव को अधिक स्पष्ट करता है।
- source_word: ἐλεήμων
  choice: दयालु
  rationale: यह दीन-दुखियों पर दया दिखाने वाले स्वभाव का सीधा और सहज हिन्दी रूप है।
- source_word: καταφυγή
  choice: शरणस्थान
  rationale: यह संकट में आश्रय लेने की जगह या साधन का रूपक है। ‘शरणस्थान’ उस रूपक को बनाए रखता है और व्यक्ति को केवल ‘रक्षक’ कहकर अर्थ का विस्तार नहीं करता।
- source_word: τοῦ πτωχοῦ
  choice: निर्धन जन के
  rationale: एकवचन यहाँ वर्गसूचक है। ‘निर्धन जन’ गरीबी और असहायता दोनों का स्वाभाविक संकेत देता है तथा हिन्दी में किसी व्यक्ति को केवल ‘निर्धन’ संज्ञा बनाने से अधिक गरिमापूर्ण है।
- source_word: σύ (Swete printed reading; supplied transcription has ἐχρηστός)
  choice: आप
  rationale: Swete के मुद्रित पाठ और विशेषणों के पुल्लिंग रूपों के अनुसार परमेश्वर को प्रत्यक्ष संबोधन है। आधुनिक सम्मानसूचक हिन्दी में ‘आप’ उपयुक्त है।
theological_decisions:
- issue: ‘शरणस्थान’ को कर्ता मानना या संबोधित परमेश्वर के समानाधिकरण में रखना
  choice: परमेश्वर को ‘कृपालु और दयालु’ कहा गया है, और ‘निर्धन जन के शरणस्थान’ को उसी संबोधित व्यक्ति का समानाधिकरण रखा गया है।
  alternative: ‘निर्धन जन का शरणस्थान कृपालु और दयालु है।’
  rationale: χρηστός और ἐλεήμων पुल्लिंग हैं, जबकि καταφυγή स्त्रीलिंग है; इसलिए विशेषणों को ‘शरणस्थान’ से जोड़ना व्याकरणिक मेल को तोड़ता है। Swete का मुद्रित σύ प्रत्यक्ष संबोधन की पुष्टि करता है।
translation_notes:
  register: 'भाषा आधुनिक, सम्मानपूर्ण और काव्यात्मक रखी गई है। डैश समानाधिकरण को स्पष्ट करता है: संबोधित परमेश्वर ही निर्धन जन का शरणस्थान है।'
