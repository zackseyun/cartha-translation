base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/014.yaml
  text: And you will hear[a], for who is kind and gentle but you[c][b], to gladden the soul of the humble when you open your hand in mercy?
translation:
  language: hi
  text: और तू सुनेगा[a], क्योंकि तेरे सिवा कौन दयालु और कोमल है, जो दीन जन के प्राण को आनंदित करे, जब तू करुणा से अपना हाथ खोलता है?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अनुकूल होकर सुनेगा’ या ‘उत्तर देगा’; यहाँ प्रयुक्त क्रिया, विशेषकर प्रार्थना के संदर्भ में, ध्यानपूर्वक और अनुकूलता से सुनने का भाव रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपना हाथ खोलना’ उदारतापूर्वक देने और आवश्यकताओं की पूर्ति करने का चित्रात्मक मुहावरा है।
    reason: cultural_note
  - marker: c
    text: उपलब्ध यूनानी पाठ में ‘दीन’ का रूप (ταπεινὸν) स्त्रीलिंग ‘प्राण’ (ψυχὴν) के साथ व्याकरणतः मेल नहीं खाता। सम्भवतः पाठ में ταπεινοῦ, अर्थात ‘दीन जन के’, अभिप्रेत है; मुख्य अनुवाद इसी सम्भावित पाठ को अपनाता है।
    reason: textual_note
lexical_decisions:
- source_word: ἐπακούσῃ
  choice: सुनकर उत्तर देगा
  rationale: यह क्रिया केवल सुनने ही नहीं, विशेषकर प्रार्थना के प्रसंग में अनुकूल रूप से सुनने और प्रत्युत्तर देने का भाव भी रखती है। हिन्दी में संयुक्त अभिव्यक्ति दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करती है।
- source_word: χρηστός
  choice: दयालु
  rationale: यहाँ यह शब्द ईश्वर की हितकारी भलाई और कृपा को व्यक्त करता है; ‘दयालु’ साधारण पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: ἐπιεικής
  choice: सौम्य
  rationale: यह नम्र, कोमल और कठोरता से रहित व्यवहार का भाव देता है। ‘सौम्य’ पद काव्यात्मक गरिमा बनाए रखते हुए ‘दयालु’ से अलग अर्थच्छाया रखता है।
- source_word: εὐφρᾶναι
  choice: आनन्दित करे
  rationale: यूनानी अनन्त क्रिया ईश्वर के उस विशिष्ट कार्य को बताती है जिसके द्वारा वह दीन जन को हर्ष देता है; ‘जो ... आनन्दित करे’ हिन्दी में इस वाक्यगत संबंध को सुरक्षित रखता है।
- source_word: ψυχὴν
  choice: प्राण
  rationale: भजनात्मक हिन्दी में ‘प्राण’ व्यक्ति के जीवित और भीतरी अस्तित्व का स्वाभाविक संकेत देता है तथा ‘आत्मा’ से जुड़ी अनावश्यक दार्शनिक विशिष्टता से बचता है।
- source_word: ταπεινὸν / सम्भावित ταπεινοῦ
  choice: दीन जन के
  rationale: प्रदत्त पाठ में विशेषण का रूप ψυχὴν से व्याकरणतः मेल नहीं खाता। सम्भावित मूल पाठ ταπεινοῦ का अर्थ ‘दीन जन के’ है, जो वाक्य को सुबोध बनाता है; पाठगत समस्या को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν τῷ ἀνοῖξαι χεῖρά σου
  choice: जब तू ... अपना हाथ खोलता है
  rationale: यह उदारतापूर्वक देने और आवश्यकताओं की पूर्ति करने का चित्रात्मक मुहावरा है। मूल बिंब को बनाए रखते हुए हिन्दी वाक्य स्वाभाविक रखा गया है।
- source_word: ἐν ἐλέει
  choice: करुणा से
  rationale: यह ईश्वर के हाथ खोलने की रीति और प्रेरणा को दर्शाता है। ‘करुणा से’ हिन्दी में संक्षिप्त, स्पष्ट और काव्यात्मक है।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: प्राण
  alternative: आत्मा
  rationale: यहाँ शब्द पूरे भीतरी और जीवित व्यक्ति की ओर संकेत कर सकता है। ‘प्राण’ उस व्यापकता को बनाए रखता है और मनुष्य की संरचना के बारे में किसी विशेष धर्मवैज्ञानिक मत को अनावश्यक रूप से आरोपित नहीं करता।
- issue: परमेश्वर के सुनने का स्वरूप
  choice: सुनकर उत्तर देगा
  alternative: सुनेगा
  rationale: ἐπακούω प्रार्थना को अनुकूल रूप से सुनने या उसका उत्तर देने का भाव रख सकता है। संयुक्त अनुवाद इस प्रत्युत्तरकारी भाव को व्यक्त करता है, पर उत्तर के किसी निश्चित रूप का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भजनात्मक शैली अपनाई गई है। परमेश्वर के लिए निकट और काव्यपरक एकवचन ‘तू’ रखा गया है। वाक्य की अलंकारिक प्रश्न-रचना और ‘हाथ खोलने’ का मूल चित्र सुरक्षित रखा गया है, जबकि असामान्य यूनानी पाठगत रूप को चुपचाप सामान्य करने के बजाय पादटिप्पणी में दर्ज किया गया है।
