  text: καὶ σὺ ἐπακούσῃ, ὅτι τίς χρηστὸς καὶ ἐπιεικὴς ἀλλʼ ἢ σύ, εὐφρᾶναι ψυχὴν ταπεινὸν ἐν τῷ ἀνοῖξαι χεῖρά σου ἐν ἐλέει.
