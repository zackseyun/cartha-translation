lexical_decisions:
- source_word: ἐὰν δὲ
  choice: पर यदि
  rationale: ἐὰν की शर्त और δέ के हल्के विरोधात्मक मोड़—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κεκραγέναι με
  choice: मैं पुकारूँ
  rationale: κεκραγέναι रूपतः पूर्णकालिक infinitive है और με उसका कर्ता है; इस संक्षिप्त शर्तीय विनती में हिन्दी का संभावनार्थक finite रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πρὸς σέ
  choice: तुझे
  rationale: प्रार्थना के संदर्भ में पुकारने की दिशा और व्यक्तिगत संबोधन को सहज हिन्दी में व्यक्त करता है।
- source_word: μὴ παρασιωπήσῃς
  choice: चुप न रह
  rationale: क्रिया के मौन रहने अथवा मौन में टाल देने के मूल बिंब को सुरक्षित रखता है; ‘अनसुना न कर’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: ἀπʼ ἐμοῦ
  choice: मेरे प्रति
  rationale: शाब्दिक ‘मुझसे’ इस हिन्दी संदर्भ में भ्रमित कर सकता है; ‘मेरे प्रति’ वक्ता के संबंध में परमेश्वर के मौन की दिशा को स्पष्ट और निकट रूप से व्यक्त करता है।
