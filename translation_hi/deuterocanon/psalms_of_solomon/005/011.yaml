  text: You feed the birds and the fish[z], as you give rain to the desolate places for the sprouting of grass[a], to prepare fodder in the wilderness for every living thing.
translation:
  language: hi
  text: पक्षियों और मछलियों को तू ही खिलाता है; उजाड़ स्थानों में घास उगने के लिए वर्षा देकर, ताकि निर्जन प्रदेश में हर जीव के लिए चारा तैयार हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πετεινὰ
  choice: पक्षियों
  rationale: यह यूनानी संज्ञा उड़नेवाले प्राणियों, विशेषतः पक्षियों, के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘पक्षियों’ स्वाभाविक और संक्षिप्त है।
- source_word: τοὺς ἰχθύας
  choice: मछलियों
  rationale: यह मूल शब्द का सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: σὺ τρέφεις
  choice: तू ही खिलाता है
  rationale: σὺ का स्पष्ट प्रयोग कर्ता पर बल देता है, जिसे ‘तू ही’ व्यक्त करता है; τρέφεις यहाँ जीवों को आहार देने के ठोस अर्थ में है।
- source_word: ἐρήμοις / ἐν ἐρήμῳ
  choice: उजाड़ स्थानों / निर्जन प्रदेश
  rationale: दोनों प्रयोग बंजर या आबादी से दूर भूभाग सूचित करते हैं। प्रसंगानुसार ये हिन्दी अभिव्यक्तियाँ उस चित्र को स्वाभाविक ढंग से बनाए रखती हैं।
- source_word: εἰς ἀνατολὴν χλόης
  choice: घास उगाता है
  rationale: ἀνατολή का मूल भाव ‘उदय’ या ‘निकलना’ है; χλόη के साथ यह घास के अंकुरित होकर उगने को दर्शाता है।
- source_word: ἑτοιμάσαι χορτάσματα
  choice: चारा तैयार करता है
  rationale: ἑτοιμάσαι पूर्ववर्ती वर्षा देने के उद्देश्य या फल को व्यक्त करता है, और χορτάσματα यहाँ जीवों के पोषण के लिए वनस्पतिजन्य आहार, अर्थात चारा, है।
- source_word: παντὶ ζῶντι
  choice: हर जीव के लिए
  rationale: यह व्यापक पद सभी जीवित प्राणियों को समेटता है; ‘हर जीव’ सहज और अर्थनिष्ठ है।
theological_decisions:
- issue: वर्षा देने और जीवों को खिलाने के बीच संबंध
  choice: ‘वर्षा देकर’—इसे साधन के रूप में मुख्य पाठ में व्यक्त किया गया
  alternative: ‘जब तू वर्षा देता है’—इसे काल-संबंध के रूप में समझना
  rationale: ἐν τῷ διδόναι σὲ का व्याकरण साधन और काल, दोनों अर्थ दे सकता है। प्रसंग में वर्षा जीवों के आहार की व्यवस्था का साधन है, पर वैकल्पिक कालगत अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल यूनानी के सीधे संबोधन और भजनात्मक निकटता को बनाए रखता है। उद्देश्यसूचक यूनानी रचना को हिन्दी में समन्वित क्रियाओं द्वारा स्वाभाविक बनाया गया है, बिना दैवी पोषण के आशय को संकीर्ण किए।
