base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/001.yaml
  text: O Lord God[a], I will praise your name with exultation, in the midst of those who know your righteous judgments.
translation:
  language: hi
  text: हे प्रभु परमेश्वर, मैं हर्षोल्लास के साथ आपके नाम की स्तुति करूँगा, उन लोगों के बीच जो आपके धर्ममय न्याय-निर्णयों को जानते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε ὁ θεός
  choice: हे प्रभु परमेश्वर
  rationale: प्रत्यक्ष दैवी संबोधन और उसके साथ आए उपाधिसूचक पद को स्वाभाविक, गरिमापूर्ण हिन्दी प्रार्थना-भाषा में रखा गया है।
- source_word: αἰνέσω
  choice: मैं ... स्तुति करूँगा
  rationale: भविष्यकाल वक्ता के संकल्प अथवा घोषणा को व्यक्त करता है; ‘स्तुति करूँगा’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: τῷ ὀνόματί σου
  choice: आपके नाम की
  rationale: यह परमेश्वर के प्रकट व्यक्तित्व और प्रतिष्ठा का परिचित बाइबलीय मुहावरा है; हिन्दी में ‘नाम की स्तुति’ स्वाभाविक है।
- source_word: ἐν ἀγαλλιάσει
  choice: हर्षोल्लास के साथ
  rationale: यह पद आनन्दपूर्ण और उत्सवी रीति बताता है; ‘हर्षोल्लास’ ऊँचे किंतु वर्तमान हिन्दी भाव को बनाए रखता है।
- source_word: ἐν μέσῳ
  choice: के बीच
  rationale: समुदाय के मध्य स्तुति किए जाने का भाव सरल और प्रत्यक्ष रूप में व्यक्त होता है।
- source_word: ἐπισταμένων
  choice: जो ... जानते हैं
  rationale: कृदन्त का मूल अर्थ जानने, समझने या परिचित होने का है; ‘जानते हैं’ संक्षिप्त और स्वाभाविक है।
- source_word: τὰ κρίματά σου τὰ δίκαια
  choice: आपके धर्ममय न्याय-निर्णयों
  rationale: κρίματα के न्यायिक निर्णयों के भाव को ‘न्याय-निर्णय’ स्पष्ट करता है, और δίκαια उनकी धार्मिकता तथा न्यायोचितता को ‘धर्ममय’ द्वारा बनाए रखता है।
theological_decisions:
- issue: दूसरे पुरुष के लिए आदरसूचक रूप
  choice: आपके
  alternative: तेरे
  rationale: ‘आपके’ आधुनिक मानक हिन्दी में श्रद्धापूर्ण और सामान्यतः बोधगम्य दैवी संबोधन है; इससे मूल का अर्थ नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनामय, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘न्याय-निर्णय’ κρίματα के न्यायिक अर्थ को ‘न्याय’ की संभावित अमूर्तता से अधिक स्पष्ट करता है।
