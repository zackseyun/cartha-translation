  yaml_path: translation/deuterocanon/psalms_of_solomon/005/008.yaml
  text: Do not lay your hand heavily upon us, so that we may not sin under compulsion.
translation:
  language: hi
  text: अपना हाथ हम पर भारी न कर, ताकि हम विवश होकर पाप न करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना हाथ हम पर भारी न कर, कहीं ऐसा न हो कि हम आवश्यकता के कारण पाप करें।”
    reason: διʼ ἀνάγκην का अधिक शब्दशः अनुवाद ‘आवश्यकता के कारण’ हो सकता है, और ἵνα μὴ को ‘कहीं ऐसा न हो कि’ भी अनूदित किया जा सकता है।
lexical_decisions:
- source_word: βαρύνῃς
  choice: भारी न कर
  rationale: क्रिया का मूल भाव किसी वस्तु को भारी करना है। यह चयन यूनानी रूपक को बनाए रखता है और आधुनिक हिन्दी में दबाव अथवा कठोर प्रहार का बोध कराता है।
- source_word: τὴν χεῖρά σου
  choice: अपना हाथ
  rationale: ‘हाथ’ के ठोस बिंब को बनाए रखा गया है; बाइबलीय प्रयोग में यह सामर्थ्य अथवा दंड के कार्यान्वयन का भी संकेत दे सकता है।
- source_word: ἐφʼ ἡμᾶς
  choice: हम पर
  rationale: यह हाथ के भारी होने के स्थानिक रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है और अर्थ को केवल शत्रुता तक सीमित नहीं करता।
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: यह आशय अथवा परिणाम को व्यक्त करने वाले आश्रित निषेधात्मक खंड को स्पष्ट और सहज आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: διʼ ἀνάγκην
  choice: विवश होकर
  rationale: यह बाध्यता, दबाव या अपरिहार्यता में किए जाने के भाव को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है, बिना यह तय किए कि विवशता बाहरी है या परिस्थितिजन्य।
- source_word: ἁμάρτωμεν
  choice: हम ... पाप न करें
  rationale: ἵνα μὴ के बाद आए अओरिस्ट सब्जंक्टिव के निषेधात्मक आशय को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दबाव और पाप के बीच संबंध
  choice: ‘ताकि हम विवश होकर पाप न करें’ कहकर मूल पाठ का तनाव बनाए रखा गया है।
  alternative: इसे इस प्रकार स्पष्ट करना कि परमेश्वर मनुष्य को पाप करने के लिए बाध्य करता है या नहीं करता।
  rationale: यूनानी वाक्य कठिन दबाव के अधीन पाप करने की आशंका व्यक्त करता है, पर कारणता और नैतिक उत्तरदायित्व का व्यवस्थित धर्मशास्त्रीय स्पष्टीकरण नहीं देता; इसलिए अनुवाद में वह अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और प्रार्थनात्मक रखी गई है। एकवचन संबोधन में ‘कर’ मूल यूनानी के सीधे संबोधन की निकटता और काव्यात्मक प्रार्थना-शैली को बनाए रखता है; ‘हाथ भारी करना’ मूल बिंब को सुरक्षित रखता है।
