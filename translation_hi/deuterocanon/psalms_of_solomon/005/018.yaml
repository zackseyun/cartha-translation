  footnotes:
  - marker: a
    text: या, “धन्य है वह, जिसकी परमेश्वर उचित मात्रा के संतोष के साथ सुधि लेता है।”
    reason: lexical_alternative
  - marker: b
    text: αὐτάρκεια का अर्थ “संतोष” या, अधिक शाब्दिक रूप में, “आत्मनिर्भरता” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: यह आशीर्वचन का मानक शब्द है और भजन-साहित्य की गरिमा तथा धार्मिक आशय को बनाए रखता है।
- source_word: οὗ
  choice: वह, जिसे
  rationale: सम्बन्धवाचक सर्वनाम यहाँ μνημονεύει के साथ व्यक्ति को सूचित करता है; यह हिन्दी में स्वाभाविक रूप है।
- source_word: μνημονεύει
  choice: स्मरण रखता है
  rationale: यह केवल याद आने के बजाय किसी को ध्यान में रखने और उसकी सुधि लेने के भाव की गुंजाइश बनाए रखता है।
- source_word: ἐν συμμετρίᾳ
  choice: उचित परिमाण में
  rationale: συμμετρία अनुपात, समुचित मात्रा या संतुलित माप को व्यक्त करता है; यह अनावश्यक रूप से 'संयम' का अर्थ आरोपित नहीं करता।
- source_word: αὐταρκίας
  choice: पर्याप्तता
  rationale: यह जरूरत भर होने या पर्याप्त साधन मिलने का भाव देता है, पर मनुष्य की परमेश्वर से स्वतंत्र आत्मनिर्भरता का भ्रामक संकेत नहीं देता।
theological_decisions:
- issue: αὐταρκίας का अर्थ और परमेश्वर के स्मरण से उसका सम्बन्ध
  choice: मुख्य पाठ में इसे 'पर्याप्तता के उचित परिमाण में' रखा गया है, जिससे समुचित पर्याप्तता का अर्थ सामने आता है।
  alternative: इसे भीतरी संतोष या अधिक शाब्दिक रूप से आत्मनिर्भरता समझा जा सकता है।
  rationale: यूनानी पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य अनुवाद पर्याप्तता और उचित माप दोनों को बनाए रखता है, जबकि पादटिप्पणियाँ वैकल्पिक अर्थों को सुरक्षित रखती हैं; इस प्रकार परमेश्वर द्वारा प्रबन्ध का आशय सम्भव रहता है, पर उसे व्याकरण से अधिक निश्चित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भजनात्मक शैली रखी गई है। 'पर्याप्तता' कुछ औपचारिक है, पर यहाँ यूनानी की अर्थगत संक्षिप्तता और अस्पष्टता को 'भरपूर प्रबन्ध' जैसे व्याख्यात्मक विस्तार के बिना बेहतर ढंग से सुरक्षित रखता है।
