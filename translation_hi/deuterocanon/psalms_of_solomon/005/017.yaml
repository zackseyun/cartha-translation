translation:
  language: hi
  text: हे प्रभु, आपकी दया सारी पृथ्वी पर भलाई के साथ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεός
  choice: दया
  rationale: ἔλεος का मुख्य अर्थ दया अथवा करुणामय अनुग्रह है। ‘दया’ सहज, गरिमापूर्ण और सामान्य हिन्दी में स्पष्ट है तथा इसमें ऐसे वाचागत अर्थ नहीं जोड़े गए जो यूनानी शब्द में यहाँ प्रत्यक्ष नहीं हैं।
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: सारी पृथ्वी पर
  rationale: ἐπί के साथ कर्मकारक यहाँ पूरी पृथ्वी पर विस्तार या व्यापकता व्यक्त करता है। ‘सारी पृथ्वी पर’ इस व्यापक दायरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को हिन्दी में स्वाभाविक और औपचारिक प्रत्यक्ष सम्बोधन ‘हे प्रभु’ से व्यक्त किया गया है।
- source_word: ἐν χρηστότητι
  choice: भलाई के साथ
  rationale: χρηστότης भलाई, कृपालुता या दयालु सद्भाव को सूचित करता है। ‘भलाई के साथ’ ἐν की रीति अथवा गुण बताने वाली भूमिका को खुला रखता है और इसे ‘दया’ का केवल पर्याय बनाकर दोहराता नहीं।
- source_word: '[implied copula]'
  choice: है
  rationale: यूनानी वाक्य में क्रिया निहित है। हिन्दी में ‘है’ जोड़ने से न्यूनतम आवश्यक वाक्यगत पूर्ति होती है, बिना दया के फैलने, ठहरने या प्रकट होने जैसी कोई अतिरिक्त व्याख्या जोड़े।
