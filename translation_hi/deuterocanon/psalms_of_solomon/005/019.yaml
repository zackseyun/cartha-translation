lexical_decisions:
- source_word: ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; यहाँ ‘यदि’ स्वाभाविक है और अनावश्यक पुनरावृत्तिमूलक अर्थ नहीं जोड़ता।
- source_word: ὑπερπλεονάσῃ
  choice: आवश्यकता से अधिक हो
  rationale: क्रिया उचित मात्रा से बढ़ जाने या पर्याप्त से अधिक होने का भाव देती है। यह हिन्दी में स्वाभाविक रहते हुए ‘लोभ’ जैसी अधिक व्याख्यात्मक नैतिक धारणा नहीं जोड़ती।
- source_word: ὁ ἄνθρωπος
  choice: किसी मनुष्य
  rationale: यह सामान्य मानवीय कथन है। शर्तसूचक लोकोक्तिपरक वाक्य में ‘किसी मनुष्य’ यूनानी के एकवचन सामान्य प्रयोग को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐξαμαρτάνει
  choice: पाप करता है
  rationale: सन्दर्भ में क्रिया का सीधा नैतिक अर्थ है; यह उसके बल को सरल और स्पष्ट हिन्दी में बनाए रखता है।
theological_decisions:
- issue: क्या अधिकता को ‘लोभ’ या ‘लालच’ कहकर अधिक व्याख्यात्मक बनाया जाए
  choice: अधिक होने और पाप करने के बीच व्यापक कथन को बनाए रखा गया है।
  alternative: यदि कोई मनुष्य लोभी हो, तो वह पाप करता है।
  rationale: यूनानी पाठ अधिकता और पाप का उल्लेख करता है, पर भीतरी प्रेरणा के रूप में लोभ को स्पष्टतः नहीं बताता। इसलिए अनुवाद इस नैतिक तनाव को संकीर्ण किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘आवश्यकता से अधिक’ स्रोत के अतिरेक के भाव को स्पष्ट करता है, पर उसे लोभ या धन-संपत्ति तक सीमित नहीं करता।
