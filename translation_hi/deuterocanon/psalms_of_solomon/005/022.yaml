lexical_decisions:
- source_word: εὐλογημένη
  choice: धन्य हो
  rationale: यह विशेषण यहाँ निहित क्रिया के साथ स्तुतिपरक आशीर्वचन का रूप लेता है; ‘धन्य हो’ उसके मंगलोच्चार और स्तुति—दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δόξα
  choice: महिमा
  rationale: ‘महिमा’ दिव्य तेज, गौरव और स्तुति से जुड़े अर्थ-क्षेत्र को सीधे और प्रचलित धार्मिक हिन्दी में व्यक्त करती है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: यूनानी κύριος का सीधा और स्वाभाविक हिन्दी रूप ‘प्रभु’ है; स्रोत में इब्रानी परमेश्वर-नाम नहीं, बल्कि यूनानी पद है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह अगले वाक्यांश को पहले कथन का कारण बताने वाला बनाता है; ‘क्योंकि’ यूनानी के कारणसूचक संबंध को स्पष्ट रखता है।
- source_word: αὐτὸς
  choice: वही
  rationale: कर्तृवाचक सर्वनाम की बलाघाती भूमिका को ‘वही’ संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, बिना ‘केवल’ जैसी अतिरिक्त अनन्यता जोड़े।
- source_word: βασιλεὺς
  choice: राजा
  rationale: यह मूल पद का सामान्य और सीधा अर्थ है तथा वाक्य की राजकीय स्वीकारोक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: αὐτὸς में बल और संभावित अनन्यता
  choice: वही हमारा राजा है
  alternative: वह स्वयं हमारा राजा है / केवल वही हमारा राजा है
  rationale: ‘वही’ बलाघात को बनाए रखता है, जबकि ‘केवल’ जोड़ने से यूनानी पाठ में स्पष्ट न की गई अनन्यता अधिक दृढ़ हो जाती; ‘वह स्वयं’ हिन्दी में यहाँ अपेक्षाकृत असहज है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण स्तुतिपरक शैली। पद-क्रम को स्वाभाविक हिन्दी के अनुसार रखा गया है और मूल की कारणसूचक तथा बलाघाती संरचना सुरक्षित है।
