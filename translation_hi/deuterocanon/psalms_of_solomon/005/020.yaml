revisions:
- from: धार्मिकता के साथ थोड़ी-सी वस्तु भी पर्याप्त है, और इसी में प्रभु की आशीष है—धार्मिकता में तृप्ति तक।
  to: धार्मिकता के साथ सीमित मात्रा पर्याप्त है, और इसी में प्रभु की आशीष है, जो धार्मिकता में भरपूरी लाती है।
  rationale: The revision replaces the overly concrete “थोड़ी-सी वस्तु” with “सीमित मात्रा” and recasts the final prepositional phrase as a natural Hindi result clause. It preserves the Greek’s sense that the Lord’s blessing associated with a modest portion in righteousness leads to fullness in righteousness, without construing this as a guarantee of material wealth.
