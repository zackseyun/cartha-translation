  text: Enough is a modest portion with righteousness, and in this is the Lord’s blessing—Enough is a modest portion with righteousness, and in this is the Lord’s blessing, for satisfaction in righteousness. in righteousness.
translation:
  language: hi
  text: धार्मिकता के साथ सीमित मात्रा पर्याप्त है, और इसी में प्रभु की आशीष है, जो धार्मिकता में भरपूरी लाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸν
  choice: पर्याप्त है
  rationale: यह शब्द पर्याप्तता या काफ़ी होने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: τὸ μέτριον
  choice: थोड़ी-सी वस्तु
  rationale: μέτριον का अर्थ सीमित, संयमित या साधारण मात्रा है। संदर्भ में आजीविका/हिस्से का संकेत है, पर यूनानी में संज्ञा स्पष्ट नहीं, इसलिए अनावश्यक विशिष्टता नहीं जोड़ी गई।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता के साथ / धार्मिकता में
  rationale: पहले प्रयोग में संगति या परिस्थिति का भाव हिन्दी में 'के साथ' से स्वाभाविक बनता है; अंतिम प्रयोग में यूनानी संरचना के निकट 'में' रखा गया है।
- source_word: εὐλογία Κυρίου
  choice: प्रभु की आशीष
  rationale: Κύριος का मानक हिन्दी रूप 'प्रभु' और εὐλογία का स्वाभाविक धार्मिक रूप 'आशीष' है।
- source_word: εἰς πλησμονὴν
  choice: तृप्ति तक
  rationale: πλησμονή भरपूर होने, पेट भरने या तृप्ति का भाव दे सकता है। यहाँ 'तृप्ति' उस अर्थ को व्यक्त करता है, जबकि 'तक' εἰς की परिणाम/लक्ष्य-दिशा बनाए रखता है।
theological_decisions:
- issue: धार्मिकता और भौतिक पर्याप्तता का संबंध
  choice: पद को सीमित वस्तु के धार्मिकता सहित पर्याप्त होने और प्रभु की आशीष से धार्मिक तृप्ति तक पहुँचने के कथन के रूप में रखा गया है।
  alternative: इसे धार्मिक व्यक्ति को निश्चित भौतिक समृद्धि मिलने की प्रतिज्ञा के रूप में स्पष्ट करना।
  rationale: मूल पाठ 'भरपूर धन' की स्पष्ट प्रतिज्ञा नहीं करता; πλησμονή तृप्ति/परिपूर्णता की ओर संकेत करता है। इसलिए संभावित धार्मिक और भौतिक अर्थ-तनाव को खुला रखा गया है।
- issue: Κυρίου की पहचान
  choice: प्रभु
  alternative: याहवे
  rationale: यूनानी पाठ में Κύριος है, कोई स्पष्ट टेट्राग्राम नहीं; अतः स्रोत-रूप के अनुरूप 'प्रभु' रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। अंग्रेज़ी परामर्श-पाठ में आई अनावश्यक पुनरावृत्ति और विकृत अंतिम वाक्यांश को यूनानी स्रोत के आधार पर नहीं अपनाया गया।
