  text: For if I am hungry[a], I will cry out to you, O God, and you will give to me.
translation:
  language: hi
  text: क्योंकि यदि मैं भूखा हो जाऊँ, तो हे परमेश्वर, मैं तुझे पुकारूँगा, और तू मुझे देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में दी जाने वाली वस्तु नहीं बताई गई है; शाब्दिक अर्थ है, “तू मुझे देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινάσω
  choice: मैं भूखा हो जाऊँ
  rationale: ἐὰν के साथ एओरिस्ट सब्जंक्टिव भविष्य की संभावित स्थिति व्यक्त करता है। ‘भूखा हो जाऊँ’ इस भाव को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: κεκράξομαι
  choice: मैं तुझे पुकारूँगा
  rationale: κράζω में तीव्र पुकार का भाव है। ‘पुकारूँगा’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य संबोधन की अपेक्षा अधिक आग्रह व्यक्त कर सकता है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: रूप की दृष्टि से यह आर्टिकल सहित कर्ताकारक है, पर बाइबलीय यूनानी में यहाँ संबोधन के रूप में प्रयुक्त हुआ है।
- source_word: δώσεις μοι
  choice: तू मुझे देगा
  rationale: यह यूनानी वाक्यांश का सीधा अर्थ रखता है और दी जाने वाली वस्तु को अनकहा छोड़ता है; इस प्रकार मूल की अस्पष्टता सुरक्षित रहती है।
theological_decisions:
- issue: परमेश्वर क्या देगा, यह स्पष्ट नहीं है
  choice: 'मुख्य पाठ में कर्म को अनकहा रखा गया: ‘तू मुझे देगा’'
  alternative: ‘तू मेरे लिए भोजन जुटाएगा’ या ‘तू मेरी आवश्यकता पूरी करेगा’
  rationale: भूख का संदर्भ भोजन अथवा आवश्यकता-पूर्ति का संकेत देता है, किन्तु यूनानी पाठ स्वयं कर्म नहीं बताता। उसे स्पष्ट कर देना मूल की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तू/तुझे’ का प्रयोग प्रार्थनात्मक काव्य में परमेश्वर से निकट, प्रत्यक्ष संबोधन के लिए किया गया है। फुटनोट-चिह्न उसी खंड के बाद रखा गया है जहाँ मूल यूनानी का अनकहा कर्म प्रासंगिक है।
