base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/021.yaml
  text: Those who fear the Lord rejoiced in good things[a], and your goodness is upon Israel[c][b], your kingdom.
translation:
  language: hi
  text: प्रभु का भय माननेवाले अच्छी वस्तुओं से आनन्दित हुए,[a] और तेरे राज्य में तेरी भलाई इस्राएल पर है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भली वस्तुओं के बीच आनन्दित हुए”; अथवा, “आशीषों से आनन्दित किए गए।”
    reason: lexical_alternative
  - marker: b
    text: “तेरे राज्य में” का अर्थ “तेरे शासन के अधीन” भी हो सकता है। यूनानी पदबंध संक्षिप्त है; कुछ लोग इसे इस्राएल को परमेश्वर का राज्य बताने वाले भाव में, “इस्राएल पर—जो तेरा राज्य है,” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ηὐφράνθησαν
  choice: आनन्दित हुए
  rationale: यूनानी रूप व्याकरणतः कर्मवाच्य है और ‘आनन्दित किए गए’ का भाव रख सकता है; हिन्दी में ‘आनन्दित हुए’ परिणाम को स्वाभाविक ढंग से व्यक्त करता है और कर्मवाच्य की छाया भी पूरी तरह मिटाता नहीं।
- source_word: οἱ φοβούμενοι Κύριον
  choice: प्रभु का भय माननेवाले
  rationale: यह पद उन लोगों के वर्ग को दर्शाता है जो परमेश्वर के प्रति श्रद्धापूर्ण भय रखते हैं। ‘भय माननेवाले’ आधुनिक बाइबलीय हिन्दी में स्पष्ट और परिचित है।
- source_word: ἐν ἀγαθοῖς
  choice: अच्छी वस्तुओं से
  rationale: ἀγαθοῖς का अर्थ व्यापक है—अच्छी वस्तुएँ, हितकारी चीजें या आशीषें। ‘अच्छी वस्तुओं से’ मूल की व्यापकता बनाए रखता है और इसे केवल आध्यात्मिक ‘आशीषों’ तक सीमित नहीं करता।
- source_word: χρηστότης
  choice: भलाई
  rationale: यह शब्द भलाई, कृपालुता और उपकारशीलता का व्यापक भाव रखता है; ‘भलाई’ इन अर्थों को बिना अनावश्यक संकुचन के समेटता है।
- source_word: ἐπʼ Ἰσραήλ
  choice: इस्राएल पर
  rationale: ἐπί के साथ कर्मकारक यहाँ भलाई के इस्राएल पर होने या ठहरने का भाव स्वाभाविक रूप से देता है।
- source_word: τῇ βασιλείᾳ σου
  choice: तेरे राज्य में
  rationale: 'दत्तिव रूप को क्षेत्र या परिधि के अर्थ में समझना व्याकरणतः सहज है: परमेश्वर के राज्य अथवा शासन में। पदबंध की संक्षिप्तता के कारण अन्य संबंध भी संभव हैं, जिन्हें पादटिप्पणी में रखा गया है।'
theological_decisions:
- issue: τῇ βασιλείᾳ σου का इस्राएल और परमेश्वर की भलाई से संबंध
  choice: ‘तेरे राज्य में’—राज्य को वह क्षेत्र या व्यवस्था माना गया है जिसमें परमेश्वर की भलाई इस्राएल पर है।
  alternative: इसे ‘इस्राएल के लिए—जो तेरा राज्य है’ या ‘इस्राएल पर, तेरे राज्य के लिए’ के भाव में भी समझा जा सकता है।
  rationale: τῇ βασιλείᾳ σου दत्तिव में है, जबकि Ἰσραήλ ἐπί के कारण कर्मकारक संबंध में है; इसलिए सीधा समानाधिकरण व्याकरणतः कठिन है। फिर भी यूनानी वाक्य अत्यंत संक्षिप्त है और अंतर्निहित संबंध पूरी तरह स्पष्ट नहीं, अतः वैकल्पिक समझ को दबाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में श्रद्धापूर्ण, काव्यात्मक किंतु सरल शैली रखी गई है। संबोधन के लिए ‘तेरे’ का प्रयोग भजन-साहित्य की सीधी प्रार्थनात्मक वाणी के अनुरूप है। ‘अच्छी वस्तुओं’ कुछ हद तक मूर्त और व्यापक रखा गया है ताकि मूल के ἀγαθοῖς को केवल ‘आशीषों’ तक सीमित न किया जाए।
