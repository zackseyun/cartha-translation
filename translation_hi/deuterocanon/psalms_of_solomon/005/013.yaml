    issue: Unwarranted emphasis in “तू ही करता है”
    rationale: The first Greek clause simply states “you nourish/feed”; the explicit excluding force occurs only in “if not you” in the second clause. Removing “ही” more closely preserves the source’s distribution of emphasis.
  - severity: medium
    issue: English audit trail duplicates the nourishment clause
    rationale: The supplied English text repeats “You sustain kings and rulers and peoples, O God,” but the Greek source contains only one τρέφεις clause. The Hindi draft correctly follows the Greek rather than this unsupported English duplication.
