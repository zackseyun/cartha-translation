  verdict: revise
  source_fidelity: 'The Hindi correctly renders the single Greek clause: God nourishes kings, rulers, and peoples, and is the hope of the poor and needy. It appropriately does not reproduce the unsupported duplicated clause in the English audit trail. However, “तू ही” in the first clause adds an exclusivity/emphasis not explicitly present with τρέφεις; the Greek’s exclusivity is expressed in the later “εἰ μὴ σύ” question.'
  naturalness: The register is natural, dignified, and prayerful modern Hindi. Direct singular address (“तू/तेरे”) is suitable in this devotional context.
  terminology: “पालन-पोषण” suitably conveys τρέφεις; “राजाओं, शासकों और लोगों” preserves the three groups; “दीन तथा दरिद्र” retains the paired terms πτωχός and πένης; and “परमेश्वर”/“प्रभु” preserves the two distinct divine addresses.
  issues:
