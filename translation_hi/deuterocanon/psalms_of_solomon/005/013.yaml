base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/013.yaml
  text: You feed kings and rulers and peoples, O God; and You sustain kings and rulers and peoples, O God; and who is the hope of the poor and needy, if not you, Lord?
translation:
  language: hi
  text: हे परमेश्वर, तू राजाओं, शासकों और लोगों का पालन-पोषण करता है; और दीन तथा दरिद्र की आशा तेरे सिवा और कौन है, हे प्रभु?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρέφεις
  choice: पालन-पोषण करता है
  rationale: ग्रीक क्रिया का मूल अर्थ खिलाना या पोषण करना है। ‘पालन-पोषण’ भोजन देने के साथ जीवन बनाए रखने का व्यापक भाव भी स्वाभाविक हिन्दी में व्यक्त करता है, पर स्रोत में न पाए जाने वाले दोहराव को नहीं जोड़ता।
- source_word: βασιλεῖς καὶ ἄρχοντας καὶ λαούς
  choice: राजाओं, शासकों और लोगों
  rationale: तीनों समानांतर समूहों को स्पष्ट और निकट-औपचारिक रूप में सुरक्षित रखा गया है। λαούς के बहुवचन को ‘लोगों’ से व्यक्त किया गया है।
- source_word: πτωχοῦ καὶ πένητος
  choice: दीन और दरिद्र की
  rationale: 'दोनों निकटार्थक शब्दों का भेद यथासंभव बनाए रखा गया है: πτωχός अत्यंत अभावग्रस्त/दीन व्यक्ति और πένης सीमित साधनों वाले निर्धन व्यक्ति की ओर संकेत करता है।'
- source_word: ἡ ἐλπὶς τίς ἐστιν εἰ μὴ σύ
  choice: आशा तेरे सिवा और कौन है
  rationale: ग्रीक का प्रश्नवाचक बल और प्रत्यक्ष द्वितीय-पुरुष संबोधन बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: ὁ θεός / Κύριε
  choice: हे परमेश्वर / हे प्रभु
  rationale: दो अलग संबोधनों को अलग हिन्दी पदों से व्यक्त किया गया है; Κύριε को यहाँ सामान्य संबोधन ‘प्रभु’ रखा गया है।
theological_decisions:
- issue: ईश्वर द्वारा सभी सामाजिक स्तरों के पोषण और निर्धनों की आशा होने का संबंध
  choice: दोनों कथनों को उसी एक परमेश्वर को संबोधित रखते हुए बिना अतिरिक्त व्याख्या के प्रस्तुत किया गया है।
  alternative: ‘पालन-पोषण’ को केवल ‘भोजन देता है’ या स्वतंत्र रूप से ‘संभालता है’ कहना।
  rationale: τρέφεις एक ही क्रिया है; स्रोत में अंग्रेज़ी परामर्श-पाठ जैसा दुहरा कथन नहीं है। अनुवाद मूल यूनानी की एकवाक्यता और उसके धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। ईश्वर के लिए निकट संबोधन ‘तू/तेरे’ रखा गया है, क्योंकि यूनानी में एकवचन प्रत्यक्ष संबोधन है और हिन्दी भक्ति-काव्य में यह स्वाभाविक है। कोई पादटिप्पणी आवश्यक नहीं।
