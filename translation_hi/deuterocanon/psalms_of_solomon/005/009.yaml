  yaml_path: translation/deuterocanon/psalms_of_solomon/005/009.yaml
  text: And if you do not turn us back[a], we will not keep away[c][b], but we will come to you.
translation:
  language: hi
  text: और यदि तू हमें न लौटाए[a], तो हम दूर नहीं रहेंगे[b], बल्कि तेरे पास आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें वापस न मोड़े” अथवा “हमें फिर से स्थापित न करे।”
    reason: क्रिया लौटाने, वापस फेरने या पुनःस्थापित करने का भाव दे सकती है।
  - marker: b
    text: या, “हम अपने को अलग नहीं रखेंगे” अथवा “हम पीछे नहीं हटेंगे।”
    reason: यूनानी अभिव्यक्ति का अर्थ दूर रहने, अपने को अलग रखने या पीछे हटने से हो सकता है।
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: यदि ... न
  rationale: नकार सहित शर्त को सीधे रूप में रखा गया है; इससे मूल की स्पष्ट सशर्त विनती बनी रहती है।
- source_word: ἐπιστρέψῃς
  choice: हमें न लौटाए
  rationale: ἐπιστρέφω के लौटाने या वापस फेरने के दिशात्मक भाव को सुरक्षित रखता है और ‘मन-परिवर्तन कराए’ जैसे अधिक धर्मशास्त्रीय अर्थ को आरोपित नहीं करता। हिंदी में ‘लौटाए’ पुनःस्थापन का भाव भी ग्रहण कर सकता है।
- source_word: ἡμᾶς
  choice: हमें
  rationale: प्रथम पुरुष बहुवचन कर्म का सीधा और स्वाभाविक अनुवाद।
- source_word: οὐκ ἀφεξόμεθα
  choice: हम दूर नहीं रहेंगे
  rationale: मध्यवाच्य रूप में अपने को अलग या दूर रखने का भाव है। यह अनुवाद अगले विरोधी वाक्यांश ‘तेरे पास आएँगे’ के साथ स्वाभाविक संबंध बनाता है।
- source_word: ἀλλʼ
  choice: बल्कि
  rationale: यह पहले कथन का स्पष्ट प्रतिलोम प्रस्तुत करता है और हिंदी में काव्यात्मक किंतु सहज है।
- source_word: ἐπὶ σὲ ἥξομεν
  choice: तेरे पास आएँगे
  rationale: ἥκω के आने या पहुँचने के भाव तथा परमेश्वर की ओर व्यक्तिगत गमन—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: क्या ἐπιστρέψῃς को स्पष्ट रूप से मन-परिवर्तन या आत्मिक पुनःस्थापन की भाषा में अनूदित किया जाए
  choice: हमें न लौटाए
  alternative: हमें फिर से स्थापित न करे; हमें वापस न मोड़े; हमारा मन न फेरे
  rationale: यूनानी क्रिया वापसी या पुनःस्थापन का भाव दे सकती है, पर यहाँ वह किसी एक विशिष्ट धर्मशास्त्रीय अर्थ को अनिवार्य नहीं करती। ‘लौटाए’ मूल की दिशात्मकता और अर्थगत खुलापन दोनों बनाए रखता है।
- issue: परमेश्वर के लिए संबोधन-सर्वनाम
  choice: तू / तेरे
  alternative: आप / आपके
  rationale: भजनात्मक प्रार्थना की निकटता और पारंपरिक हिंदी बाइबिलीय शैली को बनाए रखने के लिए एकवचन आत्मीय संबोधन चुना गया है; इसका आशय अनादर नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और भजनात्मक गरिमा वाली रखी गई है। ‘तू/तेरे’ परमेश्वर से प्रार्थनापूर्ण निकट संबोधन को व्यक्त करता है। वाक्य की मूल तनावपूर्ण तर्क-रचना—यदि परमेश्वर न लौटाए, तब भी वक्ता उससे दूर न रहकर उसके पास आएँगे—को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
