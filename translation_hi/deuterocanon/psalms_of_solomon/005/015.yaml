- source_word: ἐν φειδῷ
  choice: किफ़ायत से होती है
  rationale: वाक्यांश सीमित मात्रा या बचाकर देने का भाव रखता है। ‘किफ़ायत से’ इसे ‘कंजूसी’ जैसी अधिक कठोर नैतिक व्याख्या दिए बिना व्यक्त करता है।
- source_word: αὔριον
  choice: कल के लिए टलती है
  rationale: मूल में केवल संक्षिप्त क्रियाविशेषण ‘कल’ है और वाक्य अंडाकार है। हिन्दी में अर्थगम्यता के लिए ‘टलती है’ जोड़ा गया है, पर विलंब के भाव को पादटिप्पणी में अनिश्चित रखा गया है।
- source_word: δευτερώσῃ
  choice: उसे दूसरी बार करे
  rationale: क्रिया का सीधा अर्थ किसी काम को दूसरी बार करना है। ‘उसे दूसरी बार करे’ निहित भलाई के कार्य की ओर संकेत करता और पुनरावृत्ति को स्पष्ट रखता है।
- source_word: γογγυσμοῦ
  choice: कुड़कुड़ाए
  rationale: यह अनिच्छापूर्ण बड़बड़ाहट या शिकायत का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: θαυμάσεις
  choice: तुम अचम्भा करोगे
  rationale: द्वितीय पुरुष एकवचन भविष्यकाल को सीधे रखा गया है और कहावत की गरिमामय शैली भी बनी रहती है।
