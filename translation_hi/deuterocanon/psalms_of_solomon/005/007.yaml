lexical_decisions:
- source_word: ἐν τῷ θλίβεσθαι ἡμᾶς
  choice: जब हम दुःख में दबाए जाते हैं
  rationale: ἐν के साथ आर्टिक्युलर इनफिनिटिव यहाँ समयसूचक है। θλίβεσθαι का कर्मवाच्य रूप दुःख, दबाव या क्लेश सहने का भाव रखता है; यह अनुवाद उस भार को बनाए रखते हुए किसी खास प्रकार के उत्पीड़न को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπικαλεσόμεθα
  choice: हम ... पुकारेंगे
  rationale: भविष्यत् मध्यम रूप परमेश्वर से प्रत्यक्ष सहायता माँगने को व्यक्त करता है। ‘पुकारेंगे’ आधुनिक हिन्दी में स्वाभाविक और प्रार्थनापरक है।
- source_word: εἰς βοήθειαν
  choice: सहायता के लिए
  rationale: यह पदबंध पुकारने का उद्देश्य बताता है; ‘सहायता के लिए’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: οὐκ ἀποστρέψῃ
  choice: नहीं ठुकराएगा
  rationale: ἀποστρέφω का मूल बिंब ‘फेर देना’ है, पर विनती को कर्म के रूप में लेकर हिन्दी में ‘विनती को नहीं ठुकराएगा’ अधिक स्वाभाविक ढंग से अस्वीकार न करने का आशय देता है।
- source_word: τὴν δέησιν ἡμῶν
  choice: हमारी विनती
  rationale: δέησις सामान्य प्रार्थना से अधिक किसी आवश्यकता से उपजी गंभीर याचना को दर्शाता है। ‘विनती’ साधारण पाठक के लिए सहज है और उस आग्रह को सुरक्षित रखती है।
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν εἶ
  choice: क्योंकि तू हमारा परमेश्वर है
  rationale: ὅτι प्रार्थना में भरोसे का कारण देता है। ‘क्योंकि’ इस कारण-संबंध को स्पष्ट रखता है, और ‘तू’ प्रत्यक्ष प्रार्थना के एकवचन संबोधन को बनाए रखता है।
