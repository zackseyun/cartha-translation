translation:
  language: hi
  text: हे प्रभु, आपकी दया आपके हाथों के कार्यों पर सदा बनी रहती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में स्पष्ट करने के लिए ‘हे प्रभु’ चुना गया है।
- source_word: τὸ ἔλεός σου
  choice: आपकी दया
  rationale: ἔλεος यहाँ परमेश्वर की करुणामय दया को व्यक्त करता है; ‘दया’ संक्षिप्त, सहज और अर्थानुकूल है।
- source_word: ἐπὶ
  choice: पर ... बनी रहती है
  rationale: ἐπὶ के स्थानगत रूपक—दया का किसी पर होना या ठहरना—को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὰ ἔργα τῶν χειρῶν σου
  choice: आपके हाथों के कामों
  rationale: यह अनुवाद यूनानी की ठोस मानवरूपी छवि को बनाए रखता है और इसे केवल ‘सृष्टि’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह पदबंध निरंतर और अनंत अवधि बताता है; ‘सदा’ काव्यात्मक, वर्तमान और सहज हिन्दी है।
theological_decisions:
- issue: क्या τὰ ἔργα τῶν χειρῶν σου को स्पष्ट रूप से ‘आपकी सृष्टि’ कहा जाए
  choice: आपके हाथों के कामों
  alternative: आपकी रचना / आपके हाथों की बनाई हुई वस्तुओं
  rationale: मूल यूनानी ‘कामों’ और ‘हाथों’ की छवि रखता है और केवल सृजित जगत तक अर्थ को स्पष्टतः सीमित नहीं करता; अतः मूल की व्यापकता और काव्यात्मक तनाव बनाए रखा गया है।
- issue: ἐπὶ को स्थिर अवस्था या सक्रिय दिशा के रूप में समझना
  choice: पर सदा बनी रहती है
  alternative: पर सदा है / की ओर सदा रहती है
  rationale: यह चयन दया के हाथों के कामों पर टिके रहने का स्थानगत रूपक स्पष्ट करता है, पर उसे किसी विशिष्ट सिद्धान्तगत अर्थ में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भजन-सुलभ, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। सम्मानसूचक ‘आप’ का प्रयोग किया गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि वैकल्पिक अर्थों को मुख्य पाठ स्वाभाविक रूप से समेटता है।
