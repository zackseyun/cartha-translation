translation:
  language: hi
  text: 'हमारा परमेश्वर महान और महिमामय है,

    जो सर्वोच्च स्थानों में निवास करता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊँचे स्थानों में” अथवा “सबसे ऊँचे स्वर्गों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: महान
  rationale: यह मूल विशेषण के व्यापक अर्थ को बनाए रखता है और स्तुति के संदर्भ में स्वाभाविक है; ‘सामर्थी’ कहने से बल या शक्ति का भाव अनावश्यक रूप से प्रमुख हो जाता।
- source_word: ἔνδοξος
  choice: महिमामय
  rationale: यह परमेश्वर की महिमा से युक्त होने का भाव स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है तथा केवल मानवीय ‘सम्मानित’ होने तक अर्थ को सीमित नहीं करता।
- source_word: ἐν ὑψίστοις
  choice: ऊँचे स्थानों में
  rationale: यूनानी बहुवचन पदबंध के स्थान-संबंधी बिंब को सुरक्षित रखता है और मूल में स्पष्ट रूप से न आए ‘स्वर्ग’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: κατοικῶν
  choice: निवास करता है
  rationale: वर्तमान कृदंत से व्यक्त निरंतर वास को आधुनिक, स्वाभाविक और श्रद्धापूर्ण हिन्दी में प्रकट करता है।
theological_decisions:
- issue: ἐν ὑψίστοις में परमेश्वर के निवास का स्थान
  choice: मुख्य पाठ में ‘ऊँचे स्थानों में’
  alternative: ‘सर्वोच्च स्थानों में’ अथवा ‘सबसे ऊँचे स्वर्गों में’
  rationale: मूल यूनानी ऊँचे अथवा सर्वोच्च स्थानों का संकेत देता है, पर ‘स्वर्गों’ को स्पष्ट नहीं करता; इसलिए अनिश्चितता मुख्य पाठ और पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण स्तुतिपरक रूप। पदक्रम को हिन्दी में स्वाभाविक बनाया गया है, जबकि यूनानी के ऊर्ध्व स्थान-संबंधी बिंब और उसकी अस्पष्टता को बनाए रखा गया है।
