  text: May God purify Israel for a day of mercy in blessing[e][d][c][b][a], for a day of choosing in the raising up of his Messiah.
translation:
  language: hi
  text: परमेश्वर इस्राएल को आशीष सहित दया के दिन के लिए, और अपने मसीह को ऊपर उठाने में चयन के दिन के लिए शुद्ध करे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चुने जाने के दिन।”
    reason: lexical_alternative
  - marker: b
    text: “अपने मसीह को ऊपर उठाने में” का अर्थ “अपने मसीह के ऊँचा किए जाने में” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρίσαι
  choice: शुद्ध करे
  rationale: यह रूप यहाँ ὁ θεός को कर्ता और Ἰσραήλ को कर्म मानते हुए इच्छा या प्रार्थना व्यक्त करता है। ‘शुद्ध करे’ धार्मिक और नैतिक शुद्धि—दोनों की संभावना बनाए रखता है।
- source_word: Ἰσραήλ
  choice: इस्राएल को
  rationale: वाक्य-विन्यास में ὁ θεός कर्ता है और अविकारी Ἰσραήλ सकर्मक क्रिया का स्वाभाविक कर्म है; इसलिए इसे ‘इस्राएल का परमेश्वर’ नहीं बनाया गया।
- source_word: εἰς ἡμέραν ἐλέους ἐν εὐλογίᾳ
  choice: आशीष के साथ दया के दिन के लिए
  rationale: εἰς का भाव आने वाले दिन की ओर तैयारी या अभिमुखता का है, जबकि ἐν εὐλογίᾳ साथ रहने वाली परिस्थिति या रीति को व्यक्त कर सकता है।
- source_word: εἰς ἡμέραν ἐκλογῆς
  choice: चुने जाने के दिन के लिए
  rationale: ἐκλογή चयन या चुनाव को दर्शाता है। ‘चुने जाने’ से आधुनिक हिन्दी में राजनीतिक चुनाव का अनचाहा अर्थ घटता है और दैवी चयन का भाव स्पष्ट रहता है।
- source_word: ἐν ἀνάξει χριστοῦ αὐτοῦ
  choice: अपने मसीह के उठाए जाने के समय
  rationale: ἀνάξις ऊपर उठाने या प्रतिष्ठित करने का भाव रखता है। ‘उठाए जाने’ से मूल की क्रियात्मक छवि बनी रहती है और केवल एक विशिष्ट प्रकार की राजकीय महिमा तक अर्थ सीमित नहीं होता।
- source_word: χριστοῦ αὐτοῦ
  choice: अपने मसीह के
  rationale: यहाँ χριστός अभिषिक्त व्यक्ति की उपाधि है; ‘मसीह’ यहूदी मसीहाई संदर्भ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: Ἰσραήλ का वाक्यगत कार्य
  choice: 'इसे क्रिया का कर्म माना गया: ‘परमेश्वर इस्राएल को शुद्ध करे।’'
  alternative: ‘इस्राएल का परमेश्वर हमें शुद्ध करे।’
  rationale: ὁ θεός स्पष्ट कर्ता है और Ἰσραήλ को कर्म मानने पर सकर्मक क्रिया को बिना कोई शब्द जोड़े पूरा अर्थ मिलता है। वैकल्पिक पाठ के लिए ‘हमें’ जोड़ना पड़ता और Ἰσραήλ को अप्रकट संबंधकारक मानना पड़ता।
- issue: καθαρίσαι की प्रार्थनात्मक शक्ति
  choice: इच्छासूचक ‘शुद्ध करे’
  alternative: उद्देश्यसूचक ‘शुद्ध करना’
  rationale: इस काव्यात्मक संदर्भ में रूप को तृतीय पुरुष इच्छा/प्रार्थना के रूप में पढ़ना पूर्ण और स्वाभाविक वाक्य देता है; हिन्दी में ‘करे’ उस विनती को संक्षेप में व्यक्त करता है।
- issue: ἀνάξει का मसीहाई अर्थ
  choice: ‘उठाए जाने’ की खुली क्रियात्मक छवि रखी गई।
  alternative: ‘महिमामंडन’ या ‘ऊँचा किए जाने’ के रूप में स्पष्ट करना।
  rationale: मूल शब्द ऊर्ध्वगमन या ऊँचा उठाने का संकेत देता है, पर उसका ठीक प्रकार नहीं बताता। अनुवाद इस घटना को पुनरुत्थान, राजकीय प्रतिष्ठापन या किसी एक सिद्धान्त तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। वाक्य मूल यूनानी की समानांतर संरचना को बनाए रखता है, पर ‘आशीष के साथ’ और ‘के समय’ जैसे स्वाभाविक हिन्दी प्रयोगों से अर्थ को सहज बनाया गया है।
