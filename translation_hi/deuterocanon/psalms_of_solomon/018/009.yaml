  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, बाइबिलीय किंतु सामान्य पाठक के लिए सुबोध रूप। समानांतर यूनानी अनन्त क्रियाओं को हिन्दी में ‘दिखाए’ और ‘करे’ से जोड़ा गया है।
