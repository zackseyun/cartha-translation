lexical_decisions:
- source_word: κατευθῦναι
  choice: सीधा मार्ग दिखाए
  rationale: यह क्रिया किसी को उचित दिशा में ले जाने और उसका मार्ग सीधा करने का भाव रखती है; यह हिन्दी प्रयोग नैतिक निर्देशन और ‘सीधा करने’ दोनों रंगों को व्यक्त करता है।
- source_word: ἄνδρας
  choice: पुरुषों
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है; प्रसंग इसे स्पष्ट रूप से सर्वसमावेशी मानवता के अर्थ में बाध्य नहीं करता, इसलिए लिंगयुक्त रूप रखा गया है।
- source_word: ἐν ἔργοις δικαιοσύνης
  choice: धार्मिकता के कामों में
  rationale: यह अनुवाद ἔργοις के ठोस ‘कामों’ और δικαιοσύνης के नैतिक-धार्मिक ‘धार्मिकता’ भाव, दोनों को बनाए रखता है।
- source_word: φόβῳ θεοῦ
  choice: परमेश्वर के भय में
  rationale: करण/क्षेत्रसूचक दत्तिव को बाइबिलीय मुहावरे के रूप में रखा गया है; इसका आशय केवल भावनात्मक डर तक सीमित नहीं किया गया।
- source_word: καταστῆσαι
  choice: खड़ा करे
  rationale: क्रिया के मूलतः किसी को स्थापित या सामने खड़ा करने के व्यापक भाव को यहाँ सजीव और अपेक्षाकृत औपचारिक रूप में रखा गया है।
- source_word: ἐνώπιον Κυρίου
  choice: प्रभु के सामने
  rationale: यह वाक्यांश का सीधा, स्वाभाविक हिन्दी रूप है और उपस्थिति में होने का भाव भी बनाए रखता है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस नैतिक-भक्तिपरक प्रसंग में ‘धार्मिकता’ व्यापक उचित आचरण को व्यक्त करती है; फिर भी ‘न्याय’ इसका एक वास्तविक शाब्दिक अर्थ हो सकता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
