  text: under the rod of discipline of the Lord's Messiah[a], in the fear of his God, in wisdom of spirit and righteousness and strength[d][c][b];
translation:
  language: hi
  text: प्रभु के मसीह[a] के अनुशासन की छड़ी के अधीन, अपने परमेश्वर के भय में, आत्मा की बुद्धि[b], धार्मिकता[c] और सामर्थ्य में;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘मसीह प्रभु’ या ‘प्रभु का अभिषिक्त जन’ भी समझा जा सकता है; यूनानी में संबंधकारक शब्द बहुत सघन रूप से जुड़े हैं।
    reason: alternative_reading
  - marker: b
    text: या, ‘आत्मा की ओर से मिलने वाली बुद्धि’; यहाँ ‘आत्मा’ से परमेश्वर की आत्मा भी अभिप्रेत हो सकती है।
    reason: lexical_alternative
  - marker: c
    text: ‘धार्मिकता’ का अनुवाद यहाँ ‘न्याय’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥάβδον
  choice: दंड
  rationale: ῥάβδος का अर्थ छड़ी, लाठी या राजदंड हो सकता है। παιδείας के साथ यहाँ सुधारात्मक अनुशासन प्रमुख है; इसलिए ‘दंड’ उस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, बिना राजकीय अर्थ को अनावश्यक रूप से उभारने के।
- source_word: παιδείας
  choice: अनुशासन
  rationale: παιδεία में शिक्षा, प्रशिक्षण और सुधारात्मक ताड़ना सम्मिलित हो सकती है। ῥάβδον के साथ ‘अनुशासन’ उपयुक्त व्यापकता बनाए रखता है।
- source_word: χριστοῦ
  choice: मसीह
  rationale: यहाँ χριστός पदवी के रूप में प्रयुक्त है; ‘मसीह’ उसके यहूदी अभिषिक्त-राजा संबंधी अर्थ को बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु के
  rationale: सघन संबंधकारक पदबंध χριστοῦ κυρίου को मुख्य पाठ में ‘प्रभु के मसीह’ के रूप में रखा गया है, जो दोनों पदों और उनके पारस्परिक संबंध को सुरक्षित रखता है।
- source_word: φόβῳ
  choice: भय
  rationale: परमेश्वर-संबंधी संदर्भ में इसमें श्रद्धा और विस्मय का भाव है, फिर भी ‘भय’ मूल शब्द की गंभीरता और बाइबिलीय भाषा को अधिक सीधे रखता है।
- source_word: θεοῦ αὐτοῦ
  choice: अपने परमेश्वर
  rationale: αὐτοῦ के स्पष्ट संबंध को सुरक्षित रखते हुए हिन्दी में कर्ता की ओर लौटने वाला स्वाभाविक रूप ‘अपने परमेश्वर’ है।
- source_word: σοφίᾳ
  choice: बुद्धि
  rationale: σοφία का सामान्य और संदर्भानुकूल हिन्दी रूप ‘बुद्धि’ है।
- source_word: πνεύματος
  choice: आत्मा
  rationale: बिना लेख के πνεύματος को मुख्य पाठ में तटस्थ ‘आत्मा’ रखा गया है; यह मानवीय आत्मा या परमेश्वर के आत्मा में से किसी एक को अनिवार्य रूप से निश्चित नहीं करता।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: δικαιοσύνη के नैतिक गुण वाले अर्थ को ‘धार्मिकता’ सुरक्षित रखता है; ‘न्याय’ भी प्रसंगानुसार संभव है।
- source_word: ἰσχύος
  choice: सामर्थ्य
  rationale: ἰσχύς शक्ति या बल का द्योतक है; इस गुण-सूची में ‘सामर्थ्य’ गरिमापूर्ण और स्वाभाविक है।
theological_decisions:
- issue: χριστοῦ κυρίου का संबंध
  choice: प्रभु के मसीह
  alternative: मसीह प्रभु; प्रभु का अभिषिक्त जन
  rationale: सघन यूनानी संबंधकारक रचना एक से अधिक व्याकरणिक प्रस्तुति की अनुमति देती है। मुख्य पाठ सर्वाधिक संभावित संबंध को रखता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता बताती है।
- issue: πνεύματος का आशय
  choice: आत्मा
  alternative: पवित्र आत्मा/परमेश्वर का आत्मा
  rationale: यूनानी पाठ स्पष्ट रूप से पवित्र आत्मा का निर्देश नहीं करता। इसलिए मुख्य पाठ में अधिक संयत रूप रखा गया है और संभावित दिव्य संदर्भ पादटिप्पणी में बताया गया है।
- issue: δικαιοσύνης का अर्थक्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ गुणों की सूची नैतिक अर्थ की ओर झुकती है, पर न्याय-संबंधी अर्थ को पूरी तरह नकारा नहीं जा सकता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, शास्त्रीय किंतु सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। पद मूल पाठ की तरह एक बड़े वाक्य का खंड है, इसलिए अंत में अर्धविराम रखा गया है। ‘अनुशासन-दंड’ ῥάβδον παιδείας की संयुक्त सुधारात्मक छवि को संक्षेप में व्यक्त करता है।
