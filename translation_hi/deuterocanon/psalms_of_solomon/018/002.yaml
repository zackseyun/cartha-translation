  yaml_path: translation/deuterocanon/psalms_of_solomon/018/002.yaml
  text: Your kindness is upon Israel like a rich gift[a]; your eyes look upon them[c][b], and none of them will be lacking.
translation:
  language: hi
  text: तेरी भलाई इस्राएल पर एक भरपूर भेंट के समान है[a]; तेरी आँखें उन पर लगी हैं, और उनमें से कोई अभाव में न रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक भरपूर भेंट के साथ।” यूनानी पदबंध संक्षिप्त है; इसलिए भेंट के साथ तुलना या उसके माध्यम/संगति का संबंध, दोनों सम्भव हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके बीच कोई कमी न होगी।”
    reason: alternative_reading
lexical_decisions:
- source_word: χρηστότης
  choice: भलाई
  rationale: यह शब्द सक्रिय भलाई, कृपालुता या दयालुता का भाव रखता है। ‘भलाई’ मूल अर्थ की व्यापकता बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: δόματος πλουσίου
  choice: एक बहुमूल्य भेंट
  rationale: δόμα का अर्थ ‘भेंट/दान’ है, न कि δῶμα अर्थात ‘छत/घर’। πλουσίου यहाँ भेंट की प्रचुरता या मूल्यवान प्रकृति व्यक्त करता है; ‘बहुमूल्य भेंट’ हिन्दी में स्वाभाविक काव्यात्मक रूप है।
- source_word: ἐπὶ Ἰσραήλ
  choice: इस्राएल पर
  rationale: ἐπί के स्थानिक/विस्तारसूचक भाव को सीधे बनाए रखता है और भलाई के इस्राएल पर होने की छवि सुरक्षित रखता है।
- source_word: ἐπιβλέποντες
  choice: लगी रहती हैं
  rationale: कृदन्त का संबंध ‘आँखों’ से है और वह लगातार ध्यान से देखने का भाव देता है। यह रूप दृश्य बिंब को बनाए रखता है, जबकि ‘रक्षा करती हैं’ अनावश्यक व्याख्या जोड़ता।
- source_word: οὐχ ὑστερήσει ἐξ αὐτῶν
  choice: उनमें से कोई अभाव में न रहेगा
  rationale: ὑστερέω का अर्थ कमी में होना या वंचित रहना हो सकता है। यह अनुवाद बहुवचन समूह में से किसी के अभावग्रस्त न रहने का सम्भावित आशय स्पष्ट करता है, बिना परमेश्वर को अनकहा व्याकरणिक कर्ता बनाए।
theological_decisions:
- issue: अंतिम उपवाक्य का कर्ता और आशय
  choice: इसे इस्राएल के लोगों में से किसी के अभाव में न रहने के कथन के रूप में प्रस्तुत किया गया है।
  alternative: ‘उनके बीच कोई कमी न होगी’; अथवा कम सम्भावना से, ‘वह उनमें से किसी को निराश न करेगा।’
  rationale: यूनानी वाक्य संक्षिप्त और कुछ हद तक अध्याहृत है। αὐτῶν समूह की ओर संकेत करता है और ὑστερέω अभाव में होने का अर्थ दे सकता है; इसलिए मुख्य पाठ सम्भावित व्यक्तिगत आशय रखता है और पादटिप्पणी निर्वैयक्तिक विकल्प बचाती है।
- issue: ἐπὶ δόματος πλουσίου में तुलना का संबंध
  choice: ‘एक बहुमूल्य भेंट के समान’
  alternative: ‘एक भरपूर भेंट के साथ’
  rationale: दोहराए गए ἐπί और संक्षिप्त काव्यात्मक रचना के कारण संबंध पूरी तरह स्पष्ट नहीं है। तुलना वाला रूप अंग्रेज़ी परामर्श-पाठ के संशोधित निर्णय से मेल खाता है और हिन्दी में अर्थपूर्ण है, पर वैकल्पिक साधन/संगति का भाव पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। परमेश्वर को संबोधन में ‘तेरी’ मूल के एकवचन निकट संबोधन को दर्शाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
