lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह अभिव्यक्ति यूनानी शब्द के आशीषपूर्ण, स्तुतिपरक अर्थ को बनाए रखती है और हिंदी में स्वाभाविक धर्मग्रंथीय भाषा है।
- source_word: οἱ γενόμενοι
  choice: वे जो ... होंगे
  rationale: γίνομαι के व्यापक अर्थ ‘होना/अस्तित्व में आना’ को बनाए रखा गया है; इसे केवल ‘जन्म लेनेवाले’ तक सीमित नहीं किया गया।
- source_word: ἐν ἡμέραις ἐκείναις
  choice: उन दिनों में
  rationale: यह समय-सूचक पद का सीधा, परिचित और स्वाभाविक हिंदी रूप है।
- source_word: ἰδεῖν
  choice: देखेंगे
  rationale: हिंदी वाक्य-विन्यास में infinitive के आशय को भविष्यकालीन समन्वित क्रिया से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: τὰ ἀγαθὰ
  choice: भले कामों
  rationale: शाब्दिक ‘भली वस्तुएँ’ हिंदी में अस्वाभाविक है; अगले पद ἃ ποιήσει (‘जिन्हें वह करेगा’) के साथ ‘भले काम’ व्यापक अर्थ को पर्याप्त रूप से रखते हुए सहज बैठता है। वैकल्पिक ‘आशीषें’ को पादटिप्पणी में रखा गया है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: 'संबंधवाचक यूनानी रचना को हिंदी में कर्ता के रूप में पुनर्गठित किया गया है: ये वे भले काम हैं जिन्हें प्रभु करेगा।'
- source_word: ἃ ποιήσει
  choice: जिन्हें ... करेगा
  rationale: सापेक्ष उपवाक्य और प्रभु की भावी क्रियाशीलता सीधे रूप में सुरक्षित हैं।
- source_word: γενεᾷ τῇ ἐρχομένῃ
  choice: आनेवाली पीढ़ी के लिए
  rationale: यह भावी पीढ़ी तथा उसके हित में होनेवाले कार्य—दोनों को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: οἱ γενόμενοι का आशय
  choice: वे जो उन दिनों में होंगे
  alternative: वे जो उन दिनों में जन्म लेंगे / उन दिनों में जीवित रहनेवाले
  rationale: यूनानी कृदंत जन्म, अस्तित्व में आने या उस समय उपस्थित होने का व्यापक भाव दे सकता है। मुख्य पाठ में व्यापकता रखी गई है और अधिक विशिष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: τὰ ἀγαθὰ का स्वरूप
  choice: भले काम
  alternative: भली वस्तुएँ / आशीषें
  rationale: पाठ यह निर्धारित नहीं करता कि ये केवल आत्मिक आशीषें हैं। ‘भले काम’ ποιήσει के साथ स्वाभाविक है, जबकि पादटिप्पणी मूल पद की व्यापक वैकल्पिक समझ सुरक्षित रखती है।
