  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। यूनानी वाक्य की अस्पष्टताओं को मुख्य पाठ में अनावश्यक रूप से संकीर्ण नहीं किया गया; जहाँ स्वाभाविक हिंदी के लिए पुनर्गठन आवश्यक था, वहाँ विकल्प पादटिप्पणियों में सुरक्षित रखे गए हैं।
