  text: And your love is upon the offspring of Abraham, the sons of Israel. Your discipline is upon us as upon a firstborn, an only son,
translation:
  language: hi
  text: अब्राहम के वंश—इस्राएल के पुत्रों—पर आपका प्रेम है। आपका अनुशासन हम पर वैसा है, जैसा कि पहलौठे, इकलौते पुत्र पर होता है,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
