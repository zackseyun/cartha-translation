    reason: दोनों विशेषणों का साथ आना हिन्दी पाठक को असामान्य लग सकता है; टिप्पणी मूल की जानबूझकर रखी गई संयुक्त छवि स्पष्ट करती है।
lexical_decisions:
- source_word: ἀγάπη σου
  choice: आपका प्रेम
  rationale: ‘प्रेम’ ἀγάπη का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है तथा वाचा से जुड़े आत्मीय भाव को बनाए रखता है।
- source_word: σπέρμα Ἀβραάμ
  choice: अब्राहम के वंश
  rationale: σπέρμα यहाँ एकवचन रूप में सामूहिक अर्थ रखता है। ‘वंश’ इस अर्थ और अब्राहम-संबंधी वाचागत संकेत को सहज हिन्दी में सुरक्षित रखता है।
- source_word: υἱοὺς Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी में स्पष्टतः ‘पुत्र’ है। इसे बनाए रखने से आगे आने वाले एकवचन ‘पुत्र’ के बिंब के साथ शब्दगत संबंध भी बना रहता है।
- source_word: ἡ παιδία σου
  choice: आपका अनुशासन
  rationale: पाठ का आशय केवल दंड नहीं, बल्कि सुधारने और गढ़ने वाली शिक्षा है। ‘अनुशासन’ इस सुधारात्मक और निर्माणकारी अर्थ को समेटता है।
- source_word: ἐφʼ ἡμᾶς
  choice: हम पर
  rationale: यह रूप पहले खंड के ἐπί के समानांतर प्रयोग को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: ὡς υἱὸν πρωτότοκον μονογενῆ
  choice: जैसा पहलौठे, इकलौते पुत्र पर होता है
  rationale: ‘पहलौठे’ और ‘इकलौते’ दोनों विशेषणों को अलग-अलग बनाए रखा गया है, जिससे πρωτότοκον और μονογενῆ में निहित दोनों विचार—विशेष दर्जा और अद्वितीय प्रियता—सुरक्षित रहते हैं।
theological_decisions:
- issue: πρωτότοκον और μονογενῆ का संयुक्त पुत्र-बिंब
  choice: पहलौठे, इकलौते पुत्र
  alternative: इकलौते पहलौठे पुत्र
  rationale: दोनों पदों को विराम के साथ समानाधिकरण में रखने से किसी एक धारणा को दूसरी में मिलाए बिना मूल की अर्थगत कसावट और तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, भजन-सुलभ किंतु सहज रूप अपनाया गया है। ‘आपका’ दिव्य संबोधन के प्रति आदर व्यक्त करता है। ‘इस्राएल के पुत्रों’ को अपेक्षाकृत शाब्दिक रखा गया है ताकि आगे के पुत्र-बिंब की प्रतिध्वनि बनी रहे।
