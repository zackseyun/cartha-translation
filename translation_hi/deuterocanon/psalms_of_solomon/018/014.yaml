  yaml_path: translation/deuterocanon/psalms_of_solomon/018/014.yaml
  text: And they have not gone astray since the day he created them[a]. From ancient generations they have not departed from their ways[d][c][b], unless God commanded them by the command of his servants.
translation:
  language: hi
  text: और जिस दिन से उसने उन्हें रचा, वे भटके नहीं हैं[a]। प्राचीन पीढ़ियों से वे अपने मार्गों[b] से नहीं हटे हैं—सिवाय इसके कि परमेश्वर ने अपने दासों के आदेश के द्वारा उन्हें आज्ञा दी हो[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इधर-उधर नहीं भटके हैं।’
    reason: ἐπλανήθησαν के गतिशील अर्थ का वैकल्पिक अनुवाद।
  - marker: b
    text: ‘अपने मार्गों’ का अर्थ उनके लिए ठहराए गए गतिपथ या क्रम भी हो सकता है।
    reason: ὁδῶν αὐτῶν की रूपकात्मक और ब्रह्मांडीय अर्थ-संभावना बनाए रखना।
  - marker: c
    text: या ‘अपने दासों के द्वारा।’ यूनानी में ‘दासों’ है।
    reason: ἐν ἐπιταγῇ δούλων αὐτοῦ की वैकल्पिक साधनवाचक समझ और δοῦλος का शाब्दिक अर्थ बताना।
  - marker: d
    text: या ‘अपने दासों को दिए गए आदेश के द्वारा।’
    reason: संबंधकारक पदबंध की दूसरी संभव व्याख्या दर्ज करना।
lexical_decisions:
- source_word: ἐπλανήθησαν
  choice: भटके नहीं हैं
  rationale: यह प्रयोग किसी निर्धारित या सही मार्ग से विचलित होने का भाव देता है। ‘भटके नहीं हैं’ स्वाभाविक हिन्दी है और इसमें नैतिक अर्थ को अनावश्यक रूप से निश्चित किए बिना मार्ग से हटने का भाव बना रहता है।
- source_word: ἔκτισεν
  choice: रचा
  rationale: κτίζω का सामान्य अर्थ सृष्टि करना है। ‘रचा’ आधुनिक, सहज और गरिमापूर्ण है तथा यहाँ सृजित प्राणियों या वस्तुओं के संदर्भ के अनुकूल है।
- source_word: γενεῶν ἀρχαίων
  choice: प्राचीन पीढ़ियों से
  rationale: यह पदबंध अति प्राचीन समय से चली आ रही अवधि बताता है। हिन्दी में ‘प्राचीन पीढ़ियों से’ उसके कालगत बल को निकटता से रखता है।
- source_word: ἀπέστησαν
  choice: नहीं हटे हैं
  rationale: ἀφίστημι यहाँ स्थापित मार्ग या क्रम से दूर होने को दर्शाता है। ‘नहीं हटे हैं’ सहज है और पहले वाक्य के ‘भटके नहीं’ के समानांतर भी बैठता है।
- source_word: ὁδῶν αὐτῶν
  choice: अपने मार्गों
  rationale: ὁδός का अर्थ मार्ग, चाल या निर्धारित क्रम हो सकता है। ‘मार्गों’ इस व्यापकता को बनाए रखता है; टिप्पणी में संभावित ‘निर्धारित गतिपथ/क्रम’ स्पष्ट किया गया है।
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक आदेश देने का अर्थ रखती है। ‘आज्ञा दी’ धार्मिक-साहित्यिक प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: ἐν ἐπιταγῇ
  choice: आदेश के द्वारा
  rationale: ἐν के साथ ἐπιταγή यहाँ साधन या रीति का भाव दे सकता है। ‘के द्वारा’ उस संबंध को खुला रखता है, यद्यपि पूरा यूनानी पदबंध असामान्य है।
- source_word: δούλων
  choice: दासों
  rationale: δοῦλος अधीनता और स्वामित्व का प्रबल भाव रखता है। ‘दासों’ उसे ‘सेवकों’ की अपेक्षा अधिक सीधे रूप में सुरक्षित रखता है।
theological_decisions:
- issue: बहुवचन ‘वे/उन्हें’ का संदर्भ
  choice: अनुवाद में संदर्भित समूह को नाम न देकर ‘वे/उन्हें’ ही रखा गया है।
  alternative: इसे आकाशीय पिंड, सृष्टि के तत्त्व, या सामान्य रूप से सृजित प्राणी माना जा सकता है।
  rationale: इस पद में यूनानी पाठ पूर्वपद को स्पष्ट रूप से नहीं दोहराता। किसी एक संदर्भ को मुख्य पाठ में जोड़ना वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: ἐν ἐπιταγῇ δούλων αὐτοῦ में संबंध
  choice: मुख्य पाठ में ‘अपने दासों के आदेश के द्वारा’ रखकर δούλων को ἐπιταγῇ से सीधे संबद्ध किया गया है।
  alternative: ‘अपने दासों के द्वारा’ या ‘अपने दासों को दिए गए आदेश के द्वारा’।
  rationale: यूनानी में ‘उसके दासों’ संबंधकारक रूप में ‘आदेश’ के साथ जुड़ा है, पर संबंध का आशय असामान्य और संभावित रूप से बहुअर्थी है। मुख्य पाठ निकट संरचना रखता है और टिप्पणियाँ अन्य व्याकरणिक समझ प्रस्तुत करती हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘रचा’, ‘मार्गों’, ‘आज्ञा’ और ‘दासों’ से गरिमापूर्ण धार्मिक स्वर बना रहता है, पर वाक्यरचना यथासंभव सामान्य पाठकों के लिए स्पष्ट है। अंतिम उपवाक्य की यूनानी असामान्यता को सहज बनाते हुए भी उसकी व्याकरणिक और धर्मवैचारिक अस्पष्टता टिप्पणियों में सुरक्षित रखी गई है।
