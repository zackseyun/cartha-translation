  text: the one who appointed the luminaries in their course for the appointed times of the hours, from day to day; and they have not departed from the path he commanded them.
translation:
  language: hi
  text: जिसने आकाशीय ज्योतियों को उनकी गति[a] में घंटों के नियत समयों[b] के लिए निर्धारित किया; और वे उस मार्ग से नहीं हटे हैं[c] जिस पर चलने की उसने उन्हें आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी यात्रा में” अथवा “जुलूस में”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “घंटों के नियत समयों के लिए”; यह पदबंध संभवतः समय की निश्चित और नियमित व्यवस्था को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, “नहीं हटे।”
    reason: grammatical_alternative
lexical_decisions:
- source_word: διατάξας
  choice: व्यवस्थित किया
  rationale: यह कृदन्त उद्देश्यपूर्ण रीति से क्रम निर्धारित करने और नियत स्थान देने का भाव रखता है। ‘व्यवस्थित किया’ सृष्टि में स्थापित व्यवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φωστῆρας
  choice: आकाशीय ज्योतियों
  rationale: संदर्भ में यह आकाश के प्रकाशमान पिंडों की ओर संकेत करता है। ‘आकाशीय’ अर्थ को स्पष्ट करता है, जबकि ‘ज्योतियाँ’ काव्यात्मक गरिमा बनाए रखता है।
- source_word: ἐν πορείᾳ
  choice: उनकी गति में
  rationale: πορεία चलने, यात्रा या क्रमबद्ध आगे बढ़ने को सूचित करता है। ‘गति’ आकाशीय ज्योतियों की नियमित चाल को व्यक्त करता है और आधुनिक वैज्ञानिक ‘कक्षा’ जैसी अनावश्यक विशिष्टता से बचता है।
- source_word: καιροὺς ὡρῶν
  choice: घड़ियों के नियत समयों
  rationale: καιρός नियत या उचित समय और ὥρα समय की घड़ी या अवधि को सूचित कर सकता है। कुछ असामान्य मूल वाक्यांश को पूरी तरह समतल किए बिना दोनों शब्दों का भेद रखा गया है।
- source_word: ἀφʼ ἡμερῶν εἰς ἡμέρας
  choice: दिन-प्रतिदिन
  rationale: यह मुहावरा निरंतर और नियमित पुनरावृत्ति व्यक्त करता है; ‘दिन-प्रतिदिन’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: παρέβησαν
  choice: नहीं हटे हैं
  rationale: मार्ग के संदर्भ में क्रिया का स्थानगत अर्थ प्रमुख है। वर्तमान पूर्ण रूप बीते हुए पालन के वर्तमान तक बने रहने का भाव देता है, यद्यपि यूनानी एओरिस्ट सामान्य भूतकाल भी माना जा सकता है।
- source_word: ὁδοῦ
  choice: मार्ग
  rationale: ‘मार्ग’ निर्धारित चाल और आज्ञापालन—दोनों बिंबों को गरिमापूर्ण और सुबोध हिन्दी में बनाए रखता है।
- source_word: ἐνετείλατο
  choice: आज्ञा दी थी
  rationale: क्रिया प्रत्यक्ष आदेश को व्यक्त करती है। ‘आज्ञा दी’ ज्योतियों पर आज्ञादाता के अधिकार को सुरक्षित रखता है।
theological_decisions:
- issue: आकाशीय ज्योतियों के आज्ञापालन का कालगत स्वरूप
  choice: ‘नहीं हटे हैं’ द्वारा वर्तमान तक जारी नियमितता व्यक्त की गई
  alternative: ‘नहीं हटे’—यूनानी एओरिस्ट का सामान्य भूतकाल
  rationale: संदर्भ सृष्टि की निरंतर व्यवस्था का है, इसलिए वर्तमान पूर्ण हिन्दी में उपयुक्त है; फिर भी एओरिस्ट के अधिक सीधे भूतकालीन पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर स्तोत्र की गरिमा के अनुरूप ‘ज्योतियों’, ‘मार्ग’ और ‘आज्ञा’ जैसे औपचारिक किंतु सामान्यतः बोधगम्य शब्द रखे गए हैं। मूल यूनानी के कुछ असामान्य कालगत पदबंध को पादटिप्पणी सहित सुरक्षित रखा गया है।
