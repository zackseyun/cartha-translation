translation:
  language: hi
  text: तेरे कान आशा रखने वाले निर्धन व्यक्ति की विनती सुनते हैं[a]; तेरे न्याय करुणा सहित सारी पृथ्वी पर हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आशा रखने वाले निर्धन व्यक्ति की प्रार्थना” या “याचना।” यूनानी में “निर्धन व्यक्ति” पुल्लिंग एकवचन है; इसे “दीन जन” भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे न्याय करुणा सहित समस्त पृथ्वी पर हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὦτά σου ἐπακούει
  choice: तेरे कान ... विनती सुनते हैं
  rationale: मूल में बहुवचन ‘कान’ के साथ एकवचन क्रिया है, जो सामूहिक कर्ता के कारण संभव है। हिन्दी में स्वाभाविक व्याकरण के अनुसार बहुवचन ‘सुनते हैं’ रखा गया। ἐπακούει केवल ध्वनि ग्रहण करना नहीं, ध्यान देकर सुनना भी व्यक्त करता है; संदर्भ में ‘विनती सुनते हैं’ उत्तरदायी सुनवाई का भाव देता है।
- source_word: δέησιν
  choice: विनती
  rationale: यह शब्द आवश्यकता से उपजी प्रार्थनापूर्ण याचना का बोध कराता है। ‘विनती’ आधुनिक हिन्दी में स्वाभाविक, गरिमामय और भावपूर्ण है।
- source_word: πτωχοῦ
  choice: दीन जन की
  rationale: यूनानी शब्द पुल्लिंग एकवचन संबंधकारक है। ‘दीन जन’ उसकी एकवचनता बनाए रखता है, पर केवल आर्थिक निर्धनता तक अर्थ को सीमित नहीं करता; यहाँ असहाय अथवा अभावग्रस्त व्यक्ति का भाव संभव है।
- source_word: ἐν ἐλπίδι
  choice: आशा में लगे
  rationale: शाब्दिक अर्थ ‘आशा में’ है। हिन्दी में इसे विनती करने वाले की आशापूर्ण दशा से जोड़ने के लिए ‘आशा में लगे ... की विनती’ रखा गया, जबकि संबंध की हल्की अस्पष्टता को अत्यधिक स्पष्ट नहीं किया गया।
- source_word: κρίματά
  choice: न्याय
  rationale: κρίματα न्यायिक निर्णयों अथवा न्याय के कार्यों को सूचित कर सकता है। बहुवचन क्रिया ‘होते हैं’ के साथ ‘तेरे न्याय’ हिन्दी में परमेश्वर के न्यायपूर्ण निर्णयों/कार्यों का स्वाभाविक बोध देता है।
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: सारी पृथ्वी पर
  rationale: ἐπί यहाँ विस्तार अथवा लागू होने का क्षेत्र बताता है। ‘सारी पृथ्वी पर’ निकट और सहज हिन्दी रूप है।
- source_word: μετὰ ἐλέους
  choice: करुणा सहित
  rationale: यह पद न्याय के साथ करुणा के सह-अस्तित्व को बनाए रखता है। क्रियाविशेषण ‘करुणापूर्वक’ की अपेक्षा संज्ञात्मक ‘करुणा सहित’ मूल संरचना और धार्मिक तनाव को बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: न्याय और करुणा का संबंध
  choice: ‘तेरे न्याय करुणा सहित ... होते हैं’
  alternative: ‘तू करुणापूर्वक सारी पृथ्वी का न्याय करता है’
  rationale: मूल वचन न्यायों और करुणा दोनों को साथ रखता है, पर उनके संबंध को विस्तार से परिभाषित नहीं करता। चुना हुआ रूप इस तनाव को बनाए रखता है और इसे किसी विशिष्ट सिद्धान्त में नहीं बदलता।
- issue: ἐν ἐλπίδι का संबंध
  choice: इसे दीन जन की आशापूर्ण विनती से जोड़ना
  alternative: इसे परमेश्वर के सुनने अथवा व्यापक कथन की अवस्था से जोड़ना
  rationale: शब्दक्रम इसे ‘दीन जन की विनती’ के निकट रखता है, इसलिए मुख्य पाठ में उसी संभावित संबंध को अपनाया गया; फिर भी मूल की संक्षिप्तता के कारण अत्यधिक व्याख्या से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमामय रूप अपनाया गया है। ईश्वर को संबोधन में ‘तेरे’ रखा गया, जो भजन-साहित्य की निकटता और मूल के एकवचन संबोधन को दर्शाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
