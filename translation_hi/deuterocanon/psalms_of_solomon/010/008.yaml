  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/008.yaml
  text: For God is kind and merciful forever[b][a], and the assemblies of Israel will glorify the name of the Lord.
translation:
  language: hi
  text: क्योंकि परमेश्वर सदा भला[a] और दयालु है, और इस्राएल की सभाएँ[b] प्रभु के नाम की महिमा करेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपालु।”
    reason: lexical_alternative
  - marker: b
    text: या, “मण्डलियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक बल को स्पष्ट रखता है।
- source_word: χρηστός
  choice: भला
  rationale: यहाँ शब्द परमेश्वर के हितकारी और कृपालु स्वभाव को व्यक्त करता है। ‘भला’ मूल के ‘good/kind’ अर्थ-विस्तार को बनाए रखता है; ‘कृपालु’ भी संभव है।
- source_word: ἐλεήμων
  choice: दयालु
  rationale: यह परमेश्वर की दया और करुणा को स्वाभाविक, प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह स्थायी और अनंत अवधि का प्रचलित मुहावरा है; ‘सदा’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: συναγωγαὶ
  choice: सभाएँ
  rationale: बहुवचन में यह इस्राएल के एकत्र समुदायों को दर्शाता है और किसी बाद की संस्थागत धारणा को अनावश्यक रूप से नहीं थोपता।
- source_word: δοξάσουσιν
  choice: महिमा करेंगी
  rationale: यह भविष्यकाल और प्रबल स्तुतिपरक अर्थ दोनों को सुरक्षित रखता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: κύριος के लिए परियोजना-संगत धार्मिक पद ‘प्रभु’ रखा गया है; ‘प्रभु के नाम’ हिन्दी में स्वाभाविक संबंधवाचक अभिव्यक्ति है।
theological_decisions:
- issue: द्वितीयकानूनी यूनानी संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ दैवी उपाधि के रूप में κύριος का पारंपरिक और स्वाभाविक हिन्दी रूप है तथा मूल पाठ से अधिक विशिष्ट कोई निजी धर्मवैचारिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सहज। पदक्रम को हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि कारणसूचक आरम्भ, दैवी गुणों, भविष्यकाल और सामुदायिक बहुवचन को सुरक्षित रखा गया है।
