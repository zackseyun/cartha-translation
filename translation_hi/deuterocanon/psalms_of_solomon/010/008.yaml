source:
  edition: lxx-swete-1909
  text: ὅτι χρηστὸς καὶ ἐλεήμων ὁ θεὸς εἰς τὸν αἰῶνα, καὶ συναγωγαὶ Ἰσραὴλ δοξάσουσιν τὸ ὄνομα Κυρίου.
  language: Greek
