base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/004.yaml
  text: And the mercy of the Lord is upon those who love him in truth[b][a], and the Lord will remember his servants with mercy.
translation:
  language: hi
  text: और प्रभु की दया उन पर है जो सच्चाई से उससे प्रेम करते हैं[a]; और प्रभु दया से अपने सेवकों[b] को स्मरण करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्ठापूर्वक” अथवा “निष्कपट भाव से”।
    reason: lexical_alternative
  - marker: b
    text: या “दासों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος / ἐλέει
  choice: दया / दया करके
  rationale: ‘दया’ करुणामय और कृपापूर्ण व्यवहार दोनों को स्वाभाविक हिन्दी में व्यक्त करती है। दूसरी बार क्रियाविशेषणात्मक ‘दया करके’ यूनानी ἐν ἐλέει का सहज अर्थ देता है।
- source_word: Κυρίου / Κύριος
  choice: प्रभु
  rationale: यह यहूदी भक्तिपरक संदर्भ में परमेश्वर के लिए प्रयुक्त सामान्य दिव्य उपाधि है।
- source_word: ἐπὶ
  choice: पर बनी रहती है
  rationale: यह दया के लोगों पर होने की यूनानी छवि को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है; वर्तमानकालीन संबंध को भी स्पष्ट करता है।
- source_word: ἀγαπῶντας
  choice: जो ... प्रेम करते हैं
  rationale: संज्ञात्मक कृदन्त का स्वाभाविक हिन्दी रूप है और निरंतर संबंधपरक भाव को बनाए रखता है।
- source_word: ἐν ἀληθείᾳ
  choice: सच्चाई से
  rationale: यह यूनानी पदबंध की सत्यता, निष्ठा और निष्कपटता की संभावित अर्थ-छायाओं को बिना किसी एक तक सीमित किए संक्षेप में व्यक्त करता है।
- source_word: μνήσεται
  choice: स्मरण करेगा
  rationale: भविष्यकाल और प्रभु के अनुग्रहपूर्ण, सक्रिय स्मरण—दोनों को औपचारिक किंतु बोधगम्य हिन्दी में रखता है।
- source_word: δούλων
  choice: सेवकों
  rationale: प्रार्थनापरक संदर्भ में यह स्वाभाविक है, यद्यपि यूनानी शब्द दासत्व की अधिक प्रबल सामाजिक स्थिति भी व्यक्त कर सकता है; उस विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: δοῦλος का अनुवाद
  choice: सेवकों
  alternative: दासों
  rationale: पद का केंद्र प्रभु का दयापूर्ण स्मरण है, इसलिए ‘सेवकों’ से संबंध स्वाभाविक रूप से व्यक्त होता है; ‘दासों’ में निहित अधिक प्रबल अधीनता को पादटिप्पणी में रखा गया है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहूदी उपासना-संदर्भ में κύριος यहाँ दिव्य उपाधि है; ‘प्रभु’ उसी को स्पष्ट और परंपरासंगत ढंग से व्यक्त करता है।
- issue: ἐν ἀληθείᾳ की अर्थ-व्याप्ति
  choice: सच्चाई से
  alternative: निष्ठापूर्वक / निष्कपट भाव से
  rationale: यूनानी पदबंध सत्य, निष्ठा और निष्कपटता के बीच अर्थगत विस्तार रख सकता है। मुख्य पाठ व्यापक अभिव्यक्ति रखता है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और भक्तिपरक, पर सामान्य पाठक के लिए सहज। समानांतर वाक्य-रचना को अर्धविराम से सुरक्षित रखा गया है।
