base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/007.yaml
  text: And the pious will give thanks in the assembly of the people[d][c][b][a], and God will have mercy on the poor in the gladness of Israel.
translation:
  language: hi
  text: और भक्तजन[a] लोगों की सभा में धन्यवाद देंगे, और परमेश्वर इस्राएल के आनंद में[b] निर्धनों पर दया करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासयोग्य जन”; अथवा “पवित्र जन।”
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल के आनंद के बीच।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: भक्तजन
  rationale: यह शब्द धर्मनिष्ठा और वाचा के प्रति निष्ठा रखने वाले समुदाय को सूचित करता है। ‘भक्तजन’ आधुनिक हिन्दी में स्वाभाविक है और इसे ἅγιοι के सामान्य अर्थ ‘पवित्र जन’ में नहीं मिला देता।
- source_word: ἐξομολογήσονται
  choice: धन्यवाद देंगे
  rationale: सप्तति के उपासना-संबंधी प्रयोग में यह क्रिया प्रायः सार्वजनिक धन्यवाद या स्तुति व्यक्त करती है; सभा का संदर्भ ‘धन्यवाद देंगे’ का समर्थन करता है।
- source_word: ἐκκλησίᾳ λαοῦ
  choice: लोगों की सभा में
  rationale: यह पद एकत्र हुए समुदाय को दर्शाता है। यह अनुवाद सार्वजनिक और सामुदायिक परिवेश को स्पष्ट रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: πτωχοὺς
  choice: निर्धनों पर
  rationale: ‘निर्धन’ यूनानी शब्द के सामाजिक और भौतिक अर्थ को बिना हल्का किए सम्मानजनक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐλεήσει
  choice: दया करेगा
  rationale: यह क्रिया दयापूर्ण ईश्वरीय कार्य को व्यक्त करती है; ‘दया करेगा’ संक्षिप्त, स्वाभाविक और धर्मवैचारिक भार को बनाए रखने वाला रूप है।
- source_word: ἐν εὐφροσύνῃ Ἰσραήλ
  choice: इस्राएल के आनंद में
  rationale: यह निकट-शाब्दिक अनुवाद मूल की संरचना और संभावित संबंध को सुरक्षित रखता है तथा ‘आनंद’ की शब्दगत संगति बनाए रखता है। अधिक प्रवाहपूर्ण स्थानवाचक अर्थ फुटनोट में दिया गया है।
theological_decisions:
- issue: ὅσιοι को समुदाय-सूचक पद के रूप में प्रस्तुत करना
  choice: भक्तजन
  alternative: विश्वासयोग्य जन; पवित्र जन
  rationale: ‘भक्तजन’ धर्मनिष्ठ और वाचा-निष्ठ समूह का भाव रखता है, जबकि ‘पवित्र जन’ इसे ἅγιοι के साथ अनावश्यक रूप से मिला सकता है। विकल्प फुटनोट में रखकर अर्थ-सीमा को खुला छोड़ा गया है।
- issue: ἐν εὐφροσύνῃ Ἰσραήλ का संबंध
  choice: इस्राएल के आनंद में
  alternative: इस्राएल के आनंद के बीच
  rationale: मूल यूनानी में पूर्वसर्गीय वाक्यांश का संबंध कुछ हद तक खुला है। मुख्य पाठ निकट-शाब्दिक रूप रखता है और फुटनोट अधिक मुहावरेदार स्थानवाचक संभावना देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘भक्तजन’, ‘सभा’, ‘निर्धन’ और ‘दया’ सामान्य पाठक के लिए बोधगम्य हैं। मूल यूनानी की संक्षिप्तता और अंतिम वाक्यांश की हल्की अस्पष्टता को अनावश्यक व्याख्या से नहीं हटाया गया है।
