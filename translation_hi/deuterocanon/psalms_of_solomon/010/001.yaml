  yaml_path: translation/deuterocanon/psalms_of_solomon/010/001.yaml
  text: Blessed is the man whom the Lord remembered with rebuke[a], and who was turned away from an evil way by a scourge, to be cleansed from sin[e][d][c][b], so that it might not increase.
translation:
  language: hi
  text: धन्य है वह पुरुष, जिसे प्रभु ने ताड़ना के साथ स्मरण किया[a], और जिसे कोड़े के द्वारा बुरे मार्ग से घेरकर रोक दिया गया[b], ताकि उसे पाप से शुद्ध किया जाए और पाप न बढ़े[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुधार की डाँट के साथ।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “चारों ओर घेर दिया गया” है; यहाँ भाव यह है कि उसे सीमित करके बुरे मार्ग पर आगे बढ़ने से रोक दिया गया।
    reason: lexical_alternative
  - marker: c
    text: अंतिम पदबंध का अर्थ “ताकि वह उसे न बढ़ाए” भी हो सकता है; अर्थात् पाप का अनकहा संदर्भ मानकर, कि वह पुरुष पाप को न बढ़ाए।
    reason: alternative_reading
lexical_decisions:
- source_word: Μακάριος
  choice: धन्य
  rationale: आशीर्वचन की गंभीरता और धार्मिक अर्थवत्ता को बनाए रखता है; केवल भावनात्मक प्रसन्नता का बोध नहीं कराता।
- source_word: ἀνὴρ
  choice: पुरुष
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है; हिन्दी में इसे स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ἐμνήσθη
  choice: स्मरण किया
  rationale: क्रिया का मूल अर्थ सुरक्षित है और प्रसंग में प्रभु द्वारा उस पुरुष की ओर अनुशासनात्मक ध्यान देने का भाव भी बना रहता है।
- source_word: ἐν ἐλεγμῷ
  choice: ताड़ना के साथ
  rationale: ἐλεγμός में डाँट, उलाहना और सुधारात्मक ताड़ना का अर्थ है; यह चयन अनुशासनात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκυκλώθη
  choice: घेरकर रोक दिया गया
  rationale: शाब्दिक अर्थ ‘चारों ओर घेरा गया’ है; प्रसंग में यह बुरे मार्ग पर आगे बढ़ने से सीमित या अवरुद्ध किए जाने की छवि व्यक्त करता है।
- source_word: ὁδοῦ πονηρᾶς
  choice: बुरे मार्ग
  rationale: नैतिक आचरण को मार्ग के रूप में दिखाने वाला मूल रूपक बनाए रखता है और सामान्य आधुनिक हिन्दी में सहज है।
- source_word: ἐν μάστιγι
  choice: कोड़े के द्वारा
  rationale: मूल के ठोस दंडात्मक बिंब को स्पष्ट और प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: καθαρισθῆναι
  choice: शुद्ध हो
  rationale: 'मूल निष्क्रिय भाव को स्वाभाविक हिन्दी में व्यक्त करता है: शुद्धता उस पुरुष को प्राप्त कराई जाती है।'
- source_word: ἁμαρτίας
  choice: पाप
  rationale: यूनानी एकवचन को सामूहिक नैतिक अर्थ में बनाए रखा गया है।
- source_word: τοῦ μὴ πληθῦναι
  choice: पाप न बढ़े
  rationale: संक्षिप्त यूनानी उपवाक्य का संभावित आशय स्वाभाविक हिन्दी में देता है, जबकि कर्ता की मूल अस्पष्टता को पादटिप्पणी में दर्ज किया गया है।
theological_decisions:
- issue: अनुशासन, शुद्धि और पाप की वृद्धि के बीच संबंध
  choice: 'वाक्य को उद्देश्यसूचक रूप में रखा गया है: अनुशासन का लक्ष्य पाप से शुद्धि और पाप का न बढ़ना है।'
  alternative: अंतिम पदबंध को उस पुरुष द्वारा पाप न बढ़ाने के अर्थ में समझा जा सकता है।
  rationale: यूनानी τοῦ के साथ अनंत क्रिया उद्देश्य या परिणाम व्यक्त कर सकती है और πληθῦναι का अनकहा कर्ता अस्पष्ट है; किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को अनिवार्य नहीं बनाया गया।
