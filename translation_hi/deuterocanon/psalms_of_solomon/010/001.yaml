  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘धन्य’, ‘स्मरण किया’ और ‘शुद्ध’ मूल की धार्मिक तथा काव्यात्मक गंभीरता रखते हैं; ‘कोड़ा’ ठोस अनुशासनात्मक बिंब को सहज भाषा में व्यक्त करता है।
