  yaml_path: translation/deuterocanon/psalms_of_solomon/010/005.yaml
  text: For the testimony is in the law of the everlasting covenant[a]; the testimony of the Lord is upon the ways of men in visitation.
translation:
  language: hi
  text: 'क्योंकि गवाही सनातन वाचा की व्यवस्था में है;

    मनुष्यों के मार्गों पर प्रभु की गवाही उसके निरीक्षण के समय होती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρία
  choice: साक्षी
  rationale: यहाँ कानूनी और वाचागत संदर्भ में ‘साक्षी’ स्वाभाविक है और यूनानी संज्ञा की दोनों समानांतर आवृत्तियों को एक ही रूप में सुरक्षित रखता है।
- source_word: ἐν νόμῳ διαθήκης αἰωνίου
  choice: सनातन वाचा की व्यवस्था में
  rationale: यह पदबंध ἐν के स्थानवाचक भाव तथा व्यवस्था और वाचा के संबंध को बनाए रखता है; ‘सनातन वाचा’ αἰωνίου की बाइबलीय गरिमा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: वाचागत संदर्भ में यह ईश्वरीय उपाधि है; ‘प्रभु’ आधुनिक हिन्दी बाइबल-शैली में प्रतिष्ठित और सुबोध रूप है।
- source_word: ἐπὶ ὁδοὺς ἀνθρώπων
  choice: मनुष्यों के मार्गों पर
  rationale: ἐπί का ‘पर’ रूप मूल की स्थानिक और पर्यवेक्षणात्मक छवि को बचाता है; ‘मनुष्यों’ का प्रयोग समस्त मानवजाति के सामान्य अर्थ में है।
- source_word: ἐν ἐπισκοπῇ
  choice: उसके निरीक्षण के समय
  rationale: ἐπισκοπή में निरीक्षण, परख और ईश्वरीय आगमन के अर्थ संभव हैं। यह अनुवाद अमूर्त संज्ञा का भार बनाए रखते हुए हिन्दी में अर्थ स्पष्ट करता है और केवल दंडात्मक ‘न्याय’ नहीं जोड़ता।
- source_word: '[implied copula]'
  choice: है / होती है
  rationale: यूनानी की दोनों पंक्तियाँ क्रियारहित हैं। हिन्दी में पूर्ण वाक्य के लिए न्यूनतम योजक क्रिया जोड़ी गई है; दूसरी पंक्ति में ‘होती है’ समय-संबंधी पदबंध के साथ स्वाभाविक है।
theological_decisions:
- issue: ἐπισκοπή का ईश्वरीय आशय
  choice: उसके निरीक्षण के समय
  alternative: दर्शन के समय / दंड देने के समय
  rationale: शब्द ईश्वरीय निगरानी, परख, आगमन या न्याय की ओर संकेत कर सकता है। ‘निरीक्षण’ इस तनाव को सुरक्षित रखता है और संदर्भ से अधिक निश्चित दंडात्मक अर्थ नहीं थोपता।
- issue: पद की वाक्य-संरचना
  choice: दो समानांतर उपवाक्य
  alternative: पहले पदबंध को कर्ता और दूसरे को उसका विधेय मानकर एक वाक्य
  rationale: ἡ μαρτυρία की पुनरावृत्ति और काव्यात्मक संरचना दो समानांतर क्रियारहित पंक्तियों का समर्थन करती है; इसलिए उन्हें एक ही गद्यात्मक कथन में नहीं मिलाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’, ‘वाचा’, ‘प्रभु’ और ‘साक्षी’ बाइबलीय कानूनी-वाचागत स्वर बनाए रखते हैं। पंक्ति-विभाजन मूल के संभावित काव्यात्मक द्विपद को प्रकट करता है।
