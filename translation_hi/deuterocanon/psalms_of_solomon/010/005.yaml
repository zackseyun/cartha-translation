review_pass:
  verdict: revise
  source_fidelity: The two parallel clauses and the repeated μαρτυρία are retained, as are the locative phrases ‘in the law’ and ‘upon the ways of people.’ However, ‘साक्षी’ normally denotes a witnessing person in modern Hindi, whereas μαρτυρία here denotes testimony. ‘गवाही’ is the appropriate legal/covenantal abstract noun. ‘निरीक्षण के समय’ reasonably represents ἐν ἐπισκοπῇ without forcing a specifically punitive sense.
  naturalness: The draft is otherwise clear and suitably elevated. Replacing ‘साक्षी’ with ‘गवाही’ makes both lines idiomatic Hindi and preserves the intended parallelism. ‘उसके निरीक्षण के समय’ is understandable in context, with the possessive referring to the Lord.
  terminology: Use ‘गवाही’ consistently for μαρτυρία. Retain ‘सनातन वाचा,’ ‘व्यवस्था,’ and ‘प्रभु’ as appropriate established biblical-register terms.
  issues:
  - severity: medium
    issue: ‘साक्षी’ is used for μαρτυρία.
    rationale: In modern standard Hindi, ‘साक्षी’ ordinarily means ‘witness’ (a person), not ‘testimony.’ The Greek noun denotes testimony in this legal and covenantal context; ‘गवाही’ conveys that sense accurately.
  revised_text: 'क्योंकि गवाही सनातन वाचा की व्यवस्था में है;

    मनुष्यों के मार्गों पर प्रभु की गवाही उसके निरीक्षण के समय होती है।'
  revised_footnotes: []
  revision_rationale: The revision changes only the misleading Hindi noun ‘साक्षी’ to ‘गवाही,’ consistently in both parallel clauses. It preserves the source’s bicolon, its repeated noun, the covenantal/legal register, and the noncommittal sense of ἐπισκοπή as divine inspection or visitation rather than explicitly punitive judgment.
