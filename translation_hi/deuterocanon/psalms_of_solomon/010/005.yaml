  to: 'क्योंकि गवाही सनातन वाचा की व्यवस्था में है;

    मनुष्यों के मार्गों पर प्रभु की गवाही उसके निरीक्षण के समय होती है।'
  rationale: The revision changes only the misleading Hindi noun ‘साक्षी’ to ‘गवाही,’ consistently in both parallel clauses. It preserves the source’s bicolon, its repeated noun, the covenantal/legal register, and the noncommittal sense of ἐπισκοπή as divine inspection or visitation rather than explicitly punitive judgment.
