  text: Righteous and holy is our Lord in his judgments forever[a], and Israel will praise the name of the Lord with gladness.
translation:
  language: hi
  text: हमारा प्रभु अपने न्यायों में सदा धर्मी और पवित्र है, और इस्राएल आनन्द के साथ प्रभु के नाम की स्तुति करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: धर्मी
  rationale: यहाँ यह विशेषण प्रभु के नैतिक खरापन और धर्ममय चरित्र को व्यक्त करता है; ‘धर्मी’ केवल न्यायिक निष्पक्षता तक अर्थ को सीमित नहीं करता।
- source_word: ὅσιος
  choice: पवित्र
  rationale: परमेश्वर के लिए प्रयुक्त होने पर ‘पवित्र’ यूनानी शब्द के धार्मिक और पावन भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Κύριος ἡμῶν
  choice: हमारा प्रभु
  rationale: κύριος यहाँ परमेश्वर की उपाधि है; ‘हमारा प्रभु’ मूल के सम्बन्धसूचक बल को बनाए रखता है।
- source_word: κρίμασιν αὐτοῦ
  choice: अपने न्यायों में
  rationale: करण/क्षेत्रसूचक बहुवचन को इस रूप में प्रस्तुत करने से स्पष्ट होता है कि प्रभु की धार्मिकता और पवित्रता उसके न्यायिक निर्णयों में प्रकट होती है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह यूनानी मुहावरा स्थायी कालगत निरन्तरता व्यक्त करता है; ‘सदा’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: αἰνέσει
  choice: स्तुति करेगा
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τῷ ὀνόματι Κυρίου
  choice: प्रभु के नाम की
  rationale: ‘नाम’ को बनाए रखने से वाक्यांश का श्रद्धापूर्ण और वाचागत महत्व सुरक्षित रहता है।
- source_word: ἐν εὐφροσύνῃ
  choice: आनन्द के साथ
  rationale: यह स्तुति की रीति और उल्लासपूर्ण भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δίκαιος और ὅσιος के संयुक्त वर्णन को व्याख्यात्मक रूप से समतल करना या उनके अलग नैतिक और पावन आयाम बनाए रखना
  choice: धर्मी और पवित्र
  alternative: न्यायी और विश्वासयोग्य
  rationale: मूल यूनानी प्रभु के दो अलग गुण प्रस्तुत करता है। ‘धर्मी और पवित्र’ न्याय-नैतिक तथा पावन—दोनों आयामों को बिना किसी सम्प्रदायगत व्याख्या के बनाए रखता है।
- issue: κρίμασιν αὐτοῦ का प्रभु के गुणों से सम्बन्ध
  choice: अपने न्यायों में हमारा प्रभु सदा धर्मी और पवित्र है
  alternative: हमारा प्रभु धर्मी और पवित्र है; उसके न्याय सदा बने रहते हैं
  rationale: यूनानी में ‘उसके न्यायों में’ को प्रभु के धर्मी और पवित्र होने के क्षेत्र या अभिव्यक्ति के रूप में पढ़ना वाक्य-विन्यास के अधिक निकट है; वैकल्पिक पाठ अनावश्यक रूप से एक ही वाक्य को दो कथनों में बाँटता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्तोत्र-सुलभ शैली अपनाई गई है। ‘आनन्द’, ‘धर्मी’, ‘पवित्र’ और ‘स्तुति’ जैसे व्यापक रूप से समझे जाने वाले धार्मिक शब्द रखे गए हैं; अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशेष शब्दावली से बचा गया है।
