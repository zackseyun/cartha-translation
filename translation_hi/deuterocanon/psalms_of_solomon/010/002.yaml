  yaml_path: translation/deuterocanon/psalms_of_solomon/010/002.yaml
  text: The one who prepares his back for scourges will be cleansed[d][c][b][a], for the Lord is good to those who endure discipline.
translation:
  language: hi
  text: जो कोड़े खाने के लिए अपनी पीठ तैयार करता है, वह शुद्ध किया जाएगा[a]; क्योंकि प्रभु उन लोगों के प्रति भला है जो अनुशासन[b] को धैर्य से सहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्मल किया जाएगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “ताड़ना” या “सुधार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἑτοιμάζων
  choice: जो … तैयार करता है
  rationale: संज्ञार्थक वर्तमान कृदंत एक सामान्य व्यक्ति का वर्णन करता है; यह हिंदी रूप उसकी तत्परता और सामान्य कथन—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: νῶτον εἰς μάστιγας
  choice: अपनी पीठ को कोड़ों के लिए
  rationale: νῶτον का सीधा अर्थ ‘पीठ’ है और εἰς μάστιγας दंड के प्रहारों को स्वीकार करने की तैयारी दर्शाता है। ‘कोड़ों’ से निकटवर्ती पद में μάστιξ के साथ शब्दगत और विषयगत संबंध भी बना रहता है।
- source_word: καθαρισθήσεται
  choice: निर्मल किया जाएगा
  rationale: भविष्यत् कर्मवाच्य को सुरक्षित रखते हुए यह नैतिक अथवा सुधारात्मक शुद्धि का व्यापक भाव व्यक्त करता है, बिना इसे केवल आनुष्ठानिक शुद्धि मानने के।
- source_word: χρηστὸς
  choice: भला
  rationale: यहाँ विशेषण प्रभु के दयालु और हितकारी स्वभाव को बताता है; ‘भला’ हिंदी में गरिमापूर्ण और व्यापक है।
- source_word: τοῖς ὑπομένουσιν
  choice: जो … धीरज से सहते हैं
  rationale: ὑπομένω कठिनाई या सुधार के अधीन दृढ़तापूर्वक टिके रहने का भाव रखता है; ‘धीरज से सहते हैं’ उस तत्व को स्पष्ट करता है।
- source_word: παιδείαν
  choice: अनुशासन
  rationale: संदर्भ में यह केवल शिक्षा नहीं, बल्कि सुधार के लिए दिया गया प्रशिक्षण या ताड़ना है। ‘अनुशासन’ इस व्यापक अर्थ को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
theological_decisions:
- issue: स्वीकार किए गए दंड के बाद निर्मल किए जाने का अर्थ
  choice: पद को ऐसे सुधारात्मक अनुशासन के रूप में रखा गया है जिसे स्वेच्छा और धीरज से स्वीकार करने पर व्यक्ति निर्मल किया जाता है।
  alternative: इसे अधिक संकीर्ण रूप से आनुष्ठानिक शुद्धि, या अधिक व्यापक रूप से दुःख के द्वारा निर्दोष ठहराए जाने की छवि माना जा सकता है।
  rationale: καθαρισθήσεται शुद्ध या निर्मल किए जाने को दर्शाता है, जबकि παιδείαν सहने की समानांतर बात नैतिक सुधार की ओर संकेत करती है। अनुवाद किसी एक विशिष्ट धर्मवैधानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपनी पीठ को कोड़ों के लिए तैयार करता है’ मूल रूपक को प्रत्यक्ष बनाए रखता है, और ‘धीरज से सहते हैं’ ὑπομένω में निहित दृढ़ सहनशीलता को स्पष्ट करता है।
