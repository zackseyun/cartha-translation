base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/003.yaml
  text: For he has made straight the ways of the righteous[c][b][a], and he will not pervert them in discipline.
translation:
  language: hi
  text: क्योंकि उसने धर्मियों के मार्ग सीधे किए हैं, और वह अनुशासन के समय उन्हें टेढ़ा नहीं करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह अनुशासन के द्वारा उन्हें टेढ़ा नहीं करेगा”; अथवा, “और वह सुधार के समय उन्हें टेढ़ा नहीं करेगा।”
    reason: ἐν παιδείᾳ में ‘अनुशासन/सुधार’ तथा परिस्थितिवाचक ‘के समय’ और साधनवाचक ‘के द्वारा’—दोनों अर्थ-संभावनाएँ बनी रहती हैं।
lexical_decisions:
- source_word: ὤρθωσε
  choice: सीधे किए हैं
  rationale: यह क्रिया मार्ग को सीधा करने या ठीक दिशा में लगाने का भाव देती है। हिन्दी में यह रूप ठोस मार्ग-रूपक और यूनानी के पूर्णतापरक भाव, दोनों को स्वाभाविक रूप से रखता है।
- source_word: ὁδοὺς
  choice: मार्ग
  rationale: ‘मार्ग’ वास्तविक रास्ते और नैतिक आचरण, दोनों के लिए उपयुक्त, प्रतिष्ठित और सामान्य हिन्दी शब्द है।
- source_word: δικαίων
  choice: धर्मियों के
  rationale: सम्बन्धकारक बहुवचन यहाँ धर्मी लोगों को सूचित करता है; ‘धर्मियों के’ संक्षिप्त और स्वाभाविक है।
- source_word: διαστρέψει
  choice: टेढ़ा नहीं करेगा
  rationale: यह चयन पहले खंड के ‘सीधे किए’ के साथ स्पष्ट स्थानिक विरोध बनाए रखता है और मार्गों के रूपक को ‘बिगाड़ना’ जैसे अधिक अमूर्त अनुवाद की अपेक्षा बेहतर सँभालता है।
- source_word: ἐν παιδείᾳ
  choice: अनुशासन के समय
  rationale: ἐν का शाब्दिक अर्थ ‘में’ है, पर हिन्दी में ‘अनुशासन में’ अस्पष्ट और अस्वाभाविक लग सकता है। ‘के समय’ अनुशासन की परिस्थिति को व्यक्त करता है, जबकि साधनवाचक ‘अनुशासन के द्वारा’ को निर्णायक रूप से नहीं अपनाता।
theological_decisions:
- issue: धर्मियों और ईश्वरीय अनुशासन के बीच सम्बन्ध
  choice: अनुशासन के समय भी वह धर्मियों के मार्गों को टेढ़ा नहीं करेगा।
  alternative: वह अनुशासन के द्वारा धर्मियों को भटका नहीं देगा; अथवा अनुशासन करते समय अन्याय नहीं करेगा।
  rationale: ὁδοὺς और ὤρθωσε द्वारा स्थापित मार्ग-रूपक के कारण διαστρέψει का निहित कर्म पहले उल्लिखित ‘मार्ग’ समझना सर्वाधिक स्वाभाविक है। फिर भी ἐν παιδείᾳ का परिस्थिति अथवा साधनवाचक अर्थ खुला है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध बाइबलीय गद्य। ‘सीधे’ और ‘टेढ़ा’ के माध्यम से मूल यूनानी का समानांतर मार्ग-रूपक सुरक्षित रखा गया है; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
