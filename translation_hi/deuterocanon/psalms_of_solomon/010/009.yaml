  text: The Lord’s salvation is upon the house of Israel for everlasting self-control[a][b][c].
translation:
  language: hi
  text: प्रभु का उद्धार इस्राएल के घराने पर है, सदा के आत्म-संयम के लिए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु का उद्धार इस्राएल के घराने पर सदा के आत्म-संयम के लिए हो।” यूनानी वाक्य में क्रिया नहीं है, इसलिए इसे आशीर्वचन की तरह भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “आत्म-संयम” के लिए यूनानी शब्द का अर्थ “विवेकशीलता” या “संतुलित चित्त” भी हो सकता है। पाठ-सम्बन्धी एक वैकल्पिक सूचना में यहाँ εὐφροσύνην (“आनन्द”) पढ़ा गया है; यदि वह पाठ अपनाया जाए, तो अर्थ होगा, “सदा के आनन्द के लिए।”
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: प्रभु का
  rationale: संबंधकारक को स्वामित्वसूचक मानना यहाँ सबसे स्वाभाविक है और κύριος का मानक, गरिमापूर्ण हिन्दी रूप “प्रभु” है।
- source_word: ἡ σωτηρία
  choice: उद्धार
  rationale: σωτηρία बचाव अथवा छुटकारे का अर्थ दे सकता है; “उद्धार” इसके व्यापक धार्मिक और भजनात्मक आशय को बनाए रखता है।
- source_word: ἐπὶ οἶκον Ἰσραήλ
  choice: इस्राएल के घराने पर ... है
  rationale: यूनानी वाक्य में क्रिया नहीं है; हिन्दी में “है” जोड़कर कथनात्मक अर्थ व्यक्त किया गया है। οἶκον को स्पष्ट रूप से “घराने” के रूप में रखा गया है।
- source_word: εἰς
  choice: के लिए
  rationale: यह उद्देश्य या परिणाम सूचित कर सकता है; “के लिए” दोनों के बीच की मूल अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: σωφροσύνην
  choice: संयम
  rationale: दिए गए और प्रत्यक्ष रूप से सत्यापित स्रोत-पाठ σωφροσύνην का सामान्य नैतिक अर्थ आत्म-संयम, विवेकशीलता या संतुलित चित्त है; संक्षिप्त हिन्दी में “संयम” उपयुक्त है।
- source_word: αἰώνιον
  choice: सदा का
  rationale: विशेषण का स्थायी और निरंतर भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: क्रियारहित कथन को कथन या आशीर्वचन मानना
  choice: कथनात्मक “है”
  alternative: आशीर्वचनात्मक “हो”
  rationale: शब्दशः संरचना दोनों की अनुमति दे सकती है; मुख्य पाठ में निकटतम साधारण कथन रखा गया है और आशीर्वचनात्मक संभावना पादटिप्पणी में सुरक्षित है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: भजनात्मक धार्मिक संदर्भ में “प्रभु” मानक और स्वाभाविक है; यहाँ “स्वामी” चुनने की कोई विशेष आवश्यकता नहीं है।
- issue: प्रस्तुत स्रोत-पाठ σωφροσύνην और कथित मुद्रित पाठ εὐφροσύνην के बीच पाठगत समस्या
  choice: प्रस्तुत सत्यापित मूल-पाठ के अनुसार “संयम”
  alternative: यदि स्वेटे के वास्तविक मुद्रित पाठ में εὐφροσύνην हो तो “आनन्द”
  rationale: उपलब्ध मूल-पाठ स्पष्ट रूप से σωφροσύνην देता है, इसलिए मुख्य अनुवाद उसी पर आधारित है। फिर भी संशोधन-इतिहास में संभावित प्रतिलेखन/OCR त्रुटि का गंभीर दावा है; बिना प्रत्यक्ष पृष्ठ-साक्ष्य के मूल पाठ को चुपचाप बदलना उचित नहीं, अतः इसे पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, भजनात्मक गरिमा के साथ। “इस्राएल के घराने” ने मूल की सामूहिक वाचा-संबंधी अभिव्यक्ति को बनाए रखा है। वाक्य को सहज रखने के लिए “सदा के संयम” चुना गया है, जबकि उद्देश्य और परिणाम के बीच εἰς की अस्पष्टता सुरक्षित है।
