translation:
  language: hi
  text: उनके अधर्म के काम गुप्त कक्षों में उकसावे के रूप में होते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘उकसावे में’। इसका अर्थ किसी को क्रोध दिलाने वाला प्रकोपन हो सकता है; क्रोध किसका है, यह मूल पाठ में स्पष्ट नहीं है।
    reason: παροργισμός की प्रकोपनकारी अर्थ-छाया तथा उसके अप्रकट पात्र की अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐν καταγώγαις κρυφίοις
  choice: गुप्त कक्षों में
  rationale: καταγωγή किसी ठहरने की जगह, कक्ष या ठिकाने को सूचित कर सकता है; κρύφιος उसके छिपे या गुप्त होने पर बल देता है। ‘गुप्त कक्षों में’ संभावित भीतरी स्थान का भाव रखता है, पर उसकी वास्तु-रचना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: αἱ παρανομίαι αὐτῶν
  choice: उनके अधर्म के काम
  rationale: παρανομία व्यवस्था या उचित मर्यादा का उल्लंघन है। बहुवचन के लिए ‘अधर्म के काम’ आधुनिक हिन्दी में स्वाभाविक है और अमूर्त ‘अधर्म’ की अपेक्षा किए गए अपराधों का ठोस भाव बनाए रखता है।
- source_word: ἐν παροργισμῷ
  choice: और क्रोध भड़काते थे
  rationale: παροργισμός उकसावे अथवा क्रोध दिलाने का भाव रखता है। हिन्दी में केवल ‘उकसावे में’ अस्वाभाविक और अस्पष्ट होता; क्रियात्मक रूप स्रोत के भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। मूल यूनानी में क्रोध का अनुभव करने वाला व्यक्ति स्पष्ट नहीं है, इसलिए अनुवाद में ‘परमेश्वर को’ नहीं जोड़ा गया।
- source_word: '[implied copula]'
  choice: होते थे
  rationale: यूनानी वाक्य क्रियारहित है। हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए ‘होते थे’ न्यूनतम पूर्ति है।
theological_decisions:
- issue: παροργισμῷ में क्रोध का अप्रकट पात्र
  choice: क्रोध भड़काते थे—पर किसका क्रोध, यह मुख्य पाठ में नहीं बताया गया
  alternative: परमेश्वर को क्रोध दिलाते थे
  rationale: आसपास का प्रसंग परमेश्वर के क्रोध की ओर संकेत कर सकता है, लेकिन इस पंक्ति में कोई स्पष्ट कर्म नहीं है। उसे जोड़ना स्रोत की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यवस्थाहीन कृत्य’ जैसे अत्यधिक शाब्दिक किंतु कृत्रिम पदों के बजाय ‘अधर्म के काम’ चुना गया है।
