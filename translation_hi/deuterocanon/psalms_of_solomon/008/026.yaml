    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμίανεν
  choice: अशुद्ध कर दिया
  rationale: μίανω धार्मिक अथवा नैतिक अशुद्धता उत्पन्न करने का भाव रखता है। ‘अशुद्ध कर दिया’ इस पवित्रता-अशुद्धता की भाषा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: τὰ ἡγιασμένα
  choice: पवित्र की गई वस्तुओं
  rationale: ἁγιάζω के पूर्ण कर्मवाच्य कृदन्त का निष्प्राण बहुवचन रूप उन वस्तुओं की ओर संकेत करता है जिन्हें पवित्र या समर्पित किया गया था; यह अनुवाद कर्मवाच्य भाव को स्पष्ट रखता है।
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: परमेश्वर के नाम के लिए
  rationale: 'सम्प्रदान कारक पदबंध को यहाँ समर्पण अथवा उद्देश्य के अर्थ में समझना प्रसंगानुकूल है: वस्तुएँ परमेश्वर के नाम के लिए पवित्र की गई थीं। यह ‘नाम के द्वारा’ जैसे साधनवाचक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।'
theological_decisions:
- issue: τῷ ὀνόματι में सम्बन्ध का प्रकार
  choice: परमेश्वर के नाम के लिए
  alternative: परमेश्वर के नाम में / परमेश्वर के नाम से
  rationale: यूनानी सम्प्रदान कारक समर्पण, सम्बन्ध या साधन का भाव दे सकता है। पवित्र वस्तुओं के प्रसंग में समर्पण का अर्थ अधिक स्वाभाविक है, पर पाठ किसी विस्तृत धार्मिक व्याख्या को निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘अशुद्ध कर दिया’ में धार्मिक अपवित्रता का भाव और ‘पवित्र की गई वस्तुओं’ में यूनानी कर्मवाच्य रचना सुरक्षित रखी गई है।
