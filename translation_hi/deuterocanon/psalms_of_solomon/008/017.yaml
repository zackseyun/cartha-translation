lexical_decisions:
- source_word: ἔκρινεν
  choice: निर्णय सुनाया
  rationale: κρίνω का सामान्य अर्थ ‘न्याय करना’ या ‘निर्णय करना’ है। इस प्रसंग में यह यरूशलेम के विरुद्ध युद्ध के अधिकारपूर्ण निर्धारण को व्यक्त करता है; ‘निर्णय सुनाया’ न्यायिक भाव बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: τὸν πόλεμον
  choice: युद्ध
  rationale: πόλεμος सामान्यतः व्यापक युद्ध को दर्शाता है, केवल एक लड़ाई को नहीं।
- source_word: ἐπὶ
  choice: के विरुद्ध
  rationale: युद्ध के लक्ष्य के साथ ἐπί यहाँ शत्रुतापूर्ण दिशा व्यक्त करता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक हिन्दी रूप।
- source_word: γῆν
  choice: भूमि
  rationale: γῆ का अर्थ भूमि, देश या क्षेत्र हो सकता है। ‘भूमि’ मूल की व्यापकता को बनाए रखता है।
- source_word: αὐτῆς
  choice: उसकी
  rationale: यह स्त्रीलिंग यरूशलेम की ओर संकेत करता है। हिन्दी में ‘उसकी’ नगर और उससे संबंधित भूमि के संबंध को स्वाभाविक रूप से व्यक्त करता है।
