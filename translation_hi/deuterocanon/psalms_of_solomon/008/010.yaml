lexical_decisions:
- source_word: υἱὸς
  choice: एक पुत्र
  rationale: प्रतिनिधिक एकवचन को बनाए रखते हुए हिन्दी में वाक्य को स्वाभाविक बनाने के लिए ‘एक’ जोड़ा गया है।
- source_word: μετὰ
  choice: के साथ
  rationale: सम्बन्ध या सहभागिता दर्शाने वाले μετά के सामान्य अर्थ को सीधे व्यक्त करता है।
- source_word: μητρὸς
  choice: माता
  rationale: गरिमापूर्ण आधुनिक हिन्दी का सीधा पारिवारिक शब्द, जो निकट रक्त-सम्बन्ध को स्पष्ट रखता है।
- source_word: πατὴρ
  choice: एक पिता
  rationale: यूनानी प्रतिनिधिक एकवचन और पहले पद के समानान्तर विन्यास को सुरक्षित रखता है।
- source_word: θυγατρὸς
  choice: पुत्री
  rationale: सीधा पारिवारिक शब्द, जो दोनों निषिद्ध सम्बन्धों की सममिति बनाए रखता है।
- source_word: συνεφύροντο
  choice: घुल-मिल रहे थे
  rationale: यह अभिव्यक्ति क्रिया के ‘आपस में मिलना’ वाले रूपक और अपूर्ण भूतकाल की जारी अवस्था को बनाए रखती है; प्रसंग यौन अनाचार की ओर संकेत करता है, पर मुख्य पाठ क्रिया से अधिक स्पष्ट नहीं होता।
theological_decisions:
- issue: क्या निकट सम्बन्धियों के बीच यौन अनाचार को मुख्य पाठ में स्पष्ट कहा जाए
  choice: रूपकात्मक अभिव्यक्ति ‘घुल-मिल रहे थे’ रखी गई।
  alternative: ‘शारीरिक सम्बन्ध बना रहे थे’ या ‘यौन सम्बन्ध में थे’
  rationale: माता–पुत्र और पिता–पुत्री के युग्म अनाचार का संकेत देते हैं, किन्तु यूनानी क्रिया स्वयं ‘मिलने/मिश्रित होने’ का रूपक है। इसलिए मूल की व्यंजना और अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए समझने योग्य हिन्दी। ‘घुल-मिलना’ अकेले सामाजिक मेल-जोल भी जता सकता है, पर यहाँ स्पष्ट पारिवारिक युग्म और पादटिप्पणियाँ इसके निषिद्ध अर्थ को सुरक्षित करती हैं।
