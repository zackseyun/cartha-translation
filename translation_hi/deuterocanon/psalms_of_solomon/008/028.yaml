  text: And the holy ones of God were like lambs in innocence in their midst[a][b][c][d].
translation:
  language: hi
  text: और परमेश्वर के भक्त जन[a] उनके बीच निष्कपटता में मेमनों के समान थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के निष्ठावान जन”; अथवा, “परमेश्वर के पवित्र जन।”
    reason: lexical_alternative
  - marker: b
    text: 'मूल यूनानी में क्रिया नहीं है; इसे “हैं” भी समझा जा सकता है। वाक्यांश का अनुवाद यह भी हो सकता है: “उनके बीच मेमनों के समान, निष्कपट थे।”'
    reason: grammar_and_ambiguity
lexical_decisions:
- source_word: ὅσιοι
  choice: भक्त जन
  rationale: यह शब्द परमेश्वर के प्रति धर्मनिष्ठ और समर्पित लोगों को दर्शाता है। ‘भक्त जन’ ἅγιοι के सामान्य अर्थ ‘पवित्र जन’ से इसका भेद बनाए रखता है और बाद की कलीसियाई पदावली आरोपित नहीं करता।
- source_word: ἀρνία
  choice: मेमनों
  rationale: यूनानी शब्द सामान्य भेड़ों के बजाय मेमनों को दर्शाता है; इससे कोमलता और असुरक्षा का बिंब बना रहता है।
- source_word: ἐν ἀκακίᾳ
  choice: निष्कपटता में
  rationale: मूल में विशेषण नहीं, बल्कि ἐν के साथ भाववाचक संज्ञा है। अपेक्षाकृत शाब्दिक रूप मूल की संरचना और निष्कपटता के नैतिक भाव को सुरक्षित रखता है।
- source_word: ἐν μέσῳ αὐτῶν
  choice: उनके बीच
  rationale: यह स्वाभाविक हिन्दी में स्थान-सूचक अर्थ देता है और ‘उनके’ के पूर्वपद को यूनानी पाठ की तरह अनिर्दिष्ट रहने देता है।
theological_decisions:
- issue: ὅσιοι का धार्मिक आशय
  choice: भक्त जन
  alternative: पवित्र जन / निष्ठावान जन
  rationale: ‘भक्त जन’ धर्मनिष्ठा और परमेश्वर के प्रति समर्पण दोनों को व्यक्त करता है, जबकि ‘पवित्र जन’ ἅγιοι के साथ भेद धुंधला कर सकता है और ‘निष्ठावान जन’ नैतिक-धार्मिक भक्ति के भाव को कुछ कम कर सकता है।
- issue: क्रिया का काल
  choice: थे
  alternative: हैं
  rationale: यूनानी वाक्य में व्यक्त क्रिया नहीं है, पर निकटवर्ती ऐतिहासिक आख्यान भूतकाल का संदर्भ देता है। इसलिए ‘थे’ जोड़ा गया है, जबकि मूल की क्रियारहितता के कारण वर्तमानकाल की व्याकरणिक संभावना को पूरी तरह नकारा नहीं जा सकता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘निष्कपटता में’ सामान्य बोलचाल से थोड़ा औपचारिक है, पर मूल यूनानी की संज्ञात्मक संरचना और संभावित अर्थगत तनाव को सुरक्षित रखता है।
