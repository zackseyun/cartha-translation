    reason: lexical_alternative
lexical_decisions:
- source_word: συνάγαγε
  choice: इकट्ठा कर
  rationale: यह अओरिस्ट आज्ञार्थक क्रिया है, जो प्रार्थना के रूप में बिखरे लोगों को एक साथ लाने की विनती व्यक्त करती है। ‘इकट्ठा कर’ आधुनिक हिन्दी में सहज है और क्रिया के ढंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τὴν διασπορὰν Ἰσραήλ
  choice: इस्राएल के बिखरे हुओं
  rationale: διασπορά का शाब्दिक अर्थ ‘बिखराव’ या ‘प्रवास में बिखरा समुदाय’ है और यहाँ वह सामूहिक रूप से बिखरे इस्राएलियों को सूचित करता है। ‘बिखरे हुओं’ इस मानवीय सामूहिक अर्थ को स्वाभाविक हिन्दी में रखता है; शाब्दिक संज्ञात्मक रूप पादटिप्पणी में दिया गया है।
- source_word: μετὰ ἐλέους
  choice: दया ... के साथ
  rationale: μετά के साथ संबंधकारक यहाँ संगति अथवा रीति का भाव देता है। ‘दया के साथ’ यूनानी संरचना और प्रार्थनात्मक भाव दोनों को स्पष्ट रखता है।
- source_word: χρηστότητος
  choice: भलाई
  rationale: χρηστότης में सद्भावपूर्ण भलाई, कृपालुता और दयालु व्यवहार का भाव है। ‘भलाई’ व्यापक मूल अर्थ को बनाए रखता है और ‘दया’ की केवल पुनरुक्ति नहीं बनता; ‘कृपालुता’ एक संभव विकल्प है।
theological_decisions:
- issue: διασπορά का सामूहिक और ऐतिहासिक-धार्मिक अर्थ
  choice: मुख्य पाठ में ‘इस्राएल के बिखरे हुओं’
  alternative: ‘इस्राएल का बिखराव’ अथवा ‘इस्राएल का प्रवासी समुदाय’
  rationale: यूनानी अमूर्त/सामूहिक संज्ञा उन लोगों की ओर संकेत करती है जो बिखरे हुए हैं। मुख्य पाठ में लोगों को स्पष्ट करना हिन्दी में अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल संज्ञात्मक रूप और उसकी ऐतिहासिक गूँज सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। एकवचन आज्ञार्थक ‘कर’ मूल यूनानी संबोधन की सीधाई बनाए रखता है; कर्ता का नाम मूल में न होने के कारण जोड़ा नहीं गया।
