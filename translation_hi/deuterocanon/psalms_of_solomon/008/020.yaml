- source_word: μετʼ εἰρήνης
  choice: शान्ति से
  rationale: यह हिन्दी में सहज ढंग से शान्तिपूर्ण प्रवेश का भाव देता है और यूनानी पूर्वसर्गीय पद का आशय सुरक्षित रखता है।
- source_word: ἔστησεν τοὺς πόδας αὐτοῦ
  choice: अपने पाँव जमा लिए
  rationale: शाब्दिक शारीरिक बिम्ब को रखते हुए हिन्दी में स्थिर होकर खड़े होने या स्वयं को स्थापित करने का स्वाभाविक भाव देता है।
- source_word: μετὰ ἀσφαλείας πολλῆς
  choice: बड़ी निश्चिन्तता से
  rationale: ἀσφάλεια के सुरक्षा, दृढ़ता और निर्भय स्थिति के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; πολλῆς की तीव्रता ‘बड़ी’ से प्रकट होती है।
