  text: He entered like a father into the house of his sons in peace[b][a]; he set his feet with great security.
translation:
  language: hi
  text: वह एक पिता की तरह शान्ति से अपने पुत्रों के घर[a] में आया; उसने बहुत सुरक्षित रूप से अपने पाँव जमाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पुत्रों का घर।” यूनानी पद को औपचारिक रूप से ‘उसके पुत्रों का घर’ और अधिक मुहावरेदार ढंग से ‘अपने पुत्रों के घर’—दोनों प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसने बहुत बड़ी सुरक्षा के साथ अपने पाँव स्थिर किए।” इसका आशय सुरक्षित रूप से जम जाने या बिना रोक-टोक अपनी स्थिति दृढ़ कर लेने से हो सकता है।
    reason: lexical_alternative
