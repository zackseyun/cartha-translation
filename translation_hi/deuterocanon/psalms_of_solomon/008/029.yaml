  yaml_path: translation/deuterocanon/psalms_of_solomon/008/029.yaml
  text: Praised be the Lord[b][a], who judges the whole earth in his righteousness.
translation:
  language: hi
  text: प्रभु स्तुति के योग्य है[a], जो अपनी धार्मिकता[b] के अनुसार सारी पृथ्वी का न्याय करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की स्तुति हो।”
    reason: αἰνετός को स्तुतिपरक उद्घोष के रूप में भी स्वाभाविक ढंग से व्यक्त किया जा सकता है।
  - marker: b
    text: या, “न्याय”; अथवा, “अपनी धार्मिकता में।”
    reason: δικαιοσύνη का अर्थ धार्मिकता या न्याय हो सकता है, और ἐν को क्षेत्र अथवा रीति के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: αἰνετὸς
  choice: स्तुति के योग्य है
  rationale: यह यूनानी विशेषण ‘प्रशंसनीय/स्तुति के योग्य’ का भाव रखता है और εὐλογητός (‘धन्य’) से उसका भेद बनाए रखता है। हिंदी में यह स्तुतिपरक उद्घोष स्वाभाविक और गरिमापूर्ण है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यह κύριος के लिए प्रचलित, निश्चित धार्मिक उपाधि है; हिंदी में अलग निश्चित उपपद की आवश्यकता नहीं होती।
- source_word: ὁ κρίνων
  choice: जो ... न्याय करता है
  rationale: संज्ञावाची वर्तमान कृदंत को सहज हिंदी संबंधवाचक उपवाक्य में व्यक्त किया गया है; वर्तमान काल प्रभु के चरित्रगत न्याय को दर्शाता है।
- source_word: πᾶσαν τὴν γῆν
  choice: सारी पृथ्वी
  rationale: πᾶσαν का सार्वभौमिक विस्तार और γῆ का यहाँ पृथ्वी/संसार संबंधी अर्थ सुरक्षित रहता है।
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: अपनी धार्मिकता के अनुसार
  rationale: शाब्दिक ‘अपनी धार्मिकता में’ हिंदी में अस्वाभाविक है। ‘के अनुसार’ न्याय करने के मानक अथवा ढंग को स्वाभाविक रूप से व्यक्त करता है, जबकि δικαιοσύνη की व्यापक नैतिक-धार्मिक अर्थछाया ‘धार्मिकता’ में बनी रहती है।
theological_decisions:
- issue: δικαιοσύνη में धार्मिकता और न्याय—दोनों अर्थछायाएँ
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ शब्द परमेश्वर के सही और न्यायपूर्ण चरित्र की व्यापकता को बनाए रखता है; निकटवर्ती ‘न्याय करता है’ के कारण केवल ‘न्याय’ चुनने से अर्थ कुछ संकरा और पुनरुक्तिपूर्ण हो सकता है। वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, स्तुतिपरक और गरिमापूर्ण शैली रखी गई है। ‘स्तुति के योग्य’ मूल यूनानी विशेषण के अधिक निकट है; ‘धन्य है’ से परहेज़ किया गया है क्योंकि वह अलग यूनानी शब्द εὐλογητός का भाव देता है।
