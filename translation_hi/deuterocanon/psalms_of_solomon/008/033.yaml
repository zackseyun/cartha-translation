lexical_decisions:
- source_word: ἐπίστρεψον
  choice: फेर
  rationale: आज्ञार्थक क्रिया परमेश्वर से अपनी करुणा प्रार्थना करने वालों की ओर करने का निवेदन व्यक्त करती है। ‘फेर’ यूनानी क्रिया के दिशात्मक बिंब को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔλεός
  choice: करुणा
  rationale: यहाँ ἔλεος परमेश्वर की दयापूर्ण कृपा को दर्शाता है। ‘करुणा’ अगले खंड के οἰκτείρησον से निकट संबंध रखते हुए भी उसके साथ अनावश्यक शब्दशः पुनरावृत्ति से बचता है।
- source_word: ἐφʼ ἡμᾶς
  choice: हमारी ओर
  rationale: ἐπί का कर्मकारक रूप दिशा को सूचित करता है; ‘हमारी ओर’ उस गति और याचकों की ओर उन्मुखता को स्पष्ट रूप से व्यक्त करता है।
- source_word: οἰκτείρησον
  choice: हम पर दया कर
  rationale: क्रिया सहानुभूतिपूर्ण दया दिखाने की प्रार्थना व्यक्त करती है। ‘हम पर दया कर’ आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और प्रार्थनात्मक है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: संबोधन को हिन्दी में ‘हे’ द्वारा स्पष्ट किया गया है; ‘परमेश्वर’ सामान्य, गरिमापूर्ण और संप्रदाय-निरपेक्ष ईश-संबोधन है।
