  text: I said[a], “They direct their ways in righteousness.” I considered the judgments of God from the creation of heaven and earth[d][c][b]; I declared God righteous in his judgments from of old.
translation:
  language: hi
  text: मैंने कहा[a], “वे धार्मिकता में अपने मार्गों को सीधा करते हैं।” मैंने आकाश और पृथ्वी की सृष्टि के समय से परमेश्वर के न्यायों पर विचार किया; मैंने परमेश्वर को उसके प्राचीन काल से चले आ रहे न्यायों में धर्मी ठहराया[b][c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या विराम-चिह्न लगाकर: “मैंने कहा कि वे धार्मिकता में अपने मार्गों को सीधा करते हैं।”'
    reason: मूल यूनानी पांडुलिपि-परंपरा में आधुनिक उद्धरण-चिह्न नहीं थे; कथन को प्रत्यक्ष या परोक्ष वचन के रूप में पढ़ा जा सकता है।
  - marker: b
    text: या “मैंने परमेश्वर को उसके न्यायों में न्यायोचित ठहराया।”
    reason: ἐδικαίωσα का अधिक शाब्दिक विकल्प सुरक्षित रखने के लिए।
  - marker: c
    text: या “उसके अनादि काल से चले आ रहे न्यायों में।”
    reason: ἀπʼ αἰῶνος प्राचीन काल के साथ-साथ अनादि अथवा सनातन काल का भाव भी दे सकता है।
  - marker: d
    text: या “मैंने परमेश्वर को उसके न्यायों में सही सिद्ध किया।”
    reason: यह विकल्प वक्ता द्वारा परमेश्वर के न्याय की सत्यता स्वीकार करने अथवा उसका समर्थन करने का भाव स्पष्ट करता है।
lexical_decisions:
- source_word: Κατευθύνουσιν
  choice: सीधे करते हैं
  rationale: क्रिया मार्ग को सीधा करने और सही दिशा देने—दोनों का भाव रखती है। ‘अपने मार्ग सीधे करते हैं’ यूनानी मार्ग-बिंब को सुरक्षित रखता है और हिंदी में स्वाभाविक है।
- source_word: ὁδοὺς
  choice: मार्ग
  rationale: यह बहुवचन नैतिक जीवन-पद्धति के रूपक को व्यक्त करता है; हिंदी में ‘मार्ग’ सामूहिक अर्थ में स्वाभाविक रूप से प्रयुक्त हो सकता है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यहाँ शब्द आचरण की नैतिक शुद्धता का द्योतक है, इसलिए ‘न्याय’ की अपेक्षा ‘धार्मिकता’ अधिक उपयुक्त है।
- source_word: ἀνελογισάμην
  choice: विचार किया
  rationale: मध्यवाच्य रूप मनन और विवेचन का भाव देता है; ‘विचार किया’ स्पष्ट और सहज हिंदी है।
- source_word: κρίματα
  choice: न्यायों
  rationale: यह परमेश्वर के न्यायिक निर्णयों और न्याय के कार्यों, दोनों को समेट सकता है। बहुवचन मूल पाठ के अनुरूप रखा गया है।
- source_word: ἐδικαίωσα
  choice: धर्मी ठहराया
  rationale: यह अभिव्यक्ति परमेश्वर को धर्मी बनाने की नहीं, बल्कि उसके धर्मी होने की घोषणा अथवा स्वीकृति की ओर संकेत करती है। साथ ही δικαιοσύνῃ के साथ मूल पाठ की δίκαι- शब्दावली की कड़ी कुछ हद तक बनी रहती है।
- source_word: τοῖς ἀπʼ αἰῶνος
  choice: प्राचीन काल से चले आ रहे
  rationale: यह चयन बड़ी प्राचीनता का भाव व्यक्त करता है, पर वाक्यांश को अनिवार्य रूप से दार्शनिक ‘अनंतता’ का कथन नहीं बनाता। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἐδικαίωσα τὸν θεόν का अर्थ
  choice: मैंने परमेश्वर को ... धर्मी ठहराया
  alternative: मैंने परमेश्वर को उसके न्यायों में सही सिद्ध किया / न्यायोचित ठहराया
  rationale: वक्ता परमेश्वर को धार्मिकता प्रदान नहीं करता, बल्कि उसके न्यायों में उसके धर्मी होने को स्वीकार या घोषित करता है। ‘धर्मी ठहराया’ मूल के δίκαι- शब्द-संबंध को भी उभारता है।
- issue: τοῖς ἀπʼ αἰῶνος का कालगत बल
  choice: प्राचीन काल से चले आ रहे न्याय
  alternative: अनादि काल से उसके न्याय / उसके सनातन न्याय
  rationale: यूनानी वाक्यांश बहुत पुराने समय अथवा अनंतता—दोनों की ओर संकेत कर सकता है। मुख्य पाठ कम निर्णायक अर्थ रखता है और अधिक प्रबल विकल्प पादटिप्पणी में देता है।
- issue: ἀπὸ κτίσεως οὐρανοῦ καὶ γῆς का संबंध
  choice: आकाश और पृथ्वी की सृष्टि के समय से परमेश्वर के न्यायों पर विचार किया
  alternative: आकाश और पृथ्वी की सृष्टि से प्रकट परमेश्वर के न्यायों पर विचार किया
  rationale: मूल पाठ कालगत आरंभ-बिंदु का स्वाभाविक अर्थ देता है, पर संबंध में कुछ संक्षिप्तता है। मुख्य पाठ में ‘के समय से’ इसे सहज हिंदी में व्यक्त करता है, बिना सृष्टि को स्वयं न्यायों का साधन घोषित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘धार्मिकता’ और ‘धर्मी ठहराया’ मूल के साझा δίκαι- शब्द-मूल की वैचारिक कड़ी को यथासंभव बनाए रखते हैं। ‘न्यायों’ का असामान्य किंतु अर्थपूर्ण बहुवचन मूल यूनानी बहुवचन को दर्शाता है।
