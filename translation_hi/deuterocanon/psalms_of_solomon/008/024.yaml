lexical_decisions:
- source_word: ἀπήγαγεν
  choice: बंदी बनाकर ले गया
  rationale: यह क्रिया यहाँ लोगों को हटाकर या निर्वासन में ले जाने का भाव रखती है। प्रसंगानुकूल हिन्दी में ‘बंदी बनाकर ले गया’ उस ठोस अर्थ को स्पष्ट करती है, बिना अनावश्यक हिंसा जोड़े।
- source_word: τοὺς υἱοὺς καὶ τὰς θυγατέρας
  choice: बेटे-बेटियों
  rationale: यूनानी पाठ बेटों और बेटियों दोनों को स्पष्ट रूप से अलग-अलग नाम देता है; हिन्दी का युग्म ‘बेटे-बेटियों’ इसे स्वाभाविक और ठीक रूप में सुरक्षित रखता है।
- source_word: ἃ
  choice: जिन्हें
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम का पूर्वपद बेटे और बेटियाँ हैं; व्यक्तियों के लिए स्वाभाविक हिन्दी में ‘जिन्हें’ उपयुक्त है।
- source_word: ἐγέννησαν
  choice: जन्म दिया था
  rationale: γεννάω जन्म देने या उत्पन्न करने का अर्थ दे सकता है। बहुवचन कर्ता के साथ ‘जन्म दिया था’ माता तक अर्थ को सीमित किए बिना आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐν βεβηλώσει
  choice: अपवित्रता में
  rationale: βεβήλωσις धार्मिक-मौलिक अपवित्रीकरण या अशुद्धि का भाव रखता है। ‘अपवित्रता’ सहज हिन्दी में इस नैतिक-धार्मिक मूल्यांकन को सुरक्षित रखती है।
theological_decisions:
- issue: ἐν βεβηλώσει का नैतिक-धार्मिक बल
  choice: अपवित्रता में
  alternative: अपवित्रीकरण में
  rationale: वाक्य केवल जन्म का जैविक तथ्य नहीं बताता, बल्कि उससे जुड़ी अपवित्र अवस्था या कृत्य पर निर्णय देता है। ‘अपवित्रता में’ इस तनाव को बनाए रखता है, जबकि यह नहीं बताता कि अपवित्रता का ठीक स्वरूप क्या था।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘बंदी बनाकर’ निर्वासन के प्रसंग को स्पष्ट करता है; ‘अपवित्रता’ मूल की धार्मिक और नैतिक अनिश्चितता को बनाए रखती है।
