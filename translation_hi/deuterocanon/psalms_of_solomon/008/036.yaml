  yaml_path: translation/deuterocanon/psalms_of_solomon/008/036.yaml
  text: Do not overlook us[a], our God[b], lest the nations swallow us up as though there were no one to redeem.
translation:
  language: hi
  text: हे हमारे परमेश्वर, हमारी उपेक्षा न कर, कहीं ऐसा न हो कि राष्ट्र हमें निगल जाएँ, मानो हमें छुड़ाने वाला[a] कोई न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उद्धार करने वाला”; इस शब्द में मोल देकर मुक्त कराने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ὑπερίδῃς ἡμᾶς
  choice: हमारी उपेक्षा न कर
  rationale: ὑπεροράω का भाव किसी को अनदेखा करके उसकी सुधि न लेने या उसकी उपेक्षा करने का है। प्रार्थना के संदर्भ में ‘हमारी उपेक्षा न कर’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: ὁ θεὸς ἡμῶν
  choice: हे हमारे परमेश्वर
  rationale: यूनानी पद यहाँ संबोधन के रूप में प्रयुक्त है। ‘हे’ हिंदी में संबोधन को स्पष्ट और प्रार्थना की शैली को गरिमापूर्ण बनाता है।
- source_word: ἵνα μὴ
  choice: कहीं ऐसा न हो कि
  rationale: यहाँ रचना आशंकित परिणाम व्यक्त करती है; ‘कहीं ऐसा न हो कि’ आधुनिक हिंदी में इस भाव को स्वाभाविक ढंग से रखता है।
- source_word: καταπίωσιν ἡμᾶς
  choice: हमें निगल जाएँ
  rationale: क्रिया का ठोस बिंब ‘निगल जाना’ है। इसे बनाए रखने से विनाश या पूर्ण पराजय की तीव्र रूपकात्मक भाषा सुरक्षित रहती है।
- source_word: ἔθνη
  choice: राष्ट्र
  rationale: यह शब्द इस यहूदी प्रार्थना में विदेशी जनसमूहों या राष्ट्रों को सूचित करता है। ‘राष्ट्र’ पारदर्शी है और ‘अन्यजाति’ जैसे बाद के पारिभाषिक या संप्रदायगत रंग से बचता है।
- source_word: ὡς μὴ ὄντος λυτρουμένου
  choice: मानो हमें छुड़ाने वाला कोई न हो
  rationale: यूनानी कृदंत किसी ऐसे व्यक्ति के अभाव को व्यक्त करता है जो छुड़ाने का कार्य कर रहा हो। हिंदी में स्पष्टता के लिए प्रसंग से निहित कर्म ‘हमें’ रखा गया है, जबकि इसे औपचारिक उपाधि नहीं बनाया गया।
theological_decisions:
- issue: λυτρουμένου का अनुवाद
  choice: छुड़ाने वाला
  alternative: उद्धार करने वाला; मोल देकर छुड़ाने वाला
  rationale: मूल धातु में छुड़ाने, बचाने और कभी-कभी मूल्य देकर मुक्त कराने के अर्थ जुड़े हैं। यहाँ संज्ञा या औपचारिक उपाधि के बजाय कृदंत है, इसलिए ‘छुड़ाने वाला’ क्रियात्मक रूप को सुरक्षित रखता है और किसी विशिष्ट मसीही उपाधि को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी की सरल, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर के लिए एकवचन संबोधन ‘कर’ मूल यूनानी के एकवचन आदेशात्मक रूप को दर्शाता है। रूपक ‘निगल जाएँ’ को जानबूझकर अक्षुण्ण रखा गया है।
