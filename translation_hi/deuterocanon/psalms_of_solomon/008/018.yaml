base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/018.yaml
  text: The rulers of the land met him with joy[a]; they said to him, “Blessed is your way. Come[c][b], enter with peace.”
translation:
  language: hi
  text: देश[a] के शासक आनन्द के साथ उससे मिलने आए और उससे कहा, “तुम्हारा मार्ग स्वागतयोग्य[b] है। आइए[c], शांति के साथ प्रवेश कीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “देश” का अनुवाद “धरती” या “भूमि” भी किया जा सकता है; यहाँ स्थानीय-राजनीतिक प्रसंग के कारण “देश” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “तुम्हारा मार्ग वांछित है।” अनुवाद “तुम्हारा मार्ग मनभावना है” भी हो सकता है; कुछ अनुवादों में “तुम्हारा मार्ग धन्य है।”'
    reason: lexical_alternative
  - marker: c
    text: “आइए” और “प्रवेश कीजिए” के यूनानी क्रियारूप बहुवचन हैं; हिंदी के सम्मानसूचक रूप एक व्यक्ति और उसके साथ आए लोगों—दोनों के लिए समझे जा सकते हैं।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἠπάντησαν αὐτῷ
  choice: उससे मिलने आए
  rationale: क्रिया में किसी के स्वागत के लिए सामने जाकर मिलने का भाव हो सकता है। केवल ‘मिले’ की अपेक्षा यह चयन उस स्वागत-दृश्य को स्वाभाविक हिंदी में अधिक स्पष्ट करता है, बिना ‘अभिवादन किया’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: οἱ ἄρχοντες τῆς γῆς
  choice: देश के शासक
  rationale: ἄρχοντες राजनीतिक अथवा सामाजिक शासकों को सूचित करता है। प्रसंग में γῆ का स्थानीय-राजनीतिक अर्थ ‘देश’ अधिक उपयुक्त है, यद्यपि इसका अर्थ ‘धरती’ भी हो सकता है।
- source_word: μετὰ χαρᾶς
  choice: आनन्द के साथ
  rationale: यह यूनानी पद आनन्दपूर्ण रीति से स्वागत करने का सीधा भाव व्यक्त करता है; हिंदी पद मूल संरचना और अर्थ दोनों को बनाए रखता है।
- source_word: Εὐκτὴ ἡ ὁδός σου
  choice: तुम्हारा मार्ग स्वागतयोग्य है
  rationale: Εὐκτή का मूल भाव ‘वांछित, मनचाहा, स्वागतयोग्य’ है, न कि अनिवार्यतः धार्मिक अर्थ में ‘धन्य’। ‘मार्ग’ ὁδός की स्थानिक और रूपक दोनों संभावनाएँ बनाए रखता है।
- source_word: δεῦτε εἰσέλθατε
  choice: आइए, प्रवेश कीजिए
  rationale: दोनों यूनानी क्रियारूप बहुवचन आमंत्रण/आज्ञा हैं। हिंदी के सम्मानसूचक रूप प्रसंगानुकूल हैं और एक सम्मानित व्यक्ति तथा उसके साथियों को संबोधित करने—दोनों की संभावना रखते हैं।
- source_word: μετʼ εἰρήνης
  choice: शांति के साथ
  rationale: यह मूल की μετὰ-संरचना के निकट है और शांतिपूर्ण अथवा सुरक्षित प्रवेश के भाव को खुला रखता है।
theological_decisions:
- issue: Εὐκτή को धार्मिक आशीर्वाद के रूप में समझना
  choice: स्वागतयोग्य
  alternative: धन्य
  rationale: यूनानी विशेषण मुख्यतः ‘वांछित’ या ‘मनचाहा’ होने का भाव देता है। ‘धन्य’ संभव व्याख्यात्मक अनुवाद है, पर वह मूल में अनिवार्य न होने वाला धार्मिक रंग जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘आनन्द’, ‘मार्ग’, ‘शांति’ और ‘प्रवेश’ व्यापक रूप से समझे जाने वाले साहित्यिक शब्द हैं। संवाद में सम्मानसूचक क्रियारूप राजनीतिक स्वागत के प्रसंग के अनुकूल हैं।
