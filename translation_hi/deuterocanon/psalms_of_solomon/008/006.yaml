lexical_decisions:
- source_word: ἐφοβήθη
  choice: डर गया
  rationale: यह रूप यहाँ भय की अवस्था या उसके आरम्भ को व्यक्त करता है। ‘डर गया’ सहज आधुनिक हिन्दी है और यूनानी के अर्थ के निकट रहता है।
- source_word: ἡ καρδία μου
  choice: मेरा हृदय
  rationale: ‘हृदय’ मूल पाठ की ठोस मानवीय छवि को बनाए रखता है; इसे ‘मन’ या ‘अंतरात्मा’ कहना अधिक व्याख्यात्मक होता।
- source_word: ἐταράχθη
  choice: हिल उठीं
  rationale: क्रिया विक्षोभ, हलचल या काँपने का भाव दे सकती है। हड्डियों और सन की उपमा के साथ ‘हिल उठीं’ शारीरिक कम्पन को स्वाभाविक हिन्दी में व्यक्त करता है, पर हिंसक झटके का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: τὰ ὀστᾶ μου
  choice: मेरी हड्डियाँ
  rationale: मूल का शाब्दिक और सजीव शारीरिक बिम्ब सुरक्षित रखा गया है।
- source_word: ὡς
  choice: के समान
  rationale: यह तुलना सूचित करता है; ‘के समान’ पद्यात्मक किंतु सहज हिन्दी है।
- source_word: λίνον
  choice: सन
  rationale: λίνον सन के पौधे/रेशे अथवा उससे बने लिनन कपड़े को सूचित कर सकता है। ‘सन’ कच्चे पदार्थ की छवि और मूल की कठिन उपमा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
