  yaml_path: translation/deuterocanon/psalms_of_solomon/008/015.yaml
  text: Therefore God mixed for them a spirit of delusion[a]; he made them drink a cup of undiluted wine to drunkenness.
translation:
  language: hi
  text: इसलिए परमेश्वर ने उनके लिए भटकाव की आत्मा मिला दी[a]; उसने उन्हें बिना पानी मिलाए दाखमधु का प्याला पिलाया, यहाँ तक कि वे मतवाले हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मुद्रित यूनानी पाठ में यहाँ एक कठिन रूप εὕρε है; यशायाह 19:14 के यूनानी पाठ से संकेत मिलता है कि मूल पाठ सम्भवतः “भटकाव की आत्मा” था। अन्य सम्भव अनुवाद: “भटकाव का घूँट।”'
    reason: प्राप्त पाठ की समस्या और उससे निकली वास्तविक अनुवाद-अनिश्चितता को स्पष्ट करना।
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पद पिछले आरोपों से निकलने वाले दंडात्मक निष्कर्ष को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκέρασεν
  choice: मिला दी
  rationale: क्रिया का मूल अर्थ पेय को मिलाना है; यहाँ आगे आने वाले प्याले और दाखमधु के बिंब के कारण उसी ठोस रूपक को बनाए रखा गया है।
- source_word: πνεῦμα πλανήσεως (प्रत्यक्ष पाठ में εὕρε πλανήσεως)
  choice: भटकाव की आत्मा
  rationale: मुद्रित εὕρε संभवतः पाठ/OCR-विकृति है; यशायाह 19:14 के यूनानी पाठ से स्पष्ट संकेत πνεῦμα πλανήσεως की ओर है। 'भटकाव' πλάνη की नैतिक और आत्मिक दिशाभ्रांति को अनावश्यक व्याख्या के बिना रखता है।
- source_word: ἐπότισεν αὐτοὺς
  choice: उसने उन्हें … पिलाया
  rationale: यह स्वाभाविक हिन्दी में किसी को पेय देने या पिलाने का अर्थ रखता है और न्याय के रूप में परमेश्वर की सक्रियता बनाए रखता है।
- source_word: ποτήριον οἴνου ἀκράτου
  choice: बिना पानी मिलाए दाखमधु का प्याला
  rationale: ἀκράτου ऐसे दाखमधु को दर्शाता है जिसे प्राचीन प्रथा के अनुसार पानी से पतला नहीं किया गया था। यह वाक्यांश 'अमिश्रित' की तुलना में सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: εἰς μέθην
  choice: यहाँ तक कि वे मतवाले हो गए
  rationale: εἰς को यहाँ परिणाम के रूप में लिया गया है; यह हिन्दी में स्वाभाविक है और नशे की अंतिम अवस्था को स्पष्ट रखता है।
theological_decisions:
- issue: क्या परमेश्वर केवल अनुमति देता है या सक्रिय रूप से न्याय करता है
  choice: परमेश्वर ने … मिला दी; उसने … पिलाया
  alternative: परमेश्वर ने उन्हें भटकने दिया
  rationale: यूनानी क्रियाएँ परमेश्वर को सक्रिय कर्ता के रूप में प्रस्तुत करती हैं। पाठ की कठिन धार्मिक धार को अनुमति-मात्र में बदलकर नरम नहीं किया गया।
- issue: πλανήσεως का स्वरूप
  choice: भटकाव
  alternative: भ्रम / धोखा
  rationale: '''भटकाव'' दिशाभ्रष्टता और गलत मार्ग पर जाने की व्यापकता को बचाता है तथा किसी विशिष्ट दार्शनिक या सांप्रदायिक अर्थ को नहीं थोपता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। पेय मिलाने, प्याले और मतवालेपन के संयुक्त न्याय-बिंब को बनाए रखा गया है; 'दाखमधु' बाइबलीय काव्य-भाषा के अनुकूल है।
