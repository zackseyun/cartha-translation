  yaml_path: translation/deuterocanon/psalms_of_solomon/008/014.yaml
  text: They omitted no sin that they did not commit[a], beyond the nations.
translation:
  language: hi
  text: उन्होंने कोई भी ऐसा पाप नहीं छोड़ा, जिसे उन्होंने राष्ट्रों से बढ़कर न किया हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने कोई पाप किए बिना नहीं छोड़ा; वे राष्ट्रों से भी आगे निकल गए।”
    reason: यूनानी में ‘राष्ट्रों से बढ़कर’ का संबंध निकटवर्ती क्रिया से या पूरे कथन के सार से समझा जा सकता है।
lexical_decisions:
- source_word: παρέλειπον
  choice: छोड़ा
  rationale: यह क्रिया किसी काम को छोड़ देने या बिना किए रहने का भाव रखती है। ‘कोई पाप नहीं छोड़ा’ यूनानी की पूर्णता और हिन्दी के स्वाभाविक मुहावरे—दोनों को बनाए रखता है।
- source_word: ἁμαρτίαν
  choice: पाप
  rationale: ‘पाप’ यूनानी शब्द का सीधा और प्रचलित नैतिक-धार्मिक अर्थ व्यक्त करता है।
- source_word: ἐποίησαν
  choice: किया
  rationale: क्रिया का मूल अर्थ ‘करना’ है; हिन्दी में ‘पाप करना’ स्वाभाविक प्रयोग है और यूनानी की सामान्य क्रिया को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: ὑπὲρ τὰ ἔθνη
  choice: दूसरे राष्ट्रों से बढ़कर
  rationale: ὑπέρ यहाँ तुलना में अतिक्रमण या अधिकता दर्शाता है। ‘से बढ़कर’ इस तुलनात्मक बल को व्यक्त करता है, जबकि ‘दूसरे राष्ट्रों’ से ἔθνη का बहुवचन और अन्य लोगों/राष्ट्रों से तुलना बनी रहती है।
theological_decisions:
- issue: ὑπὲρ τὰ ἔθνη का वाक्य में संबंध
  choice: 'इसे सापेक्ष उपवाक्य ‘जिसे…न किया हो’ के साथ रखा गया है: ‘दूसरे राष्ट्रों से बढ़कर न किया हो।’'
  alternative: 'इसे पूरे कथन के परिणाम या सार के रूप में पढ़ना: ‘उन्होंने कोई भी पाप किए बिना नहीं छोड़ा; वे दूसरे राष्ट्रों से भी आगे निकल गए।’'
  rationale: यूनानी शब्दक्रम ὑπὲρ τὰ ἔθνη को ἐποίησαν के निकट रखता है, पर इसका संबंध कुछ हद तक खुला है। मुख्य पाठ संरचना को निकटता से रखता है और पाद-टिप्पणी अधिक मुहावरेदार वैकल्पिक समझ देती है, बिना नैतिक तुलना को सिद्धांतगत रूप से अधिक स्पष्ट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर किन्तु सामान्य पाठक के लिए सुबोध रूप। ‘जातियों’ से आधुनिक हिन्दी में जाति-व्यवस्था का अनचाहा अर्थ निकल सकता है, इसलिए ἔθνη के लिए ‘दूसरे राष्ट्रों’ चुना गया है। यूनानी की दोहरी नकारात्मक संरचना मुख्य पाठ में जानबूझकर कुछ हद तक सुरक्षित रखी गई है।
