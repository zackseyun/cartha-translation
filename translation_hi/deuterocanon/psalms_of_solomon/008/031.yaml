lexical_decisions:
- source_word: ἔδοσαν
  choice: देखे हैं
  rationale: प्राप्त यूनानी पाठ में क्रिया का शाब्दिक अर्थ ‘दिया’ है, पर ‘हमारी आँखें’ कर्ता और ‘तेरे न्याय’ कर्म होने पर वाक्य कठिन है। पिछले पद में परमेश्वर द्वारा अपना न्याय दिखाने के संदर्भ में देखने का भाव सबसे स्वाभाविक है; पाठगत कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: τὰ κρίματά σου
  choice: तेरे न्याय के काम
  rationale: κρίματα यहाँ परमेश्वर के न्यायिक निर्णयों के साथ उनके प्रकट न्यायकारी कार्यों को भी सूचित कर सकता है। ‘न्याय के काम’ हिन्दी में प्रसंगानुकूल और सहज है।
- source_word: ἐδικαιώσαμεν
  choice: हमने ... न्यायसंगत ठहराया है
  rationale: क्रिया का मूल भाव किसी को सही या न्यायपूर्ण ठहराना है। यह अनुवाद मनुष्यों द्वारा परमेश्वर को धर्मी बनाने का अर्थ दिए बिना उसके नाम की न्यायपूर्णता को स्वीकार करने का भाव रखता है।
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: तेरे आदरणीय नाम
  rationale: ἔντιμος सम्मान और प्रतिष्ठा के योग्य होने का भाव देता है; ‘आदरणीय’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: εἰς αἰῶνας
  choice: सदा
  rationale: यह पदबंध निरंतर और चिरस्थायी अवधि व्यक्त करता है; ‘सदा’ संक्षिप्त तथा काव्यात्मक हिन्दी समतुल्य है।
theological_decisions:
- issue: परमेश्वर के नाम को ἐδικαιώσαμεν का कर्म मानते हुए अनुवाद
  choice: हमने तेरे आदरणीय नाम को सदा न्यायसंगत ठहराया है
  alternative: हमने तेरे आदरणीय नाम को सदा निर्दोष सिद्ध किया है
  rationale: ‘न्यायसंगत ठहराया’ स्रोत के δικαιόω से निकट रहते हुए यह बताता है कि वक्ताओं ने परमेश्वर के प्रकट न्याय के प्रत्युत्तर में उसके नाम की न्यायपूर्णता मानी और घोषित की; यह परमेश्वर को मनुष्यों से धार्मिकता प्राप्त होने का संकेत नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। प्रार्थना-संबोधन में ‘तेरे’ का प्रयोग निकटता और भजनात्मक परंपरा के अनुरूप है। यूनानी की असामान्य पहली क्रिया को मुख्य पाठ में स्पष्ट अर्थ और पादटिप्पणी में शाब्दिक कठिनाई सहित प्रस्तुत किया गया है।
