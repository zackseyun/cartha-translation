  text: Praised is the Lord in his judgments in the mouth of the holy ones[d][c][b][a], and blessed is Israel by the Lord forever.
translation:
  language: hi
  text: अपने न्यायों में प्रभु भक्तजनों के मुख से स्तुत्य हैं[a], और इस्राएल प्रभु के द्वारा सदा धन्य है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “अपने न्यायों में, भक्तजनों के मुख में प्रभु स्तुत्य हैं।”'
    reason: मूल यूनानी में दोनों संबंधों के लिए ἐν (‘में’) आया है; मुख्य पाठ में ‘भक्तजनों के मुख से’ हिंदी का स्वाभाविक प्रयोग है।
  - marker: b
    text: 'या: “और इस्राएल प्रभु के द्वारा सदा धन्य हो।”'
    reason: εὐλογημένος को घोषणात्मक कथन के बजाय आशीर्वचन के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: αἰνετὸς
  choice: स्तुति पाते हैं
  rationale: यह विधेयात्मक विशेषण प्रभु को प्रशंसा-योग्य अथवा प्रशंसित बताता है। हिंदी में ‘स्तुति पाते हैं’ वाक्य को स्वाभाविक रखते हुए भक्तजनों के मुख से व्यक्त स्तुति का भाव स्पष्ट करता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: परमेश्वर के लिए प्रयुक्त इस उपाधि का प्रचलित, गरिमापूर्ण हिंदी रूप।
- source_word: ἐν τοῖς κρίμασιν αὐτοῦ
  choice: अपने न्यायों के कारण
  rationale: यहाँ ἐν स्तुति के आधार या प्रसंग को सूचित कर सकता है। ‘न्यायों’ κρίματα की न्यायिक कार्रवाइयों अथवा निर्णयों की व्यापकता बनाए रखता है।
- source_word: ἐν στόματι
  choice: मुख से
  rationale: यूनानी चित्र शाब्दिक रूप से ‘मुख में’ है, पर आशय मुख द्वारा बोली गई स्तुति है; ‘मुख से’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: ὁσίων
  choice: भक्तजनों
  rationale: ὅσιος परमेश्वर के प्रति निष्ठावान और धर्मपरायण लोगों को दर्शाता है। ‘भक्तजन’ इसे ἅγιοι के सामान्य अनुवाद ‘पवित्र जन’ से अलग रखते हुए सांप्रदायिक अर्थ से बचाता है।
- source_word: εὐλογημένος
  choice: धन्य है
  rationale: विधेयात्मक विशेषण को कथन के रूप में रखा गया है, जिससे पहली पंक्ति के घोषणात्मक स्वर के साथ समानता बनी रहती है।
- source_word: Ἰσραήλ
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: ὑπὸ Κυρίου
  choice: प्रभु के द्वारा
  rationale: 'ὑπό के साथ संबंधकारक कर्ता या साधक को दर्शाता है: प्रभु इस्राएल को धन्य करते हैं।'
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह मुहावरा अनवरत और स्थायी अवधि व्यक्त करता है; ‘सदा’ संक्षिप्त और स्वाभाविक हिंदी समतुल्य है।
theological_decisions:
- issue: ὁσίων की पहचान
  choice: भक्तजनों
  alternative: पवित्र जन; विश्वासयोग्य जन
  rationale: मूल शब्द परमेश्वर के प्रति भक्ति और निष्ठा पर बल देता है। ‘भक्तजन’ इसे किसी विशिष्ट कलीसियाई वर्ग या ἅγιοι की शब्दावली के साथ मिलाने से बचाता है।
- issue: εὐλογημένος का वाक्य-भाव
  choice: इस्राएल…धन्य है
  alternative: इस्राएल…धन्य हो
  rationale: यूनानी रूप अपने आप में घोषणात्मक और आशीर्वचनात्मक दोनों रंग ग्रहण कर सकता है। समानांतर पहली पंक्ति को देखते हुए मुख्य पाठ में घोषणात्मक रूप रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘भक्तजन’ ὅσιοι की भक्ति-निष्ठा को व्यक्त करता है और ‘पवित्र जन’ से उत्पन्न संभावित पारिभाषिक भ्रम से बचता है। वाक्य की दो समानांतर प्रशंसात्मक धाराएँ सुरक्षित रखी गई हैं।
