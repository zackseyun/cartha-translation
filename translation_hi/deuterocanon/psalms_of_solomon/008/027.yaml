lexical_decisions:
- source_word: ἐδικαίωθη
  choice: धर्मी ठहरा
  rationale: δικαιόω के कर्मवाच्य रूप का आशय यहाँ यह नहीं कि परमेश्वर धर्मी बना, बल्कि यह कि उसके न्यायों में उसकी धार्मिकता प्रमाणित हुई। ‘धर्मी ठहरा’ इस न्यायिक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: κρίμασιν
  choice: न्यायों
  rationale: κρίμασιν न्यायिक निर्णयों अथवा न्याय के कार्यों को सूचित करता है। ‘न्यायों’ मूल की बहुवचनता और विधिक-नैतिक भाव दोनों को सुरक्षित रखता है।
- source_word: ἔθνεσι
  choice: राष्ट्रों
  rationale: यहाँ ἔθνεσι पृथ्वी के विभिन्न राष्ट्रों या जातीय समुदायों के व्यापक अर्थ में है; इसे केवल यहूदियों के विपरीत ‘गैर-यहूदियों’ तक सीमित करना आवश्यक नहीं है।
- source_word: τῆς γῆς
  choice: पृथ्वी के
  rationale: ‘राष्ट्रों’ के साथ यह पदबंध सार्वभौमिक अर्थ देता है—‘पृथ्वी के राष्ट्र’; इस संदर्भ में ‘देश के’ अपेक्षाकृत संकीर्ण होगा।
theological_decisions:
- issue: परमेश्वर के लिए प्रयुक्त ἐδικαίωθη को कैसे व्यक्त किया जाए
  choice: धर्मी ठहरा
  alternative: सही सिद्ध हुआ
  rationale: ‘धर्मी ठहरा’ मूल के न्यायिक और धार्मिक दोनों आयामों को बचाता है तथा यह संकेत नहीं देता कि परमेश्वर पहले अधर्मी था और बाद में धर्मी बना। वैकल्पिक ‘सही सिद्ध हुआ’ सार्वजनिक प्रमाण के भाव को अधिक स्पष्ट करता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
