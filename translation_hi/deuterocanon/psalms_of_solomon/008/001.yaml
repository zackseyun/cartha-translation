  yaml_path: translation/deuterocanon/psalms_of_solomon/008/001.yaml
  text: My ear heard distress and the sound of war[a], the sound of a trumpet sounding slaughter and destruction[c][b];
translation:
  language: hi
  text: मेरे कान ने संकट और युद्ध की आवाज़ सुनी—तुरही की आवाज़, जो मार-काट और विनाश का नाद कर रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θλίψιν
  choice: संकट
  rationale: यह शब्द भारी दबाव, क्लेश या विपत्ति को व्यक्त करता है। यहाँ युद्ध की तत्काल भयावहता के संदर्भ में ‘संकट’ स्वाभाविक और व्यापक है।
- source_word: φωνὴν
  choice: आवाज़
  rationale: सुनाई देने वाली ध्वनि के अर्थ में ‘आवाज़’ युद्ध और तुरही—दोनों के साथ सहज है तथा यूनानी में हुई पुनरावृत्ति को बनाए रखता है।
- source_word: πολέμου
  choice: युद्ध
  rationale: यह यूनानी शब्द का सीधा और व्यापक समतुल्य है; ‘लड़ाई’ की अपेक्षा पूरे युद्ध-संकट का बोध कराता है।
- source_word: τὸ οὖς μου
  choice: मेरे कान ने
  rationale: मूल का एकवचन शारीरिक बिंब जानबूझकर सुरक्षित रखा गया है; इसे केवल ‘मैंने सुना’ बनाना उस सजीवता को घटा देता।
- source_word: σάλπιγγος
  choice: तुरही
  rationale: सैन्य संकेत देने वाले वाद्य के लिए यह मानक, प्रतिष्ठित और सामान्य पाठक के लिए परिचित हिन्दी शब्द है।
- source_word: ἠχούσης
  choice: नाद कर रही थी
  rationale: यह ‘आवाज़’ की भद्दी पुनरुक्ति से बचते हुए बजने या गूँजने की क्रिया व्यक्त करता है। साथ के कर्म ‘मार-काट और विनाश’ को कृत्रिम रूप से केवल ‘घोषित करना’ नहीं बनाता।
- source_word: σφαγὴν
  choice: मार-काट
  rationale: यह हिंसक और व्यापक वध की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὄλεθρον
  choice: विनाश
  rationale: यह व्यापक विध्वंस और नाश का सीधा, गंभीर समतुल्य है तथा ‘मार-काट’ के साथ चरम प्रभाव बनाता है।
