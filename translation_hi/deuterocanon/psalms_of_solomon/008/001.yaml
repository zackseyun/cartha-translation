  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, श्रव्य और काव्यात्मक गद्य रखा गया है। मूल के ‘मेरे कान ने’ जैसे शारीरिक बिंब और ‘आवाज़’ की पुनरावृत्ति को सुरक्षित रखते हुए ἠχούσης के लिए ‘नाद कर रही थी’ चुना गया है, ताकि अर्थ स्पष्ट रहे और अनावश्यक व्याख्या न जोड़ी जाए।
