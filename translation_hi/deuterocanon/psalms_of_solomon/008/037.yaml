  text: और तू आरम्भ से हमारा परमेश्वर है, हे प्रभु; तुझ पर हमारी आशा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπʼ ἀρχῆς
  choice: आरम्भ से
  rationale: यूनानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप; इसमें किसी निश्चित सृष्टि-संबंधी व्याख्या को जोड़े बिना कालगत अर्थ सुरक्षित रहता है।
- source_word: ἐπὶ σὲ ἡ ἐλπὶς ἡμῶν
  choice: हमारी आशा तुझ पर ही टिकी है
  rationale: ἐπί के आधार/निर्भरता के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; 'ही' वाक्य में सर्वनाम की अग्रस्थिति से मिलने वाले बल को दर्शाता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को 'हे' के साथ स्पष्ट किया गया है और Κύριος का प्रचलित, गरिमापूर्ण हिन्दी पर्याय रखा गया है।
theological_decisions:
- issue: परमेश्वर के आरम्भ से होने या आरम्भ से 'हमारा परमेश्वर' होने का वाक्यगत संबंध
  choice: आरम्भ से तू ही हमारा परमेश्वर है
  alternative: तू आरम्भ से हमारा परमेश्वर है
  rationale: मूल में 'हमारा परमेश्वर' और 'आरम्भ से' साथ आते हैं। चुना हुआ रूप उसी संबंध को बनाए रखता है और ऐसा नहीं कहता कि परमेश्वर का स्वयं कोई आरम्भ था।
