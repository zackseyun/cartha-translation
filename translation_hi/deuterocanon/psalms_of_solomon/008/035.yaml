lexical_decisions:
- source_word: πίστις σου
  choice: आपकी विश्वासयोग्यता
  rationale: परमेश्वर को संबोधित इस पद में πίστις का आशय उनकी स्थिर निष्ठा या भरोसेमंदी होना अधिक स्वाभाविक है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: μεθʼ ἡμῶν
  choice: हमारे साथ है
  rationale: यह संबंधसूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐσκληρύναμεν τράχηλον ἡμῶν
  choice: हमने अपनी गर्दन हठीली कर ली
  rationale: यूनानी के सामूहिक एकवचन ‘गर्दन’ और हठ के बाइबलीय रूपक को सुरक्षित रखते हुए हिन्दी में अर्थबोध कराया गया है।
- source_word: παιδευτής
  choice: अनुशासन देनेवाले
  rationale: यह शब्द शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन—तीनों का संकेत देता है; यह रूप केवल ‘शिक्षक’ या अत्यधिक कठोर ‘दंड देनेवाले’ से अधिक संतुलित है।
theological_decisions:
- issue: परमेश्वर के संदर्भ में πίστις σου का अर्थ
  choice: आपकी विश्वासयोग्यता
  alternative: आपका विश्वास
  rationale: संदर्भ में परमेश्वर की अपने लोगों के प्रति स्थिर निष्ठा अभिप्रेत होना अधिक संभावित है, पर शब्द की वास्तविक वैकल्पिक संभावना पादटिप्पणी में सुरक्षित है।
- issue: पहले καὶ का संबंध
  choice: पर
  alternative: और
  rationale: परमेश्वर की विश्वासयोग्यता और लोगों की हठधर्मिता के बीच स्पष्ट विरोध है; emphatic ἡμεῖς के साथ καὶ को विरोधसूचक समझना प्रसंगानुकूल है, यद्यपि अधिक औपचारिक रूप ‘और’ संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण ईश-संबोधन (‘आप’) रखा गया है। भाषा सहज किंतु गरिमापूर्ण है; मूल का गर्दन-वाला रूपक और विश्वास/विश्वासयोग्यता की अर्थगत अनिश्चितता सुरक्षित रखी गई है।
