    text: या, “बहुत बड़ी आग का तूफ़ान, जो वीराने से होकर बहाया जा रहा हो।” यूनानी में ‘बहाया जा रहा हो’ के लिए प्रयुक्त कृदन्त व्याकरणतः ‘आग’ के शब्द से सहमत है।
