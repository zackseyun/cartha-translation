lexical_decisions:
- source_word: φωνὴ
  choice: आवाज़
  rationale: यहाँ शब्द भीड़ से उत्पन्न सुनाई देने वाली ध्वनि को दर्शाता है; ‘आवाज़’ आधुनिक हिन्दी में स्वाभाविक है और ‘स्वर’ की सम्भावना को भी पूरी तरह नकारता नहीं।
- source_word: λαοῦ πολλοῦ
  choice: एक बड़ी भीड़ की
  rationale: λαός सामूहिक रूप से लोगों को और πολλοῦ उनकी बड़ी संख्या या विशालता को व्यक्त करता है; इस ध्वनि-चित्र में ‘बड़ी भीड़’ सहज और सटीक है।
- source_word: ἀνέμου πολλοῦ σφόδρα
  choice: बहुत प्रचण्ड हवा
  rationale: πολλοῦ और σφόδρα का संयुक्त बल हवा की अत्यधिक तीव्रता पर है; ‘बहुत प्रचण्ड’ इस दोहरे ज़ोर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καταιγὶς
  choice: तूफ़ान
  rationale: ‘तूफ़ान’ आधुनिक हिन्दी में स्पष्ट है और यूनानी शब्द की प्रबल, झंझावाती छवि को व्यक्त करता है।
- source_word: πυρὸς πολλοῦ
  choice: बड़ी आग का
  rationale: यह यूनानी पद शाब्दिक रूप से ‘बहुत आग का’ है; ‘बड़ी आग’ हिन्दी में अधिक स्वाभाविक रहते हुए उसके विस्तार और प्रचण्डता को व्यक्त करती है।
- source_word: φερομένου διʼ ἐρήμου
  choice: वीराने से होकर उमड़ता चला जा रहा हो
  rationale: φερομένου आगे बहाए या ले जाए जाने की गतिशीलता दिखाता है। ‘उमड़ता चला जा रहा’ उस वेग को स्वाभाविक हिन्दी में सामने लाता है, और ‘वीराना’ ἔρημος के निर्जन भूभाग का भाव रखता है।
