lexical_decisions:
- source_word: τὰ ἅγια τοῦ θεοῦ
  choice: परमेश्वर की पवित्र वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन τὰ ἅγια का सबसे स्वाभाविक अर्थ परमेश्वर से संबंधित पवित्र वस्तुएँ है। यह अनुवाद यूनानी की व्यापकता बनाए रखता है और अनावश्यक रूप से इसे केवल ‘पवित्रस्थान’ नहीं बनाता।
- source_word: διηρπάζοντο
  choice: लूटी जा रही थीं
  rationale: अपूर्ण काल का रूप जारी अथवा बार-बार होनेवाली हिंसक लूट को व्यक्त करता है; हिंदी में यह प्रयोग उस निरंतरता और अपवित्र ढंग से छीन लिए जाने, दोनों को स्वाभाविक रूप से प्रकट करता है।
- source_word: ὡς μὴ ὄντος
  choice: मानो ... न हो
  rationale: यह तुलना उस स्तब्धकारी व्यवहार को दिखाती है जिसमें लूट ऐसे हो रही थी जैसे संबंधित व्यक्ति का अस्तित्व ही न हो।
- source_word: κληρονόμου
  choice: वारिस
  rationale: यह संज्ञा सामान्यतः ‘वारिस’ को दर्शाती है। मुख्य पाठ में इसे रक्षक या छुड़ानेवाला भर कहने के बजाय इसका सीधा अर्थ सुरक्षित रखा गया है।
- source_word: λυτρουμένου
  choice: उन्हें छुड़ानेवाला
  rationale: मध्यवाच्य कृदंत छुटकारा दिलाने अथवा अपने अधिकार में वापस लेने का भाव रखता है। ‘छुड़ानेवाला’ आधुनिक हिंदी में स्पष्ट है और ‘वारिस’ के साथ उसका संबंध बनाए रखता है।
