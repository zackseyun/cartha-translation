  verdict: revise
  source_fidelity: The draft accurately renders the public exposure of sins (ἀνεκάλυψεν ... ἐναντίον τοῦ ἡλίου), the universal scope of πᾶσα ἡ γῆ, and the divine κρίματα. The aorist ἔγνω is adequately conveyed by “जान गई.”
  naturalness: “धर्ममय निर्णय” is understandable but is not idiomatic modern standard Hindi for judicial judgments and can sound abstract or archaic. “न्यायपूर्ण निर्णय” is clearer and natural while retaining the force of δίκαια.
  terminology: “पापों,” “सूर्य के सामने,” and “निर्णयों” are suitable. Rendering δίκαια as “न्यायपूर्ण” best fits κρίματα in contemporary Hindi. “धर्मसंगत” is a viable lexical alternative, though it is slightly less direct in this judicial context.
  issues:
  - severity: medium
    issue: The main-text phrase “धर्ममय निर्णयों” is stylistically unnatural in modern Hindi.
    rationale: For judgments, contemporary Hindi normally uses “न्यायपूर्ण,” “न्यायसंगत,” or, less directly, “धर्मसंगत.” “धर्ममय” may be heard as ‘religious/pious’ rather than as the just or righteous quality of judgments.
