  yaml_path: translation/deuterocanon/psalms_of_solomon/008/008.yaml
  text: God exposed their sins before the sun[a]; all the earth came to know the righteous judgments of God.
translation:
  language: hi
  text: परमेश्वर ने उनके पापों को सूर्य के सामने उजागर कर दिया; सारी पृथ्वी परमेश्वर के न्यायपूर्ण निर्णयों[a] को जान गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मसंगत निर्णय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάλυψεν
  choice: उजागर कर दिया
  rationale: यह क्रिया छिपी हुई बात को प्रकट और सबके सामने कर देने का भाव रखती है; प्रसंग में सार्वजनिक रूप से लज्जित किए जाने का संकेत भी बना रहता है।
- source_word: ἁμαρτίας
  choice: पापों
  rationale: ἁμαρτία का मानक, स्पष्ट और प्रसंगानुकूल हिन्दी अनुवाद।
- source_word: ἐναντίον τοῦ ἡλίου
  choice: सूर्य के सामने
  rationale: यूनानी बिंब को सीधे सुरक्षित रखता है और खुले, सार्वजनिक प्रकाश में प्रकट किए जाने का भाव देता है; इसे मुहावरेदार ‘सूर्य के नीचे’ बनाना स्रोत से अधिक व्याख्यात्मक होता।
- source_word: ἔγνω
  choice: जान गई
  rationale: अओरिस्ट क्रिया को स्वाभाविक हिन्दी में परिणामस्वरूप प्राप्त ज्ञान के रूप में व्यक्त करता है।
- source_word: πᾶσα ἡ γῆ
  choice: सारी पृथ्वी
  rationale: व्यापक, सार्वभौमिक दायरे को बनाए रखता है; ‘सारा देश’ अर्थ को अनावश्यक रूप से स्थानीय बना सकता है।
- source_word: κρίματα
  choice: निर्णयों
  rationale: यहाँ शब्द परमेश्वर के न्यायिक निर्णयों या न्याय-कृत्यों को सूचित करता है; ‘निर्णय’ आधुनिक हिन्दी में स्पष्ट है और साथ के विशेषण से न्याय का भाव मिलता है।
- source_word: δίκαια
  choice: धर्ममय
  rationale: यह परमेश्वर के निर्णयों की नैतिक खरीपन और न्यायसंगतता दोनों को व्यक्त करता है; ‘न्यायपूर्ण’ एक निकट वैकल्पिक अनुवाद है।
theological_decisions:
- issue: परमेश्वर के κρίματα के लिए δίκαια का अनुवाद
  choice: धर्ममय निर्णय
  alternative: न्यायपूर्ण निर्णय
  rationale: ‘धर्ममय’ परमेश्वर की नैतिक धार्मिकता और उसके निर्णयों की उचितता को बनाए रखता है, जबकि ‘न्यायपूर्ण’ न्यायिक पक्ष को अधिक प्रत्यक्ष करता है। मुख्य पाठ पहले पक्ष को रखता है और पादटिप्पणी वास्तविक शाब्दिक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और स्रोत के सार्वजनिक-प्रकाशन वाले बिंब के निकट रखी गई है। ‘सूर्य के सामने’ को जानबूझकर शाब्दिक रखा गया है।
