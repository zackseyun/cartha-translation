  text: उसके प्रवेश से पहले[a] उन्होंने ऊबड़-खाबड़ रास्तों को समतल कर दिया; उन्होंने यरूशलेम की ओर फाटक खोल दिए; उन्होंने उसकी शहरपनाहों को मुकुट पहनाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्यांश का शाब्दिक रूप ‘उसके प्रवेश से’ है; वह असहज है और यहाँ उसके प्रवेश की तैयारी का भाव भी हो सकता है: ‘उसके प्रवेश के लिए’।'
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी शहरपनाहों को मालाओं से सजाया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡμάλισαν
  choice: समतल कर दिया
  rationale: क्रिया का अर्थ ऊबड़-खाबड़ सतह को बराबर या सुगम करना है। यह चयन मार्ग तैयार करने के ठोस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁδοὺς τραχείας
  choice: ऊबड़-खाबड़ रास्तों
  rationale: यह संज्ञा-विशेषण युग्म का स्पष्ट और आम बोलचाल में बोधगम्य रूप है; ‘दुर्गम मार्गों’ की अपेक्षा मूल के भौतिक खुरदरेपन को अधिक सीधे व्यक्त करता है।
- source_word: ἀπὸ εἰσόδου αὐτοῦ
  choice: उसके प्रवेश से पहले
  rationale: ἀπό का शाब्दिक अर्थ ‘से’ है, किंतु यहाँ वाक्यांश असहज है और संभवतः सामी पृष्ठभूमि में उसके आने से पहले मार्ग तैयार किए जाने का भाव देता है। ‘से पहले’ इस संभावित कालिक/स्थानिक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- source_word: ἤνοιξαν πύλας
  choice: फाटक खोल दिए
  rationale: मूल की सीधी क्रिया को सामान्य और गरिमापूर्ण हिन्दी में रखा गया है। यूनानी में निश्चित उपपद न होने के कारण ‘फाटकों को’ के बजाय सहज अनिश्चित रूप चुना गया है।
- source_word: ἐπὶ Ἰερουσαλήμ
  choice: यरूशलेम की ओर
  rationale: ἐπί को यहाँ दिशासूचक समझना फाटकों के संदर्भ में सुसंगत है। यह ‘यरूशलेम के लिए’ जैसी प्रयोजनसूचक व्याख्या को पाठ में आरोपित नहीं करता।
- source_word: ἐστεφάνωσαν
  choice: मुकुट पहनाया
  rationale: क्रिया के मूल ‘मुकुट पहनाने’ वाले विजयोत्सवी या अलंकरणात्मक बिंब को सुरक्षित रखा गया है। हिन्दी में दीवारों के साथ यह जानबूझकर रूपकात्मक है।
- source_word: τείχη αὐτῆς
  choice: उसकी शहरपनाहों
  rationale: बहुवचन ‘दीवारों/नगर-प्राचीरों’ का आशय ‘शहरपनाहों’ से स्पष्ट होता है। स्त्रीलिंग सर्वनाम यरूशलेम को मानवीकृत नगर के रूप में प्रस्तुत करने वाला मूल बिंब बनाए रखता है।
