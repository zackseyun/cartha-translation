translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली अपनाई गई है। ‘ऊबड़-खाबड़ रास्ते’ ठोस दृश्य बनाए रखते हैं, जबकि ‘शहरपनाह’ प्राचीन नगर की रक्षात्मक दीवारों के लिए परिचित बाइबलीय शब्द है। मूल के मुकुट वाले रूपक और ἀπὸ εἰσόδου αὐτοῦ की असहजता को मिटाने के बजाय पादटिप्पणियों सहित सुरक्षित रखा गया है।
