lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ μου
  choice: मैंने अपने मन में कहा
  rationale: यूनानी का अधिक शाब्दिक अर्थ ‘मैंने अपने हृदय से कहा’ है। हिन्दी में ‘अपने मन में कहा’ स्वाभाविक ढंग से भीतर कही गई बात व्यक्त करता है और हृदय/अंतरात्मा की मूल छवि के निकट रहता है।
- source_word: Ποῦ ἄρα
  choice: तब ... कहाँ
  rationale: Ποῦ स्थानवाचक प्रश्न ‘कहाँ’ है और ἄρα विचारात्मक अथवा निष्कर्षसूचक बल देता है; हिन्दी में ‘तब ... कहाँ’ इस भाव को सहज रूप में व्यक्त करता है।
- source_word: κρινεῖ
  choice: न्याय करेगा
  rationale: κρίνω का मूल अर्थ ‘न्याय करना’ है। प्रसंग दण्डात्मक निर्णय का संकेत दे सकता है, पर क्रिया अपने आप में ‘दोषी ठहराना’ अनिवार्य नहीं करती।
- source_word: αὐτόν
  choice: उसका
  rationale: यह एकवचन पुल्लिंग सर्वनाम का कर्मकारक रूप है। हिन्दी में ‘उसका न्याय करना’ स्वाभाविक मुहावरे के अनुसार वही संबंध व्यक्त करता है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: यहाँ θεός के लिए आधुनिक, गरिमापूर्ण और प्रचलित हिन्दी बाइबलीय पर्याय ‘परमेश्वर’ चुना गया है।
