- source_word: ἤγαγεν
  choice: ले गया
  rationale: ἄγω के भूतकालिक रूप का मूल अर्थ ‘ले जाना’ या ‘अगुवाई करना’ है। ‘ले गया’ परमेश्वर द्वारा उसके मार्ग का निर्देशन किए जाने की छवि को बनाए रखता है।
- source_word: μετὰ ἀσφαλείας
  choice: सुरक्षित
  rationale: यह पदबंध सुरक्षा के साथ ले जाए जाने का भाव व्यक्त करता है; हिन्दी में क्रियाविशेषण के रूप में ‘सुरक्षित’ स्वाभाविक और सटीक है।
- source_word: πλανήσει
  choice: भटकाव
  rationale: यह शब्द भटकने, भूल, भ्रम या गुमराही का अर्थ दे सकता है। ‘भटकाव’ इसकी रूपकात्मक व्यापकता बनाए रखता है और इसे केवल बौद्धिक भूल या जानबूझकर किए गए छल तक सीमित नहीं करता।
- source_word: αὐτὸν
  choice: उसे
  rationale: पुल्लिंग एकवचन सर्वनाम को हिन्दी में प्रसंगानुकूल और स्वाभाविक रूप से ‘उसे’ कहा गया है।
- source_word: αὐτῶν
  choice: उनके
  rationale: बहुवचन संबंधकारक को ‘उनके’ के रूप में प्रस्तुत करने से एकवचन व्यक्ति और बहुवचन समूह का भेद बना रहता है।
- source_word: ἐν
  choice: के बीच
  rationale: यहाँ ἐν को ‘के बीच’ कहना उस परिस्थिति या परिवेश को व्यक्त करता है जिसमें परमेश्वर ने उसे सुरक्षित ले गया, बिना इसे निश्चित रूप से कारणसूचक बनाने के।
