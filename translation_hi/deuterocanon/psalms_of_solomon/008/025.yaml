lexical_decisions:
- source_word: ἐποίησαν
  choice: आचरण किया
  rationale: यहाँ व्यापक क्रिया ‘करना’ के बाद κατὰ नैतिक चाल-चलन का मानदंड बताता है; इसलिए ‘आचरण किया’ स्वाभाविक हिन्दी में व्यवहार का भाव स्पष्ट करता है।
- source_word: κατὰ
  choice: के अनुसार
  rationale: यह उनके आचरण और उनकी अशुद्धताओं के बीच अनुरूपता या मानदंड का संबंध सुरक्षित रखता है।
- source_word: τὰς ἀκαθαρσίας αὐτῶν
  choice: अपनी अशुद्धताओं
  rationale: ‘अशुद्धताओं’ बहुवचन को बनाए रखता है और शब्द के नैतिक तथा शुद्धता-संबंधी दोनों संभावित आयामों को बिना सीमित किए व्यक्त करता है। कर्ता की ओर संकेत स्पष्ट करने के लिए αὐτῶν का स्वाभाविक हिन्दी रूप ‘अपनी’ है।
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: यह तुलना की स्पष्टता और पूर्वजों के व्यवहार के साथ निरंतरता के अलंकारिक बल को बनाए रखता है।
- source_word: οἱ πατέρες αὐτῶν
  choice: उनके पूर्वजों
  rationale: संदर्भ में ‘पितरों’ की अपेक्षा ‘पूर्वजों’ आधुनिक सामान्य हिन्दी में वंशगत पिछली पीढ़ियों का आशय अधिक सहजता से देता है, बिना किसी विशिष्ट निकट संबंध तक अर्थ सीमित किए।
