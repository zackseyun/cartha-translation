lexical_decisions:
- source_word: φωνὴν
  choice: एक आवाज़
  rationale: φωνή सुनाई देने वाली आवाज़ या ध्वनि को सूचित कर सकता है। निकटवर्ती पदों में इसकी पुनरावृत्ति युद्ध, तुरही और भीड़ की आवाज़ के लिए हुई है; हिन्दी ‘आवाज़’ इस श्रव्य अर्थ और अलंकारिक पुनरावृत्ति, दोनों को स्वाभाविक रूप से बनाए रखती है।
- source_word: ἤκουσα
  choice: मैंने ... सुनी
  rationale: ἤκουσα साधारण भूतकालीन श्रवण-बोध बताता है; ‘मैंने ... सुनी’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यद्यपि εἰς का सामान्य दिशात्मक अर्थ ‘में/की ओर’ है, उत्तरकालीन यूनानी में इसका स्थानवाचक प्रयोग भी मिलता है। इस वाक्य में ‘यरूशलेम में’ सबसे सहज अर्थ है; दिशात्मक संभावना पादटिप्पणी में रखी गई है।
- source_word: πόλιν ἁγιάσματος
  choice: पवित्र नगर
  rationale: शाब्दिक संरचना ‘पवित्रता का नगर’ है। ‘पवित्र नगर’ आधुनिक हिन्दी में उसी आशय को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions: []
