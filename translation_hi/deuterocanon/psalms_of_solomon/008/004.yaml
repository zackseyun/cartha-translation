  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘आवाज़’ को चुना गया है ताकि φωνή का व्यापक श्रव्य अर्थ और आसपास के पदों में उसकी पुनरावृत्ति बनी रहे। यरूशलेम और ‘पवित्र नगर’ की समानाधिकरणात्मक पुनरुक्ति को डैश द्वारा स्पष्ट किया गया है।
