  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘सन्तान’ पीढ़ीगत और लिंग-समावेशी अर्थ देता है। अन्तिम वाक्य में डैश मूल की तीव्र कालवाचक पुनरुक्ति को बोझिल हुए बिना उभारता है।
