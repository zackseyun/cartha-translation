  text: May favor be upon us and our children forever[a]; O Lord our Savior[c][b], we shall never again be shaken forever.
translation:
  language: hi
  text: हम पर और हमारी संतान पर सदा कृपा हो[a]; हे प्रभु, हमारे उद्धारकर्ता, हम अब फिर कभी डगमगाए नहीं जाएँगे, युगानुयुग[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘कृपा’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘सद्भाव’ या ‘प्रसन्न स्वीकृति’ भी हो सकता है। क्रियारहित यूनानी वाक्य का अनुवाद यह भी हो सकता है: ‘हमारे और हमारी संतान के लिए कृपा सदा है।’'
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: 'शाब्दिक रूप से: ‘हम अब और अनन्तकाल तक डगमगाए नहीं जाएँगे’; यह स्थायी दृढ़ता पर प्रबल बल देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: कृपा
  rationale: यहाँ यह शब्द समुदाय के प्रति अनुकूलता, सद्भाव या प्रसन्न स्वीकृति को व्यक्त करता है। ‘कृपा’ प्रार्थनात्मक संदर्भ में स्वाभाविक है, जबकि पादटिप्पणी मूल शब्द की अन्य सम्भावनाएँ सुरक्षित रखती है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन रूप को आधुनिक, गरिमापूर्ण हिन्दी में ‘हे प्रभु’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σωτήρ
  choice: उद्धारकर्ता
  rationale: यह शब्द बचाने या छुड़ाने वाले के लिए है; ‘उद्धारकर्ता’ यहाँ परमेश्वर के उपाधि-सदृश सम्बोधन को बनाए रखता है।
- source_word: σαλευθησόμεθα
  choice: नहीं डगमगाएँगे
  rationale: यूनानी भविष्यत् कर्मवाच्य का भाव अस्थिर या विचलित किए जाने का है। हिन्दी में ‘नहीं डगमगाएँगे’ इस रूपक को सहज और स्पष्ट रखता है।
- source_word: τὸν αἰῶνα χρόνον
  choice: अनन्तकाल तक
  rationale: यह प्रबल कालवाचक अभिव्यक्ति स्थायी अवधि पर बल देती है। ‘फिर कभी—अनन्तकाल तक—नहीं’ मूल की दोहरी तीव्रता को हिन्दी में बनाए रखता है।
- source_word: ἡμῖν καὶ τοῖς τέκνοις ἡμῶν
  choice: हम पर और हमारी सन्तान पर
  rationale: दोनों सम्प्रदान रूप कृपा के लाभार्थियों को सूचित करते हैं। τέκνα को लिंग-समावेशी सामूहिक अर्थ में ‘सन्तान’ किया गया है।
theological_decisions:
- issue: आरम्भिक क्रियारहित वाक्य का कथन या प्रार्थना होना
  choice: ‘कृपा बनी रहे’ के रूप में प्रार्थनात्मक कामना
  alternative: ‘हमारे और हमारी सन्तान के लिए कृपा सदा है’ के रूप में कथन
  rationale: यूनानी में स्पष्ट क्रिया नहीं है, इसलिए दोनों अर्थ सम्भव हैं। भजन की प्रार्थनात्मक वाणी में कामनासूचक हिन्दी अधिक स्वाभाविक है; पादटिप्पणी कथनात्मक सम्भावना को सुरक्षित रखती है।
- issue: εὐδοκία में कृपा के कर्ता का उल्लेख
  choice: ‘कृपा’ बिना ‘तेरी’ जोड़े
  alternative: ‘तेरी कृपा’
  rationale: सन्दर्भ में कृपा परमेश्वर की समझी जा सकती है, पर यूनानी पाठ में अधिकारसूचक सर्वनाम नहीं है; इसलिए उसे मुख्य पाठ में जोड़ा नहीं गया।
