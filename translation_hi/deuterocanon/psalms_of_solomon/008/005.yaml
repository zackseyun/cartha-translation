  rationale: यह संज्ञा कुचले या टूटे होने की दशा व्यक्त करती है। हिन्दी में ‘कमर टूट गई’ इस निहित विधेय को स्वाभाविक और सशक्त ढंग से व्यक्त करता है।
- source_word: ἡ ὀσφύς μου
  choice: मेरी कमर
  rationale: ὀσφύς शरीर के कमर अथवा कटि-प्रदेश को दर्शाता है। ‘मेरी कमर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा मूल की शारीरिक तीव्रता बनाए रखता है।
- source_word: ἀπὸ ἀκοῆς
  choice: यह समाचार सुनकर
  rationale: ἀπό यहाँ कारण बताता है और ἀκοή सुनी हुई बात अथवा समाचार का बोध करा सकता है। यह अनुवाद कारण-संबंध को सहज हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: παρελύθη
  choice: जवाब दे गए
  rationale: यह क्रिया अशक्त, निष्क्रिय या ढीला पड़ जाने का भाव दे सकती है। घुटनों के संदर्भ में ‘जवाब दे गए’ शारीरिक सामर्थ्य चुक जाने को स्वाभाविक हिन्दी में व्यक्त करता है, बिना चिकित्सकीय पक्षाघात निश्चित किए।
- source_word: γόνατά μου
  choice: मेरे घुटने
  rationale: यह मूल यूनानी का सीधा और सामान्य हिन्दी समतुल्य है।
