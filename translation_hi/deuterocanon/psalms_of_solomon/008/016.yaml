lexical_decisions:
- source_word: ἤγαγεν
  choice: ले आया
  rationale: ἄγω के अओरिस्ट रूप का भाव यहाँ किसी व्यक्ति को दृश्य में लाने का है। “ले आया” इस गतिशील और सकर्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἀπʼ ἐσχάτου τῆς γῆς
  choice: पृथ्वी के छोर से उस व्यक्ति को
  rationale: यह कर्मकारक पदबंध लाए गए व्यक्ति की पहचान उसके अत्यन्त दूरस्थ भौगोलिक उद्गम से करता है। “पृथ्वी के छोर” मूल बिंब और उसकी सम्भावित अतिशयोक्तिपूर्ण व्यापकता को बनाए रखता है।
- source_word: παίοντα
  choice: जो ... प्रहार करता है
  rationale: वर्तमान कृदन्त παίοντα मारने या प्रहार करने की क्रिया बताता है। “प्रहार करता है” गरिमापूर्ण, स्पष्ट और अनावश्यक रूप से पुरातन नहीं है।
- source_word: κραταιῶς
  choice: बड़े पराक्रम से
  rationale: क्रियाविशेषण प्रबल शक्ति या जोर से किए गए कार्य को व्यक्त करता है। “बड़े पराक्रम से” पद्यात्मक गरिमा के साथ शक्तिशाली प्रहार का भाव देता है।
