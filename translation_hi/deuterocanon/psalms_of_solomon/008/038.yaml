    reason: lexical_alternative
  - marker: b
    text: या “हमारे प्रति तेरे न्याय कृपालु हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεξόμεθά
  choice: दूर न होंगे
  rationale: ἀφέχομαι का व्यक्तिगत संबंध में अर्थ अपने को किसी से दूर रखना या उससे अलग होना है। “तुझसे दूर न होंगे” भविष्यकाल, निषेध और संबंधपरक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: χρηστὰ
  choice: भले
  rationale: χρηστός यहाँ भला, हितकारी या कृपालु होने का भाव दे सकता है। “भले” व्यापक अर्थ को सुरक्षित रखता है और न्यायों को केवल दंडात्मक नहीं ठहराता।
- source_word: κρίματά
  choice: न्याय
  rationale: κρίματα ईश्वरीय न्याय-निर्णयों या न्याय के कार्यों को सूचित करता है। “न्याय” हिन्दी के गरिमापूर्ण धार्मिक प्रयोग में इस व्यापकता को बनाए रखता है।
- source_word: εἰς ἡμᾶς
  choice: हमारे प्रति
  rationale: εἰς ἡμᾶς दिशा अथवा संबंध प्रकट करता है। “हमारे प्रति” यह बताता है कि ये न्याय समुदाय की ओर लक्षित हैं, पर उन्हें केवल लाभकारी या दंडात्मक मानकर अर्थ को संकीर्ण नहीं करता।
