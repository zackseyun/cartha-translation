  yaml_path: translation/deuterocanon/psalms_of_solomon/008/023.yaml
  text: He destroyed their rulers and everyone wise in counsel[c][b][a]; he poured out the blood of those dwelling in Jerusalem like unclean water.
translation:
  language: hi
  text: उसने उनके शासकों और परामर्श में बुद्धिमान हर एक को नष्ट कर दिया[a]; उसने यरूशलेम में रहनेवालों का लहू अशुद्धता के जल के समान उँडेल दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘हर बुद्धिमान परामर्शदाता’ या ‘वे सभी जो परामर्श में बुद्धिमान थे’ भी हो सकता है। यूनानी पदबंध संक्षिप्त और सामूहिक है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अशुद्धता के जल के समान’; अर्थात ‘अशुद्ध जल के समान’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: नष्ट कर दिया
  rationale: यह क्रिया विनाश तक पहुँचा देने का व्यापक अर्थ रखती है। अगले उपवाक्य में रक्तपात का उल्लेख है, फिर भी इसे केवल ‘मार डाला’ तक सीमित नहीं किया गया।
- source_word: ἄρχοντας αὐτῶν
  choice: उनके शासकों
  rationale: ἄρχοντας अधिकार रखनेवाले व्यक्तियों को दर्शाता है; ‘शासकों’ से इसका राजनीतिक और प्रशासनिक भाव बना रहता है।
- source_word: πᾶν σοφὸν ἐν βουλῇ
  choice: परामर्श में बुद्धिमान हर व्यक्ति
  rationale: यूनानी पदबंध संक्षिप्त और सामूहिक है। यह अनुवाद उसकी संरचना के निकट रहते हुए विचार-विमर्श अथवा परामर्श में बुद्धिमान व्यक्तियों का बोध कराता है।
- source_word: ἐξέχεεν
  choice: उँडेल दिया
  rationale: यह चयन मूल के ठोस और प्रबल चित्र को बनाए रखता है; केवल ‘बहाया’ कहने से उँडेलने का दृश्य कुछ मंद पड़ जाता।
- source_word: τῶν οἰκούντων Ἰερουσαλήμ
  choice: यरूशलेम में रहनेवालों
  rationale: यह यूनानी कृदंत की क्रिया-भावना को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ὡς ὕδωρ ἀκαθαρσίας
  choice: अशुद्धता के जल के समान
  rationale: ἀκαθαρσίας संज्ञा है, जिसका अर्थ अशुद्धता या अपवित्रता है। संबंधकारक संरचना को बनाए रखने से मूल की विशिष्ट अभिव्यक्ति और संभावित धार्मिक-शुद्धता संबंधी भार सुरक्षित रहता है।
theological_decisions:
- issue: ἀκαθαρσίας में सामान्य गंदगी और धार्मिक अशुद्धता के बीच अर्थ-भार
  choice: अशुद्धता
  alternative: अपवित्रता / अशुद्ध जल
  rationale: ‘अशुद्धता’ सामान्य और धार्मिक दोनों संदर्भों के लिए खुला है तथा मूल के संज्ञात्मक रूप को बनाए रखता है; ‘अपवित्रता’ धार्मिक अर्थ को अधिक निश्चित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू’ काव्यात्मक-बाइबलीय गरिमा देता है, जबकि ‘उँडेल दिया’ मूल की तीखी रक्तपात-संबंधी छवि को बनाए रखता है।
