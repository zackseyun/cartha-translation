    reason: lexical_alternative
lexical_decisions:
- source_word: κατελάβετο
  choice: अपने अधिकार में ले लिया
  rationale: यह यूनानी क्रिया यहाँ रक्षात्मक संरचनाओं पर नियंत्रण स्थापित करने का अर्थ देती है। यह हिंदी पदबंध बलपूर्वक छीनने और बिना संघर्ष के अधिकार करने—दोनों संभावनाओं को खुला रखता है, इसलिए प्रसंगगत अस्पष्टता बनी रहती है।
- source_word: τὰς πυργοβάρεις
  choice: किलेबंद बुर्जों
  rationale: यह दुर्लभ शब्द रक्षात्मक दुर्ग-संरचनाओं, विशेषकर मजबूत बुर्जों या गढ़ों, का संकेत देता है। ‘किलेबंद बुर्ज’ निकटवर्ती नगर-दीवार के साथ स्वाभाविक बैठता है और शब्द के दुर्गात्मक भाव को स्पष्ट रखता है।
- source_word: αὐτῆς
  choice: उसके
  rationale: स्त्रीलिंग सर्वनाम का संकेत यरूशलेम की ओर है, जिसे काव्य में स्त्री-रूप नगर के रूप में प्रस्तुत किया गया है। हिंदी में ‘उसके’ इस संबंध को स्वाभाविक ढंग से रखता है; इसका रूप संबोधित वस्तु ‘बुर्जों’ के अनुसार है।
- source_word: τὸ τεῖχος Ἰερουσαλήμ
  choice: यरूशलेम की नगर-दीवार
  rationale: यह एकवचन सामूहिक अर्थ को बनाए रखते हुए स्पष्ट करता है कि बात नगर की रक्षात्मक दीवार की है और यरूशलेम का नाम भी प्रत्यक्ष रखता है।
