  text: They trampled the altar of the Lord with every uncleanness[a], and with menstrual blood they defiled the sacrifices like profane meat[c][b];
translation:
  language: hi
  text: उन्होंने प्रभु की वेदी को हर प्रकार की अशुद्धता से रौंद डाला[a], और मासिक धर्म के रक्त से बलियों को साधारण मांस समझकर अपवित्र किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरंभिक यूनानी रूप कठिन है। निकट समर्थित एक पाठ के आधार पर अर्थ है, “उन्होंने प्रभु की वेदी को रौंद डाला।”
    reason: textual_variant
  - marker: b
    text: या, “अपवित्र मांस”; यूनानी शब्द का अर्थ पवित्र के विपरीत साधारण या लौकिक भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίπουσαν
  choice: उन्होंने ... रौंद डाला
  rationale: प्रेषित यूनानी रूप कठिन है, पर निकट समर्थित पाठ-परंपरा और वेदी के हिंसक अपमान के प्रसंग में ‘रौंद डाला’ सर्वाधिक स्वाभाविक अर्थ देता है; पाठगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: τὸ θυσιαστήριον Κυρίου
  choice: प्रभु की वेदी
  rationale: यह θυσιαστήριον और Κυρίου का सीधा, प्रचलित तथा उपासना-संबंधी स्वाभाविक हिन्दी रूप है।
- source_word: ἀπὸ πάσης ἀκαθαρσίας
  choice: हर प्रकार की अशुद्धता से
  rationale: ‘अशुद्धता’ मंदिर और विधिगत शुद्धता के संदर्भ को बनाए रखती है; πάσης के व्यापक बल को ‘हर प्रकार की’ व्यक्त करता है।
- source_word: ἐν ἀφέδρῳ αἵματος
  choice: मासिक धर्म के रक्त से
  rationale: LXX के प्रयोग में ἄφεδρος मासिक धर्म से जुड़ी विशिष्ट विधिगत अशुद्धता का तकनीकी संकेत है; इसलिए सामान्य ‘रक्तस्राव’ की अपेक्षा इसे मुख्य पाठ में स्पष्ट किया गया है।
- source_word: ἐμίανιν
  choice: अपवित्र किया
  rationale: μιαίνω का बलि और पवित्रस्थान के संदर्भ में अर्थ पवित्र वस्तु को दूषित या अपवित्र करना है; ‘अपवित्र किया’ आधुनिक हिन्दी में इस धार्मिक विरोध को स्पष्ट रखता है।
- source_word: τὰς θυσίας
  choice: बलियों को
  rationale: ‘बलियाँ’ θυσίαι का सीधा और प्रसंगानुकूल हिन्दी पर्याय है।
- source_word: ὡς κρέα βέβηλα
  choice: मानो वे साधारण मांस हों
  rationale: βέβηλα पवित्र/समर्पित के विपरीत सामान्य, लौकिक वस्तु को दर्शाता है। ‘साधारण मांस’ इस विरोध को ‘अपवित्र मांस’ की तुलना में अधिक ठीक रखता है।
theological_decisions:
- issue: βέβηλα में पवित्र और सामान्य का विरोध
  choice: साधारण मांस
  alternative: अपवित्र मांस
  rationale: यूनानी शब्द आवश्यक रूप से नैतिक या विधिगत दूषण नहीं, बल्कि पवित्र उपयोग से बाहर ‘सामान्य’ होने का भाव भी रखता है। इसलिए बलियों को सामान्य भोजन के मांस जैसा मानने का तीखा विरोध सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। विधिगत अशुद्धता और पवित्र/साधारण के विरोध को सामान्य पाठक के लिए बोधगम्य रखा गया है, जबकि कठिन आरंभिक पाठ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
