  yaml_path: translation/deuterocanon/psalms_of_solomon/008/030.yaml
  text: Behold now[a], O God, you have shown us your judgment in your righteousness,
translation:
  language: hi
  text: देखो, हे परमेश्वर, तुमने अपनी धार्मिकता में हमें अपना न्याय दिखाया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी न्यायपरायणता के अनुसार।”
    reason: δικαιοσύνη में धार्मिकता और न्यायपरायणता दोनों की छाया हो सकती है, और ἐν यहाँ क्षेत्र अथवा रीति/मानक का संकेत दे सकता है।
lexical_decisions:
- source_word: ἰδοὺ δή
  choice: देखो
  rationale: यह संयुक्त पद आगे कही जाने वाली बात की ओर जोर देकर ध्यान खींचता है। हिन्दी में “देखो” प्रार्थनात्मक गरिमा बनाए रखते हुए स्वाभाविक है; δή का बल इसी आज्ञार्थक ध्यान-सूचक अभिव्यक्ति में समाहित है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: संदर्भ में यह सीधा संबोधन है। “हे परमेश्वर” आधुनिक हिन्दी की गरिमापूर्ण प्रार्थना-भाषा में स्वाभाविक रूप से संबोधन का भाव व्यक्त करता है।
- source_word: ἔδειξας
  choice: दिखाया है
  rationale: ग्रीक एओरिस्ट एक पूर्ण कार्य बताता है; हिन्दी पूर्ण वर्तमान “दिखाया है” उस कार्य की वर्तमान प्रासंगिकता को स्वाभाविक रूप से व्यक्त करता है और “प्रकट किया” की अपेक्षा कम व्याख्यात्मक है।
- source_word: τὸ κρῖμά σου
  choice: अपना न्याय
  rationale: κρῖμα यहाँ परमेश्वर के न्यायिक निर्णय या न्याय-कार्य को सूचित करता है। “न्याय” हिन्दी में इस व्यापक न्यायिक अर्थ को बनाए रखता है, बिना इसे केवल “दण्डादेश” तक सीमित किए।
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: अपनी धार्मिकता में
  rationale: ἐν के मूल स्थान/क्षेत्र अथवा रीति-संबंधी अर्थ को “में” सुरक्षित रखता है। δικαιοσύνη के लिए “धार्मिकता” नैतिक सत्यता का अर्थ बनाए रखती है, जबकि न्यायिक संदर्भ के कारण “न्यायपरायणता के अनुसार” भी संभव है।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: मुख्य पाठ में “धार्मिकता” परमेश्वर की नैतिक सत्यता और उचितता का व्यापक अर्थ सुरक्षित रखती है। फिर भी न्यायिक संदर्भ में “न्यायपरायणता” संभव है; इस अर्थगत तनाव को समाप्त करने के बजाय पादटिप्पणी में रखा गया है।
- issue: ἐν को क्षेत्र, रीति या आधार के रूप में समझना
  choice: अपनी धार्मिकता में
  alternative: अपनी धार्मिकता के अनुसार
  rationale: ग्रीक ἐν अस्पष्ट रूप से वह क्षेत्र या रीति बता सकता है जिसमें परमेश्वर ने अपना न्याय दिखाया। शाब्दिक “में” इस खुलापन को अधिक सुरक्षित रखता है; अधिक व्याख्यात्मक साधन/मानक संबंधी पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; प्रार्थनात्मक और गरिमापूर्ण, पर सामान्य पाठकों के लिए सहज। “देखो” ध्यानाकर्षक बल देता है, और “हे परमेश्वर” सीधे संबोधन को स्पष्ट करता है।
