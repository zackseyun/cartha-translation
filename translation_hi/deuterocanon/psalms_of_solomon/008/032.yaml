  text: For you are the God of righteousness[b][a], judging Israel with discipline.
translation:
  language: hi
  text: क्योंकि आप धार्मिकता[a] के परमेश्वर हैं, जो इस्राएल का न्याय अनुशासन[b] के साथ करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘न्याय के परमेश्वर।’
