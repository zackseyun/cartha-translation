    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक आसपास की प्रार्थना या अंगीकार का आधार बताता है; हिन्दी में ‘क्योंकि’ उसके कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ θεὸς τῆς δικαιοσύνης
  choice: धार्मिकता के परमेश्वर
  rationale: यह पदबंध परमेश्वर के नैतिक चरित्र और न्यायपूर्ण शासन दोनों की ओर संकेत करता है। ‘धार्मिकता’ इस व्यापक अर्थ को बनाए रखती है।
- source_word: κρίνων
  choice: जो ... न्याय करते हैं
  rationale: वर्तमान कृदन्त परमेश्वर की निरंतर क्रिया बताता है। सम्बन्धवाचक उपवाक्य आधुनिक हिन्दी में स्वाभाविक है और यूनानी कृदन्त का संबंध स्पष्ट रखता है।
- source_word: τὸν Ἰσραήλ
  choice: इस्राएल का
  rationale: ‘इस्राएल’ मानक हिन्दी रूप है; ‘न्याय करना’ के साथ संबंधसूचक ‘का’ स्वाभाविक प्रयोग है।
- source_word: ἐν παιδείᾳ
  choice: अनुशासन के द्वारा
  rationale: παιδεία यहाँ केवल शिक्षा नहीं, सुधारने वाला अनुशासन या ताड़ना सूचित करता है; ἐν का साधनार्थक बल ‘के द्वारा’ से स्पष्ट होता है।
theological_decisions:
- issue: δικαιοσύνη में धार्मिकता और न्याय का अर्थक्षेत्र
  choice: धार्मिकता
  alternative: न्यायपरायणता / न्याय
  rationale: पदबंध परमेश्वर के चरित्र और उनके न्यायपूर्ण कार्य दोनों को समेटता है। मुख्य पाठ में ‘धार्मिकता’ व्यापक धार्मिक अर्थ बनाए रखती है, जबकि पादटिप्पणी न्याय-संबंधी विकल्प दर्ज करती है।
- issue: ἐν παιδείᾳ में न्याय और अनुशासन का संबंध
  choice: अनुशासन के द्वारा
  alternative: सुधार करते हुए / ताड़ना के साथ
  rationale: साधनार्थक अनुवाद यह तनाव बनाए रखता है कि परमेश्वर का न्याय दंड मात्र नहीं, सुधारक अनुशासन के माध्यम से होता है; फिर भी παιδεία के अन्य संभावित रंग पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज धार्मिक गद्य। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया ‘हैं/करते हैं’ प्रयुक्त हुई है। पादटिप्पणी-चिह्न संबंधित वाक्यांशों के बजाय पद के अंत में रखे गए हैं, फिर भी दोनों मुख्य पाठ में स्पष्ट रूप से उपस्थित हैं।
