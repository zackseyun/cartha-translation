lexical_decisions:
- source_word: βουνοὶ
  choice: पहाड़ियाँ
  rationale: βουνός सामान्यतः ऊँचे पर्वत के बजाय पहाड़ी को दर्शाता है; बहुवचन और दृश्यात्मकता को बनाए रखने के लिए ‘पहाड़ियाँ’ उपयुक्त है।
- source_word: ἔφυγον
  choice: भाग गईं
  rationale: φεύγω का सीधा अर्थ ‘भागना’ है। यह प्रकृति के सजीवीकरण को बिना नरम किए सुरक्षित रखता है।
- source_word: ἀπὸ εἰσόδου αὐτῶν
  choice: उनके आने के सामने से
  rationale: ἀπό का पृथक्करण/दूरी का भाव और εἴσοδος का ‘आना, प्रवेश करना’ दोनों बनाए रखे गए हैं। हिंदी वाक्यांश जानबूझकर कुछ संक्षिप्त काव्यात्मकता रखता है; ‘उनके आते ही’ संभव है, पर उसमें ἀπό का भाव घट जाता है।
- source_word: δρυμοὶ
  choice: वन
  rationale: δρυμός वनयुक्त स्थान, जंगल या झुरमुट हो सकता है। ‘वन’ वर्तमान, गरिमापूर्ण और काव्यात्मक हिंदी में व्यापक अर्थ देता है।
- source_word: ἐσκίασαν αὐτοῖς
  choice: उन्हें छाया देते गए
  rationale: यह प्रयोग αὐτοῖς के हितार्थक भाव को स्पष्ट करता है और चलते हुए यात्रियों को मार्ग में निरंतर छाया मिलने की स्वाभाविक हिंदी अभिव्यक्ति देता है।
- source_word: ἐν τῇ παρόδῳ αὐτῶν
  choice: उनके मार्ग से गुजरते समय
  rationale: πάροδος के ‘गुजरना/मार्ग से होकर जाना’ भाव को व्यक्त करता है। इससे इसे केवल सामान्य ‘यात्रा’ मानकर अर्थ सीमित नहीं किया गया।
