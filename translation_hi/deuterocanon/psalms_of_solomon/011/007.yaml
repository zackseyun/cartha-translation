  text: God made every fragrant tree spring up for them[a], so that Israel might pass through in the visitation of the glory of their God.
translation:
  language: hi
  text: परमेश्वर ने उनके लिए हर सुगंधित वृक्ष उगाया, ताकि इस्राएल अपने परमेश्वर की महिमा के आगमन के समय होकर निकले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν ξύλον
  choice: हर ... वृक्ष
  rationale: एकवचन ξύλον के साथ πᾶν का भाव वितरणात्मक है—हर प्रकार का वृक्ष। वृद्धि के संदर्भ में ξύλον के लिए ‘वृक्ष’ स्वाभाविक है, ‘लकड़ी’ नहीं।
- source_word: εὐωδίας
  choice: सुगंधित
  rationale: संबंधकारक पद यहाँ विशेषणात्मक अर्थ देता है; ‘सुगंधित’ आधुनिक हिन्दी में स्पष्ट और काव्यात्मक दोनों है।
- source_word: ἀνέτειλεν
  choice: उगा दिया
  rationale: क्रिया अंकुरित होने या उगने का बोध कराती है; ‘उगा दिया’ वनस्पति-बिंब और परमेश्वर की कारक भूमिका दोनों को बनाए रखता है।
- source_word: παρέλθῃ
  choice: वहाँ से होकर निकले
  rationale: संदर्भ तैयार किए गए मार्ग या परिवेश से इस्राएल के गुजरने का संकेत देता है; यह हिन्दी में गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπισκοπῇ
  choice: आगमन के समय
  rationale: ἐπισκοπή का अर्थ निरीक्षण, देखभाल अथवा किसी के पास ध्यानपूर्वक आने का अवसर हो सकता है। यहाँ ‘आगमन के समय’ परमेश्वर की सक्रिय उपस्थिति का भाव देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: δόξης
  choice: महिमा
  rationale: दैवी संदर्भ में ‘महिमा’ मानक बाइबलीय शब्द है और δόξα के गौरव तथा तेज दोनों भावों को वहन करता है।
theological_decisions:
- issue: ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν का अर्थ
  choice: अपने परमेश्वर की महिमा के आगमन के समय
  alternative: अपने परमेश्वर की महिमा की देखरेख या देखभाल में
  rationale: मुख्य पाठ ἐπισκοπή को परमेश्वर के ध्यानपूर्ण आगमन के रूप में प्रस्तुत करता है, पर शब्द में देखरेख और देखभाल का अर्थ भी संभव है। पादटिप्पणी इस वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सुगंधित वृक्ष’, ‘महिमा’ और ‘आगमन’ काव्यात्मक ऊँचाई बनाए रखते हैं; ἐπισκοπή की अर्थगत अस्पष्टता पादटिप्पणी में दी गई है।
