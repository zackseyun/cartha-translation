  yaml_path: translation/deuterocanon/psalms_of_solomon/011/004.yaml
  text: They come from the north in the joy of their God[a]; from distant islands God has gathered them.
translation:
  language: hi
  text: वे उत्तर दिशा से अपने परमेश्वर के आनन्द में आते हैं; दूर के द्वीपों[a] से परमेश्वर ने उन्हें इकट्ठा किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तटवर्ती प्रदेशों”।
    reason: νήσων का सामान्य अर्थ ‘द्वीपों’ है, पर बाइबलीय यूनानी में यह समुद्रतटीय क्षेत्रों अथवा तटवर्ती प्रदेशों के लिए भी प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: ἀπὸ βορρᾶ
  choice: उत्तर दिशा से
  rationale: ἀπό के साथ संबंधकारक उद्गम को व्यक्त करता है, और βορρᾶ उत्तर अथवा उत्तरी दिशा को; ‘उत्तर दिशा से’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἔρχονται
  choice: वे ... आते हैं
  rationale: यूनानी वर्तमान काल की सजीवता को साधारण हिन्दी वर्तमान काल से सुरक्षित रखा गया है।
- source_word: τῇ εὐφροσύνῃ
  choice: आनन्द में
  rationale: यहाँ संप्रदान कारक रीति अथवा साथ रहने वाली मनःस्थिति दर्शाता है; ‘आनन्द में’ संज्ञात्मक रूप को बनाए रखता है और कारण का अर्थ नहीं जोड़ता।
- source_word: τοῦ θεοῦ αὐτῶν
  choice: अपने परमेश्वर के
  rationale: संबंधकारक का सीधा अनुवाद किया गया है। हिन्दी में कर्ता के संदर्भ में ‘अपने’ स्वाभाविक रूप से ‘उनके’ का भाव देता है और परमेश्वर से उनके संबंध को बनाए रखता है।
- source_word: ἐκ νήσων μακρόθεν
  choice: दूर के द्वीपों से
  rationale: ἐκ उद्गम व्यक्त करता है, νήσων का सामान्य अर्थ ‘द्वीप’ है, और μακρόθεν दूरी दर्शाता है। वैकल्पिक ‘तटवर्ती प्रदेशों’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: συνήγαγεν
  choice: इकट्ठा किया है
  rationale: यूनानी अओरिस्ट की पूर्ण हुई क्रिया को हिन्दी पूर्ण वर्तमान से व्यक्त किया गया है, क्योंकि उसके परिणामस्वरूप उनका आना अब सामने है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: स्पष्ट कर्ता और दैवी अभिकर्तृत्व को बनाए रखा गया है। ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय शैली में गरिमापूर्ण और व्यापक रूप से समझा जाने वाला पद है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक रखी गई है। मूल यूनानी की दो खंडों वाली समानांतर संरचना तथा परमेश्वर के आनन्द और परमेश्वर द्वारा इकट्ठा किए जाने के बीच का संबंध सुरक्षित है।
