  yaml_path: translation/deuterocanon/psalms_of_solomon/011/002.yaml
  text: 'Proclaim in Jerusalem the voice of one bringing good news: for God has shown mercy to Israel in their visitation[a][b][c].'
translation:
  language: hi
  text: यरूशलेम में शुभ समाचार सुनानेवाले की आवाज़ का प्रचार करो[a], क्योंकि परमेश्वर ने इस्राएल की सुधि लेते हुए उस पर दया की है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुभ समाचार सुनानेवाले की ध्वनि का प्रचार करो।”
    reason: φωνή का अर्थ ‘आवाज़’ या ‘ध्वनि’ हो सकता है, और वाक्य-विन्यास उद्घोषक की आवाज़ को स्वयं घोषित करने का ठोस बिंब रखता है।
  - marker: b
    text: या, “उस पर कृपापूर्वक दृष्टि करते हुए”; यूनानी शब्द का अर्थ किसी की सुधि लेना, उसकी देखरेख करना, उसके पास आना, या उसके विषय में हस्तक्षेप करना भी हो सकता है।
    reason: ἐπισκοπή के व्यापक अर्थ-क्षेत्र तथा परमेश्वर के कृपापूर्ण ध्यान, आगमन, या हस्तक्षेप की संभावित छाया को सुरक्षित रखना।
lexical_decisions:
- source_word: κηρύξατε
  choice: घोषणा करो
  rationale: बहुवचन आज्ञार्थक क्रिया सार्वजनिक और स्पष्ट उद्घोषणा का भाव रखती है; ‘घोषणा करो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके औपचारिक बल को बनाए रखता है।
- source_word: φωνὴν
  choice: आवाज़
  rationale: मूल यूनानी के ठोस बिंब को बनाए रखने के लिए इसे केवल ‘संदेश’ नहीं किया गया।
- source_word: εὐαγγελιζομένου
  choice: शुभ समाचार सुनानेवाले
  rationale: वर्तमान कृदन्त शुभ समाचार घोषित करनेवाले व्यक्ति को दर्शाता है। यह अनुवाद बाद की तकनीकी धार्मिक शब्दावली आरोपित किए बिना अर्थ स्पष्ट करता है।
- source_word: ἠλέησεν
  choice: दया की है
  rationale: ἐλεέω की दया-संबंधी भाषा को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है तथा परमेश्वर के कार्य पर बल बनाए रखता है।
- source_word: ἐπισκοπῇ
  choice: सुधि लेने के समय
  rationale: यह पद ध्यानपूर्वक देखने, सुधि लेने या हस्तक्षेप करने के अर्थ दे सकता है। प्रसंग में शुभ समाचार और दया होने के कारण ‘सुधि लेने’ से परमेश्वर की कृपापूर्ण ओर ध्यान देना व्यक्त होता है, जबकि पादटिप्पणी व्यापक अर्थ-संभावना सुरक्षित रखती है।
- source_word: αὐτῶν
  choice: उनकी
  rationale: बहुवचन सर्वनाम इस्राएल के लोगों को सामूहिक रूप से संदर्भित करता है; ‘उनकी सुधि लेने’ से इसे परमेश्वर की ओर से उन पर किए गए कार्य के रूप में स्पष्ट किया गया है।
theological_decisions:
- issue: अंतिम वाक्यांश ἐν τῇ ἐπισκοπῇ αὐτῶν का आशय
  choice: परमेश्वर द्वारा इस्राएल की कृपापूर्वक सुधि लेना
  alternative: उनकी देखरेख में; उनके पास आने के समय; उनके विषय में हस्तक्षेप करते समय
  rationale: निकटवर्ती प्रसंग शुभ समाचार और परमेश्वर की दया का है, इसलिए इसे सकारात्मक ईश्वरीय आगमन अथवा कृपापूर्ण ध्यान के रूप में समझना उचित है। फिर भी पादटिप्पणी यूनानी संज्ञा की व्यापकता और वास्तविक अर्थगत तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक उद्घोषणा वाला स्वर रखा गया है। ‘शुभ समाचार’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक तकनीकी धार्मिक अर्थ से बचाता है। ‘सुधि लेने’ साहित्यिक किन्तु सुबोध है तथा ईश्वरीय कृपापूर्ण ध्यान का भाव देता है।
