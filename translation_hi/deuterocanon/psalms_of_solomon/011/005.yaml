lexical_decisions:
- source_word: ὄρη
  choice: पहाड़ों
  rationale: बहुवचन संज्ञा बड़े पर्वतीय भूभाग को दर्शाती है; सामान्य आधुनिक हिन्दी में ‘पहाड़’ स्वाभाविक और चित्रात्मक है।
- source_word: ὑψηλὰ
  choice: ऊँचे
  rationale: यह भौतिक ऊँचाई का सीधा बोध देता है और अनावश्यक काव्यात्मक अलंकरण नहीं जोड़ता।
- source_word: ἐταπείνωσεν
  choice: नीचा करके
  rationale: पहाड़ों के संदर्भ में क्रिया भौतिक रूप से नीचे किए जाने को व्यक्त करती है, जबकि मूल क्रिया में निहित ‘दीन करने’ की छाया भी कुछ हद तक बनी रहती है।
- source_word: εἰς ὁμαλισμὸν
  choice: समतल भूमि बना दिया
  rationale: εἰς परिणाम सूचित करता है और ὁμαλισμός समतलता या सपाट भूभाग को; यह हिन्दी प्रयोग परिणामी रूपांतरण को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: 'सम्प्रदान कारक को यहाँ लाभार्थक अर्थ में समझना प्रसंगानुकूल है: मार्ग समतल करना उनके हित में किया गया।'
