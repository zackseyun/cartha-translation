  yaml_path: translation/deuterocanon/psalms_of_solomon/011/009.yaml
  text: May the Lord do what he has spoken concerning Israel and Jerusalem[a]; may the Lord raise up Israel in the name of his glory[d][c][b]. The Lord’s mercy be upon Israel forever and ever.
translation:
  language: hi
  text: प्रभु इस्राएल और यरूशलेम के विषय में जो कुछ उसने कहा है, वह करे[a]। प्रभु अपनी महिमा के नाम में इस्राएल को उठा खड़ा करे[b]। प्रभु की दया इस्राएल पर सदा-सर्वदा बनी रहे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ उसने कहा है, उसे पूरा करे।”
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल को बहाल करे” अथवा “फिर से स्थापित करे।”
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “सदा तक और आगे भी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαι
  choice: पूरा करे
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना’ है, पर कही हुई बात को करने के संदर्भ में हिन्दी में ‘पूरा करे’ स्वाभाविक है। पादटिप्पणी अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
- source_word: ἐλάλησεν ἐπὶ
  choice: के विषय में जो कुछ उसने कहा है
  rationale: ἐπί के संबंधसूचक भाव को ‘के विषय में’ व्यक्त करता है और कथन को बिना किसी अधिक विशिष्ट भविष्यवाणी-संबंधी अर्थ में सीमित किए रखता है।
- source_word: ἀναστήσαι
  choice: उठा खड़ा करे
  rationale: यह क्रिया उठाने, पुनः खड़ा करने या बहाल करने का भाव रख सकती है। ‘उठा खड़ा करे’ मूल बिंब और अर्थगत व्यापकता को बनाए रखता है।
- source_word: ἐν ὀνόματι δόξης αὐτοῦ
  choice: अपनी महिमा के नाम में
  rationale: यह जानबूझकर मूल यूनानी की संक्षिप्त और कुछ असामान्य संरचना को बनाए रखता है तथा ‘नाम’ और ‘महिमा’ दोनों को अलग-अलग प्रकट करता है।
- source_word: ἔλεος
  choice: दया
  rationale: यह सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी शब्द है; मूल में निहित न होने वाली अतिरिक्त वाचा-संबंधी विशिष्टता नहीं जोड़ता।
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: सदा-सर्वदा
  rationale: यह आधुनिक हिन्दी में निरंतर और अनंत अवधि का स्वाभाविक पद है। मूल के असामान्य अतिरिक्त बल ‘और भी/आगे भी’ को पादटिप्पणी में दर्शाया गया है।
theological_decisions:
- issue: इस्राएल को ‘उठा खड़ा करने’ का आशय
  choice: ‘उठा खड़ा करे’ रखा गया, बिना इसे केवल पुनरुत्थान या केवल राजनीतिक पुनर्स्थापना बताने के।
  alternative: ‘इस्राएल को फिर से स्थापित करे’ अथवा ‘इस्राएल को बहाल करे’।
  rationale: यूनानी क्रिया किसी एक संकीर्ण अर्थ को अनिवार्य नहीं करती; चुना हुआ रूप पुनर्स्थापना, प्रतिष्ठापन और उठाए जाने की अर्थगत संभावना खुली रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। प्रार्थनात्मक कामनार्थक भाव के लिए ‘करे’ और अंतिम वाक्य में ‘बनी रहे’ का प्रयोग किया गया है। ‘अपनी महिमा के नाम में’ जानबूझकर कुछ औपचारिक रखा गया है, क्योंकि मूल वाक्यांश भी संक्षिप्त और अर्थगर्भित है।
