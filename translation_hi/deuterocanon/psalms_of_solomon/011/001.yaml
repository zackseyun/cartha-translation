  text: सिय्योन में पवित्र जनों को बुलाने का संकेत देने के लिए तुरही फूँको[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: ‘सिय्योन में पवित्र जनों के संकेत की तुरही फूँको।’ यूनानी संबंधकारक का अर्थ ‘पवित्र जनों के लिए संकेत’ भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαλπίσατε
  choice: तुरही फूँको
  rationale: यह σαλπίζω का बहुवचन आज्ञार्थक रूप है और सार्वजनिक रूप से तुरही बजाने की आज्ञा देता है। ‘तुरही फूँको’ आधुनिक हिन्दी में स्वाभाविक है तथा आज्ञार्थक बल बनाए रखता है।
- source_word: ἐν Σιὼν
  choice: सिय्योन में
  rationale: ἐν का स्थानवाचक अर्थ सीधे और स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐν σάλπιγγι
  choice: तुरही … के लिए
  rationale: यहाँ ἐν के साथ करण का भाव है। हिन्दी वाक्य-विन्यास में उसी तुरही को क्रिया ‘फूँको’ का सीधा कर्म बनाना अधिक स्वाभाविक है।
- source_word: σημασίας
  choice: संकेत देने
  rationale: σημασία किसी संकेत या सूचना देने वाले चिह्न/ध्वनि को दर्शाता है। प्रसंग में तुरही की ध्वनि एकत्र होने का संकेत है; ‘संकेत देने’ इस कार्यात्मक अर्थ को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: ἁγίων
  choice: पवित्र जनों को बुलाने का
  rationale: ἁγίων संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण है, अर्थात ‘पवित्र जन’। यहाँ इसे σημασίας के साथ उद्देश्यवाचक संबंध में समझा गया है—पवित्र जनों के लिए, अर्थात उन्हें बुलाने का संकेत।
theological_decisions:
- issue: ἁγίων का अभिप्रेत समुदाय
  choice: ‘पवित्र जन’ कहकर समुदाय को व्यापक और अनिर्धारित रखा गया है
  alternative: संत; याजक; अभिषिक्त जन
  rationale: यूनानी पाठ यह निश्चित नहीं करता कि इससे याजक, उपासक या समस्त पवित्र समुदाय अभिप्रेत है। इसलिए अनुवाद किसी संप्रदायगत या अधिक संकीर्ण पहचान को आरोपित नहीं करता।
- issue: σημασίας ἁγίων में संबंध
  choice: 'उद्देश्यवाचक: पवित्र जनों को बुलाने का संकेत'
  alternative: पवित्र जनों का संकेत; पवित्र संकेत
  rationale: ἁγίων बहुवचन संबंधकारक है और एकवचन σημασίας का विशेषण नहीं हो सकता; इसलिए ‘पवित्र संकेत’ व्याकरणतः असंभाव्य है। अगले पदों में बिखरे लोगों के लौटने का प्रसंग उद्देश्यवाचक अर्थ का समर्थन करता है, फिर भी शाब्दिक संरचना की अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक आह्वान के अनुरूप है। ‘संतों’ के स्थान पर ‘पवित्र जनों’ से परंपरा-विशेष की ध्वनि से बचते हुए मूल की व्यापकता रखी गई है। वाक्य के अंत का अल्पविराम दिए गए अंश के आगे जारी रहने का संकेत देता है।
