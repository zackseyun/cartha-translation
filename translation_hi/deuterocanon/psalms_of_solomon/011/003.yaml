  text: Stand[a], O Jerusalem, on high[c][b], and see your children gathered from east and west by the Lord.
translation:
  language: hi
  text: हे यरूशलेम, ऊँचे स्थान पर खड़ी हो और अपने बच्चों को देख, जो पूर्व और पश्चिम से प्रभु के द्वारा एक साथ[a] इकट्ठे किए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
