    text: या ‘एक होकर’; इस पद का अर्थ ‘एक ही समय में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆθι
  choice: खड़ी हो
  rationale: एकवचन आज्ञार्थक रूप यरूशलेम को मानवीकृत स्त्री के रूप में खड़े होकर देखने के लिए बुलाता है। ‘खड़ी हो’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: ἐφʼ ὑψηλοῦ
  choice: ऊँचे स्थान पर
  rationale: यह वाक्यांश देखने के लिए एक ठोस ऊँचे स्थान या ऊँचाई को सूचित करता है; यह अनावश्यक रूप से स्वर्गीय अर्थ नहीं जोड़ता।
- source_word: τέκνα
  choice: बच्चों
  rationale: τέκνα लिंग-समावेशी रूप से संतान या नगर के लोगों को सूचित कर सकता है; ‘बच्चों’ इसका सहज हिन्दी समकक्ष है।
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: पूर्व और पश्चिम से
  rationale: बहुवचन यूनानी रूप दिशाओं अथवा उन दिशाओं के प्रदेशों के लिए मुहावरेदार हैं; हिन्दी में ‘पूर्व और पश्चिम से’ स्वाभाविक है।
- source_word: συνηγμένα
  choice: इकट्ठे किए गए हैं
  rationale: पूर्ण निष्क्रिय कृदंत बच्चों के एकत्र किए जाने की परिणामी दशा दिखाता है। हिन्दी का यह रूप निष्क्रियता और वर्तमान परिणाम दोनों को व्यक्त करता है।
- source_word: εἰς ἅπαξ
  choice: एक साथ
  rationale: संदर्भ में यह संक्षिप्त पद मुख्यतः एकत्रता अथवा सामूहिक रूप से जुटाए जाने का भाव देता है; ‘एक साथ’ अचानकपन पर अनावश्यक बल नहीं देता और अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: Κυρίου
  choice: प्रभु के द्वारा
  rationale: ἀπό के साथ संबंध यहाँ कर्ता अथवा स्रोत का भाव देता है। निष्क्रिय हिन्दी वाक्य में ‘प्रभु के द्वारा’ इस कर्तृत्व को स्पष्ट और स्रोत-पाठ के निकट रखता है।
