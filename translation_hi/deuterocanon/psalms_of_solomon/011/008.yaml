  text: Put on[a], Jerusalem, the garments of your glory; make ready your sacred robe[c][b], for God has spoken good things to Israel forever and ever.
translation:
  language: hi
  text: हे यरूशलेम, अपनी महिमा के वस्त्र पहन ले; अपना पवित्र चोगा[a] तैयार कर, क्योंकि परमेश्वर ने इस्राएल के लिए सदा-सर्वदा भली बातें कही हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी पवित्रता का चोगा” अथवा “अपने पवित्रस्थान का चोगा।”
    reason: ἁγίασμα का अर्थ पवित्रता, पवित्र की गई वस्तु, या पवित्रस्थान हो सकता है।
  - marker: b
    text: यूनानी का अधिक शाब्दिक अर्थ है, “युग तक और आगे भी।”
    reason: καὶ ἔτι स्थायी अवधि में आगे की निरंतरता या अतिरिक्त बल जोड़ता है; यह पदबंध अनंतकाल के प्रचलित मुहावरे के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: ἔνδυσαι
  choice: पहन ले
  rationale: मध्यवाच्य आज्ञार्थक रूप यरूशलेम को स्वयं वस्त्र धारण करने के लिए कहता है। ‘पहन ले’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञा का बल बनाए रखता है।
- source_word: τὰ ἱμάτια τῆς δόξης σου
  choice: अपनी महिमा के वस्त्र
  rationale: ‘वस्त्र’ बहुवचन को और ‘महिमा’ δόξα की बाइबिलीय तथा काव्यात्मक गूँज को सुरक्षित रखता है।
- source_word: ἑτοίμασον
  choice: तैयार कर
  rationale: यह आज्ञार्थक क्रिया किसी वस्तु को तैयार करने का सीधा निर्देश देती है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: τὴν στολὴν
  choice: चोगा
  rationale: στολή प्रायः लंबे या गरिमापूर्ण परिधान को सूचित करता है। ‘चोगा’ एकवचन और विशिष्ट परिधान की छवि को बनाए रखता है।
- source_word: τοῦ ἁγιάσματός σου
  choice: अपनी पवित्रता का
  rationale: ἁγίασμα पवित्रता, पवित्र की गई वस्तु अथवा पवित्रस्थान का अर्थ दे सकता है। मुख्य पाठ में ‘पवित्रता’ यरूशलेम के अलंकरण की छवि के साथ सहज बैठता है; पवित्रस्थान वाला अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐλάλησεν ἀγαθὰ
  choice: शुभ बातें कही हैं
  rationale: अनुवाद ‘कहा’ क्रिया को बनाए रखता है और इसे अधिक व्याख्यात्मक ‘प्रतिज्ञा की’ में नहीं बदलता। ‘शुभ बातें’ ἀγαθὰ के अनुकूल है।
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: सदा और उससे भी आगे
  rationale: यह अनुवाद स्थायी अवधि के साथ καὶ ἔτι के अतिरिक्त विस्तार को भी व्यक्त करता है, उसे केवल ‘सदा-सर्वदा’ में समाहित नहीं करता।
theological_decisions:
- issue: यरूशलेम के परिधान के संदर्भ में τοῦ ἁγιάσματός σου का अर्थ
  choice: अपनी पवित्रता का चोगा
  alternative: अपने पवित्रस्थान का चोगा; अपना पवित्र चोगा
  rationale: पद की काव्यात्मक छवि यरूशलेम को उसकी पवित्र स्थिति के अनुरूप वस्त्र पहनाती है, पर यूनानी संज्ञा पवित्रस्थान की ओर भी संकेत कर सकती है। इसलिए मुख्य पाठ में पवित्रता और पादटिप्पणी में पवित्रस्थान का विकल्प रखा गया है।
- issue: εἰς τὸν αἰῶνα καὶ ἔτι में अनंतता और अतिरिक्त निरंतरता
  choice: सदा और उससे भी आगे
  alternative: सदा-सर्वदा; युगानुयुग
  rationale: ‘सदा और उससे भी आगे’ मूल वाक्यांश के असामान्य अतिरिक्त καὶ ἔτι को दिखाई देता रहने देता है, जबकि अधिक मुहावरेदार विकल्प उसे सामान्य अनंतकालीन सूत्र में समेट देते हैं।
translation_notes:
  register: काव्यात्मक और गरिमापूर्ण, पर आधुनिक मानक हिन्दी में सहज। यरूशलेम को स्त्रीलिंग संबोधन मानते हुए ‘पहन ले’ और ‘तैयार कर’ का प्रयोग किया गया है। ‘शुभ बातें कही हैं’ मूल की वाणी-संबंधी अभिव्यक्ति को बनाए रखता है और उसे स्पष्ट प्रतिज्ञा में नहीं बदलता।
