- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह भक्ति और ज्ञान-साहित्य की आशीर्वचन शैली को स्वाभाविक हिन्दी में बनाए रखता है; ‘सुखी’ अपेक्षाकृत भावात्मक और ‘भाग्यशाली’ अधिक लौकिक लगता।
- source_word: φοβούμενοι
  choice: भय मानते हैं
