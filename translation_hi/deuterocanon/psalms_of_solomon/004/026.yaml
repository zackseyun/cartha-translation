- source_word: τὸν κύριον
  choice: प्रभु का
  rationale: κύριος के ईश्वरीय पदनाम का प्रचलित, गरिमापूर्ण और संदर्भानुकूल हिन्दी रूप।
- source_word: ἐν ἀκακίᾳ αὐτῶν
  choice: अपनी निष्कपटता में
  rationale: ἀκακία यहाँ बुराई, छल या कपट से रहित होने का भाव रखता है। ‘निष्कपटता’ इस नैतिक आशय को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करती है, जबकि ‘निर्दोषता’ व्यापक अर्थ भी ले सकती है।
