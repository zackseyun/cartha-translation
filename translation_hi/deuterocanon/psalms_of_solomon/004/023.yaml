  yaml_path: translation/deuterocanon/psalms_of_solomon/004/023.yaml
  text: For he has laid waste many people’s households in disgrace[b][a], and scattered them by lust.
translation:
  language: hi
  text: क्योंकि उसने अपमान में बहुत-से लोगों के घराने[a] उजाड़ दिए, और अभिलाषा[b] के कारण उन्हें तितर-बितर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘घर’; आशय पूरे परिवारों या घरानों से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लालसा के कारण’ अथवा ‘वासना के कारण’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: उजाड़ दिए
  rationale: क्रिया का अर्थ निर्जन या बरबाद कर देना है; ‘उजाड़ दिए’ उसकी तीव्रता और परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἴκους
  choice: घराने
  rationale: शाब्दिक अर्थ ‘घर’ है, पर प्रसंग में परिवार या समूचे गृहस्थ समुदाय का आशय हो सकता है; ‘घराने’ इस सामाजिक अर्थ को समेटता है।
- source_word: ἀνθρώπων
  choice: लोगों के
  rationale: यह संज्ञा यहाँ सामान्य मानवीय अर्थ रख सकती है; ‘लोगों के’ अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: ἐν ἀτιμίᾳ
  choice: अपमान में
  rationale: यह पदबंध अनादर, लज्जा या सामाजिक बदनामी का भाव देता है; ‘अपमान में’ मूल की संक्षिप्त संरचना और नैतिक-सामाजिक आयाम बनाए रखता है।
- source_word: ἐσκόρπισεν
  choice: तितर-बितर कर दिया
  rationale: मूल क्रिया बिखेरने या अलग-अलग कर देने का चित्र प्रस्तुत करती है; यह हिन्दी प्रयोग परिवारों के टूटने का भाव स्पष्ट करता है।
- source_word: ἐπιθυμίᾳ
  choice: अभिलाषा के कारण
  rationale: ἐπιθυμία इच्छा, लालसा या कामना को सूचित कर सकता है। ‘अभिलाषा’ मूल की वास्तविक व्यापकता बनाए रखती है और ‘वासना’ जैसा अधिक संकीर्ण अर्थ मुख्य पाठ में आरोपित नहीं करती।
theological_decisions:
- issue: ἐπιθυμίᾳ का नैतिक और सम्भावित यौन अर्थ
  choice: मुख्य पाठ में ‘अभिलाषा’, और पादटिप्पणी में ‘वासना’ का विकल्प
  alternative: ‘वासना के कारण’
  rationale: निकटवर्ती ‘अपमान’ नकारात्मक अर्थ का समर्थन करता है, पर संज्ञा अपने आप में इच्छा या लालसा के व्यापक अर्थ भी रखती है। इसलिए मुख्य पाठ अस्पष्टता बचाता है और सम्भावित अधिक तीखा अर्थ पादटिप्पणी में देता है।
- issue: οἴκους का भवन अथवा परिवार-संबंधी अर्थ
  choice: ‘घराने’
  alternative: ‘घर’
  rationale: प्रसंग लोगों के सामाजिक और पारिवारिक विनाश की ओर संकेत कर सकता है, फिर भी शाब्दिक अर्थ ‘घर’ है; इस विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और संक्षिप्त शैली अपनाई गई है। यूनानी वाक्य की कारणसूचक शुरुआत और समानांतर क्रियात्मक संरचना बनाए रखी गई है।
