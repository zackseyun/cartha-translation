  yaml_path: translation/deuterocanon/psalms_of_solomon/004/020.yaml
  text: May his old age be in the solitude of childlessness[b][a], for removal.
translation:
  language: hi
  text: उसका बुढ़ापा निःसंतानता के अकेलेपन में बीते,[a] उसके उठा लिए जाने तक।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निःसंतानता के एकांत में।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उठा लिए जाने के लिए’ या ‘हटाए जाने के लिए’; यूनानी पद लक्ष्य अथवा अंतिम परिणति भी व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μονίᾳ
  choice: अकेलेपन
  rationale: यह शब्द अकेली या अलग-थलग अवस्था को व्यक्त करता है। शाप के इस प्रसंग में ‘अकेलापन’ उस व्यक्तिगत उजाड़पन को स्वाभाविक हिन्दी में सामने लाता है; ‘एकांत’ भी संभव है।
- source_word: ἀτεκνίας
  choice: निःसंतानता
  rationale: यह संतान न होने की अवस्था का स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी पर्याय है।
- source_word: γῆρας
  choice: बुढ़ापा
  rationale: यह व्यक्ति के जीवन की वृद्धावस्था के लिए सहज और मानक हिन्दी शब्द है।
- source_word: εἰς ἀνάλημψιν
  choice: उसके उठा लिए जाने तक
  rationale: ἀνάλημψις का मूल भाव उठा लेने या हटा देने का है। प्रसंग में यह संभवतः मृत्यु में हटा दिए जाने की ओर संकेत करता है, पर मृत्यु को पाठ में स्पष्ट रूप से नहीं जोड़ा गया। εἰς के लक्ष्यसूचक अर्थ को यहाँ स्वाभाविक हिन्दी में सीमाबोधक ‘तक’ से व्यक्त किया गया है और अधिक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: '[implicit imprecatory force]'
  choice: बीते
  rationale: यूनानी वाक्यांश क्रियारहित है, पर आसपास के शापात्मक निवेदनों से इच्छासूचक बल आगे चलता है। ‘बीते’ इस निहित कामना को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्रियारहित खंड को शापात्मक इच्छा मानना या तटस्थ वर्णन
  choice: 'इसे शापात्मक इच्छा के रूप में प्रस्तुत किया गया है: ‘उसका बुढ़ापा…बीते।’'
  alternative: इसे बिना इच्छासूचक बल के केवल नामवाची वर्णन माना जा सकता है।
  rationale: आसपास के पद न्याय के लिए की गई शापात्मक प्रार्थनाओं की शृंखला हैं; इसलिए यहाँ भी निहित इच्छासूचक बल सबसे अधिक प्रसंगानुकूल है।
- issue: ἀνάλημψις को सीधे मृत्यु कहना या उसके व्यापक अर्थ को बनाए रखना
  choice: ‘उठा लिए जाने’ का व्यापक रूप रखा गया है।
  alternative: ‘मरने तक’ या ‘हटा दिए जाने तक’ कहा जा सकता है।
  rationale: प्रसंग मृत्यु की ओर संकेत कर सकता है, किंतु मूल संज्ञा स्वयं केवल उठा लेने अथवा हटाने को व्यक्त करती है; अतः अनिश्चितता को नहीं मिटाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निःसंतानता’ औपचारिक स्पष्टता देता है, जबकि ‘अकेलापन’ शाप के भावात्मक भार को साधारण पाठक तक पहुँचाता है। वाक्य की संक्षिप्तता और मूल यूनानी की अर्थगत अनिश्चितता सुरक्षित रखी गई है।
