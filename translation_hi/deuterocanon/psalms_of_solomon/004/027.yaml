  yaml_path: translation/deuterocanon/psalms_of_solomon/004/027.yaml
  text: And the Lord will rescue them from deceitful and sinful people[b][a], and he will rescue us from every lawless snare.
translation:
  language: hi
  text: और प्रभु उन्हें छली लोगों और पापियों से छुड़ाएगा, और वह हमें हर अधर्ममय फंदे[a] से छुड़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठोकर के हर अधर्ममय कारण से”; अथवा, “अधर्मी जन या जनों की ओर से आनेवाली ठोकर के हर कारण से।”
    reason: σκανδάλου का अर्थ ‘फंदा’ या ‘ठोकर का कारण’ हो सकता है, और παρανόμου को विशेषण अथवा संज्ञात्मक संबंध के रूप में समझना संभव है।
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ उसका स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ῥύσεται
  choice: छुड़ाएगा
  rationale: क्रिया संकट या शत्रु के वश से बचाने का भाव रखती है; दोनों उपवाक्यों में ‘छुड़ाएगा’ सहज बैठता है।
- source_word: ἀνθρώπων δολίων
  choice: छली लोगों
  rationale: ἀνθρώπων सामान्य रूप से मनुष्यों को सूचित करता है और δολίων छल-कपट से युक्त होने का भाव देता है; ‘छली लोगों’ संक्षिप्त और स्वाभाविक है।
- source_word: ἁμαρτωλῶν
  choice: पापियों
  rationale: इसे δολίων के साथ केवल दूसरा विशेषण बनाकर समतल नहीं किया गया; संज्ञात्मक बहुवचन ‘पापियों’ मूल में संभावित विशिष्ट समूह-संज्ञा को सुरक्षित रखता है।
- source_word: σκανδάλου
  choice: फंदे
  rationale: इस प्रसंग में σκανδάλου ऐसी वस्तु या परिस्थिति का बोध करा सकता है जो फँसाकर पतन कराए; ‘फंदा’ आधुनिक हिन्दी में इस रूपक को स्पष्ट रखता है।
- source_word: παρανόμου
  choice: अधर्ममय
  rationale: शब्द का मूल भाव व्यवस्था या विधि के विरुद्ध होना है; यहाँ इसे σκανδάλου का विशेषण मानते हुए ‘अधर्ममय’ चुना गया है।
theological_decisions:
- issue: ἁμαρτωλῶν का विशेषणात्मक या संज्ञात्मक अर्थ
  choice: ‘पापियों’—एक अलग संज्ञात्मक समूह
  alternative: ‘पापी लोगों’ या ‘छली और पापी लोगों’
  rationale: यूनानी में δολίων और ἁμαρτωλῶν दोनों ἀνθρώπων से जुड़ सकते हैं, पर ἁμαρτωλῶν स्वतंत्र रूप से ‘पापियों’ का समूह भी सूचित कर सकता है। पुस्तक की सामाजिक-धार्मिक शब्दावली को अनावश्यक रूप से सामान्य विशेषण में नहीं बदला गया।
- issue: παντὸς σκανδάλου παρανόμου की संरचना
  choice: ‘हर अधर्ममय फंदे’—παρανόμου को σκανδάλου का विशेषण माना
  alternative: ‘अधर्मी जन/जनों द्वारा ठोकर के हर कारण से’
  rationale: व्याकरण की सीधी रचना नपुंसकलिंग विशेषण द्वारा ‘फंदे’ का वर्णन है, लेकिन παρανόμου का संज्ञात्मक संबंध भी संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। समानांतर दोनों उपवाक्यों में ‘छुड़ाएगा’ दोहराकर यूनानी संरचना रखी गई है। ‘छली लोगों और पापियों’ मूल की संभावित समूह-भिन्नता को बचाता है; पादटिप्पणी σκανδάλου παρανόμου की वास्तविक lexical और syntactic अस्पष्टता दर्ज करती है।
