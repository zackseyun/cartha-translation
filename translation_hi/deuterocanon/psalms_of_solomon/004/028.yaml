  yaml_path: translation/deuterocanon/psalms_of_solomon/004/028.yaml
  text: May God remove those who do every kind of unrighteousness in arrogance[c][b][a], for the Lord our God is a great and mighty judge in righteousness.
translation:
  language: hi
  text: परमेश्वर उन लोगों को दूर कर दे जो घमंड में हर प्रकार का अधर्म करते हैं[b], क्योंकि प्रभु हमारा परमेश्वर धार्मिकता[a] से न्याय करने वाला महान और सामर्थी न्यायाधीश है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय से।”
    reason: δικαιοσύνη का अर्थ ‘धार्मिकता’ के साथ-साथ, विशेषकर न्यायिक संदर्भ में, ‘न्याय’ भी हो सकता है।
  - marker: b
    text: “हर प्रकार का अधर्म” का अनुवाद “हर अन्याय” भी हो सकता है।
    reason: ἀδικία में व्यापक नैतिक अधर्म और विशिष्ट अन्याय, दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: ἐξᾶραι
  choice: दूर कर दे
  rationale: अओरिस्ट इनफिनिटिव यहाँ प्रार्थनात्मक इच्छा या धिक्कार का भाव रखता है। ‘दूर कर दे’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है और ‘नाश कर दे’ जैसी अधिक स्पष्ट हिंसक धारणा नहीं जोड़ता।
- source_word: τοὺς ποιοῦντας
  choice: उन लोगों को ... जो ... करते हैं
  rationale: वर्तमान कृदन्त ऐसे लोगों की चारित्रिक अथवा निरंतर क्रिया को दर्शाता है; यह हिन्दी रूप स्पष्ट और स्वाभाविक है।
- source_word: ἐν ὑπερηφανίᾳ
  choice: घमंड में
  rationale: यह वाक्यांश कार्य के ढंग अथवा नैतिक क्षेत्र को बताता है। संज्ञात्मक रचना बनाए रखते हुए ‘घमंड में’ यूनानी के नैतिक भार को व्यक्त करता है।
- source_word: πᾶσαν ἀδικίαν
  choice: हर प्रकार का अधर्म
  rationale: ἀδικία अन्याय अथवा अधर्म दोनों हो सकता है। यहाँ व्यापक नैतिक अर्थ के कारण ‘अधर्म’ उपयुक्त है, और ‘हर प्रकार का’ πᾶσαν के व्यापक बल को सहज हिन्दी में प्रकट करता है।
- source_word: κριτὴς
  choice: न्यायी
  rationale: यहाँ न्यायिक अर्थ प्रधान है; ‘न्यायी’ व्यक्ति-संज्ञा के रूप में परमेश्वर को न्याय करनेवाला बताता है और निकटवर्ती क्रियात्मक वाक्यांश से स्वाभाविक रूप से जुड़ता है।
- source_word: κραταιὸς
  choice: सामर्थी
  rationale: यह ऊँचे किंतु आधुनिक धार्मिक गद्य में ‘शक्तिशाली’ या ‘बलवान’ के समान अर्थ देते हुए ‘महान’ के साथ सहज युग्म बनाता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: दैवी उपाधि के रूप में κύριος का मानक और स्वाभाविक हिन्दी अनुवाद।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता से न्याय करनेवाला
  rationale: संदर्भ में यह वाक्यांश परमेश्वर के न्याय करने के ढंग को विशेषित करता है। हिन्दी में केवल ‘धार्मिकता में न्यायी’ अस्वाभाविक होता; यह रूप δικαιοσύνη की व्यापक नैतिक धारणा रखते हुए संबंध स्पष्ट करता है।
theological_decisions:
- issue: न्यायिक संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय / न्यायपूर्वक
  rationale: न्याय के प्रसंग में ‘न्याय’ संभव है, पर ‘धार्मिकता’ यूनानी शब्द की व्यापक नैतिक और वाचागत अर्थ-छाया को संकुचित नहीं करता। स्वाभाविक हिन्दी के लिए इसे ‘धार्मिकता से न्याय करनेवाला’ में रखा गया है।
- issue: ἐξᾶραι की प्रार्थनात्मक अथवा धिक्कारात्मक शक्ति
  choice: परमेश्वर ... दूर कर दे
  alternative: परमेश्वर को ... दूर करना / परमेश्वर ... काट डाले
  rationale: मूल इनफिनिटिव संदर्भ में इच्छा या धिक्कार व्यक्त करता है। हिन्दी संभावनार्थक रूप उस बल को सुरक्षित रखता है, जबकि अधिक हिंसक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘दूर कर दे’ अभिशापात्मक भाव को बचाता है पर मूल से अधिक हिंसक विशिष्टता नहीं जोड़ता। ‘न्याय करनेवाला ... न्यायी’ में हल्की पुनरुक्ति जानबूझकर स्वीकार की गई है ताकि κριτής और ἐν δικαιοσύνῃ दोनों का अर्थ स्पष्ट रहे।
