  yaml_path: translation/deuterocanon/psalms_of_solomon/004/010.yaml
  text: And their eyes are on a man's house in prosperity[a], like a snake[d][c][b], to undo one another's wisdom with lawless words.
translation:
  language: hi
  text: और उनकी आँखें किसी सुखी-समृद्ध व्यक्ति के घराने[b] पर लगी रहती हैं—साँप के समान—ताकि वे अधर्मियों की बातों से एक-दूसरे की बुद्धि को नष्ट कर दें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “घर।” यहाँ घर से परिवार, गृहस्थी अथवा संपत्ति का व्यापक अर्थ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “एक-दूसरे की बुद्धि को विफल कर दें” अथवा “छिन्न-भिन्न कर दें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: उनकी आँखें … लगी रहती हैं
  rationale: मूल यूनानी की सजीव शारीरिक छवि और लगातार बुरी नज़र रखने का भाव सुरक्षित रहता है; हिन्दी में ‘आँखें … लगी रहती हैं’ स्वाभाविक है।
- source_word: ἐπʼ οἶκον ἀνδρὸς
  choice: उस मनुष्य के घराने पर
  rationale: οἶκος केवल भवन ही नहीं, परिवार और संपत्ति सहित घराने को भी सूचित कर सकता है। प्रसंग में लक्ष्य किसी समृद्ध व्यक्ति का व्यापक गृहस्थ जीवन जान पड़ता है।
- source_word: ἐν εὐσταθείᾳ
  choice: जो सुख-समृद्धि में है
  rationale: εὐστάθεια में स्थिरता, सुरक्षित दशा और कुशलता का भाव है; यहाँ ‘सुख-समृद्धि’ सामान्य पाठक के लिए प्रसंगानुकूल है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: ὡς ὄφις
  choice: साँप के समान
  rationale: तुलना की शिकारी और कपटी छवि को सीधे तथा आधुनिक हिन्दी में व्यक्त करता है। यूनानी में ὄφις एकवचन है, जिसे हिन्दी में भी रखा गया है।
- source_word: διαλῦσαι
  choice: नष्ट कर दें
  rationale: क्रिया का अर्थ खोल देना, विघटित करना, निष्फल करना या नष्ट करना हो सकता है। उद्देश्यसूचक infinitive को ‘ताकि’ से व्यक्त किया गया है।
- source_word: σοφίαν ἀλλήλων
  choice: एक-दूसरे की बुद्धि
  rationale: ἀλλήλων का पारस्परिक भाव और σοφία का बौद्धिक-नैतिक अर्थ दोनों सुरक्षित रहते हैं।
- source_word: ἐν λόγοις παρανόμων
  choice: अधर्मियों की बातों से
  rationale: παρανόμων संबंधकारक बहुवचन है और संज्ञा रूप में ‘अधर्मियों/व्यवस्था तोड़ने वालों’ को दर्शाता है; यह λόγοις से मेल खाता विशेषण नहीं है। इसलिए ‘अधर्मियों की बातों से’ यूनानी व्याकरण को ठीक रूप से व्यक्त करता है।
theological_decisions:
- issue: παρανόμων को विशेषण मानना या संज्ञा
  choice: अधर्मियों की बातों से
  alternative: अधर्म की बातों से / व्यवस्था-विरुद्ध बातों से
  rationale: यूनानी रूप संबंधकारक बहुवचन है, इसलिए इसे लोगों के लिए प्रयुक्त संज्ञात्मक विशेषण मानना सबसे स्वाभाविक है। इससे किसी विशिष्ट धार्मिक व्यवस्था की पहचान आरोपित नहीं की जाती।
- issue: οἶκος का दायरा
  choice: घराना
  alternative: घर
  rationale: ‘घराना’ परिवार, गृहस्थी और संपत्ति के व्यापक सामाजिक अर्थ को ग्रहण करता है, पर ‘घर’ की संभाव्यता पाद-टिप्पणी में बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। वाक्य की असामान्य साँप-संबंधी उपमा को मूल के अनुरूप बनाए रखने के लिए डैशों में रखा गया है। ‘अधर्मियों की बातों से’ पाठ नवीनतम अंग्रेज़ी परत के बजाय यूनानी के संबंधकारक बहुवचन παρανόμων पर आधारित है।
