lexical_decisions:
- source_word: ἀφαιρεθείη ὕπνος
  choice: नींद छीन ली जाए
  rationale: निष्क्रिय विधिलिंग-सदृश कामनार्थक रूप को अभिशाप/कामना के रूप में रखा गया है; ‘छीन ली जाए’ ἀφαιρέω की बलपूर्ण वंचना व्यक्त करता है।
- source_word: κροτάφων
  choice: कनपटियों
  rationale: κρόταφος का सीधा शारीरिक अर्थ ‘कनपटी’ है; इसे ‘आँखों’ में बदलना स्रोत-साक्ष्य से समर्थित नहीं है।
- source_word: ἀποπέσοιεν
  choice: विफल हो जाएँ
  rationale: क्रिया का मूल भाव ‘गिर पड़ना/अलग हो जाना’ है; काम के संदर्भ में ‘विफल हो जाना’ स्वाभाविक हिन्दी में अभिप्रेत निष्फलता को व्यक्त करता है।
- source_word: παντὸς ἔργου χειρῶν αὐτοῦ
  choice: उसके हाथ अपने हर काम में
  rationale: ‘उसके हाथों के हर काम’ को स्वाभाविक हिन्दी में व्यक्त करते हुए हाथों को बहुवचन क्रिया का संभावित कर्ता बनाया गया है।
theological_decisions:
- issue: ἀποπέσοιεν का अनुल्लिखित बहुवचन कर्ता
  choice: मुख्य पाठ में ‘उसके हाथ’ को कर्ता माना गया
  alternative: ‘वे उसके हाथों के हर काम से दूर हो जाएँ/गिर पड़ें’
  rationale: यूनानी में बहुवचन कर्ता स्पष्ट रूप से नहीं दिया गया और निकटतम स्पष्ट बहुवचन ‘कनपटियाँ’ अर्थ की दृष्टि से असंगत है। ‘हाथ’ को कर्ता मानना प्रसंगानुकूल है, पर अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
