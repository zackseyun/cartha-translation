translation:
  language: hi
  text: और इन सब बातों में उन्होंने परमेश्वर को स्मरण नहीं किया और परमेश्वर से नहीं डरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: स्मरण नहीं किया
  rationale: यह मिम्नेस्कोमाइ के भूतकालीन रूप का सीधा और गरिमापूर्ण अनुवाद है तथा परमेश्वर को मन में रखने या याद करने का भाव बनाए रखता है।
- source_word: ἐφοβήθησαν
  choice: नहीं डरे
  rationale: परमेश्वर के संबंध में क्रिया का मूल भय अथवा श्रद्धामिश्रित भय का अर्थ है। ‘नहीं डरे’ स्रोत की नैतिक गंभीरता को बनाए रखता है और इसे केवल आदर तक सीमित नहीं करता।
- source_word: ἐν πᾶσι τούτοις
  choice: इन सब बातों के बीच
  rationale: यह वाक्यांश पहले वर्णित समस्त परिस्थितियों के दौरान उनकी विफलता को रखता है; हिंदी में ‘इन सब बातों के बीच’ यह संदर्भगत अर्थ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के प्रति भय का अर्थ
  choice: परमेश्वर से नहीं डरे
  alternative: परमेश्वर का आदर नहीं किया
  rationale: मूल क्रिया भय और श्रद्धा दोनों का भाव रख सकती है। ‘डरे’ मूल शब्द की तीव्रता और जानबूझकर छोड़े गए अर्थ-विस्तार को सुरक्षित रखता है, जबकि ‘आदर’ अर्थ को अनावश्यक रूप से नरम कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज शैली अपनाई गई है। मूल यूनानी में ‘परमेश्वर’ की पुनरावृत्ति है, इसलिए हिंदी में भी उसे बनाए रखा गया है।
