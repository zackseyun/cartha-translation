review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the latter clauses: ἔνοχος is conveyed by “दोषी,” ποικιλίᾳ ἁμαρτωλῶν is reasonably rendered as “अनेक प्रकार के पापपूर्ण कामों,” and plural ἀκρασίαις as “असंयम के कृत्यों.” The grammatical ambiguity of ἁμαρτωλῶν is appropriately preserved in note c. However, “उसके विरुद्ध उठनेवालों में” introduces a group of persons not expressed by the Greek and makes χείρ (“hand”) appear to be a member of that group. Revising this to the hand’s being foremost in moving against him preserves the image and the priority sense of ἐν πρώτοις.'
  naturalness: The Hindi is generally clear and suitably elevated. “उसका हाथ उसके विरुद्ध सबसे आगे बढ़ता है” is more idiomatic and syntactically coherent than “उसका हाथ उसके विरुद्ध उठनेवालों में सबसे आगे है.” “मानो वह जोश में हो” is natural without adding the intensifier “बड़े.”
  terminology: “दोषी,” “पापपूर्ण काम,” and “असंयम के कृत्य” maintain the moral and judicial force of the Greek without importing doctrinal interpretation. “जोश” suitably renders ζῆλος in modern Hindi; the comparative/possibly pretended force of ὡς is retained by “मानो.”
  issues:
  - severity: medium
    issue: The opening expression adds an unexpressed group of opponents.
    rationale: “उसके विरुद्ध उठनेवालों में” means “among those who rise against him,” whereas the Greek says that his hand is among the first/foremost against the other person. This both introduces persons and creates an unnatural image of a hand being among them.
  - severity: low
    issue: “बड़े जोश” adds emphasis absent from the Greek.
    rationale: ζήλει means zeal/enthusiasm; “बड़े” is unnecessary. The simpler wording retains the source’s restrained ambiguity.
  revised_text: और उसका हाथ उसके विरुद्ध सबसे आगे बढ़ता है[a], मानो वह जोश में हो[b]; पर वह स्वयं अनेक प्रकार के पापपूर्ण कामों[c] और असंयम के कृत्यों का दोषी है।
