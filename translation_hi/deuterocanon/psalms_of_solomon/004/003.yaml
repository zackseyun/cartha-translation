  yaml_path: translation/deuterocanon/psalms_of_solomon/004/003.yaml
  text: And his hand is among the first against him[a], as if in zeal, but he himself is guilty in a variety of sinful deeds[d][c][b], in acts of self-indulgence.
translation:
  language: hi
  text: और उसका हाथ उसके विरुद्ध सबसे आगे बढ़ता है[a], मानो वह जोश में हो[b]; पर वह स्वयं अनेक प्रकार के पापपूर्ण कामों[c] और असंयम के कृत्यों का दोषी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और आरम्भ में ही उसका हाथ उस पर है”; ἐν πρώτοις को उसके विरुद्ध कार्रवाई में अग्रता के बजाय समय के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “जैसे जोश में”; यह वाक्यांश प्रकट जोश या जताए गए जोश का वर्णन कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'ἁμαρτωλῶν का रूप “पापियों” या नपुंसकलिंग अर्थ में “पापपूर्ण बातों/कामों” को सूचित कर सकता है। इसलिए वैकल्पिक अनुवाद है: “पापियों के अनेक प्रकार के मार्गों में।”'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: χείρ
  choice: हाथ
  rationale: शाब्दिक बिंब को बनाए रखता है और किसी के विरुद्ध हाथ उठाने की स्वाभाविक हिन्दी अभिव्यक्ति में ठीक बैठता है।
- source_word: ἐν πρώτοις
  choice: सबसे आगे
  rationale: सन्दर्भ में यह केवल समयक्रम नहीं, बल्कि किसी के विरुद्ध कार्रवाई करने में उसकी अग्रता और तत्परता व्यक्त करता है।
- source_word: ἐπʼ αὐτόν
  choice: उसके विरुद्ध
  rationale: χείρ के साथ यह विरोधी कार्रवाई का भाव देता है; हिन्दी में ‘हाथ ... विरुद्ध उठना’ स्वाभाविक है।
- source_word: ὡς ἐν ζήλει
  choice: मानो वह बड़े जोश में हो
  rationale: ὡς को बनाए रखते हुए यह वास्तविक धर्मनिष्ठ उत्साह के बजाय दिखाई देनेवाले या जताए गए जोश की सम्भावना खुली रखता है।
- source_word: ἔνοχος
  choice: दोषी
  rationale: आरोपात्मक प्रसंग में स्वाभाविक न्यायिक और नैतिक शब्द है।
- source_word: ποικιλίᾳ ἁμαρτωλῶν
  choice: अनेक प्रकार के पापपूर्ण कामों
  rationale: ἁμαρτωλῶν को नपुंसकलिंग बहुवचन संज्ञीकृत विशेषण, अर्थात ‘पापपूर्ण बातों/कामों’, के रूप में समझना अगले पदांश के समानांतर है; ποικιλίᾳ की विविधता भी स्पष्ट रहती है।
- source_word: ἀκρασίαις
  choice: असंयम के कृत्यों
  rationale: यह आत्म-संयम के अभाव से उपजे अनेक आचरणों को व्यक्त करता है और यूनानी बहुवचन को बनाए रखता है।
theological_decisions:
- issue: ὡς ἐν ζήλει में जोश की वास्तविकता
  choice: ‘मानो’ द्वारा प्रत्यक्ष या जताए गए जोश का संकेत
  alternative: ‘जोश में’ कहकर वास्तविक जोश मानना
  rationale: पाठ का ὡς तुलना या दिखावे की सम्भावना रखता है; कपट के प्रसंग में इसे निश्चित रूप से वास्तविक धार्मिक उत्साह नहीं ठहराया गया।
- issue: ἁμαρτωλῶν का व्याकरणिक अर्थ
  choice: 'नपुंसकलिंग बहुवचन: ‘पापपूर्ण कामों’'
  alternative: 'पुल्लिंग बहुवचन: ‘पापियों के अनेक मार्गों’'
  rationale: दोनों रूप आकृतिगत रूप से सम्भव हैं, पर अपने अपराधों और ἀκρασίαις के समानांतर होने के कारण ‘पापपूर्ण काम’ प्रसंग में अधिक सीधा है; वैकल्पिक पाठ टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। ‘हाथ ... विरुद्ध उठना’ मूल का सजीव शारीरिक बिंब बचाता है। ‘असंयम’ नैतिक गम्भीरता रखता है, और ‘कृत्यों’ से यूनानी बहुवचन स्पष्ट होता है।
