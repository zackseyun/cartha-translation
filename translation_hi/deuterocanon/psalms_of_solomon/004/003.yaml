  to: और उसका हाथ उसके विरुद्ध सबसे आगे बढ़ता है[a], मानो वह जोश में हो[b]; पर वह स्वयं अनेक प्रकार के पापपूर्ण कामों[c] और असंयम के कृत्यों का दोषी है।
