    reason: lexical_alternative
lexical_decisions:
- source_word: γένοιτο
  choice: हो
  rationale: यूनानी इच्छार्थक क्रिया को प्रार्थना अथवा अभिशापात्मक कामना के रूप में व्यक्त करता है, न कि साधारण भविष्यवाणी के रूप में।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: ईश्वर को किए गए सीधे संबोधन के लिए स्वाभाविक और प्रतिष्ठित हिन्दी रूप।
- source_word: μερὶς
  choice: भाग
  rationale: व्यक्ति को मिलने वाले नियत अंश या परिणाम—दोनों अर्थों की गुंजाइश रखता है; ‘हिस्सा’ भी संभव है।
- source_word: ἀτιμίᾳ
  choice: अपमान
  rationale: अमूर्त संज्ञा और न्यायात्मक-नैतिक भाव को बनाए रखता है; ‘लज्जा’ की अपेक्षा सम्मान से वंचित किए जाने का भाव अधिक स्पष्ट है।
- source_word: ἔξοδος
  choice: बाहर जाना
  rationale: ‘भीतर आना’ के साथ जानबूझकर बनाए गए बाइबिलीय युग्म को सुरक्षित रखता है।
- source_word: στεναγμοῖς
  choice: कराहों के बीच
  rationale: बहुवचन में बार-बार अथवा लगातार होने वाले दुःखपूर्ण कराहने का भाव देता है और हिन्दी में ‘कराहों में’ से अधिक स्वाभाविक है।
- source_word: εἴσοδος
  choice: भीतर आना
  rationale: ‘बाहर जाना’ के साथ मूल का स्पष्ट विरोधी युग्म बनाए रखता है।
- source_word: ἀρᾷ
  choice: शाप के अधीन
  rationale: ἐν के साथ प्रयुक्त संज्ञा की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शब्दशः ‘शाप में’ है।
theological_decisions:
- issue: अभिशापात्मक कामना की संरचना
  choice: पद को दुष्ट व्यक्ति के विरुद्ध प्रभु से की गई सीधी प्रार्थना-कामना के रूप में प्रस्तुत किया गया है।
  alternative: इसे न्याय की सपाट भविष्यवाणी के रूप में प्रस्तुत करना।
  rationale: इच्छार्थक γένοιτο और संबोधन Κύριε प्रबल रूप से प्रार्थनात्मक कामना का संकेत देते हैं; मूल के धार्मिक तनाव को नरम नहीं किया गया।
- issue: ‘बाहर जाना’ और ‘भीतर आना’ का विस्तार
  choice: दोनों पदों को यथावत युग्म के रूप में रखा गया है।
  alternative: इन्हें व्याख्यात्मक रूप से ‘उसका पूरा जीवन’ कहना।
  rationale: युग्म संभवतः व्यक्ति की समस्त गतिविधियों या जीवन-क्रम को समेटता है, पर मूल इसे स्पष्ट नहीं करता; इसलिए अर्थ को मुख्य पाठ में सीमित नहीं किया गया।
