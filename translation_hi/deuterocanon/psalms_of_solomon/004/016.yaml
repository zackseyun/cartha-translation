  text: May his portion[a], O Lord, be in dishonor before you[d][c][b], his going out in groanings and his coming in in a curse.
translation:
  language: hi
  text: हे प्रभु, तेरे सामने अपमान उसका भाग हो[a], उसका बाहर जाना कराहों के बीच और उसका भीतर आना शाप के अधीन हो।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हिस्सा’; यहाँ ‘भाग’ से किसी को मिलने वाला नियत अंश या परिणाम अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बाहर जाना’ और ‘भीतर आना’ संभवतः एक बाइबिलीय युग्म है, जो किसी व्यक्ति की सारी गतिविधियों या उसके पूरे जीवन-क्रम को सूचित करता है।
    reason: cultural_note
