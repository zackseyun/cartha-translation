  text: May your mercy, O Lord, be upon all who love you.
translation:
  language: hi
  text: हे प्रभु, आपकी दया उन सभी पर हो जो आपसे प्रेम करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένοιτο
  choice: बनी रहे
  rationale: यह γίνομαι का इच्छासूचक रूप है और प्रार्थना की कामना व्यक्त करता है। हिंदी में ‘बनी रहे’ दया के किसी पर होने की प्रार्थना को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: संबोधन रूप κύριε यहाँ परमेश्वर को सीधे पुकारता है। ‘हे प्रभु’ आधुनिक हिंदी में स्पष्ट, प्रार्थनापूर्ण और बाइबिलीय संबोधन है।
- source_word: τὸ ἔλεός σου
  choice: आपकी दया
  rationale: ἔλεος का सीधा अर्थ दया अथवा करुणा है। ‘आपकी दया’ मूल के संबंधसूचक भाव को सहज हिंदी में सुरक्षित रखता है।
- source_word: ἐπὶ πάντας
  choice: उन सभी पर
  rationale: ἐπί के साथ यहाँ दया के व्यक्तियों पर होने का भाव है। ‘पर’ इसका स्वाभाविक हिंदी समतुल्य है, जबकि πάντας की समावेशिता ‘सभी’ से बनी रहती है।
- source_word: τοὺς ἀγαπῶντάς σε
  choice: जो आपसे प्रेम करते हैं
  rationale: वर्तमान कृदंत ऐसे लोगों के वर्ग को दर्शाता है जिनकी विशेषता परमेश्वर से प्रेम करना है। यह रूप हिंदी में स्वाभाविक है और चल रहे या चरित्रगत प्रेम को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर के लिए κύριος का प्रत्यक्ष संबोधन
  choice: हे प्रभु
  alternative: हे स्वामी
  rationale: ‘प्रभु’ κύριος का स्थापित और व्यापक बाइबिलीय हिंदी रूप है। यह ईश्वरीय संबोधन को बनाए रखता है और ‘स्वामी’ से उत्पन्न हो सकने वाले केवल मानवीय स्वामित्व के संकुचित भाव से बचता है।
- issue: ἔλεος की अर्थ-सीमा
  choice: दया
  alternative: करुणा
  rationale: ‘दया’ स्रोत शब्द का सीधा और सामान्य समतुल्य है। पद स्वयं वाचा-संबंधी ‘अटल प्रेम’ जैसे विस्तृत अर्थ को स्पष्ट नहीं करता, इसलिए ऐसा विस्तार पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरसूचक ‘आप’ के साथ। वाक्य प्रार्थनापूर्ण, संक्षिप्त और गरिमापूर्ण रखा गया है। कोई पादटिप्पणी आवश्यक नहीं है।
