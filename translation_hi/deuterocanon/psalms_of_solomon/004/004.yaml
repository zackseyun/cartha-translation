    reason: lexical_alternative
  - marker: b
    text: या, “शपथ के साथ किए गए समझौते में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ πᾶσαν γυναῖκα
  choice: उसकी आँखें हर स्त्री पर लगी रहती हैं
  rationale: यूनानी में आँखों को कर्ता बनाकर ध्यान या कामनापूर्ण दृष्टि की दिशा व्यक्त की गई है। यह अनुवाद ठोस बिंब और πᾶσαν का सार्वभौमिक भाव बनाए रखता है।
- source_word: ἄνευ διαστολῆς
  choice: बिना किसी भेद के
  rationale: διαστολή का मूल भाव भेद, अंतर या पृथक्करण है। संदर्भ में यह बताता है कि वह स्त्रियों के बीच कोई भेद किए बिना सब पर दृष्टि रखता है; संभावित संयम-संबंधी अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ἡ γλῶσσα ψευδὴς
  choice: उसकी जीभ छलपूर्ण होती है
  rationale: ψευδής उसकी वाणी के झूठे या धोखेबाज़ चरित्र को बताता है। ‘जीभ’ का मूल रूपक सुरक्षित रखते हुए ‘छलपूर्ण’ हिंदी में स्वाभाविक है।
- source_word: ἐν συναλλάγματι
  choice: किए गए लेन-देन में
  rationale: συνάλλαγμα किसी व्यवहार, सौदे या लेन-देन को सूचित करता है। ‘लेन-देन’ पर्याप्त ठोस है, पर इसे अनिवार्यतः औपचारिक कानूनी अनुबंध नहीं बनाता।
- source_word: μεθʼ ὅρκου
  choice: शपथ के साथ
  rationale: यह पदबंध बताता है कि छलपूर्ण वाणी शपथ से जुड़ी या उसके द्वारा पुष्ट की जाती है; ‘शपथ के साथ’ औपचारिक न्यायालय का अतिरिक्त भाव नहीं जोड़ता।
