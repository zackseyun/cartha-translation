lexical_decisions:
- source_word: ἐκκόψαισαν
  choice: नोच निकालें
  rationale: यह एओरिस्ट ऑप्टेटिव एक कामना अथवा शाप व्यक्त करता है; हिन्दी में संभावनार्थक क्रिया-रूप इसी भाव को स्वाभाविक ढंग से व्यक्त करता है। ‘नोच निकालें’ हिंसक बिंब को स्पष्ट रखता है।
- source_word: κόρακες
  choice: कौए
  rationale: κόραξ कौए या रैवन कुल के पक्षी को दर्शाता है। आधुनिक सामान्य हिन्दी में ‘कौए’ सबसे सहज और स्पष्ट शब्द है तथा अपमार्जक पक्षी का बिंब बनाए रखता है।
- source_word: ὀφθαλμοὺς
  choice: आँखें
  rationale: यूनानी शब्द का सामान्य अर्थ ‘आँखें’ है; ‘नेत्रगोलक’ जैसा अधिक चित्रात्मक शब्द मूल से अधिक तीव्र और अस्वाभाविक होता।
- source_word: ὑποκρινομένων
  choice: कपटियों
  rationale: कृदन्त उन लोगों को दर्शाता है जो ढोंग करते, वास्तविकता छिपाते या कुछ और होने का अभिनय करते हैं। ‘कपटी’ संक्षिप्त और स्वाभाविक है, जबकि वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
