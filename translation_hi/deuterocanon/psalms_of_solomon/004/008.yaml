  yaml_path: translation/deuterocanon/psalms_of_solomon/004/008.yaml
  text: May God expose the deeds of the man-pleaser[a], his deeds with ridicule and derision.
translation:
  language: hi
  text: परमेश्वर मनुष्यों को प्रसन्न करनेवाले[a] के कामों को उजागर करे—उसके कामों को जगहँसाई और उपहास का विषय बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध कठिन है; इसका अर्थ “लोगों को प्रसन्न करनेवाला” भी किया जा सकता है।
    reason: मूल पाठ की वास्तविक वाक्यगत कठिनाई और अभिव्यक्ति के वैकल्पिक रूप को पाठक के सामने सुरक्षित रखना।
lexical_decisions:
- source_word: ἀνακαλύψαι ὁ θεὸς
  choice: परमेश्वर ... उजागर करे
  rationale: ἀνακαλύψαι रूप की दृष्टि से infinitive है, पर इस शाप-प्रार्थना के संदर्भ में इच्छासूचक/आज्ञार्थक बल रखता है। “उजागर करे” उस प्रार्थनात्मक आग्रह और छिपे कर्मों के सार्वजनिक रूप से खुलने—दोनों को व्यक्त करता है।
- source_word: τὰ ἔργα
  choice: कामों
  rationale: यहाँ ἔργα व्यक्ति के नैतिक आचरण और किए हुए कार्यों को दर्शाता है। “काम” सामान्य आधुनिक हिन्दी में स्वाभाविक है और यूनानी पाठ में इसकी पुनरावृत्ति को भी बनाए रखता है।
- source_word: ἀνθρώπων ἀρεσκόν
  choice: मनुष्यों को प्रसन्न करनेवाले
  rationale: प्रेषित यूनानी पदबंध व्याकरण की दृष्टि से कठिन है, पर संदर्भ में इसका सबसे संभावित अर्थ ऐसे व्यक्ति से है जो परमेश्वर के बजाय मनुष्यों की स्वीकृति चाहता है। “मनुष्यों को प्रसन्न करनेवाला” इस विशिष्ट नैतिक श्रेणी को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἐν καταγέλωτι
  choice: जगहँसाई ... के साथ
  rationale: καταγέλως सार्वजनिक हँसी, उपहास और अपमान का भाव रखता है। “जगहँसाई” उस सार्वजनिक लज्जा को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: μυκτηρισμῷ
  choice: उपहास
  rationale: μυκτηρισμός तिरस्कारपूर्ण मज़ाक या खिल्ली का बोध देता है। “उपहास” गरिमापूर्ण आधुनिक हिन्दी है और “जगहँसाई” के साथ दोनों यूनानी संज्ञाओं का अंतर यथासंभव बनाए रखता है।
theological_decisions:
- issue: ἀνθρώπων ἀρεσκόν से सूचित व्यक्ति की पहचान
  choice: इसे मनुष्यों को प्रसन्न करनेवाले व्यक्ति के रूप में प्रस्तुत किया गया है।
  alternative: इसे सामान्यतः लोगों को प्रसन्न करनेवाला या मनुष्य-प्रसन्नकारी कहा जा सकता था।
  rationale: पदबंध की कठिनाई को स्वीकारते हुए निकटवर्ती संदर्भ और प्राचीन धार्मिक नैतिक मुहावरे के अनुसार व्यक्ति-केंद्रित अर्थ सबसे संभावित है; अनुवाद यह नहीं जोड़ता कि वह किसी विशेष धार्मिक समूह या सिद्धांत से जुड़ा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। यूनानी की काव्यात्मक पुनरावृत्ति “कामों ... उसके कामों” को जानबूझकर बनाए रखा गया है; डैश दूसरे पद की संक्षिप्त, दीर्घवृत्तात्मक संरचना को दिखाता है।
