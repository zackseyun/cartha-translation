  yaml_path: translation/deuterocanon/psalms_of_solomon/004/009.yaml
  text: And may the devout vindicate the judgment of their God when sinners are removed from before the righteous man—even the one speaking what pleases a man, only with deceit.
translation:
  language: hi
  text: और भक्तजन अपने परमेश्वर के न्याय को न्यायोचित ठहराएँ, जब पापियों को—अर्थात् उस व्यक्ति को जो किसी मनुष्य को भाने वाली बात छल से ही बोलता है[a]—धर्मी मनुष्य के सामने से हटाया जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “पापियों” बहुवचन है, पर इसके बाद “जो ... बोलता है” एकवचन में आता है। संभवतः यह एकवचन किसी पापी का सामान्य चित्र प्रस्तुत करता है; उपलब्ध पाठ की वाक्य-रचना कठिन है।
    reason: alternative_reading
  - marker: b
    text: या “धर्मी जन की उपस्थिति से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: भक्तजन
  rationale: यहाँ शब्द पवित्र वस्तुओं या स्वर्गीय प्राणियों के बजाय परमेश्वर के प्रति निष्ठावान और धर्मपरायण लोगों को दर्शाता है।
- source_word: δικαιώσαισαν
  choice: न्यायोचित ठहराएँ
  rationale: कर्म κρίμα होने के कारण अर्थ किसी को धर्मी बनाना नहीं, बल्कि परमेश्वर के न्याय को सही और न्यायपूर्ण स्वीकार करना है; विधिलिंग का भाव बनाए रखा गया है।
- source_word: κρίμα
  choice: न्याय
  rationale: यह न्यायिक निर्णय के व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और δικαιώσαισαν के साथ उपयुक्त बैठता है।
- source_word: ἐν τῷ ἐξαίρεσθαι
  choice: जब ... हटा दिए जाएँ
  rationale: सव्ययी क्रियार्थक संज्ञा-रचना यहाँ घटना के समय अथवा अवसर को बताती है; कर्मवाच्य भाव सुरक्षित रखा गया है।
- source_word: ἀπὸ προσώπου δικαίου
  choice: धर्मी मनुष्य के सामने से
  rationale: ἀπὸ προσώπου के स्थान-संबंधी मुहावरे और δικαίου के प्रतिनिधिक एकवचन, दोनों को स्पष्ट हिन्दी में रखा गया है।
- source_word: ἀνθρώπῳ ἀρέσκον
  choice: मनुष्य को भाने वाली बात
  rationale: नपुंसकलिंग कर्मकारक कृदंत ἀρέσκον को λαλοῦντα के वस्तुगत पद के रूप में लिया गया है—अर्थात वह ऐसी बात बोलता है जो किसी मनुष्य को भाती है।
- source_word: λαλοῦντα μόνον μετὰ δόλου
  choice: जो ... केवल छल से बोलता है
  rationale: एकवचन कृदंत को सामान्य रूप से पापी का वर्णन माना गया है और μόνον को μετὰ δόλου के साथ जोड़ते हुए ‘केवल छल से’ रखा गया है।
theological_decisions:
- issue: परमेश्वर के न्याय को ‘न्यायोचित ठहराना’
  choice: मनुष्य परमेश्वर के न्याय को सही सिद्ध या स्वीकार करते हैं
  alternative: मनुष्य परमेश्वर को धर्मी बनाते हैं
  rationale: यूनानी में δικαιώσαισαν का कर्म ‘उनके परमेश्वर का न्याय’ है; इसलिए कथन न्याय की पुष्टि के बारे में है, परमेश्वर की धार्मिकता उत्पन्न करने के बारे में नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भक्तजन’, ‘धर्मी मनुष्य’ और ‘न्यायोचित ठहराएँ’ स्रोत के नैतिक तथा न्यायिक स्वर को बनाए रखते हैं। कठिन यूनानी संख्या-परिवर्तन को मुख्य पाठ में हल्के स्पष्टीकरण और पादटिप्पणी के सहारे प्रस्तुत किया गया है, न कि चुपचाप समतल किया गया है।
