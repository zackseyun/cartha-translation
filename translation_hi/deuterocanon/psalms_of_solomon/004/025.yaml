  yaml_path: translation/deuterocanon/psalms_of_solomon/004/025.yaml
  text: And they provoked God[a], and stirred him up to remove them from the land[c][b], because by deceit they pretended to be innocent people.
translation:
  language: hi
  text: और उन्होंने परमेश्वर को क्रोध दिलाया और उसे उकसाया कि वह उन्हें उस देश से निकाल दे[a], क्योंकि वे छल से निर्दोष लोगों[b] का रूप धरते थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी से निकाल दे।”
    reason: γῆ का अर्थ प्रसंग के अनुसार ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है।
  - marker: b
    text: शाब्दिक रूप से, “निर्दोषों के प्राणों”; इसका अर्थ “निर्दोष जीवन” या “निर्दोष व्यक्ति” भी हो सकता है।
    reason: ψυχὰς का शाब्दिक अर्थ ‘प्राण/आत्माएँ’ है, पर यह व्यक्तियों या जीवनों को भी सूचित कर सकता है।
  - marker: c
    text: या, “निर्दोष होने का ढोंग करते थे” अथवा “निर्दोषों का स्वाँग भरते थे।”
    reason: ὑπεκρίνοντο अभिनय, ढोंग या किसी का रूप धारण करने के अर्थ दे सकता है।
lexical_decisions:
- source_word: παρώργυσαν
  choice: क्रोध दिलाया
  rationale: यह क्रिया परमेश्वर को क्रोधित करने या उसके क्रोध को भड़काने का भाव रखती है। ‘क्रोध दिलाया’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: παρώξυναν
  choice: उकसाया
  rationale: यह पिछली क्रिया के भाव को तीव्र करती है और इसके बाद आए ἐξᾶραι के साथ परमेश्वर को न्यायपूर्ण कार्रवाई के लिए उकसाने का अर्थ देती है।
- source_word: ἐξᾶραι αὐτοὺς ἀπὸ τῆς γῆς
  choice: उन्हें उस देश से निकाल दे
  rationale: ἐξαίρω का अर्थ हटाना या निकाल देना हो सकता है; न्याय के प्रसंग में यह स्पष्ट है, पर विनाश का अर्थ आवश्यकता से अधिक नहीं जोड़ता। γῆ के ‘पृथ्वी’ अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ψυχὰς ἀκάκων
  choice: निर्दोष लोगों
  rationale: ψυχή बहुवचन में व्यक्तियों या जीवनों के लिए प्रयुक्त हो सकता है, और ἀκάκων ऐसे लोगों को सूचित करता है जिनमें बुराई या छल नहीं। सहज हिन्दी में ‘निर्दोष लोगों’ उपयुक्त है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: παραλογισμῷ
  choice: छल से
  rationale: इस संदर्भ में संज्ञा कपटपूर्ण युक्ति या धोखे का भाव देती है। ‘छल से’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: ὑπεκρίνοντο
  choice: रूप धरते थे
  rationale: क्रिया अभिनय, ढोंग या किसी और के रूप में प्रस्तुत होने का भाव देती है। ‘रूप धरते थे’ accusative ψυχὰς ἀκάκων के साथ स्वाभाविक हिन्दी देता है और कपट का भाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर को न्यायपूर्ण कार्रवाई के लिए उकसाने की भाषा
  choice: उसे उकसाया कि वह उन्हें…निकाल दे
  alternative: उन्होंने उसे इतना क्रोधित किया कि वह उन्हें…निकाल दे
  rationale: यूनानी पाठ दो समानांतर क्रियाएँ रखता है और दूसरी के साथ निष्कासन का infinitive जोड़ता है। चुना हुआ रूप परमेश्वर की प्रतिक्रिया के बारे में पाठ की तनावपूर्ण भाषा को नरम या व्यवस्थित किए बिना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘परमेश्वर’, ‘क्रोध दिलाया’, ‘उकसाया’ और ‘छल’ धार्मिक प्रसंग की गंभीरता बनाए रखते हैं; कठिन यूनानी वाक्य-विन्यास को स्वाभाविक हिन्दी में स्पष्ट किया गया है, जबकि वास्तविक शब्दार्थ-विकल्प पाद-टिप्पणियों में सुरक्षित हैं।
