  yaml_path: translation/deuterocanon/psalms_of_solomon/004/001.yaml
  text: Why do you[a], profane one, sit in a holy council, while your heart has gone far away from the Lord[b], provoking the God of Israel with proverbs?
translation:
  language: hi
  text: हे अपवित्र मनुष्य, तू पवित्र सभा[a] में क्यों बैठता है, जबकि तेरा हृदय प्रभु से बहुत दूर हट चुका है और तू कहावतों[b] से इस्राएल के परमेश्वर को क्रोध दिलाता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मनिष्ठ सभा” अथवा “पावन सभा।”
    reason: lexical_alternative
  - marker: b
    text: या “तानों,” “लोकोक्तिपरक कथनों,” अथवा “पहेलीनुमा वाणी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: βέβηλε
  choice: हे अपवित्र जन
  rationale: सम्बोधन का अर्थ धार्मिक और नैतिक दृष्टि से अपवित्र या अनादरपूर्ण व्यक्ति है। “अपवित्र जन” आगे आने वाली पवित्र सभा के साथ मूल का तीखा विरोध बनाए रखता है।
- source_word: συνεδρίῳ ὁσίῳ
  choice: पवित्र सभा
  rationale: συνέδριον बैठकर विचार करने वाली सभा या परिषद को दर्शाता है और ὅσιος उसे धर्मपरायण अथवा पवित्र बताता है। “पवित्र सभा” सहज हिन्दी है; निकटतर वैकल्पिक भाव पादटिप्पणी में रखा गया है।
- source_word: ἡ καρδία σου μακρὰν ἀφέστηκεν
  choice: तेरा हृदय ... बहुत दूर जा चुका है
  rationale: ἀφίστημι का पूर्णकाल पहले हुए दूर हटने और उससे बनी वर्तमान दशा—दोनों को व्यक्त करता है। “दूर जा चुका है” इस स्थायी अलगाव को स्वाभाविक हिन्दी में रखता है।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: सन्दर्भ में κύριος परमेश्वर के लिए प्रयुक्त हुआ है; “प्रभु” उसका प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἐν παροιμίαις
  choice: कहावतों के द्वारा
  rationale: παροιμίαι का सीधा अर्थ कहावतें या लोकोक्तिपूर्ण कथन है। प्रसंग में तानों अथवा पहेलीभरी बातों का भाव भी सम्भव है, इसलिए वे विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: παροργίζων
  choice: क्रोध दिलाता है
  rationale: यह कृदन्त किसी को क्रोधित करने या उसके रोष को भड़काने का अर्थ देता है। हिन्दी में “क्रोध दिलाता है” स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ὅσιος और सभा की धार्मिक विशेषता
  choice: पवित्र सभा
  alternative: धर्मनिष्ठ सभा / धर्मनिष्ठों की सभा
  rationale: ὅσιος में धर्मपरायणता और पवित्रता दोनों का अर्थक्षेत्र है। विशेषण व्याकरणतः सभा को विशेषित करता है; इसलिए मुख्य पाठ में स्वाभाविक “पवित्र सभा” रखा गया और अधिक समाज-सूचक अर्थ को पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। एकवचन निकट सम्बोधन के लिए “तू/तेरा” मूल यूनानी की सीधी और कठोर फटकार को बनाए रखता है। यूनानी वाक्य की लम्बी प्रश्नात्मक रचना को हिन्दी की स्पष्टता के लिए प्रश्न और उसके बाद कथन में बाँटा गया है, जबकि अर्थगत सम्बन्ध सुरक्षित है।
