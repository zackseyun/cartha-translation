lexical_decisions:
- source_word: παρελογίσατο
  choice: उसने…झूठा तर्क किया
  rationale: क्रिया दोषपूर्ण या भ्रामक तर्क का बोध कराती है। यह अनुवाद उसके बौद्धिक पक्ष को बनाए रखता है, पर यह तय नहीं करता कि छल स्वयं की ओर था या दूसरों की ओर।
- source_word: ἐν λόγοις
  choice: बातों में
  rationale: यह यूनानी पदबंध के शाब्दिक बल को रखते हुए आधुनिक हिन्दी में स्वाभाविक है और कथन अथवा मौखिक तर्क की ओर संकेत करता है।
- source_word: ὁρῶν
  choice: देखता
  rationale: वर्तमान कृदन्त यहाँ संज्ञात्मक रूप से प्रयुक्त है; ‘जो देखता’ उसके निरंतर निरीक्षण के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: κρίνων
  choice: न्याय करता
  rationale: यह ‘देखता’ के समानांतर संज्ञात्मक कृदन्त है और नैतिक अथवा न्यायिक निर्णय का भार बनाए रखता है।
theological_decisions:
- issue: ὁρῶν और κρίνων का अंतर्निहित कर्ता
  choice: कोई नहीं जो देखता और न्याय करता है
  alternative: वह देखता और न्याय नहीं करता
  rationale: यूनानी पाठ किसी देखने और न्याय करने वाले के अस्तित्व का निषेध करता है; वह सीधे परमेश्वर को कर्ता नहीं कहता। अनुवाद इसी अस्पष्टता को बनाए रखता है।
