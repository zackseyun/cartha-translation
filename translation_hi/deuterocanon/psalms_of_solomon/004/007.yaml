base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/007.yaml
  text: May God remove those who live in hypocrisy among the pious[d][c][b][a], in the corruption of his flesh and poverty his life.
translation:
  language: hi
  text: परमेश्वर उन लोगों को दूर कर दे[a] जो भक्त जनों के बीच कपट से जीते हैं; वह उसके शरीर के क्षय और दरिद्रता में उसका जीवन भी ले ले।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उखाड़ फेंके” अथवा “हटा दे।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में “उसके शरीर” और “उसका जीवन” एकवचन में हैं, यद्यपि पहले “लोगों” का उल्लेख बहुवचन में है। वाक्य की रचना कठिन है; सम्भव अनुवाद: “उसके शरीर के क्षय और दरिद्रता के द्वारा उसका जीवन भी ले ले।”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐξάραι
  choice: दूर कर दे … ले ले
  rationale: मूल क्रिया का अर्थ हटाना या उठा ले जाना है। पहले कर्म के साथ ‘दूर कर दे’ और दूसरे, ‘जीवन’, के साथ स्वाभाविक हिन्दी ‘ले ले’ प्रयुक्त है; दोनों एक ही यूनानी क्रिया को व्यक्त करते हैं।
- source_word: ὑποκρίσει
  choice: कपट से
  rationale: यह ढोंग, छलपूर्ण दिखावे या दोहरे आचरण का स्पष्ट और सहज आधुनिक हिन्दी रूप है।
- source_word: ὁσίων
  choice: भक्त जनों
  rationale: ὅσιοι यहाँ धार्मिक निष्ठा और भक्ति से पहचाने जाने वाले समुदाय को सूचित करता है। ‘पवित्र जन’ की अपेक्षा ‘भक्त जन’ इस विशेष अर्थ को बेहतर व्यक्त करता है और बाद के पारिभाषिक अर्थ नहीं जोड़ता।
- source_word: φθορᾷ
  choice: क्षय
  rationale: σάρξ के साथ यह शारीरिक बिगाड़, गलन या नाश की प्रक्रिया बताता है; ‘क्षय’ नैतिक भ्रष्टता की अनावश्यक छाया से बचते हुए इस अर्थ को रखता है।
- source_word: σαρκός
  choice: शरीर
  rationale: इस प्रसंग में σάρξ मनुष्य की शारीरिक दशा को सूचित करता है। हिन्दी में ‘शरीर’ स्वाभाविक है; ‘मांस’ यहाँ अनचाहा शाब्दिक और अंग-संबंधी अर्थ दे सकता है।
- source_word: πενίᾳ
  choice: दरिद्रता
  rationale: यह अभाव और गरीबी का सीधा, गरिमापूर्ण और प्रसंगानुकूल रूप है।
- source_word: τὴν ζωὴν αὐτοῦ
  choice: उसका जीवन
  rationale: मूल पाठ बहुवचन समूह से अचानक पुल्लिंग एकवचन में लौटता है। इसे बहुवचन बनाकर समतल नहीं किया गया, ताकि मूल की कठिनता और सम्भावित व्यक्तिगत आदिरूप सुरक्षित रहे।
theological_decisions:
- issue: आरम्भिक infinitive ἐξάραι का वाक्य-बल
  choice: 'प्रार्थना/कामना: ‘परमेश्वर … दूर कर दे’'
  alternative: 'कथन: ‘परमेश्वर … दूर करता है’; अथवा अधूरा infinitival वाक्यांश: ‘परमेश्वर का … दूर करना’'
  rationale: निन्दात्मक-प्रार्थनात्मक प्रसंग में यह रूप दैवी कार्रवाई की कामना के रूप में सबसे स्वाभाविक है, यद्यपि यूनानी रचना संक्षिप्त है।
- issue: τὴν ζωὴν αὐτοῦ का वाक्यगत सम्बन्ध
  choice: इसे ἐξάραι का दूसरा प्रत्यक्ष कर्म मानकर ‘उसका जीवन भी ले ले’
  alternative: 'इसे केवल परिस्थिति-सूचक वाक्यांश में मिलाना: ‘उसके शरीर के क्षय और उसके जीवन की दरिद्रता में’'
  rationale: τὴν ζωήν कर्मकारक में है और ἐξάραι से स्वाभाविक रूप से जुड़ सकता है। हिन्दी में क्रिया दोहराना अस्पष्ट यूनानी संरचना को पठनीय बनाता है, जबकि ‘भी’ दूसरे कर्म का सम्बन्ध स्पष्ट करता है।
- issue: एकवचन αὐτοῦ का आशय
  choice: ‘उसके/उसका’ के रूप में एकवचन बनाए रखना
  alternative: वर्ग-वाचक मानकर ‘उनके/उनका’
  rationale: मूल पाठ का एकवचन सम्भवतः समूह के प्रतिनिधि व्यक्ति या पहले वर्णित आदिरूप की ओर संकेत करता है। इसे बहुवचन करना वास्तविक पाठगत तनाव को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रखी गई है। ‘भक्त जन’ धार्मिक समुदाय का भाव देता है, पर किसी बाद की सम्प्रदायगत पहचान को आरोपित नहीं करता। कठिन यूनानी वाक्य-विन्यास को न्यूनतम क्रिया-दोहराव से पठनीय बनाया गया है और मूल का एकवचन सुरक्षित रखा गया है।
