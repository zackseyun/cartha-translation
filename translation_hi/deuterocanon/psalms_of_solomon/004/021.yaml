  yaml_path: translation/deuterocanon/psalms_of_solomon/004/021.yaml
  text: May the flesh of people-pleasers be scattered by wild beasts[a], and the bones of the lawless lie before the sun in dishonor.
translation:
  language: hi
  text: लोगों को प्रसन्न करने वालों का मांस जंगली पशुओं द्वारा तितर-बितर किया जाए, और व्यवस्था के विरुद्ध चलने वालों की हड्डियाँ सूर्य के सामने अनादर में पड़ी रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκορπισθείησαν
  choice: तितर-बितर किया जाए
  rationale: अओरिस्ट कर्मवाच्य ऑप्टेटिव यहाँ इच्छा अथवा शापसूचक प्रार्थना व्यक्त करता है; ‘किया जाए’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σάρκες
  choice: मांस
  rationale: यहाँ शब्द न्याय के बाद खुले पड़े शारीरिक मांस का ठोस और भयावह चित्र देता है; ‘मांस’ सामान्यीकृत ‘शरीर’ से अधिक निकट है।
- source_word: ἀνθρωπαρέσκων
  choice: लोगों को प्रसन्न करनेवालों
  rationale: यह यौगिक उन लोगों को सूचित करता है जिनकी चिंता मनुष्यों को प्रसन्न करना है। यह रूप अर्थ को स्पष्ट रखता है और बोलचाल के ‘खुशामदियों’ जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: ὑπὸ θηρίων
  choice: जंगली पशुओं द्वारा
  rationale: θηρία हिंस्र अथवा वन्य पशुओं को दर्शाता है; कर्मवाच्य रचना के साथ ‘द्वारा’ यूनानी संबंध को स्पष्ट रखता है।
- source_word: 'ὀστᾶ (source transcription: οὐτὰ)'
  choice: हड्डियाँ
  rationale: प्रदत्त पाठ का οὐτὰ प्रतिलिपि/OCR-दोष है; स्वेट में ὀστᾶ ‘हड्डियाँ’ है, जो पहले खंड के ‘मांस’ के समानांतर है।
- source_word: παρανόμων
  choice: व्यवस्था-विहीन लोगों की
  rationale: παράνομος व्यवस्था के विरुद्ध चलनेवाले व्यक्ति को सूचित करता है। ‘व्यवस्था-विहीन’ इसके नैतिक-विधिक बल को बनाए रखता है।
- source_word: κατέναντι τοῦ ἡλίου
  choice: सूर्य के सामने
  rationale: यह वाक्यांश खुले में सार्वजनिक रूप से पड़े और प्रकट होने का चित्र रखता है; इसे ‘धूप में’ बनाकर अर्थ सीमित नहीं किया गया।
- source_word: ἐν ἀτιμίᾳ
  choice: अपमानित दशा में
  rationale: ἀτιμία अनादर और अपमान की स्थिति बताता है; यह हिन्दी प्रयोग शवों के लज्जाजनक सार्वजनिक अनावरण को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: παράνομος में ‘व्यवस्था’ का आशय
  choice: व्यवस्था-विहीन
  alternative: दुष्ट / अपराधी
  rationale: सामान्य नैतिक ‘दुष्ट’ कहने के बजाय मूल के विधि-विरोधी अर्थ को रखा गया है, पर किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और शापसूचक शैली रखी गई है। ‘लोगों को प्रसन्न करनेवाले’ सामान्य पाठक के लिए स्पष्ट है; ‘मनुष्य-प्रसन्नकारी’ जैसे कृत्रिम पद से बचा गया है। उपलब्ध यूनानी साक्ष्य के अनुसार यहाँ ‘हड्डियाँ’ निश्चित होने से अंग्रेज़ी परत का ‘remains’ संबंधी पुराना पादटिप्पणी-विकल्प नहीं अपनाया गया।
