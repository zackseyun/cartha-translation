review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the Greek imprecatory optative in “किया जाए,” preserves the concrete contrast between flesh and bones, and correctly adopts ὀστᾶ (“bones”) rather than the erroneous transcription οὐτὰ. “सूर्य के सामने” adequately conveys public exposure. However, “अपमानित दशा में” shifts ἐν ἀτιμίᾳ from the state of dishonor/disgrace to a description implying that the bones themselves have been humiliated. A direct locative rendering is preferable.
  naturalness: The sentence is clear and suitably grave. Spacing “करने वालों” follows standard modern Hindi orthography. “अनादर में” is concise, idiomatic in this elevated context, and better matches the source phrase.
  terminology: “लोगों को प्रसन्न करने वाले” clearly renders ἀνθρωπαρέσκων without importing the pejorative nuance of “खुशामदी.” “व्यवस्था के विरुद्ध चलने वाले” retains the moral-legal force of παράνομοι more accurately than “व्यवस्था-विहीन,” which can suggest merely lacking a law rather than acting contrary to it.
  issues:
  - severity: medium
    issue: “अपमानित दशा में” for ἐν ἀτιμίᾳ
    rationale: The Greek means “in dishonor/disgrace.” The draft’s wording describes an “humiliated condition,” adding a verbal/passive nuance not present in the noun ἀτιμία. “अनादर में” retains the source meaning directly.
  - severity: low
    issue: “व्यवस्था-विहीन” may understate active lawlessness
    rationale: παράνομος denotes one contrary to law, not simply one without law. “व्यवस्था के विरुद्ध चलने वाले” preserves this distinction in natural Hindi.
  - severity: low
    issue: 'Orthography: “करनेवालों”'
    rationale: 'Modern standard Hindi normally writes the postposition-like participial element separately: “करने वालों.”'
  revised_text: लोगों को प्रसन्न करने वालों का मांस जंगली पशुओं द्वारा तितर-बितर किया जाए, और व्यवस्था के विरुद्ध चलने वालों की हड्डियाँ सूर्य के सामने अनादर में पड़ी रहें।
  revised_footnotes: []
  revision_rationale: 'The revision retains the draft’s source-grounded reading “हड्डियाँ” and its imprecatory, public-disgrace imagery. It makes only limited changes for closer semantic correspondence to παράνομοι and ἐν ἀτιμίᾳ, and standardizes spacing. No footnote is needed: the English “remains” alternative was based on the obsolete erroneous transcription and should not be carried into the Hindi text.'
