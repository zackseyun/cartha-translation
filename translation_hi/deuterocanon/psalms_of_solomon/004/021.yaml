- from: लोगों को प्रसन्न करनेवालों का मांस जंगली पशुओं द्वारा तितर-बितर किया जाए, और व्यवस्था-विहीन लोगों की हड्डियाँ अपमानित दशा में सूर्य के सामने पड़ी रहें।
  to: लोगों को प्रसन्न करने वालों का मांस जंगली पशुओं द्वारा तितर-बितर किया जाए, और व्यवस्था के विरुद्ध चलने वालों की हड्डियाँ सूर्य के सामने अनादर में पड़ी रहें।
  rationale: 'The revision retains the draft’s source-grounded reading “हड्डियाँ” and its imprecatory, public-disgrace imagery. It makes only limited changes for closer semantic correspondence to παράνομοι and ἐν ἀτιμίᾳ, and standardizes spacing. No footnote is needed: the English “remains” alternative was based on the obsolete erroneous transcription and should not be carried into the Hindi text.'
