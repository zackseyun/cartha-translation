translation:
  language: hi
  text: और उसका घर हर उस वस्तु से वंचित रहे, जो उसके प्राण को तृप्त करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राण’ का अर्थ यहाँ व्यक्ति स्वयं, उसका जीवन, अथवा उसकी भूख और अभिलाषा भी हो सकता है।
    reason: ψυχή की शब्दार्थगत व्यापकता बताने और मुख्य पाठ में अर्थ को अनावश्यक रूप से संकीर्ण न करने के लिए।
lexical_decisions:
- source_word: ἐλλιπὴς
  choice: वंचित रहे
  rationale: विशेषणात्मक, क्रियारहित यूनानी वाक्य को आसपास के शाप-वचनों के अनुरूप इच्छासूचक रूप में व्यक्त किया गया है। ‘वंचित रहे’ अभाव का भाव स्वाभाविक और गरिमापूर्ण ढंग से देता है।
- source_word: ὁ οἶκος αὐτοῦ
  choice: उसका घर
  rationale: οἶκος का अर्थ भवन या घराना दोनों हो सकता है। ‘उसका घर’ मूल बिंब बनाए रखता है और हिन्दी में परिवार/गृहस्थी के व्यापक अर्थ की संभावना भी खुली छोड़ता है।
- source_word: ἀπὸ παντὸς
  choice: उस हर वस्तु से
  rationale: ἀπό के साथ अभाव का निर्माण है; ‘हर वस्तु से वंचित’ यूनानी संरचना और सम्पूर्ण अभाव, दोनों को स्पष्ट करता है।
- source_word: οὗ ἐμπλήσει
  choice: जिससे ... तृप्त होता
  rationale: ἐμπίμπλημι का मूल भाव ‘भरना’ है, पर ψυχή के साथ यहाँ इच्छा या भूख की पूर्ति निहित है। ‘तृप्त होता’ आधुनिक हिन्दी में स्वाभाविक है और पूर्णता के भाव को सुरक्षित रखता है; क्रियारूप को संभाव्य/परिणामी अर्थ में रखा गया है।
- source_word: ψυχὴν αὐτοῦ
  choice: उसका प्राण
  rationale: ψυχή के ‘प्राण, जीवन, स्वयं, भूख/लालसा’ जैसे अर्थ हो सकते हैं। ‘प्राण’ मूल मानवीय-अंतरंग बिंब को बनाए रखता है और इसे केवल शारीरिक भूख तक सीमित नहीं करता।
theological_decisions:
- issue: शाप-वचन की इच्छासूचक शक्ति
  choice: ‘वंचित रहे’
  alternative: ‘वंचित है’
  rationale: यूनानी पंक्ति स्वयं क्रियारहित है, लेकिन निकटवर्ती शाप-वचन संदर्भ इसे इच्छा/अभिशाप के रूप में पढ़ने का आधार देता है। हिन्दी में इस शक्ति को व्यक्त करना आवश्यक है, पर कारण या दैवी कर्ता नहीं जोड़ा गया।
- issue: ψυχή का अर्थ-क्षेत्र
  choice: ‘प्राण’
  alternative: ‘भूख’ या ‘मन’
  rationale: किसी एक संकीर्ण अर्थ को निर्णायक बनाने के बजाय ‘प्राण’ शारीरिक आवश्यकता और भीतरी अभिलाषा के बीच मूल की अर्थगत व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण शाप-वचन। ‘घर’ जानबूझकर रखा गया है ताकि भवन और घराने दोनों की सम्भावना बनी रहे। ‘तृप्त’ सहज हिन्दी देता है, जबकि पादटिप्पणी ψυχή की अस्पष्टता सुरक्षित रखती है।
