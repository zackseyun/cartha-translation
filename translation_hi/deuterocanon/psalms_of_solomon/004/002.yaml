translation:
  language: hi
  text: बातों में हद से बढ़ा हुआ, बाहरी दिखावे में सबसे बढ़कर—वही, जो पापियों को न्याय में दोषी ठहराने के लिए बातों में कठोर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσὸς ἐν λόγοις
  choice: बातों में हद से बढ़ा हुआ
  rationale: περισσός की अति या सीमा से अधिक होने की धारणा को व्यक्त करता है और λόγοις को स्वाभाविक आधुनिक हिन्दी में ‘बातों’ के रूप में रखता है।
- source_word: περισσὸς ἐν σημειώσει ὑπὲρ πάντας
  choice: दिखावे में सबसे बढ़कर
  rationale: σημείωσις यहाँ बाहरी प्रदर्शन या स्वयं को प्रमुख दिखाने का भाव दे सकता है; ‘दिखावा’ इसी नकारात्मक संदर्भ को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ὁ σκληρὸς ἐν λόγοις
  choice: वही, जो बातों में कठोर
  rationale: लेख के साथ विशेषण ὁ σκληρός व्यक्ति की ओर संकेत करता है; ‘वही, जो’ इस संरचना को हिन्दी में स्पष्ट रखता है।
- source_word: κατακρῖναι
  choice: दोषी ठहराता है
  rationale: क्रिया का अर्थ प्रतिकूल निर्णय देना या दोषी घोषित करना है; हिन्दी में न्यायिक भाव सुरक्षित रहता है।
- source_word: ἐν κρίσει
  choice: न्याय के समय
  rationale: κρίσις का अर्थ न्याय, निर्णय या न्यायिक कार्यवाही हो सकता है; ‘न्याय के समय’ मूल संबंध की कुछ व्यापकता बनाए रखता है।
theological_decisions:
- issue: वक्ता द्वारा पापियों की निंदा और न्याय का संबंध
  choice: न्याय के समय पापियों को दोषी ठहराता है
  alternative: न्याय में पापियों की निंदा करता है
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि κρίσις अंतिम दैवी न्याय है या सामान्य न्यायिक निर्णय। इसलिए हिन्दी में किसी विशिष्ट अंतकालीन अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता और निंदात्मक स्वर बनाए गए हैं। वाक्य को पठनीय बनाने के लिए दीर्घ विराम लगाया गया है, पर मूल की पुनरावृत्ति सुरक्षित रखी गई है।
