lexical_decisions:
- source_word: ἐν νυκτὶ
  choice: रात में
  rationale: यह स्वाभाविक हिन्दी कालवाचक पदबंध है और अँधेरे की आड़ में किए गए काम का भाव बनाए रखता है।
- source_word: ἐν ἀποκρύφοις
  choice: छिपे स्थानों में
  rationale: बहुवचन रूप ठोस, छिपी हुई जगहों की ओर संकेत करता है; इसलिए इसे केवल ‘चुपके से’ जैसे क्रियाविशेषण में नहीं बदला गया।
- source_word: ἁμαρτάνει
  choice: पाप करता है
  rationale: यह यूनानी क्रिया के नैतिक और धार्मिक भार को सीधे बनाए रखता है।
- source_word: ὡς οὐχ ὁρώμενος
  choice: मानो उसे कोई देख न रहा हो
  rationale: यह ὡς की तुलनात्मक शक्ति और उस व्यक्ति की यह धारणा—कि वह निगाह से बचा हुआ है—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν ὀφθαλμοῖς αὐτοῦ λαλεῖ
  choice: अपनी आँखों से ... बात करता है
  rationale: शब्दहीन, संकेतपूर्ण संचार की सजीव शारीरिक छवि को समतल करके ‘इशारा करता है’ नहीं किया गया।
- source_word: πάσῃ γυναικὶ
  choice: हर स्त्री से
  rationale: दत्तिव और λαλεῖ के साथ हिन्दी में ‘से बात करता है’ स्वाभाविक है तथा distributive अर्थ ‘हर’ से सुरक्षित रहता है।
- source_word: ἐν συνταγῇ κακίας
  choice: बुराई की किसी योजना के लिए
  rationale: συνταγή में व्यवस्था, योजना या सोची-समझी युक्ति का भाव है। ‘के लिए’ इस वाक्य में उद्देश्यपूर्ण दुष्ट मंशा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पाठ की सटीक संबंधगत अस्पष्टता को पादटिप्पणी में रखा गया है।
