  text: He did not stop until he had succeeded in scattering them as in orphanhood[c][b][a], and he made a house desolate because of lawless desire.
translation:
  language: hi
  text: वह तब तक नहीं रुका, जब तक उन्हें इस तरह तितर-बितर करने में सफल न हो गया, मानो वे अनाथ हों[a]; और उसने अधर्मपूर्ण लालसा के कारण एक घर[b] उजाड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मानो वे सहारे से वंचित हों’ या ‘मानो वे शोक में पड़े हों’ भी हो सकता है। यूनानी पद का शाब्दिक अर्थ ‘मानो अनाथावस्था में’ है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘घर’ से व्यापक अर्थ में ‘घराना’ या ‘परिवार’ भी अभिप्रेत हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἀπέστη
  choice: वह तब तक नहीं रुका
  rationale: यहाँ क्रिया किसी स्थान से चले जाने के बजाय विनाशकारी कार्य में लगे रहने को व्यक्त करती है; इसलिए आधुनिक हिन्दी में ‘नहीं रुका’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἐνίκησεν σκορπίσαι
  choice: तितर-बितर करने में सफल न हो गया
  rationale: ἐνίκησεν के साथ आए infinitive σκορπίσαι का भाव लक्ष्य प्राप्त करने का है, न कि सैन्य विजय का। हिन्दी वाक्य-विन्यास के लिए ‘उन्हें’ संदर्भ से पूरित किया गया है; यूनानी में इसका स्पष्ट कर्म नहीं है।
- source_word: ὡς ἐν ὀρφανίᾳ
  choice: मानो वे अनाथ हों
  rationale: शाब्दिक ‘अनाथावस्था में’ हिन्दी में अस्वाभाविक है। यह रूप अनाथ और असुरक्षित हो जाने की सजीव उपमा बनाए रखता है, जबकि संभावित ‘शोकग्रस्त/सहारे से वंचित’ अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἠρήμωσεν οἶκον
  choice: एक घर उजाड़ दिया
  rationale: ‘उजाड़ दिया’ ἠρήμωσεν की निर्जन और विनष्ट कर देने की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है। ‘घर’ οἶκον की ठोस छवि बनाए रखता है, यद्यपि प्रसंग में परिवार भी अभिप्रेत हो सकता है।
- source_word: ἕνεκεν ἐπιθυμίας παρανόμου
  choice: अधर्मपूर्ण लालसा के कारण
  rationale: ‘अधर्मपूर्ण’ παρανόμου के नियम-विरोधी नैतिक अर्थ को और ‘लालसा’ ἐπιθυμίας की प्रबल, अनुचित चाह को व्यक्त करती है।
