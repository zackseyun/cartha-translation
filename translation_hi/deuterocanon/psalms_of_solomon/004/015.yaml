  text: He was filled with this lawlessness[a], and his eyes were set on another household to destroy it with relentless words; his soul is not satisfied, like Hades[c][b], with all these things.
translation:
  language: hi
  text: वह इस अधर्म से भर गया था; उसकी आँखें दूसरे घराने[a] पर लगी थीं, ताकि वह बिना देर किए कहे गए शब्दों[b] से उसे नष्ट कर दे। इन सब बातों से भी उसकी आत्मा अधोलोक के समान[c] तृप्त नहीं होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूसरे घर पर’। यूनानी οἶκος का अर्थ भौतिक घर भी हो सकता है और घराना या परिवार भी।
    reason: lexical_alternative
  - marker: b
    text: यह यूनानी पदबंध कठिन है। इसका अनुवाद ‘बिना हिचक बोले गए शब्दों से’ या ‘लगातार शब्दों से’ भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: यूनानी में ‘हेडिस’ है। ‘अधोलोक के समान’ उसकी अतृप्तता को व्यक्त करता है; ‘कब्र’ या ‘शीओल’ अन्य व्याख्यात्मक अनुवाद हैं।
    reason: lexical_alternative
