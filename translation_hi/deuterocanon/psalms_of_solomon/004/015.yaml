- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ
  choice: उसकी आँखें … पर लगी थीं
  rationale: दृष्टि के साथ-साथ लक्ष्य पर जमे हुए दुर्भावनापूर्ण इरादे को व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: οἶκον ἕτερον
  choice: दूसरे घराने
  rationale: यहाँ οἶκος का सामाजिक और पारिवारिक अर्थ संभवतः प्रमुख है; फिर भी भौतिक ‘घर’ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
