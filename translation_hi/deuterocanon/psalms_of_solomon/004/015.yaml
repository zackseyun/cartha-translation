- source_word: ἐν λόγοις ἀνυπερθέσεως
  choice: बिना देर किए बोले गए शब्दों से
  rationale: दुर्बोध यूनानी पदबंध में न टालने या विलंब न करने का भाव है। मुख्य पाठ निकट और बोधगम्य रखा गया है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: οὐκ ἐμπίπλαται ἡ ψυχὴ αὐτοῦ
  choice: उसका प्राण तृप्त नहीं होता
  rationale: ‘तृप्त नहीं होता’ अतृप्त लालसा को स्पष्ट करता है; ‘प्राण’ ψυχή को केवल मानसिक भाव तक सीमित किए बिना व्यक्ति के भीतरी जीवन का संकेत देता है।
- source_word: ὡς ᾅδης
  choice: अधोलोक के समान
  rationale: ᾅδης को आधुनिक हिन्दी में बोधगम्य रूप से प्रस्तुत करता है और उसकी कभी न भरने वाली विनाशकारी छवि को बनाए रखता है।
