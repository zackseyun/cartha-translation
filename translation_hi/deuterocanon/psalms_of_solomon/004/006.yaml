lexical_decisions:
- source_word: ταχὺς εἰσόδῳ
  choice: शीघ्र प्रवेश करता है
  rationale: विशेषण और भाववाचक संज्ञा की यूनानी रचना प्रवेश करने में तत्परता या शीघ्रता व्यक्त करती है; हिन्दी में क्रियात्मक रूप स्वाभाविक और अर्थसंगत है।
- source_word: εἰς πᾶσαν οἰκίαν
  choice: हर घर में
  rationale: यह गंतव्यसूचक वाक्यांश है; आधुनिक हिन्दी में ‘हर घर में प्रवेश’ स्वाभाविक है और πᾶσαν का व्यापक अर्थ बनाए रखता है।
- source_word: ἱλαρότητι
  choice: प्रसन्नता के साथ
  rationale: यह हर्षपूर्ण, उल्लसित या प्रसन्न भाव-भंगिमा को दर्शाता है; ‘प्रसन्नता’ गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ὡς ἄκακος
  choice: मानो निर्दोष हो
  rationale: ὡς यहाँ दिखावे या तुलना का भाव रख सकता है, जबकि ἄκακος का अर्थ निर्दोष, अहानिकर या निष्कपट है; ‘मानो निर्दोष हो’ मूल की निहित विडंबना और अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: ὡς ἄκακος में वास्तविक निर्दोषता या निर्दोषता का आभास
  choice: मानो निर्दोष हो
  alternative: एक निर्दोष व्यक्ति की तरह
  rationale: संदर्भगत आलोचनात्मक स्वर और ὡς की तुलनात्मक शक्ति को देखते हुए ‘मानो’ यह संकेत देता है कि उसका बाहरी व्यवहार वास्तविक चरित्र से भिन्न हो सकता है, पर इसे उससे अधिक स्पष्ट आरोप में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी की संक्षिप्त वाक्य-रचना के निकट। कर्ता को हिन्दी में स्पष्ट करने के लिए ‘वह’ जोड़ा गया है।
