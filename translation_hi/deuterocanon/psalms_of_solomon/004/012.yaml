  text: उसकी बातें अन्यायियों की इच्छा को कार्यरूप देने के लिए झूठे तर्क हैं[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी बातें कुतर्क हैं’ अथवा ‘उसकी बातें छल हैं’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अन्यायियों की इच्छा को व्यवहार में लाने के लिए’।
    reason: lexical_alternative
  - marker: c
    text: यूनानी ἀδίκων का अर्थ ‘अन्यायियों’ के बजाय ‘अन्यायपूर्ण चीज़ों/कामों’ भी हो सकता है; तब अर्थ होगा, ‘अन्यायपूर्ण चीज़ों की इच्छा को कार्यरूप देने के लिए’।
    reason: source_ambiguity
lexical_decisions:
- source_word: λόγοι
  choice: बातें
  rationale: यह सामान्य और स्वाभाविक हिन्दी में उसके कहे हुए शब्दों पर ध्यान बनाए रखता है; ‘वचन’ यहाँ अनावश्यक रूप से धार्मिक रंग दे सकता है।
- source_word: παραλογισμοί
  choice: झूठे तर्क
  rationale: इस शब्द में त्रुटिपूर्ण और छलपूर्ण विचार-दलील दोनों का भाव है। ‘झूठे तर्क’ बौद्धिक तथा नैतिक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς πρᾶξιν
  choice: पूरी करने के लिए
  rationale: यूनानी पद उद्देश्य अथवा परिणति बताता है—बातें केवल विचार नहीं रहतीं, बल्कि इच्छा को कार्यरूप देने का साधन बनती हैं। हिन्दी में यह भाव स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἐπιθυμίας
  choice: इच्छा
  rationale: यह व्यापक अर्थ रखता है और इसे केवल यौन ‘वासना’ तक सीमित नहीं करता।
- source_word: ἀδίκων
  choice: अन्यायी लोगों की
  rationale: रूप को पुल्लिंग बहुवचन संबंधकारक मानते हुए यह उन अन्यायी लोगों की ओर संकेत करता है जिनकी इच्छा इन बातों द्वारा पूरी होती है। यूनानी में नपुंसकलिंग अर्थ ‘अन्यायपूर्ण बातों/कामों’ की संभावना भी है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ἀδίκων का संदर्भ
  choice: इसे पुल्लिंग बहुवचन मानकर ‘अन्यायी लोगों की’ किया गया है।
  alternative: इसे नपुंसकलिंग बहुवचन मानकर ‘अन्यायपूर्ण कामों की’ अथवा ‘अन्यायपूर्ण बातों की’ समझा जा सकता है।
  rationale: यूनानी रूप दोनों व्याकरणिक विश्लेषण स्वीकार कर सकता है। मुख्य पाठ निकटवर्ती प्रकाशित परंपरा के व्यक्तिवाचक अर्थ को रखता है, जबकि पादटिप्पणी वास्तविक स्रोतगत अस्पष्टता को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बातें’ और ‘झूठे तर्क’ गैर-तकनीकी हैं; वाक्य में उद्देश्य-संबंध स्पष्ट करने के लिए ‘जो ... के लिए हैं’ जोड़ा गया है। सभी स्रोतगत प्रमुख विकल्प पादटिप्पणियों में सुरक्षित हैं।
