base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/017.yaml
  text: May his life be in pains and poverty and want[a], O Lord; his sleep in griefs[b], and his waking in distresses.
translation:
  language: hi
  text: हे प्रभु, उसका जीवन पीड़ाओं, गरीबी और अभाव[a] में बीते; उसकी नींद दुखों में और उसका जागना संकटों में हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अभाव’ और आगे ‘संकटों’ के लिए एक ही यूनानी शब्द के रूप आए हैं। संदर्भ के अनुसार इसका अर्थ घोर कमी, साधनहीनता, लाचारी या संकट हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में इन उपवाक्यों की क्रिया व्यक्त नहीं की गई है। आसपास चल रही अभिशाप-श्रृंखला के कारण यहाँ इच्छार्थक भाव—‘बीते ... हो’—समझा गया है।
    reason: source_ambiguity
lexical_decisions:
- source_word: ὀδύναις
  choice: पीड़ाओं
  rationale: बहुवचन संज्ञा शारीरिक और भावनात्मक, दोनों प्रकार की वेदना को समेटती है और यूनानी ἐν के साथ व्यक्त दशा को स्वाभाविक हिन्दी में रखती है।
- source_word: πενίᾳ
  choice: गरीबी
  rationale: यह शब्द भौतिक निर्धनता या अभाव को दर्शाता है; ‘गरीबी’ आधुनिक पाठक के लिए स्पष्ट और सहज है।
- source_word: ἀπορίᾳ
  choice: अभाव
  rationale: गरीबी के साथ प्रयुक्त होने पर यहाँ गंभीर कमी या साधनहीनता का भाव प्रमुख है; ‘अभाव’ उस अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ζωὴ
  choice: जीवन
  rationale: यह व्यक्ति की समूची जीवन-दशा को व्यक्त करने वाला सीधा और मानक हिन्दी समतुल्य है।
- source_word: λύπαις
  choice: दुखों
  rationale: बहुवचन रूप बार-बार या चारों ओर से घेरने वाले शोक-दुख का संकेत देता है; ‘दुखों’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ἐξέγερσις
  choice: जागना
  rationale: यह नींद से उठने या जागने की अवस्था को बताता है और ‘नींद’ के साथ सहज समानांतर बनाता है।
- source_word: ἀπορίαις
  choice: संकटों
  rationale: यह उसी मूल शब्द का बहुवचन है जो पहले आया है, पर जागने की दशा में असहायता और घेर लेने वाली कठिनाइयों का भाव ‘संकटों’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: यूनानी संबोधन को प्रार्थनात्मक और गरिमापूर्ण हिन्दी में स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: क्रियारहित यूनानी उपवाक्यों का भाव
  choice: इच्छार्थक/शापसूचक भाव—‘बीते ... हो’
  alternative: वर्णनात्मक विधान—‘उसका जीवन ... में है’
  rationale: इस पद में स्पष्ट क्रिया नहीं है, पर आसपास के पदों में चल रही इच्छार्थक अभिशाप-श्रृंखला इसे प्रार्थनात्मक कामना के रूप में पढ़ने का मजबूत संदर्भ देती है। फिर भी यूनानी की औपचारिक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। समानांतर संरचना को बनाए रखते हुए कृत्रिम शब्दशःपन से बचा गया है।
