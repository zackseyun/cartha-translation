- source_word: ἐνδύματος εὐπρεπείας
  choice: शोभायमान वस्त्र
  rationale: यह पद आकर्षक, सम्मानजनक या सुसज्जित पहनावे को सूचित करता है और शोक-वस्त्र के साथ स्पष्ट विरोध बनाता है।
- source_word: σχοινίον
  choice: रस्सी
  rationale: शब्द रस्सी या डोरी को सूचित कर सकता है; सिर पर बाँधे जाने के बावजूद मूल में उसकी मोटाई निश्चित नहीं है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: στεφάνου
  choice: मुकुट
  rationale: στέφανος पुष्पहार, सिर का अलंकार या मुकुट हो सकता है। हिन्दी में 'मुकुट' सहज है, जबकि गैर-राजकीय अलंकरण की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
