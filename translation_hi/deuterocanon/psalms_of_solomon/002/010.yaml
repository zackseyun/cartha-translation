lexical_decisions:
- source_word: οὐρανός
  choice: आकाश
  rationale: γῆ के साथ यह सृष्टि के व्यापक युग्म ‘आकाश और पृथ्वी’ को व्यक्त करता है; ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और दृश्य तथा ब्रह्मांडीय दोनों बिंबों को बनाए रखता है।
- source_word: ἐβαρύνθησεν
  choice: बोझिल हो गया
  rationale: βαρύνω का मूल भाव भारी या भारग्रस्त होना है। ‘बोझिल हो गया’ नैतिक और ब्रह्मांडीय भार का काव्यात्मक संकेत बनाए रखता है, बिना इसे केवल अँधेरा होने या मौसम बदलने के अर्थ में सीमित किए।
- source_word: γῆ
  choice: पृथ्वी
  rationale: οὐρανός के साथ युग्म होने के कारण यहाँ स्थानीय ‘भूमि’ की अपेक्षा व्यापक ‘पृथ्वी’ उपयुक्त है।
- source_word: ἐβδελύξατο
  choice: घृणा की
  rationale: क्रिया तीव्र विकर्षण और घोर नापसंदगी व्यक्त करती है; ‘घृणा की’ सामान्य आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: αὐτούς
  choice: उनसे
  rationale: यह पुल्लिंग बहुवचन कर्मवाचक सर्वनाम है और प्रसंग में न्याय के अधीन लोगों की ओर संकेत करता है; हिन्दी में ‘घृणा करना’ के साथ ‘से’ स्वाभाविक है।
theological_decisions:
- issue: आकाश और पृथ्वी की मानवीकृत प्रतिक्रिया
  choice: दोनों को कर्ता के रूप में रखते हुए ‘आकाश बोझिल हो गया’ और ‘पृथ्वी ने उनसे घृणा की’
  alternative: इसे केवल मौसम या भौतिक घटना के रूप में स्पष्ट करना
  rationale: यूनानी पाठ सृष्टि की काव्यात्मक, मानवीकृत प्रतिक्रिया को खुला रखता है; अनुवाद इस नैतिक-ब्रह्मांडीय तनाव को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘बोझिल’ ने भार के मूल बिंब को सुरक्षित रखा है, जबकि ‘आकाश और पृथ्वी’ का व्यापक सृष्टिगत युग्म भी बना रहता है।
