base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/015.yaml
  text: Because they themselves defiled what was pure in the filth of illicit mingling[c][b][a]. My belly and my inward parts ache over these things.
translation:
  language: hi
  text: क्योंकि उन्होंने स्वयं शुद्ध वस्तुओं[a] को अनुचित मेल[b] की गंदगी[c] में अशुद्ध कर दिया। इन बातों के कारण मेरा पेट और मेरी अंतड़ियाँ दुखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र वस्तुएँ।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का शाब्दिक अर्थ “मेल” या “मिश्रण” है; यहाँ संभवतः इसका नैतिक रूप से दूषित या यौन आशय है।
    reason: cultural_note
  - marker: c
    text: मुद्रित यूनानी पाठ में ‘गली’ से मिलता-जुलता रूप है; पर व्याकरण और संदर्भ के आधार पर यहाँ “गंदगी” या “मैल” पढ़ा जाता है।
    reason: textual_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: क्योंकि
  rationale: यह पद पिछले प्रसंग से जुड़ी विलाप की वजह बताता है; ‘क्योंकि’ हिन्दी में स्वाभाविक रहते हुए कारणसूचक बल बनाए रखता है।
- source_word: αὐταὶ
  choice: उन्होंने स्वयं
  rationale: मूल सर्वनाम स्त्रीलिंग और बलाघाती है। हिन्दी में ‘स्वयं’ बल को सुरक्षित रखता है; पद में अनुपस्थित ‘स्त्रियाँ’ संज्ञा को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐμίαυσαν (संदर्भानुसार ἐμίαναν)
  choice: अशुद्ध कर दिया
  rationale: पांडुलिपीय/मुद्रणगत रूप संदिग्ध है, पर संदर्भ और स्वीकृत पाठ-सुधार दूषित या अपवित्र करने का अर्थ स्पष्ट करते हैं। ‘अशुद्ध’ नैतिक और धार्मिक अशुद्धि—दोनों की संभावना खुली रखता है।
- source_word: ἁγνὰ
  choice: शुद्ध वस्तुओं
  rationale: नपुंसकलिंग बहुवचन को वस्तुगत रूप में रखा गया है। शब्द शुद्धता का बोध देता है; ‘पवित्र वस्तुओं’ की संभावित व्याख्या पादटिप्पणी में दी गई है।
- source_word: 'ἐν ῥύμῳ (सुधारित पाठ: ἐν ῥύπῳ)'
  choice: गंदगी में
  rationale: प्राप्त रूप व्याकरणतः ‘गली में’ अर्थ देने वाले ῥύμη के दत्तिव से मेल नहीं खाता। संदर्भ और प्रमाणित पाठ-सुधार ῥύπῳ, ‘गंदगी/मैल में’, का समर्थन करते हैं।
- source_word: ἀναμίξεως
  choice: अनुचित मेल
  rationale: मूल संज्ञा का शाब्दिक अर्थ मिश्रण या मेल है, किंतु यहाँ नैतिक रूप से दूषित, संभवतः यौन, आशय है। ‘अनुचित मेल’ उस संकेत को बनाए रखता है और अर्थ को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: τὴν κοιλίαν μου καὶ τὰ σπλάγχνα μου
  choice: मेरा पेट और मेरी अंतड़ियाँ
  rationale: विलाप की शारीरिक और अंतरंग तीव्रता बनाए रखने के लिए दोनों देहगत बिंब अलग-अलग रखे गए हैं।
- source_word: πονῶ ἐπὶ τούτοις
  choice: इन बातों के कारण ... दुखती हैं
  rationale: वर्तमान पीड़ा और उसके कारण का स्वाभाविक हिन्दी में स्पष्ट संप्रेषण होता है।
theological_decisions:
- issue: ἁγνὰ का आशय
  choice: शुद्ध वस्तुओं
  alternative: पवित्र वस्तुओं
  rationale: ‘शुद्ध’ मूल के नैतिक/अनुष्ठानिक विस्तार को खुला रखता है; ‘पवित्र’ अधिक धार्मिक-विशिष्ट व्याख्या हो सकती है, इसलिए उसे पादटिप्पणी में रखा गया।
- issue: ἀναμίξεως का नैतिक अथवा यौन संकेत
  choice: अनुचित मेल
  alternative: यौन संसर्ग / व्यभिचारी मेल
  rationale: संदर्भ में नैतिक और संभवतः यौन संकेत है, पर मूल शब्द स्वयं केवल ‘मेल/मिश्रण’ कहता है। मुख्य पाठ में तनाव और अस्पष्टता बचाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर विलाप का स्वर रखा गया है। भाषा साधारण पाठक के लिए स्पष्ट है, पर ‘पेट’ और ‘अंतड़ियाँ’ जैसे मूल के तीखे शारीरिक बिंब को नरम करके केवल ‘मन’ या ‘हृदय’ नहीं बनाया गया।
