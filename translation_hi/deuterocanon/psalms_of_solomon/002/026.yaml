lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक है, जो प्रार्थना के पिछले कथन को आगे बढ़ाता है; इसमें कोई अतिरिक्त कालगत अर्थ नहीं जोड़ा गया।
- source_word: συντελεσθήσονται
  choice: उनका अन्त हो जाएगा
  rationale: भविष्यकालीन कर्मवाच्य रूप किसी को पूर्णतः अन्त तक पहुँचा दिए जाने का भाव देता है। यह हिन्दी में स्वाभाविक रहते हुए विनाश की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐὰν μὴ
  choice: यदि ... न
  rationale: यह शर्त अथवा अपवाद को व्यक्त करने वाले यूनानी पदबंध का स्वाभाविक हिन्दी रूप है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: यह सीधा सम्बोधन है; ‘हे प्रभु’ प्रार्थना के प्रसंग में स्पष्ट, गरिमापूर्ण और स्वाभाविक है।
- source_word: ἐπιτιμήσεις
  choice: फटकारें
  rationale: यह अधिकारपूर्वक और कठोरता से डाँटने या रोकने का भाव सुरक्षित रखता है।
- source_word: ἐν ὀργῇ σου
  choice: अपने क्रोध में
  rationale: यह पदबंध परमेश्वर के तीव्र और न्यायिक क्रोध की गंभीरता को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: संकेतित बहुवचन कर्ता की पहचान
  choice: मुख्य पाठ में कर्ता को ‘उनका’ के रूप में अनिर्दिष्ट रखा गया
  alternative: ‘इस्राएल का अन्त हो जाएगा’
  rationale: यूनानी क्रिया में कर्ता स्पष्ट संज्ञा के रूप में नहीं दिया गया है। निकटवर्ती प्रसंग इस्राएल की ओर संकेत कर सकता है, पर मुख्य पाठ में ‘इस्राएल’ जोड़ना मूल की वास्तविक व्याकरणिक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनात्मक और गरिमापूर्ण स्वर रखा गया है। ‘फटकारें’ सामान्य पाठक के लिए स्पष्ट है और दैवी अधिकार का बल भी बनाए रखता है। सर्वनामों की संभावित संदर्भगत अस्पष्टता को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में बताया गया है।
