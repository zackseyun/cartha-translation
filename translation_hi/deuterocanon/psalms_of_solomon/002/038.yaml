    text: शाब्दिक रूप से, “युग के लिए”; यहाँ सम्भवतः स्थायी रूप से या सदा के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστεῖλαι
  choice: भेद करने
  rationale: यह क्रिया न्याय के संदर्भ में दो नैतिक वर्गों के बीच स्पष्ट अंतर ठहराने को व्यक्त करती है। ‘भेद करने’ से पहचानने और अलग ठहराने—दोनों की संभावित छाया बनी रहती है।
- source_word: ἀνὰ μέσον
  choice: के बीच
  rationale: यह यूनानी पदबंध दो पक्षों के बीच अंतर या विभाजन को सूचित करता है; आधुनिक हिन्दी में ‘के बीच’ इसका सीधा और स्वाभाविक रूप है।
- source_word: δικαίου
  choice: धर्मी
  rationale: एकवचन यहाँ किसी एक विशेष पुरुष के बजाय एक नैतिक वर्ग का प्रतिनिधि है। ‘धर्मी’ इस वर्गगत अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἁμαρτωλοῦ
  choice: पापी
  rationale: यह संज्ञा एकवचन में ‘धर्मी’ के नैतिक प्रतिपक्ष के रूप में है। ‘पापी’ निकट और स्पष्ट हिन्दी समतुल्य है।
- source_word: ἀποδοῦναι
  choice: प्रतिफल देने
  rationale: न्याय के इस प्रसंग में क्रिया कर्मों के अनुरूप बदला या परिणाम देने का अर्थ रखती है। ‘प्रतिफल देने’ प्रतिशोध का अनावश्यक भाव जोड़े बिना न्यायिक प्रत्युत्तर को व्यक्त करता है।
- source_word: ἁμαρτωλοῖς
  choice: पापियों को
  rationale: बहुवचन संप्रदान कारक को हिन्दी में ‘को’ के साथ स्पष्ट रूप से व्यक्त किया गया है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: शाब्दिक रूप से यह ‘युग के लिए’ है, पर इस न्याय-संदर्भ में दीर्घस्थायी अथवा अनंत अवधि का भाव सम्भावित है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: उनके कामों के अनुसार
  rationale: ‘कामों के अनुसार’ कर्म और उसके अनुरूप न्यायिक प्रतिफल के संबंध को स्पष्ट, वर्तमान और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एकवचन नैतिक श्रेणियाँ
  choice: δικαίου और ἁμαρτωλοῦ को वर्ग-प्रतिनिधि रूप में ‘धर्मी’ और ‘पापी’ अनूदित किया गया है।
  alternative: ‘धर्मी पुरुष और पापी पुरुष’ अथवा किसी एक विशिष्ट धर्मी और पापी का संकेत।
  rationale: यूनानी एकवचन न्याय के प्रसंग में सामान्य नैतिक श्रेणियों का प्रतिनिधित्व करते हैं। हिन्दी के ‘धर्मी’ और ‘पापी’ मूल के एकवचन और वर्गगत विरोध—दोनों को बिना अनावश्यक पुरुष-विशेष भाषा के सुरक्षित रखते हैं।
- issue: εἰς τὸν αἰῶνα की अवधि
  choice: मुख्य पाठ में ‘सदा के लिए’ रखा गया है।
  alternative: अधिक शाब्दिक ‘युग के लिए’।
  rationale: वाक्यांश का शाब्दिक रूप युग-संबंधी है, किंतु यहाँ न्यायिक प्रतिफल की स्थायी अवधि सम्भावित है। अस्पष्टता को मिटाने के बजाय पादटिप्पणी में शाब्दिक विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। पद पिछले संदर्भ से जुड़े उद्देश्यसूचक क्रियारूपों का अंश है, इसलिए अंत में अर्धविराम रखा गया है।
