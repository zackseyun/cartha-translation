base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/001.yaml
  text: When the sinner acted arrogantly[a], he tore down fortified walls with battering rams[b], and you did not stop him.
translation:
  language: hi
  text: जब पापी घमण्ड कर रहा था, तब वह दीवार तोड़ने वाले युद्ध-यंत्रों[a] से किलेबन्द दीवारें ढा रहा था[b], और तूने उसे नहीं रोका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘मेढ़ों से’; यहाँ सम्भवतः दीवारों पर टक्कर मारकर उन्हें तोड़ने वाले घेराबन्दी-यंत्र अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी को इस प्रकार भी समझा जा सकता है: ‘जब पापी दीवार तोड़ने वाले युद्ध-यंत्रों के साथ घमण्ड कर रहा था, तब वह किलेबन्द दीवारें ढा रहा था।’'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἐν τῷ ὑπερηφανεύεσθαι
  choice: जब ... घमण्ड कर रहा था
  rationale: ἐν τῷ के साथ infinitive यहाँ समयसूचक है। ‘घमण्ड कर रहा था’ अहंकारी आत्म-उन्नयन का नैतिक भाव और चल रही क्रिया—दोनों स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἁμαρτωλόν
  choice: पापी
  rationale: यूनानी का एकवचन सीधे बनाए रखा गया है; इससे किसी अधिक व्याख्यात्मक उपाधि को जोड़े बिना व्यक्ति-विशेष का चित्रण सुरक्षित रहता है।
- source_word: ἐν κριοῖς
  choice: दीवार तोड़ने वाले युद्ध-यंत्रों से
  rationale: κριός का शाब्दिक अर्थ ‘मेढ़ा’ है, पर घेराबन्दी और दीवारें ढाने के प्रसंग में यह दीवार तोड़ने वाले टक्कर-यंत्रों का द्योतक है। स्पष्ट आधुनिक हिन्दी के लिए कार्य का वर्णन किया गया है और शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: κατέβαλλε
  choice: ढा रहा था
  rationale: imperfect काल चल रही क्रिया को सूचित करता है; ‘ढा रहा था’ उस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τείχη ὀχυρά
  choice: किलेबन्द दीवारें
  rationale: ὀχυρός का अर्थ मजबूत अथवा सुदृढ़/किलेबन्द है। नगर-दीवारों के सैन्य प्रसंग में ‘किलेबन्द दीवारें’ स्वाभाविक और सटीक है।
- source_word: οὐκ ἐκώλυας
  choice: तूने उसे नहीं रोका
  rationale: यूनानी में कर्म निहित है और पिछले कर्ता से स्पष्ट होता है। भजन की सीधी ईश्वर-सम्बोधित वाणी के लिए ‘तूने’ तथा आधुनिक स्पष्ट हिन्दी के लिए ‘उसे नहीं रोका’ चुना गया है।
theological_decisions:
- issue: ἐν κριοῖς का वाक्यगत सम्बन्ध
  choice: इसे मुख्य क्रिया ‘दीवारें ढा रहा था’ से जोड़ा गया है।
  alternative: 'इसे ‘पापी घमण्ड कर रहा था’ से जोड़कर पढ़ा जा सकता है: ‘जब पापी युद्ध-यंत्रों के कारण/साथ घमण्ड कर रहा था...’।'
  rationale: दीवारें ढाने का निकट सैन्य प्रसंग साधनवाचक सम्बन्ध का प्रबल समर्थन करता है, फिर भी यूनानी शब्दक्रम दूसरी सम्भावित सम्बद्धता को पूरी तरह समाप्त नहीं करता; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। चल रही क्रियाओं के लिए ‘कर रहा था/ढा रहा था’ रखा गया है। ईश्वर को सीधे सम्बोधन में भजन-साहित्य के अनुरूप आत्मीय एकवचन ‘तू’ प्रयोग किया गया है; भाषा को अनावश्यक रूप से पुरातन या साम्प्रदायिक नहीं बनाया गया।
