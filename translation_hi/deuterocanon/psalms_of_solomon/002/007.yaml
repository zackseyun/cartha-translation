translation:
  language: hi
  text: उसने उनके पापों के अनुसार उनके साथ व्यवहार किया, क्योंकि[a] उसने उन्हें उन लोगों के हाथों में छोड़ दिया जो उन पर हावी थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्थात्” अथवा “इस प्रकार कि”; यहाँ यूनानी शब्द कारण बताने के साथ पिछले कथन की व्याख्या भी कर सकता है।
    reason: discourse_ambiguity
  - marker: b
    text: या, “जो उन पर प्रबल थे” अथवा “जो उनसे अधिक शक्तिशाली थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰς ἁμαρτίας αὐτῶν
  choice: उनके पापों के अनुसार
  rationale: κατά यहाँ अनुरूपता या माप का बोध कराता है; यह अनुवाद इस न्याय-संबंधी भाव को बनाए रखता है कि उनके साथ हुआ व्यवहार उनके पापों के अनुरूप था। ἁμαρτίας का सामान्य और स्पष्ट अर्थ ‘पाप’ है।
- source_word: ἐποίησεν αὐτοῖς
  choice: उसने ... उनके साथ व्यवहार किया
  rationale: शाब्दिक रूप ‘उसने उनके साथ/उनके लिए किया’ हिन्दी में अस्वाभाविक है। ‘उनके साथ व्यवहार किया’ कर्ता की न्यायकारी कार्रवाई को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: ὅτι का सामान्य अर्थ ‘क्योंकि’ है, इसलिए इसे मुख्य पाठ में रखा गया है; फिर भी यहाँ यह पूर्व कथन की व्याख्या या उसके कार्यरूप को भी प्रस्तुत कर सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐγκατέλειπεν
  choice: छोड़ दिया था
  rationale: क्रिया किसी को असहाय अवस्था में छोड़ देने या त्याग देने का भाव रखती है। ‘छोड़ दिया था’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में दूसरे लोगों के अधिकार में सौंपे जाने का परिणाम स्पष्ट करता है।
- source_word: εἰς χεῖρας
  choice: हाथों में
  rationale: मूल का बाइबिलीय रूपक बनाए रखा गया है; यहाँ ‘हाथों में’ किसी की शक्ति या अधिकार के अधीन होने का संकेत देता है।
- source_word: κατισχυόντων
  choice: जो उन पर प्रबल हो गए थे
  rationale: सक्रिय वर्तमान कृदंत उन लोगों को दर्शाता है जो उन पर भारी पड़ रहे थे या विजय पा रहे थे। हिन्दी में ‘प्रबल हो गए थे’ उस सक्रिय ऐतिहासिक विजय को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ὅτι द्वारा दोनों उपवाक्यों का संबंध
  choice: मुख्य पाठ में कारणसूचक ‘क्योंकि’, साथ में व्याख्यात्मक विकल्प की पादटिप्पणी
  alternative: ‘अर्थात्’ या ‘इस प्रकार कि’
  rationale: मूल संयोजक कारण भी व्यक्त कर सकता है और पिछले कथन का स्पष्टीकरण भी। केवल एक व्याख्या थोपने के बजाय मुख्य अर्थ और वास्तविक अस्पष्टता दोनों सुरक्षित रखे गए हैं।
- issue: दंड में परमेश्वर की भूमिका
  choice: ‘उसने ... छोड़ दिया था’ के द्वारा मूल की प्रत्यक्ष कर्तृवाच्यता बनाए रखी
  alternative: निष्क्रिय या अप्रत्यक्ष रूप, जैसे ‘वे छोड़ दिए गए थे’
  rationale: यूनानी पाठ में कर्ता प्रत्यक्ष रूप से कार्रवाई करता है; उसे निष्क्रिय बनाना पाठ में निहित ईश्वरीय न्याय की धार को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और बाइबिलीय लहजा रखा गया है। ‘हाथों में’ मूल रूपक को बनाए रखता है, जबकि ‘व्यवहार किया’ शाब्दिक लेकिन अस्वाभाविक ‘उनके साथ किया’ से अधिक स्वाभाविक है।
