  text: And I did not delay until God showed me his insolence[a], pierced through on the mountains of Egypt[d][c][b], utterly despised on land and sea.
translation:
  language: hi
  text: और मुझे अधिक देर तक प्रतीक्षा नहीं करनी पड़ी; परमेश्वर ने मुझे उसकी उद्दंडता[a] दिखा दी—वह मिस्र के पहाड़ों पर आर-पार बेधा हुआ[b] था और धरती और समुद्र पर सबसे हीन व्यक्ति से भी अधिक तुच्छ कर दिया गया था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका घमंड” अथवा “उसका अपमानजनक अहंकार”; यूनानी शब्द में अहंकार और उससे उपजा अपमानजनक आचरण, दोनों निहित हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मिस्र के पहाड़ों पर आर-पार बेधा हुआ।” यूनानी कृदंत उस पुरुष की ओर संकेत करता है, उसकी उद्दंडता की ओर नहीं।
    reason: grammar_clarification
  - marker: c
    text: 'यूनानी वाक्यांश संक्षिप्त है: “सबसे हीन व्यक्ति से भी अधिक तुच्छ किया गया।” स्पष्टता के लिए “व्यक्ति” जोड़ा गया है।'
    reason: supplied_word
lexical_decisions:
- source_word: οὐκ ἐχρόνισα
  choice: मुझे अधिक देर तक प्रतीक्षा नहीं करनी पड़ी
  rationale: नकार के साथ क्रिया का प्रसंगगत अर्थ यह है कि वक्ता को परमेश्वर का उत्तर देखने के लिए लंबी प्रतीक्षा नहीं करनी पड़ी। यह हिन्दी में स्वाभाविक है और इसे वक्ता द्वारा जानबूझकर देर न करने के अर्थ में नहीं मोड़ता।
- source_word: τὴν ὕβριν αὐτοῦ
  choice: उसका उद्दंड घमंड
  rationale: ὕβρις में केवल भीतर का अभिमान नहीं, बल्कि अपमानजनक और दुस्साहसी आचरण में प्रकट होने वाला घमंड भी शामिल है; संयुक्त पद इस अर्थ-व्याप्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐκκενεκεντημένον
  choice: आर-पार बेधा हुआ
  rationale: यह पुरुषलिंग कर्मकारक कृदंत उस पुरुष की ओर संकेत करता है, न कि स्त्रीलिंग ὕβριν की ओर। अनुवाद हिंसक भेदन की ठोस छवि को बनाए रखता है, पर हथियार निर्धारित नहीं करता।
- source_word: ἐπὶ τῶν ὀρέων Αἰγύπτου
  choice: मिस्र के पहाड़ों पर
  rationale: स्रोत के अप्रत्याशित किन्तु स्पष्ट भौगोलिक पद को बिना समतल किए सीधे रखा गया है।
- source_word: ὑπὲρ ἐλάχιστον ἐξουδενωμένον
  choice: छोटे-से-छोटे व्यक्ति से भी अधिक तुच्छ कर दिया गया था
  rationale: यूनानी वाक्यांश संक्षिप्त और तुलनात्मक है। हिन्दी में ‘व्यक्ति’ जोड़ने से तुलना स्पष्ट होती है, जबकि अत्यधिक अपमान और निष्क्रिय कृदंत दोनों सुरक्षित रहते हैं।
- source_word: ἐπὶ γῆς καὶ θαλάσσης
  choice: धरती और समुद्र पर
  rationale: यूनानी के व्यापक स्थानगत मुहावरे को औपचारिक और बोधगम्य हिन्दी में रखा गया है।
theological_decisions:
- issue: परमेश्वर द्वारा ‘उसका घमंड दिखाने’ और उसके पतन के बीच संबंध
  choice: डैश के बाद स्पष्ट पुरुषवाचक ‘वह’ जोड़कर पतित व्यक्ति को संदर्भित किया गया
  alternative: कृदंत को बिना सर्वनाम के ‘घमंड’ से जोड़ता हुआ छोड़ना
  rationale: ἐκκενεκεντημένον पुरुषलिंग कर्मकारक एकवचन है और स्त्रीलिंग ὕβριν से मेल नहीं खाता। ‘वह’ जोड़ना व्याकरणिक संदर्भ स्पष्ट करता है, पर परमेश्वर की क्रिया या न्याय के विषय में स्रोत से अधिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक गद्य रखा गया है। ‘परमेश्वर’, ‘उद्दंड घमंड’, ‘आर-पार बेधा हुआ’ और ‘तुच्छ कर दिया गया’ सामान्य पाठक के लिए बोधगम्य हैं। स्रोत की असामान्य ‘मिस्र के पहाड़ों’ वाली छवि और संक्षिप्त तुलनात्मक अभिव्यक्ति को सुरक्षित रखा गया है।
