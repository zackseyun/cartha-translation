  rationale: ἔθνη के ‘राष्ट्र/अन्यजातियाँ’ और ἀλλότρια के ‘पराए/विदेशी’ भाव को बनाए रखता है। ‘पराए राष्ट्र’ मूल की अन्यता को ‘विदेशी राष्ट्र’ की अपेक्षा अधिक निकटता से व्यक्त करता है।
- source_word: κατεπάτησαν
  choice: रौंद डाला
  rationale: बलपूर्वक पैरों तले कुचलने और अपवित्र करने की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ὑποδήμασιν αὐτῶν
  choice: अपने जूतों से
  rationale: यह साधन अथवा परिस्थिति का भाव स्पष्ट करता है। ὑπόδημα के लिए ‘जूते’ आधुनिक हिन्दी में स्वाभाविक है और पवित्र स्थान के अपमान का चित्र बनाए रखता है।
- source_word: ἐν ὑπερηφανίᾳ
  choice: घमण्ड में
  rationale: कर्म के अहंकारी और उद्दण्ड ढंग को संज्ञात्मक यूनानी रचना के निकट रहते हुए सहज हिन्दी में व्यक्त करता है।
