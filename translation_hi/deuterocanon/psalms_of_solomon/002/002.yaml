  choice: मुख्य पाठ में ‘राष्ट्र’
  alternative: ‘अन्यजातियाँ’
  rationale: मूल शब्द की वास्तविक अर्थ-व्याप्ति को संकीर्ण किए बिना ἀλλότρια के साथ राष्ट्रों की पराई पहचान व्यक्त की गई है; संदर्भगत ‘अन्यजातियाँ’ को पादटिप्पणी में सुरक्षित रखा गया है।
