translation:
  language: hi
  text: तूने उनके पाप उजागर कर दिए, ताकि तेरा न्याय दिखाई दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκαλυψας
  choice: उजागर कर दिए
  rationale: यह क्रिया छिपी हुई बात से आवरण हटाकर उसे प्रकट करने का भाव देती है; आधुनिक हिन्दी में ‘उजागर कर दिए’ स्वाभाविक और सटीक है।
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: उनके पाप
  rationale: यूनानी बहुवचन और संबंधसूचक सर्वनाम का सीधा तथा स्वाभाविक रूप।
- source_word: ἵνα φανῇ
  choice: ताकि ... दिखाई दे
  rationale: ἵνα के प्रयोजन/परिणाम और φανῇ के प्रकट अथवा दृष्टिगोचर होने के भाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: τὸ κρίμα σου
  choice: तेरा न्याय
  rationale: κρίμα यहाँ परमेश्वर के न्यायिक निर्णय या दंडात्मक न्याय को सूचित कर सकता है; ‘न्याय’ इस व्यापकता और प्रसंगगत तनाव को सुरक्षित रखता है।
theological_decisions:
- issue: κρίμα का अर्थ—न्याय, निर्णय या दंड
  choice: तेरा न्याय
  alternative: तेरा दंडादेश
  rationale: ‘न्याय’ मूल शब्द की व्यापक न्यायिक अर्थ-सीमा को सुरक्षित रखता है और पाठ को केवल दंड तक सीमित नहीं करता।
- issue: ἵνα को प्रयोजन या परिणाम के रूप में समझना
  choice: ताकि
  alternative: जिससे
  rationale: ‘ताकि’ यूनानी उद्देश्यवाचक संरचना का सामान्य समतुल्य है, जबकि हिन्दी में प्रयोजन और अपेक्षित परिणाम दोनों की संभावित छाया रहने देता है।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी। एकवचन द्वितीय पुरुष के लिए ‘तूने/तेरा’ रखा गया है, जो भजनात्मक संबोधन की निकटता और मूल यूनानी के एकवचन को दर्शाता है।
