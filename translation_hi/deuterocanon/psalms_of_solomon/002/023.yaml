lexical_decisions:
- source_word: ἀτιμίᾳ
  choice: अपमान में
  rationale: यह शब्द अनादर, अपमान और सार्वजनिक तिरस्कार की दशा व्यक्त करता है; ‘अपमान में’ यूनानी दत्तिवाचक पदबंध को संक्षिप्त और स्वाभाविक रूप से बनाए रखता है।
- source_word: κάλλος
  choice: शोभा
  rationale: κάλλος का मूल अर्थ सौंदर्य या शोभा है। यहाँ स्त्रीलिंग संदर्भ संभवतः मानवीकृत नगरी है, इसलिए ‘शोभा’ उसके सौंदर्य और वैभव—दोनों की छाया स्वाभाविक रूप से दे सकती है।
- source_word: ἀπερρίφη
  choice: पटक दी गई
  rationale: क्रिया फेंक दिए जाने या नीचे डाल दिए जाने का प्रबल भाव रखती है। ‘पटक दी गई’ भूमि पर गिराए जाने और अपमानित किए जाने की तीव्र छवि को व्यक्त करती है।
- source_word: ἐπὶ τὴν γῆν
  choice: भूमि पर
  rationale: ἐπί के साथ कर्मकारक यहाँ किसी सतह की ओर और उस पर गति दर्शाता है; ‘भूमि पर’ आधुनिक हिन्दी में स्पष्ट और काव्यात्मक दोनों है।
theological_decisions:
- issue: स्त्रीलिंग αὐτῆς का संदर्भ
  choice: ‘उसकी’ रखकर स्त्रीलिंग पूर्वपद को अनिर्दिष्ट रहने दिया गया
  alternative: इसे स्पष्ट रूप से ‘नगरी की’ कहना
  rationale: इस पद में पूर्वपद स्वयं उपस्थित नहीं है। संदर्भ में मानवीकृत नगरी संभावित है, पर अनुवाद में उसे निश्चित कर देना मूल की संदर्भ-निर्भरता को मिटा देता।
