lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: फेर लिया
  rationale: यह क्रिया दूर कर लेने या दूसरी ओर मोड़ लेने का भाव देती है; मुख के साथ ‘मुख फेर लिया’ यूनानी बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: अपना मुख
  rationale: शाब्दिक बाइबलीय बिंब को सुरक्षित रखा गया है; ‘उपस्थिति’ जैसे शब्द रूपक की व्याख्या कर देते।
- source_word: ἀπὸ ἐλέους αὐτῶν
  choice: उन पर दया करने से
  rationale: यूनानी रचना संक्षिप्त और कुछ असामान्य है। यह चयन दया रोक लेने का आशय स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: νέον καὶ πρεσβύτην
  choice: जवान, बूढ़े
  rationale: यूनानी में दोनों रूप एकवचन हैं, पर सामूहिक और वितरणात्मक अर्थ में सभी आयु-वर्गों को सूचित करते हैं।
- source_word: τέκνα αὐτῶν
  choice: उनके बच्चे
  rationale: τέκνα केवल पुत्रों तक सीमित नहीं है; ‘बच्चे’ इसका व्यापक और स्वाभाविक हिन्दी समतुल्य है।
- source_word: εἰς ἅπαξ
  choice: सबको एक ही बार में
  rationale: यह पदबंध समग्रता और एक साथ घटित होने का भाव देता है; यहाँ ‘सबको’ पूर्ववर्ती समूहों के साथ इसका संबंध स्पष्ट करता है।
theological_decisions:
- issue: कर्ता द्वारा अपना मुख फेरने का मानवरूपी वर्णन
  choice: ‘अपना मुख फेर लिया’ का ठोस बिंब बनाए रखा गया।
  alternative: ‘अपनी दया रोक ली’ या ‘करुणा नहीं की’
  rationale: मूल पाठ देहात्मक और संबंधपरक भाषा का प्रयोग करता है। उसे अमूर्त कथन में बदलना पाठ के धर्मवैचारिक तनाव को अनावश्यक रूप से समतल कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘मुख फेर लिया’ बाइबलीय बिंब को बनाए रखता है; ‘जवान, बूढ़े’ सामूहिक अर्थ देता है। मुख्य पाठ में अस्पष्ट यूनानी संबंध को स्वाभाविक बनाया गया है और वास्तविक वैकल्पिक संरचना पादटिप्पणी में सुरक्षित है।
