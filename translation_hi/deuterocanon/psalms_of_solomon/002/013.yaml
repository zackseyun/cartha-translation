  yaml_path: translation/deuterocanon/psalms_of_solomon/002/013.yaml
  text: They made the sons of Jerusalem a mockery[a], like prostitutes within her; everyone passing by would enter in broad daylight[c][b]; they mocked them with their lawless deeds.
translation:
  language: hi
  text: उन्होंने यरूशलेम के पुत्रों को उपहास का पात्र बना दिया—उसमें वेश्याओं के स्थान पर[a]। हर राहगीर दिन-दहाड़े उसमें प्रवेश करता था[b]; वे अपने अधर्मपूर्ण कामों से उनका उपहास करते थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें वेश्याओं के समान।” यूनानी का अधिक शाब्दिक अर्थ “वेश्याओं के स्थान पर” है, पर यहाँ अपमान की तुलना का भाव भी संभव है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “सूर्य के सामने”; अर्थात खुलेआम, सबके देखते हुए।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में ‘उनका’—अर्थात यरूशलेम के पुत्रों का—स्पष्ट रूप से नहीं है; इसे संदर्भ से समझा गया है। ‘अपने अधर्मपूर्ण कामों’ में ‘अपने’ यूनानी में स्पष्ट है।
    reason: implicit_object
lexical_decisions:
- source_word: ἔστησαν ... εἰς ἐμπαιγμόν
  choice: उपहास का पात्र बना दिया
  rationale: ἔστησαν का मूल अर्थ ‘खड़ा/स्थापित किया’ है, पर εἰς ἐμπαιγμόν के साथ यह किसी को उपहास की दशा या भूमिका में डालने का भाव देता है। यह हिन्दी प्रयोग उस परिणामी सार्वजनिक अपमान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοὺς υἱοὺς Ἱερουσαλήμ
  choice: यरूशलेम के पुत्रों
  rationale: मूल यूनानी में स्पष्ट पुल्लिंग बहुवचन है। ‘पुत्रों’ से उसका रूप और यरूशलेम से जुड़ा पारिवारिक रूपक दोनों सुरक्षित रहते हैं।
- source_word: ἀντὶ πορνῶν ἐν αὐτῇ
  choice: उसके भीतर वेश्याओं के स्थान पर
  rationale: ἀντί का सीधा अर्थ ‘के स्थान पर/के बदले’ सुरक्षित रखा गया है; ‘उसके’ का संबंध स्त्रीलिंग यरूशलेम से है। तुलनात्मक अर्थ संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: πᾶς ὁ πορευόμενος εἰσεπορεύετο
  choice: हर राहगीर ... भीतर जाता था
  rationale: दोनों गमन-क्रियाओं और अपूर्णकाल के बार-बार होने वाले भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: κατέναντι τοῦ ἡλίου
  choice: दिन-दहाड़े
  rationale: शाब्दिक अर्थ ‘सूर्य के सामने’ है। ‘दिन-दहाड़े’ उसी खुले, सार्वजनिक और निर्लज्ज व्यवहार का स्वाभाविक हिन्दी मुहावरा है।
- source_word: ἐνέπαιζον
  choice: हँसी उड़ाते थे
  rationale: क्रिया उपहास और अपमान का भाव रखती है। हिन्दी में ‘हँसी उड़ाना’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ταῖς ἀνομίαις αὐτῶν
  choice: अपने अधर्म के कामों से
  rationale: ἀνομίαις को केवल वैधानिक उल्लंघन न मानकर नैतिक दुष्कर्म के रूप में ‘अधर्म के काम’ कहा गया है; करण कारक ‘से’ यूनानी संप्रदान के साधनात्मक भाव को व्यक्त करता है।
theological_decisions:
- issue: ἀντὶ πορνῶν में संबंध का प्रकार
  choice: मुख्य पाठ में ‘वेश्याओं के स्थान पर’
  alternative: ‘वेश्याओं के समान’
  rationale: मूल ἀντί का सीधा प्रतिस्थापनार्थक अर्थ पहले रखा गया है और कठिन बिंब को चुपचाप तुलनात्मक अर्थ में नहीं बदला गया; संदर्भगत तुलनात्मक संभावना पादटिप्पणी में सुरक्षित है।
- issue: ἐνέπαιζον का अव्यक्त कर्म
  choice: संदर्भ के आधार पर ‘उनकी’ जोड़ा गया
  alternative: कर्म को अव्यक्त रखते हुए ‘उपहास करते थे’
  rationale: यूनानी में कर्म स्पष्ट रूप से नहीं आया, पर निकटतम संदर्भ यरूशलेम के पुत्र हैं। हिन्दी में वाक्य को स्वाभाविक बनाने के लिए सर्वनाम जोड़ा गया और इस पूर्ति को पादटिप्पणी में बताया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर काव्यात्मक और गंभीर गरिमा बनाए रखती है। ‘यरूशलेम के पुत्रों’ से मूल का पुल्लिंग पारिवारिक रूपक सुरक्षित है। ‘दिन-दहाड़े’ सामान्य पाठक के लिए स्पष्ट है और ‘सूर्य के सामने’ की मूल छवि पादटिप्पणी में दी गई है। कठिन यौन-अपमानकारी बिंब को नरम या सांप्रदायिक व्याख्या से प्रतिस्थापित नहीं किया गया।
