base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/019.yaml
  text: You made their memorial perish from the earth[a]. God is a righteous judge[d][c][b], and he will not show partiality.
translation:
  language: hi
  text: तूने धरती से उनका स्मरण प्रकट किया[a][b]। परमेश्वर धर्मी न्यायाधीश है, और वह किसी का पक्ष नहीं करेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का सामान्य अर्थ ‘ज्ञात कराया’ या ‘प्रकट किया’ है। यहाँ कथन असामान्य है; प्रसंग के कारण कुछ लोग इसका आशय ‘उनका स्मरण धरती से मिटा दिया’ समझते हैं, पर यूनानी पाठ में ‘मिटाना’ क्रिया नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘धरती’ का अनुवाद ‘देश’ या ‘भूमि’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘चेहरे की प्रशंसा नहीं करेगा’; यह पक्षपात न करने का मुहावरा है।
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐδήλωσας
  choice: प्रकट किया
  rationale: क्रिया δηλόω का सामान्य अर्थ ‘ज्ञात कराना’, ‘प्रकट करना’ या ‘स्पष्ट करना’ है। प्रसंग में यह कथन असामान्य लगता है, फिर भी उपलब्ध यूनानी पाठ को अनुमान के आधार पर ‘मिटा दिया’ में बदलने के बजाय उसके प्रत्यक्ष अर्थ को रखा गया है।
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: उनका स्मरण
  rationale: μνημόσυνον स्मरण, याद या स्मृति-चिह्न को सूचित कर सकता है। ‘उनका स्मरण’ व्यक्ति के बने रहने वाले यादगार उल्लेख और उसकी स्मृति—दोनों के लिए स्वाभाविक हिन्दी है।
- source_word: ἀπὸ τῆς γῆς
  choice: धरती से
  rationale: γῆ का अर्थ ‘धरती’ या ‘देश/भूमि’ हो सकता है। व्यापक अर्थ को मुख्य पाठ में रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: κριτὴς δίκαιος
  choice: धर्मी न्यायाधीश
  rationale: यह पद परमेश्वर के न्यायिक पद और नैतिक धार्मिकता, दोनों को व्यक्त करता है।
- source_word: οὐ θαυμάσει πρόσωπον
  choice: किसी का पक्ष नहीं करेगा
  rationale: शाब्दिक रूप ‘चेहरे की प्रशंसा नहीं करेगा’ है, पर यह व्यक्ति देखकर पक्षपात करने के लिए प्रयुक्त यूनानी मुहावरा है। अर्थपरक हिन्दी मुहावरे को स्पष्ट करती है।
theological_decisions:
- issue: असामान्य प्रथम वाक्यांश का अनुवाद
  choice: यूनानी क्रिया के प्रत्यक्ष अर्थ के अनुसार ‘उनका स्मरण प्रकट किया’
  alternative: ‘धरती से उनका स्मरण मिटा दिया’ या ‘उनकी स्मृति लुप्त कर दी’
  rationale: न्याय के प्रसंग में मिटा देने का अर्थ सहज लग सकता है, पर प्रमाणित यूनानी पाठ की क्रिया ‘प्रकट करना/ज्ञात कराना’ कहती है। पाठगत कठिनाई और अर्थगत तनाव को पादटिप्पणी सहित बनाए रखना, बिना पांडुलिपीय आधार के पाठ को सुधारने से बेहतर है।
- issue: न्याय में पक्षपात का निषेध
  choice: ‘किसी का पक्ष नहीं करेगा’
  alternative: ‘किसी के चेहरे की प्रशंसा नहीं करेगा’
  rationale: यहाँ चेहरे का उल्लेख शारीरिक रूप या प्रशंसा के विषय में सिद्धांत नहीं सिखाता, बल्कि न्यायाधीश द्वारा व्यक्ति देखकर पक्ष करने के मुहावरे के रूप में आता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठ-निकट शैली अपनाई गई है। ‘धरती’ सामान्य पाठक के लिए सहज है; ‘धर्मी न्यायाधीश’ धार्मिक और न्यायिक दोनों भाव बनाए रखता है। प्रथम पंक्ति की असामान्यता जानबूझकर पूरी तरह समतल नहीं की गई, क्योंकि वह उपलब्ध यूनानी पाठ में ही उपस्थित है।
