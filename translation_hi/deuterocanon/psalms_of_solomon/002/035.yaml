base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/035.yaml
  text: the one who raises me to glory and brings the proud to everlasting destruction in disgrace[d][c][b][a], because they did not know him.
translation:
  language: hi
  text: जो मुझे महिमा में उठाता है और घमंडियों को अपमान के साथ सदा के विनाश[a] की ओर ले जाता है, क्योंकि उन्होंने उसे नहीं जाना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनन्त विनाश’; अधिक शब्दशः, ‘युग का विनाश’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे नहीं पहचाना’ अथवा ‘उसे स्वीकार नहीं किया’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιστῶν
  choice: उठाता है
  rationale: यह क्रिया उठाने या खड़ा करने का मूल भाव रखती है; आगे का ‘महिमा में’ इसे उन्नत किए जाने का अर्थ देता है, इसलिए केवल ‘महिमामंडित करता है’ कहकर अर्थ को संकुचित नहीं किया गया।
- source_word: εἰς δόξαν
  choice: महिमा में
  rationale: εἰς लक्ष्य या परिणति सूचित करता है। हिन्दी में ‘महिमा में उठाता है’ उस परिणति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κομίζων
  choice: ले जाता है
  rationale: प्रदत्त और सत्यापित यूनानी पाठ में κομίζων है, जिसका यहाँ मूल अर्थ किसी को एक परिणति तक लाना या ले जाना है। इसलिए किसी भिन्न पाठ κοιμίζων पर आधारित ‘सुला देता है’ नहीं अपनाया गया।
- source_word: ὑπερηφάνους
  choice: घमंडियों
  rationale: यह विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और अभिमानी लोगों को दर्शाता है; ‘घमंडियों’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ἀπωλίαν αἰῶνος
  choice: सदा के विनाश
  rationale: संदर्भ में αἰῶνος विनाश की स्थायी या अनन्त प्रकृति व्यक्त कर सकता है। अधिक शब्दशः ‘युग का विनाश’ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν ἀτιμίᾳ
  choice: अपमान के साथ
  rationale: यह पदबंध अनादर, बेइज्जती या कलंक की दशा/परिस्थिति बताता है। ‘अपमान के साथ’ हिन्दी में स्वाभाविक रहते हुए उस भाव को बनाए रखता है।
- source_word: ἔγνωσαν
  choice: नहीं जाना
  rationale: γινώσκω का व्यापक अर्थ जानना है, जिसमें पहचानना या स्वीकार करना भी निहित हो सकता है; ‘नहीं जाना’ मूल की अर्थगत व्यापकता बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी participial construction को हिन्दी के सम्बद्ध उपवाक्य ‘जो…’ द्वारा व्यक्त किया गया है। सर्वनाम ‘उसे’ को स्पष्ट संज्ञा से नहीं बदला गया, ताकि मूल पाठ का संदर्भगत खुलापन बना रहे।
