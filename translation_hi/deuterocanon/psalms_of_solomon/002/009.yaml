lexical_decisions:
- source_word: πονηρὰ
  choice: बुराई
  rationale: यह व्यापक नैतिक अर्थ को संक्षिप्त और गंभीर रूप में बनाए रखता है; इससे किसी खास प्रकार के पाप या अपराध को अनावश्यक रूप से सीमित नहीं किया जाता।
- source_word: ἐποίησαν
  choice: की
  rationale: ποιέω के सामान्य अर्थ को स्वाभाविक हिन्दी वाक्यांश ‘बुराई की’ में सरलता से व्यक्त करता है।
- source_word: εἰς ἅπαξ
  choice: मिलकर
  rationale: निकटवर्ती संदर्भ में यह पद समूह के सामूहिक रूप से कार्य करने का भाव दे सकता है। फिर भी यूनानी में ‘एक ही बार में/एक बार सदा के लिए’ अथवा अधिक ढीले अर्थ में ‘पूरी तरह’ की संभावना है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῦ μὴ ἀκοῦσαι
  choice: सुनना नहीं चाहा
  rationale: नकारात्मक भाव वाले क्रियार्थक संज्ञा-रूप को स्वाभाविक हिन्दी में व्यक्त करते हुए जानबूझकर न सुनने की संभावित मुद्रा बनाए रखता है; उद्देश्य या परिणामसूचक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
