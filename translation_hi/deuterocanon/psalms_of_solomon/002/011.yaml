    reason: scope_ambiguity
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके कारणात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ ἐποίησεν πᾶς ἄνθρωπος
  choice: किसी भी मनुष्य ने ... नहीं किया
  rationale: संदर्भ में निषेध का स्वाभाविक अर्थ सार्वभौमिक नकार है—धरती पर किसी मनुष्य ने वैसा नहीं किया। ‘मनुष्य’ यूनानी के एकवचन मानव-संज्ञक रूप को बनाए रखता है।
- source_word: ἐπ' αὐτῆς
  choice: धरती पर
  rationale: स्त्रीलिंग सर्वनाम αὐτῆς पिछले पद की ἡ γῆ (‘धरती’) की ओर संकेत करता है। स्पष्ट हिन्दी के लिए सर्वनाम के स्थान पर उसका संदर्भ दोहराया गया है; इसका अर्थ यरूशलेम के ‘विरुद्ध’ नहीं है।
- source_word: ὅσα ἐποίησαν
  choice: वह सब ... जो उन्होंने किया
  rationale: ὅσα उनके किए हुए कार्यों की समग्रता और तुलना दोनों व्यक्त करता है; ‘वह सब जो उन्होंने किया’ सहज हिन्दी में इसे बनाए रखता है।
