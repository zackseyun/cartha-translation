base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/020.yaml
  text: For the nations insulted Jerusalem in her trampling[c][b][a]; they pulled her splendor down from the throne of glory.
translation:
  language: hi
  text: क्योंकि जब यरूशलेम पैरों तले रौंदी जा रही थी, तब जातियों ने उसका अपमान किया[a]; उन्होंने उसकी शोभा[b] को महिमा के सिंहासन से नीचे खींच लिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ यहाँ कठिन है। इसे इस अर्थ में भी समझा गया है: “क्योंकि जातियों ने यरूशलेम को पैरों तले रौंदा हुआ देखा।”'
    reason: textual_and_lexical_alternative
  - marker: b
    text: या “उसकी सुन्दरता।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “महिमा के सिंहासन से”; इसका अर्थ “महिमामय सिंहासन से” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνείδισαν
  choice: अपमान किया
  rationale: यह पाठ-रूप कठिन है और संभवतः ὠνείδισαν/संबंधित ‘धिक्कारना, ताना देना, अपमान करना’ अर्थ वाले पाठ को दर्शाता है। प्रसंग में ‘अपमान किया’ स्वाभाविक है और उपहासपूर्ण व्यवहार को व्यक्त करता है; पाठगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν καταπατήσει
  choice: जब ... पैरों तले रौंदी जा रही थी
  rationale: मूल संज्ञात्मक पद ‘रौंदे जाने/पददलित होने’ की अवस्था बताता है। हिन्दी में कालवाचक उपवाक्य उस दृश्य को स्पष्ट और स्वाभाविक ढंग से रखता है, बिना यह तय किए कि जातियों ने स्वयं उसे रौंदा था।
- source_word: κατέσπασεν
  choice: नीचे खींच लिया
  rationale: क्रिया बलपूर्वक नीचे की ओर खींचने का ठोस बिंब रखती है। नपुंसकलिंग बहुवचन कर्ता के साथ यूनानी में एकवचन क्रिया संभव है; हिन्दी में ‘उन्होंने’ स्वाभाविक बहुवचन अन्वय है।
- source_word: τὸ κάλλος αὐτῆς
  choice: उसकी शोभा
  rationale: κάλλος सौन्दर्य के साथ प्रकट वैभव और गरिमा भी व्यक्त कर सकता है। ‘शोभा’ हिन्दी में दोनों पहलुओं को संक्षेप में समेटती है।
- source_word: ἀπὸ θρόνου δόξης
  choice: महिमा के सिंहासन से
  rationale: संबंधकारक संरचना को निकटता से रखा गया है। इससे ‘महिमा के सिंहासन’ और ‘महिमामय सिंहासन’ के बीच मूल की संभावित अर्थ-छाया बनी रहती है।
