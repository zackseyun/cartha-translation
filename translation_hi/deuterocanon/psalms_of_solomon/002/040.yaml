base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/040.yaml
  text: For the Lord is kind to those who call on him with endurance[a], to act according to his mercy toward his holy ones[c][b], to stand continually before him in strength.
translation:
  language: hi
  text: क्योंकि प्रभु उन लोगों पर कृपालु है जो धीरज[a] के साथ उसे पुकारते हैं—अपनी दया के अनुसार अपने भक्त जनों[b] के प्रति कार्य करने और निरंतर उसके सामने सामर्थ्य में खड़े रहने के लिए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दृढ़ता’ अथवा ‘धैर्यपूर्वक’।
    reason: lexical_alternative
  - marker: b
    text: या ‘निष्ठावान जन’ अथवा ‘धर्मनिष्ठ जन’; अधिक शब्दशः, ‘उसके पवित्र जन’।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी में ये दोनों क्रियार्थक रूप संक्षिप्त हैं: अधिक शब्दशः, ‘अपनी दया के अनुसार अपने भक्त जनों के प्रति कार्य करने और निरंतर उसके सामने सामर्थ्य में खड़े रहने के लिए।’ क्रियाओं के आपसी संबंध और अंतिम क्रिया का कर्ता कुछ अस्पष्ट है।'
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: χρηστὸς
  choice: कृपालु
  rationale: यहाँ शब्द का अर्थ केवल सामान्य रूप से ‘भला’ नहीं, बल्कि लोगों के प्रति भलाई और कृपा दिखाने वाला है; ‘कृपालु’ इस संबंधपरक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπικαλουμένοις
  choice: जो ... उसे पुकारते हैं
  rationale: यह परमेश्वर को प्रार्थना या सहायता के लिए पुकारने का भाव रखता है। ‘पुकारते हैं’ आधुनिक हिन्दी में सहज है और धार्मिक संदर्भ भी बनाए रखता है।
- source_word: ἐν ὑπομονῇ
  choice: धीरज के साथ
  rationale: ὑπομονή दबाव या कठिनाई में टिके रहने वाले धैर्य को सूचित कर सकता है। ‘धीरज’ सरल और स्वाभाविक है; ‘दृढ़ता’ को पादटिप्पणी में रखा गया है।
- source_word: ποιῆσαι κατὰ τὸ ἔλεος αὐτοῦ
  choice: वह ... अपनी दया के अनुसार व्यवहार करता है
  rationale: यूनानी का क्रियार्थक रूप संक्षिप्त है। हिन्दी में सीमित क्रिया का प्रयोग अर्थ को स्पष्ट और सहज बनाता है, जबकि ‘अपनी दया के अनुसार’ मूल संरचना को बनाए रखता है।
- source_word: τοῖς ὁσίοις αὐτοῦ
  choice: अपने भक्त जनों
  rationale: ὅσιοι यहाँ धर्मनिष्ठ, भक्त या परमेश्वर के प्रति निष्ठावान लोगों को सूचित करता है। ‘भक्त जन’ ἅγιοι के सामान्य ‘पवित्र जन’ से अनावश्यक समानता से बचते हुए इस धार्मिक और सामुदायिक भाव को व्यक्त करता है।
- source_word: παρεστᾶναι διὰ παντὸς ἐνώπιον αὐτοῦ
  choice: निरंतर उसके सामने ... खड़े रहें
  rationale: ‘खड़े रहें’ स्थापित उपस्थिति की मूल छवि बनाए रखता है और διὰ παντός को ‘निरंतर’ के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ἰσχύι
  choice: सामर्थ्य के साथ
  rationale: यह मूल के सामर्थ्य या शक्ति के भाव को बनाए रखता है और उसके स्रोत को, जैसे यूनानी पाठ में, अनिर्दिष्ट छोड़ता है।
theological_decisions:
- issue: ‘प्रभु कृपालु है’ के बाद आए दो क्रियार्थक रूपों का संबंध और कर्ता
  choice: पहले क्रियार्थक रूप को प्रभु के दयापूर्ण व्यवहार के रूप में और दूसरे को उसके भक्त जनों के परिणामी रूप से खड़े रहने के रूप में व्यक्त किया गया है।
  alternative: अधिक शब्दशः रूप में दोनों को ‘करने के लिए ... खड़े रहने के लिए’ रखा जा सकता है; अंतिम क्रिया को प्रभु की उपस्थिति से जोड़ने की संभावना भी व्याकरणतः विचारणीय है।
  rationale: यूनानी वाक्य अत्यंत संक्षिप्त और कुछ हद तक अस्पष्ट है। चुना हुआ रूप संदर्भ में सबसे स्वाभाविक अर्थ देता है, पर वैकल्पिक संरचना को पादटिप्पणी में दर्ज करके अस्पष्टता को छिपाया नहीं गया।
- issue: ὅσιοι की सामुदायिक और धार्मिक पहचान
  choice: ‘भक्त जन’
  alternative: ‘निष्ठावान जन’, ‘धर्मनिष्ठ जन’ या अधिक परंपरागत ‘पवित्र जन’
  rationale: ‘भक्त जन’ पवित्रता की अमूर्त अवस्था की अपेक्षा परमेश्वर के प्रति धर्मनिष्ठ भक्ति और निष्ठा पर बल देता है, बिना किसी विशिष्ट संप्रदाय की पहचान आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, भक्तिपूर्ण और गरिमामय शैली रखी गई है। कठिन यूनानी क्रियार्थक संरचना को मुख्य पाठ में सहज हिन्दी वाक्यों में खोला गया है, जबकि उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
