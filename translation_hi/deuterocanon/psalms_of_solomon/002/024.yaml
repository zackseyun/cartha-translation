  text: And I saw[a], and I entreated the face of the Lord and said, “Enough, Lord[d][c][b], of your hand weighing heavily on Israel by the attack of the nations.”
translation:
  language: hi
  text: और मैंने देखा, तब प्रभु के सम्मुख विनती की[a] और कहा, “हे प्रभु, अब इस्राएल पर अपने हाथों के भारी पड़ने को पर्याप्त मानिए—जातियों के आक्रमण के द्वारा।”[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘प्रभु के मुख के सम्मुख विनती की।’ यह सामी शैली की अभिव्यक्ति प्रभु की उपस्थिति में जाकर उसका अनुग्रह चाहने का संकेत दे सकती है।
    reason: literal_idiom
  - marker: b
    text: या, ‘बस कीजिए, प्रभु!’ अथवा ‘इतना ही पर्याप्त हो, प्रभु!’ यूनानी आज्ञार्थक Ἱκάνωσον पर्याप्त हो जाने या अब रुक जाने की पुकार है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘जातियों को चढ़ा लाने के द्वारा’ अथवा ‘जातियों के आक्रमण के समय।’ ἐπαγωγή किसी को ले आने और आक्रमण, दोनों का बोध करा सकता है।
    reason: alternative_reading
  - marker: d
    text: शाब्दिक रूप से, ‘आपके हाथों का इस्राएल पर भारी होना।’ यह दैवी दबाव या न्याय का प्रचलित बाइबलीय चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐδεήθην τοῦ προσώπου Κυρίου
  choice: प्रभु के सम्मुख विनती की
  rationale: δέομαι गंभीर और उत्कट प्रार्थना या याचना को व्यक्त करता है। τοῦ προσώπου Κυρίου सामी शैली की अभिव्यक्ति है, जिसका शाब्दिक अर्थ ‘प्रभु के मुख’ से जुड़ा है; ‘प्रभु के सम्मुख’ आधुनिक हिन्दी में उसकी उपस्थिति और अनुग्रह की ओर उन्मुख विनती का भाव स्वाभाविक रूप से रखता है।
- source_word: Ἱκάνωσον
  choice: बस कीजिए … अब बहुत हुआ
  rationale: आज्ञार्थक क्रिया पर्याप्तता या किसी कार्य के रुकने की विनती करती है। दो-खंडीय हिन्दी वाक्य मूल की तीव्र पुकार और उसके बाद आने वाले संबंधसूचक क्रियार्थक पदबंध, दोनों को स्पष्ट रखता है।
- source_word: τοῦ βαρύνεσθαι χεῖράς σου ἐπʼ Ἰσραήλ
  choice: अपने हाथों को इस्राएल पर भारी किए रखना
  rationale: यूनानी χεῖράς बहुवचन है, इसलिए ‘हाथों’ रखा गया है। ‘भारी किए रखना’ दण्ड या दबाव के बाइबलीय रूपक को बिना उसकी व्याख्या किए सुरक्षित रखता है।
- source_word: ἐν ἐπαγωγῇ ἐθνῶν
  choice: जातियों के आक्रमण के द्वारा
  rationale: ἐπαγωγή किसी चीज़ को ले आने अथवा आक्रमण, दोनों का संकेत दे सकता है। प्रसंग में ‘आक्रमण’ स्वाभाविक है, जबकि ‘के द्वारा’ इस्राएल पर पड़े दबाव के साधन के रूप में जातियों की भूमिका को रखता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह इस्राएल के परमेश्वर को सीधे सम्बोधित करने वाला पद है; ‘प्रभु’ मानक, श्रद्धापूर्ण और सिद्धान्ततः अनावश्यक रूप से विशिष्ट न होने वाला अनुवाद है।
theological_decisions:
- issue: परमेश्वर के दण्ड और जातियों के आक्रमण के बीच सम्बन्ध
  choice: जातियों के आक्रमण को उस माध्यम के रूप में रखा गया है जिसके द्वारा प्रभु के हाथ इस्राएल पर भारी हैं
  alternative: जातियों के आक्रमण और प्रभु के भारी हाथ को दो अलग घटनाएँ समझना
  rationale: ἐν का साधनवाचक प्रयोग सम्भव और प्रसंगानुकूल है, पर अनुवाद यह निर्धारित नहीं करता कि आक्रमणकारी जातियों की नैतिक जिम्मेदारी इससे समाप्त हो जाती है।
- issue: κύριος का सीधा सम्बोधन
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रार्थना इस्राएल के परमेश्वर से है। ‘प्रभु’ पारम्परिक बाइबलीय सम्बोधन और मूल की श्रद्धा को रखता है, जबकि ‘स्वामी’ यहाँ अनावश्यक रूप से मालिक-दास सम्बन्ध पर बल दे सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। ‘बस कीजिए’ वक्ता की तात्कालिक व्यथा को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अब बहुत हुआ’ मूल के पर्याप्तता-वाचक निर्माण को स्पष्ट करता है। ‘हाथों’ में यूनानी बहुवचन सुरक्षित है।
