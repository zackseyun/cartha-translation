  yaml_path: translation/deuterocanon/psalms_of_solomon/002/006.yaml
  text: Sons and daughters were in evil captivity[a], their necks in a seal[b], with a mark among the nations.
translation:
  language: hi
  text: पुत्र और पुत्रियाँ कठोर बंदीपन में थे; उनकी गर्दनों पर मुहर का निशान था[a], और वे राष्ट्रों के बीच चिह्नित थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी गर्दन मुहर में थी।” यूनानी अभिव्यक्ति संक्षिप्त है; यह गर्दन पर लगी मुहर, छाप, या स्वामित्व के चिह्न का बिंब हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: “चिह्नित” का अर्थ यहाँ अलग पहचाने जाने वाला या सबके सामने निशान लगा हुआ भी हो सकता है। प्रसंग में “दागा हुआ” सम्भव है, पर निश्चित नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ καὶ θυγατέρες
  choice: बेटे और बेटियाँ
  rationale: यूनानी के स्पष्ट स्त्री-पुरुष युग्म को बनाए रखता है; केवल “संतान” कहना इस विशेषता को मिटा देता।
- source_word: ἐν αἰχμαλωσίᾳ πονηρᾷ
  choice: घोर बंधुआई में
  rationale: αἰχμαλωσία बंदी बनाए जाने की दशा है, और πονηρά यहाँ उसकी कठोर, कष्टदायक प्रकृति बताता है। “घोर बंधुआई” स्वाभाविक हिन्दी में उसकी तीव्रता बनाए रखता है, बिना उसे केवल नैतिक अर्थ में “दुष्ट” ठहराए।
- source_word: ἐν σφραγῖδι
  choice: मुहर पर
  rationale: σφραγίς मुहर, छाप या मुहर के निशान को सूचित कर सकता है। यूनानी का संक्षिप्त “मुहर में” हिन्दी में अस्वाभाविक है; “गर्दन पर मुहर” सम्भावित शारीरिक चिह्न का बिंब बनाए रखता है।
- source_word: ὁ τράχηλος αὐτῶν
  choice: उनकी गर्दन
  rationale: यूनानी में सामूहिक एकवचन है। हिन्दी में भी “उनकी गर्दन” सामूहिक रूप से स्वाभाविक है और स्रोत के वचन के निकट रहता है।
- source_word: ἐν ἐπισήμῳ
  choice: वे चिह्नित थे
  rationale: ἐπίσημος का अर्थ चिह्न लगा हुआ, अलग पहचाना जाने वाला या विशिष्ट/प्रकट हो सकता है। बंदीपन और मुहर के प्रसंग में “चिह्नित” मूल बिंब को रखता है, जबकि “दागे हुए” अनावश्यक रूप से अधिक निश्चित होगा।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: राष्ट्रों के बीच
  rationale: ἔθνη का सीधा और प्रसंगानुकूल अनुवाद “राष्ट्र” है; यहाँ “अन्यजातियों” से अनावश्यक धार्मिक विशिष्टता जुड़ सकती है।
theological_decisions:
- issue: गर्दन की मुहर और सार्वजनिक चिह्न का संबंध
  choice: दोनों बिंबों को निकट रखा गया, पर उन्हें दास-दाग के रूप में निर्णायक ढंग से नहीं समझाया गया।
  alternative: “उनकी गर्दनों पर दासों का दाग लगाया गया था”
  rationale: यूनानी भाषा संक्षिप्त और कुछ हद तक अस्पष्ट है। प्रसंग सार्वजनिक अपमान या दास-जैसे चिह्न की ओर संकेत कर सकता है, पर मूल पाठ स्पष्ट रूप से “दासों का दाग” नहीं कहता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। “घोर बंधुआई” काव्यात्मक तीव्रता रखता है; अर्धविराम यूनानी की संकुचित छवियों को अलग करते हुए उनका संबंध बनाए रखता है।
