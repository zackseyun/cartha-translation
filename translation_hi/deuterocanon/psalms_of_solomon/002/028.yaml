lexical_decisions:
- source_word: ἐκχέαι
  choice: उंडेलने के लिए
  rationale: यह यूनानी क्रिया के ‘उंडेलने’ वाले सजीव रूपक को बनाए रखता है और प्रसंग से जुड़ी क्रियारूप संरचना को भी दर्शाता है।
- source_word: τὴν ὀργὴν αὐτῶν
  choice: अपना क्रोध
  rationale: ‘क्रोध’ ὀργή की प्रबलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘अपना’ का कर्ता वही आक्रमणकारी लोग हैं।
- source_word: εἰς ἡμᾶς
  choice: हम पर
  rationale: दिशा और लक्ष्य दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἁρπάγματι
  choice: लूटपाट करते हुए
  rationale: ἅρπαγμα से जुड़े हिंसक छीनने और उजाड़ने के भाव को स्पष्ट करता है, जबकि पादटिप्पणी यूनानी पदबंध की संक्षिप्तता और वैकल्पिक संबंध को सुरक्षित रखती है।
- source_word: μὴ χρονίσῃς
  choice: देर न कर
  rationale: प्रार्थना में शीघ्र कार्रवाई की याचना को सहज और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: ἀποδοῦναι αὐτοῖς εἰς κεφαλάς
  choice: उन्हें उसका बदला उन्हीं के सिर पर चुकाने
  rationale: प्रतिफल के अपराधियों पर ही लौट पड़ने वाले यूनानी मुहावरे को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: प्रतिशोध का मुहावरा
  choice: इसे परमेश्वर से अपराधियों के किए का बदला उन्हीं पर लौटाने की प्रार्थना के रूप में अनूदित किया गया है।
  alternative: 'अधिक शब्दशः रूप: ‘उन्हें सिरों पर लौटा देने’।'
  rationale: यूनानी मुहावरा प्रत्यावर्ती न्याय का भाव देता है। हिन्दी में ‘उन्हीं के सिर पर’ यह अर्थ स्पष्ट करता है, पर न्याय की तीव्रता को नरम नहीं करता।
- issue: ἐν ἁρπάγματι का संबंध
  choice: इसे क्रोध उंडेलने की परिस्थिति—‘लूटपाट करते हुए’—के रूप में लिया गया है।
  alternative: ‘लूटपाट के साथ’ या अधिक संक्षिप्त ‘लूट में’।
  rationale: यूनानी पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है; मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी वैकल्पिक संबंध को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थना का संबोधन गरिमापूर्ण किंतु सहज रखा गया है। पद मूल पाठ की तरह वाक्यखंड से आरम्भ और अल्पविराम पर समाप्त होता है, ताकि आस-पास के पदों से उसका संबंध न टूटे।
