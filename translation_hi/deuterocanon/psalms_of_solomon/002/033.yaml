base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/033.yaml
  text: He said[a], "I will be lord of land and sea," and he did not know that God is great[b], mighty in his great strength.
translation:
  language: hi
  text: उसने कहा, “मैं भूमि[a] और समुद्र का स्वामी बनूँगा,” और वह नहीं जानता था कि परमेश्वर महान है और अपनी महान शक्ति[b] में पराक्रमी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धरती।”
    reason: γῆ can mean “land” or “earth”; “भूमि” best suits the land-and-sea contrast in the main text.
  - marker: b
    text: या, “अपने महान सामर्थ्य में।”
    reason: ἰσχύς may be rendered “strength,” “power,” or “might”; “शक्ति” is used in the main text for natural modern Hindi.
lexical_decisions:
- source_word: κύριος
  choice: स्वामी
  rationale: यहाँ यह शब्द मनुष्य के प्रभुत्वपूर्ण दावे के लिए है, ईश्वरीय उपाधि के रूप में नहीं। “स्वामी” दावे की व्यापकता और ऊँची काव्यात्मक शैली, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γῆς
  choice: धरती
  rationale: γῆ भूमि या पृथ्वी दोनों को सूचित कर सकता है। “धरती और समुद्र” हिन्दी में स्वाभाविक युग्म है और यहाँ समस्त स्थलीय तथा समुद्री क्षेत्र पर प्रभुत्व के दावे को व्यक्त करता है।
- source_word: οὐκ ἔγνω
  choice: नहीं जानता था
  rationale: यह यूनानी कथन का सीधा अनुवाद है और वक्ता की अज्ञानता में निहित विडंबना को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: κραταιὸς
  choice: पराक्रमी
  rationale: यह परमेश्वर की सामर्थ्य का गरिमापूर्ण और प्रबल वर्णन है तथा भजनात्मक शैली के अनुकूल है।
- source_word: ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ
  choice: अपने महान सामर्थ्य में
  rationale: यह परमेश्वर की अपनी महान शक्ति पर यूनानी बलाघात को बनाए रखता है। “सामर्थ्य” ἰσχύς के अर्थ को प्राकृतिक, गरिमामय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὁ θεὸς को उपाधिसूचक स्वीकारोक्ति माना जाए या परमेश्वर के विषय में साधारण कथन
  choice: कि परमेश्वर महान है—अपने महान सामर्थ्य में पराक्रमी
  alternative: कि परमेश्वर ही महान और पराक्रमी जन है
  rationale: यूनानी पाठ वक्ता के दंभ के विपरीत परमेश्वर की महानता और सामर्थ्य का सीधा कथन करता है। उपाधिसूचक रूप अनावश्यक अतिरिक्त बल जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट शैली। अर्धविराम वक्ता के दावे और उसके अज्ञान के बीच विरोध को दिखाता है; दीर्घ विराम-चिह्न परमेश्वर की महानता का स्पष्टीकरण प्रस्तुत करता है।
