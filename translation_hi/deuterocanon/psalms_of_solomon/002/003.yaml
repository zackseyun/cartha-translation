  text: because the sons of Jerusalem defiled the holy things of the Lord; they profaned the offerings of God with their lawless acts.
translation:
  language: hi
  text: क्योंकि यरूशलेम के पुत्रों[a] ने प्रभु की पवित्र वस्तुओं को दूषित किया; उन्होंने अपने अधर्म के कामों से परमेश्वर को चढ़ाई गई भेंटों[b] को अपवित्र किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यरूशलेम की सन्तानें।’ यूनानी में शाब्दिक रूप से ‘पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का सामान्य अर्थ ‘भेंटें’ या ‘उपहार’ है। मन्दिर के इस संदर्भ में यह विशेष रूप से परमेश्वर को अर्पित पवित्र भेंटों को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀνθ' ὧν
  choice: क्योंकि
  rationale: संदर्भ में यह पद पिछले कथन में बताए गए न्याय का कारण प्रस्तुत करता है; ‘क्योंकि’ इस कारणसूचक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οἱ υἱοὶ Ἱερουσαλήμ
  choice: यरूशलेम के पुत्रों
  rationale: यूनानी पाठ में ‘पुत्र’ का स्पष्ट पुल्लिंग बहुवचन है। मुख्य पाठ में उसका रूप बनाए रखा गया है, जबकि सम्भव सामूहिक अर्थ को पादटिप्पणी में बताया गया है।
- source_word: ἐμίαναν
  choice: अशुद्ध किया
  rationale: यह क्रिया पवित्र वस्तुओं को धार्मिक रीति से दूषित या अपवित्र करने का भाव रखती है; ‘अशुद्ध किया’ इस अर्थ को सरल और स्पष्ट रूप में व्यक्त करता है।
- source_word: τὰ ἅγια Κυρίου
  choice: प्रभु की पवित्र वस्तुओं
  rationale: नपुंसकलिंग बहुवचन किसी एक पवित्रस्थान की अपेक्षा पवित्र वस्तुओं के व्यापक अर्थ की ओर संकेत करता है।
- source_word: ἐβεβήλωσαν
  choice: अपवित्र किया
  rationale: यह क्रिया पवित्र वस्तु के साथ साधारण या धर्मविरुद्ध व्यवहार करने को दर्शाती है; ‘अपवित्र किया’ धार्मिक संदर्भ में स्वाभाविक है।
- source_word: τὰ δῶρα τοῦ θεοῦ
  choice: परमेश्वर की भेंटों
  rationale: ‘भेंट’ δῶρα का सीधा अर्थ रखता है और मन्दिर-संदर्भ में परमेश्वर को अर्पित पवित्र चढ़ावों को भी व्यक्त कर सकता है। ‘परमेश्वर की’ मूल संबंधकारक की सम्भव अर्थगत व्यापकता को बनाए रखता है।
- source_word: ἐν ἀνομίαις
  choice: अपने अधर्म के कामों से
  rationale: यह रूप यहाँ साधन या साथ-साथ होने वाले आचरण को सूचित करता है। ‘अधर्म के कामों से’ बहुवचन और ठोस दुष्कर्मों का भाव स्पष्ट करता है।
theological_decisions:
- issue: τὰ δῶρα τοῦ θεοῦ में संबंधकारक का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर की भेंटों’ रखकर संबंध को खुला रखा गया
  alternative: ‘परमेश्वर को चढ़ाई गई भेंटों’
  rationale: मन्दिर-संदर्भ में परमेश्वर को अर्पित भेंटें सम्भवतः अभिप्रेत हैं, पर यूनानी संबंधकारक स्वयं दिशा को पूरी तरह स्पष्ट नहीं करता। इसलिए मुख्य पाठ मूल की संक्षिप्तता और अस्पष्टता बनाए रखता है तथा पादटिप्पणी संदर्भगत अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पवित्र वस्तुएँ’, ‘अशुद्ध’ और ‘अपवित्र’ जैसे शब्द मूल के धार्मिक-सांस्कृतिक भेदों को बनाए रखते हैं; अर्धविराम दोनों समानान्तर आरोपों को जोड़ता है।
