lexical_decisions:
- source_word: σῶμα
  choice: शरीर
  rationale: यह सामान्य यूनानी शब्द का सीधा और स्वाभाविक हिन्दी रूप है। प्रसंग से मृत्यु स्पष्ट है, इसलिए ‘लाश’ जोड़कर अर्थ को अधिक स्पष्ट नहीं किया गया।
- source_word: διαφερόμενον
  choice: बहता फिर रहा था
  rationale: मध्य/कर्मवाच्य कृदंत बाहरी शक्ति से इधर-उधर ले जाए जाने का भाव देता है। ‘बहता फिर रहा था’ लहरों के अधीन गति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे स्वेच्छापूर्ण ‘तैरना’ बनाए।
- source_word: ἐπὶ κυμάτων
  choice: लहरों पर
  rationale: यह शरीर की गति का स्थान सीधे और मुहावरेदार ढंग से बताता है।
- source_word: ἐν ὕβρει πολλῇ
  choice: घोर अपमानजनक दशा में
  rationale: ὕβρις में अपमान, दुर्व्यवहार और उद्दंड अत्याचार के परस्पर जुड़े भाव हो सकते हैं। यहाँ यह अनादरपूर्ण दशा को व्यक्त करता है; अनुवाद मूल की तीव्रता बनाए रखता है, जबकि पादटिप्पणी अन्य संभावनाएँ सुरक्षित रखती है।
- source_word: οὐκ ἦν ὁ θάπτων
  choice: उसे दफ़नाने वाला कोई न था
  rationale: यह यूनानी वाक्य-विन्यास किसी दफ़नाने वाले व्यक्ति के न होने को व्यक्त करता है। हिन्दी रूप स्पष्ट, संक्षिप्त और करुण भाव के अनुरूप है।
