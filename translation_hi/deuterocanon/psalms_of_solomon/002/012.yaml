lexical_decisions:
- source_word: γνώσεται
  choice: जान लेगी
  rationale: भविष्यकालीन क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और भावी पहचान या बोध की संभावना को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: γῆ का अर्थ भूमि भी हो सकता है, पर यहाँ परमेश्वर के सभी न्यायों का व्यापक संदर्भ सार्वभौमिक अर्थ ‘पृथ्वी’ के पक्ष में है।
- source_word: τὰ κρίματά σου
  choice: तेरे ... न्यायों
  rationale: κρίματα के न्यायिक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: πάντα
  choice: सभी
  rationale: यह संपूर्ण कर्म-वाक्यांश को विशेषित करता है और परमेश्वर के न्यायों की समग्रता व्यक्त करता है।
- source_word: τὰ δίκαια
  choice: धर्ममय
  rationale: δίκαια में निहित नैतिक शुद्धता और न्याय-संगतता को दर्शाता है; ‘न्यायपूर्ण’ भी संभव विकल्प है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: लेखयुक्त कर्तृकारक यहाँ संबोधन के रूप में प्रयुक्त है; ‘हे परमेश्वर’ प्रार्थनापूर्ण प्रत्यक्ष संबोधन को स्पष्ट करता है।
