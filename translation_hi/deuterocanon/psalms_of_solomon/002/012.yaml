review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the future verb, the universal sense of ἡ γῆ as “पृथ्वी,” the totality expressed by πάντα, and the final vocative “हे परमेश्वर.” The phrase τὰ κρίματά σου πάντα τὰ δίκαια is more naturally rendered in Hindi with “निर्णयों” than with the repetitive collocation “धर्ममय न्यायों.”
  naturalness: “धर्ममय न्यायों” is understandable but is not idiomatic modern standard Hindi in this judicial context. “न्यायोचित निर्णयों” is clear, dignified, and preserves both the judicial and moral dimensions without awkward repetition.
  terminology: “न्यायोचित निर्णय” suitably renders “righteous/just judgments.” The footnote supplies the viable lexical alternative “न्यायपूर्ण निर्णय.” “परमेश्वर” and the intimate singular possessive “तेरे” fit the prayerful register.
  issues:
  - severity: low
    issue: The main phrase “धर्ममय न्यायों” is stylistically awkward in modern Hindi.
    rationale: Hindi does not commonly qualify judicial “न्यायों” with “धर्ममय”; “न्यायोचित निर्णयों” more naturally conveys just/righteous judicial decisions.
  - severity: medium
    issue: The footnote phrase “न्यायपूर्ण न्यायों” is tautological and unnatural.
    rationale: Although it attempts to reflect “just judgments,” “न्यायपूर्ण न्याय” repeats closely related judicial concepts in Hindi. Recasting the head noun as “निर्णयों” preserves the lexical alternative naturally.
  revised_text: और पृथ्वी तेरे सभी न्यायोचित निर्णयों को जान लेगी, हे परमेश्वर।
