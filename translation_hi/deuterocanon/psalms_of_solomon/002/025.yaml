lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पहले कथन का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: ἐνέπαιξαν
  choice: उपहास किया
  rationale: यह क्रिया तिरस्कारपूर्ण हँसी या अपमानजनक व्यवहार व्यक्त करती है; ‘उपहास किया’ संक्षिप्त, गरिमापूर्ण और वर्तमान मानक हिन्दी में सहज है।
- source_word: οὐκ ἐφείσαντο
  choice: नहीं बख्शा
  rationale: φείδομαι किसी को हानि से बचाने, उस पर दया करने या रुक जाने का भाव रखता है। ‘नहीं बख्शा’ यूनानी की संक्षिप्तता और कठोरता बनाए रखता है तथा अनकहे कर्म को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἐν ὀργῇ
  choice: क्रोध में
  rationale: ὀργή के सामान्य अर्थ को सीधे व्यक्त करता है और यूनानी की भावात्मक क्रमवृद्धि बनाए रखता है।
- source_word: καὶ θυμῷ
  choice: और रोष में
  rationale: θυμός का अर्थ ὀργή से मिलता-जुलता होते हुए भी अधिक उग्र भाव दे सकता है; ‘रोष’ दोनों शब्दों को मिटाकर एक न करने के साथ अलंकारिक युग्म बनाए रखता है।
- source_word: μετὰ μηνίσεως
  choice: तीव्र आक्रोश के साथ
  rationale: μήνισις प्रबल अथवा मन में टिके हुए क्रोध/आक्रोश को सूचित कर सकता है। ‘तीव्र आक्रोश’ चरम भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी वैकल्पिक सूक्ष्मताओं को सुरक्षित रखती है।
