lexical_decisions:
- source_word: ἐξουδενώθη
  choice: तुच्छ समझा गया
  rationale: निष्क्रिय क्रिया का अर्थ किसी को कुछ न समझना या तिरस्कार की दृष्टि से देखना है। यह चयन यूनानी के अवमूल्यन और तिरस्कार—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह पदबंध परमेश्वर की उपस्थिति अथवा उनकी दृष्टि में होने का भाव देता है। ‘परमेश्वर के सामने’ सीधा और अर्थ-संगत है।
- source_word: ἠτιμώθη
  choice: अपमानित किया गया
  rationale: क्रिया सम्मान छीन लिए जाने और अनादर किए जाने को व्यक्त करती है; निष्क्रिय रूप मूल यूनानी के अनुरूप रखा गया है।
- source_word: ἕως εἰς τέλος
  choice: अंत तक
  rationale: यह यूनानी पदबंध का निकट अनुवाद है और समय की अंतिम सीमा तथा अपमान की चरम सीमा के बीच विद्यमान अर्थगत तनाव को बनाए रखता है।
theological_decisions:
- issue: अव्यक्त कर्ता की पहचान
  choice: दोनों वाक्यों में ‘उसे’ रखकर कर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘वह’ के साथ पुल्लिंग या स्त्रीलिंग क्रियारूप देकर कर्ता को वेदी, पवित्रस्थान या महिमा के सौंदर्य के रूप में स्पष्ट करना
  rationale: यूनानी पद में कर्ता व्यक्त नहीं है और उसका संकेत पिछले संदर्भ से ग्रहण किया जाता है। हिन्दी में ‘उसे ... किया गया’ उस वास्तविक संदर्भगत अस्पष्टता को बिना किसी व्यक्ति की ओर गलत संकेत किए सुरक्षित रखता है।
