  text: And now see[a], you nobles of the earth, the judgment of the Lord, that he is a great and righteous king[b], judging what is under heaven.
translation:
  language: hi
  text: और अब, हे पृथ्वी के प्रतिष्ठित जनो[a], प्रभु का न्याय देखो कि वह महान और धर्मी राजा है, जो आकाश के नीचे के जगत का न्याय करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़े लोग,” “कुलीन,” अथवा “शासक।”
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “आकाश के नीचे वाले [क्षेत्र] का न्याय करता है”; सम्भवतः “आकाश के नीचे की पृथ्वी” अथवा “आकाश के नीचे के संसार” का।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδετε
  choice: देखो
  rationale: बहुवचन आज्ञार्थक क्रिया श्रोताओं को प्रभु के न्याय पर ध्यान देने के लिए बुलाती है; “देखो” आधुनिक और सीधा है।
- source_word: μεγιστᾶνες
  choice: प्रतिष्ठित जनो
  rationale: यह शब्द ऊँचे पद और सामाजिक-राजनीतिक प्रभाव वाले लोगों को संबोधित करता है। “प्रतिष्ठित जनो” हिंदी में स्वाभाविक है और किसी विशिष्ट शासन-पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: κρίμα
  choice: न्याय
  rationale: यहाँ शब्द प्रभु के न्यायिक निर्णय और कार्य, दोनों का संकेत दे सकता है। “न्याय” इस अर्थ-व्याप्ति को “फैसला” की अपेक्षा बेहतर बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος को ईश्वरीय उपाधि के रूप में वर्तमान, गरिमापूर्ण हिंदी में “प्रभु” कहा गया है।
- source_word: μέγας βασιλεὺς καὶ δίκαιος
  choice: महान और धर्मी राजा
  rationale: दोनों विशेषण राजा का वर्णन करते हैं; यह रूप उसकी महिमा और नैतिक धार्मिकता, दोनों को सहज हिंदी में रखता है।
- source_word: κρίνων τὴν ὑπʼ οὐρανόν
  choice: जो आकाश के नीचे के जगत का न्याय करता है
  rationale: यूनानी वाक्यांश में संज्ञा लुप्त है और अर्थ आकाश के नीचे के क्षेत्र से है। “जगत” को स्पष्टता के लिए जोड़ा गया है, जबकि पादटिप्पणी मूल की संक्षिप्तता और वैकल्पिक पूर्ति बताती है।
theological_decisions:
- issue: ὅτι का संबंध और निहित कर्ता
  choice: वह महान और धर्मी राजा है
  alternative: क्योंकि वह महान और धर्मी राजा है
  rationale: ὅτι कथन की विषयवस्तु (“कि”) अथवा कारण (“क्योंकि”) बता सकता है। मुख्य पाठ पूर्ववर्ती “प्रभु” से निहित कर्ता को “वह” द्वारा स्पष्ट करता है, पर कारणार्थक संबंध को अनिवार्य नहीं बनाता।
- issue: आकाश के नीचे न्याय के क्षेत्र की पहचान
  choice: आकाश के नीचे का जगत
  alternative: आकाश के नीचे की पृथ्वी
  rationale: τὴν ὑπʼ οὐρανόν में संज्ञा स्पष्ट रूप से लिखी नहीं है। “जगत” व्यापक क्षेत्र को व्यक्त करता है; पादटिप्पणी “पृथ्वी” की सम्भावित पूर्ति को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सार्वजनिक संबोधन के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। “हे” संबोधन की औपचारिकता बनाए रखता है; “न्याय करता है” प्रभु की सक्रिय और सतत न्यायिक भूमिका व्यक्त करता है।
