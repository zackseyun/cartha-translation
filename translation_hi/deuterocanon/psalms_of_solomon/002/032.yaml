  yaml_path: translation/deuterocanon/psalms_of_solomon/002/032.yaml
  text: because he despised him with dishonor[a]; he did not consider that he was a man[b], and afterward he did not consider.
translation:
  language: hi
  text: क्योंकि उसने उसे अपमान के साथ तुच्छ जाना; उसने विचार नहीं किया कि वह मनुष्य है, और बाद में उसने विचार नहीं किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अंत में’; संभवतः ‘परिणाम’ या ‘इसके बाद जो हुआ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουδένωσεν
  choice: तुच्छ जाना
  rationale: क्रिया किसी को नगण्य समझने या उसका तिरस्कार करने का भाव रखती है। ‘तुच्छ जाना’ आधुनिक हिन्दी में स्वाभाविक है और इस बल को बनाए रखता है।
- source_word: ἐν ἀτιμίᾳ
  choice: अपमानित करके
  rationale: ἀτιμία अपमान या अनादर को व्यक्त करता है। क्रिया-विशेषणात्मक रूप में यह हिन्दी में उस अपमानजनक ढंग को स्पष्ट करता है जिसमें उसे तुच्छ जाना गया।
- source_word: ἐλογίσατο
  choice: विचार किया
  rationale: दोनों स्थानों पर यही अभिव्यक्ति रखकर मूल की पुनरावृत्ति और सोच-विचार अथवा ध्यान में रखने का भाव सुरक्षित रखा गया है।
- source_word: ἄνθρωπός
  choice: मनुष्य
  rationale: यह एकवचन मानवता, नश्वरता या मानवीय दुर्बलता की ओर संकेत कर सकता है; ‘मनुष्य’ सहज हिन्दी है और अनावश्यक लैंगिक संकीर्णता से बचता है।
- source_word: τὸ ὕστερον
  choice: बाद की बात
  rationale: यह पद ‘बाद में जो हुआ/होना था’, ‘अंत’ या ‘परिणाम’ का अर्थ दे सकता है। ‘बाद की बात’ मूल की अस्पष्टता को किसी एक अर्थ में सीमित नहीं करती।
theological_decisions:
- issue: ἐξουδένωσεν का अप्रकट कर्ता
  choice: ‘उसने’ रखा गया
  alternative: संदर्भ के आधार पर ‘परमेश्वर ने’ जोड़ना
  rationale: इस पद के यूनानी पाठ में कर्ता नाम से व्यक्त नहीं है। ‘परमेश्वर’ जोड़ने से सर्वनाम-संदर्भ स्पष्ट हो सकता था, पर वह व्याख्यात्मक पूर्ति होती; इसलिए मूल की संदर्भगत अस्पष्टता सुरक्षित रखी गई।
- issue: ἐλογίσατο के कर्ता का संदर्भ
  choice: सर्वनाम ‘उसने’ रखा गया
  alternative: व्यक्ति का नाम या पहचान स्पष्ट करना
  rationale: यूनानी पाठ केवल क्रियारूप से कर्ता बताता है और इस पद में उसका नाम नहीं देता। अनुवाद में कोई विशिष्ट पहचान आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की दोहराई गई ‘विचार नहीं किया’ संरचना को सुरक्षित रखा गया है। मुख्य पाठ में केवल वास्तविक अर्थगत अस्पष्टता पर पाद-टिप्पणी दी गई है।
