  text: Bless God[a], you who fear the Lord with understanding, because the mercy of the Lord is upon those who fear him[b], with judgment.
translation:
  language: hi
  text: हे समझ-बूझ के साथ प्रभु का भय माननेवालो[a], परमेश्वर को धन्य कहो, क्योंकि प्रभु की दया उसका भय माननेवालों पर न्याय के साथ है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ज्ञान के साथ” अथवा “विवेक के साथ।”
    reason: lexical_alternative
  - marker: b
    text: या “न्यायिक निर्णय के साथ”; यूनानी में दया और न्याय के पारस्परिक संबंध को संक्षेप में और अनिर्दिष्ट रूप से रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया परमेश्वर के प्रति सीधे स्तुतिपरक प्रत्युत्तर का आह्वान करती है। “धन्य कहो” बाइबलीय आशीष-भाषा से संबंध बनाए रखता है और सामान्य “स्तुति करो” की अपेक्षा मूल क्रिया के अधिक निकट है।
- source_word: οἱ φοβούμενοι
  choice: हे ... भय माननेवालो
  rationale: कृदंत यहाँ संबोधन के रूप में आज्ञा से जुड़ा है; इसलिए हिन्दी में प्रत्यक्ष संबोधन स्वाभाविक और स्पष्ट है।
- source_word: κύριον / Κυρίου
  choice: प्रभु
  rationale: κύριος के लिए प्रचलित बाइबलीय उपाधि है और दोनों occurrences में संगति रखती है।
- source_word: ἐν ἐπιστήμῃ
  choice: समझ-बूझ के साथ
  rationale: यह जानकार, विवेकपूर्ण श्रद्धा का भाव व्यक्त करता है; शाब्दिक “ज्ञान में” आधुनिक हिन्दी में अस्वाभाविक होता।
- source_word: ἔλεος
  choice: दया
  rationale: यह सीधा, स्थापित और सामान्य पाठक के लिए स्वाभाविक समतुल्य है, जो पद की भक्तिपूर्ण ध्वनि से मेल खाता है।
- source_word: μετὰ κρίματος
  choice: न्याय-विचार के साथ
  rationale: यह संक्षिप्त यूनानी पदबंध के न्यायिक अर्थ और उसकी अनसुलझी हुई संगति को बनाए रखता है; इसे केवल “न्यायपूर्वक” कहने से दया और न्याय-विचार का तनाव अधिक स्पष्ट रूप से सुलझ जाता।
theological_decisions:
- issue: μετὰ κρίματος में दया और न्याय-विचार का संबंध
  choice: 'मुख्य पाठ में दोनों को संक्षिप्त रूप से साथ रखा गया है: प्रभु की दया भय माननेवालों पर “न्याय-विचार के साथ” है।'
  alternative: “न्याय के साथ” अथवा “प्रभु की दया न्याय-विचार से जुड़ी हुई है।”
  rationale: यूनानी यह निश्चित नहीं करता कि κρίμα न्यायिक निर्णय, न्याय, या न्यायपूर्ण माप पर बल देता है। संक्षिप्त पदबंध को बनाए रखने से धर्मवैज्ञानिक तनाव बिना अनावश्यक व्याख्या के सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, भक्तिपरक और सहज शैली अपनाई गई है। “हे ... भय माननेवालो” प्रत्यक्ष संबोधन को स्पष्ट करता है; “न्याय-विचार के साथ है” की कुछ असामान्य संक्षिप्तता मूल यूनानी की वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को जानबूझकर सुरक्षित रखती है।
