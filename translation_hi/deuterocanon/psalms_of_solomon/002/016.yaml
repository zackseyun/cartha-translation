  text: I will declare you righteous[a], O God, with an upright heart; for in your judgments is your righteousness[b], O God.
translation:
  language: hi
  text: मैं खरे हृदय से तुझे धर्मी ठहराऊँगा[a], हे परमेश्वर; क्योंकि तेरे न्याय-निर्णयों में तेरी धार्मिकता[b] है, हे परमेश्वर।
  philosophy: optimal-equivalence
  footnotes:
