    text: या ‘तुझे धर्मी घोषित करूँगा’ अथवा ‘तेरी धार्मिकता सिद्ध करूँगा।’
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय।’
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώσω
  choice: धर्मी ठहराऊँगा
  rationale: यह भविष्यत् काल, कर्तृवाच्य, प्रथम पुरुष एकवचन क्रिया है। परमेश्वर इसके कर्म हैं, इसलिए भाव परमेश्वर को धर्मी बनाना नहीं, बल्कि उन्हें धर्मी मानना या घोषित करना है। ‘धर्मी ठहराऊँगा’ यूनानी क्रिया के न्यायिक बल और उसकी वास्तविक अर्थगत असहजता को बनाए रखता है।
- source_word: ἐν εὐθύτητι καρδίας
  choice: सीधे मन से
  rationale: यह वाक्यांश हृदय की नैतिक सीधाई और आंतरिक निष्कपटता बताता है। ‘सीधे मन से’ आधुनिक हिन्दी में स्वाभाविक और बिंब के निकट है।
- source_word: κρίμασιν
  choice: न्यायों
  rationale: बहुवचन रूप परमेश्वर के न्यायिक निर्णयों अथवा न्याय के कार्यों की ओर संकेत करता है। ‘न्यायों’ स्रोत के बहुवचन को सुरक्षित रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यहाँ शब्द परमेश्वर की नैतिक खराई को दर्शाता है, जो उनके न्यायों में दिखाई देती है। ‘धार्मिकता’ मूल पद के व्यापक अर्थ को रखता है; प्रसंग में ‘न्यायप्रियता’ भी संभव है।
theological_decisions:
- issue: मनुष्य द्वारा परमेश्वर को ‘धर्मी ठहराना’
  choice: धर्मी ठहराऊँगा
  alternative: तुझे धर्मी घोषित करूँगा / तेरी धार्मिकता को स्वीकार करूँगा
  rationale: वाक्य को इस तरह नहीं बदला गया कि वक्ता परमेश्वर को धर्मी बनाता है। चयन मूल की न्यायिक भाषा और तनाव को बनाए रखते हुए परमेश्वर की धार्मिकता को मानने या घोषित करने का भाव देता है।
- issue: परमेश्वर की δικαιοσύνη का स्वरूप
  choice: धार्मिकता
  alternative: न्यायप्रियता
  rationale: मूल शब्द धार्मिकता और न्याय दोनों अर्थ-क्षेत्रों को छूता है। मुख्य पाठ में व्यापक ‘धार्मिकता’ रखा गया और प्रसंगानुकूल विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘तुझे/तेरे’ एकवचन संबोधन यूनानी एकवचन को स्पष्ट रखता है। ‘प्रकट होती है’ हिन्दी में संबंध को स्वाभाविक बनाता है, जबकि मूल का आशय—परमेश्वर के न्यायों में उनकी धार्मिकता—सुरक्षित है।
