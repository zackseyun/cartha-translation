- source_word: ἐπιθυμίᾳ
  choice: अभिलाषा
  rationale: यह प्रबल इच्छा को व्यक्त करता है और गरिमापूर्ण काव्यात्मक शैली बनाए रखता है; ‘वासना’ अर्थ को अनुचित रूप से यौन संदर्भ तक सीमित कर सकती है।
- source_word: ψυχῆς
  choice: अपने प्राण की
  rationale: ψυχή के ‘प्राण/जीवन/स्व’ अर्थों में से ‘प्राण’ इस सामी-प्रभावित काव्यात्मक पदबंध का मनोवैज्ञानिक भार बनाए रखता है, जबकि ‘अपनी ही’ इसे अधिक सपाट बना देता।
