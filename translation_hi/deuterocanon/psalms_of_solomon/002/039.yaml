translation:
  language: hi
  text: और पापी के द्वारा किए गए अपमान से धर्मी पर दया करने, और पापी ने धर्मी के साथ जो किया, उसके लिए उसे बदला देने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: दया करने
  rationale: यह क्रियार्थक रूप केवल सहानुभूति नहीं, बल्कि दयापूर्ण कार्य को व्यक्त करता है। ‘दया करने’ से उसका सक्रिय भाव स्वाभाविक हिन्दी में बना रहता है।
- source_word: δίκαιον / δικαίῳ
  choice: धर्मी / धर्मी के साथ
  rationale: एकवचन रूप सामान्य रूप से एक धर्मी व्यक्ति को दर्शाता है। ‘धर्मी’ नैतिक श्रेणी को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπὸ ταπεινώσεως ἁμαρτωλοῦ
  choice: पापी के हाथों हुए अपमान से छुड़ाने
  rationale: यूनानी पदबंध संक्षिप्त है। ἀπό के साथ ἐλεῆσαι यहाँ विपत्ति से दयापूर्वक छुटकारा देने का भाव रख सकता है; ‘पापी के हाथों हुए’ संबंध को स्पष्ट करता है, जबकि ‘अपमान’ ταπείνωσις के नीचे गिराए जाने या अपमानित किए जाने के सामाजिक भाव को बनाए रखता है।
- source_word: ἁμαρτωλοῦ / ἁμαρτωλῷ
  choice: पापी
  rationale: दोनों रूप एकवचन और व्यक्तिवाचक हैं। ‘पापी’ मूल शब्द का सीधा अनुवाद है और ‘धर्मी’ के समानांतर बैठता है।
- source_word: ἀποδοῦναι
  choice: बदला ... देने
  rationale: यहाँ क्रिया किए गए कर्म के प्रत्युत्तर में प्रतिफल देने का न्यायिक भाव रखती है। ‘बदला देना’ आधुनिक हिन्दी में प्रतिशोधात्मक प्रत्युत्तर को स्पष्ट करता है, बिना यह बताए कि उसे कौन-सा दंड दिया जाएगा।
- source_word: ἀνθʼ ὧν ἐποίησεν δικαίῳ
  choice: उसने धर्मी के साथ जो किया, उसका
  rationale: ἀνθʼ ὧν प्रतिदान के आधार को बताता है। यह हिन्दी विन्यास मूल के कारणात्मक-प्रतिफलात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἐλεῆσαι ... ἀπὸ ταπεινώσεως में दया और छुटकारे का संबंध
  choice: मुख्य पाठ में ‘उसे ... से छुड़ाने’ द्वारा निहित छुटकारे का भाव स्पष्ट किया गया
  alternative: ‘पापी के अपमान से धर्मी पर दया करने’ जैसा अधिक शाब्दिक, किंतु हिन्दी में अस्पष्ट पाठ
  rationale: यूनानी रचना संक्षिप्त और कुछ हद तक संदिग्ध है। मुख्य पाठ संभावित ‘विपत्ति से बचाकर दया करना’ अर्थ देता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- issue: ταπείνωσις का अर्थ-क्षेत्र
  choice: अपमान
  alternative: दुःख, दीनता, या उत्पीड़न
  rationale: ‘अपमान’ किसी को नीचा दिखाने या गिराने के मूल सामाजिक भाव को बनाए रखता है; फिर भी प्रसंग में कष्ट या उत्पीड़न भी संभव है, इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। पद पिछले वाक्य पर आश्रित infinitival संरचना है, इसलिए आरंभ में ‘और’ तथा अंत में ‘के लिए’ बनाए गए हैं। ‘छुड़ाने’ एक सीमित व्याख्यात्मक पूर्ति है, और वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित है।
