lexical_decisions:
- source_word: περιείλατο
  choice: उतार दिया
  rationale: यह एओरिस्ट मध्यवाच्य रूप स्त्री कर्ता द्वारा अपने पहने हुए शिरोभूषण को स्वयं उतारने का भाव देता है। यह अनुवाद यूनानी में निहित न होने वाली हिंसा का भाव जोड़े बिना क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μίτραν
  choice: शिरोभूषण
  rationale: μίτρα सिर पर पहने जाने वाले आभूषण या आवरण को सूचित कर सकता है। स्त्रीरूप में चित्रित यरूशलेम के संदर्भ में सामान्य और गरिमापूर्ण ‘शिरोभूषण’ आधुनिक ‘पगड़ी’ से उत्पन्न होने वाले अनावश्यक पुरुषोचित संकेत से बचता है, जबकि ‘मुकुट’ और ‘पगड़ी’ को पाठभेद-सदृश अर्थ-विकल्पों के रूप में टिप्पणियों में रखा गया है।
- source_word: δόξης
  choice: महिमा का
  rationale: सम्बन्धकारक रचना को सीधे बनाए रखकर सम्मान, गौरव और वैभव से जुड़ी ऊँची शैली सुरक्षित रखी गई है।
- source_word: περιέθηκεν αὐτῇ
  choice: उसे पहनाया था
  rationale: यह स्वाभाविक हिन्दी में उस पूर्व कार्य को व्यक्त करता है जिसमें परमेश्वर ने वह शिरोभूषण उस पर रखा अथवा उसे पहनाया था।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: ईश्वर के लिए मानक, गरिमापूर्ण हिन्दी पद; मूल पाठ किसी अतिरिक्त उपाधि की माँग नहीं करता।
