  text: जैसा वे स्वयं किया करते थे, उन्होंने अपने अधर्मों को दिन-दहाड़े[a] प्रदर्शित किया; और तेरे न्याय के अनुसार यरूशलेम की बेटियाँ अपवित्र थीं[b]।
