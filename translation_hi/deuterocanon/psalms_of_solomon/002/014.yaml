lexical_decisions:
- source_word: καθὰ ἐποίουν αὐτοί
  choice: जैसा वे स्वयं किया करते थे
  rationale: καθά तुलना का संबंध जोड़ता है और αὐτοί पर बल को ‘स्वयं’ से व्यक्त किया गया है। अपूर्णकाल ἐποίουν के बार-बार या प्रचलित आचरण के भाव को ‘किया करते थे’ सुरक्षित रखता है।
- source_word: παρεδειγμάτισαν
  choice: सबके सामने प्रकट कर दिया
  rationale: क्रिया में सार्वजनिक रूप से उजागर या प्रदर्शित करने का भाव है। यह हिंदी में स्वाभाविक ढंग से उस सार्वजनिक प्रदर्शन को व्यक्त करता है, बिना यह तय किए कि वह केवल निर्लज्ज प्रदर्शन था या दंडात्मक उजागर किया जाना।
- source_word: ἀδικίας αὐτῶν
  choice: अपने अधर्म के कामों को
  rationale: बहुवचन ἀδικίας ठोस दुष्कर्मों की ओर संकेत करता है। ‘अधर्म के काम’ नैतिक और धार्मिक दोनों भार को रखता है तथा आधुनिक हिंदी में केवल सामाजिक अन्याय तक सीमित नहीं होता।
- source_word: ἀπέναντι τοῦ ἡλίου
  choice: दिन-दहाड़े
  rationale: शाब्दिक अर्थ ‘सूरज के सामने’ है; संदर्भ में यह खुले और सार्वजनिक रूप से किए जाने का मुहावरेदार भाव देता है। साथ का ‘सबके सामने’ παρεδειγμάτισαν की सार्वजनिकता स्पष्ट करता है।
- source_word: βέβηλοι
  choice: अपवित्र
  rationale: यह पवित्रता से बाहर, अपवित्र या दूषित होने का भाव रखता है। ‘अपवित्र’ धार्मिक पवित्रता-विपरीतता को सहज हिंदी में बनाए रखता है।
- source_word: κατὰ τὸ κρίμα σου
  choice: तेरे न्याय के अनुसार
  rationale: यह उनकी दशा और संबोधित परमेश्वर के न्यायिक निर्णय के बीच स्पष्ट संबंध को बनाए रखता है, पर κατὰ का अर्थ केवल साधन (‘तेरे न्याय के द्वारा’) मानकर सीमित नहीं करता।
theological_decisions:
- issue: यरूशलेम की बेटियों की अपवित्रता और परमेश्वर के न्याय का संबंध
  choice: तेरे न्याय के अनुसार ... अपवित्र थीं
  alternative: तेरे न्याय के द्वारा ... अपवित्र हो गई थीं
  rationale: यूनानी κατὰ τὸ κρίμα σου संबंध को स्पष्ट करता है, पर यह अनिवार्य रूप से नहीं बताता कि न्याय ने उनकी अपवित्रता उत्पन्न की या उसे घोषित/निर्धारित किया। ‘के अनुसार’ इस तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और काव्यात्मक-न्यायिक स्वर रखा गया है। ‘तेरे’ भक्ति-काव्य और प्रार्थना की निकट संबोधन-शैली के अनुकूल है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
