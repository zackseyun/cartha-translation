  yaml_path: translation/deuterocanon/psalms_of_solomon/002/004.yaml
  text: Because of these things he said[a], “Cast them far away from me[c][b]; the beauty of his glory did not prosper them.”
translation:
  language: hi
  text: इन बातों के कारण उसने कहा, “इन्हें मुझसे बहुत दूर फेंक दो।” उसकी[b] महिमा की सुंदरता ने उन्हें कोई लाभ नहीं पहुँचाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “उसकी महिमा की सुंदरता ने उन्हें समृद्ध नहीं किया।”
    reason: lexical_alternative
  - marker: b
    text: एक यूनानी पांडुलिपि-पाठ में ‘उसकी’ के लिए स्त्रीलिंग सर्वनाम है; हिन्दी ‘उसकी’ में यह लिंग-भेद प्रकट नहीं होता।
    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτων
  choice: इन बातों के कारण
  rationale: यह पद 3 में वर्णित बातों की ओर स्पष्ट रूप से पीछे संकेत करता है, पर उनके आशय को अनावश्यक रूप से सीमित नहीं करता।
- source_word: εἶπεν
  choice: उसने कहा
  rationale: यूनानी में बोलने का सामान्य क्रियापद है और कर्ता को केवल तीसरे पुरुष में रखता है; इसलिए अनुवाद भी वही संयम बनाए रखता है।
- source_word: Ἀπορρίψατε αὐτὰ μακρὰν ἀπ' ἐμοῦ
  choice: इन्हें मुझसे बहुत दूर फेंक दो
  rationale: ἀπορρίπτω के फेंक देने या अस्वीकार करने के प्रबल भाव और μακράν की दूरी—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: οὐκ εὐώδωκεν αὐτοῖς
  choice: उन्हें कोई लाभ नहीं हुआ
  rationale: εὐοδόω यहाँ लाभ पहुँचाने या सफल बनाने का भाव दे सकता है। यह हिन्दी पाठ प्रसंग में स्वाभाविक है और उनके लिए कोई फायदा न होने का अर्थ व्यक्त करता है।
- source_word: τὸ κάλλος τῆς δόξης αὐτοῦ
  choice: उसकी महिमा की सुंदरता
  rationale: यह रूप κάλλος और δόξα दोनों संज्ञाओं को बनाए रखता है तथा αὐτοῦ के पुल्लिंग एकवचन रूप को 'उसकी' से दर्शाता है, जबकि उसके संदर्भ को निर्धारित नहीं करता।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: उसकी महिमा
  alternative: उसकी/उस वस्तु की महिमा, पूर्ववर्ती वेदी या पवित्रस्थान के संदर्भ में
  rationale: मूल पाठ में सर्वनाम पुल्लिंग एकवचन है, पर उसका संदर्भ संदिग्ध हो सकता है। मुख्य पाठ व्याकरणिक रूप को रखता है; पादटिप्पणी पाठांतर और संभावित स्त्रीलिंग रूप बताती है।
- issue: प्रत्यक्ष कथन की सीमा
  choice: उद्धरण को ἀπ’ ἐμοῦ के बाद समाप्त किया गया
  alternative: अगले उपवाक्य को भी उसी कथन में रखना
  rationale: पहले पुरुष 'मुझसे' के बाद तीसरे पुरुष 'उसकी' वाला कथन भजनकार की टिप्पणी के रूप में अधिक सहज है; विरामचिह्न मूल यूनानी पांडुलिपि परंपरा में निर्णायक नहीं हैं, इसलिए अर्थगत संरचना अपनाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। आदेश की तीव्रता के लिए “फेंक दो” और मूल के दोहरे सौंदर्यात्मक पदों को बनाए रखने के लिए “महिमा की सुंदरता” रखा गया है।
