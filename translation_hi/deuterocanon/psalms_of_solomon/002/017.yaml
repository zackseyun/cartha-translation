  text: For you repaid the sinners according to their deeds[c][b][a], and according to their exceedingly evil sins.
translation:
  language: hi
  text: क्योंकि तूने उन पापियों को उनके कर्मों[a] के अनुसार, और उनके अत्यन्त बुरे पापों[b] के अनुसार प्रतिफल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कामों।”
    reason: lexical_alternative
  - marker: b
    text: या, “अत्यन्त दुष्ट पापों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκας
  choice: प्रतिफल दिया
  rationale: क्रिया का अर्थ किसी को उसके किए के अनुरूप लौटाना या उसका फल देना है। न्याय-संदर्भ में ‘प्रतिफल दिया’ दण्डात्मक आशय को व्यक्त करता है, पर मूल से अधिक स्पष्ट रूप से ‘बदला’ नहीं जोड़ता।
- source_word: τοῖς ἁμαρτωλοῖς
  choice: उन पापियों को
  rationale: यूनानी निश्चित पदबंध को केवल सामान्य वर्ग ‘पापियों’ के रूप में न रखकर ‘उन पापियों’ से व्यक्त किया गया है; इससे संदर्भित विशिष्ट समूह की संभावना बनी रहती है।
- source_word: ἔργα
  choice: कामों
  rationale: ‘काम’ आधुनिक हिन्दी में किए गए कार्यों का स्वाभाविक और व्यापक शब्द है; यहाँ नैतिक आचरण के ठोस कार्य अभिप्रेत हैं।
- source_word: ἁμαρτίας
  choice: पापों
  rationale: ‘पाप’ ἁμαρτία का सीधा, प्रचलित धार्मिक-नैतिक समतुल्य है।
- source_word: πονηρὰς σφόδρα
  choice: अत्यन्त बुरे
  rationale: ‘अत्यन्त’ σφόδρα की तीव्रता और ‘बुरे’ πονηράς का नैतिक अर्थ सहज आधुनिक हिन्दी में बनाए रखते हैं।
theological_decisions:
- issue: τοῖς ἁμαρτωλοῖς में निश्चितता
  choice: उन पापियों को
  alternative: पापियों को
  rationale: निश्चित उपपद किसी पहचाने हुए समूह की ओर संकेत कर सकता है। ‘उन’ इस संकेत को बचाता है, पर उस समूह की ऐतिहासिक पहचान को अनुवाद में अनावश्यक रूप से निश्चित नहीं करता।
- issue: ἀπέδωκας का न्यायिक भाव
  choice: प्रतिफल दिया
  alternative: बदला दिया
  rationale: ‘प्रतिफल’ कर्मानुसार प्रत्युत्तर और न्याय—दोनों को वहन करता है; ‘बदला’ प्रतिशोध का अधिक संकीर्ण भाव जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। भजन की प्रत्यक्ष ईश्वर-संबोधन शैली के अनुरूप ‘तूने’ प्रयोग हुआ है। दोनों κατὰ पदबंधों की समानांतर रचना और καὶ (‘और’) को सुरक्षित रखा गया है।
