lexical_decisions:
- source_word: εὐλογητὸς
  choice: धन्य है
  rationale: यह विशेषण यहाँ विधेय के रूप में स्तुतिपरक घोषणा करता है। ‘धन्य है’ यूनानी के कथनात्मक बल को बनाए रखता है; ‘धन्य हो’ अनावश्यक रूप से कामनासूचक अर्थ दे सकता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर की उपाधि है। ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और प्रतिष्ठित धार्मिक संबोधन है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह मुहावरा अनंत अथवा निरंतर अवधि व्यक्त करता है। संक्षिप्त स्तुतिपरक वाक्य में ‘सदा’ सहज हिन्दी है और ‘सर्वदा’ की अपेक्षा अधिक वर्तमान प्रयोग में है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: ἐνώπιον किसी की उपस्थिति या दृष्टि के समक्ष होने का भाव देता है। ‘के सामने’ इस संबंध को सरल और स्वाभाविक हिन्दी में रखता है, बिना यह अतिरिक्त अर्थ जोड़े कि केवल दृश्य ग्रहण पर बल है।
- source_word: δούλων
  choice: सेवकों
  rationale: δοῦλος दास या सेवक दोनों अर्थ दे सकता है। इस उपासना-संबंधी प्रसंग में ‘सेवक’ अधीनता और निष्ठा को स्वाभाविक रूप से व्यक्त करता है; ‘दास’ भी संभव है, पर आधुनिक पाठक के लिए यहाँ अधिक कठोर सामाजिक बंधन का संकेत दे सकता है।
