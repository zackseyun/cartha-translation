  text: He himself is king over the heavens[a], and judges kings and rulers;
translation:
  language: hi
  text: वह स्वयं स्वर्गों का राजा है और राजाओं तथा शासकों[a] का न्याय करता है;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रधानों’।
    reason: ἀρχάς का अर्थ इस संदर्भ में ‘शासक’ या ‘प्रधान’ हो सकता है।
lexical_decisions:
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: बलवाचक सर्वनाम को स्पष्ट रखा गया है, क्योंकि यूनानी पाठ परमेश्वर के अपने राजत्व पर जोर देता है।
- source_word: βασιλεὺς
  choice: राजा
  rationale: यहाँ संज्ञा विधेय के रूप में है; ‘राजा है’ राजकीय अधिकार को स्वाभाविक और सीधे ढंग से व्यक्त करता है।
- source_word: ἐπὶ τῶν οὐρανῶν
  choice: स्वर्गों पर
  rationale: ἐπί के साथ संबंधकारक यहाँ स्थान मात्र के बजाय प्रभुत्व का भाव देता है; ‘स्वर्गों’ यूनानी बहुवचन को सुरक्षित रखता है।
- source_word: κρίνων
  choice: न्याय करता है
  rationale: वर्तमान कृदंत को सहज हिन्दी के लिए समापिका क्रिया के रूप में व्यक्त किया गया है, जबकि उसके न्यायिक और निरंतर भाव को बनाए रखा गया है।
- source_word: ἀρχάς
  choice: शासकों
  rationale: ‘राजाओं’ के साथ इस प्रसंग में यह सांसारिक शासनाधिकार रखने वालों को सूचित करता है; ‘शासक’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: τῶν οὐρανῶν में परमेश्वर के शासन का क्षेत्र
  choice: यह पंक्ति स्वर्गों पर परमेश्वर के राजत्व और सांसारिक राजकीय शक्तियों पर उसके न्याय की घोषणा करती है।
  alternative: ‘स्वर्गों’ को एकवचन ‘स्वर्ग’ के अर्थ में समझना।
  rationale: 'अनुवाद में यूनानी बहुवचन रखा गया है। दोनों समझों में मुख्य धर्मवैचारिक बल वही है: परमेश्वर का सर्वोच्च राजत्व और शासकों का उसका न्यायाधीन होना।'
- issue: κρίνων की व्याकरणिक अधीनता
  choice: इसे मुख्य कथन से जुड़ी समापिका क्रिया ‘न्याय करता है’ के रूप में व्यक्त किया गया है।
  alternative: ‘राजाओं और शासकों का न्याय करनेवाला’ के रूप में कृदंतीय रचना बनाए रखना।
  rationale: यूनानी में यह वर्तमान कृदंत है और मुख्य कर्ता αὐτός से जुड़ा है। हिन्दी में समापिका क्रिया अर्थ और संबंध को स्पष्ट रखते हुए अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वह स्वयं’ मूल के बल को, ‘स्वर्गों पर’ प्रभुत्व तथा यूनानी बहुवचन को, और ‘न्याय करता है’ न्यायिक क्रिया को सुरक्षित रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी का चिह्न ‘heavens’ के बाद था, पर उसकी सामग्री ἀρχάς के वैकल्पिक अनुवाद से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न ‘शासकों’ के बाद रखा गया है।
