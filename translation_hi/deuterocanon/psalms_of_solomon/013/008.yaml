base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/008.yaml
  text: For he will admonish a righteous man as a beloved son[c][b][a], and his discipline is like that of a firstborn.
translation:
  language: hi
  text: क्योंकि वह एक धर्मी व्यक्ति[a] को किसी प्रिय पुत्र[b] की तरह समझाकर सुधारेगा, और उसका अनुशासन[c] पहलौठे के अनुशासन जैसा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी जन को।”
    reason: δίκαιον संज्ञीकृत विशेषण है; हिन्दी में इसे ‘एक धर्मी व्यक्ति’ या प्रतिनिधिक अर्थ में ‘धर्मी जन’ कहा जा सकता है।
  - marker: b
    text: शाब्दिक रूप से, “प्रेम का पुत्र।”
    reason: υἱὸν ἀγαπήσεως की यूनानी संबंधकारक रचना का अधिक शाब्दिक विकल्प सुरक्षित रखा गया है।
  - marker: c
    text: या, “प्रशिक्षण” अथवा “सुधारात्मक शिक्षा।”
    reason: παιδεία में अनुशासन, प्रशिक्षण और शिक्षा—इन सभी के अर्थ समाहित हो सकते हैं।
lexical_decisions:
- source_word: νουθετήσει
  choice: समझाकर सुधारेगा
  rationale: यह क्रिया चेतावनी, समझाइश और सुधारात्मक निर्देश देने का भाव रखती है। संयुक्त अभिव्यक्ति आधुनिक हिन्दी में इसके सुधारात्मक तथा शिक्षाप्रद दोनों पक्षों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: δίκαιον
  choice: एक धर्मी व्यक्ति
  rationale: विशेषण यहाँ संज्ञा के रूप में, एकवचन और बिना निश्चित उपपद के प्रयुक्त है। यह अनुवाद एकवचन बनाए रखता है और आगे के ‘पुत्र’ तथा ‘पहलौठे’ के बिंब से मेल खाता है।
- source_word: υἱὸν ἀγαπήσεως
  choice: प्रिय पुत्र
  rationale: शाब्दिक ‘प्रेम का पुत्र’ यूनानी में गुणसूचक संबंधकारक है; ‘प्रिय पुत्र’ उसके स्वाभाविक अर्थ और पितृसुलभ स्नेह को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: παιδεία
  choice: अनुशासन
  rationale: संदर्भ में यह केवल शिक्षा नहीं, बल्कि चरित्र-निर्माण करनेवाले सुधारात्मक प्रशिक्षण को दर्शाता है। ‘अनुशासन’ समानांतर νουθετήσει से भी मेल खाता है।
- source_word: πρωτοτόκου
  choice: पहलौठे
  rationale: संज्ञा के रूप में प्रयुक्त यह शब्द पहले जन्मे पुत्र की छवि और विशेष पारिवारिक स्थिति बनाए रखता है।
theological_decisions:
- issue: αὐτοῦ (‘उसका’) का संदर्भ
  choice: मुख्य पाठ में ‘उसका अनुशासन’ रखकर सर्वनाम की मूल अस्पष्टता बनाए रखी गई है
  alternative: ‘उसे दिया गया अनुशासन’ या ‘परमेश्वर का अनुशासन’
  rationale: यूनानी सर्वनाम का व्याकरणिक संदर्भ पूरी तरह निर्विवाद नहीं है। किसी एक संबंध को स्पष्ट करके आरोपित करने के बजाय हिन्दी में वही संभावित अस्पष्टता सुरक्षित रखी गई है।
- issue: υἱὸν ἀγαπήσεως का संबंध
  choice: प्रिय पुत्र
  alternative: प्रेम का पुत्र
  rationale: इसे गुणसूचक संबंधकारक समझना सबसे स्वाभाविक है, पर शाब्दिक संरचना को पादटिप्पणी में सुरक्षित रखा गया है; इससे किसी विशेष धर्मवैज्ञानिक पहचान को पाठ में आरोपित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘समझाकर सुधारेगा’ पितृसुलभ चेतावनी और सुधार का भाव देता है; ‘पहलौठा’ बाइबिलीय पारिवारिक बिंब को बनाए रखता है।
