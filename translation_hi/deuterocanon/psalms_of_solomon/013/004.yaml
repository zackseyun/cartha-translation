  text: The ungodly was troubled because of his transgressions[b][a], lest he be taken away with sinners.
translation:
  language: hi
  text: अधर्मी अपने अपराधों के कारण व्याकुल हो उठा, कहीं ऐसा न हो कि वह पापियों के साथ ले जाया जाए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “न कि जब वह पापियों के साथ ले जाया जाए।” यूनानी वाक्यांश μὴ ὅτε συμπαραληφθῇ का वाक्य-विन्यास कठिन है; मुख्य पाठ में इसे आशंका के अर्थ में लिया गया है: “कहीं ऐसा न हो कि वह ... ले जाया जाए।”'
    reason: alternative_reading
  - marker: b
    text: “ले जाया जाए” का अनुवाद “बहा ले जाया जाए” या “दूसरों के साथ ले जाया जाए” भी हो सकता है; मूल शब्द पापियों के साथ साझा दंड का भाव उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: व्याकुल हो उठा
  rationale: यह रूप भीतर की घबराहट, अशांति या विचलन को व्यक्त कर सकता है। ‘व्याकुल हो उठा’ यूनानी भूतकाल की घटना-सुलभता को स्वाभाविक हिन्दी में रखता है और अशांति के स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ὁ ἀσεβής
  choice: अधर्मी
  rationale: ἀσεβής ईश्वर के प्रति श्रद्धाहीनता से जुड़ी धार्मिक-नैतिक दुष्टता को सूचित करता है। ‘अधर्मी’ आधुनिक हिन्दी में सहज और बाइबिलीय गरिमा वाला शब्द है; यह केवल सामान्य बुराई तक सीमित नहीं रहता।
- source_word: διὰ παραπτώματα αὐτοῦ
  choice: अपने अपराधों के कारण
  rationale: यहाँ διά के साथ कर्मकारक कारण बताता है। παραπτώματα नैतिक चूकों या उल्लंघनों को दर्शाता है; ‘अपराधों’ से उसका ठोस और गंभीर भाव स्पष्ट रहता है।
- source_word: μὴ ὅτε συμπαραληφθῇ
  choice: कहीं ऐसा न हो कि वह ... साथ उठा लिया जाए
  rationale: यूनानी वाक्यांश संक्षिप्त और वाक्य-विन्यास की दृष्टि से कठिन है। मुख्य पाठ में μή को आशंका-निवारक अर्थ में लिया गया है। ‘साथ उठा लिया जाए’ साझा दंड में दूसरों के साथ ले जाए जाने का भाव बनाए रखता है।
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: पापियों के साथ
  rationale: यह वाक्यांश साझा दंड में संगति प्रकट करता है। ‘पापियों के साथ’ संक्षिप्त, स्वाभाविक और मूल के अर्थ के निकट है।
