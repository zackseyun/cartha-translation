translation:
  language: hi
  text: क्रूर जंगली पशु उन पर टूट पड़े; अपने दाँतों से वे उनका मांस नोचते थे, और अपनी दाढ़ों से उनकी हड्डियाँ चूर करते थे; और इन सब से प्रभु ने हमें छुड़ाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρία ... πονηρά
  choice: दुष्ट वन-पशु
  rationale: θηρία का अर्थ जंगली अथवा वन-पशु है और πονηρά यहाँ उनके हिंसक, घातक स्वभाव को व्यक्त करता है; ‘दुष्ट’ मूल विशेषण को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐπέδραμοσαν
  choice: टूट पड़े
  rationale: क्रिया आकस्मिक और आक्रामक धावे को सूचित करती है; हिंदी में ‘टूट पड़े’ इसका स्वाभाविक और सजीव रूप है।
- source_word: ἔτιλλον
  choice: नोचते थे
  rationale: मूल क्रिया बाल या मांस को खींचकर उखाड़ने/नोचने का बिंब देती है; ‘नोचते थे’ केवल ‘फाड़ते थे’ की अपेक्षा इस क्रिया को अधिक निकटता से व्यक्त करता है।
- source_word: μύλαις
  choice: दाढ़ों
  rationale: शाब्दिक अर्थ पीसने वाले दाँत, अर्थात दाढ़ें, है; इससे काटने वाले दाँतों और कुचलने वाली दाढ़ों का मूल भेद सुरक्षित रहता है।
- source_word: ἔθλων
  choice: चूर करते थे
  rationale: क्रिया दबाकर तोड़ने या कुचलने को दर्शाती है; हड्डियों के संदर्भ में ‘चूर करते थे’ स्वाभाविक तथा प्रभावशाली है।
- source_word: ἐρρύσατο
  choice: छुड़ाया
  rationale: यह संकट या विनाश से बचाकर निकालने का भाव रखता है; ‘छुड़ाया’ हिंदी बाइबलीय शैली में सहज है और उद्धार की अनावश्यक तकनीकी व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: Κύριος का निरूपण
  choice: प्रभु
  alternative: याहवे
  rationale: यूनानी पाठ में सामान्य उपाधि Κύριος है, स्पष्ट रूप से दिव्य नाम नहीं; इसलिए ‘प्रभु’ स्रोत-पाठ के स्तर को बनाए रखता है।
- issue: पीड़ितों और छुड़ाए गए समुदाय के सर्वनामों का अंतर
  choice: ‘उन पर/उनका’ और अंत में ‘हमें’
  alternative: सभी सर्वनामों को एक ही समुदाय के रूप में समरूप करना
  rationale: यूनानी पाठ αὐτοῖς/αὐτῶν से ἡμᾶς की ओर बदलता है। संभावित आलंकारिक या सामुदायिक संबंध को व्याख्यात्मक रूप से सुलझाए बिना यह तनाव संरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है। हिंसक काव्य-बिंबों को नरम नहीं किया गया। यूनानी में अपूर्णकालीन ἔτιλλον और ἔθλων के लिए ‘नोचते थे’ और ‘चूर करते थे’ प्रयुक्त हैं, जबकि पूर्ण घटना-क्रम के लिए ‘टूट पड़े’ और ‘छुड़ाया’ रखा गया है। अंग्रेज़ी परामर्श-पाठ में आकस्मिक पुनरावृत्ति को नहीं अपनाया गया, क्योंकि यूनानी स्रोत में पद केवल एक बार है।
