translation:
  language: hi
  text: क्योंकि अज्ञान में धर्मियों को मिलने वाली ताड़ना[a][b][c] पापी के विनाश के समान नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ताड़ना’ का अनुवाद ‘सुधारात्मक अनुशासन’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: एक पाठांतर में ‘धर्मियों’ के स्थान पर ‘पापियों’ है।
    reason: textual_variant
  - marker: c
    text: ‘अज्ञान में’ का आशय ‘अनजाने में किए गए पापों के कारण’ भी हो सकता है; यूनानी में ‘पापों’ शब्द स्पष्ट रूप से नहीं है।
    reason: ambiguity
lexical_decisions:
- source_word: οὐχ ὁμοία
  choice: के समान नहीं है
  rationale: यह अभिव्यक्ति दोनों परिणामों के स्वरूप में स्पष्ट तुलना और भेद बनाए रखती है तथा स्वाभाविक हिन्दी है।
- source_word: παιδεία
  choice: अनुशासन
  rationale: यहाँ शब्द का आशय केवल शिक्षा नहीं, बल्कि सुधारने के उद्देश्य से दी जाने वाली ताड़ना या सुधारात्मक व्यवहार है; ‘अनुशासन’ इस अर्थ-क्षेत्र को संक्षेप में बनाए रखता है।
- source_word: τῶν δικαίων
  choice: धर्मियों का
  rationale: यूनानी संबंधकारक का सीधा और संक्षिप्त रूप है; यह धर्मियों को एक वर्ग के रूप में प्रस्तुत करता है।
- source_word: ἐν ἀγνοίᾳ
  choice: अज्ञान में
  rationale: यह यूनानी वाक्यांश का निकट और जानबूझकर अस्पष्ट अनुवाद है। इसे ‘अनजाने में किए गए पापों के कारण’ समझा जा सकता है, पर मूल पाठ में ‘पाप’ स्पष्ट रूप से नहीं है।
- source_word: καταστροφὴ
  choice: विनाश
  rationale: यह शब्द घोर पतन या नाश को व्यक्त करता है और धर्मियों के सुधारात्मक अनुशासन के साथ मूल पाठ का तीखा विरोध बनाए रखता है।
- source_word: τοῦ ἁμαρτωλοῦ
  choice: पापी का
  rationale: एकवचन संज्ञात्मक प्रयोग को सुरक्षित रखते हुए यह प्रतिनिधिक नैतिक वर्ग को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: धर्मी के कष्ट का स्वरूप
  choice: पद धर्मियों के अनुशासन और पापी के विनाश में भेद करता है।
  alternative: ‘अज्ञान में’ को स्पष्ट रूप से ‘अनजाने में किए गए पापों के कारण’ कहकर धर्मी के अनुशासन का कारण बताया जा सकता था।
  rationale: निकटवर्ती प्रसंग सुधारात्मक अनुशासन और विनाशकारी न्याय के बीच भेद का समर्थन करता है, लेकिन इस पद के यूनानी पाठ में ‘पाप’ शब्द नहीं है। इसलिए मुख्य पाठ मूल की संक्षिप्तता और तनाव को बनाए रखता है, जबकि अर्थ-संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और संक्षिप्त रूप अपनाया गया है। ‘अज्ञान में’ को मुख्य पाठ में बनाए रखकर मूल की व्याकरणिक और अर्थगत अस्पष्टता सुरक्षित रखी गई है; व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
