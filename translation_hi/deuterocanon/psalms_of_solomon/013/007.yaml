  text: A righteous man is disciplined in secret[c][b][a], so that the sinner may not gloat over the righteous man.
translation:
  language: hi
  text: धर्मी को गुप्त रूप से ताड़ना दी जाती है[a], ताकि पापी धर्मी की दशा पर खुश न हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संयम के साथ ताड़ना दी जाती है” अथवा “रोक-थाम के अधीन अनुशासित किया जाता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “धर्मी पर विजयोल्लास न करे” अथवा “धर्मी पर हर्षित न हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν περιστολῇ
  choice: गुप्त रूप से
  rationale: περιστολή यहाँ ढकने, छिपाने या गोपनीयता का भाव दे सकता है। उद्देश्य-वाक्य—कि पापी धर्मी पर आनन्द न मनाए—इस अर्थ का समर्थन करता है कि ताड़ना उसकी दृष्टि से छिपी रहती है। फिर भी ‘संयम के साथ’ अर्थ की वास्तविक संभावना पादटिप्पणी में रखी गई है।
- source_word: παιδεύεται
  choice: ताड़ना दी जाती है
  rationale: παιδεύω शिक्षा और प्रशिक्षण से लेकर सुधारात्मक अनुशासन तक का अर्थ रखता है। इस प्रसंग में ‘ताड़ना’ सुधार के लिए दिए गए अनुशासन को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: पुल्लिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रतिनिधिक अर्थ में प्रयुक्त है। ‘धर्मी’ हिन्दी की स्वाभाविक बाइबलीय भाषा में उसी रूप और नैतिक विरोध को बनाए रखता है।
- source_word: ἐπιχαρῇ
  choice: आनन्द न मनाए
  rationale: ἐπιχαίρω किसी दूसरे की दशा पर आनन्दित होने या विजयोल्लास करने का भाव दे सकता है। ‘धर्मी पर आनन्द मनाना’ मूल की संरचना और निहित विरोधी भाव को बनाए रखता है; अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὁ ἁμαρτωλός
  choice: पापी
  rationale: संज्ञा सवर्णक रूप में एक प्रतिनिधिक नैतिक प्रकार को दिखाती है और ‘धर्मी’ के साथ मूल का सीधा विरोध सुरक्षित रखती है।
theological_decisions:
- issue: δίκαιος का प्रतिनिधिक पुल्लिंग एकवचन
  choice: धर्मी
  alternative: धर्मी व्यक्ति
  rationale: मूल यूनानी का रूप पुल्लिंग एकवचन है, पर कथन सामान्य सिद्धान्त व्यक्त करता है। ‘धर्मी’ लिंग-रूप को मिटाए बिना हिन्दी में प्रतिनिधिक अर्थ देता है।
- issue: ताड़ना की गोपनीयता अथवा मर्यादा
  choice: गुप्त रूप से
  alternative: संयम के साथ
  rationale: 'उद्देश्य-वाक्य गोपनीयता के अर्थ को अधिक सम्भावित बनाता है: पापी को धर्मी की ताड़ना देखकर उस पर आनन्द मनाने का अवसर नहीं मिलता। चूँकि περιστολή प्रतिबन्ध या संयम भी सूचित कर सकता है, वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। ‘ताड़ना’ सुधारात्मक अनुशासन का बाइबलीय किन्तु अभी भी बोधगम्य शब्द है। मूल की संक्षिप्त, सूक्तिपरक रचना और ‘धर्मी—पापी’ का नैतिक विरोध बनाए रखा गया है।
