  yaml_path: translation/deuterocanon/psalms_of_solomon/013/002.yaml
  text: The arm of the Lord saved us from the sword passing through[b][a], from famine and the death of sinners.
translation:
  language: hi
  text: प्रभु की भुजा ने हमें आर-पार जाती हुई तलवार से[a], अकाल से और पापियों की मृत्यु से[b] बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गुजरती हुई तलवार से।”
    reason: διαπορευομένης के अधिक सीधा, किंतु कुछ कम प्रभावशाली, अनुवाद को दर्शाने के लिए।
  - marker: b
    text: यहाँ अर्थ “पापियों के लिए मृत्यु” या “पापियों द्वारा लाई गई मृत्यु” भी हो सकता है।
    reason: θανάτου ἁμαρτωλῶν में संबंधकारक के अस्पष्ट संबंध को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: βραχίων
  choice: भुजा
  rationale: शारीरिक रूपक को बनाए रखता है और प्रभु के सामर्थ्य को ठोस, स्वाभाविक बाइबिलीय भाषा में व्यक्त करता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: यहाँ κύριος के ईश्वरीय संबोधन का सीधा और प्रचलित हिन्दी रूप है; यूनानी पाठ से परे जाकर इब्रानी परमेश्वर-नाम की परंपरा आरोपित नहीं की गई।
- source_word: ἔσωσεν
  choice: बचाया
  rationale: क्रिया के पूर्ण हुए उद्धारकारी कार्य को सरल, स्वाभाविक और धार्मिक अर्थवत्ता सहित व्यक्त करता है।
- source_word: ῥομφαίας
  choice: तलवार
  rationale: ῥομφαία का मानक और स्पष्ट हिन्दी समतुल्य है तथा विपत्ति के ठोस बिंब को बनाए रखता है।
- source_word: διαπορευομένης
  choice: आर-पार जाती हुई
  rationale: यह कृदंत किसी क्षेत्र में से होकर आगे बढ़ने का भाव देता है; हिन्दी में यह विनाशकारी तलवार की गति को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: λιμοῦ
  choice: अकाल
  rationale: तलवार और मृत्यु के साथ सामुदायिक विपत्तियों की सूची में ‘अकाल’ व्यक्तिगत ‘भूख’ की अपेक्षा अधिक उपयुक्त है।
- source_word: θανάτου
  choice: मृत्यु
  rationale: यूनानी संज्ञा का सीधा अर्थ सुरक्षित रखा गया है; इसे व्यापक ‘विनाश’ में नहीं बदला गया।
- source_word: ἁμαρτωλῶν
  choice: पापियों की
  rationale: साधारण संबंधकारक को यथासंभव पारदर्शी ढंग से रखा गया है, क्योंकि यूनानी स्वयं यह स्पष्ट नहीं करता कि मृत्यु पापियों की है, उनके लिए है, या उनके द्वारा लाई गई है।
theological_decisions:
- issue: θανάτου ἁμαρτωλῶν में संबंधकारक का अर्थ
  choice: पापियों की मृत्यु
  alternative: पापियों के लिए मृत्यु; पापियों द्वारा लाई गई मृत्यु
  rationale: यूनानी वाक्यांश संक्षिप्त और वास्तविक रूप से संदिग्ध है। मुख्य पाठ निकटतम व्याकरणिक रूप रखता है, जबकि पादटिप्पणी अन्य संभावित संबंधों को बताती है और धार्मिक तनाव को समय से पहले हल नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘भुजा’ मूल रूपक को बनाए रखती है; वाक्य-विन्यास हिन्दी की स्वाभाविक क्रिया-अंत संरचना के अनुसार रखा गया है।
