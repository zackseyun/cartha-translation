  text: For the destruction of the sinner is dreadful[a], and none of all these things will touch the righteous.
translation:
  language: hi
  text: क्योंकि पापी का विनाश भयानक है, और इन सब में से एक भी बात धर्मी को नहीं छुएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεινή
  choice: भयानक
  rationale: यह विशेषण पापी के विनाश की भयावह और गंभीर प्रकृति व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: καταστροφή
  choice: विनाश
  rationale: यह व्यापक रूप से नाश, बरबादी या विनाशकारी उलटाव का अर्थ देता है और प्रसंग को किसी केवल सैनिक पराजय तक सीमित नहीं करता।
- source_word: ἁμαρτωλοῦ
  choice: पापी का
  rationale: सम्बन्धकारक एकवचन का सीधा और स्वाभाविक अनुवाद है, जो नैतिक अर्थ बनाए रखता है।
- source_word: ἅψεται
  choice: नहीं छुएगी
  rationale: मूल क्रिया के ठोस 'छूने' के बिंब को सुरक्षित रखता है और यहाँ किसी विपत्ति के धर्मी तक पहुँचने का भाव देता है।
- source_word: δικαίου
  choice: धर्मी को
  rationale: प्रतिनिधिक एकवचन को स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक रूप से लिंग निर्दिष्ट नहीं करता।
- source_word: οὐδὲν ἐκ πάντων τούτων
  choice: इन सब बातों में से एक भी
  rationale: ἐκ πάντων की समग्रता को स्पष्ट रखते हुए οὐδὲν का पूर्ण निषेध स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: धर्मी तक विपत्तियों के न पहुँचने का कथन
  choice: 'मूल के निरपेक्ष कथन को यथावत रखा गया: ''एक भी धर्मी को नहीं छुएगी''।'
  alternative: इसे केवल अंतिम विनाश या आत्मिक हानि तक सीमित करके समझाना।
  rationale: यूनानी वाक्य स्वयं ऐसी कोई सीमा स्पष्ट नहीं करता; अतः अनुवाद में धर्मवैज्ञानिक व्याख्या जोड़कर तनाव को हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी के ठोस बिंब के निकट। पहले खंड और विरोधी दूसरे खंड के बीच स्वाभाविक प्रवाह के लिए καί को प्रसंगानुसार 'पर' से व्यक्त किया गया है।
