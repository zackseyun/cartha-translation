lexical_decisions:
- source_word: Δεξιὰ
  choice: दाहिना हाथ
  rationale: स्त्रीलिंग विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; बाइबिलीय रूपक में ‘दाहिना हाथ’ सामर्थ्य और रक्षा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Κυρίου
  choice: प्रभु के
  rationale: संबंधकारक का स्वाभाविक हिन्दी रूप अधिकार-सूचक ‘प्रभु के’ है।
- source_word: ἐσκέπασέν
  choice: अपनी ओट में रखा
  rationale: क्रिया का मूल भाव ढकना है, और संदर्भ में वह सुरक्षा देना बताती है; ‘अपनी ओट में रखा’ दोनों पहलुओं को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: με
  choice: मुझे
  rationale: प्रथम पुरुष एकवचन कर्म का सीधा हिन्दी रूप।
- source_word: ἐφείσατο
  choice: छोड़ दिया
  rationale: φείδομαι का अर्थ किसी को नष्ट या हानि न पहुँचाकर बख्श देना है; ‘छोड़ दिया’ इस प्रसंग में दया करके बचा रहने देने का अर्थ देता है।
- source_word: ἡμῶν
  choice: हमें
  rationale: यूनानी में क्रिया के साथ संबंधकारक है, पर हिन्दी में प्रभावित व्यक्ति के लिए कर्मरूप ‘हमें’ स्वाभाविक है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: दैवी संबोधन के रूप में ‘प्रभु’ आधुनिक हिन्दी बाइबिलीय भाषा में स्वाभाविक है और पद में किसी अधिक विशिष्ट अर्थ की आवश्यकता नहीं है।
- issue: एकवचन ‘मुझे’ से बहुवचन ‘हमें’ का परिवर्तन
  choice: मूल पाठ के दोनों अलग पुरुष-वचनों को बनाए रखा
  alternative: दोनों खंडों में एक ही वचन कर देना
  rationale: με और ἡμῶν के बीच वास्तविक पाठगत तनाव है; उसे व्याख्या द्वारा समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर संरचना में ‘प्रभु के दाहिने हाथ’ की पुनरावृत्ति मूल यूनानी के बलाघात को सुरक्षित रखती है।
