  yaml_path: translation/deuterocanon/psalms_of_solomon/013/009.yaml
  text: For the Lord will spare his faithful ones[a], and he will wipe away their trespasses by discipline[c][b]; for the life of the righteous is forever.
translation:
  language: hi
  text: क्योंकि प्रभु अपने निष्ठावान जनों[a] को बख्श देगा और अनुशासन के द्वारा[b] उनके अपराधों को मिटा देगा; क्योंकि धर्मियों का जीवन सदा बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भक्त जन’ अथवा ‘धर्मपरायण जन’; परंपरागत रूप से ‘पवित्र जन’ भी।
    reason: lexical_alternative
  - marker: b
    text: या ‘सुधार के द्वारा’; यूनानी पद का अर्थ ‘अनुशासन में’ अथवा ‘ताड़ना के साथ’ भी हो सकता है।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: φείσεται
  choice: बख्श देगा
  rationale: यह क्रिया पूर्ण दण्ड या विनाश से बचाने का भाव रखती है। ‘बख्श देगा’ इस ठोस अर्थ को बनाए रखता है और अगले खंड के अनुशासन के साथ दया का तनाव भी सुरक्षित रखता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर के लिए उपाधि के रूप में प्रयुक्त है; आधुनिक हिन्दी में ‘प्रभु’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: ὁσίων
  choice: भक्त जनों
  rationale: भजन-संहिता सुलैमान में ὅσιοι covenantally devoted, धर्मपरायण समुदाय को सूचित करता है। ‘भक्त जन’ इसे ‘पवित्र जन’ से अलग रखते हुए सहज हिन्दी में व्यक्त करता है।
- source_word: παραπτώματα
  choice: अपराधों
  rationale: यह नैतिक चूकों या उल्लंघनों को दर्शाता है। ‘अपराध’ हिन्दी में स्पष्ट है और व्यापक ‘पाप’ की अपेक्षा मूल शब्द की विशिष्टता बेहतर बनाए रखता है।
- source_word: ἐξαλείψει
  choice: मिटा देगा
  rationale: क्रिया मिटा देने या लोप कर देने की सजीव छवि रखती है; ‘मिटा देगा’ आधुनिक हिन्दी में स्वाभाविक रूप से वही अर्थ देता है।
- source_word: ἐν παιδείᾳ
  choice: अनुशासन के द्वारा
  rationale: ἐν यहाँ साधन अथवा परिस्थिति दोनों का संकेत दे सकता है। मुख्य पाठ में साधनवाचक अर्थ रखा गया है, जबकि पादटिप्पणी सुधार और ताड़ना की अर्थ-सीमा बताती है।
- source_word: δικαίων
  choice: धर्मियों
  rationale: यह δικ- शब्द-समूह का सीधा और प्रचलित हिन्दी रूप है तथा नैतिक रूप से धर्मी जनों को सूचित करता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा बना रहता है
  rationale: यह स्थायी, अंतहीन जीवन का भाव व्यक्त करता है। वर्तमानकालीन ‘बना रहता है’ यूनानी ἐστίν में निहित सामान्य कथन को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दया और अनुशासन का संबंध
  choice: प्रभु अपने भक्त जनों को बख्शता है और अनुशासन के द्वारा उनके अपराध मिटाता है।
  alternative: अनुशासन को अपराध मिटाने का साधन न मानकर वह परिस्थिति माना जा सकता है जिसमें यह मिटाना होता है; इसे मुख्यतः दण्डात्मक ताड़ना भी समझा जा सकता है।
  rationale: वाक्य-विन्यास बख्शने और अनुशासन में अपराध मिटाने को निकटता से जोड़ता है। अनुवाद दया को अनुशासन से अलग नहीं करता, फिर भी παιδεία को केवल दण्ड या केवल शिक्षा मानकर अर्थ को संकुचित नहीं करता।
- issue: ὅσιοι की सामुदायिक पहचान
  choice: भक्त जन
  alternative: निष्ठावान जन, धर्मपरायण जन, या पवित्र जन
  rationale: इस पुस्तक में शब्द विशेष रूप से परमेश्वर के प्रति निष्ठावान, धर्मपरायण समुदाय के लिए आता है। ‘भक्त जन’ इस अर्थ को व्यक्त करता है, पर पादटिप्पणी वास्तविक वैकल्पिक अर्थों को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘भक्त जन’, ‘बख्श देगा’ और ‘अनुशासन’ सामान्य पाठक के लिए बोधगम्य हैं। अर्धविराम मूल के दो निकट जुड़े कारणवाचक कथनों को स्पष्ट करता है।
