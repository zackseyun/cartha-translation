lexical_decisions:
- source_word: ἁμαρτωλοὶ
  choice: पापी
  rationale: यूनानी संज्ञा का सीधा अर्थ पाप से पहचाने जाने वाले लोग है; ‘पापी’ सहज और अनावश्यक व्याख्या से मुक्त है।
- source_word: ἀρθήσονται
  choice: हटा दिए जाएँगे
  rationale: αἴρω के भविष्यत् कर्मवाच्य रूप में उठा लिए जाने या हटा दिए जाने का भाव है। ‘हटा दिए जाएँगे’ मूल क्रिया के निकट रहते हुए न्याय के प्रसंग में स्वाभाविक है।
- source_word: εἰς ἀπώλειαν
  choice: विनाश के लिए
  rationale: ἀπώλεια विनाश या बरबादी को सूचित करता है। यह चयन परिणाम अथवा गंतव्य की कुछ हद तक बनी हुई यूनानी अस्पष्टता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μνημόσυνον
  choice: स्मरण
  rationale: यह शब्द किसी व्यक्ति की बनी रहने वाली याद अथवा स्मारक को सूचित कर सकता है। ‘स्मरण’ काव्यात्मक प्रसंग में सहज है और अर्थ को केवल भौतिक स्मारक तक सीमित नहीं करता।
- source_word: ἔτι
  choice: फिर ... न
  rationale: नकारात्मक भविष्यत् वाक्य में यह आगे से और कभी न पाए जाने का भाव सहज हिन्दी में व्यक्त करता है।
