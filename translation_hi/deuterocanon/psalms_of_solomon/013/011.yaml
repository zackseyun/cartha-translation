  text: But upon the godly is the mercy of the Lord[c][b][a], and upon those who fear him is his mercy.
translation:
  language: hi
  text: परन्तु भक्तों[a] पर प्रभु की दया है, और उसका भय मानने वालों[b] पर उसकी दया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धर्मनिष्ठ लोगों’ अथवा ‘भक्त जनों’।
    reason: lexical_alternative
  - marker: b
    text: ‘उसका भय मानने वालों’ का अर्थ श्रद्धा सहित उसका भय मानना है; इसे ‘उसके प्रति श्रद्धा रखने वालों’ भी कहा जा सकता है, पर यूनानी में ‘भय’ की अधिक सशक्त बाइबलीय भाषा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσίους
  choice: भक्तों
  rationale: यहाँ ὅσιος उन लोगों के लिए प्रयुक्त है जो परमेश्वर के प्रति भक्ति और धर्मनिष्ठा से पहचाने जाते हैं। ‘भक्तों’ सहज, गरिमापूर्ण और समूह-संज्ञा के रूप में स्वाभाविक है; यह ἅγιοι के सामान्य अनुवाद ‘पवित्र जन’ से आवश्यक भेद भी बनाए रखता है।
- source_word: ἔλεος
  choice: दया
  rationale: ‘दया’ दोनों आवृत्तियों में यूनानी ἔλεος का सीधा और स्वाभाविक अनुवाद है तथा मूल की पुनरुक्ति को सुरक्षित रखता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος के लिए प्रचलित बाइबलीय संबोधन है और यहाँ परमेश्वर की ओर संकेत करता है।
- source_word: φοβουμένους
  choice: भय माननेवालों
  rationale: यह अभिव्यक्ति परमेश्वर के प्रति श्रद्धायुक्त भय का पारंपरिक बाइबलीय भाव बनाए रखती है; केवल ‘आदर करनेवालों’ कहने से यूनानी की अधिक प्रबल भाषा नरम पड़ जाती।
theological_decisions:
- issue: परमेश्वर के ‘भय’ को केवल श्रद्धा या आदर के रूप में नरम करना
  choice: उसका भय माननेवालों
  alternative: उसका आदर करनेवालों / उसके प्रति श्रद्धा रखनेवालों
  rationale: φοβουμένους में श्रद्धा निहित है, फिर भी मूल पाठ भय की सशक्त बाइबलीय भाषा रखता है। ‘भय मानना’ उस धार्मिक तनाव को बिना केवल आतंक का अर्थ देने के सुरक्षित रखता है।
- issue: ὁσίους को ‘पवित्र जनों’ के रूप में प्रस्तुत करना
  choice: भक्तों
  alternative: पवित्र जनों / धर्मनिष्ठ लोगों
  rationale: इस ग्रंथ में ὅσιοι भक्त या धर्मनिष्ठ समुदाय के लिए समूह-सूचक पद हो सकता है और ἅγιοι से अलग अर्थ-छाया रखता है। ‘भक्तों’ इस भेद को बनाए रखता है तथा बाद की किसी औपचारिक संत-उपाधि का संकेत नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण बाइबलीय शैली अपनाई गई है। मूल यूनानी की समानांतर रचना और ‘दया’ की पुनरावृत्ति दोनों सुरक्षित रखी गई हैं।
