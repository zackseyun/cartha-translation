  text: His words are refined beyond the finest precious gold[a]; in the assemblies he will judge the people[d][c][b], the tribes of the sanctified.
translation:
  language: hi
  text: उसके वचन सबसे उत्तम बहुमूल्य सोने से भी बढ़कर शुद्ध किए हुए हैं[a]; सभाओं में वह प्रजा का—पवित्र किए गए जन के गोत्रों का—न्याय करेगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके वचन सबसे उत्तम बहुमूल्य सोने से भी बढ़कर आग में परखे हुए हैं” अथवा “शुद्ध किए हुए हैं।”
    reason: lexical_alternative
  - marker: b
    text: या, “सभाओं में वह प्रजा में भेद करेगा” अथवा “प्रजा को अलग करेगा।”
    reason: alternative_reading
  - marker: c
    text: यूनानी में “पवित्र किए गए जन के गोत्र” पदबंध संक्षिप्त है। इसका अनुवाद “पवित्र जन के गोत्र” भी हो सकता है। व्याकरणिक रूप एकवचन है, इसलिए “पवित्र किए गए व्यक्ति के गोत्र” भी संभव है, पर संदर्भ सामूहिक जन की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ῥήματα
  choice: वचन
  rationale: यह शब्द बोले गए शब्दों या कथनों को सूचित करता है। ‘वचन’ संक्षिप्त, गरिमापूर्ण और इस प्रसंग में स्वाभाविक है।
- source_word: πεπυρωμένα
  choice: तपे हुए
  rationale: पूर्ण कृदंत आग में तपाए, परखे या शुद्ध किए जाने का बिंब रखता है। सोने से तुलना के कारण ‘तपे हुए’ धातु-शोधन का चित्र सुरक्षित रखता है।
- source_word: ὑπὲρ χρυσίον τὸ πρῶτον τίμιον
  choice: उत्तम और बहुमूल्य सोने से भी अधिक
  rationale: यह वाक्यांश सोने की श्रेष्ठता और मूल्य दोनों पर बल देता है। हिन्दी रूप तुलना की तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συναγωγαῖς
  choice: सभाओं में
  rationale: यहाँ सामुदायिक जमाव या एकत्र सभा अभिप्रेत है; ‘सभाओं’ से बाद की किसी विशिष्ट संस्थागत संज्ञा को अनावश्यक रूप से आरोपित नहीं किया जाता।
- source_word: διακρινεῖ
  choice: न्याय करेगा
  rationale: राजकीय प्रसंग में क्रिया का विवेकपूर्वक निर्णय करने वाला अर्थ उपयुक्त है, यद्यपि ‘भेद करेगा’ या ‘अलग करेगा’ भी संभव हैं।
- source_word: ἡγιασμένου
  choice: पवित्र किए गए जन
  rationale: यूनानी में एकवचन संबंधकारक कृदंत संज्ञा की तरह प्रयुक्त है और सामूहिक पवित्र जन की ओर संकेत कर सकता है। ‘जन’ सामूहिक अर्थ बनाए रखता है और इसे अनिवार्यतः एक व्यक्ति नहीं बनाता।
theological_decisions:
- issue: ἡγιασμένου का संदर्भ और वचन
  choice: ‘पवित्र किए गए जन’ के रूप में सामूहिक अर्थ
  alternative: ‘पवित्र किए गए व्यक्ति’, ‘पवित्र जन’ या ‘अभिषिक्त/समर्पित जन’
  rationale: रूप व्याकरणतः एकवचन है, पर संदर्भ में सामूहिक प्रजा से जुड़ता है। मुख्य पाठ सामूहिक अर्थ को सामने रखता है, जबकि पादटिप्पणी यूनानी की संकुचित और संभाव्य संरचना को खुला रखती है।
- issue: διακρινεῖ का न्यायिक अथवा विभाजक अर्थ
  choice: ‘न्याय करेगा’
  alternative: ‘भेद करेगा’ या ‘अलग करेगा’
  rationale: राजा-संबंधी संदर्भ न्यायिक अर्थ का समर्थन करता है, लेकिन क्रिया के अन्य प्रमाणित अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘तपे हुए’ से अग्नि और धातु-शोधन का मूल बिंब बचता है। अंतिम खंड की यूनानी वाक्य-रचना की संकुचितता को डैश और पादटिप्पणी द्वारा दिखाया गया है, बिना उसे किसी एक धार्मिक व्याख्या में पूरी तरह बाँधे।
