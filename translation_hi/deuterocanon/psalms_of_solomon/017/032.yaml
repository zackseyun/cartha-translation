  text: And he will have peoples of the nations serve him under his yoke[d][c][b][a], and he will glorify the Lord in a place conspicuous to all the earth.
translation:
  language: hi
  text: और उसके पास राष्ट्रों के लोग होंगे, जो उसके जुए के नीचे उसकी सेवा करेंगे; और वह सारी पृथ्वी की दृष्टि में एक प्रमुख स्थान पर प्रभु की महिमा करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी पृथ्वी में प्रसिद्ध स्थान पर।” यूनानी शब्द का अर्थ ऐसा स्थान भी हो सकता है जो विशिष्ट, प्रसिद्ध, या सबकी दृष्टि में हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕξει ... δουλεύειν
  choice: उसके पास ... लोग होंगे, जो ... उसकी सेवा करेंगे
  rationale: ἔχω के भविष्यकाल और कर्म के साथ आए infinitive को अधिकार/अधीनता के भाव में रखा गया है। हिन्दी में संबंधवाचक उपवाक्य इस अर्थ को स्वाभाविक रूप से व्यक्त करता है और इसे केवल प्रेरणार्थक ‘वह उनसे सेवा करवाएगा’ नहीं बनाता।
- source_word: λαοὺς ἐθνῶν
  choice: राष्ट्रों के लोग
  rationale: λαοί और ἔθνη दोनों की उपस्थिति बनाए रखी गई है; इसे समय से पहले केवल ‘अन्यजाति’ जैसे धार्मिक पारिभाषिक शब्द में नहीं समेटा गया।
- source_word: δουλεύειν
  choice: सेवा करेंगे
  rationale: क्रिया सेवा और अधीनता दोनों का संकेत दे सकती है। साथ का ‘जुए के नीचे’ अधीनता का कठोर भाव स्पष्ट करता है, इसलिए मुख्य पाठ में ‘दास होंगे’ आवश्यक नहीं है।
- source_word: ζυγὸν
  choice: जुए
  rationale: शासन या प्रभुत्व कहकर रूपक मिटाने के बजाय यूनानी का ठोस ‘जुआ’ रूपक सुरक्षित रखा गया है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος के धार्मिक पदनाम के लिए स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: δοξάσει
  choice: महिमा करेगा
  rationale: δοξάζω का धार्मिक भार और सक्रिय अर्थ सीधे बनाए रखता है।
- source_word: ἐν ἐπισήμῳ πάσης τῆς γῆς
  choice: सारी पृथ्वी के सामने एक प्रमुख स्थान पर
  rationale: ἐπίσημος के ‘चिह्नित, प्रमुख, सबकी दृष्टि में’ अर्थ और वाक्यांश के स्थानवाचक स्वरूप को बनाए रखते हुए अस्वाभाविक तुलनात्मक अर्थ ‘सारी पृथ्वी से ऊपर’ से बचा गया है।
theological_decisions:
- issue: राष्ट्रों के लोगों की सेवा का स्वरूप
  choice: ‘उसके जुए के नीचे उसकी सेवा करेंगे’—सेवा और अधीनता दोनों को साथ रखा गया।
  alternative: ‘उसके दास होंगे’ या ‘उसके शासन के अधीन होंगे।’
  rationale: यूनानी में δουλεύειν अधीन सेवा का भाव देता है, जबकि ζυγός उसे और स्पष्ट करता है। चुना हुआ रूप दासता को अतिरंजित किए बिना मूल की तनावपूर्ण छवि बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘जुआ’, ‘प्रभु’ और ‘महिमा करना’ जैसे मूल रूपक तथा धार्मिक पद बनाए रखे गए हैं; कठिन यूनानी रचना को संबंधवाचक उपवाक्य द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
