base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/002.yaml
  text: And what is the span of a man's life on the earth? According to his span[b][a], so also is his hope upon him.
translation:
  language: hi
  text: और पृथ्वी पर मनुष्य के जीवन की अवधि कितनी है? उसकी जीवन की अवधि के अनुरूप ही उसकी आशा भी उस पर टिकी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अंतिम सर्वनाम को मनुष्य की ओर संकेत करने वाला मानकर: “उसकी जीवन की अवधि के अनुरूप ही उसकी आशा भी उसी पर टिकी है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: χρόνος ζωῆς ἀνθρώπου
  choice: मनुष्य के जीवन की अवधि
  rationale: यह पदबंध मनुष्य के जीवन की सीमित, मापी हुई अवधि को व्यक्त करता है; ‘अवधि’ आधुनिक हिन्दी में ‘समय’ की अपेक्षा इस आशय को अधिक स्पष्ट करता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: यूनानी स्थानवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: κατὰ τὸν χρόνον αὐτοῦ
  choice: उसकी जीवन-अवधि के अनुरूप
  rationale: κατά यहाँ अनुरूपता या अनुपात सूचित करता है; यह अनुवाद केवल ‘जब तक’ वाला कालगत अर्थ देने के बजाय आशा और जीवन-अवधि के बीच तुलना बनाए रखता है।
- source_word: ἐλπὶς
  choice: आशा
  rationale: यह ἐλπίς का सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी पर्याय है।
- source_word: ἐπʼ αὐτόν
  choice: उस पर रखी
  rationale: मुख्य पाठ अंतिम सर्वनाम को ‘मनुष्य’ की ओर संकेत करने वाला मानता है, जिससे अगले पद में परमेश्वर पर आशा रखने का विरोधाभास उभरता है; यूनानी व्याकरण में ‘अवधि/समय’ की ओर संकेत भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: आशा किस पर टिकी है—मनुष्य पर या उसकी जीवन-अवधि पर?
  choice: मुख्य पाठ में ‘उस पर’ का संकेत मनुष्य की ओर है।
  alternative: 'सर्वनाम को उसकी जीवन-अवधि की ओर संकेत करने वाला समझा जा सकता है: ‘उस अवधि पर उसकी आशा भी टिकी है।’'
  rationale: ἀνθρώπου और χρόνος दोनों पुल्लिंग हैं, इसलिए ἐπʼ αὐτόν व्याकरणतः दोनों में से किसी की ओर लौट सकता है। अगले पद में परमेश्वर पर आशा का उल्लेख मनुष्य-वाचक अर्थ का समर्थन करता है, पर वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मनुष्य’ एकवचन सामान्य मानव व्यक्ति को सूचित करता है। ‘के अनुरूप’ मूल के तुलनात्मक/आनुपातिक बल को सुरक्षित रखता है।
