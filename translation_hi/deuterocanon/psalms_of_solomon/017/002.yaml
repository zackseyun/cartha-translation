  text: καὶ τίς ὁ χρόνος ζωῆς ἀνθρώπου ἐπὶ τῆς γῆς; κατὰ τὸν χρόνον αὐτοῦ καὶ ἡ ἐλπὶς αὐτοῦ ἐπʼ αὐτόν.
