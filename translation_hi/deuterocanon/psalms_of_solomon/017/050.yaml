base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/050.yaml
  text: Blessed are those who are alive in those days[a], to see the good things of Israel in the assembly of the tribes. May God bring it to pass!
translation:
  language: hi
  text: धन्य हैं वे जो उन दिनों जीवित होंगे[a] और गोत्रों की सभा में इस्राएल की भलाई देखेंगे। परमेश्वर इसे पूरा करे!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उन दिनों जन्म लेंगे।”
    reason: γενόμενοι का शाब्दिक अर्थ ‘अस्तित्व में आए/जन्मे’ भी हो सकता है, यद्यपि प्रसंग में ‘उन दिनों जीवित होंगे’ अधिक स्वाभाविक है।
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह बाइबलीय धन्यता-वचन की प्रचलित और गरिमापूर्ण अभिव्यक्ति है; यह केवल भावनात्मक प्रसन्नता या सांसारिक सौभाग्य तक अर्थ को सीमित नहीं करती।
- source_word: οἱ γενόμενοι ἐν ταῖς ἡμέραις ἐκείναις
  choice: वे जो उन दिनों जीवित होंगे
  rationale: γενόμενοι का मूल भाव ‘अस्तित्व में आना/होना’ है। इस भविष्यपरक प्रसंग में यह उन लोगों को सूचित करता है जो उस समय जीवित रहकर उसे देखेंगे; ‘जन्म लेंगे’ भी संभव है और उसे पाद-टिप्पणी में रखा गया है।
- source_word: ἰδεῖν
  choice: देखेंगे
  rationale: ग्रीक अनंत क्रिया धन्य कहे गए लोगों के अनुभव का उद्देश्य बताती है। हिन्दी में समन्वित भविष्यकालीन वाक्य अधिक स्वाभाविक है और अर्थ को सुरक्षित रखता है।
- source_word: τὰ ἀγαθὰ Ἰσραήλ
  choice: इस्राएल की भलाई
  rationale: τὰ ἀγαθά से मिलने वाली अच्छी वस्तुएँ, हित या कल्याण अभिप्रेत हो सकते हैं। ‘इस्राएल की भलाई’ सहज हिन्दी है और संबंधकारक की दिशा को अनावश्यक रूप से संकीर्ण नहीं करती।
- source_word: ἐν συναγωγῇ φυλῶν
  choice: गोत्रों की सभा में
  rationale: συναγωγή यहाँ इकट्ठा होने या सभा का बोध कराता है। यह चयन इस्राएल के गोत्रों के सामूहिक एकत्रीकरण का चित्र बनाए रखता है।
- source_word: ποιῆσαι ὁ θεός
  choice: परमेश्वर इसे पूरा करे!
  rationale: अंतिम संक्षिप्त पदबंध को पूर्ववर्ती वाक्य से स्वतंत्र, प्रार्थनापूर्ण कामना के रूप में लिया गया है, जैसा यूनानी विराम-चिह्न और निकटवर्ती समान शैली सुझाते हैं।
theological_decisions:
- issue: अंतिम पदबंध ποιῆσαι ὁ θεός का वाक्यगत संबंध
  choice: 'स्वतंत्र प्रार्थनापूर्ण कामना: ‘परमेश्वर इसे पूरा करे!’'
  alternative: 'पूर्ववर्ती ‘भलाई’ को विशेषित करने वाला कथन: ‘जिसे परमेश्वर पूरा करेगा’'
  rationale: स्रोत-पाठ का ऊँचा बिंदु स्वतंत्र खंड का संकेत देता है, और संक्षिप्त अनंत-क्रियात्मक रचना कामना के रूप में समझी जा सकती है। इससे लेखक की आशापूर्ण प्रार्थना सुरक्षित रहती है, बिना यह दावा किए कि व्याकरण पूर्णतः निर्विवाद है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यपरक शैली रखी गई है। ‘धन्य’, ‘गोत्र’ और ‘सभा’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
