base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/041.yaml
  text: And he himself will be pure from sin[a], to rule great peoples, to rebuke rulers[c][b], and to remove sinners by the strength of his word.
translation:
  language: hi
  text: और वह स्वयं पाप से निर्मल होगा[a], ताकि महान जनसमुदायों पर शासन करे, शासकों को फटकारे और वचन की सामर्थ्य से पापियों को हटा दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाप से शुद्ध।”
    reason: lexical_alternative
  - marker: b
    text: या, “पापियों को निकाल बाहर करे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρὸς ἀπὸ ἁμαρτίας
  choice: पाप से निर्मल
  rationale: यह नैतिक शुद्धता को व्यक्त करता है और καθαρός की शुद्धता-संबंधी छवि को बनाए रखता है; ‘निर्मल’ आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: ἄρχειν
  choice: शासन करे
  rationale: यह अधिकारपूर्वक शासन करने का सीधा अर्थ देता है और राजकीय संदर्भ के अनुकूल है।
- source_word: λαοὺς μεγάλους
  choice: महान जनसमुदायों
  rationale: बहुवचन λαούς को अलग-अलग सामूहिक समुदायों के रूप में रखता है और μεγάλους का अर्थ ‘महान’ से व्यक्त करता है, बिना इसे अनिवार्यतः राष्ट्रों तक सीमित किए।
- source_word: ἐλέγξαι
  choice: फटकारे
  rationale: शासकों के प्रति अधिकारपूर्ण भर्त्सना का भाव स्पष्ट और सहज हिन्दी में व्यक्त होता है।
- source_word: ἐξᾶραι
  choice: हटा दे
  rationale: क्रिया के व्यापक अर्थ—दूर करना या निकाल देना—को बनाए रखता है, बिना यह तय किए कि यहाँ केवल निष्कासन ही अभिप्रेत है।
- source_word: ἐν ἰσχύϊ λόγου
  choice: वचन की सामर्थ्य से
  rationale: मूल यूनानी में λόγου के साथ कोई स्पष्ट स्वत्वसूचक सर्वनाम नहीं है। अतः ‘अपने’ जोड़े बिना वचन के प्रभावी सामर्थ्य का भाव रखा गया है।
theological_decisions:
- issue: वर्णित व्यक्ति की पाप से नैतिक निर्मलता
  choice: पाप से निर्मल होगा
  alternative: पाप से रहित होगा
  rationale: यह कथन की स्पष्ट नैतिक निर्मलता बनाए रखता है और καθαρός की शुद्धता की छवि को ‘रहित’ जैसे अधिक व्याख्यात्मक विकल्प से प्रतिस्थापित नहीं करता।
- issue: λόγου के स्वामी की पहचान
  choice: वचन की सामर्थ्य से
  alternative: अपने वचन की सामर्थ्य से
  rationale: संदर्भ इसे उस व्यक्ति के वचन के रूप में समझने की अनुमति देता है, पर यूनानी में ‘उसके/अपने’ स्पष्ट नहीं है; इसलिए अनावश्यक रूप से अस्पष्टता का समाधान नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। उद्देश्यसूचक τοῦ ἄρχειν को ‘ताकि’ से स्वाभाविक बनाया गया है; समानांतर क्रियाओं को एक ही वाक्य-रचना में रखा गया है।
