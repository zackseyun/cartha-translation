translation:
  language: hi
  text: और उसे सामर्थ्य के साथ ऊँचा उठा, ताकि वह अन्यायी शासकों को चकनाचूर कर दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे सामर्थ्य में ऊँचा उठा” अथवा “उसे सामर्थ्यपूर्वक उठा।”
    reason: ‘सामर्थ्य’ के लिए प्रयुक्त कर्मकारक रूप को रीति या साथ/साधन के भाव में समझा जा सकता है।
lexical_decisions:
- source_word: ὑψώσον
  choice: ऊँचा उठा
  rationale: दिए गए यूनानी पाठ में क्रिया का अर्थ ऊपर उठाना या प्रतिष्ठित करना है। आज्ञार्थक रूप को स्वाभाविक हिन्दी में रखा गया है, बिना ‘कमर बाँधने’ का ऐसा रूपक जोड़ने के जो प्रस्तुत स्रोत-पाठ में नहीं है।
- source_word: ἰσχὺν
  choice: सामर्थ्य में
  rationale: यह कर्मकारक रूप क्रियाविशेषणीय रीति या अवस्था बता सकता है। ‘सामर्थ्य में’ यूनानी की संक्षिप्तता और ‘सामर्थ्य के साथ’ की सम्भावना दोनों को खुला रखता है।
- source_word: τοῦ θραῦσαι
  choice: ताकि ... चकनाचूर कर दे
  rationale: संबंधकारक सहित अनंत क्रिया यहाँ उद्देश्य व्यक्त करती है। ‘चकनाचूर करना’ θραύω की प्रबल विध्वंसात्मक शक्ति को व्यक्त करता है।
- source_word: ἄρχοντας
  choice: शासकों
  rationale: यह शब्द शासन करने वाले अधिकारियों के लिए है; ‘शासक’ आधुनिक, स्पष्ट और पर्याप्त रूप से व्यापक है।
- source_word: ἀδίκους
  choice: अन्यायी
  rationale: विशेषण शासकों के नैतिक और सार्वजनिक अन्याय को बताता है। ‘अन्यायी’ राजनीतिक-न्यायिक संदर्भ में सहज है और अनावश्यक सांप्रदायिक अर्थ नहीं जोड़ता।
