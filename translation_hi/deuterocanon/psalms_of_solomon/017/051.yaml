base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/051.yaml
  text: May God hasten his mercy upon Israel[a]. He will rescue us from the uncleanness of profane enemies[c][b]. The Lord himself is our king forever and ever.
translation:
  language: hi
  text: परमेश्वर इस्राएल पर अपनी दया शीघ्र करे।[a] वह हमें अपवित्र शत्रुओं[c] की अशुद्धता[b] से छुड़ाएगा। प्रभु स्वयं सदा और सदा तक हमारा राजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भ में यूनानी पाठ में अनंत क्रिया ‘शीघ्र करना’ है; यहाँ उसे प्रार्थना-सदृश कामना के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
    reason: alternative_reading
  - marker: b
    text: या ‘दूषण’।
    reason: lexical_alternative
  - marker: c
    text: या ‘अधर्मी शत्रुओं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχύναι
  choice: शीघ्र करे
  rationale: वाक्य के आरम्भ में प्रयुक्त यूनानी अनंत क्रिया प्रार्थना अथवा कामना का भाव रखती है; ‘शीघ्र करे’ उसकी तात्कालिकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔλεος
  choice: दया
  rationale: यह परमेश्वर की करुणामय कृपा के लिए सीधा, सहज और व्यापक हिन्दी शब्द है; प्रसंग से परे कोई अतिरिक्त वाचा-संबंधी अर्थ नहीं जोड़ता।
- source_word: ῥύσεται
  choice: छुड़ाएगा
  rationale: भविष्यकाल का यह रूप आरम्भिक प्रार्थना के बाद भरोसे से कही गई मुक्ति की घोषणा है; ‘छुड़ाएगा’ संकट अथवा दूषण से बचाने का भाव स्पष्ट करता है।
- source_word: ἀκαθαρσίας
  choice: अशुद्धता
  rationale: यह शब्द धार्मिक तथा नैतिक अशुद्धि या दूषण दोनों का संकेत दे सकता है; ‘अशुद्धता’ इस अर्थ-क्षेत्र को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: βεβήλων
  choice: अपवित्र
  rationale: यह उन लोगों का वर्णन करता है जो पवित्र नहीं, धर्मविरुद्ध या ईश्वर-विमुख हैं; ‘अपवित्र’ निकटतम शब्द है और अशुद्धता की भाषा से स्वाभाविक रूप से जुड़ता है।
- source_word: Κύριος
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रचलित, गरिमापूर्ण हिन्दी संबोधन है और यहाँ इस्राएल के सच्चे शासक के रूप में उनके स्थान को व्यक्त करता है।
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: युगानुयुग
  rationale: यह यूनानी पद स्थायी और अनंत शासन पर बल देता है; ‘युगानुयुग’ आधुनिक बाइबलीय हिन्दी में संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
theological_decisions:
- issue: आरम्भिक ταχύναι का व्याकरणिक बल
  choice: 'प्रार्थना-सदृश कामना: ‘परमेश्वर ... शीघ्र करे।’'
  alternative: शाब्दिक अनंत क्रियात्मक रूप, जैसे ‘परमेश्वर का ... शीघ्र करना’, अथवा कथनात्मक ‘परमेश्वर ... शीघ्र करता है।’
  rationale: स्वतंत्र अनंत क्रिया को हिन्दी में यांत्रिक रूप से रखना अस्वाभाविक होगा। कामनार्थक रूप यूनानी की तात्कालिकता और प्रार्थनामय स्वर को सुरक्षित रखता है, पर इसे आज्ञा या निश्चित वर्तमानकालीन कथन नहीं बनाता।
- issue: शत्रुओं और अशुद्धता के बीच संबंध
  choice: ‘अपवित्र शत्रुओं की अशुद्धता से’
  alternative: ‘अपवित्र शत्रुओं से और अशुद्धता से’ अथवा ‘शत्रुओं द्वारा किए गए दूषण से’
  rationale: यूनानी संबंधकारक ἐχθρῶν βεβήλων को ἀκαθαρσίας से जोड़ता है। हिन्दी में संबंधसूचक रचना मूल अस्पष्टता बनाए रखती है कि अशुद्धता शत्रुओं की अपनी है या उनसे उत्पन्न दूषण।
- issue: अंतिम कालसूचक पद का बल
  choice: ‘युगानुयुग’
  alternative: ‘सदा और सदा तक’ या अधिक शाब्दिक ‘युग तक और आगे भी’
  rationale: मूल पद प्रभु के शासन की अनंत निरंतरता पर बल देता है। ‘युगानुयुग’ इस बल को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना कालक्रम की कृत्रिम व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य शैली रखी गई है। ‘प्रभु’, ‘दया’, ‘छुड़ाएगा’ और ‘युगानुयुग’ सामान्य पाठक के लिए परिचित हैं। पदचिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं; मूल यूनानी की प्रार्थनामय शुरुआत तथा अशुद्धता के स्रोत संबंधी संभावित अस्पष्टता सुरक्षित है।
