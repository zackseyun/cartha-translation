- source_word: γῆν
  choice: पृथ्वी
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘भूमि/देश’ हो सकता है। यहाँ व्यापक राजकीय परिप्रेक्ष्य के कारण ‘पृथ्वी’ मुख्य पाठ में रखा गया है, और स्थानीय अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  choice: अपने मुँह के वचन से
  rationale: 'मूल की सशक्त काव्यात्मक छवि को निकटता से रखा गया है: विनाश या न्याय किसी हथियार से नहीं, उसके मुख से निकले अधिकारपूर्ण वचन द्वारा होता है।'
- source_word: εἰς αἰῶνα
  choice: सदा के लिए
  rationale: यह आधुनिक हिन्दी में स्वाभाविक रूप से स्थायी अथवा अनंत अवधि का भाव व्यक्त करता है और मूल की गंभीरता बनाए रखता है।
theological_decisions:
- issue: यशायाह 11:4 की संभावित प्रतिध्वनि और मुख के वचन द्वारा मसीही राजा का न्याय
  choice: मुख के वचन से पृथ्वी को ‘चूर-चूर’ करने की सीधी और कठोर छवि बनाए रखी गई है।
  alternative: ‘अपनी आज्ञा से पृथ्वी को वश में करेगा’ अथवा यशायाह 11:4 के अनुरूप ‘पृथ्वी पर प्रहार करेगा’।
  rationale: मुद्रित स्रोत-पाठ κατάξει विनाशकारी बल प्रकट करता है। इसे केवल शासन या आदेश के अर्थ में नरम करना मूल के तनाव को घटा देता; वहीं ‘प्रहार करेगा’ संभवतः πατάξει पाठ-संशोधन पर निर्भर है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मुँह के वचन’ को अधिक बोलचाल के ‘कहे हुए शब्द’ में नहीं बदला गया, ताकि मूल की बाइबिलीय और काव्यात्मक छवि बनी रहे।
