base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/027.yaml
  text: to destroy lawless nations with the word of his mouth[a], to make nations flee from before him at his threat[c][b], and to convict sinners by the word of their heart.
translation:
  language: hi
  text: कि वह अपने मुँह के वचन से व्यवस्था-विहीन राष्ट्रों का नाश करे, अपनी धमकी से राष्ट्रों को अपने सामने से भगा दे, और पापियों को उनके हृदय की बात के द्वारा दोषी ठहराए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश संक्षिप्त है। इसका अर्थ यह भी हो सकता है कि वह पापियों को उनके अपने हृदय की बात या भीतरी अभिप्राय से उजागर करे अथवा उनका दोष सिद्ध करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλοθρεῦσαι
  choice: नाश करे
  rationale: यह क्रिया विनाश का प्रबल भाव रखती है; ‘नाश करे’ यूनानी की शक्ति को बनाए रखते हुए स्वाभाविक हिन्दी है और ‘समूल मिटा दे’ जैसी संभावित अतिशयोक्ति से बचती है।
- source_word: ἔθνη παράνομα
  choice: व्यवस्था-विहीन राष्ट्रों
  rationale: ἔθνη के लिए ‘राष्ट्रों’ व्यापक जनसमूहों को व्यक्त करता है, जबकि παράνομα में νόμος से जुड़ा नैतिक-विधिक भाव ‘व्यवस्था-विहीन’ द्वारा सुरक्षित रहता है।
- source_word: ἐν λόγῳ στόματος αὐτοῦ
  choice: अपने मुँह के वचन से
  rationale: यह अनुवाद मुख से निकले वचन द्वारा न्याय किए जाने की ठोस बिंबात्मकता को सुरक्षित रखता है।
- source_word: ἐν ἀπειλῇ αὐτοῦ
  choice: अपनी धमकी से
  rationale: ἐν यहाँ साधन का भाव दे सकता है; यह वाक्यांश उसकी धमकी के प्रभाव से राष्ट्रों के भागने को संक्षेप में व्यक्त करता है।
- source_word: φυγεῖν ἔθνη ἀπὸ προσώπου αὐτοῦ
  choice: राष्ट्रों को अपने सामने से भगा दे
  rationale: यूनानी में शाब्दिक रूप से राष्ट्रों के भागने का अनंत क्रियारूप है; हिन्दी में कारक रचना प्रसंगगत परिणाम को स्वाभाविक ढंग से व्यक्त करती है, और ἀπὸ προσώπου का आमने-सामने/उपस्थिति का बिंब ‘अपने सामने से’ में बना रहता है।
- source_word: ἐλέγξαι
  choice: दोषी ठहराए
  rationale: क्रिया में उजागर करने, झिड़कने और दोष सिद्ध करने के अर्थ संभव हैं। न्याय के इस प्रसंग में ‘दोषी ठहराए’ उसका न्यायिक बल व्यक्त करता है, पर संबंधित अस्पष्टता टिप्पणी में रखी गई है।
- source_word: ἐν λόγῳ καρδίας αὐτῶν
  choice: उनके हृदय की बात के द्वारा
  rationale: यूनानी का संक्षिप्त और असामान्य रूप हृदय के भीतरी कथन या अभिप्राय का संकेत दे सकता है। ‘हृदय’ को यूनानी के समान एकवचन रखते हुए हिन्दी में बोधगम्य अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: वचन के द्वारा मसीही/राजकीय न्याय
  choice: शासक का न्याय उसके मुख के वचन और धमकी के द्वारा प्रभावी होता हुआ प्रस्तुत किया गया है।
  alternative: वचन और धमकी को केवल उसकी सार्वभौम सत्ता के रूपक के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ स्वयं वचन, मुख और धमकी पर बल देता है, पर इनके कार्य करने की आगे की धर्मवैज्ञानिक व्याख्या नहीं करता; अनुवाद उसी तनाव और बिंब को बनाए रखता है।
- issue: पापियों को उनके हृदय की बात से दोषी ठहराना
  choice: 'वाक्यांश को साधन के अर्थ में रखा गया है: उनके अपने भीतरी कथन या अभिप्राय के द्वारा उनका दोष प्रकट या सिद्ध होता है।'
  alternative: इसे शासक के हृदय से निकले वचन के रूप में समझना, अथवा केवल ‘पापियों को उजागर करना’ कहना।
  rationale: αὐτῶν व्याकरणतः बहुवचन पापियों की ओर स्वाभाविक रूप से संकेत करता है, फिर भी संक्षिप्त यूनानी वाक्यांश अर्थगत तनाव रखता है; इसलिए मुख्य पाठ और पादटिप्पणी उसे जरूरत से अधिक निश्चित नहीं बनाते।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सहज बाइबिलीय शैली रखी गई है। आरम्भ का ‘कि’ यूनानी अनंत क्रियाओं की पूर्ववर्ती वाक्य पर निर्भरता को दर्शाता है। ‘राष्ट्र’ धार्मिक तकनीकी अर्थ वाले ‘अन्यजाति’ से बचता है; ‘व्यवस्था-विहीन’ παράνομα की νόμος-संबंधी ध्वनि बनाए रखता है।
