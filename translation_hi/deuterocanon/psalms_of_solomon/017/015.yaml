lexical_decisions:
- source_word: ἐν ἀλλοτριότητι
  choice: पराये की तरह
  rationale: यह पदबंध परायेपन या विदेशी होने की स्थिति व्यक्त करता है। प्रसंग में शत्रु की बाहरी/गैर-समुदायिक पहचान सम्भव है; यह अनुवाद उस अर्थ को रखता है और पूर्व सम्बन्ध टूटने का अनावश्यक संकेत नहीं देता।
- source_word: ὁ ἐχθρός
  choice: शत्रु
  rationale: मूल संज्ञा का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ἐποίησεν
  choice: काम किया
  rationale: यहाँ क्रिया का कोई व्यक्त कर्म नहीं दिया गया है; हिन्दी में ‘काम किया’ उसके निरपेक्ष प्रयोग और आचरण के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ὑπερηφανίᾳ
  choice: घमण्ड में आकर
  rationale: ὑπερηφανία के नकारात्मक आत्म-अभिमान को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἡ καρδία αὐτοῦ ἀλλοτρία
  choice: उसका हृदय ... पराया था
  rationale: विशेषण ἀλλοτρία को संज्ञेय विधेय ‘पराया था’ के रूप में रखकर ‘विदेशी/अलग/विमुख’ की वास्तविक अर्थ-बहुलता बचती है और पूर्व covenant सम्बन्ध टूटने को निश्चित नहीं किया जाता।
- source_word: ἀπὸ τοῦ θεοῦ ἡμῶν
  choice: हमारे परमेश्वर से
  rationale: ἀπό के पृथक्करण या दूरी के भाव का सीधा हिन्दी रूप।
theological_decisions:
- issue: ἀλλοτριότης और ἀλλοτρία को सम्बन्ध-विच्छेद मानें या विदेशी/परायेपन का संकेत
  choice: ‘पराये की तरह’ और ‘पराया था’
  alternative: ‘विमुख होकर’ और ‘विमुख था’
  rationale: ‘विमुख’ किसी पुराने सम्बन्ध से फिर जाने का संकेत दे सकता है, जबकि यूनानी शब्द यहाँ शत्रु के पराये या विदेशी होने को भी व्यक्त कर सकते हैं। चुना गया पाठ इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘पराया’ की पुनरावृत्ति मूल के ἀλλοτριότης/ἀλλοτρία शब्द-साम्य को यथासम्भव सुरक्षित रखती है।
