  yaml_path: translation/deuterocanon/psalms_of_solomon/017/014.yaml
  text: In the wrath of his splendor he sent them away as far as the west[a], and the rulers of the land to mockery[c][b]; and he did not spare.
translation:
  language: hi
  text: उसने अपने सौन्दर्य के क्रोध में उन्हें पश्चिम तक दूर भेज दिया[a], और देश के शासकों को उपहास के लिए भेज दिया[b]; और उसने बख्शा नहीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने सौन्दर्य के क्रोध में।” यह असामान्य अभिव्यक्ति यूनानी पाठ के अनुसार रखी गई है; “सौन्दर्य” का अनुवाद “महिमा” भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और देश के शासकों को उपहास का विषय बनने के लिए भेज दिया।” यूनानी में “दूर भेज दिया” की क्रिया दोनों कर्मों पर लागू हो सकती है।
    reason: syntactic_ambiguity
  - marker: c
    text: शाब्दिक रूप से, “और उसने नहीं बख्शा”; यूनानी में यह नहीं बताया गया कि किसे नहीं बख्शा।
    reason: implicit_object
lexical_decisions:
- source_word: ἐν ὀργῇ κάλλους αὐτοῦ
  choice: अपने सौन्दर्य के क्रोध में
  rationale: यूनानी पदबंध की असामान्य जननकारक रचना और उसके वास्तविक तनाव को बनाए रखा गया है। κάλλος का सीधा अर्थ ‘सौन्दर्य’ है; इसे प्रसंग के आधार पर ‘महिमा’ मानकर अर्थ स्पष्ट नहीं किया गया।
- source_word: ἐξαπέστειλεν
  choice: दूर भेज दिया
  rationale: क्रिया में ‘भेजने’ के साथ बाहर या दूर किए जाने का बल है। यह अनावश्यक रूप से अधिक व्याख्यात्मक ‘निर्वासित किया’ से बचता है।
- source_word: ἕως ἐπὶ δυσμῶν
  choice: पश्चिम तक
  rationale: δυσμαί सूर्यास्त की दिशा, अर्थात पश्चिम, को सूचित करता है; ἕως सीमा या दूरी का भाव देता है।
- source_word: τοὺς ἄρχοντας τῆς γῆς
  choice: देश के शासकों को
  rationale: ἄρχοντες के राजनीतिक अर्थ के लिए ‘शासक’ स्वाभाविक है। γῆ यहाँ प्रसंगानुसार ‘देश’ हो सकता है, यद्यपि ‘पृथ्वी’ भी संभव है।
- source_word: εἰς ἐμπαιγμόν
  choice: उपहास का पात्र बना दिया
  rationale: शाब्दिक ‘उपहास के लिए’ हिन्दी में अधूरा लगता है। यह रूप उनके सार्वजनिक तिरस्कार का भाव स्वाभाविक ढंग से व्यक्त करता है और ἐξαπέστειλεν के साझा शासन को अर्थतः स्पष्ट करता है।
- source_word: οὐκ ἐφείσατο
  choice: उसने किसी को नहीं बख्शा
  rationale: यूनानी में कर्म व्यक्त नहीं है। हिन्दी में निरपेक्ष भाव को सुबोध रखने के लिए ‘किसी को’ जोड़ा गया है, पर संभावित निहित कर्म को निश्चित समूह तक सीमित नहीं किया गया।
theological_decisions:
- issue: αὐτοῦ का संदर्भ और κάλλους का अर्थ
  choice: ‘अपने सौन्दर्य के क्रोध में’—कर्ता के सौन्दर्य को ही रखा गया
  alternative: ‘अपनी महिमा के प्रकोप में’ अथवा इसे परमेश्वर की दिव्य महिमा मानना
  rationale: पद स्वयं कर्ता को परमेश्वर नहीं बताता, और निकटवर्ती प्रसंग में संदर्भ किसी मानवीय शासक का हो सकता है। इसलिए धर्मवैचारिक पहचान आरोपित नहीं की गई और κάλλους का प्रत्यक्ष अर्थ सुरक्षित रखा गया।
- issue: οὐκ ἐφείσατο का निहित कर्म
  choice: ‘किसी को नहीं बख्शा’
  alternative: ‘उन्हें नहीं बख्शा’ या केवल ‘नहीं बख्शा’
  rationale: यूनानी में स्पष्ट कर्म नहीं है। ‘उन्हें’ संभावित संदर्भ को अनावश्यक रूप से निश्चित करता, जबकि हिन्दी में केवल ‘नहीं बख्शा’ अप्राकृतिक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। असामान्य यूनानी पदबंध को मुख्य पाठ में यथासंभव सुरक्षित रखा गया है, जबकि वाक्य-विन्यास और निहित कर्म की अस्पष्टता पादटिप्पणियों में दर्शाई गई है।
