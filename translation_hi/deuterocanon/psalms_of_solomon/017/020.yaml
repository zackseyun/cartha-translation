  text: Those who loved the assemblies of the the pious fled from them; their scattering by lawless men spread over all the earth, because heaven held back from dripping rain upon the earth.
translation:
  language: hi
  text: धर्मनिष्ठ लोगों की सभाओं से प्रेम रखनेवाले उनसे भाग गए[a]; अधर्मियों के हाथों उनका बिखराव सारी धरती पर हुआ[b], क्योंकि आकाश ने धरती पर वर्षा बरसाना रोक दिया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनसे’ का संदर्भ मूल पाठ में स्पष्ट नहीं है।
    reason: ambiguity
  - marker: b
    text: ‘बिखराव’ का अनुवाद ‘तितर-बितर होना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक अर्थ: ‘आकाश ने धरती पर वर्षा टपकाने को रोक रखा था।’'
    reason: literal_rendering
lexical_decisions:
- source_word: ἔφυγοσαν
  choice: भाग गए
  rationale: क्रिया आकस्मिक पलायन या बच निकलने का भाव रखती है; ‘भाग गए’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: συναγωγὰς
  choice: सभाओं
  rationale: यह शब्द एकत्र होनेवाले समुदायों अथवा उनकी बैठकों को दर्शाता है। ‘सभाओं’ सामूहिक और औपचारिक भाव को बनाए रखता है, पर किसी बाद की संस्थागत धारणा को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ὁσίων
  choice: धर्मनिष्ठ लोगों
  rationale: ὅσιος यहाँ भक्ति, निष्ठा और धार्मिक आचरण पर बल देता है। ‘धर्मनिष्ठ लोग’ इस अर्थ को ‘संतों’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है और बाद की कलीसियाई उपाधि का संकेत नहीं देता।
- source_word: σκορπισμὸς
  choice: बिखराव
  rationale: संज्ञा लोगों के अलग-अलग स्थानों में बिखेर दिए जाने की घटना बताती है। ‘बिखराव’ चित्रात्मक भी है और ‘विस्थापन’ जैसे अधिक तकनीकी शब्द से अधिक निकट है।
- source_word: ἀνόμων
  choice: अधर्मियों
  rationale: शब्द ऐसे लोगों को दर्शाता है जो व्यवस्था या धर्म-विधि का उल्लंघन करते हैं। ‘अधर्मी’ इसके नैतिक और विधिक दोनों रंगों को पर्याप्त रूप से बनाए रखता है।
- source_word: ἀνέσχεν
  choice: रोक दिया था
  rationale: यहाँ क्रिया रोक रखने या न होने देने का भाव व्यक्त करती है; हिन्दी में ‘रोक दिया था’ वर्षा न होने की छवि को सहज ढंग से प्रस्तुत करता है।
- source_word: στάξαι ὑετὸν
  choice: वर्षा बरसाना
  rationale: στάζω का शाब्दिक अर्थ बूँद-बूँद टपकाना है, पर ‘वर्षा बरसाना’ हिन्दी में स्वाभाविक है और आकाश से वर्षा रोके जाने का मूल चित्र सुरक्षित रखता है; शाब्दिक बिंब पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ὅσιοι की सामुदायिक पहचान
  choice: धर्मनिष्ठ लोग
  alternative: पवित्र जन / संत
  rationale: मूल शब्द ἅγιοι नहीं, बल्कि ὅσιοι है और इस पुस्तक में धार्मिक निष्ठा वाले समुदाय की ओर संकेत कर सकता है। इसलिए ऐसी हिन्दी चुनी गई है जो समुदाय की धर्मनिष्ठा बताए, पर उसे बाद की तकनीकी ‘संत’ उपाधि न बनाए।
- issue: αὐτῶν के संदर्भ की अस्पष्टता
  choice: उनसे
  alternative: उन सभाओं से / उन अधर्मियों से
  rationale: मूल यूनानी में सर्वनाम का संदर्भ इस पद के भीतर पूरी तरह स्पष्ट नहीं है। किसी एक संदर्भ को निश्चित कर देने के बजाय हिन्दी में सर्वनाम बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘धर्मनिष्ठ लोग’ मूल ὅσιοι के भक्ति-निष्ठा संबंधी अर्थ को व्यक्त करता है; ‘सभाएँ’ और ‘बिखराव’ मूल की संज्ञात्मक संरचना को यथासंभव बनाए रखते हैं।
