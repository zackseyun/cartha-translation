lexical_decisions:
- source_word: εὐπρέπεια
  choice: वैभव
  rationale: यह शब्द शोभा, गरिमा और राजसी भव्यता का बोध कराता है। ‘वैभव’ दृश्य उत्कृष्टता और राजकीय गरिमा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔγνω
  choice: जाना था
  rationale: मूल क्रिया का सामान्य अर्थ ‘जानना’ है, पर प्रसंग में इसमें पूर्वज्ञान, स्वीकृति या चुनाव की छाया संभव है। मुख्य पाठ में ‘जाना था’ रखकर इस व्यापकता और धर्मवैज्ञानिक तनाव को सुरक्षित रखा गया है।
- source_word: ἀναστῆσαι
  choice: खड़ा करना
  rationale: कारणवाचक अनंत रूप किसी को उठाने, खड़ा करने या स्थापित करने का अर्थ देता है। ‘खड़ा करना’ मूल बिंब को बनाए रखता है; राजकीय नियुक्ति का भाव प्रसंग से प्रकट होता है।
- source_word: ἐπʼ οἶκον Ἰσραήλ
  choice: इस्राएल के घराने पर
  rationale: यह पदबंध इस्राएल-समुदाय पर अधिकार या शासन का संकेत देता है। ‘घराना’ मूल के सामूहिक और वाचागत भाव को बनाए रखता है।
- source_word: παιδεῦσαι
  choice: अनुशासित करना
  rationale: क्रिया में शिक्षा देना, प्रशिक्षण देना और अनुशासन में रखना—ये सभी भाव हो सकते हैं। ‘अनुशासित करना’ निकट अर्थ देता है, जबकि पादटिप्पणी अन्य संभावनाएँ सुरक्षित रखती है।
theological_decisions:
- issue: राजा के विषय में परमेश्वर के ज्ञान को साधारण ज्ञान, पूर्वज्ञान, चुनाव या अनुमोदन के रूप में समझना
  choice: जिसे परमेश्वर ने जाना था
  alternative: जिसे परमेश्वर ने पहले से जाना था / स्वीकार किया था / चुना था
  rationale: ग्रीक ἔγνω व्यापक है और सम्भवतः सामी ‘जानने’ की अवधारणा की धर्मवैज्ञानिक गहराई रखता है। स्पष्ट रूप से ‘पहले से जाना’ या ‘चुना’ कहना किसी एक व्याख्या को अनावश्यक रूप से निश्चित कर देता; अतः मूल की अस्पष्टता बनाए रखी गई है।
- issue: दो अनंत क्रियाओं का परमेश्वर के ज्ञान से सम्बन्ध
  choice: द्विबिंदु के बाद उद्देश्य अथवा व्याख्या के रूप में प्रस्तुत
  alternative: ‘उसे खड़ा करने और अनुशासित करने में’ परमेश्वर ने इसे पहचाना
  rationale: ἀναστῆσαι और παιδεῦσαι को अनंत रूपों के रूप में बनाए रखना उनके उद्देश्यात्मक अथवा व्याख्यात्मक बल को सुरक्षित रखता है; उन्हें केवल कालगत परिस्थितियों में बदलना वाक्य के तनाव को समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘इस्राएल का घराना’ सामूहिक बाइबलीय अभिव्यक्ति को सुरक्षित रखता है। द्विबिंदु मूल वाक्य की कठिन संरचना में अनंत क्रियाओं को परमेश्वर के ‘जानने’ की व्याख्या या उद्देश्य के रूप में पढ़ने देता है, पर सम्बन्ध को अत्यधिक निश्चित नहीं करता।
