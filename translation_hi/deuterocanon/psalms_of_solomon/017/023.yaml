translation:
  language: hi
  text: हे प्रभु, देखिए और उनके लिए उनके राजा, दाऊद के पुत्र, को उस समय पर खड़ा कीजिए जिसे आपने देखा है, हे परमेश्वर, ताकि वह आपके सेवक इस्राएल पर राज्य करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδε
  choice: देखिए
  rationale: प्रार्थनात्मक संबोधन में यूनानी आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἀνάστησον
  choice: खड़ा कीजिए
  rationale: यहाँ किसी राजा को नियुक्त या प्रकट करने की याचना है; ‘खड़ा कीजिए’ मूल क्रिया की व्यापकता और संभावित मसीही संकेत को बिना अधिक व्याख्या के बनाए रखता है।
- source_word: τὸν βασιλέα αὐτῶν
  choice: उनके राजा
  rationale: निश्चित पदबंध और संबंधवाचक सर्वनाम दोनों सुरक्षित रखे गए हैं।
- source_word: υἱὸν Δαυίδ
  choice: दाऊद के पुत्र
  rationale: अनिर्दिष्ट ‘एक पुत्र’ जोड़ने के बजाय पदबंध को उसके पारंपरिक वंशगत अर्थ सहित प्रस्तुत किया गया है।
- source_word: εἰς τὸν καιρὸν ὃν ἴδες σύ
  choice: उस समय ... जिसे आपने ... चुना है
  rationale: शाब्दिक ‘जिसे आपने देखा’ हिन्दी में अभिप्रेत अर्थ स्पष्ट नहीं करता; संदर्भ में परमेश्वर द्वारा निर्धारित उपयुक्त समय का भाव है।
- source_word: παῖδά σου
  choice: आपके सेवक
  rationale: παῖς का अर्थ ‘बालक/पुत्र’ भी हो सकता है, पर इस्राएल के लिए सामूहिक संबोधन में ‘सेवक’ अधिक स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: υἱὸν Δαυίδ की निश्चितता
  choice: दाऊद के पुत्र
  alternative: दाऊद के एक पुत्र
  rationale: यूनानी में υἱόν के साथ अलग लेख नहीं है, पर यह τὸν βασιλέα αὐτῶν का समानाधिकरण है और उसी निश्चित व्यक्ति की पहचान बताता है; इसलिए ‘एक’ जोड़ना भ्रामक हो सकता है।
- issue: ἀνάστησον का अर्थ
  choice: खड़ा कीजिए
  alternative: उत्पन्न कीजिए / नियुक्त कीजिए
  rationale: ‘खड़ा कीजिए’ मूल की अर्थ-व्याप्ति को बनाए रखता है और यह तय नहीं करता कि आशय जन्म, सार्वजनिक प्रकटता या राजकीय नियुक्ति में से कौन-सा है।
- issue: इस्राएल और ‘सेवक’ का संबंध
  choice: आपके सेवक इस्राएल पर
  alternative: आपके सेवक को इस्राएल पर राज्य करने के लिए
  rationale: ग्रीक वाक्य-विन्यास में παῖδά σου, Ἰσραήλ का समानाधिकरण है; अतः ‘आपका सेवक’ इस्राएल को वर्णित करता है, राजा को नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण प्रार्थनात्मक शैली रखी गई है। ‘हे प्रभु’ और ‘हे परमेश्वर’ दोनों मूल के दो संबोधनों को सुरक्षित रखते हैं। वाक्य को मूल क्रम के निकट रखते हुए हिन्दी में पठनीय बनाया गया है।
