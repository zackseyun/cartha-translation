  yaml_path: translation/deuterocanon/psalms_of_solomon/017/018.yaml
  text: Those who loved the assemblies of the holy ones fled from them; like sparrows they flew away from their nest.
translation:
  language: hi
  text: पवित्र जनों की सभाओं से प्रेम करनेवाले उनसे भाग गए; वे गौरैयों की तरह अपने बसेरे से उड़ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγὰς ὁσίων
  choice: पवित्र जनों की सभाओं
  rationale: बहुवचन ‘सभाओं’ मूल συναγωγάς को बनाए रखता है, और ὁσίων को किसी विशेष संप्रदायगत पद के बजाय स्वाभाविक रूप से ‘पवित्र जनों’ के रूप में व्यक्त करता है।
- source_word: ἔφυγοσαν ἀπʼ αὐτῶν
  choice: उनसे दूर भाग गए
  rationale: ἀπʼ αὐτῶν के अनिर्दिष्ट बहुवचन संकेत ‘उनसे’ को बिना उसका संदर्भ अपनी ओर से तय किए सुरक्षित रखा गया है।
- source_word: ὡς στρουθία
  choice: गौरैयों के समान
  rationale: στρουθία छोटे पक्षियों, विशेषतः गौरैयों, की छवि देता है; ‘गौरैयों’ से मूल उपमा स्पष्ट और सहज रहती है।
- source_word: κοίτης
  choice: बसेरे
  rationale: κοίτη का मूल अर्थ लेटने या विश्राम करने का स्थान है। पक्षियों के संदर्भ में ‘बसेरा’ स्वाभाविक है और ‘घोंसला’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: ὅσιοι की पहचान
  choice: पवित्र जन
  alternative: भक्त जन / संत
  rationale: ‘पवित्र जन’ मूल शब्द का नैतिक-धार्मिक भाव बनाए रखता है और बाद की किसी विशिष्ट उपाधि या संप्रदायगत अर्थ को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘उनसे’ का संदर्भ मूल की तरह खुला छोड़ा गया है और पक्षियों की उपमा को सहज हिन्दी में प्रस्तुत किया गया है।
