  text: God did not have mercy on them[b][a]. He searched out their offspring and did not leave one of them.
translation:
  language: hi
  text: परमेश्वर ने उन पर दया नहीं की। उसने उनके वंश[a] को ढूँढ़ निकाला और उनमें से एक को भी नहीं छोड़ा।
  philosophy: optimal-equivalence
  footnotes:
