    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλέησεν
  choice: दया नहीं की
  rationale: ἐλεέω का सीधा अर्थ दया करना या करुणा दिखाना है। न्याय के इस प्रसंग में भी ‘दया नहीं की’ मूल शब्दावली और उसकी धार्मिक गंभीरता को सुरक्षित रखता है; इसे ‘नहीं बख्शा’ कहना पास के भिन्न यूनानी क्रिया-प्रयोग के साथ अंतर को धुँधला कर सकता है।
- source_word: ἐξερεύνησεν
  choice: ढूँढ़ निकाला
  rationale: क्रिया गहन या पूरी तरह खोजने का भाव देती है। ‘ढूँढ़ निकाला’ दंडात्मक खोज के संदर्भ में स्वाभाविक हिन्दी है और सफलतापूर्वक पता लगाने का भाव व्यक्त करता है।
- source_word: σπέρμα
  choice: वंश
  rationale: यहाँ शब्द शाब्दिक बीज नहीं, उनकी संतति या वंश को सूचित करता है। ‘वंश’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: οὐκ ἀφῆκεν αὐτῶν ἕνα
  choice: उनमें से एक को भी नहीं छोड़ा
  rationale: यह हिन्दी प्रयोग यूनानी वाक्य की संरचना और पूर्ण विनाश के भाव—एक भी शेष न रहने—दोनों को स्पष्ट रूप से बनाए रखता है।
