base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/042.yaml
  text: And he will not grow weak in his days in his God[a], because God has made him powerful in the Holy Spirit, and wise in the counsel of understanding[c][b], with strength and righteousness.
translation:
  language: hi
  text: और वह अपने दिनों में अपने परमेश्वर पर भरोसा रखते हुए[a] निर्बल न होगा, क्योंकि परमेश्वर ने उसे पवित्र आत्मा में[b] सामर्थी और विवेकपूर्ण परामर्श में बुद्धिमान बनाया है—बल और धार्मिकता[c] के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने परमेश्वर के सहारे।’
    reason: ἐπὶ θεῷ αὐτοῦ आधार, निर्भरता या सहारे का भाव व्यक्त कर सकता है।
  - marker: b
    text: या, ‘पवित्र आत्मा के द्वारा।’
    reason: ἐν यहाँ क्षेत्र (‘में’) या साधन (‘के द्वारा’) दोनों दर्शा सकता है।
  - marker: c
    text: या, ‘न्याय।’
    reason: δικαιοσύνη का अर्थ प्रसंगानुसार धार्मिकता या न्याय हो सकता है।
lexical_decisions:
- source_word: ἀσθενήσει
  choice: निर्बल न होगा
  rationale: भविष्यकालीन क्रिया शारीरिक या प्रभावकारी दुर्बलता को व्यक्त कर सकती है। ‘निर्बल न होगा’ यूनानी के सीधे अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπὶ θεῷ αὐτοῦ
  choice: अपने परमेश्वर पर भरोसा रखते हुए
  rationale: ἐπί के साथ संप्रदान कारक यहाँ आधार या निर्भरता का भाव देता है। हिन्दी में ‘पर भरोसा रखना’ इस संबंध को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: κατηργάσατο
  choice: बनाया है
  rationale: 'इस असामान्य प्रयोग में क्रिया परिणाम बताती है: परमेश्वर ने उसे सामर्थी और बुद्धिमान किया। ‘बनाया है’ स्पष्ट है और प्रसंग से अधिक अर्थ नहीं जोड़ता।'
- source_word: δυνατὸν
  choice: सामर्थी
  rationale: यह शब्द क्षमता और शक्ति दोनों का भाव रखता है। ‘सामर्थी’ dignified और आधुनिक हिन्दी में उपयुक्त है।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: ἐν साधन या क्षेत्र—दोनों का संकेत दे सकता है। ‘में’ मूल संरचना और उसकी कुछ अस्पष्टता को सुरक्षित रखता है; ‘के द्वारा’ को पादटिप्पणी में दिया गया है।
- source_word: σοφὸν ἐν βουλῇ συνέσεως
  choice: समझ-बूझ की सम्मति में बुद्धिमान
  rationale: यह अनुवाद बुद्धि को ऐसी सम्मति से जोड़ता है जिसकी विशेषता समझ-बूझ है, और यूनानी संबंधवाचक संरचना को यथासंभव बनाए रखता है।
- source_word: ἰσχύος
  choice: बल
  rationale: ‘बल’ ἰσχύς के शक्ति या सामर्थ्य के अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यहाँ नैतिक खराई का अर्थ उपयुक्त है, पर न्याय का भाव भी संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: क्या πνεύματι ἁγίῳ को निश्चित रूप से ‘पवित्र आत्मा’ माना जाए और ἐν को क्षेत्र या साधन के रूप में लिया जाए
  choice: मुख्य पाठ में ‘पवित्र आत्मा में’
  alternative: ‘पवित्र आत्मा के द्वारा’; या गुणात्मक अर्थ में ‘पवित्र आत्मिक सामर्थ्य में’
  rationale: पूर्वसर्ग के बाद यूनानी में निश्चित उपपद का न होना अनिवार्यतः अनिश्चितता सिद्ध नहीं करता। प्रसंग एक विशिष्ट पवित्र आत्मा की ओर संकेत कर सकता है, जबकि ἐν साधन या क्षेत्र दोनों हो सकता है। मुख्य पाठ परिचित धार्मिक पद को रखता है, पर ‘में’ द्वारा साधनात्मक अर्थ को अनिवार्य नहीं बनाता।
- issue: δικαιοσύνης का नैतिक धार्मिकता या सार्वजनिक न्याय के रूप में अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: पद शासक के नैतिक चरित्र और न्यायकारी शासन दोनों का संकेत दे सकता है। मुख्य पाठ में व्यापक नैतिक अर्थ रखा गया है और न्याय को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु काव्यात्मक और गरिमामय स्वर बनाए रखा गया है। ‘समझ-बूझ की सम्मति’ मूल की घनी संबंधवाचक अभिव्यक्ति को सुरक्षित रखती है; डैश अंतिम ‘बल और धार्मिकता’ को पूरे वर्णन से जोड़ता है।
