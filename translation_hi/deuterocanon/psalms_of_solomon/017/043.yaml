lexical_decisions:
- source_word: εὐλογία
  choice: आशीष
  rationale: यह संज्ञा यहाँ सीधे रूप में प्रभु से मिलने वाली आशीष को दर्शाती है; ‘आशीष’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: Κυρίου
  choice: प्रभु की
  rationale: यूनानी संबंधकारक को हिन्दी में ‘प्रभु की’ से व्यक्त किया गया है।
- source_word: μετʼ αὐτοῦ
  choice: उसके साथ
  rationale: μετά संबंधकारक के साथ सामान्यतः ‘साथ’ का अर्थ देता है; यह अनुवाद बिना अतिरिक्त व्याख्या के संबंधपरक भाव बनाए रखता है।
- source_word: ἐν ἰσχύϊ
  choice: सामर्थ्य में
  rationale: ἰσχύς बल, सामर्थ्य या शक्ति का बोध करा सकता है। ‘सामर्थ्य में’ यूनानी संरचना को बनाए रखते हुए गरिमापूर्ण हिन्दी देता है।
- source_word: '[implied copula]'
  choice: है
  rationale: यूनानी में क्रिया निहित है; हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए ‘है’ जोड़ा गया है।
