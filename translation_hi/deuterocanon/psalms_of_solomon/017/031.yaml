  verdict: revise
  source_fidelity: The paired terms πάροικος and ἀλλογενής are retained as ‘परदेशी’ and ‘विदेशी,’ and the singular verb sense is reflected by ‘बसेगा.’ The judgment clause is preserved, but the draft’s rendering ‘अपनी धार्मिकता की बुद्धि के अनुसार’ introduces an unwarranted ‘according to’ sense and is syntactically unnatural for ἐν σοφίᾳ δικαιοσύνης αὐτοῦ.
  naturalness: The opening and closing are clear and suitably elevated. ‘अपनी धार्मिकता की बुद्धि के अनुसार’ is not idiomatic modern Hindi. ‘अपनी धार्मिकता-भरी बुद्धि से’ is natural while representing the close relationship between wisdom and righteousness without adding a doctrinal interpretation.
  terminology: ‘धार्मिकता’ is retained for δικαιοσύνη, consistent with the supplied theological decision, though its judicial implication is appropriately preserved in the alternative footnote. ‘राष्ट्रों’ is preferable to ‘जातियों’ for ἔθνη in contemporary Hindi, avoiding an unintended association with caste while retaining the distinction from ‘लोगों’ (λαούς). ‘सेला’ appropriately preserves the uncertain liturgical marker.
  issues:
  - severity: medium
    issue: The phrase ‘अपनी धार्मिकता की बुद्धि के अनुसार’ renders ἐν as ‘के अनुसार’ and is awkward Hindi.
    rationale: ἐν σοφίᾳ indicates the means/sphere of judgment (‘in/with wisdom’), not a standard of conformity (‘according to’). The genitive δικαιοσύνης must remain closely related to wisdom.
  - severity: low
    issue: ‘जातियों’ for ἔθνη can be misconstrued in modern Hindi.
    rationale: ‘राष्ट्रों’ is the more direct contemporary equivalent of ‘nations’ and keeps λαούς / ἔθνη distinct as ‘लोगों और राष्ट्रों।’
