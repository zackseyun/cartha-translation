base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/031.yaml
  text: And no sojourner or foreigner shall sojourn among them any longer[a]; he will judge peoples and nations in the wisdom of his righteousness[d][c][b]. Selah.
translation:
  language: hi
  text: और न कोई परदेशी[a], न कोई विदेशी फिर कभी उनके बीच बसेगा; वह अपनी धार्मिकता-भरी बुद्धि से लोगों और राष्ट्रों का न्याय करेगा[b]। सेला[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी’ से आशय ऐसे गैर-स्थानीय व्यक्ति से है जो दूसरे लोगों के बीच निवास करता हो।
    reason: lexical_clarification
  - marker: b
    text: या, “वह अपनी न्यायपरायण बुद्धि से लोगों और राष्ट्रों का न्याय करेगा।”
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: ‘सेला’ संभवतः उपासना या संगीत में विराम का संकेत है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: πάροικος
  choice: परदेशी
  rationale: यह शब्द ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो किसी दूसरे समुदाय के बीच रहता है। ‘परदेशी’ आधुनिक हिन्दी में सहज है और ἀλλογενής के लिए प्रयुक्त ‘विदेशी’ से कुछ भेद बनाए रखता है।
- source_word: ἀλλογενής
  choice: विदेशी
  rationale: यह दूसरे मूल या देश से संबंधित व्यक्ति पर बल देता है; ‘विदेशी’ स्पष्ट और स्वाभाविक हिन्दी पर्याय है।
- source_word: παροικήσει
  choice: उनके बीच बसेगा
  rationale: क्रिया किसी समुदाय के बीच गैर-स्थानीय रूप में निवास करने का भाव रखती है। हिन्दी में ‘उनके बीच बसेगा’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λαούς
  choice: लोगों
  rationale: बहुवचन सामूहिक अर्थ को रखते हुए इसे ἔθνη के लिए प्रयुक्त ‘जातियों’ से अलग रखा गया है।
- source_word: ἔθνη
  choice: जातियों
  rationale: ‘जातियाँ’ यहाँ जनसमूहों या राष्ट्रों का बोध कराती है और ‘लोगों और जातियों’ की युग्मित अभिव्यक्ति को बनाए रखती है।
- source_word: σοφίᾳ
  choice: बुद्धि
  rationale: राजकीय न्याय के प्रसंग में यह विवेकपूर्ण समझ और निर्णय-क्षमता का उपयुक्त, प्रचलित शब्द है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: शब्द न्यायपूर्ण आचरण के साथ व्यापक नैतिक खराई भी व्यक्त कर सकता है। ‘धार्मिकता’ इस व्यापकता को रखती है; ‘न्यायपरायणता’ वैकल्पिक अर्थ है।
- source_word: διάψαλμα
  choice: सेला
  rationale: यह संभवतः उपासना या संगीत से जुड़ा संकेत है, पर इसका ठीक आशय अनिश्चित है; पारंपरिक लिप्यंतरण उस अनिश्चितता को सुरक्षित रखता है।
theological_decisions:
- issue: राजकीय न्याय के प्रसंग में δικαιοσύνη का अनुवाद
  choice: उसकी धार्मिकता
  alternative: उसकी न्यायपरायणता
  rationale: न्याय का प्रसंग ‘न्यायपरायणता’ का समर्थन करता है, पर यूनानी पद शासक के न्याय के पीछे के व्यापक नैतिक गुण को भी सूचित कर सकता है। इसलिए मुख्य पाठ में ‘धार्मिकता’ रखा गया और न्याय-संबंधी विकल्प पादटिप्पणी में दिया गया।
- issue: σοφίᾳ δικαιοσύνης के संबंध का निरूपण
  choice: अपनी धार्मिकता की बुद्धि के अनुसार
  alternative: अपनी न्यायपरायण बुद्धि से
  rationale: यूनानी संबंधवाचक रचना को किसी एक व्याख्या में पूरी तरह सीमित किए बिना मुख्य पाठ में निकटता से रखा गया है। विकल्प अधिक सहज है, पर वह ‘बुद्धि’ को सीधे ‘न्यायपरायण’ विशेषण से जोड़कर संबंध को स्पष्ट कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भजन-सुलभ रखी गई है। ‘परदेशी’ और ‘विदेशी’ के द्वारा निकटार्थी यूनानी शब्दों का यथासंभव भेद सुरक्षित है। ‘धार्मिकता की बुद्धि’ की कुछ औपचारिकता मूल यूनानी की संबंधवाचक अस्पष्टता बचाने के लिए स्वीकार की गई है।
