base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/034.yaml
  text: for nations to come from the end of the earth to see his glory[a], bringing her weakened sons as gifts[b],
translation:
  language: hi
  text: ताकि पृथ्वी के छोर से जातियाँ उसकी महिमा देखने आएँ और उसके[a] दुर्बल हो चुके पुत्रों[b] को भेंट के रूप में लाएँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी में स्त्रीलिंग ‘उसके’ है, जो संदर्भ में यरूशलेम की ओर संकेत करता है।
    reason: referent_clarification
  - marker: b
    text: या “दुर्बल पड़ चुके पुत्रों”; यूनानी शब्द का अर्थ “थक चुके” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεσθαι
  choice: आएँ
  rationale: यह आश्रित उद्देश्य/परिणामसूचक अनंत क्रिया है, जो पिछले पद के वाक्य से जुड़ी है; इसलिए इसे स्वतंत्र भविष्यकाल न बनाकर ‘ताकि … आएँ’ किया गया है।
- source_word: ἔθνη
  choice: जातियाँ
  rationale: यहाँ बहुवचन में गैर-इस्राएली जनसमुदाय व्यापक रूप से अभिप्रेत हैं। ‘जातियाँ’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से यहूदी–गैरयहूदी विरोध को तीखा नहीं करती।
- source_word: ἀπ’ ἄκρου τῆς γῆς
  choice: पृथ्वी के छोर से
  rationale: यूनानी में ‘छोर’ एकवचन है और वाक्यांश अत्यंत दूर स्थान का बोध कराता है; हिन्दी रूप मूल की संख्या और मुहावरेदार अर्थ दोनों रखता है।
- source_word: ἰδεῖν τὴν δόξαν αὐτοῦ
  choice: उसकी महिमा देखने
  rationale: सरल उद्देश्यसूचक रूप रखा गया है; ‘महिमा’ δόξα का प्रचलित और धर्मवैचारिक भार सँभालने वाला अनुवाद है।
- source_word: φέροντες δῶρα
  choice: भेंट के रूप में लाएँ
  rationale: δῶρα को लाए जा रहे ‘पुत्रों’ के विधेयात्मक/समानाधिकरण संबंध में समझा गया है, अर्थात पुत्र ही भेंट के रूप में लाए जाते हैं।
- source_word: τοὺς ἐξησθενηκότας
  choice: दुर्बल हो चुके
  rationale: पूर्ण कृदंत पहले हुई दुर्बलता से बनी वर्तमान दशा बताता है। यह रूप सक्रिय (‘दुर्बल पड़ चुके’) और निष्क्रिय (‘दुर्बल किए गए’) कारण के बीच मूल की संभावित अस्पष्टता को काफी हद तक खुला रखता है।
- source_word: υἱοὺς αὐτῆς
  choice: उसके पुत्रों
  rationale: υἱούς स्पष्टतः पुल्लिंग बहुवचन ‘पुत्र’ है; αὐτῆς स्त्रीलिंग एकवचन है और संदर्भ में यरूशलेम की ओर संकेत करता है।
theological_decisions:
- issue: αὐτῆς का पूर्वपद
  choice: ‘उसके’ रखा गया और पादटिप्पणी में यरूशलेम स्पष्ट किया गया
  alternative: ‘यरूशलेम के’ सीधे मुख्य पाठ में लिखना
  rationale: यूनानी स्त्रीलिंग सर्वनाम संदर्भतः यरूशलेम को सूचित करता है, पर मुख्य पाठ में सर्वनाम बनाए रखने से मूल की अभिव्यक्ति और संदर्भगत संबंध सुरक्षित रहते हैं।
- issue: ἐξησθενηκότας में कर्तृवाच्य या कर्मवाच्य भाव
  choice: ‘दुर्बल हो चुके’
  alternative: ‘दुर्बल किए गए’ या ‘थककर निर्बल हो चुके’
  rationale: मूल रूप परिणामी दुर्बल दशा को प्रमुखता देता है, पर उसके कारण को निर्णायक रूप से नहीं बताता; इसलिए कारण या कर्ता नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरंभ का ‘ताकि’ पिछले पद पर निर्भर यूनानी अनंत क्रिया को दर्शाता है; अंतिम अल्पविराम भी अगले पद से वाक्यगत निरंतरता का संकेत देता है।
