  yaml_path: translation/deuterocanon/psalms_of_solomon/017/044.yaml
  text: And his hope in the Lord will not grow weak; and who can stand against him? He is strong in his deeds and mighty in the fear of God,
translation:
  language: hi
  text: और प्रभु पर उसकी आशा निर्बल न होगी; उसका सामना कौन कर सकता है? वह अपने कामों में सामर्थी और परमेश्वर के भय में पराक्रमी है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενήσει
  choice: निर्बल न होगी
  rationale: भविष्यकालीन क्रिया आशा के बलहीन पड़ने या चूक जाने को व्यक्त करती है। ‘निर्बल न होगी’ मूल रूपक को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπὶ Κύριον
  choice: प्रभु पर उसकी आशा
  rationale: ἐπί के साथ यह वाक्यांश प्रभु की ओर उन्मुख और उन्हीं पर आधारित आशा को व्यक्त करता है। ‘प्रभु पर ... आशा’ हिन्दी में इस भरोसे का आधार स्पष्ट रखता है।
- source_word: Κύριον
  choice: प्रभु
  rationale: κύριος का पारंपरिक और सहज बाइबलीय हिन्दी रूप ‘प्रभु’ है; इस प्रयोग में अलग निश्चित पद की हिन्दी में आवश्यकता नहीं है।
- source_word: τίς δύναται πρὸς αὐτόν;
  choice: उसका सामना कौन कर सकता है?
  rationale: शाब्दिक यूनानी संक्षिप्त है, पर πρός αὐτόν यहाँ विरोध या मुकाबले का भाव रखता है। यह अनुवाद आलंकारिक प्रश्न की चुनौती को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἰσχυρὸς ἐν ἔργοις αὐτοῦ
  choice: अपने कामों में सामर्थी
  rationale: ἰσχυρός शक्ति को और ἔργα उसके कार्यों को दर्शाता है। ‘कामों में सामर्थी’ मूल संरचना तथा कर्मों में प्रकट शक्ति—दोनों को सुरक्षित रखता है।
- source_word: κραταιὸς ἐν φόβῳ θεοῦ
  choice: परमेश्वर के भय में पराक्रमी
  rationale: κραταιός प्रबल सामर्थ्य का सूचक है। ‘परमेश्वर का भय’ मूल बाइबलीय मुहावरे और उसकी धार्मिक गंभीरता को केवल ‘श्रद्धा’ तक सीमित किए बिना बनाए रखता है।
- source_word: '[implied copula]'
  choice: वह ... है
  rationale: अंतिम वर्णन में यूनानी संयोजक क्रिया को छोड़ देता है; व्याकरणसम्मत और स्पष्ट हिन्दी के लिए कर्ता तथा ‘है’ जोड़े गए हैं, बिना नया आशय जोड़े।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रभु’, ‘परमेश्वर का भय’, ‘सामर्थी’ और ‘पराक्रमी’ बाइबलीय शैली बनाए रखते हैं, पर वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है। मूल पद के अंत का अल्पविराम रखा गया है, क्योंकि यह आगे जारी वाक्य का अंश प्रतीत होता है।
