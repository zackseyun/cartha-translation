  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली। परमेश्वर को संबोधन में ‘तेरे’ मूल यूनानी के एकवचन संबोधन को स्वाभाविक भजन-शैली में बनाए रखता है।
