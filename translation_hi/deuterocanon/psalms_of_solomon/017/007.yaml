  text: And they did not glorify your honored name[a]; in splendor they set up a kingdom because of their arrogance,
translation:
  language: hi
  text: और उन्होंने तेरे आदरणीय नाम की महिमा नहीं की; उन्होंने वैभव के साथ अपने उत्कर्ष के बदले एक राज्य स्थापित किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने अपने घमंड के कारण वैभव के साथ एक राज्य स्थापित किया।”
    reason: ἀντί + संबंधकारक को यहाँ ‘के बदले/स्थान पर’ अथवा कारणवाचक ‘के कारण’ समझा जा सकता है; साथ ही ὕψος का अर्थ ‘उत्कर्ष/ऊँचाई’ या नकारात्मक भाव में ‘घमंड’ हो सकता है। पादटिप्पणी इस वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: οὐκ ἐδόξασαν
  choice: महिमा नहीं की
  rationale: δοξάζω का परमेश्वर की ओर निर्देशित अर्थ ‘महिमा करना’ है; यह यूनानी क्रिया के बल को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: तेरे आदरणीय नाम
  rationale: ἔντιμος का अर्थ आदर या प्रतिष्ठा के योग्य होना है। ‘आदरणीय’ इसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν δόξῃ
  choice: वैभव के साथ
  rationale: यहाँ δόξα राजकीय ठाट-बाट या वैभव को सूचित कर सकता है। ‘वैभव’ दृश्य राजसी प्रतिष्ठा व्यक्त करता है, बिना इसे आवश्यक रूप से ईश्वरीय महिमा ठहराए।
- source_word: ἔθεντο
  choice: स्थापित किया
  rationale: τίθημι यहाँ किसी राजकीय व्यवस्था को खड़ा करने या अस्तित्व में लाने के अर्थ में है; ‘स्थापित किया’ राजनीतिक संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: βασίλειον
  choice: एक राज्य
  rationale: βασίλειον राज्य, राजसत्ता या राजकीय प्रतिष्ठान को सूचित कर सकता है। अगले पद के राजसिंहासन-संबंधी संदर्भ में ‘एक राज्य’ सीधा और कम व्याख्यात्मक विकल्प है।
- source_word: ἀντὶ ὕψους αὐτῶν
  choice: अपने ऊँचे पद के स्थान पर
  rationale: ἀντί का सामान्य अर्थ ‘के स्थान पर’ और ὕψος का शाब्दिक अर्थ ‘ऊँचाई’ है, जो यहाँ ऊँचे पद या उत्कर्ष का रूपक हो सकता है। मुख्य पाठ यूनानी की संक्षिप्तता और अस्पष्टता को निकटता से रखता है; संभावित कारणवाचक अर्थ पादटिप्पणी में दिया गया है।
