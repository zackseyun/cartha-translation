lexical_decisions:
- source_word: εὐλογήσει
  choice: आशीष देगा
  rationale: εὐλογέω का भविष्यत् सक्रिय रूप है। यहाँ राजकीय उपकार के संदर्भ में ‘आशीष देगा’ स्वाभाविक और अर्थानुकूल है।
- source_word: λαὸν Κυρίου
  choice: प्रभु की प्रजा
  rationale: λαός वाचा से जुड़ी सामुदायिक प्रजा को दर्शाता है और Κυρίου संबंधसूचक है; ‘प्रभु की प्रजा’ स्वाभाविक हिन्दी में दोनों अर्थों को सुरक्षित रखता है।
- source_word: ἐν σοφίᾳ
  choice: बुद्धि से
  rationale: ἐν यहाँ रीति अथवा साधन का भाव दे सकता है। ‘बुद्धि से’ हिन्दी में स्वाभाविक है और यह बताता है कि वह आशीष देने का कार्य बुद्धिमानी से करेगा।
- source_word: μετʼ εὐφροσύνης
  choice: आनन्द सहित
  rationale: μετά संबंधकारक के साथ संगति या साथ होने का भाव देता है। εὐφροσύνη के उल्लासपूर्ण अर्थ को ‘आनन्द’ व्यक्त करता है, और ‘सहित’ यूनानी पदबंध की संरचना को स्पष्ट रखता है।
