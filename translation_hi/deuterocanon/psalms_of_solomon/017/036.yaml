  text: καὶ οὐκ ἔστιν ἀδικία ἐν ταῖς ἡμέραις αὐτοῦ ἐν μέσῳ αὐτῶν. ὅτι πάντες ἅγιοι, καὶ βασιλεὺς αὐτῶν χριστὸς κύριος.
