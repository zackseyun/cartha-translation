base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/036.yaml
  text: And there will be no injustice in his days among them[a], because all are holy[b], and their king is the Lord Messiah.
translation:
  language: hi
  text: और उसके दिनों में उनके बीच कोई अन्याय न होगा[a], क्योंकि वे सभी पवित्र हैं, और उनका राजा प्रभु मसीह है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नहीं है।”
    reason: यूनानी ἔστιν वर्तमानकाल में है, यद्यपि प्रसंग भावी शासन का है।
  - marker: b
    text: इसे “मसीह, जो प्रभु है” या “प्रभु का मसीह” भी समझा जा सकता है।
    reason: χριστὸς κύριος में दोनों उपाधियों का सटीक पारस्परिक सम्बन्ध व्याकरण की दृष्टि से अस्पष्ट है।
lexical_decisions:
- source_word: ἀδικία
  choice: अन्याय
  rationale: यह शब्द नैतिक बुराई और समुदाय में होने वाले सामाजिक अन्याय—दोनों को व्यक्त कर सकता है; ‘अन्याय’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: उसके दिनों में
  rationale: यूनानी मुहावरे को निकटता से रखते हुए राजा के भावी काल का संकेत सुरक्षित रहता है; ‘उसके शासनकाल में’ अर्थ को अधिक स्पष्ट करके व्याख्या जोड़ देता।
- source_word: ἐν μέσῳ αὐτῶν
  choice: उनके बीच
  rationale: यह समुदाय के भीतर की स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἅγιοι
  choice: पवित्र
  rationale: यह सीधा और पारदर्शी अनुवाद है; ‘सन्त’ बाद की पारिभाषिक या परम्परागत धारणा ला सकता है।
- source_word: χριστός
  choice: मसीह
  rationale: यहाँ शब्द राजकीय अभिषिक्त व्यक्ति की उपाधि है, इसलिए नाम-सदृश ‘क्राइस्ट’ के बजाय ‘मसीह’ उपयुक्त है।
- source_word: κύριος
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος का प्रतिष्ठित और गरिमापूर्ण हिन्दी समतुल्य है तथा उपाधि-क्रम की धार्मिक अर्थ-संभावना बनाए रखता है।
theological_decisions:
- issue: χριστὸς κύριος उपाधि-क्रम का अनुवाद
  choice: प्रभु मसीह
  alternative: ‘मसीह, जो प्रभु है’; अथवा ‘प्रभु का मसीह’
  rationale: दिए गए यूनानी पाठ में स्पष्ट सम्बन्धकारक रूप नहीं है। ‘प्रभु मसीह’ दोनों उपाधियों को बिना सम्बन्ध को निर्णायक रूप से परिभाषित किए रखता है; अन्य सम्भव समझों को पादटिप्पणी में सुरक्षित किया गया है।
- issue: ἔστιν के वर्तमान रूप और भावी मसीही प्रसंग के बीच काल
  choice: न होगा
  alternative: नहीं है
  rationale: क्रिया रूप वर्तमान है, पर आसपास का प्रसंग भावी शासन का वर्णन करता है और ‘उसके दिनों में’ उसी भावी काल की ओर संकेत करता है। मुख्य पाठ में प्रसंगानुकूल भविष्यकाल रखा गया है, जबकि अधिक रूपनिष्ठ वर्तमानकाल पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और शास्त्रीय भाव वाला गद्य। ‘उसके दिनों में’ मूल मुहावरे को बनाए रखता है, और ‘प्रभु मसीह’ मूल की वास्तविक अस्पष्टता को अनावश्यक रूप से हल नहीं करता।
