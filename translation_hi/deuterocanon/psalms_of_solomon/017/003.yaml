  text: But we will hope in God our savior, because the dominion of our God is forever with mercy, and the kingdom of our God is forever over the nations.
translation:
  language: hi
  text: परन्तु हम अपने उद्धारकर्ता परमेश्वर पर आशा रखेंगे, क्योंकि हमारे परमेश्वर का प्रभुत्व करुणा के साथ सदा बना रहता है, और हमारे परमेश्वर का राज्य सदा राष्ट्रों पर बना रहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπιοῦμεν ἐπὶ
  choice: पर आशा रखेंगे
  rationale: भविष्यकाल और ἐπί के भरोसा-केंद्रित अर्थ—किसी पर आशा रखना—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θεὸν σωτῆρα ἡμῶν
  choice: अपने उद्धारकर्ता परमेश्वर
  rationale: σωτήρ का सीधा और प्रतिष्ठित हिन्दी समतुल्य ‘उद्धारकर्ता’ है; सम्बन्धसूचक ἡμῶν को ‘अपने’ से सहज रूप में रखा गया है।
- source_word: τὸ κράτος
  choice: प्रभुत्व
  rationale: κράτος यहाँ सामर्थ्य से प्रकट शासन अथवा सार्वभौम अधिकार को सूचित करता है; ‘प्रभुत्व’ इस अर्थ को संक्षेप में बनाए रखता है।
- source_word: μετʼ ἐλέους
  choice: करुणा के साथ
  rationale: μετά के स्पष्ट सहवर्ती भाव और ἔλεος के दया/करुणा अर्थ को बिना कारणात्मक या विशेषणात्मक व्याख्या में बदले सुरक्षित रखता है।
- source_word: ἡ βασιλεία
  choice: राज्य
  rationale: βασιλεία के शासन और राज्यक्षेत्र दोनों की सम्भावना को पारंपरिक तथा व्यापक हिन्दी शब्द ‘राज्य’ बनाए रखता है।
- source_word: τὰ ἔθνη
  choice: राष्ट्रों
  rationale: बहुवचन ἔθνη को तटस्थ रूप से प्रस्तुत करता है; ‘अन्यजातियाँ’ कहकर धार्मिक-जातीय अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर के प्रभुत्व और करुणा का सम्बन्ध
  choice: करुणा के साथ
  alternative: करुणामय प्रभुत्व / करुणा के कारण
  rationale: यूनानी μετʼ ἐλέους केवल सहवर्तिता स्पष्ट करता है; उसे विशेषण या कारण बनाना मूल की वास्तविक अर्थगत खुली जगह को संकुचित करता।
- issue: राष्ट्रों पर राज्य की अवधि और विस्तार
  choice: सदा राष्ट्रों पर बना रहता है
  alternative: राष्ट्रों पर सदा के लिए है
  rationale: εἰς τὸν αἰῶνα और ἐπὶ τὰ ἔθνη दोनों को स्पष्ट रखा गया है, बिना इस शासन की रीति या परिणाम के बारे में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सार्वजनिक पाठ के योग्य शैली। ‘परन्तु’, ‘उद्धारकर्ता’, ‘प्रभुत्व’ और ‘करुणा’ मूल की औपचारिक ऊँचाई बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
