base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/021.yaml
  text: The everlasting springs from the depths[a], from the lofty mountains, were restrained, because there was no one among them doing righteousness and justice; from their ruler to the least of the people[b], all were in every kind of sin.
translation:
  language: hi
  text: गहराइयों और ऊँचे पहाड़ों से निकलनेवाले चिरस्थायी सोते[a] रोक दिए गए, क्योंकि उनके बीच धार्मिकता और न्याय का आचरण करनेवाला कोई न था; उनके शासक से लेकर प्रजा के छोटे-से-छोटे जन तक, सभी हर प्रकार के पाप में लिप्त थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सनातन सोते”; अथवा, “पुरातन सोते।”
    reason: αἰώνιοι दीर्घस्थायित्व या प्राचीनता का बोध करा सकता है; संदर्भ किसी एक अर्थ को पूर्णतः निर्णायक नहीं बनाता।
lexical_decisions:
- source_word: πηγαὶ
  choice: सोते
  rationale: यह शब्द बहते जल के प्राकृतिक स्रोतों को दर्शाता है। “सोते” आधुनिक हिन्दी में सहज है और काव्यात्मक जल-चित्र को बनाए रखता है।
- source_word: συνεσχέθησαν
  choice: रोक दिए गए
  rationale: निष्क्रिय क्रिया का अर्थ थामे या अवरुद्ध किए जाने का है। यह चयन न्याय-दंड के भाव को रखता है, पर रोकने की भौतिक रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: αἰώνιοι
  choice: चिरस्थायी
  rationale: जलस्रोतों के संदर्भ में यह दीर्घकाल से बने रहने या निरंतर रहने का भाव देता है। “चिरस्थायी” भजनात्मक गरिमा बनाए रखता है; “सनातन” और “पुरातन” की संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἐξ ἀβύσσων
  choice: गहराइयों से
  rationale: बहुवचन गहरे, अधोस्थित स्थानों की ओर संकेत करता है। “गहराइयों से” स्वाभाविक हिन्दी में मूल की काव्यात्मक छवि को सुरक्षित रखता है।
- source_word: ἀπὸ ὀρέων ὑψηλῶν
  choice: ऊँचे पहाड़ों से
  rationale: यह सीधा स्थान-सूचक वाक्यांश है। इसे सोतों के उद्गम से जोड़कर रखने से यह भ्रम नहीं होता कि सोतों को पहाड़ों तक पहुँचने से रोका गया था।
- source_word: ποιῶν δικαιοσύνην καὶ κρίμα
  choice: धार्मिकता और न्याय का आचरण करनेवाला
  rationale: यह सक्रिय नैतिक व्यवहार व्यक्त करता है। “आचरण” हिन्दी में स्वाभाविक है और धार्मिकता तथा न्याय की युग्मित नैतिक-न्यायिक धारणा को अलग-अलग बनाए रखता है।
- source_word: ἄρχοντος
  choice: शासक
  rationale: यह पद अधिकार रखनेवाले व्यक्ति के लिए व्यापक और स्पष्ट हिन्दी शब्द है तथा सामाजिक क्रम के दूसरे छोर पर प्रजा के सबसे छोटे व्यक्ति के साथ उचित विरोध बनाता है।
- source_word: ἐλαχίστου
  choice: प्रजा के सबसे छोटे व्यक्ति
  rationale: यह प्रजा में सबसे निम्न सामाजिक स्तर का बोध कराता है। “सबसे छोटे व्यक्ति” पदानुक्रम के इस अर्थ को स्पष्ट करता है।
- source_word: ἐν πάσῃ ἁμαρτίᾳ
  choice: हर प्रकार के पाप में लिप्त
  rationale: शाब्दिक “हर पाप में” हिन्दी में असहज है। “हर प्रकार के पाप में लिप्त” वाक्यांश की व्यापकता को स्पष्ट, स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: गैर-पौलुसी यहूदी ग्रंथ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: δικαιοσύνη को “धार्मिकता” और κρίμα को “न्याय” रखने से मूल का नैतिक-न्यायिक युग्म एक ही अर्थ में विलीन नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। पहले खंड में उद्गम-सूचक पदों को “निकलनेवाले” के साथ स्पष्ट रूप से जोड़ने से यूनानी वाक्य-विन्यास का संभावित हिन्दी भ्रम दूर होता है। अंतिम खंड की यूनानी भाषा संक्षिप्त और लुप्त क्रिया वाली है; स्वाभाविक हिन्दी के लिए “सभी ... लिप्त थे” स्पष्ट किया गया है।
