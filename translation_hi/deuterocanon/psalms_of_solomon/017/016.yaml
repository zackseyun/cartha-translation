lexical_decisions:
- source_word: πάντα ὅσα
  choice: जो कुछ
  rationale: यह संबंधवाचक पदबंध समग्रता व्यक्त करता है; आधुनिक हिन्दी में ‘जो कुछ’ स्वाभाविक और व्यापक है।
- source_word: ἐποίησεν
  choice: किया
  rationale: क्रिया का अर्थ यहाँ व्यापक है; ‘किया’ किसी विशिष्ट प्रकार के कार्य को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यह सीधा स्थानवाचक अर्थ है।
- source_word: καθὼς καὶ
  choice: वैसा ही था जैसा
  rationale: यूनानी तुलना में छूटी हुई संबंधसूचक कड़ी को हिन्दी में स्पष्ट करके स्वाभाविक वाक्य बनाया गया है, जबकि तुलना का बल सुरक्षित रखा गया है।
- source_word: τὰ ἔθνη
  choice: अन्यजातियाँ
  rationale: यहाँ पद उन गैर-यहूदी जातियों को उनके अपने नगरों और देवताओं के संदर्भ में दर्शाता है; ‘अन्यजातियाँ’ हिन्दी बाइबलीय प्रयोग में सुबोध है। ‘जातियाँ’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: ἐν ταῖς πόλεσι
  choice: अपने नगरों में
  rationale: यूनानी में संबंध संदर्भ और αὐτῶν से समझा जाता है; हिन्दी में आत्मवाचक ‘अपने’ यह संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς θεοὺς αὐτῶν
  choice: अपने देवताओं के साथ
  rationale: मूल में ‘देवताओं’ ही है, इसलिए ‘मूर्तियों’ जैसा व्याख्यात्मक शब्द नहीं जोड़ा गया। ‘के साथ’ तुलना के दीर्घवृत्तीय अर्थ की एक संभावित पूर्ति है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: दीर्घवृत्तीय तुलना में निहित संबंध
  choice: ‘अपने देवताओं के साथ करती हैं’
  alternative: ‘अपने देवताओं के लिए करती हैं’ अथवा तुलना को अधूरा ही छोड़ना
  rationale: καθὼς καὶ के बाद यूनानी वाक्य में क्रिया और देवताओं से संबंध बताने वाला पद निहित है। ‘के साथ’ मूल की अस्पष्टता को अपेक्षाकृत खुला रखता है और यह तय नहीं करता कि कार्य पूजा, सेवा या देवताओं के विरुद्ध व्यवहार था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नगरों’ और ‘देवताओं’ से शास्त्रीय गरिमा बनी रहती है, जबकि वाक्य-विन्यास वर्तमान मानक हिन्दी का है।
