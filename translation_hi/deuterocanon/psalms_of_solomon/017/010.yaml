lexical_decisions:
- source_word: κατὰ τὰ ἁμαρτήματα αὐτῶν
  choice: उनके पापों के अनुसार
  rationale: κατά के साथ कर्मकारक यहाँ मापदंड या अनुपात बताता है; यह अनुवाद पापों के अनुरूप प्रतिफल का भाव बनाए रखता है।
- source_word: ἀποδώσεις αὐτοῖς
  choice: उन्हें प्रतिफल दे
  rationale: यूनानी भविष्यकाल का रूप इस प्रार्थनात्मक संबोधन में दैवी प्रतिदान की याचना के रूप में स्वाभाविक है। ‘प्रतिफल दे’ न्यायपूर्ण बदले का अर्थ स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: रूप की दृष्टि से कर्ताकारक होते हुए भी यह प्रत्यक्ष संबोधन है; हिन्दी में ‘हे परमेश्वर’ उसका प्रार्थनात्मक बल सुरक्षित रखता है।
- source_word: εὑρεθείη αὐτοῖς
  choice: उन्हें फल मिले
  rationale: शाब्दिक अर्थ ‘उनके लिए पाया जाए’ है, पर इस प्रसंग में यह उनके हिस्से आने या उन्हें मिलने वाले परिणाम का मुहावरा है। ‘उन्हें फल मिले’ इच्छार्थक भाव और प्रतिदान-संदर्भ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: उनके कामों के अनुसार ही
  rationale: ‘काम’ ἔργα का सामान्य और बाइबिलीय अर्थ रखता है; ‘ही’ प्रतिफल और कर्म के अनुरूप संबंध पर बल देता है, कोई नया अर्थ नहीं जोड़ता।
theological_decisions:
- issue: क्या पद को निश्चित भविष्यवाणी या प्रार्थनात्मक याचना के रूप में प्रस्तुत किया जाए
  choice: पहले खंड में हिन्दी आज्ञार्थक/याचनात्मक ‘दे’ और दूसरे में ‘मिले’
  alternative: ‘तू उन्हें प्रतिफल देगा’ और ‘वे पाए जाएँ’
  rationale: ἀποδώσεις व्याकरणतः भविष्यकाल है, किंतु ‘हे परमेश्वर’ के प्रत्यक्ष संबोधन और उसके बाद आए इच्छार्थक εὑρεθείη के कारण पूरा वाक्य प्रार्थनात्मक प्रतिदान-विनती के रूप में पढ़ा जाता है। हिन्दी में चुना गया रूप इस तनाव को सहज रूप से व्यक्त करता है, बिना किसी विशिष्ट सिद्धान्त को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। ‘प्रतिफल’ और ‘फल मिले’ न्यायिक प्रतिदान का भाव रखते हैं, जबकि अत्यधिक शाब्दिक और हिन्दी में अस्पष्ट ‘उनके लिए पाया जाए’ से बचते हैं।
