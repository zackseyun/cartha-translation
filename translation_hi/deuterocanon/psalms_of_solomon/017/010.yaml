translation:
  language: hi
  text: हे परमेश्वर, तू उन्हें उनके पापों के अनुसार प्रतिफल देगा; उनके कार्यों के अनुसार उन्हें फल मिले[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “उनके लिए उनके कार्यों के अनुसार पाया जाए।”'
