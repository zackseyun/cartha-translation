translation:
  language: hi
  text: प्रभु अपने उन सभी न्यायों में विश्वासयोग्य है, जिन्हें वह पृथ्वी पर करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστός
  choice: विश्वासयोग्य
  rationale: यह विधेयात्मक विशेषण प्रभु की भरोसेमंदी और अटल निष्ठा बताता है; ‘विश्वासयोग्य’ हिन्दी में इस अर्थ को स्वाभाविक और धर्मवैचारिक रूप से संतुलित ढंग से व्यक्त करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: उपाधि के रूप में κύριος का प्रचलित, श्रद्धापूर्ण हिन्दी रूप; सेप्टुआजिन्त की भाषा से निरंतरता भी बनाए रखता है।
- source_word: κρίμασιν
  choice: न्यायों
  rationale: यहाँ शब्द ईश्वर के ठोस न्यायिक निर्णयों अथवा न्याय के कार्यों को दर्शाता है। ‘न्यायों’ मूल के बहुवचन और उसकी संक्षिप्तता को सुरक्षित रखता है।
- source_word: ποιεῖ
  choice: करता है
  rationale: ποιέω का सीधा अर्थ ‘करना’ है। ‘न्यायों को करना’ हिन्दी में कुछ औपचारिक है, पर संबंधवाचक उपवाक्य में मूल की व्यापकता सुरक्षित रखता है और ‘लागू करना’ जैसी अतिरिक्त प्रशासनिक छाया से बचता है।
- source_word: ἐπὶ τὴν γῆν
  choice: पृथ्वी पर
  rationale: यह प्रभु के कार्य का व्यापक क्षेत्र बताने वाला सबसे सीधा अर्थ है; ‘देश में’ अनावश्यक रूप से अर्थ को सीमित कर सकता है।
- source_word: αὐτοῦ
  choice: अपने
  rationale: मूल में न्यायों के साथ स्पष्ट संबंधसूचक सर्वनाम है। हिन्दी में कर्ता प्रभु की ओर लौटते हुए ‘अपने’ इसे स्वाभाविक और स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: क्या पद प्रभु के चरित्र पर बल देता है या केवल उसके न्यायों की शुद्धता पर
  choice: ‘प्रभु ... विश्वासयोग्य है’ कहकर πιστός को प्रभु का गुण रखा गया है, और उसकी विश्वासयोग्यता को उसके ठोस न्यायों के संदर्भ में व्यक्त किया गया है।
  alternative: ‘प्रभु अपने सभी न्यायों में धर्मी है’ अथवा ‘प्रभु अपने सभी निर्णयों में भरोसेमंद है।’
  rationale: πιστός सबसे स्वाभाविक रूप से स्वयं प्रभु का वर्णन करता है; ‘धर्मी’ मूल में उपस्थित न होने वाली अलग शब्दार्थगत धारणा जोड़ देगा। अनुवाद प्रभु के चरित्र और उसके न्यायिक कार्यों—दोनों के बीच मूल संबंध बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘विश्वासयोग्य’, ‘प्रभु’ और ‘न्याय’ जैसे परिचित शब्द रखे गए हैं। मूल यूनानी की विधेयात्मक रचना, बहुवचन ‘न्यायों’, स्पष्ट स्वामित्व αὐτοῦ और पृथ्वी-व्यापी क्षेत्र को सुरक्षित रखा गया है।
