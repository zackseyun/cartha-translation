    reason: lexical_alternative
  - marker: c
    text: या “उनकी चराई-भूमि में उनमें से किसी को भी निर्बल नहीं होने देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμαίνων
  choice: चराते हुए
  rationale: यह वर्तमान कृदंत चरवाहे के रूपक को बनाए रखता है और केवल भोजन कराने के बजाय देखभाल तथा अगुवाई का भाव भी व्यक्त करता है। कृदंत रूप यूनानी वाक्य की संरचना और अगले भविष्यकालीन क्रियापद के साथ उसके संबंध को खुला रखता है।
- source_word: τὸ ποίμνιον Κυρίου
  choice: प्रभु के झुंड को
  rationale: ποίμνιον समूह के रूप में पशु-झुंड को दर्शाता है, और Κυρίου संबंधसूचक रूप में उसके प्रभु से संबंध या स्वामित्व को व्यक्त करता है।
- source_word: ἐν πίστει
  choice: विश्वासयोग्यता से
  rationale: इस राजकीय-चरवाही के प्रसंग में πίστις संभवतः चराने वाले के भरोसेमंद आचरण का गुण बताता है; फिर भी ‘विश्वास’ अर्थ भी संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता से
  rationale: यह नैतिक सच्चाई और सही आचरण का व्यापक भाव बनाए रखता है; प्रसंगानुसार ‘न्याय’ भी संभव है।
- source_word: οὐκ ἀφήσει ἀσθενῆσαι
  choice: निर्बल न होने देगा
  rationale: ἀφήσει के बाद infinitive यहाँ अनुमति या रोकथाम का भाव देता है, जबकि ἀσθενῆσαι निर्बल अवस्था में आने को व्यक्त करता है।
- source_word: ἐν αὐτοῖς
  choice: उनमें से किसी को भी
  rationale: बहुवचन समूह के संदर्भ में यूनानी पदबंध को वितरणात्मक ढंग से व्यक्त किया गया है; ‘किसी को भी’ निहित अनिश्चित सदस्य को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐν τῇ νομῇ αὐτῶν
  choice: उनकी चरागाह में
  rationale: νομή चरने की जगह या चराई को सूचित करता है और झुंड तथा चराने के निरंतर रूपक को बनाए रखता है।
theological_decisions:
- issue: πίστει का अर्थ
  choice: विश्वासयोग्यता
  alternative: विश्वास
  rationale: मुख्य पाठ में इसे चरवाहे-शासक के आचरण की रीति माना गया है, पर यूनानी शब्द स्वयं ‘विश्वास’ और ‘विश्वासयोग्यता’ दोनों अर्थ ग्रहण कर सकता है; इसलिए विकल्प को दबाया नहीं गया।
- issue: δικαιοσύνῃ का दायरा
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ शब्द के व्यापक नैतिक अर्थ को मुख्य पाठ में रखा गया है, जबकि शासकीय प्रसंग में ‘न्याय’ एक वैध, किंतु कुछ संकरा, विकल्प है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झुंड’, ‘चराते हुए’ और ‘चरागाह’ के द्वारा मूल का सतत चरवाही-रूपक सुरक्षित है। आरंभिक कृदंत को सीमित क्रिया में बदलने के बजाय बनाए रखा गया है, ताकि यूनानी ποιμαίνων की रूपात्मक विशेषता और वाक्यगत तनाव अनावश्यक रूप से न मिटे।
