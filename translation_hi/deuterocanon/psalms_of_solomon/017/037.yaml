base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/037.yaml
  text: For he will not put his hope in horse and rider and bow[a], nor will he multiply gold or silver for himself for war[b], nor will he gather hopes from many for the day of battle.
translation:
  language: hi
  text: क्योंकि वह घोड़े, घुड़सवार और धनुष पर आशा नहीं रखेगा; न ही वह युद्ध के लिए अपने लिए सोना या चाँदी बहुतायत में इकट्ठा करेगा, और न युद्ध के दिन बहुतों के बल पर आशाएँ बाँधेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और न वह बहुतों के साथ युद्ध के दिन के लिए आशाएँ इकट्ठी करेगा।” यूनानी वाक्यांश संक्षिप्त है और संभवतः बड़ी संख्या या विशाल सेना पर भरोसा करने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπιεῖ ἐπὶ
  choice: पर आशा नहीं रखेगा
  rationale: यह प्रयोग आशा रखने के साथ-साथ किसी सैन्य साधन पर निर्भर होने का भाव भी व्यक्त करता है, जबकि मूल शब्द ‘आशा’ से संबंध बना रहता है।
- source_word: ἵππον καὶ ἀναβάτην καὶ τόξον
  choice: घोड़े, घुड़सवार और धनुष
  rationale: मूल के तीन ठोस सैन्य साधनों और उनकी संक्षिप्त सूची को सीधे बनाए रखा गया है।
- source_word: πληθυνεῖ αὐτῷ
  choice: अपने वास्ते ... बढ़ाएगा
  rationale: क्रिया का अर्थ संख्या या मात्रा बढ़ाना है और αὐτῷ हितार्थक दत्तिव है; इसलिए निजी संचय का भाव सुरक्षित रखा गया है।
- source_word: χρυσίον οὐδὲ ἀργύριον
  choice: सोना या चाँदी
  rationale: नकारात्मक वाक्य में οὐδὲ का स्वाभाविक हिन्दी रूप ‘या’ है; दोनों बहुमूल्य धातुओं की ठोस छवि भी बनी रहती है।
- source_word: πολλοῖς ... συνάξει ἐλπίδας
  choice: बहुतों के बल पर आशाएँ बाँधेगा
  rationale: संक्षिप्त और कुछ अस्पष्ट यूनानी दत्तिव को बड़ी संख्या अथवा बहुत-से लोगों पर सैन्य भरोसा रखने के रूप में स्वाभाविक हिन्दी दी गई है; ‘आशाएँ’ का बहुवचन बनाए रखा गया है।
- source_word: ἡμέραν πολέμου
  choice: युद्ध के दिन
  rationale: यह मूल के ‘युद्ध के दिन’ को सीधे और स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: राजा के सैन्य साधनों पर भरोसे का निषेध
  choice: आशा और निर्भरता की भाषा को बनाए रखा गया
  alternative: इसे स्पष्ट रूप से केवल परमेश्वर पर भरोसे का कथन बनाना
  rationale: इस पद में विरोधी पक्ष निहित हो सकता है, पर यहाँ परमेश्वर का प्रत्यक्ष उल्लेख नहीं है; इसलिए अनकहे धार्मिक निष्कर्ष को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। ‘आशाएँ बाँधना’ हिन्दी का स्वाभाविक मुहावरा है, जबकि पादटिप्पणी मूल के असामान्य ‘आशाएँ इकट्ठी करना’ को सुरक्षित रखती है।
