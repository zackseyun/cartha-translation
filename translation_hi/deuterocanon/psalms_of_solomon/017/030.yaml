base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/030.yaml
  text: For he will recognize them[a], that they all are sons of their God[c][b], and he will apportion them among their tribes upon the land.
translation:
  language: hi
  text: क्योंकि वह उन्हें पहचानेगा कि वे सभी अपने परमेश्वर के पुत्र हैं,[a] और वह उन्हें उस देश में उनके गोत्रों के अनुसार बाँट देगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “वे सभी अपने परमेश्वर की सन्तान हैं।” यूनानी में अधिक शाब्दिक रूप से “पुत्र” है।'
    reason: lexical_alternative
  - marker: b
    text: “उस देश में” का अनुवाद “पृथ्वी पर” भी हो सकता है; यूनानी शब्द दोनों अर्थ दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσεται
  choice: पहचानेगा
  rationale: यहाँ भविष्यत् मध्यम रूप केवल जानकारी प्राप्त करने के बजाय उनकी पहचान को जानने या स्वीकार करने का भाव देता है; ‘पहचानेगा’ इस संबंधपरक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: υἱοὶ θεοῦ εἰσιν αὐτῶν
  choice: वे सब अपने परमेश्वर के पुत्र हैं
  rationale: υἱοί स्पष्टतः ‘पुत्र’ है, जबकि αὐτῶν को θεοῦ के साथ लेकर ‘अपने परमेश्वर’ कहना हिन्दी में स्वाभाविक है और यूनानी की संभावित वाचिक असहजता को बिना कोई अतिरिक्त सिद्धान्त जोड़े व्यक्त करता है।
- source_word: καταμερίσει
  choice: भाग बाँटकर बसाएगा
  rationale: क्रिया हिस्सों में बाँटने या नियत करने का बोध देती है। इस भू-आवंटन प्रसंग में केवल ‘बाँटेगा’ लोगों को विभाजित करने जैसा लग सकता है; ‘भाग बाँटकर बसाएगा’ नियत स्थान देने का आशय स्पष्ट करता है।
- source_word: ἐν ταῖς φυλαῖς αὐτῶν
  choice: उनकी गोत्रों के अनुसार
  rationale: इस्राएली संदर्भ में φυλή के लिए ‘गोत्र’ उपयुक्त है। ἐν यहाँ गोत्रीय व्यवस्था या वितरण को दर्शा सकता है, इसलिए ‘के अनुसार’ स्रोत के वितरणात्मक भाव को सहज हिन्दी में देता है।
- source_word: ἐπὶ τῆς γῆς
  choice: उस देश में
  rationale: संदर्भ भूमि के गोत्रीय आवंटन की ओर संकेत करता है, इसलिए γῆ को ‘देश’ लिया गया है। यूनानी ἐπί का अधिक रूपात्मक ‘उस देश पर’ हिन्दी में अस्वाभाविक होगा; स्थानगत अर्थ के लिए ‘में’ स्वाभाविक है।
theological_decisions:
- issue: υἱοὶ θεοῦ का अनुवाद
  choice: अपने परमेश्वर के पुत्र
  alternative: अपने परमेश्वर की सन्तान
  rationale: ‘पुत्र’ यूनानी के स्पष्ट पुल्लिंग बहुवचन को सुरक्षित रखता है और सम्भावित वाचा-संबंधी प्रतिष्ठा को लिंग-निरपेक्ष बनाकर मिटाता नहीं; ‘सन्तान’ को पादटिप्पणी में रखा गया है।
- issue: ἐπὶ τῆς γῆς में γῆ का अर्थ
  choice: उस देश में
  alternative: पृथ्वी पर
  rationale: गोत्रों के अनुसार भाग बाँटने का निकट संदर्भ किसी निश्चित भूभाग, सम्भवतः इस्राएल के देश, को अधिक सम्भावित बनाता है; फिर भी γῆ का व्यापक अर्थ सम्भव है, अतः उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: καταμερίσει का कर्म और आशय
  choice: उन्हें ... भाग बाँटकर बसाएगा
  alternative: उन्हें ... बाँटेगा
  rationale: शाब्दिक कर्म ‘उन्हें’ ही है, पर भू-आवंटन के संदर्भ में हिन्दी का विस्तृत प्रयोग यह स्पष्ट करता है कि आशय गोत्रीय भागों में नियोजन है, न कि व्यक्तियों को वस्तुओं की तरह बाँटना।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘गोत्र’, ‘परमेश्वर’ और ‘भाग बाँटना’ बाइबिलीय संदर्भ में सामान्यतः समझे जाने वाले शब्द हैं। मुख्य पाठ में प्रादेशिक अर्थ चुना गया है, पर γῆ की वास्तविक अस्पष्टता पादटिप्पणी में बनाए रखी गई है।
