  yaml_path: translation/deuterocanon/psalms_of_solomon/017/029.yaml
  text: And he will not allow unrighteousness to remain among them any longer[a], and no one who knows wickedness will dwell with them.
translation:
  language: hi
  text: और वह अधर्म को अब और उनके बीच बने रहने नहीं देगा[a], और दुष्टता से परिचित कोई भी व्यक्ति उनके साथ निवास नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस साक्षी में ‘उनके बीच’ के आसपास की यूनानी पंक्ति पाठ की दृष्टि से कठिन है, पर समग्र अर्थ स्पष्ट है: अधर्म अब और समुदाय के भीतर बना नहीं रहेगा।'
    reason: textual_variant
lexical_decisions:
- source_word: ἀφήσει
  choice: न देगा
  rationale: ἀφίημι का भविष्यकाल यहाँ μεῖναι (‘बने रहना’) को नियंत्रित करता है और अनुमति न देने का भाव व्यक्त करता है; ‘बने रहने न देगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀδικίαν
  choice: अधर्म
  rationale: ἀδικία नैतिक अन्याय और धार्मिक-अर्थ वाले अधार्मिक आचरण दोनों को व्यक्त कर सकता है। इस भजन-संदर्भ में ‘अधर्म’ संक्षिप्त, गरिमापूर्ण और व्यापक है।
- source_word: ἔτι
  choice: फिर
  rationale: नकारात्मक भविष्यवाची वाक्य में ἔτι पहले से चली आ रही स्थिति की समाप्ति दर्शाता है; ‘फिर ... न’ हिन्दी में ‘अब और नहीं’ का स्वाभाविक भाव देता है।
- source_word: μεῖναι
  choice: बने रहने
  rationale: यह चयन स्थायी रूप से उपस्थित रहने या जारी रहने के अर्थ को स्पष्ट रखता है।
- source_word: ἐν αὐτῶν
  choice: उनके बीच
  rationale: प्राप्त यूनानी पाठ यहाँ व्याकरण की दृष्टि से कठिन है, पर सामुदायिक संदर्भ ‘उनके बीच’ अर्थ का समर्थन करता है।
- source_word: κατοικήσει
  choice: निवास न करेगा
  rationale: κατοικέω केवल अस्थायी उपस्थिति नहीं, बल्कि बसने या टिककर रहने का भाव देता है; ‘निवास करना’ भजन की गरिमापूर्ण शैली के अनुकूल है।
- source_word: ἄνθρωπος
  choice: कोई भी व्यक्ति
  rationale: एकवचन ἄνθρωπος यहाँ सामान्य अर्थ में है; यह अनुवाद लिंग-विशेष का अनावश्यक संकेत दिए बिना उस व्यापकता को व्यक्त करता है।
- source_word: εἰδὼς κακίαν
  choice: दुष्टता से परिचित
  rationale: कृदंत और कर्म का यह मेल दुष्टता की केवल सैद्धांतिक जानकारी से अधिक, उससे परिचय या संबंध का भाव देता है; हिन्दी में ‘दुष्टता से परिचित’ इस अर्थ को स्वाभाविक रूप से रखता है।
- source_word: κακίαν
  choice: दुष्टता
  rationale: κακία यहाँ केवल व्यक्तिगत द्वेष नहीं, बल्कि व्यापक नैतिक बुराई को सूचित करता है; ‘दुष्टता’ उसके नैतिक भार को बनाए रखता है।
theological_decisions:
- issue: पुनर्स्थापित समुदाय से नैतिक बुराई का निष्कासन
  choice: पद को इस प्रकार रखा गया है कि अधर्म और दुष्टता से परिचित व्यक्ति—दोनों समुदाय में स्थायी स्थान नहीं पाएँगे।
  alternative: ἀδικία को अधिक न्यायिक रंग देते हुए ‘अन्याय’ और εἰδὼς κακίαν को अधिक शाब्दिक रूप में ‘दुष्टता को जानने वाला’ कहा जा सकता है।
  rationale: संदर्भ धर्मी शासन के अधीन समुदाय की शुद्धि का है। ‘अधर्म’ और ‘दुष्टता से परिचित’ नैतिक तनाव को बनाए रखते हैं, पर किसी बाद की सिद्धान्तगत श्रेणी को पाठ में नहीं जोड़ते।
translation_notes:
  register: आधुनिक मानक हिन्दी; भजन-सुलभ गरिमा बनाए रखते हुए वाक्य सामान्य पाठक के लिए सहज रखा गया है। ‘निवास’ ऊँचे काव्यात्मक स्तर को बनाए रखता है, जबकि ‘बने रहने न देगा’ अर्थ को स्पष्ट करता है।
