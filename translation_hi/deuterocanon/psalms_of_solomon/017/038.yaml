  yaml_path: translation/deuterocanon/psalms_of_solomon/017/038.yaml
  text: The Lord himself is their king[a], the hope of the mighty one in God[d][c][b]; and he will have mercy on all the nations before him in fear.
translation:
  language: hi
  text: प्रभु स्वयं उनका राजा है[a]। पराक्रमी की आशा परमेश्वर में आशा है[b]; और वह अपने सामने भय में सब राष्ट्रों पर दया करेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठ-साक्षियों में ‘उनका राजा’ के स्थान पर ‘उसका राजा’ है। तब यह पंक्ति दाऊदवंशी शासक के प्रभु के अधीन होने की ओर अधिक सीधे संकेत करेगी।
    reason: textual_variant
  - marker: b
    text: ‘पराक्रमी की आशा परमेश्वर में आशा है’ के पीछे का यूनानी पाठ कठिन और संभवतः अनियमित या दूषित है। इसका अर्थ ‘पराक्रमी की आशा परमेश्वर में है’ भी समझा जा सकता है।
    reason: textual_variant
  - marker: c
    text: या ‘उसके सामने श्रद्धा से’। यहाँ ‘भय’ में श्रद्धामय विस्मय का भाव भी हो सकता है; संक्षिप्त यूनानी वाक्यांश का संबंध कुछ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  choice: प्रभु
  rationale: यहाँ κύριος परमेश्वर को सर्वोच्च शासक के रूप में सूचित करता है; ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और प्रतिष्ठित धार्मिक संबोधन है।
- source_word: βασιλεὺς αὐτῶν
  choice: उनका राजा
  rationale: स्वीटे के मूल पाठ में बहुवचन αὐτῶν है, इसलिए मुख्य पाठ में ‘उनका’ रखा गया है; एकवचन पाठांतर पादटिप्पणी में दिया गया है।
- source_word: ἐλπὶς
  choice: आशा
  rationale: ‘आशा’ संज्ञा की पुनरावृत्ति कठिन यूनानी वाक्यांश को अधिक व्याख्यात्मक बनाए बिना सुरक्षित रखती है।
- source_word: τοῦ δυνατοῦ
  choice: पराक्रमी की
  rationale: एकवचन संबंधकारक को किसी व्यक्ति के संकेत के रूप में रखा गया है; ‘पराक्रमी’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: ἐλπὶθ θεοῦ
  choice: परमेश्वर में आशा
  rationale: प्रेषित पाठ का ἐλπὶθ अनियमित या संदिग्ध है। यह रूप पुनरुक्त आशा-भाषा और परमेश्वर की ओर उन्मुखता को बचाता है, बिना कठिनाई को किसी संबंधवाचक उपवाक्य से चुपचाप सुलझाए।
- source_word: ἐλεήσει
  choice: दया करेगा
  rationale: यह दयापूर्ण क्रिया का सीधा और धर्मवैचारिक भार बनाए रखने वाला हिन्दी रूप है।
- source_word: τὰ ἔθνη
  choice: सब राष्ट्रों
  rationale: राजकीय संदर्भ में ἔθνη व्यापक रूप से राष्ट्रों को सूचित करता है; ‘राष्ट्र’ अपेक्षाकृत कम व्याख्यात्मक है।
- source_word: ἐνώπιον αὐτοῦ ἐν φόβῳ
  choice: अपने सामने … जब वे भय में होंगे
  rationale: ἐνώπιον की उपस्थिति-संबंधी धारणा और φόβος की भय/श्रद्धामय विस्मय वाली अस्पष्टता रखी गई है। हिन्दी में संबंध स्पष्ट करने के लिए ‘जब वे … होंगे’ जोड़ा गया, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: आसपास के दाऊदी शासक-संदर्भ में प्रभु के राजत्व का संबंध
  choice: प्रभु स्वयं उनका राजा है
  alternative: प्रभु स्वयं उसका राजा है
  rationale: स्वीटे का बहुवचन पाठ प्रभु को लोगों का अंतिम राजा बताता है, जबकि एकवचन पाठ दाऊदी शासक की प्रभु के अधीनता को अधिक प्रत्यक्ष बनाता; पाठांतर को पादटिप्पणी में रखा गया है।
- issue: कठिन आशा-वाक्यांश का वाक्यगत संबंध
  choice: 'पूर्ण विराम के बाद स्वतंत्र नामवाचक कथन: ‘पराक्रमी की आशा परमेश्वर में आशा है’'
  alternative: इसे ‘राजा’ का समानाधिकरण अथवा ‘जिसकी आशा परमेश्वर में है’ संबंधवाचक कथन मानना
  rationale: αὐτῶν के बाद का विराम-चिह्न और यूनानी की वास्तविक कठिनाई सुरक्षित रहती है। प्रेषित पाठ को सहज बनाने के लिए धर्मवैचारिक संबंध निश्चित नहीं किया गया।
- issue: ‘भय में’ किससे संबंधित है
  choice: राष्ट्र प्रभु के सामने भय में होंगे
  alternative: प्रभु भय/श्रद्धा के साथ दया करेगा, अथवा वाक्यांश का अर्थ केवल ‘उसके सामने श्रद्धा से’ हो
  rationale: संदर्भ में राष्ट्रों की भयपूर्ण या श्रद्धामय उपस्थिति अधिक संभावित है, पर यूनानी की संक्षिप्तता पूरी तरह निर्णायक नहीं; विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य शैली। कठिन मध्य खंड को अस्वाभाविक होते हुए भी जानबूझकर अत्यधिक नहीं सँवारा गया, ताकि मूल पाठ की पुनरुक्ति, अनिश्चितता और धर्मवैचारिक तनाव सुरक्षित रहें।
