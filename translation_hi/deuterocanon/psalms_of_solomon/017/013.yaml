  text: The lawless one laid waste our land, emptying it of its inhabitants; they wiped out young and old, and their children together.
translation:
  language: hi
  text: उस अधर्मी ने हमारे देश को उजाड़ दिया, उसे उसके निवासियों से खाली कर दिया; उन्होंने युवाओं, वृद्धों और उनके बच्चों को एक साथ मिटा दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में कर्ता एकवचन (‘उस अधर्मी ने’) से बहुवचन क्रिया (‘उन्होंने ... मिटा दिया’) में बदल जाता है। अनुवाद इस बदलाव को समतल करने के बजाय सुरक्षित रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: उजाड़ दिया
  rationale: यह भूमि को वीरान और बरबाद कर देने का ठोस भाव स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὁ ἄνομος
  choice: अधर्मी
  rationale: संज्ञा के रूप में प्रयुक्त एकवचन और निश्चित यूनानी पद को बनाए रखता है तथा व्यवस्था-विरोधी दुष्टता का भाव देता है।
- source_word: ἀπὸ ἐνοικούντων αὐτήν
  choice: उसमें रहनेवालों से उसे खाली कर दिया
  rationale: यूनानी वाक्यांश में निहित परिणाम—देश का अपने निवासियों से रहित हो जाना—को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠφάνισαν
  choice: मिटा दिया
  rationale: दृष्टि या अस्तित्व से लुप्त कर देने के तीव्र भाव को संक्षिप्त, प्रभावशाली और पठनीय हिन्दी में रखता है।
- source_word: νέον καὶ πρεσβύτην
  choice: जवानों और बूढ़ों
  rationale: आयु के दोनों सिरों को बताने वाली यूनानी युग्मोक्ति को सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: τέκνα αὐτῶν ἅμα
  choice: उनके बच्चों को भी एक साथ
  rationale: बच्चों के साथ ही नष्ट किए जाने और ἅμα के सामूहिक भाव, दोनों को स्पष्ट करता है।
theological_decisions:
- issue: कर्ता-वचन का एकवचन से बहुवचन में परिवर्तन
  choice: पहले ‘अधर्मी ने’, फिर ‘उन्होंने’
  alternative: पूरे पद में एकवचन कर्ता रखना या बहुवचन को स्पष्ट समूह से बदलना
  rationale: मूल यूनानी पहले एकवचन कर्ता ὁ ἄνομος के साथ ἠρήμωσεν और फिर बिना स्पष्ट नए कर्ता के बहुवचन ἠφάνισαν प्रयोग करता है। इस असामान्य परिवर्तन को अर्थगत या ऐतिहासिक अनुमान से समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गंभीर और काव्यात्मक इतिहास-वर्णन के अनुकूल रखी गई है। ‘अधर्मी’ पद एकवचन है, जबकि बाद का ‘उन्होंने’ जानबूझकर मूल के अस्पष्ट बहुवचन को बनाए रखता है।
