  text: They wandered in wildernesses[a], that their lives might be saved from evil, and in the eyes of the sojourning community[d][c][b], a life saved from among them was precious.
translation:
  language: hi
  text: वे निर्जन प्रदेशों में भटकते रहे[a], ताकि उनके प्राण बुराई से बचाए जाएँ[d]; और परदेश में बसे समुदाय[c] की दृष्टि में, उनमें से बचाया गया एक जीवन[b] बहुमूल्य था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उजाड़ स्थानों में’ अथवा ‘मरुस्थलों में’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी ψυχή का अर्थ ‘जीवन’ या ‘आत्मा’ हो सकता है; यहाँ जीवित बचने के प्रसंग में ‘जीवन’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: या ‘निर्वासित समुदाय की दृष्टि में’ अथवा ‘प्रवासी समुदाय की दृष्टि में’। यूनानी παροικία अपने देश से बाहर रहने वाले समुदाय को सूचित करता है।
    reason: lexical_alternative
  - marker: d
    text: 'एक अधिक कर्तृवाच्य अनुवाद है: ‘अपने प्राण बचाने के लिए’; किंतु यूनानी में ‘बचाए जाएँ’ कर्मवाच्य है।'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπλανῶντο
  choice: भटकते रहे
  rationale: ἐν ἐρήμοις के साथ यह क्रिया नैतिक रूप से बहकाए जाने के बजाय स्थान-स्थान भटकने या घूमने का बोध देती है। अपूर्णकाल निरंतर या बार-बार होने वाली क्रिया को सूचित करता है।
- source_word: ἐν ἐρήμοις
  choice: निर्जन प्रदेशों में
  rationale: बहुवचन ἐρήμοις अनेक उजाड़, निर्जन या वन्य स्थानों की ओर संकेत करता है। ‘निर्जन प्रदेश’ अर्थ को केवल रेतीले मरुस्थल तक सीमित नहीं करता।
- source_word: σωθῆναι
  choice: बचाए जाएँ
  rationale: अओरिस्ट कर्मवाच्य infinitive को उद्देश्यवाचक रूप में रखा गया है। यह बचाए जाने का भाव बनाए रखता है और बचाने वाले कर्ता को अनिर्दिष्ट छोड़ता है।
- source_word: ψυχὰς αὐτῶν
  choice: उनके प्राण
  rationale: संकट से जीवित बचने के प्रसंग में ψυχή का ठोस अर्थ ‘जीवन/प्राण’ है। हिंदी में ‘प्राण बचना’ स्वाभाविक है और बहुवचन व्यक्तियों के जीवनों का भाव रखता है।
- source_word: ἀπὸ κακοῦ
  choice: बुराई से
  rationale: κακόν बुराई, हानि या विपत्ति का अर्थ दे सकता है। ‘बुराई’ यूनानी अभिव्यक्ति की व्यापकता और नैतिक-संकट संबंधी अस्पष्टता को बनाए रखती है।
- source_word: τίμιον
  choice: बहुमूल्य
  rationale: यह शब्द किसी बचाए गए जीवन को समुदाय की दृष्टि में अत्यंत मूल्यवान होने के रूप में प्रस्तुत करता है।
- source_word: παροικίας
  choice: परदेश में बसे समुदाय
  rationale: παροικία अपने देश से बाहर परदेशी या प्रवासी रूप में रहने वाले समुदाय को सूचित कर सकता है। यह अनुवाद सामुदायिक और विस्थापित—दोनों भावों को स्पष्ट, सहज हिंदी में रखता है।
- source_word: ψυχὴ σεσωμένη
  choice: बचाया गया एक जीवन
  rationale: ψυχή को फिर जीवन के अर्थ में लिया गया है, और perfect participle से प्राप्त बचाए जा चुके होने की अवस्था को ‘बचाया गया’ व्यक्त करता है।
- source_word: ἐξ αὐτῶν
  choice: उनमें से
  rationale: यह पहले उल्लिखित लोगों के बीच से किसी एक बचाए गए जीवन की ओर स्वाभाविक रूप से संकेत करता है।
theological_decisions:
- issue: दोनों स्थानों पर ψυχή का अनुवाद ‘आत्मा’ किया जाए या ‘जीवन/प्राण’
  choice: पहले स्थान पर ‘प्राण’ और दूसरे पर ‘जीवन’
  alternative: दोनों स्थानों पर ‘आत्मा/आत्माएँ’
  rationale: पद का निकट संदर्भ संकट से बच निकलने और जीवित रहने का है। इसलिए यहाँ जीवन का भाव प्रमुख है; ‘आत्मा’ करने से यूनानी पाठ की अपेक्षा अधिक विशिष्ट मानवशास्त्रीय अर्थ जुड़ सकता है। हिंदी की स्वाभाविकता के लिए ‘प्राण बचाए जाएँ’ और ‘एक जीवन’ प्रयोग किए गए हैं।
- issue: σωθῆναι की कर्मवाच्यता
  choice: ‘बचाए जाएँ’ द्वारा कर्मवाच्य बनाए रखा गया
  alternative: ‘अपने प्राण बचाने के लिए’ जैसा कर्तृवाच्य रूप
  rationale: यूनानी पाठ बचाने वाले को स्पष्ट नहीं करता। कर्मवाच्य अनुवाद संभावित दैवी या परिस्थितिजन्य कर्ता को बिना निर्धारित किए मूल की व्याकरणिक और धर्मवैचारिक खुली जगह सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निर्जन प्रदेश’, ‘परदेश में बसे समुदाय’ और ‘बहुमूल्य’ काव्यात्मक गंभीरता बनाए रखते हैं, जबकि अनावश्यक रूप से पुरातन या सांप्रदायिक शब्दावली से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
