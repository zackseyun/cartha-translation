translation:
  language: hi
  text: उसके वचन पवित्र किए गए जनसमुदायों के बीच के पवित्र जनों के वचनों के समान हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ λόγοι αὐτοῦ
  choice: उसके वचन
  rationale: λόγοι का सीधा अर्थ ‘वचन’ या ‘कथन’ है। ‘वचन’ गरिमापूर्ण और सहज है तथा पद में संज्ञा की पुनरावृत्ति बनाए रखता है।
- source_word: ὡς
  choice: के समान हैं
  rationale: ὡς यहाँ समानता प्रकट करता है, पहचान नहीं; ‘के समान हैं’ उपमा को स्पष्ट रखता है।
- source_word: λόγοι ἁγίων
  choice: पवित्र जनों के वचन
  rationale: ἁγίων को यहाँ व्यक्तिवाचक रूप में समझना स्वाभाविक है; इसलिए इसका अर्थ पवित्र व्यक्तियों के वचन है, न कि केवल ‘पवित्र वचन’।
- source_word: ἐν μέσῳ
  choice: के बीच
  rationale: यह पदबंध किसी समुदाय के मध्य या बीच होने का भाव देता है; ‘के बीच’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λαῶν ἡγιασμένων
  choice: पवित्र किए गए जनसमुदायों
  rationale: λαῶν बहुवचन है, जिसे ‘जनसमुदायों’ से सुरक्षित रखा गया है। ἡγιασμένων पूर्ण कर्मवाच्य कृदंत है, इसलिए ‘पवित्र किए गए’ उसके क्रियात्मक और कर्मवाच्य भाव को बनाए रखता है।
