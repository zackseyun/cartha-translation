    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσαν
  choice: उजाड़ दिया
  rationale: यह क्रिया किसी वस्तु को उजाड़ या वीरान कर देने का प्रबल भाव व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: τὸν θρόνον Δαυὶδ
  choice: दाऊद के सिंहासन
  rationale: यह सीधा अनुवाद राजकीय और वंशगत अर्थ को बनाए रखता है।
- source_word: ἐν ὑπερηφανίᾳ ἀλλάγματος
  choice: अभिमान भरे हड़पने से
  rationale: ὑπερηφανία अभिमान या घमण्ड दर्शाता है। ἀλλάγματος का मूल अर्थ बदलाव, अदला-बदली या प्रतिस्थापन है; राजवंशीय सन्दर्भ में ‘हड़पना’ सम्भावित राजनीतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल पदबंध की संक्षिप्तता और अस्पष्टता सुरक्षित रखती है।
- source_word: καταβαλεῖς
  choice: गिरा देगा
  rationale: भविष्यकालीन क्रिया निर्णायक रूप से नीचे गिराने या परास्त करने का भाव देती है।
- source_word: ἀρεῖς
  choice: मिटा देगा
  rationale: αἴρω का अर्थ उठा लेना या हटा देना है। वंश को पृथ्वी पर से हटाने के प्रसंग में ‘मिटा देना’ स्वाभाविक है, यद्यपि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: σπέρμα αὐτῶν
  choice: उनके वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर यहाँ भाव संतति या वंश का है; ‘वंश’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: ἀπὸ τῆς γῆς
  choice: पृथ्वी पर से
  rationale: γῆ भूमि या पृथ्वी दोनों हो सकता है। यहाँ व्यापक अर्थ को संकुचित न करते हुए ‘पृथ्वी’ रखा गया है।
theological_decisions:
- issue: καταβαλεῖς और ἀρεῖς का काल
  choice: 'भविष्यकाल: ‘गिरा देगा’ और ‘मिटा देगा’'
  alternative: 'भूतकाल: ‘गिरा दिया’ और ‘मिटा दिया’'
  rationale: दोनों यूनानी रूप स्पष्टतः भविष्यकालीन हैं। निकटवर्ती ऐतिहासिक सन्दर्भ के आधार पर भूतकाल सम्भव मानने के बावजूद, इस पद में उपलब्ध स्रोत-पाठ की व्याकरणिक आकृति को बनाए रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘हे परमेश्वर, तू’ प्रार्थनात्मक प्रत्यक्ष सम्बोधन और मूल के एकवचन को सुरक्षित रखता है। अन्त का अल्पविराम अगले पद से वाक्यगत निरन्तरता दर्शाता है।
