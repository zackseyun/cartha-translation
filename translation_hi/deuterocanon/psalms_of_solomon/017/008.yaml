  text: उन्होंने दाऊद के सिंहासन को अभिमानपूर्ण हड़पने में उजाड़ दिया[a]। परन्तु हे परमेश्वर, तू उन्हें गिरा देगा और उनके वंश को पृथ्वी से हटा देगा[b],
  philosophy: optimal-equivalence
  footnotes:
