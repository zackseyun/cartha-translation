lexical_decisions:
- source_word: ἐν τῷ ἐπαναστῆναι
  choice: जब ... उठ खड़ा हुआ
  rationale: ἐν के साथ articular infinitive यहाँ समय-सूचक है; ‘जब’ उसका स्वाभाविक हिन्दी रूप है। ‘उठ खड़ा हुआ’ विरोध में खड़े होने की क्रियात्मक शक्ति बनाए रखता है।
- source_word: αὐτοῖς
  choice: उनके विरुद्ध
  rationale: ἐπανίστημι के साथ dative उस पक्ष को सूचित करता है जिसके विरोध में कोई उठता है; इसलिए ‘उनके विरुद्ध’ प्रसंगानुकूल है।
- source_word: ἄνθρωπον
  choice: एक मनुष्य
  rationale: यूनानी शब्द एकवचन और पुल्लिंग है; ‘एक मनुष्य’ उसके रूप को औपचारिक तथा गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἀλλότριον
  choice: से बाहर का
  rationale: यहाँ शब्द अपने समुदाय से संबंध न रखने वाले व्यक्ति को दर्शाता है; γένους ἡμῶν के साथ ‘हमारे वंश से बाहर का’ स्वाभाविक हिन्दी है।
- source_word: γένους ἡμῶν
  choice: हमारे वंश
  rationale: γένος यहाँ साझा उत्पत्ति, कुल या जन-समुदाय का बोध करा सकता है। ‘वंश’ मूल की निकटता और प्रसंग का जातीय-सामुदायिक भाव बनाए रखता है, जबकि आधुनिक जैविक ‘नस्ल’ के भ्रामक संकेत से बचता है।
