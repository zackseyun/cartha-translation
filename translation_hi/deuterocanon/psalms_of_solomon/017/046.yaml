  text: With equity he will lead them all[b][a], and there will be no arrogance among them to oppress one another.
translation:
  language: hi
  text: वह उन सबको निष्पक्षता से ले चलेगा, और उनके बीच ऐसा अहंकार न होगा जिसके कारण उनके बीच किसी को दबाया जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य-विन्यास कठिन है और क्रिया का रूप कर्मवाच्य है। शाब्दिक भाव है: “और उनमें ऐसा अहंकार न होगा कि उनमें अत्याचार सहा जाए।” प्रसंग में इसका अर्थ यह भी हो सकता है कि उनमें कोई अहंकार से दूसरे पर अत्याचार न करे।'
    reason: मूल पाठ की व्याकरणिक कठिनाई और सम्भावित सक्रिय भावार्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐν ἰσότητι
  choice: समान न्याय से
  rationale: ἰσότης में समानता और निष्पक्ष व्यवहार, दोनों का भाव है। राजा के नेतृत्व के प्रसंग में ‘समान न्याय से’ इस सामाजिक और शासकीय आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάντας αὐτοὺς
  choice: उन सबको
  rationale: यह पद समूह के प्रत्येक व्यक्ति को समेटता है; ‘उन सबको’ उसके व्यापक और बलपूर्ण अर्थ को बनाए रखता है।
- source_word: ἄξει
  choice: ले चलेगा
  rationale: ἄγω का मूल अर्थ ‘ले चलना/नेतृत्व करना’ है। ‘ले चलेगा’ मार्गदर्शन और पूर्ववर्ती चरवाही-सदृश चित्र, दोनों के अनुकूल है।
- source_word: ὑπερηφανία
  choice: अहंकार
  rationale: यह शब्द ऊँचा समझने वाले, दूसरों पर चढ़ बैठने वाले रवैये को दर्शाता है। ‘अहंकार’ आधुनिक हिन्दी में स्पष्ट है और सामाजिक अत्याचार के संदर्भ में उपयुक्त बैठता है।
- source_word: τοῦ καταδυναστευθῆναι
  choice: कि … किसी पर अत्याचार किया जाए
  rationale: καταδυναστευθῆναι रूप की दृष्टि से कर्मवाच्य infinitive है। मुख्य पाठ कर्मवाच्य को बनाए रखते हुए कठिन यूनानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘किसी’ संदर्भ से निहित व्यक्ति को स्पष्ट करता है।
- source_word: ἐν αὐτοῖς
  choice: उनके बीच / उनमें
  rationale: यूनानी पाठ में यह भाव दो बार आता है। हिन्दी में ‘उनके बीच’ और ‘उनमें’ द्वारा दोनों उपस्थितियों को बनाए रखा गया है, बिना वाक्य को अनावश्यक रूप से बोझिल बनाए।
theological_decisions:
- issue: राजा के शासन का सामाजिक स्वरूप
  choice: पद में समान न्याय वाला नेतृत्व और समुदाय के भीतर अत्याचार का अभाव व्यक्त किया गया है।
  alternative: इसे केवल अमूर्त समानता का कथन मानना, या कर्मवाच्य कठिनाई को मिटाकर सीधे कहना कि लोग एक-दूसरे पर अत्याचार नहीं करेंगे।
  rationale: यूनानी पाठ न्यायपूर्ण नेतृत्व और समुदाय के भीतर दमन के न होने पर बल देता है। अनुवाद इस नैतिक-सामाजिक आशय को रखता है, पर पाठ से आगे कोई विशिष्ट राजनीतिक या सम्प्रदायगत दावा नहीं जोड़ता।
- issue: कर्मवाच्य infinitive की व्याख्या
  choice: 'मुख्य पाठ में कर्मवाच्य रखा गया है: ‘किसी पर अत्याचार किया जाए।’'
  alternative: 'भावानुसार सक्रिय रूप: ‘वे एक-दूसरे पर अत्याचार करें।’'
  rationale: καταδυναστευθῆναι स्पष्टतः कर्मवाच्य है और वाक्य-विन्यास कठिन है। मुख्य पाठ रूपगत साक्ष्य को सुरक्षित रखता है; पादटिप्पणी अधिक प्रवाहपूर्ण सक्रिय अर्थ की संभावना बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘समान न्याय’ शाब्दिक ‘समानता में’ की अपेक्षा स्वाभाविक है, जबकि न्यायपूर्ण और निष्पक्ष नेतृत्व का आशय बनाए रखता है। अंतिम उपवाक्य में मूल यूनानी का कर्मवाच्य और दोनों सामुदायिक संकेत सुरक्षित हैं।
