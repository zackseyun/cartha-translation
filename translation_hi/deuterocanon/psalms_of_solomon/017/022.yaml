lexical_decisions:
- source_word: βασιλεὺς
  choice: राजा
  rationale: यह सामान्य राजनीतिक पदवी का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐν
  choice: में
  rationale: तीनों खंडों में दोहराया गया ἐν प्रत्येक कर्ता की दशा या क्षेत्र बताता है; ‘में’ यूनानी समानांतरता और लय को बनाए रखता है।
- source_word: παρανομίᾳ
  choice: व्यवस्था के उल्लंघन
  rationale: यह पद कानून अथवा स्थापित व्यवस्था की अवहेलना का नैतिक-कानूनी भाव सुरक्षित रखता है; केवल ‘दुष्टता’ कहना इस विशेषता को धुंधला कर देता।
- source_word: κριτὴς
  choice: न्यायाधीश
  rationale: यह उल्लिखित पद का स्पष्ट और आधुनिक मानक हिन्दी रूप है।
- source_word: ἀπειθείᾳ
  choice: अवज्ञा
  rationale: इस नागरिक-नैतिक संदर्भ में यह आज्ञा न मानने का भाव व्यक्त करता है; ‘अविश्वास’ अनावश्यक रूप से संकीर्ण धार्मिक अर्थ जोड़ सकता है।
- source_word: λαὸς
  choice: प्रजा
  rationale: राजा और न्यायाधीश के राजनीतिक संदर्भ में सामूहिक λαός के लिए ‘प्रजा’ स्वाभाविक है और जनता को शासकीय व्यवस्था से संबद्ध समूह के रूप में दिखाता है।
- source_word: ἁμαρτίᾳ
  choice: पाप
  rationale: यह संक्षिप्त, सीधा अनुवाद है और त्रिस्तरीय आरोप के अंतिम खंड की तीक्ष्णता बनाए रखता है।
