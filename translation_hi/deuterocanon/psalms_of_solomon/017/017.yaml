base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/017.yaml
  text: And the sons of the covenant prevailed over them in the midst of the mixed nations[a]; there was no one among them, in Jerusalem[b], doing mercy and truth.
translation:
  language: hi
  text: और वाचा के पुत्र मिली-जुली जातियों के बीच उन पर प्रबल थे; यरूशलेम में उनके बीच कोई न था जो दया और सच्चाई[a] दिखाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दया और विश्वासयोग्यता।”
    reason: इस सामी शैली के युग्म में ἀλήθεια का अर्थ ‘विश्वासयोग्यता’ भी हो सकता है।
lexical_decisions:
- source_word: ἐπεκρατοῦσαν
  choice: उन पर प्रबल होते गए
  rationale: अपूर्ण भूतकाल जारी स्थिति या क्रिया को दिखाता है, और संबंधकारक αὐτῶν के साथ क्रिया का अर्थ उन पर प्रबल होना या बढ़त बनाए रखना है। यह अनुवाद राजनीतिक शासन का अर्थ अनावश्यक रूप से नहीं थोपता।
- source_word: υἱοὶ τῆς διαθήκης
  choice: वाचा के पुत्र
  rationale: यूनानी पदबंध स्पष्ट रूप से पुल्लिंग बहुवचन है और वाचा से जुड़ी पहचान को व्यक्त करता है; इसलिए इसके लिंग-सूचक और धार्मिक भार को बनाए रखा गया है।
- source_word: ἐθνῶν συμμίκτων
  choice: मिली-जुली जातियों
  rationale: συμμίκτων में मिले-जुले या परस्पर घुले होने का भाव है, जबकि ἐθνῶν जनजातीय-राष्ट्रीय समुदायों को दर्शाता है।
- source_word: ὁ ποιῶν
  choice: पर चलनेवाला
  rationale: शाब्दिक अर्थ 'करनेवाला' है, पर हिंदी में 'दया और सच्चाई करना' अस्वाभाविक है। 'पर चलनेवाला' नैतिक आचरण के जारी अभ्यास को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔλεος
  choice: दया
  rationale: ἔλεος करुणापूर्ण दया या कृपा को व्यक्त करता है; 'दया' इसका सीधा और सहज हिंदी रूप है।
- source_word: ἀλήθειαν
  choice: सच्चाई
  rationale: ἀλήθεια का मूल अर्थ सत्य या सच्चाई है, यद्यपि इस सामी शैली के युग्म में इसका भाव विश्वासयोग्यता भी हो सकता है; मुख्य पाठ में व्यापक अर्थ वाला 'सच्चाई' रखा गया है।
theological_decisions:
- issue: क्या υἱοὶ τῆς διαθήκης के लिंग-सूचक रूप को सामान्यीकृत किया जाए
  choice: वाचा के पुत्र
  alternative: वाचा की संतान / वाचा के लोग
  rationale: मूल यूनानी का पुल्लिंग रूप पहचान-सूचक है, केवल आकस्मिक व्याकरणिक रूप नहीं; इसलिए उसे मुख्य पाठ में सुरक्षित रखा गया है।
- issue: ἔλεος καὶ ἀλήθειαν के सामी नैतिक-वाचागत युग्म का अनुवाद
  choice: दया और सच्चाई
  alternative: दया और विश्वासयोग्यता
  rationale: मुख्य पाठ मूल के पारदर्शी युग्म को बनाए रखता है, जबकि ἀλήθεια के वाचागत अर्थ 'विश्वासयोग्यता' को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐπεκρατοῦσαν को तुलना या प्रभुत्व के रूप में समझना
  choice: उन पर प्रबल होते गए
  alternative: उनसे बढ़ गए / उनसे आगे निकल गए
  rationale: निकट संदर्भ तुलना का संकेत दे सकता है, लेकिन क्रिया और αὐτῶν का सीधा बल 'उन पर प्रबल होना' है। मुख्य पाठ उस वास्तविक भाषिक अस्पष्टता को तुलना की एक निश्चित व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। 'वाचा' धार्मिक-साहित्यिक पद है, जबकि वाक्य-विन्यास को हिंदी में स्वाभाविक रखा गया है। मुख्य पाठ में स्रोत की अस्पष्टता और नैतिक-वाचागत तनाव सुरक्षित हैं।
