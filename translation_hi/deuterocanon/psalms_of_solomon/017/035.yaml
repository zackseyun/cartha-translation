  text: और प्रभु की उस महिमा को देखना, जिससे परमेश्वर ने उसे महिमामंडित किया[a]; और वह स्वयं उन पर एक धर्मी राजा होगा, परमेश्वर द्वारा सिखाया हुआ[b][c],
