- source_word: δόξαν Κυρίου
  choice: प्रभु की महिमा
  rationale: यह अनुवाद ऊँचे बाइबलीय भाव और दिखाई देने वाले वैभव तथा सम्मान—दोनों अर्थों को बनाए रखता है।
- source_word: ἐδόξασεν αὐτὴν
  choice: उसे महिमामंडित किया
  rationale: ‘महिमा’ और ‘महिमामंडित’ के सजातीय प्रयोग से यूनानी संज्ञा और क्रिया का शब्द-साम्य सुरक्षित रहता है। αὐτήν स्त्रीलिंग है और प्रसंग में मानवीकृत यरूशलेम की ओर संकेत करता है; हिंदी में ‘उसे’ स्वाभाविक है।
- source_word: βασιλεὺς δίκαιος
  choice: एक धर्मी राजा
  rationale: ‘धर्मी’ नैतिक और धार्मिक दोनों आयामों को व्यक्त करता है तथा δικ- शब्द-समूह के बाइबलीय प्रयोग के अनुकूल है।
- source_word: διδακτὸς ὑπὸ θεοῦ
  choice: परमेश्वर द्वारा सिखाया हुआ
  rationale: यह निष्क्रिय भाव को स्पष्ट रखते हुए बताता है कि शिक्षा का स्रोत परमेश्वर है।
- source_word: ἐπ’ αὐτούς
  choice: उन पर
  rationale: राजत्व के प्रसंग में यह लोगों पर शासन करने के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दूसरे उपवाक्य में व्यक्त क्रिया का अभाव
  choice: वह स्वयं ... राजा होगा
  alternative: वह स्वयं, ... एक धर्मी राजा
  rationale: प्राप्त यूनानी पाठ में यह उपवाक्य क्रियारहित है। भविष्यकालीन प्रसंग के कारण हिंदी में ‘होगा’ जोड़ना अर्थ को स्पष्ट करता है, पर पादटिप्पणी मूल की संक्षिप्तता बताती है।
- issue: ‘परमेश्वर द्वारा सिखाया हुआ’ का वाक्यगत संबंध
  choice: इसे ‘उन पर एक धर्मी राजा होगा’ के बाद रखा गया है
  alternative: ‘वह स्वयं परमेश्वर द्वारा सिखाया हुआ एक धर्मी राजा होकर उन पर होगा’
  rationale: मुख्य पाठ में ‘उन पर’ को राजत्व के निकट रखने से हिंदी प्रवाह स्पष्ट होता है; यूनानी पदक्रम के अधिक निकट विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बाइबलीय हिंदी रखी गई है। पद एक बड़े वाक्य का अंश है, इसलिए आरंभ का ‘और’ तथा अंत का अल्पविराम बनाए रखा गया है।
