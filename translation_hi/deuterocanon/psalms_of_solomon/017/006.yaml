  yaml_path: translation/deuterocanon/psalms_of_solomon/017/006.yaml
  text: And in our sins sinners rose up against us[a]; they attacked us and drove us out[c][b]. Those to whom you had not promised it took it away by force.
translation:
  language: hi
  text: और हमारे पापों के कारण पापी हमारे विरुद्ध उठ खड़े हुए; उन्होंने हम पर आक्रमण किया और हमें निकाल दिया। जिनसे तूने कोई प्रतिज्ञा नहीं की थी[a], उन्होंने बलपूर्वक छीन लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया द्वितीय पुरुष एकवचन है—अर्थात् ‘तूने प्रतिज्ञा नहीं की थी’; यह पिछले पद में प्रभु को किए गए संबोधन को आगे बढ़ाती है।
    reason: textual_variant
  - marker: b
    text: यूनानी में यह नहीं बताया गया है कि उन्होंने क्या छीन लिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἁμαρτίαις ἡμῶν
  choice: हमारे पापों के कारण
  rationale: संदर्भ में ἐν उन पापों को विपत्ति की परिस्थिति अथवा कारण के रूप में प्रस्तुत करता है। आधुनिक हिन्दी में ‘के कारण’ इस संबंध को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: ἐπανέστησαν ἡμῖν
  choice: हमारे विरुद्ध उठ खड़े हुए
  rationale: क्रिया में विरोधपूर्ण ढंग से उठ खड़े होने का भाव है; यह अनुवाद उसके शत्रुतापूर्ण बल और चित्रात्मकता दोनों को बनाए रखता है।
- source_word: ἐπέθεντο ἡμῖν
  choice: हम पर आक्रमण किया
  rationale: हिंसक कार्यवाही और उसके बाद निष्कासन के संदर्भ में यह क्रिया आक्रमण करने का अर्थ देती है।
- source_word: ἐξώσαντο ἡμᾶς
  choice: हमें निकाल दिया
  rationale: क्रिया बलपूर्वक बाहर कर देने को व्यक्त करती है। ‘निकाल दिया’ सरल, स्वाभाविक और प्रसंगानुकूल है।
- source_word: οἷς οὐκ ἐπηγγείλω
  choice: जिनसे तूने कोई प्रतिज्ञा नहीं की थी
  rationale: οἷς का संबंध पहले आए ‘पापियों’ से है और ἐπηγγείλω द्वितीय पुरुष एकवचन है। हिन्दी में ‘जिनसे ... प्रतिज्ञा’ प्रतिज्ञा के प्राप्तकर्ताओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μετὰ βίας ἀφείλαντο
  choice: उन्होंने बलपूर्वक छीन लिया
  rationale: μετὰ βίας जबरदस्ती को व्यक्त करता है और ἀφείλαντο किसी वस्तु को ले लेने या हटा लेने को। ‘छीन लिया’ हिंसक अधिग्रहण को व्यक्त करते हुए मूल में अनकहे कर्म को अनकहा रहने देता है।
theological_decisions:
- issue: ἐπηγγείλω का पुरुष और निहित वक्ता
  choice: द्वितीय पुरुष एकवचन ‘तूने’ रखा गया है।
  alternative: इसे प्रथम पुरुष ‘मैंने’ अथवा भाववाच्य ‘उनसे प्रतिज्ञा नहीं की गई थी’ बनाना।
  rationale: यूनानी रूप ἐπηγγείλω द्वितीय पुरुष एकवचन है और पिछले पद में परमेश्वर को किए गए सीधे संबोधन को आगे बढ़ाता है। अनुवाद व्याकरणिक रूप को बनाए रखता है, पर इस पद के भीतर संबोधित व्यक्ति का नाम नहीं जोड़ता।
- issue: ἀφείλαντο का अनकहा कर्म
  choice: ‘छीन लिया’ के कर्म को अनकहा रखा गया है।
  alternative: ‘राज्य’, ‘विरासत’, ‘देश’ या किसी अन्य वस्तु को स्पष्ट रूप से जोड़ना।
  rationale: यूनानी पाठ कर्म को व्यक्त नहीं करता। कोई निश्चित वस्तु जोड़ने से पाठ की वास्तविक अपूर्णता मिट जाती और व्याख्या अनुवाद में प्रवेश कर जाती।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को संबोधन के लिए ‘तू’ का प्रयोग भजन-काव्य की निकट और प्रत्यक्ष शैली के अनुरूप है। समान मूल वाले ‘पापों/पापी’ को जानबूझकर बनाए रखा गया है।
