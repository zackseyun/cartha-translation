  text: And he will gather a holy people[a], whom he will lead in righteousness[d][c][b]; and he will judge the tribes of the people sanctified by the Lord his God.
translation:
  language: hi
  text: और वह एक पवित्र प्रजा को इकट्ठा करेगा, जिसकी वह धार्मिकता[a] से अगुवाई करेगा; और वह उस प्रजा के गोत्रों का न्याय[b] करेगा, जिसे प्रभु उसके परमेश्वर ने पवित्र किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय से।”
    reason: lexical_alternative
  - marker: b
    text: इस राजकीय संदर्भ में “न्याय करेगा” का व्यापक अर्थ “शासन करेगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνάξει
  choice: इकट्ठा करेगा
  rationale: यह लोगों को एक साथ एकत्र करने की भावी क्रिया को सहज और सीधे रूप में व्यक्त करता है।
- source_word: λαὸν ἅγιον
  choice: एक पवित्र प्रजा
  rationale: ‘पवित्र प्रजा’ ἅγιος के धार्मिक और सामुदायिक भाव को बनाए रखता है; ‘एक’ यूनानी के अनिर्दिष्ट रूप को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἀφήγήσεται
  choice: अगुवाई करेगा
  rationale: यह क्रिया लोगों को राह दिखाते हुए आगे ले चलने का भाव रखती है; ‘अगुवाई करेगा’ राजकीय संदर्भ में स्वाभाविक है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता से
  rationale: यह उसकी अगुवाई के ढंग को व्यक्त करता है और δικαιοσύνη के नैतिक-धार्मिक अर्थ को बनाए रखता है; न्याय का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: κρινεῖ
  choice: न्याय करेगा
  rationale: यह κρίνω का मूल न्यायिक अर्थ सुरक्षित रखता है, जबकि राजकीय संदर्भ में शासन करने की व्यापक छाया पादटिप्पणी में दी गई है।
- source_word: φυλὰς λαοῦ ἡγιασμένου
  choice: उस प्रजा के गोत्रों … जिसे … पवित्र किया है
  rationale: एकवचन संबंधकारक कृदंत ἡγιασμένου का संबंध ‘प्रजा’ से स्पष्ट किया गया है, न कि बहुवचन ‘गोत्रों’ से; हिन्दी का ‘उस’ पहले उल्लिखित पवित्र प्रजा से स्वाभाविक संबंध बनाता है।
- source_word: ὑπὸ Κυρίου θεοῦ αὐτοῦ
  choice: प्रभु, उसके परमेश्वर ने
  rationale: कर्तृवाच्य हिन्दी मूल के कर्मवाच्य कर्ता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है तथा αὐτοῦ का व्यक्तिगत संबंध सुरक्षित रखती है।
theological_decisions:
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: शब्द नैतिक धार्मिकता और न्याय—दोनों अर्थ दे सकता है। मुख्य पाठ में व्यापक पारंपरिक अर्थ रखा गया है और राजकीय संदर्भ में संभव ‘न्याय’ को पादटिप्पणी में स्वीकार किया गया है।
- issue: κρινεῖ का राजकीय आशय
  choice: न्याय करेगा
  alternative: शासन करेगा
  rationale: मूल न्यायिक क्रिया को मुख्य पाठ में रखा गया है; मसीही-राजकीय संदर्भ में इसके व्यापक शासकीय अर्थ को बिना निर्णायक बनाए पादटिप्पणी में दर्शाया गया है।
- issue: ἡγιασμένου का कर्तृ-कर्म संबंध
  choice: जिसे प्रभु, उसके परमेश्वर ने पवित्र किया है
  alternative: प्रभु, उसके परमेश्वर द्वारा पवित्र की गई प्रजा
  rationale: दोनों रूप पूर्ण कर्मवाच्य का भाव देते हैं। संबंधवाचक उपवाक्य आधुनिक हिन्दी में अधिक स्पष्ट है और बताता है कि पवित्र की गई इकाई ‘प्रजा’ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘प्रजा’, ‘अगुवाई’ और ‘गोत्र’ सामुदायिक तथा राजकीय संदर्भ को स्पष्ट रखते हैं। विरामचिह्न यूनानी के दो समांतर खंडों को दर्शाते हैं।
