  text: to drive sinners out from the inheritance[a], to wipe out the pride of the sinner like a potter's vessels[d][c][b], to crush all their substance with an iron rod.
translation:
  language: hi
  text: पापियों को विरासत[a] से निकाल बाहर करने, पापी[b] के घमंड को कुम्हार के बरतनों की तरह तोड़ डालने, और लोहे के दंड से उनका सारा आधार[c] चूर कर देने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धरोहर’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘पापी’ एकवचन है; यहाँ यह सभी पापियों का प्रतिनिधि हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘उनका सारा आधार’ का अर्थ ‘उनकी पूरी स्थिति’ या ‘उनकी सारी सम्पत्ति’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῶσαι
  choice: निकाल बाहर करने
  rationale: यह बलपूर्वक निष्कासन का भाव व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κληρονομίας
  choice: विरासत
  rationale: यह पैतृक अधिकार या बाँट में मिली धरोहर, सम्भवतः वाचा से जुड़ी भूमि, दोनों का संकेत दे सकता है।
- source_word: ἐκτρῖψαι
  choice: मिटा देने
  rationale: क्रिया पूर्ण विनाश या उन्मूलन का भाव रखती है; आगे कुम्हार के बरतनों का बिंब इस विनाश की नाजुकता और सम्पूर्णता को तीखा बनाता है।
- source_word: ὑπερηφανίαν ἁμαρτωλοῦ
  choice: पापी के घमंड
  rationale: मूल में ‘पापी’ एकवचन है और सम्भवतः प्रतिनिधिक एकवचन है; उसे बहुवचन में समतल नहीं किया गया।
- source_word: σκεύη κεραμέως
  choice: कुम्हार के बरतन
  rationale: यह मिट्टी के आसानी से टूटने वाले पात्रों का ठोस बिंब बनाए रखता है।
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: लोहे के दंड से
  rationale: ‘दंड’ मूल के rod/staff जैसे अर्थ और न्यायपूर्ण शक्ति के बिंब को बिना अनावश्यक रूप से ‘राजदंड’ तय किए सुरक्षित रखता है।
- source_word: συντρίψαι
  choice: चूर कर देने
  rationale: यह बलपूर्वक तोड़ डालने का अर्थ और काव्यात्मक तीव्रता व्यक्त करता है।
- source_word: πᾶσαν ὑπόστασιν αὐτῶν
  choice: उनके सारे आधार
  rationale: ὑπόστασις उनकी सत्ता, टिकाव, साधन या सम्पत्ति के आधार को सूचित कर सकता है; ‘आधार’ इस व्यापकता को पूरी तरह किसी एक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: ‘पापी’ का एकवचन
  choice: प्रतिनिधिक एकवचन को मुख्य पाठ में बनाए रखा गया
  alternative: ‘पापियों के घमंड’
  rationale: यूनानी पाठ एकवचन है; बहुवचन करने से उसकी व्याकरणिक और सम्भावित प्रतिनिधिक धार कम हो जाती।
- issue: ὑπόστασις का आशय
  choice: ‘आधार’
  alternative: ‘सम्पत्ति’ या ‘सत्ता’
  rationale: सन्दर्भ निर्णायक रूप से केवल धन, सामाजिक स्थिति या अस्तित्व में से किसी एक को नहीं चुनता; इसलिए मूल की अर्थगत व्यापकता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। पद एक आश्रित प्रयोजन-वाक्यांश है, इसलिए अन्त में ‘के लिए’ रखकर मूल के क्रियार्थक रूपों की संरचना सुरक्षित की गई। ‘दंड’ और ‘चूर कर देने’ न्याय तथा विनाश के बिंब को स्पष्ट रखते हैं, जबकि कठिन शब्द ὑπόστασις की वास्तविक अस्पष्टता पाद-टिप्पणी में दी गई है।
