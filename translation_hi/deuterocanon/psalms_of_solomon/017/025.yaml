  text: In wisdom and righteousness[c][b][a], cleanse Jerusalem from nations trampling her in destruction.
translation:
  language: hi
  text: बुद्धि और धार्मिकता[a] से यरूशलेम को उन राष्ट्रों[b] से शुद्ध कर, जो उसे रौंदते हुए विनाश मचा रहे हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धार्मिकता’ के स्थान पर ‘न्याय’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘राष्ट्रों’ के स्थान पर ‘गैर-यहूदियों’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी में वाक्यांशों का क्रम अधिक शाब्दिक रूप से यह है: “यरूशलेम को उन राष्ट्रों से शुद्ध कर, जो उसे विनाश में रौंद रहे हैं—बुद्धि में और धार्मिकता में।” अंतिम दो वाक्यांशों का संबंध शुद्ध करने की क्रिया से समझना स्वाभाविक है, पर यूनानी की संक्षिप्त संरचना कुछ हद तक खुली रहती है।'
    reason: source_ambiguity
lexical_decisions:
- source_word: καθάρισον
  choice: शुद्ध कर
  rationale: यह एक निर्णायक आज्ञार्थक विनती है। ‘शुद्ध कर’ धार्मिक अशुद्धता दूर करने और नगर को भ्रष्टकारी दमन से मुक्त करने—दोनों संभावित भावों को बनाए रखता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: ἐθνῶν
  choice: जातियों
  rationale: यहाँ शब्द विदेशी जनसमूहों या राष्ट्रों की ओर संकेत करता है। ‘जातियों’ से व्यापक अर्थ बना रहता है; इसे केवल तकनीकी यहूदी/गैर-यहूदी भेद तक सीमित नहीं किया गया।
- source_word: καταπατούντων
  choice: जो उसे ... रौंद रही हैं
  rationale: वर्तमान कृदन्त शत्रुतापूर्ण, अपमानजनक दमन का सजीव चित्र देता है। हिन्दी में ‘रौंद रही हैं’ यह बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν ἀπωλείᾳ
  choice: विनाश के लिए
  rationale: यह वाक्यांश रौंदने के विनाशकारी परिणाम या दिशा को व्यक्त कर सकता है। ‘विनाश के लिए’ उस परिणामगत भाव को संक्षेप में रखता है, यद्यपि यूनानी की अभिव्यक्ति अधिक संकुचित और कुछ हद तक अस्पष्ट है।
- source_word: ἐν σοφίᾳ
  choice: बुद्धि से
  rationale: ‘से’ रीति या साधन दोनों का संकेत दे सकता है और शुद्ध करने की माँग से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता से
  rationale: ‘धार्मिकता’ δικαιοσύνη के नैतिक और ईश्वरीय मानक को बनाए रखती है; संदर्भानुसार ‘न्याय’ भी संभव है।
theological_decisions:
- issue: ἐθνῶν को सामान्य ‘जातियों’ के रूप में समझा जाए या विशेष रूप से ‘गैर-यहूदियों’ के रूप में।
  choice: जातियों
  alternative: गैर-यहूदियों
  rationale: संदर्भ यरूशलेम को दबाने वाले विदेशी जनसमूहों का है। व्यापक अनुवाद अनावश्यक रूप से तकनीकी धार्मिक विरोध स्थापित नहीं करता।
- issue: ἐν σοφίᾳ और ἐν δικαιοσύνῃ शुद्ध करने की क्रिया से जुड़ते हैं या दमनकारी जातियों/उनके न्याय से।
  choice: इन वाक्यांशों को आरम्भ में रखकर ‘शुद्ध कर’ से जोड़ा गया है।
  alternative: उन्हें वाक्य के अंत में रखकर यूनानी का संभावित संरचनात्मक द्व्यर्थ खुला छोड़ा जा सकता है।
  rationale: यह मुख्य सम्भावित अर्थ को स्पष्ट और स्वाभाविक हिन्दी में देता है, जबकि पादटिप्पणी यूनानी की संक्षिप्त संरचना और उससे उत्पन्न वैकल्पिक जुड़ाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। एकवचन आज्ञार्थक ‘कर’ मूल पाठ की सीधी विनती को बनाए रखता है। वाक्य का आरम्भ ‘बुद्धि और धार्मिकता से’ करने पर इन शब्दों का संबंध शुद्ध करने की क्रिया से स्पष्ट होता है; स्रोत की वास्तविक संरचनात्मक अस्पष्टता पादटिप्पणी में दी गई है।
