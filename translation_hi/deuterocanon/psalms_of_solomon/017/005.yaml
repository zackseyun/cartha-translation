  yaml_path: translation/deuterocanon/psalms_of_solomon/017/005.yaml
  text: You[a], Lord, chose David as king over Israel, and you swore to him concerning his offspring forever[b], that his kingdom would not fail before you.
translation:
  language: hi
  text: हे प्रभु, आप ही ने दाऊद को इस्राएल पर राजा के रूप में चुना, और आप ही ने उसके वंश[a] के विषय में दाऊद से सदा के लिए शपथ खाई कि उसका राज्य[b] आपके सामने कभी समाप्त न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “बीज,” अर्थात उसकी संतान या वंशज।
    reason: lexical_alternative
  - marker: b
    text: या “उसका राजवंश आपके सामने कभी समाप्त न होगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: σύ, Κύριε
  choice: हे प्रभु, आप ही ने
  rationale: प्रत्यक्ष संबोधन के लिए ‘हे प्रभु’ स्वाभाविक और गरिमापूर्ण है। दो बार आए σύ के बल को ‘आप ही ने’ से व्यक्त किया गया है।
- source_word: ᾑρέτισω
  choice: चुना
  rationale: यह क्रिया दाऊद के राजत्व के लिए परमेश्वर के चुनाव को व्यक्त करती है; ‘चुना’ किसी अतिरिक्त नियुक्ति-विधि का भाव जोड़े बिना अर्थ देता है।
- source_word: βασιλέα ἐπʼ Ἰσραήλ
  choice: इस्राएल पर राजा
  rationale: यह यूनानी पदबंध इस्राएल पर राजकीय शासन को दर्शाता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: περὶ τοῦ σπέρματος
  choice: उसके वंश
  rationale: यहाँ σπέρμα दाऊद की संतति अथवा वंश-परंपरा को सूचित करता है। ‘वंश’ आधुनिक हिन्दी में स्पष्ट है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: वाचा और शपथ के इस प्रसंग में यह पदबंध स्थायी, निरंतर अवधि व्यक्त करता है।
- source_word: τοῦ μὴ ἐκλείπειν
  choice: कभी समाप्त न होगा
  rationale: ἐκλείπειν के समाप्त हो जाने, चुक जाने या लुप्त हो जाने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπέναντί σου
  choice: आपके सामने
  rationale: यह परमेश्वर की उपस्थिति और दृष्टि के सम्मुख राज के बने रहने का भाव सुरक्षित रखता है।
- source_word: βασίλειον αὐτοῦ
  choice: उसका राज
  rationale: βασίλειον राजकीय सत्ता, राज्य या राजवंश की ओर संकेत कर सकता है। ‘राज’ मूल अस्पष्टता को अपेक्षाकृत खुला रखता है; राजवंशीय अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दाऊद से की गई प्रतिज्ञा में वंश और राज का संबंध
  choice: उसके वंश के विषय में ... कि उसका राज आपके सामने कभी समाप्त न होगा
  alternative: कि उसका राजवंश आपके सामने कभी समाप्त न होगा
  rationale: यूनानी पाठ σπέρμα (वंश/संतति) को βασίλειον (राज/राजकीय सत्ता) के साथ जोड़ता है। मुख्य पाठ में ‘राज’ रखकर राजत्व और राजवंश दोनों की संभावित छाया बनी रहती है, जबकि वैकल्पिक राजवंशीय अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: εἰς τὸν αἰῶνα का संबंध
  choice: उससे सदा के लिए यह शपथ खाई
  alternative: उसके सदा रहनेवाले वंश के विषय में उससे यह शपथ खाई
  rationale: यूनानी वाक्य में अवधि-सूचक पदबंध का संबंध शपथ, वंश या प्रतिज्ञा की स्थायित्व-धारणा से समझा जा सकता है। हिन्दी में इसे शपथ के साथ रखा गया है, पर आगे का ‘कभी समाप्त न होगा’ स्थायी वंशीय राज की धारणा को भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। परमेश्वर के लिए आदरसूचक ‘आप’ और दाऊद के लिए प्रचलित रूप ‘दाऊद’ अपनाया गया है। मूल के दोहरे बलयुक्त σύ को दोनों खंडों में ‘आप ही ने’ से सुरक्षित रखा गया है।
