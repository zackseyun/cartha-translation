  text: O Lord[a], you are our King forever and ever; for in you, our God[b], our soul will boast.
translation:
  language: hi
  text: हे प्रभु, आप सदा-सर्वदा हमारे राजा हैं[a]; क्योंकि आप में, हे हमारे परमेश्वर, हमारा प्राण गौरव मानेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘युगानुयुग’; अधिक शाब्दिक रूप में, ‘युग तक और उससे भी आगे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘आप में गर्व करेगा’ अथवा ‘आप में मग्न होकर आनन्दित होगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: हे प्रभु
  rationale: κύριος का सम्बोधन रूप परमेश्वर को सीधे पुकारता है। ‘हे प्रभु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: Βασιλεὺς
  choice: राजा
  rationale: यह शब्द परमेश्वर के राजकीय शासन को सीधे व्यक्त करता है; ‘शासक’ जैसे व्यापक विकल्प की अपेक्षा ‘राजा’ मूल बिम्ब को सुरक्षित रखता है।
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: युगानुयुग
  rationale: वाक्यांश अनन्त और बलपूर्वक विस्तारित अवधि व्यक्त करता है। ‘युगानुयुग’ हिन्दी में संक्षिप्त, स्वाभाविक और धार्मिक काव्य के अनुरूप है।
- source_word: καυχήσεται
  choice: गर्व करेगा
  rationale: क्रिया का मूल अर्थ शेखी मारना, गर्व करना या गौरव मानना है। ‘गर्व करेगा’ उस प्रबल भाव को बनाए रखता है, जबकि पादटिप्पणी सकारात्मक अर्थ ‘गौरव मानेगा’ स्पष्ट करती है।
- source_word: ἡ ψυχὴ ἡμῶν
  choice: हमारा प्राण
  rationale: यूनानी में संज्ञा एकवचन और सर्वनाम बहुवचन है। ‘हमारा प्राण’ सामूहिक एकवचन और मूल के ψυχή-बिम्ब दोनों को सुरक्षित रखता है।
