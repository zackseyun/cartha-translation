review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the direct address, divine kingship, collective singular ‘our soul,’ and future verbal sense. However, ‘आप ही पर’ introduces an exclusive emphasis not present in ἐν σοί and shifts ‘in you’ to ‘upon you.’ ‘युगानुयुग’ can express enduring duration but does not clearly retain the intensifying force of εἰς τὸν αἰῶνα καὶ ἔτι (‘forever and further’).
  naturalness: The register is appropriately prayerful and modern-standard Hindi. ‘हमारा प्राण ... गर्व करेगा’ is grammatically possible but sounds less idiomatic and can suggest self-directed pride; ‘आप में ... गौरव मानेगा’ naturally conveys boasting/glorying in God.
  terminology: ‘हे प्रभु,’ ‘राजा,’ and ‘हमारा प्राण’ are suitable. ‘सदा-सर्वदा’ better represents the emphatic temporal phrase, while ‘गौरव मानेगा’ preserves the positive, God-directed sense of καυχήσεται without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: ‘आप ही पर’ does not accurately represent ἐν σοί.
    rationale: The Greek means ‘in you’; ‘ही’ adds exclusivity, and ‘पर’ changes the relation from ‘in’ to ‘on/upon.’
  - severity: medium
    issue: ‘युगानुयुग’ weakens the explicit intensification of εἰς τὸν αἰῶνα καὶ ἔτι.
    rationale: The phrase includes ‘and further/still,’ for which ‘सदा-सर्वदा’ is a clearer natural Hindi equivalent.
  - severity: low
    issue: ‘गर्व करेगा’ is potentially misleading in this context.
    rationale: For boasting/glorying in God, ‘गौरव मानेगा’ is more natural Hindi and retains the intended relational sense.
