lexical_decisions:
- source_word: ἐπικαλεσόμεθαί
  choice: पुकारेंगे
  rationale: प्रार्थना के संदर्भ में ἐπικαλέω का अर्थ किसी को सहायता के लिए पुकारना या उसका आह्वान करना है। “तुझे पुकारेंगे” आधुनिक हिन्दी में स्वाभाविक है और प्रार्थना का भाव बनाए रखता है।
- source_word: σε
  choice: तुझे
  rationale: यूनानी पाठ के प्रत्यक्ष द्वितीय-पुरुष एकवचन कर्म को स्पष्ट रूप से रखा गया है।
- source_word: ἐπακούσει
  choice: हमारी सुनेगा
  rationale: ἐπακούω में सुनने के साथ ध्यान देने या अनुकूलता से सुनने का भाव हो सकता है। “हमारी सुनेगा” हिन्दी में स्वाभाविक है और उत्तर देने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἡμῶν
  choice: हमारी
  rationale: ἐπακούω के साथ आए यूनानी संबंधकारक को हिन्दी के स्वाभाविक मुहावरे “हमारी सुनना” से व्यक्त किया गया है; “हमारी प्रार्थना” जैसे शब्द पाठ में जोड़े नहीं गए।
