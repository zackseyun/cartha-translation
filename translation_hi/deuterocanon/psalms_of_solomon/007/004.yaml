translation:
  language: hi
  text: क्योंकि यदि तू मृत्यु को भेजे, तो तू उसे हमारे बारे में आदेश देगा; क्योंकि तू दयालु है और इतना क्रोधित न होगा कि हमें पूरी तरह नष्ट कर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστείλῃς
  choice: भेजे
  rationale: सशर्त वाक्य में यह क्रिया सीधे ‘भेजना’ व्यक्त करती है; इससे यूनानी की सरलता और कर्तृत्व दोनों बने रहते हैं।
- source_word: θάνατον
  choice: मृत्यु
  rationale: मूल शब्द का सामान्य और सीधा अर्थ ‘मृत्यु’ है। संदर्भ में महामारी का संकेत संभव है, पर वह अर्थ इतना निश्चित नहीं कि मुख्य पाठ में सीमित कर दिया जाए।
- source_word: ἐντελῇ αὐτῷ
  choice: तू उसे ... आज्ञा देगा
  rationale: ἐντελῇ अधिकारपूर्वक आदेश देने को व्यक्त करता है। ‘उसे’ मृत्यु की हल्की मानवीकरणात्मक प्रस्तुति बनाए रखता है, यद्यपि यूनानी पुल्लिंग सर्वनाम व्याकरणिक लिंग के कारण भी है।
- source_word: περὶ ἡμῶν
  choice: हमारे विषय में
  rationale: यह वाक्यांश परमेश्वर द्वारा मृत्यु को समुदाय के संबंध में निर्देश देने का व्यापक अर्थ सुरक्षित रखता है।
- source_word: ἐλεήμων
  choice: दयालु
  rationale: यह प्रचलित, स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है, जो दया दिखानेवाले स्वभाव को व्यक्त करता है।
- source_word: οὐκ ὀργισθήσῃ
  choice: क्रोधित न होगा
  rationale: भविष्यकाल और निषेध को सीधे रखा गया है; ‘इतना क्रोधित’ जोड़कर भाव की तीव्रता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: τοῦ συντελέσαι ἡμᾶς
  choice: हमें पूरी तरह मिटा देने तक
  rationale: συντελέσαι यहाँ अंत कर देने या पूर्ण विनाश तक पहुँचाने का भाव रखता है। ‘तक’ क्रोध और उसके संभावित चरम परिणाम का स्वाभाविक हिन्दी संबंध बनाता है।
theological_decisions:
- issue: θάνατος का अर्थ मृत्यु या महामारी
  choice: मुख्य पाठ में ‘मृत्यु’
  alternative: ‘महामारी’
  rationale: दाऊद की महामारीवाली कथा की प्रतिध्वनि संभव है, किंतु यूनानी शब्द अपने आप में व्यापक ‘मृत्यु’ है। इसलिए संभावित ऐतिहासिक संकेत के आधार पर मुख्य पाठ को संकीर्ण नहीं किया गया।
- issue: मृत्यु का मानवीकरण
  choice: ‘उसे’ द्वारा मानवीकरण को हल्के रूप में बनाए रखा
  alternative: ‘उसके विषय में’ या महामारी के लिए निर्जीव रूप
  rationale: αὐτῷ पहले आए θάνατον की ओर लौटता है। हिन्दी में ‘मृत्यु’ स्त्रीलिंग है, फिर भी ‘उसे’ लिंग-निरपेक्ष रूप से स्वाभाविक है और अलग से पुरुष रूप आरोपित नहीं करता।
- issue: परमेश्वर का क्रोध और पूर्ण विनाश
  choice: क्रोध पूर्ण विनाश तक नहीं पहुँचेगा
  alternative: ‘तू इतना क्रोधित न होगा कि हमें नष्ट कर दे’
  rationale: 'अनुवाद मूल की theological tension बनाए रखता है: मृत्यु भेजी जा सकती है, फिर भी दया के कारण समुदाय का पूर्ण अंत नहीं होगा।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक एकवचन ‘तू’ रखा गया है। वाक्य अपेक्षाकृत औपचारिक है, पर साधारण पाठक के लिए स्पष्ट है। ‘हमारे विषय में’ मूल के व्यापक संबंधसूचक भाव को ‘हमारे साथ क्या करना है’ जैसे अधिक व्याख्यात्मक रूप से बेहतर सुरक्षित रखता है।
