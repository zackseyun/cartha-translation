  text: and no nation will prevail against us, because you are our defender.
translation:
  language: hi
  text: 'और कोई राष्ट्र हम पर प्रबल न होगा,

    क्योंकि तू हमारा रक्षक है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἰσχύσει
  choice: प्रबल न होगा
  rationale: ἰσχύω सामर्थ्य रखने या प्रभावी होने का अर्थ देता है; πρός ἡμᾶς के साथ ‘हम पर प्रबल न होगा’ विरोधात्मक भाव को स्वाभाविक और सटीक ढंग से व्यक्त करता है।
- source_word: πρὸς ἡμᾶς
  choice: हम पर
  rationale: सामर्थ्य अथवा संघर्ष सूचक क्रिया के साथ πρός और कर्मकारक यहाँ विरोध का संबंध बताते हैं; हिन्दी में ‘हम पर प्रबल’ सहज प्रयोग है।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: एकवचन संज्ञा किसी सामूहिक राजनीतिक या जातीय समुदाय को सूचित करती है। ‘राष्ट्र’ सीधा अनुवाद है; ‘अन्यजाति’ कहना इस पद में अनावश्यक धार्मिक अर्थ जोड़ देगा।
- source_word: ὑπερασπιστής
  choice: रक्षक
  rationale: यह संज्ञा किसी के पक्ष में खड़े होकर उसकी रक्षा करने वाले को दर्शाती है। ‘रक्षक’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय संरक्षण की अभिव्यक्ति
  choice: क्योंकि तू हमारा रक्षक है
  alternative: क्योंकि तू हमारी रक्षा करता है
  rationale: यूनानी पाठ परमेश्वर के लिए क्रियात्मक वाक्य के बजाय संज्ञात्मक उपाधि ὑπερασπιστής का प्रयोग करता है। ‘हमारा रक्षक’ उसकी संक्षिप्तता और अंगीकारात्मक बल को बनाए रखता है।
- issue: ἔθνος का धार्मिक अर्थ
  choice: कोई राष्ट्र
  alternative: कोई अन्यजाति
  rationale: इस पद में ἔθνος को धार्मिक श्रेणी ‘अन्यजाति’ मानना आवश्यक नहीं है। ‘राष्ट्र’ मूल की व्यापकता बनाए रखता है और संप्रदायगत अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और प्रार्थनापरक गरिमा रखी गई है। परमेश्वर के सीधे संबोधन में ‘तू’ भजन-साहित्य की आत्मीयता और एकवचन को सुरक्षित रखता है। पंक्ति-विभाजन समानांतर काव्य संरचना को स्पष्ट करता है।
