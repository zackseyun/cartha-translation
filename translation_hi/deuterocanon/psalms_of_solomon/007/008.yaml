  yaml_path: translation/deuterocanon/psalms_of_solomon/007/008.yaml
  text: For you will have compassion on the people of Israel forever, and you will not cast them off; and we will be under your yoke forever, and under the whip of your discipline.
translation:
  language: hi
  text: क्योंकि तू इस्राएल के लोगों पर सदा करुणा करेगा और उन्हें त्याग न देगा; और हम सदा तेरे जुए के अधीन और तेरे अनुशासन के कोड़े के अधीन रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτειρήσεις
  choice: करुणा करेगा
  rationale: भविष्यकालीन क्रिया में दया और सहानुभूति का भाव है; ‘करुणा करेगा’ इसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὸ γένος Ἰσραήλ
  choice: इस्राएल के वंश
  rationale: γένος यहाँ इस्राएल के सामूहिक वंश या जातीय समुदाय को सूचित करता है; ‘वंश’ मूल रूपक को बनाए रखता है।
- source_word: οὐκ ἀπώσεις
  choice: त्याग न देगा
  rationale: ἀπωθέω का अर्थ दूर धकेलना या अस्वीकार करना है; इस प्रसंग में ‘त्याग न देगा’ सहज हिन्दी है और वाचा-संबंधी आशय को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: ὑπὸ ζυγόν σου
  choice: तेरे जुए के नीचे
  rationale: मूल के अधीनता-सूचक जुए के रूपक को प्रत्यक्ष रूप से सुरक्षित रखा गया है।
- source_word: μάστιγα παιδίας σου
  choice: तेरे अनुशासन के कोड़े के नीचे
  rationale: μάστιξ का ठोस अर्थ ‘कोड़ा’ है और παιδεία सुधारात्मक प्रशिक्षण या अनुशासन को दर्शाता है; दोनों की कठोरता और सुधारात्मक भाव बनाए गए हैं।
theological_decisions:
- issue: ईश्वरीय करुणा और अनुशासन का साथ-साथ वर्णन
  choice: करुणा, जुआ और अनुशासन का कोड़ा—तीनों बिंब स्पष्ट रूप से बनाए रखे गए
  alternative: ‘कोड़े’ को नरम करके केवल ‘ताड़ना’ या ‘छड़ी’ कहना
  rationale: पद में स्थायी करुणा के साथ ईश्वर के अधीन रहने और उसके कठोर सुधारात्मक अनुशासन का तनाव जानबूझकर उपस्थित है; अनुवाद इसे कम नहीं करता।
- issue: εἰς τὸν αἰῶνα की दोनों आवृत्तियाँ
  choice: दोनों स्थानों पर ‘सदा’
  alternative: ‘युग-युग तक’ या दूसरी आवृत्ति को छोड़ देना
  rationale: मूल में करुणा और जुए के अधीनता—दोनों के लिए समान कालगत अभिव्यक्ति है; दोनों को समान रूप से प्रस्तुत करना संरचनात्मक और धर्मवैचारिक संतुलन बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और काव्यात्मक गद्य। परमेश्वर को संबोधन में एकवचन आत्मीय ‘तू/तेरे’ रखा गया है। वाक्य की समानांतर संरचना और मूल के कठोर ‘जुआ/कोड़ा’ रूपक सुरक्षित हैं।
