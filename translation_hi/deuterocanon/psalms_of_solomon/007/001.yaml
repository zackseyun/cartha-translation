  yaml_path: translation/deuterocanon/psalms_of_solomon/007/001.yaml
  text: Do not depart from us[a], O God[c][b], lest those who hate us without cause attack us.
translation:
  language: hi
  text: हे परमेश्वर, हमारे बीच से अपना डेरा न उठा[a], कहीं ऐसा न हो कि जो हमसे अकारण[b] बैर रखते हैं, वे हम पर टूट पड़ें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का शाब्दिक बिंब अपना तंबू या डेरा उठाकर कहीं और चले जाने का है; यहाँ आशय परमेश्वर की उपस्थिति हट जाने से है।
    reason: cultural_note
  - marker: b
    text: या, “जो हमसे बैर रखते हैं, वे हम पर अकारण टूट पड़ें।” यूनानी क्रियाविशेषण को बैर के बजाय हमले के साथ भी जोड़ा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσκηνώσῃς
  choice: अपना डेरा न उठा
  rationale: क्रिया का मूल बिंब डेरा समेटकर चले जाने का है। यह हिंदी में स्वाभाविक रहते हुए परमेश्वर की उपस्थिति हट जाने की प्रार्थनात्मक भावना और तंबू/निवास के बिंब—दोनों को बनाए रखता है।
- source_word: ἀφʼ ἡμῶν
  choice: हमारे बीच से
  rationale: पूर्वसर्ग अलगाव व्यक्त करता है। डेरा उठाने के बिंब के साथ ‘हमारे बीच से’ सामुदायिक उपस्थिति और उससे हटने का अर्थ सहज रूप से देता है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: संबोधन को आधुनिक, गरिमापूर्ण और प्रचलित हिंदी प्रार्थना-शैली में व्यक्त करता है।
- source_word: ἵνα μὴ
  choice: कहीं ऐसा न हो कि
  rationale: यहाँ पदबंध आशंकित नकारात्मक परिणाम बताता है; यह हिंदी में स्पष्ट और स्वाभाविक प्रार्थनात्मक अभिव्यक्ति है।
- source_word: ἐπιθῶνται ἡμῖν
  choice: वे हम पर टूट पड़ें
  rationale: क्रिया का अर्थ किसी पर चढ़ आना या आक्रमण करना है। ‘टूट पड़ें’ शत्रुतापूर्ण आकस्मिक हमले का बल स्वाभाविक हिंदी में बनाए रखता है।
- source_word: οἱ μισοῦντα ἡμᾶς
  choice: जो हमसे … बैर रखते हैं
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को हिंदी में संबंधवाचक उपवाक्य से सहज बनाया गया है; ‘बैर रखते हैं’ लगातार शत्रुता को व्यक्त करता है।
- source_word: δωρεάν
  choice: अकारण
  rationale: मुख्य पाठ में इसे शत्रुओं के बैर से जोड़ा गया है, जिससे उनकी शत्रुता के निराधार होने का भाव आता है; यूनानी में इसे हमले से जोड़कर पढ़ने की संभावना भी पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ἀποσκηνώσῃς में निवास/डेरे का बिंब
  choice: ‘अपना डेरा न उठा’ कहकर बिंब को स्पष्ट रखा गया
  alternative: ‘हमसे दूर न जा’ या ‘हमें छोड़कर न जा’
  rationale: सामान्य ‘दूर न जा’ अर्थ तो देता है, पर यूनानी क्रिया में निहित डेरा उठाने और उपस्थिति हटा लेने के ठोस बिंब को खो देता है। मुख्य पाठ में बिंब रखना किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित किए बिना स्रोत की अर्थ-समृद्धि सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की गरिमापूर्ण प्रार्थना-शैली में है। ‘अपना डेरा न उठा’ स्रोत का सजीव बिंब बनाए रखता है, जबकि ‘कहीं ऐसा न हो कि’ और ‘हम पर टूट पड़ें’ सामान्य पाठक के लिए सहज हैं।
