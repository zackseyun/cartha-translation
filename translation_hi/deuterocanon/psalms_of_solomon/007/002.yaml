base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/002.yaml
  text: For you have rejected them[a], O God[c][b]; let not their foot trample the inheritance of your sanctuary.
translation:
  language: hi
  text: क्योंकि तूने उन्हें दूर कर दिया है[a], हे परमेश्वर; उनके पाँव तेरे पवित्रस्थान की विरासत[b] को न रौंदें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रियारूप को कुछ लोग “तू उन्हें पीछे हटा देगा” भी समझ सकते हैं; मुख्य पाठ इसे हेलेनिस्टिक यूनानी का बिना आगम वाला एओरिस्ट मानकर “तूने उन्हें दूर कर दिया है” अनुवाद करता है।
    reason: alternative_reading
  - marker: b
    text: या, “तेरी पवित्र विरासत।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσω
  choice: तूने उन्हें दूर कर दिया है
  rationale: यह रूप हेलेनिस्टिक यूनानी में बिना आगम वाला द्वितीय पुरुष एकवचन एओरिस्ट माना जा सकता है और बीते हुए कार्य को व्यक्त करता है। ‘दूर कर दिया’ में ठुकराने और पीछे हटाने—दोनों की प्रसंगानुकूल छाया बनी रहती है।
- source_word: πατήσαι
  choice: न रौंदें
  rationale: क्रिया शत्रुतापूर्ण ढंग से पाँव तले कुचलने या अपवित्र करने का भाव रखती है; ‘रौंदें’ केवल कदम रखने से अधिक प्रबल है।
- source_word: ὁ ποὺς αὐτῶν
  choice: उनके पाँव
  rationale: यूनानी में ‘पाँव’ एकवचन होकर सामूहिक अर्थ देता है। हिन्दी ‘उनके पाँव’ स्वाभाविक है और सामूहिक भाव सुरक्षित रखता है।
- source_word: κληρονομίαν
  choice: विरासत
  rationale: ‘विरासत’ परमेश्वर से संबंधित वाचा और पवित्र अधिकार के भाव को ‘संपत्ति’ की अपेक्षा अधिक अच्छी तरह बनाए रखती है।
- source_word: ἁγιάσματός σου
  choice: तेरे पवित्रस्थान की
  rationale: प्रसंग में यह शब्द उपासना के पवित्र स्थल को सूचित करता है; इसलिए ‘पवित्रस्थान’ स्वाभाविक और सटीक है, यद्यपि पूरे पदबंध का विशेषणात्मक अर्थ भी सम्भव है।
theological_decisions:
- issue: κληρονομίαν ἁγιάσματός σου में संबंध
  choice: तेरे पवित्रस्थान की विरासत
  alternative: तेरी पवित्र विरासत
  rationale: मुख्य पाठ यूनानी संबंधकारक को ‘पवित्रस्थान की’ के रूप में ग्रहण करता है, पर विशेषणात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है; इससे पवित्र भूमि, प्रजा या स्थान में से किसी एक की अनावश्यक संप्रदायगत पहचान नहीं की जाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर को संबोधन में परंपरागत एकवचन ‘तू/तेरे’ रखा गया है। ‘पवित्रस्थान’ को संयुक्त रूप में लिखा गया है और ‘उनके पाँव’ हिन्दी में स्वाभाविक सामूहिक प्रयोग है।
