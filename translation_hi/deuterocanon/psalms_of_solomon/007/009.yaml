  yaml_path: translation/deuterocanon/psalms_of_solomon/007/009.yaml
  text: You will guide us at the time of your help[b][a], to show mercy to the house of Jacob for the day that you promised them.
translation:
  language: hi
  text: आप अपनी सहायता के समय हमारा मार्गदर्शन करेंगे[a], ताकि याकूब के घराने पर दया करें—उस दिन के लिए जिसकी प्रतिज्ञा आपने उनसे की थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारी राह सीधी करेंगे।’ यूनानी क्रिया किसी का मार्ग सीधा करने या उसकी दिशा निर्धारित करने का भाव भी रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम यूनानी क्रियारूप पाठ की दृष्टि से कठिन है। संदर्भ के आधार पर यहाँ इसका अर्थ ‘आपने उनसे प्रतिज्ञा की थी’ लिया गया है। अधिक शाब्दिक, पर संदर्भ में कम उपयुक्त संभावना है: ‘मैंने उनसे प्रतिज्ञा की थी।’'
    reason: textual_variant
lexical_decisions:
- source_word: κατευθυνεῖς
  choice: मार्गदर्शन करेंगे
  rationale: क्रिया भविष्यकाल में परमेश्वर द्वारा सही दिशा में ले चलने या मार्ग सीधा करने का भाव रखती है। ‘मार्गदर्शन करेंगे’ आधुनिक हिन्दी में स्वाभाविक है और इस व्यापक अर्थ को बनाए रखता है।
- source_word: ἐν καιρῷ ἀντιλήψεως σου
  choice: अपनी सहायता के समय
  rationale: ἐν καιρῷ किसी विशेष समय या अवसर को सूचित करता है और ἀντίληψις का सामान्य अर्थ सहायता या सहारा है। ‘सहायता’ अर्थ को अनावश्यक रूप से ‘छुटकारे’ तक सीमित नहीं करती।
- source_word: τοῦ ἐλεῆσαι
  choice: ताकि ... दया करें
  rationale: संबंधवाचक infinitive यहाँ उद्देश्य व्यक्त करता है। हिन्दी में ‘ताकि’ इस उद्देश्य-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν οἶκον Ἰακώβ
  choice: याकूब के घराने
  rationale: ‘घराना’ सामूहिक और वाचा-संबंधी अभिव्यक्ति को सुरक्षित रखता है; इसे व्याख्यात्मक रूप से ‘इस्राएल’ नहीं बनाया गया।
- source_word: εἰς ἡμέραν ἐν ᾗ
  choice: उस दिन के लिए जिसका
  rationale: εἰς आगामी या निर्धारित दिन की ओर संकेत करता है। ‘उस दिन के लिए’ इस अग्रदर्शी भाव को रखता है, जबकि संबंधवाचक पद अगले कथन से दिन को जोड़ता है।
- source_word: ἐπηγγείλω αὐτοῖς
  choice: आपने उनसे वादा किया था
  rationale: प्रेषित यूनानी रूप कठिन है, पर प्रार्थना में परमेश्वर को सीधे संबोधन के संदर्भ में द्वितीय पुरुष का अर्थ सबसे सुसंगत है। कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: क्या ‘याकूब के घराने’ को ‘इस्राएल’ के रूप में विस्तार दिया जाए
  choice: मुख्य पाठ में ‘याकूब के घराने’ रखा गया।
  alternative: इस्राएल; इस्राएल के लोग
  rationale: यूनानी पाठ विशेष रूप से ‘याकूब के घराने’ कहता है। यही रूप वाचा-संबंधी और साहित्यिक बनावट को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: कठिन अंतिम क्रियारूप का पुरुष
  choice: 'परमेश्वर को संबोधित द्वितीय पुरुष: ‘आपने ... वादा किया था।’'
  alternative: 'प्रथम पुरुष: ‘मैंने उनसे वादा किया था।’'
  rationale: क्रियारूप पाठ की दृष्टि से कठिन है। तत्काल संदर्भ परमेश्वर से सीधे संबोधन का है, इसलिए द्वितीय पुरुष अधिक सुसंगत है; फिर भी वैकल्पिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरपूर्ण, प्रार्थनामय और गरिमापूर्ण रूप अपनाया गया है। परमेश्वर के लिए ‘आप’ और तदनुरूप बहुवचन क्रियारूप प्रयुक्त हुए हैं। वाक्य को सहज रखने के लिए उद्देश्य को ‘ताकि’ से और आगामी प्रतिज्ञात दिन को डैश के बाद स्पष्ट किया गया है।
