- source_word: τὸ ὄνομά σου
  choice: तेरा नाम
  rationale: ‘नाम’ को ज्यों का त्यों रखा गया है, क्योंकि बाइबलीय प्रयोग में यह परमेश्वर की प्रकट उपस्थिति या प्रतिष्ठा की ओर संकेत कर सकता है; इसे केवल ‘तेरी उपस्थिति’ कहना रूपक को अनावश्यक रूप से निश्चित कर देता।
- source_word: ἐν μέσῳ ἡμῶν
  choice: हमारे बीच
  rationale: यह सामुदायिक निकटता व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ἐλεηθησόμεθα
  choice: हम पर दया की जाएगी
  rationale: भविष्यत् कर्मवाच्य को स्पष्ट रूप से सुरक्षित रखा गया है। यह दया पाने का अर्थ देता है और केवल भावनात्मक तरस खाए जाने तक सीमित नहीं होता।
