  choice: जब ... निवास करता है
  rationale: ἐν के साथ संयुक्त articular infinitive को कालवाचक अर्थ में लिया गया है—‘जब’ या ‘जिस समय’। यह हिन्दी में स्वाभाविक है और यूनानी रचना का आशय बनाए रखता है।
- source_word: κατασκηνοῦν
  choice: निवास करता है
