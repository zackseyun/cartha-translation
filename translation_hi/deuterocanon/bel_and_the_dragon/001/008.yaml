lexical_decisions:
- source_word: βέβρωκεν οὐδέποτε
  choice: उसने कभी खाया ही नहीं है
  rationale: पूर्णकाल βέβρωκεν वर्तमान से जुड़ी पूर्ण क्रिया व्यक्त करता है; οὐδέποτε के साथ ‘कभी…नहीं’ स्वाभाविक है, और ‘ही’ इस दृढ़ निषेध को सहज हिन्दी में व्यक्त करता है।
- source_word: θυμωθεὶς ὁ βασιλεὺς
  choice: तब राजा क्रोधित हो गया
  rationale: अओरिस्ट कृदन्त राजा के क्रोधित होने को आगे की कार्रवाई की परिस्थिति बनाता है; ‘क्रोधित हो गया’ आरम्भिक भाव को बिना अतिशयोक्ति के रखता है।
- source_word: ἐκάλεσεν τοὺς ἱερεῖς αὐτοῦ
  choice: उसने उसके याजकों को बुलाया
  rationale: ἱερεῖς के लिए प्रतिष्ठित और सुबोध ‘याजक’ चुना गया है। αὐτοῦ का निकटतम और प्रसंगानुकूल संदर्भ बेल है, इसलिए ‘उसके’ रखा गया है; ‘अपने’ कहने से याजक राजा के निजी याजक प्रतीत हो सकते हैं।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: यूनानी वचन-सूत्र का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: Ἐὰν μὴ εἴπητέ μοι
  choice: यदि तुम मुझे नहीं बताओगे
  rationale: ἐὰν μή और संभावनार्थक क्रिया की सीधी शर्त को स्पष्ट हिन्दी में रखा गया है।
- source_word: τίς ὁ κατεσθίων
  choice: कौन … खा रहा है
  rationale: वर्तमान कृदन्त की जारी क्रिया के लिए ‘खा रहा है’ उपयुक्त है; κατεσθίω में ‘खा जाना/निगलना’ का बल हो सकता है, पर अधूरे कर्म के कारण सामान्य ‘खा रहा है’ अधिक स्वाभाविक है।
- source_word: τὴν
  choice: उस… को
  rationale: स्रोत इस स्त्रीलिंग निश्चित उपपद पर टूट जाता है। हिन्दी में केवल ‘उस’ छोड़ना अत्यन्त अस्वाभाविक होता, इसलिए ‘को’ जोड़कर दीर्घविराम से अधूरापन स्पष्ट किया गया है; संज्ञा की पूर्ति नहीं की गई।
theological_decisions:
- issue: τοὺς ἱερεῖς αὐτοῦ में αὐτοῦ का संदर्भ
  choice: उसके याजक (अर्थात् बेल से जुड़े याजक)
  alternative: अपने याजक (राजा के याजक)
  rationale: व्याकरणतः सर्वनाम का संदर्भ कुछ हद तक अस्पष्ट हो सकता है, किंतु निकट प्रसंग में देवता बेल के याजक अभिप्रेत हैं। ‘उसके’ इस संबंध को रखता है और राजा के निजी याजकों का अनावश्यक अर्थ नहीं जोड़ता।
