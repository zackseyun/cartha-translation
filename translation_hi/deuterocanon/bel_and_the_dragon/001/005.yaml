  verdict: revise
  source_fidelity: The draft correctly preserves the supplied Greek extract's abrupt ending at καί ('और') and does not supply an object from the wider context. It accurately identifies Bel, handmade idols, the living God, and creation of heaven. However, 'आदर करता हूँ' can denote ordinary respect and is too weak for σέβομαι in this cultic contrast.
  naturalness: ‘बेल के आगे दण्डवत क्यों नहीं करते?’ is understandable, but ‘बेल को दण्डवत क्यों नहीं करते?’ is more direct and idiomatic for the Greek dative object. Recasting σέβομαι as ‘आराधना करता हूँ’ produces natural Hindi and retains the explicitly religious sense.
  terminology: ‘मूर्तियाँ,’ ‘जीवित परमेश्वर,’ and ‘आकाश’ are appropriate. ‘आराधना’ is preferable to secular-sounding ‘आदर’ for σέβομαι; it is not an unwarranted doctrinal addition in this idolatry context. ‘हाथों से बनी हुई’ faithfully conveys χειροποίητα.
  issues:
