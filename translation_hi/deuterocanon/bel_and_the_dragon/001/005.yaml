  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/005.yaml
  text: Why do you not bow down to Bel? But he said[a], “Because I do not revere idols made by hands, but the living God, who created heaven and”
translation:
  language: hi
  text: “तुम बेल को दण्डवत क्यों नहीं करते?” उसने कहा,[a] “क्योंकि मैं हाथों से बनी हुई मूर्तियों की आराधना नहीं करता, बल्कि उस जीवित परमेश्वर की आराधना करता हूँ, जिसने आकाश और”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए उपलब्ध कराया गया यूनानी पाठ ‘और’ (καί) पर वाक्य के बीच में ही समाप्त हो जाता है। इसलिए अनुवाद ने संदर्भ से कोई छूटा हुआ शब्द जोड़ने के बजाय अधूरे वाक्य को बनाए रखा है।
    reason: textual_variant
lexical_decisions:
- source_word: προσκυνεῖς
  choice: दण्डवत करते
  rationale: यह क्रिया शारीरिक रूप से झुककर धार्मिक सम्मान प्रकट करने को दर्शाती है। ‘दण्डवत करना’ इस क्रिया को बनाए रखता है और केवल भीतरी आराधना तक अर्थ को सीमित नहीं करता।
- source_word: σέβομαι
  choice: आदर करता हूँ
  rationale: यह धार्मिक श्रद्धा या उपासना का भाव रखता है। ‘आदर करना’ प्रसंग में मूर्तियों को अस्वीकार किए गए धार्मिक सम्मान को व्यक्त करता है और προσκυνέω से शब्दगत भेद भी बनाए रखता है।
- source_word: εἴδωλα
  choice: मूर्तियों
  rationale: प्रसंग में ये देवता मानी जाने वाली पूजा-मूर्तियाँ हैं; ‘मूर्तियाँ’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: χειροποίητα
  choice: हाथों से बनाई गई
  rationale: यह मनुष्य द्वारा निर्मित वस्तुओं और सृष्टिकर्ता परमेश्वर के बीच मूल विरोध को स्पष्ट रूप से बनाए रखता है।
- source_word: τὸν ζῶντα θεόν
  choice: जीवित परमेश्वर
  rationale: निश्चित पदबंध मूर्तियों के विपरीत उस परिचित सच्चे परमेश्वर की ओर संकेत करता है जो जीवित है।
- source_word: κτίσαντα
  choice: जिसने ... बनाया
  rationale: कृदन्त परमेश्वर को उसके सृष्टि-कार्य से पहचानता है; हिन्दी में ‘जिसने ... बनाया’ स्वाभाविक है और सृष्टिकर्ता का भाव बनाए रखता है।
- source_word: τὸν οὐρανὸν
  choice: आकाश
  rationale: एकवचन οὐρανός के लिए ‘आकाश’ इस सृष्टि-वर्णन में स्वाभाविक आधुनिक हिन्दी है।
theological_decisions:
- issue: उपलब्ध यूनानी पाठ में वाक्य का अधूरा रहना
  choice: पद को ‘और’ पर अधूरा समाप्त करना
  alternative: संदर्भ के आधार पर ‘पृथ्वी’ या अन्य कर्म जोड़कर वाक्य पूरा करना
  rationale: दिया गया मूल यूनानी पाठ καί (‘और’) पर समाप्त होता है। अनुपस्थित शब्द जोड़ना स्रोत से आगे जाना होता; इसलिए अधूरापन ज्यों का त्यों रखा गया है और पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दण्डवत’ धार्मिक-सांस्कृतिक संदर्भ में सहज है; ‘आदर करता हूँ’ σέβομαι को पहले क्रियापद से अलग रखते हुए धार्मिक श्रद्धा व्यक्त करता है।
