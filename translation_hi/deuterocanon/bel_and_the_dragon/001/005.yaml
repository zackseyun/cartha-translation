    issue: ‘आदर करता हूँ’ weakens σέβομαι.
    rationale: In this context σέβομαι refers to religious reverence/worship denied to idols and rendered to the living God. Ordinary ‘आदर’ may be read as merely social respect.
  - severity: low
    issue: The object construction with ‘दण्डवत’ can be smoother.
    rationale: ‘बेल को दण्डवत’ is more natural modern Hindi than ‘बेल के आगे दण्डवत’ while maintaining the physical act of προσκυνεῖς.
