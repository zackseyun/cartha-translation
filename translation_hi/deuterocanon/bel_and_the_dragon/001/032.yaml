  text: There were seven lions in the pit[a], and each day they were given two bodies and two sheep; but then nothing was given to them, so that they might devour Daniel.
translation:
  language: hi
  text: उस गड्ढे में सात सिंह थे। उन्हें हर दिन दो शरीर[a] और दो भेड़ें दी जाती थीं; पर उस समय उन्हें कुछ नहीं दिया गया, ताकि वे दानिय्येल को खा जाएँ।
  philosophy: optimal-equivalence
