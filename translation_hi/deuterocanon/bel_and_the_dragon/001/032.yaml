    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκῳ
  choice: गड्ढे
  rationale: यूनानी शब्द का मूल अर्थ गड्ढा या कुंड-जैसा स्थान है। संदर्भ में यह सिंहों को रखने का स्थान है, फिर भी ‘गड्ढा’ स्रोत के अधिक निकट है।
- source_word: ἑπτὰ λέοντες
  choice: सात सिंह
  rationale: संख्या और संज्ञा का सीधा तथा स्वाभाविक अनुवाद।
- source_word: ἐδίδοτο ... τὴν ἡμέραν
  choice: हर दिन ... दी जाती थीं
  rationale: अपूर्ण भूतकाल और कालवाचक पद मिलकर नियमित दैनिक व्यवस्था व्यक्त करते हैं। हिंदी में बहुवचन खाद्य-वस्तुओं के अनुरूप ‘दी जाती थीं’ स्वाभाविक है।
- source_word: δύο σώματα
  choice: दो शरीर
  rationale: σώματα का सीधा अर्थ ‘शरीर’ है। भोजन के संदर्भ में शव अभिप्रेत हो सकते हैं, पर मूल पाठ की व्यापक और कुछ हद तक अस्पष्ट अभिव्यक्ति मुख्य पाठ में सुरक्षित रखी गई है।
- source_word: δύο πρόβατα
  choice: दो भेड़ें
  rationale: πρόβατα का इस संदर्भ में सामान्य और स्पष्ट अर्थ ‘भेड़ें’ है।
- source_word: τότε δὲ οὐκ ἐδόθη αὐτοῖς
  choice: पर उस समय उन्हें कुछ नहीं दिया गया
  rationale: τότε को ‘उस समय’ से व्यक्त किया गया है और नकारात्मक कर्मवाच्य को स्वाभाविक हिंदी में ‘कुछ नहीं दिया गया’ बनाया गया है।
- source_word: ἵνα καταφάγωσιν
  choice: ताकि वे ... खा जाएँ
  rationale: καταφάγωσιν पूर्णतः खा डालने या निगल जाने का प्रबल भाव रखता है। ‘खा जाएँ’ आधुनिक हिंदी में वही परिणामपरक बल स्वाभाविक रूप से देता है।
- source_word: τὸν Δανιήλ
  choice: दानिय्येल
  rationale: बाइबलीय नाम का प्रचलित हिंदी रूप।
