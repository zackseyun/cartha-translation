  text: He set Habakkuk down at once in his own place[a]. Then the king came on the seventh day to mourn for Daniel, and he came to the pit and looked in, and behold[b], Daniel was sitting there.
translation:
  language: hi
  text: उसने हबक्कूक को तुरन्त उसके अपने स्थान पर पहुँचा दिया। फिर सातवें दिन राजा दानिय्येल के लिए शोक मनाने आया। वह गड्ढे के पास आया और उसने भीतर झाँका; और देखो, दानिय्येल वहाँ बैठा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: पहुँचा दिया
  rationale: संदर्भ में स्वर्गदूत हबक्कूक को उसके स्थान पर वापस ले जाकर रखता है। ‘पहुँचा दिया’ आधुनिक हिन्दी में इस कारक और स्थानांतरण के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह क्रिया-विशेषण कार्य की तात्कालिकता बताता है; ‘तुरन्त’ सहज और सटीक हिन्दी है।
- source_word: εἰς τὸν τόπον αὐτοῦ
  choice: उसके अपने स्थान पर
  rationale: यह हबक्कूक के उचित अथवा मूल स्थान की ओर लौटाए जाने का संकेत देता है। ‘अपने’ स्वामित्व और वापसी के भाव को स्पष्ट रखता है।
- source_word: πενθῆσαι
  choice: शोक मनाने
  rationale: यह उद्देश्यसूचक अनंत क्रिया राजा के दानिय्येल को मृत मानकर विलाप करने आने को व्यक्त करती है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: λάκκον
  choice: गड्ढे
  rationale: ग्रीक शब्द सामान्यतः गड्ढे या गर्त को दर्शाता है, केवल सिंहों की विशिष्ट माँद को नहीं; इसलिए व्यापक अर्थ सुरक्षित रखा गया है।
- source_word: ἐνέβλεψεν
  choice: भीतर झाँका
  rationale: गड्ढे के पास जाकर उसमें देखने की क्रिया के लिए यह स्वाभाविक और दृश्यात्मक हिन्दी है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह आकस्मिक खोज और कथात्मक सजीवता को बनाए रखता है; इसे हटाने से मूल का बल मंद पड़ जाता।
- source_word: καθήμενος
  choice: वहाँ बैठा था
  rationale: यह दानिय्येल की दिखाई देने वाली मुद्रा बताता है; ‘वहाँ’ हिन्दी में दृश्य का स्थानिक संबंध स्वाभाविक बनाता है।
theological_decisions:
- issue: दानिय्येल के संबंध में राजा के शोक का अर्थ
  choice: दानिय्येल के लिए शोक मनाने
  alternative: दानिय्येल पर विलाप करने
  rationale: पाठ राजा को दानिय्येल की मृत्यु की आशंका में शोक करने आते दिखाता है। चुना गया रूप भाव को सुरक्षित रखता है, पर राजा के विश्वास या ज्ञान के बारे में पाठ से अधिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘दानिय्येल’ और ‘हबक्कूक’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि ‘गड्ढा’ मूल के व्यापक λάκκος को सीधे व्यक्त करता है और वाक्य में कोई ऐसा अनिवार्य पाठांतर नहीं है जिसे अलग से चिह्नित करना पड़े।
