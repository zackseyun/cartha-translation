  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/018.yaml
  text: And it happened, when the doors were opened, that the king looked at the table and cried out with a loud voice, “Great are you, Bel, and there is no deceit with you.”
translation:
  language: hi
  text: और जब द्वार खोले गए, तो राजा ने मेज़ की ओर देखकर ऊँची आवाज़ में पुकारा, “हे बेल, तू महान है, और तुझ में कोई छल नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: और जब ... तब
  rationale: यूनानी कथात्मक सूत्र को स्वाभाविक आधुनिक हिन्दी वाक्य-रचना में व्यक्त करता है; अलग से ‘ऐसा हुआ’ जोड़ना हिन्दी में बोझिल होता।
- source_word: ἅμα τῷ ἀνοῖξαι τὰς θύρας
  choice: जब द्वार खोले गए
  rationale: कालगत संबंध को सीधे व्यक्त करता है और मूल से अधिक तात्कालिकता नहीं जोड़ता। θύρας के लिए ‘द्वार’ प्रसंगानुकूल और गरिमापूर्ण है।
- source_word: ἐπιβλέψας ... ἐπὶ τὴν τράπεζαν
  choice: मेज़ की ओर देखकर
  rationale: दृष्टि डालने की सामान्य क्रिया को सुरक्षित रखता है; ‘जाँचकर’ कहना मूल से अधिक अर्थ जोड़ता।
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर में पुकारा
  rationale: क्रिया और स्पष्ट ध्वनि-सूचक पद दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: Μέγας εἶ, Βήλ
  choice: हे बेल, तू महान है
  rationale: सम्बोधन और विस्मयपूर्ण घोषणा को स्वाभाविक, उन्नत हिन्दी में बनाए रखता है; नाम का लिप्यंतरण ‘बेल’ किया गया है।
- source_word: οὐκ ἔστιν παρὰ σοὶ δόλος
  choice: तेरे यहाँ कोई छल नहीं है
  rationale: παρὰ σοὶ की ‘तेरे पास/यहाँ’ संबंधी छाया और δόλος के छल-कपट के भाव को निकटता से रखता है, बिना कथन को केवल आंतरिक चरित्र तक सीमित किए।
theological_decisions:
- issue: बेल के विषय में राजा की घोषणा को कथावाचक की धार्मिक स्वीकृति समझे जाने की संभावना
  choice: कथन को बिना संपादकीय टिप्पणी के राजा के सीधे वचन के रूप में रखा गया है।
  alternative: ‘राजा को लगा कि...’ जैसे शब्द जोड़कर कथन को नरम करना।
  rationale: यूनानी पाठ राजा का उद्गार सीधे प्रस्तुत करता है। इसी रूप में रखने से कथानक की विडंबना और धार्मिक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक प्रवाह सहज और वाणी गरिमापूर्ण रखी गई है। राजा द्वारा देवता को संबोधित करने में ‘तू/तेरे’ हिन्दी की पारंपरिक प्रत्यक्ष दैवी संबोधन-शैली के अनुरूप है, अनादर के अर्थ में नहीं।
