review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, the king's looking at the table, and his direct acclamation of Bel are accurately preserved. However, “तेरे यहाँ कोई छल नहीं है” normally locates deceit at Bel’s place rather than attributing an absence of deceit to Bel, and thus does not naturally convey οὐκ ἔστιν παρὰ σοὶ δόλος in Hindi.
  naturalness: The narrative is generally fluent. “ऊँची आवाज़ में पुकारा” is more idiomatic and more clearly expresses loudness than “ऊँचे स्वर में पुकारा.”
  terminology: “बेल” suitably transliterates Βήλ. “छल” is an appropriate rendering of δόλος; changing the construction to “तुझ में कोई छल नहीं है” makes its attribution to Bel clear without adding interpretation. The elevated direct address “तू/तुझ” is appropriate in this literary and religious context.
  issues:
  - severity: medium
    issue: “तेरे यहाँ कोई छल नहीं है” is spatially and idiomatically misleading.
    rationale: In modern Hindi, “तेरे यहाँ” means ‘at your place’ or ‘in your household.’ The Greek phrase attributes the absence of deceit to Bel, not to a location associated with him. “तुझ में कोई छल नहीं है” naturally expresses this attribution.
  - severity: low
    issue: “ऊँचे स्वर में” can suggest pitch rather than volume.
    rationale: φωνῇ μεγάλῃ explicitly indicates a loud voice. “ऊँची आवाज़ में” is the more usual Hindi expression for loudness in this context.
  revised_text: और जब द्वार खोले गए, तो राजा ने मेज़ की ओर देखकर ऊँची आवाज़ में पुकारा, “हे बेल, तू महान है, और तुझ में कोई छल नहीं है।”
