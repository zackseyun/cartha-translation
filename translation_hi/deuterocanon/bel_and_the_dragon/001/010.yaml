  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/010.yaml
  text: Daniel said to the king[a], “Let it be according to your word.” And there were seventy priests of Bel, besides women and children[c][b]; and he came in.
translation:
  language: hi
  text: दानिय्येल ने राजा से कहा, “जैसा आपने कहा है, वैसा ही हो।”[a] बेल के याजक सत्तर थे—स्त्रियों और बच्चों को छोड़कर।[b] और वह आया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आपके वचन के अनुसार हो।” यहाँ दानिय्येल राजा के प्रस्ताव से सहमत होता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात स्त्रियों और बच्चों की गिनती किए बिना।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पाठ इस पद के अंत में केवल “और वह आया” कहता है; वह कहाँ आया, यह आगे के प्रसंग से समझना पड़ता है।
    reason: cross_reference
lexical_decisions:
- source_word: Γινέσθω κατὰ τὸ ῥῆμά σου
  choice: जैसा आपने कहा है, वैसा ही हो
  rationale: यह वाक्य राजा के प्रस्ताव पर दानिय्येल की सहमति व्यक्त करता है। यह अनुवाद तीसरे पुरुष की आज्ञार्थक शक्ति और ‘आपके वचन के अनुसार’ का भाव, दोनों स्वाभाविक हिन्दी में रखता है; ‘आज्ञा’ कहना मूल से अधिक प्रबल होता।
- source_word: ἱερεῖς τοῦ Βὴλ
  choice: बेल के याजक
  rationale: ἱερεῖς उपासना से जुड़े अधिकारियों के लिए सामान्य शब्द है और संबंधकारक τοῦ Βὴλ उनका बेल से संबंध बताता है।
- source_word: ἑβδομήκοντα
  choice: सत्तर
  rationale: मूल यूनानी की प्रत्यक्ष संख्या।
- source_word: ἐκτὸς γυναικῶν καὶ τέκνων
  choice: स्त्रियों और बच्चों को छोड़कर
  rationale: ἐκτός बताता है कि स्त्रियाँ और बच्चे सत्तर की गिनती में शामिल नहीं थे। यह हिन्दी में स्पष्ट है, पर यह नहीं ठहराता कि वे अनुपस्थित थे।
- source_word: ἦλθεν
  choice: वह आया
  rationale: ἔρχομαι के इस रूप का सीधा अर्थ ‘आया’ है। इस पद में कर्ता लिंग से पुरुष है, पर उसका नाम और गंतव्य व्यक्त नहीं हैं; इसलिए उन्हें मुख्य पाठ में नहीं जोड़ा गया।
