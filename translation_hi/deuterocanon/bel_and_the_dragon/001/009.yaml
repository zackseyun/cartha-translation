lexical_decisions:
- source_word: δαπάνην ταύτην
  choice: इस खर्च के लिए
  rationale: δαπάνη का अर्थ खर्च या व्यय है। उपलब्ध यूनानी पाठ वाक्य के बीच से आरम्भ होता है; इसलिए ‘इस खर्च के लिए’ खंडित आरम्भ को सहज हिन्दी में रखता है, बिना पिछले संदर्भ को पाठ में जोड़ने के।
- source_word: ἀποθανεῖσθε
  choice: तुम मरोगे
  rationale: भविष्यकालीन क्रिया यहाँ न्यायिक धमकी या दण्डादेश का बल रखती है। ‘तुम मरोगे’ सीधा और आधुनिक हिन्दी रूप है।
- source_word: δείξητε
  choice: तुम दिखा दो
  rationale: क्रिया का मूल अर्थ दिखाना या प्रदर्शित करना है। ‘दिखा दो’ चुनौती के प्रसंग में स्वाभाविक है और ‘सिद्ध कर दो’ की अपेक्षा यूनानी के अधिक निकट रहता है।
- source_word: κατεσθίει
  choice: खाता है
  rationale: क्रिया में पूरी तरह खा जाने का भाव हो सकता है, पर यहाँ सामान्य ‘खाता है’ पर्याप्त और स्वाभाविक है; ‘चट कर जाता है’ अनावश्यक रूप से बोलचाल की और तीव्र अभिव्यक्ति होती।
- source_word: ἐβλασφήμησεν εἰς τὸν Βήλ
  choice: उसने बेल की निन्दा की है
  rationale: βλασφημέω किसी देवता के विरुद्ध अपमानजनक या धर्मविरुद्ध वचन कहने को सूचित करता है। हिन्दी में ‘बेल की निन्दा की है’ आरोप का धार्मिक भार बनाए रखता है, पर बेल की वास्तविक दिव्यता को स्वीकार नहीं करता।
- source_word: καὶ
  choice: और
  rationale: पद के अन्त का καὶ अगले पद में जारी वाक्य को जोड़ता है। इसे छोड़ा नहीं गया है, भले ही वर्तमान पद अकेला पढ़ने पर अधूरा लगे।
theological_decisions:
- issue: एक मूर्तिपूजक देवता के संबंध में βλασφημέω का अनुवाद
  choice: बेल की निन्दा की है
  alternative: बेल के विरुद्ध ईशनिन्दा की है
  rationale: ‘ईशनिन्दा’ बेल को ईश्वर कहे जाने का अधिक स्पष्ट आभास दे सकती है। ‘निन्दा’ वक्ताओं के धार्मिक आरोप को व्यक्त करती है, जबकि कथाकार की ओर से बेल की दिव्यता का समर्थन नहीं जोड़ती।
