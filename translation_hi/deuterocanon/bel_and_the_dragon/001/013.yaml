lexical_decisions:
- source_word: κατεφρόνουν
  choice: वे बेफिक्र थे
  rationale: क्रिया का अर्थ तुच्छ समझना, परवाह न करना या हल्के में लेना हो सकता है। प्रसंग में यह उनके इस निश्चिंत भाव को व्यक्त करता है कि दानिय्येल का उपाय उनका भेद नहीं खोलेगा; व्यापक अर्थ-सीमा पाद-टिप्पणी में रखी गई है।
- source_word: πεποιήκεσαν
  choice: बना रखा था
  rationale: पूर्णभूतकाल पहले से किए गए उस कार्य को दिखाता है जो उनकी निश्चिंतता का कारण था; हिंदी में ‘बना रखा था’ इस पूर्वस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κεκρυμμένην εἴσοδον
  choice: एक छिपा हुआ प्रवेश-द्वार
  rationale: कृदंत और संज्ञा मिलकर ऐसे प्रवेश-मार्ग को बताते हैं जिसे छिपाया गया था। ‘प्रवेश-द्वार’ स्पष्ट और सामान्य आधुनिक हिंदी है।
- source_word: ὑπὸ τὴν τράπεζαν
  choice: मेज़ के नीचे
  rationale: यह सीधा स्थानसूचक वाक्यांश है। यूनानी में केवल ‘मेज़’ है, इसलिए ‘वेदी’ जैसा व्याख्यात्मक शब्द नहीं जोड़ा गया।
- source_word: διʼ αὐτῆς
  choice: उसी से
  rationale: स्त्रीलिंग सर्वनाम का स्वाभाविक संबंध छिपे हुए प्रवेश-द्वार से है; ‘उसी से’ हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: εἰσεπορεύοντο
  choice: भीतर आया-जाया करते थे
  rationale: अपूर्ण भूतकाल बार-बार होने वाली प्रथागत क्रिया दर्शाता है। संदर्भ में गुप्त मार्ग से भीतर आने और फिर लौटने की नियमित गतिविधि निहित है; ‘आया-जाया करते थे’ इसे स्वाभाविक हिंदी में व्यक्त करता है।
