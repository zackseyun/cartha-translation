- source_word: ἐνέθρυψεν ἄρτους εἰς σκάφην
  choice: एक कटोरे में रोटियाँ तोड़कर डाल दी थीं
  rationale: ἐνέθρυψεν छोटे टुकड़े करने का संकेत देता है, ἄρτους बहुवचन में रोटियाँ/लोफ हैं, और σκάφη यहाँ भोजन रखने-ले जाने योग्य पात्र है। हिन्दी में ‘तोड़कर डालना’ प्रसंगानुकूल और सहज है।
- source_word: τὸ πεδίον
  choice: खेत में
  rationale: यद्यपि शब्द का अर्थ मैदान या खुला प्रदेश भी हो सकता है, कटाई करने वालों के प्रसंग में ‘खेत’ सबसे उपयुक्त है।
- source_word: ἀπενέγκαι τοῖς θερισταῖς
  choice: फसल काटने वालों के पास ले जा रहा था
  rationale: उद्देश्यवाचक infinitive भोजन पहुँचाने का भाव देता है; θερισταί का सरल आधुनिक हिन्दी रूप ‘फसल काटने वाले’ है।
