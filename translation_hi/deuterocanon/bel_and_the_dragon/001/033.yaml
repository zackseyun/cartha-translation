  text: And Habakkuk the prophet was in Judea[a], and he had cooked a stew and crumbled bread into a bowl[c][b], and was going to the field to bring it to the reapers.
translation:
  language: hi
  text: हबक्कूक नबी यहूदिया[a] में था। उसने उबालकर एक पकवान[b] तैयार किया था और रोटियों को टुकड़े-टुकड़े करके एक कटोरे में डाल दिया था[c]। वह उसे खेत में फसल काटने वालों के पास ले जा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदा’। यूनानी शब्द Ἰουδαία से यहूदिया प्रदेश, या कुछ संदर्भों में यहूदा, का बोध हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में इसका अर्थ उबालकर या पकाकर तैयार किया हुआ भोजन है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी शब्द ‘रोटियाँ’ के अर्थ में बहुवचन है।
    reason: lexical_clarification
