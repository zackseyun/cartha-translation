  text: And the king said to Daniel[a], “You cannot say that this is not a living god; and bow down to him.”
translation:
  language: hi
  text: और राजा ने दानिय्येल से कहा, “तुम यह नहीं कह सकते कि यह जीवित देवता नहीं है; और इसके सामने दण्डवत् करो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसकी आराधना करो।” यूनानी क्रिया का अर्थ सम्मान प्रकट करने के लिए सामने झुकना या, विशेषकर किसी देवता के सामने, आराधना करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύνασαι εἰπεῖν
  choice: तुम यह नहीं कह सकते
  rationale: नकारयुक्त δύναμαι और क्रियार्थक εἰπεῖν का सीधा और स्वाभाविक हिन्दी रूप; इससे राजा की चुनौती बनी रहती है और असमर्थता, मनाही या आलंकारिक असंभवता में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: οὐκ ἔστιν οὗτος θεὸς ζῶν
  choice: यह जीवित देवता नहीं है
  rationale: θεὸς ζῶν का स्वाभाविक अनुवाद ‘जीवित देवता’ है। यहाँ राजा बेल को देवता बता रहा है, इसलिए ‘जीवित परमेश्वर’ कहना इस्राएली विश्वास-घोषणा का भाव अनुचित रूप से जोड़ देता।
- source_word: προσκύνησον αὐτῷ
  choice: इसके सामने दण्डवत् करो
  rationale: προσκυνέω शरीर झुकाकर सम्मान देने या आराधना करने, दोनों को व्यक्त कर सकता है। ‘दण्डवत् करो’ दृश्य शारीरिक क्रिया को बनाए रखता है, जबकि इस प्रसंग का धार्मिक आशय भी स्पष्ट रहने देता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: कथा में पहले से परिचित राजा के लिए हिन्दी में ‘राजा’ स्वाभाविक और पर्याप्त है।
- source_word: τῷ Δανιὴλ
  choice: दानिय्येल से
  rationale: कहने की क्रिया के साथ यूनानी सम्प्रदान कारक का स्वाभाविक हिन्दी रूप ‘दानिय्येल से’ है।
theological_decisions:
- issue: क्या θεὸς ζῶν को सच्चे परमेश्वर की उपाधि के रूप में प्रस्तुत किया जाए
  choice: जीवित देवता
  alternative: जीवित परमेश्वर
  rationale: वक्ता एक गैर-इस्राएली राजा है और बेल की बात कर रहा है। ‘परमेश्वर’ कहने से मूर्ति के विषय में राजा के दावे में सच्चे परमेश्वर से जुड़ी विश्वास-घोषणा आ सकती थी; ‘देवता’ वक्ता का दृष्टिकोण और कथा की विडंबना सुरक्षित रखता है।
- issue: क्या προσκύνησον का अनुवाद स्पष्ट धार्मिक शब्द से किया जाए
  choice: इसके सामने दण्डवत् करो
  alternative: इसकी आराधना करो
  rationale: यूनानी क्रिया में शारीरिक प्रणाम और आराधना दोनों अर्थ संभव हैं। मुख्य पाठ में ठोस क्रिया रखी गई है और पादटिप्पणी धार्मिक अर्थ की संभावना स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘देवता’ राजा के मूर्तिपूजक दृष्टिकोण को दिखाता है; ‘दण्डवत् करो’ मूल क्रिया की अर्थगत व्यापकता को बनाए रखता है। पादटिप्पणी चिह्न मुख्य पाठ में संबद्ध वाक्य के बाद रखा गया है।
