  rationale: मूल शब्द स्वयं श्रद्धा या पूजा की वस्तुओं को सूचित करता है, पर अनिवार्य रूप से सबसे निंदात्मक शब्द नहीं है। चुना हुआ रूप मूल की अर्थ-सीमा को सुरक्षित रखते हुए कथा के व्यंग्य को स्वयं उभरने देता है।
