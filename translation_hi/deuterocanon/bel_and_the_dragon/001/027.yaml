    text: या “तुम्हारी पवित्र वस्तुएँ” अथवा “वे वस्तुएँ जिनका तुम आदर करते हो”; यूनानी शब्द श्रद्धा या पूजा की वस्तुओं को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πίσσαν
  choice: राल
  rationale: πίσσα गाढ़ी, चिपचिपी राल या तारकोल-जैसी सामग्री को दर्शाता है। यहाँ ‘राल’ सामान्य हिन्दी में संक्षिप्त और स्वाभाविक है, जबकि ‘तारकोल’ आधुनिक सड़क-निर्माण का अनावश्यक बोध करा सकता है।
- source_word: στῖρ
  choice: चर्बी
  rationale: यह शब्द पशु-वसा को दर्शाता है। ‘चर्बी’ आधुनिक हिन्दी में व्यापक और सहज है तथा ‘चरबी’ की अपेक्षा मानक वर्तनी है।
- source_word: τρίχας
  choice: बाल
  rationale: यूनानी बहुवचन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἥψησεν ἐπὶ τὸ αὐτό
  choice: उन्हें एक साथ उबाला
  rationale: ἕψω उबालने या पकाने और ἐπὶ τὸ αὐτό सामग्री को साथ मिलाने का भाव देता है। यह रूप दोनों अर्थों को स्पष्ट रखता है।
- source_word: μάζας
  choice: टिकियाँ
  rationale: μᾶζα गूँथी या तैयार की हुई सामग्री की टिकिया, लोई अथवा ढेले को दर्शाता है। ‘टिकियाँ’ यहाँ बनाई गई छोटी, आकार दी हुई मात्राओं के लिए स्वाभाविक है।
- source_word: δράκοντος
  choice: अजगर
  rationale: δράκων बड़े सर्प या ड्रैगन को सूचित कर सकता है। इस कथा में जीवित सर्पाकार प्राणी के लिए ‘अजगर’ आधुनिक हिन्दी में ‘ड्रैगन’ से अधिक स्वाभाविक है और केवल सामान्य ‘साँप’ से अधिक विशिष्ट भी।
- source_word: φαγὼν διερράγη
  choice: उन्हें खाकर फट गया
  rationale: कालगत कृदंत पहले खाने और फिर हिंसक रूप से फटने की क्रमिक घटना बताता है। हिन्दी में यह संक्षिप्त रूप स्वाभाविक है।
- source_word: τὰ σεβάσματα ὑμῶν
  choice: तुम्हारी पूजनीय वस्तुएँ
  rationale: σεβάσματα श्रद्धा या उपासना की वस्तुओं के लिए व्यापक शब्द है। ‘पूजनीय वस्तुएँ’ मूल की व्यापकता और कथन की व्यंग्यात्मक तीक्ष्णता बनाए रखता है, बिना सीधे ‘मूर्तियाँ’ जोड़ने के।
