lexical_decisions:
- source_word: πρόβατα τεσσεράκοντα
  choice: चालीस भेड़ें
  rationale: πρόβατα का सामान्य और व्यापक अर्थ भेड़ें अथवा छोटा पशुधन है; यहाँ ‘भेड़ें’ स्वाभाविक और सटीक है।
- source_word: οἴνου μετρηταὶ ἕξ
  choice: छः माप दाखमधु
  rationale: μετρητής तरल पदार्थ की एक माप है। ‘माप’ मात्रा का भाव बनाए रखता है और किसी अनिश्चित आधुनिक इकाई को आरोपित नहीं करता।
- source_word: ἐσέβετο αὐτόν
  choice: उसका आदर करता था
  rationale: σέβομαι आदर, श्रद्धा या उपासना व्यक्त कर सकता है। यहाँ ‘आदर करता था’ अगले προσκυνέω से शब्दगत भेद बनाए रखता है, जबकि प्रसंग उस आदर के धार्मिक स्वरूप को स्पष्ट करता है।
- source_word: ἐπορεύετο καθʼ ἑκάστην ἡμέραν
  choice: प्रतिदिन जाकर
  rationale: अपूर्ण काल नियमित रूप से दोहराए जाने वाले कार्य को सूचित करता है; ‘प्रतिदिन जाकर’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσκυνεῖν αὐτῷ
  choice: उसके सामने दण्डवत् करता था
  rationale: προσκυνέω झुककर प्रणाम करने या उपासना करने को सूचित कर सकता है। ‘दण्डवत् करना’ शारीरिक और धार्मिक दोनों आयामों की गुंजाइश रखता है।
- source_word: προσεκύνει τῷ θεῷ αὐτοῦ
  choice: अपने परमेश्वर के सामने दण्डवत् करता था
  rationale: पहले προσκυνέω के समान हिन्दी अभिव्यक्ति रखकर राजा और दानिय्येल के कार्यों के बीच मूल पाठ का जानबूझकर किया गया विरोध सुरक्षित रहता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: βασιλεύς का मानक हिन्दी अनुवाद।
- source_word: Δανιήλ
  choice: दानिय्येल
  rationale: हिन्दी बाइबल परम्परा में प्रचलित नामरूप।
theological_decisions:
- issue: मूर्ति और परमेश्वर के संबंध में प्रयुक्त धार्मिक क्रियाओं को स्पष्टतः ‘उपासना’ कहना या मूल की अर्थगत व्यापकता बनाए रखना
  choice: σέβομαι के लिए ‘आदर करता था’ और προσκυνέω की दोनों घटनाओं के लिए ‘दण्डवत् करता था’
  alternative: राजा और दानिय्येल दोनों के कार्यों के लिए ‘उपासना करता था’ कहना
  rationale: यूनानी पाठ राजा के बेल के प्रति भाव के लिए पहले σέβομαι और फिर उसके कर्म के लिए προσκυνέω प्रयोग करता है, जबकि दानिय्येल के परमेश्वर की ओर किए गए कर्म में वही προσκυνέω दोहराया गया है। अलग पहले पद और समान बाद के पद को हिन्दी में बनाए रखने से साहित्यिक विरोध तथा वास्तविक अर्थगत तनाव दोनों सुरक्षित रहते हैं।
