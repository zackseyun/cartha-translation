translation:
  language: hi
  text: और चालीस भेड़ें और दाखमधु की छह मापें। राजा उसके प्रति श्रद्धा रखता था और प्रतिदिन जाकर उसके सामने दण्डवत् करता था[a], परन्तु दानिय्येल अपने परमेश्वर के सामने दण्डवत् करता था। तब राजा ने उससे कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘उसकी उपासना करता था’ और ‘अपने परमेश्वर की उपासना करता था’ भी अनुवाद सम्भव है; यूनानी क्रिया προσκυνέω प्रसंग के अनुसार दण्डवत् करने या उपासना करने, दोनों अर्थों में आ सकती है।
