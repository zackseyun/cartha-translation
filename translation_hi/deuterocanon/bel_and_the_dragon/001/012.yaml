  text: और उस पर अपनी अंगूठी से मुहर लगा दो। फिर सुबह जब तुम आओ, यदि तुम्हें सब कुछ बेल के द्वारा खाया हुआ न मिले, तो हम मरेंगे—नहीं तो दानिय्येल मरेगा, जो हमारे विरुद्ध झूठ बोल रहा है।[a]
  philosophy: optimal-equivalence
