lexical_decisions:
- source_word: ἀναβοήσας
  choice: पुकारकर
  rationale: यह क्रिया ज़ोर से पुकारने का भाव व्यक्त करती है। ‘पुकारकर’ तीव्रता को अगले पदबंध ‘ऊँचे स्वर से’ के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह यूनानी मुहावरा आवाज़ की प्रबलता बताता है; ‘ऊँचे स्वर से’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: Μέγας εἶ
  choice: आप महान हैं
  rationale: विधेय विशेषण Μέγας पर बल है। हिन्दी में ‘आप महान हैं’ प्रत्यक्ष संबोधन में स्वाभाविक रहते हुए कथन की महिमा बनाए रखता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: यह परमेश्वर के लिए प्रत्यक्ष संबोधन है; ‘हे प्रभु’ κύριος के धार्मिक और संबोधनात्मक प्रयोग को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: θεός के लिए ‘परमेश्वर’ प्रतिष्ठित, स्पष्ट और प्रसंगानुकूल हिन्दी पद है। यूनानी निश्चित उपपद का हिन्दी में अलग शब्द देना आवश्यक नहीं है।
- source_word: τοῦ
  choice: '... के'
  rationale: स्रोत इस संबंधकारक उपपद पर ही समाप्त हो जाता है। हिन्दी में अकेले निश्चित उपपद का सीधा समकक्ष नहीं है; ‘... के’ आश्रित संबंध को और पाठ की अपूर्णता को दिखाता है।
theological_decisions:
- issue: ईश्वरीय संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: संबोधन इस्राएल के परमेश्वर से है। ‘प्रभु’ ईश्वरीय उपाधि को स्वाभाविक रूप से व्यक्त करता है और किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: τοῦ पर समाप्त होने वाले अपूर्ण स्रोत-पाठ को संभालना
  choice: रिक्तांश को तीन बिंदुओं से दिखाते हुए वाक्य को अपूर्ण रखना
  alternative: निकटवर्ती प्रसंग से संभावित संज्ञा जोड़कर वाक्य पूरा करना
  rationale: दिए गए मूल-पाठ में संबंधकारक उपपद के बाद अपेक्षित संज्ञा नहीं है। अनुमान से शब्द जोड़ने के बजाय अपूर्णता को प्रत्यक्ष दिखाना स्रोत-साक्ष्य के प्रति अधिक पारदर्शी है।
