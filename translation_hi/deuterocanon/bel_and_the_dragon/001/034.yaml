base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/034.yaml
  text: And an angel of the Lord said to Habakkuk[a], “Carry the meal that you have to Babylon[b], to Daniel in the lions’ pit.”
translation:
  language: hi
  text: और प्रभु के एक दूत ने हबक्कूक से कहा, “जो भोजन[a] तुम्हारे पास है, उसे बाबेल में सिंहों के गड्ढे[b] में दानिय्येल के पास ले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खाना,” “दिन का भोजन” अथवा “दोपहर का भोजन”; यूनानी शब्द भोजन को सूचित करता है, पर अपने-आप दिन का ठीक समय निश्चित नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: परंपरागत अनुवाद “सिंहों की माँद”; यूनानी में अधिक शाब्दिक रूप से “सिंहों का गड्ढा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  choice: प्रभु के एक दूत
  rationale: ἄγγελος के साथ उपपद नहीं है, इसलिए ‘एक दूत’ यूनानी की अनिश्चितता को बनाए रखता है। इस प्रसंग में Κυρίου इस्राएल के परमेश्वर के लिए प्रयुक्त उपाधि है, अतः ‘प्रभु’ स्वाभाविक है।
- source_word: Ἀμβακοὺμ
  choice: हबक्कूक
  rationale: हिन्दी बाइबल परंपरा में नबी के नाम का प्रचलित रूप।
- source_word: Ἀπένεγκε
  choice: ले जाओ
  rationale: आज्ञार्थक क्रिया भोजन को हबक्कूक के स्थान से बाबेल में दानिय्येल तक पहुँचाने की दिशा बताती है; आधुनिक हिन्दी में ‘ले जाओ’ स्वाभाविक है।
- source_word: τὸ ἄριστον
  choice: भोजन
  rationale: ἄριστον किसी भोजन को सूचित करता है, जो काल और प्रसंग के अनुसार प्रातः या मध्याह्न का भोजन हो सकता है। ‘भोजन’ दिन का कोई निश्चित समय आरोपित नहीं करता।
- source_word: ὃ ἔχεις
  choice: जो तुम्हारे पास है
  rationale: यह संबंधवाचक उपवाक्य यूनानी का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: εἰς Βαβυλῶνα
  choice: बाबेल में
  rationale: गंतव्य बाबेल है; अगले स्थानवाचक पद के साथ हिन्दी वाक्य में ‘बाबेल में ... के पास ले जाओ’ दिशा और अंतिम स्थान दोनों को सहज रूप से व्यक्त करता है।
- source_word: τῷ Δανιὴλ εἰς τὸν λάκκον τῶν λεόντων
  choice: सिंहों के गड्ढे में दानिय्येल के पास
  rationale: दानिय्येल गड्ढे में है और भोजन उसके पास पहुँचाया जाना है। λάκκος का ठोस अर्थ ‘गड्ढा’ है, जिसे पारंपरिक ‘माँद’ के बजाय मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: व्यवस्थाविवरणेतर यूनानी कथा में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु का दूत’ वाक्यांश में κύριος इस्राएल के परमेश्वर को सूचित करता है; ‘प्रभु’ उपाधि को सुरक्षित रखता है और कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास हिन्दी के स्वाभाविक क्रम में है, जबकि ‘एक दूत,’ भोजन के समय की अनिश्चितता और ‘गड्ढे’ की ठोस छवि मूल यूनानी के अनुसार सुरक्षित हैं।
