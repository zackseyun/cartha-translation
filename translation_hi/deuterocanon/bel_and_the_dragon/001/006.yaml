- source_word: ὁρᾷς
  choice: क्या तुम नहीं देखते
  rationale: वर्तमानकालीन अलंकारिक प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ὅσα ἐσθίει
