  rationale: ὅσα यहाँ खाई गई वस्तुओं की सूची से अधिक उनकी मात्रा को प्रमाण के रूप में सामने रखता है।
theological_decisions:
- issue: πάσης σαρκὸς में परमेश्वर की प्रभुता का विस्तार
  choice: समस्त प्राणियों
  alternative: समस्त मनुष्यों; समस्त देहधारियों
  rationale: यूनानी पद मानवजाति अथवा सभी जीवित प्राणियों को सूचित कर सकता है। ‘समस्त प्राणियों’ व्यापक अर्थ को सुरक्षित रखता है, यद्यपि हिन्दी में मूल रूपक ‘मांस/देह’ प्रत्यक्ष नहीं रहता।
- issue: मूर्तिपूजक राजा के कथन में ζῶν θεός
  choice: जीवित देवता
  alternative: जीवित परमेश्वर
  rationale: यूनानी में पद अनिर्दिष्ट है और बेल के लिए प्रयुक्त हुआ है। ‘परमेश्वर’ कहने से इस्राएल के परमेश्वर की स्वीकारोक्ति का भाव अनावश्यक रूप से आ सकता था।
