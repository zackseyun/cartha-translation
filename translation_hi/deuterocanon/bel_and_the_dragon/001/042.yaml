  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/042.yaml
  text: Daniel[a], and there is no other besides you. And he pulled him up. But he threw those responsible for his destruction into the pit[b], and they were devoured at once before him.
translation:
  language: hi
  text: “दानिय्येल[a], तुम्हारे सिवा और कोई नहीं है।” तब उसने उसे ऊपर खींच लिया। परन्तु उसके विनाश के लिए जिम्मेदार लोगों को उसने गड्ढे[b] में फेंक दिया, और वे तुरन्त उसके सामने खा डाले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ अचानक “दानिय्येल, तुम्हारे सिवा और कोई नहीं है” से आरम्भ होता है और सम्भवतः पिछले पद के कथन को जारी रखता है। कुछ अनुवाद स्पष्टता के लिए “राजा ने कहा” जैसे शब्द जोड़ते हैं।
    reason: textual_variant
  - marker: b
    text: या “माँद।” यूनानी शब्द का शाब्दिक अर्थ “गड्ढा” है, यद्यपि प्रसंग में यह सिंहों का गड्ढा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν πλὴν σοῦ ἄλλος
  choice: तुम्हारे सिवा और कोई नहीं है
  rationale: यह वाक्यांश दानिय्येल के प्रति अनन्य प्रशंसा व्यक्त करता है और यूनानी की जोरदार, किंतु स्वाभाविक, अभिव्यक्ति को बनाए रखता है।
- source_word: ἀνέσπασεν
  choice: ऊपर खींच लिया
  rationale: क्रिया नीचे से ऊपर खींचने का बोध देती है; गड्ढे के प्रसंग में यह सीधा और स्वाभाविक है।
- source_word: τοὺς ... αἰτίους τῆς ἀπωλείας αὐτοῦ
  choice: जिन लोगों ने उसके विनाश की योजना बनाई थी
  rationale: αἴτιος उत्तरदायित्व अथवा कारण होने का अर्थ रखता है। प्रसंग में ये लोग दानिय्येल का विनाश कराने वाले थे; ‘योजना बनाई थी’ उनकी दोषपूर्ण भूमिका को सहज हिन्दी में व्यक्त करता है, बिना यह कहे कि विनाश वास्तव में हो चुका था।
- source_word: ἐνέβαλεν εἰς τὸν λάκκον
  choice: गड्ढे में फेंक दिया
  rationale: λάκκος का मूल अर्थ ‘गड्ढा’ है; सिंहों का स्थान संदर्भ से स्पष्ट है, इसलिए मुख्य पाठ में अधिक विशिष्ट ‘माँद’ नहीं जोड़ा गया।
- source_word: κατεβρώθησαν
  choice: निगल लिए गए
  rationale: निष्क्रिय क्रिया खा लिए जाने अथवा भक्षण किए जाने को दर्शाती है। ‘निगल लिए गए’ सिंहों की तत्काल हिंसक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παραχρῆμα
  choice: उसी समय
  rationale: यह शब्द तत्कालता व्यक्त करता है; ‘उसी समय’ वर्तमान हिन्दी में स्पष्ट और सहज है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यह यूनानी अभिव्यक्ति का सीधा रूप है और संदर्भगत सर्वनाम की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
theological_decisions:
- issue: स्वीटे पाठ में आरम्भिक वाक्य की अचानक और खंडित प्रतीत होने वाली रचना
  choice: आरम्भिक शब्दों को दानिय्येल को सम्बोधित प्रत्यक्ष कथन के रूप में अनूदित किया गया है, पर मुख्य पाठ में वक्ता या ‘कहा’ जैसी क्रिया नहीं जोड़ी गई।
  alternative: ‘राजा ने कहा, “दानिय्येल, तुम्हारे सिवा और कोई नहीं है”’ जैसे शब्द जोड़कर वाक्य को सुगम बनाया जा सकता है।
  rationale: प्राप्त यूनानी पाठ सीधे ‘दानिय्येल’ से आरम्भ होता है और सम्भवतः पिछले पद के कथन को जारी रखता है। स्रोत की अनिश्चितता बनाए रखने के लिए अनुपस्थित परिचय को मुख्य पाठ में पूरा नहीं किया गया।
- issue: τῆς ἀπωλείας αὐτοῦ का अर्थ
  choice: उसके विनाश की योजना
  alternative: उसकी मृत्यु; उसका सर्वनाश
  rationale: ἀπώλεια विनाश या बरबादी का व्यापक अर्थ रखता है। दानिय्येल बच गया था, इसलिए हिन्दी वाक्य में षड्यंत्रकारियों के अभिप्रेत विनाश का भाव स्पष्ट किया गया, न कि सम्पन्न घटना का।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली रखी गई है। आरम्भ की स्रोतगत असहजता को फुटनोट सहित सुरक्षित रखा गया है। ‘गड्ढा’ मूल यूनानी के निकट है, जबकि ‘माँद’ को विकल्प के रूप में दिया गया है।
