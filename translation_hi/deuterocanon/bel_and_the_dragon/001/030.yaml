translation:
  language: hi
  text: और राजा ने देखा कि वे उस पर बहुत दबाव डाल रहे हैं; तब विवश होकर उसने दानिय्येल को उनके हवाले कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείγουσιν
  choice: दबाव डाल रहे हैं
  rationale: यह वर्तमानकालीन क्रिया लगातार और प्रबल आग्रह या दबाव को व्यक्त करती है; यह चयन केवल अनुरोध से अधिक तीव्रता दिखाता है, पर शारीरिक बल का अर्थ नहीं जोड़ता।
- source_word: σφόδρα
  choice: बहुत
  rationale: यह क्रिया की तीव्रता बढ़ाता है; ‘बहुत दबाव’ आधुनिक हिन्दी में स्वाभाविक और जोरदार है।
- source_word: ἀναγκασθείς
  choice: विवश होकर
  rationale: निष्क्रिय कृदंत बताता है कि राजा बाहरी दबाव के कारण ऐसा करता है; ‘विवश होकर’ इस बाध्यता को बिना शारीरिक बल निर्दिष्ट किए सुरक्षित रखता है।
- source_word: παρέδωκεν
  choice: हवाले कर दिया
  rationale: यह दानिय्येल को दूसरों के अधिकार या नियंत्रण में सौंपने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Δανιήλ
  choice: दानिय्येल
  rationale: यह हिन्दी बाइबिल परंपरा में प्रचलित नाम-रूप है।
theological_decisions:
- issue: राजा पर पड़े दबाव की प्रकृति
  choice: राजा प्रबल सामाजिक या राजनीतिक दबाव में विवश होकर कार्य करता है।
  alternative: राजा केवल मान गया था, अथवा उसे शारीरिक बल से बाध्य किया गया था।
  rationale: ἐπείγουσιν ... σφόδρα और ἀναγκασθείς मिलकर तीव्र दबाव और उससे उत्पन्न विवशता दिखाते हैं, पर दबाव का सटीक प्रकार निर्धारित नहीं करते।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में वर्तमान क्रिया की निरंतरता और राजा की बाध्य अवस्था दोनों स्पष्ट हैं; किसी संप्रदायगत व्याख्या को नहीं जोड़ा गया।
