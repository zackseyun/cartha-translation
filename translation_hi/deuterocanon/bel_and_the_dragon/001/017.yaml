- source_word: καὶ εἶπεν ... ὁ δὲ εἶπεν
  choice: उसने पूछा ... उसने उत्तर दिया
  rationale: यूनानी में दोनों स्थानों पर ‘कहा’ है, पर प्रश्न और प्रत्युत्तर की संरचना को आधुनिक हिन्दी में ‘पूछा/उत्तर दिया’ स्वाभाविक और स्पष्ट बनाता है, बिना अर्थ बदले।
