  text: And Habakkuk cried out[a], saying, “Daniel, Daniel, take the meal that God has sent you.”
translation:
  language: hi
  text: और हबक्कूक ने पुकारकर कहा, “दानिय्येल, दानिय्येल![a] वह भोजन ले लो जो परमेश्वर ने तुम्हारे लिए भेजा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिया गया यूनानी पाठ “दानिय्येल, दानिय्येल” के बाद कट जाता है और अंत में केवल एक अलग-थलग बीटा (Β) रह जाता है। शेष अनुवाद ‘बेल और अजगर’ के थियोदोशियन रूप में इस पद की मानक निरंतरता पर आधारित है, जिसमें हबक्कूक दानिय्येल को परमेश्वर द्वारा भेजे गए भोजन के बारे में बताता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐβόησεν
