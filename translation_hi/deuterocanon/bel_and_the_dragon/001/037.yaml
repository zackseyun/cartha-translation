- source_word: Ἀμβακοὺμ
  choice: हबक्कूक
  rationale: भविष्यद्वक्ता के नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: λέγων
  choice: कहा
  rationale: यह कृदन्त प्रत्यक्ष वचन का परिचय देता है; ἐβόησεν के साथ मिलाकर ‘पुकारकर कहा’ स्वाभाविक हिन्दी बनती है।
- source_word: Δανιὴλ Δανιήλ
  choice: दानिय्येल, दानिय्येल
  rationale: सम्बोधन की पुनरावृत्ति को उसकी तात्कालिकता और बल सहित सुरक्षित रखा गया है।
- source_word: Β
  choice: वह भोजन ले लो जो परमेश्वर ने तुम्हारे लिए भेजा है
  rationale: दिया गया यूनानी पाठ यहाँ कट गया है और अंत में केवल एक अलग बीटा बचा है। अनुवाद में थियोदोशियन रूप में प्रचलित मानक निरंतरता दी गई है और पाठ की अपूर्णता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: दिए गए यूनानी साक्ष्य का वचन के बीच में कट जाना
  choice: परमेश्वर द्वारा दानिय्येल के लिए भेजे गए भोजन की मानक थियोदोशियन निरंतरता का अनुवाद किया गया है और पाठगत अपूर्णता पादटिप्पणी में बताई गई है।
  alternative: 'केवल उपलब्ध शब्दों का अनुवाद करना: ‘तब हबक्कूक ने पुकारकर कहा, “दानिय्येल, दानिय्येल…”’'
  rationale: प्रस्तुत पंक्ति सम्बोधन के बाद एक अलग बीटा पर रुक जाती है, पर स्रोत-विवरण इसे पूर्ण थियोदोशियन धारा से लिया गया बताता है और इस पद की निरंतरता ज्ञात है। उपयोगी पूर्ण पद देते हुए स्रोत की अनिश्चितता छिपाई नहीं गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘पुकारकर कहा’ यूनानी वाक्य-विन्यास के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; नामों के प्रचलित हिन्दी बाइबलीय रूप प्रयुक्त हैं।
