base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/011.yaml
  text: The king went with Daniēl into the house of Bel. And the priests of Bel said, “Look, we are going outside. But you, O king, set out the food, and after mixing the wine, set it out, and shut the door.”
translation:
  language: hi
  text: राजा दानिय्येल के साथ बेल के भवन[a] में गया। बेल के पुरोहितों ने कहा, “देखिए, हम बाहर जा रहे हैं। परन्तु हे राजा, आप भोजन रख दीजिए, और दाखमधु मिलाकर उसे भी रख दीजिए, फिर द्वार बंद कर दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेल के मंदिर।” यूनानी में शाब्दिक अर्थ “बेल का घर” है, जो किसी देवता के उपासना-स्थान या मंदिर के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς μετὰ Δανιὴλ
  choice: राजा दानिय्येल के साथ
  rationale: μετά संबंधवाचक रूप के साथ संगति व्यक्त करता है; ‘के साथ’ इसका स्वाभाविक हिन्दी रूप है। Δανιήλ के लिए हिन्दी बाइबलीय प्रचलन ‘दानिय्येल’ रखा गया है।
- source_word: εἰς τὸν οἶκον τοῦ Βήλ
  choice: बेल के भवन में
  rationale: οἶκος का मूल अर्थ ‘घर/भवन’ है, और यहाँ देवता के उपासना-स्थान का संकेत है। ‘भवन’ मूल रूपक को बचाता है और ‘घर’ की अपेक्षा इस धार्मिक संदर्भ में अधिक स्वाभाविक है; पादटिप्पणी ‘मंदिर’ स्पष्ट करती है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। पुरोहित राजा को संबोधित कर रहे हैं, इसलिए आदरसूचक ‘देखिए’ आधुनिक हिन्दी में उपयुक्त है।
- source_word: ἡμεῖς ἀποτρέχομεν ἔξω
  choice: हम बाहर जा रहे हैं
  rationale: ἀποτρέχω में बाहर चले जाने का भाव है; प्रसंग में गति पर बल नहीं है, इसलिए ‘दौड़कर’ जोड़ना अनावश्यक अतिव्याख्या होती।
- source_word: σύ δέ, βασιλεῦ
  choice: परन्तु हे राजा, आप
  rationale: δέ और स्पष्ट सर्वनाम σύ पुरोहितों और राजा के कार्यों में विरोध दिखाते हैं। βασιλεῦ संबोधन है; ‘हे राजा’ गरिमापूर्ण है और ‘आप’ आधुनिक आदरसूचक प्रयोग है।
- source_word: παράθες τὰ βρώματα
  choice: भोजन रख दीजिए
  rationale: παράθες का अर्थ सामने रखना/परोसकर रखना है और βρώματα खाद्य पदार्थ हैं। ‘भोजन रख दीजिए’ सहज रहते हुए आदेश का भाव देता है।
- source_word: τὸν οἶνον κεράσας θές
  choice: दाखमधु मिलाकर उसे भी रख दीजिए
  rationale: 'κεράσας पूर्वकालिक कृदन्त है: दाखमधु को मिलाने के बाद रखने का निर्देश। ‘मिलाकर’ इस क्रम को संक्षेप और स्वाभाविक ढंग से रखता है; ‘उसे भी’ θές की पुनरावृत्ति और भोजन के साथ समानांतर क्रिया स्पष्ट करता है।'
- source_word: ἀπόκλεισον τὴν θύραν
  choice: द्वार बंद कर दीजिए
  rationale: ἀποκλείω यहाँ बंद करने का अर्थ देता है। यूनानी पाठ ताला लगाने की बात स्पष्टतः नहीं कहता, अतः ‘बंद’ उपयुक्त है।
theological_decisions:
- issue: οἶκος τοῦ Βήλ में उपासना-स्थान का स्वरूप
  choice: बेल के भवन
  alternative: बेल के मंदिर
  rationale: धार्मिक प्रसंग में यह बेल का मंदिर है, पर यूनानी οἶκος शाब्दिक रूप से ‘घर/भवन’ कहता है। मुख्य पाठ में ‘भवन’ रखकर स्रोत की अभिव्यक्ति बचाई गई है और अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक क्रियाओं का प्रयोग किया गया है, क्योंकि पुरोहित राजा से सीधे बात कर रहे हैं। शैली कथात्मक, सहज और गरिमापूर्ण रखी गई है; ‘दाखमधु’ और ‘द्वार’ बाइबलीय प्रसंग के अनुरूप हैं, पर वाक्यरचना वर्तमान हिन्दी की है।
