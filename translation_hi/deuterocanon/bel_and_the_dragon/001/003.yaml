- source_word: σεμιδάλεως
  choice: मैदा
  rationale: यह बारीक, उत्तम गेहूँ के आटे को दर्शाता है; सामान्य हिन्दी में ‘मैदा’ संक्षिप्त और बोधगम्य समतुल्य है।
- source_word: ἀρτάβαι δώδεκα
