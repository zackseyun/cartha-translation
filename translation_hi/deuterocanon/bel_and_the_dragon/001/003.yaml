- source_word: ἐδαπανῶντο εἰς αὐτὸν
  choice: उसके लिए ... खर्च किया जाता था
  rationale: मूल का निष्क्रिय और व्यय-संबंधी भाव बनाए रखता है, बिना यह जोड़े कि सामग्री किस रीति से प्रयुक्त होती थी।
