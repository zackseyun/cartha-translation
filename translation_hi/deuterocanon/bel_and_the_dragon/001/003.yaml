  choice: मूर्ति
  rationale: संदर्भ में यह पूजी जाने वाली प्रतिमा है; आधुनिक हिन्दी में ‘मूर्ति’ स्वाभाविक और स्पष्ट है।
- source_word: τοῖς Βαβυλωνίοις
  choice: बाबुलियों के बीच
