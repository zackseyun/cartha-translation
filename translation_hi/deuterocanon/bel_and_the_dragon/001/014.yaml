  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/014.yaml
  text: and they consumed them completely. And it happened that[a], when those men had gone out, the king set the food before Bel, and Daniel commanded his young servants, and they brought ashes and scattered them over the whole temple in the presence of the king alone. Then, after going out, they shut the door and sealed it with the king’s signet ring, and went away.
translation:
  language: hi
  text: और वे उन्हें पूरी तरह खा जाते थे। ऐसा हुआ कि जब वे लोग बाहर निकल गए, तो राजा ने बेल के सामने भोजन रख दिया। तब दानिय्येल ने अपने युवा सेवकों को आज्ञा दी, और वे राख ले आए और उसे केवल राजा की उपस्थिति में[a] पूरे मंदिर में बिखेर दी। फिर वे बाहर निकले, द्वार बंद किया, और राजा की मुहरवाली अंगूठी से उस पर मुहर लगाकर चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘केवल राजा के सामने।’ यूनानी वाक्यांश इस बात पर बल देता है कि राख बिखेरते समय केवल राजा उपस्थित था।
    reason: lexical_alternative
lexical_decisions:
- source_word: διόλου καὶ ἀνήλουν αὐτά
  choice: और वे उन्हें पूरी तरह खपा देते थे
  rationale: अपूर्ण भूतकाल ἀνήλουν को आदतन चलने वाली क्रिया के रूप में रखा गया है; भोजन के सन्दर्भ में ‘खपा देते थे’ पूर्ण उपभोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρέθηκεν τὰ βρώματα τῷ Βήλ
  choice: बेल के सामने भोजन रख दिया
  rationale: παρατίθημι में किसी के आगे भोजन रखने या प्रस्तुत करने का भाव है; यह अनुष्ठानिक सन्दर्भ को भी बनाए रखता है।
- source_word: τοῖς παιδαρίοις αὐτοῦ
  choice: अपने युवा सेवकों को
  rationale: παιδάριον आयु और सेवक की भूमिका, दोनों सूचित कर सकता है; ‘युवा सेवक’ दोनों पहलुओं को सुरक्षित रखता है।
- source_word: τέφραν ... κατέσποραν
  choice: राख ... बिखेर दिया
  rationale: राख द्रव्यवाचक एकवचन में स्वाभाविक है और κατέσποραν का अर्थ सतह पर फैलाना या बिखेरना है।
- source_word: ὅλον τὸν ναὸν
  choice: पूरे मन्दिर में
  rationale: ναός यहाँ बेल के उपासना-स्थल को दर्शाता है; स्रोत की व्यापक अभिव्यक्ति को बिना ‘फर्श’ जोड़े रखा गया है।
- source_word: ἐσφραγίσαντο ἐν τῷ δακτυλίῳ τοῦ βασιλέως
  choice: उस पर राजा की मुहरवाली अंगूठी से मुहर लगा दी
  rationale: राजकीय अंगूठी द्वारा आधिकारिक रूप से द्वार को मुहरबन्द करने का अर्थ आधुनिक पाठक के लिए स्पष्ट किया गया है।
