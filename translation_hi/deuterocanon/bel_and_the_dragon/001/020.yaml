translation:
  language: hi
  text: “ये पदचिह्न किसके हैं?” राजा ने कहा, “मुझे पुरुषों, स्त्रियों और बच्चों के पदचिह्न दिखाई दे रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος
  choice: किसके
  rationale: यह संबंधवाचक प्रश्नवाचक सर्वनाम है, जो पदचिह्नों के व्यक्तियों की पहचान पूछता है; ‘किसके’ स्वाभाविक और सटीक है।
- source_word: ἴχνη
  choice: पदचिह्न
  rationale: यह पैरों से छोड़े गए निशानों को दर्शाता है; कथा के इस प्रसंग में ‘पदचिह्न’ स्पष्ट और विशिष्ट है।
- source_word: ταῦτα
  choice: ये
  rationale: यह सामने दिखाई दे रहे प्रमाण की ओर संकेत करता है; ‘ये’ उस निकट संकेत को बनाए रखता है।
- source_word: Ὁρῶ
  choice: मुझे … दिखाई दे रहे हैं
  rationale: वर्तमान काल के प्रत्यक्ष बोध को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνδρῶν
  choice: पुरुषों
  rationale: यह विशेष रूप से वयस्क पुरुषों का बहुवचन है, सामान्य मानवजाति का नहीं।
- source_word: γυναικῶν
  choice: स्त्रियों
  rationale: इस व्यक्तियों की सूची में सामान्य अर्थ ‘स्त्रियाँ’ उपयुक्त है, न कि संबंधसूचक ‘पत्नियाँ’।
- source_word: παιδίων
  choice: बच्चों
  rationale: यह बच्चों को सामान्य रूप से दर्शाता है; ‘बच्चों’ स्पष्ट है और आयु को अनावश्यक रूप से अधिक सीमित नहीं करता।
