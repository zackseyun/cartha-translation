  text: Does he drink every day? And Daniel said[a], laughing, “Do not be deceived, O king; for this one is clay inside and bronze outside, and never—”
translation:
  language: hi
  text: क्या वह हर दिन पीता है? और दानियेल ने हँसते हुए कहा, “हे राजा, धोखा न खाइए; क्योंकि यह भीतर से मिट्टी का और बाहर से काँसे का है, और नहीं—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के लिए उपलब्ध यूनानी साक्ष्य ‘और नहीं’ (καὶ οὐ) के बाद टूट जाता है; इसलिए यहाँ वाक्य अधूरा है।
    reason: textual_variant
lexical_decisions:
- source_word: πίνει
  choice: पीता है
  rationale: यह क्रिया ‘पीना’ दर्शाती है। प्रसंग और प्रश्नचिह्न के अनुसार इसे स्वाभाविक हिन्दी प्रश्न ‘क्या वह…पीता है?’ के रूप में रखा गया है।
- source_word: καθʼ ἑκάστην ἡμέραν
  choice: हर दिन
  rationale: यह वितरणसूचक पदबंध ‘प्रत्येक दिन’ का अर्थ देता है; ‘हर दिन’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: γελάσας
  choice: हँसते हुए
  rationale: अओरिस्ट कृदन्त दानियेल के बोलते समय की मुद्रा बताता है। ‘हँसते हुए’ अर्थ को बिना ‘मुस्कराने’ तक हल्का किए स्वाभाविक रूप से व्यक्त करता है।
- source_word: Μὴ πλανῶ
  choice: धोखे में न रहें
  rationale: पाठ का रूप कुछ असामान्य है, पर निषेध का आशय राजा को भ्रमित या धोखा खाया हुआ न रहने की चेतावनी देना है। आदरसूचक बहुवचन राजकीय संबोधन के साथ स्वाभाविक है।
- source_word: βασιλεῦ
  choice: हे राजा
  rationale: यह प्रत्यक्ष सम्बोधन का सम्बोधन-कारक रूप है; ‘हे राजा’ औपचारिकता और कथात्मक गरिमा बनाए रखता है।
- source_word: οὗτος
  choice: यह
  rationale: यूनानी में केवल संकेतवाचक सर्वनाम है। प्रसंग में यह बेल की मूर्ति को सूचित करता है, पर मूल में न आए ‘देवता’ या ‘मूर्ति’ को पाठ में नहीं जोड़ा गया।
- source_word: ἔσωθέν … πηλός
  choice: भीतर से मिट्टी का
  rationale: यह मूर्ति की भीतरी सामग्री को बताता है; हिन्दी में ‘मिट्टी का’ रचना-सामग्री को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔξωθεν … χαλκός
  choice: बाहर से काँसे का
  rationale: χαλκός ताँबे या काँसे को सूचित कर सकता है। प्राचीन निर्मित वस्तु के संदर्भ में ‘काँसा’ उपयुक्त है और भीतर-बाहर का विरोध स्पष्ट रखता है।
- source_word: καὶ οὐ
  choice: और नहीं—
  rationale: उपलब्ध यूनानी अंश ठीक इन्हीं शब्दों पर टूट जाता है। इसलिए किसी अनुमानित क्रिया या ‘कभी’ को जोड़ने के बजाय अपूर्ण वाक्य को यथासंभव निकटता से सुरक्षित रखा गया है।
theological_decisions:
- issue: प्रदत्त यूनानी साक्ष्य में पद का खंडित अंत
  choice: केवल उपलब्ध शब्दों का अनुवाद करके वाक्य को अपूर्ण दिखाना
  alternative: अन्य संस्करणों या प्रसंग के आधार पर छूटी हुई क्रिया और कथन की पूर्ति करना
  rationale: स्रोत अंश καὶ οὐ (‘और नहीं’) पर समाप्त होता है। अनुपलब्ध शब्द जोड़ना स्रोत से आगे जाकर अर्थ निश्चित कर देता; डैश और पादटिप्पणी पाठ की वास्तविक स्थिति पारदर्शी रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। राजा के लिए आदरसूचक ‘रहें’ और औपचारिक सम्बोधन ‘हे राजा’ प्रयुक्त हुआ है। खंडित स्रोत को सहज बनाने के लिए अनुमानित शब्द नहीं जोड़े गए।
