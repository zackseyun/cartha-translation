  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/028.yaml
  text: And it happened that when the Babylonians heard[a], they became indignant and gathered together against the king and said, “The king has become a Jew; he has torn down Bel and killed the dragon and slaughtered the priests.”
translation:
  language: hi
  text: और ऐसा हुआ कि जब बाबेल के लोगों ने यह सुना, तो वे क्रोधित हो उठे और राजा के विरुद्ध इकट्ठे होकर कहने लगे, “राजा यहूदी[a] हो गया है! उसने बेल को ढा दिया, उस अजगर को मार डाला और याजकों का वध कर दिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया-वासी।” यूनानी शब्द Ἰουδαῖος धार्मिक-जातीय पहचान (“यहूदी”) या भौगोलिक-राजनीतिक पहचान (“यहूदिया-वासी”), दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσαν
  choice: और ऐसा हुआ कि जब ... ने यह सुना
  rationale: यह कथात्मक सूत्र मूल की सामी शैली की छाया बनाए रखता है। ‘यह’ प्रसंग में पहले घटित घटनाओं की ओर स्वाभाविक संकेत करता है; ‘जैसे ही’ तत्कालता को आवश्यकता से अधिक प्रबल करता।
- source_word: οἱ Βαβυλώνιοι
  choice: बाबेल के लोग
  rationale: यह नागरिक/जातीय समूह को सहज आधुनिक हिन्दी में व्यक्त करता है और नगर बाबेल से उनका संबंध स्पष्ट रखता है।
- source_word: ἠγανάκτησαν
  choice: क्रोधित हो उठे
  rationale: क्रिया तीव्र रोष और आक्रोश व्यक्त करती है। यह हिन्दी प्रयोग भाव की शक्ति तथा अवस्था-परिवर्तन दोनों को स्वाभाविक ढंग से सामने लाता है।
- source_word: συνεστράφησαν ἐπὶ τὸν βασιλέα
  choice: राजा के विरुद्ध इकट्ठे होकर
  rationale: मूल में सामूहिक रूप से एकत्र होकर राजा के विरोध में खड़े होने का भाव है। यह अनुवाद गुप्त षड्यंत्र का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: Ἰουδαῖος γέγονεν ὁ βασιλεύς
  choice: राजा यहूदी हो गया है
  rationale: इस प्रसंग में आरोप राजा के दानिय्येल के लोगों और उनके धर्म के साथ जुड़ जाने का है। फिर भी यूनानी शब्द की ‘यहूदिया-वासी’ वाली सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: τὸν Βὴλ κατέσπασεν
  choice: उसने बेल को ढा दिया
  rationale: κατασπάω नीचे खींचने या ढा देने का बोध देता है। प्रत्यक्ष कर्म ‘बेल’ को मूल की तरह बनाए रखते हुए उसकी प्रतिमा/उपासना-स्थल के विनाश का कथात्मक आशय व्यक्त होता है।
- source_word: τὸν δράκοντα ἀπέκτεινεν
  choice: उस अजगर को मार डाला
  rationale: यह स्पष्ट, आधुनिक हिन्दी है और निश्चित उपपद को ‘उस’ से व्यक्त करता है, क्योंकि यह वही पहले उल्लिखित प्राणी है।
- source_word: τοὺς ἱερεῖς κατέσφαξεν
  choice: याजकों का वध कर दिया
  rationale: κατασφάζω साधारण हत्या से अधिक हिंसक वध का बोध देता है। ‘वध कर दिया’ उसकी तीव्रता को गरिमापूर्ण हिन्दी में बनाए रखता है।
theological_decisions:
- issue: Ἰουδαῖος का अनुवाद
  choice: यहूदी
  alternative: यहूदिया-वासी
  rationale: शब्द धार्मिक-जातीय पहचान अथवा भौगोलिक-राजनीतिक पहचान, दोनों सूचित कर सकता है। इस प्रसंग में धार्मिक-जातीय आरोप अधिक स्वाभाविक है, पर वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक आरम्भ में मूल की सूत्रात्मक शैली का हल्का प्रभाव सुरक्षित है। भाषा सहज किन्तु गरिमापूर्ण रखी गई है। ‘बेल’, ‘अजगर’ और ‘याजक’ इस ग्रन्थ के धार्मिक-कथात्मक संदर्भ के अनुरूप हैं।
