lexical_decisions:
- source_word: ἐπελάβετο
  choice: पकड़ ली
  rationale: यह क्रिया अचानक और दृढ़ता से पकड़ने का भाव देती है। हिंदी में ‘पकड़ ली’ स्वाभाविक है और प्रसंग की सक्रियता बनाए रखती है।
- source_word: ἄγγελος Κυρίου
  choice: प्रभु के दूत
  rationale: इस कथात्मक प्रसंग में ἄγγελος अलौकिक दूत को दर्शाता है। Κυρίου का अनुवाद ‘प्रभु’ किया गया है; यूनानी पाठ में यहाँ स्पष्ट रूप से इब्रानी परमेश्वर-नाम नहीं है।
- source_word: κορυφῆς
  choice: सिर की चोटी
  rationale: व्यक्ति के सिर के संदर्भ में κορυφή सिर के सबसे ऊपरी भाग को सूचित करता है। ‘सिर की चोटी’ आधुनिक हिंदी में स्पष्ट और शारीरिक रूप से विशिष्ट है।
- source_word: βαστάσας τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: उसे सिर के बालों से उठाकर
  rationale: वाक्यांश दूत द्वारा उसे सिर के बालों से थामकर उठाने और ले जाने का चित्र देता है। ‘उठाकर’ आगे बाबुल में रखे जाने की गति से स्वाभाविक रूप से जुड़ता है।
- source_word: ἔθηκεν
  choice: रख दिया
  rationale: यह स्थान विशेष पर किसी को रख देने की क्रिया है। ‘रख दिया’ कथात्मक हिंदी में सहज है।
- source_word: ἐπάνω τοῦ λάκκου
  choice: गड्ढे के ऊपर
  rationale: ἐπάνω स्थानगत रूप से ‘ऊपर’ या ‘के ऊपर’ का अर्थ देता है। यह अनुवाद सटीक स्थिति के बारे में अनावश्यक निष्कर्ष नहीं जोड़ता।
- source_word: ῥοίζῳ
  choice: सनसनाती आवाज़
  rationale: ῥοῖζος तीव्र गति से उत्पन्न सनसनाहट या सरसराती/घूमती ध्वनि को दर्शाता है। ‘सनसनाती आवाज़’ सामान्य पाठक के लिए जीवंत और स्पष्ट है।
theological_decisions:
- issue: ἄγγελος Κυρίου में Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: उपलब्ध यूनानी साक्ष्य में Κυρίου है, कोई स्पष्ट इब्रानी परमेश्वर-नाम नहीं। इसलिए ‘प्रभु’ स्रोत के अधिक निकट है और परमेश्वर-नाम को अनावश्यक रूप से आरोपित नहीं करता।
- issue: उपलब्ध यूनानी पाठ का अधूरा अंत
  choice: अधूरे अंश को दीर्घविराम और पादटिप्पणी द्वारा स्पष्ट करना
  alternative: अन्य संस्करणों या प्रसंग से संभावित शब्द जोड़कर वाक्य पूरा करना
  rationale: दिया गया स्रोत ἐν τῷ ῥοίζῳ τοῦ पर टूट जाता है। ‘उस ... की सनसनाती आवाज़’ यूनानी शब्द-क्रम को हिंदी में समझने योग्य ढंग से प्रतिबिंबित करता है, जबकि दीर्घविराम अनुपस्थित पद को छिपाने के बजाय स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रभु के दूत’, ‘सिर की चोटी’ और ‘गड्ढे के ऊपर’ स्रोत की ठोस कथात्मक छवि बनाए रखते हैं। अंतिम खंड में दीर्घविराम जानबूझकर रखा गया है, ताकि स्रोत की अपूर्णता छिपे नहीं।
