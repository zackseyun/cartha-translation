  text: और प्रभु के दूत ने उसके सिर की चोटी से उसे पकड़ लिया और उसके सिर के बालों से उसे ले जाकर बाबुल में गड्ढे के ऊपर रख दिया, उस ... की सनसनाती आवाज़ में।[a]
