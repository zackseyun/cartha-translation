translation:
  language: hi
  text: “पर आप, हे राजा, मुझे अधिकार दें, और मैं तलवार या लाठी के बिना ही उस अजगर को मार डालूँगा।” राजा ने कहा, “मैं तुम्हें यह अधिकार देता हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं तुम्हें देता हूँ”; आशय है कि राजा दानिय्येल को माँगा हुआ अधिकार देता है।
    reason: यूनानी उत्तर में कर्म व्यक्त नहीं है, बल्कि पिछले वाक्य से समझा जाता है।
lexical_decisions:
- source_word: σὺ δέ, βασιλεῦ
  choice: पर आप, हे राजा
  rationale: δέ के संक्रमण अथवा विरोध और स्पष्ट σὺ के बलाघात—दोनों को रखा गया है; βασιλεῦ का संबोधन भी सीधे व्यक्त होता है।
- source_word: δός μοι ἐξουσίαν
  choice: मुझे अधिकार दें
  rationale: ἐξουσία यहाँ राजा द्वारा दिया गया वैध अधिकार या अनुमति है; ‘अधिकार’ इस आधिकारिक भाव को ‘शक्ति’ से अधिक ठीक व्यक्त करता है।
- source_word: ἀποκτενῶ τὸν δράκοντα
  choice: उस अजगर को मार डालूँगा
  rationale: ἀποκτενῶ का सीधा अर्थ मार डालना है। δράκων के लिए ‘अजगर’ आधुनिक हिन्दी में बड़े सर्पाकार प्राणी का स्वाभाविक और कथा-संगत नाम है।
- source_word: ἄνευ μαχαίρας καὶ ῥάβδου
  choice: तलवार या लाठी के बिना ही
  rationale: ἄνευ दोनों साधनों का निषेध करता है। μαχαίρα के लिए ‘तलवार’ और ῥάβδος के व्यापक दंड/लाठी अर्थ के लिए ‘लाठी’ चुना गया है; ‘या’ हिन्दी में ‘इनमें से किसी का भी उपयोग किए बिना’ का आशय स्पष्ट करता है।
- source_word: Δίδωμί σοι
  choice: मैं तुम्हें यह अधिकार देता हूँ
  rationale: यूनानी उत्तर में कर्म निहित है और पहले माँगे गए ἐξουσίαν की ओर संकेत करता है। स्वाभाविक हिन्दी के लिए उस निहित कर्म को स्पष्ट किया गया है।
