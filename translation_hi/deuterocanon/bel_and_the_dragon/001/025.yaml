    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσω
  choice: मैं ... दण्डवत् करूँगा
  rationale: यह क्रिया श्रद्धापूर्वक झुकने या उपासना करने, दोनों का भाव व्यक्त कर सकती है। ‘दण्डवत् करूँगा’ शारीरिक विनय और भक्तिपूर्ण आदर को बनाए रखता है, जबकि प्रसंग में उपासना का अर्थ स्पष्ट रहता है।
- source_word: Κυρίῳ τῷ θεῷ μου
  choice: प्रभु, अपने परमेश्वर को
  rationale: संयुक्त दत्तिव पद क्रिया के लक्ष्य को बताता है। हिन्दी में ‘प्रभु, अपने परमेश्वर को’ स्वाभाविक ढंग से ‘the Lord my God’ की समानाधिकरणीय रचना को सुरक्षित रखता है।
- source_word: θεὸς ζῶν
  choice: जीवित परमेश्वर
  rationale: विधेय रूप में आया यह पद मूर्तियों के विपरीत उस परमेश्वर पर बल देता है जो वास्तव में जीवित है। मानक बाइबलीय हिन्दी में ‘जीवित परमेश्वर’ स्वाभाविक और सटीक है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι दानिय्येल के दण्डवत् करने का कारण प्रस्तुत करता है; ‘क्योंकि’ उसके कारणात्मक अर्थ को स्पष्ट रखता है।
- source_word: οὗτός
  choice: वही
  rationale: संकेतवाचक सर्वनाम में विरोधात्मक और विशिष्ट बल है—अन्य कथित देवताओं के विपरीत प्रभु ही जीवित परमेश्वर हैं। ‘वही’ इस बल को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस परमेश्वर-संबंधी स्वीकारोक्ति में ‘प्रभु’ स्रोत के धार्मिक प्रयोग और प्रचलित हिन्दी बाइबलीय भाषा, दोनों के अनुरूप है।
- issue: προσκυνέω में शारीरिक झुकाव और उपासना का संबंध
  choice: दण्डवत् करूँगा
  alternative: आराधना करूँगा
  rationale: यूनानी क्रिया दोनों अर्थ धारण कर सकती है। मुख्य पाठ में ठोस क्रिया को रखा गया है और पादटिप्पणी में ‘आराधना’ का वैध विकल्प दिया गया है, ताकि वास्तविक अर्थ-व्याप्ति बनी रहे।
- issue: οὗτός के विशिष्ट बल का निर्वाह
  choice: वही जीवित परमेश्वर है
  alternative: वह जीवित परमेश्वर है
  rationale: ‘वही’ इस प्रसंग में सच्चे और जीवित परमेश्वर का प्रतिमाओं से निहित विरोध अधिक स्पष्ट रूप से व्यक्त करता है, बिना अतिरिक्त सिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट बाइबलीय शैली अपनाई गई है। ‘दण्डवत्’ सामान्य धार्मिक हिन्दी में समझा जाने वाला शब्द है और यूनानी क्रिया के शारीरिक तथा भक्तिपूर्ण दोनों आयामों को सुरक्षित रखता है।
