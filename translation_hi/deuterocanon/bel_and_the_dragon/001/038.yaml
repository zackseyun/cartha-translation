  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/038.yaml
  text: Take the meal that God has sent you. And Daniel said[a], “For you have remembered me, O God, and have not forsaken those who love you.”
translation:
  language: hi
  text: परमेश्वर ने तेरे लिए जो उत्तम भोजन[a] भेजा है, उसे ले। तब दानियेल ने कहा, “हे परमेश्वर, तूने तो मुझे स्मरण किया है और तुझसे प्रेम करनेवालों को नहीं छोड़ा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सबसे अच्छा भाग’ अथवा ‘चुना हुआ भोजन’; यूनानी पद उत्तम भोजन या मुख्य भोजन को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβε
  choice: ले
  rationale: यह λαμβάνω का आज्ञार्थक रूप है। प्रसंग में भोजन स्वीकार करने की सीधी आज्ञा के लिए ‘ले’ सहज और स्पष्ट है।
- source_word: τὸ ἄριστον
  choice: उत्तम भोजन
  rationale: ἄριστον उत्तम या प्रमुख भोजन अथवा भोजन के श्रेष्ठ भाग को सूचित कर सकता है। प्रसंग में हबक्कूक भोजन पहुँचा रहा है, इसलिए ‘उत्तम भोजन’ अर्थ और उसकी गुणवत्ता—दोनों को स्वाभाविक रूप से व्यक्त करता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἀπέστειλέν
  choice: भेजा है
  rationale: अतीत में पूरी हुई क्रिया का परिणाम वर्तमान में उपस्थित है—भोजन अब दानियेल के पास पहुँचा है—इसलिए हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: θεός के लिए आधुनिक हिन्दी बाइबलीय भाषा में यह मानक, गरिमापूर्ण और सर्वसुलभ शब्द है।
- source_word: Ἐμνήσθης
  choice: तूने तो मुझे स्मरण किया है
  rationale: क्रिया का अर्थ याद रखना या कृपापूर्वक ध्यान देना है। ‘स्मरण किया है’ उसके प्रार्थनामय स्वर को बनाए रखता है, और ‘तो’ γάρ के व्याख्यात्मक तथा भावात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγκατέλιπες
  choice: नहीं छोड़ा
  rationale: ἐγκαταλείπω का अर्थ त्याग देना या असहाय छोड़ देना है। ‘नहीं छोड़ा’ सामान्य आधुनिक हिन्दी में प्रबल होने के साथ सहज भी है।
- source_word: τοὺς ἀγαπῶντάς
  choice: तुझसे प्रेम करनेवालों
  rationale: कृदन्त का कर्म यूनानी में प्रसंग से समझा जाता है। दानियेल सीधे परमेश्वर को संबोधित कर रहा है, इसलिए हिन्दी में आवश्यक कर्म को ‘तुझसे’ के रूप में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘प्रेम करनेवालों’ के निहित कर्म को स्पष्ट करना
  choice: तुझसे प्रेम करनेवालों
  alternative: परमेश्वर से प्रेम करनेवालों
  rationale: सीधे संबोधन ‘हे परमेश्वर’ के कारण निहित कर्म स्वाभाविक रूप से संबोधित परमेश्वर ही है। ‘तुझसे’ जोड़ना हिन्दी व्याकरण और स्पष्टता की आवश्यकता है, कोई धर्मसैद्धांतिक विस्तार नहीं।
- issue: γάρ का हिन्दी में संबंध और बल
  choice: तूने तो मुझे स्मरण किया है
  alternative: क्योंकि तूने मुझे स्मरण किया है
  rationale: यह कथन पिछली आज्ञा के प्रति दानियेल की भावपूर्ण प्रतिक्रिया है। हिन्दी में वाक्य के आरम्भ में ‘क्योंकि’ अधूरा या असहज लग सकता है; ‘तो’ कारणसूचक/व्याख्यात्मक संबंध और कृतज्ञ आश्चर्य दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर को सीधे संबोधन में एकवचन आत्मीय ‘तू/तुझसे’ प्रयुक्त है, जो प्रार्थना के निकट और श्रद्धापूर्ण स्वर के अनुकूल है। यूनानी वाक्यक्रम को ज्यों-का-त्यों रखने के बजाय हिन्दी के स्वाभाविक संबंधवाचक क्रम में ढाला गया है।
