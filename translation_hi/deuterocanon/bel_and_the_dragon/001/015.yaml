- source_word: κατὰ τὸ ἔθος αὐτῶν
  choice: अपनी रीति के अनुसार
  rationale: ἔθος प्रचलित रीति या customary practice को दर्शाता है; यह रूप स्रोत के निकट और हिन्दी में सहज है।
- source_word: καὶ αἱ γυναῖκες
  choice: और स्त्रियाँ भी
  rationale: γυναῖκες का अर्थ ‘स्त्रियाँ’ या ‘पत्नियाँ’ दोनों हो सकता है। उपलब्ध वाक्यांश संबंध को स्पष्ट नहीं करता, इसलिए अधिक निरपेक्ष ‘स्त्रियाँ’ रखा गया है; ‘भी’ καί के समावेशी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
