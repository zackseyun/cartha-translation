  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/021.yaml
  text: Then the king became angry and arrested the priests and their wives and children[b][a], and they showed him the secret doors through which they used to go in and consume what was on the table.
translation:
  language: hi
  text: तब राजा क्रोधित हुआ और उसने याजकों तथा उनकी पत्नियों और बच्चों को गिरफ़्तार कर लिया। उन्होंने उसे वे गुप्त द्वार[a] दिखाए, जिनसे वे भीतर जाया करते थे और मेज़ पर रखी वस्तुएँ खा जाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छिपे हुए द्वार।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: क्रोधित हुआ
  rationale: यह यूनानी कृदन्त राजा के क्रोध की आरम्भिक अवस्था को बताता है; ‘क्रोधित हुआ’ आधुनिक, गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: συνέλαβεν
  choice: गिरफ़्तार कर लिया
  rationale: धोखे का पता चलने के बाद राजा की दण्डात्मक कार्रवाई के प्रसंग में यह औपचारिक रूप से हिरासत में लेने का भाव व्यक्त करता है।
- source_word: τοὺς ἱερεῖς
  choice: याजकों
  rationale: ἱερεύς का मानक धार्मिक पदनाम ‘याजक’ है; प्रसंग से स्पष्ट है कि ये बेल के याजक हैं।
- source_word: τὰς γυναῖκας καὶ τὰ τέκνα αὐτῶν
  choice: उनकी पत्नियों और बच्चों
  rationale: परिवार-सूची में γυναῖκας का सम्बन्धसूचक अर्थ ‘पत्नियाँ’ अधिक सम्भावित है, जबकि τέκνα सभी बच्चों को समेटता है।
- source_word: τὰς κρυπτὰς θύρας
  choice: वे गुप्त द्वार
  rationale: यह ऐसे छिपे हुए प्रवेश-द्वारों को सूचित करता है जिनका उपयोग छल के लिए होता था; ‘गुप्त द्वार’ ठोस और सहज अभिव्यक्ति है।
- source_word: διʼ ὧν εἰσεπορεύοντο
  choice: जिनसे वे भीतर जाया करते थे
  rationale: अपूर्ण भूतकाल बार-बार की जाने वाली क्रिया दर्शाता है; ‘जाया करते थे’ उस अभ्यासगत भाव को सुरक्षित रखता है।
- source_word: ἐδαπάνων
  choice: खा जाते थे
  rationale: δαπανάω का मूल भाव ‘खपा देना/समाप्त कर देना’ है; मेज़ पर रखी वस्तुओं के प्रसंग में ‘खा जाते थे’ स्पष्ट, स्वाभाविक और पुनरावृत्त क्रिया के अनुकूल है।
- source_word: τὰ ἐπὶ τῇ τραπέζῃ
  choice: मेज़ पर रखी वस्तुएँ
  rationale: यूनानी पाठ सामान्य रूप से ‘मेज़ पर की वस्तुएँ’ कहता है; ‘भोजन’ जोड़ने के बजाय सामान्यता बनाए रखी गई है।
theological_decisions:
- issue: परिवार-सूची में γυναῖκας का अर्थ
  choice: पत्नियों
  alternative: स्त्रियों
  rationale: याजकों के साथ उनके बच्चों का उल्लेख पारिवारिक सम्बन्ध की ओर संकेत करता है; ‘पत्नियाँ’ इसी सम्भावित अर्थ को स्पष्ट करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
- issue: συνέλαβεν में राजा की कार्रवाई का स्वरूप
  choice: गिरफ़्तार कर लिया
  alternative: पकड़ लिया
  rationale: धोखे के उजागर होने के बाद राजा द्वारा की गई न्यायिक-दण्डात्मक कार्रवाई को आधुनिक हिन्दी में ‘गिरफ़्तार’ अधिक सटीक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली रखी गई है। अभ्यासगत यूनानी अपूर्ण भूतकाल को ‘जाया करते थे’ और ‘खा जाते थे’ से व्यक्त किया गया है। अंग्रेज़ी परामर्श-पाठ में दिए गए दूसरे पादटिप्पणी-चिह्न का स्थान मूल वाक्य-संरचना से मेल नहीं खाता और उसका पाठ मुख्य अनुवाद के समानार्थी है, इसलिए अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
