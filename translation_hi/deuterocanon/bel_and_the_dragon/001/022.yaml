translation:
  language: hi
  text: और राजा ने उन्हें मार डाला, और उसने बेल को दानिय्येल के हवाले कर दिया[a], और उसने उसे और उसके मंदिर को नष्ट कर दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बेल को दानिय्येल के अधिकार में दे दिया।’ यूनानी पदबंध किसी को दूसरे के वश या अधिकार में सौंप देने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में बेल के लिए पुल्लिंग सर्वनाम हैं; इसलिए अनुवाद में ‘उसे और उसके मंदिर को’ है। संदर्भ में ‘बेल’ देवता के नाम के साथ उसकी प्रतिमा को भी सूचित कर सकता है।
    reason: ambiguity
lexical_decisions:
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: यह क्रिया मृत्यु का कारण बनने को स्पष्ट रूप से व्यक्त करती है। ‘मार डाला’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी वाक्य की सीधी शक्ति बनाए रखता है।
- source_word: ἔδωκεν ... ἔκδοτον
  choice: के हाथ सौंप दिया
  rationale: यह पदबंध किसी को दूसरे के अधिकार में सौंप देने का अर्थ देता है। ‘के हाथ सौंप दिया’ हिन्दी में स्वाभाविक रूप से वही भाव व्यक्त करता है।
- source_word: τὸν Βὴλ
  choice: बेल
  rationale: देवता के नाम का प्रचलित लिप्यंतरण रखा गया है।
- source_word: κατέστρεψεν
  choice: नष्ट कर दिया
  rationale: क्रिया का व्यापक अर्थ विनाश करना है और यह बेल तथा उसके मंदिर—दोनों पर समान रूप से लागू होता है।
- source_word: τὸ ἱερὸν
  choice: मंदिर
  rationale: इस संदर्भ में यह बेल से संबंधित पवित्र उपासना-स्थल या मंदिर को दर्शाता है; ‘मंदिर’ सामान्य पाठक के लिए सबसे सीधा और स्वाभाविक विकल्प है।
- source_word: αὐτὸν ... αὐτοῦ
  choice: उसे ... उसके
  rationale: हिन्दी के ये सर्वनाम यूनानी के पुल्लिंग व्याकरणिक संबंध को स्वाभाविक ढंग से बनाए रखते हैं, पर अपने आप यह तय नहीं करते कि बेल को देवता के रूप में समझा जाए या उसकी मूर्ति के रूप में।
theological_decisions:
- issue: बेल के लिए प्रयुक्त पुल्लिंग सर्वनाम को व्यक्ति-सूचक मानना या मूर्ति-सूचक
  choice: ‘उसे और उसके मंदिर को’ रखा गया, जिससे यूनानी का व्याकरणिक संबंध सुरक्षित रहता है और हिन्दी में संदर्भगत अस्पष्टता भी बनी रहती है।
  alternative: ‘उसकी मूर्ति और उसके मंदिर को’ कहकर संदर्भ को स्पष्ट कर देना।
  rationale: यूनानी पाठ केवल पुल्लिंग αὐτόν का प्रयोग करता है; वह यहाँ अलग से ‘मूर्ति’ नहीं कहता। इसलिए ‘मूर्ति’ जोड़ना एक व्याख्यात्मक निर्णय होता। हिन्दी ‘उसे’ मूल पाठ की वास्तविक अस्पष्टता और धार्मिक तनाव दोनों को बिना अनावश्यक समाधान के बनाए रखता है।
- issue: κατέστρεψεν का कर्ता
  choice: स्पष्टता के लिए ‘दानिय्येल ने’ कहा गया।
  alternative: सिर्फ ‘उसने’ रखकर यूनानी सर्वनामिक प्रवाह का अधिक औपचारिक अनुसरण करना।
  rationale: पूर्ववर्ती दो खंडों में राजा कर्ता है, पर बेल दानिय्येल को सौंपे जाने के बाद विनाश करने वाला स्वाभाविक रूप से दानिय्येल है। हिन्दी में केवल ‘उसने’ राजा की ओर अस्पष्ट संकेत कर सकता था; नाम दोहराना अर्थ बदले बिना कर्ता स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘के हाथ सौंप दिया’ तथा ‘नष्ट कर दिया’ सामान्य हिन्दी में सहज हैं। अंतिम खंड में ‘दानिय्येल ने’ जोड़कर हिन्दी की संभावित कर्ता-अस्पष्टता दूर की गई है, जबकि बेल और उसकी मूर्ति के बीच मूल पाठ की अस्पष्टता को सर्वनामों में सुरक्षित रखा गया है।
