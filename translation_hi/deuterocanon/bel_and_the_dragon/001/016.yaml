translation:
  language: hi
  text: और उनके बच्चे भी; उन्होंने सब कुछ खा डाला और सब पी गए। फिर राजा सुबह बहुत तड़के उठा[a], और दानिय्येल उसके साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में सुबह जल्दी उठने का विचार दोहरे ढंग से व्यक्त हुआ है: शाब्दिक रूप से, “जल्दी उठा, सुबह।”'
    reason: मूल भाषा की बलाघाती पुनरुक्ति को स्पष्ट करना।
lexical_decisions:
- source_word: τὰ τέκνα αὐτῶν
  choice: उनके बच्चे भी
  rationale: τέκνα का व्यापक अर्थ ‘बच्चे’ है, केवल ‘पुत्र’ नहीं; καί सूची में इनके भी सम्मिलित होने का भाव देता है।
- source_word: κατέφαγον πάντα
  choice: उन्होंने सब कुछ खा डाला
  rationale: κατέφαγον साधारण खाने से अधिक, पूरी तरह खा जाने का बल रखता है; ‘खा डाला’ इस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξέπιον
  choice: सब पी गए
  rationale: क्रिया का अर्थ पूरा पी जाना है; प्रसंग से पी हुई वस्तुओं का बोध हो जाता है, इसलिए अलग कर्म जोड़ना आवश्यक नहीं।
- source_word: ὤρθρισεν πρωί
  choice: सुबह बहुत तड़के उठा
  rationale: ὤρθρισεν में जल्दी उठने और πρωί में सुबह का भाव है; यह अभिव्यक्ति यूनानी की दोहरी कालगत पुष्टि को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: Δανιὴλ μετʼ αὐτοῦ
  choice: दानिय्येल भी उसके साथ था
  rationale: मूल में यह संक्षिप्त, क्रियारहित पदबंध है; हिन्दी में ‘था’ जोड़ना आवश्यक और स्वाभाविक है, जबकि ‘भी’ साथ होने के समानांतर भाव को स्पष्ट करता है।
