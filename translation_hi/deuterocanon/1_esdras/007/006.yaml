base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/006.yaml
  text: And the sons of Israel[a], and the priests, and the Levites, and the rest from the captivity who had been brought back[b], did according to what is in the book of Moses.
translation:
  language: hi
  text: और इस्राएलियों, याजकों, लेवियों और बँधुआई से वापस लाए गए शेष लोगों[a] ने मूसा की पुस्तक में लिखी बातों के अनुसार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बँधुआई’ का अर्थ यहाँ निर्वासन है; ‘वापस लाए गए’ यूनानी के निष्क्रिय रूप को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएली
  rationale: यूनानी का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में जातीय-समुदायवाचक अर्थ के लिए ‘इस्राएली’ अधिक स्वाभाविक और समावेशी है।
- source_word: οἱ λοιποί
  choice: शेष लोग
  rationale: यह पद पहले गिनाए गए याजकों और लेवियों के अतिरिक्त बाकी समुदाय को सूचित करता है; ‘शेष लोग’ स्पष्ट और संक्षिप्त है।
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: बँधुआई से
  rationale: αἰχμαλωσία निर्वासन अथवा बंदी-दशा को दर्शाता है। ‘बँधुआई’ बाइबलीय संदर्भ बनाए रखता है, जबकि ‘से’ पुनर्स्थापन की पृष्ठभूमि स्पष्ट करता है।
- source_word: οἱ προσενεχθέντες
  choice: वापस लाए गए
  rationale: निष्क्रिय कृदंत में किसी के द्वारा लाए जाने का भाव है। ‘वापस लाए गए’ निर्वासन से पुनर्स्थापन का संदर्भ और मूल की निष्क्रियता दोनों सुरक्षित रखता है।
- source_word: ἀκολούθως τοῖς ἐν τῇ Μωσέως βίβλῳ
  choice: मूसा की पुस्तक में लिखी बातों के अनुसार
  rationale: वाक्यांश लिखित मूसीय निर्देशों के अनुरूप कार्य करने को कहता है। यूनानी में ‘व्यवस्था’ नहीं बल्कि ‘पुस्तक’ है, इसलिए उसे अधिक विशिष्ट नहीं बनाया गया।
theological_decisions:
- issue: οἱ προσενεχθέντες में लौटने की सक्रियता अथवा वापस लाए जाने की निष्क्रियता
  choice: वापस लाए गए
  alternative: जो लौट आए थे
  rationale: यूनानी कृदंत व्याकरणतः निष्क्रिय है; इसलिए अनिर्दिष्ट कर्ता के साथ निष्क्रिय भाव रखा गया है, पर यह नहीं बताया गया कि उन्हें किसने वापस लाया।
- issue: मूसा की पुस्तक का स्वरूप
  choice: मूसा की पुस्तक में लिखी बातों के अनुसार
  alternative: मूसा की व्यवस्था के अनुसार
  rationale: मूल पाठ βιβλίον (‘पुस्तक’) कहता है और सामग्री को अलग से ‘व्यवस्था’ नहीं कहता; अतः अनावश्यक धर्मवैचारिक विशिष्टीकरण से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। सूची की पुनरावृत्त संयोजक संरचना को हिन्दी में स्वाभाविक बनाया गया है। ‘इस्राएल के पुत्र’ के स्थान पर ‘इस्राएली’ और ‘जो पुस्तक में हैं’ के स्थान पर ‘पुस्तक में लिखी बातें’ अपनाया गया है।
