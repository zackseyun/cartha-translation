  yaml_path: translation/deuterocanon/1_esdras/007/007.yaml
  text: And they offered for the dedication of the house of the Lord one hundred bulls, two hundred rams, and four hundred lambs,
translation:
  language: hi
  text: और उन्होंने प्रभु के मंदिर के समर्पण के लिए एक सौ बैल, दो सौ मेढ़े और चार सौ मेमने चढ़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκαν
  choice: चढ़ाए
  rationale: बलि-पशुओं को धार्मिक भेंट के रूप में अर्पित करने का भाव स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐγκαινισμὸν
  choice: समर्पण
  rationale: नए अथवा पुनर्निर्मित पवित्र भवन को विधिवत अर्पित किए जाने के अवसर को दर्शाता है।
- source_word: ἱεροῦ
  choice: भवन
  rationale: संदर्भ में प्रभु के पवित्र भवन का संकेत है; यह उपलब्ध परामर्श-पाठ के ‘house’ को बनाए रखता है, यद्यपि यूनानी शब्द मंदिर/पवित्र परिसर भी सूचित कर सकता है।
- source_word: ταύρους
  choice: बैल
  rationale: बलि के लिए प्रस्तुत नर गोवंश का सामान्य और सुबोध हिन्दी नाम।
- source_word: κριοὺς
  choice: मेढ़े
  rationale: वयस्क नर भेड़ों के लिए सटीक हिन्दी शब्द।
- source_word: ἄρνας
  choice: मेमने
  rationale: कम आयु की भेड़ों के लिए स्वाभाविक हिन्दी शब्द; यूनानी रूप यहाँ संख्या सहित बलि-पशुओं को दर्शाता है।
