  text: And they sacrificed the Passover for all the sons of the captivity[a], and for their brothers the priests[b], and for themselves.
translation:
  language: hi
  text: और उन्होंने बंधुआई के सभी पुत्रों[a], अपने भाई याजकों, और अपने लिए फसह[b] का बलिदान चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभी निर्वासितों’। यूनानी में शाब्दिक रूप से ‘बंधुआई के सभी पुत्रों’ है; यह निर्वासन से लौटे पूरे समुदाय के लिए एक सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘फसह’ फसह के बलिदान को सूचित करता है और उसके अनुष्ठान से भी संबद्ध है; यूनानी पाठ स्पष्ट रूप से ‘मेमना’ नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυσαν
  choice: बलि चढ़ाई
  rationale: θύω बलि के लिए पशु वध करने और उसे अर्पित करने की धार्मिक क्रिया बताता है। ‘बलि चढ़ाई’ आधुनिक हिन्दी में स्वाभाविक है और केवल ‘मनाया’ की अपेक्षा मूल क्रिया को अधिक ठीक प्रकार से व्यक्त करता है।
- source_word: τὸ πάσχα
  choice: फसह की बलि
  rationale: πάσχα फसह के पर्व अथवा उसके बलिदान को सूचित कर सकता है। यहाँ यह ἔθυσαν का कर्म है, इसलिए बलिदान का अर्थ प्रमुख है; फिर भी ‘मेमना’ नहीं जोड़ा गया, क्योंकि यूनानी पाठ ऐसा स्पष्ट नहीं करता।
- source_word: πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας
  choice: बंधुआई के सभी पुत्रों
  rationale: यह मूल यूनानी के सामुदायिक और पारिवारिक मुहावरे को बनाए रखता है। यह निर्वासन से लौटे समुदाय के लोगों को सामूहिक रूप से सूचित करता है; अर्थ स्पष्ट करने के लिए पाद-टिप्पणी दी गई है।
- source_word: ἀδελφοῖς αὐτῶν τοῖς ἱερεῦσιν
  choice: अपने भाई याजकों
  rationale: यह ‘उनके भाइयों, अर्थात् याजकों’ के आशय को संक्षिप्त और स्वाभाविक हिन्दी में रखता है तथा भाईचारे की सामुदायिक भाषा को बनाए रखता है।
- source_word: ἑαυτοῖς
  choice: अपने लिए
  rationale: यह आत्मवाचक सम्प्रदान का सीधा और स्वाभाविक हिन्दी अनुवाद है तथा लाभार्थियों की क्रमिक सूची को बनाए रखता है।
theological_decisions:
- issue: τοῖς υἱοῖς और ἀδελφοῖς में लिंग-सूचक सामुदायिक भाषा
  choice: मुख्य पाठ में ‘पुत्रों’ और ‘भाई’ को बनाए रखा गया
  alternative: ‘निर्वासितों’ और ‘साथियों’ अथवा ‘समुदाय के लोगों’ का प्रयोग
  rationale: मूल पाठ की पुरुषवाचक पारिवारिक भाषा को बिना कारण लिंग-निरपेक्ष नहीं बनाया गया। साथ ही पाद-टिप्पणी स्पष्ट करती है कि ‘बंधुआई के पुत्र’ लौटे हुए निर्वासित समुदाय के लिए एक सामूहिक अभिव्यक्ति है।
- issue: τὸ πάσχα का पर्व और बलिदान के बीच अर्थ-संबंध
  choice: ‘फसह की बलि’
  alternative: ‘फसह’ या ‘फसह का मेमना’
  rationale: संदर्भ में बलिदान का अर्थ सक्रिय है, क्योंकि क्रिया θύω प्रयुक्त हुई है। ‘मेमना’ कहना मूल पाठ से अधिक विशिष्ट होता, जबकि केवल ‘फसह’ हिन्दी में बलिदानी क्रिया को अस्पष्ट कर सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘बंधुआई के पुत्र’ जानबूझकर औपचारिक और स्रोत-सन्निकट है; उसकी संभावित कठिनाई पाद-टिप्पणी से स्पष्ट की गई है। ‘अपने भाई याजकों’ में याजकों को उन्हीं भाइयों के रूप में समझा गया है, न कि एक अलग समूह के रूप में।
