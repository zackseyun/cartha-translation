base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/011.yaml
  text: and all the sons of the captivity[a], because they had purified themselves. For all the Levites together had purified themselves, all of them[b],
translation:
  language: hi
  text: और बंधुआई की सारी संतान[a], क्योंकि उन्होंने अपने आप को शुद्ध किया था। क्योंकि लेवियों ने—उन सभी ने मिलकर—अपने आप को शुद्ध किया था[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बंधुआई के पुत्र”; अधिक सहज रूप में, “बंधुआई में गए लोग।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी पाठ अर्थ की दृष्टि से खंडित है और वाक्य आगे जारी होता प्रतीत होता है। “अपने आप को शुद्ध किया था” का अनुवाद “शुद्ध किए गए थे” भी हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ τῆς αἰχμαλωσίας
  choice: बंधुआई की सारी संतान
  rationale: यह यूनानी मुहावरे की सामुदायिक पहचान को बनाए रखता है। अधिक सहज ‘बंधुआई में गए लोग’ संभव है, पर उससे ‘संतान’ का स्पष्ट बिंब खो जाता है; ‘लौटे हुए’ मूल में प्रत्यक्ष नहीं है।
- source_word: ἡγνίσθησαν
  choice: अपने आप को शुद्ध किया था
  rationale: ἁγνίζω यहाँ उपासना के लिए विधिपूर्वक शुद्ध होने को दर्शाता है। मध्यवाच्य/कर्मवाच्य रूप की अस्पष्टता को मुख्य पाठ में स्वाभाविक आत्मवाचक रूप से व्यक्त किया गया है और विकल्प पादटिप्पणी में रखा गया है।
- source_word: λευεῖται
  choice: लेवियों
  rationale: इस समुदाय के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और सहज नाम।
- source_word: ἅμα πάντες
  choice: उन सभी ने मिलकर
  rationale: यह वाक्यांश लेवियों की सामूहिकता और समग्रता दोनों व्यक्त करता है तथा यूनानी पदक्रम के जोर को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: विधिपूर्वक शुद्ध होने की भाषा
  choice: अपने आप को शुद्ध किया था
  alternative: शुद्ध किए गए थे
  rationale: प्रसंग उपासना की तैयारी के लिए विधिपूर्वक शुद्ध होने का है। आत्मवाचक अनुवाद जानबूझकर की गई तैयारी को व्यक्त करता है, जबकि यूनानी रूप के संभव कर्मवाच्य अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: खंडित वाक्य का संबंध
  choice: दोनों ὅτι उपवाक्यों को ‘क्योंकि’ से आरम्भ करके अपूर्णता बनाए रखना
  alternative: उन्हें पूर्ण और अधिक प्रवाहपूर्ण वाक्य में पुनर्गठित करना
  rationale: प्राप्त यूनानी पाठ इस स्थान पर अर्थ की दृष्टि से खंडित है और आगे के कथन से जुड़ता प्रतीत होता है। इसे चुपचाप पूर्ण करना पाठगत तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है, पर ‘बंधुआई की संतान’ द्वारा मूल का पारंपरिक सामुदायिक मुहावरा सुरक्षित है। विराम-चिह्न और अंतिम अल्पविराम जानबूझकर वाक्य की खंडित, आगे जुड़ने वाली प्रकृति दर्शाते हैं।
