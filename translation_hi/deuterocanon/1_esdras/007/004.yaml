base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/004.yaml
  text: And they completed these things by the decree of the Lord[a], the God of Israel, and with the approval of Cyrus and Darius and Artaxerxes[b], kings of the Persians.
translation:
  language: hi
  text: और उन्होंने इन बातों को प्रभु, इस्राएल के परमेश्वर की आज्ञा से और फ़ारसियों के राजा कुस्रू, दारा और अर्तक्षत्र की सहमति से पूरा किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सहमति” का अनुवाद “अनुमोदन,” “निर्णय” या “अभिप्राय” भी हो सकता है। यूनानी में “राजा” एकवचन है और रूपतः अर्तक्षत्र के साथ जुड़ता है, यद्यपि यह पद तीनों शासकों को फ़ारसी राजा भी बता सकता है।
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: συνετέλεσαν
  choice: पूरे किए
  rationale: क्रिया किसी कार्य को उसके अपेक्षित अंत तक पहुँचाने का भाव देती है; ‘पूरे किए’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ταῦτα
  choice: ये सब काम
  rationale: यूनानी बहुवचन संकेतवाचक को बनाए रखते हुए प्रसंग के कार्यों की ओर स्वाभाविक ढंग से संकेत करता है; ‘काम’ प्रसंग-सापेक्ष स्पष्टता देता है।
- source_word: διὰ προτάγματος
  choice: आज्ञा के अनुसार
  rationale: πρόταγμα औपचारिक आदेश या राजाज्ञा को सूचित करता है। प्रभु के संबंध में ‘आज्ञा’ सहज है और διά का मानक/कारणात्मक भाव ‘के अनुसार’ से व्यक्त होता है।
- source_word: τοῦ κυρίου θεοῦ Ἰσραήλ
  choice: इस्राएल के परमेश्वर, प्रभु की
  rationale: ‘प्रभु’ और ‘इस्राएल के परमेश्वर’ दोनों पद स्पष्ट रखे गए हैं और हिन्दी में संबंध स्वाभाविक बनाया गया है।
- source_word: μετὰ τῆς γνώμης
  choice: सहमति से
  rationale: γνώμη राय, निश्चय, अभिप्राय या सहमति का अर्थ दे सकता है। प्रशासनिक प्रसंग में ‘सहमति’ राजकीय अनुमोदन को स्वाभाविक रूप से व्यक्त करती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: Κύρου καὶ Δαρείου καὶ Ἀρταξέρξου
  choice: कुस्रू, दारा और अर्तक्षत्र
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
- source_word: βασιλέως Περσῶν
  choice: फ़ारसियों के राजा
  rationale: यूनानी में ‘राजा’ एकवचन और ‘फ़ारसियों के’ बहुवचन है। इसे एकवचन रखकर मूल की व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय आज्ञा और साम्राज्यिक सहमति का संबंध
  choice: कार्य की पूर्णता को प्रभु की आज्ञा और फ़ारसी शासकों की सहमति—दोनों के साथ जोड़ा गया है।
  alternative: राजकीय सहमति को केवल प्रभु की आज्ञा के अधीन उसकी व्याख्या माना जा सकता है।
  rationale: यूनानी दो पदबंधों को καὶ से समन्वित करता है; अनुवाद दोनों को बनाए रखता है और उनके संबंध को आवश्यकता से अधिक परिभाषित नहीं करता।
- issue: ‘फ़ारसियों के राजा’ पद का संबंध
  choice: एकवचन पद को मूल के अनुसार रखा गया है, जिससे वह रूपतः अंतिम नाम अर्तक्षत्र से जुड़ सकता है।
  alternative: पद को तीनों नामों पर सामूहिक रूप से लागू मानकर ‘फ़ारसियों के राजा’ का बहुवचनार्थ समझा जा सकता है।
  rationale: मूल में βασιλέως एकवचन है, यद्यपि अर्थ की दृष्टि से तीनों शासक फ़ारसी राजा हैं; मुख्य पाठ और पादटिप्पणी इस तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। मूल यूनानी की एकवचन उपाधि और γνώμη की अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया है।
