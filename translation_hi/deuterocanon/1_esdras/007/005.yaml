base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/005.yaml
  text: The house was completed by the twenty-third day of the month Adar[b][a], in the sixth year of King Darius.
translation:
  language: hi
  text: वह भवन राजा दारा के शासन के छठे वर्ष में अदार महीने के तेईसवें दिन तक पूरा हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भवन” से आशय मंदिर है; यूनानी पाठ में केवल “भवन” है।
    reason: cross_reference
lexical_decisions:
- source_word: συνετελέσθη
  choice: पूरा हो गया
  rationale: यह συντελέω का एओरिस्ट कर्मवाच्य रूप है और भवन के निर्माण के पूर्ण हो जाने को व्यक्त करता है; हिंदी में यह स्वाभाविक रहते हुए कर्मवाच्य भाव सुरक्षित रखता है।
- source_word: ὁ οἶκος
  choice: वह भवन
  rationale: यूनानी में केवल ‘भवन/घर’ है। प्रसंग में इसका संकेत मंदिर की ओर है, पर अनुवाद में स्रोत की अभिव्यक्ति को बनाए रखा गया है।
- source_word: ἕως τρίτης καὶ εἰκάδος
  choice: तेईसवें दिन तक
  rationale: शाब्दिक क्रम ‘तीसरे और बीसवें तक’ अर्थात तेईसवें दिन तक है। ‘तक’ ἕως को सीधे व्यक्त करता है और इस संभावना को खुला रखता है कि पूर्णता उस दिन या उससे पहले हुई।
- source_word: μηνὸς Ἀδὰρ
  choice: अदार महीने के
  rationale: यह महीने के नाम के साथ सामान्य संबंधकारक तिथि-वाक्यांश है; Ἀδάρ का प्रचलित देवनागरी लिप्यंतरण ‘अदार’ रखा गया है।
- source_word: τοῦ ἕκτου ἔτους βασιλέως Δαρείου
  choice: राजा दारा के शासन के छठे वर्ष में
  rationale: राजकीय वर्ष की तिथि को आधुनिक हिंदी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है। Δαρεῖος के लिए हिंदी बाइबलीय नाम ‘दारा’ अपनाया गया है।
theological_decisions:
- issue: ὁ οἶκος का मंदिर-संदर्भ
  choice: मुख्य पाठ में ‘वह भवन’
  alternative: ‘मंदिर’ या ‘परमेश्वर का भवन’
  rationale: संदर्भ मंदिर का है, लेकिन यूनानी पद में केवल ὁ οἶκος है। इसलिए स्रोत से अधिक स्पष्ट धार्मिक पद मुख्य पाठ में नहीं जोड़ा गया; संदर्भ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। तिथि-वाक्य को स्वाभाविक हिंदी क्रम में रखा गया है। ‘तेईसवें दिन तक’ यूनानी ἕως की सीमा-सूचक अस्पष्टता को ‘तेईसवें दिन’ कहकर अनावश्यक रूप से निश्चित नहीं करता।
