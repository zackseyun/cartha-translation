base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/013.yaml
  text: And the sons of Israel who were from the captivity ate[a], all those who had separated themselves from the abominations of the nations of the land[b], seeking the Lord.
translation:
  language: hi
  text: और बँधुआई से आए इस्राएलियों ने खाया[a]—उन सब ने जिन्होंने देश की जातियों की घृणित प्रथाओं से अपने आपको अलग कर लिया था और प्रभु की खोज कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, उन्होंने फसह का भोजन खाया; यूनानी पाठ में कर्म नहीं दिया गया है, पर पिछले प्रसंग से वह समझ में आता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐφάγοσαν
  choice: खाया
  rationale: यूनानी क्रिया का सीधा अर्थ ‘खाया’ है। पिछले प्रसंग से फसह का भोजन समझ में आता है, पर इस पद में उसका कर्म व्यक्त नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ की अपेक्षा ‘इस्राएली’ आधुनिक हिन्दी में अधिक स्वाभाविक और समावेशी है, जबकि उसी समुदाय-सूचक अर्थ को सुरक्षित रखता है।
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: बँधुआई से आए
  rationale: यह अभिव्यक्ति बँधुआई से संबंधित या वहाँ से आए समुदाय की पहचान कराती है। ‘लौटे हुए निर्वासित’ अर्थ को अधिक स्पष्ट कर देता, पर यूनानी पदबंध में ‘लौटे’ शब्द प्रत्यक्ष नहीं है।
- source_word: χωρισθέντες
  choice: अपने आपको अलग कर लिया था
  rationale: संदर्भ में कृदंत का भाव आत्मवाचक है और अशुद्ध ठहराने वाली प्रथाओं से जानबूझकर अलग होने को दर्शाता है।
- source_word: βδελυγμάτων
  choice: घिनौने कामों
  rationale: यह चुनाव शब्द की प्रबल नैतिक और धार्मिक घृणा को साधारण आधुनिक हिन्दी में बनाए रखता है, बिना उसका आशय केवल रीति या केवल अशुद्धता तक सीमित किए।
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: देश की जातियों के
  rationale: यह निकटवर्ती गैर-इस्राएली जनसमूहों को सूचित करता है। ‘जातियाँ’ यूनानी बहुवचन की व्यापक सामुदायिक धारणा को रखता है और बाद की तकनीकी धार्मिक संज्ञा आरोपित नहीं करता।
- source_word: ζητοῦντες τὸν κύριον
  choice: प्रभु की खोज कर रहे थे
  rationale: यह जारी धार्मिक अभिमुखता को स्वाभाविक हिन्दी में व्यक्त करता है और कृदंत की निरंतरता बनाए रखता है।
theological_decisions:
- issue: क्या निहित फसह-भोजन को मुख्य पाठ में स्पष्ट किया जाए
  choice: कर्म को निहित रखते हुए केवल ‘खाया’
  alternative: ‘फसह का भोजन खाया’
  rationale: पिछला प्रसंग कर्म स्पष्ट करता है, किंतु इस पद के यूनानी पाठ में वह लिखा नहीं है। उसे टिप्पणी में स्पष्ट करना स्रोत की सीमा और पाठ की स्वाभाविक समझ—दोनों को सुरक्षित रखता है।
- issue: वाचा-संबंधी अलगाव की भाषा
  choice: ‘देश की जातियों के घिनौने कामों से अपने आपको अलग कर लिया था’
  alternative: ‘देश के लोगों की अशुद्धता से अपने आपको अलग कर लिया था’
  rationale: चुना हुआ रूप नैतिक-धार्मिक तीव्रता और स्वेच्छापूर्वक अलग होने—दोनों को बनाए रखता है, पर इसे मात्र सामाजिक अलगाव नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘इस्राएली’ ने शाब्दिक किंतु अस्वाभाविक ‘इस्राएल के पुत्र’ का सामुदायिक अर्थ सुरक्षित रखा है। ‘बँधुआई’ पारंपरिक बाइबलीय शब्दावली है, फिर भी सामान्य पाठक के लिए बोधगम्य है। वाक्य में डैश यूनानी के व्याख्यात्मक ‘उन सभी’ को स्पष्ट रूप से जोड़ता है।
