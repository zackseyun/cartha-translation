lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले कथात्मक कार्य का स्वाभाविक काल-संक्रमण है।
- source_word: Σισίννης
  choice: सिसिन्नेस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: ἔπαρχος
  choice: राज्यपाल
  rationale: यह नागरिक प्रशासनिक पद है; ‘राज्यपाल’ आधुनिक हिन्दी में स्पष्ट है और पद की ऐतिहासिक बारीकियों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: κοίλης Συρίας
  choice: कोइले-सीरिया
  rationale: यह एक औपचारिक क्षेत्रीय नाम है, इसलिए इसका शाब्दिक अर्थ करने के बजाय लिप्यंतरण किया गया है।
- source_word: Φοινίκης
  choice: फ़ोनीशिया
  rationale: स्थान-नाम का प्रचलित और आधुनिक हिन्दी पाठकों के लिए सुबोध रूप।
- source_word: Σαθραβούζανης
  choice: सथ्राबूज़ानेस
  rationale: स्रोत में प्रमाणित यूनानी रूप का निकट देवनागरी लिप्यंतरण।
- source_word: οἱ συνέταιροι
  choice: उनके सहयोगियों
  rationale: शब्द साझेदारों, साथियों या सहयोगियों को सूचित कर सकता है; ‘सहयोगी’ प्रसंग में स्वाभाविक है, जबकि ‘उनके’ समन्वित वाक्य-संरचना से निहित संबंध को स्पष्ट करता है।
- source_word: κατακολουθήσαντες
  choice: के अनुसार चलते हुए
  rationale: कृदन्त आदेशों का अनुसरण करने या उनके अनुरूप कार्य करने का भाव देता है; यह चयन उसकी कृदन्तीय कड़ी बनाए रखता है।
- source_word: τοῖς ... προσταγεῖσιν
  choice: आज्ञाओं
  rationale: बहुवचन निष्क्रिय कृदन्त राजा द्वारा दी गई बातों या आदेशों को दर्शाता है; हिन्दी में ‘आज्ञाओं’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῦ βασιλέως Δαρείου
  choice: राजा दारा की
  rationale: ‘दारा’ नाम का हिन्दी बाइबलीय रूप है और सम्बन्धकारक रचना आज्ञाओं के स्रोत को सहज ढंग से व्यक्त करती है।
