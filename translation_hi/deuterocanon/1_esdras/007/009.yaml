base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/009.yaml
  text: And the priests and the Levites stood arrayed by divisions for the works of the Lord God of Israel[a], in accordance with the book of Moses[b], and the gatekeepers at each gate.
translation:
  language: hi
  text: और याजक और लेवी विधिवत् वस्त्र पहने हुए, दलों के अनुसार[a], मूसा की पुस्तक के अनुसार[b], इस्राएल के प्रभु परमेश्वर के कार्यों के लिए खड़े हुए; और द्वारपाल अपने-अपने द्वार पर खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘गोत्रों के अनुसार’ भी हो सकता है। यहाँ संभवतः याजकों और लेवियों की सेवा के लिए व्यवस्थित टोलियाँ अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी समानांतर पाठ परमेश्वर के भवन के काम में उनके हाथ दृढ़ किए जाने पर बल देता है; यूनानी पाठ यहाँ याजकों और लेवियों की व्यवस्थित नियुक्ति को मूसा की पुस्तक के अनुसार बताता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἔστησαν
  choice: खड़े हुए
  rationale: यह मूल कथात्मक क्रिया का सीधा अर्थ रखता है और प्रसंग में अपने निर्धारित स्थान पर खड़े होने का भाव भी स्वाभाविक रूप से देता है।
- source_word: ἐστολισμένοι
  choice: विधिवत् वेश धारण करके
  rationale: यह औपचारिक और व्यवस्थित रूप से वस्त्र धारण करने का भाव व्यक्त करता है, पर यूनानी से आगे बढ़कर किसी खास प्रकार के याजकीय वस्त्र को निर्दिष्ट नहीं करता।
- source_word: κατὰ φυλάς
  choice: अपने-अपने दलों में
  rationale: φυλάς का शाब्दिक अर्थ ‘गोत्रों के अनुसार’ हो सकता है, किंतु यहाँ याजकों और लेवियों की व्यवस्थित सेवा-टोलियाँ अभिप्रेत होने की अधिक संभावना है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐπὶ τῶν ἔργων
  choice: कार्यों के लिए
  rationale: ἐπί के इस प्रयोग में कार्यक्षेत्र या उत्तरदायित्व का भाव है। ‘कार्यों के लिए’ यूनानी के निकट रहते हुए मन्दिर-सेवा के संदर्भ को खुला रखता है।
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: इस्राएल के प्रभु परमेश्वर
  rationale: यह यूनानी उपाधि-क्रम का स्वाभाविक हिन्दी रूप है और κύριος का अनुवाद ‘प्रभु’ करता है।
- source_word: ἀκολούθως τῇ Μωσέως βίβλῳ
  choice: मूसा की पुस्तक के अनुसार
  rationale: यह मूसा से संबद्ध लिखित निर्देशों के अनुरूप व्यवस्था किए जाने का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: θυρωροί
  choice: द्वारपाल
  rationale: मन्दिर के प्रवेश-द्वारों पर नियुक्त सेवकों के लिए यह स्पष्ट, प्रचलित और आधुनिक हिन्दी शब्द है।
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: अपने-अपने द्वार पर
  rationale: ‘प्रत्येक द्वार पर’ का स्वाभाविक हिन्दी रूप; यह विभिन्न द्वारपालों की उनके निर्धारित द्वारों पर नियुक्ति स्पष्ट करता है।
theological_decisions:
- issue: ऐसे यूनानी वृत्तांत में κύριος का अनुवाद, जिसके समानांतर इब्रानी पाठ में परमेश्वर का निज नाम आता है
  choice: प्रभु
  alternative: यहोवा
  rationale: इस पद का प्राथमिक स्रोत यूनानी है, जिसमें Κύριος है। इसलिए मुख्य पाठ में इब्रानी समानांतर से परमेश्वर का निज नाम आयात करने के बजाय ‘प्रभु’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज। ‘विधिवत् वेश’ औपचारिक तैयारी का संकेत देता है, बिना किसी अनिर्दिष्ट याजकीय परिधान को जोड़ने के। अंतिम खंड की यूनानी लुप्त क्रिया को हिन्दी में स्पष्टता के लिए ‘खड़े हुए’ दोहराया गया है।
