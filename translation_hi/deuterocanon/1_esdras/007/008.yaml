translation:
  language: hi
  text: सारे इस्राएल के पाप के लिए बारह बकरे[a]—इस्राएल के बारह गोत्र-प्रधानों की संख्या के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अथवा, बलिदान की भाषा में अधिक स्पष्ट रूप से: “सारे इस्राएल के लिए पापबलि के रूप में बारह बकरे।”'
    reason: बलिदानी मुहावरे ὑπὲρ ἁμαρτίας का अधिक स्पष्ट वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: χιμάρους
  choice: बकरे
  rationale: χίμαρος नर बकरे को सूचित करता है। हिन्दी में ‘बकरे’ स्वाभाविक रूप से नर पशु को स्पष्ट करता है और बहुवचन को बनाए रखता है।
- source_word: ὑπὲρ ἁμαρτίας
  choice: पाप के लिए
  rationale: यूनानी पद का निकट अर्थ ‘पाप के लिए’ है, जबकि बलिदान-संबंधी प्रसंग में यह पापबलि का संकेत देता है। मुख्य पाठ में संक्षिप्त मूल अभिव्यक्ति रखी गई है और स्पष्ट बलिदानी अर्थ पादटिप्पणी में दिया गया है।
- source_word: παντὸς τοῦ Ἰσραήλ
  choice: सारे इस्राएल के
  rationale: यह समूचे इस्राएल के प्रतिनिधिक दायरे को व्यक्त करता है और यूनानी संबंधकारक संरचना से निकटता रखता है।
- source_word: πρὸς ἀριθμόν
  choice: संख्या के अनुसार
  rationale: यह मात्रा या गिनती के अनुरूप होने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: φυλάρχων
  choice: गोत्र-प्रधानों
  rationale: φυλάρχης किसी गोत्र के मुखिया या अगुवे को दर्शाता है। ‘गोत्र-प्रधान’ संक्षिप्त, गरिमापूर्ण और अर्थ की दृष्टि से सटीक है।
theological_decisions:
- issue: ὑπὲρ ἁμαρτίας के बलिदानी मुहावरे को स्पष्ट रूप से ‘पापबलि’ कहना या मूल के निकट रखना
  choice: मुख्य पाठ में ‘पाप के लिए’ रखा गया है।
  alternative: ‘सारे इस्राएल के लिए पापबलि के रूप में बारह बकरे’
  rationale: यूनानी अभिव्यक्ति संक्षिप्त और मुहावरेदार है तथा बलिदानी संदर्भ में पापबलि का अर्थ दे सकती है। मुख्य पाठ मूल की शब्दगत संक्षिप्तता और संभावित तनाव को बनाए रखता है; अधिक स्पष्ट अर्थ पादटिप्पणी में उपलब्ध है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘गोत्र-प्रधान’ धार्मिक-सांस्कृतिक संदर्भ में परिचित तथा φυλάρχων का सटीक रूप है।
