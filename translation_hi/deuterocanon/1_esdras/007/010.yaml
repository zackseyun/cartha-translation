base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/010.yaml
  text: And the sons of Israel from the captivity kept the Passover on the fourteenth day of the first month[b][a], when the priests and the Levites had purified themselves together.
translation:
  language: hi
  text: और बंदीवास से आए इस्राएल के पुत्रों[a] ने पहले महीने के चौदहवें दिन फसह मनाया, जब याजक और लेवी एक साथ शुद्ध हो चुके थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्वासन से आए इस्राएल के पुत्रों।” यूनानी में शाब्दिक रूप से “बंदीवास से” है; संकेत उन इस्राएलियों की ओर है जो निर्वासन से लौटने वाले समुदाय से संबंधित थे।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् याजकों और लेवियों ने फसह की तैयारी के लिए विधिपूर्वक शुद्धिकरण किया था।
    reason: cultural_note
lexical_decisions:
- source_word: ἤγαγον … τὸ πάσχα
  choice: फसह मनाया
  rationale: ἄγω का मूल अर्थ ‘ले जाना/लाना’ है, पर यहाँ पर्व-संबंधी प्रयोग में इसका अर्थ फसह का पालन या उत्सव मनाना है। ‘फसह मनाया’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यह इस्राएल से वंशगत संबंध बताने वाली पारंपरिक सामूहिक संज्ञा है। औपचारिक समानता रखते हुए ‘पुत्रों’ से मूल यूनानी की पुरुषवाचक बहुवचन अभिव्यक्ति सुरक्षित रहती है।
- source_word: τῶν ἐκ τῆς αἰχμαλωσίας
  choice: बँधुआई से आए
  rationale: ग्रीक वाक्यांश उस समूह को बँधुआई से आने वाले या उससे संबद्ध लोगों के रूप में पहचानता है। ‘आए’ ἐκ की गति-सूचक स्वाभाविकता व्यक्त करता है, जबकि टिप्पणी में ‘निर्वासन’ का विकल्प सुरक्षित रखा गया है।
- source_word: τὸ πάσχα
  choice: फसह
  rationale: यह पर्व के नाम का हिन्दी बाइबिलीय रूप है; मुख्य पाठ में अनावश्यक विस्तार नहीं किया गया।
- source_word: ἐν τῇ τεσσαρεσκαιδεκάτῃ τοῦ πρώτου μηνός
  choice: पहले महीने के चौदहवें दिन
  rationale: यूनानी काल-सूचना को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ὅτε
  choice: उस समय
  rationale: यह काल-संबंध को व्यक्त करता है और ‘जब’ की तुलना में दो हिन्दी वाक्यों के बीच अधिक स्वाभाविक जोड़ देता है; इसमें कारण या कठोर पूर्वकालिकता नहीं जोड़ी गई।
- source_word: ἡγνίσθησαν
  choice: अपने को शुद्ध कर चुके थे
  rationale: क्रिया फसह की तैयारी से जुड़ी धार्मिक-विधिक शुद्धि बताती है। पूर्ण हो चुकी तैयारी को हिन्दी के पूर्ण भूतकाल से व्यक्त किया गया है, बिना इसे केवल नैतिक शुद्धि बनाने के।
- source_word: οἱ ἱερεῖς καὶ οἱ λευεῖται
  choice: याजक और लेवी
  rationale: मन्दिर-सेवा के इन दोनों समूहों के लिए प्रचलित हिन्दी बाइबिलीय पद रखे गए हैं।
- source_word: ἅμα
  choice: एक साथ
  rationale: यह संयुक्त या एक ही समय में हुई शुद्धि—दोनों की सम्भावना—को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: οἱ υἱοὶ Ἰσραήλ का सामूहिक वंशगत संबोधन
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली
  rationale: मूल की पारंपरिक वंशगत और पुरुषवाचक सामूहिक अभिव्यक्ति को बनाए रखा गया है; इसे अधिक सामान्य जातिनाम में नहीं बदला गया।
- issue: ἡγνίσθησαν में शुद्धि का स्वरूप
  choice: अपने को शुद्ध कर चुके थे
  alternative: शुद्ध किए गए थे
  rationale: प्रसंग धार्मिक-विधिक तैयारी का है। यूनानी रूप में निहित आत्मगत/निष्क्रिय सम्भावना को हिन्दी में प्रसंगानुकूल आत्मगत रूप दिया गया है, और फुटनोट स्पष्ट करता है कि यह अनुष्ठानिक शुद्धि है, केवल नैतिक शुद्धि नहीं।
- issue: ὅτε का काल-संबंध
  choice: उस समय
  alternative: जब; क्योंकि; इसके बाद
  rationale: मूल केवल कालगत संबंध स्पष्ट करता है। अनुवाद ने कारणात्मक ‘क्योंकि’ या क्रम-सूचक ‘इसके बाद’ जोड़कर धार्मिक-विधिक संबंध को अधिक निश्चित नहीं बनाया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘फसह’, ‘याजक’ और ‘लेवी’ जैसे स्थापित बाइबिलीय पद बनाए गए हैं। लंबे यूनानी वाक्य को पठनीय हिन्दी के लिए दो वाक्यों में बाँटा गया है, पर ὅτε का कालगत संबंध ‘उस समय’ से सुरक्षित है।
