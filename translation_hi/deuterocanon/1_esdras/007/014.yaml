translation:
  language: hi
  text: और उन्होंने सात दिन तक अख़मीरी रोटी का पर्व मनाया, और प्रभु के सामने आनन्द मनाते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: मनाया
  rationale: ἄγω का यह रूप पर्व के संदर्भ में ‘पर्व मनाना/पालन करना’ अर्थ देता है; आधुनिक हिन्दी में ‘मनाया’ स्वाभाविक है।
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: अख़मीरी रोटी का पर्व
  rationale: यह यहूदी पर्व का प्रचलित और अर्थ-स्पष्ट नाम है; τῶν ἀζύμων और समानान्तर हिब्रू חַג־מַצּוֹת दोनों बिना ख़मीर की रोटी के पर्व की ओर संकेत करते हैं।
- source_word: ἑπτὰ ἡμέρας
  choice: सात दिन तक
  rationale: यूनानी में कालावधि बताने वाले कर्मकारक का स्वाभाविक हिन्दी रूप ‘सात दिन तक’ है।
- source_word: εὐφραινόμενοι
  choice: आनन्दित हुए
  rationale: यह कृदन्त पर्व मनाने के साथ जुड़ा आनन्द व्यक्त करता है; हिन्दी में समन्वित क्रिया वाक्य को सहज बनाती है और अर्थ सुरक्षित रखती है।
- source_word: ἔναντι Κυρίου
  choice: प्रभु के सामने
  rationale: ἔναντι उपस्थिति के सम्मुख होने का भाव रखता है; ‘प्रभु के सामने’ इसे औपचारिक पर सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूनानी Κυρίου का अनुवाद, जबकि हिब्रू समानान्तर पाठ में יהוה है
  choice: प्रभु
  alternative: याहवे / यहोवा
  rationale: प्राथमिक यूनानी पाठ में Κυρίου है, इसलिए मुख्य पाठ में ‘प्रभु’ स्रोत के रूप और सेप्टुआजेंट की परम्परा को बनाए रखता है; पादटिप्पणी हिब्रू समानान्तर साक्ष्य स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘अख़मीरी रोटी’ धार्मिक पर्व के नाम को सामान्य पाठक के लिए पहचानने योग्य बनाती है।
