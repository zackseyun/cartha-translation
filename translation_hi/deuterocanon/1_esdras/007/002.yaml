base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/002.yaml
  text: They supervised the holy works more diligently[a], working together with the elders of the Jews and the temple overseers.
translation:
  language: hi
  text: वे यहूदियों के प्राचीनों और मंदिर के निरीक्षकों के साथ सहयोग करते हुए पवित्र कार्यों[a] की अधिक सावधानी से देखरेख करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र स्थान के कार्य” अथवा “मंदिर के कार्य।” यूनानी में शाब्दिक अर्थ “पवित्र कार्य” है; इब्रानी समानांतर पाठ में “परमेश्वर के भवन का कार्य” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεστάτουν
  choice: देखरेख करते थे
  rationale: अपूर्ण भूतकाल का क्रियारूप लगातार या जारी निगरानी को सूचित करता है। यह हिन्दी प्रयोग अधीक्षण के भाव को सहज और स्पष्ट रखता है।
- source_word: τῶν ἱερῶν ἔργων
  choice: पवित्र कामों
  rationale: यह यूनानी पद का निकट अर्थ है। प्रसंग में ये परमेश्वर के भवन से जुड़े काम हैं, पर मुख्य पाठ में ‘मन्दिर का काम’ कहने के बजाय यूनानी की व्यापक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ἐπιμελέστερον
  choice: और भी अधिक लगन से
  rationale: तुलनात्मक क्रियाविशेषण अधिक सावधानी, तत्परता या लगन का भाव देता है। ‘और भी अधिक लगन से’ उसकी तुलनात्मक शक्ति बनाए रखता है।
- source_word: συνεργοῦντες
  choice: के साथ मिलकर
  rationale: कृदन्त साथ मिलकर सक्रिय रूप से काम करने का भाव देता है; हिन्दी में यह वाक्य के मुख्य क्रिया-प्रवाह से स्वाभाविक रूप से जुड़ता है।
- source_word: τοῖς πρεσβυτέροις τῶν Ἰουδαίων
  choice: यहूदियों के पुरनियों
  rationale: यह यहूदी समुदाय के मान्य वरिष्ठ अगुओं को दर्शाता है। ‘पुरनियों’ बाइबलीय संदर्भ में परिचित, संक्षिप्त और गरिमापूर्ण पद है।
- source_word: ἱεροστάταις
  choice: मन्दिर की देखरेख करनेवालों
  rationale: यह पद पवित्र स्थान या उसके कामों पर नियुक्त व्यक्तियों को दर्शाता है। यह अनुवाद उनकी पर्यवेक्षकीय भूमिका स्पष्ट करता है, पर उन्हें अनिवार्य रूप से याजक नहीं ठहराता।
theological_decisions:
- issue: यूनानी पाठ और एज्रा 6:22 के मसोरेटिक समानांतर का संबंध
  choice: यहूदियों के पुरनियों और मन्दिर की देखरेख करनेवालों के साथ सहयोग का यूनानी विवरण बनाए रखा गया है; मसोरेटिक समानांतर केवल काम के मन्दिर-संबंधी प्रसंग की पुष्टि करता है।
  alternative: मसोरेटिक समानांतर के अनुसार अधिक स्वतंत्र रूप से ‘परमेश्वर के भवन के काम में उनके हाथ दृढ़ किए’ अनुवाद करना।
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक स्रोत है और यहाँ उसका कथन मसोरेटिक पाठ से विशिष्ट है। इसलिए यूनानी विवरण को किसी दूसरे साक्षी की भाषा में समेटा नहीं गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘पुरनियों’ से सामुदायिक अगुओं का बाइबलीय अर्थ मिलता है; ‘मन्दिर की देखरेख करनेवालों’ से पद की भूमिका स्पष्ट होती है और अनावश्यक रूप से याजकीय पहचान नहीं जोड़ी जाती।
