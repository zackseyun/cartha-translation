base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/015.yaml
  text: because he had turned the counsel of the king of Assyria toward them[a], to strengthen their hands in the work of the Lord, the God of Israel.
translation:
  language: hi
  text: क्योंकि उसने अश्शूर के राजा[a] की मंशा उनकी ओर फेर दी थी, ताकि प्रभु, इस्राएल के परमेश्वर, के कामों में उनके हाथों को दृढ़ करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ और इब्रानी समानांतर, दोनों में ‘अश्शूर का राजा’ है, यद्यपि एज्रा के व्यापक प्रसंग में फारसी शासक की बात है। स्रोत के शब्दों को सामंजस्य बैठाकर बदला नहीं गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: μετέστρεψεν
  choice: फेर दी थी
  rationale: क्रिया का अर्थ मोड़ना या दिशा बदलना है। पूर्वकालिक कारणसूचक प्रसंग में ‘फेर दी थी’ स्वाभाविक है और किए गए परिवर्तन को स्पष्ट रखता है।
- source_word: βουλήν
  choice: मंशा
  rationale: βουλή सलाह, योजना, उद्देश्य या अभिप्राय का बोध करा सकता है। यहाँ ‘मंशा’ राजा के निर्णयकारी रुख को व्यक्त करती है और ‘उनकी ओर’ के साथ स्वाभाविक हिन्दी बनाती है।
- source_word: τοῦ βασιλέως Ἀσσυρίων
  choice: अश्शूर के राजा
  rationale: यूनानी पाठ और इब्रानी समानांतर, दोनों में ‘अश्शूर का राजा’ है। व्यापक ऐतिहासिक संदर्भ के आधार पर इसे ‘फारस का राजा’ नहीं किया गया।
- source_word: ἐπʼ αὐτούς
  choice: उनकी ओर
  rationale: यह दिशा या अभिमुखता व्यक्त करता है। ‘उनके पक्ष में’ अर्थानुकूल होता, पर मुख्य पाठ में ‘उनकी ओर’ मूल की खुली अभिव्यक्ति को अधिक निकटता से रखता है।
- source_word: κατισχῦσαι τὰς χεῖρας αὐτῶν
  choice: उनके हाथ दृढ़ करे
  rationale: यह सामर्थ्य और प्रोत्साहन का बाइबलीय मुहावरा है, जिसकी पुष्टि इब्रानी समानांतर לְחַזֵּק יְדֵיהֶם से भी होती है। मुहावरे को सामान्य हिन्दी में समझने योग्य रूप में बनाए रखा गया है।
- source_word: τὰ ἔργα Κυρίου θεοῦ Ἰσραήλ
  choice: प्रभु, इस्राएल के परमेश्वर, के कामों में
  rationale: यूनानी में ἔργα बहुवचन है, इसलिए ‘कामों’ रखा गया। ‘प्रभु’ और ‘इस्राएल के परमेश्वर’ को समानाधिकरण रूप में रखा गया है; इब्रानी समानांतर में आए ‘परमेश्वर के भवन’ को यूनानी मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मुख्य स्रोत यूनानी है और उसमें Κυρίου है; इसलिए यूनानी पद को सीधे ‘प्रभु’ किया गया। इब्रानी समानांतर में दिव्य नाम होने पर भी उसे मुख्य पाठ में आरोपित नहीं किया गया।
- issue: ‘अश्शूर के राजा’ को ऐतिहासिक संदर्भ से सामंजस्य देना
  choice: अश्शूर के राजा को मुख्य पाठ में बनाए रखा
  alternative: फारस का राजा
  rationale: यूनानी और इब्रानी समानांतर दोनों यही पदवी देते हैं। इसे बदलना स्रोत में निहित ऐतिहासिक तनाव को चुपचाप दूर करना होता।
- issue: कार्य का वचन
  choice: कामों
  alternative: काम
  rationale: यूनानी τὰ ἔργα रूपतः बहुवचन है। हिन्दी में बहुवचन रखने से मूल पाठ की व्याकरणिक सूचना सुरक्षित रहती है, यद्यपि समानांतर इब्रानी में परमेश्वर के भवन का सामूहिक ‘काम’ है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हाथ दृढ़ करना’ मूल यूनानी और इब्रानी समानांतर का अर्थपूर्ण बाइबलीय मुहावरा बनाए रखता है। विराम-चिह्नों से ‘इस्राएल के परमेश्वर’ को ‘प्रभु’ के समानाधिकरण के रूप में स्पष्ट किया गया है।
