base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/003.yaml
  text: And the holy works prospered[a], while Haggai and Zechariah the prophets were prophesying.
translation:
  language: hi
  text: और पवित्र कार्य[a] सुचारु रूप से आगे बढ़ते गए, जबकि हाग्गै और जकर्याह नबी भविष्यवाणी कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मन्दिर से सम्बन्धित कार्य, विशेषकर उसका निर्माण।
    reason: मूल यूनानी का शाब्दिक पद ‘पवित्र कार्य’ है; प्रसंग उसका मन्दिर के काम से सम्बन्ध स्पष्ट करता है।
lexical_decisions:
- source_word: εὐόδα ἐγίνετο
  choice: सुचारु रूप से आगे बढ़ते गए
  rationale: यह पदबंध कार्यों की अनुकूल प्रगति और सफलता व्यक्त करता है। यह हिन्दी रूप निर्माण-संबंधी कार्य के क्रमशः अच्छी तरह आगे बढ़ने का स्वाभाविक भाव देता है।
- source_word: τὰ ἱερὰ ἔργα
  choice: पवित्र कार्य
  rationale: यूनानी का सीधा अर्थ ‘पवित्र कार्य’ है। प्रसंग में इससे मन्दिर का काम अभिप्रेत है, पर मूल पाठ इस पद में ‘मन्दिर’ स्पष्ट रूप से नहीं कहता।
- source_word: προφητευόντων
  choice: भविष्यवाणी कर रहे थे
  rationale: 'जननात्मक निरपेक्ष रचना समकालीन और जारी क्रिया बताती है: कार्य उसी समय आगे बढ़ रहे थे जब दोनों नबी भविष्यवाणी कर रहे थे।'
- source_word: Ἁγγαίου
  choice: हाग्गै
  rationale: इस नबी के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Ζαχαρίου
  choice: जकर्याह
  rationale: इस नबी के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: τῶν προφητῶν
  choice: नबी
  rationale: हाग्गै और जकर्याह की पहचान नबियों के रूप में स्पष्ट रखी गई है; हिन्दी में दोनों नामों के बाद एकवचन-रूप ‘नबी’ स्वाभाविक रूप से सामूहिक विशेषण का काम करता है।
theological_decisions:
- issue: क्या ‘पवित्र कार्य’ को मुख्य पाठ में स्पष्टतः मन्दिर-निर्माण का कार्य कहा जाए
  choice: मुख्य पाठ में व्यापक पद ‘पवित्र कार्य’ रखना
  alternative: मन्दिर का निर्माण-कार्य
  rationale: यूनानी पाठ यहाँ मन्दिर का नाम स्पष्टतः नहीं लेता, यद्यपि प्रसंग उसी ओर संकेत करता है। इसलिए मुख्य पाठ मूल की व्यापकता बनाए रखता है और प्रसंगगत अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘सुचारु रूप से आगे बढ़ते गए’ अनुकूल और निरन्तर प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है।
