lexical_decisions:
- source_word: λαμβάνει
  choice: उठाता है
  rationale: संदर्भ में हथियार अपने हाथ में लेने की क्रिया है; ‘उठाता है’ आधुनिक हिन्दी में स्वाभाविक और ठोस है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यूनानी एकवचन प्रतिनिधिक संज्ञा को गरिमापूर्ण और व्यापक हिन्दी में सुरक्षित रखता है।
- source_word: ῥομφαίαν
  choice: तलवार
  rationale: यह शब्द बड़ी तलवार भी सूचित कर सकता है, पर यहाँ केवल ‘तलवार’ कहना अनावश्यक अतिविशिष्टता से बचता है।
- source_word: ἐκπορεύεται
  choice: निकल पड़ता है
  rationale: बाहर जाने और किसी उद्देश्य से प्रस्थान करने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξοδεύειν
  choice: युद्ध-अभियान पर जाने
  rationale: शब्द का अभियान या सैन्य प्रयाण वाला अर्थ बनाए रखता है, बिना इसे केवल ‘युद्ध करने’ तक सीमित किए।
- source_word: λῃστεύειν
  choice: लूटने
  rationale: हिंसक ढंग से माल छीनने का भाव देता है और अगले κλέπτειν से भेद बनाए रखता है।
- source_word: κλέπτειν
  choice: चोरी करने
  rationale: गुप्त या अनुचित रूप से वस्तु लेने का सामान्य अर्थ स्पष्टतः व्यक्त करता है।
- source_word: εἰς τὴν θάλασσαν πλεῖν καὶ ποταμούς
  choice: समुद्र तथा नदियों में जहाज़ चलाने
  rationale: πλεῖν का नौवहन-संबंधी अर्थ स्वाभाविक हिन्दी में देता है; εἰς को यहाँ गमन-क्षेत्र के रूप में ‘में’ कहना मुहावरेदार है।
