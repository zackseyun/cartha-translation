  text: and he watches for the lion[a], and walks in darkness; and whenever he steals and snatches and breaks in[c][b], he brings it to his beloved.
translation:
  language: hi
  text: और वह सिंह पर निगाह रखता है[a] और अँधेरे में चलता है; और जब कभी वह चोरी करता है, छीनता है और सेंध लगाता है[b], तो वह उसे अपनी प्रेयसी के पास ले जाता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सिंह को देखता है।’ यूनानी क्रिया ध्यान से देखने या निरीक्षण करने का अर्थ भी दे सकती है; प्रसंग में सतर्क, उद्देश्यपूर्ण दृष्टि का भाव अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: चोरी के लिए प्रयुक्त यह अंतिम यूनानी क्रिया विशेष रूप से छिपकर चोरी करने, खासकर घर में सेंध लगाकर या घुसकर चोरी करने, को सूचित करती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उस स्त्री के पास जिससे वह प्रेम करता है।’ यूनानी शब्द रोमानी अर्थ में प्रिय स्त्री या प्रेयसी को दर्शाता है।
    reason: lexical_alternative
