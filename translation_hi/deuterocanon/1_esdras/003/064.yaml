  yaml_path: translation/deuterocanon/1_esdras/003/064.yaml
  text: and in her judgment there is nothing unjust[a]. And this is the strength and the kingdom and the authority and the majesty of all the ages[b]. Blessed is the God of truth.
translation:
  language: hi
  text: और उसके न्याय में कुछ भी अन्यायपूर्ण नहीं है। और वह सभी युगों की सामर्थ्य, राज्य, अधिकार और महिमा है। सत्य का परमेश्वर धन्य है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: न्याय
  rationale: यहाँ शब्द सत्य द्वारा किए जाने वाले न्याय या उसके न्याय-मानदंड को दर्शाता है; ‘न्याय’ विधिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: αὐτῆς
  choice: उसके
  rationale: यूनानी में इसका पूर्वपद स्त्रीलिंग ‘सत्य’ है और प्रसंग सत्य का मानवीकरण करता है। हिन्दी में ‘उसके’ स्वाभाविक रहते हुए उसी व्यक्तिकृत संदर्भ को आगे बढ़ाता है, यद्यपि सर्वनाम स्वयं लिंग स्पष्ट नहीं करता।
- source_word: ἄδικον
  choice: अन्यायपूर्ण
  rationale: यह न्याय के विरुद्ध या अनुचित बात को दर्शाता है; ‘अन्यायपूर्ण’ κρίσις के न्यायिक संदर्भ से सीधा मेल रखता है।
- source_word: ἰσχύς
  choice: सामर्थ्य
  rationale: यह बल या शक्ति का सूचक है; ‘सामर्थ्य’ गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी है तथा ἐξουσία से भेद भी बनाए रखता है।
- source_word: βασίλειον
  choice: राज्य
  rationale: इस स्तुतिपरक सूची में यह राजकीय प्रभुत्व या राज्य को दर्शाता है; ‘राज्य’ संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: ἐξουσία
  choice: अधिकार
  rationale: यह केवल शक्ति नहीं, बल्कि वैध सत्ता या शासन-अधिकार पर बल देता है; ‘अधिकार’ उस भेद को सुरक्षित रखता है।
- source_word: μεγαλειότης
  choice: महिमा
  rationale: यह महानता, वैभव या प्रताप का सूचक है; स्तुतिपरक शैली में ‘महिमा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τῶν πάντων αἰώνων
  choice: सब युगों की
  rationale: यह यूनानी के ‘सभी युगों का/की’ रूप को पारदर्शी ढंग से रखता है और इसे परंपरागत ‘युगानुयुग’ में समतल नहीं करता।
- source_word: εὐλογητός
  choice: धन्य है
  rationale: स्तुतिवाचक विधेय के रूप में यह यूनानी आशीर्वाद-सूत्र के निकट और हिन्दी में स्वाभाविक है।
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: सत्य का परमेश्वर
  rationale: सम्बन्धकारक रचना को बनाए रखा गया है। ‘सच्चा परमेश्वर’ कहने से वाक्य-विन्यास और अर्थ का बल बदल जाता।
theological_decisions:
- issue: सत्य का मानवीकरण और स्त्रीलिंग संदर्भ
  choice: ‘उसके न्याय’ द्वारा व्यक्तिकृत सत्य का संदर्भ जारी रखा गया
  alternative: ‘उस सत्य के न्याय’ या निरपेक्ष ‘इसके न्याय’
  rationale: यूनानी स्त्रीलिंग सर्वनाम और निकटवर्ती प्रसंग सत्य का मानवीकरण करते हैं। हिन्दी में ‘उसके’ कृत्रिम स्त्रीवाचक सर्वनाम जोड़े बिना उस साहित्यिक संबंध को बनाए रखता है।
- issue: αἰώνων का स्तुतिपरक अर्थ
  choice: ‘सब युगों की’
  alternative: ‘युगानुयुग’ या ‘सदा-सर्वदा की’
  rationale: शाब्दिक युग-संबंधी अभिव्यक्ति मूल की अस्पष्टता और चित्र को सुरक्षित रखती है; इसे अनिवार्यतः अनंतकाल के रूढ़ वाक्यांश में नहीं बदला गया।
- issue: ‘सामर्थ्य, राज्य, अधिकार और महिमा’ का संकेत
  choice: ‘यही’ को निकटवर्ती व्यक्तिकृत सत्य की ओर संकेत करने दिया गया
  alternative: स्पष्ट रूप से ‘सत्य ही…’ जोड़ना
  rationale: मूल में संकेतवाचक αὕτη है। ‘सत्य’ को दोहराना अर्थ स्पष्ट करता, पर मूल से अतिरिक्त संज्ञा जोड़कर संभावित साहित्यिक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्तुतिपरक शैली रखी गई है। वाक्य मूल की समानांतर संज्ञा-सूची और संक्षिप्त आशीर्वाद-वचन को बनाए रखते हैं। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि ‘उसके’ और ‘सब युगों की’ मूल की विशेषताओं को मुख्य पाठ में पर्याप्त रूप से सुरक्षित रखते हैं।
