base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/057.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun, because it turns in the circuit of heaven.
translation:
  language: hi
  text: “हे पुरुषो, क्या स्त्रियाँ शक्तिशाली नहीं हैं? पृथ्वी विशाल है, आकाश ऊँचा है, और सूर्य अपनी गति में तेज़ है, क्योंकि वह आकाश के चक्र में घूमता है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह आकाश के वृत्त में घूमता है।”
    reason: κύκλος को ‘वृत्त’ भी अनूदित किया जा सकता है; यह ‘चक्र’ का निकटवर्ती शाब्दिक विकल्प है।
lexical_decisions:
- source_word: Ἄνδρες
  choice: पुरुषो
  rationale: यह संबोधन का बहुवचन है। ‘पुरुषो’ मूल के सीधे पुरुषवाचक संबोधन और वक्ता की आलंकारिक शैली को बनाए रखता है।
- source_word: οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: क्या स्त्रियाँ शक्तिशाली नहीं हैं?
  rationale: संदर्भ में इसे आलंकारिक प्रश्न के रूप में पढ़ना स्वाभाविक है। ‘शक्तिशाली’ ἰσχυραί में निहित सामर्थ्य और बल दोनों को व्यक्त करता है।
- source_word: μεγάλη ἡ γῆ
  choice: पृथ्वी विशाल है
  rationale: ‘विशाल’ पृथ्वी के बड़े विस्तार का स्वाभाविक आधुनिक हिन्दी रूप है; हिन्दी की सहज वाक्य-रचना अपनाई गई है।
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: आकाश ऊँचा है
  rationale: οὐρανός के लिए इस ब्रह्मांड-वर्णन में ‘आकाश’ स्वाभाविक है और आगे उसी शब्द की पुनरावृत्ति भी बनी रहती है।
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: सूर्य अपनी गति में तेज़ है
  rationale: δρόμος यहाँ दौड़ की प्रतियोगिता नहीं, सूर्य की चाल या मार्गगत गति को सूचित करता है। यह रूप गति के बिंब को स्पष्ट रखता है।
- source_word: ὅτι στρέφεται
  choice: क्योंकि वह ... घूमता है
  rationale: ὅτι कारण बताता है और στρέφεται घूमने अथवा चक्कर लगाने की गति व्यक्त करता है; सरल अर्थ को बिना अधिक खगोलीय व्याख्या के रखा गया है।
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: आकाश के चक्र में
  rationale: κύκλος का मूल अर्थ वृत्त या चक्र है। ‘चक्र’ सूर्य के आकाशीय परिपथ का बिंब बनाए रखता है, पर किसी विशिष्ट वैज्ञानिक मॉडल को आरोपित नहीं करता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल के प्रत्यक्ष संबोधन तथा क्रमिक आलंकारिक कथनों को बनाए रखते हुए हिन्दी की स्वाभाविक कर्ता–विधेय वाक्य-रचना अपनाई गई है।
