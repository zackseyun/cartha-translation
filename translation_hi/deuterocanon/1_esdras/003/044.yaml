  text: and with the woman he gives up his life[b][a], and remembers neither father nor mother nor homeland.
translation:
  language: hi
  text: और वह स्त्री[a] के साथ अपना प्राण तक छोड़ देता है[b], और न अपने पिता को याद रखता है, न अपनी माता को, न अपनी मातृभूमि को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्त्री’ का अनुवाद ‘पत्नी’ भी हो सकता है; यूनानी शब्द γυνή प्रसंग के अनुसार दोनों अर्थ रखता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपना जीवन त्याग देता है,’ ‘अपनी आत्मा छोड़ देता है,’ अथवा ‘अपने-आपको छोड़ देता है।’ यूनानी में ψυχή शब्द है, जिसका अर्थ प्रसंग के अनुसार जीवन, प्राण, आत्मा या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τῆς γυναικός
  choice: स्त्री के साथ
  rationale: μετά के साथ संबंधकारक सामान्यतः संगति या साथ होने का भाव देता है। इसलिए ‘के साथ’ यूनानी के निकट रहते हुए स्वाभाविक हिन्दी है; ‘स्त्री के लिए’ या ‘स्त्री के कारण’ कहना अर्थ को अनावश्यक रूप से निश्चित कर देता।
- source_word: γυναικός
  choice: स्त्री
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ दोनों हो सकता है। यहाँ ‘स्त्री’ व्यापक अर्थ को सुरक्षित रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀφίησι
  choice: छोड़ देता है
  rationale: ἀφίημι का अर्थ छोड़ना, जाने देना या त्याग देना हो सकता है। ψυχή के साथ ‘प्राण छोड़ देता है’ मूल की तीव्रता और उसके संभावित अर्थों को अपेक्षाकृत संक्षिप्त रूप में रखता है।
- source_word: τὴν ψυχήν
  choice: अपना प्राण
  rationale: ψυχή यहाँ जीवन, प्राण, आत्मा या स्वयं व्यक्ति का संकेत दे सकता है। ‘प्राण’ हिन्दी में जीवन और जीवित अस्तित्व दोनों का भाव देता है; ‘अपना’ हिन्दी में आवश्यक स्वाभाविक पूर्ति है।
- source_word: μέμνηται
  choice: याद रखता है
  rationale: क्रिया का अर्थ याद रखना या ध्यान में रखना है। निषेधात्मक सूची में ‘याद रखता है’ स्पष्ट और सहज है।
- source_word: χώραν
  choice: मातृभूमि
  rationale: χώρα का अर्थ देश, प्रदेश या भूमि हो सकता है। पिता और माता के साथ इस सूची में अपना देश या जन्मभूमि अभिप्रेत है; ‘मातृभूमि’ उस निजी संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
