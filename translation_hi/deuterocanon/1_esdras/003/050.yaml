  yaml_path: translation/deuterocanon/1_esdras/003/050.yaml
  text: And many perished and were led astray and sinned because of women[a].
translation:
  language: hi
  text: और बहुत-से लोग स्त्रियों[a] के कारण नाश हो गए, भटक गए और उन्होंने पाप किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पत्नियों’। यूनानी शब्द का अर्थ प्रसंग के अनुसार ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλοντο
  choice: नाश हो गए
  rationale: यहाँ ἀπόλλυμι का रूप विनाश या बरबादी को प्राप्त होने का भाव देता है। ‘नाश हो गए’ घटना की गंभीरता बनाए रखता है और किसी बाहरी कर्ता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐσφάλησαν
  choice: भटक गए
  rationale: σφάλλω का यह निष्क्रिय रूप गिरने, चूकने या गलत राह पर जाने का अर्थ दे सकता है। नैतिक क्रम में ‘भटक गए’ स्वाभाविक हिन्दी में नैतिक विचलन को व्यक्त करता है, बिना छल दिए जाने का भाव निश्चित किए।
- source_word: ἡμάρτοσαν
  choice: उन्होंने पाप किया
  rationale: नैतिक और धार्मिक प्रसंग में ἁμαρτάνω का मानक अर्थ ‘पाप करना’ है; स्पष्ट हिन्दी वाक्य-रचना के लिए कर्ता ‘उन्होंने’ व्यक्त किया गया है।
- source_word: διὰ τὰς γυναῖκας
  choice: स्त्रियों के कारण
  rationale: कर्मकारक के साथ διά यहाँ कारण व्यक्त करता है। γυναῖκες का अर्थ ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है; मुख्य पाठ में व्यापक और शब्दतः पारदर्शी अर्थ ‘स्त्रियाँ’ रखा गया है।
theological_decisions:
- issue: γυναῖκες में स्त्रियों अथवा पत्नियों का अर्थ और कथन का संभावित नकारात्मक सामान्यीकरण
  choice: स्त्रियों
  alternative: पत्नियों
  rationale: यूनानी बहुवचन अपने आप में दोनों अर्थों की अनुमति देता है, और इस उपवाक्य की भाषा संदर्भ को केवल विवाहित स्त्रियों तक सीमित नहीं करती। इसलिए मूल कथन की असुविधाजनक तीक्ष्णता को नरम या संकीर्ण किए बिना व्यापक अर्थ मुख्य पाठ में रखा और दूसरा अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सहज क्रम रखा गया है। तीनों समन्वित क्रियाओं की तीव्रता और नैतिक प्रगति सुरक्षित है; ‘भटक गए’ मूल के निष्क्रिय रूप को हिन्दी में अप्राकृतिक बनाए बिना व्यक्त करता है।
