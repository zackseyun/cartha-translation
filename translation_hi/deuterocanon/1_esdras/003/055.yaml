  text: हे पुरुषो, स्त्रियाँ बलशाली कैसे न हों, क्योंकि वे ऐसे काम करती हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: हे पुरुषो
  rationale: प्रत्यक्ष संबोधन को गरिमापूर्ण और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἰσχυραὶ
  choice: बलशाली
  rationale: यह शब्द यहाँ स्त्रियों की सामर्थ्य और प्रभाव को व्यक्त करता है; ‘बलशाली’ प्रश्न की अलंकारिक धार बनाए रखता है।
- source_word: ὅτι
  choice: जब
  rationale: संदर्भ में कारणसूचक भाव है—उनके ऐसे काम करने के कारण उनकी सामर्थ्य स्पष्ट है; हिन्दी में ‘जब’ इस अलंकारिक प्रश्न को सहज रूप देता है।
- source_word: οὕτως πράσσουσιν
  choice: वे ऐसे काम करती हैं
  rationale: यूनानी अभिव्यक्ति का व्यापक और संदर्भ-सापेक्ष अर्थ सुरक्षित रखा गया है, बिना ‘ऐसी बातें’ को अनावश्यक रूप से विशिष्ट किए।
theological_decisions:
- issue: स्त्रियों की सामर्थ्य पर अलंकारिक प्रश्न
  choice: स्त्रियाँ बलशाली कैसे न हों
  alternative: स्त्रियाँ कितनी बलशाली हैं
  rationale: मूल यूनानी की नकारात्मक प्रश्न-रचना πῶς οὐκ को बनाए रखा गया है; इसे सीधे सकारात्मक कथन में बदलने से उसकी वाग्मितापूर्ण शक्ति घट जाती।
