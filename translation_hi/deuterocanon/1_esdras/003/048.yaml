  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल यूनानी की तुलनात्मक संरचना के निकट। ‘माँ-बाप’ की जगह अधिक साहित्यिक पर सहज ‘पिता और माता’ रखा गया है।
