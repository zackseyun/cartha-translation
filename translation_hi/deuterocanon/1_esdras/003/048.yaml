  text: And a man loves his own wife more than his father and mother.
translation:
  language: hi
  text: और पुरुष अपनी पत्नी से अपने पिता और माता की अपेक्षा अधिक प्रेम करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεῖον … μᾶλλον ἢ
  choice: की अपेक्षा अधिक
  rationale: यूनानी में तुलना को दोहरे ढंग से बल दिया गया है। हिन्दी में ‘की अपेक्षा अधिक’ स्वाभाविक रूप से प्रेम की अधिक मात्रा व्यक्त करता है, न कि एक को छोड़कर दूसरे को चुनना।
- source_word: ἀγαπᾷ
  choice: प्रेम करता है
  rationale: यह ἀγαπάω का सीधा, प्रतिष्ठित और सामान्य हिन्दी समतुल्य है।
- source_word: ἄνθρωπος
  choice: पुरुष
  rationale: यद्यपि ἄνθρωπος सामान्यतः ‘मनुष्य’ भी हो सकता है, यहाँ अपनी पत्नी, पिता और माता के संदर्भ में कथन पुरुष-केंद्रित है; इसलिए ‘पुरुष’ प्रसंग के आशय को ठीक रखता है।
- source_word: τὴν ἰδίαν γυναῖκα
  choice: अपनी पत्नी
  rationale: यहाँ γυνή का अर्थ वैवाहिक संदर्भ में ‘पत्नी’ है। ἰδίαν का आत्मवाची/स्वकीय भाव हिन्दी के ‘अपनी’ में स्वाभाविक रूप से सुरक्षित है; अलग से ‘अपनी ही पत्नी’ कहना अनावश्यक बल उत्पन्न कर सकता है।
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: अपने पिता और माता
  rationale: यूनानी में दोनों संबंध अलग-अलग संज्ञाओं से व्यक्त हैं। हिन्दी में संदर्भानुसार ‘अपने’ जोड़ना आवश्यक और स्वाभाविक है; ‘माता-पिता’ की अपेक्षा यह मूल की क्रमबद्ध अभिव्यक्ति के अधिक निकट है।
