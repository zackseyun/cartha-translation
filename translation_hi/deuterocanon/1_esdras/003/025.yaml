  yaml_path: translation/deuterocanon/1_esdras/003/025.yaml
  text: O men[a], do not men prevail, since they rule over the earth and the sea and everything in them?
translation:
  language: hi
  text: हे पुरुषो, क्या मनुष्य प्रबल नहीं हैं, क्योंकि वे पृथ्वी और समुद्र तथा उनमें की हर वस्तु पर अधिकार रखते हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “क्या मनुष्य प्रबल नहीं हैं—पृथ्वी और समुद्र तथा उनमें की हर वस्तु पर अधिकार रखते हुए?” यूनानी में यह आलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर “हाँ” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄνδρες
  choice: हे पुरुषो
  rationale: सम्बोधन के पुरुषवाचक बहुवचन और भाषण की आलंकारिक गरिमा को स्पष्ट रूप से बनाए रखता है।
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: क्या मनुष्य सबसे अधिक शक्तिशाली नहीं हैं
  rationale: οὐχ वाला प्रश्न सकारात्मक उत्तर की अपेक्षा करता है। ὑπερισχύω का तुलनात्मक/प्रधान बल यहाँ ‘सबसे अधिक शक्तिशाली’ से स्वाभाविक ढंग से व्यक्त होता है, जबकि ‘मनुष्य’ ἄνθρωποι के मानवजाति-सामान्य अर्थ को रखता है।
- source_word: κατακρατοῦντες
  choice: क्योंकि वे ... पर अधिकार रखते हैं
  rationale: वर्तमान कृदन्त मुख्य दावे का आधार बताता है; ‘अधिकार रखते हैं’ प्रभुत्व के अर्थ को बिना केवल राजनीतिक शासन तक सीमित किए व्यक्त करता है।
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: पृथ्वी और समुद्र
  rationale: γῆ और θάλασσα का व्यापक युग्म समूचे स्थलीय और समुद्री क्षेत्र को सूचित करता है; इसलिए ‘भूमि’ की अपेक्षा ‘पृथ्वी’ उपयुक्त है।
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: उनमें जो कुछ है, उस सब
  rationale: πάντα की समग्रता और αὐτοῖς का पृथ्वी तथा समुद्र दोनों की ओर संकेत स्पष्ट रूप से सुरक्षित रहता है।
