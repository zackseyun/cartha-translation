translation:
  language: hi
  text: उसने प्रहार करने को कहा, और वे प्रहार करते हैं; उसने उजाड़ने को कहा, और वे उजाड़ते हैं; उसने बनाने को कहा, और वे बनाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπε
  choice: उसने कहा
  rationale: λέγω के भूतकालिक रूप का सीधा अर्थ रखते हुए प्रत्येक शाही निर्देश की पुनरावृत्ति सुरक्षित की गई है; ‘आज्ञा दी’ कहना निहित अधिकार को अनावश्यक रूप से स्पष्ट कर देता।
- source_word: πατάξαι / τύπτουσιν
  choice: प्रहार करो / वे प्रहार करते हैं
  rationale: दोनों यूनानी क्रियाएँ हिंसक प्रहार का व्यापक अर्थ देती हैं। हिन्दी में समान धातु की पुनरावृत्ति आदेश और उसके तत्काल पालन की लय को बनाए रखती है।
- source_word: ἐρημῶσαι / ἐρημοῦσιν
  choice: उजाड़ दो / वे उजाड़ देते हैं
  rationale: यह चुनाव किसी स्थान को वीरान या नष्ट कर देने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और आदेश–कार्यान्वयन की समानांतर रचना बनाए रखता है।
- source_word: οἰκοδομῆσαι / οἰκοδομοῦσιν
  choice: निर्माण करो / वे निर्माण करते हैं
  rationale: मूल क्रिया का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। ‘पुनर्निर्माण’ प्रसंगतः संभव है, पर यूनानी में वह बात स्पष्ट नहीं की गई है।
theological_decisions:
- issue: बार-बार आए εἶπε + infinitive में निहित राजकीय अधिकार की मात्रा
  choice: ‘उसने कहा ... और वे ...’ की संरचना रखते हुए कथन को हिन्दी में प्रत्यक्ष निर्देश के रूप में प्रस्तुत किया गया है।
  alternative: ‘उसने आज्ञा दी ... और उन्होंने उसका पालन किया’ अथवा ‘उसके कहते ही ...’
  rationale: मूल पाठ वक्ता के शब्द की प्रभावकारिता को पुनरावृत्ति द्वारा दिखाता है। ‘आज्ञा’ और ‘पालन’ जोड़ना अर्थ को अधिक स्पष्ट कर देता, पर मूल शब्दावली से आगे जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संक्षिप्त रखी गई है। तीनों खंडों की समानांतर लय और आदेश के बाद वर्तमानकालीन क्रिया की जीवंतता सुरक्षित है। प्रत्यक्ष उद्धरण हिन्दी में infinitive-जैसी अस्वाभाविक रचना से बचाता है, जबकि εἶπε का अनुवाद ‘कहा’ ही रहता है।
