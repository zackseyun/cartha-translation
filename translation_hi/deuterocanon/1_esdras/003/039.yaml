  text: and from them they came to be[a], and these women nourished the very men who planted the vineyards from which wine comes[b],
translation:
  language: hi
  text: और उन्हीं से वे अस्तित्व में आए[a], और इन्हीं स्त्रियों[b] ने उन्हीं पुरुषों का पालन-पोषण किया जिन्होंने दाख की बारियाँ लगाईं, जिनसे दाखमधु बनता है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उन्हीं से जन्मे।” यूनानी में अधिक शाब्दिक रूप से, “वे उन्हीं से अस्तित्व में आए।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी का स्त्रीलिंग संकेतवाचक शब्द विशेष रूप से “इन्हीं स्त्रियों” की ओर संकेत करता है, न कि “ये वस्तुएँ” की ओर।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: उन्हीं से
  rationale: ἐξ के साथ संबंधकारक यहाँ उद्गम या स्रोत बताता है। ‘उन्हीं’ प्रसंग में स्त्रियों की ओर संकेत करते हुए कथन के बल को बनाए रखता है।
- source_word: ἐγένοντο
  choice: अस्तित्व में आए
  rationale: γίνομαι यहाँ उत्पत्ति या अस्तित्व में आने का भाव देता है। यह अनुवाद जैविक जन्म को अनिवार्य किए बिना यूनानी की व्यापक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: αὗται
  choice: इन्हीं स्त्रियों ने
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम प्रसंग की स्त्रियों की ओर स्पष्ट संकेत करता है। हिंदी में ‘स्त्रियों’ जोड़ने से संदर्भ और वाक्पटु बल स्वाभाविक रूप से स्पष्ट होते हैं।
- source_word: ἐξέθρεψαν
  choice: पालन-पोषण किया
  rationale: क्रिया खिलाने-पिलाने और बड़ा करने, दोनों का अर्थ दे सकती है; ‘पालन-पोषण किया’ मातृ-संरक्षण और पोषण दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: αὐτοὺς τοὺς φυτεύσαντας
  choice: उन पुरुषों का ... जिन्होंने ... लगाईं
  rationale: सर्वनाम और कृदंत का संयोजन उन्हीं व्यक्तियों पर बल देता है। ‘उन पुरुषों ... जिन्होंने’ हिंदी में पहचान और संबंध स्पष्ट रखता है; ‘उन्हीं स्त्रियों’ के साथ वाक्य का विरोधात्मक बल भी बना रहता है।
- source_word: τοὺς ἀμπελῶνας
  choice: दाख की बारियाँ
  rationale: ἀμπελών के लिए यह सुबोध और पारंपरिक हिंदी अभिव्यक्ति है।
- source_word: ἐξ ὧν ὁ οἶνος γίνεται
  choice: जिनसे दाखमधु बनता है
  rationale: यह वाक्यांश दाख की बारियों को दाखमधु के स्रोत के रूप में बताता है। ‘बनता है’ प्राकृतिक हिंदी है और γίνεται के परिणाम/उत्पत्ति के भाव को व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग संकेतवाचक αὗται का संदर्भ और वाक्पटु बल
  choice: मुख्य पाठ में विषय को स्पष्ट रूप से ‘इन्हीं स्त्रियों’ कहा गया है।
  alternative: केवल ‘इन्होंने’ या ‘इन्हीं ने’ कहना।
  rationale: यह पद स्त्रियों की शक्ति और प्राथमिकता पर दिए जा रहे तर्क का भाग है। स्त्रीलिंग संदर्भ स्पष्ट करना यूनानी व्याकरण और तर्क की दिशा को सुरक्षित रखता है, बिना कोई सांप्रदायिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘अस्तित्व में आए’ मूल की अर्थगत व्यापकता रखता है, जबकि ‘पालन-पोषण किया’ पोषण और बड़ा करने दोनों भावों को समेटता है। पद के अंत का अल्पविराम व्यापक वाक्य-संदर्भ की निरंतरता दर्शाने हेतु रखा गया है।
