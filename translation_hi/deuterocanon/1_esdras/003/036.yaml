lexical_decisions:
- source_word: Ὁ δὲ τρίτος
  choice: परन्तु तीसरा व्यक्ति
  rationale: δέ के विरोध अथवा आगे बढ़ाने वाले भाव को ‘परन्तु’ से व्यक्त किया गया है। हिन्दी में केवल ‘तीसरा’ की अपेक्षा ‘तीसरा व्यक्ति’ अधिक स्वाभाविक है; ‘व्यक्ति’ प्रसंग से स्पष्ट निहित संज्ञा को व्यक्त करता है।
- source_word: ὁ εἴπας
  choice: जिसने ... कहा था
  rationale: संज्ञार्थक भूतकालिक कृदन्त उस व्यक्ति की पहचान उसके पहले दिए हुए कथन से कराता है। ‘कहा था’ मुख्य क्रिया से पहले की घटना को सहज हिन्दी में स्पष्ट करता है।
- source_word: περὶ τῶν γυναικῶν καὶ τῆς ἀληθείας
  choice: स्त्रियों और सत्य के विषय में
  rationale: περί के संबंधसूचक अर्थ को ‘के विषय में’ से व्यक्त किया गया है। यूनानी में दोनों विषय एक ही संबंधबोधक पद के अंतर्गत हैं; हिन्दी में यही रचना स्वाभाविक है। ἀλήθεια का सामान्य और प्रसंगानुकूल अनुवाद ‘सत्य’ है।
- source_word: οὗτός ἐστιν Ζοροβαβέλ
  choice: यह ज़ोरोबाबेल था
  rationale: यूनानी में वर्तमानकालीन पहचान है, पर भूतकालीन कथानक के बीच हिन्दी में कोष्ठकीय पहचान ‘यह ... था’ अधिक स्वाभाविक है और पहचान का बल बनाए रखती है।
- source_word: Ζοροβαβέλ
  choice: ज़ोरोबाबेल
  rationale: नाम को यूनानी रूप Ζοροβαβέλ के आधार पर देवनागरी में लिप्यंतरित किया गया है। परिचित इब्रानी-आधारित रूप ‘जरुब्बाबेल’ पादटिप्पणी में दिया गया है।
- source_word: ἤρξατο λαλεῖν
  choice: बोलने लगा
  rationale: ἄρχομαι और infinitive की आरम्भसूचक रचना को संक्षिप्त, स्वाभाविक हिन्दी ‘बोलने लगा’ से व्यक्त किया गया है।
