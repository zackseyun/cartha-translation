  yaml_path: translation/deuterocanon/1_esdras/003/029.yaml
  text: And those who do not serve in the army or fight[a], but farm the land, again, when they sow, after reaping they bring tribute to the king; and by compelling one another[b], they bring the taxes to the king.
translation:
  language: hi
  text: और जो लोग न तो सेना में सेवा करते हैं, न युद्ध करते हैं, बल्कि भूमि पर खेती करते हैं, वे फिर, जब वे बोते हैं, फसल काटने के बाद राजा को देय भेंट पहुँचाते हैं[a]; और एक-दूसरे को विवश करके[b] राजा को कर चुकाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “राजा के पास ले जाते हैं।” प्रसंग में इसका आशय राजा को देय उपज या भुगतान पहुँचाने से है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “एक-दूसरे को विवश करते हुए।” इससे संभवतः यह संकेत मिलता है कि लोग राजा का कर चुकवाने के लिए एक-दूसरे पर दबाव डालते थे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύονται
  choice: सेना में सेवा करते हैं
  rationale: यह क्रिया सैनिक सेवा या सैन्य अभियान में भाग लेने का बोध देती है; यह अनुवाद आगे आने वाले πολεμοῦσιν से भेद बनाए रखता है।
- source_word: πολεμοῦσιν
  choice: युद्ध करते हैं
  rationale: यह सरल और सीधा अनुवाद है, जो सैन्य सेवा और वास्तविक युद्ध करने के बीच यूनानी समानांतरता को सुरक्षित रखता है।
- source_word: γεωργοῦσιν τὴν γῆν
  choice: भूमि पर खेती करते हैं
  rationale: यह स्वाभाविक आधुनिक हिन्दी में कृषि-कार्य का अर्थ स्पष्ट करता है और मूल के निकट रहता है।
- source_word: ὅταν σπείρωσιν, θερίσαντες
  choice: बोने के बाद फसल काटकर
  rationale: ὅταν के साथ क्रिया बार-बार होने वाली प्रक्रिया बताती है; हिन्दी में यह क्रम—बोना, फिर काटना—संक्षेप और स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἀναφέρουσιν τῷ βασιλεῖ
  choice: राजा को उसका हिस्सा चुकाते हैं
  rationale: कर-संबंधी प्रसंग में ἀναφέρω शासक को देय वस्तु पहुँचाने या चुकाने का अर्थ रखता है। यूनानी में पहली बार वस्तु स्पष्ट नहीं है, इसलिए 'उसका हिस्सा' संदर्भ को समझने योग्य बनाता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: ἀναγκάζοντες ἕτερος τὸν ἕτερον
  choice: एक-दूसरे को विवश करके
  rationale: यह पारस्परिक दबाव या बाध्यता के स्पष्ट किन्तु अनिर्धारित भाव को बनाए रखता है और उसके तंत्र की अतिरिक्त व्याख्या नहीं करता।
- source_word: τοὺς φόρους
  choice: कर
  rationale: φόροι राजा को देय कर या राजस्व हैं; 'कर' सामान्य आधुनिक हिन्दी में सटीक और सहज है।
theological_decisions:
- issue: राजकीय भुगतान से संबंधित पहली, अव्यक्त वस्तु और बाद में स्पष्ट φόρους का अनुवाद
  choice: पहली बार 'राजा को उसका हिस्सा चुकाते हैं' और दूसरी बार 'राजा को कर चुकाते हैं'
  alternative: दोनों स्थानों पर 'कर चुकाते हैं' या पहली बार अधिक शाब्दिक 'राजा के पास ले जाते हैं'
  rationale: पहले खंड में यूनानी केवल 'राजा को ले जाते/चढ़ाते हैं' कहता है और वस्तु को व्यक्त नहीं करता, जबकि दूसरे में φόρους स्पष्ट है। चुना हुआ रूप सामान्य पाठक के लिए राजकीय देयता स्पष्ट करता है, पर दोनों अभिव्यक्तियों को पूरी तरह एक जैसा करके मूल की प्रगति मिटाता नहीं। यह कोई सांप्रदायिक या सिद्धान्तगत निर्णय नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की दो समानांतर गतिविधियाँ—खेती से राजकीय हिस्सा देना और परस्पर बाध्य करके कर देना—स्पष्ट रखी गई हैं।
