  yaml_path: translation/deuterocanon/1_esdras/003/027.yaml
  text: If she tells them to make war[a], one against another, they do it; but if she sends them out against the enemies, they go and tear down the mountains and the walls and the towers.
translation:
  language: hi
  text: यदि वह उनसे कहे कि वे एक-दूसरे के विरुद्ध युद्ध करें, तो वे वैसा ही करते हैं; और यदि वह उन्हें शत्रुओं के विरुद्ध भेजे, तो वे जाते हैं और पहाड़ों, दीवारों और मीनारों को ढहा देते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“ढहा देते हैं” के लिए अन्य सम्भव अनुवाद: “नष्ट कर देते हैं” या “उखाड़ फेंकते हैं।” यूनानी क्रिया κατεργάζονται यहाँ भूभाग और किलेबन्द संरचनाओं के विरुद्ध प्रबल कार्रवाई दर्शाती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ αὐτοῖς
  choice: यदि वह उनसे कहे
  rationale: शर्तसूचक प्रयोग को स्वाभाविक हिन्दी में रखा गया है। ‘कहे’ εἴπῃ के सामान्य अर्थ को बनाए रखता है और अनावश्यक रूप से औपचारिक ‘आज्ञा दे’ नहीं जोड़ता।
- source_word: ποιῆσαι πόλεμον
  choice: युद्ध करें
  rationale: यूनानी मुहावरे ‘युद्ध करना’ का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: ἕτερος πρὸς τὸν ἕτερον
  choice: एक-दूसरे के विरुद्ध
  rationale: परस्पर विरोध और यूनानी वाक्यांश के प्रत्यावर्ती भाव को स्पष्ट करता है।
- source_word: ποιοῦσιν
  choice: वे वैसा ही करते हैं
  rationale: यह पहले कही गई बात की ओर लौटता है और व्यापक क्रिया का स्वाभाविक हिन्दी प्रतिरूप है।
- source_word: ἐξαποστείλῃ αὐτοὺς πρὸς τοὺς πολεμίους
  choice: वह उन्हें शत्रुओं के विरुद्ध भेजे
  rationale: ἐξαποστείλῃ के भेजने तथा सैन्य संदर्भ में πρὸς के विरोधी दिशा-भाव, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: βαδίζουσιν
  choice: वे जाते हैं
  rationale: क्रिया के सामान्य अर्थ को बनाए रखता है; ‘कूच करते हैं’ जैसा अतिरिक्त सैन्य रंग नहीं जोड़ता।
- source_word: κατεργάζονται
  choice: ढा देते हैं
  rationale: पहाड़ों, दीवारों और मीनारों पर की गई प्रबल विध्वंसकारी कार्रवाई को ठोस हिन्दी में व्यक्त करता है, जबकि व्यापक अर्थ-संभावना को पादटिप्पणी में दर्ज किया गया है।
- source_word: τὰ ὄρη καὶ τὰ τείχη καὶ τοὺς πύργους
  choice: पहाड़ों, दीवारों और मीनारों
  rationale: तीनों संज्ञाओं के सीधे अर्थ और मूल की क्रमबद्ध सूची को सुरक्षित रखता है।
theological_decisions:
- issue: इस पद में स्त्रीलिंग एकवचन कर्ता का संदर्भ
  choice: ‘वह’ का प्रयोग, जिसका संदर्भ प्रसंग में वर्णित स्त्री है
  alternative: हर बार ‘वह स्त्री’ दोहराना
  rationale: यूनानी क्रियाओं में कर्ता अलग से व्यक्त नहीं है, पर निकटवर्ती प्रसंग स्त्री को संदर्भ बनाता है। ‘वह’ प्रवाह बनाए रखता है और स्रोत से परे कोई दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘मीनारों’ से रक्षात्मक towers का सीधा बोध होता है और ‘पहाड़ों’ को रूपकात्मक ‘गढ़ों’ में नहीं बदला गया है।
