  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ γυναῖκες
  choice: स्त्रियों ने
  rationale: बहुवचन कर्ता का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ἐγέννησαν
  choice: जन्म दिया
  rationale: क्रिया का सामान्य और स्पष्ट अर्थ; राजा तथा सभी लोगों—दोनों को इसके कर्म के रूप में बनाए रखता है।
- source_word: κυριεύει
  choice: प्रभुता करते हैं
  rationale: κυριεύω के शासन अथवा अधिकार रखने के भाव को व्यक्त करता है; निकटवर्ती सामूहिक संज्ञा λαός के अर्थानुसार हिन्दी में बहुवचन स्वाभाविक है।
- source_word: τῆς θαλάσσης καὶ τῆς γῆς
  choice: समुद्र और धरती पर
  rationale: यूनानी संबंधकारक यहाँ κυριεύει के साथ अधिकार के क्षेत्र को दर्शाता है; हिन्दी में ‘पर’ इसका स्वाभाविक रूप है।
