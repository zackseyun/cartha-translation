lexical_decisions:
- source_word: ὁ εἷς
  choice: एक ने
  rationale: शाब्दिक अर्थ ‘उस एक ने’ है; प्रसंग में यह प्रतियोगियों में से एक को दर्शाता है। हिन्दी में ‘एक ने’ स्वाभाविक और पर्याप्त है।
- source_word: ἔγραψεν
  choice: लिखा
  rationale: यह एओरिस्ट कथात्मक क्रिया है; सामान्य भूतकाल ‘लिखा’ घटनाक्रम को सहज रूप से व्यक्त करता है।
- source_word: Ὑπερισχύει
  choice: अधिक शक्तिशाली है
  rationale: क्रिया का अर्थ किसी से अधिक बलवान होना या प्रबल होना है। यूनानी में स्पष्ट सर्वोत्तमावस्था नहीं है, इसलिए ‘सबसे शक्तिशाली’ के बजाय तुलनात्मक अर्थ रखा गया है।
- source_word: ὁ οἶνος
  choice: दाखमधु
  rationale: सपद यूनानी संज्ञा यहाँ जातिवाचक अर्थ में है। ‘दाखमधु’ आधुनिक पाठक के लिए मदिरा का विशिष्ट, गरिमापूर्ण और स्पष्ट नाम है।
