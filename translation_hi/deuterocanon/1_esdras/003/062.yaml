  yaml_path: translation/deuterocanon/1_esdras/003/062.yaml
  text: And truth remains and is strong forever[b][a], and lives and prevails forever and ever.
translation:
  language: hi
  text: और सत्य सदा बना रहता है और सामर्थी है, और युगानुयुग जीवित रहता है और प्रबल होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम अभिव्यक्ति का शाब्दिक रूप ‘युग के युग तक’ है; यह एक प्रबलित मुहावरा है, जिसका अर्थ ‘युगानुयुग’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: यह अमूर्त संज्ञा यहाँ मानवीकृत ढंग से क्रियाओं का कर्ता है; ‘सत्य’ स्वाभाविक हिंदी में इसी प्रभाव को बनाए रखता है।
- source_word: μένει
  choice: बना रहता है
  rationale: यह निरंतर बने रहने या टिके रहने का अर्थ स्पष्ट, आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἰσχύει
  choice: सामर्थी होता है
  rationale: यह ἰσχύει की सामर्थ्य का भाव रखता और बाद के κρατεῖ (‘प्रबल होता है’) से दोनों क्रियाओं का भेद बनाए रखता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यूनानी कालवाचक मुहावरे का सहज हिंदी समतुल्य है।
- source_word: ζῇ
  choice: जीवित रहता है
  rationale: सत्य के मानवीकरण को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: κρατεῖ
  choice: प्रबल होता है
  rationale: यह प्रभावी सामर्थ्य और विजय का भाव देता है, पर ἰσχύει के साथ पूर्ण समानता नहीं पैदा करता।
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: युगानुयुग
  rationale: शाब्दिक ‘युग के युग तक’ के स्थान पर यह तीव्र कालवाचक अभिव्यक्ति का प्रतिष्ठित और बोधगम्य हिंदी रूप है।
theological_decisions:
- issue: सत्य का मानवीकरण
  choice: ‘बना रहता,’ ‘सामर्थी होता,’ ‘जीवित रहता’ और ‘प्रबल होता’ जैसी क्रियाओं द्वारा मानवीकरण बनाए रखा गया।
  alternative: वाक्य को केवल अमूर्त कथन बनाना, जैसे ‘सत्य चिरस्थायी और शक्तिशाली है।’
  rationale: यूनानी पाठ सत्य को लगातार सजीव क्रियाओं का कर्ता बनाता है; इसे बनाए रखने से अतिरिक्त धर्मवैज्ञानिक पहचान जोड़े बिना मूल की स्तुतिपरक शक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। समांतर क्रियात्मक संरचना और सत्य का मानवीकरण सुरक्षित रखा गया है; ‘सामर्थी’ तथा ‘प्रबल’ से ἰσχύει और κρατεῖ का भेद व्यक्त किया गया है।
