  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and to have a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
translation:
  language: hi
  text: और बैंगनी वस्त्र पहनने, सोने के पात्रों से पीने[a], सोने पर सोने[b], सोने की लगाम वाला रथ रखने[c], महीन लिनन की पगड़ी पहनने और गले में हार पहनने,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में सोने की वस्तुओं के द्वारा पीने की बात है; वे प्याले या अन्य पात्र हो सकते हैं, पर पात्र का ठीक प्रकार नहीं बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘सोने पर सोना’ है; सम्भवतः आशय सोने से सजे पलंग या आसन पर सोने से है, पर यूनानी पाठ संक्षिप्त है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘सोने की साज वाला रथ’ भी हो सकता है; यूनानी विशेषण रथ को उसकी सोने की लगाम या साज के द्वारा वर्णित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: बैंजनी वस्त्र पहनने
  rationale: πορφύρα का शाब्दिक अर्थ बैंजनी कपड़ा या रंग है और यहाँ पहनने की क्रिया के साथ वस्त्र का अर्थ स्वाभाविक है। ‘बैंजनी वस्त्र’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: ἐν χρυσώμασιν πίνειν
  choice: सोने के पात्रों से पीने
  rationale: χρυσώματα सोने की बनी वस्तुओं को सूचित करता है; पीने के संदर्भ में ये पात्र हैं, पर यूनानी पाठ किसी विशेष प्रकार के प्याले का नाम नहीं देता।
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: सोने पर सोने
  rationale: यूनानी अभिव्यक्ति संक्षिप्त और कुछ अस्पष्ट है। सम्भावित आशय सोने से सजा पलंग या आसन है, पर मूल पाठ में पलंग नहीं कहा गया; इसलिए उसका तनाव बनाए रखा गया है।
- source_word: ἅρμα χρυσοχάλινον
  choice: सोने की लगाम वाला रथ
  rationale: χρυσοχάλινος एक संयुक्त विशेषण है जिसका संबंध सोने की लगाम अथवा साज से है। एकवचन ‘लगाम वाला’ यूनानी विशेषण की संक्षिप्तता को स्वाभाविक हिन्दी में रखता है।
- source_word: κίδαριν βυσσίνην
  choice: महीन मलमल की पगड़ी
  rationale: κίδαρις सिर पर बाँधी जाने वाली पगड़ी या शिरोवस्त्र है और βύσσινος उत्तम, महीन लिनन को दर्शाता है। ‘महीन मलमल’ सामान्य पाठक के लिए परिचित और गरिमापूर्ण है।
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: गले में हार
  rationale: μανιάκης गले में पहना जाने वाला हार, कंठाभूषण या जंजीर है। ‘गले में हार’ सहज हिन्दी है और περὶ τὸν τράχηλον का स्थान-सूचक अर्थ भी बनाए रखता है।
