  yaml_path: translation/deuterocanon/1_esdras/003/020.yaml
  text: and it makes every heart rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: hi
  text: और वह हर हृदय को धनवान बना देती है, और न राजा को न क्षत्रप को याद रखती है; और वह सबको तोड़ों के हिसाब से बोलने पर मजबूर करती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से, “वह सबको/सब कुछ को तोड़ों के द्वारा बोलने को करती है।” ‘तोड़’ प्राचीन काल की भार और धन की एक बड़ी इकाई थी। भावार्थ हो सकता है: “वह सबको धन की बातें करने पर मजबूर करती है।”'
    reason: यूनानी πάντα रूपतः ‘सब कुछ’ भी हो सकता है, यद्यपि ‘बोलने’ के कारण संदर्भ में ‘सबको’ स्वाभाविक है। διὰ ταλάντων का शाब्दिक अर्थ और धन-संबंधी मुहावरेदार आशय दोनों सुरक्षित रखे गए हैं।
lexical_decisions:
- source_word: πάσας καρδίας ποιεῖ πλουσίας
  choice: हर हृदय को धनवान बना देती है
  rationale: यह यूनानी रूपक और आर्थिक बिंब दोनों को बनाए रखता है। ‘हृदय’ यहाँ केवल भावनाओं को नहीं, बल्कि भीतरी मनुष्य को सूचित कर सकता है।
- source_word: οὐ μέμνηται
  choice: ध्यान नहीं रखती
  rationale: क्रिया का मूल अर्थ ‘स्मरण करना/मन में रखना’ है, पर यहाँ आशय पद या प्रतिष्ठा का लिहाज़ न करने से है। यह हिन्दी में स्वाभाविक रहते हुए उस अर्थ को व्यक्त करता है।
- source_word: βασιλέα οὐδὲ σατράπην
  choice: न राजा ... न क्षत्रप
  rationale: ‘क्षत्रप’ फ़ारसी प्रशासनिक पद की ऐतिहासिक विशिष्टता को सुरक्षित रखता है; इसे सामान्य ‘राज्यपाल’ नहीं बनाया गया।
- source_word: πάντα
  choice: सबको
  rationale: रूप की दृष्टि से यह नपुंसकलिंग बहुवचन ‘सब कुछ’ भी हो सकता है, पर ‘बोलने’ की क्रिया के कारण प्रसंग में व्यक्तियों का अर्थ अधिक स्वाभाविक है। पाठ की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: διὰ ταλάντων
  choice: तोड़ों की भाषा में
  rationale: τάλαντον भार और मुद्रा की इकाई था। यह चयन धन-संबंधी आशय को समझने योग्य बनाते हुए ऐतिहासिक इकाई ‘तोड़’ को बनाए रखता है।
- source_word: λαλεῖν
  choice: बोलने लगाती है
  rationale: ποιεῖ के कारक भाव और λαλεῖν के सामान्य अर्थ ‘बोलना’ को स्वाभाविक हिन्दी में संयुक्त रूप से व्यक्त किया गया है।
