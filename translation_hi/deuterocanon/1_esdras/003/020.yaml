  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘क्षत्रप’ और ‘तोड़’ ऐतिहासिक रंग बनाए रखते हैं; ‘तोड़’ का अर्थ पादटिप्पणी में स्पष्ट किया गया है। स्त्रीलिंग क्रियाएँ प्रसंग के निहित कर्ता—मदिरा—के अनुरूप हैं।
