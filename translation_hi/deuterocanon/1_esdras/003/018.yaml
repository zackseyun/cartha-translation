  yaml_path: translation/deuterocanon/1_esdras/003/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich;
translation:
  language: hi
  text: वह राजा और अनाथ के मन को एक-सा कर देती है, दास[a] और स्वतंत्र व्यक्ति के मन को, और निर्धन और धनी के मन को भी एक-सा कर देती है;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घरेलू सेवक’। यूनानी शब्द का यह अर्थ भी हो सकता है, यद्यपि यहाँ ‘स्वतंत्र व्यक्ति’ के साथ उसका विरोध ‘दास’ अर्थ को अधिक संभावित बनाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: एक-सा कर देती है
  rationale: यह वर्तमान काल में किसी अवस्था को उत्पन्न करने का सक्रिय भाव व्यक्त करता है। हिंदी में ‘एक-सा कर देती है’ μίαν के साथ मिलकर स्वाभाविक और स्पष्ट है।
- source_word: διάνοιαν
  choice: मन
  rationale: यहाँ शब्द भीतरी सोच, समझ या मानसिक प्रवृत्ति को दर्शाता है। ‘मन’ सामान्य आधुनिक हिंदी में सहज है और अर्थ को किसी एक संकीर्ण मानसिक क्रिया तक सीमित नहीं करता।
- source_word: μίαν
  choice: एक-सा
  rationale: यूनानी विशेषण विभिन्न सामाजिक स्थितियों वाले लोगों के मन को एक ही अवस्था में ले आने पर बल देता है। ‘एक-सा’ हिंदी में तुलना का आशय स्वाभाविक रूप से प्रकट करता है।
- source_word: βασιλέως
  choice: राजा
  rationale: यह मूल शब्द का सामान्य और सीधा अर्थ है।
- source_word: ὀρφανοῦ
  choice: अनाथ
  rationale: यह आधुनिक हिंदी में स्वाभाविक है और मूल में निहित असुरक्षित सामाजिक स्थिति को बनाए रखता है।
- source_word: οἰκέτου
  choice: दास
  rationale: οἰκέτης घरेलू सेवक या दास को सूचित कर सकता है, पर ἐλευθέρου, अर्थात ‘स्वतंत्र व्यक्ति’, के साथ स्पष्ट विरोध बंधी हुई सामाजिक स्थिति की ओर संकेत करता है।
- source_word: ἐλευθέρου
  choice: स्वतंत्र व्यक्ति
  rationale: यह सामाजिक रूप से स्वतंत्र व्यक्ति को दास के विपरीत रखता है और हिंदी में केवल अमूर्त ‘स्वतंत्र’ कहने से अधिक स्पष्ट है।
- source_word: πένητος
  choice: निर्धन
  rationale: यह आर्थिक अभाव वाले व्यक्ति के लिए प्रतिष्ठित और सहज हिंदी शब्द है तथा धनी के साथ स्पष्ट विरोध बनाता है।
- source_word: πλουσίου
  choice: धनी
  rationale: यह मूल का सीधा अर्थ है और ‘निर्धन’ का स्वाभाविक प्रतिलोम है।
theological_decisions:
- issue: οἰκέτου को सामाजिक स्थिति के विरोध में कैसे व्यक्त किया जाए
  choice: दास
  alternative: सेवक या घरेलू सेवक
  rationale: पद में οἰκέτου का विरोध ἐλευθέρου, ‘स्वतंत्र व्यक्ति’, से है। इसलिए केवल सेवा करने के बजाय पराधीन या बंधी सामाजिक स्थिति यहाँ अधिक संभावित है; फिर भी शब्द की शाब्दिक व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। यूनानी में एक बार आए ‘मन’ और ‘एक’ के भाव को हिंदी में प्रत्येक जोड़ी के साथ स्पष्ट करके वाक्य को स्वाभाविक बनाया गया है। स्त्रीलिंग ‘कर देती है’ पिछले संदर्भ में निहित स्त्रीलिंग कर्ता के अनुरूप है।
