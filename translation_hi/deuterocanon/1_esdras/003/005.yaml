  yaml_path: translation/deuterocanon/1_esdras/003/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever's statement is shown to be wiser than the other's, Darius the king will give him great gifts and great victory honors[b],
translation:
  language: hi
  text: “हममें से हर एक एक ऐसी बात कहे जो प्रबल ठहरे[a]; और जिसकी कही हुई बात दूसरे की बात से अधिक बुद्धिमत्तापूर्ण सिद्ध हो, उसे राजा दारा बड़े-बड़े उपहार और विजय के बड़े सम्मान[b] देगा,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक बात’ का अनुवाद ‘एक कथन’ या ‘एक तर्क’ भी हो सकता है; यूनानी λόγον के ये सभी अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘विजय के सम्मान’ यूनानी ἐπινίκια का अनुवाद है, जिसका अर्थ विजय पर दिए जाने वाले सम्मान या पुरस्कार हैं; यह पहले आए ‘उपहारों’ से अलग पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν
  choice: हममें से ... कहे
  rationale: पहले पुरुष बहुवचन का यह प्रोत्साहनात्मक संभावनार्थक रूप है। हिन्दी में ‘हममें से हर एक ... कहे’ इसकी सामूहिक प्रेरणा और प्रत्येक व्यक्ति पर लागू होने वाला भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἕκαστος ἡμῶν
  choice: हममें से हर एक
  rationale: यह पद प्रत्येक सहभागी को अलग-अलग इंगित करता है; चुना हुआ रूप उसके वितरणात्मक बल को बनाए रखता है।
- source_word: ἕνα λόγον
  choice: एक बात
  rationale: λόγος यहाँ केवल एक शब्द नहीं, बल्कि कही हुई बात, कथन या तर्क भी हो सकता है। ‘एक बात’ हिन्दी में स्वाभाविक है और मूल की संक्षिप्त चुनौती को बनाए रखता है।
- source_word: ὃς ὑπερισχύσει
  choice: जो सबसे प्रबल ठहरे
  rationale: ὑπερισχύω का अर्थ प्रबल होना या बाज़ी मारना है। प्रसंग में कई कथनों की प्रतियोगिता है, इसलिए ‘सबसे प्रबल ठहरे’ अभिप्रेत तुलनात्मक बल को स्पष्ट करता है, बिना उसे केवल ‘जीते’ तक सीमित किए।
- source_word: οὗ ἂν φανῇ
  choice: जिसकी ... सिद्ध हो
  rationale: ἄν सहित संबंधवाचक रचना अनिश्चित व्यक्ति को सूचित करती है, और φανῇ का भाव प्रकट या सिद्ध होने का है। ‘जिसकी ... सिद्ध हो’ हिन्दी में सहज है।
- source_word: τὸ ῥῆμα αὐτοῦ
  choice: उसकी कही हुई बात
  rationale: ῥῆμα यहाँ प्रतियोगी द्वारा कही गई बात को दर्शाता है। यह रूप संदर्भ स्पष्ट करता है और पहले λόγον के अनुवाद से स्वाभाविक संबंध बनाए रखता है।
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: दूसरे की बात से अधिक बुद्धिमानी की
  rationale: σοφώτερον तुलनात्मक ‘अधिक बुद्धिमानी की’ है और τοῦ ἑτέρου तुलना का संबंध बताता है। हिन्दी में तुलना स्पष्ट करने के लिए ‘दूसरे की बात से’ कहा गया है।
- source_word: Δαρεῖος ὁ βασιλεὺς
  choice: राजा दारा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप ‘दारा’ रखा गया है; उपाधि को हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: δωρεὰς μεγάλας
  choice: बड़े-बड़े उपहार
  rationale: δωρεά भेंट या उपहार है और μέγας उसकी महत्ता दर्शाता है। हिन्दी का पुनरुक्त रूप उदार और उल्लेखनीय उपहारों का भाव स्वाभाविक ढंग से देता है।
- source_word: ἐπινίκια μεγάλα
  choice: विजय के बड़े सम्मान
  rationale: ἐπινίκια विजय से जुड़े पुरस्कार या सम्मान हैं। ‘सम्मान’ इसे पहले आए भौतिक ‘उपहारों’ से अलग रखता है।
