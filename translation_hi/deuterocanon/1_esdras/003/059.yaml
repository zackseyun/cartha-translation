  yaml_path: translation/deuterocanon/1_esdras/003/059.yaml
  text: Is not the one who does these things great? And truth is great, and stronger than everything[a][b].
translation:
  language: hi
  text: जो ये काम करता है, क्या वह महान नहीं है?[a] और सत्य महान है और हर चीज़ से अधिक शक्तिशाली है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जो ये काम करता है।” यूनानी में यह स्पष्ट नहीं किया गया कि यह किसकी ओर संकेत करता है; व्यापक सन्दर्भ परमेश्वर की ओर संकेत कर सकता है, पर इस खंड में नाम नहीं दिया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “सब वस्तुओं से अधिक शक्तिशाली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: क्या ... नहीं है?
  rationale: यह नकारात्मक आलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर ‘हाँ’ है। यह रूप हिन्दी में स्वाभाविक रहते हुए मूल का प्रश्नात्मक बल बनाए रखता है।
- source_word: μέγας
  choice: महान
  rationale: यह पद हैसियत, महत्त्व या सामर्थ्य की महानता व्यक्त करता है। ‘महान’ सीधा और गरिमापूर्ण समतुल्य है।
- source_word: ὃς
  choice: वह ... जो
  rationale: सम्बन्धवाचक सर्वनाम यहाँ संज्ञा के समान प्रयुक्त है। ‘वह ... जो’ एकवचन व्यक्तिगत कर्ता को बनाए रखता है, पर उसकी पहचान नहीं बताता।
- source_word: ταῦτα
  choice: ये काम
  rationale: बहुवचन संकेतवाचक पद पहले बताए गए कार्यों की ओर संकेत करता है। हिन्दी में ‘ये काम’ उस सन्दर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ποιεῖ
  choice: करता है
  rationale: व्यापक क्रिया ‘करना’ पहले वर्णित कार्यों को करने के अर्थ में सहज हिन्दी है।
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: यहाँ शब्द सत्य या वास्तविकता को व्यक्त करता है, न कि केवल व्यक्तिगत विश्वसनीयता को। हिन्दी में ‘सत्य’ बिना अनावश्यक व्याख्या के मूल अर्थ रखता है।
- source_word: ἰσχυροτέρα
  choice: अधिक शक्तिशाली
  rationale: तुलनात्मक विशेषण श्रेष्ठ सामर्थ्य व्यक्त करता है। ‘अधिक शक्तिशाली’ तुलना को स्पष्ट और आधुनिक हिन्दी में स्वाभाविक रखता है।
- source_word: παρὰ πάντα
  choice: हर चीज़ से
  rationale: यह वाक्यांश समस्त वस्तुओं के साथ तुलना करता है। ‘हर चीज़ से’ सार्वभौमिक दायरा और तुलनात्मक ‘से’ दोनों बनाए रखता है।
theological_decisions:
- issue: ‘जो ये काम करता है’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में कर्ता की पहचान अनिर्दिष्ट रखी गई
  alternative: सन्दर्भ के आधार पर इसे स्पष्ट रूप से परमेश्वर कहना
  rationale: यूनानी वाक्य इस खण्ड में परमेश्वर का नाम स्पष्ट रूप से नहीं लेता। व्यापक सन्दर्भ ऐसा संकेत दे सकता है, पर अनुवाद मूल की अन्तर्निहित अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘वह ... जो’ ने अनिर्दिष्ट एकवचन कर्ता को बनाए रखा है; ‘हर चीज़ से अधिक शक्तिशाली’ सामान्य पाठक के लिए स्वाभाविक है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
