base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/060.yaml
  text: All the earth calls on truth[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: hi
  text: सारी पृथ्वी सत्य को पुकारती है[a], और आकाश उसे आशीष देता है; सभी कार्य हिलते और काँपते हैं, और उसके साथ[b] कोई भी अन्याय नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का शाब्दिक अर्थ ‘सत्य को पुकारती है’ है; इसका अर्थ ‘सत्य का आह्वान करती है’ भी हो सकता है। यहाँ मानवीकृत सत्य के जयघोष का भाव भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम उपवाक्य में यूनानी में μετʼ αὐτοῦ, अर्थात् ‘उसके साथ,’ है; αὐτοῦ का रूप पुल्लिंग/नपुंसकलिंग है, जबकि इससे पहले ‘सत्य’ के लिए स्त्रीलिंग रूप आया है। अनुवाद प्रसंग के अनुसार इसे सत्य का ही संदर्भ मानता है।
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: सारी पृथ्वी
  rationale: आकाश के साथ रखे जाने के कारण γῆ का आशय किसी सीमित भूभाग के बजाय पूरी पृथ्वी है।
- source_word: τὴν ἀλήθειαν
  choice: सत्य
  rationale: ἀλήθεια यहाँ अमूर्त गुण होते हुए भी मानवीकृत है; ‘सत्य’ दोनों अर्थ-स्तरों को बनाए रखता है।
- source_word: καλεῖ
  choice: पुकारती है
  rationale: यह सीधा कर्म लेने वाली क्रिया है और सत्य को पुकारने, उसका आह्वान करने या उसकी जय बोलने का भाव दे सकती है; हिन्दी में ‘पुकारती है’ इस खुलापन को पर्याप्त रूप से बनाए रखता है।
- source_word: ὁ οὐρανὸς
  choice: आकाश
  rationale: ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और पृथ्वी के साथ ब्रह्मांडीय समानांतरता बनाए रखता है।
- source_word: εὐλογεῖ
  choice: आशीष देता है
  rationale: यह εὐλογέω का प्रचलित बाइबलीय प्रतिरूप है और ऊँचे किंतु सुबोध भाषा-स्तर के अनुकूल है।
- source_word: πάντα τὰ ἔργα
  choice: सभी कार्य
  rationale: ἔργα का मूल अर्थ ‘कार्य’ है। इसे ‘सारी सृष्टि’ करने से संभावित अर्थ स्पष्ट तो होता, पर मूल की व्यापकता अनावश्यक रूप से सीमित हो जाती।
- source_word: σείεται καὶ τρέμει
  choice: हिलते और काँपते हैं
  rationale: दोनों क्रियाओं को अलग रखकर यूनानी की तीव्रता और समानांतरता सुरक्षित की गई है।
- source_word: μετʼ αὐτοῦ
  choice: उसके साथ
  rationale: वाक्य का आशय सत्य की ओर लौटता है। हिन्दी सर्वनाम यहाँ लिंग प्रकट नहीं करता, इसलिए अर्थ स्वाभाविक रहता है और यूनानी की व्याकरणिक असंगति पाद-टिप्पणी में बताई गई है।
- source_word: ἄδικον οὐδέν
  choice: कुछ भी अन्यायपूर्ण नहीं
  rationale: यह ἄδικον οὐδέν का निकट, संक्षिप्त और आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: सत्य का मानवीकरण
  choice: सत्य को ऐसी सत्ता के रूप में बनाए रखना जिसे पृथ्वी पुकारती और आकाश आशीष देता है
  alternative: सत्य को केवल निराकार गुण मानकर मानवीकरण को समतल कर देना
  rationale: यूनानी कथन सत्य को ब्रह्मांडीय स्वीकृति पाने वाली मानवीकृत वास्तविकता के रूप में प्रस्तुत करता है; अनुवाद इस साहित्यिक और धर्मवैचारिक तनाव को बनाए रखता है।
- issue: अंतिम उपवाक्य में सर्वनाम का लिंग
  choice: संदर्भ के अनुसार सर्वनाम को सत्य से जोड़ना और स्रोत की असंगति पाद-टिप्पणी में बताना
  alternative: उसे यांत्रिक रूप से ‘उस पुरुष/उस वस्तु के साथ’ कहना, अथवा असंगति को बिना सूचना चुपचाप सुधार देना
  rationale: प्रसंग स्पष्टतः सत्य की ओर संकेत करता है, किंतु उपलब्ध यूनानी पाठ में सर्वनाम पहले आए स्त्रीलिंग संज्ञा से मेल नहीं खाता। मुख्य पाठ अर्थ का अनुसरण करता है और पाद-टिप्पणी पाठ-साक्ष्य को पारदर्शी रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सत्य को पुकारती है’ मूल की संभावित आह्वान/जयघोष संबंधी अस्पष्टता को बनाए रखता है। ‘सभी कार्य’ जानबूझकर ‘सारी सृष्टि’ से अधिक औपचारिक और स्रोत-निकट है।
