  yaml_path: translation/deuterocanon/1_esdras/003/045.yaml
  text: And from this you must know that women rule over you. Do you not labor and toil[a], and give and bring everything to women?
translation:
  language: hi
  text: और इसी से तुम्हें जान लेना चाहिए कि स्त्रियाँ तुम पर शासन करती हैं। क्या तुम मेहनत और परिश्रम नहीं करते, और सब कुछ स्त्रियों को देते और पहुँचाते नहीं हो?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्त्रियों’ के स्थान पर ‘पत्नियों’ का अर्थ भी संभव है, यद्यपि यहाँ यूनानी बहुवचन का अर्थ अधिक व्यापक है; इसलिए मुख्य पाठ में ‘स्त्रियाँ’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντεῦθεν
  choice: इसी से
  rationale: यह पिछले उदाहरणों से निकाले जाने वाले निष्कर्ष की ओर संकेत करता है; ‘इसी से’ इसके संकेतात्मक बल को बनाए रखता है।
- source_word: δεῖ ὑμᾶς γνῶναι
  choice: तुम्हें जान लेना चाहिए
  rationale: δεῖ आवश्यकता व्यक्त करता है और γνῶναι पहचानकर जानने का भाव रखता है; यह हिंदी में कथन का आग्रह स्वाभाविक रूप से व्यक्त करता है।
- source_word: γυναῖκες
  choice: स्त्रियाँ
  rationale: यूनानी बहुवचन सामान्य रूप से ‘स्त्रियाँ’ है; संदर्भ में पत्नियाँ सम्मिलित हो सकती हैं, पर कथन केवल उन्हीं तक सीमित नहीं है।
- source_word: κυριεύουσιν ὑμῶν
  choice: तुम पर शासन करती हैं
  rationale: यह वाक्यांश प्रभुत्व या अधिकार चलाने का प्रबल अर्थ देता है; ‘शासन करती हैं’ सीधे और गरिमापूर्ण ढंग से इसे व्यक्त करता है।
- source_word: πονεῖτε καὶ μοχθεῖτε
  choice: कठिन परिश्रम और मेहनत करते
  rationale: दोनों निकटार्थक क्रियाओं का संचयी बल बनाए रखने के लिए हिंदी में दो अभिव्यक्तियाँ रखी गई हैं।
- source_word: πάντα
  choice: सब कुछ
  rationale: यह मूल के व्यापक और समग्र अर्थ को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: δίδοτε καὶ φέρετε
  choice: दे और पहुँचा देते
  rationale: दोनों यूनानी क्रियाओं को अलग रखा गया है; φέρετε का संदर्भानुकूल अर्थ किसी के पास वस्तुएँ लाना या पहुँचाना है।
