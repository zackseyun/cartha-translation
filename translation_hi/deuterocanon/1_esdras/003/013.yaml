translation:
  language: hi
  text: और जब राजा जागा, तब उन्होंने वह पत्र लेकर उसे दिया, और उसने उसे पढ़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγέρθη
  choice: जागा
  rationale: यहाँ ἐξεγείρω का अओरिस्ट कर्मवाच्य रूप नींद से जागने के अकर्मक अर्थ में प्रयुक्त है। आधुनिक हिन्दी में ‘जागा’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: λαβόντες
  choice: लेकर
  rationale: पूर्वकालिक कृदन्त को हिन्दी के सहज संयुक्त क्रियात्मक क्रम ‘लेकर ... दिया’ से व्यक्त किया गया है; इससे पहले पत्र लेने और फिर देने का क्रम बना रहता है।
- source_word: τὸ γράμμα
  choice: वह पत्र
  rationale: γράμμα यहाँ पहले तैयार किए गए लिखित कथन को सूचित करता है। ‘पत्र’ स्वाभाविक है, और निश्चित पदबंध को प्रसंग-सूचक ‘वह’ से व्यक्त किया गया है।
- source_word: ἔδωκαν αὐτῷ
  choice: उसे दिया
  rationale: अओरिस्ट क्रिया और अप्रत्यक्ष कर्म का सीधा अनुवाद है। पत्र का उल्लेख पिछले पदांश में होने के कारण हिन्दी में अलग से ‘वह’ दोहराना आवश्यक नहीं।
- source_word: ἀνέγνω
  choice: उसने उसे पढ़ा
  rationale: यूनानी में कर्म प्रसंग से निहित है; हिन्दी की स्पष्टता और सहजता के लिए ‘उसे’ जोड़ा गया है, जिसका संकेत पत्र की ओर है।
