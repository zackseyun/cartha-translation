  yaml_path: translation/deuterocanon/1_esdras/003/007.yaml
  text: And he will be seated second to Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: hi
  text: और अपनी बुद्धि के कारण उसे दारा के बाद दूसरे स्थान पर बैठाया जाएगा[a], और वह दारा का संबंधी कहलाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह दारा के बाद दूसरे स्थान पर बैठेगा।” यूनानी क्रिया बैठने या किसी पद पर स्थापित किए जाने—दोनों का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: “संबंधी” से वास्तविक रिश्तेदार या राजा की विशेष कृपा और निकटता दर्शाने वाली सम्मानसूचक दरबारी पदवी अभिप्रेत हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: दूसरे स्थान पर
  rationale: यह पद या क्रम में दूसरा होने का बोध कराता है; राजदरबार के प्रसंग में दारा के ठीक नीचे की प्रतिष्ठा स्वाभाविक अर्थ है।
- source_word: καθιεῖται
  choice: बैठाया जाएगा
  rationale: यूनानी क्रिया बैठाए जाने के ठोस दरबारी चित्र के साथ किसी पद पर स्थापित किए जाने का संकेत दे सकती है; हिन्दी में कर्मवाच्य मूल रूप और भाव दोनों को बनाए रखता है।
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: अपनी बुद्धि के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है; यह अनुवाद उस स्पष्ट कारणात्मक संबंध को स्वाभाविक हिन्दी में रखता है।
- source_word: συγγενής
  choice: संबंधी
  rationale: यह शब्द सामान्यतः रक्त या परिवार के रिश्तेदार को दर्शाता है, पर राजदरबार में सम्मानसूचक निकटता भी सूचित कर सकता है; ‘संबंधी’ पारिवारिक भाषा को बिना अर्थ सीमित किए बनाए रखता है।
- source_word: κληθήσεται
  choice: कहलाएगा
  rationale: यह καλέω का भविष्यत् कर्मवाच्य रूप है; ‘कहलाएगा’ हिन्दी में सीधा और स्वाभाविक समतुल्य है।
