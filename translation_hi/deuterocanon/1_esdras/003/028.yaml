  yaml_path: translation/deuterocanon/1_esdras/003/028.yaml
  text: They kill and are killed[a], and they do not disobey the king’s word; and if they are victorious, they bring everything to the king[b], and whatever else they plunder.
translation:
  language: hi
  text: वे मारते हैं और मारे जाते हैं, और राजा की आज्ञा[a] का उल्लंघन नहीं करते। यदि वे विजयी होते हैं, तो वे सब कुछ राजा के पास ले आते हैं—जो कुछ वे लूटते हैं, और बाकी सब भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “राजा का वचन” है; यहाँ इसका अर्थ राजा की आज्ञा या आदेश है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φονεύουσιν καὶ φονεύονται
  choice: वे लोगों को मार डालते हैं और स्वयं भी मारे जाते हैं
  rationale: सक्रिय और कर्मवाच्य के संतुलन को बनाए रखता है। सैन्य प्रसंग में ‘हत्या करते हैं’ अनावश्यक रूप से कानूनी या नैतिक अर्थ दे सकता है; ‘स्वयं भी’ हिन्दी में विरोधी समानांतरता स्पष्ट करता है, बिना पारस्परिक हत्या का अर्थ जोड़े।
- source_word: τὸν λόγον τοῦ βασιλέως οὐ παραβαίνουσιν
  choice: राजा की आज्ञा का उल्लंघन नहीं करते
  rationale: यहाँ λόγος राजा के बोले हुए आदेश को सूचित करता है और παραβαίνω का अर्थ उसके विरुद्ध जाना या उसका उल्लंघन करना है। यह हिन्दी में स्वाभाविक रहते हुए यूनानी संरचना का भाव सुरक्षित रखता है।
- source_word: ἐὰν δὲ νικήσωσιν
  choice: यदि वे विजयी होते हैं
  rationale: νικάω के विजय-संबंधी अर्थ को औपचारिक किन्तु सहज हिन्दी में व्यक्त करता है; ‘जीतते हैं’ भी संभव है, पर ‘विजयी होते हैं’ सैन्य प्रसंग के अनुरूप है।
- source_word: τῷ βασιλεῖ κομίζουσιν πάντα
  choice: वे सब कुछ राजा के पास ले आते हैं
  rationale: κομίζω वस्तुओं को किसी व्यक्ति तक पहुँचाने या वापस लाने का भाव देता है। ‘ले आते हैं’ हिन्दी में इस दिशा और सुपुर्दगी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐὰν προνομεύσωσιν
  choice: जो कुछ वे लूटते हैं
  rationale: दुर्लभ क्रिया युद्ध में लूट या माल हथियाने को सूचित करती है। हिन्दी में ‘लूटते हैं’ स्पष्ट और प्रसंगानुकूल है।
- source_word: καὶ τὰ ἄλλα πάντα
  choice: और बाकी सब भी
  rationale: वाक्य के अंतिम व्यापक योग को सुरक्षित रखता है और προηγούμενο क्रियापद κομίζουσιν को अर्थ की दृष्टि से लागू मानता है।
