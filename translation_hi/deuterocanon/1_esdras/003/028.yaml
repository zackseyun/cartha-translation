translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य प्रसंग में अत्यधिक पुरातन ‘वध करते हैं’ से बचते हुए ‘मार डालते हैं’ चुना गया है। अंतिम यूनानी खंड की संक्षिप्त और कुछ असामान्य रचना को हिन्दी में डैश और समानांतर पदों द्वारा पठनीय बनाया गया है, पर उसका व्यापक ‘बाकी सब भी’ अर्थ बनाए रखा गया है।
