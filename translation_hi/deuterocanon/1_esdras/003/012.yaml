  yaml_path: translation/deuterocanon/1_esdras/003/012.yaml
  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: hi
  text: तीसरे ने लिखा[a], “स्त्रियाँ अधिक शक्तिशाली हैं, पर सबसे बढ़कर सत्य विजयी होता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्त्रियाँ प्रबल होती हैं, पर सत्य सब कुछ जीत लेता है।”
    reason: Ὑπερισχύουσιν और νικᾷ के वैकल्पिक, अधिक क्रियात्मक अनुवाद को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ὁ τρίτος
  choice: तीसरे ने
  rationale: लेखयुक्त क्रमवाचक शब्द यहाँ संज्ञा की तरह प्रयुक्त है और प्रतियोगिता के तीसरे सहभागी को दर्शाता है; हिन्दी में कर्ता-चिह्न ‘ने’ के साथ ‘तीसरे’ स्वाभाविक है।
- source_word: ἔγραψεν
  choice: लिखा
  rationale: γράφω के अओरिस्ट का सीधा अर्थ ‘लिखा’ है; प्रसंग में प्रत्येक सहभागी अपना कथन लिखता है।
- source_word: Ὑπερισχύουσιν
  choice: अधिक शक्तिशाली हैं
  rationale: क्रिया श्रेष्ठ बल रखने या अधिक प्रबल होने का भाव देती है। यह अनुवाद अगले νικᾷ से शब्दगत भेद बनाए रखता है।
- source_word: αἱ γυναῖκες
  choice: स्त्रियाँ
  rationale: कथन सामान्य और सूक्तिपरक है, इसलिए यहाँ ‘पत्नियाँ’ के बजाय व्यापक अर्थ ‘स्त्रियाँ’ उपयुक्त है।
- source_word: ὑπὲρ δὲ πάντα
  choice: पर सबसे बढ़कर
  rationale: यह पदबंध चरम विरोध और श्रेष्ठता व्यक्त करता है; ‘सबसे बढ़कर’ आधुनिक हिन्दी में स्वाभाविक ढंग से उस अर्थ को रखता है।
- source_word: νικᾷ
  choice: विजयी होता है
  rationale: νικάω का अर्थ जीतना, परास्त करना या विजयी होना है। अमूर्त कर्ता ‘सत्य’ के साथ यह रूप स्वाभाविक है और पहले प्रयुक्त ‘शक्तिशाली’ से भेद रखता है।
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: यूनानी में लेख के साथ होने पर भी यह सार्वभौमिक, अमूर्त संकल्पना है; हिन्दी में ‘सत्य’ बिना किसी संकेतवाचक विस्तार के स्वाभाविक और सूक्तिपरक है।
theological_decisions:
- issue: ἡ ἀλήθεια के लेख को हिन्दी में अलग से व्यक्त करना या अमूर्त संज्ञा के रूप में अनूदित करना
  choice: सत्य
  alternative: वह सत्य
  rationale: यहाँ किसी खास कथन की पहचान नहीं कराई जा रही, बल्कि सत्य की सार्वभौमिक श्रेष्ठता का सूक्तिपरक दावा है। हिन्दी में ‘सत्य’ स्रोत का भाव अधिक स्वाभाविक रूप से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सूक्तिपरक रखी गई है। ‘स्त्रियाँ’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘विजयी होता है’ सत्य को मानवीकृत करने वाले यूनानी कथन का प्रभाव बनाए रखता है।
