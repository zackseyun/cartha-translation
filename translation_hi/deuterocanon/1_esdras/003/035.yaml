- source_word: ὁ βασιλεύς
  choice: राजा
  rationale: संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: ὅτι
  choice: जब
  rationale: यहाँ कारणसूचक संबंध को हिन्दी के स्वाभाविक प्रश्न-विन्यास में व्यक्त करता है; अर्थ ‘क्योंकि/चूँकि’ के निकट है।
- source_word: οὕτως ἐπάκουστός ἐστιν
  choice: उसकी बात इस तरह मानी जाती है
  rationale: ἐπάκουστός के ‘सुना जाना’ और ‘आज्ञा मानी जाना’ के बीच के अर्थ-क्षेत्र को मुहावरेदार हिन्दी में रखता है; राजा और अधिकार के प्रसंग में आज्ञापालन का भाव प्रमुख है।
- source_word: καὶ ἐσίγησεν
  choice: फिर वह चुप हो गया
  rationale: सिगाओ के एओरिस्ट रूप को वक्ता द्वारा बोलना समाप्त कर देने की घटना के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
