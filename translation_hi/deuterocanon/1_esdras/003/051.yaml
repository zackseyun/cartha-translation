  yaml_path: translation/deuterocanon/1_esdras/003/051.yaml
  text: And now you do not believe me[a]. Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: hi
  text: और अब तुम मेरी बात पर विश्वास नहीं करते। क्या राजा अपने अधिकार में महान नहीं है? क्या सभी देश उसे छूने से नहीं डरते?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, मुहावरे के अनुसार: “उस पर हाथ डालने से।” यूनानी में शाब्दिक अर्थ है, “उसे छूने से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ
  choice: विश्वास करते
  rationale: यह क्रिया ‘विश्वास करना’ या ‘भरोसा करना’ व्यक्त कर सकती है। यहाँ वक्ता के कथन को न मानने की बात है, इसलिए ‘मेरी बात पर विश्वास नहीं करते’ स्वाभाविक और सटीक है।
- source_word: μέγας
  choice: महान
  rationale: यहाँ शब्द राजा की प्रतिष्ठा और सामर्थ्य को दर्शाता है। ‘महान’ मूल के व्यापक अर्थ और आलंकारिक प्रश्न की गरिमा को बनाए रखता है।
- source_word: ἐξουσίᾳ
  choice: अधिकार
  rationale: शब्द वैध सत्ता, अधिकार या कार्य करने की शक्ति को दर्शाता है। राजा के शासन-संबंधी सामर्थ्य के लिए ‘अधिकार’ उपयुक्त है।
- source_word: χῶραι
  choice: देश
  rationale: यह शब्द भूभागों या प्रदेशों को व्यापक रूप से सूचित करता है। आधुनिक हिन्दी में ‘सभी देश’ सहज है और यहाँ आधुनिक राष्ट्र-राज्य की तकनीकी धारणा आवश्यक नहीं बनाता।
- source_word: εὐλαβοῦνται
  choice: डरते
  rationale: इस संदर्भ में क्रिया सावधानी, भय या आशंका बताती है, जिसके कारण लोग राजा के विरुद्ध हाथ उठाने का साहस नहीं करते। ‘डरते’ इस व्यावहारिक आशय को स्पष्ट रखता है।
- source_word: ἅψασθαι
  choice: हाथ डालने
  rationale: मूल अर्थ ‘छूना’ या ‘पकड़ना’ है, पर राजा के संदर्भ में हिन्दी मुहावरा ‘उस पर हाथ डालना’ हानि पहुँचाने या उसे पकड़ने का साहस करने का संभावित आशय स्वाभाविक रूप से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
