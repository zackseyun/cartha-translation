  yaml_path: translation/deuterocanon/1_esdras/003/063.yaml
  text: and with her there is no partiality or distinction, but she does what is righteous apart from all that is unjust and evil; and all approve of her works,
translation:
  language: hi
  text: और उसके यहाँ न पक्षपात होता है[a], न भेदभाव; बल्कि वह हर अन्यायपूर्ण और बुरी बात से अलग रहकर वही करती है जो न्यायपूर्ण है[b], और सभी उसके कामों को सराहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी मुहावरे का शाब्दिक अर्थ ‘चेहरों को ग्रहण करना’ है; इसका आशय किसी व्यक्ति का पक्ष लेने या पक्षपात करने से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सब अन्यायी और दुष्ट लोगों से अलग रहकर।’ यूनानी वाक्यांश अन्यायपूर्ण और बुरी बातों से अलगाव या अन्यायी और दुष्ट लोगों से अलगाव—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρʼ αὐτῇ
  choice: उसके यहाँ
  rationale: यह पदबंध स्त्रीलिंग में व्यक्तित्व-रूप दिए गए विषय के संबंध में जो स्थिति है, उसे दर्शाता है। ‘उसके यहाँ’ स्वाभाविक हिन्दी है और स्थान का अनावश्यक रूप से संकीर्ण अर्थ नहीं देता।
- source_word: λαμβάνειν πρόσωπα
  choice: पक्षपात होता है
  rationale: यह यूनानी मुहावरा शाब्दिक रूप से ‘चेहरे ग्रहण करना’ है, पर इसका अर्थ किसी का पक्ष लेना या पक्षपात करना है।
- source_word: διαφορά
  choice: भेदभाव
  rationale: पक्षपात के समानांतर यह लोगों के बीच अनुचित भेद करने का भाव व्यक्त करता है; आधुनिक हिन्दी में ‘भेदभाव’ इस नैतिक संदर्भ को स्पष्ट करता है।
- source_word: τὰ δίκαια ποιεῖ
  choice: वही करती है जो न्यायपूर्ण है
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ न्यायपूर्ण कामों या आचरण का सामूहिक बोध देता है; यह रूप अर्थ और सहजता दोनों बनाए रखता है।
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: सब अन्यायपूर्ण और बुरी बातों से अलग रहकर
  rationale: ἀπό अलगाव का भाव देता है। विशेषण वस्तुओं/बातों या व्यक्तियों, दोनों की ओर संकेत कर सकते हैं; मुख्य पाठ में नैतिक बातों का अर्थ रखा गया है और वैकल्पिक व्यक्तिगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: εὐδοκοῦσι τοῖς ἔργοις αὐτῆς
  choice: सभी उसके कामों को सराहते हैं
  rationale: क्रिया प्रसन्न होने या अनुमोदन करने का अर्थ दे सकती है। ‘सराहते हैं’ सामान्य आधुनिक हिन्दी में सकारात्मक स्वीकृति को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: विषय का स्त्रीलिंग व्यक्तित्व-रूप
  choice: ‘उसके’ और ‘वह’ जैसे स्त्रीलिंग-संगत रूप बनाए रखे गए हैं।
  alternative: विषय का नाम दोहराना या उसे निर्जीव ‘यह’ के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ स्त्रीलिंग रूपों का प्रयोग करता है और निकटवर्ती संदर्भ विषय को स्त्री के रूप में व्यक्तित्व प्रदान करता है। इसे बनाए रखने से साहित्यिक और धर्मवैचारिक तनाव समतल नहीं होता।
- issue: ἀδίκων καὶ πονηρῶν का संदर्भ
  choice: मुख्य पाठ में इसे अन्यायपूर्ण और बुरी बातों/कार्यों के रूप में समझा गया है।
  alternative: इसे अन्यायी और दुष्ट लोगों के रूप में समझना।
  rationale: रूप दोनों अर्थों की अनुमति देता है। निकटतम विरोध ‘जो न्यायपूर्ण है’ से होने के कारण मुख्य पाठ में अवैयक्तिक नैतिक अर्थ सहज है, जबकि व्यक्तिगत अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘पक्षपात’ और ‘भेदभाव’ न्यायिक-नैतिक समानांतरता को बनाए रखते हैं; स्त्रीलिंग व्यक्तित्व-रूप भी सुरक्षित है।
