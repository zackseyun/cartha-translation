  text: And leaving all these things behind[a], they gape at her; with mouths hanging open they stare at her, and all choose her rather than gold and silver and every beautiful thing.
translation:
  language: hi
  text: और इन सब वस्तुओं को छोड़कर वे उसकी ओर मुँह बाए रहते हैं; मुँह खोले हुए वे उसे निहारते हैं, और वे सब सोने, चाँदी और हर सुंदर वस्तु की अपेक्षा उसी को चुनते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “और वे सब उसे सोने, चाँदी और हर सुंदर वस्तु से अधिक पसंद करते हैं।” यूनानी क्रिया इस तुलनात्मक रचना में चुनने के साथ वरीयता का भाव भी दे सकती है।
    reason: lexical_alternative
