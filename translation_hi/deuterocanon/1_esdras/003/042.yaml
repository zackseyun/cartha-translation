- source_word: εἰς αὐτὴν κέχηναν
  choice: वे उसकी ओर मुँह बाए रह जाते हैं
  rationale: क्रिया किसी की ओर विस्मय या मोहित अवस्था में मुँह बाए रहने का सजीव चित्र देती है।
- source_word: χάσκοντες τὸ στόμα
  choice: मुँह खोले हुए
  rationale: यह कृदन्तीय पद पहले के मुँह बाए रहने वाले चित्र को जानबूझकर तीव्र करता है; यूनानी की पुनरुक्ति को मिटाया नहीं गया।
- source_word: θεωροῦσιν αὐτήν
  choice: उसे निहारते हैं
  rationale: θεωρέω यहाँ लगातार और ध्यानपूर्वक देखने का भाव रखता है; ‘निहारते हैं’ मोहित दृष्टि को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: αἱρετίζουσιν μᾶλλον ἢ
  choice: की अपेक्षा उसी को चुनते हैं
  rationale: क्रिया के ‘चुनना’ अर्थ और तुलनात्मक रचना μᾶλλον ἢ दोनों को स्पष्ट रखते हुए वरीयता का भाव व्यक्त किया गया है।
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: हर सुंदर वस्तु
  rationale: πρᾶγμα व्यापक रूप से वस्तु या चीज़ और ὡραῖον सुंदर या मनोहर का अर्थ देता है; यह अनुवाद जानबूझकर उसी व्यापकता को रखता है।
