  text: A man leaves his own father[a], who raised him, and his own country, and clings to his own wife,
translation:
  language: hi
  text: मनुष्य अपने पिता को[a], जिसने उसका पालन-पोषण किया, और अपने देश को छोड़ देता है और अपनी पत्नी से जुड़ जाता है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “त्याग देता है”; यूनानी क्रिया अधिक प्रबल अर्थ दे सकती है, पर यहाँ संभवतः पत्नी से जुड़ने के लिए पिता और देश से अलग होने का वर्णन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यहाँ एकवचन शब्द विवाह-संबंधी कथन में प्रतिनिधि पुरुष को सूचित करता है। ‘मनुष्य’ स्वाभाविक और गरिमापूर्ण है, जबकि पत्नी का उल्लेख प्रसंग में पुरुष को स्पष्ट करता है।
- source_word: τὸν ἑαυτοῦ πατέρα
  choice: अपने पिता को
  rationale: हिन्दी का ‘अपने’ आत्मवाचक अधिकार को स्वाभाविक रूप से व्यक्त करता है; अलग से ‘अपने ही’ कहना अनावश्यक रूप से अधिक बल देता।
- source_word: ἐγκαταλείπει
  choice: छोड़ देता है
  rationale: क्रिया में ‘त्याग देना’ का अधिक प्रबल अर्थ संभव है, पर पिता और देश से विदा होकर पत्नी से जुड़ने के इस प्रसंग में ‘छोड़ देता है’ अर्थ और हिन्दी मुहावरे दोनों के अनुकूल है।
- source_word: ὃς ἐξέθρεψεν αὐτόν
  choice: जिसने उसका पालन-पोषण किया
  rationale: ἐκτρέφω बच्चे को पालने और बड़ा करने का भाव रखता है; ‘पालन-पोषण किया’ आधुनिक हिन्दी में इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: τὴν ἰδίαν χώραν
  choice: अपने देश को
  rationale: χώρα का अर्थ देश, भूभाग या प्रदेश हो सकता है। यहाँ ‘अपने देश’ मूल स्थान से प्रस्थान का व्यापक और स्वाभाविक बोध देता है।
- source_word: πρὸς τὴν ἰδίαν γυναῖκα
  choice: अपनी पत्नी से
  rationale: विवाह और निकट लगाव के प्रसंग में γυνή का अर्थ ‘पत्नी’ है। κολλᾶται के साथ हिन्दी में ‘से जुड़ना’ स्वाभाविक कारक-प्रयोग है।
- source_word: κολλᾶται
  choice: जुड़ जाता है
  rationale: यह क्रिया घनिष्ठ और स्थायी लगाव का भाव देती है। ‘जुड़ जाता है’ सहज हिन्दी है; ‘लिपट जाता है’ यहाँ अत्यधिक शारीरिक अर्थ दे सकता है।
theological_decisions:
- issue: विवाह-संबंधी सूक्ति में प्रतिनिधि पुल्लिंग
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: ἄνθρωπος सामान्य मानवीय शब्द हो सकता है, पर पिता और पत्नी वाला यह कथन पुरुष के विवाह-संबंधी परिदृश्य को प्रस्तुत करता है। ‘मनुष्य’ इस प्रतिनिधि प्रयोग को बनाए रखता है और अनावश्यक रूप से लिंग-निरपेक्ष नहीं करता।
