  yaml_path: translation/deuterocanon/1_esdras/003/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and the one whom the king and the three nobles of Persia judge to be the one whose word is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: hi
  text: और उन्होंने कहा, “जब राजा उठेगा, तब वे उसे वह लिखित कथन[a] देंगे; और जिसके विषय में राजा और फ़ारस के तीन प्रधान अधिकारी यह निर्णय करेंगे कि उसका कथन[b] अधिक बुद्धिमत्तापूर्ण है, उसी को विजय दी जाएगी, जैसा लिखा गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह लेख,” “वह पत्र” अथवा “वह दस्तावेज़।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में शाब्दिक रूप से, “जिसका λόγος अधिक बुद्धिमत्तापूर्ण है।” λόγος का अर्थ यहाँ “बात,” “कथन” या “तर्क” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: उठेगा
  rationale: यहाँ क्रिया राजा के उठने को दर्शाती है; ‘उठेगा’ स्वाभाविक है और नींद या आसन जैसी बात को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: τὸ γράμμα
  choice: वह लिखित कथन
  rationale: γράμμα किसी लिखी हुई सामग्री, पत्र या दस्तावेज़ को सूचित कर सकता है। प्रसंग में प्रतियोगियों द्वारा लिखी गई बात अभिप्रेत है, इसलिए ‘लिखित कथन’ अर्थ को स्पष्ट रखते हुए पत्र का निजी भाव नहीं जोड़ता।
- source_word: κρίνῃ
  choice: निर्णय करेंगे
  rationale: क्रिया मूल्यांकन करके फैसला करने का भाव रखती है; हिन्दी में बहुवचन कर्ता ‘राजा और ... तीन उच्च अधिकारी’ के साथ ‘निर्णय करेंगे’ स्वाभाविक है।
- source_word: μεγιστᾶνες
  choice: उच्च अधिकारी
  rationale: यह शब्द फ़ारस के ऊँचे पद और प्रतिष्ठा वाले व्यक्तियों के लिए है। ‘उच्च अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और दरबारी पदक्रम का भाव देता है।
- source_word: Περσίδος
  choice: फ़ारस के
  rationale: सम्बन्धकारक रूप यहाँ फ़ारसी राज्य या राजदरबार से सम्बद्धता व्यक्त करता है।
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: उसका कथन अधिक बुद्धिमत्तापूर्ण है
  rationale: λόγος यहाँ प्रतियोगी की कही या लिखी बात को दर्शाता है। ‘कथन’ इसकी व्यापकता बनाए रखता है और σοφώτερος के तुलनात्मक भाव को ‘अधिक बुद्धिमत्तापूर्ण’ व्यक्त करता है।
- source_word: τὸ νῖκος
  choice: विजय
  rationale: νῖκος का सीधा अर्थ विजय है; प्रसंग में यह प्रतियोगिता में विजेता ठहराए जाने का परिणाम बताता है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा गया है
  rationale: पूर्ण निष्क्रिय रूप पहले से लिखकर निर्धारित की गई बात की वर्तमान प्रासंगिकता रखता है; यह हिन्दी अभिव्यक्ति उस भाव को सहजता से व्यक्त करती है।
