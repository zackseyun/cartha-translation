lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कालवाचक क्रिया-विशेषण कथा में अगला चरण दर्शाता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: γράψαντες
  choice: लिखकर
  rationale: अओरिस्ट कृदंत मुख्य क्रियाओं से पहले पूरी हुई क्रिया बताता है; हिन्दी में ‘लिखकर’ इस पूर्वता को सहज ढंग से व्यक्त करता है।
- source_word: ἕκαστος
  choice: हर एक ने
  rationale: वितरणात्मक अर्थ को स्पष्ट रखते हुए यह बताता है कि प्रत्येक व्यक्ति ने अलग से कार्य किया।
- source_word: τὸν ἑαυτοῦ λόγον
  choice: अपना कथन
  rationale: यहाँ λόγος प्रत्येक प्रतियोगी के लिखित कथन या दावे को सूचित करता है; ‘कथन’ ‘शब्द’ से अधिक प्रसंगानुकूल और ‘तर्क’ से कम व्याख्यात्मक है।
- source_word: ἐσφραγίσαντο
  choice: उस पर मुहर लगाई
  rationale: मध्यवाची रूप प्रसंग में लिखित कथन को मुहरबंद करने का बोध देता है; एकवचन वितरणात्मक रचना हिन्दी में प्रत्येक कथन पर हुई क्रिया स्पष्ट करती है।
- source_word: ἔθηκαν
  choice: उसे ... रख दिया
  rationale: सरल कथात्मक क्रिया को स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘उसे’ का संबंध प्रत्येक व्यक्ति के अपने मुहरबंद कथन से है।
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: तकिए के नीचे
  rationale: προσκεφάλαιον सिर रखने के तकिए या सिरहाने को दर्शा सकता है; मुख्य पाठ में ‘तकिया’ सर्वाधिक सहज आधुनिक विकल्प है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: Δαρείου τοῦ βασιλέως
  choice: राजा दारा के
  rationale: यूनानी संबंधकारक को स्वाभाविक हिन्दी शब्दक्रम में रखा गया है; दारा नाम का प्रचलित हिन्दी रूप है।
