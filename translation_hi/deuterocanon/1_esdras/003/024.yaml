  text: And the second began to speak[a], the one who had spoken about the strength of the king,
translation:
  language: hi
  text: तब वह दूसरा व्यक्ति बोलने लगा[a], जिसने राजा की शक्ति के विषय में कहा था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब दूसरे व्यक्ति ने बोलना आरम्भ किया।”
    reason: ‘बोलने लगा’ यूनानी आरम्भसूचक क्रिया का स्वाभाविक हिन्दी रूप है; अधिक शाब्दिक विकल्प दिया गया है।
lexical_decisions:
- source_word: ἤρξατο
  choice: लगा
  rationale: ἄρχομαι का यह रूप किसी कार्य के आरम्भ को व्यक्त करता है; ‘बोलने लगा’ आधुनिक हिन्दी में स्वाभाविक कथात्मक प्रयोग है।
- source_word: λαλεῖν
  choice: बोलने
  rationale: λαλέω यहाँ सभा में वक्तव्य देने के अर्थ में है; ‘बोलने’ सहज और प्रसंगानुकूल है।
- source_word: ὁ δεύτερος
  choice: वह दूसरा व्यक्ति
  rationale: संज्ञा के बिना प्रयुक्त क्रमवाचक पद दूसरे सहभागी की पहचान कराता है; हिन्दी में स्पष्टता के लिए ‘व्यक्ति’ जोड़ा गया है।
- source_word: ὁ εἴπας
  choice: जिसने ... कहा था
  rationale: संज्ञीकृत भूतकालिक कृदन्त पहले दिए गए वक्तव्य की ओर संकेत करता है; ‘कहा था’ उसकी पूर्वता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: περὶ
  choice: के विषय में
  rationale: सम्बन्धकारक के साथ περί विषय को सूचित करता है; ‘के विषय में’ गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: ἰσχύος
  choice: शक्ति
  rationale: ἰσχύς बल, सामर्थ्य या शक्ति को व्यक्त कर सकता है; राजकीय प्रसंग में ‘शक्ति’ अर्थ-विस्तार को बनाए रखते हुए सबसे स्वाभाविक है।
- source_word: τοῦ βασιλέως
  choice: राजा की
  rationale: βασιλεύς का इस राजदरबारी प्रसंग में सीधा अर्थ ‘राजा’ है; हिन्दी में सम्बन्धकारक को ‘राजा की’ से व्यक्त किया गया है।
