    text: अधिक शब्दशः, “वह याद नहीं रखता”; यूनानी में “याद नहीं रखता” की क्रिया एकवचन है, जबकि “पीते हैं” बहुवचन है। सन्दर्भ में यह कथन सामान्य रूप से पीनेवालों के विषय में है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया का अर्थ “स्नेहपूर्ण व्यवहार करना” या “स्नेह दिखाना” भी हो सकता है; अधिक ठोस अर्थ में इसका अनुवाद “चूमना” किया जा सकता है, यद्यपि यहाँ इसकी संभावना कम है।
    reason: lexical_alternative
