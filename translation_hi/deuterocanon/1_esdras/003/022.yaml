translation:
  language: hi
  text: और जब वे दाखमधु के नशे से उठते हैं[a], तो उन्हें याद नहीं रहता कि उन्होंने क्या किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ है, ‘जब वे दाखमधु से उठते हैं।’ इसका आशय दाखमधु के प्रभाव में रहने के बाद उठने से है; यह आवश्यक रूप से पूरी तरह नशा उतर जाने का औपचारिक कथन नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह सामान्य समयसूचक उपवाक्य आरम्भ करता है। हिन्दी में ‘जब’ स्वाभाविक है और प्रसंग में पुनरावृत्त परिस्थिति को भी व्यक्त कर सकता है।
- source_word: ἀπὸ τοῦ οἴνου
  choice: दाखमधु के प्रभाव से
  rationale: यूनानी में शाब्दिक रूप से ‘दाखमधु से’ है। हिन्दी में केवल ‘दाखमधु से उठते हैं’ अस्पष्ट और अस्वाभाविक होता; ‘के प्रभाव से’ प्रसंगगत आशय स्पष्ट करता है, जबकि पादटिप्पणी मूल ठोस अभिव्यक्ति सुरक्षित रखती है।
- source_word: ἐγερθῶσιν
  choice: उठते हैं
  rationale: ἐγείρω यहाँ उठने या उठ खड़े होने का भाव देता है। ‘होश में आते हैं’ या ‘नशा उतरता है’ मूल की अपेक्षा अधिक व्याख्यात्मक होता।
- source_word: οὐ μέμνηται
  choice: उन्हें याद नहीं रहता
  rationale: स्वीटे के पाठ में क्रिया का रूप एकवचन है, यद्यपि पूर्ववर्ती कर्ता बहुवचन है। हिन्दी में सामूहिक अर्थ को स्वाभाविक बहुवचन-संबंधी रचना से व्यक्त किया गया है।
- source_word: ἃ ἔπραξαν
  choice: कि उन्होंने क्या किया था
  rationale: यह सापेक्ष उपवाक्य का सहज हिन्दी रूप है; ‘किया था’ स्मरण के बाद के समय की तुलना में पहले किए गए कार्य को स्पष्ट करता है।
