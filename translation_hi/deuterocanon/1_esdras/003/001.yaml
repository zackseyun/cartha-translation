lexical_decisions:
- source_word: δοχήν
  choice: भव्य भोज
  rationale: यह शब्द औपचारिक आतिथ्य-भोज को दर्शाता है; राजकीय प्रसंग में ‘भव्य भोज’ स्वाभाविक और अर्थानुकूल है।
- source_word: τοῖς ὑπʼ αὐτόν
  choice: अपने अधीन सभी लोगों
  rationale: यह यूनानी पदबंध के पदानुक्रम और व्यापकता को बनाए रखता है तथा इसे केवल राजनीतिक ‘प्रजा’ तक सीमित नहीं करता।
- source_word: οἰκογενέσιν
  choice: अपने पूरे घराने
  rationale: ‘घराना’ परिवार के साथ राजपरिवार से जुड़े सेवकों और आश्रितों को भी समेट सकता है, इसलिए केवल ‘परिवार’ से अधिक उपयुक्त है।
- source_word: μεγιστᾶσιν
  choice: बड़े अधिकारियों
  rationale: यहाँ शब्द राज्य के उच्चपदस्थ और प्रभावशाली प्रमुख जनों के लिए है; ‘बड़े अधिकारी’ आधुनिक सामान्य हिन्दी में सहज है, यद्यपि ‘कुलीन जन’ भी संभव है।
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: मादै तथा फ़ारस
  rationale: यूनानी पाठ लोगों के बजाय क्षेत्रों के नाम देता है; हिन्दी में प्रचलित बाइबलीय भौगोलिक नाम रखे गए हैं।
- source_word: βασιλεὺς Δαρεῖος
  choice: राजा दारयवेश
  rationale: दारयवेश हिन्दी बाइबल परंपरा में इस राजा का परिचित और गरिमापूर्ण नाम है।
