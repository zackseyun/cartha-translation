lexical_decisions:
- source_word: ἐὰν δὲ
  choice: परन्तु यदि
  rationale: यह पद पहले कथन के साथ विरोधात्मक संबंध रखते हुए एक शर्त आरम्भ करता है; ‘परन्तु यदि’ δέ और ἐάν दोनों का स्वाभाविक प्रतिनिधित्व करता है।
- source_word: συναγάγωσιν
  choice: इकट्ठी करें
  rationale: क्रिया का अर्थ वस्तुओं को एकत्र करना है; हिन्दी में संयुक्त कर्मों के लिए यह सीधा और स्वाभाविक प्रयोग है।
- source_word: χρυσίον καὶ ἀργύριον
  choice: सोना, चाँदी
  rationale: दोनों पदार्थों के सामान्य और सटीक हिन्दी नाम रखे गए हैं।
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: हर सुन्दर वस्तु
  rationale: πρᾶγμα व्यापक अर्थ वाला ‘वस्तु’ है और ὡραῖον यहाँ आकर्षक या मनोहर होने का भाव देता है; अनुवाद इस व्यापकता को बनाए रखता है।
- source_word: ἴδωσιν
  choice: देखें
  rationale: यह ἐάν के अधीन सामान्य शर्त में प्रयुक्त क्रिया है; ‘देखें’ न्यूनतम व्याख्यात्मक और स्वाभाविक अनुवाद है।
- source_word: γυναῖκα μίαν
  choice: एक स्त्री
  rationale: μίαν को स्पष्ट रूप से व्यक्त किया गया है, जिससे संचित अनेक मूल्यवान वस्तुओं के सामने एक स्त्री पर बल बना रहता है।
- source_word: καλὴν τῷ εἴδει καὶ τῷ κάλλει
  choice: रूप और सौन्दर्य में सुन्दर
  rationale: मूल यूनानी की दोहरी, बलाघाती अभिव्यक्ति को संक्षिप्त किए बिना सुरक्षित रखा गया है, भले ही हिन्दी में इसका पुनरुक्तिपूर्ण प्रभाव हो।
