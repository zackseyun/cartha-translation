- source_word: ἐκάθισεν
  choice: बैठा
  rationale: कथात्मक भूतकाल में यह सरल और स्वाभाविक रूप है; ‘अपना स्थान ग्रहण किया’ संभव है, पर यूनानी से अधिक औपचारिकता जोड़ता है।
- source_word: χρηματιστηρίῳ
  choice: सभा-कक्ष
  rationale: यह किसी आधिकारिक विचार-विमर्श, प्रशासनिक कार्यवाही या न्यायिक काम के स्थान को सूचित करता है। ‘सभा-कक्ष’ संस्थागत अर्थ को सहज हिन्दी में रखता है, जबकि सटीक न्यायिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता। अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἀνεγνώσθη
  choice: पढ़ा गया
  rationale: यूनानी में यह भूतकालीन कर्मवाच्य है। प्रसंग में सुनाकर पढ़ना निहित हो सकता है, पर ‘ऊँची आवाज़ में’ मूल पाठ में स्पष्ट नहीं है।
- source_word: γράμμα
  choice: पत्र
  rationale: यहाँ शब्द किसी लिखित संदेश या दस्तावेज़ को दर्शाता है; कथात्मक प्रसंग में ‘पत्र’ सबसे स्वाभाविक है।
- source_word: ἐνώπιον αὐτῶν
  choice: उनके सामने
  rationale: यह यूनानी पदबंध का संक्षिप्त, स्वाभाविक और औपचारिक हिन्दी रूप है; ‘उनकी उपस्थिति में’ भी संभव है।
