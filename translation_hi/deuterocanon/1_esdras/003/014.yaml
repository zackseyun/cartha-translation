  text: And he sent and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[b],
translation:
  language: hi
  text: और उसने संदेश भेजकर फ़ारस और मादै के सभी सामंतों, क्षत्रपों, सेनापतियों, स्थानीय शासकों और उच्च अधिकारियों को बुलाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन पदनामों की सूची फ़ारसी साम्राज्य की प्रशासनिक व्यवस्था को दर्शाती है। यूनानी ‘तोपार्ख’ का अर्थ स्थानीय क्षेत्र का शासक है; ‘हुपातोस’ का अर्थ संदर्भानुसार उच्च या प्रधान पदाधिकारी भी हो सकता है। ‘संदेश भेजकर’ के पीछे यूनानी में भेजी गई वस्तु या व्यक्तियों का उल्लेख नहीं है; संदर्भ में संदेशवाहक या आदेश अभिप्रेत हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐξαποστείλας
  choice: संदेश भेजकर
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले किसी को भेजने—संभवतः संदेशवाहकों या आदेशों को—का संकेत देता है। ‘संदेश भेजकर’ स्वाभाविक हिन्दी में क्रम को बनाए रखता है, पर संदेशवाहक को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἐκάλεσεν
  choice: बुलवाया
  rationale: राजा द्वारा अधिकारियों को आदेशपूर्वक बुलाने के प्रसंग में ‘बुलवाया’ उपयुक्त है और προηγούμενο कृदंत के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: μεγιστᾶνας
  choice: सामंतों
  rationale: यह राज्य के उच्च पद और प्रतिष्ठा वाले प्रमुख जनों को सूचित करता है। ‘सामंत’ ऐतिहासिक-राजकीय संदर्भ में संक्षिप्त और समझने योग्य है, यद्यपि ‘कुलीन जन’ भी सम्भव है।
- source_word: Περσίδος καὶ τῆς Μηδείας
  choice: फ़ारस और मादै के
  rationale: दोनों भौगोलिक नामों का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: σατράπας
  choice: क्षत्रपों
  rationale: यह फ़ारसी साम्राज्य का विशिष्ट प्रशासनिक पद है; ऐतिहासिक पदनाम ‘क्षत्रप’ हिन्दी में भी स्थापित है।
- source_word: στρατηγοὺς
  choice: सेनापतियों
  rationale: यह पद सामान्यतः सैन्य नेतृत्व को व्यक्त करता है; ‘सेनापति’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: τοπάρχας
  choice: स्थानीय शासकों
  rationale: शब्द स्थानीय क्षेत्र या जिले पर शासन करने वाले अधिकारी को दर्शाता है। कार्यपरक अनुवाद दुर्लभ लिप्यंतरण की अपेक्षा अधिक सुबोध है।
- source_word: ὑπάτους
  choice: उच्च अधिकारियों
  rationale: शब्द का मूल भाव सर्वोच्च या उच्च पदस्थ व्यक्ति है। फ़ारसी संदर्भ में ‘कौंसुल’ रोमी संस्था का अनुचित आभास दे सकता है और ‘राज्यपाल’ προηγούμενο क्षत्रप पद से धुंधला सकता है; इसलिए व्यापक ‘उच्च अधिकारी’ चुना गया।
