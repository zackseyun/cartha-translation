    reason: lexical_alternative
lexical_decisions:
- source_word: Καλέσατε
  choice: बुलाओ
  rationale: यह καλέω का बहुवचन आज्ञार्थक रूप है। ‘बुलाओ’ आधुनिक हिन्दी में सीधा और स्वाभाविक है तथा आगे के कर्मवाच्य ‘बुलाया गया’ के साथ यूनानी पाठ की शब्द-पुनरावृत्ति बनाए रखता है।
- source_word: τοὺς νεανίσκους
  choice: उन जवानों को
  rationale: νεανίσκος का सामान्य अर्थ युवा पुरुष है। प्रसंग में पहले से पहचाने गए पुरुष प्रतियोगियों के लिए ‘उन जवानों’ स्वाभाविक और लिंग-सटीक है।
- source_word: δηλώσουσιν
  choice: बताएँगे
  rationale: δηλόω का अर्थ प्रकट करना, स्पष्ट करना या बताना है। यहाँ ‘बताएँगे’ सहज आधुनिक हिन्दी में सार्वजनिक रूप से अपनी बात सामने रखने का भाव देता है।
- source_word: τοὺς λόγους αὐτῶν
  choice: अपनी बातें
  rationale: λόγους का अर्थ शब्द, कथन, बातें या तर्क हो सकता है। ‘अपनी बातें’ स्रोत की व्यापकता को बनाए रखता है और हिन्दी में स्वाभाविक है; अधिक विशिष्ट विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἐκλήθησαν
  choice: उन्हें बुलाया गया
  rationale: यह καλέω का कर्मवाच्य रूप है। ‘बुलाया गया’ पहले आए ‘बुलाओ’ के साथ मूल पाठ की पुनरावृत्ति सुरक्षित रखता है।
- source_word: εἰσήλθοσαν
  choice: वे भीतर आए
  rationale: εἰσέρχομαι का अर्थ भीतर आना या प्रवेश करना है। ‘भीतर आए’ स्पष्ट, संक्षिप्त और स्वाभाविक कथात्मक हिन्दी है।
