- source_word: ἐθεώρουν
  choice: मैं ... देख रहा था
  rationale: यूनानी अपूर्ण भूतकाल लगातार या उस समय हो रहे देखने को व्यक्त करता है। रूप प्रथम पुरुष एकवचन भी हो सकता है और तृतीय पुरुष बहुवचन भी; निकटवर्ती भाषण-संदर्भ के अनुसार प्रथम पुरुष एकवचन चुना गया है।
- source_word: Ἀπάμην
  choice: अपामे
  rationale: यूनानी व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है; यहाँ रूप कर्मकारक में है।
- source_word: Βαρτάκου
  choice: बार्ताकुस
  rationale: व्यक्तिनाम का यूनानी रूप से निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: τοῦ θαυμαστοῦ
  choice: विख्यात
  rationale: यह विशेषण बार्ताकुस का वर्णन करता है और उसके प्रशंसनीय, उल्लेखनीय या प्रसिद्ध होने का भाव रखता है। 'विख्यात' हिन्दी में स्वाभाविक विशेषण है और इसे उपाधि मानकर अति-व्याख्या नहीं करता।
- source_word: παλλακὴν
  choice: उपपत्नी
  rationale: यह शब्द सामान्य प्रेमिका या सेविका नहीं, बल्कि राजा की मान्य गौण पत्नी/रखैल-जैसी स्थिति वाली स्त्री को सूचित करता है; 'उपपत्नी' सटीक और गरिमापूर्ण है।
- source_word: καθημένην
  choice: बैठी
  rationale: स्त्रीलिंग कृदंत अपामे की मुद्रा बताता है।
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: राजा के दाहिने
  rationale: यूनानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप, जो निकटता और सम्मानपूर्ण स्थान दोनों को खुला रखता है।
