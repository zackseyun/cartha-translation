  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए स्पष्ट शैली। अस्पष्ट सर्वनाम ‘वह’ को बनाए रखा गया है, क्योंकि इस पद में यूनानी पाठ स्वयं वक्ता की पहचान दोबारा स्पष्ट नहीं करता।
