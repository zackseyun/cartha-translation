translation:
  language: hi
  text: तब राजा और दरबार के उच्च अधिकारी एक-दूसरे की ओर देखने लगे, और वह सत्य के विषय में बोलने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: दरबार के उच्च अधिकारी
  rationale: यह शब्द राजदरबार के बड़े पदाधिकारियों या प्रतिष्ठित सामंतों को दर्शाता है। केवल ‘कुलीन’ की अपेक्षा यह पद और दरबारी संदर्भ दोनों को अधिक स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔβλεπον εἰς τὸν ἕτερον
  choice: एक-दूसरे की ओर देखने लगे
  rationale: शाब्दिक रूप ‘दूसरे की ओर देख रहे थे’ है, पर बहुवचन कर्ता के साथ यहाँ पारस्परिक दृष्टि का भाव है। हिंदी में यह प्रयोग स्वाभाविक है; प्रसंग में नई प्रतिक्रिया आरंभ होने के कारण ‘देखने लगे’ उपयुक्त है।
- source_word: ἤρξατο λαλεῖν
  choice: बोलने लगा
  rationale: यह आरंभसूचक रचना है। ‘बोलने लगा’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक ढंग से वाणी के आरंभ को व्यक्त करता है।
- source_word: ἀλήθεια
  choice: सत्य
  rationale: यूनानी में निश्चित उपपद है और प्रसंग में सत्य प्रतियोगिता का विशिष्ट विषय है। हिंदी में भाववाचक ‘सत्य’ सामान्यतः बिना किसी अतिरिक्त निर्धारक के ही निश्चित अर्थ दे देता है।
