  rationale: यह सामान्य शर्त का सीधा और स्वाभाविक हिन्दी रूप है; इससे कथन की सशर्त प्रकृति बनी रहती है।
- source_word: ἀποκτεῖναι / ἀποκτέννουσιν
  choice: मार डालने / मार डालते हैं
  rationale: यूनानी क्रिया के सीधे अर्थ को व्यक्त करता है और न्यायिक मृत्युदंड का ऐसा विशेष अर्थ नहीं जोड़ता जो मूल में अनिवार्य नहीं है।
- source_word: ἀφεῖναι / ἀφίουσιν
  choice: छोड़ देने / छोड़ देते हैं
  rationale: क्रिया के व्यापक अर्थ—मुक्त करना, जाने देना, या क्षमा करना—को हिन्दी में अपेक्षाकृत खुला रखता है और दोनों रूपों के अनुवाद में समानता बनाए रखता है।
