translation:
  language: hi
  text: 'और वह अकेला ही है: यदि वह मार डालने को कहे, तो वे मार डालते हैं; यदि छोड़ देने को कहे, तो वे छोड़ देते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
