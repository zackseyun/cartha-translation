- source_word: αὐτὸς … μόνος
  choice: वह अकेला ही
  rationale: बलाघाती सर्वनाम αὐτός और μόνος के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है और राजा के एकमात्र अधिकार पर जोर बनाए रखता है।
- source_word: ἐὰν εἴπῃ
