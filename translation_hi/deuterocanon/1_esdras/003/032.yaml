translation:
  language: hi
  text: उसने कहा, “काट डालो,” और वे काट डालते हैं; उसने कहा, “लगाओ,” और वे लगाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: उसने कहा
  rationale: λέγω के भूतकालिक रूप का सीधा अर्थ रखा गया है; इससे यूनानी की संक्षिप्त और दोहरावपूर्ण शैली बनी रहती है तथा इसे अनावश्यक रूप से औपचारिक ‘आज्ञा दी’ नहीं बनाया जाता।
- source_word: ἐκκόψαι
  choice: काट डालो
  rationale: ἐκκόπτω यहाँ कही गई बात की विषय-वस्तु बताने वाला infinitive है। ‘काट डालो’ किसी पेड़ या उगाई हुई वस्तु को काटकर हटा देने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκκόπτουσιν
  choice: वे काट डालते हैं
  rationale: वर्तमानकालीन बहुवचन क्रिया आदेश के पालन को दिखाती है। यूनानी की तरह कर्म को अनकहा रखा गया है, जो हिन्दी में भी इस संदर्भ में स्वाभाविक है।
- source_word: φυτεῦσαι
  choice: लगाओ
  rationale: φυτεύω का यह infinitive समानांतर कथन में रोपने की बात व्यक्त करता है। ‘लगाओ’ पेड़-पौधे लगाने के लिए सहज आधुनिक हिन्दी है और संक्षिप्त निर्देशात्मक बल बनाए रखता है।
- source_word: φυτεύουσιν
  choice: वे लगा देते हैं
  rationale: बहुवचन वर्तमान क्रिया पालन को व्यक्त करती है। ‘देते हैं’ तत्परता और कार्य की पूर्ति का स्वाभाविक हिन्दी भाव देता है, जबकि कर्म मूल की तरह अस्पष्ट रहता है।
