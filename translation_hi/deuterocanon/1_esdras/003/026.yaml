  register: आधुनिक मानक हिन्दी में dignified किन्तु सुबोध शैली रखी गई है। तीन समानांतर अधिकार-सूचक कथनों—प्रबल होना, शासन करना और स्वामी होना—को अलग-अलग बनाए रखा गया है, ताकि मूल यूनानी की बलवृद्धि न मिटे।
