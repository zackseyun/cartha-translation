translation:
  language: hi
  text: परन्तु राजा उनसे अधिक शक्तिशाली है, उन पर शासन करता है और उनका स्वामी है; वह उनसे जो कुछ कहेगा, वे उसकी आज्ञा मानेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερισχύει
  choice: प्रबल होता है
  rationale: यह क्रिया राजा की दूसरों पर अधिक शक्ति और प्रधानता को व्यक्त करती है; ‘प्रबल होता है’ मूल के तुलनात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κυριεύει
  choice: शासन करता है
  rationale: यहाँ दूसरों पर अधिकार चलाने का भाव है; ‘शासन करता है’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: δεσπόζει
  choice: स्वामी है
  rationale: यह κυριεύει से अलग, स्वामित्वपूर्ण प्रभुता का अधिक प्रबल भाव रखता है; अलग अभिव्यक्ति मूल की क्रमिक पुनरुक्ति बचाती है।
- source_word: ἐνακούσουσιν
  choice: पालन करते हैं
  rationale: इस प्रसंग में केवल सुनना नहीं, राजा की बात मानना अभिप्रेत है। यूनानी भविष्यकाल कथन के सामान्य/निश्चित परिणाम को व्यक्त करता है, जिसे हिन्दी में सामान्य वर्तमान स्वाभाविक रूप से देता है।
