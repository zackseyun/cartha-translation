  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
translation:
  language: hi
  text: और वह हर मन[a] को भोज और आनंद की ओर मोड़ देता है; तब मनुष्य न किसी दुःख को याद रखता है, न किसी ऋण[b] को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर विचार।”
    reason: lexical_alternative
  - marker: b
    text: या “किसी देय वस्तु” या “दायित्व।” यूनानी शब्द ὀφείλημα का शाब्दिक अर्थ “ऋण” है, पर इसका आशय अधिक व्यापक रूप से किसी देय वस्तु या दायित्व से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: हर मन
  rationale: διάνοια मन, समझ या विचार को सूचित कर सकता है। यहाँ “हर मन” πᾶσαν के वितरणात्मक भाव और दाखमधु के सामान्य प्रभाव को संक्षेप में बनाए रखता है।
- source_word: μεταστρέφει
  choice: मोड़ देता है
  rationale: क्रिया का अर्थ मोड़ना या बदलना है। “मोड़ देता है” दिशा-परिवर्तन के रूपक को बनाए रखता है और पूर्ण रूपांतरण का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: εἰς εὐωχίαν
  choice: भोज की ओर
  rationale: εὐωχία उत्सवपूर्ण भोजन या दावत को दर्शाता है। “भोज” इसके ठोस और उत्सवी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ εὐφροσύνην
  choice: और आनंद की ओर
  rationale: εὐφροσύνη प्रसन्नता और हर्ष का बोध कराता है। “आनंद” गरिमापूर्ण तथा सहज है और “भोज” के साथ उपयुक्त बैठता है।
- source_word: οὐ μέμνηται
  choice: मनुष्य न … याद रखता है
  rationale: एकवचन क्रिया यहाँ सामान्य मानवीय अनुभव व्यक्त करती है। “मनुष्य” किसी विशिष्ट पुरुष पात्र का संकेत दिए बिना इस सार्वत्रिक भाव को स्पष्ट करता है।
- source_word: πᾶσαν λύπην
  choice: किसी दुःख को
  rationale: λύπη दुःख, शोक या पीड़ा हो सकता है। नकारात्मक वाक्य में “न किसी दुःख को” स्वाभाविक हिन्दी है और व्यापक भाव बनाए रखता है।
- source_word: πᾶν ὀφείλημα
  choice: किसी ऋण को
  rationale: ὀφείλημα का सीधा अर्थ ऋण या देय वस्तु है। “ऋण” मूल की ठोस शब्दावली को सुरक्षित रखता है, जबकि व्यापक दायित्व का संभावित अर्थ पादटिप्पणी में दिया गया है।
