base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/061.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, all the sons of men are unjust, and all their works are unjust—all such things. And there is no truth in them[b], and in their injustice they will perish.
translation:
  language: hi
  text: दाखरस अन्यायी है, राजा अन्यायी है, स्त्रियाँ अन्यायी हैं, मनुष्यों के सभी पुत्र[a] अन्यायी हैं, और उनके सभी काम और ऐसी सभी बातें[b] अन्यायपूर्ण हैं। उनमें सत्य नहीं है, और वे अपने अन्याय में नष्ट हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनुष्यों के पुत्र’ यूनानी का एक मुहावरा है, जिसका आशय मानवजाति या मनुष्य मात्र से हो सकता है।
    reason: cultural_note
  - marker: b
    text: या, ‘ये सभी बातें’ अथवा ‘इस तरह की हर बात।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: अन्यायी / अन्यायपूर्ण
  rationale: व्यक्तियों और मानवीकृत दाखमधु के लिए ‘अन्यायी’ तथा कामों के लिए स्वाभाविक हिन्दी ‘अन्यायपूर्ण’ रखा गया है। दोनों रूप आगे आने वाले ἀδικίᾳ (‘अन्याय’) के साथ मूल पाठ की शब्दगत कड़ी बनाए रखते हैं।
- source_word: οἶνος
  choice: दाखमधु
  rationale: यह οἶνος का स्पष्ट और गरिमापूर्ण हिन्दी रूप है तथा कथन में पेय के मानवीकरण को बनाए रखता है।
- source_word: βασιλεύς
  choice: राजा
  rationale: मूल में निश्चित उपपद है; यहाँ एक प्रतिनिधि शासक के विषय में सामान्य कथन ‘राजा’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: γυναῖκες
  choice: स्त्रियाँ
  rationale: संदर्भ इसे केवल विवाहित स्त्रियों तक सीमित नहीं करता, इसलिए ‘पत्नियाँ’ के बजाय व्यापक अर्थ वाला ‘स्त्रियाँ’ चुना गया है।
- source_word: υἱοὶ τῶν ἀνθρώπων
  choice: मनुष्यों के सभी पुत्र
  rationale: यह यूनानी की लिंग-सूचक और मुहावरेदार छवि को बनाए रखता है; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: ἔργα
  choice: काम
  rationale: यह लोगों के किए या उत्पन्न किए हुए कार्यों को समेटने वाला सहज और व्यापक आधुनिक हिन्दी शब्द है।
- source_word: τὰ τοιαῦτα
  choice: इस प्रकार की सभी बातें
  rationale: यह τοιαῦτα के गुणात्मक भाव को व्यक्त करता है और पिछले कथनों का सार प्रस्तुत करता है।
- source_word: ἀλήθεια
  choice: सत्य
  rationale: यह सीधा अर्थ देता है और अन्याय के साथ पाठ में उपस्थित विरोध को बनाए रखता है।
- source_word: ἀδικίᾳ
  choice: अन्याय
  rationale: यह पहले आए ἄδικος-समूह के साथ मूल पाठ की वैचारिक और शब्दगत पुनरावृत्ति बनाए रखता है।
- source_word: ἀπολοῦνται
  choice: नष्ट हो जाएँगे
  rationale: यह भविष्यकालीन क्रिया का स्वाभाविक अनुवाद है और विनाश कराने वाले किसी बाहरी कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: लिंग-सूचक मानवशास्त्रीय अभिव्यक्ति
  choice: मनुष्यों के सभी पुत्र
  alternative: सभी मनुष्य
  rationale: मूल यूनानी अभिव्यक्ति स्पष्ट रूप से लिंग-सूचक और मुहावरेदार है। मुख्य पाठ में उसकी छवि को सुरक्षित रखा गया है, जबकि पादटिप्पणी उसके व्यापक, मानवजाति-संबंधी अर्थ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। आरंभिक समानांतर वाक्यों में ‘अन्यायी’ की पुनरावृत्ति मूल की वक्तृत्वात्मक लय और मानवीकरण को सुरक्षित करती है; निर्जीव ‘कामों’ के साथ स्वाभाविक हिन्दी के लिए ‘अन्यायपूर्ण’ प्रयुक्त हुआ है।
