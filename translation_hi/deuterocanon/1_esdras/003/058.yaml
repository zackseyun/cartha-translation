lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रिया की पुनरावृत्ति अथवा पहले के स्थान की ओर वापसी दर्शाता है; यहाँ ‘फिर’ स्वाभाविक और संक्षिप्त है।
- source_word: ἀποτρέχει
  choice: दौड़कर ... लौट जाता है
  rationale: यह यौगिक क्रिया तेज गति से वापस जाने का भाव रखती है। ‘दौड़कर ... लौट जाता है’ वापसी और गति—दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: अपने स्थान पर
  rationale: τόπος का अर्थ ‘स्थान’ है और ἑαυτοῦ आत्मवाचक स्वामित्व व्यक्त करता है; हिन्दी में ‘अपने स्थान पर’ यही अर्थ स्वाभाविक ढंग से देता है।
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: एक ही दिन में
  rationale: यह वाक्यांश एक दिन की अवधि के भीतर क्रिया पूरी होने को दर्शाता है; ‘ही’ एक दिन की सीमित अवधि पर बल देता है।
