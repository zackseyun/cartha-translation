  terminology: ‘वस्त्र’ suitably renders στολάς. ‘पुरुष’ is contextually appropriate for οἱ ἄνθρωποι. Rendering δόξαν as ‘शोभा’ retains the possible sense of splendor/adornment without narrowing it to personal pride or honor. ‘रह नहीं सकते’ appropriately avoids over-specifying εἶναι as biological existence.
