  yaml_path: translation/deuterocanon/1_esdras/003/040.yaml
  text: And these make the garments of men[a], and these bring glory to men, and men cannot exist apart from women.
translation:
  language: hi
  text: और यही स्त्रियाँ पुरुषों के वस्त्र बनाती हैं, और यही पुरुषों की शोभा बढ़ाती हैं, और पुरुष स्त्रियों के बिना रह नहीं सकते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्त्रियों के बिना हो नहीं सकते।” यूनानी में प्रयुक्त क्रिया का शाब्दिक अर्थ “होना” है; प्रसंग में इसका अनुवाद “रहना” या अधिक स्पष्ट रूप से “अस्तित्व में रहना” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὗται
  choice: यही स्त्रियाँ
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम का संदर्भ पिछले प्रसंग की स्त्रियों से है। हिन्दी में संदर्भ को स्पष्ट करने और यूनानी की बलाघाती पुनरावृत्ति बनाए रखने के लिए ‘यही स्त्रियाँ’ और फिर ‘यही’ रखा गया है।
- source_word: ποιοῦσιν
  choice: बनाती हैं / दिलाती हैं
  rationale: पहले प्रयोग में वस्त्रों के साथ ‘बनाती हैं’ सीधा और स्वाभाविक है। दूसरे में δόξαν के साथ वही क्रिया हिन्दी में शब्दशः दोहराने के बजाय ‘गौरव दिलाती हैं’ अर्थ और समानांतर बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: στολάς
  choice: वस्त्र
  rationale: στολή के व्यापक अर्थ ‘परिधान/वस्त्र’ को व्यक्त करता है और इसे केवल औपचारिक चोगों तक सीमित नहीं करता।
- source_word: δόξαν
  choice: गौरव
  rationale: यहाँ δόξα पुरुषों को मिलने वाले सम्मान, प्रतिष्ठा या शोभा का बोध करा सकता है। ‘गौरव’ ऊँची आलंकारिक शैली को रखते हुए इस अर्थ-विस्तार को पर्याप्त रूप से खुला रखता है।
- source_word: οἱ ἄνθρωποι
  choice: पुरुष
  rationale: यद्यपि ἄνθρωποι सामान्यतः मनुष्यों को भी दर्शा सकता है, यहाँ τῶν γυναικῶν (‘स्त्रियों’) के स्पष्ट विरोध-संबंध में पुरुष अभिप्रेत हैं।
- source_word: εἶναι
  choice: रह
  rationale: δύνανται के साथ εἶναι का मूल अर्थ ‘होना’ है। हिन्दी में ‘स्त्रियों के बिना रह नहीं सकते’ स्वाभाविक है और अस्तित्व तथा जीवनगत निर्भरता—दोनों की संभावित छाया बनाए रखता है।
- source_word: χωρὶς τῶν γυναικῶν
  choice: स्त्रियों के बिना
  rationale: χωρίς का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप है; यह स्त्रियों से अलग या उनके अभाव में रहने की बात व्यक्त करता है।
theological_decisions:
- issue: स्त्रियों के विपरीत οἱ ἄνθρωποι का लिंग-संदर्भ
  choice: पुरुष
  alternative: लोग / मनुष्य
  rationale: वाक्य स्त्रियों और पुरुषों के बीच संबंध की बात करता है। इसलिए सामान्य मानवजाति का अर्थ देने वाले ‘लोग’ या ‘मनुष्य’ की अपेक्षा ‘पुरुष’ प्रसंग और यूनानी विरोध-संरचना से अधिक मेल खाता है।
- issue: εἶναι के व्यापक दावे की सीमा
  choice: रह नहीं सकते
  alternative: अस्तित्व में नहीं रह सकते / स्त्रियों के बिना हो नहीं सकते
  rationale: यूनानी क्रिया केवल ‘होना’ कहती है और यह स्पष्ट नहीं करती कि आशय दैनिक जीवन, सामाजिक निर्भरता या मानव अस्तित्व/निरंतरता में से किस पर विशेष रूप से है। ‘रह नहीं सकते’ इस तनाव को अनावश्यक रूप से किसी एक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण शैली अपनाई गई है। यूनानी की तीन समन्वित धाराओं और αὗται की पुनरावृत्ति का आलंकारिक बल ‘और यही… और यही… और…’ द्वारा रखा गया है।
