  yaml_path: translation/deuterocanon/1_esdras/003/003.yaml
  text: And they ate and drank[a], and when they were filled, they departed. But Darius the king went into his bedchamber and slept[b], and then awoke.
translation:
  language: hi
  text: उन्होंने खाया-पिया और तृप्त हो जाने पर[a] चले गए। परन्तु राजा दारा अपने शयनकक्ष में गया और सो गया; फिर वह जाग उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भर जाने पर।” यूनानी शब्द विशेष रूप से खाने-पीने के बाद पेट भर जाने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: उन्होंने खाया-पिया
  rationale: दोनों यूनानी क्रियाएँ साधारण कथात्मक भूतकाल में हैं। संयुक्त हिन्दी प्रयोग ‘खाया-पिया’ उनके स्वाभाविक क्रम और सादगी को बनाए रखता है।
- source_word: ἐμπλησθέντες
  choice: तृप्त हो जाने पर
  rationale: कृदन्त भोजन और पेय से भर जाने या भरपेट हो जाने की अवस्था तथा उसके बाद की क्रिया व्यक्त करता है। ‘तृप्त’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी ठोस ‘भर जाने’ का भाव सुरक्षित रखती है।
- source_word: ἀνέλυσαν
  choice: चले गए
  rationale: इस प्रसंग में क्रिया भोजन या सभा के बाद वहाँ से विदा होने का संकेत देती है। ‘चले गए’ सहज है और ‘तितर-बितर हो गए’ जैसी अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: κοιτῶνα
  choice: शयनकक्ष
  rationale: यह सोने के निजी कक्ष को दर्शाता है। ‘शयनकक्ष’ आधुनिक, गरिमापूर्ण और राजकीय प्रसंग के अनुकूल है।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: यहाँ क्रिया का सीधा अर्थ सोना है। हिन्दी का एकवचन पुल्लिंग रूप कर्ता दारा से मेल खाता है।
- source_word: ἔξυπνος ἐγένετο
  choice: फिर वह जाग उठा
  rationale: यूनानी अभिव्यक्ति का शाब्दिक भाव ‘जागृत हो गया’ है। ‘जाग उठा’ स्वाभाविक हिन्दी में उसी परिणामी अवस्था और कथात्मक क्रम को व्यक्त करता है।
- source_word: ὁ δὲ Δαρεῖος ὁ βασιλεὺς
  choice: परन्तु राजा दारा
  rationale: δέ समूह से दारा की ओर हल्का संक्रमण या विरोध दिखाता है। ‘परन्तु’ इस बदलाव को स्पष्ट रखता है; नाम का प्रचलित हिन्दी रूप ‘दारा’ लिया गया है।
