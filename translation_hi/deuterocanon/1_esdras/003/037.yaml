base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/037.yaml
  text: Men[a], is not the king great, and are not men many, and does not wine have strength? Who then is the one who rules over them[b], or who is the one who has mastery over them? Is it not women?
translation:
  language: hi
  text: हे पुरुषो, क्या राजा महान नहीं है, क्या पुरुष बहुत-से नहीं हैं[a], और क्या दाखमधु बलवान नहीं है[b]? तो फिर उन पर प्रभुता किसकी है, या उन पर अधिकार कौन रखता है? क्या स्त्रियाँ ही नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ सामान्य रूप से ‘लोग’ या ‘मनुष्य’ भी हो सकता है; यहाँ आगे ‘स्त्रियों’ से किए गए विरोध के कारण ‘पुरुष’ अनूदित है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सामर्थ्य नहीं रखता’। यूनानी क्रिया का अर्थ ‘बलवान होना’ अथवा ‘सामर्थ्य रखना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: हे पुरुषो
  rationale: ἀνήρ का संबोधन-बहुवचन है। हिन्दी में ‘हे पुरुषो’ प्रत्यक्ष संबोधन और आगे आने वाले स्त्री-पुरुष विरोध—दोनों को स्पष्ट रखता है।
- source_word: μέγας
  choice: महान
  rationale: राजा की महानता और प्रतिष्ठा व्यक्त करने वाला सीधा समतुल्य; ‘शक्तिशाली’ कहने से अर्थ अनावश्यक रूप से केवल सामर्थ्य तक सीमित हो जाता।
- source_word: πολλοὶ οἱ ἄνθρωποι
  choice: पुरुष बहुत-से हैं
  rationale: ἄνθρωποι सामान्यतः ‘लोग’ भी हो सकता है, पर अगले वाक्यांश में γυναῖκες के साथ स्पष्ट विरोध के कारण यहाँ लिंग-सूचक ‘पुरुष’ प्रसंग के तर्क को बेहतर बनाए रखता है।
- source_word: οἶνος
  choice: दाखमधु
  rationale: मादक अंगूरी पेय के लिए बाइबिलीय हिन्दी में परिचित और गरिमापूर्ण शब्द है।
- source_word: ἰσχύει
  choice: बलवान है
  rationale: क्रिया का मूल भाव ‘बलवान होना/सामर्थ्य रखना’ है। ‘बलवान है’ यूनानी की संक्षिप्तता और अलंकारिक समानांतरता बनाए रखता है।
- source_word: δεσπόζων
  choice: प्रभुता किसकी है
  rationale: δεσπόζω का आशय किसी पर स्वामी की तरह प्रभुता करने से है। भाववाचक हिन्दी रचना प्रश्न को स्वाभाविक रखते हुए इस अर्थ को व्यक्त करती है।
- source_word: κυριεύων
  choice: अधिकार कौन रखता है
  rationale: κυριεύω के शासन अथवा अधिकार रखने के भाव को व्यक्त करता है और निकटार्थी δεσπόζων से हल्का शब्दगत अंतर भी बनाए रखता है।
- source_word: γυναῖκες
  choice: स्त्रियाँ
  rationale: बहुवचन का सामान्य अर्थ ‘स्त्रियाँ’ है; इसे केवल विवाहित ‘पत्नियों’ तक सीमित करने का प्रसंगगत आधार नहीं है।
theological_decisions:
- issue: ἄνθρωποι में सामान्य मानवता और पुरुषों के बीच अर्थ-संभावना
  choice: मुख्य पाठ में ‘पुरुष’
  alternative: ‘लोग’ या ‘मनुष्य’
  rationale: शब्द अपने आप में सामान्य मानवों को सूचित कर सकता है, किंतु इसी तर्क का निष्कर्ष स्त्रियों के प्रभुत्व से संबंधित है; इसलिए पुरुष-स्त्री विरोध को बनाए रखना प्रसंगानुकूल है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: δεσπόζων और κυριεύων की निकटार्थी जोड़ी
  choice: ‘प्रभुता किसकी है’ और ‘अधिकार कौन रखता है’ के रूप में थोड़ा भेद
  alternative: दोनों को ‘शासन कौन करता है’ कहना
  rationale: यूनानी में दो निकटार्थी क्रियाएँ अलंकारिक बल देती हैं। हिन्दी में हल्का भेद इस समानांतरता को बचाता है, बिना दोनों के बीच कोई कृत्रिम धर्मवैज्ञानिक अंतर स्थापित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर प्रत्यक्ष संबोधन और अलंकारिक प्रश्नों की गरिमा बनाए रखने के लिए ‘हे पुरुषो’, ‘दाखमधु’ और ‘प्रभुता’ जैसे परिचित बाइबिलीय शब्द रखे गए हैं। तीन आरंभिक प्रश्नों की समानांतर संरचना यूनानी वक्तृत्व को स्पष्ट करती है।
