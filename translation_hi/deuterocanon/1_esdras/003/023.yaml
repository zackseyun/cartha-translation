  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली अपनाई गई है। प्रत्यक्ष संबोधन की प्राचीन औपचारिकता मुख्य पाठ में रखी गई है, जबकि अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
