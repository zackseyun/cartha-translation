  yaml_path: translation/deuterocanon/1_esdras/003/023.yaml
  text: Men[a], does not wine prevail, since it compels one to act this way? And he became silent after saying this.
translation:
  language: hi
  text: “हे पुरुषो[a], क्या दाखमधु प्रबल नहीं है, क्योंकि वह मनुष्य को इस प्रकार करने के लिए विवश करता है?” इतना कहकर वह चुप हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “हे पुरुषो, क्या दाखमधु प्रबल नहीं है, क्योंकि वह इस प्रकार करने के लिए विवश करता है?”'
    reason: संबोधन और निहित कर्म के अधिक शाब्दिक रूप को दर्ज करना।
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: हे पुरुषो
  rationale: यह पुरुष श्रोताओं को किया गया प्रत्यक्ष संबोधन है। ‘हे पुरुषो’ यूनानी संबोधन की पुकार और पुल्लिंग दोनों को सुरक्षित रखता है; आधुनिक हिन्दी में इसकी औपचारिकता स्पष्ट करने हेतु पादटिप्पणी दी गई है।
- source_word: οὐχ ὑπερισχύει
  choice: क्या ... प्रबल नहीं है
  rationale: क्रिया का अर्थ अधिक शक्तिशाली होना या प्रबल होना है। नकारात्मक आलंकारिक प्रश्न को हिन्दी में ‘क्या ... नहीं’ से बनाए रखा गया है।
- source_word: ὁ οἶνος
  choice: दाखमधु
  rationale: οἶνος अंगूर से बने मादक पेय को दर्शाता है। ‘दाखमधु’ गरिमापूर्ण और सटीक हिन्दी बाइबलीय पद है।
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: क्योंकि वह मनुष्य को इस प्रकार करने के लिए विवश करता है
  rationale: ἀναγκάζει की बाध्य करने वाली शक्ति ‘विवश करता है’ से व्यक्त होती है। यूनानी में कर्म निहित है; हिन्दी की स्वाभाविकता के लिए सामान्य ‘मनुष्य को’ जोड़ा गया है। ‘इस प्रकार करने’ से ποιεῖν की व्यापकता और οὕτως का संकेत सुरक्षित रहता है।
- source_word: καὶ ἐσίγησεν
  choice: वह चुप हो गया
  rationale: अपूर्णकालिक नहीं बल्कि कथात्मक एओरिस्ट वक्तव्य के समाप्त होने पर मौन होने की घटना बताता है; ‘चुप हो गया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: οὕτως εἴπας
  choice: इतना कहकर
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया दिखाता है। ‘इतना कहकर’ हिन्दी में संक्षिप्त और स्वाभाविक रूप से वही क्रम व्यक्त करता है।
