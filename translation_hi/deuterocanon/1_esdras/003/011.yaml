lexical_decisions:
- source_word: ὁ ἕτερος
  choice: दूसरे ने
  rationale: संज्ञा के रूप में प्रयुक्त सविशेषण ἕτερος पहले लेखक के विपरीत क्रम में अगले लेखक की ओर संकेत करता है। संक्षिप्त हिन्दी में ‘दूसरे ने’ स्वाभाविक है और अनावश्यक रूप से ‘दूसरा व्यक्ति’ नहीं जोड़ता।
- source_word: ἔγραψεν
  choice: लिखा
  rationale: γράφω का यह सामान्य भूतकालीन रूप है; प्रसंग किसी विशेष प्रकार के उत्कीर्णन की माँग नहीं करता।
- source_word: Ὑπερισχύει
  choice: अधिक शक्तिशाली है
  rationale: ὑπερισχύω शक्ति या सामर्थ्य में बढ़कर होने अथवा प्रबल पड़ने का भाव देता है। प्रतियोगिता के दावों के प्रसंग में ‘अधिक शक्तिशाली है’ तुलनात्मक बल को बनाए रखता है, पर यूनानी में स्पष्ट न होने के कारण ‘सबसे’ नहीं जोड़ता।
- source_word: ὁ βασιλεύς
  choice: राजा
  rationale: βασιλεύς का सीधा और सटीक हिन्दी समतुल्य ‘राजा’ है; ‘शासक’ इससे अधिक व्यापक होगा।
