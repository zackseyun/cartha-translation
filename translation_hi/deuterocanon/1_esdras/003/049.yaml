lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: अपनी ही सोच में सुध-बुध खो बैठे
  rationale: ἀπενοήθησαν विवेक या मानसिक संतुलन खोने का भाव देता है, जबकि ταῖς ἰδίαις διανοίαις उनकी अपनी सोच या मन को स्पष्ट करता है। संयुक्त हिन्दी अभिव्यक्ति मूल की मुहावरेदार तीव्रता और उसके स्पष्ट मानसिक घटक—दोनों को बनाए रखती है।
- source_word: διὰ τὰς γυναῖκας
  choice: स्त्रियों के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है; यह अनुवाद सीधा और स्वाभाविक है।
- source_word: δοῦλοι
  choice: दास
  rationale: यहाँ अधीनता और बंधी हुई सामाजिक स्थिति प्रमुख है, इसलिए नरम अर्थ वाले ‘सेवक’ के बजाय ‘दास’ मूल शब्द का बल बेहतर रखता है।
- source_word: ἐγένοντο
  choice: बन गए
  rationale: क्रिया अवस्था-परिवर्तन बताती है; ‘बन गए’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: διʼ αὐτάς
  choice: उन्हीं के कारण
  rationale: यह स्त्रियों की ओर फिर संकेत करता है और मूल यूनानी में कारणसूचक वाक्यांश की पुनरावृत्ति को सुरक्षित रखता है; ‘उन्हीं’ संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: δοῦλοι का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: प्रसंग वास्तविक अधीनता पर बल देता है। ‘दास’ बंधन की तीव्रता को सुरक्षित रखता है और किसी विशेष सांप्रदायिक अर्थ को नहीं जोड़ता।
