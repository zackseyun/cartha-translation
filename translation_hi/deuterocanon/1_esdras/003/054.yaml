  yaml_path: translation/deuterocanon/1_esdras/003/054.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she becomes angry with him, he flatters her so that she may be reconciled to him.
translation:
  language: hi
  text: और इसके अलावा, राजा मुँह खोले हुए उसे एकटक देखता रहता है। यदि वह उस पर हँसती है,[a] तो वह भी हँसता है; पर यदि वह उससे नाराज़ हो जाती है, तो वह उसकी चापलूसी करता है, ताकि वह उससे मेल कर ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह उसके साथ हँसती है, तो वह भी हँसता है।” यूनानी में “हँसती है” के बाद आया दत्तिव कारक एक से अधिक संबंधसूचक अर्थों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: और इसके अलावा
  rationale: यह वाक्यांश तर्क में एक और बात जोड़ता है; यह चुनाव उसके संचयी बल को सहज आधुनिक हिन्दी में रखता है।
- source_word: χάσκων τὸ στόμα … ἐθεώρει αὐτήν
  choice: मुँह खोले उसे एकटक देखता रहता है
  rationale: χάσκων τὸ στόμα के स्पष्ट शारीरिक चित्र और ἐθεώρει के लगातार, ध्यानपूर्वक देखने के भाव—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: यदि वह उस पर हँसती है, तो वह भी हँसता है
  rationale: दोनों स्थानों पर γελάω की पुनरावृत्ति रखी गई है। αὐτῷ सम्बन्धसूचक दत्तिव है और उसका अर्थ ‘उस पर’ या ‘उसके साथ’ हो सकता है; मुख्य पाठ में एक सम्भव अर्थ और पाद-टिप्पणी में दूसरा दिया गया है।
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: वह उससे नाराज़ हो जाती है
  rationale: सन्दर्भ में यह किसी के प्रति कटु या क्रुद्ध हो जाने का भाव देता है; ‘नाराज़’ सामान्य आधुनिक हिन्दी में सम्बन्धगत भाव को स्पष्ट रखता है।
- source_word: κολακεύει αὐτήν
  choice: वह उसकी चापलूसी करता है
  rationale: क्रिया कृपा पाने के लिए प्रशंसापूर्ण या खुशामदी व्यवहार को दर्शाती है; ‘चापलूसी करता है’ इसका सीधा और पारदर्शी हिन्दी समतुल्य है।
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: ताकि वह उससे फिर मेल कर ले
  rationale: यह अनुग्रह अथवा सम्बन्ध की पुनर्बहाली को व्यक्त करता है। ‘फिर मेल कर ले’ स्वाभाविक हिन्दी में पुनर्मिलन का प्रयोजन बताता है और कर्तृवाच्य की अस्पष्टता को अनावश्यक रूप से सिद्धान्तगत नहीं बनाता।
