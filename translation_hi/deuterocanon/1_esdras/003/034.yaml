translation:
  language: hi
  text: परन्तु वे उसके चारों ओर पहरा देते रहते हैं; उनमें से कोई भी वहाँ से जाकर अपना काम नहीं कर सकता, और न वे उसकी आज्ञा टालते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηροῦσιν κύκλῳ περὶ αὐτόν
  choice: उसके चारों ओर पहरा देते रहते हैं
  rationale: τηρέω यहाँ राजा के आसपास तैनात अंगरक्षकों के पहरा देने का भाव रखता है; κύκλῳ περὶ αὐτόν को स्वाभाविक हिन्दी में ‘उसके चारों ओर’ कहा गया है।
- source_word: ἕκαστος
  choice: उनमें से कोई भी
  rationale: निषेधात्मक δύνανται के साथ प्रत्येक व्यक्ति की असमर्थता व्यक्त करने के लिए यह हिन्दी में स्वाभाविक है।
- source_word: ἀπελθεῖν καὶ ποιεῖν τὰ ἔργα αὐτοῦ
  choice: वहाँ से जाकर अपना काम ... कर सकता
  rationale: दोनों संयुक्त क्रियाओं को बनाए रखते हुए αὐτοῦ का अर्थ प्रत्येक पहरेदार का अपना काम रखा गया है।
- source_word: παρακούουσιν αὐτοῦ
  choice: उसकी आज्ञा टालते हैं
  rationale: παρακούω का प्रसंगगत अर्थ किसी की बात न मानना या अवज्ञा करना है; सम्बन्धकारक αὐτοῦ राजा की ओर संकेत करता है।
