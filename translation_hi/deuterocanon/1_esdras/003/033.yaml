  text: और उसकी सारी प्रजा और उसके सैन्य बल उसकी आज्ञा मानते हैं[a]। इसके अतिरिक्त, वह स्वयं लेटता, खाता, पीता और सोता है[b];
  philosophy: optimal-equivalence
  footnotes:
