    text: ‘सैन्य बल’ का अनुवाद ‘सेनाएँ’ भी हो सकता है; राजकीय संदर्भ में यूनानी शब्द δυνάμεις सशस्त्र बलों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘लेटता’ का अनुवाद ‘विश्राम करता’ या ‘लेटा रहता’ भी हो सकता है; पर इसके बाद खाने और पीने का उल्लेख होने से संभवतः भोजन के समय टेक लगाकर लेटने की प्रथा अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: उसकी सारी प्रजा
  rationale: λαός यहाँ राजा के अधीन समस्त जनसमुदाय को दर्शाता है। ‘प्रजा’ राजकीय संदर्भ में स्वाभाविक है, पर राजनीतिक स्थिति को ‘नागरिक’ जैसे अधिक विशिष्ट शब्द से सीमित नहीं करता।
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: उसकी सेनाएँ
  rationale: राजकीय संदर्भ में δυνάμεις का आशय सबसे स्वाभाविक रूप से सैन्य बलों से है। हिन्दी में ‘सेनाएँ’ स्पष्ट और सहज है; व्यापक अर्थ ‘सैन्य बल’ को पादटिप्पणी में रखा गया है।
- source_word: ἐνακούουσιν
  choice: उसकी आज्ञा मानती हैं
  rationale: क्रिया का मूल संबंध सुनने से है, पर यहाँ शासकीय अधिकार की बात होने के कारण इसका प्रसंगगत अर्थ ‘आज्ञा मानना’ है।
- source_word: πρὸς δὲ τούτοις
  choice: इसके अतिरिक्त
  rationale: यह पदबंध तर्क में एक और बात जोड़ता है; ‘इसके अतिरिक्त’ उसका योगात्मक बल स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀνάκειται
  choice: लेटकर
  rationale: ἀνάκειται का अर्थ लेटना या टिककर बैठना हो सकता है और भोजन के प्रसंग में मेज पर लेटकर खाने की प्राचीन मुद्रा भी सूचित कर सकता है। ‘लेटकर’ मूल मुद्रा को बिना अत्यधिक व्याख्या के व्यक्त करता है।
- source_word: ἐσθίει καὶ πίνει καὶ καθεύδει
  choice: खाता-पीता और सोता है
  rationale: सरल वर्तमानकालीन क्रियाओं के क्रम को सहज हिन्दी समन्वय में रखा गया है; ‘खाता-पीता’ खाने और पीने की दोनों अलग क्रियाओं को संक्षेप में स्वाभाविक ढंग से व्यक्त करता है।
