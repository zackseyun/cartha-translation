lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: उतारकर
  rationale: यह राजा के सिर से मुकुट हटाने की क्रिया को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है; आसपास का वर्णन आदतन या बार-बार होने वाली क्रिया का भाव देता है।
- source_word: τὸ διάδημα
  choice: मुकुट
  rationale: διάδημα राजकीय सिरोभूषण को दर्शाता है। ‘मुकुट’ आधुनिक हिन्दी में स्पष्ट और सहज है; अधिक औपचारिक ‘राजमुकुट’ भी संभव है।
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: अपने ऊपर रख लेती थी
  rationale: αὐτῇ उसी स्त्री की ओर संकेत करता है। यूनानी पाठ केवल ‘अपने ऊपर’ कहता है; ‘अपने सिर पर’ अर्थतः संभव होते हुए भी अनावश्यक स्पष्टता जोड़ता।
- source_word: ἐράπιζεν
  choice: थप्पड़ मारती थी
  rationale: ῥαπίζω सामान्यतः हाथ से प्रहार, विशेषकर थप्पड़ मारने, को व्यक्त करता है। इसलिए यह ‘मारती थी’ की तुलना में स्रोत की विशिष्टता अधिक ठीक से रखता है।
- source_word: τῇ ἀριστερᾷ
  choice: अपने बाएँ हाथ से
  rationale: स्त्रीलिंग दत्तिवाचक रूप में ‘हाथ’ निहित है और करण का भाव है; हिन्दी में ‘हाथ’ जोड़ना आवश्यक और स्वाभाविक है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों क्रियाओं को यूनानी पाठ की सीधी समन्वयात्मक संरचना के अनुरूप जोड़ा गया है।
