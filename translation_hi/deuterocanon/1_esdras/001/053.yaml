base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/053.yaml
  text: And they brought all her splendor to ruin[b][a], and he carried the survivors away with the sword to Babylon.
translation:
  language: hi
  text: और उन्होंने उसकी सारी शोभा को नष्ट कर दिया; और वह बचे हुए लोगों को तलवार के बल पर बाबेल ले गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तलवार के बल पर” का सम्बन्ध पिछले विनाश से भी समझा जा सकता है—अर्थात शेष लोगों को हिंसक विजय के बाद बन्दी बनाकर ले जाया गया। समानान्तर इब्रानी पाठ तलवार से मारे जाने पर बल देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: συνετέλεσαν ... ἀχρειῶσαι
  choice: नष्ट कर दिया
  rationale: यह संयुक्त अभिव्यक्ति किसी वस्तु को पूरी तरह अनुपयोगी या बरबाद कर देने का भाव देती है। सहज हिन्दी में ‘नष्ट कर दिया’ विनाश की पूर्णता व्यक्त करता है, बिना ऐसे पवित्रीकरण-विरोधी अर्थ जोड़े जो क्रिया में स्पष्ट नहीं है।
- source_word: πάντα τὰ ἔνδοξα αὐτῆς
  choice: उसकी सारी शोभा
  rationale: ἔνδοξα नगर की गौरवशाली या वैभवपूर्ण वस्तुओं को सामूहिक रूप से दर्शाता है। ‘उसकी सारी शोभा’ स्त्रीलिंग सर्वनाम और सामूहिक अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τοὺς ἐπιλοίπους
  choice: बचे हुए लोगों
  rationale: यह विनाश के बाद शेष रहे लोगों को सूचित करता है। ‘बचे हुए लोग’ स्पष्ट और स्वाभाविक है तथा ‘शेष जन’ से जुड़ सकने वाला अनावश्यक धर्मवैज्ञानिक भार नहीं लाता।
- source_word: ἀπήγαγεν
  choice: ले गया
  rationale: एकवचन क्रिया बलपूर्वक निर्वासन में ले जाने को व्यक्त करती है। ‘ले गया’ प्रसंग में स्वाभाविक है; बलपूर्वकता अगले पदबंध ‘तलवार के बल पर’ से स्पष्ट होती है।
- source_word: μετὰ ῥομφαίας
  choice: तलवार के बल पर
  rationale: शाब्दिक अर्थ ‘तलवार के साथ’ है, पर यहाँ हिंसक विजय और बलपूर्वक ले जाए जाने का भाव है। यह अनुवाद ग्रीक पदबंध को निर्वासन की क्रिया से जोड़ता है, जबकि पादटिप्पणी उसके सम्भव वैकल्पिक सम्बन्ध को सुरक्षित रखती है।
- source_word: εἰς Βαβυλῶνα
  choice: बाबेल
  rationale: दिशासूचक पदबंध का स्वाभाविक हिन्दी रूप ‘बाबेल ले गया’ है। ‘बाबेल’ बाइबिलीय स्थान-नाम का प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: बहुवचन क्रिया के बाद एकवचन ἀπήγαγεν का कर्ता
  choice: ‘वह’ से बाबेल के राजा को सूचित किया गया है
  alternative: एकवचन आक्रमणकारी सेना को सामूहिक रूप से सूचित कर सकता है
  rationale: ग्रीक पाठ बहुवचन से एकवचन में स्पष्ट परिवर्तन करता है। व्यापक कथा-सन्दर्भ राजा को कर्ता मानने का समर्थन करता है; फिर भी पद में उसका नाम जोड़कर अस्पष्टता को कृत्रिम रूप से समाप्त नहीं किया गया।
- issue: τοὺς ἐπιλοίπους का धर्मवैज्ञानिक ‘शेष’ शब्दावली से सम्बन्ध
  choice: बचे हुए लोग
  alternative: शेष जन
  rationale: यहाँ मुख्य बल विनाश के बाद जीवित बचे लोगों पर है, किसी विकसित धर्मवैज्ञानिक ‘शेष’ धारणा पर नहीं।
- issue: μετὰ ῥομφαίας का वाक्यगत सम्बन्ध
  choice: तलवार के बल पर बचे हुओं को बाबेल ले जाना
  alternative: तलवार द्वारा हुए पूर्ववर्ती विनाश से निकट सम्बन्ध
  rationale: ग्रीक वाक्य-विन्यास इसे ἀπήγαγεν के साथ पढ़ने देता है, पर पदबंध संक्षिप्त है और समानान्तर इब्रानी पाठ तलवार से हत्या पर बल देता है। इसलिए मुख्य पाठ में निकटतम सम्बन्ध रखा गया और वैकल्पिक समझ पादटिप्पणी में दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। बहुवचन ‘उन्होंने’ से एकवचन ‘वह’ में ग्रीक का परिवर्तन सुरक्षित रखा गया है। ‘शोभा’ सामूहिक वैभव को और ‘बचे हुए लोग’ ऐतिहासिक जीवित बचे लोगों को बिना अतिरिक्त सम्प्रदायगत अर्थ के व्यक्त करता है।
