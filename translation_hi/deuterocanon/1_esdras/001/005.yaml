base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/005.yaml
  text: according to the writing of David king of Israel[a], and according to the greatness of Solomon his son; and standing in the sanctuary according to your ancestral division, O Levites, before your brothers, the sons of Israel[c][b],
translation:
  language: hi
  text: इस्राएल के राजा दाऊद के लिखित निर्देश के अनुसार और उसके पुत्र सुलैमान की महानता[a] के अनुसार; और तुम लेवियों की पैतृक विभाग-व्यवस्था के अनुसार पवित्रस्थान[b] में, अपने भाइयों, इस्राएल के पुत्रों, के सामने खड़े रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महिमा” अथवा “भव्यता।” यहाँ सुलैमान की प्रतिष्ठित या भव्य व्यवस्था की ओर भी संकेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “पवित्र [स्थान] में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφήν
  choice: लिखित निर्देश
  rationale: यहाँ शब्द दाऊद से संबद्ध लिखित व्यवस्था या निर्देश को दर्शाता है; इससे बाद के तकनीकी अर्थ में ‘पवित्रशास्त्र’ समझने से बचते हुए यूनानी और इब्रानी समानांतर दोनों का भाव मिलता है।
- source_word: μεγαλειότητα
  choice: महिमा
  rationale: यह शब्द महानता, वैभव या गरिमा का बोध करा सकता है। ‘महिमा’ स्रोत की अस्पष्टता को यथासंभव बनाए रखती है, यद्यपि यहाँ सुलैमान की प्रतिष्ठित या भव्य व्यवस्था अभिप्रेत हो सकती है।
- source_word: στᾶντες
  choice: खड़े होकर ... रहो
  rationale: यूनानी कृदंत को हिन्दी में प्रसंगानुकूल आज्ञार्थक बल के साथ स्वाभाविक बनाया गया है, जबकि ‘खड़े होकर’ मूल रूप की क्रियात्मक कड़ी को बनाए रखता है।
- source_word: ἐν τῷ ἁγίῳ
  choice: पवित्रस्थान
  rationale: शाब्दिक अर्थ ‘पवित्र [स्थान] में’ है। ‘पवित्रस्थान’ मंदिर के पवित्र परिसर को व्यक्त करता है, बिना किसी विशिष्ट वास्तु-भाग को निश्चित किए।
- source_word: μεριδαρχίαν τὴν πατρικήν
  choice: अपने पूर्वजों के दल के अनुसार
  rationale: दुर्लभ संज्ञा व्यवस्थित भागों या दलों का संकेत करती है और विशेषण वंशगत आधार बताता है। यह हिन्दी रूप यूनानी की संक्षिप्तता बनाए रखते हुए इब्रानी समानांतर के पितृकुल-आधारित विभाजनों से मेल खाता है।
- source_word: τῶν ἔμπροσθεν τῶν ἀδελφῶν ὑμῶν
  choice: अपने भाइयों ... के सामने
  rationale: ἔμπροσθεν का स्थानवाचक अर्थ ‘सामने’ है; यह लेवियों की इस्राएली भाइयों के समक्ष स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी की स्पष्ट पारिवारिक और वंशगत अभिव्यक्ति को सामान्यीकृत ‘इस्राएलियों’ में बदलने के बजाय सुरक्षित रखा गया है।
theological_decisions:
- issue: υἱῶν Ἰσραήλ की लिंगयुक्त पारिवारिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मूल में वंशगत पुरुषवाचक पदबंध है। उसे बनाए रखने से वाचा और गोत्र-संबंधी पारिवारिक भाषा सुरक्षित रहती है।
- issue: संक्षिप्त यूनानी पदबंध को इब्रानी समानांतर से स्पष्ट करना
  choice: अपने पूर्वजों के दल के अनुसार
  alternative: अपने पितरों के घरानों और अपने दलों के अनुसार
  rationale: मुख्य आधार यूनानी ही रखा गया है। इब्रानी समानांतर वंशगत संगठन की पुष्टि करता है, पर उसके अधिक विस्तृत शब्दों को मुख्य पाठ में जोड़कर यूनानी को विस्तारित नहीं किया गया।
- issue: μεγαλειότητα का आशय
  choice: महिमा
  alternative: महानता; भव्य व्यवस्था
  rationale: पद सुलैमान की महानता/वैभव अथवा उसकी प्रतिष्ठित व्यवस्था की ओर संकेत कर सकता है। मुख्य पाठ में व्यापक शब्द रखकर इस तनाव को अनिर्णीत छोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। पद की यूनानी वाक्य-संरचना को पूरी तरह कठोर न रखते हुए आज्ञार्थक संदर्भ स्पष्ट किया गया है। ‘लेवियो’ और ‘इस्राएल के पुत्रों’ से मूल की संबोधन तथा वंशगत भाषा सुरक्षित रहती है।
