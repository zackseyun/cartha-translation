base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/006.yaml
  text: In order[a], sacrifice the Passover, and prepare the sacrifices for your brothers[b], and keep the Passover according to the command of the Lord that was given to Moses.
translation:
  language: hi
  text: व्यवस्थित रीति से[a] फसह की बलि चढ़ाओ, अपने भाइयों[b] के लिए बलियाँ तैयार करो, और मूसा को दी गई प्रभु की आज्ञा के अनुसार फसह मनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उचित क्रम में” अथवा “वर्ग या पद के अनुसार”; यह पद सुव्यवस्थित ढंग से कार्य करने की ओर संकेत करता है। समानांतर इब्रानी पाठ में दलों या वर्गों पर बल है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” का अर्थ केवल सगे पुरुष भाई नहीं, बल्कि अपने समुदाय के साथी सदस्य भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τάξει
  choice: व्यवस्थित रीति से
  rationale: यूनानी पद क्रियाविशेषण की तरह उचित व्यवस्था या निर्धारित क्रम में कार्य करने का भाव देता है। यह समानांतर इब्रानी पाठ में दलों या वर्गों के अनुसार व्यवस्था किए जाने के संकेत से भी मेल खाता है।
- source_word: θύσατε τὸ πάσχα
  choice: फसह की बलि चढ़ाओ
  rationale: θύω बलिदान-संबंधी प्रसंग में बलि करने या चढ़ाने को दर्शाता है। τὸ πάσχα पर्व अथवा उसके बलि-पशु, दोनों की ओर संकेत कर सकता है; हिंदी वाक्यांश बलिदानी आशय को स्पष्ट रखते हुए अनावश्यक रूप से ‘मेमना’ नहीं जोड़ता।
- source_word: τὰς θυσίας
  choice: अन्य बलियाँ
  rationale: बहुवचन संज्ञा का मूल अर्थ ‘बलियाँ’ है। हिंदी में ‘अन्य’ जोड़ने से पहले उल्लिखित फसह की बलि और आगे की बहुवचन बलियों का स्वाभाविक संबंध स्पष्ट होता है, यद्यपि यूनानी में ‘अन्य’ अंतर्निहित है, व्यक्त नहीं।
- source_word: ἑτοιμάσατε
  choice: तैयार करो
  rationale: यह अनुष्ठान के लिए आवश्यक तैयारी का सीधा, वर्तमान और स्वाभाविक हिंदी रूप है।
- source_word: τοῖς ἀδελφοῖς ὑμῶν
  choice: अपने भाइयों के लिए
  rationale: ‘भाइयों’ से यूनानी के पुल्लिंग पारिवारिक शब्द को बनाए रखा गया है। प्रसंग में इसका अर्थ केवल सगे भाई नहीं, बल्कि समुदाय के साथी सदस्य हैं; इसे पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ποιήσατε τὸ πάσχα
  choice: फसह मनाओ
  rationale: ποιέω और πάσχα का संयोजन फसह का पालन या उत्सव मनाने का मुहावरा है। ‘मनाओ’ आधुनिक हिंदी में स्वाभाविक है और पहली बलिदानी क्रिया से भेद भी बनाए रखता है।
- source_word: κατὰ τὸ πρόσταγμα
  choice: आज्ञा के अनुसार
  rationale: πρόσταγμα अधिकारपूर्वक दी गई आज्ञा या आदेश को दर्शाता है; ‘आज्ञा’ धार्मिक प्रसंग में स्पष्ट और गरिमापूर्ण है।
- source_word: τοῦ κυρίου
  choice: प्रभु की
  rationale: प्राथमिक यूनानी पाठ में κυρίου है, इसलिए इसे ‘प्रभु’ कहा गया है; इसे अनुमान के आधार पर इब्रानी दिव्य नाम के रूप में प्रस्तुत नहीं किया गया।
- source_word: τὸ δοθὲν τῷ Μωυσῇ
  choice: मूसा को दी गई
  rationale: कृदंत पद सीधे ‘आज्ञा’ को विशेषित करता है और बताता है कि वह मूसा को दी गई थी।
theological_decisions:
- issue: सामुदायिक अर्थ में ἀδελφοῖς का अनुवाद
  choice: भाइयों
  alternative: सजातीय लोगों / साथी इस्राएलियों
  rationale: मूल पाठ के पुल्लिंग संबंधवाचक शब्द को मुख्य पाठ में बनाए रखा गया है, जबकि उसकी व्यापक सामुदायिक परिधि पाद-टिप्पणी में बताई गई है।
- issue: यूनानी κύριος का ईश्वरीय संबोधन
  choice: प्रभु
  alternative: यहोवा / परमेश्वर
  rationale: प्राथमिक स्रोत यूनानी है और उसमें κύριος लिखा है। इसलिए संभावित इब्रानी आधार को पुनर्निर्मित कर कोई अलग ईश्वरीय नाम नहीं जोड़ा गया।
- issue: πάσχα के पहले और दूसरे प्रयोग का भेद
  choice: पहले ‘फसह की बलि’, फिर ‘फसह मनाओ’
  alternative: दोनों स्थानों पर केवल ‘फसह’
  rationale: पहला प्रयोग θύσατε के साथ बलिदानी क्रिया को और दूसरा ποιήσατε के साथ पर्व के पालन को व्यक्त करता है। यह भेद प्रसंगगत है, पर पहले प्रयोग को विशेष रूप से ‘फसह का मेमना’ कहकर उसकी संभावित व्यापकता सीमित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और अनुष्ठान-संगत रूप अपनाया गया है। ‘फसह’, ‘बलि’, ‘आज्ञा’ और ‘प्रभु’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं। वाक्य की लगातार आज्ञार्थक संरचना यूनानी पाठ के तीन आदेशों को स्पष्ट रूप से बनाए रखती है।
