base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/031.yaml
  text: for all the family of Israel[a]. Now these things have been recorded in the book of the histories concerning the kings of Judah, and each deed of Josiah, and his glory, and his understanding in the law of the Lord, and the things done by him, both the former things and those now recounted[b], are recorded in the book of the Kings of Israel and Judah.
translation:
  language: hi
  text: इस्राएल के सारे वंश के लिए। ये बातें यहूदा के राजाओं के इतिहास की पुस्तक[a] में लिखी हुई हैं; योशियाह के कार्यों का एक-एक विवरण, उसकी महिमा, और प्रभु की व्यवस्था के विषय में उसकी समझ भी उसमें लिखी हुई हैं। उसके द्वारा किए गए काम और अभी वर्णित की गई ये बातें[b] इस्राएल और यहूदा के राजाओं की पुस्तक में लिखी हुई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इतिहास की पुस्तक’ से संभवतः राजाओं से संबंधित कोई ऐतिहासिक या राजकीय अभिलेख अभिप्रेत है; ‘अभिलेखों की पुस्तक’ भी संभावित अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: 'अंत के निकट यूनानी वाक्य-विन्यास कुछ असहज है: शाब्दिक भाव है, ‘उसके द्वारा किए गए काम और वे बातें जो अब वर्णित हैं।’ अनुवाद इस अर्थ को बनाए रखता है कि योशियाह के काम और अभी सुनाई गई बातें, दोनों उस स्रोत-पुस्तक में लिखे बताए गए हैं।'
    reason: textual_difficulty
lexical_decisions:
- source_word: γένος
  choice: वंश
  rationale: यहाँ γένος पूरे इस्राएली कुल या जातीय समुदाय को दर्शाता है। ‘वंश’ रिश्तेदारी और साझा उद्गम की छाया बनाए रखता है।
- source_word: ἀναγέγραπται
  choice: लिखी हुई हैं
  rationale: पूर्णकालीन कर्मवाच्य का भाव है कि बातें लिखी जा चुकी हैं और अभिलेख में अब भी उपलब्ध हैं। यह हिन्दी में सहज तथा दस्तावेज़ी अर्थ के अनुकूल है।
- source_word: βίβλῳ τῶν ἱστορουμένων
  choice: इतिहास की पुस्तक
  rationale: वाक्यांश ऐतिहासिक वृत्तांत या राजकीय अभिलेख की ओर संकेत करता है। ‘इतिहास की पुस्तक’ मूल अर्थ के निकट और सामान्य पाठक के लिए स्पष्ट है।
- source_word: τὸ καθʼ ἓν πραχθὲν τῆς πράξεως Ἰωσείου
  choice: योशियाह के एक-एक काम
  rationale: καθʼ ἓν का एक-एक करके या विस्तार से दर्ज होने का भाव और πράσσω से बने शब्दों का कार्य-संबंध दोनों सुरक्षित रहते हैं।
- source_word: δόξης
  choice: महिमा
  rationale: δόξα यहाँ योशियाह के गौरव, सम्मान या यश को दर्शा सकता है। ‘महिमा’ सीधा बाइबलीय समतुल्य है और अर्थ की व्यापकता बनाए रखता है।
- source_word: συνέσεως
  choice: समझ
  rationale: यह शब्द विवेकपूर्ण बोध को दर्शाता है और यहाँ विशेष रूप से प्रभु की व्यवस्था से जुड़ा है। ‘समझ’ स्वाभाविक तथा सर्वसुलभ हिन्दी है।
- source_word: νόμῳ Κυρίου
  choice: प्रभु की व्यवस्था
  rationale: νόμος के लिए ‘व्यवस्था’ और κύριος के लिए ‘प्रभु’ हिन्दी बाइबलीय प्रयोग में सुबोध हैं तथा यूनानी पाठ को सीधे प्रतिबिंबित करते हैं।
- source_word: τὰ νῦν ἱστόρηται
  choice: अभी वर्णित की गई ये बातें
  rationale: प्रेषित यूनानी अभिव्यक्ति व्याकरण की दृष्टि से कुछ असहज है। यह अनुवाद वर्तमान वृत्तांत में अभी सुनाई गई बातों का संकेत बनाए रखता है।
- source_word: βυβλίῳ τῶν Βασιλέων Ἰσραὴλ καὶ Ἰούδα
  choice: इस्राएल और यहूदा के राजाओं की पुस्तक
  rationale: इसे स्रोत-ग्रंथ के नाम जैसा रखा गया है, पर किसी आधुनिक कैनोनिकल पुस्तक से अनावश्यक रूप से समान नहीं ठहराया गया।
theological_decisions:
- issue: νόμῳ Κυρίου में Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: मूल आधार-पाठ यूनानी है और उसमें Κυρίου है। ‘प्रभु’ यूनानी पद का सीधा, तटस्थ और प्रचलित हिन्दी समतुल्य है; इससे आधार-पाठ में न आए किसी विशिष्ट इब्रानी रूप को आरोपित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। आरंभिक वाक्यांश पिछले पद से जुड़ा हुआ खंड है, इसलिए उसकी अपूर्ण-संदर्भित प्रकृति सुरक्षित रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए तीन हिन्दी वाक्यों में बाँटा गया है, जबकि सूचना-क्रम और अंतिम अस्पष्टता बनाए रखी गई है।
