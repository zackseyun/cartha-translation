base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/009.yaml
  text: And Iechonias and Samaias and Nathanael his brother, and Sabias and Ochielos and Joram, commanders of thousands, gave to the Levites for the Passover one thousand sheep and seven hundred calves.
translation:
  language: hi
  text: और यकोन्याह, समायाह, और नतनएल, जो भाई था, तथा साबियास, ओकीएल और योराम ने, जो हज़ार-हज़ार के अधिकारी थे, लेवियों को फसह के लिए एक हज़ार भेड़ें और सात सौ बछड़े दिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '2 इतिहास 35:9 के इब्रानी समानांतर पाठ में अधिकारियों के नाम और पशुओं की संख्याएँ भिन्न हैं: वहाँ फसह के लिए 2,600 पशु और 300 मवेशी दिए गए हैं। यहाँ 1 एस्द्रास का अनुवाद उसके यूनानी पाठ से किया गया है, इसलिए मुख्य पाठ में यूनानी पाठ के नाम और संख्याएँ रखी गई हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: χιλίαρχοι
  choice: हज़ार-हज़ार के अधिकारी
  rationale: यह यूनानी पद मूलतः एक हज़ार पर नियुक्त अधिकारियों को दर्शाता है। यह अनुवाद पदवी का औपचारिक अर्थ बनाए रखता है और अनावश्यक रूप से आधुनिक सैन्य पद नहीं थोपता।
- source_word: εἰς πάσχα
  choice: फसह के लिए
  rationale: यह वाक्यांश पर्व अथवा उसके लिए नियत बलि के उद्देश्य को दर्शाता है। चुना हुआ रूप स्वाभाविक है और धार्मिक उपयोग की सटीक सीमा को खुला रखता है।
- source_word: πρόβατα
  choice: भेड़ें
  rationale: यूनानी शब्द भेड़ अथवा छोटे झुंड-पशुओं के लिए प्रयुक्त हो सकता है; यहाँ 'भेड़ें' सीधा और सुबोध अनुवाद है।
- source_word: μόσχους
  choice: बछड़े
  rationale: μόσχος सामान्यतः बछड़े या जवान बैल को दर्शाता है। 'बछड़े' अर्थ को आवश्यकता से अधिक विशिष्ट किए बिना सहज हिन्दी देता है।
- source_word: ὁ ἀδελφὸς
  choice: जो भाई था
  rationale: यूनानी में निश्चित उपपद के साथ केवल 'भाई' है और संबंध का स्वामी स्पष्ट नहीं किया गया। यह रूप हिन्दी में समझने योग्य रहते हुए 'उसका' जोड़कर किसी निश्चित पूर्ववर्ती को आरोपित नहीं करता।
- source_word: ἔδωκαν τοῖς Λευείταις
  choice: लेवियों को ... दिए
  rationale: यह साधारण देने की क्रिया और अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी क्रम में व्यक्त करता है।
