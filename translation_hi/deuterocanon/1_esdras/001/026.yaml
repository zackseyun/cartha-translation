base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/026.yaml
  text: And Josiah did not turn back to his chariot[a], but attempted to fight him, not paying attention to the words of Jeremiah the prophet from the mouth of the Lord.
translation:
  language: hi
  text: और योशियाह अपने रथ की ओर वापस नहीं मुड़ा[a], बल्कि उससे युद्ध करने का प्रयत्न करता रहा। उसने यिर्मयाह भविष्यद्वक्ता के उन वचनों पर ध्यान नहीं दिया, जो प्रभु के मुख से निकले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने रथ की ओर पीछे नहीं हटा।” यूनानी वाक्यांश संक्षिप्त है और इसका आशय अपने रथ में या उसकी ओर लौटकर पीछे हटने से इनकार करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπέστρεψεν ἑαυτὸν
  choice: वापस नहीं मुड़ा
  rationale: प्रतिवाचक रचना का स्वाभाविक अर्थ स्वयं पीछे मुड़ना या हट जाना है। यह चयन सैन्य प्रसंग में सहज है और योशियाह की मंशा के विषय में अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἐπὶ τὸ ἅρμα αὐτοῦ
  choice: अपने रथ की ओर
  rationale: ἐπί के साथ यह संक्षिप्त यूनानी पदबंध रथ की ओर लौटने या पीछे हटने का संकेत देता है। ‘की ओर’ दिशा को बनाए रखता है और अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: πολεμεῖν αὐτὸν ἐπεχείρει
  choice: उससे युद्ध करने का प्रयत्न करता रहा
  rationale: ἐπιχειρέω के साथ infinitive किसी काम का प्रयत्न या उपक्रम करना बताता है। अपूर्णकालीन रूप की जारी क्रिया को ‘करता रहा’ व्यक्त करता है।
- source_word: οὐ προσέχων
  choice: ध्यान नहीं दिया
  rationale: προσέχω का अर्थ ध्यान देना या मानना है। ‘ध्यान नहीं दिया’ आधुनिक, स्पष्ट और स्रोत के निकट है।
- source_word: ῥήμασιν
  choice: वचनों
  rationale: ῥήματα बोले गए शब्दों या कथनों को दर्शाता है। ‘वचन’ गरिमापूर्ण किंतु सामान्य बाइबलीय हिन्दी है और इसे केवल साररूप ‘संदेश’ नहीं बनाता।
- source_word: Ἰερεμίου προφήτου
  choice: यिर्मयाह भविष्यद्वक्ता के
  rationale: यह पदवी और नाम दोनों को स्पष्ट रखते हुए हिन्दी में स्वाभाविक संबंध-वाचक रचना देता है।
- source_word: ἐκ στόματος Κυρίου
  choice: प्रभु के मुख से निकले थे
  rationale: यह अनुवाद दिव्य उद्गम बताने वाले स्पष्ट ‘मुख’ रूपक को सुरक्षित रखता है। ‘निकले थे’ हिन्दी में वचनों के साथ संबंध को सहज बनाता है।
- source_word: Κυρίου
  choice: प्रभु
  rationale: यह κύριος का प्रचलित, गरिमापूर्ण और संप्रदाय-निरपेक्ष हिन्दी अनुवाद है।
theological_decisions:
- issue: ‘प्रभु के मुख से’ पदबंध में भविष्यद्वाणी का दिव्य अधिकार
  choice: मुख के रूपक को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे केवल ‘प्रभु की ओर से’ कहा जा सकता था।
  rationale: यूनानी पाठ वचनों के उद्गम को प्रभु के अपने मुख से जोड़ता है। रूपक बनाए रखने से भविष्यद्वक्ता के वचनों के दिव्य स्रोत का दावा मंद नहीं पड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है। ‘युद्ध करने का प्रयत्न करता रहा’ अपूर्णकालीन क्रिया की निरंतरता व्यक्त करता है, और ‘प्रभु के मुख से’ मूल धार्मिक रूपक को सुरक्षित रखता है।
