base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/003.yaml
  text: And he said to the Levites[a], the holy servants of Israel, “Sanctify yourselves to the Lord in the place of the holy ark of the Lord, in the house that Solomon son of David the king built.”
translation:
  language: hi
  text: और उसने लेवियों से, जो इस्राएल के पवित्र सेवक थे, कहा, “उन्हें[a] प्रभु के लिए पवित्र करो, उस भवन में उस स्थान पर जहाँ प्रभु का पवित्र संदूक रखा है, जिसे दाऊद के पुत्र राजा सुलैमान ने बनाया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘उन्हें’ है, पर यह स्पष्ट नहीं कि इसका संकेत किनकी ओर है। इब्रानी समानांतर में इसके बजाय लिखा है, ‘पवित्र संदूक को उस भवन में रखो जिसे दाऊद के पुत्र, इस्राएल के राजा सुलैमान ने बनाया था।’
    reason: यूनानी सर्वनाम का संदर्भ अस्पष्ट है और इब्रानी समानांतर एक उल्लेखनीय वैकल्पिक पाठ प्रस्तुत करता है।
lexical_decisions:
- source_word: Λευείταις
  choice: लेवियों
  rationale: यह इस्राएल के लेवीवंशी धार्मिक सेवकों के लिए प्रचलित और सहज हिन्दी रूप है।
- source_word: ἱεροδούλοις
  choice: पवित्र सेवक
  rationale: यह पद पवित्र सेवा के लिए समर्पित व्यक्तियों को दर्शाता है। ‘मन्दिर के सेवक’ अर्थ को आवश्यकता से अधिक संस्थागत और विशिष्ट बना देता।
- source_word: ἁγιάσατε
  choice: पवित्र करो
  rationale: यह धार्मिक समर्पण और पवित्रीकरण, दोनों का भाव व्यक्त करने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यूनानी पाठ में पुल्लिंग बहुवचन कर्मवाचक सर्वनाम है, पर उसका संदर्भ अस्पष्ट है। इसलिए उसे ‘अपने आपको’ बनाकर व्याख्यायित करने के बजाय उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: ἁγιάσατε के साथ यह समर्पण का भाव स्वाभाविक रूप से व्यक्त करता है और κύριος का सामान्य हिन्दी अनुवाद ‘प्रभु’ रखता है।
- source_word: ἐν τῇ θέσει
  choice: स्थान में
  rationale: θέσις का सीधा अर्थ स्थान या निर्धारित जगह है; स्रोत की संरचना को बनाए रखने के लिए औपचारिक किन्तु बोधगम्य रूप चुना गया है।
- source_word: τῆς ἁγίας κιβωτοῦ
  choice: पवित्र संदूक के
  rationale: धार्मिक प्रसंग में κιβωτός के लिए ‘संदूक’ प्रचलित हिन्दी बाइबलीय शब्द है और ἁγίας का सीधा अर्थ ‘पवित्र’ है।
- source_word: οἴκῳ
  choice: भवन
  rationale: यूनानी शब्द का मूल अर्थ ‘घर’ है, पर यहाँ सुलैमान द्वारा बनाए गए उपासना-भवन का संकेत है। ‘भवन’ स्रोत से निकट रहते हुए आधुनिक हिन्दी में अधिक स्वाभाविक है और ‘मन्दिर’ जैसी स्पष्ट व्याख्या नहीं जोड़ता।
- source_word: Σαλωμὼν ὁ τοῦ Δαυεὶδ ὁ βασιλεύς
  choice: दाऊद के पुत्र राजा सुलैमान
  rationale: यह पुत्र-संबंध और राजकीय पदवी दोनों को स्पष्ट, स्वाभाविक हिन्दी क्रम में सुरक्षित रखता है।
theological_decisions:
- issue: यूनानी κύριος का अनुवाद, जबकि इब्रानी समानांतर में दिव्य नाम है
  choice: प्रभु
  alternative: यहोवा
  rationale: मुख्य आधार यूनानी पाठ है, जिसमें κύριος है। इसलिए इब्रानी समानांतर से दिव्य नाम को मुख्य पाठ में आयात नहीं किया गया।
- issue: अस्पष्ट αὐτούς को इब्रानी समानांतर के अनुसार स्पष्ट करना या यूनानी पाठ की अस्पष्टता बनाए रखना
  choice: यूनानी पाठ के ‘उन्हें’ को बनाए रखना
  alternative: ‘पवित्र संदूक को उस भवन में रखो’ अथवा ‘अपने आपको पवित्र करो’
  rationale: यूनानी प्राथमिक स्रोत का सर्वनाम वास्तव में अस्पष्ट है। उसे चुपचाप लेवियों का आत्मवाचक सर्वनाम बनाने या इब्रानी समानांतर से बदलने के बजाय मुख्य पाठ में तनाव सुरक्षित रखा गया और पाठांतर पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मुख्य पाठ यूनानी की असहजता और अस्पष्टता को पूरी तरह सहज बनाकर मिटाता नहीं; पादटिप्पणी आवश्यक पाठ-साक्ष्य स्पष्ट करती है।
