base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/040.yaml
  text: The recorded accounts concerning him, and his uncleanness and impiety, are written in the book of the chronicles of the kings.
translation:
  language: hi
  text: उसके विषय में और उसकी अशुद्धता तथा अधार्मिकता के विषय में जो बातें लिखी गई हैं[a], वे राजाओं के इतिहास-वृत्तांतों की पुस्तक में दर्ज हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विषय में और उसकी अशुद्धता तथा अधार्मिकता के विषय में जो बातें वर्णित की गई हैं।” यूनानी शब्द का अर्थ वर्णित या सुनाई गई बातें भी हो सकता है, और अभिलेख में दर्ज की गई बातें भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱστορηθέντα
  choice: बताई गई बातें
  rationale: यह कृदंत उन बातों को दर्शाता है जिनका वर्णन किया गया या जिन्हें अभिलेख में रखा गया। यह अनुवाद यूनानी की बहुवचनात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀκαθαρσίας
  choice: अशुद्धता
  rationale: यह शब्द नैतिक और धार्मिक अशुद्धता का भाव रखता है, पर इसे केवल अनुष्ठानिक अशुद्धता तक सीमित नहीं करता।
- source_word: δυσσεβείας
  choice: भक्तिहीनता
  rationale: यह परमेश्वर के प्रति श्रद्धा या भक्ति के अभाव को व्यक्त करता है और सामान्य ‘दुष्टता’ की अपेक्षा यूनानी शब्द के धार्मिक भाव के अधिक निकट है।
- source_word: ἀναγέγραπται
  choice: लिखे हुए हैं
  rationale: यूनानी पूर्ण निष्क्रिय रूप यह बताता है कि ये बातें लिख दी गई हैं और अभिलेख के रूप में विद्यमान हैं।
- source_word: βίβλῳ τῶν χρόνων τῶν βασιλέων
  choice: राजाओं के इतिहास-वृत्तांत की पुस्तक
  rationale: यह राजकीय वार्षिक अभिलेखों का पारंपरिक सूत्र है; ‘इतिहास-वृत्तांत’ आधुनिक पाठक के लिए अभिलेखीय अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ἀκαθαρσίας καὶ δυσσεβείας में राजा का नैतिक-धार्मिक चित्रण
  choice: दोनों शब्दों को अलग-अलग ‘अशुद्धता तथा भक्तिहीनता’ के रूप में रखा गया
  alternative: ‘अपवित्रता और दुष्टता’
  rationale: मूल यूनानी दो अलग आरोप लगाता है। चुना हुआ रूप उन्हें एक सामान्य नैतिक निंदा में मिलाने के बजाय अशुद्धता और ईश्वर-संबंधी श्रद्धा के अभाव—दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘भक्तिहीनता’ धार्मिक निंदा का भाव सुरक्षित रखती है, जबकि ‘इतिहास-वृत्तांत’ राजकीय अभिलेख के अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
