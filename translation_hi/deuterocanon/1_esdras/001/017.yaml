base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/017.yaml
  text: And the sons of Israel who were found at that time kept the Passover and the feast of unleavened bread for seven days[a][b].
translation:
  language: hi
  text: और उस समय जो इस्राएल के पुत्र उपस्थित थे, उन्होंने फसह और अख़मीरी रोटी का पर्व सात दिन तक मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγοσαν
  choice: मनाया
  rationale: क्रिया का मूल अर्थ ‘ले गए/लाए’ है, पर यहाँ फसह और पर्व को कर्म के रूप में लेने पर उत्सव मनाने अथवा उसका पालन करने का प्रसंगगत अर्थ स्वाभाविक है।
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है; आधुनिक हिन्दी में पूरे समुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और समावेशी है।
- source_word: οἱ εὑρεθέντες
  choice: जो ... उपस्थित थे
  rationale: शाब्दिक अर्थ ‘जो पाए गए’ है, किंतु इस प्रसंग में उस समय मौजूद लोगों का संकेत है; ‘उपस्थित थे’ अभिप्रेत अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: उस समय
  rationale: καιρός यहाँ संबंधित समय अथवा अवसर को सूचित करता है।
- source_word: τὸ πάσχα
  choice: फसह
  rationale: यह यहूदी फसह पर्व का प्रचलित हिन्दी नाम है।
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: अख़मीरी रोटी का पर्व
  rationale: यह बिना ख़मीर की रोटी के पर्व का संक्षिप्त, प्रचलित और अर्थ-स्पष्ट हिन्दी रूप है।
- source_word: ἡμέρας ἑπτά
  choice: सात दिन तक
  rationale: यह अवधि सूचक कर्मकारक है; ‘सात दिन तक’ हिन्दी में अवधि को स्पष्ट करता है।
