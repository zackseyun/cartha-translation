  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘फ़सह’ तथा ‘वेदी’ जैसे प्रचलित बाइबलीय शब्द बनाए रखे गए हैं। पादटिप्पणी [b] को नाम ‘योशियास’ के बाद न रखकर वाक्य के अंत में रखा गया है, फिर भी उसका संदर्भ स्पष्ट है।
