base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/016.yaml
  text: 'And the matters of the Lord’s sacrifice were completed on that day: the Passover was offered[a], and the sacrifices were brought up onto the altar of the Lord[b], according to the command of King Josias.'
translation:
  language: hi
  text: 'और उसी दिन प्रभु के बलिदान से संबंधित कार्य पूरे किए गए: फ़सह का बलिदान चढ़ाया गया[a], और बलिदान प्रभु की वेदी पर लाए गए, राजा योशियास[b] की आज्ञा के अनुसार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “फ़सह लाया गया।” यहाँ यूनानी क्रिया का अर्थ “लाया गया,” “प्रस्तुत किया गया,” या बलिदानी संदर्भ में “चढ़ाया गया” हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “योशियास” नाम का यूनानी रूप है; समानांतर इब्रानी परंपरा में वह “योशियाह” कहलाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: συνετελέσθη
  choice: पूरे किए गए
  rationale: यूनानी अओरिस्ट कर्मवाच्य बलिदान-संबंधी कार्यों की पूर्णता बताता है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: τὰ τῆς θυσίας τοῦ κυρίου
  choice: प्रभु के बलिदान से संबंधित सारे कार्य
  rationale: यह व्यापक यूनानी पद बलिदान से जुड़ी समूची कार्यवाही को दर्शाता है; केवल ‘विधियाँ’ कहना अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
- source_word: ἀχθῆναι τὸ πάσχα
  choice: फ़सह का बलिदान चढ़ाया गया
  rationale: ἀχθῆναι का मूल अर्थ ‘लाया गया’ है, पर बलिदान-संदर्भ में ‘चढ़ाया गया’ स्वाभाविक है; ‘का बलिदान’ जोड़ने से हिन्दी में πάσχα के बलिदानी आशय की स्पष्टता आती है।
- source_word: προσαχθῆναι τὰς θυσίας ἐπὶ τὸ τοῦ κυρίου θυσιαστήριον
  choice: बलिदान प्रभु की वेदी पर लाए गए
  rationale: प्रसंग में वेदी की ओर गति और उस पर पहुँचाने का भाव सुरक्षित रहता है, जबकि इसे केवल ‘चढ़ाए गए’ कहने पर पहले खंड की क्रिया से भेद मिट जाता।
- source_word: κατὰ τὴν ἐπιταγὴν
  choice: की आज्ञा के अनुसार
  rationale: ἐπιταγή राजकीय अधिकार से दी गई बाध्यकारी आज्ञा को सूचित करता है।
- source_word: τοῦ βασιλέως Ἰωσείου
  choice: राजा योशियास
  rationale: मुख्य पाठ यूनानी होने के कारण नाम का यूनानी रूप हिन्दी लिप्यंतरण में रखा गया है; इब्रानी-परंपरा का परिचित रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बलिदानी पुराने नियम के संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल स्रोत में यूनानी κύριος है; इसलिए अनुवाद उसी को प्रत्यक्ष रूप से दर्शाता है और समानांतर इब्रानी परंपरा से परमेश्वर का नाम मुख्य पाठ में आयात नहीं करता।
- issue: Ἰωσείου के नाम का रूप
  choice: योशियास
  alternative: योशियाह
  rationale: यूनानी 1 एस्द्रास प्राथमिक स्रोत है, इसलिए मुख्य पाठ में यूनानी रूप रखा गया; पाठकों की पहचान-सुविधा के लिए इब्रानी रूप पादटिप्पणी में है।
