base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/047.yaml
  text: And the leaders of the people and of the priests also committed much impiety and lawlessness[a], beyond all the uncleannesses of all the nations, and they defiled the sanctuary of the Lord[c][b], which had been sanctified in Jerusalem.
translation:
  language: hi
  text: लोगों और याजकों के नेताओं ने भी बहुत-से अधार्मिक और व्यवस्था-विरुद्ध काम किए—सब जातियों की सारी अशुद्धताओं से भी बढ़कर[a]—और प्रभु के उस पवित्रस्थान[b] को अपवित्र कर दिया, जिसे यरूशलेम में पवित्र ठहराया गया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘सब जातियों की सारी अपवित्रताओं से भी अधिक’ भी हो सकता है। यूनानी पद सीमा से बढ़ जाने का भाव देता है; ‘अशुद्धताएँ’ नैतिक या उपासना-संबंधी मलिनताओं को सूचित कर सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘मंदिर’। यूनानी ἱερόν पवित्रस्थान या अधिक व्यापक मंदिर-परिसर को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से ‘प्रभु का पवित्रस्थान, जो यरूशलेम में पवित्र किया जा रहा है/पवित्र ठहराया हुआ है’ है। कृदन्त उस पवित्रस्थान को यरूशलेम में समर्पित या पवित्र ठहराया हुआ बता सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: अगुओं
  rationale: यह शब्द नेतृत्व करने वालों या शासकों को सूचित कर सकता है। ‘अगुओं’ से औपचारिक पद का अनावश्यक संकेत दिए बिना नागरिक और याजकीय नेतृत्व का भाव स्पष्ट होता है।
- source_word: τοῦ λαοῦ καὶ τῶν ἱερέων
  choice: लोगों और याजकों के
  rationale: दोनों संबंधकारक पदों को अगुओं से जोड़कर रखा गया है, ताकि सामान्य लोगों और याजकों—दोनों के नेतृत्व की संलिप्तता बनी रहे।
- source_word: πολλὰ ἠσέβησαν
  choice: बहुत भक्ति-विहीनता ... के काम किए
  rationale: ἀσεβέω परमेश्वर और पवित्र बातों के प्रति अनादरपूर्ण या अभक्त आचरण बताता है। यह रूप धार्मिक आयाम और πολλά की बहुलता/तीव्रता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: καὶ ἠνόμησαν
  choice: और व्यवस्था-विरोध के काम किए
  rationale: ἀνομέω व्यवस्था के विरुद्ध आचरण को दर्शाता है। इसे पिछले क्रियापद के समानांतर रखकर यूनानी के दोहरे नैतिक-धार्मिक आरोप को बचाया गया है।
- source_word: ὑπὲρ πάσας τὰς ἀκαθαρσίας πάντων τῶν ἐθνῶν
  choice: सब जातियों की सारी अशुद्धताओं से भी बढ़कर
  rationale: ὑπέρ यहाँ तुलना में सीमा पार करने या बढ़ जाने का भाव देता है। ἀκαθαρσίαι के नैतिक और उपासना-संबंधी दोनों अर्थों को ‘अशुद्धताओं’ से बनाए रखा गया है।
- source_word: ἐμίαναν
  choice: अशुद्ध कर दिया
  rationale: μιαίνω पवित्र स्थान को दूषित या अपवित्र करने के लिए प्रयुक्त होता है। ‘अशुद्ध कर दिया’ पहले आए ἀκαθαρσίαι से शब्दार्थ-संबंध भी बनाए रखता है।
- source_word: τὸ ἱερὸν τοῦ κυρίου
  choice: प्रभु के ... पवित्रस्थान
  rationale: ἱερόν मंदिर या विस्तृत मंदिर-परिसर का अर्थ दे सकता है; इस उपासना-संबंधी प्रसंग में ‘पवित्रस्थान’ पवित्र क्षेत्र का भाव स्पष्ट रखता है। κύριος को परियोजना की सामान्य रीति के अनुसार ‘प्रभु’ किया गया है।
- source_word: τὸ ἁγιαζόμενον
  choice: जिसे ... पवित्र ठहराया गया था
  rationale: वर्तमान कर्मवाच्य कृदन्त किसी पवित्र किए गए या पवित्र माने जाने वाले स्थान का वर्णन करता है। हिन्दी में पूर्ण कर्मवाच्य रूप स्वाभाविक है, जबकि कालगत सूक्ष्मता को पादटिप्पणी में खुला रखा गया है।
- source_word: ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: स्थानवाचक पद का सीधा और प्रचलित हिन्दी रूप।
theological_decisions:
- issue: इस यहूदी मंदिर-प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा; स्वामी
  rationale: मूल यूनानी में κύριος है। ‘प्रभु’ यूनानी पाठ का अनुसरण करता है और बिना किसी विशिष्ट साम्प्रदायिक निष्कर्ष को आरोपित किए इस्राएल के परमेश्वर का संकेत देता है।
- issue: ἀκαθαρσίαι का उपासना-संबंधी और नैतिक आयाम
  choice: अशुद्धताओं
  alternative: अपवित्रताओं; मलिनताओं
  rationale: ‘अशुद्धताओं’ से नैतिक तथा अनुष्ठानिक दोनों अर्थ संभव रहते हैं और आगे पवित्रस्थान को अशुद्ध करने के कथन से संबंध बना रहता है।
- issue: τὸ ἁγιαζόμενον की कालगत व्याख्या
  choice: जिसे ... पवित्र ठहराया गया था
  alternative: जो ... पवित्र किया जा रहा था; यरूशलेम में स्थित पवित्रस्थान
  rationale: संदर्भ में कृदन्त पवित्रस्थान की प्रतिष्ठित पवित्र दशा का वर्णन करता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, पर यूनानी वर्तमान कर्मवाच्य कृदन्त की संभावित सूक्ष्मता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘अगुओं’, ‘व्यवस्था-विरोध’, ‘अशुद्धताओं’ और ‘पवित्रस्थान’ से मूल के नेतृत्व, नैतिक-धार्मिक अपराध और उपासना-संबंधी शब्दावली को सामान्य पाठक के लिए समझने योग्य रूप में सुरक्षित रखा गया है।
