base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/036.yaml
  text: And he bound Jehoiakim’s nobles[a], and after seizing Zarius his brother[b], he brought him up from Egypt.
translation:
  language: hi
  text: और उसने[a] यहोयाकीम के प्रतिष्ठित जनों[b] को बाँध दिया; फिर उसके भाई ज़ारियुस को पकड़कर उसे मिस्र से ऊपर ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में कर्ता अलग से नहीं दिया गया, बल्कि क्रिया-रूप में निहित है। वाक्य संक्षिप्त है; व्यापक प्रसंग और इब्रानी समानांतर के अनुसार कर्ता मिस्र का राजा है, स्वयं यहोयाकीम नहीं।
    reason: alternative_reading
  - marker: b
    text: यूनानी शब्द का अनुवाद “बड़े लोग,” “सामंत” या “प्रमुख अधिकारी” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδησεν
  choice: बाँध दिया
  rationale: δέω का मूल अर्थ बाँधना या जकड़ना है। यह अनुवाद कारावास या औपचारिक गिरफ्तारी जैसी अतिरिक्त धारणा जोड़े बिना ठोस अर्थ बनाए रखता है।
- source_word: Ἰωακεὶμ τοὺς μεγιστᾶνας
  choice: यहोयाकीम के प्रतिष्ठित जनों
  rationale: यूनानी पदबंध संक्षिप्त और कुछ असामान्य है। संदर्भ में इसे यहोयाकीम से संबद्ध प्रमुख लोगों के रूप में लेना उपयुक्त है; ‘प्रतिष्ठित जन’ अभिजात या प्रभावशाली अगुओं का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: Ζάριον
  choice: ज़ारियुस
  rationale: यह यूनानी व्यक्तिनाम के कर्मकारक रूप का निकट देवनागरी लिप्यंतरण है।
- source_word: συλλαβών
  choice: पकड़कर
  rationale: यह कृदंत किसी को पकड़ लेने या हिरासत में लेने का बोध देता है। ‘पकड़कर’ घटनाक्रम को स्वाभाविक हिन्दी में रखता है और औपचारिक कानूनी अर्थ नहीं थोपता।
- source_word: ἀνήγαγεν
  choice: ऊपर ले आया
  rationale: ἀνάγω में ऊपर की ओर ले जाने का दिशात्मक भाव हो सकता है। ‘ऊपर ले आया’ मिस्र से होने वाली गति के उस भाव को सुरक्षित रखता है, यद्यपि गंतव्य इस पद में नहीं बताया गया।
- source_word: ἐξ Αἰγύπτου
  choice: मिस्र से
  rationale: यह पद गति के आरंभ-स्थान को बताता है; ‘मिस्र से’ सहज और सटीक हिन्दी है।
- source_word: Ἰωακεὶμ
  choice: यहोयाकीम
  rationale: यह इस प्रसिद्ध बाइबलीय नाम का प्रचलित हिन्दी रूप है और यूनानी नाम को उसके ऐतिहासिक संदर्भ से जोड़ता है।
theological_decisions:
- issue: संक्षिप्त ऐतिहासिक कथन में कर्ता की पहचान
  choice: मुख्य पाठ में कर्ता के लिए ‘उसने’ रखा गया और पादटिप्पणी में संदर्भानुसार मिस्र के राजा की पहचान बताई गई।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘मिस्र के राजा ने’ जोड़ना, अथवा यहोयाकीम को ही कर्ता मानना।
  rationale: यूनानी वाक्य में कर्ता स्पष्ट नाम से दोहराया नहीं गया। व्यापक प्रसंग और इब्रानी समानांतर मिस्र के राजा की ओर संकेत करते हैं, पर मुख्य पाठ में नाम जोड़ना स्रोत से अधिक स्पष्टता उत्पन्न करता। सर्वनाम और पादटिप्पणी दोनों मिलकर ऐतिहासिक अर्थ तथा पाठ की संक्षिप्तता सुरक्षित रखते हैं।
- issue: αὐτοῦ में संबंध का संदर्भ
  choice: ‘उसके भाई’ के रूप में सर्वनाम की स्वाभाविक अस्पष्टता बनाए रखी गई।
  alternative: ‘यहोयाकीम के भाई’ कहकर संदर्भ को स्पष्ट कर देना।
  rationale: यूनानी में संबंध सर्वनाम से व्यक्त है। हिन्दी में ‘उसके भाई’ उसी संरचना और संभावित संदर्भगत तनाव को बनाए रखता है, जबकि निकटवर्ती नाम से पाठक यहोयाकीम को संभावित पूर्वपद समझ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘प्रतिष्ठित जन’ सामान्य पाठक के लिए बोधगम्य है और दरबारी अभिजात वर्ग को अत्यधिक तकनीकी शब्दावली के बिना व्यक्त करता है। सर्वनाम और ‘ऊपर ले आया’ मूल यूनानी की संक्षिप्तता तथा दिशात्मकता को यथासंभव सुरक्षित रखते हैं।
