base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/012.yaml
  text: After this they prepared for themselves and for the priests[a], their brothers[b], the sons of Aaron.
translation:
  language: hi
  text: इसके बाद उन्होंने अपने लिए और याजकों[a]—अपने भाइयों, हारून के पुत्रों—के लिए तैयारी की।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक स्पष्ट रूप में: “अपने लिए और साथ ही याजकों—अपने भाइयों, हारून के पुत्रों—के लिए।”'
    reason: τε καὶ द्वारा दोनों प्राप्तकर्ताओं के जुड़ाव को अधिक स्पष्ट करने वाला वैकल्पिक अनुवाद।
  - marker: b
    text: 2 इतिहास 35:11 का इब्रानी समानांतर यहाँ काफी भिन्न है। 1 एस्द्रास का यूनानी पाठ अपने लिए और याजकों के लिए तैयारी करने पर केंद्रित है।
    reason: पाठक को महत्वपूर्ण समानांतर-पाठ के अंतर से अवगत कराना।
lexical_decisions:
- source_word: μετὰ δὲ ταῦτα
  choice: इसके बाद
  rationale: यह यूनानी कालक्रम-सूचक पद का स्वाभाविक और निकट हिन्दी रूप है।
- source_word: ἡτοίμασαν
  choice: उन्होंने ... तैयारी की
  rationale: क्रिया का अर्थ तैयार करना है; प्रसंग में तैयार की गई वस्तु अनुक्त है, इसलिए हिन्दी में भी उसे अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ἑαυτοῖς
  choice: अपने लिए
  rationale: आत्मवाचक सम्प्रदान कारक का सीधा और स्वाभाविक अनुवाद।
- source_word: τε καὶ
  choice: और
  rationale: यह दो प्राप्तकर्ता समूहों—स्वयं उनके और याजकों—को जोड़ता है; हिन्दी में साधारण 'और' अर्थ को पर्याप्त रूप से व्यक्त करता है।
- source_word: τοῖς ἱερεῦσιν
  choice: याजकों के लिए
  rationale: तैयारी के लाभार्थी अथवा प्राप्तकर्ता को व्यक्त करता है।
- source_word: ἀδελφοῖς αὐτῶν
  choice: अपने भाइयों
  rationale: यूनानी में स्पष्ट पारिवारिक शब्द 'भाइयों' है; इसे अधिक व्याख्यात्मक 'बंधुओं' या 'सजातियों' में नहीं बदला गया।
- source_word: υἱοῖς Ἀαρών
  choice: हारून के पुत्रों
  rationale: यह याजकों की पहचान बताने वाला समानाधिकरण पद है। 'पुत्रों' मूल की अभिव्यक्ति को बनाए रखता है; 'वंशजों' कहना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: '''अपने भाइयों'' और ''हारून के पुत्रों'' का याजकों से संबंध'
  choice: 'दोनों पदों को याजकों की समानाधिकरण पहचान के रूप में रखा गया: ''याजकों—अपने भाइयों, हारून के पुत्रों—के लिए'''
  alternative: '''अपने उन भाइयों के लिए जो हारून के पुत्र और याजक थे'''
  rationale: यूनानी में तीनों पद बिना संबंधवाचक उपवाक्य के क्रम से आते हैं। डैशयुक्त रचना हिन्दी में संबंध स्पष्ट करती है, पर मूल की समानाधिकरण संरचना और उसका हल्का व्याकरणिक तनाव बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। 'याजक', 'हारून' और 'पुत्र' जैसे प्रचलित बाइबिलीय शब्द रखे गए हैं। मूल में तैयार की गई वस्तु स्पष्ट नहीं है, इसलिए हिन्दी मुख्य पाठ में 'भोजन', 'भाग' या 'बलि' नहीं जोड़ा गया।
