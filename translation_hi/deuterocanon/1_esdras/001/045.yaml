base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/045.yaml
  text: And he did what was evil before the Lord[a], and he was not ashamed at the words spoken by Jeremiah the prophet from the mouth of the Lord.
translation:
  language: hi
  text: और उसने प्रभु के सामने बुराई की, और यिर्मयाह भविष्यद्वक्ता द्वारा प्रभु के मुख से बोले गए वचनों से वह लज्जित नहीं हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समानांतर इब्रानी पाठ (2 इतिहास 36:12) में भाव है, “उसने यिर्मयाह भविष्यद्वक्ता के सामने, जो प्रभु के मुख से बोलता था, अपने आपको नम्र नहीं किया।” परन्तु 1 एस्द्रास का यूनानी पाठ यहाँ लज्जित या संकुचित न होने की बात कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησεν τὸ πονηρόν
  choice: उसने ... वही किया जो बुरा था
  rationale: यह बाइबलीय मुहावरा नैतिक बुराई करने को व्यक्त करता है। यह रूप यूनानी की संरचना को बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी देता है।
- source_word: ἐνώπιον Κυρίου
  choice: प्रभु के सामने
  rationale: ἐνώπιον का अर्थ ‘सामने’ या ‘दृष्टि में’ है। ‘प्रभु के सामने’ संक्षिप्त, स्वाभाविक और न्यायिक/वाचा-संबंधी भाव को सुरक्षित रखता है।
- source_word: οὐκ ἐνετράπη
  choice: उसे लज्जा नहीं आई
  rationale: मध्य/कर्मवाच्य रूप ἐντρέπω यहाँ लज्जित या संकुचित होने का भाव देता है। हिन्दी में ‘उसे लज्जा नहीं आई’ इस प्रसंग में सहज और स्पष्ट है।
- source_word: ἀπὸ τῶν ῥηθέντων λόγων
  choice: कहे गए वचनों के कारण
  rationale: ἀπό यहाँ लज्जा के अवसर या कारण को सूचित कर सकता है। ‘के कारण’ स्रोत के संबंध को स्पष्ट करता है, जबकि ‘कहे गए वचन’ कृदन्त और संज्ञा दोनों को बनाए रखता है।
- source_word: ὑπὸ Ἰερεμίου τοῦ προφήτου
  choice: यिर्मयाह भविष्यद्वक्ता के द्वारा
  rationale: यह कर्ता-सूचक पदबंध का सीधा अनुवाद है; ‘भविष्यद्वक्ता’ προφήτης की परिचित और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: ἐκ στόματος τοῦ κυρίου
  choice: प्रभु के मुख से
  rationale: यह प्रत्यक्ष ईश्वरीय वचन के लिए प्रयुक्त सजीव बाइबलीय अभिव्यक्ति है। ‘मुख’ को बनाए रखने से इसे केवल ‘प्रभु की ओर से’ कहकर सपाट नहीं किया गया।
theological_decisions:
- issue: व्यवस्थाविवरणेतर यूनानी ग्रन्थ में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: प्राथमिक यूनानी पाठ में κυρίου है। ‘प्रभु’ सामान्य बाइबलीय हिन्दी है और यूनानी साक्ष्य से आगे बढ़कर इब्रानी परमेश्वर-नाम को पाठ में नहीं जोड़ता।
- issue: οὐκ ἐνετράπη और इब्रानी समानांतर में दीन होने की भाषा
  choice: उसे लज्जा नहीं आई
  alternative: उसने अपने आपको दीन नहीं किया
  rationale: 1 एस्द्रास का यूनानी पाठ स्पष्ट रूप से लज्जित या संकुचित होने की भाषा प्रयोग करता है। 2 इतिहास 36:12 का इब्रानी समानांतर दीन होने की भाषा रखता है; उस भिन्नता को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘प्रभु के मुख से’ जैसी मूल की सजीव भविष्यद्वाणी-संबंधी अभिव्यक्ति सुरक्षित है; यूनानी और इब्रानी समानांतर के अंतर को बिना मिलाए स्पष्ट किया गया है।
