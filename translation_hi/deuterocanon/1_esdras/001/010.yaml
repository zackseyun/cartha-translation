base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/010.yaml
  text: And when these things had taken place[a], the priests and the Levites stood in proper order, holding the unleavened bread, according to the tribes and according to the family divisions of the fathers, before the people, to offer to the Lord according to what is written in the book of Moses[b]; and so they did in the morning.
translation:
  language: hi
  text: और जब ये बातें हो चुकीं, तब याजक और लेवी उचित क्रम में लोगों के सामने खड़े हुए। उनके पास अख़मीरी रोटियाँ थीं, और वे गोत्रों तथा पितृकुलों के विभागों[a] के अनुसार खड़े थे, ताकि मूसा की पुस्तक में लिखी बातों के अनुसार प्रभु को भेंट चढ़ाएँ[b]। और सुबह उन्होंने इसी प्रकार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पिताओं के विभागों’; अर्थ ‘पूर्वजों के घरानों के विभागों’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी पाठ 2 इतिहास 35:10 के लगभग समानांतर इब्रानी पाठ से उल्लेखनीय रूप से भिन्न है, जहाँ लेवी अगुओं द्वारा फसह के पशु दिए जाने की बात है। यहाँ अनुवाद 1 एस्द्रास के यूनानी पाठ के अनुसार किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: εὐπρεπῶς
  choice: उचित क्रम में
  rationale: यह उपासना-संबंधी प्रसंग में शोभनीय और सुव्यवस्थित ढंग से खड़े होने का भाव व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἔστησαν
  choice: खड़े हुए
  rationale: यूनानी क्रिया के शारीरिक और अनुष्ठानिक दोनों भावों को बिना अनावश्यक व्याख्या जोड़े बनाए रखता है।
- source_word: τὰ ἄζυμα
  choice: अख़मीरी रोटियाँ
  rationale: शाब्दिक अर्थ ‘अख़मीरी वस्तुएँ’ है, पर फसह के प्रसंग में रोटियाँ अभिप्रेत हैं; यह हिन्दी में स्पष्ट और प्रचलित अभिव्यक्ति है।
- source_word: φυλάς
  choice: गोत्रों
  rationale: इस्राएल के जनजातीय-सामाजिक विभागों के लिए ‘गोत्र’ स्वाभाविक बाइबलीय हिन्दी शब्द है।
- source_word: μεριδαρχίας τῶν πατέρων
  choice: पितृकुलों के विभागों
  rationale: यह पैतृक घरानों के आधार पर किए गए उपविभागों का भाव देता है और यूनानी की संक्षिप्त संरचना को समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: προσενεγκεῖν
  choice: भेंट चढ़ाएँ
  rationale: अनुष्ठानिक संदर्भ में यह केवल सामने लाने के बजाय प्रभु को अर्पित करने का भाव स्पष्ट करता है।
- source_word: τῷ κυρίῳ
  choice: प्रभु को
  rationale: यूनानी κύριος का सीधा और मानक हिन्दी प्रतिरूप है; स्रोत में स्वयं परमेश्वर का विशिष्ट इब्रानी नाम नहीं लिखा है।
- source_word: κατὰ τὰ γεγραμμένα ἐν βιβλίῳ Μωυσῆ
  choice: मूसा की पुस्तक में लिखी बातों के अनुसार
  rationale: लिखित मूसीय व्यवस्था के प्रामाणिक निर्देश का भाव स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: καὶ οὕτω τὸ πρωϊνόν
  choice: और सुबह उन्होंने इसी प्रकार किया
  rationale: यूनानी वाक्यांश अत्यंत संक्षिप्त और दीर्घवृत्तात्मक है। यह अनुवाद उसके संभावित कालगत अर्थ को रखता है और उसे तकनीकी ‘प्रातःकालीन भेंट’ मानकर व्याख्यायित नहीं करता।
theological_decisions:
- issue: 2 इतिहास 35:10 के लगभग समानांतर इब्रानी पाठ से यूनानी पाठ का संबंध
  choice: मुख्य पाठ में याजकों और लेवियों के अख़मीरी रोटियों सहित क्रम से खड़े होने वाला यूनानी दृश्य रखा गया है।
  alternative: इब्रानी समानांतर के अनुसार लेवी अगुओं द्वारा फसह के पशु दिए जाने की बात रखी जा सकती थी।
  rationale: 1 एस्द्रास के लिए उपलब्ध यूनानी पाठ प्राथमिक स्रोत है। इस पद में इब्रानी समानांतर उल्लेखनीय रूप से भिन्न है, इसलिए दोनों को मिलाकर नया पाठ बनाने के बजाय यूनानी का अनुवाद किया गया है।
- issue: τῶν πατέρων की पैतृक-कुल संबंधी भाषा
  choice: पितृकुलों
  alternative: पिताओं के; पूर्वजों के घरानों
  rationale: यह स्रोत की पैतृक वंश-व्यवस्था को बनाए रखते हुए आधुनिक हिन्दी पाठक के लिए उसका संस्थागत अर्थ भी स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘याजक’, ‘लेवी’, ‘गोत्र’, ‘पितृकुल’ और ‘अख़मीरी रोटियाँ’ जैसे शब्द धार्मिक-सांस्कृतिक संदर्भ की विशिष्टता बनाए रखते हैं। अंतिम यूनानी वाक्यांश की संक्षिप्तता को अत्यधिक तकनीकी अर्थ दिए बिना सहज हिन्दी में व्यक्त किया गया है।
