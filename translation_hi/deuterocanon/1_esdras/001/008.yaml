base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/008.yaml
  text: These things were given from the royal possessions[a], according to the promise, to the people and to the priests and Levites. And Helkias, Zechariah, and Esyelos, the overseers of the sanctuary, gave to the priests for the Passover two thousand six hundred sheep[c][b], and three hundred calves.
translation:
  language: hi
  text: ये वस्तुएँ राजकीय संपत्ति में से, प्रतिज्ञा के अनुसार[b], लोगों और याजकों तथा लेवियों को दी गईं। और पवित्रस्थान के निरीक्षकों—हेलकियास, जकरियास और एस्येलोस[a]—ने फसह के लिए याजकों को दो हज़ार छह सौ भेड़ें[c] और तीन सौ बछड़े दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समानांतर इब्रानी पाठ, 2 इतिहास 35:8 में, संबंधित नामों के इब्रानी रूप मिलते हैं, जिन्हें सामान्यतः ‘हिलकिय्याह … यहीएल’ लिखा जाता है। यहाँ 1 एस्द्रास के यूनानी पाठ में ‘हेलकियास … एस्येलोस’ है।
    reason: alternative_reading
  - marker: b
    text: या, “जैसा प्रतिज्ञा की गई थी।” यूनानी वाक्यांश का शाब्दिक अर्थ “प्रतिज्ञा के अनुसार” है।
    reason: lexical_alternative
  - marker: c
    text: समानांतर इब्रानी पाठ में राजा की संपत्ति से दिए गए पशुओं को “भेड़ें, मेमने और बकरी के बच्चे” कहा गया है; यहाँ यूनानी पाठ में व्यापक शब्द “भेड़ें” है।
    reason: lexical_alternative
