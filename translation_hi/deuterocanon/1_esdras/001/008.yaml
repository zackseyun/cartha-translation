- source_word: ταῦτα
  choice: ये वस्तुएँ
  rationale: यह संकेतवाचक पद पहले बताई गई सामग्री या पशुओं की ओर लौटता है; ‘वस्तुएँ’ यूनानी को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: ἐκ τῶν βασιλικῶν
  choice: राजकीय संपत्ति में से
  rationale: यह राजपरिवार अथवा राजा की मिल्कियत की वस्तुओं को सूचित करता है; समानांतर इब्रानी पाठ में भी ‘राजा की संपत्ति में से’ है।
- source_word: κατʼ ἐπαγγελίαν
  choice: प्रतिज्ञा के अनुसार
  rationale: यूनानी संज्ञात्मक अभिव्यक्ति को बनाए रखता है और यह निर्धारित नहीं करता कि प्रतिज्ञा किसने की थी।
- source_word: τῷ λαῷ καὶ τοῖς ἱερεῦσιν καὶ Λευίταις
  choice: लोगों और याजकों तथा लेवियों को
  rationale: सम्प्रदान कारक के प्राप्तकर्ता-भाव को सीधे व्यक्त करता है और तीनों समूहों को स्पष्ट रखता है।
- source_word: οἱ ἐπιστάται τοῦ ἱεροῦ
  choice: पवित्रस्थान के निरीक्षक
  rationale: ἐπιστάται जिम्मेदारी लेकर देखरेख करने वाले अधिकारियों को और ἱερόν पवित्रस्थान को सूचित करता है।
- source_word: εἰς πάσχα
  choice: फसह के लिए
  rationale: यह पशुओं के फसह में उपयोग का उद्देश्य स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρόβατα
  choice: भेड़ें
  rationale: यूनानी पद का सीधा अर्थ रखा गया है; समानांतर इब्रानी पाठ इससे अधिक विशिष्ट पशु-श्रेणियाँ देता है।
- source_word: μόσχους
  choice: बछड़े
  rationale: μόσχος जवान गोवंश अथवा बछड़े को दर्शाता है; लिंग को अनावश्यक रूप से निश्चित नहीं किया गया।
