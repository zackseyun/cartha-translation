base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/050.yaml
  text: These men killed their young men with the sword around the holy temple[a], and they showed no mercy to young man or virgin, old man or youth[b],
translation:
  language: hi
  text: इन लोगों ने पवित्र मंदिर के चारों ओर उनके युवकों को तलवार से मार डाला और न किसी युवक पर, न किसी कुँवारी पर, न किसी बूढ़े पर, न किसी कम उम्र के व्यक्ति पर दया की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दिया गया इब्रानी समानांतर केवल अनुमानित है और उसकी शब्दावली अलग है; यूनानी पाठ में विशेष रूप से पवित्र मंदिर के चारों ओर लोगों को तलवार से मार डालने का वर्णन है।
    reason: cross_reference
lexical_decisions:
- source_word: οὗτοι
  choice: इन लोगों ने
  rationale: संकेतवाचक सर्वनाम पहले बताए गए आक्रमणकारियों की ओर संकेत करता है; ‘इन लोगों’ से संदर्भ स्वाभाविक और स्पष्ट रहता है।
- source_word: ἀπέκτειναν
  choice: मार डाला
  rationale: यह हत्या का सीधा और कथात्मक हिन्दी रूप है, जो मूल क्रिया की हिंसक स्पष्टता बनाए रखता है।
- source_word: τοὺς νεανίσκους αὐτῶν
  choice: उनके जवानों को
  rationale: νεανίσκους युवा पुरुषों को सूचित करता है और αὐτῶν का संबंध आक्रमण के शिकार लोगों से है; ‘जवानों’ से दोनों बातें संक्षेप में व्यक्त होती हैं।
- source_word: ἐν ῥομφαίᾳ
  choice: तलवार से
  rationale: हथियार अथवा साधन का सामान्य बाइबलीय और स्वाभाविक हिन्दी रूप।
- source_word: περικύκλῳ τοῦ ἁγίου ἱεροῦ
  choice: पवित्र मंदिर के चारों ओर
  rationale: περικύκλῳ आसपास के पूरे क्षेत्र का बोध कराता है और ἱερόν मंदिर-परिसर को; यह रूप स्थानिक अर्थ स्पष्ट रखता है।
- source_word: οὐκ ἐφείσαντο
  choice: दया नहीं की
  rationale: इस नरसंहार के प्रसंग में क्रिया का अर्थ किसी को न बख्शना है; ‘दया नहीं की’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: νεανίσκου καὶ παρθένου καὶ πρεσβύτου καὶ νεωτέρου
  choice: न किसी जवान पर, न कुँवारी पर, न बूढ़े पर, न कम उम्र के व्यक्ति पर
  rationale: नकार के अंतर्गत चारों एकवचन श्रेणियों का वितरणात्मक बल सुरक्षित है। ‘कम उम्र का व्यक्ति’ νεωτέρου की तुलनात्मक और अपेक्षाकृत व्यापक प्रकृति को ‘युवक’ से बेहतर बचाता है।
theological_decisions:
- issue: यूनानी पाठ और दिए गए इब्रानी समानांतर के भिन्न विषय
  choice: यूनानी में वर्णित मंदिर के चारों ओर हुए वध का सीधे अनुवाद
  alternative: पद को इब्रानी समानांतर में आए अगुओं, लोगों और यहोवा के भवन को अशुद्ध करने के वर्णन के अनुरूप बनाना
  rationale: निर्दिष्ट प्राथमिक आधार यूनानी पाठ है। दिया गया इब्रानी समानांतर केवल अनुमानित है और यहाँ भिन्न प्रसंग की भाषा रखता है; उसे मिलाने से मूल यूनानी पद की सामग्री बदल जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। चारों पीड़ित श्रेणियों को स्पष्ट रखने के लिए ‘न…न…’ संरचना प्रयोग की गई है। ‘कुँवारी’ παρθένος की विशिष्टता बनाए रखती है, जबकि ‘कम उम्र का व्यक्ति’ अंतिम तुलनात्मक पद की वास्तविक व्यापकता को अनावश्यक रूप से पुरुष तक सीमित नहीं करता।
