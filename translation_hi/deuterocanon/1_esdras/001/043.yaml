base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/043.yaml
  text: And after a year[a], Nebuchadnezzar sent and brought him away to Babylon, together with the holy vessels of the Lord,
translation:
  language: hi
  text: एक वर्ष बाद नबूकदनेस्सर ने भेजकर उसे प्रभु के पवित्र पात्रों के साथ बाबेल पहुँचा दिया[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे प्रभु के पवित्र पात्रों के साथ बाबेल निर्वासित कर दिया।” यूनानी क्रिया का अर्थ एक स्थान से हटाकर दूसरे स्थान ले जाना, अथवा निर्वासित करना, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ᾽ ἐνιαυτόν
  choice: एक वर्ष बाद
  rationale: μετά के साथ कर्मकारक ἐνιαυτόν बीते हुए समय को दर्शाता है; यह हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: ἀποστείλας
  choice: अपने लोगों को भेजकर
  rationale: कृदन्त का अर्थ ‘भेजने के बाद/भेजकर’ है। यूनानी में भेजे गए व्यक्तियों का कर्म निहित है; हिन्दी में क्रिया को स्वाभाविक बनाने के लिए ‘अपने लोगों को’ स्पष्ट किया गया है, बिना किसी विशिष्ट पद या पहचान को जोड़े।
- source_word: μετήγαγεν
  choice: भिजवा दिया
  rationale: क्रिया किसी व्यक्ति को एक स्थान से दूसरे स्थान ले जाने या हटाने का भाव देती है। सन्दर्भ में नबूकदनेस्सर पहले लोगों को भेजता है, इसलिए हिन्दी की प्रेरणार्थक अभिव्यक्ति दोनों क्रियाओं का स्वाभाविक संबंध बनाए रखती है।
- source_word: αὐτόν
  choice: उसे
  rationale: मूल में सर्वनाम है, जो पिछले सन्दर्भ के राजा की ओर संकेत करता है; नाम जोड़ना अनावश्यक रूप से अर्थ को अधिक निश्चित करता।
- source_word: ἅμα
  choice: समेत
  rationale: यह साथ ले जाए जाने का भाव संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς ἱεροῖς σκεύεσιν
  choice: पवित्र पात्रों
  rationale: ἱερός का अर्थ ‘पवित्र’ और σκεύη का अर्थ पात्र या उपस्कर है। ‘पात्र’ मूल शब्द के ठोस अर्थ को बनाए रखता है और ‘मन्दिर के पात्र’ जैसी संदर्भगत व्याख्या नहीं जोड़ता।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: प्राथमिक यूनानी पाठ में κυρίου है; ‘प्रभु’ उसका मानक, गरिमापूर्ण हिन्दी रूप है और सम्बन्धकारक स्वामित्व को स्पष्ट करता है।
theological_decisions:
- issue: द्वितीयकानूनी ऐतिहासिक पुस्तक में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक पाठ यूनानी है और उसमें κυρίου लिखा है, न कि इब्रानी परमेश्वर-नाम। इसलिए ‘प्रभु’ मूल साक्ष्य का सीधे अनुसरण करता है और इब्रानी समानांतर से परमेश्वर-नाम आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ऐतिहासिक गद्य। ‘भिजवा दिया’ नबूकदनेस्सर द्वारा लोगों को भेजे जाने और उनके माध्यम से राजा को बाबेल ले जाए जाने के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है। अन्त का अल्पविराम यूनानी वाक्य के आगे जारी रहने को दर्शाता है।
