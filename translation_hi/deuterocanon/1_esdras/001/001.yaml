base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/001.yaml
  text: And Josiah kept the Passover in Jerusalem to the Lord his God[a], and they slaughtered the Passover on the fourteenth day of the first month,
translation:
  language: hi
  text: और योशियाह ने यरूशलेम में अपने प्रभु के लिए फसह मनाया[a], और उन्होंने पहले महीने के चौदहवें दिन फसह के पशु का वध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “अपने प्रभु के लिए”; 2 इतिहास 35:1 के इब्रानी समानांतर में “यहोवा के लिए” है।
    reason: यूनानी प्राथमिक पाठ और इब्रानी समानांतर के बीच अंतर स्पष्ट करना।
lexical_decisions:
- source_word: ἤγαγεν
  choice: मनाया
  rationale: क्रिया का मूल अर्थ ‘ले गया/लाया’ है, पर πάσχα के साथ यह पर्व का अनुष्ठान करने का भाव देती है; हिन्दी में ‘फसह मनाया’ स्वाभाविक और अर्थसंगत है।
- source_word: τὸ πάσχα (पहला प्रयोग)
  choice: फसह
  rationale: यहाँ पूरे पर्व और उसके अनुष्ठान का संकेत है, इसलिए केवल ‘फसह’ पर्याप्त है।
- source_word: τῷ κυρίῳ αὐτοῦ
  choice: अपने प्रभु के लिए
  rationale: यूनानी में αὐτοῦ का संबंधवाचक भाव स्पष्ट है। ‘अपने प्रभु के लिए’ उसे बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: ἔθυσαν
  choice: वध किया
  rationale: यह क्रिया बलि के पशु को मारने की ठोस क्रिया बताती है; समानांतर इब्रानी וישחטו भी इसी अर्थ की पुष्टि करता है।
- source_word: τὸ πάσχα (दूसरा प्रयोग)
  choice: फसह के पशु
  rationale: ἔθυσαν के कर्म के रूप में यह पर्व नहीं, फसह-बलि के पशु को सूचित करता है। यूनानी में ‘मेमना’ स्पष्ट नहीं है, इसलिए व्यापक ‘पशु’ चुना गया है।
- source_word: τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ τοῦ μηνὸς τοῦ πρώτου
  choice: पहले महीने के चौदहवें दिन
  rationale: कालवाचक पदबंध का सीधा, स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: यूनानी κύριος का अनुवाद, जबकि इब्रानी समानांतर में YHWH है
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक यूनानी पाठ में κυρίῳ αὐτοῦ (‘अपने प्रभु’) है; इसलिए इब्रानी समानांतर से परमेश्वर का विशिष्ट नाम मुख्य पाठ में आरोपित नहीं किया गया।
- issue: αὐτοῦ के संबंधवाचक भाव को बनाए रखना
  choice: अपने प्रभु के लिए
  alternative: प्रभु के लिए / अपने परमेश्वर यहोवा के लिए
  rationale: मुख्य पाठ यूनानी के वास्तविक संबंधवाचक को सुरक्षित रखता है, जबकि पादटिप्पणी इब्रानी समानांतर का भिन्न पाठ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘फसह’ प्रचलित बाइबलीय पद है। दूसरे πάσχα में ‘पशु’ जोड़कर प्रसंगगत अर्थ स्पष्ट किया गया है, पर यूनानी में अनुपस्थित ‘मेमना’ नहीं जोड़ा गया।
