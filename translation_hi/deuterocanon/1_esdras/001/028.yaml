base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/028.yaml
  text: And the king said to his servants[a], “Take me away from the battle, for I am very weak.” And immediately his servants took him away from the battle line,
translation:
  language: hi
  text: तब राजा ने अपने सेवकों[a] से कहा, “मुझे युद्ध से बाहर ले चलो, क्योंकि मैं बहुत निर्बल हो गया हूँ।” और उसके सेवक उसे तुरन्त युद्ध-पंक्ति से बाहर ले गए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिचारकों।” यूनानी शब्द παῖδες का अर्थ “सेवक,” “परिचारक” या “युवक” हो सकता है; समानांतर इब्रानी पाठ में “उसके सेवक” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς / παισίν / παῖδες
  choice: सेवक
  rationale: राजकीय और सैनिक प्रसंग में यह राजा के निजी सेवकों या परिचारकों को सूचित करता है, बच्चों को नहीं। समानांतर इब्रानी पाठ עֲבָדָיו (‘उसके सेवक’) भी इस चुनाव का समर्थन करता है।
- source_word: Ἀποστήσατέ με
  choice: मुझे ... बाहर ले चलो
  rationale: आज्ञार्थक क्रिया का आशय राजा को सक्रिय युद्ध से हटाकर ले जाना है। यह हिन्दी में स्वाभाविक है और इब्रानी समानांतर הַעֲבִירוּנִי की प्रेरणार्थक गति से मेल खाता है।
- source_word: ἀπὸ τῆς μάχης
  choice: युद्ध से बाहर
  rationale: μάχη स्वयं लड़ाई या युद्ध को दर्शाता है; ‘युद्ध से बाहर’ हटाए जाने की भौतिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἠσθένησα
  choice: मैं ... निर्बल हो गया हूँ
  rationale: क्रिया दुर्बल हो जाने या अस्वस्थ होने का बोध देती है, पर अपने-आप में घायल होने को स्पष्ट नहीं करती। पूर्णतासूचक हिन्दी वर्तमान स्थिति और उसके घटित होने, दोनों को व्यक्त करता है।
- source_word: λίαν
  choice: बहुत
  rationale: यह तीव्रता-सूचक अव्यय है; ‘बहुत’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: सेवकों की तत्काल कार्रवाई को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: παράταξις
  choice: युद्ध-पंक्ति
  rationale: यह व्यवस्थित सैनिक मोर्चे या युद्ध-व्यूह को सूचित करता है। ‘युद्ध-पंक्ति’ पहले आए सामान्य ‘युद्ध’ से इसका भेद बनाए रखती है।
