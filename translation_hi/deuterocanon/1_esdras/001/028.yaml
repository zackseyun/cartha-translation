translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘निर्बल हो गया हूँ’ मूल की अस्पष्टता बनाए रखता है और बिना आधार ‘घायल’ नहीं जोड़ता। पद अगले वाक्य से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है।
