base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/007.yaml
  text: And Josiah gave to the people who were present thirty thousand lambs and young goats[b][a], and three thousand calves.
translation:
  language: hi
  text: और योशियाह ने वहाँ उपस्थित लोगों को[a] तीस हज़ार मेमने और बकरी के बच्चे तथा तीन हज़ार बछड़े दिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लोगों को—जो पाए गए”; प्रसंग में इसका अर्थ संभवतः वहाँ उपस्थित या एकत्र लोग है।
    reason: lexical_alternative
  - marker: b
    text: उपलब्ध इब्रानी समानांतर इस यूनानी पद से निकटता से मेल नहीं खाता; इसलिए यहाँ प्राथमिक रूप से यूनानी पाठ का अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐδωρήσατο
  choice: दिए
  rationale: मध्यवाच्य क्रिया δωρέομαι उपहार या दान के रूप में देने का भाव रखती है। संदर्भ में सरल और स्वाभाविक ‘दिए’ राजकीय प्रबंध को स्पष्ट करता है।
- source_word: τῷ λαῷ
  choice: लोगों को
  rationale: सम्प्रदान कारक उपहार पाने वालों को सूचित करता है; ‘लोगों को’ इसका सीधा हिन्दी रूप है।
- source_word: τοῖς εὑρεθέντι
  choice: वहाँ उपस्थित लोगों को
  rationale: यूनानी पद का शाब्दिक भाव ‘जो पाए गए’ है, पर प्रसंग में इससे वहाँ मौजूद या एकत्र लोग अभिप्रेत हैं। ‘वहाँ उपस्थित’ आधुनिक हिन्दी में स्वाभाविक है और स्थल-सापेक्ष अर्थ बनाए रखता है।
- source_word: ἀρνῶν
  choice: मेमने
  rationale: ἀρνός सामान्यतः कम उम्र की भेड़, अर्थात मेमना, दर्शाता है; यह व्यापक ‘भेड़’ से अधिक सटीक है।
- source_word: ἐρίφων
  choice: बकरी के बच्चे
  rationale: ἔριφος कम उम्र की बकरी को दर्शाता है। यह रूप आधुनिक पाठकों के लिए स्पष्ट है।
- source_word: τριακοντα χιλιάδας
  choice: तीस हज़ार
  rationale: संख्या का सीधा रूपांतरण।
- source_word: μόσχους
  choice: बछड़े
  rationale: μόσχος कम उम्र के गोवंश को दर्शाता है। ‘बछड़े’ लिंग को अनावश्यक रूप से निश्चित किए बिना सबसे सीधा समतुल्य है।
- source_word: τρισχιλίους
  choice: तीन हज़ार
  rationale: संख्या का सीधा रूपांतरण।
theological_decisions:
- issue: गंभीर रूप से असंगत एमटी समानांतर का उपयोग
  choice: मुख्य पाठ में यूनानी साक्ष्य का अनुसरण करते हुए योशियाह द्वारा पशु दिए जाने का वर्णन
  alternative: 2 इतिहास 35:6 से प्रभावित सामंजस्यपूर्ण पाठ, जिसमें फसह के पशु काटने और तैयारी करने की आज्ञा हो
  rationale: दिया गया इब्रानी समानांतर इस यूनानी पद से निकटता से मेल नहीं खाता और भिन्न क्रियाओं का वर्णन करता है। 1 एस्द्रास के लिए यूनानी प्राथमिक स्रोत है, इसलिए इब्रानी पाठ की अलग क्रिया-श्रृंखला मुख्य अनुवाद में नहीं लाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। पशुओं के नाम विशिष्ट रखे गए हैं; वाक्य में अनावश्यक धार्मिक शब्दावली नहीं जोड़ी गई। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में सम्मिलित हैं।
