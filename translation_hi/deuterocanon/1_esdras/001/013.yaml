base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/013.yaml
  text: For the priests were offering up the fat until evening[a], and the Levites prepared for themselves and for the priests, their brothers, the sons of Aaron.
translation:
  language: hi
  text: क्योंकि याजक साँझ तक चर्बी चढ़ाते रहे[a]; और लेवियों ने अपने लिए और अपने भाई याजकों, अर्थात हारून के पुत्रों, के लिए तैयार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चर्बी के भाग।” यूनानी शब्द बलिदान की उस चर्बी को सूचित करता है जो वेदी पर चढ़ाई जाती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέφερον
  choice: वेदी पर चढ़ाते रहे
  rationale: बलिदान के प्रसंग में क्रिया का अर्थ वेदी पर अर्पित करना है। अपूर्ण भूतकाल की निरंतरता को ‘चढ़ाते रहे’ से व्यक्त किया गया है।
- source_word: τὰ στέατα
  choice: चर्बी के भागों
  rationale: στέαρ यहाँ बलिदान में वेदी पर चढ़ाई जाने वाली चर्बी को सूचित करता है। ‘भागों’ से धार्मिक अनुष्ठान का आशय स्पष्ट होता है, जबकि पादटिप्पणी संक्षिप्त विकल्प बताती है।
- source_word: ἕως ὀψίας
  choice: साँझ तक
  rationale: यह यूनानी समय-वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἡτοίμασαν
  choice: तैयारी की
  rationale: मूल में तैयार की गई वस्तु स्पष्ट नहीं कही गई है; इसलिए हिन्दी में भी उसे अनिर्दिष्ट रखा गया है।
- source_word: ἑαυτοῖς
  choice: अपने लिए
  rationale: आत्मवाचक संप्रदान का स्वाभाविक हिन्दी अनुवाद।
- source_word: τοῖς ἱερεῦσιν ἀδελφοῖς αὐτῶν
  choice: अपने भाई याजकों
  rationale: इससे याजकों और लेवियों के सामुदायिक/वंशीय भाईचारे का स्पष्ट किन्तु सहज रूप बना रहता है।
- source_word: υἱοῖς Ἀαρών
  choice: हारून के पुत्रों
  rationale: यह याजकों की पहचान को और स्पष्ट करने वाली समानाधिकरणीय अभिव्यक्ति है तथा पारंपरिक याजकीय पदनाम को सुरक्षित रखती है।
theological_decisions:
- issue: याजकीय/गोत्रीय प्रसंग में ἀδελφοῖς का अनुवाद
  choice: अपने भाई याजकों
  alternative: अपने संबंधी याजकों
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग संबंध-सूचक शब्द ‘भाइयों’ का प्रयोग है। ‘भाई याजकों’ उस वंशीय और सामुदायिक संबंध को बिना तटस्थ किए बनाए रखता है।
- issue: υἱοῖς Ἀαρών का προηγ पदबंध से संबंध
  choice: अर्थात हारून के पुत्रों
  alternative: और हारून के पुत्रों
  rationale: कारक और वाक्यरचना इसे ‘याजकों, उनके भाइयों’ की पहचान स्पष्ट करने वाला समानाधिकरण मानने का समर्थन करते हैं, न कि एक अलग तीसरा समूह।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज धार्मिक शैली अपनाई गई है। ‘साँझ’, ‘याजक’, ‘लेवी’ और ‘वेदी पर चढ़ाना’ जैसे प्रचलित बाइबलीय पद रखे गए हैं। मूल में तैयारी की वस्तु अनिर्दिष्ट होने के कारण उसे जोड़ा नहीं गया।
