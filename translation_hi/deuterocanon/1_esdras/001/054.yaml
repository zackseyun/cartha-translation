base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/054.yaml
  text: And they were servants to him and to his sons until the Persians came to reign, to fulfill the word of the Lord by the mouth of Jeremiah.
translation:
  language: hi
  text: और वे उसके और उसके पुत्रों के सेवक रहे, जब तक फ़ारसियों ने शासन करना आरम्भ नहीं किया, ताकि यिर्मयाह के मुख से निकला प्रभु का वचन पूरा हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖδες
  choice: सेवक
  rationale: साम्राज्य के अधीन सेवा की इस पृष्ठभूमि में यह शब्द बालकों या जैविक संतानों के बजाय अधीनस्थ सेवकों को दर्शाता है। ‘दास’ संभव है, पर वह सामाजिक स्थिति को यूनानी पाठ की अपेक्षा अधिक निश्चित कर देगा।
- source_word: μέχρι οὗ βασιλεῦσαι Πέρσας
  choice: जब तक फ़ारसियों का शासन आरम्भ नहीं हुआ
  rationale: यह पदबंध फ़ारसी शासन के आरम्भ तक की समय-सीमा बताता है। यह अनुवाद उस संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς ἀναπλήρωσιν
  choice: ताकि ... पूरा हो
  rationale: पदबंध यहाँ उद्देश्य अथवा परिणाम के रूप में भविष्यवाणी के पूर्ण होने को व्यक्त करता है; हिन्दी में यह रचना सहज और स्पष्ट है।
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: प्रभु का वचन
  rationale: ῥῆμα यहाँ परमेश्वर की भविष्यसूचक उक्ति को सूचित करता है। ‘प्रभु का वचन’ सटीक, परिचित और स्रोत के κύριος के अनुरूप है।
- source_word: ἐν στόματι Ἰερεμίου
  choice: यिर्मयाह के मुख से कहा गया
  rationale: यह भविष्यसूचक माध्यम का बाइबलीय मुहावरा बनाए रखता है और आधुनिक हिन्दी में यह स्पष्ट करता है कि वचन यिर्मयाह के द्वारा कहा गया था।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक स्रोत यूनानी κύριος है। इसलिए उसके पीछे संभावित इब्रानी दैवी नाम को पाठ में पुनर्स्थापित करने के बजाय ‘प्रभु’ रखा गया है।
- issue: आसन्न इब्रानी समानांतर से संबंध
  choice: यूनानी पाठ के अनुसार फ़ारसी शासन तक सेवा और भविष्यवाणी की पूर्ति का कथन
  alternative: मन्दिर के पात्रों को बाबुल ले जाने वाले दिए गए इब्रानी समानांतर के अनुरूप बनाना
  rationale: प्रदत्त इब्रानी समानांतर इस यूनानी वाक्य से मेल नहीं खाता और उसे केवल अनुमानित समानांतर बताया गया है। अतः 1 एस्द्रास का यूनानी पाठ नियंत्रक आधार है।
- issue: εἰς ἀναπλήρωσιν में उद्देश्य और परिणाम
  choice: ताकि ... पूरा हो
  alternative: जिससे ... पूरा हुआ
  rationale: यूनानी पदबंध उद्देश्य अथवा परिणाम दोनों की छाया रख सकता है। ‘ताकि’ पारंपरिक भविष्यसूचक पूर्ति-सूत्र को स्वाभाविक ढंग से व्यक्त करता है, बिना घटनाओं के कारण-संबंध पर अतिरिक्त सिद्धान्त आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘फ़ारसी’ का प्रचलित रूप और ‘यिर्मयाह’ का परिचित बाइबलीय नाम-रूप अपनाया गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
