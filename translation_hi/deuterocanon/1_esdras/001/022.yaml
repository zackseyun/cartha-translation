base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/022.yaml
  text: And the things concerning him also have been recorded in former times[a], concerning those who sinned and acted wickedly against the Lord beyond every nation and kingdom, and grieved him greatly[b]; and the words of the Lord rose up against Israel.
translation:
  language: hi
  text: और उससे संबंधित बातें भी पहले के समयों में लिखी जा चुकी हैं—उन लोगों के विषय में जिन्होंने हर जाति और राज्य से बढ़कर[a] प्रभु के विरुद्ध पाप किया और दुष्टता की, और उसे बहुत दुःखी किया[b]; और प्रभु के वचन इस्राएल के विरुद्ध उठ खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर जाति और राज्य से भी अधिक।” यूनानी वाक्यांश उनके पाप और दुष्टता को सभी जातियों और राज्यों से बढ़कर बताता है।
    reason: lexical_alternative
  - marker: b
    text: “बहुत” के स्थान पर प्राप्त यूनानी शब्द ἔστω है, जिसका यहाँ प्रयोग कठिन और असामान्य है। अनुवाद ने इसे बल देने वाला माना है; संभव है कि इस पंक्ति के पाठ में कोई छोटी-सी गड़बड़ी सुरक्षित रह गई हो।
    reason: textual_variant
lexical_decisions:
- source_word: τὰ κατʼ αὐτόν
  choice: उसके विषय की बातें
  rationale: यह व्यापक यूनानी अभिव्यक्ति उस व्यक्ति से संबंधित बातों या कार्यों को समेटती है; केवल ‘काम’ कहने से अर्थ अनावश्यक रूप से सीमित हो जाता।
- source_word: ἀναγέγραπται ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: पहले के समयों में लिखी जा चुकी हैं
  rationale: पूर्ण निष्क्रिय क्रिया किसी स्थायी लिखित अभिलेख की ओर संकेत करती है, जबकि काल-संबंधी वाक्यांश को बिना ‘पुस्तकों’ या ‘वृत्तांतों’ को जोड़कर प्रस्तुत किया गया है।
- source_word: περὶ τῶν ἡμαρτηκότων καὶ ἠσεβηκότων
  choice: उन लोगों के विषय में, जिन्होंने … पाप और दुष्टता की
  rationale: 'दोनों कृदंतों का भेद बनाए रखा गया है: पहला पाप करने और दूसरा अधार्मिक अथवा दुष्ट आचरण करने को व्यक्त करता है।'
- source_word: εἰς τὸν κύριον
  choice: प्रभु के विरुद्ध
  rationale: इस नैतिक और न्यायिक प्रसंग में εἰς का स्वाभाविक अर्थ विरोध या अपराध की दिशा को दर्शाता है।
- source_word: παρὰ ἅπαν ἔθνος καὶ βασιλείαν
  choice: हर जाति और राज्य से बढ़कर
  rationale: 'παρά के तुलनात्मक अर्थ को स्पष्ट रखा गया है: उनका अपराध अन्य सभी जातियों और राज्यों के अपराध से बढ़कर था; इसकी संभावित व्याख्यात्मक सीमा फुटनोट में दी गई है।'
- source_word: ἐλύπησαν αὐτόν
  choice: उसे … दुःखी किया
  rationale: परमेश्वर के लिए प्रयुक्त व्यक्तिगत शोक की भाषा को नरम किए बिना सुरक्षित रखा गया है।
- source_word: ἔστω
  choice: बहुत
  rationale: प्राप्त यूनानी पाठ में ἔστω प्रसंगानुकूल कठिन है। मुख्य पाठ इसे बलवर्धक रूप में प्रस्तुत करता है, पर पाठगत कठिनाई फुटनोट में स्पष्ट की गई है।
- source_word: οἱ λόγοι τοῦ κυρίου ἀνέστησαν ἐπʼ Ἰσραήλ
  choice: प्रभु के वचन इस्राएल के विरुद्ध उठ खड़े हुए
  rationale: यह अनुवाद वचनों के न्यायकारी रूप से सक्रिय हो उठने वाले सजीव चित्र और विरोधसूचक ἐπί, दोनों को बनाए रखता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी; यहोवा
  rationale: यूनानी κύριος के लिए ‘प्रभु’ स्वाभाविक और व्यापक रूप से समझा जाने वाला रूप है; यहाँ किसी विशिष्ट सम्प्रदायगत रूप को आरोपित करने की आवश्यकता नहीं है।
- issue: ἐλύπησαν αὐτόν में परमेश्वर के दुःखी होने की भाषा
  choice: उसे बहुत दुःखी किया
  alternative: उसे क्रोधित किया; उसे उकसाया
  rationale: यूनानी पाठ स्पष्टतः दुःख या शोक की भाषा प्रयोग करता है। उसे केवल क्रोध या उकसावे में बदलने से मूल पाठ का व्यक्तिगत और धर्मवैचारिक तनाव मिट जाता।
- issue: प्रभु के वचनों का इस्राएल के विरुद्ध उठना
  choice: उठ खड़े हुए
  alternative: इस्राएल पर आ पड़े; इस्राएल के विरुद्ध सिद्ध हुए
  rationale: मूल की मानवीकरणात्मक और न्यायसूचक भाषा को बिना यह तय किए रखा गया है कि यह केवल भविष्यवाणी की पूर्ति है या दण्ड की सक्रिय घोषणा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। लंबे यूनानी वाक्य का प्रवाह बनाए रखने के लिए डैश और अर्धविराम प्रयुक्त हैं। ‘जाति और राज्य’, ‘प्रभु’ और ‘इस्राएल’ जैसे रूप बाइबलीय ऐतिहासिक शैली बनाए रखते हैं, जबकि पाठगत कठिनाई को मुख्य पाठ में छिपाने के बजाय फुटनोट में दर्ज किया गया है।
