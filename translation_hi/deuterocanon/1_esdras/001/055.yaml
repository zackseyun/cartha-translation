base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/055.yaml
  text: until the land had enjoyed its Sabbaths; all the time of its desolation it kept Sabbath[a], to complete seventy years.
translation:
  language: hi
  text: जब तक भूमि ने अपने सब्तों का आनंद न ले लिया; अपने उजाड़ पड़े रहने के पूरे समय वह सब्त का विश्राम करती रही[a], ताकि सत्तर वर्ष पूरे हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “जब तक भूमि अपने सब्तों से प्रसन्न न हो गई; अपने उजाड़ पड़े रहने के पूरे समय वह सब्त मानती रही।” यूनानी में भूमि का मानवीकरण किया गया है। यहाँ यूनानी क्रिया का रूप भविष्यकालीन है, पर ऐतिहासिक प्रसंग में उसका भाव इस अवधि के दौरान सब्त मानने का है।'
    reason: शाब्दिक विकल्प, भूमि के मानवीकरण, और यूनानी भविष्यकालीन क्रियारूप के प्रसंगानुकूल अर्थ को स्पष्ट करना
lexical_decisions:
- source_word: Ἕως τοῦ εὐδοκῆσαι
  choice: जब तक … सुख न पा लिया
  rationale: ἕως के साथ संज्ञात्मक क्रियारूप अवधि की अंतिम सीमा बताता है। εὐδοκέω का मूल भाव प्रसन्न या संतुष्ट होना है; ‘सुख पाना’ भूमि के मानवीकरण को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὴν γῆν
  choice: भूमि
  rationale: यहाँ γῆ समूची पृथ्वी नहीं, उजाड़ पड़ी यहूदा की भूमि को सूचित करता है। ‘भूमि’ आगे के सब्तीय विश्राम के विचार के लिए भी उपयुक्त है।
- source_word: τὰ σάββατα αὐτῆς
  choice: अपने सब्तों
  rationale: बहुवचन और सब्त-संबंधी विशिष्ट शब्दावली को बनाए रखा गया है, जिससे भूमि को मिलने वाले छूटे हुए सब्तीय विश्रामों की प्रतिध्वनि सुरक्षित रहती है।
- source_word: πάντα τὸν χρόνον τῆς ἐρημώσεως αὐτῆς
  choice: अपने उजाड़ पड़े रहने के पूरे समय
  rationale: यह भूमि की उजड़ी हुई अवस्था की संपूर्ण अवधि को व्यक्त करता है। यह हिन्दी ‘उसके उजाड़पन के पूरे समय’ की अपेक्षा अधिक सहज है।
- source_word: σαββατιεῖ
  choice: वह सब्त का विश्राम करती रही
  rationale: यह क्रिया सब्त से बनी है और केवल सामान्य विश्राम नहीं, सब्तीय विश्राम का संकेत देती है। प्रसंगगत अवधि को स्वाभाविक हिन्दी में ‘करती रही’ से व्यक्त किया गया है।
- source_word: εἰς συμπλήρωσιν
  choice: ताकि … पूरे हों
  rationale: 'यह पद उद्देश्य अथवा परिणाम बताता है: उजाड़ रहने और सब्तीय विश्राम की अवधि से सत्तर वर्ष पूर्ण हुए।'
- source_word: ἐτῶν ἑβδομήκοντα
  choice: सत्तर वर्ष
  rationale: संख्या को सीधे और अक्षरशः रखा गया है, क्योंकि निर्वासन-परंपरा में इसका ऐतिहासिक और धर्मवैचारिक महत्त्व है।
theological_decisions:
- issue: निर्वासन के समय भूमि पर लागू सब्त की भाषा
  choice: ‘अपने सब्तों’ और ‘सब्त का विश्राम’—दोनों स्थानों पर स्पष्ट सब्तीय शब्दावली बनाए रखना
  alternative: ‘अपने विश्रामों’ और ‘विश्राम करती रही’ जैसे सामान्य शब्द
  rationale: यूनानी में संज्ञा और क्रिया दोनों सब्त-मूल से हैं। इस पुनरावृत्ति को बनाए रखने से यह भाव स्पष्ट रहता है कि उजाड़ रहने के दौरान भूमि को उसके सब्तीय विश्राम मिले; इसे केवल सामान्य आराम में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सब्त’ बाइबलीय प्रमुख शब्द के रूप में सुरक्षित है; ‘उजाड़ पड़े रहना’ विनाश के बाद भूमि की निर्जन दशा को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में [a] चिह्न उपस्थित है।
