base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/052.yaml
  text: And they burned the house of the Lord[a], and tore down the walls of Jerusalem, and burned its towers with fire[b],
translation:
  language: hi
  text: और उन्होंने प्रभु के भवन को आग लगा दी,[a] यरूशलेम की दीवारों को ढा दिया, और उसकी मीनारों को भी आग लगा दी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यरूशलेम के मन्दिर को। इसका अनुवाद ‘प्रभु के भवन को जला दिया’ भी हो सकता है। यूनानी में भवन और मीनारों के लिए जलाने की एक ही क्रिया प्रयुक्त हुई है।
    reason: शाब्दिक विकल्प और सन्दर्भ-स्पष्टीकरण
  - marker: b
    text: ‘उसकी’ का संकेत यरूशलेम की ओर है।
    reason: सर्वनाम का सन्दर्भ
lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: आग लगा दी / आग में जला दिया
  rationale: क्रिया का अर्थ आग लगाना या जलाना है। दोनों प्रयोगों में आग का भाव स्पष्ट रखा गया है, पर पूर्णतः भस्म हो जाने का अर्थ नहीं जोड़ा गया।
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: प्रभु का भवन
  rationale: οἶκος का मूल अर्थ ‘घर/भवन’ है और यहाँ उससे यरूशलेम का मन्दिर अभिप्रेत है। ‘प्रभु का भवन’ स्रोत की अभिव्यक्ति को बनाए रखते हुए हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: κατέλυσαν
  choice: ढा दिया
  rationale: यहाँ क्रिया किसी संरचना को गिरा देने या ध्वस्त करने का भाव देती है; शहरपनाहों के लिए ‘ढा दिया’ सटीक और सहज है।
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: यरूशलेम की शहरपनाहों
  rationale: τείχη नगर की रक्षात्मक दीवारें हैं। ‘शहरपनाह’ साधारण ‘दीवार’ की अपेक्षा इस सैन्य-नगर संदर्भ को अधिक ठीक व्यक्त करता है।
- source_word: τοὺς πύργους αὐτῆς
  choice: उसकी मीनारों
  rationale: πύργοι का अर्थ मीनारें या बुर्ज है। ‘उसकी’ का संकेत यरूशलेम की ओर है और यूनानी सर्वनाम का सम्बन्ध सुरक्षित रहता है।
- source_word: ἐν πυρί
  choice: आग में
  rationale: वाक्यांश का शब्दशः रूप ‘आग में’ है और दूसरी बार प्रयुक्त जलाने की क्रिया के साथ स्रोत की पुनरुक्ति को बनाए रखता है।
theological_decisions:
- issue: मन्दिर-विनाश के प्रसंग में κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: मुख्य स्रोत यूनानी है और उसमें κυρίου है। इसलिए ‘प्रभु’ रखा गया है; समानान्तर इब्रानी परम्परा के आधार पर यहाँ चुपचाप ‘यहोवा’ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक रूप रखा गया है। ‘शहरपनाह’ नगर की किलेबन्द दीवारों और ‘मीनार’ πύργος को व्यक्त करती है। यूनानी के तीन समन्वित खण्डों और जलाने की पुनरावृत्ति को यथासम्भव बनाए रखा गया है।
