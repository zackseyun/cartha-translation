  terminology: “प्रभु परमेश्वर” appropriately represents Κυρίου τοῦ θεοῦ, and “प्रभु” consistently renders Κύριος without resolving the speaker’s theological claim. “विरोध मत करो” accurately conveys the warning not to oppose the Lord.
