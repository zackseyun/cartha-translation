base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/025.yaml
  text: Was I not sent against you by the Lord God? For my war is on the Euphrates[a], and now the Lord is with me, and the Lord is with me, urging me on. Stand aside[b], and do not oppose the Lord.
translation:
  language: hi
  text: “क्या प्रभु परमेश्वर ने मुझे तुम्हारे विरुद्ध नहीं भेजा है? क्योंकि मेरा युद्ध फ़रात[a] पर है। अब प्रभु मेरे साथ है, और प्रभु मेरे साथ है और मुझे शीघ्र आगे बढ़ा रहा है[b]। हट जाओ और प्रभु का विरोध मत करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़रात के पास” अथवा “फ़रात के किनारे।” यूनानी वाक्यांश नको के अभियान का स्थान बताता है; समानांतर इब्रानी पाठ फ़रात पर कर्कमीश का नाम लेता है।
    reason: lexical_alternative
  - marker: b
    text: या “मुझे तेजी से आगे बढ़ा रहा है” अथवा “मुझे आगे बढ़ने के लिए प्रेरित कर रहा है।” यूनानी कृदन्त बताता है कि प्रभु अभियान की गति बढ़ा रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πρὸς σὲ ἐξαπέσταλμαι
  choice: क्या ... मुझे तुम्हारे विरुद्ध भेजा है? नहीं।
  rationale: οὐχὶ नकारात्मक उत्तर की अपेक्षा करने वाला आलंकारिक प्रश्न है। हिन्दी में प्रश्न के बाद ‘नहीं’ रखने से आशय स्वाभाविक और स्पष्ट रहता है; सैन्य प्रसंग में πρὸς σὲ का अर्थ ‘तुम्हारे विरुद्ध’ है।
- source_word: ὑπὸ Κυρίου τοῦ θεοῦ
  choice: प्रभु परमेश्वर ने
  rationale: यूनानी कर्मवाच्य को स्वाभाविक हिन्दी कर्तृवाच्य में रखा गया है; ‘प्रभु परमेश्वर’ Κυρίου τοῦ θεοῦ के पद और दावे को सुरक्षित रखता है।
- source_word: ἐπὶ γὰρ τοῦ Εὐφράτου
  choice: क्योंकि ... फ़रात नदी के पास
  rationale: ἐπί यहाँ युद्ध-क्षेत्र का स्थान बताता है। ‘के पास’ हिन्दी में सहज है, जबकि ‘पर’ और ‘किनारे’ भी सम्भव हैं; इस अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: ὁ πόλεμός μού ἐστιν
  choice: मेरा युद्ध ... है
  rationale: सीधा अनुवाद नको के अपने अभियान पर दिए गए बल को बनाए रखता है।
- source_word: Κύριος μετʼ ἐμοῦ ἐστίν
  choice: प्रभु मेरे साथ है
  rationale: ‘मेरे साथ’ मूल की दैवी सहायता वाली अभिव्यक्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: Κύριος μετʼ ἐμοῦ ἐπισπεύδων ἐστίν
  choice: प्रभु मेरे साथ होकर मुझे शीघ्र आगे बढ़ा रहा है
  rationale: ἐπισπεύδων अभियान को तेज़ करने या आगे बढ़ाने की सक्रिय धारणा देता है। यह अनुवाद पुनरुक्ति ‘प्रभु मेरे साथ’ को भी बनाए रखता है।
- source_word: ἀπόστηθι
  choice: हट जाओ
  rationale: आज्ञार्थक क्रिया यहाँ हस्तक्षेप छोड़कर अलग हो जाने की चेतावनी देती है; ‘हट जाओ’ वर्तमान हिन्दी में सीधा और स्वाभाविक है।
- source_word: μὴ ἐναντίου τῷ κυρίῳ
  choice: प्रभु का विरोध मत करो
  rationale: वाक्यांश का विरोधात्मक बल संक्षिप्त और स्पष्ट रूप में व्यक्त होता है।
theological_decisions:
- issue: नको के कथन में κύριος का संकेत
  choice: सभी संबद्ध प्रयोगों को ‘प्रभु’ के रूप में अनूदित किया गया है।
  alternative: इसे सामान्य अर्थ में ‘कोई देवता’ अथवा विशेष रूप से नको का अपना देवता मानना।
  rationale: यूनानी पाठ Κυρίου τοῦ θεοῦ और Κύριος कहता है। अनुवाद नको के दैवी आदेश के दावे को प्रस्तुत करता है, पर उस दावे की सत्यता या देवता की पहचान पर पाठ से आगे जाकर निर्णय नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट। आलंकारिक प्रश्न को हिन्दी में सहज बनाने के लिए ‘नहीं’ जोड़ा गया है। मूल की ‘प्रभु मेरे साथ’ वाली पुनरुक्ति जानबूझकर सुरक्षित रखी गई है।
