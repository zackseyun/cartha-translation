  text: And the deeds of Josiah were upright before his Lord[b][a], with a heart full of godliness.
translation:
  language: hi
  text: और योशियाह के कार्य उसके प्रभु के सामने सही ठहराए गए[a]; उसका हृदय भक्ति से परिपूर्ण था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ठीक किए गए,” अथवा “सही रूप में स्थापित किए गए।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ “धर्मपरायणता” या “श्रद्धापूर्ण भक्ति” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρθώθη
  choice: ठीक ठहराए गए
  rationale: यह ὀρθόω के निष्क्रिय रूप को बनाए रखते हुए नैतिक रूप से सही पाए जाने या स्थापित किए जाने का भाव व्यक्त करता है; केवल ‘ठीक थे’ कहने से निष्क्रियता दब जाती।
- source_word: τὰ ἔργα
  choice: काम
  rationale: यहाँ आशय योशियाह के कार्यों और आचरण से है; ‘काम’ सामान्य आधुनिक हिन्दी में स्वाभाविक और ठोस है।
- source_word: Ἰωσείου
  choice: योशियाह
  rationale: यह नाम हिन्दी बाइबलीय परंपरा और समानांतर इब्रानी יֹאשִׁיָּהוּ के अनुरूप है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह प्रभु की दृष्टि और उपस्थिति में मूल्यांकन का संबंधपरक भाव सहज हिन्दी में बनाए रखता है।
- source_word: τοῦ κυρίου αὐτοῦ
  choice: उसके प्रभु
  rationale: यूनानी में शाब्दिक रूप से ‘उसके प्रभु’ है; लगभग समानांतर इब्रानी सामग्री के प्रभाव से इसमें ‘परमेश्वर’ नहीं जोड़ा गया।
- source_word: ἐν καρδίᾳ πλήρει
  choice: उसका हृदय ... से परिपूर्ण था
  rationale: यूनानी की भीतरी मनोवृत्ति को स्पष्ट, स्वाभाविक हिन्दी वाक्य में व्यक्त करता है, यद्यपि संरचना को हिन्दी के अनुसार पुनर्गठित किया गया है।
- source_word: εὐσεβείας
  choice: भक्ति
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और धर्मपरायणता का भाव आधुनिक, सुबोध हिन्दी में देता है।
theological_decisions:
- issue: क्या κύριος का विस्तार ‘यहोवा’ या ‘उसका प्रभु परमेश्वर’ किया जाए
  choice: उसके प्रभु
  alternative: यहोवा; उसका प्रभु परमेश्वर
  rationale: इस पुस्तक के लिए प्राथमिक यूनानी पाठ τοῦ κυρίου αὐτοῦ पढ़ता है और θεός नहीं जोड़ता। इसलिए अनुमानित इब्रानी समानांतर के आधार पर अभिव्यक्ति का विस्तार नहीं किया गया।
- issue: εὐσέβεια को किसी संकीर्ण धार्मिक पारिभाषिक अर्थ में प्रस्तुत करना
  choice: भक्ति
  alternative: धर्मपरायणता; श्रद्धा
  rationale: ‘भक्ति’ परमेश्वराभिमुख निष्ठा का भाव रखती है, पर किसी विशिष्ट सम्प्रदाय की धारणा नहीं थोपती; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। यूनानी की निष्क्रिय क्रिया और ‘उसके प्रभु’ की सीमित अभिव्यक्ति सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
