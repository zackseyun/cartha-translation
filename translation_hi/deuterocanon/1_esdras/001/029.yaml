  yaml_path: translation/deuterocanon/1_esdras/001/029.yaml
  text: And he got onto his second chariot[a]; and after being brought back to Jerusalem[b], he ended his life and was buried in his ancestral tomb.
translation:
  language: hi
  text: और वह अपने दूसरे रथ पर चढ़ गया। यरूशलेम वापस लाए जाने के बाद उसने प्राण त्याग दिए[a], और उसे अपने पुरखों की कब्र में दफनाया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘उसने अपना जीवन बदल दिया/समाप्त कर दिया’ है; यह मरने के लिए प्रयुक्त एक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: 2 इतिहास 35:24 के इब्रानी समानांतर पाठ में ‘उसका दूसरा रथ’ जैसा भाव है और आगे यह भी कहा गया है कि समस्त यहूदा और यरूशलेम ने योशिय्याह के लिए शोक किया। 1 एस्द्रास का पाठ यहाँ संक्षिप्त है और ‘कब्र’ को एकवचन में रखता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέβη
  choice: चढ़ गया
  rationale: रथ के साथ यह क्रिया उस पर चढ़ने का स्वाभाविक अर्थ देती है और ऊपर जाने की मूल गति को भी बनाए रखती है।
- source_word: τὸ ἅρμα τὸ δεύτερον αὐτοῦ
  choice: अपने दूसरे रथ
  rationale: ἅρμα का सीधा अर्थ ‘रथ’ है और δεύτερον यहाँ विशेषण के रूप में उसके दूसरे अथवा सहायक रथ को दर्शाता है।
- source_word: ἀποκατασταθεὶς εἰς Ἰερουσαλήμ
  choice: यरूशलेम वापस लाए जाने के बाद
  rationale: कृदंत का कर्मवाच्य रूप केवल उसके लौटने के बजाय उसे वापस पहुँचाए जाने का भाव देता है।
- source_word: μετήλλαξεν τὸν βίον αὐτοῦ
  choice: उसने प्राण त्याग दिए
  rationale: यह मृत्यु के लिए प्रयुक्त यूनानी मुहावरा है। हिन्दी का यह प्रतिष्ठित और सहज मुहावरा मृत्यु का अर्थ स्पष्ट करता है, जबकि मूल की मुहावरेदार अभिव्यक्ति को भी बनाए रखता है।
- source_word: ἐτάφη
  choice: उसे ... दफनाया गया
  rationale: यूनानी कर्मवाच्य का स्वाभाविक हिन्दी रूप।
- source_word: ἐν τῷ πατρικῷ τάφῳ
  choice: अपने पुरखों की कब्र में
  rationale: πατρικός पूर्वजों अथवा पुरखों से संबंधित होने का भाव देता है; τάφος यूनानी में एकवचन है, इसलिए ‘कब्र’ एकवचन रखा गया है।
