base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/014.yaml
  text: And the temple singers[a], the sons of Asaph, were at their stations according to what had been appointed by David, and Asaph and Zechariah and Eddinous[b], who were from the king.
translation:
  language: hi
  text: और मन्दिर के गायक, आसाप के पुत्र, दाऊद की ठहराई हुई व्यवस्था के अनुसार अपने-अपने स्थान पर थे; और आसाप, जकर्याह और एद्दीनूस राजा की ओर से थे[a]।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें राजा ने नियुक्त किया था।” यूनानी में शाब्दिक भाव “जो राजा की ओर से थे” है; यह राजकीय नियुक्ति या राजा से किसी अन्य प्रकार के सम्बन्ध को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ का पाठ 2 इतिहास के निकटवर्ती इब्रानी समानान्तर से भिन्न है, जहाँ इस भाग में होमबलि बाँटने की बात आती है। 1 एस्द्रास में गायकों और नामित व्यक्तियों के बारे में यह विस्तृत सूचना मिलती है।
    reason: cross_reference
lexical_decisions:
- source_word: ἱεροψάλται
  choice: मन्दिर के गायक
  rationale: यह संयुक्त यूनानी शब्द पवित्र उपासना, विशेषकर मन्दिर की सेवा, से जुड़े गायकों को सूचित करता है। ‘मन्दिर के गायक’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: υἱοὶ Ἀσὰφ
  choice: आसाप के वंशज
  rationale: यह पद केवल प्रत्यक्ष पुत्रों के बजाय आसाप से जुड़ी वंशगत अथवा सेवक-मण्डली को सूचित कर सकता है; ‘वंशज’ आधुनिक पाठक के लिए इस आशय को स्पष्ट करता है।
- source_word: ἐπὶ τῆς τάξεως αὐτῶν
  choice: अपने-अपने निर्धारित स्थान पर
  rationale: τάξις यहाँ उपासना-सेवा में व्यवस्थित स्थान या नियत भूमिका को दर्शाता है। यह अनुवाद कार्यात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὰ ὑπὸ Δαυεὶδ τεταγμένα
  choice: जैसा दाऊद ने ठहराया था
  rationale: τεταγμένα व्यवस्थित, निर्धारित या नियुक्त की गई बातों को दर्शाता है; इस रूप में दाऊद को व्यवस्था का स्रोत बनाए रखते हुए हिन्दी सहज रहती है।
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: जिनका सम्बन्ध राजा से था
  rationale: παρά के साथ सम्बन्धित यूनानी वाक्यांश संक्षिप्त और अस्पष्ट है। यह अनुवाद राजकीय सम्बन्ध को बनाए रखता है, पर यह तय नहीं करता कि वे राजा द्वारा नियुक्त थे या उसके दरबार अथवा सेवा से जुड़े थे।
- source_word: Ἐδδεινοὺς
  choice: एद्दीनूस
  rationale: स्वीट के यूनानी पाठ में सुरक्षित नाम का निकट देवनागरी लिप्यन्तरण; नाम की पहचान अथवा किसी अन्य परम्परागत रूप को अनुमान से नहीं अपनाया गया।
