  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘आसाप के वंशज’ संगठनात्मक-वंशगत भाव स्पष्ट करता है। अंतिम यूनानी वाक्यांश की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखी गई है।
