  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘शोक मनाया’ और ‘विलाप किया’ के द्वारा यूनानी की दो अलग क्रियाओं का भेद रखा गया है। नामों में प्रचलित हिन्दी बाइबलीय रूप ‘योशिय्याह’ और ‘यिर्मयाह’ अपनाए गए हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
