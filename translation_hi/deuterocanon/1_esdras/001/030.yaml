base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/030.yaml
  text: And throughout all Judea they mourned for Josiah[a]; and Jeremiah the prophet lamented over Josiah, and the leaders together with the women kept lamenting him to this day[b]; and this was ordained to be done forever.
translation:
  language: hi
  text: और पूरे यहूदिया में लोगों ने योशिय्याह के लिए शोक मनाया; और यिर्मयाह भविष्यद्वक्ता ने योशिय्याह के लिए विलाप किया। अगुवे और स्त्रियाँ आज के दिन तक उसके लिए विलाप करते रहे[b]; और यह ठहराया गया कि ऐसा सदा किया जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह निरंतर किया जाए, ऐसा आदेश दिया गया था,” अथवा “इसे सदा की प्रथा के रूप में स्थापित किया गया था।” यूनानी शब्दावली किसी औपचारिक और जारी रहने वाली प्रथा का संकेत देती है, पर क्रिया का ठीक प्रशासनिक आशय स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: 2 इतिहास 35:24–25 के इब्रानी समानांतर पाठ में पूरे यहूदा और यरूशलेम के योशिय्याह के लिए शोक करने तथा यिर्मयाह के उसके लिए विलाप करने का उल्लेख है। यहाँ 1 एस्द्रास में अगुवों और स्त्रियों द्वारा “आज के दिन तक” विलाप किए जाने का अतिरिक्त वर्णन है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: पूरे यहूदिया में
  rationale: ἐν के साथ संबंधवाचक रूप स्थान अथवा क्षेत्र बताता है और ὅλῃ व्यापकता; यह सहज हिन्दी में दोनों अर्थ सुरक्षित रखता है।
- source_word: ἐπένθησαν
  choice: लोगों ने ... शोक मनाया
  rationale: πενθέω मृत व्यक्ति के लिए शोक करने को सूचित करता है। यूनानी में कर्ता निहित है; हिन्दी में स्वाभाविकता के लिए ‘लोगों ने’ जोड़ा गया है।
- source_word: ἐθρήνησεν
  choice: विलाप किया
  rationale: θρηνέω सामान्य शोक से अधिक विशिष्ट रूप से विलाप या शोकगीत व्यक्त करने का बोध देता है; इससे ἐπένθησαν का भेद बना रहता है।
- source_word: ὑπὲρ Ἰωσείου
  choice: योशिय्याह के लिए
  rationale: विलाप के प्रसंग में ὑπέρ का अर्थ किसी मृत व्यक्ति के लिए अथवा उसके विषय में विलाप करना है; ‘के लिए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἱ προκαθήμενοι
  choice: अगुवे
  rationale: यह शब्द प्रमुखता या अधिकार रखने वालों को दर्शाता है, पर कोई निश्चित पद निर्दिष्ट नहीं करता; ‘अगुवे’ अनावश्यक विशिष्टीकरण से बचता है।
- source_word: σὺν γυναιξὶν
  choice: और स्त्रियाँ
  rationale: σύν सहभागिता बताता है। संयुक्त कर्ता के रूप में ‘अगुवे और स्त्रियाँ’ स्पष्ट और स्वाभाविक है।
- source_word: ἐθρηνοῦσαν
  choice: विलाप करते रहे
  rationale: अपूर्ण भूतकाल निरंतर या प्रचलित क्रिया दर्शाता है; ‘करते रहे’ उसकी कालगत निरंतरता व्यक्त करता है।
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: आज के दिन तक
  rationale: यह कथावाचक के वर्तमान तक जारी रहने का प्रचलित मुहावरा है; हिन्दी में अर्थ स्पष्ट रहता है।
- source_word: ἐξεδόθη τοῦτο γενέσθαι ἀεί
  choice: यह सदा करते रहने के लिए ठहराया गया था
  rationale: ἐξεδόθη औपचारिक रूप से जारी या स्थापित किए जाने का संकेत दे सकता है, जबकि ἀεί निरंतरता दर्शाता है। यह अनुवाद किसी अनिर्दिष्ट कानूनी या उपासना-संबंधी बल को आरोपित किए बिना दोनों पहलू रखता है।
theological_decisions:
- issue: अंतिम वाक्य में स्मारक-विलाप की औपचारिकता और स्थायित्व
  choice: यह सदा करते रहने के लिए ठहराया गया था
  alternative: यह निरंतर किया जाए, ऐसा आदेश दिया गया था; इसे सदा की प्रथा के रूप में स्थापित किया गया था
  rationale: यूनानी पाठ किसी जारी किए गए या स्थापित स्थायी अभ्यास का संकेत देता है, पर यह नहीं बताता कि उसे किसने, किस अधिकार से या किस विधिक अथवा उपासना-संबंधी रूप में ठहराया। चुना हुआ पाठ इस अनिश्चितता को बनाए रखता है।
