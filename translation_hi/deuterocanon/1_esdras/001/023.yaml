base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/023.yaml
  text: And after all this activity of Josias[a], it happened that Pharaoh king of Egypt came to stir up war at Carchemish on the Euphrates[b]; and Josias went out against him.
translation:
  language: hi
  text: योसियास[b] के इस सारे कार्य के बाद ऐसा हुआ कि मिस्र का राजा फ़िरौन फरात नदी के किनारे करकमीश में युद्ध छेड़ने आया; और योसियास उसका सामना करने निकला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'स्वीट के यूनानी स्रोत में पद का अंत अधूरा है: वाक्यांश का शाब्दिक रूप ‘और वह … की ओर निकला’ पर रुक जाता है। ‘उसका सामना करने’ तत्कालीन कथासंदर्भ के आधार पर की गई न्यूनतम पूर्ति है।'
    reason: textual_variant
  - marker: b
    text: ‘योसियास’ उसी नाम का यूनानी रूप है जिसे सामान्यतः ‘योशियाह’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πᾶσαν τὴν πρᾶξιν ταύτην
  choice: इन सब कामों के बाद
  rationale: πρᾶξις यहाँ पहले वर्णित समूचे कार्य या आचरण की ओर संकेत करता है। ‘इन सब कामों’ से एकवचन सामूहिक अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: Ἰωσείου
  choice: योसियास
  rationale: यूनानी नामरूप को आधार बनाकर लिप्यंतरण किया गया है; अधिक परिचित ‘योशियाह’ को मुख्य पाठ में रखकर स्रोत-रूप का सामंजस्य नहीं किया गया।
- source_word: συνέβη
  choice: ऐसा हुआ
  rationale: यह कथात्मक सूत्र का सहज, आधुनिक और गरिमापूर्ण हिन्दी रूप है।
- source_word: Φαραὼ βασιλέα Αἰγύπτου
  choice: मिस्र का राजा फ़िरौन
  rationale: यूनानी पदक्रम और राजकीय पहचान दोनों स्पष्ट रहते हैं तथा हिन्दी में स्वाभाविक लगते हैं।
- source_word: πόλεμον ἐγείραι
  choice: युद्ध छेड़ने
  rationale: ἐγείρω के ‘उठाने/भड़काने’ के भाव को हिन्दी की स्वाभाविक अभिव्यक्ति ‘युद्ध छेड़ना’ व्यक्त करती है।
- source_word: ἐν Χαρκαμυς ἐπὶ τοῦ Εὐφράτου
  choice: फरात नदी के तट पर करकमीश में
  rationale: स्थान और नदी से उसका भौगोलिक संबंध स्पष्ट करते हुए यूनानी पूर्वसर्गों का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: καὶ ἐξῆλθεν εἰς
  choice: और योसियास उसका सामना करने निकला
  rationale: उपलब्ध यूनानी पाठ εἰς पर अधूरा है। तत्कालीन कथासंदर्भ के आधार पर केवल न्यूनतम अपेक्षित दिशा/विरोध का भाव पूरा किया गया है और इसे पाठ-टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: राजा के नाम के यूनानी स्रोत-रूप का संरक्षण
  choice: योसियास
  alternative: योशियाह
  rationale: यह कोई सिद्धान्तगत निर्णय नहीं, बल्कि स्रोत-पाठ के नामरूप को बनाए रखने का अनुवाद-संबंधी निर्णय है। परिचित रूप पाठ-टिप्पणी में दिया गया है।
- issue: अधूरे अंतिम यूनानी वाक्यांश की प्रस्तुति
  choice: उसका सामना करने निकला
  alternative: निकला…
  rationale: स्रोत-पाठ εἰς के बाद अधूरा है। कथा में फ़िरौन के विरुद्ध निकलने का संकेत प्रबल है, फिर भी पाठ की स्थिति छिपाई नहीं गई; न्यूनतम पूर्ति के साथ टिप्पणी दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। ‘युद्ध छेड़ने’ तथा ‘सामना करने निकला’ साधारण पाठक के लिए सहज हैं। स्रोत में वास्तविक पाठगत अपूर्णता को मुख्य वाक्य में न्यूनतम पूर्ति और स्पष्ट पाठ-टिप्पणी के साथ सुरक्षित रखा गया है।
