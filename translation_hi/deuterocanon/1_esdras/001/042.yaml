base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/042.yaml
  text: He reigned three months and ten days in Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: hi
  text: उसने यरूशलेम में तीन महीने और दस दिन राज्य किया, और उसने प्रभु के सामने बुरा काम किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεύει
  choice: राज्य किया
  rationale: यह क्रिया राजा के रूप में शासन करने को दर्शाती है। यूनानी का ऐतिहासिक वर्तमान हिन्दी कथन में स्वाभाविक भूतकाल से व्यक्त किया गया है।
- source_word: μῆνας τρεῖς καὶ ἡμέρας δέκα
  choice: तीन महीने और दस दिन
  rationale: यह शासनकाल की सीधी अवधि है; हिन्दी में ‘राज्य किया’ के साथ अलग से ‘तक’ या ‘के लिए’ जोड़ना आवश्यक नहीं है।
- source_word: ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यह उसके राज्य करने के स्थान या राजकीय केंद्र को बताने वाला स्थानवाचक पदबंध है।
- source_word: ἐποίησεν τὸ πονηρόν
  choice: वही किया जो बुरा था
  rationale: संज्ञीकृत नपुंसकलिंगी विशेषण τὸ πονηρόν नैतिक रूप से बुरी बात या कार्य को दर्शाता है। यह रूप यूनानी मुहावरे के बल को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἔναντι Κυρίου
  choice: प्रभु के सामने
  rationale: यह अभिव्यक्ति प्रभु की उपस्थिति और उनके नैतिक मूल्यांकन—दोनों का भाव रख सकती है। मुख्य पाठ में निकट रूप रखा गया है और ‘प्रभु की दृष्टि में’ को पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: Κυρίου का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक यूनानी पाठ में Κυρίου है। इसलिए यूनानी साक्ष्य का अनुसरण करते हुए ‘प्रभु’ रखा गया है; समानांतर इब्रानी परंपरा के आधार पर ‘यहोवा’ को मुख्य पाठ में आयात नहीं किया गया।
- issue: ἔναντι में निहित दैवी मूल्यांकन
  choice: प्रभु के सामने
  alternative: प्रभु की दृष्टि में
  rationale: ‘सामने’ मूल पद के उपस्थिति-संबंधी अर्थ को बनाए रखता है, जबकि ‘दृष्टि में’ नैतिक मूल्यांकन को अधिक स्पष्ट करता है। वास्तविक अर्थ-व्याप्ति को सुरक्षित रखने के लिए वैकल्पिक अनुवाद पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य-क्रम हिन्दी के स्वाभाविक प्रवाह के अनुसार है, और यूनानी ऐतिहासिक वर्तमान को कथात्मक भूतकाल में व्यक्त किया गया है।
