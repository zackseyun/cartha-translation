base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/033.yaml
  text: And he reigned over Israel and Jerusalem for three months[a]; and the king of Egypt deposed him from reigning in Jerusalem[b],
translation:
  language: hi
  text: और उसने इस्राएल और यरूशलेम पर तीन महीने तक राज्य किया[a]; फिर मिस्र के राजा ने उसे यरूशलेम में राज्य करने से हटा दिया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘इस्राएल और यरूशलेम में’ है; हिन्दी में राजकीय शासन के लिए ‘इस्राएल और यरूशलेम पर’ अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘हटा दिया’ अनूदित क्रिया का अर्थ अन्य संदर्भों में ‘बहाल कर दिया’ या ‘नियुक्त कर दिया’ भी हो सकता है, पर इस प्रसंग में मिस्र के राजा द्वारा उसे राजपद से हटाना अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: उसने ... राज्य किया
  rationale: क्रिया राजपद संभालने मात्र के बजाय राजा के रूप में शासन करने को व्यक्त करती है; हिन्दी में ‘राज्य किया’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐν Ἰσραὴλ καὶ Ἰερουσαλὴμ
  choice: इस्राएल और यरूशलेम पर
  rationale: यूनानी में शाब्दिक रूप से ‘में’ है, पर βασιλεύω के साथ यह शासन-क्षेत्र बताता है; हिन्दी में ‘पर राज्य किया’ स्वाभाविक है। यूनानी पाठ के अनुसार ‘इस्राएल और यरूशलेम’ बनाए रखा गया है।
- source_word: μῆνας τρεῖς
  choice: तीन महीने तक
  rationale: अवधि को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἀπεκατέστησεν
  choice: हटा दिया
  rationale: यद्यपि इस क्रिया का अर्थ अन्य संदर्भों में ‘बहाल करना’ हो सकता है, यहाँ कथा-संदर्भ और आश्रित infinitive राजपद से हटाए जाने का संकेत देते हैं।
- source_word: βασιλεὺς Αἰγύπτου
  choice: मिस्र के राजा
  rationale: उपाधि-वाक्यांश का मानक और पारदर्शी हिन्दी रूप।
- source_word: βασιλεύειν ἐν Ἰερουσαλήμ
  choice: यरूशलेम में राज्य करने से
  rationale: संदर्भगत निषेधात्मक अर्थ को ‘से हटा दिया’ के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀπεκατέστησεν के साथ βασιλεύειν का कथात्मक अर्थ
  choice: मिस्र के राजा ने उसे यरूशलेम में राज्य करने से हटा दिया
  alternative: मिस्र के राजा ने उसे यरूशलेम में राज्य करने के लिए बहाल/नियुक्त किया
  rationale: क्रिया कहीं-कहीं ‘बहाल करना’ या ‘नियुक्त करना’ दर्शाती है, पर तत्काल ऐतिहासिक कथा तीन महीने के शासन के बाद पदच्युति की ओर संकेत करती है। मुख्य पाठ संदर्भगत अर्थ देता है और पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य-विन्यास सरल, गरिमापूर्ण और कथात्मक है। ‘पदच्युत किया’ की अपेक्षा ‘राज्य करने से हटा दिया’ सामान्य पाठक के लिए अधिक पारदर्शी है और यूनानी रचना के निकट भी रहता है।
