base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/041.yaml
  text: And Jehoiakim his son reigned in his place; for when he was appointed[a], he was eight years old.
translation:
  language: hi
  text: और उसके स्थान पर उसका पुत्र यहोयाकीम राजा हुआ; क्योंकि जब उसे नियुक्त किया गया,[a] तब वह आठ वर्ष का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ के अनुसार, नियुक्त किए जाते समय वह ‘आठ वर्ष का था।’ अन्य बाइबलीय पाठ-परंपराओं में राजा की पहचान या राजपद ग्रहण करने की आयु भिन्न है; यहाँ 1 एस्द्रास के यूनानी पाठ को यथावत रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: राजा हुआ
  rationale: ऐतिहासिक उत्तराधिकार के प्रसंग में यह स्वाभाविक हिन्दी है और राजपद ग्रहण करने का भाव स्पष्ट करती है।
- source_word: ἀντ᾽ αὐτοῦ
  choice: उसके स्थान पर
  rationale: यह पद सिंहासन पर प्रतिस्थापन और उत्तराधिकार दोनों का भाव बनाए रखता है।
- source_word: Ἰωακεὶμ
  choice: यहोयाकीम
  rationale: यूनानी नाम का यह प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: ὁ υἱὸς αὐτοῦ
  choice: उसका पुत्र
  rationale: मूल के सीधे संबंध-सूचक कथन का स्वाभाविक हिन्दी अनुवाद।
- source_word: ἀνεδείχθη
  choice: उसे नियुक्त किया गया
  rationale: निष्क्रिय क्रिया औपचारिक पद-नियुक्ति या प्रतिष्ठापन बताती है; यह अनुवाद मूल की निष्क्रियता बचाता है और अनावश्यक विस्तार नहीं करता।
- source_word: ἐτῶν ὀκτώ
  choice: आठ वर्ष का था
  rationale: आयु बताने की सामान्य और सहज हिन्दी अभिव्यक्ति।
theological_decisions:
- issue: यहोयाकीम की राजपद-प्राप्ति की आयु अन्य बाइबलीय परंपराओं से कठिन या भिन्न प्रतीत होती है।
  choice: मुख्य पाठ में यूनानी का स्पष्ट कथन ‘आठ वर्ष का था’ रखा गया।
  alternative: अन्य परंपराओं के अनुसार राजा की पहचान या आयु बदलकर पाठ का सामंजस्य करना।
  rationale: इस पद के लिए यूनानी प्राथमिक स्रोत है और उसका आयु-विवरण स्पष्ट है; इसलिए दूसरी परंपराओं से सामंजस्य बैठाने के बजाय वास्तविक पाठांतर को पादटिप्पणी में पारदर्शी ढंग से बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ऐतिहासिक-वर्णनात्मक रूप। ‘राजा हुआ’ सामान्य पाठक के लिए ‘राज्य किया’ से अधिक स्वाभाविक रूप से उत्तराधिकार व्यक्त करता है; पादटिप्पणी पाठगत कठिनाई को बिना सामंजस्य किए स्पष्ट करती है।
