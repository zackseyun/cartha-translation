base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/018.yaml
  text: And no Passover like this had been held in Israel since the days of Samuel the prophet.
translation:
  language: hi
  text: और इस तरह का फसह इस्राएल में शमूएल नबी के दिनों से नहीं मनाया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: मनाया गया था
  rationale: ἄγω का कर्मवाच्य यहाँ पर्व के आयोजन या पालन के लिए मुहावरेदार है। हिंदी में ‘फसह मनाया गया’ स्वाभाविक है और धार्मिक पर्व के सामुदायिक पालन का भाव स्पष्ट करता है।
- source_word: τὸ πάσχα
  choice: फसह
  rationale: πάσχα के लिए प्रचलित बाइबिलीय हिंदी शब्द ‘फसह’ रखा गया है; संदर्भ से पर्व का अर्थ स्पष्ट है।
- source_word: τοιοῦτο
  choice: इस तरह का
  rationale: यह पद वर्तमान वर्णित फसह से तुलना करता है। ‘इस तरह का’ स्वाभाविक आधुनिक हिंदी में तुलनात्मक अर्थ बनाए रखता है।
- source_word: ἐν τῷ Ἰσραήλ
  choice: इस्राएल में
  rationale: यह वाक्यांश उस समुदाय अथवा क्षेत्र को सूचित करता है जहाँ ऐसा फसह नहीं मनाया गया था; ‘इस्राएल में’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀπὸ τῶν χρόνων
  choice: के दिनों से
  rationale: शाब्दिक ‘समयों से’ की अपेक्षा ऐतिहासिक वर्णन में ‘के दिनों से’ सहज है और ἀπό का आरंभ-बिंदु वाला कालिक अर्थ सुरक्षित रखता है।
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: शमूएल नबी
  rationale: यूनानी पाठ स्पष्टतः शमूएल को ‘नबी’ कहता है। ‘शमूएल नबी’ आधुनिक हिंदी में स्वाभाविक और मूल के प्रति निष्ठावान है।
theological_decisions:
- issue: इब्रानी समानांतर पाठ के संबंध में ऐतिहासिक तुलना
  choice: शमूएल नबी के दिनों से
  alternative: नबी शमूएल के समय से
  rationale: मुख्य यूनानी स्रोत शमूएल का नाम लेकर उसके दिनों से तुलना करता है। दिया गया मसोराई समानांतर इस पद से सटीक रूप से मेल नहीं खाता, इसलिए उसने यूनानी पाठ की स्पष्ट तुलना को नहीं बदला।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फसह’ बाइबिलीय हिंदी में स्थापित पद है; ‘मनाया गया था’ पर्व के आयोजन के लिए स्वाभाविक कर्मवाच्य है।
