  yaml_path: translation/deuterocanon/1_esdras/001/035.yaml
  text: And the king of Egypt made Joakim his brother king over Judea and Jerusalem[a].
translation:
  language: hi
  text: और मिस्र के राजा ने उसके भाई योआकीम को यहूदिया और यरूशलेम का राजा नियुक्त किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ नाम ‘योआकीम’ है; समानांतर इब्रानी परंपरा में यह व्यक्ति सामान्यतः ‘यहोयाकीम’ कहलाता है।
    reason: नाम के यूनानी रूप और प्रचलित इब्रानी रूप के बीच पाठ-परंपरागत अंतर स्पष्ट करना।
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: नियुक्त किया
  rationale: राजकीय संदर्भ में यह क्रिया किसी को पद पर स्थापित करने का अर्थ देती है। ‘राजा नियुक्त किया’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया का कारक भाव बनाए रखता है।
- source_word: ὁ βασιλεὺς Αἰγύπτου
  choice: मिस्र के राजा
  rationale: यूनानी संबंधकारक पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: Ἰωακεὶμ
  choice: योआकीम
  rationale: नाम को प्राथमिक यूनानी पाठ के रूप के निकट रखा गया है; इसे इब्रानी परंपरा के ‘यहोयाकीम’ से चुपचाप एकरूप नहीं किया गया।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: उसके भाई
  rationale: मूल पाठ के संबंधवाचक सर्वनाम और निकट पारिवारिक संबंध को सीधे सुरक्षित रखता है; संदर्भ में ‘उसके’ का संकेत पूर्वोक्त व्यक्ति की ओर है।
- source_word: βασιλέα
  choice: राजा
  rationale: यह संज्ञा स्पष्ट रूप से राजपद बताती है; ‘शासक’ कहने से पद की विशिष्टता घटती।
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: यहूदिया और यरूशलेम का
  rationale: नियुक्त राजसत्ता के क्षेत्र को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है। एकवचन ‘का’ संयुक्त पदबंध को राजा के अधिकार-क्षेत्र के रूप में जोड़ता है।
