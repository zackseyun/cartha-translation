  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘नियुक्त किया’ सामान्य पाठक के लिए स्पष्ट है और राजकीय स्थापना का भाव देता है। मुख्य पाठ में यूनानी नामरूप सुरक्षित है तथा वैकल्पिक इब्रानी पहचान पादटिप्पणी में दी गई है।
