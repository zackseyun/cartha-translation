base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/019.yaml
  text: And all the kings of Israel had not kept such a Passover as Josias kept[c][b][a], and the priests and the Levites and the Judeans and all Israel who were found dwelling in Jerusalem.
translation:
  language: hi
  text: और इस्राएल के किसी भी राजा ने वैसा फसह नहीं मनाया था जैसा योशियाह[a] ने, तथा यरूशलेम में पाए गए याजकों, लेवियों, यहूदावासियों[b] और समस्त इस्राएल ने मनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में नाम का रूप ‘योसियास’ है; इब्रानी समानांतर में यही राजा योशियाह कहलाता है।
    reason: cross_reference
  - marker: b
    text: ‘यहूदावासी’ का अनुवाद ‘यहूदी’ भी किया जा सकता है; यहाँ शब्द का आशय संभवतः यहूदा या यहूदिया से जुड़े लोगों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον πάσχα
  choice: फसह मनाया
  rationale: ἄγω का मूल अर्थ ‘ले जाना/लाना’ है, पर πάσχα के साथ यह फसह के अनुष्ठान को मनाने का मुहावरा है। ‘फसह मनाया’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: τοιοῦτον οἷον
  choice: वैसा ... जैसा
  rationale: यह सहसंबंधी तुलना यूनानी के ‘ऐसा...जैसा’ बल को सहज हिन्दी में बनाए रखती है।
- source_word: Ἰωσείας
  choice: योशियाह
  rationale: यह यूनानी Ἰωσείας द्वारा निर्दिष्ट उसी प्रसिद्ध राजा का हिन्दी में प्रचलित बाइबलीय नाम है; पादटिप्पणी यूनानी नाम-रूप को स्पष्ट करती है।
- source_word: Ἰουδαῖοι
  choice: यहूदावासी
  rationale: ऐतिहासिक प्रसंग में यह शब्द यहूदा/यहूदिया के लोगों का जातीय-भौगोलिक बोध देता है; ‘यहूदावासी’ उस अर्थ को बाद के केवल धार्मिक अर्थ तक सीमित नहीं करता।
- source_word: πᾶς Ἰσραὴλ
  choice: समस्त इस्राएल
  rationale: सामूहिक अभिव्यक्ति को सीधे और व्यापक रूप में सुरक्षित रखा गया है।
- source_word: οἱ εὑρεθέντες
  choice: जो ... पाए गए थे
  rationale: यह कृदंत के शाब्दिक अर्थ को बनाए रखता है, जबकि प्रसंग में उपस्थित या उपलब्ध निवासियों का संकेत देता है।
- source_word: ἐν τῇ κατοικήσει αὐτῶν ἐν Ἰερουσαλήμ
  choice: यरूशलेम में बसे हुए
  rationale: यूनानी वाक्यांश कुछ असहज है; यह अनुवाद उसके निवास-संबंधी अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘इस्राएल के सभी राजाओं’ का दायरा
  choice: व्यापक ऐतिहासिक कथन को यथावत रखा गया है।
  alternative: इसे केवल यहूदा के राजाओं या पहले के राजाओं तक सीमित करना।
  rationale: यूनानी पाठ स्पष्टतः ‘इस्राएल के सभी राजा’ कहता है; ऐतिहासिक कठिनाई को सामंजस्य बैठाकर चुपचाप संकीर्ण करना उचित नहीं है।
- issue: क्रिया का संयुक्त कर्ता
  choice: दूसरे समूह के साथ ‘ने भी’ जोड़कर उन्हें योशियाह के साथ फसह मनाने वाले कर्ताओं के रूप में व्यक्त किया गया है।
  alternative: साधारण ‘और’ को इतना शाब्दिक रखना कि हिन्दी में वे अधूरे या असंबद्ध लगें।
  rationale: यूनानी में एक ही ἤγαγεν के साथ योशियाह और समन्वित समूह आते हैं; हिन्दी में ‘ने भी’ उस व्याकरणिक संबंध को स्पष्ट करता है, बिना नया धार्मिक दावा जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फसह’ और ‘याजक’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं। यूनानी की समन्वित वाक्य-रचना को हिन्दी में स्पष्ट करने के लिए ‘ने भी’ जोड़ा गया है; व्यापक ‘इस्राएल’ कथन को संकीर्ण नहीं किया गया।
