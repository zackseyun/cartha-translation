base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/046.yaml
  text: And though he had sworn by the name of the Lord to King Nebuchadnezzar[a], he broke his oath and rebelled; and, stiffening his neck and his heart[c][b], he transgressed the laws of the Lord God of Israel.
translation:
  language: hi
  text: राजा नबूकदनेस्सर के प्रति प्रभु के नाम की शपथ खाकर उसने अपनी शपथ तोड़ी और विद्रोह किया।[a] अपनी गर्दन और हृदय को कठोर करके उसने इस्राएल के प्रभु परमेश्वर की विधियों का उल्लंघन किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी का अधिक शाब्दिक अर्थ संभवतः “राजा नबूकदनेस्सर द्वारा शपथ दिलाया गया” है। यहाँ अभिप्राय राजा के प्रति निष्ठा की शपथ है।
    reason: lexical_alternative
  - marker: b
    text: “विधियों” का अनुवाद “नियमों” या “अध्यादेशों” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρκισθεὶς ἀπὸ τοῦ βασιλέως Ναβουχοδονόσορ
  choice: राजा नबूकदनेस्सर के सामने ... शपथ खाई थी
  rationale: यूनानी में निष्क्रिय कृदंत और ἀπό का प्रयोग असामान्य है; भाव यह है कि राजा ने उसे निष्ठा की शपथ दिलाई अथवा उसने राजा के संबंध में शपथ ली। यह हिंदी वाक्य स्वाभाविक रहते हुए उस संबंध को व्यक्त करता है, पर शपथ किसने दिलाई इसे अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τῷ ὀνόματι τοῦ κυρίου
  choice: प्रभु के नाम की शपथ
  rationale: यह शपथ में प्रभु के नाम के गंभीर आह्वान को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐφιορκήσας
  choice: अपनी शपथ तोड़ी
  rationale: क्रिया पहले ली गई शपथ के उल्लंघन को दर्शाती है; यह 'झूठी शपथ खाई' की अपेक्षा प्रसंग में अधिक स्पष्ट है।
- source_word: ἀπέστη
  choice: विद्रोह किया
  rationale: राजकीय और राजनीतिक प्रसंग में इसका अर्थ अधीनता छोड़ना या विद्रोह करना है; कर्म यूनानी में स्पष्ट नहीं किया गया है।
- source_word: σκληρύνας αὐτοῦ τὸν τράχηλον καὶ τὴν καρδίαν αὐτοῦ
  choice: अपनी गर्दन और अपना हृदय कठोर करके
  rationale: मूल रूपक और भीतरी हठ, दोनों को यथासंभव निकटता से सुरक्षित रखा गया है।
- source_word: παρέβη
  choice: उल्लंघन किया
  rationale: यह व्यवस्था-संबंधी सीमा तोड़ने का नैतिक और कानूनी भाव स्पष्ट तथा वर्तमान हिंदी में व्यक्त करता है।
- source_word: τὰ νόμιμα
  choice: विधियों
  rationale: यह स्थापित दैवी नियमों या विधान का भाव देता है और 'कानूनों' की तुलना में इस धार्मिक-साहित्यिक प्रसंग में अधिक स्वाभाविक है।
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: इस्राएल के प्रभु परमेश्वर
  rationale: यह यूनानी दैवी उपाधि के दोनों अंग और इस्राएल से उसके संबंध को संक्षिप्त, प्रतिष्ठित हिंदी में रखता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριος है; 'प्रभु' उसी दैवी उपाधि को प्रस्तुत करता है और मुख्य पाठ में अंतर्निहित इब्रानी रूप को आयात नहीं करता।
- issue: विद्रोह का लक्ष्य
  choice: 'कर्म को अव्यक्त रखा गया: ''विद्रोह किया'''
  alternative: राजा नबूकदनेस्सर के विरुद्ध विद्रोह किया
  rationale: राजनीतिक प्रसंग से नबूकदनेस्सर संभावित लक्ष्य है, पर यूनानी क्रिया का कर्म स्पष्ट रूप से नहीं दिया गया; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: νόμιμα की व्यापकता
  choice: विधियों
  alternative: नियमों / अध्यादेशों
  rationale: शब्द स्थापित दैवी विधानों को दर्शाता है; किसी विशेष आधुनिक कानूनी या सांप्रदायिक श्रेणी में इसे सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, किंतु बाइबलीय गरिमा बनाए रखती है। 'गर्दन और हृदय कठोर करना' मूल रूपक को सुरक्षित रखता है। छोटे वाक्य सामान्य पाठक के लिए घटनाक्रम स्पष्ट करते हैं।
