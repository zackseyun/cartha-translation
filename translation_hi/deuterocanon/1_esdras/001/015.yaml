base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/015.yaml
  text: And the gatekeepers were at each gate; no one could leave his own appointed duty[a], for their brothers the Levites had prepared for them.
translation:
  language: hi
  text: और द्वारपाल हर एक फाटक पर तैनात थे। उनमें से कोई भी अपनी नियुक्त सेवा[a] छोड़कर नहीं जा सकता था, क्योंकि उनके भाई लेवियों ने उनके लिए तैयारी कर दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “लेवियों ने अपने लिए तैयारी की थी।” प्रसंग से सम्भवतः आशय यह है कि उन्होंने द्वारपालों के लिए आवश्यक तैयारी की, ताकि वे अपनी नियुक्त सेवा पर बने रहें।
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρωροὶ
  choice: द्वारपाल
  rationale: मन्दिर के फाटकों की रखवाली करने वालों के लिए यह स्वाभाविक और प्रचलित हिन्दी पद है।
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: हर एक फाटक पर
  rationale: यह द्वारपालों के अलग-अलग नियुक्त स्थानों का वितरणात्मक भाव स्पष्ट करता है।
- source_word: οὐκ ἔστιν παραβῆναι
  choice: छोड़कर नहीं जा सकता था
  rationale: शाब्दिक भाव ‘एक ओर हटना/लाँघना’ है; सेवा के प्रसंग में इसका आशय अपने नियुक्त कार्य-स्थान को न छोड़ पाना है।
- source_word: ἕκαστον τὴν ἑαυτοῦ ἐφημερίαν
  choice: अपनी ठहराई हुई सेवा
  rationale: ἐφημερία नियत अवधि या क्रम की आधिकारिक सेवा को दर्शाता है; यह पद उस धार्मिक सेवा-व्यवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ γὰρ ἀδελφοὶ αὐτῶν οἱ Λευεῖται
  choice: क्योंकि उनके भाई लेवियों ने
  rationale: 'अपोज़िशन का भाव सुरक्षित है: उनके ‘भाई’ लेवी समुदाय के सदस्य थे।'
- source_word: ἡτοίμασαν ἑαυτοῖς
  choice: उनके लिए तैयारी कर दी थी
  rationale: यूनानी में सर्वनाम शाब्दिक रूप से ‘अपने लिए’ है, पर वाक्य का तर्क संकेत करता है कि लेवियों की तैयारी के कारण द्वारपाल अपने स्थानों पर बने रह सके; वास्तविक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ἡτοίμασαν ἑαυτοῖς में आत्मवाचक सर्वनाम
  choice: प्रसंगानुसार लेवियों ने द्वारपालों के लिए आवश्यक तैयारी की
  alternative: लेवियों ने अपने लिए तैयारी की
  rationale: कठोर आत्मवाचक अनुवाद यूनानी व्याकरण के अधिक निकट है, पर द्वारपालों के अपनी सेवा न छोड़ने का कारण अस्पष्ट कर देता है। मुख्य पाठ में प्रसंगगत अर्थ दिया गया है और वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘द्वारपाल’, ‘फाटक’ और ‘ठहराई हुई सेवा’ साधारण पाठकों के लिए बोधगम्य रहते हुए मन्दिर-सेवा के औपचारिक प्रसंग को बनाए रखते हैं।
