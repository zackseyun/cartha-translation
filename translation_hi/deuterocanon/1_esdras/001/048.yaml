  yaml_path: translation/deuterocanon/1_esdras/001/048.yaml
  text: And the God of their fathers sent by his angel to visit their people and to call them back[b][a], because he had compassion on them and on his dwelling place.
translation:
  language: hi
  text: और उनके पूर्वजों के राजा, उनके पूर्वजों के परमेश्वर ने अपने दूत[a] को उनकी प्रजा की सुधि लेने और उन्हें वापस बुलाने के लिए भेजा[b], क्योंकि वह उन पर और अपने निवास-स्थान पर दया करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दूत’ का अर्थ यहाँ ‘स्वर्गदूत’ या ‘संदेशवाहक’ हो सकता है; यूनानी ἄγγελος दोनों अर्थों में प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: आरंभिक यूनानी शब्दावली असामान्य है; उसका शाब्दिक रूप है, ‘उनके पूर्वजों के राजा, उनके पूर्वजों के परमेश्वर।’ अनुवाद ने पाठ को चुपचाप सरल करने के बजाय दोनों उपाधियाँ सुरक्षित रखी हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यूनानी क्रिया के सीधे कथात्मक अर्थ को रखा गया है। मूल में भेजे गए व्यक्ति या वस्तु का स्पष्ट कर्म नहीं है; हिन्दी में भी इस असामान्यता को अनावश्यक रूप से भरकर अर्थ निश्चित नहीं किया गया।
- source_word: ὁ βασιλεὺς τῶν πατέρων αὐτῶν
  choice: उनके पूर्वजों के राजा
  rationale: प्राप्त यूनानी पाठ के असामान्य, पर समझ में आने वाले ईश्वरीय संबोधन को हटाने या सुधारने के बजाय सुरक्षित रखा गया है।
- source_word: ὁ θεὸς τῶν πατέρων αὐτῶν
  choice: उनके पूर्वजों के परमेश्वर
  rationale: यह बाइबिल का परिचित वाचा-संबंधी पदबंध है; ‘पूर्वजों’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐπισκέψασθαι
  choice: सुधि लेने
  rationale: यहाँ क्रिया केवल मिलने नहीं, बल्कि चिंता और कृपापूर्ण हस्तक्षेप के भाव में है; ‘सुधि लेने’ उस व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν λαὸν αὐτῶν
  choice: उनकी प्रजा
  rationale: यूनानी के बहुवचन संबंधवाचक ‘उनकी’ को बनाए रखा गया है। ‘प्रजा’ राजा के शीर्षक के साथ भी स्वाभाविक बैठती है और सामूहिक जन का अर्थ देती है।
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: अपने दूत के द्वारा
  rationale: ἄγγελος का अर्थ स्वर्गदूत या संदेशवाहक दोनों हो सकता है। मुख्य पाठ में व्यापक हिन्दी शब्द ‘दूत’ रखा गया है और दोनों संभावनाएँ पाद-टिप्पणी में स्पष्ट की गई हैं।
- source_word: μετακαλέσαι αὐτούς
  choice: उन्हें वापस बुलाने
  rationale: संयुक्त क्रिया में बुलाने के साथ लौटाकर बुलाने का भाव संभव है; ‘वापस बुलाने’ पुनर्स्थापना के प्रसंग को व्यक्त करता है, पर लौटने की प्रतिक्रिया को निश्चित नहीं करता।
- source_word: καθὸ ἐφείδετο αὐτῶν
  choice: क्योंकि उसे उन पर ... दया आती थी
  rationale: φείδομαι में बख्शने और दया करने दोनों का भाव हो सकता है। यहाँ परमेश्वर की कृपापूर्ण पहल का कारण बताया गया है, इसलिए यह सहज हिन्दी रूप उपयुक्त है।
- source_word: τοῦ σκηνώματος αὐτοῦ
  choice: अपने निवास-स्थान
  rationale: σκῆνωμα का मूल अर्थ निवास या रहने का स्थान है। यह मंदिर को परमेश्वर के पवित्र निवास के रूप में संकेत करता है, बिना उसे विशेष रूप से ‘तम्बू’ ठहराए।
