base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/044.yaml
  text: And he appointed Zedekiah king of Judea and Jerusalem; Zedekiah was twenty-one years old[a], and he reigned eleven years.
translation:
  language: hi
  text: और उसने सिदकिय्याह को यहूदिया और यरूशलेम का राजा[a] नियुक्त किया। सिदकिय्याह इक्कीस वर्ष का था और उसने ग्यारह वर्ष तक राज्य किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में “यहूदिया और यरूशलेम” है। इस प्रसंग की समानांतर इब्रानी परंपरा में सामान्यतः “यहूदा और यरूशलेम” मिलता है। मुख्य पाठ इब्रानी समानांतर से सामंजस्य बैठाने के बजाय 1 एस्द्रास के यूनानी स्रोत का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: नियुक्त किया
  rationale: राजकीय पद पर औपचारिक रूप से स्थापित करने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Σεδεκίαν
  choice: सिदकिय्याह
  rationale: राजा के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: βασιλέα τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: यहूदिया और यरूशलेम का राजा
  rationale: यूनानी संबंधकारक संरचना का सीधा और स्वाभाविक हिन्दी रूप; ‘यहूदिया’ रखकर प्राथमिक यूनानी पाठ का अनुसरण किया गया है।
- source_word: ὄντα ἐτῶν εἴκοσι ἑνός
  choice: इक्कीस वर्ष का था
  rationale: आयु बताने वाले यूनानी वाक्यांश का सामान्य हिन्दी रूप।
- source_word: βασιλεύει δὲ ἔτη ἕνδεκα
  choice: और उसने ग्यारह वर्ष तक राज्य किया
  rationale: राज्यकाल की अवधि को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
