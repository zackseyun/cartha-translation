base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/037.yaml
  text: Jehoiakim was twenty-five years old when he became king of Judea and Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: hi
  text: यहोयाकीम पच्चीस वर्ष का था जब वह यहूदिया और यरूशलेम[a] का राजा बना। उसने वह किया जो प्रभु की दृष्टि में बुरा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा और यरूशलेम।” यूनानी पाठ में “यहूदिया और यरूशलेम” है, जबकि समानांतर इब्रानी परंपरा में सामान्यतः “यहूदा और यरूशलेम” कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐτῶν δὲ ἦν εἴκοσι πέντε
  choice: पच्चीस वर्ष का था
  rationale: यह यूनानी में आयु बताने का सामान्य सूत्र है; यह रूप आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से निकट है।
- source_word: Ἰωακεὶμ
  choice: यहोयाकीम
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप अपनाया गया है; समानांतर इब्रानी परंपरा भी इसी व्यक्ति की पहचान की पुष्टि करती है।
- source_word: ὅτε ἐβασίλευσεν
  choice: जब वह ... का राजा बना
  rationale: यहाँ एओरिस्ट आयु के साथ राजसिंहासन पर बैठने का समय बताता है, न कि पूरे शासनकाल को; इसलिए ‘राजा बना’ स्पष्ट और स्वाभाविक है।
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: यहूदिया और यरूशलेम का
  rationale: मुख्य यूनानी पाठ में Ἰουδαίας है, इसलिए ‘यहूदिया’ रखा गया है। राजत्व के साथ संबंधसूचक ‘का’ हिन्दी में सहज है।
- source_word: ἐποίησεν τὸ πονηρὸν
  choice: उसने वह किया जो ... बुरा था
  rationale: यह अनुवाद बाइबलीय नैतिक मुहावरे को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐνώπιον Κυρίου
  choice: प्रभु की दृष्टि में
  rationale: ἐνώπιον का अर्थ ‘सामने/दृष्टि में’ है; हिन्दी में ‘प्रभु की दृष्टि में’ इस प्रसंग का स्वाभाविक और प्रतिष्ठित रूप है।
theological_decisions:
- issue: Κυρίου का अनुवाद
  choice: प्रभु
  alternative: याहवे / यहोवा
  rationale: प्राथमिक स्रोत यूनानी है और उसमें κύριος है; इसलिए किसी अनुमानित इब्रानी दिव्य नाम को मुख्य पाठ में पुनःस्थापित किए बिना ‘प्रभु’ रखा गया है।
- issue: भौगोलिक-राजनीतिक नाम Ἰουδαίας
  choice: यहूदिया
  alternative: यहूदा
  rationale: यूनानी स्रोत का सीधा संकेत ‘यहूदिया’ की ओर है। कथा की इब्रानी समानांतर परंपरा के कारण ‘यहूदा’ को पादटिप्पणी में वास्तविक विकल्प के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। वाक्य को हिन्दी की स्वाभाविक लय के लिए दो वाक्यों में रखा गया है; मूल अर्थ और क्रम सुरक्षित हैं।
