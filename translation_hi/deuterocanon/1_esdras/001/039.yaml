base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/039.yaml
  text: And Nebuchadnezzar took some of the sacred vessels of the Lord and carried them away and deposited them in his temple in Babylon[a].
translation:
  language: hi
  text: और नबूकदनेस्सर ने प्रभु के पवित्र पात्रों में से कुछ लेकर उन्हें उठा ले गया और बाबेल में अपने मंदिर में रख दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “प्रभु के पवित्र पात्रों में से।” यूनानी वाक्यांश संभवतः अंशवाचक है—अर्थात उसने सारे नहीं, बल्कि कुछ पात्र लिए।
    reason: ἀπό के साथ संबंधकारक की शाब्दिक बनावट और संभावित अंशवाचक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀπὸ τῶν ἱερῶν σκευῶν
  choice: पवित्र पात्रों में से कुछ
  rationale: ἀπό के साथ संबंधकारक यहाँ समूचे पात्रों के बजाय उनमें से कुछ लिए जाने का अंशवाचक भाव दे सकता है। ‘पवित्र पात्र’ उपासना में समर्पित वस्तुओं के अर्थ को स्वाभाविक बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: यूनानी κύριος का सामान्य और गरिमापूर्ण हिन्दी रूप ‘प्रभु’ है; संबंधकारक इन पात्रों का प्रभु से संबंध दर्शाता है।
- source_word: λαβὼν
  choice: लेकर
  rationale: कृदंत को हिन्दी में पूर्वकालिक क्रिया ‘लेकर’ के रूप में रखना क्रियाओं का क्रम स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπενέγκας
  choice: उन्हें वहाँ से उठा ले गया
  rationale: क्रिया वस्तुओं को उनके स्थान से हटाकर ले जाने का भाव रखती है; ‘वहाँ से उठा ले गया’ इस निष्कासन और परिवहन दोनों को स्पष्ट करता है।
- source_word: ἀπηνείσατο
  choice: रख दिया
  rationale: संदर्भ में पकड़े गए पात्रों को दूसरे मंदिर में स्थापित या जमा करने का अर्थ है। ‘रख दिया’ आधुनिक हिन्दी में स्पष्ट है और मूल से अधिक विशिष्ट भंडारण-व्यवस्था नहीं जोड़ता।
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: अपने मंदिर में
  rationale: αὐτοῦ नबूकदनेस्सर की ओर संकेत करता है और ναός के लिए ‘मंदिर’ संदर्भानुकूल सामान्य शब्द है।
- source_word: ἐν Βαβυλῶνι
  choice: बाबेल में
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप ‘बाबेल’ रखा गया है।
theological_decisions:
- issue: यूनानी κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्राथमिक स्रोत यूनानी है और उसमें κύριος है; इसलिए हिब्रू परमेश्वर-नाम को अनुमान से पाठ में लाने के बजाय ‘प्रभु’ रखा गया है।
- issue: पात्रों की मात्रा
  choice: पवित्र पात्रों में से कुछ
  alternative: पवित्र पात्रों में से
  rationale: ἀπό के साथ संबंधकारक का अंशवाचक अर्थ संभव और संदर्भानुकूल है, पर शाब्दिक संरचना मात्रा को पूर्णतः स्पष्ट नहीं करती; इसलिए मुख्य पाठ में स्वाभाविक अर्थ और पादटिप्पणी में वास्तविक अस्पष्टता दोनों रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पवित्र पात्र’, ‘प्रभु’ और ‘मंदिर’ सामान्य पाठक के लिए स्पष्ट रहते हुए धार्मिक संदर्भ बनाए रखते हैं; वाक्य में यूनानी कृदंतों का क्रम भी सुरक्षित है।
