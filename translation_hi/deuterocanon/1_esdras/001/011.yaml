base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/011.yaml
  text: And they roasted the Passover with fire[a], as was proper, and they boiled the sacrifices in the bronze pots and kettles with a pleasing aroma[b], and brought them to all the people.
translation:
  language: hi
  text: और उन्होंने फसह को आग पर भूना, जैसा उचित था। फिर उन्होंने बलियों को काँसे के बरतनों और कड़ाहों में सुखद सुगंध के साथ[a] उबाला और उन्हें प्रजा के सभी लोगों तक पहुँचाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सुखद सुगंध’ का यूनानी पद शाब्दिक रूप से सुगंध या मधुर गंध को सूचित करता है; बलिदान के प्रसंग में यह अर्पण की सुखद सुगंध की अनुगूँज भी जगा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, ‘प्रजा में से सभी के पास’; संभव है कि इससे याजकों और लेवियों से अलग सामान्य लोग अभिप्रेत हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤπτησαν
  choice: भूना
  rationale: यह क्रिया आग पर भूनने का विशिष्ट अर्थ देती है; इससे दूसरी क्रिया ἥψησαν, ‘उबाला’, के साथ स्रोत में मौजूद भेद बना रहता है।
- source_word: τὸ πάσχα
  choice: फसह
  rationale: यूनानी पद फसह के पर्व, भोजन या बलि-पशु का संकेत दे सकता है। केवल ‘फसह’ कहने से यह वास्तविक संदर्भगत व्यापकता बनी रहती है।
- source_word: ἐν πυρί
  choice: आग पर
  rationale: हिन्दी में भूनने की विधि के लिए यह स्वाभाविक अभिव्यक्ति है और आग द्वारा पकाए जाने का अर्थ स्पष्ट रखती है।
- source_word: ὡς καθήκει
  choice: जैसा उचित था
  rationale: यह अनुष्ठानिक रूप से उचित या अपेक्षित कार्य का संकेत देता है, पर उसे स्पष्ट रूप से व्यवस्था, रीति या राजाज्ञा तक सीमित नहीं करता।
- source_word: τὰς θυσίας
  choice: बलियों
  rationale: यह व्यापक बलिदान-संबंधी पद का सीधा और प्रचलित हिन्दी रूप है; इसे विशेष बलि-अंशों तक सीमित नहीं किया गया।
- source_word: ἥψησαν
  choice: उबाला
  rationale: बरतनों और कड़ाहों के उल्लेख के साथ यह क्रिया तरल में उबालकर पकाने का स्वाभाविक अर्थ देती है और ‘भूना’ से भेद बनाए रखती है।
- source_word: ἐν τοῖς χαλκίοις καὶ λέβησιν
  choice: काँसे के बरतनों और कड़ाहों में
  rationale: हिन्दी में दो प्रकार के पात्रों का भेद स्पष्ट रहता है; χαλκίοις को सामान्य काँसे के बरतन और λέβησιν को बड़े पकाने वाले कड़ाह के रूप में व्यक्त किया गया है।
- source_word: μετʼ εὐωδίας
  choice: मनभावनी सुगंध के साथ
  rationale: εὐωδία का मूल सुगंध या मधुर गंध से जुड़ा है। यह रूप sensory अर्थ को बनाए रखता है और बलिदान की ‘सुगंध’ वाली संभावित अनुगूँज को मिटाता नहीं।
- source_word: ἀπήνεγκαν
  choice: ले गए
  rationale: क्रिया तैयार वस्तुओं को लोगों तक पहुँचाने का अर्थ देती है। ‘बाँट दिया’ संदर्भ में संभव है, पर यूनानी क्रिया से अधिक स्पष्ट वितरण जोड़ देता।
- source_word: πᾶσι τοῖς ἐκ τοῦ λαοῦ
  choice: प्रजा के सभी लोगों के पास
  rationale: यह स्वाभाविक हिन्दी है। यूनानी का अधिक शाब्दिक अर्थ ‘प्रजा में से सभी के पास’ है और संभवतः याजकों तथा लेवियों से अलग सामान्य लोगों को सूचित करता है; यह सूक्ष्मता पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: फसह और अन्य बलियों को पकाने की अलग विधियाँ
  choice: फसह के लिए ‘भूना’ और अन्य बलियों के लिए ‘उबाला’ रखा गया है।
  alternative: दोनों क्रियाओं का सामान्य अनुवाद ‘पकाया’ करना।
  rationale: यूनानी पाठ दो अलग क्रियाएँ प्रयोग करता है, जो अलग अनुष्ठानिक तैयारियों को दर्शा सकती हैं। इस भेद को बनाए रखना स्रोत की विधिगत सूक्ष्मता की रक्षा करता है।
- issue: ‘प्रजा’ में सम्मिलित लोगों का दायरा
  choice: मुख्य पाठ में ‘प्रजा के सभी लोगों’ रखा गया है।
  alternative: ‘सभी सामान्य लोगों’ या ‘प्रजा में से सभी’ कहना।
  rationale: यूनानी वाक्यांश संभवतः अनुष्ठान कराने वाले याजकों और लेवियों के विपरीत सामान्य जनों की ओर संकेत करता है, पर यह भेद पूर्णतः स्पष्ट नहीं। इसलिए सहज मुख्य पाठ के साथ अधिक विशिष्ट संभावना पादटिप्पणी में दी गई है।
- issue: εὐωδία की बलिदान-संबंधी अनुगूँज
  choice: ‘मनभावनी सुगंध’ द्वारा गंध का प्रत्यक्ष अर्थ रखा गया है।
  alternative: इसे ‘अच्छी तरह’ या ‘विधिपूर्वक’ जैसे सामान्य क्रियाविशेषण के रूप में प्रस्तुत करना।
  rationale: मूल पद का शाब्दिक केंद्र सुगंध है और बलिदान के संदर्भ में वह अर्पण की सुखद सुगंध की अनुगूँज जगा सकता है। अनुवाद इस संभावना को न तो हटाता है, न स्पष्ट ईश्वरीय स्वीकृति जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य अपनाया गया है। ‘फसह’, ‘बलि’ और ‘लेवी’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं। वाक्य को पठनीय बनाने के लिए यूनानी के लगातार संयोजनों को दो वाक्यों में बाँटा गया है, जबकि घटनाक्रम और क्रियाओं का भेद सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद रखे गए हैं।
