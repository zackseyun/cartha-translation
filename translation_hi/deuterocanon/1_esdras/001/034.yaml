  text: And he fined the nation one hundred talents of silver and one talent of gold[a].
translation:
  language: hi
  text: और उसने राष्ट्र पर चाँदी के एक सौ तोड़े और सोने के एक तोड़े का आर्थिक दंड लगाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों से दंड के रूप में यह धन वसूल किया।” यूनानी क्रिया का अर्थ हानि पहुँचाना या जुर्माना वसूल करना हो सकता है; प्रसंग में चाँदी और सोने के रूप में दंडात्मक भुगतान की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζημίωσεν
  choice: आर्थिक दंड लगाया
  rationale: क्रिया का अर्थ हानि पहुँचाना या जुर्माने के रूप में धन वसूलना हो सकता है। चाँदी और सोने की निश्चित मात्राओं के साथ यहाँ दंडात्मक भुगतान का भाव है।
- source_word: τὸ ἔθνος
  choice: राष्ट्र
  rationale: यह शब्द यहाँ अधीन की गई जनता को एक सामूहिक राजनीतिक इकाई के रूप में प्रस्तुत करता है; ‘राष्ट्र’ इस सामूहिक अर्थ को निकटता से व्यक्त करता है।
- source_word: ἀργυρίου τάλαντοις ἑκατόν
  choice: चाँदी के एक सौ तोड़े
  rationale: यह धातु के भार और मूल्य की मानक अभिव्यक्ति है। ‘तोड़ा’ बाइबलीय भार-मुद्रा इकाई टैलेंट का हिंदी में प्रचलित रूप है।
- source_word: χρυσίου ταλάντῳ ἑνί
  choice: सोने के एक तोड़े
  rationale: यह पहले परिमाण के साथ दंड की दूसरी राशि बताता है और चाँदी के एक सौ तोड़ों के विपरीत सोने के एक तोड़े को स्पष्ट रखता है।
