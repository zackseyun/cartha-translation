base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/032.yaml
  text: And those from the nation took Jechoniah son of Josiah and made him king in place of Josiah his father, when he was twenty-three years old.
translation:
  language: hi
  text: और राष्ट्र के लोगों ने योशिय्याह के पुत्र यकोन्याह[a] को लेकर उसके पिता योशिय्याह के स्थान पर राजा बनाया। उस समय वह तेईस वर्ष का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘यकोन्याह’ है; 2 इतिहास 36:1 के समानांतर वृत्तांत में उसका नाम ‘यहोआहाज’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: को लेकर
  rationale: यह कृदन्त लोगों द्वारा यकोन्याह को चुनकर राजपद पर बैठाने की आरम्भिक कार्रवाई बताता है। ‘को लेकर ... राजा बनाया’ यूनानी वाक्य की ठोस क्रिया और हिन्दी की स्वाभाविकता दोनों बनाए रखता है।
- source_word: οἱ ἐκ τοῦ ἔθνους
  choice: राष्ट्र के लोगों ने
  rationale: यूनानी का शाब्दिक भाव ‘राष्ट्र में से लोग’ है। ऐतिहासिक संदर्भ में ‘राष्ट्र के लोग’ सहज और पर्याप्त रूप से निकट है; ‘देश के लोग’ कहने से यूनानी ἔθνος के स्थान पर γῆ-जैसा भाव आ सकता था।
- source_word: ἀνέδειξαν βασιλέα
  choice: राजा बनाया
  rationale: यह पद किसी को राजकीय पद पर नियुक्त या प्रतिष्ठित करने का अर्थ देता है। ‘राजा बनाया’ आधुनिक हिन्दी में स्पष्ट है और किसी विशेष राज्याभिषेक-विधि को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἀντὶ
  choice: के स्थान पर
  rationale: यह पूर्वसर्ग प्रतिस्थापन अथवा उत्तराधिकार का भाव व्यक्त करता है। ‘के स्थान पर’ उस भाव को सीधे सुरक्षित रखता है।
- source_word: ὄντα ἐτῶν εἴκοσι τριῶν
  choice: उस समय वह तेईस वर्ष का था
  rationale: यूनानी कृदन्तीय आयु-वाक्यांश को स्वाभाविक आधुनिक हिन्दी के स्वतंत्र वाक्य में व्यक्त किया गया है; इससे आयु का वर्णन स्पष्ट रहता है और अर्थ नहीं बदलता।
- source_word: Ἰεχονίαν
  choice: यकोन्याह
  rationale: मुख्य यूनानी पाठ में यही नाम स्पष्ट रूप से है। समानांतर ऐतिहासिक परंपरा के ‘यहोआहाज’ से सामंजस्य बैठाने के बजाय यूनानी पाठ का नाम मुख्य पाठ में रखा गया है।
theological_decisions:
- issue: समानांतर इब्रानी/ऐतिहासिक परंपरा से व्यक्ति के नाम का अंतर
  choice: मुख्य पाठ में यूनानी नाम ‘यकोन्याह’ रखा गया
  alternative: यहोआहाज
  rationale: 1 एस्द्रास के लिए उपलब्ध यूनानी पाठ प्राथमिक स्रोत है और उसमें Ἰεχονίαν है। 2 इतिहास 36:1 से सामंजस्य कराने के लिए नाम बदलना वास्तविक पाठांतर को छिपा देता; इसलिए वैकल्पिक पहचान पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘राष्ट्र के लोग’ यूनानी अभिव्यक्ति के निकट है, जबकि आयु-वाक्यांश को पठनीयता के लिए स्वतंत्र वाक्य बनाया गया है।
