  text: In the eighteenth year of Iosias's reign[b][a], this Passover was held.
translation:
  language: hi
  text: योसियास के शासन के अठारहवें वर्ष में यह फसह मनाया गया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “यह फसह लाया/संचालित किया गया”; आशय है कि उस समय फसह का अनुष्ठान संपन्न किया गया।
    reason: lexical_alternative
  - marker: b
    text: 2 इतिहास 35 में इसका इब्रानी समानांतर उस समय इस्राएलियों द्वारा फसह मनाए जाने का वर्णन करता है; यहाँ यूनानी पाठ उस आयोजन का संक्षिप्त सार देता है।
    reason: cross_reference
lexical_decisions:
- source_word: ὀκτωκαιδεκάτῳ ἔτει
  choice: अठारहवें वर्ष में
  rationale: कालसूचक दत्तिव का स्वाभाविक हिन्दी रूप; यह घटना का समय बताता है।
- source_word: βασιλεύοντος Ἰωσείου
  choice: योसियास के शासन के
  rationale: यह संबंधकारक स्वतंत्र वाक्यांश शाब्दिक रूप से ‘जब योसियास राज्य कर रहा था’ है। हिन्दी में ‘योसियास के शासन के अठारहवें वर्ष में’ अर्थ को सहज और संक्षिप्त रूप से व्यक्त करता है। नाम का रूप यूनानी Ἰωσείου के अनुसार ‘योसियास’ रखा गया है।
- source_word: ἤχθη
  choice: मनाया गया
  rationale: क्रिया का मूल अर्थ ‘लाया/ले जाया गया’ है, पर फसह के संदर्भ में इसका आशय उसके अनुष्ठान को संपन्न करने से है। ‘मनाया गया’ आधुनिक हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी शाब्दिक बिंब सुरक्षित रखती है।
- source_word: τὸ πάσχα
  choice: फसह
  rationale: यह यहूदी पर्व के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और स्रोत-संगत पद है; इब्रानी समानांतर הַפֶּסַח भी इसकी पुष्टि करता है।
- source_word: τοῦτο
  choice: यह
  rationale: संकेतवाचक शब्द प्रसंग में अभी वर्णित विशिष्ट फसह की ओर संकेत करता है; ‘यह’ उस पाठ-संबंध को स्पष्ट रखता है।
