- source_word: μετʼ αὐτὸν
  choice: उसके बाद
  rationale: यह पद क्रम में अगले व्यक्ति और घटना की ओर संकेत करता है; ‘उसके बाद’ व्यक्तिगत संदर्भ और कालक्रम दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀνέβη
  choice: चढ़ आया
  rationale: यूनानी क्रिया का मूल अर्थ ऊपर जाना/आना है और राजकीय या सैन्य प्रसंग में किसी देश पर आगे बढ़ने का भाव हो सकता है। ‘चढ़ आया’ दिशात्मक मुहावरे और आक्रमणकारी आगे बढ़ने के निहित भाव को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- source_word: Ναβουχοδονόσορ
  choice: नबूकदनेस्सर
  rationale: यह हिन्दी बाइबलीय प्रयोग में इस प्रसिद्ध राजा के नाम का प्रचलित और पहचानने योग्य रूप है।
- source_word: βασιλεὺς Βαβυλῶνος
  choice: बाबुल का राजा
  rationale: उपाधि और स्थान-संबंध को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔδησεν
  choice: बाँधा
  rationale: यह क्रिया का व्यापक और स्वाभाविक अर्थ है; आगे आने वाला वाक्यांश बन्धन के साधन को स्पष्ट करता है।
- source_word: ἐν χαλκεῖς δεσμοῖς
  choice: काँसे की बेड़ियों में
  rationale: δεσμοῖς यहाँ धातु के बन्धनों को सूचित करता है। ‘बेड़ियाँ’ कैदी के बन्धन के लिए स्वाभाविक है और ‘काँसा’ χαλκεῖς की ऐतिहासिक धातु-सूचना बनाए रखता है।
- source_word: ἀπήγαγεν
  choice: ले गया
  rationale: प्रसंग में यह बलपूर्वक बन्दी बनाकर दूसरे स्थान ले जाने को व्यक्त करता है; हिन्दी में ‘ले गया’ संक्षिप्त और स्वाभाविक है, जबकि बेड़ियों का उल्लेख जबरन निर्वासन का भाव स्पष्ट कर देता है।
- source_word: εἰς Βαβυλῶνα
  choice: बाबुल
  rationale: ‘ले गया’ के साथ गन्तव्य के रूप में ‘बाबुल’ स्वाभाविक हिन्दी रचना है और यूनानी εἰς का आशय पूरा करता है।
