base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/027.yaml
  text: But he arrayed himself for war against him in the plain of Megiddo[a], and the commanders came down against King Josiah.
translation:
  language: hi
  text: परन्तु उसने मगिद्दो के मैदान में उसके विरुद्ध युद्ध के लिए मोर्चा बाँधा[a], और सेनानायक राजा योशियाह के विरुद्ध उतर आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 इतिहास 35:22 के इब्रानी समानांतर पाठ में यूनानी के ‘उसके विरुद्ध युद्ध के लिए मोर्चा बाँधा’ के स्थान पर ‘उससे लड़ने के लिए अपना भेष बदला’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: συνεστήσατο πρὸς αὐτὸν πόλεμον
  choice: उसके विरुद्ध युद्ध के लिए मोर्चा बाँधा
  rationale: यह प्रयोग मध्यवाच्य के आत्म-संलग्न भाव और युद्ध की तैयारी या व्यूहबद्ध होने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। इसे केवल ‘युद्ध किया’ कहना तैयारी और स्थिति ग्रहण करने की छाया को कम कर देता।
- source_word: ἐν τῷ πεδίῳ Μετααδδούς
  choice: मगिद्दो के मैदान में
  rationale: πεδίον का सीधा अर्थ ‘मैदान’ है। यूनानी स्थाननाम की पहचान इब्रानी समानांतर पाठ से प्रचलित ‘मगिद्दो’ के रूप में पुष्ट होती है।
- source_word: κατέβησαν
  choice: उतर आए
  rationale: क्रिया के नीचे की ओर आने-जाने के दिशात्मक अर्थ को बनाए रखता है और हिन्दी कथन में स्वाभाविक है।
- source_word: οἱ ἄρχοντες
  choice: सेनानायक
  rationale: ἄρχοντες सामान्यतः शासक या अगुवे हो सकता है, पर युद्ध के प्रसंग में सैन्य नेतृत्व का अर्थ अधिक उपयुक्त है।
- source_word: πρὸς βασιλέα Ἰωσίαν
  choice: राजा योशियाह के विरुद्ध
  rationale: πρός के दिशात्मक अर्थ की सम्भावना रहते हुए भी तत्कालीन युद्ध-संदर्भ में इसका विरोधात्मक अर्थ अधिक संगत है; इसलिए ‘के विरुद्ध’ चुना गया।
theological_decisions:
- issue: जहाँ यूनानी और इब्रानी समानांतर पाठ अलग हैं, वहाँ किस पाठ का अनुसरण किया जाए
  choice: मुख्य पाठ में यूनानी के अनुसार ‘युद्ध के लिए मोर्चा बाँधा’ रखा गया और इब्रानी पाठ से केवल स्थाननाम ‘मगिद्दो’ की पहचान पुष्ट की गई।
  alternative: ‘उसने उससे लड़ने के लिए अपना भेष बदला’
  rationale: इस ग्रन्थ के लिए निर्दिष्ट प्राथमिक स्रोत यूनानी पाठ है। इब्रानी समानांतर पाठ महत्वपूर्ण पाठ-साक्ष्य है, पर जहाँ उसकी क्रिया यूनानी से स्पष्टतः भिन्न है, वहाँ वह मुख्य अनुवाद को प्रतिस्थापित नहीं करता; भिन्नता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘मोर्चा बाँधा’ सामान्य पाठक के लिए बोधगम्य सैन्य अभिव्यक्ति है और यूनानी मध्यवाच्य के भाव को भी यथासम्भव सुरक्षित रखती है।
