base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/051.yaml
  text: But he handed everything over into their hands. And after taking all the holy vessels of the Lord, the great and the small, and the chests of the Lord and the royal storehouses, they carried them away to Babylon.
translation:
  language: hi
  text: परन्तु उसने सब कुछ उनके हाथों में सौंप दिया। और वे प्रभु के सभी पवित्र पात्र—बड़े और छोटे—तथा प्रभु की संदूकें और राजकीय भंडार-गृह लेकर बाबुल ले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκεν εἰς τὰς χεῖρας αὐτῶν
  choice: उनके हाथों में सौंप दिया
  rationale: यूनानी मुहावरे के रूप और अर्थ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἱερὰ σκεύη
  choice: पवित्र पात्र
  rationale: मन्दिर-सेवा में प्रयुक्त पवित्र वस्तुओं अथवा बर्तनों के लिए प्रचलित और गरिमापूर्ण पद।
- source_word: κιβωτούς
  choice: संदूकें
  rationale: बहुवचन को सुरक्षित रखते हुए पेटियों या संदूकों का सीधा अर्थ देता है; इसे अनावश्यक रूप से ‘वाचा का सन्दूक’ या ‘कोष’ नहीं बनाया गया।
- source_word: βασιλικὰς ἀποθήκας
  choice: राजकीय भंडार
  rationale: राजा से संबंधित भंडारण-स्थलों या भंडार-संपत्ति की व्यापकता बनाए रखता है।
- source_word: ἀναλαβόντες
  choice: अपने अधिकार में लेकर
  rationale: सिर्फ उठाने के बजाय अपने कब्जे में लेने और साथ ले जाने का प्रसंगगत भाव व्यक्त करता है।
- source_word: Βαβυλῶνα
  choice: बाबुल
  rationale: बाइबलीय हिन्दी में Babylon का परिचित नाम।
theological_decisions:
- issue: παρέδωκεν का कर्ता इस पद में स्पष्ट नामित नहीं है
  choice: ‘उसने’ रखकर अस्पष्टता सुरक्षित की गई
  alternative: ‘परमेश्वर ने’ या किसी अन्य कर्ता का नाम जोड़ना
  rationale: मूल यूनानी में केवल एकवचन सर्वनाम-सूचक क्रिया है; प्रसंग से कर्ता समझा जा सकता है, पर अनुवाद में नाम जोड़ना व्याख्यात्मक समाधान होता।
- issue: κιβωτούς की पहचान
  choice: सामान्य बहुवचन ‘संदूकें’
  alternative: ‘वाचा के सन्दूक’ या ‘खजाने’
  rationale: यूनानी बहुवचन किसी विशिष्ट एकमात्र पवित्र सन्दूक को नहीं बताता; इसलिए धार्मिक पहचान या कोषार्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘परन्तु’ तथा ‘प्रभु’ बाइबलीय संदर्भ की औपचारिकता बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठकों के लिए सुबोध है।
