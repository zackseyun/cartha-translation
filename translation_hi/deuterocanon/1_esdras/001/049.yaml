base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/049.yaml
  text: But they mocked his messengers[a], and whenever the Lord spoke, they were making sport of his prophets, until, in his anger against his nation because of their ungodly deeds[b], he commanded the kings of the Chaldeans to come up against them.
translation:
  language: hi
  text: परन्तु उन्होंने उसके दूतों[a] का उपहास किया, और जब-जब प्रभु बोलता था, वे उसके भविष्यद्वक्ताओं की खिल्ली उड़ाते रहे; यहाँ तक कि उनके अधार्मिक कर्मों के कारण वह अपने राष्ट्र पर क्रोधित हुआ और उसने कसदियों के राजाओं[b] को उनके विरुद्ध चढ़ आने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके स्वर्गदूतों’; यहाँ ‘उसके भविष्यद्वक्ताओं’ के समानांतर होने के कारण परमेश्वर के मानवीय दूत अधिक संभावित हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में ‘कसदियों के राजा’ बहुवचन में है। 2 इतिहास 36 के इब्रानी समानांतर में बाबेल के राजा, अर्थात् नबूकदनेस्सर, पर बल है। मुख्य पाठ 1 एस्द्रास के यूनानी साक्ष्य का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐμυκτήρισαν
  choice: उपहास किया
  rationale: यह क्रिया तिरस्कारपूर्ण हँसी या ठट्ठे का भाव व्यक्त करती है; ‘उपहास किया’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἐν τοῖς ἀγγέλοις αὐτοῦ
  choice: उसके दूतों
  rationale: ऐतिहासिक-भविष्यद्वाणी संदर्भ और अगले खंड में ‘उसके भविष्यद्वक्ताओं’ के समानांतर प्रयोग के कारण यहाँ मनुष्य संदेशवाहक अधिक संभावित हैं; ‘स्वर्गदूतों’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: ᾗ ἡμέρᾳ ἐλάλησεν Κύριος
  choice: जब-जब प्रभु ने कहा
  rationale: शाब्दिक रूप ‘जिस दिन प्रभु ने कहा’ है, पर संदर्भ में बार-बार भेजे गए संदेशों और लगातार किए गए उपहास का भाव है; ‘जब-जब’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκπαίζοντες
  choice: हँसी उड़ाते रहे
  rationale: अपूर्णतामूलक कृदन्त निरंतर उपहास का संकेत देता है; यह पहले खंड की पुनरुक्ति किए बिना उसका भाव बनाए रखता है।
- source_word: θυμῶντα αὐτὸν ἐπὶ τῷ ἔθνει αὐτοῦ
  choice: वह अपने राष्ट्र पर क्रोधित हुआ
  rationale: कृदन्तीय रचना को सहज हिन्दी में परिणाम की ओर बढ़ती स्वतंत्र क्रिया के रूप में व्यक्त किया गया है; ἔθνος का सीधा अर्थ ‘राष्ट्र’ रखा गया है।
- source_word: δυσσεβήματα
  choice: भक्तिहीन कामों
  rationale: यह शब्द केवल सामान्य दुष्टता नहीं, बल्कि परमेश्वर के प्रति अनादर और अधार्मिकता वाले कर्मों को दर्शाता है; ‘भक्तिहीन’ उसका धार्मिक आयाम बनाए रखता है।
- source_word: προστάξαι ἀναβιβάσαι ἐπ᾽ αὐτοὺς
  choice: उनके विरुद्ध चढ़ आने की आज्ञा दी
  rationale: यह सैन्य आक्रमण का प्रसंग है; ‘चढ़ आना’ ἀναβιβάσαι की गति और विरोधी आक्रमण, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς βασιλεῖς τῶν Χαλδαίων
  choice: कसदियों के राजाओं
  rationale: यूनानी पाठ में ‘राजाओं’ बहुवचन है; इसलिए इब्रानी समानांतर के एकवचन के अनुरूप इसे बदला नहीं गया।
theological_decisions:
- issue: ἀγγέλοις से अभिप्रेत दूतों की पहचान
  choice: परमेश्वर द्वारा भेजे गए मानवीय दूत
  alternative: स्वर्गदूत
  rationale: ‘उसके भविष्यद्वक्ताओं’ के साथ तत्काल समानांतरता मानवीय संदेशवाहकों के पक्ष में है, फिर भी मूल शब्द की वास्तविक द्विअर्थकता पादटिप्पणी में सुरक्षित है।
- issue: ‘कसदियों के राजाओं’ के बहुवचन को इब्रानी समानांतर से मिलाना
  choice: यूनानी का बहुवचन बनाए रखना
  alternative: कसदियों का राजा अथवा बाबेल का राजा नबूकदनेस्सर
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक स्रोत है। इब्रानी समानांतर उपयोगी तुलना देता है, पर यूनानी पाठ के बहुवचन को चुपचाप एकवचन में बदलना उचित नहीं है।
- issue: ईश्वरीय क्रोध और आज्ञा के बीच संबंध
  choice: भक्तिहीन कर्मों के कारण क्रोध के बाद आक्रमण की आज्ञा
  alternative: कृदन्तों को अधिक शाब्दिक रूप से एक ही दीर्घ वाक्य में रखना
  rationale: हिन्दी वाक्य-विन्यास को स्पष्ट किया गया है, पर मूल का नैतिक-धार्मिक कारणक्रम और न्याय का तनाव यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘दूत’, ‘भविष्यद्वक्ता’, ‘भक्तिहीन’ और ‘कसदी’ जैसे प्रचलित बाइबलीय शब्द संदर्भ-स्पष्टता के साथ प्रयुक्त हैं। यूनानी की लंबी कृदन्तीय रचना को दो वाक्यों में बाँटकर प्रवाह सुधारा गया है, जबकि कारणक्रम और पाठगत बहुवचन सुरक्षित रखा गया है।
