lexical_decisions:
- source_word: στήσας
  choice: उसने … नियुक्त किया
  rationale: यह ἵστημι का करणवाचक प्रयोग है और याजकों को निर्धारित स्थान या सेवा में लगाने का भाव देता है। यूनानी में कृदन्त होने पर भी, अलग पद के रूप में स्वाभाविक हिन्दी के लिए इसे पूर्ण क्रिया बनाया गया है।
- source_word: τοὺς ἱερεῖς
  choice: याजकों को
  rationale: ἱερεύς के लिए प्रचलित और स्पष्ट बाइबिलीय हिन्दी शब्द।
- source_word: κατʼ ἐφημερίας
  choice: उनकी सेवा-पालियों के अनुसार
  rationale: ἐφημερία याजकों की निर्धारित सेवा-अवधि अथवा क्रमबद्ध दल को दर्शाता है। ‘सेवा-पालियाँ’ आधुनिक पाठक के लिए इस घूर्णनशील व्यवस्था को स्पष्ट रखता है।
- source_word: ἐστολισμένους
  choice: वे विधिवत् वेश धारण किए हुए थे
  rationale: στολίζω सुसज्जित या उपयुक्त वस्त्र पहने होने का संकेत देता है। यह अनुवाद वस्त्र-संबंधी भाव बनाए रखता है, पर यूनानी से आगे बढ़कर विशिष्ट याजकीय परिधान निर्धारित नहीं करता।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν यहाँ पवित्र मन्दिर-परिसर को सूचित करता है। ‘मन्दिर’ हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: प्राथमिक यूनानी पाठ के κύριος को ‘प्रभु’ किया गया है। समानान्तर इब्रानी में परमेश्वर का नाम है, पर वह यहाँ सहायक साक्ष्य है, प्राथमिक आधार नहीं।
theological_decisions:
- issue: यूनानी κύριος और समानान्तर इब्रानी में יהוה
  choice: प्रभु
  alternative: यहोवा / याहवे
  rationale: अनुवाद का प्राथमिक आधार यूनानी है, जिसमें κύριος है। इसलिए मुख्य पाठ में ‘प्रभु’ स्रोत-प्राथमिकता को बनाए रखता है; पादटिप्पणी समानान्तर इब्रानी पाठ की भिन्नता बताती है।
- issue: ἐστολισμένους को विशिष्ट याजकीय वस्त्र मानना
  choice: विधिवत् वेश धारण किए हुए
  alternative: याजकीय वस्त्र पहने हुए / सुसज्जित
  rationale: प्रसंग याजकीय परिधान का संकेत दे सकता है, किन्तु यूनानी शब्द स्वयं किसी खास प्रकार के वस्त्र का नाम नहीं लेता। मुख्य पाठ इस सम्भावना को खुला रखता है।
