base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/024.yaml
  text: Josiah met him[a]. And the king of Egypt sent word to him, saying, “What is there between me and you[b], O king of Judea?”
translation:
  language: hi
  text: 'योशियाह उससे मिला। तब मिस्र के राजा ने उसके पास यह संदेश भेजा: “हे यहूदिया के राजा, मेरा और तुम्हारा क्या संबंध है?[a]”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार ढंग से, “मुझे तुमसे क्या काम?”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “यहूदिया के राजा”; इतिहास-वृत्तांत के समानांतर वर्णन में इसके अनुरूप “यहूदा के राजा” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπάντησιν αὐτῷ Ἰωσείας
  choice: योशियाह उससे मिलने गया
  rationale: यूनानी पाठ का यह संक्षिप्त, कुछ असामान्य संज्ञात्मक खंड ‘उससे भेंट/सामना’ का भाव देता है। हिन्दी में क्रियात्मक रूप स्वाभाविक है और प्रसंग में αὐτῷ का संकेत मिस्र के राजा की ओर है।
- source_word: διεπέμψατο
  choice: उसके पास यह संदेश भेजा
  rationale: क्रिया किसी के माध्यम से संदेश भिजवाने का भाव रखती है। यूनानी में ‘दूत’ स्पष्ट रूप से नहीं है, इसलिए ‘संदेश भेजा’ अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: मेरा और तुम्हारा क्या संबंध है?
  rationale: यह सामी शैली का प्रश्न है, जो दूरी बनाने या चुनौती देने का भाव व्यक्त कर सकता है। यह अनुवाद मूल संरचना के निकट रहते हुए आधुनिक हिन्दी में स्पष्ट है और कथन की कठोरता को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: βασιλεῦ τῆς Ἰουδαίας
  choice: हे यहूदिया के राजा
  rationale: βασιλεῦ संबोधन कारक है, जिसे ‘हे’ से स्पष्ट किया गया है। Ἰουδαία का सीधा भौगोलिक रूप ‘यहूदिया’ है; इतिहास-वृत्तांत के समानांतर पाठ का ‘यहूदा’ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: Τί ἐμοὶ καὶ σοὶ ἐστίν में चुनौती या असंबद्धता का भाव
  choice: मेरा और तुम्हारा क्या संबंध है?
  alternative: मुझे तुमसे क्या काम?
  rationale: मुख्य पाठ यूनानी अभिव्यक्ति की संरचना और उसके संभावित औपचारिक अथवा टकरावपूर्ण दोनों स्वरों को खुला रखता है; अधिक मुहावरेदार विकल्प पादटिप्पणी में है।
- issue: Ἰουδαίας का राजनीतिक-भौगोलिक नाम
  choice: यहूदिया
  alternative: यहूदा
  rationale: मूल यूनानी साक्ष्य में यूनानीकृत भू-नाम Ἰουδαία है, इसलिए ‘यहूदिया’ को प्राथमिकता दी गई है। इतिहास-वृत्तांत के समानांतर वर्णन के अनुसार ‘यहूदा’ संभव पारंपरिक रूप है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘हे’ संबोधन यूनानी संबोधन कारक को स्पष्ट करता है। पहले वाक्य के खंडित यूनानी रूप को अर्थ-संगत स्वाभाविक हिन्दी क्रिया-वाक्य बनाया गया है।
