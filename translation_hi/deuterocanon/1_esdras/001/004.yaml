base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/004.yaml
  text: You will not need to carry it on your shoulders[a]. Now serve the Lord your God, and minister to his people Israel, and prepare yourselves by your fathers' houses and your divisions[b],
translation:
  language: hi
  text: तुम्हें उसे अपने कंधों पर उठाकर ले जाने की आवश्यकता नहीं होगी। अब अपने प्रभु परमेश्वर की उपासना-सेवा करो, और उसकी प्रजा इस्राएल की सेवा करो; और अपने पितृ-कुलों और अपने गोत्रों के अनुसार तैयार हो जाओ।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसे” से आशय वाचा के सन्दूक से है, जिसका उल्लेख आसपास के प्रसंग में है।
    reason: cross_reference
  - marker: b
    text: यूनानी में “गोत्रों” है। 2 इतिहास 35:4 का इब्रानी समानांतर यहाँ सेवा के संगठित “विभागों” का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔσται ὑμῖν ἆραι ἐπʼ ὤμων αὐτήν
  choice: अब तुम्हें उसे अपने कंधों पर उठाकर ले जाने की आवश्यकता नहीं होगी
  rationale: दत्तिव के साथ भविष्यकालीन εἰμί यहाँ दायित्व या आवश्यकता के अभाव को व्यक्त करता है। αἴρω और ἐπʼ ὤμων का ठोस भाव ‘कंधों पर उठाकर ले जाना’ से स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: λατρεύετε
  choice: उपासना-सेवा करो
  rationale: यह क्रिया परमेश्वर के लिए धार्मिक और आराधनात्मक सेवा को सूचित करती है। संयुक्त पद इसे इस्राएल की व्यावहारिक ‘सेवा’ के लिए प्रयुक्त अगली क्रिया से अलग रखता है।
- source_word: τῷ κυρίῳ θεῷ ὑμῶν
  choice: अपने प्रभु परमेश्वर की
  rationale: यह वाचा-संबंधी अभिव्यक्ति है; ‘प्रभु परमेश्वर’ κύριος θεός का मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: θεραπεύετε
  choice: सेवा करो
  rationale: यहाँ अर्थ लोगों की देखभाल या उनके हित में सेवकाई करना है। सरल ‘सेवा करो’ आधुनिक हिन्दी में स्वाभाविक है और λατρεύετε के आराधनात्मक आयाम से भेद बनाए रखता है।
- source_word: τὸ ἔθνος αὐτοῦ Ἰσραήλ
  choice: उसकी प्रजा इस्राएल
  rationale: ἔθνος का मूल अर्थ ‘जाति/राष्ट्र’ हो सकता है, पर αὐτοῦ सहित इस वाचा-संदर्भ में ‘उसकी प्रजा इस्राएल’ संबंधपरक भाव को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἑτοιμάσατε
  choice: तैयार हो जाओ
  rationale: आज्ञार्थक क्रिया को प्रसंगानुसार आत्मवाचक रूप में व्यक्त किया गया है, क्योंकि लोगों को संगठित होकर सेवा के लिए तैयार होना है।
- source_word: κατὰ τὰς πατριὰς
  choice: अपने पितृ-कुलों के अनुसार
  rationale: πατριά पैतृक घराने या कुल को दर्शाता है। ‘पितृ-कुल’ साधारण ‘परिवार’ से अधिक विशिष्ट है और समानांतर इब्रानी בית־אבות से पुष्ट होता है।
- source_word: καὶ τὰς φυλὰς ὑμῶν
  choice: और अपने दलों के अनुसार
  rationale: φυλή सामान्यतः ‘गोत्र’ है, पर इस याजकीय-संगठनात्मक संदर्भ में समानांतर इब्रानी מחלקות ‘विभागों/दल-बंदियों’ की ओर संकेत करता है। ‘दल’ पठनीय रहते हुए उस संगठनात्मक अर्थ को व्यक्त करता है; पाठगत विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर और इस्राएल के प्रति सेवा के लिए अलग यूनानी क्रियाएँ
  choice: λατρεύετε के लिए ‘उपासना-सेवा करो’ और θεραπεύετε के लिए ‘सेवा करो’
  alternative: दोनों के लिए केवल ‘सेवा करो’
  rationale: यूनानी पाठ परमेश्वर की आराधनात्मक सेवा और उसकी प्रजा के प्रति की जाने वाली सेवा के बीच शब्दगत भेद रखता है। अनुवाद उस भेद को बिना किसी सांप्रदायिक अर्थारोपण के बनाए रखता है।
- issue: φυλάς का संगठनात्मक या जातीय अर्थ
  choice: मुख्य पाठ में ‘दल’, साथ में ‘गोत्र’ का पाठगत विकल्प
  alternative: मुख्य पाठ में ‘गोत्र’
  rationale: ग्रीक का सामान्य अर्थ ‘गोत्र’ है, जबकि 2 इतिहास 35:4 का इब्रानी समानांतर सेवा-विभागों को दर्शाता है। संदर्भगत अर्थ मुख्य पाठ में रखा गया है और वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
- issue: αὐτήν का निहित संदर्भ
  choice: मुख्य पाठ में ‘उसे’, पादटिप्पणी में सन्दूक की पहचान
  alternative: मुख्य पाठ में सीधे ‘सन्दूक को’
  rationale: इस पद में ग्रीक केवल स्त्रीलिंग सर्वनाम देता है; उसका संदर्भ आसपास के प्रसंग से ज्ञात होता है। ‘उसे’ मूल की अभिव्यक्ति को सुरक्षित रखता है और पादटिप्पणी पाठक को संदर्भ बताती है।
