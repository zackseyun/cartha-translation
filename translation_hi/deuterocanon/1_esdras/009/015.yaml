  text: और बँधुआई से आए लोगों ने यह सब किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν
  choice: काम किए
  rationale: यहाँ ποιέω का अर्थ किसी वस्तु को बनाना नहीं, बल्कि पहले बताए गए कार्यों को करना या पूरा करना है; हिन्दी में ‘काम किए’ सहज और स्पष्ट है।
- source_word: κατὰ πάντα ταῦτα
  choice: ये सभी काम
  rationale: यह पदबंध पहले वर्णित समस्त कार्यों की ओर संकेत करता है। ‘ये सभी काम’ πάντα की समग्रता और ταῦτα के पूर्वसंदर्भ, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: बँधुआई से लौटे लोग
  rationale: यूनानी का शाब्दिक रूप ‘बँधुआई से [आए] लोग’ है। सन्दर्भ में निर्वासन से वापस आए समुदाय की बात है, इसलिए ‘लौटे’ निहित गति को स्पष्ट करते हुए अभिव्यक्ति को आधुनिक हिन्दी में सुबोध बनाता है।
