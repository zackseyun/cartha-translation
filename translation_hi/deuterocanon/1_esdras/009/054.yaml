base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/054.yaml
  text: And they all went away to eat and drink and rejoice[a], and to send portions to those who had nothing, and to rejoice greatly;
translation:
  language: hi
  text: और वे सब खाने-पीने, आनंद मनाने, जिनके पास कुछ नहीं था उन्हें हिस्से भेजने, और बहुत आनंद मनाने के लिए चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾤχοντο
  choice: चले गए
  rationale: οἴχομαι के इस रूप का अर्थ सभा से विदा होकर जाना है; ‘चले गए’ आधुनिक हिन्दी में स्वाभाविक रूप से यह भाव व्यक्त करता है।
- source_word: φαγεῖν καὶ πιεῖν
  choice: खाने-पीने
  rationale: दोनों उद्देश्यवाचक क्रियाओं को प्रचलित हिन्दी युग्म के रूप में रखा गया है।
- source_word: εὐφραίνεσθαι
  choice: आनंद मनाने
  rationale: यह क्रिया प्रसन्नता के साथ उत्सव मनाने का भाव रखती है; ‘आनंद मनाने’ से प्रसंग का सामुदायिक और उत्सवी स्वर बना रहता है।
- source_word: δοῦναι ἀποστολὰς
  choice: हिस्से भेजने
  rationale: ἀποστολάς यहाँ भेजी जाने वाली वस्तुओं या अंशों को सूचित करता है। इब्रानी समानांतर מָנוֹת इसे भोज के हिस्सों के रूप में स्पष्ट करता है; फिर भी मुख्य पाठ में केवल ‘हिस्से’ कहकर यूनानी की संक्षिप्तता रखी गई है।
- source_word: τοῖς μὴ ἔχουσιν
  choice: जिनके पास कुछ नहीं था
  rationale: यूनानी में जिस वस्तु का अभाव था वह स्पष्ट नहीं कही गई है। यह अनुवाद उस व्यापकता को बनाए रखता है, जबकि पादटिप्पणी इब्रानी समानांतर का अधिक विशिष्ट संकेत देती है।
- source_word: εὐφρανθῆναι μεγάλως
  choice: बहुत आनंदित होने
  rationale: μεγάλως आनंद की तीव्रता बढ़ाता है। आरम्भिक ‘आनंद मनाने’ से अलग शब्दावली यूनानी की पुनरुक्ति और उसके बल को पठनीय हिन्दी में बनाए रखती है।
theological_decisions:
- issue: τοῖς μὴ ἔχουσιν में निहित कर्म को इब्रानी समानांतर के आधार पर स्पष्ट करना
  choice: मुख्य पाठ में ‘जिनके पास कुछ नहीं था’ रखकर अभाव की वस्तु को अनिर्दिष्ट छोड़ा गया
  alternative: ‘जिनके पास तैयार किए हुए हिस्से नहीं थे’
  rationale: यूनानी पाठ वस्तु को अनकहा छोड़ता है, जबकि नहेमायाह 8:12 का इब्रानी समानांतर भोज के हिस्सों की ओर संकेत करता है। मुख्य पाठ यूनानी की वास्तविक अस्पष्टता बचाता है और पादटिप्पणी समानांतर साक्ष्य देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उत्सवी स्वर रखा गया है। उद्देश्यसूचक क्रियाओं की श्रृंखला यूनानी वाक्य की संरचना और दोनों बार आए आनंद के भाव को सुरक्षित रखती है।
