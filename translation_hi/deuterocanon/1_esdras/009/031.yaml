base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/031.yaml
  text: 'And from the sons of Addin: Lathos and Moosseias[a], Lakkounos and Naidos, and Beskaspasmos and Sesthel and Balnous and Manasseh.'
translation:
  language: hi
  text: 'और अद्दीन के पुत्रों में से: लाथोस और मूस्सेयास[a], लक्कूनोस और नाइदोस, और बेस्कासपास्मोस, सेस्थेल, बालनूस और मनश्शे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी साक्ष्य में व्यक्तियों के नामों की सूची है। इनमें से कई नाम पाठगत रूप से अनिश्चित हैं या लगभग समानांतर इब्रानी पाठ से भिन्न हैं। इसलिए उन्हें मसोरेटिक परंपरा के अनुरूप बनाने के बजाय यूनानी रूपों का निकटता से अनुसरण किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Ἀδδείν
  choice: और अद्दीन के पुत्रों में से
  rationale: ἐκ के साथ संबंधकारक इस सूची में परिवार-समूह में से व्यक्तियों को चिह्नित करता है। ‘पुत्रों में से’ यूनानी संरचना और वंश-सूची के सूत्र दोनों को बनाए रखता है।
- source_word: υἱῶν
  choice: पुत्रों
  rationale: वंश और परिवार की सूची में υἱοί पुरुष सदस्यों अथवा वंशजों को सूचित कर सकता है; स्रोत-निकट औपचारिक अभिव्यक्ति के रूप में ‘पुत्रों’ रखा गया है।
- source_word: Ἀδδείν
  choice: अद्दीन
  rationale: यूनानी नाम का निकट देवनागरी लिप्यंतरण; व्यंजन-द्वित्व को बनाए रखा गया है।
- source_word: Λάθος
  choice: लाथोस
  rationale: यूनानी रूप का सीधा और पठनीय देवनागरी लिप्यंतरण।
- source_word: Μοοσσείας
  choice: मूसेयास
  rationale: यूनानी में आए दीर्घ/द्विक स्वर और नाम की ध्वनि को स्वाभाविक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है; इसे किसी अधिक परिचित इब्रानी नाम से समरूप नहीं किया गया।
- source_word: Λακκοῦνος
  choice: लक्कूनोस
  rationale: κκ को ‘क्क’ और ου को ‘ऊ’ देकर यूनानी रूप को निकटता से सुरक्षित रखा गया है।
- source_word: Νάιδος
  choice: नाइदोस
  rationale: यूनानी अक्षरक्रम का सरल देवनागरी लिप्यंतरण।
- source_word: Βεσκασπασμὸς
  choice: बेस्कासपासमोस
  rationale: यह कठिन और संभवतः पाठगत रूप से अनिश्चित व्यक्तिनाम है; इसलिए किसी समानांतर परंपरा से सामंजस्य बैठाने के बजाय यूनानी रूप का निकट लिप्यंतरण किया गया है।
- source_word: Σεσθὴλ
  choice: सेस्थेल
  rationale: θ को ‘थ’ से दर्शाते हुए यूनानी रूप का लिप्यंतरण किया गया है।
- source_word: Βαλνοῦς
  choice: बालनूस
  rationale: यूनानी रूप का स्रोत-निकट देवनागरी लिप्यंतरण।
- source_word: Μανασσῆς
  choice: मनश्शे
  rationale: इस बाइबलीय नाम का प्रचलित और पहचानने योग्य हिन्दी रूप चुना गया है, जो यूनानी और इब्रानी नाम-परंपरा के अनुरूप है।
