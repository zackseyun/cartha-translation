base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/051.yaml
  text: Go your way[a], then[b], eat rich foods and send portions to those who have nothing.
translation:
  language: hi
  text: तो जाओ, उत्तम भोजन खाओ[a] और जिनके पास कुछ नहीं है, उन्हें भोजन के हिस्से भेजो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “चर्बीयुक्त चीज़ें खाओ”; आशय उत्सव के लिए समृद्ध या बढ़िया भोजन से है।
    reason: lexical_alternative
  - marker: b
    text: नहेमायाह 8:10 के इब्रानी समानांतर में अधिक विशेष रूप से लिखा है, “उसके लिए हिस्से भेजो जिसके लिए कुछ तैयार नहीं किया गया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: βαδίσαντες
  choice: जाओ
  rationale: यह कृदन्त शाब्दिक रूप से ‘जाकर/चलकर’ है, पर इस उपदेशात्मक प्रसंग में आज्ञार्थक भाव देता है; ‘जाओ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष अथवा आगे की कार्रवाई का संबंध दिखाता है; ‘इसलिए’ उस तार्किक जोड़ को स्पष्ट रखता है।
- source_word: φάγετε
  choice: खाओ
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और सहज अनुवाद।
- source_word: λιπάσματα
  choice: उत्तम भोजन
  rationale: शब्द का शाब्दिक अर्थ चिकनी या वसायुक्त वस्तुएँ है और प्रसंग में उत्सव का समृद्ध, बढ़िया भोजन अभिप्रेत है। ‘उत्तम भोजन’ आधुनिक पाठक के लिए अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक बिंब सुरक्षित रखती है।
- source_word: ἀποστείλατε
  choice: भेजो
  rationale: साधारण बहुवचन आज्ञार्थक क्रिया का सीधा अनुवाद।
- source_word: ἀποστολάς
  choice: भोजन के हिस्से
  rationale: प्रसंग में दूसरों को भेजे जाने वाले उत्सवी भोजन के हिस्से अभिप्रेत हैं; समानांतर इब्रानी מָנוֹת भी ‘हिस्सों’ का समर्थन करता है।
- source_word: τοῖς μὴ ἔχουσιν
  choice: जिनके पास कुछ नहीं है
  rationale: यूनानी का निकट अर्थ ‘जो नहीं रखते’ है। यह अनुवाद उसकी संक्षिप्तता और वास्तविक अस्पष्टता बनाए रखता है; इब्रानी समानांतर का अधिक विशिष्ट पाठ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: यूनानी उपदेश के सामाजिक आशय को स्पष्ट करने में इब्रानी समानांतर का उपयोग
  choice: भोजन के हिस्से उन लोगों को भेजने की आज्ञा जो कुछ नहीं रखते
  alternative: उन लोगों को भेजना जिनके लिए कुछ तैयार नहीं किया गया
  rationale: यूनानी प्राथमिक पाठ केवल ‘जो नहीं रखते’ कहता है, जबकि नहेमायाह 8:10 का इब्रानी समानांतर अधिक विशिष्ट है। मुख्य पाठ यूनानी की संक्षिप्तता को रखता है और इब्रानी भिन्नता को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक शैली अपनाई गई है। यूनानी को प्राथमिक रखा गया है; इब्रानी समानांतर से उत्सवी भोजन का संदर्भ पुष्ट किया गया है, पर उसकी अधिक विशिष्ट अभिव्यक्ति मुख्य पाठ में नहीं मिलाई गई।
