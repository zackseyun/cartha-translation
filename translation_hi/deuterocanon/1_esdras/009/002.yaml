base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/002.yaml
  text: And lodging there[a], he tasted no bread and drank no water[b], mourning over the great lawless deeds of the multitude.
translation:
  language: hi
  text: और वहाँ रात बिताकर[a] उसने न रोटी चखी, न पानी पिया; वह जनसमुदाय के गंभीर व्यवस्था-विरुद्ध कर्मों पर शोक कर रहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वहाँ ठहरकर” अथवा “वहाँ डेरा डालकर।” यूनानी शब्द उस स्थान पर रात बिताने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: एज्रा 10 के समानांतर इब्रानी प्रसंग में विशेष अपराध परदेशी स्त्रियों से विवाह करना बताया गया है; यहाँ यूनानी पाठ उसे अधिक सामान्य रूप से “व्यवस्था-विरुद्ध कर्म” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλισθεὶς
  choice: वहाँ रात बिताकर
  rationale: यह कृदन्त उस स्थान पर ठहरने, विशेषतः रात बिताने, का भाव देता है। यह अनुवाद अस्थायी निवास का अर्थ स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἄρτον οὐκ ἐγεύσατο
  choice: न रोटी चखी
  rationale: यूनानी में शाब्दिक रूप से ‘रोटी’ और ‘चखना’ है। उपवास के प्रसंग में इसका आशय न खाने से है, फिर भी ठोस और प्रभावपूर्ण मूल अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: οὐδὲ ὕδωρ ἔπιεν
  choice: न पानी पिया
  rationale: यह उपवास की दूसरी समानांतर अभिव्यक्ति है और यूनानी का सीधा, स्वाभाविक अनुवाद है।
- source_word: πενθῶν
  choice: शोक मना रहा था
  rationale: यह शब्द गहरे दुःख और मातमी शोक को व्यक्त करता है; प्रसंग में एज्रा की गंभीर, प्रायश्चित्तपूर्ण प्रतिक्रिया सामने आती है।
- source_word: τῶν ἀνομιῶν τῶν μεγάλων
  choice: बड़े व्यवस्था-विरोधी कामों
  rationale: ἀνομία का मूल भाव व्यवस्था या विधि के विरुद्ध आचरण है। ‘व्यवस्था-विरोधी काम’ सामान्य ‘बुरे काम’ की अपेक्षा इस नैतिक-वाचा संबंधी बल को सुरक्षित रखता है, और ‘बड़े’ τῶν μεγάλων को औपचारिक रूप से दर्शाता है।
- source_word: τοῦ πλήθους
  choice: जनसमुदाय
  rationale: πλῆθος लोगों की सामूहिक बहुलता को दर्शाता है। ‘जनसमुदाय’ आधुनिक हिन्दी में सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἀνομία का नैतिक और धर्मवैधानिक बल
  choice: व्यवस्था-विरोधी काम
  alternative: अधर्म; अपराध; व्यवस्था के उल्लंघन
  rationale: यह चयन अपराधों को केवल सामान्य नैतिक बुराई नहीं बनाता, बल्कि परमेश्वर की व्यवस्था के विरुद्ध आचरण का संकेत बनाए रखता है। साथ ही यूनानी पाठ से आगे बढ़कर अपराध का विशिष्ट स्वरूप मुख्य पाठ में नहीं जोड़ा गया।
- issue: अपराधों की विशिष्ट पहचान
  choice: मुख्य पाठ में सामान्य यूनानी अभिव्यक्ति को बनाए रखना
  alternative: परदेशी स्त्रियों से विवाह का स्पष्ट उल्लेख
  rationale: प्राथमिक यूनानी पाठ अपराधों को सामान्य रूप से ‘बड़े व्यवस्था-विरोधी काम’ कहता है। समानांतर इब्रानी प्रसंग विशिष्ट अपराध बताता है, पर उसे मुख्य पाठ में डालना यूनानी की व्यापक अभिव्यक्ति को अनुचित रूप से संकुचित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य में मूल यूनानी के उपवास-सूचक समानांतर विन्यास—‘न रोटी चखी, न पानी पिया’—को बनाए रखा गया है। ‘व्यवस्था-विरोधी’ कुछ औपचारिक है, पर ἀνομία के विधि-विरोधी बल को ‘बुरे काम’ से अधिक ठीक ढंग से सुरक्षित रखता है।
