base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/020.yaml
  text: and they pledged themselves to send away their wives[a], and for atonement[b], rams for their ignorance.
translation:
  language: hi
  text: और उन्होंने अपनी पत्नियों को निकाल देने की प्रतिज्ञा की[a] और अपनी अज्ञानता के प्रायश्चित के लिए मेढ़े चढ़ाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने अपनी पत्नियों को निकाल देने के लिए हाथ लगाए।” यह मुहावरा ऐसा करने का दायित्व लेने या प्रतिबद्ध होने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “उनकी अज्ञानता के लिए।” बलिदानी संदर्भ में इसका अर्थ “उनकी भूल” या “अनजाने में किया गया पाप” भी हो सकता है। ‘मेढ़े चढ़ाए’ में क्रिया संदर्भ से निहित है; यूनानी में वह स्पष्ट रूप से नहीं दी गई है।
    reason: lexical_and_ellipsis_note
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας
  choice: वचन दिया
  rationale: इस मुहावरे का शाब्दिक अर्थ ‘हाथ लगाए’ है, पर इसके बाद आए उद्देश्यवाचक क्रियारूप के साथ इसका आशय किसी काम को करने की प्रतिबद्धता स्वीकार करना है। ‘वचन दिया’ आधुनिक हिन्दी में यह भाव स्पष्ट करता है।
- source_word: ἐκβαλεῖν
  choice: विदा कर देने
  rationale: क्रिया का मूल भाव बाहर निकालना या भेज देना है। वैवाहिक संदर्भ में ‘विदा कर देना’ अलग करने या पत्नी के रूप में त्याग देने का भाव देता है, पर अनावश्यक रूप से हिंसक भाषा से बचता है।
- source_word: τὰς γυναῖκας αὐτῶν
  choice: अपनी पत्नियों
  rationale: यहाँ γυναῖκας सामान्यतः स्त्रियों के लिए नहीं, बल्कि वैवाहिक संबंध में पत्नियों के लिए प्रयुक्त है।
- source_word: εἰς ἐξιλασμόν
  choice: प्रायश्चित के लिए
  rationale: यह बलिदान के द्वारा दोष-निवारण या प्रायश्चित का उद्देश्य व्यक्त करता है। ‘प्रायश्चित’ हिन्दी में संक्षिप्त, प्रतिष्ठित और इस अनुष्ठानिक संदर्भ के अनुकूल है।
- source_word: κριούς
  choice: मेढ़े
  rationale: यूनानी शब्द विशेष रूप से नर भेड़ों अर्थात मेढ़ों को दर्शाता है; बहुवचन भी बनाए रखा गया है।
- source_word: ὑπὲρ τῆς ἀγνοίας αὐτῶν
  choice: अपनी अनजानी भूल के
  rationale: ἀγνοία का मूल अर्थ अज्ञान है, पर बलिदान-संबंधी संदर्भ में यह अनजाने में हुई भूल या पाप का संकेत दे सकता है। ‘अनजानी भूल’ स्वाभाविक हिन्दी में दोनों पहलुओं को निकट रखती है।
- source_word: '[elliptical sacrificial phrase] κριοὺς'
  choice: मेढ़े चढ़ाए
  rationale: यूनानी में मेढ़ों के साथ कोई स्पष्ट क्रिया नहीं दी गई है, पर प्रायश्चित का बलिदानी संदर्भ चढ़ाने की क्रिया को निहित करता है। सहज और पूर्ण हिन्दी वाक्य के लिए ‘चढ़ाए’ स्पष्ट किया गया है।
theological_decisions:
- issue: बलिदानी संदर्भ में ἀγνοία का अर्थ
  choice: अनजानी भूल
  alternative: अज्ञान; अनजाने में किया गया पाप
  rationale: यूनानी शब्द अज्ञान को व्यक्त करता है, किंतु इस प्रायश्चित-बलिदान के संदर्भ में उससे उत्पन्न दोष या अनजाने अपराध का भाव भी संभव है। मुख्य पाठ किसी एक अधिक तकनीकी व्याख्या को निर्णायक बनाए बिना सहज हिन्दी देता है, और पादटिप्पणी विकल्प सुरक्षित रखती है।
- issue: ἐπέβαλον τὰς χεῖρας का मुहावरेदार बल
  choice: वचन दिया
  alternative: हाथ लगाए; करने का बीड़ा उठाया
  rationale: शाब्दिक ‘हाथ लगाए’ हिन्दी में शारीरिक कार्रवाई का भ्रामक संकेत दे सकता है। संदर्भ किसी काम को करने की प्रतिबद्धता का है।
- issue: मेढ़ों के साथ निहित बलिदानी क्रिया
  choice: चढ़ाए
  alternative: 'यूनानी की तरह क्रियारहित वाक्यांश: ‘और प्रायश्चित के लिए मेढ़े’'
  rationale: मूल यूनानी में वाक्यांश संक्षिप्त और क्रियारहित है। हिन्दी में अर्थपूर्ण वाक्य बनाने के लिए संदर्भ से स्पष्ट बलिदानी क्रिया जोड़ी गई है; पादटिप्पणी इस पूर्ति को पारदर्शी बनाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘विदा कर देना’ वैवाहिक अलगाव को स्वाभाविक ढंग से व्यक्त करता है; ‘प्रायश्चित’ बलिदानी संदर्भ की धार्मिक गंभीरता बनाए रखता है। दोनों पादटिप्पणी-चिह्न [a] और [b] मुख्य पाठ में उपस्थित हैं।
