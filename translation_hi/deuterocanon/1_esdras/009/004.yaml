base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/004.yaml
  text: And whoever does not appear within two or three days[a], according to the judgment of the presiding elders, their livestock will be devoted[b], and he himself will be excluded from the assembly of the captivity.
translation:
  language: hi
  text: और जो कोई अध्यक्षता कर रहे पुरनियों के निर्णय के अनुसार दो या तीन दिनों के भीतर उपस्थित न हो, उसके पशु समर्पित कर दिए जाएँगे[a], और उसे स्वयं बंदी बनाकर ले जाए गए लोगों के समुदाय से निकाल दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा अधिक अर्थ-स्पष्ट रूप में, “उसकी संपत्ति जब्त कर ली जाएगी।” यूनानी में “समर्पित कर दिए जाएँगे” है, जिसका इस कानूनी प्रसंग में जब्ती का आशय हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप के निकट: “बंदीवास के जनसमूह से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαντήσωσιν
  choice: उपस्थित न हो
  rationale: इस बुलावे के संदर्भ में क्रिया का अर्थ निर्धारित समय के भीतर आकर उपस्थित होना है, केवल किसी से मिलना नहीं।
- source_word: ἐν δυσὶν ἢ τρισὶν ἡμέραις
  choice: दो या तीन दिनों के भीतर
  rationale: यह आज्ञापालन के लिए दी गई समय-सीमा व्यक्त करता है; ‘के भीतर’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से स्पष्ट करता है।
- source_word: κατὰ τὸ κρῖμα
  choice: निर्णय के अनुसार
  rationale: κρῖμα यहाँ अधिकारपूर्ण न्यायिक निर्णय को सूचित करता है; ‘निर्णय’ औपचारिक अर्थ को सहज हिन्दी में रखता है।
- source_word: τῶν προκαθημένων πρεσβυτέρων
  choice: अध्यक्षता करने वाले पुरनियों के
  rationale: प्रकृत कृदन्त नेतृत्व अथवा अध्यक्षता को व्यक्त करता है; यह रूप यूनानी संरचना और अधिकार-संबंध दोनों को बनाए रखता है।
- source_word: ἀνιερωθήσονται
  choice: समर्पित कर दिए जाएँगे
  rationale: क्रिया का मूल अर्थ किसी वस्तु को समर्पित अथवा अर्पित करना है, यद्यपि इस दंडात्मक कानूनी प्रसंग में इसका व्यावहारिक आशय जब्ती हो सकता है; मुख्य पाठ मूल शब्द की धार्मिक-कानूनी अस्पष्टता बनाए रखता है।
- source_word: τὰ κτήνη αὐτῶν
  choice: उसके पशु
  rationale: κτήνη का सामान्य अर्थ पालतू पशु अथवा मवेशी है। यूनानी में बहुवचन सर्वनाम सामान्य श्रेणी के लोगों की ओर संकेत करता है, पर हिन्दी में ‘जो कोई’ के साथ एकवचन ‘उसके’ स्वाभाविक है।
- source_word: ἀλλοτριωθήσεται
  choice: निकाल दिया जाएगा
  rationale: समुदाय के संबंध में यह निष्कासन या सदस्यता से अलग किए जाने का सामाजिक-कानूनी परिणाम बताता है।
- source_word: ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας
  choice: निर्वासितों के समुदाय से
  rationale: πλῆθος सामूहिक जनसमुदाय को और αἰχμαλωσία निर्वासन/बँधुआई से संबद्ध लोगों को दर्शाता है; यह हिन्दी अनुवाद शाब्दिक कठोरता से बचते हुए अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: आज्ञा न मानने वाले व्यक्ति और उसके पशुओं पर दंड का स्वरूप
  choice: पशुओं को ‘समर्पित’ किए जाने और व्यक्ति को निर्वासितों के समुदाय से निकाले जाने वाला कानूनी-धार्मिक दंड
  alternative: संपत्ति को केवल जब्त कर लेना, जिसमें किसी धार्मिक समर्पण का भाव न हो
  rationale: यूनानी ἀνιερωθήσονται समर्पण का भाव रखता है, जबकि न्यायिक संदर्भ और एज्रा 10:8 का समानांतर पाठ जब्ती की व्यावहारिक शक्ति सुझाते हैं। इसलिए मुख्य पाठ यूनानी की तनावपूर्ण अस्पष्टता बनाए रखता है और पादटिप्पणी कानूनी आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘पुरनियों’ से प्राचीन सामुदायिक पद की बाइबलीय पहचान बनी रहती है; ‘अध्यक्षता करने वाले’ उसके नेतृत्वकारी कार्य को स्पष्ट करता है। मुख्य पाठ यूनानी को प्राथमिक रखता है और उपलब्ध मसोरेटिक समानांतर के असंगत अंश को आधार नहीं बनाता।
