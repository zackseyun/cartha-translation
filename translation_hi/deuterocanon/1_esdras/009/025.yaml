base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/025.yaml
  text: 'From the gatekeepers: Shallumus and Tobanes[a].'
translation:
  language: hi
  text: 'द्वारपालों में से: शल्लूमुस और तोबानेस।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी पाठ: “द्वारपालों में से: शल्लूमुस और तोबानेस।” इस स्थान पर समानांतर इब्रानी परंपरा का पाठ इससे निकटता से मेल नहीं खाता और इन नामों को इन्हीं रूपों में सुरक्षित नहीं रखता।'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν θυρωρῶν
  choice: द्वारपालों में से
  rationale: सूची के इस संदर्भ में ἐκ किसी वर्ग में से नामित व्यक्तियों को प्रस्तुत करता है। θυρωρός द्वार की रखवाली करने वाले अधिकारी के लिए है; इसलिए आधुनिक और स्वाभाविक हिन्दी में ‘द्वारपालों में से’ उपयुक्त है।
- source_word: Σάλλουμος
  choice: शल्लूमुस
  rationale: यूनानी नाम-रूप और उसके अंतिम -ος को हिन्दी में निकटता से सुरक्षित रखा गया है; इसे किसी परिचित इब्रानी रूप से मिलाना उचित नहीं होगा।
- source_word: καὶ
  choice: और
  rationale: दोनों नामों को जोड़ने वाला सामान्य समुच्चयबोधक।
- source_word: Τοβάνης
  choice: तोबानेस
  rationale: यूनानी Τοβάνης का सीधा देवनागरी लिप्यंतरण किया गया है; ‘तोबियाह’ जैसा रूप अपनाने से अनावश्यक सामंजस्य स्थापित होता।
