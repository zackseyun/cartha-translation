base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/049.yaml
  text: 'And Attarates said to Ezra the chief priest and reader[a], and to the Levites who were teaching the multitude[b], to all of them:'
translation:
  language: hi
  text: 'और अत्तराते[a] ने प्रधान याजक और पाठक एज्रा[b] से, और जनसमूह को शिक्षा दे रहे लेवियों से, सभी लोगों से कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अत्तराते” संभवतः इब्रानी समानांतर में उल्लिखित “नहेमायाह तिर्शाता,” अर्थात् अधिपति, के अनुरूप है।
    reason: alternative_reading
  - marker: b
    text: यहाँ यूनानी पाठ एज्रा को “प्रधान याजक और पाठक” कहता है; इब्रानी समानांतर में “याजक और शास्त्री” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶπεν
  choice: और ... ने ... कहा
  rationale: यूनानी के सामान्य कथात्मक संयोजक और कथन-क्रिया को सहज हिन्दी में बनाए रखता है।
- source_word: Ἀτταρατὴ
  choice: अत्तराते
  rationale: यूनानी पाठ में आए नाम अथवा उपाधि-रूप का लिप्यंतरण किया गया है; इब्रानी समानांतर की पहचान मुख्य पाठ में आरोपित नहीं की गई।
- source_word: Ἔσρᾳ
  choice: एज्रा
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: τῷ ἀρχιερεῖ
  choice: प्रधान याजक
  rationale: ἀρχιερεύς का सीधा और गरिमापूर्ण अनुवाद, जो यूनानी साक्ष्य में व्यक्त पद को दर्शाता है।
- source_word: καὶ ἀναγνώστῃ
  choice: और पाठक
  rationale: ἀναγνώστης का मूल अर्थ ‘पढ़ने वाला/पाठक’ है; इब्रानी समानांतर के ‘शास्त्री’ को मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
- source_word: τοῖς Λευείταις τοῖς διδάσκουσι τὸ πλῆθος
  choice: जनसमूह को शिक्षा दे रहे लेवियों से
  rationale: वर्तमान कृदन्त की जारी गतिविधि और πλῆθος के सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ πάντας
  choice: उन सभी से
  rationale: यूनानी वाक्यांश कुछ असहज है; इब्रानी समानांतर ‘सब लोगों से’ की दिशा में संकेत करता है। यह अनुवाद संदर्भगत संबोधन को व्यक्त करते हुए अस्पष्टता पर टिप्पणी भी रखता है।
theological_decisions:
- issue: Ἀτταρατὴ की पहचान
  choice: मुख्य पाठ में यूनानी रूप ‘अत्तराते’ रखा गया।
  alternative: ‘नहेमायाह अधिपति’ अथवा ‘तिर्शाता’
  rationale: 1 एस्द्रास के लिए यूनानी प्राथमिक साक्ष्य है। इब्रानी समानांतर इस व्यक्ति को नहेमायाह तिर्शाता के रूप में पहचानता है, पर उस पहचान से यूनानी रूप को चुपचाप बदलना उचित नहीं।
- issue: एज्रा की पदवी
  choice: ‘प्रधान याजक और पाठक’
  alternative: ‘याजक और शास्त्री’
  rationale: यूनानी में ἀρχιερεύς और ἀναγνώστης हैं, जबकि इब्रानी समानांतर में ‘याजक, शास्त्री’ है। मुख्य पाठ यूनानी को दर्शाता है और पाठांतर को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध स्तर अपनाया गया है। यूनानी पाठ की प्राथमिकता रखते हुए दोनों वास्तविक पाठगत अंतरों—अत्तराते की पहचान और एज्रा की पदवी—को पादटिप्पणियों में स्पष्ट किया गया है।
