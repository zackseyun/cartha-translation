lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: यह संयोजक और कालवाचक पद को सीधे रखता है तथा पिछले उपदेश से प्रवाह बनाए रखता है।
- source_word: δότε
  choice: करो / मान लो
  rationale: 'शाब्दिक अर्थ ‘दो’ है, पर हिन्दी में ὁμολογίαν और δόξαν के साथ अलग-अलग स्वाभाविक क्रियाएँ आवश्यक हैं: ‘पाप मान लो’ और ‘महिमा करो’।'
- source_word: ὁμολογίαν
  choice: अपने पाप मान लो
  rationale: शब्द ‘स्वीकारोक्ति’ या ‘अंगीकार’ का अर्थ दे सकता है। पश्चात्ताप के प्रसंग में हिन्दी का यह स्पष्ट और स्वाभाविक प्रयोग आशय प्रकट करता है; निहित ‘पाप’ को जोड़ने की सूचना पादटिप्पणी में दी गई है।
- source_word: δόξαν
  choice: महिमा
  rationale: ‘महिमा करना’ बाइबलीय धार्मिक मुहावरे को बनाए रखता है; ‘आदर’ संभव है, पर यूनानी δόξα का पूरा धार्मिक स्वर कम कर देता है।
- source_word: τῷ κυρίῳ
  choice: प्रभु
  rationale: यहाँ κύριος इस्राएल के परमेश्वर के लिए प्रयुक्त हुआ है, इसलिए ‘प्रभु’ उपयुक्त है।
- source_word: θεῷ τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के ... परमेश्वर
  rationale: ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक और समावेशी वंशगत अभिव्यक्ति है, जबकि मूल का वाचा-संबंधी सूत्र सुरक्षित रहता है।
theological_decisions:
- issue: पश्चात्ताप के प्रसंग में ὁμολογίαν का अर्थ
  choice: अपने पाप मान लो
  alternative: अंगीकार करो / स्वीकार करो
  rationale: आसपास का प्रसंग अपराध स्वीकार करने का है। फिर भी यूनानी संज्ञा में ‘अभिस्वीकृति’ का व्यापक अर्थ संभव है, इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- issue: δότε के साथ दो कर्मों का हिन्दी रूप
  choice: पाप मान लो और उसकी महिमा करो
  alternative: अंगीकार और महिमा दो
  rationale: एक ही यूनानी क्रिया दोनों संज्ञाओं पर लागू होती है, लेकिन उसका शाब्दिक अनुकरण हिन्दी में अस्वाभाविक होगा। दो क्रियाओं का प्रयोग अर्थ-संबंध को स्पष्ट करता है, बिना किसी अतिरिक्त धर्मसिद्धान्त के।
- issue: πατέρων का अनुवाद
  choice: पूर्वजों
  alternative: पितरों
  rationale: ‘पूर्वजों’ सामान्य आधुनिक हिन्दी में अधिक बोधगम्य है और वंशगत आशय को सुरक्षित रखता है; ‘पितरों’ से अनचाहा कर्मकाण्डीय अर्थ जुड़ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हमारे पूर्वजों के प्रभु परमेश्वर’ वाचा-संबंधी सूत्र को सुरक्षित रखता है। वाक्यांश के अंत में अल्पविराम इसलिए रखा गया है क्योंकि उपलब्ध यूनानी अंश आगे जारी रहने वाले वाक्य का भाग है।
