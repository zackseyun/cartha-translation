base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/046.yaml
  text: And when the law was read[a], they all stood upright; and Azarias blessed the Most High God, the Lord of hosts, the Almighty[c][b],
translation:
  language: hi
  text: जब व्यवस्था की पुस्तक खोली गई[a], तब वे सब सीधे खड़े हो गए; और अज़रियास[b] ने परमप्रधान परमेश्वर, सेनाओं के परमेश्वर[c], सर्वशक्तिमान की स्तुति की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब व्यवस्था खोली या फैलाकर खोली गई।” यूनानी क्रिया का मूल अर्थ “ढीला करना/खोलना” है; यहाँ सार्वजनिक पाठ के लिए व्यवस्था की पुस्तक खोलना अभिप्रेत है। संदर्भ के अनुसार अनुवाद “जब व्यवस्था पढ़ी गई” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अज़रियास; इब्रानी समानांतर में अजर्याह।
    reason: alternative_reading
  - marker: c
    text: यूनानी में सबाओत है, जो इब्रानी से आई उपाधि है और जिसका अर्थ “सेनाएँ” है। यूनानी में ‘स्वामी’ के लिए अलग शब्द नहीं है; यहाँ ‘सेनाओं के परमेश्वर’ से इस उपाधि का अर्थ व्यक्त किया गया है।
    reason: source_transparency
lexical_decisions:
- source_word: ἐν τῷ λῦσαι
  choice: जब ... खोली गई
  rationale: यह रचना समय बताती है। λύω का मूल अर्थ ‘खोलना/बंधन मुक्त करना’ है; व्यवस्था के सार्वजनिक पाठ के संदर्भ में यह ग्रंथ अथवा पुस्तक खोलने को सूचित करता है। ‘पढ़ी गई’ संदर्भगत अर्थ हो सकता है, पर यूनानी क्रिया में वह सीधे व्यक्त नहीं है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: νόμος यहाँ तोराह अथवा सार्वजनिक रूप से प्रस्तुत की जा रही ईश्वरीय व्यवस्था को दर्शाता है। ‘व्यवस्था’ प्रचलित, संक्षिप्त और स्रोत के निकट है।
- source_word: πάντες ὀρθοὶ ἔστησαν
  choice: वे सब सीधे खड़े हो गए
  rationale: ὀρθοί केवल खड़े होने के बजाय सीधी खड़ी मुद्रा पर बल देता है; ‘सीधे खड़े हो गए’ इस सूक्ष्मता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εὐλόγησεν
  choice: स्तुति की
  rationale: परमेश्वर को लक्ष्य बनाकर εὐλογέω का अर्थ उन्हें धन्य कहना अथवा उनकी स्तुति करना है। आधुनिक हिन्दी में ‘स्तुति की’ स्पष्ट और स्वाभाविक है, जबकि ‘आशीष दी’ भ्रामक हो सकता है।
- source_word: Ἀζαρίας
  choice: अजरियास
  rationale: प्राथमिक यूनानी पाठ के नामरूप Ἀζαρίας का लिप्यंतरण किया गया है; इब्रानी समानांतर का ‘अजर्याह’ पादटिप्पणी में रखा गया है।
- source_word: τῷ ὑψίστῳ θεῷ
  choice: परमप्रधान परमेश्वर
  rationale: यह परिचित ईश्वरीय उपाधि का सटीक और सहज हिन्दी रूप है।
- source_word: σαβαὼθ
  choice: सेनाओं के स्वामी
  rationale: σαβαώθ इब्रानी ‘सेनाओं’ से आई पारंपरिक ईश्वरीय उपाधि है। हिन्दी में अकेला ‘सेनाओं’ अस्वाभाविक होता; ‘सेनाओं के स्वामी’ उपाधि का अर्थ स्पष्ट करता है। चूँकि यूनानी में κύριος अलग से नहीं लिखा है, यह बात पादटिप्पणी में बताई गई है।
- source_word: Παντοκράτορι
  choice: सर्वशक्तिमान
  rationale: παντοκράτωρ की व्यापक शासन-सामर्थ्य को व्यक्त करने वाली परिचित और जनसुलभ ईश्वरीय उपाधि।
theological_decisions:
- issue: τῷ ὑψίστῳ θεῷ σαβαὼθ Παντοκράτορι में ईश्वरीय उपाधियों की शृंखला
  choice: परमप्रधान परमेश्वर, सेनाओं के स्वामी, सर्वशक्तिमान
  alternative: परमप्रधान परमेश्वर सबाओत, सर्वशक्तिमान
  rationale: यूनानी पाठ अनेक उपाधियों को एक साथ रखता है; अनुवाद में इस संचय को बनाए रखा गया है। σαβαώθ को केवल लिप्यंतरित करने के बजाय उसका अर्थ दिया गया है, पर पाठक को स्रोत की वास्तविक बनावट बताने के लिए पादटिप्पणी जोड़ी गई है।
- issue: परमेश्वर के लिए εὐλόγησεν का अर्थ
  choice: स्तुति की
  alternative: धन्य कहा
  rationale: दोनों अर्थ संभव हैं। ‘स्तुति की’ आधुनिक पाठक के लिए क्रिया का अभिप्राय स्पष्ट करती है और यह गलत धारणा रोकती है कि अजरियास ने परमेश्वर को कोई आशीष प्रदान की।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘व्यवस्था’, ‘परमप्रधान’ और ‘सर्वशक्तिमान’ जैसे परिचित बाइबिलीय पद बनाए गए हैं, जबकि कठिन यूनानी और सेमिटिक उपाधियों को पादटिप्पणियों में स्पष्ट किया गया है।
