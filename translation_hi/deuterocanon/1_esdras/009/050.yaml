base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/050.yaml
  text: This day is holy to the Lord[a], and all were weeping when they heard the law.
translation:
  language: hi
  text: यह दिन प्रभु के लिए पवित्र है[a]; और व्यवस्था को सुनते समय सभी रो रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नहेमायाह 8 के इब्रानी समानांतर पाठ में ‘हमारे प्रभु’ है और इसके आगे खाने, पीने, भाग बाँटने तथा उदास न होने का निर्देश आता है; यहाँ 1 एस्द्रास के यूनानी पाठ में संक्षिप्त शब्दावली है।
    reason: cross_reference
lexical_decisions:
- source_word: Ἡ ἡμέρα αὕτη
  choice: यह दिन
  rationale: यह सीधा और स्वाभाविक अनुवाद है तथा संकेतवाचक बल को बनाए रखता है।
- source_word: ἁγία
  choice: पवित्र
  rationale: धार्मिक संदर्भ में यह यूनानी शब्द का प्रचलित और अर्थपूर्ण हिन्दी समतुल्य है।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: सम्प्रदान कारक यहाँ समर्पण अथवा संबंध व्यक्त करता है। यूनानी पाठ में ‘हमारे’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: πάντες
  choice: सभी
  rationale: यूनानी में संज्ञा जोड़े बिना सामूहिक अर्थ व्यक्त होता है; ‘सभी लोग’ कहना अनावश्यक विस्तार होता।
- source_word: ἔκλαιον
  choice: रो रहे थे
  rationale: अपूर्ण भूतकाल जारी क्रिया को दर्शाता है, जिसे हिन्दी का यह रूप स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῷ ἀκοῦσαι
  choice: सुनते समय
  rationale: सव्यय भाववाचक क्रिया का कालवाचक अर्थ है; यह हिन्दी में स्वाभाविक है और सुनने की प्रक्रिया के साथ रोने का संबंध बनाए रखता है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: इस प्रसंग में νόμος सार्वजनिक रूप से पढ़ी जा रही तोराह/व्यवस्था को सूचित करता है; ‘व्यवस्था’ स्थापित बाइबलीय हिन्दी है।
theological_decisions:
- issue: क्या मसोराई समानांतर पाठ के ‘हमारे प्रभु’ तथा खाने, पीने, बाँटने और शोक न करने के निर्देशों को जोड़ा जाए
  choice: केवल यूनानी पाठ की संक्षिप्त शब्दावली रखी गई है।
  alternative: नहेमायाह 8 के समानांतर इब्रानी पाठ के अनुसार ‘हमारे प्रभु’ और आगे के निर्देश जोड़ना।
  rationale: प्राथमिक पाठ यूनानी है। इब्रानी समानांतर प्रसंग की पुष्टि करता है, पर यहाँ 1 एस्द्रास का यूनानी पाठ छोटा है; दोनों को चुपचाप मिलाना पाठांतर को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘व्यवस्था’ बाइबलीय संदर्भ में परिचित है; वाक्य का संक्षिप्त रूप यूनानी स्रोत की संक्षिप्तता और अपूर्ण भूतकाल की निरंतरता दोनों को बनाए रखता है।
