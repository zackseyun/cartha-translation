translation:
  language: hi
  text: दो दिनों में भी नहीं[a], क्योंकि इन बातों में हमने बहुत पाप किया है। पर लोगों के अगुए खड़े हों, और हमारी बस्तियों[b] के वे सब लोग जिनकी परदेशी पत्नियाँ हैं, वे नियत समय पर[c] आएँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘दो भी नहीं’ है; प्रसंग का अर्थ है कि यह काम दो दिनों में भी पूरा नहीं हो सकता।
    reason: lexical_alternative
  - marker: b
    text: या ‘नगरों’; यूनानी शब्द उन आबाद स्थानों और समुदायों को दर्शाता है जहाँ लोग रहते थे।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी का अंतिम वाक्यांश संक्षिप्त है: ‘समय लेकर।’ आशय संभवतः प्रत्येक मामले के लिए नियत समय पर उपस्थित होना है।'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ δύο
  choice: दो दिनों में भी नहीं
  rationale: यूनानी पद दीर्घवृत्तात्मक है; प्रसंग में आशय है कि यह काम दो दिनों में भी पूरा नहीं हो सकता। ‘भी नहीं’ οὐδέ के बल को बनाए रखता है।
- source_word: ἐπὶ πλεῖον ἡμάρτομεν
  choice: हमने बहुत पाप किया है
  rationale: ἐπὶ πλεῖον अपराध की अधिकता या गंभीरता बताता है, और ἁμαρτάνω का नैतिक-धार्मिक अर्थ ‘पाप करना’ स्वाभाविक रूप से सुरक्षित रहता है।
- source_word: οἱ προηγούμενοι τοῦ πλήθους
  choice: लोगों के अगुए
  rationale: προηγούμενοι आगे चलने या नेतृत्व करने वालों को दर्शाता है। ‘अगुए’ आधुनिक धार्मिक-सामुदायिक प्रसंग में सुबोध है और ‘शासक’ जैसा अतिरिक्त अधिकार नहीं जोड़ता।
- source_word: τῶν κατοικιῶν ἡμῶν
  choice: हमारी बस्तियों
  rationale: κατοικίαι यहाँ अलग-अलग घरों के बजाय आबाद स्थानों या समुदायों की ओर संकेत करता है।
- source_word: γυναῖκας ἀλλογενεῖς
  choice: परदेशी स्त्रियों से विवाह किया है
  rationale: शाब्दिक संरचना ‘परदेशी पत्नियाँ रखते हैं’ है; हिन्दी में वैवाहिक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करने के लिए यह रूप चुना गया, जबकि ἀλλογενεῖς का दूसरे जनसमूह से संबंधित होने का भाव बना रहता है।
- source_word: παραγενηθήτωσαν λαβόντες χρόνου
  choice: वे नियत समय पर आएँ
  rationale: अंतिम यूनानी वाक्यांश संक्षिप्त है—शाब्दिक रूप से ‘समय लेकर’। प्रशासनिक प्रसंग में किसी ठहराए या आवंटित समय पर उपस्थित होना अभिप्रेत प्रतीत होता है।
theological_decisions:
- issue: अपराध का नैतिक स्वरूप
  choice: हमने बहुत पाप किया है
  alternative: हमसे बहुत बड़ी गलती हुई है
  rationale: यूनानी ἡμάρτομεν स्पष्ट रूप से पाप का बोध कराता है। इसलिए इसे केवल प्रशासनिक भूल या सामान्य गलती बनाकर हल्का नहीं किया गया।
- issue: ἀλλογενεῖς का सामुदायिक अर्थ
  choice: परदेशी स्त्रियाँ
  alternative: दूसरे कुल की स्त्रियाँ
  rationale: शब्द दूसरे जनसमूह से संबंधित स्त्रियों को दर्शाता है। ‘परदेशी’ पाठ का भेद बनाए रखता है, पर आधुनिक नस्ली शब्दावली आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य से जुड़ा अंश है, इसलिए आरंभ और अंत की अपूर्ण वाक्य-संरचना तथा अंतिम अल्पविराम सुरक्षित रखा गया है।
