base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/017.yaml
  text: And the matter concerning the men who had taken foreign women was brought to an end by the new moon of the first month[a][b].
translation:
  language: hi
  text: और जिन पुरुषों ने परदेशी स्त्रियों से विवाह किया था, उनसे संबंधित मामलों का निपटारा पहले महीने के नए चाँद तक कर दिया गया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी पाठ कठिन है। संबंधित कृदंत का अधिक शाब्दिक अनुवाद ‘जो इकट्ठे किए गए थे’ हो सकता है। लगभग समानांतर इब्रानी पाठ के अनुसार संदर्भ उन पुरुषों का है जिन्होंने परदेशी स्त्रियों से विवाह किया था; मुख्य पाठ में इसी प्रासंगिक अर्थ का अनुसरण किया गया है।
    reason: alternative_reading
  - marker: b
    text: ‘पहले महीने का नया चाँद’ चंद्र पंचांग में पहले महीने के पहले दिन को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  choice: निपटा दिया गया
  rationale: यह यूनानी कर्मवाच्य मुहावरा किसी कार्य को अंत या पूर्णता तक पहुँचाने का भाव देता है। न्यायिक जाँच के संदर्भ में ‘निपटा दिया गया’ स्वाभाविक और स्पष्ट है।
- source_word: τὰ κατὰ τοὺς ἄνδρας
  choice: पुरुषों से संबंधित मामला
  rationale: κατά के साथ नपुंसकलिंग बहुवचन यहाँ उन पुरुषों से जुड़े मामले या प्रकरण को सूचित करता है। हिंदी में एकवचन सामूहिक ‘मामला’ सहज है।
- source_word: τοὺς ἐπισυναχθέντας
  choice: रखनेवाले
  rationale: प्राप्त यूनानी रूप का अधिक शाब्दिक अर्थ ‘इकट्ठे किए गए’ हो सकता है, पर वाक्य में γυναῖκας इसका कर्म प्रतीत होता है और पाठ कठिन है। समानांतर इब्रानी पाठ के ‘परदेशी स्त्रियाँ ब्याह ली थीं’ वाले संदर्भ के आधार पर मुख्य पाठ में स्त्रियाँ ग्रहण करने का प्रासंगिक अर्थ रखा गया है, जबकि कठिन यूनानी रूप को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: γυναῖκας ἀλλογενεῖς
  choice: परदेशी स्त्रियाँ
  rationale: ἀλλογενής दूसरे लोगों या समुदाय से संबंधित व्यक्ति को दर्शाता है। ‘परदेशी स्त्रियाँ’ एज्रा के संदर्भ में स्पष्ट, गरिमापूर्ण और इब्रानी समानांतर נָשִׁים נָכְרִיּוֹת के अनुरूप है।
- source_word: ἕως τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: पहले महीने के नए चाँद तक
  rationale: νουμηνία विशेष रूप से अमावस्या/नए चाँद और उससे आरंभ होने वाले महीने के पहले दिन को दर्शाता है। ‘तक’ यूनानी ἕως को बनाए रखता है; सांस्कृतिक आशय पादटिप्पणी में स्पष्ट है।
