base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/043.yaml
  text: And Mattathias[a], Sammou, Ananias, Azarias, Ourias, Ezekias, and Baalsamos stood at his right hand,
translation:
  language: hi
  text: और मत्तथियास[a], सम्मू, अननियास, अज़रियास, ऊरियास, एज़ेकियास और बालसामोस उसके दाहिने खड़े हुए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दिए गए यूनानी नाम नहेमायाह 8:4 के लगभग समानांतर इब्रानी पाठ में एज्रा के दाहिने खड़े पुरुषों की सूची से भिन्न हैं। चूँकि 1 एस्द्रास का अनुवाद यूनानी पाठ से किया गया है, इसलिए यहाँ यूनानी नाम-रूप रखे गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησεν
  choice: खड़े हुए
  rationale: यूनानी रूप व्याकरण की दृष्टि से सकर्मक, ‘उसने खड़ा किया’, है; पर नामों की सूची और स्थानसूचक पदबंध के साथ प्रसंग का स्वाभाविक हिन्दी अर्थ है कि ये पुरुष उसके दाहिने खड़े हुए।
- source_word: αὐτῷ
  choice: उसके
  rationale: 'दत्तिवाचक सर्वनाम को स्थानसूचक हिन्दी पदबंध में संबंधसूचक रूप से व्यक्त किया गया है: ‘उसके दाहिने’। प्रसंग में इसका संकेत एज्रा की ओर है, पर नाम जोड़कर अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।'
- source_word: ἐκ δεξιῶν
  choice: उसके दाहिने
  rationale: यह ठोस स्थान बताने वाला प्रचलित पदबंध है; आधुनिक हिन्दी में ‘उसके दाहिने’ स्वाभाविक और सटीक है।
- source_word: Ματταθίας, Σαμμοῦ, Ἀνανίας, Ἀζαρίας, Οὐρείας, Ἐζεκίας, Βαάλσαμος
  choice: मत्तथियास, सम्मू, अननियास, अज़रियास, ऊरियास, यहेज़कियास और बालसामोस
  rationale: नाम प्राथमिक यूनानी पाठ के रूपों से देवनागरी में लिप्यंतरित किए गए हैं; उन्हें नहेमायाह 8:4 की भिन्न इब्रानी सूची के अनुसार सामान्यीकृत नहीं किया गया।
