base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/044.yaml
  text: 'And from the left: Phaladaios[a], Meisael, Melcheias, Lothasoubos, Nabareias[b], Zechariah.'
translation:
  language: hi
  text: 'और बाईं ओर से: फलादायोस[a], मेइसाएल, मेलखेयास, लोथासूबोस, नाबारेयास[b] और जकर्याह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाईं ओर।’ यूनानी पदबंध सभा या समूह में स्थान को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ कई नाम 1 एस्द्रास में पाए जाने वाले यूनानी रूपों के अनुसार दिए गए हैं। अनुमानित इब्रानी समानांतर पाठ में इनके अधिक परिचित रूप हो सकते हैं, पर मुख्य पाठ में यूनानी साक्ष्य का अनुसरण किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ εὐωνύμων
  choice: बाईं ओर से
  rationale: यह यूनानी पदबंध शाब्दिक रूप से बाईं ओर को सूचित करता है। नामों की इस सूची में यह सभा या समूह के भीतर लोगों की स्थिति बताता है।
- source_word: Φαλαδαῖος
  choice: फलादायोस
  rationale: व्यक्तिनाम को प्राथमिक यूनानी पाठ के उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: Μεισαήλ
  choice: मेइसाएल
  rationale: यूनानी रूप को सीधे लिप्यंतरित किया गया है; अधिक परिचित सामी रूप से इसका सामंजस्य नहीं किया गया।
- source_word: Μελχείας
  choice: मेलखेयास
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण रखा गया है, ताकि अनिश्चित इब्रानी समकक्ष को मुख्य पाठ में न थोपा जाए।
- source_word: Λωθάσουβος
  choice: लोथासूबोस
  rationale: यह 1 एस्द्रास का विशिष्ट और कठिन यूनानी नामरूप है; अनुमानित समानांतर पाठ के आधार पर इसे किसी दूसरे नाम से नहीं बदला गया।
- source_word: Ναβαρείας
  choice: नाबारेयास
  rationale: प्राथमिक यूनानी साक्ष्य के नामरूप को रखा गया है; किसी संभावित इब्रानी पहचान को निश्चित नहीं माना गया।
- source_word: Ζαχαρίας
  choice: जकर्याह
  rationale: इस परिचित बाइबलीय नाम के लिए आधुनिक हिन्दी में प्रचलित रूप चुना गया है; यह पाठक के लिए सहज है और नाम की पहचान बनाए रखता है।
