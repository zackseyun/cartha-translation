base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/026.yaml
  text: 'From Israel[a], from the sons of Phoros: Jerma and Jezias and Melcheias and Mielos and Eleazar and Asebeias and Bannaias.'
translation:
  language: hi
  text: 'इस्राएल में से[a], फोरोस के पुत्रों में से: येरमा, येज़ेयास, मेलखेयास, मीएलोस, एलीआज़र, असेबेयास और बन्नायास।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के कई नाम सम्भवतः एज्रा 10 की समानांतर सूची में पाए जाने वाले इब्रानी नाम-रूपों से मेल खाते हैं—जैसे फोरोस के लिए पारोश और बन्नायास के लिए बनायाह। क्योंकि यहाँ 1 एस्द्रास का अनुवाद उसके यूनानी पाठ से किया गया है, मुख्य पाठ में यूनानी नाम-रूप रखे गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ Ἰσραήλ
  choice: इस्राएल में से
  rationale: दोहराया गया ἐκ किसी बड़े समूह में से व्यक्तियों को अलग करके बताता है। ‘में से’ हिन्दी में सूची की इस भूमिका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τῶν υἱῶν Φορός
  choice: फोरोस के पुत्रों में से
  rationale: υἱῶν का शाब्दिक अर्थ ‘पुत्रों’ है, यद्यपि वंशावली-सूचियों में यह वंशजों या कुल को भी सूचित कर सकता है। यहाँ यूनानी सूची की औपचारिक रचना सुरक्षित रखी गई है।
- source_word: Φορός
  choice: फोरोस
  rationale: मुख्य यूनानी पाठ Φορός देता है; इसलिए इब्रानी-समानांतर के ‘पारोश’ से बदलने के बजाय यूनानी नाम-रूप का देवनागरी लिप्यंतरण किया गया है।
- source_word: Ἰερμὰ
  choice: येरमा
  rationale: यूनानी नाम-रूप का निकट देवनागरी लिप्यंतरण।
- source_word: Ἰεζείας
  choice: येज़ेयास
  rationale: यूनानी Ἰεζείας की ध्वनि और उसके -είας अंत को यथासंभव सुरक्षित रखने वाला लिप्यंतरण।
- source_word: Μελχείας
  choice: मेलखेयास
  rationale: यूनानी नाम-रूप का रूढ़ इब्रानी रूप में सामान्यीकरण किए बिना निकट लिप्यंतरण।
- source_word: Μίηλος
  choice: मीएलोस
  rationale: असामान्य नाम होने के कारण यूनानी स्वर-क्रम को स्पष्ट रखते हुए सावधान लिप्यंतरण किया गया है।
- source_word: Ἐλεάζαρος
  choice: एलीआज़र
  rationale: हिन्दी बाइबल परंपरा में पहचाना जाने वाला स्वाभाविक नाम-रूप, जो यूनानी Ἐλεάζαρος से मेल खाता है।
- source_word: Ἀσεβείας
  choice: असेबेयास
  rationale: संभावित इब्रानी समकक्ष से प्रतिस्थापित किए बिना यूनानी पाठ का सीधा लिप्यंतरण।
- source_word: Βανναίας
  choice: बन्नायास
  rationale: यूनानी में दोहरे ν और नाम के अंत को दर्शाने वाला लिप्यंतरण; इसे इब्रानी-संगत ‘बनायाह’ में सामान्यीकृत नहीं किया गया।
