base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/010.yaml
  text: And the whole assembly cried out and said with a loud voice[a], “So, as you have said[b], we will do.”
translation:
  language: hi
  text: और सारी सभा ने ऊँचे स्वर से पुकारकर कहा, “जैसा आपने कहा है, वैसा ही हम करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησαν
  choice: पुकारकर कहा
  rationale: यह क्रिया सार्वजनिक रूप से ऊँची आवाज़ में बोलने को व्यक्त करती है। अगले καὶ εἶπον के साथ हिन्दी में ‘पुकारकर कहा’ स्वाभाविक है और दोनों क्रियाओं का भाव बनाए रखता है।
- source_word: πᾶν τὸ πλῆθος
  choice: सारी सभा
  rationale: शाब्दिक अर्थ ‘पूरी भीड़/जनसमूह’ है; प्रसंग में संगठित रूप से एकत्र समुदाय के लिए ‘सारी सभा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: μεγάλῃ τῇ φωνῇ
  choice: ऊँचे स्वर से
  rationale: यूनानी मुहावरे का सहज हिन्दी रूप है और सामूहिक उद्घोष की प्रबलता को बनाए रखता है।
- source_word: Οὕτως ὡς εἴρηκας
  choice: जैसा आपने कहा है, वैसा ही
  rationale: Οὕτως और ὡς के परस्पर संबंध को हिन्दी की ‘जैसा…वैसा ही’ संरचना स्पष्ट और स्वाभाविक रूप से व्यक्त करती है; पूर्णकाल εἴρηκας का वर्तमान प्रभाव ‘कहा है’ में सुरक्षित है।
- source_word: ποιήσομεν
  choice: हम करेंगे
  rationale: यह भविष्यकालीन संकल्प का सीधा और स्वाभाविक हिन्दी अनुवाद है।
theological_decisions:
- issue: एकत्र लोगों की सार्वजनिक, सामूहिक प्रतिक्रिया का स्वरूप
  choice: सारी सभा
  alternative: पूरा जनसमूह / सारी भीड़
  rationale: πλῆθος स्वयं ‘जनसमूह’ या ‘भीड़’ हो सकता है, पर इस औपचारिक सामुदायिक प्रसंग में ‘सभा’ संगठित एकत्रीकरण को बेहतर व्यक्त करता है, बिना किसी विशिष्ट कलीसियाई अर्थ को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सार्वजनिक सामूहिक कथन के अनुरूप। आदरसूचक ‘आपने’ प्रसंग में अगुवे को संबोधन के लिए स्वाभाविक है। किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई, क्योंकि वैकल्पिक अर्थ मूल आशय को महत्वपूर्ण रूप से नहीं बदलते।
