base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/003.yaml
  text: And a proclamation was made throughout all Judea and Jerusalem to all those from the captivity[a], to assemble in Jerusalem.
translation:
  language: hi
  text: और सारे यहूदिया और यरूशलेम भर में बंदीगिरी से आए हुए सब लोगों को यह घोषणा की गई कि वे यरूशलेम में इकट्ठे हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “निर्वासन से लौटे हुए सभी लोगों को।” यूनानी में शाब्दिक रूप से, “बंदीगिरी से सभी लोगों को” है; “आए हुए” हिन्दी में अर्थ को स्वाभाविक बनाने के लिए जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο κήρυγμα
  choice: यह घोषणा कराई गई
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘एक घोषणा हुई’ है। ‘घोषणा कराई गई’ सार्वजनिक उद्घोषणा के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और κήρυγμα को औपचारिक ‘राजाज्ञा’ नहीं बनाता।
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: सारे यहूदिया और यरूशलेम में
  rationale: ἐν यहाँ उस पूरे क्षेत्र और नगर को बताता है जहाँ घोषणा प्रसारित की गई। ‘सारे ... में’ व्यापक प्रसार का अर्थ सहज रूप से देता है।
- source_word: πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: बँधुआई से आए सभी लोगों के लिए
  rationale: ἐκ का ‘से’ और αἰχμαλωσία का ‘बँधुआई’ अर्थ बनाए रखा गया है। ‘आए’ हिन्दी में इस अधूरे-से लगने वाले यूनानी पदबंध को समझने योग्य बनाता है, पर लौटने की बात को मुख्य पाठ में आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: συναχθῆναι
  choice: कि वे ... इकट्ठे हों
  rationale: यह निष्क्रिय अनंत क्रिया घोषणा की विषय-वस्तु अथवा उद्देश्य बताती है। हिन्दी में ‘कि वे इकट्ठे हों’ बुलावे का भाव स्पष्ट और स्वाभाविक रूप से देता है, जबकि यूनानी निष्क्रिय रूप को कृत्रिम ढंग से नहीं दोहराता।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: εἰς मूलतः दिशा या गंतव्य दर्शाता है; συναχθῆναι के साथ हिन्दी में सभा के स्थान को ‘यरूशलेम में इकट्ठे हों’ कहना अधिक स्वाभाविक है।
