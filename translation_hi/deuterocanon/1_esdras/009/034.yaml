base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/034.yaml
  text: 'And from the sons of Baanei: Jeremias[a], Momdios, Maeros, Jouna, Mamdai, and Pedias, and Anos, Carabasion, and Enaseibos, and Mamntanaimos, Eliaseis, Bannous, Edialeis, Someis, Selemias, Nathanias; and from the sons of Exora: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b], Phosepos.'
translation:
  language: hi
  text: 'और बाअनेई के पुत्रों में से: येरेमियास[a], मोमदेइओस, माएरोस, यूना, ममदाई, पेदियास, अनोस, काराबासियोन, एनासेइबोस, मम्न्तानाइमोस, एलियासेइस, बन्नूस, एदियालेइस, सोमेइस, सेलेमियास और नथानियास; और एक्सोरा के पुत्रों में से: सेसेइस, एज्रेइल, अजाएलोस, समातोस, जाम्ब्रेइ[b] और फोसेपोस।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के अनेक नाम यूनानी पाठ के निकट लिप्यंतरण में रखे गए हैं; उन्हें समानांतर परंपरा के अधिक परिचित इब्रानी रूपों से नहीं मिलाया गया, क्योंकि यहाँ 1 एस्द्रास का यूनानी पाठ अनुवाद का प्राथमिक स्रोत है।
    reason: lexical_alternative
  - marker: b
    text: इस भाग का मसोरा-पाठ में समानांतर संदर्भ (एज्रा 10 का प्रसंग) केवल लगभग समान है और नामों का यही पूरा क्रम इन्हीं रूपों में सुरक्षित नहीं रखता; इसलिए यहाँ यूनानी सूची को आधार बनाया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: और ... के पुत्रों में से
  rationale: यह वाक्यांश बड़ी सूची के भीतर एक वंश-समूह का परिचय देता है। हिंदी में ‘पुत्रों में से’ यूनानी संरचना और वंशावली-सूची, दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: Βαανεί
  choice: बाअनेई
  rationale: यूनानी रूप के स्वरक्रम को यथासंभव सुरक्षित रखा गया है; अधिक परिचित इब्रानी रूप ‘बानी’ से इसका सामंजस्य नहीं किया गया।
- source_word: Ἰερεμίας
  choice: येरेमियास
  rationale: सूची में यूनानी स्रोत-रूप को स्पष्ट रखने के लिए प्रचलित ‘यिर्मयाह’ के बजाय निकट लिप्यंतरण चुना गया।
- source_word: Μομδείοσ
  choice: मोमदेओस
  rationale: दिए गए यूनानी पाठ की असामान्य वर्तनी को सुधारने या किसी अन्य नाम से मिलाने के बजाय निकट देवनागरी लिप्यंतरण किया गया।
- source_word: Πεδίας
  choice: पेदियास
  rationale: संभावित इब्रानी रूप ‘पदायाह’ से सामंजस्य किए बिना यूनानी नाम का रूप सुरक्षित रखा गया।
- source_word: Καραβασιὼν
  choice: काराबासियोन
  rationale: अस्पष्ट नाम को अनुमान से सामान्य बनाने के बजाय यूनानी अक्षरक्रम का निकट लिप्यंतरण किया गया।
- source_word: Μαμντάναιμος
  choice: मम्न्तानाइमोस
  rationale: नाम के कठिन और असामान्य यूनानी रूप को पारदर्शी ढंग से बनाए रखने के लिए निकट लिप्यंतरण अपनाया गया।
- source_word: Φόσηπος
  choice: फोसेपोस
  rationale: यूनानी स्रोत में उपलब्ध नाम को किसी परिचित बाइबलीय नाम से जोड़ने के बजाय सीधे लिप्यंतरित किया गया।
