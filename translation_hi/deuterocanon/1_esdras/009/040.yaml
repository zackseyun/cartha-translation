base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/040.yaml
  text: And Ezra the chief priest brought the law before all the multitude[a], from man to woman, and all the priests, to hear the law, on the new moon of the seventh month.
translation:
  language: hi
  text: और प्रधान याजक एज्रा व्यवस्था को सारी भीड़ के सामने—पुरुषों से लेकर स्त्रियों तक—और सभी याजकों के सामने लाया, ताकि वे व्यवस्था सुनें, सातवें महीने के नए चाँद के दिन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκόμισεν
  choice: सामने लाया
  rationale: क्रिया का मूल अर्थ ‘लाना/पहुँचाना’ है। सार्वजनिक पाठ के प्रसंग में ‘सामने लाया’ स्वाभाविक है और ‘प्रस्तुत किया’ जैसे अधिक अनुष्ठानिक अर्थ से बचता है।
- source_word: ὁ ἀρχιερεύς
  choice: प्रधान याजक
  rationale: यह यूनानी पद का सीधा और प्रचलित हिन्दी रूप है; इससे पद की प्रमुखता व्यक्त होती है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यूनानी पाठ में केवल νόμος है, ‘व्यवस्था की पुस्तक’ नहीं। इसलिए समानांतर इब्रानी पाठ का विस्तार मुख्य पाठ में नहीं जोड़ा गया।
- source_word: παντὶ τῷ πλήθει
  choice: सारी भीड़
  rationale: πλῆθος एकत्र लोगों के बड़े समूह को सूचित करता है। ‘भीड़’ साधारण आधुनिक हिन्दी में स्पष्ट है और ‘सभा’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: ἀπὸ ἀνθρώπου ἕως γυναικός
  choice: पुरुषों से लेकर स्त्रियों तक
  rationale: यूनानी का लिंग-निर्दिष्ट समावेशी विस्तार स्वाभाविक हिन्दी में सुरक्षित रखा गया है; शाब्दिक एकवचन हिन्दी में असहज होता।
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: सभी याजकों के सामने
  rationale: मुख्य यूनानी साक्ष्य स्पष्ट रूप से ‘सभी याजकों’ को पढ़ता है। ‘के सामने’ पहले आए παντὶ τῷ πλήθει के साथ वाक्यगत संबंध स्पष्ट करता है, जबकि पाठ सुनने का उद्देश्य अगले खंड में आता है।
- source_word: ἀκοῦσαι τὸν νόμον
  choice: ताकि वे व्यवस्था सुनें
  rationale: उद्देश्यवाचक infinitive को स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है; ‘पढ़ा जाना’ पाठ में न होने के कारण नहीं जोड़ा गया।
- source_word: νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: सातवें महीने की अमावस्या का दिन
  rationale: νουμηνία नए चाँद अथवा मासारंभ के दिन को दर्शाता है। ‘अमावस्या का दिन’ हिन्दी में स्पष्ट है और इसे अनावश्यक रूप से ‘पर्व’ नहीं बनाता।
theological_decisions:
- issue: श्रोताओं का लिंग-निर्दिष्ट वर्णन
  choice: पुरुषों से लेकर स्त्रियों तक
  alternative: पुरुष और स्त्रियाँ दोनों
  rationale: चुना हुआ रूप यूनानी की ‘से लेकर ... तक’ वाली व्यापक अभिव्यक्ति को बनाए रखता है और लिंग-सूचना को सामान्यीकृत नहीं करता।
- issue: यूनानी पाठ और नहेमायाह 8:2–3 के इब्रानी समानांतर में श्रोताओं की भिन्न पहचान
  choice: सभी याजक
  alternative: समझ सकने वाले सभी लोग
  rationale: 1 एस्द्रास के लिए प्राथमिक पाठ यूनानी है, जिसमें ἱερεῦσιν, ‘याजकों,’ लिखा है। महत्वपूर्ण इब्रानी भिन्नता को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘व्यवस्था,’ ‘प्रधान याजक’ और ‘अमावस्या’ जैसे परिचित बाइबलीय शब्दों का प्रयोग किया गया है। वाक्य को हिन्दी में स्पष्टता के लिए दो वाक्यों में बाँटा गया है, बिना यूनानी की किसी वास्तविक सूचना को हटाए।
