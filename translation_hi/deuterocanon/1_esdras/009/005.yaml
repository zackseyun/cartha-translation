base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/005.yaml
  text: And those from the tribe of Judah and Benjamin were gathered in Jerusalem within three days; it was the ninth month[a], on the twentieth day of the month.
translation:
  language: hi
  text: और यहूदा और बिन्यामीन के गोत्र के लोग तीन दिन के भीतर यरूशलेम में इकट्ठे हो गए। यह नौवाँ महीना था[a], और महीने का बीसवाँ दिन था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहूदा और बिन्यामीन के साथ ‘गोत्र’ एकवचन में है; आशय उनसे संबंधित लोगों से है। एज्रा 10:9 के इब्रानी समानांतर पाठ में है, ‘यहूदा और बिन्यामीन के सब पुरुष तीन दिन के भीतर यरूशलेम में इकट्ठे हो गए।’
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: इकट्ठे हो गए
  rationale: यूनानी निष्क्रिय रूप लोगों के एकत्र होने या बुलाकर एकत्र किए जाने की गुंजाइश रखता है। स्वाभाविक हिन्दी में यह पदबंध घटना को स्पष्ट रखता है और किसी मानवीय कर्ता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: οἱ ἐκ τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: यहूदा और बिन्यामीन के गोत्र के लोग
  rationale: मूल यूनानी में ‘गोत्र’ एकवचन है, यद्यपि यहूदा और बिन्यामीन दोनों नाम जुड़े हैं। अनुवाद इस असामान्य एकवचन को बनाए रखता है और οἱ को लिंग-विशेष बताए बिना ‘लोग’ के रूप में व्यक्त करता है।
- source_word: ἐν τρισὶν ἡμέραις
  choice: तीन दिन के भीतर
  rationale: सभा के प्रसंग में यह वाक्यांश तीन दिन की समय-सीमा के अंदर पहुँचने का भाव देता है, न कि अनिवार्यतः ठीक तीसरे दिन का।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: εἰς में दिशा का भाव है, पर इकट्ठा होने की पूर्ण घटना के साथ स्वाभाविक हिन्दी ‘यरूशलेम में इकट्ठे हो गए’ कहती है; लोगों का वहाँ पहुँचना प्रसंग से स्पष्ट है।
- source_word: οὗτος ὁ μὴν ἔνατος
  choice: यह नौवाँ महीना था
  rationale: यह अभिव्यक्ति घटना का काल बताती है। ‘यह नौवाँ महीना था’ मूल के संकेतवाचक οὗτος और क्रमसूचक समय-सूचना दोनों को सहज हिन्दी में रखता है।
- source_word: τῇ εἰκάδι τοῦ μηνός
  choice: महीने का बीसवाँ दिन था
  rationale: εἰκάς महीने के बीसवें दिन को सूचित करता है। पूर्ण अभिव्यक्ति आधुनिक पाठक के लिए स्पष्ट है।
