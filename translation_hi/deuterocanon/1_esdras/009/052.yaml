base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/052.yaml
  text: For the day is holy to the Lord[a], and do not be grieved; for the Lord will glorify you.
translation:
  language: hi
  text: क्योंकि यह दिन प्रभु के लिए पवित्र है; शोक मत करो, क्योंकि प्रभु तुम्हें महिमा देगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नहेमायाह 8:10 के इब्रानी समानान्तर का पाठ यहाँ भिन्न है; उसका भाव लगभग यह है, “क्योंकि यहोवा का आनन्द तुम्हारा बल है।” इसके विपरीत 1 एस्द्रास के यूनानी पाठ में है, “क्योंकि प्रभु तुम्हें महिमा देगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγία
  choice: पवित्र
  rationale: यह शब्द अलग ठहराए या समर्पित होने का भाव व्यक्त करता है। ‘पवित्र’ इसका स्वाभाविक और मानक बाइबिलीय हिन्दी रूप है।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: सम्बन्ध अथवा समर्पण सूचित करने वाले यूनानी सम्प्रदान कारक को सहज हिन्दी में ‘प्रभु के लिए’ कहा गया है।
- source_word: μὴ λυπεῖσθε
  choice: शोक मत करो
  rationale: क्रिया दुःख या शोक अनुभव करने को व्यक्त करती है; यह हिन्दी रूप भाव की गम्भीरता बनाए रखता है और बहुवचन सम्बोधन में भी स्वाभाविक है।
- source_word: δοξάσει
  choice: महिमा देगा
  rationale: यूनानी क्रिया महिमा या सम्मान देने के अर्थ-क्षेत्र की है। ‘महिमा देगा’ मूल शब्दावली को सुरक्षित रखता है और इब्रानी समानान्तर से इसका सामंजस्य नहीं करता।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष बहुवचन कर्म है। आधुनिक मानक हिन्दी में ‘तुम्हें’ प्रसंगानुकूल और स्वाभाविक है।
theological_decisions:
- issue: व्यवस्थाविवरणेतर यूनानी प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ ‘प्रभु’ मानक बाइबिलीय पद है और प्रसंग में ‘स्वामी’ चुनने का कोई विशेष कारण नहीं है।
- issue: अन्तिम उपवाक्य का नहेमायाह 8:10 के इब्रानी समानान्तर से सामंजस्य
  choice: यूनानी पाठ के अनुसार ‘प्रभु तुम्हें महिमा देगा’
  alternative: ‘प्रभु का आनन्द तुम्हारा बल है’ जैसे इब्रानी समानान्तर पर आधारित पाठ
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक स्रोत है। यहाँ वह इब्रानी समानान्तर से सार्थक रूप से भिन्न है, इसलिए अन्तर को मुख्य पाठ में मिटाने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘शोक मत करो’ भावनात्मक गम्भीरता बनाए रखता है; वाक्य-विन्यास यूनानी कारणसूचक संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
