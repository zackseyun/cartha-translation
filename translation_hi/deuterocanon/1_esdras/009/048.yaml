base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/048.yaml
  text: Jeshua and Anniuth and Sherebiah[a], Jadinus, Jarsubus, Abteus, Autaias, Maiannas and Kelitas, Azariah, Katezabdus, Annas, Phalias—the Levites—
translation:
  language: hi
  text: येशूअ, अन्नियूत और शरेब्याह[a], यादीनोस, यार्सूबोओस, अब्ताइओस, औताइआस, माइअन्नास और कलेइतास, अज़ारियास, कातेथज़ाब्दोस, अन्नास और फालियास—ये लेवी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में कई नाम यूनानी पाठ-परंपरा में अनिश्चित हैं। इनमें से कुछ नहेमायाह 8:7 की लेवीय नामसूची—जैसे शब्बतै, होदियाह और मासेयाह—से संबंधित हो सकते हैं। मुख्य पाठ में सामान्यतः यूनानी रूप सुरक्षित रखे गए हैं; जहाँ पहचान अधिक स्पष्ट है, वहाँ सेमिटिक रूप अपनाया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦς
  choice: येशू
  rationale: यूनानी रूप Ἰησοῦς है; एज्रा-नहेमायाह के संदर्भ में यह सेमिटिक नाम येशूअ का प्रतिनिधित्व करता है। आधुनिक हिन्दी में स्वाभाविक और ऐतिहासिक रूप से पहचाने जाने योग्य संक्षिप्त रूप चुना गया है।
- source_word: Σαραβίας
  choice: शरेब्याह
  rationale: यह नाम एज्रा-नहेमायाह में ज्ञात इब्रानी नाम शरेब्याह से निकटता से मेल खाता है; इसलिए केवल यूनानी लिप्यंतरण के बजाय संभावित सेमिटिक रूप रखा गया है।
- source_word: Ἀννιοὺθ
  choice: अन्नियूत
  rationale: नाम की पहचान अनिश्चित होने के कारण यूनानी पाठ का निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: Ἰάδεινος
  choice: यादीनोस
  rationale: निश्चित इब्रानी समकक्ष के अभाव में यूनानी रूप को निकटता से सुरक्षित रखा गया है।
- source_word: Ἰαρσούβοος
  choice: यारसूबोओस
  rationale: पाठगत रूप कठिन है; किसी अनुमानित इब्रानी नाम से सामंजस्य बैठाने के बजाय यूनानी साक्ष्य का संरक्षण किया गया है।
- source_word: Ἀβταῖος
  choice: अबताइओस
  rationale: यह संभवतः नहेमायाह 8:7 के किसी नाम से संबंधित है, पर पहचान पर्याप्त निश्चित नहीं है; इसलिए यूनानी-आधारित रूप रखा गया है।
- source_word: Αὐταίας
  choice: औताइआस
  rationale: अनिश्चित नाम का निकट यूनानी-आधारित लिप्यंतरण अपनाया गया है।
- source_word: Μαιάννας
  choice: माइअन्नास
  rationale: स्रोत में नाम का जो रूप है उसे सीधे प्रस्तुत किया गया है, क्योंकि इब्रानी समानांतर से इसकी पहचान निश्चित नहीं होती।
- source_word: Καλείτας
  choice: कलेइतास
  rationale: यूनानी स्वरूप को सुरक्षित रखते हुए नाम को देवनागरी में लिप्यंतरित किया गया है।
- source_word: Ἀζαρίας
  choice: अजरियास
  rationale: प्राथमिक यूनानी पाठ के रूप को रखा गया है; हिन्दी बाइबल परंपरा में संभावित सामान्यीकृत रूप अजर्याह है, पर यहाँ नामसूची की यूनानी बनावट संरक्षित की गई है।
- source_word: Κατέθζαβδος
  choice: कातेथज़ाब्दोस
  rationale: यह रूप संभवतः विकृत या अत्यधिक परिवर्तित है, फिर भी उपलब्ध यूनानी पाठ का निकट लिप्यंतरण अनुमानित ‘योजाबाद’ की अपेक्षा अधिक स्रोत-सम्मत है।
- source_word: Ἄννας
  choice: अन्नास
  rationale: इब्रानी समानांतर के आधार पर किसी दूसरे नाम में बदलने के बजाय प्रत्यक्ष यूनानी रूप रखा गया है।
- source_word: Φαλίας
  choice: फालियास
  rationale: नाम की पहचान अनिश्चित है, इसलिए यूनानी पाठ का निकट लिप्यंतरण किया गया है।
- source_word: οἱ Λευεῖται
  choice: ये लेवीय थे
  rationale: यह पदबंध पहले दिए गए व्यक्तियों की पहचान लेवीयों के रूप में करता है; हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए ‘ये … थे’ जोड़ा गया है।
