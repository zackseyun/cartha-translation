base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/032.yaml
  text: 'And from the sons of Annan: Eliodas[a], Asaiah, Melchiah, Sabbaias, and Simon Chosamaus.'
translation:
  language: hi
  text: 'और अन्नान के पुत्रों में से: एलियोदास[a], असायाह, मेल्कियाह, सब्बायास और शमौन खोसामाउस।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस सूची के कुछ नामों के एज्रा-नहेमायाह की इब्रानी परंपरा में समानांतर रूप मिलते हैं—जैसे अन्नान/हानान और सब्बायास/शब्बतै। मुख्य पाठ 1 एस्द्रास के यूनानी रूपों का अनुसरण करता है; इब्रानी समानांतर का उपयोग केवल जाँच के लिए किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सूची की अगली कड़ी जोड़ने वाला सामान्य संयोजक है।
- source_word: ἐκ τῶν υἱῶν
  choice: के पुत्रों में से
  rationale: वंश-सूची के संदर्भ में ἐκ किसी परिवार-समूह में से व्यक्तियों को चिह्नित करता है; यह हिन्दी में स्वाभाविक और स्रोत-संरचना के निकट है।
- source_word: Ἀννὰν
  choice: अन्नान
  rationale: मुख्य यूनानी साक्ष्य के नाम-रूप का निकट देवनागरी लिप्यंतरण; समानांतर इब्रानी परंपरा का हानान मुख्य पाठ में नहीं अपनाया गया।
- source_word: Ἐλιωδὰς
  choice: एलियोदास
  rationale: यूनानी स्वर-रूप को सीधे और स्पष्ट रूप से दर्शाने वाला लिप्यंतरण।
- source_word: Ἀσαίας
  choice: असायाह
  rationale: यूनानी -ίας के पीछे स्थित परिचित सामी नामांत -याह को पठनीय हिन्दी बाइबलीय रूप में प्रस्तुत किया गया है।
- source_word: Μελχείας
  choice: मेल्कियाह
  rationale: यूनानी ध्वनि-रूप के निकट रहते हुए सामी -याह नामांत को स्वाभाविक हिन्दी रूप दिया गया; अधिक इब्रानीकृत मल्कियाह से बचा गया।
- source_word: Σαββαίας
  choice: सब्बायास
  rationale: यूनानी रूप का निकट लिप्यंतरण किया गया है; इब्रानी समानांतर शब्बतै को मुख्य पाठ पर आरोपित नहीं किया गया।
- source_word: Σίμων
  choice: शमौन
  rationale: यह यूनानी Σίμων का हिन्दी बाइबल पाठकों में परिचित और स्वाभाविक नाम-रूप है।
- source_word: Χοσάμαος
  choice: खोसामाउस
  rationale: यह दुर्लभ और कठिन नाम है; बाहरी नियंत्रण सीमित होने के कारण यूनानी अक्षर और स्वर-क्रम का पारदर्शी लिप्यंतरण किया गया है।
