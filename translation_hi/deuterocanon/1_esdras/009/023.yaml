  register: आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुकूल हिन्दी। सभी व्यक्तिनाम प्राथमिक यूनानी पाठ के आधार पर देवनागरी में दिए गए हैं; केवल Ἰούδας के लिए हिन्दी बाइबल में प्रचलित ‘यहूदा’ रखा गया है। विरामचिह्नों से सूची और कोनोस-कलीताइस की पहचान स्पष्ट की गई है।
