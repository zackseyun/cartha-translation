base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/023.yaml
  text: 'And from the Levites: Jozabad[a], Seneis, Konos (that is, Kalitais), and Pathaios[c][b], and Judas and Jonas.'
translation:
  language: hi
  text: 'और लेवियों में से: योज़ाबाद, सेनेइस, कोनोस—अर्थात् कलीताइस[a]—और पथाइओस[b], और यहूदा और योनास।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अधिक शाब्दिक अनुवाद “यह कलीताइस है” हो सकता है; सम्भवतः कलीताइस, कोनोस का दूसरा या स्पष्टकारी नाम है।
    reason: alternative_reading
  - marker: b
    text: कुछ दुर्लभ नामों की ठीक वर्तनी थोड़ी अनिश्चित है। समानांतर सामी परंपरा में इनके अन्य रूप मिल सकते हैं, पर मुख्य पाठ यहाँ यूनानी साक्ष्य का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν Λευειτῶν
  choice: लेवियों में से
  rationale: ἐκ का अंशसूचक भाव बनाए रखते हुए यह बड़े नाम-सूची के भीतर लेवियों के उपसमूह का स्वाभाविक हिन्दी परिचय है।
- source_word: Ἰωζάβαδος
  choice: योज़ाबाद
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण; आरम्भिक Ἰω- और मध्य ζ ध्वनि को यथासंभव दर्शाता है।
- source_word: Σενεεὶς
  choice: सेनेइस
  rationale: दुर्लभ यूनानी व्यक्तिनाम का सीधा लिप्यंतरण; स्रोत में वर्तनी-संबंधी हल्की अनिश्चितता है।
- source_word: Κῶνος
  choice: कोनोस
  rationale: यूनानी रूप का सीधा देवनागरी लिप्यंतरण, बिना लैटिनीकरण के।
- source_word: οὗτος Καλιταίς
  choice: अर्थात् कलीताइस
  rationale: यह पदबंध पिछले व्यक्ति की वैकल्पिक अथवा स्पष्टकारी पहचान देता प्रतीत होता है; ‘अर्थात्’ उस संबंध को सहज हिन्दी में रखता है, जबकि पादटिप्पणी व्याकरणिक अस्पष्टता सुरक्षित रखती है।
- source_word: Παθαῖος
  choice: पथाइओस
  rationale: यूनानी साक्ष्य को प्राथमिक मानकर नाम का सीधा लिप्यंतरण किया गया है; किसी अनुमानित सामी रूप को मुख्य पाठ में नहीं लाया गया।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: हिन्दी बाइबलीय परंपरा में इस नाम का परिचित रूप ‘यहूदा’ है; यहाँ यह व्यक्तिनाम है।
- source_word: Ἰωνάς
  choice: योनास
  rationale: प्राथमिक यूनानी रूप Ἰωνάς का निकट लिप्यंतरण; ‘योना’ सामी/इब्रानी रूप को अधिक सीधे दर्शाता, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
