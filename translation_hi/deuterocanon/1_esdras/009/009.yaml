  text: and do his will[a], and separate yourselves from the nations of the land and from the foreigners.
translation:
  language: hi
  text: और उसकी इच्छा पूरी करो[a], और देश की जातियों तथा परदेशियों से अपने आप को अलग कर लो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 10 के इब्रानी समानांतर पाठ में परदेशी स्त्रियों या पत्नियों का अधिक स्पष्ट उल्लेख है; यहाँ 1 एस्द्रास का यूनानी पाठ व्यापक शब्द ‘परदेशियों’ का प्रयोग करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: पूरी करो
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; ‘इच्छा’ के साथ ‘पूरी करो’ सामान्य प्रयोग है।
- source_word: τὸ θέλημα αὐτοῦ
  choice: उसकी इच्छा
  rationale: यूनानी पद का निकट और धर्मवैचारिक रूप से तटस्थ अनुवाद; संदर्भ में संकेत परमेश्वर की ओर है, पर सर्वनाम की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: χωρίσθητε
  choice: अपने आप को अलग कर लो
  rationale: मध्य/कर्मवाच्य आज्ञार्थक रूप को जानबूझकर अलग होने की आत्मवाचक आज्ञा के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῶν ἐθνῶν τῆς γῆς
  choice: देश की जातियों से
  rationale: γῆ यहाँ स्थानीय भूभाग/देश है और ἔθνη आसपास के समुदायों को दर्शाता है; ‘जातियाँ’ मूल की व्यापकता बनाए रखता है।
- source_word: ἀπὸ τῶν ἀλλογενῶν
  choice: परदेशियों से
  rationale: ἀλλογενεῖς दूसरे मूल या बाहरी समुदाय के लोगों के लिए व्यापक पद है; यूनानी पाठ इसे केवल स्त्रियों तक सीमित नहीं करता।
theological_decisions:
- issue: एज्रा 10 के इब्रानी समानांतर में परदेशी स्त्रियों/पत्नियों की विशिष्टता, जबकि 1 एस्द्रास का यूनानी पाठ व्यापक है
  choice: मुख्य पाठ में यूनानी के अनुसार ‘देश की जातियों तथा परदेशियों’ का व्यापक अर्थ रखा गया।
  alternative: ‘देश के लोगों और परदेशी स्त्रियों से अपने आप को अलग कर लो।’
  rationale: 1 एस्द्रास के लिए यूनानी पाठ प्राथमिक साक्ष्य है। इब्रानी समानांतर संदर्भ स्पष्ट करता है, पर यूनानी के व्यापक ἀλλογενῶν को बिना पाठीय आधार के केवल स्त्रियों तक सीमित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण आज्ञार्थक शैली अपनाई गई है। ‘परदेशी’ मूल के व्यापक अर्थ को बनाए रखता है और ‘विदेशी स्त्रियाँ’ जैसी संदर्भ-आधारित संकीर्णता को मुख्य पाठ में नहीं लाता।
