base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/047.yaml
  text: And all the assembly cried out, “Amen, amen,” and lifting up their hands, they fell to the ground and worshiped God.
translation:
  language: hi
  text: और सारी सभा ने पुकारकर कहा, “आमीन, आमीन।” और अपने हाथ ऊपर उठाकर वे भूमि पर गिर पड़े और परमेश्वर की आराधना की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: पुकारकर कहा
  rationale: यह क्रिया स्पष्ट और जोरदार सार्वजनिक उच्चारण को व्यक्त करती है। ‘पुकारकर कहा’ सामूहिक प्रत्युत्तर की प्रबलता रखता है, पर उसे अनावश्यक रूप से चीखना नहीं बनाता।
- source_word: πᾶν τὸ πλῆθος
  choice: सारी सभा
  rationale: πλῆθος का मूल भाव जनसमूह है; उपासना के इस प्रसंग में ‘सभा’ एकत्र लोगों को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है, और ‘सारी’ πᾶν को सुरक्षित रखता है।
- source_word: Ἀμήν, ἀμήν
  choice: आमीन, आमीन
  rationale: यहाँ यह सभा का उपासना-संबंधी प्रत्युत्तर है। प्रचलित लिप्यंतरण उसके धार्मिक और सामूहिक कार्य को बनाए रखता है।
- source_word: ἄραντες ἄνω τὰς χεῖρας
  choice: अपने हाथ ऊपर उठाए
  rationale: यह अनुवाद हाथ उठाने की क्रिया और ἄνω में निहित ऊपर की दिशा, दोनों को सहज हिन्दी में स्पष्ट करता है।
- source_word: προσπεσόντες ἐπὶ τὴν γῆν
  choice: भूमि पर गिर पड़े
  rationale: यह वाक्यांश श्रद्धापूर्वक भूमि पर गिरने की शारीरिक क्रिया बताता है। आगे ‘आराधना की’ उस क्रिया का धार्मिक अर्थ स्पष्ट करता है।
- source_word: προσεκύνησαν
  choice: आराधना की
  rationale: क्योंकि क्रिया का लक्ष्य परमेश्वर हैं, ‘आराधना की’ केवल झुकने की मुद्रा से आगे जाकर स्रोत में उपस्थित उपासना के धार्मिक अर्थ को सुरक्षित रखता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर की
  rationale: हिन्दी बाइबलीय शैली में इस संदर्भ में ‘परमेश्वर’ स्वाभाविक और स्पष्ट है; ‘आराधना करना’ के साथ सम्बन्धकारक रचना सहज है।
theological_decisions:
- issue: भूमि पर गिरने और προσκυνέω के परस्पर सम्बंध का अनुवाद
  choice: शारीरिक क्रिया को ‘भूमि पर गिर पड़े’ और धार्मिक क्रिया को अलग से ‘परमेश्वर की आराधना की’ कहना
  alternative: ‘परमेश्वर के सामने दण्डवत हुए’
  rationale: यूनानी पाठ शारीरिक रूप से गिरने और परमेश्वर की उपासना करने, दोनों को व्यक्त करता है। दोनों को अलग रखना किसी एक अर्थ को दूसरे में विलीन होने से बचाता है।
- issue: यूनानी मुख्य साक्ष्य और दिए गए अनुमानित मसोराई समानांतर का उपयोग
  choice: मुख्य पाठ को पूर्णतः दिए गए यूनानी वाक्य पर आधारित रखना
  alternative: मसोराई समानांतर से पढ़ने और समझाने की शब्दावली जोड़ना
  rationale: दिया गया इब्रानी समानांतर इस पद की घटना से मेल नहीं खाता; इसलिए उससे कोई सामग्री आयात करना पाठ को बदल देता। यूनानी साक्ष्य स्पष्ट और उच्च-विश्वसनीयता वाला है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक उपासना के प्रसंग के अनुकूल। ‘सभा’, ‘आमीन’ और ‘आराधना’ परिचित बाइबलीय शब्द हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है।
