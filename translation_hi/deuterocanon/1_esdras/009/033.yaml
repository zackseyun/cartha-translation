base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/033.yaml
  text: 'And from the sons of Asom: Maltannaios[a], Mattathias, Sabannaious, Eleiphalat, Manasseh[b], and Shimei.'
translation:
  language: hi
  text: 'और आसोम के पुत्रों में से ये थे: माल्तन्नायोस[a], मत्तथियास, सबन्नायूस, एलीफलात, मनश्शे[b] और शिमी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम ‘आसोम’ है; इब्रानी समानांतर में इसका संभावित समकक्ष ‘हाशूम’ है।
    reason: alternative_reading
  - marker: b
    text: इस सूची के कई नामों के यूनानी रूप इब्रानी समानांतर परंपरा से ठीक-ठीक मेल नहीं खाते; मुख्य पाठ 1 एस्द्रास के यूनानी साक्ष्य का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: और ... के पुत्रों में से
  rationale: यह वाक्यांश सूची में एक और कुल-समूह का परिचय देता है। हिन्दी में ‘पुत्रों में से’ स्वाभाविक है और यूनानी ἐκ τῶν υἱῶν का अर्थ बनाए रखता है।
- source_word: Ἀσόμ
  choice: आसोम
  rationale: मुख्य यूनानी साक्ष्य के नाम-रूप Ἀσόμ का देवनागरी लिप्यंतरण किया गया है; इसे इब्रानी समानांतर के ‘हाशूम’ से चुपचाप समरूप नहीं किया गया।
- source_word: Μαλτανναῖος
  choice: माल्तन्नायोस
  rationale: यूनानी नाम-रूप को स्रोत-प्रधानता के अनुसार लिप्यंतरित किया गया है।
- source_word: Ματταθίας
  choice: मत्तथियास
  rationale: यूनानी Ματταθίας का निकट और हिन्दी-पठनीय लिप्यंतरण।
- source_word: Σαβανναιούς
  choice: सबन्नायूस
  rationale: इब्रानी परंपरा के किसी संभावित समकक्ष से मिलाने के बजाय असामान्य यूनानी नाम-रूप सुरक्षित रखा गया है।
- source_word: Ἐλειφαλὰτ
  choice: एलीफलात
  rationale: यूनानी रूप का सहज देवनागरी लिप्यंतरण; इब्रानीकृत रूप थोपने से बचा गया है।
- source_word: Μανασση
  choice: मनश्शे
  rationale: यह नाम हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य है और यूनानी Μανασση के पीछे स्थित सामी नाम को स्वाभाविक रूप में प्रस्तुत करता है।
- source_word: Σεμεεί
  choice: शिमी
  rationale: यूनानी Σεμεεί के लिए इब्रानी समानांतर से पुष्ट, हिन्दी में परिचित बाइबलीय नाम-रूप अपनाया गया है।
