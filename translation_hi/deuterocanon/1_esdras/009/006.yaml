base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/006.yaml
  text: And the whole assembly sat together in the open court of the temple[b][a], trembling because of the present storm.
translation:
  language: hi
  text: और पूरी सभा मन्दिर के खुले प्रांगण[a] में एक साथ बैठ गई और उस समय छाए तूफ़ानी मौसम[b] के कारण काँप रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मन्दिर के चौड़े स्थान में’ अथवा ‘पवित्रस्थान के विशाल क्षेत्र में।’ यूनानी εὐρυχώρῳ कुछ असामान्य है और मन्दिर-परिसर के भीतर किसी खुले स्थान को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस समय के जाड़े के कारण’ अथवा ‘उस समय उन पर आ पड़े खराब मौसम के कारण।’ यूनानी χειμών का अर्थ ‘जाड़ा’ या ‘तूफ़ान/खराब मौसम’ हो सकता है; यहाँ प्रसंग तूफ़ानी मौसम के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκάθισαν
  choice: एक साथ बैठ गई
  rationale: संयुक्त क्रिया का ठोस अर्थ है कि एकत्र लोग साथ बैठ गए; हिन्दी में ‘सभा’ के साथ एकवचन स्त्रीलिंग क्रिया स्वाभाविक है।
- source_word: πᾶν τὸ πλῆθος
  choice: पूरी सभा
  rationale: यह पद एकत्र जनसमूह को दर्शाता है। औपचारिक सामुदायिक प्रसंग में ‘पूरी सभा’ सहज और गरिमापूर्ण है।
- source_word: ἐν τῇ εὐρυχώρῳ
  choice: खुले प्रांगण में
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण किसी चौड़े या खुले स्थान का संकेत देता है; मन्दिर के प्रसंग में ‘खुला प्रांगण’ सम्भावित स्थापत्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ ἱεροῦ
  choice: मन्दिर के
  rationale: ἱερόν प्रायः पूरे मन्दिर-परिसर अथवा पवित्र क्षेत्र को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं; ‘प्रांगण’ के साथ ‘मन्दिर’ यह व्यापक अर्थ बनाए रखता है।
- source_word: τρέμοντες
  choice: काँप रही थी
  rationale: मूल कृदन्त की शारीरिक काँपने वाली छवि सुरक्षित रखी गई है। निकटवर्ती मौसम-सूचक पद के कारण यहाँ ठंड या तूफ़ानी मौसम प्रमुख कारण है, यद्यपि भय की छाया पूरी तरह असम्भव नहीं है।
- source_word: τὸν ἐνεστῶτα χειμῶνα
  choice: उस समय छाए तूफ़ानी मौसम के कारण
  rationale: χειμών का अर्थ जाड़ा, तूफ़ान या खराब मौसम हो सकता है, और ἐνεστῶτα उस समय उपस्थित या आ पड़े मौसम को दर्शाता है। प्रसंगानुसार ‘तूफ़ानी मौसम’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
