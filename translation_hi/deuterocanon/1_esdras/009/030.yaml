base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/030.yaml
  text: 'And from the sons of Mani: Olamus[a], Mamuchus, Jedaeus, Jasubus, Asael[b], and Jeremoth.'
translation:
  language: hi
  text: 'और मानी[a] के पुत्रों में से: ओलामोस, मामूखोस, इदाइओस, यासूबोस, असाएल[b] और येरेमोथ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘मानी’ है; एज्रा की इब्रानी समानांतर सूची में इससे सामान्यतः ‘बानी’ का संबंध माना जाता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ के कई नाम समानांतर सूची में पाए जाने वाले इब्रानी नामों से संबंधित हो सकते हैं, पर इस अनुवाद में मुख्य स्रोत के रूप में 1 एस्द्रास के यूनानी नाम-रूपों का अनुसरण किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: और … के पुत्रों में से
  rationale: यह पद पिछली सूची में एक और वंश-समूह जोड़ता है। ‘पुत्रों में से’ यूनानी सदस्यता-सूचक रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Μανί
  choice: मानी
  rationale: मुख्य पाठ स्वेटे के यूनानी रूप Μανί का लिप्यंतरण करता है; इसे इब्रानी समानांतर के ‘बानी’ से चुपचाप नहीं मिलाया गया।
- source_word: Ὤλαμος
  choice: ओलामोस
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण है; संभावित इब्रानी समकक्ष के अनुसार रूप बदलने से बचा गया है।
- source_word: Μάμουχος
  choice: मामूखोस
  rationale: यूनानी Μάμουχος का निकट और हिन्दी-पाठक के लिए उच्चारणयोग्य लिप्यंतरण है।
- source_word: Ἰεδαῖος
  choice: इदायोस
  rationale: यूनानी नाम का सीधा लिप्यंतरण किया गया है; समानांतर सूची के आधार पर किसी अनुमानित इब्रानी रूप को मुख्य पाठ में नहीं रखा गया।
- source_word: Ἰάσουβος
  choice: यासूबोस
  rationale: यूनानी रूप की आरम्भिक ध्वनि और पूर्ण नाम को देवनागरी में सुरक्षित रखा गया है।
- source_word: Ἀσάηλος
  choice: असाएल
  rationale: यूनानी Ἀσάηλος का पठनीय देवनागरी रूप है, जिसमें यूनानी नामकारक प्रत्यय को हिन्दी नाम में नहीं जोड़ा गया।
- source_word: Ἰερεμώθ
  choice: येरेमोथ
  rationale: यूनानी नाम का सीधा, उच्चारणयोग्य देवनागरी लिप्यंतरण है।
