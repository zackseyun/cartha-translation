base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/014.yaml
  text: Jonathan son of Azael and Hezekiah son of Thocanus accepted this[c][b][a], and Mosollamus and Levi and Sabbataeus joined in deciding with them.
translation:
  language: hi
  text: अजाएल के पुत्र योनातान और थोकानुस के पुत्र हिजकिय्याह ने इन बातों को स्वीकार किया[c], और मोसोल्लामुस, लेवी और सब्बातायुस उनके साथ निर्णय करने में सम्मिलित हुए[b][a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ के यूनानी नाम एज्रा 10 के अनुमानित इब्रानी समानांतर से भिन्न हैं; जैसे, मोसोल्लामुस के लिए मशुल्लाम और सब्बातायुस के लिए शब्बतै रूप मिलते हैं।
    reason: alternative_reading
  - marker: b
    text: ‘उनके साथ निर्णय करने में सम्मिलित हुए’ के लिए प्रयुक्त यूनानी क्रिया दुर्लभ है। इसका अर्थ यह भी हो सकता है कि इन लोगों ने सह-निर्णायकों के रूप में काम किया या उनके साथ समर्थनकारी निर्णय दिया।
    reason: lexical_alternative
  - marker: c
    text: यहाँ 1 एस्द्रास का यूनानी पाठ मसोरेटिक समानांतर के शब्दों से निकटता से मेल नहीं खाता; इसलिए नाम और वाक्य-विन्यास मुख्यतः यूनानी साक्ष्य पर आधारित हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξαντο κατὰ ταῦτα
  choice: इस व्यवस्था को स्वीकार किया
  rationale: मध्यवाची क्रिया ἐπιδέχομαι यहाँ किसी प्रस्तावित प्रबंध को स्वीकार करने या अपने ऊपर लेने का भाव देती है; κατὰ ταῦτα पिछले प्रबंध के अनुरूपता का संकेत करता है। ‘इस व्यवस्था को स्वीकार किया’ दोनों भावों को सहज हिन्दी में रखता है।
- source_word: συνεβράβευσαν αὐτοῖς
  choice: उनके साथ निर्णय करने में सम्मिलित हुए
  rationale: दुर्लभ क्रिया सामूहिक रूप से निर्णय, मध्यस्थता या मूल्यांकन करने का संकेत देती है। यह अनुवाद न्यायिक-सहयोग का भाव रखता है, पर किसी निश्चित तकनीकी पद का दावा नहीं करता।
- source_word: Ἰωνάθας Ἀζαήλου
  choice: अजाएल के पुत्र योनातान
  rationale: यूनानी संबंधकारक को वंशसूचक अर्थ में ‘के पुत्र’ से व्यक्त किया गया है और नामों को यूनानी साक्ष्य के निकट देवनागरी रूप दिया गया है।
- source_word: Ἐξειας Θοκάνου
  choice: थोकानुस के पुत्र हिजकिय्याह
  rationale: Ἐξειας परिचित सामी नाम हिजकिय्याह के अनुरूप है; Θοκάνου का कोई सुनिश्चित प्रचलित हिन्दी समतुल्य न होने से यूनानी-आधारित लिप्यंतरण रखा गया है।
- source_word: Μοσόλλαμος
  choice: मोसोल्लामुस
  rationale: प्राथमिक यूनानी पाठ के नामरूप को मुख्य पाठ में सुरक्षित रखा गया है; अनुमानित इब्रानी समानांतर का रूप पादटिप्पणी में दिया गया है।
- source_word: Λευεὶς
  choice: लेवी
  rationale: यहाँ रूप एकवचन है और सूची में व्यक्तिगत नाम के रूप में आता है, न कि ‘लेवियों’ के सामुदायिक पदनाम के रूप में।
- source_word: Σαββαταῖος
  choice: सब्बातायुस
  rationale: प्राथमिक यूनानी साक्ष्य के नामरूप का देवनागरी लिप्यंतरण किया गया है; इब्रानी समानांतर का नाम पादटिप्पणी में रखा गया है।
