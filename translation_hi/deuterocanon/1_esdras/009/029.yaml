base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/029.yaml
  text: 'And from the sons of Bebai: Joannes and Ananias and Zabdos and Emathis[a].'
translation:
  language: hi
  text: 'और बेबाई के पुत्रों में से: योआन्नेस, अननियास, ज़ाब्दोस और एमाथिस।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लगभग समानांतर मसोरेटी पाठ में इनमें से कुछ नाम अलग इब्रानी रूपों से मेल खा सकते हैं; यहाँ 1 एस्द्रास का अनुवाद यूनानी साक्ष्य से किया गया है, जिसमें नाम योआन्नेस, अननियास, ज़ाब्दोस और एमाथिस हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Βηβαί
  choice: और बेबाई के पुत्रों में से
  rationale: ἐκ समूह में से व्यक्तियों को चुनकर बताता है, और वंशावली-सूची में υἱῶν का अर्थ औपचारिक रूप से ‘पुत्रों’ है, यद्यपि व्यापक अर्थ में वंशज भी हो सकता है। हिन्दी में यह संरचना यूनानी पाठ के निकट और स्वाभाविक है।
- source_word: Ἰωάννης
  choice: योआन्नेस
  rationale: यूनानी नाम Ἰωάννης का देवनागरी लिप्यंतरण किया गया है; इब्रानी-संगत रूप अपनाकर यूनानी साक्ष्य को बदला नहीं गया।
- source_word: Ἁνανίας
  choice: अननियास
  rationale: यह यूनानी रूप का सीधा और हिन्दी-पाठक के लिए स्पष्ट लिप्यंतरण है; ‘हनन्याह’ जैसा रूप इब्रानी परंपरा को प्राथमिकता देता।
- source_word: Ζάβδος
  choice: ज़ाब्दोस
  rationale: Ζάβδος को उसके प्रमाणित यूनानी रूप के अनुसार लिप्यंतरित किया गया है; किसी अनुमानित इब्रानी समानार्थी नाम से नहीं बदला गया।
- source_word: Ἐμαθίς
  choice: एमाथिस
  rationale: दुर्लभ नाम Ἐμαθίς के स्पष्ट यूनानी पाठ का सावधानीपूर्वक देवनागरी लिप्यंतरण किया गया है।
