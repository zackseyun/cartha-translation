base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/053.yaml
  text: And the Levites kept instructing all the people[a], saying, “This day is holy; do not grieve.”
translation:
  language: hi
  text: और लेवी सभी लोगों को निर्देश देते रहे। वे कहते थे, “यह दिन पवित्र है; दुःखी मत हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उदास मत हो” अथवा “शोक मत करो।”
    reason: ग्रीक क्रिया λυπέω दुःखी या उदास होने और शोक करने—दोनों भाव व्यक्त कर सकती है।
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: लेवी
  rationale: बाइबलीय हिन्दी में इस याजकीय-वंशीय समूह के लिए प्रचलित और स्वाभाविक नाम।
- source_word: ἐκέλευον
  choice: समझाते रहे
  rationale: अपूर्ण भूतकाल निरन्तर या बार-बार की गई क्रिया दर्शाता है। प्रसंग में यह लोगों को निर्देश देकर ढाढ़स बँधाने का भाव देता है; इसलिए कठोर ‘आज्ञा देते रहे’ की अपेक्षा ‘समझाते रहे’ अधिक स्वाभाविक है।
- source_word: τῷ δήμῳ πάντα
  choice: सारे लोगों को
  rationale: δήμῳ का अर्थ जनसमुदाय या लोग है, और πάντα यहाँ व्यापकता/समग्रता का भाव देता है। हिन्दी में ‘सारे लोगों को’ इस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: λέγοντες
  choice: वे कहते थे
  rationale: यह कृदन्त आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। अलग वाक्य में यह रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: Ἡ ἡμέρα αὕτη ἁγία
  choice: यह दिन पवित्र है
  rationale: यह अनुवाद αὕτη के संकेतवाचक बल और ἁγία के धार्मिक अर्थ दोनों को सीधे बनाए रखता है।
- source_word: μὴ λυπεῖσθε
  choice: दुःखी मत हो
  rationale: मध्य/कर्मवाच्य रूप यहाँ दुःख या शोक की अवस्था में होने को दर्शाता है। ‘दुःखी मत हो’ संक्षिप्त, सहज और अर्थ की व्यापकता बनाए रखने वाला अनुवाद है।
