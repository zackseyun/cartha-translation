  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप। पद मूल यूनानी में पिछले पद पर निर्भर खंड है, इसलिए स्वतंत्र पूर्ण वाक्य बनाने हेतु कोई अतिरिक्त कर्ता या क्रिया नहीं जोड़ी गई।
