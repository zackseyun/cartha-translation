  text: the elders and the judges of each place[b][a], until the anger of the Lord over this matter is turned away from us.
translation:
  language: hi
  text: हर स्थान के बुज़ुर्गों और न्यायियों को[a], जब तक इस मामले को लेकर प्रभु का क्रोध हमसे दूर न हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यह पिछले पद पर निर्भर वाक्य-खंड है; अनुवाद में भी पिछले पद से निहित क्रिया को आगे समझा जाना है। ‘इस मामले को लेकर’ का अनुवाद ‘इस मामले के कारण’ या ‘इस मामले के संबंध में’ भी किया जा सकता है।
    reason: वाक्य-संरचना और शाब्दिक विकल्प
lexical_decisions:
- source_word: ἑκάστου τόπου
  choice: हर स्थान के
  rationale: यह संबंधसूचक पद ‘पुरनियों’ और ‘न्यायियों’ दोनों को निर्धारित करता है और स्थान को नगर या जिले के रूप में अनावश्यक रूप से सीमित नहीं करता।
- source_word: πρεσβυτέρους
  choice: पुरनियों
  rationale: प्रशासनिक संदर्भ में यह मान्य स्थानीय वरिष्ठ अगुवों का पदसूचक शब्द है, केवल अधिक आयु वाले पुरुषों का नहीं।
- source_word: κριτάς
  choice: न्यायियों
  rationale: कानूनी और प्रशासनिक प्रसंग में सीधा पदनाम उपयुक्त है।
- source_word: ἕως τοῦ λῦσαι
  choice: जब तक ... दूर न हो जाए
  rationale: क्रोध के साथ λῦσαι का शाब्दिक ‘खोलना’ अस्वाभाविक होगा; यह वाक्यांश क्रोध के हटने अथवा टलने का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: ὀργὴν Κυρίου
  choice: प्रभु का क्रोध
  rationale: ὀργή की गंभीरता को ‘क्रोध’ स्पष्ट रूप से व्यक्त करता है और κύριος के लिए ‘प्रभु’ मानक श्रद्धापूर्ण रूप है।
- source_word: ἀφʼ ἡμῶν
  choice: हमसे दूर
  rationale: ἀπό समुदाय से अलग होने या हटने का भाव देता है; हिन्दी में क्रोध के साथ ‘हमसे दूर’ स्वाभाविक है।
- source_word: τοῦ πράγματος τούτου
  choice: इस मामले के कारण
  rationale: संकुचित यूनानी संबंधसूचक पद यहाँ प्रभु के क्रोध के अवसर या कारण को इंगित करता है; ‘के कारण’ प्रसंगानुकूल है, यद्यपि ‘इस मामले के संबंध में’ भी संभव है।
theological_decisions:
- issue: व्यवस्थाविवरणेतर यूनानी संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ इस्राएल के परमेश्वर के प्रति श्रद्धापूर्ण संकेत है; ‘प्रभु’ स्वाभाविक और स्थापित हिन्दी रूप है।
- issue: दैवी अप्रसन्नता के लिए ὀργή की तीव्रता
  choice: क्रोध
  alternative: रोष
  rationale: ‘क्रोध’ सामान्य पाठक के लिए स्पष्ट रहते हुए दैवी न्याय की गंभीरता बनाए रखता है।
- issue: τοῦ πράγματος τούτου का संबंध
  choice: इस मामले के कारण
  alternative: इस मामले के संबंध में
  rationale: प्रसंग इसे क्रोध का कारण समझने का समर्थन करता है, पर यूनानी संबंधसूचक रचना संक्षिप्त है; इसलिए वैकल्पिक संबंध फुटनोट में सुरक्षित रखा गया है।
