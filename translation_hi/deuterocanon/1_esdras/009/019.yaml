  register: आधुनिक, गरिमापूर्ण और सूची-अनुकूल हिन्दी। व्यक्तिनामों में प्राथमिक यूनानी साक्ष्य को आधार बनाया गया है। कठिन वंशावली-संबंध को मुख्य पाठ में सहज बनाया गया है, पर वास्तविक पाठगत तनाव पादटिप्पणी में सुरक्षित रखा गया है।
