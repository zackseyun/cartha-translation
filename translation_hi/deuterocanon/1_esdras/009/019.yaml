base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/019.yaml
  text: 'From the sons of Jeshua son of Jozadak and his brothers: Maelas[a], Eleazar, Joribus, and Joadanus.'
translation:
  language: hi
  text: 'योसादाक के पुत्र येशूअ और उसके भाइयों के पुत्रों में से: माएलास[a], एलीआज़र, योरीबोस और योआदानोस।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में यहाँ माएलास, योरीबोस और योआदानोस नाम हैं। एज्रा 10:18, 20–21 की लगभग समानांतर इब्रानी सूची में संबंधित नाम भिन्न हैं; यह 1 एस्द्रास और मसोराई इब्रानी पाठ की इन सूचियों के बीच के स्वतंत्र संबंध को दर्शाता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: के पुत्रों ... में से
  rationale: यह पद एक बड़ी सूची के भीतर से एक समूह का परिचय देता है; ‘में से’ यूनानी ἐκ का स्वाभाविक हिन्दी प्रतिरूप है।
- source_word: Ἰησοῦ τοῦ Ἰωσεδὲκ
  choice: येशूअ
  rationale: इस पद में यूनानी संबंधकारक पदबंध का शाब्दिक अर्थ ‘योसेदेक के येशूअ’ है, पर सूची की संरचना और एज्रा 10:18 के निकट समानांतर में येशूअ स्वयं योसादाक का पुत्र नहीं, बल्कि योसादाक का पुत्र योशूअ/येशूअ का वंशज है। इसलिए असंगत ‘योसेदेक के पुत्र येशूअ’ को मुख्य पाठ में नहीं जोड़ा गया; इस कठिनाई को टिप्पणी में बताया गया है।
- source_word: τῶν ἀδελφῶν αὐτοῦ
  choice: और उसके भाइयों
  rationale: एकवचन αὐτοῦ का स्वाभाविक पूर्वपद येशूअ है; पुरुष याजकीय सूची के संदर्भ में ‘भाइयों’ उपयुक्त है।
- source_word: Μαεήλας
  choice: माएलास
  rationale: स्वीटे के यूनानी पाठ में प्राप्त नाम का देवनागरी लिप्यंतरण किया गया है; इसे इब्रानी समानांतर के भिन्न नाम से नहीं मिलाया गया।
- source_word: Ἐλεάζαρος
  choice: एलीआज़र
  rationale: प्रचलित बाइबलीय हिन्दी नाम-रूप अपनाया गया है।
- source_word: Ἰώριβος
  choice: योरीबोस
  rationale: यूनानी रूप का निकट देवनागरी लिप्यंतरण है; इब्रानी समानांतर के यारीब से सामंजस्य नहीं बैठाया गया।
- source_word: Ἰωάδανος
  choice: योआदानोस
  rationale: यूनानी पाठ में प्राप्त नाम को सीधे लिप्यंतरित किया गया है, क्योंकि समानांतर इब्रानी सूची के साथ नामों और क्रम में पर्याप्त अंतर है।
